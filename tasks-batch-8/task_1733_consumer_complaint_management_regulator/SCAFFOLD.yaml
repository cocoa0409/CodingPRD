    output: EscalationCase
    side_effects: ["status -> RESOLVED", "increments EscalationCase.version by 1", "Append IntakeEvent(ESCALATION_RESOLVED)"]

  - method: POST
    path: "/complaint-office/escalations/{escalationId}/dismiss"
    description: "RAISED -> DISMISSED"
    roles: [ExecutiveReviewer]
    code: 200
    input: []
    output: EscalationCase
    side_effects: ["status -> DISMISSED", "increments EscalationCase.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role missing, or role not declared" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role authenticated but not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body-referenced business code does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid field, invalid enum member, negative amount, empty response_text, or window_end_at <= window_start_at" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Target resource is in a from-state for which the transition is not declared" }
  - { id: ERR_PRODUCT_FROZEN, http: 409, condition: "Complaint intake on a product whose posture is FROZEN" }
  - { id: ERR_CATEGORY_RETIRED, http: 409, condition: "Assignment of a retired TaxonomyCategory at intake or recode" }
  - { id: ERR_TEMPLATE_NOT_ACTIVE, http: 409, condition: "response_template_key references a template not in ACTIVE status" }
  - { id: ERR_TEMPLATE_MISMATCH, http: 409, condition: "Template channel_code or category_code does not equal the complaint's" }
  - { id: ERR_TEMPLATE_IN_USE, http: 409, condition: "Retire attempted while a complaint in RESPONSE_DRAFTED or RESPONSE_QA references the template" }
  - { id: ERR_RCA_REQUIRED, http: 409, condition: "draft_response without a COMPLETED RCA" }
  - { id: ERR_RCA_DEADLINE_PASSED, http: 409, condition: "RCA completion after complaint.received_at + 30 calendar days (deadline instant itself remains valid)" }
  - { id: ERR_QA_PASS_REQUIRED, http: 409, condition: "resolve without a COMPLETED PASS QualityReview" }
  - { id: ERR_ESCALATION_OPEN, http: 409, condition: "resolve while an EscalationCase is RAISED or ACKNOWLEDGED" }
  - { id: ERR_SOD_SELF_REVIEW, http: 409, condition: "QAReviewer completing a review on a complaint whose owner_user_id equals the acting user" }
  - { id: ERR_SOD_SELF_APPROVAL, http: 409, condition: "RemediationApprover approving or rejecting a decision they drafted" }
  - { id: ERR_RESTITUTION_OVER_AUTHORITY, http: 409, condition: "Approval of restitution_amount_cents > RESTITUTION_AUTHORITY_CAP_CENTS without X-Manager-Authority: true" }
  - { id: ERR_REFERRAL_OPEN, http: 409, condition: "withdraw while a referral is OPEN or REOPENED_BY_REGULATOR" }
  - { id: ERR_REVIEW_NOT_OWNED, http: 409, condition: "QAReviewer completing or cancelling a review whose reviewer_user_id differs" }
  - { id: ERR_REVIEW_WINDOW_OVERLAP, http: 409, condition: "Reviewer holds another OPEN review whose half-open window [start, end) intersects the new one" }
  - { id: ERR_SNAPSHOT_WINDOW_OVERLAP, http: 409, condition: "New TrendSnapshot closed-interval window intersects an existing snapshot of the same product (shared boundary dates count as overlap)" }
  - { id: ERR_RETENTION_EXPIRED, http: 409, condition: "reopen at or after retention_purge_at" }
  - { id: ERR_COMPLAINT_NOT_REMEDIABLE, http: 409, condition: "Remediation submit while complaint is INTAKE, TRIAGED, or WITHDRAWN" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_complaint_version does not equal the complaint's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: IntakeSpecialist
    description: "Front-line intake staff; creates complaints and reads shared resources"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /complaint-office/complaints — intake (with CaseHandler)"
      - "GET read endpoints"

  - name: CaseHandler
    description: "Complaint case worker: triage, investigate, RCA, draft responses, remediation drafting, referral responses"
    identity: opaque
    exclusive_operations:
      - "POST .../complaints/{id}/triage"
      - "POST .../complaints/{id}/start_investigation"
      - "POST .../complaints/{id}/taxonomy_recodes"
      - "POST .../complaints/{id}/rcas"
      - "POST .../rcas/{id}/complete"
      - "POST .../complaints/{id}/draft_response"
      - "POST .../complaints/{id}/submit_for_qa"
      - "POST .../referrals/{id}/submit_response"
      - "POST .../complaints/{id}/remediation_decisions"
      - "POST .../remediation-decisions/{id}/submit"
      - "POST .../remediation-decisions/{id}/mark_paid"
    shared_operations:
      - "POST /complaint-office/complaints — intake (with IntakeSpecialist)"
      - "POST .../complaints/{id}/reopen — with ComplaintManager"
      - "POST .../complaints/{id}/withdraw — with ComplaintManager"
      - "POST .../complaints/{id}/escalations — with ComplaintManager"
      - "GET read endpoints"

  - name: QAReviewer
    description: "Response quality reviewer; cannot review complaints they own (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST .../complaints/{id}/quality-reviews"
      - "POST .../complaints/{id}/qa_fail"
    shared_operations:
      - "POST .../quality-reviews/{id}/complete — own reviews only"
      - "POST .../quality-reviews/{id}/cancel — own reviews; shared with ComplaintManager"
      - "GET read endpoints"

  - name: RemediationApprover
    description: "Approves/rejects/reverses remediation decisions; cannot act on self-drafted decisions (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST .../remediation-decisions/{id}/approve"
      - "POST .../remediation-decisions/{id}/reject"
      - "POST .../remediation-decisions/{id}/reverse"
    shared_operations:
      - "GET read endpoints"

  - name: ExecutiveReviewer
    description: "Executive/legal escalation path owner"
    identity: opaque
    exclusive_operations:
      - "POST .../escalations/{id}/acknowledge"
      - "POST .../escalations/{id}/resolve"
      - "POST .../escalations/{id}/dismiss"
    shared_operations:
      - "POST .../products/{id}/trend-snapshots — with ComplaintManager"
      - "GET read endpoints"

  - name: ComplaintManager
    description: "Complaint management office administrator: config (products, channels, taxonomy, templates), logical clock, referral close/reopen, unfreeze, trend snapshots"
    identity: opaque
    exclusive_operations:
      - "POST /complaint-office/_clock/set_current_utc"
      - "POST /complaint-office/products"
      - "POST .../products/{id}/unfreeze"
      - "POST /complaint-office/channels"
      - "POST /complaint-office/taxonomy-categories"
      - "POST .../taxonomy-categories/{id}/retire"
      - "POST /complaint-office/response-templates"
      - "POST .../response-templates/{id}/publish"
      - "POST .../response-templates/{id}/retire"
      - "POST .../referrals/{id}/close"
      - "POST .../referrals/{id}/regulator_reopen"
    shared_operations:
      - "POST .../complaints/{id}/reopen — with CaseHandler"
      - "POST .../complaints/{id}/withdraw — with CaseHandler"
      - "POST .../complaints/{id}/escalations — with CaseHandler"
      - "POST .../quality-reviews/{id}/cancel — with QAReviewer"
      - "POST .../products/{id}/trend-snapshots — with ExecutiveReviewer"
      - "GET read endpoints"

  - name: Auditor
    description: "Read-only access to all resources including audit trail and trend snapshots"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET read endpoints"
