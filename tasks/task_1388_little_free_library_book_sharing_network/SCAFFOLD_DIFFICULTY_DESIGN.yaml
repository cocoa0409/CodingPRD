            - "School.${sch}.drives_completed_count == 1"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: run_create_rejected_state_priority_over_constraint
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_NO_ELIGIBLE_BOXES]
        distinguishing_aspect: |
          Category pair {state, business_constraint}: the batch is not SORTED (state,
          priority 5) AND the selector plan would be empty because no boxes exist at all
          (business_constraint, priority 9). The state error ERR_INVALID_STATE must win.
          Distinct pair from the sibling instance's {business_safety, business_temporal}.
        test_recipe:
          setup:
            - "One PUBLIC_DROP batch in RECEIVED status holding 1 graded item; zero LibraryBoxes exist in the whole network"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/batches", payload: { source_type: "PUBLIC_DROP", region_code: "OR" }, as: HubCoordinator, as_user_id: "hub-1", captures: { batch: "$.data.id", b_v: "$.data.version" } }
            - { call: "POST /library-network/batches/${batch}/items", payload: { items: [ { title: "Solo", category: "FICTION", condition_grade: "A" } ] }, as: HubCoordinator, as_user_id: "hub-1" }
          trigger:
            - { call: "POST /library-network/batches/${batch}/distribution-runs", payload: { expected_batch_version: "${b_v}" }, as: HubCoordinator, as_user_id: "hub-1", captures: { err: "$.data.error_id" } }
            - { call: "GET /library-network/distribution-runs?batch_id=${batch}", payload: {}, as: HubCoordinator, as_user_id: "hub-1" }
          assert:
            - "The trigger is rejected with error_id == ERR_INVALID_STATE (captured ${err}) and HTTP 409 — the priority-5 state check beats the priority-9 ERR_NO_ELIGIBLE_BOXES constraint that also fails"
            - "No DistributionRun exists for the batch (list total_count == 0)"

      - name: drive_item_intake_rejected_safety_priority_over_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_CONTENT_POLICY_VIOLATION]
          - errors[ERR_DRIVE_WINDOW_CLOSED]
        distinguishing_aspect: |
          Category pair {business_safety, business_temporal}: with the drive still in status
          OPEN but past ends_at (no sweep ran), a CHILDREN item violates BOTH the school
          content policy (safety, priority 7) and the collection window (temporal,
          priority 8); it must be rejected with ERR_CONTENT_POLICY_VIOLATION, while the
          unrestricted FICTION sibling reports ERR_DRIVE_WINDOW_CLOSED. Distinct pair from the
          sibling instance's {state, business_constraint}.
        test_recipe:
          setup:
            - "ACTIVE school with restricted_categories == [CHILDREN]; ACTIVE steward coordinator"
            - "Drive window [2026-08-01T00:00:00Z, 2026-08-10T00:00:00Z), both approvals APPROVED, swept to OPEN at 2026-08-01; linked batch exists in RECEIVED"
            - "Clock advanced to 2026-08-12T00:00:00Z with NO sweep, so the drive status remains OPEN while the window is closed"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "Katherine Johnson", email: "kj@example.org", region_code: "OR" }, as: Anonymous, captures: { stw: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw}/training-completions", payload: { module_id: "${mod_ori}", score: 90 }, as: Steward, as_user_id: "${stw}" }
            - { call: "POST /library-network/stewards/${stw}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/schools", payload: { name: "Cedar Mill", district_code: "D-3", contact_email: "pta@cedarmill.edu", region_code: "OR", restricted_categories: ["CHILDREN"] }, as: NetworkAdmin, as_user_id: "admin-1", captures: { sch: "$.data.id" } }
            - { call: "POST /library-network/schools/${sch}/status", payload: { target_status: "ACTIVE" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/drives", payload: { school_id: "${sch}", goal_books: 5, starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-10T00:00:00Z" }, as: Steward, as_user_id: "${stw}", captures: { drv: "$.data.id" } }
            - { call: "POST /library-network/drives/${drv}/school-decision", payload: { decision: "APPROVE" }, as: SchoolLiaison, as_user_id: "${sch}" }
            - { call: "POST /library-network/drives/${drv}/network-decision", payload: { decision: "APPROVE" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/map/sweeps", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "GET /library-network/batches?drive_id=${drv}", payload: {}, as: HubCoordinator, as_user_id: "hub-1", captures: { d_batch: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /library-network/batches/${d_batch}/items", payload: { items: [ { title: "Kids Book", category: "CHILDREN", condition_grade: "A" }, { title: "Novel", category: "FICTION", condition_grade: "A" } ] }, as: HubCoordinator, as_user_id: "hub-1", captures: { n_created: "$.data.created_count" } }
          assert:
            - "created_count == 0 (captured ${n_created})"
            - "rejected[0] == { index: 0, error_id: ERR_CONTENT_POLICY_VIOLATION } — the CHILDREN item violates safety AND temporal; priority 7 safety wins over priority 8 temporal"
            - "rejected[1] == { index: 1, error_id: ERR_DRIVE_WINDOW_CLOSED } — the FICTION item violates only the temporal rule"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: tier_boundary_crossing_at_exactly_100_points
        grounds:
          - calculations.recognition_tier
          - calculations.recognition_points
          - entities.Steward.fields.recognition_tier
        distinguishing_aspect: |
          Metric rolling_points with an inclusive >= boundary: 95 points is NONE, exactly 100
          is BRONZE. Reached through POST /library-network/allocations/{id}/receive (+5 each).
          Distinct metric (points) and endpoint (allocation receive) from the sibling's
          day-count boundary at the sweep endpoint.
        test_recipe:
          setup:
            - "Steward at rolling_points == 90: +25 ORIENTATION completion, +25 SAFETY completion, +40 maintenance resolution"
            - "Box ACTIVE LISTED; batch with 2 graded items SORTED; run confirmed and dispatched, allocations a0/a1 DISPATCHED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
