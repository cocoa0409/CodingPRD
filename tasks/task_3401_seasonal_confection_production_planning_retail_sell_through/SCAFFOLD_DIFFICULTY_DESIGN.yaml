          - validations[priority=9]
          - errors.ERR_PROGRAM_NOT_OPEN
          - errors.ERR_COMMITMENT_WINDOW_CLOSED
        distinguishing_aspect: "state (p7) vs business_temporal (p9): at clock 2027-02-20 the program is LOCKED AND the commitment window is closed — the dual failure must surface ERR_PROGRAM_NOT_OPEN, never ERR_COMMITMENT_WINDOW_CLOSED."
        test_recipe:
          setup:
            - "Program advanced OPEN -> LOCKED at 2027-02-15; GOLD commitment for 10 units created but left in DRAFT; clock at 2027-02-20 (past commitment_close_on)."
