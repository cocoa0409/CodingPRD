              as: MerchandisePlanner
              captures: { z1_u: $.data.id }
            - call: "POST /kidswear/cycles"
              payload: { member_id: "${z1_m}", start_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { z1_cyc: $.data.id }
            - call: "POST /kidswear/cycles/${z1_cyc}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/boxes"
              payload: { cycle_id: "${z1_cyc}" }
              as: WarehouseOperator
              captures: { z1_box: $.data.id }
            - call: "POST /kidswear/boxes/${z1_box}/allocate"
              payload: { unit_id: "${z1_u}" }
              as: WarehouseOperator
              captures: { z1_bi: $.data.id }
            - call: "POST /kidswear/boxes/${z1_box}/pack"
              payload: {}
