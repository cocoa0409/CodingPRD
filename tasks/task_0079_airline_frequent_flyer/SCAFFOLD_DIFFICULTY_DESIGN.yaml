scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: award_pricing_dynamic_vs_fixed
        grounds:
          - calculations.award_pricing
          - entities.AwardBooking.fields.pricing_mode
          - entities.AwardBooking.fields.points_price
        distinguishing_aspect: |
          Same route_code+cabin produce different points_price under DYNAMIC
          (chart*(0.8+0.8*load_factor)) vs FIXED (chart) — dual-variant pricing
          on the AwardBooking domain.
        test_recipe:
          setup:
            - "One member m1 exists."
            - "Two BUSINESS award quotes for the same route, one DYNAMIC load_factor=0.5, one FIXED."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "m1@air.test", full_name: "M One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
          trigger:
            - call: "POST /award-bookings"
              payload: { member_id: "${m1}", route_code: "SFO-NRT", cabin: "BUSINESS", pricing_mode: "DYNAMIC", load_factor: 0.5 }
              as: Member
              as_user_id: "${m1}"
              captures: { dyn_price: "$.data.points_price" }
            - call: "POST /award-bookings"
              payload: { member_id: "${m1}", route_code: "SFO-NRT", cabin: "BUSINESS", pricing_mode: "FIXED" }
              as: Member
              as_user_id: "${m1}"
              captures: { fix_price: "$.data.points_price" }
          assert:
            - "${dyn_price} == 72000  # 60000*(0.8+0.8*0.5)=60000*1.2"
            - "${fix_price} == 60000"
            - "${dyn_price} != ${fix_price}"
      - name: segment_accrual_floor_vs_fare
        grounds:
          - calculations.segment_accrual
          - entities.FlightSegment.fields.points_awarded
          - state_machines.FlightSegment.FLOWN_to_ACCRUED
        distinguishing_aspect: |
          On the FlightSegment domain (different entity from award_pricing), the
          earned points take max(fare-based, distance-floor): identical segment
          inputs yield different totals depending on which branch dominates.
        test_recipe:
          setup:
            - "Member m1 with a flown long-haul cheap DISCOUNT-upgraded ECONOMY segment ready to accrue."
            - "Clock at/after departure."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-01-10T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "m1@air.test", full_name: "M One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /flight-segments"
              payload: { member_id: "${m1}", origin: "SFO", destination: "JFK", fare_class: "ECONOMY", distance_miles: 2580, base_fare_usd: 100, scheduled_departure: "2026-01-05T08:00:00.000Z" }
              as: OperationsAgent
              captures: { seg: "$.data.id" }
            - call: "POST /flight-segments/${seg}/fly"
              payload: {}
              as: OperationsAgent
          trigger:
            - call: "POST /flight-segments/${seg}/accrue"
              payload: {}
              as: OperationsAgent
              captures: { pts: "$.data.points_awarded" }
          assert:
            - "${pts} == 1290  # base=100*1.0=100; floor=ceil(2580*0.5)=1290; max=1290; BASE bonus 0%"

  - rule_id: combinatorial_formula
    instances:
      - name: segment_accrual_mode_a_nonlinear
        grounds:
          - calculations.segment_accrual
          - entities.FlightSegment.fields.fare_class
          - entities.Member.fields.tier
        distinguishing_aspect: |
          MODE (a): >=3 inputs (base_fare, class_mult, distance_floor, tier_bonus)
          with a non-linear max() and a tier-bonus multiply — distinct from the
          rounding-order mode used by the second instance.
        test_recipe:
          setup:
            - "Member m1 already GOLD (effective_tier GOLD), with a fare-dominant BUSINESS segment flown."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-02-01T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "g1@air.test", full_name: "G One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /status-matches"
              payload: { member_id: "${m1}", rival_tier: "PLATINUM", valid_until: "2026-12-31T23:59:59.000Z" }
              as: ProgramAdmin
            - call: "POST /flight-segments"
              payload: { member_id: "${m1}", origin: "SFO", destination: "LAX", fare_class: "BUSINESS", distance_miles: 340, base_fare_usd: 800, scheduled_departure: "2026-01-20T08:00:00.000Z" }
              as: OperationsAgent
              captures: { seg: "$.data.id" }
            - call: "POST /flight-segments/${seg}/fly"
              payload: {}
              as: OperationsAgent
          trigger:
            - call: "POST /flight-segments/${seg}/accrue"
              payload: {}
              as: OperationsAgent
              captures: { pts: "$.data.points_awarded" }
          assert:
            - "${pts} == 2400  # base=800*1.5=1200; floor=ceil(340*0.5)=170; max=1200; GOLD via match-floored PLATINUM? matched_tier one below PLATINUM=GOLD -> bonus 50%; 1200*1.5=1800 ... see distinguishing"
            - "status match floors effective_tier to GOLD (one rung below PLATINUM); 1200*(1+50/100)=1800"
      - name: award_pricing_companion_rounding_order
        grounds:
          - calculations.award_pricing
          - entities.AwardBooking.fields.companion_certificate_id
          - validations[priority=8]
        distinguishing_aspect: |
          MODE (b): rounding order pinned — DYNAMIC cabin_price is rounded FIRST,
          then companion_addon = round_half_up(cabin_price*50%), then summed;
          rounding the components separately vs summing-then-rounding diverges.
        test_recipe:
          setup:
            - "Member m1 holds an ISSUED companion certificate valid over the travel window."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-03-01T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "c1@air.test", full_name: "C One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /companion-certificates"
              payload: { member_id: "${m1}", valid_from: "2026-01-01T00:00:00.000Z", valid_until: "2026-12-31T00:00:00.000Z" }
              as: ProgramAdmin
              captures: { cert: "$.data.id" }
          trigger:
            - call: "POST /award-bookings"
              payload: { member_id: "${m1}", route_code: "SFO-NRT", cabin: "ECONOMY", pricing_mode: "DYNAMIC", load_factor: 0.625, companion_certificate_id: "${cert}" }
              as: Member
              as_user_id: "${m1}"
              captures: { price: "$.data.points_price" }
          assert:
            - "cabin_price=round_half_up(25000*(0.8+0.8*0.625))=round_half_up(25000*1.3)=32500"
            - "companion_addon=round_half_up(32500*0.5)=16250; ${price} == 48750"

  - rule_id: non_linear_state_machine
    instances:
      - name: upgrade_request_branching_fork
        grounds:
          - state_machines.UpgradeRequest.WAITLISTED_to_CLEARED
          - state_machines.UpgradeRequest.WAITLISTED_to_DENIED
          - state_machines.UpgradeRequest.WAITLISTED_to_WITHDRAWN
        distinguishing_aspect: |
          UpgradeRequest is a branching fork-join: WAITLISTED forks to CLEARED
          (seat consumed) vs DENIED (no seat) with divergent side-effect sets,
          plus the WITHDRAWN branch — non-linear on the UpgradeRequest entity.
        test_recipe:
          setup:
            - "Pool with capacity 1; two waitlisted requests of differing priority."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-04-01T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "hi@air.test", full_name: "Hi Tier", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { mhi: "$.data.id" }
            - call: "POST /members"
              payload: { email: "lo@air.test", full_name: "Lo Tier", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { mlo: "$.data.id" }
            - call: "POST /status-matches"
              payload: { member_id: "${mhi}", rival_tier: "PLATINUM", valid_until: "2026-12-31T23:59:59.000Z" }
              as: ProgramAdmin
            - call: "POST /flight-pools"
              payload: { flight_number: "UA1", departure_at: "2026-04-10T08:00:00.000Z", premium_capacity: 1 }
              as: OperationsAgent
              captures: { pool: "$.data.id", pv0: "$.data.version" }
            - call: "POST /upgrade-requests"
              payload: { member_id: "${mhi}", flight_pool_id: "${pool}", booked_fare_class: "ECONOMY", expected_flightpool_version: "${pv0}" }
              as: Member
              as_user_id: "${mhi}"
              captures: { reqhi: "$.data.id" }
            - call: "GET /flight-pools/${pool}"
              payload: {}
              as: OperationsAgent
              captures: { pv1b: "$.data.version" }
            - call: "POST /upgrade-requests"
              payload: { member_id: "${mlo}", flight_pool_id: "${pool}", booked_fare_class: "ECONOMY", expected_flightpool_version: "${pv1b}" }
              as: Member
              as_user_id: "${mlo}"
              captures: { reqlo: "$.data.id" }
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-04-10T09:00:00.000Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /flight-pools/${pool}/clear-waitlist"
              payload: {}
              as: OperationsAgent
            - call: "GET /upgrade-requests/${reqhi}"
              payload: {}
              as: OperationsAgent
              captures: { hi_status: "$.data.status" }
            - call: "GET /upgrade-requests/${reqlo}"
              payload: {}
              as: OperationsAgent
              captures: { lo_status: "$.data.status" }
          assert:
            - "${hi_status} == 'CLEARED'  # PLATINUM-matched tier outranks BASE"
            - "${lo_status} == 'DENIED'  # pool exhausted"
      - name: companion_certificate_cycle
        grounds:
          - state_machines.CompanionCertificate.ISSUED_to_RESERVED
          - state_machines.CompanionCertificate.RESERVED_to_ISSUED
          - state_machines.CompanionCertificate.RESERVED_to_REDEEMED
        distinguishing_aspect: |
          CompanionCertificate (different entity from UpgradeRequest) has a cycle
          ISSUED -> RESERVED -> ISSUED (reuse on cancel) alongside the forward
          RESERVED -> REDEEMED branch — a true non-linear revision loop.
        test_recipe:
          setup:
            - "Member m1 with an ISSUED certificate; attaches it to an award then cancels the QUOTED award, returning the cert to ISSUED."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-05-01T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "cy@air.test", full_name: "Cy One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /companion-certificates"
              payload: { member_id: "${m1}", valid_from: "2026-01-01T00:00:00.000Z", valid_until: "2026-12-31T00:00:00.000Z" }
              as: ProgramAdmin
              captures: { cert: "$.data.id" }
            - call: "POST /award-bookings"
              payload: { member_id: "${m1}", route_code: "SFO-NRT", cabin: "ECONOMY", pricing_mode: "FIXED", companion_certificate_id: "${cert}" }
              as: Member
              as_user_id: "${m1}"
              captures: { aw: "$.data.id" }
          trigger:
            - call: "POST /award-bookings/${aw}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m1}"
            - call: "GET /companion-certificates/${cert}"
              payload: {}
              as: Member
              as_user_id: "${m1}"
              captures: { cstatus: "$.data.status", attached: "$.data.attached_award_id" }
          assert:
            - "${cstatus} == 'ISSUED'  # returned to reusable pool (RESERVED -> ISSUED)"
            - "${attached} == null"

  - rule_id: transitive_cascade
    instances:
      - name: accrue_depth3_tier_promotion
        grounds:
          - state_machines.FlightSegment.FLOWN_to_ACCRUED
          - calculations.tier_recompute
          - entities.Member.fields.tier
        distinguishing_aspect: |
          Depth-3: accrue mutates PointsLedger/points_balance (L1) -> that mutation
          bumps qualifying_segments_ytd (L2) -> crossing SILVER threshold triggers
          tier_recompute raising Member.tier (L3). Each link caused by the prior.
        test_recipe:
          setup:
            - "Member m1 already at 14 qualifying segments (one below SILVER=15); a 15th BUSINESS segment flown."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-06-01T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "p1@air.test", full_name: "P One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /_inject/qualifying_segments"
              payload: { member_id: "${m1}", count: 14 }
              as: ProgramAdmin
            - call: "POST /flight-segments"
              payload: { member_id: "${m1}", origin: "SFO", destination: "LAX", fare_class: "BUSINESS", distance_miles: 340, base_fare_usd: 400, scheduled_departure: "2026-05-20T08:00:00.000Z" }
              as: OperationsAgent
              captures: { seg: "$.data.id" }
            - call: "POST /flight-segments/${seg}/fly"
              payload: {}
              as: OperationsAgent
          trigger:
            - call: "POST /flight-segments/${seg}/accrue"
              payload: {}
              as: OperationsAgent
            - call: "GET /members/${m1}"
              payload: {}
              as: ProgramAdmin
              captures: { tier: "$.data.tier", qs: "$.data.qualifying_segments_ytd", bal: "$.data.points_balance" }
          assert:
            - "${qs} == 15"
            - "${tier} == 'SILVER'  # crossing threshold via the accrual cascade"
            - "${bal} > 0"
      - name: gift_settle_depth2_recipient_credit
        grounds:
          - state_machines.PointsGift.PENDING_to_SETTLED
          - entities.Member.fields.points_balance
          - entities.PointsLedger.fields.delta
        distinguishing_aspect: |
          Depth-2 from a different trigger (gift settle): sender debit (L1) ->
          that settlement itself drives the recipient credit ledger row + balance
          (L2). Distinct propagation pattern from the accrue cascade.
        test_recipe:
          setup:
            - "Sender m1 with 5000 points; recipient m2 with 0."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-07-01T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "s1@air.test", full_name: "S One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /members"
              payload: { email: "r1@air.test", full_name: "R One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m2: "$.data.id" }
            - call: "POST /_inject/points"
              payload: { member_id: "${m1}", amount: 5000 }
              as: ProgramAdmin
            - call: "POST /points-gifts"
              payload: { sender_id: "${m1}", recipient_id: "${m2}", amount: 2000 }
              as: Member
              as_user_id: "${m1}"
              captures: { gift: "$.data.id" }
            - call: "GET /members/${m1}"
              payload: {}
              as: ProgramAdmin
              captures: { mv: "$.data.version" }
          trigger:
            - call: "POST /points-gifts/${gift}/settle"
              payload: { expected_member_version: "${mv}" }
              as: Member
              as_user_id: "${m1}"
            - call: "GET /members/${m1}"
              payload: {}
              as: ProgramAdmin
              captures: { sbal: "$.data.points_balance" }
            - call: "GET /members/${m2}"
              payload: {}
              as: ProgramAdmin
              captures: { rbal: "$.data.points_balance" }
          assert:
            - "${sbal} == 3000"
            - "${rbal} == 2000  # recipient credit is a caused L2 effect of the settle"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_on_issue
        grounds:
          - validations[priority=5]
          - validations[priority=13]
        distinguishing_aspect: |
          Pair (state vs business_fiscal): issuing an already-ISSUED award with
          insufficient points must return ERR_INVALID_STATE (priority 5) ahead of
          ERR_INSUFFICIENT_POINTS (priority 13).
        test_recipe:
          setup:
            - "Member m1 with an already-ISSUED award and a points_balance now below points_price."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "sf@air.test", full_name: "SF One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /_inject/points"
              payload: { member_id: "${m1}", amount: 30000 }
              as: ProgramAdmin
            - call: "POST /award-bookings"
              payload: { member_id: "${m1}", route_code: "SFO-NRT", cabin: "ECONOMY", pricing_mode: "FIXED" }
              as: Member
              as_user_id: "${m1}"
              captures: { aw: "$.data.id" }
            - call: "POST /award-bookings/${aw}/issue"
              payload: {}
              as: Member
              as_user_id: "${m1}"
          trigger:
            - call: "POST /award-bookings/${aw}/issue"
              payload: {}
              as: Member
              as_user_id: "${m1}"
              captures: { eid: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "${eid} == 'ERR_INVALID_STATE'  # state precondition beats fiscal"
      - name: owner_vs_state_on_withdraw
        grounds:
          - validations[priority=3]
          - validations[priority=5]
        distinguishing_aspect: |
          Pair (auth-owner vs state): a non-owner withdrawing an already-CLEARED
          request gets ERR_NOT_RESOURCE_OWNER (priority 3) before ERR_INVALID_STATE
          (priority 5) — different category pair from instance 1.
        test_recipe:
          setup:
            - "Member m1 has a CLEARED upgrade request; member m2 (non-owner) attempts withdraw."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "o1@air.test", full_name: "O One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /members"
              payload: { email: "o2@air.test", full_name: "O Two", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m2: "$.data.id" }
            - call: "POST /flight-pools"
              payload: { flight_number: "UA2", departure_at: "2026-09-10T08:00:00.000Z", premium_capacity: 1 }
              as: OperationsAgent
              captures: { pool: "$.data.id", pv0: "$.data.version" }
            - call: "POST /upgrade-requests"
              payload: { member_id: "${m1}", flight_pool_id: "${pool}", booked_fare_class: "ECONOMY", expected_flightpool_version: "${pv0}" }
              as: Member
              as_user_id: "${m1}"
              captures: { req: "$.data.id" }
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-09-10T09:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /flight-pools/${pool}/clear-waitlist"
              payload: {}
              as: OperationsAgent
          trigger:
            - call: "POST /upgrade-requests/${req}/withdraw"
              payload: {}
              as: Member
              as_user_id: "${m2}"
              captures: { eid: "$.data.error_id" }
          assert:
            - "HTTP 403"
            - "${eid} == 'ERR_NOT_RESOURCE_OWNER'  # ownership beats state"

  - rule_id: boundary_precision_check
    instances:
      - name: tier_threshold_ge_boundary
        grounds:
          - calculations.tier_recompute
          - entities.Member.fields.qualifying_segments_ytd
          - state_machines.FlightSegment.FLOWN_to_ACCRUED
        distinguishing_aspect: |
          Numeric >= boundary: exactly 15 qualifying segments yields SILVER (>=),
          14 does not — a threshold-crossing metric reached via the accrue endpoint.
        test_recipe:
          setup:
            - "Member at 14 qualifying segments; accrue the 15th (qualifying) segment."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-10-01T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "b1@air.test", full_name: "B One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /_inject/qualifying_segments"
              payload: { member_id: "${m1}", count: 14 }
              as: ProgramAdmin
            - call: "POST /flight-segments"
              payload: { member_id: "${m1}", origin: "SFO", destination: "LAX", fare_class: "ECONOMY", distance_miles: 340, base_fare_usd: 200, scheduled_departure: "2026-09-20T08:00:00.000Z" }
              as: OperationsAgent
              captures: { seg: "$.data.id" }
            - call: "POST /flight-segments/${seg}/fly"
              payload: {}
              as: OperationsAgent
          trigger:
            - call: "POST /flight-segments/${seg}/accrue"
              payload: {}
              as: OperationsAgent
            - call: "GET /members/${m1}"
              payload: {}
              as: ProgramAdmin
              captures: { tier: "$.data.tier", qs: "$.data.qualifying_segments_ytd" }
          assert:
            - "${qs} == 15"
            - "${tier} == 'SILVER'  # exactly at threshold (>=) promotes"
      - name: empty_waitlist_clear_noop
        grounds:
          - state_machines.UpgradeRequest.WAITLISTED_to_CLEARED
          - entities.FlightPool.fields.seats_remaining
          - validations[priority=12]
        distinguishing_aspect: |
          Empty-set boundary on a different metric/endpoint: clearing a pool with
          zero waitlisted requests leaves seats_remaining == premium_capacity and
          cleared == true, with no transitions fired.
        test_recipe:
          setup:
            - "Pool capacity 3, no upgrade requests, departure reached."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-11-01T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /flight-pools"
              payload: { flight_number: "UA3", departure_at: "2026-11-05T08:00:00.000Z", premium_capacity: 3 }
              as: OperationsAgent
              captures: { pool: "$.data.id" }
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-11-05T09:00:00.000Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /flight-pools/${pool}/clear-waitlist"
              payload: {}
              as: OperationsAgent
              captures: { remaining: "$.data.seats_remaining", cleared: "$.data.cleared", scleared: "$.data.seats_cleared" }
          assert:
            - "${remaining} == 3"
            - "${scleared} == 0"
            - "${cleared} == true"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: award_issue_depends_on_member_balance
        grounds:
          - state_machines.AwardBooking.QUOTED_to_ISSUED
          - entities.Member.fields.points_balance
        distinguishing_aspect: |
          Pair AwardBooking->Member: the award's QUOTED->ISSUED transition is
          gated by the Member's points_balance state.
        test_recipe:
          setup:
            - "Member m1 with 10000 points; a FIXED ECONOMY award (25000) quoted."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-03-15T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "x1@air.test", full_name: "X One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /_inject/points"
              payload: { member_id: "${m1}", amount: 10000 }
              as: ProgramAdmin
            - call: "POST /award-bookings"
              payload: { member_id: "${m1}", route_code: "SFO-NRT", cabin: "ECONOMY", pricing_mode: "FIXED" }
              as: Member
              as_user_id: "${m1}"
              captures: { aw: "$.data.id" }
          trigger:
            - call: "POST /award-bookings/${aw}/issue"
              payload: {}
              as: Member
              as_user_id: "${m1}"
              captures: { eid: "$.data.error_id" }
          assert:
            - "HTTP 422"
            - "${eid} == 'ERR_INSUFFICIENT_POINTS'  # award transition blocked by member balance state"
      - name: upgrade_clear_depends_on_pool_seats
        grounds:
          - state_machines.UpgradeRequest.WAITLISTED_to_CLEARED
          - state_machines.UpgradeRequest.WAITLISTED_to_DENIED
          - entities.FlightPool.fields.seats_remaining
        distinguishing_aspect: |
          Different entity pair UpgradeRequest->FlightPool: a request clears or is
          denied based on the pool's seats_remaining state at processing time.
        test_recipe:
          setup:
            - "Pool capacity 0; one waitlisted request; cleared."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-04-15T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "u1@air.test", full_name: "U One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /flight-pools"
              payload: { flight_number: "UA4", departure_at: "2026-04-20T08:00:00.000Z", premium_capacity: 0 }
              as: OperationsAgent
              captures: { pool: "$.data.id", pv0: "$.data.version" }
            - call: "POST /upgrade-requests"
              payload: { member_id: "${m1}", flight_pool_id: "${pool}", booked_fare_class: "ECONOMY", expected_flightpool_version: "${pv0}" }
              as: Member
              as_user_id: "${m1}"
              captures: { req: "$.data.id" }
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-04-20T09:00:00.000Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /flight-pools/${pool}/clear-waitlist"
              payload: {}
              as: OperationsAgent
            - call: "GET /upgrade-requests/${req}"
              payload: {}
              as: OperationsAgent
              captures: { st: "$.data.status" }
          assert:
            - "${st} == 'DENIED'  # zero seats_remaining forces deny"

  - rule_id: resource_temporal_overlap
    instances:
      - name: companion_window_inclusive_containment
        grounds:
          - validations[priority=8]
          - entities.CompanionCertificate.fields.valid_from
          - entities.CompanionCertificate.fields.valid_until
        distinguishing_aspect: |
          Interval semantics: certificate validity is a CLOSED inclusive window
          [valid_from, valid_until]; the attach instant (clock.current_utc) must be
          contained. Boundary instant equal to valid_until is inside.
        test_recipe:
          setup:
            - "Certificate valid_until exactly equals the clock at attach time (inclusive boundary passes)."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-12-31T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "t1@air.test", full_name: "T One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /companion-certificates"
              payload: { member_id: "${m1}", valid_from: "2026-01-01T00:00:00.000Z", valid_until: "2026-12-31T00:00:00.000Z" }
              as: ProgramAdmin
              captures: { cert: "$.data.id" }
          trigger:
            - call: "POST /award-bookings"
              payload: { member_id: "${m1}", route_code: "SFO-NRT", cabin: "ECONOMY", pricing_mode: "FIXED", companion_certificate_id: "${cert}" }
              as: Member
              as_user_id: "${m1}"
              captures: { code: "$.data.status" }
          assert:
            - "HTTP 201  # boundary instant == valid_until is inside the closed window"
            - "${code} == 'QUOTED'"
      - name: flightpool_aggregate_capacity_overlap
        grounds:
          - state_machines.UpgradeRequest.WAITLISTED_to_CLEARED
          - entities.FlightPool.fields.premium_capacity
          - entities.FlightPool.fields.seats_cleared
        distinguishing_aspect: |
          Different resource (FlightPool) and different interval semantics:
          aggregate-capacity occupation rather than a time window — the (N+1)th
          clear collides with full capacity even though each individual request
          is valid; the geometric treatment is count-based, not adjacency-based.
        test_recipe:
          setup:
            - "Pool capacity 1; two waitlisted requests; both valid individually."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-04-25T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "a1@air.test", full_name: "A One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /members"
              payload: { email: "a2@air.test", full_name: "A Two", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m2: "$.data.id" }
            - call: "POST /flight-pools"
              payload: { flight_number: "UA5", departure_at: "2026-04-30T08:00:00.000Z", premium_capacity: 1 }
              as: OperationsAgent
              captures: { pool: "$.data.id", pv0: "$.data.version" }
            - call: "POST /upgrade-requests"
              payload: { member_id: "${m1}", flight_pool_id: "${pool}", booked_fare_class: "BUSINESS", expected_flightpool_version: "${pv0}" }
              as: Member
              as_user_id: "${m1}"
              captures: { req1: "$.data.id" }
            - call: "GET /flight-pools/${pool}"
              payload: {}
              as: OperationsAgent
              captures: { pv1b: "$.data.version" }
            - call: "POST /upgrade-requests"
              payload: { member_id: "${m2}", flight_pool_id: "${pool}", booked_fare_class: "ECONOMY", expected_flightpool_version: "${pv1b}" }
              as: Member
              as_user_id: "${m2}"
              captures: { req2: "$.data.id" }
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-04-30T09:00:00.000Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /flight-pools/${pool}/clear-waitlist"
              payload: {}
              as: OperationsAgent
              captures: { sc: "$.data.seats_cleared", sr: "$.data.seats_remaining" }
            - call: "GET /upgrade-requests/${req2}"
              payload: {}
              as: OperationsAgent
              captures: { st2: "$.data.status" }
          assert:
            - "${sc} == 1 and ${sr} == 0"
            - "${st2} == 'DENIED'  # second occupant collides with full aggregate capacity"

  - rule_id: compensating_invariant
    instances:
      - name: award_cancel_points_conserved
        grounds:
          - state_machines.AwardBooking.ISSUED_to_CANCELLED
          - state_machines.AwardBooking.QUOTED_to_ISSUED
          - entities.Member.fields.points_balance
        distinguishing_aspect: |
          Conserved quantity = member points_balance: issue (debit) + cancel
          (REDEMPTION_REFUND of exactly points_price) leaves points_balance equal
          to its pre-issuance value.
        test_recipe:
          setup:
            - "Member m1 with 30000 points; issues then cancels a FIXED ECONOMY award (25000)."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-03-20T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "inv1@air.test", full_name: "Inv One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /_inject/points"
              payload: { member_id: "${m1}", amount: 30000 }
              as: ProgramAdmin
            - call: "POST /award-bookings"
              payload: { member_id: "${m1}", route_code: "SFO-NRT", cabin: "ECONOMY", pricing_mode: "FIXED" }
              as: Member
              as_user_id: "${m1}"
              captures: { aw: "$.data.id" }
            - call: "POST /award-bookings/${aw}/issue"
              payload: {}
              as: Member
              as_user_id: "${m1}"
          trigger:
            - call: "POST /award-bookings/${aw}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m1}"
            - call: "GET /members/${m1}"
              payload: {}
              as: ProgramAdmin
              captures: { bal: "$.data.points_balance" }
          assert:
            - "${bal} == 30000  # invariant: balance restored to pre-issuance value exactly"
      - name: gift_total_program_points_conserved
        grounds:
          - state_machines.PointsGift.PENDING_to_SETTLED
          - entities.Member.fields.points_balance
          - entities.PointsLedger.fields.delta
        distinguishing_aspect: |
          Different conserved quantity = total program points (sender_balance +
          recipient_balance): a settled gift debits sender exactly what it credits
          recipient, leaving the two-account sum unchanged.
        test_recipe:
          setup:
            - "Sender m1 5000, recipient m2 1000; gift 2000 settled."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { current_utc: "2026-07-15T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { email: "gs@air.test", full_name: "GS One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /members"
              payload: { email: "gr@air.test", full_name: "GR One", home_airport: "SFO" }
              as: ProgramAdmin
              captures: { m2: "$.data.id" }
            - call: "POST /_inject/points"
              payload: { member_id: "${m1}", amount: 5000 }
              as: ProgramAdmin
            - call: "POST /_inject/points"
              payload: { member_id: "${m2}", amount: 1000 }
              as: ProgramAdmin
            - call: "POST /points-gifts"
              payload: { sender_id: "${m1}", recipient_id: "${m2}", amount: 2000 }
              as: Member
              as_user_id: "${m1}"
              captures: { gift: "$.data.id" }
            - call: "GET /members/${m1}"
              payload: {}
              as: ProgramAdmin
              captures: { mv: "$.data.version" }
          trigger:
            - call: "POST /points-gifts/${gift}/settle"
              payload: { expected_member_version: "${mv}" }
              as: Member
              as_user_id: "${m1}"
            - call: "GET /members/${m1}"
              payload: {}
              as: ProgramAdmin
              captures: { sbal: "$.data.points_balance" }
            - call: "GET /members/${m2}"
              payload: {}
              as: ProgramAdmin
              captures: { rbal: "$.data.points_balance" }
          assert:
            - "${sbal} + ${rbal} == 6000  # two-account sum conserved (5000+1000)"
