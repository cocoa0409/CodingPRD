              captures: { folio_comp_id: "$.data.id" }
            - call: "POST /night-audit/authorization-documents"
              payload: { property_id: "${prop_id}", doc_type: "COMP_ROOM", authorized_by_name: "V. Holt, GM", document_reference: "COMP-2026-0801", valid_from_date: "2026-08-01", valid_to_date: "2026-08-02", folio_id: "${folio_comp_id}" }
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
              captures: { doc_comp_id: "$.data.id" }
            - call: "POST /night-audit/authorization-documents/${doc_comp_id}/review"
              payload: { decision: "APPROVE" }
              as: RevenueManager
              as_user_id: "u_rm_1"
            - call: "POST /night-audit/folios/${folio_comp_id}/check-in"
              payload: {}
              as: FrontDeskAgent
              as_user_id: "u_fd_1"
            - call: "POST /night-audit/business-dates/${bd_d1_id}/post-room-and-tax"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/authorization-documents/${doc_comp_id}/revoke"
              payload: {}
              as: Controller
              as_user_id: "u_ctl_1"
          trigger: "POST /night-audit/business-dates/${bd_d2_id}/post-room-and-tax as NightAuditor (X-User-ID u_na_1) - the second comp night, now uncovered."
          assert:
            - "The trigger fails with HTTP 409 and error code ERR_COMP_AUTHORIZATION_MISSING."
            - "GET /night-audit/business-dates/${bd_d2_id} returns status == OPEN, rooms_occupied_count == 0 and room_night_revenue_amount == 0.00 - one uncovered comp folio rejects the whole run and writes no line at all."
            - "The 2026-08-01 work survives: GET /night-audit/journal-postings?folio_id=${folio_comp_id}&business_date_id=${bd_d1_id}&charge_type=ROOM still returns exactly one row with amount == 0.00."
            - "GET /night-audit/business-dates/${bd_d1_id} still returns rooms_occupied_count == 1, occupancy_pct == 1.04 (round(1 * 100 / 96, 2)), room_night_revenue_amount == 0.00 and adr_amount == 0.00 - a comp room occupies a room while earning nothing."
            - "GET /night-audit/authorization-documents/${doc_comp_id} returns status == REVOKED with reviewed_by_user_id == u_ctl_1."
            - "Filing a fresh COMP_ROOM document for ${folio_comp_id} covering 2026-08-02 to 2026-08-02 is accepted (the REVOKED document is neither PENDING nor ACTIVE, so priority 77 does not fire), and after RevenueManager u_rm_1 reviews it APPROVE the trigger succeeds and ${bd_d2_id} reaches ROOM_POSTING with rooms_occupied_count == 1."
            - "An implementation that reads the document's state only at posting time, or that retroactively voids the 2026-08-01 line on revoke, fails."

      - name: daily_balance_gated_on_every_settlement_batch_being_resolved
        grounds: "§1.2 BusinessDate SETTLEMENT_REVIEW -> BALANCED precondition 'unresolved_settlement_batch_count == 0'; §1.4 priority 82 ERR_SETTLEMENTS_UNRESOLVED; §1.2 SettlementBatch VARIANCE_FLAGGED -> ACCEPTED_WITH_VARIANCE."
        distinguishing_aspect: >-
          A child-to-parent gate driven by a *count* of children rather than by a single peer row,
          and it is cleared by a management decision on the child (accept-variance) that leaves the
          variance money on the books - so the gate opens while the reconciliation figure stays
          non-zero. The dependency direction is the opposite of the comp-paperwork instance.
        test_recipe:
          setup: "Standard property; one ACTIVE outlet with requires_shift_settlement true; business date 2026-08-01; one CASH ticket at gross 120.00 closed with transmitted_at 2026-08-01T18:00:00.000Z, so system_amount is 150.45; the outlet declares 225.68 over [2026-08-01T14:00:00.000Z, 2026-08-01T22:00:00.000Z); room and tax are posted, sealed and verified, which flags the batch at a 75.23 variance."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T20:00:00.000Z" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/outlets"
              payload: { property_id: "${prop_id}", outlet_code: "LOBBY", outlet_name: "Lobby Lounge", outlet_type: "FB_OUTLET", requires_shift_settlement: true }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
              captures: { lounge_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id" }
            - call: "POST /night-audit/outlet-tickets"
              payload: { outlet_id: "${lounge_id}", business_date_id: "${bd1_id}", ticket_number: "L-001", gross_amount: 120.00, settlement_type: "CASH", opened_at: "2026-08-01T17:30:00.000Z" }
              as: OutletManager
              as_user_id: "${lounge_id}"
              captures: { tk_lounge_id: "$.data.id" }
            - call: "POST /night-audit/outlet-tickets/${tk_lounge_id}/close"
              payload: { transmitted_at: "2026-08-01T18:00:00.000Z" }
              as: OutletManager
              as_user_id: "${lounge_id}"
            - call: "POST /night-audit/settlement-batches"
              payload: { business_date_id: "${bd1_id}", outlet_id: "${lounge_id}", tender_type: "CASH", shift_start_at: "2026-08-01T14:00:00.000Z", shift_end_at: "2026-08-01T22:00:00.000Z", declared_amount: 225.68 }
              as: OutletManager
              as_user_id: "${lounge_id}"
              captures: { batch_flag_id: "$.data.id" }
            - call: "POST /night-audit/business-dates/${bd1_id}/post-room-and-tax"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/seal-charges"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/verify-settlements"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
          trigger: "POST /night-audit/business-dates/${bd1_id}/balance as NightAuditor (X-User-ID u_na_1)."
          assert:
            - "GET /night-audit/settlement-batches/${batch_flag_id} returns system_amount == 150.45, variance_amount == 75.23 (225.68 - 150.45) and status == VARIANCE_FLAGGED."
            - "The trigger fails with HTTP 409 and error code ERR_SETTLEMENTS_UNRESOLVED, and GET /night-audit/business-dates/${bd1_id} returns status == SETTLEMENT_REVIEW with unresolved_settlement_batch_count == 1."
            - "A follow-up POST /night-audit/settlement-batches/${batch_flag_id}/accept-variance as RevenueManager (X-User-ID u_rm_1) returns status == ACCEPTED_WITH_VARIANCE with accepted_by_user_id == u_rm_1; the declarer was the outlet id ${lounge_id}, so priority 50 does not fire."
            - "GET /night-audit/business-dates/${bd1_id} then returns unresolved_settlement_batch_count == 0 while settlement_variance_total_amount is still 75.23 - the gate opens but the variance stays on the books."
            - "Repeating the trigger now returns 200 with status == BALANCED."
            - "The same accept-variance issued as OutletManager (X-User-ID ${lounge_id}) would instead fail 403 ERR_UNAUTHORIZED, so the count cannot be cleared by the party that declared it."

      - name: period_tie_out_gated_on_every_child_date_being_closed
        grounds: "§1.4 priority 83 ERR_PERIOD_HAS_OPEN_DATES; §1.3 calculation period_tie_out input_set ('a date left OPEN ... blocks the tie-out outright rather than being silently excluded'); §1.3 calculation audit_retention_date."
        distinguishing_aspect: >-
          A parent-to-many-children gate one aggregate level higher than the settlement instance,
          and its distinguishing property is that the blocked date is *not silently excluded* from
          the sum - the naive implementation would happily tie out 217.75 against 217.75 and
          succeed. It is also the only cross-entity gate here whose success path archives its
          children and stamps a retention horizon.
        test_recipe:
          setup: "Standard property; business date 2026-08-01 carrying one CASH folio at rate 200.00 driven through the entire close sequence to CLOSED, so its AccountingPeriod 2026-08 has subsystem_total_amount 217.75; business date 2026-08-02 then opened in the same period and left OPEN with no folios."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00.000Z" }
              as: PropertyAdmin
              as_user_id: "u_admin_1"
            - call: "POST /night-audit/properties"
              payload: { name: "Harbor Grand", room_count_total: 100, standard_room_rate_amount: 200.00, occupancy_tax_rate_pct: 8.875, fb_tax_rate_pct: 6.25, service_charge_pct: 18.0, large_ticket_threshold_amount: 472.00, large_party_discount_pct: 5.0, allowance_manager_threshold_amount: 250.00, allowance_controller_threshold_amount: 1000.00, rate_variance_tolerance_pct: 95.0, settlement_variance_tolerance_amount: 5.00, city_ledger_fee_pct: 1.5, late_checkout_grace_minutes: 30, card_authorization_valid_days: 7, no_show_charge_policy: "FIRST_NIGHT_PLUS_TAX" }
