              as: DeveloperAdmin
              captures: { a: $.data.id }
            - call: "POST /api/site-control-instruments/${a}/transitions"
              payload: { to: "EXECUTED" }
              as: DeveloperAdmin
            - call: "POST /api/projects/${p}/site-control-instruments"
              payload: { parcel_id: "PCL-W2", instrument_type: "LAND_OPTION", start_date: "2026-09-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", exercise_price_usd: 75000 }
              as: DeveloperAdmin
              captures: { b: $.data.id }
            - call: "POST /api/site-control-instruments/${b}/transitions"
