              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${ob4_id}/begin_vendor_review"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${ob4_id}/complete_vendor_review"
              payload: {}
