# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID / X-User-Role missing, unknown role, or entity-backed id does not resolve" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not in the endpoint's allowed role list" }
  - { id: ERR_FORBIDDEN_NOT_OWNER, http: 403, condition: "Entity-backed caller does not own the target resource (Rep vs registration/checkout/split, PrincipalOps vs principal-scoped resource)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, duplicate line_id within order/statement, non-positive quantity or amount where required" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Target entity state does not permit the requested transition (incl. terminal-state lockdown)" }
  - { id: ERR_STALE_PRINCIPAL_VERSION, http: 412, condition: "expected_principal_version != Principal.version on rate-schedule create" }
  - { id: ERR_STALE_ORDER_VERSION, http: 412, condition: "expected_order_version != Order.version on PUT splits" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Operation requires the principal's single ACTIVE TerritoryAgreement" }
  - { id: ERR_AGREEMENT_CONFLICT, http: 409, condition: "Another ACTIVE agreement already exists for the principal" }
  - { id: ERR_TERRITORY_NOT_COVERED, http: 409, condition: "An order line's spec or ship-to territory is outside the ACTIVE agreement's territory_codes" }
  - { id: ERR_NO_ACTIVE_RATE_SCHEDULE, http: 409, condition: "Order create/invoice requires an ACTIVE RateSchedule for the principal" }
  - { id: ERR_UNKNOWN_FAMILY_CODE, http: 422, condition: "A line's family_code is absent from the ACTIVE RateSchedule family_rates" }
  - { id: ERR_LINE_TERMINATED, http: 409, condition: "Principal TERMINATED blocks new orders, registrations, agreements, samples" }
  - { id: ERR_LINE_UNDER_TERMINATION_NOTICE, http: 409, condition: "Principal NOTICE_PENDING blocks new project registrations" }
  - { id: ERR_REP_ON_HOLD, http: 409, condition: "Rep COMMISSION_HOLD blocks registration submit/resubmit and sample checkout" }
  - { id: ERR_PROTECTION_WINDOW_OVERLAP, http: 409, condition: "New protection window [now, now+PROTECTION_DAYS) would overlap an existing APPROVED registration for the same (principal, customer, family_code); half-open: start == existing end is allowed" }
  - { id: ERR_CHECKOUT_WINDOW_CONFLICT, http: 409, condition: "Sample unit blocked: an OPEN checkout exists, or now < COALESCE(returned_at, due_at) + CHECKOUT_BUFFER_DAYS of the latest checkout" }
  - { id: ERR_RENEWAL_WINDOW_NOT_OPEN, http: 409, condition: "Renew attempted before protection_end - RENEWAL_WINDOW_DAYS or after protection_end" }
  - { id: ERR_RENEWAL_LIMIT_REACHED, http: 409, condition: "renewals_used == RENEWAL_LIMIT" }
  - { id: ERR_TAIL_PERIOD_EXPIRED, http: 409, condition: "Invoice of a pre-termination order attempted after termination_effective_at + tail_period_days, or order placed after effective date" }
  - { id: ERR_FUTURE_DATED, http: 422, condition: "placed_at is after the current logical clock" }
  - { id: ERR_CLOCK_REGRESSION, http: 409, condition: "set_current_utc to_iso8601 <= current logical clock" }
  - { id: ERR_SPLIT_SUM_INVALID, http: 422, condition: "PUT splits rows for any line do not sum to exactly 10000 bp, or a line is uncovered" }
  - { id: ERR_SPLITS_LOCKED, http: 409, condition: "PUT splits attempted after invoice (commission_status != ATTRIBUTED)" }
  - { id: ERR_DUPLICATE_EXTERNAL_REF, http: 409, condition: "external_order_ref already used by a non-CANCELLED order of this principal" }
  - { id: ERR_DUPLICATE_PERIOD_LABEL, http: 409, condition: "Statement period_label already exists for this principal" }
  - { id: ERR_DUPLICATE_SERIAL, http: 409, condition: "serial_number already registered for this principal" }
  - { id: ERR_TERRITORY_COVERAGE_CONFLICT, http: 409, condition: "Rep territory_codes overlap another ACTIVE rep" }
  - { id: ERR_RETURN_QTY_EXCEEDS_SHIPPED, http: 409, condition: "RMA line qty exceeds shipped_qty - returned_qty - qty on open (REQUESTED/APPROVED) RMAs for that line" }
  - { id: ERR_UNRESOLVED_DISPUTES, http: 409, condition: "Statement settle attempted while any line is DISPUTED" }
  - { id: ERR_LINES_NOT_DISPOSITIONED, http: 409, condition: "Statement settle attempted while lines remain PENDING / AMOUNT_VARIANCE / UNMATCHED_ORDER" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AgencyAdmin
    description: "Rep-firm operations manager: owns line cards, rate schedules, reps, customers, orders, splits, RMA intake, statement reconciliation and settlement, clock sweep"
    identity: opaque
    exclusive_operations:
      - "POST /rep-agency/principals"
      - "POST /rep-agency/principals/{id}/agreements + activate/suspend"
      - "POST /rep-agency/principals/{id}/rate-schedules"
      - "POST /rep-agency/reps + POST /rep-agency/reps/{id}/adjustments"
      - "POST /rep-agency/customers"
      - "POST /rep-agency/orders + cancel"
      - "POST /rep-agency/rmas"
      - "POST /rep-agency/statements/{id}/start_reconciliation / accept_variance / dispute / settle (segregation: principal uploads, agency settles)"
      - "POST /rep-agency/_clock/set_current_utc"
    shared_operations:
      - "PUT /rep-agency/orders/{id}/splits (shared with split-holding Rep)"
      - "All GET endpoints (shared with all roles)"
  - name: Rep
    description: "Individual salesperson of the agency; registers projects, checks out demo units, renegotiates splits on own orders"
    identity: "entity_backed:Rep"
    exclusive_operations:
      - "POST /rep-agency/project-registrations (+ resubmit / renew / withdraw own)"
      - "POST /rep-agency/sample-checkouts (+ return / convert own)"
    shared_operations:
      - "PUT /rep-agency/orders/{id}/splits (only when holding a split row on the order)"
      - "All GET endpoints"
  - name: PrincipalOps
    description: "Manufacturer-side operations user for one principal: registration approval, termination notices, order fulfillment events, RMA decisions/receipts, statement upload and dispute response, sample consignment"
    identity: "entity_backed:Principal"
    exclusive_operations:
      - "POST /rep-agency/principals/{id}/issue_termination_notice / rescind_termination_notice (own principal only)"
      - "POST /rep-agency/project-registrations/{id}/approve / reject"
      - "POST /rep-agency/orders/{id}/ship / invoice / mark_paid"
      - "POST /rep-agency/rmas/{id}/approve / reject / receive"
      - "POST /rep-agency/statements (upload) + respond_dispute (segregation: cannot settle)"
      - "POST /rep-agency/sample-units"
    shared_operations:
      - "All GET endpoints"
  - name: Auditor
    description: "Read-only oversight role"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"

