# =============================================================================
# Scaffold: Congregation Youth Program & Mission Trip Management
# =============================================================================

scenario: |
  Congregation Youth Program & Mission Trip Management (church youth ministry): participant registration & parental consent/medical forms, fundraising goal per participant & account tracking, trip logistics (travel/lodging/host site) & itinerary, chaperone ratio & background screening, code of conduct & discipline plan, insurance & emergency protocol abroad or out of state, payment deadlines & scholarship allocation, post-trip reporting & debrief

domain_name: congregation-youth-mission-trips
api_prefix: /youth-ministry

# =============================================================================
# §0: Complexity Profile — calibrated beyond the Expert band at user request
# ("harder than expert level"): 14 entities, 63 endpoints, 61 error codes,
# 12 calculation rules, 8 state machines (parallel dimensions + 2 cyclic +
# branching fork with divergent cascades), 2 OCC rules.
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency        # OCC on Program.version and Trip.version
    - cascading_side_effects        # trip cancel depth-3 cascade; screening depth-2 cascade
    - dual_variant_calculation      # provisional vs final cost share; gross vs net fundraising
    - ops_run_checkpoint            # logical-clock sweep: delinquency + screening expiry epochs
  entity_topology: flat             # all collections directly under api_prefix, FK-linked
  state_machine_shape: parallel     # Registration: registration_status x payment_status; plus cyclic machines on ConsentForm / ScholarshipApplication and branching fork on Trip
  relationship_patterns:
    - one_to_many                   # Program->Trip, Registration->ConsentForm/Payment, ...
    - many_to_many                  # Registration (Participant x Trip), ChaperoneAssignment (Chaperone x Trip)
    - cross_aggregate               # computed rollups read across aggregate boundaries (Trip.lodging_cost_total_cents, Program scholarship fund triple)
  role_model: segregation_of_duties # scholarship approver != disburser; reviewer != guardian
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities, flat topology)
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program name" }
      - { name: ministry_year, type: string, source: input, description: "Ministry year label, e.g. 2026-2027" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED", constraints: "initial OPEN; CLOSED terminal" }
      - { name: scholarship_fund_total_cents, type: integer, source: input, description: "Total scholarship fund pool in cents", constraints: ">= 0" }
      - { name: scholarship_reserved_cents, type: integer, source: computed, description: "Sum of award_cents over ScholarshipApplication in APPROVED" }
      - { name: scholarship_disbursed_cents, type: integer, source: computed, description: "Sum of award_cents over ScholarshipApplication in DISBURSED" }
      - { name: scholarship_available_cents, type: integer, source: computed, description: "scholarship_fund_total_cents - scholarship_reserved_cents - scholarship_disbursed_cents" }
      - { name: max_award_pct_bp, type: integer, source: input, description: "Max award as basis points of cost basis (10000 = 100%)", default: 5000, constraints: "0..10000" }
      - { name: per_registration_cap_cents, type: integer, source: input, description: "Absolute cap on any single scholarship award", default: 150000, constraints: ">= 0" }
      - { name: default_chaperone_ratio, type: integer, source: input, description: "Max youth per 1 cleared chaperone; trips may set stricter (lower) ratio", default: 5, constraints: ">= 1" }
      - { name: code_of_conduct_text, type: string, source: input, description: "Code of conduct every participant acknowledges via CONDUCT_AGREEMENT consent form" }
      - { name: discipline_policy_text, type: string, source: input, description: "Progressive discipline plan narrative applied by dismiss sanctions" }

  - name: Trip
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: name, type: string, source: input, description: "Trip name" }
      - { name: destination_name, type: string, source: input, description: "Destination city/site name" }
      - { name: destination_type, type: enum, source: input, description: "IN_STATE | OUT_OF_STATE | INTERNATIONAL" }
      - { name: start_date, type: string, source: input, description: "Trip start date ISO YYYY-MM-DD; must be strictly before end_date" }
      - { name: end_date, type: string, source: input, description: "Trip end date ISO YYYY-MM-DD" }
      - { name: capacity_youth, type: integer, source: input, description: "Max youth seats", constraints: ">= 1" }
      - { name: base_cost_cents, type: integer, source: input, description: "Per-participant base cost in cents", constraints: ">= 0" }
      - { name: deposit_cents, type: integer, source: input, description: "Deposit milestone per participant", constraints: "0 <= deposit_cents <= base_cost_cents" }
      - { name: chaperone_ratio, type: integer, source: input, description: "Youth per 1 cleared chaperone for this trip", constraints: ">= 1 and <= Program.default_chaperone_ratio" }
      - { name: required_insurance_tier, type: enum, source: computed, description: "NONE for IN_STATE, DOMESTIC for OUT_OF_STATE, INTERNATIONAL for INTERNATIONAL" }
      - { name: registration_open_at, type: string, source: input, description: "ISO datetime; trip may open registration only at/after this instant" }
      - { name: registration_close_at, type: string, source: input, description: "ISO datetime; new registrations rejected strictly after this instant" }
      - { name: deposit_due_at, type: string, source: input, description: "ISO datetime; deposit deadline for delinquency sweep" }
      - { name: final_payment_due_at, type: string, source: input, description: "ISO datetime; final balance deadline for delinquency sweep" }
      - { name: emergency_protocol_text, type: string, source: input, description: "Emergency protocol document; required non-empty before lock when destination_type != IN_STATE", default: "" }
      - { name: status, type: enum, source: system, description: "DRAFT | REGISTRATION_OPEN | REGISTRATION_CLOSED | ROSTER_LOCKED | IN_PROGRESS | DEBRIEFED | CANCELLED" }
      - { name: seats_taken, type: integer, source: computed, description: "Count of Registration with registration_status in {APPROVED, CONFIRMED}" }
      - { name: confirmed_youth_count, type: integer, source: computed, description: "Count of Registration with registration_status == CONFIRMED" }
      - { name: cleared_chaperone_count, type: integer, source: computed, description: "Count of ChaperoneAssignment status CONFIRMED whose chaperone holds a BackgroundCheck status CLEARED with expires_at >= trip end instant (end_date + 1 day 00:00:00Z)" }
      - { name: required_cleared_chaperones, type: integer, source: computed, description: "ceiling(confirmed_youth_count / chaperone_ratio)" }
      - { name: ratio_compliant, type: boolean, source: computed, description: "cleared_chaperone_count >= required_cleared_chaperones" }
      - { name: lodging_cost_total_cents, type: integer, source: computed, description: "Sum of cost_cents over LodgingReservation with status CONFIRMED" }
      - { name: debrief_summary, type: string, source: input, description: "Post-trip report narrative recorded at debrief", default: "" }
      - { name: debrief_actual_participant_count, type: integer, source: input, description: "Actual attendees reported at debrief", default: 0 }
      - { name: debrief_incident_count, type: integer, source: input, description: "Incidents reported at debrief", default: 0 }
      - { name: debrief_lessons_learned, type: string, source: input, description: "Lessons-learned narrative recorded at debrief", default: "" }
      - { name: debriefed_at, type: string, source: system, description: "ISO datetime of debrief transition; empty until DEBRIEFED", default: "" }

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: family_key, type: string, source: input, description: "Household grouping key; siblings share it (drives scholarship sibling bonus)" }
      - { name: guardian_user_id, type: string, source: system, description: "Owning guardian operator id: X-User-ID when created by Guardian; required input when created by ProgramDirector" }
      - { name: first_name, type: string, source: input, description: "Participant first name" }
      - { name: last_name, type: string, source: input, description: "Participant last name" }
      - { name: birth_date, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: grade, type: integer, source: input, description: "School grade 6..12", constraints: "6..12" }
      - { name: annual_income_bracket, type: enum, source: input, description: "BAND_A | BAND_B | BAND_C | BAND_D | UNDISCLOSED; household income self-report for scholarship need scoring" }
      - { name: household_size, type: integer, source: input, description: "Persons in household; feeds need score", constraints: ">= 1" }
      - { name: barred_until, type: string, source: system, description: "ISO datetime until which participant is barred by BARRED_FROM_FUTURE sanction; empty when not barred", default: "" }

  - name: Registration
    parent: null
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: input, description: "FK -> Trip.id" }
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id" }
      - { name: guardian_user_id, type: string, source: system, description: "Copied from Participant.guardian_user_id at creation; ownership anchor" }
      - { name: registration_status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | WAITLISTED | REJECTED | CONFIRMED | WITHDRAWN | DISMISSED | CANCELLED | COMPLETED" }
      - { name: payment_status, type: enum, source: system, description: "PENDING_DEPOSIT | PARTIALLY_PAID | PAID_IN_FULL | DELINQUENT | REFUNDED — parallel dimension to registration_status" }
      - { name: insurance_tier, type: enum, source: input, description: "NONE | DOMESTIC | INTERNATIONAL; must satisfy trip required_insurance_tier at roster lock" }
      - { name: provisional_cost_share_cents, type: integer, source: computed, description: "base_cost_cents + round_half_up(lodging_cost_total_cents / capacity_youth); recomputed on lodging changes while trip pre-lock" }
      - { name: final_cost_share_cents, type: integer, source: computed, description: "Set at roster lock: base_cost_cents + per-registration rounded lodging share with remainder waterfall; 0 before lock", default: 0 }
      - { name: late_fees_total_cents, type: integer, source: computed, description: "Sum of late fees assessed by delinquency sweeps", default: 0 }
      - { name: covered_cents, type: integer, source: computed, description: "Sum of Payment.amount_cents with status POSTED + fundraising_credit_applied_cents + scholarship_awarded_cents" }
      - { name: amount_due_cents, type: integer, source: computed, description: "(cost basis in force + late_fees_total_cents) - covered_cents; cost basis is provisional pre-lock, final post-lock" }
      - { name: fundraising_credit_applied_cents, type: integer, source: system, description: "Net fundraising credit moved onto this registration balance", default: 0 }
      - { name: scholarship_awarded_cents, type: integer, source: system, description: "Disbursed scholarship applied to this registration", default: 0 }
      - { name: conduct_acknowledged, type: boolean, source: system, description: "True once a CONDUCT_AGREEMENT consent form reaches VERIFIED", default: false }
      - { name: deposit_late_fee_assessed, type: boolean, source: system, description: "True once the deposit-milestone late fee has been assessed (sweep idempotency marker)", default: false }
      - { name: final_late_fee_assessed, type: boolean, source: system, description: "True once the final-milestone late fee has been assessed (sweep idempotency marker)", default: false }
      - { name: dismiss_sanction, type: enum, source: system, description: "SENT_HOME | BARRED_FROM_FUTURE; empty unless DISMISSED", default: "" }
      - { name: dismiss_reason, type: string, source: system, description: "Discipline rationale recorded at dismissal", default: "" }

  - name: ConsentForm
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: system, description: "FK -> Registration.id (from path)" }
      - { name: form_type, type: enum, source: input, description: "PARENTAL_CONSENT | MEDICAL_RELEASE | MEDIA_RELEASE | CONDUCT_AGREEMENT; first three are required, MEDIA_RELEASE optional" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VERIFIED | REJECTED | VOIDED; REJECTED -> SUBMITTED resubmission cycle" }
      - { name: signed_by_name, type: string, source: input, description: "Name of signing parent/guardian" }
      - { name: signed_at, type: string, source: input, description: "ISO datetime the guardian signed" }
      - { name: medical_notes, type: string, source: input, description: "Allergies/medications/conditions; required non-empty only for MEDICAL_RELEASE", default: "" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of reviewer at last verify/reject", default: "" }
      - { name: rejection_reason, type: string, source: system, description: "Reason recorded on reject; cleared on resubmit", default: "" }

  - name: FundraisingAccount
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: system, description: "FK -> Registration.id; one account auto-created per registration" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED; CLOSED when registration reaches a terminal status" }
      - { name: goal_cents, type: integer, source: input, description: "Per-participant fundraising goal", constraints: ">= 0" }
      - { name: raised_gross_cents, type: integer, source: computed, description: "Sum of Donation.amount_cents with status in {RECEIVED, APPLIED}" }
      - { name: fee_total_cents, type: integer, source: computed, description: "Sum of Donation.fee_cents with status in {RECEIVED, APPLIED}" }
      - { name: raised_net_cents, type: integer, source: computed, description: "raised_gross_cents - fee_total_cents" }
      - { name: credit_applied_cents, type: integer, source: system, description: "Net amount already moved onto the registration balance", default: 0 }
      - { name: available_credit_cents, type: integer, source: computed, description: "raised_net_cents - credit_applied_cents" }
      - { name: goal_met, type: boolean, source: computed, description: "raised_gross_cents >= goal_cents (boundary: equality counts)" }

  - name: Donation
    parent: null
    common_fields: true
    fields:
      - { name: fundraising_account_id, type: string, source: system, description: "FK -> FundraisingAccount.id (from path)" }
      - { name: donor_name, type: string, source: input, description: "Donor display name" }
      - { name: amount_cents, type: integer, source: input, description: "Donation amount", constraints: "> 0" }
      - { name: channel, type: enum, source: input, description: "CASH | CHECK | CARD_ONLINE; drives processing fee" }
      - { name: fee_cents, type: integer, source: computed, description: "CASH 0; CHECK flat 25; CARD_ONLINE round_half_up(0.029 * amount_cents) + 30" }
      - { name: status, type: enum, source: system, description: "RECEIVED | APPLIED | REFUNDED" }
      - { name: received_at, type: string, source: system, description: "ISO datetime from logical clock at creation" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: system, description: "FK -> Registration.id (from path)" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount", constraints: "> 0" }
      - { name: method, type: enum, source: input, description: "CASH | CHECK | CARD_ONLINE" }
      - { name: status, type: enum, source: system, description: "POSTED | REFUNDED" }
      - { name: posted_at, type: string, source: system, description: "ISO datetime from logical clock; lateness evaluated against posted_at" }

  - name: ScholarshipApplication
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id" }
      - { name: requested_cents, type: integer, source: input, description: "Amount requested", constraints: "> 0" }
      - { name: need_score, type: integer, source: computed, description: "0..100 weighted score recomputed at create and at decide time" }
      - { name: award_cents, type: integer, source: computed, description: "Computed at APPROVE decision via min-chain; 0 otherwise", default: 0 }
      - { name: status, type: enum, source: system, description: "UNDER_REVIEW | APPROVED | DENIED | DISBURSED | RESCINDED | RETURNED | WITHDRAWN; DENIED -> UNDER_REVIEW appeal cycle" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of ScholarshipReviewer who approved", default: "" }
      - { name: disbursed_by_user_id, type: string, source: system, description: "X-User-ID of Treasurer who disbursed; must differ from approved_by_user_id (segregation of duties)", default: "" }
      - { name: decision_reason, type: string, source: system, description: "Reason recorded at deny/rescind", default: "" }

  - name: Chaperone
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: first_name, type: string, source: input, description: "Chaperone first name" }
      - { name: last_name, type: string, source: input, description: "Chaperone last name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: current_screening_expires_at, type: string, source: computed, description: "expires_at of latest BackgroundCheck with status CLEARED; empty when none", default: "" }

  - name: BackgroundCheck
    parent: null
    common_fields: true
    fields:
      - { name: chaperone_id, type: string, source: system, description: "FK -> Chaperone.id (from path)" }
      - { name: status, type: enum, source: system, description: "INITIATED | SCREENING | CLEARED | FLAGGED | EXPIRED" }
      - { name: vendor_reference, type: string, source: input, description: "Screening vendor reference code", default: "" }
      - { name: cleared_at, type: string, source: system, description: "ISO datetime when CLEARED; empty otherwise", default: "" }
      - { name: expires_at, type: string, source: system, description: "cleared_at + 730 days; empty until CLEARED", default: "" }

  - name: ChaperoneAssignment
    parent: null
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: input, description: "FK -> Trip.id" }
      - { name: chaperone_id, type: string, source: input, description: "FK -> Chaperone.id" }
      - { name: role, type: enum, source: input, description: "LEAD | SUPPORT; at most one LEAD per trip among PROPOSED/CONFIRMED" }
      - { name: status, type: enum, source: system, description: "PROPOSED | CONFIRMED | DECLINED | REMOVED" }
      - { name: removal_reason, type: string, source: system, description: "MANUAL or AUTO_SCREENING when system removes on screening failure/expiry", default: "" }

  - name: ItineraryItem
    parent: null
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> Trip.id (from path)" }
      - { name: segment_type, type: enum, source: input, description: "TRAVEL | LODGING | SERVICE | MEAL | FREE" }
      - { name: title, type: string, source: input, description: "Item title" }
      - { name: start_at, type: string, source: input, description: "ISO datetime; must be < end_at and inside trip window [start_date 00:00:00Z, end_date+1day 00:00:00Z)" }
      - { name: end_at, type: string, source: input, description: "ISO datetime" }
      - { name: location, type: string, source: input, description: "Location label", default: "" }
      - { name: vehicle_code, type: string, source: input, description: "Vehicle resource code; required iff segment_type == TRAVEL", default: "" }

  - name: LodgingReservation
    parent: null
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> Trip.id (from path)" }
      - { name: site_name, type: string, source: input, description: "Hotel / host site name" }
      - { name: room_code, type: string, source: input, description: "Room resource code; half-open interval uniqueness scope is (trip_id, site_name, room_code)" }
      - { name: check_in_date, type: string, source: input, description: "ISO date; must be strictly before check_out_date" }
      - { name: check_out_date, type: string, source: input, description: "ISO date" }
      - { name: room_capacity, type: integer, source: input, description: "Beds in room", constraints: ">= 1" }
      - { name: cost_cents, type: integer, source: input, description: "Reservation cost feeding trip lodging rollup", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "CONFIRMED | CANCELLED" }

# =============================================================================
# §1.2 State Machine Table (8 machines)
# =============================================================================
state_machines:
  - entity: Program
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /youth-ministry/programs/{id}/close"
        actor: ProgramDirector
        preconditions:
          - "Program.status == OPEN"
          - "Every Trip with program_id == this program has status in {DEBRIEFED, CANCELLED} (ERR_PROGRAM_HAS_OPEN_TRIPS)"
        side_effects:
          - "Program.version increments by 1"

  - entity: Trip
    initial_state: DRAFT
    terminal_states: [DEBRIEFED, CANCELLED]
    transitions:
      - from: DRAFT
        to: REGISTRATION_OPEN
        trigger: "POST /youth-ministry/trips/{id}/open-registration"
        actor: ProgramDirector
        preconditions:
          - "Trip.status == DRAFT (ERR_TRIP_STATE_FORBIDS_ACTION)"
          - "Program.status == OPEN (ERR_PROGRAM_NOT_OPEN)"
          - "logical clock >= registration_open_at (ERR_REGISTRATION_WINDOW_CLOSED)"
        side_effects: ["Trip.version increments by 1"]

      - from: REGISTRATION_OPEN
        to: REGISTRATION_CLOSED
        trigger: "POST /youth-ministry/trips/{id}/close-registration"
        actor: ProgramDirector
        preconditions:
          - "Trip.status == REGISTRATION_OPEN (ERR_TRIP_STATE_FORBIDS_ACTION)"
        side_effects: ["Trip.version increments by 1"]

      - from: REGISTRATION_CLOSED
        to: ROSTER_LOCKED
        trigger: "POST /youth-ministry/trips/{id}/lock-roster"
        actor: ProgramDirector
        preconditions:
          - "Trip.status == REGISTRATION_CLOSED (ERR_TRIP_STATE_FORBIDS_ACTION)"
          - "SAFETY: ratio_compliant == true (ERR_CHAPERONE_RATIO_UNMET; with 0 confirmed the requirement is 0 and this passes vacuously)"
          - "SAFETY: every CONFIRMED Registration has insurance_tier at or above required_insurance_tier (NONE < DOMESTIC < INTERNATIONAL) (ERR_INSURANCE_TIER_INSUFFICIENT)"
          - "REFERENTIAL: confirmed_youth_count >= 1 (ERR_EMPTY_ROSTER)"
          - "CONSTRAINT: destination_type == IN_STATE OR emergency_protocol_text is non-empty (ERR_EMERGENCY_PROTOCOL_MISSING)"
          - "CONSTRAINT: sum of room_capacity over CONFIRMED LodgingReservation >= confirmed_youth_count + cleared_chaperone_count (ERR_LODGING_CAPACITY_INSUFFICIENT)"
          - "FISCAL: every CONFIRMED Registration has covered_cents >= Trip.deposit_cents (ERR_UNPAID_BALANCES_REMAIN)"
        side_effects:
          - "final_cost_share_cents computed for every CONFIRMED Registration per calculation final_cost_share (base + rounded lodging share + remainder waterfall by Registration.created_at ASC)"
          - "payment_status of every CONFIRMED Registration recomputed against final basis: covered_cents >= final share + late fees -> PAID_IN_FULL; else covered_cents >= deposit_cents -> PARTIALLY_PAID; else PENDING_DEPOSIT (a registration PAID_IN_FULL on the provisional basis can be downgraded)"
          - "Trip.version increments by 1"

      - from: ROSTER_LOCKED
        to: IN_PROGRESS
        trigger: "POST /youth-ministry/trips/{id}/start"
        actor: ProgramDirector
        preconditions:
          - "Trip.status == ROSTER_LOCKED (ERR_TRIP_STATE_FORBIDS_ACTION)"
          - "ratio_compliant == true re-evaluated at start time (ERR_CHAPERONE_RATIO_UNMET)"
          - "logical clock >= start_dateT00:00:00Z (ERR_TRIP_STATE_FORBIDS_ACTION)"
        side_effects: ["Trip.version increments by 1"]

      - from: IN_PROGRESS
        to: DEBRIEFED
        trigger: "POST /youth-ministry/trips/{id}/debrief"
        actor: ProgramDirector
        preconditions:
          - "Trip.status == IN_PROGRESS (ERR_TRIP_STATE_FORBIDS_ACTION)"
          - "logical clock >= end_date + 1 day 00:00:00Z (ERR_TRIP_STATE_FORBIDS_ACTION)"
        side_effects:
          - "debrief_summary / debrief_actual_participant_count / debrief_incident_count / debrief_lessons_learned recorded from payload; debriefed_at set from logical clock"
          - "Every Registration with registration_status == CONFIRMED auto-transitions to COMPLETED"
          - "Every still-OPEN FundraisingAccount of COMPLETED registrations transitions to CLOSED"
          - "Trip.version increments by 1"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /youth-ministry/trips/{id}/cancel"
        actor: ProgramDirector
        preconditions: ["Trip.status == DRAFT (ERR_TRIP_STATE_FORBIDS_ACTION otherwise)"]
        side_effects: ["No cascade: registrations cannot exist before REGISTRATION_OPEN", "Trip.version increments by 1"]
        note: "Branch with EMPTY side-effect set — diverges from the REGISTRATION_OPEN/CLOSED and ROSTER_LOCKED/IN_PROGRESS branches"

      - from: REGISTRATION_OPEN
        to: CANCELLED
        trigger: "POST /youth-ministry/trips/{id}/cancel"
        actor: ProgramDirector
        preconditions: []
        side_effects:
          - "Cascade hop 1: every Registration with registration_status in {DRAFT, SUBMITTED, APPROVED, WAITLISTED, CONFIRMED} -> CANCELLED"
          - "Cascade hop 2 (per cancelled Registration): its FundraisingAccount OPEN -> CLOSED; its ConsentForm in {SUBMITTED, VERIFIED, REJECTED} -> VOIDED; its ScholarshipApplication in UNDER_REVIEW -> WITHDRAWN, in APPROVED -> RESCINDED, in DISBURSED -> RETURNED; its Payment in POSTED -> REFUNDED and payment_status -> REFUNDED if any payment refunded"
          - "Cascade hop 3: each scholarship status change recomputes Program.scholarship_reserved_cents / scholarship_disbursed_cents / scholarship_available_cents (RESCINDED releases reserved; RETURNED releases disbursed)"
          - "Trip.version increments by 1"

      - from: REGISTRATION_CLOSED
        to: CANCELLED
        trigger: "POST /youth-ministry/trips/{id}/cancel"
        actor: ProgramDirector
        preconditions: []
        side_effects: ["Same cascade as REGISTRATION_OPEN -> CANCELLED", "Trip.version increments by 1"]

      - from: ROSTER_LOCKED
        to: CANCELLED
        trigger: "POST /youth-ministry/trips/{id}/cancel"
        actor: ProgramDirector
        preconditions: []
        side_effects: ["Same cascade as REGISTRATION_OPEN -> CANCELLED (final cost shares remain recorded on the cancelled registrations)", "Trip.version increments by 1"]

      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /youth-ministry/trips/{id}/cancel"
        actor: ProgramDirector
        preconditions: []
        side_effects: ["Same cascade as REGISTRATION_OPEN -> CANCELLED", "Trip.version increments by 1"]

  - entity: Registration
    initial_state: DRAFT
    terminal_states: [REJECTED, WITHDRAWN, DISMISSED, CANCELLED, COMPLETED]
    note: "TWO PARALLEL DIMENSIONS on one row: registration_status (this table) and payment_status (next table). Transitions in one dimension never change the other except where a side_effect says so."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /youth-ministry/registrations/{id}/submit"
        actor: "Guardian (owner) | ProgramDirector"
        preconditions:
          - "registration_status == DRAFT (ERR_REGISTRATION_STATE_FORBIDS_ACTION)"
          - "Trip.status == REGISTRATION_OPEN (ERR_TRIP_STATE_FORBIDS_ACTION)"
          - "All three required form types {PARENTAL_CONSENT, MEDICAL_RELEASE, CONDUCT_AGREEMENT} exist for this registration with status in {SUBMITTED, VERIFIED} (ERR_REQUIRED_FORMS_INCOMPLETE)"
        side_effects: ["Registration.version increments by 1"]

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /youth-ministry/registrations/{id}/review with decision=APPROVE, capacity branch"
        actor: "ProgramDirector | TripLeader"
        preconditions:
          - "registration_status == SUBMITTED (ERR_REGISTRATION_STATE_FORBIDS_ACTION)"
          - "Trip.status == REGISTRATION_OPEN (ERR_TRIP_STATE_FORBIDS_ACTION)"
          - "SoD: actor X-User-ID != Registration.guardian_user_id (ERR_SOD_VIOLATION)"
          - "All three required form types have status == VERIFIED (ERR_REQUIRED_FORMS_INCOMPLETE)"
          - "Participant.barred_until empty or < logical clock (ERR_PARTICIPANT_BARRED)"
          - "CAPACITY BRANCH: Trip.seats_taken < Trip.capacity_youth — else fork to WAITLISTED"
        side_effects: ["Trip.seats_taken recomputed", "Registration.version increments by 1"]

      - from: SUBMITTED
        to: WAITLISTED
        trigger: "POST /youth-ministry/registrations/{id}/review with decision=APPROVE when Trip.seats_taken >= Trip.capacity_youth"
        actor: "ProgramDirector | TripLeader"
        preconditions:
          - "Same as SUBMITTED -> APPROVED except the capacity branch is taken (seats_taken >= capacity_youth)"
        side_effects: ["Registration.version increments by 1"]
        note: "Waitlisting is a SUCCESS branch, not an error"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /youth-ministry/registrations/{id}/review with decision=REJECT"
        actor: "ProgramDirector | TripLeader"
        preconditions:
          - "registration_status == SUBMITTED (ERR_REGISTRATION_STATE_FORBIDS_ACTION)"
          - "SoD: actor X-User-ID != Registration.guardian_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "FundraisingAccount OPEN -> CLOSED"
          - "ConsentForms in {SUBMITTED, VERIFIED, REJECTED} -> VOIDED"
          - "Registration.version increments by 1"

      - from: WAITLISTED
        to: APPROVED
        trigger: "POST /youth-ministry/registrations/{id}/promote"
        actor: "ProgramDirector | TripLeader"
        preconditions:
          - "registration_status == WAITLISTED (ERR_REGISTRATION_STATE_FORBIDS_ACTION)"
          - "Trip.status == REGISTRATION_OPEN (ERR_TRIP_STATE_FORBIDS_ACTION)"
          - "Trip.seats_taken < Trip.capacity_youth (ERR_NO_WAITLIST_CAPACITY)"
          - "This registration is the waitlist head: minimum created_at among WAITLISTED registrations of this trip; tie-break Participant.created_at ASC (ERR_WAITLIST_NOT_HEAD)"
        side_effects: ["Trip.seats_taken recomputed", "Registration.version increments by 1"]

      - from: APPROVED
        to: CONFIRMED
        trigger: "POST /youth-ministry/registrations/{id}/confirm"
        actor: ProgramDirector
        preconditions:
          - "registration_status == APPROVED (ERR_REGISTRATION_STATE_FORBIDS_ACTION)"
          - "Trip.status in {REGISTRATION_OPEN, REGISTRATION_CLOSED} (ERR_TRIP_STATE_FORBIDS_ACTION)"
          - "covered_cents >= Trip.deposit_cents (boundary: equality passes) (ERR_DEPOSIT_NOT_COVERED)"
        side_effects: ["Trip.seats_taken and confirmed_youth_count recomputed; ratio_compliant re-evaluated", "Registration.version increments by 1"]

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /youth-ministry/registrations/{id}/withdraw"
        actor: "Guardian (owner) | ProgramDirector"
        preconditions: ["registration_status in {DRAFT, SUBMITTED, APPROVED, WAITLISTED, CONFIRMED} (ERR_REGISTRATION_STATE_FORBIDS_ACTION)"]
        side_effects: ["FundraisingAccount OPEN -> CLOSED; ConsentForms non-VOIDED -> VOIDED", "Registration.version increments by 1"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /youth-ministry/registrations/{id}/withdraw"
        actor: "Guardian (owner) | ProgramDirector"
        preconditions: []
        side_effects: ["Same as DRAFT -> WITHDRAWN"]
      - from: WAITLISTED
        to: WITHDRAWN
        trigger: "POST /youth-ministry/registrations/{id}/withdraw"
        actor: "Guardian (owner) | ProgramDirector"
        preconditions: []
        side_effects: ["Same as DRAFT -> WITHDRAWN"]
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /youth-ministry/registrations/{id}/withdraw"
        actor: "Guardian (owner) | ProgramDirector"
        preconditions: []
        side_effects:
          - "All Payment POSTED -> REFUNDED (system auto-refund); payment_status -> REFUNDED if at least one payment refunded"
          - "ScholarshipApplication UNDER_REVIEW -> WITHDRAWN; APPROVED -> RESCINDED; DISBURSED -> RETURNED; Program fund triple recomputed per hop"
          - "FundraisingAccount OPEN -> CLOSED; ConsentForms non-VOIDED -> VOIDED"
          - "Trip.seats_taken recomputed"
          - "Registration.version increments by 1"
      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "POST /youth-ministry/registrations/{id}/withdraw"
        actor: "Guardian (owner) | ProgramDirector"
        preconditions: ["Trip.status != IN_PROGRESS (a CONFIRMED registration on an in-progress trip can only leave via dismiss)"]
        side_effects:
          - "Same as APPROVED -> WITHDRAWN plus: Trip.confirmed_youth_count recomputed and ratio_compliant re-evaluated"
          - "If Trip.status == ROSTER_LOCKED, final shares are NOT recomputed (lock is immutable); the withdrawn registration keeps its recorded final_cost_share_cents"

      - from: CONFIRMED
        to: DISMISSED
        trigger: "POST /youth-ministry/registrations/{id}/dismiss"
        actor: ProgramDirector
        preconditions:
          - "registration_status == CONFIRMED (ERR_REGISTRATION_STATE_FORBIDS_ACTION)"
          - "Trip.status == IN_PROGRESS (ERR_TRIP_STATE_FORBIDS_ACTION)"
          - "sanction in {SENT_HOME, BARRED_FROM_FUTURE} (ERR_INVALID_ENUM)"
        side_effects:
          - "dismiss_sanction and dismiss_reason recorded"
          - "If sanction == BARRED_FROM_FUTURE: Participant.barred_until := logical clock + 730 days"
          - "Cascade hop 1: FundraisingAccount OPEN -> CLOSED; ConsentForms non-VOIDED -> VOIDED"
          - "Cascade hop 1: ScholarshipApplication UNDER_REVIEW -> WITHDRAWN; APPROVED -> RESCINDED (DISBURSED retained — funds already spent are not clawed back on dismissal)"
          - "Cascade hop 2: Trip.confirmed_youth_count recomputed; ratio_compliant re-evaluated (dismissal can flip a locked trip out of ratio compliance, blocking nothing retroactively but visible on reads)"
          - "No payment auto-refund on dismissal"
          - "Registration.version increments by 1"

      - from: CONFIRMED
        to: COMPLETED
        trigger: "system (cascade from Trip debrief)"
        actor: system
        preconditions: []
        side_effects: ["FundraisingAccount OPEN -> CLOSED"]

      - from: DRAFT
        to: CANCELLED
        trigger: "system (cascade from Trip cancel)"
        actor: system
        preconditions: []
        side_effects: ["Per-registration cancel cascade as specified on Trip cancel (account CLOSED, forms VOIDED, scholarship transitions, payment auto-refund)"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: "system (cascade from Trip cancel)"
        actor: system
        preconditions: []
        side_effects: ["Same as DRAFT -> CANCELLED"]
      - from: APPROVED
        to: CANCELLED
        trigger: "system (cascade from Trip cancel)"
        actor: system
        preconditions: []
        side_effects: ["Same as DRAFT -> CANCELLED"]
      - from: WAITLISTED
        to: CANCELLED
        trigger: "system (cascade from Trip cancel)"
        actor: system
        preconditions: []
        side_effects: ["Same as DRAFT -> CANCELLED"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system (cascade from Trip cancel)"
        actor: system
        preconditions: []
        side_effects: ["Same as DRAFT -> CANCELLED"]

  - entity: RegistrationPaymentDimension
    note: "Parallel state dimension on Registration: field payment_status. Evolves via payment/refund/apply-credit/disburse postings and via delinquency sweeps."
    initial_state: PENDING_DEPOSIT
    terminal_states: [REFUNDED]
    transitions:
      - from: PENDING_DEPOSIT
        to: PARTIALLY_PAID
        trigger: "system recompute on Payment POST / refund, apply-credit, scholarship disburse, or roster lock"
        actor: system
        preconditions: ["deposit_cents <= covered_cents < (cost basis in force + late_fees_total_cents)"]
        side_effects: []
      - from: PENDING_DEPOSIT
        to: PAID_IN_FULL
        trigger: "system recompute"
        actor: system
        preconditions: ["covered_cents >= cost basis in force + late_fees_total_cents and that total > 0"]
        side_effects: []
      - from: PARTIALLY_PAID
        to: PAID_IN_FULL
        trigger: "system recompute"
        actor: system
        preconditions: ["covered_cents >= cost basis in force + late_fees_total_cents"]
        side_effects: []
      - from: PARTIALLY_PAID
        to: PENDING_DEPOSIT
        trigger: "system recompute after Payment refund drops covered_cents below deposit_cents"
        actor: system
        preconditions: ["covered_cents < deposit_cents"]
        side_effects: []
      - from: PAID_IN_FULL
        to: PARTIALLY_PAID
        trigger: "system recompute (refund, or roster lock replacing provisional basis with a HIGHER final basis)"
        actor: system
        preconditions: ["deposit_cents <= covered_cents < total due in force"]
        side_effects: []
      - from: PENDING_DEPOSIT
        to: DELINQUENT
        trigger: "system delinquency sweep on POST /youth-ministry/_clock/set_current_utc when new clock > Trip.deposit_due_at and covered_cents < deposit_cents and registration_status in {APPROVED, CONFIRMED}"
        actor: system
        preconditions: []
        side_effects: ["late fee assessed: max(2500, round_half_up(0.05 * amount_due_cents at sweep)) added to late_fees_total_cents"]
      - from: PARTIALLY_PAID
        to: DELINQUENT
        trigger: "system sweep when new clock > Trip.final_payment_due_at and amount_due_cents > 0 and registration_status in {APPROVED, CONFIRMED}"
        actor: system
        preconditions: []
        side_effects: ["late fee assessed on the outstanding balance at sweep time"]
      - from: DELINQUENT
        to: PARTIALLY_PAID
        trigger: "system recompute on Payment posting when the currently-due milestone is satisfied (clock <= final_payment_due_at: covered_cents >= deposit_cents; clock > final_payment_due_at: only full coverage cures)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DELINQUENT
        to: PAID_IN_FULL
        trigger: "system recompute on Payment posting / disburse / apply-credit when covered_cents >= total due in force"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING_DEPOSIT
        to: REFUNDED
        trigger: "system on withdraw / trip cancel when at least one Payment transitions POSTED -> REFUNDED"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_PAID
        to: REFUNDED
        trigger: "system on withdraw / trip cancel"
        actor: system
        preconditions: []
        side_effects: []
      - from: PAID_IN_FULL
        to: REFUNDED
        trigger: "system on withdraw / trip cancel"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ConsentForm
    initial_state: SUBMITTED
    terminal_states: [VOIDED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /youth-ministry/consent-forms/{id}/review with decision=VERIFY"
        actor: "ProgramDirector | TripLeader"
        preconditions:
          - "ConsentForm.status == SUBMITTED (ERR_CONSENT_FORM_STATE_FORBIDS_ACTION)"
          - "Registration.registration_status in {DRAFT, SUBMITTED} (ERR_REGISTRATION_STATE_FORBIDS_ACTION)"
          - "SoD: actor X-User-ID != Registration.guardian_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "reviewed_by_user_id set from X-User-ID"
          - "If form_type == CONDUCT_AGREEMENT: Registration.conduct_acknowledged := true"
          - "ConsentForm.version increments by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /youth-ministry/consent-forms/{id}/review with decision=REJECT"
        actor: "ProgramDirector | TripLeader"
        preconditions:
          - "ConsentForm.status == SUBMITTED (ERR_CONSENT_FORM_STATE_FORBIDS_ACTION)"
          - "Registration.registration_status in {DRAFT, SUBMITTED} (ERR_REGISTRATION_STATE_FORBIDS_ACTION)"
          - "SoD: actor X-User-ID != Registration.guardian_user_id (ERR_SOD_VIOLATION)"
        side_effects: ["reviewed_by_user_id and rejection_reason recorded", "ConsentForm.version increments by 1"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /youth-ministry/consent-forms/{id}/resubmit"
        actor: "Guardian (owner) | ProgramDirector"
        preconditions:
          - "ConsentForm.status == REJECTED (ERR_CONSENT_FORM_STATE_FORBIDS_ACTION)"
          - "Registration.registration_status in {DRAFT, SUBMITTED} (ERR_REGISTRATION_STATE_FORBIDS_ACTION)"
        side_effects: ["signed_by_name / signed_at / medical_notes replaced from payload; rejection_reason cleared", "ConsentForm.version increments by 1"]
        note: "CYCLE: SUBMITTED -> REJECTED -> SUBMITTED is unbounded"
      - from: SUBMITTED
        to: VOIDED
        trigger: "system (registration reaches REJECTED / WITHDRAWN / DISMISSED / CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: VERIFIED
        to: VOIDED
        trigger: "system (registration terminal cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: VOIDED
        trigger: "system (registration terminal cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ScholarshipApplication
    initial_state: UNDER_REVIEW
    terminal_states: [DISBURSED, RESCINDED, RETURNED, WITHDRAWN]
    transitions:
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /youth-ministry/scholarship-applications/{id}/decide with decision=APPROVE"
        actor: ScholarshipReviewer
        preconditions:
          - "status == UNDER_REVIEW (ERR_APPLICATION_STATE_FORBIDS_ACTION)"
          - "Registration.registration_status in {APPROVED, CONFIRMED} (ERR_REGISTRATION_STATE_FORBIDS_ACTION)"
          - "SoD: actor X-User-ID != Registration.guardian_user_id (ERR_SOD_VIOLATION)"
          - "FISCAL: Program.scholarship_available_cents > 0 (ERR_SCHOLARSHIP_FUND_EXHAUSTED)"
          - "FISCAL: computed award_cents > 0 (ERR_AWARD_WOULD_BE_ZERO)"
        side_effects:
          - "need_score recomputed at decision time; award_cents computed via scholarship_award min-chain"
          - "Program.scholarship_reserved_cents += award_cents; scholarship_available_cents -= award_cents"
          - "approved_by_user_id := X-User-ID"
          - "version increments by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /youth-ministry/scholarship-applications/{id}/decide with decision=DENY"
        actor: ScholarshipReviewer
        preconditions: ["status == UNDER_REVIEW (ERR_APPLICATION_STATE_FORBIDS_ACTION)"]
        side_effects: ["decision_reason recorded from payload", "version increments by 1"]
      - from: DENIED
        to: UNDER_REVIEW
        trigger: "POST /youth-ministry/scholarship-applications/{id}/appeal"
        actor: "Guardian (owner) | ProgramDirector"
        preconditions:
          - "status == DENIED (ERR_APPLICATION_STATE_FORBIDS_ACTION)"
          - "Registration.registration_status in {APPROVED, CONFIRMED} (ERR_REGISTRATION_STATE_FORBIDS_ACTION)"
        side_effects: ["decision_reason cleared", "version increments by 1"]
        note: "CYCLE: UNDER_REVIEW -> DENIED -> UNDER_REVIEW is unbounded"
      - from: APPROVED
        to: DISBURSED
        trigger: "POST /youth-ministry/scholarship-applications/{id}/disburse"
        actor: Treasurer
        preconditions:
          - "status == APPROVED (ERR_APPLICATION_STATE_FORBIDS_ACTION)"
          - "Registration.registration_status in {APPROVED, CONFIRMED} (ERR_REGISTRATION_STATE_FORBIDS_ACTION)"
          - "SoD: X-User-ID != approved_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "Program.scholarship_reserved_cents -= award_cents; scholarship_disbursed_cents += award_cents (available unchanged)"
          - "Registration.scholarship_awarded_cents := award_cents; covered_cents and payment_status recomputed"
          - "disbursed_by_user_id := X-User-ID"
          - "version increments by 1"
      - from: APPROVED
        to: RESCINDED
        trigger: "POST /youth-ministry/scholarship-applications/{id}/rescind OR system cascade (registration withdraw / trip cancel)"
        actor: "ScholarshipReviewer | system"
        preconditions: ["status == APPROVED (ERR_APPLICATION_STATE_FORBIDS_ACTION for the manual endpoint)"]
        side_effects: ["Program.scholarship_reserved_cents -= award_cents; scholarship_available_cents += award_cents", "version increments by 1"]
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "system cascade (registration withdraw / dismiss / trip cancel)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISBURSED
        to: RETURNED
        trigger: "system cascade (registration withdraw or trip cancel; NOT on dismiss)"
        actor: system
        preconditions: []
        side_effects: ["Program.scholarship_disbursed_cents -= award_cents; scholarship_available_cents += award_cents", "Registration.scholarship_awarded_cents := 0 and covered_cents recomputed", "version increments by 1"]

  - entity: BackgroundCheck
    initial_state: INITIATED
    terminal_states: [FLAGGED, EXPIRED]
    transitions:
      - from: INITIATED
        to: SCREENING
        trigger: "POST /youth-ministry/background-checks/{id}/advance with to_status=SCREENING"
        actor: ProgramDirector
        preconditions: ["status == INITIATED (ERR_CHECK_STATE_FORBIDS_ACTION)"]
        side_effects: ["version increments by 1"]
      - from: SCREENING
        to: CLEARED
        trigger: "POST /youth-ministry/background-checks/{id}/advance with to_status=CLEARED"
        actor: ProgramDirector
        preconditions: ["status == SCREENING (ERR_CHECK_STATE_FORBIDS_ACTION)"]
        side_effects:
          - "cleared_at := logical clock; expires_at := cleared_at + 730 days"
          - "Chaperone.current_screening_expires_at recomputed (max expires_at over CLEARED checks)"
          - "version increments by 1"
      - from: SCREENING
        to: FLAGGED
        trigger: "POST /youth-ministry/background-checks/{id}/advance with to_status=FLAGGED"
        actor: ProgramDirector
        preconditions: ["status == SCREENING (ERR_CHECK_STATE_FORBIDS_ACTION)"]
        side_effects:
          - "Cascade hop 1: every ChaperoneAssignment for this chaperone in {PROPOSED, CONFIRMED} -> REMOVED with removal_reason=AUTO_SCREENING"
          - "Cascade hop 2: for each affected Trip, cleared_chaperone_count recomputed and ratio_compliant re-evaluated"
          - "Chaperone.current_screening_expires_at recomputed"
          - "version increments by 1"
      - from: CLEARED
        to: EXPIRED
        trigger: "system sweep on POST /youth-ministry/_clock/set_current_utc when new clock >= expires_at"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade hop 1: every ChaperoneAssignment for this chaperone in {PROPOSED, CONFIRMED} whose trip end instant >= expires_at -> REMOVED with removal_reason=AUTO_SCREENING"
          - "Cascade hop 2: affected Trip cleared_chaperone_count / ratio_compliant recomputed"
          - "Chaperone.current_screening_expires_at recomputed"
          - "version increments by 1"

  - entity: ChaperoneAssignment
    initial_state: PROPOSED
    terminal_states: [DECLINED, REMOVED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /youth-ministry/chaperone-assignments/{id}/respond with decision=ACCEPT"
        actor: "Chaperone (own: X-User-ID == chaperone_id)"
        preconditions: ["status == PROPOSED (ERR_ASSIGNMENT_STATE_FORBIDS_ACTION)"]
        side_effects: ["Trip.cleared_chaperone_count / ratio_compliant recomputed", "version increments by 1"]
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /youth-ministry/chaperone-assignments/{id}/respond with decision=DECLINE"
        actor: "Chaperone (own)"
        preconditions: ["status == PROPOSED (ERR_ASSIGNMENT_STATE_FORBIDS_ACTION)"]
        side_effects: ["version increments by 1"]
      - from: PROPOSED
        to: REMOVED
        trigger: "POST /youth-ministry/chaperone-assignments/{id}/remove OR system cascade (screening FLAGGED/EXPIRED)"
        actor: "ProgramDirector | TripLeader | system"
        preconditions: ["status in {PROPOSED, CONFIRMED} (ERR_ASSIGNMENT_STATE_FORBIDS_ACTION for the manual endpoint)"]
        side_effects: ["removal_reason recorded (MANUAL or AUTO_SCREENING)", "Trip counts recomputed", "version increments by 1"]
      - from: CONFIRMED
        to: REMOVED
        trigger: "POST /youth-ministry/chaperone-assignments/{id}/remove OR system cascade"
        actor: "ProgramDirector | TripLeader | system"
        preconditions: []
        side_effects: ["Same as PROPOSED -> REMOVED"]

  - entity: FundraisingAccount
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "system cascade (registration reaches REJECTED / WITHDRAWN / DISMISSED / CANCELLED / COMPLETED)"
        actor: system
        preconditions: []
        side_effects: ["Donations in RECEIVED stay refundable; APPLIED credits already moved are unaffected"]

  - entity: Donation
    initial_state: RECEIVED
    terminal_states: [APPLIED, REFUNDED]
    transitions:
      - from: RECEIVED
        to: APPLIED
        trigger: "system on POST /youth-ministry/fundraising-accounts/{id}/apply-credit (all RECEIVED donations are swept into the credit)"
        actor: system
        preconditions: []
        side_effects: ["Account rollups recomputed"]
      - from: RECEIVED
        to: REFUNDED
        trigger: "POST /youth-ministry/donations/{id}/refund"
        actor: Treasurer
        preconditions: ["status == RECEIVED (ERR_DONATION_STATE_FORBIDS_ACTION); an APPLIED donation can never be refunded"]
        side_effects: ["raised_gross_cents / fee_total_cents / raised_net_cents / available_credit_cents recomputed (refunded donation leaves all four sums)", "version increments by 1"]

  - entity: Payment
    initial_state: POSTED
    terminal_states: [REFUNDED]
    transitions:
      - from: POSTED
        to: REFUNDED
        trigger: "POST /youth-ministry/payments/{id}/refund OR system auto-refund on withdraw / trip cancel"
        actor: "Treasurer | system"
        preconditions: ["status == POSTED (ERR_PAYMENT_STATE_FORBIDS_ACTION for the manual endpoint)"]
        side_effects: ["Registration.covered_cents and payment_status recomputed (can downgrade PARTIALLY_PAID -> PENDING_DEPOSIT or PAID_IN_FULL -> PARTIALLY_PAID)", "version increments by 1"]

  - entity: LodgingReservation
    initial_state: CONFIRMED
    terminal_states: [CANCELLED]
    transitions:
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /youth-ministry/lodging-reservations/{id}/cancel"
        actor: TripLeader
        preconditions: ["status == CONFIRMED (ERR_LODGING_STATE_FORBIDS_ACTION)", "Trip.status in {DRAFT, REGISTRATION_OPEN, REGISTRATION_CLOSED} (ERR_TRIP_STATE_FORBIDS_ACTION — logistics frozen at ROSTER_LOCKED)"]
        side_effects:
          - "Trip.lodging_cost_total_cents recomputed"
          - "If trip is pre-lock, provisional_cost_share_cents recomputed for every Registration in {DRAFT, SUBMITTED, APPROVED, WAITLISTED, CONFIRMED} and their amount_due_cents recomputed"
          - "version increments by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: scholarship-policy-stale-program
    parent_entity: Program
    write_endpoint: "PUT /youth-ministry/programs/{id}/scholarship-policy"
    occ_field: expected_program_version
    description: |
      Updating the scholarship policy of a Program whose version has advanced
      since the client last read it is rejected: the client edited a stale
      snapshot of max_award_pct_bp / per_registration_cap_cents and would
      silently overwrite another operator's policy change. Detected by
      comparing expected_program_version against Program.version; the check is
      fully reproducible with two strictly sequential PUTs.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
  - rule_id: trip-edit-stale-trip
    parent_entity: Trip
    write_endpoint: "PATCH /youth-ministry/trips/{id}"
    occ_field: expected_trip_version
    description: |
      Editing Trip logistics fields (capacity_youth, chaperone_ratio,
      emergency_protocol_text, name) against a stale Trip.version is rejected,
      because any lifecycle transition or earlier edit advances the version
      and the editor's view of capacity/ratio commitments is no longer
      current. Reproducible with two strictly sequential PATCHes.
    error_id: ERR_STALE_TRIP_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (12 rules)
# =============================================================================
calculations:
  - name: provisional_cost_share
    trigger: "Registration creation; recomputed for every non-terminal Registration whenever Trip.lodging_cost_total_cents changes while Trip.status in {DRAFT, REGISTRATION_OPEN, REGISTRATION_CLOSED}"
    algorithm: forward_looking
    formula: |
      provisional_cost_share_cents = Trip.base_cost_cents
        + round_half_up(Trip.lodging_cost_total_cents / Trip.capacity_youth)
      Planned-headcount denominator: divides by capacity_youth even if fewer
      registrations exist. If capacity_youth is edited (PATCH), all
      provisional shares are recomputed.
    input_set: "Trip row + sum of cost_cents over LodgingReservation status == CONFIRMED"
    precision: "integer cents; round_half_up on the division"
    variants:
      - name: final_basis
        when: "at roster lock"
        difference: "See final_cost_share: divides by CONFIRMED headcount and waterfalls remainder cents — identical inputs can produce a different per-person share"

  - name: final_cost_share
    trigger: "POST /youth-ministry/trips/{id}/lock-roster success"
    algorithm: waterfall_allocation
    formula: |
      Let N = confirmed_youth_count, L = Trip.lodging_cost_total_cents.
      If N == 0 the lock is rejected (ERR_EMPTY_ROSTER), so N >= 1 here.
      share = round_half_up(L / N)                      # per-person rounded share
      delta = L - N * share                             # signed remainder cents
      Order CONFIRMED registrations by created_at ASC (tie-break: Participant.created_at ASC).
      Walk that order applying one cent of delta per registration (sign follows
      delta) until delta == 0; with |delta| < N each registration is touched at
      most once. The pin is ROUND-THEN-SUM: the alternative sum-then-round
      ordering is rejected.
      final_cost_share_cents(i) = Trip.base_cost_cents + share + adjustment(i)
    input_set: "Registrations with registration_status == CONFIRMED at lock"
    precision: "integer cents; round_half_up; remainder distributed one cent at a time"

  - name: donation_fee
    trigger: "Donation creation"
    algorithm: tiered_pricing
    formula: |
      CASH:        fee_cents = 0
      CHECK:       fee_cents = 25
      CARD_ONLINE: fee_cents = round_half_up(0.029 * amount_cents) + 30
    constants:
      CARD_PCT: 0.029
      CARD_FLAT_CENTS: 30
      CHECK_FLAT_CENTS: 25
    precision: "integer cents; percentage component round_half_up BEFORE adding the flat component (rounding order pinned)"

  - name: fundraising_positions
    trigger: "Donation create / refund; apply-credit"
    algorithm: aggregation
    formula: |
      raised_gross_cents = SUM(amount_cents)  over Donation status in {RECEIVED, APPLIED}
      fee_total_cents    = SUM(fee_cents)     over the same set
      raised_net_cents   = raised_gross_cents - fee_total_cents
      available_credit_cents = raised_net_cents - credit_applied_cents
      goal_met           = (goal_cents > 0 AND raised_gross_cents >= goal_cents)
    input_set: "Donations of this account; REFUNDED donations excluded from every sum"
    variants:
      - name: gross_basis
        when: "donor-facing goal progress (goal_met) and scholarship fundraising bonus"
        difference: "uses raised_gross_cents — fees ignored"
      - name: net_basis
        when: "apply-credit moves money onto the trip balance"
        difference: "uses raised_net_cents — only fee-free value is creditable; identical donation data yields credit < progress"

  - name: need_score
    trigger: "ScholarshipApplication creation and again inside decide (recomputed, not stored stale)"
    algorithm: weighted_scoring
    formula: |
      income_base: BAND_A=50, BAND_B=35, BAND_C=20, BAND_D=5, UNDISCLOSED=0
      size_bonus   = min(20, 5 * max(0, household_size - 2))
      sibling_bonus = min(20, 10 * count(other Registrations on the same trip
                    whose Participant.family_key == this Participant.family_key
                    AND registration_status in {APPROVED, CONFIRMED}))
      fundraising_bonus = 10 if account.goal_cents > 0 and raised_gross_cents >= goal_cents
                          else 5 if raised_gross_cents > 0
                          else 0
      need_score = min(100, income_base + size_bonus + sibling_bonus + fundraising_bonus)
    input_set: "Participant of the registration; sibling set filtered by status {APPROVED, CONFIRMED}; the registration's FundraisingAccount gross position"
    constants:
      CAP_TOTAL: 100
      CAP_SIZE_BONUS: 20
      CAP_SIBLING_BONUS: 20
    precision: "integer points; each bonus capped BEFORE the total cap (cap order pinned)"

  - name: scholarship_award
    trigger: "POST /youth-ministry/scholarship-applications/{id}/decide with decision=APPROVE"
    algorithm: waterfall_allocation
    formula: |
      Evaluation order is PINNED (breaks the apparent circle award<->balance):
      1. need_score recomputed per need_score rule from CURRENT data
      2. cost_basis = provisional_cost_share_cents if Trip.status in
         {DRAFT, REGISTRATION_OPEN, REGISTRATION_CLOSED}
         else final_cost_share_cents (ROSTER_LOCKED or later)
         — cost_basis NEVER includes late fees, prior fundraising credit, or
         any scholarship (this registration's or others')
      3. need_cap = round_half_up(need_score / 100 * max_award_pct_bp / 10000 * cost_basis)
      4. award_cents = min(requested_cents, need_cap,
                           Program.per_registration_cap_cents,
                           Program.scholarship_available_cents)
      5. Gate order: if scholarship_available_cents <= 0 -> ERR_SCHOLARSHIP_FUND_EXHAUSTED;
         else if award_cents <= 0 -> ERR_AWARD_WOULD_BE_ZERO; else approve.
    input_set: "the application, its Registration + Trip, the Program policy + fund triple"
    precision: "integer cents; need_cap round_half_up; min-chain evaluated exactly as written"

  - name: chaperone_requirement
    trigger: "recomputed on every mutation of confirmed_youth_count, chaperone_ratio, or the CONFIRMED-assignment / CLEARED-check sets"
    algorithm: threshold
    formula: |
      required_cleared_chaperones = ceiling(confirmed_youth_count / chaperone_ratio)
      cleared_chaperone_count = count of ChaperoneAssignment status == CONFIRMED
        whose chaperone has a BackgroundCheck status == CLEARED
        with expires_at >= (Trip.end_date + 1 day)T00:00:00Z   # valid THROUGH trip end, boundary inclusive
      ratio_compliant = cleared_chaperone_count >= required_cleared_chaperones
    precision: "exact integer ceiling; boundary at exact multiples of the ratio"

  - name: late_fee_assessment
    trigger: "delinquency sweep inside POST /youth-ministry/_clock/set_current_utc"
    algorithm: threshold
    formula: |
      Sweep A (deposit): fires for registration_status in {APPROVED, CONFIRMED}
        when new_clock > Trip.deposit_due_at AND covered_cents < deposit_cents
        AND no deposit late fee has been assessed yet for this registration.
      Sweep B (final): same states, new_clock > Trip.final_payment_due_at
        AND amount_due_cents > 0 AND no final late fee assessed yet.
      fee = max(LATE_FEE_FLAT_CENTS, round_half_up(LATE_FEE_PCT * amount_due_cents at sweep))
      Each sweep assesses at most one fee per registration per milestone
      (idempotent across repeated clock sets that stay past the same deadline).
      A registration missing BOTH deadlines can collect two fees.
      Boundary: new_clock == due_at does NOT trigger (strict >).
    constants:
      LATE_FEE_FLAT_CENTS: 2500
      LATE_FEE_PCT: 0.05
    precision: "integer cents; percentage round_half_up; flat-vs-percentage resolved by max"

  - name: payment_status_rollup
    trigger: "every Payment create/refund, apply-credit, scholarship disburse/return, delinquency sweep, roster lock"
    algorithm: aggregation
    formula: |
      covered_cents = SUM(Payment.amount_cents where status == POSTED)
                      + fundraising_credit_applied_cents + scholarship_awarded_cents
      due_total     = (final_cost_share_cents if Trip.status past lock else
                       provisional_cost_share_cents) + late_fees_total_cents
      amount_due_cents = max(0, due_total - covered_cents)
      baseline status: covered_cents >= due_total and due_total > 0 -> PAID_IN_FULL
                       elif covered_cents >= Trip.deposit_cents    -> PARTIALLY_PAID
                       else                                        -> PENDING_DEPOSIT
      DELINQUENT overlays the baseline; cured per the payment-dimension rules.
      REFUNDED only via withdraw/cancel auto-refund of at least one payment.
    input_set: "Payments of this registration + the two applied-money fields + fee accumulator"

  - name: lodging_cost_rollup
    trigger: "LodgingReservation create / cancel"
    algorithm: aggregation
    formula: |
      Trip.lodging_cost_total_cents = SUM(cost_cents) over LodgingReservation
        of this trip with status == CONFIRMED
      Side chain: any change while pre-lock recomputes provisional_cost_share_cents
      for every non-terminal Registration (derived-field reconciliation).

  - name: waitlist_head_selector
    trigger: "POST /youth-ministry/registrations/{id}/promote"
    algorithm: selector
    formula: |
      candidate set: Registrations of this trip with registration_status == WAITLISTED
      ranking: created_at ASC; tie-break: Participant.created_at ASC
      promote is legal only for the head of this order (ERR_WAITLIST_NOT_HEAD);
      empty candidate set makes the endpoint unreachable (state error first).
      id is NEVER a tie-break input.

  - name: scholarship_fund_rollup
    trigger: "scholarship approve / disburse / rescind / system RETURNED cascade / WITHDRAWN cascade"
    algorithm: aggregation
    formula: |
      scholarship_reserved_cents  = SUM(award_cents) over status == APPROVED
      scholarship_disbursed_cents = SUM(award_cents) over status == DISBURSED
      scholarship_available_cents = scholarship_fund_total_cents - reserved - disbursed
      INVARIANT (conserved fund): reserved + disbursed + available
        == scholarship_fund_total_cents after every mutation.
    input_set: "ScholarshipApplications whose Registration.trip_id belongs to this Program"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins when
# a single request violates several rules)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role name"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Request body shape: required fields present, enum values in declared sets, integer ranges respected, check_out_date > check_in_date / end_date > start_date / end_at > start_at"
    error_id: "ERR_INVALID_REQUEST | ERR_INVALID_ENUM | ERR_INVALID_DATE_RANGE"
    http_status: 400
    applies_to: all endpoints with a body
  - priority: 3
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_ROLE_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right; body-referenced ids (trip_id, participant_id, chaperone_id, registration_id) exist"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_TRIP_NOT_FOUND | ERR_PARTICIPANT_NOT_FOUND | ERR_REGISTRATION_NOT_FOUND | ERR_CONSENT_FORM_NOT_FOUND | ERR_FUNDRAISING_ACCOUNT_NOT_FOUND | ERR_DONATION_NOT_FOUND | ERR_PAYMENT_NOT_FOUND | ERR_SCHOLARSHIP_APPLICATION_NOT_FOUND | ERR_CHAPERONE_NOT_FOUND | ERR_BACKGROUND_CHECK_NOT_FOUND | ERR_CHAPERONE_ASSIGNMENT_NOT_FOUND | ERR_LODGING_RESERVATION_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with resource ids
  - priority: 5
    category: auth
    check: "Ownership and segregation of duties: Guardian may act only on resources whose guardian_user_id == X-User-ID (ERR_NOT_RESOURCE_OWNER); Chaperone may respond only to assignments with chaperone_id == X-User-ID (ERR_NOT_RESOURCE_OWNER); reviewer of a registration/consent must not be its guardian_user_id (ERR_SOD_VIOLATION); scholarship disburser must differ from approved_by_user_id, and scholarship decide actor must differ from the registration's guardian_user_id (ERR_SOD_VIOLATION)"
    error_id: "ERR_NOT_RESOURCE_OWNER | ERR_SOD_VIOLATION"
    http_status: 403
    applies_to: "ownership-scoped and SoD endpoints"
  - priority: 6
    category: state
    check: "Target entity state precondition of the requested transition (per §1.2). Child-operation gates: registration create requires Trip REGISTRATION_OPEN; chaperone-assignment and itinerary-item create require Trip in {DRAFT, REGISTRATION_OPEN, REGISTRATION_CLOSED, ROSTER_LOCKED}; lodging create/cancel require {DRAFT, REGISTRATION_OPEN, REGISTRATION_CLOSED}; payment create and apply-credit require Registration in {APPROVED, CONFIRMED}; consent create/resubmit require Registration in {DRAFT, SUBMITTED}; creating trips/participants/chaperones requires Program.status == OPEN. When both a registration-state gate and an account-status gate fail, the registration-state error is returned first"
    error_id: "ERR_TRIP_STATE_FORBIDS_ACTION | ERR_REGISTRATION_STATE_FORBIDS_ACTION | ERR_CONSENT_FORM_STATE_FORBIDS_ACTION | ERR_APPLICATION_STATE_FORBIDS_ACTION | ERR_CHECK_STATE_FORBIDS_ACTION | ERR_ASSIGNMENT_STATE_FORBIDS_ACTION | ERR_DONATION_STATE_FORBIDS_ACTION | ERR_PAYMENT_STATE_FORBIDS_ACTION | ERR_LODGING_STATE_FORBIDS_ACTION | ERR_PROGRAM_NOT_OPEN | ERR_ACCOUNT_CLOSED"
    http_status: 409
    applies_to: state transition endpoints and state-gated creates
  - priority: 7
    category: state
    check: "OCC: expected_program_version == Program.version on PUT scholarship-policy; expected_trip_version == Trip.version on PATCH /trips/{id}"
    error_id: "ERR_STALE_PROGRAM_VERSION | ERR_STALE_TRIP_VERSION"
    http_status: 412
    applies_to: "PUT /youth-ministry/programs/{id}/scholarship-policy, PATCH /youth-ministry/trips/{id}"
  - priority: 8
    category: business_safety
    check: "Child-protection safety: participant not barred (ERR_PARTICIPANT_BARRED); chaperone screening CLEARED with expires_at >= trip end instant (ERR_SCREENING_NOT_VALID_THROUGH_TRIP); roster lock ratio satisfied (ERR_CHAPERONE_RATIO_UNMET); roster lock insurance tier satisfied per CONFIRMED registration (ERR_INSURANCE_TIER_INSUFFICIENT)"
    error_id: "ERR_PARTICIPANT_BARRED | ERR_SCREENING_NOT_VALID_THROUGH_TRIP | ERR_CHAPERONE_RATIO_UNMET | ERR_INSURANCE_TIER_INSUFFICIENT"
    http_status: 422
    applies_to: "registration create/review, chaperone-assignment create, trip lock-roster/start"
  - priority: 9
    category: business_referential
    check: "Required consent forms present/verified: submit needs all 3 required types in {SUBMITTED, VERIFIED}; review-APPROVE needs all 3 VERIFIED; MEDICAL_RELEASE requires non-empty medical_notes"
    error_id: ERR_REQUIRED_FORMS_INCOMPLETE
    http_status: 422
    applies_to: "registration submit/review, consent-form create/resubmit"
  - priority: 10
    category: business_temporal
    check: "Windows: registration create only while Trip REGISTRATION_OPEN and clock <= registration_close_at (ERR_REGISTRATION_WINDOW_CLOSED); itinerary item inside trip window (ERR_ITINERARY_OUTSIDE_TRIP_WINDOW); open-registration not before registration_open_at (ERR_REGISTRATION_WINDOW_CLOSED)"
    error_id: "ERR_REGISTRATION_WINDOW_CLOSED | ERR_ITINERARY_OUTSIDE_TRIP_WINDOW"
    http_status: 422
    applies_to: "registration create, itinerary-item create, trip open-registration"
  - priority: 11
    category: business_constraint
    check: "Uniqueness/overlap/capacity: one non-terminal registration per (trip, participant) ERR_DUPLICATE_REGISTRATION; one consent form per type in {SUBMITTED, VERIFIED} ERR_DUPLICATE_CONSENT_FORM_TYPE; one scholarship application per registration in {UNDER_REVIEW, APPROVED} ERR_DUPLICATE_ACTIVE_APPLICATION; one non-terminal background check per chaperone ERR_SCREENING_IN_PROGRESS_EXISTS; one LEAD per trip ERR_DUPLICATE_LEAD_CHAPERONE; one non-terminal assignment per (trip, chaperone) ERR_DUPLICATE_ASSIGNMENT; room half-open overlap ERR_ROOM_ALREADY_BOOKED; vehicle 45-min buffer ERR_VEHICLE_SCHEDULE_CONFLICT; chaperone closed-interval trip overlap ERR_CHAPERONE_TRIP_OVERLAP; PATCH capacity floor ERR_CAPACITY_FLOOR; waitlist promotion head/capacity ERR_WAITLIST_NOT_HEAD / ERR_NO_WAITLIST_CAPACITY; lock-roster structural gates ERR_EMPTY_ROSTER / ERR_EMERGENCY_PROTOCOL_MISSING / ERR_LODGING_CAPACITY_INSUFFICIENT"
    error_id: "ERR_DUPLICATE_REGISTRATION | ERR_DUPLICATE_CONSENT_FORM_TYPE | ERR_DUPLICATE_ACTIVE_APPLICATION | ERR_SCREENING_IN_PROGRESS_EXISTS | ERR_DUPLICATE_LEAD_CHAPERONE | ERR_DUPLICATE_ASSIGNMENT | ERR_ROOM_ALREADY_BOOKED | ERR_VEHICLE_SCHEDULE_CONFLICT | ERR_CHAPERONE_TRIP_OVERLAP | ERR_CAPACITY_FLOOR | ERR_WAITLIST_NOT_HEAD | ERR_NO_WAITLIST_CAPACITY | ERR_EMPTY_ROSTER | ERR_EMERGENCY_PROTOCOL_MISSING | ERR_LODGING_CAPACITY_INSUFFICIENT"
    http_status: 409
    applies_to: "create/action endpoints as named"
  - priority: 12
    category: business_fiscal
    check: "Money gates, checked LAST: confirm deposit coverage (ERR_DEPOSIT_NOT_COVERED); lock-roster deposit lapse (ERR_UNPAID_BALANCES_REMAIN); scholarship fund availability and zero-award (ERR_SCHOLARSHIP_FUND_EXHAUSTED, ERR_AWARD_WOULD_BE_ZERO); apply-credit non-zero availability (ERR_NO_CREDIT_AVAILABLE)"
    error_id: "ERR_DEPOSIT_NOT_COVERED | ERR_UNPAID_BALANCES_REMAIN | ERR_SCHOLARSHIP_FUND_EXHAUSTED | ERR_AWARD_WOULD_BE_ZERO | ERR_NO_CREDIT_AVAILABLE"
    http_status: 402
    applies_to: "registration confirm, trip lock-roster, scholarship decide, apply-credit"
    note: "ERR_AWARD_WOULD_BE_ZERO and ERR_NO_CREDIT_AVAILABLE use http 422 despite the fiscal grouping — the error catalog's http column is authoritative per error"

# =============================================================================
# §1.6 Error Code Catalog (61 codes)
# =============================================================================
errors:
  # --- request/auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not one of the declared role names" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, wrong type, or integer range violated (amount_cents <= 0, grade outside 6..12, capacity_youth < 1, etc.)" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field value outside its declared set (including decision/to_status/sanction values)" }
  - { id: ERR_INVALID_DATE_RANGE, http: 400, condition: "start >= end on any date/datetime pair (trip dates, lodging dates, itinerary times)" }
  - { id: ERR_ROLE_FORBIDDEN, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Guardian acting on another guardian's resource, or Chaperone responding to another chaperone's assignment" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties: reviewer is the resource's guardian_user_id, or scholarship disburser equals approved_by_user_id" }
  # --- existence (404) ---
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "program id does not exist" }
  - { id: ERR_TRIP_NOT_FOUND, http: 404, condition: "trip id does not exist" }
  - { id: ERR_PARTICIPANT_NOT_FOUND, http: 404, condition: "participant id does not exist" }
  - { id: ERR_REGISTRATION_NOT_FOUND, http: 404, condition: "registration id does not exist" }
  - { id: ERR_CONSENT_FORM_NOT_FOUND, http: 404, condition: "consent form id does not exist" }
  - { id: ERR_FUNDRAISING_ACCOUNT_NOT_FOUND, http: 404, condition: "fundraising account id does not exist" }
  - { id: ERR_DONATION_NOT_FOUND, http: 404, condition: "donation id does not exist" }
  - { id: ERR_PAYMENT_NOT_FOUND, http: 404, condition: "payment id does not exist" }
  - { id: ERR_SCHOLARSHIP_APPLICATION_NOT_FOUND, http: 404, condition: "scholarship application id does not exist" }
  - { id: ERR_CHAPERONE_NOT_FOUND, http: 404, condition: "chaperone id does not exist" }
  - { id: ERR_BACKGROUND_CHECK_NOT_FOUND, http: 404, condition: "background check id does not exist" }
  - { id: ERR_CHAPERONE_ASSIGNMENT_NOT_FOUND, http: 404, condition: "chaperone assignment id does not exist" }
  - { id: ERR_LODGING_RESERVATION_NOT_FOUND, http: 404, condition: "lodging reservation id does not exist" }
  # --- state (409) ---
  - { id: ERR_PROGRAM_NOT_OPEN, http: 409, condition: "Operation requires Program.status == OPEN" }
  - { id: ERR_PROGRAM_HAS_OPEN_TRIPS, http: 409, condition: "Program close blocked: some trip not in {DEBRIEFED, CANCELLED}" }
  - { id: ERR_TRIP_STATE_FORBIDS_ACTION, http: 409, condition: "Trip not in the state required by this transition or child operation" }
  - { id: ERR_REGISTRATION_STATE_FORBIDS_ACTION, http: 409, condition: "Registration not in the state required for this operation" }
  - { id: ERR_CONSENT_FORM_STATE_FORBIDS_ACTION, http: 409, condition: "Consent form not in the state required (review needs SUBMITTED; resubmit needs REJECTED)" }
  - { id: ERR_APPLICATION_STATE_FORBIDS_ACTION, http: 409, condition: "Scholarship application not in the state required by decide/appeal/disburse/rescind" }
  - { id: ERR_CHECK_STATE_FORBIDS_ACTION, http: 409, condition: "Background check advance target not reachable from current status" }
  - { id: ERR_ASSIGNMENT_STATE_FORBIDS_ACTION, http: 409, condition: "Chaperone assignment not PROPOSED (respond) or not PROPOSED/CONFIRMED (remove)" }
  - { id: ERR_DONATION_STATE_FORBIDS_ACTION, http: 409, condition: "Donation refund requires status RECEIVED; APPLIED/REFUNDED cannot refund" }
  - { id: ERR_PAYMENT_STATE_FORBIDS_ACTION, http: 409, condition: "Payment refund requires status POSTED" }
  - { id: ERR_LODGING_STATE_FORBIDS_ACTION, http: 409, condition: "Lodging cancel requires status CONFIRMED" }
  - { id: ERR_ACCOUNT_CLOSED, http: 409, condition: "Donation create or apply-credit against a CLOSED FundraisingAccount" }
  # --- business safety (422/409) ---
  - { id: ERR_PARTICIPANT_BARRED, http: 409, condition: "Participant barred_until is set and >= logical clock (registration create / review-APPROVE)" }
  - { id: ERR_SCREENING_NOT_VALID_THROUGH_TRIP, http: 422, condition: "Chaperone has no CLEARED background check with expires_at >= trip end instant" }
  - { id: ERR_CHAPERONE_RATIO_UNMET, http: 422, condition: "cleared_chaperone_count < ceiling(confirmed_youth_count / chaperone_ratio) at lock-roster or start" }
  - { id: ERR_INSURANCE_TIER_INSUFFICIENT, http: 422, condition: "A CONFIRMED registration's insurance_tier ranks below the trip required_insurance_tier at lock" }
  # --- referential / temporal ---
  - { id: ERR_REQUIRED_FORMS_INCOMPLETE, http: 422, condition: "Required consent form types missing or not in the required status set" }
  - { id: ERR_REGISTRATION_WINDOW_CLOSED, http: 422, condition: "Clock strictly after registration_close_at on create, or before registration_open_at on open-registration" }
  - { id: ERR_ITINERARY_OUTSIDE_TRIP_WINDOW, http: 422, condition: "Itinerary item times outside [trip start 00:00:00Z, trip end+1day 00:00:00Z)" }
  # --- constraint (409/422) ---
  - { id: ERR_DUPLICATE_REGISTRATION, http: 409, condition: "Non-terminal registration already exists for (trip_id, participant_id)" }
  - { id: ERR_DUPLICATE_CONSENT_FORM_TYPE, http: 409, condition: "A consent form of this type already exists in {SUBMITTED, VERIFIED} for the registration" }
  - { id: ERR_DUPLICATE_ACTIVE_APPLICATION, http: 409, condition: "Registration already has an application in {UNDER_REVIEW, APPROVED}" }
  - { id: ERR_SCREENING_IN_PROGRESS_EXISTS, http: 409, condition: "Chaperone already has a background check in {INITIATED, SCREENING}" }
  - { id: ERR_DUPLICATE_LEAD_CHAPERONE, http: 409, condition: "Trip already has a LEAD assignment in {PROPOSED, CONFIRMED}" }
  - { id: ERR_DUPLICATE_ASSIGNMENT, http: 409, condition: "Non-terminal assignment already exists for (trip_id, chaperone_id)" }
  - { id: ERR_ROOM_ALREADY_BOOKED, http: 409, condition: "Half-open [check_in_date, check_out_date) overlap on same (trip_id, site_name, room_code); adjacent (checkout == checkin) is allowed" }
  - { id: ERR_VEHICLE_SCHEDULE_CONFLICT, http: 409, condition: "TRAVEL items on same vehicle_code require a 45-minute turnaround gap; touching intervals violate it" }
  - { id: ERR_CHAPERONE_TRIP_OVERLAP, http: 409, condition: "Chaperone already PROPOSED/CONFIRMED on another trip whose closed [start_date, end_date] intersects (shared boundary dates DO conflict)" }
  - { id: ERR_CAPACITY_FLOOR, http: 409, condition: "PATCH capacity_youth below current Trip.seats_taken" }
  - { id: ERR_WAITLIST_NOT_HEAD, http: 409, condition: "Promote target is not the waitlist head (created_at ASC, tie Participant.created_at ASC)" }
  - { id: ERR_NO_WAITLIST_CAPACITY, http: 409, condition: "Promote while Trip.seats_taken >= capacity_youth" }
  - { id: ERR_EMPTY_ROSTER, http: 422, condition: "lock-roster with confirmed_youth_count == 0" }
  - { id: ERR_EMERGENCY_PROTOCOL_MISSING, http: 422, condition: "lock-roster on OUT_OF_STATE/INTERNATIONAL trip with empty emergency_protocol_text" }
  - { id: ERR_LODGING_CAPACITY_INSUFFICIENT, http: 422, condition: "lock-roster: CONFIRMED lodging beds < confirmed_youth_count + cleared_chaperone_count" }
  # --- fiscal ---
  - { id: ERR_DEPOSIT_NOT_COVERED, http: 402, condition: "confirm: covered_cents < Trip.deposit_cents (equality passes)" }
  - { id: ERR_UNPAID_BALANCES_REMAIN, http: 402, condition: "lock-roster: a CONFIRMED registration has covered_cents < deposit_cents (deposit lapsed via refund)" }
  - { id: ERR_SCHOLARSHIP_FUND_EXHAUSTED, http: 402, condition: "decide-APPROVE while Program.scholarship_available_cents <= 0" }
  - { id: ERR_AWARD_WOULD_BE_ZERO, http: 422, condition: "decide-APPROVE computes award_cents == 0 through the min-chain" }
  - { id: ERR_NO_CREDIT_AVAILABLE, http: 422, condition: "apply-credit with available_credit_cents == 0" }
  # --- OCC ---
  - { id: ERR_STALE_PROGRAM_VERSION, http: 412, condition: "expected_program_version != current Program.version" }
  - { id: ERR_STALE_TRIP_VERSION, http: 412, condition: "expected_trip_version != current Trip.version" }

# =============================================================================
# §1.5 API Endpoint Table (63 endpoints; all collections flat under prefix)
# =============================================================================
endpoints:
  # --- test-driving logical clock ---
  - method: POST
    path: "/youth-ministry/_clock/set-current-utc"
    description: "Set the logical clock (ops-run epoch advance). DEFAULT: before any call the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock. On each set, the system runs the delinquency sweep (late_fee_assessment) and the background-check EXPIRED sweep with their cascades."
    roles: [ProgramDirector]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["delinquency sweep A/B per late_fee_assessment (may set payment_status DELINQUENT and assess late fees)", "BackgroundCheck CLEARED -> EXPIRED sweep with AUTO_SCREENING removal cascade", "all recomputed rollups refreshed"]

  # --- Program ---
  - method: POST
    path: "/youth-ministry/programs"
    description: "Create a youth program (starts OPEN)"
    roles: [ProgramDirector]
    code: 201
    input: [name, ministry_year, scholarship_fund_total_cents, code_of_conduct_text, discipline_policy_text, "max_award_pct_bp?", "per_registration_cap_cents?", "default_chaperone_ratio?"]
    output: Program
    side_effects: ["status=OPEN; fund triple initialized (reserved=0, disbursed=0, available=total)"]
  - method: GET
    path: "/youth-ministry/programs/{id}"
    description: "Read one program including scholarship fund triple and policy"
    roles: [ProgramDirector, TripLeader, Treasurer, ScholarshipReviewer, Guardian, Chaperone]
    code: 200
    input: []
    output: Program
    side_effects: []
  - method: PUT
    path: "/youth-ministry/programs/{id}/scholarship-policy"
    description: "Replace scholarship award policy (OCC-guarded read-modify-write)"
    roles: [ProgramDirector]
    code: 200
    input: [max_award_pct_bp, per_registration_cap_cents, expected_program_version]
    output: Program
    side_effects: ["policy fields replaced", "increments Program.version by 1"]
  - method: POST
    path: "/youth-ministry/programs/{id}/close"
    description: "Close the program; requires every trip in {DEBRIEFED, CANCELLED}"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Program
    side_effects: ["status -> CLOSED", "increments Program.version by 1"]

  # --- Trip ---
  - method: POST
    path: "/youth-ministry/trips"
    description: "Create a trip in DRAFT under a program"
    roles: [ProgramDirector]
    code: 201
    input: [program_id, name, destination_name, destination_type, start_date, end_date, capacity_youth, base_cost_cents, deposit_cents, chaperone_ratio, registration_open_at, registration_close_at, deposit_due_at, final_payment_due_at, "emergency_protocol_text?"]
    output: Trip
    side_effects: ["status=DRAFT", "required_insurance_tier computed from destination_type", "rollups zeroed"]
  - method: GET
    path: "/youth-ministry/trips"
    description: "List trips; optional filters"
    roles: [ProgramDirector, TripLeader, Treasurer, ScholarshipReviewer, Guardian, Chaperone]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: "Trip[]"
    side_effects: []
  - method: GET
    path: "/youth-ministry/trips/{id}"
    description: "Read one trip including computed roster/ratio/lodging fields"
    roles: [ProgramDirector, TripLeader, Treasurer, ScholarshipReviewer, Guardian, Chaperone]
    code: 200
    input: []
    output: Trip
    side_effects: []
  - method: PATCH
    path: "/youth-ministry/trips/{id}"
    description: "Edit trip logistics fields (OCC-guarded). capacity_youth may not drop below seats_taken (ERR_CAPACITY_FLOOR); editing capacity recomputes pre-lock provisional shares; not allowed once IN_PROGRESS or later"
    roles: [ProgramDirector]
    code: 200
    input: ["name?", "capacity_youth?", "chaperone_ratio?", "emergency_protocol_text?", expected_trip_version]
    output: Trip
    side_effects: ["fields applied", "provisional shares recomputed when capacity_youth changes pre-lock", "increments Trip.version by 1"]
  - method: POST
    path: "/youth-ministry/trips/{id}/open-registration"
    description: "DRAFT -> REGISTRATION_OPEN"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Trip
    side_effects: ["status transition", "increments Trip.version by 1"]
  - method: POST
    path: "/youth-ministry/trips/{id}/close-registration"
    description: "REGISTRATION_OPEN -> REGISTRATION_CLOSED"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Trip
    side_effects: ["status transition", "increments Trip.version by 1"]
  - method: POST
    path: "/youth-ministry/trips/{id}/lock-roster"
    description: "REGISTRATION_CLOSED -> ROSTER_LOCKED; runs the full safety/referential/constraint/fiscal gate chain and computes final cost shares with remainder waterfall"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Trip
    side_effects: ["final_cost_share computed for each CONFIRMED registration", "payment_status recomputed on final basis (downgrades possible)", "status transition", "increments Trip.version by 1"]
  - method: POST
    path: "/youth-ministry/trips/{id}/start"
    description: "ROSTER_LOCKED -> IN_PROGRESS; re-checks ratio compliance and trip start date"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Trip
    side_effects: ["status transition", "increments Trip.version by 1"]
  - method: POST
    path: "/youth-ministry/trips/{id}/debrief"
    description: "IN_PROGRESS -> DEBRIEFED; records post-trip report and debrief metrics; CONFIRMED registrations auto-complete"
    roles: [ProgramDirector]
    code: 200
    input: [debrief_summary, debrief_actual_participant_count, debrief_incident_count, debrief_lessons_learned]
    output: Trip
    side_effects: ["report fields recorded, debriefed_at set", "CONFIRMED registrations -> COMPLETED, their OPEN accounts -> CLOSED", "status transition", "increments Trip.version by 1"]
  - method: POST
    path: "/youth-ministry/trips/{id}/cancel"
    description: "-> CANCELLED from any non-terminal state; branch-dependent cascade (empty from DRAFT; full depth-3 cascade otherwise)"
    roles: [ProgramDirector]
    code: 200
    input: ["reason?"]
    output: Trip
    side_effects: ["non-terminal registrations -> CANCELLED with per-registration cascade (accounts CLOSED, forms VOIDED, scholarships WITHDRAWN/RESCINDED/RETURNED, payments auto-refunded)", "Program fund triple recomputed per scholarship hop", "status transition", "increments Trip.version by 1"]

  # --- Participant ---
  - method: POST
    path: "/youth-ministry/participants"
    description: "Register a youth participant. Guardian creators own the record (guardian_user_id := X-User-ID); ProgramDirector must pass guardian_user_id explicitly"
    roles: [ProgramDirector, Guardian]
    code: 201
    input: [program_id, family_key, first_name, last_name, birth_date, grade, annual_income_bracket, household_size, "guardian_user_id?"]
    output: Participant
    side_effects: ["barred_until empty"]
  - method: GET
    path: "/youth-ministry/participants"
    description: "List participants; optional filters"
    roles: [ProgramDirector, TripLeader, Treasurer]
    code: 200
    input: ["program_id?", "family_key?", "limit?", "offset?"]
    output: "Participant[]"
    side_effects: []
  - method: GET
    path: "/youth-ministry/participants/{id}"
    description: "Read one participant (Guardian limited to own)"
    roles: [ProgramDirector, TripLeader, Treasurer, Guardian]
    code: 200
    input: []
    output: Participant
    side_effects: []

  # --- Registration ---
  - method: POST
    path: "/youth-ministry/registrations"
    description: "Create a registration (DRAFT / PENDING_DEPOSIT) and auto-open its FundraisingAccount"
    roles: [ProgramDirector, Guardian]
    code: 201
    input: [trip_id, participant_id, insurance_tier, fundraising_goal_cents]
    output: Registration
    side_effects: ["FundraisingAccount created OPEN with goal_cents := fundraising_goal_cents", "provisional_cost_share_cents computed", "guardian_user_id copied from Participant"]
  - method: GET
    path: "/youth-ministry/registrations"
    description: "List registrations; optional filters"
    roles: [ProgramDirector, TripLeader, Treasurer]
    code: 200
    input: ["trip_id?", "participant_id?", "registration_status?", "payment_status?", "limit?", "offset?"]
    output: "Registration[]"
    side_effects: []
  - method: GET
    path: "/youth-ministry/registrations/{id}"
    description: "Read one registration (Guardian limited to own)"
    roles: [ProgramDirector, TripLeader, Treasurer, ScholarshipReviewer, Guardian]
    code: 200
    input: []
    output: Registration
    side_effects: []
  - method: POST
    path: "/youth-ministry/registrations/{id}/submit"
    description: "DRAFT -> SUBMITTED; all 3 required consent forms must exist in {SUBMITTED, VERIFIED}"
    roles: [ProgramDirector, Guardian]
    code: 200
    input: []
    output: Registration
    side_effects: ["registration_status -> SUBMITTED", "increments Registration.version by 1"]
  - method: POST
    path: "/youth-ministry/registrations/{id}/review"
    description: "SUBMITTED -> APPROVED (capacity available) or WAITLISTED (capacity full) on decision=APPROVE; SUBMITTED -> REJECTED on decision=REJECT. Reviewer must not be the guardian (SoD)"
    roles: [ProgramDirector, TripLeader]
    code: 200
    input: [decision, "reason?"]
    output: Registration
    side_effects: ["branch transition per capacity fork", "on REJECT: account CLOSED + forms VOIDED", "increments Registration.version by 1"]
  - method: POST
    path: "/youth-ministry/registrations/{id}/promote"
    description: "WAITLISTED -> APPROVED for the waitlist head while seats remain"
    roles: [ProgramDirector, TripLeader]
    code: 200
    input: []
    output: Registration
    side_effects: ["registration_status -> APPROVED", "Trip.seats_taken recomputed", "increments Registration.version by 1"]
  - method: POST
    path: "/youth-ministry/registrations/{id}/confirm"
    description: "APPROVED -> CONFIRMED; requires covered_cents >= deposit_cents (equality passes)"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Registration
    side_effects: ["registration_status -> CONFIRMED", "Trip seats/confirmed counts and ratio recomputed", "increments Registration.version by 1"]
  - method: POST
    path: "/youth-ministry/registrations/{id}/withdraw"
    description: "-> WITHDRAWN from any non-terminal registration_status; auto-refunds POSTED payments from APPROVED/CONFIRMED and cascades account/forms/scholarship"
    roles: [ProgramDirector, Guardian]
    code: 200
    input: ["reason?"]
    output: Registration
    side_effects: ["payments POSTED -> REFUNDED (payment_status -> REFUNDED when any)", "scholarship WITHDRAWN/RESCINDED/RETURNED hop recomputes Program fund triple", "account CLOSED, forms VOIDED", "Trip counts recomputed", "increments Registration.version by 1"]
  - method: POST
    path: "/youth-ministry/registrations/{id}/dismiss"
    description: "CONFIRMED -> DISMISSED during an IN_PROGRESS trip; BARRED_FROM_FUTURE sets Participant.barred_until = clock + 730 days"
    roles: [ProgramDirector]
    code: 200
    input: [sanction, reason]
    output: Registration
    side_effects: ["sanction recorded; Participant.barred_until set when BARRED_FROM_FUTURE", "account CLOSED, forms VOIDED, scholarship UNDER_REVIEW->WITHDRAWN / APPROVED->RESCINDED (DISBURSED retained)", "Trip confirmed count and ratio recomputed", "increments Registration.version by 1"]

  # --- ConsentForm ---
  - method: POST
    path: "/youth-ministry/registrations/{id}/consent-forms"
    description: "Submit a consent/medical/media/conduct form (starts SUBMITTED). One form per type in {SUBMITTED, VERIFIED}; MEDICAL_RELEASE requires medical_notes"
    roles: [ProgramDirector, Guardian]
    code: 201
    input: [form_type, signed_by_name, signed_at, "medical_notes?"]
    output: ConsentForm
    side_effects: ["status=SUBMITTED"]
  - method: GET
    path: "/youth-ministry/registrations/{id}/consent-forms"
    description: "List consent forms of a registration (Guardian limited to own)"
    roles: [ProgramDirector, TripLeader, Guardian]
    code: 200
    input: ["limit?", "offset?"]
    output: "ConsentForm[]"
    side_effects: []
  - method: POST
    path: "/youth-ministry/consent-forms/{id}/review"
    description: "SUBMITTED -> VERIFIED (decision=VERIFY) or REJECTED (decision=REJECT); reviewer must not be the guardian (SoD)"
    roles: [ProgramDirector, TripLeader]
    code: 200
    input: [decision, "reason?"]
    output: ConsentForm
    side_effects: ["status transition; reviewed_by_user_id recorded; CONDUCT_AGREEMENT verify sets Registration.conduct_acknowledged=true", "increments ConsentForm.version by 1"]
  - method: POST
    path: "/youth-ministry/consent-forms/{id}/resubmit"
    description: "REJECTED -> SUBMITTED with corrected content (cycle)"
    roles: [ProgramDirector, Guardian]
    code: 200
    input: [signed_by_name, signed_at, "medical_notes?"]
    output: ConsentForm
    side_effects: ["status -> SUBMITTED; rejection_reason cleared", "increments ConsentForm.version by 1"]

  # --- Payment ---
  - method: POST
    path: "/youth-ministry/registrations/{id}/payments"
    description: "Post a payment against a registration in {APPROVED, CONFIRMED}; posted_at taken from the logical clock"
    roles: [Treasurer, Guardian]
    code: 201
    input: [amount_cents, method]
    output: Payment
    side_effects: ["Payment POSTED with posted_at=clock", "covered_cents / amount_due_cents / payment_status recomputed (may cure DELINQUENT)"]
  - method: GET
    path: "/youth-ministry/registrations/{id}/payments"
    description: "List payments of a registration (Guardian limited to own)"
    roles: [ProgramDirector, Treasurer, Guardian]
    code: 200
    input: ["limit?", "offset?"]
    output: "Payment[]"
    side_effects: []
  - method: POST
    path: "/youth-ministry/payments/{id}/refund"
    description: "POSTED -> REFUNDED; recomputes registration coverage (downgrades possible)"
    roles: [Treasurer]
    code: 200
    input: ["reason?"]
    output: Payment
    side_effects: ["status -> REFUNDED", "registration payment rollups recomputed", "increments Payment.version by 1"]

  # --- Fundraising ---
  - method: GET
    path: "/youth-ministry/registrations/{id}/fundraising-account"
    description: "Read the 1:1 fundraising account of a registration (array of 0..1)"
    roles: [ProgramDirector, Treasurer, Guardian]
    code: 200
    input: []
    output: "FundraisingAccount[]"
    side_effects: []
  - method: GET
    path: "/youth-ministry/fundraising-accounts/{id}"
    description: "Read one fundraising account with all rollups"
    roles: [ProgramDirector, Treasurer, Guardian]
    code: 200
    input: []
    output: FundraisingAccount
    side_effects: []
  - method: POST
    path: "/youth-ministry/fundraising-accounts/{id}/donations"
    description: "Record a donation (RECEIVED); fee computed per channel. Requires only account status OPEN (ERR_ACCOUNT_CLOSED) — fundraising may begin before approval"
    roles: [Treasurer]
    code: 201
    input: [donor_name, amount_cents, channel]
    output: Donation
    side_effects: ["fee_cents computed", "account gross/net/goal_met recomputed"]
  - method: GET
    path: "/youth-ministry/fundraising-accounts/{id}/donations"
    description: "List donations of an account"
    roles: [ProgramDirector, Treasurer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Donation[]"
    side_effects: []
  - method: POST
    path: "/youth-ministry/donations/{id}/refund"
    description: "RECEIVED -> REFUNDED; removes the donation from every account sum"
    roles: [Treasurer]
    code: 200
    input: ["reason?"]
    output: Donation
    side_effects: ["status -> REFUNDED", "account rollups recomputed", "increments Donation.version by 1"]
  - method: POST
    path: "/youth-ministry/fundraising-accounts/{id}/apply-credit"
    description: "Move the full available net credit onto the registration balance; sweeps RECEIVED donations to APPLIED. Requires account OPEN (ERR_ACCOUNT_CLOSED) and Registration in {APPROVED, CONFIRMED} (ERR_REGISTRATION_STATE_FORBIDS_ACTION); available_credit_cents == 0 -> ERR_NO_CREDIT_AVAILABLE"
    roles: [Treasurer]
    code: 200
    input: []
    output: FundraisingAccount
    side_effects: ["credit_applied_cents := raised_net_cents", "Registration.fundraising_credit_applied_cents += delta; coverage recomputed", "RECEIVED donations -> APPLIED"]

  # --- Scholarship ---
  - method: POST
    path: "/youth-ministry/scholarship-applications"
    description: "Apply for scholarship for a registration in {APPROVED, CONFIRMED} (starts UNDER_REVIEW)"
    roles: [ProgramDirector, Guardian]
    code: 201
    input: [registration_id, requested_cents]
    output: ScholarshipApplication
    side_effects: ["need_score computed at creation"]
  - method: GET
    path: "/youth-ministry/scholarship-applications"
    description: "List applications; optional filters"
    roles: [ProgramDirector, ScholarshipReviewer, Treasurer]
    code: 200
    input: ["registration_id?", "status?", "limit?", "offset?"]
    output: "ScholarshipApplication[]"
    side_effects: []
  - method: GET
    path: "/youth-ministry/scholarship-applications/{id}"
    description: "Read one application (Guardian limited to own registration's)"
    roles: [ProgramDirector, ScholarshipReviewer, Treasurer, Guardian]
    code: 200
    input: []
    output: ScholarshipApplication
    side_effects: []
  - method: POST
    path: "/youth-ministry/scholarship-applications/{id}/decide"
    description: "UNDER_REVIEW -> APPROVED (decision=APPROVE; computes need_score fresh and award_cents via min-chain, reserves fund) or DENIED (decision=DENY)"
    roles: [ScholarshipReviewer]
    code: 200
    input: [decision, "reason?"]
    output: ScholarshipApplication
    side_effects: ["on APPROVE: award_cents computed; Program reserved += award; approved_by_user_id set", "on DENY: decision_reason recorded", "increments version by 1"]
  - method: POST
    path: "/youth-ministry/scholarship-applications/{id}/appeal"
    description: "DENIED -> UNDER_REVIEW (appeal cycle)"
    roles: [ProgramDirector, Guardian]
    code: 200
    input: []
    output: ScholarshipApplication
    side_effects: ["status -> UNDER_REVIEW; decision_reason cleared", "increments version by 1"]
  - method: POST
    path: "/youth-ministry/scholarship-applications/{id}/disburse"
    description: "APPROVED -> DISBURSED; SoD blocks disburser == approver; shifts fund reserved->disbursed and credits the registration"
    roles: [Treasurer]
    code: 200
    input: []
    output: ScholarshipApplication
    side_effects: ["Program reserved -= award, disbursed += award (available unchanged)", "Registration.scholarship_awarded_cents set; coverage recomputed", "increments version by 1"]
  - method: POST
    path: "/youth-ministry/scholarship-applications/{id}/rescind"
    description: "APPROVED -> RESCINDED; releases the reservation back to available"
    roles: [ScholarshipReviewer]
    code: 200
    input: ["reason?"]
    output: ScholarshipApplication
    side_effects: ["Program reserved -= award, available += award", "increments version by 1"]

  # --- Chaperone / BackgroundCheck ---
  - method: POST
    path: "/youth-ministry/chaperones"
    description: "Create a chaperone record"
    roles: [ProgramDirector]
    code: 201
    input: [program_id, first_name, last_name, email, phone]
    output: Chaperone
    side_effects: ["current_screening_expires_at empty"]
  - method: GET
    path: "/youth-ministry/chaperones"
    description: "List chaperones; optional filters"
    roles: [ProgramDirector, TripLeader]
    code: 200
    input: ["program_id?", "limit?", "offset?"]
    output: "Chaperone[]"
    side_effects: []
  - method: GET
    path: "/youth-ministry/chaperones/{id}"
    description: "Read one chaperone (Chaperone limited to own record)"
    roles: [ProgramDirector, TripLeader, Chaperone]
    code: 200
    input: []
    output: Chaperone
    side_effects: []
  - method: POST
    path: "/youth-ministry/chaperones/{id}/background-checks"
    description: "Initiate a background check (INITIATED); only one non-terminal check per chaperone"
    roles: [ProgramDirector]
    code: 201
    input: ["vendor_reference?"]
    output: BackgroundCheck
    side_effects: ["status=INITIATED"]
  - method: GET
    path: "/youth-ministry/chaperones/{id}/background-checks"
    description: "List background checks of a chaperone (Chaperone limited to own)"
    roles: [ProgramDirector, TripLeader, Chaperone]
    code: 200
    input: ["limit?", "offset?"]
    output: "BackgroundCheck[]"
    side_effects: []
  - method: POST
    path: "/youth-ministry/background-checks/{id}/advance"
    description: "INITIATED -> SCREENING -> CLEARED|FLAGGED; CLEARED stamps cleared_at/expires_at; FLAGGED cascades AUTO_SCREENING removals"
    roles: [ProgramDirector]
    code: 200
    input: [to_status, "vendor_reference?"]
    output: BackgroundCheck
    side_effects: ["status transition per to_status", "on CLEARED: cleared_at/expires_at set, chaperone screening pointer recomputed", "on FLAGGED: assignments REMOVED (AUTO_SCREENING) and trip ratio recomputed", "increments BackgroundCheck.version by 1"]

  # --- ChaperoneAssignment ---
  - method: POST
    path: "/youth-ministry/chaperone-assignments"
    description: "Propose a chaperone for a trip (PROPOSED). Screening valid through trip end (safety) checked before duplicate-lead/overlap (constraint)"
    roles: [ProgramDirector, TripLeader]
    code: 201
    input: [trip_id, chaperone_id, role]
    output: ChaperoneAssignment
    side_effects: ["status=PROPOSED"]
  - method: GET
    path: "/youth-ministry/chaperone-assignments"
    description: "List assignments; optional filters (Chaperone sees only own)"
    roles: [ProgramDirector, TripLeader, Chaperone]
    code: 200
    input: ["trip_id?", "chaperone_id?", "status?", "limit?", "offset?"]
    output: "ChaperoneAssignment[]"
    side_effects: []
  - method: GET
    path: "/youth-ministry/chaperone-assignments/{id}"
    description: "Read one assignment (Chaperone limited to own)"
    roles: [ProgramDirector, TripLeader, Chaperone]
    code: 200
    input: []
    output: ChaperoneAssignment
    side_effects: []
  - method: POST
    path: "/youth-ministry/chaperone-assignments/{id}/respond"
    description: "PROPOSED -> CONFIRMED (decision=ACCEPT) or DECLINED (decision=DECLINE); only the assigned chaperone may respond"
    roles: [Chaperone]
    code: 200
    input: [decision]
    output: ChaperoneAssignment
    side_effects: ["status transition", "on CONFIRMED: Trip cleared count and ratio recomputed", "increments version by 1"]
  - method: POST
    path: "/youth-ministry/chaperone-assignments/{id}/remove"
    description: "PROPOSED|CONFIRMED -> REMOVED (removal_reason=MANUAL)"
    roles: [ProgramDirector, TripLeader]
    code: 200
    input: ["reason?"]
    output: ChaperoneAssignment
    side_effects: ["status -> REMOVED", "Trip cleared count and ratio recomputed", "increments version by 1"]

  # --- ItineraryItem ---
  - method: POST
    path: "/youth-ministry/trips/{id}/itinerary-items"
    description: "Add an itinerary item while trip is pre-IN_PROGRESS; TRAVEL requires vehicle_code and enforces the 45-minute vehicle turnaround buffer"
    roles: [TripLeader]
    code: 201
    input: [segment_type, title, start_at, end_at, "location?", "vehicle_code?"]
    output: ItineraryItem
    side_effects: []
  - method: GET
    path: "/youth-ministry/trips/{id}/itinerary-items"
    description: "List itinerary items of a trip"
    roles: [ProgramDirector, TripLeader, Chaperone]
    code: 200
    input: ["limit?", "offset?"]
    output: "ItineraryItem[]"
    side_effects: []

  # --- LodgingReservation ---
  - method: POST
    path: "/youth-ministry/trips/{id}/lodging-reservations"
    description: "Book a room block (CONFIRMED) while trip is pre-lock; half-open room overlap enforced; feeds lodging rollup and provisional share recompute"
    roles: [TripLeader]
    code: 201
    input: [site_name, room_code, check_in_date, check_out_date, room_capacity, cost_cents]
    output: LodgingReservation
    side_effects: ["Trip.lodging_cost_total_cents recomputed", "pre-lock provisional_cost_share_cents recomputed for all non-terminal registrations"]
  - method: GET
    path: "/youth-ministry/trips/{id}/lodging-reservations"
    description: "List lodging reservations of a trip"
    roles: [ProgramDirector, TripLeader]
    code: 200
    input: ["limit?", "offset?"]
    output: "LodgingReservation[]"
    side_effects: []
  - method: POST
    path: "/youth-ministry/lodging-reservations/{id}/cancel"
    description: "CONFIRMED -> CANCELLED while trip is pre-lock; rollup + provisional shares recomputed"
    roles: [TripLeader]
    code: 200
    input: ["reason?"]
    output: LodgingReservation
    side_effects: ["status -> CANCELLED", "Trip lodging rollup recomputed", "pre-lock provisional shares recomputed", "increments version by 1"]

# =============================================================================
# §1.7 RBAC Matrix — segregation_of_duties model
# =============================================================================
roles:
  - name: ProgramDirector
    description: "Youth ministry director; owns program/trip lifecycle, policy, participant intake, registration decisions, discipline, screening administration, debrief, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /youth-ministry/_clock/set-current-utc"
      - "POST /youth-ministry/programs; PUT .../scholarship-policy; POST .../close"
      - "POST /youth-ministry/trips; PATCH /trips/{id}; all trip lifecycle actions (open-registration, close-registration, lock-roster, start, debrief, cancel)"
      - "POST /youth-ministry/registrations/{id}/confirm and .../dismiss"
      - "POST /youth-ministry/chaperones and .../background-checks; POST /background-checks/{id}/advance"
    shared_operations:
      - "POST /participants, POST /registrations, POST .../submit, POST .../review, POST .../promote, POST .../withdraw"
      - "POST .../consent-forms, POST /consent-forms/{id}/review, POST /consent-forms/{id}/resubmit"
      - "POST /scholarship-applications, POST .../appeal"
      - "POST /chaperone-assignments, POST .../remove"
      - "All GET endpoints"

  - name: TripLeader
    description: "Adult trip logistics lead; owns itinerary, lodging, and shares registration/consent review and chaperone-assignment management"
    identity: opaque
    exclusive_operations:
      - "POST /youth-ministry/trips/{id}/itinerary-items"
      - "POST /youth-ministry/trips/{id}/lodging-reservations; POST /lodging-reservations/{id}/cancel"
    shared_operations:
      - "POST /registrations/{id}/review and .../promote; POST /consent-forms/{id}/review"
      - "POST /chaperone-assignments, POST .../remove"
      - "GET endpoints per endpoint table"

  - name: Treasurer
    description: "Finance officer; records payments/donations, refunds, applies fundraising credit, disburses approved scholarships. SoD: may not disburse an application they approved (approver id is a ScholarshipReviewer's, so a user holding both roles is still blocked by id comparison)"
    identity: opaque
    exclusive_operations:
      - "POST /youth-ministry/payments/{id}/refund"
      - "POST /youth-ministry/fundraising-accounts/{id}/donations; POST /donations/{id}/refund; POST /fundraising-accounts/{id}/apply-credit"
      - "POST /youth-ministry/scholarship-applications/{id}/disburse"
    shared_operations:
      - "POST /registrations/{id}/payments (any registration)"
      - "GET endpoints per endpoint table"

  - name: ScholarshipReviewer
    description: "Aid committee reviewer; decides and rescinds scholarship applications; never touches money movement"
    identity: opaque
    exclusive_operations:
      - "POST /youth-ministry/scholarship-applications/{id}/decide"
      - "POST /youth-ministry/scholarship-applications/{id}/rescind"
    shared_operations:
      - "GET /registrations/{id}; GET /scholarship-applications/**; GET /trips/**; GET /programs/{id}"

  - name: Guardian
    description: "Parent/guardian self-service; ownership-scoped to resources whose guardian_user_id == X-User-ID (stored opaque operator id — never an entity id)"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /participants (own), POST /registrations (own participant), POST .../submit, POST .../withdraw"
      - "POST .../consent-forms, POST /consent-forms/{id}/resubmit"
      - "POST /registrations/{id}/payments (own)"
      - "POST /scholarship-applications, POST .../appeal (own)"
      - "GET own participants/registrations/consent-forms/payments/fundraising-accounts/scholarship-applications; GET /trips/**; GET /programs/{id}"

  - name: Chaperone
    description: "Screened adult leader; responds to own trip assignments and reads own record/checks/assignments and trip logistics"
    identity: "entity_backed:Chaperone"
    exclusive_operations:
      - "POST /youth-ministry/chaperone-assignments/{id}/respond (only when chaperone_id == X-User-ID)"
    shared_operations:
      - "GET /chaperones/{id} (own), GET .../background-checks (own), GET /chaperone-assignments/** (own), GET /trips/** (incl. itinerary), GET /programs/{id}"
