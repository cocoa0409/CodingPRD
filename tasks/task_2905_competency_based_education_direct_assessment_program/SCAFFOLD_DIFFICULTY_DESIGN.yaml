  - rule_id: priority_pair_validation_conflict
    instances:
      - name: term_state_beats_attempt_cooloff
        grounds:
          - validations.priority_10_ERR_TERM_NOT_ACTIVE
          - validations.priority_30_ERR_ATTEMPT_COOLOFF_ACTIVE
          - calculations.attempt_eligibility_ladder
          - state_machines.SubscriptionTerm.ACTIVE_to_LAPSED
        distinguishing_aspect: |
          Error-category pair `state` (priority 10, ERR_TERM_NOT_ACTIVE, 409)
          versus `business_temporal` (priority 30, ERR_ATTEMPT_COOLOFF_ACTIVE, 422).
          The control call proves the cool-off rule is genuinely live at
          2026-09-02T00:00:00.000Z (cooloff runs to 2026-09-03T00:00:00.000Z), and
          the trigger then makes BOTH rules violated at once by closing the term;
          a naive implementation that evaluates business-temporal gates before
          lifecycle-state gates returns the 422 instead of the 409.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T00:00:00.000Z"
            - "PUBLISHED program with the default mastery threshold 80.00 and default attempt_cooloff_hours 48"
            - "competency IT-101 worth 4 units with a single-reader 1.0000-weight 100-point blueprint"
            - "ACTIVE student with an ACTIVE term 2026-09-01 to 2026-12-01"
            - "one attempt scored 40.00, i.e. SCORED_NOT_MASTERED with cooloff_until_utc 2026-09-03T00:00:00.000Z"
            - "clock advanced to 2026-09-02T00:00:00.000Z, still inside the cool-off window"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /programs"
              payload: { code: "CBE-BSIT", title: "BS Information Technology" }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /competencies"
              payload: { program_id: "${prog_id}", code: "IT-101", title: "Relational Data Modeling", unit_value: 4, level: "FOUNDATION" }
              as: Registrar
              captures: { c1_id: $.data.id, c1_v1: $.data.version }
            - call: "POST /assessment-blueprints"
              payload: { competency_id: "${c1_id}", expected_competency_version: "${c1_v1}", dimensions: [{ code: "D1", weight: 1.0000, max_score: 100, critical: false }], passing_rule: "WEIGHTED_ONLY", required_evaluator_count: 1, effective_from_utc: "2026-09-01T00:00:00.000Z" }
              as: Registrar
            - call: "POST /programs/${prog_id}/publish"
              payload: {}
              as: Registrar
            - call: "POST /students"
              payload: { program_id: "${prog_id}", full_name: "Ada Learner", email: "ada@example.edu" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /students/${stu_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /subscription-terms"
              payload: { student_id: "${stu_id}", term_start_utc: "2026-09-01T00:00:00.000Z", term_end_utc: "2026-12-01T00:00:00.000Z", tuition_cents: 375000 }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /subscription-terms/${term_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /evaluators"
              payload: { full_name: "Reader One", email: "r1@example.edu", certification_level: "SENIOR" }
              as: Registrar
              captures: { ev1_id: $.data.id }
            - call: "POST /assessment-attempts"
              payload: { student_id: "${stu_id}", competency_id: "${c1_id}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { att1_id: $.data.id }
            - call: "POST /assessment-attempts/${att1_id}/submit"
              payload: { artifact_hash: "hash-it101-a", integrity_attestation_accepted: true, client_fingerprint: "fp-ada-1" }
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /assessment-attempts/${att1_id}/scores"
              payload: { evaluator_id: "${ev1_id}", dimension_scores: [{ code: "D1", score: 40 }] }
              as: Evaluator
              as_user_id: "${ev1_id}"
              captures: { fail_status: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /assessment-attempts"
              payload: { student_id: "${stu_id}", competency_id: "${c1_id}" }
