        grounds:
          - "calculations.retake_eligibility"
          - "errors[ERR_RETAKE_WAIT_ACTIVE]"
        distinguishing_aspect: "The negative side of the 15-day boundary: scheduled_start one second before last delivery + 15 days is rejected."
        test_recipe:
