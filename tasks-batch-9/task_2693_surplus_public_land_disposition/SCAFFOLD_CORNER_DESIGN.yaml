  - section: validations
    instances:
      - name: notice_response_after_deadline_is_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=33]
          - calculations.statutory_window_deadlines
          - errors[ERR_NOTICE_RESPONSE_LATE]
        distinguishing_aspect: "A notice issued at 2026-08-01T00:00:00Z with response_window_days 60 carries response_deadline_at 2026-09-30T00:00:00Z; answering at 2026-10-01T00:00:00Z returns HTTP 409 ERR_NOTICE_RESPONSE_LATE, the notice stays ISSUED with responded_at null, and no PreferenceOffer is created even though the responder IS a preference entity claiming a matching category."
        test_recipe:
          setup:
            - "One custodian Agency and one HOUSING_AUTHORITY Agency with is_preference_entity true and preference_category AFFORDABLE_HOUSING."
            - "One Parcel and one declaration ADOPTED at the default clock 2026-08-01T00:00:00Z."
            - "A notice round served with response_window_days 60, so response_deadline_at is 2026-09-30T00:00:00Z."
            - "The clock advanced to 2026-10-01T00:00:00Z, one day past the deadline."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "City of Riverbend", agency_type: "MUNICIPAL", contact_email: "realproperty@riverbend.gov" }
              as: SystemAdministrator
              captures: { cust_agency_id: "$.data.id" }
            - call: "POST /agencies"
              payload: { name: "Riverbend Housing Authority", agency_type: "HOUSING_AUTHORITY", contact_email: "clerk@rbha.gov", is_preference_entity: true, preference_category: "AFFORDABLE_HOUSING" }
              as: SystemAdministrator
              captures: { pref_agency_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { apn: "APN-2693-141", address: "9 Canal Street", acreage: 3.1, zoning_code: "M-1", book_value_cents: 70000000, custodian_agency_id: "${cust_agency_id}" }
              as: RealPropertyOfficer
              captures: { parcel_id: "$.data.id" }
            - call: "POST /declarations"
              payload: { parcel_id: "${parcel_id}", justification: "Canal Street yard is surplus after depot consolidation." }
              as: RealPropertyOfficer
              captures: { decl_id: "$.data.id" }
            - call: "POST /declarations/${decl_id}/adopt"
              payload: { resolution_number: "RES-2026-241" }
              as: BoardClerk
              as_user_id: "clerk-adopt-1"
            - call: "POST /declarations/${decl_id}/issue-notices"
              payload:
                recipient_agency_ids: ["${pref_agency_id}"]
                response_window_days: 60
              as: RealPropertyOfficer
            - call: "GET /notices"
              payload: { declaration_id: "${decl_id}" }
              as: RealPropertyOfficer
              captures: { notice_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: SystemAdministrator
          trigger:
            - call: "POST /notices/${notice_id}/respond"
              payload: { response_type: "EXPRESS_INTEREST", claimed_preference_category: "AFFORDABLE_HOUSING", intended_use: "62-unit affordable rental development" }
              as: AgencyRepresentative
              as_user_id: "${pref_agency_id}"
          assert:
            - "the response status is HTTP 409 and data.error_id == ERR_NOTICE_RESPONSE_LATE"
            - "StatutoryNotice.${notice_id}.response_deadline_at == 2026-09-30T00:00:00Z"
            - "StatutoryNotice.${notice_id}.status is still ISSUED with responded_at null and response_type null"
            - "GET /preference-offers filtered by declaration_id ${decl_id} returns total_count == 0"
            - "SurplusDeclaration.${decl_id}.preference_offer_count == 0 and status is still NOTICED"

      - name: express_interest_from_non_preference_agency_is_rejected
        claim_type: conditional_validation
        grounds:
          - validations[priority=31]
          - state_machines.StatutoryNotice.ISSUED_to_INTEREST_EXPRESSED
          - errors[ERR_NOT_PREFERENCE_ENTITY]
        distinguishing_aspect: "The preference-right check is conditional on the response branch, not on the endpoint: the SAME notice held by the SAME is_preference_entity == false TRANSIT agency inside the SAME window is refused with HTTP 422 ERR_NOT_PREFERENCE_ENTITY for EXPRESS_INTEREST yet accepted for DECLINE, which reaches DECLINED without creating a PreferenceOffer."
        test_recipe:
