        claim_type: exclusive_operations
        grounds:
          - roles.LicensureAnalyst.exclusive_operations
          - roles.MonitoringCoordinator
          - validations[priority=2]
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "The MonitoringCoordinator's only exclusive operation is recording monitoring events; identity creation belongs to LicensureAnalyst. The refusal happens before body validation, so a payload that is also missing nothing still yields 403 and not 422, and no Nurse row appears under the board."
        test_recipe:
