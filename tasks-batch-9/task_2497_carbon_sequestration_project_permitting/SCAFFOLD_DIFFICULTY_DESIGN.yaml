              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { w5_id: $.data.id, w5_status: $.data.corrective_action_status, w5_risk: $.data.risk_score }
          trigger:
            - call: "POST /ccs/legacy-wellbores/${w1_id}/schedule-corrective-action"
              payload: { window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-10T00:00:00Z" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { w1_sched_status: $.data.corrective_action_status }
            - call: "POST /ccs/legacy-wellbores/${w2_id}/schedule-corrective-action"
              payload: { window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-20T00:00:00Z" }
