          IN_PROGRESS -> DELIVERED -> KICKED_BACK -> IN_PROGRESS -> DELIVERED re-enters a state already
          visited and recomputes the same field from scratch: the second delivery sets slip_days to 28,
          not 7 + 28 == 35, and the issue's posture is re-derived from the recomputed sum (ON_TRACK at 7,
