      - name: movement_dispute_correct_cycle_recomputes_timeliness
        grounds:
          - state_machines.MovementEvent.REPORTED_to_DISPUTED
          - state_machines.MovementEvent.DISPUTED_to_REPORTED
          - entities.MovementEvent.fields.correction_count
          - calculations.movement_reporting_timeliness
        distinguishing_aspect: |
          MovementEvent is cyclic: REPORTED -> DISPUTED -> REPORTED returns the row to a state it has
          already occupied while correction_count advances 0 -> 1, and the re-entry recomputes
          reporting_lag_hours from the FROZEN reported_at (96.00 -> 24.00), flipping on_time and the
          producer roll-up from 0.00 to 100.00.
