            - call: "POST /clients"
              payload: { name: "Frig", headcount: 5 }
              as: PlatformAdmin
              captures: { client_id: "$.data.id" }
            - call: "POST /clients/${client_id}/locations"
              payload: { name: "PL", kind: "PANTRY", capacity_units: 10 }
              as: ClientAdmin
