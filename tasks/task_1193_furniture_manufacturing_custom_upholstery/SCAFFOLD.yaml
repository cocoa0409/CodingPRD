  - { method: GET, path: "/mill/product-models/{id}", description: "Get a product model", roles: [SalesRep, ProductionPlanner, MaterialReceiver, QualityInspector, ComplianceOfficer, ShippingCoordinator, PlantAdmin], code: 200, input: [], output: ProductModel, side_effects: [] }
  - { method: POST, path: "/mill/product-models/{id}/discontinue", description: "Discontinue a model (blocks new lines)", roles: [ProductionPlanner], code: 200, input: [], output: ProductModel, side_effects: ["status → DISCONTINUED"] }

  # --- FabricSpec ---
