              as: Appraiser
              captures: { ins_adj_id: $.data.id }
          assert:
            - "the 10:30-11:30 appointment returns error_id == ERR_APPRAISER_DOUBLE_BOOKED"
            - "the adjacent 11:00-12:00 appointment succeeds: InspectionAppointment.${ins_adj_id}.status == SCHEDULED"

