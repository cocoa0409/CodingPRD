      - name: held_bed_units_conserved_across_offer_and_withdraw
        grounds:
          - entities.PostAcuteProvider.fields.held_bed_units
          - state_machines.BedOffer.OFFERED_to_WITHDRAWN
          - "validations[priority=51]"
        distinguishing_aspect: |
          Conserved quantity 1 of 2 is a UNIT COUNT: for every provider,
          held_bed_units == COUNT(BedOffer WHERE provider_id == provider.id AND status IN
          {OFFERED, ACCEPTED_BY_PATIENT}). Creating an offer (+1) and withdrawing it (-1)
          restores the count to its pre-action value with zero drift, and the released
          [2026-08-05T00:00:00Z, 2026-08-12T00:00:00Z) interval becomes reusable by an
          otherwise-identical offer that would previously have been rejected.
