- rule_id: non_linear_state_machine
  instances:
  - name: submittal_third_return_escalates_instead_of_revising
    grounds:
    - state_machines.ShopDrawingSubmittal.UNDER_REVIEW_to_REVISION_REQUIRED
    - state_machines.ShopDrawingSubmittal.UNDER_REVIEW_to_ESCALATED
    - state_machines.ShopDrawingSubmittal.REVISION_REQUIRED_to_SUBMITTED
    - state_machines.ShopDrawingSubmittal.ESCALATED_to_SUBMITTED
    - calculations.engineering_posture
    - validations[priority=66]
    distinguishing_aspect: 'The same review call with the same decision REVISION_REQUIRED lands in two different target
      states depending on a counter the caller cannot set: revision_cycle <= 2 returns to REVISION_REQUIRED, revision_cycle
      >= 3 diverts to ESCALATED, which also flips package posture to FROZEN and makes the resubmit edge demand a dispute_resolution_ref.'
    test_recipe:
      setup:
      - logical clock 2026-08-03T08:00:00Z; package Tower A Facade, no defects
      - 'one delegated-design shop drawing submittal (revision_cycle starts at 1) driven through two full revision rounds:
        seal -> start-review -> review REVISION_REQUIRED -> resubmit, twice'
      - each resubmit clears the seal, so every round re-seals with u-eng-1 and is reviewed by u-aor-1 (sealer != reviewer)
      - after the second resubmit revision_cycle == 3 and the submittal is back in UNDER_REVIEW
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T08:00:00Z'
        as: CWProjectManager
      - call: POST /facade-packages
        payload:
          name: Tower A Facade
          floor_count: 20
          total_area_sqm: 9000.0
          contract_value_cents: 1450000000
          unit_rate_cents_per_sqm: 148733
          base_labor_rate_cents_per_hour: 9800
          design_temp_delta_c: 60.0
          weather_tightness_deadline_date: '2026-12-15'
        as: CWProjectManager
        captures:
          pkg: $.data.id
      - call: POST /shop-drawing-submittals
        payload:
          package_id: ${pkg}
          submittal_type: SHOP_DRAWING
          title: Typical unitized panel set
          drawing_set_ref: SD-001
          delegated_design_scope: true
        as: CWDetailer
        captures:
          sub: $.data.id
      - call: POST /shop-drawing-submittals/${sub}/seal
        payload:
          seal_license_no: PE-44821
        as: DelegatedEngineer
        as_user_id: u-eng-1
      - call: POST /shop-drawing-submittals/${sub}/start-review
        payload: {}
        as: ArchitectOfRecord
        as_user_id: u-aor-1
      - call: POST /shop-drawing-submittals/${sub}/review
        payload:
          decision: REVISION_REQUIRED
        as: ArchitectOfRecord
        as_user_id: u-aor-1
      - call: POST /shop-drawing-submittals/${sub}/resubmit
        payload:
          drawing_set_ref: SD-001-R1
        as: CWDetailer
      - call: POST /shop-drawing-submittals/${sub}/seal
        payload:
          seal_license_no: PE-44821
        as: DelegatedEngineer
        as_user_id: u-eng-1
      - call: POST /shop-drawing-submittals/${sub}/start-review
        payload: {}
        as: ArchitectOfRecord
        as_user_id: u-aor-1
      - call: POST /shop-drawing-submittals/${sub}/review
        payload:
          decision: REVISION_REQUIRED
        as: ArchitectOfRecord
        as_user_id: u-aor-1
      - call: POST /shop-drawing-submittals/${sub}/resubmit
        payload:
          drawing_set_ref: SD-001-R2
        as: CWDetailer
      - call: POST /shop-drawing-submittals/${sub}/seal
        payload:
          seal_license_no: PE-44821
        as: DelegatedEngineer
        as_user_id: u-eng-1
      - call: POST /shop-drawing-submittals/${sub}/start-review
        payload: {}
        as: ArchitectOfRecord
        as_user_id: u-aor-1
      trigger:
      - call: POST /shop-drawing-submittals/${sub}/review
        payload:
          decision: REVISION_REQUIRED
          escalation_ref: DISPUTE-2026-014
        as: ArchitectOfRecord
        as_user_id: u-aor-1
      assert:
      - the first review, taken at revision_cycle 1, lands in REVISION_REQUIRED
      - the second review, taken at revision_cycle 2, still lands in REVISION_REQUIRED - the boundary is <= 2, not < 2
      - after the trigger ShopDrawingSubmittal.${sub}.state == ESCALATED (revision_cycle == 3)
      - ShopDrawingSubmittal.${sub}.revision_cycle == 3 and review_decision == REVISION_REQUIRED and escalation_ref == DISPUTE-2026-014
      - ShopDrawingSubmittal.${sub}.sealed_by_user_id == u-eng-1 and reviewed_by_user_id == u-aor-1
      - FacadePackage.${pkg}.engineering_posture == FROZEN and blocking_submittal_count == 1
      - a POST /shop-drawing-submittals/${sub}/resubmit without dispute_resolution_ref returns ERR_DISPUTE_REF_REQUIRED
        (409) while the same call with dispute_resolution_ref moves the submittal back to SUBMITTED with revision_cycle
        4
      - ShopDrawingSubmittal.${sub}.state == ESCALATED is not terminal, but ERR_TERMINAL_STATE is never raised for it
