              payload: { amount_cents: 1 }
              as: ServicingAgent
              captures: { overpay_err: $.data.error_id }
          assert:
            - "invoice_amount_cents (${inv_amount}) == 306000 (premium 300000 + tax 6000)"
            - "After 200000 payment: amount_paid_cents (${paid1}) == 200000 and status (${st1}) == PARTIALLY_PAID"
            - "After 106000 payment: amount_paid_cents (${paid2}) == 306000 and status (${st2}) == PAID (conservation: 200000+106000 == invoice_amount)"
            - "Third payment of 1 cent -> error (${overpay_err}) == ERR_OVERPAYMENT and amount_paid_cents stays 306000 (no drift past the conserved total)"

      - name: incurred_claims_conserved_under_upheld_dispute_adjustment
        grounds:
          - calculations.dispute_adjustment
          - entities.InsuranceProgram.fields.incurred_claims_cents
        distinguishing_aspect: |
