  # Corners already exercised by §1.8 difficulty instances (stubs, no recipe)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: st_appeal_filing_moves_nr_to_appealed
        claim_type: Valid Transition
        grounds: [state_machines.NoncomplianceRecord.OPEN_to_APPEALED]
        excluded_because:
          difficulty_instance: noncompliance_record_appeal_cycle
          rationale: "The OPEN -> APPEALED edge and status_before_appeal recording are asserted inside the cycle instance's trigger chain."

      - name: st_suspension_cascade_blocks_shift_windows
        claim_type: Side Effect Execution
        grounds: [state_machines.ShiftWindow.PLANNED_to_BLOCKED]
        excluded_because:
          difficulty_instance: egregious_humane_confirm_suspends_and_blocks
          rationale: "The BLOCKED transition is asserted as hop 3 of the humane cascade instance."

  - section: calculations
    instances:
      - name: st_positive_rate_boundary
        claim_type: Boundary / Edge Claims
        grounds: [calculations.pathogen_categorization]
        excluded_because:
          difficulty_instance: positive_rate_exactly_at_standard_stays_cat2
          rationale: "Equality-at-standard and the crossing are asserted by the difficulty instance."

