      - name: furnace_daily_capacity_equality_then_overflow
        grounds:
          - calculations.daily_load_checks
          - errors[ERR_FURNACE_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Boundary on a WEIGHT metric reached through POST /api/heats/{id}/tap (different metric and
          endpoint than the order-count boundary): cumulative same-date taps of 3000 then 2000 kg hit
          the 5000 kg capacity exactly (equality passes); a further 0.01 kg tap overflows by 0.01 and
          is rejected.
        test_recipe:
          setup:
            - "Furnace daily_tap_capacity_kg 5000; three CERTIFIED heats with charges 3000 / 2000 / 100 kg; logical date fixed 2026-08-10"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: FoundryAdmin }
            - { call: "POST /api/foundries", payload: { name: "F1" }, as: FoundryAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /api/equipment", payload: { foundry_id: "${f_id}", kind: "FURNACE", label: "Cupola-1", daily_tap_capacity_kg: 5000 }, as: FoundryAdmin, captures: { furn_id: $.data.id } }
            - { call: "POST /api/heats", payload: { foundry_id: "${f_id}", furnace_id: "${furn_id}", alloy_grade: "GJS-400-15", chemistry_spec: { elements: { C: { min: 3.2, max: 3.6 } } } }, as: MeltSupervisor, captures: { h1: $.data.id, h1_v: $.data.version } }
            - { call: "POST /api/heats/${h1}/charges", payload: { expected_heat_version: "${h1_v}", additions: [ { source: "VIRGIN", weight_kg: 3000, composition: { C: 3.40 } } ] }, as: MeltSupervisor, captures: { h1_v2: $.data.version } }
            - { call: "POST /api/heats/${h1}/samples", payload: { expected_heat_version: "${h1_v2}", reading: { C: 3.40 } }, as: Spectrographer, as_user_id: "spectro_1" }
            - { call: "POST /api/heats", payload: { foundry_id: "${f_id}", furnace_id: "${furn_id}", alloy_grade: "GJS-400-15", chemistry_spec: { elements: { C: { min: 3.2, max: 3.6 } } } }, as: MeltSupervisor, captures: { h2: $.data.id, h2_v: $.data.version } }
            - { call: "POST /api/heats/${h2}/charges", payload: { expected_heat_version: "${h2_v}", additions: [ { source: "VIRGIN", weight_kg: 2000, composition: { C: 3.40 } } ] }, as: MeltSupervisor, captures: { h2_v2: $.data.version } }
            - { call: "POST /api/heats/${h2}/samples", payload: { expected_heat_version: "${h2_v2}", reading: { C: 3.40 } }, as: Spectrographer, as_user_id: "spectro_1" }
            - { call: "POST /api/heats", payload: { foundry_id: "${f_id}", furnace_id: "${furn_id}", alloy_grade: "GJS-400-15", chemistry_spec: { elements: { C: { min: 3.2, max: 3.6 } } } }, as: MeltSupervisor, captures: { h3: $.data.id, h3_v: $.data.version } }
            - { call: "POST /api/heats/${h3}/charges", payload: { expected_heat_version: "${h3_v}", additions: [ { source: "VIRGIN", weight_kg: 100, composition: { C: 3.40 } } ] }, as: MeltSupervisor, captures: { h3_v2: $.data.version } }
            - { call: "POST /api/heats/${h3}/samples", payload: { expected_heat_version: "${h3_v2}", reading: { C: 3.40 } }, as: Spectrographer, as_user_id: "spectro_1" }
          trigger:
            - { call: "POST /api/heats/${h1}/tap", payload: { tap_weight_kg: 3000 }, as: MeltSupervisor, captures: { t1: $.data.status } }
            - { call: "POST /api/heats/${h2}/tap", payload: { tap_weight_kg: 2000 }, as: MeltSupervisor, captures: { t2: $.data.status } }
            - { call: "POST /api/heats/${h3}/tap", payload: { tap_weight_kg: 0.01 }, as: MeltSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "Tap 3000 succeeds (cumulative 3000 <= 5000); heat ${h1} status TAPPED"
            - "Tap 2000 succeeds at exact equality (cumulative 5000 == 5000 passes; <= semantics); heat ${h2} status TAPPED"
            - "Tap 0.01 rejected with ERR_FURNACE_CAPACITY_EXCEEDED (5000.01 > 5000); heat ${h3} remains CERTIFIED"

