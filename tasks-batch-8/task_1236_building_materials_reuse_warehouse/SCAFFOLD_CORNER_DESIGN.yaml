              as: IntakeStaff
              as_user_id: "staff-occ-i"
              captures: { err: $.data.error_id }
          assert:
            - "first amend: replacement receipt ISSUED with supersedes_receipt_id == ${rcpt_id}; old receipt SUPERSEDED"
            - "second amend replaying the stale version -> 412 ERR_STALE_RECEIPT_VERSION (OCC beats the state check at priority 6)"

      - name: cascading_and_dual_variant_layers_covered_by_difficulty
        claim_type: layer_coverage
        grounds: ["complexity_profile.complexity_layers"]
        excluded_because:
          difficulty_instance: finalize_cascade_item_zone_account_agreement
          rationale: "cascading_side_effects exercised by finalize/weigh chains; dual_variant_calculation by the three rule-1 instances; ops_run_checkpoint by closed_report_totals_frozen in this file."

      - name: slow_only_filter_uses_target_turn_days
        claim_type: derived_field_reconciliation
        grounds: ["entities.Item.fields.days_on_floor", "entities.Category.fields.target_turn_days", "calculations.markdown_price"]
        distinguishing_aspect: "GET /reuse/items?slow_only=true returns only ON_FLOOR items whose days_on_floor >= category.target_turn_days, evaluated against the logical clock."
        test_recipe:
          setup: ["category target_turn_days 20; item placed at 2026-05-01; clock advanced to 2026-05-22 (21 days); another item in BACKROOM (never placed)"]
          setup_api_calls:
            - call: "POST /reuse/categories"
              payload: { code: "SLOWCAT", display_name: "Slow Cat", pricing_model: "PER_UNIT", base_rate_cents: 100, hazmat_risk_flag: false, markdown_after_days: 30, markdown_step_pct: 0.20, markdown_interval_days: 15, max_markdown_steps: 2, floor_price_pct: 0.40, target_turn_days: 20 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /reuse/store-zones"
              payload: { code: "ZSLOW", display_name: "Zone Slow", capacity: 5, restock_threshold: 0 }
              as: StoreManager
              captures: { zone_id: $.data.id }
            - call: "POST /reuse/items"
              payload: { category_id: "${cat_id}", description_text: "slow item", condition_grade: "A", measure_qty: 1, measure_unit: "UNIT", pre_1978_flag: false, estimated_weight_lbs: 2 }
              as: IntakeStaff
              captures: { slow_id: $.data.id }
            - call: "POST /reuse/items/${slow_id}/price"
              payload: { price_override_cents: 100 }
              as: StoreManager
            - call: "POST /reuse/items/${slow_id}/place"
              payload: { zone_id: "${zone_id}" }
              as: StoreManager
            - call: "POST /reuse/items"
              payload: { category_id: "${cat_id}", description_text: "backroom item", condition_grade: "A", measure_qty: 1, measure_unit: "UNIT", pre_1978_flag: false, estimated_weight_lbs: 2 }
              as: IntakeStaff
              captures: { back_id: $.data.id }
            - call: "POST /reuse/items/${back_id}/price"
              payload: { price_override_cents: 100 }
              as: StoreManager
            - call: "POST /reuse/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-22T00:00:00Z" }
              as: WarehouseAdmin
          trigger:
            - call: "GET /reuse/items"
              payload: { slow_only: true }
              as: StoreManager
          assert:
            - "slow_only list contains ${slow_id} (21 days on floor >= 20) and excludes ${back_id} (never placed)"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: accept_immediately_visible_on_read
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: the accept response and a subsequent GET both show ACCEPTED with the computed estimated_value_cents (150*40*1.0*0.30 = 1800 for LINEAR_FT base 150 qty 40 grade A)."
        test_recipe:
          setup: ["category LINEAR base 150; donor; offer UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /reuse/categories"
              payload: { code: "CONSCAT", display_name: "Cons Cat", pricing_model: "PER_LINEAR_FT", base_rate_cents: 150, hazmat_risk_flag: false, markdown_after_days: 30, markdown_step_pct: 0.20, markdown_interval_days: 15, max_markdown_steps: 2, floor_price_pct: 0.40, target_turn_days: 45 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /reuse/donors"
              payload: { full_name: "D C", donor_type: "INDIVIDUAL", email: "dc@x.com", address_text: "26 Rd" }
              as: IntakeStaff
              captures: { donor_id: $.data.id }
            - call: "POST /reuse/donation-offers"
              payload: { donor_id: "${donor_id}", source_type: "DROPOFF", category_id: "${cat_id}", description_text: "cons", estimated_quantity: 40, quantity_unit: "LINEAR_FT", condition_grade: "A", pre_1978_flag: false }
              as: IntakeStaff
              captures: { offer_id: $.data.id }
            - call: "POST /reuse/donation-offers/${offer_id}/review"
              payload: {}
              as: IntakeStaff
          trigger:
            - call: "POST /reuse/donation-offers/${offer_id}/accept"
              payload: {}
              as: IntakeStaff
              captures: { o_status: $.data.status, o_est: $.data.estimated_value_cents }
            - call: "GET /reuse/donation-offers/${offer_id}"
              as: IntakeStaff
              captures: { o_status2: $.data.status, o_est2: $.data.estimated_value_cents }
          assert:
            - "accept response: status ACCEPTED, estimated_value_cents == 1800"
            - "immediate GET returns identical status and estimated_value_cents (no lag)"
