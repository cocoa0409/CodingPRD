            - { call: "POST /youth-ministry/scholarship-applications/${app_id}/decide", payload: {decision: "DENY", reason: "insufficient documentation"}, as: ScholarshipReviewer, as_user_id: "reviewer-1", captures: {v_denied: $.data.version} }
            # fundraising turns around before the appeal
            - { call: "GET /youth-ministry/registrations/${reg_id}/fundraising-account", as: Treasurer, captures: {acct_id: "$.data[0].id"} }
            - { call: "POST /youth-ministry/fundraising-accounts/${acct_id}/donations", payload: {donor_name: "D1", amount_cents: 30000, channel: "CASH"}, as: Treasurer, as_user_id: "treasurer-1" }
