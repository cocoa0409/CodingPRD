      - name: global_name_and_code_uniqueness_holds_for_food_types_recipes_and_haulers
        claim_type: violation_to_error
        grounds: ["validations[priority=100]", "errors[ERR_DUPLICATE_FOOD_TYPE_NAME]", "errors[ERR_DUPLICATE_RECIPE_CODE]", "errors[ERR_DUPLICATE_HAULER_NAME]"]
        distinguishing_aspect: "Three configuration entities share one rule but three distinct error codes, and none of them is scoped to a site — the collision is global even though the payloads differ in every other field."
        test_recipe:
          setup: ["One food type named Chicken Breast, one recipe coded STK-PLN and one hauler named Green Haul already exist."]
          setup_api_calls:
            - call: "POST /food-types"
