  - rule_id: resource_temporal_overlap
    instances:
      - name: leave_window_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=33]
          - errors[ERR_LEAVE_WINDOW_OVERLAP]
        distinguishing_aspect: "Half-open interval semantics on LeaveRequest: a new leave departing exactly at the prior leave's returns_at (2026-09-06T19:00:00Z) is accepted because [departs_at, returns_at) intervals merely touch; departing one minute earlier (18:59) intersects and is rejected with ERR_LEAVE_WINDOW_OVERLAP."
        test_recipe:
          setup:
            - "Term ACTIVE; grade-12 GOOD domestic student (allowance 8) with one REQUESTED leave spanning 2026-09-04T17:00:00Z..2026-09-06T19:00:00Z"
          setup_api_calls:
            - { call: "POST /reslife/terms", payload: { name: "FALL_2026", starts_on: "2026-08-24", ends_on: "2026-12-18" }, as: SchoolAdmin, captures: { term_id: "$.data.id" } }
            - { call: "POST /reslife/terms/${term_id}/activate", payload: {}, as: SchoolAdmin }
            - { call: "POST /reslife/parents", payload: { full_name: "Pat R", email: "pr@x.com" }, as: SchoolAdmin, captures: { par: "$.data.id" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu R", grade: 12, gender: "MALE", is_international: false, parent_id: "${par}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin, captures: { stu: "$.data.id" } }
            - { call: "POST /reslife/leave-requests", payload: { leave_type: "WEEKEND_OVERNIGHT", destination: "Boston", departs_at: "2026-09-04T17:00:00Z", returns_at: "2026-09-06T19:00:00Z" }, as: Student, as_user_id: "${stu}", captures: { leave1: "$.data.id" } }
          trigger:
            - { call: "POST /reslife/leave-requests", payload: { leave_type: "WEEKEND_OVERNIGHT", destination: "Home", departs_at: "2026-09-06T19:00:00Z", returns_at: "2026-09-08T21:00:00Z" }, as: Student, as_user_id: "${stu}", captures: { leave2: "$.data.id" } }
            - { call: "POST /reslife/leave-requests", payload: { leave_type: "WEEKEND_OVERNIGHT", destination: "Home", departs_at: "2026-09-06T18:59:00Z", returns_at: "2026-09-08T21:00:00Z" }, as: Student, as_user_id: "${stu}", captures: { err: "$.data.error_id" } }
          assert:
            - "LeaveRequest.${leave2} created with status REQUESTED (boundary touch is allowed)"
            - "captured err == ERR_LEAVE_WINDOW_OVERLAP (one minute earlier intersects [2026-09-04T17:00Z, 2026-09-06T19:00Z))"
      - name: storage_aggregate_capacity_boundary
        grounds:
          - validations[priority=43]
          - errors[ERR_STORAGE_CAPACITY_EXCEEDED]
          - entities.StorageUnit.fields.used_cuft
        distinguishing_aspect: "Aggregate-capacity interval semantics on StorageUnit (different resource than LeaveRequest and different geometry than half-open adjacency): cumulative reserved volume reaching exactly capacity_cuft (6+4 == 10) is accepted; one more cubic foot is rejected with ERR_STORAGE_CAPACITY_EXCEEDED."
        test_recipe:
          setup:
            - "ENROLLED student; THANKSGIVING break; storage unit capacity_cuft 10"
          setup_api_calls:
            - { call: "POST /reslife/parents", payload: { full_name: "Pat S", email: "ps@x.com" }, as: SchoolAdmin, captures: { par: "$.data.id" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu S", grade: 11, gender: "FEMALE", is_international: false, parent_id: "${par}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin, captures: { stu: "$.data.id" } }
            - { call: "POST /reslife/break-periods", payload: { name: "THANKSGIVING_2026", kind: "THANKSGIVING", starts_on: "2026-11-24", ends_on: "2026-11-29", housing_available: true }, as: SchoolAdmin, captures: { brk: "$.data.id" } }
            - { call: "POST /reslife/storage-units", payload: { label: "UNIT-C", capacity_cuft: 10 }, as: SchoolAdmin, captures: { unit: "$.data.id" } }
            - { call: "POST /reslife/storage-reservations", payload: { storage_unit_id: "${unit}", break_period_id: "${brk}", volume_cuft: 6, weeks: 1, items_description: "Trunk" }, as: Student, as_user_id: "${stu}", captures: { res1: "$.data.id" } }
          trigger:
            - { call: "POST /reslife/storage-reservations", payload: { storage_unit_id: "${unit}", break_period_id: "${brk}", volume_cuft: 4, weeks: 1, items_description: "Bike box" }, as: Student, as_user_id: "${stu}", captures: { res2: "$.data.id", res2_fee: "$.data.fee_cents" } }
            - { call: "GET /reslife/storage-units/${unit}", payload: {}, as: SchoolAdmin, captures: { used: "$.data.used_cuft" } }
            - { call: "POST /reslife/storage-reservations", payload: { storage_unit_id: "${unit}", break_period_id: "${brk}", volume_cuft: 1, weeks: 1, items_description: "Duffel" }, as: Student, as_user_id: "${stu}", captures: { err: "$.data.error_id" } }
          assert:
            - "StorageReservation.${res2} created with fee_cents == 850 (round_half_up(4*1*250*0.85) = 850; == capacity boundary admitted)"
            - "captured used == 10"
            - "captured err == ERR_STORAGE_CAPACITY_EXCEEDED (11 > 10 rejected)"

  - rule_id: compensating_invariant
    instances:
      - name: leave_approve_then_cancel_conserves_allowance_usage
        grounds:
          - calculations.weekend_leaves_used
          - state_machines.LeaveRequest.APPROVED_to_CANCELLED
        distinguishing_aspect: "Conserved quantity = Student.weekend_leaves_used: approve (+1) followed by cancel (-1) returns the counter to its exact prior value 0, because only {APPROVED, SIGNED_OUT, OVERDUE, RETURNED} count and CANCELLED is excluded."
        test_recipe:
          setup:
            - "Term ACTIVE; grade-12 student CONFIRMED in Winslow; weekend_leaves_used == 0"
          setup_api_calls:
            - { call: "POST /reslife/dorms", payload: { name: "Winslow House", gender_policy: "ANY", curfew_weekday: "22:30", curfew_weekend: "23:30" }, as: SchoolAdmin, captures: { dorm_id: "$.data.id" } }
            - { call: "POST /reslife/rooms", payload: { dorm_id: "${dorm_id}", room_number: "W-101", beds: 2 }, as: SchoolAdmin, captures: { room_id: "$.data.id" } }
            - { call: "POST /reslife/terms", payload: { name: "FALL_2026", starts_on: "2026-08-24", ends_on: "2026-12-18" }, as: SchoolAdmin, captures: { term_id: "$.data.id" } }
            - { call: "POST /reslife/terms/${term_id}/activate", payload: {}, as: SchoolAdmin }
            - { call: "POST /reslife/parents", payload: { full_name: "Pat T", email: "pt@x.com" }, as: SchoolAdmin, captures: { par: "$.data.id" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu T", grade: 12, gender: "MALE", is_international: false, parent_id: "${par}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin, captures: { stu: "$.data.id", stu_v: "$.data.version" } }
            - { call: "POST /reslife/staff", payload: { full_name: "DP One", staff_role: "DORM_PARENT", dorm_id: "${dorm_id}" }, as: SchoolAdmin, captures: { dp: "$.data.id" } }
            - { call: "POST /reslife/dorm-assignments", payload: { student_id: "${stu}", room_id: "${room_id}", term_id: "${term_id}", expected_student_version: "${stu_v}" }, as: SchoolAdmin, captures: { asg: "$.data.id" } }
            - { call: "POST /reslife/dorm-assignments/${asg}/confirm", payload: {}, as: SchoolAdmin }
            - { call: "POST /reslife/leave-requests", payload: { leave_type: "WEEKEND_OVERNIGHT", destination: "Boston", departs_at: "2026-09-04T17:00:00Z", returns_at: "2026-09-06T19:00:00Z" }, as: Student, as_user_id: "${stu}", captures: { leave: "$.data.id" } }
            - { call: "POST /reslife/leave-requests/${leave}/parent-decision", payload: { decision: "APPROVE" }, as: Parent, as_user_id: "${par}" }
            - { call: "GET /reslife/students/${stu}", payload: {}, as: SchoolAdmin, captures: { used0: "$.data.weekend_leaves_used" } }
          trigger:
            - { call: "POST /reslife/leave-requests/${leave}/dorm-decision", payload: { decision: "APPROVE" }, as: DormParent, as_user_id: "${dp}" }
            - { call: "GET /reslife/students/${stu}", payload: {}, as: SchoolAdmin, captures: { used1: "$.data.weekend_leaves_used" } }
            - { call: "POST /reslife/leave-requests/${leave}/cancel", payload: {}, as: Student, as_user_id: "${stu}" }
            - { call: "GET /reslife/students/${stu}", payload: {}, as: SchoolAdmin, captures: { used2: "$.data.weekend_leaves_used" } }
          assert:
            - "captured used0 == 0"
            - "captured used1 == 1 (approve consumes one unit)"
            - "captured used2 == 0 (cancel restores the invariant: forward + compensating action leaves usage unchanged)"
      - name: sanction_then_overturn_conserves_points
        grounds:
          - state_machines.DisciplineCase.APPEALED_to_DISMISSED
          - calculations.discipline_points_dual
        distinguishing_aspect: "Conserved quantity of a different type (demerit point ledger, not a usage counter): a 6-point sanction followed by its appeal OVERTURN restores Student.demerit_points to exactly 0 and standing to GOOD; the case carries points_assessed 0 in DISMISSED."
        test_recipe:
          setup:
            - "Student with a MAJOR case heard and SANCTIONED at 6 points; appeal filed"
          setup_api_calls:
            - { call: "POST /reslife/parents", payload: { full_name: "Pat U", email: "pu@x.com" }, as: SchoolAdmin, captures: { par: "$.data.id" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu U", grade: 10, gender: "MALE", is_international: false, parent_id: "${par}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin, captures: { stu: "$.data.id" } }
            - { call: "POST /reslife/staff", payload: { full_name: "Dean One", staff_role: "DEAN" }, as: SchoolAdmin, captures: { dean1: "$.data.id" } }
            - { call: "POST /reslife/staff", payload: { full_name: "Dean Two", staff_role: "DEAN" }, as: SchoolAdmin, captures: { dean2: "$.data.id" } }
            - { call: "POST /reslife/discipline-cases", payload: { student_id: "${stu}", category: "MAJOR", description: "Lab vandalism", points_proposed: 6 }, as: Dean, as_user_id: "${dean1}", captures: { case1: "$.data.id" } }
            - { call: "POST /reslife/discipline-cases/${case1}/begin-review", payload: {}, as: Dean, as_user_id: "${dean1}" }
            - { call: "POST /reslife/discipline-cases/${case1}/schedule-hearing", payload: { hearing_at: "2026-09-10T15:00:00Z", hearing_officer_id: "${dean2}" }, as: Dean, as_user_id: "${dean1}" }
            - { call: "POST /reslife/discipline-cases/${case1}/record-outcome", payload: { outcome: "SANCTIONED", sanction_type: "PROBATION", points_assessed: 6 }, as: Dean, as_user_id: "${dean2}" }
            - { call: "GET /reslife/students/${stu}", payload: {}, as: SchoolAdmin, captures: { pts_mid: "$.data.demerit_points" } }
            - { call: "POST /reslife/discipline-cases/${case1}/appeal", payload: {}, as: Student, as_user_id: "${stu}" }
          trigger:
            - { call: "POST /reslife/discipline-cases/${case1}/appeal-decision", payload: { decision: "OVERTURN" }, as: Dean, as_user_id: "${dean2}" }
            - { call: "GET /reslife/students/${stu}", payload: {}, as: SchoolAdmin, captures: { pts_end: "$.data.demerit_points", st_end: "$.data.discipline_standing" } }
            - { call: "GET /reslife/discipline-cases/${case1}", payload: {}, as: Dean, as_user_id: "${dean1}", captures: { c_status: "$.data.status", c_points: "$.data.points_assessed" } }
          assert:
            - "captured pts_mid == 6"
            - "captured pts_end == 0 (exact reversal; no drift)"
            - "captured st_end == GOOD"
            - "captured c_status == DISMISSED and c_points == 0"
