        grounds:
          - calculations.cluster_ccu_overlap_load
          - validations[priority=30]
          - errors[ERR_CLUSTER_CAPACITY_EXCEEDED]
          - state_machines.LiveEvent.PLANNED_to_APPROVED
          - entities.CapacityCluster.fields.reserved_ccu
