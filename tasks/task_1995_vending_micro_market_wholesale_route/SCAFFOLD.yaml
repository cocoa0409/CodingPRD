# =============================================================================
# Task 1995: Vending & Micro-Market Wholesale Route Supply (Vistar-style)
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  1995. Vending & Micro-Market Wholesale Route Supply (Vistar style supplier):
  operator account & product mix by location type, DEX/telemetry-driven
  replenishment order, planogram change & slow-mover cull, promotional pricing
  & margin per vend, delivery-day route & minimum order, expired/short-date
  credit, equipment parts & service supply, cash vs cashless settlement linkage

domain_name: vending-wholesale-route-supply
api_prefix: /wholesale

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine        # promo resolution, margin per vend, min-order thresholds, credit tiers
  secondary_archetype: event_sourcing      # append-only DEX telemetry drives projection, suggestion, settlement
  complexity_layers:
    - dual_variant_calculation             # provisional vs realized margin; firm vs optimistic route capacity
    - cascading_side_effects               # claim-approve -> balance -> auto-apply -> order SETTLED; telemetry -> projection -> draft refresh
    - optimistic_concurrency               # OCC on Location.version (planogram activation) and ReplenishmentOrder.version (draft patch)
    - rate_threshold_triggers              # slow-mover cull threshold, route day capacity, min-order value
  entity_topology: flat                    # peer entities joined by FK references; no nested creation URLs
  state_machine_shape: branching           # order has a revise cycle + parallel settlement dimension; claim forks approve/reject
  relationship_patterns:
    - one_to_many                          # Operator->Location->(Planogram, TelemetryEvent, ServiceTicket); Operator->Order/CreditClaim
    - cross_aggregate                      # Order references Route/Product/Planogram data; CreditClaim references Order lines
  role_model: peer_roles                   # WholesaleAdmin / OperatorManager / RoutePlanner / WarehouseOps / CreditAdjuster / TelemetryGateway
  consistency_model: immediate             # every mutation visible in its own response; no async reconciliation

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Operator
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Operator (vending customer) company name" }
      - { name: default_tender, type: enum, source: input, default: "CASH", description: "Default settlement tender: CASH | CASHLESS" }
      - { name: credit_balance_cents, type: integer, source: computed, default: 0, description: "Approved, not-yet-applied credit memo balance available to this operator" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED (cycle; no terminal state)" }

  - name: DeliveryRoute
    parent: null
    common_fields: true
    fields:
      - { name: route_code, type: string, source: input, description: "Human route code (e.g. R-NORTH)" }
      - { name: delivery_weekdays, type: array, source: input, description: "Array of weekday enums served: MON|TUE|WED|THU|FRI|SAT|SUN" }
      - { name: daily_case_capacity, type: integer, source: input, description: "Max total cases the route can physically deliver per delivery date" }
      - { name: min_order_cents, type: integer, source: input, description: "Minimum order_total_cents required at submit for orders on this route" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Catalog SKU; unique across all products (ERR_DUPLICATE_SKU)" }
      - { name: name, type: string, source: input, description: "Product name" }
      - { name: category, type: enum, source: input, description: "BEVERAGE | SNACK | CANDY | CHILLED | FROZEN" }
      - { name: eligible_location_types, type: array, source: input, description: "Subset of OFFICE|SCHOOL|HOSPITAL|GYM where this product may be vended (product mix by location type)" }
      - { name: case_pack_qty, type: integer, source: input, description: "Vend units per wholesale case (> 0)" }
      - { name: base_price_cents, type: integer, source: input, description: "Wholesale list price per case, before promotions" }
      - { name: cost_cents, type: integer, source: input, description: "Supplier landed cost per case (margin accounting)" }
      - { name: shelf_life_days, type: integer, source: input, description: "Shelf life in days from pack date" }
      - { name: perishability_class, type: enum, source: input, default: "AMBIENT", description: "AMBIENT | CHILLED | FROZEN" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED" }

  - name: Location
    parent: null
    common_fields: true
    fields:
      - { name: operator_id, type: string, source: input, description: "FK -> Operator.id; owning operator account" }
      - { name: name, type: string, source: input, description: "Location name (site / machine bank)" }
      - { name: location_type, type: enum, source: input, description: "OFFICE | SCHOOL | HOSPITAL | GYM — gates product eligibility" }
      - { name: route_id, type: string, source: input, description: "FK -> DeliveryRoute.id; assigned delivery route" }
      - { name: on_hand_projection, type: array, source: computed, default: [], description: "Latest projected on-hand per product: [{product_id, on_hand_units, as_of_event_id}] rebuilt on each telemetry ingest" }

  - name: Planogram
    parent: null
    common_fields: true
    fields:
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; planogram owner" }
      - { name: name, type: string, source: input, description: "Planogram label" }
      - { name: slots, type: array, source: input, description: "Slot rows: [{slot_code, product_id, par_level_units, vend_price_cents}]; product_id must be unique within slots; cull_flag is system-managed" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | ARCHIVED (at most one ACTIVE per location)" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock timestamp of activation; null until ACTIVE" }

  - name: TelemetryEvent
    parent: null
    common_fields: false   # append-only DEX event log: id + created_at only; immutable, no update endpoints
    fields:
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; machine bank that reported" }
      - { name: recorded_at, type: datetime, source: input, description: "DEX meter timestamp of the reading" }
      - { name: cash_collected_cents, type: integer, source: input, description: "Cash channel collections since previous event" }
      - { name: cashless_sales_cents, type: integer, source: input, description: "Cashless channel sales since previous event" }
      - { name: items, type: array, source: input, description: "Per-product meters: [{product_id, units_vended, on_hand_units}]" }

  - name: ReplenishmentOrder
    parent: null
    common_fields: true
    fields:
      - { name: operator_id, type: string, source: system, description: "FK -> Operator.id; copied from location.operator_id at creation" }
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; delivery destination" }
      - { name: route_id, type: string, source: system, description: "FK -> DeliveryRoute.id; snapshot of location.route_id at creation" }
      - { name: source, type: enum, source: system, description: "MANUAL (POST /orders) | TELEMETRY_SUGGESTED (generate-from-telemetry)" }
      - { name: requested_delivery_date, type: string, source: input, description: "ISO date YYYY-MM-DD; validated against route weekdays at submit" }
      - { name: lines, type: array, source: input, description: "[{product_id, quantity_cases}]; unit_price_cents/line_total_cents are computed at submit and stored per line" }
      - { name: total_cases, type: integer, source: computed, default: 0, description: "Sum of quantity_cases over lines; recomputed on every line mutation" }
      - { name: order_total_cents, type: integer, source: computed, default: 0, description: "Sum of line_total_cents; 0 until submit computes pricing; reset to 0 on revise" }
      - { name: promo_discount_cents, type: integer, source: computed, default: 0, description: "Total promotional discount applied at submit; reset to 0 on revise" }
      - { name: provisional_margin_per_vend_cents, type: integer, source: computed, description: "Order-time margin estimate per vend unit (null until submit; reset to null on revise)" }
      - { name: realized_margin_per_vend_cents, type: integer, source: computed, description: "Settlement-time realized margin per vend unit (null until settle)" }
      - { name: cashless_fee_cents, type: integer, source: computed, description: "Cashless processing fee applied at settle (null until settle)" }
      - { name: amount_due_cents, type: integer, source: computed, default: 0, description: "Open receivable; set = order_total_cents at delivery, reduced by credit applications" }
      - { name: credit_applied_cents, type: integer, source: computed, default: 0, description: "Total operator credit applied to this order" }
      - { name: settled_tender, type: enum, source: system, description: "CASH | CASHLESS recorded at settle; null until settle" }
      - { name: settlement_telemetry_event_id, type: string, source: system, description: "FK -> TelemetryEvent.id; DEX event the settlement reconciled against; null until settle" }
      - { name: fulfillment_status, type: enum, source: system, description: "DRAFT | SUBMITTED | CONFIRMED | DELIVERED | CANCELLED" }
      - { name: settlement_status, type: enum, source: system, description: "UNINVOICED | OPEN | SETTLED — parallel dimension to fulfillment_status" }

  - name: Promotion
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; discounted product" }
      - { name: operator_id, type: string, source: input, description: "FK -> Operator.id; null/omitted = global promotion visible to all operators", default: null }
      - { name: discount_type, type: enum, source: input, description: "PERCENT_OFF (discount_value = whole percent) | CENTS_OFF (discount_value = cents per case)" }
      - { name: discount_value, type: integer, source: input, description: "Percent (1-100) or cents-per-case (> 0) depending on discount_type" }
      - { name: starts_at, type: datetime, source: input, description: "Window start (inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "Window end (exclusive) — half-open [starts_at, ends_at)" }
      - { name: stacking_class, type: enum, source: input, description: "EXCLUSIVE (best one wins alone) | STACKABLE (sums with other stackables)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | TERMINATED" }

  - name: CreditClaim
    parent: null
    common_fields: true
    fields:
      - { name: operator_id, type: string, source: system, description: "FK -> Operator.id; copied from order.operator_id at creation" }
      - { name: order_id, type: string, source: input, description: "FK -> ReplenishmentOrder.id; the delivered order the claim is filed against" }
      - { name: lines, type: array, source: input, description: "[{product_id, quantity_units, expiration_date}]; line_credit_cents computed per line at creation and pinned" }
      - { name: requested_credit_cents, type: integer, source: computed, description: "Sum of line credits, computed at creation, immutable thereafter" }
      - { name: applied_cents, type: integer, source: computed, default: 0, description: "Portion of the approved credit already applied to open orders" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED | VOIDED | SETTLED" }

  - name: ServiceTicket
    parent: null
    common_fields: true
    fields:
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; machine bank needing parts/service" }
      - { name: equipment_model, type: string, source: input, description: "Machine model identifier" }
      - { name: issue_type, type: enum, source: input, description: "PART_REPLACEMENT | REPAIR | PREVENTIVE" }
      - { name: parts, type: array, source: input, description: "Ordered parts: [{part_sku, part_name, quantity, unit_price_cents}]" }
      - { name: parts_total_cents, type: integer, source: computed, description: "Sum of quantity*unit_price_cents over parts; 0 when parts empty" }
      - { name: service_date, type: string, source: system, description: "Scheduled service date YYYY-MM-DD; null until scheduled" }
      - { name: status, type: enum, source: system, description: "OPEN | SCHEDULED | COMPLETED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Operator
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /wholesale/operators/{operatorId}/suspend
        actor: WholesaleAdmin
        preconditions:
          - "Operator must be ACTIVE (else ERR_OPERATOR_NOT_ACTIVE)"
        side_effects:
          - "Blocks new submits/confirms/claims/tickets for this operator via related-state validations (no child rows mutated)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /wholesale/operators/{operatorId}/reinstate
        actor: WholesaleAdmin
        preconditions:
          - "Operator must be SUSPENDED (else ERR_OPERATOR_NOT_ACTIVE)"
        side_effects: []
    note: "Cyclic machine: ACTIVE <-> SUSPENDED may loop indefinitely."

  - entity: Product
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: POST /wholesale/products/{productId}/discontinue
        actor: WholesaleAdmin
        preconditions:
          - "Product must be ACTIVE (else ERR_PRODUCT_DISCONTINUED)"
        side_effects:
          - "Future submits referencing this product fail ERR_PRODUCT_DISCONTINUED; existing SUBMITTED+ orders keep their pinned prices"

  - entity: Planogram
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /wholesale/planograms/{planogramId}/activate
        actor: OperatorManager
        preconditions:
          - "Planogram must be DRAFT (else ERR_PLANOGRAM_NOT_DRAFT)"
          - "OCC: expected_location_version must equal Location.version (else ERR_STALE_VERSION)"
          - "Every slot product must exist, be ACTIVE (else ERR_PRODUCT_DISCONTINUED), and be eligible for location.location_type (else ERR_PRODUCT_NOT_ELIGIBLE_FOR_LOCATION_TYPE)"
        side_effects:
          - "Previous ACTIVE planogram of the same location (if any) -> ARCHIVED (supersede)"
          - "activated_at = current logical clock"
          - "Increments Location.version by 1 (supersede is observable through the parent)"
      - from: ACTIVE
        to: ARCHIVED
        trigger: "system (automatic when a newer planogram for the same location is activated)"
        actor: system
        preconditions: []
        side_effects:
          - "Slow-mover cull flags on the archived planogram no longer affect suggestions (only the ACTIVE planogram drives replenishment)"
    note: "Branching with version-pinning: DRAFT planograms pile up until one is activated; activation atomically supersedes the incumbent."

  - entity: ReplenishmentOrder
    initial_state: DRAFT (fulfillment_status) + UNINVOICED (settlement_status)
    terminal_states: [CANCELLED (fulfillment), SETTLED (settlement); DELIVERED is fulfillment-terminal for new fulfillment transitions but the settlement dimension continues to SETTLED]
    note: "Parallel state dimensions: fulfillment_status and settlement_status evolve independently on the same row."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /wholesale/orders/{orderId}/submit
        actor: OperatorManager
        preconditions:
          - "fulfillment_status == DRAFT (else ERR_ORDER_NOT_DRAFT)"
          - "Operator.status == ACTIVE (else ERR_OPERATOR_NOT_ACTIVE)"
          - "Location has an ACTIVE planogram (else ERR_NO_ACTIVE_PLANOGRAM) and every line product appears on it (else ERR_PRODUCT_NOT_ON_PLANOGRAM)"
          - "lines non-empty (else ERR_EMPTY_ORDER); every quantity_cases > 0 (else ERR_INVALID_QUANTITY)"
          - "requested_delivery_date strictly after current logical date (else ERR_DELIVERY_DATE_NOT_FUTURE) and its weekday in route.delivery_weekdays (else ERR_DELIVERY_DAY_NOT_SERVED)"
          - "Every line product ACTIVE (else ERR_PRODUCT_DISCONTINUED) and eligible for location_type (else ERR_PRODUCT_NOT_ELIGIBLE_FOR_LOCATION_TYPE)"
          - "order_total_cents >= route.min_order_cents (else ERR_MIN_ORDER_NOT_MET)"
        side_effects:
          - "Compute per-line pricing (order_pricing: promo resolution + per-line rounding) and pin unit_price_cents/line_total_cents on each line"
          - "Set order_total_cents, promo_discount_cents, provisional_margin_per_vend_cents (margin_per_vend provisional variant)"
          - "Increments ReplenishmentOrder.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: POST /wholesale/orders/{orderId}/revise
        actor: OperatorManager
        preconditions:
          - "fulfillment_status == SUBMITTED (else ERR_ORDER_NOT_SUBMITTED)"
        side_effects:
          - "Reset order_total_cents = 0, promo_discount_cents = 0, provisional_margin_per_vend_cents = null (pricing unpinned until next submit)"
          - "Increments ReplenishmentOrder.version by 1"
      - from: SUBMITTED
        to: CONFIRMED
        trigger: POST /wholesale/orders/{orderId}/confirm
        actor: RoutePlanner
        preconditions:
          - "fulfillment_status == SUBMITTED (else ERR_ORDER_NOT_SUBMITTED)"
          - "Operator.status == ACTIVE (else ERR_OPERATOR_NOT_ACTIVE)"
          - "Firm capacity: route_capacity_consumption(firm variant) + total_cases <= route.daily_case_capacity (else ERR_ROUTE_CAPACITY_EXCEEDED)"
        side_effects:
          - "Firm capacity consumption for (route_id, requested_delivery_date) increases by total_cases (derived aggregate)"
          - "Increments ReplenishmentOrder.version by 1"
      - from: CONFIRMED
        to: DELIVERED
        trigger: POST /wholesale/orders/{orderId}/mark-delivered
        actor: WarehouseOps
        preconditions:
          - "fulfillment_status == CONFIRMED (else ERR_ORDER_NOT_CONFIRMED)"
        side_effects:
          - "settlement_status: UNINVOICED -> OPEN"
          - "amount_due_cents = order_total_cents"
          - "Increments ReplenishmentOrder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: POST /wholesale/orders/{orderId}/cancel
        actor: OperatorManager
        preconditions:
          - "fulfillment_status IN {DRAFT, SUBMITTED, CONFIRMED} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: ["No capacity held from DRAFT; nothing to release"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: POST /wholesale/orders/{orderId}/cancel
        actor: OperatorManager
        preconditions:
          - "fulfillment_status IN {DRAFT, SUBMITTED, CONFIRMED}"
        side_effects: ["Optimistic capacity consumption released (derived aggregate drops out of the SUBMITTED set)"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: POST /wholesale/orders/{orderId}/cancel
        actor: OperatorManager
        preconditions:
          - "fulfillment_status IN {DRAFT, SUBMITTED, CONFIRMED}"
        side_effects:
          - "COMPENSATING ACTION: firm capacity consumption for (route_id, requested_delivery_date) decreases by exactly total_cases (restores pre-confirm value)"
          - "Increments ReplenishmentOrder.version by 1"
      - from: OPEN (settlement)
        to: SETTLED (settlement)
        trigger: POST /wholesale/orders/{orderId}/settle
        actor: WholesaleAdmin
        preconditions:
          - "settlement_status == OPEN (else ERR_ORDER_NOT_OPEN_FOR_SETTLEMENT)"
          - "telemetry_event_id must exist (else ERR_TELEMETRY_EVENT_NOT_FOUND) and belong to order.location_id (else ERR_TELEMETRY_EVENT_LOCATION_MISMATCH)"
        side_effects:
          - "Compute cashless_fee_cents and realized_margin_per_vend_cents (margin_per_vend realized variant)"
          - "Record settled_tender and settlement_telemetry_event_id"
          - "Increments ReplenishmentOrder.version by 1"
      - from: OPEN (settlement)
        to: SETTLED (settlement)
        trigger: "system (automatic when a credit application reduces amount_due_cents to 0)"
        actor: system
        preconditions: []
        side_effects: ["Auto-settlement by credit: no tender recorded (settled_tender stays null)"]

  - entity: CreditClaim
    initial_state: SUBMITTED
    terminal_states: [REJECTED, VOIDED, SETTLED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: POST /wholesale/credit-claims/{claimId}/approve
        actor: CreditAdjuster
        preconditions:
          - "Claim must be SUBMITTED (else ERR_CLAIM_NOT_SUBMITTED)"
        side_effects:
          - "CASCADE link 1: Operator.credit_balance_cents += requested_credit_cents"
          - "CASCADE link 2 (triggered BY link 1's balance increase): auto-apply credit to the operator's oldest order with settlement_status == OPEN (selector: settlement_status == OPEN, sort created_at ASC, tie-break never needed since created_at is unique to milliseconds; fallback: no OPEN order -> credit stays on balance). Applied amount X = min(credit_balance_cents, order.amount_due_cents): Operator.credit_balance_cents -= X, claim.applied_cents += X, order.credit_applied_cents += X, order.amount_due_cents -= X"
          - "CASCADE link 3 (triggered BY link 2's order mutation): if order.amount_due_cents == 0 then order.settlement_status -> SETTLED"
      - from: SUBMITTED
        to: REJECTED
        trigger: POST /wholesale/credit-claims/{claimId}/reject
        actor: CreditAdjuster
        preconditions:
          - "Claim must be SUBMITTED (else ERR_CLAIM_NOT_SUBMITTED)"
        side_effects: ["No credit is issued; Operator.credit_balance_cents unchanged"]
      - from: APPROVED
        to: VOIDED
        trigger: POST /wholesale/credit-claims/{claimId}/void
        actor: CreditAdjuster
        preconditions:
          - "Claim must be APPROVED with applied_cents == 0 (else ERR_CLAIM_NOT_VOIDABLE)"
        side_effects:
          - "COMPENSATING ACTION: Operator.credit_balance_cents -= requested_credit_cents (approve+void leaves the operator credit balance unchanged)"
      - from: APPROVED
        to: SETTLED
        trigger: "system (automatic when applied_cents == requested_credit_cents, i.e. the whole credit was absorbed by an open order)"
        actor: system
        preconditions: []
        side_effects: []
    note: "Branching fork at SUBMITTED -> {APPROVED, REJECTED}; APPROVED itself forks to VOIDED (manual compensation) or SETTLED (system, when applied_cents == requested_credit_cents after auto-application)."

  - entity: ServiceTicket
    initial_state: OPEN
    terminal_states: [COMPLETED]
    transitions:
      - from: OPEN
        to: SCHEDULED
        trigger: POST /wholesale/service-tickets/{ticketId}/schedule
        actor: RoutePlanner
        preconditions:
          - "Ticket must be OPEN (else ERR_TICKET_NOT_OPEN)"
          - "Operator of ticket.location_id must be ACTIVE (else ERR_OPERATOR_NOT_ACTIVE)"
          - "service_date strictly after current logical date (else ERR_DATE_NOT_FUTURE)"
        side_effects:
          - "service_date set"
      - from: SCHEDULED
        to: COMPLETED
        trigger: POST /wholesale/service-tickets/{ticketId}/complete
        actor: WarehouseOps
        preconditions:
          - "Ticket must be SCHEDULED (else ERR_TICKET_NOT_SCHEDULED)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: planogram-activate-stale-location
    parent_entity: Location
    write_endpoint: "POST /wholesale/planograms/{planogramId}/activate"
    occ_field: expected_location_version
    description: |
      Activating a planogram supersedes the location's currently ACTIVE planogram.
      The request is rejected when Location.version has advanced beyond the
      expected_location_version the client supplies — i.e. the client based its
      activation on a stale view of which planogram is incumbent (e.g. another
      activation already superseded it). Resolved purely by stale-version check.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: order-patch-stale-version
    parent_entity: ReplenishmentOrder
    write_endpoint: "PATCH /wholesale/orders/{orderId}"
    occ_field: expected_order_version
    description: |
      Editing a DRAFT order's lines or delivery date is rejected when the
      order's version has advanced beyond the supplied expected_order_version —
      e.g. a telemetry-driven suggestion refresh or a prior edit already
      rewrote the lines the client based its edit on. Resolved purely by
      stale-version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: suggested_replenishment_qty
    trigger: "POST /wholesale/orders/generate-from-telemetry; also re-run as a cascade on POST /wholesale/telemetry-events when the location has a DRAFT order with source == TELEMETRY_SUGGESTED"
    algorithm: projection
    input_set: "Slots of the location's ACTIVE planogram with cull_flag == false; per product, the latest TelemetryEvent item (max recorded_at; tie-break: later created_at)"
    formula: |
      For each ACTIVE-planogram slot with cull_flag == false:
        latest = telemetry event for this location containing an item for
                 slot.product_id with the maximum recorded_at
                 (tie-break: later created_at)
        if no such event item exists -> slot EXCLUDED from suggestion
        raw_units = slot.par_level_units - item.on_hand_units
        if raw_units <= 0 -> slot EXCLUDED
        suggested_cases = ceil(raw_units / product.case_pack_qty)
      Suggested order lines = [{product_id, quantity_cases: suggested_cases}]
      Refresh-on-ingest (cascade): recompute for the location's DRAFT
      TELEMETRY_SUGGESTED order (if several, the one with latest created_at);
      upsert/replace its lines; lines whose suggestion dropped to 0 are removed
      (an empty DRAFT is allowed; submit would fail ERR_EMPTY_ORDER).
    constants: {}
    precision: "integer cases; ceil division"

  - name: weekly_velocity_cull
    trigger: "POST /wholesale/planograms/{planogramId}/cull-evaluate (planogram must be ACTIVE)"
    algorithm: threshold
    input_set: "TelemetryEvents for the planogram's location with recorded_at in [now - 28 days, now] inclusive (logical clock); per slot product, sum of items[].units_vended"
    formula: |
      For each slot of the ACTIVE planogram:
        velocity_units_4wk = sum of units_vended for slot.product_id over the window
        if the product has NO event items in the window -> slot NOT culled (insufficient data)
        else slot.cull_flag = (velocity_units_4wk < CULL_MIN_UNITS_4WK)
      Boundary: velocity exactly == CULL_MIN_UNITS_4WK is NOT culled (strict <).
      Culled slots are excluded from suggested_replenishment_qty.
    constants:
      CULL_MIN_UNITS_4WK: 2
      CULL_WINDOW_DAYS: 28
    precision: "integer units"

  - name: order_pricing
    trigger: "POST /wholesale/orders/{orderId}/submit"
    algorithm: tiered_pricing
    input_set: "Order lines (product_id, quantity_cases); product.base_price_cents; promotions eligible per promo_price_resolution"
    formula: |
      PINNED ROUNDING ORDER (mode b): round per line per case, then sum.
      For each line:
        discount_per_case_cents = promo_price_resolution(product, operator)
          PERCENT_OFF p: round_half_up(base_price_cents * p / 100)
          CENTS_OFF c:   c
        line_unit_price_cents = max(0, base_price_cents - discount_per_case_cents)
        line_total_cents = line_unit_price_cents * quantity_cases   (integer exact)
      order_total_cents = sum(line_total_cents)
      promo_discount_cents = sum(base_price_cents * quantity_cases - line_total_cents)
      The alternative (sum raw discounts, then round once) is explicitly NOT
      used; e.g. two lines at base 995 with 10% off: per-line 100+100 = 200
      discount / total 1790, vs sum-then-round 199 / 1791.
    constants: {}
    precision: "0 decimal places (integer cents), round_half_up at the per-line-per-case step only"

  - name: promo_price_resolution
    trigger: "invoked by order_pricing for each line at submit"
    algorithm: constraint_propagation
    input_set: "Promotions with status == ACTIVE, starts_at <= now < ends_at (logical clock), product_id == line product, and (operator_id IS NULL or operator_id == order.operator_id)"
    formula: |
      effective_cents(p) = PERCENT_OFF: round_half_up(base_price_cents * discount_value / 100)
                           CENTS_OFF:   discount_value
      if any eligible EXCLUSIVE promotion:
        winner = the EXCLUSIVE promotion with max effective_cents;
                 tie-break: earliest created_at ASC (never id)
        result = effective_cents(winner)   (STACKABLE promotions ignored)
      else:
        result = sum of effective_cents over all eligible STACKABLE promotions
      Empty eligible set -> result = 0.
    constants: {}
    precision: "integer cents, round_half_up"

  - name: margin_per_vend
    trigger: "provisional at POST /orders/{id}/submit; realized at POST /orders/{id}/settle"
    algorithm: aggregation
    input_set: "provisional: order lines + ACTIVE planogram slot vend prices; realized: the settlement TelemetryEvent's cash_collected_cents, cashless_sales_cents and items"
    formula: |
      total_units = sum over lines (product.case_pack_qty * quantity_cases)
      PROVISIONAL (submit):
        retail_value = sum over lines (slot.vend_price_cents * case_pack_qty * quantity_cases)
                       where slot is the line product's slot on the location's ACTIVE planogram
        provisional_margin_per_vend_cents = round_half_up((retail_value - order_total_cents) / total_units)
      REALIZED (settle):
        cashless_fee_cents = round_half_up(event.cashless_sales_cents * CASHLESS_FEE_BPS / 10000)
        units_vended = sum of event.items[].units_vended
        if units_vended == 0 -> realized_margin_per_vend_cents = 0
        else realized = round_half_up((event.cash_collected_cents + event.cashless_sales_cents
                        - cashless_fee_cents - order_total_cents) / units_vended)
    constants:
      CASHLESS_FEE_BPS: 275   # 2.75% cashless processing fee
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "at submit; planogram vend prices stand in for actual sales"
        difference: "uses slot vend_price_cents and ignores cashless fees; generally differs from realized for identical catalog data because the true sales mix and fees only surface in DEX"
      - name: realized
        when: "at settle; reconciles against the referenced DEX telemetry event"
        difference: "uses actual cash+cashless collections minus the cashless fee over actual vended units"

  - name: route_capacity_consumption
    trigger: "GET /wholesale/routes/{routeId}/availability (both variants); POST /orders/{id}/confirm (firm variant gate)"
    algorithm: forward_looking
    input_set: "ReplenishmentOrders with route_id == route and requested_delivery_date == date, filtered by fulfillment_status per variant"
    formula: |
      firm_consumed_cases       = sum(total_cases) where fulfillment_status == CONFIRMED
      optimistic_consumed_cases = sum(total_cases) where fulfillment_status IN {SUBMITTED, CONFIRMED}
      firm_remaining_cases       = daily_case_capacity - firm_consumed_cases
      optimistic_remaining_cases = daily_case_capacity - optimistic_consumed_cases (may be negative)
      Confirm gate (firm): firm_consumed_cases + order.total_cases <= daily_case_capacity
      else ERR_ROUTE_CAPACITY_EXCEEDED. Boundary: exact equality PASSES (<=).
    constants: {}
    precision: "integer cases"
    variants:
      - name: firm
        when: "confirm gate and availability read"
        difference: "counts only CONFIRMED orders"
      - name: optimistic
        when: "availability read only (planner preview)"
        difference: "additionally counts SUBMITTED orders, so for the same date it is >= firm and strictly greater whenever any SUBMITTED order exists"

  - name: short_date_credit_amount
    trigger: "POST /wholesale/credit-claims (per line, computed and pinned at creation)"
    algorithm: tiered_pricing
    input_set: "Claim lines (product_id, quantity_units, expiration_date); the referenced order's pinned line unit_price_cents and product.case_pack_qty; current logical date"
    formula: |
      For each claim line:
        days_to_expiry = (expiration_date - current_logical_date).days
        if days_to_expiry < 0 (EXPIRED):
          eligible only when -days_to_expiry <= CLAIM_WINDOW_DAYS
          else whole claim rejected ERR_CLAIM_WINDOW_EXPIRED
          pct = 100%
        elif 0 <= days_to_expiry <= 7:   pct = 75%
        elif 8 <= days_to_expiry <= 14:  pct = 50%
        else (days_to_expiry > 14): whole claim rejected ERR_LINE_NOT_CREDITABLE
        order_line = the order's line for product_id (missing -> ERR_PRODUCT_NOT_ON_PLANOGRAM is NOT used;
                     a product absent from the order lines fails ERR_CLAIM_EXCEEDS_DELIVERED_QTY with delivered qty 0)
        line_credit_cents = round_half_up(order_line.unit_price_cents * quantity_units * pct / case_pack_qty)
      Aggregate gate: for each line, sum of quantity_units over this claim plus
      all non-terminal claims (status IN {SUBMITTED, APPROVED, SETTLED}) for the
      same (order_id, product_id) must be <= delivered units
      (order line quantity_cases * case_pack_qty), else ERR_CLAIM_EXCEEDS_DELIVERED_QTY.
      requested_credit_cents = sum(line_credit_cents), pinned at creation.
    constants:
      CLAIM_WINDOW_DAYS: 30
      SHORT_DATE_DAYS: 14
      DEEP_SHORT_DATE_DAYS: 7
    precision: "integer cents, round_half_up per line"
    variants:
      - name: expired_line
        when: "days_to_expiry < 0 and within the 30-day post-expiration claim window"
        difference: "credits 100% of the wholesale line price"
      - name: short_date_line
        when: "0 <= days_to_expiry <= 14"
        difference: "credits a tiered percentage (75% or 50%) — the same product/quantity yields a strictly smaller credit than the expired variant"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and name a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: business_constraint
    check: "Request shape: required fields present, enum members valid, types correct, integer quantities > 0"
    error_id: "ERR_INVALID_REQUEST | ERR_INVALID_QUANTITY"
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 3
    category: auth
    check: "Role must be listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Path template ids must exist, validated left-to-right"
    error_id: "ERR_OPERATOR_NOT_FOUND | ERR_LOCATION_NOT_FOUND | ERR_ROUTE_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_PROMOTION_NOT_FOUND | ERR_PLANOGRAM_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_CREDIT_CLAIM_NOT_FOUND | ERR_SERVICE_TICKET_NOT_FOUND"
    http_status: 404
    applies_to: "all parameterized paths"

  - priority: 5
    category: auth
    check: "Ownership: when X-User-Role is OperatorManager, X-User-ID must equal the target resource's operator_id (order/claim/ticket/planogram via their operator chain; location create: payload operator_id) — evaluated only after the target is known to exist"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all OperatorManager endpoints"

  - priority: 6
    category: existence
    check: "Body-referenced ids must exist: lines[].product_id, slots[].product_id, order_id, location_id, route_id, operator_id, product_id, telemetry_event_id"
    error_id: "matching ERR_*_NOT_FOUND (ERR_TELEMETRY_EVENT_NOT_FOUND for settle)"
    http_status: 404
    applies_to: "endpoints with body FK references"

  - priority: 7
    category: state
    check: "Target entity must be in the transition's required from-state"
    error_id: "ERR_ORDER_NOT_DRAFT | ERR_ORDER_NOT_SUBMITTED | ERR_ORDER_NOT_CONFIRMED | ERR_ORDER_NOT_OPEN_FOR_SETTLEMENT | ERR_PLANOGRAM_NOT_DRAFT | ERR_PLANOGRAM_NOT_ACTIVE | ERR_CLAIM_NOT_SUBMITTED | ERR_CLAIM_NOT_VOIDABLE | ERR_TICKET_NOT_OPEN | ERR_TICKET_NOT_SCHEDULED | ERR_PRODUCT_DISCONTINUED (re-discontinue) | ERR_OPERATOR_NOT_ACTIVE (re-suspend/reinstate) | ERR_INVALID_STATE_TRANSITION (cancel from DELIVERED/CANCELLED)"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: state
    check: "Related-entity gates: operator must be ACTIVE (order submit/confirm, ticket schedule); referenced order must be DELIVERED (claim create); location must have an ACTIVE planogram (order submit, generate-from-telemetry)"
    error_id: "ERR_OPERATOR_NOT_ACTIVE | ERR_ORDER_NOT_DELIVERED | ERR_NO_ACTIVE_PLANOGRAM"
    http_status: 409
    applies_to: "submit, confirm, claim create, ticket schedule, generate-from-telemetry"

  - priority: 9
    category: business_temporal
    check: "Temporal windows: requested_delivery_date strictly after current logical date; delivery weekday served by route; service_date strictly after current logical date; claim line within post-expiration claim window; claim line creditable (days_to_expiry <= 14)"
    error_id: "ERR_DELIVERY_DATE_NOT_FUTURE | ERR_DELIVERY_DAY_NOT_SERVED | ERR_DATE_NOT_FUTURE | ERR_CLAIM_WINDOW_EXPIRED | ERR_LINE_NOT_CREDITABLE"
    http_status: 422
    applies_to: "order submit, ticket schedule, claim create"

  - priority: 10
    category: business_constraint
    check: "Constraint satisfaction: promotion half-open window overlap per (product, operator scope); route-day firm capacity; SKU uniqueness; order non-empty at submit; suggestion non-empty at generate"
    error_id: "ERR_PROMOTION_WINDOW_OVERLAP | ERR_ROUTE_CAPACITY_EXCEEDED | ERR_DUPLICATE_SKU | ERR_EMPTY_ORDER | ERR_EMPTY_SUGGESTION"
    http_status: "409 | 409 | 409 | 422 | 422"
    applies_to: "promotion create, order confirm, product create, order submit, generate-from-telemetry"

  - priority: 11
    category: business_referential
    check: "Referential integrity of referenced-entity state: product ACTIVE at submit/activate; product eligible for location_type; every line product on the location's ACTIVE planogram; claim quantities within delivered quantities; settle telemetry event belongs to the order's location"
    error_id: "ERR_PRODUCT_DISCONTINUED | ERR_PRODUCT_NOT_ELIGIBLE_FOR_LOCATION_TYPE | ERR_PRODUCT_NOT_ON_PLANOGRAM | ERR_CLAIM_EXCEEDS_DELIVERED_QTY | ERR_TELEMETRY_EVENT_LOCATION_MISMATCH"
    http_status: 422
    applies_to: "order submit, planogram create/activate, claim create, settle"

  - priority: 12
    category: business_fiscal
    check: "Fiscal gates: order_total_cents >= route.min_order_cents at submit; requested credit application within operator credit balance at apply-credit"
    error_id: "ERR_MIN_ORDER_NOT_MET | ERR_INSUFFICIENT_CREDIT_BALANCE"
    http_status: 422
    applies_to: "order submit, apply-credit"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Operator ---
  - { method: POST, path: "/wholesale/operators", description: "Create operator account", roles: [WholesaleAdmin], code: 201, input: [name, "default_tender?"], output: Operator, side_effects: ["credit_balance_cents = 0", "status = ACTIVE"] }
  - { method: GET, path: "/wholesale/operators", description: "List operators", roles: [WholesaleAdmin, OperatorManager, RoutePlanner, WarehouseOps, CreditAdjuster, TelemetryGateway], code: 200, input: ["limit?", "offset?", "status?"], output: "Operator[]", side_effects: [] }
  - { method: GET, path: "/wholesale/operators/{operatorId}", description: "Get one operator", roles: [WholesaleAdmin, OperatorManager, RoutePlanner, WarehouseOps, CreditAdjuster, TelemetryGateway], code: 200, input: [], output: Operator, side_effects: [] }
  - { method: POST, path: "/wholesale/operators/{operatorId}/suspend", description: "ACTIVE -> SUSPENDED", roles: [WholesaleAdmin], code: 200, input: [], output: Operator, side_effects: ["status -> SUSPENDED"] }
  - { method: POST, path: "/wholesale/operators/{operatorId}/reinstate", description: "SUSPENDED -> ACTIVE", roles: [WholesaleAdmin], code: 200, input: [], output: Operator, side_effects: ["status -> ACTIVE"] }

  # --- DeliveryRoute ---
  - { method: POST, path: "/wholesale/routes", description: "Create delivery route", roles: [WholesaleAdmin], code: 201, input: [route_code, delivery_weekdays, daily_case_capacity, min_order_cents], output: DeliveryRoute, side_effects: [] }
  - { method: GET, path: "/wholesale/routes", description: "List routes", roles: [WholesaleAdmin, OperatorManager, RoutePlanner, WarehouseOps, CreditAdjuster, TelemetryGateway], code: 200, input: ["limit?", "offset?"], output: "DeliveryRoute[]", side_effects: [] }
  - { method: GET, path: "/wholesale/routes/{routeId}", description: "Get one route", roles: [WholesaleAdmin, OperatorManager, RoutePlanner, WarehouseOps, CreditAdjuster, TelemetryGateway], code: 200, input: [], output: DeliveryRoute, side_effects: [] }
  - method: GET
    path: "/wholesale/routes/{routeId}/availability"
    description: "Computed read: firm vs optimistic capacity consumption for a delivery date (route_capacity_consumption both variants)"
    roles: [WholesaleAdmin, OperatorManager, RoutePlanner, WarehouseOps, CreditAdjuster, TelemetryGateway]
    code: 200
    input: [date]
    output: { date: string, daily_case_capacity: integer, firm_consumed_cases: integer, optimistic_consumed_cases: integer, firm_remaining_cases: integer, optimistic_remaining_cases: integer }
    side_effects: []

  # --- Product ---
  - { method: POST, path: "/wholesale/products", description: "Create catalog product", roles: [WholesaleAdmin], code: 201, input: [sku, name, category, eligible_location_types, case_pack_qty, base_price_cents, cost_cents, shelf_life_days, "perishability_class?"], output: Product, side_effects: ["status = ACTIVE", "ERR_DUPLICATE_SKU if sku exists"] }
  - { method: GET, path: "/wholesale/products", description: "List products", roles: [WholesaleAdmin, OperatorManager, RoutePlanner, WarehouseOps, CreditAdjuster, TelemetryGateway], code: 200, input: ["limit?", "offset?", "status?", "category?"], output: "Product[]", side_effects: [] }
  - { method: GET, path: "/wholesale/products/{productId}", description: "Get one product", roles: [WholesaleAdmin, OperatorManager, RoutePlanner, WarehouseOps, CreditAdjuster, TelemetryGateway], code: 200, input: [], output: Product, side_effects: [] }
  - { method: POST, path: "/wholesale/products/{productId}/discontinue", description: "ACTIVE -> DISCONTINUED", roles: [WholesaleAdmin], code: 200, input: [], output: Product, side_effects: ["status -> DISCONTINUED"] }

  # --- Location ---
  - { method: POST, path: "/wholesale/locations", description: "Create location for an operator (OperatorManager may only create for own operator_id)", roles: [WholesaleAdmin, OperatorManager], code: 201, input: [operator_id, name, location_type, route_id], output: Location, side_effects: ["on_hand_projection = []"] }
  - { method: GET, path: "/wholesale/locations", description: "List locations (FK reverse lookup by operator_id / route_id)", roles: [WholesaleAdmin, OperatorManager, RoutePlanner, WarehouseOps, CreditAdjuster, TelemetryGateway], code: 200, input: ["limit?", "offset?", "operator_id?", "route_id?"], output: "Location[]", side_effects: [] }
  - { method: GET, path: "/wholesale/locations/{locationId}", description: "Get one location", roles: [WholesaleAdmin, OperatorManager, RoutePlanner, WarehouseOps, CreditAdjuster, TelemetryGateway], code: 200, input: [], output: Location, side_effects: [] }
  - { method: GET, path: "/wholesale/locations/{id}/telemetry-events", description: "List DEX telemetry events for a location (sub-resource FK reverse lookup)", roles: [WholesaleAdmin, OperatorManager, RoutePlanner, WarehouseOps, CreditAdjuster, TelemetryGateway], code: 200, input: ["limit?", "offset?"], output: "TelemetryEvent[]", side_effects: [] }

  # --- Planogram ---
  - { method: POST, path: "/wholesale/planograms", description: "Create DRAFT planogram for a location (slot products must exist and be eligible for location_type)", roles: [OperatorManager], code: 201, input: [location_id, name, slots], output: Planogram, side_effects: ["status = DRAFT", "slot cull_flags initialized false"] }
  - { method: GET, path: "/wholesale/planograms", description: "List planograms (FK reverse lookup by location_id)", roles: [WholesaleAdmin, OperatorManager, RoutePlanner, WarehouseOps, CreditAdjuster, TelemetryGateway], code: 200, input: ["limit?", "offset?", "location_id?"], output: "Planogram[]", side_effects: [] }
  - { method: GET, path: "/wholesale/planograms/{planogramId}", description: "Get one planogram", roles: [WholesaleAdmin, OperatorManager, RoutePlanner, WarehouseOps, CreditAdjuster, TelemetryGateway], code: 200, input: [], output: Planogram, side_effects: [] }
  - { method: POST, path: "/wholesale/planograms/{planogramId}/activate", description: "DRAFT -> ACTIVE; supersedes the location's incumbent ACTIVE planogram (OCC on Location.version)", roles: [OperatorManager], code: 200, input: [expected_location_version], output: Planogram, side_effects: ["status -> ACTIVE", "incumbent ACTIVE -> ARCHIVED", "activated_at = logical clock", "increments Location.version by 1"] }
  - { method: POST, path: "/wholesale/planograms/{planogramId}/cull-evaluate", description: "Run weekly_velocity_cull over the ACTIVE planogram; sets per-slot cull_flag", roles: [OperatorManager], code: 200, input: [], output: Planogram, side_effects: ["slots[].cull_flag updated per weekly_velocity_cull", "increments Planogram.version by 1"] }

  # --- Promotion ---
  - { method: POST, path: "/wholesale/promotions", description: "Create promotion; rejects half-open window overlap on same (product_id, operator scope). Operator scope equality: operator_id values equal, with null (global) equal ONLY to null — a global promotion may overlap an operator-specific one for the same product, and per-operator promos for different operators never conflict", roles: [WholesaleAdmin], code: 201, input: [product_id, "operator_id?", discount_type, discount_value, starts_at, ends_at, stacking_class], output: Promotion, side_effects: ["status = ACTIVE"] }
  - { method: GET, path: "/wholesale/promotions", description: "List promotions (FK reverse lookup by product_id / operator_id)", roles: [WholesaleAdmin, OperatorManager, RoutePlanner, WarehouseOps, CreditAdjuster, TelemetryGateway], code: 200, input: ["limit?", "offset?", "product_id?", "operator_id?"], output: "Promotion[]", side_effects: [] }
  - { method: GET, path: "/wholesale/promotions/{promotionId}", description: "Get one promotion", roles: [WholesaleAdmin, OperatorManager, RoutePlanner, WarehouseOps, CreditAdjuster, TelemetryGateway], code: 200, input: [], output: Promotion, side_effects: [] }
  - { method: POST, path: "/wholesale/promotions/{promotionId}/terminate", description: "ACTIVE -> TERMINATED (early stop; excluded from future pricing and from overlap checks)", roles: [WholesaleAdmin], code: 200, input: [], output: Promotion, side_effects: ["status -> TERMINATED"] }

  # --- TelemetryEvent (append-only DEX log) ---
  - method: POST
    path: "/wholesale/telemetry-events"
    description: "Ingest a DEX telemetry event for a location (append-only)"
    roles: [TelemetryGateway]
    code: 201
    input: [location_id, recorded_at, cash_collected_cents, cashless_sales_cents, items]
    output: TelemetryEvent
    side_effects:
      - "CASCADE B link 1: Location.on_hand_projection rebuilt — per item product, on_hand_units from the event with max recorded_at (tie-break later created_at); increments Location.version"
      - "CASCADE B link 2 (triggered BY link 1's projection change): the location's DRAFT order with source == TELEMETRY_SUGGESTED (if several, latest created_at) has its lines recomputed per suggested_replenishment_qty; zero-suggestion lines removed; increments that order's version"

  # --- ReplenishmentOrder ---
  - { method: POST, path: "/wholesale/orders", description: "Create MANUAL DRAFT order (existence checks only; pricing/temporal/fiscal checks deferred to submit)", roles: [OperatorManager], code: 201, input: [location_id, requested_delivery_date, lines], output: ReplenishmentOrder, side_effects: ["operator_id and route_id copied from location", "source = MANUAL", "fulfillment_status = DRAFT, settlement_status = UNINVOICED", "total_cases computed"] }
  - { method: POST, path: "/wholesale/orders/generate-from-telemetry", description: "Create TELEMETRY_SUGGESTED DRAFT order from the location's ACTIVE planogram + latest telemetry projection (suggested_replenishment_qty)", roles: [OperatorManager], code: 201, input: [location_id, requested_delivery_date], output: ReplenishmentOrder, side_effects: ["requires ACTIVE planogram (ERR_NO_ACTIVE_PLANOGRAM)", "lines = suggested_replenishment_qty result (empty -> ERR_EMPTY_SUGGESTION)", "source = TELEMETRY_SUGGESTED", "fulfillment_status = DRAFT, settlement_status = UNINVOICED"] }
  - { method: GET, path: "/wholesale/orders", description: "List orders (FK reverse lookup by operator_id / location_id / route_id / settlement_telemetry_event_id)", roles: [WholesaleAdmin, OperatorManager, RoutePlanner, WarehouseOps, CreditAdjuster, TelemetryGateway], code: 200, input: ["limit?", "offset?", "operator_id?", "location_id?", "route_id?", "fulfillment_status?", "settlement_telemetry_event_id?"], output: "ReplenishmentOrder[]", side_effects: [] }
  - { method: GET, path: "/wholesale/orders/{orderId}", description: "Get one order", roles: [WholesaleAdmin, OperatorManager, RoutePlanner, WarehouseOps, CreditAdjuster, TelemetryGateway], code: 200, input: [], output: ReplenishmentOrder, side_effects: [] }
  - { method: PATCH, path: "/wholesale/orders/{orderId}", description: "Edit DRAFT order lines and/or delivery date (OCC on ReplenishmentOrder.version)", roles: [OperatorManager], code: 200, input: [expected_order_version, "requested_delivery_date?", "lines?"], output: ReplenishmentOrder, side_effects: ["fulfillment_status must be DRAFT (ERR_ORDER_NOT_DRAFT)", "total_cases recomputed", "increments ReplenishmentOrder.version by 1"] }
  - { method: POST, path: "/wholesale/orders/{orderId}/submit", description: "DRAFT -> SUBMITTED; runs order_pricing + provisional margin_per_vend and all submit gates", roles: [OperatorManager], code: 200, input: [], output: ReplenishmentOrder, side_effects: ["per-line unit_price_cents/line_total_cents pinned", "order_total_cents, promo_discount_cents, provisional_margin_per_vend_cents computed", "fulfillment_status -> SUBMITTED", "increments ReplenishmentOrder.version by 1"] }
  - { method: POST, path: "/wholesale/orders/{orderId}/revise", description: "SUBMITTED -> DRAFT (revision loop); clears pinned pricing", roles: [OperatorManager], code: 200, input: [], output: ReplenishmentOrder, side_effects: ["order_total_cents = 0, promo_discount_cents = 0, provisional_margin_per_vend_cents = null", "fulfillment_status -> DRAFT", "increments ReplenishmentOrder.version by 1"] }
  - { method: POST, path: "/wholesale/orders/{orderId}/confirm", description: "SUBMITTED -> CONFIRMED; firm route-capacity gate", roles: [RoutePlanner], code: 200, input: [], output: ReplenishmentOrder, side_effects: ["firm capacity consumption for (route_id, requested_delivery_date) += total_cases", "fulfillment_status -> CONFIRMED", "increments ReplenishmentOrder.version by 1"] }
  - { method: POST, path: "/wholesale/orders/{orderId}/cancel", description: "DRAFT|SUBMITTED|CONFIRMED -> CANCELLED; compensating release of firm capacity when CONFIRMED", roles: [OperatorManager], code: 200, input: [], output: ReplenishmentOrder, side_effects: ["fulfillment_status -> CANCELLED", "if was CONFIRMED: firm capacity consumption -= total_cases (exact restoration)", "increments ReplenishmentOrder.version by 1"] }
  - { method: POST, path: "/wholesale/orders/{orderId}/mark-delivered", description: "CONFIRMED -> DELIVERED; opens settlement", roles: [WarehouseOps], code: 200, input: [], output: ReplenishmentOrder, side_effects: ["fulfillment_status -> DELIVERED", "settlement_status UNINVOICED -> OPEN", "amount_due_cents = order_total_cents (if 0, settlement_status goes straight to SETTLED)", "increments ReplenishmentOrder.version by 1"] }
  - { method: POST, path: "/wholesale/orders/{orderId}/apply-credit", description: "Apply operator credit balance to an OPEN order; X = min(amount_cents if given else balance, amount_due_cents)", roles: [OperatorManager], code: 200, input: ["amount_cents?"], output: ReplenishmentOrder, side_effects: ["settlement_status must be OPEN (ERR_ORDER_NOT_OPEN_FOR_SETTLEMENT)", "balance 0 or amount_cents > balance -> ERR_INSUFFICIENT_CREDIT_BALANCE", "Operator.credit_balance_cents -= X; order.credit_applied_cents += X; amount_due_cents -= X", "if amount_due_cents == 0: settlement_status -> SETTLED", "increments ReplenishmentOrder.version by 1"] }
  - { method: POST, path: "/wholesale/orders/{orderId}/settle", description: "OPEN -> SETTLED with cash vs cashless reconciliation against a DEX event of the same location", roles: [WholesaleAdmin], code: 200, input: [tender_type, telemetry_event_id], output: ReplenishmentOrder, side_effects: ["cashless_fee_cents and realized_margin_per_vend_cents computed (margin_per_vend realized variant)", "settled_tender and settlement_telemetry_event_id recorded", "settlement_status -> SETTLED", "increments ReplenishmentOrder.version by 1"] }

  # --- CreditClaim ---
  - { method: POST, path: "/wholesale/credit-claims", description: "File expired/short-date credit claim against a DELIVERED order (credits computed and pinned at creation)", roles: [OperatorManager], code: 201, input: [order_id, lines], output: CreditClaim, side_effects: ["operator_id copied from order", "short_date_credit_amount computed per line; requested_credit_cents pinned", "status = SUBMITTED"] }
  - { method: GET, path: "/wholesale/credit-claims", description: "List claims (FK reverse lookup by operator_id / order_id)", roles: [WholesaleAdmin, OperatorManager, RoutePlanner, WarehouseOps, CreditAdjuster, TelemetryGateway], code: 200, input: ["limit?", "offset?", "operator_id?", "order_id?"], output: "CreditClaim[]", side_effects: [] }
  - { method: GET, path: "/wholesale/credit-claims/{claimId}", description: "Get one claim", roles: [WholesaleAdmin, OperatorManager, RoutePlanner, WarehouseOps, CreditAdjuster, TelemetryGateway], code: 200, input: [], output: CreditClaim, side_effects: [] }
  - { method: POST, path: "/wholesale/credit-claims/{claimId}/approve", description: "SUBMITTED -> APPROVED; issues credit and cascades auto-application to the operator's oldest OPEN order", roles: [CreditAdjuster], code: 200, input: [], output: CreditClaim, side_effects: ["Operator.credit_balance_cents += requested_credit_cents", "auto-apply min(balance, amount_due) to oldest OPEN order (created_at ASC; fallback none)", "applied order with amount_due 0 -> SETTLED; claim with applied_cents == requested_credit_cents -> SETTLED"] }
  - { method: POST, path: "/wholesale/credit-claims/{claimId}/reject", description: "SUBMITTED -> REJECTED; no credit issued", roles: [CreditAdjuster], code: 200, input: [], output: CreditClaim, side_effects: ["status -> REJECTED"] }
  - { method: POST, path: "/wholesale/credit-claims/{claimId}/void", description: "APPROVED -> VOIDED; compensating reversal of the issued credit (requires applied_cents == 0 and sufficient pooled balance)", roles: [CreditAdjuster], code: 200, input: [], output: CreditClaim, side_effects: ["requires applied_cents == 0 and credit_balance_cents >= requested_credit_cents (else ERR_CLAIM_NOT_VOIDABLE)", "Operator.credit_balance_cents -= requested_credit_cents"] }

  # --- ServiceTicket ---
  - { method: POST, path: "/wholesale/service-tickets", description: "Open an equipment parts / service supply ticket for a location", roles: [OperatorManager], code: 201, input: [location_id, equipment_model, issue_type, parts], output: ServiceTicket, side_effects: ["status = OPEN", "parts_total_cents computed"] }
  - { method: GET, path: "/wholesale/service-tickets", description: "List tickets (FK reverse lookup by location_id)", roles: [WholesaleAdmin, OperatorManager, RoutePlanner, WarehouseOps, CreditAdjuster, TelemetryGateway], code: 200, input: ["limit?", "offset?", "location_id?"], output: "ServiceTicket[]", side_effects: [] }
  - { method: GET, path: "/wholesale/service-tickets/{ticketId}", description: "Get one ticket", roles: [WholesaleAdmin, OperatorManager, RoutePlanner, WarehouseOps, CreditAdjuster, TelemetryGateway], code: 200, input: [], output: ServiceTicket, side_effects: [] }
  - { method: POST, path: "/wholesale/service-tickets/{ticketId}/schedule", description: "OPEN -> SCHEDULED; service_date must be future; operator must be ACTIVE", roles: [RoutePlanner], code: 200, input: [service_date], output: ServiceTicket, side_effects: ["status -> SCHEDULED", "service_date set"] }
  - { method: POST, path: "/wholesale/service-tickets/{ticketId}/complete", description: "SCHEDULED -> COMPLETED", roles: [WarehouseOps], code: 200, input: [], output: ServiceTicket, side_effects: ["status -> COMPLETED"] }

  # --- Logical clock (test-driving endpoint) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock used by all date/window rules. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; the clock MUST NOT fall back to wall-clock time."
    roles: [WholesaleAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced; subsequent temporal validations and calculations use the new value"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, invalid enum member, wrong type, malformed date/datetime" }
  - { id: ERR_INVALID_QUANTITY, http: 400, condition: "quantity_cases / quantity_units / parts quantity <= 0" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint, or OperatorManager acting on another operator's resource" }
  - { id: ERR_OPERATOR_NOT_FOUND, http: 404, condition: "Operator id does not exist" }
  - { id: ERR_LOCATION_NOT_FOUND, http: 404, condition: "Location id does not exist" }
  - { id: ERR_ROUTE_NOT_FOUND, http: 404, condition: "DeliveryRoute id does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "Product id does not exist" }
  - { id: ERR_PROMOTION_NOT_FOUND, http: 404, condition: "Promotion id does not exist" }
  - { id: ERR_PLANOGRAM_NOT_FOUND, http: 404, condition: "Planogram id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "ReplenishmentOrder id does not exist" }
  - { id: ERR_CREDIT_CLAIM_NOT_FOUND, http: 404, condition: "CreditClaim id does not exist" }
  - { id: ERR_SERVICE_TICKET_NOT_FOUND, http: 404, condition: "ServiceTicket id does not exist" }
  - { id: ERR_TELEMETRY_EVENT_NOT_FOUND, http: 404, condition: "telemetry_event_id in settle does not exist" }
  - { id: ERR_OPERATOR_NOT_ACTIVE, http: 409, condition: "Operator must be ACTIVE (suspend/reinstate state; or related-entity gate on submit/confirm/schedule)" }
  - { id: ERR_ORDER_NOT_DRAFT, http: 409, condition: "PATCH or submit requires fulfillment_status == DRAFT" }
  - { id: ERR_ORDER_NOT_SUBMITTED, http: 409, condition: "confirm or revise requires fulfillment_status == SUBMITTED" }
  - { id: ERR_ORDER_NOT_CONFIRMED, http: 409, condition: "mark-delivered requires fulfillment_status == CONFIRMED" }
  - { id: ERR_ORDER_NOT_DELIVERED, http: 409, condition: "Credit claim create requires referenced order fulfillment_status == DELIVERED" }
  - { id: ERR_ORDER_NOT_OPEN_FOR_SETTLEMENT, http: 409, condition: "settle or apply-credit requires settlement_status == OPEN" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "cancel from DELIVERED or CANCELLED (or any other transition not in the machine)" }
  - { id: ERR_PLANOGRAM_NOT_DRAFT, http: 409, condition: "activate requires planogram DRAFT" }
  - { id: ERR_PLANOGRAM_NOT_ACTIVE, http: 409, condition: "cull-evaluate requires planogram ACTIVE" }
  - { id: ERR_NO_ACTIVE_PLANOGRAM, http: 409, condition: "Location has no ACTIVE planogram (order submit, generate-from-telemetry)" }
  - { id: ERR_CLAIM_NOT_SUBMITTED, http: 409, condition: "approve/reject requires claim SUBMITTED" }
  - { id: ERR_CLAIM_NOT_VOIDABLE, http: 409, condition: "void requires APPROVED with applied_cents == 0 and credit_balance_cents >= requested_credit_cents" }
  - { id: ERR_TICKET_NOT_OPEN, http: 409, condition: "schedule requires ticket OPEN" }
  - { id: ERR_TICKET_NOT_SCHEDULED, http: 409, condition: "complete requires ticket SCHEDULED" }
  - { id: ERR_PRODUCT_DISCONTINUED, http: 422, condition: "Product is DISCONTINUED (order submit / planogram activate referencing it; re-discontinue returns 409 per state tier)" }
  - { id: ERR_PRODUCT_NOT_ELIGIBLE_FOR_LOCATION_TYPE, http: 422, condition: "Product's eligible_location_types does not include the location's location_type" }
  - { id: ERR_PRODUCT_NOT_ON_PLANOGRAM, http: 422, condition: "Order line product is not on the location's ACTIVE planogram" }
  - { id: ERR_PROMOTION_WINDOW_OVERLAP, http: 409, condition: "Half-open [starts_at, ends_at) window overlaps another ACTIVE promotion for the same product and equal operator scope (null global scope equals only null; adjacency ends_at == starts_at is allowed)" }
  - { id: ERR_DELIVERY_DATE_NOT_FUTURE, http: 422, condition: "requested_delivery_date must be strictly after the current logical date" }
  - { id: ERR_DELIVERY_DAY_NOT_SERVED, http: 422, condition: "requested_delivery_date's weekday not in route.delivery_weekdays" }
  - { id: ERR_DATE_NOT_FUTURE, http: 422, condition: "service_date must be strictly after the current logical date" }
  - { id: ERR_CLAIM_WINDOW_EXPIRED, http: 422, condition: "Expired line claimed more than CLAIM_WINDOW_DAYS (30) days after expiration_date" }
  - { id: ERR_LINE_NOT_CREDITABLE, http: 422, condition: "Claim line with days_to_expiry > SHORT_DATE_DAYS (14) earns no credit" }
  - { id: ERR_CLAIM_EXCEEDS_DELIVERED_QTY, http: 422, condition: "Cumulative claimed units for (order, product) across non-terminal claims exceed delivered units (quantity_cases * case_pack_qty); product absent from order lines counts as 0 delivered" }
  - { id: ERR_ROUTE_CAPACITY_EXCEEDED, http: 409, condition: "Firm route-day capacity would be exceeded: firm_consumed + total_cases > daily_case_capacity (exact equality passes)" }
  - { id: ERR_MIN_ORDER_NOT_MET, http: 422, condition: "order_total_cents < route.min_order_cents at submit (exact equality passes)" }
  - { id: ERR_INSUFFICIENT_CREDIT_BALANCE, http: 422, condition: "apply-credit with zero balance or amount_cents > credit_balance_cents" }
  - { id: ERR_EMPTY_ORDER, http: 422, condition: "submit with zero lines" }
  - { id: ERR_EMPTY_SUGGESTION, http: 422, condition: "generate-from-telemetry produced zero suggested lines (all slots at/above par, culled, or lacking telemetry)" }
  - { id: ERR_DUPLICATE_SKU, http: 409, condition: "Product sku already exists" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC mismatch: expected_<parent>_version does not equal the parent's current version" }
  - { id: ERR_TELEMETRY_EVENT_LOCATION_MISMATCH, http: 422, condition: "settle telemetry event's location_id != order.location_id" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: WholesaleAdmin
    description: "Distributor back-office superuser: catalog, routes, promotions, operator lifecycle, settlement"
    identity: opaque
    exclusive_operations:
      - "POST /wholesale/operators, /operators/{id}/suspend, /operators/{id}/reinstate"
      - "POST /wholesale/routes"
      - "POST /wholesale/products, /products/{id}/discontinue"
      - "POST /wholesale/promotions, /promotions/{id}/terminate"
      - "POST /wholesale/orders/{id}/settle"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints", "POST /wholesale/locations"]

  - name: OperatorManager
    description: "Vending operator staff managing their own account's locations, planograms, orders, claims, and service tickets"
    identity: "entity_backed:Operator"
    exclusive_operations:
      - "POST /wholesale/planograms, /planograms/{id}/activate, /planograms/{id}/cull-evaluate"
      - "POST /wholesale/orders, /orders/generate-from-telemetry"
      - "PATCH /wholesale/orders/{id}"
      - "POST /wholesale/orders/{id}/submit, /revise, /cancel, /apply-credit"
      - "POST /wholesale/credit-claims"
      - "POST /wholesale/service-tickets"
    shared_operations: ["all GET endpoints", "POST /wholesale/locations (own operator_id only)"]

  - name: RoutePlanner
    description: "Distribution planner: confirms orders against route capacity, schedules service tickets"
    identity: opaque
    exclusive_operations:
      - "POST /wholesale/orders/{id}/confirm"
      - "POST /wholesale/service-tickets/{id}/schedule"
    shared_operations: ["all GET endpoints"]

  - name: WarehouseOps
    description: "Warehouse/driver operations: marks deliveries, completes service tickets"
    identity: opaque
    exclusive_operations:
      - "POST /wholesale/orders/{id}/mark-delivered"
      - "POST /wholesale/service-tickets/{id}/complete"
    shared_operations: ["all GET endpoints"]

  - name: CreditAdjuster
    description: "Claims adjudicator: approves, rejects, or voids expired/short-date credit claims"
    identity: opaque
    exclusive_operations:
      - "POST /wholesale/credit-claims/{id}/approve"
      - "POST /wholesale/credit-claims/{id}/reject"
      - "POST /wholesale/credit-claims/{id}/void"
    shared_operations: ["all GET endpoints"]

  - name: TelemetryGateway
    description: "DEX/telemetry integration identity; machine-to-machine ingestion only"
    identity: opaque
    exclusive_operations:
      - "POST /wholesale/telemetry-events"
    shared_operations: ["all GET endpoints"]
