            - "DevelopmentPermit.${permit_id}.revision_round == 0"

      - name: cycle_submit_state_precondition_outranks_past_due_window
        grounds:
          - validations[priority=40]
          - validations[priority=62]
          - errors[ERR_CYCLE_NOT_OPEN]
          - errors[ERR_CYCLE_PAST_DUE]
        distinguishing_aspect: |
          Category pair state (priority 40) vs business_temporal (priority 62): a cycle already
          in SUBMITTED with the clock past due_at returns ERR_CYCLE_NOT_OPEN with HTTP 409, not
          ERR_CYCLE_PAST_DUE with HTTP 422.
        test_recipe:
          setup:
            - "Community with one SUBMITTED HigherStandard (A430_FREEBOARD, 100 points, cycle year 2026)."
            - "CrsCycle 2026 with due_at 2026-09-30T00:00:00Z already submitted at clock 2026-08-01T00:00:00Z, then the clock advanced to 2026-10-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
