              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p1_id: $.data.id }
            - call: "POST /prt/participants/${p1_id}/address-searches"
              payload: { search_result: "CONFIRMED_MATCH", confirmed_address_line1: "50 Ashcroft Way", confirmed_postal_code: "18042" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "POST /prt/participants/${p1_id}/mortality-checks"
              payload: { match_result: "NO_MATCH" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p1_v: $.data.version }
            - call: "POST /prt/participants/${p1_id}/benefit-audits"
              payload: { expected_participant_version: "${p1_v}", audit_basis: "PLAN_DOCUMENT" }
              as: Actuary
              as_user_id: "actuary-01"
              captures: { a1_id: $.data.id, a1_variance: $.data.variance_cents, a1_seq: $.data.audit_sequence }
            - call: "POST /prt/benefit-audits/${a1_id}/resolution"
              payload: { resolution: "ACCEPT_AS_IS" }
              as: Actuary
              as_user_id: "actuary-01"
            - call: "GET /prt/participants/${p1_id}"
              payload: {}
              as: Actuary
              as_user_id: "actuary-01"
              captures: { p1_v2: $.data.version, p1_acct_before: $.data.accounting_liability_cents, p1_audited_before: $.data.audited_monthly_benefit_cents }
          trigger:
            - call: "POST /prt/participants/${p1_id}/benefit-audits"
              payload: { expected_participant_version: "${p1_v2}", audit_basis: "COLLECTIVE_AGREEMENT", credited_service_months: 360 }
              as: Actuary
              as_user_id: "actuary-01"
              captures: { a2_id: $.data.id, a2_state: $.data.audit_status, a2_recomputed: $.data.recomputed_monthly_benefit_cents, a2_variance: $.data.variance_cents, a2_seq: $.data.audit_sequence }
            - call: "POST /prt/benefit-audits/${a2_id}/resolution"
