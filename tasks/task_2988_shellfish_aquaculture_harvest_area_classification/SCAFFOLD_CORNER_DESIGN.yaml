              as_user_id: "op-1"
              captures: { lease: $.data.id }
            - call: "POST /shellfish/leases/${lease}/submit"
              payload: { submission_note: "siting package revision 0" }
              as: FarmOperator
              as_user_id: "op-1"
            - call: "POST /shellfish/leases/${lease}/navigation-review"
              payload: { decision: "OBJECTION", review_note: "still inside the marked channel" }
              as: SitingReviewer
              as_user_id: "rev-nav-1"
            - call: "POST /shellfish/leases/${lease}/submit"
              payload: { submission_note: "siting package revision 1" }
              as: FarmOperator
              as_user_id: "op-1"
            - call: "POST /shellfish/leases/${lease}/navigation-review"
              payload: { decision: "OBJECTION", review_note: "still inside the marked channel" }
              as: SitingReviewer
              as_user_id: "rev-nav-1"
            - call: "POST /shellfish/leases/${lease}/submit"
              payload: { submission_note: "siting package revision 2" }
              as: FarmOperator
              as_user_id: "op-1"
            - call: "POST /shellfish/leases/${lease}/navigation-review"
              payload: { decision: "OBJECTION", review_note: "still inside the marked channel" }
              as: SitingReviewer
              as_user_id: "rev-nav-1"
            - call: "POST /shellfish/leases/${lease}/submit"
              payload: { submission_note: "siting package revision 3" }
              as: FarmOperator
              as_user_id: "op-1"
            - call: "POST /shellfish/leases/${lease}/navigation-review"
              payload: { decision: "OBJECTION", review_note: "still inside the marked channel" }
              as: SitingReviewer
              as_user_id: "rev-nav-1"
          trigger:
            - call: "POST /shellfish/leases/${lease}/submit"
              payload: { submission_note: "one more try" }
