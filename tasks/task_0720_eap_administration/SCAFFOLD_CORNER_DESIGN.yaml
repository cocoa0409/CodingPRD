              as: ProgramAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /eap/plans/${plan_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /eap/employees"
              payload: { contract_id: "${c_id}", plan_id: "${plan_id}", full_name: "Empl Im", external_ref: "EIM1" }
              as: ProgramAdmin
              captures: { e_id: $.data.id }
            - call: "POST /eap/providers"
              payload: { full_name: "Dr Im", specialties: ["STRESS"] }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /eap/cases"
              payload: { contract_id: "${c_id}", employee_id: "${e_id}", presenting_issue: "STRESS" }
              as: CareCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /eap/cases/${case_id}/authorize"
              payload: { expected_contract_version: "${c_v}" }
              as: CareCoordinator
            - call: "POST /eap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eap/cases/${case_id}/sessions"
              payload: { provider_id: "${prov_id}", scheduled_for: "2026-03-02T10:00:00Z" }
              as: CareCoordinator
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /eap/cases/${case_id}/revoke"
              payload: {}
              as: ProgramAdmin
              captures: { fund: $.data.funding_status }
            - call: "GET /eap/sessions/${s1_id}"
              payload: {}
              as: CareCoordinator
              captures: { sess_status: $.data.status }
          assert:
            - "Case.${case_id}.funding_status == REVOKED"
