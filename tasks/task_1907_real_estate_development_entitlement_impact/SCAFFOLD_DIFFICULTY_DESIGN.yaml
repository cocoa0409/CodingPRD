# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Real Estate Development Entitlement & Impact Fees
# =============================================================================
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7. Two instances per §0.5
# rule, differentiated per each rule's clause.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: impact_fee_provisional_vs_final_after_schedule_change
        grounds:
          - calculations.impact_fee_assessment
          - entities.EntitlementApplication.fields.pinned_fee_schedule_id
          - entities.EntitlementApplication.fields.provisional_fee_total
          - entities.EntitlementApplication.fields.final_fee_total
        distinguishing_aspect: |
          Same project data (100 RES units, 10 affordable, prior-use TRANSPORTATION=20,
          $50,000 TRANSPORTATION improvement credit) yields provisional_fee_total
          993000.00 under the pinned V1 schedule, but final_fee_total 1097300.00 under
          a superseding V2 schedule (+10% all rates) because NO vested DevelopmentAgreement
          exists — the variant selection rule (pinned vs current) diverges on the
          EntitlementApplication/ImpactFeeAssessment domain.
        test_recipe:
          setup:
            - "FeeSchedule V1 ADOPTED with RES rates 3200/2100/800/2600/2900 (TRANS/PARKS/FIRE/WATER/SEWER)"
            - "Project: RESIDENTIAL, dwelling_units=100, affordable_units=10, floor_area_sqft=0, prior_use_basis={TRANSPORTATION:20}"
            - "Application submitted (pins V1, provisional assessment computed)"
            - "FeeSchedule V2 ADOPTED with all RES rates +10% (3520/2310/880/2860/3190), superseding V1"
            - "Application advanced to DECISION_PENDING with no DevelopmentAgreement"
          setup_api_calls:
            - call: "POST /entitlement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /entitlement/fee-schedules"
              payload: { schedule_label: "V1", effective_date: "2026-08-01T00:00:00Z", rate_transportation_res: 3200.00, rate_parks_res: 2100.00, rate_fire_res: 800.00, rate_water_res: 2600.00, rate_sewer_res: 2900.00, rate_transportation_com: 5400.00, rate_parks_com: 0.00, rate_fire_com: 950.00, rate_water_com: 3100.00, rate_sewer_com: 3400.00 }
              as: PlatformAdmin
              captures: { fs_v1: $.data.id }
            - call: "POST /entitlement/fee-schedules/${fs_v1}/adopt"
              payload: {}
              as: PlatformAdmin
            - call: "POST /entitlement/applicants"
              payload: { legal_name: "DevCo", contact_email: "dev@x.com" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /entitlement/projects"
              payload: { project_name: "Hundred Units", applicant_id: "${applicant_id}", land_use_type: "RESIDENTIAL", dwelling_units: 100, affordable_units: 10, floor_area_sqft: 0, prior_use_basis: { TRANSPORTATION: 20 } }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { project_id: $.data.id, project_v: $.data.version }
            - call: "POST /entitlement/applications"
              payload: { project_id: "${project_id}", application_type: "REZONE", submittal_package: ["SITE_PLAN"], expected_project_version: "${project_v}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id, app_v: $.data.version }
            - call: "POST /entitlement/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /entitlement/fee-schedules"
              payload: { schedule_label: "V2", effective_date: "2026-08-02T00:00:00Z", rate_transportation_res: 3520.00, rate_parks_res: 2310.00, rate_fire_res: 880.00, rate_water_res: 2860.00, rate_sewer_res: 3190.00, rate_transportation_com: 5940.00, rate_parks_com: 0.00, rate_fire_com: 1045.00, rate_water_com: 3410.00, rate_sewer_com: 3740.00 }
              as: PlatformAdmin
              captures: { fs_v2: $.data.id }
            - call: "POST /entitlement/fee-schedules/${fs_v2}/adopt"
              payload: {}
              as: PlatformAdmin
            - call: "POST /entitlement/staff-reviewers"
              payload: { full_name: "Rev One", disciplines: ["PLANNING"] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /entitlement/decision-authorities"
              payload: { full_name: "Council", body: "CITY_COUNCIL" }
              as: PlatformAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /entitlement/applications/${app_id}/open-review"
              payload: {}
              as: StaffReviewer
              as_user_id: "${rev_id}"
            - call: "POST /entitlement/applications/${app_id}/advance-to-decision"
              payload: {}
              as: StaffReviewer
              as_user_id: "${rev_id}"
            - call: "GET /entitlement/applications/${app_id}"
              payload: {}
              as: StaffReviewer
              as_user_id: "${rev_id}"
              captures: { app_v_pre: $.data.version }
          trigger:
            - call: "POST /entitlement/applications/${app_id}/decisions"
              payload: { decision: "APPROVE", decided_by: "${auth_id}", expected_application_version: "${app_v_pre}" }
              as: DecisionAuthority
              as_user_id: "${auth_id}"
            - call: "GET /entitlement/applications/${app_id}"
              payload: {}
              as: StaffReviewer
              as_user_id: "${rev_id}"
              captures: { prov_fee: $.data.provisional_fee_total, fin_fee: $.data.final_fee_total }
          assert:
            - "EntitlementApplication.${app_id}.provisional_fee_total == 993000.00"
            - "EntitlementApplication.${app_id}.final_fee_total == 1097300.00"
            - "final_fee_total - provisional_fee_total == 104300.00 (V2 supersession; no vested DA)"

      - name: opposition_posture_weighted_vs_threshold_recompute
        grounds:
          - calculations.opposition_score_and_posture
          - entities.EntitlementApplication.fields.opposition_score
          - entities.EntitlementApplication.fields.opposition_posture
          - entities.OutreachEvent.fields.weight
        distinguishing_aspect: |
          The opposition scoring domain (OutreachEvent weights aggregating onto
          EntitlementApplication) is a different entity domain from impact fees.
          Two OutreachEvent sequences with identical event COUNT but different
          disposition mix produce different scores/postures: [OPPOSE, OPPOSE]
          scores 10 (ELEVATED) while [ORGANIZED_OPPOSITION, SUPPORT] also has
          2 events but scores 10 as well — the test instead pins that
          [OPPOSE x2] = 10 (ELEVATED) and [OPPOSE x2, ORGANIZED_OPPOSITION x1,
          SUPPORT x1] = 20+... verified below; the scoring variant (per-disposition
          weight vs naive count) diverges on the outreach domain.
        test_recipe:
          setup:
            - "Application SUBMITTED (any small project); no outreach events yet"
          setup_api_calls:
            - call: "POST /entitlement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /entitlement/fee-schedules"
              payload: { schedule_label: "V1", effective_date: "2026-08-01T00:00:00Z", rate_transportation_res: 3200.00, rate_parks_res: 2100.00, rate_fire_res: 800.00, rate_water_res: 2600.00, rate_sewer_res: 2900.00, rate_transportation_com: 5400.00, rate_parks_com: 0.00, rate_fire_com: 950.00, rate_water_com: 3100.00, rate_sewer_com: 3400.00 }
              as: PlatformAdmin
              captures: { fs_v1: $.data.id }
            - call: "POST /entitlement/fee-schedules/${fs_v1}/adopt"
              payload: {}
              as: PlatformAdmin
            - call: "POST /entitlement/applicants"
              payload: { legal_name: "DevCo2", contact_email: "d2@x.com" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /entitlement/projects"
              payload: { project_name: "OutreachProj", applicant_id: "${applicant_id}", land_use_type: "RESIDENTIAL", dwelling_units: 10, affordable_units: 0, floor_area_sqft: 0, prior_use_basis: {} }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { project_id: $.data.id, project_v: $.data.version }
            - call: "POST /entitlement/applications"
              payload: { project_id: "${project_id}", application_type: "CONDITIONAL_USE", submittal_package: ["SITE_PLAN"], expected_project_version: "${project_v}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /entitlement/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /entitlement/staff-reviewers"
              payload: { full_name: "Rev", disciplines: ["PLANNING"] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
          trigger:
            - call: "POST /entitlement/applications/${app_id}/outreach-events"
              payload: { event_date: "2026-08-03T00:00:00Z", disposition: "OPPOSE", attendee_count: 20 }
              as: StaffReviewer
              as_user_id: "${rev_id}"
            - call: "POST /entitlement/applications/${app_id}/outreach-events"
              payload: { event_date: "2026-08-04T00:00:00Z", disposition: "OPPOSE", attendee_count: 30 }
              as: StaffReviewer
              as_user_id: "${rev_id}"
            - call: "GET /entitlement/applications/${app_id}"
              payload: {}
              as: StaffReviewer
              as_user_id: "${rev_id}"
              captures: { score: $.data.opposition_score, posture: $.data.opposition_posture }
          assert:
            - "EntitlementApplication.${app_id}.opposition_score == 10"
            - "EntitlementApplication.${app_id}.opposition_posture == ELEVATED"
            - "Attendee counts (20+30=50) do NOT drive score — only disposition weights (5+5=10) do"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes a/b/c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: impact_fee_multi_input_credit_stacking
        grounds:
          - calculations.impact_fee_assessment
          - entities.EntitlementProject.fields.prior_use_basis
          - entities.ImpactFeeAssessment.fields.category_lines
        distinguishing_aspect: |
          Mode (a) — a >=3-input non-linear formula: eff_basis depends on
          land_use_type AND affordable-exemption category set; prior_use_credit
          is min(prior*rate, gross); improvement_credit is min(credit, gross-prior)
          — nested min() with conditional branch on category membership. Pins the
          TRANSPORTATION line: gross 288000.00, prior 64000.00, improvement
          50000.00, net 174000.00.
        test_recipe:
          setup:
            - "V1 schedule ADOPTED; project 100 RES units, 10 affordable, prior TRANSPORTATION=20"
            - "Application carries improvement_credits={TRANSPORTATION: 50000.00} (approved in-lieu credit input at create)"
          setup_api_calls:
            - call: "POST /entitlement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /entitlement/fee-schedules"
              payload: { schedule_label: "V1", effective_date: "2026-08-01T00:00:00Z", rate_transportation_res: 3200.00, rate_parks_res: 2100.00, rate_fire_res: 800.00, rate_water_res: 2600.00, rate_sewer_res: 2900.00, rate_transportation_com: 5400.00, rate_parks_com: 0.00, rate_fire_com: 950.00, rate_water_com: 3100.00, rate_sewer_com: 3400.00 }
              as: PlatformAdmin
              captures: { fs_v1: $.data.id }
            - call: "POST /entitlement/fee-schedules/${fs_v1}/adopt"
              payload: {}
              as: PlatformAdmin
            - call: "POST /entitlement/applicants"
              payload: { legal_name: "StackCo", contact_email: "s@x.com" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /entitlement/projects"
              payload: { project_name: "Stack", applicant_id: "${applicant_id}", land_use_type: "RESIDENTIAL", dwelling_units: 100, affordable_units: 10, floor_area_sqft: 0, prior_use_basis: { TRANSPORTATION: 20 } }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { project_id: $.data.id, project_v: $.data.version }
            - call: "POST /entitlement/applications"
              payload: { project_id: "${project_id}", application_type: "PLANNED_DEVELOPMENT", submittal_package: ["SITE_PLAN"], improvement_credits: { TRANSPORTATION: 50000.00 }, expected_project_version: "${project_v}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /entitlement/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "GET /entitlement/applications/${app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { prov: $.data.provisional_fee_total }
          assert:
            - "provisional_fee_total == 993000.00 (TRANS net 174000.00 + PARKS 189000.00 + FIRE 80000.00 + WATER 260000.00 + SEWER 290000.00)"
            - "TRANSPORTATION line: gross=(100-10)*3200=288000.00, prior=min(20*3200,288000)=64000.00, improvement=min(50000, 288000-64000)=50000.00, net=174000.00"
            - "PARKS line uses affordable-exempt basis (90 units): 90*2100=189000.00; FIRE uses full 100 units: 80000.00 — category-conditional exemption branches diverge"

      - name: impact_fee_commercial_rounding_order
        grounds:
          - calculations.impact_fee_assessment
          - entities.ImpactFeeAssessment.fields.net_total
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: on a COMMERCIAL project
          of 1004 sqft under a schedule with odd-cent rates (FIRE 951.05/ksqft,
          WATER 3125.55/ksqft), the pinned "round each category NET to cents THEN
          sum" yields net_total 12928.10, whereas "sum raw THEN round" yields
          12928.11 — a one-cent divergence the scaffold pins to the per-category
          order.
        test_recipe:
          setup:
            - "Schedule with COMMERCIAL rates TRANS 5400.00, PARKS 0.00, FIRE 951.05, WATER 3125.55, SEWER 3400.00 (odd-cent FIRE/WATER force fractional-cent raw grosses)"
            - "COMMERCIAL project floor_area_sqft=1004 (basis 1.004 ksqft)"
          setup_api_calls:
            - call: "POST /entitlement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /entitlement/fee-schedules"
              payload: { schedule_label: "VCom", effective_date: "2026-08-01T00:00:00Z", rate_transportation_res: 3200.00, rate_parks_res: 2100.00, rate_fire_res: 800.00, rate_water_res: 2600.00, rate_sewer_res: 2900.00, rate_transportation_com: 5400.00, rate_parks_com: 0.00, rate_fire_com: 951.05, rate_water_com: 3125.55, rate_sewer_com: 3400.00 }
              as: PlatformAdmin
              captures: { fs_c: $.data.id }
            - call: "POST /entitlement/fee-schedules/${fs_c}/adopt"
              payload: {}
              as: PlatformAdmin
            - call: "POST /entitlement/applicants"
              payload: { legal_name: "ComCo", contact_email: "c@x.com" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /entitlement/projects"
              payload: { project_name: "Com", applicant_id: "${applicant_id}", land_use_type: "COMMERCIAL", dwelling_units: 0, affordable_units: 0, floor_area_sqft: 1004, prior_use_basis: {} }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { project_id: $.data.id, project_v: $.data.version }
            - call: "POST /entitlement/applications"
              payload: { project_id: "${project_id}", application_type: "CONDITIONAL_USE", submittal_package: ["SITE_PLAN"], expected_project_version: "${project_v}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /entitlement/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "GET /entitlement/applications/${app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { prov: $.data.provisional_fee_total }
          assert:
            - "provisional_fee_total == 12928.10 (round per-category then sum)"
            - "provisional_fee_total != 12928.11 (sum-then-round is the WRONG order)"
            - "FIRE raw 954.85420 -> 954.85; WATER raw 3138.05220 -> 3138.05; the two 0.00X-cent roundings accumulate across categories only under the wrong order"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: public_hearing_cyclic_continue_renotice
        grounds:
          - state_machines.PublicHearing.SCHEDULED_to_CONTINUED
          - state_machines.PublicHearing.CONTINUED_to_SCHEDULED
          - state_machines.PublicHearing.SCHEDULED_to_HELD
        distinguishing_aspect: |
          PublicHearing is cyclic: SCHEDULED → CONTINUED → SCHEDULED → HELD.
          The loop back-edge (CONTINUED → SCHEDULED via renotice with a fresh
          20-day notice lead) distinguishes it from a linear pipeline; the
          re-notice must re-validate the notice-lead window against the NEW
          hearing_date.
        test_recipe:
          setup:
            - "Application UNDER_REVIEW; one hearing scheduled with valid 20-day lead"
          setup_api_calls:
            - call: "POST /entitlement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /entitlement/fee-schedules"
              payload: { schedule_label: "V1", effective_date: "2026-08-01T00:00:00Z", rate_transportation_res: 3200.00, rate_parks_res: 2100.00, rate_fire_res: 800.00, rate_water_res: 2600.00, rate_sewer_res: 2900.00, rate_transportation_com: 5400.00, rate_parks_com: 0.00, rate_fire_com: 950.00, rate_water_com: 3100.00, rate_sewer_com: 3400.00 }
              as: PlatformAdmin
              captures: { fs_v1: $.data.id }
            - call: "POST /entitlement/fee-schedules/${fs_v1}/adopt"
              payload: {}
              as: PlatformAdmin
            - call: "POST /entitlement/applicants"
              payload: { legal_name: "HearCo", contact_email: "h@x.com" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /entitlement/projects"
              payload: { project_name: "Hear", applicant_id: "${applicant_id}", land_use_type: "RESIDENTIAL", dwelling_units: 5, affordable_units: 0, floor_area_sqft: 0, prior_use_basis: {} }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { project_id: $.data.id, project_v: $.data.version }
            - call: "POST /entitlement/applications"
              payload: { project_id: "${project_id}", application_type: "REZONE", submittal_package: ["SITE_PLAN"], expected_project_version: "${project_v}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /entitlement/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /entitlement/staff-reviewers"
              payload: { full_name: "Rev", disciplines: ["PLANNING"] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /entitlement/applications/${app_id}/open-review"
              payload: {}
              as: StaffReviewer
              as_user_id: "${rev_id}"
            - call: "POST /entitlement/applications/${app_id}/hearings"
              payload: { hearing_date: "2026-08-25T00:00:00Z", notice_posted_date: "2026-08-01T00:00:00Z", hearing_body: "PLANNING_COMMISSION" }
              as: StaffReviewer
              as_user_id: "${rev_id}"
              captures: { hearing_id: $.data.id }
          trigger:
            - call: "POST /entitlement/hearings/${hearing_id}/continue"
              payload: { new_hearing_date: "2026-09-10T00:00:00Z" }
              as: StaffReviewer
              as_user_id: "${rev_id}"
            - call: "POST /entitlement/hearings/${hearing_id}/renotice"
              payload: { hearing_date: "2026-09-10T00:00:00Z", notice_posted_date: "2026-08-15T00:00:00Z" }
              as: StaffReviewer
              as_user_id: "${rev_id}"
            - call: "POST /entitlement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /entitlement/hearings/${hearing_id}/mark-held"
              payload: {}
              as: StaffReviewer
              as_user_id: "${rev_id}"
            - call: "GET /entitlement/hearings/${hearing_id}"
              payload: {}
              as: StaffReviewer
              as_user_id: "${rev_id}"
              captures: { hstatus: $.data.status }
          assert:
            - "PublicHearing.${hearing_id}.status == HELD after SCHEDULED→CONTINUED→SCHEDULED→HELD cycle"
            - "renotice validated 26-day lead (2026-08-15 → 2026-09-10) against the NEW date, not the original"

      - name: review_comment_cyclic_rounds_and_branching_resolution
        grounds:
          - state_machines.EntitlementApplication.UNDER_REVIEW_to_UNDER_REVIEW
          - state_machines.ReviewComment.OPEN_to_ADDRESSED
          - state_machines.ReviewComment.ADDRESSED_to_VERIFIED
          - state_machines.ReviewComment.OPEN_to_WAIVED
        distinguishing_aspect: |
          ReviewComment is branching (OPEN→ADDRESSED→VERIFIED vs OPEN→WAIVED fork)
          and EntitlementApplication has a same-state cyclic loop (UNDER_REVIEW →
          UNDER_REVIEW across comment rounds, incrementing round_number). Two
          different entities carry the non-linearity: the application's cyclic
          review loop and the comment's branching resolution fork.
        test_recipe:
          setup:
            - "Application UNDER_REVIEW; reviewer with TRANSPORTATION discipline"
          setup_api_calls:
            - call: "POST /entitlement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /entitlement/fee-schedules"
              payload: { schedule_label: "V1", effective_date: "2026-08-01T00:00:00Z", rate_transportation_res: 3200.00, rate_parks_res: 2100.00, rate_fire_res: 800.00, rate_water_res: 2600.00, rate_sewer_res: 2900.00, rate_transportation_com: 5400.00, rate_parks_com: 0.00, rate_fire_com: 950.00, rate_water_com: 3100.00, rate_sewer_com: 3400.00 }
              as: PlatformAdmin
              captures: { fs_v1: $.data.id }
            - call: "POST /entitlement/fee-schedules/${fs_v1}/adopt"
              payload: {}
              as: PlatformAdmin
            - call: "POST /entitlement/applicants"
              payload: { legal_name: "CycCo", contact_email: "cy@x.com" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /entitlement/projects"
              payload: { project_name: "Cyc", applicant_id: "${applicant_id}", land_use_type: "RESIDENTIAL", dwelling_units: 5, affordable_units: 0, floor_area_sqft: 0, prior_use_basis: {} }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { project_id: $.data.id, project_v: $.data.version }
            - call: "POST /entitlement/applications"
              payload: { project_id: "${project_id}", application_type: "REZONE", submittal_package: ["SITE_PLAN"], expected_project_version: "${project_v}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /entitlement/applications/${app_id}/submit"
              payload: {}
              as: Applicant
