      - name: consultation_owner_check_outranks_closed_response_window
        grounds:
          - validations[priority=4]
          - validations[priority=20]
          - calculations.consultation_response_deadline
          - state_machines.ConsultationRequest.PENDING_to_CONSENTED
          - errors.ERR_NOT_RESOURCE_OWNER
          - errors.ERR_CONSULTATION_WINDOW_CLOSED
        distinguishing_aspect: |
          Category pair: auth (priority 4) versus business_temporal (priority 20). Once the response
          window has closed, an answer from the WRONG trust's representative violates both rules, and
          identity must be checked first: ERR_NOT_RESOURCE_OWNER (403), not
          ERR_CONSULTATION_WINDOW_CLOSED (409). Leaking "the window is closed" to a party with no
          standing on this trust would disclose the existence and timing of another deal's workout.
        test_recipe:
          setup:
            - "Two trusts, A and B, each with a 40,000,000.00 controlling class balance so both stay CONTROLLING."
            - "One loan under trust A, transferred to special servicing, with a workout plan SCORED and RECOMMENDED."
            - "The clock is set to 2026-09-01T00:00:00Z before the consultation is issued, so deadline_at is exactly 2026-09-16T23:59:59.999Z by the business-day rule (Sep 5-6 and 12-13 are weekends, Sep 7 is a pinned holiday)."
