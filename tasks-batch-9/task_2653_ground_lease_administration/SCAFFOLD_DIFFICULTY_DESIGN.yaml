              as: LessorAdmin
              captures: { lease_e_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-45-F", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2026-07-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 10000000, reversion_land_value_cents: 40000000, reversion_standard_code: "FULLY_FITTED", security_deposit_cents: 5000000 }
              as: LessorAdmin
