scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cancellation_fee_inside_vs_satisfied_commitment
        grounds:
          - calculations.cancellation_fee
          - entities.Membership.fields.cancellation_fee_cents
          - entities.MembershipPlan.fields.early_termination_fee_cents
          - state_machines.Membership.ACTIVE_to_CANCEL_PENDING
        distinguishing_aspect: "On the Membership entity domain: a cancel inside the commitment window stores cancellation_fee_cents = plan.early_termination_fee_cents (15000), while an otherwise-identical cancel after commitment_end_date stores 0 — the two variants diverge on the same inputs by clock position."
        test_recipe:
          setup:
            - "A 12-month UNLIMITED plan with early_termination_fee_cents=15000 exists."
            - "Member m1 holds an ACTIVE membership activated 2026-02-01 (commitment_end 2027-02-01)."
            - "Clock at 2026-06-15 (inside commitment)."
          setup_api_calls:
            - call: "POST /box/membership-plans"
              payload: { name: "Unlimited 12mo", plan_type: "UNLIMITED", monthly_fee_cents: 12000, commitment_months: 12, early_termination_fee_cents: 15000, requires_foundations: false }
              as: BoxManager
              captures: { plan_id: $.data.id }
            - call: "POST /box/members/register"
              payload: { email: "m1@x.com", full_name: "M One", home_box_member: true }
              as: Anonymous
              captures: { m1_id: $.data.id }
            - call: "POST /box/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: BoxManager
            - call: "POST /box/memberships"
              payload: { member_id: "${m1_id}", plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { ms1_id: $.data.id }
            - call: "POST /box/memberships/${ms1_id}/confirm-payment"
              payload: {}
              as: BoxManager
            - call: "POST /box/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: BoxManager
          trigger:
            - call: "POST /box/memberships/${ms1_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
              captures: { fee: $.data.cancellation_fee_cents }
          assert:
            - "Membership.${ms1_id}.cancellation_fee_cents == 15000"
            - "Membership.${ms1_id}.status == CANCEL_PENDING"

      - name: refund_on_cancel_timely_vs_late_reservation_domain
        grounds:
          - calculations.refund_on_cancel
          - entities.Reservation.fields.drop_in_fee_charged_cents
          - state_machines.Reservation.RESERVED_to_CANCELLED
        distinguishing_aspect: "On the Reservation entity domain (a different domain than cancellation_fee's Membership): a drop-in cancel at exactly 12h before start refunds drop_in_fee_charged_cents to 0, whereas a cancel 11h before start forfeits it — dual-variant logic on a second subject."
        test_recipe:
          setup:
            - "A FOUNDATIONS-free REGULAR track and a coach exist; a session starts 2026-06-10T18:00Z, capacity 5, drop_in_fee_cents=2500."
            - "Visiting athlete v1 (home_box_member=false) holds a DROP_IN RESERVED reservation that charged 2500."
            - "Clock set to 2026-06-10T06:00Z (exactly 12h before start)."
          setup_api_calls:
            - call: "POST /box/coaches"
              payload: { full_name: "Coach C", email: "c@x.com", certified: true }
              as: BoxManager
              captures: { coach_id: $.data.id }
            - call: "POST /box/program-tracks"
              payload: { name: "WOD", track_type: "REGULAR", head_coach_id: "${coach_id}" }
              as: BoxManager
              captures: { track_id: $.data.id }
            - call: "POST /box/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BoxManager
            - call: "POST /box/sessions"
              payload: { track_id: "${track_id}", coach_id: "${coach_id}", starts_at: "2026-06-10T18:00:00Z", duration_minutes: 60, capacity: 5, drop_in_fee_cents: 2500 }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /box/members/register"
              payload: { email: "v1@x.com", full_name: "V One", home_box_member: false }
              as: Anonymous
              captures: { v1_id: $.data.id }
            - call: "POST /box/reservations"
              payload: { session_id: "${sess_id}", member_id: "${v1_id}", reservation_kind: "DROP_IN", expected_session_version: "${sess_v}" }
              as: Member
              as_user_id: "${v1_id}"
              captures: { resv_id: $.data.id }
            - call: "POST /box/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T06:00:00Z" }
              as: BoxManager
          trigger:
            - call: "POST /box/reservations/${resv_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${v1_id}"
          assert:
            - "Reservation.${resv_id}.status == CANCELLED"
            - "Reservation.${resv_id}.drop_in_fee_charged_cents == 0"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: leaderboard_multi_input_conditional_tiebreak_mode_a
        grounds:
          - calculations.leaderboard_ranking
          - entities.BenchmarkResult.fields.value
          - entities.BenchmarkResult.fields.metric_kind
          - entities.BenchmarkResult.fields.verified
        distinguishing_aspect: "Mode (a): ranking is a >=3-input non-linear formula — metric_kind branch (asc time vs desc load), one-best-per-member aggregation, and recorded_at then created_at tie-break — exercised by ranking three verified FRAN (TIME_SECONDS) results 180/200/210s into ranks 1/2/3."
        test_recipe:
          setup:
            - "REGULAR track with a certified coach; three members each with one verified FRAN result: 180s, 200s, 210s."
          setup_api_calls:
            - call: "POST /box/coaches"
              payload: { full_name: "Coach L", email: "cl@x.com", certified: true }
              as: BoxManager
              captures: { coach_id: $.data.id }
            - call: "POST /box/program-tracks"
              payload: { name: "WOD-LB", track_type: "REGULAR", head_coach_id: "${coach_id}" }
              as: BoxManager
              captures: { track_id: $.data.id }
            - call: "POST /box/members/register"
              payload: { email: "lba@x.com", full_name: "LB A", home_box_member: true }
              as: Anonymous
              captures: { a_id: $.data.id }
            - call: "POST /box/members/register"
              payload: { email: "lbb@x.com", full_name: "LB B", home_box_member: true }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /box/members/register"
              payload: { email: "lbc@x.com", full_name: "LB C", home_box_member: true }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /box/benchmark-results"
              payload: { member_id: "${a_id}", benchmark_name: "FRAN", metric_kind: "TIME_SECONDS", value: 180, recorded_at: "2026-05-01T10:00:00Z" }
              as: Member
              as_user_id: "${a_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /box/benchmark-results"
              payload: { member_id: "${b_id}", benchmark_name: "FRAN", metric_kind: "TIME_SECONDS", value: 200, recorded_at: "2026-05-01T10:00:00Z" }
              as: Member
              as_user_id: "${b_id}"
              captures: { rb_id: $.data.id }
            - call: "POST /box/benchmark-results"
              payload: { member_id: "${c_id}", benchmark_name: "FRAN", metric_kind: "TIME_SECONDS", value: 210, recorded_at: "2026-05-01T10:00:00Z" }
              as: Member
              as_user_id: "${c_id}"
              captures: { rc_id: $.data.id }
            - call: "POST /box/benchmark-results/${ra_id}/verify"
              payload: {}
              as: Coach
              as_user_id: "${coach_id}"
            - call: "POST /box/benchmark-results/${rb_id}/verify"
              payload: {}
              as: Coach
              as_user_id: "${coach_id}"
            - call: "POST /box/benchmark-results/${rc_id}/verify"
              payload: {}
              as: Coach
              as_user_id: "${coach_id}"
          trigger:
            - call: "GET /box/program-tracks/${track_id}/leaderboard"
              payload: { benchmark_name: "FRAN" }
              as: Member
              as_user_id: "${a_id}"
          assert:
            - "response data is an array of length 3 ordered [member ${a_id} (180), member ${b_id} (200), member ${c_id} (210)]"
            - "data[0].member_id == ${a_id} AND data[0].value == 180"
            - "data[2].member_id == ${c_id} AND data[2].value == 210"

      - name: cycle_close_explicit_evaluation_order_mode_c
        grounds:
          - calculations.cycle_close_billing
          - state_machines.Membership.CANCEL_PENDING_to_CANCELLED
          - entities.Membership.fields.cancellation_fee_cents
        distinguishing_aspect: "Mode (c): the cycle-close total has an explicit evaluation order pinned — CANCEL_PENDING fees are summed and finalized FIRST, then ACTIVE monthly fees, with FROZEN excluded; total_charged_cents = 15000 + 0 + 12000 + 8000 = 35000 is well-defined only because the order is fixed. Distinct mode from the mode-(a) leaderboard instance."
        test_recipe:
          setup:
            - "Plan P12 (UNLIMITED, monthly 12000, commitment 12, ETF 15000); plan P8 (UNLIMITED, monthly 8000, no commitment)."
            - "ms_cp1: ACTIVE then cancelled inside commitment (fee 15000) -> CANCEL_PENDING."
            - "ms_cp2: ACTIVE on P8 then cancelled (no commitment, fee 0) -> CANCEL_PENDING."
            - "ms_act1: ACTIVE on P12 (monthly 12000). ms_act2: ACTIVE on P8 (monthly 8000)."
            - "ms_fz: ACTIVE on P12 then FROZEN (excluded from monthly charge)."
            - "Clock at 2026-06-15 (all inside/active as described)."
          setup_api_calls:
            - call: "POST /box/membership-plans"
              payload: { name: "P12", plan_type: "UNLIMITED", monthly_fee_cents: 12000, commitment_months: 12, early_termination_fee_cents: 15000, requires_foundations: false }
              as: BoxManager
              captures: { p12_id: $.data.id }
            - call: "POST /box/membership-plans"
              payload: { name: "P8", plan_type: "UNLIMITED", monthly_fee_cents: 8000, commitment_months: 0, requires_foundations: false }
              as: BoxManager
              captures: { p8_id: $.data.id }
            - call: "POST /box/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: BoxManager
            - call: "POST /box/members/register"
              payload: { email: "cc1@x.com", full_name: "CC1", home_box_member: true }
              as: Anonymous
              captures: { mcp1_id: $.data.id }
            - call: "POST /box/memberships"
              payload: { member_id: "${mcp1_id}", plan_id: "${p12_id}" }
              as: Member
              as_user_id: "${mcp1_id}"
              captures: { ms_cp1_id: $.data.id }
            - call: "POST /box/memberships/${ms_cp1_id}/confirm-payment"
              payload: {}
              as: BoxManager
            - call: "POST /box/members/register"
              payload: { email: "cc2@x.com", full_name: "CC2", home_box_member: true }
              as: Anonymous
              captures: { mcp2_id: $.data.id }
            - call: "POST /box/memberships"
              payload: { member_id: "${mcp2_id}", plan_id: "${p8_id}" }
              as: Member
              as_user_id: "${mcp2_id}"
              captures: { ms_cp2_id: $.data.id }
            - call: "POST /box/memberships/${ms_cp2_id}/confirm-payment"
              payload: {}
              as: BoxManager
            - call: "POST /box/members/register"
              payload: { email: "ac1@x.com", full_name: "AC1", home_box_member: true }
              as: Anonymous
              captures: { mact1_id: $.data.id }
            - call: "POST /box/memberships"
              payload: { member_id: "${mact1_id}", plan_id: "${p12_id}" }
              as: Member
              as_user_id: "${mact1_id}"
              captures: { ms_act1_id: $.data.id }
            - call: "POST /box/memberships/${ms_act1_id}/confirm-payment"
              payload: {}
              as: BoxManager
            - call: "POST /box/members/register"
              payload: { email: "ac2@x.com", full_name: "AC2", home_box_member: true }
              as: Anonymous
              captures: { mact2_id: $.data.id }
            - call: "POST /box/memberships"
              payload: { member_id: "${mact2_id}", plan_id: "${p8_id}" }
              as: Member
              as_user_id: "${mact2_id}"
              captures: { ms_act2_id: $.data.id }
            - call: "POST /box/memberships/${ms_act2_id}/confirm-payment"
              payload: {}
              as: BoxManager
            - call: "POST /box/members/register"
              payload: { email: "fz@x.com", full_name: "FZ", home_box_member: true }
              as: Anonymous
              captures: { mfz_id: $.data.id }
            - call: "POST /box/memberships"
              payload: { member_id: "${mfz_id}", plan_id: "${p12_id}" }
              as: Member
              as_user_id: "${mfz_id}"
              captures: { ms_fz_id: $.data.id }
            - call: "POST /box/memberships/${ms_fz_id}/confirm-payment"
              payload: {}
              as: BoxManager
            - call: "POST /box/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: BoxManager
            - call: "POST /box/memberships/${ms_cp1_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mcp1_id}"
            - call: "POST /box/memberships/${ms_cp2_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mcp2_id}"
            - call: "POST /box/memberships/${ms_fz_id}/freeze"
              payload: {}
              as: Member
              as_user_id: "${mfz_id}"
          trigger:
            - call: "POST /box/_billing/run-cycle-close"
              payload: {}
              as: BoxManager
              captures: { total: $.data.total_charged_cents }
          assert:
            - "response data.total_charged_cents == 35000"
            - "Membership.${ms_cp1_id}.status == CANCELLED"
            - "Membership.${ms_cp2_id}.status == CANCELLED"
            - "Membership.${ms_fz_id}.status == FROZEN"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: membership_freeze_unfreeze_cycle_revert
        grounds:
          - state_machines.Membership.ACTIVE_to_FROZEN
          - state_machines.Membership.FROZEN_to_ACTIVE
          - entities.Membership.fields.total_frozen_days
          - entities.Membership.fields.commitment_end_date
        distinguishing_aspect: "Membership exhibits a cycle (ACTIVE->FROZEN->ACTIVE): unfreezing returns to ACTIVE and pushes commitment_end_date forward by the frozen days, proving the machine is not a one-way linear pipeline."
        test_recipe:
          setup:
            - "12-month UNLIMITED plan; member with ACTIVE membership activated 2026-02-01 (commitment_end 2027-02-01)."
            - "Freeze at 2026-03-01, unfreeze at 2026-03-11 (10 frozen days)."
          setup_api_calls:
            - call: "POST /box/membership-plans"
              payload: { name: "U12", plan_type: "UNLIMITED", monthly_fee_cents: 12000, commitment_months: 12, early_termination_fee_cents: 15000, requires_foundations: false }
              as: BoxManager
              captures: { plan_id: $.data.id }
            - call: "POST /box/members/register"
              payload: { email: "fz2@x.com", full_name: "FZ2", home_box_member: true }
              as: Anonymous
              captures: { mid: $.data.id }
            - call: "POST /box/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: BoxManager
            - call: "POST /box/memberships"
              payload: { member_id: "${mid}", plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${mid}"
              captures: { ms_id: $.data.id }
            - call: "POST /box/memberships/${ms_id}/confirm-payment"
              payload: {}
              as: BoxManager
            - call: "POST /box/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: BoxManager
            - call: "POST /box/memberships/${ms_id}/freeze"
              payload: {}
              as: Member
              as_user_id: "${mid}"
            - call: "POST /box/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-11T00:00:00Z" }
              as: BoxManager
          trigger:
            - call: "POST /box/memberships/${ms_id}/unfreeze"
              payload: {}
              as: Member
              as_user_id: "${mid}"
          assert:
            - "Membership.${ms_id}.status == ACTIVE"
            - "Membership.${ms_id}.total_frozen_days == 10"
            - "Membership.${ms_id}.freeze_started_at == null"

      - name: team_branching_fork_lock_vs_disband
        grounds:
          - state_machines.CompetitionTeam.FORMING_to_LOCKED
          - state_machines.CompetitionTeam.FORMING_to_DISBANDED
          - state_machines.TeamMember.INVITED_to_DECLINED
        distinguishing_aspect: "CompetitionTeam (a different entity from Membership) forks from FORMING into either LOCKED or DISBANDED with divergent side-effect sets — LOCK declines outstanding INVITED slots, DISBAND removes all slots — so this is a branching fork, not linear."
        test_recipe:
          setup:
            - "Captain c-cap creates a team (max_roster_size 4) with one outstanding INVITED member i1."
          setup_api_calls:
            - call: "POST /box/members/register"
              payload: { email: "cap@x.com", full_name: "Cap", home_box_member: true }
              as: Anonymous
              captures: { cap_id: $.data.id }
            - call: "POST /box/members/register"
              payload: { email: "inv1@x.com", full_name: "Inv1", home_box_member: true }
              as: Anonymous
              captures: { i1_id: $.data.id }
            - call: "POST /box/teams"
              payload: { name: "Team Alpha", captain_member_id: "${cap_id}", max_roster_size: 4 }
              as: Member
              as_user_id: "${cap_id}"
              captures: { team_id: $.data.id, team_v: $.data.version }
            - call: "POST /box/team-members"
              payload: { team_id: "${team_id}", member_id: "${i1_id}" }
              as: Member
              as_user_id: "${cap_id}"
              captures: { tm1_id: $.data.id }
          trigger:
            - call: "POST /box/teams/${team_id}/lock"
              payload: { expected_team_version: "${team_v}" }
              as: Member
              as_user_id: "${cap_id}"
          assert:
            - "CompetitionTeam.${team_id}.status == LOCKED"
            - "TeamMember.${tm1_id}.status == DECLINED"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: membership_cancel_cascade_depth3_to_waitlist_promotion
        grounds:
          - state_machines.Membership.ACTIVE_to_CANCEL_PENDING
          - state_machines.Reservation.RESERVED_to_CANCELLED
          - state_machines.Reservation.WAITLISTED_to_RESERVED
          - entities.ClassSession.fields.seats_reserved
        distinguishing_aspect: "Depth-3 chain from a single trigger: membership cancel (A) -> its future RESERVED reservation transitions to CANCELLED (B) -> that frees a session seat which itself triggers promotion of the head WAITLISTED reservation to RESERVED (C). Each hop is caused by the prior hop, not by the cancel directly."
        test_recipe:
          setup:
            - "Capacity-1 REGULAR (foundations-free) session in the future; member m_hold holds the single RESERVED seat; member m_wait is WAITLISTED at position 1."
            - "Clock well before the reservation cut-off."
          setup_api_calls:
            - call: "POST /box/coaches"
              payload: { full_name: "Coach W", email: "cw@x.com", certified: true }
              as: BoxManager
              captures: { coach_id: $.data.id }
            - call: "POST /box/program-tracks"
              payload: { name: "WOD-W", track_type: "REGULAR", head_coach_id: "${coach_id}" }
              as: BoxManager
              captures: { track_id: $.data.id }
            - call: "POST /box/membership-plans"
              payload: { name: "U-NoFound", plan_type: "UNLIMITED", monthly_fee_cents: 10000, commitment_months: 0, requires_foundations: false }
              as: BoxManager
              captures: { plan_id: $.data.id }
            - call: "POST /box/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BoxManager
            - call: "POST /box/sessions"
              payload: { track_id: "${track_id}", coach_id: "${coach_id}", starts_at: "2026-06-10T18:00:00Z", duration_minutes: 60, capacity: 1 }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { sess_id: $.data.id, sess_v0: $.data.version }
            - call: "POST /box/members/register"
              payload: { email: "hold@x.com", full_name: "Hold", home_box_member: true }
              as: Anonymous
              captures: { mhold_id: $.data.id }
            - call: "POST /box/memberships"
              payload: { member_id: "${mhold_id}", plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${mhold_id}"
              captures: { ms_hold_id: $.data.id }
            - call: "POST /box/memberships/${ms_hold_id}/confirm-payment"
              payload: {}
              as: BoxManager
            - call: "POST /box/reservations"
              payload: { session_id: "${sess_id}", member_id: "${mhold_id}", membership_id: "${ms_hold_id}", reservation_kind: "MEMBERSHIP", expected_session_version: "${sess_v0}" }
              as: Member
              as_user_id: "${mhold_id}"
              captures: { resv_hold_id: $.data.id, sess_v1: $.data.version }
            - call: "POST /box/members/register"
              payload: { email: "wait@x.com", full_name: "Wait", home_box_member: true }
              as: Anonymous
              captures: { mwait_id: $.data.id }
            - call: "POST /box/memberships"
              payload: { member_id: "${mwait_id}", plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${mwait_id}"
              captures: { ms_wait_id: $.data.id }
            - call: "POST /box/memberships/${ms_wait_id}/confirm-payment"
              payload: {}
              as: BoxManager
            - call: "POST /box/reservations"
              payload: { session_id: "${sess_id}", member_id: "${mwait_id}", membership_id: "${ms_wait_id}", reservation_kind: "MEMBERSHIP", expected_session_version: "${sess_v1}" }
              as: Member
              as_user_id: "${mwait_id}"
              captures: { resv_wait_id: $.data.id }
          trigger:
            - call: "POST /box/memberships/${ms_hold_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mhold_id}"
          assert:
            - "Reservation.${resv_hold_id}.status == CANCELLED"
            - "Reservation.${resv_wait_id}.status == RESERVED"
            - "Reservation.${resv_wait_id}.waitlist_position == null"
            - "ClassSession.${sess_id}.seats_reserved == 1"
            - "ClassSession.${sess_id}.waitlist_count == 0"

      - name: session_cancel_cascade_depth2_reservation_release
        grounds:
          - state_machines.ClassSession.SCHEDULED_to_CANCELLED
          - state_machines.Reservation.RESERVED_to_CANCELLED
          - entities.ClassSession.fields.seats_reserved
        distinguishing_aspect: "Depth-2 chain from a different trigger (session cancel rather than membership cancel): cancelling the session (A) cascades to cancel each RESERVED reservation (B) with full refund regardless of late-cancel window, and zeroes the session counts."
        test_recipe:
          setup:
