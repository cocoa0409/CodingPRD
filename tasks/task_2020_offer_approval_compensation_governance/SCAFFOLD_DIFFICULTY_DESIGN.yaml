  # ------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: hire_reneg_headcount_conservation
        grounds:
          - calculations.headcount_filled
          - state_machines.Offer.HIRED_to_RESCINDED
          - state_machines.Requisition.CLOSED_to_OPEN
        distinguishing_aspect: |
          Conserved quantity: Requisition.headcount_filled == count of its
          HIRED offers. Forward hire (1) paired with compensating reneg rescind
          returns the invariant to 0 AND reopens the CLOSED requisition
          (close_reason FILLED cleared) AND returns the candidate to IN_PROCESS.
        test_recipe:
          setup:
            - "Requisition (standard range, budget 50000000, headcount 1) OPEN; three L5/T1 peers"
            - "Offer base 20000000 pct 0 with a SIGN_ON perk 1000000, fully hired: requisition CLOSED(FILLED), headcount_filled 1, candidate HIRED, perk ACTIVE"
          setup_api_calls:
            - call: "POST /api/requisitions"
              payload: { title: "Sr Eng", department: "ENG", role_level: L5, geo_tier: T1, annual_budget_cents: 50000000, salary_min_cents: 15000000, salary_mid_cents: 18000000, salary_max_cents: 21000000, headcount_authorized: 1 }
              as: HiringManager
              as_user_id: hm-1
              captures: { req_id: $.data.id }
            - call: "POST /api/requisitions/${req_id}/submit"
              payload: {}
              as: HiringManager
              as_user_id: hm-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: FinanceController
              as_user_id: fin-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L5, geo_tier: T1, base_cents: 19000000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L5, geo_tier: T1, base_cents: 19500000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L5, geo_tier: T1, base_cents: 20000000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/candidates"
              payload: { full_name: "Cand X", email: "cand.x@x.com" }
              as: Recruiter
              as_user_id: rec-1
              captures: { cand_id: $.data.id }
            - call: "POST /api/offers"
              payload: { requisition_id: "${req_id}", candidate_id: "${cand_id}", base_cents: 20000000, bonus_target_pct: 0, equity_shares: 0, equity_fmv_cents: 0 }
              as: Recruiter
              as_user_id: rec-1
              captures: { offer_id: $.data.id }
            - call: "POST /api/offers/${offer_id}/perks"
              payload: { kind: SIGN_ON, amount_cents: 1000000, clawback_months: 12, clawback_variant: PRORATED_MONTHLY }
              as: Recruiter
              as_user_id: rec-1
              captures: { perk_id: $.data.id }
            - call: "POST /api/offers/${offer_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: rec-1
            - call: "GET /api/offers/${offer_id}/approval-steps"
              as: Recruiter
              as_user_id: rec-1
              captures: { step0: "$.data[0].id" }
            - call: "POST /api/approval-steps/${step0}/decide"
              payload: { decision: APPROVED }
              as: HiringManager
              as_user_id: hm-1
            - call: "POST /api/offers/${offer_id}/letters"
              payload: {}
              as: Recruiter
              as_user_id: rec-1
            - call: "POST /api/offers/${offer_id}/extend"
              payload: {}
              as: Recruiter
              as_user_id: rec-1
            - call: "POST /api/offers/${offer_id}/accept"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
            - call: "POST /api/offers/${offer_id}/clearance-checks"
              payload: { kind: BACKGROUND }
              as: BackgroundScreener
              as_user_id: scr-1
              captures: { bg_id: $.data.id }
            - call: "POST /api/clearance-checks/${bg_id}/transition"
              payload: { to: IN_PROGRESS }
              as: BackgroundScreener
              as_user_id: scr-1
            - call: "POST /api/clearance-checks/${bg_id}/transition"
              payload: { to: CLEARED }
              as: BackgroundScreener
              as_user_id: scr-1
            - call: "GET /api/requisitions/${req_id}"
              as: Recruiter
              as_user_id: rec-1
              captures: { pre_filled: $.data.headcount_filled, pre_status: $.data.status }
          trigger:
            - call: "POST /api/offers/${offer_id}/rescind"
              payload: { reason: RENEG }
              as: HRAdmin
              as_user_id: admin-1
            - call: "GET /api/requisitions/${req_id}"
              as: Recruiter
              as_user_id: rec-1
              captures: { post_filled: $.data.headcount_filled, post_status: $.data.status }
            - call: "GET /api/candidates/${cand_id}"
              as: Recruiter
              as_user_id: rec-1
              captures: { cand_status: $.data.status }
          assert:
            - "before rescind: headcount_filled == 1, requisition CLOSED with close_reason FILLED, offer HIRED (forward action)"
            - "after RENEG rescind: headcount_filled == 0 == count of HIRED offers (invariant restored, no drift)"
            - "requisition reopens: status == OPEN, close_reason == null"
            - "PerkPackage.${perk_id}.status == ACTIVE while the offer was HIRED (APPROVED -> ACTIVE on hire)"
            - "PerkPackage.${perk_id}.status == VOIDED after the reneg rescind (ACTIVE -> VOIDED)"
            - "Candidate.${cand_id}.status == IN_PROCESS; Offer.status == RESCINDED with rescind_reason == RENEG"

      - name: submit_withdraw_committed_budget_conservation
        grounds:
          - calculations.committed_budget
          - state_machines.Offer.DRAFT_to_PENDING_APPROVAL
          - state_machines.Offer.PENDING_APPROVAL_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity: Requisition.committed_budget_cents == SUM of
          fully_loaded over offers in the counted status set — a different
          conserved quantity (money, not count) from headcount. Submit (+)
          paired with withdraw (-) returns the ledger to exactly 0, and a DRAFT
          offer contributes 0 throughout.
        test_recipe:
          setup:
            - "Requisition (standard range, budget 50000000, headcount 2) OPEN; three L5/T1 peers"
            - "Offer base 20000000 pct 0 (fully_loaded 26000000) in DRAFT"
          setup_api_calls:
            - call: "POST /api/requisitions"
              payload: { title: "Sr Eng", department: "ENG", role_level: L5, geo_tier: T1, annual_budget_cents: 50000000, salary_min_cents: 15000000, salary_mid_cents: 18000000, salary_max_cents: 21000000, headcount_authorized: 2 }
              as: HiringManager
              as_user_id: hm-1
              captures: { req_id: $.data.id }
            - call: "POST /api/requisitions/${req_id}/submit"
              payload: {}
              as: HiringManager
              as_user_id: hm-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: FinanceController
              as_user_id: fin-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L5, geo_tier: T1, base_cents: 19000000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L5, geo_tier: T1, base_cents: 19500000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L5, geo_tier: T1, base_cents: 20000000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/candidates"
              payload: { full_name: "Cand Y", email: "cand.y@x.com" }
              as: Recruiter
              as_user_id: rec-1
              captures: { cand_id: $.data.id }
            - call: "POST /api/offers"
              payload: { requisition_id: "${req_id}", candidate_id: "${cand_id}", base_cents: 20000000, bonus_target_pct: 0, equity_shares: 0, equity_fmv_cents: 0 }
              as: Recruiter
              as_user_id: rec-1
              captures: { offer_id: $.data.id }
            - call: "GET /api/requisitions/${req_id}"
              as: Recruiter
              as_user_id: rec-1
              captures: { c0: $.data.committed_budget_cents }
            - call: "POST /api/offers/${offer_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: rec-1
            - call: "GET /api/requisitions/${req_id}"
              as: Recruiter
              as_user_id: rec-1
              captures: { c1: $.data.committed_budget_cents }
          trigger:
            - call: "POST /api/offers/${offer_id}/withdraw"
              payload: { reason: "candidate pipeline frozen" }
              as: Recruiter
              as_user_id: rec-1
            - call: "GET /api/requisitions/${req_id}"
              as: Recruiter
              as_user_id: rec-1
              captures: { c2: $.data.committed_budget_cents }
          assert:
            - "while DRAFT: committed_budget_cents == 0 (DRAFT not in the counted set)"
            - "after submit: committed_budget_cents == 26000000 (forward action enters the counted set)"
            - "after withdraw: committed_budget_cents == 0 (compensating action; SUM invariant restored exactly)"
            - "Offer.status == WITHDRAWN and its events show SUBMITTED then WITHDRAWN"
