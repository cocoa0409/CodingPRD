  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reconcile_ledger_conserved_to_finalized_total
        grounds:
          - state_machines.ServiceVisit.PICKED_UP_to_DELIVERED
          - state_machines.ServiceVisit.DELIVERED_to_RECONCILED
          - calculations.account_outstanding
          - entities.Account.fields.outstanding_cents
          - entities.ServiceVisit.fields.finalized_charge_cents
        distinguishing_aspect: |
          Conserved quantity = Account.outstanding_cents (unpaid money). Forward action (deliver) posts
          provisional charges; compensating action (reconcile) deletes those rows and posts finalized
          rows, leaving outstanding_cents == sum of finalized charges (1200) with zero residual provisional
          drift: outstanding_cents == ServiceVisit.finalized_charge_cents.
        test_recipe:
          setup:
            - "The provisional/finalized visit delivered (provisional 3600 on ledger), then reconciled (finalized 1200)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "Acme Q", service_day: "MON", shortage_grace_units: 2 }
              as: ProgramAdmin
              captures: { acct: $.data.id }
            - call: "POST /garment-types"
              payload: { sku: "SHIRT-Q", category: "SHIRT", weekly_rate_cents: 1200, replacement_cost_cents: 8000, emblem_setup_cents: 0 }
              as: ProgramAdmin
              captures: { gt: $.data.id }
            - call: "POST /wash-stations"
              payload: { station_code: "WS-Q", capacity: 5 }
              as: ProgramAdmin
              captures: { ws: $.data.id }
            - call: "POST /accounts/${acct}/wearers"
              payload: { full_name: "Qiu", shirt_size: "M", pant_size: 32, locker_label: "L1" }
              as: AccountManager
              captures: { wr: $.data.id }
            - call: "POST /accounts/${acct}/garments"
              payload: { garment_type_id: "${gt}", tag_code: "T1" }
              as: ProgramAdmin
              captures: { g1: $.data.id }
            - call: "POST /accounts/${acct}/garments"
              payload: { garment_type_id: "${gt}", tag_code: "T2" }
              as: ProgramAdmin
              captures: { g2: $.data.id }
            - call: "POST /accounts/${acct}/garments"
              payload: { garment_type_id: "${gt}", tag_code: "T3" }
              as: ProgramAdmin
              captures: { g3: $.data.id }
            - call: "POST /assignments"
              payload: { garment_id: "${g1}", wearer_id: "${wr}" }
              as: AccountManager
            - call: "POST /assignments"
              payload: { garment_id: "${g2}", wearer_id: "${wr}" }
              as: AccountManager
            - call: "POST /assignments"
              payload: { garment_id: "${g3}", wearer_id: "${wr}" }
              as: AccountManager
            - call: "POST /routes"
              payload: { route_code: "R-Q", service_day: "MON", driver_user_id: "drv-q" }
              as: ProgramAdmin
              captures: { rt: $.data.id }
            - call: "POST /routes/${rt}/stops"
              payload: { account_id: "${acct}", stop_sequence: 1, window_start_min: 480, window_end_min: 540 }
              as: ProgramAdmin
              captures: { stop: $.data.id }
            - call: "POST /route-stops/${stop}/service-visits"
              payload: { week_index: 0 }
              as: ProgramAdmin
              captures: { v: $.data.id }
            - call: "POST /service-visits/${v}/pickup"
              payload: { actual_soil_count: 1 }
              as: RouteDriver
            - call: "POST /garments/${g1}/start-wash"
              payload: { wash_station_id: "${ws}", slot_start_min: 600, slot_end_min: 660 }
              as: CleanroomTech
            - call: "POST /garments/${g1}/finish-wash"
              payload: {}
              as: CleanroomTech
            - call: "POST /service-visits/${v}/deliver"
              payload: {}
              as: RouteDriver
              captures: { vdel: $.data.version }
          trigger:
            - call: "POST /service-visits/${v}/reconcile"
              payload: { expected_service_visit_version: "${vdel}" }
              as: ProgramAdmin
          assert:
            - "Account.${acct}.outstanding_cents == 1200"
            - "Account.${acct}.outstanding_cents == ServiceVisit.${v}.finalized_charge_cents"

      - name: return_conserves_garment_assigned_count
        grounds:
          - state_machines.Assignment.ASSIGNED_to_RETURNED
          - state_machines.Garment.ASSIGNED_to_IN_STOCK
          - entities.Wearer.fields.assigned_garment_count
          - entities.Garment.fields.lifecycle_status
        distinguishing_aspect: |
          Conserved quantity = Wearer.assigned_garment_count (a headcount-of-garments quantity, different
          type than money). Forward action (assign) increments it to 1 and sets Garment ASSIGNED;
          compensating action (return) decrements it back to 0 and restores Garment IN_STOCK — net zero
          drift on both the count and the garment lifecycle.
        test_recipe:
          setup:
            - "One garment assigned to a wearer (assigned_garment_count==1), then returned."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "Acme R", service_day: "TUE", shortage_grace_units: 0 }
              as: ProgramAdmin
              captures: { acct: $.data.id }
            - call: "POST /garment-types"
              payload: { sku: "SHIRT-R", category: "SHIRT", weekly_rate_cents: 1000, replacement_cost_cents: 8000, emblem_setup_cents: 0 }
              as: ProgramAdmin
              captures: { gt: $.data.id }
            - call: "POST /accounts/${acct}/wearers"
              payload: { full_name: "Rob", shirt_size: "M", pant_size: 30, locker_label: "L1" }
              as: AccountManager
              captures: { wr: $.data.id }
            - call: "POST /accounts/${acct}/garments"
              payload: { garment_type_id: "${gt}", tag_code: "T1" }
              as: ProgramAdmin
              captures: { g1: $.data.id }
            - call: "POST /assignments"
              payload: { garment_id: "${g1}", wearer_id: "${wr}" }
              as: AccountManager
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /assignments/${a1}/return"
              payload: {}
              as: AccountManager
          assert:
            - "Wearer.${wr}.assigned_garment_count == 0"
            - "Garment.${g1}.lifecycle_status == IN_STOCK"
            - "Assignment.${a1}.status == RETURNED"
