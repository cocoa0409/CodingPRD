            - "every allocated line has holdout_quantity == 0 and mailable_quantity == allocated_quantity"
            - "${planned_qty} == 43637 == 8000 + 30000 + 5637"
            - "${committed} == 9999969 and ${unc} == 31  # 10000000 == committed + uncommitted, and the 31-cent remainder proves the budget cap floored instead of rounding"
            - "all three lines are ALLOCATED; none was left PROPOSED because every clamp still granted at least one book"

      - name: holdout_carve_out_floors_and_splits_the_cost_bases
        claim_type: precision
        grounds:
          - calculations.drop_allocation_waterfall.formula
          - calculations.line_profitability
          - entities.CirculationLine.fields.holdout_quantity
          - entities.CirculationLine.fields.mailable_quantity
        distinguishing_aspect: "A holdout of 1234 bps on 8000 books floors to 987, not 988, and the resulting 7013 mailable books create a deliberate split: committed_cost_cents is charged on the 8000 ALLOCATED books while circulation_cost_cents is charged on the 7013 MAILABLE ones, so the two differ by exactly 987 * 236. An implementation that charges one quantity for both loses or invents 232932 cents on a single line."
        test_recipe:
          setup:
            - "Season FW26; segment S_A (30000 names, aov 18500, response 620); plan P1 budget 20000000 with a COMPLETED housefile-only merge-purge run; drop 1 at page_count 64, in_home 2026-09-15."
            - "One line: S_A, requested 8000, is_holdout true, holdout_pct_bps 1234. requested_quantity_total 8000 is below the 40000 rebate band, so both the provisional and the final cost per book are 166 + 15 + 55 == 236."
          setup_api_calls:
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_A", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id", plan_v1: "$.data.version" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v1}", input_rental_ids: [] }
              as: ListBroker
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 1, in_home_date: "2026-09-15", page_count: 64 }
              as: CirculationPlanner
              captures: { d1_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_id}", requested_quantity: 8000, is_holdout: true, holdout_pct_bps: 1234 }
              as: CirculationPlanner
              captures: { line_id: "$.data.id" }
          trigger:
            - call: "POST /catalog-circulation/drops/${d1_id}/allocate"
              payload: {}
              as: CirculationPlanner
              captures: { planned_qty: "$.data.planned_quantity", cpb: "$.data.cost_per_book_cents" }
            - call: "GET /catalog-circulation/circulation-lines/${line_id}"
              payload: {}
              as: CirculationPlanner
              captures: { alloc: "$.data.allocated_quantity", hold: "$.data.holdout_quantity", mail: "$.data.mailable_quantity", committed: "$.data.committed_cost_cents", fc: "$.data.forecast_demand_cents", gm: "$.data.gross_margin_cents", cc: "$.data.circulation_cost_cents", contrib: "$.data.contribution_cents" }
          assert:
            - "${alloc} == 8000 and ${hold} == 987  # floor(8000 * 1234 / 10000) == floor(987.2), never 988 and never rounded"
            - "${mail} == 7013 == ${alloc} - ${hold}"
            - "${committed} == 1888000 == 8000 * 236  # the holdout books are PAID FOR, so the commitment is on allocated_quantity"
            - "${planned_qty} == 8000 and ${cpb} == 236  # planned_quantity is the allocated universe, holdout included"
            - "${fc} == 8029000  # floor(7013 * 620 / 10000) == 434 orders at 18500; the 987 held-out books generate no demand"
            - "${gm} == 3372180 == round_half_up(8029000 * 4200 / 10000)"
            - "${cc} == 1655068 == 7013 * 236  # cost is charged on the MAILABLE books only"
            - "${contrib} == 1717112 == ${gm} - ${cc}"
            - "${committed} - ${cc} == 232932 == 987 * 236  # the two cost bases differ by exactly the holdout, which is the pinned asymmetry"

      - name: fatigue_decay_bands_are_step_functions_and_the_window_drops_events
        claim_type: precision
        grounds:
          - calculations.contact_fatigue_score
          - entities.CatalogSeason.fields.fatigue_window_days
          - entities.ContactEvent.fields.weighted_points
          - endpoints[POST /catalog-circulation/_clock/set_current_utc]
        distinguishing_aspect: "Six contacts are placed exactly on the fresh side and one day past four band edges (14/15, 60/61, 90/91) across all three channels, then the clock advances one day and the whole score is re-derived. The score FALLS from 88 to 71, which only happens if each event's decay is recomputed live against the current clock and the out-of-window event is dropped entirely - a handler that sums the frozen per-row weighted_points reports 84."
        test_recipe:
          setup:
            - "Season FW26 with default fatigue_window_days 90 and fatigue_suppression_threshold 100; segment S_A."
            - "Clock left at its 2026-08-01T00:00:00Z default while the six events are logged."
            - "Channel weights MAIL 40 / EMAIL 12 / DIGITAL 6; decay bands days_ago <= 14 -> 10000, <= 30 -> 7500, <= 60 -> 5000, <= 90 -> 2500, else 0."
          setup_api_calls:
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_A", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_id: "$.data.id" }
          trigger:
            - call: "POST /catalog-circulation/contact-events"
              payload: { housefile_segment_id: "${seg_id}", channel: "MAIL", contact_date: "2026-07-18", source: "MANUAL_LOG" }
              as: MarketingAnalyst
              captures: { e1_w: "$.data.channel_weight", e1_d: "$.data.decay_factor_bps", e1_p: "$.data.weighted_points" }
            - call: "POST /catalog-circulation/contact-events"
              payload: { housefile_segment_id: "${seg_id}", channel: "MAIL", contact_date: "2026-07-17", source: "MANUAL_LOG" }
              as: MarketingAnalyst
              captures: { e2_d: "$.data.decay_factor_bps", e2_p: "$.data.weighted_points" }
            - call: "POST /catalog-circulation/contact-events"
              payload: { housefile_segment_id: "${seg_id}", channel: "EMAIL", contact_date: "2026-06-02", source: "MANUAL_LOG" }
              as: MarketingAnalyst
              captures: { e3_d: "$.data.decay_factor_bps", e3_p: "$.data.weighted_points" }
            - call: "POST /catalog-circulation/contact-events"
              payload: { housefile_segment_id: "${seg_id}", channel: "DIGITAL", contact_date: "2026-06-01", source: "MANUAL_LOG" }
              as: MarketingAnalyst
              captures: { e4_d: "$.data.decay_factor_bps", e4_p: "$.data.weighted_points" }
            - call: "POST /catalog-circulation/contact-events"
              payload: { housefile_segment_id: "${seg_id}", channel: "MAIL", contact_date: "2026-05-03", source: "MANUAL_LOG" }
              as: MarketingAnalyst
              captures: { e5_d: "$.data.decay_factor_bps", e5_p: "$.data.weighted_points" }
            - call: "POST /catalog-circulation/contact-events"
              payload: { housefile_segment_id: "${seg_id}", channel: "MAIL", contact_date: "2026-05-02", source: "MANUAL_LOG" }
              as: MarketingAnalyst
              captures: { e6_d: "$.data.decay_factor_bps", e6_p: "$.data.weighted_points" }
            - call: "GET /catalog-circulation/housefile-segments/${seg_id}"
              payload: {}
              as: MarketingAnalyst
              captures: { score_before: "$.data.fatigue_score", strategy_before: "$.data.contact_strategy" }
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/contact-events"
              payload: { housefile_segment_id: "${seg_id}", channel: "DIGITAL", contact_date: "2026-08-02", source: "MANUAL_LOG" }
              as: MarketingAnalyst
              captures: { e7_d: "$.data.decay_factor_bps", e7_p: "$.data.weighted_points", score_after: "$.data.weighted_points" }
            - call: "GET /catalog-circulation/housefile-segments/${seg_id}"
              payload: {}
              as: MarketingAnalyst
              captures: { score_final: "$.data.fatigue_score", strategy_after: "$.data.contact_strategy" }
          assert:
            - "${e1_w} == 40, ${e1_d} == 10000 and ${e1_p} == 40  # days_ago exactly 14 still earns the freshest band"
            - "${e2_d} == 7500 and ${e2_p} == 30  # days_ago 15 drops a whole band: round_half_up(40 * 7500 / 10000)"
            - "${e3_d} == 5000 and ${e3_p} == 6  # EMAIL at exactly 60 days"
            - "${e4_d} == 2500 and ${e4_p} == 2  # DIGITAL at 61 days: round_half_up(6 * 2500 / 10000) == round_half_up(1.5) == 2, so ROUND_HALF_UP is visible on a single event"
            - "${e5_d} == 2500 and ${e5_p} == 10  # MAIL at exactly 90 days is the last in-window band"
            - "${e6_d} == 0 and ${e6_p} == 0  # 91 days is strictly outside fatigue_window_days and is skipped entirely"
            - "${score_before} == 88 == 40 + 30 + 6 + 2 + 10 + 0 and ${strategy_before} == PREMIUM_FULL  # below the threshold of 100, so no suppression"
            - "${e7_d} == 10000 and ${e7_p} == 6  # a same-day DIGITAL contact"
            - "${score_final} == 71  # after one day: 30 + 30 + 3 + 2 + 6, with the 90-day MAIL now out of window; summing the frozen per-row points would give 84"
            - "${strategy_after} == PREMIUM_FULL and suppressed_at == null  # the score fell rather than rose"
            - "ContactEvent.weighted_points on the six existing rows is unchanged by the clock move  # the rows are immutable snapshots, the score is live"

      - name: matchback_attribution_window_is_half_open_on_the_older_edge
        claim_type: correct_result
        grounds:
          - calculations.matchback_attribution.constants.window_shape
          - entities.MatchbackRun.fields.matched_order_count
          - entities.MatchbackRun.fields.unmatched_order_count
          - endpoints[POST /catalog-circulation/_online-orders/ingest]
        distinguishing_aspect: "Four ingested orders separate the three counters that a naive implementation collapses into one: a contact exactly ON the order date qualifies, a contact exactly attribution_window_days before it does NOT, and an order for a segment this drop never contacted is not even matched. matched_order_count therefore reads 3 while attributed_order_count reads 2 and unmatched_order_count reads 1."
        test_recipe:
          setup:
            - "The approved-plan chain that mails drop 1 (in_home_date 2026-09-15, one allocated S_A line), so the mail cascade leaves exactly one MAIL ContactEvent for S_A dated 2026-09-15."
            - "A second segment S_Z exists in the same season but is never circulated by this drop."
            - "Clock advanced to 2026-10-20T00:00:00Z before the orders are ingested and the run is created."
            - "attribution_window_days is passed as 30, so the window for an order is (order_date - 30 days, order_date]."
          setup_api_calls:
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-10-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/_online-orders/ingest"
              payload: { orders: [ { external_order_id: "O1", housefile_segment_id: "${seg_id}", order_date: "2026-09-15", demand_cents: 40000 }, { external_order_id: "O2", housefile_segment_id: "${seg_id}", order_date: "2026-10-15", demand_cents: 50000 }, { external_order_id: "O3", housefile_segment_id: "${seg_id}", order_date: "2026-10-14", demand_cents: 30000 }, { external_order_id: "O4", housefile_segment_id: "${seg_z}", order_date: "2026-09-20", demand_cents: 90000 } ] }
              as: PlatformAdmin
              captures: { ingested: "$.data.ingested_count" }
            - call: "GET /catalog-circulation/drops/${d1_id}"
              payload: {}
              as: MarketingAnalyst
              captures: { dv: "$.data.version" }
          trigger:
            - call: "POST /catalog-circulation/drops/${d1_id}/matchback-runs"
              payload: { expected_drop_version: "${dv}", attribution_variant: "LAST_TOUCH_MAIL", attribution_window_days: 30 }
              as: MarketingAnalyst
              captures: { matched: "$.data.matched_order_count", attributed: "$.data.attributed_order_count", unmatched: "$.data.unmatched_order_count", demand: "$.data.attributed_demand_cents", win: "$.data.attribution_window_days" }
          assert:
            - "${ingested} == 4 and ${win} == 30"
            - "${matched} == 3  # O1, O2 and O3 name a segment this drop contacted; O4 names S_Z and is not matched at all"
            - "${attributed} == 2  # O1 (contact exactly on the order date, so 0 days back, admitted) and O3 (29 days back)"
            - "O2 is matched but NOT attributed: its window opens strictly after 2026-09-15, and the only contact sits exactly on that bound, so the older edge is exclusive"
            - "${unmatched} == 1 == ${matched} - ${attributed}"
            - "${demand} == 70000 == 40000 + 30000  # LAST_TOUCH_MAIL gives the single mail touch the whole order"
            - "the 90000 cents of O4 appear nowhere in this run's totals"
            - "Drop.${d1_id}.measurement_status == MATCHBACK_OPEN and version == ${dv} + 1"

      - name: plan_rollup_counts_only_allocated_lines_of_live_drops
