      - name: contract_close_blocked_by_open_order_rejected
        claim_type: violation_to_error
        grounds:
          - "state_machines.SupplierContract.ACTIVE_to_CLOSED"
          - "errors[ERR_OPEN_ORDERS_EXIST]"
        distinguishing_aspect: "A contract with a SUBMITTED order cannot close; cancelling the order unblocks the close."
        test_recipe:
          setup: ["ACTIVE contract with one SUBMITTED order"]
          setup_api_calls:
            - { call: "POST /inventory-pools", payload: { season_label: "2026-FALL", garment_type: "GAME_JERSEY", size_code: "M", stock_on_hand: 10, reorder_point: 0, reorder_batch_size: 1 }, as: EquipmentManager }
            - { call: "POST /supplier-contracts", payload: { vendor_name: "CLOSECO", season_label: "2026-FALL", start_on: "2026-06-01", end_on: "2027-05-31", allocation_caps: [{ garment_type: "GAME_JERSEY", max_units: 10 }], default_lead_time_days: 30 }, as: TeamAdmin, captures: { sc: $.data.id } }
            - { call: "POST /supplier-contracts/${sc}/activate", payload: {}, as: TeamAdmin }
