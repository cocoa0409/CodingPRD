            - { call: "POST /lease-program/lease-agreements", payload: { owner_operator_id: "${op}", truck_id: "${truck}", start_date: "2026-08-03", term_weeks: 52, weekly_payment_cents: 65000, escrow_weekly_contribution_cents: 20000, escrow_cap_cents: 500000, buyout_base_price_cents: 4500000, min_revenue_guarantee_weekly_cents: 150000 }, as: LeaseAdmin, captures: { lease: "$.data.id" } }
            - { call: "POST /lease-program/lease-agreements/${lease}/activate", payload: {}, as: LeaseAdmin }
            - { call: "GET /lease-program/lease-agreements/${lease}", payload: {}, as: LeaseAdmin, captures: { lv1: "$.data.version" } }
            - { call: "POST /lease-program/buyout-quotes", payload: { lease_id: "${lease}", quote_kind: "EARLY", expected_lease_version: "${lv1}" }, as: LeaseAdmin, captures: { q1: "$.data.id" } }
            - { call: "GET /lease-program/lease-agreements/${lease}", payload: {}, as: LeaseAdmin, captures: { lv2: "$.data.version" } }
          trigger:
            - { call: "POST /lease-program/buyout-quotes", payload: { lease_id: "${lease}", quote_kind: "EARLY", expected_lease_version: "${lv2}" }, as: LeaseAdmin, captures: { q2: "$.data.id" } }
            - { call: "GET /lease-program/lease-agreements/${lease}", payload: {}, as: LeaseAdmin, captures: { lv3: "$.data.version" } }
          assert:
            - "captured lv2 == captured lv1 + 1 (first quote create bumped version by exactly 1)"
            - "captured lv3 == captured lv2 + 1 (second quote create bumped again)"
            - "BuyoutQuote.${q1}.status == SUPERSEDED"
            - "BuyoutQuote.${q2}.status == GENERATED"

      - name: doc_reject_flips_operator_flagged_then_reverify_recovers
        claim_type: side_effect_execution
        grounds: ["entities.OwnerOperator.fields.classification_status", "state_machines.ComplianceDocument.SUBMITTED_to_REJECTED", "state_machines.OwnerOperator.FLAGGED_to_VERIFIED"]
        distinguishing_aspect: "Derived-field reconciliation: rejecting a required document recomputes the operator to FLAGGED; verifying a replacement document recomputes back to VERIFIED."
        test_recipe:
          setup: ["operator with W9 + OPERATING_AUTHORITY VERIFIED and INSURANCE_CERTIFICATE REJECTED"]
          setup_api_calls:
            - { call: "POST /lease-program/owner-operators", payload: { legal_name: "Pat Owner", cdl_number: "CDL-XL3" }, as: LeaseAdmin, captures: { op: "$.data.id" } }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "W9", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d1: "$.data.id" } }
