  - section: state_machines
    instances:
      - name: peer_group_terminal_retired_no_further_transitions
        claim_type: terminal_state_lockdown
        grounds: [state_machines.PeerGroup, "errors[ERR_INVALID_STATE"]
        distinguishing_aspect: "RETIRED is terminal; further activate/pause attempts rejected"
        test_recipe:
          setup:
            - "PeerGroup G in RETIRED state"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "P", focus_area: "GRIEF" }
              as: ProgramAdmin
              captures: { pid: $.data.id }
            - call: "POST /programs/${pid}/groups"
              payload: { name: "G", modality: "VIRTUAL", base_capacity: 5, required_facilitator_level: 1 }
              as: ProgramAdmin
              captures: { gid: $.data.id }
            - call: "POST /programs/${pid}/groups/${gid}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${pid}/groups/${gid}/retire"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /programs/${pid}/groups/${gid}/pause"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "PeerGroup.${gid}.status == RETIRED (unchanged)"

      - name: facilitator_rejected_is_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Facilitator]
        distinguishing_aspect: "REJECTED is terminal; no further transitions"
        test_recipe:
          setup:
            - "Facilitator F in REJECTED state"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
