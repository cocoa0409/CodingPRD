            - { call: "POST /sap/term-enrollments/${e_a2}/post", payload: { earned_credits: 12, quality_points: 36.0, gpa_hours: 12 }, as: Registrar }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu_b}", term_id: "${t2}", attempted_credits: 12 }, as: Registrar, captures: { e_b2: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e_b2}/post", payload: { earned_credits: 6, quality_points: 24.0, gpa_hours: 12 }, as: Registrar }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu_c}", term_id: "${t2}", attempted_credits: 12 }, as: Registrar, captures: { e_c2: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e_c2}/post", payload: { earned_credits: 3, quality_points: 12.0, gpa_hours: 12 }, as: Registrar }
            - { call: "POST /sap/terms/${t2}/close-grading", as: Registrar }
          trigger:
            - { call: "POST /sap/terms/${t2}/evaluate", as: AidOfficer, captures: { n_eval: $.data.evaluated_count, n_good: $.data.good_standing_count, n_warn: $.data.warning_count, n_susp: $.data.suspension_count } }
          assert:
            - "evaluated_count == 3, good_standing_count == 1, warning_count == 1, suspension_count == 1"
            - "students not enrolled in T1 (A, B) were not swept at T1; C's T2 standing is SUSPENSION (prior WARNING)"

      - name: dispatch_idempotent_second_run
        claim_type: idempotency
        grounds: ['endpoints["POST /sap/notifications/dispatch"]', state_machines.Notification]
        distinguishing_aspect: "A dispatch with nothing due sends/cancels zero rows; re-running at the same clock is a safe no-op."
        test_recipe:
          setup: ["Student warned at T1 (one STANDING_CHANGE notification QUEUED at 2026-08-01); first dispatch sends it"]
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-ID", name: "Idempotent", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-4004", full_name: "Idem Potent", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 12 }, as: Registrar, captures: { e1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e1}/post", payload: { earned_credits: 6, quality_points: 24.0, gpa_hours: 12 }, as: Registrar }
            - { call: "POST /sap/terms/${t1}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t1}/evaluate", as: AidOfficer }
          trigger:
            - { call: "POST /sap/notifications/dispatch", as: AidOfficer, captures: { sent1: $.data.sent_count } }
            - { call: "POST /sap/notifications/dispatch", as: AidOfficer, captures: { sent2: $.data.sent_count, canc2: $.data.cancelled_count } }
          assert:
            - "first dispatch: sent_count == 1; second dispatch at the same clock: sent_count == 0, cancelled_count == 0"
            - "the notification remains SENT exactly once (sent_at unchanged)"

      - name: audit_events_filter_by_entity_type
        claim_type: computed_read
        grounds: ['endpoints["GET /sap/audit-events"]', entities.AuditEvent]
        distinguishing_aspect: "Federal-review read model: filtering by entity_type and student_id returns exactly the matching slice of the append-only trail."
        test_recipe:
          setup: ["Student with one posted enrollment and one evaluation (WARNING world)"]
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-AF", name: "AuditFilter", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-4005", full_name: "Audit Me", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 12 }, as: Registrar, captures: { e1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e1}/post", payload: { earned_credits: 6, quality_points: 24.0, gpa_hours: 12 }, as: Registrar }
            - { call: "POST /sap/terms/${t1}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t1}/evaluate", as: AidOfficer }
          trigger:
            - { call: "GET /sap/audit-events?student_id=${stu}&entity_type=SapEvaluation", as: Auditor, captures: { a0_action: "$.data[0].action", a0_entity: "$.data[0].entity_type" } }
            - { call: "GET /sap/audit-events?entity_type=Term", as: Auditor }
            - { call: "GET /sap/audit-events?student_id=${stu}", as: Auditor }
          assert:
            - "student+entity_type=SapEvaluation: exactly 1 event, action EVALUATION_POSTED"
            - "entity_type=Term (no student filter): 3 events (TERM_CREATED, TERM_GRADING_CLOSED, TERM_EVALUATED) with student_id null"
            - "student filter: 6 events total (STUDENT_CREATED, ENROLLMENT_CREATED, ENROLLMENT_POSTED, EVALUATION_POSTED, STANDING_CHANGED, NOTIFICATION_QUEUED)"

