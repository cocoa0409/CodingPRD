  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: item_statistics_gate_at_29_versus_30_pooled_responses_and_four_dp_p_value
        grounds:
          - calculations.item_statistics
          - calculations.item_flag_evaluation
          - state_machines.Item.APPROVED_to_PRETEST
          - state_machines.Item.PRETEST_to_OPERATIONAL
          - entities.Item.fields.stat_basis_applied
          - entities.CertificationProgram.computed_fields.operational_item_count
        distinguishing_aspect: |
          min_responses_for_stats 30 is an inclusive floor evaluated on the POOLED accumulator
          total, not per batch: at 29 pooled responses the guard fires, p_value and
          discrimination_index stay null and the item is stranded in PRETEST; one further
          response (total exactly 30) crosses the gate and p_value becomes
          round_half_up(20/30, 4) == 0.6667 — a value that truncation to 4 dp would render
          0.6666 — while discrimination_index is exactly 0.6000, promoting the item to
          OPERATIONAL.
        test_recipe:
          setup:
            - "One ACTIVE programme CPX (psychometric_stat_basis POOLED, min_responses_for_stats 30, min_discrimination 0.15, min_p_value 0.20, max_p_value 0.95 — all defaults, domain_specs [{D1, 100, min_operational_items 1}], form_length 1)."
            - "One Item in status APPROVED with every accumulator at 0, p_value null, discrimination_index null, flag_reason null."
            - "CertificationProgram.operational_item_count == 0 and blueprint_posture == DEFICIENT."
          setup_api_calls:
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner X", "credential_code": "CPX", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 100, "min_operational_items": 1}], "form_length": 1, "accepted_education_credentials": ["BACHELOR"], "psychometric_stat_basis": "POOLED", "min_panelists": 1, "panel_trim_count": 0, "audit_every_nth": 7, "cycle_length_months": 12, "required_ceu_credits": 12}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {"activation_note": "CPX live"}
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /items"
              payload: {"program_id": "${prog_id}", "domain_code": "D1", "cognitive_level": "APPLICATION", "stem": "Boundary item"}
              as: ItemSpecialist
              as_user_id: "isp-author"
              captures: { item_id: "$.data.id" }
            - call: "POST /items/${item_id}/submit-for-review"
              payload: {"revision_note": "ready"}
              as: ItemSpecialist
              as_user_id: "isp-author"
            - call: "POST /items/${item_id}/review"
              payload: {"decision": "APPROVE"}
              as: ItemSpecialist
              as_user_id: "isp-rev-1"
            - call: "POST /items/${item_id}/review"
              payload: {"decision": "APPROVE"}
              as: ItemSpecialist
              as_user_id: "isp-rev-2"
          trigger:
            - call: "POST /items/${item_id}/response-batches"
              payload: {"is_pretest": true, "response_count": 29, "correct_count": 19, "upper_n": 10, "upper_correct": 9, "lower_n": 10, "lower_correct": 3}
              as: Psychometrician
              as_user_id: "psy-1"
            - call: "POST /items/${item_id}/response-batches"
              payload: {"is_pretest": true, "response_count": 1, "correct_count": 1, "upper_n": 0, "upper_correct": 0, "lower_n": 0, "lower_correct": 0}
              as: Psychometrician
              as_user_id: "psy-1"
          assert:
            - "after trigger[0] Item.${item_id}.pretest_response_count == 29 and Item.${item_id}.stat_basis_applied == INSUFFICIENT_DATA"
            - "after trigger[0] Item.${item_id}.p_value == null and Item.${item_id}.discrimination_index == null and Item.${item_id}.flag_reason == null"
            - "after trigger[0] Item.${item_id}.status == PRETEST (the first pretest batch promotes APPROVED -> PRETEST even when the stats guard fires)"
            - "after trigger[0] CertificationProgram.${prog_id}.operational_item_count == 0 and CertificationProgram.${prog_id}.blueprint_posture == DEFICIENT"
            - "after trigger[1] Item.${item_id}.pretest_response_count == 30, Item.${item_id}.pretest_correct_count == 20, Item.${item_id}.pretest_upper_n == 10 and Item.${item_id}.pretest_lower_n == 10"
            - "after trigger[1] Item.${item_id}.stat_basis_applied == POOLED, Item.${item_id}.p_value == 0.6667 and Item.${item_id}.discrimination_index == 0.6000"
            - "Item.${item_id}.p_value != 0.6666 (truncation instead of ROUND_HALF_UP would give 0.6666)"
            - "after trigger[1] Item.${item_id}.flag_reason == null and Item.${item_id}.status == OPERATIONAL"
            - "after trigger[1] CertificationProgram.${prog_id}.operational_item_count == 1, CertificationProgram.${prog_id}.deficient_domain_codes == [] and CertificationProgram.${prog_id}.blueprint_posture == COMPLETE"


      - name: angoff_quorum_boundary_four_ratings_leave_zero_survivors_and_five_leave_exactly_one
        grounds:
          - calculations.angoff_cut_score
          - validations[priority=36]
          - errors.ERR_PANEL_QUORUM_NOT_MET
          - state_machines.ExamForm.ASSEMBLED_to_CUT_SCORE_SET
          - entities.ExamForm.fields.mean_expected_pass_rate
          - entities.ExamForm.fields.raw_cut_score
        distinguishing_aspect: |
          The quorum test is a SECOND, independent boundary beyond min_panelists: with
          min_panelists 3 and panel_trim_count 2 a four-rating panel passes n >= min_panelists
          but leaves n - 2t == 0 survivors, so adoption is refused with
          ERR_PANEL_QUORUM_NOT_MET; the fifth rating makes n - 2t == 1, trimming the two lowest
          and two highest to leave the single median 0.60, giving trimmed_mean 0.600000, sem
          0.0 (k == 1), raw round_half_up(0.6 * 4, 0) == 2 and, after the clamp band
