# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Property Tax Assessment & Appeal — EXPERT
# 9 rule_ids x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: capped_rollforward_vs_market_rebase_on_assessment
        grounds:
          - calculations.capped_base_value
          - entities.Assessment.fields.capped_base_value
          - entities.Assessment.fields.reassessment_event
        distinguishing_aspect: |
          On the Assessment entity domain, two assessments with identical market_value=130000
          against a parcel whose last_certified_capped_base=100000 diverge: reassessment_event==NONE
          caps the base at 102000, reassessment_event==NONE-but-after-SALE rebases to full 130000.
        test_recipe:
          setup:
            - "Owner O exists; Parcel P1 (owner O) certified last year with capped_base 100000; current roll R2 OPEN with growth_cap_pct=0.02; a fresh parcel P2 (owner O) never certified."
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "O One", email: "o1@x.com", birth_date: "1980-01-01T00:00:00.000Z" }
              as: Assessor
              captures: { owner_id: $.data.id }
            - call: "POST /tax-rolls"
              payload: { tax_year: 2025, mill_rate: 10.0, growth_cap_pct: 0.02 }
              as: Assessor
              captures: { roll1_id: $.data.id }
            - call: "POST /tax-rolls/${roll1_id}/open"
              payload: {}
              as: Assessor
            - call: "POST /parcels"
              payload: { owner_id: "${owner_id}", apn: "APN-P1", situs_address: "1 Main", is_primary_residence: false }
              as: Assessor
              captures: { p1_id: $.data.id }
            - call: "POST /assessments"
              payload: { parcel_id: "${p1_id}", tax_roll_id: "${roll1_id}", market_value: 100000, reassessment_event: "NONE" }
              as: Assessor
              captures: { a1_id: $.data.id }
            - call: "POST /assessments/${a1_id}/notice"
              payload: {}
              as: Assessor
            - call: "POST /assessments/${a1_id}/finalize"
              payload: {}
              as: Assessor
            - call: "POST /tax-rolls/${roll1_id}/certify"
              payload: {}
              as: Assessor
            - call: "POST /tax-rolls"
              payload: { tax_year: 2026, mill_rate: 10.0, growth_cap_pct: 0.02, prior_roll_id: "${roll1_id}" }
              as: Assessor
              captures: { roll2_id: $.data.id }
            - call: "POST /tax-rolls/${roll2_id}/open"
              payload: {}
              as: Assessor
          trigger:
            - call: "POST /assessments"
              payload: { parcel_id: "${p1_id}", tax_roll_id: "${roll2_id}", market_value: 130000, reassessment_event: "NONE" }
              as: Assessor
              captures: { a2_none_id: $.data.id }
          assert:
            - "Assessment.${a2_none_id}.capped_base_value == 102000"
            - "Assessment.${a2_none_id}.assessed_value == 102000"
            - "A separate assessment created with market_value=130000 and reassessment_event=SALE on a sold parcel yields capped_base_value == 130000 (delta 28000 vs the capped variant)"

      - name: declining_balance_vs_originated_principal_on_deferral
        grounds:
          - calculations.deferral_interest_accrual
          - entities.DeferralAgreement.fields.accrued_interest_cents
          - entities.DeferralAgreement.fields.deferred_principal_cents
        distinguishing_aspect: |
          On the DeferralAgreement entity domain, after 50000 cents of principal is repaid the second
          accrual period charges 7500 cents (declining_balance on 150000) not 10000 (originated on 200000);
          the divergence is 2500 cents and proves the pinned declining variant.
        test_recipe:
          setup:
            - "DeferralAgreement D with deferred_principal_cents=200000 (one enrolled bill of 200000 cents), annual_interest_rate=0.05; period-1 interest already accrued (10000); a 60000-cent payment applied (10000 to interest, 50000 to principal)."
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Sr Owner", email: "sr@x.com", birth_date: "1950-01-01T00:00:00.000Z" }
              as: Assessor
              captures: { owner_id: $.data.id }
            - call: "POST /tax-rolls"
              payload: { tax_year: 2026, mill_rate: 10.0, growth_cap_pct: 0.02, senior_age_threshold: 65 }
              as: Assessor
              captures: { roll_id: $.data.id }
            - call: "POST /tax-rolls/${roll_id}/open"
              payload: {}
              as: Assessor
            - call: "POST /parcels"
              payload: { owner_id: "${owner_id}", apn: "APN-D", situs_address: "9 Elm", is_primary_residence: true }
              as: Assessor
              captures: { parcel_id: $.data.id }
            - call: "POST /assessments"
              payload: { parcel_id: "${parcel_id}", tax_roll_id: "${roll_id}", market_value: 200000, reassessment_event: "NONE" }
              as: Assessor
              captures: { asmt_id: $.data.id }
            - call: "POST /assessments/${asmt_id}/notice"
              payload: {}
              as: Assessor
            - call: "POST /assessments/${asmt_id}/finalize"
              payload: {}
              as: Assessor
            - call: "POST /assessments/${asmt_id}/issue-bill"
              payload: {}
              as: Assessor
              captures: { bill_id: $.data.id }
            - call: "POST /deferrals"
              payload: { parcel_id: "${parcel_id}", owner_id: "${owner_id}", annual_interest_rate: 0.05 }
              as: Assessor
              captures: { def_id: $.data.id, def_v0: $.data.version }
            - call: "POST /deferrals/${def_id}/enroll-bill"
              payload: { tax_bill_id: "${bill_id}" }
              as: Assessor
              captures: { def_v1: $.data.version }
            - call: "POST /deferrals/${def_id}/accrue-interest"
              payload: {}
              as: Assessor
              captures: { def_v2: $.data.version }
            - call: "POST /deferrals/${def_id}/payments"
              payload: { amount_cents: 60000, expected_deferral_version: "${def_v2}" }
              as: Assessor
              captures: { def_v3: $.data.version }
          trigger:
            - call: "POST /deferrals/${def_id}/accrue-interest"
              payload: {}
              as: Assessor
              captures: { acc_after: $.data.accrued_interest_cents }
          assert:
            - "DeferralAgreement.${def_id}.accrued_interest_cents == 17500"
            - "The period-2 accrual added 7500 cents (declining on principal 150000), not 10000 (originated on 200000)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: exemption_deduction_multiinput_branching_mode_a
        grounds:
          - calculations.exemption_deduction
          - entities.Exemption.fields.exemption_type
          - entities.Owner.fields.disability_pct
        distinguishing_aspect: |
          Mode (a): exemption_deduction takes >=3 inputs (exemption_type, assessed_value, owner attrs)
          with a nested max and a per-type branch; a SENIOR exemption on assessed_value=102000 yields
          max(5000, round(102000*0.10))=10200, not the SENIOR_FLAT 5000.
        test_recipe:
          setup:
            - "Senior owner (age>=65) S; Parcel P (owner S); roll R OPEN growth_cap 0.02; DRAFT assessment A with assessed_value 102000 (capped from prior_base 100000, market 130000); a CLAIMED SENIOR exemption on A."
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Senior S", email: "s@x.com", birth_date: "1950-01-01T00:00:00.000Z" }
              as: Assessor
              captures: { owner_id: $.data.id }
            - call: "POST /tax-rolls"
              payload: { tax_year: 2025, mill_rate: 10.0, growth_cap_pct: 0.02 }
              as: Assessor
              captures: { roll1_id: $.data.id }
            - call: "POST /tax-rolls/${roll1_id}/open"
              payload: {}
              as: Assessor
            - call: "POST /parcels"
              payload: { owner_id: "${owner_id}", apn: "APN-S", situs_address: "2 Oak", is_primary_residence: false }
              as: Assessor
              captures: { parcel_id: $.data.id }
            - call: "POST /assessments"
              payload: { parcel_id: "${parcel_id}", tax_roll_id: "${roll1_id}", market_value: 100000, reassessment_event: "NONE" }
              as: Assessor
              captures: { a1_id: $.data.id }
            - call: "POST /assessments/${a1_id}/notice"
              payload: {}
              as: Assessor
            - call: "POST /assessments/${a1_id}/finalize"
              payload: {}
              as: Assessor
            - call: "POST /tax-rolls/${roll1_id}/certify"
              payload: {}
              as: Assessor
            - call: "POST /tax-rolls"
              payload: { tax_year: 2026, mill_rate: 10.0, growth_cap_pct: 0.02, prior_roll_id: "${roll1_id}" }
              as: Assessor
              captures: { roll2_id: $.data.id }
            - call: "POST /tax-rolls/${roll2_id}/open"
              payload: {}
              as: Assessor
            - call: "POST /assessments"
              payload: { parcel_id: "${parcel_id}", tax_roll_id: "${roll2_id}", market_value: 130000, reassessment_event: "NONE" }
              as: Assessor
              captures: { a2_id: $.data.id }
            - call: "POST /exemptions"
              payload: { assessment_id: "${a2_id}", exemption_type: "SENIOR" }
              as: Assessor
              captures: { exm_id: $.data.id }
          trigger:
            - call: "POST /exemptions/${exm_id}/approve"
              payload: {}
              as: Reviewer
              captures: { amt: $.data.claimed_amount }
          assert:
            - "Exemption.${exm_id}.claimed_amount == 10200"
            - "Exemption.${exm_id}.status == APPROVED"

      - name: tax_bill_round_once_mode_b
        grounds:
          - calculations.tax_bill_amount
          - entities.TaxBill.fields.tax_amount_cents
          - entities.TaxRoll.fields.mill_rate
        distinguishing_aspect: |
          Mode (b): tax_bill_amount pins the rounding order — multiply full precision then round ONCE.
          final_taxable_value=84800 at mill_rate=12.3456 yields 104691 cents (round(84800*12.3456/10)),
          NOT 104700 (round-to-dollars-first).
        test_recipe:
          setup:
            - "FINAL assessment A on roll R (mill_rate=12.3456) whose final_taxable_value=84800 (assessed 102000 minus HOMESTEAD 7000 + SENIOR 10200)."
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Senior H", email: "sh@x.com", birth_date: "1950-01-01T00:00:00.000Z" }
              as: Assessor
              captures: { owner_id: $.data.id }
            - call: "POST /tax-rolls"
              payload: { tax_year: 2025, mill_rate: 10.0, growth_cap_pct: 0.02 }
              as: Assessor
              captures: { roll1_id: $.data.id }
            - call: "POST /tax-rolls/${roll1_id}/open"
              payload: {}
              as: Assessor
            - call: "POST /parcels"
              payload: { owner_id: "${owner_id}", apn: "APN-H", situs_address: "3 Pine", is_primary_residence: true }
              as: Assessor
              captures: { parcel_id: $.data.id }
            - call: "POST /assessments"
              payload: { parcel_id: "${parcel_id}", tax_roll_id: "${roll1_id}", market_value: 100000, reassessment_event: "NONE" }
              as: Assessor
              captures: { a1_id: $.data.id }
            - call: "POST /assessments/${a1_id}/notice"
              payload: {}
              as: Assessor
            - call: "POST /assessments/${a1_id}/finalize"
              payload: {}
              as: Assessor
            - call: "POST /tax-rolls/${roll1_id}/certify"
              payload: {}
              as: Assessor
            - call: "POST /tax-rolls"
              payload: { tax_year: 2026, mill_rate: 12.3456, growth_cap_pct: 0.02, prior_roll_id: "${roll1_id}" }
              as: Assessor
              captures: { roll2_id: $.data.id }
            - call: "POST /tax-rolls/${roll2_id}/open"
              payload: {}
              as: Assessor
            - call: "POST /assessments"
              payload: { parcel_id: "${parcel_id}", tax_roll_id: "${roll2_id}", market_value: 130000, reassessment_event: "NONE" }
              as: Assessor
              captures: { a2_id: $.data.id }
            - call: "POST /exemptions"
              payload: { assessment_id: "${a2_id}", exemption_type: "HOMESTEAD" }
              as: Assessor
              captures: { ex_hs: $.data.id }
            - call: "POST /exemptions"
              payload: { assessment_id: "${a2_id}", exemption_type: "SENIOR" }
              as: Assessor
              captures: { ex_sr: $.data.id }
            - call: "POST /exemptions/${ex_hs}/approve"
              payload: {}
              as: Reviewer
            - call: "POST /exemptions/${ex_sr}/approve"
              payload: {}
              as: Reviewer
            - call: "POST /assessments/${a2_id}/notice"
              payload: {}
              as: Assessor
            - call: "POST /assessments/${a2_id}/finalize"
              payload: {}
              as: Assessor
          trigger:
            - call: "POST /assessments/${a2_id}/issue-bill"
              payload: {}
              as: Assessor
              captures: { bill_id: $.data.id }
          assert:
            - "TaxBill.${bill_id}.billed_taxable_value == 84800"
            - "TaxBill.${bill_id}.tax_amount_cents == 104691"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: appeal_cyclic_evidence_negotiation_loop
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_EVIDENCE_REQUESTED
          - state_machines.Appeal.EVIDENCE_REQUESTED_to_UNDER_REVIEW
          - entities.Appeal.fields.round_no
        distinguishing_aspect: |
          The Appeal machine is cyclic: UNDER_REVIEW->EVIDENCE_REQUESTED->UNDER_REVIEW loops, incrementing
          round_no from 1 to 2 on the return; this is a true A->B->A loop, not a linear pipeline.
        test_recipe:
          setup:
            - "Appeal X in UNDER_REVIEW (filed against a NOTICED assessment, accepted by a HearingOfficer distinct from the noticing operator)."
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Pet One", email: "p1@x.com", birth_date: "1980-01-01T00:00:00.000Z" }
              as: Assessor
              captures: { owner_id: $.data.id }
            - call: "POST /tax-rolls"
              payload: { tax_year: 2026, mill_rate: 10.0, growth_cap_pct: 0.02 }
              as: Assessor
              captures: { roll_id: $.data.id }
            - call: "POST /tax-rolls/${roll_id}/open"
              payload: {}
              as: Assessor
            - call: "POST /parcels"
              payload: { owner_id: "${owner_id}", apn: "APN-X", situs_address: "4 Birch", is_primary_residence: false }
              as: Assessor
              captures: { parcel_id: $.data.id }
            - call: "POST /assessments"
              payload: { parcel_id: "${parcel_id}", tax_roll_id: "${roll_id}", market_value: 100000, reassessment_event: "NONE" }
              as: Assessor
              captures: { asmt_id: $.data.id, asmt_v0: $.data.version }
            - call: "POST /assessments/${asmt_id}/notice"
              payload: {}
              as: Assessor
              as_user_id: "assessor-notice-op"
              captures: { asmt_v1: $.data.version }
            - call: "POST /appeals"
              payload: { assessment_id: "${asmt_id}", filed_by_owner_id: "${owner_id}", requested_taxable_value: 80000, expected_assessment_version: "${asmt_v1}" }
              as: Taxpayer
              as_user_id: "${owner_id}"
              captures: { appeal_id: $.data.id }
            - call: "POST /appeals/${appeal_id}/accept"
              payload: {}
              as: HearingOfficer
              as_user_id: "hearing-officer-1"
          trigger:
            - call: "POST /appeals/${appeal_id}/request-evidence"
              payload: { counter_value: 95000 }
              as: HearingOfficer
              as_user_id: "hearing-officer-1"
            - call: "POST /appeals/${appeal_id}/submit-evidence"
              payload: {}
              as: Taxpayer
              as_user_id: "${owner_id}"
              captures: { round_after: $.data.round_no }
          assert:
            - "Appeal.${appeal_id}.status == UNDER_REVIEW"
            - "Appeal.${appeal_id}.round_no == 2"
            - "Appeal.${appeal_id}.opinion_of_value == 95000"

      - name: parcel_active_sold_active_cycle
        grounds:
          - state_machines.Parcel.ACTIVE_to_SOLD
          - state_machines.Parcel.SOLD_to_ACTIVE
          - entities.Parcel.fields.status
        distinguishing_aspect: |
          The Parcel machine cycles ACTIVE->SOLD->ACTIVE: recording a sale sets SOLD, then the first
          SALE-reassessment assessment returns it to ACTIVE; this loop lives on a different entity (Parcel)
          than the Appeal loop.
        test_recipe:
          setup:
            - "Parcel P (owner O1) ACTIVE on OPEN roll R; a second owner O2 to buy it."
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Owner One", email: "oo1@x.com", birth_date: "1980-01-01T00:00:00.000Z" }
              as: Assessor
              captures: { o1_id: $.data.id }
            - call: "POST /owners"
              payload: { full_name: "Owner Two", email: "oo2@x.com", birth_date: "1980-01-01T00:00:00.000Z" }
              as: Assessor
              captures: { o2_id: $.data.id }
            - call: "POST /tax-rolls"
              payload: { tax_year: 2026, mill_rate: 10.0, growth_cap_pct: 0.02 }
              as: Assessor
              captures: { roll_id: $.data.id }
            - call: "POST /tax-rolls/${roll_id}/open"
              payload: {}
              as: Assessor
            - call: "POST /parcels"
              payload: { owner_id: "${o1_id}", apn: "APN-SALE", situs_address: "5 Cedar", is_primary_residence: false }
              as: Assessor
              captures: { parcel_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/record-sale"
              payload: { new_owner_id: "${o2_id}" }
              as: Assessor
              captures: { status_sold: $.data.status }
          trigger:
            - call: "POST /assessments"
              payload: { parcel_id: "${parcel_id}", tax_roll_id: "${roll_id}", market_value: 250000, reassessment_event: "SALE" }
              as: Assessor
              captures: { asmt_id: $.data.id }
          assert:
            - "Parcel.${parcel_id}.status == ACTIVE"
            - "Parcel.${parcel_id}.owner_id == ${o2_id}"
            - "Assessment.${asmt_id}.capped_base_value == 250000"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: appeal_grant_cascades_to_assessment_then_bill_depth3
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_GRANTED
          - state_machines.Assessment.UNDER_APPEAL_to_NOTICED
          - calculations.tax_bill_amount
          - entities.Assessment.fields.final_taxable_value
        distinguishing_aspect: |
          Depth-3 cascade: granting the Appeal (A) sets determined_taxable_value, which mutates the
          Assessment's appealed_value+final_taxable_value (B), which in turn changes the issued TaxBill's
          tax_amount_cents (C) — each link caused by the prior, not by the grant directly.
        test_recipe:
          setup:
            - "Appeal in UNDER_REVIEW with requested_taxable_value=80000, parent assessment final_taxable_value=100000 (no exemptions), a HELD hearing on the appeal, roll mill_rate=10.0."
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Grant Owner", email: "g@x.com", birth_date: "1980-01-01T00:00:00.000Z" }
              as: Assessor
              captures: { owner_id: $.data.id }
            - call: "POST /tax-rolls"
              payload: { tax_year: 2026, mill_rate: 10.0, growth_cap_pct: 0.02 }
              as: Assessor
              captures: { roll_id: $.data.id }
            - call: "POST /tax-rolls/${roll_id}/open"
              payload: {}
              as: Assessor
            - call: "POST /parcels"
              payload: { owner_id: "${owner_id}", apn: "APN-G", situs_address: "6 Maple", is_primary_residence: false }
              as: Assessor
              captures: { parcel_id: $.data.id }
            - call: "POST /assessments"
              payload: { parcel_id: "${parcel_id}", tax_roll_id: "${roll_id}", market_value: 100000, reassessment_event: "SALE" }
              as: Assessor
              captures: { asmt_id: $.data.id }
            - call: "POST /assessments/${asmt_id}/notice"
              payload: {}
              as: Assessor
              as_user_id: "notice-op-A"
              captures: { asmt_v1: $.data.version }
            - call: "POST /appeals"
              payload: { assessment_id: "${asmt_id}", filed_by_owner_id: "${owner_id}", requested_taxable_value: 80000, expected_assessment_version: "${asmt_v1}" }
              as: Taxpayer
              as_user_id: "${owner_id}"
              captures: { appeal_id: $.data.id }
            - call: "POST /appeals/${appeal_id}/accept"
              payload: {}
              as: HearingOfficer
              as_user_id: "ho-A"
            - call: "POST /board-panels"
              payload: { name: "Panel G", setup_buffer_minutes: 15 }
              as: Assessor
              captures: { panel_id: $.data.id }
            - call: "POST /hearings"
              payload: { appeal_id: "${appeal_id}", board_panel_id: "${panel_id}", hearing_officer_role_user_id: "ho-A", starts_at: "2026-07-01T10:00:00.000Z", ends_at: "2026-07-01T11:00:00.000Z" }
              as: HearingOfficer
              as_user_id: "ho-A"
              captures: { hearing_id: $.data.id }
            - call: "POST /hearings/${hearing_id}/hold"
              payload: {}
              as: HearingOfficer
              as_user_id: "ho-A"
          trigger:
            - call: "POST /appeals/${appeal_id}/grant"
              payload: {}
              as: HearingOfficer
              as_user_id: "ho-A"
            - call: "POST /assessments/${asmt_id}/finalize"
              payload: {}
              as: Assessor
            - call: "POST /assessments/${asmt_id}/issue-bill"
              payload: {}
              as: Assessor
              captures: { bill_id: $.data.id }
          assert:
            - "Assessment.${asmt_id}.appealed_value == 80000"
            - "Assessment.${asmt_id}.final_taxable_value == 80000"
            - "TaxBill.${bill_id}.tax_amount_cents == 80000"

      - name: payment_satisfies_deferral_then_releases_depth2
        grounds:
          - calculations.deferral_payment_waterfall
          - state_machines.DeferralAgreement.ACTIVE_to_SATISFIED
          - entities.DeferralAgreement.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Depth-2 cascade originating from a DIFFERENT trigger (POST /deferrals/{id}/payments): the payment
          waterfall (A) drives outstanding_balance_cents to 0 which (B) auto-transitions the agreement
          ACTIVE->SATISFIED — a distinct propagation pattern from the appeal-grant cascade.
        test_recipe:
          setup:
            - "DeferralAgreement D ACTIVE with deferred_principal_cents=200000 (one enrolled 200000-cent bill) and one accrual period (accrued 10000), so outstanding=210000."
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Pay Owner", email: "pay@x.com", birth_date: "1950-01-01T00:00:00.000Z" }
              as: Assessor
              captures: { owner_id: $.data.id }
            - call: "POST /tax-rolls"
              payload: { tax_year: 2026, mill_rate: 10.0, growth_cap_pct: 0.02 }
              as: Assessor
              captures: { roll_id: $.data.id }
            - call: "POST /tax-rolls/${roll_id}/open"
              payload: {}
              as: Assessor
            - call: "POST /parcels"
              payload: { owner_id: "${owner_id}", apn: "APN-PAY", situs_address: "7 Walnut", is_primary_residence: true }
              as: Assessor
              captures: { parcel_id: $.data.id }
            - call: "POST /assessments"
