# =============================================================================
# Task 1561: Referral Management & Network Leakage — scaffold seed tables
# =============================================================================

scenario: |
  Referral Management & Network Leakage (health system referral center): referral order creation & specialty matching, in-network preference & patient choice documentation, appointment scheduling assistance & closed-loop confirmation, referral aging & no-show follow-up, consult note return & loop closure verification, leakage analytics by referring provider, prior-authorization requirement flagging, referral-to-visit conversion reporting

domain_name: referral-management-network-leakage
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - selector_policy            # specialty matching: eligibility + ranking + tie-break + empty-pool fallback
    - rate_threshold_triggers    # SLA aging boundaries, no-show grace, strike thresholds, utilization penalty
    - dual_variant_calculation   # conversion-rate bases; no-show risk scoring
    - optimistic_concurrency     # OCC on Referral.version for supersede-style writes
    - derived_field_reconciliation # booked slot counters, strike ledger, live report vs closed snapshot
    - cascading_side_effects     # no-show -> strikes -> patient posture -> referral escalation
  entity_topology: flat          # peer entities joined by FK references, no URL nesting for ownership
  state_machine_shape: branching # branching + cyclic loops + one parallel dimension (auth_status)
  relationship_patterns:
    - one_to_many
    - many_to_many               # NetworkParticipation joins SpecialistProvider x InsurancePlan
    - cross_aggregate
  role_model: segregation_of_duties  # loop-closure verifier barred from scheduling the same referral
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: ReferringProvider
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Provider full name" }
      - { name: npi, type: string, source: input, description: "National Provider Identifier; unique across ReferringProvider and SpecialistProvider (ERR_DUPLICATE_NPI)" }
      - { name: specialty, type: string, source: input, description: "Primary specialty free text" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED; SUSPENDED set/cleared by NetworkAdmin via suspend/reactivate actions" }
      - { name: leakage_event_count, type: integer, source: computed, default: 0, description: "Count of LeakageRecords attributed to this provider; incremented on each LeakageRecord creation" }
      - { name: watch_flag, type: boolean, source: computed, default: false, description: "True once leakage_event_count >= LEAKAGE_WATCH_COUNT (2); never auto-clears" }

  - name: SpecialistProvider
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Specialist full name" }
      - { name: npi, type: string, source: input, description: "National Provider Identifier; unique across both provider types (ERR_DUPLICATE_NPI)" }
      - { name: specialty, type: enum, source: input, description: "CARDIOLOGY | ORTHOPEDICS | NEUROLOGY | DERMATOLOGY | ENDOCRINOLOGY" }
      - { name: base_region, type: string, source: input, description: "Service region tag, matched case-sensitively to Patient.region" }
      - { name: weekly_capacity, type: integer, source: input, description: "Panel capacity used by panel_utilization; integer >= 1" }
      - { name: accepts_new_patients, type: boolean, source: input, default: true, description: "Eligibility filter for matching and booking" }
      - { name: accepts_urgent, type: boolean, source: input, default: false, description: "Required true to be eligible for STAT-urgency referrals" }
      - { name: booked_appointments_count, type: integer, source: computed, default: 0, description: "Count of this specialist's appointments in SCHEDULED or CONFIRMED status; maintained on book/cancel/no-show/complete/supersede" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED" }

  - name: InsurancePlan
    parent: null
    common_fields: true
    fields:
      - { name: plan_code, type: string, source: input, description: "Unique plan code (ERR_DUPLICATE_PLAN_CODE)" }
      - { name: payer_name, type: string, source: input, description: "Payer display name" }
      - { name: payer_mix_factor, type: number, source: input, description: "Reimbursement multiplier used by estimated_leakage_exposure; > 0" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED; RETIRED blocks new referrals/participations (ERR_PLAN_RETIRED), leaves existing rows valid" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: mrn, type: string, source: input, description: "Medical record number; unique (ERR_DUPLICATE_MRN)" }
      - { name: full_name, type: string, source: input, description: "Patient name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: region, type: string, source: input, description: "Patient region tag used by match ranking region bonus" }
      - { name: insurance_plan_id, type: string, source: input, description: "FK -> InsurancePlan.id; default plan for new referrals" }
      - { name: no_show_strikes, type: integer, source: computed, default: 0, description: "Count of this patient's appointments currently in NO_SHOW status (EXCUSED excluded)" }
      - { name: status, type: enum, source: computed, default: ACTIVE, description: "ACTIVE | OUTREACH_REQUIRED; flips to OUTREACH_REQUIRED when no_show_strikes >= NO_SHOW_STRIKE_LIMIT (3), back to ACTIVE when it falls below" }
      - { name: no_show_risk_confirmed, type: number, source: computed, default: 0, description: "Confirmed-only variant of no_show_risk_score" }
      - { name: no_show_risk_forward, type: number, source: computed, default: 0, description: "Forward-looking variant of no_show_risk_score" }

  - name: NetworkParticipation
    parent: null
    common_fields: true
    fields:
      - { name: specialist_id, type: string, source: input, description: "FK -> SpecialistProvider.id" }
      - { name: insurance_plan_id, type: string, source: input, description: "FK -> InsurancePlan.id" }
      - { name: tier, type: enum, source: input, description: "PREFERRED | STANDARD" }
      - { name: effective_from, type: string, source: input, description: "Inclusive ISO date; window start" }
      - { name: effective_to, type: string, source: input, description: "Inclusive ISO date; window end (must be >= effective_from, ERR_INVALID_WINDOW)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | TERMINATED; TERMINATED rows ignored by overlap and booking checks" }

  - name: PriorAuthRule
    parent: null
    common_fields: true
    fields:
      - { name: specialty, type: enum, source: input, description: "CARDIOLOGY | ORTHOPEDICS | NEUROLOGY | DERMATOLOGY | ENDOCRINOLOGY" }
      - { name: insurance_plan_id, type: string, source: input, description: "FK -> InsurancePlan.id" }
      - { name: requires_auth, type: boolean, source: input, description: "True => matching referrals require prior authorization before booking" }
      - { name: auth_validity_days, type: integer, source: input, description: "Days an obtained authorization stays ACTIVE; integer >= 1" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED; at most one ACTIVE row per (specialty, insurance_plan_id) pair (ERR_DUPLICATE_AUTH_RULE)" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: referring_provider_id, type: string, source: system, description: "FK -> ReferringProvider.id; set from X-User-ID at creation, never from payload" }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: specialty, type: enum, source: input, description: "CARDIOLOGY | ORTHOPEDICS | NEUROLOGY | DERMATOLOGY | ENDOCRINOLOGY" }
      - { name: diagnosis_code, type: string, source: input, description: "ICD-10 style code, free text" }
      - { name: urgency, type: enum, source: input, description: "STAT | URGENT | ROUTINE; drives SLA_DAYS mapping" }
      - { name: insurance_plan_id, type: string, source: input, description: "FK -> InsurancePlan.id; optional, defaults to patient's insurance_plan_id" , default: null }
      - { name: in_network_preference, type: boolean, source: input, default: true, description: "Documented in-network preference flag (analytics/documentation; the booking gate itself keys on participation + patient choice)" }
      - { name: patient_choice_documented, type: boolean, source: system, default: false, description: "Set by document-patient-choice action" }
      - { name: patient_choice_type, type: enum, source: system, default: NONE, description: "NONE | IN_NETWORK_PREFERRED | OUT_OF_NETWORK_PATIENT_REQUEST | OUT_OF_NETWORK_CAPACITY" }
      - { name: patient_choice_note, type: string, source: system, default: "", description: "Free-text note from document-patient-choice" }
      - { name: target_specialist_id, type: string, source: system, default: null, description: "FK -> SpecialistProvider.id; set by auto-match or assign-specialist; nullable" }
      - { name: match_score, type: integer, source: computed, default: null, description: "Winning score from specialty_match_ranking on last auto-match; null when manually assigned" }
      - { name: status, type: enum, source: system, default: PENDING_TRIAGE, description: "PENDING_TRIAGE | NEEDS_INFO | REJECTED | ACCEPTED | SCHEDULED | VISIT_COMPLETED | PENDING_VERIFICATION | CLOSED | EXPIRED | CANCELLED" }
      - { name: auth_status, type: enum, source: system, default: NOT_EVALUATED, description: "Parallel dimension: NOT_EVALUATED | NOT_REQUIRED | AUTH_REQUIRED | AUTH_PENDING | AUTH_OBTAINED | AUTH_DENIED | AUTH_EXPIRED" }
      - { name: triaged_at, type: datetime, source: system, default: null, description: "Clock timestamp of the accept transition" }
      - { name: sla_due_at, type: datetime, source: computed, default: null, description: "= triaged_at + SLA_DAYS[urgency]; null until accepted" }
      - { name: age_days, type: integer, source: computed, default: 0, description: "floor((now - created_at) / 86400) evaluated at read" }
      - { name: ever_scheduled, type: boolean, source: system, default: false, description: "Set true on first entry to SCHEDULED; never cleared; feeds scheduled-basis conversion denominator" }
      - { name: escalation_flag, type: boolean, source: computed, default: false, description: "Set true on patient's referrals in ACCEPTED/SCHEDULED when patient flips to OUTREACH_REQUIRED; cleared when patient returns to ACTIVE" }
      - { name: leaked, type: boolean, source: computed, default: false, description: "True once any LeakageRecord exists for this referral" }
      - { name: out_of_network, type: boolean, source: computed, default: false, description: "True when booked to a specialist without ACTIVE participation under a documented out-of-network choice" }
      - { name: cancel_reason, type: enum, source: system, default: null, description: "null | PATIENT_WENT_OUT_OF_NETWORK | PATIENT_DECLINED | CLINICAL_DUPLICATE | OTHER" }
      - { name: needs_info_note, type: string, source: system, default: "", description: "Last coordinator note from request-info" }

  - name: AuthorizationRecord
    parent: null
    common_fields: true
    fields:
      - { name: referral_id, type: string, source: system, description: "FK -> Referral.id" }
      - { name: auth_number, type: string, source: input, description: "Payer authorization number (required when outcome=OBTAINED)" }
      - { name: obtained_at, type: datetime, source: system, description: "Clock timestamp when outcome OBTAINED was recorded" }
      - { name: expires_on, type: datetime, source: computed, description: "= obtained_at + PriorAuthRule.auth_validity_days" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | EXPIRED | CONSUMED; EXPIRED via aging sweep when now >= expires_on; CONSUMED when the linked appointment completes" }

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: referral_id, type: string, source: system, description: "FK -> Referral.id" }
      - { name: specialist_id, type: string, source: system, description: "FK -> SpecialistProvider.id; from payload specialist_id or referral.target_specialist_id when omitted" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO8601 UTC; must be >= current clock (ERR_INVALID_WINDOW)" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO8601 UTC; must be > scheduled_start (ERR_INVALID_WINDOW)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | CONFIRMED | COMPLETED | NO_SHOW | EXCUSED | CANCELLED" }
      - { name: confirmation_channel, type: enum, source: system, default: null, description: "null | PHONE | PORTAL | LETTER; set on confirm" }
      - { name: confirmed_at, type: datetime, source: system, default: null, description: "Clock timestamp of confirmation" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Clock timestamp of completion" }
      - { name: superseded, type: boolean, source: system, default: false, description: "True when this appointment was auto-cancelled by a newer booking on the same referral" }
      - { name: excuse_reason, type: string, source: system, default: "", description: "Set by excuse transition" }
      - { name: scheduled_by_user_id, type: string, source: system, description: "X-User-ID of the coordinator who created this appointment; feeds SoD check on loop closure" }

  - name: ConsultNote
    parent: null
    common_fields: false
    fields:
      - { name: referral_id, type: string, source: system, description: "FK -> Referral.id (via appointment)" }
      - { name: appointment_id, type: string, source: system, description: "FK -> Appointment.id" }
      - { name: author_specialist_id, type: string, source: system, description: "FK -> SpecialistProvider.id; set from X-User-ID" }
      - { name: findings_summary, type: string, source: input, description: "Clinical findings free text" }
      - { name: follow_up_recommended, type: boolean, source: input, description: "Whether follow-up is recommended" }
      - { name: note_sequence, type: integer, source: computed, description: "1 + count of prior ConsultNotes on the same referral" }
      - { name: returned_within_sla, type: boolean, source: computed, description: "created_at <= appointment.completed_at + NOTE_RETURN_DAYS (14 days)" }

  - name: LoopClosure
    parent: null
    common_fields: false
    fields:
      - { name: referral_id, type: string, source: system, description: "FK -> Referral.id" }
      - { name: outcome, type: enum, source: input, description: "VERIFIED_CLOSED | REOPENED" }
      - { name: verification_note, type: string, source: input, description: "Auditor note" }
      - { name: verifier_user_id, type: string, source: system, description: "X-User-ID of the ComplianceAuditor" }

  - name: LeakageRecord
    parent: null
    common_fields: false
    fields:
      - { name: referral_id, type: string, source: system, description: "FK -> Referral.id" }
      - { name: category, type: enum, source: system, description: "EXPIRED_UNRESOLVED | PATIENT_CHOICE_OUT_OF_NETWORK | CAPACITY_OUT_OF_NETWORK" }
      - { name: attributed_referring_provider_id, type: string, source: system, description: "FK -> ReferringProvider.id; copied from referral at creation" }
      - { name: estimated_value_cents, type: integer, source: computed, description: "round_half_up(SPECIALTY_BASE_CENTS[referral.specialty] * plan.payer_mix_factor, 0) at creation" }

  - name: ProviderPeriodSnapshot
    parent: null
    common_fields: false
    fields:
      - { name: referring_provider_id, type: string, source: system, description: "FK -> ReferringProvider.id" }
      - { name: period_start, type: string, source: input, description: "Inclusive ISO date" }
      - { name: period_end, type: string, source: input, description: "Exclusive ISO date" }
      - { name: intake_count, type: integer, source: computed, description: "Referrals of provider with created_at in [period_start, period_end) and status != REJECTED, evaluated at close time" }
      - { name: completed_count, type: integer, source: computed, description: "Of intake set, referrals with >= 1 appointment in COMPLETED status" }
      - { name: scheduled_basis_count, type: integer, source: computed, description: "Of intake set, referrals with ever_scheduled = true" }
      - { name: leaked_count, type: integer, source: computed, description: "Of intake set, referrals with leaked = true" }
      - { name: conversion_rate_intake, type: number, source: computed, description: "completed_count / intake_count, 4dp round_half_up; 0.0000 when intake_count = 0" }
      - { name: conversion_rate_scheduled, type: number, source: computed, description: "completed_count / scheduled_basis_count, 4dp round_half_up; 0.0000 when scheduled_basis_count = 0" }
      - { name: leakage_rate, type: number, source: computed, description: "leaked_count / intake_count, 4dp round_half_up; 0.0000 when intake_count = 0" }
      - { name: estimated_leakage_exposure_cents, type: integer, source: computed, description: "Sum of LeakageRecord.estimated_value_cents over leaked referrals of the intake set (per-line rounding, then summed)" }
      - { name: closed_at, type: datetime, source: system, description: "Clock timestamp of period close" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Referral
    initial_state: PENDING_TRIAGE
    terminal_states: [REJECTED, CLOSED, EXPIRED, CANCELLED]
    transitions:
      - from: PENDING_TRIAGE
        to: NEEDS_INFO
        trigger: "POST /referrals/{id}/request-info"
        actor: ReferralCoordinator
        preconditions:
          - "Referral.status == PENDING_TRIAGE (ERR_INVALID_STATE)"
        side_effects:
          - "needs_info_note := payload.note; version += 1"

      - from: NEEDS_INFO
        to: PENDING_TRIAGE
        trigger: "POST /referrals/{id}/resubmit"
        actor: ReferringProvider
        preconditions:
          - "Referral.status == NEEDS_INFO (ERR_INVALID_STATE)"
          - "Acting provider owns referral (referral.referring_provider_id == X-User-ID, ERR_OWNERSHIP_VIOLATION)"
        side_effects:
          - "Apply provided field updates (diagnosis_code?, urgency?, in_network_preference?, insurance_plan_id?); version += 1"

      - from: PENDING_TRIAGE
        to: REJECTED
        trigger: "POST /referrals/{id}/reject"
        actor: ReferralCoordinator
        preconditions:
          - "Referral.status == PENDING_TRIAGE (ERR_INVALID_STATE)"
        side_effects:
          - "version += 1"

      - from: PENDING_TRIAGE
        to: ACCEPTED
        trigger: "POST /referrals/{id}/accept"
        actor: ReferralCoordinator
        preconditions:
          - "Referral.status == PENDING_TRIAGE (ERR_INVALID_STATE)"
        side_effects:
          - "triaged_at := clock now; sla_due_at := triaged_at + SLA_DAYS[urgency]"
          - "auth evaluation: if ACTIVE PriorAuthRule matches (specialty, insurance_plan_id) with requires_auth=true then auth_status := AUTH_REQUIRED else auth_status := NOT_REQUIRED"
          - "version += 1"

      - from: ACCEPTED
        to: SCHEDULED
        trigger: "POST /referrals/{id}/appointments (appointment created)"
        actor: ReferralCoordinator
        preconditions:
          - "Referral.status == ACCEPTED (a fresh booking) or SCHEDULED (a superseding booking) (ERR_INVALID_STATE)"
          - "auth_status in {NOT_REQUIRED, AUTH_OBTAINED}; when AUTH_OBTAINED, latest AuthorizationRecord for referral must have status ACTIVE (ERR_AUTH_NOT_SATISFIED)"
          - "Effective specialist (payload specialist_id else target_specialist_id) exists (ERR_SPECIALIST_NOT_FOUND), status == ACTIVE, accepts_new_patients == true, specialty == referral.specialty (ERR_SPECIALTY_MISMATCH)"
          - "If target_specialist_id set and payload supplies a different specialist_id (ERR_TARGET_MISMATCH)"
          - "Participation gate: an ACTIVE NetworkParticipation exists for (specialist, referral.insurance_plan_id) with effective_from <= current date <= effective_to; otherwise booking requires patient_choice_documented == true and patient_choice_type in {OUT_OF_NETWORK_PATIENT_REQUEST, OUT_OF_NETWORK_CAPACITY} (ERR_NO_ACTIVE_PARTICIPATION)"
          - "Overlap gate: no other appointment of the same specialist in {SCHEDULED, CONFIRMED} whose occupied interval [scheduled_start, scheduled_end + BUFFER_MINUTES(15m)) intersects [new.scheduled_start, new.scheduled_end + 15m) (ERR_APPOINTMENT_OVERLAP); adjacency where new.start >= existing.end + 15m is allowed"
        side_effects:
          - "If an existing appointment of this referral is in {SCHEDULED, CONFIRMED}: it transitions to CANCELLED with superseded := true and specialist.booked_appointments_count -= 1"
          - "Create Appointment (status SCHEDULED, scheduled_by_user_id := X-User-ID); specialist.booked_appointments_count += 1"
          - "Referral.status := SCHEDULED; ever_scheduled := true"
          - "If participation gate was bypassed via documented out-of-network choice: out_of_network := true; create LeakageRecord(category := PATIENT_CHOICE_OUT_OF_NETWORK when patient_choice_type == OUT_OF_NETWORK_PATIENT_REQUEST else CAPACITY_OUT_OF_NETWORK); leaked := true; attributed provider.leakage_event_count += 1 and watch_flag recomputed (>= 2 => true)"
          - "version += 1"

      - from: SCHEDULED
        to: ACCEPTED
        trigger: "system (last active appointment becomes terminal: cancelled / no-show / excused, with no remaining appointment in {SCHEDULED, CONFIRMED})"
        actor: system
        preconditions:
          - "Referral.status == SCHEDULED and no appointment of this referral remains in {SCHEDULED, CONFIRMED}"
        side_effects:
          - "version += 1"

      - from: SCHEDULED
        to: VISIT_COMPLETED
        trigger: "system (appointment CONFIRMED -> COMPLETED via POST /appointments/{id}/complete)"
        actor: system
        preconditions:
          - "The completing appointment belongs to this referral"
        side_effects:
          - "If auth_status == AUTH_OBTAINED: latest AuthorizationRecord status := CONSUMED"
          - "version += 1"

      - from: VISIT_COMPLETED
        to: PENDING_VERIFICATION
        trigger: "system (ConsultNote submitted via POST /appointments/{id}/consult-note)"
        actor: system
        preconditions:
          - "Referral.status == VISIT_COMPLETED"
        side_effects:
          - "version += 1"

      - from: PENDING_VERIFICATION
        to: CLOSED
        trigger: "POST /referrals/{id}/loop-closures with outcome VERIFIED_CLOSED"
        actor: ComplianceAuditor
        preconditions:
          - "Referral.status == PENDING_VERIFICATION (ERR_INVALID_STATE)"
          - "SoD: X-User-ID != scheduled_by_user_id of the referral's latest COMPLETED appointment (ERR_SOD_CONFLICT)"
          - "expected_referral_version matches referral.version (ERR_STALE_VERSION)"
        side_effects:
          - "Create LoopClosure(outcome=VERIFIED_CLOSED, verifier_user_id := X-User-ID); version += 1"

      - from: PENDING_VERIFICATION
        to: VISIT_COMPLETED
        trigger: "POST /referrals/{id}/loop-closures with outcome REOPENED"
        actor: ComplianceAuditor
        preconditions:
          - "Referral.status == PENDING_VERIFICATION (ERR_INVALID_STATE)"
          - "SoD: X-User-ID != scheduled_by_user_id of the referral's latest COMPLETED appointment (ERR_SOD_CONFLICT)"
          - "expected_referral_version matches referral.version (ERR_STALE_VERSION)"
        side_effects:
          - "Create LoopClosure(outcome=REOPENED); version += 1"

      - from: PENDING_TRIAGE
        to: CANCELLED
        trigger: "POST /referrals/{id}/cancel"
        actor: ReferringProvider | ReferralCoordinator
        preconditions:
          - "Referral.status in {PENDING_TRIAGE, NEEDS_INFO, ACCEPTED, SCHEDULED, VISIT_COMPLETED, PENDING_VERIFICATION} (ERR_INVALID_STATE)"
          - "ReferringProvider actor must own referral (ERR_OWNERSHIP_VIOLATION)"
        side_effects:
          - "cancel_reason := payload.reason"
          - "Cascade: any appointment in {SCHEDULED, CONFIRMED} -> CANCELLED; its specialist.booked_appointments_count -= 1"
          - "If reason == PATIENT_WENT_OUT_OF_NETWORK and leaked == false: create LeakageRecord(category=PATIENT_CHOICE_OUT_OF_NETWORK); leaked := true; provider.leakage_event_count += 1; watch_flag recomputed"
          - "version += 1"
      - from: NEEDS_INFO
        to: CANCELLED
        trigger: "POST /referrals/{id}/cancel"
        actor: ReferringProvider | ReferralCoordinator
        preconditions: ["same as PENDING_TRIAGE -> CANCELLED"]
        side_effects: ["same as PENDING_TRIAGE -> CANCELLED"]
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /referrals/{id}/cancel"
        actor: ReferringProvider | ReferralCoordinator
        preconditions: ["same as PENDING_TRIAGE -> CANCELLED"]
        side_effects: ["same as PENDING_TRIAGE -> CANCELLED"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /referrals/{id}/cancel"
        actor: ReferringProvider | ReferralCoordinator
        preconditions: ["same as PENDING_TRIAGE -> CANCELLED"]
        side_effects: ["same as PENDING_TRIAGE -> CANCELLED"]
      - from: VISIT_COMPLETED
        to: CANCELLED
        trigger: "POST /referrals/{id}/cancel"
        actor: ReferringProvider | ReferralCoordinator
        preconditions: ["same as PENDING_TRIAGE -> CANCELLED"]
        side_effects: ["same as PENDING_TRIAGE -> CANCELLED (no active appointment to cascade)"]
      - from: PENDING_VERIFICATION
        to: CANCELLED
        trigger: "POST /referrals/{id}/cancel"
        actor: ReferringProvider | ReferralCoordinator
        preconditions: ["same as PENDING_TRIAGE -> CANCELLED"]
        side_effects: ["same as PENDING_TRIAGE -> CANCELLED (no active appointment to cascade)"]

      - from: ACCEPTED
        to: EXPIRED
        trigger: "system (POST /referrals/aging-sweep; now >= sla_due_at)"
        actor: system
        preconditions:
          - "Referral.status in {ACCEPTED, SCHEDULED, VISIT_COMPLETED, PENDING_VERIFICATION} and now >= sla_due_at"
        side_effects:
          - "Create LeakageRecord(category=EXPIRED_UNRESOLVED); leaked := true; provider.leakage_event_count += 1; watch_flag recomputed (>= 2 => true)"
          - "Cascade: any appointment in {SCHEDULED, CONFIRMED} -> CANCELLED; its specialist.booked_appointments_count -= 1"
          - "version += 1; sweep processes qualifying referrals in created_at ASC order"
      - from: SCHEDULED
        to: EXPIRED
        trigger: "system (POST /referrals/aging-sweep)"
        actor: system
        preconditions: ["same as ACCEPTED -> EXPIRED"]
        side_effects: ["same as ACCEPTED -> EXPIRED"]
      - from: VISIT_COMPLETED
        to: EXPIRED
        trigger: "system (POST /referrals/aging-sweep)"
        actor: system
        preconditions: ["same as ACCEPTED -> EXPIRED"]
        side_effects: ["same as ACCEPTED -> EXPIRED (no active appointment to cascade)"]
      - from: PENDING_VERIFICATION
        to: EXPIRED
        trigger: "system (POST /referrals/aging-sweep)"
        actor: system
        preconditions: ["same as ACCEPTED -> EXPIRED"]
        side_effects: ["same as ACCEPTED -> EXPIRED (no active appointment to cascade)"]

  - entity: ReferralAuthStatus
    note: "Parallel state dimension carried on Referral.auth_status; evolves independently of Referral.status"
    initial_state: NOT_EVALUATED
    terminal_states: []
    transitions:
      - from: NOT_EVALUATED
        to: NOT_REQUIRED
        trigger: "system (during accept transition: no ACTIVE PriorAuthRule with requires_auth=true matches (specialty, insurance_plan_id))"
        actor: system
        preconditions: ["Referral being accepted"]
        side_effects: []
      - from: NOT_EVALUATED
        to: AUTH_REQUIRED
        trigger: "system (during accept transition: matching ACTIVE PriorAuthRule with requires_auth=true exists)"
        actor: system
        preconditions: ["Referral being accepted"]
        side_effects: []
      - from: AUTH_REQUIRED
        to: AUTH_PENDING
        trigger: "POST /referrals/{id}/auth/submit"
        actor: ReferralCoordinator
        preconditions:
          - "Referral.auth_status in {AUTH_REQUIRED, AUTH_DENIED, AUTH_EXPIRED} (ERR_INVALID_STATE)"
          - "Referral.status in {ACCEPTED, SCHEDULED} (ERR_INVALID_STATE)"
        side_effects: ["version += 1"]
      - from: AUTH_DENIED
        to: AUTH_PENDING
        trigger: "POST /referrals/{id}/auth/submit"
        actor: ReferralCoordinator
        preconditions: ["same as AUTH_REQUIRED -> AUTH_PENDING"]
        side_effects: ["version += 1"]
      - from: AUTH_EXPIRED
        to: AUTH_PENDING
        trigger: "POST /referrals/{id}/auth/submit"
        actor: ReferralCoordinator
        preconditions: ["same as AUTH_REQUIRED -> AUTH_PENDING"]
        side_effects: ["version += 1"]
      - from: AUTH_PENDING
        to: AUTH_OBTAINED
        trigger: "POST /referrals/{id}/auth/record-outcome with outcome=OBTAINED"
        actor: ReferralCoordinator
        preconditions:
          - "Referral.auth_status == AUTH_PENDING (ERR_INVALID_STATE)"
          - "payload.auth_number present and non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "Create AuthorizationRecord(auth_number, obtained_at := clock now, expires_on := obtained_at + rule.auth_validity_days, status ACTIVE)"
          - "version += 1"
      - from: AUTH_PENDING
        to: AUTH_DENIED
        trigger: "POST /referrals/{id}/auth/record-outcome with outcome=DENIED"
        actor: ReferralCoordinator
        preconditions:
          - "Referral.auth_status == AUTH_PENDING (ERR_INVALID_STATE)"
        side_effects: ["version += 1"]
      - from: AUTH_OBTAINED
        to: AUTH_EXPIRED
        trigger: "system (POST /referrals/aging-sweep: latest AuthorizationRecord ACTIVE and now >= expires_on)"
        actor: system
        preconditions:
          - "Referral.auth_status == AUTH_OBTAINED and referral.status in {ACCEPTED, SCHEDULED} and latest AuthorizationRecord.status == ACTIVE and now >= expires_on"
        side_effects:
          - "AuthorizationRecord.status := EXPIRED; version += 1"

  - entity: Appointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, EXCUSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /appointments/{id}/confirm"
        actor: ReferralCoordinator
        preconditions:
          - "Appointment.status == SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "confirmation_channel := payload.confirmation_channel; confirmed_at := clock now; version += 1"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /appointments/{id}/complete"
        actor: SpecialistProvider
        preconditions:
          - "Appointment.status == CONFIRMED (ERR_NOT_CONFIRMED)"
          - "Acting specialist owns appointment (appointment.specialist_id == X-User-ID, ERR_OWNERSHIP_VIOLATION)"
          - "now >= scheduled_start (ERR_COMPLETE_TOO_EARLY)"
        side_effects:
          - "completed_at := clock now; specialist.booked_appointments_count -= 1"
          - "Referral SCHEDULED -> VISIT_COMPLETED; if referral.auth_status == AUTH_OBTAINED then latest AuthorizationRecord -> CONSUMED"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /appointments/{id}/mark-no-show"
        actor: ReferralCoordinator
        preconditions:
          - "Appointment.status in {SCHEDULED, CONFIRMED} (ERR_INVALID_STATE)"
          - "now >= scheduled_start + GRACE_MINUTES (15) (ERR_NO_SHOW_TOO_EARLY)"
        side_effects:
          - "specialist.booked_appointments_count -= 1"
          - "Patient.no_show_strikes += 1 (link 1)"
          - "If patient.no_show_strikes crosses to >= NO_SHOW_STRIKE_LIMIT (3): Patient.status := OUTREACH_REQUIRED (link 2)"
          - "On Patient -> OUTREACH_REQUIRED: every Referral of that patient in {ACCEPTED, SCHEDULED} gets escalation_flag := true (link 3)"
          - "If no sibling appointment of the referral remains in {SCHEDULED, CONFIRMED}: Referral SCHEDULED -> ACCEPTED"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /appointments/{id}/mark-no-show"
        actor: ReferralCoordinator
        preconditions: ["same as SCHEDULED -> NO_SHOW"]
        side_effects: ["same as SCHEDULED -> NO_SHOW"]
      - from: NO_SHOW
        to: EXCUSED
        trigger: "POST /appointments/{id}/excuse"
        actor: ReferralCoordinator
        preconditions:
          - "Appointment.status == NO_SHOW (ERR_INVALID_STATE)"
        side_effects:
          - "excuse_reason := payload.reason"
          - "Patient.no_show_strikes -= 1"
          - "If patient.no_show_strikes falls below NO_SHOW_STRIKE_LIMIT (3) and Patient.status == OUTREACH_REQUIRED: Patient.status := ACTIVE and escalation_flag cleared on that patient's referrals where escalation_flag == true"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel OR supersede on rebooking OR referral cancel/expiry cascade"
        actor: ReferralCoordinator | system
        preconditions:
          - "Appointment.status in {SCHEDULED, CONFIRMED} (ERR_INVALID_STATE)"
        side_effects:
          - "specialist.booked_appointments_count -= 1"
          - "If direct cancel (not supersede/referral-cascade) and no sibling appointment remains in {SCHEDULED, CONFIRMED} and referral.status == SCHEDULED: Referral SCHEDULED -> ACCEPTED"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel OR supersede OR referral cascade"
        actor: ReferralCoordinator | system
        preconditions: ["same as SCHEDULED -> CANCELLED"]
        side_effects: ["same as SCHEDULED -> CANCELLED"]

  - entity: SpecialistProvider
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /specialty-providers/{id}/suspend"
        actor: NetworkAdmin
        preconditions: ["status == ACTIVE (ERR_INVALID_STATE)"]
        side_effects: ["version += 1; specialist becomes ineligible for matching and booking"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /specialty-providers/{id}/reactivate"
        actor: NetworkAdmin
        preconditions: ["status == SUSPENDED (ERR_INVALID_STATE)"]
        side_effects: ["version += 1"]

  - entity: Patient
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: OUTREACH_REQUIRED
        trigger: "system (no_show_strikes increments to >= NO_SHOW_STRIKE_LIMIT (3))"
        actor: system
        preconditions: ["strikes crossing upward across 3"]
        side_effects: ["escalation_flag := true on patient's referrals in {ACCEPTED, SCHEDULED}"]
      - from: OUTREACH_REQUIRED
        to: ACTIVE
        trigger: "system (no_show_strikes decrements below NO_SHOW_STRIKE_LIMIT (3) via excuse)"
        actor: system
        preconditions: ["strikes crossing downward below 3"]
        side_effects: ["escalation_flag := false on patient's referrals where escalation_flag == true"]

  - entity: NetworkParticipation
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /network-participations/{id}/terminate"
        actor: NetworkAdmin
        preconditions: ["status == ACTIVE (ERR_INVALID_STATE)"]
        side_effects: ["version += 1; row excluded from overlap checks and booking gate"]

  - entity: InsurancePlan
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /insurance-plans/{id}/retire"
        actor: NetworkAdmin
        preconditions: ["status == ACTIVE (ERR_INVALID_STATE)"]
        side_effects: ["version += 1; new referrals/participations/auth-rules on this plan rejected (ERR_PLAN_RETIRED); existing rows unaffected"]

  - entity: PriorAuthRule
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /prior-auth-rules/{id}/retire"
        actor: NetworkAdmin
        preconditions: ["status == ACTIVE (ERR_INVALID_STATE)"]
        side_effects: ["version += 1; pair uniqueness slot freed"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: appointment-booking-stale-referral
    parent_entity: Referral
    write_endpoint: "POST /referrals/{id}/appointments"
    occ_field: expected_referral_version
    description: |
      Booking an appointment against a Referral whose version has advanced since
      the client last observed it is rejected. A successful booking legitimately
      supersedes any active appointment (auto-cancelling it), so a writer holding
      a stale view of the referral must re-read before booking.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: loop-closure-stale-referral
    parent_entity: Referral
    write_endpoint: "POST /referrals/{id}/loop-closures"
    occ_field: expected_referral_version
    description: |
      Verifying or reopening loop closure against a Referral whose version has
      advanced since the auditor last observed it is rejected, because the
      clinical state under review (new consult note, reopened loop) may have
      changed since the auditor's read.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: referral_sla_and_aging
    trigger: "referral accept (sets sla_due_at); aging sweep (evaluates expiry); every referral read (age_days)"
    algorithm: threshold
    formula: |
      SLA_DAYS = {STAT: 2, URGENT: 7, ROUTINE: 30}
      On accept: sla_due_at = triaged_at + SLA_DAYS[urgency]  (exact second arithmetic)
      Expiry condition (aging sweep): status IN {ACCEPTED, SCHEDULED, VISIT_COMPLETED, PENDING_VERIFICATION}
                                      AND now >= sla_due_at        # boundary is INCLUSIVE: now == sla_due_at expires
      age_days = floor((now - created_at) / 86400)                 # calendar days, UTC
    input_set: "Referrals in {ACCEPTED, SCHEDULED, VISIT_COMPLETED, PENDING_VERIFICATION}; sweep processes in created_at ASC order"
    constants:
      SLA_STAT_DAYS: 2
      SLA_URGENT_DAYS: 7
      SLA_ROUTINE_DAYS: 30
    precision: "timestamps to the second; age_days integer floor"

  - name: auth_validity_window
    trigger: "auth record-outcome OBTAINED (sets expires_on); aging sweep (evaluates expiry)"
    algorithm: threshold
    formula: |
      expires_on = obtained_at + rule.auth_validity_days (days, exact second arithmetic)
      Expiry condition: AuthorizationRecord.status == ACTIVE AND now >= expires_on  # INCLUSIVE boundary
    input_set: "AuthorizationRecords with status ACTIVE whose referral.auth_status == AUTH_OBTAINED and referral.status IN {ACCEPTED, SCHEDULED}"
    constants: {}
    precision: "timestamps to the second"

  - name: specialty_match_ranking
    trigger: "POST /referrals/{id}/auto-match"
    algorithm: weighted_scoring
    formula: |
      Eligibility filter (candidate pool):
        specialist.specialty == referral.specialty
        AND specialist.status == ACTIVE
        AND specialist.accepts_new_patients == true
        AND (referral.urgency != STAT OR specialist.accepts_urgent == true)
        AND EXISTS ACTIVE NetworkParticipation for (specialist.id, referral.insurance_plan_id)
             with effective_from <= current date <= effective_to
      Ranking score per candidate (integer, clamped to [0, 100]):
        score = 50
        score += 25 if participation.tier == PREFERRED else 10   # STANDARD
        score -= 15 if panel_utilization(specialist) >= 0.8       # booked_appointments_count / weekly_capacity
        score += 20 if referral.urgency == STAT else (10 if URGENT else 0)
        score += 5  if specialist.base_region == patient.region
        score = min(100, max(0, score))
      Selection: score DESC; tie-break specialist.created_at ASC (earliest created wins).
      Empty pool fallback: reject with ERR_NO_ELIGIBLE_SPECIALIST (422); referral unchanged.
      On success: referral.target_specialist_id := winner.id; match_score := winner score.
    input_set: "All SpecialistProvider rows; participation and utilization evaluated at call time"
    constants:
      BASE_SCORE: 50
      PREFERRED_BONUS: 25
      STANDARD_BONUS: 10
      UTILIZATION_PENALTY: -15
      UTILIZATION_THRESHOLD: 0.8
      STAT_BONUS: 20
      URGENT_BONUS: 10
      REGION_BONUS: 5
    precision: "integer score; utilization compared as exact rational booked/weekly_capacity >= 0.8"

  - name: panel_utilization
    trigger: "evaluated inside specialty_match_ranking; booked_appointments_count maintained on every appointment book/cancel/no-show/complete/supersede"
    algorithm: aggregation
    formula: |
      booked_appointments_count = COUNT(appointments of specialist with status IN {SCHEDULED, CONFIRMED})
      utilization = booked_appointments_count / weekly_capacity
      Penalty applies when utilization >= 0.8 (INCLUSIVE: exactly 0.8 penalizes).
    input_set: "Appointments of the specialist in {SCHEDULED, CONFIRMED}"
    constants:
      UTILIZATION_THRESHOLD: 0.8
    precision: "exact rational comparison; no rounding"

  - name: no_show_risk_score
    trigger: "recomputed on Patient read and after any appointment mark-no-show / excuse / (de)confirmation affecting overdue set"
    algorithm: weighted_scoring
    formula: |
      strikes = COUNT(appointments of patient with status == NO_SHOW)
      overdue_unconfirmed = COUNT(appointments of patient with status == SCHEDULED
                                  AND now >= scheduled_start + OVERDUE_HOURS (24h))   # INCLUSIVE boundary
      confirmed_only variant:   score = min(100, STRIKE_WEIGHT * strikes)
      forward_looking variant:  score = min(100, STRIKE_WEIGHT * (strikes + OVERDUE_WEIGHT * overdue_unconfirmed))
      OVERDUE_WEIGHT is applied per overdue appointment; result may be non-integer before cap; cap at 100.
      Patient read exposes no_show_risk_confirmed (confirmed_only) and no_show_risk_forward (forward_looking).
    input_set: "Appointments whose referral.patient_id == patient.id"
    constants:
      STRIKE_WEIGHT: 25
      OVERDUE_WEIGHT: 0.5
      OVERDUE_HOURS: 24
      RISK_CAP: 100
    precision: "forward variant in 0.5 steps (12.5 granularity); integers when overdue count is even"
    variants:
      - name: confirmed_only
        when: "exposed as no_show_risk_confirmed; used by strike-threshold posture"
        difference: "counts only appointments already marked NO_SHOW"
      - name: forward_looking
        when: "exposed as no_show_risk_forward"
        difference: "adds 0.5 weight per overdue-unconfirmed SCHEDULED appointment (start + 24h <= now), so identical data yields a higher score whenever such appointments exist"

  - name: strike_threshold_posture
    trigger: "patient.no_show_strikes change (mark-no-show +1, excuse -1)"
    algorithm: threshold
    formula: |
      if no_show_strikes >= NO_SHOW_STRIKE_LIMIT: patient.status = OUTREACH_REQUIRED
      else: patient.status = ACTIVE
      INCLUSIVE boundary: strikes == 3 flips to OUTREACH_REQUIRED; dropping to 2 flips back.
    input_set: "Appointments of the patient with status == NO_SHOW"
    constants:
      NO_SHOW_STRIKE_LIMIT: 3
    precision: "integer comparison"

  - name: conversion_rate
    trigger: "POST /analytics/periods/close (snapshot) and GET /referring-providers/{id}/leakage-report (live, basis param selects variant)"
    algorithm: aggregation
    formula: |
      intake_set = referrals of provider with created_at IN [period_start, period_end) AND status != REJECTED
                   (statuses evaluated at computation time; live report uses all-time window)
      completed_count = |{r in intake_set : EXISTS appointment of r with status == COMPLETED}|
      scheduled_basis_count = |{r in intake_set : r.ever_scheduled == true}|
      intake_basis:     rate = completed_count / intake_count            (0.0000 if intake_count == 0)
      scheduled_basis:  rate = completed_count / scheduled_basis_count   (0.0000 if scheduled_basis_count == 0)
    input_set: "intake_set as pinned above; half-open window [period_start, period_end): created_at >= period_start AND created_at < period_end"
    constants: {}
    precision: "4 decimal places, round_half_up"
    variants:
      - name: intake_basis
        when: "ProviderPeriodSnapshot.conversion_rate_intake; live report when basis=INTAKE"
        difference: "denominator is all non-REJECTED referrals created in the window"
      - name: scheduled_basis
        when: "ProviderPeriodSnapshot.conversion_rate_scheduled; live report when basis=SCHEDULED"
        difference: "denominator shrinks to referrals with ever_scheduled=true, so for identical data the rate is >= intake_basis and strictly greater whenever any intake referral never reached SCHEDULED"

  - name: leakage_rate
    trigger: "POST /analytics/periods/close and GET /referring-providers/{id}/leakage-report"
    algorithm: aggregation
    formula: |
      leaked_count = |{r in intake_set : r.leaked == true}|
      leakage_rate = leaked_count / intake_count   (0.0000 if intake_count == 0)
    input_set: "same intake_set as conversion_rate"
    constants: {}
    precision: "4 decimal places, round_half_up"

  - name: estimated_leakage_exposure
    trigger: "LeakageRecord creation (per-line value) and POST /analytics/periods/close (snapshot sum)"
    algorithm: aggregation
    formula: |
      Per LeakageRecord line (computed at record creation, then frozen):
        line_cents = round_half_up(SPECIALTY_BASE_CENTS[referral.specialty] * plan.payer_mix_factor, 0)
      Snapshot exposure:
        exposure_cents = SUM(line_cents over LeakageRecords of leaked referrals in the intake set)
      ROUNDING ORDER IS PINNED: round per line FIRST, then sum integers.
      (Sum-then-round of raw products is a valid alternative interpretation and yields
       different cents; it is NOT the implemented order.)
    input_set: "LeakageRecords whose referral belongs to the provider intake set"
    constants:
      SPECIALTY_BASE_CENTS_CARDIOLOGY: 42000
      SPECIALTY_BASE_CENTS_ORTHOPEDICS: 33500
      SPECIALTY_BASE_CENTS_NEUROLOGY: 50000
      SPECIALTY_BASE_CENTS_DERMATOLOGY: 18000
      SPECIALTY_BASE_CENTS_ENDOCRINOLOGY: 26000
    precision: "integer cents; round_half_up per line"

  - name: provider_watch_flag
    trigger: "LeakageRecord creation (provider.leakage_event_count increment)"
    algorithm: threshold
    formula: |
      watch_flag = (leakage_event_count >= LEAKAGE_WATCH_COUNT)   # INCLUSIVE: 2 events set the flag
      watch_flag never auto-clears (no decrement path exists).
    input_set: "All LeakageRecords attributed to the provider"
    constants:
      LEAKAGE_WATCH_COUNT: 2
    precision: "integer comparison"

  - name: period_close_aggregation
    trigger: "POST /analytics/periods/close"
    algorithm: chronological
    formula: |
      Preconditions: period_end > period_start (ERR_INVALID_PERIOD);
                     current date >= period_end (ERR_PERIOD_NOT_ENDED);
                     no existing ProviderPeriodSnapshot with same (period_start, period_end) (ERR_PERIOD_ALREADY_CLOSED).
      Providers processed in created_at ASC order; for each ReferringProvider whose intake_set
      (per conversion_rate definition) is non-empty, create one ProviderPeriodSnapshot with all
      computed fields per conversion_rate / leakage_rate / estimated_leakage_exposure.
    input_set: "ReferringProviders with >= 1 referral created in [period_start, period_end) with status != REJECTED"
    constants: {}
    precision: "deterministic provider order: created_at ASC"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles list"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "Ownership scoping: ReferringProvider may only access referrals where referring_provider_id == X-User-ID (and own leakage-report/snapshots); SpecialistProvider may only complete/note appointments where specialist_id == X-User-ID"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "ownership-scoped endpoints (referral resubmit/cancel/read as provider, appointment complete/consult-note as specialist, leakage-report as provider)"
  - priority: 4
    category: existence
    check: "Request shape: required fields present, types valid, enum members valid, datetime/date formats valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 5
    category: existence
    check: "Path resource ids exist, validated left-to-right; then body FK references exist in declared input order"
    error_id: "ERR_REFERRAL_NOT_FOUND | ERR_PATIENT_NOT_FOUND | ERR_SPECIALIST_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_PARTICIPATION_NOT_FOUND | ERR_AUTH_RULE_NOT_FOUND | ERR_APPOINTMENT_NOT_FOUND | ERR_PROVIDER_NOT_FOUND | ERR_CONSULT_NOTE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids or body FKs"
  - priority: 6
    category: state
    check: "OCC: expected_referral_version (when endpoint requires it) equals current referral.version; checked after existence, before any state or business rule"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /referrals/{id}/appointments, POST /referrals/{id}/loop-closures"
  - priority: 7
    category: state
    check: "State preconditions of the invoked transition (e.g., accept requires PENDING_TRIAGE; confirm requires SCHEDULED; complete requires CONFIRMED via ERR_NOT_CONFIRMED; booking requires auth_status in {NOT_REQUIRED, AUTH_OBTAINED-with-ACTIVE-record} via ERR_AUTH_NOT_SATISFIED)"
    error_id: "ERR_INVALID_STATE | ERR_NOT_CONFIRMED | ERR_AUTH_NOT_SATISFIED"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 8
    category: business_safety
    check: "Referring provider not SUSPENDED on referral creation; plan not RETIRED on referral/participation/auth-rule creation; SoD: loop-closure verifier != scheduled_by_user_id of latest COMPLETED appointment"
    error_id: "ERR_PROVIDER_SUSPENDED | ERR_PLAN_RETIRED | ERR_SOD_CONFLICT"
    http_status: 403
    applies_to: "POST /referrals, POST /network-participations, POST /prior-auth-rules, POST /referrals/{id}/loop-closures"
    note: "ERR_PROVIDER_SUSPENDED and ERR_SOD_CONFLICT return 403; ERR_PLAN_RETIRED returns 409"
  - priority: 9
    category: business_referential
    check: "Booking/assign specialty consistency: specialist.specialty == referral.specialty; payload specialist_id must equal target_specialist_id when target is set"
    error_id: "ERR_SPECIALTY_MISMATCH | ERR_TARGET_MISMATCH"
    http_status: 422
    applies_to: "POST /referrals/{id}/assign-specialist, POST /referrals/{id}/appointments"
  - priority: 10
    category: business_constraint
    check: "Uniqueness and selector fallback: mrn unique; npi unique across provider types; plan_code unique; at most one ACTIVE PriorAuthRule per (specialty, plan); auto-match pool non-empty"
    error_id: "ERR_DUPLICATE_MRN | ERR_DUPLICATE_NPI | ERR_DUPLICATE_PLAN_CODE | ERR_DUPLICATE_AUTH_RULE | ERR_NO_ELIGIBLE_SPECIALIST"
    http_status: 409
    applies_to: "creation endpoints, POST /referrals/{id}/auto-match"
    note: "ERR_NO_ELIGIBLE_SPECIALIST returns 422; duplicate errors return 409"
  - priority: 11
    category: business_temporal
    check: "Temporal rules: scheduled_end > scheduled_start and scheduled_start >= now; effective_to >= effective_from; participation window overlap (inclusive dates, ACTIVE rows only); appointment overlap (half-open + 15m buffer); no-show grace; complete-too-early; period close window/order rules"
    error_id: "ERR_INVALID_WINDOW | ERR_PARTICIPATION_WINDOW_OVERLAP | ERR_APPOINTMENT_OVERLAP | ERR_NO_SHOW_TOO_EARLY | ERR_COMPLETE_TOO_EARLY | ERR_INVALID_PERIOD | ERR_PERIOD_NOT_ENDED | ERR_PERIOD_ALREADY_CLOSED"
    http_status: 400
    applies_to: "booking, participation creation, confirm/complete/no-show, period close"
    note: "ERR_INVALID_WINDOW/ERR_INVALID_PERIOD return 400; overlaps and period state errors return 409; too-early errors return 422; ERR_PERIOD_ALREADY_CLOSED 409. Sub-order inside this priority: window-shape errors before overlap errors before threshold/grace errors."

# =============================================================================
# Table 5 prelude: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time."
    roles: [NetworkAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["logical clock advanced; no entity mutation"]

  # --- Referring providers ---
  - method: POST
    path: "/referring-providers"
    description: "Create a referring provider"
    roles: [NetworkAdmin]
    code: 201
    input: [name, npi, specialty]
    output: ReferringProvider
    side_effects: []
  - method: GET
    path: "/referring-providers"
    description: "List referring providers"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor, ReferringProvider, SpecialistProvider]
    code: 200
    input: ["status?", "specialty?", "limit?", "offset?"]
    output: "ReferringProvider[]"
    side_effects: []
  - method: GET
    path: "/referring-providers/{id}"
    description: "Get one referring provider"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor, ReferringProvider, SpecialistProvider]
    code: 200
    input: []
    output: ReferringProvider
    side_effects: []
  - method: POST
    path: "/referring-providers/{id}/suspend"
    description: "Suspend a referring provider (blocks new referral creation)"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: ReferringProvider
    side_effects: ["status := SUSPENDED; version += 1"]
  - method: POST
    path: "/referring-providers/{id}/reactivate"
    description: "Reactivate a suspended referring provider"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: ReferringProvider
    side_effects: ["status := ACTIVE; version += 1"]
  - method: GET
    path: "/referring-providers/{id}/referrals"
    description: "List referrals created by this provider"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor, ReferringProvider, SpecialistProvider]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Referral[]"
    side_effects: []
  - method: GET
    path: "/referring-providers/{id}/leakage-records"
    description: "List leakage records attributed to this provider"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor, ReferringProvider]
    code: 200
    input: ["category?", "limit?", "offset?"]
    output: "LeakageRecord[]"
    side_effects: []
  - method: GET
    path: "/referring-providers/{id}/leakage-snapshots"
    description: "List closed period snapshots for this provider"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor, ReferringProvider]
    code: 200
    input: ["limit?", "offset?"]
    output: "ProviderPeriodSnapshot[]"
    side_effects: []
  - method: GET
    path: "/referring-providers/{id}/leakage-report"
    description: "Live all-time analytics read for this provider (not period-bound). ReferringProvider role may only read own id (ERR_OWNERSHIP_VIOLATION)."
    roles: [NetworkAdmin, ReferralCoordinator, ReferringProvider]
    code: 200
    input: ["basis?"]
    output: { basis: string, intake_count: integer, completed_count: integer, leaked_count: integer, conversion_rate: number, leakage_rate: number, estimated_leakage_exposure_cents: integer }
    side_effects: []

  # --- Specialist providers ---
  - method: POST
    path: "/specialty-providers"
    description: "Create a specialist"
    roles: [NetworkAdmin]
    code: 201
    input: [name, npi, specialty, base_region, weekly_capacity, "accepts_new_patients?", "accepts_urgent?"]
    output: SpecialistProvider
    side_effects: []
  - method: GET
    path: "/specialty-providers"
    description: "List specialists"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor, ReferringProvider, SpecialistProvider]
    code: 200
    input: ["specialty?", "status?", "limit?", "offset?"]
    output: "SpecialistProvider[]"
    side_effects: []
  - method: GET
    path: "/specialty-providers/{id}"
    description: "Get one specialist"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor, ReferringProvider, SpecialistProvider]
    code: 200
    input: []
    output: SpecialistProvider
    side_effects: []
  - method: POST
    path: "/specialty-providers/{id}/suspend"
    description: "Suspend a specialist"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: SpecialistProvider
    side_effects: ["status := SUSPENDED; version += 1"]
  - method: POST
    path: "/specialty-providers/{id}/reactivate"
    description: "Reactivate a specialist"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: SpecialistProvider
    side_effects: ["status := ACTIVE; version += 1"]
  - method: GET
    path: "/specialty-providers/{id}/network-participations"
    description: "List participation rows of a specialist"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor, ReferringProvider, SpecialistProvider]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "NetworkParticipation[]"
    side_effects: []
  - method: GET
    path: "/specialty-providers/{id}/appointments"
    description: "List appointments of a specialist"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor, SpecialistProvider]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Appointment[]"
    side_effects: []

  # --- Patients ---
  - method: POST
    path: "/patients"
    description: "Register a patient"
    roles: [NetworkAdmin]
    code: 201
    input: [mrn, full_name, date_of_birth, region, insurance_plan_id]
    output: Patient
    side_effects: []
  - method: GET
    path: "/patients"
    description: "List patients"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor, ReferringProvider, SpecialistProvider]
    code: 200
    input: ["insurance_plan_id?", "status?", "limit?", "offset?"]
    output: "Patient[]"
    side_effects: []
  - method: GET
    path: "/patients/{id}"
    description: "Get one patient (includes computed strikes/risk fields)"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor, ReferringProvider, SpecialistProvider]
    code: 200
    input: []
    output: Patient
    side_effects: []
  - method: GET
    path: "/patients/{id}/referrals"
    description: "List referrals of a patient"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor, ReferringProvider, SpecialistProvider]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Referral[]"
    side_effects: []

  # --- Insurance plans ---
  - method: POST
    path: "/insurance-plans"
    description: "Create an insurance plan"
    roles: [NetworkAdmin]
    code: 201
    input: [plan_code, payer_name, payer_mix_factor]
    output: InsurancePlan
    side_effects: []
  - method: GET
    path: "/insurance-plans"
    description: "List insurance plans"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor, ReferringProvider, SpecialistProvider]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "InsurancePlan[]"
    side_effects: []
  - method: GET
    path: "/insurance-plans/{id}"
    description: "Get one insurance plan"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor, ReferringProvider, SpecialistProvider]
    code: 200
    input: []
    output: InsurancePlan
    side_effects: []
  - method: POST
    path: "/insurance-plans/{id}/retire"
    description: "Retire a plan"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: InsurancePlan
    side_effects: ["status := RETIRED; version += 1"]

  # --- Network participation ---
  - method: POST
    path: "/network-participations"
    description: "Create a participation window; rejects overlap with an ACTIVE row for the same (specialist_id, insurance_plan_id) using INCLUSIVE date arithmetic"
    roles: [NetworkAdmin]
    code: 201
    input: [specialist_id, insurance_plan_id, tier, effective_from, effective_to]
    output: NetworkParticipation
    side_effects: []
  - method: GET
    path: "/network-participations"
    description: "List participation rows"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor, ReferringProvider, SpecialistProvider]
    code: 200
    input: ["specialist_id?", "insurance_plan_id?", "status?", "limit?", "offset?"]
    output: "NetworkParticipation[]"
    side_effects: []
  - method: GET
    path: "/network-participations/{id}"
    description: "Get one participation row"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor, ReferringProvider, SpecialistProvider]
    code: 200
    input: []
    output: NetworkParticipation
    side_effects: []
  - method: POST
    path: "/network-participations/{id}/terminate"
    description: "Terminate a participation row"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: NetworkParticipation
    side_effects: ["status := TERMINATED; version += 1"]

  # --- Prior auth rules ---
  - method: POST
    path: "/prior-auth-rules"
    description: "Create a prior-auth rule; at most one ACTIVE row per (specialty, insurance_plan_id)"
    roles: [NetworkAdmin]
    code: 201
    input: [specialty, insurance_plan_id, requires_auth, auth_validity_days]
    output: PriorAuthRule
    side_effects: []
  - method: GET
    path: "/prior-auth-rules"
    description: "List prior-auth rules"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor, ReferringProvider, SpecialistProvider]
    code: 200
    input: ["specialty?", "insurance_plan_id?", "status?", "limit?", "offset?"]
    output: "PriorAuthRule[]"
    side_effects: []
  - method: GET
    path: "/prior-auth-rules/{id}"
    description: "Get one prior-auth rule"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor, ReferringProvider, SpecialistProvider]
    code: 200
    input: []
    output: PriorAuthRule
    side_effects: []
  - method: POST
    path: "/prior-auth-rules/{id}/retire"
    description: "Retire a prior-auth rule"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: PriorAuthRule
    side_effects: ["status := RETIRED; version += 1"]

  # --- Referrals ---
  - method: POST
    path: "/referrals"
    description: "Create a referral order. referring_provider_id is set from X-User-ID (not a payload field); insurance_plan_id defaults to the patient's plan."
    roles: [ReferringProvider]
    code: 201
    input: [patient_id, specialty, diagnosis_code, urgency, "insurance_plan_id?", "in_network_preference?"]
    output: Referral
    side_effects: ["status := PENDING_TRIAGE; auth_status := NOT_EVALUATED"]
  - method: GET
    path: "/referrals"
    description: "List referrals; ReferringProvider role sees only own referrals"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor, ReferringProvider, SpecialistProvider]
    code: 200
    input: ["referring_provider_id?", "patient_id?", "status?", "specialty?", "target_specialist_id?", "insurance_plan_id?", "leaked?", "limit?", "offset?"]
    output: "Referral[]"
    side_effects: []
  - method: GET
    path: "/referrals/{id}"
    description: "Get one referral; ReferringProvider role must own it (ERR_OWNERSHIP_VIOLATION)"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor, ReferringProvider, SpecialistProvider]
    code: 200
    input: []
    output: Referral
    side_effects: []
  - method: POST
    path: "/referrals/{id}/request-info"
    description: "Coordinator requests clarification; PENDING_TRIAGE -> NEEDS_INFO"
    roles: [ReferralCoordinator]
    code: 200
    input: [note]
    output: Referral
    side_effects: ["needs_info_note set; version += 1"]
  - method: POST
    path: "/referrals/{id}/resubmit"
    description: "Owning referring provider resubmits a NEEDS_INFO referral; NEEDS_INFO -> PENDING_TRIAGE"
    roles: [ReferringProvider]
    code: 200
    input: ["diagnosis_code?", "urgency?", "in_network_preference?", "insurance_plan_id?"]
    output: Referral
    side_effects: ["apply provided updates; version += 1"]
  - method: POST
    path: "/referrals/{id}/reject"
    description: "Coordinator rejects a PENDING_TRIAGE referral"
    roles: [ReferralCoordinator]
    code: 200
    input: [reason]
    output: Referral
    side_effects: ["status := REJECTED; version += 1"]
  - method: POST
    path: "/referrals/{id}/accept"
    description: "Coordinator accepts a PENDING_TRIAGE referral; sets triaged_at, sla_due_at, and evaluates prior-auth requirement"
    roles: [ReferralCoordinator]
    code: 200
    input: []
    output: Referral
    side_effects: ["triaged_at/sla_due_at set; auth_status := NOT_REQUIRED | AUTH_REQUIRED; version += 1"]
  - method: POST
    path: "/referrals/{id}/auto-match"
    description: "Run specialty_match_ranking; sets target_specialist_id and match_score; empty pool -> ERR_NO_ELIGIBLE_SPECIALIST"
    roles: [ReferralCoordinator]
    code: 200
    input: []
    output: Referral
    side_effects: ["target_specialist_id + match_score set; version += 1"]
  - method: POST
    path: "/referrals/{id}/assign-specialist"
    description: "Manually set target_specialist_id (specialty must match; specialist ACTIVE and accepting); leaves match_score null"
    roles: [ReferralCoordinator]
    code: 200
    input: [specialist_id]
    output: Referral
    side_effects: ["target_specialist_id set; match_score := null; version += 1"]
  - method: POST
    path: "/referrals/{id}/document-patient-choice"
    description: "Document patient choice; allowed while ACCEPTED"
    roles: [ReferralCoordinator]
    code: 200
    input: [choice_type, note]
    output: Referral
    side_effects: ["patient_choice_documented := true; patient_choice_type/note set; version += 1"]
  - method: POST
    path: "/referrals/{id}/cancel"
    description: "Cancel a non-terminal referral; reason PATIENT_WENT_OUT_OF_NETWORK creates a LeakageRecord when not already leaked"
    roles: [ReferringProvider, ReferralCoordinator]
    code: 200
    input: [reason]
    output: Referral
    side_effects: ["status := CANCELLED; active appointment cascade-cancelled (slot freed); conditional LeakageRecord; version += 1"]
  - method: POST
    path: "/referrals/{id}/auth/submit"
    description: "Initiate prior authorization; auth_status -> AUTH_PENDING from AUTH_REQUIRED/AUTH_DENIED/AUTH_EXPIRED"
    roles: [ReferralCoordinator]
    code: 200
    input: []
    output: Referral
    side_effects: ["auth_status := AUTH_PENDING; version += 1"]
  - method: POST
    path: "/referrals/{id}/auth/record-outcome"
    description: "Record payer decision; OBTAINED creates an AuthorizationRecord (expires_on = now + rule.auth_validity_days)"
    roles: [ReferralCoordinator]
    code: 200
    input: [outcome, "auth_number?"]
    output: Referral
    side_effects: ["auth_status := AUTH_OBTAINED | AUTH_DENIED; AuthorizationRecord created on OBTAINED; version += 1"]
  - method: POST
    path: "/referrals/{id}/appointments"
    description: "Book an appointment (scheduling assistance). Requires OCC expected_referral_version. Supersedes any active appointment of the referral (auto-CANCELLED with superseded=true)."
    roles: [ReferralCoordinator]
    code: 201
    input: [expected_referral_version, scheduled_start, scheduled_end, "specialist_id?"]
    output: Appointment
    side_effects: ["supersede cascade; booked_appointments_count adjustments; referral -> SCHEDULED, ever_scheduled := true; conditional out-of-network LeakageRecord; increments Referral.version by 1"]
  - method: GET
    path: "/referrals/{id}/appointments"
    description: "List appointments of a referral"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor, ReferringProvider, SpecialistProvider]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Appointment[]"
    side_effects: []
  - method: GET
    path: "/referrals/{id}/authorization-records"
    description: "List authorization records of a referral"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor, ReferringProvider, SpecialistProvider]
    code: 200
    input: ["limit?", "offset?"]
    output: "AuthorizationRecord[]"
    side_effects: []
  - method: GET
    path: "/referrals/{id}/consult-notes"
    description: "List consult notes of a referral (note_sequence order)"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor, ReferringProvider, SpecialistProvider]
    code: 200
    input: ["limit?", "offset?"]
    output: "ConsultNote[]"
    side_effects: []
  - method: GET
    path: "/referrals/{id}/loop-closures"
    description: "List loop-closure records of a referral"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor, ReferringProvider, SpecialistProvider]
    code: 200
    input: ["limit?", "offset?"]
    output: "LoopClosure[]"
    side_effects: []
  - method: GET
    path: "/referrals/{id}/leakage-records"
    description: "List leakage records of a referral"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor, ReferringProvider]
    code: 200
    input: ["limit?", "offset?"]
    output: "LeakageRecord[]"
    side_effects: []
  - method: POST
    path: "/referrals/{id}/loop-closures"
    description: "Verify or reopen loop closure. OCC expected_referral_version required. SoD: verifier must differ from the scheduling user of the latest COMPLETED appointment."
    roles: [ComplianceAuditor]
    code: 201
    input: [expected_referral_version, outcome, verification_note]
    output: LoopClosure
    side_effects: ["referral -> CLOSED (VERIFIED_CLOSED) or VISIT_COMPLETED (REOPENED); increments Referral.version by 1"]
  - method: POST
    path: "/referrals/aging-sweep"
    description: "Ops-run checkpoint: expire referrals past sla_due_at (inclusive boundary), expire stale authorization records, create LeakageRecords; processes referrals in created_at ASC order"
    roles: [ReferralCoordinator]
    code: 200
    input: []
    output: { expired_referral_ids: array, expired_count: integer, expired_auth_record_ids: array }
    side_effects: ["Referral -> EXPIRED chain; LeakageRecord creation; provider.leakage_event_count/watch_flag updates; AuthorizationRecord -> EXPIRED; auth_status -> AUTH_EXPIRED"]

  # --- Appointments ---
  - method: GET
    path: "/appointments/{id}"
    description: "Get one appointment"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor, ReferringProvider, SpecialistProvider]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: POST
    path: "/appointments/{id}/confirm"
    description: "Record closed-loop confirmation; SCHEDULED -> CONFIRMED"
    roles: [ReferralCoordinator]
    code: 200
    input: [confirmation_channel]
    output: Appointment
    side_effects: ["confirmed_at, confirmation_channel set; version += 1"]
  - method: POST
    path: "/appointments/{id}/complete"
    description: "Mark visit completed; CONFIRMED -> COMPLETED; owning specialist only; now >= scheduled_start"
    roles: [SpecialistProvider]
    code: 200
    input: []
    output: Appointment
    side_effects: ["completed_at set; booked_appointments_count -= 1; referral -> VISIT_COMPLETED; auth record CONSUMED when applicable; version += 1"]
  - method: POST
    path: "/appointments/{id}/mark-no-show"
    description: "Mark no-show; allowed from SCHEDULED/CONFIRMED once now >= scheduled_start + 15 minutes"
    roles: [ReferralCoordinator]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status := NO_SHOW; booked_appointments_count -= 1; patient strike cascade (strikes/status/escalation); referral -> ACCEPTED when no active sibling appointment remains; version += 1"]
  - method: POST
    path: "/appointments/{id}/excuse"
    description: "Excuse a NO_SHOW appointment (compensating action); decrements patient strikes"
    roles: [ReferralCoordinator]
    code: 200
    input: [reason]
    output: Appointment
    side_effects: ["status := EXCUSED; patient.no_show_strikes -= 1; conditional patient status/escalation reversal; version += 1"]
  - method: POST
    path: "/appointments/{id}/cancel"
    description: "Cancel an active appointment; frees the booked slot; referral returns to ACCEPTED when no active sibling remains"
    roles: [ReferralCoordinator]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status := CANCELLED; booked_appointments_count -= 1; conditional referral revert to ACCEPTED; version += 1"]
  - method: POST
    path: "/appointments/{id}/consult-note"
    description: "Submit consult note for a COMPLETED appointment; owning specialist only; referral -> PENDING_VERIFICATION"
    roles: [SpecialistProvider]
    code: 201
    input: [findings_summary, follow_up_recommended]
    output: ConsultNote
    side_effects: ["note_sequence assigned; returned_within_sla computed; referral VISIT_COMPLETED -> PENDING_VERIFICATION; referral.version += 1"]
  - method: GET
    path: "/appointments/{id}/consult-notes"
    description: "List consult notes of an appointment (array of length 0..N)"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor, ReferringProvider, SpecialistProvider]
    code: 200
    input: ["limit?", "offset?"]
    output: "ConsultNote[]"
    side_effects: []
  - method: GET
    path: "/consult-notes"
    description: "List consult notes (filtered)"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor]
    code: 200
    input: ["author_specialist_id?", "referral_id?", "limit?", "offset?"]
    output: "ConsultNote[]"
    side_effects: []
  - method: GET
    path: "/consult-notes/{id}"
    description: "Get one consult note"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor, ReferringProvider, SpecialistProvider]
    code: 200
    input: []
    output: ConsultNote
    side_effects: []

  # --- Analytics ---
  - method: POST
    path: "/analytics/periods/close"
    description: "Close an analytics period: create one ProviderPeriodSnapshot per provider with non-empty intake set; idempotent per (period_start, period_end)"
    roles: [NetworkAdmin]
    code: 201
    input: [period_start, period_end]
    output: { snapshot_count: integer, snapshot_ids: array }
    side_effects: ["ProviderPeriodSnapshot rows created per period_close_aggregation"]
  - method: GET
    path: "/analytics/snapshots"
    description: "List closed period snapshots"
    roles: [NetworkAdmin, ReferralCoordinator, ComplianceAuditor, ReferringProvider]
    code: 200
    input: ["referring_provider_id?", "period_start?", "period_end?", "limit?", "offset?"]
    output: "ProviderPeriodSnapshot[]"
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 401, condition: "X-User-ID or X-User-Role header missing, or role string not a declared role" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_OWNERSHIP_VIOLATION, http: 403, condition: "Entity-backed role acting on a resource owned by another identity (provider on another's referral/report; specialist on another's appointment)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, invalid enum member, or malformed datetime/date" }
  - { id: ERR_REFERRAL_NOT_FOUND, http: 404, condition: "Referral id in path does not exist" }
  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "Patient id in path or body does not exist" }
  - { id: ERR_SPECIALIST_NOT_FOUND, http: 404, condition: "Specialist id in path or body does not exist" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "InsurancePlan id in path or body does not exist" }
  - { id: ERR_PARTICIPATION_NOT_FOUND, http: 404, condition: "NetworkParticipation id in path does not exist" }
  - { id: ERR_AUTH_RULE_NOT_FOUND, http: 404, condition: "PriorAuthRule id in path does not exist" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "Appointment id in path does not exist" }
  - { id: ERR_PROVIDER_NOT_FOUND, http: 404, condition: "ReferringProvider id in path does not exist" }
  - { id: ERR_CONSULT_NOTE_NOT_FOUND, http: 404, condition: "ConsultNote id in path does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_referral_version does not equal current referral.version on an OCC-guarded write" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a state from which the invoked transition is defined (includes terminal-state lockdown)" }
  - { id: ERR_NOT_CONFIRMED, http: 409, condition: "complete invoked on an appointment not in CONFIRMED status" }
  - { id: ERR_AUTH_NOT_SATISFIED, http: 409, condition: "Booking while referral.auth_status not in {NOT_REQUIRED, AUTH_OBTAINED}, or latest AuthorizationRecord not ACTIVE" }
  - { id: ERR_PROVIDER_SUSPENDED, http: 403, condition: "SUSPENDED referring provider attempting to create a referral" }
  - { id: ERR_PLAN_RETIRED, http: 409, condition: "Creating a referral, participation, or auth rule against a RETIRED plan" }
  - { id: ERR_SOD_CONFLICT, http: 403, condition: "Loop-closure verifier's X-User-ID equals scheduled_by_user_id of the referral's latest COMPLETED appointment" }
  - { id: ERR_SPECIALTY_MISMATCH, http: 422, condition: "Specialist specialty differs from referral.specialty on assign or booking" }
  - { id: ERR_TARGET_MISMATCH, http: 422, condition: "Booking payload specialist_id differs from referral.target_specialist_id when the target is set" }
  - { id: ERR_DUPLICATE_MRN, http: 409, condition: "Patient mrn already registered" }
  - { id: ERR_DUPLICATE_NPI, http: 409, condition: "NPI already used by any ReferringProvider or SpecialistProvider" }
  - { id: ERR_DUPLICATE_PLAN_CODE, http: 409, condition: "InsurancePlan plan_code already exists" }
  - { id: ERR_DUPLICATE_AUTH_RULE, http: 409, condition: "An ACTIVE PriorAuthRule already exists for the (specialty, insurance_plan_id) pair" }
  - { id: ERR_INVALID_WINDOW, http: 400, condition: "scheduled_end <= scheduled_start, scheduled_start < now, or effective_to < effective_from" }
  - { id: ERR_PARTICIPATION_WINDOW_OVERLAP, http: 409, condition: "New ACTIVE participation's inclusive [effective_from, effective_to] intersects an existing ACTIVE row for the same (specialist_id, insurance_plan_id); adjacency (next start = previous end + 1 day) is allowed" }
  - { id: ERR_APPOINTMENT_OVERLAP, http: 409, condition: "New appointment's [start, end + 15m) intersects another SCHEDULED/CONFIRMED appointment of the same specialist's occupied [start, end + 15m); touching exactly at end + 15m is allowed" }
  - { id: ERR_NO_SHOW_TOO_EARLY, http: 422, condition: "mark-no-show before scheduled_start + 15 minutes (boundary inclusive: exactly start+15m is allowed)" }
  - { id: ERR_COMPLETE_TOO_EARLY, http: 422, condition: "complete before scheduled_start" }
  - { id: ERR_NO_ACTIVE_PARTICIPATION, http: 409, condition: "Booking specialist lacks an ACTIVE participation covering the current date for the referral's plan, and no documented out-of-network patient choice exists" }
  - { id: ERR_NO_ELIGIBLE_SPECIALIST, http: 422, condition: "Auto-match candidate pool is empty after eligibility filtering" }
  - { id: ERR_INVALID_PERIOD, http: 400, condition: "period_end <= period_start on period close" }
  - { id: ERR_PERIOD_NOT_ENDED, http: 409, condition: "Period close attempted while current date < period_end" }
  - { id: ERR_PERIOD_ALREADY_CLOSED, http: 409, condition: "A ProviderPeriodSnapshot already exists for (period_start, period_end)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ReferringProvider
    description: "Community physician creating referral orders and viewing own leakage analytics"
    identity: "entity_backed:ReferringProvider"
    exclusive_operations:
      - "POST /referrals (referring_provider_id forced to own id)"
      - "POST /referrals/{id}/resubmit (own referrals only)"
    shared_operations:
      - "POST /referrals/{id}/cancel (own referrals; shared with ReferralCoordinator)"
      - "GET reads of own referrals, own leakage records/snapshots/report"
  - name: ReferralCoordinator
    description: "Referral center staff: triage, matching, scheduling, confirmations, no-show follow-up, auth initiation"
    identity: "opaque"
    exclusive_operations:
      - "POST /referrals/{id}/request-info|accept|reject"
      - "POST /referrals/{id}/auto-match|assign-specialist|document-patient-choice"
      - "POST /referrals/{id}/auth/submit|auth/record-outcome"
      - "POST /referrals/{id}/appointments"
      - "POST /appointments/{id}/confirm|mark-no-show|excuse|cancel"
      - "POST /referrals/aging-sweep"
    shared_operations:
      - "POST /referrals/{id}/cancel (any referral; shared with owning ReferringProvider)"
      - "GET reads (global)"
  - name: SpecialistProvider
    description: "Receiving specialist: completes own visits and returns consult notes"
    identity: "entity_backed:SpecialistProvider"
    exclusive_operations:
      - "POST /appointments/{id}/complete (own appointments only)"
      - "POST /appointments/{id}/consult-note (own appointments only)"
    shared_operations:
      - "GET reads (global)"
  - name: ComplianceAuditor
    description: "Independent auditor verifying loop closure; barred by SoD from verifying a referral whose latest completed appointment they scheduled"
    identity: "opaque"
    exclusive_operations:
      - "POST /referrals/{id}/loop-closures"
    shared_operations:
      - "GET reads (global)"
  - name: NetworkAdmin
    description: "Network administrator managing providers, patients, plans, participation, auth rules, period close, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /referring-providers, /specialty-providers, /patients, /insurance-plans, /network-participations, /prior-auth-rules and their suspend/reactivate/retire/terminate actions"
      - "POST /analytics/periods/close"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads (global)"
