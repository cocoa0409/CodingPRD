# =============================================================================
# Task 1928 — E-Rate Funding Application
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: posting_creation_defaults_applied
        claim_type: defaults
        grounds: ["entities.ProcurementPosting.fields.status", "entities.ProcurementPosting.fields.other_factor_weights"]
        distinguishing_aspect: "Creating a posting without other_factor_weights yields status DRAFT, empty factor array, null posted_at/window_close_at, and version 1."
        test_recipe:
          setup: ["FY2027 cycle and applicant exist"]
          setup_api_calls:
            - call: "POST /erate/funding-cycles"
              payload: { label: "FY2027", window_open_date: "2026-10-01", window_close_date: "2027-03-31", service_delivery_deadline: "2027-06-30" }
              as: ProgramAdmin
              captures: { cyc: $.data.id }
            - call: "POST /erate/applicants"
              payload: { name: "Unified School District 7", entity_type: "SCHOOL", urban_rural: "URBAN", student_count: 1000 }
              as: ProgramAdmin
              captures: { app: $.data.id }
            - call: "POST /erate/applicant-users"
              payload: { applicant_id: "${app}", display_name: "Casey Coordinator", function: "COORDINATOR" }
              as: ProgramAdmin
              captures: { u_coord: $.data.id }
          trigger:
            - call: "POST /erate/procurement-postings"
              payload: { applicant_id: "${app}", funding_cycle_id: "${cyc}", category: "CATEGORY_ONE", description: "Internet access", price_weight_pct: 100 }
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
              captures: { p_status: $.data.status, p_factors: $.data.other_factor_weights, p_posted: $.data.posted_at, p_win: $.data.window_close_at, p_v: $.data.version }
          assert:
            - "p_status == DRAFT and p_factors == [] and p_posted == null and p_win == null and p_v == 1"

      - name: snapshot_computed_share_ignores_no_input
        claim_type: computed_fields
        grounds: ["entities.NSLPSnapshot.fields.effective_share_pct", "calculations.discount_rate_lookup"]
        distinguishing_aspect: "effective_share_pct is system-computed at creation: direct snapshot 300/1000 yields exactly 30.0 regardless of any client attempt to set it."
        test_recipe:
          setup: ["FY2027 cycle and applicant exist"]
          setup_api_calls:
            - call: "POST /erate/funding-cycles"
              payload: { label: "FY2027", window_open_date: "2026-10-01", window_close_date: "2027-03-31", service_delivery_deadline: "2027-06-30" }
              as: ProgramAdmin
              captures: { cyc: $.data.id }
            - call: "POST /erate/applicants"
              payload: { name: "Unified School District 7", entity_type: "SCHOOL", urban_rural: "URBAN", student_count: 1000 }
              as: ProgramAdmin
              captures: { app: $.data.id }
          trigger:
            - call: "POST /erate/nslp-snapshots"
              payload: { applicant_id: "${app}", funding_cycle_id: "${cyc}", total_students: 1000, free_lunch_eligible_students: 300, cep_participating: false }
              as: ProgramAdmin
              captures: { share: $.data.effective_share_pct, snap: $.data.id }
          assert:
            - "share == 30.0 (round_half_up(100*300/1000, 2))"

      - name: get_funding_request_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=5]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID yields ERR_NOT_FOUND at 404 with the error envelope."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /erate/funding-requests/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND and http status == 404"

      - name: create_applicant_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.Applicant.fields.entity_type", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "entity_type 'CHARTER' is not in {SCHOOL, LIBRARY} and must be rejected at the shape-validation priority with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /erate/applicants"
              payload: { name: "Charter Academy", entity_type: "CHARTER", urban_rural: "URBAN", student_count: 400 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST and http status == 400"

      - name: create_school_missing_student_count_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Applicant.fields.student_count", "validations[priority=4]"]
        distinguishing_aspect: "Conditional required field: entity_type=SCHOOL without student_count fails ERR_INVALID_REQUEST even though the field is optional on LIBRARY creates."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /erate/applicants"
              payload: { name: "No Count USD", entity_type: "SCHOOL", urban_rural: "RURAL" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: funding_cycle_list_pagination
        claim_type: listing
        grounds: ["response_envelope.pagination_defaults", "endpoints.GET_/erate/funding-cycles"]
        distinguishing_aspect: "Pagination envelope: limit 2 over 3 cycles returns 2 rows with total_count 3 and has_more true; offset 2 returns the final row with has_more false."
        test_recipe:
          setup: ["three funding cycles exist"]
          setup_api_calls:
            - call: "POST /erate/funding-cycles"
              payload: { label: "FY2026", window_open_date: "2025-10-01", window_close_date: "2026-03-31", service_delivery_deadline: "2026-06-30" }
              as: ProgramAdmin
            - call: "POST /erate/funding-cycles"
              payload: { label: "FY2027", window_open_date: "2026-10-01", window_close_date: "2027-03-31", service_delivery_deadline: "2027-06-30" }
              as: ProgramAdmin
            - call: "POST /erate/funding-cycles"
              payload: { label: "FY2028", window_open_date: "2027-10-01", window_close_date: "2028-03-31", service_delivery_deadline: "2028-06-30" }
              as: ProgramAdmin
          trigger:
            - call: "GET /erate/funding-cycles"
              payload: { limit: 2, offset: 0 }
              as: Any
            - call: "GET /erate/funding-cycles"
              payload: { limit: 2, offset: 2 }
              as: Any
          assert:
            - "page 1: len(data) == 2 and pagination total_count == 3 and has_more == true"
            - "page 2: len(data) == 1 and has_more == false"

  - section: state_machines
    instances:
      - name: publish_from_posted_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.ProcurementPosting.DRAFT_to_POSTED", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Publish is only valid from DRAFT; a second publish on a POSTED posting fails with ERR_INVALID_STATE_TRANSITION and does not move posted_at."
        test_recipe:
          setup: ["FY2027; applicant; posting published (posted_at pinned at 2026-08-01)"]
          setup_api_calls:
            - call: "POST /erate/funding-cycles"
              payload: { label: "FY2027", window_open_date: "2026-10-01", window_close_date: "2027-03-31", service_delivery_deadline: "2027-06-30" }
              as: ProgramAdmin
              captures: { cyc: $.data.id }
            - call: "POST /erate/applicants"
              payload: { name: "Unified School District 7", entity_type: "SCHOOL", urban_rural: "URBAN", student_count: 1000 }
              as: ProgramAdmin
              captures: { app: $.data.id }
            - call: "POST /erate/applicant-users"
              payload: { applicant_id: "${app}", display_name: "Casey Coordinator", function: "COORDINATOR" }
              as: ProgramAdmin
              captures: { u_coord: $.data.id }
            - call: "POST /erate/procurement-postings"
              payload: { applicant_id: "${app}", funding_cycle_id: "${cyc}", category: "CATEGORY_ONE", description: "Internet access", price_weight_pct: 100, other_factor_weights: [] }
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
              captures: { p1: $.data.id }
            - call: "POST /erate/procurement-postings/${p1}/publish"
              payload: {}
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
              captures: { posted_first: $.data.posted_at }
            - call: "POST /erate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /erate/procurement-postings/${p1}/publish"
              payload: {}
              as: ApplicantCoordinator
              as_user_id: "${u_coord}"
              captures: { err: $.data.error_id }
            - call: "GET /erate/procurement-postings/${p1}"
              payload: {}
              as: Any
              captures: { posted_now: $.data.posted_at }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION"
            - "posted_now == posted_first == 2026-08-01T00:00:00Z (failed transition did not republish)"

      - name: decide_blocked_while_information_requested
        claim_type: precondition_enforcement
        grounds: ["state_machines.FundingRequest.PIA_REVIEW_to_COMMITTED", "errors[ERR_INVALID_STATE_TRANSITION]"]
