# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Aerospace Machining & AS9100 Program — 9 rules x 2 instances
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: spc_cpk_provisional_vs_final
        grounds:
          - calculations.spc_capability_index
          - entities.BalloonedCharacteristic.fields.cpk_provisional
          - entities.BalloonedCharacteristic.fields.cpk_final
        distinguishing_aspect: |
          Same five measurements yield cpk_provisional 3.333 (sample stddev,
          n-1 denominator) and cpk_final 3.727 (population stddev, n
          denominator) — two valid algorithms producing different results in
          the WorkOrder/SpcMeasurement domain.
        test_recipe:
          setup:
            - "LTA ACTIVE; PO PO-SPC (part P200 rev B, qty 5, no AS9102_FAI clause) RELEASED"
            - "FAI for P200/B exists with one key characteristic (nominal 10.0, tol +/-0.10 -> usl 10.10, lsl 9.90)"
            - "WO qty 5 RELEASED then IN_PRODUCTION with 5 serials from an ACCEPTED cert"
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME AEROSPACE", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}, {min_qty: 100, unit_price_cents: 4500}, {min_qty: 500, unit_price_cents: 4000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.05, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}, {min_invoiced_cents: 10000000, rebate_pct: 0.02}, {min_invoiced_cents: 50000000, rebate_pct: 0.05}] }, as: ContractsManager, captures: { lta_id: $.data.id, lta_v0: $.data.version } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-SPC", part_number: "P200", part_revision: "B", quantity: 5, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/accept", payload: {}, as: ContractsManager }
            - { call: "POST /api/purchase-orders/${po_id}/release", payload: {}, as: ContractsManager }
            - { call: "POST /api/first-articles", payload: { part_number: "P200", part_revision: "B", fai_type: "FULL" }, as: QualityInspector, as_user_id: "insp-1", captures: { fai_id: $.data.id } }
            - { call: "POST /api/first-articles/${fai_id}/characteristics", payload: { balloon_number: 1, nominal: 10.0, tolerance_plus: 0.1, tolerance_minus: 0.1, is_key_characteristic: true }, as: QualityInspector, as_user_id: "insp-1", captures: { kc_id: $.data.id } }
            - { call: "POST /api/work-orders", payload: { po_id: "${po_id}", quantity: 5, special_processes_required: [] }, as: ManufacturingPlanner, captures: { wo_id: $.data.id } }
            - { call: "POST /api/work-orders/${wo_id}/release", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/sources", payload: { supplier_code: "S-SPC", approval_scope: "RAW_MATERIAL", counterfeit_risk_rating: "LOW" }, as: SupplyChainManager, captures: { src_id: $.data.id } }
            - { call: "POST /api/sources/${src_id}/approve", payload: {}, as: SupplyChainManager }
            - { call: "POST /api/material-certs", payload: { source_id: "${src_id}", heat_number: "H-SPC", material_spec: "AMS 5643", quantity_received: 10 }, as: SupplyChainManager, as_user_id: "scm-1", captures: { cert_id: $.data.id } }
            - { call: "POST /api/material-certs/${cert_id}/accept", payload: {}, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/work-orders/${wo_id}/serials", payload: { material_cert_id: "${cert_id}", count: 5 }, as: ManufacturingPlanner }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:01:00Z" }, as: SystemAdmin }
            - { call: "POST /api/work-orders/${wo_id}/spc-measurements", payload: { characteristic_id: "${kc_id}", measured_value: 10.01 }, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:02:00Z" }, as: SystemAdmin }
            - { call: "POST /api/work-orders/${wo_id}/spc-measurements", payload: { characteristic_id: "${kc_id}", measured_value: 9.99 }, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:03:00Z" }, as: SystemAdmin }
            - { call: "POST /api/work-orders/${wo_id}/spc-measurements", payload: { characteristic_id: "${kc_id}", measured_value: 10.01 }, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:04:00Z" }, as: SystemAdmin }
            - { call: "POST /api/work-orders/${wo_id}/spc-measurements", payload: { characteristic_id: "${kc_id}", measured_value: 9.99 }, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:05:00Z" }, as: SystemAdmin }
            - { call: "POST /api/work-orders/${wo_id}/spc-measurements", payload: { characteristic_id: "${kc_id}", measured_value: 10.00 }, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "GET /api/characteristics/${kc_id}", payload: {}, as: QualityManager, captures: { cpk_p: $.data.cpk_provisional, spc_st: $.data.spc_eval_status } }
            - { call: "POST /api/work-orders/${wo_id}/complete", payload: {}, as: ManufacturingPlanner }
            - { call: "GET /api/characteristics/${kc_id}", payload: {}, as: QualityManager, captures: { cpk_f: $.data.cpk_final } }
          assert:
            - "BalloonedCharacteristic.${kc_id}.cpk_provisional == 3.333"
            - "BalloonedCharacteristic.${kc_id}.cpk_final == 3.727"
            - "cpk_final (3.727) != cpk_provisional (3.333) for identical measurement data (n vs n-1 stddev denominator)"
            - "BalloonedCharacteristic.${kc_id}.spc_eval_status == CAPABLE (3.333 >= 1.33)"

      - name: ncr_estimated_vs_actual_cost
        grounds:
          - calculations.ncr_disposition_cost
          - entities.NonconformanceReport.fields.estimated_cost_cents
          - entities.NonconformanceReport.fields.actual_cost_cents
        distinguishing_aspect: |
          Same NCR (quantity_affected 3): the estimated variant at disposition
          (0.083 h/unit, 262 cents material) yields 3900; the actual variant at
          verify (0.5 h/unit, 262 cents) yields 19536 — a dual-variant
          calculation in the NonconformanceReport domain, a different entity
          domain from spc_cpk_provisional_vs_final.
        test_recipe:
          setup:
            - "LTA ACTIVE; PO PO-NCR (part P300 rev C, qty 3, no AS9102_FAI clause) RELEASED"
            - "WO qty 3 IN_PRODUCTION with 3 serials from an ACCEPTED cert"
            - "NCR OPEN on the WO (quantity_affected 3), submitted to MRB_REVIEW"
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME AEROSPACE", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}, {min_qty: 100, unit_price_cents: 4500}, {min_qty: 500, unit_price_cents: 4000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.05, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}, {min_invoiced_cents: 10000000, rebate_pct: 0.02}, {min_invoiced_cents: 50000000, rebate_pct: 0.05}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-NCR", part_number: "P300", part_revision: "C", quantity: 3, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/accept", payload: {}, as: ContractsManager }
            - { call: "POST /api/purchase-orders/${po_id}/release", payload: {}, as: ContractsManager }
            - { call: "POST /api/work-orders", payload: { po_id: "${po_id}", quantity: 3, special_processes_required: [] }, as: ManufacturingPlanner, captures: { wo_id: $.data.id } }
            - { call: "POST /api/work-orders/${wo_id}/release", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/sources", payload: { supplier_code: "S-NCR", approval_scope: "RAW_MATERIAL", counterfeit_risk_rating: "LOW" }, as: SupplyChainManager, captures: { src_id: $.data.id } }
            - { call: "POST /api/sources/${src_id}/approve", payload: {}, as: SupplyChainManager }
            - { call: "POST /api/material-certs", payload: { source_id: "${src_id}", heat_number: "H-NCR", material_spec: "AMS 5643", quantity_received: 10 }, as: SupplyChainManager, as_user_id: "scm-1", captures: { cert_id: $.data.id } }
            - { call: "POST /api/material-certs/${cert_id}/accept", payload: {}, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/work-orders/${wo_id}/serials", payload: { material_cert_id: "${cert_id}", count: 3 }, as: ManufacturingPlanner }
            - { call: "POST /api/ncrs", payload: { wo_id: "${wo_id}", defect_code: "DIM_OVERSIZE", description: "bore diameter oversize", quantity_affected: 3, detected_post_shipment: false }, as: QualityInspector, as_user_id: "insp-1", captures: { ncr_id: $.data.id } }
            - { call: "POST /api/ncrs/${ncr_id}/submit-mrb", payload: {}, as: QualityManager }
          trigger:
            - { call: "POST /api/ncrs/${ncr_id}/disposition", payload: { disposition: "REWORK", rework_hours_per_unit: 0.083, material_cost_per_unit_cents: 262 }, as: MRBMember, as_user_id: "mrb-1", captures: { est_cost: $.data.estimated_cost_cents, ncr_disp: $.data.disposition } }
            - { call: "POST /api/ncrs/${ncr_id}/verify", payload: { actual_rework_hours_per_unit: 0.5, actual_material_cost_per_unit_cents: 262 }, as: QualityInspector, as_user_id: "insp-2", captures: { act_cost: $.data.actual_cost_cents } }
          assert:
            - "NonconformanceReport.${ncr_id}.estimated_cost_cents == 3900 (per-unit 1299.5 rounds half-up to 1300, then x 3)"
            - "NonconformanceReport.${ncr_id}.actual_cost_cents == 19536 (per-unit 6512 x 3)"
            - "actual_cost_cents (19536) != estimated_cost_cents (3900) for identical quantity_affected"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (instances in different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: po_price_tier_surcharge_escalation
        grounds:
          - calculations.po_unit_price
          - entities.PurchaseOrder.fields.unit_price_cents
        distinguishing_aspect: |
          Mode (a): formula with >= 3 inputs and non-linear interaction —
          tier selection on quantity, a conditional 10% special-process
          surcharge, and compounding annual escalation by delivery_year.
        test_recipe:
          setup:
            - "LTA ACTIVE with tiers [1:5000, 100:4500, 500:4000], surcharge 10%, escalation 5%/yr, award_year 2026"
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME AEROSPACE", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}, {min_qty: 100, unit_price_cents: 4500}, {min_qty: 500, unit_price_cents: 4000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.05, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}, {min_invoiced_cents: 10000000, rebate_pct: 0.02}, {min_invoiced_cents: 50000000, rebate_pct: 0.05}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
          trigger:
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-A", part_number: "P400", part_revision: "A", quantity: 10, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { poa_up: $.data.unit_price_cents, poa_tot: $.data.total_cents } }
            - { call: "GET /api/ltas/${lta_id}", payload: {}, as: ContractsManager, captures: { lta_v2: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-B", part_number: "P400", part_revision: "A", quantity: 10, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: true, delivery_year: 2026, expected_lta_version: "${lta_v2}" }, as: ContractsManager, captures: { pob_up: $.data.unit_price_cents, pob_tot: $.data.total_cents } }
            - { call: "GET /api/ltas/${lta_id}", payload: {}, as: ContractsManager, captures: { lta_v3: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-C", part_number: "P400", part_revision: "A", quantity: 10, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: true, delivery_year: 2027, expected_lta_version: "${lta_v3}" }, as: ContractsManager, captures: { poc_up: $.data.unit_price_cents, poc_tot: $.data.total_cents } }
          assert:
            - "PO-A unit_price_cents == 5000 and total_cents == 50000 (tier 1, no surcharge, no escalation)"
            - "PO-B unit_price_cents == 5500 and total_cents == 55000 (5000 x 1.10 surcharge)"
            - "PO-C unit_price_cents == 5775 and total_cents == 57750 (5000 x 1.10 x 1.05^1, single final round_half_up)"

      - name: ncr_cost_per_unit_rounding_order
        grounds:
          - calculations.ncr_disposition_cost
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — per-unit cost
          1299.5 rounds half-up to 1300 BEFORE multiplying by quantity 3
          (result 3900); sum-then-round would yield 3899. Scaffold pins
          round-per-unit-then-multiply. Different mode from
          po_price_tier_surcharge_escalation (mode a).
        test_recipe:
          setup:
            - "LTA ACTIVE; PO PO-RND (qty 3, no AS9102_FAI) RELEASED; WO qty 3 IN_PRODUCTION; NCR in MRB_REVIEW with quantity_affected 3"
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME AEROSPACE", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}, {min_qty: 100, unit_price_cents: 4500}, {min_qty: 500, unit_price_cents: 4000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.05, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}, {min_invoiced_cents: 10000000, rebate_pct: 0.02}, {min_invoiced_cents: 50000000, rebate_pct: 0.05}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-RND", part_number: "P500", part_revision: "A", quantity: 3, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/accept", payload: {}, as: ContractsManager }
            - { call: "POST /api/purchase-orders/${po_id}/release", payload: {}, as: ContractsManager }
            - { call: "POST /api/work-orders", payload: { po_id: "${po_id}", quantity: 3, special_processes_required: [] }, as: ManufacturingPlanner, captures: { wo_id: $.data.id } }
            - { call: "POST /api/work-orders/${wo_id}/release", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/sources", payload: { supplier_code: "S-RND", approval_scope: "RAW_MATERIAL", counterfeit_risk_rating: "LOW" }, as: SupplyChainManager, captures: { src_id: $.data.id } }
            - { call: "POST /api/sources/${src_id}/approve", payload: {}, as: SupplyChainManager }
            - { call: "POST /api/material-certs", payload: { source_id: "${src_id}", heat_number: "H-RND", material_spec: "AMS 5643", quantity_received: 10 }, as: SupplyChainManager, as_user_id: "scm-1", captures: { cert_id: $.data.id } }
            - { call: "POST /api/material-certs/${cert_id}/accept", payload: {}, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/work-orders/${wo_id}/serials", payload: { material_cert_id: "${cert_id}", count: 3 }, as: ManufacturingPlanner }
            - { call: "POST /api/ncrs", payload: { wo_id: "${wo_id}", defect_code: "THREAD_GALL", description: "galled threads", quantity_affected: 3, detected_post_shipment: false }, as: QualityInspector, as_user_id: "insp-1", captures: { ncr_id: $.data.id } }
            - { call: "POST /api/ncrs/${ncr_id}/submit-mrb", payload: {}, as: QualityManager }
          trigger:
            - { call: "POST /api/ncrs/${ncr_id}/disposition", payload: { disposition: "REWORK", rework_hours_per_unit: 0.083, material_cost_per_unit_cents: 262 }, as: MRBMember, as_user_id: "mrb-1", captures: { est_cost: $.data.estimated_cost_cents } }
          assert:
            - "NonconformanceReport.${ncr_id}.estimated_cost_cents == 3900"
            - "estimated_cost_cents != 3899 (3899 is the sum-then-round result; per-unit-then-multiply is the pinned order)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: fai_reject_reopen_cycle
        grounds:
          - state_machines.FirstArticleInspection.SUBMITTED_to_REJECTED
          - state_machines.FirstArticleInspection.REJECTED_to_IN_INSPECTION
        distinguishing_aspect: |
          Cyclic machine on FirstArticleInspection: SUBMITTED -> REJECTED ->
          IN_INSPECTION -> SUBMITTED -> APPROVED — a revision loop, non-linear
          shape on the FAI entity.
        test_recipe:
          setup:
            - "FAI FULL for P600/A in SUBMITTED with one PASS characteristic (recorder insp-1, submitter insp-2)"
          setup_api_calls:
            - { call: "POST /api/first-articles", payload: { part_number: "P600", part_revision: "A", fai_type: "FULL" }, as: QualityInspector, as_user_id: "insp-1", captures: { fai_id: $.data.id } }
            - { call: "POST /api/first-articles/${fai_id}/characteristics", payload: { balloon_number: 1, nominal: 10.0, tolerance_plus: 0.1, tolerance_minus: 0.1, is_key_characteristic: false }, as: QualityInspector, as_user_id: "insp-1", captures: { ch_id: $.data.id } }
            - { call: "POST /api/characteristics/${ch_id}/record-measurement", payload: { measured_value: 10.0 }, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/first-articles/${fai_id}/submit", payload: {}, as: QualityInspector, as_user_id: "insp-2" }
          trigger:
            - { call: "POST /api/first-articles/${fai_id}/reject", payload: { reason: "customer requires re-balloon of note 4" }, as: CustomerQualityRep, as_user_id: "cqr-1", captures: { st1: $.data.status } }
            - { call: "POST /api/first-articles/${fai_id}/reopen", payload: {}, as: QualityInspector, as_user_id: "insp-1", captures: { st2: $.data.status } }
            - { call: "POST /api/first-articles/${fai_id}/submit", payload: {}, as: QualityInspector, as_user_id: "insp-2", captures: { st3: $.data.status } }
            - { call: "POST /api/first-articles/${fai_id}/approve", payload: {}, as: CustomerQualityRep, as_user_id: "cqr-1", captures: { st4: $.data.status, rev: $.data.approved_revision } }
          assert:
            - "After reject: FirstArticleInspection.${fai_id}.status == REJECTED"
            - "After reopen: status == IN_INSPECTION (cycle back)"
            - "After resubmit: status == SUBMITTED"
            - "After approve: status == APPROVED and approved_revision == 'A'"

      - name: ncr_kickback_and_scrap_branching
        grounds:
          - state_machines.NonconformanceReport.MRB_REVIEW_to_OPEN
          - state_machines.NonconformanceReport.MRB_REVIEW_to_DISPOSITIONED
        distinguishing_aspect: |
          Branching fork with a revert cycle on NonconformanceReport (different
          entity from FAI): MRB_REVIEW -> OPEN via kickback, re-enter
          MRB_REVIEW, then fork to SCRAP with a divergent side-effect set
          (serial scrapped, WO counters recomputed) versus the USE_AS_IS branch
          used in ncr_close_requires_escape_acknowledged.
        test_recipe:
          setup:
            - "LTA ACTIVE; PO PO-KB (qty 2, no AS9102_FAI) RELEASED; WO qty 2 IN_PRODUCTION with serials SN-0001/SN-0002"
            - "NCR in MRB_REVIEW affecting SN-0001, quantity_affected 1"
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME AEROSPACE", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}, {min_qty: 100, unit_price_cents: 4500}, {min_qty: 500, unit_price_cents: 4000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.05, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}, {min_invoiced_cents: 10000000, rebate_pct: 0.02}, {min_invoiced_cents: 50000000, rebate_pct: 0.05}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-KB", part_number: "P700", part_revision: "A", quantity: 2, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/accept", payload: {}, as: ContractsManager }
            - { call: "POST /api/purchase-orders/${po_id}/release", payload: {}, as: ContractsManager }
            - { call: "POST /api/work-orders", payload: { po_id: "${po_id}", quantity: 2, special_processes_required: [] }, as: ManufacturingPlanner, captures: { wo_id: $.data.id } }
            - { call: "POST /api/work-orders/${wo_id}/release", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/sources", payload: { supplier_code: "S-KB", approval_scope: "RAW_MATERIAL", counterfeit_risk_rating: "LOW" }, as: SupplyChainManager, captures: { src_id: $.data.id } }
            - { call: "POST /api/sources/${src_id}/approve", payload: {}, as: SupplyChainManager }
            - { call: "POST /api/material-certs", payload: { source_id: "${src_id}", heat_number: "H-KB", material_spec: "AMS 5643", quantity_received: 10 }, as: SupplyChainManager, as_user_id: "scm-1", captures: { cert_id: $.data.id } }
            - { call: "POST /api/material-certs/${cert_id}/accept", payload: {}, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/work-orders/${wo_id}/serials", payload: { material_cert_id: "${cert_id}", count: 2 }, as: ManufacturingPlanner, captures: { s1: $.data.0.id } }
            - { call: "POST /api/ncrs", payload: { wo_id: "${wo_id}", defect_code: "BURR", description: "burr on flange", quantity_affected: 1, affected_serial_ids: ["${s1}"], detected_post_shipment: false }, as: QualityInspector, as_user_id: "insp-1", captures: { ncr_id: $.data.id } }
            - { call: "POST /api/ncrs/${ncr_id}/submit-mrb", payload: {}, as: QualityManager }
          trigger:
            - { call: "POST /api/ncrs/${ncr_id}/kickback", payload: { reason: "containment scope unclear" }, as: MRBMember, as_user_id: "mrb-1", captures: { k_st: $.data.status } }
            - { call: "POST /api/ncrs/${ncr_id}/submit-mrb", payload: {}, as: QualityManager, captures: { k_st2: $.data.status } }
            - { call: "POST /api/ncrs/${ncr_id}/disposition", payload: { disposition: "SCRAP", rework_hours_per_unit: 0.5, material_cost_per_unit_cents: 0 }, as: MRBMember, as_user_id: "mrb-1", captures: { d_st: $.data.status, d_est: $.data.estimated_cost_cents } }
            - { call: "GET /api/serials/${s1}", payload: {}, as: QualityManager, captures: { s1_st: $.data.status } }
            - { call: "GET /api/work-orders/${wo_id}", payload: {}, as: QualityManager, captures: { wo_st: $.data.status, wo_scrap: $.data.scrapped_quantity, wo_good: $.data.good_quantity } }
          assert:
            - "After kickback: NonconformanceReport.${ncr_id}.status == OPEN (cycle)"
            - "After re-submit: status == MRB_REVIEW"
            - "After disposition: status == DISPOSITIONED, disposition == SCRAP, estimated_cost_cents == 6250 (0.5 x 12500 x 1)"
            - "SerialNumber.${s1}.status == SCRAPPED"
            - "WorkOrder.${wo_id}.scrapped_quantity == 1, good_quantity == 1, status == IN_PRODUCTION (no hold while good serials remain)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: material_revoke_counterfeit_cascade
        grounds:
          - state_machines.MaterialCert.ACCEPTED_to_REVOKED
          - state_machines.SerialNumber.CREATED_to_QUARANTINED
          - state_machines.WorkOrder.IN_PRODUCTION_to_QUALITY_HOLD
        distinguishing_aspect: |
          Trigger POST /api/material-certs/{id}/revoke starts a depth-3 chain
          where each link causes the next: cert REVOKED -> serial QUARANTINED
          -> WO QUALITY_HOLD -> AUTO_COUNTERFEIT NCR created OPEN. Different
          triggering transition from ncr_scrap_disposition_cascade.
        test_recipe:
          setup:
            - "LTA ACTIVE; PO PO-CF (qty 2, no AS9102_FAI) RELEASED; WO qty 2 IN_PRODUCTION with 2 serials drawn from cert H-CF (ACCEPTED)"
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME AEROSPACE", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}, {min_qty: 100, unit_price_cents: 4500}, {min_qty: 500, unit_price_cents: 4000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.05, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}, {min_invoiced_cents: 10000000, rebate_pct: 0.02}, {min_invoiced_cents: 50000000, rebate_pct: 0.05}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-CF", part_number: "P800", part_revision: "A", quantity: 2, flowdown_clauses: ["DFARS_COUNTERFEIT_PREVENTION"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/accept", payload: {}, as: ContractsManager }
            - { call: "POST /api/purchase-orders/${po_id}/release", payload: {}, as: ContractsManager }
            - { call: "POST /api/work-orders", payload: { po_id: "${po_id}", quantity: 2, special_processes_required: [] }, as: ManufacturingPlanner, captures: { wo_id: $.data.id } }
            - { call: "POST /api/work-orders/${wo_id}/release", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/sources", payload: { supplier_code: "S-CF", approval_scope: "RAW_MATERIAL", counterfeit_risk_rating: "MEDIUM" }, as: SupplyChainManager, captures: { src_id: $.data.id } }
            - { call: "POST /api/sources/${src_id}/approve", payload: {}, as: SupplyChainManager }
            - { call: "POST /api/material-certs", payload: { source_id: "${src_id}", heat_number: "H-CF", material_spec: "AMS 5643", quantity_received: 10 }, as: SupplyChainManager, as_user_id: "scm-1", captures: { cert_id: $.data.id } }
            - { call: "POST /api/material-certs/${cert_id}/accept", payload: {}, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/work-orders/${wo_id}/serials", payload: { material_cert_id: "${cert_id}", count: 2 }, as: ManufacturingPlanner, captures: { s1: $.data.0.id, s2: $.data.1.id } }
          trigger:
            - { call: "POST /api/material-certs/${cert_id}/revoke", payload: { reason: "suspect counterfeit mill cert" }, as: QualityManager, captures: { cert_st: $.data.status } }
            - { call: "GET /api/serials/${s1}", payload: {}, as: QualityManager, captures: { s1_st: $.data.status } }
            - { call: "GET /api/serials/${s2}", payload: {}, as: QualityManager, captures: { s2_st: $.data.status } }
            - { call: "GET /api/work-orders/${wo_id}", payload: {}, as: QualityManager, captures: { wo_st: $.data.status } }
            - { call: "GET /api/ncrs?wo_id=${wo_id}", payload: {}, as: QualityManager, captures: { ncr_origin: $.data.0.origin, ncr_st: $.data.0.status, ncr_defect: $.data.0.defect_code } }
          assert:
            - "MaterialCert.${cert_id}.status == REVOKED"
            - "SerialNumber.${s1}.status == QUARANTINED and SerialNumber.${s2}.status == QUARANTINED (link 1)"
            - "WorkOrder.${wo_id}.status == QUALITY_HOLD (link 2, caused by the quarantines)"
            - "One NCR exists for the WO with origin == AUTO_COUNTERFEIT, defect_code == COUNTERFEIT_SUSPECT, status == OPEN (link 3)"

      - name: ncr_scrap_disposition_cascade
        grounds:
          - state_machines.NonconformanceReport.MRB_REVIEW_to_DISPOSITIONED
          - state_machines.SerialNumber.QUARANTINED_to_SCRAPPED
          - state_machines.WorkOrder.IN_PRODUCTION_to_QUALITY_HOLD
        distinguishing_aspect: |
          Trigger POST /api/ncrs/{id}/disposition (SCRAP) starts a depth-3
          chain: NCR DISPOSITIONED -> affected serials SCRAPPED -> WO
          counters recomputed (scrapped 2, good 0) -> WO QUALITY_HOLD when
          good_quantity reaches 0. Different trigger from
          material_revoke_counterfeit_cascade.
        test_recipe:
          setup:
            - "LTA ACTIVE; PO PO-SCRAP (qty 2, no AS9102_FAI) RELEASED; WO qty 2 IN_PRODUCTION with 2 serials"
            - "NCR in MRB_REVIEW affecting both serials, quantity_affected 2"
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME AEROSPACE", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}, {min_qty: 100, unit_price_cents: 4500}, {min_qty: 500, unit_price_cents: 4000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.05, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}, {min_invoiced_cents: 10000000, rebate_pct: 0.02}, {min_invoiced_cents: 50000000, rebate_pct: 0.05}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-SCRAP", part_number: "P900", part_revision: "A", quantity: 2, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/accept", payload: {}, as: ContractsManager }
            - { call: "POST /api/purchase-orders/${po_id}/release", payload: {}, as: ContractsManager }
            - { call: "POST /api/work-orders", payload: { po_id: "${po_id}", quantity: 2, special_processes_required: [] }, as: ManufacturingPlanner, captures: { wo_id: $.data.id } }
            - { call: "POST /api/work-orders/${wo_id}/release", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/sources", payload: { supplier_code: "S-SCRAP", approval_scope: "RAW_MATERIAL", counterfeit_risk_rating: "LOW" }, as: SupplyChainManager, captures: { src_id: $.data.id } }
            - { call: "POST /api/sources/${src_id}/approve", payload: {}, as: SupplyChainManager }
            - { call: "POST /api/material-certs", payload: { source_id: "${src_id}", heat_number: "H-SCRAP", material_spec: "AMS 5643", quantity_received: 10 }, as: SupplyChainManager, as_user_id: "scm-1", captures: { cert_id: $.data.id } }
            - { call: "POST /api/material-certs/${cert_id}/accept", payload: {}, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/work-orders/${wo_id}/serials", payload: { material_cert_id: "${cert_id}", count: 2 }, as: ManufacturingPlanner, captures: { s1: $.data.0.id, s2: $.data.1.id } }
            - { call: "POST /api/ncrs", payload: { wo_id: "${wo_id}", defect_code: "CRACK", description: "crack at runout", quantity_affected: 2, affected_serial_ids: ["${s1}", "${s2}"], detected_post_shipment: false }, as: QualityInspector, as_user_id: "insp-1", captures: { ncr_id: $.data.id } }
            - { call: "POST /api/ncrs/${ncr_id}/submit-mrb", payload: {}, as: QualityManager }
          trigger:
            - { call: "POST /api/ncrs/${ncr_id}/disposition", payload: { disposition: "SCRAP", rework_hours_per_unit: 0, material_cost_per_unit_cents: 8000 }, as: MRBMember, as_user_id: "mrb-1", captures: { d_st: $.data.status } }
            - { call: "GET /api/serials/${s1}", payload: {}, as: QualityManager, captures: { s1_st: $.data.status } }
            - { call: "GET /api/serials/${s2}", payload: {}, as: QualityManager, captures: { s2_st: $.data.status } }
            - { call: "GET /api/work-orders/${wo_id}", payload: {}, as: QualityManager, captures: { wo_st: $.data.status, wo_scrap: $.data.scrapped_quantity, wo_good: $.data.good_quantity } }
          assert:
            - "SerialNumber.${s1}.status == SCRAPPED and SerialNumber.${s2}.status == SCRAPPED (link 1)"
            - "WorkOrder.${wo_id}.scrapped_quantity == 2 and good_quantity == 0 (link 2, caused by the scraps)"
            - "WorkOrder.${wo_id}.status == QUALITY_HOLD (link 3, caused by good_quantity reaching 0)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: fai_submit_state_beats_incomplete
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_FAI_NOT_SUBMITTABLE]
          - errors[ERR_FAI_INCOMPLETE_CHARACTERISTICS]
        distinguishing_aspect: |
          Category pair (state, business_constraint): submitting a DRAFT FAI
          with zero characteristics violates both the state gate and the
          completeness constraint; the priority-5 state error wins.
        test_recipe:
          setup:
            - "FAI exists in DRAFT with zero characteristics (characteristics_complete == false)"
          setup_api_calls:
            - { call: "POST /api/first-articles", payload: { part_number: "P110", part_revision: "A", fai_type: "FULL" }, as: QualityInspector, as_user_id: "insp-1", captures: { fai_id: $.data.id } }
          trigger:
            - { call: "POST /api/first-articles/${fai_id}/submit", payload: {}, as: QualityInspector, as_user_id: "insp-2", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FAI_NOT_SUBMITTABLE (state, priority 5)"
            - "http_status == 409"
            - "ERR_FAI_INCOMPLETE_CHARACTERISTICS (priority 9) is NOT returned despite characteristics_complete == false"

      - name: serial_create_safety_beats_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_MATERIAL_CERT_REVOKED]
          - errors[ERR_INSUFFICIENT_MATERIAL_QUANTITY]
        distinguishing_aspect: |
          Category pair (business_safety, business_fiscal): serial batch
          against a REVOKED cert with an over-quantity count violates both;
          the priority-7 safety error wins. Different category pair from
          fai_submit_state_beats_incomplete.
        test_recipe:
          setup:
            - "LTA ACTIVE; PO PO-SF (qty 10, no AS9102_FAI) RELEASED; WO qty 10 RELEASED"
            - "Cert H-SF (quantity_received 5) was ACCEPTED then REVOKED (no serials allocated, quantity_available 5)"
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME AEROSPACE", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}, {min_qty: 100, unit_price_cents: 4500}, {min_qty: 500, unit_price_cents: 4000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.05, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}, {min_invoiced_cents: 10000000, rebate_pct: 0.02}, {min_invoiced_cents: 50000000, rebate_pct: 0.05}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-SF", part_number: "P120", part_revision: "A", quantity: 10, flowdown_clauses: ["DFARS_COUNTERFEIT_PREVENTION"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/accept", payload: {}, as: ContractsManager }
            - { call: "POST /api/purchase-orders/${po_id}/release", payload: {}, as: ContractsManager }
            - { call: "POST /api/work-orders", payload: { po_id: "${po_id}", quantity: 10, special_processes_required: [] }, as: ManufacturingPlanner, captures: { wo_id: $.data.id } }
            - { call: "POST /api/work-orders/${wo_id}/release", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/sources", payload: { supplier_code: "S-SF", approval_scope: "RAW_MATERIAL", counterfeit_risk_rating: "MEDIUM" }, as: SupplyChainManager, captures: { src_id: $.data.id } }
            - { call: "POST /api/sources/${src_id}/approve", payload: {}, as: SupplyChainManager }
            - { call: "POST /api/material-certs", payload: { source_id: "${src_id}", heat_number: "H-SF", material_spec: "AMS 5643", quantity_received: 5 }, as: SupplyChainManager, as_user_id: "scm-1", captures: { cert_id: $.data.id } }
            - { call: "POST /api/material-certs/${cert_id}/accept", payload: {}, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/material-certs/${cert_id}/revoke", payload: { reason: "suspect counterfeit" }, as: QualityManager }
          trigger:
            - { call: "POST /api/work-orders/${wo_id}/serials", payload: { material_cert_id: "${cert_id}", count: 10 }, as: ManufacturingPlanner, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MATERIAL_CERT_REVOKED (business_safety, priority 7)"
            - "http_status == 422"
            - "ERR_INSUFFICIENT_MATERIAL_QUANTITY (business_fiscal, priority 11) is NOT returned despite count 10 > quantity_available 5"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics + endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: po_tier_boundary_qty_equals_min
        grounds:
          - calculations.po_unit_price
          - entities.PurchaseOrder.fields.unit_price_cents
        distinguishing_aspect: |
          Metric: order quantity at a tier breakpoint — quantity == min_qty
          (100) selects the higher tier (>= semantics): qty 99 prices at 5000,
          qty 100 at 4500. Reached via POST /api/purchase-orders.
        test_recipe:
          setup:
            - "LTA ACTIVE with tiers [1:5000, 100:4500, 500:4000]"
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME AEROSPACE", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}, {min_qty: 100, unit_price_cents: 4500}, {min_qty: 500, unit_price_cents: 4000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.05, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}, {min_invoiced_cents: 10000000, rebate_pct: 0.02}, {min_invoiced_cents: 50000000, rebate_pct: 0.05}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
          trigger:
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-99", part_number: "P130", part_revision: "A", quantity: 99, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { p99_up: $.data.unit_price_cents, p99_tot: $.data.total_cents } }
            - { call: "GET /api/ltas/${lta_id}", payload: {}, as: ContractsManager, captures: { lta_v2: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-100", part_number: "P130", part_revision: "A", quantity: 100, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v2}" }, as: ContractsManager, captures: { p100_up: $.data.unit_price_cents, p100_tot: $.data.total_cents } }
          assert:
            - "qty 99: unit_price_cents == 5000, total_cents == 495000 (below breakpoint)"
            - "qty 100: unit_price_cents == 4500, total_cents == 450000 (quantity == min_qty selects the new tier)"

      - name: spc_min_measurements_boundary
        grounds:
          - calculations.spc_capability_index
          - entities.BalloonedCharacteristic.fields.spc_eval_status
        distinguishing_aspect: |
          Metric: measurement count — the 5th measurement (count ==
          MIN_MEASUREMENTS) triggers Cpk evaluation; at 4 the characteristic
          stays MONITORING with null Cpk. Reached via
          POST /api/work-orders/{woId}/spc-measurements. Different metric and
          endpoint from po_tier_boundary_qty_equals_min.
        test_recipe:
          setup:
            - "LTA ACTIVE; PO PO-SPCB (qty 5, no AS9102_FAI) RELEASED; FAI for P210/A with key characteristic (usl 10.10, lsl 9.90); WO qty 5 IN_PRODUCTION with 5 serials"
          setup_api_calls:
            - { call: "POST /api/ltas", payload: { customer_name: "ACME AEROSPACE", ceiling_cents: 100000000, pricing_tiers: [{min_qty: 1, unit_price_cents: 5000}, {min_qty: 100, unit_price_cents: 4500}, {min_qty: 500, unit_price_cents: 4000}], committed_monthly_rate_units: 100, escalation_pct_per_year: 0.05, award_year: 2026, rebate_tiers: [{min_invoiced_cents: 0, rebate_pct: 0}, {min_invoiced_cents: 10000000, rebate_pct: 0.02}, {min_invoiced_cents: 50000000, rebate_pct: 0.05}] }, as: ContractsManager, captures: { lta_id: $.data.id } }
            - { call: "POST /api/ltas/${lta_id}/activate", payload: {}, as: ContractsManager, captures: { lta_v: $.data.version } }
            - { call: "POST /api/purchase-orders", payload: { lta_id: "${lta_id}", po_number: "PO-SPCB", part_number: "P210", part_revision: "A", quantity: 5, flowdown_clauses: ["AS9100D_QMS"], requires_special_process: false, delivery_year: 2026, expected_lta_version: "${lta_v}" }, as: ContractsManager, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/accept", payload: {}, as: ContractsManager }
            - { call: "POST /api/purchase-orders/${po_id}/release", payload: {}, as: ContractsManager }
            - { call: "POST /api/first-articles", payload: { part_number: "P210", part_revision: "A", fai_type: "FULL" }, as: QualityInspector, as_user_id: "insp-1", captures: { fai_id: $.data.id } }
            - { call: "POST /api/first-articles/${fai_id}/characteristics", payload: { balloon_number: 1, nominal: 10.0, tolerance_plus: 0.1, tolerance_minus: 0.1, is_key_characteristic: true }, as: QualityInspector, as_user_id: "insp-1", captures: { kc_id: $.data.id } }
            - { call: "POST /api/work-orders", payload: { po_id: "${po_id}", quantity: 5, special_processes_required: [] }, as: ManufacturingPlanner, captures: { wo_id: $.data.id } }
            - { call: "POST /api/work-orders/${wo_id}/release", payload: {}, as: ManufacturingPlanner }
            - { call: "POST /api/sources", payload: { supplier_code: "S-SPCB", approval_scope: "RAW_MATERIAL", counterfeit_risk_rating: "LOW" }, as: SupplyChainManager, captures: { src_id: $.data.id } }
            - { call: "POST /api/sources/${src_id}/approve", payload: {}, as: SupplyChainManager }
            - { call: "POST /api/material-certs", payload: { source_id: "${src_id}", heat_number: "H-SPCB", material_spec: "AMS 5643", quantity_received: 10 }, as: SupplyChainManager, as_user_id: "scm-1", captures: { cert_id: $.data.id } }
            - { call: "POST /api/material-certs/${cert_id}/accept", payload: {}, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/work-orders/${wo_id}/serials", payload: { material_cert_id: "${cert_id}", count: 5 }, as: ManufacturingPlanner }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:01:00Z" }, as: SystemAdmin }
            - { call: "POST /api/work-orders/${wo_id}/spc-measurements", payload: { characteristic_id: "${kc_id}", measured_value: 10.01 }, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:02:00Z" }, as: SystemAdmin }
            - { call: "POST /api/work-orders/${wo_id}/spc-measurements", payload: { characteristic_id: "${kc_id}", measured_value: 9.99 }, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:03:00Z" }, as: SystemAdmin }
            - { call: "POST /api/work-orders/${wo_id}/spc-measurements", payload: { characteristic_id: "${kc_id}", measured_value: 10.01 }, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:04:00Z" }, as: SystemAdmin }
            - { call: "POST /api/work-orders/${wo_id}/spc-measurements", payload: { characteristic_id: "${kc_id}", measured_value: 9.99 }, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "GET /api/characteristics/${kc_id}", payload: {}, as: QualityManager, captures: { st4: $.data.spc_eval_status, cpk4: $.data.cpk_provisional } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:05:00Z" }, as: SystemAdmin }
            - { call: "POST /api/work-orders/${wo_id}/spc-measurements", payload: { characteristic_id: "${kc_id}", measured_value: 10.00 }, as: QualityInspector, as_user_id: "insp-1" }
            - { call: "GET /api/characteristics/${kc_id}", payload: {}, as: QualityManager, captures: { st5: $.data.spc_eval_status, cpk5: $.data.cpk_provisional } }
