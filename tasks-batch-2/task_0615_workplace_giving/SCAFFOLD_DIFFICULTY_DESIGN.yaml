# =============================================================================
# task_0615_workplace_giving — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x >=2 instances = 18 instances. Every grounds:* resolves into
# SCAFFOLD.yaml §1.1-§1.7. Default clock = 2026-01-01T00:00:00Z.
# Standard window: campaigns/schedules use [2026-01-01T00:00:00Z, 2027-01-01T00:00:00Z)
# so the default clock sits inside unless a test deliberately moves it.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: matching_estimated_vs_finalized_diverges_on_cap
        grounds:
          - calculations.matching_gift_amount
          - entities.MatchingGift.fields.estimated_match_cents
          - entities.MatchingGift.fields.matched_amount_cents
          - state_machines.Donation.AUTHORIZED_to_SETTLED
          - state_machines.MatchingGift.REQUESTED_to_FINALIZED
        distinguishing_aspect: |
          On the MatchingGift entity, the estimated variant (committed-only consumption at REQUESTED)
          yields 90000 while the finalized variant (live consumption at settle) yields 20000 because
          80000 of the 100000 annual cap was consumed by another donation between request and settle.
        test_recipe:
          setup:
            - "ACTIVE program (defaults: match_ratio 0.5, annual_match_cap_cents 100000, roundup off)"
            - "APPROVED charity; LIVE campaign in [2026-01-01,2027-01-01); ACTIVE employee"
            - "Donation D0 base 160000 with request_match, settled first -> consumes 80000 of cap"
            - "Donation D1 base 180000 with request_match still REQUESTED (estimated_match_cents=90000)"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", tax_year: 2026 }
              as: ProgramManager
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /charities"
              payload: { program_id: "${prog_id}", legal_name: "Helpers Inc", ein: "12-3456789" }
              as: GivingAdmin
              captures: { charity_id: "$.data.id" }
            - call: "POST /charities/${charity_id}/start-review"
              payload: {}
              as: GivingAdmin
            - call: "POST /charities/${charity_id}/approve"
              payload: {}
              as: GivingAdmin
            - call: "POST /employees"
              payload: { program_id: "${prog_id}", email: "x@co.com", full_name: "Xavier", annual_salary_cents: 12000000 }
              as: GivingAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /campaigns"
              payload: { program_id: "${prog_id}", charity_id: "${charity_id}", name: "Drive", goal_cents: 1000000, window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }
              as: ProgramManager
              captures: { camp_id: "$.data.id" }
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: ProgramManager
            - call: "POST /donations"
              payload: { program_id: "${prog_id}", employee_id: "${emp_id}", campaign_id: "${camp_id}", donation_type: "ONE_TIME", funding_method: "CREDIT", base_amount_cents: 160000, request_match: true }
              as: GivingAdmin
              captures: { don0_id: "$.data.id" }
            - call: "POST /donations"
              payload: { program_id: "${prog_id}", employee_id: "${emp_id}", campaign_id: "${camp_id}", donation_type: "ONE_TIME", funding_method: "CREDIT", base_amount_cents: 180000, request_match: true }
              as: GivingAdmin
              captures: { don1_id: "$.data.id" }
            - call: "POST /donations/${don0_id}/authorize"
              payload: {}
              as: GivingAdmin
            - call: "POST /donations/${don0_id}/settle"
              payload: {}
              as: GivingAdmin
          trigger:
            - call: "POST /donations/${don1_id}/authorize"
              payload: {}
              as: GivingAdmin
            - call: "POST /donations/${don1_id}/settle"
              payload: {}
              as: GivingAdmin
          assert:
            - "MatchingGift for D1 has estimated_match_cents == 90000 (computed at its REQUESTED time when committed consumption was 0, before D0 settled)"
            - "After D1 settle, the D1 MatchingGift.matched_amount_cents == 20000 (live remaining = 100000 - 80000 consumed by D0)"
            - "The D1 MatchingGift.status == FINALIZED"
            - "Employee.${emp_id}.match_consumed_ytd_cents == 100000"

      - name: donation_breakdown_roundup_on_vs_off
        grounds:
          - calculations.donation_amount_breakdown
          - entities.Donation.fields.roundup_increment_cents
          - entities.Donation.fields.processing_fee_cents
          - entities.Donation.fields.total_charged_cents
          - state_machines.Donation.PLEDGED_to_AUTHORIZED
        distinguishing_aspect: |
          On the Donation entity (a different domain than MatchingGift), the same base 1250 yields
          total_charged_cents 1339 when program.roundup_enabled is true (increment 50, fee 39) and
          1287 when false (increment 0, fee 37); the round-up variant changes both subtotal and fee.
        test_recipe:
          setup:
            - "Program ACTIVE with roundup_enabled true; another reference program with roundup off"
            - "APPROVED charity, LIVE campaign, ACTIVE employee in each"
            - "A PLEDGED donation base 1250 in each program"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "RoundUp", tax_year: 2026, roundup_enabled: true }
              as: ProgramManager
              captures: { prog_on: "$.data.id" }
            - call: "POST /programs/${prog_on}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /charities"
              payload: { program_id: "${prog_on}", legal_name: "R Charity", ein: "22-2222222" }
              as: GivingAdmin
              captures: { ch_on: "$.data.id" }
            - call: "POST /charities/${ch_on}/start-review"
              payload: {}
              as: GivingAdmin
            - call: "POST /charities/${ch_on}/approve"
              payload: {}
              as: GivingAdmin
            - call: "POST /employees"
              payload: { program_id: "${prog_on}", email: "r@co.com", full_name: "Rae", annual_salary_cents: 12000000 }
              as: GivingAdmin
              captures: { emp_on: "$.data.id" }
            - call: "POST /campaigns"
              payload: { program_id: "${prog_on}", charity_id: "${ch_on}", name: "C1", goal_cents: 500000, window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }
              as: ProgramManager
              captures: { camp_on: "$.data.id" }
            - call: "POST /campaigns/${camp_on}/launch"
              payload: {}
              as: ProgramManager
            - call: "POST /donations"
              payload: { program_id: "${prog_on}", employee_id: "${emp_on}", campaign_id: "${camp_on}", donation_type: "ONE_TIME", funding_method: "CREDIT", base_amount_cents: 1250 }
              as: GivingAdmin
              captures: { don_on: "$.data.id" }
            - call: "POST /programs"
              payload: { name: "NoRoundUp", tax_year: 2026, roundup_enabled: false }
              as: ProgramManager
              captures: { prog_off: "$.data.id" }
            - call: "POST /programs/${prog_off}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /charities"
              payload: { program_id: "${prog_off}", legal_name: "N Charity", ein: "33-3333333" }
              as: GivingAdmin
              captures: { ch_off: "$.data.id" }
            - call: "POST /charities/${ch_off}/start-review"
              payload: {}
              as: GivingAdmin
            - call: "POST /charities/${ch_off}/approve"
              payload: {}
              as: GivingAdmin
            - call: "POST /employees"
              payload: { program_id: "${prog_off}", email: "n@co.com", full_name: "Nia", annual_salary_cents: 12000000 }
              as: GivingAdmin
              captures: { emp_off: "$.data.id" }
            - call: "POST /campaigns"
              payload: { program_id: "${prog_off}", charity_id: "${ch_off}", name: "C2", goal_cents: 500000, window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }
              as: ProgramManager
              captures: { camp_off: "$.data.id" }
            - call: "POST /campaigns/${camp_off}/launch"
              payload: {}
              as: ProgramManager
            - call: "POST /donations"
              payload: { program_id: "${prog_off}", employee_id: "${emp_off}", campaign_id: "${camp_off}", donation_type: "ONE_TIME", funding_method: "CREDIT", base_amount_cents: 1250 }
              as: GivingAdmin
              captures: { don_off: "$.data.id" }
          trigger:
            - call: "POST /donations/${don_on}/authorize"
              payload: {}
              as: GivingAdmin
            - call: "POST /donations/${don_off}/authorize"
              payload: {}
              as: GivingAdmin
          assert:
            - "Donation.${don_on}.roundup_increment_cents == 50"
            - "Donation.${don_on}.subtotal_cents == 1300"
            - "Donation.${don_on}.processing_fee_cents == 39"
            - "Donation.${don_on}.total_charged_cents == 1339"
            - "Donation.${don_off}.roundup_increment_cents == 0"
            - "Donation.${don_off}.processing_fee_cents == 37"
            - "Donation.${don_off}.total_charged_cents == 1287"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_match_ratio_nonlinear_tier_selection
        grounds:
          - calculations.matching_gift_amount
          - entities.Program.fields.tiered_matching_enabled
          - entities.Program.fields.tier_1_ceiling_cents
          - entities.MatchingGift.fields.raw_match_cents
        distinguishing_aspect: |
          Mode (a): raw_match for base 80000 = floor(min(80000,50000)*1.0) + floor(max(0,30000)*0.5)
          = 50000 + 15000 = 65000, a 3-input (base, ceiling, two rates) non-linear tier selection with
          min/max — distinct from the rounding-order mode (b) and circular mode (c) instances below.
        test_recipe:
          setup:
            - "ACTIVE program with tiered_matching_enabled true, tier_1_ceiling_cents 50000, tier_1_rate 1.0, tier_2_rate 0.5, cap 100000"
            - "APPROVED charity, LIVE campaign, ACTIVE employee; donation base 80000 with request_match"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Tiered", tax_year: 2026, tiered_matching_enabled: true, tier_1_ceiling_cents: 50000, tier_1_rate: 1.0, tier_2_rate: 0.5, annual_match_cap_cents: 100000 }
              as: ProgramManager
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /charities"
              payload: { program_id: "${prog_id}", legal_name: "T Charity", ein: "44-4444444" }
              as: GivingAdmin
              captures: { charity_id: "$.data.id" }
            - call: "POST /charities/${charity_id}/start-review"
              payload: {}
              as: GivingAdmin
            - call: "POST /charities/${charity_id}/approve"
              payload: {}
              as: GivingAdmin
            - call: "POST /employees"
              payload: { program_id: "${prog_id}", email: "t@co.com", full_name: "Tara", annual_salary_cents: 12000000 }
              as: GivingAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /campaigns"
              payload: { program_id: "${prog_id}", charity_id: "${charity_id}", name: "TD", goal_cents: 1000000, window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }
              as: ProgramManager
              captures: { camp_id: "$.data.id" }
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: ProgramManager
            - call: "POST /donations"
              payload: { program_id: "${prog_id}", employee_id: "${emp_id}", campaign_id: "${camp_id}", donation_type: "ONE_TIME", funding_method: "CREDIT", base_amount_cents: 80000, request_match: true }
              as: GivingAdmin
              captures: { don_id: "$.data.id" }
          trigger:
            - call: "POST /donations/${don_id}/authorize"
              payload: {}
              as: GivingAdmin
            - call: "POST /donations/${don_id}/settle"
              payload: {}
              as: GivingAdmin
          assert:
            - "MatchingGift for ${don_id} has raw_match_cents == 65000"
            - "MatchingGift for ${don_id} has matched_amount_cents == 65000"
            - "Employee.${emp_id}.match_consumed_ytd_cents == 65000"

      - name: disbursement_sum_then_fee_rounding_order
        grounds:
          - calculations.disbursement_settlement
          - entities.DisbursementBatch.fields.admin_fee_cents
          - entities.Grant.fields.admin_fee_cents
          - state_machines.DisbursementBatch.LOCKED_to_SETTLED
        distinguishing_aspect: |
          Mode (b): batch admin_fee = floor(sum(3333,6667)*0.025) = floor(10000*0.025) = 250, NOT the
          per-line floor-then-sum (83+166=249). The single 250 is allocated as [84,166] by created_at ASC;
          net_total 9750. Pins the sum-then-fee order — a different mode from (a) and (c).
        test_recipe:
          setup:
            - "ACTIVE program (disbursement_admin_fee_rate 0.025, roundup off)"
            - "APPROVED charity; LIVE campaign; ACTIVE employee"
            - "Two SETTLED donations base 3333 (created first) and 6667, no matches"
            - "OPEN disbursement batch for the charity with both donations staged as Grants"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Disb", tax_year: 2026, disbursement_admin_fee_rate: 0.025 }
              as: ProgramManager
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /charities"
              payload: { program_id: "${prog_id}", legal_name: "D Charity", ein: "55-5555555" }
              as: GivingAdmin
              captures: { charity_id: "$.data.id" }
            - call: "POST /charities/${charity_id}/start-review"
              payload: {}
              as: GivingAdmin
            - call: "POST /charities/${charity_id}/approve"
              payload: {}
              as: GivingAdmin
            - call: "POST /employees"
              payload: { program_id: "${prog_id}", email: "d@co.com", full_name: "Dee", annual_salary_cents: 12000000 }
              as: GivingAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /campaigns"
              payload: { program_id: "${prog_id}", charity_id: "${charity_id}", name: "DD", goal_cents: 1000000, window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }
              as: ProgramManager
              captures: { camp_id: "$.data.id" }
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: ProgramManager
            - call: "POST /donations"
              payload: { program_id: "${prog_id}", employee_id: "${emp_id}", campaign_id: "${camp_id}", donation_type: "ONE_TIME", funding_method: "CREDIT", base_amount_cents: 3333 }
              as: GivingAdmin
              captures: { dona_id: "$.data.id" }
            - call: "POST /donations/${dona_id}/authorize"
              payload: {}
              as: GivingAdmin
            - call: "POST /donations/${dona_id}/settle"
              payload: {}
              as: GivingAdmin
            - call: "POST /donations"
              payload: { program_id: "${prog_id}", employee_id: "${emp_id}", campaign_id: "${camp_id}", donation_type: "ONE_TIME", funding_method: "CREDIT", base_amount_cents: 6667 }
              as: GivingAdmin
              captures: { donb_id: "$.data.id" }
            - call: "POST /donations/${donb_id}/authorize"
              payload: {}
              as: GivingAdmin
            - call: "POST /donations/${donb_id}/settle"
              payload: {}
              as: GivingAdmin
            - call: "POST /disbursement-batches"
              payload: { program_id: "${prog_id}", charity_id: "${charity_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T00:00:00Z" }
              as: GivingAdmin
              captures: { batch_id: "$.data.id", batch_v0: "$.data.version" }
            - call: "POST /disbursement-batches/${batch_id}/grants"
              payload: { source_type: "DONATION", source_id: "${dona_id}", expected_batch_version: "${batch_v0}" }
              as: GivingAdmin
              captures: { grant_a: "$.data.id", batch_v1: "$.data.version" }
            - call: "POST /disbursement-batches/${batch_id}/grants"
              payload: { source_type: "DONATION", source_id: "${donb_id}", expected_batch_version: "${batch_v1}" }
              as: GivingAdmin
              captures: { grant_b: "$.data.id", batch_v2: "$.data.version" }
            - call: "POST /disbursement-batches/${batch_id}/lock"
              payload: {}
              as: GivingAdmin
          trigger:
            - call: "POST /disbursement-batches/${batch_id}/settle"
              payload: {}
              as: GivingAdmin
          assert:
            - "DisbursementBatch.${batch_id}.gross_total_cents == 10000"
            - "DisbursementBatch.${batch_id}.admin_fee_cents == 250"
            - "DisbursementBatch.${batch_id}.net_total_cents == 9750"
            - "Grant.${grant_a}.admin_fee_cents == 84 and Grant.${grant_a}.net_amount_cents == 3249"
            - "Grant.${grant_b}.admin_fee_cents == 166 and Grant.${grant_b}.net_amount_cents == 6501"
            - "Charity.${charity_id}.total_received_cents == 9750"

      - name: donation_fee_circular_subtotal_tier_order
        grounds:
          - calculations.donation_amount_breakdown
          - entities.Program.fields.processing_fee_tier_threshold_cents
          - entities.Donation.fields.subtotal_cents
          - entities.Donation.fields.processing_fee_cents
        distinguishing_aspect: |
          Mode (c): the fee depends on the subtotal tier and the total depends on the fee, a circular-looking
          dependency pinned by evaluation order. base 4960 + roundup 40 = subtotal 5000 (>= threshold 5000)
          => low rate 0.02 => fee 100 => total 5100. Deriving the fee from the base tier (4960<5000 -> 0.03)
          would wrongly give 150; only the pinned order yields 100.
        test_recipe:
          setup:
            - "ACTIVE program: roundup_enabled true, processing_fee_tier_threshold_cents 5000, low 0.02, high 0.03"
            - "APPROVED charity, LIVE campaign, ACTIVE employee; PLEDGED donation base 4960"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Circ", tax_year: 2026, roundup_enabled: true, processing_fee_tier_threshold_cents: 5000, processing_fee_low_rate: 0.02, processing_fee_high_rate: 0.03 }
              as: ProgramManager
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /charities"
              payload: { program_id: "${prog_id}", legal_name: "C2 Charity", ein: "66-6666666" }
              as: GivingAdmin
              captures: { charity_id: "$.data.id" }
            - call: "POST /charities/${charity_id}/start-review"
              payload: {}
              as: GivingAdmin
            - call: "POST /charities/${charity_id}/approve"
              payload: {}
              as: GivingAdmin
            - call: "POST /employees"
              payload: { program_id: "${prog_id}", email: "c2@co.com", full_name: "Cy", annual_salary_cents: 12000000 }
              as: GivingAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /campaigns"
              payload: { program_id: "${prog_id}", charity_id: "${charity_id}", name: "CC", goal_cents: 1000000, window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }
              as: ProgramManager
              captures: { camp_id: "$.data.id" }
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: ProgramManager
            - call: "POST /donations"
              payload: { program_id: "${prog_id}", employee_id: "${emp_id}", campaign_id: "${camp_id}", donation_type: "ONE_TIME", funding_method: "CREDIT", base_amount_cents: 4960 }
              as: GivingAdmin
              captures: { don_id: "$.data.id" }
          trigger:
            - call: "POST /donations/${don_id}/authorize"
              payload: {}
              as: GivingAdmin
          assert:
            - "Donation.${don_id}.roundup_increment_cents == 40"
            - "Donation.${don_id}.subtotal_cents == 5000"
            - "Donation.${don_id}.processing_fee_cents == 100"
            - "Donation.${don_id}.total_charged_cents == 5100"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: charity_vetting_revision_loop
        grounds:
          - state_machines.Charity.UNDER_REVIEW_to_NEEDS_INFO
          - state_machines.Charity.NEEDS_INFO_to_UNDER_REVIEW
          - entities.Charity.fields.review_rounds
        distinguishing_aspect: |
          On Charity, the cyclic edge NEEDS_INFO -> UNDER_REVIEW -> NEEDS_INFO is traversable and bumps
          review_rounds each cycle (1 -> 2), proving a genuine cycle (not a forward-only pipeline) on the
          Charity entity.
        test_recipe:
          setup:
            - "ACTIVE program; SUBMITTED charity"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Vet", tax_year: 2026 }
              as: ProgramManager
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /charities"
              payload: { program_id: "${prog_id}", legal_name: "Loop Charity", ein: "77-7777777" }
              as: GivingAdmin
              captures: { charity_id: "$.data.id" }
            - call: "POST /charities/${charity_id}/start-review"
              payload: {}
              as: GivingAdmin
            - call: "POST /charities/${charity_id}/request-info"
              payload: {}
              as: GivingAdmin
          trigger:
            - call: "POST /charities/${charity_id}/start-review"
              payload: {}
              as: GivingAdmin
              captures: { rounds_after: "$.data.review_rounds" }
          assert:
            - "Charity.${charity_id}.status == UNDER_REVIEW after the second start-review (returned to the loop)"
            - "Charity.${charity_id}.review_rounds == 2"

      - name: schedule_runcycle_self_loop
        grounds:
          - state_machines.PayrollDeductionSchedule.ACTIVE_to_ACTIVE
          - entities.PayrollDeductionSchedule.fields.occurrences_generated
          - entities.Donation.fields.schedule_id
        distinguishing_aspect: |
          On PayrollDeductionSchedule (a different entity than Charity), the ACTIVE -> ACTIVE self-loop
          run-cycle stays in ACTIVE while incrementing occurrences_generated (1 -> 2) and minting a new
          RECURRING Donation each pass — a self-cycle, not a linear transition.
        test_recipe:
          setup:
            - "ACTIVE program; APPROVED charity; LIVE campaign; ACTIVE employee (salary 12,000,000)"
            - "ACTIVE payroll schedule per_period 15000 in [2026-01-01,2027-01-01); one run-cycle already done"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Rec", tax_year: 2026 }
              as: ProgramManager
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /charities"
              payload: { program_id: "${prog_id}", legal_name: "Rec Charity", ein: "88-8888888" }
              as: GivingAdmin
              captures: { charity_id: "$.data.id" }
            - call: "POST /charities/${charity_id}/start-review"
              payload: {}
              as: GivingAdmin
            - call: "POST /charities/${charity_id}/approve"
              payload: {}
              as: GivingAdmin
            - call: "POST /employees"
              payload: { program_id: "${prog_id}", email: "rec@co.com", full_name: "Remy", annual_salary_cents: 12000000 }
              as: GivingAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /campaigns"
              payload: { program_id: "${prog_id}", charity_id: "${charity_id}", name: "RC", goal_cents: 1000000, window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }
              as: ProgramManager
              captures: { camp_id: "$.data.id" }
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: ProgramManager
