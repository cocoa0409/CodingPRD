          trigger:
            - call: "GET /memberships/${m_id}"
              payload: {}
              as: ClubManager
              captures: { bal: $.data.charge_balance_cents }
          assert:
            - "Membership.${m_id}.charge_balance_cents == 4000 (immediately consistent)"
