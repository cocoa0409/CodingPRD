      - name: relief_plan_open_comment_on_active_npa_is_refused
        claim_type: guarded transitions
        grounds: ["state_machines.ReliefPlan.transitions.PLANNING_to_PUBLIC_COMMENT", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "OPEN_COMMENT is guarded by the state of a different entity - the parent NPA must be JEOPARDY, EXHAUSTED or RELIEF_PLANNED - so opening a comment window on a plan whose NPA is still ACTIVE returns ERR_INVALID_STATE_TRANSITION even though the plan itself is in the correct PLANNING state."
        test_recipe:
          setup: ["NPA 614 exists with no blocks loaded, so no posture recomputation has fired and its status is still ACTIVE. A ReliefPlan for it sits in PLANNING with comment_window_days 30."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
            - call: "POST /numbering/npas/${npa_id}/relief-plans"
              payload: { planned_relief_type: "UNDETERMINED", comment_window_days: 30 }
              as: NumberingAdministrator
              captures: { plan_id: "$.data.id" }
          trigger:
            - call: "POST /numbering/relief-plans/${plan_id}/transitions"
              payload: { action: "OPEN_COMMENT" }
              as: NumberingAdministrator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_INVALID_STATE_TRANSITION\""
            - "GET /numbering/relief-plans/${plan_id} reads status == \"PLANNING\", comment_window_open_at is null, comment_window_close_at is null, window_end_at is null"
            - "GET /numbering/npas/${npa_id} reads status == \"ACTIVE\" and jeopardy_declared_at is null"

      - name: relief_plan_close_and_recommend_before_window_close_is_refused
        claim_type: Precondition Enforcement
        grounds: ["state_machines.ReliefPlan.transitions.PUBLIC_COMMENT_to_OVERLAY_RECOMMENDED", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "CLOSE_AND_RECOMMEND requires the clock to be at or after comment_window_close_at, so at 2026-08-01T00:00:00Z with the window closing 2026-08-31T00:00:00Z the transition is refused and no recommendation or weight is stamped."
        test_recipe:
          setup: ["NPA 614 was manually declared in jeopardy, and its ReliefPlan opened its comment window at 2026-08-01T00:00:00Z with comment_window_days 30, so comment_window_close_at is 2026-08-31T00:00:00Z. The clock has not advanced."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
            - call: "POST /numbering/npas/${npa_id}/jeopardy-declarations"
              payload: { reason: "Forecast shows exhaust inside eight quarters" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas/${npa_id}/relief-plans"
              payload: { planned_relief_type: "UNDETERMINED", comment_window_days: 30 }
              as: NumberingAdministrator
              captures: { plan_id: "$.data.id" }
            - call: "POST /numbering/relief-plans/${plan_id}/transitions"
              payload: { action: "OPEN_COMMENT" }
              as: NumberingAdministrator
          trigger:
            - call: "POST /numbering/relief-plans/${plan_id}/transitions"
              payload: { action: "CLOSE_AND_RECOMMEND" }
              as: NumberingAdministrator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_INVALID_STATE_TRANSITION\""
            - "GET /numbering/relief-plans/${plan_id} reads status == \"PUBLIC_COMMENT\", comment_window_close_at == \"2026-08-31T00:00:00Z\", recommended_relief_type == \"UNDETERMINED\", recommender_user_id is null, comment_count == 0"

      - name: relief_plan_withdraw_releases_the_npa_from_relief_planned
        claim_type: Compensation
        grounds: ["state_machines.ReliefPlan.transitions.PUBLIC_COMMENT_to_WITHDRAWN", "calculations.npa_exhaust_posture"]
        distinguishing_aspect: "WITHDRAW un-does the OPEN_COMMENT side effect on the parent: with no other active plan the NPA leaves RELIEF_PLANNED and falls back to its threshold-derived posture, which is JEOPARDY here because jeopardy_declared_at is still set even though five POOL_AVAILABLE blocks keep it above the four-block threshold."
        test_recipe:
          setup: ["NPA 614 holds five unassigned blocks 614-554-0..4 in COLUMBUS. Loading the fifth block had already cycled the code back from the automatic JEOPARDY to ACTIVE, after which an administrator manually declared jeopardy, so status is JEOPARDY with jeopardy_declared_at 2026-08-01T00:00:00Z. A plan then opened its comment window, pushing the NPA to RELIEF_PLANNED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
