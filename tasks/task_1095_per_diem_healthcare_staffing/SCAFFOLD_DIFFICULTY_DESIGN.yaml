        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; facility Oak Hollow requiring RN_LICENSE; RN rate card 7500."
            - "Clinician Nia Fowler is ACTIVE and has uploaded an RN_LICENSE expiring 2027-01-01, but no ComplianceOfficer has verified it, so it sits in PENDING_VERIFICATION."
