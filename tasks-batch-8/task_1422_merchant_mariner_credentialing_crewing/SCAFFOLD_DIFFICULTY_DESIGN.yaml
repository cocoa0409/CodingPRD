            - { call: "POST /mariners/${m2_id}/medical-certificates", payload: { cert_type: "USCG_MEDICAL", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2027-06-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m2_id}/credentials", payload: { credential_type: "MMC_BASE", endorsement_code: "DECK_AB", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2030-01-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m2_id}/drug-tests", payload: { test_type: "PRE_EMPLOYMENT", scheduled_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer, captures: { dt2_id: $.data.id } }
