        excluded_because:
          difficulty_instance: "dual_variant_calc / sea_service_provisional_vs_verified_day_credit"
          rationale: "The summary read's provisional and verified totals are asserted with literal values in the named §1.8 instance."
      - name: computed_read_upgrade_eligibility_covered
        claim_type: computed_read
        grounds: ["endpoints.\"GET /mariners/{id}/upgrade-eligibility\""]
        excluded_because:
          difficulty_instance: "boundary_precision_check / upgrade_eligibility_exactly_360_days_qualifies"
          rationale: "Eligibility breakdown fields (eligible, verified_days_in_window, shortfall_days, course_requirement_met) asserted at the 360/359 boundary in the named §1.8 instance."
      - name: computed_read_manning_compliance_covered
        claim_type: computed_read
        grounds: ["endpoints.\"GET /vessels/{id}/manning-compliance\""]
        excluded_because:
          difficulty_instance: "compensating_invariant / slot_onboard_count_relief_conservation"
          rationale: "Posture and slots_covered are probed before/during/after the handover invariant sequence in the named §1.8 instance."
      - name: travel_legs_replaceable_only_while_quoted
        claim_type: conditional_action
        grounds: ["endpoints.\"PUT /assignments/{id}/travel-bookings/{bookingId}\"", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "The legs-replacement update endpoint accepts writes only while the booking is QUOTED; after book, the same PUT fails ERR_INVALID_STATE (conditional action on child state)."
        test_recipe:
          setup: ["assignment CONFIRMED; JOIN booking QUOTED with one leg"]
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Legs Edit", mariner_reference_number: "MRN-EP1-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/medical-certificates", payload: { cert_type: "USCG_MEDICAL", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2027-06-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/credentials", payload: { credential_type: "MMC_BASE", endorsement_code: "DECK_AB", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2030-01-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/drug-tests", payload: { test_type: "PRE_EMPLOYMENT", scheduled_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer, captures: { dt_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/drug-tests/${dt_id}/record-result", payload: { result: "NEGATIVE", collected_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/activate", payload: {}, as: FleetAdmin }
            - { call: "POST /vessels", payload: { vessel_name: "SS LegsEdit", imo_number: "IMO-EP1", vessel_class: "BULK", flag_state: "US" }, as: FleetAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /vessels/${v_id}/manning-slots", payload: { position_code: "AB", rank_track: "DECK", min_rank_grade: 2, required_endorsement_code: "DECK_AB", is_critical_position: false, standard_tour_days: 90 }, as: PortCaptain, captures: { s_id: $.data.id } }
            - { call: "POST /vessels/${v_id}/activate", payload: {}, as: FleetAdmin, captures: { v_ver: $.data.version } }
            - { call: "POST /vessels/${v_id}/rotation-plans", payload: { effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", standard_tour_days: 90, max_handover_overlap_days: 3, expected_vessel_version: "${v_ver}" }, as: CrewingManager }
            - { call: "POST /assignments", payload: { mariner_id: "${m_id}", manning_slot_id: "${s_id}", assignment_channel: "DIRECT_HIRE", sign_on_date: "2026-08-10T00:00:00Z", planned_relief_date: "2026-11-10T00:00:00Z", local_join: false }, as: CrewingManager, captures: { a_id: $.data.id } }
            - { call: "POST /assignments/${a_id}/confirm", payload: {}, as: CrewingManager }
            - { call: "POST /assignments/${a_id}/travel-bookings", payload: { direction: "JOIN", payer: "VESSEL_OWNER", legs: [ { carrier: "UA", from_port: "SFO", to_port: "SIN", depart_at: "2026-08-09T10:00:00Z", arrive_at: "2026-08-10T02:00:00Z", base_fare_cents: 10000, markup_bps: 0 } ] }, as: CrewingManager, captures: { tb_id: $.data.id } }
          trigger:
            - { call: "PUT /assignments/${a_id}/travel-bookings/${tb_id}", payload: { legs: [ { carrier: "UA", from_port: "SFO", to_port: "TYO", depart_at: "2026-08-09T11:00:00Z", arrive_at: "2026-08-10T03:00:00Z", base_fare_cents: 12000, markup_bps: 0 } ] }, as: CrewingManager, captures: { tb_legs: $.data.legs } }
            - { call: "POST /assignments/${a_id}/travel-bookings/${tb_id}/book", payload: {}, as: CrewingManager }
            - { call: "PUT /assignments/${a_id}/travel-bookings/${tb_id}", payload: { legs: [ { carrier: "UA", from_port: "SFO", to_port: "HNL", depart_at: "2026-08-09T12:00:00Z", arrive_at: "2026-08-09T18:00:00Z", base_fare_cents: 9000, markup_bps: 0 } ] }, as: CrewingManager, captures: { err: $.data.error_id } }
          assert:
