scaffold_difficulty_design:
  # ===================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: occupancy_estimated_vs_final_overstay_on_permit
        grounds:
          - calculations.occupancy_fee
          - entities.Permit.fields.estimated_fee_cents
          - entities.Permit.fields.final_fee_cents
          - state_machines.Permit.APPROVED_to_ISSUED
          - state_machines.Permit.ISSUED_to_CLOSED_OUT
        distinguishing_aspect: |
          On the Permit domain, the estimated occupancy fee (requested 10-day window) and the
          final occupancy fee (actual 13-day window after an overstay) diverge: 40000 vs 49000.
        test_recipe:
          setup:
            - "A COMMERCIAL segment; a LANE permit requested 2026-04-01..2026-04-11 (10 days)."
            - "Permit issued (estimated_fee_cents=40000), one lane closure activated 2026-04-01 then restored, closed out at 2026-04-14 (13 actual days)."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Acme", license_number: "L1", contact_email: "a@x.com" }
              as: PlatformAdmin
              captures: { app: $.data.id }
            - call: "POST /street-segments"
              payload: { block_label: "Main 100", zone_class: "COMMERCIAL", last_repaved_date: "2020-01-01", roadway_lane_count: 2 }
              as: PlatformAdmin
              captures: { seg: $.data.id }
            - call: "POST /permits"
              payload: { applicant_id: "${app}", street_segment_id: "${seg}", primary_obstruction_type: "LANE", requested_start_date: "2026-04-01", requested_end_date: "2026-04-11" }
              as: Applicant
              as_user_id: "${app}"
              captures: { permit: $.data.id }
            - call: "POST /permits/${permit}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${app}"
            - call: "POST /permits/${permit}/decision"
              payload: { outcome: "APPROVED" }
              as: PermitReviewer
              as_user_id: "reviewer-1"
              captures: { pv_appr: $.data.version }
            - call: "POST /permits/${permit}/traffic-control-plan"
              payload: { device_list: ["CONES", "SIGNS"], requires_flaggers: false, setback_ft: 5 }
              as: Applicant
              as_user_id: "${app}"
              captures: { tcp: $.data.id }
            - call: "POST /traffic-control-plans/${tcp}/decision"
              payload: { outcome: "APPROVED" }
              as: PermitReviewer
              as_user_id: "reviewer-1"
            - call: "POST /permits/${permit}/bond"
              payload: { posted_cents: 80000, expected_permit_version: "${pv_appr}" }
              as: Applicant
              as_user_id: "${app}"
              captures: { bond: $.data.id }
            - call: "POST /permits/${permit}/issue"
              payload: {}
              as: PermitReviewer
              as_user_id: "reviewer-2"
            - call: "POST /permits/${permit}/lane-closures"
              payload: { street_segment_id: "${seg}", obstruction_type: "LANE", start_date: "2026-04-01", end_date: "2026-04-11" }
              as: Applicant
              as_user_id: "${app}"
              captures: { closure: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lane-closures/${closure}/activate"
              payload: {}
              as: Applicant
              as_user_id: "${app}"
            - call: "POST /lane-closures/${closure}/request-restoration"
              payload: { estimated_deficiency_cents: 10000 }
              as: Applicant
              as_user_id: "${app}"
            - call: "POST /lane-closures/${closure}/sign-off"
              payload: { result: "PASS", assessed_deficiency_cents: 25000 }
              as: Inspector
              as_user_id: "inspector-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-14T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /permits/${permit}/close-out"
              payload: {}
              as: PermitReviewer
              as_user_id: "reviewer-1"
          assert:
            - "Permit.${permit}.estimated_fee_cents == 40000"
            - "Permit.${permit}.final_fee_cents == 49000"

      - name: bond_provisional_vs_final_refund_on_bond
        grounds:
          - calculations.bond_refund
          - entities.RestorationBond.fields.provisional_refund_cents
          - entities.RestorationBond.fields.refunded_cents
          - entities.RestorationBond.fields.forfeited_cents
          - state_machines.RestorationBond.POSTED_to_RELEASED
        distinguishing_aspect: |
          On the RestorationBond domain, the provisional refund (estimated deficiency 10000 -> 70000)
          diverges from the final refund (assessed deficiency 25000 -> 55000, forfeiting 25000).
        test_recipe:
          setup:
            - "Issued COMMERCIAL LANE permit with an 80000 bond; closure activated, restoration requested (est deficiency 10000), signed off PASS with assessed deficiency 25000."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Acme", license_number: "L1", contact_email: "a@x.com" }
              as: PlatformAdmin
              captures: { app: $.data.id }
            - call: "POST /street-segments"
              payload: { block_label: "Main 100", zone_class: "COMMERCIAL", last_repaved_date: "2020-01-01", roadway_lane_count: 2 }
              as: PlatformAdmin
              captures: { seg: $.data.id }
            - call: "POST /permits"
              payload: { applicant_id: "${app}", street_segment_id: "${seg}", primary_obstruction_type: "LANE", requested_start_date: "2026-04-01", requested_end_date: "2026-04-11" }
              as: Applicant
              as_user_id: "${app}"
              captures: { permit: $.data.id }
            - call: "POST /permits/${permit}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${app}"
            - call: "POST /permits/${permit}/decision"
              payload: { outcome: "APPROVED" }
              as: PermitReviewer
              as_user_id: "reviewer-1"
              captures: { pv_appr: $.data.version }
            - call: "POST /permits/${permit}/traffic-control-plan"
              payload: { device_list: ["CONES"], requires_flaggers: false, setback_ft: 5 }
              as: Applicant
              as_user_id: "${app}"
              captures: { tcp: $.data.id }
            - call: "POST /traffic-control-plans/${tcp}/decision"
              payload: { outcome: "APPROVED" }
              as: PermitReviewer
              as_user_id: "reviewer-1"
            - call: "POST /permits/${permit}/bond"
              payload: { posted_cents: 80000, expected_permit_version: "${pv_appr}" }
              as: Applicant
              as_user_id: "${app}"
              captures: { bond: $.data.id }
            - call: "POST /permits/${permit}/issue"
              payload: {}
              as: PermitReviewer
              as_user_id: "reviewer-2"
            - call: "POST /permits/${permit}/lane-closures"
              payload: { street_segment_id: "${seg}", obstruction_type: "LANE", start_date: "2026-04-01", end_date: "2026-04-11" }
              as: Applicant
              as_user_id: "${app}"
              captures: { closure: $.data.id }
            - call: "POST /lane-closures/${closure}/activate"
              payload: {}
              as: Applicant
              as_user_id: "${app}"
            - call: "POST /lane-closures/${closure}/request-restoration"
              payload: { estimated_deficiency_cents: 10000 }
              as: Applicant
              as_user_id: "${app}"
            - call: "POST /lane-closures/${closure}/sign-off"
              payload: { result: "PASS", assessed_deficiency_cents: 25000 }
              as: Inspector
              as_user_id: "inspector-1"
          trigger:
            - call: "POST /bonds/${bond}/release"
              payload: {}
              as: PermitReviewer
              as_user_id: "reviewer-1"
          assert:
            - "RestorationBond.${bond}.provisional_refund_cents == 70000"
            - "RestorationBond.${bond}.refunded_cents == 55000"
            - "RestorationBond.${bond}.forfeited_cents == 25000"

  # ===================================================================
  # Rule 2 — combinatorial formulas across different modes
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: occupancy_tiered_rate_with_min_cap_mode_a
        grounds:
          - calculations.occupancy_fee
          - entities.Permit.fields.estimated_fee_cents
          - entities.StreetSegment.fields.zone_class
          - state_machines.Permit.APPROVED_to_ISSUED
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear min-cap. ARTERIAL FULL_ROAD over 94 days yields raw
          1007000, but ZONE_CAP_CENTS[ARTERIAL]=1000000 clamps estimated_fee_cents to 1000000.
        test_recipe:
          setup:
            - "ARTERIAL segment; FULL_ROAD permit requested 2026-04-01..2026-07-04 (94 days); 2000000 bond posted; TCP approved."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Acme", license_number: "L1", contact_email: "a@x.com" }
              as: PlatformAdmin
              captures: { app: $.data.id }
            - call: "POST /street-segments"
              payload: { block_label: "Grand 1", zone_class: "ARTERIAL", last_repaved_date: "2020-01-01", roadway_lane_count: 4 }
              as: PlatformAdmin
              captures: { seg: $.data.id }
            - call: "POST /permits"
              payload: { applicant_id: "${app}", street_segment_id: "${seg}", primary_obstruction_type: "FULL_ROAD", requested_start_date: "2026-04-01", requested_end_date: "2026-07-04" }
              as: Applicant
              as_user_id: "${app}"
              captures: { permit: $.data.id }
            - call: "POST /permits/${permit}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${app}"
            - call: "POST /permits/${permit}/decision"
              payload: { outcome: "APPROVED" }
              as: PermitReviewer
              as_user_id: "reviewer-1"
              captures: { pv_appr: $.data.version }
            - call: "POST /permits/${permit}/traffic-control-plan"
              payload: { device_list: ["BARRICADES", "SIGNS"], requires_flaggers: true, flagger_count: 2, setback_ft: 10 }
              as: Applicant
              as_user_id: "${app}"
              captures: { tcp: $.data.id }
            - call: "POST /traffic-control-plans/${tcp}/decision"
              payload: { outcome: "APPROVED" }
              as: PermitReviewer
              as_user_id: "reviewer-1"
            - call: "POST /permits/${permit}/bond"
              payload: { posted_cents: 2000000, expected_permit_version: "${pv_appr}" }
              as: Applicant
              as_user_id: "${app}"
              captures: { bond: $.data.id }
          trigger:
            - call: "POST /permits/${permit}/issue"
              payload: {}
              as: PermitReviewer
              as_user_id: "reviewer-2"
          assert:
            - "Permit.${permit}.estimated_fee_cents == 1000000"

      - name: total_charge_surcharge_rounding_order_mode_b
        grounds:
          - calculations.total_permit_charge
          - entities.Permit.fields.surcharge_cents
          - entities.Permit.fields.total_charge_cents
          - state_machines.Permit.APPROVED_to_ISSUED
        distinguishing_aspect: |
          Mode (b): per-component surcharge rounding then sum yields surcharge 3807 (total 56307),
          whereas sum-then-round yields 3806 (total 56306); the scaffold pins per-component -> 56307.
        test_recipe:
          setup:
            - "ARTERIAL FULL_ROAD permit requested 2026-04-01..2026-04-03 (2 days), occupancy 41000; 82000 bond; TCP approved."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Acme", license_number: "L1", contact_email: "a@x.com" }
              as: PlatformAdmin
              captures: { app: $.data.id }
            - call: "POST /street-segments"
              payload: { block_label: "Grand 2", zone_class: "ARTERIAL", last_repaved_date: "2020-01-01", roadway_lane_count: 4 }
              as: PlatformAdmin
              captures: { seg: $.data.id }
            - call: "POST /permits"
              payload: { applicant_id: "${app}", street_segment_id: "${seg}", primary_obstruction_type: "FULL_ROAD", requested_start_date: "2026-04-01", requested_end_date: "2026-04-03" }
              as: Applicant
              as_user_id: "${app}"
              captures: { permit: $.data.id }
            - call: "POST /permits/${permit}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${app}"
            - call: "POST /permits/${permit}/decision"
              payload: { outcome: "APPROVED" }
              as: PermitReviewer
              as_user_id: "reviewer-1"
              captures: { pv_appr: $.data.version }
            - call: "POST /permits/${permit}/traffic-control-plan"
              payload: { device_list: ["BARRICADES"], requires_flaggers: true, flagger_count: 1, setback_ft: 8 }
              as: Applicant
              as_user_id: "${app}"
              captures: { tcp: $.data.id }
            - call: "POST /traffic-control-plans/${tcp}/decision"
              payload: { outcome: "APPROVED" }
              as: PermitReviewer
              as_user_id: "reviewer-1"
            - call: "POST /permits/${permit}/bond"
              payload: { posted_cents: 82000, expected_permit_version: "${pv_appr}" }
              as: Applicant
              as_user_id: "${app}"
              captures: { bond: $.data.id }
          trigger:
            - call: "POST /permits/${permit}/issue"
              payload: {}
              as: PermitReviewer
              as_user_id: "reviewer-2"
          assert:
            - "Permit.${permit}.estimated_fee_cents == 41000"
            - "Permit.${permit}.surcharge_cents == 3807"
            - "Permit.${permit}.total_charge_cents == 56307"

  # ===================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: permit_review_revision_cycle
        grounds:
          - state_machines.Permit.UNDER_REVIEW_to_RETURNED_FOR_REVISION
          - state_machines.Permit.RETURNED_FOR_REVISION_to_UNDER_REVIEW
          - entities.Permit.fields.status
        distinguishing_aspect: |
          The Permit machine has a back-edge: RETURNED_FOR_REVISION -> UNDER_REVIEW on re-submit,
          forming a cycle UNDER_REVIEW <-> RETURNED_FOR_REVISION (not a linear pipeline).
        test_recipe:
          setup:
            - "A permit submitted and then RETURNED_FOR_REVISION by the reviewer."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Acme", license_number: "L1", contact_email: "a@x.com" }
              as: PlatformAdmin
              captures: { app: $.data.id }
            - call: "POST /street-segments"
              payload: { block_label: "Main 100", zone_class: "COMMERCIAL", last_repaved_date: "2020-01-01", roadway_lane_count: 2 }
              as: PlatformAdmin
              captures: { seg: $.data.id }
            - call: "POST /permits"
              payload: { applicant_id: "${app}", street_segment_id: "${seg}", primary_obstruction_type: "LANE", requested_start_date: "2026-04-01", requested_end_date: "2026-04-11" }
              as: Applicant
              as_user_id: "${app}"
              captures: { permit: $.data.id }
            - call: "POST /permits/${permit}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${app}"
            - call: "POST /permits/${permit}/decision"
              payload: { outcome: "RETURNED", review_notes: "add dimensions" }
              as: PermitReviewer
              as_user_id: "reviewer-1"
          trigger:
            - call: "POST /permits/${permit}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${app}"
          assert:
            - "Permit.${permit}.status == UNDER_REVIEW"

      - name: lane_closure_restoration_reject_cycle
        grounds:
          - state_machines.LaneClosure.RESTORATION_PENDING_to_RESTORATION_REJECTED
          - state_machines.LaneClosure.RESTORATION_REJECTED_to_RESTORATION_PENDING
          - entities.LaneClosure.fields.status
        distinguishing_aspect: |
          On the LaneClosure entity, a FAILed sign-off (RESTORATION_PENDING -> RESTORATION_REJECTED)
          can be re-worked and re-requested (RESTORATION_REJECTED -> RESTORATION_PENDING), a cycle.
        test_recipe:
          setup:
            - "Issued permit with a closure activated and restoration requested; inspector signs off FAIL."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Acme", license_number: "L1", contact_email: "a@x.com" }
              as: PlatformAdmin
              captures: { app: $.data.id }
            - call: "POST /street-segments"
              payload: { block_label: "Main 100", zone_class: "COMMERCIAL", last_repaved_date: "2020-01-01", roadway_lane_count: 2 }
              as: PlatformAdmin
              captures: { seg: $.data.id }
            - call: "POST /permits"
              payload: { applicant_id: "${app}", street_segment_id: "${seg}", primary_obstruction_type: "LANE", requested_start_date: "2026-04-01", requested_end_date: "2026-04-11" }
              as: Applicant
              as_user_id: "${app}"
              captures: { permit: $.data.id }
            - call: "POST /permits/${permit}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${app}"
            - call: "POST /permits/${permit}/decision"
              payload: { outcome: "APPROVED" }
              as: PermitReviewer
              as_user_id: "reviewer-1"
              captures: { pv_appr: $.data.version }
            - call: "POST /permits/${permit}/traffic-control-plan"
              payload: { device_list: ["CONES"], requires_flaggers: false, setback_ft: 5 }
              as: Applicant
              as_user_id: "${app}"
              captures: { tcp: $.data.id }
            - call: "POST /traffic-control-plans/${tcp}/decision"
              payload: { outcome: "APPROVED" }
              as: PermitReviewer
              as_user_id: "reviewer-1"
            - call: "POST /permits/${permit}/bond"
              payload: { posted_cents: 80000, expected_permit_version: "${pv_appr}" }
              as: Applicant
              as_user_id: "${app}"
              captures: { bond: $.data.id }
            - call: "POST /permits/${permit}/issue"
              payload: {}
              as: PermitReviewer
              as_user_id: "reviewer-2"
            - call: "POST /permits/${permit}/lane-closures"
              payload: { street_segment_id: "${seg}", obstruction_type: "LANE", start_date: "2026-04-01", end_date: "2026-04-11" }
              as: Applicant
              as_user_id: "${app}"
              captures: { closure: $.data.id }
            - call: "POST /lane-closures/${closure}/activate"
              payload: {}
              as: Applicant
              as_user_id: "${app}"
            - call: "POST /lane-closures/${closure}/request-restoration"
              payload: { estimated_deficiency_cents: 5000 }
              as: Applicant
              as_user_id: "${app}"
            - call: "POST /lane-closures/${closure}/sign-off"
              payload: { result: "FAIL", assessed_deficiency_cents: 30000 }
              as: Inspector
              as_user_id: "inspector-1"
          trigger:
            - call: "POST /lane-closures/${closure}/request-restoration"
              payload: { estimated_deficiency_cents: 2000 }
              as: Applicant
              as_user_id: "${app}"
          assert:
            - "LaneClosure.${closure}.status == RESTORATION_PENDING"

  # ===================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: revoke_voids_closure_forfeits_bond_depth3
        grounds:
          - state_machines.Permit.ISSUED_to_REVOKED
          - state_machines.LaneClosure.ACTIVE_to_VOIDED
          - state_machines.RestorationBond.POSTED_to_FORFEITED
          - calculations.penalty_assessment
        distinguishing_aspect: |
          Depth-3 chain from the violation trigger: Permit ISSUED->REVOKED causes LaneClosure
          ACTIVE->VOIDED, which itself drives RestorationBond POSTED->FORFEITED (forfeited 80000).
        test_recipe:
          setup:
            - "Issued COMMERCIAL LANE permit; 80000 bond POSTED; one closure ACTIVE; one prior violation (cumulative 15000)."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Acme", license_number: "L1", contact_email: "a@x.com" }
              as: PlatformAdmin
              captures: { app: $.data.id }
            - call: "POST /street-segments"
              payload: { block_label: "Main 100", zone_class: "COMMERCIAL", last_repaved_date: "2020-01-01", roadway_lane_count: 2 }
              as: PlatformAdmin
              captures: { seg: $.data.id }
            - call: "POST /permits"
              payload: { applicant_id: "${app}", street_segment_id: "${seg}", primary_obstruction_type: "LANE", requested_start_date: "2026-04-01", requested_end_date: "2026-04-11" }
              as: Applicant
              as_user_id: "${app}"
              captures: { permit: $.data.id }
            - call: "POST /permits/${permit}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${app}"
            - call: "POST /permits/${permit}/decision"
              payload: { outcome: "APPROVED" }
              as: PermitReviewer
              as_user_id: "reviewer-1"
              captures: { pv_appr: $.data.version }
            - call: "POST /permits/${permit}/traffic-control-plan"
              payload: { device_list: ["CONES"], requires_flaggers: false, setback_ft: 5 }
              as: Applicant
              as_user_id: "${app}"
              captures: { tcp: $.data.id }
            - call: "POST /traffic-control-plans/${tcp}/decision"
              payload: { outcome: "APPROVED" }
              as: PermitReviewer
              as_user_id: "reviewer-1"
            - call: "POST /permits/${permit}/bond"
              payload: { posted_cents: 80000, expected_permit_version: "${pv_appr}" }
              as: Applicant
              as_user_id: "${app}"
              captures: { bond: $.data.id }
            - call: "POST /permits/${permit}/issue"
              payload: {}
              as: PermitReviewer
              as_user_id: "reviewer-2"
            - call: "POST /permits/${permit}/lane-closures"
              payload: { street_segment_id: "${seg}", obstruction_type: "LANE", start_date: "2026-04-01", end_date: "2026-04-11" }
              as: Applicant
              as_user_id: "${app}"
              captures: { closure: $.data.id }
            - call: "POST /lane-closures/${closure}/activate"
              payload: {}
              as: Applicant
              as_user_id: "${app}"
            - call: "POST /permits/${permit}/violations"
              payload: { violation_type: "TCP_VIOLATION" }
              as: EnforcementOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /permits/${permit}/violations"
              payload: { violation_type: "OVERSTAY" }
              as: EnforcementOfficer
              as_user_id: "officer-1"
          assert:
            - "Permit.${permit}.status == REVOKED"
            - "LaneClosure.${closure}.status == VOIDED"
            - "RestorationBond.${bond}.status == FORFEITED"
            - "RestorationBond.${bond}.forfeited_cents == 80000"

      - name: signoff_restores_closure_decrements_segment_depth2
        grounds:
          - state_machines.LaneClosure.RESTORATION_PENDING_to_RESTORED
          - calculations.segment_active_closure_count
          - entities.StreetSegment.fields.active_lane_closure_count
        distinguishing_aspect: |
          Depth-2 chain from the sign-off trigger: LaneClosure RESTORATION_PENDING->RESTORED causes
          StreetSegment.active_lane_closure_count to decrement from 1 to 0.
        test_recipe:
          setup:
            - "Issued permit; closure activated (segment active_lane_closure_count=1) and restoration requested."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { company_name: "Acme", license_number: "L1", contact_email: "a@x.com" }
              as: PlatformAdmin
              captures: { app: $.data.id }
            - call: "POST /street-segments"
              payload: { block_label: "Main 100", zone_class: "COMMERCIAL", last_repaved_date: "2020-01-01", roadway_lane_count: 2 }
              as: PlatformAdmin
              captures: { seg: $.data.id }
            - call: "POST /permits"
