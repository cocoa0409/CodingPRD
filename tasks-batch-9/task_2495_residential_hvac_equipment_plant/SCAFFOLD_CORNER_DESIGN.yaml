          - errors.ERR_WAREHOUSE_NOT_FOUND
          - endpoints.GET_/plant/warehouses/{id}/occupancy
        distinguishing_aspect: "The existence check precedes the occupancy computation on a sub-resource read too: an unknown warehouse id returns 404 ERR_WAREHOUSE_NOT_FOUND rather than a zero-occupancy report."
