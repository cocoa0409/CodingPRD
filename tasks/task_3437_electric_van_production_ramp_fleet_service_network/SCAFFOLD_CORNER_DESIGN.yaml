              as: ServiceDispatcher
              as_user_id: "sd-1"
              captures: { van9_id: $.data.id }
          trigger:
            - call: "POST /evfleet/service-visits"
              payload: { vehicle_id: "${veh1_id}", service_center_id: "${sc_id}", mobile_van_id: "${van9_id}", window_start: "2026-09-11T09:00:00Z", window_end: "2026-09-11T10:00:00Z", purpose: "REPAIR", parts_lines: [] }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { err_both: $.data.error_id }
            - call: "POST /evfleet/service-visits"
              payload: { vehicle_id: "${veh1_id}", window_start: "2026-09-11T11:00:00Z", window_end: "2026-09-11T12:00:00Z", purpose: "REPAIR", parts_lines: [] }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { err_neither: $.data.error_id }
