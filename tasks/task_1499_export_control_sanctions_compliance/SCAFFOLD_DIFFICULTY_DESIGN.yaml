              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "EAR", classification_code: "EAR99", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /compliance/classifications/${c_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${c_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/tcps"
              payload: { name: "TCP-LAB11", enclave_id: "LAB-11", product_id: "${p_id}", segregation_level: "LEVEL_3", effective_from: "2026-01-01", effective_to: "2027-01-01" }
              as: ComplianceAnalyst
              captures: { tcp_id: $.data.id }
            - call: "POST /compliance/tcps/${tcp_id}/set-status"
              payload: { to: "ACTIVE" }
              as: ComplianceAnalyst
            - call: "POST /compliance/parties"
              payload: { legal_name: "Priya Nair", country_code: "IND", city: "Bengaluru", party_type: "FOREIGN_NATIONAL", is_foreign_national: true }
              as: ComplianceAnalyst
              captures: { party_id: $.data.id }
            - call: "POST /compliance/access-grants"
              payload: { tcp_id: "${tcp_id}", party_id: "${party_id}", start_date: "2026-08-01", end_date: "2026-12-01" }
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
              captures: { g_id: $.data.id }
            - call: "POST /compliance/access-grants/${g_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
          trigger:
            - call: "POST /compliance/access-grants/${g_id}/activate"
              payload: {}
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/access-grants/${g_id}/revoke"
              payload: {}
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "GET /compliance/parties/${party_id}"
              payload: {}
              as: ComplianceManager
              captures: { gcount: $.data.active_grant_count }
          assert:
            - "after activate: Party.active_grant_count was 1 (forward action)"
            - "gcount == 0 (revoke compensates exactly; count conserved)"
            - "AccessGrant.${g_id}.status == \"REVOKED\""
            - "AuditRecords GRANT_ACTIVATED and GRANT_REVOKED both exist for entity_id=${g_id}"

