# =============================================================================
# §1.9 Scaffold Corner Design — Task 2312
# Consumer Affairs & Product Quality Contact Center
#
# Breadth probe. Sections and claim_type values are taken only from
# references/claim-extraction-guide.md. Instances already asserted by a §1.8
# instance are emitted as `excluded_because:` stubs with no test_recipe.
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: corner_staff_user_creation_returns_every_declared_field
        claim_type: creation
        grounds: [entities.StaffUser, "endpoints[POST /staff-users]"]
        distinguishing_aspect: "201 with the full StaffUser projection including the four common fields; version starts at 1."
        test_recipe:
          setup: ["Empty database; the logical clock is pinned so created_at is predictable."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" } }
          trigger:
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "AG1", full_name: "Ada Grant", role: CARE_AGENT, authority_tier: TIER_2, is_active: true }, captures: { ag1: "$.data.id", v: "$.data.version" } }
          assert:
            - "HTTP 201; response_type == \"object\""
            - "data.staff_code == \"AG1\", data.full_name == \"Ada Grant\", data.role == \"CARE_AGENT\", data.authority_tier == \"TIER_2\", data.is_active == true"
            - "data.id is a bare UUID with no type prefix; data.version == 1; data.created_at == \"2026-08-01T00:00:00.000Z\" and data.updated_at == data.created_at"
            - "meta.api_request_id and meta.api_request_timestamp are present on the success envelope"

      - name: corner_consumer_retrieval_returns_stored_values
        claim_type: retrieval
        grounds: ["endpoints[GET /consumers/{id}]", entities.Consumer]
        distinguishing_aspect: "GET returns the stored consumer plus the derived sentiment_index and the four zeroed goodwill buckets."
        test_recipe:
          setup: ["One consumer with no complaints, so sentiment sits at NEUTRAL_BASE."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "AG1", full_name: "Ada Grant", role: CARE_AGENT }, captures: { ag1: "$.data.id" } }
            - { call: "POST /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { external_ref: "C-1", full_name: "Rin Sato", email: "rin@example.com", phone: "+13125550100", postal_code: "60601" }, captures: { c1: "$.data.id" } }
          trigger:
            - { call: "GET /consumers/${c1}", as: CareAgent, as_user_id: "${ag1}", payload: {}, captures: { s: "$.data.sentiment_index" } }
          assert:
            - "HTTP 200; data.external_ref == \"C-1\", data.full_name == \"Rin Sato\", data.email == \"rin@example.com\", data.phone == \"+13125550100\", data.postal_code == \"60601\""
            - "data.sentiment_index == 50.00 (NEUTRAL_BASE with no penalties and no credits)"
            - "data.goodwill_authorized_cents == 0, goodwill_outstanding_cents == 0, goodwill_paid_cents == 0, goodwill_voided_cents == 0"
            - "data.complaint_count == 0 and data.open_kit_count == 0"

      - name: corner_complaint_listing_paginates_with_envelope_fields
        claim_type: listing
        grounds: ["endpoints[GET /complaints]", response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "Three complaints with limit 2 offset 0 then offset 2: total_count is the unpaged count and has_more flips."
        test_recipe:
          setup: ["Three complaints on one contact and one lot."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "AG1", full_name: "Ada Grant", role: CARE_AGENT }, captures: { ag1: "$.data.id" } }
            - { call: "POST /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { external_ref: "C-1", full_name: "Rin Sato", postal_code: "60601" }, captures: { c1: "$.data.id" } }
            - { call: "POST /plants", as: SystemAdmin, payload: { plant_code: "P-CHI", name: "Chicago Bakery", region: MW }, captures: { pl1: "$.data.id" } }
            - { call: "POST /production-lines", as: SystemAdmin, payload: { plant_id: "${pl1}", line_code: "L-01", nominal_units_per_hour: 12000 }, captures: { ln1: "$.data.id" } }
            - { call: "POST /products", as: SystemAdmin, payload: { sku: "SKU-CRACKER", name: "Sea Salt Crackers", category: SNACK, is_regulated_food: true, unit_retail_price_cents: 2500, units_per_case: 12 }, captures: { pr1: "$.data.id" } }
            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr1}", production_line_id: "${ln1}", batch_code: "A1B-2026-0710", code_date: "2026-07-10T00:00:00Z", units_produced: 200000 }, captures: { lot1: "$.data.id" } }
            - { call: "POST /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}", channel: EMAIL, received_at: "2026-08-01T00:00:00Z", raw_message: "Three issues." }, captures: { ct1: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: QUALITY, reported_batch_code: "A1B20260710" }, captures: { q1: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: QUALITY, reported_batch_code: "A1B20260710" }, captures: { q2: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: PACKAGING, reported_batch_code: "A1B20260710" }, captures: { q3: "$.data.id" } }
          trigger:
            - { call: "GET /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { limit: 2, offset: 0 }, captures: { t1: "$.total_count", h1: "$.has_more" } }
            - { call: "GET /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { limit: 2, offset: 2 }, captures: { t2: "$.total_count", h2: "$.has_more" } }
          assert:
            - "first page: response_type == \"array\", 2 items returned, limit == 2, offset == 0, total_count == 3, has_more == true"
            - "second page: 1 item returned, limit == 2, offset == 2, total_count == 3, has_more == false"
            - "the two pages together contain each of the three complaint ids exactly once"

      - name: corner_complaint_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_COMPLAINT_NOT_FOUND]", "validations[priority 4]"]
        distinguishing_aspect: "A syntactically valid but unknown UUID on a path segment yields the entity-specific 404 code, not a generic one."
        test_recipe:
          setup: ["One care agent exists; no complaints exist."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "AG1", full_name: "Ada Grant", role: CARE_AGENT }, captures: { ag1: "$.data.id" } }
          trigger:
            - { call: "GET /complaints/00000000-0000-4000-8000-000000000000", as: CareAgent, as_user_id: "${ag1}", payload: {}, captures: { err: "$.data.error_id", msg: "$.data.message" } }
          assert:
            - "HTTP 404; response_type == \"error\"; data.error_id == \"ERR_COMPLAINT_NOT_FOUND\"; data.message is a non-empty string"

      - name: corner_every_entity_path_404_uses_its_own_error_code
        claim_type: not_found
        grounds: ["errors[ERR_STAFF_USER_NOT_FOUND]", "errors[ERR_CONSUMER_NOT_FOUND]", "errors[ERR_PLANT_NOT_FOUND]", "errors[ERR_PRODUCTION_LINE_NOT_FOUND]", "errors[ERR_PRODUCT_NOT_FOUND]", "errors[ERR_PRODUCTION_LOT_NOT_FOUND]", "errors[ERR_CONTACT_NOT_FOUND]", "errors[ERR_SAMPLE_KIT_NOT_FOUND]", "errors[ERR_REMEDY_NOT_FOUND]", "errors[ERR_REGULATORY_REPORT_NOT_FOUND]", "errors[ERR_TREND_SIGNAL_NOT_FOUND]", "errors[ERR_RESPONSE_TEMPLATE_NOT_FOUND]"]
        distinguishing_aspect: "Table-driven sweep proving each of the twelve remaining 404 codes is reachable and that no endpoint falls back to a shared code."
        test_recipe:
          setup: ["One staff user per reading role exists; every collection is otherwise empty."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "SUP1", full_name: "Sam Ruiz", role: CARE_SUPERVISOR, authority_tier: TIER_3 }, captures: { sup1: "$.data.id" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "QL1", full_name: "Quinn Li", role: QUALITY_LEAD, authority_tier: TIER_3 }, captures: { ql1: "$.data.id" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "RO1", full_name: "Remy Ohl", role: REGULATORY_OFFICER }, captures: { ro1: "$.data.id" } }
          trigger:
            - { call: "GET /staff-users/00000000-0000-4000-8000-000000000001", as: SystemAdmin, payload: {}, captures: { e1: "$.data.error_id" } }
            - { call: "GET /consumers/00000000-0000-4000-8000-000000000002", as: CareSupervisor, as_user_id: "${sup1}", payload: {}, captures: { e2: "$.data.error_id" } }
            - { call: "GET /plants/00000000-0000-4000-8000-000000000003", as: QualityLead, as_user_id: "${ql1}", payload: {}, captures: { e3: "$.data.error_id" } }
            - { call: "GET /production-lines/00000000-0000-4000-8000-000000000004", as: QualityLead, as_user_id: "${ql1}", payload: {}, captures: { e4: "$.data.error_id" } }
            - { call: "GET /products/00000000-0000-4000-8000-000000000005", as: QualityLead, as_user_id: "${ql1}", payload: {}, captures: { e5: "$.data.error_id" } }
            - { call: "GET /production-lots/00000000-0000-4000-8000-000000000006", as: QualityLead, as_user_id: "${ql1}", payload: {}, captures: { e6: "$.data.error_id" } }
            - { call: "GET /contacts/00000000-0000-4000-8000-000000000007", as: CareSupervisor, as_user_id: "${sup1}", payload: {}, captures: { e7: "$.data.error_id" } }
            - { call: "GET /sample-kits/00000000-0000-4000-8000-000000000008", as: CareSupervisor, as_user_id: "${sup1}", payload: {}, captures: { e8: "$.data.error_id" } }
            - { call: "GET /remedies/00000000-0000-4000-8000-000000000009", as: CareSupervisor, as_user_id: "${sup1}", payload: {}, captures: { e9: "$.data.error_id" } }
            - { call: "GET /regulatory-reports/00000000-0000-4000-8000-00000000000a", as: RegulatoryOfficer, as_user_id: "${ro1}", payload: {}, captures: { e10: "$.data.error_id" } }
            - { call: "GET /trend-signals/00000000-0000-4000-8000-00000000000b", as: QualityLead, as_user_id: "${ql1}", payload: {}, captures: { e11: "$.data.error_id" } }
            - { call: "GET /response-templates/00000000-0000-4000-8000-00000000000c", as: CareSupervisor, as_user_id: "${sup1}", payload: {}, captures: { e12: "$.data.error_id" } }
          assert:
            - "each call returns HTTP 404 with response_type \"error\""
            - "error_ids in order: ERR_STAFF_USER_NOT_FOUND, ERR_CONSUMER_NOT_FOUND, ERR_PLANT_NOT_FOUND, ERR_PRODUCTION_LINE_NOT_FOUND, ERR_PRODUCT_NOT_FOUND, ERR_PRODUCTION_LOT_NOT_FOUND, ERR_CONTACT_NOT_FOUND, ERR_SAMPLE_KIT_NOT_FOUND, ERR_REMEDY_NOT_FOUND, ERR_REGULATORY_REPORT_NOT_FOUND, ERR_TREND_SIGNAL_NOT_FOUND, ERR_RESPONSE_TEMPLATE_NOT_FOUND"
            - "all twelve codes are distinct"

      - name: corner_contact_missing_required_channel_returns_validation
        claim_type: required_fields
        grounds: ["validations[priority 7]", "endpoints[POST /contacts]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting a required input field (channel) is a 400 ERR_VALIDATION, distinct from the 422 business-constraint family."
        test_recipe:
          setup: ["One consumer exists."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "AG1", full_name: "Ada Grant", role: CARE_AGENT }, captures: { ag1: "$.data.id" } }
            - { call: "POST /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { external_ref: "C-1", full_name: "Rin Sato", postal_code: "60601" }, captures: { c1: "$.data.id" } }
          trigger:
            - { call: "POST /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}", received_at: "2026-08-01T00:00:00Z", raw_message: "No channel supplied." }, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 400; data.error_id == \"ERR_VALIDATION\""
            - "GET /contacts returns total_count 0 — nothing was persisted"

      - name: corner_defaults_applied_when_optional_fields_omitted
        claim_type: defaults
        grounds: ["entities.StaffUser.authority_tier", entities.StaffUser.is_active, entities.Consumer.is_vulnerable_flag, entities.Complaint.foreign_object_class, entities.Complaint.units_claimed]
        distinguishing_aspect: "Five declared defaults across three entities are applied on omission, including the enum default NONE and the boolean default false."
        test_recipe:
          setup: ["Empty database; a plant, line, product and lot so the complaint resolves."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" } }
            - { call: "POST /plants", as: SystemAdmin, payload: { plant_code: "P-CHI", name: "Chicago Bakery", region: MW }, captures: { pl1: "$.data.id" } }
            - { call: "POST /production-lines", as: SystemAdmin, payload: { plant_id: "${pl1}", line_code: "L-01", nominal_units_per_hour: 12000 }, captures: { ln1: "$.data.id" } }
            - { call: "POST /products", as: SystemAdmin, payload: { sku: "SKU-CRACKER", name: "Sea Salt Crackers", category: SNACK, is_regulated_food: true, unit_retail_price_cents: 2500, units_per_case: 12 }, captures: { pr1: "$.data.id" } }
            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr1}", production_line_id: "${ln1}", batch_code: "A1B-2026-0710", code_date: "2026-07-10T00:00:00Z", units_produced: 200000 }, captures: { lot1: "$.data.id" } }
          trigger:
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "AG1", full_name: "Ada Grant", role: CARE_AGENT }, captures: { ag1: "$.data.id", tier: "$.data.authority_tier", act: "$.data.is_active" } }
            - { call: "POST /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { external_ref: "C-1", full_name: "Rin Sato", postal_code: "60601" }, captures: { c1: "$.data.id", vf: "$.data.is_vulnerable_flag" } }
            - { call: "POST /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}", channel: PHONE, received_at: "2026-08-01T00:00:00Z", raw_message: "Stale pack." }, captures: { ct1: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: QUALITY, reported_batch_code: "A1B20260710" }, captures: { cp1: "$.data.id", foc: "$.data.foreign_object_class", uc: "$.data.units_claimed" } }
          assert:
            - "StaffUser.authority_tier == \"TIER_1\" and is_active == true when both are omitted"
            - "Consumer.is_vulnerable_flag == false when omitted"
            - "Complaint.foreign_object_class == \"NONE\" and units_claimed == 1 when both are omitted"
            - "the omitted-defaults complaint scores provisional_severity_score == 10.00 (TYPE_POINTS QUALITY 10 plus OBJECT_POINTS NONE 0) with band \"S4\""

      - name: corner_computed_severity_fields_with_client_input_ignored
        claim_type: computed_fields
        grounds: ["validations[priority 10]", entities.Complaint.provisional_severity_score, entities.Complaint.provisional_severity_band, entities.Complaint.product_identification_status]
        distinguishing_aspect: "Client-supplied values for three computed fields are SILENTLY IGNORED (no error) and the server-computed values appear instead."
        test_recipe:
          setup: ["A plant, line, regulated product and lot so batch resolution succeeds."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "AG1", full_name: "Ada Grant", role: CARE_AGENT }, captures: { ag1: "$.data.id" } }
            - { call: "POST /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { external_ref: "C-1", full_name: "Rin Sato", postal_code: "60601" }, captures: { c1: "$.data.id" } }
            - { call: "POST /plants", as: SystemAdmin, payload: { plant_code: "P-CHI", name: "Chicago Bakery", region: MW }, captures: { pl1: "$.data.id" } }
            - { call: "POST /production-lines", as: SystemAdmin, payload: { plant_id: "${pl1}", line_code: "L-01", nominal_units_per_hour: 12000 }, captures: { ln1: "$.data.id" } }
            - { call: "POST /products", as: SystemAdmin, payload: { sku: "SKU-CRACKER", name: "Sea Salt Crackers", category: SNACK, is_regulated_food: true, unit_retail_price_cents: 2500, units_per_case: 12 }, captures: { pr1: "$.data.id" } }
            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr1}", production_line_id: "${ln1}", batch_code: "A1B-2026-0710", code_date: "2026-07-10T00:00:00Z", units_produced: 200000 }, captures: { lot1: "$.data.id" } }
            - { call: "POST /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}", channel: WEB, received_at: "2026-08-01T00:00:00Z", raw_message: "Injecting computed fields." }, captures: { ct1: "$.data.id" } }
          trigger:
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: QUALITY, reported_batch_code: "A1B20260710", provisional_severity_score: 99.99, provisional_severity_band: S1, product_identification_status: UNRESOLVED, handling_status: CLOSED }, captures: { cp1: "$.data.id", s: "$.data.provisional_severity_score", b: "$.data.provisional_severity_band" } }
          assert:
            - "HTTP 201 — the injected computed fields cause NO error"
            - "data.provisional_severity_score == 10.00 and provisional_severity_band == \"S4\", not the injected 99.99 / S1"
            - "data.product_identification_status == \"RESOLVED\" and data.lot_id == the LOT registered in setup, not the injected UNRESOLVED"
            - "data.handling_status == \"INTAKE\", not the injected CLOSED"

      - name: corner_system_fields_are_server_minted_and_input_ignored
        claim_type: system_fields
        grounds: ["validations[priority 10]", entities.Consumer, "SKILL common_fields expansion"]
        distinguishing_aspect: "id, created_at, updated_at and version supplied in the body are ignored; version then increments on the next PATCH."
        test_recipe:
          setup: ["One care agent exists."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "AG1", full_name: "Ada Grant", role: CARE_AGENT }, captures: { ag1: "$.data.id" } }
          trigger:
            - { call: "POST /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { external_ref: "C-1", full_name: "Rin Sato", postal_code: "60601", id: "11111111-1111-4111-8111-111111111111", created_at: "1999-01-01T00:00:00Z", version: 42 }, captures: { c1: "$.data.id", v1: "$.data.version" } }
            - { call: "PATCH /consumers/${c1}", as: CareAgent, as_user_id: "${ag1}", payload: { phone: "+13125550101" }, captures: { v2: "$.data.version" } }
          assert:
            - "HTTP 201; data.id != \"11111111-1111-4111-8111-111111111111\""
            - "data.created_at == \"2026-08-01T00:00:00.000Z\", not the injected 1999 value; data.version == 1, not 42"
            - "after the PATCH: data.version == 2 and data.phone == \"+13125550101\"; data.created_at is unchanged"

      - name: corner_invalid_enum_and_out_of_range_inputs_rejected
        claim_type: type_constraints
        grounds: ["validations[priority 8]", entities.Complaint.complaint_type, entities.Complaint.foreign_object_class, entities.ProductionLot.units_produced]
        distinguishing_aspect: "Enum violations on two different fields and a negative value on an integer with a declared '>= 0' constraint all funnel to the same 400 code."
        test_recipe:
          setup: ["A plant, line, product and contact exist so only the offending field is at fault."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "AG1", full_name: "Ada Grant", role: CARE_AGENT }, captures: { ag1: "$.data.id" } }
            - { call: "POST /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { external_ref: "C-1", full_name: "Rin Sato", postal_code: "60601" }, captures: { c1: "$.data.id" } }
            - { call: "POST /plants", as: SystemAdmin, payload: { plant_code: "P-CHI", name: "Chicago Bakery", region: MW }, captures: { pl1: "$.data.id" } }
            - { call: "POST /production-lines", as: SystemAdmin, payload: { plant_id: "${pl1}", line_code: "L-01", nominal_units_per_hour: 12000 }, captures: { ln1: "$.data.id" } }
            - { call: "POST /products", as: SystemAdmin, payload: { sku: "SKU-CRACKER", name: "Sea Salt Crackers", category: SNACK, is_regulated_food: true, unit_retail_price_cents: 2500, units_per_case: 12 }, captures: { pr1: "$.data.id" } }
            - { call: "POST /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}", channel: PHONE, received_at: "2026-08-01T00:00:00Z", raw_message: "Bad enums incoming." }, captures: { ct1: "$.data.id" } }
          trigger:
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: MYSTERY }, captures: { e1: "$.data.error_id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: QUALITY, foreign_object_class: SPIKY }, captures: { e2: "$.data.error_id" } }
            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr1}", production_line_id: "${ln1}", batch_code: "NEG-1", code_date: "2026-07-10T00:00:00Z", units_produced: -5 }, captures: { e3: "$.data.error_id" } }
          assert:
            - "all three calls return HTTP 400 with data.error_id == \"ERR_VALIDATION\""
            - "GET /complaints returns total_count 0 and GET /production-lots returns total_count 0 — no partial writes"

      - name: corner_custody_event_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds: [entities.CustodyEvent, "entities.CustodyEvent.common_fields false", "endpoints[POST /sample-kits/{id}/custody-events]", "endpoints[GET /sample-kits/{id}/custody-events]"]
        distinguishing_aspect: "CustodyEvent exposes only id and created_at, is append-only, and has no PATCH or DELETE endpoint in §1.5 at all."
        test_recipe:
