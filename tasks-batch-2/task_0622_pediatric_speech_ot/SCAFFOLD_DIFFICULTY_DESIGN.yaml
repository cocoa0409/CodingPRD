          setup:
            - "SLP therapist. Child-X has an ACTIVE plan and an authorization with authorized_visits=1 reserved by its one SCHEDULED appointment, so the authorization is EXHAUSTED. Child-Y is WAITING on the therapist with an ACTIVE plan and an authorization that has 1 available visit."
