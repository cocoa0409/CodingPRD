  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_versus_business_safety_send_on_already_acknowledged
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_STAT_REQUIRES_PHONE_CHANNEL]
        distinguishing_aspect: |
          A single POST /critical-notifications/{id}/send request violates BOTH priority 4
          (Notification already ACKNOWLEDGED, so PENDING→SENT is invalid) AND priority 5
          (notif.channel=SMS on a STAT order). Higher priority (4 = state) wins:
          ERR_INVALID_STATE is returned, NOT ERR_STAT_REQUIRES_PHONE_CHANNEL. Category pair:
          state vs business_safety.
        test_recipe:
          setup:
            - "Clock pinned to 2026-05-28T08:00:00Z"
            - "A STAT LabOrder with a RELEASED critical Result and a CriticalNotification whose channel is SMS (violating safety) AND whose status is already ACKNOWLEDGED"
            - "Note: the auto-created notification's channel is PHONE for STAT — to set up an SMS notif on STAT, we craft via the amend cycle: release initial Result (auto-creates a PHONE notif), invalidate it (notif voids), amend the original Result with a new critical value — auto-create the second notif with channel=SMS. Wait — the §1.2 auto-create chooses channel per panel rule. We must declare which: for STAT orders the auto-create chooses PHONE. To get SMS on a STAT, we must construct via a hypothetical second-pass — but our scaffold's only notif creation is auto. Conclusion: SMS-on-STAT cannot exist post-auto-create. Therefore priority 5 vs 4 conflict pair adjusted: pick a non-STAT order where channel=SMS is valid by default (priority 5 inactive); construct a DIFFERENT priority pair (state vs business_referential)"
            - "Adopted concrete pair: priority 4 (state) vs priority 13 (business_constraint, recipient mismatch). A non-STAT order's SENT notif is already ACKNOWLEDGED; the second ack request is from the WRONG clinician. Both checks would fail; priority 4 wins."
