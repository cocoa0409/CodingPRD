scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: unit_creation_computed_defaults
        claim_type: creation
        grounds: [entities.NursingUnit]
        distinguishing_aspect: "Unit create returns 201 with computed ledger fields initialized and system fields populated."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "Tele 3", unit_type: "TELEMETRY", bed_count: 24, incentive_budget_cents: 250000 }
              as: NurseAdmin
              captures: { u: $.data.id, res: $.data.incentive_reserved_cents, spent: $.data.incentive_spent_cents, ver: $.data.version }
          trigger: []
          assert:
            - "response 201; NursingUnit.${u}.incentive_reserved_cents == 0 and incentive_spent_cents == 0"
            - "NursingUnit.${u}.version == 1 and id is a server-minted UUID"

      - name: nurse_core_without_home_unit_rejected
        claim_type: conditional_validation
        grounds: [entities.Nurse.fields.home_unit_id, "errors[ERR_HOME_UNIT_RULE_VIOLATED]"]
        distinguishing_aspect: "Conditional field rule: employment_type CORE requires home_unit_id."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /nurses"
              payload: { full_name: "No Home", employment_type: "CORE", competencies: ["ICU"], base_hourly_rate_cents: 5000 }
              as: NurseAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_HOME_UNIT_RULE_VIOLATED (CORE nurse without home_unit_id)"

      - name: nurse_float_with_home_unit_rejected
        claim_type: conditional_validation
        grounds: [entities.Nurse.fields.home_unit_id, "errors[ERR_HOME_UNIT_RULE_VIOLATED]"]
        distinguishing_aspect: "Conditional field rule, mirrored branch: FLOAT_POOL nurse must NOT carry home_unit_id."
        test_recipe:
          setup: ["one ICU unit exists"]
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU X", unit_type: "ICU", bed_count: 10, incentive_budget_cents: 100000 }
              as: NurseAdmin
              captures: { u: $.data.id }
          trigger:
            - call: "POST /nurses"
              payload: { full_name: "Float Frank", employment_type: "FLOAT_POOL", competencies: ["ICU"], base_hourly_rate_cents: 6000, home_unit_id: "${u}" }
              as: NurseAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_HOME_UNIT_RULE_VIOLATED (FLOAT_POOL nurse with home_unit_id)"

      - name: nurse_invalid_employment_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Nurse.fields.employment_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Out-of-domain enum value is rejected at request-shape validation."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /nurses"
              payload: { full_name: "Bad Enum", employment_type: "AGENCY", competencies: ["ICU"], base_hourly_rate_cents: 5000 }
              as: NurseAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: snapshot_total_census_computed
        claim_type: computed_fields
        grounds: [entities.AcuitySnapshot.fields.total_census]
        distinguishing_aspect: "total_census is server-computed as the sum of the four census fields."
        test_recipe:
          setup: ["ICU unit with all four matrix rules"]
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU S", unit_type: "ICU", bed_count: 12, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { u: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "MODERATE", patients_per_nurse: 3 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
          trigger:
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-11", shift_code: "NIGHT", census_low: 3, census_moderate: 2, census_high: 1, census_critical: 2 }
              as: ChargeNurse
              captures: { tot: $.data.total_census, st: $.data.status }
          assert:
            - "total_census == 8 (3+2+1+2)"
            - "status == SUBMITTED on creation"

      - name: shift_duplicate_slot_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_SHIFT_ALREADY_EXISTS]"]
        distinguishing_aspect: "(unit_id, shift_date, shift_code) uniqueness enforced on shift creation."
        test_recipe:
          setup: ["ICU unit with matrix; one snapshot and one shift for 2026-08-12 DAY"]
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU T", unit_type: "ICU", bed_count: 12, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { u: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "MODERATE", patients_per_nurse: 3 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-12", shift_code: "DAY", census_low: 4, census_moderate: 0, census_high: 0, census_critical: 0 }
              as: ChargeNurse
            - call: "POST /shifts"
              payload: { unit_id: "${u}", shift_date: "2026-08-12", shift_code: "DAY" }
              as: NurseAdmin
          trigger:
            - call: "POST /shifts"
              payload: { unit_id: "${u}", shift_date: "2026-08-12", shift_code: "DAY" }
              as: NurseAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SHIFT_ALREADY_EXISTS"

      - name: shift_creation_requires_snapshot_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_ACUITY_SNAPSHOT_REQUIRED]"]
        distinguishing_aspect: "Shift creation without a SUBMITTED snapshot for the slot fails referential validation."
        test_recipe:
          setup: ["ICU unit with matrix but NO snapshot for 2026-08-13 NIGHT"]
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU U", unit_type: "ICU", bed_count: 12, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { u: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "MODERATE", patients_per_nurse: 3 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
          trigger:
            - call: "POST /shifts"
              payload: { unit_id: "${u}", shift_date: "2026-08-13", shift_code: "NIGHT" }
              as: NurseAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ACUITY_SNAPSHOT_REQUIRED (HTTP 422)"

      - name: snapshot_requires_complete_matrix_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_MATRIX_RULE_MISSING]"]
        distinguishing_aspect: "All four acuity-level matrix rules must exist before any snapshot is accepted."
        test_recipe:
          setup: ["STEP_DOWN unit with only three of four matrix rules (CRITICAL missing)"]
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "SD V", unit_type: "STEP_DOWN", bed_count: 16, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { u: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "STEP_DOWN", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "STEP_DOWN", acuity_level: "MODERATE", patients_per_nurse: 3 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "STEP_DOWN", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
          trigger:
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY", census_low: 4, census_moderate: 2, census_high: 1, census_critical: 0 }
              as: ChargeNurse
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MATRIX_RULE_MISSING (HTTP 422)"

      - name: matrix_rule_duplicate_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_MATRIX_RULE_EXISTS]"]
        distinguishing_aspect: "(unit_type, acuity_level) pair uniqueness on matrix rules."
        test_recipe:
          setup: ["one ICU LOW matrix rule exists"]
          setup_api_calls:
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
          trigger:
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 3 }
              as: NurseAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MATRIX_RULE_EXISTS"

      - name: report_duplicate_date_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_REPORT_ALREADY_EXISTS]"]
        distinguishing_aspect: "report_date uniqueness across compliance reports."
        test_recipe:
          setup: ["one DRAFT report for 2026-08-10 exists"]
          setup_api_calls:
            - call: "POST /compliance-reports"
              payload: { report_date: "2026-08-10" }
              as: NurseAdmin
          trigger:
            - call: "POST /compliance-reports"
              payload: { report_date: "2026-08-10" }
              as: NurseAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REPORT_ALREADY_EXISTS"

      - name: week_ledger_non_monday_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_REQUEST]", calculations.nurse_week_hours_ledger]
        distinguishing_aspect: "week_start must be an ISO-week Monday; 2026-08-11 is a Tuesday."
        test_recipe:
          setup: ["one nurse exists"]
          setup_api_calls:
            - call: "POST /nurses"
              payload: { full_name: "Wendy Week", employment_type: "FLOAT_POOL", competencies: ["ICU"], base_hourly_rate_cents: 6000 }
              as: NurseAdmin
              captures: { n1: $.data.id }
          trigger:
            - call: "GET /nurses/${n1}/week-ledger"
              payload: { week_start: "2026-08-11" }
              as: NurseAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (week_start 2026-08-11 is a Tuesday, not a Monday)"

      - name: offer_on_adequate_shift_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_SHIFT_ADEQUATELY_STAFFED]"]
        distinguishing_aspect: "Single-failure path (budget ample, posture ADEQUATE): premium offers are forbidden on adequately staffed shifts."
        test_recipe:
          setup: ["ICU unit budget 500000; DAY shift required 2 with two ACCEPTED assignments (one charge) -> ADEQUATE"]
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU W", unit_type: "ICU", bed_count: 12, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { u: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "MODERATE", patients_per_nurse: 3 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY", census_low: 4, census_moderate: 0, census_high: 0, census_critical: 0 }
              as: ChargeNurse
            - call: "POST /shifts"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY" }
              as: NurseAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /nurses"
              payload: { full_name: "W One", employment_type: "CORE", competencies: ["ICU"], base_hourly_rate_cents: 5000, charge_qualified: true, home_unit_id: "${u}" }
              as: NurseAdmin
              captures: { n1: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "W Two", employment_type: "CORE", competencies: ["ICU"], base_hourly_rate_cents: 5000, home_unit_id: "${u}" }
              as: NurseAdmin
              captures: { n2: $.data.id }
            - call: "POST /shifts/${sh}/assignments"
              payload: { nurse_id: "${n1}", is_charge: true, expected_shift_version: "${sh_v}" }
              as: ChargeNurse
              captures: { a1: $.data.id }
            - call: "GET /shifts/${sh}"
              as: NurseAdmin
              captures: { sh_v2: $.data.version }
            - call: "POST /shifts/${sh}/assignments"
              payload: { nurse_id: "${n2}", expected_shift_version: "${sh_v2}" }
              as: ChargeNurse
              captures: { a2: $.data.id }
            - call: "POST /assignments/${a1}/accept"
              as: StaffNurse
              as_user_id: "${n1}"
            - call: "POST /assignments/${a2}/accept"
              as: StaffNurse
              as_user_id: "${n2}"
          trigger:
            - call: "POST /incentive-offers"
              payload: { shift_id: "${sh}", premium_multiplier: 1.25 }
              as: NurseAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SHIFT_ADEQUATELY_STAFFED"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: assignment_initial_state_proposed
        claim_type: initial_state
        grounds: [state_machines.ShiftAssignment]
        distinguishing_aspect: "Direct creation starts PROPOSED with source DIRECT and scheduled_hours 12.0."
        test_recipe:
          setup: ["ICU unit with matrix; DAY shift 2026-08-10 required 2; CORE ICU nurse"]
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU A1", unit_type: "ICU", bed_count: 12, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { u: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "MODERATE", patients_per_nurse: 3 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY", census_low: 4, census_moderate: 0, census_high: 0, census_critical: 0 }
              as: ChargeNurse
            - call: "POST /shifts"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY" }
              as: NurseAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /nurses"
              payload: { full_name: "Init Ivy", employment_type: "CORE", competencies: ["ICU"], base_hourly_rate_cents: 5000, home_unit_id: "${u}" }
              as: NurseAdmin
              captures: { n1: $.data.id }
          trigger:
            - call: "POST /shifts/${sh}/assignments"
              payload: { nurse_id: "${n1}", expected_shift_version: "${sh_v}" }
              as: ChargeNurse
              captures: { st: $.data.status, src: $.data.source, hrs: $.data.scheduled_hours }
          assert:
            - "status == PROPOSED, source == DIRECT, scheduled_hours == 12.0"

      - name: accept_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.ShiftAssignment.PROPOSED_to_ACCEPTED, "errors[ERR_ASSIGNMENT_NOT_PROPOSED]"]
        distinguishing_aspect: "Repeating the same transition on a moved entity fails with the state error."
        test_recipe:
          setup: ["ICU unit with matrix; shift required 2; nurse with ACCEPTED assignment"]
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU A2", unit_type: "ICU", bed_count: 12, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { u: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "MODERATE", patients_per_nurse: 3 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY", census_low: 4, census_moderate: 0, census_high: 0, census_critical: 0 }
              as: ChargeNurse
            - call: "POST /shifts"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY" }
              as: NurseAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /nurses"
              payload: { full_name: "Ida Idem", employment_type: "CORE", competencies: ["ICU"], base_hourly_rate_cents: 5000, home_unit_id: "${u}" }
              as: NurseAdmin
              captures: { n1: $.data.id }
            - call: "POST /shifts/${sh}/assignments"
              payload: { nurse_id: "${n1}", expected_shift_version: "${sh_v}" }
              as: ChargeNurse
              captures: { a1: $.data.id }
            - call: "POST /assignments/${a1}/accept"
              as: StaffNurse
              as_user_id: "${n1}"
          trigger:
            - call: "POST /assignments/${a1}/accept"
              as: StaffNurse
              as_user_id: "${n1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ASSIGNMENT_NOT_PROPOSED (second accept on ACCEPTED assignment)"

      - name: confirm_from_proposed_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ShiftAssignment.ACCEPTED_to_CONFIRMED, "errors[ERR_ASSIGNMENT_NOT_ACCEPTED]"]
        distinguishing_aspect: "Skipping the accept step is rejected: confirm requires ACCEPTED."
        test_recipe:
          setup: ["ICU unit with matrix; shift required 2; nurse with PROPOSED assignment"]
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU A3", unit_type: "ICU", bed_count: 12, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { u: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "MODERATE", patients_per_nurse: 3 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY", census_low: 4, census_moderate: 0, census_high: 0, census_critical: 0 }
              as: ChargeNurse
            - call: "POST /shifts"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY" }
              as: NurseAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /nurses"
              payload: { full_name: "Skip Sam", employment_type: "CORE", competencies: ["ICU"], base_hourly_rate_cents: 5000, home_unit_id: "${u}" }
              as: NurseAdmin
              captures: { n1: $.data.id }
            - call: "POST /shifts/${sh}/assignments"
              payload: { nurse_id: "${n1}", expected_shift_version: "${sh_v}" }
              as: ChargeNurse
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /assignments/${a1}/confirm"
              as: ChargeNurse
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ASSIGNMENT_NOT_ACCEPTED"

      - name: complete_from_accepted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ShiftAssignment.CONFIRMED_to_COMPLETED, "errors[ERR_ASSIGNMENT_NOT_CONFIRMED]"]
        distinguishing_aspect: "Completion requires CONFIRMED; ACCEPTED is not enough."
        test_recipe:
          setup: ["ICU unit with matrix; shift required 2; nurse with ACCEPTED assignment"]
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU A4", unit_type: "ICU", bed_count: 12, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { u: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "MODERATE", patients_per_nurse: 3 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY", census_low: 4, census_moderate: 0, census_high: 0, census_critical: 0 }
              as: ChargeNurse
            - call: "POST /shifts"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY" }
              as: NurseAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /nurses"
              payload: { full_name: "Early Erin", employment_type: "CORE", competencies: ["ICU"], base_hourly_rate_cents: 5000, home_unit_id: "${u}" }
              as: NurseAdmin
              captures: { n1: $.data.id }
            - call: "POST /shifts/${sh}/assignments"
              payload: { nurse_id: "${n1}", expected_shift_version: "${sh_v}" }
              as: ChargeNurse
              captures: { a1: $.data.id }
            - call: "POST /assignments/${a1}/accept"
