              as: FacilityAdmin
              captures: { v1: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${c2}", plate: "DR2", size_class: "STANDARD", is_ev: false }
              as: FacilityAdmin
              captures: { v2: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${c1}", lot_id: "${lot_id}", vehicle_id: "${v1}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-01T10:00:00Z", scheduled_end: "2026-07-02T10:00:00Z", prepaid: false, expected_lot_version: "${lot_v0}" }
              as: FacilityAdmin
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: FacilityAdmin
              captures: { lot_v1: $.data.version }
            - call: "POST /reservations"
              payload: { customer_id: "${c2}", lot_id: "${lot_id}", vehicle_id: "${v2}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-01T11:00:00Z", scheduled_end: "2026-07-02T11:00:00Z", prepaid: false, expected_lot_version: "${lot_v1}" }
              as: FacilityAdmin
          trigger:
