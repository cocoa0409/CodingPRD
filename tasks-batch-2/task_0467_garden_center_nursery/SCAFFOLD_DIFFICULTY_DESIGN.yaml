              as: InventoryManager
              captures: { veh: $.data.id }
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "DG-10", name: "Brick", category: "DRY_GOOD", unit: "EACH", unit_price_cents: 300 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /accounts/${aid}/orders"
              payload: {}
              as: SalesClerk
              captures: { oa: $.data.id }
            - call: "POST /orders/${oa}/lines"
              payload: { product_id: "${pid}", qty: 1 }
              as: SalesClerk
            - call: "POST /orders/${oa}/deliveries"
              payload: { vehicle_id: "${veh}", window_start: "2026-04-02T10:00:00Z", window_end: "2026-04-02T11:00:00Z" }
              as: InventoryManager
            - call: "POST /accounts/${aid}/orders"
              payload: {}
              as: SalesClerk
              captures: { ob: $.data.id }
            - call: "POST /orders/${ob}/lines"
              payload: { product_id: "${pid}", qty: 1 }
              as: SalesClerk
          trigger:
            - call: "POST /orders/${ob}/deliveries"
              payload: { vehicle_id: "${veh}", window_start: "2026-04-02T11:15:00Z", window_end: "2026-04-02T12:00:00Z" }
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VEHICLE_WINDOW_CONFLICT (409): 11:15 < 11:30 buffer end"

      - name: promotion_plain_window_overlap
        grounds:
          - validations[priority=11.5]
          - entities.SeasonalPromotion.fields.category_scope
          - entities.SeasonalPromotion.fields.starts_at
        distinguishing_aspect: |
          PLAIN half-open [starts_at, ends_at) intersection (NO buffer) on the
          SeasonalPromotion resource: a second LIVE_PLANT promotion whose window
          overlaps an existing colliding-scope promotion is rejected with
          ERR_PROMOTION_WINDOW_CONFLICT — different interval semantics and a different
          resource than the buffered Vehicle rule.
        test_recipe:
          setup:
            - "Promotion #1 LIVE_PLANT [2026-04-01,2026-05-01). Promotion #2 ALL scope [2026-04-15,2026-04-20) overlaps and collides (ALL covers LIVE_PLANT)."
