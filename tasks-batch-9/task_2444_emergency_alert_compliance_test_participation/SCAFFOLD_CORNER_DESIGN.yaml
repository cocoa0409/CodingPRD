      - name: accessibility_pass_boundary_is_inclusive_at_exactly_one_point
        claim_type: threshold
        grounds:
          - "§1.3 calculations.accessibility_pass_evaluation formula 'accessibility_state = ACCESSIBILITY_PASSED if accessibility_deficiency_points <= ACCESSIBILITY_PASS_MAX_POINTS else ACCESSIBILITY_FAILED'"
          - "§1.3 constants CRAWL_MIN_SECONDS 60, CRAWL_POINT_RATE 0.05, TARGET_LUFS -24.0, LOUDNESS_TOLERANCE_LU 2.0, ACCESSIBILITY_PASS_MAX_POINTS 1.00"
          - "§1.2 state_machines.AlertEvent(accessibility_state) ACCESSIBILITY_UNVERIFIED -> ACCESSIBILITY_PASSED / ACCESSIBILITY_FAILED"
        distinguishing_aspect: "One second of crawl separates the two verdicts: 40 s gives exactly 1.00 point and PASSES (the comparison is <=), while 39 s gives 1.05 and FAILS — and with loudness exactly at the tolerance edge (-26.0 LUFS) the excess is 0.0, so no coupling term appears at either point."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; plan KS 2026-R1 activated with no relay rules; station KWEA."
            - "Three alerts with distinct originator_sequence values (no suppression, all UNMATCHED_OPTIONAL) so each can be measured independently."
            - "Worked numbers: 40 s -> shortfall 20, loudness_excess max(0.0, |-26.0 - -24.0| - 2.0) = 0.0, coupled min(3.00, 20*0.0*0.01) = 0.00, base 20*0.05 + 0.0*0.10 = 1.00, total round(min(8.00, 1.00), 2) = 1.00 <= 1.00 -> PASSED."
            - "39 s -> shortfall 21, base 1.05, total 1.05 > 1.00 -> FAILED. 41 s -> shortfall 19, base 0.95 -> PASSED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
