scaffold_corner_design:
- section: entities
  instances:
  - name: provider_creation_defaults_and_initial_state
    claim_type: defaults
    grounds:
    - entities.ServiceProvider.fields.provider_type
    - entities.ServiceProvider.fields.status
    - state_machines.ServiceProvider.initial_state
    distinguishing_aspect: Omitting provider_type yields AGREED and the provider starts UNDER_REVIEW with version 1.
    test_recipe:
      setup:
      - empty database; the logical clock reads its startup default 2026-09-01T00:00:00Z
      setup_api_calls: []
      trigger:
      - call: POST /route-settlement/service-providers
        payload:
          legal_name: Acme Route Services LLC
          tax_id: 27-1000001
        as: AccountManager
        captures:
          prov_a_id: $.data.id
          prov_a_v: $.data.version
      assert:
      - ServiceProvider.${prov_a_id}.provider_type == AGREED
      - ServiceProvider.${prov_a_id}.status == UNDER_REVIEW
      - ServiceProvider.${prov_a_id}.version == 1
      - ServiceProvider.${prov_a_id}.chargeback_outstanding_cents == 0
      - ServiceProvider.${prov_a_id}.brand_compliance_pct is 0.00 for the empty non-temporary fleet, whereas the empty driver roster reports 100.00
  - name: provider_creation_missing_tax_id_returns_invalid_request
    claim_type: required_fields
    grounds:
    - entities.ServiceProvider.fields.tax_id
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: Omitting the required tax_id fails with ERR_INVALID_REQUEST and creates no row.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /route-settlement/service-providers
        payload:
          legal_name: Acme Route Services LLC
        as: AccountManager
        captures:
          err_req: $.data.error_id
      assert:
      - the create returns ERR_INVALID_REQUEST
      - ServiceProvider listing with status=UNDER_REVIEW returns total_count 0
  - name: provider_retrieval_not_found
    claim_type: not_found
    grounds:
    - errors[ERR_PROVIDER_NOT_FOUND]
    - entities.ServiceProvider
    distinguishing_aspect: A GET on an unallocated provider id returns ERR_PROVIDER_NOT_FOUND.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: GET /route-settlement/service-providers/3f1a9c22-5b47-4d80-9e11-7c2d4a6f8b30
        payload: {}
        as: AccountManager
        captures:
          err_nf: $.data.error_id
      assert:
      - the read returns ERR_PROVIDER_NOT_FOUND
      - no response envelope carries a data object
  - name: service_area_listing_pagination_shape
    claim_type: listing
    grounds:
    - entities.ServiceArea
    - response_envelope.pagination_fields
    distinguishing_aspect: A list read exposes total_count and has_more and honours limit/offset.
    test_recipe:
      setup:
      - three service areas exist in state UNASSIGNED
      setup_api_calls:
      - call: POST /route-settlement/service-areas
        payload:
          area_code: TR11
          state_code: TN
          zip_prefix_low: '372'
          zip_prefix_high: '374'
          stop_capacity_weekly: 2000
        as: AccountManager
        captures:
          area_1_id: $.data.id
      - call: POST /route-settlement/service-areas
        payload:
          area_code: TR12
          state_code: TN
          zip_prefix_low: '375'
          zip_prefix_high: '377'
          stop_capacity_weekly: 1500
        as: AccountManager
        captures:
          area_2_id: $.data.id
      - call: POST /route-settlement/service-areas
        payload:
          area_code: TR13
          state_code: GA
          zip_prefix_low: '300'
          zip_prefix_high: '302'
          stop_capacity_weekly: 1200
        as: AccountManager
        captures:
          area_3_id: $.data.id
      trigger:
      - call: GET /route-settlement/service-areas
        payload:
          state_code: TN
          limit: 1
          offset: 0
        as: AccountManager
      assert:
      - the list returns exactly 1 ServiceArea row although 2 match the TN filter
      - total_count == 2 and has_more == true
      - the same read with limit 1 and offset 1 returns the other TN area and has_more == false
  - name: settlement_period_version_increments_on_every_mutation
    claim_type: system_fields
    grounds:
    - entities.SettlementPeriod.fields.version
    - state_machines.SettlementPeriod.OPEN_to_ACCRUAL_CLOSED
    - state_machines.SettlementPeriod.ACCRUAL_CLOSED_to_ACCRUAL_CLOSED
    distinguishing_aspect: version starts at 1 and advances by exactly one per mutation, including on the close-accrual self-loop.
    test_recipe:
      setup:
      - Provider A is APPROVED with an ACTIVE title over area A1
      - SettlementPeriod W1 is OPEN with version 1
      setup_api_calls:
      - call: POST /route-settlement/service-providers
        payload:
          legal_name: Acme Route Services LLC
          tax_id: 27-1000001
        as: AccountManager
        captures:
          prov_a_id: $.data.id
      - call: POST /route-settlement/service-areas
        payload:
          area_code: TR11
          state_code: TN
          zip_prefix_low: '372'
          zip_prefix_high: '374'
          stop_capacity_weekly: 2000
        as: AccountManager
        captures:
          area_a1_id: $.data.id
      - call: POST /route-settlement/insurance-policies
        payload:
          provider_id: ${prov_a_id}
          policy_type: AUTO_LIABILITY
          coverage_cents: 1000000
          expires_at: '2027-01-01T00:00:00Z'
        as: ServiceProvider
        as_user_id: ${prov_a_id}
        captures:
          pol_a_id: $.data.id
      - call: POST /route-settlement/insurance-policies/${pol_a_id}/verify
        payload: {}
        as: ComplianceOfficer
      - call: POST /route-settlement/service-providers/${prov_a_id}/approve
        payload: {}
        as: AccountManager
      - call: GET /route-settlement/service-providers/${prov_a_id}
        payload: {}
        as: SettlementAnalyst
        captures:
          prov_pre: $.data.version
      - call: POST /route-settlement/settlement-periods
        payload:
          provider_id: ${prov_a_id}
          service_area_id: ${area_a1_id}
          week_start_at: '2026-09-07T00:00:00Z'
          is_peak_week: false
          fuel_rate_cents_per_mile: 3
          expected_provider_version: ${prov_pre}
        as: SettlementAnalyst
        captures:
          per_w1_id: $.data.id
          per_w1_v: $.data.version
      - call: POST /route-settlement/settlement-periods/${per_w1_id}/stop-observations
        payload:
          observed_date: '2026-09-08T00:00:00Z'
          recorded_at: '2026-09-08T18:00:00Z'
          stops_count: 300
          packages_count: 250
          miles_driven: 0
          accessorial_cents: 2000
        as: SettlementAnalyst
      - call: POST /route-settlement/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-15T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /route-settlement/settlement-periods/${per_w1_id}/close-accrual
        payload: {}
        as: SettlementAnalyst
        captures:
          per_w1_v2: $.data.version
      - call: POST /route-settlement/settlement-periods/${per_w1_id}/close-accrual
        payload: {}
        as: SettlementAnalyst
      assert:
      - SettlementPeriod.${per_w1_id}.version after the first close == ${per_w1_v} + 1
      - SettlementPeriod.${per_w1_id}.version after the second close == ${per_w1_v} + 2
      - SettlementPeriod.${per_w1_id}.status == ACCRUAL_CLOSED after both calls
- section: state_machines
  instances:
  - name: peak_declaration_end_from_declared_returns_invalid_state
    claim_type: invalid_transition
    grounds:
    - state_machines.PeakSeasonDeclaration.DECLARED_to_ACTIVE
    - state_machines.PeakSeasonDeclaration.ACTIVE_to_ENDED
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: Ending a declaration that was never activated is rejected because ENDED is only reachable from ACTIVE.
    test_recipe:
      setup:
      - A service area exists and one peak-season declaration sits in DECLARED
      setup_api_calls:
      - call: POST /route-settlement/service-areas
        payload:
          area_code: TR11
          state_code: TN
          zip_prefix_low: '372'
          zip_prefix_high: '374'
          stop_capacity_weekly: 2000
        as: AccountManager
        captures:
          area_a1_id: $.data.id
      - call: POST /route-settlement/peak-season-declarations
        payload:
          service_area_id: ${area_a1_id}
          declaration_code: PEAK-2026-Q4
          starts_on: '2026-08-01T00:00:00Z'
          ends_on: '2026-12-31T00:00:00Z'
          authorized_vehicles: 5
          authorized_drivers: 4
        as: AccountManager
        captures:
          peak_id: $.data.id
      trigger:
      - call: POST /route-settlement/peak-season-declarations/${peak_id}/end
        payload: {}
        as: AccountManager
        captures:
          err_inv: $.data.error_id
      assert:
      - the end is refused with ERR_INVALID_STATE
      - PeakSeasonDeclaration.${peak_id}.status stays DECLARED
  - name: peak_declaration_terminal_lockdown_after_cancel
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.PeakSeasonDeclaration.DECLARED_to_CANCELED
    - errors[ERR_ALREADY_TERMINAL]
    distinguishing_aspect: From the CANCELED terminal state every trigger is refused with ERR_ALREADY_TERMINAL.
    test_recipe:
      setup:
      - A service area exists and one peak-season declaration has been canceled
      setup_api_calls:
      - call: POST /route-settlement/service-areas
        payload:
          area_code: TR11
          state_code: TN
          zip_prefix_low: '372'
          zip_prefix_high: '374'
          stop_capacity_weekly: 2000
        as: AccountManager
        captures:
          area_a1_id: $.data.id
      - call: POST /route-settlement/peak-season-declarations
        payload:
          service_area_id: ${area_a1_id}
          declaration_code: PEAK-2026-Q4
          starts_on: '2026-08-01T00:00:00Z'
          ends_on: '2026-12-31T00:00:00Z'
          authorized_vehicles: 5
          authorized_drivers: 4
        as: AccountManager
        captures:
          peak_id: $.data.id
      - call: POST /route-settlement/peak-season-declarations/${peak_id}/cancel
        payload: {}
        as: AccountManager
      trigger:
      - call: POST /route-settlement/peak-season-declarations/${peak_id}/activate
        payload: {}
        as: AccountManager
        captures:
          err_term: $.data.error_id
      assert:
      - the activate is refused with ERR_ALREADY_TERMINAL
      - PeakSeasonDeclaration.${peak_id}.status stays CANCELED
  - name: route_assignment_initial_state_is_draft
    claim_type: initial_state
    grounds:
    - state_machines.RouteAssignment.initial_state
    - entities.RouteAssignment.fields.status
    distinguishing_aspect: A newly acquired title is DRAFT and carries no occupancy_ends_at.
    test_recipe:
      setup:
      - Provider A is APPROVED and service area A1 is UNASSIGNED
      setup_api_calls:
      - call: POST /route-settlement/service-providers
        payload:
          legal_name: Acme Route Services LLC
          tax_id: 27-1000001
        as: AccountManager
        captures:
          prov_a_id: $.data.id
      - call: POST /route-settlement/service-areas
        payload:
          area_code: TR11
          state_code: TN
          zip_prefix_low: '372'
          zip_prefix_high: '374'
          stop_capacity_weekly: 2000
        as: AccountManager
        captures:
          area_a1_id: $.data.id
      - call: GET /route-settlement/service-areas/${area_a1_id}
        payload: {}
        as: AccountManager
        captures:
          area_occ_v: $.data.version
      trigger:
      - call: POST /route-settlement/route-assignments
        payload:
          service_area_id: ${area_a1_id}
          provider_id: ${prov_a_id}
          effective_date: '2026-09-03T00:00:00Z'
          transfer_price_cents: 0
          expected_service_area_version: ${area_occ_v}
        as: AccountManager
        captures:
          asg_a1_id: $.data.id
      assert:
      - RouteAssignment.${asg_a1_id}.status == DRAFT
      - RouteAssignment.${asg_a1_id}.occupancy_ends_at is null
      - ServiceArea.${area_a1_id}.status stays UNASSIGNED while the title is DRAFT
  - name: dispute_counter_round_budget_refused
    claim_type: idempotency
    grounds:
    - state_machines.Dispute.EVIDENCE_SUBMITTED_to_COUNTERED
    - state_machines.Dispute.COUNTERED_to_EVIDENCE_SUBMITTED
    - errors[ERR_NEGOTIATION_ROUND_LIMIT]
    - entities.Dispute.fields.rounds_used
    distinguishing_aspect: The fourth escalation round on one dispute is refused because rounds_used has reached DISPUTE_ROUND_LIMIT, leaving the dispute in EVIDENCE_SUBMITTED.
    test_recipe:
      setup:
      - Provider A is APPROVED with an ACTIVE title over area A1 and a RECONCILED week W1 whose net_amount_cents is 76900
