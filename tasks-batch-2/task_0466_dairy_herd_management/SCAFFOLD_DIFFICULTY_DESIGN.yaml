              as: Veterinarian
              captures: { be_id: $.data.id }
            - call: "POST /herds/breeding-events/${be_id}/confirm"
              payload: {}
              as: Veterinarian
            - call: "POST /herds/calving-events"
              payload: { animal_id: "${a_id}", breeding_event_id: "${be_id}", calving_date: "2026-02-01" }
              as: HerdManager
              captures: { lact_id: $.data.opened_lactation_id }
            - call: "POST /herds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds/test-day-records"
              payload: { lactation_id: "${lact_id}", test_date: "2026-06-08", milk_weight_lbs: 1000, fat_pct: 3.8, protein_pct: 3.1, scc_thousands: 180 }
              as: ParlorTech
            - call: "POST /herds/health-treatments"
              payload: { animal_id: "${a_id}", drug_name: "Mastitis Tx", administered_at: "2026-06-09T08:00:00Z", milk_withhold_hours: 96, meat_withdrawal_hours: 240 }
              as: Veterinarian
            - call: "POST /herds/coop-price-sheets"
              payload: { herd_id: "${h_id}", settlement_month: "2026-06", fat_price_per_lb: 2.805, protein_price_per_lb: 3.515, other_solids_price_per_lb: 0.405, ppd_per_cwt: 1.205, advance_rate_per_cwt: 16.00, hauling_rate_per_cwt: 0.85 }
              as: CoopSettlementAgent
              captures: { ps_id: $.data.id }
            - call: "POST /herds/milk-checks"
