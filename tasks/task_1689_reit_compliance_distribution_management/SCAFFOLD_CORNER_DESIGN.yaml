      - name: stale_version_on_dividend_create_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "concurrency_rules[dividend-declare-stale-reit]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC: creating a dividend with expected_reit_version captured before an intervening E&P adjustment create returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Reit R1 ACTIVE at version v1; a quarter exists; an EpAdjustment create bumps Reit.version"]
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "OCC REIT", ticker: "OCCR", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id, reit_v: $.data.version }
            - call: "POST /reit-compliance/quarters"
              payload: { reit_id: "${reit_id}", label: "2026-Q1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: ComplianceOfficer
              captures: { q1_id: $.data.id }
            - call: "POST /reit-compliance/ep-adjustments"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}", kind: "TAXABLE_INCOME", amount_cents: 1000, effective_date: "2026-01-10", expected_reit_version: "${reit_v}" }
              as: TaxDirector
          trigger:
            - call: "POST /reit-compliance/dividend-declarations"
              payload: { reit_id: "${reit_id}", taxable_year: 2026, amount_cents: 5000, declaration_date: "2026-03-01", record_date: "2026-03-10", payable_date: "2026-03-20", expected_reit_version: "${reit_v}" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION (http 412): ${reit_v} went stale when the adjustment create incremented Reit.version"

      - name: segregation_of_duties_on_dividend_declare
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "The same X-User-ID that approved a dividend cannot declare it: declare with X-User-ID == approved_by_director_id returns ERR_SEGREGATION_OF_DUTIES (403)."
        test_recipe:
          setup: ["Reit R1 ACTIVE; requirement POSTED; dividend D1 approved by user 'dual-hat'"]
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "SOD REIT", ticker: "SODR", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id, reit_v: $.data.version }
            - call: "POST /reit-compliance/distribution-requirements"
              payload: { reit_id: "${reit_id}", taxable_year: 2026, taxable_income_cents: 100000, net_capital_gain_cents: 0 }
              as: ComplianceOfficer
              captures: { req_id: $.data.id }
            - call: "POST /reit-compliance/distribution-requirements/${req_id}/post"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /reit-compliance/reits/${reit_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { rv1: $.data.version }
            - call: "POST /reit-compliance/dividend-declarations"
              payload: { reit_id: "${reit_id}", taxable_year: 2026, amount_cents: 10000, declaration_date: "2026-03-01", record_date: "2026-03-10", payable_date: "2026-03-20", expected_reit_version: "${rv1}" }
              as: ComplianceOfficer
              captures: { d1_id: $.data.id }
            - call: "POST /reit-compliance/dividend-declarations/${d1_id}/approve"
              payload: {}
              as: BoardDirector
              as_user_id: "dual-hat"
          trigger:
            - call: "POST /reit-compliance/dividend-declarations/${d1_id}/declare"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "dual-hat"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES (http 403)"

      - name: disclosure_submit_requires_locked_reference
        claim_type: precondition_enforcement
        grounds: [state_machines.ComplianceDisclosure.DRAFT_to_SUBMITTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Submitting a disclosure whose reference report is still DRAFT returns ERR_INVALID_STATE; after the report locks, submit succeeds."
        test_recipe:
          setup: ["Reit R1 ACTIVE; quarter with passing assets; AssetTestReport exists in DRAFT; disclosure references it"]
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
