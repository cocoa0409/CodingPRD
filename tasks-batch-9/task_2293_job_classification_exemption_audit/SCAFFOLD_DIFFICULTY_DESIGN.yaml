            - "ExemptionAnalysis.${an_at_id}.outcome == EXEMPT"
            - "ExemptionAnalysis.${an_below_id}.federal_pass == false"
            - "ExemptionAnalysis.${an_below_id}.outcome == NONEXEMPT"
            - "both analyses have primary_duty_pct_snapshot == 80.0, so the duty leg is not what separates them"

      - name: empty_and_parent_only_family_scores_zero_without_dividing_by_headcount
        grounds:
          - calculations.job_family_risk_score
          - entities.JobFamily.fields.family_headcount
          - entities.JobFamily.fields.risk_score
          - entities.JobFamily.fields.remediation_priority_rank
          - entities.JobFamily.fields.parent_family_id
        distinguishing_aspect: |
          Value domain: empty collection / zero denominator, a different domain from the money
          boundary above. The parent family has family_headcount 0, so the headcount-weighted
          mean has a zero denominator and the calculation must short-circuit to risk_score 0 with
          risk_variant EVIDENCE_WEIGHTED rather than raise, return null, or inherit the child's
          score. The child family holds a real Position that scores 96, which proves the parent's
          zero is a genuine short-circuit and not an absent computation.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; StateRule CA present."
            - "AuditProject in FIELDWORK (so remediation_priority_rank is still null everywhere)."
            - "Parent JobFamily with no Positions of its own."
            - "Child JobFamily whose parent_family_id is the parent, holding one Position with no DutyStatements and no interviews: annual_salary_cents 5500000 (weekly 105769, below the CA floor 132000), incumbent_count 2, avg_weekly_hours 47, so duty_risk 40 + salary_risk 30 + hours_risk 14 = 84, SCREENING premium 12, score 96."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
