        claim_type: priority_ordering
        grounds:
          - validations.priority_25
          - validations.priority_30
          - validations.priority_32
          - validations.priority_40
          - validations.priority_45
          - validations.priority_58
          - validations.priority_66
          - validations.priority_67
          - validations.priority_68
