      - name: event_and_claim_lifecycle_errors_are_each_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_EVENT_INVALID_STATE
          - errors.ERR_EVENT_CAPACITY_NOT_EXHAUSTED
          - errors.ERR_DUPLICATE_CLAIM
          - errors.ERR_EVENT_HAS_OPEN_CLAIMS
          - errors.ERR_CLAIM_NOT_FULLY_PAID
          - errors.ERR_CLAIM_ALREADY_SETTLED
          - errors.ERR_EVENT_CLOSED
        distinguishing_aspect: "Seven refusals sit along one event's life: re-declaring it, levying before capacity is exhausted, filing the same policy twice, closing it with a live claim, closing that claim before it is paid, reopening it after it is paid, and filing against it once it is CLOSED."
        test_recipe:
          setup:
            - "A 20,000,000-cent policy at deductible 10 (deductible_applied 2,000,000) bound at 2026-08-01, before any event is declared, so the moratorium never applies"
            - "One 2026 layer attaching at 100,000,000 and one event with retention 100,000,000 declared at the 2026-09-06 clock"
            - "The single claim reports structural 10,000,000 so its final payable is 8,000,000, well under the retention: uncovered_cents stays 0 and the event can never reach CAPACITY_EXHAUSTED"
          setup_api_calls:
            - call: "POST /eqp/insurers"
              payload: { name: "Lifecycle Insurance", naic_code: "22020", market_share_pct: 2.0 }
              as: ProgramAdmin
              captures: { ins_id: $.data.id }
