      - name: incident_buffer_window_touching_endpoints_collide
        grounds:
          - validations[priority=32]
          - errors[ERR_INCIDENT_WINDOW_BUFFER_CONFLICT]
          - entities.VendorIncident.fields.detected_at
          - entities.VendorIncident.fields.contained_at
          - calculations.vendor_risk_score
        distinguishing_aspect: |
          The incident buffer is the deliberate OPPOSITE convention from the catalog
          window: CLOSED intervals, a 72h buffer applied to the EXISTING row only,
          and touching endpoints COLLIDE. The uncontained existing row spans
          [08-02, 08-05] and expands to [07-30, 08-08], so a new row detected at
          exactly 2026-08-08T00:00:00Z conflicts while one second later succeeds --
          the exact mirror image of the adjacency rule tested in the sibling instance.
        test_recipe:
          setup:
            - "Clock at 2026-08-02T00:00:00Z, then advanced to 2026-08-09T00:00:00Z so both candidate detected_at values are in the past."
