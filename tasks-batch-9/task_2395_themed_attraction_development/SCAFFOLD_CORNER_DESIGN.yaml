# =============================================================================
# SCAFFOLD_CORNER_DESIGN — §1.9 breadth walk for
# task_2395_themed_attraction_development
#
# Taxonomy source: skills/prd-bench-scaffold-generator/references/
#                  claim-extraction-guide.md
# `section:` values are the guide's nine sections; `claim_type:` values are the
# per-section table rows. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN
# carry an `excluded_because:` stub and no test_recipe.
#
# Reference literals reused throughout (all pre-computed, never expressions):
#   RS_A = (vehicle_count 12, riders_per_vehicle 8, block_zone_count 14,
#           cycle_time_seconds 240, availability_pct 96, load_efficiency_pct 90,
#           show_stops_per_hour 1.5)
#         -> dispatch_interval_seconds 20, theoretical 1440, operational 1179
#   design_day_attendance 8000 x peak_hour_share 0.10 -> required 800
#   base_construction_cost_cents 400000000
#         -> design_fee 48000000, contingency 67200000, total 515200000
# =============================================================================
scaffold_corner_design:

  # ===================================================================
  # SECTION 1 — Entities
  # ===================================================================
  - section: entities
    instances:
      - name: attraction_project_creation_returns_the_full_row_with_computed_capacity
        claim_type: creation
        grounds:
          - endpoints[POST /attraction-projects]
          - entities.AttractionProject
          - calculations.project_required_hourly_capacity
          - response_envelope
        distinguishing_aspect: |
          A create with every required input returns 201 and the whole row inside the success envelope, with
          required_hourly_capacity_guests already computed as ceil(7501 * 0.1234) = ceil(925.6234) = 926 — the decimal
          product is ceiled, not truncated to 925 and not rounded to 926 by accident of binary float.
        test_recipe:
          setup:
            - "Empty database; the logical clock stays at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-EN1", name: "Skyward Saga", design_day_attendance: 7501, peak_hour_share: 0.1234, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id }
          assert:
            - "HTTP status == 201"
            - "response.meta.api_request_id is present and response.meta.api_request_timestamp is present"
            - "response.response_type == object"
            - "AttractionProject.${proj}.project_code == TAD-EN1"
            - "AttractionProject.${proj}.required_hourly_capacity_guests == 926"
            - "AttractionProject.${proj}.design_phase == BLUE_SKY"
            - "AttractionProject.${proj}.readiness_posture == OPEN"
            - "AttractionProject.${proj}.committed_cost_cents == 0"
            - "AttractionProject.${proj}.forecast_cost_cents == 0"
            - "AttractionProject.${proj}.queue_capacity_total_guests == 0"
            - "AttractionProject.${proj}.selected_ride_system_id == null"
            - "AttractionProject.${proj}.soft_open_validated == false"
            - "AttractionProject.${proj}.version == 1"

      - name: ride_system_retrieval_returns_stored_inputs_and_derived_capacity
        claim_type: retrieval
        grounds:
          - endpoints[GET /ride-systems/{id}]
          - calculations.ride_system_hourly_capacity
        distinguishing_aspect: |
          A plain read of one RideSystem returns both the stored inputs and all three derived fields for RS_A:
          dispatch_interval_seconds 20 (the MIN_DISPATCH_INTERVAL_SECONDS floor beats 240/14 = 17.14),
          theoretical_hourly_capacity_guests 1440 and operational_hourly_capacity_guests 1179 — a read never recomputes
          them differently from the create response.
        test_recipe:
          setup:
            - "One AttractionProject and one CANDIDATE RideSystem carrying the RS_A parameter set."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-EN2", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id }
            - call: "POST /ride-systems"
              payload: { project_id: "${proj}", vendor_name: "Vekoma Rides", system_type: "DARK_RIDE_TRACKLESS", vehicle_count: 12, riders_per_vehicle: 8, block_zone_count: 14, cycle_time_seconds: 240, availability_pct: 96, load_efficiency_pct: 90, show_stops_per_hour: 1.5 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { rs: $.data.id }
          trigger:
            - call: "GET /ride-systems/${rs}"
              as: RideEngineer
              as_user_id: "u-eng-1"
          assert:
            - "HTTP status == 200"
            - "response.data.id == ${rs}"
            - "response.data.project_id == ${proj}"
            - "response.data.system_type == DARK_RIDE_TRACKLESS"
            - "response.data.dispatch_interval_seconds == 20"
            - "response.data.theoretical_hourly_capacity_guests == 1440"
            - "response.data.operational_hourly_capacity_guests == 1179"
            - "response.data.status == CANDIDATE"
            - "response.data.safety_standard == null"
            - "response.data.version == 1"

      - name: attraction_project_listing_paginates_and_filters_by_design_phase
        claim_type: listing
        grounds:
          - endpoints[GET /attraction-projects]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          Three projects exist and one has been advanced to CONCEPT. limit=2&offset=0 returns 2 rows with
          total_count 3 and has_more true; offset=2 returns the last row with has_more false; design_phase=CONCEPT
          returns exactly the advanced project with total_count 1 — so the filter is applied before the page window,
          not after it.
        test_recipe:
          setup:
            - "Three AttractionProject rows TAD-EN3A, TAD-EN3B, TAD-EN3C; TAD-EN3B owns one ShowScene and has been advanced to CONCEPT."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-EN3A", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj_a: $.data.id }
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-EN3B", name: "Cavern of Echoes", design_day_attendance: 6000, peak_hour_share: 0.10, budget_ceiling_cents: 1200000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj_b: $.data.id, pvb0: $.data.version }
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-EN3C", name: "Harbour Flume", design_day_attendance: 4000, peak_hour_share: 0.10, budget_ceiling_cents: 900000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj_c: $.data.id }
            - call: "POST /show-scenes"
              payload: { project_id: "${proj_b}", scene_label: "Prologue", sequence_index: 1, duration_seconds: 180 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { sc_b: $.data.id }
            - call: "POST /attraction-projects/${proj_b}/advance-phase"
              payload: { to_phase: "CONCEPT", expected_project_version: "${pvb0}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
          trigger:
            - call: "GET /attraction-projects"
              payload: { limit: 2, offset: 0 }
              as: ProgramAdmin
              as_user_id: "u-adm-1"
            - call: "GET /attraction-projects"
              payload: { limit: 2, offset: 2 }
              as: ProgramAdmin
              as_user_id: "u-adm-1"
            - call: "GET /attraction-projects"
              payload: { design_phase: "CONCEPT" }
              as: ProgramAdmin
              as_user_id: "u-adm-1"
              captures: { filtered_code: "$.data[0].project_code" }
          assert:
            - "the first page returns exactly 2 AttractionProject rows with total_count == 3, limit == 2, offset == 0 and has_more == true"
            - "the second page returns exactly 1 AttractionProject row with total_count == 3, offset == 2 and has_more == false"
            - "the design_phase filtered read returns exactly 1 AttractionProject row with total_count == 1 and has_more == false"
            - "${filtered_code} == TAD-EN3B"
            - "response.response_type == array"

      - name: show_scene_read_with_unknown_id_not_found
        claim_type: not_found
        grounds:
          - validations[priority 4].ERR_SCENE_NOT_FOUND
          - endpoints[GET /show-scenes/{id}]
        distinguishing_aspect: |
          A syntactically valid but unknown UUID on GET /show-scenes/{id} returns 404 ERR_SCENE_NOT_FOUND, not 200 with
          an empty body and not the 422 the body-validation ladder would give — path existence is priority 4, ahead of
          every body check.
        test_recipe:
          setup:
            - "One AttractionProject exists but no ShowScene has been created, so no scene id can accidentally match."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-EN4", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id }
          trigger:
            - call: "GET /show-scenes/11111111-2222-4333-8444-555555555555"
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_SCENE_NOT_FOUND"
            - "response.response_type == error"
            - "response.data.message is a non-empty string"

      - name: ride_system_create_missing_required_cycle_time_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority 3].ERR_INVALID_REQUEST
          - endpoints[POST /ride-systems]
        distinguishing_aspect: |
          cycle_time_seconds carries source input with no default, so omitting it is refused at priority 3 with
          ERR_INVALID_REQUEST (422) and no RideSystem row is created — the server must not substitute a zero and derive
          a nonsense dispatch interval from it.
        test_recipe:
          setup:
            - "One AttractionProject and no RideSystem rows."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-EN5", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /ride-systems"
              payload: { project_id: "${proj}", vendor_name: "Vekoma Rides", system_type: "DARK_RIDE_TRACKLESS", vehicle_count: 12, riders_per_vehicle: 8, block_zone_count: 14, availability_pct: 96, load_efficiency_pct: 90, show_stops_per_hour: 1.5 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /attraction-projects/${proj}/ride-systems returns exactly 0 RideSystem rows"

      - name: virtual_queue_share_pct_defaults_to_zero_when_omitted
        claim_type: defaults
        grounds:
          - entities.AttractionProject.fields.virtual_queue_share_pct
          - endpoints[POST /attraction-projects]
        distinguishing_aspect: |
          Omitting virtual_queue_share_pct stores the declared default 0 (not null), while supplying 25 stores 25 — two
          projects created in the same run make the difference observable, and the omitted case must still be a number
          so the virtual_queue_allocation_guests derivation has an operand.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-EN6A", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj_default: $.data.id }
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-EN6B", name: "Skyward Saga Twin", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000, virtual_queue_share_pct: 25 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj_explicit: $.data.id }
          assert:
            - "AttractionProject.${proj_default}.virtual_queue_share_pct == 0"
            - "AttractionProject.${proj_explicit}.virtual_queue_share_pct == 25"
            - "GET /attraction-projects/${proj_default}/capacity-summary returns virtual_queue_allocation_guests == 0"

      - name: queue_segment_capacity_guests_is_computed_and_client_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.QueueSegment.fields.capacity_guests
          - calculations.queue_segment_capacity
          - endpoints[POST /queue-segments]
        distinguishing_aspect: |
          capacity_guests carries source computed and is absent from the POST /queue-segments input list, so a client
          value of 9999 in the body must not survive: the server either refuses the unknown field at priority 3 or
          stores floor((120 * 2.4) / 0.65) = 443. Either way the stored row never reads 9999, and
          queue_capacity_total_guests stays 0 while the segment is only PROPOSED.
        test_recipe:
          setup:
            - "One AttractionProject with no queue segments."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-EN7", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /queue-segments"
              payload: { project_id: "${proj}", segment_label: "Switchback A", length_meters: 120, width_meters: 2.4, routing_type: "STANDARD", position_index: 1, capacity_guests: 9999 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { err: $.data.error_id }
          assert:
            - "the request is refused at priority 3 with ${err} == ERR_INVALID_REQUEST and HTTP status 422 because capacity_guests is not a declared input of POST /queue-segments"
            - "no QueueSegment row is stored with capacity_guests == 9999"
            - "AttractionProject.${proj}.queue_capacity_total_guests == 0"
            - "GET /attraction-projects/${proj}/queue-segments returns exactly 0 QueueSegment rows"

      - name: budget_ledger_sequence_no_is_system_assigned_and_client_input_ignored
        claim_type: system_fields
        grounds:
          - entities.BudgetLedgerEntry.fields.sequence_no
          - endpoints[POST /budget-ledger-entries]
        distinguishing_aspect: |
          sequence_no carries source system and is minted from AttractionProject.ledger_sequence_high_water + 1, so a
          client-supplied sequence_no of 99 is not a declared input and is refused at priority 3; the first entry that
          is accepted takes sequence_no 1 regardless of what the client asked for.
        test_recipe:
          setup:
            - "One AttractionProject with an empty ledger, so ledger_sequence_high_water is 0."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-EN8", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, pv0: $.data.version }
          trigger:
            - call: "POST /budget-ledger-entries"
              payload: { project_id: "${proj}", entry_kind: "CHANGE_ORDER", amount_cents: 1000, memo: "Client tries to pick its own ordinal", expected_project_version: "${pv0}", sequence_no: 99 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { err: $.data.error_id }
            - call: "POST /budget-ledger-entries"
              payload: { project_id: "${proj}", entry_kind: "CHANGE_ORDER", amount_cents: 1000, memo: "Clean first ledger write", expected_project_version: "${pv0}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { led: $.data.id, led_seq: $.data.sequence_no }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "the refused write returns HTTP status 422 and leaves AttractionProject.${proj}.committed_cost_cents == 0"
            - "${led_seq} == 1"
            - "BudgetLedgerEntry.${led}.reversed == false"
            - "BudgetLedgerEntry.${led}.reversal_of_sequence_no == null"
            - "AttractionProject.${proj}.committed_cost_cents == 1000"

      - name: ride_system_unknown_system_type_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.RideSystem.fields.system_type
          - entities.RideSystem.fields.block_zone_count
          - validations[priority 3].ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Two independent schema constraints on the same endpoint: system_type must be a declared enum member (so
          SUSPENDED_MONORAIL is refused) and block_zone_count must be >= 2 (so 1 is refused). Both land on
          ERR_INVALID_REQUEST at priority 3 with 422, and neither creates a row.
        test_recipe:
          setup:
            - "One AttractionProject and no RideSystem rows."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-EN9", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /ride-systems"
              payload: { project_id: "${proj}", vendor_name: "Vekoma Rides", system_type: "SUSPENDED_MONORAIL", vehicle_count: 12, riders_per_vehicle: 8, block_zone_count: 14, cycle_time_seconds: 240, availability_pct: 96, load_efficiency_pct: 90, show_stops_per_hour: 1.5 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { err_enum: $.data.error_id }
            - call: "POST /ride-systems"
              payload: { project_id: "${proj}", vendor_name: "Vekoma Rides", system_type: "DARK_RIDE_TRACKLESS", vehicle_count: 12, riders_per_vehicle: 8, block_zone_count: 1, cycle_time_seconds: 240, availability_pct: 96, load_efficiency_pct: 90, show_stops_per_hour: 1.5 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { err_range: $.data.error_id }
          assert:
            - "${err_enum} == ERR_INVALID_REQUEST"
            - "${err_range} == ERR_INVALID_REQUEST"
            - "both refused creates return HTTP status 422"
            - "GET /attraction-projects/${proj}/ride-systems returns exactly 0 RideSystem rows"

      - name: budget_ledger_entry_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.BudgetLedgerEntry
          - endpoints[GET /budget-ledger-entries/{id}]
          - endpoints[POST /budget-ledger-entries/{id}/reverse]
        distinguishing_aspect: |
          BudgetLedgerEntry declares common_fields false: §1.5 exposes no PATCH and no DELETE for it, and a read returns
          no version field, so the only way to undo an entry is the compensating REVERSAL twin. reversed is the single
          mutable-looking flag and it is computed, never client-written.
        test_recipe:
          setup:
            - "One AttractionProject with a single CHANGE_ORDER entry of 1000 cents at sequence_no 1."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-EN10", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, pv0: $.data.version }
            - call: "POST /budget-ledger-entries"
              payload: { project_id: "${proj}", entry_kind: "CHANGE_ORDER", amount_cents: 1000, memo: "Immutability probe", expected_project_version: "${pv0}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { led: $.data.id }
          trigger:
            - call: "GET /budget-ledger-entries/${led}"
              as: ContractorPM
              as_user_id: "u-cpm-1"
          assert:
            - "HTTP status == 200"
            - "response.data carries project_id, entry_kind, amount_cents, memo, sequence_no, reversed and reversal_of_sequence_no"
            - "response.data carries no version field"
            - "response.data.amount_cents == 1000"
            - "response.data.sequence_no == 1"
            - "response.data.reversed == false"
            - "§1.5 declares no PATCH and no DELETE on /budget-ledger-entries/{id}; POST /budget-ledger-entries/{id}/reverse is the only mutation path"

      - name: effect_cue_create_with_unknown_parent_scene_not_found
        claim_type: parent_relationships
        grounds:
          - entities.EffectCue.fields.scene_id
          - validations[priority 5].ERR_SCENE_NOT_FOUND
          - endpoints[POST /effect-cues]
        distinguishing_aspect: |
          EffectCue's parent is ShowScene through the body field scene_id, and the body-FK existence check sits at
          priority 5 — ahead of the priority 7 cue/scene state check — so an unknown scene_id returns 404
          ERR_SCENE_NOT_FOUND rather than a 409 about cue state.
        test_recipe:
          setup:
            - "One AttractionProject with one DRAFT ShowScene, so a real scene exists but is not the one addressed."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-EN11", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id }
            - call: "POST /show-scenes"
              payload: { project_id: "${proj}", scene_label: "Prologue", sequence_index: 1, duration_seconds: 180 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { sc1: $.data.id }
          trigger:
            - call: "POST /effect-cues"
              payload: { scene_id: "99999999-8888-4777-8666-555555555555", cue_label: "Orphan Cue", discipline_channel: "LIGHTING", offset_ms: 0, duration_ms: 1000 }
              as: ShowProgrammer
              as_user_id: "u-prog-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_SCENE_NOT_FOUND"
            - "GET /show-scenes/${sc1}/effect-cues returns exactly 0 EffectCue rows"

      - name: design_package_citing_a_ride_system_of_another_project_is_rejected
        claim_type: flat
        grounds:
          - complexity_profile.entity_topology
          - validations[priority 17].ERR_RIDE_SYSTEM_PROJECT_MISMATCH
          - endpoints[POST /design-packages]
        distinguishing_aspect: |
          The topology is flat, so cross-reference integrity is a validation rather than a URL-nesting guarantee: both
          project_id and ride_system_id resolve to existing rows, yet the pair is incoherent because the ride system
          belongs to the other project. That must yield 422 ERR_RIDE_SYSTEM_PROJECT_MISMATCH at priority 17, not a 404
          (the row exists) and not a silently created package.
        test_recipe:
          setup:
            - "Two AttractionProject rows, each with its own CANDIDATE RideSystem."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-EN12A", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj_a: $.data.id, pva0: $.data.version }
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-EN12B", name: "Cavern of Echoes", design_day_attendance: 6000, peak_hour_share: 0.10, budget_ceiling_cents: 1200000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj_b: $.data.id }
            - call: "POST /ride-systems"
              payload: { project_id: "${proj_b}", vendor_name: "Intamin Rides", system_type: "OMNIMOVER", vehicle_count: 6, riders_per_vehicle: 4, block_zone_count: 6, cycle_time_seconds: 200, availability_pct: 95, load_efficiency_pct: 85, show_stops_per_hour: 1.0 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { rs_b: $.data.id }
          trigger:
            - call: "POST /design-packages"
              payload: { project_id: "${proj_a}", ride_system_id: "${rs_b}", package_label: "Cross-wired Package", discipline_scope: "INTEGRATED", base_construction_cost_cents: 400000000, expected_project_version: "${pva0}" }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err} == ERR_RIDE_SYSTEM_PROJECT_MISMATCH"
            - "GET /design-packages?project_id=${proj_a} returns exactly 0 DesignPackage rows"
            - "AttractionProject.${proj_a}.version == 1"

  # ===================================================================
  # SECTION 2 — State Machines
  # ===================================================================
  - section: state_machines
    instances:
      - name: queue_segment_accept_moves_proposed_to_accepted_and_lifts_the_running_total
        claim_type: valid_transition
        grounds:
          - state_machines.QueueSegment.PROPOSED_to_ACCEPTED
          - endpoints[POST /queue-segments/{id}/accept]
        distinguishing_aspect: |
          The happy-path transition fires all three declared side effects in one request: status becomes ACCEPTED, the
          project's queue_capacity_total_guests rises from 0 to exactly the segment's own 443 guests, and the project's
          version increments — a PROPOSED segment contributes nothing to the running total until this call.
        test_recipe:
          setup:
            - "One AttractionProject at BLUE_SKY with one PROPOSED STANDARD QueueSegment of 120 m x 2.4 m => floor(288.00 / 0.65) = 443 guests."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-SM1", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, pv0: $.data.version, total_before: $.data.queue_capacity_total_guests }
            - call: "POST /queue-segments"
              payload: { project_id: "${proj}", segment_label: "Switchback A", length_meters: 120, width_meters: 2.4, routing_type: "STANDARD", position_index: 1 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { qs: $.data.id }
          trigger:
            - call: "POST /queue-segments/${qs}/accept"
              payload: { expected_project_version: "${pv0}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
          assert:
            - "HTTP status == 200"
            - "${total_before} == 0"
            - "QueueSegment.${qs}.status == ACCEPTED"
            - "QueueSegment.${qs}.capacity_guests == 443"
            - "AttractionProject.${proj}.queue_capacity_total_guests == 443"
            - "AttractionProject.${proj}.version == 2"

      - name: advance_to_concept_without_any_show_scene_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.AttractionProject.design_phase.BLUE_SKY_to_CONCEPT
          - validations[priority 49].ERR_PHASE_PRECONDITION_UNMET
          - endpoints[POST /attraction-projects/{id}/advance-phase]
        distinguishing_aspect: |
          to_phase CONCEPT is the correct immediate successor of BLUE_SKY, so the priority 10 successor check passes and
          the request is refused instead by the content precondition at priority 49 with ERR_PHASE_PRECONDITION_UNMET —
          a fresh project cannot leave blue sky before a single show scene exists. Creating one scene flips the identical
          request to success.
        test_recipe:
          setup:
            - "One AttractionProject at BLUE_SKY with no ShowScene rows."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-SM2", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, pv0: $.data.version }
          trigger:
            - call: "POST /attraction-projects/${proj}/advance-phase"
              payload: { to_phase: "CONCEPT", expected_project_version: "${pv0}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { err: $.data.error_id }
            - call: "POST /show-scenes"
              payload: { project_id: "${proj}", scene_label: "Prologue", sequence_index: 1, duration_seconds: 180 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { sc1: $.data.id }
            - call: "POST /attraction-projects/${proj}/advance-phase"
              payload: { to_phase: "CONCEPT", expected_project_version: "${pv0}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
          assert:
            - "${err} == ERR_PHASE_PRECONDITION_UNMET"
            - "the refused advance returns HTTP status 409 and leaves AttractionProject.${proj}.design_phase == BLUE_SKY"
            - "the refused advance does not increment AttractionProject.${proj}.version"
            - "ShowScene.${sc1}.status == DRAFT"
            - "AttractionProject.${proj}.design_phase == CONCEPT"
            - "AttractionProject.${proj}.version == 2"

      - name: advance_to_production_skipping_design_development_is_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.AttractionProject.design_phase
          - validations[priority 10].ERR_PHASE_SEQUENCE_INVALID
          - endpoints[POST /attraction-projects/{id}/advance-phase]
        distinguishing_aspect: |
          The design_phase ladder is forward-only and single-step. Asking a SCHEMATIC project for PRODUCTION skips
          DESIGN_DEVELOPMENT, so priority 10 refuses it with ERR_PHASE_SEQUENCE_INVALID before any content precondition
          is consulted — the answer is the sequencing error, not the ERR_PHASE_PRECONDITION_UNMET that the missing
          approved package would otherwise produce. Asking for BLUE_SKY again is refused for the same reason, so the
          ladder never runs backwards.
        test_recipe:
          setup:
            - "Project driven to SCHEMATIC: two SEQUENCED scenes and RS_A selected."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-SM3", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, pv0: $.data.version }
            - call: "POST /show-scenes"
              payload: { project_id: "${proj}", scene_label: "Prologue", sequence_index: 1, duration_seconds: 180 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { sc1: $.data.id }
            - call: "POST /show-scenes"
              payload: { project_id: "${proj}", scene_label: "Chase", sequence_index: 2, duration_seconds: 120, follows_scene_id: "${sc1}" }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { sc2: $.data.id }
            - call: "POST /ride-systems"
              payload: { project_id: "${proj}", vendor_name: "Vekoma Rides", system_type: "DARK_RIDE_TRACKLESS", vehicle_count: 12, riders_per_vehicle: 8, block_zone_count: 14, cycle_time_seconds: 240, availability_pct: 96, load_efficiency_pct: 90, show_stops_per_hour: 1.5 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { rs: $.data.id }
            - call: "POST /attraction-projects/${proj}/advance-phase"
              payload: { to_phase: "CONCEPT", expected_project_version: "${pv0}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { pv1: $.data.version }
            - call: "POST /ride-systems/${rs}/select"
              payload: { expected_project_version: "${pv1}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /show-scenes/${sc1}/sequence"
              payload: { sequence_index: 1 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
            - call: "POST /show-scenes/${sc2}/sequence"
              payload: { sequence_index: 2, follows_scene_id: "${sc1}" }
              as: CreativeDirector
              as_user_id: "u-cd-1"
            - call: "GET /attraction-projects/${proj}"
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { pv2: $.data.version }
            - call: "POST /attraction-projects/${proj}/advance-phase"
              payload: { to_phase: "SCHEMATIC", expected_project_version: "${pv2}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { pv3: $.data.version }
          trigger:
            - call: "POST /attraction-projects/${proj}/advance-phase"
              payload: { to_phase: "PRODUCTION", expected_project_version: "${pv3}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { err_skip: $.data.error_id }
            - call: "POST /attraction-projects/${proj}/advance-phase"
              payload: { to_phase: "BLUE_SKY", expected_project_version: "${pv3}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { err_back: $.data.error_id }
          assert:
            - "${err_skip} == ERR_PHASE_SEQUENCE_INVALID"
            - "${err_skip} != ERR_PHASE_PRECONDITION_UNMET"
            - "${err_back} == ERR_PHASE_SEQUENCE_INVALID"
            - "both refused advances return HTTP status 409"
            - "AttractionProject.${proj}.design_phase == SCHEMATIC"
            - "AttractionProject.${proj}.version == ${pv3}"

      - name: queue_segment_retire_before_accept_returns_state_invalid
        claim_type: invalid_transitions
        grounds:
          - state_machines.QueueSegment.ACCEPTED_to_RETIRED
          - validations[priority 7].ERR_QUEUE_SEGMENT_STATE_INVALID
          - endpoints[POST /queue-segments/{id}/retire]
        distinguishing_aspect: |
          retire is declared only from ACCEPTED, so calling it on a PROPOSED segment is refused at priority 7 with
          ERR_QUEUE_SEGMENT_STATE_INVALID even though the OCC token is current — and, critically, the project's
          queue_capacity_total_guests must stay 0 rather than going negative by subtracting a capacity that was never
          added.
        test_recipe:
          setup:
            - "One AttractionProject with one PROPOSED STANDARD QueueSegment of 443 guests."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-SM4", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, pv0: $.data.version }
            - call: "POST /queue-segments"
              payload: { project_id: "${proj}", segment_label: "Switchback A", length_meters: 120, width_meters: 2.4, routing_type: "STANDARD", position_index: 1 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { qs: $.data.id }
          trigger:
            - call: "POST /queue-segments/${qs}/retire"
              payload: { expected_project_version: "${pv0}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_QUEUE_SEGMENT_STATE_INVALID"
            - "QueueSegment.${qs}.status == PROPOSED"
            - "AttractionProject.${proj}.queue_capacity_total_guests == 0"
            - "AttractionProject.${proj}.version == 1"

      - name: design_package_starts_in_draft_with_zero_revision_round
        claim_type: initial_state
        grounds:
          - state_machines.DesignPackage.initial_state
          - entities.DesignPackage.fields.revision_round
          - calculations.design_package_cost_of_work
          - endpoints[POST /design-packages]
        distinguishing_aspect: |
          A newly created package is DRAFT with revision_round 0 and, crucially, pinned_ride_system_version,
          submitted_by_user_id and approved_by_user_id all null — the pin is taken on submit, not on create — while the
          tiered cost fields are already final: 400000000 base gives design_fee 48000000, contingency
          floor-free 0.15 * (400000000 + 48000000) = 67200000 and total 515200000.
        test_recipe:
          setup:
            - "One AttractionProject at BLUE_SKY with one CANDIDATE RideSystem (RS_A)."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-SM5", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, pv0: $.data.version }
            - call: "POST /ride-systems"
              payload: { project_id: "${proj}", vendor_name: "Vekoma Rides", system_type: "DARK_RIDE_TRACKLESS", vehicle_count: 12, riders_per_vehicle: 8, block_zone_count: 14, cycle_time_seconds: 240, availability_pct: 96, load_efficiency_pct: 90, show_stops_per_hour: 1.5 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { rs: $.data.id }
          trigger:
            - call: "POST /design-packages"
              payload: { project_id: "${proj}", ride_system_id: "${rs}", package_label: "Show Set Release 1", discipline_scope: "SHOW_SET", base_construction_cost_cents: 400000000, expected_project_version: "${pv0}" }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { pkg: $.data.id }
          assert:
            - "HTTP status == 201"
            - "DesignPackage.${pkg}.status == DRAFT"
            - "DesignPackage.${pkg}.revision_round == 0"
            - "DesignPackage.${pkg}.pinned_ride_system_version == null"
            - "DesignPackage.${pkg}.submitted_by_user_id == null"
            - "DesignPackage.${pkg}.approved_by_user_id == null"
            - "DesignPackage.${pkg}.design_fee_cents == 48000000"
            - "DesignPackage.${pkg}.contingency_cents == 67200000"
            - "DesignPackage.${pkg}.total_cost_of_work_cents == 515200000"
            - "DesignPackage.${pkg}.version == 1"
            - "AttractionProject.${proj}.committed_cost_cents == 0"

      - name: verified_effect_cue_is_terminal_and_admits_no_second_verify
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.EffectCue.terminal_states
          - validations[priority 7].ERR_CUE_STATE_INVALID
          - endpoints[POST /effect-cues/{id}/verify]
        distinguishing_aspect: |
          VERIFIED is EffectCue's only terminal state and the machine declares no outbound transition from it, so a
          second verify is refused at priority 7 with ERR_CUE_STATE_INVALID rather than returning 200 idempotently —
          and the cue's version must not move on the refused call.
        test_recipe:
          setup:
            - "One AttractionProject, one DRAFT ShowScene and one VERIFIED LIGHTING EffectCue on that scene."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-SM6", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id }
            - call: "POST /show-scenes"
              payload: { project_id: "${proj}", scene_label: "Prologue", sequence_index: 1, duration_seconds: 180 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { sc1: $.data.id }
            - call: "POST /effect-cues"
              payload: { scene_id: "${sc1}", cue_label: "Prologue Wash", discipline_channel: "LIGHTING", offset_ms: 0, duration_ms: 2000 }
              as: ShowProgrammer
              as_user_id: "u-prog-1"
              captures: { cue: $.data.id }
            - call: "POST /effect-cues/${cue}/verify"
              payload: {}
              as: ShowProgrammer
              as_user_id: "u-prog-1"
              captures: { cue_version_after_verify: $.data.version }
          trigger:
            - call: "POST /effect-cues/${cue}/verify"
              payload: {}
              as: ShowProgrammer
              as_user_id: "u-prog-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_CUE_STATE_INVALID"
            - "${cue_version_after_verify} == 2"
            - "EffectCue.${cue}.status == VERIFIED"
            - "EffectCue.${cue}.version == 2"

      - name: queue_segment_second_accept_returns_state_invalid_and_does_not_double_count
        claim_type: idempotency
        grounds:
          - state_machines.QueueSegment.PROPOSED_to_ACCEPTED
          - validations[priority 7].ERR_QUEUE_SEGMENT_STATE_INVALID
          - endpoints[POST /queue-segments/{id}/accept]
        distinguishing_aspect: |
          Replaying accept with a freshly re-read, perfectly valid expected_project_version is still refused, so the
          endpoint is not idempotent-by-retry: the second call returns ERR_QUEUE_SEGMENT_STATE_INVALID and
          queue_capacity_total_guests stays 443 instead of double-counting to 886.
        test_recipe:
          setup:
            - "One AttractionProject with one ACCEPTED STANDARD QueueSegment of 443 guests; the project's version has been re-read after the accept."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-SM7", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, pv0: $.data.version }
            - call: "POST /queue-segments"
              payload: { project_id: "${proj}", segment_label: "Switchback A", length_meters: 120, width_meters: 2.4, routing_type: "STANDARD", position_index: 1 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { qs: $.data.id }
            - call: "POST /queue-segments/${qs}/accept"
              payload: { expected_project_version: "${pv0}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "GET /attraction-projects/${proj}"
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { pv1: $.data.version, total_after_first: $.data.queue_capacity_total_guests }
          trigger:
            - call: "POST /queue-segments/${qs}/accept"
              payload: { expected_project_version: "${pv1}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { err: $.data.error_id }
          assert:
            - "${total_after_first} == 443"
            - "HTTP status == 409"
            - "${err} == ERR_QUEUE_SEGMENT_STATE_INVALID"
            - "${err} != ERR_STALE_PROJECT_VERSION"
            - "AttractionProject.${proj}.queue_capacity_total_guests == 443"
            - "AttractionProject.${proj}.version == ${pv1}"

      - name: design_package_revision_loop_is_cyclic_with_a_counter
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.DesignPackage.REVISION_REQUESTED_to_SUBMITTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / design_package_revision_loop_reenters_submitted_twice
          rationale: "That §1.8 instance walks SUBMITTED -> REVISION_REQUESTED -> SUBMITTED twice and asserts revision_round == 2, the re-pinned ride system version and the unchanged committed cost, which is exactly the cyclic-shape claim."

      - name: package_approval_side_effects_mint_commitment_and_supersede_prior
        claim_type: side_effect_execution
        grounds:
          - state_machines.DesignPackage.SUBMITTED_to_APPROVED
          - state_machines.DesignPackage.APPROVED_to_SUPERSEDED
        excluded_because:
          difficulty_instance: transitive_cascade / package_approval_supersedes_prior_package_and_stacks_commitment
          rationale: "That §1.8 instance asserts every declared side effect of approve — the SUPERSEDED cascade on the prior package, the minted COMMITMENT row with its sequence_no, the recomputed committed cost and the recomputed posture."

      - name: freeze_cascade_holds_only_non_terminal_scenes
        claim_type: cascade_down
        grounds:
          - state_machines.ShowScene.SEQUENCED_to_HELD
          - state_machines.AttractionProject.readiness_posture
        excluded_because:
          difficulty_instance: transitive_cascade / critical_finding_cascade_freezes_program_and_holds_sequenced_scenes
          rationale: "That §1.8 instance drives a CRITICAL finding through review, project counters and posture into the per-scene HELD cascade and asserts held_from_status and hold_reason on each affected scene."

      - name: ve_adoption_adjusts_the_project_across_aggregates
        claim_type: cross_entity
        grounds:
          - state_machines.ValueEngineeringItem.UNDER_REVIEW_to_ADOPTED
        excluded_because:
          difficulty_instance: transitive_cascade / ve_adoption_cascade_lifts_budget_freeze_and_releases_held_scenes
          rationale: "That §1.8 instance asserts the VE_SAVING ledger row, the recomputed committed cost, the posture leaving FROZEN and the released scenes — the full cross-entity adjustment chain."

      - name: ledger_row_and_project_committed_cost_stay_reconciled
        claim_type: ledger_sync
        grounds:
          - calculations.project_budget_position
          - entities.BudgetLedgerEntry
        excluded_because:
          difficulty_instance: compensating_invariant / ledger_reversal_restores_committed_cost_and_posture_without_drift
          rationale: "That §1.8 instance asserts committed_cost_cents equals the summed ledger amounts before, after and following the compensating reversal."

      - name: retire_reverses_the_accept_side_effect_without_drift
        claim_type: compensation
        grounds:
          - state_machines.QueueSegment.ACCEPTED_to_RETIRED
        excluded_because:
          difficulty_instance: compensating_invariant / queue_retire_restores_queue_capacity_total_without_drift
          rationale: "That §1.8 instance asserts the exact 539 -> 443 restoration, the retained capacity_guests on the retired row and the refusal of a second retire."

      - name: hold_release_target_depends_on_the_held_from_status
        claim_type: conditional_cascade
        grounds:
          - state_machines.ShowScene.HELD_to_PROGRAMMED
          - state_machines.ShowScene.HELD_to_SEQUENCED
        excluded_because:
          difficulty_instance: non_linear_state_machine / show_scene_hold_and_release_restores_programmed_status
          rationale: "That §1.8 instance asserts that release restores each scene to the status recorded in held_from_status rather than to a fixed state, which is the conditional arm of the cascade."

      - name: commission_is_guarded_by_another_entity_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.RideSystem.ENGINEERED_to_COMMISSIONED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / commission_blocked_until_a_cleared_review_covers_the_commissioned_ride_system
          rationale: "That §1.8 instance is precisely the guarded-transition claim: A -> B only while a CLEARED SafetyReview covers an APPROVED package naming this ride system."

  # ===================================================================
  # SECTION 3 — Calculations
  # ===================================================================
  - section: calculations
    instances:
      - name: queue_segment_capacity_applies_the_routing_class_area_constants
        claim_type: constants_applied
        grounds:
          - calculations.queue_segment_capacity
          - entities.QueueSegment.fields.capacity_guests
          - endpoints[POST /queue-segments]
        distinguishing_aspect: |
          Three segments of identical 100 m x 2.0 m footprint yield three different capacities purely from the
          routing_type area constant: STANDARD at 0.65 sqm gives floor(200 / 0.65) = 307, ACCESSIBLE at 1.5 sqm gives
          floor(200 / 1.5) = 133 and VIRTUAL_RETURN at 0.9 sqm gives floor(200 / 0.9) = 222. Each division is inexact,
          so the floor is doing visible work (307.69, 133.33, 222.22) and a rounding implementation would return 308,
          133 and 222 — the STANDARD row alone separates the two.
        test_recipe:
          setup:
            - "One AttractionProject at BLUE_SKY with no queue segments yet."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-CA1", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /queue-segments"
              payload: { project_id: "${proj}", segment_label: "Standard Switchback", length_meters: 100, width_meters: 2.0, routing_type: "STANDARD", position_index: 1 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { qs_std: $.data.id, cap_std: $.data.capacity_guests }
            - call: "POST /queue-segments"
              payload: { project_id: "${proj}", segment_label: "Accessible Bypass", length_meters: 100, width_meters: 2.0, routing_type: "ACCESSIBLE", position_index: 2 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { qs_acc: $.data.id, cap_acc: $.data.capacity_guests }
            - call: "POST /queue-segments"
              payload: { project_id: "${proj}", segment_label: "Virtual Return Lane", length_meters: 100, width_meters: 2.0, routing_type: "VIRTUAL_RETURN", position_index: 3 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { qs_vq: $.data.id, cap_vq: $.data.capacity_guests }
          assert:
            - "${cap_std} == 307"
            - "${cap_acc} == 133"
            - "${cap_vq} == 222"
            - "QueueSegment.${qs_std}.status == PROPOSED"
            - "QueueSegment.${qs_acc}.status == PROPOSED"
            - "QueueSegment.${qs_vq}.status == PROPOSED"
            - "AttractionProject.${proj}.queue_capacity_total_guests == 0"

      - name: ve_item_net_saving_rounds_a_half_cent_tie_upward
        claim_type: precision
        grounds:
          - calculations.ve_item_net_saving
          - entities.ValueEngineeringItem.fields.net_saving_cents
          - state_machines.ValueEngineeringItem.PROPOSED_to_UNDER_REVIEW
          - endpoints[POST /value-engineering-items/{id}/open-review]
        distinguishing_aspect: |
          gross 70000022 at 25 percent retention is exactly 17500005.5 cents — a perfect half-cent tie. round_half_up
          must resolve it to 17500006, so net_saving_cents is 17500006 - 1000000 = 16500006. Banker's rounding would
          return 17500005 and a net of 16500005, and truncation would agree with banker's here, so the single trailing
          cent is the whole test. net_saving_cents is also null while the item is PROPOSED and only materialises on
          open-review, which the same recipe pins.
        test_recipe:
          setup:
            - "Project driven to SCHEMATIC (two SEQUENCED scenes, RS_A selected) so that open-review is inside its phase window."
            - "One PROPOSED ValueEngineeringItem with gross_saving_cents 70000022, rework_loss_pct 75, implementation_cost_cents 1000000 and scope_impact_delta_cents -69000022."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-CA2", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, pv0: $.data.version }
            - call: "POST /show-scenes"
              payload: { project_id: "${proj}", scene_label: "Prologue", sequence_index: 1, duration_seconds: 180 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { sc1: $.data.id }
            - call: "POST /show-scenes"
              payload: { project_id: "${proj}", scene_label: "Chase", sequence_index: 2, duration_seconds: 120, follows_scene_id: "${sc1}" }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { sc2: $.data.id }
            - call: "POST /ride-systems"
              payload: { project_id: "${proj}", vendor_name: "Vekoma Rides", system_type: "DARK_RIDE_TRACKLESS", vehicle_count: 12, riders_per_vehicle: 8, block_zone_count: 14, cycle_time_seconds: 240, availability_pct: 96, load_efficiency_pct: 90, show_stops_per_hour: 1.5 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { rs: $.data.id }
            - call: "POST /attraction-projects/${proj}/advance-phase"
              payload: { to_phase: "CONCEPT", expected_project_version: "${pv0}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { pv1: $.data.version }
            - call: "POST /ride-systems/${rs}/select"
              payload: { expected_project_version: "${pv1}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /show-scenes/${sc1}/sequence"
              payload: { sequence_index: 1 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
            - call: "POST /show-scenes/${sc2}/sequence"
              payload: { sequence_index: 2, follows_scene_id: "${sc1}" }
              as: CreativeDirector
              as_user_id: "u-cd-1"
            - call: "GET /attraction-projects/${proj}"
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { pv2: $.data.version }
            - call: "POST /attraction-projects/${proj}/advance-phase"
              payload: { to_phase: "SCHEMATIC", expected_project_version: "${pv2}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /value-engineering-items"
              payload: { project_id: "${proj}", title: "Swap practical fog for media haze", gross_saving_cents: 70000022, rework_loss_pct: 75, implementation_cost_cents: 1000000, capacity_impact_guests_per_hour: 0, scope_impact_delta_cents: -69000022 }
              as: ContractorPM
              as_user_id: "u-cpm-1"
              captures: { ve: $.data.id, net_before: $.data.net_saving_cents }
          trigger:
            - call: "POST /value-engineering-items/${ve}/open-review"
              payload: {}
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { net_after: $.data.net_saving_cents }
          assert:
            - "${net_before} == null"
            - "HTTP status == 200"
            - "${net_after} == 16500006"
            - "${net_after} != 16500005"
            - "ValueEngineeringItem.${ve}.status == UNDER_REVIEW"
            - "GET /attraction-projects/${proj}/budget-position returns ve_program_net_savings_cents == 0"

      - name: spare_stock_recommendation_applies_criticality_multiplier_and_floor
        claim_type: correct_result
        grounds:
          - calculations.spare_stock_recommendation
          - entities.MaintenanceItem.fields.recommended_stock_qty
          - endpoints[POST /maintenance-items]
        distinguishing_aspect: |
          Three rows exercise all three branches of the same formula at an identical 100-day lead time. A SHOW_CRITICAL
          part consuming 7.3 units a year gives 7.3 * 100 / 365 * 2.0 = exactly 4.00, so the ceil is a no-op and the
          answer is 4, not 5. A SHOW_CRITICAL part consuming 1.0 a year gives 0.548, whose ceil is 1 — the
          criticality_floor_qty of 2 overrides it, which only shows up when the max() is applied after the ceil. A
          NON_CRITICAL part consuming 16.5 a year gives 4.5205 with a 1.0 multiplier and a floor of 0, so the ceil binds
          at 5.
        test_recipe:
          setup:
            - "One AttractionProject at BLUE_SKY with no maintenance items."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-CA3", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /maintenance-items"
              payload: { project_id: "${proj}", part_number: "PN-EXACT-400", description: "Trackless vehicle drive belt", criticality: "SHOW_CRITICAL", annual_consumption_rate: 7.3, lead_time_days: 100 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { mi_exact: $.data.id, qty_exact: $.data.recommended_stock_qty }
            - call: "POST /maintenance-items"
              payload: { project_id: "${proj}", part_number: "PN-FLOOR-001", description: "Show action equipment servo card", criticality: "SHOW_CRITICAL", annual_consumption_rate: 1.0, lead_time_days: 100 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { mi_floor: $.data.id, qty_floor: $.data.recommended_stock_qty }
            - call: "POST /maintenance-items"
              payload: { project_id: "${proj}", part_number: "PN-CEIL-165", description: "Queue rail bumper pad", criticality: "NON_CRITICAL", annual_consumption_rate: 16.5, lead_time_days: 100 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { mi_ceil: $.data.id, qty_ceil: $.data.recommended_stock_qty }
          assert:
            - "${qty_exact} == 4"
            - "${qty_floor} == 2"
            - "${qty_ceil} == 5"
            - "MaintenanceItem.${mi_exact}.status == DRAFT"
            - "MaintenanceItem.${mi_floor}.status == DRAFT"
            - "MaintenanceItem.${mi_ceil}.status == DRAFT"

      - name: project_show_quality_score_is_duration_weighted_over_rounded_scene_scores
        claim_type: weighted_scoring
        grounds:
          - calculations.show_scene_quality_score
          - calculations.project_show_quality_score
          - endpoints[POST /show-scenes/{id}/program]
          - endpoints[GET /attraction-projects/{id}/capacity-summary]
        distinguishing_aspect: |
          Two scenes of unequal duration produce a project score that is neither the plain mean nor the unrounded
          weighted figure. Scene scores round first: (92, 88, 85, 88) at weights 0.25 / 0.20 / 0.30 / 0.25 gives exactly
          88.10 and (70, 60, 65, 70) gives exactly 66.50. The project score then weights by duration_seconds:
          (88.10 * 180 + 66.50 * 120) / 300 = 23838 / 300 = 79.46. A plain arithmetic mean would report 77.30, so the
          duration weighting is observable, and the project score is still below MIN_SHOW_QUALITY_SCORE of 75.00 only
          for the unweighted reading — 79.46 clears it, which is exactly why the ordering of round-then-weight matters.
        test_recipe:
          setup:
            - "One AttractionProject with two SEQUENCED scenes, each carrying one VERIFIED cue so that program is admissible."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-CA4", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, quality_before: $.data.show_quality_score }
            - call: "POST /show-scenes"
              payload: { project_id: "${proj}", scene_label: "Prologue", sequence_index: 1, duration_seconds: 180 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { sc1: $.data.id }
            - call: "POST /show-scenes"
              payload: { project_id: "${proj}", scene_label: "Chase", sequence_index: 2, duration_seconds: 120, follows_scene_id: "${sc1}" }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { sc2: $.data.id }
            - call: "POST /effect-cues"
              payload: { scene_id: "${sc1}", cue_label: "Prologue Wash", discipline_channel: "LIGHTING", offset_ms: 0, duration_ms: 2000 }
              as: ShowProgrammer
              as_user_id: "u-prog-1"
              captures: { cue1: $.data.id }
            - call: "POST /effect-cues/${cue1}/verify"
              payload: {}
              as: ShowProgrammer
              as_user_id: "u-prog-1"
            - call: "POST /effect-cues"
              payload: { scene_id: "${sc2}", cue_label: "Chase Stinger", discipline_channel: "AUDIO", offset_ms: 0, duration_ms: 1500 }
              as: ShowProgrammer
              as_user_id: "u-prog-1"
              captures: { cue2: $.data.id }
            - call: "POST /effect-cues/${cue2}/verify"
              payload: {}
              as: ShowProgrammer
              as_user_id: "u-prog-1"
            - call: "POST /show-scenes/${sc1}/sequence"
              payload: { sequence_index: 1 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
            - call: "POST /show-scenes/${sc2}/sequence"
              payload: { sequence_index: 2, follows_scene_id: "${sc1}" }
              as: CreativeDirector
              as_user_id: "u-cd-1"
          trigger:
            - call: "POST /show-scenes/${sc1}/program"
              payload: { lighting_score: 92, audio_score: 88, animation_score: 85, effects_score: 88 }
              as: ShowProgrammer
              as_user_id: "u-prog-1"
              captures: { score1: $.data.scene_quality_score }
            - call: "POST /show-scenes/${sc2}/program"
              payload: { lighting_score: 70, audio_score: 60, animation_score: 65, effects_score: 70 }
              as: ShowProgrammer
              as_user_id: "u-prog-1"
              captures: { score2: $.data.scene_quality_score }
            - call: "GET /attraction-projects/${proj}/capacity-summary"
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { project_quality: $.data.show_quality_score }
          assert:
            - "${quality_before} == 0.00"
            - "${score1} == 88.10"
            - "${score2} == 66.50"
            - "${project_quality} == 79.46"
            - "${project_quality} != 77.30"
            - "ShowScene.${sc1}.status == PROGRAMMED"
            - "ShowScene.${sc2}.status == PROGRAMMED"
            - "AttractionProject.${proj}.show_quality_score == 79.46"

      - name: scene_score_input_set_excludes_unverified_cue_scenes
        claim_type: input_set_filtering
        grounds:
          - calculations.project_show_quality_score.input_set
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / scene_program_requires_every_owned_cue_verified_and_at_least_one_cue
          rationale: "That §1.8 instance establishes that a scene cannot enter PROGRAMMED at all while any owned cue is PLANNED or while it owns no cue, which is what keeps such scenes out of the project score's input set."

      - name: design_fee_tier_is_keyed_on_the_package_base_cost
        claim_type: tiered_pricing
        grounds:
          - calculations.design_package_cost_of_work
        excluded_because:
          difficulty_instance: combinatorial_formula / design_package_tier_keyed_on_base_not_on_running_total
          rationale: "That §1.8 instance prices two packages whose tier would differ if the tier were keyed on the project's running committed total instead of each package's own base cost."

      - name: restricted_posture_threshold_is_inclusive
        claim_type: threshold
        grounds:
          - calculations.project_budget_position
        excluded_because:
          difficulty_instance: boundary_precision_check / restricted_utilisation_threshold_exact_equality_keeps_posture_open
          rationale: "That §1.8 instance lands committed cost exactly on restricted_utilisation_cents and then one cent past it, which is the threshold claim at both sides of the boundary."

      - name: committed_cost_replays_the_ledger_chronologically
        claim_type: chronological
        grounds:
          - calculations.project_budget_position.committed_basis
        excluded_because:
          difficulty_instance: compensating_invariant / ledger_reversal_restores_committed_cost_and_posture_without_drift
          rationale: "That §1.8 instance asserts the created_at-then-sequence_no replay across a post, a further post and a reversal, including the sequence_no assigned to each row."

      - name: ve_program_savings_aggregate_only_adopted_items
        claim_type: aggregation
        grounds:
          - calculations.ve_item_net_saving.ve_program_net_savings_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / ve_program_savings_round_per_item_then_sum
          rationale: "That §1.8 instance asserts the aggregate over ADOPTED items and pins the round-per-item-then-sum answer of 100000010 against the sum-then-round answer of 100000011."

      - name: ride_capacity_has_two_named_variants
        claim_type: variant_divergence
        grounds:
          - calculations.ride_system_hourly_capacity.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / ride_capacity_theoretical_and_operational_diverge_on_one_row
          rationale: "That §1.8 instance asserts 1440 theoretical against 1179 operational on one row, so the two variants provably diverge."

      - name: gates_read_the_operational_variant_only
        claim_type: variant_selection
        grounds:
          - calculations.project_budget_position.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / budget_committed_and_forecast_diverge_with_in_flight_ve_and_open_finding
          rationale: "That §1.8 instance shows the ceiling gate reading the committed variant while the forecast variant reports a different number in the same response, which is the variant-selection claim."

      - name: adoption_reconciles_the_forecast_variant_into_the_committed_one
        claim_type: reconciliation
        grounds:
          - calculations.project_budget_position
        excluded_because:
          difficulty_instance: transitive_cascade / ve_adoption_cascade_lifts_budget_freeze_and_releases_held_scenes
          rationale: "That §1.8 instance asserts that adopting the in-flight item folds its saving out of the forecast basis and into the committed basis via a VE_SAVING ledger row, leaving the two bases reconciled."

  # ===================================================================
  # SECTION 4 — Validations
  # ===================================================================
  - section: validations
    instances:
      - name: duplicate_project_code_is_rejected_while_the_name_may_repeat
        claim_type: violation_to_error
        grounds:
          - validations[priority 25].ERR_PROJECT_CODE_DUPLICATE
          - endpoints[POST /attraction-projects]
        distinguishing_aspect: |
          project_code is the only unique key on AttractionProject: a second project reusing TAD-VA1 is refused with
          ERR_PROJECT_CODE_DUPLICATE at priority 25, while a third project that repeats the human name Skyward Saga under
          a fresh code succeeds — so uniqueness is scoped to the code alone and is not derived from the name.
        test_recipe:
          setup:
            - "One AttractionProject already exists with project_code TAD-VA1 and name Skyward Saga."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-VA1", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-VA1", name: "Different Attraction", design_day_attendance: 4000, peak_hour_share: 0.12, budget_ceiling_cents: 1000000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { err: $.data.error_id }
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-VA1-B", name: "Skyward Saga", design_day_attendance: 4000, peak_hour_share: 0.12, budget_ceiling_cents: 1000000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { twin: $.data.id }
          assert:
            - "${err} == ERR_PROJECT_CODE_DUPLICATE"
            - "the duplicate-code request returns HTTP status 409"
            - "the repeated-name request returns HTTP status 201"
            - "AttractionProject.${twin}.project_code == TAD-VA1-B"
            - "AttractionProject.${proj}.name == Skyward Saga"

      - name: scene_sequence_index_already_held_is_rejected_on_resequence
        claim_type: violation_to_error
        grounds:
          - validations[priority 26].ERR_SCENE_SEQUENCE_DUPLICATE
          - endpoints[POST /show-scenes/{id}/sequence]
        distinguishing_aspect: |
          The uniqueness check counts every ShowScene of the project regardless of status, so a DRAFT scene still
          reserves its sequence_index: resequencing scene two onto index 1 is refused with ERR_SCENE_SEQUENCE_DUPLICATE
          even though the holder has never been sequenced. Re-asserting a scene's own index is not a conflict with
          itself, which the second call in the trigger proves by succeeding.
        test_recipe:
          setup:
            - "One AttractionProject with two DRAFT scenes at sequence_index 1 and 2."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-VA2", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id }
            - call: "POST /show-scenes"
              payload: { project_id: "${proj}", scene_label: "Prologue", sequence_index: 1, duration_seconds: 180 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { sc1: $.data.id }
            - call: "POST /show-scenes"
              payload: { project_id: "${proj}", scene_label: "Chase", sequence_index: 2, duration_seconds: 120 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { sc2: $.data.id }
          trigger:
            - call: "POST /show-scenes/${sc2}/sequence"
              payload: { sequence_index: 1 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { err: $.data.error_id }
            - call: "POST /show-scenes/${sc2}/sequence"
              payload: { sequence_index: 2 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
          assert:
            - "${err} == ERR_SCENE_SEQUENCE_DUPLICATE"
            - "the conflicting resequence returns HTTP status 409"
            - "ShowScene.${sc1}.status == DRAFT"
            - "ShowScene.${sc1}.sequence_index == 1"
            - "ShowScene.${sc2}.status == SEQUENCED"
            - "ShowScene.${sc2}.sequence_index == 2"

      - name: scene_order_cycle_is_detected_by_walking_the_follows_chain
        claim_type: cascading_validation
        grounds:
          - validations[priority 27].ERR_SCENE_ORDER_CYCLE
          - entities.ShowScene.fields.follows_scene_id
          - endpoints[POST /show-scenes/{id}/sequence]
        distinguishing_aspect: |
          The cycle check is transitive, not a one-hop self-reference test. Three scenes chained A -> B -> C are legal;
          pointing A at C closes a three-node loop that only a full walk of follows_scene_id can see, so the refusal is
          ERR_SCENE_ORDER_CYCLE at priority 27 and not the sequence-duplicate error, because A keeps its own index 1 in
          the rejected request.
        test_recipe:
          setup:
            - "One AttractionProject with three DRAFT scenes; scene B follows A and scene C follows B, so the running order is a chain of three."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-VA3", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id }
            - call: "POST /show-scenes"
              payload: { project_id: "${proj}", scene_label: "Scene A", sequence_index: 1, duration_seconds: 180 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { sc_a: $.data.id }
            - call: "POST /show-scenes"
              payload: { project_id: "${proj}", scene_label: "Scene B", sequence_index: 2, duration_seconds: 120, follows_scene_id: "${sc_a}" }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { sc_b: $.data.id }
            - call: "POST /show-scenes"
              payload: { project_id: "${proj}", scene_label: "Scene C", sequence_index: 3, duration_seconds: 90, follows_scene_id: "${sc_b}" }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { sc_c: $.data.id }
          trigger:
            - call: "POST /show-scenes/${sc_a}/sequence"
              payload: { sequence_index: 1, follows_scene_id: "${sc_c}" }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err} == ERR_SCENE_ORDER_CYCLE"
            - "${err} != ERR_SCENE_SEQUENCE_DUPLICATE"
            - "ShowScene.${sc_a}.follows_scene_id == null"
            - "ShowScene.${sc_a}.status == DRAFT"
            - "ShowScene.${sc_c}.follows_scene_id == ${sc_b}"

      - name: accessible_queue_width_of_one_seventy_nine_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 32].ERR_QUEUE_WIDTH_BELOW_MINIMUM
          - endpoints[POST /queue-segments]
        distinguishing_aspect: |
          The width minimum is per routing class, so 1.79 m is legal nowhere it matters and illegal exactly where it
          does: an ACCESSIBLE segment at 1.79 m is refused with ERR_QUEUE_WIDTH_BELOW_MINIMUM against the 1.80 m
          accessible floor, while the identical 1.79 m width is accepted for a STANDARD segment whose floor is 1.10 m.
          The check is a schema-independent business rule at priority 32, so it returns 422 with its own error id rather
          than ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "One AttractionProject at BLUE_SKY with no queue segments."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-VA4", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /queue-segments"
              payload: { project_id: "${proj}", segment_label: "Narrow Bypass", length_meters: 100, width_meters: 1.79, routing_type: "ACCESSIBLE", position_index: 1 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { err: $.data.error_id }
            - call: "POST /queue-segments"
              payload: { project_id: "${proj}", segment_label: "Narrow Switchback", length_meters: 100, width_meters: 1.79, routing_type: "STANDARD", position_index: 1 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { ok_seg: $.data.id, ok_cap: $.data.capacity_guests }
          assert:
            - "${err} == ERR_QUEUE_WIDTH_BELOW_MINIMUM"
            - "the accessible request returns HTTP status 422"
            - "${err} != ERR_INVALID_REQUEST"
            - "the standard request returns HTTP status 201"
            - "${ok_cap} == 275"
            - "QueueSegment.${ok_seg}.routing_type == STANDARD"

      - name: standard_queue_width_of_exactly_one_ten_satisfies_the_class_minimum
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority 32].ERR_QUEUE_WIDTH_BELOW_MINIMUM
          - calculations.queue_segment_capacity
          - endpoints[POST /queue-segments]
        distinguishing_aspect: |
          The comparison is inclusive, so a STANDARD segment at exactly 1.10 m is created rather than refused, and its
          capacity is floor((100 * 1.10) / 0.65) = floor(169.23) = 169. An exclusive implementation would reject the row
          outright, so the pass is the observable — and 169 rather than 170 keeps the floor visible on the same call.
        test_recipe:
          setup:
            - "One AttractionProject at BLUE_SKY with no queue segments."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-VA5", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, pv0: $.data.version }
          trigger:
            - call: "POST /queue-segments"
              payload: { project_id: "${proj}", segment_label: "Minimum Width Run", length_meters: 100, width_meters: 1.10, routing_type: "STANDARD", position_index: 1 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { qs: $.data.id, cap: $.data.capacity_guests }
            - call: "POST /queue-segments/${qs}/accept"
              payload: { expected_project_version: "${pv0}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
          assert:
            - "the create returns HTTP status 201"
            - "${cap} == 169"
            - "QueueSegment.${qs}.width_meters == 1.10"
            - "QueueSegment.${qs}.status == ACCEPTED"
            - "AttractionProject.${proj}.queue_capacity_total_guests == 169"

      - name: two_individually_affordable_change_orders_collectively_exceed_the_ceiling
        claim_type: aggregate_validation
        grounds:
          - validations[priority 48].ERR_BUDGET_CEILING_EXCEEDED
          - calculations.project_budget_position
          - endpoints[POST /budget-ledger-entries]
        distinguishing_aspect: |
          Neither change order breaks the 3600000000 ceiling on its own — 3240000000 and 360000001 are each affordable
          against an empty ledger — but the ceiling test is an aggregate over the replayed ledger, so the second post is
          refused with ERR_BUDGET_CEILING_EXCEEDED because 3240000000 + 360000001 = 3600000001 clears it by exactly one
          cent. The first post also lands exactly on restricted_utilisation_cents (3240000000 = 90 percent of the
          ceiling), which keeps the posture OPEN and therefore stops priority 9 from pre-empting priority 48 with
          ERR_POSTURE_RESTRICTED.
        test_recipe:
          setup:
            - "One AttractionProject with budget_ceiling_cents 3600000000, an empty ledger and committed_cost_cents 0."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-VA6", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, pv0: $.data.version }
            - call: "POST /budget-ledger-entries"
              payload: { project_id: "${proj}", entry_kind: "CHANGE_ORDER", amount_cents: 3240000000, memo: "Show set steelwork change order", expected_project_version: "${pv0}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { first_seq: $.data.sequence_no }
            - call: "GET /attraction-projects/${proj}/budget-position"
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { committed_after_first: $.data.committed_cost_cents, posture_after_first: $.data.readiness_posture, headroom_after_first: $.data.headroom_cents }
            - call: "GET /attraction-projects/${proj}"
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { pv1: $.data.version }
          trigger:
            - call: "POST /budget-ledger-entries"
              payload: { project_id: "${proj}", entry_kind: "CHANGE_ORDER", amount_cents: 360000001, memo: "Animation figure change order", expected_project_version: "${pv1}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { err: $.data.error_id }
          assert:
            - "${first_seq} == 1"
            - "${committed_after_first} == 3240000000"
            - "${posture_after_first} == OPEN"
            - "${headroom_after_first} == 360000000"
            - "HTTP status == 409"
            - "${err} == ERR_BUDGET_CEILING_EXCEEDED"
            - "${err} != ERR_POSTURE_RESTRICTED"
            - "GET /attraction-projects/${proj}/budget-position still returns committed_cost_cents == 3240000000"
            - "GET /attraction-projects/${proj}/budget-ledger-entries returns total_count == 1"

      - name: virtual_queue_share_of_forty_one_percent_is_rejected_as_a_business_rule
        claim_type: violation_to_error
        grounds:
          - validations[priority 35].ERR_VIRTUAL_QUEUE_SHARE_EXCEEDED
          - entities.AttractionProject.fields.virtual_queue_share_pct
          - endpoints[POST /attraction-projects]
          - endpoints[PATCH /attraction-projects/{id}]
        distinguishing_aspect: |
          The schema range on virtual_queue_share_pct is 0 to 100, and the operating cap of 40 lives at validation
          priority 35 instead — so a share of 41 must surface ERR_VIRTUAL_QUEUE_SHARE_EXCEEDED with 422 rather than
          being swallowed by ERR_INVALID_REQUEST at priority 3, and the same rule guards the PATCH path, while 40.00
          exactly is admitted.
        test_recipe:
          setup:
            - "One AttractionProject created with the default virtual_queue_share_pct of 0."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-VA7", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, pv0: $.data.version }
          trigger:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-VA7-B", name: "Overallocated Attraction", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000, virtual_queue_share_pct: 41 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { err_create: $.data.error_id }
            - call: "PATCH /attraction-projects/${proj}"
              payload: { expected_project_version: "${pv0}", virtual_queue_share_pct: 41 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { err_patch: $.data.error_id }
            - call: "PATCH /attraction-projects/${proj}"
              payload: { expected_project_version: "${pv0}", virtual_queue_share_pct: 40 }
              as: OwnerRep
              as_user_id: "u-owner-1"
          assert:
            - "${err_create} == ERR_VIRTUAL_QUEUE_SHARE_EXCEEDED"
            - "${err_patch} == ERR_VIRTUAL_QUEUE_SHARE_EXCEEDED"
            - "${err_create} != ERR_INVALID_REQUEST"
            - "both refused requests return HTTP status 422"
            - "AttractionProject.${proj}.virtual_queue_share_pct == 40.00"
            - "AttractionProject.${proj}.version == 2"

      - name: queue_position_index_duplicate_is_scoped_to_live_segments
        claim_type: violation_to_error
        grounds:
          - validations[priority 31].ERR_QUEUE_POSITION_DUPLICATE
          - state_machines.QueueSegment.ACCEPTED_to_RETIRED
          - endpoints[POST /queue-segments]
        distinguishing_aspect: |
          The uniqueness set is {PROPOSED, ACCEPTED}, not all rows, so position_index 1 collides while the holder is
          live and becomes free again once that segment is RETIRED. The same create payload therefore fails with
          ERR_QUEUE_POSITION_DUPLICATE and then succeeds after the retire, which distinguishes a live-set rule from a
          blanket unique index.
        test_recipe:
          setup:
            - "One AttractionProject with one ACCEPTED STANDARD QueueSegment at position_index 1."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-VA8", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, pv0: $.data.version }
            - call: "POST /queue-segments"
              payload: { project_id: "${proj}", segment_label: "Switchback A", length_meters: 120, width_meters: 2.4, routing_type: "STANDARD", position_index: 1 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { qs1: $.data.id }
            - call: "POST /queue-segments/${qs1}/accept"
              payload: { expected_project_version: "${pv0}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "GET /attraction-projects/${proj}"
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { pv1: $.data.version }
          trigger:
            - call: "POST /queue-segments"
              payload: { project_id: "${proj}", segment_label: "Switchback A Rebuild", length_meters: 120, width_meters: 2.4, routing_type: "STANDARD", position_index: 1 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { err: $.data.error_id }
            - call: "POST /queue-segments/${qs1}/retire"
              payload: { expected_project_version: "${pv1}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /queue-segments"
              payload: { project_id: "${proj}", segment_label: "Switchback A Rebuild", length_meters: 120, width_meters: 2.4, routing_type: "STANDARD", position_index: 1 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { qs2: $.data.id }
          assert:
            - "${err} == ERR_QUEUE_POSITION_DUPLICATE"
            - "the colliding create returns HTTP status 409"
            - "the post-retire create returns HTTP status 201"
            - "QueueSegment.${qs1}.status == RETIRED"
            - "QueueSegment.${qs2}.position_index == 1"
            - "QueueSegment.${qs2}.status == PROPOSED"
            - "AttractionProject.${proj}.queue_capacity_total_guests == 0"

      - name: select_of_an_undersized_ride_system_fails_the_capacity_target
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 37].ERR_CAPACITY_TARGET_NOT_MET
          - calculations.ride_system_hourly_capacity
          - calculations.project_required_hourly_capacity
          - endpoints[POST /ride-systems/{id}/select]
        distinguishing_aspect: |
          The gate compares a field of one entity against a field of another: RS_weak (2 vehicles, 4 riders, 3 block
          zones, 240 s cycle, 90 percent availability, 80 percent load, no show stops) yields a dispatch interval of 120
          s, a theoretical 120 guests per hour and an operational 86, against the project's required
          ceil(8000 * 0.10) = 800 — so select is refused with ERR_CAPACITY_TARGET_NOT_MET and
          selected_ride_system_id stays null. Selecting the adequate RS_A (operational 1179) with the very same,
          still-current OCC token then succeeds, which proves the refusal was the capacity comparison and not staleness.
        test_recipe:
          setup:
            - "One AttractionProject requiring 800 guests per hour, with one undersized CANDIDATE RideSystem and one adequate CANDIDATE RideSystem."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-VA9", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, pv0: $.data.version, required: $.data.required_hourly_capacity_guests }
            - call: "POST /ride-systems"
              payload: { project_id: "${proj}", vendor_name: "Small Works", system_type: "OMNIMOVER", vehicle_count: 2, riders_per_vehicle: 4, block_zone_count: 3, cycle_time_seconds: 240, availability_pct: 90, load_efficiency_pct: 80, show_stops_per_hour: 0 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { rs_weak: $.data.id, weak_theoretical: $.data.theoretical_hourly_capacity_guests, weak_operational: $.data.operational_hourly_capacity_guests }
            - call: "POST /ride-systems"
              payload: { project_id: "${proj}", vendor_name: "Vekoma Rides", system_type: "DARK_RIDE_TRACKLESS", vehicle_count: 12, riders_per_vehicle: 8, block_zone_count: 14, cycle_time_seconds: 240, availability_pct: 96, load_efficiency_pct: 90, show_stops_per_hour: 1.5 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { rs_ok: $.data.id, ok_operational: $.data.operational_hourly_capacity_guests }
          trigger:
            - call: "POST /ride-systems/${rs_weak}/select"
              payload: { expected_project_version: "${pv0}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { err: $.data.error_id }
            - call: "POST /ride-systems/${rs_ok}/select"
              payload: { expected_project_version: "${pv0}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
          assert:
            - "${required} == 800"
            - "${weak_theoretical} == 120"
            - "${weak_operational} == 86"
            - "${ok_operational} == 1179"
            - "${err} == ERR_CAPACITY_TARGET_NOT_MET"
            - "the refused select returns HTTP status 409"
            - "${err} != ERR_STALE_PROJECT_VERSION"
            - "RideSystem.${rs_weak}.status == CANDIDATE"
            - "RideSystem.${rs_ok}.status == SELECTED"
            - "AttractionProject.${proj}.selected_ride_system_id == ${rs_ok}"

      - name: restricted_posture_gates_only_the_two_endpoints_that_declare_it
        claim_type: conditional_validation
        grounds:
          - validations[priority 9].ERR_POSTURE_RESTRICTED
          - calculations.project_readiness_posture
          - endpoints[POST /design-packages]
          - endpoints[POST /queue-segments]
        distinguishing_aspect: |
          Posture gating is conditional on the endpoint, not global. One change order of 3240000001 cents pushes
          committed cost one cent past restricted_utilisation_cents (90 percent of 3600000000 = 3240000000), so the
          posture becomes RESTRICTED: a new design package is then refused with ERR_POSTURE_RESTRICTED at priority 9 —
          ahead of the ceiling check at priority 48, which the 400000000 package would also have passed — while a queue
          segment create, which the rule does not list, still succeeds under the identical posture.
        test_recipe:
          setup:
            - "One AttractionProject with budget_ceiling_cents 3600000000 driven to RESTRICTED posture by a single 3240000001-cent change order, plus one CANDIDATE RideSystem."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-VA10", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, pv0: $.data.version }
            - call: "POST /ride-systems"
              payload: { project_id: "${proj}", vendor_name: "Vekoma Rides", system_type: "DARK_RIDE_TRACKLESS", vehicle_count: 12, riders_per_vehicle: 8, block_zone_count: 14, cycle_time_seconds: 240, availability_pct: 96, load_efficiency_pct: 90, show_stops_per_hour: 1.5 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { rs: $.data.id }
            - call: "POST /budget-ledger-entries"
              payload: { project_id: "${proj}", entry_kind: "CHANGE_ORDER", amount_cents: 3240000001, memo: "Ride and controls change order", expected_project_version: "${pv0}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "GET /attraction-projects/${proj}/budget-position"
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { committed: $.data.committed_cost_cents, posture: $.data.readiness_posture, restricted_at: $.data.restricted_utilisation_cents }
            - call: "GET /attraction-projects/${proj}"
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { pv1: $.data.version }
          trigger:
            - call: "POST /design-packages"
              payload: { project_id: "${proj}", ride_system_id: "${rs}", package_label: "Show Set Release 1", discipline_scope: "SHOW_SET", base_construction_cost_cents: 400000000, expected_project_version: "${pv1}" }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { err: $.data.error_id }
            - call: "POST /queue-segments"
              payload: { project_id: "${proj}", segment_label: "Switchback A", length_meters: 120, width_meters: 2.4, routing_type: "STANDARD", position_index: 1 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { qs: $.data.id }
          assert:
            - "${committed} == 3240000001"
            - "${restricted_at} == 3240000000"
            - "${posture} == RESTRICTED"
            - "${err} == ERR_POSTURE_RESTRICTED"
            - "the refused package create returns HTTP status 409"
            - "${err} != ERR_BUDGET_CEILING_EXCEEDED"
            - "the queue segment create returns HTTP status 201"
            - "QueueSegment.${qs}.capacity_guests == 443"

      - name: frozen_posture_outranks_the_ceiling_check
        claim_type: priority_ordering
        grounds:
          - validations[priority 8].ERR_PROJECT_FROZEN
          - validations[priority 48].ERR_BUDGET_CEILING_EXCEEDED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / frozen_posture_beats_budget_ceiling_on_ledger_post
          rationale: "That §1.8 instance posts a ledger entry that violates both rules at once and asserts the lower-numbered ERR_PROJECT_FROZEN, then shows the ceiling error surfacing once the freeze is lifted."

      - name: segregation_of_duties_outranks_the_pinned_reference_check
        claim_type: priority_conflict
        grounds:
          - validations[priority 12].ERR_SEGREGATION_OF_DUTIES
          - validations[priority 16].ERR_PINNED_REFERENCE_STALE
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / segregation_of_duties_beats_pinned_reference_stale_on_approve
          rationale: "That §1.8 instance constructs an approve call that violates both rules and asserts the priority 12 error, which is exactly the priority-conflict claim."

      - name: rehearsal_windows_are_validated_temporally
        claim_type: temporal_validation
        grounds:
          - validations[priority 21].ERR_REHEARSAL_WINDOW_CONFLICT
          - validations[priority 23].ERR_REHEARSAL_WINDOW_NOT_ELAPSED
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rehearsal_window_treats_endpoints_as_closed_and_demands_a_full_changeover_gap
          rationale: "That §1.8 instance pins the closed-interval semantics and the changeover gap at the exact boundary minute, covering both temporal rules."

  # ===================================================================
  # SECTION 5 — Endpoints
  # ===================================================================
  - section: endpoints
    instances:
      - name: project_patch_rewrites_the_ceiling_and_recomputes_the_utilisation_band
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /attraction-projects/{id}]
          - calculations.project_budget_position
          - calculations.project_readiness_posture
        distinguishing_aspect: |
          The update path is create-read-update with no delete anywhere in the surface, and PATCH is partial: sending
          only budget_ceiling_cents leaves design_day_attendance and required_hourly_capacity_guests untouched while
          moving restricted_utilisation_cents from 3240000000 to 2700000000 in the same response — the utilisation band
          is derived on every read, not stored at create time. Posture stays OPEN because committed cost is still 0.
        test_recipe:
          setup:
            - "One AttractionProject with budget_ceiling_cents 3600000000 and an empty ledger."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-EP1", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, pv0: $.data.version }
            - call: "GET /attraction-projects/${proj}/budget-position"
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { restricted_before: $.data.restricted_utilisation_cents }
          trigger:
            - call: "PATCH /attraction-projects/${proj}"
              payload: { expected_project_version: "${pv0}", budget_ceiling_cents: 3000000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { required_after: $.data.required_hourly_capacity_guests, version_after: $.data.version }
            - call: "GET /attraction-projects/${proj}/budget-position"
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { restricted_after: $.data.restricted_utilisation_cents, posture_after: $.data.readiness_posture, headroom_after: $.data.headroom_cents }
          assert:
            - "${restricted_before} == 3240000000"
            - "the patch returns HTTP status 200"
            - "${required_after} == 800"
            - "${version_after} == 2"
            - "${restricted_after} == 2700000000"
            - "${posture_after} == OPEN"
            - "${headroom_after} == 3000000000"
            - "AttractionProject.${proj}.design_day_attendance == 8000"

      - name: design_package_create_links_its_project_and_ride_system_for_filtered_reads
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /design-packages]
          - endpoints[GET /design-packages]
          - endpoints[GET /attraction-projects/{id}/ride-systems]
          - calculations.design_package_cost_of_work
        distinguishing_aspect: |
          One create writes two foreign keys, and both are queryable afterwards: filtering GET /design-packages by
          ride_system_id returns exactly the new package, and the package's priced fields are already visible on the
          create response (base 400000000 gives design_fee 48000000, contingency 67200000, total 515200000) even though
          the project's committed_cost_cents is still 0 because nothing has been approved.
        test_recipe:
          setup:
            - "One AttractionProject at BLUE_SKY with one CANDIDATE RideSystem."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-EP2", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, pv0: $.data.version }
            - call: "POST /ride-systems"
              payload: { project_id: "${proj}", vendor_name: "Vekoma Rides", system_type: "DARK_RIDE_TRACKLESS", vehicle_count: 12, riders_per_vehicle: 8, block_zone_count: 14, cycle_time_seconds: 240, availability_pct: 96, load_efficiency_pct: 90, show_stops_per_hour: 1.5 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { rs: $.data.id }
          trigger:
            - call: "POST /design-packages"
              payload: { project_id: "${proj}", ride_system_id: "${rs}", package_label: "Show Set Release 1", discipline_scope: "SHOW_SET", base_construction_cost_cents: 400000000, expected_project_version: "${pv0}" }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { pkg: $.data.id, total: $.data.total_cost_of_work_cents }
            - call: "GET /design-packages"
              payload: { ride_system_id: "${rs}" }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { listed_pkg: "$.data[0].id", listed_total: "$.data[0].total_cost_of_work_cents" }
          assert:
            - "the create returns HTTP status 201"
            - "${total} == 515200000"
            - "${listed_pkg} == ${pkg}"
            - "${listed_total} == 515200000"
            - "the filtered list returns total_count == 1 and has_more == false"
            - "DesignPackage.${pkg}.project_id == ${proj}"
            - "DesignPackage.${pkg}.ride_system_id == ${rs}"
            - "GET /attraction-projects/${proj}/budget-position returns committed_cost_cents == 0"

      - name: maintenance_approve_and_hand_over_are_gated_on_stock_and_on_phase
        claim_type: conditional_action
        grounds:
          - state_machines.MaintenanceItem.DRAFT_to_APPROVED
          - state_machines.MaintenanceItem.APPROVED_to_HANDED_OVER
          - validations[priority 7].ERR_MAINTENANCE_STATE_INVALID
          - validations[priority 11].ERR_PROJECT_PHASE_INVALID
          - validations[priority 43].ERR_SPARE_STOCK_INSUFFICIENT
          - endpoints[POST /maintenance-items/{id}/approve]
          - endpoints[POST /maintenance-items/{id}/hand-over]
        distinguishing_aspect: |
          One item walks three different refusals in priority order on the same row. hand-over on a DRAFT item is a state
          error at priority 7, not a phase error, even though the project is also in the wrong phase. approve with
          stocked_qty 1 against a recommended_stock_qty of 4 is refused at priority 43 with
          ERR_SPARE_STOCK_INSUFFICIENT. Once approved with stocked_qty 4, hand-over is refused at priority 11 with
          ERR_PROJECT_PHASE_INVALID because the project is at BLUE_SKY rather than SOFT_OPEN — so the phase error is
          only reachable after the state error stops applying.
        test_recipe:
          setup:
            - "One AttractionProject at BLUE_SKY with one DRAFT SHOW_CRITICAL MaintenanceItem whose recommended_stock_qty is 4 (7.3 units a year, 100-day lead time)."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-EP3", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id }
            - call: "POST /maintenance-items"
              payload: { project_id: "${proj}", part_number: "PN-EXACT-400", description: "Trackless vehicle drive belt", criticality: "SHOW_CRITICAL", annual_consumption_rate: 7.3, lead_time_days: 100 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { mi: $.data.id, recommended: $.data.recommended_stock_qty }
          trigger:
            - call: "POST /maintenance-items/${mi}/hand-over"
              payload: {}
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { err_state: $.data.error_id }
            - call: "POST /maintenance-items/${mi}/approve"
              payload: { stocked_qty: 1 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { err_stock: $.data.error_id }
            - call: "POST /maintenance-items/${mi}/approve"
              payload: { stocked_qty: 4 }
              as: RideEngineer
              as_user_id: "u-eng-1"
            - call: "POST /maintenance-items/${mi}/hand-over"
              payload: {}
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { err_phase: $.data.error_id }
          assert:
            - "${recommended} == 4"
            - "${err_state} == ERR_MAINTENANCE_STATE_INVALID"
            - "${err_state} != ERR_PROJECT_PHASE_INVALID"
            - "${err_stock} == ERR_SPARE_STOCK_INSUFFICIENT"
            - "the refused approve returns HTTP status 409"
            - "the successful approve returns HTTP status 200"
            - "${err_phase} == ERR_PROJECT_PHASE_INVALID"
            - "MaintenanceItem.${mi}.status == APPROVED"
            - "MaintenanceItem.${mi}.stocked_qty == 4"

      - name: ve_ballot_is_an_action_endpoint_with_state_and_party_preconditions
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /ve-ballots]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / ve_ballot_requires_the_item_under_review_before_any_party_may_cast
          rationale: "That §1.8 instance asserts the ballot endpoint's refusal while the item is PROPOSED and its success once the item is UNDER_REVIEW, covering the action endpoint's own preconditions."

      - name: capacity_summary_is_a_computed_read_across_four_entities
        claim_type: computed_read
        grounds:
          - endpoints[GET /attraction-projects/{id}/capacity-summary]
        excluded_because:
          difficulty_instance: boundary_precision_check / accessible_share_exact_fifteen_percent_permits_technical_rehearsal
          rationale: "That §1.8 instance reads the computed summary and asserts queue_capacity_total_guests, accessible_share_pct, virtual_queue_allocation_guests and posted_wait_minutes together in one response."

      # No bulk-action endpoint exists in §1.5: every mutation names exactly one
      # entity instance, so the guide's Bulk action row has nothing to claim here.

  # ===================================================================
  # SECTION 6 — Errors
  # ===================================================================
  # The catalogue has 71 codes in seven mechanical families. This section walks
  # one representative of each family that no §1.8 instance already returns, and
  # names the family in the distinguishing_aspect so the sibling codes are
  # covered by the same shape:
  #   * priority 1-2 identity      -> missing_identity_headers_returns_unauthenticated
  #   * priority 4 path 404s (12)  -> show_scene_read_with_unknown_id_not_found (Entities)
  #   * priority 5 body FK 404s (7)-> unknown_project_id_in_a_create_body_returns_project_not_found
  #   * priority 6 OCC (3)         -> Cross-Cutting Complexity Layers, one per §1.2.1 rule
  #   * priority 7 state (10)      -> queue_segment_retire_before_accept / verified_effect_cue_is_terminal /
  #                                   maintenance_approve_and_hand_over_are_gated_on_stock_and_on_phase
  #   * priority 8-12 posture, phase and duty gates -> Validations and §1.8
  #   * priority 13-49 business rules -> one instance each in Validations, Calculations or §1.8
  - section: errors
    instances:
      - name: missing_identity_headers_returns_unauthenticated
        claim_type: error_triggerable
        grounds:
          - validations[priority 1].ERR_UNAUTHENTICATED
          - roles.OwnerRep.identity
          - endpoints[POST /attraction-projects]
        distinguishing_aspect: |
          Identity is opaque and header-borne, so a request that carries no role and no user id is refused at priority 1
          with ERR_UNAUTHENTICATED and HTTP 401 — before the body is even parsed. The proof that ordering is what it
          claims: the same call also carries an unknown enum and a missing required field, which would be
          ERR_INVALID_REQUEST at priority 3, and a role-shaped variant of it would be ERR_UNAUTHORIZED at priority 2;
          neither is what comes back.
        test_recipe:
          setup:
            - "No prior state is required."
            - "The trigger request is sent with neither the role header nor the user-id header set."
          setup_api_calls: []
          trigger:
            # Deliberately header-less: the role and user id below are the ones a
            # well-formed caller WOULD have sent, and are omitted on the wire.
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-ER1", name: "Skyward Saga", peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: null
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "HTTP status == 401"
            - "${err} == ERR_UNAUTHENTICATED"
            - "${err} != ERR_INVALID_REQUEST"
            - "${err} != ERR_UNAUTHORIZED"
            - "${msg} is a non-empty string"
            - "no AttractionProject row is created"

      - name: unknown_project_id_in_a_create_body_returns_project_not_found
        claim_type: error_triggerable
        grounds:
          - validations[priority 5].ERR_PROJECT_NOT_FOUND
          - endpoints[POST /ride-systems]
        distinguishing_aspect: |
          Body foreign keys are resolved at priority 5, one rung below path ids at priority 4, and they resolve to the
          referenced entity's own code: an unknown project_id on a ride-system create is ERR_PROJECT_NOT_FOUND with 404,
          not ERR_RIDE_SYSTEM_NOT_FOUND and not ERR_INVALID_REQUEST — the id is a well-formed UUID, so the schema layer
          has nothing to complain about. All seven body-FK codes share this shape.
        test_recipe:
          setup:
            - "No project exists with the id used below."
          setup_api_calls: []
          trigger:
            - call: "POST /ride-systems"
              payload: { project_id: "99999999-8888-4777-8666-555544443333", vendor_name: "Vekoma Rides", system_type: "DARK_RIDE_TRACKLESS", vehicle_count: 12, riders_per_vehicle: 8, block_zone_count: 14, cycle_time_seconds: 240, availability_pct: 96, load_efficiency_pct: 90, show_stops_per_hour: 1.5 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_PROJECT_NOT_FOUND"
            - "${err} != ERR_RIDE_SYSTEM_NOT_FOUND"
            - "${err} != ERR_INVALID_REQUEST"

      - name: critical_finding_cannot_be_waived_while_a_major_finding_can
        claim_type: error_triggerable
        grounds:
          - validations[priority 13].ERR_CRITICAL_FINDING_NOT_WAIVABLE
          - state_machines.SafetyFinding.OPEN_to_WAIVED
          - endpoints[POST /safety-findings/{id}/waive]
        distinguishing_aspect: |
          The waiver rule is severity-keyed, not a blanket prohibition: on the same cleared-path review, the CRITICAL
          finding is refused with ERR_CRITICAL_FINDING_NOT_WAIVABLE while the MAJOR finding accepts the identical call
          and moves to WAIVED. The CRITICAL row also froze the program on creation, which the recipe pins so the refusal
          is not mistaken for a posture effect — a frozen project still answers the waiver attempt with the severity
          error.
        test_recipe:
          setup:
            - "One AttractionProject with an APPROVED DesignPackage (submitted by u-cd-1, approved by u-owner-1 so segregation of duties passes) and one OPEN SafetyReview."
            - "Two findings on that review: one CRITICAL and one MAJOR, both OPEN."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-ER3", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, pv0: $.data.version }
            - call: "POST /ride-systems"
              payload: { project_id: "${proj}", vendor_name: "Vekoma Rides", system_type: "DARK_RIDE_TRACKLESS", vehicle_count: 12, riders_per_vehicle: 8, block_zone_count: 14, cycle_time_seconds: 240, availability_pct: 96, load_efficiency_pct: 90, show_stops_per_hour: 1.5 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { rs: $.data.id }
            - call: "POST /design-packages"
              payload: { project_id: "${proj}", ride_system_id: "${rs}", package_label: "Show Set Release 1", discipline_scope: "SHOW_SET", base_construction_cost_cents: 400000000, expected_project_version: "${pv0}" }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { pkg: $.data.id }
            - call: "POST /design-packages/${pkg}/submit"
              payload: {}
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { pkgv1: $.data.version }
            - call: "POST /design-packages/${pkg}/approve"
              payload: { expected_package_version: "${pkgv1}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { pkgv2: $.data.version }
            - call: "POST /safety-reviews"
              payload: { design_package_id: "${pkg}", standard_code: "ASTM_F2291", expected_package_version: "${pkgv2}" }
              as: ThirdPartyReviewer
              as_user_id: "u-tpr-1"
              captures: { rev: $.data.id }
            - call: "POST /safety-findings"
              payload: { safety_review_id: "${rev}", severity: "CRITICAL", description: "Restraint monitoring channel lacks redundancy", remediation_cost_estimate_cents: 45000000 }
              as: ThirdPartyReviewer
              as_user_id: "u-tpr-1"
              captures: { f_crit: $.data.id }
            - call: "POST /safety-findings"
              payload: { safety_review_id: "${rev}", severity: "MAJOR", description: "Queue gate signage below standard", remediation_cost_estimate_cents: 1200000 }
              as: ThirdPartyReviewer
              as_user_id: "u-tpr-1"
              captures: { f_major: $.data.id }
            - call: "GET /attraction-projects/${proj}"
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { posture_after_critical: $.data.readiness_posture }
          trigger:
            - call: "POST /safety-findings/${f_crit}/waive"
              payload: { justification: "Owner accepts residual risk pending vendor retrofit" }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { err: $.data.error_id }
            - call: "POST /safety-findings/${f_major}/waive"
              payload: { justification: "Signage corrected under separate operations work order" }
              as: OwnerRep
              as_user_id: "u-owner-1"
          assert:
            - "${posture_after_critical} == FROZEN"
            - "the critical waiver returns HTTP status 422"
            - "${err} == ERR_CRITICAL_FINDING_NOT_WAIVABLE"
            - "${err} != ERR_PROJECT_FROZEN"
            - "SafetyFinding.${f_crit}.status == OPEN"
            - "the major waiver returns HTTP status 200"
            - "SafetyFinding.${f_major}.status == WAIVED"
            - "AttractionProject.${proj}.open_critical_finding_count == 1"

      - name: client_posted_commitment_entry_kind_is_not_writable
        claim_type: error_triggerable
        grounds:
          - validations[priority 46].ERR_LEDGER_KIND_NOT_WRITABLE
          - entities.BudgetLedgerEntry.fields.entry_kind
          - endpoints[POST /budget-ledger-entries]
        distinguishing_aspect: |
          COMMITMENT, VE_SAVING and REVERSAL are declared enum members precisely so that the ledger can record
          side-effect rows, which means a client posting entry_kind COMMITMENT passes the priority 3 enum check and must
          be stopped at priority 46 with ERR_LEDGER_KIND_NOT_WRITABLE and 422 — never with ERR_INVALID_REQUEST. The
          identical payload with CHANGE_ORDER succeeds and takes sequence_no 1, proving nothing else in the request was
          at fault.
        test_recipe:
          setup:
            - "One AttractionProject with an empty ledger."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-ER4", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, pv0: $.data.version }
          trigger:
            - call: "POST /budget-ledger-entries"
              payload: { project_id: "${proj}", entry_kind: "COMMITMENT", amount_cents: 500000000, memo: "Hand-written commitment", expected_project_version: "${pv0}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { err: $.data.error_id }
            - call: "POST /budget-ledger-entries"
              payload: { project_id: "${proj}", entry_kind: "CHANGE_ORDER", amount_cents: 500000000, memo: "Show set steelwork change order", expected_project_version: "${pv0}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { seq: $.data.sequence_no }
          assert:
            - "the COMMITMENT post returns HTTP status 422"
            - "${err} == ERR_LEDGER_KIND_NOT_WRITABLE"
            - "${err} != ERR_INVALID_REQUEST"
            - "the CHANGE_ORDER post returns HTTP status 201"
            - "${seq} == 1"
            - "GET /attraction-projects/${proj}/budget-position returns committed_cost_cents == 500000000"

      - name: segregation_of_duties_error_is_triggerable_on_approve
        claim_type: error_triggerable
        grounds:
          - validations[priority 12].ERR_SEGREGATION_OF_DUTIES
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / segregation_of_duties_beats_pinned_reference_stale_on_approve
          rationale: "That §1.8 instance returns ERR_SEGREGATION_OF_DUTIES from an approve call made by the same user who submitted the package."

  # ===================================================================
  # SECTION 7 — RBAC
  # ===================================================================
  - section: rbac
    instances:
      - name: ride_engineer_may_create_and_then_patch_its_own_ride_system
        claim_type: can_perform_own_operations
        grounds:
          - roles.RideEngineer.exclusive_operations
          - endpoints[POST /ride-systems]
          - endpoints[PATCH /ride-systems/{id}]
          - calculations.ride_system_hourly_capacity
        distinguishing_aspect: |
          RideEngineer owns the ride-system aggregate outright: the same actor creates the row and then patches it, and
          the patch recomputes both capacity variants from the new availability. Dropping availability_pct from 96 to 90
          leaves theoretical at 1440 but moves operational from 1179 to floor(1440 * (0.90 * 0.90 - 0.045)) =
          floor(1101.6) = 1101, so the write is provably re-derived rather than stored.
        test_recipe:
          setup:
            - "One AttractionProject at BLUE_SKY."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-RB1", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /ride-systems"
              payload: { project_id: "${proj}", vendor_name: "Vekoma Rides", system_type: "DARK_RIDE_TRACKLESS", vehicle_count: 12, riders_per_vehicle: 8, block_zone_count: 14, cycle_time_seconds: 240, availability_pct: 96, load_efficiency_pct: 90, show_stops_per_hour: 1.5 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { rs: $.data.id, rsv1: $.data.version, op_before: $.data.operational_hourly_capacity_guests }
            - call: "PATCH /ride-systems/${rs}"
              payload: { expected_ride_system_version: "${rsv1}", availability_pct: 90 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { theo_after: $.data.theoretical_hourly_capacity_guests, op_after: $.data.operational_hourly_capacity_guests, rsv2: $.data.version }
          assert:
            - "the create returns HTTP status 201"
            - "${op_before} == 1179"
            - "the patch returns HTTP status 200"
            - "${theo_after} == 1440"
            - "${op_after} == 1101"
            - "${rsv2} == 2"
            - "RideSystem.${rs}.status == CANDIDATE"
            - "RideSystem.${rs}.availability_pct == 90"

      - name: creative_director_cannot_post_a_budget_ledger_entry
        claim_type: cannot_perform_others_exclusive_operations
        grounds:
          - roles.OwnerRep.exclusive_operations
          - validations[priority 2].ERR_UNAUTHORIZED
          - endpoints[POST /budget-ledger-entries]
        distinguishing_aspect: |
          Posting change orders is an OwnerRep exclusive, so an authenticated CreativeDirector is refused at priority 2
          with ERR_UNAUTHORIZED and 403 — ahead of the priority 5 body-FK check, which the deliberately unknown
          project_id in the same payload would otherwise have answered with ERR_PROJECT_NOT_FOUND. The role check does
          not depend on the body being resolvable.
        test_recipe:
          setup:
            - "One unrelated AttractionProject exists so that a server-issued version token is available; the trigger payload deliberately cites a different, unknown project id."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-RB2", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, pv0: $.data.version }
          trigger:
            - call: "POST /budget-ledger-entries"
              payload: { project_id: "99999999-8888-4777-8666-555544443333", entry_kind: "CHANGE_ORDER", amount_cents: 500000000, memo: "Unauthorised change order", expected_project_version: "${pv0}" }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${err} == ERR_UNAUTHORIZED"
            - "${err} != ERR_PROJECT_NOT_FOUND"
            - "no BudgetLedgerEntry row is created"

      - name: approver_must_differ_from_submitter_on_a_design_package
        claim_type: segregation_of_duties
        grounds:
          - roles.OwnerRep.shared_operations
          - validations[priority 12].ERR_SEGREGATION_OF_DUTIES
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / segregation_of_duties_beats_pinned_reference_stale_on_approve
          rationale: "That §1.8 instance has u-owner-1 both submit and approve the same package and asserts the duty error, which is the segregation-of-duties claim in full."

  # ===================================================================
  # SECTION 8 — Cross-Cutting Complexity Layers
  # ===================================================================
  # One OCC stale-version instance per §1.2.1 concurrency_rules entry
  # (package-create-stale-project, review-create-stale-package,
  # ride-select-stale-project), plus the fourth OCC token that lives on
  # PATCH /ride-systems/{id}, plus the version_pinning_on_approval layer.
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_expected_project_version_on_package_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[package-create-stale-project]
          - validations[priority 6].ERR_STALE_PROJECT_VERSION
          - endpoints[POST /design-packages]
        distinguishing_aspect: |
          The OCC token is the parent project's version, not the package's: an intervening PATCH that only raises the
          budget ceiling still invalidates a held token, so the create is refused with ERR_STALE_PROJECT_VERSION and 412.
          Replaying the identical payload with the version returned by that PATCH succeeds, so the refusal is provably
          about staleness and not about the payload.
        test_recipe:
          setup:
            - "One AttractionProject whose version has been moved from 1 to 2 by a ceiling patch, and one CANDIDATE RideSystem."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-CC1", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, pv0: $.data.version }
            - call: "POST /ride-systems"
              payload: { project_id: "${proj}", vendor_name: "Vekoma Rides", system_type: "DARK_RIDE_TRACKLESS", vehicle_count: 12, riders_per_vehicle: 8, block_zone_count: 14, cycle_time_seconds: 240, availability_pct: 96, load_efficiency_pct: 90, show_stops_per_hour: 1.5 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { rs: $.data.id }
            - call: "PATCH /attraction-projects/${proj}"
              payload: { expected_project_version: "${pv0}", budget_ceiling_cents: 3800000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { pv1: $.data.version }
          trigger:
            - call: "POST /design-packages"
              payload: { project_id: "${proj}", ride_system_id: "${rs}", package_label: "Show Set Release 1", discipline_scope: "SHOW_SET", base_construction_cost_cents: 400000000, expected_project_version: "${pv0}" }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { err: $.data.error_id }
            - call: "POST /design-packages"
              payload: { project_id: "${proj}", ride_system_id: "${rs}", package_label: "Show Set Release 1", discipline_scope: "SHOW_SET", base_construction_cost_cents: 400000000, expected_project_version: "${pv1}" }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { pkg: $.data.id, total: $.data.total_cost_of_work_cents }
          assert:
            - "${pv1} == 2"
            - "the stale create returns HTTP status 412"
            - "${err} == ERR_STALE_PROJECT_VERSION"
            - "the replayed create returns HTTP status 201"
            - "${total} == 515200000"
            - "DesignPackage.${pkg}.status == DRAFT"
            - "GET /design-packages with project_id filter returns total_count == 1"

      - name: stale_expected_package_version_on_review_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[review-create-stale-package]
          - validations[priority 6].ERR_STALE_PACKAGE_VERSION
          - endpoints[POST /safety-reviews]
        distinguishing_aspect: |
          The reviewer holds the package version it saw at submit time, but the owner's approval moved it on, so opening
          a third-party review against that token is refused with ERR_STALE_PACKAGE_VERSION and 412. The OCC check sits
          at priority 6, above the package-state check at priority 7, and the replay with the approval's version then
          succeeds — which shows the reviewer was blocked by staleness rather than by the package's status.
        test_recipe:
          setup:
            - "One AttractionProject with a package submitted by u-cd-1 (version 2) and then approved by u-owner-1 (version 3)."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-CC2", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, pv0: $.data.version }
            - call: "POST /ride-systems"
              payload: { project_id: "${proj}", vendor_name: "Vekoma Rides", system_type: "DARK_RIDE_TRACKLESS", vehicle_count: 12, riders_per_vehicle: 8, block_zone_count: 14, cycle_time_seconds: 240, availability_pct: 96, load_efficiency_pct: 90, show_stops_per_hour: 1.5 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { rs: $.data.id }
            - call: "POST /design-packages"
              payload: { project_id: "${proj}", ride_system_id: "${rs}", package_label: "Ride And Controls Release 1", discipline_scope: "RIDE_AND_CONTROLS", base_construction_cost_cents: 400000000, expected_project_version: "${pv0}" }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { pkg: $.data.id }
            - call: "POST /design-packages/${pkg}/submit"
              payload: {}
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { pkgv1: $.data.version }
            - call: "POST /design-packages/${pkg}/approve"
              payload: { expected_package_version: "${pkgv1}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { pkgv2: $.data.version }
          trigger:
            - call: "POST /safety-reviews"
              payload: { design_package_id: "${pkg}", standard_code: "ASTM_F2291", expected_package_version: "${pkgv1}" }
              as: ThirdPartyReviewer
              as_user_id: "u-tpr-1"
              captures: { err: $.data.error_id }
            - call: "POST /safety-reviews"
              payload: { design_package_id: "${pkg}", standard_code: "ASTM_F2291", expected_package_version: "${pkgv2}" }
              as: ThirdPartyReviewer
              as_user_id: "u-tpr-1"
              captures: { rev: $.data.id }
          assert:
            - "${pkgv1} == 2"
            - "${pkgv2} == 3"
            - "the stale review create returns HTTP status 412"
            - "${err} == ERR_STALE_PACKAGE_VERSION"
            - "${err} != ERR_PACKAGE_STATE_INVALID"
            - "the replayed review create returns HTTP status 201"
            - "SafetyReview.${rev}.status == OPEN"
            - "DesignPackage.${pkg}.status == APPROVED"

      - name: stale_expected_project_version_on_ride_system_select_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[ride-select-stale-project]
          - validations[priority 6].ERR_STALE_PROJECT_VERSION
          - endpoints[POST /ride-systems/{id}/select]
        distinguishing_aspect: |
          Selecting the ride system is a write against the project row, so the token is expected_project_version even
          though the path names a RideSystem. A ceiling patch in between makes the held token stale, the select is
          refused with 412 and selected_ride_system_id stays null; the same call with the patched version then succeeds
          and the OCC check is shown to precede the priority 37 capacity comparison, which this adequate system passes
          anyway.
        test_recipe:
          setup:
            - "One AttractionProject at version 2 after a ceiling patch, with one adequate CANDIDATE RideSystem (operational 1179 against a required 800)."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-CC3", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, pv0: $.data.version }
            - call: "POST /ride-systems"
              payload: { project_id: "${proj}", vendor_name: "Vekoma Rides", system_type: "DARK_RIDE_TRACKLESS", vehicle_count: 12, riders_per_vehicle: 8, block_zone_count: 14, cycle_time_seconds: 240, availability_pct: 96, load_efficiency_pct: 90, show_stops_per_hour: 1.5 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { rs: $.data.id }
            - call: "PATCH /attraction-projects/${proj}"
              payload: { expected_project_version: "${pv0}", budget_ceiling_cents: 3800000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { pv1: $.data.version }
          trigger:
            - call: "POST /ride-systems/${rs}/select"
              payload: { expected_project_version: "${pv0}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { err: $.data.error_id }
            - call: "POST /ride-systems/${rs}/select"
              payload: { expected_project_version: "${pv1}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
          assert:
            - "the stale select returns HTTP status 412"
            - "${err} == ERR_STALE_PROJECT_VERSION"
            - "${err} != ERR_CAPACITY_TARGET_NOT_MET"
            - "the replayed select returns HTTP status 200"
            - "RideSystem.${rs}.status == SELECTED"
            - "AttractionProject.${proj}.selected_ride_system_id == ${rs}"
            - "AttractionProject.${proj}.version == 3"

      - name: stale_expected_ride_system_version_on_patch_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - validations[priority 6].ERR_STALE_RIDE_SYSTEM_VERSION
          - endpoints[PATCH /ride-systems/{id}]
        distinguishing_aspect: |
          The ride-system row carries its own OCC token, distinct from the project's: after one accepted patch takes the
          row to version 2, replaying the first patch's token is refused with ERR_STALE_RIDE_SYSTEM_VERSION rather than
          ERR_STALE_PROJECT_VERSION, and the row keeps the values written by the accepted patch (load_efficiency 80,
          operational floor(1440 * (0.96 * 0.80 - 0.045)) = floor(1041.12) = 1041) instead of being silently overwritten.
        test_recipe:
          setup:
            - "One CANDIDATE RideSystem already patched once, so its version is 2."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-CC4", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id }
            - call: "POST /ride-systems"
              payload: { project_id: "${proj}", vendor_name: "Vekoma Rides", system_type: "DARK_RIDE_TRACKLESS", vehicle_count: 12, riders_per_vehicle: 8, block_zone_count: 14, cycle_time_seconds: 240, availability_pct: 96, load_efficiency_pct: 90, show_stops_per_hour: 1.5 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { rs: $.data.id, rsv1: $.data.version }
            - call: "PATCH /ride-systems/${rs}"
              payload: { expected_ride_system_version: "${rsv1}", load_efficiency_pct: 80 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { rsv2: $.data.version, op_after_first: $.data.operational_hourly_capacity_guests }
          trigger:
            - call: "PATCH /ride-systems/${rs}"
              payload: { expected_ride_system_version: "${rsv1}", load_efficiency_pct: 60 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { err: $.data.error_id }
          assert:
            - "${rsv1} == 1"
            - "${rsv2} == 2"
            - "${op_after_first} == 1041"
            - "HTTP status == 412"
            - "${err} == ERR_STALE_RIDE_SYSTEM_VERSION"
            - "${err} != ERR_STALE_PROJECT_VERSION"
            - "RideSystem.${rs}.load_efficiency_pct == 80"
            - "RideSystem.${rs}.operational_hourly_capacity_guests == 1041"
            - "RideSystem.${rs}.version == 2"

      - name: package_approval_rejects_a_ride_system_that_moved_after_submit
        claim_type: version_pinning_on_approval
        grounds:
          - complexity_profile.cross_cutting_layers
          - entities.DesignPackage.fields.pinned_ride_system_version
          - validations[priority 16].ERR_PINNED_REFERENCE_STALE
          - endpoints[POST /design-packages/{id}/approve]
        distinguishing_aspect: |
          Submit pins the ride system's version onto the package; a later engineering patch of that ride system leaves
          the package's own OCC token perfectly current, so approve passes priority 6 and is stopped instead at priority
          16 with ERR_PINNED_REFERENCE_STALE. Segregation of duties is deliberately satisfied here (u-cd-1 submitted,
          u-owner-1 approves) so that the priority 12 error cannot mask the pin check, and the package stays SUBMITTED
          with no commitment minted.
        test_recipe:
          setup:
            - "One AttractionProject with a package submitted by u-cd-1 while its ride system was at version 1, after which the ride system was patched to version 2."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-CC5", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, pv0: $.data.version }
            - call: "POST /ride-systems"
              payload: { project_id: "${proj}", vendor_name: "Vekoma Rides", system_type: "DARK_RIDE_TRACKLESS", vehicle_count: 12, riders_per_vehicle: 8, block_zone_count: 14, cycle_time_seconds: 240, availability_pct: 96, load_efficiency_pct: 90, show_stops_per_hour: 1.5 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { rs: $.data.id, rsv1: $.data.version }
            - call: "POST /design-packages"
              payload: { project_id: "${proj}", ride_system_id: "${rs}", package_label: "Ride And Controls Release 1", discipline_scope: "RIDE_AND_CONTROLS", base_construction_cost_cents: 400000000, expected_project_version: "${pv0}" }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { pkg: $.data.id }
            - call: "POST /design-packages/${pkg}/submit"
              payload: {}
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { pkgv1: $.data.version, pinned: $.data.pinned_ride_system_version }
            - call: "PATCH /ride-systems/${rs}"
              payload: { expected_ride_system_version: "${rsv1}", load_efficiency_pct: 80 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { rsv2: $.data.version }
          trigger:
            - call: "POST /design-packages/${pkg}/approve"
              payload: { expected_package_version: "${pkgv1}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { err: $.data.error_id }
          assert:
            - "${pinned} == 1"
            - "${rsv2} == 2"
            - "HTTP status == 409"
            - "${err} == ERR_PINNED_REFERENCE_STALE"
            - "${err} != ERR_SEGREGATION_OF_DUTIES"
            - "${err} != ERR_STALE_PACKAGE_VERSION"
            - "DesignPackage.${pkg}.status == SUBMITTED"
            - "DesignPackage.${pkg}.approved_by_user_id == null"
            - "GET /attraction-projects/${proj}/budget-position returns committed_cost_cents == 0"
            - "GET /attraction-projects/${proj}/budget-ledger-entries returns total_count == 0"

      - name: one_write_propagates_through_three_aggregates
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.cross_cutting_layers
        excluded_because:
          difficulty_instance: transitive_cascade / critical_finding_cascade_freezes_program_and_holds_sequenced_scenes
          rationale: "That §1.8 instance walks finding -> review -> project counter -> posture -> per-scene hold in a single request and asserts every hop."

      - name: the_same_row_reports_two_capacities
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.cross_cutting_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / ride_capacity_theoretical_and_operational_diverge_on_one_row
          rationale: "That §1.8 instance asserts both variants in the same response and shows which one the gates read."

      - name: committed_and_forecast_bases_are_reconciled_after_adoption
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.cross_cutting_layers
        excluded_because:
          difficulty_instance: compensating_invariant / ledger_reversal_restores_committed_cost_and_posture_without_drift
          rationale: "That §1.8 instance asserts that the derived committed_cost_cents always equals the replayed ledger, before and after a compensating reversal, with no drift."

  # ===================================================================
  # SECTION 9 — Consistency Model
  # ===================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_shows_the_recomputed_capacity_in_the_same_patch_response
        claim_type: all_changes_visible_in_same_request_response
        grounds:
          - complexity_profile.consistency_model
          - calculations.project_required_hourly_capacity
          - endpoints[PATCH /attraction-projects/{id}]
          - endpoints[GET /attraction-projects/{id}/capacity-summary]
        distinguishing_aspect: |
          The model is immediate, so no read-after-write settling is permitted: the PATCH that raises
          design_day_attendance from 8000 to 12000 must already report required_hourly_capacity_guests 1200 in its own
          response body, and the capacity-summary read that follows must agree to the guest. Because the project's
          selected ride system delivers only 1179 operational guests per hour, the same response is what turns a
          previously satisfied capacity target into a deficit — a deferred recomputation would leave 800 visible and hide
          the deficit until some later refresh.
        test_recipe:
          setup:
            - "One AttractionProject at CONCEPT with RS_A selected: required 800 against operational 1179."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-CM1", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, pv0: $.data.version, required_before: $.data.required_hourly_capacity_guests }
            - call: "POST /show-scenes"
              payload: { project_id: "${proj}", scene_label: "Prologue", sequence_index: 1, duration_seconds: 180 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { sc1: $.data.id }
            - call: "POST /ride-systems"
              payload: { project_id: "${proj}", vendor_name: "Vekoma Rides", system_type: "DARK_RIDE_TRACKLESS", vehicle_count: 12, riders_per_vehicle: 8, block_zone_count: 14, cycle_time_seconds: 240, availability_pct: 96, load_efficiency_pct: 90, show_stops_per_hour: 1.5 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { rs: $.data.id }
            - call: "POST /attraction-projects/${proj}/advance-phase"
              payload: { to_phase: "CONCEPT", expected_project_version: "${pv0}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { pv1: $.data.version }
            - call: "POST /ride-systems/${rs}/select"
              payload: { expected_project_version: "${pv1}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "GET /attraction-projects/${proj}"
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { pv2: $.data.version }
          trigger:
            - call: "PATCH /attraction-projects/${proj}"
              payload: { expected_project_version: "${pv2}", design_day_attendance: 12000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { required_in_patch_response: $.data.required_hourly_capacity_guests }
            - call: "GET /attraction-projects/${proj}/capacity-summary"
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { required_in_summary: $.data.required_hourly_capacity_guests, operational_in_summary: $.data.operational_hourly_capacity_guests }
          assert:
            - "${required_before} == 800"
            - "the patch returns HTTP status 200"
            - "${required_in_patch_response} == 1200"
            - "${required_in_summary} == 1200"
            - "${operational_in_summary} == 1179"
            - "AttractionProject.${proj}.design_day_attendance == 12000"
            - "AttractionProject.${proj}.selected_ride_system_id == ${rs}"





