          rationale: "That §1.8 instance contrasts the PROVISIONAL_MONITORING cohort (every INCLUDED case) with the VERIFICATION_AUDIT cohort (only VALIDATED or LOCKED cases) on one dataset."
      - name: deficiency_penalty_weights_and_cap
        claim_type: weighted_scoring
        grounds:
          - calculations.verification_readiness_score
        excluded_because:
          difficulty_instance: combinatorial_formula / readiness_deficiency_penalty_saturates_at_sixty_point_cap
          rationale: "The 15/6/2 weighting and the 60 point DEFICIENCY_PENALTY_CAP saturation are asserted there with pre-computed literals."
      - name: readiness_variant_selection_between_reviewer_and_self_assessment
        claim_type: variant_selection
