  # =========================================================================
  # Rule 9 — compensating-action invariants over different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: withdraw_conserves_program_slots_on_the_session
        grounds:
          - state_machines.Enrollment.REQUESTED_to_CONFIRMED
          - state_machines.Enrollment.CONFIRMED_to_WITHDRAWN
          - entities.ProgramSession.fields.slots_committed
          - entities.ProgramSession.fields.slots_available
          - entities.ProgramSession.fields.slot_capacity
        distinguishing_aspect: |
          Conserved quantity 1 = PROGRAM SLOTS. slot_capacity == slots_committed +
          slots_available must hold before the confirm, between the two confirms, and
          after the withdraw, with slots_committed equal to the CONFIRMED enrollment
          count at every step and zero drift once the compensating action has run.
        test_recipe:
          setup:
            - "A LOW-risk program and one OPEN session with slot_capacity 2 and an empty waitlist."
            - "Two ACTIVE INDEPENDENT participants, both CONFIRMED, so slots_committed is 2 and slots_available is 0."
          setup_api_calls:
            - call: "POST /recreation/fee-scale-bands"
              payload: { household_size_min: 1, household_size_max: 6, income_band: "BAND_C", per_session_cents: 4000, series_cents: 24000 }
              as: ProgramAdmin
              captures: { band_c: "$.data.id" }
            - call: "POST /recreation/activity-programs"
              payload: { name: "Inclusive Yoga", activity_type: "FITNESS", risk_tier: "LOW", pricing_mode: "PER_SESSION", rounding_policy: "ROUND_ON_TOTAL", waitlist_policy: "FIFO", fee_multiplier_bp: 10000, scheduled_session_count: 1, required_consent_types: [], required_certification_types: [], requires_medication_admin: false }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /recreation/program-sessions"
              payload: { program_id: "${prog}", start_at: "2026-06-10T14:00:00Z", end_at: "2026-06-10T16:00:00Z", slot_capacity: 2, one_to_one_pool_size: 0 }
              as: ProgramAdmin
              captures: { sess: "$.data.id" }
            - call: "POST /recreation/participants"
              payload: { legal_name: "Ada Rivera", date_of_birth: "2010-03-04", household_id: "HH-1", household_size: 3, income_band: "BAND_C", weight_kg: 40, mobility_profile: "AMBULATORY", guardianship_status: "GUARDIAN_REQUIRED" }
              as: IntakeCoordinator
              captures: { p1: "$.data.id", p1_v: "$.data.version" }
            - call: "POST /recreation/support-assessments"
              payload: { participant_id: "${p1}", assessed_on: "2026-04-01", effective_from: "2026-04-01T00:00:00Z", support_tier: "INDEPENDENT", expected_participant_version: "${p1_v}" }
              as: IntakeCoordinator
              captures: { a1: "$.data.id" }
            - call: "POST /recreation/support-assessments/${a1}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /recreation/participants/${p1}/status"
              payload: { target_status: "ACTIVE" }
              as: IntakeCoordinator
            - call: "POST /recreation/participants"
              payload: { legal_name: "Ben Osei", date_of_birth: "2009-07-15", household_id: "HH-2", household_size: 3, income_band: "BAND_C", weight_kg: 45, mobility_profile: "AMBULATORY", guardianship_status: "GUARDIAN_REQUIRED" }
              as: IntakeCoordinator
              captures: { p2: "$.data.id", p2_v: "$.data.version" }
            - call: "POST /recreation/support-assessments"
              payload: { participant_id: "${p2}", assessed_on: "2026-04-01", effective_from: "2026-04-01T00:00:00Z", support_tier: "INDEPENDENT", expected_participant_version: "${p2_v}" }
              as: IntakeCoordinator
              captures: { a2: "$.data.id" }
            - call: "POST /recreation/support-assessments/${a2}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /recreation/participants/${p2}/status"
              payload: { target_status: "ACTIVE" }
              as: IntakeCoordinator
            - call: "POST /recreation/program-sessions/${sess}/open"
              payload: {}
              as: ProgramAdmin
            - call: "GET /recreation/program-sessions/${sess}"
              payload: {}
              as: ProgramAdmin
              captures: { sv1: "$.data.version" }
            - call: "POST /recreation/enrollments"
              payload: { participant_id: "${p1}", session_id: "${sess}", expected_session_version: "${sv1}" }
              as: IntakeCoordinator
              captures: { e1: "$.data.id" }
            - call: "POST /recreation/enrollments/${e1}/confirm"
              payload: {}
              as: IntakeCoordinator
            - call: "GET /recreation/program-sessions/${sess}"
              payload: {}
              as: ProgramAdmin
              captures: { sv2: "$.data.version" }
            - call: "POST /recreation/enrollments"
              payload: { participant_id: "${p2}", session_id: "${sess}", expected_session_version: "${sv2}" }
