          A life event does not use PlanYear.coverage_start. window_deadline is
          event_date plus LIFE_EVENT_WINDOW_DAYS 31 giving 2027-03-08, and
          coverage_effective_date is the first day of the month AFTER the event
          date, 2027-03-01 - not the event date itself, not 30 days later, and
          not the plan year's 2027-01-01 coverage_start. The clock sits five days
          inside the closed window.
        test_recipe:
          setup:
            - "PlanYear 2027 OPEN with coverage_start 2027-01-01T00:00:00Z; its annual window closed on 2026-11-15."
            - "PlanOption PRE65-CORE ACTIVE."
            - "R1 CERTIFIED ELIGIBLE for 2027."
            - "Logical clock at 2027-02-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/plan-years"
              payload: { year: 2027, open_enrollment_start: "2026-10-15T00:00:00Z", open_enrollment_end: "2026-11-15T00:00:00Z", coverage_start: "2027-01-01T00:00:00Z", hra_credit_pre_medicare_cents: 185000, hra_credit_medicare_cents: 209500, carryover_cap_pct: 0.5, discount_rate_bps: 500, assumed_annual_subsidy_cents: 240000, assumed_payment_years: 20 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { py_id: $.data.id }
            - call: "POST /retiree-benefits/plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/plan-options"
              payload: { plan_year_id: "${py_id}", plan_code: "PRE65-CORE", coverage_class: "PRE_MEDICARE_GROUP", monthly_premium_cents: 74500, requires_medicare_part_b: false, allowed_grandfather_groups: ["GRANDFATHERED_A", "TRANSITION_B", "STANDARD_C"], subsidy_vehicle: "NONE", rx_gross_value_bps: 0, rx_net_value_bps: 0 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { po_pre_id: $.data.id }
            - call: "POST /retiree-benefits/plan-options/${po_pre_id}/activate"
              payload: {}
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/retirees"
              payload: { full_name: "Rosa Alvarez", birth_date: "1963-06-01", hire_date: "1990-06-01", retirement_date: "2026-12-31", credited_service_months: 150 }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { r1_id: $.data.id, r1_v: $.data.version }
            - call: "POST /retiree-benefits/eligibility-determinations"
              payload: { retiree_id: "${r1_id}", plan_year_id: "${py_id}", expected_retiree_version: "${r1_v}" }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { det1_id: $.data.id }
            - call: "POST /retiree-benefits/eligibility-determinations/${det1_id}/certify"
              payload: {}
              as: EligibilityAnalyst
              as_user_id: "analyst-02"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-10T00:00:00Z" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /retiree-benefits/election-events"
              payload: { retiree_id: "${r1_id}", plan_year_id: "${py_id}", requested_plan_option_id: "${po_pre_id}", event_type: "LOSS_OF_OTHER_COVERAGE", event_date: "2027-02-05" }
              as: EnrollmentCounselor
              as_user_id: "counselor-01"
              captures: { ee_le_id: $.data.id }
          assert:
            - "HTTP status is 201, admitted even though the annual window closed on 2026-11-15"
            - "data.event_type == LOSS_OF_OTHER_COVERAGE and data.status == SUBMITTED"
            - "data.window_deadline == 2027-03-08T00:00:00.000Z, from 2027-02-05 plus LIFE_EVENT_WINDOW_DAYS 31"
            - "data.coverage_effective_date == 2027-03-01T00:00:00.000Z, the first day of the month after the event"
            - "data.coverage_effective_date is NOT 2027-01-01, the plan year's coverage_start"
            - "data.resulting_enrollment_id is null and data.denial_reason_code is null"

      - name: hra_funding_rounding_order_floors_per_month
        claim_type: Precision
        grounds:
          - calculations.hra_annual_funding_and_carryover.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / hra_funding_monthly_floor_before_multiply
          rationale: "That instance asserts 122206 against the rejected 122208 for base 209500 and covered_months 7, which is precisely the pinned floor-then-multiply order."

      - name: liability_method_variants_diverge_on_identical_inputs
        claim_type: Variant Divergence
