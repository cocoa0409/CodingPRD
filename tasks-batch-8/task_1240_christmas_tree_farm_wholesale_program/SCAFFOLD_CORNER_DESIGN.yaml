            - { call: "POST /api/buyer-accounts", payload: { name: "Tight Credit Co", credit_limit_cents: 48500 }, as: Owner, captures: { buy: $.data.id } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 100, unit_price_cents: 500 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { o1: $.data.id } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 100, unit_price_cents: 500 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { o2: $.data.id } }
          trigger:
