# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Authenticated role not in the endpoint's roles list"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a from-state the requested transition allows (includes terminal lockdown and double-trigger idempotency failures)"
  - id: ERR_SOD_VIOLATION
    http: 422
    condition: "Segregation-of-duties breach: actor matches the recorded counterparty for this step"
  - id: ERR_TEMPORAL_INVALID
    http: 422
    condition: "Temporal sanity violation (end <= start, requested_last_day before notice, acknowledgment after close)"
  - id: ERR_REFERENTIAL_INTEGRITY
    http: 422
    condition: "FK target missing or unique-per-case / unique-pair constraint violated"
  - id: ERR_SCHEDULE_OVERLAP
    http: 422
    condition: "New window overlaps an existing SCHEDULED window under the same parent per the declared interval semantics"
  - id: ERR_RETRY_CAP_EXCEEDED
    http: 422
    condition: "Retry/reschedule/requeue cap reached"
  - id: ERR_SEQUENCE_GATE
    http: 422
    condition: "Revocation ordering gate: lower sequence_rank siblings not terminal, or waive attempted before retry cap"
  - id: ERR_FISCAL_INVALID
    http: 422
    condition: "Fiscal input out of range (wage <= 0, negative balance/cost/wages)"
  - id: ERR_DEADLINE_MISSED
    http: 422
    condition: "Legal deadline protection triggered (benefits send past send_by; close without FINALIZED rehire review)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Payload shape violation (missing required field, bad enum, bad type)"
  - id: ERR_STALE_VERSION_GENERIC
    http: 412
    condition: "Generic OCC mismatch when no rule-specific error applies"
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "OCC mismatch on OffboardingCase.version during close"
  - id: ERR_STALE_STATEMENT_VERSION
    http: 412
    condition: "OCC mismatch on FinalPayStatement.version during calculate"
  - id: ERR_STALE_ASSET_VERSION
    http: 412
    condition: "OCC mismatch on AssetReturnItem.version during record-return"
  - id: ERR_CASE_TERMINAL
    http: 409
    condition: "Operation attempted against a CLOSED or VOIDED case"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Test-driving clock operations only; no business-surface access"
    identity: "opaque"
    exclusive_operations:
      - "POST /offboarding/_clock/set_current_utc"
      - "GET /offboarding/_clock/current_utc"
    shared_operations: []
  - name: HRPartner
    description: "HR generalist running the offboarding case lifecycle"
    identity: "opaque"
    exclusive_operations:
      - "POST /offboarding/offboarding-cases"
      - "POST /offboarding/offboarding-cases/{id}/approve"
      - "POST /offboarding/offboarding-cases/{id}/close"
      - "POST /offboarding/offboarding-cases/{id}/void"
      - "POST /offboarding/exit-interviews*"
      - "POST /offboarding/restrictive-covenant-acks*"
    shared_operations:
      - "GET reads across most collections"
  - name: HRReviewer
    description: "HR reviewer for rehire eligibility (segregated from finalizer)"
    identity: "opaque"
    exclusive_operations:
      - "POST /offboarding/rehire-eligibility-reviews/{id}/submit"
    shared_operations:
      - "GET reads of cases and reviews"
  - name: HRDirector
    description: "HR director who finalizes/returns rehire reviews"
    identity: "opaque"
    exclusive_operations:
      - "POST /offboarding/rehire-eligibility-reviews/{id}/finalize"
      - "POST /offboarding/rehire-eligibility-reviews/{id}/return"
    shared_operations:
      - "GET reads of cases, reviews, notices, interviews"
  - name: PayrollSpecialist
    description: "Calculates/approves/disburses final pay; marks assets defaulted"
    identity: "opaque"
    exclusive_operations:
      - "POST /offboarding/final-pay-statements/{id}/calculate"
      - "POST /offboarding/final-pay-statements/{id}/recalculate"
      - "POST /offboarding/final-pay-statements/{id}/approve"
      - "POST /offboarding/final-pay-statements/{id}/disburse"
      - "POST /offboarding/asset-return-items/{id}/mark-defaulted"
    shared_operations:
      - "GET reads of statements, assets, cases"
  - name: ITOperator
    description: "Executes and retries revocation tasks"
    identity: "opaque"
    exclusive_operations:
      - "POST /offboarding/access-revocation-tasks/{id}/execute"
      - "POST /offboarding/access-revocation-tasks/{id}/retry"
    shared_operations:
      - "GET reads of revocation tasks and cases"
  - name: ITVerifier
    description: "Verifies executed revocations (segregated from executor)"
    identity: "opaque"
    exclusive_operations:
      - "POST /offboarding/access-revocation-tasks/{id}/verify"
    shared_operations:
      - "GET reads of revocation tasks"
  - name: ITManager
    description: "Creates and waives revocation tasks"
    identity: "opaque"
    exclusive_operations:
      - "POST /offboarding/access-revocation-tasks"
      - "POST /offboarding/access-revocation-tasks/{id}/waive"
    shared_operations:
      - "GET reads of revocation tasks"
  - name: Manager
    description: "People manager owning KT plan/sessions and receiving notifications"
    identity: "opaque"
    exclusive_operations:
      - "POST /offboarding/knowledge-transfer-plans/{id}/activate"
      - "POST /offboarding/knowledge-transfer-plans/{id}/complete"
      - "POST /offboarding/knowledge-transfer-plans/{id}/waive"
      - "POST /offboarding/knowledge-transfer-sessions"
      - "POST /offboarding/knowledge-transfer-sessions/{id}/complete"
      - "POST /offboarding/knowledge-transfer-sessions/{id}/cancel"
    shared_operations:
      - "GET reads of plans, sessions, notifications, interviews, assets, cases"
  - name: AssetClerk
    description: "Tracks assets, records returns, waives items"
    identity: "opaque"
    exclusive_operations:
      - "POST /offboarding/asset-return-items"
      - "POST /offboarding/asset-return-items/{id}/record-return"
      - "POST /offboarding/asset-return-items/{id}/waive"
    shared_operations:
      - "GET reads of assets and cases"
  - name: BenefitsAdministrator
    description: "Owns benefits/COBRA notice handoff"
    identity: "opaque"
    exclusive_operations:
      - "POST /offboarding/benefits-notices"
      - "POST /offboarding/benefits-notices/{id}/send"
      - "POST /offboarding/benefits-notices/{id}/acknowledge"
      - "POST /offboarding/benefits-notices/{id}/report-failure"
      - "POST /offboarding/benefits-notices/{id}/requeue"
      - "POST /offboarding/benefits-notices/{id}/escalate"
    shared_operations:
      - "GET reads of notices and cases"
