# =============================================================================
# Scaffold: Vertically Integrated Furniture Manufacturing & Licensed Store Program
# task_3444
# =============================================================================

scenario: |
  Vertically Integrated Furniture Manufacturing & Licensed Store Program (Ashley Furniture): domestic and overseas manufacturing with component production including foam, frames and upholstery brought in-house, licensed store program where independent operators run branded stores with product exclusivity and merchandising standards, distribution center network supplying both licensed stores and independent retail accounts with delivery scheduling, product line development with a wide assortment at fixed price points and rapid style turnover, capacity allocation between licensee demand and wholesale accounts during supply constraints, freight and delivery models including customer home delivery through licensee operations, warranty and parts support across a very large installed base, licensee territory assignment and performance standards

domain_name: furniture-license-program
api_prefix: /api

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - ops_run_checkpoint
    - optimistic_concurrency
  entity_topology: hybrid
  # Flat FK-linked peers for buyers/factories/DCs + cross-aggregate guards
  # (appointment -> order state, order -> line lifecycle, territory -> licensee).
  state_machine_shape: parallel
  # SupplyOrder carries two independent axes (allocation_state x fulfillment_state);
  # Licensee and WarrantyClaim machines are cyclic; AllocationCycle is linear with
  # system-driven side effects.
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic       # SupplyOrder buyer: licensee_id XOR retail_account_id keyed by buyer_type
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Factory
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique factory code" }
      - { name: region, type: enum, source: input, description: "DOMESTIC | OVERSEAS" }
      - { name: component_lines, type: array, source: input, description: "Non-empty array of in-house component lines: FOAM | FRAMES | UPHOLSTERY" }
      - { name: weekly_capacity_units, type: integer, source: input, description: "Nominal weekly production capacity in furniture units, > 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CONSTRAINED | OFFLINE; starts ACTIVE", default: ACTIVE }

  - name: ProductLine
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Collection name" }
      - { name: category, type: enum, source: input, description: "UPHOLSTERY | CASEGOODS | BEDDING" }
      - { name: style_code, type: string, source: input, description: "Style identifier for turnover tracking" }
      - { name: price_point_cents, type: integer, source: input, description: "Fixed price point; MUST be a member of PRICE_LADDER_CENTS (see calculations.order_pricing)" }
      - { name: lifecycle, type: enum, source: system, description: "CONCEPT | ACTIVE | CLEARANCE | RETIRED; starts CONCEPT", default: CONCEPT }
      - { name: clearance_price_cents, type: integer, source: computed, description: "round_half_up(price_point_cents * 0.75); recomputed on every price change" }

  - name: Licensee
    parent: null
    common_fields: true
    fields:
      - { name: business_name, type: string, source: input, description: "Independent operator legal name" }
      - { name: royalty_rate, type: number, source: input, description: "Royalty fraction owed on DELIVERED licensee order totals", default: 0.04 }
      - { name: merchandising_standard_version, type: string, source: input, description: "Pinned merchandising standards revision", default: "MS-2026.1" }
      - { name: latest_audit_score, type: integer, source: input, description: "Most recent merchandising standards audit, 0..100", default: 80 }
      - { name: status, type: enum, source: system, description: "APPLICANT | ACTIVE | PROBATION | SUSPENDED | TERMINATED; starts APPLICANT", default: APPLICANT }
      - { name: last_cycle_score, type: number, source: computed, description: "Instantaneous performance score of most recently closed cycle; null until first close" }
      - { name: seasoned_score, type: number, source: computed, description: "Weight-renormalized trailing score per calculations.performance_score; null until first close" }
      - { name: royalty_accrued_cents, type: integer, source: computed, description: "Sum of per-order rounded royalties on DELIVERED licensee orders; starts 0", default: 0 }
      - { name: chargeback_cents, type: integer, source: computed, description: "Sum of chargebacks from APPROVED DAMAGE_IN_TRANSIT claims; starts 0", default: 0 }
      - { name: net_royalty_cents, type: integer, source: computed, description: "royalty_accrued_cents - chargeback_cents" }

  - name: Territory
    parent: null
    common_fields: true
    fields:
      - { name: region_code, type: string, source: input, description: "Unique delivery region code, e.g. T-SEA" }
      - { name: population_tier, type: enum, source: input, description: "METRO | SUBURBAN | RURAL" }
      - { name: status, type: enum, source: system, description: "OPEN | ASSIGNED; starts OPEN", default: OPEN }
      - { name: assigned_licensee_id, type: string, source: system, description: "FK -> Licensee.id; null while OPEN", default: null }
      - { name: assigned_at, type: datetime, source: system, description: "Set on assignment; null while OPEN", default: null }
      - { name: revoked_at, type: datetime, source: system, description: "Stamped at most recent revocation; null if never revoked", default: null }

  - name: RetailAccount
    parent: null
    common_fields: true
    fields:
      - { name: business_name, type: string, source: input, description: "Independent retail account name (non-licensed wholesale customer)" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum open credit exposure, > 0" }
      - { name: credit_used_cents, type: integer, source: computed, description: "Open exposure per calculations.credit_exposure; starts 0", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | HOLD | CLOSED; starts ACTIVE", default: ACTIVE }

  - name: DistributionCenter
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique DC code" }
      - { name: supports_home_delivery, type: boolean, source: input, description: "Whether this DC dispatches licensee home-delivery appointments" }
      - { name: daily_crew_units, type: integer, source: input, description: "Concurrent home-delivery crew capacity, 1..20", default: 6 }
      - { name: region_codes, type: array, source: input, description: "Region codes this DC covers for freight and home delivery" }

  - name: AllocationCycle
    parent: null
    common_fields: true
    fields:
      - { name: factory_id, type: string, source: input, description: "FK -> Factory.id" }
      - { name: week_start, type: datetime, source: input, description: "Production week window start; MUST be midnight-aligned (00:00:00Z). The cycle occupies the half-open week [week_start, week_start + 7 days)" }
      - { name: capacity_units, type: integer, source: system, description: "Pinned at creation: factory.weekly_capacity_units when ACTIVE, floor(weekly_capacity_units * 0.5) when CONSTRAINED" }
      - { name: status, type: enum, source: system, description: "OPEN | ALLOCATED | CLOSED; starts OPEN", default: OPEN }
      - { name: licensee_reserved_units, type: integer, source: computed, description: "Sum of quantity over this cycle's orders with buyer_type LICENSEE and allocation_state in {RESERVED, ALLOCATED}" }
      - { name: wholesale_reserved_units, type: integer, source: computed, description: "Same sum for buyer_type RETAIL_ACCOUNT" }
      - { name: available_units, type: integer, source: computed, description: "capacity_units - licensee_reserved_units - wholesale_reserved_units; never negative" }
      - { name: run_at, type: datetime, source: system, description: "Timestamp of run-allocation; null until run", default: null }
      - { name: closed_at, type: datetime, source: system, description: "Timestamp of close; null until closed", default: null }

  - name: SupplyOrder
    parent: null
    common_fields: true
    fields:
      - { name: buyer_type, type: enum, source: input, description: "LICENSEE | RETAIL_ACCOUNT; selects which buyer FK is authoritative" }
      - { name: licensee_id, type: string, source: input, description: "FK -> Licensee.id; required when buyer_type == LICENSEE, must be null otherwise" , default: null }
      - { name: retail_account_id, type: string, source: input, description: "FK -> RetailAccount.id; required when buyer_type == RETAIL_ACCOUNT, must be null otherwise", default: null }
      - { name: allocation_cycle_id, type: string, source: input, description: "FK -> AllocationCycle.id; cycle must be OPEN at create and at submit" }
      - { name: product_line_id, type: string, source: input, description: "FK -> ProductLine.id; line must be orderable (lifecycle in {ACTIVE, CLEARANCE}) at create and at submit" }
      - { name: quantity, type: integer, source: input, description: "Units ordered, > 0" }
      - { name: delivery_mode, type: enum, source: input, description: "FREIGHT_TO_STORE | HOME_DELIVERY. HOME_DELIVERY requires buyer_type LICENSEE" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Priced at create per calculations.order_pricing with the line's current lifecycle; recomputed at submit if lifecycle changed; null until create completes" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "unit_price_cents * quantity at create; recomputed at submit when the line's lifecycle changed since create" }
      - { name: final_total_cents, type: integer, source: computed, description: "Locked at run-allocation (or at post-run promotion): quantity re-priced with the line's lifecycle at run time; null until then", default: null }
      - { name: allocation_state, type: enum, source: system, description: "UNALLOCATED | RESERVED | ALLOCATED | WAITLISTED | DROPPED; starts UNALLOCATED", default: UNALLOCATED }
      - { name: fulfillment_state, type: enum, source: system, description: "PENDING | PICKED | SHIPPED | DELIVERED | CANCELLED; starts PENDING. Independent axis from allocation_state", default: PENDING }
      - { name: submitted_at, type: datetime, source: system, description: "Set at SUBMIT; null while UNALLOCATED", default: null }
      - { name: delivered_at, type: datetime, source: system, description: "Set at DELIVERED; starts warranty windows", default: null }
      - { name: cancel_reason, type: string, source: input, description: "Optional reason recorded at CANCEL", default: null }

  - name: DeliveryAppointment
    parent: null
    common_fields: true
    fields:
      - { name: supply_order_id, type: string, source: input, description: "FK -> SupplyOrder.id; order must be a HOME_DELIVERY licensee order in fulfillment_state PICKED" }
      - { name: licensee_id, type: string, source: system, description: "FK -> Licensee.id; derived from the order (never client-supplied)" }
      - { name: dc_id, type: string, source: input, description: "FK -> DistributionCenter.id; DC must support home delivery" }
      - { name: zone, type: enum, source: input, description: "LOCAL | REGIONAL | EXTENDED; drives delivery_fee estimate" }
      - { name: region_code, type: string, source: input, description: "Delivery address region; must be covered by an ASSIGNED territory of the licensee" }
      - { name: window_start, type: datetime, source: input, description: "Half-open window start; must be > now and >= now + 48h" }
      - { name: window_end, type: datetime, source: input, description: "Half-open window end; duration must be in [120, 360] minutes" }
      - { name: crew_units, type: integer, source: input, description: "Crew capacity consumed, 1..4" }
      - { name: stairs_flights, type: integer, source: input, description: "Flights of stairs at delivery address; >= 0", default: 0 }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | COMPLETED | MISSED | CANCELLED; starts REQUESTED", default: REQUESTED }
      - { name: estimate_fee_cents, type: integer, source: computed, description: "Provisional variant of calculations.delivery_fee, computed at create" }
      - { name: final_fee_cents, type: integer, source: computed, description: "Final variant of calculations.delivery_fee, computed at COMPLETED; null until then", default: null }
      - { name: actual_duration_minutes, type: integer, source: input, description: "Actual on-site duration; required when completing" , default: null }
      - { name: completed_at, type: datetime, source: system, description: "Set at COMPLETED", default: null }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: supply_order_id, type: string, source: input, description: "FK -> SupplyOrder.id; order must be a licensee order in fulfillment_state DELIVERED" }
      - { name: licensee_id, type: string, source: system, description: "FK -> Licensee.id; derived from the order" }
      - { name: claim_type, type: enum, source: input, description: "DEFECT | DAMAGE_IN_TRANSIT | MISSING_PARTS" }
      - { name: description, type: string, source: input, description: "Free-text claim description" }
      - { name: status, type: enum, source: system, description: "UNDER_REVIEW | INFO_REQUESTED | PARTS_ORDERED | RESOLVED | DENIED; starts UNDER_REVIEW", default: UNDER_REVIEW }
      - { name: info_request_count, type: integer, source: system, description: "Number of UNDER_REVIEW -> INFO_REQUESTED cycles used; starts 0", default: 0 }
      - { name: decision, type: enum, source: system, description: "APPROVED | DENIED; null until adjudicated", default: null }
      - { name: decision_note, type: string, source: input, description: "Adjudicator note recorded at decision", default: null }
      - { name: chargeback_cents, type: integer, source: computed, description: "round_half_up(order.final_total_cents * 0.15) when an APPROVED claim has claim_type DAMAGE_IN_TRANSIT; else null", default: null }
      - { name: resolved_at, type: datetime, source: system, description: "Set at RESOLVED", default: null }

  - name: PartsOrder
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> WarrantyClaim.id; set at claim approval-with-parts" }
      - { name: sku, type: string, source: input, description: "Replacement part SKU (from adjudicator's approved_parts)" }
      - { name: quantity, type: integer, source: input, description: "Units of the part, > 0" }
      - { name: status, type: enum, source: system, description: "QUEUED | SHIPPED | DELIVERED; starts QUEUED", default: QUEUED }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
# Convention: every successful mutating call on an entity with common_fields: true
# increments that entity's version by 1 and refreshes updated_at (including
# cascade-driven mutations).
state_machines:
  - entity: Factory
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: CONSTRAINED
        trigger: "POST /api/factories/{id}/transition {to_state: CONSTRAINED}"
        actor: ProductionPlanner
        preconditions: []
        side_effects: []
        note: "Future AllocationCycles created against a CONSTRAINED factory pin capacity_units = floor(weekly_capacity_units * 0.5)"
      - from: CONSTRAINED
        to: ACTIVE
        trigger: "POST /api/factories/{id}/transition {to_state: ACTIVE}"
        actor: ProductionPlanner
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: OFFLINE
        trigger: "POST /api/factories/{id}/transition {to_state: OFFLINE}"
        actor: ProductionPlanner
        preconditions: []
        side_effects: []
      - from: CONSTRAINED
        to: OFFLINE
        trigger: "POST /api/factories/{id}/transition {to_state: OFFLINE}"
        actor: ProductionPlanner
        preconditions: []
        side_effects: []
      - from: OFFLINE
        to: ACTIVE
        trigger: "POST /api/factories/{id}/transition {to_state: ACTIVE}"
        actor: ProductionPlanner
        preconditions: []
        side_effects: []

  - entity: ProductLine
    field: lifecycle
    initial_state: CONCEPT
    terminal_states: [RETIRED]
    transitions:
      - from: CONCEPT
        to: ACTIVE
        trigger: "POST /api/product-lines/{id}/advance"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CLEARANCE
        trigger: "POST /api/product-lines/{id}/advance"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "clearance_price_cents already reflects round_half_up(price_point_cents * 0.75); orders created or submitted from now on price off the clearance base"
      - from: CLEARANCE
        to: RETIRED
        trigger: "POST /api/product-lines/{id}/advance"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "HOP 1: every SupplyOrder with product_line_id == this line and allocation_state in {RESERVED, WAITLISTED} transitions to DROPPED (fulfillment_state unchanged, PENDING)"
          - "HOP 2: each DROPPED order's AllocationCycle recomputes licensee_reserved_units / wholesale_reserved_units / available_units, releasing the dropped quantity"
          - "HOP 2: each affected RetailAccount recomputes credit_used_cents (dropped orders leave the exposure set)"
          - "HOP 3: per affected cycle, the waitlist promotion sweep runs (calculations.capacity_waterfall promotion rule)"

  - entity: Licensee
    field: status
    initial_state: APPLICANT
    terminal_states: [TERMINATED]
    transitions:
      - from: APPLICANT
        to: ACTIVE
        trigger: "POST /api/licensees/{id}/transition {to_state: ACTIVE}"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: PROBATION
        trigger: "system (AllocationCycle close when seasoned_score < 60.00)"
        actor: system
        preconditions:
          - "The closing cycle produced a score for this licensee (licensee had >= 1 order in the cycle)"
        side_effects: []
        note: "Boundary: seasoned_score == 60.00 exactly does NOT trigger probation"
      - from: PROBATION
        to: ACTIVE
        trigger: "system (AllocationCycle close when seasoned_score >= 75.00)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Rehabilitation loop: PROBATION -> ACTIVE is how the cycle closes"
      - from: PROBATION
        to: SUSPENDED
        trigger: "system (AllocationCycle close when seasoned_score < 40.00)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Boundary: seasoned_score == 40.00 exactly does NOT trigger suspension"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/licensees/{id}/transition {to_state: SUSPENDED}"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /api/licensees/{id}/transition {to_state: SUSPENDED}"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/licensees/{id}/transition {to_state: ACTIVE}"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: APPLICANT
        to: TERMINATED
        trigger: "POST /api/licensees/{id}/transition {to_state: TERMINATED}"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/licensees/{id}/transition {to_state: TERMINATED}"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "HOP 1a: every Territory with assigned_licensee_id == this licensee executes the ASSIGNED -> OPEN revocation transition (status OPEN, assigned_licensee_id null, assigned_at null, revoked_at stamped)"
          - "HOP 1b: the drop set is computed from each order's fulfillment_state AS OF the terminate call, before HOP 2a appointment cancellations run: every SupplyOrder of this licensee with allocation_state in {RESERVED, ALLOCATED, WAITLISTED} and fulfillment_state in {PENDING, PICKED} transitions to DROPPED (fulfillment_state -> CANCELLED in the same mutation); orders SHIPPED at terminate time are in transit and are NOT dropped — if a HOP 2a appointment cancellation later reverts such an order to PICKED, it stays ALLOCATED/PICKED awaiting redelivery"
          - "HOP 2a (from HOP 1a territory revocation): every DeliveryAppointment of this licensee with region_code == the revoked territory's region_code and status in {REQUESTED, CONFIRMED} transitions to CANCELLED"
          - "HOP 2b (from HOP 1b order drop): each DROPPED order's AllocationCycle recomputes licensee_reserved_units / available_units, releasing the quantity"
          - "HOP 3a (from HOP 2a appointment cancellation): a CONFIRMED appointment's cancellation reverts its order SHIPPED -> PICKED (see DeliveryAppointment CANCELLED transition)"
          - "HOP 3b (from HOP 2b capacity release): per affected cycle, the waitlist promotion sweep runs (calculations.capacity_waterfall promotion rule)"
      - from: PROBATION
        to: TERMINATED
        trigger: "POST /api/licensees/{id}/transition {to_state: TERMINATED}"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Same cascade as ACTIVE -> TERMINATED (HOP 1a/1b, 2a/2b, 3a/3b)"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /api/licensees/{id}/transition {to_state: TERMINATED}"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Same cascade as ACTIVE -> TERMINATED (HOP 1a/1b, 2a/2b, 3a/3b)"

  - entity: Territory
    field: status
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: ASSIGNED
        trigger: "POST /api/territories/{id}/transition {to_state: ASSIGNED, licensee_id}"
        actor: PlatformAdmin
        preconditions:
          - "target licensee status == ACTIVE (else ERR_LICENSEE_NOT_ACTIVE)"
          - "licensee holds fewer than MAX_TERRITORIES_PER_LICENSEE (3) ASSIGNED territories (else ERR_MAX_TERRITORIES_EXCEEDED)"
        side_effects:
          - "assigned_licensee_id set; assigned_at stamped"
      - from: ASSIGNED
        to: OPEN
        trigger: "POST /api/territories/{id}/transition {to_state: OPEN} (manual revocation) OR system (licensee termination cascade)"
        actor: PlatformAdmin | system
        preconditions: []
        side_effects:
          - "assigned_licensee_id -> null; assigned_at -> null; revoked_at stamped"
          - "HOP: every DeliveryAppointment of the former assignee with region_code == this territory's region_code and status in {REQUESTED, CONFIRMED} transitions to CANCELLED (a CONFIRMED cancellation reverts its order SHIPPED -> PICKED)"
        note: "OPEN -> ASSIGNED -> OPEN is a deliberate cycle: territories are re-assignable after revocation"

  - entity: RetailAccount
    field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: HOLD
        trigger: "POST /api/retail-accounts/{id}/transition {to_state: HOLD}"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: HOLD
        to: ACTIVE
        trigger: "POST /api/retail-accounts/{id}/transition {to_state: ACTIVE}"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /api/retail-accounts/{id}/transition {to_state: CLOSED}"
        actor: PlatformAdmin
        preconditions:
          - "credit_used_cents == 0 (else ERR_ACCOUNT_HAS_OPEN_EXPOSURE)"
        side_effects: []
      - from: HOLD
        to: CLOSED
        trigger: "POST /api/retail-accounts/{id}/transition {to_state: CLOSED}"
        actor: PlatformAdmin
        preconditions:
          - "credit_used_cents == 0 (else ERR_ACCOUNT_HAS_OPEN_EXPOSURE)"
        side_effects: []

  - entity: AllocationCycle
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: ALLOCATED
        trigger: "POST /api/allocation-cycles/{id}/run-allocation"
        actor: ProductionPlanner
        preconditions: []
        side_effects:
          - "run_at stamped"
          - "calculations.capacity_waterfall executes over this cycle's orders in allocation_state RESERVED or WAITLISTED: orders within their group's cap -> ALLOCATED; orders over the cap -> WAITLISTED (demotion is possible)"
          - "every order that lands in ALLOCATED locks final_total_cents = quantity re-priced with the product line's CURRENT lifecycle via calculations.order_pricing; if the line is now RETIRED the order is DROPPED instead of allocated"
          - "each affected RetailAccount recomputes credit_used_cents (ALLOCATED orders count at final_total_cents)"
      - from: ALLOCATED
        to: CLOSED
        trigger: "POST /api/allocation-cycles/{id}/close"
        actor: ProductionPlanner
        preconditions: []
        side_effects:
          - "closed_at stamped"
          - "every order still WAITLISTED in this cycle transitions to DROPPED"
          - "for each Licensee with >= 1 order in this cycle (any allocation_state except UNALLOCATED): calculations.performance_score computes the cycle's instantaneous score and the new seasoned_score; licensee status transitions fire per the Licensee machine (ACTIVE -> PROBATION if seasoned < 60.00; PROBATION -> ACTIVE if >= 75.00; PROBATION -> SUSPENDED if < 40.00)"

  - entity: SupplyOrder
    field: allocation_state
    initial_state: UNALLOCATED
    terminal_states: [DROPPED]
    note: "Parallel dimensions: allocation_state and fulfillment_state evolve independently except where a transition's preconditions name the other axis."
    transitions:
      - from: UNALLOCATED
        to: RESERVED
        trigger: "POST /api/orders/{id}/transition {action: SUBMIT} when cycle available_units >= quantity"
        actor: LicenseeManager | WholesaleBuyer
        preconditions:
          - "cycle status == OPEN (else ERR_CYCLE_NOT_OPEN)"
          - "product line lifecycle in {ACTIVE, CLEARANCE} (else ERR_LINE_NOT_ORDERABLE)"
          - "buyer orderable: licensee status in {ACTIVE, PROBATION} (else ERR_LICENSEE_NOT_ORDERABLE); retail account status == ACTIVE (else ERR_ACCOUNT_ON_HOLD)"
          - "retail accounts: credit_used_cents + provisional_total_cents <= credit_limit_cents (else ERR_CREDIT_LIMIT_EXCEEDED); equality PASSES"
          - "cycle available_units >= quantity (else lands in WAITLISTED instead)"
        side_effects:
          - "submitted_at stamped; provisional_total_cents recomputed if the line's lifecycle changed since create"
          - "cycle recomputes licensee_reserved_units / wholesale_reserved_units / available_units"
          - "retail buyer: credit_used_cents recomputed (RESERVED counts at provisional_total_cents)"
      - from: UNALLOCATED
        to: WAITLISTED
        trigger: "POST /api/orders/{id}/transition {action: SUBMIT} when cycle available_units < quantity"
        actor: LicenseeManager | WholesaleBuyer
        preconditions:
          - "same guards as UNALLOCATED -> RESERVED except the capacity clause"
        side_effects:
          - "submitted_at stamped; waitlisted orders do NOT consume capacity and do NOT count toward credit_used_cents"
      - from: RESERVED
        to: ALLOCATED
        trigger: "system (run-allocation: order fits its buyer group's cap)"
        actor: system
        preconditions: []
        side_effects:
          - "final_total_cents locked = quantity re-priced with the line's current lifecycle"
          - "retail buyer: credit_used_cents recomputed (ALLOCATED counts at final_total_cents)"
      - from: RESERVED
        to: WAITLISTED
        trigger: "system (run-allocation demotion: order exceeds its buyer group's cap)"
        actor: system
        preconditions: []
        side_effects:
          - "capacity released; cycle recomputes reserved/available; retail buyer credit_used_cents recomputed"
      - from: WAITLISTED
        to: RESERVED
        trigger: "system (promotion sweep while cycle is OPEN: capacity released by a cancel/drop and this order is the highest-ranked waitlisted order that fits)"
        actor: system
        preconditions:
          - "cycle status == OPEN and available_units >= quantity"
        side_effects:
          - "cycle recomputes reserved/available; retail buyer credit_used_cents recomputed (RESERVED counts at provisional)"
      - from: WAITLISTED
        to: ALLOCATED
        trigger: "system (promotion sweep while cycle is ALLOCATED)"
        actor: system
        preconditions:
          - "cycle status == ALLOCATED and available_units >= quantity"
        side_effects:
          - "final_total_cents locked at promotion (re-priced with current lifecycle)"
          - "cycle recomputes reserved/available; retail buyer credit_used_cents recomputed"
      - from: RESERVED
        to: DROPPED
        trigger: "system (product line RETIRED cascade | licensee TERMINATED cascade) OR POST /api/orders/{id}/transition {action: CANCEL}"
        actor: system | LicenseeManager | WholesaleBuyer | PlatformAdmin
        preconditions:
          - "CANCEL: fulfillment_state in {PENDING, PICKED} (SHIPPED is in transit and cannot be cancelled)"
        side_effects:
          - "fulfillment_state -> CANCELLED in the same mutation"
          - "capacity released: cycle recomputes reserved/available; promotion sweep runs"
          - "retail buyer: credit_used_cents recomputed"
      - from: WAITLISTED
        to: DROPPED
        trigger: "system (line retired | licensee terminated | cycle close) OR CANCEL"
        actor: system | LicenseeManager | WholesaleBuyer | PlatformAdmin
        preconditions: []
        side_effects:
          - "fulfillment_state -> CANCELLED in the same mutation; no capacity was held, no credit was counted"
      - from: ALLOCATED
        to: DROPPED
        trigger: "POST /api/orders/{id}/transition {action: CANCEL} OR system (licensee TERMINATED cascade when fulfillment in {PENDING, PICKED})"
        actor: LicenseeManager | WholesaleBuyer | PlatformAdmin | system
        preconditions:
          - "CANCEL: fulfillment_state in {PENDING, PICKED}"
        side_effects:
          - "fulfillment_state -> CANCELLED in the same mutation"
          - "capacity released: cycle recomputes reserved/available; promotion sweep runs"
          - "retail buyer: credit_used_cents recomputed"

  - entity: SupplyOrder
    field: fulfillment_state
    initial_state: PENDING
    terminal_states: [DELIVERED, CANCELLED]
    note: "Second axis of the parallel machine. HOME_DELIVERY orders may only reach SHIPPED/DELIVERED through DeliveryAppointment side effects."
    transitions:
      - from: PENDING
        to: PICKED
        trigger: "POST /api/orders/{id}/transition {action: PICK}"
        actor: LogisticsCoordinator
        preconditions:
          - "allocation_state == ALLOCATED (capacity must be confirmed before picking)"
        side_effects: []
      - from: PICKED
        to: SHIPPED
        trigger: "POST /api/orders/{id}/transition {action: SHIP} (FREIGHT_TO_STORE only) OR system side effect of DeliveryAppointment CONFIRMED (HOME_DELIVERY)"
        actor: LogisticsCoordinator | system
        preconditions:
          - "direct SHIP on a HOME_DELIVERY order is rejected with ERR_USE_APPOINTMENT_FLOW"
        side_effects: []
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /api/orders/{id}/transition {action: DELIVER} (FREIGHT_TO_STORE only) OR system side effect of DeliveryAppointment COMPLETED (HOME_DELIVERY)"
        actor: LogisticsCoordinator | system
        preconditions:
          - "direct DELIVER on a HOME_DELIVERY order is rejected with ERR_USE_APPOINTMENT_FLOW"
        side_effects:
          - "delivered_at stamped; starts warranty windows"
          - "licensee buyer: royalty accrues per calculations.royalty_accrual (round_half_up(final_total_cents * licensee.royalty_rate)); licensee royalty_accrued_cents and net_royalty_cents recomputed"
          - "retail buyer: order leaves the exposure set; credit_used_cents recomputed"
      - from: SHIPPED
        to: PICKED
        trigger: "system (DeliveryAppointment MISSED or CANCELLED-from-CONFIRMED compensation)"
        actor: system
        preconditions: []
        side_effects:
          - "order becomes eligible for a new delivery appointment"
      - from: PENDING
        to: CANCELLED
        trigger: "paired with the allocation -> DROPPED transition (single mutation)"
        actor: LicenseeManager | WholesaleBuyer | PlatformAdmin | system
        preconditions: []
        side_effects: []
      - from: PICKED
        to: CANCELLED
        trigger: "paired with the allocation -> DROPPED transition (single mutation)"
        actor: LicenseeManager | WholesaleBuyer | PlatformAdmin | system
        preconditions: []
        side_effects: []

  - entity: DeliveryAppointment
    field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, MISSED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /api/delivery-appointments/{id}/transition {to_state: CONFIRMED}"
        actor: LogisticsCoordinator
        preconditions:
          - "crew capacity re-checked per calculations.delivery_capacity_check (only CONFIRMED appointments hold capacity)"
          - "window_start still > now"
        side_effects:
          - "order fulfillment PICKED -> SHIPPED (out for delivery)"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /api/delivery-appointments/{id}/transition {to_state: COMPLETED, actual_duration_minutes}"
        actor: LogisticsCoordinator
        preconditions:
          - "actual_duration_minutes present (else ERR_VALIDATION)"
        side_effects:
          - "completed_at stamped"
          - "final_fee_cents computed per calculations.delivery_fee final variant"
          - "order fulfillment SHIPPED -> DELIVERED (delivered_at, royalty accrual, credit recompute per the SupplyOrder DELIVERED transition)"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /api/delivery-appointments/{id}/transition {to_state: CANCELLED} OR system (territory revocation cascade)"
        actor: LicenseeManager | LogisticsCoordinator | system
        preconditions: []
        side_effects: []
        note: "REQUESTED appointments never held crew capacity and never shipped the order; no compensation"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/delivery-appointments/{id}/transition {to_state: CANCELLED} OR system (territory revocation cascade)"
        actor: LicenseeManager | LogisticsCoordinator | system
        preconditions: []
        side_effects:
          - "order fulfillment SHIPPED -> PICKED (compensation)"
      - from: CONFIRMED
        to: MISSED
        trigger: "system (POST /_clock/set_current_utc sweep: current clock > window_end + MISSED_GRACE_MINUTES(120))"
        actor: system
        preconditions: []
        side_effects:
          - "order fulfillment SHIPPED -> PICKED (compensation)"
        note: "The clock-set endpoint performs the sweep atomically: every CONFIRMED appointment whose window_end + 120 minutes is strictly before the new clock value flips to MISSED"

  - entity: WarrantyClaim
    field: status
    initial_state: UNDER_REVIEW
    terminal_states: [RESOLVED, DENIED]
    transitions:
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /api/warranty-claims/{id}/transition {to_state: INFO_REQUESTED, decision_note?}"
        actor: WarrantyAdmin
        preconditions:
          - "info_request_count < INFO_REQUEST_MAX (2) (else ERR_INFO_REQUEST_LIMIT_REACHED)"
        side_effects:
          - "info_request_count += 1"
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /api/warranty-claims/{id}/transition {to_state: UNDER_REVIEW, info_note}"
        actor: LicenseeManager
        preconditions:
          - "acting licensee must own the claim (X-User-ID == claim.licensee_id)"
        side_effects: []
        note: "Cyclic review loop, bounded at 2 requests"
      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "POST /api/warranty-claims/{id}/transition {to_state: RESOLVED, decision_note?} (approval WITHOUT parts)"
        actor: WarrantyAdmin
        preconditions: []
        side_effects:
          - "decision = APPROVED; resolved_at stamped"
          - "if claim_type == DAMAGE_IN_TRANSIT: chargeback_cents = round_half_up(order.final_total_cents * 0.15) and licensee.chargeback_cents / net_royalty_cents recomputed"
      - from: UNDER_REVIEW
        to: PARTS_ORDERED
        trigger: "POST /api/warranty-claims/{id}/transition {to_state: PARTS_ORDERED, approved_parts: [{sku, quantity}, ...]}"
        actor: WarrantyAdmin
        preconditions:
          - "approved_parts present and non-empty (else ERR_VALIDATION)"
        side_effects:
          - "decision = APPROVED"
          - "one PartsOrder created per approved_parts entry, status QUEUED"
          - "if claim_type == DAMAGE_IN_TRANSIT: chargeback as in the RESOLVED approval"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /api/warranty-claims/{id}/transition {to_state: DENIED, decision_note}"
        actor: WarrantyAdmin
        preconditions: []
        side_effects:
          - "decision = DENIED"
      - from: PARTS_ORDERED
        to: RESOLVED
        trigger: "system (bubble-up: the claim's last non-DELIVERED PartsOrder reaches DELIVERED)"
        actor: system
        preconditions:
          - "every PartsOrder with claim_id == this claim has status DELIVERED"
        side_effects:
          - "resolved_at stamped"

  - entity: PartsOrder
    field: status
    initial_state: QUEUED
    terminal_states: [DELIVERED]
    transitions:
      - from: QUEUED
        to: SHIPPED
        trigger: "POST /api/parts-orders/{id}/transition {to_state: SHIPPED}"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects: []
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /api/parts-orders/{id}/transition {to_state: DELIVERED}"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects:
          - "bubble-up: if this was the claim's last non-DELIVERED PartsOrder, the claim transitions PARTS_ORDERED -> RESOLVED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: product-line-price-update
    parent_entity: ProductLine
    write_endpoint: "PUT /api/product-lines/{id}/price"
    occ_field: expected_product_line_version
    description: |
      Updating a product line's price point against a version the client no
      longer observes is rejected. A price update legitimately supersedes any
      earlier price, so the only observable failure is a stale
      expected_product_line_version relative to ProductLine.version.
    error_id: ERR_STALE_PRODUCT_LINE_VERSION
    http_status: 412
  - rule_id: licensee-terms-update
    parent_entity: Licensee
    write_endpoint: "PUT /api/licensees/{id}/terms"
    occ_field: expected_licensee_version
    description: |
      Updating a licensee's commercial terms (royalty rate, merchandising
      standard, audit score) against a version the client no longer observes
      is rejected. Each terms update legitimately supersedes the previous one,
      so the only observable failure is a stale expected_licensee_version
      relative to Licensee.version.
    error_id: ERR_STALE_LICENSEE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_pricing
    description: "Unit price and order total for a SupplyOrder, branching on buyer_type, wholesale quantity tiers, and product-line lifecycle"
    trigger: "SupplyOrder create (provisional), SUBMIT when lifecycle changed since create (provisional re-price), run-allocation / post-run promotion (final lock)"
    algorithm: tiered_pricing
    formula: |
      base = price_point_cents if line.lifecycle == ACTIVE
             else round_half_up(price_point_cents * CLEARANCE_MARKDOWN_KEEP) if line.lifecycle == CLEARANCE
             else null (CONCEPT / RETIRED lines are not orderable)
      if buyer_type == LICENSEE:
          unit = round_half_up(base * (1 - LICENSEE_DISCOUNT_RATE))
      else:  # RETAIL_ACCOUNT
          r = 0.14 if quantity >= TIER3_QTY
              else 0.09 if quantity >= TIER2_QTY
              else 0.05 if quantity >= TIER1_QTY
              else 0.0
          unit = round_half_up(base * (1 - r))
      total = unit * quantity        # rounding pinned: round the UNIT first, then multiply
    input_set: "The order's product line (lifecycle, price_point_cents) and the order's buyer_type and quantity"
    constants:
      PRICE_LADDER_CENTS: [39900, 59900, 89900, 129900, 189900]
      LICENSEE_DISCOUNT_RATE: 0.30
      CLEARANCE_MARKDOWN_KEEP: 0.75
      TIER1_QTY: 10
      TIER2_QTY: 25
      TIER3_QTY: 50
    precision: "integer cents; round_half_up at each rounding point"
    variants:
      - name: provisional
        when: "at create and at submit"
        difference: "priced off the line's lifecycle at that moment; wholesale tier from the order's quantity"
      - name: final
        when: "at run-allocation / post-run promotion"
        difference: "re-priced off the line's lifecycle AT RUN TIME; can diverge from provisional when the line advanced to CLEARANCE in between"

  - name: royalty_accrual
    description: "Licensee royalty ledger: per-order rounded royalty accrual at DELIVERED, damage-in-transit chargebacks at claim approval"
    trigger: "SupplyOrder SHIPPED -> DELIVERED (accrual); WarrantyClaim approval with claim_type DAMAGE_IN_TRANSIT (chargeback)"
    algorithm: aggregation
    formula: |
      # Rounding order is PINNED: round each order's royalty to cents FIRST, then sum.
      # per-order: royalty_cents = round_half_up(final_total_cents * licensee.royalty_rate)
      # licensee.royalty_accrued_cents = SUM(royalty_cents) over DELIVERED orders of the licensee
      # per approved DAMAGE_IN_TRANSIT claim: chargeback_cents = round_half_up(order.final_total_cents * CHARGEBACK_RATE)
      # licensee.chargeback_cents = SUM(chargeback_cents) over approved DIT claims
      # licensee.net_royalty_cents = royalty_accrued_cents - chargeback_cents
      # royalty_rate is read at DELIVERY time (the licensee's terms at that moment).
      pass
    input_set: "Licensee's orders in fulfillment_state DELIVERED (any allocation history); licensee's claims with decision APPROVED and claim_type DAMAGE_IN_TRANSIT"
    constants:
      CHARGEBACK_RATE: 0.15
    precision: "integer cents; round_half_up per order / per claim BEFORE summing (round-per-line-then-sum, never sum-then-round)"

  - name: capacity_waterfall
    description: "Run-allocation waterfall splitting a cycle's capacity between licensee demand and wholesale demand, plus the waitlist promotion sweep"
    trigger: "POST /api/allocation-cycles/{id}/run-allocation (waterfall); any capacity-releasing event (order CANCEL/DROP) on an OPEN or ALLOCATED cycle (promotion sweep)"
    algorithm: waterfall_allocation
    formula: |
      K = cycle.capacity_units
      wholesale_floor = floor(K * WHOLESALE_FLOOR_PCT)
      licensee_cap = K - wholesale_floor
      candidates = orders of this cycle with allocation_state in {RESERVED, WAITLISTED}
      rank within each buyer group: standing_tier ASC, then created_at ASC
        (standing_tier per calculations.waitlist_ranking)
      LICENSEE PASS: remaining = licensee_cap
        for each licensee-buyer order in rank order:
            if quantity <= remaining: -> ALLOCATED (cycle ALLOCATED) / -> RESERVED (cycle still OPEN, run only);
                remaining -= quantity
            else: -> WAITLISTED (continue; smaller later orders MAY still fit: best-fit backfill)
      WHOLESALE PASS: wholesale_cap = K - sum(quantity of licensee orders selected above)
        same walk over wholesale-buyer orders with remaining = wholesale_cap
      PROMOTION SWEEP (on capacity release): recompute available_units; scan the cycle's
        WAITLISTED orders in rank order; promote each order whose quantity <= remaining
        available (cycle OPEN -> RESERVED; cycle ALLOCATED -> ALLOCATED, locking final_total);
        decrement on each promotion; stop when the scan completes once.
    input_set: "Orders of the cycle with allocation_state in {RESERVED, WAITLISTED} (waterfall); WAITLISTED only (promotion sweep)"
    constants:
      WHOLESALE_FLOOR_PCT: 0.25
      LICENSEE_GUARANTEE_PCT: 0.60
    precision: "integer units; floor() on the wholesale floor"
    variants: []

  - name: waitlist_ranking
    description: "Deterministic standing tier + chronological ordering used by the waterfall and the promotion sweep"
    trigger: "inside capacity_waterfall whenever a buyer group or the waitlist is ordered"
    algorithm: weighted_scoring
    formula: |
      standing_tier = 1 (PREFERRED) if licensee buyer has seasoned_score != null and seasoned_score >= 75.00
                      else 2 (STANDARD) for any licensee without a qualifying score
                      else 1 (PREFERRED) for a retail account with credit_used_cents * 4 <= credit_limit_cents
                      else 2 (STANDARD) for a retail account above 25% utilization
      rank key: (standing_tier ASC, created_at ASC)
      # ids are NEVER used for ranking; chronological order is the final tie-break.
    input_set: "The candidate order set supplied by capacity_waterfall"
    constants: {}
    precision: "n/a"

  - name: credit_exposure
    description: "Retail account open credit exposure and the submit-time limit check"
    trigger: "recomputed on every order event touching a retail account (submit, run, promote, cancel, deliver, cascade drop); checked at SUBMIT"
    algorithm: aggregation
    formula: |
      credit_used_cents = SUM over the account's orders with
          allocation_state in {RESERVED, ALLOCATED} AND fulfillment_state in {PENDING, PICKED, SHIPPED}
          of (final_total_cents if allocation_state == ALLOCATED else provisional_total_cents)
      SUBMIT check: rejected iff credit_used_cents + this order's provisional_total_cents > credit_limit_cents
      (equality passes: used + new == limit is ACCEPTED)
    input_set: "The account's orders in the named states only; WAITLISTED, DROPPED, UNALLOCATED, DELIVERED, CANCELLED are excluded"
    constants: {}
    precision: "integer cents"

  - name: delivery_fee
    description: "Home-delivery fee: provisional estimate at booking vs final settlement at completion"
    trigger: "DeliveryAppointment create (estimate); DeliveryAppointment COMPLETED (final)"
    algorithm: threshold
    formula: |
      estimate_fee_cents = CALL_OUT_CENTS + ZONE_CENTS[zone] + crew_units * CREW_CENTS
      final_fee_cents   = estimate_fee_cents
                          + ceil(max(0, actual_duration_minutes - window_minutes) / OVERAGE_BLOCK_MINUTES) * OVERAGE_CENTS
                          + max(0, stairs_flights - STAIRS_FREE_FLIGHTS) * STAIRS_CENTS
      where window_minutes = (window_end - window_start) in minutes
    input_set: "The appointment's zone, crew_units, window, stairs_flights, and (final only) actual_duration_minutes"
    constants:
      CALL_OUT_CENTS: 14900
      ZONE_CENTS: { LOCAL: 0, REGIONAL: 5000, EXTENDED: 12000 }
      CREW_CENTS: 2500
      OVERAGE_BLOCK_MINUTES: 30
      OVERAGE_CENTS: 4000
      STAIRS_FREE_FLIGHTS: 1
      STAIRS_CENTS: 1500
    precision: "integer cents"
    variants:
      - name: estimate
        when: "at create; stored in estimate_fee_cents and never overwritten"
        difference: "no overage or stairs component beyond the flat estimate formula"
      - name: final
        when: "at COMPLETED; stored in final_fee_cents"
        difference: "adds duration-overage blocks and extra-stairs charges; differs from estimate whenever the crew runs long or climbs more than one flight"

  - name: performance_score
    description: "Licensee performance standards: instantaneous cycle score vs seasoned trailing score"
    trigger: "POST /api/allocation-cycles/{id}/close, per licensee with >= 1 non-UNALLOCATED order in the cycle"
    algorithm: decay_function
    formula: |
      per cycle, per licensee with >= 1 order in the cycle (allocation_state != UNALLOCATED):
        allocated_units = SUM(quantity) of the licensee's orders in the cycle that reached
                          allocation_state ALLOCATED at any point (RESERVED-only or DROPPED orders do not count)
        delivered_units = SUM(quantity) of those orders with fulfillment_state == DELIVERED
        sell_through = 100 * delivered_units / max(1, allocated_units)
        delivered_order_count = count of those orders with fulfillment_state == DELIVERED
        claims_in_cycle = count of the licensee's WarrantyClaims with created_at in
                          [cycle.week_start, cycle.closed_at]
        claims_pct = 100 * claims_in_cycle / max(1, delivered_order_count)
        claims_component = max(0, 100 - 10 * claims_pct)
        instantaneous = round_half_up(0.5 * sell_through + 0.3 * licensee.latest_audit_score
                                      + 0.2 * claims_component, 2)
      seasoned = round_half_up(
          (0.4 * I_last + 0.3 * I_2nd + 0.2 * I_3rd + 0.1 * I_4th) / (sum of weights actually applied), 2)
          over the licensee's most recent <= 4 scored cycles, most recent first;
          when fewer than 4 cycles exist the weight sum renormalizes (e.g. one cycle: seasoned == instantaneous)
      licensee.last_cycle_score = instantaneous; licensee.seasoned_score = seasoned
    input_set: "Licensee's orders in the closing cycle with allocation_state != UNALLOCATED; licensee's claims created in [week_start, closed_at]; licensee.latest_audit_score"
    constants:
      PERF_PROBATION_THRESHOLD: 60.00
      PERF_SUSPENSION_THRESHOLD: 40.00
      PERF_RECOVERY_THRESHOLD: 75.00
      SEASONED_WEIGHTS: [0.4, 0.3, 0.2, 0.1]
    precision: "2 decimal places, round_half_up"
    variants:
      - name: instantaneous
        when: "the closing cycle in isolation; stored as last_cycle_score"
        difference: "uses only the closing cycle's sell-through, claims and the current audit score"
      - name: seasoned
        when: "stored as seasoned_score and drives PROBATION/SUSPENDED/recovery transitions"
        difference: "weights up to four trailing cycles with renormalization; identical data yields a different number than instantaneous whenever history exists"

  - name: delivery_capacity_check
    description: "Aggregate crew-capacity overlap check for home-delivery appointments on one DC"
    trigger: "DeliveryAppointment create and CONFIRM transition"
    algorithm: interval_merge
    formula: |
      Two half-open windows [s1, e1) and [s2, e2) OVERLAP iff s1 < e2 AND s2 < e1
      (an appointment ending exactly when another starts does NOT overlap).
      Rejected iff there exists any instant t in the candidate window where
          SUM(crew_units of the DC's CONFIRMED appointments covering t) + candidate.crew_units
              > dc.daily_crew_units
      Evaluated segment-wise at the candidate's window_start and at each overlapping
      CONFIRMED appointment's window_start. REQUESTED appointments hold no capacity.
    input_set: "The DC's appointments with status CONFIRMED only"
    constants:
      MISSED_GRACE_MINUTES: 120
      DELIVERY_MIN_LEAD_HOURS: 48
      WINDOW_MIN_MINUTES: 120
      WINDOW_MAX_MINUTES: 360
    precision: "integer minutes"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins when a
# request violates several rules at once)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: business_constraint, check: "Request shape: required fields present, types valid, enum values in range, week_start midnight-aligned, approved_parts well-formed", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 3, category: auth, check: "Acting role is in the endpoint's roles list", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 4, category: auth, check: "Entity-backed ownership: LicenseeManager X-User-ID == the resource's licensee_id; WholesaleBuyer X-User-ID == the resource's retail_account_id (order create/submit/cancel, appointment create/cancel, claim create/info-response)", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "buyer-scoped endpoints" }
  - { priority: 5, category: existence, check: "Path ids and body FK ids exist, validated left-to-right (path first, then body fields in declared order)", error_id: "ERR_<ENTITY>_NOT_FOUND", http_status: 404, applies_to: "all" }
  - { priority: 6, category: state, check: "OCC: expected_product_line_version == ProductLine.version on PUT price; expected_licensee_version == Licensee.version on PUT terms", error_id: "ERR_STALE_PRODUCT_LINE_VERSION | ERR_STALE_LICENSEE_VERSION", http_status: 412, applies_to: "PUT /api/product-lines/{id}/price, PUT /api/licensees/{id}/terms" }
  - { priority: 7, category: state, check: "State-machine guards: transition valid from current state (else ERR_INVALID_TRANSITION); cycle OPEN at order create/submit (ERR_CYCLE_NOT_OPEN); line lifecycle in {ACTIVE, CLEARANCE} at order create/submit (ERR_LINE_NOT_ORDERABLE); account ACTIVE at submit (ERR_ACCOUNT_ON_HOLD); licensee in {ACTIVE, PROBATION} at submit (ERR_LICENSEE_NOT_ORDERABLE); factory not OFFLINE at cycle create (ERR_FACTORY_OFFLINE); order PICKED at appointment create (ERR_ORDER_NOT_PICKED); direct SHIP/DELIVER on HOME_DELIVERY orders (ERR_USE_APPOINTMENT_FLOW); info_request_count < 2 (ERR_INFO_REQUEST_LIMIT_REACHED); licensee ACTIVE at territory assign (ERR_LICENSEE_NOT_ACTIVE)", error_id: "ERR_INVALID_TRANSITION et al.", http_status: 409, applies_to: "mutating endpoints" }
  - { priority: 8, category: business_temporal, check: "Appointment temporal guards: window_start > now (ERR_WINDOW_IN_PAST); window_start >= now + 48h (ERR_LEAD_TIME_TOO_SHORT); warranty window: DEFECT/MISSING_PARTS filed within 365 days of delivered_at, DAMAGE_IN_TRANSIT within 30 days (ERR_WARRANTY_WINDOW_EXPIRED)", error_id: "ERR_WINDOW_IN_PAST | ERR_LEAD_TIME_TOO_SHORT | ERR_WARRANTY_WINDOW_EXPIRED", http_status: 422, applies_to: "appointment create, claim create" }
  - { priority: 9, category: business_constraint, check: "Domain constraints: buyer FK matches buyer_type (ERR_BUYER_MISMATCH); price point on ladder (ERR_PRICE_POINT_NOT_ON_LADDER); cycle week windows per factory do not overlap, adjacency allowed (ERR_CYCLE_WEEK_OVERLAP); territory OPEN before assign (ERR_REGION_ALREADY_ASSIGNED); licensee holds < 3 territories (ERR_MAX_TERRITORIES_EXCEEDED); appointment region covered by an ASSIGNED territory of the licensee (ERR_OUT_OF_TERRITORY); HOME_DELIVERY only for licensee buyers / appointments only on HOME_DELIVERY orders (ERR_DELIVERY_MODE_NOT_ALLOWED); DC supports home delivery (ERR_HOME_DELIVERY_UNSUPPORTED); window duration in [120, 360] minutes (ERR_WINDOW_DURATION_INVALID); account close requires zero exposure (ERR_ACCOUNT_HAS_OPEN_EXPOSURE); at most one non-terminal appointment per order (ERR_APPOINTMENT_ALREADY_ACTIVE); crew capacity per delivery_capacity_check (ERR_DELIVERY_CAPACITY_EXCEEDED)", error_id: "ERR_* per check", http_status: "409 | 422", applies_to: "mutating endpoints" }
  - { priority: 10, category: business_fiscal, check: "Credit gate at order SUBMIT: credit_used_cents + provisional_total_cents > credit_limit_cents is rejected; equality passes", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 422, applies_to: "POST /api/orders/{id}/transition {action: SUBMIT}" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
# Read endpoints (GET) are open to all six declared roles; mutation endpoints
# restrict roles as listed. The logical clock endpoint lives OUTSIDE api_prefix.
endpoints:
  - { method: POST, path: "/_clock/set_current_utc", description: "Advance the logical clock. Startup default is exactly 2026-09-01T00:00:00Z (never wall-clock). Setting the clock atomically sweeps CONFIRMED delivery appointments whose window_end + 120 minutes is strictly before the new value into MISSED (reverting their orders SHIPPED -> PICKED).", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["MISSED sweep per DeliveryAppointment machine"] }

  - { method: POST, path: "/api/factories", description: "Create a factory (status ACTIVE)", roles: [PlatformAdmin], code: 201, input: [code, region, component_lines, weekly_capacity_units], output: Factory, side_effects: [] }
  - { method: GET, path: "/api/factories/{id}", description: "Fetch a factory", roles: [PlatformAdmin, ProductionPlanner, LogisticsCoordinator, WarrantyAdmin, LicenseeManager, WholesaleBuyer], code: 200, input: [], output: Factory, side_effects: [] }
  - { method: POST, path: "/api/factories/{id}/transition", description: "Factory status transition (ACTIVE/CONSTRAINED/OFFLINE per machine)", roles: [ProductionPlanner], code: 200, input: [to_state], output: Factory, side_effects: ["increments Factory.version by 1"] }

  - { method: POST, path: "/api/product-lines", description: "Create a product line (lifecycle CONCEPT); price_point_cents must be on PRICE_LADDER_CENTS", roles: [PlatformAdmin], code: 201, input: [name, category, price_point_cents, style_code], output: ProductLine, side_effects: ["clearance_price_cents computed"] }
  - { method: GET, path: "/api/product-lines/{id}", description: "Fetch a product line", roles: [PlatformAdmin, ProductionPlanner, LogisticsCoordinator, WarrantyAdmin, LicenseeManager, WholesaleBuyer], code: 200, input: [], output: ProductLine, side_effects: [] }
  - { method: POST, path: "/api/product-lines/{id}/advance", description: "Advance lifecycle one step: CONCEPT -> ACTIVE -> CLEARANCE -> RETIRED", roles: [PlatformAdmin], code: 200, input: [], output: ProductLine, side_effects: ["increments ProductLine.version by 1", "RETIRED transition fires the order-drop cascade with capacity release and waitlist promotion"] }
  - { method: PUT, path: "/api/product-lines/{id}/price", description: "Change price point (OCC-guarded; lifecycle must be CONCEPT or ACTIVE)", roles: [PlatformAdmin], code: 200, input: [price_point_cents, expected_product_line_version], output: ProductLine, side_effects: ["increments ProductLine.version by 1", "clearance_price_cents recomputed"] }

  - { method: POST, path: "/api/licensees", description: "Register a licensee operator (status APPLICANT; defaults royalty_rate 0.04, latest_audit_score 80, merchandising_standard_version MS-2026.1)", roles: [PlatformAdmin], code: 201, input: [business_name, "royalty_rate?", "merchandising_standard_version?", "latest_audit_score?"], output: Licensee, side_effects: [] }
  - { method: GET, path: "/api/licensees/{id}", description: "Fetch a licensee including computed scores and royalty ledger", roles: [PlatformAdmin, ProductionPlanner, LogisticsCoordinator, WarrantyAdmin, LicenseeManager, WholesaleBuyer], code: 200, input: [], output: Licensee, side_effects: [] }
  - { method: PUT, path: "/api/licensees/{id}/terms", description: "Update commercial terms (OCC-guarded). royalty_rate applies to deliveries from the update onward; latest_audit_score feeds the next cycle close", roles: [PlatformAdmin], code: 200, input: [expected_licensee_version, "royalty_rate?", "merchandising_standard_version?", "latest_audit_score?"], output: Licensee, side_effects: ["increments Licensee.version by 1"] }
  - { method: POST, path: "/api/licensees/{id}/transition", description: "Admin status transitions: APPLICANT->ACTIVE, ACTIVE|PROBATION->SUSPENDED, SUSPENDED->ACTIVE, any non-terminal->TERMINATED (cascade per Licensee machine)", roles: [PlatformAdmin], code: 200, input: [to_state], output: Licensee, side_effects: ["increments Licensee.version by 1", "TERMINATED fires territory revocation, order drop, capacity release and waitlist promotion cascades"] }

  - { method: POST, path: "/api/territories", description: "Create a territory (status OPEN)", roles: [PlatformAdmin], code: 201, input: [region_code, population_tier], output: Territory, side_effects: [] }
  - { method: GET, path: "/api/territories/{id}", description: "Fetch a territory", roles: [PlatformAdmin, ProductionPlanner, LogisticsCoordinator, WarrantyAdmin, LicenseeManager, WholesaleBuyer], code: 200, input: [], output: Territory, side_effects: [] }
  - { method: GET, path: "/api/licensees/{id}/territories", description: "List territories assigned to a licensee (reverse FK lookup)", roles: [PlatformAdmin, ProductionPlanner, LogisticsCoordinator, WarrantyAdmin, LicenseeManager, WholesaleBuyer], code: 200, input: ["limit?", "offset?"], output: "Territory[]", side_effects: [] }
  - { method: POST, path: "/api/territories/{id}/transition", description: "Assign (to_state ASSIGNED + licensee_id) or revoke (to_state OPEN). Revocation cancels the assignee's non-terminal appointments in the region", roles: [PlatformAdmin], code: 200, input: [to_state, "licensee_id?"], output: Territory, side_effects: ["increments Territory.version by 1", "revocation cancels affected DeliveryAppointments and reverts their orders SHIPPED -> PICKED"] }

  - { method: POST, path: "/api/retail-accounts", description: "Create a wholesale retail account (status ACTIVE)", roles: [PlatformAdmin], code: 201, input: [business_name, credit_limit_cents], output: RetailAccount, side_effects: [] }
  - { method: GET, path: "/api/retail-accounts/{id}", description: "Fetch a retail account including credit_used_cents", roles: [PlatformAdmin, ProductionPlanner, LogisticsCoordinator, WarrantyAdmin, LicenseeManager, WholesaleBuyer], code: 200, input: [], output: RetailAccount, side_effects: [] }
  - { method: POST, path: "/api/retail-accounts/{id}/transition", description: "Account transitions ACTIVE<->HOLD, -> CLOSED (requires credit_used_cents == 0)", roles: [PlatformAdmin], code: 200, input: [to_state], output: RetailAccount, side_effects: ["increments RetailAccount.version by 1"] }

  - { method: POST, path: "/api/distribution-centers", description: "Create a distribution center (default daily_crew_units 6)", roles: [PlatformAdmin], code: 201, input: [code, supports_home_delivery, "daily_crew_units?", region_codes], output: DistributionCenter, side_effects: [] }
  - { method: GET, path: "/api/distribution-centers/{id}", description: "Fetch a distribution center", roles: [PlatformAdmin, ProductionPlanner, LogisticsCoordinator, WarrantyAdmin, LicenseeManager, WholesaleBuyer], code: 200, input: [], output: DistributionCenter, side_effects: [] }

  - { method: POST, path: "/api/allocation-cycles", description: "Create a production week cycle for a factory. capacity_units pinned from factory status (CONSTRAINED halves). Week windows per factory must not overlap; adjacency allowed", roles: [ProductionPlanner], code: 201, input: [factory_id, week_start], output: AllocationCycle, side_effects: [] }
  - { method: GET, path: "/api/allocation-cycles/{id}", description: "Fetch a cycle with reserved/available counters", roles: [PlatformAdmin, ProductionPlanner, LogisticsCoordinator, WarrantyAdmin, LicenseeManager, WholesaleBuyer], code: 200, input: [], output: AllocationCycle, side_effects: [] }
  - { method: GET, path: "/api/allocation-cycles", description: "List cycles, filterable by factory", roles: [PlatformAdmin, ProductionPlanner, LogisticsCoordinator, WarrantyAdmin, LicenseeManager, WholesaleBuyer], code: 200, input: ["factory_id?", "status?", "limit?", "offset?"], output: "AllocationCycle[]", side_effects: [] }
  - { method: POST, path: "/api/allocation-cycles/{id}/run-allocation", description: "OPEN -> ALLOCATED: executes capacity_waterfall, demotions, ALLOCATED conversion with final price lock", roles: [ProductionPlanner], code: 200, input: [], output: AllocationCycle, side_effects: ["increments AllocationCycle.version by 1", "order allocation_state transitions + final_total_cents lock + credit recompute per run"] }
  - { method: POST, path: "/api/allocation-cycles/{id}/close", description: "ALLOCATED -> CLOSED: drops remaining WAITLISTED orders, computes licensee performance scores and applies status transitions", roles: [ProductionPlanner], code: 200, input: [], output: AllocationCycle, side_effects: ["increments AllocationCycle.version by 1", "WAITLISTED -> DROPPED sweep", "performance_score per licensee with orders", "Licensee probation/suspension/recovery transitions"] }

  - { method: POST, path: "/api/orders", description: "Create a draft supply order (UNALLOCATED/PENDING) priced provisionally off the line's current lifecycle", roles: [LicenseeManager, WholesaleBuyer], code: 201, input: [buyer_type, "licensee_id?", "retail_account_id?", allocation_cycle_id, product_line_id, quantity, delivery_mode], output: SupplyOrder, side_effects: ["unit_price_cents and provisional_total_cents computed"] }
  - { method: GET, path: "/api/orders/{id}", description: "Fetch an order", roles: [PlatformAdmin, ProductionPlanner, LogisticsCoordinator, WarrantyAdmin, LicenseeManager, WholesaleBuyer], code: 200, input: [], output: SupplyOrder, side_effects: [] }
  - { method: GET, path: "/api/orders", description: "List orders with filters", roles: [PlatformAdmin, ProductionPlanner, LogisticsCoordinator, WarrantyAdmin, LicenseeManager, WholesaleBuyer], code: 200, input: ["licensee_id?", "retail_account_id?", "product_line_id?", "allocation_cycle_id?", "allocation_state?", "fulfillment_state?", "limit?", "offset?"], output: "SupplyOrder[]", side_effects: [] }
  - { method: POST, path: "/api/orders/{id}/transition", description: "Order actions: SUBMIT (buyer owner; capacity/credit gates; -> RESERVED or WAITLISTED), CANCEL (buyer owner or PlatformAdmin; -> DROPPED/CANCELLED with capacity release + promotion sweep), PICK/SHIP/DELIVER (LogisticsCoordinator; freight flow per fulfillment machine)", roles: [LicenseeManager, WholesaleBuyer, PlatformAdmin, LogisticsCoordinator], code: 200, input: [action, "reason?"], output: SupplyOrder, side_effects: ["increments SupplyOrder.version by 1", "per-transition cascades per SupplyOrder machines"] }

  - { method: POST, path: "/api/delivery-appointments", description: "Book a home-delivery appointment for a PICKED HOME_DELIVERY licensee order; licensee_id derived from order; all window/lead/territory/capacity guards run here", roles: [LicenseeManager], code: 201, input: [supply_order_id, dc_id, zone, region_code, window_start, window_end, crew_units, "stairs_flights?"], output: DeliveryAppointment, side_effects: ["estimate_fee_cents computed"] }
  - { method: GET, path: "/api/delivery-appointments/{id}", description: "Fetch an appointment", roles: [PlatformAdmin, ProductionPlanner, LogisticsCoordinator, WarrantyAdmin, LicenseeManager, WholesaleBuyer], code: 200, input: [], output: DeliveryAppointment, side_effects: [] }
  - { method: GET, path: "/api/delivery-appointments", description: "List appointments with filters", roles: [PlatformAdmin, ProductionPlanner, LogisticsCoordinator, WarrantyAdmin, LicenseeManager, WholesaleBuyer], code: 200, input: ["supply_order_id?", "licensee_id?", "dc_id?", "status?", "limit?", "offset?"], output: "DeliveryAppointment[]", side_effects: [] }
  - { method: POST, path: "/api/delivery-appointments/{id}/transition", description: "CONFIRM (LogisticsCoordinator; re-checks capacity; order -> SHIPPED), COMPLETE (LogisticsCoordinator; requires actual_duration_minutes; final fee; order -> DELIVERED), CANCELLED (LicenseeManager owner or LogisticsCoordinator; from CONFIRMED reverts order -> PICKED)", roles: [LicenseeManager, LogisticsCoordinator], code: 200, input: [to_state, "actual_duration_minutes?"], output: DeliveryAppointment, side_effects: ["increments DeliveryAppointment.version by 1", "per-transition order side effects"] }

  - { method: POST, path: "/api/warranty-claims", description: "File a warranty claim against a DELIVERED licensee order (windows: 365d DEFECT/MISSING_PARTS, 30d DAMAGE_IN_TRANSIT)", roles: [LicenseeManager], code: 201, input: [supply_order_id, claim_type, description], output: WarrantyClaim, side_effects: [] }
  - { method: GET, path: "/api/warranty-claims/{id}", description: "Fetch a claim", roles: [PlatformAdmin, ProductionPlanner, LogisticsCoordinator, WarrantyAdmin, LicenseeManager, WholesaleBuyer], code: 200, input: [], output: WarrantyClaim, side_effects: [] }
  - { method: GET, path: "/api/warranty-claims", description: "List claims with filters", roles: [PlatformAdmin, ProductionPlanner, LogisticsCoordinator, WarrantyAdmin, LicenseeManager, WholesaleBuyer], code: 200, input: ["licensee_id?", "supply_order_id?", "status?", "claim_type?", "limit?", "offset?"], output: "WarrantyClaim[]", side_effects: [] }
  - { method: POST, path: "/api/warranty-claims/{id}/transition", description: "WarrantyAdmin: INFO_REQUESTED (max 2), RESOLVED (approve, no parts), PARTS_ORDERED (approve with approved_parts), DENIED. LicenseeManager owner: INFO_REQUESTED -> UNDER_REVIEW with info_note", roles: [WarrantyAdmin, LicenseeManager], code: 200, input: [to_state, "info_note?", "decision_note?", "approved_parts?"], output: WarrantyClaim, side_effects: ["increments WarrantyClaim.version by 1", "PARTS_ORDERED creates QUEUED PartsOrders", "DIT approval accrues chargeback on the licensee"] }

  - { method: GET, path: "/api/parts-orders/{id}", description: "Fetch a parts order", roles: [PlatformAdmin, ProductionPlanner, LogisticsCoordinator, WarrantyAdmin, LicenseeManager, WholesaleBuyer], code: 200, input: [], output: PartsOrder, side_effects: [] }
  - { method: GET, path: "/api/parts-orders", description: "List parts orders with filters", roles: [PlatformAdmin, ProductionPlanner, LogisticsCoordinator, WarrantyAdmin, LicenseeManager, WholesaleBuyer], code: 200, input: ["claim_id?", "status?", "limit?", "offset?"], output: "PartsOrder[]", side_effects: [] }
  - { method: POST, path: "/api/parts-orders/{id}/transition", description: "QUEUED -> SHIPPED -> DELIVERED; last DELIVERED part resolves the claim", roles: [LogisticsCoordinator], code: 200, input: [to_state], output: PartsOrder, side_effects: ["increments PartsOrder.version by 1", "claim PARTS_ORDERED -> RESOLVED bubble-up"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, type mismatch, enum out of range, week_start not midnight-aligned, malformed approved_parts, actual_duration_minutes missing on COMPLETE" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed role's X-User-ID does not match the resource's buyer/owner FK" }
  - { id: ERR_FACTORY_NOT_FOUND, http: 404, condition: "Unknown factory id" }
  - { id: ERR_PRODUCT_LINE_NOT_FOUND, http: 404, condition: "Unknown product line id" }
  - { id: ERR_LICENSEE_NOT_FOUND, http: 404, condition: "Unknown licensee id" }
  - { id: ERR_TERRITORY_NOT_FOUND, http: 404, condition: "Unknown territory id" }
  - { id: ERR_RETAIL_ACCOUNT_NOT_FOUND, http: 404, condition: "Unknown retail account id" }
  - { id: ERR_DC_NOT_FOUND, http: 404, condition: "Unknown distribution center id" }
  - { id: ERR_CYCLE_NOT_FOUND, http: 404, condition: "Unknown allocation cycle id" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Unknown order id" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "Unknown delivery appointment id" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Unknown warranty claim id" }
  - { id: ERR_PARTS_ORDER_NOT_FOUND, http: 404, condition: "Unknown parts order id" }
  - { id: ERR_STALE_PRODUCT_LINE_VERSION, http: 412, condition: "expected_product_line_version does not match ProductLine.version" }
  - { id: ERR_STALE_LICENSEE_VERSION, http: 412, condition: "expected_licensee_version does not match Licensee.version" }
  - { id: ERR_INVALID_TRANSITION, http: 409, condition: "State machine has no transition for the requested action from the current state" }
  - { id: ERR_CYCLE_NOT_OPEN, http: 409, condition: "Order create or SUBMIT against a cycle not in OPEN status" }
  - { id: ERR_LINE_NOT_ORDERABLE, http: 409, condition: "Product line lifecycle not in {ACTIVE, CLEARANCE} at order create/SUBMIT, or CONCEPT line ordered" }
  - { id: ERR_ACCOUNT_ON_HOLD, http: 409, condition: "Retail account status HOLD (or CLOSED) at order SUBMIT" }
  - { id: ERR_LICENSEE_NOT_ORDERABLE, http: 409, condition: "Licensee status not in {ACTIVE, PROBATION} at order SUBMIT" }
  - { id: ERR_ORDER_NOT_PICKED, http: 409, condition: "Appointment create requires the order in fulfillment_state PICKED" }
  - { id: ERR_USE_APPOINTMENT_FLOW, http: 409, condition: "Direct SHIP/DELIVER attempted on a HOME_DELIVERY order" }
  - { id: ERR_INFO_REQUEST_LIMIT_REACHED, http: 409, condition: "Third INFO_REQUESTED on a claim (max 2)" }
  - { id: ERR_FACTORY_OFFLINE, http: 409, condition: "Allocation cycle create against an OFFLINE factory" }
  - { id: ERR_APPOINTMENT_ALREADY_ACTIVE, http: 409, condition: "Order already has an appointment in REQUESTED or CONFIRMED" }
  - { id: ERR_WINDOW_IN_PAST, http: 422, condition: "Appointment window_start <= current logical clock" }
  - { id: ERR_LEAD_TIME_TOO_SHORT, http: 422, condition: "Appointment window_start < now + 48 hours" }
  - { id: ERR_WARRANTY_WINDOW_EXPIRED, http: 422, condition: "Claim filed after its window (365 days DEFECT/MISSING_PARTS, 30 days DAMAGE_IN_TRANSIT, measured from delivered_at; filing exactly on the boundary day passes)" }
  - { id: ERR_BUYER_MISMATCH, http: 422, condition: "buyer_type / buyer FK mismatch: LICENSEE requires licensee_id and null retail_account_id; RETAIL_ACCOUNT the reverse" }
  - { id: ERR_PRICE_POINT_NOT_ON_LADDER, http: 422, condition: "price_point_cents not a member of PRICE_LADDER_CENTS" }
  - { id: ERR_CYCLE_WEEK_OVERLAP, http: 409, condition: "Cycle week window overlaps another cycle of the same factory; exactly adjacent weeks (start == prior start + 7 days) are allowed" }
  - { id: ERR_REGION_ALREADY_ASSIGNED, http: 409, condition: "Territory assign attempted while status == ASSIGNED" }
  - { id: ERR_MAX_TERRITORIES_EXCEEDED, http: 422, condition: "Assignment would give the licensee a 4th ASSIGNED territory (max 3)" }
  - { id: ERR_OUT_OF_TERRITORY, http: 422, condition: "Appointment region_code is not covered by any ASSIGNED territory of the order's licensee" }
  - { id: ERR_DELIVERY_MODE_NOT_ALLOWED, http: 422, condition: "HOME_DELIVERY on a retail-account order, or an appointment attempted on a FREIGHT_TO_STORE order" }
  - { id: ERR_HOME_DELIVERY_UNSUPPORTED, http: 422, condition: "DC supports_home_delivery is false" }
  - { id: ERR_DELIVERY_CAPACITY_EXCEEDED, http: 409, condition: "Crew capacity check per calculations.delivery_capacity_check fails at create or CONFIRM" }
  - { id: ERR_WINDOW_DURATION_INVALID, http: 422, condition: "Appointment window duration outside [120, 360] minutes" }
  - { id: ERR_ACCOUNT_HAS_OPEN_EXPOSURE, http: 422, condition: "Retail account close attempted with credit_used_cents > 0" }
  - { id: ERR_LICENSEE_NOT_ACTIVE, http: 409, condition: "Territory assign requires the licensee in status ACTIVE" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "Order SUBMIT would push credit_used_cents + provisional_total_cents strictly above credit_limit_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Brand operator staff: catalog, licensee lifecycle, territories, accounts, DCs"
    identity: opaque
    exclusive_operations: ["POST /api/factories", "POST /api/product-lines", "POST /api/product-lines/{id}/advance", "PUT /api/product-lines/{id}/price", "POST /api/licensees", "PUT /api/licensees/{id}/terms", "POST /api/licensees/{id}/transition", "POST /api/territories", "POST /api/territories/{id}/transition", "POST /api/retail-accounts", "POST /api/retail-accounts/{id}/transition", "POST /api/distribution-centers", "POST /_clock/set_current_utc"]
    shared_operations: ["all GET endpoints", "POST /api/orders/{id}/transition {action: CANCEL}"]
  - name: ProductionPlanner
    description: "Manufacturing planning staff: factory posture and weekly allocation cycles"
    identity: opaque
    exclusive_operations: ["POST /api/factories/{id}/transition", "POST /api/allocation-cycles", "POST /api/allocation-cycles/{id}/run-allocation", "POST /api/allocation-cycles/{id}/close"]
    shared_operations: ["all GET endpoints"]
  - name: LogisticsCoordinator
    description: "Distribution and fulfillment staff"
    identity: opaque
    exclusive_operations: ["POST /api/orders/{id}/transition {action: PICK|SHIP|DELIVER}", "POST /api/delivery-appointments/{id}/transition {to_state: CONFIRMED|COMPLETED}", "POST /api/parts-orders/{id}/transition"]
    shared_operations: ["all GET endpoints", "POST /api/delivery-appointments/{id}/transition {to_state: CANCELLED}"]
  - name: LicenseeManager
    description: "Operator of a licensed store; X-User-ID equals the Licensee id"
    identity: "entity_backed:Licensee"
    exclusive_operations: ["POST /api/orders (buyer_type LICENSEE, own id)", "POST /api/orders/{id}/transition {action: SUBMIT|CANCEL on own orders}", "POST /api/delivery-appointments (own orders)", "POST /api/warranty-claims (own orders)", "POST /api/warranty-claims/{id}/transition {to_state: UNDER_REVIEW with info_note on own claims}"]
    shared_operations: ["all GET endpoints", "POST /api/delivery-appointments/{id}/transition {to_state: CANCELLED on own appointments}"]
  - name: WholesaleBuyer
    description: "Buyer for an independent retail account; X-User-ID equals the RetailAccount id"
    identity: "entity_backed:RetailAccount"
    exclusive_operations: ["POST /api/orders (buyer_type RETAIL_ACCOUNT, own id)", "POST /api/orders/{id}/transition {action: SUBMIT|CANCEL on own orders}"]
    shared_operations: ["all GET endpoints"]
  - name: WarrantyAdmin
    description: "Warranty adjudication staff"
    identity: opaque
    exclusive_operations: ["POST /api/warranty-claims/{id}/transition {to_state: INFO_REQUESTED|RESOLVED|PARTS_ORDERED|DENIED}"]
    shared_operations: ["all GET endpoints"]
