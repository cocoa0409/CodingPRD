  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cross_ranger_checkin_requires_reservation_confirmed_and_home_park
        grounds:
          - state_machines.CampReservation.confirmed_to_checked_in
          - entities.Account.fields.home_park_id
          - entities.Campsite.fields.park_id
        distinguishing_aspect: |
          CampReservation's check_in transition depends on the acting ranger
          Account's home_park_id matching the Campsite's park_id (Reservation ->
          Account/Campsite pair); a ranger from a different park is rejected.
        test_recipe:
          setup:
            - "Two parks P1, P2; a confirmed reservation at P1; a ranger whose home park is P2 attempts check-in on its check_in date."
          setup_api_calls:
            - call: "POST /v1/parks"
              payload: { code: "P1AA", name: "Park One", utc_offset_minutes: 0 }
              as: system
              captures: { p1: $.data.id }
            - call: "POST /v1/parks"
              payload: { code: "P2BB", name: "Park Two", utc_offset_minutes: 0 }
              as: system
              captures: { p2: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { now_utc: "2026-06-20T12:00:00Z" }
              as: park_admin
            - call: "POST /v1/accounts"
              payload: { email: "pa13@x.com", full_name: "PA13", birth_date: "1980-01-01", role: "park_admin", home_park_id: "${p1}" }
              as: system
              captures: { pa_id: $.data.id }
            - call: "POST /v1/accounts"
              payload: { email: "rg2@x.com", full_name: "RG2", birth_date: "1980-01-01", role: "ranger", home_park_id: "${p2}" }
              as: system
              captures: { rg2_id: $.data.id }
            - call: "POST /v1/accounts"
              payload: { email: "v13@x.com", full_name: "V13", birth_date: "1990-01-01" }
              as: visitor
              captures: { v_id: $.data.id }
            - call: "POST /v1/campsites"
              payload: { park_id: "${p1}", site_number: "T13", site_type: "tent", max_occupancy: 6, base_nightly_cents: 4000 }
              as: park_admin
              as_user_id: "${pa_id}"
              captures: { site_id: $.data.id }
            - call: "POST /v1/camp-reservations"
              payload: { campsite_id: "${site_id}", account_id: "${v_id}", check_in: "2026-06-20", check_out: "2026-06-22", party_size: 2 }
              as: visitor
              as_user_id: "${v_id}"
              captures: { r_id: $.data.id }
            - call: "POST /v1/camp-reservations/${r_id}/confirm"
              payload: {}
              as: visitor
              as_user_id: "${v_id}"
          trigger:
            - call: "POST /v1/camp-reservations/${r_id}/check-in"
              payload: {}
              as: ranger
              as_user_id: "${rg2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "data.error_id == ERR_FORBIDDEN"
            - "CampReservation.${r_id}.status == confirmed"

      - name: cross_atb_pass_overlap_depends_on_existing_active_pass
        grounds:
          - validations[priority=10]
          - state_machines.AtbPass.active_to_voided
          - entities.AtbPass.fields.valid_to
        distinguishing_aspect: |
          A new AtbPass purchase's validity depends on the Account's existing
          active AtbPass state (AtbPass -> Account pair, distinct from the
          Reservation->Account/Campsite pair above): an overlapping active pass
          blocks the second purchase.
        test_recipe:
          setup:
            - "A visitor with one active annual pass valid 2026-06-01..2027-06-01; clock set; attempt to buy a second annual pass valid 2026-09-01 (overlaps)."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: park_admin
