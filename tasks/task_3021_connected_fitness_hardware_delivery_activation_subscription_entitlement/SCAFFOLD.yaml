    roles: [MembershipOwner, ServiceTechnician, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ClassEnrollment[]
    side_effects: []

  - method: GET
    path: "/fitness/household-users/{userId}/class-enrollments"
    description: "List enrollments for one household user"
    roles: [MembershipOwner, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ClassEnrollment[]
    side_effects: []

  - method: POST
    path: "/fitness/class-enrollments/{enrollmentId}/complete"
    description: "Complete a workout, applying the leaderboard integrity cap and incrementing the device counter"
    roles: [MembershipOwner, PlatformAdmin]
    code: 200
    input: ["output_points?", "completion_pct?", "benchmark_variant?"]
    output: ClassEnrollment
