          The gate lives on a DIFFERENT entity than the one being written: two showtimes identical in
          status, sale_status and seats_available diverge purely because the owning Booking moved CONFIRMED ->
          CLOSED between the two calls. Nothing about the second showtime changed, and no cascade touched it -
          the read of the parent's state is what decides.
