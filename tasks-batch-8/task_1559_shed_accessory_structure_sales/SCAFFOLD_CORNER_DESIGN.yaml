              captures: { order_id: $.data.id }
          trigger:
            - call: "GET /api/orders/${order_id}"
              as: Customer
              as_user_id: "99999999-8888-4777-8666-555555555555"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN (HTTP 403): the order belongs to ${cust_id}, not the caller"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Requests without X-User-Role / X-User-ID are rejected with 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/orders/aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee"
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED and HTTP status == 401 (auth precedes even the not-found check)"

  # ---------------------------------------------------------------------------
  - section: complexity_layers
    instances:
      - name: occ_stale_order_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[order-amend-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Amend carrying the pre-submit version fails 412 ERR_STALE_VERSION: submit-site-check bumped Order.version, so the client's observed version is stale even though the operation looks sequential."
        test_recipe:
          setup: ["A 10x12 CASH order created (version 1 captured), then submitted for site check (version advanced)"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { name: "Marion County, IN", state_code: "IN", county_name: "Marion", permit_threshold_sqft: 120, setback_front_ft: 10, setback_side_ft: 5, setback_rear_ft: 5, max_building_height_ft: 12, anchoring_required: true, permit_base_fee_cents: 15000, permit_per_sqft_cents: 50, tax_rate_bp: 700 }
              as: PermitCoordinator
              captures: { jur_id: $.data.id }
            - call: "POST /api/models"
              payload: { name: "GardenPro", sku: "GP-01", min_width_ft: 8, max_width_ft: 16, min_depth_ft: 8, max_depth_ft: 24, wall_height_ft: 8, supported_delivery_modes: ["PRE_BUILT", "ON_SITE_BUILD"], base_price_cents: 300000, overage_rate_tier1_cents: 1500, overage_rate_tier2_cents: 2000 }
              as: SalesRep
              captures: { model_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "317-555-0100", street: "1200 Fern Ave", city: "Indianapolis", state_code: "IN", zip: "46201" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", jurisdiction_id: "${jur_id}", width_ft: 10, depth_ft: 12, delivery_mode: "PRE_BUILT", foundation_type: "GRAVEL_PAD", anchor_type: "AUGER_STRAP", purchase_type: "CASH", options: [] }
              as: SalesRep
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /api/orders/${order_id}/submit-site-check"
              payload: { assessor_id: "asr-1", scheduled_date: "2026-08-02", window_start_hour: 10 }
              as: SalesRep
          trigger:
            - call: "PUT /api/orders/${order_id}"
              payload: { expected_order_version: "${order_v}", width_ft: 11 }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION and HTTP status == 412"
            - "Order.${order_id}.width_ft == 10 (stale amend applied nothing)"

      - name: occ_correct_version_amend_succeeds
        claim_type: satisfaction_to_pass
        grounds: ["concurrency_rules[order-amend-stale-version]", "endpoints.PUT_/api/orders/{orderId}"]
        distinguishing_aspect: "Amend with the current version succeeds, increments version by 1, and recomputes the quote (10x12 [WINDOW] -> 8x8 [WINDOW] = 443250)."
        test_recipe:
          setup: ["A 10x12 CASH order [WINDOW] in DRAFT, version captured at creation"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { name: "Marion County, IN", state_code: "IN", county_name: "Marion", permit_threshold_sqft: 120, setback_front_ft: 10, setback_side_ft: 5, setback_rear_ft: 5, max_building_height_ft: 12, anchoring_required: true, permit_base_fee_cents: 15000, permit_per_sqft_cents: 50, tax_rate_bp: 700 }
              as: PermitCoordinator
              captures: { jur_id: $.data.id }
            - call: "POST /api/models"
              payload: { name: "GardenPro", sku: "GP-01", min_width_ft: 8, max_width_ft: 16, min_depth_ft: 8, max_depth_ft: 24, wall_height_ft: 8, supported_delivery_modes: ["PRE_BUILT", "ON_SITE_BUILD"], base_price_cents: 300000, overage_rate_tier1_cents: 1500, overage_rate_tier2_cents: 2000 }
              as: SalesRep
              captures: { model_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "317-555-0100", street: "1200 Fern Ave", city: "Indianapolis", state_code: "IN", zip: "46201" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", jurisdiction_id: "${jur_id}", width_ft: 10, depth_ft: 12, delivery_mode: "PRE_BUILT", foundation_type: "GRAVEL_PAD", anchor_type: "AUGER_STRAP", purchase_type: "CASH", options: ["WINDOW"] }
              as: SalesRep
              captures: { order_id: $.data.id, order_v: $.data.version }
          trigger:
            - call: "PUT /api/orders/${order_id}"
              payload: { expected_order_version: "${order_v}", width_ft: 8, depth_ft: 8 }
              as: SalesRep
          assert:
            - "HTTP 200; Order.${order_id}.width_ft == 8 and area_sqft == 64"
            - "Order.${order_id}.version == ${order_v} + 1"
            - "Order.${order_id}.quoted_total_cents == 443250 (8x8 + WINDOW repriced)"

      - name: occ_stale_jurisdiction_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[jurisdiction-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Second jurisdiction update carrying the pre-first-update version fails 412; only the freshest writer succeeds."
        test_recipe:
          setup: ["A jurisdiction created (version captured)"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { name: "Marion County, IN", state_code: "IN", county_name: "Marion", permit_threshold_sqft: 120, setback_front_ft: 10, setback_side_ft: 5, setback_rear_ft: 5, max_building_height_ft: 12, anchoring_required: true, permit_base_fee_cents: 15000, permit_per_sqft_cents: 50, tax_rate_bp: 700 }
              as: PermitCoordinator
              captures: { jur_id: $.data.id, jur_v: $.data.version }
          trigger:
            - call: "PUT /api/jurisdictions/${jur_id}"
              payload: { expected_jurisdiction_version: "${jur_v}", permit_base_fee_cents: 17500 }
              as: PermitCoordinator
            - call: "PUT /api/jurisdictions/${jur_id}"
              payload: { expected_jurisdiction_version: "${jur_v}", permit_base_fee_cents: 19999 }
              as: PermitCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "First PUT succeeds (version -> ${jur_v} + 1, permit_base_fee_cents == 17500)"
            - "Second PUT: err == ERR_STALE_VERSION (412); permit_base_fee_cents remains 17500"

      - name: derived_field_collected_reconciles
        claim_type: derived_field_recompute
        grounds: ["entities.Order.fields.collected_cents", "endpoints.POST_/api/orders/{orderId}/payments"]
        distinguishing_aspect: "collected_cents is a pure aggregation over Payment rows: two payments (50000 + 70000) reconcile to 120000 on the next read."
        test_recipe:
          setup: ["A CASH order in SITE_REVIEW with two payments recorded"]
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { name: "Marion County, IN", state_code: "IN", county_name: "Marion", permit_threshold_sqft: 120, setback_front_ft: 10, setback_side_ft: 5, setback_rear_ft: 5, max_building_height_ft: 12, anchoring_required: true, permit_base_fee_cents: 15000, permit_per_sqft_cents: 50, tax_rate_bp: 700 }
              as: PermitCoordinator
              captures: { jur_id: $.data.id }
            - call: "POST /api/models"
              payload: { name: "GardenPro", sku: "GP-01", min_width_ft: 8, max_width_ft: 16, min_depth_ft: 8, max_depth_ft: 24, wall_height_ft: 8, supported_delivery_modes: ["PRE_BUILT", "ON_SITE_BUILD"], base_price_cents: 300000, overage_rate_tier1_cents: 1500, overage_rate_tier2_cents: 2000 }
              as: SalesRep
              captures: { model_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "317-555-0100", street: "1200 Fern Ave", city: "Indianapolis", state_code: "IN", zip: "46201" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", jurisdiction_id: "${jur_id}", width_ft: 8, depth_ft: 8, delivery_mode: "PRE_BUILT", foundation_type: "GRAVEL_PAD", anchor_type: "AUGER_STRAP", purchase_type: "CASH", options: [] }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /api/orders/${order_id}/submit-site-check"
              payload: { assessor_id: "asr-1", scheduled_date: "2026-08-02", window_start_hour: 10 }
              as: SalesRep
            - call: "POST /api/orders/${order_id}/payments"
              payload: { amount_cents: 50000, method: "CARD", idempotency_key: "agg-1" }
              as: FinanceManager
          trigger:
            - call: "POST /api/orders/${order_id}/payments"
              payload: { amount_cents: 70000, method: "CASH", idempotency_key: "agg-2" }
              as: FinanceManager
            - call: "GET /api/orders/${order_id}"
              as: FinanceManager
          assert:
            - "Order.${order_id}.collected_cents == 120000"
            - "First payment kind == DEPOSIT, second kind == BALANCE (kind derived from payment order)"

      - name: cascading_layer_end_to_end
        claim_type: cascade_chain
        grounds: ["complexity_profile.complexity_layers"]
        excluded_because:
          difficulty_instance: assessment_report_ready_cascade_depth3
          rationale: "The 3-link report -> order -> application -> order chain IS the cascading-side-effects layer probe; asserted there end-to-end."

