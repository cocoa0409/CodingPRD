            - call: "POST /home-oxygen/delivery-routes"
              payload: { branch_id: "${br_id}", service_date: "2026-08-15", driver_user_id: "u-drv-1", shift_start_utc: "2026-08-15T12:00:00Z", shift_end_utc: "2026-08-15T22:00:00Z" }
              as: BranchManager
              captures: { r2_id: $.data.id }
          trigger:
            - call: "POST /home-oxygen/route-stops"
              payload: { route_id: "${r2_id}", contract_id: "${c_id}", stop_type: "TANK_EXCHANGE", window_start_utc: "2026-08-15T13:00:00Z", window_end_utc: "2026-08-15T14:00:00Z", service_minutes: 45, cylinders_requested: 2 }
              as: BranchManager
              captures: { s_a: $.data.id }
            - call: "POST /home-oxygen/route-stops"
              payload: { route_id: "${r2_id}", contract_id: "${c_id}", stop_type: "TANK_EXCHANGE", window_start_utc: "2026-08-15T14:15:00Z", window_end_utc: "2026-08-15T15:00:00Z", service_minutes: 45, cylinders_requested: 2 }
              as: BranchManager
            - call: "POST /home-oxygen/route-stops"
              payload: { route_id: "${r2_id}", contract_id: "${c_id}", stop_type: "TANK_EXCHANGE", window_start_utc: "2026-08-15T14:30:00Z", window_end_utc: "2026-08-15T15:30:00Z", service_minutes: 45, cylinders_requested: 2 }
              as: BranchManager
              captures: { s_c: $.data.id }
          assert:
            - "Stop A is created: RouteStop.${s_a}.status == PLANNED AND liters_committed == 1360 (2 cylinders x 680 L); its buffered half-open interval is [2026-08-15T13:00:00Z, 2026-08-15T14:30:00Z)"
            - "The second call (14:15Z to 15:00Z) -> 409 ERR_ROUTE_STOP_WINDOW_CONFLICT: 14:15Z lies inside stop A's buffered interval even though 14:15Z is after stop A's own window_end_utc of 14:00Z"
            - "No RouteStop row was created by the rejected call: DeliveryRoute.${r2_id}.planned_stop_count is still 1 and total_o2_liters_committed is still 1360 immediately after it"
            - "Stop C is created: RouteStop.${s_c}.status == PLANNED — window_start_utc 14:30:00Z equals stop A's buffered end instant exactly, and the interval is half-open, so adjacency is allowed"
            - "After stop C: DeliveryRoute.${r2_id}.planned_stop_count == 2 AND total_o2_liters_committed == 2720 AND refill_slots_used == 0"
            - "A stop at 14:29:59Z would have been rejected and 14:30:00Z is accepted, so the conflict boundary sits exactly at window_end_utc plus tank_exchange_buffer_minutes"

      - name: travel_authorization_closed_interval_touching_endpoints_conflict
        grounds:
          - validations[priority=76]
          - errors[ERR_TRAVEL_INTERVAL_CONFLICT]
          - entities.TravelAuthorization.fields.depart_utc
          - entities.TravelAuthorization.fields.return_utc
          - calculations.travel_supply_authorization
          - concurrency_rules[travel-auth-create-stale-contract]
        distinguishing_aspect: |
          The contended resource is the RentalContract (a patient's single oxygen supply stream, a
          different resource entity from the DeliveryRoute above) and its interval semantics are the
          opposite: CLOSED and unbuffered, so a trip departing exactly when the previous trip returns
          IS a conflict and only one second of separation makes it legal.
        test_recipe:
          setup:
            - "One branch (Tampa Bay, FL) and one ACTIVE patient at altitude 500 ft."
            - "One GROUP_I study and one ACTIVE certificate prescribing 1.0 LPM, 24 h/day, portable not prescribed, lifetime need."
            - "One RentalContract (COMPETITIVE_BID_SINGLE_PAYMENT, cap 36) with no placements and no route — travel authorization needs neither."
            - "The clock stays at the startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
