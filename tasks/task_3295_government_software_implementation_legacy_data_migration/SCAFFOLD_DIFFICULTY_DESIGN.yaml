    grounds:
    - validations[priority=5]
    - validations[priority=7]
    - errors[ERR_INVALID_STATE]
    - errors[ERR_GO_LIVE_IN_BLACKOUT]
    distinguishing_aspect: "Error-category pair (state vs business_safety): a readiness-check on a GoLiveEvent that is both in the wrong state (already READINESS_CHECKED)\
      \ AND whose planned_date sits inside a blackout window must return ERR_INVALID_STATE (priority 5 state beats priority 7 safety) \u2014 the observable error\
      \ depends on category ordering."
