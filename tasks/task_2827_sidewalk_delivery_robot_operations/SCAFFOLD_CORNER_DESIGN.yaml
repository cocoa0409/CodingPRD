      - name: stale_mission_version_is_reported_before_the_clearance_gate
        claim_type: priority_conflict
        grounds:
          - "validations[priority=45]"
          - "validations[priority=65]"
          - "errors.ERR_STALE_MISSION_VERSION"
          - "errors.ERR_CLEARANCE_INSUFFICIENT"
          - "concurrency_rules[route-plan-create-stale-mission]"
          - "calculations.route_clearance_margin"
        distinguishing_aspect: >-
          One request violates two rules at once and only the lower priority number is reported: a plan
          create that pins the pre-load mission version for a 140 cm robot returns 412
          ERR_STALE_MISSION_VERSION, and the identical body with the current version then returns 422
          ERR_CLEARANCE_INSUFFICIENT - so the OCC check at 45 runs strictly before the geometry gate at 65
          and a stale writer never learns whether its geometry would have been accepted.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 PERMITTED with segments S1 118.0 cm, S2 150.0 cm, S3 104.0 cm and S5 92.0 cm APPROVED"
            - "Robot R1 has width_cm 140.0, so the clearance margin on S5 is 92.0 - 140.0 - 12 == -60.0 and the route can never validate"
            - "the mission version was read as 1 immediately after dispatch and the load then advanced it to 2"
            - "the mission is LOADED and both plan creates below carry the identical segment sequence"
