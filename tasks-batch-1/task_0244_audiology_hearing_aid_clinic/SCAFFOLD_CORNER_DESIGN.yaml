              payload: {}
              as: BillingClerk
            - call: "POST /clinic/_clock/set"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/orders/${order_id}/activate-warranty"
              payload: {}
              as: BillingClerk
            - call: "POST /clinic/orders/${order_id}/warranty-claims"
              payload: { claim_type: "DEFECT", incident_date: "2026-04-10", assessed_value_cents: 50000 }
              as: BillingClerk
              captures: { claim_id: $.data.id }
            - call: "POST /clinic/warranty-claims/${claim_id}/approve"
              payload: {}
              as: BillingClerk
              captures: { claim_v: $.data.version }
          trigger:
            - call: "POST /clinic/warranty-claims/${claim_id}/replace"
              payload: { expected_warranty_claim_version: "${claim_v}" }
              as: BillingClerk
              captures: { st: $.data.status }
          assert:
            - "WarrantyClaim.${claim_id}.status == REPLACED"
            - "WarrantyClaim.${claim_id}.deductible_cents == 0"

      - name: occ_issue_stale_recall_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[issue-stale-recall]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Issuing a recall with expected_recall_notice_version one behind the current version returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["A DRAFT recall whose version was bumped after creation (e.g. via a PATCH to the same recall is not available; instead create and capture, then pass current - 1 to force staleness)."]
          setup_api_calls:
            - call: "POST /clinic/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/device-models"
              payload: { model_code: "DV-RV-1", name: "RecallVerModel", list_price_cents: 200000, restock_fee_cents: 10000, min_severity: "MILD", firmware_version: "1.0.0", warranty_months: 24 }
              as: ClinicAdmin
              captures: { model_id: $.data.id }
            - call: "POST /clinic/recalls"
              payload: { device_model_id: "${model_id}", affected_firmware_version: "1.0.0", target_firmware_version: "1.0.1", severity_level: "ADVISORY" }
              as: ClinicAdmin
              captures: { recall_id: $.data.id, recall_v: $.data.version }
          trigger:
            - call: "POST /clinic/recalls/${recall_id}/issue"
              payload: { expected_recall_notice_version: "${recall_v} - 1" }
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: version_increments_on_each_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.FittingOrder.fields.version, state_machines.FittingOrder.DRAFT_to_TRIAL]
        distinguishing_aspect: "A FittingOrder created with version=1 advances to version=2 after start-trial (every mutation increments version by 1)."
        test_recipe:
          setup: ["A DRAFT order with version=1."]
          setup_api_calls:
            - call: "POST /clinic/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/patients"
              payload: { full_name: "Ver Pt", date_of_birth: "1960-01-01" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinic/device-models"
              payload: { model_code: "DV-VR2-1", name: "VerModel", list_price_cents: 100000, restock_fee_cents: 5000, min_severity: "MILD", firmware_version: "1.0.0", warranty_months: 24 }
              as: ClinicAdmin
              captures: { model_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { patient_id: "${pat_id}", audiologist_user_id: "aud-1", pure_tone_avg_db: 45 }
              as: Audiologist
              captures: { eval_id: $.data.id }
            - call: "POST /clinic/evaluations/${eval_id}/finalize"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", device_model_id: "${model_id}", ear_count: 1 }
              as: Audiologist
              captures: { order_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /clinic/orders/${order_id}/start-trial"
              payload: {}
              as: Audiologist
              captures: { v2: $.data.version }
          assert:
            - "FittingOrder.${order_id}.version == 2"

      - name: loss_replacement_refreshes_fitted_firmware
        claim_type: cascading_side_effects
        grounds: [state_machines.WarrantyClaim.APPROVED_to_REPLACED, entities.FittingOrder.fields.fitted_firmware_version]
        distinguishing_aspect: "Replacing an APPROVED LOSS claim refreshes the order's fitted_firmware_version to the current model firmware (model was PATCHed to 5.0.0 after purchase)."
        test_recipe:
          setup: ["A WARRANTY_ACTIVE order purchased on firmware 1.0.0; model later PATCHed to 5.0.0; an APPROVED LOSS claim assessed 100000."]
          setup_api_calls:
            - call: "POST /clinic/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/patients"
              payload: { full_name: "LossFw Pt", date_of_birth: "1960-01-01" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinic/device-models"
              payload: { model_code: "DV-LFW-1", name: "LossFwModel", list_price_cents: 200000, restock_fee_cents: 10000, min_severity: "MILD", firmware_version: "1.0.0", warranty_months: 24 }
              as: ClinicAdmin
              captures: { model_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { patient_id: "${pat_id}", audiologist_user_id: "aud-1", pure_tone_avg_db: 50 }
              as: Audiologist
              captures: { eval_id: $.data.id }
            - call: "POST /clinic/evaluations/${eval_id}/finalize"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", device_model_id: "${model_id}", ear_count: 1 }
              as: Audiologist
              captures: { order_id: $.data.id }
            - call: "POST /clinic/orders/${order_id}/start-trial"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders/${order_id}/purchase"
              payload: {}
              as: BillingClerk
            - call: "PATCH /clinic/device-models/${model_id}"
              payload: { firmware_version: "5.0.0" }
              as: ClinicAdmin
            - call: "POST /clinic/_clock/set"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/orders/${order_id}/activate-warranty"
              payload: {}
              as: BillingClerk
            - call: "POST /clinic/orders/${order_id}/warranty-claims"
              payload: { claim_type: "LOSS", incident_date: "2026-04-10", assessed_value_cents: 100000 }
              as: BillingClerk
              captures: { claim_id: $.data.id }
            - call: "POST /clinic/warranty-claims/${claim_id}/approve"
              payload: {}
              as: BillingClerk
              captures: { claim_v: $.data.version }
          trigger:
            - call: "POST /clinic/warranty-claims/${claim_id}/replace"
              payload: { expected_warranty_claim_version: "${claim_v}" }
              as: BillingClerk
            - call: "GET /clinic/orders/${order_id}"
              payload: {}
              as: BillingClerk
              captures: { fw: $.data.fitted_firmware_version }
          assert:
            - "FittingOrder.${order_id}.fitted_firmware_version == 5.0.0"
            - "WarrantyClaim.${claim_id}.deductible_cents == 40000"

  # =========================================================================
  # Consistency Model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: allowance_consumed_visible_same_request_immediate
        claim_type: immediate
        grounds: [entities.AllowanceBenefit.fields.consumed_allowance_cents, state_machines.FittingOrder.TRIAL_to_PURCHASED]
        distinguishing_aspect: "consumed_allowance_cents reflects the just-completed purchase immediately: a GET on the benefit right after purchase shows consumed == applied (250000)."
        test_recipe:
          setup: ["Clock 2026-03-01. Patient with ACTIVE benefit total=500000 cap=250000 coins=0.20; a binaural 300000 order in TRIAL."]
          setup_api_calls:
            - call: "POST /clinic/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/patients"
              payload: { full_name: "Immediate Pt", date_of_birth: "1960-01-01" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinic/device-models"
              payload: { model_code: "DV-IMM-1", name: "ImmediateModel", list_price_cents: 300000, restock_fee_cents: 20000, min_severity: "MODERATE", firmware_version: "1.0.0", warranty_months: 24 }
              as: ClinicAdmin
              captures: { model_id: $.data.id }
            - call: "POST /clinic/allowance-benefits"
              payload: { patient_id: "${pat_id}", plan_name: "Imm", total_allowance_cents: 500000, per_device_cap_cents: 250000, coinsurance_pct: 0.20, period_end: "2026-12-31" }
              as: BillingClerk
              captures: { ben_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { patient_id: "${pat_id}", audiologist_user_id: "aud-1", pure_tone_avg_db: 60 }
              as: Audiologist
              captures: { eval_id: $.data.id }
            - call: "POST /clinic/evaluations/${eval_id}/finalize"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", device_model_id: "${model_id}", ear_count: 2, allowance_benefit_id: "${ben_id}" }
              as: Audiologist
              captures: { order_id: $.data.id }
            - call: "POST /clinic/orders/${order_id}/start-trial"
              payload: {}
              as: Audiologist
          trigger:
            - call: "POST /clinic/orders/${order_id}/purchase"
              payload: {}
              as: BillingClerk
            - call: "GET /clinic/allowance-benefits/${ben_id}"
              payload: {}
              as: BillingClerk
              captures: { consumed: $.data.consumed_allowance_cents }
          assert:
            - "AllowanceBenefit.${ben_id}.consumed_allowance_cents == 250000"
            - "AllowanceBenefit.${ben_id}.status == ACTIVE"

  # =========================================================================
  # Excluded stubs (already covered by §1.8)
  # =========================================================================
  - section: calculations
    instances:
      - name: stub_benefit_waterfall_pool_binds
        claim_type: variant_divergence
        grounds: [calculations.benefit_waterfall]
        excluded_because:
          difficulty_instance: combinatorial_formula / benefit_waterfall_mode_a_nested_min
          rationale: "Pool-binds-first waterfall branch is asserted directly by the named §1.8 instance."
      - name: stub_severity_boundary
        claim_type: precision
        grounds: [calculations.severity_classification]
        excluded_because:
          difficulty_instance: boundary_precision_check / severity_normal_mild_boundary_25_vs_26
          rationale: "The 25-vs-26 severity boundary is the §1.8 boundary-precision instance."
      - name: stub_loyalty_discount_boundary
        claim_type: precision
        grounds: [calculations.supply_cycle_billing]
        excluded_because:
          difficulty_instance: boundary_precision_check / loyalty_discount_cycle_6_vs_7_boundary
          rationale: "Cycle 6-vs-7 loyalty boundary is the §1.8 boundary-precision instance."
  - section: state_machines
    instances:
      - name: stub_warranty_appeal_cycle
        claim_type: valid_transition
        grounds: [state_machines.WarrantyClaim.DENIED_to_APPEALED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / warranty_claim_deny_appeal_approve_cycle
          rationale: "The deny/appeal/approve cycle is exercised end-to-end by the named §1.8 instance."
