        claim_type: violation_to_error
        grounds: ["errors[ERR_SCENARIO_NOT_ACTIVE]", "validations[priority=21]"]
        distinguishing_aspect: "Evaluation requires scenario status ACTIVE at evaluation time — a SUSPENDED scenario with a perfectly good ACTIVE threshold still rejects with ERR_SCENARIO_NOT_ACTIVE."
        test_recipe:
          setup: ["Scenario fully ACTIVE with ACTIVE threshold, then suspended; account with firing data"]
