            - call: "POST /utility-orders/${uo_e_id}/credit-checks"
              payload: { bureau: "EXPERIAN" }
              as: MoveOpsAgent
              captures: { cch_e_id: $.data.id }
            - call: "POST /utility-orders/${uo_g_id}/credit-checks"
              payload: { bureau: "EXPERIAN" }
              as: MoveOpsAgent
              captures: { cch_g_id: $.data.id }
          trigger:
            - call: "POST /credit-check-handoffs/${cch_e_id}/bureau-response"
              payload: { score: 640 }
              as: ExternalServiceGateway
            - call: "POST /credit-check-handoffs/${cch_g_id}/bureau-response"
              payload: { score: 639 }
              as: ExternalServiceGateway
          assert:
            - "UtilityOrder.${uo_e_id}.readiness_snapshot == 40 and UtilityOrder.${uo_g_id}.readiness_snapshot == 40"
            - "at the threshold: CreditCheckHandoff.${cch_e_id}.result == CLEAR, UtilityOrder.${uo_e_id}.credit_status == CLEARED, deposit_amount_cents == 0"
            - "one below: CreditCheckHandoff.${cch_g_id}.result == DEPOSIT_REQUIRED, UtilityOrder.${uo_g_id}.credit_status == DEPOSIT_DUE"
            - "UtilityOrder.${uo_g_id}.deposit_amount_cents == 18000 (15000 * SCORE_MULT_HIGH 1.00 * READINESS_MULT_WEAK 1.20, rounded once)"
            - "UtilityOrder.${uo_e_id}.deposit_estimate_cents == 22500 and UtilityOrder.${uo_g_id}.deposit_estimate_cents == 22500 (the mapping-time estimate is unchanged by either response)"
            - "both orders remain provision_status DRAFT (the credit dimension moved on its own)"
            - "POST /utility-orders/${uo_g_id}/deposit-payments with amount_cents 17999 returns HTTP 422 ERR_DEPOSIT_AMOUNT_MISMATCH, and with 18000 returns HTTP 200 with credit_status DEPOSIT_PAID"

      - name: duplicate_score_exactly_080_threshold_vs_079
        grounds:
          - calculations.duplicate_match_score
          - "endpoints[POST /moves]"
          - state_machines.MoveRecord.CREATION_to_INTAKE
          - "entities.MoveRecord.fields.duplicate_flag"
        distinguishing_aspect: |
          A DIFFERENT metric on a DIFFERENT endpoint: the 2-decimal duplicate_match_score against
          DUP_SUSPECT_THRESHOLD (0.80) at POST /moves. Two intakes differing only by one day of move_date
          gap (15 vs 17 days inside a 30-day dedupe window) land on 0.80 and 0.79; the first must be
          SUSPECTED and blocked, the second NONE and free, which pins both the linear recency decay and
          the inclusive >= comparison on the rounded value.
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; feed source dedupe_window_days 30."
            - "Residents R1 (Dana Ruiz) and R2 (Ivan Cole), one shared origin, destinations D1 and D2 both in 30302 (different address_hash, so address_component is PARTIAL_ADDRESS_SCORE 0.50)."
            - "Earlier move A1 = (R1, D1, 2026-08-20) and earlier move A2 = (R2, D1, 2026-08-20), both left in INTAKE so they sit in the OPEN candidate pool."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /feed-sources"
              payload: { name: "Metro PM Feed", source_type: "PROPERTY_MANAGER", referral_revenue_share_pct: 0.1750, dedupe_window_days: 30, trust_tier: "TIER_B" }
              as: PlatformAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Dana Ruiz", email: "dana.ruiz@example.com", phone_last4: "4417", date_of_birth: "1988-04-12", ssn_last4: "6621" }
              as: PlatformAdmin
              captures: { res1_id: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Ivan Cole", email: "ivan.cole@example.com", phone_last4: "9052", date_of_birth: "1979-11-02", ssn_last4: "3318" }
              as: PlatformAdmin
              captures: { res2_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "18 Maple Ct", city: "Atlanta", state_code: "GA", postal_code: "30301" }
              as: PlatformAdmin
              captures: { orig_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "402 Peachtree Way", unit: "7B", city: "Atlanta", state_code: "GA", postal_code: "30302" }
              as: PlatformAdmin
              captures: { dest_d1_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "915 Juniper St", city: "Atlanta", state_code: "GA", postal_code: "30302" }
              as: PlatformAdmin
              captures: { dest_d2_id: $.data.id }
            - call: "POST /moves"
              payload: { resident_id: "${res1_id}", feed_source_id: "${fs_id}", origin_address_id: "${orig_id}", destination_address_id: "${dest_d1_id}", move_date: "2026-08-20", external_reference: "PM-A1" }
              as: MoveOpsAgent
              captures: { mv_a1_id: $.data.id }
            - call: "POST /moves"
              payload: { resident_id: "${res2_id}", feed_source_id: "${fs_id}", origin_address_id: "${orig_id}", destination_address_id: "${dest_d1_id}", move_date: "2026-08-20", external_reference: "PM-A2" }
              as: MoveOpsAgent
              captures: { mv_a2_id: $.data.id }
          trigger:
            - call: "POST /moves"
              payload: { resident_id: "${res1_id}", feed_source_id: "${fs_id}", origin_address_id: "${orig_id}", destination_address_id: "${dest_d2_id}", move_date: "2026-09-04", external_reference: "PM-B1" }
              as: MoveOpsAgent
              captures: { mv_b1_id: $.data.id }
            - call: "POST /moves"
              payload: { resident_id: "${res2_id}", feed_source_id: "${fs_id}", origin_address_id: "${orig_id}", destination_address_id: "${dest_d2_id}", move_date: "2026-09-06", external_reference: "PM-B2" }
              as: MoveOpsAgent
              captures: { mv_b2_id: $.data.id }
          assert:
            - "MoveRecord.${mv_a2_id}.duplicate_match_score == 0.40 and duplicate_flag == NONE (address 1.00 * 0.25 + recency 1.00 * 0.15 against A1)"
            - "at the threshold: MoveRecord.${mv_b1_id}.duplicate_match_score == 0.80 (name 1.00*0.35 + email 1.00*0.25 + address 0.50*0.25 + recency 0.50*0.15, gap 15 of window 30)"
            - "MoveRecord.${mv_b1_id}.duplicate_flag == SUSPECTED, blocked_reason == DUPLICATE_SUSPECTED, lifecycle_status == INTAKE, duplicate_candidate_move_id == ${mv_a1_id}"
            - "one step below: MoveRecord.${mv_b2_id}.duplicate_match_score == 0.79 (gap 17 of window 30 gives recency 0.43333 before the single 2dp rounding)"
            - "MoveRecord.${mv_b2_id}.duplicate_flag == NONE, blocked_reason == NONE, duplicate_candidate_move_id == ${mv_a2_id} (A2 at 0.79 outranks B1 at 0.39, so ranking is score-driven, not insertion-driven)"
            - "POST /moves/${mv_b1_id}/identity-verifications returns HTTP 409 ERR_DUPLICATE_MOVE_UNRESOLVED while the move is held at 0.80 (lifecycle INTAKE permits the operation, so priority 27 is the blocker, not priority 7)"
            - "POST /moves/${mv_b2_id}/identity-verifications returns HTTP 201 (0.79 does not hold the move)"

