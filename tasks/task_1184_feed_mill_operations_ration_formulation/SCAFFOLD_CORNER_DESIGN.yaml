            - { call: "POST /api/bins/${binc_id}/assign", payload: { ingredient_id: "${corn_id}" }, as: MillManager }
            - { call: "POST /api/bins/${binc_id}/replenish", payload: { tons: 20 }, as: MillManager }
            - { call: "POST /api/bins", payload: { code: "BIN-S", capacity_tons: 50 }, as: MillManager, captures: { bins_id: $.data.id } }
            - { call: "POST /api/bins/${bins_id}/assign", payload: { ingredient_id: "${sbm_id}" }, as: MillManager }
            - { call: "POST /api/bins/${bins_id}/replenish", payload: { tons: 20 }, as: MillManager }
            - { call: "POST /api/bins", payload: { code: "BIN-H", capacity_tons: 50 }, as: MillManager, captures: { binh_id: $.data.id } }
            - { call: "POST /api/bins/${binh_id}/assign", payload: { ingredient_id: "${hulls_id}" }, as: MillManager }
            - { call: "POST /api/bins/${binh_id}/replenish", payload: { tons: 5 }, as: MillManager }
            - { call: "POST /api/batches", payload: { order_id: "${ord_id}", line_id: "${line_id}", target_tons: 10, planned_start_at: "2026-05-02T10:00:00Z", planned_end_at: "2026-05-02T11:00:00Z" }, as: MillManager, captures: { bat_id: $.data.id } }
            - { call: "POST /api/batches/${bat_id}/start", payload: {}, as: Operator, as_user_id: "${op_id}" }
          trigger:
            - { call: "POST /api/batches/${bat_id}/weighments", payload: { ingredient_id: "${corn_id}", bin_id: "${bins_id}", actual_tons: 1.000 }, as: Operator, as_user_id: "${op_id}", captures: { err_mm: $.data.error_id } }
            - { call: "POST /api/batches/${bat_id}/weighments", payload: { ingredient_id: "${corn_id}", bin_id: "${binc_id}", actual_tons: 999 }, as: Operator, as_user_id: "${op_id}", captures: { err_inv: $.data.error_id } }
            - { call: "POST /api/batches/${bat_id}/weighments", payload: { ingredient_id: "${hulls_id}", bin_id: "${binh_id}", actual_tons: 1.000 }, as: Operator, as_user_id: "${op_id}", captures: { err_nf: $.data.error_id } }
          assert:
            - "err_mm == ERR_BIN_INGREDIENT_MISMATCH (BIN-S holds SBM, not corn)"
            - "err_inv == ERR_INSUFFICIENT_INVENTORY (999 > 20 on hand)"
            - "err_nf == ERR_INGREDIENT_NOT_IN_FORMULA (HULLS not in pinned lines)"
            - "Batch.${bat_id}.status == BATCHING; Bin on_hand values unchanged (20/20/5)"

      - name: flush_domain_errors
        claim_type: violation_to_error
        grounds: ["errors[ERR_FLUSH_MATERIAL_INVALID]", "errors[ERR_FLUSH_QUANTITY_BELOW_MIN]"]
        distinguishing_aspect: "Flush validation: non-flush material rejected (422), quantity 0.4 below the 0.5 minimum rejected (422), and exactly 0.5 accepted (inclusive boundary)."
        test_recipe:
          setup: ["line L1; corn (not flush material); HULLS (flush material); operator"]
          setup_api_calls:
            - { call: "POST /api/ingredients", payload: { code: "CORN", name: "Yellow corn", hazard_class: "STANDARD", crude_protein_pct: 9.0, crude_fiber_pct: 2.2, metabolizable_energy_kcal_kg: 3300 }, as: MillManager, captures: { corn_id: $.data.id } }
            - { call: "POST /api/ingredients", payload: { code: "HULLS", name: "Rice hulls flush", hazard_class: "STANDARD", is_flush_material: true, crude_protein_pct: 3.0, crude_fiber_pct: 30.0, metabolizable_energy_kcal_kg: 1000 }, as: MillManager, captures: { hulls_id: $.data.id } }
