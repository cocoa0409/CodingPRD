          difficulty_instance: transfer_case_fork_assumption_vs_prepayment_from_same_creation_endpoint
          rationale: "The branching fork taken inside POST /servicing/transfer-cases — ASSUMPTION landing in CREDIT_REVIEW versus PREPAYMENT staying in INITIATED, from one identical endpoint — is exercised in full by the §1.8 non_linear_state_machine instance."

      - name: warranty_claim_info_request_cycle_is_capped
        claim_type: cyclic
        grounds:
          - state_machines.WarrantyClaim.INFO_REQUESTED_to_SUBMITTED
        excluded_because:
          difficulty_instance: warranty_claim_info_request_cycle_capped_at_three_revisions
          rationale: "The SUBMITTED <-> INFO_REQUESTED loop and its MAX_CLAIM_REVISIONS termination condition are covered by the §1.8 non_linear_state_machine instance, which walks the cycle to exactly three revisions and then expects ERR_CLAIM_REVISION_LIMIT."

