        claim_type: Input Set Filtering
        grounds:
          - calculations.project_cost_estimate
          - calculations.funding_envelope
          - concurrency_rules[project-scope-amendment-stale-project]
        distinguishing_aspect: "A scope amendment dropping one of two items recomputes the estimate over the surviving INCLUDED set (150000 -> 100000), rebases the envelope (172500 -> 115000), and releases exactly the delta from the cycle reserve."
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Cycle budget 1000000; one selected project with two volunteer items (100000..100000 and 50000..50000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
