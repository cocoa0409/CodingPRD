        claim_type: valid_transition
        grounds:
          - state_machines.RebookingCredit.ISSUED_to_REDEEMED
          - state_machines.RebookingCredit.ISSUED_to_PARTIALLY_REDEEMED
          - calculations.credit_redemption
          - errors[ERR_CREDIT_NOT_REDEEMABLE]
        distinguishing_aspect: |
          Redemption state follows the waterfall remainder: consuming exactly
          remaining_cents flips ISSUED -> REDEEMED (further apply rejected),
          while consuming less flips ISSUED -> PARTIALLY_REDEEMED with
          amount_cents == redeemed_cents + remaining_cents preserved.
        test_recipe:
          setup:
            - "R1 base 25000, R2 base 10000; F1 dep 2026-08-03T14:00 (R1); F3 dep 2026-08-04T14:00 (R1); F4 dep 2026-08-04T15:00 (R2)"
