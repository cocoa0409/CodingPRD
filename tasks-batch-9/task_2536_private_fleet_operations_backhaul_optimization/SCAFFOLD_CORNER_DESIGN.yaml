              captures: { t_after_arrive: $.data.plan_status }
            - call: "POST /fleet/trip-stops/${stop1_id}/complete"
              payload: { cases_handled: 600, actual_departure_at: "2026-08-20T09:20:00Z" }
              as: Driver
              as_user_id: "${driver_id}"
              captures: { s1_done: $.data.status }
            - call: "POST /fleet/trip-stops/${stop2_id}/arrive"
              payload: { actual_arrival_at: "2026-08-20T10:05:00Z" }
              as: Driver
              as_user_id: "${driver_id}"
              captures: { s2_status: $.data.status }
            - call: "GET /fleet/trips/${trip_id}"
