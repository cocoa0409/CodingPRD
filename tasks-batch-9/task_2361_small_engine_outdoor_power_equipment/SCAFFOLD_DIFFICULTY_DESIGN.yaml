          (POST /line-audits/{id}/record) against a STRICT threshold: 1 of 4 units gives
          exactly 0.2500, which does NOT exceed MAX_AUDIT_FAILURE_RATE 0.25 and therefore
          PASSES, while 2 of 4 gives 0.5000 and fails. The pair pins both the 4-decimal
          rate and the strict > comparison — the mirror image of instance 1's inclusive
          gate.
