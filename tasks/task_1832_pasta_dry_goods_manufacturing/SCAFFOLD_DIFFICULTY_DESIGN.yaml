              as: ProductionOperator
              captures: { rem_end: $.data.remaining_weight_kg }
          assert:
            - "After consume: remaining 300.0, consumed 200.0 (500 == 300 + 200)"
            - "After abort refund: remaining 500.0, consumed 0.0, status ACCEPTED (500 == 500 + 0 — compensation leaves no drift)"
            - "After run2 consume of exactly 500.0: remaining 0.0, consumed 500.0, status DEPLETED (500 == 0 + 500)"

      - name: zone_pallet_occupancy_putaway_release_balance
        grounds:
          - calculations.zone_occupancy
          - state_machines.FinishedGoodsLot.CREATED_to_STORED
          - state_machines.FinishedGoodsLot.STORED_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity = zone pallet occupancy (count, not mass): put-away (forward)
          raises occupied_pallets by the lot's pallet_count and release (compensating) lowers
