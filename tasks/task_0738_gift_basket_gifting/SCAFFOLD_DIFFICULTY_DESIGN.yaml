  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (>= 2 instances, different interval semantics, different resources)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: assembly_station_daily_capacity_aggregate_overlap
        grounds:
          - validations[priority=26]
        distinguishing_aspect: |
          Interval semantics: aggregate SUM-based capacity within a single calendar-day bucket on
          AssemblyStation (no adjacency/buffer geometry — purely a running total of AssemblyTask
          quantities for that station+date across ALL orders) — different from Rule 8's other
          instance, which uses blackout-date adjacency + a transit buffer on a different resource.
        test_recipe:
          setup:
            - "AssemblyStation daily_capacity=15. Order_A (recipient quantity=10) is fully approved against this station on 2026-03-04, consuming 10 of 15 units of that day's capacity."
