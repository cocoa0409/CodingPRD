    instances:
      - name: state_error_beats_safety_error_on_assign
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_REQUEST_NOT_QUEUED]
          - errors[ERR_STAFF_CERTIFICATION_MISMATCH]
        distinguishing_aspect: |
          Category pair (state, business_safety): the request is IN_PROGRESS
          (state violation) AND the target staff lacks ISO_CERT (safety
          violation); the state error ERR_REQUEST_NOT_QUEUED must win because
          priority 5 evaluates before priority 6.
        test_recipe:
          setup:
            - "Unit U, standards, supplies, ISOLATION bed BI, tech T1 (ISO_CERT, clocked in) running request R to IN_PROGRESS"
            - "Tech T2 exists with NO certifications (would fail the safety gate if it were reached)"
