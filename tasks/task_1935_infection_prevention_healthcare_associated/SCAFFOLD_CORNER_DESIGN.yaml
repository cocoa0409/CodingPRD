        as: InfectionPreventionist
        captures:
          case_2: $.data.id
      assert:
      - 'specimen on DOE+13 (2026-08-18): err1 == ERR_REPEAT_INFECTION_TIMEFRAME, HTTP 422 (inclusive boundary)'
      - 'specimen on DOE+14 (2026-08-19): created, HTTP 201, status SUSPECTED'
      - 'different case_type is never blocked: (implicit) only same patient + same case_type rows consult RIT'
