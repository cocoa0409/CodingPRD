        grounds:
          - calculations.plan_risk_point_ledger
          - state_machines.Finding.REPORTED_to_RISK_ACCEPTED
          - state_machines.Finding.RISK_ACCEPTED_to_TRIAGED
          - state_machines.Asset.ELEVATED_to_CLEARED
          - state_machines.Asset.CLEARED_to_ELEVATED
          - entities.TestPlan.fields.total_risk_points
        distinguishing_aspect: |
          Conserved quantity: the TestPlan RISK-POINT ledger, where total_risk_points must always equal
          open + closed + accepted + duplicate. Two RISK_ACCEPT operations move 8 and then 40 points out
          of the open bucket and two REVOKE_RISK_ACCEPTANCE operations move them back, so after the round
