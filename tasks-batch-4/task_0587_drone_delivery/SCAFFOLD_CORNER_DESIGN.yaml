  - section: cross_cutting_layers
    instances:
      - name: occ_stale_order_version_on_redispatch
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[dispatch-stale-order]", "errors[ERR_STALE_ORDER_VERSION]", entities.Order.fields.status]
        distinguishing_aspect: "A client that read Order.version == 1, dispatched (version -> 2) and then aborted (version -> 3) is rejected with 412 ERR_STALE_ORDER_VERSION when it re-dispatches still carrying expected_order_version == 1; re-reading the order and sending version 3 succeeds."
        test_recipe:
          setup: ["Bay + nest N1 (2 pads); drone N101 with a READY 100% pack; Ann's 2000 g order dispatched (Flight PLANNED) and then aborted, so the order is QUOTED again with version 3."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-areas"
              payload: { name: "Bay", center_lat: 37.0, center_lon: -122.0, max_range_km: 12.0, max_payload_g: 2500 }
