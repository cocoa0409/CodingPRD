            - { call: "POST /aog/parts", payload: { part_number: "PN-GT", description: "Harness", rotable: false, list_price_cents: 60000, hazmat_class: "NONE", export_control_code: "EAR9X610", warranty_months: 12 }, as: WarehouseOperator, captures: { part_id: $.data.id } }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${part_id}", serial_number: "SN-GT1", condition: "NEW", trace_doc_level: "FAA_8130", warehouse_code: "WH-BOS" }, as: WarehouseOperator, captures: { unit_id: $.data.id } }
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_id}", aircraft_tail: "N333GT", airport_code: "BOS", part_id: "${part_id}", quantity: 1, condition_acceptable: ["NEW"], min_trace_doc: "FAA_8130", needed_by_utc: "2026-06-01T00:00:00Z" }, as: AogDeskAgent, captures: { aog_id: $.data.id } }
            - { call: "POST /aog/aog-requests/${aog_id}/source-search", payload: {}, as: AogDeskAgent }
            - { call: "POST /aog/quotes", payload: { aog_request_id: "${aog_id}", customer_id: "${cust_id}", lines: [ { part_id: "${part_id}", quantity: 1, sale_type: "OUTRIGHT", unit_price_cents: 60000, discount_pct: 0, condition_required: "NEW" } ], validity_hours: 24, freight_mode: "STANDARD", distance_km: 800, chargeable_weight_kg: 4, destination_country: "GB" }, as: AogDeskAgent, captures: { quote_id: $.data.id } }
            - { call: "POST /aog/quotes/${quote_id}/issue", payload: {}, as: AogDeskAgent, captures: { q_ver: $.data.version } }
            - { call: "POST /aog/quotes/${quote_id}/accept", payload: { expected_quote_version: "${q_ver}" }, as: CustomerContact, as_user_id: "${cust_id}" }
            - { call: "GET /aog/orders", payload: { quote_id: "${quote_id}" }, as: AogDeskAgent, captures: { order_id: "$.data[0].id" } }
            - { call: "GET /aog/order-lines", payload: { order_id: "${order_id}" }, as: AogDeskAgent, captures: { line_id: "$.data[0].id" } }
            - { call: "POST /aog/order-lines/${line_id}/allocate", payload: { unit_id: "${unit_id}" }, as: WarehouseOperator }
            - { call: "POST /aog/shipments", payload: { order_id: "${order_id}", export_license_ref: "EXP-GB-001" }, as: WarehouseOperator, captures: { ship_id: $.data.id } }
          trigger:
            - { call: "POST /aog/shipments/${ship_id}/tender", payload: {}, as: WarehouseOperator, captures: { err1: $.data.error_id } }
            - { call: "POST /aog/orders/${order_id}/compliance-decision", payload: { decision: "EXPORT_HELD", decision_memo: "license review" }, as: ComplianceOfficer }
            - { call: "POST /aog/shipments/${ship_id}/tender", payload: {}, as: WarehouseOperator, captures: { err2: $.data.error_id } }
            - { call: "POST /aog/orders/${order_id}/compliance-decision", payload: { decision: "CLEARED", decision_memo: "license verified" }, as: ComplianceOfficer }
            - { call: "POST /aog/shipments/${ship_id}/tender", payload: {}, as: WarehouseOperator, captures: { st3: $.data.status } }
          assert:
            - "first tender (compliance PENDING_SCREENING): error_id == ERR_COMPLIANCE_NOT_CLEARED, HTTP 409"
            - "second tender (compliance EXPORT_HELD): error_id == ERR_COMPLIANCE_NOT_CLEARED"
            - "third tender (compliance CLEARED): succeeds, Shipment.status == TENDERED (auto IN_TRANSIT acceptable as the terminal read-back)"

      - name: allocate_requires_unit_trace_and_condition
        grounds:
          - state_machines.InventoryUnit.RESERVED_to_ALLOCATED
          - state_machines.InventoryUnit.AVAILABLE_to_ALLOCATED
          - errors[ERR_TRACE_DOC_INSUFFICIENT]
          - errors[ERR_CONDITION_NOT_ACCEPTABLE]
        distinguishing_aspect: |
          Entity pair OrderLine -> InventoryUnit: allocation of a line is gated
          on the TARGET UNIT's condition and trace_doc_level rank relative to
          the originating request — a SERVICEABLE unit fails condition, an
          FAA_8130 unit fails the DUAL_RELEASE trace floor, and only a
          ComplianceOfficer certify-trace upgrade makes allocation succeed.
        test_recipe:
          setup:
            - "Accepted order whose AOG request demands condition OVERHAULED and min_trace_doc DUAL_RELEASE"
            - "Unit U1 SERVICEABLE + DUAL_RELEASE (condition fails only)"
            - "Unit U2 OVERHAULED + FAA_8130 (trace fails only)"
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "TraceAir", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-TR", description: "Rotable igv", rotable: true, list_price_cents: 800000, core_value_cents: 300000, hazmat_class: "NONE", export_control_code: "EAR99", warranty_months: 24 }, as: WarehouseOperator, captures: { part_id: $.data.id } }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${part_id}", serial_number: "SN-T1", condition: "SERVICEABLE", trace_doc_level: "DUAL_RELEASE", warehouse_code: "WH-MIA" }, as: WarehouseOperator, captures: { u1: $.data.id } }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${part_id}", serial_number: "SN-T2", condition: "OVERHAULED", trace_doc_level: "FAA_8130", warehouse_code: "WH-MIA" }, as: WarehouseOperator, captures: { u2: $.data.id } }
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_id}", aircraft_tail: "N444TR", airport_code: "MIA", part_id: "${part_id}", quantity: 1, condition_acceptable: ["OVERHAULED"], min_trace_doc: "DUAL_RELEASE", needed_by_utc: "2026-06-01T00:00:00Z" }, as: AogDeskAgent, captures: { aog_id: $.data.id } }
            - { call: "POST /aog/quotes", payload: { aog_request_id: "${aog_id}", customer_id: "${cust_id}", lines: [ { part_id: "${part_id}", quantity: 1, sale_type: "EXCHANGE", unit_price_cents: 800000, discount_pct: 0, condition_required: "OVERHAULED" } ], validity_hours: 24, freight_mode: "STANDARD", distance_km: 800, chargeable_weight_kg: 4, destination_country: "US" }, as: AogDeskAgent, captures: { quote_id: $.data.id } }
            - { call: "POST /aog/quotes/${quote_id}/issue", payload: {}, as: AogDeskAgent, captures: { q_ver: $.data.version } }
            - { call: "POST /aog/quotes/${quote_id}/accept", payload: { expected_quote_version: "${q_ver}" }, as: CustomerContact, as_user_id: "${cust_id}" }
            - { call: "GET /aog/orders", payload: { quote_id: "${quote_id}" }, as: AogDeskAgent, captures: { order_id: "$.data[0].id" } }
            - { call: "GET /aog/order-lines", payload: { order_id: "${order_id}" }, as: AogDeskAgent, captures: { line_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /aog/order-lines/${line_id}/allocate", payload: { unit_id: "${u1}" }, as: WarehouseOperator, captures: { err1: $.data.error_id } }
            - { call: "POST /aog/order-lines/${line_id}/allocate", payload: { unit_id: "${u2}" }, as: WarehouseOperator, captures: { err2: $.data.error_id } }
            - { call: "POST /aog/inventory-units/${u2}/certify-trace", payload: { trace_doc_level: "DUAL_RELEASE" }, as: ComplianceOfficer }
            - { call: "POST /aog/order-lines/${line_id}/allocate", payload: { unit_id: "${u2}" }, as: WarehouseOperator, captures: { alloc: $.data.allocation_status } }
          assert:
            - "U1 allocate: error_id == ERR_CONDITION_NOT_ACCEPTABLE (422)"
            - "U2 allocate before certification: error_id == ERR_TRACE_DOC_INSUFFICIENT (422)"
            - "U2 allocate after certify-trace to DUAL_RELEASE: allocation_status == ALLOCATED"
            - "InventoryUnit.${u2}.status == ALLOCATED; InventoryUnit.${u1}.status == AVAILABLE (untouched)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: loan_windows_half_open_adjacency
        grounds:
          - errors[ERR_LOAN_WINDOW_OVERLAP]
          - validations[priority=9]
          - entities.LoanAgreement.fields.start_at
        distinguishing_aspect: |
          Interval semantics = half-open [start_at, due_at) on resource
          InventoryUnit: a new loan whose start equals the existing loan's due
          (2026-06-09 == 2026-06-09) is ALLOWED (zero-gap adjacency), while a
          window intersecting the interior is rejected with
          ERR_LOAN_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Customer ACTIVE; rotable unit SN-HO1 with an ACTIVE loan [2026-05-10, 2026-06-09)"
            - "Clock default 2026-05-01"
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "HalfOpen Air", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-HO", description: "Rotable apu", rotable: true, list_price_cents: 900000, core_value_cents: 300000, hazmat_class: "NONE", export_control_code: "EAR99", warranty_months: 12 }, as: WarehouseOperator, captures: { part_id: $.data.id } }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${part_id}", serial_number: "SN-HO1", condition: "OVERHAULED", trace_doc_level: "FAA_8130", warehouse_code: "WH-SEA" }, as: WarehouseOperator, captures: { unit_id: $.data.id } }
            - { call: "POST /aog/loans", payload: { customer_id: "${cust_id}", unit_id: "${unit_id}", loan_type: "LOAN", daily_rate_cents: 10000, start_at: "2026-05-10T00:00:00Z", due_at: "2026-06-09T00:00:00Z" }, as: AogDeskAgent, captures: { loan1: $.data.id } }
          trigger:
            - { call: "POST /aog/loans", payload: { customer_id: "${cust_id}", unit_id: "${unit_id}", loan_type: "LOAN", daily_rate_cents: 10000, start_at: "2026-06-09T00:00:00Z", due_at: "2026-07-09T00:00:00Z" }, as: AogDeskAgent, captures: { loan2: $.data.id, loan2_status: $.data.status } }
            - { call: "POST /aog/loans", payload: { customer_id: "${cust_id}", unit_id: "${unit_id}", loan_type: "LOAN", daily_rate_cents: 10000, start_at: "2026-06-01T00:00:00Z", due_at: "2026-06-20T00:00:00Z" }, as: AogDeskAgent, captures: { err3: $.data.error_id } }
          assert:
            - "adjacent loan [2026-06-09, 2026-07-09) succeeds (201, status ACTIVE) — half-open boundary is exclusive"
            - "interior-overlapping loan [2026-06-01, 2026-06-20) fails: error_id == ERR_LOAN_WINDOW_OVERLAP, HTTP 409"
            - "GET /aog/loans?unit_id=${unit_id} returns exactly 2 rows afterwards"

      - name: charter_bookings_turnaround_buffer
        grounds:
          - errors[ERR_CHARTER_WINDOW_OVERLAP]
          - entities.Shipment.fields.depart_at
          - entities.CharterSlot.fields.status
        distinguishing_aspect: |
          Interval semantics = buffer-expanded on resource CharterSlot (distinct
          resource from InventoryUnit): a booking whose gap to an existing
          booking is 60 minutes (< 120-minute turnaround buffer) is rejected,
          while a gap of exactly 120 minutes is allowed — adjacency with zero
          gap is NOT allowed here, unlike the loan half-open rule.
        test_recipe:
          setup:
            - "Two accepted CHARTER orders (freight_mode CHARTER, distance 2500km) for the same customer; CharterSlot TAIL-N900CX OPEN"
            - "Clock default 2026-05-01"
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "CharterCo", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-CH", description: "Fan blade", rotable: false, list_price_cents: 500000, hazmat_class: "NONE", export_control_code: "EAR99", warranty_months: 12 }, as: WarehouseOperator, captures: { part_id: $.data.id } }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${part_id}", serial_number: "SN-CH1", condition: "NEW", trace_doc_level: "FAA_8130", warehouse_code: "WH-CLT" }, as: WarehouseOperator, captures: { unit1: $.data.id } }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${part_id}", serial_number: "SN-CH2", condition: "NEW", trace_doc_level: "FAA_8130", warehouse_code: "WH-CLT" }, as: WarehouseOperator, captures: { unit2: $.data.id } }
            - { call: "POST /aog/charter-slots", payload: { tail_number: "N900CX", home_base: "CLT" }, as: AogDeskAgent, captures: { slot_id: $.data.id } }
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_id}", aircraft_tail: "N551CH", airport_code: "CLT", part_id: "${part_id}", quantity: 1, condition_acceptable: ["NEW"], min_trace_doc: "FAA_8130", needed_by_utc: "2026-06-01T00:00:00Z" }, as: AogDeskAgent, captures: { aog1: $.data.id } }
            - { call: "POST /aog/quotes", payload: { aog_request_id: "${aog1}", customer_id: "${cust_id}", lines: [ { part_id: "${part_id}", quantity: 1, sale_type: "OUTRIGHT", unit_price_cents: 500000, discount_pct: 0, condition_required: "NEW" } ], validity_hours: 24, freight_mode: "CHARTER", distance_km: 2500, chargeable_weight_kg: 40, destination_country: "US" }, as: AogDeskAgent, captures: { q1: $.data.id } }
            - { call: "POST /aog/quotes/${q1}/issue", payload: {}, as: AogDeskAgent, captures: { q1_v: $.data.version } }
            - { call: "POST /aog/quotes/${q1}/accept", payload: { expected_quote_version: "${q1_v}" }, as: CustomerContact, as_user_id: "${cust_id}" }
            - { call: "GET /aog/orders", payload: { quote_id: "${q1}" }, as: AogDeskAgent, captures: { ord1: "$.data[0].id" } }
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_id}", aircraft_tail: "N552CH", airport_code: "CLT", part_id: "${part_id}", quantity: 1, condition_acceptable: ["NEW"], min_trace_doc: "FAA_8130", needed_by_utc: "2026-06-01T00:00:00Z" }, as: AogDeskAgent, captures: { aog2: $.data.id } }
            - { call: "POST /aog/quotes", payload: { aog_request_id: "${aog2}", customer_id: "${cust_id}", lines: [ { part_id: "${part_id}", quantity: 1, sale_type: "OUTRIGHT", unit_price_cents: 500000, discount_pct: 0, condition_required: "NEW" } ], validity_hours: 24, freight_mode: "CHARTER", distance_km: 2500, chargeable_weight_kg: 40, destination_country: "US" }, as: AogDeskAgent, captures: { q2: $.data.id } }
            - { call: "POST /aog/quotes/${q2}/issue", payload: {}, as: AogDeskAgent, captures: { q2_v: $.data.version } }
            - { call: "POST /aog/quotes/${q2}/accept", payload: { expected_quote_version: "${q2_v}" }, as: CustomerContact, as_user_id: "${cust_id}" }
            - { call: "GET /aog/orders", payload: { quote_id: "${q2}" }, as: AogDeskAgent, captures: { ord2: "$.data[0].id" } }
          trigger:
            - { call: "POST /aog/shipments", payload: { order_id: "${ord1}", depart_at: "2026-05-10T08:00:00Z", arrive_at: "2026-05-10T14:00:00Z", charter_slot_id: "${slot_id}" }, as: WarehouseOperator, captures: { ship1: $.data.id, fc1: $.data.freight_cost_cents } }
            - { call: "POST /aog/shipments", payload: { order_id: "${ord2}", depart_at: "2026-05-10T15:00:00Z", arrive_at: "2026-05-10T20:00:00Z", charter_slot_id: "${slot_id}" }, as: WarehouseOperator, captures: { err_gap: $.data.error_id } }
            - { call: "POST /aog/shipments", payload: { order_id: "${ord2}", depart_at: "2026-05-10T16:00:00Z", arrive_at: "2026-05-10T22:00:00Z", charter_slot_id: "${slot_id}" }, as: WarehouseOperator, captures: { ship2: $.data.id } }
          assert:
            - "booking A [08:00, 14:00] created; freight_cost_cents == 7250000 (charter max(750000, 2900*2500))"
            - "booking B at 15:00 (60-min gap < 120-min buffer): error_id == ERR_CHARTER_WINDOW_OVERLAP, HTTP 409"
            - "booking B retried at 16:00 (exactly 120-min gap): succeeds (buffer check is gap < 120, not <=)"
            - "no shipment row persisted for the rejected attempt (GET /aog/shipments?charter_slot_id= returns 2 rows)"

  - rule_id: compensating_invariant
    instances:
      - name: core_deposit_waterfall_conservation
        grounds:
          - state_machines.CoreReturn.RECEIVED_to_SETTLED
          - calculations.core_return_penalty
          - entities.CoreReturn.fields.core_value_cents
        distinguishing_aspect: |
          Conserved quantity = MONEY (deposit cents): for a SETTLED CoreReturn,
          core_value_cents == refunded_cents + penalty_retained_cents +
          forfeited_cents must hold exactly. The forward deposit debit (500000)
          paired with its compensating split (452500 refund credit + 47500
          retained after a 10000 waiver) leaves zero unaccounted cents.
        test_recipe:
          setup:
            - "Exchange order delivered 2026-05-01 (due 2026-05-22); core received 2026-06-01 (10 days overdue, penalty 57500); 10000 of the penalty waived before inspection"
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "ConserveAir", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-CV", description: "Rotable fcu", rotable: true, list_price_cents: 250000, core_value_cents: 500000, hazmat_class: "NONE", export_control_code: "EAR99", warranty_months: 24 }, as: WarehouseOperator, captures: { part_id: $.data.id } }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${part_id}", serial_number: "SN-CV1", condition: "OVERHAULED", trace_doc_level: "DUAL_RELEASE", warehouse_code: "WH-LAX" }, as: WarehouseOperator, captures: { unit_id: $.data.id } }
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_id}", aircraft_tail: "N661CV", airport_code: "LAX", part_id: "${part_id}", quantity: 1, condition_acceptable: ["OVERHAULED"], min_trace_doc: "FAA_8130", needed_by_utc: "2026-06-01T00:00:00Z" }, as: AogDeskAgent, captures: { aog_id: $.data.id } }
            - { call: "POST /aog/aog-requests/${aog_id}/source-search", payload: {}, as: AogDeskAgent }
            - { call: "POST /aog/quotes", payload: { aog_request_id: "${aog_id}", customer_id: "${cust_id}", lines: [ { part_id: "${part_id}", quantity: 1, sale_type: "EXCHANGE", unit_price_cents: 250000, discount_pct: 0, condition_required: "OVERHAULED" } ], validity_hours: 24, freight_mode: "STANDARD", distance_km: 800, chargeable_weight_kg: 4, destination_country: "US" }, as: AogDeskAgent, captures: { quote_id: $.data.id } }
            - { call: "POST /aog/quotes/${quote_id}/issue", payload: {}, as: AogDeskAgent, captures: { q_ver: $.data.version } }
            - { call: "POST /aog/quotes/${quote_id}/accept", payload: { expected_quote_version: "${q_ver}" }, as: CustomerContact, as_user_id: "${cust_id}" }
            - { call: "GET /aog/orders", payload: { quote_id: "${quote_id}" }, as: AogDeskAgent, captures: { order_id: "$.data[0].id" } }
            - { call: "GET /aog/order-lines", payload: { order_id: "${order_id}" }, as: AogDeskAgent, captures: { line_id: "$.data[0].id" } }
            - { call: "POST /aog/order-lines/${line_id}/allocate", payload: { unit_id: "${unit_id}" }, as: WarehouseOperator }
            - { call: "POST /aog/orders/${order_id}/compliance-decision", payload: { decision: "CLEARED" }, as: ComplianceOfficer }
            - { call: "POST /aog/shipments", payload: { order_id: "${order_id}" }, as: WarehouseOperator, captures: { ship_id: $.data.id } }
            - { call: "POST /aog/shipments/${ship_id}/tender", payload: {}, as: WarehouseOperator }
            - { call: "POST /aog/shipments/${ship_id}/deliver", payload: {}, as: WarehouseOperator }
            - { call: "GET /aog/core-returns", payload: { order_line_id: "${line_id}" }, as: AogDeskAgent, captures: { core_id: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformOps }
            - { call: "POST /aog/core-returns/${core_id}/receive", payload: { core_serial_number: "SN-CVC" }, as: WarehouseOperator }
            - { call: "POST /aog/core-returns/${core_id}/waive-penalty", payload: { amount_cents: 10000 }, as: FinanceController }
          trigger:
            - { call: "POST /aog/core-returns/${core_id}/inspect", payload: { verdict: "ACCEPTED_WITH_PENALTY" }, as: WarehouseOperator, captures: { ref: $.data.refunded_cents, ret: $.data.penalty_retained_cents, forf: $.data.forfeited_cents, st: $.data.status } }
            - { call: "GET /aog/customers/${cust_id}", payload: {}, as: FinanceController, captures: { bal: $.data.outstanding_balance_cents } }
          assert:
            - "CoreReturn.${core_id}.status == SETTLED"
            - "refunded_cents == 452500 and penalty_retained_cents == 47500 and forfeited_cents == 0"
            - "invariant: 452500 + 47500 + 0 == 500000 == core_value_cents"
            - "Customer balance == 312040 (invoice 269770 + freight 4800 + retained penalty 47500; waiver credit 10000 and refund credit 452500 posted against the 500000 deposit debit)"

      - name: allocate_release_unit_count_invariant
        grounds:
          - state_machines.InventoryUnit.AVAILABLE_to_ALLOCATED
          - state_machines.InventoryUnit.ALLOCATED_to_AVAILABLE
          - entities.PartMaster.fields.available_count
        distinguishing_aspect: |
          Conserved quantity = PHYSICAL UNIT COUNT (distinct from money):
          allocate followed by its compensating release must leave
          PartMaster.available_count and reserved_count exactly as before the
          pair, and the order's fulfillment must revert to PENDING_ALLOCATION —
          no unit leaks into or out of the pipeline.
        test_recipe:
          setup:
            - "PartMaster PN-INV with exactly 1 unit SN-IV1 AVAILABLE (available_count 1, reserved_count 0); accepted order with one PENDING line; no source-search reservation involved"
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "InvAir", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-INV", description: "Display unit", rotable: false, list_price_cents: 70000, hazmat_class: "NONE", export_control_code: "EAR99", warranty_months: 12 }, as: WarehouseOperator, captures: { part_id: $.data.id } }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${part_id}", serial_number: "SN-IV1", condition: "NEW", trace_doc_level: "FAA_8130", warehouse_code: "WH-DEN" }, as: WarehouseOperator, captures: { unit_id: $.data.id } }
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_id}", aircraft_tail: "N771IV", airport_code: "DEN", part_id: "${part_id}", quantity: 1, condition_acceptable: ["NEW"], min_trace_doc: "FAA_8130", needed_by_utc: "2026-06-01T00:00:00Z" }, as: AogDeskAgent, captures: { aog_id: $.data.id } }
            - { call: "POST /aog/quotes", payload: { aog_request_id: "${aog_id}", customer_id: "${cust_id}", lines: [ { part_id: "${part_id}", quantity: 1, sale_type: "OUTRIGHT", unit_price_cents: 70000, discount_pct: 0, condition_required: "NEW" } ], validity_hours: 24, freight_mode: "STANDARD", distance_km: 800, chargeable_weight_kg: 4, destination_country: "US" }, as: AogDeskAgent, captures: { quote_id: $.data.id } }
            - { call: "POST /aog/quotes/${quote_id}/issue", payload: {}, as: AogDeskAgent, captures: { q_ver: $.data.version } }
            - { call: "POST /aog/quotes/${quote_id}/accept", payload: { expected_quote_version: "${q_ver}" }, as: CustomerContact, as_user_id: "${cust_id}" }
            - { call: "GET /aog/orders", payload: { quote_id: "${quote_id}" }, as: AogDeskAgent, captures: { order_id: "$.data[0].id" } }
            - { call: "GET /aog/order-lines", payload: { order_id: "${order_id}" }, as: AogDeskAgent, captures: { line_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /aog/order-lines/${line_id}/allocate", payload: { unit_id: "${unit_id}" }, as: WarehouseOperator, captures: { al: $.data.allocation_status } }
            - { call: "GET /aog/parts/${part_id}", payload: {}, as: WarehouseOperator, captures: { ac_mid: $.data.available_count, rc_mid: $.data.reserved_count } }
            - { call: "POST /aog/order-lines/${line_id}/release", payload: {}, as: WarehouseOperator, captures: { rel: $.data.allocation_status } }
            - { call: "GET /aog/parts/${part_id}", payload: {}, as: WarehouseOperator, captures: { ac_end: $.data.available_count, rc_end: $.data.reserved_count } }
            - { call: "GET /aog/orders/${order_id}", payload: {}, as: AogDeskAgent, captures: { ful_end: $.data.fulfillment_status } }
          assert:
            - "after allocate: available_count == 0, reserved_count == 0, line ALLOCATED, unit ALLOCATED"
            - "after release: available_count == 1 and reserved_count == 0 (identical to before the pair)"
            - "invariant: available_count + reserved_count + in-pipeline units == 1 throughout (no unit created or destroyed)"
            - "OrderLine.${line_id}.allocation_status == PENDING, allocated_unit_id == null; SalesOrder.fulfillment_status reverted to PENDING_ALLOCATION"
