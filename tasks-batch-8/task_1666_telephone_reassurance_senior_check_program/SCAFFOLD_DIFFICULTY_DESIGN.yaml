            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /api/programs/${prog_id}/daily-closeout", payload: {}, as: ProgramCoordinator, captures: { lapsed: $.data.lapsed_volunteer_ids } }
            - { call: "GET /api/volunteers/${v_id}/training-records", payload: { module: "SAFETY_PROTOCOL" }, as: ProgramCoordinator, captures: { tr_status: "$.data[0].status" } }
