            - call: "POST /volume-cap-allocations/${alloc_c}/decision"
              payload: { decision: "AWARD", awarded_amount_cents: 100000000, expiry_date: "2027-06-30T00:00:00Z", expected_cap_pool_version: "${pool_v4}" }
              as: HfaAllocationOfficer
