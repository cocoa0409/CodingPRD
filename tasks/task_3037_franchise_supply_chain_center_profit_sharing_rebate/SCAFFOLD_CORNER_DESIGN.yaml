            - call: "POST /supply-centers/${center_id}/stores/${store_s1}/suspend"
              payload: { reason: "test" }
              as: SupplyChainAdmin
          trigger:
            - call: "GET /supply-centers/${center_id}/stores"
              payload: { status: "ACTIVE" }
              as: Any
          assert:
            - "the response returns exactly 2 rows"
            - "all returned stores have status == ACTIVE"

      - name: mark_line_shorted_updates_totals
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/supply-centers/{id}/purchase-orders/{id}/lines/{id}/mark-shorted
        distinguishing_aspect: "Marking a line SHORTED recalculates PO totals and updates capacity plan."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Center ACTIVE. CONFIRMED PO with one line."
          setup_api_calls:
            - *k_clock
            - *k_center
            - call: "POST /supply-centers/${center_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/products"
              payload: { sku: "P", name: "P", category: "DOUGH", base_cost_cents_per_unit: 100 }
              as: SupplyChainAdmin
