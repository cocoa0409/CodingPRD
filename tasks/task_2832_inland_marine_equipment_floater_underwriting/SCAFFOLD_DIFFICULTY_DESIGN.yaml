              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Rig A", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", geo_tracker_installed: false, expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { item_a: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v2: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Rig B", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", geo_tracker_installed: false, expected_policy_version: "${pol_v2}" }
              as: Underwriter
              captures: { item_b: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/equipment-items/${item_a}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/equipment-items/${item_b}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: UnderwritingManager
            - call: "POST /inland-marine/policies/${pol}/claims"
              payload: { coverage_part_id: "${cp}", loss_date: "2026-08-15", loss_type: "COLLISION", equipment_item_id: "${item_a}" }
              as: Underwriter
              captures: { clm_at: $.data.id }
            - call: "POST /inland-marine/claims/${clm_at}/inspect"
              payload: { repair_estimate_cents: 6120000, actual_value_at_loss_cents: 8160000 }
              as: ClaimsAdjuster
