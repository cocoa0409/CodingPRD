              as_user_id: "cm-01"
          assert:
            - "ComplianceFinding.${finding_id}.is_overdue == true"
            - "Facility.${fac_id}.corrective_action_reserve_cents == 5000000"
            - "Facility.${fac_id}.required_assurance_cents == 39250000"
            - "response status == 409 and data.error_id == ERR_CORRECTIVE_ACTION_OVERDUE"
            - "Facility.${fac_id}.permit_status == ACTIVE"
            - "Facility.${fac_id}.renewal_requested_at == null"
            - "After POST /tsdf/compliance-findings/${finding_id}/status with to_status RESPONDED and corrective_action_completed_on 2026-08-11, the renewal returns 200 and permit_status == RENEWAL_PENDING"

      - name: second_storage_unit_with_a_duplicate_unit_code_rejected
