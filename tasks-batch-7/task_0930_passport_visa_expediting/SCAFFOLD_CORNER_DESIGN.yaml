            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: true }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /expediting/consulates"
              payload:
                name: "IN Consulate West"
                destination_country: "IN"
                jurisdiction_region_codes: ["CA", "NV"]
              as: PlatformAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /expediting/consulates/${cons_id}/slots"
              payload: { starts_at: "2026-06-05T10:00:00Z", capacity: 2 }
              as: PlatformAdmin
              captures: { slot_a_id: $.data.id, slot_a_v: $.data.version }
            - call: "POST /expediting/consulates/${cons_id}/slots"
              payload: { starts_at: "2026-06-05T14:00:00Z", capacity: 2 }
              as: PlatformAdmin
              captures: { slot_b_id: $.data.id, slot_b_v: $.data.version }
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-09-01", return_date: "2026-09-20", delivery_region_code: "CA", consulate_id: "${cons_id}" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Filter One", date_of_birth: "1990-03-04", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ap1_id: $.data.id }
            - call: "POST /expediting/orders/${ord_id}/applicants"
              payload: { full_name: "Filter Two", date_of_birth: "1991-04-05", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ap2_id: $.data.id }
            - call: "POST /expediting/appointments"
              payload: { applicant_id: "${ap1_id}", slot_id: "${slot_a_id}", expected_slot_version: "${slot_a_v}" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { appt_a_id: $.data.id }
            - call: "POST /expediting/appointments"
              payload: { applicant_id: "${ap2_id}", slot_id: "${slot_b_id}", expected_slot_version: "${slot_b_v}" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { appt_b_id: $.data.id }
          trigger:
            - call: "GET /expediting/appointments"
              payload: { slot_id: "${slot_a_id}" }
              as: CaseManager
              as_user_id: "cm-quote"
          assert:
            - "the response returns exactly 1 row whose id is ${appt_a_id}"
            - "the response does not contain ${appt_b_id}"
            - "AppointmentSlot.${slot_a_id}.booked_count == 1"
            - "AppointmentSlot.${slot_a_id}.status == OPEN"

  # =====================================================================
  - section: rbac
    instances:

      - name: corner_missing_role_header_returns_unauthenticated
        claim_type: unauthenticated
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role header responds 401 ERR_UNAUTHENTICATED before any existence or payload rung runs, even when the path names a non-existent order."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /expediting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /expediting/orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ""
              captures: { auth_err: $.data.error_id }
          assert:
            - "the trigger responds 401 with error_id ERR_UNAUTHENTICATED"
            - "the trigger does NOT respond with ERR_ORDER_NOT_FOUND"

      - name: corner_traveler_cannot_publish_agency_form_unauthorized
        claim_type: role_denial
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
          - roles.PlatformAdmin.exclusive_operations
        distinguishing_aspect: "Publishing an agency form is exclusive to PlatformAdmin, so the same call as Traveler responds 403 ERR_UNAUTHORIZED and the revision stays DRAFT."
        test_recipe:
          setup:
            - "DS-160 revision 1 registered and still DRAFT."
          setup_api_calls:
            - call: "POST /expediting/agency-forms"
              payload: { form_code: "DS-160", revision: 1, required_field_count: 12 }
              as: PlatformAdmin
              captures: { form_v1_id: $.data.id }
          trigger:
            - call: "POST /expediting/agency-forms/${form_v1_id}/publish"
              payload: {}
              as: Traveler
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { role_err: $.data.error_id }
          assert:
            - "the trigger responds 403 with error_id ERR_UNAUTHORIZED"
            - "AgencyForm.${form_v1_id}.status == DRAFT"
            - "AgencyForm.${form_v1_id}.published_at is null"

      - name: corner_traveler_from_another_order_cannot_pay
        claim_type: ownership_denial
        grounds:
          - validations[priority=5]
          - errors[ERR_NOT_ORDER_MEMBER]
          - roles.Traveler.identity
        distinguishing_aspect: "A Traveler whose X-User-ID is an Applicant on order A responds 403 ERR_NOT_ORDER_MEMBER when paying order B, which carries no applicant with that id."
        test_recipe:
          setup:
            - "Two quoted orders, each with its own applicant."
          setup_api_calls:
