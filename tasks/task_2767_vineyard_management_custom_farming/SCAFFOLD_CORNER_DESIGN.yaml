        distinguishing_aspect: "The logical clock is the only time source: POST /_clock/set_current_utc returns { current_utc } echoing the value set, and observed_at on observations created after each set is exactly 2026-08-01T00:00:00Z and then 2026-08-05T09:30:00Z with no wall-clock drift."
        test_recipe:
          setup:
            - "Vineyard Ridgecrest Ranch with block B-12 (12.5 acres)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { clock_1: $.data.current_utc }
            - call: "POST /vineyards"
              payload: { name: "Ridgecrest Ranch", owner_legal_name: "Ridgecrest Vineyards LLC", ava_region: "Paso Robles", client_contact_email: "ops@ridgecrest.example" }
