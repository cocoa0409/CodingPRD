roles:

  - name: Homeowner
    identity: "entity_backed:Homeowner"
    description: >-
      The customer. Sees only their own agreement and its children, enforced by the
      priority-6 ownership rule. May request roof work, submit and withdraw an end-of-term
      election, and read their own production, credits and savings projection.
    exclusive_operations:
      []
    shared_operations:
      - "POST /_clock/set_current_utc"
