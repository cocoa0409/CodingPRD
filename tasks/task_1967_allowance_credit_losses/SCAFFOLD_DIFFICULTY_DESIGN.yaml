              as: CreditAnalyst
              captures: { ok_status: $.data.status }
          assert:
            - "weight sum 9999 -> error_id == ERR_WEIGHT_SUM_INVALID (${err})"
            - "weight sum exactly 10000 -> 201, ModelRun.status == DRAFT (${ok_status})"

      - name: backtest_variance_strictly_greater
