            - call: "POST /governance/fund-scorecards"
              payload: { review_id: "${review_c6_id}", fund_id: "${fund_lc_a_id}", expected_review_version: "${rv_c6_0}", trailing_return_3y_bps: 900, trailing_return_5y_bps: 850, benchmark_return_3y_bps: 800, benchmark_return_5y_bps: 800, peer_rank_pct: 25.00, style_drift_r2: 0.9200, net_expense_ratio_bps: 45, peer_median_expense_bps: 40, manager_tenure_quarters: 20, manager_change_flag: false }
              as: InvestmentConsultant
