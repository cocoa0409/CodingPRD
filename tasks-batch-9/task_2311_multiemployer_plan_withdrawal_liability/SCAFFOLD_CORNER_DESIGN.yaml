      - name: regenerating_a_schedule_from_a_review_decision_with_nothing_conceded_is_rejected
        claim_type: Cross-entity validation
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_NO_REDUCTION_TO_APPLY]"
          - "entities.PaymentSchedule.fields.source"
