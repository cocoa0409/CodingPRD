  - method: POST
    path: "/mpc/violations/{vid}/record-cure"
    description: "NOTICE_SENT -> CURED; curing on/before the deadline keeps the fine at 0"
    roles: [DesignReviewer]
    code: 200
    input: []
    output: DesignViolation
    side_effects: ["status -> CURED", "cured_at = clock"]
  - method: POST
    path: "/mpc/violations/{vid}/escalate"
    description: "NOTICE_SENT -> ESCALATED (only after the cure deadline passes)"
    roles: [DesignReviewer]
    code: 200
    input: []
    output: DesignViolation
    side_effects: ["status -> ESCALATED"]
  - method: POST
    path: "/mpc/violations/{vid}/schedule-hearing"
    description: "ESCALATED -> HEARING_SCHEDULED"
    roles: [AssociationDirector]
    code: 200
    input: [hearing_date]
    output: DesignViolation
    side_effects: ["status -> HEARING_SCHEDULED"]
  - method: POST
    path: "/mpc/violations/{vid}/levy-fine"
    description: "HEARING_SCHEDULED -> FINED; tiered fine accrual computed and frozen"
    roles: [AssociationDirector]
    code: 200
    input: []
    output: DesignViolation
    side_effects: ["status -> FINED", "fine_cents computed (violation_fine_accrual)", "fined_by_user_id recorded"]
  - method: POST
    path: "/mpc/violations/{vid}/record-payment"
    description: "FINED -> PAID; payment must equal fine_cents exactly"
    roles: [DeclarantController]
    code: 200
    input: [payment_cents]
    output: DesignViolation
    side_effects: ["status -> PAID"]
  - method: POST
    path: "/mpc/violations/{vid}/appeal"
    description: "Respondent appeals a FINED violation within 30 days"
    roles: [HomeownerResident, BuilderRep]
    code: 200
    input: [appeal_reason]
    output: DesignViolation
    side_effects: ["status -> APPEALED"]
  - method: POST
    path: "/mpc/violations/{vid}/resolve-appeal"
    description: "Resolve an appeal (APPEAL_UPHELD -> DISMISSED, APPEAL_DENIED -> FINED with recomputed accrual); resolver != levier"
    roles: [AssociationDirector]
    code: 200
    input: [outcome]
    output: DesignViolation
    side_effects: ["status -> DISMISSED (fine voided) or -> FINED (fine recomputed to resolution date)"]

  # --- CommunityEvent / EventRsvp ---
  - method: POST
    path: "/mpc/events"
    description: "Propose a lifestyle event"
    roles: [LifestyleCoordinator]
    code: 201
    input: [community_id, title, venue, start_at, end_at, capacity, "cost_cents?", "charged_budget_id?"]
    output: CommunityEvent
    side_effects: ["status = PROPOSED", "confirmed_count = 0"]
  - method: GET
    path: "/mpc/events"
    description: "List events, filterable by community or charged budget"
    roles: [DeclarantExecutive, DeclarantController, BuilderRep, AssociationDirector, OwnerDirector, DesignReviewer, LifestyleCoordinator, HomeownerResident, PlatformAdmin]
    code: 200
    input: ["community_id?", "charged_budget_id?", "limit?", "offset?"]
    output: "CommunityEvent[]"
    side_effects: []
  - method: GET
    path: "/mpc/events/{eid}"
    description: "Get one event"
    roles: [DeclarantExecutive, DeclarantController, BuilderRep, AssociationDirector, OwnerDirector, DesignReviewer, LifestyleCoordinator, HomeownerResident, PlatformAdmin]
    code: 200
    input: []
    output: CommunityEvent
    side_effects: []
  - method: POST
    path: "/mpc/events/{eid}/schedule"
    description: "Schedule a PROPOSED event (lead time, venue overlap, amenity-open, event-budget gates)"
    roles: [LifestyleCoordinator]
    code: 200
    input: []
    output: CommunityEvent
    side_effects: ["status -> SCHEDULED"]
  - method: POST
    path: "/mpc/events/{eid}/cancel"
    description: "Cancel a PROPOSED or SCHEDULED event; RSVPs cascade to CANCELLED"
    roles: [LifestyleCoordinator]
    code: 200
    input: []
    output: CommunityEvent
    side_effects: ["status -> CANCELLED", "rsvps -> CANCELLED"]
  - method: POST
    path: "/mpc/rsvps"
    description: "Resident RSVPs to a SCHEDULED event (ERR_INVALID_STATE otherwise); CONFIRMED if the party fits capacity else WAITLISTED. X-User-ID must equal resident_id (ERR_FORBIDDEN_ROLE)"
    roles: [HomeownerResident]
    code: 201
    input: [event_id, resident_id, party_size]
    output: EventRsvp
    side_effects: ["status = CONFIRMED or WAITLISTED", "event.confirmed_count recomputed"]
  - method: GET
    path: "/mpc/rsvps"
    description: "List RSVPs, filterable by event or resident"
    roles: [DeclarantExecutive, DeclarantController, BuilderRep, AssociationDirector, OwnerDirector, DesignReviewer, LifestyleCoordinator, HomeownerResident, PlatformAdmin]
    code: 200
    input: ["event_id?", "resident_id?", "limit?", "offset?"]
    output: "EventRsvp[]"
    side_effects: []
  - method: GET
    path: "/mpc/rsvps/{rid}"
    description: "Get one RSVP"
    roles: [DeclarantExecutive, DeclarantController, BuilderRep, AssociationDirector, OwnerDirector, DesignReviewer, LifestyleCoordinator, HomeownerResident, PlatformAdmin]
    code: 200
    input: []
    output: EventRsvp
    side_effects: []
  - method: POST
    path: "/mpc/rsvps/{rid}/cancel"
    description: "Cancel an RSVP; cancelling a CONFIRMED RSVP runs strict head-of-line waitlist promotion"
    roles: [HomeownerResident, LifestyleCoordinator]
    code: 200
    input: []
    output: EventRsvp
    side_effects: ["status -> CANCELLED", "event.confirmed_count recomputed", "waitlist promotion"]

  # --- SalesCenterAppointment ---
  - method: POST
    path: "/mpc/appointments"
    description: "Book a sales-center tour; at most MAX_CONCURRENT_TOURS (3) BOOKED tours may overlap"
    roles: [LifestyleCoordinator]
    code: 201
    input: [community_id, agent_name, visitor_name, start_at, end_at]
    output: SalesCenterAppointment
    side_effects: ["status = BOOKED"]
  - method: GET
    path: "/mpc/appointments"
    description: "List appointments, optionally by community"
    roles: [DeclarantExecutive, DeclarantController, BuilderRep, AssociationDirector, OwnerDirector, DesignReviewer, LifestyleCoordinator, HomeownerResident, PlatformAdmin]
    code: 200
    input: ["community_id?", "limit?", "offset?"]
    output: "SalesCenterAppointment[]"
    side_effects: []
  - method: GET
    path: "/mpc/appointments/{aid}"
    description: "Get one appointment"
    roles: [DeclarantExecutive, DeclarantController, BuilderRep, AssociationDirector, OwnerDirector, DesignReviewer, LifestyleCoordinator, HomeownerResident, PlatformAdmin]
    code: 200
    input: []
    output: SalesCenterAppointment
    side_effects: []
  - method: POST
    path: "/mpc/appointments/{aid}/cancel"
    description: "BOOKED -> CANCELLED"
    roles: [LifestyleCoordinator]
    code: 200
    input: []
    output: SalesCenterAppointment
    side_effects: ["status -> CANCELLED"]
  - method: POST
    path: "/mpc/appointments/{aid}/complete"
    description: "BOOKED -> COMPLETED"
    roles: [LifestyleCoordinator]
    code: 200
    input: []
    output: SalesCenterAppointment
    side_effects: ["status -> COMPLETED"]

  # --- Resident ---
  - method: POST
    path: "/mpc/residents"
    description: "Register a prospect resident"
    roles: [LifestyleCoordinator]
    code: 201
    input: [community_id, full_name, email]
    output: Resident
    side_effects: ["status = PROSPECT"]
  - method: GET
    path: "/mpc/residents"
    description: "List residents, filterable by community or lot"
    roles: [DeclarantExecutive, DeclarantController, BuilderRep, AssociationDirector, OwnerDirector, DesignReviewer, LifestyleCoordinator, HomeownerResident, PlatformAdmin]
    code: 200
    input: ["community_id?", "lot_id?", "limit?", "offset?"]
    output: "Resident[]"
    side_effects: []
  - method: GET
    path: "/mpc/residents/{rid}"
    description: "Get one resident"
    roles: [DeclarantExecutive, DeclarantController, BuilderRep, AssociationDirector, OwnerDirector, DesignReviewer, LifestyleCoordinator, HomeownerResident, PlatformAdmin]
    code: 200
    input: []
    output: Resident
    side_effects: []
  - method: POST
    path: "/mpc/residents/{rid}/record-purchase"
    description: "Link a prospect to their homesite (PROSPECT -> PURCHASER)"
    roles: [LifestyleCoordinator]
    code: 200
    input: [lot_id]
    output: Resident
    side_effects: ["status -> PURCHASER", "lot_id recorded"]
  - method: POST
    path: "/mpc/residents/{rid}/archive"
    description: "Archive a resident (-> FORMER)"
    roles: [LifestyleCoordinator]
    code: 200
    input: []
    output: Resident
    side_effects: ["status -> FORMER"]

  # --- ResidentNotice ---
  - method: POST
    path: "/mpc/notices"
    description: "Draft a resident notice (typed links to budget / assessment rate)"
    roles: [LifestyleCoordinator]
    code: 201
    input: [community_id, notice_type, subject, body, send_at, "effective_date?", "budget_id?", "assessment_rate_id?"]
    output: ResidentNotice
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/mpc/notices"
    description: "List notices, filterable by community, budget, rate, or superseded predecessor"
    roles: [DeclarantExecutive, DeclarantController, BuilderRep, AssociationDirector, OwnerDirector, DesignReviewer, LifestyleCoordinator, HomeownerResident, PlatformAdmin]
    code: 200
    input: ["community_id?", "budget_id?", "assessment_rate_id?", "supersedes_notice_id?", "limit?", "offset?"]
    output: "ResidentNotice[]"
    side_effects: []
  - method: GET
    path: "/mpc/notices/{nid}"
    description: "Get one notice"
    roles: [DeclarantExecutive, DeclarantController, BuilderRep, AssociationDirector, OwnerDirector, DesignReviewer, LifestyleCoordinator, HomeownerResident, PlatformAdmin]
    code: 200
    input: []
    output: ResidentNotice
    side_effects: []
  - method: POST
    path: "/mpc/notices/{nid}/schedule"
    description: "Schedule a DRAFT notice (send_at must be in the future; typed-link requirements)"
    roles: [LifestyleCoordinator]
    code: 200
    input: []
    output: ResidentNotice
    side_effects: ["status -> SCHEDULED"]
  - method: POST
    path: "/mpc/notices/{nid}/cancel"
    description: "Cancel a DRAFT or SCHEDULED notice"
    roles: [LifestyleCoordinator]
    code: 200
    input: []
    output: ResidentNotice
    side_effects: ["status -> CANCELLED"]
  - method: POST
    path: "/mpc/notices/{nid}/supersede"
    description: "Issue a corrected notice; the old notice becomes SUPERSEDED and stops satisfying gating even if SENT"
    roles: [LifestyleCoordinator]
    code: 201
    input: [subject, body, send_at, "effective_date?"]
    output: ResidentNotice
    side_effects: ["old notice -> SUPERSEDED", "new DRAFT notice created with supersedes_notice_id = old id, same notice_type/budget_id/assessment_rate_id"]

  # --- BoardSeat ---
  - method: GET
    path: "/mpc/board-seats"
    description: "List board seats, filterable by community or holder resident; ordered by seat_no ASC"
    roles: [DeclarantExecutive, DeclarantController, BuilderRep, AssociationDirector, OwnerDirector, DesignReviewer, LifestyleCoordinator, HomeownerResident, PlatformAdmin]
    code: 200
    input: ["community_id?", "holder_resident_id?", "limit?", "offset?"]
    output: "BoardSeat[]"
    side_effects: []
  - method: GET
    path: "/mpc/board-seats/{sid}"
    description: "Get one board seat"
    roles: [DeclarantExecutive, DeclarantController, BuilderRep, AssociationDirector, OwnerDirector, DesignReviewer, LifestyleCoordinator, HomeownerResident, PlatformAdmin]
    code: 200
    input: []
    output: BoardSeat
    side_effects: []
  - method: POST
    path: "/mpc/board-seats/{sid}/call-election"
    description: "Call an election for a VACANT (or LAPSED) OWNER_ELECTED seat; snapshots eligible voters"
    roles: [AssociationDirector]
    code: 200
    input: []
    output: BoardSeat
    side_effects: ["status -> ELECTION_CALLED", "eligible_voter_count snapshot", "election_deadline = clock + 30 days"]
  - method: POST
    path: "/mpc/board-seats/{sid}/certify-election"
    description: "Certify election results (quorum >= 20% of eligible, strict majority, eligible holder, within window)"
    roles: [AssociationDirector]
    code: 200
    input: [votes_cast, votes_for, holder_resident_id]
    output: BoardSeat
    side_effects: ["status -> FILLED", "holder recorded"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role missing/unknown or X-User-ID missing" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role is not in the endpoint's roles list; also fired when an entity-backed actor operates on another principal's resource (e.g., a BuilderRep curing another builder's tranche)" }
  # --- Request shape ---
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, wrong type, invalid enum member, undeclared field, malformed datetime, or violated scalar constraint (e.g., end_at <= start_at)" }
  # --- Not found (per resource, path left-to-right then body FKs) ---
  - { id: ERR_COMMUNITY_NOT_FOUND, http: 404, condition: "community id does not exist" }
  - { id: ERR_PHASE_NOT_FOUND, http: 404, condition: "phase id does not exist" }
  - { id: ERR_AMENITY_NOT_FOUND, http: 404, condition: "amenity id does not exist" }
  - { id: ERR_BUILDER_NOT_FOUND, http: 404, condition: "builder id does not exist" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "agreement id does not exist" }
  - { id: ERR_TRANCHE_NOT_FOUND, http: 404, condition: "tranche id does not exist" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "lot id does not exist" }
  - { id: ERR_CLOSING_NOT_FOUND, http: 404, condition: "closing id does not exist" }
  - { id: ERR_BUDGET_NOT_FOUND, http: 404, condition: "budget id does not exist" }
  - { id: ERR_LINE_ITEM_NOT_FOUND, http: 404, condition: "line item id does not exist" }
  - { id: ERR_RATE_NOT_FOUND, http: 404, condition: "assessment rate id does not exist" }
  - { id: ERR_DISTRICT_NOT_FOUND, http: 404, condition: "district id does not exist" }
  - { id: ERR_ADVANCE_NOT_FOUND, http: 404, condition: "advance id does not exist" }
  - { id: ERR_LEVY_NOT_FOUND, http: 404, condition: "levy id does not exist" }
  - { id: ERR_PAYMENT_NOT_FOUND, http: 404, condition: "payment id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "design review application id does not exist" }
  - { id: ERR_VIOLATION_NOT_FOUND, http: 404, condition: "violation id does not exist" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "event id does not exist" }
  - { id: ERR_RSVP_NOT_FOUND, http: 404, condition: "rsvp id does not exist" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "appointment id does not exist" }
  - { id: ERR_RESIDENT_NOT_FOUND, http: 404, condition: "resident id does not exist" }
  - { id: ERR_NOTICE_NOT_FOUND, http: 404, condition: "notice id does not exist" }
  - { id: ERR_BOARD_SEAT_NOT_FOUND, http: 404, condition: "board seat id does not exist" }
  # --- State ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity is not in a valid from-state for the requested transition (incl. terminal-state lockdown and double transitions)" }
  - { id: ERR_COMMUNITY_NOT_ACTIVE, http: 409, condition: "Operation requires the community to be ACTIVE (phases open-sales, agreement execute)" }
  - { id: ERR_PHASE_NOT_OPEN_FOR_SALES, http: 409, condition: "Phase must be SALES_OPEN or DELIVERING (agreement execute, lot offer)" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Agreement must be ACTIVE to create or close a LotClosing" }
  - { id: ERR_LOT_NOT_OFFERED, http: 409, condition: "Lot must be OFFERED to open a closing escrow" }
  - { id: ERR_LOT_NOT_UNDER_CONTRACT, http: 409, condition: "Lot must be UNDER_CONTRACT (close) or in {UNDER_CONTRACT, CLOSED} (resident record-purchase)" }
  - { id: ERR_BUILDER_NOT_IN_GOOD_STANDING, http: 409, condition: "Builder standing must be GOOD_STANDING to execute a new agreement" }
  - { id: ERR_OUTSTANDING_COMPLIANCE_DEFAULTS, http: 409, condition: "Builder cannot be reinstated while tranches are MISSED/DEFAULTED or an agreement is DEFAULTED" }
  - { id: ERR_CLOSEOUT_BLOCKED, http: 409, condition: "Phase close-out/cancel blocked: lots not terminal, agreements not terminal, or closings exist" }
  - { id: ERR_CLOSINGS_PENDING, http: 409, condition: "Agreement cannot terminate while a LotClosing is PENDING" }
  - { id: ERR_BUDGET_EMPTY, http: 409, condition: "Budget cannot be proposed without at least one line item" }
  - { id: ERR_BUDGET_NOT_ADOPTED, http: 409, condition: "Assessment rate creation requires the referenced budget to be ADOPTED" }
  - { id: ERR_NOTICE_NOT_SENT, http: 409, condition: "No qualifying SENT (non-SUPERSEDED) notice exists for this budget adoption / rate arm" }
  - { id: ERR_TRANCHE_NOT_CURABLE, http: 409, condition: "Tranche is not MISSED, or the cure deadline has passed" }
  - { id: ERR_CURE_WINDOW_OPEN, http: 409, condition: "Escalation/certification attempted while the cure window is still open (now <= cure_deadline)" }
  - { id: ERR_SEAT_NOT_VACANT, http: 409, condition: "call-election requires a VACANT or LAPSED OWNER_ELECTED seat" }
  - { id: ERR_REVIEW_ROUNDS_EXHAUSTED, http: 409, condition: "Resubmission beyond MAX_REVIEW_ROUNDS (3)" }
  - { id: ERR_DECLARANT_AUTHORITY_ENDED, http: 409, condition: "Declarant-side governance power used after TURNOVER_COMPLETE (or board waive post-turnover)" }
  - { id: ERR_SUBSIDY_NOT_AVAILABLE, http: 409, condition: "Declarant subsidy election requires transition_stage == DECLARANT_CONTROL" }
  - { id: ERR_NO_PRIOR_RATE, http: 409, condition: "Subsidy election requires an EFFECTIVE prior-year rate to freeze against" }
  - { id: ERR_TRANSITION_THRESHOLD_NOT_MET, http: 409, condition: "record-turnover requires closed_unit_pct >= 100.00" }
  - { id: ERR_TURNOVER_SEATS_NOT_FILLED, http: 409, condition: "record-turnover requires all 5 seats OWNER_ELECTED and FILLED" }
  # --- Concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC on amendments)" }
  # --- Business safety ---
  - { id: ERR_AMENITY_NOT_OPEN, http: 409, condition: "Event scheduling at CLUBHOUSE/POOL_DECK/EVENT_LAWN requires the mapped amenity in {UNDER_CONSTRUCTION, OPEN}" }
  # --- Business temporal ---
  - { id: ERR_EVENT_LEAD_TIME, http: 422, condition: "Event start_at is before logical clock + EVENT_LEAD_DAYS (14 days)" }
  - { id: ERR_NOTICE_LEAD_TIME, http: 422, condition: "Qualifying notice exists but was SENT inside the statutory lead window (14d budget / 30d assessment)" }
  - { id: ERR_RESCISSION_WINDOW_EXPIRED, http: 422, condition: "Rescind attempted more than RESCISSION_WINDOW_DAYS (30) after closing_date" }
  - { id: ERR_APPEAL_WINDOW_EXPIRED, http: 422, condition: "Appeal attempted more than APPEAL_WINDOW_DAYS (30) after the fine was levied" }
  - { id: ERR_SEND_AT_IN_PAST, http: 422, condition: "send_at / hearing_date is not strictly after the logical clock" }
  # --- Business constraint ---
  - { id: ERR_PHASE_SEQUENCE_BLOCKED, http: 409, condition: "Phase sequence_no already used in the community, or the predecessor phase is not yet DELIVERING/CLOSED_OUT" }
  - { id: ERR_DUPLICATE_FISCAL_YEAR, http: 409, condition: "A non-SUPERSEDED budget already exists for this community and fiscal year" }
  - { id: ERR_DUPLICATE_ASSESSMENT_YEAR, http: 409, condition: "A non-SUPERSEDED assessment rate already exists for this community and fiscal year" }
  - { id: ERR_DUPLICATE_DISTRICT, http: 409, condition: "The community already has a reimbursement district" }
  - { id: ERR_DUPLICATE_TRANCHE_NO, http: 409, condition: "tranche_no already used within this agreement" }
  - { id: ERR_VENUE_OVERLAP, http: 409, condition: "Another SCHEDULED event occupies the venue over a half-open overlapping interval" }
  - { id: ERR_TOUR_CAPACITY_REACHED, http: 409, condition: "A fourth overlapping BOOKED sales-center appointment would exceed MAX_CONCURRENT_TOURS (3)" }
  - { id: ERR_REVIEWER_CONFLICT, http: 403, condition: "Reviewer is the applicant, was the latest denier, or a decision is attempted by someone other than reviewer_user_id" }
  - { id: ERR_ADOPTER_CANNOT_RATIFY, http: 403, condition: "The budget adopter may not also ratify (segregation of duties)" }
  - { id: ERR_HEARING_OFFICER_CONFLICT, http: 403, condition: "The director who levied the fine may not resolve its appeal (segregation of duties)" }
  - { id: ERR_QUORUM_NOT_MET, http: 409, condition: "votes_cast below ceil(eligible_voter_count * 20 / 100)" }
  - { id: ERR_ELECTION_MAJORITY_NOT_REACHED, http: 409, condition: "votes_for not strictly greater than votes_cast / 2" }
  # --- Business referential ---
  - { id: ERR_LOT_PHASE_MISMATCH, http: 422, condition: "The closing's lot does not belong to the agreement's phase" }
  - { id: ERR_APPLICANT_IDENTITY_INVALID, http: 422, condition: "Design application must carry exactly one of applicant_builder_id / applicant_resident_id" }
  - { id: ERR_RESPONDENT_IDENTITY_INVALID, http: 422, condition: "Violation must carry exactly one of respondent_resident_id / respondent_builder_id" }
  - { id: ERR_FISCAL_YEAR_MISMATCH, http: 422, condition: "Assessment rate fiscal_year differs from its budget's fiscal_year" }
  - { id: ERR_RESIDENT_COMMUNITY_MISMATCH, http: 422, condition: "Referenced lot or entity belongs to a different community than the resident" }
  - { id: ERR_TRANCHE_COVERAGE_MISMATCH, http: 422, condition: "Tranche lot_count_due total does not equal total_lots_committed (execute) or total_lots_committed - lots_closed_count (amendment)" }
  - { id: ERR_HOLDER_NOT_ELIGIBLE, http: 422, condition: "Election holder is not an OWNER resident of the community or already holds a seat" }
  # --- Business fiscal ---
  - { id: ERR_INSUFFICIENT_DISTRICT_FUNDS, http: 402, condition: "district.available_funds_cents < payment amount_cents at pay time" }
  - { id: ERR_PAYMENT_EXCEEDS_OBLIGATION, http: 402, condition: "Payment amount exceeds outstanding principal plus certified interest, or is below the interest due" }
  - { id: ERR_ASSESSMENT_CAP_EXCEEDED, http: 422, condition: "increase_pct > 20.00 without the required override approval (and ratification at PARITY/OWNER_MAJORITY)" }
  - { id: ERR_EVENT_BUDGET_EXCEEDED, http: 402, condition: "Event cost exceeds the remaining EVENTS_PROGRAMMING line on the charged ADOPTED budget (missing line => 0 remaining)" }
  - { id: ERR_PENALTY_AMOUNT_MISMATCH, http: 402, condition: "Cure/fine payment_cents does not equal the computed accrued_penalty_cents / fine_cents exactly" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DeclarantExecutive
    description: "Developer principal: community/phase/amenity lifecycle, agreement execution and termination, default certification, lot offering, rescission, turnover"
    identity: opaque
    exclusive_operations:
      - "POST /mpc/communities, POST /mpc/communities/{cid}/activate, POST /mpc/communities/{cid}/record-turnover"
      - "POST /mpc/phases, POST /mpc/phases/{pid}/open-sales, POST /mpc/phases/{pid}/close-out, POST /mpc/phases/{pid}/cancel"
      - "POST /mpc/amenities, POST /mpc/amenities/{aid}/start-design|start-construction|open"
      - "POST /mpc/builders, POST /mpc/builders/{bid}/reinstate"
      - "POST /mpc/agreements/{aid}/execute, POST /mpc/agreements/{aid}/terminate"
      - "POST /mpc/tranches/{tid}/certify-default"
      - "POST /mpc/lots, POST /mpc/lots/{lid}/offer, POST /mpc/lots/{lid}/withdraw"
      - "POST /mpc/closings/{clid}/rescind"
    shared_operations:
      - "All GET endpoints"

  - name: DeclarantController
    description: "Developer finance officer: agreements/tranches drafting, closings, budgets, assessment rates, district accounting"
    identity: opaque
    exclusive_operations:
      - "POST /mpc/agreements, POST /mpc/agreements/{aid}/commence, POST /mpc/agreements/{aid}/amendments"
      - "POST /mpc/tranches, POST /mpc/closings, POST /mpc/closings/{clid}/close, POST /mpc/closings/{clid}/cancel"
      - "POST /mpc/budgets, POST /mpc/line-items, POST /mpc/budgets/{bid}/propose|revise|amendments"
      - "POST /mpc/assessment-rates, POST /mpc/assessment-rates/{rid}/arm (shared with OwnerDirector post-turnover)"
      - "POST /mpc/districts, /mpc/advances, /mpc/levies, POST /mpc/levies/{lid}/collect, POST /mpc/payments, POST /mpc/payments/{pid}/pay"
      - "POST /mpc/violations/{vid}/record-payment"
    shared_operations:
      - "All GET endpoints"

  - name: BuilderRep
    description: "Merchant builder representative; acts as its Builder entity (X-User-ID == Builder.id)"
    identity: "entity_backed:Builder"
    exclusive_operations:
      - "POST /mpc/tranches/{tid}/cure (own agreements' tranches only)"
      - "POST /mpc/applications (as applicant_builder_id), POST /mpc/applications/{aid}/resubmit|withdraw (own applications)"
    shared_operations:
      - "POST /mpc/applications/{aid}/record-construction-start (own applications)"
      - "POST /mpc/violations/{vid}/appeal (as respondent builder)"
      - "All GET endpoints"

  - name: AssociationDirector
    description: "Association board director (declarant-appointed pre-turnover): budget adoption, cap overrides, tranche waivers, payment certification, hearings, elections"
    identity: opaque
    exclusive_operations:
      - "POST /mpc/budgets/{bid}/adopt|reject (pre-turnover; adopt shared with OwnerDirector post-turnover)"
      - "POST /mpc/tranches/{tid}/waive"
      - "POST /mpc/payments/{pid}/certify, POST /mpc/payments/{pid}/reject (never the requester of the same payment)"
      - "POST /mpc/violations (also DesignReviewer), POST /mpc/violations/{vid}/schedule-hearing|levy-fine|resolve-appeal"
      - "POST /mpc/assessment-rates/{rid}/approve-cap-override (shared with OwnerDirector post-turnover)"
      - "POST /mpc/board-seats/{sid}/call-election|certify-election"
    shared_operations:
      - "All GET endpoints"

  - name: OwnerDirector
    description: "Owner-elected board director; identity is a Resident who holds a FILLED OWNER_ELECTED seat (X-User-ID == Resident.id)"
    identity: "entity_backed:Resident"
    exclusive_operations:
      - "POST /mpc/budgets/{bid}/ratify"
      - "POST /mpc/assessment-rates/{rid}/ratify-cap-override"
    shared_operations:
      - "POST /mpc/budgets/{bid}/adopt (post-turnover)"
      - "POST /mpc/assessment-rates/{rid}/approve-cap-override (post-turnover), POST /mpc/assessment-rates/{rid}/arm (post-turnover)"
      - "All GET endpoints"

  - name: DesignReviewer
    description: "Architectural review committee member: design review decisions, violation intake and cure tracking"
    identity: opaque
    exclusive_operations:
      - "POST /mpc/applications/{aid}/begin-review|approve|approve-with-conditions|deny|verify-conditions"
      - "POST /mpc/violations/{vid}/send-notice|record-cure|escalate"
    shared_operations:
      - "POST /mpc/violations (also AssociationDirector)"
      - "All GET endpoints"

  - name: LifestyleCoordinator
    description: "Marketing/lifestyle staff: events, RSVPs management, sales-center appointments, resident registration, notices"
    identity: opaque
    exclusive_operations:
      - "POST /mpc/events, POST /mpc/events/{eid}/schedule|cancel"
      - "POST /mpc/appointments, POST /mpc/appointments/{aid}/cancel|complete"
      - "POST /mpc/residents, POST /mpc/residents/{rid}/record-purchase|archive"
      - "POST /mpc/notices, POST /mpc/notices/{nid}/schedule|cancel|supersede"
    shared_operations:
      - "POST /mpc/rsvps/{rid}/cancel (also the booking resident)"
      - "All GET endpoints"

  - name: HomeownerResident
    description: "Resident of the community (X-User-ID == Resident.id): RSVPs, own design applications, violation appeals"
    identity: "entity_backed:Resident"
    exclusive_operations:
      - "POST /mpc/rsvps (as resident_id)"
    shared_operations:
      - "POST /mpc/applications (as applicant_resident_id), POST /mpc/applications/{aid}/resubmit|withdraw|record-construction-start (own applications)"
      - "POST /mpc/violations/{vid}/appeal (as respondent resident)"
      - "POST /mpc/rsvps/{rid}/cancel (own rsvps)"
      - "All GET endpoints"

  - name: PlatformAdmin
    description: "Platform operator; drives the logical clock only"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
