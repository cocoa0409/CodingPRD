# =============================================================================
# SCAFFOLD — task_2428 · Recreational Tennis League & Rating Administration
# Sections: §1.0 Response Envelope · §1.1 Entities · §1.2 State Machines ·
#           §1.2.1 Concurrency Rules · §1.3 Calculations · §1.4 Validations ·
#           §1.5 Endpoints · §1.6 Errors · §1.7 RBAC
# Difficulty target: harder than Expert (§0.4) — 12 entities, 62 endpoints,
#           9 state machines over 8 entities (Match carries two independent
#           status dimensions; 4 revision cycles), 2 OCC rules, 10 calculations,
#           70 priority-ordered validations, 71 error codes, 6 roles.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2428. Recreational Tennis League & Rating Administration (community tennis league program): league structure across levels, age groups and formats with local, district and section progression, player rating assignment through self-rating, computer rating and appeal processes, roster eligibility rules including minimum matches played and strike systems for rating violations, team registration, captain responsibilities and match scheduling with court availability, match reporting, default rules and scorecard verification, playoff advancement with tiebreaker rules across sets, games and head-to-head, grievance and rating appeal process with committee review, year-end rating recalculation and its effect on team composition

domain_name: recreational-tennis-league
api_prefix: /tennis

# -----------------------------------------------------------------------------
# §0 Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  difficulty_target: "expert+ — deeper than the Expert tier of §0.4 (density first: every entity participates in at least one cross-entity gate or cascade)"
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation      # in-season vs year-end rating; provisional vs official standings
    - cascading_side_effects        # strike -> suspension -> roster -> team compliance
    - rate_threshold_triggers       # weighted strike limit, minimum matches played, rating-gap thresholds
    - optimistic_concurrency        # OCC on Team.version and Match.version

  entity_topology: graph
  # League.parent_league_id is self-referential (LOCAL -> DISTRICT -> SECTION
  # progression); Team<->Player is many-to-many through RosterSpot; Match points
  # at two Teams; Team.advanced_from_team_id is self-referential across tiers.

  state_machine_shape: parallel
  # Match carries two independent status dimensions (schedule_status and
  # result_status) that advance on different triggers; Scorecard, RosterSpot and
  # Match.result_status additionally contain revision cycles; Grievance and
  # RatingAppeal fork into outcome branches with divergent side-effect sets.

  relationship_patterns:
    - one_to_many
    - many_to_many          # Team <-> Player via RosterSpot
    - self_referential      # League.parent_league_id, Team.advanced_from_team_id
    - polymorphic           # CommitteeVote.subject_id (RatingAppeal | Grievance)
    - cross_aggregate       # Section rating period gates RosterSpot / RatingAppeal writes

  role_model: segregation_of_duties
  # A captain may not verify the scorecard they submitted; a committee member may
  # not vote on a subject involving a team they are rostered on nor on their own
  # rating appeal; a chair may not decide a subject on which they cast a vote.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------- Section ---
  - name: Section
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Section code such as SOCAL-2026", constraints: "unique across sections; 3-32 chars" }
      - { name: name, type: string, source: input, description: "Human readable section name" }
      - { name: season_year, type: integer, source: input, description: "Playing year this section administers", constraints: "2000..2100" }
      - { name: rating_period_status, type: enum, source: system, default: "OPEN_SEASON", description: "Rating epoch posture that gates rating writes and roster edits section-wide", constraints: "OPEN_SEASON | RECALC_IN_PROGRESS | RECALC_PUBLISHED" }
      - { name: recalc_run_index, type: integer, source: system, default: 0, description: "Monotone counter incremented once per published year-end recalculation" }
      - { name: min_matches_for_playoff_eligibility, type: integer, source: input, default: 3, description: "Minimum verified team matches a roster spot needs to count as playoff eligible", constraints: ">= 1" }
      - { name: strike_limit, type: integer, source: input, default: 3, description: "Weighted strike total at which a player is suspended", constraints: ">= 1" }
      - { name: disqualification_strike_limit, type: integer, source: input, default: 6, description: "Weighted strike total at which a player is disqualified for the season", constraints: "> strike_limit" }
      - { name: scorecard_submission_window_hours, type: integer, source: input, default: 48, description: "Hours after scheduled match end within which a scorecard may be submitted" }
      - { name: scorecard_dispute_window_hours, type: integer, source: input, default: 24, description: "Hours after scorecard submission within which the opposing captain may dispute" }
      - { name: grievance_window_hours, type: integer, source: input, default: 72, description: "Hours after match result verification within which a grievance may be filed" }
      - { name: recalculated_player_count, type: integer, source: computed, default: 0, description: "Players whose proposed level was written by the most recent year-end recalculation run" }
      - { name: published_level_change_count, type: integer, source: computed, default: 0, description: "Players whose rating_level actually changed at the most recent publish-recalc" }

  # ----------------------------------------------------------------- League ---
  - name: League
    parent: Section
    common_fields: true
    fields:
      - { name: section_id, type: string, source: input, description: "FK -> Section.id; owning section" }
      - { name: parent_league_id, type: string, source: input, default: null, description: "FK -> League.id; next tier up in the progression ladder. null iff tier == SECTION. MUST reference a league in the same section with the same ntrp_level, age_group and format and tier exactly one step above (LOCAL -> DISTRICT -> SECTION)" }
      - { name: tier, type: enum, source: input, description: "Position in the progression ladder", constraints: "LOCAL | DISTRICT | SECTION" }
      - { name: ntrp_level, type: number, source: input, description: "NTRP level band of the league", constraints: "one of 2.5, 3.0, 3.5, 4.0, 4.5, 5.0" }
      - { name: age_group, type: enum, source: input, description: "Minimum-age bracket", constraints: "AGE_18_OVER | AGE_40_OVER | AGE_55_OVER" }
      - { name: format, type: enum, source: input, description: "Line composition rule for every match", constraints: "MENS_DOUBLES | WOMENS_DOUBLES | MIXED_DOUBLES" }
      - { name: lines_per_match, type: integer, source: input, default: 3, description: "Doubles lines contested in one team match", constraints: "odd integer 3..5" }
      - { name: min_active_roster_size, type: integer, source: input, default: 8, description: "ACTIVE roster spots a team needs to be roster_compliant" }
      - { name: max_roster_size, type: integer, source: input, default: 14, description: "Maximum roster spots in status PENDING or ACTIVE on one team" }
      - { name: min_playoff_eligible_players, type: integer, source: input, default: 6, description: "Playoff-eligible roster spots a team needs to enter the seeding candidate set" }
      - { name: max_teams, type: integer, source: input, default: 8, description: "Registration quota — teams in status REGISTERED, ROSTER_LOCKED, IN_PLAY, ELIMINATED or ADVANCED" }
      - { name: advancement_slots, type: integer, source: input, default: 1, description: "Teams promoted into parent_league_id by advance-teams" }
      - { name: match_duration_minutes, type: integer, source: input, default: 180, description: "Nominal court occupancy of one team match, excluding facility turnaround buffer" }
      - { name: allow_same_day_doubleheader, type: boolean, source: input, default: false, description: "Feature flag switching the Team calendar-conflict rule from same-UTC-date exclusion to a 240-minute start-to-start separation rule" }
      - { name: registration_opens_at, type: datetime, source: input, description: "Registration window open instant (ISO 8601 UTC)" }
      - { name: registration_closes_at, type: datetime, source: input, description: "Registration window close instant; must be > registration_opens_at" }
      - { name: roster_lock_at, type: datetime, source: input, description: "Instant from which rosters may be locked; must be >= registration_closes_at" }
      - { name: season_end_at, type: datetime, source: input, description: "Last instant a regular-season match may be scheduled to start; must be > roster_lock_at" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "League lifecycle stage", constraints: "DRAFT | REGISTRATION_OPEN | ROSTERS_LOCKED | IN_PLAY | PLAYOFFS | COMPLETED | CANCELLED" }
      - { name: registered_team_count, type: integer, source: computed, default: 0, description: "COUNT(Team WHERE league_id = this.id AND status IN {REGISTERED, ROSTER_LOCKED, IN_PLAY, ELIMINATED, ADVANCED})" }
      - { name: noncompliant_team_count, type: integer, source: computed, default: 0, description: "COUNT(Team WHERE league_id = this.id AND status IN {ROSTER_LOCKED, IN_PLAY} AND roster_compliant == false)" }
      - { name: finalized_match_count, type: integer, source: computed, default: 0, description: "COUNT(Match WHERE league_id = this.id AND result_status == FINALIZED)" }
      - { name: seeded_team_count, type: integer, source: computed, default: 0, description: "COUNT(Team WHERE league_id = this.id AND playoff_seed IS NOT NULL)" }

  # --------------------------------------------------------------- Facility ---
  - name: Facility
    parent: Section
    common_fields: true
    fields:
      - { name: section_id, type: string, source: input, description: "FK -> Section.id; owning section" }
      - { name: name, type: string, source: input, description: "Facility name" }
      - { name: court_count, type: integer, source: input, description: "Playable courts — the aggregate capacity checked on every schedule request", constraints: ">= 1" }
      - { name: turnaround_buffer_minutes, type: integer, source: input, default: 30, description: "Minutes appended to the end of every match occupancy interval at this facility", constraints: ">= 0" }
      - { name: surface, type: enum, source: input, default: "HARD", description: "Court surface", constraints: "HARD | CLAY | INDOOR_HARD" }

  # ----------------------------------------------------------------- Player ---
  - name: Player
    parent: Section
    common_fields: true
    fields:
      - { name: section_id, type: string, source: input, description: "FK -> Section.id; owning section" }
      - { name: full_name, type: string, source: input, description: "Player name" }
      - { name: birth_year, type: integer, source: input, description: "Birth year; league age is season_year - birth_year", constraints: "1900..2020" }
      - { name: gender, type: enum, source: input, description: "Used by the format eligibility rule", constraints: "M | F" }
      - { name: rating_level, type: number, source: system, default: null, description: "Effective NTRP level used by every eligibility check; null while rating_type == UNRATED", constraints: "one of 2.5, 3.0, 3.5, 4.0, 4.5, 5.0" }
      - { name: rating_type, type: enum, source: system, default: "UNRATED", description: "Provenance of rating_level", constraints: "UNRATED | SELF_RATED | COMPUTER_RATED | APPEAL_GRANTED | COMMITTEE_ASSIGNED" }
      - { name: self_rated_level, type: number, source: system, default: null, description: "Level the player declared once via the SELF rating source; retained for audit after later reassignment" }
      - { name: dynamic_rating, type: number, source: computed, default: null, description: "In-season provisional dynamic rating (3 decimals) from calculations.player_dynamic_rating variant in_season_provisional; null until verified_line_count >= 1" }
      - { name: verified_match_count, type: integer, source: computed, default: 0, description: "COUNT(DISTINCT Match WHERE the player appears on a counted line of that match's verifying Scorecard AND Match.result_status IN {VERIFIED, FINALIZED})" }
      - { name: verified_line_count, type: integer, source: computed, default: 0, description: "COUNT of counted lines the player appears on across matches with result_status IN {VERIFIED, FINALIZED}" }
      - { name: strike_count, type: integer, source: computed, default: 0, description: "SUM(Strike.weight WHERE player_id = this.id AND status == ACTIVE) — see calculations.strike_weight_ledger" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "Player standing in the section", constraints: "ACTIVE | STRIKE_SUSPENDED | DISQUALIFIED" }
      - { name: proposed_recalc_level, type: number, source: computed, default: null, description: "Level proposed by the most recent year-end-recalc run; applied by publish-recalc" }
      - { name: proposed_recalc_dynamic, type: number, source: computed, default: null, description: "year_end_final dynamic rating (3 decimals) computed by the most recent year-end-recalc run" }
      - { name: rating_history, type: array, source: system, default: [], description: "Append-only entries {source, level, dynamic_rating, effective_season_year, recorded_at} ordered by recorded_at ASC; source is one of SELF, COMPUTER, APPEAL, COMMITTEE, YEAR_END_RECALC" }

  # ------------------------------------------------------------------- Team ---
  - name: Team
    parent: League
    common_fields: true
    fields:
      - { name: league_id, type: string, source: input, description: "FK -> League.id; league the team competes in" }
      - { name: captain_player_id, type: string, source: system, description: "FK -> Player.id; the acting Captain at creation (X-User-ID); never reassigned" }
      - { name: name, type: string, source: input, description: "Team name", constraints: "unique within league_id" }
      - { name: home_facility_id, type: string, source: input, description: "FK -> Facility.id; default facility for home matches; must belong to the league's section" }
      - { name: advanced_from_team_id, type: string, source: system, default: null, description: "FK -> Team.id; the lower-tier team this team was created from by advance-teams; null for directly registered teams" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "Team lifecycle stage", constraints: "DRAFT | REGISTERED | ROSTER_LOCKED | IN_PLAY | ELIMINATED | ADVANCED | WITHDRAWN | DISQUALIFIED" }
      - { name: active_roster_size, type: integer, source: computed, default: 0, description: "COUNT(RosterSpot WHERE team_id = this.id AND status == ACTIVE)" }
      - { name: playoff_eligible_roster_size, type: integer, source: computed, default: 0, description: "COUNT(RosterSpot WHERE team_id = this.id AND status == ACTIVE AND playoff_eligible == true)" }
      - { name: roster_compliant, type: boolean, source: computed, default: false, description: "active_roster_size >= League.min_active_roster_size of league_id" }
      - { name: matches_won, type: integer, source: computed, default: 0, description: "Counted match wins — see calculations.team_standings_points input_set" }
      - { name: matches_lost, type: integer, source: computed, default: 0, description: "Counted match losses over the same input set as matches_won" }
      - { name: lines_won, type: integer, source: computed, default: 0, description: "Lines credited to this team over the counted match set" }
      - { name: lines_lost, type: integer, source: computed, default: 0, description: "Lines credited to opponents over the counted match set" }
      - { name: sets_won, type: integer, source: computed, default: 0, description: "Sets credited to this team over the counted match set" }
      - { name: sets_lost, type: integer, source: computed, default: 0, description: "Sets credited to opponents over the counted match set" }
      - { name: games_won, type: integer, source: computed, default: 0, description: "Games credited to this team over the counted match set" }
      - { name: games_lost, type: integer, source: computed, default: 0, description: "Games credited to opponents over the counted match set" }
      - { name: standings_points, type: integer, source: computed, default: 0, description: "Official-basis points from calculations.team_standings_points variant official" }
      - { name: playoff_seed, type: integer, source: system, default: null, description: "1-based seed written by seed-playoffs; null until the league enters PLAYOFFS" }

  # ------------------------------------------------------------- RosterSpot ---
  - name: RosterSpot
    parent: Team
    common_fields: true
    fields:
      - { name: team_id, type: string, source: input, description: "FK -> Team.id; team holding the spot" }
      - { name: player_id, type: string, source: input, description: "FK -> Player.id; rostered player" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "Roster spot standing", constraints: "PENDING | ACTIVE | INELIGIBLE | REMOVED" }
      - { name: level_at_add, type: number, source: system, default: null, description: "Player.rating_level pinned at activation; the value calculations.player_dynamic_rating uses as the opponent level, so later rating changes do not rewrite past match ratings" }
      - { name: verified_match_count, type: integer, source: computed, default: 0, description: "COUNT(DISTINCT Match WHERE result_status IN {VERIFIED, FINALIZED} AND the player appears on a counted line for team_id)" }
      - { name: playoff_eligible, type: boolean, source: computed, default: false, description: "verified_match_count >= Section.min_matches_for_playoff_eligibility" }
      - { name: ineligible_reason, type: enum, source: system, default: null, description: "Why status == INELIGIBLE; null in every other status", constraints: "PLAYER_SUSPENDED | APPEAL_GRANTED | YEAR_END_RECALC | GRIEVANCE_REMEDY" }
      - { name: source_strike_id, type: string, source: system, default: null, description: "FK -> Strike.id; the strike whose issuance drove this spot to INELIGIBLE; cleared when that strike is rescinded and the spot returns to ACTIVE" }

  # ------------------------------------------------------------------ Match ---
  - name: Match
    parent: League
    common_fields: true
    fields:
      - { name: league_id, type: string, source: input, description: "FK -> League.id; league the match belongs to" }
      - { name: home_team_id, type: string, source: input, description: "FK -> Team.id; home side; must have league_id equal to this match's league_id" }
      - { name: away_team_id, type: string, source: input, description: "FK -> Team.id; away side; must differ from home_team_id and share league_id" }
      - { name: stage, type: enum, source: input, default: "REGULAR", description: "Competition stage; PLAYOFF lines carry weight 1.5 in the year_end_final rating variant", constraints: "REGULAR | PLAYOFF" }
      - { name: round_number, type: integer, source: input, description: "1-based round index within the stage", constraints: ">= 1" }
      - { name: facility_id, type: string, source: system, default: null, description: "FK -> Facility.id; facility written by schedule; null while schedule_status == UNSCHEDULED" }
      - { name: scheduled_start_at, type: datetime, source: system, default: null, description: "Match start instant written by schedule (ISO 8601 UTC)" }
      - { name: scheduled_end_at, type: datetime, source: computed, default: null, description: "= scheduled_start_at + League.match_duration_minutes; excludes the facility turnaround buffer" }
      - { name: courts_required, type: integer, source: system, default: null, description: "Courts the match occupies for its whole interval; written by schedule", constraints: "1..League.lines_per_match" }
      - { name: schedule_status, type: enum, source: system, default: "UNSCHEDULED", description: "Scheduling dimension — advances independently of result_status", constraints: "UNSCHEDULED | SCHEDULED | CONFIRMED | PLAYED | DEFAULTED | CANCELLED" }
      - { name: result_status, type: enum, source: system, default: "PENDING", description: "Result dimension — advances independently of schedule_status", constraints: "PENDING | REPORTED | DISPUTED | VERIFIED | FINALIZED | VOIDED" }
      - { name: winner_team_id, type: string, source: computed, default: null, description: "FK -> Team.id; side with the greater credited line total; null while undecided and null for a double default" }
      - { name: home_lines_won, type: integer, source: computed, default: 0, description: "Credited lines for the home side after calculations.match_default_resolution" }
      - { name: away_lines_won, type: integer, source: computed, default: 0, description: "Credited lines for the away side after calculations.match_default_resolution" }
      - { name: home_sets_won, type: integer, source: computed, default: 0, description: "Credited sets for the home side across all credited lines" }
      - { name: away_sets_won, type: integer, source: computed, default: 0, description: "Credited sets for the away side across all credited lines" }
      - { name: home_games_won, type: integer, source: computed, default: 0, description: "Credited games for the home side across all credited lines" }
      - { name: away_games_won, type: integer, source: computed, default: 0, description: "Credited games for the away side across all credited lines" }
      - { name: line_results, type: array, source: computed, default: [], description: "Credited line outcomes ordered by line_number ASC; each entry {line_number, credited_to, home_sets, away_sets, home_games, away_games, credit_source} where credit_source is one of PLAYED, LINE_DEFAULT, TEAM_DEFAULT, FORFEIT" }
      - { name: default_side, type: enum, source: computed, default: null, description: "Side charged with the default; BOTH for a double default", constraints: "HOME | AWAY | BOTH" }
      - { name: default_kind, type: enum, source: computed, default: null, description: "How the default arose", constraints: "NO_SHOW | SHORT_ROSTER | LINE_MAJORITY" }
      - { name: verified_at, type: datetime, source: system, default: null, description: "Instant result_status became VERIFIED; anchors the grievance filing window" }

  # -------------------------------------------------------------- Scorecard ---
  - name: Scorecard
    parent: Match
    common_fields: true
    fields:
      - { name: match_id, type: string, source: input, description: "FK -> Match.id; match being reported" }
      - { name: submitted_by_captain_player_id, type: string, source: system, description: "FK -> Player.id; acting Captain who submitted (X-User-ID)" }
      - { name: submitted_by_team_id, type: string, source: system, description: "FK -> Team.id; team captained by submitted_by_captain_player_id" }
      - { name: verified_by_captain_player_id, type: string, source: system, default: null, description: "FK -> Player.id; opposing captain who verified" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "Verification lifecycle; DISPUTED -> AMENDED -> SUBMITTED is a revision cycle", constraints: "SUBMITTED | DISPUTED | AMENDED | VERIFIED | VOIDED" }
      - { name: lines, type: array, source: input, description: "Reported lines ordered by line_number ASC; each entry {line_number, home_player_ids: [Player.id, Player.id], away_player_ids: [Player.id, Player.id], set_scores: [{home_games, away_games}, ...], default_side}. Every listed Player.id MUST hold a RosterSpot in status ACTIVE on the corresponding side's team. set_scores is empty exactly when default_side is non-null" }
      - { name: amendment_count, type: integer, source: system, default: 0, description: "Times amend has rewritten lines; capped at 2" }
      - { name: dispute_reason, type: string, source: system, default: null, description: "Reason recorded by the disputing captain; retained after amendment for audit" }
      - { name: disputed_line_numbers, type: array, source: system, default: [], description: "line_number values the disputing captain contested" }
      - { name: verified_at, type: datetime, source: system, default: null, description: "Instant status became VERIFIED" }

  # ----------------------------------------------------------------- Strike ---
  - name: Strike
    parent: Player
    common_fields: true
    fields:
      - { name: player_id, type: string, source: input, description: "FK -> Player.id; player charged" }
      - { name: match_id, type: string, source: input, default: null, description: "FK -> Match.id; match that occasioned the strike; null for rating-only violations" }
      - { name: source_grievance_id, type: string, source: system, default: null, description: "FK -> Grievance.id; grievance whose PLAYER_STRIKE remedy issued this strike; null for coordinator-issued strikes" }
      - { name: kind, type: enum, source: input, description: "Violation class; fixes weight", constraints: "SELF_RATE_VIOLATION | INELIGIBLE_LINEUP | NO_SHOW_DEFAULT | SCORECARD_FALSIFICATION" }
      - { name: weight, type: integer, source: system, description: "Derived from kind: SELF_RATE_VIOLATION = 2, INELIGIBLE_LINEUP = 2, NO_SHOW_DEFAULT = 1, SCORECARD_FALSIFICATION = 3" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "Only ACTIVE strikes count toward Player.strike_count", constraints: "ACTIVE | RESCINDED" }
      - { name: reason, type: string, source: input, description: "Narrative recorded by the issuer" }
      - { name: rescinded_reason, type: string, source: system, default: null, description: "Narrative recorded by the committee chair on rescission" }

  # ----------------------------------------------------------- RatingAppeal ---
  - name: RatingAppeal
    parent: Player
    common_fields: true
    fields:
      - { name: player_id, type: string, source: input, description: "FK -> Player.id; appellant" }
      - { name: direction, type: enum, source: input, description: "Requested movement of rating_level", constraints: "UP | DOWN" }
      - { name: requested_level, type: number, source: input, description: "Level asked for; must equal rating_level_at_filing +0.5 for UP and -0.5 for DOWN", constraints: "one of 2.5, 3.0, 3.5, 4.0, 4.5, 5.0" }
      - { name: reason, type: string, source: input, description: "Appellant statement" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "Appeal lifecycle", constraints: "SUBMITTED | UNDER_REVIEW | GRANTED | DENIED" }
      - { name: rating_level_at_filing, type: number, source: system, description: "Player.rating_level pinned at filing; the decide step re-validates against this pinned value" }
      - { name: dynamic_rating_at_filing, type: number, source: system, default: null, description: "Player.dynamic_rating pinned at filing; auto_grant_eligible is evaluated against this pinned value, not the live one" }
      - { name: verified_match_count_at_filing, type: integer, source: system, default: 0, description: "Player.verified_match_count pinned at filing" }
      - { name: strike_count_at_filing, type: integer, source: system, default: 0, description: "Player.strike_count pinned at filing" }
      - { name: auto_grant_eligible, type: boolean, source: computed, default: false, description: "Output of calculations.appeal_auto_grant_evaluation at filing; when true the chair may grant without committee quorum" }
      - { name: support_vote_count, type: integer, source: computed, default: 0, description: "COUNT(CommitteeVote WHERE subject_type == RATING_APPEAL AND subject_id = this.id AND vote == SUPPORT)" }
      - { name: oppose_vote_count, type: integer, source: computed, default: 0, description: "COUNT(CommitteeVote WHERE subject_type == RATING_APPEAL AND subject_id = this.id AND vote == OPPOSE)" }
      - { name: decided_by_chair_player_id, type: string, source: system, default: null, description: "FK -> Player.id; chair who decided" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Instant of decision" }
      - { name: decision_note, type: string, source: system, default: null, description: "Chair narrative" }
      - { name: granted_level, type: number, source: system, default: null, description: "Level written onto the player on GRANTED; null on DENIED" }

  # -------------------------------------------------------------- Grievance ---
  - name: Grievance
    parent: League
    common_fields: true
    fields:
      - { name: league_id, type: string, source: input, description: "FK -> League.id; league whose competition is affected" }
      - { name: filed_by_captain_player_id, type: string, source: system, description: "FK -> Player.id; acting Captain who filed (X-User-ID)" }
      - { name: against_team_id, type: string, source: input, description: "FK -> Team.id; team complained about; must be in league_id and must not be the filer's own team" }
      - { name: subject_match_id, type: string, source: input, default: null, description: "FK -> Match.id; match at issue; required for kinds INELIGIBLE_LINEUP, SCORE_FALSIFICATION and DEFAULT_ABUSE, forbidden for RATING_VIOLATION" }
      - { name: kind, type: enum, source: input, description: "Grievance class; constrains the admissible remedies", constraints: "INELIGIBLE_LINEUP | SCORE_FALSIFICATION | DEFAULT_ABUSE | RATING_VIOLATION" }
      - { name: status, type: enum, source: system, default: "FILED", description: "Grievance lifecycle; UPHELD and DISMISSED are the outcome branches", constraints: "FILED | UNDER_REVIEW | UPHELD | DISMISSED | WITHDRAWN" }
      - { name: remedy, type: enum, source: system, default: null, description: "Written only on UPHELD", constraints: "MATCH_FORFEIT | PLAYER_STRIKE | TEAM_DISQUALIFICATION" }
      - { name: remedy_target_player_id, type: string, source: input, default: null, description: "FK -> Player.id; player the PLAYER_STRIKE remedy charges; must hold a RosterSpot in status ACTIVE or INELIGIBLE on against_team_id" }
      - { name: statement, type: string, source: input, description: "Filing narrative" }
      - { name: support_vote_count, type: integer, source: computed, default: 0, description: "COUNT(CommitteeVote WHERE subject_type == GRIEVANCE AND subject_id = this.id AND vote == SUPPORT)" }
      - { name: oppose_vote_count, type: integer, source: computed, default: 0, description: "COUNT(CommitteeVote WHERE subject_type == GRIEVANCE AND subject_id = this.id AND vote == OPPOSE)" }
      - { name: decided_by_chair_player_id, type: string, source: system, default: null, description: "FK -> Player.id; chair who decided" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Instant of decision" }
      - { name: decision_note, type: string, source: system, default: null, description: "Chair narrative" }

  # ---------------------------------------------------------- CommitteeVote ---
  - name: CommitteeVote
    parent: null
    common_fields: false
    fields:
      - { name: subject_type, type: enum, source: input, description: "Which review subject this vote belongs to", constraints: "RATING_APPEAL | GRIEVANCE" }
      - { name: subject_id, type: string, source: input, description: "Polymorphic id — RatingAppeal.id when subject_type == RATING_APPEAL, Grievance.id when subject_type == GRIEVANCE" }
      - { name: voter_player_id, type: string, source: system, description: "FK -> Player.id; acting CommitteeMember (X-User-ID)" }
      - { name: vote, type: enum, source: input, description: "ABSTAIN counts toward neither support nor oppose totals", constraints: "SUPPORT | OPPOSE | ABSTAIN" }
      - { name: note, type: string, source: input, default: null, description: "Voter narrative" }

# =============================================================================
# §1.2 State Machine Table
# Match carries TWO independent status dimensions, emitted as two entries that
# share `entity: Match` and are distinguished by `state_field:`. Every other
# entity has a single state field named in `state_field:`.
# =============================================================================
state_machines:
  # ----------------------------------------------------------------- League ---
  - entity: League
    state_field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: REGISTRATION_OPEN
        trigger: "POST /tennis/leagues/{id}/open-registration"
        actor: SectionAdmin
        preconditions:
          - "Section(section_id).rating_period_status == OPEN_SEASON"
          - "current_utc >= registration_opens_at"
          - "current_utc < registration_closes_at"
          - "parent_league_id is null OR League(parent_league_id).status IN {DRAFT, REGISTRATION_OPEN, ROSTERS_LOCKED, IN_PLAY, PLAYOFFS}"
        side_effects: ["League.version incremented by 1"]

      - from: REGISTRATION_OPEN
        to: ROSTERS_LOCKED
        trigger: "POST /tennis/leagues/{id}/lock-rosters"
        actor: LeagueCoordinator
        preconditions:
          - "current_utc >= roster_lock_at"
          - "registered_team_count >= 2"
        side_effects:
          - "Every Team with league_id = this.id AND status == REGISTERED transitions to ROSTER_LOCKED (cascade down)"
          - "For each such Team, every RosterSpot in status PENDING transitions to REMOVED (pending spots never activated are dropped at lock)"
          - "For each such Team, active_roster_size and roster_compliant are recomputed from the surviving ACTIVE spots"
          - "League.noncompliant_team_count recomputed"
          - "League.version incremented by 1"
        note: "A team with roster_compliant == false still locks; it is held out of the start-play cascade instead of being rejected here."

      - from: ROSTERS_LOCKED
        to: IN_PLAY
        trigger: "POST /tennis/leagues/{id}/start-play"
        actor: LeagueCoordinator
        preconditions:
          - "COUNT(Team WHERE league_id = this.id AND status == ROSTER_LOCKED AND roster_compliant == true) >= 2"
        side_effects:
          - "Every Team with status == ROSTER_LOCKED AND roster_compliant == true transitions to IN_PLAY (conditional cascade)"
          - "Teams with status == ROSTER_LOCKED AND roster_compliant == false remain ROSTER_LOCKED and stay counted in noncompliant_team_count"
          - "League.version incremented by 1"

      - from: IN_PLAY
        to: PLAYOFFS
        trigger: "POST /tennis/leagues/{id}/seed-playoffs"
        actor: LeagueCoordinator
        preconditions:
          - "Zero Match rows with league_id = this.id AND stage == REGULAR AND (schedule_status IN {UNSCHEDULED, SCHEDULED, CONFIRMED, PLAYED} OR result_status IN {PENDING, REPORTED, DISPUTED})"
          - "calculations.playoff_seeding_and_tiebreakers candidate set has >= 2 members, else ERR_NO_PLAYOFF_ELIGIBLE_TEAMS"
        side_effects:
          - "Every Match with league_id = this.id AND stage == REGULAR AND result_status == VERIFIED transitions to FINALIZED (standings input set is frozen)"
          - "Each candidate Team receives playoff_seed 1..N from calculations.playoff_seeding_and_tiebreakers"
          - "Every Team with status == IN_PLAY that is NOT in the candidate set transitions to ELIMINATED"
          - "League.seeded_team_count and finalized_match_count recomputed; League.version incremented by 1"

      - from: PLAYOFFS
        to: COMPLETED
        trigger: "POST /tennis/leagues/{id}/advance-teams"
        actor: LeagueCoordinator
        preconditions:
          - "seeded_team_count >= 1"
          - "Zero Match rows with league_id = this.id AND stage == PLAYOFF AND (result_status IN {PENDING, REPORTED, DISPUTED} OR schedule_status IN {UNSCHEDULED, SCHEDULED, CONFIRMED, PLAYED})"
          - "parent_league_id is null OR League(parent_league_id).status == REGISTRATION_OPEN"
          - "parent_league_id is null OR League(parent_league_id).registered_team_count + min(advancement_slots, seeded_team_count) <= League(parent_league_id).max_teams, else ERR_ADVANCEMENT_SLOTS_EXHAUSTED"
        side_effects:
          - "The first min(advancement_slots, seeded_team_count) teams in playoff_seed ASC order transition to ADVANCED"
          - "For each ADVANCED team, when parent_league_id is not null a new Team is created in the parent league with status REGISTERED, advanced_from_team_id = source team id, same captain_player_id and home_facility_id, name = source name (cascade level 2)"
          - "For each newly created Team, one RosterSpot in status PENDING is created per source RosterSpot in status ACTIVE (cascade level 3)"
          - "League(parent_league_id).registered_team_count recomputed and its version incremented by 1 (cascade level 4)"
          - "Every remaining Team with playoff_seed IS NOT NULL transitions to ELIMINATED"
          - "League.version incremented by 1"

      - from: ROSTERS_LOCKED
        to: REGISTRATION_OPEN
        trigger: "system (automatic on team withdrawal when registered_team_count drops below 2)"
        actor: system
        preconditions:
          - "registered_team_count < 2 after the withdrawal"
          - "current_utc < registration_closes_at is NOT required — the revert is a repair path"
        side_effects:
          - "Every remaining Team with status == ROSTER_LOCKED transitions back to REGISTERED (cascade level 3 of the withdrawal chain)"
          - "League.noncompliant_team_count recomputed; League.version incremented by 1"
        note: "Revert edge; makes the League machine cyclic between REGISTRATION_OPEN and ROSTERS_LOCKED."

      - from: REGISTRATION_OPEN
        to: CANCELLED
        trigger: "system (automatic on team withdrawal when registered_team_count reaches 0)"
        actor: system
        preconditions: ["registered_team_count == 0 after the withdrawal"]
        side_effects:
          - "Every Match with league_id = this.id AND schedule_status IN {UNSCHEDULED, SCHEDULED, CONFIRMED} transitions to CANCELLED"
          - "League.version incremented by 1"

  # ------------------------------------------------------------------- Team ---
  - entity: Team
    state_field: status
    initial_state: DRAFT
    terminal_states: [ELIMINATED, ADVANCED, WITHDRAWN, DISQUALIFIED]
    transitions:
      - from: DRAFT
        to: REGISTERED
        trigger: "POST /tennis/teams/{id}/register"
        actor: Captain
        preconditions:
          - "League(league_id).status == REGISTRATION_OPEN"
          - "current_utc < League(league_id).registration_closes_at"
          - "League(league_id).registered_team_count < League(league_id).max_teams, else ERR_LEAGUE_TEAM_CAPACITY_REACHED"
          - "active_roster_size >= 2"
          - "X-User-ID == captain_player_id"
        side_effects:
          - "League.registered_team_count recomputed and League.version incremented by 1"
          - "Team.version incremented by 1"

      - from: REGISTERED
        to: ROSTER_LOCKED
        trigger: "system (cascade from POST /tennis/leagues/{id}/lock-rosters)"
        actor: system
        preconditions: ["League(league_id).status transitions REGISTRATION_OPEN -> ROSTERS_LOCKED in the same request"]
        side_effects:
          - "Every RosterSpot with team_id = this.id AND status == PENDING transitions to REMOVED"
          - "active_roster_size, playoff_eligible_roster_size and roster_compliant recomputed; Team.version incremented by 1"

      - from: ROSTER_LOCKED
        to: IN_PLAY
        trigger: "system (cascade from POST /tennis/leagues/{id}/start-play)"
        actor: system
        preconditions: ["roster_compliant == true at the moment the league starts play"]
        side_effects: ["Team.version incremented by 1"]

      - from: IN_PLAY
        to: ELIMINATED
        trigger: "system (cascade from seed-playoffs for non-candidates, or from advance-teams for seeded-but-not-promoted teams)"
        actor: system
        preconditions: ["League(league_id).status transitions to PLAYOFFS or COMPLETED in the same request"]
        side_effects: ["playoff_seed left as-is; Team.version incremented by 1"]

      - from: IN_PLAY
        to: ADVANCED
        trigger: "system (cascade from POST /tennis/leagues/{id}/advance-teams)"
        actor: system
        preconditions: ["playoff_seed IS NOT NULL AND playoff_seed <= min(League.advancement_slots, League.seeded_team_count)"]
        side_effects:
          - "When League(league_id).parent_league_id is not null, a Team is created in the parent league with advanced_from_team_id = this.id and its PENDING roster spots copied"
          - "Team.version incremented by 1"

      - from: REGISTERED
        to: WITHDRAWN
        trigger: "POST /tennis/teams/{id}/withdraw"
        actor: Captain
        preconditions:
          - "X-User-ID == captain_player_id"
          - "League(league_id).status IN {REGISTRATION_OPEN, ROSTERS_LOCKED, IN_PLAY}"
        side_effects:
          - "Every RosterSpot with team_id = this.id AND status IN {PENDING, ACTIVE, INELIGIBLE} transitions to REMOVED"
          - "Every Match with home_team_id or away_team_id = this.id AND schedule_status IN {UNSCHEDULED, SCHEDULED, CONFIRMED} transitions to CANCELLED (cascade level 2)"
          - "League.registered_team_count recomputed; the League revert and cancel edges may fire (cascade levels 3 and 4)"
          - "Team.version incremented by 1"

      - from: ROSTER_LOCKED
        to: WITHDRAWN
        trigger: "POST /tennis/teams/{id}/withdraw"
        actor: Captain
        preconditions: ["X-User-ID == captain_player_id", "League(league_id).status IN {ROSTERS_LOCKED, IN_PLAY}"]
        side_effects: ["Same cascade as REGISTERED -> WITHDRAWN"]

      - from: IN_PLAY
        to: WITHDRAWN
        trigger: "POST /tennis/teams/{id}/withdraw"
        actor: Captain
        preconditions:
          - "X-User-ID == captain_player_id"
          - "League(league_id).status == IN_PLAY"
          - "Zero Match rows involving this team with result_status == VERIFIED, else ERR_TEAM_HAS_VERIFIED_RESULTS"
        side_effects: ["Same cascade as REGISTERED -> WITHDRAWN"]
        note: "Once a team owns a verified result the standings ledger can no longer be unwound by withdrawal; the coordinator must use the grievance path."

      - from: IN_PLAY
        to: DISQUALIFIED
        trigger: "system (cascade from POST /tennis/grievances/{id}/decide with outcome UPHELD and remedy TEAM_DISQUALIFICATION)"
        actor: system
        preconditions: ["Grievance.against_team_id == this.id"]
        side_effects:
          - "Every RosterSpot with team_id = this.id AND status == ACTIVE transitions to INELIGIBLE with ineligible_reason = GRIEVANCE_REMEDY"
          - "Every Match involving this team with schedule_status IN {SCHEDULED, CONFIRMED} AND result_status == PENDING transitions to schedule_status CANCELLED"
          - "Matches already VERIFIED or FINALIZED keep their standings contributions"
          - "League.registered_team_count and noncompliant_team_count recomputed; Team.version incremented by 1"

      - from: ROSTER_LOCKED
        to: DISQUALIFIED
        trigger: "system (cascade from POST /tennis/grievances/{id}/decide with outcome UPHELD and remedy TEAM_DISQUALIFICATION)"
        actor: system
        preconditions: ["Grievance.against_team_id == this.id"]
        side_effects: ["Same cascade as IN_PLAY -> DISQUALIFIED"]

  # ------------------------------------------------------------- RosterSpot ---
  - entity: RosterSpot
    state_field: status
    initial_state: PENDING
    terminal_states: [REMOVED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /tennis/roster-spots/{id}/activate"
        actor: Captain
        preconditions:
          - "X-User-ID == Team(team_id).captain_player_id"
          - "Section(League(Team(team_id).league_id).section_id).rating_period_status == OPEN_SEASON"
          - "Team(team_id).status == DRAFT OR Team(team_id).status == REGISTERED"
          - "League(Team(team_id).league_id).status == REGISTRATION_OPEN OR Team(team_id).status == DRAFT"
          - "Player(player_id).status == ACTIVE"
          - "Player(player_id).rating_type != UNRATED"
          - "League.ntrp_level - 1.0 <= Player.rating_level <= League.ntrp_level"
          - "Section.season_year - Player.birth_year >= age minimum of League.age_group (18, 40 or 55)"
          - "Player.gender matches League.format (MENS_DOUBLES requires M, WOMENS_DOUBLES requires F, MIXED_DOUBLES accepts both)"
        side_effects:
          - "level_at_add = Player(player_id).rating_level (pinned)"
          - "Team.active_roster_size and roster_compliant recomputed; Team.version incremented by 1"
          - "League.noncompliant_team_count recomputed"

      - from: ACTIVE
        to: INELIGIBLE
        trigger: "system (cascade from POST /tennis/strikes when the player reaches Section.strike_limit; from POST /tennis/rating-appeals/{id}/decide granting an UP appeal past the league band; from POST /tennis/sections/{id}/publish-recalc; or from a TEAM_DISQUALIFICATION / PLAYER_STRIKE grievance remedy)"
        actor: system
        preconditions: ["Player(player_id).status != ACTIVE OR Player.rating_level > League(Team(team_id).league_id).ntrp_level"]
        side_effects:
          - "ineligible_reason set to PLAYER_SUSPENDED, APPEAL_GRANTED, YEAR_END_RECALC or GRIEVANCE_REMEDY per the driving trigger"
          - "source_strike_id set to the issued Strike.id when the driver is a strike, otherwise left null"
          - "Team.active_roster_size, playoff_eligible_roster_size and roster_compliant recomputed; Team.version incremented by 1"
          - "League.noncompliant_team_count recomputed"

      - from: INELIGIBLE
        to: ACTIVE
        trigger: "system (cascade from POST /tennis/strikes/{id}/rescind)"
        actor: system
        preconditions:
          - "ineligible_reason == PLAYER_SUSPENDED"
          - "source_strike_id == the rescinded Strike.id"
          - "Player(player_id).status == ACTIVE after calculations.strike_weight_ledger recompute"
          - "Player.rating_level <= League(Team(team_id).league_id).ntrp_level"
        side_effects:
          - "ineligible_reason and source_strike_id cleared to null"
          - "Team.active_roster_size and roster_compliant recomputed; Team.version incremented by 1"
        note: "Revision cycle ACTIVE -> INELIGIBLE -> ACTIVE; spots made INELIGIBLE by any other reason are NOT restored by a rescission."

      - from: PENDING
        to: REMOVED
        trigger: "DELETE /tennis/roster-spots/{id}, or system cascade from team lock and team withdrawal"
        actor: Captain
        preconditions: ["X-User-ID == Team(team_id).captain_player_id when the actor is a Captain"]
        side_effects: ["Team.version incremented by 1"]

      - from: ACTIVE
        to: REMOVED
        trigger: "DELETE /tennis/roster-spots/{id}, or system cascade from team withdrawal"
        actor: Captain
        preconditions:
          - "X-User-ID == Team(team_id).captain_player_id when the actor is a Captain"
          - "League(Team(team_id).league_id).status == REGISTRATION_OPEN when the actor is a Captain"
          - "verified_match_count == 0, else ERR_ROSTER_SPOT_HAS_RESULTS"
          - "Section.rating_period_status == OPEN_SEASON when the actor is a Captain"
        side_effects:
          - "Team.active_roster_size and roster_compliant recomputed; Team.version incremented by 1"
          - "League.noncompliant_team_count recomputed"

      - from: INELIGIBLE
        to: REMOVED
        trigger: "system (cascade from POST /tennis/teams/{id}/withdraw)"
        actor: system
        preconditions: ["Team(team_id).status transitions to WITHDRAWN in the same request"]
        side_effects: ["Team.version incremented by 1"]

  # ----------------------------------------------------------------- Player ---
  - entity: Player
    state_field: status
    initial_state: ACTIVE
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: ACTIVE
        to: STRIKE_SUSPENDED
        trigger: "system (automatic inside POST /tennis/strikes when the weighted ledger crosses Section.strike_limit)"
        actor: system
        preconditions:
          - "strike_count >= Section.strike_limit after calculations.strike_weight_ledger recompute"
          - "strike_count < Section.disqualification_strike_limit"
        side_effects:
          - "Every RosterSpot with player_id = this.id AND status == ACTIVE transitions to INELIGIBLE with ineligible_reason = PLAYER_SUSPENDED and source_strike_id = the issued strike (cascade level 3)"
          - "Each affected Team recomputes active_roster_size and roster_compliant (cascade level 4)"
          - "Player.version incremented by 1"

      - from: STRIKE_SUSPENDED
        to: ACTIVE
        trigger: "system (automatic inside POST /tennis/strikes/{id}/rescind when the weighted ledger falls below Section.strike_limit)"
        actor: system
        preconditions: ["strike_count < Section.strike_limit after recompute"]
        side_effects:
          - "Every RosterSpot with player_id = this.id AND status == INELIGIBLE AND ineligible_reason == PLAYER_SUSPENDED AND source_strike_id == the rescinded strike transitions to ACTIVE"
          - "Each affected Team recomputes active_roster_size and roster_compliant"
          - "Player.version incremented by 1"
        note: "Cycle ACTIVE -> STRIKE_SUSPENDED -> ACTIVE."

      - from: ACTIVE
        to: DISQUALIFIED
        trigger: "system (automatic inside POST /tennis/strikes when the weighted ledger reaches Section.disqualification_strike_limit)"
        actor: system
        preconditions: ["strike_count >= Section.disqualification_strike_limit after recompute"]
        side_effects:
          - "Every RosterSpot with player_id = this.id AND status == ACTIVE transitions to INELIGIBLE with ineligible_reason = PLAYER_SUSPENDED"
          - "Each affected Team recomputes active_roster_size and roster_compliant"
          - "Player.version incremented by 1"

      - from: STRIKE_SUSPENDED
        to: DISQUALIFIED
        trigger: "system (automatic inside POST /tennis/strikes when the weighted ledger reaches Section.disqualification_strike_limit)"
        actor: system
        preconditions: ["strike_count >= Section.disqualification_strike_limit after recompute"]
        side_effects: ["Player.version incremented by 1"]
        note: "DISQUALIFIED is terminal: a later rescission lowers strike_count and is recorded, but status stays DISQUALIFIED and no RosterSpot is restored."

  # ------------------------------------------- Match · dimension 1 of 2 -------
  - entity: Match
    state_field: schedule_status
    initial_state: UNSCHEDULED
    terminal_states: [DEFAULTED, CANCELLED]
    transitions:
      - from: UNSCHEDULED
        to: SCHEDULED
        trigger: "POST /tennis/matches/{id}/schedule"
        actor: LeagueCoordinator
        preconditions:
          - "League(league_id).status IN {ROSTERS_LOCKED, IN_PLAY, PLAYOFFS}"
          - "expected_match_version == Match.version, else ERR_STALE_MATCH_VERSION"
          - "scheduled_start_at > current_utc"
          - "stage == REGULAR requires scheduled_start_at <= League.season_end_at; stage == PLAYOFF requires scheduled_start_at > League.season_end_at"
          - "Facility(facility_id).section_id == League(league_id).section_id"
          - "courts_required <= Facility.court_count AND courts_required <= League.lines_per_match"
          - "calculations.court_slot_capacity leaves capacity for courts_required, else ERR_FACILITY_COURTS_EXCEEDED"
          - "calculations.team_calendar_conflict passes for BOTH home_team_id and away_team_id, else ERR_TEAM_DATE_CONFLICT"
        side_effects:
          - "facility_id, scheduled_start_at, courts_required written; scheduled_end_at = scheduled_start_at + League.match_duration_minutes"
          - "Match.version incremented by 1"

      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /tennis/matches/{id}/schedule (reschedule supersedes the prior slot)"
        actor: LeagueCoordinator
        preconditions:
          - "expected_match_version == Match.version, else ERR_STALE_MATCH_VERSION"
          - "All UNSCHEDULED -> SCHEDULED preconditions, evaluated with the prior slot of THIS match excluded from calculations.court_slot_capacity and calculations.team_calendar_conflict"
        side_effects:
          - "facility_id, scheduled_start_at, courts_required and scheduled_end_at overwritten"
          - "Match.version incremented by 1"
        note: "Self-loop; the superseded slot is released before the new slot is measured."

      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /tennis/matches/{id}/confirm"
        actor: Captain
        preconditions:
          - "X-User-ID == Team(home_team_id).captain_player_id"
          - "League(league_id).status IN {IN_PLAY, PLAYOFFS}"
          - "Team(home_team_id).status == IN_PLAY AND Team(away_team_id).status == IN_PLAY, else ERR_TEAM_STATE_INVALID"
          - "Team(home_team_id).roster_compliant == true AND Team(away_team_id).roster_compliant == true, else ERR_TEAM_ROSTER_NONCOMPLIANT"
          - "current_utc < scheduled_start_at"
        side_effects: ["Match.version incremented by 1"]

      - from: CONFIRMED
        to: PLAYED
        trigger: "POST /tennis/matches/{id}/mark-played"
        actor: LeagueCoordinator
        preconditions:
          - "current_utc >= scheduled_end_at, else ERR_MATCH_NOT_YET_PLAYABLE"
        side_effects: ["Match.version incremented by 1"]

      - from: SCHEDULED
        to: DEFAULTED
        trigger: "POST /tennis/matches/{id}/default"
        actor: LeagueCoordinator
        preconditions:
          - "current_utc >= scheduled_start_at, else ERR_MATCH_NOT_YET_PLAYABLE"
          - "result_status == PENDING, else ERR_MATCH_RESULT_STATE_INVALID"
          - "defaulting_side IN {HOME, AWAY, BOTH}"
        side_effects:
          - "default_side and default_kind (NO_SHOW or SHORT_ROSTER from the request) written; calculations.match_default_resolution credits every line"
          - "result_status advances PENDING -> VERIFIED in the same request and verified_at is stamped"
          - "One Strike of kind NO_SHOW_DEFAULT is issued to the captain of each defaulting side (BOTH issues two strikes)"
          - "Both Teams recompute the standings fields; League ledger invariant re-established"
          - "Match.version incremented by 1"

      - from: CONFIRMED
        to: DEFAULTED
        trigger: "POST /tennis/matches/{id}/default"
        actor: LeagueCoordinator
        preconditions: ["Same as SCHEDULED -> DEFAULTED"]
        side_effects: ["Same as SCHEDULED -> DEFAULTED"]

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (cascade from team withdrawal, team disqualification, or league cancellation)"
        actor: system
        preconditions: ["result_status == PENDING"]
        side_effects: ["facility_id, scheduled_start_at and courts_required retained for audit; the occupancy interval is released for calculations.court_slot_capacity", "Match.version incremented by 1"]

      - from: CONFIRMED
        to: CANCELLED
        trigger: "system (cascade from team withdrawal, team disqualification, or league cancellation)"
        actor: system
        preconditions: ["result_status == PENDING"]
        side_effects: ["Same as SCHEDULED -> CANCELLED"]

      - from: UNSCHEDULED
        to: CANCELLED
        trigger: "system (cascade from team withdrawal, team disqualification, or league cancellation)"
        actor: system
        preconditions: ["result_status == PENDING"]
        side_effects: ["Match.version incremented by 1"]

  # ------------------------------------------- Match · dimension 2 of 2 -------
  - entity: Match
    state_field: result_status
    initial_state: PENDING
    terminal_states: [FINALIZED, VOIDED]
    transitions:
      - from: PENDING
        to: REPORTED
        trigger: "POST /tennis/scorecards"
        actor: Captain
        preconditions:
          - "schedule_status == PLAYED, else ERR_MATCH_SCHEDULE_STATE_INVALID"
          - "current_utc <= scheduled_end_at + Section.scorecard_submission_window_hours, else ERR_SCORECARD_WINDOW_EXPIRED"
          - "The acting captain captains home_team_id or away_team_id"
        side_effects:
          - "Scorecard created in status SUBMITTED; Match.result_status = REPORTED"
          - "Provisional standings for both teams recomputed under calculations.team_standings_points variant provisional"
          - "Match.version incremented by 1"

      - from: REPORTED
        to: VERIFIED
        trigger: "POST /tennis/scorecards/{id}/review with decision VERIFY"
        actor: Captain
        preconditions:
          - "Scorecard.status IN {SUBMITTED, AMENDED}"
          - "X-User-ID is the captain of the side that did NOT submit, else ERR_SELF_VERIFICATION_FORBIDDEN"
        side_effects:
          - "calculations.match_default_resolution runs, writing line_results, home/away lines, sets, games, winner_team_id, default_side and default_kind (cascade level 1)"
          - "verified_at stamped; Scorecard.status = VERIFIED"
          - "Both Teams recompute matches_won, matches_lost, lines, sets, games and standings_points under the official variant (cascade level 2)"
          - "Every Player on a credited line recomputes verified_match_count, verified_line_count and dynamic_rating (cascade level 3)"
          - "Every corresponding RosterSpot recomputes verified_match_count and playoff_eligible (cascade level 4)"
          - "Each affected Team recomputes playoff_eligible_roster_size (cascade level 5)"
          - "Match.version incremented by 1"

      - from: REPORTED
        to: DISPUTED
        trigger: "POST /tennis/scorecards/{id}/review with decision DISPUTE"
        actor: Captain
        preconditions:
          - "Scorecard.status IN {SUBMITTED, AMENDED}"
          - "X-User-ID is the captain of the side that did NOT submit"
          - "current_utc <= Scorecard.updated_at + Section.scorecard_dispute_window_hours, else ERR_DISPUTE_WINDOW_EXPIRED"
        side_effects:
          - "Scorecard.status = DISPUTED with dispute_reason and disputed_line_numbers recorded"
          - "Provisional standings contributions from this match are withdrawn (DISPUTED matches are excluded from BOTH standings variants)"
          - "Match.version incremented by 1"

      - from: DISPUTED
        to: REPORTED
        trigger: "POST /tennis/scorecards/{id}/amend"
        actor: Captain
        preconditions:
          - "X-User-ID == Scorecard.submitted_by_captain_player_id"
          - "Scorecard.amendment_count < 2, else ERR_AMENDMENT_LIMIT_REACHED"
        side_effects:
          - "Scorecard.lines overwritten; amendment_count incremented by 1; Scorecard.status = AMENDED"
          - "Provisional standings recomputed for both teams"
          - "Match.version incremented by 1"
        note: "Revision cycle REPORTED -> DISPUTED -> REPORTED; bounded by amendment_count <= 2."

      - from: VERIFIED
        to: FINALIZED
        trigger: "system (cascade from POST /tennis/leagues/{id}/seed-playoffs for stage == REGULAR matches)"
        actor: system
        preconditions: ["stage == REGULAR", "League(league_id).status transitions IN_PLAY -> PLAYOFFS in the same request"]
        side_effects: ["League.finalized_match_count recomputed", "Match.version incremented by 1"]

      - from: VERIFIED
        to: VOIDED
        trigger: "system (cascade from POST /tennis/grievances/{id}/decide with outcome UPHELD and remedy MATCH_FORFEIT)"
        actor: system
        preconditions: ["Grievance.subject_match_id == this.id"]
        side_effects:
          - "The previous credited contributions are subtracted from both Teams, then a forfeit credit of League.lines_per_match lines at 6-0 6-0 is applied to the team that is NOT Grievance.against_team_id; line_results rewritten with credit_source FORFEIT"
          - "winner_team_id set to the aggrieved team; default_side set to HOME or AWAY per the forfeiting side; default_kind unchanged"
          - "Scorecard for this match transitions to VOIDED (cascade level 2)"
          - "Every Player and RosterSpot that lost a credited line recomputes verified_match_count, verified_line_count, dynamic_rating and playoff_eligible (cascade level 3)"
          - "Each affected Team recomputes playoff_eligible_roster_size and standings_points (cascade level 4)"
          - "calculations.league_standings_ledger_invariant must hold after the reversal plus forfeit credit"
          - "Match.version incremented by 1"

      - from: FINALIZED
        to: VOIDED
        trigger: "system (cascade from POST /tennis/grievances/{id}/decide with outcome UPHELD and remedy MATCH_FORFEIT)"
        actor: system
        preconditions: ["Grievance.subject_match_id == this.id", "League(league_id).status == PLAYOFFS"]
        side_effects: ["Same as VERIFIED -> VOIDED, plus League.finalized_match_count recomputed and every playoff_seed in the league recomputed by calculations.playoff_seeding_and_tiebreakers"]

  # -------------------------------------------------------------- Scorecard ---
  - entity: Scorecard
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, VOIDED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /tennis/scorecards/{id}/review with decision VERIFY"
        actor: Captain
        preconditions:
          - "X-User-ID is the captain of the opposing team, else ERR_SELF_VERIFICATION_FORBIDDEN"
          - "Match(match_id).result_status == REPORTED"
        side_effects: ["verified_by_captain_player_id and verified_at written", "Match.result_status advances REPORTED -> VERIFIED with its full cascade"]

      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /tennis/scorecards/{id}/review with decision DISPUTE"
        actor: Captain
        preconditions:
          - "X-User-ID is the captain of the opposing team"
          - "current_utc <= updated_at + Section.scorecard_dispute_window_hours"
          - "disputed_line_numbers is a non-empty subset of the reported line_number values, else ERR_VALIDATION"
        side_effects: ["dispute_reason and disputed_line_numbers written", "Match.result_status advances REPORTED -> DISPUTED"]

      - from: DISPUTED
        to: AMENDED
        trigger: "POST /tennis/scorecards/{id}/amend"
        actor: Captain
        preconditions: ["X-User-ID == submitted_by_captain_player_id", "amendment_count < 2"]
        side_effects: ["lines overwritten; amendment_count incremented by 1", "Match.result_status advances DISPUTED -> REPORTED"]

      - from: AMENDED
        to: VERIFIED
        trigger: "POST /tennis/scorecards/{id}/review with decision VERIFY"
        actor: Captain
        preconditions: ["X-User-ID is the captain of the opposing team"]
        side_effects: ["Same as SUBMITTED -> VERIFIED"]

      - from: AMENDED
        to: DISPUTED
        trigger: "POST /tennis/scorecards/{id}/review with decision DISPUTE"
        actor: Captain
        preconditions: ["X-User-ID is the captain of the opposing team", "current_utc <= updated_at + Section.scorecard_dispute_window_hours"]
        side_effects: ["Same as SUBMITTED -> DISPUTED"]
        note: "Closes the dispute/amend cycle: DISPUTED -> AMENDED -> DISPUTED."

      - from: VERIFIED
        to: VOIDED
        trigger: "system (cascade from a MATCH_FORFEIT grievance remedy)"
        actor: system
        preconditions: ["Match(match_id).result_status transitions to VOIDED in the same request"]
        side_effects: ["lines retained for audit; the scorecard no longer contributes to any calculation"]

  # ----------------------------------------------------------- RatingAppeal ---
  - entity: RatingAppeal
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /tennis/rating-appeals/{id}/start-review"
        actor: CommitteeChair
        preconditions:
          - "Section(Player(player_id).section_id).rating_period_status IN {OPEN_SEASON, RECALC_IN_PROGRESS}"
        side_effects: ["RatingAppeal.version incremented by 1"]
        note: "Votes may only be cast while status == UNDER_REVIEW."

      - from: UNDER_REVIEW
        to: GRANTED
        trigger: "POST /tennis/rating-appeals/{id}/decide with outcome GRANT"
        actor: CommitteeChair
        preconditions:
          - "Section(Player(player_id).section_id).rating_period_status == OPEN_SEASON, else ERR_RATING_PERIOD_CLOSED"
          - "Zero CommitteeVote rows with subject_id = this.id AND voter_player_id == X-User-ID, else ERR_CHAIR_VOTED_ON_SUBJECT"
          - "auto_grant_eligible == true OR (support_vote_count >= 2 AND support_vote_count > oppose_vote_count), else ERR_QUORUM_NOT_MET"
          - "Player(player_id).rating_level == rating_level_at_filing, else ERR_APPEAL_BASELINE_STALE"
        side_effects:
          - "granted_level = requested_level; Player.rating_level = requested_level; Player.rating_type = APPEAL_GRANTED (cascade level 1)"
          - "A rating_history entry {source: APPEAL, level: requested_level, dynamic_rating: Player.dynamic_rating} is appended"
          - "For direction UP: every RosterSpot with player_id = this.id AND status == ACTIVE whose league ntrp_level < the new rating_level transitions to INELIGIBLE with ineligible_reason = APPEAL_GRANTED (cascade level 2)"
          - "Each affected Team recomputes active_roster_size, playoff_eligible_roster_size and roster_compliant (cascade level 3)"
          - "Each affected League recomputes noncompliant_team_count (cascade level 4)"
          - "decided_by_chair_player_id and decided_at written; Player.version and RatingAppeal.version incremented by 1"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /tennis/rating-appeals/{id}/decide with outcome DENY"
        actor: CommitteeChair
        preconditions:
          - "Zero CommitteeVote rows with subject_id = this.id AND voter_player_id == X-User-ID, else ERR_CHAIR_VOTED_ON_SUBJECT"
          - "auto_grant_eligible == false, else ERR_AUTO_GRANT_MUST_BE_GRANTED"
        side_effects:
          - "granted_level stays null; Player.rating_level, rating_type and rating_history are untouched"
          - "decided_by_chair_player_id, decided_at and decision_note written; RatingAppeal.version incremented by 1"
        note: "Branch pair with GRANTED: the two outcomes have disjoint side-effect sets, and DENY is forbidden when the auto-grant formula already qualified the appeal."

  # -------------------------------------------------------------- Grievance ---
  - entity: Grievance
    state_field: status
    initial_state: FILED
    terminal_states: [UPHELD, DISMISSED, WITHDRAWN]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /tennis/grievances/{id}/start-review"
        actor: CommitteeChair
        preconditions: ["League(league_id).status IN {IN_PLAY, PLAYOFFS, COMPLETED}"]
        side_effects: ["Grievance.version incremented by 1"]

      - from: FILED
        to: WITHDRAWN
        trigger: "POST /tennis/grievances/{id}/withdraw"
        actor: Captain
        preconditions: ["X-User-ID == filed_by_captain_player_id"]
        side_effects: ["Grievance.version incremented by 1"]

      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /tennis/grievances/{id}/decide with outcome UPHOLD and a remedy"
        actor: CommitteeChair
        preconditions:
          - "Zero CommitteeVote rows with subject_id = this.id AND voter_player_id == X-User-ID, else ERR_CHAIR_VOTED_ON_SUBJECT"
          - "support_vote_count >= 2 AND support_vote_count > oppose_vote_count, else ERR_QUORUM_NOT_MET"
          - "remedy is admissible for kind: MATCH_FORFEIT requires kind IN {INELIGIBLE_LINEUP, SCORE_FALSIFICATION, DEFAULT_ABUSE} AND subject_match_id IS NOT NULL AND Match.result_status IN {VERIFIED, FINALIZED}; PLAYER_STRIKE requires remedy_target_player_id IS NOT NULL; TEAM_DISQUALIFICATION requires kind IN {INELIGIBLE_LINEUP, SCORE_FALSIFICATION} AND Team(against_team_id).status IN {ROSTER_LOCKED, IN_PLAY}; else ERR_REMEDY_NOT_ADMISSIBLE"
        side_effects:
          - "remedy MATCH_FORFEIT: Match(subject_match_id).result_status transitions to VOIDED with the reversal-plus-forfeit cascade"
          - "remedy PLAYER_STRIKE: a Strike is created for remedy_target_player_id with kind SELF_RATE_VIOLATION when Grievance.kind == RATING_VIOLATION and SCORECARD_FALSIFICATION otherwise, source_grievance_id = this.id, running the full strike cascade; when Grievance.kind == RATING_VIOLATION the target Player.rating_level is additionally raised by 0.5 (capped at 5.0) and rating_type set to COMMITTEE_ASSIGNED with a rating_history entry of source COMMITTEE"
          - "remedy TEAM_DISQUALIFICATION: Team(against_team_id) transitions to DISQUALIFIED with its own cascade"
          - "decided_by_chair_player_id, decided_at and decision_note written; Grievance.version incremented by 1"
        note: "Fork with divergent side-effect sets: each remedy drives a different cascade family."

      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /tennis/grievances/{id}/decide with outcome DISMISS"
        actor: CommitteeChair
        preconditions:
          - "Zero CommitteeVote rows with subject_id = this.id AND voter_player_id == X-User-ID"
          - "oppose_vote_count >= 1 OR support_vote_count < 2"
        side_effects:
          - "remedy stays null; no Match, Team, Player or Strike row is touched"
          - "decided_by_chair_player_id, decided_at and decision_note written; Grievance.version incremented by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent entity's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: roster-spot-create-stale-team
    parent_entity: Team
    write_endpoint: "POST /tennis/roster-spots"
    occ_field: "expected_team_version"
    description: |
      Creating a RosterSpot against a Team whose version has advanced since the
      client last observed it is rejected. Roster composition is a product of the
      whole roster: an earlier accepted add, activation, removal or cascaded
      ineligibility already moved active_roster_size, roster_compliant and
      max_roster_size headroom, so a request carrying a stale expected_team_version
      is deciding against a roster that no longer exists.
    error_id: ERR_STALE_TEAM_VERSION
    http_status: 412

  - rule_id: match-schedule-stale-match
    parent_entity: Match
    write_endpoint: "POST /tennis/matches/{id}/schedule"
    occ_field: "expected_match_version"
    description: |
      Scheduling a Match whose version has advanced since the client last observed
      it is rejected. A schedule call legitimately supersedes the prior slot, so
      the operation cannot be filtered out by a state precondition; the stale
      expected_match_version is what distinguishes a client rescheduling the slot
      it read from one overwriting a slot written after its read.
    error_id: ERR_STALE_MATCH_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---------------------------------------------------------------------------
  - name: player_dynamic_rating
    trigger: "Match.result_status REPORTED -> VERIFIED, Match.result_status VERIFIED|FINALIZED -> VOIDED (recompute for every affected player), and POST /tennis/sections/{id}/year-end-recalc for the year_end_final variant"
    algorithm: chronological
    formula: |
      # STEP 1 — counted-line set for player P
      counted_lines(P) = every entry L of Match.line_results such that
          Match.result_status IN {VERIFIED, FINALIZED}
          AND L.credit_source == PLAYED
          AND P appears in home_player_ids or away_player_ids of the Scorecard.lines
              entry of that match whose line_number == L.line_number
      # LINE_DEFAULT, TEAM_DEFAULT and FORFEIT credits never feed a rating.

      # STEP 2 — per-line rating, rounded to 3 decimals BEFORE any averaging
      for each L in counted_lines(P):
          side            = HOME when P is listed in home_player_ids, else AWAY
          opp_1, opp_2    = the two Player ids on the opposite side of that line
          opp_level_avg   = round((RosterSpot(opp_1 on the opposing team of that match).level_at_add
                                 + RosterSpot(opp_2 on the opposing team of that match).level_at_add) / 2, 3)
          games_for       = L.home_games when side == HOME else L.away_games
          games_against   = L.away_games when side == HOME else L.home_games
          game_diff_ratio = (games_for - games_against) / (games_for + games_against)   # exact, unrounded
          line_rating(L)  = round(opp_level_avg + GAME_DIFF_COEFFICIENT * game_diff_ratio, 3)

      # STEP 3 — aggregate (variant-specific inclusion set and weights)
      dynamic_rating = round( SUM(weight(L) * line_rating(L)) / SUM(weight(L)) , 3 )

      # When counted_lines(P) is empty the result is null, NOT 0.0, and
      # Player.dynamic_rating stays null.
    input_set: "Lines with credit_source == PLAYED on matches whose result_status IN {VERIFIED, FINALIZED}. Matches in PENDING, REPORTED, DISPUTED or VOIDED contribute nothing, and defaulted/forfeited lines contribute nothing even on a VERIFIED match."
    constants:
      GAME_DIFF_COEFFICIENT: 0.50
      RECENCY_WINDOW_LINES: 6
      REGULAR_LINE_WEIGHT: 1.0
      PLAYOFF_LINE_WEIGHT: 1.5
      DECIMALS: 3
    precision: "3 decimal places, round_half_up. Rounding order is PINNED: round every line_rating to 3 decimals FIRST, then take the weighted mean, then round the mean to 3 decimals. Averaging unrounded line ratings and rounding once at the end is a different (wrong) answer."
    variants:
      - name: in_season_provisional
        when: "Written to Player.dynamic_rating by every scorecard verification and every match void; pinned into RatingAppeal.dynamic_rating_at_filing at appeal creation"
        difference: "Includes only the most recent RECENCY_WINDOW_LINES = 6 counted lines, ordered by Match.scheduled_start_at DESC, then Match.created_at DESC, then L.line_number ASC; weight(L) = 1.0 for every included line (unweighted mean)."
      - name: year_end_final
        when: "Computed by POST /tennis/sections/{id}/year-end-recalc into Player.proposed_recalc_dynamic"
        difference: "No recency cap — every counted line of the season is included — and weight(L) = PLAYOFF_LINE_WEIGHT (1.5) when that line's Match.stage == PLAYOFF, otherwise REGULAR_LINE_WEIGHT (1.0). On identical stored data the two variants disagree whenever the player has more than 6 counted lines or any playoff line."

  # ---------------------------------------------------------------------------
  - name: team_standings_points
    trigger: "Every Match.result_status transition, POST /tennis/matches/{id}/default, and GET /tennis/leagues/{id}/standings"
    algorithm: aggregation
    formula: |
      counted_matches(T, basis) = Match rows where league_id == T.league_id
          AND (home_team_id == T.id OR away_team_id == T.id)
          AND result_status IN inclusion_set(basis)
      for each M in counted_matches(T, basis):
          lines_for     = M.home_lines_won  when T.id == M.home_team_id else M.away_lines_won
          lines_against = M.away_lines_won  when T.id == M.home_team_id else M.home_lines_won
          sets_for      = M.home_sets_won   when T.id == M.home_team_id else M.away_sets_won
          sets_against  = M.away_sets_won   when T.id == M.home_team_id else M.home_sets_won
          games_for     = M.home_games_won  when T.id == M.home_team_id else M.away_games_won
          games_against = M.away_games_won  when T.id == M.home_team_id else M.home_games_won
          match_won     = 1 when M.winner_team_id == T.id else 0
          match_lost    = 1 when M.winner_team_id IS NOT NULL AND M.winner_team_id != T.id else 0
      matches_won  = SUM(match_won);   matches_lost = SUM(match_lost)
      lines_won    = SUM(lines_for);   lines_lost   = SUM(lines_against)
      sets_won     = SUM(sets_for);    sets_lost    = SUM(sets_against)
      games_won    = SUM(games_for);   games_lost   = SUM(games_against)
      standings_points = MATCH_WIN_POINTS * matches_won + LINE_WIN_POINTS * lines_won
      # A double default (winner_team_id IS NULL) adds neither a win nor a loss to
      # either side, but its credited lines are 0 for both sides.
    input_set: "inclusion_set(official) = {VERIFIED, FINALIZED}. inclusion_set(provisional) = {REPORTED, VERIFIED, FINALIZED}. Both bases exclude PENDING, DISPUTED and VOIDED."
    constants:
      MATCH_WIN_POINTS: 3
      LINE_WIN_POINTS: 1
    precision: "integer arithmetic throughout; no rounding"
    variants:
      - name: official
        when: "Persisted onto the Team.* standings fields on every result transition; the ONLY basis calculations.playoff_seeding_and_tiebreakers reads"
        difference: "Counts only VERIFIED and FINALIZED matches; a REPORTED-but-unverified match contributes nothing."
      - name: provisional
        when: "Returned by GET /tennis/leagues/{id}/standings?basis=PROVISIONAL, computed per request and never persisted"
        difference: "Additionally counts matches in result_status REPORTED, deriving their tentative line/set/game credits and tentative winner by running calculations.match_default_resolution over the currently submitted Scorecard.lines. For the same stored rows the two bases return different standings_points whenever any match sits in REPORTED."

  # ---------------------------------------------------------------------------
  - name: match_default_resolution
    trigger: "POST /tennis/matches/{id}/default, Scorecard verification (Match REPORTED -> VERIFIED), the provisional standings basis, and the MATCH_FORFEIT grievance remedy"
    algorithm: constraint_propagation
    formula: |
      L                      = League(match.league_id).lines_per_match
      TEAM_DEFAULT_THRESHOLD = ceil(L / 2)          # L = 3 -> 2 ; L = 5 -> 3
      # The evaluation order below is PINNED. Line credits depend on the team-default
      # classification, and the team-default classification depends on the per-line
      # default counts, so the steps may not be reordered or fused.

      # STEP 1 — classify every line 1..L from the scorecard (or from the default request)
      for n in 1..L:
          if the request is POST .../default with defaulting_side == BOTH:  class(n) = DEFAULT_BOTH
          elif the request is POST .../default:                             class(n) = DEFAULT_<defaulting_side>
          elif Scorecard line n has default_side == HOME:                   class(n) = DEFAULT_HOME
          elif Scorecard line n has default_side == AWAY:                   class(n) = DEFAULT_AWAY
          else:                                                            class(n) = PLAYED
      # STEP 2 — per-side default counts
      defaulted_home = COUNT(n where class(n) IN {DEFAULT_HOME, DEFAULT_BOTH})
      defaulted_away = COUNT(n where class(n) IN {DEFAULT_AWAY, DEFAULT_BOTH})
      # STEP 3 — team-default classification (threshold on the counts from STEP 2)
      home_team_default = defaulted_home >= TEAM_DEFAULT_THRESHOLD
      away_team_default = defaulted_away >= TEAM_DEFAULT_THRESHOLD
      # STEP 4 — credit every line, using the STEP 3 verdict
      if home_team_default AND away_team_default:
          every line credited to NOBODY: home_sets = away_sets = home_games = away_games = 0,
          credit_source = TEAM_DEFAULT, credited_to = null
          default_side = BOTH ; winner_team_id = null
      elif home_team_default:
          EVERY line 1..L — including lines that were actually PLAYED — is credited to away
          as DEFAULT_LINE_SCORE, credit_source = TEAM_DEFAULT; the played games are DISCARDED
          default_side = HOME
      elif away_team_default:
          mirror image of the previous branch; default_side = AWAY
      else:
          for each n: class(n) == PLAYED -> credit the reported set_scores, credit_source = PLAYED
                      class(n) == DEFAULT_HOME -> credited to away as DEFAULT_LINE_SCORE, credit_source = LINE_DEFAULT
                      class(n) == DEFAULT_AWAY -> credited to home as DEFAULT_LINE_SCORE, credit_source = LINE_DEFAULT
          default_side = HOME when defaulted_home > 0 AND defaulted_away == 0,
                         AWAY when defaulted_away > 0 AND defaulted_home == 0,
                         BOTH when both > 0, null when neither
      # STEP 5 — roll the credited lines up (only now are the totals defined)
      home_lines_won = COUNT(lines credited to home) ; away_lines_won = COUNT(lines credited to away)
      home_sets_won / away_sets_won / home_games_won / away_games_won = SUM over credited lines
      winner_team_id = home_team_id when home_lines_won > away_lines_won,
                       away_team_id when away_lines_won > home_lines_won,
                       null otherwise    # L is odd, so a tie only occurs on a double default
      default_kind   = NO_SHOW or SHORT_ROSTER when the driver was POST .../default,
                       LINE_MAJORITY when a team default emerged from scorecard line defaults,
                       null when no default occurred
    input_set: "The L lines of the match. On verification the source is the verifying Scorecard.lines; on POST .../default no scorecard exists and every line is synthesised; on the MATCH_FORFEIT remedy every line is credited to the aggrieved team with credit_source = FORFEIT."
    constants:
      DEFAULT_LINE_SCORE: "[{home_games: 6, away_games: 0}, {home_games: 6, away_games: 0}] oriented so the credited side wins 2 sets 6-0 6-0 (2 sets, 12 games for, 0 against)"
      TEAM_DEFAULT_THRESHOLD_RULE: "ceil(lines_per_match / 2)"
    precision: "integer arithmetic; no rounding"

  # ---------------------------------------------------------------------------
  - name: playoff_seeding_and_tiebreakers
    trigger: "POST /tennis/leagues/{id}/seed-playoffs, and re-run for the whole league when a FINALIZED match is VOIDED while League.status == PLAYOFFS"
    algorithm: topological
    formula: |
      # CANDIDATE SET (eligibility filter — explicit predicates only)
      candidates(G) = Team rows where league_id == G.id
            AND status == IN_PLAY
            AND roster_compliant == true
            AND playoff_eligible_roster_size >= G.min_playoff_eligible_players
            AND (matches_won + matches_lost) >= 1
      if COUNT(candidates) < 2 -> reject the whole request with ERR_NO_PLAYOFF_ELIGIBLE_TEAMS (422),
         no seed is written and League.status stays IN_PLAY

      # RANKING EXPRESSION (applied in order; each key breaks ties left by the previous)
      K1: standings_points                      DESC   # official basis only
      K2: matches_won                           DESC
      K3: head_to_head_lines_won(T, tie_group)  DESC
      K4: (sets_won - sets_lost)                DESC
      K5: (games_won - games_lost)              DESC
      K6: created_at                            ASC    # final tie-break; Team.id is NEVER used

      head_to_head_lines_won(T, tie_group) =
          SUM over Match M where result_status IN {VERIFIED, FINALIZED}
              AND M.home_team_id IN tie_group AND M.away_team_id IN tie_group
              AND T IN {M.home_team_id, M.away_team_id}
          of (M.home_lines_won when T is home else M.away_lines_won)
      # tie_group is recomputed at each level: it is the set of candidates still tied
      # after K1 and K2. A 2-team group that never met scores 0 for both, so K3 is a
      # no-op and K4 decides. A 3-or-more-team group uses this mini-league sum.

      # SEED ASSIGNMENT
      seeds are 1..COUNT(candidates) in the sorted order; Team.playoff_seed is written
      Every Team with status == IN_PLAY not in candidates transitions to ELIMINATED
    input_set: "Teams of the league in status IN_PLAY at request time; matches with result_status IN {VERIFIED, FINALIZED} for the head-to-head key."
    constants:
      MIN_CANDIDATES: 2
    precision: "integer comparisons only; created_at compared at millisecond precision"

  # ---------------------------------------------------------------------------
  - name: court_slot_capacity
    trigger: "POST /tennis/matches/{id}/schedule (both the first schedule and every reschedule)"
    algorithm: interval_merge
    formula: |
      D      = League(match.league_id).match_duration_minutes
      B      = Facility(requested facility_id).turnaround_buffer_minutes
      # Every match occupies a HALF-OPEN interval that includes its turnaround buffer:
      occupancy(M) = [ M.scheduled_start_at ,
                       M.scheduled_start_at + League(M.league_id).match_duration_minutes
                                            + Facility(M.facility_id).turnaround_buffer_minutes )
      requested_interval = [ requested_start , requested_start + D + B )
      intersects(a, b)   = a.start < b.end AND b.start < a.end        # half-open geometry

      occupants(F) = Match rows where facility_id == F.id
                       AND schedule_status IN {SCHEDULED, CONFIRMED, PLAYED}
                       AND id != this match's id
      used_courts  = SUM(M.courts_required for M in occupants(F) where intersects(occupancy(M), requested_interval))
      require used_courts + requested_courts_required <= F.court_count
              else ERR_FACILITY_COURTS_EXCEEDED (409)
      # Matches in schedule_status UNSCHEDULED, DEFAULTED or CANCELLED hold no interval,
      # so a cancelled match releases its courts immediately.
      # BOUNDARY: a request whose start equals an occupant's interval end
      # (requested_start == occupant.start + D_occupant + B) does NOT intersect and is
      # admitted even when the facility is otherwise at exactly court_count.
    input_set: "Matches at the same facility in schedule_status {SCHEDULED, CONFIRMED, PLAYED}, excluding the match being (re)scheduled so a reschedule never collides with the slot it releases."
    constants:
      INTERVAL_SEMANTICS: "half-open [start, end); the turnaround buffer is part of the occupancy of EVERY match, so the effective gap two matches need is duration + buffer"
    precision: "minute precision; timestamps compared as UTC instants"

  # ---------------------------------------------------------------------------
  - name: team_calendar_conflict
    trigger: "POST /tennis/matches/{id}/schedule, evaluated once for home_team_id and once for away_team_id"
    algorithm: interval_merge
    formula: |
      peers(T) = Match rows where (home_team_id == T.id OR away_team_id == T.id)
                   AND schedule_status IN {SCHEDULED, CONFIRMED, PLAYED}
                   AND id != this match's id
      if League(match.league_id).allow_same_day_doubleheader == false:
          # CALENDAR-DATE BUCKET geometry: no duration, no buffer, pure UTC date equality
          reject when any P in peers(T) has date_utc(P.scheduled_start_at) == date_utc(requested_start)
                 with ERR_TEAM_DATE_CONFLICT (409)
      else:
          # START-TO-START SEPARATION geometry: duration counts, the facility buffer does NOT
          reject when any P in peers(T) satisfies
                 abs(minutes_between(P.scheduled_start_at, requested_start)) < DOUBLEHEADER_MIN_GAP_MINUTES
              OR intersects([P.scheduled_start_at, P.scheduled_start_at + D_peer),
                            [requested_start,      requested_start      + D_request))
                 with ERR_TEAM_DATE_CONFLICT (409)
      # A team's peers are counted across EVERY league it plays in, so a team promoted
      # into a district league can collide with its own local-league fixture.
    input_set: "All matches of the team in schedule_status {SCHEDULED, CONFIRMED, PLAYED} across every league, excluding the match being (re)scheduled."
    constants:
      DOUBLEHEADER_MIN_GAP_MINUTES: 240
      INTERVAL_SEMANTICS: "UTC calendar-date bucket by default; start-to-start separation plus duration-only overlap when the doubleheader flag is on. Neither geometry uses the facility turnaround buffer, which is what distinguishes this rule from court_slot_capacity."
    precision: "date_utc truncates the instant to its UTC calendar date; gaps measured in whole minutes"

  # ---------------------------------------------------------------------------
  - name: appeal_auto_grant_evaluation
    trigger: "POST /tennis/rating-appeals (writes auto_grant_eligible), re-read by POST /tennis/rating-appeals/{id}/decide"
    algorithm: weighted_scoring
    formula: |
      # Evaluated ONLY against the values pinned on the appeal at filing time.
      base_level  = rating_level_at_filing
      dyn         = dynamic_rating_at_filing            # null when the player has no counted line
      matches     = verified_match_count_at_filing
      strikes     = strike_count_at_filing
      if dyn IS NULL: auto_grant_eligible = false       # nothing to measure against

      gap              = round(dyn - base_level, 3)
      required_matches = COMPUTER_REQUIRED_MATCHES when Player.rating_type == COMPUTER_RATED
                         else SELF_REQUIRED_MATCHES        # SELF_RATED / APPEAL_GRANTED / COMMITTEE_ASSIGNED
      threshold        = max( THRESHOLD_FLOOR ,
                              min( THRESHOLD_CEILING ,
                                   MATCH_COEFFICIENT * required_matches
                                   - STRIKE_COEFFICIENT * min(strikes, STRIKE_CAP) ) )
      if direction == UP:
          auto_grant_eligible = (matches >= required_matches)
                                AND (gap >= threshold)
                                AND (requested_level == base_level + 0.5)
      if direction == DOWN:
          auto_grant_eligible = (matches >= required_matches)
                                AND (-gap >= threshold + DOWN_MARGIN)
                                AND (requested_level == base_level - 0.5)
                                AND (strikes == 0)
      # Decision gate at POST .../decide:
      #   auto_grant_eligible == true  -> GRANT allowed with zero votes; DENY is rejected
      #                                   with ERR_AUTO_GRANT_MUST_BE_GRANTED
      #   auto_grant_eligible == false -> GRANT requires support_vote_count >= QUORUM_SUPPORT
      #                                   AND support_vote_count > oppose_vote_count
    input_set: "Only the four pinned *_at_filing fields plus direction and requested_level; live Player values are deliberately NOT read, so a rating change after filing cannot flip the verdict."
    constants:
      COMPUTER_REQUIRED_MATCHES: 3
      SELF_REQUIRED_MATCHES: 5
      MATCH_COEFFICIENT: 0.10
      STRIKE_COEFFICIENT: 0.05
      STRIKE_CAP: 3
      THRESHOLD_FLOOR: 0.20
      THRESHOLD_CEILING: 0.50
      DOWN_MARGIN: 0.10
      QUORUM_SUPPORT: 2
    precision: "gap and threshold rounded to 3 decimals, round_half_up, before the comparison; comparisons use >= so a gap exactly equal to threshold qualifies"

  # ---------------------------------------------------------------------------
  - name: year_end_rating_recalculation
    trigger: "PHASE 1 = POST /tennis/sections/{id}/year-end-recalc ; PHASE 2 = POST /tennis/sections/{id}/publish-recalc"
    algorithm: projection
    formula: |
      # PHASE 1 — propose (Section.rating_period_status OPEN_SEASON -> RECALC_IN_PROGRESS)
      scope(S) = Player rows where section_id == S.id
                   AND status != DISQUALIFIED
                   AND verified_line_count >= 1
                 processed in created_at ASC order (deterministic, id never consulted)
      for each P in scope(S):
          P.proposed_recalc_dynamic = player_dynamic_rating variant year_end_final
          delta = round(P.proposed_recalc_dynamic - P.rating_level, 3)
          if   delta >= UP_THRESHOLD   : P.proposed_recalc_level = min(P.rating_level + 0.5, LEVEL_CEILING)
          elif delta <= DOWN_THRESHOLD : P.proposed_recalc_level = max(P.rating_level - 0.5, LEVEL_FLOOR)
          else                         : P.proposed_recalc_level = P.rating_level
      Players outside scope(S) keep proposed_recalc_level = null and are untouched at publish.
      S.recalculated_player_count = COUNT(scope(S)) ; S.rating_period_status = RECALC_IN_PROGRESS

      # PHASE 2 — publish (RECALC_IN_PROGRESS -> RECALC_PUBLISHED)
      for each P where section_id == S.id AND proposed_recalc_level IS NOT NULL,
          in created_at ASC order:
          changed = P.proposed_recalc_level != P.rating_level
          P.rating_level    = P.proposed_recalc_level
          P.rating_type     = COMPUTER_RATED            # applied even when the level is unchanged
          P.dynamic_rating  = P.proposed_recalc_dynamic # the year-end value becomes the new baseline
          append rating_history {source: YEAR_END_RECALC, level: P.rating_level,
                                 dynamic_rating: P.proposed_recalc_dynamic,
                                 effective_season_year: S.season_year + 1, recorded_at: current_utc}
          if changed: S.published_level_change_count += 1
          # CASCADE (level 2 -> 4): roster composition follows the new level
          for each RosterSpot R where R.player_id == P.id AND R.status == ACTIVE
                  AND League(Team(R.team_id).league_id).ntrp_level < P.rating_level:
              R.status = INELIGIBLE ; R.ineligible_reason = YEAR_END_RECALC ; R.source_strike_id = null
              Team(R.team_id) recomputes active_roster_size, playoff_eligible_roster_size, roster_compliant
              League(Team(R.team_id).league_id) recomputes noncompliant_team_count
      S.rating_period_status = RECALC_PUBLISHED ; S.recalc_run_index += 1
    input_set: "Every non-disqualified player of the section with at least one counted line; the year_end_final rating variant reads the whole season, including PLAYOFF-weighted lines and FINALIZED matches."
    constants:
      UP_THRESHOLD: 0.25
      DOWN_THRESHOLD: -0.35
      LEVEL_FLOOR: 2.5
      LEVEL_CEILING: 5.0
    precision: "delta rounded to 3 decimals, round_half_up. Boundaries are inclusive: delta == 0.25 bumps up, delta == -0.35 bumps down, delta == -0.34 leaves the level unchanged."

  # ---------------------------------------------------------------------------
  - name: strike_weight_ledger
    trigger: "POST /tennis/strikes, POST /tennis/strikes/{id}/rescind, POST /tennis/matches/{id}/default (auto-issued strikes), and the PLAYER_STRIKE grievance remedy"
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY 1 — the weighted strike ledger of a player
      Player.strike_count == SUM( Strike.weight
                                  WHERE Strike.player_id == Player.id
                                    AND Strike.status == ACTIVE )
      weight(kind) = 2 for SELF_RATE_VIOLATION, 2 for INELIGIBLE_LINEUP,
                     1 for NO_SHOW_DEFAULT,     3 for SCORECARD_FALSIFICATION
      # Status thresholds, evaluated after every recompute:
      strike_count >= Section.disqualification_strike_limit -> Player.status = DISQUALIFIED (terminal)
      Section.strike_limit <= strike_count < Section.disqualification_strike_limit
                                                            -> Player.status = STRIKE_SUSPENDED
      strike_count < Section.strike_limit AND status == STRIKE_SUSPENDED
                                                            -> Player.status = ACTIVE
      # COMPENSATING-ACTION INVARIANT
      # issue(S) then rescind(S) MUST leave the ledger exactly where it started:
      #   Player.strike_count_after == Player.strike_count_before
      #   COUNT(RosterSpot WHERE source_strike_id == S.id) == 0
      #   COUNT(RosterSpot WHERE team_id IN teams_of(P) AND status == INELIGIBLE
      #         AND ineligible_reason == PLAYER_SUSPENDED) is back to its pre-issue value
      #   Team.active_roster_size and Team.roster_compliant are back to their pre-issue values
      # The single documented asymmetry: once Player.status == DISQUALIFIED the status floor
      # is permanent — strike_count still returns to its prior value, but neither the player
      # status nor the roster spots are restored.
    input_set: "All Strike rows of the player; only status == ACTIVE rows contribute weight."
    constants:
      WEIGHT_SELF_RATE_VIOLATION: 2
      WEIGHT_INELIGIBLE_LINEUP: 2
      WEIGHT_NO_SHOW_DEFAULT: 1
      WEIGHT_SCORECARD_FALSIFICATION: 3
    precision: "integer arithmetic; thresholds are inclusive (>=), so with strike_limit 3 a NO_SHOW_DEFAULT (1) on top of an INELIGIBLE_LINEUP (2) suspends the player exactly at 3"

  # ---------------------------------------------------------------------------
  - name: league_standings_ledger_invariant
    trigger: "Asserted after every Match.result_status transition, after POST /tennis/matches/{id}/default, and after the MATCH_FORFEIT grievance remedy"
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY 2 — the league result ledger (a different kind of quantity
      # from the strike ledger: it conserves match/line/game credit, not violation weight)
      decided(G)  = Match rows where league_id == G.id
                      AND result_status IN {VERIFIED, FINALIZED}
                      AND winner_team_id IS NOT NULL
      teams(G)    = Team rows where league_id == G.id
      INVARIANT A: SUM(T.matches_won for T in teams(G)) + SUM(T.matches_lost for T in teams(G))
                   == 2 * COUNT(decided(G))
      INVARIANT B: SUM(T.lines_won) == SUM(T.lines_lost) for T in teams(G)
      INVARIANT C: SUM(T.sets_won)  == SUM(T.sets_lost)  AND SUM(T.games_won) == SUM(T.games_lost)
      INVARIANT D: SUM(T.standings_points) == 3 * COUNT(decided(G)) + SUM(T.lines_won)
      # COMPENSATING-ACTION INVARIANT
      # verify(M) followed by void(M) via a MATCH_FORFEIT remedy must leave A, B, C and D
      # true at every observation point: the reversal subtracts the previously credited
      # lines/sets/games/match result, then the forfeit credit re-adds exactly
      # lines_per_match lines, 2 * lines_per_match sets and 12 * lines_per_match games to
      # the aggrieved team and the mirror-image losses to the forfeiting team.
      # A double default leaves COUNT(decided) unchanged (winner_team_id IS NULL) and adds
      # zero to every SUM, so A..D continue to hold.
    input_set: "Every Team of the league and every Match of the league whose result_status is VERIFIED or FINALIZED."
    constants:
      FORFEIT_SETS_PER_LINE: 2
      FORFEIT_GAMES_PER_LINE: 12
    precision: "integer arithmetic; the invariants are exact equalities with no tolerance"
# =============================================================================
# 1.4  VALIDATION RULES TABLE (ordered by priority; lowest number wins)
# Group order: auth -> existence -> payload -> concurrency -> state ->
# business_safety -> business_referential -> business_constraint ->
# business_temporal -> business_fiscal. Priorities are contiguous and the
# lowest matching priority is the error_id the client actually sees.
# Three DELIBERATE dual-failure priority pairs are marked PAIR A / PAIR B / PAIR C.
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header must be present and non-empty on every request"
    error_id: ERR_MISSING_ROLE_HEADER
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role must be one of the six roles declared in §1.7"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "X-User-ID must be present for the entity_backed roles Captain, Player, CommitteeMember and CommitteeChair, and must resolve to an existing Player row"
    error_id: ERR_MISSING_USER_ID
    http_status: 401
    applies_to: "all endpoints when X-User-Role is Captain, Player, CommitteeMember or CommitteeChair"

  - priority: 4
    category: auth
    check: "X-User-Role must appear in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 5
    category: auth
    check: "The acting Player of an entity_backed role must not be in status DISQUALIFIED"
    error_id: ERR_ACTOR_DISQUALIFIED
    http_status: 403
    applies_to: "all write endpoints invoked as Captain, Player, CommitteeMember or CommitteeChair"

  - priority: 6
    category: auth
    check: "A Player-role actor may only act on its own Player row (X-User-ID == target player_id)"
    error_id: ERR_NOT_SELF
    http_status: 403
    applies_to: "POST /tennis/players/{id}/ratings, POST /tennis/rating-appeals"

  - priority: 7
    category: auth
    check: "A Captain-role actor may only act for a team whose captain_player_id equals X-User-ID (for match/scorecard actions, one of the two sides of the match)"
    error_id: ERR_NOT_TEAM_CAPTAIN
    http_status: 403
    applies_to: "POST /tennis/roster-spots, POST /tennis/roster-spots/{id}/activate, DELETE /tennis/roster-spots/{id}, POST /tennis/teams/{id}/register, POST /tennis/teams/{id}/withdraw, POST /tennis/matches/{id}/confirm, POST /tennis/scorecards, POST /tennis/scorecards/{id}/review, POST /tennis/scorecards/{id}/amend, POST /tennis/grievances, POST /tennis/grievances/{id}/withdraw"

  - priority: 8
    category: auth
    check: "SEGREGATION OF DUTIES — a CommitteeMember may not vote on a subject in which it is an interested party: not on a RatingAppeal whose player_id equals X-User-ID, and not on a Grievance whose filed_by_captain_player_id, remedy_target_player_id equals X-User-ID or whose against_team_id is captained by X-User-ID"
    error_id: ERR_SOD_INTERESTED_PARTY
    http_status: 403
    applies_to: "POST /tennis/committee-votes"

  - priority: 9
    category: auth
    check: "SEGREGATION OF DUTIES — a CommitteeChair that has itself cast a CommitteeVote on this subject_type/subject_id may not decide it"
    error_id: ERR_CHAIR_VOTED_ON_SUBJECT
    http_status: 403
    applies_to: "POST /tennis/rating-appeals/{id}/decide, POST /tennis/grievances/{id}/decide"

  - priority: 10
    category: existence
    check: "Every path id must resolve to an existing row, validated left to right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 11
    category: existence
    check: "Every FK supplied in the payload must resolve to an existing row of the referenced entity"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints carrying a *_id payload field"

  - priority: 12
    category: existence
    check: "A resolved payload FK must belong to the same Section as the target resource (players, leagues, facilities and teams never cross section boundaries)"
    error_id: ERR_SECTION_SCOPE_MISMATCH
    http_status: 404
    applies_to: "POST /tennis/leagues, POST /tennis/facilities, POST /tennis/teams, POST /tennis/roster-spots, POST /tennis/matches, POST /tennis/strikes"

  - priority: 13
    category: business_constraint
    check: "Payload must contain every required field, reject unknown fields, and every enum value must be a declared member"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST, PUT and DELETE endpoints"

  - priority: 14
    category: business_constraint
    check: "limit must be within 1..100 and offset must be >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 15
    category: business_constraint
    check: "Any rating level supplied or requested must be a multiple of 0.5 within [2.5, 5.0] inclusive"
    error_id: ERR_INVALID_RATING_LEVEL
    http_status: 422
    applies_to: "POST /tennis/players, POST /tennis/players/{id}/ratings, POST /tennis/rating-appeals"

  - priority: 16
    category: business_constraint
    check: "Every scorecard line must carry line_number in 1..League.lines_per_match with no duplicates, exactly lines_per_match entries, two distinct player ids per side, and set scores that are legal tennis sets (winner 6 with loser <= 4, or 7 with loser 5 or 6; best of 3 sets; the third set may be a 10-point tiebreak recorded as 1-0)"
    error_id: ERR_SCORECARD_LINE_INVALID
    http_status: 422
    applies_to: "POST /tennis/scorecards, POST /tennis/scorecards/{id}/amend"

  - priority: 17
    category: concurrency
    check: "expected_team_version / expected_match_version must be present on the OCC-guarded endpoints"
    error_id: ERR_MISSING_EXPECTED_VERSION
    http_status: 400
    applies_to: "POST /tennis/roster-spots, POST /tennis/matches/{id}/schedule"

  - priority: 18
    category: concurrency
    check: "expected_team_version must equal Team.version"
    error_id: ERR_STALE_TEAM_VERSION
    http_status: 412
    applies_to: "POST /tennis/roster-spots"

  - priority: 19
    category: concurrency
    check: "expected_match_version must equal Match.version"
    error_id: ERR_STALE_MATCH_VERSION
    http_status: 412
    applies_to: "POST /tennis/matches/{id}/schedule"

  - priority: 20
    category: state
    check: "The target resource must be in a state from which the requested transition is declared in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 21
    category: state
    check: "League.status must be REGISTRATION_OPEN to register a team; a roster add or activation requires Team.status == DRAFT, or Team.status == REGISTERED together with League.status == REGISTRATION_OPEN; a captain-driven removal requires League.status == REGISTRATION_OPEN"
    error_id: ERR_LEAGUE_PHASE_FORBIDS_ROSTER_CHANGE
    http_status: 409
    applies_to: "POST /tennis/teams/{id}/register, POST /tennis/roster-spots, POST /tennis/roster-spots/{id}/activate, DELETE /tennis/roster-spots/{id}"

  - priority: 22
    category: state
    check: "League.status must be ROSTERS_LOCKED or IN_PLAY to create or schedule a match"
    error_id: ERR_LEAGUE_NOT_IN_PLAY
    http_status: 409
    applies_to: "POST /tennis/matches, POST /tennis/matches/{id}/schedule, POST /tennis/matches/{id}/confirm, POST /tennis/matches/{id}/mark-played"

  - priority: 23
    category: state
    check: "League.status must be IN_PLAY to seed playoffs and PLAYOFFS to advance teams; a league in COMPLETED or CANCELLED accepts no further transition on any lifecycle endpoint"
    error_id: ERR_LEAGUE_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /tennis/leagues/{id}/open-registration, POST /tennis/leagues/{id}/lock-rosters, POST /tennis/leagues/{id}/start-play, POST /tennis/leagues/{id}/seed-playoffs, POST /tennis/leagues/{id}/advance-teams"

  - priority: 24
    category: state
    check: "Match.schedule_status gate per action: PLAYED to submit a scorecard, CONFIRMED to mark played, SCHEDULED or CONFIRMED to record a default, UNSCHEDULED or SCHEDULED to (re)schedule"
    error_id: ERR_MATCH_SCHEDULE_STATE_INVALID
    http_status: 409
    applies_to: "POST /tennis/scorecards, POST /tennis/matches/{id}/mark-played, POST /tennis/matches/{id}/default, POST /tennis/matches/{id}/schedule"

  - priority: 25
    category: state
    check: "PAIR A (state side) — Match.result_status must admit the action: PENDING to submit a scorecard or record a default, REPORTED to review, DISPUTED to amend; FINALIZED and VOIDED admit nothing"
    error_id: ERR_MATCH_RESULT_STATE_INVALID
    http_status: 409
    applies_to: "POST /tennis/scorecards, POST /tennis/scorecards/{id}/review, POST /tennis/scorecards/{id}/amend, POST /tennis/matches/{id}/default"

  - priority: 26
    category: state
    check: "Scorecard.status must be SUBMITTED or AMENDED to review, and DISPUTED to amend; VERIFIED and VOIDED are terminal"
    error_id: ERR_SCORECARD_STATE_FORBIDS_ACTION
    http_status: 409
    applies_to: "POST /tennis/scorecards/{id}/review, POST /tennis/scorecards/{id}/amend"

  - priority: 27
    category: state
    check: "Section.rating_period_status must be OPEN_SEASON to start a year-end recalculation, and RECALC_IN_PROGRESS to publish one"
    error_id: ERR_RECALC_PHASE_INVALID
    http_status: 409
    applies_to: "POST /tennis/sections/{id}/year-end-recalc, POST /tennis/sections/{id}/publish-recalc"

  - priority: 28
    category: state
    check: "RatingAppeal.status must be SUBMITTED to start review and UNDER_REVIEW to decide; GRANTED and DENIED are terminal"
    error_id: ERR_APPEAL_STATE_FORBIDS_ACTION
    http_status: 409
    applies_to: "POST /tennis/rating-appeals/{id}/start-review, POST /tennis/rating-appeals/{id}/decide"

  - priority: 29
    category: state
    check: "Grievance.status must be FILED to start review or withdraw, and UNDER_REVIEW to decide; UPHELD, DISMISSED and WITHDRAWN are terminal"
    error_id: ERR_GRIEVANCE_STATE_FORBIDS_ACTION
    http_status: 409
    applies_to: "POST /tennis/grievances/{id}/start-review, POST /tennis/grievances/{id}/decide, POST /tennis/grievances/{id}/withdraw"

  - priority: 30
    category: state
    check: "A CommitteeVote may only be cast while the subject is in status UNDER_REVIEW"
    error_id: ERR_SUBJECT_NOT_UNDER_REVIEW
    http_status: 409
    applies_to: "POST /tennis/committee-votes"

  - priority: 31
    category: state
    check: "Team.status must admit the action: DRAFT or REGISTERED to receive or activate a roster spot, IN_PLAY for both sides of a confirm; WITHDRAWN and DISQUALIFIED teams are frozen and may not be named on a new match or seeded"
    error_id: ERR_TEAM_STATE_INVALID
    http_status: 409
    applies_to: "POST /tennis/roster-spots, POST /tennis/roster-spots/{id}/activate, POST /tennis/matches, POST /tennis/matches/{id}/confirm, POST /tennis/leagues/{id}/seed-playoffs"

  - priority: 32
    category: state
    check: "Both sides of a match must have roster_compliant == true at confirm time"
    error_id: ERR_TEAM_ROSTER_NONCOMPLIANT
    http_status: 409
    applies_to: "POST /tennis/matches/{id}/confirm"

  - priority: 33
    category: state
    check: "Section.rating_period_status must be OPEN_SEASON for any rating write, roster add, activation or captain removal, and for granting an appeal; RECALC_IN_PROGRESS and RECALC_PUBLISHED close the rating period"
    error_id: ERR_RATING_PERIOD_CLOSED
    http_status: 409
    applies_to: "POST /tennis/players/{id}/ratings, POST /tennis/roster-spots, POST /tennis/roster-spots/{id}/activate, DELETE /tennis/roster-spots/{id}, POST /tennis/rating-appeals/{id}/decide"

  - priority: 34
    category: business_safety
    check: "A player whose status is STRIKE_SUSPENDED or DISQUALIFIED may not be added to a roster and may not appear on a scorecard line"
    error_id: ERR_PLAYER_NOT_PLAYABLE
    http_status: 422
    applies_to: "POST /tennis/roster-spots/{id}/activate, POST /tennis/scorecards, POST /tennis/scorecards/{id}/amend"

  - priority: 35
    category: business_safety
    check: "PAIR B (safety side) — the player's league age (Section.season_year - Player.birth_year) must be >= the minimum implied by League.age_group (AGE_18_OVER 18, AGE_40_OVER 40, AGE_55_OVER 55); a league age exactly equal to the minimum qualifies"
    error_id: ERR_AGE_GROUP_NOT_MET
    http_status: 422
    applies_to: "POST /tennis/roster-spots/{id}/activate"

  - priority: 36
    category: business_safety
    check: "Player.rating_type must not be UNRATED and Player.rating_level must sit inside the league band League.ntrp_level - 1.0 <= rating_level <= League.ntrp_level at activation; the accepted level is pinned onto RosterSpot.level_at_add"
    error_id: ERR_RATING_LEVEL_EXCEEDS_LEAGUE
    http_status: 422
    applies_to: "POST /tennis/roster-spots/{id}/activate"

  - priority: 37
    category: business_safety
    check: "Player.gender must be admissible for League.format (MENS_DOUBLES all M, WOMENS_DOUBLES all F, MIXED_DOUBLES each scorecard line must pair one M and one F per side)"
    error_id: ERR_FORMAT_GENDER_MISMATCH
    http_status: 422
    applies_to: "POST /tennis/roster-spots/{id}/activate, POST /tennis/scorecards, POST /tennis/scorecards/{id}/amend"

  - priority: 38
    category: business_safety
    check: "A self-rating is only admissible while Player.rating_type is UNRATED or SELF_RATED; once a player is COMPUTER_RATED, APPEAL_GRANTED or COMMITTEE_ASSIGNED only a LeagueCoordinator-sourced COMPUTER rating may overwrite it"
    error_id: ERR_SELF_RATING_LOCKED
    http_status: 422
    applies_to: "POST /tennis/players/{id}/ratings"

  - priority: 39
    category: business_safety
    check: "Every player named on a scorecard line must hold a RosterSpot in status ACTIVE on the team that fields the line, and no player may appear on two lines of the same match"
    error_id: ERR_INELIGIBLE_LINEUP
    http_status: 422
    applies_to: "POST /tennis/scorecards, POST /tennis/scorecards/{id}/amend"

  - priority: 40
    category: business_safety
    check: "A DISQUALIFIED player's RosterSpot may never be reinstated, and a strike rescission never lifts a disqualification"
    error_id: ERR_PLAYER_DISQUALIFIED_PERMANENT
    http_status: 422
    applies_to: "POST /tennis/strikes/{id}/rescind"

  - priority: 41
    category: business_referential
    check: "home_team_id and away_team_id must both have league_id equal to the match's league_id and must differ from each other"
    error_id: ERR_TEAM_LEAGUE_MISMATCH
    http_status: 422
    applies_to: "POST /tennis/matches"

  - priority: 42
    category: business_referential
    check: "PAIR C (referential side) — the requested facility_id must belong to the same Section as the match's league and must be marked active"
    error_id: ERR_FACILITY_SECTION_MISMATCH
    http_status: 422
    applies_to: "POST /tennis/matches/{id}/schedule, POST /tennis/teams"

  - priority: 43
    category: business_referential
    check: "parent_league_id must be in the same section, carry the same ntrp_level, age_group and format, and sit exactly one tier above the child (LOCAL -> DISTRICT -> SECTION); it must be null iff tier == SECTION"
    error_id: ERR_LEAGUE_LADDER_INVALID
    http_status: 422
    applies_to: "POST /tennis/leagues"

  - priority: 44
    category: business_referential
    check: "A player may hold at most one RosterSpot in status PENDING, ACTIVE or INELIGIBLE per league, counted across every team of that league"
    error_id: ERR_DUPLICATE_ROSTER_SPOT
    http_status: 409
    applies_to: "POST /tennis/roster-spots"

  - priority: 45
    category: business_referential
    check: "CommitteeVote.subject_id must resolve within the entity named by subject_type (RATING_APPEAL -> RatingAppeal, GRIEVANCE -> Grievance)"
    error_id: ERR_SUBJECT_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /tennis/committee-votes"

  - priority: 46
    category: business_referential
    check: "Grievance payload coherence: subject_match_id is required for kinds INELIGIBLE_LINEUP, SCORE_FALSIFICATION and DEFAULT_ABUSE and forbidden for RATING_VIOLATION; the referenced match must belong to league_id and name against_team_id; remedy_target_player_id must hold a RosterSpot on against_team_id"
    error_id: ERR_GRIEVANCE_SUBJECT_INVALID
    http_status: 422
    applies_to: "POST /tennis/grievances, POST /tennis/grievances/{id}/decide"

  - priority: 47
    category: business_referential
    check: "The remedy chosen at UPHOLD must be admissible for Grievance.kind: MATCH_FORFEIT needs kind IN {INELIGIBLE_LINEUP, SCORE_FALSIFICATION, DEFAULT_ABUSE} with subject_match_id set and that match in result_status VERIFIED or FINALIZED; PLAYER_STRIKE needs remedy_target_player_id; TEAM_DISQUALIFICATION needs kind IN {INELIGIBLE_LINEUP, SCORE_FALSIFICATION} with Team(against_team_id).status IN {ROSTER_LOCKED, IN_PLAY}"
    error_id: ERR_REMEDY_NOT_ADMISSIBLE
    http_status: 422
    applies_to: "POST /tennis/grievances/{id}/decide"

  - priority: 48
    category: business_constraint
    check: "A player may hold at most one RatingAppeal in status FILED or UNDER_REVIEW at a time"
    error_id: ERR_APPEAL_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /tennis/rating-appeals"

  - priority: 49
    category: business_constraint
    check: "A CommitteeMember may cast at most one vote per (subject_type, subject_id)"
    error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    applies_to: "POST /tennis/committee-votes"

  - priority: 50
    category: business_constraint
    check: "Scorecard.amendment_count must remain at or below MAX_AMENDMENTS (2)"
    error_id: ERR_AMENDMENT_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /tennis/scorecards/{id}/amend"

  - priority: 51
    category: business_constraint
    check: "A scorecard may only be reviewed (VERIFY or DISPUTE) by the captain of the side that did NOT submit it, and may only be amended by the submitting captain"
    error_id: ERR_SELF_VERIFICATION_FORBIDDEN
    http_status: 409
    applies_to: "POST /tennis/scorecards/{id}/review, POST /tennis/scorecards/{id}/amend"

  - priority: 52
    category: business_constraint
    check: "At most one Scorecard per match may be in status SUBMITTED, DISPUTED or AMENDED at any time"
    error_id: ERR_SCORECARD_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /tennis/scorecards"

  - priority: 53
    category: business_constraint
    check: "court_slot_capacity — summed courts_required of overlapping facility occupancies plus the requested courts must not exceed Facility.court_count"
    error_id: ERR_FACILITY_COURTS_EXCEEDED
    http_status: 409
    applies_to: "POST /tennis/matches/{id}/schedule"

  - priority: 54
    category: business_constraint
    check: "PAIR C (constraint side) — team_calendar_conflict: neither side may already hold a match on the same UTC calendar date (or, with doubleheaders allowed, within 240 minutes start to start)"
    error_id: ERR_TEAM_DATE_CONFLICT
    http_status: 409
    applies_to: "POST /tennis/matches/{id}/schedule"

  - priority: 55
    category: business_constraint
    check: "A non auto-grant appeal decision requires support_vote_count >= 2 and support_vote_count > oppose_vote_count; a grievance decision requires the same quorum"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 422
    applies_to: "POST /tennis/rating-appeals/{id}/decide, POST /tennis/grievances/{id}/decide"

  - priority: 56
    category: business_constraint
    check: "Player.rating_level must still equal RatingAppeal.rating_level_at_filing at decision time; a level moved by a publish-recalc or a committee assignment since filing invalidates the appeal baseline"
    error_id: ERR_APPEAL_BASELINE_STALE
    http_status: 409
    applies_to: "POST /tennis/rating-appeals/{id}/decide"

  - priority: 57
    category: business_constraint
    check: "A RosterSpot with verified_match_count > 0 may not be removed by a captain, and a Team that owns a VERIFIED result may not withdraw"
    error_id: "ERR_ROSTER_SPOT_HAS_RESULTS / ERR_TEAM_HAS_VERIFIED_RESULTS"
    http_status: 409
    applies_to: "DELETE /tennis/roster-spots/{id}, POST /tennis/teams/{id}/withdraw"

  - priority: 58
    category: business_constraint
    check: "An appeal whose auto_grant_eligible is true may not be decided DENIED"
    error_id: ERR_AUTO_GRANT_MUST_BE_GRANTED
    http_status: 422
    applies_to: "POST /tennis/rating-appeals/{id}/decide"

  - priority: 59
    category: business_constraint
    check: "playoff_seeding_and_tiebreakers must find at least two candidate teams, and advance-teams requires a completed seeding (playoff_seed populated)"
    error_id: ERR_NO_PLAYOFF_ELIGIBLE_TEAMS
    http_status: 422
    applies_to: "POST /tennis/leagues/{id}/seed-playoffs, POST /tennis/leagues/{id}/advance-teams"

  - priority: 60
    category: business_temporal
    check: "Team registration is only accepted while registration_opens_at <= current_utc < registration_closes_at (half-open)"
    error_id: ERR_OUTSIDE_REGISTRATION_WINDOW
    http_status: 422
    applies_to: "POST /tennis/teams/{id}/register"

  - priority: 61
    category: business_temporal
    check: "scheduled_start_at must be > current_utc, and stage == REGULAR requires scheduled_start_at <= League.season_end_at while stage == PLAYOFF requires scheduled_start_at > League.season_end_at"
    error_id: ERR_MATCH_START_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /tennis/matches/{id}/schedule"

  - priority: 62
    category: business_temporal
    check: "PAIR A (temporal side) — a scorecard must be submitted while current_utc <= Match.scheduled_end_at + Section.scorecard_submission_window_hours; a submission landing exactly on the boundary instant is still accepted"
    error_id: ERR_SCORECARD_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /tennis/scorecards"

  - priority: 63
    category: business_temporal
    check: "A DISPUTE review must land while current_utc <= Scorecard.updated_at + Section.scorecard_dispute_window_hours"
    error_id: ERR_DISPUTE_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /tennis/scorecards/{id}/review"

  - priority: 64
    category: business_temporal
    check: "mark-played requires current_utc >= Match.scheduled_end_at; recording a default requires current_utc >= Match.scheduled_start_at"
    error_id: ERR_MATCH_NOT_YET_PLAYABLE
    http_status: 422
    applies_to: "POST /tennis/matches/{id}/mark-played, POST /tennis/matches/{id}/default"

  - priority: 65
    category: business_temporal
    check: "A grievance must be filed within Section.grievance_window_hours of the subject match's scheduled_start_at (or, for RATING_VIOLATION, of the appeal decision it contests)"
    error_id: ERR_GRIEVANCE_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /tennis/grievances"

  - priority: 66
    category: business_temporal
    check: "The logical clock must never move backwards"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /tennis/_clock/set_current_utc"

  - priority: 67
    category: business_fiscal
    check: "PAIR B (fiscal side) — a team may not exceed League.max_roster_size counting RosterSpots in status PENDING or ACTIVE"
    error_id: ERR_ROSTER_SIZE_EXCEEDED
    http_status: 409
    applies_to: "POST /tennis/roster-spots, POST /tennis/roster-spots/{id}/activate"

  - priority: 68
    category: business_fiscal
    check: "A league may not admit more than League.max_teams teams in status REGISTERED"
    error_id: ERR_LEAGUE_TEAM_CAPACITY_REACHED
    http_status: 409
    applies_to: "POST /tennis/teams/{id}/register"

  - priority: 69
    category: business_fiscal
    check: "lock-rosters requires registered_team_count >= 2, and start-play requires at least two teams with roster_compliant == true (active_roster_size >= League.min_active_roster_size)"
    error_id: ERR_ROSTER_QUOTA_NOT_MET
    http_status: 409
    applies_to: "POST /tennis/leagues/{id}/lock-rosters, POST /tennis/leagues/{id}/start-play"

  - priority: 70
    category: business_fiscal
    check: "advance-teams promotes at most min(League.advancement_slots, seeded_team_count) teams and the parent league must have room: League(parent).registered_team_count + promoted <= League(parent).max_teams"
    error_id: ERR_ADVANCEMENT_SLOTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /tennis/leagues/{id}/advance-teams"

# =============================================================================
# 1.5  API ENDPOINT TABLE
# Flat resource topology under /tennis. Every entity has POST + GET {id};
# every child entity additionally has a filtered collection GET carrying each
# of its FK fields as a query input, so every FK is reverse-reachable.
# Roles: SectionAdmin, LeagueCoordinator, Captain, Player, CommitteeMember,
# CommitteeChair (see §1.7). Headers X-User-Role and X-User-ID on every call.
# =============================================================================
endpoints:
  # ----------------------------------------------------------- logical clock ---
  - method: POST
    path: "/tennis/_clock/set_current_utc"
    description: "Test-driving endpoint. Sets the logical clock every temporal rule reads as current_utc. The server starts with the logical clock at exactly 2026-08-01T00:00:00Z; before any call to this endpoint current_utc reads that default and never falls back to wall-clock time. The clock may only move forward."
    roles: [SectionAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "current_utc set; rejected with ERR_CLOCK_NOT_MONOTONIC when the supplied instant is earlier than the current value"

  # ---------------------------------------------------------------- Section ---
  - method: POST
    path: "/tennis/sections"
    description: "Create a Section (the rating and discipline authority)"
    roles: [SectionAdmin]
    code: 201
    input: [code, name, season_year, "min_matches_for_playoff_eligibility?", "strike_limit?", "disqualification_strike_limit?", "scorecard_submission_window_hours?", "scorecard_dispute_window_hours?", "grievance_window_hours?"]
    output: Section
    side_effects:
      - "rating_period_status=OPEN_SEASON, recalc_run_index=0, recalculated_player_count=0, published_level_change_count=0, version=1"

  - method: GET
    path: "/tennis/sections/{id}"
    description: "Get a Section"
    roles: [SectionAdmin, LeagueCoordinator, Captain, Player, CommitteeMember, CommitteeChair]
    code: 200
    input: []
    output: Section
    side_effects: []

  - method: GET
    path: "/tennis/sections"
    description: "List Sections"
    roles: [SectionAdmin, LeagueCoordinator]
    code: 200
    input: ["code?", "season_year?", "rating_period_status?", "limit?", "offset?"]
    output: Section[]
    side_effects: []

  - method: GET
    path: "/tennis/sections/{id}/facilities"
    description: "List the Facilities of a Section (reverse lookup for Facility.section_id)"
    roles: [SectionAdmin, LeagueCoordinator, Captain]
    code: 200
    input: ["surface?", "limit?", "offset?"]
    output: Facility[]
    side_effects: []

  - method: POST
    path: "/tennis/sections/{id}/year-end-recalc"
    description: "PHASE 1 of the year-end rating recalculation: compute and store proposed levels without applying them (calculations.year_end_rating_recalculation)"
    roles: [SectionAdmin]
    code: 200
    input: []
    output: Section
    side_effects:
      - "requires rating_period_status == OPEN_SEASON, else ERR_RECALC_PHASE_INVALID"
      - "writes proposed_recalc_dynamic and proposed_recalc_level on every in-scope Player in created_at ASC order"
      - "rating_period_status=RECALC_IN_PROGRESS, recalculated_player_count written, Section.version incremented by 1"

  - method: POST
    path: "/tennis/sections/{id}/publish-recalc"
    description: "PHASE 2 of the year-end rating recalculation: apply the proposed levels and cascade the roster consequences"
    roles: [SectionAdmin]
    code: 200
    input: []
    output: Section
    side_effects:
      - "requires rating_period_status == RECALC_IN_PROGRESS, else ERR_RECALC_PHASE_INVALID"
      - "applies rating_level, sets rating_type=COMPUTER_RATED, rebaselines dynamic_rating and appends a YEAR_END_RECALC rating_history entry per in-scope Player"
      - "cascades ACTIVE RosterSpots whose league ntrp_level is below the new level to INELIGIBLE with ineligible_reason=YEAR_END_RECALC, then recomputes each Team and each League noncompliant_team_count"
      - "rating_period_status=RECALC_PUBLISHED, recalc_run_index incremented by 1, published_level_change_count written, Section.version incremented by 1"

  # --------------------------------------------------------------- Facility ---
  - method: POST
    path: "/tennis/facilities"
    description: "Create a Facility with its court capacity and turnaround buffer"
    roles: [SectionAdmin]
    code: 201
    input: [section_id, name, court_count, "turnaround_buffer_minutes?", "surface?"]
    output: Facility
    side_effects: ["version=1"]

  - method: GET
    path: "/tennis/facilities/{id}"
    description: "Get a Facility"
    roles: [SectionAdmin, LeagueCoordinator, Captain]
    code: 200
    input: []
    output: Facility
    side_effects: []

  # ----------------------------------------------------------------- League ---
  - method: POST
    path: "/tennis/leagues"
    description: "Create a League at a tier of the progression ladder"
    roles: [SectionAdmin]
    code: 201
    input: [section_id, "parent_league_id?", tier, ntrp_level, age_group, format, "lines_per_match?", "min_active_roster_size?", "max_roster_size?", "min_playoff_eligible_players?", "max_teams?", "advancement_slots?", "match_duration_minutes?", "allow_same_day_doubleheader?", registration_opens_at, registration_closes_at, roster_lock_at, season_end_at]
    output: League
    side_effects:
      - "status=DRAFT, all computed counts 0, version=1"
      - "parent_league_id validated against the ladder rule, else ERR_LEAGUE_LADDER_INVALID"

  - method: GET
    path: "/tennis/leagues/{id}"
    description: "Get a League"
    roles: [SectionAdmin, LeagueCoordinator, Captain, Player, CommitteeMember, CommitteeChair]
    code: 200
    input: []
    output: League
    side_effects: []

  - method: GET
    path: "/tennis/leagues"
    description: "List Leagues filtered by owning section or by parent league (reverse lookup for League.section_id and League.parent_league_id)"
    roles: [SectionAdmin, LeagueCoordinator, Captain, Player, CommitteeMember, CommitteeChair]
    code: 200
    input: ["section_id?", "parent_league_id?", "tier?", "ntrp_level?", "age_group?", "format?", "status?", "limit?", "offset?"]
    output: League[]
    side_effects: []

  - method: GET
    path: "/tennis/leagues/{id}/standings"
    description: "Standings table of a league. basis=official (default) counts only VERIFIED and FINALIZED matches; basis=provisional additionally counts REPORTED matches. Ordered by the ranking keys of calculations.playoff_seeding_and_tiebreakers."
    roles: [SectionAdmin, LeagueCoordinator, Captain, Player, CommitteeMember, CommitteeChair]
    code: 200
    input: ["basis?", "limit?", "offset?"]
    output: Team[]
    side_effects: []

  - method: POST
    path: "/tennis/leagues/{id}/open-registration"
    description: "DRAFT -> REGISTRATION_OPEN"
    roles: [SectionAdmin]
    code: 200
    input: []
    output: League
    side_effects: ["status=REGISTRATION_OPEN, League.version incremented by 1"]

  - method: POST
    path: "/tennis/leagues/{id}/lock-rosters"
    description: "REGISTRATION_OPEN -> ROSTERS_LOCKED; cascades every REGISTERED team to ROSTER_LOCKED and drops every PENDING roster spot"
    roles: [LeagueCoordinator]
    code: 200
    input: []
    output: League
    side_effects:
      - "each REGISTERED Team -> ROSTER_LOCKED; each PENDING RosterSpot of those teams -> REMOVED"
      - "each Team recomputes active_roster_size, playoff_eligible_roster_size, roster_compliant; noncompliant_team_count recomputed"
      - "League.version and each affected Team.version incremented by 1"

  - method: POST
    path: "/tennis/leagues/{id}/start-play"
    description: "ROSTERS_LOCKED -> IN_PLAY; only roster-compliant teams advance to IN_PLAY"
    roles: [LeagueCoordinator]
    code: 200
    input: []
    output: League
    side_effects:
      - "each ROSTER_LOCKED Team with roster_compliant == true -> IN_PLAY; non-compliant teams stay ROSTER_LOCKED"
      - "League.version and each affected Team.version incremented by 1"

  - method: POST
    path: "/tennis/leagues/{id}/seed-playoffs"
    description: "IN_PLAY -> PLAYOFFS; freezes the standings input set and writes playoff_seed from calculations.playoff_seeding_and_tiebreakers"
    roles: [LeagueCoordinator]
    code: 200
    input: []
    output: League
    side_effects:
      - "every REGULAR match in result_status VERIFIED -> FINALIZED"
      - "playoff_seed 1..N written on the candidate teams; every other IN_PLAY team -> ELIMINATED"
      - "seeded_team_count and finalized_match_count recomputed; League.version incremented by 1"
      - "fewer than two candidates is rejected with ERR_NO_PLAYOFF_ELIGIBLE_TEAMS"

  - method: POST
    path: "/tennis/leagues/{id}/advance-teams"
    description: "PLAYOFFS -> COMPLETED; promotes the top seeds into parent_league_id, creating the parent-tier Team and its PENDING roster spots"
    roles: [LeagueCoordinator]
    code: 200
    input: []
    output: League
    side_effects:
      - "the first min(advancement_slots, seeded_team_count) teams in playoff_seed ASC order -> ADVANCED"
      - "for each promoted team a Team is created in the parent league with advanced_from_team_id set, plus one PENDING RosterSpot per source ACTIVE spot"
      - "parent League.registered_team_count recomputed and its version incremented by 1"
      - "remaining seeded teams -> ELIMINATED; status=COMPLETED; League.version incremented by 1"

  # ----------------------------------------------------------------- Player ---
  - method: POST
    path: "/tennis/players"
    description: "Register a Player in a Section"
    roles: [SectionAdmin, LeagueCoordinator]
    code: 201
    input: [section_id, full_name, birth_year, gender]
    output: Player
    side_effects: ["rating_type=UNRATED, rating_level=null, dynamic_rating=null, strike_count=0, status=ACTIVE, rating_history=[], version=1"]

  - method: GET
    path: "/tennis/players/{id}"
    description: "Get a Player including rating_level, rating_type, dynamic_rating, strike_count and rating_history"
    roles: [SectionAdmin, LeagueCoordinator, Captain, Player, CommitteeMember, CommitteeChair]
    code: 200
    input: []
    output: Player
    side_effects: []

  - method: GET
    path: "/tennis/players"
    description: "List Players of a Section (reverse lookup for Player.section_id)"
    roles: [SectionAdmin, LeagueCoordinator, Captain, CommitteeMember, CommitteeChair]
    code: 200
    input: ["section_id?", "status?", "rating_type?", "gender?", "limit?", "offset?"]
    output: Player[]
    side_effects: []

  - method: POST
    path: "/tennis/players/{id}/ratings"
    description: "Assign a rating. source=SELF is the one-time player self-rating (role Player, own record only); source=COMPUTER is the coordinator-assigned computer rating and may overwrite any provenance."
    roles: [Player, LeagueCoordinator]
    code: 200
    input: [source, level]
    output: Player
    side_effects:
      - "requires Section.rating_period_status == OPEN_SEASON, else ERR_RATING_PERIOD_CLOSED"
      - "source=SELF requires role Player with X-User-ID == {id} and rating_type IN {UNRATED, SELF_RATED}, else ERR_SELF_RATING_LOCKED; writes self_rated_level and rating_type=SELF_RATED"
      - "source=COMPUTER requires role LeagueCoordinator; writes rating_type=COMPUTER_RATED"
      - "rating_level=level, a rating_history entry of source SELF or COMPUTER appended, Player.version incremented by 1"

  - method: GET
    path: "/tennis/players/{id}/committee-votes"
    description: "List the CommitteeVotes cast by this player (reverse lookup for CommitteeVote.voter_player_id)"
    roles: [SectionAdmin, CommitteeChair, CommitteeMember]
    code: 200
    input: ["subject_type?", "limit?", "offset?"]
    output: CommitteeVote[]
    side_effects: []

  # ------------------------------------------------------------------- Team ---
  - method: POST
    path: "/tennis/teams"
    description: "Create a Team in DRAFT. The acting Captain becomes captain_player_id; the home facility must belong to the league's section."
    roles: [Captain]
    code: 201
    input: [league_id, name, home_facility_id]
    output: Team
    side_effects:
      - "captain_player_id = X-User-ID; status=DRAFT; all standings and roster counters 0; roster_compliant=false; version=1"
      - "home_facility_id validated against the league's section, else ERR_FACILITY_SECTION_MISMATCH"

  - method: GET
    path: "/tennis/teams/{id}"
    description: "Get a Team with its roster counters and standings fields"
    roles: [SectionAdmin, LeagueCoordinator, Captain, Player, CommitteeMember, CommitteeChair]
    code: 200
    input: []
    output: Team
    side_effects: []

  - method: GET
    path: "/tennis/teams"
    description: "List Teams (reverse lookup for Team.league_id, Team.captain_player_id, Team.home_facility_id and Team.advanced_from_team_id)"
    roles: [SectionAdmin, LeagueCoordinator, Captain, Player, CommitteeMember, CommitteeChair]
    code: 200
    input: ["league_id?", "captain_player_id?", "home_facility_id?", "advanced_from_team_id?", "status?", "limit?", "offset?"]
    output: Team[]
    side_effects: []

  - method: POST
    path: "/tennis/teams/{id}/register"
    description: "DRAFT -> REGISTERED inside the league registration window"
    roles: [Captain]
    code: 200
    input: []
    output: Team
    side_effects:
      - "requires League.status == REGISTRATION_OPEN, current_utc inside [registration_opens_at, registration_closes_at), active_roster_size >= 2 and registered_team_count < max_teams (else ERR_LEAGUE_TEAM_CAPACITY_REACHED)"
      - "League.registered_team_count recomputed and League.version incremented by 1; Team.version incremented by 1"

  - method: POST
    path: "/tennis/teams/{id}/withdraw"
    description: "Captain withdrawal. Removes every roster spot, cancels every uncontested match of the team, and may cascade the league back to REGISTRATION_OPEN or to CANCELLED."
    roles: [Captain]
    code: 200
    input: ["reason?"]
    output: Team
    side_effects:
      - "rejected when any match of the team is in result_status VERIFIED, with ERR_TEAM_HAS_VERIFIED_RESULTS"
      - "every RosterSpot in PENDING, ACTIVE or INELIGIBLE -> REMOVED"
      - "every Match naming the team in schedule_status UNSCHEDULED, SCHEDULED or CONFIRMED -> CANCELLED, releasing its facility occupancy"
      - "League.registered_team_count recomputed; ROSTERS_LOCKED -> REGISTRATION_OPEN revert when the count drops below 2 (remaining ROSTER_LOCKED teams revert to REGISTERED); REGISTRATION_OPEN -> CANCELLED when the count reaches 0"
      - "status=WITHDRAWN; Team.version, League.version and each affected Match.version incremented by 1"

  # ------------------------------------------------------------- RosterSpot ---
  - method: POST
    path: "/tennis/roster-spots"
    description: "Add a player to a team roster in status PENDING. OCC-guarded on the parent Team: expected_team_version must equal the Team.version the client last observed."
    roles: [Captain]
    code: 201
    input: [team_id, player_id, expected_team_version]
    output: RosterSpot
    side_effects:
      - "expected_team_version mismatch is rejected with ERR_STALE_TEAM_VERSION (412)"
      - "status=PENDING, level_at_add=null, verified_match_count=0, playoff_eligible=false, version=1"
      - "increments Team.version by 1"

  - method: GET
    path: "/tennis/roster-spots/{id}"
    description: "Get a RosterSpot including ineligible_reason and source_strike_id"
    roles: [SectionAdmin, LeagueCoordinator, Captain, Player, CommitteeMember, CommitteeChair]
    code: 200
    input: []
    output: RosterSpot
    side_effects: []

  - method: GET
    path: "/tennis/roster-spots"
    description: "List RosterSpots (reverse lookup for RosterSpot.team_id, RosterSpot.player_id and RosterSpot.source_strike_id)"
    roles: [SectionAdmin, LeagueCoordinator, Captain, Player, CommitteeMember, CommitteeChair]
    code: 200
    input: ["team_id?", "player_id?", "source_strike_id?", "status?", "ineligible_reason?", "playoff_eligible?", "limit?", "offset?"]
    output: RosterSpot[]
    side_effects: []

  - method: POST
    path: "/tennis/roster-spots/{id}/activate"
    description: "PENDING -> ACTIVE. This is where every eligibility rule bites: player status, rating provenance, the league rating band, the age-group minimum and the format gender rule."
    roles: [Captain]
    code: 200
    input: []
    output: RosterSpot
    side_effects:
      - "level_at_add = Player.rating_level (pinned, never rewritten by later rating changes)"
      - "Team.active_roster_size, playoff_eligible_roster_size and roster_compliant recomputed; League.noncompliant_team_count recomputed"
      - "Team.version and RosterSpot.version incremented by 1"

  - method: DELETE
    path: "/tennis/roster-spots/{id}"
    description: "Captain removal of a roster spot (PENDING or ACTIVE -> REMOVED). Rejected once the spot has a verified match."
    roles: [Captain]
    code: 204
    input: []
    output: null
    side_effects:
      - "rejected with ERR_ROSTER_SPOT_HAS_RESULTS when verified_match_count > 0"
      - "status=REMOVED; Team.active_roster_size and roster_compliant recomputed; League.noncompliant_team_count recomputed; Team.version incremented by 1"

  # ------------------------------------------------------------------ Match ---
  - method: POST
    path: "/tennis/matches"
    description: "Create a fixture between two teams of the same league in schedule_status UNSCHEDULED and result_status PENDING"
    roles: [LeagueCoordinator]
    code: 201
    input: [league_id, home_team_id, away_team_id, "stage?", round_number]
    output: Match
    side_effects:
      - "both teams validated against league_id and against each other, else ERR_TEAM_LEAGUE_MISMATCH"
      - "schedule_status=UNSCHEDULED, result_status=PENDING, facility_id=null, all credited counters 0, line_results=[], version=1"

  - method: GET
    path: "/tennis/matches/{id}"
    description: "Get a Match with both status dimensions, credited line_results and default fields"
    roles: [SectionAdmin, LeagueCoordinator, Captain, Player, CommitteeMember, CommitteeChair]
    code: 200
    input: []
    output: Match
    side_effects: []

  - method: GET
    path: "/tennis/matches"
    description: "List Matches (reverse lookup for Match.league_id, Match.home_team_id, Match.away_team_id, Match.facility_id and Match.winner_team_id)"
    roles: [SectionAdmin, LeagueCoordinator, Captain, Player, CommitteeMember, CommitteeChair]
    code: 200
    input: ["league_id?", "home_team_id?", "away_team_id?", "facility_id?", "winner_team_id?", "stage?", "round_number?", "schedule_status?", "result_status?", "scheduled_from?", "scheduled_to?", "limit?", "offset?"]
    output: Match[]
    side_effects: []

  - method: POST
    path: "/tennis/matches/{id}/schedule"
    description: "Write or overwrite the slot of a match (UNSCHEDULED -> SCHEDULED, or the SCHEDULED -> SCHEDULED reschedule self-loop). OCC-guarded: expected_match_version must equal the Match.version the client last observed. Runs calculations.court_slot_capacity and calculations.team_calendar_conflict with the superseded slot of this match excluded."
    roles: [LeagueCoordinator]
    code: 200
    input: [facility_id, scheduled_start_at, courts_required, expected_match_version]
    output: Match
    side_effects:
      - "expected_match_version mismatch is rejected with ERR_STALE_MATCH_VERSION (412)"
      - "facility_id, scheduled_start_at and courts_required written; scheduled_end_at = scheduled_start_at + League.match_duration_minutes"
      - "schedule_status=SCHEDULED; increments Match.version by 1"

  - method: POST
    path: "/tennis/matches/{id}/confirm"
    description: "SCHEDULED -> CONFIRMED by the home captain; both sides must be IN_PLAY and roster-compliant"
    roles: [Captain]
    code: 200
    input: []
    output: Match
    side_effects: ["schedule_status=CONFIRMED; Match.version incremented by 1"]

  - method: POST
    path: "/tennis/matches/{id}/mark-played"
    description: "CONFIRMED -> PLAYED once current_utc has passed scheduled_end_at; opens the scorecard submission window"
    roles: [LeagueCoordinator]
    code: 200
    input: []
    output: Match
    side_effects: ["schedule_status=PLAYED; Match.version incremented by 1"]

  - method: POST
    path: "/tennis/matches/{id}/default"
    description: "Record a default (SCHEDULED or CONFIRMED -> DEFAULTED). defaulting_side BOTH is a double default that credits no winner. Runs calculations.match_default_resolution and advances result_status straight to VERIFIED."
    roles: [LeagueCoordinator]
    code: 200
    input: [defaulting_side, default_kind, "note?"]
    output: Match
    side_effects:
      - "default_side and default_kind written; every line credited by calculations.match_default_resolution with credit_source TEAM_DEFAULT"
      - "result_status=VERIFIED and verified_at stamped in the same request"
      - "one Strike of kind NO_SHOW_DEFAULT issued to the captain of each defaulting side (BOTH issues two)"
      - "both Teams recompute matches_won/lost, lines, sets, games and standings_points; calculations.league_standings_ledger_invariant re-established"
      - "Match.version incremented by 1"

  # -------------------------------------------------------------- Scorecard ---
  - method: POST
    path: "/tennis/scorecards"
    description: "Submit the scorecard of a PLAYED match (result_status PENDING -> REPORTED). Every named player must hold an ACTIVE roster spot on the side that fields the line."
    roles: [Captain]
    code: 201
    input: [match_id, lines]
    output: Scorecard
    side_effects:
      - "submitted_by_captain_player_id = X-User-ID; submitted_by_team_id = the team captained by the actor"
      - "status=SUBMITTED, amendment_count=0, version=1; Match.result_status=REPORTED"
      - "both Teams recompute the provisional standings basis; Match.version incremented by 1"

  - method: GET
    path: "/tennis/scorecards/{id}"
    description: "Get a Scorecard with its reported lines and dispute record"
    roles: [SectionAdmin, LeagueCoordinator, Captain, Player, CommitteeMember, CommitteeChair]
    code: 200
    input: []
    output: Scorecard
    side_effects: []

  - method: GET
    path: "/tennis/scorecards"
    description: "List Scorecards (reverse lookup for Scorecard.match_id, Scorecard.submitted_by_team_id, Scorecard.submitted_by_captain_player_id and Scorecard.verified_by_captain_player_id)"
    roles: [SectionAdmin, LeagueCoordinator, Captain, Player, CommitteeMember, CommitteeChair]
    code: 200
    input: ["match_id?", "submitted_by_team_id?", "submitted_by_captain_player_id?", "verified_by_captain_player_id?", "status?", "limit?", "offset?"]
    output: Scorecard[]
    side_effects: []

  - method: POST
    path: "/tennis/scorecards/{id}/review"
    description: "Opposing-captain review. decision=VERIFY takes the scorecard to VERIFIED and the match to VERIFIED with the full five-level cascade; decision=DISPUTE takes it to DISPUTED and withdraws the provisional standings contribution."
    roles: [Captain]
    code: 200
    input: [decision, "dispute_reason?", "disputed_line_numbers?"]
    output: Scorecard
    side_effects:
      - "the actor must captain the side that did NOT submit, else ERR_SELF_VERIFICATION_FORBIDDEN"
      - "VERIFY: verified_by_captain_player_id and verified_at written; Match.result_status=VERIFIED; calculations.match_default_resolution credits every line; both Teams, every credited Player, every corresponding RosterSpot and each Team's playoff_eligible_roster_size recomputed"
      - "DISPUTE: dispute_reason and disputed_line_numbers written; Match.result_status=DISPUTED; this match leaves both standings bases"
      - "Scorecard.version and Match.version incremented by 1"

  - method: POST
    path: "/tennis/scorecards/{id}/amend"
    description: "Submitting captain rewrites the disputed lines (DISPUTED -> AMENDED, match DISPUTED -> REPORTED). At most two amendments."
    roles: [Captain]
    code: 200
    input: [lines]
    output: Scorecard
    side_effects:
      - "rejected with ERR_AMENDMENT_LIMIT_REACHED once amendment_count == 2"
      - "lines overwritten, amendment_count incremented by 1, status=AMENDED; Match.result_status=REPORTED"
      - "provisional standings recomputed for both teams; Scorecard.version and Match.version incremented by 1"

  # ----------------------------------------------------------------- Strike ---
  - method: POST
    path: "/tennis/strikes"
    description: "Issue a strike. The weight is derived from kind (SELF_RATE_VIOLATION 2, INELIGIBLE_LINEUP 2, NO_SHOW_DEFAULT 1, SCORECARD_FALSIFICATION 3) and the weighted ledger may suspend or disqualify the player in the same request."
    roles: [LeagueCoordinator, CommitteeChair]
    code: 201
    input: [player_id, "match_id?", kind, reason]
    output: Strike
    side_effects:
      - "weight derived from kind; status=ACTIVE; version=1"
      - "Player.strike_count recomputed by calculations.strike_weight_ledger"
      - "at Section.strike_limit the Player -> STRIKE_SUSPENDED and every ACTIVE RosterSpot of that player -> INELIGIBLE with ineligible_reason=PLAYER_SUSPENDED and source_strike_id = this strike"
      - "at Section.disqualification_strike_limit the Player -> DISQUALIFIED (terminal)"
      - "each affected Team recomputes active_roster_size, playoff_eligible_roster_size and roster_compliant; each affected League recomputes noncompliant_team_count"
      - "Player.version and each affected Team.version incremented by 1"

  - method: GET
    path: "/tennis/strikes/{id}"
    description: "Get a Strike"
    roles: [SectionAdmin, LeagueCoordinator, Captain, Player, CommitteeMember, CommitteeChair]
    code: 200
    input: []
    output: Strike
    side_effects: []

  - method: GET
    path: "/tennis/strikes"
    description: "List Strikes (reverse lookup for Strike.player_id, Strike.match_id and Strike.source_grievance_id)"
    roles: [SectionAdmin, LeagueCoordinator, Captain, Player, CommitteeMember, CommitteeChair]
    code: 200
    input: ["player_id?", "match_id?", "source_grievance_id?", "kind?", "status?", "limit?", "offset?"]
    output: Strike[]
    side_effects: []

  - method: POST
    path: "/tennis/strikes/{id}/rescind"
    description: "Committee rescission (ACTIVE -> RESCINDED). The compensating action: the weighted ledger returns to its pre-issue value and only the roster spots whose source_strike_id is this strike are restored."
    roles: [CommitteeChair]
    code: 200
    input: [rescinded_reason]
    output: Strike
    side_effects:
      - "status=RESCINDED; Player.strike_count recomputed"
      - "when the ledger falls below Section.strike_limit the Player returns to ACTIVE and every INELIGIBLE RosterSpot with ineligible_reason=PLAYER_SUSPENDED AND source_strike_id == this strike returns to ACTIVE with both fields cleared"
      - "a DISQUALIFIED player keeps that status and keeps its spots INELIGIBLE — the documented asymmetry of the compensating action"
      - "each affected Team recomputes active_roster_size and roster_compliant; Player.version, Strike.version and each affected Team.version incremented by 1"

  # ----------------------------------------------------------- RatingAppeal ---
  - method: POST
    path: "/tennis/rating-appeals"
    description: "File a rating appeal on the actor's own record. Pins rating_level, dynamic_rating, verified_match_count and strike_count at filing and evaluates calculations.appeal_auto_grant_evaluation against those pinned values."
    roles: [Player]
    code: 201
    input: [player_id, direction, requested_level, reason]
    output: RatingAppeal
    side_effects:
      - "player_id must equal X-User-ID, else ERR_NOT_SELF"
      - "rating_level_at_filing, dynamic_rating_at_filing, verified_match_count_at_filing and strike_count_at_filing pinned"
      - "auto_grant_eligible computed; status=SUBMITTED; vote counts 0; version=1"

  - method: GET
    path: "/tennis/rating-appeals/{id}"
    description: "Get a RatingAppeal with its pinned snapshots, auto_grant_eligible and vote tallies"
    roles: [SectionAdmin, LeagueCoordinator, Player, CommitteeMember, CommitteeChair]
    code: 200
    input: []
    output: RatingAppeal
    side_effects: []

  - method: GET
    path: "/tennis/rating-appeals"
    description: "List RatingAppeals (reverse lookup for RatingAppeal.player_id and RatingAppeal.decided_by_chair_player_id)"
    roles: [SectionAdmin, LeagueCoordinator, Player, CommitteeMember, CommitteeChair]
    code: 200
    input: ["player_id?", "decided_by_chair_player_id?", "direction?", "status?", "auto_grant_eligible?", "limit?", "offset?"]
    output: RatingAppeal[]
    side_effects: []

  - method: POST
    path: "/tennis/rating-appeals/{id}/start-review"
    description: "SUBMITTED -> UNDER_REVIEW; opens the appeal to committee votes"
    roles: [CommitteeChair]
    code: 200
    input: []
    output: RatingAppeal
    side_effects: ["status=UNDER_REVIEW; RatingAppeal.version incremented by 1"]

  - method: POST
    path: "/tennis/rating-appeals/{id}/decide"
    description: "UNDER_REVIEW -> GRANTED or DENIED. GRANT needs auto_grant_eligible or the committee quorum; DENY is forbidden when auto_grant_eligible is true. A chair that voted on the subject may not decide it."
    roles: [CommitteeChair]
    code: 200
    input: [outcome, "decision_note?"]
    output: RatingAppeal
    side_effects:
      - "GRANT: granted_level = requested_level; Player.rating_level = requested_level; Player.rating_type=APPEAL_GRANTED; an APPEAL rating_history entry appended"
      - "GRANT with direction UP: every ACTIVE RosterSpot of the player whose league ntrp_level is below the new level -> INELIGIBLE with ineligible_reason=APPEAL_GRANTED, then each Team and each League recomputes its counters"
      - "DENY: no Player field is touched"
      - "decided_by_chair_player_id and decided_at written; RatingAppeal.version incremented by 1 (Player.version too on GRANT)"

  # -------------------------------------------------------------- Grievance ---
  - method: POST
    path: "/tennis/grievances"
    description: "Captain files a grievance against another team of the same league inside Section.grievance_window_hours"
    roles: [Captain]
    code: 201
    input: [league_id, against_team_id, "subject_match_id?", kind, "remedy_target_player_id?", statement]
    output: Grievance
    side_effects:
      - "filed_by_captain_player_id = X-User-ID; the filer may not captain against_team_id"
      - "status=FILED; remedy=null; vote counts 0; version=1"

  - method: GET
    path: "/tennis/grievances/{id}"
    description: "Get a Grievance with its remedy and vote tallies"
    roles: [SectionAdmin, LeagueCoordinator, Captain, CommitteeMember, CommitteeChair]
    code: 200
    input: []
    output: Grievance
    side_effects: []

  - method: GET
    path: "/tennis/grievances"
    description: "List Grievances (reverse lookup for Grievance.league_id, Grievance.filed_by_captain_player_id, Grievance.against_team_id, Grievance.subject_match_id, Grievance.remedy_target_player_id and Grievance.decided_by_chair_player_id)"
    roles: [SectionAdmin, LeagueCoordinator, Captain, CommitteeMember, CommitteeChair]
    code: 200
    input: ["league_id?", "filed_by_captain_player_id?", "against_team_id?", "subject_match_id?", "remedy_target_player_id?", "decided_by_chair_player_id?", "kind?", "status?", "limit?", "offset?"]
    output: Grievance[]
    side_effects: []

  - method: POST
    path: "/tennis/grievances/{id}/start-review"
    description: "FILED -> UNDER_REVIEW; opens the grievance to committee votes"
    roles: [CommitteeChair]
    code: 200
    input: []
    output: Grievance
    side_effects: ["status=UNDER_REVIEW; Grievance.version incremented by 1"]

  - method: POST
    path: "/tennis/grievances/{id}/withdraw"
    description: "FILED -> WITHDRAWN by the filing captain"
    roles: [Captain]
    code: 200
    input: []
    output: Grievance
    side_effects: ["status=WITHDRAWN; Grievance.version incremented by 1"]

  - method: POST
    path: "/tennis/grievances/{id}/decide"
    description: "UNDER_REVIEW -> UPHELD (with a remedy) or DISMISSED. Each remedy drives a different cascade family: MATCH_FORFEIT voids and re-credits the match, PLAYER_STRIKE issues a strike, TEAM_DISQUALIFICATION freezes the team."
    roles: [CommitteeChair]
    code: 200
    input: [outcome, "remedy?", "decision_note?"]
    output: Grievance
    side_effects:
      - "UPHOLD requires the quorum and an admissible remedy for kind, else ERR_QUORUM_NOT_MET or ERR_REMEDY_NOT_ADMISSIBLE"
      - "MATCH_FORFEIT: Match.result_status -> VOIDED, prior credits reversed, forfeit credit of League.lines_per_match lines at 6-0 6-0 awarded to the aggrieved team, Scorecard -> VOIDED, every affected Player and RosterSpot recomputed, calculations.league_standings_ledger_invariant re-asserted"
      - "PLAYER_STRIKE: a Strike is created for remedy_target_player_id with source_grievance_id set, running the full strike cascade; for kind RATING_VIOLATION the target level is additionally raised 0.5 (capped 5.0) with rating_type=COMMITTEE_ASSIGNED and a COMMITTEE rating_history entry"
      - "TEAM_DISQUALIFICATION: Team -> DISQUALIFIED, its ACTIVE spots -> INELIGIBLE with ineligible_reason=GRIEVANCE_REMEDY, its uncontested matches CANCELLED, already verified results retained"
      - "DISMISS: nothing outside the Grievance row is touched"
      - "decided_by_chair_player_id and decided_at written; Grievance.version incremented by 1"

  # ---------------------------------------------------------- CommitteeVote ---
  - method: POST
    path: "/tennis/committee-votes"
    description: "Cast a committee vote on a RatingAppeal or a Grievance while the subject is UNDER_REVIEW. One vote per member per subject; interested parties are barred."
    roles: [CommitteeMember]
    code: 201
    input: [subject_type, subject_id, vote, "note?"]
    output: CommitteeVote
    side_effects:
      - "voter_player_id = X-User-ID; append-only record, no version field"
      - "the subject recomputes support_vote_count and oppose_vote_count (ABSTAIN counts toward neither) and its version is incremented by 1"

  - method: GET
    path: "/tennis/committee-votes/{id}"
    description: "Get a CommitteeVote"
    roles: [SectionAdmin, CommitteeChair, CommitteeMember]
    code: 200
    input: []
    output: CommitteeVote
    side_effects: []

# =============================================================================
# 1.6  ERROR CATALOG — 70 codes. Every id referenced by §1.2, §1.3, §1.4 or
# §1.5 appears here exactly once, with the http status the validation table
# assigns it.
# =============================================================================
errors:
  # --- 400 malformed request ---
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset < 0"
  - id: ERR_MISSING_EXPECTED_VERSION
    http: 400
    condition: "expected_team_version or expected_match_version absent on an OCC-guarded write"
  # --- 401 authentication ---
  - id: ERR_MISSING_ROLE_HEADER
    http: 401
    condition: "X-User-Role header absent or empty"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the six roles in §1.7"
  - id: ERR_MISSING_USER_ID
    http: 401
    condition: "X-User-ID absent, or not resolvable to a Player, while acting as Captain, Player, CommitteeMember or CommitteeChair"
  # --- 403 authorization and segregation of duties ---
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "X-User-Role is not listed in the endpoint's roles"
  - id: ERR_ACTOR_DISQUALIFIED
    http: 403
    condition: "The acting Player of an entity-backed role is in status DISQUALIFIED"
  - id: ERR_NOT_SELF
    http: 403
    condition: "A Player-role actor targets a Player row other than X-User-ID"
  - id: ERR_NOT_TEAM_CAPTAIN
    http: 403
    condition: "A Captain-role actor targets a team it does not captain, or a match neither of whose sides it captains"
  - id: ERR_SOD_INTERESTED_PARTY
    http: 403
    condition: "A CommitteeMember votes on a subject in which it is the appellant, the filer, the remedy target, or the captain of the accused team"
  - id: ERR_CHAIR_VOTED_ON_SUBJECT
    http: 403
    condition: "A CommitteeChair that cast a CommitteeVote on this subject attempts to decide it"
  # --- 404 existence ---
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path id does not resolve; path ids are validated left to right"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "A payload FK does not resolve to an existing row of the referenced entity"
  - id: ERR_SECTION_SCOPE_MISMATCH
    http: 404
    condition: "A resolved payload FK belongs to a different Section than the target resource"
  # --- 409 state preconditions ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "No §1.2 transition is declared from the resource's current state for this action"
  - id: ERR_LEAGUE_PHASE_FORBIDS_ROSTER_CHANGE
    http: 409
    condition: "League.status does not admit the requested registration or roster change"
  - id: ERR_LEAGUE_NOT_IN_PLAY
    http: 409
    condition: "League.status is not ROSTERS_LOCKED, IN_PLAY or PLAYOFFS for a match creation, schedule, confirm or mark-played"
  - id: ERR_LEAGUE_ALREADY_TERMINAL
    http: 409
    condition: "League.status is COMPLETED or CANCELLED, or the lifecycle endpoint does not match the current stage"
  - id: ERR_MATCH_SCHEDULE_STATE_INVALID
    http: 409
    condition: "Match.schedule_status does not admit the requested action"
  - id: ERR_MATCH_RESULT_STATE_INVALID
    http: 409
    condition: "Match.result_status does not admit the requested action; FINALIZED and VOIDED admit nothing"
  - id: ERR_SCORECARD_STATE_FORBIDS_ACTION
    http: 409
    condition: "Scorecard.status is not SUBMITTED or AMENDED for a review, or not DISPUTED for an amendment"
  - id: ERR_RECALC_PHASE_INVALID
    http: 409
    condition: "Section.rating_period_status is not OPEN_SEASON at year-end-recalc, or not RECALC_IN_PROGRESS at publish-recalc"
  - id: ERR_APPEAL_STATE_FORBIDS_ACTION
    http: 409
    condition: "RatingAppeal.status is not SUBMITTED for start-review or not UNDER_REVIEW for decide"
  - id: ERR_GRIEVANCE_STATE_FORBIDS_ACTION
    http: 409
    condition: "Grievance.status is not FILED for start-review or withdraw, or not UNDER_REVIEW for decide"
  - id: ERR_SUBJECT_NOT_UNDER_REVIEW
    http: 409
    condition: "A CommitteeVote is cast while the subject is not UNDER_REVIEW"
  - id: ERR_TEAM_STATE_INVALID
    http: 409
    condition: "Team.status does not admit the action; WITHDRAWN and DISQUALIFIED teams are frozen"
  - id: ERR_TEAM_ROSTER_NONCOMPLIANT
    http: 409
    condition: "A side of the match has roster_compliant == false at confirm time"
  - id: ERR_RATING_PERIOD_CLOSED
    http: 409
    condition: "Section.rating_period_status is not OPEN_SEASON for a rating write, roster change or appeal grant"
  # --- 409 business constraints, referential integrity and capacity ---
  - id: ERR_DUPLICATE_ROSTER_SPOT
    http: 409
    condition: "The player already holds a RosterSpot in PENDING, ACTIVE or INELIGIBLE somewhere in the same league"
  - id: ERR_APPEAL_ALREADY_OPEN
    http: 409
    condition: "The player already holds a RatingAppeal in SUBMITTED or UNDER_REVIEW"
  - id: ERR_DUPLICATE_VOTE
    http: 409
    condition: "The CommitteeMember already voted on this (subject_type, subject_id)"
  - id: ERR_AMENDMENT_LIMIT_REACHED
    http: 409
    condition: "Scorecard.amendment_count is already 2"
  - id: ERR_SELF_VERIFICATION_FORBIDDEN
    http: 409
    condition: "The submitting captain attempts the review, or a non-submitting captain attempts the amendment"
  - id: ERR_SCORECARD_ALREADY_OPEN
    http: 409
    condition: "The match already has a Scorecard in SUBMITTED, DISPUTED or AMENDED"
  - id: ERR_FACILITY_COURTS_EXCEEDED
    http: 409
    condition: "calculations.court_slot_capacity — overlapping occupancies plus the requested courts exceed Facility.court_count"
  - id: ERR_TEAM_DATE_CONFLICT
    http: 409
    condition: "calculations.team_calendar_conflict — the team already plays on that UTC date, or within 240 minutes when doubleheaders are allowed"
  - id: ERR_APPEAL_BASELINE_STALE
    http: 409
    condition: "Player.rating_level no longer equals RatingAppeal.rating_level_at_filing at decision time"
  - id: ERR_ROSTER_SPOT_HAS_RESULTS
    http: 409
    condition: "A captain removal targets a RosterSpot with verified_match_count > 0"
  - id: ERR_TEAM_HAS_VERIFIED_RESULTS
    http: 409
    condition: "A withdrawal targets a team that owns a match in result_status VERIFIED"
  - id: ERR_ROSTER_SIZE_EXCEEDED
    http: 409
    condition: "The add or activation would push PENDING plus ACTIVE spots above League.max_roster_size"
  - id: ERR_LEAGUE_TEAM_CAPACITY_REACHED
    http: 409
    condition: "League.registered_team_count is already League.max_teams"
  - id: ERR_ROSTER_QUOTA_NOT_MET
    http: 409
    condition: "lock-rosters with fewer than two registered teams, or start-play with fewer than two roster-compliant teams"
  - id: ERR_ADVANCEMENT_SLOTS_EXHAUSTED
    http: 409
    condition: "The parent league has no room for the teams advance-teams would promote"
  # --- 412 optimistic concurrency ---
  - id: ERR_STALE_TEAM_VERSION
    http: 412
    condition: "expected_team_version does not equal Team.version"
  - id: ERR_STALE_MATCH_VERSION
    http: 412
    condition: "expected_match_version does not equal Match.version"
  # --- 422 payload, safety, referential and temporal rules ---
  - id: ERR_VALIDATION
    http: 422
    condition: "Missing required field, unknown field, wrong type, or an enum value outside the declared set"
  - id: ERR_INVALID_RATING_LEVEL
    http: 422
    condition: "A supplied or requested level is not a multiple of 0.5 within [2.5, 5.0]"
  - id: ERR_SCORECARD_LINE_INVALID
    http: 422
    condition: "Line count, line_number set, player pairing or set scores are not legal for the league format"
  - id: ERR_PLAYER_NOT_PLAYABLE
    http: 422
    condition: "The player is STRIKE_SUSPENDED or DISQUALIFIED"
  - id: ERR_AGE_GROUP_NOT_MET
    http: 422
    condition: "The player's league age is below the League.age_group minimum"
  - id: ERR_RATING_LEVEL_EXCEEDS_LEAGUE
    http: 422
    condition: "rating_type is UNRATED, or rating_level lies outside the band [League.ntrp_level - 1.0, League.ntrp_level]"
  - id: ERR_FORMAT_GENDER_MISMATCH
    http: 422
    condition: "Player.gender is inadmissible for League.format, or a MIXED_DOUBLES line does not pair one M and one F per side"
  - id: ERR_SELF_RATING_LOCKED
    http: 422
    condition: "A SELF-sourced rating is attempted on a player whose rating_type is already COMPUTER_RATED, APPEAL_GRANTED or COMMITTEE_ASSIGNED"
  - id: ERR_INELIGIBLE_LINEUP
    http: 422
    condition: "A named player does not hold an ACTIVE RosterSpot on the side fielding the line, or appears on two lines of the match"
  - id: ERR_PLAYER_DISQUALIFIED_PERMANENT
    http: 422
    condition: "A rescission is asked to undo a disqualification"
  - id: ERR_TEAM_LEAGUE_MISMATCH
    http: 422
    condition: "home_team_id or away_team_id is not in the match's league, or the two ids are equal"
  - id: ERR_FACILITY_SECTION_MISMATCH
    http: 422
    condition: "The facility belongs to a different Section than the league"
  - id: ERR_LEAGUE_LADDER_INVALID
    http: 422
    condition: "parent_league_id violates the tier ladder, the level/age/format match, or the null-iff-SECTION rule"
  - id: ERR_SUBJECT_TYPE_MISMATCH
    http: 422
    condition: "CommitteeVote.subject_id does not resolve inside the entity named by subject_type"
  - id: ERR_GRIEVANCE_SUBJECT_INVALID
    http: 422
    condition: "subject_match_id presence, ownership or remedy_target_player_id roster membership is wrong for Grievance.kind"
  - id: ERR_REMEDY_NOT_ADMISSIBLE
    http: 422
    condition: "The chosen remedy is not admissible for Grievance.kind or for the current state of its target"
  - id: ERR_QUORUM_NOT_MET
    http: 422
    condition: "support_vote_count < 2 or support_vote_count <= oppose_vote_count on a decision that needs the committee"
  - id: ERR_AUTO_GRANT_MUST_BE_GRANTED
    http: 422
    condition: "DENY is attempted on an appeal whose auto_grant_eligible is true"
  - id: ERR_NO_PLAYOFF_ELIGIBLE_TEAMS
    http: 422
    condition: "Fewer than two seeding candidates, or advance-teams before a completed seeding"
  - id: ERR_OUTSIDE_REGISTRATION_WINDOW
    http: 422
    condition: "current_utc is outside [registration_opens_at, registration_closes_at)"
  - id: ERR_MATCH_START_OUTSIDE_WINDOW
    http: 422
    condition: "scheduled_start_at is in the past, or on the wrong side of League.season_end_at for the match stage"
  - id: ERR_SCORECARD_WINDOW_EXPIRED
    http: 422
    condition: "current_utc is past scheduled_end_at plus Section.scorecard_submission_window_hours"
  - id: ERR_DISPUTE_WINDOW_EXPIRED
    http: 422
    condition: "current_utc is past Scorecard.updated_at plus Section.scorecard_dispute_window_hours"
  - id: ERR_MATCH_NOT_YET_PLAYABLE
    http: 422
    condition: "mark-played before scheduled_end_at, or a default before scheduled_start_at"
  - id: ERR_GRIEVANCE_WINDOW_EXPIRED
    http: 422
    condition: "current_utc is past the subject anchor plus Section.grievance_window_hours"
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "The supplied current_utc is earlier than the logical clock's current value"

# =============================================================================
# 1.7  RBAC MATRIX — segregation of duties
# The committee is split in two: CommitteeMember may vote but never decide,
# CommitteeChair may decide but is barred from deciding anything it voted on.
# Captains own their own team's roster and reporting; the coordinator owns the
# competition calendar; the section admin owns the rating epoch.
# =============================================================================
roles:
  - name: SectionAdmin
    description: "Section operator. Owns section setup, facilities, leagues, player registration and the two-phase year-end rating recalculation. Never reports a result and never decides an appeal or grievance."
    identity: "opaque"
    exclusive_operations:
      - "POST /tennis/sections — Create a section"
      - "POST /tennis/facilities — Create a facility"
      - "POST /tennis/leagues — Create a league at a tier"
      - "POST /tennis/leagues/{id}/open-registration — Open registration"
      - "POST /tennis/sections/{id}/year-end-recalc — Phase 1 of the year-end recalculation"
      - "POST /tennis/sections/{id}/publish-recalc — Phase 2, applying levels and cascading rosters"
      - "POST /tennis/_clock/set_current_utc — Move the logical clock forward"
    shared_operations:
      - "POST /tennis/players — Register a player (with LeagueCoordinator)"
      - "GET /tennis/sections, GET /tennis/sections/{id}, GET /tennis/sections/{id}/facilities"
      - "GET on every collection and single-resource read endpoint of §1.5"

  - name: LeagueCoordinator
    description: "Competition operator of the leagues. Owns the calendar (fixtures, slots, mark-played, defaults), the league lifecycle from lock-rosters onward, computer ratings and coordinator-issued strikes. Cannot create sections, leagues or facilities, and cannot decide committee matters."
    identity: "opaque"
    exclusive_operations:
      - "POST /tennis/leagues/{id}/lock-rosters — Lock rosters and drop pending spots"
      - "POST /tennis/leagues/{id}/start-play — Promote roster-compliant teams into play"
      - "POST /tennis/leagues/{id}/seed-playoffs — Freeze standings and write seeds"
      - "POST /tennis/leagues/{id}/advance-teams — Promote seeds into the parent tier"
      - "POST /tennis/matches — Create a fixture"
      - "POST /tennis/matches/{id}/schedule — Write or supersede a slot (OCC on Match.version)"
      - "POST /tennis/matches/{id}/mark-played — Close the playing window"
      - "POST /tennis/matches/{id}/default — Record a default and credit the lines"
    shared_operations:
      - "POST /tennis/players — Register a player (with SectionAdmin)"
      - "POST /tennis/players/{id}/ratings with source=COMPUTER — Assign a computer rating (the Player role may only use source=SELF)"
      - "POST /tennis/strikes — Issue a strike (with CommitteeChair)"
      - "GET on every collection and single-resource read endpoint of §1.5"

  - name: Captain
    description: "Team captain, backed by the Player row named in captain_player_id. Owns team creation and registration, roster composition, match confirmation, scorecard submission, review and amendment, and grievance filing — always restricted to a team it captains."
    identity: "entity_backed:Player"
    exclusive_operations:
      - "POST /tennis/teams — Create a team (the actor becomes captain_player_id)"
      - "POST /tennis/teams/{id}/register — Register the team inside the window"
      - "POST /tennis/teams/{id}/withdraw — Withdraw the team"
      - "POST /tennis/roster-spots — Add a player (OCC on Team.version)"
      - "POST /tennis/roster-spots/{id}/activate — Activate a spot through every eligibility rule"
      - "DELETE /tennis/roster-spots/{id} — Remove a spot with no verified match"
      - "POST /tennis/matches/{id}/confirm — Home captain confirms the slot"
      - "POST /tennis/scorecards — Submit the result"
      - "POST /tennis/scorecards/{id}/review — Opposing captain verifies or disputes"
      - "POST /tennis/scorecards/{id}/amend — Submitting captain rewrites disputed lines"
      - "POST /tennis/grievances — File a grievance against another team"
      - "POST /tennis/grievances/{id}/withdraw — Withdraw its own grievance"
    shared_operations:
      - "GET /tennis/sections/{id}, GET /tennis/sections/{id}/facilities, GET /tennis/facilities/{id}"
      - "GET /tennis/leagues, GET /tennis/leagues/{id}, GET /tennis/leagues/{id}/standings"
      - "GET /tennis/players, GET /tennis/players/{id}, GET /tennis/teams, GET /tennis/teams/{id}"
      - "GET /tennis/roster-spots, GET /tennis/roster-spots/{id}, GET /tennis/matches, GET /tennis/matches/{id}"
      - "GET /tennis/scorecards, GET /tennis/scorecards/{id}, GET /tennis/strikes, GET /tennis/strikes/{id}"
      - "GET /tennis/grievances, GET /tennis/grievances/{id}"

  - name: Player
    description: "An individual player acting on its own record only. May self-rate once and may file a rating appeal on itself. Holds no team authority even when the same Player row also captains a team — the Captain role is what carries roster and reporting rights."
    identity: "entity_backed:Player"
    exclusive_operations:
      - "POST /tennis/players/{id}/ratings with source=SELF — One-time self-rating of its own record"
      - "POST /tennis/rating-appeals — File an appeal on its own rating"
    shared_operations:
      - "GET /tennis/sections/{id}, GET /tennis/leagues, GET /tennis/leagues/{id}, GET /tennis/leagues/{id}/standings"
      - "GET /tennis/players/{id}, GET /tennis/teams, GET /tennis/teams/{id}"
      - "GET /tennis/roster-spots, GET /tennis/roster-spots/{id}, GET /tennis/matches, GET /tennis/matches/{id}"
      - "GET /tennis/scorecards, GET /tennis/scorecards/{id}, GET /tennis/strikes, GET /tennis/strikes/{id}"
      - "GET /tennis/rating-appeals, GET /tennis/rating-appeals/{id}"

  - name: CommitteeMember
    description: "Voting member of the section committee, backed by a Player row. May cast exactly one vote per subject and only while the subject is UNDER_REVIEW; barred from voting on any subject in which it is an interested party. Never decides, never issues or rescinds a strike."
    identity: "entity_backed:Player"
    exclusive_operations:
      - "POST /tennis/committee-votes — Cast one SUPPORT, OPPOSE or ABSTAIN vote per subject"
    shared_operations:
      - "GET /tennis/players/{id}/committee-votes, GET /tennis/committee-votes/{id}"
      - "GET /tennis/rating-appeals, GET /tennis/rating-appeals/{id}"
      - "GET /tennis/grievances, GET /tennis/grievances/{id}"
      - "GET /tennis/players, GET /tennis/players/{id}, GET /tennis/teams, GET /tennis/teams/{id}"
      - "GET /tennis/matches, GET /tennis/matches/{id}, GET /tennis/scorecards, GET /tennis/scorecards/{id}"
      - "GET /tennis/roster-spots, GET /tennis/roster-spots/{id}, GET /tennis/strikes, GET /tennis/strikes/{id}"

  - name: CommitteeChair
    description: "Chair of the section committee, backed by a Player row. Opens reviews, decides appeals and grievances, and rescinds strikes. May not vote and decide on the same subject — a chair that cast a CommitteeVote on the subject is refused at decide time with ERR_CHAIR_VOTED_ON_SUBJECT."
    identity: "entity_backed:Player"
    exclusive_operations:
      - "POST /tennis/rating-appeals/{id}/start-review — Open an appeal to the committee"
      - "POST /tennis/rating-appeals/{id}/decide — Grant or deny an appeal"
      - "POST /tennis/grievances/{id}/start-review — Open a grievance to the committee"
      - "POST /tennis/grievances/{id}/decide — Uphold with a remedy, or dismiss"
      - "POST /tennis/strikes/{id}/rescind — Rescind a strike and restore only its own roster consequences"
    shared_operations:
      - "POST /tennis/strikes — Issue a strike (with LeagueCoordinator)"
      - "GET /tennis/players/{id}/committee-votes, GET /tennis/committee-votes/{id}"
      - "GET /tennis/rating-appeals, GET /tennis/rating-appeals/{id}"
      - "GET /tennis/grievances, GET /tennis/grievances/{id}"
      - "GET /tennis/players, GET /tennis/players/{id}, GET /tennis/teams, GET /tennis/teams/{id}"
      - "GET /tennis/matches, GET /tennis/matches/{id}, GET /tennis/scorecards, GET /tennis/scorecards/{id}"
      - "GET /tennis/roster-spots, GET /tennis/roster-spots/{id}, GET /tennis/strikes, GET /tennis/strikes/{id}"
