      - name: ccl_reserve_funding_bumps_the_facility_version_and_staleness_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[revenue-statement-create-stale-facility]
          - errors[ERR_STALE_VERSION]
          - endpoints[POST /facilities/{id}/reserve-funding]
        distinguishing_aspect: >
          The settlement waterfall reads reserve_balance_cents, so any equity injection
          invalidates a client's view: the pre-funding version is refused with 412 and the
          post-funding version produces a statement whose sweep is computed against the
          new 500000 balance.
        test_recipe:
          setup:
            - "Canonical plant whose version was captured at creation, then 500000 cents of equity injected into the reserve."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /facilities"
              payload: { name: "Tulare Digester 1", digester_volume_m3: 6000.000, hydraulic_capacity_tonnes_per_day: 500.000, thermal_regime: "MESOPHILIC", target_temperature_c: 38.0, reserve_target_cents: 4000000, annual_debt_service_cents: 18000000, dscr_minimum: 1.250 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { facility_id: "$.data.id", facility_v_old: "$.data.version" }
            - call: "POST /facilities/${facility_id}/reserve-funding"
              payload: { amount_cents: 500000, memo: "Sponsor equity contribution" }
              as: FinanceController
              as_user_id: "u-fin-a"
              captures: { facility_v_new: "$.data.version" }
          trigger:
            - call: "POST /revenue-statements"
              payload: { facility_id: "${facility_id}", period_start_date: "2026-08-01", period_end_date: "2026-08-31", gas_revenue_cents: 2010000, expected_facility_version: "${facility_v_old}" }
              as: FinanceController
              as_user_id: "u-fin-a"
              captures: { err_stale: "$.data.error_id" }
            - call: "POST /revenue-statements"
