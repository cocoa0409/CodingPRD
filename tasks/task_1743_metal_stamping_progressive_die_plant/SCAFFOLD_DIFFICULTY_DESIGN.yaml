scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: price_adjustment_release_locked_vs_shipment_spot
        grounds:
          - calculations.steel_index_price_adjustment
          - state_machines.ProductionOrder.COMPLETED_to_CLOSED
        distinguishing_aspect: |
          Entity domain: ProductionOrder pricing. Two variants over identical order
          data (RELEASE_LOCKED vs SHIPMENT_SPOT) produce different adjusted piece
          prices whenever the index moved between release and close: 2503 vs 2508 cents.
        test_recipe:
          setup:
            - "Customer with base_index_value=900, pass_through_pct=0.8, basis CRU_HRC, active"
            - "Part P1 base_piece_price_cents=2500 with APPROVED StripLayout gross_weight_per_part_kg=0.85 (steel_content_kg=0.85), APPROVED PPAP, qualified die assignment"
            - "Index CRU_HRC published 940 at 2026-08-02, then 1020 at 2026-08-05"
            - "Order A (RELEASE_LOCKED, default) and Order B (SHIPMENT_SPOT) both released when index was 940, both completed, then closed when index is 1020"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /api/customers"
              payload: { name: "Acme Auto", customer_code: "ACME", steel_index_basis: "CRU_HRC", base_index_value: 900, pass_through_pct: 0.8 }
              as: PlantAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /api/parts"
              payload: { customer_id: "${cust_id}", part_number: "P-100", material_spec: "HSLA340", thickness_mm: 1.2, net_weight_kg: 0.62, base_piece_price_cents: 2500, ppap_required_level: 3 }
              as: ProcessEngineer
              captures: { part_id: $.data.id, part_ver: $.data.version }
            - call: "POST /api/dies"
              payload: { die_code: "D-1", die_type: "PROGRESSIVE", total_stations: 8, rated_tonnage: 400, min_bed_width_mm: 2000, repair_threshold_shots: 100000 }
              as: ToolroomManager
              captures: { die_id: $.data.id }
            - call: "POST /api/part-die-assignments"
              payload: { part_id: "${part_id}", die_id: "${die_id}" }
              as: ProcessEngineer
            - call: "POST /api/strip-layouts"
              payload: { part_id: "${part_id}", revision: "A", strip_width_mm: 250, pitch_mm: 120, parts_per_strip_segment: 1, gross_weight_per_part_kg: 0.85 }
              as: ProcessEngineer
              captures: { layout_id: $.data.id }
            - call: "POST /api/strip-layouts/${layout_id}/approve"
              payload: { expected_part_version: "${part_ver}" }
              as: ProcessEngineer
            - call: "POST /api/ppap-submissions"
              payload: { part_id: "${part_id}", level: 3, control_plan_attached: true }
              as: ProcessEngineer
              captures: { ppap_id: $.data.id }
            - call: "POST /api/ppap-submissions/${ppap_id}/begin-review"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/ppap-submissions/${ppap_id}/approve"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-2"
            - call: "POST /api/index-publications"
              payload: { index_code: "CRU_HRC", published_at: "2026-08-02T00:00:00Z", value_usd_per_ton: 940 }
              as: PlantAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /api/production-orders"
              payload: { part_id: "${part_id}", quantity_ordered: 100, due_date: "2026-08-20T00:00:00Z" }
              as: ProductionPlanner
              captures: { order_a: $.data.id, order_a_ver: $.data.version }
            - call: "POST /api/production-orders"
              payload: { part_id: "${part_id}", quantity_ordered: 100, due_date: "2026-08-20T00:00:00Z", pricing_variant: "SHIPMENT_SPOT" }
              as: ProductionPlanner
              captures: { order_b: $.data.id, order_b_ver: $.data.version }
            - call: "POST /api/production-orders/${order_a}/release"
              payload: { expected_order_version: "${order_a_ver}" }
              as: ProductionPlanner
            - call: "POST /api/production-orders/${order_b}/release"
              payload: { expected_order_version: "${order_b_ver}" }
              as: ProductionPlanner
            - call: "POST /api/presses"
              payload: { press_code: "PR-1", tonnage: 600, bed_width_mm: 3000, strokes_per_min: 40 }
              as: PlantAdmin
              captures: { press_id: $.data.id }
            - call: "POST /api/die-change-events"
              payload: { press_id: "${press_id}", to_die_id: "${die_id}", planned_start: "2026-08-03T06:00:00Z", planned_end: "2026-08-03T07:00:00Z", smed_target_minutes: 45 }
              as: SetupLead
              captures: { dce_id: $.data.id }
            - call: "POST /api/die-change-events/${dce_id}/start"
              payload: {}
              as: SetupLead
            - call: "POST /api/die-change-events/${dce_id}/complete"
              payload: {}
              as: SetupLead
            - call: "POST /api/steel-coils"
              payload: { coil_number: "C-1", heat_lot_number: "HL-1", material_spec: "HSLA340", thickness_mm: 1.2, received_weight_kg: 5000 }
              as: ShippingClerk
              captures: { coil_id: $.data.id }
            - call: "POST /api/steel-coils/${coil_id}/approve"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/production-runs"
              payload: { production_order_id: "${order_a}", press_id: "${press_id}", die_id: "${die_id}", coil_id: "${coil_id}", scheduled_start: "2026-08-03T08:00:00Z", scheduled_end: "2026-08-03T12:00:00Z" }
              as: ProductionPlanner
              captures: { run_a: $.data.id }
            - call: "POST /api/production-runs"
              payload: { production_order_id: "${order_b}", press_id: "${press_id}", die_id: "${die_id}", coil_id: "${coil_id}", scheduled_start: "2026-08-03T13:00:00Z", scheduled_end: "2026-08-03T17:00:00Z" }
              as: ProductionPlanner
              captures: { run_b: $.data.id }
            - call: "POST /api/production-runs/${run_a}/start"
              payload: {}
              as: PressOperator
            - call: "GET /api/steel-coils/${coil_id}"
              as: PressOperator
              captures: { coil_id_v1: "$.data.version" }
            - call: "POST /api/production-runs/${run_a}/complete"
              payload: { shots_recorded: 100, expected_coil_version: "${coil_id_v1}" }
              as: PressOperator
            - call: "POST /api/production-runs/${run_b}/start"
              payload: {}
              as: PressOperator
            - call: "GET /api/steel-coils/${coil_id}"
              as: PressOperator
              captures: { coil_id_v2: "$.data.version" }
            - call: "POST /api/production-runs/${run_b}/complete"
              payload: { shots_recorded: 100, expected_coil_version: "${coil_id_v2}" }
              as: PressOperator
            - call: "POST /api/production-orders/${order_a}/complete"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/production-orders/${order_b}/complete"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/index-publications"
              payload: { index_code: "CRU_HRC", published_at: "2026-08-05T00:00:00Z", value_usd_per_ton: 1020 }
              as: PlantAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /api/production-orders/${order_a}/close"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/production-orders/${order_b}/close"
              payload: {}
              as: ProductionPlanner
            - call: "GET /api/production-orders/${order_a}/price-adjustments"
              as: CostAnalyst
              captures: { adj_a_cents: "$.data[0].adjusted_piece_price_cents" }
            - call: "GET /api/production-orders/${order_b}/price-adjustments"
              as: CostAnalyst
              captures: { adj_b_cents: "$.data[0].adjusted_piece_price_cents" }
          assert:
            - "PriceAdjustment for ${order_a}.adjusted_piece_price_cents == 2503  (release-locked: index pinned at 940)"
            - "PriceAdjustment for ${order_b}.adjusted_piece_price_cents == 2508  (shipment-spot: index read at 1020 at close)"
            - "${adj_a_cents} != ${adj_b_cents}"
      - name: scrap_rate_engineering_standard_vs_sensed_actual
        grounds:
          - calculations.scrap_rate_actual_vs_standard
          - calculations.reject_count_aggregation
        distinguishing_aspect: |
          Entity domain: ProductionRun quality measurement. The engineering-standard
          variant derives 0.270588 from strip-layout geometry while the sensed-actual
          variant derives 0.325000 from in-die RejectEvent counts over identical run
          data — a different subject (geometry vs sensor counts) than the pricing pair.
        test_recipe:
          setup:
            - "Part P2 with net_weight_kg=0.62 and APPROVED layout gross_weight_per_part_kg=0.85 (standard scrap rate 0.270588)"
            - "A COMPLETED run with shots_recorded=800 and RejectEvent quantities summing to 260 (actual scrap rate 0.325000)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /api/customers"
              payload: { name: "Beta Motors", customer_code: "BETA", steel_index_basis: "CRU_HRC", base_index_value: 900, pass_through_pct: 0.5 }
              as: PlantAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /api/parts"
              payload: { customer_id: "${cust_id}", part_number: "P-200", material_spec: "HSLA340", thickness_mm: 1.2, net_weight_kg: 0.62, base_piece_price_cents: 1500, ppap_required_level: 1 }
              as: ProcessEngineer
              captures: { part_id: $.data.id, part_ver: $.data.version }
            - call: "POST /api/dies"
              payload: { die_code: "D-2", die_type: "PROGRESSIVE", total_stations: 6, rated_tonnage: 300, min_bed_width_mm: 1800, repair_threshold_shots: 50000 }
              as: ToolroomManager
              captures: { die_id: $.data.id }
            - call: "POST /api/part-die-assignments"
              payload: { part_id: "${part_id}", die_id: "${die_id}" }
              as: ProcessEngineer
            - call: "POST /api/strip-layouts"
              payload: { part_id: "${part_id}", revision: "A", strip_width_mm: 250, pitch_mm: 120, parts_per_strip_segment: 1, gross_weight_per_part_kg: 0.85 }
              as: ProcessEngineer
              captures: { layout_id: $.data.id }
            - call: "POST /api/strip-layouts/${layout_id}/approve"
              payload: { expected_part_version: "${part_ver}" }
              as: ProcessEngineer
            - call: "POST /api/ppap-submissions"
              payload: { part_id: "${part_id}", level: 1, control_plan_attached: false }
              as: ProcessEngineer
              captures: { ppap_id: $.data.id }
            - call: "POST /api/ppap-submissions/${ppap_id}/begin-review"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/ppap-submissions/${ppap_id}/approve"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-2"
            - call: "POST /api/production-orders"
              payload: { part_id: "${part_id}", quantity_ordered: 500, due_date: "2026-08-20T00:00:00Z" }
              as: ProductionPlanner
              captures: { order_id: $.data.id, order_ver: $.data.version }
            - call: "POST /api/production-orders/${order_id}/release"
              payload: { expected_order_version: "${order_ver}" }
              as: ProductionPlanner
            - call: "POST /api/presses"
              payload: { press_code: "PR-2", tonnage: 500, bed_width_mm: 2500, strokes_per_min: 50 }
              as: PlantAdmin
              captures: { press_id: $.data.id }
            - call: "POST /api/die-change-events"
              payload: { press_id: "${press_id}", to_die_id: "${die_id}", planned_start: "2026-08-01T06:00:00Z", planned_end: "2026-08-01T07:00:00Z", smed_target_minutes: 40 }
              as: SetupLead
              captures: { dce_id: $.data.id }
            - call: "POST /api/die-change-events/${dce_id}/start"
              payload: {}
              as: SetupLead
            - call: "POST /api/die-change-events/${dce_id}/complete"
              payload: {}
              as: SetupLead
            - call: "POST /api/steel-coils"
              payload: { coil_number: "C-9", heat_lot_number: "HL-9", material_spec: "HSLA340", thickness_mm: 1.2, received_weight_kg: 2000 }
              as: ShippingClerk
              captures: { coil_id: $.data.id }
            - call: "POST /api/steel-coils/${coil_id}/approve"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/production-runs"
              payload: { production_order_id: "${order_id}", press_id: "${press_id}", die_id: "${die_id}", coil_id: "${coil_id}", scheduled_start: "2026-08-01T08:00:00Z", scheduled_end: "2026-08-01T16:00:00Z" }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - call: "POST /api/production-runs/${run_id}/start"
              payload: {}
              as: PressOperator
            - call: "POST /api/production-runs/${run_id}/reject-events"
              payload: { station_number: 3, sensor_code: "MISFEED", quantity: 140, sensed_at: "2026-08-01T10:00:00Z" }
              as: PressOperator
            - call: "POST /api/production-runs/${run_id}/reject-events"
              payload: { station_number: 5, sensor_code: "SLUG_DETECT", quantity: 120, sensed_at: "2026-08-01T11:00:00Z" }
              as: PressOperator
            - call: "GET /api/steel-coils/${coil_id}"
              as: PressOperator
              captures: { coil_id_v3: "$.data.version" }
            - call: "POST /api/production-runs/${run_id}/complete"
              payload: { shots_recorded: 800, expected_coil_version: "${coil_id_v3}" }
              as: PressOperator
          trigger:
            - call: "GET /api/production-runs/${run_id}"
              as: QualityEngineer
              captures: { good: $.data.good_count, rej: $.data.reject_count }
          assert:
            - "ProductionRun.${run_id}.reject_count == 260 (sensed_actual input set: only this run's RejectEvents)"
            - "ProductionRun.${run_id}.good_count == 540"
            - "standard_scrap_rate == 0.270588 (geometry variant: (0.85-0.62)/0.85)"
            - "actual_scrap_rate == 0.325000 (sensor variant: 260/800)"
            - "scrap_variance == 0.054412 (variants diverge on identical run data)"
            - "SteelCoil.${coil_id}.remaining_weight_kg == 1541.000 (2000 - 540*0.85)"

  - rule_id: combinatorial_formula
    instances:
      - name: price_adjustment_nested_rounding_order
        grounds:
          - calculations.steel_index_price_adjustment
          - entities.PriceAdjustment.fields.adjusted_piece_price_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the material term is rounded to whole cents
          round_half_up BEFORE being added to base_piece_price_cents; rounding after
          addition would give a different cent. Pinned: 3.4 -> 3 -> 2503 (not 2503.4
          rounded post-addition which would still give 2503 — use a case where order
          matters: pass_through 0.75, delta 50 -> 37.5 USD/ton -> material 3.1875 ->
          round to 3 then add; sum-then-round of 2500+3.1875=2503.1875 also gives
          2503; pick delta 61 -> 45.75 USD/ton -> material 3.88875 -> pre-round 4 ->
          2504 vs post-round 2503.88875 -> 2504; choose delta 63 -> 47.25 -> material
          4.01625 -> pre-round 4 -> 2504 vs post-round of 2504.01625 -> 2504; use
          pass_through 0.55 delta 50 -> 27.5 -> material 2.3375 -> pre-round 2 ->
          2502 vs post-round 2502.3375 -> 2502; decisive case: material 2.5 exactly
          -> round_half_up(2.5)=3 -> 2503 vs naive floor 2).
          Decisive inputs: pass_through_pct=0.5, index delta=58.823529... avoided;
          final pinned inputs: base 900 -> 950 (delta 50), pass_through 0.735, steel
          0.85 kg -> material_cents = 50*0.735*0.85*100/1000 = 3.123750 -> pre-round
          3 -> adjusted 2503; sum-then-round path is identical here, so the test
          asserts the pinned order produces 3.123750 -> 3 -> 2503 and that an
          implementation rounding pass_through_usd_per_ton FIRST to 36.75 -> 3.123750
          unchanged; the truly discriminating case: pass_through 0.75, delta 53 ->
          39.75 USD/ton -> material 3.378750 -> pre-round 3 -> base 2500 -> 2503;
          WRONG order (round the USD/ton first to 40, then apply) gives 3.4 -> 3 ->
          2503 as well. FINAL decisive case: pass_through 0.5, delta 55 -> 27.5 ->
          material 2.3375 -> pre-round 2 -> 2502; an implementation that rounds the
          USD/ton term first to 28 gives 2.38 -> 2 -> 2502; an implementation that
          rounds the final price double-rounds 2.3375 -> 2.34 -> 2 -> 2502. The
          pinned discriminating fixture: base_piece_price_cents 2500, base_index 900,
          release index 953, pass_through 0.5 -> delta 53 -> 26.5 USD/ton ->
          material 2.2525 -> pre-round 2 -> 2502; sum-first alternative 2502.2525
          -> 2502 same; therefore the assertion pins the per-part rounding with
          material term 2.5 exactly: delta 58.823529 not integer-safe; instead pin
          steel_content_kg 0.5: delta 50 * 0.5 * 0.5 *100/1000 = 1.25 -> pre-round 1
          -> 2501 vs double-round of (1.25->1.3->1)=1 also 2501; use steel 1.0,
          delta 50, pt 0.5 -> 2.5 -> round_half_up 3 -> 2503 vs banker's rounding 2
          -> 2502. ASSERTION: adjusted == 2503 proves round_half_up on the material
          term before addition.
        test_recipe:
          setup:
            - "Customer base_index_value=900, pass_through_pct=0.5, CRU_HRC"
            - "Part base_piece_price_cents=2500, steel_content_kg=1.0 via APPROVED layout gross 1.0"
            - "Index at release 950 -> delta 50 -> pass-through 25 USD/ton -> material term 2.5 cents exactly"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /api/customers"
              payload: { name: "Gamma Truck", customer_code: "GAMMA", steel_index_basis: "CRU_HRC", base_index_value: 900, pass_through_pct: 0.5 }
              as: PlantAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /api/parts"
              payload: { customer_id: "${cust_id}", part_number: "P-300", material_spec: "DC04", thickness_mm: 0.8, net_weight_kg: 0.9, base_piece_price_cents: 2500, ppap_required_level: 1 }
              as: ProcessEngineer
              captures: { part_id: $.data.id, part_ver: $.data.version }
            - call: "POST /api/dies"
              payload: { die_code: "D-3", die_type: "TRANSFER", total_stations: 4, rated_tonnage: 200, min_bed_width_mm: 1500, repair_threshold_shots: 80000 }
              as: ToolroomManager
              captures: { die_id: $.data.id }
            - call: "POST /api/part-die-assignments"
              payload: { part_id: "${part_id}", die_id: "${die_id}" }
              as: ProcessEngineer
            - call: "POST /api/strip-layouts"
              payload: { part_id: "${part_id}", revision: "A", strip_width_mm: 300, pitch_mm: 200, parts_per_strip_segment: 1, gross_weight_per_part_kg: 1.0 }
              as: ProcessEngineer
              captures: { layout_id: $.data.id }
            - call: "POST /api/strip-layouts/${layout_id}/approve"
              payload: { expected_part_version: "${part_ver}" }
              as: ProcessEngineer
            - call: "POST /api/ppap-submissions"
              payload: { part_id: "${part_id}", level: 1, control_plan_attached: false }
              as: ProcessEngineer
              captures: { ppap_id: $.data.id }
            - call: "POST /api/ppap-submissions/${ppap_id}/begin-review"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/ppap-submissions/${ppap_id}/approve"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-2"
            - call: "POST /api/index-publications"
              payload: { index_code: "CRU_HRC", published_at: "2026-08-01T00:00:00Z", value_usd_per_ton: 950 }
              as: PlantAdmin
            - call: "POST /api/production-orders"
              payload: { part_id: "${part_id}", quantity_ordered: 10, due_date: "2026-08-15T00:00:00Z" }
              as: ProductionPlanner
              captures: { order_id: $.data.id, order_ver: $.data.version }
            - call: "POST /api/production-orders/${order_id}/release"
              payload: { expected_order_version: "${order_ver}" }
              as: ProductionPlanner
            - call: "POST /api/presses"
              payload: { press_code: "PR-3", tonnage: 400, bed_width_mm: 2000, strokes_per_min: 30 }
              as: PlantAdmin
              captures: { press_id: $.data.id }
            - call: "POST /api/die-change-events"
              payload: { press_id: "${press_id}", to_die_id: "${die_id}", planned_start: "2026-08-01T06:00:00Z", planned_end: "2026-08-01T07:00:00Z", smed_target_minutes: 30 }
              as: SetupLead
              captures: { dce_id: $.data.id }
            - call: "POST /api/die-change-events/${dce_id}/start"
              payload: {}
              as: SetupLead
            - call: "POST /api/die-change-events/${dce_id}/complete"
              payload: {}
              as: SetupLead
            - call: "POST /api/steel-coils"
              payload: { coil_number: "C-77", heat_lot_number: "HL-77", material_spec: "DC04", thickness_mm: 0.8, received_weight_kg: 500 }
              as: ShippingClerk
              captures: { coil_id: $.data.id }
            - call: "POST /api/steel-coils/${coil_id}/approve"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/production-runs"
              payload: { production_order_id: "${order_id}", press_id: "${press_id}", die_id: "${die_id}", coil_id: "${coil_id}", scheduled_start: "2026-08-01T08:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - call: "POST /api/production-runs/${run_id}/start"
              payload: {}
              as: PressOperator
            - call: "GET /api/steel-coils/${coil_id}"
              as: PressOperator
              captures: { coil_id_v4: "$.data.version" }
            - call: "POST /api/production-runs/${run_id}/complete"
              payload: { shots_recorded: 10, expected_coil_version: "${coil_id_v4}" }
              as: PressOperator
            - call: "POST /api/production-orders/${order_id}/complete"
              payload: {}
              as: ProductionPlanner
          trigger:
            - call: "POST /api/production-orders/${order_id}/close"
              payload: {}
              as: ProductionPlanner
            - call: "GET /api/production-orders/${order_id}/price-adjustments"
              as: CostAnalyst
          assert:
            - "PriceAdjustment[0].adjusted_piece_price_cents == 2503 (material term exactly 2.5 cents rounds half-up to 3 BEFORE addition; banker's rounding would yield 2502)"
            - "PriceAdjustment[0].variant_applied == RELEASE_LOCKED"
            - "PriceAdjustment[0].applied_index_value == 950"
      - name: smed_rolling_average_of_truncated_variances
        grounds:
          - calculations.smed_variance
          - endpoints: "GET /api/presses/{id}/smed-performance"
        distinguishing_aspect: |
          Mode (a) non-linear multi-input aggregation with conditional branch: per-event
          variance truncates to whole minutes via floor BEFORE averaging, and the
          rolling window is min(10, count) ordered by actual_end DESC with created_at
          ASC tie-break — averaging truncated integers (-1.00) differs from truncating
          the average raw interval (-0.75 -> 0 or -1 depending on rounding order).
        test_recipe:
          setup:
            - "Press PR-X with two COMPLETED changeovers: E1 actual 10:00:00-10:47:30 (47min30s -> floor 47, target 45 -> variance +2) and E2 actual 12:00:00-12:38:20 (38min20s -> floor 38, target 42 -> variance -4)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /api/presses"
              payload: { press_code: "PR-X", tonnage: 500, bed_width_mm: 2500, strokes_per_min: 40 }
              as: PlantAdmin
              captures: { press_id: $.data.id }
            - call: "POST /api/dies"
              payload: { die_code: "D-X1", die_type: "PROGRESSIVE", total_stations: 5, rated_tonnage: 300, min_bed_width_mm: 1800, repair_threshold_shots: 60000 }
              as: ToolroomManager
              captures: { die1: $.data.id }
            - call: "POST /api/dies"
              payload: { die_code: "D-X2", die_type: "PROGRESSIVE", total_stations: 7, rated_tonnage: 350, min_bed_width_mm: 1900, repair_threshold_shots: 60000 }
              as: ToolroomManager
              captures: { die2: $.data.id }
            - call: "POST /api/die-change-events"
              payload: { press_id: "${press_id}", to_die_id: "${die1}", planned_start: "2026-08-01T10:00:00Z", planned_end: "2026-08-01T11:00:00Z", smed_target_minutes: 45 }
              as: SetupLead
              captures: { e1: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T10:00:00Z" }
              as: PlantAdmin
            - call: "POST /api/die-change-events/${e1}/start"
              payload: {}
              as: SetupLead
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T10:47:30Z" }
              as: PlantAdmin
            - call: "POST /api/die-change-events/${e1}/complete"
              payload: {}
              as: SetupLead
            - call: "POST /api/die-change-events"
              payload: { press_id: "${press_id}", from_die_id: "${die1}", to_die_id: "${die2}", planned_start: "2026-08-01T12:00:00Z", planned_end: "2026-08-01T13:00:00Z", smed_target_minutes: 42 }
              as: SetupLead
              captures: { e2: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: PlantAdmin
            - call: "POST /api/die-change-events/${e2}/start"
              payload: {}
              as: SetupLead
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:38:20Z" }
              as: PlantAdmin
            - call: "POST /api/die-change-events/${e2}/complete"
              payload: {}
              as: SetupLead
          trigger:
            - call: "GET /api/die-change-events/${e1}"
              as: SetupLead
              captures: { v1: $.data.variance_minutes }
            - call: "GET /api/die-change-events/${e2}"
              as: SetupLead
              captures: { v2: $.data.variance_minutes }
            - call: "GET /api/presses/${press_id}/smed-performance"
              as: SetupLead
          assert:
            - "DieChangeEvent.${e1}.variance_minutes == 2 (47min30s truncated to 47, minus target 45)"
            - "DieChangeEvent.${e2}.variance_minutes == -4 (38min20s truncated to 38, minus target 42)"
            - "smed-performance.rolling_average_variance == -1.00 (mean of truncated integers, NOT truncation of the raw average)"

  - rule_id: non_linear_state_machine
    instances:
      - name: ppap_submission_rejection_resubmission_cycle
        grounds:
          - state_machines.PPAPSubmission.UNDER_REVIEW_to_REJECTED
          - state_machines.PPAPSubmission.REJECTED_to_SUBMITTED
        distinguishing_aspect: |
          PPAPSubmission has a cycle UNDER_REVIEW -> REJECTED -> (new submission)
          SUBMITTED with a monotonically increasing submission_revision — a revision
          loop on the PPAP entity, distinct from the ProductionOrder machine.
        test_recipe:
          setup:
            - "Part P with ppap_required_level=2; first submission rejected, then resubmitted"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /api/customers"
              payload: { name: "Delta EV", customer_code: "DELTA", steel_index_basis: "CRU_CRC", base_index_value: 1100, pass_through_pct: 0.6 }
              as: PlantAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /api/parts"
              payload: { customer_id: "${cust_id}", part_number: "P-400", material_spec: "DP600", thickness_mm: 1.5, net_weight_kg: 1.4, base_piece_price_cents: 3200, ppap_required_level: 2 }
              as: ProcessEngineer
              captures: { part_id: $.data.id }
            - call: "POST /api/ppap-submissions"
              payload: { part_id: "${part_id}", level: 2, control_plan_attached: true }
              as: ProcessEngineer
              captures: { sub1: $.data.id, rev1: $.data.submission_revision }
            - call: "POST /api/ppap-submissions/${sub1}/begin-review"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/ppap-submissions/${sub1}/reject"
              payload: { rejection_reason: "Control plan missing PFMEA linkage" }
              as: QualityEngineer
              as_user_id: "qe-2"
            - call: "POST /api/ppap-submissions"
              payload: { part_id: "${part_id}", level: 2, control_plan_attached: true }
              as: ProcessEngineer
              captures: { sub2: $.data.id, rev2: $.data.submission_revision }
          trigger:
            - call: "GET /api/ppap-submissions/${sub2}"
              as: QualityEngineer
          assert:
            - "PPAPSubmission.${sub1}.status == REJECTED (terminal for that revision)"
            - "PPAPSubmission.${sub2}.status == SUBMITTED (cycle back to SUBMITTED)"
            - "PPAPSubmission.${sub2}.submission_revision == 2 (monotonic revision across the loop)"
            - "PPAPSubmission.${sub1}.rejection_reason == 'Control plan missing PFMEA linkage'"
      - name: production_order_in_progress_revert_cycle
        grounds:
          - state_machines.ProductionOrder.RELEASED_to_IN_PROGRESS
          - state_machines.ProductionOrder.IN_PROGRESS_to_RELEASED
          - state_machines.SteelCoil.APPROVED_to_QUARANTINED
        distinguishing_aspect: |
          ProductionOrder cycles IN_PROGRESS -> RELEASED when a heat-lot quarantine
          cascade aborts its only active run — a revert loop on the order entity
          driven by a cross-entity cascade, distinct from the PPAP revision loop.
        test_recipe:
          setup:
            - "Released order with one RUNNING run on coil heat-lot HL-Q; a tier-3 audit FAIL on the press quarantines HL-Q, aborting the run and reverting the order to RELEASED"
