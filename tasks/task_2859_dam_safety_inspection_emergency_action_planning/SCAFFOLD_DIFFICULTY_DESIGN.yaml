            - call: "POST /consequence-assessments"
              payload: { dam_id: "${dam2_id}", population_at_risk: 3, habitable_structures: 2, critical_facilities: 0, breach_peak_outflow_cfs: 7400, breach_travel_time_minutes: 200, inundation_area_acres: 50, inundation_map_ref: "IM-2020-C" }
              as: Engineer
