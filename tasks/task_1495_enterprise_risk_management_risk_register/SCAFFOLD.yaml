# =============================================================================
# SCAFFOLD: Enterprise Risk Management & Risk Register (corporate ERM function)
# =============================================================================

scenario: |
  Enterprise Risk Management & Risk Register (corporate ERM function): risk identification workshops & taxonomy, inherent/residual scoring with likelihood-impact scales, control mapping & effectiveness rating, risk appetite statement & tolerance breach escalation, treatment plan ownership & due dates, emerging risk scanning & scenario analysis, aggregation & board risk reporting, key risk indicator monitoring

domain_name: enterprise-risk-register
api_prefix: "/"   # multi-root API surface: /risks, /controls, /kris, /categories, ...

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - dual_variant_calculation
  entity_topology: graph        # self-referential taxonomy tree + many-to-many Risk<->Control + cross-aggregate FKs
  state_machine_shape: cyclic   # reassessment loops, overdue/extend loops, breach re-open loops, KRI parallel dimensions
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (13 entities)
# =============================================================================
entities:
  - name: TaxonomyCategory
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Category display name" }
      - { name: parent_category_id, type: string, source: input, required: false, description: "FK -> TaxonomyCategory.id; null for root nodes; parent chain must not contain this category (cycle -> ERR_CATEGORY_CYCLE)" }
      - { name: weight_factor, type: number, source: input, default: 1.0, description: "Board-report heat weight for this category; 0 < weight_factor <= 10, up to 3 decimals" }
      - { name: current_tolerance_score, type: integer, source: computed, required: false, description: "tolerance_score of the APPROVED AppetiteStatement whose [effective_from, effective_to) window contains the current logical clock; null when none" }

  - name: Risk
    parent: null
    common_fields: true
    fields:
      - { name: category_id, type: string, source: input, description: "FK -> TaxonomyCategory.id" }
      - { name: source_emerging_risk_id, type: string, source: system, required: false, description: "FK -> EmergingRisk.id; set only when the Risk was created by EmergingRisk promotion" }
      - { name: title, type: string, source: input, description: "Short risk title" }
      - { name: description, type: string, source: input, required: false, description: "Free-text risk description" }
      - { name: owner_user_id, type: string, source: input, description: "Opaque X-User-ID of the accountable RiskOwner; ownership checks compare against X-User-ID" }
      - { name: treatment_budget_cents, type: integer, source: input, default: 0, description: "Total treatment budget in cents; >= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | IDENTIFIED | ASSESSED | TREATMENT | MONITORING | REASSESSMENT | CLOSED" }
      - { name: likelihood, type: integer, source: system, required: false, description: "1-5, from latest INHERENT RiskAssessment; null until first INHERENT assessment" }
      - { name: impact, type: integer, source: system, required: false, description: "1-5, from latest INHERENT RiskAssessment; null until first INHERENT assessment" }
      - { name: inherent_score, type: integer, source: computed, required: false, description: "likelihood * impact (1-25); null until first INHERENT assessment" }
      - { name: inherent_band, type: enum, source: computed, required: false, description: "LOW (1-4) | MEDIUM (5-9) | HIGH (10-15) | CRITICAL (16-25) over inherent_score" }
      - { name: residual_score, type: integer, source: computed, required: false, description: "ceil(inherent_score * (1 - control_discount)); null until inherent known; recomputed on RESIDUAL assessment, mapping approve/retire, control attest/retire" }
      - { name: residual_band, type: enum, source: computed, required: false, description: "LOW | MEDIUM | HIGH | CRITICAL over residual_score using the same band edges" }
      - { name: reserved_treatment_cents, type: integer, source: computed, default: 0, description: "Sum of budget_cents over TreatmentPlans in {APPROVED, IN_PROGRESS, OVERDUE} for this risk" }
      - { name: available_treatment_cents, type: integer, source: computed, description: "treatment_budget_cents - reserved_treatment_cents" }
      - { name: kri_alert, type: boolean, source: computed, default: false, description: "true while any ACTIVE KRI in this risk's category has current_breach_status == RED_BREACH" }

  - name: RiskAssessment
    parent: Risk
    common_fields: false   # append-only event: id + created_at only
    fields:
      - { name: risk_id, type: string, source: system, description: "FK -> Risk.id" }
      - { name: kind, type: enum, source: input, description: "INHERENT | RESIDUAL" }
      - { name: likelihood, type: integer, source: input, required: false, description: "1-5; required when kind=INHERENT, ignored when kind=RESIDUAL" }
      - { name: impact, type: integer, source: input, required: false, description: "1-5; required when kind=INHERENT, ignored when kind=RESIDUAL" }
      - { name: notes, type: string, source: input, required: false, description: "Assessor commentary" }
      - { name: inherent_score, type: integer, source: computed, required: false, description: "Snapshot of risk inherent_score after this assessment (both kinds)" }
      - { name: residual_score, type: integer, source: computed, required: false, description: "Snapshot of risk residual_score after this assessment; only set for kind=RESIDUAL" }
      - { name: breach_created, type: boolean, source: computed, default: false, description: "true when this assessment's residual recompute created a ToleranceBreach" }

  - name: Control
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Control name" }
      - { name: description, type: string, source: input, required: false, description: "What the control does" }
      - { name: effectiveness_pct, type: number, source: input, description: "0 < effectiveness_pct <= 1.00; revised only via attest" }
      - { name: max_mapped_risks, type: integer, source: input, default: 10, description: "Capacity: max simultaneous ACTIVE RiskControlMappings; >= 1" }
      - { name: mapped_active_count, type: integer, source: computed, default: 0, description: "Count of RiskControlMappings in ACTIVE status referencing this control" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACTIVE | UNDER_REVIEW | RETIRED" }

  - name: RiskControlMapping
    parent: null
    common_fields: true
    fields:
      - { name: risk_id, type: string, source: system, description: "FK -> Risk.id (from nested create path)" }
      - { name: control_id, type: string, source: input, description: "FK -> Control.id" }
      - { name: coverage_weight, type: number, source: input, description: "0 < coverage_weight <= 1.00; weight of this control's effectiveness for this risk" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACTIVE | RETIRED" }

  - name: AppetiteStatement
    parent: null
    common_fields: true
    fields:
      - { name: category_id, type: string, source: input, description: "FK -> TaxonomyCategory.id" }
      - { name: tolerance_score, type: integer, source: input, description: "1-25; a residual_score >= tolerance_score breaches appetite" }
      - { name: acceptance_cap_score, type: integer, source: input, description: "tolerance_score <= acceptance_cap_score <= 25; a breach may be ACCEPTED only while residual_score <= acceptance_cap_score" }
      - { name: effective_from, type: datetime, source: input, description: "Window start, inclusive" }
      - { name: effective_to, type: datetime, source: input, description: "Window end, exclusive; must be > effective_from; half-open [from, to) windows of APPROVED statements for the same category must not overlap (adjacency where from == other.to is allowed)" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | RETIRED" }
      - { name: created_by, type: string, source: system, description: "X-User-ID of creator; approver must differ (segregation of duties)" }

  - name: ToleranceBreach
    parent: null
    common_fields: true
    fields:
      - { name: risk_id, type: string, source: system, description: "FK -> Risk.id" }
      - { name: appetite_statement_id, type: string, source: system, description: "FK -> AppetiteStatement.id; the APPROVED statement whose tolerance was breached" }
      - { name: residual_at_breach, type: integer, source: system, description: "residual_score that triggered the breach" }
      - { name: status, type: enum, source: system, description: "OPEN | ACKNOWLEDGED | RESOLVED | ACCEPTED" }
      - { name: rationale, type: string, source: input, required: false, description: "Required on accept" }
      - { name: review_by, type: datetime, source: input, required: false, description: "Required on accept; must be after current logical clock; ACCEPTED auto-reopens to OPEN once clock >= review_by" }

  - name: TreatmentPlan
    parent: Risk
    common_fields: true
    fields:
      - { name: risk_id, type: string, source: system, description: "FK -> Risk.id" }
      - { name: title, type: string, source: input, description: "Plan title" }
      - { name: budget_cents, type: integer, source: input, description: "> 0; reserved from the risk's treatment budget on approve" }
      - { name: due_date, type: datetime, source: input, description: "Must be after the current logical clock at creation" }
      - { name: owner_user_id, type: string, source: input, description: "Opaque X-User-ID of the treatment owner (a RiskOwner)" }
      - { name: proposer_user_id, type: string, source: system, description: "X-User-ID of the creator; approver must differ (segregation of duties)" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | IN_PROGRESS | OVERDUE | COMPLETED | REJECTED | CANCELLED" }
      - { name: priority, type: enum, source: computed, default: STANDARD, description: "STANDARD | URGENT; ratchets to URGENT by KRI RED cascade, never auto-drops" }
      - { name: extension_count, type: integer, source: system, default: 0, description: "Number of OVERDUE -> IN_PROGRESS extensions; max 3" }
      - { name: progress_pct, type: number, source: computed, default: 0, description: "round_half_up(100 * done_actions / total_actions, 2); 0.00 when no actions" }

  - name: TreatmentAction
    parent: TreatmentPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> TreatmentPlan.id" }
      - { name: title, type: string, source: input, description: "Action title" }
      - { name: status, type: enum, source: system, description: "PENDING | DONE" }

  - name: KRI
    parent: null
    common_fields: true
    fields:
      - { name: category_id, type: string, source: input, description: "FK -> TaxonomyCategory.id" }
      - { name: name, type: string, source: input, description: "Indicator name" }
      - { name: direction, type: enum, source: input, description: "ABOVE (breach when value strictly greater than threshold) | BELOW (breach when value strictly less than threshold)" }
      - { name: amber_threshold, type: number, source: input, description: "ABOVE requires amber_threshold < red_threshold; BELOW requires amber_threshold > red_threshold" }
      - { name: red_threshold, type: number, source: input, description: "Red breach boundary (strict comparison)" }
      - { name: min_observation_interval_days, type: integer, source: input, default: 1, description: ">= 0; a new observation's observed_at must be strictly after last_observation_at AND at least this many days after it" }
      - { name: unit, type: string, source: input, required: false, description: "Measurement unit label" }
      - { name: status, type: enum, source: system, description: "Lifecycle dimension: DRAFT | ACTIVE | RETIRED" }
      - { name: current_breach_status, type: enum, source: computed, default: NORMAL, description: "Breach dimension (parallel to lifecycle): NORMAL | AMBER_BREACH | RED_BREACH; derived from latest KRIObservation" }
      - { name: last_observation_at, type: datetime, source: computed, required: false, description: "observed_at of the latest KRIObservation; null until first observation" }

  - name: KRIObservation
    parent: KRI
    common_fields: false   # immutable event: id + created_at only
    fields:
      - { name: kri_id, type: string, source: system, description: "FK -> KRI.id" }
      - { name: observed_value, type: number, source: input, description: "Observed metric value" }
      - { name: observed_at, type: datetime, source: input, description: "Observation timestamp; must be <= current logical clock" }
      - { name: resulting_breach_status, type: enum, source: computed, description: "NORMAL | AMBER_BREACH | RED_BREACH — evaluation of this observation against the KRI thresholds" }

  - name: RiskReport
    parent: null
    common_fields: true
    fields:
      - { name: period_start, type: datetime, source: input, description: "Closed-interval period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Closed-interval period end (inclusive); must be >= period_start; FINALIZED reports' closed periods must not overlap (shared boundary date counts as overlap)" }
      - { name: variant, type: enum, source: input, description: "PROVISIONAL (aggregation over inherent_score) | FINAL (aggregation over residual_score, falling back to inherent_score when residual is null); immutable after create" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | CANCELLED; creating a DRAFT whose closed period overlaps another DRAFT auto-CANCELS the older DRAFT" }
      - { name: heat_score_total, type: number, source: computed, description: "Sum of per-category heat scores (each rounded to 2dp half-up BEFORE summation); recomputed and frozen at finalize" }
      - { name: category_breakdown, type: array, source: computed, description: "Per-category objects {category_id, risk_count, heat_score} sorted by heat_score DESC, tie-break category created_at ASC" }
      - { name: band_counts, type: object, source: computed, description: "{LOW, MEDIUM, HIGH, CRITICAL} counts using the variant metric band" }

  - name: EmergingRisk
    parent: null
    common_fields: true
    fields:
      - { name: category_id, type: string, source: input, description: "FK -> TaxonomyCategory.id" }
      - { name: title, type: string, source: input, description: "Emerging risk title" }
      - { name: description, type: string, source: input, required: false, description: "Horizon-scan notes" }
      - { name: scenario_severity, type: integer, source: input, description: "1-5 scenario analysis severity" }
      - { name: scenario_probability, type: integer, source: input, description: "1-5 scenario analysis probability" }
      - { name: stress_factor, type: number, source: input, default: 1.0, description: "0.5-3.0 scenario stress multiplier" }
      - { name: scenario_score, type: integer, source: computed, description: "round_half_up(scenario_severity * scenario_probability * stress_factor, 0)" }
      - { name: status, type: enum, source: system, description: "DRAFT | VALIDATED | PROMOTED | DISMISSED" }

# =============================================================================
# Table 2: State Machine Table (9 machines)
# =============================================================================
state_machines:
  - entity: Risk
    initial_state: DRAFT
    terminal_states: []   # CLOSED is reachable but re-openable (CLOSED -> IDENTIFIED); deliberately cyclic
    transitions:
      - from: DRAFT
        to: IDENTIFIED
        trigger: "POST /risks/{id}/submit"
        actor: RiskOwner
        preconditions:
          - "X-User-ID == risk.owner_user_id (ERR_OWNER_MISMATCH)"
        side_effects:
          - "risk.version increments by 1"
      - from: IDENTIFIED
        to: ASSESSED
        trigger: "POST /risks/{id}/assessments with kind=INHERENT"
        actor: RiskOwner
        preconditions:
          - "expected_risk_version == risk.version (ERR_STALE_VERSION)"
          - "likelihood and impact present and in 1..5 (ERR_SCORE_OUT_OF_RANGE)"
        side_effects:
          - "risk.likelihood / impact / inherent_score / inherent_band set"
          - "risk.version increments by 1"
      - from: REASSESSMENT
        to: MONITORING
        trigger: "POST /risks/{id}/assessments with kind=INHERENT (auto-transition on submit)"
        actor: RiskOwner
        preconditions:
          - "expected_risk_version == risk.version (ERR_STALE_VERSION)"
          - "likelihood and impact present and in 1..5 (ERR_SCORE_OUT_OF_RANGE)"
        side_effects:
          - "risk.likelihood / impact / inherent_score / inherent_band updated"
          - "residual_scoring recomputed from ACTIVE mappings (residual unchanged in formula inputs, new inherent base)"
          - "appetite_breach_evaluation run; may create ToleranceBreach (OPEN)"
          - "risk.version increments by 1"
      - from: ASSESSED
        to: ASSESSED
        trigger: "POST /risks/{id}/assessments with kind=RESIDUAL (self-transition, no status change)"
        actor: RiskOwner
        preconditions:
          - "expected_risk_version == risk.version (ERR_STALE_VERSION)"
        side_effects:
          - "residual_scoring recomputed; risk.residual_score / residual_band updated"
          - "appetite_breach_evaluation run; may create ToleranceBreach (OPEN)"
          - "risk.version increments by 1"
        note: "Same RESIDUAL self-transition also applies from TREATMENT and MONITORING."
      - from: TREATMENT
        to: TREATMENT
        trigger: "POST /risks/{id}/assessments with kind=RESIDUAL (self-transition)"
        actor: RiskOwner
        preconditions:
          - "expected_risk_version == risk.version (ERR_STALE_VERSION)"
        side_effects:
          - "residual_scoring recomputed; appetite_breach_evaluation run; risk.version increments by 1"
      - from: MONITORING
        to: MONITORING
        trigger: "POST /risks/{id}/assessments with kind=RESIDUAL (self-transition)"
        actor: RiskOwner
        preconditions:
          - "expected_risk_version == risk.version (ERR_STALE_VERSION)"
        side_effects:
          - "residual_scoring recomputed; appetite_breach_evaluation run; risk.version increments by 1"
      - from: ASSESSED
        to: TREATMENT
        trigger: "POST /risks/{id}/enter-treatment"
        actor: RiskOwner
        preconditions:
          - "risk.residual_score is not null (a RESIDUAL assessment exists) — else ERR_INVALID_STATE"
          - "at least one TreatmentPlan for this risk is APPROVED — else ERR_INVALID_STATE"
        side_effects:
          - "risk.version increments by 1"
      - from: TREATMENT
        to: MONITORING
        trigger: "POST /risks/{id}/monitor"
        actor: RiskOwner
        preconditions:
          - "no ToleranceBreach for this risk in {OPEN, ACKNOWLEDGED} (ERR_OPEN_BREACH_BLOCKING)"
          - "every TreatmentPlan for this risk is in {COMPLETED, REJECTED, CANCELLED} (ERR_ACTIVE_PLAN_BLOCKING)"
        side_effects:
          - "risk.version increments by 1"
      - from: MONITORING
        to: REASSESSMENT
        trigger: "POST /risks/{id}/reassess"
        actor: RiskOwner
        preconditions: []
        side_effects:
          - "risk.version increments by 1"
      - from: IDENTIFIED
        to: CLOSED
        trigger: "POST /risks/{id}/close"
        actor: RiskOwner
        preconditions:
          - "no TreatmentPlan in {PROPOSED, APPROVED, IN_PROGRESS, OVERDUE} (ERR_ACTIVE_PLAN_BLOCKING)"
          - "no ToleranceBreach in {OPEN, ACKNOWLEDGED} (ERR_OPEN_BREACH_BLOCKING)"
        side_effects:
          - "risk.version increments by 1"
        note: "Same close transition also applies from ASSESSED, MONITORING, REASSESSMENT (not from DRAFT or TREATMENT)."
      - from: ASSESSED
        to: CLOSED
        trigger: "POST /risks/{id}/close"
        actor: RiskOwner
        preconditions:
          - "no TreatmentPlan in {PROPOSED, APPROVED, IN_PROGRESS, OVERDUE}"
          - "no ToleranceBreach in {OPEN, ACKNOWLEDGED}"
        side_effects:
          - "risk.version increments by 1"
      - from: MONITORING
        to: CLOSED
        trigger: "POST /risks/{id}/close"
        actor: RiskOwner
        preconditions:
          - "no TreatmentPlan in {PROPOSED, APPROVED, IN_PROGRESS, OVERDUE}"
          - "no ToleranceBreach in {OPEN, ACKNOWLEDGED}"
        side_effects:
          - "risk.version increments by 1"
      - from: REASSESSMENT
        to: CLOSED
        trigger: "POST /risks/{id}/close"
        actor: RiskOwner
        preconditions:
          - "no TreatmentPlan in {PROPOSED, APPROVED, IN_PROGRESS, OVERDUE}"
          - "no ToleranceBreach in {OPEN, ACKNOWLEDGED}"
        side_effects:
          - "risk.version increments by 1"
      - from: CLOSED
        to: IDENTIFIED
        trigger: "POST /risks/{id}/reopen"
        actor: RiskOwner
        preconditions: []
        side_effects:
          - "scores, mappings, and kri_alert are preserved; lifecycle resumes at IDENTIFIED"
          - "risk.version increments by 1"

  - entity: RiskControlMapping
    initial_state: PROPOSED
    terminal_states: [RETIRED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /control-mappings/{id}/approve"
        actor: RiskManager
        preconditions:
          - "control.status == ACTIVE (ERR_CONTROL_NOT_ACTIVE)"
          - "control.mapped_active_count < control.max_mapped_risks (ERR_CONTROL_CAPACITY_EXCEEDED)"
        side_effects:
          - "control.mapped_active_count increments by 1; control.version increments by 1"
          - "residual_scoring recomputed for the risk when inherent_score is present; appetite_breach_evaluation run"
          - "risk.version increments by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /control-mappings/{id}/retire"
        actor: RiskManager
        preconditions: []
        side_effects:
          - "control.mapped_active_count decrements by 1; control.version increments by 1"
          - "residual_scoring recomputed for the risk when inherent_score is present; appetite_breach_evaluation run (may create ToleranceBreach OPEN)"
          - "risk.version increments by 1"

  - entity: Control
    initial_state: PROPOSED
    terminal_states: [RETIRED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /controls/{id}/activate"
        actor: ControlOwner
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: UNDER_REVIEW
        trigger: "POST /controls/{id}/review"
        actor: ControlOwner
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: ACTIVE
        trigger: "POST /controls/{id}/attest"
        actor: ControlOwner
        preconditions:
          - "effectiveness_pct in (0, 1.00] (ERR_SCORE_OUT_OF_RANGE)"
        side_effects:
          - "control.effectiveness_pct updated to the attested value"
          - "for every ACTIVE RiskControlMapping referencing this control whose risk has inherent_score present: residual_scoring recomputed and appetite_breach_evaluation run (may create ToleranceBreach OPEN); each touched risk.version increments by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /controls/{id}/retire"
        actor: ControlOwner
        preconditions: []
        side_effects:
          - "every ACTIVE RiskControlMapping for this control -> RETIRED; control.mapped_active_count -> 0"
          - "for each affected risk with inherent_score present: residual_scoring recomputed and appetite_breach_evaluation run; each touched risk.version increments by 1"

  - entity: TreatmentPlan
    initial_state: PROPOSED
    terminal_states: [COMPLETED, REJECTED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /treatment-plans/{id}/approve"
        actor: RiskManager
        preconditions:
          - "X-User-ID != plan.proposer_user_id (ERR_SOD_VIOLATION)"
          - "risk.status in {ASSESSED, TREATMENT, MONITORING, REASSESSMENT} (ERR_INVALID_STATE)"
          - "risk.available_treatment_cents >= plan.budget_cents (ERR_BUDGET_EXCEEDED)"
        side_effects:
          - "treatment_budget_accounting: risk.reserved_treatment_cents += plan.budget_cents"
          - "risk.version increments by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /treatment-plans/{id}/reject"
        actor: RiskManager
        preconditions:
          - "X-User-ID != plan.proposer_user_id (ERR_SOD_VIOLATION)"
        side_effects: []
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /treatment-plans/{id}/start"
        actor: RiskOwner
        preconditions:
          - "X-User-ID == plan.owner_user_id (ERR_OWNER_MISMATCH)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /treatment-plans/{id}/complete"
        actor: RiskOwner
        preconditions:
          - "X-User-ID == plan.owner_user_id (ERR_OWNER_MISMATCH)"
          - "plan has at least one TreatmentAction and every TreatmentAction is DONE (ERR_INCOMPLETE_ACTIONS)"
        side_effects:
          - "treatment_budget_accounting: risk.reserved_treatment_cents -= plan.budget_cents (reservation released)"
          - "risk.version increments by 1"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /treatment-plans/{id}/cancel"
        actor: RiskOwner
        preconditions:
          - "X-User-ID == plan.owner_user_id (ERR_OWNER_MISMATCH)"
        side_effects:
          - "treatment_budget_accounting: risk.reserved_treatment_cents -= plan.budget_cents"
          - "risk.version increments by 1"
        note: "Same cancel transition also applies from IN_PROGRESS and OVERDUE."
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /treatment-plans/{id}/cancel"
        actor: RiskOwner
        preconditions:
          - "X-User-ID == plan.owner_user_id (ERR_OWNER_MISMATCH)"
        side_effects:
          - "risk.reserved_treatment_cents -= plan.budget_cents; risk.version increments by 1"
      - from: OVERDUE
        to: CANCELLED
        trigger: "POST /treatment-plans/{id}/cancel"
        actor: RiskOwner
        preconditions:
          - "X-User-ID == plan.owner_user_id (ERR_OWNER_MISMATCH)"
        side_effects:
          - "risk.reserved_treatment_cents -= plan.budget_cents; risk.version increments by 1"
      - from: IN_PROGRESS
        to: OVERDUE
        trigger: "system: logical clock advance (POST /_clock/set_current_utc) sweep, and lazily on any read of the plan, when current clock > plan.due_date"
        actor: system
        preconditions: []
        side_effects:
          - "plan remains reserved; priority unchanged"
      - from: OVERDUE
        to: IN_PROGRESS
        trigger: "POST /treatment-plans/{id}/extend"
        actor: RiskOwner
        preconditions:
          - "X-User-ID == plan.owner_user_id (ERR_OWNER_MISMATCH)"
          - "plan.extension_count < 3 (ERR_PLAN_EXTENSION_LIMIT)"
          - "new_due_date > current logical clock (ERR_INVALID_REQUEST)"
        side_effects:
          - "plan.due_date = new_due_date; plan.extension_count increments by 1"

  - entity: TreatmentAction
    initial_state: PENDING
    terminal_states: [DONE]
    transitions:
      - from: PENDING
        to: DONE
        trigger: "POST /treatment-actions/{id}/done"
        actor: RiskOwner
        preconditions:
          - "parent plan.status == IN_PROGRESS (ERR_INVALID_STATE)"
          - "X-User-ID == parent plan.owner_user_id (ERR_OWNER_MISMATCH)"
        side_effects:
          - "treatment_progress_rollup recomputed on parent plan"

  - entity: ToleranceBreach
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /tolerance-breaches/{id}/acknowledge"
        actor: RiskOwner
        preconditions:
          - "X-User-ID == breached risk.owner_user_id (ERR_OWNER_MISMATCH)"
        side_effects: []
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /tolerance-breaches/{id}/resolve"
        actor: RiskOwner
        preconditions:
          - "X-User-ID == breached risk.owner_user_id (ERR_OWNER_MISMATCH)"
          - "risk.residual_score < linked appetite_statement.tolerance_score at resolve time (ERR_BREACH_RESOLUTION_PREMATURE)"
        side_effects: []
      - from: ACKNOWLEDGED
        to: ACCEPTED
        trigger: "POST /tolerance-breaches/{id}/accept"
        actor: RiskManager
        preconditions:
          - "risk.residual_score <= linked appetite_statement.acceptance_cap_score (ERR_ACCEPTANCE_CAP_EXCEEDED)"
          - "rationale present and review_by > current logical clock (ERR_INVALID_REQUEST)"
        side_effects: []
      - from: ACCEPTED
        to: OPEN
        trigger: "system: logical clock advance sweep, and lazily on any read of the breach, when current clock >= breach.review_by"
        actor: system
        preconditions: []
        side_effects:
          - "rationale and review_by retained for audit"

  - entity: KRI
    initial_state: DRAFT
    terminal_states: [RETIRED]
    note: "Two parallel state dimensions on one entity: lifecycle (status: DRAFT -> ACTIVE -> RETIRED, linear) and breach (current_breach_status: NORMAL | AMBER_BREACH | RED_BREACH, cyclic, driven solely by observations). The breach dimension may change only while status == ACTIVE; RETIRED freezes the breach dimension at its last value."
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /kris/{id}/activate"
        actor: RiskManager
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /kris/{id}/retire"
        actor: RiskManager
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /kris/{id}/observations (breach-dimension transition; lifecycle unchanged)"
        actor: RiskManager
        preconditions:
          - "kri.status == ACTIVE (ERR_KRI_NOT_ACTIVE)"
          - "observed_at <= current logical clock (ERR_OBSERVATION_IN_FUTURE)"
          - "observed_at strictly after last_observation_at and at least min_observation_interval_days after it (ERR_OBSERVATION_TOO_SOON)"
        side_effects:
          - "kri_breach_evaluation: current_breach_status updated per direction-aware strict thresholds"
          - "kri.last_observation_at = observed_at"
          - "when resulting status is RED_BREACH: every Risk in the KRI's category with status in {ASSESSED, TREATMENT, MONITORING, REASSESSMENT} gets kri_alert = true (risk.version increments), and each of those risks' TreatmentPlans in {APPROVED, IN_PROGRESS, OVERDUE} ratchets priority to URGENT (plan.version increments)"
          - "when resulting status is NORMAL: kri_alert cleared to false on those risks (plan priority is NOT lowered — ratchet)"

  - entity: RiskReport
    initial_state: DRAFT
    terminal_states: [FINALIZED, CANCELLED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /reports/{id}/finalize"
        actor: BoardReporter
        preconditions:
          - "no other FINALIZED RiskReport whose closed period [period_start, period_end] overlaps this report's closed period, where shared boundary dates count as overlap (ERR_REPORT_PERIOD_OVERLAP)"
        side_effects:
          - "board_report_aggregation recomputed at finalize time and frozen: heat_score_total, category_breakdown, band_counts"
      - from: DRAFT
        to: CANCELLED
        trigger: "system: POST /reports creates a new DRAFT whose closed period overlaps this DRAFT's closed period (auto-supersede)"
        actor: system
        preconditions: []
        side_effects:
          - "the superseding DRAFT is created successfully; this DRAFT becomes CANCELLED"

  - entity: EmergingRisk
    initial_state: DRAFT
    terminal_states: [PROMOTED, DISMISSED]
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /emerging-risks/{id}/validate"
        actor: RiskManager
        preconditions: []
        side_effects: []
      - from: VALIDATED
        to: PROMOTED
        trigger: "POST /emerging-risks/{id}/promote"
        actor: RiskManager
        preconditions:
          - "scenario_score >= 10, OR force=true with non-empty rationale (ERR_EMERGING_SCORE_BELOW_THRESHOLD)"
        side_effects:
          - "a Risk is created: status DRAFT, category_id copied, title copied, owner_user_id from input, source_emerging_risk_id = this EmergingRisk.id"
      - from: DRAFT
        to: DISMISSED
        trigger: "POST /emerging-risks/{id}/dismiss"
        actor: RiskManager
        preconditions: []
        side_effects: []
      - from: VALIDATED
        to: DISMISSED
        trigger: "POST /emerging-risks/{id}/dismiss"
        actor: RiskManager
        preconditions: []
        side_effects: []

# =============================================================================
# Concurrency Rules (§1.2.1) — true create-with-supersede races resolved by OCC
# =============================================================================
concurrency_rules:
  - rule_id: assessment-create-stale-risk
    parent_entity: Risk
    write_endpoint: "POST /risks/{id}/assessments"
    occ_field: "expected_risk_version"
    description: |
      Creating a RiskAssessment against a Risk whose version has advanced since
      the client last observed it is rejected. A successful assessment creation
      supersedes the client's view of the risk's latest scores, so a writer
      carrying a stale observed version must re-read before writing.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: plan-create-stale-risk
    parent_entity: Risk
    write_endpoint: "POST /risks/{id}/treatment-plans"
    occ_field: "expected_risk_version"
    description: |
      Creating a TreatmentPlan against a Risk whose version has advanced since
      the client last observed it is rejected. Plan creation reads the risk's
      available treatment budget; a stale observed version may double-allocate
      budget already reserved by a plan created after the client's last read.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (9 rules)
# =============================================================================
calculations:
  - name: inherent_scoring
    trigger: "POST /risks/{id}/assessments with kind=INHERENT"
    algorithm: weighted_scoring
    formula: |
      inherent_score = likelihood * impact          # integer 1..25
      inherent_band =
        LOW      when 1  <= inherent_score <= 4
        MEDIUM   when 5  <= inherent_score <= 9
        HIGH     when 10 <= inherent_score <= 15
        CRITICAL when 16 <= inherent_score <= 25
    input_set: "the submitted likelihood/impact of the INHERENT assessment"
    constants:
      BAND_LOW_MAX: 4
      BAND_MEDIUM_MAX: 9
      BAND_HIGH_MAX: 15
      SCORE_MAX: 25
    precision: "integer; no rounding"
    variants:
      - name: inherent_view
        when: "kind=INHERENT assessments and PROVISIONAL report aggregation"
        difference: "pre-control view; ignores all control mappings"

  - name: residual_scoring
    trigger: "RESIDUAL assessment creation; RiskControlMapping approve/retire; Control attest/retire; INHERENT reassessment (recompute with new base)"
    algorithm: weighted_scoring
    formula: |
      # Diminishing-returns control discount (non-linear, order-normalized).
      # Inputs: inherent_score, and for every RiskControlMapping m with
      # m.status == ACTIVE whose control c has c.status in {ACTIVE, UNDER_REVIEW}:
      # contribution(m) = c.effectiveness_pct * m.coverage_weight
      contributions = sort_desc(all contributions); tie-break: mapping created_at ASC
      accumulated = 0.0
      for c in contributions:
          accumulated = accumulated + c * (1 - accumulated)   # each further control only discounts the remainder
      discount = min(0.90, accumulated)                        # hard cap: controls can never zero out a risk
      residual_score = max(1, ceil(inherent_score * (1 - discount)))
      residual_band = same band edges as inherent_scoring
      When no qualifying mappings exist: discount = 0.0, residual_score = inherent_score.
    input_set: "mappings with status ACTIVE on controls with status ACTIVE or UNDER_REVIEW; RETIRED mappings/controls excluded"
    constants:
      DISCOUNT_CAP: 0.90
    precision: "contributions exact decimals; final score integer via ceil; floor 1"
    variants:
      - name: residual_view
        when: "kind=RESIDUAL assessments and FINAL report aggregation"
        difference: "post-control view; diverges from inherent_view whenever at least one ACTIVE mapping exists"

  - name: appetite_breach_evaluation
    trigger: "every residual_scoring recompute (RESIDUAL assessment, mapping approve/retire, control attest/retire, INHERENT reassessment)"
    algorithm: threshold
    formula: |
      Let a = the AppetiteStatement for risk.category_id with status == APPROVED
              and effective_from <= current_clock < effective_to (half-open).
      If no such a exists: no breach is possible.
      Else if residual_score >= a.tolerance_score:                         # INCLUSIVE boundary
          if no ToleranceBreach already exists for this risk in {OPEN, ACKNOWLEDGED, ACCEPTED}:
              create ToleranceBreach(status=OPEN, risk_id=risk.id,
                                     appetite_statement_id=a.id,
                                     residual_at_breach=residual_score)
      Else (residual_score < a.tolerance_score): no breach created.
    input_set: "single risk under evaluation; its category's effective APPROVED appetite; the risk's breaches in {OPEN, ACKNOWLEDGED, ACCEPTED}"
    constants: {}
    precision: "integer comparison; breach at residual_score == tolerance_score"

  - name: kri_breach_evaluation
    trigger: "POST /kris/{id}/observations (after temporal validations pass)"
    algorithm: threshold
    formula: |
      # STRICT comparisons: equality with a threshold is NOT a breach of that band.
      if direction == ABOVE:
          RED_BREACH   when observed_value >  red_threshold
          AMBER_BREACH when observed_value >  amber_threshold and observed_value <= red_threshold
          NORMAL       otherwise
      if direction == BELOW:
          RED_BREACH   when observed_value <  red_threshold
          AMBER_BREACH when observed_value <  amber_threshold and observed_value >= red_threshold
          NORMAL       otherwise
      AMBER_BREACH implies amber band only; RED_BREACH implies red band (red wins when both could match).
    input_set: "the new observation value; the KRI's direction/thresholds"
    constants: {}
    precision: "numeric comparison; strict inequality on red and amber"

  - name: treatment_progress_rollup
    trigger: "TreatmentAction PENDING -> DONE; action creation"
    algorithm: aggregation
    formula: |
      total = count of TreatmentActions of the plan (any status)
      done  = count of TreatmentActions with status == DONE
      progress_pct = 0.00 when total == 0
                   else round_half_up(100 * done / total, 2)
    input_set: "all TreatmentActions of the parent plan"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: board_report_aggregation
    trigger: "POST /reports (provisional snapshot at create) and POST /reports/{id}/finalize (authoritative recompute, frozen)"
    algorithm: aggregation
    formula: |
      included_risks = Risks with status in {ASSESSED, TREATMENT, MONITORING, REASSESSMENT}
      metric(risk) =
          variant PROVISIONAL -> risk.inherent_score
          variant FINAL       -> risk.residual_score if not null else risk.inherent_score
      per category c containing >= 1 included risk:
          raw_c   = sum(metric(r) for r in included_risks where r.category_id == c.id) * c.weight_factor
          heat_c  = round_half_up(raw_c, 2)            # ROUND PER CATEGORY FIRST (pinned order)
      heat_score_total = round_half_up(sum(heat_c over all such c), 2)   # THEN SUM the rounded values
      category_breakdown = [{category_id, risk_count, heat_score}] sorted heat_score DESC, tie-break category created_at ASC
      band_counts = counts of included risks by band of metric(risk) using inherent_scoring band edges
    input_set: "risks in {ASSESSED, TREATMENT, MONITORING, REASSESSMENT}; DRAFT/IDENTIFIED/CLOSED excluded; each risk counted under its own category"
    constants: {}
    precision: "2 decimal places, round_half_up; per-category rounding precedes total summation"
    variants:
      - name: provisional_aggregation
        when: "variant=PROVISIONAL (pre-control board preview)"
        difference: "uses inherent_score; identical register data yields a different heat_score_total than FINAL whenever any mapped control exists"
      - name: final_aggregation
        when: "variant=FINAL (board-of-record)"
        difference: "uses residual_score with inherent fallback; diverges from PROVISIONAL"

  - name: emerging_scenario_scoring
    trigger: "EmergingRisk creation"
    algorithm: weighted_scoring
    formula: |
      scenario_score = round_half_up(scenario_severity * scenario_probability * stress_factor, 0)
    input_set: "the emerging risk's scenario fields"
    constants:
      PROMOTE_THRESHOLD: 10
    precision: "integer via round_half_up at 0 decimals"

  - name: treatment_budget_accounting
    trigger: "TreatmentPlan approve / cancel / complete"
    algorithm: bucket_transfer
    formula: |
      on APPROVE:   risk.reserved_treatment_cents += plan.budget_cents
      on CANCEL:    risk.reserved_treatment_cents -= plan.budget_cents   (from APPROVED/IN_PROGRESS/OVERDUE)
      on COMPLETE:  risk.reserved_treatment_cents -= plan.budget_cents   (reservation released)
      risk.available_treatment_cents = risk.treatment_budget_cents - risk.reserved_treatment_cents
      INVARIANT: available_treatment_cents == treatment_budget_cents - sum(budget_cents of plans in {APPROVED, IN_PROGRESS, OVERDUE})
      An approve followed by its compensating cancel leaves reserved_treatment_cents and
      available_treatment_cents exactly unchanged.
    input_set: "plans of one risk in {APPROVED, IN_PROGRESS, OVERDUE}"
    constants: {}
    precision: "integer cents; exact"

  - name: control_mapping_accounting
    trigger: "RiskControlMapping approve / retire; Control retire"
    algorithm: aggregation
    formula: |
      control.mapped_active_count = count of RiskControlMappings with control_id == control.id and status == ACTIVE
      INVARIANT: an approve followed by the retire of the same mapping leaves mapped_active_count exactly unchanged.
    input_set: "mappings of one control in ACTIVE status"
    constants: {}
    precision: "integer; exact"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles; X-User-ID header present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per the RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Request body shape: required fields present, types valid, enum values in their declared sets, datetime fields parse as ISO8601"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right (category -> risk -> child); body FK references (category_id, control_id, parent_category_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"
  - priority: 5
    category: auth
    check: "Ownership: RiskOwner endpoints on Risk/TreatmentPlan/TreatmentAction/ToleranceBreach require X-User-ID == the owning owner_user_id field"
    error_id: ERR_OWNER_MISMATCH
    http_status: 403
    applies_to: "risk transitions, assessments, plan create/start/complete/cancel/extend, action create/done, mapping create, breach acknowledge/resolve"
  - priority: 6
    category: state
    check: "OCC: expected_risk_version in body equals the risk's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /risks/{id}/assessments, POST /risks/{id}/treatment-plans"
  - priority: 7
    category: state
    check: "Target entity is in a state from which the requested transition exists (includes ERR_KRI_NOT_ACTIVE for observations on non-ACTIVE KRI, ERR_ASSESSMENT_KIND_NOT_ALLOWED for a kind the risk's current status forbids). Creation-time state guards: mapping create requires risk.status in {IDENTIFIED, ASSESSED, TREATMENT, MONITORING, REASSESSMENT} (not DRAFT, not CLOSED); plan create requires risk.status in {ASSESSED, TREATMENT, MONITORING, REASSESSMENT}; action create requires parent plan.status in {APPROVED, IN_PROGRESS}; report finalize/observations/approve-actions follow their parent state machines."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints; POST /risks/{id}/control-mappings; POST /risks/{id}/treatment-plans; POST /treatment-plans/{id}/actions"
  - priority: 8
    category: business_safety
    check: "Segregation of duties: approver X-User-ID must differ from proposer_user_id (plans) / created_by (appetite statements)"
    error_id: ERR_SOD_VIOLATION
    http_status: 422
    applies_to: "POST /treatment-plans/{id}/approve, POST /treatment-plans/{id}/reject, POST /appetite-statements/{id}/approve"
  - priority: 9
    category: business_constraint
    check: "Domain ranges and uniqueness: likelihood/impact 1..5 (ERR_SCORE_OUT_OF_RANGE), tolerance/acceptance_cap within 1..25 with tolerance <= cap (ERR_TOLERANCE_OUT_OF_RANGE), KRI threshold ordering by direction (ERR_THRESHOLD_ORDER_INVALID), no second PROPOSED/ACTIVE mapping for the same (risk, control) (ERR_MAPPING_EXISTS), taxonomy parent chain must not contain the category itself (ERR_CATEGORY_CYCLE), plan extension_count < 3 (ERR_PLAN_EXTENSION_LIMIT), breach accept requires residual <= acceptance_cap (ERR_ACCEPTANCE_CAP_EXCEEDED), emerging promotion requires scenario_score >= 10 or force+rationale (ERR_EMERGING_SCORE_BELOW_THRESHOLD), plan completion requires >= 1 action all DONE (ERR_INCOMPLETE_ACTIONS)"
    error_id: "ERR_SCORE_OUT_OF_RANGE | ERR_TOLERANCE_OUT_OF_RANGE | ERR_THRESHOLD_ORDER_INVALID | ERR_MAPPING_EXISTS | ERR_CATEGORY_CYCLE | ERR_PLAN_EXTENSION_LIMIT | ERR_ACCEPTANCE_CAP_EXCEEDED | ERR_EMERGING_SCORE_BELOW_THRESHOLD | ERR_INCOMPLETE_ACTIONS"
    http_status: 422
    applies_to: "various"
  - priority: 10
    category: business_temporal
    check: "Temporal rules: appetite half-open [effective_from, effective_to) windows of APPROVED statements per category must not overlap — checked at create AND at approve (ERR_WINDOW_OVERLAP); effective_to > effective_from (ERR_INVALID_REQUEST); FINALIZED report closed periods must not overlap, shared boundary counts (ERR_REPORT_PERIOD_OVERLAP); KRI observations strictly increasing and >= min_observation_interval_days apart (ERR_OBSERVATION_TOO_SOON); observed_at <= clock (ERR_OBSERVATION_IN_FUTURE); plan due_date / new_due_date / breach review_by after current clock (ERR_INVALID_REQUEST)"
    error_id: "ERR_WINDOW_OVERLAP | ERR_REPORT_PERIOD_OVERLAP | ERR_OBSERVATION_TOO_SOON | ERR_OBSERVATION_IN_FUTURE | ERR_INVALID_REQUEST"
    http_status: 409
    applies_to: "appetite create/approve, report create/finalize, observations, plan create/extend, breach accept"
  - priority: 11
    category: business_referential
    check: "Referenced-entity state guards: mapping approve requires control ACTIVE (ERR_CONTROL_NOT_ACTIVE); appetite retire requires another APPROVED statement effective at the current clock for the category (ERR_NO_APPETITE_COVERAGE); breach resolve requires residual below tolerance (ERR_BREACH_RESOLUTION_PREMATURE); risk monitor/close require no OPEN/ACKNOWLEDGED breach (ERR_OPEN_BREACH_BLOCKING) and no non-terminal plan (ERR_ACTIVE_PLAN_BLOCKING)"
    error_id: "ERR_CONTROL_NOT_ACTIVE | ERR_NO_APPETITE_COVERAGE | ERR_BREACH_RESOLUTION_PREMATURE | ERR_OPEN_BREACH_BLOCKING | ERR_ACTIVE_PLAN_BLOCKING"
    http_status: 409
    applies_to: "mapping approve, appetite retire, breach resolve, risk monitor/close"
  - priority: 12
    category: business_fiscal
    check: "Capacity and budget last: control.mapped_active_count < max_mapped_risks on mapping approve (ERR_CONTROL_CAPACITY_EXCEEDED); risk.available_treatment_cents >= plan.budget_cents on plan approve (ERR_BUDGET_EXCEEDED)"
    error_id: "ERR_CONTROL_CAPACITY_EXCEEDED | ERR_BUDGET_EXCEEDED"
    http_status: 422
    applies_to: "POST /control-mappings/{id}/approve, POST /treatment-plans/{id}/approve"

# =============================================================================
# Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table (68 endpoints)
# =============================================================================
endpoints:
  # --- Taxonomy categories ---
  - { method: POST, path: "/categories", description: "Create a taxonomy category (root when parent_category_id omitted)", roles: [RiskManager], code: 201, input: [name, "parent_category_id?", "weight_factor?"], output: TaxonomyCategory, side_effects: ["cycle check on parent chain"] }
  - { method: GET, path: "/categories", description: "List categories (paginated)", roles: [RiskManager, RiskOwner, ControlOwner, BoardReporter, InternalAuditor], code: 200, input: ["parent_category_id?", "limit?", "offset?"], output: "TaxonomyCategory[]", side_effects: [] }
  - { method: GET, path: "/categories/{id}", description: "Get a category", roles: [RiskManager, RiskOwner, ControlOwner, BoardReporter, InternalAuditor], code: 200, input: [], output: TaxonomyCategory, side_effects: [] }
  - { method: PATCH, path: "/categories/{id}", description: "Reparent a category (taxonomy maintenance); rejected when the new parent is the category itself or one of its descendants", roles: [RiskManager], code: 200, input: [parent_category_id], output: TaxonomyCategory, side_effects: ["cycle check on new parent chain (ERR_CATEGORY_CYCLE)", "increments TaxonomyCategory.version by 1"] }
  - { method: GET, path: "/categories/{id}/subcategories", description: "List direct children of a category", roles: [RiskManager, RiskOwner, ControlOwner, BoardReporter, InternalAuditor], code: 200, input: ["limit?", "offset?"], output: "TaxonomyCategory[]", side_effects: [] }
  - { method: GET, path: "/categories/{id}/risks", description: "List risks in a category", roles: [RiskManager, RiskOwner, ControlOwner, BoardReporter, InternalAuditor], code: 200, input: ["status?", "limit?", "offset?"], output: "Risk[]", side_effects: [] }
  - { method: GET, path: "/categories/{id}/appetite-statements", description: "List appetite statements of a category", roles: [RiskManager, RiskOwner, ControlOwner, BoardReporter, InternalAuditor], code: 200, input: ["limit?", "offset?"], output: "AppetiteStatement[]", side_effects: [] }
  - { method: GET, path: "/categories/{id}/kris", description: "List KRIs of a category", roles: [RiskManager, RiskOwner, ControlOwner, BoardReporter, InternalAuditor], code: 200, input: ["limit?", "offset?"], output: "KRI[]", side_effects: [] }
  - { method: GET, path: "/categories/{id}/emerging-risks", description: "List emerging risks of a category", roles: [RiskManager, RiskOwner, ControlOwner, BoardReporter, InternalAuditor], code: 200, input: ["limit?", "offset?"], output: "EmergingRisk[]", side_effects: [] }

  # --- Risks ---
  - { method: POST, path: "/risks", description: "Create a risk (status DRAFT)", roles: [RiskOwner], code: 201, input: [category_id, title, owner_user_id, "treatment_budget_cents?", "description?"], output: Risk, side_effects: ["status=DRAFT, kri_alert=false, reserved=0"] }
  - { method: GET, path: "/risks", description: "List risks with filters (paginated)", roles: [RiskManager, RiskOwner, ControlOwner, BoardReporter, InternalAuditor], code: 200, input: ["category_id?", "status?", "residual_band?", "limit?", "offset?"], output: "Risk[]", side_effects: [] }
  - { method: GET, path: "/risks/{id}", description: "Get a risk with computed fields", roles: [RiskManager, RiskOwner, ControlOwner, BoardReporter, InternalAuditor], code: 200, input: [], output: Risk, side_effects: [] }
  - { method: POST, path: "/risks/{id}/submit", description: "DRAFT -> IDENTIFIED", roles: [RiskOwner], code: 200, input: [], output: Risk, side_effects: ["increments Risk.version by 1"] }
  - { method: POST, path: "/risks/{id}/assessments", description: "Create INHERENT or RESIDUAL assessment (OCC-guarded); may auto-transition risk and create a ToleranceBreach", roles: [RiskOwner], code: 201, input: [kind, "likelihood?", "impact?", "notes?", expected_risk_version], output: RiskAssessment, side_effects: ["increments Risk.version by 1", "residual_scoring on RESIDUAL", "appetite_breach_evaluation"] }
  - { method: GET, path: "/risks/{id}/assessments", description: "List assessments of a risk (chronological)", roles: [RiskManager, RiskOwner, ControlOwner, BoardReporter, InternalAuditor], code: 200, input: ["limit?", "offset?"], output: "RiskAssessment[]", side_effects: [] }
  - { method: POST, path: "/risks/{id}/enter-treatment", description: "ASSESSED -> TREATMENT (requires residual score and an APPROVED plan)", roles: [RiskOwner], code: 200, input: [], output: Risk, side_effects: ["increments Risk.version by 1"] }
  - { method: POST, path: "/risks/{id}/monitor", description: "TREATMENT -> MONITORING (guarded by breaches and plans)", roles: [RiskOwner], code: 200, input: [], output: Risk, side_effects: ["increments Risk.version by 1"] }
  - { method: POST, path: "/risks/{id}/reassess", description: "MONITORING -> REASSESSMENT", roles: [RiskOwner], code: 200, input: [], output: Risk, side_effects: ["increments Risk.version by 1"] }
  - { method: POST, path: "/risks/{id}/close", description: "IDENTIFIED/ASSESSED/MONITORING/REASSESSMENT -> CLOSED (guarded)", roles: [RiskOwner], code: 200, input: [], output: Risk, side_effects: ["increments Risk.version by 1"] }
  - { method: POST, path: "/risks/{id}/reopen", description: "CLOSED -> IDENTIFIED", roles: [RiskOwner], code: 200, input: ["reason?"], output: Risk, side_effects: ["increments Risk.version by 1"] }
  - { method: GET, path: "/risks/{id}/treatment-plans", description: "List treatment plans of a risk", roles: [RiskManager, RiskOwner, ControlOwner, BoardReporter, InternalAuditor], code: 200, input: ["limit?", "offset?"], output: "TreatmentPlan[]", side_effects: [] }
  - { method: GET, path: "/risks/{id}/control-mappings", description: "List control mappings of a risk", roles: [RiskManager, RiskOwner, ControlOwner, BoardReporter, InternalAuditor], code: 200, input: ["limit?", "offset?"], output: "RiskControlMapping[]", side_effects: [] }
  - { method: GET, path: "/risks/{id}/tolerance-breaches", description: "List tolerance breaches of a risk", roles: [RiskManager, RiskOwner, ControlOwner, BoardReporter, InternalAuditor], code: 200, input: ["limit?", "offset?"], output: "ToleranceBreach[]", side_effects: [] }
  - { method: POST, path: "/risks/{id}/control-mappings", description: "Propose a control mapping for this risk", roles: [RiskOwner], code: 201, input: [control_id, coverage_weight], output: RiskControlMapping, side_effects: ["status=PROPOSED; ERR_MAPPING_EXISTS when a PROPOSED/ACTIVE mapping for (risk, control) exists"] }
  - { method: POST, path: "/risks/{id}/treatment-plans", description: "Propose a treatment plan (OCC-guarded)", roles: [RiskOwner], code: 201, input: [title, budget_cents, due_date, owner_user_id, expected_risk_version], output: TreatmentPlan, side_effects: ["status=PROPOSED; increments Risk.version by 1"] }

  # --- Controls ---
  - { method: POST, path: "/controls", description: "Create a control (status PROPOSED)", roles: [ControlOwner], code: 201, input: [name, effectiveness_pct, "description?", "max_mapped_risks?"], output: Control, side_effects: [] }
  - { method: GET, path: "/controls/{id}", description: "Get a control", roles: [RiskManager, RiskOwner, ControlOwner, BoardReporter, InternalAuditor], code: 200, input: [], output: Control, side_effects: [] }
  - { method: POST, path: "/controls/{id}/activate", description: "PROPOSED -> ACTIVE", roles: [ControlOwner], code: 200, input: [], output: Control, side_effects: [] }
  - { method: POST, path: "/controls/{id}/review", description: "ACTIVE -> UNDER_REVIEW", roles: [ControlOwner], code: 200, input: [], output: Control, side_effects: [] }
  - { method: POST, path: "/controls/{id}/attest", description: "UNDER_REVIEW -> ACTIVE with revised effectiveness; cascades residual recompute", roles: [ControlOwner], code: 200, input: [effectiveness_pct], output: Control, side_effects: ["residual_scoring + appetite_breach_evaluation on every actively-mapped risk with inherent present", "increments each touched Risk.version by 1"] }
  - { method: POST, path: "/controls/{id}/retire", description: "ACTIVE -> RETIRED; retires all ACTIVE mappings and recomputes residuals", roles: [ControlOwner], code: 200, input: [], output: Control, side_effects: ["ACTIVE mappings -> RETIRED; mapped_active_count -> 0", "residual_scoring + appetite_breach_evaluation per affected risk"] }
  - { method: GET, path: "/controls/{id}/control-mappings", description: "List mappings referencing a control", roles: [RiskManager, RiskOwner, ControlOwner, BoardReporter, InternalAuditor], code: 200, input: ["limit?", "offset?"], output: "RiskControlMapping[]", side_effects: [] }

  # --- Control mappings (flat actions) ---
  - { method: POST, path: "/control-mappings/{id}/approve", description: "PROPOSED -> ACTIVE (capacity + control-state guarded)", roles: [RiskManager], code: 200, input: [], output: RiskControlMapping, side_effects: ["control_mapping_accounting", "residual_scoring + appetite_breach_evaluation", "increments Risk.version by 1"] }
  - { method: POST, path: "/control-mappings/{id}/retire", description: "ACTIVE -> RETIRED", roles: [RiskManager], code: 200, input: [], output: RiskControlMapping, side_effects: ["control_mapping_accounting", "residual_scoring + appetite_breach_evaluation", "increments Risk.version by 1"] }

  # --- Appetite statements ---
  - { method: POST, path: "/appetite-statements", description: "Create appetite statement (DRAFT); half-open window overlap vs APPROVED statements checked now", roles: [RiskManager], code: 201, input: [category_id, tolerance_score, acceptance_cap_score, effective_from, effective_to], output: AppetiteStatement, side_effects: [] }
  - { method: GET, path: "/appetite-statements/{id}", description: "Get an appetite statement", roles: [RiskManager, RiskOwner, ControlOwner, BoardReporter, InternalAuditor], code: 200, input: [], output: AppetiteStatement, side_effects: [] }
  - { method: POST, path: "/appetite-statements/{id}/approve", description: "DRAFT -> APPROVED (SoD + window re-check)", roles: [RiskManager], code: 200, input: [], output: AppetiteStatement, side_effects: ["category.current_tolerance_score may update"] }
  - { method: POST, path: "/appetite-statements/{id}/retire", description: "APPROVED -> RETIRED (requires remaining effective coverage)", roles: [RiskManager], code: 200, input: [], output: AppetiteStatement, side_effects: ["category.current_tolerance_score recomputed"] }
  - { method: GET, path: "/appetite-statements/{id}/tolerance-breaches", description: "List breaches linked to an appetite statement", roles: [RiskManager, RiskOwner, ControlOwner, BoardReporter, InternalAuditor], code: 200, input: ["limit?", "offset?"], output: "ToleranceBreach[]", side_effects: [] }

  # --- Treatment plans ---
  - { method: GET, path: "/treatment-plans/{id}", description: "Get a treatment plan", roles: [RiskManager, RiskOwner, ControlOwner, BoardReporter, InternalAuditor], code: 200, input: [], output: TreatmentPlan, side_effects: ["lazy IN_PROGRESS -> OVERDUE evaluation"] }
  - { method: POST, path: "/treatment-plans/{id}/approve", description: "PROPOSED -> APPROVED (SoD + risk-state + budget)", roles: [RiskManager], code: 200, input: [], output: TreatmentPlan, side_effects: ["treatment_budget_accounting: reserve budget", "increments Risk.version by 1"] }
  - { method: POST, path: "/treatment-plans/{id}/reject", description: "PROPOSED -> REJECTED (SoD)", roles: [RiskManager], code: 200, input: ["reason?"], output: TreatmentPlan, side_effects: [] }
  - { method: POST, path: "/treatment-plans/{id}/start", description: "APPROVED -> IN_PROGRESS (owner only)", roles: [RiskOwner], code: 200, input: [], output: TreatmentPlan, side_effects: [] }
  - { method: POST, path: "/treatment-plans/{id}/complete", description: "IN_PROGRESS -> COMPLETED (requires all actions DONE, >= 1 action)", roles: [RiskOwner], code: 200, input: [], output: TreatmentPlan, side_effects: ["treatment_budget_accounting: release reservation", "increments Risk.version by 1"] }
  - { method: POST, path: "/treatment-plans/{id}/cancel", description: "APPROVED/IN_PROGRESS/OVERDUE -> CANCELLED", roles: [RiskOwner], code: 200, input: ["reason?"], output: TreatmentPlan, side_effects: ["treatment_budget_accounting: release reservation", "increments Risk.version by 1"] }
  - { method: POST, path: "/treatment-plans/{id}/extend", description: "OVERDUE -> IN_PROGRESS with new due date (max 3 extensions)", roles: [RiskOwner], code: 200, input: [new_due_date], output: TreatmentPlan, side_effects: ["extension_count increments by 1"] }
  - { method: POST, path: "/treatment-plans/{id}/actions", description: "Add an action to a plan (plan must be APPROVED or IN_PROGRESS)", roles: [RiskOwner], code: 201, input: [title], output: TreatmentAction, side_effects: ["treatment_progress_rollup"] }
  - { method: GET, path: "/treatment-plans/{id}/actions", description: "List actions of a plan", roles: [RiskManager, RiskOwner, ControlOwner, BoardReporter, InternalAuditor], code: 200, input: ["limit?", "offset?"], output: "TreatmentAction[]", side_effects: [] }

  # --- Treatment actions ---
  - { method: POST, path: "/treatment-actions/{id}/done", description: "PENDING -> DONE (plan must be IN_PROGRESS)", roles: [RiskOwner], code: 200, input: [], output: TreatmentAction, side_effects: ["treatment_progress_rollup"] }

  # --- Tolerance breaches ---
  - { method: GET, path: "/tolerance-breaches/{id}", description: "Get a breach", roles: [RiskManager, RiskOwner, ControlOwner, BoardReporter, InternalAuditor], code: 200, input: [], output: ToleranceBreach, side_effects: ["lazy ACCEPTED -> OPEN evaluation when clock >= review_by"] }
  - { method: POST, path: "/tolerance-breaches/{id}/acknowledge", description: "OPEN -> ACKNOWLEDGED (risk owner)", roles: [RiskOwner], code: 200, input: [], output: ToleranceBreach, side_effects: [] }
  - { method: POST, path: "/tolerance-breaches/{id}/resolve", description: "ACKNOWLEDGED -> RESOLVED (residual must be below tolerance)", roles: [RiskOwner], code: 200, input: [], output: ToleranceBreach, side_effects: [] }
  - { method: POST, path: "/tolerance-breaches/{id}/accept", description: "ACKNOWLEDGED -> ACCEPTED (capped; requires rationale + review_by)", roles: [RiskManager], code: 200, input: [rationale, review_by], output: ToleranceBreach, side_effects: [] }

  # --- KRIs ---
  - { method: POST, path: "/kris", description: "Create a KRI (lifecycle DRAFT, breach NORMAL)", roles: [RiskManager], code: 201, input: [category_id, name, direction, amber_threshold, red_threshold, "min_observation_interval_days?", "unit?"], output: KRI, side_effects: [] }
  - { method: GET, path: "/kris/{id}", description: "Get a KRI (both state dimensions)", roles: [RiskManager, RiskOwner, ControlOwner, BoardReporter, InternalAuditor], code: 200, input: [], output: KRI, side_effects: [] }
  - { method: POST, path: "/kris/{id}/activate", description: "DRAFT -> ACTIVE", roles: [RiskManager], code: 200, input: [], output: KRI, side_effects: [] }
  - { method: POST, path: "/kris/{id}/retire", description: "ACTIVE -> RETIRED (freezes breach dimension)", roles: [RiskManager], code: 200, input: [], output: KRI, side_effects: [] }
  - { method: POST, path: "/kris/{id}/observations", description: "Record an observation; evaluates breach dimension and fires RED cascade", roles: [RiskManager], code: 201, input: [observed_value, observed_at], output: KRIObservation, side_effects: ["kri_breach_evaluation", "RED_BREACH cascade: kri_alert on category risks -> TreatmentPlan priority URGENT", "NORMAL clears kri_alert"] }
  - { method: GET, path: "/kris/{id}/observations", description: "List observations of a KRI (chronological by observed_at)", roles: [RiskManager, RiskOwner, ControlOwner, BoardReporter, InternalAuditor], code: 200, input: ["limit?", "offset?"], output: "KRIObservation[]", side_effects: [] }

  # --- Board reports ---
  - { method: POST, path: "/reports", description: "Create a report (DRAFT) with provisional snapshot; overlapping DRAFT is auto-CANCELLED", roles: [BoardReporter], code: 201, input: [period_start, period_end, variant], output: RiskReport, side_effects: ["board_report_aggregation (provisional snapshot)", "overlapping older DRAFT -> CANCELLED"] }
  - { method: GET, path: "/reports/{id}", description: "Get a report with snapshot fields", roles: [RiskManager, RiskOwner, ControlOwner, BoardReporter, InternalAuditor], code: 200, input: [], output: RiskReport, side_effects: [] }
  - { method: POST, path: "/reports/{id}/finalize", description: "DRAFT -> FINALIZED; recomputes and freezes snapshot; closed-period overlap with FINALIZED reports rejected", roles: [BoardReporter], code: 200, input: [], output: RiskReport, side_effects: ["board_report_aggregation (authoritative, frozen)"] }

  # --- Emerging risks ---
  - { method: POST, path: "/emerging-risks", description: "Register an emerging risk with scenario analysis (DRAFT)", roles: [RiskManager, RiskOwner], code: 201, input: [category_id, title, scenario_severity, scenario_probability, "stress_factor?", "description?"], output: EmergingRisk, side_effects: ["emerging_scenario_scoring"] }
  - { method: GET, path: "/emerging-risks/{id}", description: "Get an emerging risk", roles: [RiskManager, RiskOwner, ControlOwner, BoardReporter, InternalAuditor], code: 200, input: [], output: EmergingRisk, side_effects: [] }
  - { method: GET, path: "/emerging-risks/{id}/risks", description: "List register risks promoted from this emerging risk (0 or 1)", roles: [RiskManager, RiskOwner, ControlOwner, BoardReporter, InternalAuditor], code: 200, input: ["limit?", "offset?"], output: "Risk[]", side_effects: [] }
  - { method: POST, path: "/emerging-risks/{id}/validate", description: "DRAFT -> VALIDATED", roles: [RiskManager], code: 200, input: [], output: EmergingRisk, side_effects: [] }
  - { method: POST, path: "/emerging-risks/{id}/promote", description: "VALIDATED -> PROMOTED; creates a register Risk (DRAFT)", roles: [RiskManager], code: 201, input: [owner_user_id, "force?", "rationale?"], output: Risk, side_effects: ["creates Risk with source_emerging_risk_id set"] }
  - { method: POST, path: "/emerging-risks/{id}/dismiss", description: "DRAFT/VALIDATED -> DISMISSED", roles: [RiskManager], code: 200, input: ["reason?"], output: EmergingRisk, side_effects: [] }

  # --- Test-driving logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (ISO8601). Startup default before any call is exactly 2026-08-01T00:00:00Z; the logical clock never falls back to wall-clock time. Advancing the clock sweeps: IN_PROGRESS plans past due_date -> OVERDUE; ACCEPTED breaches with review_by <= now -> OPEN."
    roles: [RiskManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["overdue sweep on TreatmentPlan", "breach re-open sweep on ToleranceBreach"]

# =============================================================================
# Table 6: Error Code Catalog (30 errors)
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, wrong type, invalid enum member, unparseable datetime, effective_to <= effective_from, due_date/new_due_date/review_by not after the current logical clock, INHERENT assessment missing likelihood/impact" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or role value not recognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Authenticated role is not listed for this endpoint in the RBAC matrix" }
  - { id: ERR_OWNER_MISMATCH, http: 403, condition: "RiskOwner endpoint invoked with X-User-ID different from the resource's owner_user_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist (left-to-right) or body FK reference (category_id, control_id, parent_category_id) does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_risk_version does not match the risk's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not defined from the entity's current state (covers terminal-state lockdown and enter-treatment/assessment-kind state guards)" }
  - { id: ERR_ASSESSMENT_KIND_NOT_ALLOWED, http: 409, condition: "INHERENT assessment while risk not in {IDENTIFIED, REASSESSMENT}, or RESIDUAL assessment while risk in {DRAFT, IDENTIFIED, CLOSED}" }
  - { id: ERR_KRI_NOT_ACTIVE, http: 409, condition: "Observation submitted for a KRI whose lifecycle status is DRAFT or RETIRED" }
  - { id: ERR_SOD_VIOLATION, http: 422, condition: "Approver X-User-ID equals proposer_user_id (treatment plan) or created_by (appetite statement)" }
  - { id: ERR_SCORE_OUT_OF_RANGE, http: 422, condition: "likelihood/impact outside 1..5, effectiveness_pct outside (0, 1.00], scenario_severity/probability outside 1..5, stress_factor outside [0.5, 3.0]" }
  - { id: ERR_TOLERANCE_OUT_OF_RANGE, http: 422, condition: "tolerance_score outside 1..25, acceptance_cap_score outside 1..25, or acceptance_cap_score < tolerance_score" }
  - { id: ERR_THRESHOLD_ORDER_INVALID, http: 422, condition: "KRI direction ABOVE requires amber_threshold < red_threshold; BELOW requires amber_threshold > red_threshold" }
  - { id: ERR_CATEGORY_CYCLE, http: 422, condition: "parent_category_id chain would contain the category itself" }
  - { id: ERR_MAPPING_EXISTS, http: 409, condition: "A PROPOSED or ACTIVE RiskControlMapping already exists for the same (risk_id, control_id) pair" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "Appetite half-open window [effective_from, effective_to) overlaps another APPROVED statement for the same category (checked at create and at approve); adjacency is allowed" }
  - { id: ERR_NO_APPETITE_COVERAGE, http: 409, condition: "Retiring this statement would leave the category with no APPROVED appetite effective at the current clock" }
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 409, condition: "Finalizing would create a FINALIZED report whose closed period [period_start, period_end] overlaps another FINALIZED report; shared boundary dates count as overlap" }
  - { id: ERR_OBSERVATION_TOO_SOON, http: 409, condition: "observed_at not strictly after last_observation_at, or fewer than min_observation_interval_days since last_observation_at" }
  - { id: ERR_OBSERVATION_IN_FUTURE, http: 422, condition: "observed_at is after the current logical clock" }
  - { id: ERR_CONTROL_NOT_ACTIVE, http: 409, condition: "Mapping approve requires the control's status == ACTIVE" }
  - { id: ERR_CONTROL_CAPACITY_EXCEEDED, http: 422, condition: "Mapping approve would push control.mapped_active_count above max_mapped_risks" }
  - { id: ERR_BUDGET_EXCEEDED, http: 422, condition: "Plan approve would push reserved_treatment_cents above the risk's treatment_budget_cents" }
  - { id: ERR_OPEN_BREACH_BLOCKING, http: 409, condition: "Risk monitor/close attempted while a ToleranceBreach in {OPEN, ACKNOWLEDGED} exists for the risk" }
  - { id: ERR_ACTIVE_PLAN_BLOCKING, http: 409, condition: "Risk monitor/close attempted while a TreatmentPlan in {PROPOSED, APPROVED, IN_PROGRESS, OVERDUE} exists for the risk" }
  - { id: ERR_PLAN_EXTENSION_LIMIT, http: 409, condition: "Extend attempted with extension_count == 3" }
  - { id: ERR_INCOMPLETE_ACTIONS, http: 409, condition: "Plan completion requires at least one TreatmentAction and all actions DONE" }
  - { id: ERR_ACCEPTANCE_CAP_EXCEEDED, http: 422, condition: "Breach accept attempted while risk.residual_score > appetite_statement.acceptance_cap_score" }
  - { id: ERR_BREACH_RESOLUTION_PREMATURE, http: 409, condition: "Breach resolve attempted while risk.residual_score >= linked appetite tolerance_score" }
  - { id: ERR_EMERGING_SCORE_BELOW_THRESHOLD, http: 422, condition: "Promotion attempted with scenario_score < 10 and without force=true plus non-empty rationale" }

# =============================================================================
# Table 7: RBAC Matrix (5 roles)
# =============================================================================
roles:
  - name: RiskManager
    description: "Corporate ERM function lead: owns taxonomy, appetite, KRIs, mapping approval, breach acceptance, emerging-risk triage"
    identity: opaque
    exclusive_operations:
      - "POST /categories, PATCH /categories/{id} (reparent)"
      - "POST /appetite-statements, POST /appetite-statements/{id}/approve (SoD vs created_by), POST /appetite-statements/{id}/retire"
      - "POST /kris, POST /kris/{id}/activate, POST /kris/{id}/retire, POST /kris/{id}/observations"
      - "POST /control-mappings/{id}/approve, POST /control-mappings/{id}/retire"
      - "POST /treatment-plans/{id}/approve, POST /treatment-plans/{id}/reject (SoD vs proposer_user_id)"
      - "POST /tolerance-breaches/{id}/accept"
      - "POST /emerging-risks/{id}/validate, /promote, /dismiss"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
      - "POST /emerging-risks (shared with RiskOwner)"
  - name: RiskOwner
    description: "Business-unit risk owner: registers risks, assesses, owns treatment execution; ownership enforced via owner_user_id == X-User-ID"
    identity: opaque
    exclusive_operations:
      - "POST /risks, POST /risks/{id}/submit, POST /risks/{id}/assessments"
      - "POST /risks/{id}/enter-treatment, /monitor, /reassess, /close, /reopen"
      - "POST /risks/{id}/control-mappings, POST /risks/{id}/treatment-plans"
      - "POST /treatment-plans/{id}/start, /complete, /cancel, /extend, POST /treatment-plans/{id}/actions"
      - "POST /treatment-actions/{id}/done"
      - "POST /tolerance-breaches/{id}/acknowledge, /resolve"
    shared_operations:
      - "All GET endpoints"
      - "POST /emerging-risks (shared with RiskManager)"
  - name: ControlOwner
    description: "Control function owner: maintains the control library and attests effectiveness"
    identity: opaque
    exclusive_operations:
      - "POST /controls, POST /controls/{id}/activate, /review, /attest, /retire"
    shared_operations:
      - "All GET endpoints"
  - name: BoardReporter
    description: "Reporting officer: compiles and finalizes board risk reports"
    identity: opaque
    exclusive_operations:
      - "POST /reports, POST /reports/{id}/finalize"
    shared_operations:
      - "All GET endpoints"
  - name: InternalAuditor
    description: "Read-only assurance role; any write attempt must be rejected"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"
