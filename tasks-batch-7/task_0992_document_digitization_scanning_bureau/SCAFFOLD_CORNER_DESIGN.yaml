            - "Invoice.${inv}.issued_at remains null"

      - name: error_custody_flag_blocks_and_compliance_clear_releases
        claim_type: violation_to_error
        grounds: ["errors[ERR_CUSTODY_FLAGGED]", state_machines.Box.IN_DESTRUCTION_to_DESTROYED]
        distinguishing_aspect: "The destruction cascade flags every other non-final box of the client across non-CLOSED batches; a flagged box rejects custody hand-offs until a ComplianceOfficer clears it, after which the same hand-off succeeds."
        test_recipe:
          setup:
            - "client with batches B1 (full lifecycle: delivered at 2026-05-10, retention 5, swept 2026-05-15, box1 destroyed) and B2 (INTAKE, box2 shelved STORED)"
