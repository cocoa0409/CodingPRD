        grounds:
          - endpoints[GET /wetlease/leases]
          - endpoints[GET /wetlease/leases/{leaseId}/regulatory-approvals]
          - endpoints[GET /wetlease/reliability-reports]
          - endpoints[GET /wetlease/return-conditions]
          - validations[priority 4 ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          The read side of the API is where FK reverse-reachability actually lives, so each of these
          four listings is exercised through the filter that carries a foreign key: lessee_id on leases,
          the nested leaseId path on regulatory-approvals, lease_id plus aircraft_id on
          reliability-reports and lease_id on return-conditions. A filter that matches nothing must
          return 200 with total_count 0 - never 404. Paging is validated at priority 4, ABOVE any
          business rule, and the window is the closed interval [1, 100] on limit with offset >= 0:
          limit 0, limit 101 and offset -1 are each 400 ERR_INVALID_REQUEST, while limit 100 with
          offset 0 sits exactly on both bounds and succeeds.
          
