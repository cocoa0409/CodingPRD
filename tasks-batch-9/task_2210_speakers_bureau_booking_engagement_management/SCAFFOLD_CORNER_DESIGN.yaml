  # =========================================================================
  # Cross-cutting complexity layers (§1.0.complexity_layers)
  # =========================================================================
  - section: cross_cutting_layers
    instances:

      - name: optimistic_concurrency_stale_inquiry_version_blocks_proposal_creation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[proposal-create-stale-inquiry]
          - errors[ERR_STALE_INQUIRY_VERSION]
        distinguishing_aspect: |
          The version read before qualification is already stale afterwards, because qualification
          bumps the inquiry. A proposal built on that pre-qualification view is refused with 412
          and the inquiry is left completely untouched, so the retry with the current version works.
        test_recipe:
          setup:
            - "An inquiry created at version 1 and then qualified, taking it to version 2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /speakers"
              payload: { full_name: "Dana Reyes", topics: ["AI_STRATEGY", "LEADERSHIP"], fee_floor_cents: 1000000, fee_ceiling_cents: 2000000, travel_class: "PREMIUM", travel_buffer_days: 1, tax_form_status: "ON_FILE" }
              as: BureauAdmin
              captures: { sp: $.data.id }
            - call: "POST /clients"
              payload: { org_name: "Meridian Health", industry_code: "HEALTHCARE", primary_contact_email: "ops@meridian.example" }
              as: BureauAdmin
              captures: { cl: $.data.id }
            - call: "POST /inquiries"
              payload: { client_id: "${cl}", required_topic: "AI_STRATEGY", event_start_utc: "2026-10-15T16:00:00Z", event_end_utc: "2026-10-15T18:00:00Z", audience_size: 800, budget_cents: 1600000, objective_tags: ["STRATEGY"] }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { inq: $.data.id, v0: $.data.version }
            - call: "POST /inquiries/${inq}/qualify"
              payload: { outcome: "QUALIFY" }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /inquiries/${inq}/proposals"
              payload: { expected_inquiry_version: "${v0}", valid_until_utc: "2026-09-20T00:00:00Z" }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { e1: $.data.error_id }
            - call: "POST /inquiries/${inq}/proposals"
              payload: { expected_inquiry_version: "${v1}", valid_until_utc: "2026-09-20T00:00:00Z" }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { pr: $.data.id, pst: $.data.status }
          assert:
            - "the stale attempt returns 412 with data.error_id == ERR_STALE_INQUIRY_VERSION"
            - "v1 == v0 + 1: qualification bumped the inquiry's version, which is exactly what invalidated the caller's view"
            - "after the rejection the inquiry is still QUALIFIED at version v1 with no proposal attached"
            - "the retry with v1 succeeds and creates a DRAFT proposal"

