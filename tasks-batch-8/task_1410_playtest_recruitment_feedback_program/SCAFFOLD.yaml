  # ---- playtest sessions ----
  - method: POST
    path: "/playtests/sessions"
    description: "Schedule a session (status SCHEDULED, seats_taken 0). IN_LAB requires station_id (AVAILABLE station, half-open overlap check); REMOTE forbids station_id. Study must be in {RECRUITING, CLOSED, ANALYSIS}."
    roles: [Researcher]
    code: 201
    input: [study_id, mode, starts_at, ends_at, seat_capacity, "station_id?"]
    output: PlaytestSession
    side_effects: []
  - method: GET
    path: "/playtests/sessions"
    description: "List sessions with optional filters."
    roles: [ResearchOpsAdmin, Researcher, Moderator, Participant, IncentiveOfficer]
    code: 200
    input: ["study_id?", "moderator_id?", "station_id?", "status?", "limit?", "offset?"]
    output: PlaytestSession[]
    side_effects: []
  - method: GET
    path: "/playtests/sessions/{id}"
    description: "Fetch one session (includes seats_taken, moderator_id, version)."
    roles: [ResearchOpsAdmin, Researcher, Moderator, Participant, IncentiveOfficer]
    code: 200
    input: []
    output: PlaytestSession
    side_effects: []
  - method: POST
    path: "/playtests/sessions/{id}/assign-moderator"
    description: "Assign (or replace) the session's moderator. Session must be SCHEDULED; moderator must be ACTIVE; 15-minute buffered overlap check against the moderator's other SCHEDULED/IN_PROGRESS sessions."
    roles: [Researcher]
    code: 200
    input: [moderator_id]
    output: PlaytestSession
    side_effects: ["session.moderator_id := payload moderator_id", "increments PlaytestSession.version by 1"]
  - method: PATCH
    path: "/playtests/sessions/{id}/reschedule"
    description: "Move the session window while SCHEDULED. OCC-guarded: expected_session_version must equal the session's current version. Re-runs station/participant-neutral conflict checks (station half-open, moderator buffered)."
    roles: [Researcher]
    code: 200
    input: [expected_session_version, starts_at, ends_at]
    output: PlaytestSession
    side_effects: ["increments PlaytestSession.version by 1", "re-validates station and moderator overlap for the new window"]
  - method: POST
    path: "/playtests/sessions/{id}/start"
    description: "SCHEDULED -> IN_PROGRESS (assigned moderator only; study CLOSED or ANALYSIS; now within [starts_at, ends_at])."
    roles: [Moderator]
    code: 200
    input: []
    output: PlaytestSession
    side_effects: ["PlaytestSession SCHEDULED -> IN_PROGRESS"]
  - method: POST
    path: "/playtests/sessions/{id}/complete"
    description: "IN_PROGRESS -> COMPLETED (assigned moderator only). Remaining BOOKED/PROMOTED bookings auto-flip to NO_SHOW, driving strike counting and possible auto-suspension cascades."
    roles: [Moderator]
    code: 200
    input: []
    output: PlaytestSession
    side_effects: ["PlaytestSession IN_PROGRESS -> COMPLETED", "auto no-show + strike cascade per booking"]
  - method: POST
    path: "/playtests/sessions/{id}/cancel"
    description: "SCHEDULED -> CANCELLED; cancels all non-terminal bookings without waitlist promotion; seats_taken := 0."
    roles: [Researcher, ResearchOpsAdmin]
    code: 200
    input: []
    output: PlaytestSession
    side_effects: ["PlaytestSession SCHEDULED -> CANCELLED", "bookings -> CANCELLED", "seats_taken := 0"]

  # ---- session bookings ----
  - method: POST
    path: "/playtests/session-bookings"
    description: "Participant books a session seat. participant_id from X-User-ID. Seat gate evaluates seats_taken BEFORE insert: seats_taken < seat_capacity -> BOOKED (seats_taken += 1), else WAITLISTED. Requires ENROLLED application in the session's study and no closed-interval overlap with the participant's other booked sessions."
    roles: [Participant]
    code: 201
    input: [session_id]
    output: SessionBooking
    side_effects: ["if BOOKED: session.seats_taken += 1"]
  - method: GET
    path: "/playtests/session-bookings"
    description: "List bookings with optional filters."
    roles: [ResearchOpsAdmin, Researcher, Moderator, Participant]
    code: 200
    input: ["session_id?", "participant_id?", "status?", "limit?", "offset?"]
    output: SessionBooking[]
    side_effects: []
  - method: GET
    path: "/playtests/session-bookings/{id}"
    description: "Fetch one booking."
    roles: [ResearchOpsAdmin, Researcher, Moderator, Participant]
    code: 200
    input: []
    output: SessionBooking
    side_effects: []
  - method: POST
    path: "/playtests/session-bookings/{id}/cancel"
    description: "BOOKED|PROMOTED|WAITLISTED -> CANCELLED (owner or ops). Cancelling a held seat frees it and promotes the earliest-created eligible waitlisted booking (participant ACTIVE), keeping seats_taken unchanged when a promotion occurs."
    roles: [Participant, ResearchOpsAdmin]
    code: 200
    input: []
    output: SessionBooking
    side_effects: ["SessionBooking -> CANCELLED", "seat free + waitlist promotion (unless session-cancel cascade)"]
  - method: POST
    path: "/playtests/session-bookings/{id}/mark-attended"
    description: "BOOKED|PROMOTED -> ATTENDED (assigned moderator; session IN_PROGRESS)."
    roles: [Moderator]
    code: 200
    input: []
    output: SessionBooking
    side_effects: ["SessionBooking -> ATTENDED"]
  - method: POST
    path: "/playtests/session-bookings/{id}/mark-no-show"
    description: "BOOKED|PROMOTED -> NO_SHOW (assigned moderator; session IN_PROGRESS). Recomputes strikes; exactly 3 strikes in 90 days auto-suspends the participant."
    roles: [Moderator]
    code: 200
    input: []
    output: SessionBooking
    side_effects: ["SessionBooking -> NO_SHOW", "no_show_strikes recompute", "possible auto-suspension cascade"]

