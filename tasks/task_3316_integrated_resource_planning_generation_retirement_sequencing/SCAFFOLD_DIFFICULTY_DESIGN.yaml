# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 3316 — Integrated Resource Planning & Generation Retirement Sequencing
# 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: load_forecasting_coincident_vs_net_peak
        grounds:
          - calculations.load_forecasting
          - entities.LoadForecast.fields.effective_load_mw
          - endpoints.POST_/portfolios/{portfolioId}/snapshots
        distinguishing_aspect: |
          Load-domain dual variant: identical class inputs (1000/800/500/200) yield
          effective_load_mw 2475.00 under COINCIDENT but 2395.00 under NET_PEAK —
          the electrification adder is weighted 1.00 vs 0.60 — and two snapshots of
          the same fleet produce capacity_margin_mw -2406.25 vs -2314.25 (the NET_PEAK
          snapshot reads the plan's HIGH_ELECTRIFICATION scenario row, which carries
          the same class inputs, with variant=NET_PEAK).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default). Plan P in DRAFT with BASE and HIGH_ELECTRIFICATION forecasts for 2030 (both res 1000, com 800, ind 500, elec 200), one portfolio PF, and one ACTIVE GAS_CC fleet resource of 500 MW (in_service_year 2020)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "IRP 2030", cycle_year: 2026, planning_horizon_years: 15 }
              as: UtilityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/forecasts"
              payload: { scenario_tag: "BASE", forecast_year: 2030, residential_mw: 1000, commercial_mw: 800, industrial_mw: 500, electrification_mw: 200 }
              as: UtilityPlanner
              captures: { fc_id: $.data.id }
            - call: "POST /plans/${plan_id}/forecasts"
              payload: { scenario_tag: "HIGH_ELECTRIFICATION", forecast_year: 2030, residential_mw: 1000, commercial_mw: 800, industrial_mw: 500, electrification_mw: 200 }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/portfolios"
              payload: { portfolio_name: "PF-Main", preferred_flag: true }
              as: UtilityPlanner
              captures: { pf_id: $.data.id, pf_v: $.data.version }
            - call: "POST /resources"
              payload: { unit_name: "GAS-CC-1", resource_type: "GAS_CC", nameplate_mw: 500, in_service_year: 2020, fuel_type: "NATURAL_GAS" }
              as: UtilityPlanner
          trigger:
            - call: "POST /portfolios/${pf_id}/snapshots"
              payload: { forecast_year: 2030, scenario_tag: "BASE", fuel_price_usd_per_mmbtu: 4.00, expected_portfolio_version: "${pf_v}" }
              as: UtilityPlanner
              captures: { snap_coin_margin: $.data.capacity_margin_mw, snap_coin_load: $.data.load_mw }
            - call: "GET /portfolios/${pf_id}"
              payload: {}
              as: UtilityPlanner
              captures: { pfv_1: $.data.version }
            - call: "POST /portfolios/${pf_id}/snapshots"
              payload: { forecast_year: 2030, scenario_tag: "HIGH_ELECTRIFICATION", fuel_price_usd_per_mmbtu: 4.00, expected_portfolio_version: "${pfv_1}", variant: "NET_PEAK" }
              as: UtilityPlanner
              captures: { snap_net_margin: $.data.capacity_margin_mw, snap_net_load: $.data.load_mw }
          assert:
            - "LoadForecast.${fc_id}.effective_load_mw == 2475.00 (COINCIDENT stored)"
            - "first snapshot load_mw == 2475.00 and capacity_margin_mw == -2406.25"
            - "second snapshot (NET_PEAK variant) load_mw == 2395.00 and capacity_margin_mw == -2314.25"

      - name: sensitivity_fuel_cost_plus_vs_market
        grounds:
          - calculations.sensitivity_scoring
          - entities.SensitivityAnalysis.fields.adjusted_score_usd
          - endpoints.POST_/plans/{planId}/sensitivities
        distinguishing_aspect: |
          Sensitivity-domain dual variant (different entity domain from load forecasting):
          the same portfolio base score 29941451 under FUEL_PRICE +25% adjusts to
          32561328 with scoring_variant COST_PLUS (only the 35% fuel share moves) but
          37426814 with MARKET (full score moves) — robust_flag flips true vs false.
        test_recipe:
          setup:
            - "Clock 2026-09-01 (decision year 2026). Plan P DRAFT; BASE forecast 2031 with effective load small enough; portfolio PF; candidate GAS_CC-REP (online 2029, capex 1200 $/kW, fixed_om 15 $/kW-yr, lead 3, nameplate 500); position of 253.8 MW committed in PF; snapshot S of PF for year 2031."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "IRP Sens", cycle_year: 2026, planning_horizon_years: 15 }
              as: UtilityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/forecasts"
              payload: { scenario_tag: "BASE", forecast_year: 2031, residential_mw: 100, commercial_mw: 0, industrial_mw: 0, electrification_mw: 0 }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/portfolios"
              payload: { portfolio_name: "PF-Sens", preferred_flag: true }
              as: UtilityPlanner
              captures: { pf_id: $.data.id, pf_v: $.data.version }
            - call: "POST /candidates"
              payload: { candidate_name: "GAS-CC-REP", resource_type: "GAS_CC", nameplate_mw: 500, online_year: 2029, capex_usd_per_kw: 1200, fixed_om_usd_per_kw_year: 15, fuel_type: "NATURAL_GAS", build_lead_years: 3 }
              as: UtilityPlanner
              captures: { cand_id: $.data.id }
            - call: "POST /portfolios/${pf_id}/positions"
              payload: { candidate_id: "${cand_id}", committed_mw: 253.8 }
              as: UtilityPlanner
            - call: "GET /portfolios/${pf_id}"
              payload: {}
              as: UtilityPlanner
              captures: { pfv_2: $.data.version }
            - call: "POST /portfolios/${pf_id}/snapshots"
              payload: { forecast_year: 2031, scenario_tag: "BASE", fuel_price_usd_per_mmbtu: 4.00, expected_portfolio_version: "${pfv_2}" }
              as: UtilityPlanner
              captures: { snap_id: $.data.id }
          trigger:
            - call: "POST /plans/${plan_id}/sensitivities"
              payload: { snapshot_id: "${snap_id}", dimension: "FUEL_PRICE", delta_pct: 0.25, scoring_variant: "COST_PLUS" }
              as: UtilityPlanner
              captures: { sens_cp_adj: $.data.adjusted_score_usd, sens_cp_base: $.data.base_score_usd, sens_cp_robust: $.data.robust_flag }
            - call: "POST /plans/${plan_id}/sensitivities"
              payload: { snapshot_id: "${snap_id}", dimension: "FUEL_PRICE", delta_pct: 0.25, scoring_variant: "MARKET" }
              as: UtilityPlanner
              captures: { sens_mk_adj: $.data.adjusted_score_usd, sens_mk_base: $.data.base_score_usd, sens_mk_robust: $.data.robust_flag }
          assert:
            - "both analyses report base_score_usd == 29941451"
            - "COST_PLUS adjusted_score_usd == 32561328 and robust_flag == true"
            - "MARKET adjusted_score_usd == 37426814 and robust_flag == false"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: capacity_accreditation_mode_a_multi_input
        grounds:
          - calculations.capacity_accreditation
          - calculations.derating_factor
          - entities.Resource.fields.status
        distinguishing_aspect: |
          Mode (a) combinatorial: accredited_supply_mw is a >=3-input non-linear
          aggregate — nameplate x static accreditation factor x state-dependent
          eligibility x age-dependent derating with a min/max-bracketed linear ramp —
          e.g. a 300 MW COAL unit (in_service 1985) at forecast 2030 yields exactly
          256.50 accredited MW (age 45 -> der 0.95 inside the [40,50] ramp), while at
          2040 the unit contributes 0 once DECIDED with retirement_year 2031.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Plan P DRAFT; BASE forecasts for 2030 and 2040 (tiny loads); portfolio PF; ACTIVE COAL fleet unit 300 MW in_service_year 1985."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "IRP Accr", cycle_year: 2026, planning_horizon_years: 20 }
              as: UtilityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/forecasts"
              payload: { scenario_tag: "BASE", forecast_year: 2030, residential_mw: 10, commercial_mw: 0, industrial_mw: 0, electrification_mw: 0 }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/forecasts"
              payload: { scenario_tag: "BASE", forecast_year: 2040, residential_mw: 10, commercial_mw: 0, industrial_mw: 0, electrification_mw: 0 }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/portfolios"
              payload: { portfolio_name: "PF-Accr", preferred_flag: true }
              as: UtilityPlanner
              captures: { pf_id: $.data.id, pf_v: $.data.version }
            - call: "POST /resources"
              payload: { unit_name: "COAL-OLD", resource_type: "COAL", nameplate_mw: 300, in_service_year: 1985, fuel_type: "COAL" }
              as: UtilityPlanner
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /portfolios/${pf_id}/snapshots"
              payload: { forecast_year: 2030, scenario_tag: "BASE", fuel_price_usd_per_mmbtu: 4.00, expected_portfolio_version: "${pf_v}" }
              as: UtilityPlanner
              captures: { acc_2030: $.data.accredited_supply_mw }
            - call: "POST /resources/${res_id}/retire"
              payload: { retirement_year: 2031, plan_id: "${plan_id}" }
              as: UtilityPlanner
            - call: "GET /portfolios/${pf_id}"
              payload: {}
              as: UtilityPlanner
              captures: { pfv_3: $.data.version }
            - call: "POST /portfolios/${pf_id}/snapshots"
              payload: { forecast_year: 2040, scenario_tag: "BASE", fuel_price_usd_per_mmbtu: 4.00, expected_portfolio_version: "${pfv_3}" }
              as: UtilityPlanner
              captures: { acc_2040: $.data.accredited_supply_mw }
          assert:
            - "snapshot 2030 accredited_supply_mw == 256.50 (300 * 0.90 * 0.95 age-ramp derate)"
            - "snapshot 2040 accredited_supply_mw == 0.00 (DECIDED unit past retirement_year contributes nothing)"

      - name: retirement_analysis_mode_b_round_per_component
        grounds:
          - calculations.retirement_analysis
          - entities.RetirementAnalysis.fields.net_retirement_benefit_usd
        distinguishing_aspect: |
          Mode (b) nested-rounding combinatorial (different mode from the accreditation
          aggregate): each 10-year-window component is rounded to whole dollars BEFORE
          summing (round-per-component-then-sum pinned); with a 300 MW COAL unit
          retiring 2031 the components are compliance 258000000, fixed-om-avoided
          114000000, replacement 299414511, yielding net_retirement_benefit_usd
          exactly 72585489 and recommendation RETIRE.
        test_recipe:
          setup:
            - "Clock 2026-09-01 (decision year 2026). Plan P DRAFT; BASE forecast 2031; portfolio PF; COAL fleet unit COAL-RA 300 MW in_service 1985, decided to retire 2031 under P; candidate GAS-CC-REP2 (500 MW, online 2029, capex 1200 $/kW, fixed_om 15, lead 3) registered; snapshot S of PF for 2031 with fuel price 4.00."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "IRP RA", cycle_year: 2026, planning_horizon_years: 20 }
              as: UtilityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/forecasts"
              payload: { scenario_tag: "BASE", forecast_year: 2031, residential_mw: 10, commercial_mw: 0, industrial_mw: 0, electrification_mw: 0 }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/portfolios"
              payload: { portfolio_name: "PF-RA", preferred_flag: true }
              as: UtilityPlanner
              captures: { pf_id: $.data.id, pf_v: $.data.version }
            - call: "POST /resources"
              payload: { unit_name: "COAL-RA", resource_type: "COAL", nameplate_mw: 300, in_service_year: 1985, fuel_type: "COAL" }
              as: UtilityPlanner
              captures: { res_id: $.data.id }
            - call: "POST /candidates"
              payload: { candidate_name: "GAS-CC-REP2", resource_type: "GAS_CC", nameplate_mw: 500, online_year: 2029, capex_usd_per_kw: 1200, fixed_om_usd_per_kw_year: 15, fuel_type: "NATURAL_GAS", build_lead_years: 3 }
              as: UtilityPlanner
            - call: "POST /resources/${res_id}/retire"
              payload: { retirement_year: 2031, plan_id: "${plan_id}" }
              as: UtilityPlanner
            - call: "GET /portfolios/${pf_id}"
              payload: {}
              as: UtilityPlanner
              captures: { pfv_4: $.data.version }
            - call: "POST /portfolios/${pf_id}/snapshots"
              payload: { forecast_year: 2031, scenario_tag: "BASE", fuel_price_usd_per_mmbtu: 4.00, expected_portfolio_version: "${pfv_4}" }
              as: UtilityPlanner
              captures: { snap_id: $.data.id }
          trigger:
            - call: "POST /resources/${res_id}/retirement-analyses"
              payload: { plan_id: "${plan_id}", snapshot_id: "${snap_id}" }
              as: UtilityPlanner
              captures: { ra_id: $.data.id }
          assert:
            - "RetirementAnalysis.${ra_id}.compliance_cost_usd == 258000000"
            - "RetirementAnalysis.${ra_id}.fixed_om_avoided_usd == 114000000"
            - "RetirementAnalysis.${ra_id}.replacement_cost_usd == 299414511"
            - "RetirementAnalysis.${ra_id}.net_retirement_benefit_usd == 72585489"
            - "RetirementAnalysis.${ra_id}.recommendation == RETIRE"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: resource_plan_review_reopen_cycle_bounded
        grounds:
          - state_machines.ResourcePlan.UNDER_REVIEW_to_REJECTED
          - state_machines.ResourcePlan.REJECTED_to_DRAFT
          - entities.ResourcePlan.fields.reopen_count
        distinguishing_aspect: |
          Cyclic-with-counter machine on ResourcePlan: DRAFT->OPEN_FOR_COMMENT->
          UNDER_REVIEW->REJECTED->DRAFT loops up to REOPEN_LIMIT 2 times; the third
          reopen is rejected with ERR_PLAN_REOPEN_LIMIT, so the cycle is bounded by
          mutable entity state (reopen_count), not by a static edge list.
        test_recipe:
          setup:
            - "Clock 2026-08-01. Plan P with BASE forecast 2030 and one preferred portfolio; driven through three review cycles: round 1 opens 2026-08-01 (window to 08-31), round 2 opens 2026-08-31 (window to 09-30), round 3 opens 2026-10-01 (window to 10-31) — every open-comment lands on or before the cycle-year September 1 deadline."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityPlanner
            - call: "POST /plans"
              payload: { plan_name: "IRP Cycle", cycle_year: 2026, planning_horizon_years: 15 }
              as: UtilityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/forecasts"
              payload: { scenario_tag: "BASE", forecast_year: 2030, residential_mw: 10, commercial_mw: 0, industrial_mw: 0, electrification_mw: 0 }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/portfolios"
              payload: { portfolio_name: "PF-C", preferred_flag: true }
              as: UtilityPlanner
              captures: { pf_id: $.data.id }
            - call: "POST /plans/${plan_id}/open-comment"
              payload: {}
              as: UtilityPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/submit-for-review"
              payload: {}
              as: UtilityPlanner
              captures: { plan_v1: $.data.version }
            - call: "POST /plans/${plan_id}/commission-review"
              payload: { decision: "REJECT", expected_plan_version: "${plan_v1}" }
              as: Commissioner
            - call: "POST /plans/${plan_id}/reopen"
              payload: {}
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/open-comment"
              payload: {}
              as: UtilityPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/submit-for-review"
              payload: {}
              as: UtilityPlanner
              captures: { plan_v2: $.data.version }
            - call: "POST /plans/${plan_id}/commission-review"
              payload: { decision: "REJECT", expected_plan_version: "${plan_v2}" }
              as: Commissioner
            - call: "POST /plans/${plan_id}/reopen"
              payload: {}
              as: UtilityPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/open-comment"
              payload: {}
              as: UtilityPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/submit-for-review"
              payload: {}
              as: UtilityPlanner
              captures: { plan_v3: $.data.version }
            - call: "POST /plans/${plan_id}/commission-review"
              payload: { decision: "REJECT", expected_plan_version: "${plan_v3}" }
              as: Commissioner
          trigger:
            - call: "POST /plans/${plan_id}/reopen"
              payload: {}
              as: UtilityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "third reopen is rejected with error_id ERR_PLAN_REOPEN_LIMIT (HTTP 422)"
            - "ResourcePlan.${plan_id}.reopen_count == 2 and status == REJECTED"

      - name: testimony_withdraw_refile_cycle
        grounds:
          - state_machines.IntervenorTestimony.FILED_to_WITHDRAWN
          - state_machines.IntervenorTestimony.WITHDRAWN_to_FILED
        distinguishing_aspect: |
          Cyclic machine on a DIFFERENT entity (IntervenorTestimony): FILED->WITHDRAWN
          ->FILED loops freely while the plan is UNDER_REVIEW, and the refiled testimony
          keeps its original volume_no (no re-sequencing) — a cycle whose state is
          externally gated by the plan's review state.
        test_recipe:
          setup:
            - "Clock 2026-08-01. Intervenor registered; plan P driven to UNDER_REVIEW (BASE forecast, preferred portfolio, comment window elapsed)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityPlanner
            - call: "POST /intervenors"
              payload: { legal_name: "Citizens Utility Board", party_type: "CONSUMER_ADVOCATE" }
              as: PlatformAdmin
              captures: { int_id: $.data.id }
            - call: "POST /plans"
              payload: { plan_name: "IRP Testi", cycle_year: 2026, planning_horizon_years: 15 }
              as: UtilityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/forecasts"
              payload: { scenario_tag: "BASE", forecast_year: 2030, residential_mw: 10, commercial_mw: 0, industrial_mw: 0, electrification_mw: 0 }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/portfolios"
              payload: { portfolio_name: "PF-T", preferred_flag: true }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/open-comment"
              payload: {}
              as: UtilityPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/submit-for-review"
              payload: {}
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/testimonies"
              payload: { intervenor_id: "${int_id}", topic: "Load forecast", body: "The electrification adder is understated." }
              as: Intervener
              as_user_id: "${int_id}"
              captures: { testi_id: $.data.id, vol: $.data.volume_no }
          trigger:
            - call: "POST /testimonies/${testi_id}/withdraw"
              payload: {}
              as: Intervener
              as_user_id: "${int_id}"
            - call: "POST /testimonies/${testi_id}/refile"
              payload: {}
              as: Intervener
              as_user_id: "${int_id}"
              captures: { vol2: $.data.volume_no, st2: $.data.status }
          assert:
            - "after withdraw: status == WITHDRAWN; after refile: status == FILED"
            - "volume_no unchanged across the cycle (vol == vol2 == 1)"
            - "IntervenorTestimony.${testi_id}.version == 3 after two transitions"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: retire_stales_snapshot_blocks_review
        grounds:
          - state_machines.Resource.ACTIVE_to_DECIDED
          - state_machines.ResourcePlan.UNDER_REVIEW_to_APPROVED
          - endpoints.POST_/resources/{resourceId}/retire
        distinguishing_aspect: |
          Depth-3 cascade: POST retire mutates Resource (ACTIVE->DECIDED), which
          stale-flags the plan's failing ReliabilitySnapshots with forecast_year >=
          retirement_year (bumping each portfolio version), which itself removes the
          only row that could satisfy the commission-review precondition — a later
          APPROVE decision fails with ERR_RELIABILITY_NOT_MET, an effect caused by
          the stale-flag, not by retire directly.
        test_recipe:
          setup:
            - "Clock 2026-08-01. Plan P UNDER_REVIEW with preferred portfolio PF; PF has exactly one snapshot S for 2030 that PASSES (meets_requirement true) entirely because of ACTIVE COAL unit R (500 MW, in_service 2010) against load 400; P has passed the comment window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityPlanner
            - call: "POST /plans"
              payload: { plan_name: "IRP Casc", cycle_year: 2026, planning_horizon_years: 15 }
              as: UtilityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/forecasts"
              payload: { scenario_tag: "BASE", forecast_year: 2030, residential_mw: 400, commercial_mw: 0, industrial_mw: 0, electrification_mw: 0 }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/forecasts"
              payload: { scenario_tag: "HIGH_ELECTRIFICATION", forecast_year: 2030, residential_mw: 400, commercial_mw: 0, industrial_mw: 0, electrification_mw: 0 }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/portfolios"
              payload: { portfolio_name: "PF-Casc", preferred_flag: true }
              as: UtilityPlanner
              captures: { pf_id: $.data.id, pf_v: $.data.version }
            - call: "POST /resources"
              payload: { unit_name: "COAL-CASC", resource_type: "COAL", nameplate_mw: 500, in_service_year: 2010, fuel_type: "COAL" }
              as: UtilityPlanner
              captures: { res_id: $.data.id }
            - call: "POST /portfolios/${pf_id}/snapshots"
              payload: { forecast_year: 2030, scenario_tag: "BASE", fuel_price_usd_per_mmbtu: 4.00, expected_portfolio_version: "${pf_v}" }
              as: UtilityPlanner
              captures: { snap_ok: $.data.meets_requirement }
            - call: "POST /plans/${plan_id}/open-comment"
              payload: {}
              as: UtilityPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/submit-for-review"
              payload: {}
              as: UtilityPlanner
              captures: { plan_v: $.data.version }
          trigger:
            - call: "POST /resources/${res_id}/retire"
              payload: { retirement_year: 2028, plan_id: "${plan_id}" }
              as: UtilityPlanner
            - call: "GET /portfolios/${pf_id}"
              payload: {}
              as: UtilityPlanner
              captures: { pfv_5: $.data.version }
            - call: "POST /portfolios/${pf_id}/snapshots"
              payload: { forecast_year: 2030, scenario_tag: "HIGH_ELECTRIFICATION", fuel_price_usd_per_mmbtu: 4.00, expected_portfolio_version: "${pfv_5}" }
              as: UtilityPlanner
              captures: { margin_after: $.data.capacity_margin_mw, meets_after: $.data.meets_requirement }
            - call: "POST /plans/${plan_id}/commission-review"
              payload: { decision: "APPROVE", expected_plan_version: "${plan_v}" }
              as: Commissioner
              captures: { err: $.data.error_id }
          assert:
            - "retire (retirement_year 2028 <= 2030) flags the plan's 2030 snapshot as pending-recompute and bumps ResourcePortfolio.${pf_id}.version from 2 to 3 (cascade bump even though portfolios are FROZEN)"
            - "recomputed snapshot on the FROZEN portfolio (recompute allowed while FROZEN; mutation of positions is not) with the DECIDED unit excluded (2030 >= 2028) reports accredited_supply_mw == 0.00, capacity_margin_mw == -460.00, meets_requirement == false"
            - "commission-review APPROVE fails with ERR_RELIABILITY_NOT_MET (422) — the passing row the review depended on was displaced by the retire->flag->recompute chain, not by the review call itself"

      - name: award_discharges_condition_shrinks_report_shortfall
        grounds:
          - state_machines.ProcurementCommitment.ISSUED_to_AWARDED
          - state_machines.PlanCondition.OPEN_to_DISCHARGED
          - calculations.deviation_measurement
        distinguishing_aspect: |
          Depth-3 cascade from a DIFFERENT trigger: POST award mutates the commitment
          (ISSUED->AWARDED), which itself discharges each listed PlanCondition
          (OPEN->DISCHARGED, version bump), which itself changes the NEXT deviation
          report's required_procurement_mw — the discharge, not the award, is what
          moves the report's procurement_deviation_mw from negative to non-negative.
        test_recipe:
          setup:
            - "Clock 2026-08-01. Plan P APPROVED_WITH_CONDITIONS with one PlanCondition (required_procurement_mw 100); commitment C of 100 MW issued against candidate K listing that condition; approved snapshot exists for report_year 2031."
