              as: Retailer
              as_user_id: "${retailer_id}"
          assert:
            - "first response HTTP status is 201 and already carries grant_status == ACTIVE, registry_publication_status == PUBLISHED, valid_from == 2026-08-01T00:00:00.000Z and valid_until == 2027-08-01T00:00:00.000Z, with no second read needed"
            - "second response HTTP status is 200 with grant_status == ACTIVE, grade == A, decided_overall_score == 100.00 and the same valid_from / valid_until instants as the publication response"
            - "third response HTTP status is 201 with status == AUTHORIZED, so the freshly activated grant was already usable by another aggregate in the very next call"
            - "fourth response: active_display_count == 1 and participation_tier == BASELINE, recomputed within the same request chain"
            - "RegistryEntry.${entry_id}.published_at == 2026-08-01T00:00:00.000Z and published_by_user_id == reviewer-2"
