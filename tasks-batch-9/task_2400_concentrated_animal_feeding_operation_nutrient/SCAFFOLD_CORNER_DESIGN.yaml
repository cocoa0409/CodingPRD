              payload: { plan_id: "${pl_id}", field_id: "${fld_id}", soil_test_id: "${soil_vhigh_id}", crop: "CORN_GRAIN", yield_goal: 190, previous_crop: "SOYBEAN", planned_application_method: "INJECTION" }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { e_zero: $.data.error_id }
            - call: "POST /cafo/field-budgets"
              payload: { plan_id: "${pl_id}", field_id: "${fld_id}", soil_test_id: "${soil_old_id}", crop: "CORN_GRAIN", yield_goal: 190, previous_crop: "SOYBEAN", planned_application_method: "INJECTION" }
