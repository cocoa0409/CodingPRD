              as: CareCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /dme/policies"
              payload: { member_id: "${m_id}", payer_name: "PayerX", plan_type: "COMMERCIAL_PPO", benefit_period_start: "2026-01-01", benefit_period_end: "2027-01-01", requires_prior_auth: true }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_id}", diagnosis_code: "Z39.1", pump_type: "DOUBLE_ELECTRIC", issued_date: "2026-04-15", expiration_date: "2026-10-01" }
              as: CareCoordinator
              captures: { rx_id: $.data.id }
            - call: "POST /dme/prescriptions/${rx_id}/verify"
              as: InsuranceSpecialist
            - call: "POST /dme/pump-orders"
              payload: { member_id: "${m_id}", policy_id: "${pol_id}", prescription_id: "${rx_id}", pump_item_id: "${pump_id}", shipping_address: "8 Walnut St" }
              as: CareCoordinator
              captures: { o_id: $.data.id }
            - call: "POST /dme/pump-orders/${o_id}/qualify"
              as: InsuranceSpecialist
            - call: "POST /dme/prior-authorizations"
              payload: { pump_order_id: "${o_id}" }
              as: InsuranceSpecialist
              captures: { pa_id: $.data.id }
          trigger:
            - call: "POST /dme/prior-authorizations/${pa_id}/payer-decision"
              payload: { decision: "PENDED", payer_notes: "need physician notes" }
