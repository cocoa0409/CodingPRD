# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7. Sections and claim_types come from
# references/claim-extraction-guide.md. §1.8-covered corners are emitted as
# excluded_because: stubs (no test_recipe).
# Shared literals identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_household_returns_201_and_ledger_defaults
        claim_type: Creation
        grounds:
          - "entities.Household"
          - "endpoints"
        distinguishing_aspect: "POST /households with state_code/fpl_year/primary_applicant_name → 201; covered_member_months=0, active_enrollment_count=0, household_size=0, version=1."
        test_recipe:
          setup: ["StateRule CA and FplSchedule 2026 exist."]
          setup_api_calls:
            - call: "POST /fpl-schedules"
              payload: { year: 2026, base_annual_cents: 1500000, per_member_increment_cents: 520000 }
              as: CaseWorker
            - call: "POST /state-rules"
              payload: { state_code: "CA", is_expansion_state: true, magi_adult_threshold_pct: 138, magi_child_threshold_pct: 200, abd_asset_limit_cents: 200000, standard_asset_limit_cents: 300000 }
              as: CaseWorker
          trigger:
            - call: "POST /households"
              payload: { state_code: "CA", fpl_year: 2026, primary_applicant_name: "Hannah H" }
              as: Applicant
              captures: { hh_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Household.${hh_id}.covered_member_months == 0"
            - "Household.${hh_id}.active_enrollment_count == 0"
            - "Household.${hh_id}.household_size == 0"
            - "Household.${hh_id}.version == 1"

      - name: get_household_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "entities.Household"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /households/{non-existent uuid} → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty households table."]
          setup_api_calls: []
          trigger:
            - call: "GET /households/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: CaseWorker
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_household_missing_required_state_code_returns_422
        claim_type: Required Fields
        grounds:
          - "entities.Household.fields.state_code"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /households omitting state_code → ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["FplSchedule 2026 exists."]
          setup_api_calls:
            - call: "POST /fpl-schedules"
              payload: { year: 2026, base_annual_cents: 1500000, per_member_increment_cents: 520000 }
              as: CaseWorker
          trigger:
            - call: "POST /households"
              payload: { fpl_year: 2026, primary_applicant_name: "No State" }
              as: CaseWorker
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_member_invalid_relationship_enum_returns_422
        claim_type: Type Constraints
        grounds:
          - "entities.HouseholdMember.fields.relationship"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /households/{id}/members with relationship=COUSIN (not in enum) → ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A CA household exists."]
          setup_api_calls:
            - call: "POST /fpl-schedules"
              payload: { year: 2026, base_annual_cents: 1500000, per_member_increment_cents: 520000 }
              as: CaseWorker
            - call: "POST /state-rules"
              payload: { state_code: "CA", is_expansion_state: true, magi_adult_threshold_pct: 138, magi_child_threshold_pct: 200, abd_asset_limit_cents: 200000, standard_asset_limit_cents: 300000 }
              as: CaseWorker
            - call: "POST /households"
              payload: { state_code: "CA", fpl_year: 2026, primary_applicant_name: "Enum E" }
              as: CaseWorker
              captures: { hh_id: $.data.id }
          trigger:
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Bad Rel", age: 30, relationship: "COUSIN" }
              as: CaseWorker
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: income_source_magi_countable_computed_from_type
        claim_type: Computed Fields
        grounds:
          - "entities.IncomeSource.fields.is_magi_countable"
          - "calculations.magi_annual_income"
        distinguishing_aspect: "WAGES source → is_magi_countable=true; CHILD_SUPPORT source → is_magi_countable=false (computed from income_type, client input ignored)."
        test_recipe:
          setup: ["A CA household with one member."]
          setup_api_calls:
            - call: "POST /fpl-schedules"
              payload: { year: 2026, base_annual_cents: 1500000, per_member_increment_cents: 520000 }
              as: CaseWorker
            - call: "POST /state-rules"
              payload: { state_code: "CA", is_expansion_state: true, magi_adult_threshold_pct: 138, magi_child_threshold_pct: 200, abd_asset_limit_cents: 200000, standard_asset_limit_cents: 300000 }
              as: CaseWorker
            - call: "POST /households"
              payload: { state_code: "CA", fpl_year: 2026, primary_applicant_name: "Comp C" }
              as: CaseWorker
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Comp C", age: 30, relationship: "SELF" }
              as: CaseWorker
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /members/${mem_id}/income-sources"
              payload: { income_type: "WAGES", monthly_amount_cents: 100000 }
              as: CaseWorker
              captures: { wage_id: $.data.id }
            - call: "POST /members/${mem_id}/income-sources"
              payload: { income_type: "CHILD_SUPPORT", monthly_amount_cents: 50000 }
              as: CaseWorker
              captures: { cs_id: $.data.id }
          assert:
            - "IncomeSource.${wage_id}.is_magi_countable == true"
            - "IncomeSource.${cs_id}.is_magi_countable == false"

      - name: asset_exempt_and_countable_value_computed
        claim_type: Computed Fields
        grounds:
          - "entities.Asset.fields.is_exempt"
          - "entities.Asset.fields.countable_value_cents"
          - "calculations.countable_assets_and_eligibility"
        distinguishing_aspect: "HOME asset → is_exempt=true, countable_value_cents=0; BURIAL_FUND value 200000 → countable_value_cents=50000 (above EXEMPT_BURIAL_CAP_CENTS=150000)."
        test_recipe:
          setup: ["A CA household exists."]
          setup_api_calls:
            - call: "POST /fpl-schedules"
              payload: { year: 2026, base_annual_cents: 1500000, per_member_increment_cents: 520000 }
              as: CaseWorker
            - call: "POST /state-rules"
              payload: { state_code: "CA", is_expansion_state: true, magi_adult_threshold_pct: 138, magi_child_threshold_pct: 200, abd_asset_limit_cents: 200000, standard_asset_limit_cents: 300000 }
              as: CaseWorker
            - call: "POST /households"
              payload: { state_code: "CA", fpl_year: 2026, primary_applicant_name: "Asset A" }
              as: CaseWorker
              captures: { hh_id: $.data.id }
          trigger:
            - call: "POST /households/${hh_id}/assets"
              payload: { asset_type: "HOME", value_cents: 5000000 }
              as: CaseWorker
              captures: { home_id: $.data.id }
            - call: "POST /households/${hh_id}/assets"
              payload: { asset_type: "BURIAL_FUND", value_cents: 200000 }
              as: CaseWorker
              captures: { burial_id: $.data.id }
          assert:
            - "Asset.${home_id}.is_exempt == true"
            - "Asset.${home_id}.countable_value_cents == 0"
            - "Asset.${burial_id}.countable_value_cents == 50000"

      - name: member_id_system_field_input_ignored
        claim_type: System Fields
        grounds:
          - "entities.HouseholdMember.fields.household_id"
        distinguishing_aspect: "household_id on a created member is system-assigned from the path; a household_id in the body is ignored."
        test_recipe:
          setup: ["A CA household exists."]
          setup_api_calls:
            - call: "POST /fpl-schedules"
              payload: { year: 2026, base_annual_cents: 1500000, per_member_increment_cents: 520000 }
              as: CaseWorker
            - call: "POST /state-rules"
              payload: { state_code: "CA", is_expansion_state: true, magi_adult_threshold_pct: 138, magi_child_threshold_pct: 200, abd_asset_limit_cents: 200000, standard_asset_limit_cents: 300000 }
              as: CaseWorker
            - call: "POST /households"
              payload: { state_code: "CA", fpl_year: 2026, primary_applicant_name: "Sys S" }
              as: CaseWorker
              captures: { hh_id: $.data.id }
          trigger:
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Sys S", age: 30, relationship: "SELF" }
              as: CaseWorker
              captures: { mem_id: $.data.id, mem_hh: $.data.household_id }
          assert:
            - "HouseholdMember.${mem_id}.household_id == ${hh_id}"

      - name: household_size_recomputed_on_member_exclude
        claim_type: Computed Fields
        grounds:
          - "entities.Household.fields.household_size"
          - "entities.HouseholdMember.fields.member_status"
        distinguishing_aspect: "Adding two COUNTED members makes household_size=2; excluding one drops it to 1 (EXCLUDED members do not count)."
        test_recipe:
          setup: ["A CA household with two COUNTED members."]
          setup_api_calls:
            - call: "POST /fpl-schedules"
              payload: { year: 2026, base_annual_cents: 1500000, per_member_increment_cents: 520000 }
              as: CaseWorker
            - call: "POST /state-rules"
              payload: { state_code: "CA", is_expansion_state: true, magi_adult_threshold_pct: 138, magi_child_threshold_pct: 200, abd_asset_limit_cents: 200000, standard_asset_limit_cents: 300000 }
              as: CaseWorker
            - call: "POST /households"
              payload: { state_code: "CA", fpl_year: 2026, primary_applicant_name: "Size S" }
              as: CaseWorker
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Size S", age: 30, relationship: "SELF" }
              as: CaseWorker
              captures: { mem_a: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Sib S", age: 25, relationship: "OTHER" }
              as: CaseWorker
              captures: { mem_b: $.data.id }
          trigger:
            - call: "POST /members/${mem_b}/exclude"
              payload: {}
              as: CaseWorker
          assert:
            - "HouseholdMember.${mem_b}.member_status == EXCLUDED"
            - "Household.${hh_id}.household_size == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: submit_application_from_submitted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Application.DRAFT_to_SUBMITTED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Submitting an already-SUBMITTED application (no DRAFT→SUBMITTED defined from SUBMITTED) → ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A SUBMITTED application on a CA household with one COUNTED member."]
          setup_api_calls:
            - call: "POST /fpl-schedules"
              payload: { year: 2026, base_annual_cents: 1500000, per_member_increment_cents: 520000 }
              as: CaseWorker
            - call: "POST /state-rules"
              payload: { state_code: "CA", is_expansion_state: true, magi_adult_threshold_pct: 138, magi_child_threshold_pct: 200, abd_asset_limit_cents: 200000, standard_asset_limit_cents: 300000 }
              as: CaseWorker
            - call: "POST /households"
              payload: { state_code: "CA", fpl_year: 2026, primary_applicant_name: "Dup D" }
              as: CaseWorker
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Dup D", age: 30, relationship: "SELF" }
              as: CaseWorker
            - call: "POST /households/${hh_id}/applications"
              payload: { pathway: "MAGI", magi_variant: "POINT_IN_TIME" }
              as: CaseWorker
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: initial_state_application_draft_unverified
        claim_type: Initial State
        grounds:
          - "state_machines.Application"
          - "entities.Application.fields.review_status"
          - "entities.Application.fields.verification_status"
        distinguishing_aspect: "A freshly created Application starts review_status=DRAFT and verification_status=UNVERIFIED (parallel dimensions both at initial)."
        test_recipe:
          setup: ["A CA household with one member exists."]
          setup_api_calls:
            - call: "POST /fpl-schedules"
              payload: { year: 2026, base_annual_cents: 1500000, per_member_increment_cents: 520000 }
              as: CaseWorker
            - call: "POST /state-rules"
              payload: { state_code: "CA", is_expansion_state: true, magi_adult_threshold_pct: 138, magi_child_threshold_pct: 200, abd_asset_limit_cents: 200000, standard_asset_limit_cents: 300000 }
              as: CaseWorker
            - call: "POST /households"
              payload: { state_code: "CA", fpl_year: 2026, primary_applicant_name: "Init I" }
              as: CaseWorker
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Init I", age: 30, relationship: "SELF" }
              as: CaseWorker
          trigger:
            - call: "POST /households/${hh_id}/applications"
              payload: { pathway: "MAGI", magi_variant: "POINT_IN_TIME" }
              as: CaseWorker
              captures: { app_id: $.data.id }
          assert:
            - "Application.${app_id}.review_status == DRAFT"
            - "Application.${app_id}.verification_status == UNVERIFIED"

      - name: terminal_renewed_redetermination_finalize_again_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Redetermination"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A RENEWED (terminal) redetermination cannot be finalized again → ERR_INVALID_STATE (409); the RENEWED→ACTIVE cascade does not re-fire."
        test_recipe:
          setup: ["A redetermination already RENEWED for a CA enrollment."]
          setup_api_calls:
            - call: "POST /fpl-schedules"
              payload: { year: 2026, base_annual_cents: 1500000, per_member_increment_cents: 520000 }
              as: CaseWorker
            - call: "POST /state-rules"
              payload: { state_code: "CA", is_expansion_state: true, magi_adult_threshold_pct: 138, magi_child_threshold_pct: 200, abd_asset_limit_cents: 200000, standard_asset_limit_cents: 300000 }
              as: CaseWorker
            - call: "POST /households"
              payload: { state_code: "CA", fpl_year: 2026, primary_applicant_name: "Lock L" }
              as: CaseWorker
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Lock L", age: 30, relationship: "SELF" }
              as: CaseWorker
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/income-sources"
              payload: { income_type: "WAGES", monthly_amount_cents: 120000 }
              as: CaseWorker
            - call: "POST /households/${hh_id}/applications"
              payload: { pathway: "MAGI", magi_variant: "POINT_IN_TIME" }
              as: CaseWorker
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
            - call: "POST /applications/${app_id}/claim-review"
              payload: {}
              as: CaseWorker
            - call: "POST /applications/${app_id}/determinations"
              payload: {}
              as: CaseWorker
            - call: "POST /applications/${app_id}/verify"
              payload: {}
              as: CaseWorker
            - call: "POST /applications/${app_id}/decide"
              payload: { target_status: "APPROVED" }
              as: CaseWorker
            - call: "POST /enrollments"
              payload: { household_id: "${hh_id}", application_id: "${app_id}", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2026-12-31T00:00:00Z", redetermination_due: "2026-11-01T00:00:00Z" }
              as: CaseWorker
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseWorker
              captures: { enr_v: $.data.version }
            - call: "POST /applications/${app_id}/determinations"
              payload: {}
              as: CaseWorker
              captures: { redet_det_id: $.data.id }
            - call: "POST /redeterminations"
              payload: { enrollment_id: "${enr_id}", window_open: "2026-11-01T00:00:00Z", window_close: "2026-12-15T00:00:00Z", new_determination_id: "${redet_det_id}", expected_enrollment_version: "${enr_v}" }
              as: CaseWorker
              captures: { redet_id: $.data.id }
            - call: "POST /redeterminations/${redet_id}/finalize"
              payload: { target_status: "RENEWED" }
              as: CaseWorker
          trigger:
            - call: "POST /redeterminations/${redet_id}/finalize"
              payload: { target_status: "RENEWED" }
              as: CaseWorker
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: redetermination_in_progress_blocks_second_open
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Enrollment.ACTIVE_to_IN_REDETERMINATION"
          - "errors[ERR_REDETERMINATION_IN_PROGRESS]"
        distinguishing_aspect: "Opening a second redetermination while one is still INITIATED (enrollment in coverage_status=IN_REDETERMINATION) → ERR_REDETERMINATION_IN_PROGRESS (409) via the endpoint-specific state check at validations priority 5.5, which supersedes the generic ERR_INVALID_STATE."
        test_recipe:
          setup: ["An IN_REDETERMINATION enrollment with an INITIATED redetermination already open over [2026-11-01, 2026-12-15)."]
          setup_api_calls:
            - call: "POST /fpl-schedules"
              payload: { year: 2026, base_annual_cents: 1500000, per_member_increment_cents: 520000 }
              as: CaseWorker
            - call: "POST /state-rules"
              payload: { state_code: "CA", is_expansion_state: true, magi_adult_threshold_pct: 138, magi_child_threshold_pct: 200, abd_asset_limit_cents: 200000, standard_asset_limit_cents: 300000 }
              as: CaseWorker
            - call: "POST /households"
              payload: { state_code: "CA", fpl_year: 2026, primary_applicant_name: "Prog P" }
              as: CaseWorker
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "Prog P", age: 30, relationship: "SELF" }
              as: CaseWorker
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/income-sources"
              payload: { income_type: "WAGES", monthly_amount_cents: 120000 }
              as: CaseWorker
            - call: "POST /households/${hh_id}/applications"
              payload: { pathway: "MAGI", magi_variant: "POINT_IN_TIME" }
              as: CaseWorker
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
            - call: "POST /applications/${app_id}/claim-review"
              payload: {}
              as: CaseWorker
            - call: "POST /applications/${app_id}/determinations"
              payload: {}
              as: CaseWorker
            - call: "POST /applications/${app_id}/verify"
              payload: {}
              as: CaseWorker
            - call: "POST /applications/${app_id}/decide"
              payload: { target_status: "APPROVED" }
              as: CaseWorker
            - call: "POST /enrollments"
              payload: { household_id: "${hh_id}", application_id: "${app_id}", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2026-12-31T00:00:00Z", redetermination_due: "2026-11-01T00:00:00Z" }
              as: CaseWorker
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CaseWorker
              captures: { enr_v: $.data.version }
            - call: "POST /applications/${app_id}/determinations"
              payload: {}
              as: CaseWorker
              captures: { redet_det_id: $.data.id }
            - call: "POST /redeterminations"
              payload: { enrollment_id: "${enr_id}", window_open: "2026-11-01T00:00:00Z", window_close: "2026-12-15T00:00:00Z", new_determination_id: "${redet_det_id}", expected_enrollment_version: "${enr_v}" }
              as: CaseWorker
              captures: { redet1: $.data.id }
            - call: "GET /enrollments/${enr_id}"
              payload: {}
              as: CaseWorker
              captures: { enr_v2: $.data.version }
          trigger:
            - call: "POST /redeterminations"
              payload: { enrollment_id: "${enr_id}", window_open: "2026-12-20T00:00:00Z", window_close: "2026-12-31T00:00:00Z", new_determination_id: "${redet_det_id}", expected_enrollment_version: "${enr_v2}" }
              as: CaseWorker
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_REDETERMINATION_IN_PROGRESS"

      - name: rule_already_overturned_appeal_again_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Appeal.HEARD_to_OVERTURNED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Ruling an appeal that is already OVERTURNED (terminal) → ERR_INVALID_STATE (409); the reinstatement cascade does not re-fire, so the enrollment stays ACTIVE."
        test_recipe:
          setup: ["An appeal already ruled OVERTURNED (terminal); its enrollment is back to ACTIVE."]
          setup_api_calls:
            - call: "POST /fpl-schedules"
              payload: { year: 2026, base_annual_cents: 1500000, per_member_increment_cents: 520000 }
              as: CaseWorker
            - call: "POST /state-rules"
              payload: { state_code: "CA", is_expansion_state: true, magi_adult_threshold_pct: 138, magi_child_threshold_pct: 200, abd_asset_limit_cents: 200000, standard_asset_limit_cents: 300000 }
              as: CaseWorker
            - call: "POST /households"
              payload: { state_code: "CA", fpl_year: 2026, primary_applicant_name: "NotTerm N" }
              as: CaseWorker
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/members"
              payload: { full_name: "NotTerm N", age: 30, relationship: "SELF" }
              as: CaseWorker
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/income-sources"
              payload: { income_type: "WAGES", monthly_amount_cents: 120000 }
              as: CaseWorker
            - call: "POST /households/${hh_id}/applications"
              payload: { pathway: "MAGI", magi_variant: "POINT_IN_TIME" }
              as: CaseWorker
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
