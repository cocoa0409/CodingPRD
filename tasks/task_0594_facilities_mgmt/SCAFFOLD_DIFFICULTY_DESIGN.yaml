  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: dispatch_completion_strike_suspension_cancels_other_offered_dispatch
        grounds:
          - state_machines.WorkOrder.IN_PROGRESS_to_PENDING_QA
          - state_machines.Dispatch.OFFERED_to_CANCELLED
          - entities.Vendor.fields.strike_count
          - entities.Vendor.fields.status
          - calculations.sla_evaluation
        distinguishing_aspect: |
          Depth-4 chain from POST /fm/dispatches/{id}/complete, each link caused by the previous one:
          (L1) the dispatch completes with an SLA breach -> (L2) that breach increments the vendor's
          strike_count to 3 -> (L3) reaching 3 strikes flips the vendor to SUSPENDED -> (L4) the
          suspension cancels the vendor's OTHER still-OFFERED dispatch and reverts that dispatch's
          work order from DISPATCHED back to NEW with its SLA timestamps cleared.
        test_recipe:
          setup:
            - "Vendor with SLA 60/120 that has already accumulated 2 strikes from two breached completions, so it sits in PROBATION."
            - "A third work order dispatched and accepted late (response breach) but not yet completed."
            - "A fourth work order WO_X dispatched to the same PROBATION vendor, its dispatch still OFFERED."
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/vendors"
              payload: { name: "SlowFix", trade: "HVAC", hourly_rate: 100.00, sla_response_minutes: 60, sla_resolve_minutes: 120 }
              as: FacilityManager
              captures: { v1: $.data.id }
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P3", estimated_labor_hours: 1, estimated_parts_cost: 0 }
              as: FacilityManager
              captures: { w1: $.data.id, w1_v: $.data.version }
            - call: "POST /fm/work-orders/${w1}/dispatches"
              payload: { vendor_id: "${v1}", expected_work_order_version: "${w1_v}" }
              as: FacilityManager
              captures: { dsp1: $.data.id }
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T10:30:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/dispatches/${dsp1}/accept"
              payload: {}
              as: VendorTech
              as_user_id: "${v1}"
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T10:45:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/dispatches/${dsp1}/complete"
              payload: { actual_labor_hours: 1, actual_parts_cost: 0 }
              as: VendorTech
              as_user_id: "${v1}"
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P3", estimated_labor_hours: 1, estimated_parts_cost: 0 }
              as: FacilityManager
              captures: { w2: $.data.id, w2_v: $.data.version }
            - call: "POST /fm/work-orders/${w2}/dispatches"
              payload: { vendor_id: "${v1}", expected_work_order_version: "${w2_v}" }
              as: FacilityManager
              captures: { dsp2: $.data.id }
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T12:30:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/dispatches/${dsp2}/accept"
              payload: {}
              as: VendorTech
              as_user_id: "${v1}"
            - call: "POST /fm/_clock/set_current_utc"
