            - call: "POST /dno/quotes/${quote_id}/accept"
              payload: {}
              as: RiskManager
              as_user_id: "${insured_id}"
              captures: { policy_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dno/ops-runs"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /dno/policies/${policy_id}/claims"
              payload: { claim_type: "SECURITIES_CLASS_ACTION", claimant_name: "Meridian Pension Fund", claimant_capacity: "THIRD_PARTY", wrongful_act_date: "2026-06-10T00:00:00Z", alleged_damages_usd: 9000000 }
              as: RiskManager
              as_user_id: "${insured_id}"
              captures: { claim_id: "$.data.id" }
            - call: "POST /dno/claims/${claim_id}/coverage-decision"
              payload: { decision: "ACCEPT_WITH_ROR", allocation_method: "RELATIVE_EXPOSURE" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { claim_v: "$.data.version" }
            - call: "POST /dno/claims/${claim_id}/defense-invoices"
              payload: { law_firm_name: "Harrow & Blake LLP", invoice_reference: "HB-2026-0001", billed_amount_usd: 400000, covered_matter_amount_usd: 150000, uncovered_matter_amount_usd: 50000, mixed_matter_amount_usd: 200000, insured_person_defendant_count: 3, entity_defendant_count: 1 }
              as: RiskManager
              as_user_id: "${insured_id}"
              captures: { invoice_id: "$.data.id" }
          trigger:
            - call: "POST /dno/defense-invoices/${invoice_id}/allocate"
              payload: { expected_claim_version: "${claim_v}" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
            - call: "POST /dno/policies/${policy_id}/premium-payments"
              payload: { amount_usd: 236468.57 }
              as: RiskManager
              as_user_id: "${insured_id}"
            - call: "POST /dno/defense-invoices/${invoice_id}/allocate"
              payload: { expected_claim_version: "${claim_v}" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
          assert:
            - "the captured claim_v is 2 (the claim is created at version 1 and the coverage decision takes it to 2)"
            - "trigger call 1 returns 402 ERR_PREMIUM_DELINQUENT — the invoice is in SUBMITTED and the claim in COVERAGE_ACCEPTED, both valid, so the only failing precondition lives on the grandparent Policy"
            - "after trigger call 1, GET /dno/claims/${claim_id}/defense-invoices shows the invoice still status == SUBMITTED with covered_allocated_usd, advanced_usd and retention_applied_usd all unset or 0, and GET /dno/claims/${claim_id} still reads status == COVERAGE_ACCEPTED, retention_remaining_usd == 250000, version == 2"
            - "after trigger call 1, GET /dno/policies/${policy_id} still reads total_eroded_usd == 0 and aggregate_remaining_usd == 10000000"
            - "trigger call 2 returns 200 with premium_status == PAID and coverage_status == ACTIVE"
            - "trigger call 3 returns 200 even though it re-sends expected_claim_version 2: the rejected attempt did not consume the claim's OCC token"
            - "trigger call 3 yields covered_allocated_usd == 300000.00 (150000 + 200000 x 3/4), retention_applied_usd == 250000.00, advanced_usd == 50000.00, unfunded_excess_usd == 0.00, allocation_method_applied == RELATIVE_EXPOSURE, status == ADVANCED"
            - "after trigger call 3, GET /dno/claims/${claim_id} reads status == DEFENSE_ADVANCING, retention_remaining_usd == 0.00, retention_applied_usd == 250000.00, advanced_defense_usd == 50000.00, version == 3"
            - "GET /dno/policies/${policy_id}/coverage-parts shows SIDE_B eroded_usd == 50000.00 and remaining_limit_usd == 9950000.00 while SIDE_A and SIDE_C are untouched (SIDE_C never funds defense cost)"
            - "GET /dno/policies/${policy_id} reads total_eroded_usd == 50000.00, aggregate_remaining_usd == 9950000.00, tower_posture == ERODED"
      - name: accept_blocked_by_insured_change_of_control
        grounds:
          - validations[priority=82]
          - validations[priority=20]
          - state_machines.Quote.OFFERED_to_ACCEPTED
          - entities.Insured.fields.control_status
          - concurrency_rules[insured-control-update-stale]
        distinguishing_aspect: |
          A different cross-entity direction: the blocking state sits on the GRANDPARENT of the write
          target (Insured, reached quote -> submission -> insured), it is set by a different role
          (ComplianceOfficer) than the one performing the blocked write (RiskManager), and it is
          reversible — flipping control_status back to INDEPENDENT re-enables the very same accept
          call with no change to the quote itself.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ELEVATED Vantiq Bio Inc insured at version 1 with control_status INDEPENDENT and entity_capacity_cap_usd 25,000,000."
            - "One OFFERED quote (10,000,000 limit, 250,000 retention, 5,000,000 Side C sublimit, quote_valid_until 2026-08-31) whose mandatory CONDUCT term is AGREED, so every other accept precondition already holds."
