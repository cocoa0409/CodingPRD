            - "L2: BondedStockItem.${si_whisky}.on_hand_qty == 30"
            - "L3: ${mv_release_delta} == -60 and BondedMovement.${mv_release}.affects == RESERVED"
            - "L3: PreOrder.${po_8}.status == RELEASED"
            - "L3: BondedStockItem.${si_whisky}.reserved_qty == 0 and available_qty == 30"
            - "L3: BondedStockItem.${si_whisky}.duty_suspended_value_cents == 57600"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: sale_not_cleared_state_error_outranks_bonded_stock_insufficient_fiscal_error
        grounds:
          - validations[priority=60]
          - validations[priority=85]
          - state_machines.Sale.ELIGIBILITY_CLEARED_to_PICKED_UP
        distinguishing_aspect: |
          Category pair state (priority 60, ERR_SALE_NOT_CLEARED) versus business_fiscal
          (priority 85, ERR_BONDED_STOCK_INSUFFICIENT): a pickup on a still-CART sale whose bonded
          stock has been drained to 2 units against a 3-unit line violates both, and the response
          MUST be ERR_SALE_NOT_CLEARED; clearing the sale first then re-attempting pickup proves
