            - "CredentialingPackage.${pkg_id}.committee_cycle_key == 2026-08-15 and projected_effective_on == 2026-11-01 and retro_billing_allowed == false"
            - "ReadinessTask.${rt_id}.status == FAILED (cascade link 1)"
            - "ReadinessTask.${rt_id}.failure_reason is non-empty and ReadinessTask.${rt_id}.verified_by_user_id is null"
