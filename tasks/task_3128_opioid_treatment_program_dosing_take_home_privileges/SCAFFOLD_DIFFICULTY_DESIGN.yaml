              captures: { nurse4_id: $.data.id }
            - call: "POST /otp/patients"
              payload: { program_id: "${prog4_id}", full_name: "Ada Patient", date_of_birth: "1985-04-02", government_id_hash: "sha256:bbbb0001", diagnosis_code: "F11_20", home_state_code: "CA", home_address: "1 Delta Rd", transportation_type: "PRIVATE_VEHICLE", one_way_travel_minutes: 10 }
              as: Physician
