            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-05-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Specialist, as_user_id: "${spec_id}", captures: { w1_id: $.data.id } }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-PP2", specialty_track_id: "${track_id}", question_text: "Post-MI patient asks about cardiac rehab intensity and return-to-work timing after stent.", icd10_primary: "I21", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_id: $.data.id } }
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-03T01:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/consult-requests/${cons_id}/responses", payload: { disposition: "MANAGE_WITH_PLAN", recommendation_text: "Enroll in phase II cardiac rehab 3x weekly; graded return to desk work at 2 weeks." }, as: Specialist, as_user_id: "${spec_id}", captures: { resp_id: $.data.id } }
            - { call: "POST /econsult/quality-reviews", payload: { response_id: "${resp_id}" }, as: QualityReviewer, as_user_id: "${rev_id}", captures: { rev_1: $.data.id } }
            - { call: "POST /econsult/quality-reviews/${rev_1}/complete", payload: { timeliness_score: 2, appropriateness_score: 1, clarity_score: 4, verdict: "REBUKE" }, as: QualityReviewer, as_user_id: "${rev_id}" }
            - { call: "GET /econsult/panel-memberships/${memb_id}", as: ProgramCoordinator, captures: { m_standing: $.data.standing, m_score: $.data.quality_score_bps, m_accepting: $.data.is_accepting } }
          trigger:
