          - state_machines.CustomerOrder.AWAITING_VENDOR_to_CANCELLED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "One §1.2 transition carries a role-conditional precondition — a RESTRICTED buyer cannot cancel their own order, but a CustomerService operator acting on the same order with the same body succeeds."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Vendor V1, Shop S1 OPEN, Event E1 LIVE, Listing L1 allocation 20 at 500 cents."
            - "Customer C1's order O1 carries one 1-unit line, submitted so cancellation_waived is false and the window is open."
            - "C1 is then driven to RESTRICTED by three CANCELLATION ledger entries inside 30 days, produced by three separately cancelled probe orders."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Outfitters", vendor_tier: "STANDARD" }
              as: Merchandiser
