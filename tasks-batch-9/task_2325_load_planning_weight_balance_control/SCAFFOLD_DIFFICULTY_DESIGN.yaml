  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: sheet_issuance_requires_accepted_hazmat
        entity_pair: "LoadSheet depends on HazmatDeclaration"
        dependency: "POST /load-sheets is refused while any CargoItem on the flight with is_dangerous_goods == true and status IN {BOOKED, ACCEPTED, LOADED} lacks a HazmatDeclaration in ACCEPTED status"
        grounds:
          - validations.priority_24
          - state_machines.HazmatDeclaration.transitions.SUBMITTED_to_ACCEPTED
          - entities.Flight.fields.dg_hold_count
        distinguishing_aspect: |
          The blocking row is not even in the payload: the consignment is still
          BOOKED, so base_payload_kg ignores its 400 kg entirely, yet its
          undeclared dangerous goods still bar issuance. The plan is perfectly
          computable and the balance figures never change - only the sheet is
          withheld. Accepting the declaration also clears Flight.dg_hold_count and
          moves load_release_state HELD_FOR_DG -> OPEN, and the previously captured
          plan version is still valid because accepting a declaration does not
          touch the LoadPlan.
        test_recipe:
          setup:
            - "Aircraft HB-AAA with cabin zone OC and hold H1; runway LSGG/04 with the [15, 30) band; STANDARD program; flight at 22 C, 6 kt, DRY."
            - "Plan: OC 50 male / 6 child / 4 infant = 4650.00, H1 bags 1450.00 -> base_payload_kg 6100.00."
            - "A 400.00 kg dangerous-goods consignment is booked on the flight and never assigned or accepted; its declaration is left SUBMITTED, so Flight.dg_hold_count is 1 and load_release_state is HELD_FOR_DG."
          setup_api_calls:
            - call: "POST /aircraft"
              payload: { registration: "HB-AAA", type_code: "B738", basic_empty_weight_kg: 41400, basic_index: 66.56, max_takeoff_weight_kg: 79000, max_landing_weight_kg: 66360, max_zero_fuel_weight_kg: 62730, max_taxi_weight_kg: 79200, ref_arm_m: 17.000, lemac_m: 17.000, mac_length_m: 4.200, index_c: 1000, index_k: 50, fuel_arm_m: 17.900, seat_count: 162, zfw_fwd_limit_pct_mac: 6.0, zfw_aft_limit_pct_mac: 30.0, tow_fwd_limit_pct_mac: 5.0, tow_aft_limit_pct_mac: 28.0, tow_knee_weight_kg: 60000, tow_aft_knee_adjust_pct_mac: -1.5 }
              as: LoadControlAdmin
              captures: { ac1: $.data.id }
            - call: "POST /compartments"
              payload: { aircraft_id: "${ac1}", code: "OC", kind: "CABIN_ZONE", arm_m: 22.900, max_weight_kg: 8000, running_load_limit_kg_per_m: 2000, length_m: 8.0, seat_capacity: 60 }
              as: LoadControlAdmin
              captures: { oc1: $.data.id }
            - call: "POST /compartments"
              payload: { aircraft_id: "${ac1}", code: "H1", kind: "HOLD", arm_m: 9.200, max_weight_kg: 4500, running_load_limit_kg_per_m: 900, length_m: 5.0, seat_capacity: 0 }
              as: LoadControlAdmin
              captures: { h11: $.data.id }
            - call: "POST /runways"
              payload: { airport_code: "LSGG", designator: "04", elevation_ft: 1411, length_m: 3900, slot_capacity_per_window: 2 }
              as: LoadControlAdmin
              captures: { rw1: $.data.id }
            - call: "POST /performance-bands"
              payload: { runway_id: "${rw1}", aircraft_type_code: "B738", temp_lo_c: 15, temp_hi_c: 30, base_limit_weight_kg: 74500 }
              as: LoadControlAdmin
            - call: "POST /weight-programs"
              payload: { code: "STD-2026", program_kind: "STANDARD", male_kg: 88.0, female_kg: 70.0, child_kg: 35.0, infant_kg: 10.0, checked_bag_kg: 13.0, documentation_ref: "OM-A 8.1.3 rev 12" }
              as: LoadControlAdmin
              captures: { wp_std: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T06:00:00Z" }
              as: LoadControlAdmin
            - call: "POST /flights"
              payload: { flight_number: "LX1690", aircraft_id: "${ac1}", departure_runway_id: "${rw1}", weight_program_id: "${wp_std}", scheduled_off_block_utc: "2026-08-15T10:00:00Z", scheduled_on_block_utc: "2026-08-15T12:30:00Z", crew_weight_kg: 1150, crew_arm_m: 13.500, ramp_fuel_kg: 9800, taxi_fuel_kg: 250, trip_fuel_kg: 6900, outside_air_temp_c: 22, headwind_component_kt: 6, runway_condition: "DRY" }
              as: LoadController
              captures: { f1: $.data.id, f1_ver: $.data.version }
            - call: "POST /load-plans"
              payload: { flight_id: "${f1}", expected_flight_version: "${f1_ver}" }
              as: LoadController
              captures: { lp1: $.data.id }
            - call: "POST /pax-lines"
              payload: { load_plan_id: "${lp1}", compartment_id: "${oc1}", male_count: 50, female_count: 0, child_count: 6, infant_count: 4 }
              as: LoadController
            - call: "POST /bag-allocations"
              payload: { load_plan_id: "${lp1}", compartment_id: "${h11}", bag_count: 112, bag_weight_kg: 1450 }
              as: LoadController
