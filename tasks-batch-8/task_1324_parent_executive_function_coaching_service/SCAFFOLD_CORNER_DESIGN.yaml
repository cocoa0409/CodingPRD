        claim_type: violation_to_error
        grounds: ["validations[priority=22]", "errors[ERR_TRACK_MISMATCH]"]
        distinguishing_aspect: "Scheduling an individual session against a GROUP-track package returns ERR_TRACK_MISMATCH (referential rule), even though the package is ACTIVE with credit."
        test_recipe:
          setup: ["ACTIVE plan; ACTIVE GROUP package with 4 credits"]
