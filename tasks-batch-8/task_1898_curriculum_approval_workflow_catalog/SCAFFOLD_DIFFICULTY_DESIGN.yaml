          trigger:
            - { call: "POST /curriculum/proposals/${p0}/decisions", payload: { action: "APPROVE", effective_term_id: "${t1}" }, as: Registrar, as_user_id: "reg-1", captures: { p0_status: $.data.status } }
            - { call: "POST /curriculum/proposals/${p1}/decisions", payload: { action: "APPROVE", effective_term_id: "${t1}" }, as: Registrar, as_user_id: "reg-1", captures: { p1_err: $.data.error_id } }
