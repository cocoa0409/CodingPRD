      - name: ytd_paid_invariant_under_pay_then_void_blocked_keeps_total
        grounds:
          - state_machines.PayoutBatch.OPEN_to_PAID
          - state_machines.PayoutBatch.OPEN_to_VOIDED
          - entities.Shopper.fields.ytd_paid_cents
          - state_machines.Reimbursement.ACCRUED_to_BATCHED
        distinguishing_aspect: |
          Conserved quantity Shopper.ytd_paid_cents: it advances only on OPEN→PAID;
          voiding is defined only from OPEN, so a PAID batch cannot be voided
          (ERR_INVALID_STATE) and ytd_paid_cents stays exactly the paid gross — a
          monetary conserved quantity, different in kind from the wave-count quantity above.
