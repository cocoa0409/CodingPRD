    output: Contractor
    side_effects:
      - "enrollment_status=PENDING_REVIEW, workmanship_score=10000, lifetime_workmanship_score=10000"
      - "upheld_open_remedy_count=0, gross_disbursed_cents=0, clawed_back_total_cents=0, net_disbursed_cents=0"
  - method: GET
    path: "/pace/contractors/{id}"
    description: "Read a contractor with its workmanship scores and disbursement ledger"
    roles: [PropertyOwner, Contractor, UnderwritingAnalyst, ComplianceOfficer, FundingOfficer, CountyOfficer, ProgramAdmin]
    code: 200
