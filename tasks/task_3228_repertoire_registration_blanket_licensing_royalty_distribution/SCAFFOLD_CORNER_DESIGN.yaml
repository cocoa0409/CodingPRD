  # =========================================================================
  # Section: cross_cutting_layers
  # =========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_work_version_on_resolve_conflict
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.conflict-resolution-stale-work]
        distinguishing_aspect: "resolve-conflict with an expected_work_version behind the current version returns ERR_STALE_VERSION (412); a fresh read + retry succeeds."
        test_recipe:
          setup: ["work IN_CONFLICT (claims 6000 ACCEPTED + 5000 DISPUTED); version read, then bumped by an unrelated claim dispute"]
          setup_api_calls:
            - call: "POST /pro/affiliates"
              payload: { legal_name: "OC P1", party_type: PUBLISHER, affiliation_code: "OCP1" }
              as: ProRegistrar
              captures: { oc1: $.data.id }
            - call: "POST /pro/affiliates"
              payload: { legal_name: "OC P2", party_type: PUBLISHER, affiliation_code: "OCP2" }
              as: ProRegistrar
              captures: { oc2: $.data.id }
            - call: "POST /pro/works"
              payload: { title: "OC Song", registered_by_affiliate_id: "${oc1}" }
              as: Publisher
              as_user_id: "${oc1}"
              captures: { oc_work: $.data.id }
            - call: "POST /pro/works/${oc_work}/share-claims"
              payload: { affiliate_id: "${oc1}", role: PUBLISHER, collection_share_bps: 6000, interest_share_bps: 6000 }
              as: Publisher
              as_user_id: "${oc1}"
            - call: "POST /pro/works/${oc_work}/share-claims"
              payload: { affiliate_id: "${oc2}", role: PUBLISHER, collection_share_bps: 5000, interest_share_bps: 5000 }
              as: Publisher
              as_user_id: "${oc2}"
              captures: { oc_claim_b: $.data.id }
            - call: "GET /pro/works/${oc_work}"
              payload: {}
              as: ProRegistrar
              captures: { oc_ver_stale: $.data.version }
            - call: "POST /pro/works/${oc_work}/share-claims"
              payload: { affiliate_id: "${oc2}", role: WRITER, collection_share_bps: 1000, interest_share_bps: 1000 }
              as: Publisher
              as_user_id: "${oc2}"
          trigger:
            - call: "POST /pro/works/${oc_work}/resolve-conflict"
              payload: { accept_claim_ids: [], revoke_claim_ids: ["${oc_claim_b}"], expected_work_version: "${oc_ver_stale}" }
              as: ProRegistrar
            - call: "GET /pro/works/${oc_work}"
              payload: {}
              as: ProRegistrar
              captures: { oc_ver_fresh: $.data.version }
            - call: "POST /pro/works/${oc_work}/resolve-conflict"
              payload: { accept_claim_ids: [], revoke_claim_ids: ["${oc_claim_b}"], expected_work_version: "${oc_ver_fresh}" }
              as: ProRegistrar
              captures: { oc_final_status: $.data.status }
          assert:
            - "first resolve returns ERR_STALE_VERSION (412) because the extra claim insert advanced Work.version"
            - "retry with the fresh version succeeds; oc_final_status == CONFIRMED"
      - name: occ_stale_cycle_version_on_close
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.cycle-close-stale-cycle]
        distinguishing_aspect: "close-collection with a stale expected_cycle_version (captured before a capture call bumped it) returns ERR_STALE_VERSION (412)."
        test_recipe:
