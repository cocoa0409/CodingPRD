      - name: patch_endpoints_update_only_the_supplied_fields
        claim_type: Standard CRUD
        grounds:
          - endpoints[PATCH /leagues/{id}]
          - endpoints[PATCH /team-houses/{id}]
          - endpoints[GET /team-houses/{id}]
          - entities.League
          - entities.TeamHouse
        distinguishing_aspect: |
          A PATCH carrying one field must leave every other field alone and still advance the
          version: patching only minimum_salary_cents on the league keeps roster_lock_at,
          max_negotiation_rounds and the untouched default adult_max_weekly_minutes 2700 while
          version goes 1 -> 2, and patching only turnaround_buffer_minutes on the team house keeps
          name, timezone and concurrent_seat_capacity 5, as the independent GET confirms.
        test_recipe:
          setup:
