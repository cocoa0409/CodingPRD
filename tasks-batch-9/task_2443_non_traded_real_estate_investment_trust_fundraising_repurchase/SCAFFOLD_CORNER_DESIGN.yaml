            - "sub_status == \"PENDING\" and Subscription.${sub_id}.selling_agreement_id == \"${sa_a_id}\""
            - "GET /subscriptions returns total_count == 1"

      - name: offering_state_gate_outranks_the_fiscal_maximum_gate
        claim_type: priority_conflict
        grounds:
          - validations[priority=8].error_id
          - validations[priority=13].error_id
          - errors[ERR_OFFERING_NOT_EFFECTIVE]
          - errors[ERR_OFFERING_MAXIMUM_EXCEEDED]
        excluded_because:
          difficulty_instance: offering_not_effective_outranks_offering_maximum_exceeded
          rationale: |
            The §1.8 instance already violates the cross-entity state rule and the
            fiscal maximum rule with one call and asserts that the priority-8
            error wins, then lifts the state violation to expose the priority-13
            error.

      - name: window_gate_outranks_the_share_sufficiency_gate
        claim_type: priority_ordering
        grounds:
          - validations[priority=9].error_id
          - validations[priority=11].error_id
          - errors[ERR_REPURCHASE_PERIOD_CLOSED]
          - errors[ERR_INSUFFICIENT_SHARES]
        excluded_because:
          difficulty_instance: repurchase_period_closed_outranks_insufficient_shares
          rationale: |
            The §1.8 instance already files a tender that is both outside the
            half-open window and larger than the investor's position and asserts
            the priority-9 error, then repeats it inside the window to surface the
            priority-11 error.

      - name: concurrency_gate_outranks_the_distribution_coverage_gate
        claim_type: priority_conflict
        grounds:
          - validations[priority=6].error_id
          - validations[priority=10].error_id
          - errors[ERR_STALE_OFFERING_VERSION]
          - errors[ERR_UNCOVERED_DISTRIBUTION_UNACKNOWLEDGED]
        excluded_because:
          difficulty_instance: stale_offering_version_outranks_uncovered_distribution_gate
          rationale: |
            The §1.8 instance already sends a stale expected_offering_version
            together with an unacknowledged uncovered distribution and asserts the
            412 wins over the 422, then repeats with a fresh version to surface the
            coverage gate.

  # ===========================================================================
  - section: endpoints
    instances:
      - name: investor_statement_reconciles_holdings_after_a_partial_settlement
        claim_type: computed_read
        grounds:
          - endpoints[GET /investors/{investor_id}/statement]
          - entities.Investor.fields.cumulative_early_repurchase_deduction_cents
          - entities.ShareLot.fields.remaining_shares_e4
          - calculations.transaction_price_selection
        distinguishing_aspect: |
          The statement is a derived read: after a partially settled tender it must
          report open_lot_count 1, total_shares_e4 294000000 and
          estimated_value_cents 29400000 at the published 1000-cent price, with
          the 12000-cent deduction carried on the investor row.
        test_recipe:
          setup:
            - "Offering 'Estuary Income REIT' at 1000 cents per share, zero-load class I, minimum offering 30000000 cents."
            - "One documented investor subscribes 30000000 cents; breaking escrow mints a 300000000 e4 lot."
            - "A July NAV record of 30000000 cents gross asset value is published, holding the class price at 1000 cents."
            - "An August period (2026-08-01T00:00:00Z to a 2026-08-26T00:00:00Z cutoff, settlement 2026-08-30) holds one 10000000 e4 tender worth 1000000 cents against a 600000-cent capacity, and is processed at the cutoff."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Estuary Income REIT", minimum_offering_amount_cents: 30000000, maximum_offering_amount_cents: 50000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000 }
