  - rule_id: compensating_invariant
    instances:
      - name: spare_pool_conserved_across_lease_cycle
        grounds:
          - state_machines.SpareEngine.AVAILABLE_to_LEASED
          - state_machines.SpareEngine.LEASED_to_AVAILABLE
          - state_machines.SpareEngineLease.RESERVED_to_ACTIVE
          - state_machines.SpareEngineLease.ACTIVE_to_RETURNED
        distinguishing_aspect: |
          Conserved quantity = spare-pool availability: activate (+1 LEASED) paired with return
          (-1 LEASED) leaves the pool's AVAILABLE count and the spare's own status exactly as before;
          only the lease's accumulated cost (120000.00) persists.
        test_recipe:
          setup:
            - "Operator, engine ESN-R701 enrolled; visit SCHEDULED planned 2026-09-01; spare SP-R1 AVAILABLE at 4000.00/day"
            - "lease RESERVED over [2026-09-01, 2026-10-01) (30 days)"
