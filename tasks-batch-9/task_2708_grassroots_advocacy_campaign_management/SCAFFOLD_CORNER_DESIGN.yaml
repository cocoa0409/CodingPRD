  # =========================================================================
  # SECTION 3 - CALCULATIONS  (claim-extraction-guide "From Table 3")
  # Correct result, input-set filtering, constants, precision, plus the
  # algorithm-specific boundary rows (projection replay, threshold boundary,
  # decay bucket, waterfall, aggregation zero-quantity) and the dual-variant
  # rows. Divergence corners already owned by SCAFFOLD_DIFFICULTY_DESIGN.yaml
  # appear here as excluded_because stubs.
  # =========================================================================
  - section: calculations
    instances:

      - name: consent_replay_channel_grant_after_all_revoke_regrants_only_that_channel
        claim_type: projection_replay
        grounds:
          - calculations.consent_state_resolution
          - entities.ConsentEvent.fields.sequence_no
          - entities.Supporter.fields.email_consent_state
        distinguishing_aspect: "Replay is per channel and last-event-wins, so an EMAIL GRANT appended after an ALL REVOKE leaves email_consent_state GRANTED while sms and phone stay REVOKED - a naive 'most recent event overall' implementation would re-grant all three."
        test_recipe:
          setup:
            - "One ACTIVE campaign with one legislator (so launch succeeds)."
            - "One supporter created with initial consent on EMAIL, SMS and PHONE (three GRANT events, sequence_no 1..3)."
            - "One ALL-scoped REVOKE appended at sequence_no 4."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CampaignDirector
            - call: "POST /advocacy/campaigns"
              payload: { name: "Fair Housing Now", goal_statement: "Pass HB-1420 out of committee", bill_reference: "HB-1420", target_chamber: "HOUSE", start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", success_metric_target_actions: 500, success_metric_target_supporters: 200, funded_total_cents: 100000 }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { camp_id: $.data.id }
            - call: "POST /advocacy/legislators"
              payload: { campaign_id: "${camp_id}", full_name: "Rep. Alba", district_code: "HD-14", chamber: "HOUSE", stance: "UNDECIDED" }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { leg_id: $.data.id }
            - call: "POST /advocacy/campaigns/${camp_id}/launch"
              payload: {}
              as: CampaignDirector
              as_user_id: "u_dir_1"
            - call: "POST /advocacy/supporters"
              payload: { campaign_id: "${camp_id}", full_name: "Sup One", email: "s1@example.org", phone: "+12025550101", district_code: "HD-14", acquisition_source: "PETITION", initial_consent_channels: ["EMAIL", "SMS", "PHONE"], lawful_basis: "EXPRESS_WRITTEN", consent_source_reference: "petition-sheet-7" }
              as: FieldOrganizer
              as_user_id: "u_field_1"
              captures: { sup1_id: $.data.id, events_after_create: $.data.consent_event_count }
            - call: "POST /advocacy/consent-events"
