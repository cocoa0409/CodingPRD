              captures: { p2_id: $.data.id }
            - call: "POST /sop/promotions"
              payload: { item_id: "${item_id}", customer_id: "${cust_a_id}", start_month: "2026-11", end_month: "2026-12", lift_pct: 8, cannibalization_pct: 1 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { p3_id: $.data.id }
            - call: "POST /sop/promotions"
              payload: { item_id: "${item_id}", customer_id: "${cust_b_id}", start_month: "2026-11", end_month: "2026-12", lift_pct: 8, cannibalization_pct: 1 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { p4_id: $.data.id }
          trigger:
            - call: "POST /sop/promotions/${p1_id}/approve"
              payload: {}
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "POST /sop/promotions/${p2_id}/approve"
              payload: {}
