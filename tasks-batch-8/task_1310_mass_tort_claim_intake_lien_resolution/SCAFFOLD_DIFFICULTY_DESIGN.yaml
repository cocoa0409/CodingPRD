            - call: "POST /settlement-programs/${pid_high}/claims/${cid_high}/assign-tier"
              payload: { tier_matrix_id: "${tmid_high}", expected_claim_version: "${v_high}" }
              as: ProgramAdministrator
            - call: "POST /settlement-programs/${pid_high}/claims/${cid_high}/liens"
              payload: { lien_type: "MEDICAL_PROVIDER", holder_name: "Clinic B", asserted_amount_cents: 1000000 }
              as: LienAnalyst
              captures: { lid_high: $.data.id }
          trigger:
            - call: "POST /settlement-programs/${pid_low}/claims/${cid_low}/liens/${lid_low}/notify"
              payload: {}
              as: LienAnalyst
              captures: { prov_low: $.data.provisional_demand_cents }
            - call: "POST /settlement-programs/${pid_high}/claims/${cid_high}/liens/${lid_high}/notify"
              payload: {}
              as: LienAnalyst
              captures: { prov_high: $.data.provisional_demand_cents }
          assert:
            - "captured prov_low == 400000 (gross 4000000 < 5000000 -> hardship 0.40 branch)"
            - "captured prov_high == 800000 (gross 6000000 >= 5000000 -> standard 0.80 branch)"

      - name: attorney_fee_nested_rounding_mode_b
        grounds:
          - calculations.attorney_fee
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Canonical order is
          per-lien round-then-sum; sum-then-round produces a different cent
          value. The scaffold pins canonical order explicitly. Distinct from
          provisional_lien_demand which is mode (a).
        test_recipe:
          setup:
            - "Claim with gross_award_cents=1000, two RESOLVED PRIVATE_INSURER liens final_demand=101 and 103"
            - "Claimant represented_by_counsel=true"
