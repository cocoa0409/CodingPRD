# =============================================================================
# SCAFFOLD — task_2438 Nursing Licensure & Discipline (state board of nursing)
# §1.0 Response Envelope · §1.1 Entities · §1.2 State Machines ·
# §1.2.1 Concurrency · §1.3 Calculations · §1.4 Validations ·
# §1.5 Endpoints · §1.6 Errors · §1.7 RBAC
# =============================================================================
scenario: |
  Generate task harder than expert level!

  2438. Nursing Licensure & Discipline (state board of nursing): initial licensure by examination
  with education program approval verification and criminal history screening, endorsement and
  multistate compact privilege determination with primary state of residence rules, renewal with
  continuing education, practice hour requirements and audit sampling, complaint intake,
  investigation and evidence gathering including employer records and patient charts,
  alternative-to-discipline program eligibility for impaired practitioners with monitoring
  agreements, disciplinary hearings with sanctions from reprimand through revocation and practice
  restrictions, nurse aide and advanced practice designation administration, national data bank
  reporting and interstate notification

domain_name: nursing-licensure-discipline
api_prefix: ""            # flat root-level collections, e.g. /licenses, /complaints

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Twelve peer entities linked purely by foreign keys; no nesting in URL paths beyond
  # sub-resource reads. Two self-referential edges (License.base_license_id,
  # Complaint.consolidated_into_complaint_id) and one polymorphic edge
  # (NotificationReport.source_entity_type/source_entity_id).

  state_machine_shape: parallel
  # License carries two independent state dimensions (license_status × encumbrance_status);
  # RenewalApplication carries two more (renewal_status × audit_status) with a document-request
  # cycle on the audit dimension. Complaint is branching; DisciplinaryProceeding is cyclic.

  relationship_patterns:
    - one_to_many
    - self_referential
    - polymorphic
    - cross_aggregate

  role_model: segregation_of_duties
  # The BoardMember who presides over a hearing may not cast a panel vote in it, and the
  # BoardMember who approved a nurse's MonitoringAgreement may not vote in a later proceeding
  # against the same nurse.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 12 entities · 66 endpoints · 43 error codes · 8 calculations (3 with variants) ·
  # 6 state-machine blocks over 5 entities, two of them with parallel dimensions and cycles.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------------------
  - name: StateBoardConfig
    parent: null
    common_fields: true
    fields:
      - name: state_code
        type: string
        source: input
        description: "Two-letter USPS state code identifying the board's jurisdiction."
        constraints: "exactly 2 uppercase letters; unique across all StateBoardConfig rows"
      - name: board_name
        type: string
        source: input
        description: "Display name of the state board of nursing."
      - name: compact_member
        type: boolean
        source: input
        description: "True when the state has enacted the Nurse Licensure Compact."
        default: false
      - name: ce_hours_required
        type: number
        source: input
        description: "Continuing-education credit hours required per renewal period."
        default: 30.00
        constraints: "> 0; 2 decimal places"
      - name: ce_self_study_cap_hours
        type: number
        source: input
        description: "Maximum credit hours countable from CeRecord.category == SELF_STUDY."
        default: 12.00
      - name: ce_in_service_cap_hours
        type: number
        source: input
        description: "Maximum credit hours countable from CeRecord.category == IN_SERVICE."
        default: 4.00
      - name: ce_carry_over_cap_hours
        type: number
        source: input
        description: "Maximum credit hours a renewal may carry over from the prior period."
        default: 5.00
      - name: practice_hours_required
        type: integer
        source: input
        description: "Verified practice hours required within practice_lookback_months."
        default: 960
      - name: practice_lookback_months
        type: integer
        source: input
        description: "Length of the practice-hour lookback window in months."
        default: 60
      - name: renewal_period_months
        type: integer
        source: input
        description: "Months between License.issued_on and License.expires_on."
        default: 24
      - name: renewal_grace_period_days
        type: integer
        source: input
        description: "Days after License.expires_on during which a late renewal is still accepted."
        default: 60
      - name: lapse_after_grace_days
        type: integer
        source: input
        description: "Days after expiry at which license_status auto-advances EXPIRED -> LAPSED."
        default: 90
      - name: audit_sample_rate_bp
        type: integer
        source: input
        description: "Practice-hour audit sampling rate in basis points (500 = 5.00%)."
        default: 500
        constraints: "0..10000"
      - name: criminal_lookback_years
        type: integer
        source: input
        description: "Lookback window in years for disqualifying criminal history dispositions."
        default: 7
      - name: disqualifying_offense_codes
        type: array
        source: input
        description: "Offense codes that disqualify an applicant when disposed within the lookback."
        default: ["FEL-A", "SEX-1"]
      - name: renewal_base_fee_cents
        type: integer
        source: input
        description: "Base renewal fee in cents."
        default: 12000
      - name: late_fee_tier1_cents
        type: integer
        source: input
        description: "Late surcharge in cents for late_days 1..30."
        default: 5000
      - name: late_fee_tier2_cents
        type: integer
        source: input
        description: "Late surcharge in cents for late_days 31..renewal_grace_period_days."
        default: 12000
      - name: reinstatement_fee_cents
        type: integer
        source: input
        description: "Surcharge in cents once late_days exceeds renewal_grace_period_days."
        default: 25000
      - name: failed_audit_surcharge_cents
        type: integer
        source: input
        description: "Surcharge in cents when a prior renewal on the same license has audit_status FAILED."
        default: 2500
      - name: phi_authorization_required
        type: boolean
        source: input
        description: "True when a PATIENT_CHART EvidenceRequest must carry phi_authorization_id."
        default: true
      - name: max_concurrent_custodian_holds
        type: integer
        source: input
        description: "Maximum number of mutually overlapping record holds one custodian may bear."
        default: 2
      - name: monitoring_clearance_gap_days
        type: integer
        source: input
        description: "Required clear days between a nurse's prior MonitoringAgreement.end_date and a new agreement's start_date."
        default: 90
      - name: revocation_vote_threshold_bp
        type: integer
        source: input
        description: "Basis-point share of seated panel members required to adopt REVOCATION (6667 = two thirds)."
        default: 6667
      - name: majority_vote_threshold_bp
        type: integer
        source: input
        description: "Basis-point share of seated panel members required to adopt any sanction below REVOCATION."
        default: 5001
      - name: status
        type: enum
        source: system
        description: "Configuration lifecycle; ARCHIVED configs reject new applications and renewals."
        default: ACTIVE
        constraints: "ACTIVE | ARCHIVED"

  # ---------------------------------------------------------------------------
  - name: EducationProgram
    parent: null
    common_fields: true
    fields:
      - name: state_board_config_id
        type: string
        source: input
        description: "FK -> StateBoardConfig.id; the board that approves this program."
      - name: program_code
        type: string
        source: input
        description: "Board-assigned program code."
        constraints: "unique per state_board_config_id"
      - name: program_name
        type: string
        source: input
        description: "Name of the nursing education program."
      - name: degree_level
        type: enum
        source: input
        description: "Credential the program awards."
        constraints: "PN | ADN | BSN | MSN"
      - name: nclex_first_time_pass_rate_bp
        type: integer
        source: input
        description: "First-time NCLEX pass rate in basis points (8200 = 82.00%)."
        constraints: "0..10000"
      - name: approval_expires_on
        type: datetime
        source: input
        description: "Instant at which the program's approval expires; compared against the logical clock."
      - name: approval_status
        type: enum
        source: system
        description: "Approval posture; only PATCH /education-programs/{id} changes it after creation."
        default: APPROVED
        constraints: "APPROVED | PROVISIONAL | PROBATION | WITHDRAWN"

  # ---------------------------------------------------------------------------
  - name: Nurse
    parent: null
    common_fields: true
    fields:
      - name: home_board_config_id
        type: string
        source: input
        description: "FK -> StateBoardConfig.id; board of the nurse's declared primary state of residence."
      - name: full_name
        type: string
        source: input
        description: "Legal name of the nurse."
      - name: birth_year
        type: integer
        source: input
        description: "Year of birth, used only for identity matching."
      - name: ssn_last4
        type: string
        source: input
        description: "Last four digits of the national identifier, used only for identity matching."
      - name: declared_primary_state
        type: string
        source: input
        description: "Two-letter state code the nurse declares as primary state of residence (PSOR)."
      - name: residency_evidence
        type: array
        source: input
        description: "Ordered array of objects { evidence_type: DRIVER_LICENSE|TAX_RETURN|VOTER_REGISTRATION, state_code, effective_date }; array index is the declaration order and is the final tie-break for the RESIDENCY_EVIDENCED privilege variant."
        default: []
      - name: fee_credit_cents
        type: integer
        source: computed
        description: "Unapplied fee credit held for the nurse; refunds from denied renewals land here."
        default: 0
      - name: fee_paid_total_cents
        type: integer
        source: computed
        description: "Lifetime cents the nurse has paid to the board across all renewals."
        default: 0
      - name: prior_discipline_count
        type: integer
        source: computed
        description: "Count of DisciplinaryProceeding rows for this nurse with status ORDER_ISSUED and adopted_sanction_tier != NONE."
        default: 0
      - name: atd_participation_count
        type: integer
        source: computed
        description: "Count of MonitoringAgreement rows for this nurse whose status has ever reached EXECUTED."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Aggregate posture derived from the nurse's licenses; REVOKED once every License for the nurse has encumbrance_status REVOKED."
        default: ACTIVE
        constraints: "ACTIVE | ENCUMBERED | REVOKED"

  # ---------------------------------------------------------------------------
  - name: LicenseApplication
    parent: null
    common_fields: true
    fields:
      - name: nurse_id
        type: string
        source: input
        description: "FK -> Nurse.id; the applicant."
      - name: board_config_id
        type: string
        source: input
        description: "FK -> StateBoardConfig.id; the board the application is filed with."
      - name: education_program_id
        type: string
        source: input
        description: "FK -> EducationProgram.id; required when pathway == EXAMINATION, null for ENDORSEMENT."
        default: null
      - name: pathway
        type: enum
        source: input
        description: "Licensure route."
        constraints: "EXAMINATION | ENDORSEMENT"
      - name: credential_type
        type: enum
        source: input
        description: "Credential sought."
        constraints: "RN | LPN | APRN | NURSE_AIDE"
      - name: aprn_role
        type: enum
        source: input
        description: "Advanced-practice role; required when credential_type == APRN, otherwise null."
        default: null
        constraints: "NP | CRNA | CNS | CNM"
      - name: nclex_result
        type: enum
        source: input
        description: "Licensure examination result reported by the applicant."
        default: NOT_TAKEN
        constraints: "PASS | FAIL | NOT_TAKEN"
      - name: prior_license_state
        type: string
        source: input
        description: "Two-letter state code of the license being endorsed; null for EXAMINATION."
        default: null
      - name: prior_license_number
        type: string
        source: input
        description: "Number of the license being endorsed; null for EXAMINATION."
        default: null
      - name: prior_license_verified
        type: boolean
        source: input
        description: "True once the issuing state has confirmed the endorsed license is unencumbered."
        default: false
      - name: base_license_id
        type: string
        source: input
        description: "FK -> License.id; the ACTIVE RN or LPN license an APRN application builds on, null otherwise."
        default: null
      - name: status
        type: enum
        source: system
        description: "Application lifecycle state; see §1.2 LicenseApplication."
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | DEFICIENT | QUALIFICATION_VERIFIED | SCREENING_IN_PROGRESS | SCREENING_FLAGGED | BOARD_REVIEW | APPROVED | ISSUED | DENIED | WITHDRAWN"
      - name: deficiency_cycle_count
        type: integer
        source: computed
        description: "Number of times the application has entered DEFICIENT; the third entry auto-denies."
        default: 0
      - name: screening_status
        type: enum
        source: computed
        description: "Criminal-history screening posture; advanced by qualification verification and by POST /license-applications/{id}/screening-result."
        default: NOT_ORDERED
        constraints: "NOT_ORDERED | REQUESTED | CLEARED | DISQUALIFYING"
      - name: screening_offense_records
        type: array
        source: input
        description: "Array of objects { offense_code, disposition_date } returned by the screening vendor."
        default: []
      - name: board_decision
        type: enum
        source: computed
        description: "Outcome recorded by POST /license-applications/{id}/board-decision."
        default: NONE
        constraints: "NONE | APPROVED_UNCONDITIONAL | APPROVED_WITH_MONITORING | DENIED"
      - name: submitted_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent DRAFT/DEFICIENT -> SUBMITTED transition."
        default: null
      - name: decided_at
        type: datetime
        source: computed
        description: "Logical-clock instant the application reached APPROVED, DENIED, or ISSUED."
        default: null

  # ---------------------------------------------------------------------------
  - name: License
    parent: null
    common_fields: true
    fields:
      - name: nurse_id
        type: string
        source: input
        description: "FK -> Nurse.id; the licensee."
      - name: issuing_board_config_id
        type: string
        source: input
        description: "FK -> StateBoardConfig.id; the board that issued the credential."
      - name: source_application_id
        type: string
        source: input
        description: "FK -> LicenseApplication.id; the APPROVED application this license was minted from."
      - name: base_license_id
        type: string
        source: input
        description: "FK -> License.id; the underlying RN/LPN license for an APRN credential, null otherwise."
        default: null
      - name: credential_type
        type: enum
        source: input
        description: "Credential class; NURSE_AIDE rows are registry entries rather than practice licenses."
        constraints: "RN | LPN | APRN | NURSE_AIDE"
      - name: aprn_role
        type: enum
        source: input
        description: "Advanced-practice role for APRN credentials, null otherwise."
        default: null
        constraints: "NP | CRNA | CNS | CNM"
      - name: license_number
        type: string
        source: system
        description: "Board-assigned credential number, minted at issuance."
      - name: license_status
        type: enum
        source: system
        description: "Registration dimension of the parallel state machine; see §1.2 License (license_status)."
        default: ACTIVE
        constraints: "ACTIVE | INACTIVE | EXPIRED | LAPSED | SURRENDERED"
      - name: encumbrance_status
        type: enum
        source: system
        description: "Discipline dimension of the parallel state machine; see §1.2 License (encumbrance_status)."
        default: CLEAR
        constraints: "CLEAR | INVESTIGATION_PENDING | RESTRICTED | SUSPENDED | REVOKED"
      - name: multistate_privilege_status
        type: enum
        source: computed
        description: "Output of calculations.multistate_privilege_determination."
        default: NOT_ELIGIBLE
        constraints: "NOT_ELIGIBLE | SINGLE_STATE | MULTISTATE | PRIVILEGE_REVOKED"
      - name: privilege_variant
        type: enum
        source: computed
        description: "Variant of calculations.multistate_privilege_determination used by the most recent determination."
        default: null
        constraints: "RESIDENCY_DECLARED | RESIDENCY_EVIDENCED"
      - name: privilege_basis_state
        type: string
        source: computed
        description: "The primary state of residence the most recent determination resolved to."
        default: null
      - name: practice_restriction_codes
        type: array
        source: computed
        description: "Restriction codes in force, written by a DisciplinaryProceeding order."
        default: []
      - name: open_encumbrance_count
        type: integer
        source: computed
        description: "Output of calculations.license_encumbrance_reconciliation."
        default: 0
      - name: issued_on
        type: datetime
        source: computed
        description: "Logical-clock instant of issuance."
      - name: expires_on
        type: datetime
        source: computed
        description: "issued_on plus StateBoardConfig.renewal_period_months, advanced by each RENEWED renewal."

  # ---------------------------------------------------------------------------
  - name: RenewalApplication
    parent: null
    common_fields: true
    fields:
      - name: license_id
        type: string
        source: input
        description: "FK -> License.id; the credential being renewed."
      - name: period_start_on
        type: datetime
        source: computed
        description: "Start of the CE/practice accounting window; equals the license's current expires_on minus renewal_period_months."
      - name: period_end_on
        type: datetime
        source: computed
        description: "Exclusive end of the accounting window; equals the license's expires_on at creation time."
      - name: renewal_status
        type: enum
        source: system
        description: "Filing dimension of the parallel state machine; see §1.2 RenewalApplication (renewal_status)."
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | CE_DEFICIENT | CE_VERIFIED | RENEWED | DENIED | WITHDRAWN"
      - name: audit_status
        type: enum
        source: system
        description: "Practice-hour audit dimension of the parallel state machine; see §1.2 RenewalApplication (audit_status)."
        default: NOT_SELECTED
        constraints: "NOT_SELECTED | SELECTED | DOCS_REQUESTED | DOCS_SUBMITTED | PASSED | FAILED"
      - name: attested_practice_hours
        type: integer
        source: input
        description: "Practice hours the licensee attests to for the accounting window."
        default: 0
      - name: practice_hour_periods
        type: array
        source: input
        description: "Ordered array of objects { employer_name, start_on, end_on, hours } submitted as audit documentation."
        default: []
      - name: carry_over_hours_claimed
        type: number
        source: input
        description: "CE hours the licensee claims to carry over from the prior period."
        default: 0
      - name: ce_credit_hours_provisional
        type: number
        source: computed
        description: "Output of calculations.ce_hour_credit_total variant provisional_self_reported, written at submit."
        default: null
      - name: ce_credit_hours_audited
        type: number
        source: computed
        description: "Output of calculations.ce_hour_credit_total variant audited_verified, written at CE verification."
        default: null
      - name: verified_practice_hours
        type: integer
        source: computed
        description: "Output of calculations.practice_hour_attainment."
        default: null
      - name: audit_risk_score
        type: number
        source: computed
        description: "Output of the risk_score step of calculations.audit_sample_selection."
        default: null
      - name: fee_applied_cents
        type: integer
        source: computed
        description: "Output of calculations.renewal_fee_assessment, zeroed when the renewal is denied and the fee refunded."
        default: 0
      - name: fee_paid_cents
        type: integer
        source: computed
        description: "Cents actually received for this renewal; never reduced, so the fee ledger invariant stays auditable."
        default: 0
      - name: late_days
        type: integer
        source: computed
        description: "Whole days between the license's expires_on and the payment instant, floored at 0."
        default: 0
      - name: doc_request_cycle_count
        type: integer
        source: computed
        description: "Number of times audit_status has entered DOCS_REQUESTED."
        default: 0
      - name: submitted_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent DRAFT/CE_DEFICIENT -> SUBMITTED transition."
        default: null

  # ---------------------------------------------------------------------------
  - name: CeRecord
    parent: null
    common_fields: true
    fields:
      - name: renewal_application_id
        type: string
        source: input
        description: "FK -> RenewalApplication.id; the renewal this credit is claimed against."
      - name: provider_code
        type: string
        source: input
        description: "Identifier of the CE provider."
      - name: provider_accredited
        type: boolean
        source: input
        description: "True when the provider is board-accredited; unaccredited credit is dropped by the audited variant."
        default: true
      - name: category
        type: enum
        source: input
        description: "CE category, which selects the per-category cap."
        constraints: "LIVE_CONTACT | SELF_STUDY | IN_SERVICE | ACADEMIC"
      - name: minutes
        type: integer
        source: input
        description: "Contact minutes claimed; converted to quarter-hour credit per record before summing."
        constraints: "> 0"
      - name: completion_date
        type: datetime
        source: input
        description: "Instant the activity was completed; compared against the half-open accounting window."
      - name: verification_status
        type: enum
        source: system
        description: "Set by POST /ce-records/{id}/verification."
        default: UNVERIFIED
        constraints: "UNVERIFIED | VERIFIED | REJECTED"
      - name: credit_hours
        type: number
        source: computed
        description: "Per-record quarter-hour credit, round_half_up(minutes / 60 / 0.25) * 0.25."
        default: null

  # ---------------------------------------------------------------------------
  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - name: license_id
        type: string
        source: input
        description: "FK -> License.id; the credential complained about."
      - name: consolidated_into_complaint_id
        type: string
        source: input
        description: "FK -> Complaint.id; set when this complaint is merged into a surviving complaint, null otherwise."
        default: null
      - name: complainant_type
        type: enum
        source: input
        description: "Origin of the complaint; SELF_REPORT earns mitigation in the sanction floor."
        constraints: "PATIENT | EMPLOYER | SELF_REPORT | BOARD_INITIATED | OTHER_STATE_BOARD"
      - name: violation_category
        type: enum
        source: input
        description: "Primary allegation category; selects the base tier of the sanction floor."
        constraints: "PRACTICE_STANDARD | SUBSTANCE_USE | FRAUD | BOUNDARY_VIOLATION | CRIMINAL_CONDUCT"
      - name: allegation_codes
        type: array
        source: input
        description: "Free-form allegation codes recorded at intake."
        default: []
      - name: employer_custodian_codes
        type: array
        source: input
        description: "Custodian codes (facilities, pharmacies, clinics) linked to the allegation; an EvidenceRequest may only name a custodian in this list."
        default: []
      - name: incident_date
        type: datetime
        source: input
        description: "Instant of the alleged conduct."
      - name: received_at
        type: datetime
        source: computed
        description: "Logical-clock instant of intake."
      - name: status
        type: enum
        source: system
        description: "Complaint lifecycle state; see §1.2 Complaint."
        default: RECEIVED
        constraints: "RECEIVED | TRIAGED | CONSOLIDATED | INVESTIGATION_OPEN | EVIDENCE_COMPLETE | ATD_OFFERED | ATD_ACTIVE | REFERRED_FOR_HEARING | PROCEEDING_OPENED | DISMISSED | CLOSED"
      - name: jurisdiction_finding
        type: enum
        source: computed
        description: "Written by POST /complaints/{id}/triage."
        default: PENDING
        constraints: "PENDING | JURISDICTION_CONFIRMED | NO_JURISDICTION | DUPLICATE"
      - name: triaged_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the Investigator who triaged the complaint."
        default: null
      - name: investigator_user_id
        type: string
        source: computed
        description: "X-User-ID of the Investigator who opened the investigation."
        default: null

  # ---------------------------------------------------------------------------
  - name: EvidenceRequest
    parent: null
    common_fields: true
    fields:
      - name: complaint_id
        type: string
        source: input
        description: "FK -> Complaint.id; the investigation this record demand belongs to."
      - name: record_class
        type: enum
        source: input
        description: "Class of record demanded; PATIENT_CHART carries protected health information."
        constraints: "EMPLOYER_PERSONNEL | EMPLOYER_INCIDENT | PATIENT_CHART | PHARMACY_DISPENSING"
      - name: custodian_code
        type: string
        source: input
        description: "Custodian of the records; must appear in the complaint's employer_custodian_codes."
      - name: hold_start_at
        type: datetime
        source: input
        description: "Inclusive start of the custodian's records hold."
      - name: hold_end_at
        type: datetime
        source: input
        description: "Exclusive end of the custodian's records hold; adjacency (prior.hold_end_at == this.hold_start_at) is not a conflict."
      - name: phi_authorization_id
        type: string
        source: input
        description: "Patient authorization identifier; required for PATIENT_CHART when the board sets phi_authorization_required."
        default: null
      - name: status
        type: enum
        source: system
        description: "Production posture of the demand."
        default: REQUESTED
        constraints: "REQUESTED | PRODUCED | WITHDRAWN"
      - name: page_count
        type: integer
        source: input
        description: "Pages produced; written by POST /evidence-requests/{id}/production."
        default: 0
      - name: produced_at
        type: datetime
        source: computed
        description: "Logical-clock instant of production."
        default: null

  # ---------------------------------------------------------------------------
  - name: MonitoringAgreement
    parent: null
    common_fields: true
    fields:
      - name: nurse_id
        type: string
        source: input
        description: "FK -> Nurse.id; the impaired practitioner being monitored."
      - name: complaint_id
        type: string
        source: input
        description: "FK -> Complaint.id; the complaint the alternative-to-discipline offer resolves."
      - name: approved_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the BoardMember who offered the agreement; barred from voting in later proceedings against the same nurse."
      - name: start_date
        type: datetime
        source: input
        description: "Inclusive start of the monitoring period."
      - name: end_date
        type: datetime
        source: input
        description: "Inclusive end of the monitoring period; two agreements for one nurse must be separated by monitoring_clearance_gap_days."
      - name: narcotic_access_restricted
        type: boolean
        source: input
        description: "True when the agreement bars controlled-substance handling."
        default: true
      - name: required_screens_per_quarter
        type: integer
        source: input
        description: "Number of biologic screens the participant must submit each quarter."
        default: 4
      - name: worksite_approval_required
        type: boolean
        source: input
        description: "True when each worksite must be pre-approved by the coordinator."
        default: true
      - name: status
        type: enum
        source: system
        description: "Agreement lifecycle state; see §1.2 MonitoringAgreement."
        default: OFFERED
        constraints: "OFFERED | EXECUTED | ACTIVE | SUSPENDED_PENDING_REVIEW | COMPLETED | BREACHED | TERMINATED"
      - name: compliance_report_count
        type: integer
        source: computed
        description: "Count of COMPLIANCE_REPORT monitoring events recorded against the agreement."
        default: 0
      - name: missed_screen_count
        type: integer
        source: computed
        description: "Cumulative missed screens reported by the coordinator; 3 or more forces SUSPENDED_PENDING_REVIEW."
        default: 0
      - name: executed_at
        type: datetime
        source: computed
        description: "Logical-clock instant the participant signed the agreement."
        default: null

  # ---------------------------------------------------------------------------
  - name: DisciplinaryProceeding
    parent: null
    common_fields: true
    fields:
      - name: complaint_id
        type: string
        source: input
        description: "FK -> Complaint.id; the referred complaint being heard."
      - name: presiding_member_user_id
        type: string
        source: computed
        description: "X-User-ID of the BoardMember who opened the proceeding; barred from casting a panel vote."
      - name: seated_member_user_ids
        type: array
        source: input
        description: "X-User-IDs of the BoardMembers seated on the panel; the presiding member is removed from this list at creation."
      - name: recused_member_user_ids
        type: array
        source: computed
        description: "Seated members removed from the quorum denominator because they approved a MonitoringAgreement for the same nurse."
        default: []
      - name: notice_period_days
        type: integer
        source: input
        description: "Minimum days between noticed_at and hearing_date."
        default: 30
      - name: hearing_date
        type: datetime
        source: input
        description: "Scheduled hearing instant; must be at least notice_period_days after noticed_at."
      - name: noticed_at
        type: datetime
        source: computed
        description: "Logical-clock instant the notice of hearing was issued."
      - name: votes
        type: array
        source: computed
        description: "Append-only array of objects { voter_user_id, proposed_sanction_tier, cast_at }; only the last vote per seated voter counts."
        default: []
      - name: continuance_count
        type: integer
        source: computed
        description: "Number of times the hearing has been continued; the third continuance is refused."
        default: 0
      - name: sanction_floor_tier
        type: enum
        source: computed
        description: "Output of calculations.sanction_severity_floor, frozen when the hearing is convened."
        default: null
        constraints: "REPRIMAND | FINE | PROBATION | PRACTICE_RESTRICTION | SUSPENSION | REVOCATION"
      - name: adopted_sanction_tier
        type: enum
        source: computed
        description: "Output of calculations.panel_vote_tally at deliberation close."
        default: NONE
        constraints: "NONE | REPRIMAND | FINE | PROBATION | PRACTICE_RESTRICTION | SUSPENSION | REVOCATION"
      - name: ordered_restriction_codes
        type: array
        source: input
        description: "Practice restriction codes written into the final order."
        default: []
      - name: status
        type: enum
        source: system
        description: "Proceeding lifecycle state; see §1.2 DisciplinaryProceeding."
        default: NOTICED
        constraints: "NOTICED | HEARING_CONVENED | CONTINUED | DELIBERATION | ORDER_ISSUED | DISMISSED_BY_PANEL"
      - name: order_issued_at
        type: datetime
        source: computed
        description: "Logical-clock instant the final order issued."
        default: null

  # ---------------------------------------------------------------------------
  - name: NotificationReport
    parent: null
    common_fields: true
    fields:
      - name: subject_nurse_id
        type: string
        source: input
        description: "FK -> Nurse.id; the practitioner the report concerns."
      - name: source_entity_type
        type: enum
        source: computed
        description: "Discriminator for the polymorphic source_entity_id reference."
        constraints: "LICENSE | DISCIPLINARY_PROCEEDING | MONITORING_AGREEMENT | LICENSE_APPLICATION"
      - name: source_entity_id
        type: string
        source: computed
        description: "Polymorphic identifier of the record that generated this report; resolve it against source_entity_type. Deliberately not a declared foreign key."
      - name: channel
        type: enum
        source: computed
        description: "Destination of the report."
        constraints: "NPDB | INTERSTATE_COMPACT | NURSE_AIDE_REGISTRY"
      - name: report_kind
        type: enum
        source: computed
        description: "INITIAL for a first filing, REVISION when an order is modified, VOID when an order is vacated."
        default: INITIAL
        constraints: "INITIAL | REVISION | VOID"
      - name: basis_code
        type: string
        source: computed
        description: "Reportable-action code, e.g. REVOCATION, SUSPENSION, RESTRICTION, ATD_BREACH, PRIVILEGE_LOSS."
      - name: payload_summary
        type: string
        source: computed
        description: "One-line human-readable summary transmitted with the report."
      - name: status
        type: enum
        source: system
        description: "Transmission lifecycle; see §1.2 NotificationReport."
        default: QUEUED
        constraints: "QUEUED | TRANSMITTED | ACKNOWLEDGED | VOID"
      - name: queued_at
        type: datetime
        source: computed
        description: "Logical-clock instant the report was queued."
      - name: transmitted_at
        type: datetime
        source: computed
        description: "Logical-clock instant the report was transmitted."
        default: null
      - name: acknowledged_at
        type: datetime
        source: computed
        description: "Logical-clock instant the receiving registry acknowledged the report."
        default: null

# =============================================================================
# §1.2 State Machine Table
# Six blocks over five entities. License and RenewalApplication each carry two
# independent dimensions (parallel). LicenseApplication has a DEFICIENT revision
# cycle plus an EXAMINATION/ENDORSEMENT branch with divergent side-effect sets.
# DisciplinaryProceeding has a CONTINUED cycle and a reopen edge.
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  - entity: LicenseApplication
    dimension: status
    initial_state: DRAFT
    terminal_states: [ISSUED, DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /license-applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "StateBoardConfig.status == ACTIVE for the application's board_config_id"
          - "pathway == EXAMINATION implies education_program_id is not null"
          - "credential_type == APRN implies base_license_id is not null"
        side_effects:
          - "set submitted_at to the logical clock"
        note: "The applicant's X-User-ID must equal nurse_id."

      - from: SUBMITTED
        to: DEFICIENT
        trigger: "POST /license-applications/{id}/deficiency"
        actor: LicensureAnalyst
        preconditions:
          - "status == SUBMITTED"
          - "deficiency_cycle_count < 3"
        side_effects:
          - "increment deficiency_cycle_count by 1"
          - "no auto-transition fires: once deficiency_cycle_count reaches 3 the application stays in DEFICIENT, where a further deficiency and a resubmission are both refused with ERR_DEFICIENCY_LIMIT_REACHED, leaving POST /license-applications/{id}/withdrawal as the only remaining exit"

      - from: DEFICIENT
        to: SUBMITTED
        trigger: "POST /license-applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "status == DEFICIENT"
          - "deficiency_cycle_count < 3"
        side_effects:
          - "set submitted_at to the logical clock"
        note: "Revision cycle: DRAFT -> SUBMITTED -> DEFICIENT -> SUBMITTED. The budget is shared: the third deficiency freezes the application in DEFICIENT with deficiency_cycle_count 3, and both this resubmission edge and a further deficiency then return ERR_DEFICIENCY_LIMIT_REACHED."

      - from: SUBMITTED
        to: QUALIFICATION_VERIFIED
        trigger: "POST /license-applications/{id}/qualification-verification"
        actor: LicensureAnalyst
        preconditions:
          - "status == SUBMITTED"
          - "when pathway == EXAMINATION: the referenced EducationProgram has approval_status IN {APPROVED, PROVISIONAL, PROBATION} and approval_expires_on > the logical clock, and nclex_result == PASS"
          - "when pathway == ENDORSEMENT: prior_license_verified == true and prior_license_state is not null"
          - "when credential_type == APRN: the License referenced by base_license_id has credential_type IN {RN, LPN}, license_status == ACTIVE and encumbrance_status == CLEAR"
        side_effects:
          - "EXAMINATION branch: set screening_status to REQUESTED and advance status to SCREENING_IN_PROGRESS in the same request; when the EducationProgram approval_status == PROBATION also set board_decision to NONE and mark the application for mandatory board review by setting screening_status REQUESTED and recording allegation-free probation review"
          - "ENDORSEMENT branch: set screening_status to REQUESTED and advance status to SCREENING_IN_PROGRESS in the same request, and queue a NotificationReport with channel INTERSTATE_COMPACT, source_entity_type LICENSE_APPLICATION, basis_code ENDORSEMENT_VERIFICATION, status QUEUED"
        note: "The two branches diverge in their side-effect sets: only ENDORSEMENT queues an interstate verification notice."

      - from: QUALIFICATION_VERIFIED
        to: SCREENING_IN_PROGRESS
        trigger: "system, in the same request as qualification-verification"
        actor: system
        preconditions:
          - "screening_status == REQUESTED"
        side_effects:
          - "no additional field writes"
        note: "QUALIFICATION_VERIFIED is observable only inside the request; the response already shows SCREENING_IN_PROGRESS."

      - from: SCREENING_IN_PROGRESS
        to: APPROVED
        trigger: "POST /license-applications/{id}/screening-result with no disqualifying offense in the lookback"
        actor: LicensureAnalyst
        preconditions:
          - "status == SCREENING_IN_PROGRESS"
          - "no entry of screening_offense_records has offense_code IN StateBoardConfig.disqualifying_offense_codes with disposition_date >= (logical clock minus criminal_lookback_years)"
        side_effects:
          - "set screening_status to CLEARED"
          - "set board_decision to APPROVED_UNCONDITIONAL and decided_at to the logical clock"

      - from: SCREENING_IN_PROGRESS
        to: SCREENING_FLAGGED
        trigger: "POST /license-applications/{id}/screening-result with a disqualifying offense in the lookback"
        actor: LicensureAnalyst
        preconditions:
          - "status == SCREENING_IN_PROGRESS"
          - "at least one entry of screening_offense_records has offense_code IN StateBoardConfig.disqualifying_offense_codes with disposition_date >= (logical clock minus criminal_lookback_years)"
        side_effects:
          - "set screening_status to DISQUALIFYING"
          - "advance status to BOARD_REVIEW in the same request (cascade link 2), which itself queues a NotificationReport with channel NPDB, source_entity_type LICENSE_APPLICATION, basis_code SCREENING_FLAG, status QUEUED (cascade link 3)"

      - from: SCREENING_FLAGGED
        to: BOARD_REVIEW
        trigger: "system, in the same request as screening-result"
        actor: system
        preconditions:
          - "screening_status == DISQUALIFYING"
        side_effects:
          - "queue the NPDB NotificationReport described above"

      - from: BOARD_REVIEW
        to: APPROVED
        trigger: "POST /license-applications/{id}/board-decision with decision APPROVED_WITH_MONITORING or APPROVED_UNCONDITIONAL"
        actor: BoardMember
        preconditions:
          - "status == BOARD_REVIEW"
        side_effects:
          - "set board_decision to the submitted decision and decided_at to the logical clock"

      - from: BOARD_REVIEW
        to: DENIED
        trigger: "POST /license-applications/{id}/board-decision with decision DENIED"
        actor: BoardMember
        preconditions:
          - "status == BOARD_REVIEW"
        side_effects:
          - "set board_decision to DENIED and decided_at to the logical clock"
          - "queue a NotificationReport with channel INTERSTATE_COMPACT, source_entity_type LICENSE_APPLICATION, basis_code APPLICATION_DENIED, status QUEUED"

      - from: APPROVED
        to: ISSUED
        trigger: "POST /licenses"
        actor: LicensureAnalyst
        preconditions:
          - "status == APPROVED"
          - "no License already references this application as source_application_id"
        side_effects:
          - "create the License with license_status ACTIVE, encumbrance_status CLEAR, issued_on = logical clock, expires_on = issued_on plus StateBoardConfig.renewal_period_months"
          - "run calculations.multistate_privilege_determination with variant RESIDENCY_DECLARED and write multistate_privilege_status, privilege_variant, privilege_basis_state"
          - "when the new License has credential_type NURSE_AIDE, queue a NotificationReport with channel NURSE_AIDE_REGISTRY, source_entity_type LICENSE, basis_code REGISTRY_ENTRY, status QUEUED"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /license-applications/{id}/withdrawal"
        actor: Applicant
        preconditions: ["status IN {DRAFT, SUBMITTED, DEFICIENT}"]
        side_effects: ["set decided_at to the logical clock"]

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /license-applications/{id}/withdrawal"
        actor: Applicant
        preconditions: ["status IN {DRAFT, SUBMITTED, DEFICIENT}"]
        side_effects: ["set decided_at to the logical clock"]

      - from: DEFICIENT
        to: WITHDRAWN
        trigger: "POST /license-applications/{id}/withdrawal"
        actor: Applicant
        preconditions: ["status IN {DRAFT, SUBMITTED, DEFICIENT}"]
        side_effects: ["set decided_at to the logical clock"]

  # ---------------------------------------------------------------------------
  - entity: License
    dimension: license_status
    initial_state: ACTIVE
    terminal_states: [LAPSED, SURRENDERED]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /licenses/{id}/status-change with to_status INACTIVE"
        actor: LicensureAnalyst
        preconditions:
          - "license_status == ACTIVE"
          - "encumbrance_status IN {CLEAR, INVESTIGATION_PENDING}"
        side_effects:
          - "re-run calculations.multistate_privilege_determination, which yields NOT_ELIGIBLE because license_status != ACTIVE"

      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /licenses/{id}/status-change with to_status ACTIVE"
        actor: LicensureAnalyst
        preconditions:
          - "license_status == INACTIVE"
          - "encumbrance_status != REVOKED"
        side_effects:
          - "re-run calculations.multistate_privilege_determination with variant RESIDENCY_DECLARED"
        note: "Reactivation cycle ACTIVE -> INACTIVE -> ACTIVE."

      - from: ACTIVE
        to: EXPIRED
        trigger: "system, on POST /_clock/set_current_utc when expires_on <= the new clock value"
        actor: system
        preconditions:
          - "license_status == ACTIVE"
          - "expires_on <= the new logical clock value"
        side_effects:
          - "re-run calculations.multistate_privilege_determination, which yields NOT_ELIGIBLE"

      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /renewal-applications/{id}/finalization with outcome RENEWED"
        actor: LicensureAnalyst
        preconditions:
          - "license_status IN {ACTIVE, EXPIRED}"
          - "the logical clock is at or before expires_on plus StateBoardConfig.renewal_grace_period_days"
        side_effects:
          - "advance expires_on by StateBoardConfig.renewal_period_months from its prior value"
          - "re-run calculations.multistate_privilege_determination with variant RESIDENCY_DECLARED"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /renewal-applications/{id}/finalization with outcome RENEWED"
        actor: LicensureAnalyst
        preconditions: ["license_status == ACTIVE"]
        side_effects:
          - "advance expires_on by StateBoardConfig.renewal_period_months from its prior value"

      - from: EXPIRED
        to: LAPSED
        trigger: "system, on POST /_clock/set_current_utc when expires_on plus lapse_after_grace_days <= the new clock value"
        actor: system
        preconditions:
          - "license_status == EXPIRED"
          - "expires_on plus StateBoardConfig.lapse_after_grace_days <= the new logical clock value"
        side_effects:
          - "set multistate_privilege_status to NOT_ELIGIBLE"
          - "for every RenewalApplication of this license with renewal_status IN {DRAFT, SUBMITTED, CE_DEFICIENT, CE_VERIFIED}, set renewal_status to WITHDRAWN"

      - from: ACTIVE
        to: SURRENDERED
        trigger: "POST /licenses/{id}/status-change with to_status SURRENDERED"
        actor: LicensureAnalyst
        preconditions: ["license_status IN {ACTIVE, INACTIVE, EXPIRED}"]
        side_effects:
          - "set multistate_privilege_status to NOT_ELIGIBLE"
          - "queue a NotificationReport with channel INTERSTATE_COMPACT, source_entity_type LICENSE, basis_code SURRENDER, status QUEUED"

      - from: INACTIVE
        to: SURRENDERED
        trigger: "POST /licenses/{id}/status-change with to_status SURRENDERED"
        actor: LicensureAnalyst
        preconditions: ["license_status IN {ACTIVE, INACTIVE, EXPIRED}"]
        side_effects:
          - "set multistate_privilege_status to NOT_ELIGIBLE"
          - "queue the INTERSTATE_COMPACT surrender NotificationReport"

  # ---------------------------------------------------------------------------
  - entity: License
    dimension: encumbrance_status
    initial_state: CLEAR
    terminal_states: [REVOKED]
    transitions:
      - from: CLEAR
        to: INVESTIGATION_PENDING
        trigger: "POST /complaints/{id}/investigation"
        actor: Investigator
        preconditions:
          - "encumbrance_status == CLEAR"
          - "the complaint has status TRIAGED and jurisdiction_finding == JURISDICTION_CONFIRMED"
        side_effects:
          - "run calculations.license_encumbrance_reconciliation, raising open_encumbrance_count by 1"
          - "set Nurse.status to ENCUMBERED when it is currently ACTIVE"

      - from: INVESTIGATION_PENDING
        to: CLEAR
        trigger: "POST /complaints/{id}/disposition with disposition DISMISS, or POST /monitoring-agreements/{id}/monitoring-events with event_type COMPLETION"
        actor: Investigator | MonitoringCoordinator
        preconditions:
          - "encumbrance_status == INVESTIGATION_PENDING"
          - "calculations.license_encumbrance_reconciliation yields open_encumbrance_count == 0 after the complaint leaves the open set"
        side_effects:
          - "run calculations.license_encumbrance_reconciliation, lowering open_encumbrance_count to 0"
          - "set Nurse.status back to ACTIVE when no other License of the nurse has encumbrance_status IN {RESTRICTED, SUSPENDED, REVOKED} and no other open complaint exists"
        note: "Compensating transition for the CLEAR -> INVESTIGATION_PENDING forward action; conserved quantity is open_encumbrance_count."

      - from: INVESTIGATION_PENDING
        to: SUSPENDED
        trigger: "POST /monitoring-agreements/{id}/monitoring-events with event_type BREACH"
        actor: MonitoringCoordinator
        preconditions:
          - "encumbrance_status IN {INVESTIGATION_PENDING, RESTRICTED}"
          - "the agreement's complaint has status ATD_ACTIVE"
        side_effects:
          - "set multistate_privilege_status to PRIVILEGE_REVOKED (cascade link 4)"
          - "queue a NotificationReport with channel NPDB, source_entity_type MONITORING_AGREEMENT, basis_code ATD_BREACH, status QUEUED"
          - "set Nurse.status to ENCUMBERED"

      - from: INVESTIGATION_PENDING
        to: RESTRICTED
        trigger: "POST /disciplinary-proceedings/{id}/order with adopted_sanction_tier IN {PROBATION, PRACTICE_RESTRICTION}"
        actor: BoardMember
        preconditions:
          - "encumbrance_status IN {INVESTIGATION_PENDING, SUSPENDED}"
          - "the proceeding has status DELIBERATION and adopted_sanction_tier != NONE"
        side_effects:
          - "copy the order's ordered_restriction_codes into practice_restriction_codes"
          - "re-run calculations.multistate_privilege_determination, which yields SINGLE_STATE because a sibling License restriction exists"
          - "queue a NotificationReport with channel NPDB, source_entity_type DISCIPLINARY_PROCEEDING, basis_code RESTRICTION, status QUEUED"

      - from: SUSPENDED
        to: RESTRICTED
        trigger: "POST /disciplinary-proceedings/{id}/order with adopted_sanction_tier IN {PROBATION, PRACTICE_RESTRICTION}"
        actor: BoardMember
        preconditions:
          - "encumbrance_status == SUSPENDED"
        side_effects:
          - "copy ordered_restriction_codes into practice_restriction_codes"
          - "queue the NPDB restriction NotificationReport"

      - from: INVESTIGATION_PENDING
        to: SUSPENDED
        trigger: "POST /disciplinary-proceedings/{id}/order with adopted_sanction_tier SUSPENSION"
        actor: BoardMember
        preconditions:
          - "encumbrance_status IN {INVESTIGATION_PENDING, RESTRICTED}"
        side_effects:
          - "set multistate_privilege_status to PRIVILEGE_REVOKED"
          - "queue a NotificationReport with channel NPDB, source_entity_type DISCIPLINARY_PROCEEDING, basis_code SUSPENSION, status QUEUED"

      - from: INVESTIGATION_PENDING
        to: REVOKED
        trigger: "POST /disciplinary-proceedings/{id}/order with adopted_sanction_tier REVOCATION"
        actor: BoardMember
        preconditions:
          - "encumbrance_status IN {INVESTIGATION_PENDING, RESTRICTED, SUSPENDED}"
          - "the proceeding has status DELIBERATION and adopted_sanction_tier == REVOCATION"
        side_effects:
          - "cascade link 2: set this License.encumbrance_status to REVOKED and license_status to SURRENDERED"
          - "cascade link 3: because the License is now REVOKED, set multistate_privilege_status to PRIVILEGE_REVOKED, and for every other License of the same nurse whose base_license_id equals this License.id set license_status to SURRENDERED and encumbrance_status to REVOKED"
          - "cascade link 4: because the dependent APRN License was surrendered, queue one NotificationReport per revoked License (channel NPDB for RN/LPN/APRN, channel NURSE_AIDE_REGISTRY for NURSE_AIDE) with basis_code REVOCATION, plus one channel INTERSTATE_COMPACT report, all status QUEUED; set Nurse.status to REVOKED when every License of the nurse has encumbrance_status REVOKED"
          - "any MonitoringAgreement of the nurse with status IN {OFFERED, EXECUTED, ACTIVE, SUSPENDED_PENDING_REVIEW} is set to TERMINATED"

  # ---------------------------------------------------------------------------
  - entity: RenewalApplication
    dimension: renewal_status
    initial_state: DRAFT
    terminal_states: [RENEWED, DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /renewal-applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "renewal_status == DRAFT or renewal_status == CE_DEFICIENT"
          - "fee_paid_cents >= fee_applied_cents and fee_applied_cents > 0"
          - "the License has license_status IN {ACTIVE, EXPIRED}"
        side_effects:
          - "run calculations.ce_hour_credit_total variant provisional_self_reported and write ce_credit_hours_provisional"
          - "set submitted_at to the logical clock"

      - from: SUBMITTED
        to: CE_DEFICIENT
        trigger: "POST /renewal-applications/{id}/ce-verification when the audited CE total is below the requirement"
        actor: LicensureAnalyst
        preconditions:
          - "renewal_status == SUBMITTED"
        side_effects:
          - "run calculations.ce_hour_credit_total variant audited_verified and write ce_credit_hours_audited"

      - from: CE_DEFICIENT
        to: SUBMITTED
        trigger: "POST /renewal-applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "renewal_status == CE_DEFICIENT"
        side_effects:
          - "recompute ce_credit_hours_provisional over the current CeRecord set"
          - "set submitted_at to the logical clock"
        note: "Revision cycle SUBMITTED -> CE_DEFICIENT -> SUBMITTED; unbounded, because the licensee may keep adding CE."

      - from: SUBMITTED
        to: CE_VERIFIED
        trigger: "POST /renewal-applications/{id}/ce-verification when the audited CE total meets the requirement"
        actor: LicensureAnalyst
        preconditions:
          - "renewal_status == SUBMITTED"
          - "calculations.ce_hour_credit_total variant audited_verified >= StateBoardConfig.ce_hours_required"
        side_effects:
          - "write ce_credit_hours_audited"

      - from: CE_VERIFIED
        to: RENEWED
        trigger: "POST /renewal-applications/{id}/finalization with outcome RENEWED"
        actor: LicensureAnalyst
        preconditions:
          - "renewal_status == CE_VERIFIED"
          - "audit_status IN {NOT_SELECTED, PASSED}"
        side_effects:
          - "advance License.expires_on by StateBoardConfig.renewal_period_months and set License.license_status to ACTIVE when it was EXPIRED"

      - from: CE_VERIFIED
        to: DENIED
        trigger: "POST /renewal-applications/{id}/finalization with outcome DENIED"
        actor: LicensureAnalyst
        preconditions:
          - "renewal_status == CE_VERIFIED"
        side_effects:
          - "compensating action for the fee: add fee_applied_cents to Nurse.fee_credit_cents and set fee_applied_cents to 0, leaving fee_paid_cents and Nurse.fee_paid_total_cents untouched so the fee ledger invariant still balances"
          - "when audit_status == FAILED, create a Complaint with complainant_type BOARD_INITIATED, violation_category FRAUD, status RECEIVED, employer_custodian_codes copied from the audited practice_hour_periods employer names"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /renewal-applications, when a newer renewal supersedes this one"
        actor: system
        preconditions:
          - "renewal_status IN {DRAFT, SUBMITTED, CE_DEFICIENT, CE_VERIFIED}"
        side_effects:
          - "refund: add fee_applied_cents to Nurse.fee_credit_cents and set fee_applied_cents to 0"
        note: "Only one non-terminal renewal may exist per license; creating a new one legitimately supersedes the prior, which is exactly why POST /renewal-applications is OCC-guarded on License.version."

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /renewal-applications, when a newer renewal supersedes this one; or the system EXPIRED -> LAPSED sweep"
        actor: system
        preconditions:
          - "renewal_status IN {DRAFT, SUBMITTED, CE_DEFICIENT, CE_VERIFIED}"
        side_effects:
          - "refund: add fee_applied_cents to Nurse.fee_credit_cents and set fee_applied_cents to 0"

  # ---------------------------------------------------------------------------
  - entity: RenewalApplication
    dimension: audit_status
    initial_state: NOT_SELECTED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: NOT_SELECTED
        to: SELECTED
        trigger: "POST /_ops/run-audit-sampling"
        actor: SystemAdmin
        preconditions:
          - "renewal_status == CE_VERIFIED and audit_status == NOT_SELECTED"
          - "the renewal ranks within the quota computed by calculations.audit_sample_selection"
        side_effects:
          - "write audit_risk_score on every eligible renewal, selected or not"

      - from: SELECTED
        to: DOCS_REQUESTED
        trigger: "POST /renewal-applications/{id}/audit-doc-request"
        actor: LicensureAnalyst
        preconditions:
          - "audit_status IN {SELECTED, DOCS_SUBMITTED}"
          - "doc_request_cycle_count < 3"
        side_effects:
          - "increment doc_request_cycle_count by 1"

      - from: DOCS_REQUESTED
        to: DOCS_SUBMITTED
        trigger: "POST /renewal-applications/{id}/audit-doc-submission"
        actor: Applicant
        preconditions:
          - "audit_status == DOCS_REQUESTED"
        side_effects:
          - "overwrite practice_hour_periods with the submitted array"

      - from: DOCS_SUBMITTED
        to: DOCS_REQUESTED
        trigger: "POST /renewal-applications/{id}/audit-doc-request"
        actor: LicensureAnalyst
        preconditions:
          - "audit_status == DOCS_SUBMITTED"
          - "doc_request_cycle_count < 3"
        side_effects:
          - "increment doc_request_cycle_count by 1"
        note: "Documentation cycle DOCS_REQUESTED -> DOCS_SUBMITTED -> DOCS_REQUESTED, bounded at three requests."

      - from: DOCS_SUBMITTED
        to: PASSED
        trigger: "POST /renewal-applications/{id}/audit-decision"
        actor: LicensureAnalyst
        preconditions:
          - "audit_status == DOCS_SUBMITTED"
          - "calculations.practice_hour_attainment >= StateBoardConfig.practice_hours_required"
        side_effects:
          - "write verified_practice_hours"

      - from: DOCS_SUBMITTED
        to: FAILED
        trigger: "POST /renewal-applications/{id}/audit-decision"
        actor: LicensureAnalyst
        preconditions:
          - "audit_status == DOCS_SUBMITTED"
          - "calculations.practice_hour_attainment < StateBoardConfig.practice_hours_required"
        side_effects:
          - "write verified_practice_hours"
          - "the audit failure forces the filing dimension: renewal_status CE_VERIFIED is retained but POST /renewal-applications/{id}/finalization with outcome RENEWED is refused while audit_status == FAILED"

  # ---------------------------------------------------------------------------
  - entity: Complaint
    dimension: status
    initial_state: RECEIVED
    terminal_states: [CONSOLIDATED, DISMISSED, CLOSED]
    transitions:
      - from: RECEIVED
        to: TRIAGED
        trigger: "POST /complaints/{id}/triage with jurisdiction_finding JURISDICTION_CONFIRMED"
        actor: Investigator
        preconditions:
          - "status == RECEIVED"
          - "the License referenced by license_id has license_status != LAPSED"
        side_effects:
          - "set jurisdiction_finding to JURISDICTION_CONFIRMED and triaged_by_user_id to the caller's X-User-ID"

      - from: RECEIVED
        to: DISMISSED
        trigger: "POST /complaints/{id}/triage with jurisdiction_finding NO_JURISDICTION"
        actor: Investigator
        preconditions: ["status == RECEIVED"]
        side_effects:
          - "set jurisdiction_finding to NO_JURISDICTION and triaged_by_user_id to the caller's X-User-ID"

      - from: RECEIVED
        to: CONSOLIDATED
        trigger: "POST /complaints/{id}/triage with jurisdiction_finding DUPLICATE and a target_complaint_id"
        actor: Investigator
        preconditions:
          - "status == RECEIVED"
          - "target_complaint_id != this complaint's id"
          - "the target Complaint has status NOT IN {CONSOLIDATED, DISMISSED, CLOSED} and its consolidated_into_complaint_id is null"
          - "the target Complaint has the same license_id"
        side_effects:
          - "set consolidated_into_complaint_id to target_complaint_id and jurisdiction_finding to DUPLICATE"
          - "append this complaint's allegation_codes and employer_custodian_codes to the target's, de-duplicated, preserving the target's existing order and then this complaint's order"

      - from: TRIAGED
        to: INVESTIGATION_OPEN
        trigger: "POST /complaints/{id}/investigation"
        actor: Investigator
        preconditions:
          - "status == TRIAGED and jurisdiction_finding == JURISDICTION_CONFIRMED"
        side_effects:
          - "set investigator_user_id to the caller's X-User-ID"
          - "cascade link 2: the License moves CLEAR -> INVESTIGATION_PENDING and open_encumbrance_count rises by 1"
          - "cascade link 3: because the License became encumbered, Nurse.status moves ACTIVE -> ENCUMBERED"

      - from: INVESTIGATION_OPEN
        to: EVIDENCE_COMPLETE
        trigger: "POST /complaints/{id}/evidence-completion"
        actor: Investigator
        preconditions:
          - "status == INVESTIGATION_OPEN"
          - "at least one EvidenceRequest exists for the complaint and every EvidenceRequest for the complaint has status IN {PRODUCED, WITHDRAWN}"
        side_effects:
          - "no field writes beyond status and updated_at"

      - from: EVIDENCE_COMPLETE
        to: DISMISSED
        trigger: "POST /complaints/{id}/disposition with disposition DISMISS"
        actor: Investigator
        preconditions: ["status == EVIDENCE_COMPLETE"]
        side_effects:
          - "cascade: the License re-runs calculations.license_encumbrance_reconciliation; when open_encumbrance_count reaches 0 the encumbrance dimension returns INVESTIGATION_PENDING -> CLEAR and Nurse.status returns ENCUMBERED -> ACTIVE"
          - "every EvidenceRequest of the complaint still in status REQUESTED is set to WITHDRAWN"

      - from: EVIDENCE_COMPLETE
        to: ATD_OFFERED
        trigger: "POST /complaints/{id}/disposition with disposition OFFER_ATD"
        actor: Investigator
        preconditions:
          - "status == EVIDENCE_COMPLETE"
          - "violation_category == SUBSTANCE_USE"
          - "no MonitoringAgreement for this nurse has status BREACHED"
          - "Nurse.prior_discipline_count == 0"
        side_effects:
          - "no field writes beyond status and updated_at"

      - from: ATD_OFFERED
        to: ATD_ACTIVE
        trigger: "POST /monitoring-agreements/{id}/execution"
        actor: Applicant
        preconditions:
          - "status == ATD_OFFERED"
          - "the MonitoringAgreement has status OFFERED and its complaint_id equals this complaint's id"
        side_effects:
          - "increment Nurse.atd_participation_count by 1"

      - from: ATD_ACTIVE
        to: CLOSED
        trigger: "POST /monitoring-agreements/{id}/monitoring-events with event_type COMPLETION"
        actor: MonitoringCoordinator
        preconditions:
          - "status == ATD_ACTIVE"
          - "the MonitoringAgreement has status ACTIVE and the logical clock is strictly after end_date"
        side_effects:
          - "cascade: License encumbrance returns INVESTIGATION_PENDING -> CLEAR once open_encumbrance_count reaches 0; no NotificationReport is queued because a completed alternative-to-discipline agreement is non-reportable"

      - from: ATD_ACTIVE
        to: PROCEEDING_OPENED
        trigger: "POST /monitoring-agreements/{id}/monitoring-events with event_type BREACH"
        actor: MonitoringCoordinator
        preconditions:
          - "status == ATD_ACTIVE"
          - "the MonitoringAgreement has status IN {ACTIVE, SUSPENDED_PENDING_REVIEW}"
        side_effects:
          - "cascade link 2: this complaint moves ATD_ACTIVE -> PROCEEDING_OPENED"
          - "cascade link 3: because the complaint entered PROCEEDING_OPENED, the License moves INVESTIGATION_PENDING -> SUSPENDED"
          - "cascade link 4: because the License became SUSPENDED, multistate_privilege_status becomes PRIVILEGE_REVOKED and an NPDB NotificationReport with basis_code ATD_BREACH is queued"

      - from: EVIDENCE_COMPLETE
        to: REFERRED_FOR_HEARING
        trigger: "POST /complaints/{id}/disposition with disposition REFER_TO_PROCEEDING"
        actor: Investigator
        preconditions: ["status == EVIDENCE_COMPLETE"]
        side_effects:
          - "no field writes beyond status and updated_at"

      - from: REFERRED_FOR_HEARING
        to: PROCEEDING_OPENED
        trigger: "POST /disciplinary-proceedings"
        actor: BoardMember
        preconditions:
          - "status == REFERRED_FOR_HEARING"
          - "the caller's expected_complaint_version matches the complaint's current version"
        side_effects:
          - "create the DisciplinaryProceeding with status NOTICED"
          - "increment Complaint.version by 1"

      - from: PROCEEDING_OPENED
        to: CLOSED
        trigger: "POST /disciplinary-proceedings/{id}/order"
        actor: BoardMember
        preconditions:
          - "status == PROCEEDING_OPENED"
        side_effects:
          - "re-run calculations.license_encumbrance_reconciliation; because a board order is in force the encumbrance dimension is NOT reset to CLEAR even though open_encumbrance_count reaches 0"

  # ---------------------------------------------------------------------------
  - entity: MonitoringAgreement
    dimension: status
    initial_state: OFFERED
    terminal_states: [COMPLETED, BREACHED, TERMINATED]
    transitions:
      - from: OFFERED
        to: EXECUTED
        trigger: "POST /monitoring-agreements/{id}/execution"
        actor: Applicant
        preconditions:
          - "status == OFFERED"
          - "the caller's X-User-ID equals nurse_id"
          - "the linked Complaint has status ATD_OFFERED"
        side_effects:
          - "set executed_at to the logical clock"
          - "advance status to ACTIVE in the same request when start_date <= the logical clock, otherwise remain EXECUTED"
          - "move the linked Complaint ATD_OFFERED -> ATD_ACTIVE and increment Nurse.atd_participation_count by 1"

      - from: EXECUTED
        to: ACTIVE
        trigger: "system, on POST /_clock/set_current_utc when start_date <= the new clock value"
        actor: system
        preconditions: ["status == EXECUTED", "start_date <= the new logical clock value"]
        side_effects: ["no field writes beyond status and updated_at"]

      - from: ACTIVE
        to: SUSPENDED_PENDING_REVIEW
        trigger: "POST /monitoring-agreements/{id}/monitoring-events with event_type MISSED_SCREEN raising missed_screen_count to 3 or more"
        actor: MonitoringCoordinator
        preconditions:
          - "status == ACTIVE"
          - "missed_screen_count + the event's missed_screens >= 3"
        side_effects:
          - "increment missed_screen_count by the event's missed_screens"

      - from: SUSPENDED_PENDING_REVIEW
        to: ACTIVE
        trigger: "POST /monitoring-agreements/{id}/monitoring-events with event_type COMPLIANCE_REPORT"
        actor: MonitoringCoordinator
        preconditions:
          - "status == SUSPENDED_PENDING_REVIEW"
        side_effects:
          - "increment compliance_report_count by 1 and reset missed_screen_count to 0"
        note: "Cycle ACTIVE -> SUSPENDED_PENDING_REVIEW -> ACTIVE."

      - from: ACTIVE
        to: BREACHED
        trigger: "POST /monitoring-agreements/{id}/monitoring-events with event_type BREACH"
        actor: MonitoringCoordinator
        preconditions:
          - "status IN {ACTIVE, SUSPENDED_PENDING_REVIEW}"
        side_effects:
          - "cascade link 1: the agreement becomes BREACHED"
          - "cascade link 2: the linked Complaint moves ATD_ACTIVE -> PROCEEDING_OPENED"
          - "cascade link 3: the License moves INVESTIGATION_PENDING -> SUSPENDED"
          - "cascade link 4: the License's multistate_privilege_status becomes PRIVILEGE_REVOKED and an NPDB NotificationReport with basis_code ATD_BREACH is queued"

      - from: SUSPENDED_PENDING_REVIEW
        to: BREACHED
        trigger: "POST /monitoring-agreements/{id}/monitoring-events with event_type BREACH"
        actor: MonitoringCoordinator
        preconditions: ["status IN {ACTIVE, SUSPENDED_PENDING_REVIEW}"]
        side_effects: ["identical four-link cascade as the ACTIVE -> BREACHED edge"]

      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /monitoring-agreements/{id}/monitoring-events with event_type COMPLETION"
        actor: MonitoringCoordinator
        preconditions:
          - "status == ACTIVE"
          - "the logical clock is strictly after end_date"
          - "compliance_report_count >= 1"
        side_effects:
          - "move the linked Complaint ATD_ACTIVE -> CLOSED"
          - "the License's encumbrance dimension returns INVESTIGATION_PENDING -> CLEAR when open_encumbrance_count reaches 0"

      - from: ACTIVE
        to: TERMINATED
        trigger: "system, on POST /disciplinary-proceedings/{id}/order with adopted_sanction_tier REVOCATION for the same nurse"
        actor: system
        preconditions: ["status IN {OFFERED, EXECUTED, ACTIVE, SUSPENDED_PENDING_REVIEW}"]
        side_effects: ["no field writes beyond status and updated_at"]

  # ---------------------------------------------------------------------------
  - entity: DisciplinaryProceeding
    dimension: status
    initial_state: NOTICED
    terminal_states: [ORDER_ISSUED, DISMISSED_BY_PANEL]
    transitions:
      - from: NOTICED
        to: HEARING_CONVENED
        trigger: "POST /disciplinary-proceedings/{id}/hearing-events with event_type CONVENE"
        actor: BoardMember
        preconditions:
          - "status IN {NOTICED, CONTINUED}"
          - "hearing_date >= noticed_at plus notice_period_days"
          - "the count of seated_member_user_ids minus recused_member_user_ids is >= 3"
        side_effects:
          - "compute recused_member_user_ids as every seated member who appears as approved_by_user_id on a MonitoringAgreement for the same nurse"
          - "run calculations.sanction_severity_floor and freeze the result into sanction_floor_tier"

      - from: HEARING_CONVENED
        to: CONTINUED
        trigger: "POST /disciplinary-proceedings/{id}/hearing-events with event_type CONTINUE"
        actor: BoardMember
        preconditions:
          - "status == HEARING_CONVENED"
          - "continuance_count < 3"
        side_effects:
          - "increment continuance_count by 1"
          - "overwrite hearing_date with the event's new_hearing_date"

      - from: CONTINUED
        to: HEARING_CONVENED
        trigger: "POST /disciplinary-proceedings/{id}/hearing-events with event_type CONVENE"
        actor: BoardMember
        preconditions:
          - "status == CONTINUED"
          - "hearing_date >= noticed_at plus notice_period_days"
        side_effects:
          - "recompute recused_member_user_ids and re-freeze sanction_floor_tier"
        note: "Cycle HEARING_CONVENED -> CONTINUED -> HEARING_CONVENED, bounded at three continuances."

      - from: HEARING_CONVENED
        to: DELIBERATION
        trigger: "POST /disciplinary-proceedings/{id}/hearing-events with event_type CLOSE_HEARING"
        actor: BoardMember
        preconditions:
          - "status == HEARING_CONVENED"
          - "at least one vote has been cast by a seated, non-recused member"
        side_effects:
          - "run calculations.panel_vote_tally and write adopted_sanction_tier"
          - "when the tally yields NONE, advance status to DISMISSED_BY_PANEL in the same request and move the Complaint PROCEEDING_OPENED -> DISMISSED, returning the License encumbrance dimension to CLEAR when open_encumbrance_count reaches 0"

      - from: DELIBERATION
        to: HEARING_CONVENED
        trigger: "POST /disciplinary-proceedings/{id}/hearing-events with event_type REOPEN"
        actor: BoardMember
        preconditions:
          - "status == DELIBERATION"
          - "continuance_count < 3"
        side_effects:
          - "increment continuance_count by 1 and reset adopted_sanction_tier to NONE"
        note: "Reopen edge makes the proceeding machine cyclic on a second axis."

      - from: DELIBERATION
        to: ORDER_ISSUED
        trigger: "POST /disciplinary-proceedings/{id}/order"
        actor: BoardMember
        preconditions:
          - "status == DELIBERATION"
          - "adopted_sanction_tier != NONE"
          - "the tier index of adopted_sanction_tier >= the tier index of sanction_floor_tier"
        side_effects:
          - "set order_issued_at to the logical clock and store ordered_restriction_codes"
          - "increment Nurse.prior_discipline_count by 1"
          - "drive the License encumbrance dimension per the adopted tier (RESTRICTED, SUSPENDED, or the four-link REVOKED cascade)"
          - "move the Complaint PROCEEDING_OPENED -> CLOSED"

      - from: DELIBERATION
        to: DISMISSED_BY_PANEL
        trigger: "system, in the same request as CLOSE_HEARING when calculations.panel_vote_tally yields NONE"
        actor: system
        preconditions: ["status == DELIBERATION", "adopted_sanction_tier == NONE"]
        side_effects:
          - "move the Complaint PROCEEDING_OPENED -> DISMISSED"
          - "return the License encumbrance dimension INVESTIGATION_PENDING -> CLEAR when open_encumbrance_count reaches 0"

  # ---------------------------------------------------------------------------
  - entity: NotificationReport
    dimension: status
    initial_state: QUEUED
    terminal_states: [ACKNOWLEDGED, VOID]
    transitions:
      - from: QUEUED
        to: TRANSMITTED
        trigger: "POST /notification-reports/{id}/status with to_status TRANSMITTED"
        actor: SystemAdmin
        preconditions: ["status == QUEUED"]
        side_effects: ["set transmitted_at to the logical clock"]

      - from: TRANSMITTED
        to: ACKNOWLEDGED
        trigger: "POST /notification-reports/{id}/status with to_status ACKNOWLEDGED"
        actor: SystemAdmin
        preconditions: ["status == TRANSMITTED"]
        side_effects: ["set acknowledged_at to the logical clock"]

      - from: QUEUED
        to: VOID
        trigger: "POST /notification-reports/{id}/status with to_status VOID"
        actor: SystemAdmin
        preconditions: ["status IN {QUEUED, TRANSMITTED}"]
        side_effects: ["set report_kind to VOID"]

      - from: TRANSMITTED
        to: VOID
        trigger: "POST /notification-reports/{id}/status with to_status VOID"
        actor: SystemAdmin
        preconditions: ["status IN {QUEUED, TRANSMITTED}"]
        side_effects: ["set report_kind to VOID"]

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent entity's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: renewal-create-stale-license
    parent_entity: License
    write_endpoint: "POST /renewal-applications"
    occ_field: "expected_license_version"
    description: |
      Creating a RenewalApplication against a License whose version has advanced since the client
      last observed it is rejected with a stale-version error. Only one non-terminal renewal may
      exist per license, and a new renewal legitimately supersedes a prior DRAFT/SUBMITTED one
      (§1.2 RenewalApplication DRAFT -> WITHDRAWN), so a second create carrying the pre-supersede
      version is a stale-view write rather than an invalid-state write.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: proceeding-open-stale-complaint
    parent_entity: Complaint
    write_endpoint: "POST /disciplinary-proceedings"
    occ_field: "expected_complaint_version"
    description: |
      Opening a DisciplinaryProceeding against a Complaint whose version has advanced since the
      client last observed it is rejected with a stale-version error. A referred complaint may
      legitimately gain a second proceeding after a prior one is dismissed by the panel, so the
      guard is expressed as a stale-version check on Complaint.version rather than as a state
      precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ---------------------------------------------------------------------------
  - name: ce_hour_credit_total
    trigger: "POST /renewal-applications/{id}/submit (provisional variant) and POST /renewal-applications/{id}/ce-verification (audited variant)"
    algorithm: aggregation
    formula: |
      # ---- Step 1: per-record credit, ROUNDED PER RECORD BEFORE ANY SUMMING ----
      # The rounding order is pinned: quantise each CeRecord to a quarter hour first,
      # then sum. Summing minutes first and quantising once produces a different total
      # (three 100-minute records give 5.25 h per-record versus 5.00 h summed-first),
      # and at the requirement boundary the two orders flip the renewal outcome.
      for each CeRecord r whose renewal_application_id == this renewal, ordered by r.created_at ASC:
          r.credit_hours = round_half_up((r.minutes / 60) / 0.25) * 0.25     # 2 dp

      # ---- Step 2: inclusion set, variant-dependent ----
      variant provisional_self_reported:
          include r when r.verification_status IN {UNVERIFIED, VERIFIED}
          (provider accreditation is NOT checked; the accounting window is NOT checked)
      variant audited_verified:
          include r when r.verification_status == VERIFIED
                    AND  r.provider_accredited == true
                    AND  period_start_on <= r.completion_date < period_end_on   # half-open window

      # ---- Step 3: per-category subtotals over the included set ----
      cat_sum[c] = round_half_up(sum of r.credit_hours for included r with r.category == c, 2)
                   for c in {LIVE_CONTACT, SELF_STUDY, IN_SERVICE, ACADEMIC}; absent categories are 0.00

      # ---- Step 4: per-category caps ----
      capped[SELF_STUDY]  = min(cat_sum[SELF_STUDY],  board.ce_self_study_cap_hours)
      capped[IN_SERVICE]  = min(cat_sum[IN_SERVICE],  board.ce_in_service_cap_hours)
      capped[LIVE_CONTACT] = cat_sum[LIVE_CONTACT]      # uncapped
      capped[ACADEMIC]     = cat_sum[ACADEMIC]          # uncapped

      # ---- Step 5: carry-over, capped ----
      carry_over_allowed = min(renewal.carry_over_hours_claimed, board.ce_carry_over_cap_hours)

      # ---- Step 6: total ----
      total = round_half_up(capped[LIVE_CONTACT] + capped[SELF_STUDY]
                            + capped[IN_SERVICE] + capped[ACADEMIC]
                            + carry_over_allowed, 2)

      # ---- Step 7: sufficiency test (audited variant only) ----
      sufficient = (total >= board.ce_hours_required)      # >= , so an exact match passes
    input_set: |
      All CeRecord rows with renewal_application_id == this renewal, regardless of verification_status,
      are considered; the variant decides which are included. Rows with verification_status == REJECTED
      are excluded by both variants. board is the StateBoardConfig referenced by
      License.issuing_board_config_id.
    constants:
      MINUTES_PER_HOUR: 60
      CREDIT_INCREMENT_HOURS: 0.25
    precision: "2 decimal places, round_half_up; per-record quantisation to 0.25 h occurs before any summation"
    variants:
      - name: provisional_self_reported
        when: "POST /renewal-applications/{id}/submit — writes ce_credit_hours_provisional"
        difference: "Counts UNVERIFIED records, ignores provider_accredited, and ignores the half-open accounting window, so it is an upper bound on the audited figure."
      - name: audited_verified
        when: "POST /renewal-applications/{id}/ce-verification — writes ce_credit_hours_audited and decides SUBMITTED -> CE_VERIFIED vs SUBMITTED -> CE_DEFICIENT"
        difference: "Requires verification_status == VERIFIED and provider_accredited == true and completion_date inside [period_start_on, period_end_on); the same CeRecord set therefore yields a strictly lower or equal total."

  # ---------------------------------------------------------------------------
  - name: multistate_privilege_determination
    trigger: "POST /licenses (issuance), POST /licenses/{id}/privilege-determination, POST /licenses/{id}/status-change, and every License encumbrance transition"
    algorithm: constraint_propagation
    formula: |
      board = StateBoardConfig referenced by License.issuing_board_config_id
      nurse = Nurse referenced by License.nurse_id

      # ---- Guard chain, evaluated top to bottom; the first match wins ----
      if License.encumbrance_status IN {SUSPENDED, REVOKED}:        return PRIVILEGE_REVOKED
      if License.license_status != ACTIVE:                          return NOT_ELIGIBLE
      if board.compact_member == false:                             return SINGLE_STATE
      if License.credential_type IN {APRN, NURSE_AIDE}:             return SINGLE_STATE

      # ---- Primary state of residence (PSOR), variant-dependent ----
      variant RESIDENCY_DECLARED:
          psor = nurse.declared_primary_state
      variant RESIDENCY_EVIDENCED:
          candidates   = entries e of nurse.residency_evidence with e.effective_date <= clock_now
          ranking      = EVIDENCE_PRIORITY[e.evidence_type] DESC, then e.effective_date DESC
          tie_break    = the entry's zero-based index in nurse.residency_evidence ASC
          empty_pool   = when candidates is empty, psor = nurse.declared_primary_state
          otherwise    psor = the top-ranked candidate's state_code

      # ---- Propagation ----
      if psor != board.state_code:                                  return SINGLE_STATE
      if any other License L2 of the same nurse (L2.id != License.id) has
         L2.encumbrance_status IN {RESTRICTED, SUSPENDED, REVOKED}:  return SINGLE_STATE
      return MULTISTATE
    input_set: |
      The License itself, its Nurse, its StateBoardConfig, and every sibling License of the same nurse
      (all credential types, all license_status values). No random field participates: the tie-break is
      the declaration index of nurse.residency_evidence, never `id`.
    constants:
      EVIDENCE_PRIORITY: { DRIVER_LICENSE: 3, TAX_RETURN: 2, VOTER_REGISTRATION: 1 }
    precision: "enum output; privilege_basis_state records the resolved psor and privilege_variant records which variant ran"
    variants:
      - name: RESIDENCY_DECLARED
        when: "Default at issuance, on status-change, and whenever POST /licenses/{id}/privilege-determination is called with variant RESIDENCY_DECLARED"
        difference: "Takes the nurse's self-declared primary state at face value."
      - name: RESIDENCY_EVIDENCED
        when: "POST /licenses/{id}/privilege-determination with variant RESIDENCY_EVIDENCED, used during compact audits"
        difference: "Derives the PSOR from documentary evidence with DRIVER_LICENSE outranking TAX_RETURN outranking VOTER_REGISTRATION; identical nurse data can therefore yield MULTISTATE under RESIDENCY_DECLARED and SINGLE_STATE under RESIDENCY_EVIDENCED."

  # ---------------------------------------------------------------------------
  - name: sanction_severity_floor
    trigger: "POST /disciplinary-proceedings/{id}/hearing-events with event_type CONVENE — freezes sanction_floor_tier"
    algorithm: weighted_scoring
    formula: |
      complaint = Complaint referenced by DisciplinaryProceeding.complaint_id
      license   = License referenced by complaint.license_id
      nurse     = Nurse referenced by license.nurse_id

      base_index = BASE_TIER_INDEX[complaint.violation_category]

      aggravation = 2 * nurse.prior_discipline_count
                  + (2 if license.encumbrance_status == RESTRICTED else 0)
                  + (3 if at least one EvidenceRequest of the complaint has
                          record_class == PHARMACY_DISPENSING and status == PRODUCED else 0)
                  + (1 * count of MonitoringAgreement rows for nurse with status == BREACHED)

      mitigation  = (2 if complaint.complainant_type == SELF_REPORT else 0)
                  + (1 if nurse.atd_participation_count == 0 else 0)
                  + (2 if the complaint has at least one EvidenceRequest and every
                          EvidenceRequest of the complaint has status == PRODUCED else 0)

      net = aggravation - mitigation
      floor_index = max(1, min(6, base_index + ceil(net / 2)))       # ceil toward +infinity: ceil(-1.5) = -1
      if complaint.status == ATD_ACTIVE at the moment of the CONVENE call:
          floor_index = max(floor_index, 3)                          # a breach-free ATD participant floors at PROBATION
      sanction_floor_tier = SANCTION_TIERS[floor_index]
    input_set: |
      Exactly one Complaint, its License, its Nurse, every EvidenceRequest of that complaint
      (status filter stated inline per term), and every MonitoringAgreement of that nurse with
      status == BREACHED. Nothing is order-sensitive: every term is a count or a boolean.
    constants:
      SANCTION_TIERS: { 1: REPRIMAND, 2: FINE, 3: PROBATION, 4: PRACTICE_RESTRICTION, 5: SUSPENSION, 6: REVOCATION }
      BASE_TIER_INDEX: { PRACTICE_STANDARD: 1, FRAUD: 3, SUBSTANCE_USE: 3, BOUNDARY_VIOLATION: 4, CRIMINAL_CONDUCT: 5 }
    precision: "integer tier index clamped to 1..6; ceil applied to the halved net score before clamping"

  # ---------------------------------------------------------------------------
  - name: panel_vote_tally
    trigger: "POST /disciplinary-proceedings/{id}/hearing-events with event_type CLOSE_HEARING"
    algorithm: waterfall_allocation
    formula: |
      # The threshold that applies depends on which tier is adopted, and which tier can be
      # adopted depends on the threshold — a circular-looking dependency. The evaluation order
      # below is PINNED so the result is well defined: walk the tier ladder from most severe
      # down to least severe and adopt the FIRST tier that clears its own threshold.
      board = StateBoardConfig referenced by License.issuing_board_config_id (via the complaint)

      # Step 1 — denominator
      seated = seated_member_user_ids minus recused_member_user_ids   # presiding member was already excluded at creation
      seated_count = len(seated)

      # Step 2 — one effective vote per seated member: the LAST vote each cast
      for each user u in seated:
          effective[u] = the vote in votes with voter_user_id == u having the greatest cast_at;
                         when two of u's votes share cast_at, the later array position wins
      votes from users not in `seated` are discarded entirely.

      # Step 3 — cumulative support: a member voting a MORE severe tier also supports every
      # less severe tier (standard escalating-motion rule).
      for i from 6 down to 1:
          support_i     = count of u in seated where TIER_INDEX[effective[u].proposed_sanction_tier] >= i
          required_bp_i = board.revocation_vote_threshold_bp if i == 6 else board.majority_vote_threshold_bp
          if support_i * 10000 >= required_bp_i * seated_count:
              adopted_index = i
              break

      # Step 4 — no tier clears its threshold
      if no i cleared its threshold:  adopted_index = 0 ; adopted_sanction_tier = NONE
      else:                           adopted_sanction_tier = SANCTION_TIERS[adopted_index]

      # Step 5 — the floor is enforced at order time, not here: POST /disciplinary-proceedings/{id}/order
      # rejects with ERR_SANCTION_BELOW_FLOOR when adopted_index < TIER_INDEX[sanction_floor_tier],
      # leaving the proceeding in DELIBERATION.
    input_set: |
      The proceeding's own votes array, its seated_member_user_ids, and its recused_member_user_ids.
      Votes from non-seated or recused users are excluded from both numerator and denominator.
      seated_count is the denominator even when some seated members never voted (abstentions count
      against the motion).
    constants:
      TIER_INDEX: { REPRIMAND: 1, FINE: 2, PROBATION: 3, PRACTICE_RESTRICTION: 4, SUSPENSION: 5, REVOCATION: 6 }
      SANCTION_TIERS: { 1: REPRIMAND, 2: FINE, 3: PROBATION, 4: PRACTICE_RESTRICTION, 5: SUSPENSION, 6: REVOCATION }
    precision: "integer basis-point comparison; support_i * 10000 >= required_bp_i * seated_count avoids all floating-point division"

  # ---------------------------------------------------------------------------
  - name: audit_sample_selection
    trigger: "POST /_ops/run-audit-sampling"
    algorithm: weighted_scoring
    formula: |
      board = the StateBoardConfig referenced by the request's board_config_id

      # ---- Eligibility filter (explicit enum predicate, no fuzzy adjectives) ----
      eligible = RenewalApplication rows r where
                   r.renewal_status == CE_VERIFIED
               AND r.audit_status  == NOT_SELECTED
               AND the License referenced by r.license_id has issuing_board_config_id == board.id
      eligible_count = len(eligible)

      # ---- Risk score, written on EVERY eligible row (selected or not) ----
      for each r in eligible:
          complaint_flag = 1 if at least one Complaint exists with license_id == r.license_id and
                                status NOT IN {DISMISSED, CONSOLIDATED, CLOSED} else 0
          prior_fail_flag = 1 if another RenewalApplication with the same license_id has
                                audit_status == FAILED else 0
          margin_flag     = 1 if r.attested_practice_hours * 100 < board.practice_hours_required * 110 else 0
          late_flag       = 1 if r.late_days > 0 else 0
          r.audit_risk_score = round_half_up(40.00 * complaint_flag + 30.00 * prior_fail_flag
                                             + 20.00 * margin_flag + 10.00 * late_flag, 2)

      # ---- Quota (threshold with ceil; boundary matters) ----
      quota = ceil(board.audit_sample_rate_bp * eligible_count / 10000)
              # 500 bp with 20 eligible -> ceil(1.00) = 1 ; with 21 eligible -> ceil(1.05) = 2

      # ---- Ranking, tie-break, empty-pool fallback ----
      ranking   = r.audit_risk_score DESC, then r.created_at ASC     # never `id`
      selected  = the first `quota` rows of `eligible` under `ranking`
      empty_pool: eligible_count == 0 -> quota == 0, selected is empty, HTTP 200 with
                  selected_count 0 and an empty selected_renewal_application_ids array; no error.
    input_set: |
      Only RenewalApplication rows with renewal_status == CE_VERIFIED and audit_status == NOT_SELECTED
      whose license belongs to the requested board. Complaint rows in {DISMISSED, CONSOLIDATED, CLOSED}
      do not raise the complaint flag. audit_risk_score is persisted for every eligible row so a test
      can observe the ranking inputs even for rows the quota did not reach.
    constants:
      WEIGHT_OPEN_COMPLAINT: 40.00
      WEIGHT_PRIOR_AUDIT_FAILURE: 30.00
      WEIGHT_THIN_MARGIN: 20.00
      WEIGHT_LATE_FILING: 10.00
      MARGIN_THRESHOLD_PCT: 110
    precision: "risk score 2 decimal places round_half_up; quota is an integer ceiling of an exact rational"

  # ---------------------------------------------------------------------------
  - name: practice_hour_attainment
    trigger: "POST /renewal-applications/{id}/audit-decision"
    algorithm: interval_merge
    formula: |
      board  = StateBoardConfig referenced by the License's issuing_board_config_id
      window = [renewal.period_start_on, renewal.period_end_on)          # half-open

      # Periods are pro-rated by their overlap with the window. Each period contributes an
      # integer number of hours, FLOORED PER PERIOD, and the floored values are then summed.
      total = 0
      for each period p in renewal.practice_hour_periods, ordered by p.start_on ASC,
          ties broken by the zero-based array index ASC:
          p_days       = whole days in [p.start_on, p.end_on)
          overlap_days = whole days in [max(p.start_on, window.start), min(p.end_on, window.end))
          if p_days == 0 or overlap_days <= 0: contribution = 0
          else:                                contribution = floor(p.hours * overlap_days / p_days)
          total = total + contribution

      verified_practice_hours = total
      passed = (verified_practice_hours >= board.practice_hours_required)   # >= , exact match passes
    input_set: |
      Only the practice_hour_periods array currently stored on the renewal (the audit-doc-submission
      endpoint overwrites it wholesale, so a re-submission replaces rather than appends). Periods
      wholly outside the half-open window contribute 0; a period whose end_on equals
      period_start_on contributes 0 because the window is half-open at the lower bound too.
    constants:
      DAY_SECONDS: 86400
    precision: "integer hours; floor applied per period before summation, never after"

  # ---------------------------------------------------------------------------
  - name: renewal_fee_assessment
    trigger: "POST /renewal-applications/{id}/payment"
    algorithm: tiered_pricing
    formula: |
      board   = StateBoardConfig referenced by the License's issuing_board_config_id
      license = License referenced by renewal.license_id

      late_days = max(0, whole days from license.expires_on to clock_now)

      if late_days == 0:                                    surcharge = 0
      elif 1 <= late_days <= 30:                            surcharge = board.late_fee_tier1_cents
      elif 31 <= late_days <= board.renewal_grace_period_days: surcharge = board.late_fee_tier2_cents
      else:                                                 surcharge = board.reinstatement_fee_cents

      audit_surcharge = board.failed_audit_surcharge_cents if another RenewalApplication with the
                        same license_id has audit_status == FAILED else 0

      renewal.late_days        = late_days
      renewal.fee_applied_cents = board.renewal_base_fee_cents + surcharge + audit_surcharge
      renewal.fee_paid_cents    = renewal.fee_applied_cents
      Nurse.fee_paid_total_cents = Nurse.fee_paid_total_cents + renewal.fee_applied_cents

      # ---- Conserved quantity (fee ledger) ----
      # Nurse.fee_paid_total_cents
      #   == Nurse.fee_credit_cents
      #    + sum of r.fee_applied_cents over every RenewalApplication r with r.license_id in the
      #      nurse's licenses and r.renewal_status != WITHDRAWN
      # The compensating actions (finalization with outcome DENIED, and supersede-driven
      # DRAFT/SUBMITTED -> WITHDRAWN) move fee_applied_cents into Nurse.fee_credit_cents and zero
      # fee_applied_cents, so the identity holds before and after with zero drift.
    input_set: |
      The renewal being paid, its License, that License's board, and every sibling
      RenewalApplication of the same license (for the failed-audit surcharge). fee_paid_cents is
      never decremented, which is what makes the identity auditable.
    constants:
      LATE_TIER1_MAX_DAYS: 30
    precision: "integer cents; no rounding needed because every term is an integer cent amount"

  # ---------------------------------------------------------------------------
  - name: license_encumbrance_reconciliation
    trigger: "every Complaint status transition into or out of the open set, and every DisciplinaryProceeding order"
    algorithm: aggregation
    formula: |
      OPEN_COMPLAINT_STATES = {INVESTIGATION_OPEN, EVIDENCE_COMPLETE, ATD_OFFERED, ATD_ACTIVE,
                               REFERRED_FOR_HEARING, PROCEEDING_OPENED}

      License.open_encumbrance_count =
          count of Complaint rows c where c.license_id == License.id
                                     AND c.status IN OPEN_COMPLAINT_STATES
                                     AND c.consolidated_into_complaint_id is null

      # Derived encumbrance posture — applied ONLY when no board order is in force:
      if License.encumbrance_status NOT IN {RESTRICTED, SUSPENDED, REVOKED}:
          License.encumbrance_status = CLEAR if License.open_encumbrance_count == 0
                                       else INVESTIGATION_PENDING

      # ---- Conserved quantity (open-encumbrance count) ----
      # License.open_encumbrance_count always equals the count above. The forward action
      # (POST /complaints/{id}/investigation) raises it by exactly 1; the compensating action
      # (POST /complaints/{id}/disposition with disposition DISMISS, or the panel dismissal)
      # lowers it by exactly 1 and restores encumbrance_status to CLEAR at zero, leaving no drift.
    input_set: |
      Every Complaint with license_id == this License and consolidated_into_complaint_id null.
      Consolidated complaints are excluded so a merge never double-counts. Complaints in
      {RECEIVED, TRIAGED, CONSOLIDATED, DISMISSED, CLOSED} are outside the open set.
    constants:
      OPEN_COMPLAINT_STATES: [INVESTIGATION_OPEN, EVIDENCE_COMPLETE, ATD_OFFERED, ATD_ACTIVE, REFERRED_FOR_HEARING, PROCEEDING_OPENED]
    precision: "integer count; recomputed in full on every triggering transition rather than incrementally patched"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# Domain priority after the generic layers: safety/regulatory (PHI, segregation of
# duties, criminal history) BEFORE referential linkage, BEFORE temporal conflicts,
# BEFORE eligibility constraints, BEFORE fiscal checks. Fiscal checks are last,
# which is what creates the state-vs-fiscal and safety-vs-referential conflicts.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six roles declared in §1.7."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The caller's role appears in the endpoint's roles list."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path-segment resource exists, validated left to right."
    error_id: "ERR_BOARD_CONFIG_NOT_FOUND | ERR_PROGRAM_NOT_FOUND | ERR_NURSE_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_LICENSE_NOT_FOUND | ERR_RENEWAL_NOT_FOUND | ERR_CE_RECORD_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND | ERR_EVIDENCE_REQUEST_NOT_FOUND | ERR_MONITORING_AGREEMENT_NOT_FOUND | ERR_PROCEEDING_NOT_FOUND | ERR_NOTIFICATION_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 4
    category: business_referential
    check: "Every foreign key supplied in the request body resolves to an existing row of the declared parent entity."
    error_id: "ERR_BOARD_CONFIG_NOT_FOUND | ERR_PROGRAM_NOT_FOUND | ERR_NURSE_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_LICENSE_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /education-programs, POST /nurses, POST /license-applications, POST /licenses, POST /renewal-applications, POST /complaints, POST /monitoring-agreements, POST /disciplinary-proceedings, POST /complaints/{id}/triage"

  - priority: 5
    category: auth
    check: "When the caller's role is Applicant, X-User-ID must equal the Nurse.id that owns the target resource: the Nurse.id itself for /nurses/{id}, nurse_id for LicenseApplication / License / MonitoringAgreement, License.nurse_id via RenewalApplication.license_id, and License.nurse_id via CeRecord.renewal_application_id -> RenewalApplication.license_id. For creates, the same comparison is made against the nurse_id (or the nurse_id reached through license_id) supplied in the body."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "every endpoint whose roles list includes Applicant (Applicant is never granted a list endpoint, so no ownership filtering of collections is required)"

  - priority: 6
    category: business_constraint
    check: "All required body fields are present, enum fields carry a declared member, numeric fields are in range (minutes > 0, *_bp in 0..10000, state codes exactly two uppercase letters), and hold_start_at < hold_end_at, start_date <= end_date."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "every POST and PATCH"

  - priority: 7
    category: business_constraint
    check: "limit is an integer in 1..100 and offset is an integer >= 0."
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "every list endpoint"

  - priority: 8
    category: business_constraint
    check: "StateBoardConfig.state_code is unique; EducationProgram.program_code is unique within its state_board_config_id."
    error_id: "ERR_STATE_CODE_EXISTS | ERR_PROGRAM_CODE_EXISTS"
    http_status: 409
    applies_to: "POST /state-board-configs, POST /education-programs"

  - priority: 9
    category: state
    check: "expected_license_version equals License.version (POST /renewal-applications) and expected_complaint_version equals Complaint.version (POST /disciplinary-proceedings)."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /renewal-applications, POST /disciplinary-proceedings"

  - priority: 10
    category: state
    check: "The target resource's current state is a declared `from:` state for the requested transition in §1.2 (including terminal-state lockdown, and including the StateBoardConfig.status == ACTIVE requirement for new applications and renewals)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 11
    category: state
    check: "License.license_status IN {ACTIVE, EXPIRED} when a renewal is created, paid, or submitted; and the logical clock is at or before expires_on plus renewal_grace_period_days when the license is EXPIRED."
    error_id: ERR_LICENSE_NOT_RENEWABLE
    http_status: 409
    applies_to: "POST /renewal-applications, POST /renewal-applications/{id}/payment, POST /renewal-applications/{id}/submit"

  - priority: 12
    category: state
    check: "License.encumbrance_status IN {CLEAR, INVESTIGATION_PENDING, RESTRICTED} when a renewal is created; SUSPENDED and REVOKED credentials cannot be renewed."
    error_id: ERR_LICENSE_ENCUMBERED
    http_status: 409
    applies_to: "POST /renewal-applications"

  - priority: 13
    category: business_safety
    check: "When record_class == PATIENT_CHART and the complaint's board has phi_authorization_required == true, phi_authorization_id must be a non-empty string."
    error_id: ERR_PHI_AUTHORIZATION_REQUIRED
    http_status: 422
    applies_to: "POST /complaints/{id}/evidence-requests"

  - priority: 14
    category: business_referential
    check: "custodian_code appears in the complaint's employer_custodian_codes array."
    error_id: ERR_CUSTODIAN_NOT_LINKED
    http_status: 422
    applies_to: "POST /complaints/{id}/evidence-requests"
    note: "Priority 13 sits above priority 14 on the same endpoint, so a PATIENT_CHART demand that is both unauthorised and aimed at an unlinked custodian returns ERR_PHI_AUTHORIZATION_REQUIRED."

  - priority: 15
    category: business_safety
    check: "The caller's X-User-ID is not the proceeding's presiding_member_user_id."
    error_id: ERR_PRESIDING_MEMBER_CANNOT_VOTE
    http_status: 403
    applies_to: "POST /disciplinary-proceedings/{id}/votes"

  - priority: 16
    category: business_safety
    check: "The caller's X-User-ID does not appear as approved_by_user_id on any MonitoringAgreement whose nurse_id equals the nurse of the proceeding's complaint, and the caller's X-User-ID is a member of seated_member_user_ids."
    error_id: ERR_VOTER_CONFLICT_OF_INTEREST
    http_status: 403
    applies_to: "POST /disciplinary-proceedings/{id}/votes"

  - priority: 17
    category: business_safety
    check: "decision must not be APPROVED_UNCONDITIONAL when screening_status == DISQUALIFYING; such an application may only be APPROVED_WITH_MONITORING or DENIED."
    error_id: ERR_DISQUALIFYING_OFFENSE
    http_status: 422
    applies_to: "POST /license-applications/{id}/board-decision"

  - priority: 18
    category: business_temporal
    check: "hearing_date >= noticed_at plus notice_period_days, evaluated on the value of hearing_date current at the time of the CONVENE event."
    error_id: ERR_NOTICE_PERIOD_NOT_MET
    http_status: 422
    applies_to: "POST /disciplinary-proceedings, POST /disciplinary-proceedings/{id}/hearing-events"

  - priority: 19
    category: business_temporal
    check: "CLOSED-interval overlap with a clearance buffer on the Nurse resource: the new [start_date, end_date] must not intersect any existing MonitoringAgreement of the same nurse with status IN {OFFERED, EXECUTED, ACTIVE, SUSPENDED_PENDING_REVIEW, COMPLETED, BREACHED}, and start_date must be strictly after prior.end_date plus monitoring_clearance_gap_days. Touching endpoints conflict (end_date == new start_date is a conflict)."
    error_id: ERR_MONITORING_PERIOD_CONFLICT
    http_status: 409
    applies_to: "POST /monitoring-agreements"

  - priority: 20
    category: business_temporal
    check: "HALF-OPEN interval overlap with aggregate capacity on the custodian resource: counting existing EvidenceRequest rows with the same custodian_code and status IN {REQUESTED, PRODUCED} whose [hold_start_at, hold_end_at) intersects the new [hold_start_at, hold_end_at), the new hold is refused when that count is already >= StateBoardConfig.max_concurrent_custodian_holds. Adjacency does not intersect (prior.hold_end_at == new.hold_start_at is allowed)."
    error_id: ERR_CUSTODIAN_HOLD_CAPACITY
    http_status: 409
    applies_to: "POST /complaints/{id}/evidence-requests"

  - priority: 21
    category: business_constraint
    check: "For pathway EXAMINATION, the referenced EducationProgram has approval_status IN {APPROVED, PROVISIONAL, PROBATION} and approval_expires_on > the logical clock."
    error_id: ERR_PROGRAM_NOT_APPROVED
    http_status: 422
    applies_to: "POST /license-applications/{id}/qualification-verification"

  - priority: 22
    category: business_constraint
    check: "For pathway EXAMINATION, nclex_result == PASS."
    error_id: ERR_NCLEX_NOT_PASSED
    http_status: 422
    applies_to: "POST /license-applications/{id}/qualification-verification"

  - priority: 23
    category: business_constraint
    check: "For pathway ENDORSEMENT, prior_license_verified == true and prior_license_state is a non-null two-letter code."
    error_id: ERR_PRIOR_LICENSE_UNVERIFIED
    http_status: 422
    applies_to: "POST /license-applications/{id}/qualification-verification"

  - priority: 24
    category: business_constraint
    check: "For credential_type APRN, base_license_id is non-null and the referenced License has credential_type IN {RN, LPN}, license_status == ACTIVE, encumbrance_status == CLEAR, and the same nurse_id."
    error_id: ERR_BASE_LICENSE_REQUIRED
    http_status: 422
    applies_to: "POST /license-applications/{id}/submit, POST /license-applications/{id}/qualification-verification"

  - priority: 25
    category: business_constraint
    check: "deficiency_cycle_count < 3 before a new deficiency is recorded or a deficient application is resubmitted."
    error_id: ERR_DEFICIENCY_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /license-applications/{id}/deficiency, POST /license-applications/{id}/submit"

  - priority: 26
    category: business_constraint
    check: "target_complaint_id is required for jurisdiction_finding DUPLICATE, differs from the complaint being triaged, shares its license_id, has consolidated_into_complaint_id null, and has status NOT IN {CONSOLIDATED, DISMISSED, CLOSED}."
    error_id: ERR_CONSOLIDATION_TARGET_INVALID
    http_status: 409
    applies_to: "POST /complaints/{id}/triage"

  - priority: 27
    category: business_constraint
    check: "For disposition OFFER_ATD: Complaint.violation_category == SUBSTANCE_USE, no MonitoringAgreement of the nurse has status BREACHED, and Nurse.prior_discipline_count == 0."
    error_id: ERR_ATD_INELIGIBLE
    http_status: 422
    applies_to: "POST /complaints/{id}/disposition"

  - priority: 28
    category: business_constraint
    check: "At a CONVENE event, the count of seated_member_user_ids minus recused_member_user_ids is >= 3."
    error_id: ERR_QUORUM_NOT_MET
    http_status: 422
    applies_to: "POST /disciplinary-proceedings/{id}/hearing-events"
    note: "Priority 18 sits above priority 28 on this endpoint, so a CONVENE that both violates the notice period and lacks quorum returns ERR_NOTICE_PERIOD_NOT_MET."

  - priority: 29
    category: business_constraint
    check: "continuance_count < 3 before a CONTINUE or REOPEN event is accepted."
    error_id: ERR_CONTINUANCE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /disciplinary-proceedings/{id}/hearing-events"

  - priority: 30
    category: business_constraint
    check: "doc_request_cycle_count < 3 before a new audit document request is issued."
    error_id: ERR_AUDIT_DOC_REQUEST_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /renewal-applications/{id}/audit-doc-request"

  - priority: 31
    category: business_constraint
    check: "audit_status == DOCS_SUBMITTED and practice_hour_periods is a non-empty array before an audit decision is rendered."
    error_id: ERR_AUDIT_DOCS_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /renewal-applications/{id}/audit-decision"

  - priority: 32
    category: business_constraint
    check: "The tier index of the proceeding's adopted_sanction_tier is >= the tier index of its frozen sanction_floor_tier."
    error_id: ERR_SANCTION_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /disciplinary-proceedings/{id}/order"

  - priority: 33
    category: business_constraint
    check: "No License already references the application as source_application_id, AND the application's nurse does not already hold a License with the same credential_type and the same issuing_board_config_id whose license_status is NOT IN {LAPSED, SURRENDERED}. One live credential of each type per nurse per board."
    error_id: ERR_LICENSE_ALREADY_ISSUED
    http_status: 409
    applies_to: "POST /licenses"
    note: "The first clause is shadowed in practice because issuance moves the application to the terminal ISSUED state, which priority 10 rejects first; the second clause is the reachable branch — a second APPROVED application of the same credential_type for a nurse who already holds that credential live. Distinct credential_types (RN plus APRN, RN plus NURSE_AIDE) are unaffected, and re-licensure after LAPSED or SURRENDERED is allowed."

  - priority: 34
    category: business_fiscal
    check: "calculations.ce_hour_credit_total variant provisional_self_reported >= StateBoardConfig.ce_hours_required at submit time."
    error_id: ERR_CE_HOURS_INSUFFICIENT
    http_status: 422
    applies_to: "POST /renewal-applications/{id}/submit"

  - priority: 35
    category: business_fiscal
    check: "fee_applied_cents > 0 and fee_paid_cents >= fee_applied_cents at submit time."
    error_id: ERR_RENEWAL_FEE_UNPAID
    http_status: 402
    applies_to: "POST /renewal-applications/{id}/submit"
    note: "Priority 11 (state) sits above priority 35 (business_fiscal) on this endpoint, so a submit on an INACTIVE license with no payment returns ERR_LICENSE_NOT_RENEWABLE."

  - priority: 36
    category: business_fiscal
    check: "audit_status != FAILED when finalising with outcome RENEWED."
    error_id: ERR_PRACTICE_HOURS_INSUFFICIENT
    http_status: 422
    applies_to: "POST /renewal-applications/{id}/finalization"

# =============================================================================
# §1.5 API Endpoint Table
# api_prefix is "" — all paths are root-level collections, matching the flat
# entity topology. Applicant is deliberately never granted a list endpoint, so
# ownership enforcement (validation priority 5) never has to filter a collection.
# =============================================================================
endpoints:

  # --- logical clock -----------------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint that sets the server's logical clock. Before any call to this endpoint the logical clock reads exactly the fixed startup default 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Advancing the clock runs the system sweeps: ACTIVE -> EXPIRED, EXPIRED -> LAPSED, and MonitoringAgreement EXECUTED -> ACTIVE."
    roles: [SystemAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime, expired_license_ids: string[], lapsed_license_ids: string[], activated_agreement_ids: string[], withdrawn_renewal_ids: string[] }"
    side_effects:
      - "every License with license_status ACTIVE and expires_on <= current_utc moves to EXPIRED"
      - "every License with license_status EXPIRED and expires_on plus lapse_after_grace_days <= current_utc moves to LAPSED, and each of its RenewalApplication rows in DRAFT or SUBMITTED moves to WITHDRAWN"
      - "every MonitoringAgreement with status EXECUTED and start_date <= current_utc moves to ACTIVE"

  # --- StateBoardConfig --------------------------------------------------------
  - method: POST
    path: "/state-board-configs"
    description: "Register a state board of nursing and its regulatory parameters."
    roles: [SystemAdmin]
    code: 201
    input: [state_code, board_name, "compact_member?", "ce_hours_required?", "ce_self_study_cap_hours?", "ce_in_service_cap_hours?", "ce_carry_over_cap_hours?", "practice_hours_required?", "practice_lookback_months?", "renewal_period_months?", "renewal_grace_period_days?", "lapse_after_grace_days?", "audit_sample_rate_bp?", "criminal_lookback_years?", "disqualifying_offense_codes?", "renewal_base_fee_cents?", "late_fee_tier1_cents?", "late_fee_tier2_cents?", "reinstatement_fee_cents?", "failed_audit_surcharge_cents?", "phi_authorization_required?", "max_concurrent_custodian_holds?", "monitoring_clearance_gap_days?", "revocation_vote_threshold_bp?", "majority_vote_threshold_bp?"]
    output: StateBoardConfig
    side_effects:
      - "status initialised to ACTIVE; every omitted parameter takes its §1.1 default"

  - method: GET
    path: "/state-board-configs/{id}"
    description: "Read one board configuration."
    roles: [SystemAdmin, LicensureAnalyst, Investigator, BoardMember, MonitoringCoordinator]
    code: 200
    input: []
    output: StateBoardConfig
    side_effects: []

  - method: PATCH
    path: "/state-board-configs/{id}"
    description: "Amend the board's regulatory parameters, or archive the board."
    roles: [SystemAdmin]
    code: 200
    input: ["compact_member?", "ce_hours_required?", "ce_self_study_cap_hours?", "ce_in_service_cap_hours?", "ce_carry_over_cap_hours?", "practice_hours_required?", "renewal_grace_period_days?", "lapse_after_grace_days?", "audit_sample_rate_bp?", "criminal_lookback_years?", "disqualifying_offense_codes?", "renewal_base_fee_cents?", "late_fee_tier1_cents?", "late_fee_tier2_cents?", "reinstatement_fee_cents?", "failed_audit_surcharge_cents?", "phi_authorization_required?", "max_concurrent_custodian_holds?", "monitoring_clearance_gap_days?", "revocation_vote_threshold_bp?", "majority_vote_threshold_bp?", "status?"]
    output: StateBoardConfig
    side_effects:
      - "increments StateBoardConfig.version by 1"
      - "amended parameters take effect for calculations performed after this call; values already frozen onto a RenewalApplication or DisciplinaryProceeding are not recomputed"

  - method: GET
    path: "/state-board-configs/{id}/education-programs"
    description: "List the education programs a board has approved."
    roles: [SystemAdmin, LicensureAnalyst, Investigator, BoardMember, MonitoringCoordinator]
    code: 200
    input: ["approval_status?", "degree_level?", "limit?", "offset?"]
    output: EducationProgram[]
    side_effects: []

  - method: GET
    path: "/state-board-configs/{id}/nurses"
    description: "List the nurses whose declared primary state of residence maps to this board."
    roles: [SystemAdmin, LicensureAnalyst, Investigator, BoardMember]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Nurse[]
    side_effects: []

  # --- EducationProgram --------------------------------------------------------
  - method: POST
    path: "/education-programs"
    description: "Register a nursing education program under a board's approval authority."
    roles: [SystemAdmin]
    code: 201
    input: [state_board_config_id, program_code, program_name, degree_level, nclex_first_time_pass_rate_bp, approval_expires_on]
    output: EducationProgram
    side_effects:
      - "approval_status initialised to APPROVED"

  - method: GET
    path: "/education-programs/{id}"
    description: "Read one education program."
    roles: [SystemAdmin, LicensureAnalyst, Investigator, BoardMember, MonitoringCoordinator]
    code: 200
    input: []
    output: EducationProgram
    side_effects: []

  - method: PATCH
    path: "/education-programs/{id}"
    description: "Change a program's approval posture, expiry, or reported pass rate."
    roles: [SystemAdmin]
    code: 200
    input: ["approval_status?", "approval_expires_on?", "nclex_first_time_pass_rate_bp?", "program_name?"]
    output: EducationProgram
    side_effects:
      - "increments EducationProgram.version by 1"
      - "applications already past QUALIFICATION_VERIFIED are unaffected; applications still at SUBMITTED will be evaluated against the new posture"

  # --- Nurse -------------------------------------------------------------------
  - method: POST
    path: "/nurses"
    description: "Create the nurse identity record an Applicant then acts as (X-User-ID equals the returned Nurse.id)."
    roles: [LicensureAnalyst]
    code: 201
    input: [home_board_config_id, full_name, birth_year, ssn_last4, declared_primary_state, "residency_evidence?"]
    output: Nurse
    side_effects:
      - "fee_credit_cents, fee_paid_total_cents, prior_discipline_count and atd_participation_count initialised to 0; status initialised to ACTIVE"

  - method: GET
    path: "/nurses/{id}"
    description: "Read one nurse record including the fee ledger fields."
    roles: [SystemAdmin, LicensureAnalyst, Investigator, BoardMember, MonitoringCoordinator, Applicant]
    code: 200
    input: []
    output: Nurse
    side_effects: []

  - method: PATCH
    path: "/nurses/{id}"
    description: "Update the nurse's declared primary state of residence, home board, or residency evidence."
    roles: [LicensureAnalyst, Applicant]
    code: 200
    input: ["declared_primary_state?", "home_board_config_id?", "residency_evidence?", "full_name?"]
    output: Nurse
    side_effects:
      - "increments Nurse.version by 1"
      - "does NOT recompute any License.multistate_privilege_status; a fresh POST /licenses/{id}/privilege-determination is required"

  # --- LicenseApplication ------------------------------------------------------
  - method: POST
    path: "/license-applications"
    description: "Open a licensure application by examination or by endorsement."
    roles: [Applicant, LicensureAnalyst]
    code: 201
    input: [nurse_id, board_config_id, pathway, credential_type, "education_program_id?", "aprn_role?", "nclex_result?", "prior_license_state?", "prior_license_number?", "base_license_id?"]
    output: LicenseApplication
    side_effects:
      - "status initialised to DRAFT; screening_status initialised to NOT_ORDERED; deficiency_cycle_count initialised to 0"

  - method: GET
    path: "/license-applications"
    description: "List licensure applications, filtered by any of their foreign keys or by status."
    roles: [SystemAdmin, LicensureAnalyst, Investigator, BoardMember]
    code: 200
    input: ["nurse_id?", "board_config_id?", "education_program_id?", "base_license_id?", "pathway?", "credential_type?", "status?", "limit?", "offset?"]
    output: LicenseApplication[]
    side_effects: []

  - method: GET
    path: "/license-applications/{id}"
    description: "Read one licensure application."
    roles: [SystemAdmin, LicensureAnalyst, Investigator, BoardMember, Applicant]
    code: 200
    input: []
    output: LicenseApplication
    side_effects: []

  - method: POST
    path: "/license-applications/{id}/submit"
    description: "Submit a DRAFT application, or resubmit one returned as DEFICIENT."
    roles: [Applicant, LicensureAnalyst]
    code: 200
    input: []
    output: LicenseApplication
    side_effects:
      - "status DRAFT|DEFICIENT -> SUBMITTED"
      - "submitted_at set to the logical clock"

  - method: POST
    path: "/license-applications/{id}/deficiency"
    description: "Return a submitted application to the applicant as DEFICIENT."
    roles: [LicensureAnalyst]
    code: 200
    input: [reason_note]
    output: LicenseApplication
    side_effects:
      - "status SUBMITTED -> DEFICIENT"
      - "increments deficiency_cycle_count by 1"

  - method: POST
    path: "/license-applications/{id}/qualification-verification"
    description: "Verify education-program approval and examination result (EXAMINATION) or prior-license standing (ENDORSEMENT), then order criminal-history screening in the same request."
    roles: [LicensureAnalyst]
    code: 200
    input: ["prior_license_verified?"]
    output: LicenseApplication
    side_effects:
      - "status SUBMITTED -> QUALIFICATION_VERIFIED, then system-advanced to SCREENING_IN_PROGRESS in the same request"
      - "screening_status NOT_ORDERED -> REQUESTED"

  - method: POST
    path: "/license-applications/{id}/screening-result"
    description: "Record the criminal-history screening vendor's response."
    roles: [LicensureAnalyst]
    code: 200
    input: [screening_offense_records]
    output: LicenseApplication
    side_effects:
      - "screening_status REQUESTED -> CLEARED when no supplied offense_code is in the board's disqualifying_offense_codes with a disposition_date within criminal_lookback_years of the logical clock, otherwise -> DISQUALIFYING"
      - "status SCREENING_IN_PROGRESS -> APPROVED when screening_status is CLEARED; -> SCREENING_FLAGGED then system-advanced to BOARD_REVIEW in the same request when DISQUALIFYING"
      - "decided_at set to the logical clock on the APPROVED path"

  - method: POST
    path: "/license-applications/{id}/board-decision"
    description: "Record the board's decision on a flagged application."
    roles: [BoardMember]
    code: 200
    input: [decision]
    output: LicenseApplication
    side_effects:
      - "board_decision set to the supplied decision"
      - "status BOARD_REVIEW -> APPROVED for APPROVED_UNCONDITIONAL or APPROVED_WITH_MONITORING, -> DENIED for DENIED"
      - "decided_at set to the logical clock"

  - method: POST
    path: "/license-applications/{id}/withdrawal"
    description: "Withdraw an application that has not yet been decided."
    roles: [Applicant, LicensureAnalyst]
    code: 200
    input: []
    output: LicenseApplication
    side_effects:
      - "status DRAFT|SUBMITTED|DEFICIENT -> WITHDRAWN"

  # --- License -----------------------------------------------------------------
  - method: POST
    path: "/licenses"
    description: "Mint the credential from an APPROVED application; nurse, board, credential type, APRN role and base license are copied from the application."
    roles: [LicensureAnalyst]
    code: 201
    input: [source_application_id]
    output: License
    side_effects:
      - "LicenseApplication.status APPROVED -> ISSUED"
      - "license_number minted; license_status initialised to ACTIVE; encumbrance_status initialised to CLEAR"
      - "issued_on set to the logical clock; expires_on set to issued_on plus the board's renewal_period_months"
      - "when credential_type is NURSE_AIDE, a NotificationReport with channel NURSE_AIDE_REGISTRY, report_kind INITIAL and basis_code REGISTRY_ENTRY is queued"

  - method: GET
    path: "/licenses"
    description: "List credentials, filtered by any of their foreign keys or by either state dimension."
    roles: [SystemAdmin, LicensureAnalyst, Investigator, BoardMember, MonitoringCoordinator]
    code: 200
    input: ["nurse_id?", "issuing_board_config_id?", "source_application_id?", "base_license_id?", "credential_type?", "license_status?", "encumbrance_status?", "multistate_privilege_status?", "limit?", "offset?"]
    output: License[]
    side_effects: []

  - method: GET
    path: "/licenses/{id}"
    description: "Read one credential, including both state dimensions and the reconciled open_encumbrance_count."
    roles: [SystemAdmin, LicensureAnalyst, Investigator, BoardMember, MonitoringCoordinator, Applicant]
    code: 200
    input: []
    output: License
    side_effects: []

  - method: POST
    path: "/licenses/{id}/status-change"
    description: "Move the registration dimension: place a credential on inactive status, reactivate it, or accept a voluntary surrender."
    roles: [LicensureAnalyst]
    code: 200
    input: [to_status]
    output: License
    side_effects:
      - "license_status advanced per §1.2 License (license_status)"
      - "on to_status INACTIVE and to_status ACTIVE, calculations.multistate_privilege_determination is re-run with variant RESIDENCY_DECLARED"
      - "on to_status SURRENDERED, multistate_privilege_status is set to NOT_ELIGIBLE and a NotificationReport with channel INTERSTATE_COMPACT, source_entity_type LICENSE and basis_code SURRENDER is queued"

  - method: POST
    path: "/licenses/{id}/privilege-determination"
    description: "Run calculations.multistate_privilege_determination under the requested variant and write the result onto the credential."
    roles: [LicensureAnalyst]
    code: 200
    input: [variant]
    output: License
    side_effects:
      - "multistate_privilege_status, privilege_variant and privilege_basis_state overwritten with the calculation's output"
      - "when the result is MULTISTATE, a NotificationReport with channel INTERSTATE_COMPACT, report_kind INITIAL and basis_code PRIVILEGE_GRANT is queued"

  - method: GET
    path: "/licenses/{id}/privilege-summary"
    description: "Computed read that returns the credential's current compact posture alongside the board and residency inputs that produced it."
    roles: [SystemAdmin, LicensureAnalyst, Investigator, BoardMember, MonitoringCoordinator]
    code: 200
    input: []
    output: "{ license_id: string, credential_type: string, license_status: string, encumbrance_status: string, multistate_privilege_status: string, privilege_variant: string, privilege_basis_state: string, board_state_code: string, board_compact_member: boolean, declared_primary_state: string, evidenced_primary_state: string }"
    side_effects: []

  - method: GET
    path: "/licenses/{id}/renewal-applications"
    description: "List the renewal filings made against one credential."
    roles: [SystemAdmin, LicensureAnalyst, Investigator, BoardMember]
    code: 200
    input: ["renewal_status?", "audit_status?", "limit?", "offset?"]
    output: RenewalApplication[]
    side_effects: []

  # --- RenewalApplication ------------------------------------------------------
  - method: POST
    path: "/renewal-applications"
    description: "Open a renewal filing against a credential. expected_license_version is the License.version the client last observed; a mismatch is refused because the create supersedes any prior DRAFT or SUBMITTED renewal on the same license."
    roles: [Applicant, LicensureAnalyst]
    code: 201
    input: [license_id, expected_license_version, "attested_practice_hours?", "carry_over_hours_claimed?"]
    output: RenewalApplication
    side_effects:
      - "increments License.version by 1"
      - "period_end_on set to the license's current expires_on; period_start_on set to period_end_on minus the board's renewal_period_months"
      - "every other RenewalApplication on the same license with renewal_status DRAFT or SUBMITTED moves to WITHDRAWN"
      - "renewal_status initialised to DRAFT; audit_status initialised to NOT_SELECTED"

  - method: GET
    path: "/renewal-applications/{id}"
    description: "Read one renewal filing, including both CE variant totals and the fee ledger fields."
    roles: [SystemAdmin, LicensureAnalyst, Investigator, BoardMember, Applicant]
    code: 200
    input: []
    output: RenewalApplication
    side_effects: []

  - method: POST
    path: "/renewal-applications/{id}/payment"
    description: "Assess and receive the renewal fee. Runs calculations.renewal_fee_assessment against the logical clock, applies any available Nurse.fee_credit_cents first, and records the remainder as received."
    roles: [Applicant, LicensureAnalyst]
    code: 200
    input: []
    output: RenewalApplication
    side_effects:
      - "late_days set to max(0, whole days from the license's expires_on to the logical clock)"
      - "fee_applied_cents set to the output of calculations.renewal_fee_assessment"
      - "fee_paid_cents set to fee_applied_cents; Nurse.fee_credit_cents reduced by the portion satisfied from credit; Nurse.fee_paid_total_cents increased by fee_applied_cents"

  - method: POST
    path: "/renewal-applications/{id}/ce-records"
    description: "Attach a continuing-education credit claim to a DRAFT or CE_DEFICIENT renewal."
    roles: [Applicant, LicensureAnalyst]
    code: 201
    input: [provider_code, "provider_accredited?", category, minutes, completion_date]
    output: CeRecord
    side_effects:
      - "credit_hours set to round_half_up(minutes / 60 / 0.25) * 0.25 for this record alone"
      - "verification_status initialised to UNVERIFIED"

  - method: GET
    path: "/renewal-applications/{id}/ce-records"
    description: "List the CE credit claims attached to one renewal."
    roles: [SystemAdmin, LicensureAnalyst, Investigator, BoardMember, Applicant]
    code: 200
    input: ["verification_status?", "category?", "limit?", "offset?"]
    output: CeRecord[]
    side_effects: []

  - method: POST
    path: "/renewal-applications/{id}/submit"
    description: "Submit the renewal. Freezes the provisional CE total and enforces the fee and provisional-CE gates."
    roles: [Applicant, LicensureAnalyst]
    code: 200
    input: []
    output: RenewalApplication
    side_effects:
      - "renewal_status DRAFT|CE_DEFICIENT -> SUBMITTED"
      - "ce_credit_hours_provisional set to the output of calculations.ce_hour_credit_total variant provisional_self_reported"
      - "submitted_at set to the logical clock"

  - method: POST
    path: "/renewal-applications/{id}/ce-verification"
    description: "Re-run the CE total under the audited variant, which drops unaccredited and unverified records, and branch on the result."
    roles: [LicensureAnalyst]
    code: 200
    input: []
    output: RenewalApplication
    side_effects:
      - "ce_credit_hours_audited set to the output of calculations.ce_hour_credit_total variant audited_verified"
      - "renewal_status SUBMITTED -> CE_VERIFIED when ce_credit_hours_audited >= the board's ce_hours_required, otherwise SUBMITTED -> CE_DEFICIENT"

  - method: POST
    path: "/renewal-applications/{id}/finalization"
    description: "Grant or deny the renewal. Granting advances the credential's expiry and reactivates an EXPIRED credential; denial refunds the fee to the nurse's credit balance."
    roles: [LicensureAnalyst]
    code: 200
    input: [outcome]
    output: RenewalApplication
    side_effects:
      - "renewal_status CE_VERIFIED -> RENEWED or CE_VERIFIED -> DENIED"
      - "on RENEWED: License.expires_on advanced by the board's renewal_period_months, license_status EXPIRED -> ACTIVE (ACTIVE stays ACTIVE), and License.version incremented by 1"
      - "on DENIED: Nurse.fee_credit_cents increased by fee_applied_cents, then fee_applied_cents set to 0 while fee_paid_cents is left untouched so the fee-ledger invariant still reconciles"

  - method: POST
    path: "/_ops/run-audit-sampling"
    description: "Run the practice-hour audit sampling pass for one board. Ranks every eligible renewal by calculations.audit_sample_selection and selects the top quota rows."
    roles: [SystemAdmin]
    code: 200
    input: [board_config_id]
    output: "{ board_config_id: string, eligible_count: integer, quota: integer, selected_count: integer, selected_renewal_application_ids: string[] }"
    side_effects:
      - "audit_risk_score written onto every eligible RenewalApplication"
      - "audit_status NOT_SELECTED -> SELECTED on each selected RenewalApplication"
      - "an empty eligible pool is a success with eligible_count 0, quota 0, selected_count 0 and an empty id array, never an error"

  - method: POST
    path: "/renewal-applications/{id}/audit-doc-request"
    description: "Demand practice-hour documentation from a renewal selected for audit, or send an incomplete submission back for another cycle."
    roles: [LicensureAnalyst]
    code: 200
    input: ["note?"]
    output: RenewalApplication
    side_effects:
      - "audit_status SELECTED|DOCS_SUBMITTED -> DOCS_REQUESTED"
      - "increments doc_request_cycle_count by 1"
      - "practice_hour_periods cleared to an empty array"

  - method: POST
    path: "/renewal-applications/{id}/audit-doc-submission"
    description: "Submit employment periods as practice-hour documentation."
    roles: [Applicant, LicensureAnalyst]
    code: 200
    input: [practice_hour_periods]
    output: RenewalApplication
    side_effects:
      - "audit_status DOCS_REQUESTED -> DOCS_SUBMITTED"
      - "practice_hour_periods replaced with the submitted array"

  - method: POST
    path: "/renewal-applications/{id}/audit-decision"
    description: "Prorate and total the submitted employment periods with calculations.practice_hour_attainment, then pass or fail the audit."
    roles: [LicensureAnalyst]
    code: 200
    input: []
    output: RenewalApplication
    side_effects:
      - "verified_practice_hours set to the output of calculations.practice_hour_attainment"
      - "audit_status DOCS_SUBMITTED -> PASSED when verified_practice_hours >= the board's practice_hours_required, otherwise -> FAILED"

  - method: GET
    path: "/ce-records/{id}"
    description: "Read one CE credit claim."
    roles: [SystemAdmin, LicensureAnalyst, Investigator, BoardMember, Applicant]
    code: 200
    input: []
    output: CeRecord
    side_effects: []

  - method: POST
    path: "/ce-records/{id}/verification"
    description: "Mark one CE credit claim as verified or rejected; only VERIFIED records with an accredited provider survive the audited CE variant."
    roles: [LicensureAnalyst]
    code: 200
    input: [verification_status]
    output: CeRecord
    side_effects:
      - "verification_status set to the supplied value"
      - "increments CeRecord.version by 1"

  # --- Complaint ---------------------------------------------------------------
  - method: POST
    path: "/complaints"
    description: "Intake a complaint against a credential, recording the custodians whose records may later be demanded."
    roles: [Investigator]
    code: 201
    input: [license_id, complainant_type, violation_category, incident_date, "allegation_codes?", "employer_custodian_codes?"]
    output: Complaint
    side_effects:
      - "status initialised to RECEIVED; jurisdiction_finding initialised to PENDING"
      - "received_at set to the logical clock"

  - method: GET
    path: "/complaints"
    description: "List complaints, filtered by credential, by consolidation target, or by status."
    roles: [SystemAdmin, LicensureAnalyst, Investigator, BoardMember, MonitoringCoordinator]
    code: 200
    input: ["license_id?", "consolidated_into_complaint_id?", "violation_category?", "status?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []

  - method: GET
    path: "/complaints/{id}"
    description: "Read one complaint."
    roles: [SystemAdmin, LicensureAnalyst, Investigator, BoardMember, MonitoringCoordinator]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: POST
    path: "/complaints/{id}/triage"
    description: "Record the jurisdiction finding. DUPLICATE consolidates this complaint into a surviving sibling complaint on the same credential."
    roles: [Investigator]
    code: 200
    input: [jurisdiction_finding, "target_complaint_id?"]
    output: Complaint
    side_effects:
      - "jurisdiction_finding set to the supplied value; triaged_by_user_id set to X-User-ID"
      - "status RECEIVED -> TRIAGED for JURISDICTION_CONFIRMED, -> DISMISSED for NO_JURISDICTION, -> CONSOLIDATED for DUPLICATE"
      - "on DUPLICATE, consolidated_into_complaint_id set to target_complaint_id and the target's employer_custodian_codes and allegation_codes are unioned with this complaint's"

  - method: POST
    path: "/complaints/{id}/investigation"
    description: "Open the investigation, which encumbers the credential pending outcome."
    roles: [Investigator]
    code: 200
    input: []
    output: Complaint
    side_effects:
      - "status TRIAGED -> INVESTIGATION_OPEN; investigator_user_id set to X-User-ID"
      - "License.encumbrance_status CLEAR -> INVESTIGATION_PENDING"
      - "License.open_encumbrance_count recomputed by calculations.license_encumbrance_reconciliation"

  - method: POST
    path: "/complaints/{id}/evidence-requests"
    description: "Issue a records demand to a custodian named on the complaint, holding that custodian's records over a half-open window."
    roles: [Investigator]
    code: 201
    input: [record_class, custodian_code, hold_start_at, hold_end_at, "phi_authorization_id?"]
    output: EvidenceRequest
    side_effects:
      - "status initialised to REQUESTED; page_count initialised to 0"

  - method: GET
    path: "/complaints/{id}/evidence-requests"
    description: "List the records demands issued under one complaint."
    roles: [SystemAdmin, LicensureAnalyst, Investigator, BoardMember]
    code: 200
    input: ["status?", "record_class?", "custodian_code?", "limit?", "offset?"]
    output: EvidenceRequest[]
    side_effects: []

  - method: GET
    path: "/evidence-requests/{id}"
    description: "Read one records demand."
    roles: [SystemAdmin, LicensureAnalyst, Investigator, BoardMember]
    code: 200
    input: []
    output: EvidenceRequest
    side_effects: []

  - method: POST
    path: "/evidence-requests/{id}/production"
    description: "Record the custodian's production against a records demand, which releases the hold."
    roles: [Investigator]
    code: 200
    input: [page_count]
    output: EvidenceRequest
    side_effects:
      - "status REQUESTED -> PRODUCED; produced_at set to the logical clock"
      - "the released hold no longer counts toward max_concurrent_custodian_holds"

  - method: POST
    path: "/complaints/{id}/evidence-completion"
    description: "Close the evidence-gathering phase once every outstanding records demand has been produced or withdrawn."
    roles: [Investigator]
    code: 200
    input: []
    output: Complaint
    side_effects:
      - "status INVESTIGATION_OPEN -> EVIDENCE_COMPLETE"

  - method: POST
    path: "/complaints/{id}/disposition"
    description: "Dispose of an investigated complaint: dismiss it, offer alternative-to-discipline monitoring, or refer it for a disciplinary hearing."
    roles: [Investigator]
    code: 200
    input: [disposition]
    output: Complaint
    side_effects:
      - "status EVIDENCE_COMPLETE -> DISMISSED for DISMISS, -> ATD_OFFERED for OFFER_ATD, -> REFERRED_FOR_HEARING for REFER_TO_PROCEEDING"
      - "on DISMISS: every EvidenceRequest on the complaint still at REQUESTED moves to WITHDRAWN, License.encumbrance_status INVESTIGATION_PENDING -> CLEAR when no other open complaint remains, and License.open_encumbrance_count is recomputed"

  - method: GET
    path: "/complaints/{id}/disciplinary-proceedings"
    description: "List the disciplinary proceedings opened on one complaint."
    roles: [SystemAdmin, LicensureAnalyst, Investigator, BoardMember]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DisciplinaryProceeding[]
    side_effects: []

  # --- MonitoringAgreement -----------------------------------------------------
  - method: POST
    path: "/monitoring-agreements"
    description: "Offer an alternative-to-discipline monitoring agreement to an impaired practitioner. The offering BoardMember is recorded and is thereafter barred from voting in proceedings against the same nurse."
    roles: [BoardMember]
    code: 201
    input: [nurse_id, complaint_id, start_date, end_date, "narcotic_access_restricted?", "required_screens_per_quarter?", "worksite_approval_required?"]
    output: MonitoringAgreement
    side_effects:
      - "status initialised to OFFERED; approved_by_user_id set to X-User-ID"
      - "compliance_report_count and missed_screen_count initialised to 0"

  - method: GET
    path: "/monitoring-agreements"
    description: "List monitoring agreements, filtered by nurse, by complaint, or by status."
    roles: [SystemAdmin, LicensureAnalyst, Investigator, BoardMember, MonitoringCoordinator]
    code: 200
    input: ["nurse_id?", "complaint_id?", "status?", "limit?", "offset?"]
    output: MonitoringAgreement[]
    side_effects: []

  - method: GET
    path: "/monitoring-agreements/{id}"
    description: "Read one monitoring agreement."
    roles: [SystemAdmin, LicensureAnalyst, Investigator, BoardMember, MonitoringCoordinator, Applicant]
    code: 200
    input: []
    output: MonitoringAgreement
    side_effects: []

  - method: POST
    path: "/monitoring-agreements/{id}/execution"
    description: "Participant signs the offered agreement, which activates the alternative-to-discipline track on the complaint."
    roles: [Applicant]
    code: 200
    input: []
    output: MonitoringAgreement
    side_effects:
      - "status OFFERED -> EXECUTED; executed_at set to the logical clock"
      - "increments Nurse.atd_participation_count by 1"
      - "Complaint.status ATD_OFFERED -> ATD_ACTIVE"

  - method: POST
    path: "/monitoring-agreements/{id}/monitoring-events"
    description: "Record a monitoring event against an active agreement: a compliance report, missed screens, a breach declaration, or successful completion."
    roles: [MonitoringCoordinator]
    code: 200
    input: [event_type, "missed_screens?", "note?"]
    output: MonitoringAgreement
    side_effects:
      - "on COMPLIANCE_REPORT: increments compliance_report_count by 1 and returns SUSPENDED_PENDING_REVIEW to ACTIVE"
      - "on MISSED_SCREEN: increases missed_screen_count by missed_screens, and at 3 or more forces ACTIVE -> SUSPENDED_PENDING_REVIEW"
      - "on COMPLETION: status ACTIVE -> COMPLETED, Complaint.status ATD_ACTIVE -> CLOSED, and License.encumbrance_status INVESTIGATION_PENDING -> CLEAR with open_encumbrance_count recomputed"
      - "on BREACH: status ACTIVE|SUSPENDED_PENDING_REVIEW -> BREACHED, Complaint.status ATD_ACTIVE -> PROCEEDING_OPENED, License.encumbrance_status INVESTIGATION_PENDING -> SUSPENDED, and a NotificationReport with channel NPDB, report_kind INITIAL and basis_code ATD_BREACH is queued"

  # --- DisciplinaryProceeding --------------------------------------------------
  - method: POST
    path: "/disciplinary-proceedings"
    description: "Open a disciplinary proceeding on a referred complaint and issue the notice of hearing. expected_complaint_version is the Complaint.version the client last observed; a mismatch is refused because opening a proceeding is the terminal referral of that complaint."
    roles: [BoardMember]
    code: 201
    input: [complaint_id, expected_complaint_version, seated_member_user_ids, hearing_date, "notice_period_days?"]
    output: DisciplinaryProceeding
    side_effects:
      - "increments Complaint.version by 1"
      - "status initialised to NOTICED; noticed_at set to the logical clock; presiding_member_user_id set to X-User-ID and removed from seated_member_user_ids"
      - "recused_member_user_ids populated with every seated member who is approved_by_user_id on any MonitoringAgreement of the complaint's nurse"
      - "Complaint.status REFERRED_FOR_HEARING -> PROCEEDING_OPENED"

  - method: GET
    path: "/disciplinary-proceedings/{id}"
    description: "Read one disciplinary proceeding, including the vote array, the frozen sanction floor, and the adopted tier."
    roles: [SystemAdmin, LicensureAnalyst, Investigator, BoardMember]
    code: 200
    input: []
    output: DisciplinaryProceeding
    side_effects: []

  - method: POST
    path: "/disciplinary-proceedings/{id}/hearing-events"
    description: "Drive the hearing: CONVENE seats the panel and freezes the sanction floor, CONTINUE postpones to a new date, CLOSE_HEARING tallies the panel votes, REOPEN returns a deliberating panel to hearing."
    roles: [BoardMember]
    code: 200
    input: [event_type, "new_hearing_date?"]
    output: DisciplinaryProceeding
    side_effects:
      - "on CONVENE: status NOTICED|CONTINUED -> HEARING_CONVENED and sanction_floor_tier frozen to the output of calculations.sanction_severity_floor"
      - "on CONTINUE: status HEARING_CONVENED -> CONTINUED, hearing_date replaced with new_hearing_date, noticed_at reset to the logical clock, and continuance_count incremented by 1"
      - "on CLOSE_HEARING: status HEARING_CONVENED -> DELIBERATION and adopted_sanction_tier set to the output of calculations.panel_vote_tally; when the tally yields NONE the proceeding is system-advanced to DISMISSED_BY_PANEL in the same request and the credential's encumbrance returns to CLEAR"
      - "on REOPEN: status DELIBERATION -> HEARING_CONVENED, adopted_sanction_tier reset to NONE, votes cleared to an empty array, and continuance_count incremented by 1"

  - method: POST
    path: "/disciplinary-proceedings/{id}/votes"
    description: "A seated, non-recused, non-presiding board member records the sanction tier they support. Re-voting replaces that member's earlier ballot for tally purposes but the array is append-only."
    roles: [BoardMember]
    code: 200
    input: [proposed_sanction_tier]
    output: DisciplinaryProceeding
    side_effects:
      - "an object { voter_user_id: X-User-ID, proposed_sanction_tier, cast_at: logical clock } is appended to votes"

  - method: POST
    path: "/disciplinary-proceedings/{id}/order"
    description: "Issue the final order at the adopted sanction tier, applying the credential consequences and queuing the required national and interstate reports."
    roles: [BoardMember]
    code: 200
    input: ["ordered_restriction_codes?"]
    output: DisciplinaryProceeding
    side_effects:
      - "status DELIBERATION -> ORDER_ISSUED; order_issued_at set to the logical clock"
      - "License.encumbrance_status moved per §1.2 License (encumbrance_status) for the adopted tier: RESTRICTED for PROBATION or PRACTICE_RESTRICTION, SUSPENDED for SUSPENSION, REVOKED for REVOCATION"
      - "on PROBATION or PRACTICE_RESTRICTION: License.practice_restriction_codes replaced with ordered_restriction_codes"
      - "on REVOCATION: License.license_status -> SURRENDERED and multistate_privilege_status -> PRIVILEGE_REVOKED; every other License of the nurse whose base_license_id equals this License.id also moves to license_status SURRENDERED, encumbrance_status REVOKED and multistate_privilege_status PRIVILEGE_REVOKED; every MonitoringAgreement of the nurse in OFFERED, EXECUTED, ACTIVE or SUSPENDED_PENDING_REVIEW moves to TERMINATED; Nurse.status becomes REVOKED once every License of the nurse has encumbrance_status REVOKED"
      - "Complaint.status PROCEEDING_OPENED -> CLOSED; License.open_encumbrance_count recomputed; Nurse.prior_discipline_count recomputed"
      - "one NotificationReport with channel NPDB (channel NURSE_AIDE_REGISTRY for a NURSE_AIDE credential), report_kind INITIAL and basis_code equal to the adopted tier is queued per License the order encumbers, plus exactly one NotificationReport with channel INTERSTATE_COMPACT and basis_code PRIVILEGE_LOSS; REPRIMAND queues neither"

  # --- NotificationReport ------------------------------------------------------
  - method: GET
    path: "/notification-reports"
    description: "List queued and transmitted reports, filtered by subject nurse, by the polymorphic source record, by channel, or by status."
    roles: [SystemAdmin, LicensureAnalyst, Investigator, BoardMember]
    code: 200
    input: ["subject_nurse_id?", "source_entity_type?", "source_entity_id?", "channel?", "report_kind?", "status?", "limit?", "offset?"]
    output: NotificationReport[]
    side_effects: []

  - method: GET
    path: "/notification-reports/{id}"
    description: "Read one national data bank or interstate notification report."
    roles: [SystemAdmin, LicensureAnalyst, Investigator, BoardMember]
    code: 200
    input: []
    output: NotificationReport
    side_effects: []

  - method: POST
    path: "/notification-reports/{id}/status"
    description: "Advance a report's transmission lifecycle, or void it."
    roles: [SystemAdmin]
    code: 200
    input: [to_status]
    output: NotificationReport
    side_effects:
      - "status advanced per §1.2 NotificationReport; transmitted_at set on TRANSMITTED and acknowledged_at set on ACKNOWLEDGED, both from the logical clock"
      - "on VOID, report_kind is set to VOID"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- auth --------------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The caller's role is not listed in the endpoint's roles."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An Applicant acted on a record belonging to a different nurse."

  # --- not found ---------------------------------------------------------------
  - id: ERR_BOARD_CONFIG_NOT_FOUND
    http: 404
    condition: "No StateBoardConfig exists for the supplied id."
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "No EducationProgram exists for the supplied id."
  - id: ERR_NURSE_NOT_FOUND
    http: 404
    condition: "No Nurse exists for the supplied id."
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "No LicenseApplication exists for the supplied id."
  - id: ERR_LICENSE_NOT_FOUND
    http: 404
    condition: "No License exists for the supplied id."
  - id: ERR_RENEWAL_NOT_FOUND
    http: 404
    condition: "No RenewalApplication exists for the supplied id."
  - id: ERR_CE_RECORD_NOT_FOUND
    http: 404
    condition: "No CeRecord exists for the supplied id."
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "No Complaint exists for the supplied id, including a target_complaint_id supplied at triage."
  - id: ERR_EVIDENCE_REQUEST_NOT_FOUND
    http: 404
    condition: "No EvidenceRequest exists for the supplied id."
  - id: ERR_MONITORING_AGREEMENT_NOT_FOUND
    http: 404
    condition: "No MonitoringAgreement exists for the supplied id."
  - id: ERR_PROCEEDING_NOT_FOUND
    http: 404
    condition: "No DisciplinaryProceeding exists for the supplied id."
  - id: ERR_NOTIFICATION_REPORT_NOT_FOUND
    http: 404
    condition: "No NotificationReport exists for the supplied id."

  # --- request shape -----------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required body field is absent, an enum field carries an undeclared member, a numeric field is out of range, or an interval field pair is inverted (hold_start_at >= hold_end_at, start_date > end_date)."
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit is outside 1..100 or offset is negative."

  # --- uniqueness and concurrency ---------------------------------------------
  - id: ERR_STATE_CODE_EXISTS
    http: 409
    condition: "A StateBoardConfig already exists with the supplied state_code."
  - id: ERR_PROGRAM_CODE_EXISTS
    http: 409
    condition: "An EducationProgram already exists with the supplied program_code under the same state_board_config_id."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_license_version does not match the current License.version, or expected_complaint_version does not match the current Complaint.version."

  # --- state -------------------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource is not in a declared from-state for the requested transition, is in a terminal state, or its StateBoardConfig is ARCHIVED."
  - id: ERR_LICENSE_NOT_RENEWABLE
    http: 409
    condition: "The credential's license_status is not ACTIVE or EXPIRED, or it is EXPIRED past the board's renewal_grace_period_days."
  - id: ERR_LICENSE_ENCUMBERED
    http: 409
    condition: "A renewal was opened on a credential whose encumbrance_status is SUSPENDED or REVOKED."
  - id: ERR_LICENSE_ALREADY_ISSUED
    http: 409
    condition: "A License already references the application as source_application_id, or the nurse already holds a live License of the same credential_type at the same board."

  # --- safety and segregation of duties ---------------------------------------
  - id: ERR_PHI_AUTHORIZATION_REQUIRED
    http: 422
    condition: "A PATIENT_CHART records demand carries no phi_authorization_id while the board requires one."
  - id: ERR_PRESIDING_MEMBER_CANNOT_VOTE
    http: 403
    condition: "The proceeding's presiding member attempted to cast a panel vote."
  - id: ERR_VOTER_CONFLICT_OF_INTEREST
    http: 403
    condition: "The voter is not seated on the panel, or approved a MonitoringAgreement for the same nurse and is therefore recused."
  - id: ERR_DISQUALIFYING_OFFENSE
    http: 422
    condition: "APPROVED_UNCONDITIONAL was recorded on an application whose screening_status is DISQUALIFYING."

  # --- referential -------------------------------------------------------------
  - id: ERR_CUSTODIAN_NOT_LINKED
    http: 422
    condition: "The demanded custodian_code does not appear in the complaint's employer_custodian_codes."

  # --- temporal ----------------------------------------------------------------
  - id: ERR_NOTICE_PERIOD_NOT_MET
    http: 422
    condition: "hearing_date is less than notice_period_days after noticed_at."
  - id: ERR_MONITORING_PERIOD_CONFLICT
    http: 409
    condition: "The proposed monitoring period overlaps, touches, or falls within monitoring_clearance_gap_days of an existing agreement for the same nurse."
  - id: ERR_CUSTODIAN_HOLD_CAPACITY
    http: 409
    condition: "The custodian already bears max_concurrent_custodian_holds open holds overlapping the requested half-open window."

  # --- eligibility -------------------------------------------------------------
  - id: ERR_PROGRAM_NOT_APPROVED
    http: 422
    condition: "The referenced education program is WITHDRAWN or its approval has expired against the logical clock."
  - id: ERR_NCLEX_NOT_PASSED
    http: 422
    condition: "An examination-pathway application was verified without nclex_result PASS."
  - id: ERR_PRIOR_LICENSE_UNVERIFIED
    http: 422
    condition: "An endorsement-pathway application was verified without a confirmed, unencumbered prior license."
  - id: ERR_BASE_LICENSE_REQUIRED
    http: 422
    condition: "An APRN application has no base_license_id, or its base license is not an ACTIVE, CLEAR RN or LPN credential belonging to the same nurse."
  - id: ERR_DEFICIENCY_LIMIT_REACHED
    http: 409
    condition: "The application has already cycled through DEFICIENT three times."
  - id: ERR_CONSOLIDATION_TARGET_INVALID
    http: 409
    condition: "The DUPLICATE triage target is absent, is the complaint itself, belongs to another credential, is itself consolidated, or is already terminal."
  - id: ERR_ATD_INELIGIBLE
    http: 422
    condition: "Alternative-to-discipline was offered on a complaint that is not SUBSTANCE_USE, or for a nurse with a prior breached agreement or prior discipline."
  - id: ERR_QUORUM_NOT_MET
    http: 422
    condition: "Fewer than three seated, non-recused members remained when the hearing was convened."
  - id: ERR_CONTINUANCE_LIMIT_REACHED
    http: 409
    condition: "The hearing has already been continued or reopened three times."
  - id: ERR_AUDIT_DOC_REQUEST_LIMIT_REACHED
    http: 409
    condition: "Practice-hour documentation has already been demanded three times on this renewal."
  - id: ERR_AUDIT_DOCS_NOT_SUBMITTED
    http: 409
    condition: "An audit decision was requested while audit_status is not DOCS_SUBMITTED, or practice_hour_periods is empty."
  - id: ERR_SANCTION_BELOW_FLOOR
    http: 422
    condition: "The adopted sanction tier is below the sanction floor frozen when the hearing was convened."

  # --- fiscal ------------------------------------------------------------------
  - id: ERR_CE_HOURS_INSUFFICIENT
    http: 422
    condition: "The provisional CE credit total is below the board's ce_hours_required at submit."
  - id: ERR_RENEWAL_FEE_UNPAID
    http: 402
    condition: "The renewal fee has not been assessed, or fee_paid_cents is less than fee_applied_cents, at submit."
  - id: ERR_PRACTICE_HOURS_INSUFFICIENT
    http: 422
    condition: "A renewal was finalised as RENEWED while its practice-hour audit stands FAILED."

# =============================================================================
# §1.7 RBAC Matrix — segregation of duties
# Investigation, board adjudication, and monitoring supervision are held by three
# distinct roles, and within adjudication the presiding member is separated from
# the voting panel and from anyone who previously approved monitoring for the
# same nurse (validations 15 and 16).
# =============================================================================
roles:

  - name: SystemAdmin
    description: "Registry operator: configures boards and education programs, drives the logical clock and the audit sampling pass, and manages outbound report transmission."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /_ops/run-audit-sampling"
      - "POST /state-board-configs"
      - "PATCH /state-board-configs/{id}"
      - "POST /education-programs"
      - "PATCH /education-programs/{id}"
      - "POST /notification-reports/{id}/status"
    shared_operations:
      - "GET /state-board-configs/{id}"
      - "GET /education-programs/{id}"
      - "GET /nurses/{id}"
      - "GET /licenses and GET /licenses/{id}"
      - "GET /license-applications and GET /license-applications/{id}"
      - "GET /renewal-applications/{id}"
      - "GET /complaints and GET /complaints/{id}"
      - "GET /notification-reports and GET /notification-reports/{id}"

  - name: LicensureAnalyst
    description: "Board licensure staff: creates nurse identities, verifies qualifications and screening, mints credentials, runs CE verification and the practice-hour audit, and finalises renewals."
    identity: "opaque"
    exclusive_operations:
      - "POST /nurses"
      - "POST /license-applications/{id}/deficiency"
      - "POST /license-applications/{id}/qualification-verification"
      - "POST /license-applications/{id}/screening-result"
      - "POST /licenses"
      - "POST /licenses/{id}/status-change"
      - "POST /licenses/{id}/privilege-determination"
      - "POST /ce-records/{id}/verification"
      - "POST /renewal-applications/{id}/ce-verification"
      - "POST /renewal-applications/{id}/finalization"
      - "POST /renewal-applications/{id}/audit-doc-request"
      - "POST /renewal-applications/{id}/audit-decision"
    shared_operations:
      - "PATCH /nurses/{id}"
      - "POST /license-applications"
      - "POST /license-applications/{id}/submit"
      - "POST /license-applications/{id}/withdrawal"
      - "POST /renewal-applications"
      - "POST /renewal-applications/{id}/payment"
      - "POST /renewal-applications/{id}/ce-records"
      - "POST /renewal-applications/{id}/submit"
      - "POST /renewal-applications/{id}/audit-doc-submission"
      - "every GET endpoint except GET /notification-reports"

  - name: Investigator
    description: "Board enforcement staff: intakes and triages complaints, opens investigations, demands and receives custodial records, and disposes of investigated complaints. Cannot adjudicate."
    identity: "opaque"
    exclusive_operations:
      - "POST /complaints"
      - "POST /complaints/{id}/triage"
      - "POST /complaints/{id}/investigation"
      - "POST /complaints/{id}/evidence-requests"
      - "POST /complaints/{id}/evidence-completion"
      - "POST /complaints/{id}/disposition"
      - "POST /evidence-requests/{id}/production"
    shared_operations:
      - "GET /complaints and GET /complaints/{id}"
      - "GET /complaints/{id}/evidence-requests and GET /evidence-requests/{id}"
      - "GET /complaints/{id}/disciplinary-proceedings and GET /disciplinary-proceedings/{id}"
      - "GET /licenses, GET /licenses/{id} and GET /licenses/{id}/privilege-summary"
      - "GET /nurses/{id}"
      - "GET /monitoring-agreements and GET /monitoring-agreements/{id}"

  - name: BoardMember
    description: "Appointed board member: decides flagged applications, offers monitoring agreements, opens and presides over proceedings, votes, and issues final orders. Cannot investigate, cannot record monitoring events, and cannot vote in a proceeding it presides over or where it approved the nurse's monitoring."
    identity: "opaque"
    exclusive_operations:
      - "POST /license-applications/{id}/board-decision"
      - "POST /monitoring-agreements"
      - "POST /disciplinary-proceedings"
      - "POST /disciplinary-proceedings/{id}/hearing-events"
      - "POST /disciplinary-proceedings/{id}/votes"
      - "POST /disciplinary-proceedings/{id}/order"
    shared_operations:
      - "GET /disciplinary-proceedings/{id} and GET /complaints/{id}/disciplinary-proceedings"
      - "GET /complaints and GET /complaints/{id}"
      - "GET /licenses, GET /licenses/{id} and GET /licenses/{id}/privilege-summary"
      - "GET /nurses/{id}"
      - "GET /monitoring-agreements and GET /monitoring-agreements/{id}"
      - "GET /renewal-applications/{id}"

  - name: MonitoringCoordinator
    description: "Alternative-to-discipline case manager: records compliance reports, missed screens, breaches and completions against executed agreements. Cannot offer an agreement and cannot adjudicate."
    identity: "opaque"
    exclusive_operations:
