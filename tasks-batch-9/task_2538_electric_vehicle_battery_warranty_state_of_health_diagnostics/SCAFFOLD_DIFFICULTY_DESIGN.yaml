      - name: pack_shipment_creation_gated_on_battery_pack_status
        entity_pair: "PackShipment depends on BatteryPack"
        grounds:
          - validations[priority=33]
          - calculations.hazmat_classification
          - state_machines.BatteryPack.IN_SERVICE_to_QUARANTINED
          - entities.PackShipment.fields.hazmat_classification
          - entities.PackShipment.fields.required_packaging_spec
        distinguishing_aspect: |
          A different entity pair and a different direction of dependence: the shipment cannot even be
          CREATED while its pack is IN_SERVICE, and the S1 event that eventually frees it does so only
          at containment step 2 (S1 packs are not quarantined at detection, unlike S3/S4), after which
          the same request succeeds AND classifies as UN3536 because the quarantine set
          damaged_defective - not as the UN3480 a full-pack shipment would otherwise carry.
        test_recipe:
          setup:
            - "L3 center with an L3 technician; a vehicle with its 483.296 kg 80.000 kWh pack IN_SERVICE."
            - "An S1 thermal event on that pack: notification_status NOT_REQUIRED, and the pack is NOT quarantined at detection."
            - "Program price book: surcharge_un3536_cents 18000, surcharge_un3480_cents 4000."
