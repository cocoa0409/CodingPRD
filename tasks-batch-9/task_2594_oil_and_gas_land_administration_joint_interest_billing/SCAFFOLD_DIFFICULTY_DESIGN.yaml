      - name: dispute_exchange_cycle_two_rounds_then_round_cap
        grounds:
          - state_machines.BillingDispute.OPEN_to_OPERATOR_RESPONDED
          - state_machines.BillingDispute.OPERATOR_RESPONDED_to_OPEN
          - entities.BillingDispute.fields.round_count
          - endpoints.POST_/land-admin/disputes/{dispute_id}/exchanges
