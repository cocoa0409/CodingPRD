          setup:
            - "Jurisdiction NE-WEST (seal_required false), GrainProfile CORN, CoatingSpec G115, Dealer Alpha."
            - "Two engineers: PE-1001 (author) and PE-1002 (sealer), both licensed in NE-WEST and ACTIVE."
            - "BinDesign D1 in DRAFT: 12.0 m x 9.6 m, pitch 30, wind 105, moisture 14.0, ASD; version 1, revision_round 0."
            - "One DesignAnalysis on D1 with design_method ASD, analysis_index 1, verdict PASS, superseded false; the design's version is now 2."
