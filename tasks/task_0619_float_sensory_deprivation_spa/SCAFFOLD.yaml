    roles: [Admin, FrontDesk]
    code: 201
    input: [tank_id, kind, "duration_minutes?", "booking_id?"]
    output: SanitationCycle
    side_effects: ["status=IN_PROGRESS; Tank.sanitation_status CLEAN->IN_CYCLE"]

  - method: GET
    path: "/sanitation-cycles/{id}"
    description: "Get a sanitation cycle"
    roles: [Admin, FrontDesk]
    code: 200
    input: []
    output: SanitationCycle
    side_effects: []

  - method: GET
    path: "/sanitation-cycles"
    description: "List sanitation cycles, filterable by tank or booking"
    roles: [Admin, FrontDesk]
    code: 200
    input: ["tank_id?", "booking_id?", "limit?", "offset?"]
    output: SanitationCycle[]
    side_effects: []

  - method: POST
    path: "/sanitation-cycles/{id}/complete"
    description: "Complete a sanitation cycle (clock must have reached ends_utc); returns tank to CLEAN"
    roles: [Admin, FrontDesk]
    code: 200
    input: []
    output: SanitationCycle
    side_effects: ["status->COMPLETED; Tank.sanitation_status IN_CYCLE->CLEAN if no other IN_PROGRESS cycle remains"]

  # ---------- Attendant ----------
