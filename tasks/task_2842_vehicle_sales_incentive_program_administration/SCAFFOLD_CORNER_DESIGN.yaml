              captures: { rep_prev: $.data.previous_per_unit_amount_cents, rep_affected: $.data.affected_claim_count, rep_net: $.data.net_adjustment_cents }
            - call: "POST /incentives/claims"
              payload: { delivery_id: "${del_id}", program_id: "${prog_id}", claimed_amount_cents: 30000, expected_program_version: "${v1}" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { err_stale: $.data.error_id }
            - call: "GET /incentives/programs/${prog_id}"
              payload: {}
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { v2: $.data.version, rate2: $.data.per_unit_amount_cents }
            - call: "POST /incentives/claims"
              payload: { delivery_id: "${del_id}", program_id: "${prog_id}", claimed_amount_cents: 35000, expected_program_version: "${v2}" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { claim_id: $.data.id, snap: $.data.snapshot_per_unit_cents, cbasis: $.data.rate_basis }
            - call: "GET /incentives/programs/${prog_id}"
              payload: {}
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { v3: $.data.version }
            - call: "GET /incentives/claims"
              payload: { program_id: "${prog_id}", limit: 10 }
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
              captures: { claim_total: $.pagination.total_count, claim_first: "$.data[0].id" }
          assert:
            - "${rate1} == 30000 and ${rep_prev} == 30000 with ${rep_affected} == 0 and ${rep_net} == 0 — a PROSPECTIVE repricing rewrites nothing retroactively"
            - "${err_stale} == ERR_STALE_PROGRAM_VERSION (412) — the dealer's read predates the repricing, which is exactly the condition the rule exists to catch: the rate it believes it is claiming no longer exists"
            - "${v2} == ${v1} + 1 and ${rate2} == 35000 — the repricing bumped the version exactly once"
            - "${snap} == 35000 and ${cbasis} == AS_SOLD_SNAPSHOT — the retried claim freezes the NEW rate, and PROSPECTIVE mode leaves the basis on the snapshot variant"
            - "${v3} == ${v2} + 1 — a successful claim creation ALSO increments the program version, so a dealer submitting two claims back-to-back must re-read between them"
            - "${claim_total} == 1 and ${claim_first} == ${claim_id} — the 412 created nothing"

      - name: a_second_repricing_must_re_read_or_it_would_record_a_baseline_that_never_existed
        claim_type: optimistic_concurrency
        grounds:
