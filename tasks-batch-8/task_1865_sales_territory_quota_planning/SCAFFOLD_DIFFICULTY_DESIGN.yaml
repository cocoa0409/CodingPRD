# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index (18 instances)
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: reconciliation_blended_vs_top_down_wins
        grounds:
          - calculations.reconciliation_final
          - entities.PlanYear.fields.reconciliation_policy
          - entities.Territory.fields.final_quota_cents
        distinguishing_aspect: |
          Same inputs (top_down 1000000, bottom_up 1080000, deviation 8.00% within
          tolerance) produce final 1040000 under policy BLENDED on a Territory quota
          versus 1000000 under TOP_DOWN_WINS — a dual-variant divergence on the
          Territory quota domain.
        test_recipe:
          setup:
            - "Two plans PB (BLENDED) and PT (TOP_DOWN_WINS), each RECONCILED with root+child territory, child top_down 1000000 and a LOCKED_IN submission of 1080000 on the child"
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27-B", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 1000000, productivity_per_rep_cents: 2000000, lock_date: "2027-01-15", reconciliation_policy: "BLENDED" }, as: SalesOpsAdmin, captures: { plan_b: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan_b}", name: "RB", potential_cents: 0, headcount_capacity: 5 }, as: SalesOpsAdmin, captures: { rb: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan_b}", name: "TB", potential_cents: 1000, headcount_capacity: 5, parent_territory_id: "${rb}" }, as: SalesOpsAdmin, captures: { tb: $.data.id } }
            - { call: "POST /sales-planning/territories/${rb}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${tb}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan_b}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/allocations", payload: { plan_year_id: "${plan_b}", scope_territory_id: "${rb}", pool_cents: 1000000 }, as: SalesOpsAdmin, captures: { alloc_b: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan_b}", as: SalesOpsAdmin, captures: { pv_b1: $.data.version } }
            - { call: "POST /sales-planning/allocations/${alloc_b}/apply", payload: { expected_plan_year_version: "${pv_b1}" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reps", payload: { full_name: "Rep B", email: "rb@x.com", hire_date: "2025-01-05" }, as: SalesOpsAdmin, captures: { rep_b: $.data.id } }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan_b}", rep_id: "${rep_b}", territory_id: "${tb}", effective_from: "2027-01-01" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/submissions", payload: { plan_year_id: "${plan_b}", territory_id: "${tb}", proposed_quota_cents: 1080000 }, as: SalesRep, as_user_id: "${rep_b}" }
            - { call: "POST /sales-planning/plan-years/${plan_b}/close-submissions", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reconciliation-runs", payload: { plan_year_id: "${plan_b}" }, as: SalesOpsAdmin, captures: { run_b: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan_b}", as: SalesOpsAdmin, captures: { pv_b2: $.data.version } }
            - { call: "POST /sales-planning/reconciliation-runs/${run_b}/apply", payload: { expected_plan_year_version: "${pv_b2}" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27-T", start_date: "2028-01-01", end_date: "2028-12-31", company_target_cents: 1000000, productivity_per_rep_cents: 2000000, lock_date: "2028-01-15", reconciliation_policy: "TOP_DOWN_WINS" }, as: SalesOpsAdmin, captures: { plan_t: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan_t}", name: "RT", potential_cents: 0, headcount_capacity: 5 }, as: SalesOpsAdmin, captures: { rt: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan_t}", name: "TT", potential_cents: 1000, headcount_capacity: 5, parent_territory_id: "${rt}" }, as: SalesOpsAdmin, captures: { tt: $.data.id } }
            - { call: "POST /sales-planning/territories/${rt}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${tt}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan_t}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/allocations", payload: { plan_year_id: "${plan_t}", scope_territory_id: "${rt}", pool_cents: 1000000 }, as: SalesOpsAdmin, captures: { alloc_t: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan_t}", as: SalesOpsAdmin, captures: { pv_t1: $.data.version } }
            - { call: "POST /sales-planning/allocations/${alloc_t}/apply", payload: { expected_plan_year_version: "${pv_t1}" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reps", payload: { full_name: "Rep T", email: "rt@x.com", hire_date: "2025-01-05" }, as: SalesOpsAdmin, captures: { rep_t: $.data.id } }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan_t}", rep_id: "${rep_t}", territory_id: "${tt}", effective_from: "2028-01-01" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/submissions", payload: { plan_year_id: "${plan_t}", territory_id: "${tt}", proposed_quota_cents: 1080000 }, as: SalesRep, as_user_id: "${rep_t}" }
            - { call: "POST /sales-planning/plan-years/${plan_t}/close-submissions", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reconciliation-runs", payload: { plan_year_id: "${plan_t}" }, as: SalesOpsAdmin, captures: { run_t: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan_t}", as: SalesOpsAdmin, captures: { pv_t2: $.data.version } }
            - { call: "POST /sales-planning/reconciliation-runs/${run_t}/apply", payload: { expected_plan_year_version: "${pv_t2}" }, as: SalesOpsAdmin }
          trigger:
            - { call: "GET /sales-planning/territories/${tb}", as: SalesOpsAdmin }
            - { call: "GET /sales-planning/territories/${tt}", as: SalesOpsAdmin }
          assert:
            - "Territory.${tb}.final_quota_cents == 1040000 (BLENDED midpoint of 1000000 and 1080000)"
            - "Territory.${tt}.final_quota_cents == 1000000 (TOP_DOWN_WINS ignores the in-tolerance submission)"
            - "ReconciliationRun.${run_b}.results row for ${tb}: deviation_pct == 8.00 and escalated == false"
            - "ReconciliationRun.${run_t}.results row for ${tt}: deviation_pct == 8.00 and escalated == false"

      - name: credit_transition_day_proration_vs_month_snapshot
        grounds:
          - calculations.credit_transition_transfer
          - entities.PlanYear.fields.credit_transition_policy
          - entities.RepAssignment.fields.attainment_cents
        distinguishing_aspect: |
          Identical bookings (June 5000, July 10000) and identical effective date
          2027-07-10 produce old-rep attainment 7903 under PRORATE_BY_DAY versus
          5000 under MONTH_SNAPSHOT — a dual-variant divergence on the CreditEvent /
          rep attainment domain, distinct from the Territory quota domain.
        test_recipe:
          setup:
            - "Two plans PD (PRORATE_BY_DAY, 2027) and PM (MONTH_SNAPSHOT, 2029 — plan date ranges may not overlap), each COMMUNICATED with child territories TF (final 300000) and TT (final 200000), repOld actively assigned to TF, repNew to TT, account ACC (potential 240000) assigned to TF, bookings 5000 on June 5 and 10000 on July 5 of the plan year credited to repOld; clock at 2029-07-05 when both applies run (>= both effective dates 07-10)"
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27-D", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 500000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15", credit_transition_policy: "PRORATE_BY_DAY" }, as: SalesOpsAdmin, captures: { plan_d: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan_d}", name: "RD", potential_cents: 0, headcount_capacity: 5 }, as: SalesOpsAdmin, captures: { rd: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan_d}", name: "TFD", potential_cents: 600, headcount_capacity: 3, parent_territory_id: "${rd}" }, as: SalesOpsAdmin, captures: { tfd: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan_d}", name: "TTD", potential_cents: 400, headcount_capacity: 3, parent_territory_id: "${rd}" }, as: SalesOpsAdmin, captures: { ttd: $.data.id } }
            - { call: "POST /sales-planning/territories/${rd}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${tfd}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${ttd}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan_d}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/allocations", payload: { plan_year_id: "${plan_d}", scope_territory_id: "${rd}", pool_cents: 500000 }, as: SalesOpsAdmin, captures: { alloc_d: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan_d}", as: SalesOpsAdmin, captures: { pv_d1: $.data.version } }
            - { call: "POST /sales-planning/allocations/${alloc_d}/apply", payload: { expected_plan_year_version: "${pv_d1}" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reps", payload: { full_name: "Old D", email: "oldd@x.com", hire_date: "2025-01-05" }, as: SalesOpsAdmin, captures: { rep_old_d: $.data.id } }
            - { call: "POST /sales-planning/reps", payload: { full_name: "New D", email: "newd@x.com", hire_date: "2025-02-05" }, as: SalesOpsAdmin, captures: { rep_new_d: $.data.id } }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan_d}", rep_id: "${rep_old_d}", territory_id: "${tfd}", effective_from: "2027-01-01" }, as: SalesOpsAdmin, captures: { asg_old_d: $.data.id } }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan_d}", rep_id: "${rep_new_d}", territory_id: "${ttd}", effective_from: "2027-01-01" }, as: SalesOpsAdmin, captures: { asg_new_d: $.data.id } }
            - { call: "POST /sales-planning/assignment-rules", payload: { plan_year_id: "${plan_d}", rule_type: "GEO_SEGMENT", priority: 10, territory_id: "${tfd}", country_code: "US" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/accounts", payload: { plan_year_id: "${plan_d}", name: "ACC-D", country_code: "US", segment: "ENTERPRISE", annual_potential_cents: 240000 }, as: SalesOpsAdmin, captures: { acc_d: $.data.id } }
            - { call: "POST /sales-planning/plan-years/${plan_d}/close-submissions", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reconciliation-runs", payload: { plan_year_id: "${plan_d}" }, as: SalesOpsAdmin, captures: { run_d: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan_d}", as: SalesOpsAdmin, captures: { pv_d2: $.data.version } }
            - { call: "POST /sales-planning/reconciliation-runs/${run_d}/apply", payload: { expected_plan_year_version: "${pv_d2}" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan_d}/communicate", as: SalesOpsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-06-05T00:00:00Z" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/credit-events", payload: { plan_year_id: "${plan_d}", account_id: "${acc_d}", amount_cents: 5000, booking_date: "2027-06-05" }, as: SalesOpsAdmin, captures: { evt_d1: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-07-05T00:00:00Z" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/credit-events", payload: { plan_year_id: "${plan_d}", account_id: "${acc_d}", amount_cents: 10000, booking_date: "2027-07-05" }, as: SalesOpsAdmin, captures: { evt_d2: "$.data[0].id" } }
            - { call: "POST /sales-planning/change-requests", payload: { plan_year_id: "${plan_d}", account_id: "${acc_d}", from_territory_id: "${tfd}", to_territory_id: "${ttd}", effective_date: "2027-07-10", reason: "realign" }, as: SalesOpsAnalyst, as_user_id: "analyst-1", captures: { cr_d: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan_d}", as: SalesOpsAdmin, captures: { pv_d3: $.data.version } }
            - { call: "POST /sales-planning/change-requests/${cr_d}/approve", payload: { expected_plan_year_version: "${pv_d3}" }, as: RevOpsManager, as_user_id: "mgr-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-07-25T00:00:00Z" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27-M", start_date: "2029-01-01", end_date: "2029-12-31", company_target_cents: 500000, productivity_per_rep_cents: 1000000, lock_date: "2029-01-15", credit_transition_policy: "MONTH_SNAPSHOT" }, as: SalesOpsAdmin, captures: { plan_m: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan_m}", name: "RM", potential_cents: 0, headcount_capacity: 5 }, as: SalesOpsAdmin, captures: { rm: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan_m}", name: "TFM", potential_cents: 600, headcount_capacity: 3, parent_territory_id: "${rm}" }, as: SalesOpsAdmin, captures: { tfm: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan_m}", name: "TTM", potential_cents: 400, headcount_capacity: 3, parent_territory_id: "${rm}" }, as: SalesOpsAdmin, captures: { ttm: $.data.id } }
            - { call: "POST /sales-planning/territories/${rm}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${tfm}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${ttm}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan_m}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/allocations", payload: { plan_year_id: "${plan_m}", scope_territory_id: "${rm}", pool_cents: 500000 }, as: SalesOpsAdmin, captures: { alloc_m: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan_m}", as: SalesOpsAdmin, captures: { pv_m1: $.data.version } }
            - { call: "POST /sales-planning/allocations/${alloc_m}/apply", payload: { expected_plan_year_version: "${pv_m1}" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reps", payload: { full_name: "Old M", email: "oldm@x.com", hire_date: "2025-01-05" }, as: SalesOpsAdmin, captures: { rep_old_m: $.data.id } }
            - { call: "POST /sales-planning/reps", payload: { full_name: "New M", email: "newm@x.com", hire_date: "2025-02-05" }, as: SalesOpsAdmin, captures: { rep_new_m: $.data.id } }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan_m}", rep_id: "${rep_old_m}", territory_id: "${tfm}", effective_from: "2029-01-01" }, as: SalesOpsAdmin, captures: { asg_old_m: $.data.id } }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan_m}", rep_id: "${rep_new_m}", territory_id: "${ttm}", effective_from: "2029-01-01" }, as: SalesOpsAdmin, captures: { asg_new_m: $.data.id } }
            - { call: "POST /sales-planning/assignment-rules", payload: { plan_year_id: "${plan_m}", rule_type: "GEO_SEGMENT", priority: 10, territory_id: "${tfm}", country_code: "US" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/accounts", payload: { plan_year_id: "${plan_m}", name: "ACC-M", country_code: "US", segment: "ENTERPRISE", annual_potential_cents: 240000 }, as: SalesOpsAdmin, captures: { acc_m: $.data.id } }
            - { call: "POST /sales-planning/plan-years/${plan_m}/close-submissions", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reconciliation-runs", payload: { plan_year_id: "${plan_m}" }, as: SalesOpsAdmin, captures: { run_m: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan_m}", as: SalesOpsAdmin, captures: { pv_m2: $.data.version } }
            - { call: "POST /sales-planning/reconciliation-runs/${run_m}/apply", payload: { expected_plan_year_version: "${pv_m2}" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan_m}/communicate", as: SalesOpsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2029-07-05T00:00:00Z" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/credit-events", payload: { plan_year_id: "${plan_m}", account_id: "${acc_m}", amount_cents: 5000, booking_date: "2029-06-05" }, as: SalesOpsAdmin, captures: { evt_m1: "$.data[0].id" } }
            - { call: "POST /sales-planning/credit-events", payload: { plan_year_id: "${plan_m}", account_id: "${acc_m}", amount_cents: 10000, booking_date: "2029-07-05" }, as: SalesOpsAdmin, captures: { evt_m2: "$.data[0].id" } }
            - { call: "POST /sales-planning/change-requests", payload: { plan_year_id: "${plan_m}", account_id: "${acc_m}", from_territory_id: "${tfm}", to_territory_id: "${ttm}", effective_date: "2029-07-10", reason: "realign" }, as: SalesOpsAnalyst, as_user_id: "analyst-1", captures: { cr_m: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan_m}", as: SalesOpsAdmin, captures: { pv_m3: $.data.version } }
            - { call: "POST /sales-planning/change-requests/${cr_m}/approve", payload: { expected_plan_year_version: "${pv_m3}" }, as: RevOpsManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "POST /sales-planning/change-requests/${cr_d}/apply", as: RevOpsManager, as_user_id: "mgr-1" }
            - { call: "POST /sales-planning/change-requests/${cr_m}/apply", as: RevOpsManager, as_user_id: "mgr-1" }
          assert:
            - "RepAssignment.${asg_old_d}.attainment_cents == 7903 (5000 June intact + 10000 - 7097 prorated out of July: round_half_up(10000 * 22/31) == 7097)"
            - "RepAssignment.${asg_new_d}.attainment_cents == 7097"
            - "RepAssignment.${asg_old_m}.attainment_cents == 5000 (MONTH_SNAPSHOT: effective day 10 <= 15 transfers the whole transition month)"
            - "RepAssignment.${asg_new_m}.attainment_cents == 10000"
            - "TerritoryChangeRequest.${cr_d}.quota_transfer_cents == 100000 and TerritoryChangeRequest.${cr_m}.quota_transfer_cents == 100000 (quota transfer is policy-independent)"
            - "Territory.${tfd}.final_quota_cents == 200000 and Territory.${ttd}.final_quota_cents == 300000 in both plans"

  - rule_id: combinatorial_formula
    instances:
      - name: allocation_largest_remainder_three_way
        grounds:
          - calculations.allocation_largest_remainder
          - state_machines.TopDownAllocation.DRAFT_to_APPLIED
          - entities.Territory.fields.assigned_quota_cents
        distinguishing_aspect: |
          Mode (a): a formula with 4 inputs (pool 1000001 plus three child
          potentials 100/200/700) whose nested floor + fractional-remainder
          distribution sends the single remainder cent to child C (fraction .7 >
          .2 > .1) — changing any one potential changes which child receives it.
        test_recipe:
          setup:
            - "Plan OPEN with root R (potential 0) and ACTIVE children A, B, C created in that order with potentials 100, 200, 700; company target 1000001"
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27-ALLOC", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 1000001, productivity_per_rep_cents: 500000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "R", potential_cents: 0, headcount_capacity: 5 }, as: SalesOpsAdmin, captures: { r: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "A", potential_cents: 100, headcount_capacity: 5, parent_territory_id: "${r}" }, as: SalesOpsAdmin, captures: { ta: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "B", potential_cents: 200, headcount_capacity: 5, parent_territory_id: "${r}" }, as: SalesOpsAdmin, captures: { tb: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "C", potential_cents: 700, headcount_capacity: 5, parent_territory_id: "${r}" }, as: SalesOpsAdmin, captures: { tc: $.data.id } }
            - { call: "POST /sales-planning/territories/${r}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${ta}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${tb}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${tc}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/allocations", payload: { plan_year_id: "${plan}", scope_territory_id: "${r}", pool_cents: 1000001 }, as: SalesOpsAdmin, captures: { alloc: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv: $.data.version } }
          trigger:
            - { call: "POST /sales-planning/allocations/${alloc}/apply", payload: { expected_plan_year_version: "${pv}" }, as: SalesOpsAdmin }
          assert:
            - "Territory.${ta}.assigned_quota_cents == 100000 (floor of 100000.1)"
            - "Territory.${tb}.assigned_quota_cents == 200000 (floor of 200000.2)"
            - "Territory.${tc}.assigned_quota_cents == 700001 (floor of 700000.7 plus the single remainder cent: largest fractional part .7)"
            - "Territory.${r}.assigned_quota_cents == 1000001 and the three children sum to 1000001 exactly"
            - "TopDownAllocation.${alloc}.results lists the three rows ordered A, B, C (child created_at ASC)"

      - name: ramp_quota_per_month_rounding
        grounds:
          - calculations.ramp_quota
          - entities.RepAssignment.fields.ramped_quota_cents
          - entities.RampSchedule.fields.multipliers
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — monthly base
          round_half_up(100000/12) == 8333 first, then per-month contributions
          rounded (e.g. March round_half_up(8333 * 0.50) == 4167 from 4166.5),
          then an integer sum giving 79164; summing unrounded months first would
          give 79167, a different cent-level result.
        test_recipe:
          setup:
            - "Plan OPEN with single ACTIVE leaf territory T allocated the full target 100000; ramp schedule M = [0.00, 0.25, 0.50, 0.75, 1.00 x8]; rep hired 2027-01-10 (day <= 15 so January is tenure month 1) assigned to T from 2027-01-01"
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27-RAMP", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T", potential_cents: 100, headcount_capacity: 5 }, as: SalesOpsAdmin, captures: { t: $.data.id } }
