          assert:
            - "the first trigger returns 422 with error_id == ERR_CLAIM_BASIS_UNSUPPORTED: linked_proposal_id is null so no pinned estimate exists, and claim_status stays NONE"
            - "the second trigger returns 200 with claim_status == FILED, claim_basis == ACV, claimed_gross_cents == 117708 and settlement_cents == 0 (age 12 years over 4444 days, 300000 * 0.98^12 -> 235415, halved by the 0.5 extent -> 117708, then 117708 - 250000 floored at 0)"
            - "the third trigger returns 422 with error_id == ERR_CREDIT_POOL_REQUIRED, not ERR_NO_SETTLEMENT_PAYABLE: priority 39 is evaluated before priority 42 even though both conditions hold"
            - "the fifth trigger returns 422 with error_id == ERR_NO_SETTLEMENT_PAYABLE: this incident names a credit pool, so only the zero payout remains"
            - "the sixth trigger returns 200 with claim_status == DENIED and settlement_cents == 0"
            - "FundingPool.${pool_id}.recovery_credits_cents == 0 and available_cents == 100000: no refused or denied claim ever credited the pool"
            - "both incidents still read damage_status == TRIAGED: the claim dimension moved without touching the damage dimension"

      - name: a_late_artist_response_and_a_second_annual_application_are_refused
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CONSULTATION_WINDOW_CLOSED]
          - errors[ERR_MAX_ANNUAL_APPLICATIONS]
          - validations[priority=26]
          - validations[priority=33]
        distinguishing_aspect: "Both refusals are clock-driven and both are boundary-exact: the response window is strictly-before due_at so the due instant itself is already closed, and the annual cap counts COMPLETED visits in the clock's year so the second completion under a cap of 1 fails at completion time - after the visit has already legitimately started."
        test_recipe:
          setup:
            - "logical clock 2026-08-01T00:00:00Z; a BRONZE work, a WASH protocol with cycle_days 180 and max_annual_applications 1, and a PENDING consultation due 2026-08-31T00:00:00Z"
          setup_api_calls:
            - call: "POST /public-art/artists"
              payload: { full_name: "Ada Vance", is_living: true, contact_email: "ada@example.gov" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artist_id: $.data.id }
            - call: "POST /public-art/sites"
              payload: { site_code: "PLZ-1", name: "Civic Plaza", address_ref: "1 Civic Center", exposure_class: "URBAN", capacity_units: 20 }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { site_id: $.data.id }
            - call: "POST /public-art/artworks"
              payload: { accession_number: "2024.001", title: "Standing Figure", artist_id: "${artist_id}", site_id: "${site_id}", material_class: "BRONZE", significance_tier: "LANDMARK", footprint_units: 6, insured_value_cents: 12000000, acquisition_date: "2014-06-01", acquisition_document_ref: "DEED-2014-001" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artwork_id: $.data.id }
            - call: "POST /public-art/maintenance-protocols"
              payload: { protocol_code: "WASH-BR", material_class: "BRONZE", method: "WASH", cycle_days: 180, max_annual_applications: 1 }
              as: ChiefConservator
              as_user_id: "chief-1"
              captures: { proto_id: $.data.id }
            - call: "POST /public-art/artist-consultations"
              payload: { artwork_id: "${artwork_id}", artist_id: "${artist_id}", subject: "RELOCATION" }
              as: ChiefConservator
              as_user_id: "chief-1"
              captures: { consult_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: PublicArtManager
              as_user_id: "mgr-1"
            - call: "POST /public-art/artist-consultations/${consult_id}/respond"
              payload: { response: "CONCUR", response_note: "one instant too late" }
              as: ArtistRepresentative
              as_user_id: "${artist_id}"
              captures: { e_window: $.data.error_id }
            - call: "POST /public-art/maintenance-visits"
              payload: { artwork_id: "${artwork_id}", protocol_id: "${proto_id}", window_start: "2026-09-01T09:00:00Z", window_end: "2026-09-02T17:00:00Z", crew_note: "annual wash" }
              as: MaintenanceCrew
              as_user_id: "crew-1"
              captures: { visit_1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: PublicArtManager
              as_user_id: "mgr-1"
            - call: "POST /public-art/maintenance-visits/${visit_1}/start"
              payload: {}
              as: MaintenanceCrew
              as_user_id: "crew-1"
            - call: "POST /public-art/maintenance-visits/${visit_1}/complete"
              payload: { completion_note: "washed and rinsed" }
              as: MaintenanceCrew
              as_user_id: "crew-1"
            - call: "POST /public-art/maintenance-visits"
              payload: { artwork_id: "${artwork_id}", protocol_id: "${proto_id}", window_start: "2026-09-10T09:00:00Z", window_end: "2026-09-11T17:00:00Z" }
              as: MaintenanceCrew
              as_user_id: "crew-1"
              captures: { visit_2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T09:00:00Z" }
              as: PublicArtManager
              as_user_id: "mgr-1"
            - call: "POST /public-art/maintenance-visits/${visit_2}/start"
              payload: {}
              as: MaintenanceCrew
              as_user_id: "crew-1"
            - call: "POST /public-art/maintenance-visits/${visit_2}/complete"
              payload: {}
              as: MaintenanceCrew
              as_user_id: "crew-1"
              captures: { e_cap: $.data.error_id }
          assert:
            - "the second trigger returns 409 with error_id == ERR_CONSULTATION_WINDOW_CLOSED: the clock equals due_at 2026-08-31T00:00:00Z and the rule requires the clock strictly before it, so the row stays PENDING with responded_at == null"
            - "the sixth trigger returns 200: MaintenanceVisit.${visit_1}.status == COMPLETED, Artwork.${artwork_id}.last_maintenance_completed_on == 2026-09-01, next_maintenance_due_on == 2027-02-28 (180 days on) and maintenance_applications_ytd == 1"
            - "the seventh and ninth triggers succeed: scheduling and starting a second visit are legal because the cap is only checked at completion"
            - "the tenth trigger returns 409 with error_id == ERR_MAX_ANNUAL_APPLICATIONS: one COMPLETED visit for this artwork and protocol already exists in clock year 2026 and max_annual_applications is 1"
            - "MaintenanceVisit.${visit_2}.status is still IN_PROGRESS with completed_at == null, and Artwork.${artwork_id}.maintenance_applications_ytd is still 1 with next_maintenance_due_on still 2027-02-28"

  - section: rbac
    instances:
      - name: requests_with_no_role_header_are_unauthenticated
        claim_type: authentication
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - response_envelope
        distinguishing_aspect: "Authentication is decided before anything else, so a read that any of the nine roles could perform still fails with 401 when the headers are absent - and an unrecognised role string is treated as unauthenticated (401), not as a permission problem (403)."
        test_recipe:
          setup:
            - "one artist, one site and one artwork created normally"
          setup_api_calls:
            - call: "POST /public-art/artists"
              payload: { full_name: "Ada Vance", is_living: true, contact_email: "ada@example.gov" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artist_id: $.data.id }
            - call: "POST /public-art/sites"
              payload: { site_code: "PLZ-1", name: "Civic Plaza", address_ref: "1 Civic Center", exposure_class: "URBAN", capacity_units: 20 }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { site_id: $.data.id }
            - call: "POST /public-art/artworks"
              payload: { accession_number: "2024.001", title: "Standing Figure", artist_id: "${artist_id}", site_id: "${site_id}", material_class: "BRONZE", significance_tier: "LANDMARK", footprint_units: 6, insured_value_cents: 12000000, acquisition_date: "2014-06-01", acquisition_document_ref: "DEED-2014-001" }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artwork_id: $.data.id }
          trigger:
            - call: "GET /public-art/artworks/${artwork_id}"
              payload: {}
              as: NONE
              captures: { e_no_headers: $.data.error_id }
            - call: "POST /public-art/artworks"
              payload: { accession_number: "2024.099", title: "Anonymous Gift", artist_id: "${artist_id}", site_id: "${site_id}", material_class: "STONE", significance_tier: "STANDARD", footprint_units: 1, insured_value_cents: 1000, acquisition_date: "2020-01-01", acquisition_document_ref: "DEED-X" }
              as: NONE
              captures: { e_no_headers_write: $.data.error_id }
            - call: "GET /public-art/artworks/${artwork_id}"
              payload: {}
              as: Auditor
              as_user_id: "aud-1"
              captures: { e_unknown_role: $.data.error_id }
          assert:
            - "all three trigger calls return 401 with error_id == ERR_UNAUTHENTICATED and the standard error envelope {ok: false, data: {error_id, message}}"
            - "the third call proves an unrecognised X-User-Role is 401 and not 403: Auditor is not one of the nine declared roles"
            - "GET /public-art/artworks reports total_count 1: the anonymous write created nothing"

      - name: role_exclusive_operations_are_unauthorized_for_peer_roles
        claim_type: authorization
        grounds:
          - roles
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "The nine roles are peers with disjoint exclusive operations rather than a hierarchy: the chief conservator cannot register a conservator firm, the surveyor cannot finalize the survey he wrote, the manager cannot open a funding pool, and the maintenance crew cannot even read one - while a genuinely shared operation works for both of its owners."
