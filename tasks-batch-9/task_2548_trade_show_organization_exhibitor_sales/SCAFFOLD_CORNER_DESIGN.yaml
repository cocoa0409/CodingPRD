            - call: "POST /shows/${show2_id}/publish-floor-plan"
              payload: {}
              as: ShowDirector
            - call: "POST /exhibitors"
              payload: { legal_name: "Alder Textiles", contact_email: "space@alder.example", consecutive_years: 1 }
              as: SalesRep
              captures: { ex_a: $.data.id }
            - call: "GET /shows/${show_id}"
              payload: {}
              as: ShowDirector
              captures: { sv1: $.data.version }
          trigger:
            - call: "POST /space-contracts"
              payload: { show_id: "${show_id}", exhibitor_id: "${ex_a}", expected_show_version: "${sv1}", requested_sqft: 400, booth_ids: ["00000000-0000-4000-8000-0000000000ee"] }
              as: SalesRep
              captures: { err_bnf: $.data.error_id }
            - call: "POST /space-contracts"
              payload: { show_id: "${show_id}", exhibitor_id: "${ex_a}", expected_show_version: "${sv1}", requested_sqft: 400, booth_ids: ["${b_f}"] }
              as: SalesRep
              captures: { err_bnis: $.data.error_id }
          assert:
            - "${err_bnf} == ERR_BOOTH_NOT_FOUND with HTTP 404 — membership cannot even be evaluated for a row that does not exist"
            - "${err_bnis} == ERR_BOOTH_NOT_IN_SHOW with HTTP 422 — F100 exists but belongs to the 2028 edition"
            - "Booth.${b_f}.status is still AVAILABLE with space_contract_id null, and Show.${show2_id}.held_net_sqft == 0"
            - "Show.${show_id}.version is unchanged from ${sv1} after both refusals, and no contract exists for ${ex_a}"
            - "Booth ${b_a} of the 2027 edition is untouched"

      - name: two_rules_violated_at_once_report_the_higher_priority
        claim_type: priority_conflict
        grounds:
          - validations[priority=21]
          - validations[priority=62]
        excluded_because:
          difficulty_instance: sign_on_onsite_show_reports_show_status_not_deposit_shortfall
          rationale: "§1.8 constructs the exact double violation (ON_SITE show plus an underfunded deposit) and proves priority 21 pre-empts priority 62; two further priority pairs are covered there as well, so this row is fully spent."

      - name: validity_depends_on_another_entity_s_state
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=20]
          - validations[priority=24]
        excluded_because:
          difficulty_instance: show_creation_depends_on_the_venue_contract_being_executed
          rationale: "§1.8 tests both sides of the cross-entity dependency (DRAFT contract rejected, EXECUTED accepted) and repeats the pattern for service orders and obligations, which is exactly this row's valid/invalid pair."

      - name: a_legal_booking_that_creates_a_future_hall_conflict
        claim_type: temporal_validation
        grounds:
          - validations[priority=53]
          - errors[ERR_HALL_OCCUPANCY_CONFLICT]
        excluded_because:
          difficulty_instance: hall_occupancy_is_a_closed_date_interval_padded_by_dark_days
          rationale: "§1.8 walks the dark-day padding to the day on both sides of the boundary, so the temporal detection claim is already asserted at its sharpest point."

  # =========================================================================
  # SECTION 5 — ENDPOINTS
  #
  # The guide's "Standard CRUD" and "Action endpoint" rows are intentionally not
  # emitted here: CRUD is already asserted row by row in the entities section
  # (creation / retrieval / listing / not_found / defaults / computed_fields) and
  # every action endpoint is asserted through its transition in the state_machines
  # section. Repeating them would only duplicate §1.9's own instances.
  # =========================================================================
  - section: endpoints
    instances:

      - name: combine_is_all_or_nothing_and_conserves_floor_area
        claim_type: bulk_action
        grounds:
          - endpoints[POST /booths/{id}/combine]
          - validations[priority=39]
          - errors[ERR_INVALID_COMBINE_SET]
          - calculations.show_booth_area_conservation
        distinguishing_aspect: "A combine set that names the survivor as its own child is rejected wholesale — the legal sibling in the same request is NOT merged — and the accepted two-child combine moves 300 sqft into the survivor while Show.sellable_booth_sqft stays at 700."
        test_recipe:
          setup:
            - "Show in PLANNING with A100 (400 sqft), C050 (200 sqft) and D010 (100 sqft), all AVAILABLE; sellable_booth_sqft 700."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ShowDirector
            - call: "POST /venue-contracts"
              payload: { venue_code: "MCC", hall_code: "HALL_A", hall_gross_sqft: 250000, min_aisle_ratio_pct: 30, max_booth_height_ft: 20, contract_year_start: 2027, contract_year_count: 3, committed_net_sqft_per_year: 1200, attrition_allowance_pct: 15, advance_order_discount_pct: 20, labor_rate_cents_per_hour: 9500, electrical_rate_cents_per_amp: 4200, material_handling_rate_cents_per_cwt: 8800 }
              as: ShowDirector
              captures: { vc_id: $.data.id }
            - call: "POST /venue-contracts/${vc_id}/execute"
              payload: {}
              as: ShowDirector
            - call: "POST /shows"
              payload: { venue_contract_id: "${vc_id}", name: "National Buyers Expo", edition_year: 2027, move_in_start: "2027-03-01", event_start: "2027-03-05", event_end: "2027-03-07", move_out_end: "2027-03-09", gross_sqft: 100000, aisle_ratio_pct: 40, base_rate_cents_per_sqft: 3275, selection_desk_capacity: 2 }
              as: ShowDirector
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/booths"
              payload: { booth_number: "A100", width_ft: 20, depth_ft: 20, location_class: "CORNER", premium_zone: "MAIN_AISLE", max_height_ft: 16 }
              as: FloorManager
              captures: { b_a: $.data.id }
            - call: "POST /shows/${show_id}/booths"
              payload: { booth_number: "C050", width_ft: 10, depth_ft: 20, location_class: "INLINE", premium_zone: "NONE", max_height_ft: 12 }
              as: FloorManager
              captures: { b_c: $.data.id }
            - call: "POST /shows/${show_id}/booths"
              payload: { booth_number: "D010", width_ft: 10, depth_ft: 10, location_class: "INLINE", premium_zone: "NONE", max_height_ft: 12 }
              as: FloorManager
              captures: { b_d: $.data.id }
            - call: "GET /shows/${show_id}"
              payload: {}
              as: FloorManager
              captures: { sv0: $.data.version }
          trigger:
            - call: "POST /booths/${b_a}/combine"
              payload: { expected_show_version: "${sv0}", booth_ids: ["${b_a}", "${b_c}"] }
              as: FloorManager
              captures: { err_combine: $.data.error_id }
            - call: "POST /booths/${b_a}/combine"
              payload: { expected_show_version: "${sv0}", booth_ids: ["${b_c}", "${b_d}"] }
              as: FloorManager
          assert:
            - "The self-referential set returns HTTP 422 with ${err_combine} == ERR_INVALID_COMBINE_SET"
            - "After the refusal Booth.${b_a}.area_sqft is still 400 and Booth.${b_c}.status is still AVAILABLE — the legal half of the batch was NOT applied"
            - "Show.${show_id}.version is unchanged from ${sv0} after the refusal, which is why the second call reuses it"
            - "The accepted combine returns HTTP 200 with Booth.${b_a}.area_sqft == 700"
            - "Booth.${b_c}.status == MERGED with combined_parent_booth_id == ${b_a}; Booth.${b_d}.status == MERGED with the same parent"
            - "Show.${show_id}.sellable_booth_sqft is STILL 700 and available_net_sqft == 700 — area moved, none was created"
            - "GET /booths?show_id=${show_id}&combined_parent_booth_id=${b_a} returns exactly the two merged children"

