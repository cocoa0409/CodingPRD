              captures: { cr39_reviewer_before: $.data.reviewer_physician_id, cr39_due: $.data.due_at, cr39_reason: $.data.sampled_reason }
          trigger:
            - call: "POST /chart-reviews/${cr39_id}/reassign"
              payload: {}
              as: ClinicAdmin
              captures: { cr39_reviewer_after: $.data.reviewer_physician_id, cr39_status_after: $.data.status, cr39_due_after: $.data.due_at }
          assert:
            - "${s39_sampled} == 1 and ${s39_random} == 1   # ceil(1 * 40 / 100) == 1, no mandatory rows"
            - "${cr39_reason} == RANDOM_SAMPLE"
            - "${cr39_reviewer_before} == ${p39a_id}"
            - "${cr39_due} == 2026-08-04T00:00:00Z   # sampling instant 2026-08-01T00:00:00Z + 72 hours"
            - "${cr39_reviewer_after} == ${p39b_id}   # Dr Idle has current_supervised_count 0 vs the incumbent's 1"
            - "${cr39_status_after} == PENDING"
            - "${cr39_due_after} == 2026-08-04T00:00:00Z   # unchanged by reassignment"
            - "ChartReview.${cr39_id}.changes_requested_count == 0"

      - name: corner_stub_visit_parallel_dimensions_independent
        claim_type: valid_transition
        excluded_because:
          difficulty_instance: visit_billing_and_clinical_dimensions_advance_independently
          rationale: "The parallel state_machine_shape claim — Visit.clinical_status and Visit.billing_status advancing independently and combining correctly — is asserted end-to-end by that §1.8 instance, including the interleaving where eligibility-check precedes the assessment."

      - name: corner_stub_chart_review_cyclic_loop
        claim_type: valid_transition
        excluded_because:
          difficulty_instance: chart_review_cycles_back_to_pending_twice
          rationale: "The cyclic PENDING ↔ CHANGES_REQUESTED loop, its changes_requested_count accumulation and the MAX_CHANGE_CYCLES termination condition (ERR_REVIEW_CYCLE_LIMIT on the third request) are covered there."

      - name: corner_stub_clinic_cascade_down_on_close
        claim_type: side_effect_execution
        excluded_because:
          difficulty_instance: staffing_cancel_closes_clinic_defers_queue_and_zeroes_wait
          rationale: "The cascade-down side-effect pattern (assignment cancel → headcount → posture → queue DEFERRED_CLOSURE / visit CANCELLED_CLOSURE → waiting_count → posted_wait_minutes) is the depth-4 §1.8 transitive cascade."

      - name: corner_stub_prescription_cross_entity_guard
        claim_type: precondition_enforcement
        excluded_because:
          difficulty_instance: prescription_route_blocked_once_its_visit_is_closed
          rationale: "The guarded-transition claim on Prescription DRAFT → ROUTED (allowed only while the parent Visit is still TREATED) is asserted there, including the same-payload success-then-failure pair."

      - name: corner_stub_charge_void_compensation
        claim_type: side_effect_execution
        excluded_because:
          difficulty_instance: charge_void_restores_patient_outstanding_balance_to_zero
          rationale: "The compensation side-effect pattern — void reverses the balance without erasing the audited money fields and with no drift — is the §1.8 compensating invariant."

  - section: calculations
    instances:
      - name: corner_call_next_ranks_by_priority_score_before_arrival_order
        claim_type: correct_result
        grounds:
          - calculations.queue_priority_score
          - calculations.call_next_selection
          - endpoints[POST /clinics/{clinicId}/call-next]
        distinguishing_aspect: "Priority beats FIFO: the geriatric patient who arrived SECOND is called first because AGE_BUMP_POINTS (60) lifts their score to 260 against the earlier adult's 200, and arrived_at ASC only breaks ties."
        test_recipe:
          setup:
            - "CA StateRule and a SORE_THROAT protocol (acuity_tier 2) exist; one OPEN CA clinic with one ACTIVE clinician."
            - "An adult born 1990-01-01 (438 months at the 2026-08-01 clock) is queued first; a geriatric patient born 1950-01-01 (919 months, >= GERIATRIC_AGE_MONTHS 780) is queued second."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "CA", chart_review_sample_pct: 40, review_deadline_hours: 72, collaborating_physician_required: true, min_independent_practice_age_months: 24, controlled_rx_allowed: false, max_supervised_clinicians_per_physician: 3 }
              as: ClinicAdmin
            - call: "POST /protocols"
              payload: { complaint_code: "SORE_THROAT", min_age_months: 12, max_age_months: 1200, base_price_cents: 9900, acuity_tier: 2, red_flag_codes: ["STRIDOR"], max_temp_c: 39.5, max_heart_rate_bpm: 120, min_spo2_pct: 92, requires_cosign: false, allowed_state_codes: ["CA"] }
              as: ClinicAdmin
            - call: "POST /clinics"
              payload: { name: "CA Store 40", state_code: "CA", min_clinicians_required: 1, appointment_slots_per_hour: 2, walk_in_queue_capacity: 5 }
              as: ClinicAdmin
              captures: { c40_id: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Holly", licensed_state_codes: ["CA"], max_supervised_clinicians: 3 }
              as: ClinicAdmin
              captures: { p40_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "NP Holly", credential: "NP", license_state_code: "CA", home_clinic_id: "${c40_id}", supervising_physician_id: "${p40_id}" }
              as: ClinicAdmin
              captures: { cl40_id: $.data.id }
            - call: "POST /staffing-assignments"
              payload: { clinic_id: "${c40_id}", clinician_id: "${cl40_id}", role_kind: "PRIMARY", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T23:00:00Z", pinned_supervising_physician_id: "${p40_id}" }
              as: ClinicAdmin
            - call: "POST /patients"
              payload: { full_name: "Adam Adult", date_of_birth: "1990-01-01" }
              as: FrontDeskAgent
              captures: { p40adult_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Gina Geriatric", date_of_birth: "1950-01-01" }
              as: FrontDeskAgent
              captures: { p40ger_id: $.data.id }
            - call: "POST /queue-entries"
              payload: { clinic_id: "${c40_id}", patient_id: "${p40adult_id}", kind: "WALK_IN", complaint_code: "SORE_THROAT" }
              as: FrontDeskAgent
              captures: { q40adult_id: $.data.id, q40adult_score: $.data.priority_score }
            - call: "POST /queue-entries"
              payload: { clinic_id: "${c40_id}", patient_id: "${p40ger_id}", kind: "WALK_IN", complaint_code: "SORE_THROAT" }
              as: FrontDeskAgent
              captures: { q40ger_id: $.data.id, q40ger_score: $.data.priority_score }
          trigger:
            - call: "POST /clinics/${c40_id}/call-next"
              payload: {}
              as: Clinician
              as_user_id: "${cl40_id}"
              captures: { first_called_id: $.data.id, first_called_patient: $.data.patient_id }
            - call: "POST /clinics/${c40_id}/call-next"
              payload: {}
              as: Clinician
              as_user_id: "${cl40_id}"
              captures: { second_called_patient: $.data.patient_id }
          assert:
            - "${q40adult_score} == 200   # ACUITY_POINT_WEIGHT 100 * acuity 2, no bumps"
            - "${q40ger_score} == 260   # 200 + AGE_BUMP_POINTS 60"
            - "${first_called_id} == ${q40ger_id} and ${first_called_patient} == ${p40ger_id}"
            - "${second_called_patient} == ${p40adult_id}"
            - "QueueEntry.${q40ger_id}.status == CALLED and QueueEntry.${q40ger_id}.called_at == 2026-08-01T00:00:00Z"
            - "QueueEntry.${q40ger_id}.realized_wait_minutes == 0   # floor((called_at - arrived_at) / 60s)"
            - "Clinic.${c40_id}.waiting_count == 0 after both calls"

