      - "CLOSE only: every PermitBridgeAnalysis naming this bridge flips to DENIED / BRIDGE_CLOSED, its application's recommended_decision becomes DENY, and APPROVED or APPROVED_WITH_CONDITIONS applications on that route become REVOKED"

