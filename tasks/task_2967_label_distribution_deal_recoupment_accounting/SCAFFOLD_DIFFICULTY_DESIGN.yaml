              captures: { dist_id: $.data.id }
            - call: "POST /artists"
              payload: { legal_name: "Nadia Frost", email: "nadia@example.com" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { artist_id: $.data.id }
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_id}", deal_type: "DISTRIBUTION_FEE", distribution_fee_pct: 0.1500, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US", "GB"], cross_collateralized: true, advance_amount_cents: 650000, marketing_budget_cents: 500000, objection_window_days: 30, post_term_collection_days: 90 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { deal_id: $.data.id }
            - call: "POST /releases"
              payload: { deal_id: "${deal_id}", primary_artist_id: "${artist_id}", upc: "012345678905", title: "Glass Harbour", planned_release_date: "2026-02-01", formats: ["DIGITAL", "VINYL"], advance_share_cents: 600000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { rel1_id: $.data.id }
            - call: "POST /releases"
              payload: { deal_id: "${deal_id}", primary_artist_id: "${artist_id}", upc: "012345678912", title: "Night Ferry", planned_release_date: "2026-02-15", formats: ["DIGITAL"], advance_share_cents: 50000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { rel2_id: $.data.id }
            - call: "POST /distribution-deals/${deal_id}/execute"
              payload: { advance_payment_reference: "WIRE-2026-0001" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /releases/${rel1_id}/release"
              payload: { actual_release_date: "2026-02-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /releases/${rel2_id}/release"
              payload: { actual_release_date: "2026-02-15" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /artist-agreements"
              payload: { artist_id: "${artist_id}", release_id: "${rel1_id}", royalty_rate_pct: 0.1200, escalated_royalty_rate_pct: 0.1800, advance_amount_cents: 50000, recording_costs_cents: 100000, recording_recoupable_pct: 0.5000, marketing_recoup_share_pct: 0.5000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { agr_id: $.data.id }
            - call: "POST /artist-agreements/${agr_id}/activate"
              payload: {}
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /stream-rate-cards"
              payload: { dsp_code: "STRM", territory_code: "US", tier: "PREMIUM", rate_micros_per_stream: 4000, effective_from: "2026-01-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /stream-rate-cards"
              payload: { dsp_code: "STRM", territory_code: "US", tier: "AD_SUPPORTED", rate_micros_per_stream: 1200, effective_from: "2026-01-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /stream-rate-cards"
              payload: { dsp_code: "STRM", territory_code: "GB", tier: "PREMIUM", rate_micros_per_stream: 3000, effective_from: "2026-01-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /dsp-revenue-reports"
              payload: { deal_id: "${deal_id}", dsp_code: "STRM", period_start: "2026-04-01", period_end: "2026-06-30" }
              as: DistributionPartner
              as_user_id: "${dist_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /dsp-revenue-reports/${rep_id}/lines"
              payload: { release_id: "${rel1_id}", territory_code: "US", tier: "PREMIUM", stream_count: 1000001 }
              as: DistributionPartner
              as_user_id: "${dist_id}"
            - call: "POST /dsp-revenue-reports/${rep_id}/lines"
              payload: { release_id: "${rel1_id}", territory_code: "US", tier: "AD_SUPPORTED", stream_count: 2500003 }
              as: DistributionPartner
              as_user_id: "${dist_id}"
