            - { call: "POST /tlo/disclosures/${disc_id}/assessment", payload: { patentability_rating: "HIGH", market_rating: "HIGH" }, as: TechTransferOfficer }
            - { call: "POST /tlo/disclosures/${disc_id}/decision", payload: { decision: "PURSUE_PATENT" }, as: TechTransferOfficer }
          trigger:
            - { call: "POST /tlo/disclosures/${disc_id}/patent-applications", payload: { docket_number: "DKT-NP", application_type: "NON_PROVISIONAL", filed_date: "2026-08-10T00:00:00Z" }, as: TechTransferOfficer, captures: { err1: "$.data.error_id" } }
