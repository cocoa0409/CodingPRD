  - method: GET
    path: "/ccr/closure-plans/{id}"
    description: "Fetch one closure plan with both cost variants and the recommended method"
    roles: [UtilityAdmin, ComplianceOfficer, Regulator, ProfessionalEngineer]
    code: 200
    input: []
    output: ClosurePlan
    side_effects: []

  - method: GET
    path: "/ccr/closure-plans"
    description: "List closure plans; filters are ANDed"
    roles: [UtilityAdmin, ComplianceOfficer, Regulator, ProfessionalEngineer]
    code: 200
    input: ["unit_id?", "engineering_certified_by?", "cost_certified_by?", "status?", "selected_method?", "limit?", "offset?"]
    output: ClosurePlan[]
    side_effects: []

  - method: GET
    path: "/ccr/extension-requests/{id}"
    description: "Fetch one closure extension request"
    roles: [UtilityAdmin, ComplianceOfficer, Regulator]
    code: 200
    input: []
    output: ClosureExtensionRequest
    side_effects: []

  - method: GET
    path: "/ccr/extension-requests"
    description: "List closure extension requests; filters are ANDed"
    roles: [UtilityAdmin, ComplianceOfficer, Regulator]
    code: 200
    input: ["unit_id?", "status?", "justification_category?", "limit?", "offset?"]
    output: ClosureExtensionRequest[]
    side_effects: []

  - method: GET
    path: "/ccr/reuse-agreements/{id}"
    description: "Fetch one beneficial reuse agreement with its spec verdict and score"
    roles: [UtilityAdmin, ComplianceOfficer, Regulator, ProfessionalEngineer]
    code: 200
    input: []
    output: BeneficialReuseAgreement
    side_effects: []

  - method: GET
    path: "/ccr/reuse-agreements"
    description: "List beneficial reuse agreements; filters are ANDed"
    roles: [UtilityAdmin, ComplianceOfficer, Regulator, ProfessionalEngineer]
    code: 200
    input: ["unit_id?", "qualified_by?", "status?", "product_type?", "limit?", "offset?"]
    output: BeneficialReuseAgreement[]
    side_effects: []

  - method: GET
    path: "/ccr/reuse-shipments/{id}"
    description: "Fetch one reuse shipment"
    roles: [UtilityAdmin, ComplianceOfficer, Regulator]
    code: 200
    input: []
    output: ReuseShipment
    side_effects: []

  - method: GET
    path: "/ccr/reuse-shipments"
    description: "List reuse shipments; filters are ANDed"
    roles: [UtilityAdmin, ComplianceOfficer, Regulator]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: ReuseShipment[]
    side_effects: []

  - method: GET
    path: "/ccr/cap-inspections/{id}"
    description: "Fetch one cap inspection"
    roles: [UtilityAdmin, ComplianceOfficer, Regulator, ProfessionalEngineer]
    code: 200
    input: []
    output: CapInspection
    side_effects: []

  - method: GET
    path: "/ccr/cap-inspections"
    description: "List cap inspections; filters are ANDed"
    roles: [UtilityAdmin, ComplianceOfficer, Regulator, ProfessionalEngineer]
    code: 200
    input: ["unit_id?", "inspecting_professional_id?", "verdict?", "limit?", "offset?"]
    output: CapInspection[]
    side_effects: []

  - method: GET
    path: "/ccr/public-postings/{id}"
    description: "Fetch one public posting"
    roles: [UtilityAdmin, ComplianceOfficer, Regulator, PublicViewer]
    code: 200
    input: []
    output: PublicPosting
    side_effects: []

  - method: GET
    path: "/ccr/public-postings"
    description: "List public postings; filters are ANDed. Open to PublicViewer, which is the community's channel into the operating record"
    roles: [UtilityAdmin, ComplianceOfficer, Regulator, PublicViewer]
    code: 200
    input: ["unit_id?", "posting_type?", "status?", "limit?", "offset?"]
    output: PublicPosting[]
    side_effects: []

  # ------------------------------- writes: inventory & professionals --------
  - method: POST
    path: "/ccr/units"
    description: "Register a CCR disposal unit; cascade-creates its single MonitoringProgram in DETECTION phase"
    roles: [UtilityAdmin]
    code: 201
    input: [unit_code, unit_name, unit_type, plant_code, liner_class, hazard_potential_class, original_ash_in_place_tons, cessation_date, uppermost_aquifer_separation_ft, wetland_distance_ft, seismic_pga_g, fault_distance_ft, unstable_area_flag]
    output: DisposalUnit
    side_effects:
      - "runs calculations.location_restriction_verdict and stores location_restriction_verdict + demonstration_required"
      - "sets ash_in_place_tons = original_ash_in_place_tons and ash_mass_balance_ok = true"
      - "runs calculations.closure_deadline_date with granted_extension_months = 0"
      - "cascade-creates one MonitoringProgram with phase DETECTION, sampling_frequency SEMIANNUAL, network_certified false, and returns its id in monitoring_program_id"
      - "runs calculations.compliance_posture (RESTRICTED when the unit is DISQUALIFIED, WATCH when a demonstration is required, else COMPLIANT)"

  - method: POST
    path: "/ccr/professionals"
    description: "Register a qualified professional whose id is used as X-User-ID for the entity_backed roles"
    roles: [UtilityAdmin]
    code: 201
    input: [full_name, license_number, license_state, discipline, "license_status?"]
    output: QualifiedProfessional
    side_effects:
      - "sets license_status_effective_on = current logical clock date"

  - method: POST
    path: "/ccr/professionals/{id}/license-status"
    description: "Change a professional's license standing (ACTIVE, SUSPENDED, LAPSED)"
    roles: [UtilityAdmin]
    code: 200
    input: [license_status, effective_on]
    output: QualifiedProfessional
    side_effects:
      - "sets license_status and license_status_effective_on = effective_on"
      - "no retroactive invalidation: assessments and certifications already signed keep their verdicts"

  - method: POST
    path: "/ccr/stability-assessments"
    description: "File and certify a structural stability assessment for one unit"
    roles: [ProfessionalEngineer]
    code: 201
    input: [unit_id, assessed_on, factor_of_safety_static, factor_of_safety_seismic, factor_of_safety_liquefaction]
    output: StabilityAssessment
    side_effects:
      - "sets certifying_professional_id = X-User-ID"
      - "runs calculations.stability_assessment_verdict and stores verdict + deficient_criteria"
      - "runs calculations.governing_stability_verdict on the unit and flips superseded on the previous governing row"
      - "sets unit.stability_posting_due_date = governing.assessed_on + 30 days, re-derived from the governing assessment (NOT from the row just filed, which may be an older back-dated assessment)"
      - "recomputes unit.compliance_posture (FROZEN when the governing verdict is DEFICIENT)"

  # ------------------------------- writes: monitoring network ---------------
  - method: POST
    path: "/ccr/wells"
    description: "Install a monitoring well in a unit's groundwater network"
    roles: [Hydrogeologist]
    code: 201
    input: [unit_id, well_code, well_role, aquifer_zone, screen_top_ft, screen_bottom_ft, installed_on]
    output: MonitoringWell
    side_effects:
      - "recomputes the unit's MonitoringProgram background_well_count and downgradient_well_count"

  - method: POST
    path: "/ccr/wells/{id}/decommission"
    description: "Take a monitoring well out of service; refused when the remaining network would fall below the certified minimums"
    roles: [Hydrogeologist]
    code: 200
    input: [decommissioned_on, decommission_reason]
    output: MonitoringWell
    side_effects:
      - "sets well_status = DECOMMISSIONED, decommissioned_on, decommission_reason"
      - "recomputes the program's background_well_count and downgradient_well_count"

  - method: PATCH
    path: "/ccr/monitoring-programs/{id}"
    description: "Configure the program's statistical method, comparison basis and background window; refused once the phase has left DETECTION"
    roles: [Hydrogeologist]
    code: 200
    input: ["statistical_method?", "comparison_basis?", "background_window_start_on?", "background_window_end_on?"]
    output: MonitoringProgram
    side_effects:
      - "overwrites only the supplied fields; omitted fields keep their current values"
      - "does not re-run any past StatisticalEvaluation — stored verdicts are immutable"

  - method: POST
    path: "/ccr/monitoring-programs/{id}/certify-network"
    description: "Certify the monitoring network design; gates sampling and evaluation"
    roles: [Hydrogeologist]
    code: 200
    input: [certified_on]
    output: MonitoringProgram
    side_effects:
      - "runs calculations.network_certification_readiness"
      - "sets network_certified = true, network_certified_on = certified_on, network_certified_by = X-User-ID"

  - method: POST
    path: "/ccr/monitoring-programs/{id}/corrective-action-assurance"
    description: "File the corrective-action remedy cost basis and compute the financial assurance amount"
    roles: [ComplianceOfficer]
    code: 200
    input: [remedy_base_cost_usd_cents, remedy_duration_years, remedy_description]
    output: MonitoringProgram
    side_effects:
      - "stores remedy_base_cost_usd_cents, remedy_duration_years, remedy_description"
      - "runs calculations.corrective_action_assurance_amount and stores assurance_amount_usd_cents"

  - method: POST
    path: "/ccr/sampling-events"
    description: "Open a sampling round for a certified network"
    roles: [Hydrogeologist]
    code: 201
    input: [program_id, event_code, event_type, sampled_on]
    output: SamplingEvent
    side_effects:
      - "sets submitted_by_professional_id = X-User-ID, status = DRAFT, result_count = 0"
      - "enforces the 90-day minimum interval against the program's latest VALIDATED round"

  - method: POST
    path: "/ccr/analytical-results"
    description: "Append one laboratory result to a DRAFT sampling round; guarded by OCC on the parent round"
    roles: [Hydrogeologist]
    code: 201
    input: [sampling_event_id, well_id, parameter_code, concentration, unit_of_measure, detection_flag, "reporting_limit?", expected_sampling_event_version]
    output: AnalyticalResult
    side_effects:
      - "runs calculations.analytical_effective_value and stores effective_value"
      - "increments SamplingEvent.result_count by 1"
      - "increments SamplingEvent.version by 1"

  - method: POST
    path: "/ccr/sampling-events/{id}/validate"
    description: "Validate or reject a sampling round; the branch depends on the round's contents"
    roles: [Hydrogeologist]
    code: 200
    input: [validated_on]
    output: SamplingEvent
    side_effects:
      - "VALIDATED branch: sets status = VALIDATED, validated_on, and recomputes the program's last_validated_event_id and next_sampling_due_date"
      - "REJECTED branch: sets status = REJECTED and rejection_reason (NO_RESULTS or WELL_DECOMMISSIONED) and leaves the schedule untouched"
      - "increments SamplingEvent.version by 1"

  - method: POST
    path: "/ccr/sampling-events/{id}/reopen"
    description: "Return a REJECTED round to DRAFT so more results can be appended"
    roles: [Hydrogeologist]
    code: 200
    input: []
    output: SamplingEvent
    side_effects:
      - "sets status = DRAFT and clears rejection_reason and validated_on to null"
      - "increments SamplingEvent.version by 1"

  # ------------------------------- writes: statistics & demonstrations ------
  - method: POST
    path: "/ccr/statistical-evaluations"
    description: "Run the statistical evaluation of one compliance well against its background limit and issue the verdict"
    roles: [StatisticalReviewer]
    code: 201
    input: [program_id, compliance_well_id, evaluation_code, parameter_code, "retest_confirmed?"]
    output: StatisticalEvaluation
    side_effects:
      - "sets reviewing_professional_id = X-User-ID and determined_on = current logical clock date"
      - "runs calculations.background_statistical_limit under the program's comparison_basis and records method_used, comparison_basis_used, background_n, background_mean, background_stdev, background_upper_limit"
      - "runs calculations.statistical_verdict and records comparison_source_event_id, comparison_value, verdict"
      - "runs calculations.asd_deadline_date when the verdict is SSI or SSL_EXCEEDANCE"
      - "cascade hop 2 on SSI/SSL: drives the program DETECTION -> ASSESSMENT (or ASSESSMENT -> CORRECTIVE_ACTION on a confirmed SSL) and escalates sampling_frequency to QUARTERLY"
      - "cascade hop 3: sets unit.ssi_notice_due_date = determined_on + 30 days and recomputes unit.compliance_posture to RESTRICTED"
      - "cascade hop 4: moves every ACTIVE BeneficialReuseAgreement of the unit to SUSPENDED"

  - method: POST
    path: "/ccr/statistical-evaluations/{id}/asd-submission"
    description: "Submit an alternate source demonstration for an SSI or SSL evaluation inside the 90-day window"
    roles: [ComplianceOfficer]
    code: 200
    input: [submitted_on, asd_narrative, certifying_professional_id]
    output: StatisticalEvaluation
    side_effects:
      - "sets status = ASD_UNDER_REVIEW, asd_submitted_on = submitted_on, asd_narrative, asd_certifying_professional_id = certifying_professional_id"

  - method: POST
    path: "/ccr/statistical-evaluations/{id}/asd-decision"
    description: "Regulator decision on a submitted alternate source demonstration"
    roles: [Regulator]
    code: 200
    input: [decision, decided_on]
    output: StatisticalEvaluation
    side_effects:
      - "ACCEPT: sets status = ASD_ACCEPTED, verdict = NO_SSI_ALTERNATE_SOURCE, returns the program to DETECTION with SEMIANNUAL frequency, clears unit.ssi_notice_due_date and returns SUSPENDED agreements of the unit to ACTIVE"
      - "REJECT: sets status = ASD_REJECTED and leaves the verdict and the program phase unchanged"
      - "sets asd_decided_on = decided_on in both branches"

  # ------------------------------- writes: closure planning -----------------
  - method: POST
    path: "/ccr/closure-plans"
    description: "Draft a closure plan with both closure-method cost bases; both cost variants and the recommended method are computed on creation"
    roles: [UtilityAdmin]
    code: 201
    input: [unit_id, plan_code, selected_method, in_place_capital_usd_cents, in_place_annual_care_usd_cents, removal_capital_usd_cents, removal_annual_care_usd_cents, care_period_years, "selection_justification?"]
    output: ClosurePlan
    side_effects:
      - "runs calculations.closure_cost_present_value and stores in_place_nominal_usd_cents, removal_nominal_usd_cents, in_place_pv_usd_cents, removal_pv_usd_cents, cost_variance_pct"
      - "runs calculations.closure_method_recommendation and stores recommended_method"
      - "sets status = DRAFT and return_count = 0"

  - method: POST
    path: "/ccr/closure-plans/{id}/engineering-certification"
    description: "Fork branch A of the plan certification diamond: the engineering design signature"
    roles: [ProfessionalEngineer]
    code: 200
    input: [certified_on, design_narrative]
    output: ClosurePlan
    side_effects:
      - "sets engineering_certified_by = X-User-ID, engineering_certified_on = certified_on, design_narrative"
      - "advances status DRAFT -> ENGINEERING_CERTIFIED or COST_CERTIFIED -> FULLY_CERTIFIED"

  - method: POST
    path: "/ccr/closure-plans/{id}/cost-certification"
    description: "Fork branch B of the plan certification diamond: the cost basis signature, which re-runs both cost variants"
    roles: [ProfessionalEngineer]
    code: 200
    input: [certified_on, cost_basis_note]
    output: ClosurePlan
    side_effects:
      - "sets cost_certified_by = X-User-ID, cost_certified_on = certified_on, cost_basis_note"
      - "re-runs calculations.closure_cost_present_value and calculations.closure_method_recommendation"
      - "advances status DRAFT -> COST_CERTIFIED or ENGINEERING_CERTIFIED -> FULLY_CERTIFIED"

  - method: POST
    path: "/ccr/closure-plans/{id}/approve"
    description: "Regulator approval of a fully certified closure plan; moves the unit into CLOSURE_PLANNED"
    roles: [Regulator]
    code: 200
    input: [approved_on, permit_reference]
    output: ClosurePlan
    side_effects:
      - "sets status = APPROVED, approved_on, permit_reference"
      - "cascade hop 2: drives the unit's closure_state ACTIVE -> CLOSURE_PLANNED"
      - "sets unit.closure_plan_posting_due_date = approved_on + 60 days and recomputes unit.compliance_posture"

  - method: POST
    path: "/ccr/closure-plans/{id}/return-to-draft"
    description: "Send a certified plan back to DRAFT, clearing BOTH fork branches"
    roles: [Regulator]
    code: 200
    input: []
    output: ClosurePlan
    side_effects:
      - "clears engineering_certified_by, engineering_certified_on, design_narrative, cost_certified_by, cost_certified_on, cost_basis_note to null"
      - "sets status = DRAFT and increments return_count by 1"

  - method: POST
    path: "/ccr/units/{id}/begin-closure"
    description: "Start closure construction under an approved plan, on or before the closure deadline"
    roles: [UtilityAdmin]
    code: 200
    input: [initiated_on]
    output: DisposalUnit
    side_effects:
      - "sets closure_initiated_on = initiated_on and closure_state = CLOSING"
      - "sets closure_timeliness = ON_TIME"
      - "recomputes compliance_posture"

  - method: POST
    path: "/ccr/units/{id}/complete-closure"
    description: "Certify closure construction complete and open the post-closure care period"
    roles: [ProfessionalEngineer]
    code: 200
    input: [completed_on]
    output: DisposalUnit
    side_effects:
      - "sets closure_completed_on = completed_on, post_closure_care_start_on = completed_on, closure_state = POST_CLOSURE_CARE"
      - "moves cap_integrity_state NOT_APPLICABLE -> ADEQUATE"
      - "runs calculations.post_closure_care_end_date and stores post_closure_care_end_date"

  - method: POST
    path: "/ccr/units/{id}/certify-care-complete"
    description: "Certify the post-closure care period complete once it has elapsed with an adequate cap and a DETECTION-phase program"
    roles: [ProfessionalEngineer]
    code: 200
    input: []
    output: DisposalUnit
    side_effects:
      - "sets closure_state = CARE_COMPLETE (terminal)"
      - "recomputes compliance_posture"

  # ------------------------------- writes: extensions -----------------------
  - method: POST
    path: "/ccr/extension-requests"
    description: "Request additional months on the closure deadline with a statutory justification"
    roles: [UtilityAdmin]
    code: 201
    input: [unit_id, requested_months, justification_category, narrative]
    output: ClosureExtensionRequest
    side_effects:
      - "sets status = REQUESTED and granted_months = 0"
      - "sets unit.extension_demonstration_due_date = current logical clock date + 30 days, creating the EXTENSION_DEMONSTRATION posting obligation"
      - "recomputes unit.compliance_posture (WATCH while the demonstration obligation is open)"

  - method: POST
    path: "/ccr/extension-requests/{id}/decision"
    description: "Regulator grants or denies an extension; a grant moves the unit's closure deadline"
    roles: [Regulator]
    code: 200
    input: [decision, "granted_months?", decided_on, "decision_note?"]
    output: ClosureExtensionRequest
    side_effects:
      - "GRANT: sets status = GRANTED, granted_months, increases unit.granted_extension_months and re-runs calculations.closure_deadline_date"
      - "DENY: sets status = DENIED and leaves unit.granted_extension_months and closure_deadline_date untouched"
      - "sets decided_on and decision_note in both branches"

  - method: POST
    path: "/ccr/extension-requests/{id}/rescind"
    description: "Withdraw a previously granted extension; the closure deadline returns to its pre-grant value exactly"
    roles: [Regulator]
    code: 200
    input: [rescinded_on, rescission_reason]
    output: ClosureExtensionRequest
    side_effects:
      - "sets status = RESCINDED, rescinded_on, rescission_reason and granted_months = 0"
      - "decreases unit.granted_extension_months by the rescinded months and re-runs calculations.closure_deadline_date"

  # ------------------------------- writes: beneficial reuse -----------------
  - method: POST
    path: "/ccr/reuse-agreements"
    description: "Draft an offtake agreement for beneficial reuse of the unit's ash; the ASTM spec verdict and score are computed on creation"
    roles: [UtilityAdmin]
    code: 201
    input: [unit_id, agreement_code, product_type, offtaker_name, committed_tons, commitment_start_on, commitment_end_on, loi_percent, retained_325_percent, oxide_sum_percent, market_price_usd_cents_per_ton, haul_distance_miles]
    output: BeneficialReuseAgreement
    side_effects:
      - "runs calculations.ash_quality_and_reuse_score and stores meets_astm_c618_class_f and qualification_score"
      - "sets status = DRAFT and shipped_tons_total = 0"

  - method: POST
    path: "/ccr/reuse-agreements/{id}/qualify"
    description: "Engineer qualification decision on a drafted agreement; branches to QUALIFIED or DISQUALIFIED on the score"
    roles: [ProfessionalEngineer]
    code: 200
    input: [qualified_on]
    output: BeneficialReuseAgreement
    side_effects:
      - "re-runs calculations.ash_quality_and_reuse_score and calculations.reuse_commitment_exposure"
      - "sets qualified_on and qualified_by = X-User-ID"
      - "sets status = QUALIFIED when qualification_score >= 50.00, else DISQUALIFIED"

  - method: POST
    path: "/ccr/reuse-agreements/{id}/activate"
    description: "Activate a qualified agreement so shipments may move; refused while the unit is RESTRICTED or FROZEN"
    roles: [UtilityAdmin]
    code: 200
    input: [activated_on]
    output: BeneficialReuseAgreement
    side_effects:
      - "sets status = ACTIVE and activated_on"

  - method: POST
    path: "/ccr/reuse-shipments"
    description: "Move a load of ash out under an active agreement; guarded by OCC on the owning unit"
    roles: [UtilityAdmin]
    code: 201
    input: [agreement_id, shipment_code, tons, shipped_on, expected_unit_version]
    output: ReuseShipment
    side_effects:
      - "sets status = SHIPPED"
      - "increases agreement.shipped_tons_total by tons and moves the agreement to COMPLETED when the commitment is fully shipped"
      - "runs calculations.ash_in_place_balance: decreases DisposalUnit.ash_in_place_tons by tons and re-derives ash_mass_balance_ok"
      - "increments DisposalUnit.version by 1"

  - method: POST
    path: "/ccr/reuse-shipments/{id}/return"
    description: "Return a shipped load; reverses every tonnage side effect of the original shipment"
    roles: [UtilityAdmin]
    code: 200
    input: [returned_on, return_reason, expected_unit_version]
    output: ReuseShipment
    side_effects:
      - "sets status = RETURNED, returned_on, return_reason"
      - "decreases agreement.shipped_tons_total by tons and returns a COMPLETED agreement to ACTIVE"
      - "runs calculations.ash_in_place_balance: increases DisposalUnit.ash_in_place_tons by tons and re-derives ash_mass_balance_ok"
      - "increments DisposalUnit.version by 1"

  # ------------------------------- writes: care & public record -------------
  - method: POST
    path: "/ccr/cap-inspections"
    description: "Record a final-cover inspection during post-closure care; a DEFICIENT verdict extends the care period"
    roles: [ProfessionalEngineer]
    code: 201
    input: [unit_id, inspected_on, erosion_severity, settlement_inches, vegetation_cover_pct, "note?"]
    output: CapInspection
    side_effects:
      - "sets inspecting_professional_id = X-User-ID"
      - "runs calculations.cap_inspection_verdict and stores verdict + deficient_criteria"
      - "DEFICIENT: sets unit.cap_integrity_state = DEFICIENT and unit.cap_repair_due_date = inspected_on + 60 days"
      - "DEFICIENT cascade hop 3: re-runs calculations.post_closure_care_end_date (deficiency_extension_months +12, capped at 60) and escalates the unit's MonitoringProgram.sampling_frequency to QUARTERLY"
      - "PASS: sets unit.cap_integrity_state = ADEQUATE and cap_repair_due_date = null, leaving deficiency_extension_months unchanged"
      - "recomputes unit.compliance_posture"

  - method: POST
    path: "/ccr/public-postings"
    description: "Post a document to the unit's public operating record, satisfying the matching obligation"
    roles: [ComplianceOfficer]
    code: 201
    input: [unit_id, posting_type, posted_on, document_uri, document_sha256, "community_meeting_held_on?"]
    output: PublicPosting
    side_effects:
      - "sets posted_by_user_id = X-User-ID and status = POSTED"
      - "runs calculations.posting_obligation_status and stores satisfied_obligation and days_late"
      - "recomputes unit.overdue_posting_types, unit.late_posting_count and unit.compliance_posture"

  - method: POST
    path: "/ccr/public-postings/{id}/withdraw"
    description: "Withdraw a posted document; the underlying obligation becomes unsatisfied again"
    roles: [ComplianceOfficer]
    code: 200
    input: [withdrawn_on, withdrawal_reason]
    output: PublicPosting
    side_effects:
      - "sets status = WITHDRAWN, withdrawn_on, withdrawal_reason and satisfied_obligation = false"
      - "recomputes unit.overdue_posting_types, unit.late_posting_count and unit.compliance_posture"

  # ------------------------------- test-driving surface ---------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Every deadline, window and overdue evaluation reads this clock"
    roles: [UtilityAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "moves the logical clock to to_iso8601"
      - "recomputes compliance_posture and overdue_posting_types for every DisposalUnit on the next read of that unit"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for the target endpoint"
  - id: ERR_DISCIPLINE_NOT_QUALIFIED
    http: 403
    condition: "Acting professional's discipline is not qualified for this operation"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Acting X-User-ID already signed the paired step of this two-signature control"

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing or malformed field, out-of-range number, unknown enum value, bad date/hash/URI format, or pagination outside 1..100 / offset < 0"

  # --- existence ---
  - id: ERR_UNIT_NOT_FOUND
    http: 404
    condition: "Referenced DisposalUnit id does not exist"
  - id: ERR_PROFESSIONAL_NOT_FOUND
    http: 404
    condition: "Referenced QualifiedProfessional id does not exist, including the acting X-User-ID of an entity_backed role"
  - id: ERR_MONITORING_ENTITY_NOT_FOUND
    http: 404
    condition: "Referenced MonitoringProgram, MonitoringWell, SamplingEvent, AnalyticalResult or StatisticalEvaluation id does not exist"
  - id: ERR_CLOSURE_ENTITY_NOT_FOUND
    http: 404
    condition: "Referenced ClosurePlan or ClosureExtensionRequest id does not exist"
  - id: ERR_REUSE_ENTITY_NOT_FOUND
    http: 404
    condition: "Referenced BeneficialReuseAgreement or ReuseShipment id does not exist"
  - id: ERR_POSTING_NOT_FOUND
    http: 404
    condition: "Referenced PublicPosting id does not exist"

  # --- concurrency ---
  - id: ERR_STALE_UNIT_VERSION
    http: 412
    condition: "expected_unit_version does not match the owning DisposalUnit's current version"
  - id: ERR_STALE_EVENT_VERSION
    http: 412
    condition: "expected_sampling_event_version does not match the parent SamplingEvent's current version"

  # --- state ---
  - id: ERR_INVALID_UNIT_STATE
    http: 409
    condition: "DisposalUnit.closure_state does not permit this operation"
  - id: ERR_INVALID_PROGRAM_PHASE
    http: 409
    condition: "MonitoringProgram.phase does not permit this operation"
  - id: ERR_INVALID_EVENT_STATE
    http: 409
    condition: "SamplingEvent.status does not permit this operation"
  - id: ERR_INVALID_EVALUATION_STATE
    http: 409
    condition: "StatisticalEvaluation.status does not permit this operation"
  - id: ERR_INVALID_PLAN_STATE
    http: 409
    condition: "ClosurePlan.status does not permit this operation"
  - id: ERR_INVALID_AGREEMENT_STATE
    http: 409
    condition: "BeneficialReuseAgreement.status does not permit this operation"
  - id: ERR_INVALID_SHIPMENT_STATE
    http: 409
    condition: "ReuseShipment.status is already RETURNED"
  - id: ERR_INVALID_EXTENSION_STATE
    http: 409
    condition: "ClosureExtensionRequest.status does not permit this operation"
  - id: ERR_INVALID_WELL_STATE
    http: 409
    condition: "MonitoringWell.well_status is DECOMMISSIONED"
  - id: ERR_INVALID_POSTING_STATE
    http: 409
    condition: "PublicPosting.status is already WITHDRAWN"

  # --- safety / regulatory ---
  - id: ERR_UNIT_FROZEN
    http: 409
    condition: "Unit compliance_posture is FROZEN and the operation is not one of the permitted remedial writes"
  - id: ERR_UNIT_RESTRICTED
    http: 409
    condition: "Unit compliance_posture is RESTRICTED and the operation moves ash off site"
  - id: ERR_STABILITY_NOT_ADEQUATE
    http: 422
    condition: "Unit governing_stability_verdict is UNASSESSED or DEFICIENT at engineering certification"
  - id: ERR_CAP_DEFICIENCY_UNRESOLVED
    http: 409
    condition: "Unit cap_integrity_state is DEFICIENT at care-completion certification"
  - id: ERR_LOCATION_RESTRICTION_DISQUALIFIED
    http: 422
    condition: "CLOSURE_IN_PLACE approval attempted for a unit whose location_restriction_verdict is DISQUALIFIED"
  - id: ERR_REMEDY_REQUIRES_REMOVAL
    http: 409
    condition: "CLOSURE_IN_PLACE approval attempted while the unit's monitoring program is in CORRECTIVE_ACTION"

  # --- monitoring network and data ---
  - id: ERR_NETWORK_NOT_CERTIFIED
    http: 409
    condition: "Sampling or evaluation attempted before the monitoring network was certified"
  - id: ERR_NO_BACKGROUND_WELL
    http: 422
    condition: "Fewer than 1 CERTIFIED BACKGROUND well would remain in the unit's network"
  - id: ERR_INSUFFICIENT_DOWNGRADIENT_WELLS
    http: 422
    condition: "Fewer than 3 CERTIFIED DOWNGRADIENT wells would remain in the unit's network"
  - id: ERR_RESULT_WELL_NOT_IN_PROGRAM
    http: 422
    condition: "Referenced well belongs to another unit, or an evaluation's compliance well is not DOWNGRADIENT"
  - id: ERR_DUPLICATE_RESULT_FOR_WELL_PARAMETER
    http: 409
    condition: "A result already exists for this (sampling_event_id, well_id, parameter_code) triple"
  - id: ERR_SAMPLE_INTERVAL_TOO_SHORT
    http: 422
    condition: "New round's sampled_on is fewer than 90 days after the latest VALIDATED round"
  - id: ERR_INSUFFICIENT_BACKGROUND_DATA
    http: 422
    condition: "Fewer than 4 effective background values available under the program's comparison basis"
  - id: ERR_NO_COMPLIANCE_MEASUREMENT
    http: 422
    condition: "No VALIDATED round after the background window carries a result for the compliance well and parameter"
  - id: ERR_ASD_WINDOW_EXPIRED
    http: 422
    condition: "Alternate source demonstration submitted after the evaluation's asd_deadline_date"

  # --- closure and care ---
  - id: ERR_METHOD_JUSTIFICATION_REQUIRED
    http: 422
    condition: "selected_method differs from recommended_method without a selection_justification of at least 30 characters"
  - id: ERR_NO_APPROVED_CLOSURE_PLAN
    http: 409
    condition: "Closure begun without an APPROVED ClosurePlan on the unit"
  - id: ERR_CLOSURE_DEADLINE_MISSED
    http: 409
    condition: "Closure begun after the unit's closure_deadline_date"
  - id: ERR_ASH_REMOVAL_INCOMPLETE
    http: 409
    condition: "CLOSURE_BY_REMOVAL completion attempted while ash_in_place_tons > 0"
  - id: ERR_CARE_PERIOD_NOT_ELAPSED
    http: 409
    condition: "Care completion certified before post_closure_care_end_date"

  # --- extensions ---
  - id: ERR_EXTENSION_DEMONSTRATION_MISSING
    http: 422
    condition: "No POSTED EXTENSION_DEMONSTRATION public posting exists for the unit at grant time"
  - id: ERR_COMMUNITY_ENGAGEMENT_INCOMPLETE
    http: 422
    condition: "The EXTENSION_DEMONSTRATION posting carries no community_meeting_held_on"
  - id: ERR_GRANT_EXCEEDS_REQUEST
    http: 422
    condition: "granted_months exceeds the request's requested_months"
  - id: ERR_EXTENSION_CAP_EXCEEDED
    http: 422
    condition: "Cumulative granted extension months would exceed the unit_type cap (60 impoundment / 24 landfill)"

  # --- beneficial reuse ---
  - id: ERR_ASH_QUALITY_FAILS_SPEC
    http: 422
    condition: "Ash fails ASTM C618 Class F on LOI, 325-mesh retention or oxide sum"
  - id: ERR_REUSE_COMMITMENT_OVERLAP
    http: 409
    condition: "Aggregate committed tonnage across time-overlapping QUALIFIED/ACTIVE agreements exceeds the unit's remaining ash"
  - id: ERR_SHIPMENT_OUTSIDE_COMMITMENT_WINDOW
    http: 422
    condition: "shipped_on falls outside the agreement's closed commitment window"
  - id: ERR_COMMITTED_TONS_EXCEEDED
    http: 422
    condition: "Shipment would push shipped_tons_total past committed_tons"
  - id: ERR_ASH_TONS_EXCEED_INVENTORY
    http: 422
    condition: "Shipment tonnage exceeds the unit's current ash_in_place_tons"

  # --- shared / cross-cutting ---
  - id: ERR_FUTURE_DATE_NOT_ALLOWED
    http: 422
    condition: "An enumerated event date lies after the current logical clock date"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "Business code already used in its declared uniqueness scope"
  - id: ERR_LICENSE_NOT_ACTIVE
    http: 422
    condition: "Acting professional's license_status is SUSPENDED or LAPSED"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: UtilityAdmin
    description: "Utility ash-program administrator: owns the inventory, closure plan drafting, extension requests, offtake agreements, shipments and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /ccr/units"
      - "POST /ccr/professionals"
      - "POST /ccr/professionals/{id}/license-status"
      - "POST /ccr/closure-plans"
      - "POST /ccr/units/{id}/begin-closure"
      - "POST /ccr/extension-requests"
      - "POST /ccr/reuse-agreements"
      - "POST /ccr/reuse-agreements/{id}/activate"
      - "POST /ccr/reuse-shipments"
      - "POST /ccr/reuse-shipments/{id}/return"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET reads except the PublicViewer-only surface"

  - name: ProfessionalEngineer
    description: "Licensed engineer who certifies stability, closure design, closure cost, closure completion, cap inspections, care completion and ash reuse qualification"
    identity: "entity_backed:QualifiedProfessional"
    exclusive_operations:
      - "POST /ccr/stability-assessments"
      - "POST /ccr/closure-plans/{id}/engineering-certification"
      - "POST /ccr/closure-plans/{id}/cost-certification"
      - "POST /ccr/units/{id}/complete-closure"
      - "POST /ccr/units/{id}/certify-care-complete"
      - "POST /ccr/cap-inspections"
      - "POST /ccr/reuse-agreements/{id}/qualify"
    shared_operations:
      - "GET /ccr/units/{id}, GET /ccr/units, GET /ccr/stability-assessments*, GET /ccr/closure-plans*, GET /ccr/cap-inspections*, GET /ccr/reuse-agreements*"

  - name: Hydrogeologist
    description: "Licensed hydrogeologist who designs and certifies the monitoring network and owns sampling-round data capture"
    identity: "entity_backed:QualifiedProfessional"
    exclusive_operations:
      - "POST /ccr/wells"
      - "POST /ccr/wells/{id}/decommission"
      - "PATCH /ccr/monitoring-programs/{id}"
      - "POST /ccr/monitoring-programs/{id}/certify-network"
      - "POST /ccr/sampling-events"
      - "POST /ccr/analytical-results"
      - "POST /ccr/sampling-events/{id}/validate"
      - "POST /ccr/sampling-events/{id}/reopen"
    shared_operations:
      - "GET /ccr/units/{id}, GET /ccr/units, GET /ccr/wells*, GET /ccr/monitoring-programs*, GET /ccr/sampling-events*, GET /ccr/analytical-results*, GET /ccr/statistical-evaluations*"

  - name: StatisticalReviewer
    description: "Licensed statistician who runs the prediction-limit comparisons and issues SSI / SSL verdicts"
    identity: "entity_backed:QualifiedProfessional"
    exclusive_operations:
      - "POST /ccr/statistical-evaluations"
    shared_operations:
      - "GET /ccr/units/{id}, GET /ccr/units, GET /ccr/wells*, GET /ccr/monitoring-programs*, GET /ccr/sampling-events*, GET /ccr/analytical-results*, GET /ccr/statistical-evaluations*"

  - name: ComplianceOfficer
    description: "Utility compliance officer who files the public record, the corrective-action assurance and alternate source demonstrations"
    identity: "opaque"
    exclusive_operations:
      - "POST /ccr/monitoring-programs/{id}/corrective-action-assurance"
      - "POST /ccr/statistical-evaluations/{id}/asd-submission"
      - "POST /ccr/public-postings"
      - "POST /ccr/public-postings/{id}/withdraw"
    shared_operations:
      - "all GET reads including GET /ccr/units/{id}/compliance-summary"

  - name: Regulator
    description: "State regulatory authority: approves closure plans, decides extensions and alternate source demonstrations, and returns plans to draft"
    identity: "opaque"
    exclusive_operations:
      - "POST /ccr/closure-plans/{id}/approve"
      - "POST /ccr/closure-plans/{id}/return-to-draft"
      - "POST /ccr/extension-requests/{id}/decision"
      - "POST /ccr/extension-requests/{id}/rescind"
      - "POST /ccr/statistical-evaluations/{id}/asd-decision"
    shared_operations:
      - "all GET reads including GET /ccr/units/{id}/compliance-summary"

  - name: PublicViewer
    description: "Member of the affected community; read-only access to the public operating record and the unit compliance summary"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /ccr/public-postings"
      - "GET /ccr/public-postings/{id}"
      - "GET /ccr/units/{id}/compliance-summary"
