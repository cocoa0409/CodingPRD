              payload: { undertaking_id: "00000000-0000-4000-8000-000000000000", agent_name: "Ghost Agent LLC", effective_date: "2026-08-01", expiration_date: "2027-12-31", retainer_cents: 250000, expected_undertaking_version: "${und_v}" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { e_parent: "$.data.error_id" }
            - call: "POST /disclosure/dissemination-engagements"
              payload: { undertaking_id: "${und_id}", agent_name: "Real Agent LLC", effective_date: "2026-08-01", expiration_date: "2027-12-31", retainer_cents: 250000, expected_undertaking_version: "${und_v}" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { ok_id: "$.data.id", ok_und: "$.data.undertaking_id", ok_status: "$.data.status", ok_lapse: "$.data.monitoring_lapse_days", ok_ack: "$.data.last_calendar_ack_date", ok_billable: "$.data.billable_filing_count", ok_invoice: "$.data.invoice_total_cents", ok_super: "$.data.superseded_by_engagement_id", ok_term: "$.data.termination_reason" }
            - call: "GET /disclosure/dissemination-engagements?undertaking_id=${und_id}"
              payload: {}
