# =============================================================================
# PRD Benchmark Scaffold — task_3163
# No-Haggle Appraisal, Reconditioning & Inter-Store Transfer (CarMax-style)
# §1.0–§1.7 (difficulty design and corner design live in sibling files)
# =============================================================================

scenario: |
  No-Haggle Appraisal, Reconditioning & Inter-Store Transfer (CarMax): standing
  vehicle appraisal offers valid for a period regardless of whether the customer
  buys, reconditioning standards with inspection, repair cost thresholds and
  wholesale-versus-retail disposition, no-negotiation pricing with periodic
  algorithmic repricing based on days in inventory, inter-store transfer
  requests where a customer pays for shipment of a specific vehicle with hold
  periods, sales associate compensation designed to avoid haggling incentives,
  financing offers from multiple lenders presented at one time with approval
  tiers, return period and warranty coverage with reversal accounting,
  wholesale auction disposition of vehicles that fail retail standards.

domain_name: no-haggle-auto-retail
api_prefix: /v1

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
    - rate_threshold_triggers
  entity_topology: hybrid          # stores at top; flat FK-linked peers under /v1
  state_machine_shape: cyclic      # Vehicle return loop + Appraisal reactivation + AuctionLot relist cycle
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic                 # LedgerEntry.ref_entity/ref_id points at Sale | TransferRequest | ReturnRequest | AuctionLot
  role_model: segregation_of_duties  # Appraiser may not inspect a vehicle they appraised; FinanceManager may not also be the selling Associate on the same Sale
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: store_code, type: string, source: input, description: "Unique store code, e.g. 'PHX-01'; unique across all stores" }
      - { name: display_name, type: string, source: input, description: "Human-readable store name" }
      - { name: region, type: enum, source: input, description: "WEST | CENTRAL | EAST — determines transfer lane band" }
      - { name: retail_threshold_pct, type: number, source: input, default: 0.20, description: "Fraction of appraisal value; estimated reconditioning cost strictly greater than this fraction of the vehicle's final appraisal value forces WHOLESALE disposition" }
      - { name: transfer_hold_days, type: integer, source: input, default: 7, description: "Days a customer-paid transfer hold keeps the vehicle off the open market at the destination store" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSED; CLOSED stores reject all new operations" }

  - name: CustomerAccount
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Customer legal name" }
      - { name: email, type: string, source: input, description: "Unique email; unique across all customer accounts" }
      - { name: credit_score, type: integer, source: input, description: "300-850 inclusive; used by financing_tier_scoring" }
      - { name: stated_annual_income_cents, type: integer, source: input, description: "Self-reported annual income in cents; >= 0" }

  - name: Associate
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Associate name" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; home store of the associate" }
      - { name: role_kind, type: enum, source: input, description: "SALES | APPRAISER | INSPECTOR | FINANCE | MANAGER — gates which operations this associate may be referenced by" }
      - { name: flat_commission_cents, type: integer, source: input, default: 25000, description: "Per-completed-sale flat commission; identical for every vehicle price point by design" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: vin, type: string, source: input, description: "17-char VIN; unique across all vehicles" }
      - { name: make, type: string, source: input, description: "Manufacturer" }
      - { name: model, type: string, source: input, description: "Model" }
      - { name: model_year, type: integer, source: input, description: "Model year, 1990-2027" }
      - { name: odometer_miles, type: integer, source: input, description: "Odometer at intake; >= 0" }
      - { name: book_value_cents, type: integer, source: input, description: "Wholesale book value at intake; > 0" }
      - { name: current_store_id, type: string, source: system, description: "FK -> Store.id; physical location; updated by transfer delivery" }
      - { name: lifecycle_status, type: enum, source: system, description: "INTAKE -> APPRAISED -> IN_INSPECTION -> RECON -> RETAIL_LISTED -> SOLD -> RETURNED -> (re-entry) IN_INSPECTION ... ; WHOLESALE_PENDING -> AT_AUCTION -> DISPOSED is the wholesale branch; terminal: DISPOSED" }
      - { name: hold_status, type: enum, source: system, default: NONE, description: "Parallel dimension independent of lifecycle_status: NONE | TRANSFER_HOLD | RETURN_REVIEW_HOLD" }
      - { name: condition_grade, type: enum, source: system, description: "UNGRADED at intake; A | B | C | WHOLESALE_ONLY after inspection per reconditioning_disposition" }
      - { name: current_list_price_cents, type: integer, source: computed, description: "No-haggle list price; null until first pricing event at RETAIL_LISTED; only mutated by algorithmic_repricing" }
      - { name: inventory_acquired_at, type: datetime, source: system, description: "Logical timestamp of latest acquisition (trade-in redeem or purchase); reset on re-acquisition after a return" }
      - { name: days_in_inventory, type: integer, source: computed, description: "floor((now - inventory_acquired_at) / 86400); recomputed on every read and every repricing run" }
      - { name: recon_cost_total_cents, type: integer, source: computed, default: 0, description: "Snapshot of the latest COMPLETED inspection's estimated_repair_total_cents (sum over non-REJECTED line items); reset to 0 when a new inspection opens" }

  - name: Appraisal
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; vehicle being appraised" }
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id; owner of the standing offer" }
      - { name: appraiser_id, type: string, source: input, description: "FK -> Associate.id; must have role_kind APPRAISER" }
      - { name: provisional_offer_cents, type: integer, source: computed, description: "Provisional variant of appraisal_offer_value at creation" }
      - { name: final_offer_cents, type: integer, source: computed, description: "Final variant of appraisal_offer_value once the intake inspection closes the appraisal; the standing offer amount" }
      - { name: valid_from, type: datetime, source: system, description: "Logical timestamp at appraisal activation" }
      - { name: valid_until, type: datetime, source: computed, description: "valid_from + APPRAISAL_VALID_DAYS (7) days; standing offer is redeemable at any store until this instant regardless of purchase" }
      - { name: status, type: enum, source: system, description: "PENDING_INSPECTION -> ACTIVE -> REDEEMED | EXPIRED | VOIDED; EXPIRED is also assigned lazily on read/redeem when now >= valid_until; REDEEMED -> ACTIVE permitted when the redeeming Sale is returned inside the return window and the offer is still within validity" }

  - name: ReconditioningInspection
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id" }
      - { name: inspector_id, type: string, source: input, description: "FK -> Associate.id; must have role_kind INSPECTOR and MUST NOT equal the appraiser_id of the appraisal that sourced this vehicle (segregation of duties)" }
      - { name: opened_at, type: datetime, source: system, description: "Logical timestamp when inspection opened" }
      - { name: estimated_repair_total_cents, type: integer, source: computed, description: "Sum of cost_cents over all line items with status != REJECTED; recomputed on every line-item mutation" }
      - { name: disposition, type: enum, source: computed, description: "UNDECIDED | RETAIL | WHOLESALE per reconditioning_disposition at completion" }
      - { name: status, type: enum, source: system, description: "OPEN -> COMPLETED | CANCELLED" }

  - name: RepairLineItem
    parent: null
    common_fields: false
    fields:
      - { name: inspection_id, type: string, source: input, description: "FK -> ReconditioningInspection.id" }
      - { name: category, type: enum, source: input, description: "MECHANICAL | BODY | COSMETIC | SAFETY" }
      - { name: cost_cents, type: integer, source: input, description: "> 0" }
      - { name: line_status, type: enum, source: system, description: "PROPOSED -> APPROVED | REJECTED" }

  - name: PricingEvent
    parent: null
    common_fields: false
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id" }
      - { name: trigger_kind, type: enum, source: system, description: "INITIAL_LISTING | SCHEDULED_MARKDOWN | REPRICING_RUN" }
      - { name: old_price_cents, type: integer, source: system, description: "Price before this event; null on INITIAL_LISTING" }
      - { name: new_price_cents, type: integer, source: system, description: "Price after this event per algorithmic_repricing" }
      - { name: days_in_inventory_at_event, type: integer, source: system, description: "Vehicle.days_in_inventory at the moment of the event" }

  - name: TransferRequest
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; vehicle the customer wants shipped" }
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id; requester and payer" }
      - { name: from_store_id, type: string, source: system, description: "FK -> Store.id; snapshot of Vehicle.current_store_id at creation" }
      - { name: to_store_id, type: string, source: input, description: "FK -> Store.id; destination; must differ from from_store_id" }
      - { name: expedited, type: boolean, source: input, default: false, description: "Expedited shipment flag feeding transfer_shipping_fee" }
      - { name: shipping_fee_cents, type: integer, source: computed, description: "Per transfer_shipping_fee at creation; immutable thereafter" }
      - { name: hold_expires_at, type: datetime, source: computed, description: "Delivered-at + to_store.transfer_hold_days days, set on delivery; while hold is active the vehicle is reserved for the requester" }
      - { name: supersedes_request_id, type: string, source: input, description: "FK -> TransferRequest.id; optional re-booking chain after a CANCELLED request on the same vehicle" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> FEE_PAID -> IN_TRANSIT -> DELIVERED -> FULFILLED | HOLD_EXPIRED; REQUESTED|FEE_PAID|IN_TRANSIT -> CANCELLED" }

  - name: Sale
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; must be RETAIL_LISTED at the selling store" }
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id; buyer" }
      - { name: associate_id, type: string, source: input, description: "FK -> Associate.id; selling associate, role_kind SALES" }
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; snapshot of Vehicle.current_store_id at sale" }
      - { name: trade_in_appraisal_id, type: string, source: input, description: "FK -> Appraisal.id; optional standing offer redeemed as trade-in credit" }
      - { name: sale_price_cents, type: integer, source: computed, description: "Vehicle.current_list_price_cents at completion — never negotiable, never client-supplied" }
      - { name: trade_in_credit_cents, type: integer, source: computed, default: 0, description: "Appraisal.final_offer_cents when trade_in_appraisal_id present, else 0" }
      - { name: amount_due_cents, type: integer, source: computed, description: "sale_price_cents - trade_in_credit_cents; floor 0" }
      - { name: completed_at, type: datetime, source: system, description: "Logical timestamp of completion; anchors the return window" }
      - { name: status, type: enum, source: system, description: "PENDING_FINANCE -> COMPLETED -> RETURNED; PENDING_FINANCE -> CANCELLED" }

  - name: FinancingApplication
    parent: null
    common_fields: true
    fields:
      - { name: sale_id, type: string, source: input, description: "FK -> Sale.id; application against a PENDING_FINANCE sale" }
      - { name: customer_id, type: string, source: system, description: "FK -> CustomerAccount.id; copied from Sale.customer_id" }
      - { name: requested_amount_cents, type: integer, source: computed, description: "Sale.amount_due_cents at submission" }
      - { name: approval_tier, type: enum, source: computed, description: "TIER_1 | TIER_2 | TIER_3 | DECLINED per financing_tier_scoring at submission" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> OFFERS_PRESENTED -> ACCEPTED | WITHDRAWN | EXPIRED" }

  - name: LenderOffer
    parent: null
    common_fields: false
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> FinancingApplication.id" }
      - { name: lender_code, type: enum, source: system, description: "LENDER_A | LENDER_B | LENDER_C — the full panel is always presented at one time" }
      - { name: apr_bps, type: integer, source: system, description: "Annual percentage rate in basis points per financing_tier_scoring; DECLINED tier receives no offers" }
      - { name: max_amount_cents, type: integer, source: system, description: "Maximum principal this lender will fund" }
      - { name: offer_status, type: enum, source: system, description: "PRESENTED -> ACCEPTED | SUPERSEDED; all non-chosen offers become SUPERSEDED when one is ACCEPTED" }

  - name: ReturnRequest
    parent: null
    common_fields: true
    fields:
      - { name: sale_id, type: string, source: input, description: "FK -> Sale.id; sale being returned" }
      - { name: reason_code, type: enum, source: input, description: "CHANGED_MIND | MECHANICAL_DEFECT | MISREPRESENTATION" }
      - { name: opened_at, type: datetime, source: system, description: "Logical timestamp at opening; must be within RETURN_WINDOW_DAYS of Sale.completed_at" }
      - { name: odometer_at_return, type: integer, source: input, description: "Odometer at return; excess over RETURN_MILEAGE_CAP added miles triggers a per-mile deduction" }
      - { name: refund_total_cents, type: integer, source: computed, description: "Per return_reversal_waterfall" }
      - { name: status, type: enum, source: system, description: "OPEN -> APPROVED -> SETTLED | REJECTED; SETTLED is terminal" }

  - name: AuctionLot
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; vehicle in WHOLESALE_PENDING" }
      - { name: reserve_price_cents, type: integer, source: computed, description: "Per auction_reserve_price (dual-variant: see variants)" }
      - { name: hammer_price_cents, type: integer, source: input, description: "Winning bid recorded at close; must be >= reserve_price_cents for the lot to sell" }
      - { name: auction_round, type: integer, source: system, default: 1, description: "1 for the first listing; incremented on each relist of the same vehicle" }
      - { name: status, type: enum, source: system, description: "LISTED -> SOLD | UNSOLD; UNSOLD -> LISTED via relist (cycle), max 3 rounds" }

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: entry_kind, type: enum, source: system, description: "SALE_REVENUE | TRADE_IN_PAYABLE | TRANSFER_FEE | TRANSFER_FEE_REFUND | COMMISSION_ACCRUAL | COMMISSION_CLAWBACK | REFUND_PAYABLE | LENDER_REVERSAL | AUCTION_PROCEEDS" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount; positive = receivable/asset, negative = payable/refund" }
      - { name: ref_entity, type: string, source: system, description: "Entity type of the source (Sale | TransferRequest | ReturnRequest | AuctionLot)" }
      - { name: ref_id, type: string, source: system, description: "Id of the source entity; polymorphic reference resolved by ref_entity" }
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; store whose books carry the entry" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Vehicle
    initial_state: INTAKE
    terminal_states: [DISPOSED]
    transitions:
      - from: INTAKE
        to: APPRAISED
        trigger: "POST /v1/appraisals (creation of the sourcing Appraisal against this vehicle)"
        actor: Appraiser
        preconditions:
          - "Vehicle.lifecycle_status == INTAKE"
          - "Appraiser associate role_kind == APPRAISER and status == ACTIVE"
        side_effects:
          - "Appraisal created in PENDING_INSPECTION with provisional_offer_cents per appraisal_offer_value (provisional variant)"
      - from: APPRAISED
        to: APPRAISED
        trigger: "POST /v1/appraisals (fresh appraisal for a vehicle whose prior appraisal reached a terminal state and which never entered inspection)"
        actor: Appraiser
        preconditions:
          - "Vehicle.lifecycle_status == APPRAISED"
          - "No non-terminal Appraisal (PENDING_INSPECTION or ACTIVE) exists for the vehicle (ERR_CROSS_ENTITY_STATE)"
        side_effects:
          - "New Appraisal created in PENDING_INSPECTION with a recomputed provisional offer"
      - from: APPRAISED
        to: IN_INSPECTION
        trigger: "POST /v1/vehicles/{id}/inspections"
        actor: ReconditioningInspector
        preconditions:
          - "Vehicle.lifecycle_status == APPRAISED"
          - "inspector_id != appraiser_id of the vehicle's latest sourcing Appraisal (the newest non-terminal appraisal on the vehicle; segregation of duties; ERR_SEGREGATION_OF_DUTIES)"
          - "No other OPEN inspection exists for the vehicle (ERR_INSPECTION_ALREADY_OPEN)"
        side_effects:
          - "Vehicle.recon_cost_total_cents reset to 0"
      - from: IN_INSPECTION
        to: RECON
        trigger: "POST /v1/inspections/{id}/complete when disposition == RETAIL"
        actor: ReconditioningInspector
        preconditions:
          - "Inspection.status == OPEN"
          - "No RepairLineItem on the inspection remains PROPOSED (ERR_LINE_ITEMS_UNRESOLVED)"
          - "reconditioning_disposition computes RETAIL"
        side_effects:
          - "Vehicle.condition_grade set per grade rule (A if estimated_repair_total_cents == 0, B if <= 50% of retail threshold, else C)"
          - "Vehicle.recon_cost_total_cents := estimated_repair_total_cents"
          - "Sourcing Appraisal: PENDING_INSPECTION -> ACTIVE; final_offer_cents computed (final variant); valid_from/valid_until stamped"
      - from: IN_INSPECTION
        to: WHOLESALE_PENDING
        trigger: "POST /v1/inspections/{id}/complete when disposition == WHOLESALE"
        actor: ReconditioningInspector
        preconditions:
          - "Inspection.status == OPEN"
          - "No RepairLineItem on the inspection remains PROPOSED"
          - "reconditioning_disposition computes WHOLESALE"
        side_effects:
          - "Vehicle.condition_grade := WHOLESALE_ONLY"
          - "Sourcing Appraisal: PENDING_INSPECTION -> ACTIVE (standing offer still issued even when the vehicle goes wholesale)"
      - from: RECON
        to: RETAIL_LISTED
        trigger: "POST /v1/vehicles/{id}/list"
        actor: StoreManager
        preconditions:
          - "Vehicle.lifecycle_status == RECON"
          - "Vehicle.hold_status == NONE"
        side_effects:
          - "PricingEvent INITIAL_LISTING written; Vehicle.current_list_price_cents := initial list price per algorithmic_repricing (initial variant)"
      - from: RETAIL_LISTED
        to: SOLD
        trigger: "POST /v1/sales/{id}/complete"
        actor: SalesAssociate
        preconditions:
          - "Sale.status == PENDING_FINANCE with an ACCEPTED FinancingApplication, or Sale submitted as cash (no financing application)"
          - "Vehicle.lifecycle_status == RETAIL_LISTED"
          - "Vehicle.hold_status == NONE, or hold belongs to this buyer's FULFILLED-pending TransferRequest"
        side_effects:
          - "LedgerEntry SALE_REVENUE (+sale_price_cents) at sale store"
          - "LedgerEntry TRADE_IN_PAYABLE (-trade_in_credit_cents) when a trade-in appraisal is redeemed"
          - "Trade-in Appraisal -> REDEEMED; its vehicle enters INTAKE at the sale store (re-acquisition cascade)"
          - "LedgerEntry COMMISSION_ACCRUAL (+flat_commission_cents) for the selling associate"
      - from: SOLD
        to: RETURNED
        trigger: "POST /v1/returns/{id}/settle"
        actor: StoreManager
        preconditions:
          - "ReturnRequest.status == APPROVED"
        side_effects:
          - "return_reversal_waterfall executes (REFUND_PAYABLE, LENDER_REVERSAL when financed, COMMISSION_CLAWBACK entries)"
          - "Redeemed trade-in Appraisal on the sale -> ACTIVE if still within validity window (reactivation cycle), else EXPIRED"
          - "Vehicle.hold_status := RETURN_REVIEW_HOLD"
          - "Vehicle.lifecycle_status := RETURNED"
      - from: RETURNED
        to: IN_INSPECTION
        trigger: "POST /v1/vehicles/{id}/inspections (re-inspection after return)"
        actor: ReconditioningInspector
        preconditions:
          - "Vehicle.lifecycle_status == RETURNED"
          - "Vehicle.hold_status == RETURN_REVIEW_HOLD"
        side_effects:
          - "Vehicle.hold_status := NONE"
          - "Vehicle.recon_cost_total_cents reset to 0"
          - "Vehicle.inventory_acquired_at reset to now (days_in_inventory restarts)"
      - from: WHOLESALE_PENDING
        to: AT_AUCTION
        trigger: "POST /v1/auction-lots"
        actor: AuctionManager
        preconditions:
          - "Vehicle.lifecycle_status == WHOLESALE_PENDING"
          - "No LISTED AuctionLot exists for the vehicle"
        side_effects:
          - "AuctionLot created LISTED with reserve_price_cents per auction_reserve_price"
      - from: AT_AUCTION
        to: DISPOSED
        trigger: "POST /v1/auction-lots/{id}/close when hammer_price_cents >= reserve_price_cents"
        actor: AuctionManager
        preconditions:
          - "AuctionLot.status == LISTED"
        side_effects:
          - "AuctionLot -> SOLD"
          - "LedgerEntry AUCTION_PROCEEDS (+hammer_price_cents) at vehicle's current store"
      - from: AT_AUCTION
        to: WHOLESALE_PENDING
        trigger: "POST /v1/auction-lots/{id}/close when hammer_price_cents < reserve_price_cents"
        actor: AuctionManager
        preconditions:
          - "AuctionLot.status == LISTED"
          - "auction_round < 3 (else ERR_AUCTION_ROUNDS_EXHAUSTED on relist attempt; the lot itself still closes UNSOLD)"
        side_effects:
          - "AuctionLot -> UNSOLD (vehicle returns to WHOLESALE_PENDING awaiting relist)"

  - entity: VehicleHold (parallel dimension on Vehicle.hold_status)
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: TRANSFER_HOLD
        trigger: "POST /v1/transfer-requests (creation) — only when Vehicle.lifecycle_status == RETAIL_LISTED"
        actor: Customer
        preconditions:
          - "Vehicle.hold_status == NONE (ERR_VEHICLE_ALREADY_HELD)"
        side_effects:
          - "Vehicle removed from open-market sale eligibility while hold_status != NONE"
      - from: TRANSFER_HOLD
        to: NONE
        trigger: "TransferRequest -> FULFILLED (customer buys) or -> CANCELLED / HOLD_EXPIRED"
        actor: system
        preconditions: []
        side_effects:
          - "On HOLD_EXPIRED the vehicle remains RETAIL_LISTED and re-enters the open market; the hold release is conditional on the vehicle still being RETAIL_LISTED (if SOLD meanwhile the hold field is simply cleared)"
      - from: NONE
        to: RETURN_REVIEW_HOLD
        trigger: "Vehicle SOLD -> RETURNED transition"
        actor: system
        preconditions: []
        side_effects: []
      - from: RETURN_REVIEW_HOLD
        to: NONE
        trigger: "re-inspection opens (RETURNED -> IN_INSPECTION)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Appraisal
    initial_state: PENDING_INSPECTION
    terminal_states: [REDEEMED, EXPIRED, VOIDED]
    transitions:
      - from: PENDING_INSPECTION
        to: ACTIVE
        trigger: "system (cascade from inspection completion)"
        actor: system
        preconditions: []
        side_effects:
          - "final_offer_cents computed (final variant of appraisal_offer_value)"
          - "valid_from := now; valid_until := now + 7 days"
      - from: ACTIVE
        to: REDEEMED
        trigger: "POST /v1/sales/{id}/complete with trade_in_appraisal_id == this appraisal"
        actor: SalesAssociate
        preconditions:
          - "Appraisal.status == ACTIVE"
          - "now < valid_until (ERR_APPRAISAL_EXPIRED)"
          - "Appraisal.customer_id == Sale.customer_id (ERR_APPRAISAL_CUSTOMER_MISMATCH)"
        side_effects:
          - "Trade-in vehicle enters INTAKE at the sale store (new acquisition cascade; see Vehicle INTAKE preconditions — re-enters with lifecycle INTAKE via system, bypassing the INTAKE->APPRAISED trigger)"
      - from: REDEEMED
        to: ACTIVE
        trigger: "system (cascade from return settlement of the redeeming Sale)"
        actor: system
        preconditions:
          - "now < valid_until (otherwise transitions to EXPIRED instead)"
        side_effects:
          - "Standing offer restored for the remainder of its original validity window"
          - "Trade-in vehicle removed from INTAKE (unwind of the re-acquisition cascade; vehicle lifecycle_status := INTAKE with acquisition reversed — the trade-in vehicle returns to the customer and is deleted from inventory via status DISPOSED with zero-value ledger)"
      - from: REDEEMED
        to: EXPIRED
        trigger: "system (return settled after valid_until)"
        actor: system
        preconditions: []
        side_effects:
          - "Trade-in stays with the store; no cash reversal of trade-in credit beyond return_reversal_waterfall rules"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system clock advance (now >= valid_until)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /v1/appraisals/{id}/void"
        actor: Appraiser
        preconditions:
          - "Appraisal.status == ACTIVE"
          - "acting appraiser_id == Appraisal.appraiser_id or acting role is StoreManager"
        side_effects: []

  - entity: ReconditioningInspection
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /v1/inspections/{id}/complete"
        actor: ReconditioningInspector
        preconditions:
          - "All RepairLineItems resolved (none PROPOSED)"
        side_effects:
          - "disposition computed per reconditioning_disposition"
          - "Vehicle cascades per its own IN_INSPECTION transitions"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /v1/inspections/{id}/cancel"
        actor: StoreManager
        preconditions:
          - "Vehicle.lifecycle_status == IN_INSPECTION"
        side_effects:
          - "Vehicle.lifecycle_status reverts to APPRAISED (compensation)"

  - entity: TransferRequest
    initial_state: REQUESTED
    terminal_states: [FULFILLED, CANCELLED, HOLD_EXPIRED]
    transitions:
      - from: REQUESTED
        to: FEE_PAID
        trigger: "POST /v1/transfer-requests/{id}/pay"
        actor: Customer
        preconditions:
          - "acting customer_id == TransferRequest.customer_id"
          - "Vehicle.lifecycle_status still == RETAIL_LISTED (ERR_VEHICLE_NO_LONGER_AVAILABLE)"
        side_effects:
          - "LedgerEntry TRANSFER_FEE (+shipping_fee_cents) at to_store"
      - from: FEE_PAID
        to: IN_TRANSIT
        trigger: "POST /v1/transfer-requests/{id}/ship"
        actor: StoreManager
        preconditions:
          - "acting StoreManager's store == TransferRequest.from_store_id"
        side_effects: []
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /v1/transfer-requests/{id}/deliver"
        actor: StoreManager
        preconditions:
          - "acting StoreManager's store == TransferRequest.to_store_id"
        side_effects:
          - "Vehicle.current_store_id := to_store_id (depth-3 cascade hop 1: vehicle moves)"
          - "hold_expires_at := now + to_store.transfer_hold_days days"
      - from: DELIVERED
        to: FULFILLED
        trigger: "POST /v1/sales/{id}/complete where Sale.vehicle_id == this vehicle and Sale.customer_id == requester"
        actor: SalesAssociate
        preconditions:
          - "now < hold_expires_at (otherwise request must first transition to HOLD_EXPIRED)"
        side_effects:
          - "Vehicle.hold_status := NONE (hop 2)"
          - "Vehicle -> SOLD via the sale cascade (hop 3)"
      - from: DELIVERED
        to: HOLD_EXPIRED
        trigger: "system clock advance (now >= hold_expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Vehicle.hold_status := NONE; increments Vehicle.version by 1; vehicle returns to open market at destination store; shipping fee is NOT refunded"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /v1/transfer-requests/{id}/cancel"
        actor: Customer
        preconditions:
          - "acting customer_id == TransferRequest.customer_id"
        side_effects:
          - "Vehicle.hold_status := NONE"
      - from: FEE_PAID
        to: CANCELLED
        trigger: "POST /v1/transfer-requests/{id}/cancel"
        actor: Customer
        preconditions:
          - "acting customer_id == TransferRequest.customer_id"
        side_effects:
          - "Vehicle.hold_status := NONE"
          - "LedgerEntry TRANSFER_FEE_REFUND (-shipping_fee_cents) at to_store"
      - from: IN_TRANSIT
        to: CANCELLED
        trigger: "POST /v1/transfer-requests/{id}/cancel (customer cancel while in transit)"
        actor: Customer
        preconditions:
          - "acting customer_id == TransferRequest.customer_id"
        side_effects:
          - "Vehicle.hold_status := NONE; vehicle remains at from_store"
          - "LedgerEntry TRANSFER_FEE_REFUND (-shipping_fee_cents x 0.5, round_half_up) — half fee retained as restocking"

  - entity: Sale
    initial_state: PENDING_FINANCE
    terminal_states: [COMPLETED, CANCELLED, RETURNED]
    transitions:
      - from: PENDING_FINANCE
        to: COMPLETED
        trigger: "POST /v1/sales/{id}/complete"
        actor: SalesAssociate
        preconditions:
          - "Vehicle RETAIL_LISTED, hold rules satisfied (see Vehicle transition)"
          - "If a FinancingApplication exists for the sale, it must be ACCEPTED (ERR_FINANCING_NOT_ACCEPTED)"
          - "sale_price_cents recomputed from Vehicle.current_list_price_cents at completion time"
        side_effects:
          - "Vehicle -> SOLD cascade (see Vehicle)"
          - "completed_at := now"
      - from: PENDING_FINANCE
        to: CANCELLED
        trigger: "POST /v1/sales/{id}/cancel"
        actor: SalesAssociate
        preconditions:
          - "No COMPLETED financing disbursement"
        side_effects:
          - "Any SUBMITTED/OFFERS_PRESENTED FinancingApplication -> WITHDRAWN"
      - from: COMPLETED
        to: RETURNED
        trigger: "system (cascade from ReturnRequest settlement)"
        actor: system
        preconditions: []
        side_effects:
          - "All return_reversal_waterfall ledger entries posted"

  - entity: FinancingApplication
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, WITHDRAWN, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: OFFERS_PRESENTED
        trigger: "system (immediately on POST /v1/sales/{id}/financing-applications)"
        actor: system
        preconditions: []
        side_effects:
          - "approval_tier computed per financing_tier_scoring"
          - "Three LenderOffer rows (LENDER_A/B/C) created PRESENTED in the same submission response — the whole panel is presented at one time; DECLINED tier creates zero offers and the application stays SUBMITTED until WITHDRAWN"
      - from: OFFERS_PRESENTED
        to: ACCEPTED
        trigger: "POST /v1/financing-applications/{id}/accept"
        actor: Customer
        preconditions:
          - "payload lender_code names a PRESENTED offer on this application"
          - "acting customer_id == application.customer_id"
        side_effects:
          - "Chosen LenderOffer -> ACCEPTED; all other offers on this application -> SUPERSEDED"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /v1/financing-applications/{id}/withdraw or Sale cancel cascade"
        actor: Customer
        preconditions: []
        side_effects:
          - "All PRESENTED offers -> SUPERSEDED"
      - from: OFFERS_PRESENTED
        to: WITHDRAWN
        trigger: "POST /v1/financing-applications/{id}/withdraw"
        actor: Customer
        preconditions: []
        side_effects:
          - "All PRESENTED offers -> SUPERSEDED"
      - from: OFFERS_PRESENTED
        to: EXPIRED
        trigger: "system clock advance (now > application.created_at + FINANCE_OFFER_VALID_DAYS (3 days))"
        actor: system
        preconditions: []
        side_effects:
          - "All PRESENTED offers -> SUPERSEDED"

  - entity: AuctionLot
    initial_state: LISTED
    terminal_states: [SOLD, UNSOLD]
    transitions:
      - from: LISTED
        to: SOLD
        trigger: "POST /v1/auction-lots/{id}/close with hammer_price_cents >= reserve_price_cents"
        actor: AuctionManager
        preconditions: []
        side_effects:
          - "Vehicle AT_AUCTION -> DISPOSED"
      - from: LISTED
        to: UNSOLD
        trigger: "POST /v1/auction-lots/{id}/close with hammer_price_cents < reserve_price_cents"
        actor: AuctionManager
        preconditions: []
        side_effects:
          - "Vehicle AT_AUCTION -> WHOLESALE_PENDING"
      - from: UNSOLD
        to: LISTED
        trigger: "POST /v1/auction-lots (relist creates a new AuctionLot row with auction_round incremented — cycle expressed as new lot in LISTED for the same vehicle)"
        actor: AuctionManager
        preconditions:
          - "Previous lot UNSOLD and previous auction_round < 3 (ERR_AUCTION_ROUNDS_EXHAUSTED)"
        side_effects:
          - "Vehicle WHOLESALE_PENDING -> AT_AUCTION"

  - entity: ReturnRequest
    initial_state: OPEN
    terminal_states: [SETTLED, REJECTED]
    transitions:
      - from: OPEN
        to: APPROVED
        trigger: "POST /v1/returns/{id}/approve"
        actor: StoreManager
        preconditions:
          - "opened_at within RETURN_WINDOW_DAYS (7) days of Sale.completed_at (ERR_RETURN_WINDOW_CLOSED)"
          - "Sale.status == COMPLETED"
        side_effects: []
      - from: OPEN
        to: REJECTED
        trigger: "POST /v1/returns/{id}/reject"
        actor: StoreManager
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SETTLED
        trigger: "POST /v1/returns/{id}/settle"
        actor: StoreManager
        preconditions:
          - "acting StoreManager's store == Sale.store_id"
        side_effects:
          - "return_reversal_waterfall executes; refund_total_cents recorded"
          - "Sale -> RETURNED; Vehicle SOLD -> RETURNED cascade"
          - "Trade-in Appraisal reactivation cascade (see Appraisal REDEEMED -> ACTIVE | EXPIRED)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: transfer-create-stale-vehicle
    parent_entity: Vehicle
    write_endpoint: "POST /v1/transfer-requests"
    occ_field: "expected_vehicle_version"
    description: |
      Creating a TransferRequest against a Vehicle whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just mutated the vehicle (a repricing run, a
      hold placement, a store move from a delivered transfer) and the current
      writer's view of the vehicle's availability and price is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: repricing-run-stale-vehicle
    parent_entity: Vehicle
    write_endpoint: "POST /v1/vehicles/{id}/pricing-events"
    occ_field: "expected_vehicle_version"
    description: |
      Applying an algorithmic repricing event against a Vehicle whose version
      has advanced since the pricing run observed it is rejected; the run must
      re-read the vehicle and recompute against fresh state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: appraisal_offer_value
    trigger: "Appraisal creation (provisional variant) and inspection completion cascade (final variant)"
    algorithm: threshold
    formula: |
      base = Vehicle.book_value_cents
      age_years = max(0, current_year - Vehicle.model_year)   # current_year from logical clock
      mileage_over = max(0, Vehicle.odometer_miles - age_years * 12000)
      provisional:
        offer = base - age_years * AGE_DEPRECIATION_CENTS - floor(mileage_over / 1000) * MILEAGE_DEPRECIATION_CENTS
        offer = max(offer, MIN_OFFER_CENTS)
      final:
        offer = provisional - Vehicle.recon_cost_total_cents * RECON_HAIRCUT_NUM / RECON_HAIRCUT_DEN
        offer = max(offer, MIN_OFFER_CENTS)
      Both variants use round_half_up to whole cents at the final step only.
    input_set: "The vehicle under appraisal; recon haircut applies only in the final variant using the just-completed inspection's estimated_repair_total_cents"
    constants:
      AGE_DEPRECIATION_CENTS: 80000        # $800 per model year
      MILEAGE_DEPRECIATION_CENTS: 1500     # $15 per 1000 excess miles
      RECON_HAIRCUT_NUM: 1
      RECON_HAIRCUT_DEN: 2                 # 50% of recon cost deducted
      MIN_OFFER_CENTS: 50000               # $500 floor
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "At Appraisal creation, before inspection"
        difference: "No recon haircut; recon_cost_total_cents is 0 at this point by construction"
      - name: final
        when: "When the sourcing inspection completes and the Appraisal activates"
        difference: "Subtracts 50% of estimated_repair_total_cents; can differ from provisional for identical book/age/mileage inputs"
    note: "Dual-variant rule 1 instance A (entity domain: Appraisal)."

  - name: reconditioning_disposition
    trigger: "POST /v1/inspections/{id}/complete"
    algorithm: threshold
    formula: |
      threshold_cents = floor(Store.retail_threshold_pct * Appraisal.final_offer_basis_cents)
      where final_offer_basis_cents = the provisional offer recomputed WITHOUT the recon haircut
      (i.e., appraisal_offer_value provisional variant evaluated at completion time)
      if estimated_repair_total_cents > threshold_cents:   # strictly greater
        disposition = WHOLESALE
      else:
        disposition = RETAIL
      grade (RETAIL only):
        if estimated_repair_total_cents == 0: A
        elif estimated_repair_total_cents <= floor(threshold_cents / 2): B
        else: C
    input_set: "The completing inspection's non-REJECTED line items; the vehicle's store (threshold pct); the sourcing appraisal"
    constants: {}
    precision: "integer cents"
    note: "Boundary: estimated_repair_total_cents == threshold_cents exactly -> RETAIL (rule: strictly-greater trips wholesale)."

  - name: algorithmic_repricing
    trigger: "Vehicle list (initial variant) and POST /v1/vehicles/{id}/pricing-events (scheduled markdown)"
    algorithm: tiered_pricing
    formula: |
      initial variant (at RETAIL_LISTED):
        list = Appraisal.final_offer_cents * (100 + RETAIL_MARKUP_PCT) / 100, rounded HALF_UP to whole cents
      markdown variant (days_in_inventory d at run time):
        tier by d:  d < 30 -> no change
                    30 <= d < 45 -> markdown 3%
                    45 <= d < 60 -> markdown 5%
                    d >= 60       -> markdown 8%
        Each markdown event computes: new_price = round_half_up(current_list_price_cents * (100 - tier_pct) / 100)
        Markdowns COMPOSE multiplicatively across events (each event re-rounds from the current price);
        a single run applies exactly one tier — never stacked tiers in one event.
        floor: new_price = max(new_price, Appraisal.final_offer_cents)   # never list below acquisition offer
    input_set: "Vehicle with lifecycle_status == RETAIL_LISTED and hold_status == NONE; days_in_inventory recomputed at run"
    constants:
      RETAIL_MARKUP_PCT: 12
      TIER_1_DAYS: 30
      TIER_2_DAYS: 45
      TIER_3_DAYS: 60
      TIER_1_PCT: 3
      TIER_2_PCT: 5
      TIER_3_PCT: 8
    precision: "integer cents, round_half_up per event (per-step rounding pinned: round each event, never carry unrounded intermediates)"
    variants:
      - name: initial_listing
        when: "Vehicle enters RETAIL_LISTED"
        difference: "Markup over final offer instead of markdown off current price"
      - name: scheduled_markdown
        when: "Periodic repricing run"
        difference: "Tiered markdown off current_list_price_cents with per-event rounding"
    note: "Combinatorial mode (b): nested rounding where per-event rounding vs cumulative computation differ; scaffold pins per-event rounding."

  - name: transfer_shipping_fee
    trigger: "POST /v1/transfer-requests"
    algorithm: tiered_pricing
    formula: |
      lane_band(from_region, to_region):
        same region        -> band 0: base LANE_BASE_0
        adjacent region    -> band 1: base LANE_BASE_1   # WEST<->CENTRAL, CENTRAL<->EAST
        cross-country      -> band 2: base LANE_BASE_2   # WEST<->EAST
      fee = base(band)
      if expedited: fee = fee * EXPEDITE_NUM / EXPEDITE_DEN   # 1.5x
      fee = round_half_up(fee)
      if Vehicle.model_year >= current_year - 1 (nearly new): fee = fee + ENCLOSED_CARRIER_SURCHARGE
    input_set: "from/to store regions; expedited flag; vehicle model year"
    constants:
      LANE_BASE_0: 15000     # $150
      LANE_BASE_1: 45000     # $450
      LANE_BASE_2: 90000     # $900
      EXPEDITE_NUM: 3
      EXPEDITE_DEN: 2
      ENCLOSED_CARRIER_SURCHARGE: 20000   # $200
    precision: "integer cents, round_half_up"
    note: "Combinatorial mode (a): >=3 inputs (band, expedite, model-year surcharge) with tiered-rate selection and conditional branch."

  - name: return_reversal_waterfall
    trigger: "POST /v1/returns/{id}/settle"
    algorithm: waterfall_allocation
    formula: |
      Evaluation order is PINNED (circular-looking dependency resolved):
        step 1: gross_refund = Sale.amount_due_cents  (what the buyer actually paid out of pocket)
        step 2: mileage_deduction = max(0, ReturnRequest.odometer_at_return - Vehicle.odometer_miles - RETURN_MILEAGE_CAP) * PER_MILE_CENTS
        step 3: refund_total = max(0, gross_refund - mileage_deduction)
        step 4: buckets in order —
                bucket A LENDER_REVERSAL: if sale financed, min(refund_total, accepted_offer principal outstanding = requested_amount_cents) -> negative entry to lender; remainder carries down
                bucket B REFUND_PAYABLE: remainder -> cash refund to customer (negative entry)
                bucket C COMMISSION_CLAWBACK: full -flat_commission_cents entry (independent of refund remainder; clawback is unconditional)
        step 5: trade-in credit (trade_in_credit_cents) is NEVER cash-refunded; it is unwound via the Appraisal reactivation cascade (REDEEMED -> ACTIVE|EXPIRED)
    input_set: "The settled ReturnRequest, its Sale, the Sale's ACCEPTED LenderOffer (if any), the selling Associate"
    constants:
      RETURN_WINDOW_DAYS: 7
      RETURN_MILEAGE_CAP: 400
      PER_MILE_CENTS: 50          # $0.50/mile beyond cap
    precision: "integer cents"
    note: "Combinatorial mode (c): refund_total feeds bucket A which feeds bucket B while bucket C is independent — evaluation order pinned steps 1-5."

  - name: associate_compensation
    trigger: "Sale completion (accrual) and Return settlement (clawback)"
    algorithm: tiered_pricing
    formula: |
      Per sale: accrue Associate.flat_commission_cents — identical regardless of sale_price_cents (no-haggle comp design:
      commission MUST NOT be a function of vehicle price, removing any incentive to steer or negotiate).
      Monthly volume bonus (logical-clock calendar month of Sale.completed_at):
        completed sales in month m at associate's store: count c
        c >= VOLUME_TIER_3 -> bonus BONUS_TIER_3
        VOLUME_TIER_2 <= c < VOLUME_TIER_3 -> bonus BONUS_TIER_2
        VOLUME_TIER_1 <= c < VOLUME_TIER_2 -> bonus BONUS_TIER_1
        else 0
      Bonus accrues as a single LedgerEntry at the sale that first crosses each tier boundary (boundary rule: >=).
      Clawback on return settlement: -flat_commission_cents; volume bonuses are NOT clawed back (pinned).
    input_set: "COMPLETED sales of the associate in the same calendar month; returned sales still count toward volume (pinned)"
    constants:
      VOLUME_TIER_1: 5
      VOLUME_TIER_2: 10
      VOLUME_TIER_3: 20
      BONUS_TIER_1: 50000      # $500
      BONUS_TIER_2: 150000     # $1500
      BONUS_TIER_3: 400000     # $4000
    precision: "integer cents"
    note: "Returned sales counting toward volume is a deliberate anti-haggle design decision and a boundary test target (5th sale returned the same month still triggered the tier-1 bonus)."

  - name: auction_reserve_price
    trigger: "POST /v1/auction-lots (including relist)"
    algorithm: aggregation
    formula: |
      variant standard:
        reserve = round_half_up(Vehicle.book_value_cents * WHOLESALE_BOOK_PCT / 100) + Vehicle.recon_cost_total_cents * RECON_RECOVERY_PCT / 100
      variant relist:
        reserve = round_half_up(prior lot's reserve_price_cents * RELIST_DECAY_PCT / 100)
        floor: reserve = max(reserve, MIN_RESERVE_CENTS)
      Relist variant ignores book value entirely — same vehicle, different reserve.
    input_set: "Vehicle in WHOLESALE_PENDING; prior UNSOLD lot when relisting"
    constants:
      WHOLESALE_BOOK_PCT: 85
      RECON_RECOVERY_PCT: 50
      RELIST_DECAY_PCT: 90
      MIN_RESERVE_CENTS: 100000    # $1000
    precision: "integer cents, round_half_up"
    variants:
      - name: standard
        when: "First listing (auction_round == 1)"
        difference: "Book-value based with recon recovery"
      - name: relist
        when: "auction_round >= 2"
        difference: "Decays prior reserve by 10% per round; independent of book value"
    note: "Dual-variant rule 1 instance B (entity domain: AuctionLot) — different domain from appraisal_offer_value."

  - name: financing_tier_scoring
    trigger: "FinancingApplication submission"
    algorithm: weighted_scoring
    formula: |
      score = w1 * normalized_credit + w2 * normalized_dti
      normalized_credit = (CustomerAccount.credit_score - 300) / 550            # 0..1
      dti = Sale.amount_due_cents / max(1, CustomerAccount.stated_annual_income_cents)
      normalized_dti = max(0, 1 - dti / DTI_CAP)                                 # 0..1, clamped
      score = 0.7 * normalized_credit + 0.3 * normalized_dti
      tier: score >= TIER_1_MIN -> TIER_1
            score >= TIER_2_MIN -> TIER_2
            score >= TIER_3_MIN -> TIER_3
            else DECLINED (no offers created)
      APR per lender (basis points), applied to the tier:
        LENDER_A: TIER_1 490, TIER_2 690, TIER_3 990
        LENDER_B: TIER_1 515, TIER_2 740, TIER_3 1040
        LENDER_C: TIER_1 540, TIER_2 780, TIER_3 1090
      max_amount_cents per offer = requested_amount_cents (all lenders fund the full request at their tier APR)
      score computed at 4 decimal places, round_half_up, BEFORE tier comparison.
    input_set: "The application's sale amount and the customer's credit_score / stated income"
    constants:
      DTI_CAP: 0.5
      TIER_1_MIN: 0.8000
      TIER_2_MIN: 0.6000
      TIER_3_MIN: 0.4000
    precision: "score 4 decimal places round_half_up; APR integer bps"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and well-formed", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is permitted for this endpoint per RBAC matrix", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Entity-backed identity: X-User-ID must reference an existing entity of the role's backing type (Customer/Associate) when the role is entity_backed", error_id: ERR_UNKNOWN_IDENTITY, http_status: 403, applies_to: "all entity_backed roles" }
  - { priority: 4, category: existence, check: "Path and body-referenced resources exist, validated left-to-right (store, vehicle, appraisal, inspection, lot, sale, application, return, transfer)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: state, check: "Target resource in a state that permits the operation per its state machine (from-state and preconditions). State-aware error selection: transfer creation against a vehicle not in RETAIL_LISTED -> ERR_VEHICLE_NOT_LISTED; any other from-state violation -> ERR_INVALID_STATE", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: business_safety, check: "Segregation of duties: inspector_id must differ from the appraiser_id of the vehicle's latest sourcing Appraisal; selling associate and any finance approver must differ", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 409, applies_to: ["POST /v1/vehicles/{id}/inspections", "POST /v1/sales"] }
  - { priority: 7, category: business_constraint, check: "Uniqueness and shape: VIN unique, store_code unique, email unique; to_store != from_store; odometer non-negative; cost_cents > 0; hammer_price_cents > 0 (ERR_HAMMER_BELOW_RESERVE_INVALID); enum membership for role_kind/region/category/reason_code", error_id: ERR_VALIDATION, http_status: 422, applies_to: "creation endpoints and POST /v1/auction-lots/{id}/close" }
  - { priority: 8, category: business_temporal, check: "Appraisal redemption before valid_until (an appraisal whose status is EXPIRED — whether auto-transitioned by clock advance or detected lazily at now >= valid_until — yields ERR_APPRAISAL_EXPIRED); return approved within RETURN_WINDOW_DAYS of completion; transfer fulfilment before hold_expires_at. Financing offers past validity are unreachable through this rule because offer expiry auto-transitions the application to EXPIRED first (the accept then fails the priority-5 state check with ERR_INVALID_STATE)", error_id: ERR_WINDOW_CLOSED, http_status: 409, applies_to: ["POST /v1/sales", "POST /v1/returns", "POST /v1/sales/{id}/complete"], note: "state-aware error selection: expired appraisal -> ERR_APPRAISAL_EXPIRED; return window -> ERR_RETURN_WINDOW_CLOSED; hold expiry on transfer-fulfil completion -> ERR_WINDOW_CLOSED" }
  - { priority: 9, category: business_referential, check: "Cross-entity referential rules, with state-aware error selection: vehicle RETAIL_LISTED and unheld for new sale (ERR_CROSS_ENTITY_STATE); trade-in appraisal status PENDING_INSPECTION/REDEEMED/VOIDED -> ERR_APPRAISAL_NOT_ACTIVE (EXPIRED appraisals are the priority-8 temporal case -> ERR_APPRAISAL_EXPIRED); appraisal ACTIVE but owned by a different customer than the buyer -> ERR_APPRAISAL_CUSTOMER_MISMATCH; hold belongs to requester for fulfilled transfer sale; no OPEN inspection already on vehicle; financing accept while application OFFERS_PRESENTED but lender_code names no PRESENTED offer -> ERR_OFFER_NOT_PRESENTED; accept while application tier DECLINED -> ERR_FINANCING_DECLINED; second appraisal while a non-terminal appraisal exists on the vehicle -> ERR_CROSS_ENTITY_STATE", error_id: ERR_CROSS_ENTITY_STATE, http_status: 409, applies_to: ["POST /v1/sales", "POST /v1/vehicles/{id}/inspections", "POST /v1/transfer-requests", "POST /v1/appraisals", "POST /v1/financing-applications/{id}/accept"] }
  - { priority: 10, category: business_constraint, check: "Aggregate/collection rules: no unresolved PROPOSED line items at inspection completion; auction_round < 3 for relist; exactly the three-lender panel presented", error_id: ERR_AGGREGATE_RULE, http_status: 409, applies_to: ["POST /v1/inspections/{id}/complete", "POST /v1/auction-lots"] }
  - { priority: 11, category: business_fiscal, check: "OCC version match where declared; hammer price >= reserve for SOLD close; amount_due floor 0", error_id: ERR_FISCAL_RULE, http_status: 409, applies_to: ["POST /v1/auction-lots/{id}/close", "POST /v1/transfer-requests", "POST /v1/vehicles/{id}/pricing-events"] }
  - { priority: 12, category: business_fiscal, check: "Optimistic concurrency: expected_vehicle_version matches current Vehicle.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /v1/transfer-requests", "POST /v1/vehicles/{id}/pricing-events"] }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. Before any call the logical clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time. Drives appraisal expiry, hold expiry, financing offer expiry, and days_in_inventory."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["system auto-transitions re-evaluated: Appraisal EXPIRED, TransferRequest HOLD_EXPIRED, FinancingApplication EXPIRED"]

  # --- Store ---
  - method: POST
    path: "/v1/stores"
    description: "Create a store"
    roles: [PlatformAdmin]
    code: 201
    input: ["store_code", "display_name", "region", "retail_threshold_pct?", "transfer_hold_days?"]
    output: Store
    side_effects: ["status ACTIVE"]
  - method: GET
    path: "/v1/stores"
    description: "List stores"
    roles: [PlatformAdmin, StoreManager, Appraiser, ReconditioningInspector, SalesAssociate, FinanceManager, AuctionManager, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Store[]"
    side_effects: []
  - method: GET
    path: "/v1/stores/{id}"
    description: "Get a store"
    roles: [PlatformAdmin, StoreManager, Appraiser, ReconditioningInspector, SalesAssociate, FinanceManager, AuctionManager, Customer]
    code: 200
    input: []
    output: Store
    side_effects: []
  - method: GET
    path: "/v1/stores/{id}/ledger-entries"
    description: "List ledger entries carried on a store's books (FK reverse-reachability for LedgerEntry.store_id)"
    roles: [PlatformAdmin, StoreManager, FinanceManager]
    code: 200
    input: ["entry_kind?", "limit?", "offset?"]
    output: "LedgerEntry[]"
    side_effects: []

  # --- CustomerAccount ---
  - method: POST
    path: "/v1/customers"
    description: "Register a customer account"
    roles: [PlatformAdmin]
    code: 201
    input: ["full_name", "email", "credit_score", "stated_annual_income_cents"]
    output: CustomerAccount
    side_effects: []
  - method: GET
    path: "/v1/customers"
    description: "List customers"
    roles: [PlatformAdmin, StoreManager, SalesAssociate, FinanceManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "CustomerAccount[]"
    side_effects: []
  - method: GET
    path: "/v1/customers/{id}"
    description: "Get a customer; customers may read only their own record"
    roles: [PlatformAdmin, StoreManager, SalesAssociate, FinanceManager, Customer]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: []

  # --- Associate ---
  - method: POST
    path: "/v1/associates"
    description: "Create an associate"
    roles: [PlatformAdmin]
    code: 201
    input: ["display_name", "store_id", "role_kind", "flat_commission_cents?"]
    output: Associate
    side_effects: ["status ACTIVE"]
  - method: GET
    path: "/v1/associates"
    description: "List associates"
    roles: [PlatformAdmin, StoreManager]
    code: 200
    input: ["store_id?", "role_kind?", "limit?", "offset?"]
    output: "Associate[]"
    side_effects: []
  - method: GET
    path: "/v1/associates/{id}"
    description: "Get an associate"
    roles: [PlatformAdmin, StoreManager]
    code: 200
    input: []
    output: Associate
    side_effects: []

  # --- Vehicle ---
  - method: POST
    path: "/v1/vehicles"
    description: "Intake a vehicle at a store"
    roles: [StoreManager]
    code: 201
    input: ["vin", "make", "model", "model_year", "odometer_miles", "book_value_cents", "current_store_id"]
    output: Vehicle
    side_effects: ["lifecycle_status INTAKE, hold_status NONE, inventory_acquired_at := now"]
  - method: GET
    path: "/v1/vehicles"
    description: "List vehicles with filters (FK reverse-reachability for current_store_id)"
    roles: [PlatformAdmin, StoreManager, Appraiser, ReconditioningInspector, SalesAssociate, FinanceManager, AuctionManager, Customer]
    code: 200
    input: ["current_store_id?", "lifecycle_status?", "hold_status?", "limit?", "offset?"]
    output: "Vehicle[]"
    side_effects: []
  - method: GET
    path: "/v1/vehicles/{id}"
    description: "Get a vehicle (days_in_inventory recomputed on read)"
    roles: [PlatformAdmin, StoreManager, Appraiser, ReconditioningInspector, SalesAssociate, FinanceManager, AuctionManager, Customer]
    code: 200
    input: []
    output: Vehicle
    side_effects: []
  - method: POST
    path: "/v1/vehicles/{id}/list"
    description: "Move a RECON vehicle to RETAIL_LISTED with the initial no-haggle price"
    roles: [StoreManager]
    code: 200
    input: []
    output: Vehicle
    side_effects: ["PricingEvent INITIAL_LISTING", "current_list_price_cents set per algorithmic_repricing initial variant", "increments Vehicle.version by 1"]
  - method: POST
    path: "/v1/vehicles/{id}/pricing-events"
    description: "Apply one scheduled algorithmic markdown to a RETAIL_LISTED vehicle (OCC-guarded)"
    roles: [StoreManager]
    code: 201
    input: ["expected_vehicle_version"]
    output: PricingEvent
    side_effects: ["algorithmic_repricing markdown variant", "Vehicle.current_list_price_cents updated", "increments Vehicle.version by 1"]
  - method: GET
    path: "/v1/vehicles/{id}/pricing-events"
    description: "List pricing events for a vehicle (FK reverse-reachability)"
    roles: [PlatformAdmin, StoreManager, SalesAssociate]
    code: 200
    input: ["limit?", "offset?"]
    output: "PricingEvent[]"
    side_effects: []
  - method: GET
    path: "/v1/vehicles/{id}/appraisals"
    description: "List appraisals for a vehicle (FK reverse-reachability)"
    roles: [PlatformAdmin, StoreManager, Appraiser, SalesAssociate]
    code: 200
    input: ["limit?", "offset?"]
    output: "Appraisal[]"
    side_effects: []
  - method: GET
    path: "/v1/vehicles/{id}/inspections"
    description: "List inspections for a vehicle (FK reverse-reachability)"
    roles: [PlatformAdmin, StoreManager, ReconditioningInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: "ReconditioningInspection[]"
    side_effects: []
  - method: GET
    path: "/v1/inspections"
    description: "List inspections across stores (FK reverse-reachability for inspector_id)"
    roles: [PlatformAdmin, StoreManager]
    code: 200
    input: ["inspector_id?", "status?", "limit?", "offset?"]
    output: "ReconditioningInspection[]"
    side_effects: []
  - method: GET
    path: "/v1/vehicles/{id}/transfer-requests"
    description: "List transfer requests for a vehicle (FK reverse-reachability)"
    roles: [PlatformAdmin, StoreManager, SalesAssociate, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "TransferRequest[]"
    side_effects: []
  - method: GET
    path: "/v1/vehicles/{id}/auction-lots"
    description: "List auction lots for a vehicle (FK reverse-reachability)"
    roles: [PlatformAdmin, AuctionManager, StoreManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "AuctionLot[]"
    side_effects: []

  # --- Appraisal ---
  - method: POST
    path: "/v1/appraisals"
    description: "Create a standing appraisal offer for a vehicle in INTAKE"
    roles: [Appraiser]
    code: 201
    input: ["vehicle_id", "customer_id", "appraiser_id"]
    output: Appraisal
    side_effects: ["Vehicle INTAKE -> APPRAISED", "provisional_offer_cents computed (provisional variant)"]
  - method: GET
    path: "/v1/appraisals"
    description: "List appraisals (FK reverse-reachability for customer_id and appraiser_id)"
    roles: [PlatformAdmin, StoreManager, Appraiser, SalesAssociate]
    code: 200
    input: ["customer_id?", "appraiser_id?", "status?", "limit?", "offset?"]
    output: "Appraisal[]"
    side_effects: []
  - method: GET
    path: "/v1/appraisals/{id}"
    description: "Get an appraisal"
    roles: [PlatformAdmin, StoreManager, Appraiser, SalesAssociate, Customer]
    code: 200
    input: []
    output: Appraisal
    side_effects: []
  - method: POST
    path: "/v1/appraisals/{id}/void"
    description: "Void an ACTIVE standing offer"
    roles: [Appraiser, StoreManager]
    code: 200
    input: []
    output: Appraisal
    side_effects: ["status VOIDED"]

  # --- ReconditioningInspection / RepairLineItem ---
  - method: POST
    path: "/v1/vehicles/{id}/inspections"
    description: "Open a reconditioning inspection (APPRAISED or RETURNED vehicles)"
    roles: [ReconditioningInspector]
    code: 201
    input: ["inspector_id"]
    output: ReconditioningInspection
    side_effects: ["Vehicle APPRAISED|RETURNED -> IN_INSPECTION", "recon_cost_total_cents reset 0"]
  - method: GET
    path: "/v1/inspections/{id}"
    description: "Get an inspection"
    roles: [PlatformAdmin, StoreManager, ReconditioningInspector]
    code: 200
    input: []
    output: ReconditioningInspection
    side_effects: []
  - method: POST
    path: "/v1/inspections/{id}/line-items"
    description: "Add a repair line item to an OPEN inspection"
    roles: [ReconditioningInspector]
    code: 201
    input: ["category", "cost_cents"]
    output: RepairLineItem
    side_effects: ["estimated_repair_total_cents recomputed"]
  - method: GET
    path: "/v1/inspections/{id}/line-items"
    description: "List line items of an inspection (FK reverse-reachability)"
    roles: [PlatformAdmin, StoreManager, ReconditioningInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: "RepairLineItem[]"
    side_effects: []
  - method: POST
    path: "/v1/inspections/{id}/line-items/{id}/approve"
    description: "Approve a PROPOSED line item"
    roles: [ReconditioningInspector]
    code: 200
    input: []
    output: RepairLineItem
    side_effects: ["line_status APPROVED; estimated_repair_total_cents recomputed"]
  - method: POST
    path: "/v1/inspections/{id}/line-items/{id}/reject"
    description: "Reject a PROPOSED line item"
    roles: [ReconditioningInspector]
    code: 200
    input: []
    output: RepairLineItem
    side_effects: ["line_status REJECTED; estimated_repair_total_cents recomputed"]
  - method: POST
    path: "/v1/inspections/{id}/complete"
    description: "Complete an inspection; computes disposition and cascades to Vehicle and Appraisal"
    roles: [ReconditioningInspector]
    code: 200
    input: []
    output: ReconditioningInspection
    side_effects: ["reconditioning_disposition", "Vehicle -> RECON or WHOLESALE_PENDING", "Appraisal -> ACTIVE with final_offer_cents"]
  - method: POST
    path: "/v1/inspections/{id}/cancel"
    description: "Cancel an OPEN inspection (compensation: vehicle back to APPRAISED)"
    roles: [StoreManager]
    code: 200
    input: []
    output: ReconditioningInspection
    side_effects: ["Vehicle IN_INSPECTION -> APPRAISED"]

  # --- TransferRequest ---
  - method: POST
    path: "/v1/transfer-requests"
    description: "Customer requests shipment of a specific RETAIL_LISTED vehicle to another store (OCC-guarded)"
    roles: [Customer]
    code: 201
    input: ["vehicle_id", "customer_id", "to_store_id", "expedited?", "supersedes_request_id?", "expected_vehicle_version"]
    output: TransferRequest
    side_effects: ["shipping_fee_cents per transfer_shipping_fee", "Vehicle.hold_status := TRANSFER_HOLD", "increments Vehicle.version by 1", "from_store_id snapshot"]
  - method: GET
    path: "/v1/transfer-requests"
    description: "List transfer requests (FK reverse-reachability for customer_id, from_store_id, to_store_id, supersedes_request_id)"
    roles: [PlatformAdmin, StoreManager, SalesAssociate, Customer]
    code: 200
    input: ["customer_id?", "from_store_id?", "to_store_id?", "supersedes_request_id?", "status?", "limit?", "offset?"]
    output: "TransferRequest[]"
    side_effects: []
  - method: GET
    path: "/v1/transfer-requests/{id}"
    description: "Get a transfer request"
    roles: [PlatformAdmin, StoreManager, SalesAssociate, Customer]
    code: 200
    input: []
    output: TransferRequest
    side_effects: []
  - method: POST
    path: "/v1/transfer-requests/{id}/pay"
    description: "Customer pays the shipping fee"
    roles: [Customer]
    code: 200
    input: []
    output: TransferRequest
    side_effects: ["LedgerEntry TRANSFER_FEE at to_store"]
  - method: POST
    path: "/v1/transfer-requests/{id}/ship"
    description: "Origin store ships the vehicle"
    roles: [StoreManager]
    code: 200
    input: []
    output: TransferRequest
    side_effects: []
  - method: POST
    path: "/v1/transfer-requests/{id}/deliver"
    description: "Destination store receives the vehicle; hold period starts"
    roles: [StoreManager]
    code: 200
    input: []
    output: TransferRequest
    side_effects: ["Vehicle.current_store_id := to_store_id", "hold_expires_at set", "increments Vehicle.version by 1"]
  - method: POST
    path: "/v1/transfer-requests/{id}/cancel"
    description: "Customer cancels; refund depends on stage (full before ship, half in transit)"
    roles: [Customer]
    code: 200
    input: []
    output: TransferRequest
    side_effects: ["Vehicle.hold_status := NONE", "increments Vehicle.version by 1", "TRANSFER_FEE_REFUND ledger entries per stage"]

  # --- Sale ---
  - method: POST
    path: "/v1/sales"
    description: "Open a sale for a RETAIL_LISTED vehicle at its current store (no-haggle: price never client-supplied)"
    roles: [SalesAssociate]
    code: 201
    input: ["vehicle_id", "customer_id", "associate_id", "trade_in_appraisal_id?"]
    output: Sale
    side_effects: ["sale_price_cents snapshot from current list price; trade_in_credit_cents when appraisal attached; amount_due_cents computed"]
  - method: GET
    path: "/v1/sales"
    description: "List sales (FK reverse-reachability for vehicle_id, customer_id, associate_id, store_id)"
    roles: [PlatformAdmin, StoreManager, SalesAssociate, FinanceManager]
    code: 200
    input: ["vehicle_id?", "customer_id?", "associate_id?", "store_id?", "trade_in_appraisal_id?", "status?", "limit?", "offset?"]
    output: "Sale[]"
    side_effects: []
  - method: GET
    path: "/v1/sales/{id}"
    description: "Get a sale"
    roles: [PlatformAdmin, StoreManager, SalesAssociate, FinanceManager, Customer]
    code: 200
    input: []
    output: Sale
    side_effects: []
  - method: POST
    path: "/v1/sales/{id}/complete"
    description: "Complete a PENDING_FINANCE sale (cash or accepted financing); fires the full vehicle/appraisal/ledger cascade"
    roles: [SalesAssociate]
    code: 200
    input: []
    output: Sale
    side_effects: ["Vehicle -> SOLD", "trade-in Appraisal -> REDEEMED and trade-in vehicle -> INTAKE cascade", "SALE_REVENUE / TRADE_IN_PAYABLE / COMMISSION_ACCRUAL ledger entries", "transfer FULFILLED cascade when buyer is the transfer requester"]
  - method: POST
    path: "/v1/sales/{id}/cancel"
    description: "Cancel a pending sale"
    roles: [SalesAssociate]
    code: 200
    input: []
    output: Sale
    side_effects: ["FinancingApplication -> WITHDRAWN"]

  # --- Financing ---
  - method: POST
    path: "/v1/sales/{id}/financing-applications"
    description: "Submit a financing application; the full three-lender panel is presented at one time"
    roles: [FinanceManager]
    code: 201
    input: []
    output: FinancingApplication
    side_effects: ["financing_tier_scoring", "LenderOffer panel created (zero offers when DECLINED)"]
  - method: GET
    path: "/v1/sales/{id}/financing-applications"
    description: "List financing applications for a sale (FK reverse-reachability)"
    roles: [PlatformAdmin, StoreManager, FinanceManager, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "FinancingApplication[]"
    side_effects: []
  - method: GET
    path: "/v1/financing-applications"
    description: "List financing applications (FK reverse-reachability for customer_id)"
    roles: [PlatformAdmin, StoreManager, FinanceManager]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: "FinancingApplication[]"
    side_effects: []
  - method: GET
    path: "/v1/financing-applications/{id}"
    description: "Get a financing application"
    roles: [PlatformAdmin, StoreManager, FinanceManager, Customer]
    code: 200
    input: []
    output: FinancingApplication
    side_effects: []
  - method: GET
    path: "/v1/financing-applications/{id}/offers"
    description: "List lender offers of an application (FK reverse-reachability)"
    roles: [PlatformAdmin, StoreManager, FinanceManager, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "LenderOffer[]"
    side_effects: []
  - method: POST
    path: "/v1/financing-applications/{id}/accept"
    description: "Customer accepts one offer from the presented panel"
    roles: [Customer]
    code: 200
    input: ["lender_code"]
    output: FinancingApplication
    side_effects: ["chosen LenderOffer ACCEPTED; others SUPERSEDED"]
  - method: POST
    path: "/v1/financing-applications/{id}/withdraw"
    description: "Customer withdraws the application"
    roles: [Customer]
    code: 200
    input: []
    output: FinancingApplication
    side_effects: ["all PRESENTED offers SUPERSEDED"]

  # --- ReturnRequest ---
  - method: POST
    path: "/v1/returns"
    description: "Open a return against a COMPLETED sale"
    roles: [Customer]
    code: 201
    input: ["sale_id", "reason_code", "odometer_at_return"]
    output: ReturnRequest
    side_effects: []
  - method: GET
    path: "/v1/returns"
    description: "List returns (FK reverse-reachability for sale_id)"
    roles: [PlatformAdmin, StoreManager, Customer]
    code: 200
    input: ["sale_id?", "status?", "limit?", "offset?"]
    output: "ReturnRequest[]"
    side_effects: []
  - method: GET
    path: "/v1/returns/{id}"
    description: "Get a return"
    roles: [PlatformAdmin, StoreManager, Customer]
    code: 200
    input: []
    output: ReturnRequest
    side_effects: []
  - method: POST
    path: "/v1/returns/{id}/approve"
    description: "Approve an OPEN return"
    roles: [StoreManager]
    code: 200
    input: []
    output: ReturnRequest
    side_effects: []
  - method: POST
    path: "/v1/returns/{id}/reject"
    description: "Reject an OPEN return"
    roles: [StoreManager]
    code: 200
    input: []
    output: ReturnRequest
    side_effects: []
  - method: POST
    path: "/v1/returns/{id}/settle"
    description: "Settle an APPROVED return; executes the reversal waterfall and cascades"
    roles: [StoreManager]
    code: 200
    input: []
    output: ReturnRequest
    side_effects: ["return_reversal_waterfall", "Sale -> RETURNED", "Vehicle SOLD -> RETURNED with RETURN_REVIEW_HOLD", "trade-in Appraisal reactivation cascade"]

  # --- AuctionLot ---
  - method: POST
    path: "/v1/auction-lots"
    description: "List a WHOLESALE_PENDING vehicle at auction; also the relist path for UNSOLD vehicles"
    roles: [AuctionManager]
    code: 201
    input: ["vehicle_id"]
    output: AuctionLot
    side_effects: ["reserve_price_cents per auction_reserve_price variant", "Vehicle WHOLESALE_PENDING -> AT_AUCTION"]
  - method: GET
    path: "/v1/auction-lots"
    description: "List auction lots"
    roles: [PlatformAdmin, AuctionManager, StoreManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "AuctionLot[]"
    side_effects: []
  - method: GET
    path: "/v1/auction-lots/{id}"
    description: "Get an auction lot"
    roles: [PlatformAdmin, AuctionManager, StoreManager]
    code: 200
    input: []
    output: AuctionLot
    side_effects: []
  - method: POST
    path: "/v1/auction-lots/{id}/close"
    description: "Close a lot with a hammer price; >= reserve sells, < reserve unsolds"
    roles: [AuctionManager]
    code: 200
    input: ["hammer_price_cents"]
    output: AuctionLot
    side_effects: ["SOLD -> Vehicle DISPOSED + AUCTION_PROCEEDS entry; UNSOLD -> Vehicle back to WHOLESALE_PENDING"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_UNKNOWN_IDENTITY, http: 403, condition: "Entity-backed role's X-User-ID does not reference an existing backing entity" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_VALIDATION, http: 422, condition: "Field shape/uniqueness violation (duplicate VIN/store_code/email, non-positive amounts, to_store == from_store, negative odometer)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource's state machine forbids the transition from its current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_vehicle_version does not match Vehicle.version (OCC)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Inspector equals the sourcing appraiser, or finance approver equals the selling associate" }
  - { id: ERR_INSPECTION_ALREADY_OPEN, http: 409, condition: "An OPEN inspection already exists for the vehicle" }
  - { id: ERR_LINE_ITEMS_UNRESOLVED, http: 409, condition: "Inspection completion attempted with PROPOSED line items remaining" }
  - { id: ERR_VEHICLE_ALREADY_HELD, http: 409, condition: "Transfer request against a vehicle whose hold_status != NONE" }
  - { id: ERR_VEHICLE_NOT_LISTED, http: 409, condition: "Transfer/sale attempted against a vehicle not in RETAIL_LISTED" }
  - { id: ERR_VEHICLE_NO_LONGER_AVAILABLE, http: 409, condition: "Transfer pay attempted after the vehicle left RETAIL_LISTED" }
  - { id: ERR_APPRAISAL_EXPIRED, http: 409, condition: "Redemption at or after valid_until" }
  - { id: ERR_APPRAISAL_CUSTOMER_MISMATCH, http: 409, condition: "Trade-in appraisal belongs to a different customer than the buyer" }
  - { id: ERR_APPRAISAL_NOT_ACTIVE, http: 409, condition: "Trade-in appraisal not ACTIVE at sale creation" }
  - { id: ERR_RETURN_WINDOW_CLOSED, http: 409, condition: "Return opened more than RETURN_WINDOW_DAYS after Sale.completed_at" }
  - { id: ERR_FINANCING_NOT_ACCEPTED, http: 409, condition: "Sale completion attempted while its financing application is not ACCEPTED" }
  - { id: ERR_OFFER_NOT_PRESENTED, http: 409, condition: "Accept names a lender_code with no PRESENTED offer on the application" }
  - { id: ERR_FINANCING_DECLINED, http: 409, condition: "Accept attempted on an application whose tier is DECLINED" }
  - { id: ERR_AUCTION_ROUNDS_EXHAUSTED, http: 409, condition: "Relist attempted after 3 auction rounds" }
  - { id: ERR_HAMMER_BELOW_RESERVE_INVALID, http: 422, condition: "hammer_price_cents <= 0" }
  - { id: ERR_WINDOW_CLOSED, http: 409, condition: "Generic temporal-window violation (hold expiry, offer expiry) per priority 8" }
  - { id: ERR_CROSS_ENTITY_STATE, http: 409, condition: "Cross-entity referential precondition failed per priority 9" }
  - { id: ERR_AGGREGATE_RULE, http: 409, condition: "Aggregate/collection rule failed per priority 10" }
  - { id: ERR_FISCAL_RULE, http: 409, condition: "Fiscal rule failed per priority 11 (e.g., hammer < reserve handled as UNSOLD close; this error reserved for malformed fiscal input)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Bootstrap/operator role; owns stores, customers, associates, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /v1/stores"
      - "POST /v1/customers"
      - "POST /v1/associates"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: StoreManager
    description: "Runs one store: intake, listing, repricing, transfer ship/deliver, return adjudication, inspection cancel; entity-backed by Associate with role_kind MANAGER, and the manager's Associate.store_id pins which store-scoped actions (ship from from_store, deliver at to_store, settle returns of the store's sales) they may perform"
    identity: "entity_backed:Associate"
    exclusive_operations:
      - "POST /v1/vehicles"
      - "POST /v1/vehicles/{id}/list"
      - "POST /v1/vehicles/{id}/pricing-events"
      - "POST /v1/transfer-requests/{id}/ship"
      - "POST /v1/transfer-requests/{id}/deliver"
      - "POST /v1/returns/{id}/approve|reject|settle"
      - "POST /v1/inspections/{id}/cancel"
    shared_operations:
      - "GET endpoints per endpoint table"
      - "POST /v1/appraisals/{id}/void (shared with Appraiser)"
  - name: Appraiser
    description: "Issues standing appraisal offers; entity-backed by Associate with role_kind APPRAISER"
    identity: "entity_backed:Associate"
    exclusive_operations:
      - "POST /v1/appraisals"
    shared_operations:
      - "POST /v1/appraisals/{id}/void (shared with StoreManager)"
      - "GET endpoints per endpoint table"
  - name: ReconditioningInspector
    description: "Opens and completes inspections, manages repair line items; entity-backed by Associate with role_kind INSPECTOR; segregated from the vehicle's appraiser"
    identity: "entity_backed:Associate"
    exclusive_operations:
      - "POST /v1/vehicles/{id}/inspections"
      - "POST /v1/inspections/{id}/line-items*"
      - "POST /v1/inspections/{id}/complete"
    shared_operations:
      - "GET endpoints per endpoint table"
  - name: SalesAssociate
    description: "Opens and completes no-haggle sales; entity-backed by Associate with role_kind SALES"
    identity: "entity_backed:Associate"
    exclusive_operations:
      - "POST /v1/sales"
      - "POST /v1/sales/{id}/complete"
      - "POST /v1/sales/{id}/cancel"
    shared_operations:
      - "GET endpoints per endpoint table"
  - name: FinanceManager
    description: "Submits financing applications; entity-backed by Associate with role_kind FINANCE; segregated from the selling associate on the same sale"
    identity: "entity_backed:Associate"
    exclusive_operations:
      - "POST /v1/sales/{id}/financing-applications"
    shared_operations:
      - "GET endpoints per endpoint table"
      - "GET /v1/stores/{id}/ledger-entries"
  - name: AuctionManager
    description: "Runs wholesale disposition: creates and closes auction lots"
    identity: opaque
    exclusive_operations:
      - "POST /v1/auction-lots"
      - "POST /v1/auction-lots/{id}/close"
    shared_operations:
      - "GET endpoints per endpoint table"
  - name: Customer
    description: "Retail customer: pays for transfers, accepts financing, opens returns; entity-backed by CustomerAccount"
    identity: "entity_backed:CustomerAccount"
    exclusive_operations:
      - "POST /v1/transfer-requests"
      - "POST /v1/transfer-requests/{id}/pay"
      - "POST /v1/transfer-requests/{id}/cancel"
      - "POST /v1/financing-applications/{id}/accept"
      - "POST /v1/financing-applications/{id}/withdraw"
      - "POST /v1/returns"
    shared_operations:
      - "GET endpoints per endpoint table (own records)"
