  # ===================================================== 8. Cross-Cutting Complexity Layers
  - section: cross_cutting_layers
    instances:
      - name: occ_label_issue_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[label-issue-supersede-stale-order]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two sequential label issues: the first advances ReturnOrder.version; replaying the second with the pre-first version fails 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["COUNTER_DROP order (version 1 captured)"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: false, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-O1", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "so1@x.com", full_name: "S O1", postal_code: "30071" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: COUNTER_DROP, items: [ { sku: "O1", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_id: $.data.id, ro_v: $.data.version } }
          trigger:
            - { call: "POST /v1/return-orders/${ro_id}/labels", payload: { label_type: CARRIER_LABEL, expected_return_order_version: "${ro_v}" }, as: Shopper, as_user_id: "${sh_id}", captures: { lb1: $.data.id } }
            - { call: "POST /v1/return-orders/${ro_id}/labels", payload: { label_type: QR_CODE, expected_return_order_version: "${ro_v}" }, as: Shopper, as_user_id: "${sh_id}", captures: { err: $.data.error_id } }
          assert:
            - "lb1 issued (201)"
            - "err == ERR_STALE_VERSION (412) on the stale replay"

      - name: occ_method_change_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[method-change-stale-order]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Method change carrying the pre-label-issue version fails 412; with the fresh version it succeeds and voids the label (order back to INITIATED)."
        test_recipe:
          setup: ["COUNTER_DROP order with label issued (version now 2); stale version 1 captured at create"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: true, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-O2", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "so2@x.com", full_name: "S O2", postal_code: "30072" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: COUNTER_DROP, items: [ { sku: "O2", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_id: $.data.id, ro_v1: $.data.version } }
            - { call: "POST /v1/return-orders/${ro_id}/labels", payload: { label_type: CARRIER_LABEL, expected_return_order_version: "${ro_v1}" }, as: Shopper, as_user_id: "${sh_id}" }
          trigger:
            - { call: "PATCH /v1/return-orders/${ro_id}/method", payload: { method: HOME_PICKUP, expected_return_order_version: "${ro_v1}" }, as: Shopper, as_user_id: "${sh_id}", captures: { err: $.data.error_id } }
            - { call: "PATCH /v1/return-orders/${ro_id}/method", payload: { method: HOME_PICKUP, expected_return_order_version: "${ro_v1} + 1" }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_st: $.data.status, ro_m: $.data.method, ro_v3: $.data.version } }
          assert:
            - "err == ERR_STALE_VERSION (412) on the stale attempt"
            - "ro_st == INITIATED and ro_m == HOME_PICKUP after the fresh retry; ro_v3 == ro_v1 + 2"

      - name: occ_tote_membership_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[tote-membership-stale-tote]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Adding order2 with the tote version observed before order1's add fails 412; the manifest has moved on."
        test_recipe:
          setup: ["Tote (v captured); orders O1 and O2 dropped off at the tote's location"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: false, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-O3", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "so3@x.com", full_name: "S O3", postal_code: "30073" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations", payload: { name: "L-O3", kind: COUNTER, postal_code: "30074" }, as: PlatformAdmin, captures: { loc_id: $.data.id } }
            - { call: "POST /v1/dropoff-locations/${loc_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/carrier-routes", payload: { origin_location_id: "${loc_id}", destination_facility: "FAC-19", weight_capacity_grams: 100000 }, as: CarrierDispatcher, captures: { route_id: $.data.id } }
            - { call: "POST /v1/consolidation-totes", payload: { route_id: "${route_id}", location_id: "${loc_id}" }, as: LocationOperator, as_user_id: "${loc_id}", captures: { tote_id: $.data.id, tote_v: $.data.version } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: COUNTER_DROP, items: [ { sku: "O3A", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro1: $.data.id, ro1_v: $.data.version } }
            - { call: "POST /v1/return-orders/${ro1}/labels", payload: { label_type: CARRIER_LABEL, expected_return_order_version: "${ro1_v}" }, as: Shopper, as_user_id: "${sh_id}" }
            - { call: "POST /v1/return-orders/${ro1}/confirm-dropoff", payload: { location_id: "${loc_id}" }, as: LocationOperator, as_user_id: "${loc_id}" }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: COUNTER_DROP, items: [ { sku: "O3B", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro2: $.data.id, ro2_v: $.data.version } }
            - { call: "POST /v1/return-orders/${ro2}/labels", payload: { label_type: CARRIER_LABEL, expected_return_order_version: "${ro2_v}" }, as: Shopper, as_user_id: "${sh_id}" }
            - { call: "POST /v1/return-orders/${ro2}/confirm-dropoff", payload: { location_id: "${loc_id}" }, as: LocationOperator, as_user_id: "${loc_id}" }
          trigger:
            - { call: "POST /v1/consolidation-totes/${tote_id}/return-orders", payload: { return_order_id: "${ro1}", expected_tote_version: "${tote_v}" }, as: LocationOperator, as_user_id: "${loc_id}", captures: { tv2: $.data.version } }
            - { call: "POST /v1/consolidation-totes/${tote_id}/return-orders", payload: { return_order_id: "${ro2}", expected_tote_version: "${tote_v}" }, as: LocationOperator, as_user_id: "${loc_id}", captures: { err: $.data.error_id } }
            - { call: "POST /v1/consolidation-totes/${tote_id}/return-orders", payload: { return_order_id: "${ro2}", expected_tote_version: "${tv2}" }, as: LocationOperator, as_user_id: "${loc_id}", captures: { units: $.data.manifest_units } }
          assert:
            - "err == ERR_STALE_VERSION (412) for the stale add"
            - "units == 2 after the fresh retry"

      - name: occ_exception_resolve_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[exception-resolve-stale-case]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Resolve carrying the case version from before start-investigation fails 412; with the fresh version it resolves."
        test_recipe:
          setup: ["Order IN_TRANSIT; exception OPEN (version captured at creation)"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: true, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-O4", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "so4@x.com", full_name: "S O4", postal_code: "30074" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/courier-zones", payload: { zone_code: "ZO4", window_capacity: 10 }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: HOME_PICKUP, boxless: true, items: [ { sku: "O4", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /v1/pickup-appointments", payload: { return_order_id: "${ro_id}", zone_id: "${zone_id}", window_start: "2026-05-01T00:30:00Z", window_end: "2026-05-01T02:30:00Z" }, as: Shopper, as_user_id: "${sh_id}", captures: { ap: $.data.id } }
            - { call: "POST /v1/pickup-appointments/${ap}/start", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/pickup-appointments/${ap}/collect", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/exception-cases", payload: { return_order_id: "${ro_id}", kind: LOST_PARCEL, note: "occ" }, as: SupportAgent, as_user_id: "agent-a", captures: { ex_id: $.data.id, ex_v0: $.data.version } }
            - { call: "POST /v1/exception-cases/${ex_id}/start-investigation", payload: {}, as: SupportAgent, as_user_id: "agent-a", captures: { ex_v1: $.data.version } }
          trigger:
            - { call: "POST /v1/exception-cases/${ex_id}/resolve", payload: { resolution: APPROVED, expected_exception_case_version: "${ex_v0}" }, as: SupportAgent, as_user_id: "agent-b", captures: { err: $.data.error_id } }
            - { call: "POST /v1/exception-cases/${ex_id}/resolve", payload: { resolution: APPROVED, expected_exception_case_version: "${ex_v1}" }, as: SupportAgent, as_user_id: "agent-b", captures: { st: $.data.status } }
          assert:
            - "err == ERR_STALE_VERSION (412) for the stale resolve"
            - "st == RESOLVED_APPROVED for the fresh resolve"

      - name: scheduled_clock_default_and_label_issue_fields
        claim_type: scheduled_actions
        grounds: [calculations.label_expiry, entities.Label.fields.issued_at]
        distinguishing_aspect: "Before any set_current_utc call the logical clock is exactly 2026-05-01T00:00:00Z: a label issued at default time shows issued_at 2026-05-01T00:00:00Z and expires_at 2026-05-11T00:00:00Z."
        test_recipe:
          setup: ["COUNTER_DROP order; no clock manipulation anywhere in the chain"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: false, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /v1/subscription-plans/${plan_id}/publish", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/merchant-accounts", payload: { legal_name: "M-CK", plan_id: "${plan_id}" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /v1/merchant-accounts/${m_id}/billing-cycles", payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/shoppers", payload: { email: "sck@x.com", full_name: "S CK", postal_code: "30075" }, as: Shopper, captures: { sh_id: $.data.id } }
            - { call: "POST /v1/return-orders", payload: { shopper_id: "${sh_id}", merchant_id: "${m_id}", method: COUNTER_DROP, items: [ { sku: "CK", quantity: 1, unit_price_cents: 100, declared_condition: NEW, longest_side_cm: 10, weight_grams: 50 } ] }, as: Shopper, as_user_id: "${sh_id}", captures: { ro_id: $.data.id, ro_v: $.data.version } }
          trigger:
            - { call: "POST /v1/return-orders/${ro_id}/labels", payload: { label_type: CARRIER_LABEL, expected_return_order_version: "${ro_v}" }, as: Shopper, as_user_id: "${sh_id}", captures: { iss: $.data.issued_at, exp: $.data.expires_at } }
          assert:
            - "iss == \"2026-05-01T00:00:00Z\" (fixed default clock, not wall clock)"
            - "exp == \"2026-05-11T00:00:00Z\" (issued_at + 10 days)"

      - name: cascading_side_effects_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.SlotReservation.HELD_to_CONSUMED]
        excluded_because: { difficulty_instance: reservation_consume_three_link_cascade, rationale: "3-link cascade asserted end-to-end there; 4-link chains in sweep_expiry_four_link_cascade and exception_approve_damaged_depth4_cascade." }

      - name: dual_variant_layer_covered
        claim_type: dual_variant_calculation
        grounds: [calculations.billing_cycle_charge]
        excluded_because: { difficulty_instance: billing_preview_vs_close_inflight_divergence, rationale: "Both variants executed and asserted with literals there." }

  # ===================================================== 9. Consistency Model
  - section: consistency_model
    instances:
      - name: tote_add_response_reflects_manifest_immediately
        claim_type: immediate
        grounds: [complexity_profile, calculations.tote_manifest_totals]
        distinguishing_aspect: "The add response itself carries the recomputed manifest totals (no re-read needed): manifest_units/weight reflect the new member in the same 200 response."
        test_recipe:
          setup: ["Tote; one order (qty 2, weight 2x800) dropped off at the tote's location"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: CUSTOM, monthly_fee_cents: 100, included_returns: 100, overage_fee_cents: 10, pickup_enabled: false, boxless_enabled: true, oversize_enabled: true, free_returns: false, oversize_surcharge_cents: 0, pickup_fee_cents: 0 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
