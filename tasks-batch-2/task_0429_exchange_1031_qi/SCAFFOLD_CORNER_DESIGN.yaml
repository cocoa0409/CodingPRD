            - call: "POST /exchanges"
              payload: { exchanger_id: "${exr_id}", exchange_type: "FORWARD" }
              as: QICoordinator
              as_user_id: "coord-au"
              captures: { ex_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/relinquished-properties"
              payload: { address: "AU St", fair_market_value: 500000, selling_expenses: 30000, mortgage_payoff: 120000, adjusted_basis: 180000 }
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/close-relinquished"
              payload: {}
              as: QICoordinator
            - call: "GET /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
              captures: { tr_v: "$.data[0].version" }
            - call: "POST /disbursements"
              payload: { exchange_id: "${ex_id}", purpose: "QI_FEE", amount: 1500, expected_qualified_trust_version: "${tr_v}" }
              as: QICoordinator
              captures: { dis_id: $.data.id }
          trigger:
            - call: "POST /disbursements/${dis_id}/approve"
              payload: {}
              as: QICoordinator
              as_user_id: "coord-au"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"
            - "HTTP status == 403"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: exclusive_operation_denied
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request to POST /exchanges with no X-User-Role / X-User-ID headers returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /exchanges"
              payload: { exchanger_id: "00000000-0000-4000-8000-000000000000", exchange_type: "FORWARD" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"

      - name: segregation_of_duties_excluded_stub
        claim_type: exclusive_operation_denied
        grounds:
          - validations[priority=6]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / segregation_beats_fiscal_insufficient_funds
          rationale: "The segregation-of-duties denial (officer == coordinator) is asserted as the winning error of the named §1.8 priority-conflict instance."

  # =====================================================================
  # Cross-Cutting Complexity Layers
  # =====================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_trust_version_disbursement_create_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[disbursement-create-stale-trust]
          - entities.QualifiedTrust.fields.version
        distinguishing_aspect: "Creating a disbursement with expected_qualified_trust_version equal to the current trust version succeeds (201); the create itself does not bump trust.version (only approve/void do)."
        test_recipe:
          setup: ["FORWARD exchange closed; trust at its post-deposit version, no disbursements yet"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: QICoordinator
            - call: "POST /exchangers"
              payload: { legal_name: "OCC TP", taxpayer_id: "TP-OCC-1", email: "occ@x.com" }
              as: QICoordinator
              captures: { exr_id: $.data.id }
            - call: "POST /exchanges"
              payload: { exchanger_id: "${exr_id}", exchange_type: "FORWARD" }
              as: QICoordinator
              as_user_id: "coord-occ"
              captures: { ex_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/relinquished-properties"
              payload: { address: "OCC St", fair_market_value: 500000, selling_expenses: 30000, mortgage_payoff: 120000, adjusted_basis: 180000 }
              as: QICoordinator
            - call: "POST /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
              captures: { tr_id: $.data.id }
            - call: "POST /exchanges/${ex_id}/close-relinquished"
              payload: {}
              as: QICoordinator
            - call: "GET /exchanges/${ex_id}/trust"
              payload: {}
              as: QICoordinator
              captures: { tr_v: "$.data[0].version" }
          trigger:
            - call: "POST /disbursements"
              payload: { exchange_id: "${ex_id}", purpose: "QI_FEE", amount: 1500, expected_qualified_trust_version: "${tr_v}" }
              as: QICoordinator
              captures: { dis_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Disbursement.${dis_id}.settlement_status == REQUESTED"

      - name: occ_stale_trust_version_excluded_stub
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[disbursement-create-stale-trust]
          - errors[ERR_STALE_TRUST_VERSION]
        excluded_because:
          difficulty_instance: compensating_invariant / trust_funds_conserved_under_settle_void
          rationale: "The stale-trust-version 412 path is exercised by the errors-section instance stale_trust_version_on_disbursement_create; the OCC-success counterpart is covered here positively."

      - name: cascading_void_credit_restores_trust_balance
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Disbursement.SETTLED_to_VOIDED
          - entities.QualifiedTrust.fields.available_balance
        excluded_because:
          difficulty_instance: compensating_invariant / trust_funds_conserved_under_settle_void
          rationale: "The settle-then-void credit cascade and its conservation are fully asserted by the named §1.8 compensating-invariant instance."

