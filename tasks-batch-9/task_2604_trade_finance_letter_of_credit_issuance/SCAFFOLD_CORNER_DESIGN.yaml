          The applicant's kyc_status is PENDING, so approval is refused with 422
          ERR_APPLICANT_KYC_NOT_CLEARED even though every field of the credit is
          valid and the facility has ample headroom. The credit must stay in
          PENDING_CREDIT_APPROVAL with issued_by_user_id still null - no partial
          approval is recorded.
