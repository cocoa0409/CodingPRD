              payload: { weight_variant: "FINAL" }
              as: MethodologyStatistician
            - call: "GET /household-weights"
              payload: { processing_run_id: "${run80b_id}" }
              as: MethodologyStatistician
          assert:
            - "Trigger call 2: HTTP 200 with data.state == EDITED, data.invalidated_interval_count == 1, data.ascribed_interval_count == 0 (the ascription window is 0 minutes), data.outlier_household_count == 0 and data.contributing_household_count == 0"
            - "Trigger call 3: HTTP 409 with ${e80a} == ERR_NO_CONTRIBUTING_HOUSEHOLDS - every record in the window was invalidated, so there is nothing to project"
            - "Trigger call 4: data.state is STILL EDITED and data.total_weight_mass == 0 and data.projected_average_audience == 0 - the rejected weighting wrote nothing"
            - "Trigger call 7: HTTP 200 with data.state == EDITED, data.invalidated_interval_count == 0 and data.contributing_household_count == 1 - the neighbouring window's 90-minute record is under the 100-minute maximum"
            - "Trigger call 8: HTTP 200 with data.state == WEIGHTED, data.total_weight_mass == 100000.0000 and data.projected_average_audience == round_half_up(100000.0000 * 90 / 1440, 0) == round_half_up(6250.0, 0) == 6250"
            - "Trigger call 9: data.total_count == 1 with base_weight 100000.0000, usable_minutes 90, contribution 6250.00 and capped false - the same rule that blocked run A passes here, so it is a real data-dependent gate"

  # ===========================================================================
  # SECTION 5 - Endpoints (§1.5)
  #
  # Listing endpoints are exercised with every declared filter, with two filters
  # combined, and with limit/offset on top of a filter so that total_count is
  # proved to describe the FILTERED set. Action endpoints are exercised for the
  # side effects §1.5 declares for them.
  # ===========================================================================
  - section: endpoints
    instances:

      - name: quota_cell_listing_filters_by_market_status_and_boost_flag
        claim_type: standard_crud
        grounds:
          - endpoints[GET /quota-cells]
          - endpoints[GET /quota-cells/{quota_cell_id}]
        distinguishing_aspect: "quota_status and incentive_boost_active are two different projections of the same fill figure, so the boost filter must agree with the status filter without being the same predicate; limit/offset is layered on top of a filter to prove total_count counts the filtered set and not the table; and an unfiltered call spans both markets."
        test_recipe:
          setup:
            - "Market DMA-681 (rank 181) with three cells: cA (P18_34/MID/URBAN, target 1) which will be FILLED by one ACTIVE household, cB (P35_54/HIGH/SUBURBAN, target 4) and cC (P55_PLUS/LOW/RURAL, target 4), both left empty and therefore UNDER_TARGET with the boost armed. All three cells are created BEFORE the household so that the market posture is still OPEN when recruitment happens."
            - "An unrelated market DMA-682 (rank 182) with a single cell cF."
            - "One household in cA taken to ACTIVE with tuner MT-002086, so cA reaches fill 1.0000, quota_status FILLED and incentive_boost_active false."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Listing", market_code: "DMA-681", dma_rank: 181, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m81_id: "$.data.id" }
            - call: "POST /markets/${m81_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 1, base_incentive_cents: 1000 }
              as: PanelOperationsManager
              captures: { c81a_id: "$.data.id" }
            - call: "POST /markets/${m81_id}/quota-cells"
              payload: { age_band: "P35_54", income_band: "HIGH", geo_zone: "SUBURBAN", target_households: 4, base_incentive_cents: 1000 }
              as: PanelOperationsManager
              captures: { c81b_id: "$.data.id" }
            - call: "POST /markets/${m81_id}/quota-cells"
              payload: { age_band: "P55_PLUS", income_band: "LOW", geo_zone: "RURAL", target_households: 4, base_incentive_cents: 1000 }
              as: PanelOperationsManager
              captures: { c81c_id: "$.data.id" }
            - call: "POST /markets"
              payload: { name: "Metro Elsewhere", market_code: "DMA-682", dma_rank: 182, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m82_id: "$.data.id" }
            - call: "POST /markets/${m82_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 4, base_incentive_cents: 1000 }
              as: PanelOperationsManager
              captures: { c82f_id: "$.data.id" }
            - call: "POST /households"
              payload: { market_id: "${m81_id}", quota_cell_id: "${c81a_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 2 }
              as: PanelOperationsManager
              captures: { h81_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${h81_id}", meter_type: "TV_TUNER", serial_no: "MT-002086" }
              as: FieldTechnician
              captures: { mt81_id: "$.data.id" }
            - call: "POST /meters/${mt81_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /households/${h81_id}/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: FieldTechnician
          trigger:
            - call: "GET /quota-cells"
              payload: { market_id: "${m81_id}" }
              as: PanelOperationsManager
            - call: "GET /quota-cells"
              payload: { market_id: "${m81_id}", quota_status: "UNDER_TARGET" }
              as: PanelOperationsManager
            - call: "GET /quota-cells"
              payload: { market_id: "${m81_id}", incentive_boost_active: true }
              as: PanelOperationsManager
            - call: "GET /quota-cells"
              payload: { market_id: "${m81_id}", incentive_boost_active: false }
              as: PanelOperationsManager
            - call: "GET /quota-cells"
              payload: { market_id: "${m81_id}", quota_status: "UNDER_TARGET", limit: 1, offset: 0 }
              as: PanelOperationsManager
              captures: { page1_id: "$.data[0].id" }
            - call: "GET /quota-cells"
              payload: { market_id: "${m81_id}", quota_status: "UNDER_TARGET", limit: 1, offset: 1 }
              as: PanelOperationsManager
              captures: { page2_id: "$.data[0].id" }
            - call: "GET /quota-cells"
              payload: { market_id: "${m82_id}" }
              as: PanelOperationsManager
            - call: "GET /quota-cells"
              payload: {}
              as: AccreditationAuditor
            - call: "GET /quota-cells/${c81a_id}"
              payload: {}
              as: AccreditationAuditor
          assert:
            - "Trigger call 1: data.total_count == 3, has_more false, and every row's market_id == ${m81_id}"
            - "Trigger call 2: data.total_count == 2 with ids {${c81b_id}, ${c81c_id}}"
            - "Trigger call 3: data.total_count == 2 - the two UNDER_TARGET cells are exactly the ones with the boost armed"
            - "Trigger call 4: data.total_count == 1 with data[0].id == ${c81a_id} - filling the cell disarmed its boost, so the boolean filter is not a constant"
            - "Trigger call 5: len(data) == 1, data.total_count == 2 (the FILTERED size, not 3 and not 4) and data.has_more == true"
            - "Trigger call 6: len(data) == 1, data.has_more == false and ${page2_id} != ${page1_id} - the two pages are disjoint"
            - "Trigger call 7: data.total_count == 1 with data[0].id == ${c82f_id} - DMA-681's cells are not visible under the other market's filter"
            - "Trigger call 8: data.total_count == 4 - with no filter the listing spans both markets, so call 1's total_count really was scoped"
            - "Trigger call 9: data.id == ${c81a_id}, data.fill_rate == 1.0000, data.quota_status == FILLED, data.intab_count == 1, data.incentive_boost_active == false and data.reserved_incentive_cents == 0"

      - name: tuning_interval_listing_filters_by_meter_household_state_and_methodology
        claim_type: standard_crud
        grounds:
          - endpoints[GET /tuning-intervals]
          - endpoints[GET /tuning-intervals/{tuning_interval_id}]
          - calculations.household_compliance_rate.variants
        distinguishing_aspect: "One household holding two meters of DIFFERENT types separates the meter_id filter from the household_id filter, and the source_methodology filter from both. The un-run intervals also pin the pre-edit defaults (state RAW, usable_minutes 0, processing_run_id null, ascribed false) and the ROLLING_30 snapshot that POST /tuning-intervals refreshes."
        test_recipe:
          setup:
            - "CHAIN B with CODE DMA-683, RANK 183, T 4, B 1000, BUDGET 500000, PERSONS 2, SERIAL MT-002087, PLUS a second meter of type STREAMING_ROUTER (serial MT-002088) shipped and install-confirmed BEFORE the enumeration - shipping is only legal while the household is RECRUITED or INSTALL_SCHEDULED."
            - "The clock is then advanced to 2026-08-05T00:00:00Z and three RAW intervals are filed: T1 (tuner, 2026-08-03T01:00-02:00, WAAA, 60), T2 (tuner, 2026-08-04T01:00-02:00, WAAA, 60) and S1 (router, STREAMING_SDK, 2026-08-04T03:00-04:00, WCCC, 45)."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Records", market_code: "DMA-683", dma_rank: 183, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m83_id: "$.data.id" }
            - call: "POST /markets/${m83_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 4, base_incentive_cents: 1000 }
              as: PanelOperationsManager
              captures: { c83_id: "$.data.id" }
            - call: "POST /households"
              payload: { market_id: "${m83_id}", quota_cell_id: "${c83_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 2 }
