  # ===========================================================================
  # RULE 4 — transitive_cascade
  # Two chains of depth >= 3 fired by two DIFFERENT transitions:
  #   certification (CONSENSUS_REACHED -> CERTIFIED)  : depth 4
  #   withdrawal execution (APPROVED -> EXECUTED)     : depth 4, opposite sign
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: certification_cascades_deposit_then_cap_posture_then_briefing_staleness
        grounds:
          - state_machines.ForecastCycle.CONSENSUS_REACHED_to_CERTIFIED
          - state_machines.ReserveFund.ACCEPTING_to_AT_CAP
          - state_machines.RatingAgencyBriefing.PUBLISHED_to_STALE
          - calculations.reserve_deposit_amount
          - calculations.reserve_adequacy
        distinguishing_aspect: |
          One certify call propagates four levels deep, each level caused strictly by the previous
          one: certified_recurring_total_cents 1588916273 is written (L1), which owes the fund a
          21958137 deposit that exactly fills the 21958137 of headroom (L2), which drives
          deposit_posture ACCEPTING -> AT_CAP and coverage_ratio_bps 0 -> 20151 (L3), which in turn
          drives the already-PUBLISHED briefing to STALE with stale_reason RESERVE_BALANCE_CHANGED
          while its snapshot fields stay frozen at INSUFFICIENT / 0 (L4).
        test_recipe:
          setup:
            - "FY2027 cycle in CONSENSUS_REACHED with a RATIFIED round whose reconciled_total_cents is 1600916273 and one ACTIVE one-time item of 12000000."
            - "One GROWTH_ABOVE_TREND fund with opening_balance_cents 138133490, cap_pct_bps 1000, so cap_cents will be 160091627 and headroom will be exactly the deposit owed."
            - "One RatingAgencyBriefing on that fund, already PUBLISHED: no cycle is CERTIFIED yet, so its snapshot froze the fund's defaults — snapshot_adequacy_band INSUFFICIENT, snapshot_coverage_ratio_bps 0 — and fund.last_transaction_at is null, so the 48-hour publication blackout does not apply."
            - "Clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /revenue-sources"
              payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }
              as: ForecastDirector
              as_user_id: "dir-1"
              captures: { src_pit: $.data.id }
            - call: "POST /revenue-sources"
              payload: { name: "Capital Gains Tax", tax_type: "CAPITAL_GAINS", base_year_receipts_cents: 312345600, elasticity_employment_bps: 0, elasticity_wage_income_bps: 2075, elasticity_retail_bps: 0, elasticity_asset_bps: 8940, volatility_class: "HIGH" }
              as: ForecastDirector
              as_user_id: "dir-1"
