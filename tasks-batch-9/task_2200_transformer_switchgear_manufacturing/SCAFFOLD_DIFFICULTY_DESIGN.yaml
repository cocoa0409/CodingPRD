      - name: far_publish_six_hop_quarantine_chain_freezes_a_second_order_but_stops_at_probation_guard
        grounds:
          - state_machines.FailureAnalysisReport.DRAFT->PUBLISHED
          - state_machines.WarrantyClaim.ANALYSIS_IN_PROGRESS->WARRANTABLE
          - state_machines.LongLeadComponent.ACTIVE->QUARANTINED
          - state_machines.ComponentAllocation.RESERVED->RELEASED
          - state_machines.Supplier.APPROVED->PROBATION
          - calculations.supplier_quality_index
          - calculations.order_production_posture
        distinguishing_aspect: |
          One publish call walks five hops and stops at the sixth: the quarantine reaches a SECOND
          order that has no warranty claim of its own (its RESERVED allocation is released and its
          posture becomes FROZEN with the two-code set [COMPONENT_QUARANTINE, MATERIAL_INCOMPLETE]),
          while HOP 6 does not fire because the PROBATION guard reads quality_index_trailing (87.50,
          denominator floored at 8) and not quality_index_lifetime, which collapses to 0.00 on the
          very same single report.
        test_recipe:
          setup:
            - "Order A TX-CAS-0008 (POWER_TRANSFORMER, rated_kv 12, contract_value_cents 2000000) driven to fulfillment_status CLOSED with a COMPLETE CommissioningJob energized 2026-03-01T08:00:00Z, consuming 3 units of component BSH-C8."
