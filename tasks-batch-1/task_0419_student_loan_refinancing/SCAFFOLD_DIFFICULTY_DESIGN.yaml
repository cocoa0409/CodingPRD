scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dti_borrower_only_vs_with_cosigner
        grounds:
          - calculations.dti_computation
          - state_machines.Cosigner.INVITED_to_CONSENTED
          - entities.Application.fields.dti_ratio
        distinguishing_aspect: |
          dti_computation operates on the Application domain: borrower-only variant yields dti_ratio 0.4512;
          adding a CONSENTED Cosigner's income recomputes the SAME application's dti_ratio to 0.3008.
        test_recipe:
          setup:
            - "A FIXED 60-month PRIME rate grid cell exists (base 650 bps)."
            - "Borrower with annual_income_cents=4000000, fico_band=PRIME."
            - "Application requesting 8000000 cents, 60 months, FIXED; prequalified (borrower-only DTI computed)."
            - "Cosigner invited with cosigner_annual_income_cents=2000000."
          setup_api_calls:
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 60, min_fico_band: "NEAR_PRIME", base_apr_bps: 650, index_apr_bps: 0 }
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { email: "b1@x.com", full_name: "B One", annual_income_cents: 4000000, fico_band: "PRIME" }
              as: Borrower
              captures: { b1_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${b1_id}", requested_principal_cents: 8000000, requested_term_months: 60, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "${b1_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /applications/${app1_id}/prequalify"
              payload: {}
              as: Borrower
              as_user_id: "${b1_id}"
              captures: { dti_before: $.data.dti_ratio }
            - call: "POST /cosigners"
              payload: { application_id: "${app1_id}", cosigner_email: "c1@x.com", cosigner_annual_income_cents: 2000000 }
              as: Borrower
              as_user_id: "${b1_id}"
              captures: { cos1_id: $.data.id }
          trigger:
            - call: "POST /cosigners/${cos1_id}/consent"
              payload: {}
              as: Cosigner
              as_user_id: "${cos1_id}"
          assert:
            - "Application.${app1_id}.dti_ratio == 0.4512 before cosigner consent (borrower_only variant)"
            - "Application.${app1_id}.dti_ratio == 0.3008 after cosigner consent (with_cosigner variant)"

      - name: estimated_apr_vs_locked_apr_offer
        grounds:
          - calculations.estimated_apr
          - calculations.locked_apr
          - state_machines.Application.PREQUALIFIED_to_UNDER_REVIEW
          - entities.Offer.fields.locked_apr_bps
        distinguishing_aspect: |
          The Offer domain carries two divergent APRs for identical inputs: estimated_apr_bps == 800 at prequal,
          while locked_apr_bps == 775 after lock with autopay (a 25-bps delta), proving estimate-vs-final divergence
          on the Offer entity, distinct from the dti_computation variant which lives on Application.
        test_recipe:
          setup:
            - "A FIXED 120-month rate grid cell (min_fico_band NEAR_PRIME, base 650 bps) exists."
            - "Borrower fico_band=PRIME (soft pull -> NEAR_PRIME), member_tier NONE."
            - "Application prequalified; one Offer PRESENTED with estimated_apr_bps 800."
          setup_api_calls:
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 120, min_fico_band: "NEAR_PRIME", base_apr_bps: 650, index_apr_bps: 0 }
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { email: "b2@x.com", full_name: "B Two", annual_income_cents: 12000000, fico_band: "PRIME" }
              as: Borrower
              captures: { b2_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${b2_id}", requested_principal_cents: 5000000, requested_term_months: 120, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "${b2_id}"
              captures: { app2_id: $.data.id, app2_ver: $.data.version }
            - call: "POST /applications/${app2_id}/prequalify"
              payload: {}
              as: Borrower
              as_user_id: "${b2_id}"
            - call: "GET /offers"
              payload: { application_id: "${app2_id}" }
              as: Borrower
              as_user_id: "${b2_id}"
              captures: { offer2_id: "$.data[0].id", est_apr: "$.data[0].estimated_apr_bps", app2_ver2: "$.data[0].version"}
          trigger:
            - call: "POST /offers/${offer2_id}/lock"
              payload: { expected_application_version: "${app2_ver}", autopay_elected: true }
              as: Borrower
              as_user_id: "${b2_id}"
              captures: { locked_apr: $.data.locked_apr_bps }
          assert:
            - "Offer.${offer2_id}.estimated_apr_bps == 800"
            - "Offer.${offer2_id}.locked_apr_bps == 775 (autopay -25 from estimate)"
            - "Offer.${offer2_id}.estimated_apr_bps != Offer.${offer2_id}.locked_apr_bps"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: locked_apr_nested_discount_floor_clamp_mode_a
        grounds:
          - calculations.locked_apr
          - entities.Offer.fields.locked_apr_bps
          - state_machines.Application.PREQUALIFIED_to_UNDER_REVIEW
        distinguishing_aspect: |
          MODE (a): locked_apr nests three inputs (estimate, autopay flag, member tier) with a non-linear
          max(.., APR_FLOOR_BPS) clamp — estimated 200 bps minus 25-bps autopay would yield 175 bps, but the floor
          clamps it to 200 bps, a conditional branch that no purely additive formula reaches.
        test_recipe:
          setup:
            - "A FIXED 120-month rate grid cell (min_fico_band PRIME, base 150 bps) exists."
            - "Borrower fico_band=SUPER_PRIME (soft pull -> PRIME, surcharge 50), member_tier NONE."
            - "Application prequalified; Offer estimated_apr 200 bps (150 base + 50 PRIME surcharge)."
          setup_api_calls:
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 120, min_fico_band: "PRIME", base_apr_bps: 150, index_apr_bps: 0 }
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { email: "b3@x.com", full_name: "B Three", annual_income_cents: 30000000, fico_band: "SUPER_PRIME" }
              as: Borrower
              captures: { b3_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${b3_id}", requested_principal_cents: 5000000, requested_term_months: 120, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "${b3_id}"
              captures: { app3_id: $.data.id, app3_ver: $.data.version }
            - call: "POST /applications/${app3_id}/prequalify"
              payload: {}
              as: Borrower
              as_user_id: "${b3_id}"
            - call: "GET /offers"
              payload: { application_id: "${app3_id}" }
              as: Borrower
              as_user_id: "${b3_id}"
              captures: { offer3_id: "$.data[0].id", est3: "$.data[0].estimated_apr_bps"}
          trigger:
            - call: "POST /offers/${offer3_id}/lock"
              payload: { expected_application_version: "${app3_ver}", autopay_elected: true }
              as: Borrower
              as_user_id: "${b3_id}"
              captures: { locked3: $.data.locked_apr_bps }
          assert:
            - "Offer.${offer3_id}.estimated_apr_bps == 200 (150 base + 50 PRIME surcharge)"
            - "Offer.${offer3_id}.locked_apr_bps == 200 (200 -25 autopay = 175, clamped UP to APR_FLOOR_BPS 200)"
            - "locked_apr never below APR_FLOOR_BPS (200)"

      - name: interest_accrual_sum_then_round_mode_b
        grounds:
          - calculations.interest_accrual
          - calculations.payment_waterfall
          - state_machines.Loan.CURRENT_to_PAID_OFF
          - entities.Loan.fields.accrued_interest_cents
        distinguishing_aspect: |
          MODE (b): interest_accrual pins rounding ORDER as "sum-then-round" — principal*daily_rate*days is
          computed at full precision then round_half_up ONCE to 31849 cents for 30 days at 775 bps on 5,000,000;
          a round-per-day implementation drifts to a different cent total.
        test_recipe:
          setup:
            - "A funded Loan with principal_balance_cents=5000000, locked_apr_bps=775, last_accrual_at=2026-06-01T00:00:00Z, repayment_status CURRENT."
            - "Clock advanced 30 days to 2026-07-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 120, min_fico_band: "NEAR_PRIME", base_apr_bps: 650, index_apr_bps: 0 }
              as: PlatformAdmin
            - call: "POST /abs-pools"
              payload: { pool_code: "POOL-B", max_principal_cents: 20000000, min_fico_band: "SUBPRIME", allowed_rate_type: "ANY" }
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { email: "b4@x.com", full_name: "B Four", annual_income_cents: 12000000, fico_band: "PRIME" }
              as: Borrower
              captures: { b4_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${b4_id}", requested_principal_cents: 5000000, requested_term_months: 120, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "${b4_id}"
              captures: { app4_id: $.data.id, app4_ver: $.data.version }
            - call: "POST /applications/${app4_id}/prequalify"
              payload: {}
              as: Borrower
              as_user_id: "${b4_id}"
            - call: "GET /offers"
              payload: { application_id: "${app4_id}" }
              as: Borrower
              as_user_id: "${b4_id}"
              captures: { offer4_id: "$.data[0].id"}
            - call: "POST /offers/${offer4_id}/lock"
              payload: { expected_application_version: "${app4_ver}", autopay_elected: true }
              as: Borrower
              as_user_id: "${b4_id}"
            - call: "POST /applications/${app4_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /applications/${app4_id}/fund"
              payload: {}
              as: DisbursementOfficer
              as_user_id: "do-1"
              captures: { loan4_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /loans/${loan4_id}/payments"
              payload: { amount_cents: 31849, due_date: "2026-07-01T00:00:00Z" }
              as: ServicingAgent
              as_user_id: "sa-1"
              captures: { ip: $.data.interest_portion_cents, pp: $.data.principal_portion_cents }
          assert:
            - "Payment.interest_portion_cents == 31849 (sum-then-round accrual for 30 days at 775 bps on 5,000,000)"
            - "Payment.principal_portion_cents == 0 (entire payment consumed by interest)"
            - "Loan.${loan4_id}.accrued_interest_cents == 0 after payment"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: loan_parallel_repayment_and_release_dimensions
        grounds:
          - state_machines.Loan.CURRENT_to_FORBEARANCE
          - state_machines.Loan.PENDING_to_ELIGIBLE
          - entities.Loan.fields.repayment_status
          - entities.Loan.fields.cosigner_release_status
        distinguishing_aspect: |
          The Loan entity carries TWO independent parallel state dimensions: repayment_status and
          cosigner_release_status evolve on separate transition sets — placing a loan into FORBEARANCE
          leaves cosigner_release_status untouched, proving parallel (not linear) shape on Loan.
        test_recipe:
          setup:
            - "A funded Loan, repayment_status CURRENT, cosigner_release_status PENDING (CONSENTED cosigner present)."
          setup_api_calls:
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 120, min_fico_band: "NEAR_PRIME", base_apr_bps: 650, index_apr_bps: 0 }
              as: PlatformAdmin
            - call: "POST /abs-pools"
              payload: { pool_code: "POOL-R3", max_principal_cents: 20000000, min_fico_band: "SUBPRIME", allowed_rate_type: "ANY" }
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { email: "b5@x.com", full_name: "B Five", annual_income_cents: 12000000, fico_band: "PRIME" }
              as: Borrower
              captures: { b5_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${b5_id}", requested_principal_cents: 5000000, requested_term_months: 120, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "${b5_id}"
              captures: { app5_id: $.data.id, app5_ver: $.data.version }
            - call: "POST /cosigners"
              payload: { application_id: "${app5_id}", cosigner_email: "c5@x.com", cosigner_annual_income_cents: 4000000 }
              as: Borrower
              as_user_id: "${b5_id}"
              captures: { cos5_id: $.data.id }
            - call: "POST /cosigners/${cos5_id}/consent"
              payload: {}
              as: Cosigner
              as_user_id: "${cos5_id}"
            - call: "POST /applications/${app5_id}/prequalify"
              payload: {}
              as: Borrower
              as_user_id: "${b5_id}"
            - call: "GET /offers"
              payload: { application_id: "${app5_id}" }
              as: Borrower
              as_user_id: "${b5_id}"
              captures: { offer5_id: "$.data[0].id"}
            - call: "POST /offers/${offer5_id}/lock"
              payload: { expected_application_version: "${app5_ver}", autopay_elected: true }
              as: Borrower
              as_user_id: "${b5_id}"
            - call: "POST /applications/${app5_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw-2"
            - call: "POST /applications/${app5_id}/fund"
              payload: {}
              as: DisbursementOfficer
              as_user_id: "do-2"
              captures: { loan5_id: $.data.id }
          trigger:
            - call: "POST /loans/${loan5_id}/forbearance"
              payload: { reason_code: "JOB_LOSS", months_requested: 3 }
              as: ServicingAgent
              as_user_id: "sa-2"
          assert:
            - "Loan.${loan5_id}.repayment_status == FORBEARANCE after trigger"
            - "Loan.${loan5_id}.cosigner_release_status == PENDING (unchanged; parallel dimension untouched)"

      - name: cosigner_invited_consent_release_with_terminal_decline
        grounds:
          - state_machines.Cosigner.INVITED_to_CONSENTED
          - state_machines.Cosigner.INVITED_to_DECLINED
          - state_machines.Cosigner.CONSENTED_to_RELEASED
          - entities.Cosigner.fields.consent_status
        distinguishing_aspect: |
          The Cosigner entity branches from INVITED into two divergent outcomes (CONSENTED vs terminal DECLINED)
          with distinct side-effect sets — CONSENTED recomputes parent DTI while DECLINED does not — making the
          Cosigner machine branching, on a different entity than the parallel Loan machine.
        test_recipe:
          setup:
            - "An Application prequalified with a Cosigner INVITED."
          setup_api_calls:
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 60, min_fico_band: "NEAR_PRIME", base_apr_bps: 650, index_apr_bps: 0 }
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { email: "b6@x.com", full_name: "B Six", annual_income_cents: 4000000, fico_band: "PRIME" }
              as: Borrower
              captures: { b6_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${b6_id}", requested_principal_cents: 8000000, requested_term_months: 60, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "${b6_id}"
              captures: { app6_id: $.data.id }
            - call: "POST /applications/${app6_id}/prequalify"
              payload: {}
              as: Borrower
              as_user_id: "${b6_id}"
            - call: "POST /cosigners"
              payload: { application_id: "${app6_id}", cosigner_email: "c6@x.com", cosigner_annual_income_cents: 2000000 }
              as: Borrower
              as_user_id: "${b6_id}"
              captures: { cos6_id: $.data.id }
          trigger:
            - call: "POST /cosigners/${cos6_id}/decline"
              payload: {}
              as: Cosigner
              as_user_id: "${cos6_id}"
          assert:
            - "Cosigner.${cos6_id}.consent_status == DECLINED (terminal branch)"
            - "Application.${app6_id}.dti_ratio == 0.4512 (DECLINE did NOT recompute with cosigner income; still borrower_only)"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: fund_cascade_pool_loan_member_tier_depth3
        grounds:
          - state_machines.Application.UNDER_REVIEW_to_APPROVED
          - calculations.pool_capacity_check
          - entities.Loan.fields.abs_pool_id
          - entities.Borrower.fields.member_tier
        distinguishing_aspect: |
          Depth-3 cascade from POST /applications/{id}/fund: (1) pool_capacity_check selects an AbsPool and the
          fund action creates a Loan; (2) the Loan's creation drives pool.committed_principal_cents += principal;
          (3) the same fund action's chain upgrades borrower.member_tier NONE->SILVER — each link caused by the prior.
        test_recipe:
          setup:
            - "An APPROVED application with a LOCKED offer; an OPEN AbsPool eligible for the loan; borrower member_tier NONE."
          setup_api_calls:
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 120, min_fico_band: "NEAR_PRIME", base_apr_bps: 650, index_apr_bps: 0 }
              as: PlatformAdmin
            - call: "POST /abs-pools"
              payload: { pool_code: "POOL-C4", max_principal_cents: 6000000, min_fico_band: "SUBPRIME", allowed_rate_type: "ANY" }
              as: PlatformAdmin
              captures: { pool_c4_id: $.data.id }
            - call: "POST /borrowers"
              payload: { email: "b7@x.com", full_name: "B Seven", annual_income_cents: 12000000, fico_band: "PRIME" }
              as: Borrower
              captures: { b7_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${b7_id}", requested_principal_cents: 5000000, requested_term_months: 120, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "${b7_id}"
              captures: { app7_id: $.data.id, app7_ver: $.data.version }
            - call: "POST /applications/${app7_id}/prequalify"
              payload: {}
              as: Borrower
              as_user_id: "${b7_id}"
            - call: "GET /offers"
              payload: { application_id: "${app7_id}" }
              as: Borrower
              as_user_id: "${b7_id}"
              captures: { offer7_id: "$.data[0].id"}
            - call: "POST /offers/${offer7_id}/lock"
              payload: { expected_application_version: "${app7_ver}", autopay_elected: true }
              as: Borrower
              as_user_id: "${b7_id}"
            - call: "POST /applications/${app7_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw-3"
          trigger:
            - call: "POST /applications/${app7_id}/fund"
              payload: {}
              as: DisbursementOfficer
              as_user_id: "do-3"
              captures: { loan7_id: $.data.id, pool_tag: $.data.abs_pool_id }
          assert:
            - "Loan.${loan7_id}.abs_pool_id == ${pool_c4_id} (pool selected and tagged)"
            - "AbsPool.${pool_c4_id}.committed_principal_cents == 5000000 (link 2: += original principal)"
            - "Borrower.${b7_id}.member_tier == SILVER (link 3: NONE upgraded by fund chain)"

      - name: mark_delinquent_cascade_streak_release_depth2
        grounds:
          - state_machines.Loan.CURRENT_to_DELINQUENT
          - state_machines.Loan.PENDING_to_ELIGIBLE
          - entities.Cosigner.fields.on_time_streak
          - entities.Loan.fields.cosigner_release_status
        distinguishing_aspect: |
          Depth-2 cascade from POST /loans/{id}/mark-delinquent, a DIFFERENT trigger than fund: (1) the transition
          resets the CONSENTED Cosigner.on_time_streak to 0; (2) that reset itself forces cosigner_release_status
          ELIGIBLE -> PENDING — the second link caused by the streak reset, not directly by the delinquency mark.
        test_recipe:
          setup:
            - "A funded Loan with a CONSENTED cosigner; three on-time payments of 50,000 cents bring on_time_streak to 3 (== COSIGNER_RELEASE_STREAK), so cosigner_release_status == ELIGIBLE and repayment_status remains CURRENT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 120, min_fico_band: "NEAR_PRIME", base_apr_bps: 650, index_apr_bps: 0 }
              as: PlatformAdmin
            - call: "POST /abs-pools"
              payload: { pool_code: "POOL-C4B", max_principal_cents: 20000000, min_fico_band: "SUBPRIME", allowed_rate_type: "ANY" }
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { email: "b8@x.com", full_name: "B Eight", annual_income_cents: 30000000, fico_band: "PRIME" }
              as: Borrower
              captures: { b8_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${b8_id}", requested_principal_cents: 5000000, requested_term_months: 120, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "${b8_id}"
              captures: { app8_id: $.data.id, app8_ver: $.data.version }
            - call: "POST /cosigners"
              payload: { application_id: "${app8_id}", cosigner_email: "c8@x.com", cosigner_annual_income_cents: 6000000 }
              as: Borrower
              as_user_id: "${b8_id}"
              captures: { cos8_id: $.data.id }
            - call: "POST /cosigners/${cos8_id}/consent"
              payload: {}
              as: Cosigner
              as_user_id: "${cos8_id}"
            - call: "POST /applications/${app8_id}/prequalify"
              payload: {}
              as: Borrower
              as_user_id: "${b8_id}"
            - call: "GET /offers"
              payload: { application_id: "${app8_id}" }
              as: Borrower
              as_user_id: "${b8_id}"
              captures: { offer8_id: "$.data[0].id"}
            - call: "POST /offers/${offer8_id}/lock"
              payload: { expected_application_version: "${app8_ver}", autopay_elected: true }
              as: Borrower
              as_user_id: "${b8_id}"
            - call: "POST /applications/${app8_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw-4"
            - call: "POST /applications/${app8_id}/fund"
              payload: {}
              as: DisbursementOfficer
              as_user_id: "do-4"
              captures: { loan8_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
