      - name: review_refuses_a_stale_inquiry_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[draft-review-stale-inquiry]
          - endpoints[POST /response-drafts/{id}/review]
          - errors[ERR_STALE_INQUIRY_VERSION]
        distinguishing_aspect: "After a REQUEST_CHANGES round the inquiry has moved on twice, so replaying the earlier expected_inquiry_version on the resubmitted draft is refused with ERR_STALE_INQUIRY_VERSION (412) — the priority-7 OCC check answers before any draft-state check."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; posture OPEN."
            - "One institutional holder, one routed OTHER inquiry, one PUBLIC_DOMAIN draft by u_ira_1 submitted for review; the inquiry version is captured at that point."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /companies"
              payload: { ticker: "OCI", legal_name: "Inquiry Version Corp", shares_outstanding: 1000000 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { co_id: "$.data.id" }
            - call: "POST /contacts"
              payload: { company_id: "${co_id}", contact_type: "INSTITUTIONAL_HOLDER", display_name: "Inquiry Version Holder", email: "oci@funds.test", shares_held: 20000 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { c_id: "$.data.id" }
            - call: "POST /inquiries"
              payload: { company_id: "${co_id}", contact_id: "${c_id}", topic_category: "OTHER", subject: "A question reviewed twice." }
              as: IRAnalyst
              as_user_id: "u_ira_1"
              captures: { inq_id: "$.data.id" }
            - call: "POST /inquiries/${inq_id}/route"
              payload: {}
              as: IRAnalyst
              as_user_id: "u_ira_1"
            - call: "POST /response-drafts"
              payload: { inquiry_id: "${inq_id}", body_text: "First wording.", disclosure_class: "PUBLIC_DOMAIN" }
              as: IRAnalyst
              as_user_id: "u_ira_1"
              captures: { dr_id: "$.data.id" }
            - call: "POST /response-drafts/${dr_id}/submit-review"
              payload: {}
              as: IRAnalyst
              as_user_id: "u_ira_1"
            - call: "GET /inquiries/${inq_id}"
              payload: {}
              as: IRAnalyst
              as_user_id: "u_ira_1"
              captures: { v_old: "$.data.version" }
          trigger:
            - call: "POST /response-drafts/${dr_id}/review"
              payload: { decision: "REQUEST_CHANGES", expected_inquiry_version: "${v_old}", reviewer_note: "Please shorten it." }
              as: DisclosureOfficer
              as_user_id: "u_do_1"
            - call: "POST /response-drafts/${dr_id}/revise"
              payload: { body_text: "Second wording." }
              as: IRAnalyst
              as_user_id: "u_ira_1"
            - call: "POST /response-drafts/${dr_id}/submit-review"
              payload: {}
              as: IRAnalyst
              as_user_id: "u_ira_1"
            - call: "POST /response-drafts/${dr_id}/review"
              payload: { decision: "APPROVE", expected_inquiry_version: "${v_old}" }
              as: DisclosureOfficer
              as_user_id: "u_do_1"
            - call: "GET /inquiries/${inq_id}"
              payload: {}
              as: IRAnalyst
              as_user_id: "u_ira_1"
              captures: { v_new: "$.data.version" }
            - call: "POST /response-drafts/${dr_id}/review"
              payload: { decision: "APPROVE", expected_inquiry_version: "${v_new}" }
              as: DisclosureOfficer
              as_user_id: "u_do_1"
          assert:
            - "trigger step 1 responds HTTP 200 with status CHANGES_REQUESTED; the inquiry returns to DRAFTING"
            - "trigger step 4 responds HTTP 412 with $.data.error_id == ERR_STALE_INQUIRY_VERSION and the draft stays IN_REVIEW"
            - "${v_old} is 4 and ${v_new} is 6 — the REQUEST_CHANGES and the resubmission each advanced the inquiry"
            - "trigger step 6 responds HTTP 200 with status APPROVED and reviewer_user_id 'u_do_1'"

      - name: posture_is_fully_re_derived_not_latched
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.company_disclosure_posture
