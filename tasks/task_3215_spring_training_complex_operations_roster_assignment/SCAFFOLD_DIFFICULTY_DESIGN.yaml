            - "GameSchedule.${gm_hit}.game_schedule_status is unchanged at DRAFT"
            - "the clear publish succeeds because 07:00 is strictly after its session's 07:00 end only under the truncation rule — so it is also rejected with ERR_TEMPORAL_OVERLAP and stays DRAFT"
            - "GameSchedule.${gm_hit}.game_interval_start == 2026-02-12T07:00:00Z and game_interval_end == 2026-02-12T13:00:00Z"
            - "no GroupAssignment or pitch-count side effect fires on a rejected publish"

      - name: performed_physicals_collide_inside_the_clearance_buffer
        grounds:
          - validations[priority=15]
          - state_machines.Physical.transitions.SCHEDULED_to_PERFORMED
          - errors[ERR_PHYSICAL_DOUBLE_BOOKED]
        distinguishing_aspect: "Two PERFORMED physicals on the same player are compatible only once a whole 2-day clearance buffer separates them, so a second visit one day after the first is rejected while a second visit two days after the first succeeds — the buffer is applied to the player's examination intervals rather than to a hard resource calendar."
        test_recipe:
          setup:
            - "Logical clock at 2026-02-01T00:00:00Z. Two domestic players, each with a roster record, program profile and a sent-letter invitation."
            - "Player A holds a physical at 2026-01-10 plus a second at 2026-01-11; Player B holds a physical at 2026-01-10 plus a second at 2026-01-12."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Mesa Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 200 }
              as: PlatformAdmin
              captures: { cx: $.data.id }
            - call: "POST /camp-ops/players"
              payload: { full_name: "Collin Reyes", idp_number: "IDP-41401", position_code: "INF", acquisition_channel: "NRI_ASSIGNMENT", mlb_service_days: 0, minor_league_option_years_used: 1, home_country: "United States", home_complex_id: "${cx}" }
              as: RosterManager
              captures: { pa: $.data.id }
            - call: "POST /camp-ops/players"
              payload: { full_name: "Dorian Pike", idp_number: "IDP-41402", position_code: "INF", acquisition_channel: "NRI_ASSIGNMENT", mlb_service_days: 0, minor_league_option_years_used: 1, home_country: "United States", home_complex_id: "${cx}" }
              as: RosterManager
              captures: { pb: $.data.id }
            - call: "POST /camp-ops/players/${pa}/roster-record"
              payload: { player_id: "${pa}" }
              as: RosterManager
            - call: "POST /camp-ops/players/${pb}/roster-record"
              payload: { player_id: "${pb}" }
              as: RosterManager
            - call: "POST /camp-ops/players/${pa}/program-profile"
              payload: { player_id: "${pa}" }
              as: TeamPhysician
            - call: "POST /camp-ops/players/${pb}/program-profile"
              payload: { player_id: "${pb}" }
              as: TeamPhysician
            - call: "POST /camp-ops/players/${pa}/camp-invitations"
              payload: { player_id: "${pa}", invitation_kind: "CAMP_INVITEE" }
              as: TravelCoordinator
            - call: "POST /camp-ops/players/${pb}/camp-invitations"
              payload: { player_id: "${pb}", invitation_kind: "CAMP_INVITEE" }
              as: TravelCoordinator
            - call: "POST /camp-ops/players/${pa}/physicals"
              payload: { player_id: "${pa}", scheduled_visit_date: "2026-01-10T00:00:00Z" }
              as: TeamPhysician
              captures: { a1: $.data.id }
            - call: "POST /camp-ops/players/${pa}/physicals"
              payload: { player_id: "${pa}", scheduled_visit_date: "2026-01-11T00:00:00Z" }
              as: TeamPhysician
              captures: { a2: $.data.id }
            - call: "POST /camp-ops/players/${pb}/physicals"
              payload: { player_id: "${pb}", scheduled_visit_date: "2026-01-10T00:00:00Z" }
              as: TeamPhysician
              captures: { b1: $.data.id }
            - call: "POST /camp-ops/players/${pb}/physicals"
              payload: { player_id: "${pb}", scheduled_visit_date: "2026-01-12T00:00:00Z" }
              as: TeamPhysician
              captures: { b2: $.data.id }
          trigger:
            - call: "POST /camp-ops/physicals/${a1}/perform"
              payload: { physical_result: "PASSED" }
              as: TeamPhysician
            - call: "POST /camp-ops/physicals/${a2}/perform"
              payload: { physical_result: "PASSED" }
              as: TeamPhysician
              captures: { err: $.data.error_id }
            - call: "POST /camp-ops/physicals/${b1}/perform"
              payload: { physical_result: "PASSED" }
              as: TeamPhysician
            - call: "POST /camp-ops/physicals/${b2}/perform"
              payload: { physical_result: "PASSED" }
              as: TeamPhysician
          assert:
            - "Physical.${a1}.status == PERFORMED"
            - "the one-day-later perform on player A is rejected with status 409 and error_id ERR_PHYSICAL_DOUBLE_BOOKED"
            - "Physical.${a2}.status is unchanged at SCHEDULED"
            - "Physical.${b2}.status == PERFORMED because 2026-01-12 is a full 2-day clearance buffer after 2026-01-10"
            - "Player.${pa}.clearance_status == MEDICALS_COMPLETE and Player.${pb}.clearance_status == MEDICALS_COMPLETE"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: arrangement_confirm_then_revert_leaves_the_community_ledger_unchanged
        grounds:
          - state_machines.TravelArrangement.transitions.PLANNED_to_CONFIRMED
          - state_machines.TravelArrangement.transitions.CONFIRMED_to_PLANNED
          - calculations.TravelFundingSourceCalculation
          - calculations.TravelCostAllocation
        distinguishing_aspect: "Confirming then reverting a travel arrangement moves HostCommunityRecord.agreement_funded_cents from 0 to 49750 and back to exactly 0 while HostCommunityRecord.ticketing_revenue_cents and community_ledger_cents hold at 80000 across both actions, so the compensating pair conserves the community ledger rather than leaking the funding draw."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. One DEDICATED complex with an ACTIVE agreement (ticket_price 400, sellout 500) whose host community record has sold 200 tickets, putting ticketing_revenue_cents at 80000 and community_ledger_cents at 80000."
            - "One domestic pitcher with a sent-letter invitation."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Mesa Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 200 }
              as: PlatformAdmin
              captures: { cx: $.data.id }
            - call: "POST /camp-ops/community-agreements"
              payload: { complex_id: "${cx}", stadium_name: "Sloan Park", lease_start_date: "2026-01-01T00:00:00Z", lease_end_date: "2026-03-31T23:59:59Z", annual_rent_cents: 250000, sponsorship_minor_league_base_cents: 100000, sponsorship_major_league_base_cents: 250000, ticket_price_cents: 400, ticket_sellout_capacity: 500 }
              as: CommunityLiaison
              captures: { ag: $.data.id }
            - call: "POST /camp-ops/community-agreements/${ag}/activate"
              payload: {}
              as: CommunityLiaison
            - call: "POST /camp-ops/community-agreements/${ag}/host-community-record"
              payload: { agreement_id: "${ag}" }
              as: CommunityLiaison
              captures: { hcr: $.data.id }
            - call: "POST /camp-ops/host-community-records/${hcr}/open-ticketing"
              payload: {}
              as: CommunityLiaison
            - call: "POST /camp-ops/host-community-records/${hcr}/sell-tickets"
              payload: { quantity: 200 }
              as: CommunityLiaison
            - call: "POST /camp-ops/players"
              payload: { full_name: "Trevor Nakamura", idp_number: "IDP-41501", position_code: "P", acquisition_channel: "NRI_ASSIGNMENT", mlb_service_days: 0, minor_league_option_years_used: 1, home_country: "United States", home_complex_id: "${cx}" }
              as: RosterManager
              captures: { pl: $.data.id }
            - call: "POST /camp-ops/players/${pl}/roster-record"
              payload: { player_id: "${pl}" }
              as: RosterManager
            - call: "POST /camp-ops/players/${pl}/program-profile"
              payload: { player_id: "${pl}" }
              as: TeamPhysician
            - call: "POST /camp-ops/players/${pl}/camp-invitations"
              payload: { player_id: "${pl}", invitation_kind: "CAMP_INVITEE" }
              as: TravelCoordinator
              captures: { inv: $.data.id, inv_v: $.data.version }
            - call: "POST /camp-ops/players/${pl}/physicals"
              payload: { player_id: "${pl}", scheduled_visit_date: "2026-01-02T00:00:00Z" }
              as: TeamPhysician
              captures: { ph: $.data.id }
            - call: "POST /camp-ops/physicals/${ph}/perform"
              payload: { physical_result: "PASSED" }
              as: TeamPhysician
            - call: "POST /camp-ops/camp-invitations/${inv}/send-letter"
              payload: {}
              as: TravelCoordinator
          trigger:
            - call: "POST /camp-ops/camp-invitations/${inv}/travel-arrangement"
              payload: { camp_invitation_id: "${inv}", mode: "AIR", travel_radius_miles: 300, departure_at: "2026-01-20T00:00:00Z", travel_cost_cents: 50000, confirm: true, expected_invitation_version: "${inv_v}" }
              as: TravelCoordinator
              captures: { ta: $.data.id }
            - call: "GET /camp-ops/host-community-records/${hcr}/ledger"
              payload: {}
              as: CommunityLiaison
              captures: { after_confirm_funded: $.data.agreement_funded_cents, after_confirm_ledger: $.data.community_ledger_cents }
            - call: "POST /camp-ops/travel-arrangements/${ta}/revert"
              payload: {}
              as: TravelCoordinator
            - call: "GET /camp-ops/host-community-records/${hcr}/ledger"
              payload: {}
              as: CommunityLiaison
              captures: { after_revert_funded: $.data.agreement_funded_cents, after_revert_ledger: $.data.community_ledger_cents }
          assert:
            - "after confirm: HostCommunityRecord.${hcr}.agreement_funded_cents == 49750"
            - "after confirm: HostCommunityRecord.${hcr}.ticketing_revenue_cents == 80000 and community_ledger_cents == 80000"
            - "after revert: HostCommunityRecord.${hcr}.agreement_funded_cents == 0"
            - "after revert: HostCommunityRecord.${hcr}.community_ledger_cents == 80000, unchanged from before the confirm"
            - "TravelArrangement.${ta}.status == PLANNED and reimbursement_status == NOT_LIABLE"
            - "CommunityAgreement.${ag}.travel_liability_window_count == 0 after the revert"

