# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# task_3098_investment_research_ratings_managed_data_licensing
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: fund_company_create_defaults_and_round_trip
        claim_type: Creation
        grounds:
          - entities.FundCompany
          - endpoints.POST_/research/fund-companies
        distinguishing_aspect: "A company created with only legal_name returns 201 with company_status ACTIVE, commercial_relationship NONE, open_dispute_count 0, quality_score_bp 10000, version 1, and server-minted id/created_at/updated_at."
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z; empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ResearchOps
          trigger:
            - call: "POST /research/fund-companies"
              payload: { legal_name: "Roundtrip Row" }
              as: ResearchOps
              captures: { fc_id: $.data.id }
          assert:
            - "response status 201, response_type object"
            - "FundCompany.${fc_id}.company_status == ACTIVE and commercial_relationship == NONE"
            - "FundCompany.${fc_id}.open_dispute_count == 0 and quality_score_bp == 10000"
            - "FundCompany.${fc_id}.version == 1 and id is a bare UUID with no type prefix"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: fund_get_returns_stored_fields
        claim_type: Retrieval
        grounds:
          - entities.Fund
          - endpoints.GET_/research/funds/{id}
        distinguishing_aspect: "Every input field round-trips; category_id is null and category_assignment_revision 0 before any holdings ingestion."
        test_recipe:
          setup:
            - "FundCompany FCR ACTIVE; Fund FRD created with R5 null."
          setup_api_calls:
            - *c_clock
            - call: "POST /research/fund-companies"
              payload: { legal_name: "Retrieval Co", commercial_relationship: "NONE" }
              as: ResearchOps
              captures: { fcr_id: $.data.id }
            - call: "POST /research/funds"
              payload: { fund_company_id: "${fcr_id}", ticker: "RTF", inception_date: "2024-02-01", trailing_return_3y_bp: 4500, risk_score_bp: 1200 }
              as: ResearchOps
              captures: { frd_id: $.data.id }
          trigger:
            - call: "GET /research/funds/${frd_id}"
              payload: {}
              as: Analyst
              as_user_id: "analyst-reader"
          assert:
            - "response status 200"
            - "Fund.${frd_id}.ticker == \"RTF\" and trailing_return_3y_bp == 4500 and risk_score_bp == 1200"
            - "Fund.${frd_id}.trailing_return_5y_bp is null"
            - "Fund.${frd_id}.fund_status == ACTIVE and category_id is null and category_assignment_revision == 0"

      - name: funds_list_pagination_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/research/funds
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With 3 funds under one company, limit=2&offset=0 returns 2 rows, total_count 3, has_more true; offset=2 returns 1 row, has_more false — total_count spans the filtered set, not the page."
        test_recipe:
          setup:
            - "FundCompany FCP ACTIVE with three funds PG1, PG2, PG3."
          setup_api_calls:
            - *c_clock
            - call: "POST /research/fund-companies"
              payload: { legal_name: "Pagination Co", commercial_relationship: "NONE" }
              as: ResearchOps
              captures: { fcp_id: $.data.id }
            - call: "POST /research/funds"
              payload: { fund_company_id: "${fcp_id}", ticker: "PG1", inception_date: "2020-01-01", trailing_return_3y_bp: 1000, risk_score_bp: 1000 }
              as: ResearchOps
            - call: "POST /research/funds"
              payload: { fund_company_id: "${fcp_id}", ticker: "PG2", inception_date: "2020-01-01", trailing_return_3y_bp: 1000, risk_score_bp: 1000 }
              as: ResearchOps
            - call: "POST /research/funds"
              payload: { fund_company_id: "${fcp_id}", ticker: "PG3", inception_date: "2020-01-01", trailing_return_3y_bp: 1000, risk_score_bp: 1000 }
              as: ResearchOps
          trigger:
            - call: "GET /research/funds"
              payload: {}
              as: ResearchOps
          assert:
            - "GET /research/funds?fund_company_id=${fcp_id}&limit=2&offset=0 returns 2 rows with total_count 3 and has_more true"
            - "GET /research/funds?fund_company_id=${fcp_id}&limit=2&offset=2 returns 1 row with total_count 3 and has_more false"
            - "omitting limit applies the default of 10"

      - name: fund_company_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/research/fund-companies/{id}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "A well-formed UUID that does not exist yields 404 ERR_NOT_FOUND inside the standard error envelope."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /research/fund-companies/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ResearchOps
              captures: { e_nf: $.data.error_id }
          assert:
            - "response status 404 and e_nf == ERR_NOT_FOUND"
            - "response_type == error and meta.api_request_id present"

      - name: fund_create_missing_required_ticker_rejected
        claim_type: Required Fields
        grounds:
          - entities.Fund.fields.ticker
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Omitting required input ticker yields 400 ERR_VALIDATION; omitting optional trailing_return_5y_bp succeeds with null."
        test_recipe:
          setup:
            - "FundCompany FCQ ACTIVE."
          setup_api_calls:
            - *c_clock
            - call: "POST /research/fund-companies"
              payload: { legal_name: "Required Co", commercial_relationship: "NONE" }
              as: ResearchOps
              captures: { fcq_id: $.data.id }
          trigger:
            - call: "POST /research/funds"
              payload: { fund_company_id: "${fcq_id}", inception_date: "2020-01-01", trailing_return_3y_bp: 1000, risk_score_bp: 1000 }
              as: ResearchOps
              captures: { e_val: $.data.error_id }
          assert:
            - "response status 400 and e_val == ERR_VALIDATION"

      - name: holding_immutable_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.Holding
        distinguishing_aspect: "Holding has common_fields: false — it carries id and created_at only, has no version/updated_at, and no update or delete endpoint exists in §1.5."
        test_recipe:
          setup:
            - "FundCompany FCI ACTIVE; Fund FHI ACTIVE; one snapshot ingested."
          setup_api_calls:
            - *c_clock
            - call: "POST /research/fund-companies"
              payload: { legal_name: "Immutable Co", commercial_relationship: "NONE" }
              as: ResearchOps
              captures: { fci_id: $.data.id }
            - call: "POST /research/funds"
              payload: { fund_company_id: "${fci_id}", ticker: "IMF", inception_date: "2020-01-01", trailing_return_3y_bp: 1000, risk_score_bp: 1000 }
              as: ResearchOps
              captures: { fhi_id: $.data.id }
            - call: "POST /research/funds/${fhi_id}/holdings"
              payload: { as_of_date: "2026-08-31", holdings: [ { security_ticker: "IM1", asset_class: "BOND", sector: "FINANCE", weight_bp: 10000 } ] }
              as: ResearchOps
          trigger:
            - call: "GET /research/funds/${fhi_id}/holdings"
              payload: {}
              as: ResearchOps
          assert:
            - "each returned Holding row has id and created_at but no version field"
            - "no PUT/PATCH/DELETE endpoint exists for holdings rows in §1.5"

      - name: licensee_create_defaults
        claim_type: Defaults
        grounds:
          - entities.Licensee
        distinguishing_aspect: "Licensee created with only licensee_name gets licensee_status ACTIVE and arrears_cents 0."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /research/licensees"
              payload: { licensee_name: "Defaulty" }
              as: LicenseAdmin
              captures: { ld_id: $.data.id }
          assert:
            - "Licensee.${ld_id}.licensee_status == ACTIVE and arrears_cents == 0 and version == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: fund_liquidation_cascades_rating_withdrawal_and_index_stripping
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Fund.ACTIVE_to_LIQUIDATED
          - state_machines.Rating.transitions
        distinguishing_aspect: "Liquidating a fund WITHDRAWS its PROVISIONAL and PUBLISHED ratings and deletes its IndexConstituent rows from a DRAFT index; the index's constituent count drops accordingly."
        test_recipe:
          setup:
            - "FundCompany FCL ACTIVE; Fund FLQ ACTIVE; holdings ingested; Methodology QL EFFECTIVE; quantitative rating published; index IXL DRAFT with FLQ as its only constituent."
          setup_api_calls:
            - *c_clock
            - call: "POST /research/categories"
              payload: { category_code: "LQ_C", dominant_asset_class: "EQUITY", dominant_sector: "MIXED", min_weight_bp: 5000 }
              as: ResearchOps
            - call: "POST /research/fund-companies"
              payload: { legal_name: "Liquidating Co", commercial_relationship: "NONE" }
              as: ResearchOps
              captures: { fcl_id: $.data.id }
            - call: "POST /research/funds"
              payload: { fund_company_id: "${fcl_id}", ticker: "FLQ", inception_date: "2019-01-01", trailing_return_3y_bp: 8000, trailing_return_5y_bp: 8000, risk_score_bp: 2000 }
              as: ResearchOps
              captures: { flq_id: $.data.id }
            - call: "POST /research/funds/${flq_id}/holdings"
              payload: { as_of_date: "2026-08-31", holdings: [ { security_ticker: "LQ1", asset_class: "EQUITY", sector: "TECH", weight_bp: 10000 } ] }
              as: ResearchOps
            - call: "POST /research/methodologies"
              payload: { methodology_code: "QL1", methodology_kind: "QUANTITATIVE", version_number: 1, effective_from: "2026-01-01", weight_return_bp: 6000, weight_risk_bp: 4000, rating_ceilings: [7000, 5000, 3000, 1000] }
              as: ResearchOps
              captures: { mql_id: $.data.id }
            - call: "POST /research/methodologies/${mql_id}/activate"
              payload: {}
              as: ResearchOps
            - call: "POST /research/ratings/compute"
              payload: { fund_id: "${flq_id}", methodology_id: "${mql_id}" }
              as: ResearchOps
              captures: { rlq_id: $.data.id }
            - call: "POST /research/ratings/${rlq_id}/publish"
              payload: {}
              as: ResearchOps
            - call: "POST /research/indices"
              payload: { index_code: "IXL", methodology_id: "${mql_id}", max_constituents: 10, single_constituent_cap_bp: 5000 }
              as: LicenseAdmin
              captures: { ixl_id: $.data.id }
            - call: "POST /research/indices/${ixl_id}/constituents"
              payload: { fund_id: "${flq_id}", target_weight_bp: 4000 }
              as: LicenseAdmin
          trigger:
            - call: "POST /research/funds/${flq_id}/liquidate"
              payload: {}
              as: ResearchOps
          assert:
            - "Fund.${flq_id}.fund_status == LIQUIDATED"
            - "Rating.${rlq_id}.rating_status == WITHDRAWN"
            - "GET /research/indices/${ixl_id}/constituents returns an empty list (constituent row deleted)"

      - name: proposal_quorum_met_intermediate_state
        claim_type: Valid Transition
        grounds:
          - state_machines.RatingProposal.OPEN_to_QUORUM_MET
        distinguishing_aspect: "After exactly 3 votes with 2 approvals and 1 rejection the proposal auto-resolves APPROVED (not stuck at QUORUM_MET); after 3 votes with 1 approval and 2 abstentions it remains QUORUM_MET (approvals 2 required)."
        test_recipe:
          setup:
            - "Analyst rating on Fund FQM under methodology AQM EFFECTIVE; proposal PQ opened by analyst-lead."
          setup_api_calls:
            - *c_clock
            - call: "POST /research/fund-companies"
              payload: { legal_name: "Quorum Co", commercial_relationship: "NONE" }
              as: ResearchOps
              captures: { fcqm_id: $.data.id }
            - call: "POST /research/funds"
              payload: { fund_company_id: "${fcqm_id}", ticker: "FQMF", inception_date: "2020-01-01", trailing_return_3y_bp: 5000, trailing_return_5y_bp: 5000, risk_score_bp: 3000 }
              as: ResearchOps
              captures: { fqm_id: $.data.id }
            - call: "POST /research/methodologies"
              payload: { methodology_code: "AQM", methodology_kind: "ANALYST", version_number: 1, effective_from: "2026-01-01", weight_return_bp: 5000, weight_risk_bp: 5000, rating_ceilings: [8000, 6000, 4000, 2000] }
              as: ResearchOps
              captures: { maqm_id: $.data.id }
            - call: "POST /research/methodologies/${maqm_id}/activate"
              payload: {}
              as: ResearchOps
            - call: "POST /research/ratings"
              payload: { fund_id: "${fqm_id}", methodology_id: "${maqm_id}" }
              as: Analyst
              as_user_id: "analyst-lead"
              captures: { rqm_id: $.data.id }
            - call: "POST /research/ratings/${rqm_id}/proposals"
              payload: { proposed_grade: "SILVER" }
              as: Analyst
              as_user_id: "analyst-lead"
              captures: { pq_id: $.data.id }
          trigger:
            - call: "POST /research/proposals/${pq_id}/votes"
              payload: { vote: "APPROVE" }
              as: Analyst
              as_user_id: "voter-1"
            - call: "POST /research/proposals/${pq_id}/votes"
              payload: { vote: "ABSTAIN" }
              as: Analyst
              as_user_id: "voter-2"
            - call: "POST /research/proposals/${pq_id}/votes"
              payload: { vote: "ABSTAIN" }
              as: Analyst
              as_user_id: "voter-3"
          assert:
            - "RatingProposal.${pq_id}.proposal_status == QUORUM_MET (3 votes cast, but approvals == 1 < 2 so neither APPROVED nor REJECTED fires)"
            - "RatingProposal.${pq_id}.approvals == 1 and rejections == 0"
            - "Rating.${rqm_id}.rating_status == COMMITTEE_REVIEW (unchanged)"

      - name: publish_from_published_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Rating.PROVISIONAL_to_PUBLISHED
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "Publishing an already-PUBLISHED rating fails with ERR_INVALID_STATE_TRANSITION and fires no side effects (no new SUPERSEDED rows)."
        test_recipe:
          setup:
            - "Fund FPP with a published quantitative rating RPP."
          setup_api_calls:
            - *c_clock
            - call: "POST /research/categories"
              payload: { category_code: "PP_C", dominant_asset_class: "EQUITY", dominant_sector: "MIXED", min_weight_bp: 5000 }
              as: ResearchOps
            - call: "POST /research/fund-companies"
              payload: { legal_name: "Double Publish Co", commercial_relationship: "NONE" }
              as: ResearchOps
              captures: { fcpp_id: $.data.id }
            - call: "POST /research/funds"
              payload: { fund_company_id: "${fcpp_id}", ticker: "FPP", inception_date: "2019-01-01", trailing_return_3y_bp: 8000, trailing_return_5y_bp: 8000, risk_score_bp: 2000 }
              as: ResearchOps
              captures: { fpp_id: $.data.id }
            - call: "POST /research/funds/${fpp_id}/holdings"
              payload: { as_of_date: "2026-08-31", holdings: [ { security_ticker: "PP1", asset_class: "EQUITY", sector: "TECH", weight_bp: 10000 } ] }
              as: ResearchOps
            - call: "POST /research/methodologies"
              payload: { methodology_code: "QPP", methodology_kind: "QUANTITATIVE", version_number: 1, effective_from: "2026-01-01", weight_return_bp: 6000, weight_risk_bp: 4000, rating_ceilings: [7000, 5000, 3000, 1000] }
              as: ResearchOps
              captures: { mpp_id: $.data.id }
            - call: "POST /research/methodologies/${mpp_id}/activate"
              payload: {}
              as: ResearchOps
            - call: "POST /research/ratings/compute"
              payload: { fund_id: "${fpp_id}", methodology_id: "${mpp_id}" }
              as: ResearchOps
              captures: { rpp_id: $.data.id }
            - call: "POST /research/ratings/${rpp_id}/publish"
              payload: {}
              as: ResearchOps
          trigger:
            - call: "POST /research/ratings/${rpp_id}/publish"
              payload: {}
              as: ResearchOps
              captures: { e_pp: $.data.error_id }
          assert:
            - "response status 409 and e_pp == ERR_INVALID_STATE_TRANSITION"
            - "Rating.${rpp_id}.rating_status == PUBLISHED (unchanged)"

      - name: offboard_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.FundCompany
        distinguishing_aspect: "An OFFBOARDED company rejects suspend, reinstate, and offboard with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup:
            - "FundCompany FTO with its only fund liquidated, then offboarded."
          setup_api_calls:
            - *c_clock
            - call: "POST /research/fund-companies"
              payload: { legal_name: "Terminal Co", commercial_relationship: "NONE" }
              as: ResearchOps
              captures: { fto_id: $.data.id }
            - call: "POST /research/funds"
              payload: { fund_company_id: "${fto_id}", ticker: "TOF", inception_date: "2019-01-01", trailing_return_3y_bp: 1000, trailing_return_5y_bp: 1000, risk_score_bp: 1000 }
              as: ResearchOps
              captures: { tof_id: $.data.id }
            - call: "POST /research/funds/${tof_id}/liquidate"
              payload: {}
              as: ResearchOps
            - call: "POST /research/fund-companies/${fto_id}/offboard"
              payload: {}
              as: ResearchOps
          trigger:
            - call: "POST /research/fund-companies/${fto_id}/suspend"
              payload: {}
              as: ResearchOps
              captures: { e_to: $.data.error_id }
          assert:
            - "response status 409 and e_to == ERR_INVALID_STATE_TRANSITION"
            - "FundCompany.${fto_id}.company_status == OFFBOARDED"

      - name: rating_kind_mismatch_publish_on_analyst_rating
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Rating.PROVISIONAL_to_PUBLISHED
          - errors[ERR_RATING_KIND_MISMATCH]
        distinguishing_aspect: "Calling publish on an ANALYST-kind rating fails with ERR_RATING_KIND_MISMATCH (kind-specific precondition), distinct from generic invalid-state."
        test_recipe:
          setup:
            - "Analyst rating RKA PROVISIONAL on Fund FKA under methodology AKA EFFECTIVE."
          setup_api_calls:
            - *c_clock
            - call: "POST /research/fund-companies"
              payload: { legal_name: "Kind Co", commercial_relationship: "NONE" }
              as: ResearchOps
              captures: { fcka_id: $.data.id }
            - call: "POST /research/funds"
              payload: { fund_company_id: "${fcka_id}", ticker: "FKA", inception_date: "2020-01-01", trailing_return_3y_bp: 5000, trailing_return_5y_bp: 5000, risk_score_bp: 3000 }
              as: ResearchOps
              captures: { fka_id: $.data.id }
            - call: "POST /research/methodologies"
              payload: { methodology_code: "AKA", methodology_kind: "ANALYST", version_number: 1, effective_from: "2026-01-01", weight_return_bp: 5000, weight_risk_bp: 5000, rating_ceilings: [8000, 6000, 4000, 2000] }
              as: ResearchOps
              captures: { mka_id: $.data.id }
            - call: "POST /research/methodologies/${mka_id}/activate"
              payload: {}
              as: ResearchOps
            - call: "POST /research/ratings"
              payload: { fund_id: "${fka_id}", methodology_id: "${mka_id}" }
              as: Analyst
              as_user_id: "analyst-lead"
              captures: { rka_id: $.data.id }
          trigger:
            - call: "POST /research/ratings/${rka_id}/publish"
              payload: {}
              as: ResearchOps
              captures: { e_ka: $.data.error_id }
          assert:
            - "response status 409 and e_ka == ERR_RATING_KIND_MISMATCH"
            - "Rating.${rka_id}.rating_status == PROVISIONAL"

      - name: committee_approval_publishes_rating_with_grade_and_supersedes_prior
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Rating.COMMITTEE_REVIEW_to_PUBLISHED
          - state_machines.RatingProposal.transitions
        distinguishing_aspect: "On proposal APPROVED (2 approvals, 1 reject, 3 votes), the rating moves to PUBLISHED with analyst_grade copied from proposed_grade, and any previously PUBLISHED analyst rating on the same fund moves to SUPERSEDED."
        test_recipe:
          setup:
            - "Fund FCA with TWO analyst ratings under methodology ACA: R-old published via a first approved proposal (GOLD); R-new in COMMITTEE_REVIEW via proposal P2 (SILVER)."
          setup_api_calls:
            - *c_clock
            - call: "POST /research/fund-companies"
              payload: { legal_name: "Approve Co", commercial_relationship: "NONE" }
              as: ResearchOps
              captures: { fcca_id: $.data.id }
            - call: "POST /research/funds"
              payload: { fund_company_id: "${fcca_id}", ticker: "FCAF", inception_date: "2020-01-01", trailing_return_3y_bp: 5000, trailing_return_5y_bp: 5000, risk_score_bp: 3000 }
              as: ResearchOps
              captures: { fca_id: $.data.id }
            - call: "POST /research/methodologies"
              payload: { methodology_code: "ACA", methodology_kind: "ANALYST", version_number: 1, effective_from: "2026-01-01", weight_return_bp: 5000, weight_risk_bp: 5000, rating_ceilings: [8000, 6000, 4000, 2000] }
              as: ResearchOps
              captures: { maca_id: $.data.id }
            - call: "POST /research/methodologies/${maca_id}/activate"
              payload: {}
              as: ResearchOps
            - call: "POST /research/ratings"
              payload: { fund_id: "${fca_id}", methodology_id: "${maca_id}" }
              as: Analyst
              as_user_id: "analyst-lead"
              captures: { rold_id: $.data.id }
            - call: "POST /research/ratings/${rold_id}/proposals"
              payload: { proposed_grade: "GOLD" }
              as: Analyst
              as_user_id: "analyst-lead"
              captures: { pold_id: $.data.id }
            - call: "POST /research/proposals/${pold_id}/votes"
              payload: { vote: "APPROVE" }
              as: Analyst
              as_user_id: "voter-1"
            - call: "POST /research/proposals/${pold_id}/votes"
              payload: { vote: "APPROVE" }
              as: Analyst
              as_user_id: "voter-2"
            - call: "POST /research/proposals/${pold_id}/votes"
              payload: { vote: "REJECT" }
              as: Analyst
              as_user_id: "voter-3"
            - call: "POST /research/ratings"
              payload: { fund_id: "${fca_id}", methodology_id: "${maca_id}" }
              as: Analyst
              as_user_id: "analyst-lead"
              captures: { rnew_id: $.data.id }
            - call: "POST /research/ratings/${rnew_id}/proposals"
              payload: { proposed_grade: "SILVER" }
              as: Analyst
              as_user_id: "analyst-lead"
              captures: { pnew_id: $.data.id }
          trigger:
            - call: "POST /research/proposals/${pnew_id}/votes"
              payload: { vote: "APPROVE" }
              as: Analyst
              as_user_id: "voter-1"
            - call: "POST /research/proposals/${pnew_id}/votes"
              payload: { vote: "APPROVE" }
              as: Analyst
              as_user_id: "voter-2"
            - call: "POST /research/proposals/${pnew_id}/votes"
              payload: { vote: "REJECT" }
              as: Analyst
              as_user_id: "voter-3"
          assert:
            - "RatingProposal.${pnew_id}.proposal_status == APPROVED (2 approvals > 1 rejection after 3 votes)"
            - "Rating.${rnew_id}.rating_status == PUBLISHED and analyst_grade == SILVER"
