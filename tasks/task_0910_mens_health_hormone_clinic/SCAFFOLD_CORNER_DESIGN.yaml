# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe across §1.1–§1.7; §1.8 depth corners are emitted as stubs.
# =============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------------ Entities
  - section: entities
    instances:
      - name: create_clinician_returns_201_envelope_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Clinician
          - 'endpoints["POST /clinic/clinicians"]'
        distinguishing_aspect: "POST /clinic/clinicians with all required fields -> 201; response.data has server-minted id, created_at, version==1, and echoed inputs."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /clinic/clinicians", payload: { full_name: "Dr Corner", npi: "2000000001", dea_number: "CC1111111" }, as: ClinicAdmin, captures: { cid: "$.data.id", ver: "$.data.version" } }
          assert:
            - "http_status == 201"
            - "Clinician ${cid}.version == 1"
            - "Clinician ${cid}.full_name == Dr Corner"

      - name: patient_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds:
          - entities.Patient.fields.email
          - 'errors[ERR_VALIDATION]'
        distinguishing_aspect: "POST /clinic/patients omitting required email -> ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /clinic/patients", payload: { full_name: "No Email", date_of_birth: "1980-01-01", sex: "MALE" }, as: ClinicAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_VALIDATION"
            - "http_status == 400"

      - name: patient_invalid_sex_enum_returns_validation
        claim_type: Type Constraints
        grounds:
          - entities.Patient.fields.sex
          - 'errors[ERR_VALIDATION]'
        distinguishing_aspect: "POST /clinic/patients with sex outside {MALE, OTHER} -> ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /clinic/patients", payload: { full_name: "Bad Enum", date_of_birth: "1980-01-01", sex: "FEMALEISH", email: "x@x.com" }, as: ClinicAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_VALIDATION"
            - "http_status == 400"

      - name: membership_created_with_default_statuses_and_credits
        claim_type: Defaults
        grounds:
          - entities.Membership.fields.subscription_status
          - entities.Membership.fields.payment_status
          - entities.Membership.fields.lab_draw_credits_remaining
        distinguishing_aspect: "New membership starts subscription_status=TRIAL, payment_status=CURRENT, lab_draw_credits_remaining==plan.included_lab_draw_credits (4)."
        test_recipe:
          setup: ["Plan with included_lab_draw_credits=4 exists."]
          setup_api_calls:
            - { call: "POST /clinic/patients", payload: { full_name: "Def Pat", date_of_birth: "1980-01-01", sex: "MALE", email: "def@x.com" }, as: ClinicAdmin, captures: { patient_id: "$.data.id" } }
            - { call: "POST /clinic/membership-plans", payload: { tier: "PLUS", monthly_fee_cents: 9000, cycle_days: 30, included_refills_per_cycle: 4, included_lab_draw_credits: 4, refill_discount_pct: 0.25, titration_visit_fee_cents: 4500 }, as: ClinicAdmin, captures: { plan_cfg_id: "$.data.id" } }
          trigger:
            - { call: "POST /clinic/memberships", payload: { patient_id: "${patient_id}", plan_id: "${plan_cfg_id}" }, as: ClinicAdmin, captures: { membership_id: "$.data.id" } }
          assert:
            - "Membership ${membership_id}.subscription_status == TRIAL"
            - "Membership ${membership_id}.payment_status == CURRENT"
            - "Membership ${membership_id}.lab_draw_credits_remaining == 4"

  # ------------------------------------------------------------------ Retrieval / Not Found / FK
  - section: endpoints
    instances:
      - name: get_patient_not_found_returns_404
        claim_type: Not Found
        grounds:
          - 'endpoints["GET /clinic/patients/{id}"]'
          - 'errors[ERR_NOT_FOUND]'
        distinguishing_aspect: "GET /clinic/patients/{random-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /clinic/patients/00000000-0000-4000-8000-000000000000", payload: {}, as: ClinicAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "http_status == 404"

      - name: filter_lab_panels_by_patient_id_reverse_reachability
        claim_type: Listing
        grounds:
          - 'endpoints["GET /clinic/lab-panels"]'
          - entities.LabPanel.fields.patient_id
        distinguishing_aspect: "GET /clinic/lab-panels?patient_id=... returns the LabPanel[] for that patient (FK reverse reachability)."
        test_recipe:
          setup: ["One patient with one ordered LabPanel."]
          setup_api_calls:
            - { call: "POST /clinic/clinicians", payload: { full_name: "Dr L", npi: "2000000002", dea_number: "CC2222222" }, as: ClinicAdmin, captures: { clinician_id: "$.data.id" } }
            - { call: "POST /clinic/patients", payload: { full_name: "List Pat", date_of_birth: "1980-01-01", sex: "MALE", email: "lp@x.com" }, as: ClinicAdmin, captures: { patient_id: "$.data.id" } }
            - { call: "POST /clinic/lab-panels", payload: { patient_id: "${patient_id}", clinician_id: "${clinician_id}", panel_type: "BASELINE" }, as: Clinician, as_user_id: "${clinician_id}", captures: { panel_id: "$.data.id" } }
          trigger:
            - { call: "GET /clinic/lab-panels?patient_id=${patient_id}", payload: {}, as: ClinicAdmin, captures: { first_id: "$.data[0].id" } }
          assert:
            - "response.data is an array containing LabPanel ${panel_id}"
            - "total_count == 1"

      - name: create_membership_unknown_plan_id_returns_404
        claim_type: Not Found
        grounds:
          - 'endpoints["POST /clinic/memberships"]'
          - entities.Membership.fields.plan_id
          - 'errors[ERR_NOT_FOUND]'
        distinguishing_aspect: "POST /clinic/memberships referencing a non-existent plan_id -> ERR_NOT_FOUND (404) (FK integrity)."
        test_recipe:
          setup: ["One patient; no plan with the referenced id."]
          setup_api_calls:
            - { call: "POST /clinic/patients", payload: { full_name: "FK Pat", date_of_birth: "1980-01-01", sex: "MALE", email: "fk@x.com" }, as: ClinicAdmin, captures: { patient_id: "$.data.id" } }
          trigger:
            - { call: "POST /clinic/memberships", payload: { patient_id: "${patient_id}", plan_id: "00000000-0000-4000-8000-000000000abc" }, as: ClinicAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "http_status == 404"

  # ------------------------------------------------------------------ State machines
  - section: state_machines
    instances:
      - name: resume_from_active_plan_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.TreatmentPlan.MONITORING_HOLD_to_ACTIVE
          - 'errors[ERR_INVALID_STATE]'
        distinguishing_aspect: "POST /resume on an ACTIVE (not MONITORING_HOLD) plan -> ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["ACTIVE plan."]
          setup_api_calls:
            - { call: "POST /clinic/clinicians", payload: { full_name: "Dr R", npi: "2000000003", dea_number: "CC3333333" }, as: ClinicAdmin, captures: { clinician_id: "$.data.id" } }
            - { call: "POST /clinic/patients", payload: { full_name: "Res Pat", date_of_birth: "1980-01-01", sex: "MALE", email: "res@x.com" }, as: ClinicAdmin, captures: { patient_id: "$.data.id" } }
            - { call: "POST /clinic/membership-plans", payload: { tier: "PLUS", monthly_fee_cents: 9000, cycle_days: 30, included_refills_per_cycle: 4, included_lab_draw_credits: 4, refill_discount_pct: 0.25, titration_visit_fee_cents: 4500 }, as: ClinicAdmin, captures: { plan_cfg_id: "$.data.id" } }
            - { call: "POST /clinic/memberships", payload: { patient_id: "${patient_id}", plan_id: "${plan_cfg_id}" }, as: ClinicAdmin, captures: { membership_id: "$.data.id" } }
            - { call: "POST /clinic/memberships/${membership_id}/activate", payload: {}, as: ClinicAdmin }
            - { call: "POST /clinic/lab-panels", payload: { patient_id: "${patient_id}", clinician_id: "${clinician_id}", panel_type: "BASELINE" }, as: Clinician, as_user_id: "${clinician_id}", captures: { panel_id: "$.data.id" } }
            - { call: "POST /clinic/lab-panels/${panel_id}/draw", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/lab-panels/${panel_id}/result", payload: { total_testosterone_ng_dl: 320, psa_ng_ml: 1.2, hematocrit_pct: 45.0, drawn_at: "2026-04-20T09:00:00Z" }, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/lab-panels/${panel_id}/review", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/treatment-plans", payload: { patient_id: "${patient_id}", clinician_id: "${clinician_id}", baseline_panel_id: "${panel_id}", protocol_type: "TRT_INJECTION", starting_dose_mg: 100 }, as: Clinician, as_user_id: "${clinician_id}", captures: { plan_id: "$.data.id" } }
            - { call: "POST /clinic/treatment-plans/${plan_id}/activate", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
          trigger:
            - { call: "POST /clinic/treatment-plans/${plan_id}/resume", payload: {}, as: Clinician, as_user_id: "${clinician_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "http_status == 409"
            - "TreatmentPlan ${plan_id}.status == ACTIVE"

      - name: revoke_already_revoked_prescription_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ControlledSubstancePrescription.ISSUED_to_REVOKED
          - 'errors[ERR_INVALID_STATE]'
        distinguishing_aspect: "Second revoke on a REVOKED (terminal) prescription -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Prescription already REVOKED."]
          setup_api_calls:
            - { call: "POST /clinic/clinicians", payload: { full_name: "Dr V", npi: "2000000004", dea_number: "CC4444444" }, as: ClinicAdmin, captures: { clinician_id: "$.data.id" } }
            - { call: "POST /clinic/patients", payload: { full_name: "Rev Pat", date_of_birth: "1980-01-01", sex: "MALE", email: "rev@x.com" }, as: ClinicAdmin, captures: { patient_id: "$.data.id" } }
            - { call: "POST /clinic/membership-plans", payload: { tier: "PLUS", monthly_fee_cents: 9000, cycle_days: 30, included_refills_per_cycle: 4, included_lab_draw_credits: 4, refill_discount_pct: 0.25, titration_visit_fee_cents: 4500 }, as: ClinicAdmin, captures: { plan_cfg_id: "$.data.id" } }
            - { call: "POST /clinic/memberships", payload: { patient_id: "${patient_id}", plan_id: "${plan_cfg_id}" }, as: ClinicAdmin, captures: { membership_id: "$.data.id" } }
            - { call: "POST /clinic/memberships/${membership_id}/activate", payload: {}, as: ClinicAdmin }
            - { call: "POST /clinic/lab-panels", payload: { patient_id: "${patient_id}", clinician_id: "${clinician_id}", panel_type: "BASELINE" }, as: Clinician, as_user_id: "${clinician_id}", captures: { panel_id: "$.data.id" } }
            - { call: "POST /clinic/lab-panels/${panel_id}/draw", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/lab-panels/${panel_id}/result", payload: { total_testosterone_ng_dl: 320, psa_ng_ml: 1.2, hematocrit_pct: 45.0, drawn_at: "2026-04-20T09:00:00Z" }, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/lab-panels/${panel_id}/review", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/treatment-plans", payload: { patient_id: "${patient_id}", clinician_id: "${clinician_id}", baseline_panel_id: "${panel_id}", protocol_type: "TRT_INJECTION", starting_dose_mg: 100 }, as: Clinician, as_user_id: "${clinician_id}", captures: { plan_id: "$.data.id" } }
            - { call: "POST /clinic/treatment-plans/${plan_id}/activate", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/prescriptions", payload: { plan_id: "${plan_id}", patient_id: "${patient_id}", drug_name: "Testosterone Cypionate", unit_price_cents: 5000, quantity_per_fill: 8, refills_authorized: 3, is_controlled: true }, as: Clinician, as_user_id: "${clinician_id}", captures: { rx_id: "$.data.id" } }
            - { call: "POST /clinic/prescriptions/${rx_id}/revoke", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
          trigger:
            - { call: "POST /clinic/prescriptions/${rx_id}/revoke", payload: {}, as: Clinician, as_user_id: "${clinician_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: cancel_already_cancelled_membership_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Membership.ACTIVE_to_CANCELLED
          - 'errors[ERR_INVALID_STATE]'
        distinguishing_aspect: "Cancel on a CANCELLED membership -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Membership CANCELLED."]
          setup_api_calls:
            - { call: "POST /clinic/patients", payload: { full_name: "Can Pat", date_of_birth: "1980-01-01", sex: "MALE", email: "can@x.com" }, as: ClinicAdmin, captures: { patient_id: "$.data.id" } }
            - { call: "POST /clinic/membership-plans", payload: { tier: "CORE", monthly_fee_cents: 5000, cycle_days: 30, included_refills_per_cycle: 2, included_lab_draw_credits: 2, refill_discount_pct: 0.10, titration_visit_fee_cents: 5000 }, as: ClinicAdmin, captures: { plan_cfg_id: "$.data.id" } }
            - { call: "POST /clinic/memberships", payload: { patient_id: "${patient_id}", plan_id: "${plan_cfg_id}" }, as: ClinicAdmin, captures: { membership_id: "$.data.id" } }
            - { call: "POST /clinic/memberships/${membership_id}/cancel", payload: {}, as: ClinicAdmin }
          trigger:
            - { call: "POST /clinic/memberships/${membership_id}/cancel", payload: {}, as: ClinicAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "http_status == 409"

  # ------------------------------------------------------------------ Validations / Errors
  - section: validations
    instances:
      - name: activate_plan_with_trial_membership_returns_membership_not_active
        claim_type: violation_to_error
        grounds:
          - 'validations[priority=4.5]'
          - 'errors[ERR_MEMBERSHIP_NOT_ACTIVE]'
        distinguishing_aspect: "Plan activation while the patient's membership is still TRIAL (not activated) -> ERR_MEMBERSHIP_NOT_ACTIVE (409)."
        test_recipe:
          setup: ["Baseline panel REVIEWED, plan DRAFT, membership left in TRIAL (not activated)."]
          setup_api_calls:
            - { call: "POST /clinic/clinicians", payload: { full_name: "Dr M", npi: "2000000005", dea_number: "CC5555555" }, as: ClinicAdmin, captures: { clinician_id: "$.data.id" } }
            - { call: "POST /clinic/patients", payload: { full_name: "Mna Pat", date_of_birth: "1980-01-01", sex: "MALE", email: "mna@x.com" }, as: ClinicAdmin, captures: { patient_id: "$.data.id" } }
            - { call: "POST /clinic/membership-plans", payload: { tier: "PLUS", monthly_fee_cents: 9000, cycle_days: 30, included_refills_per_cycle: 4, included_lab_draw_credits: 4, refill_discount_pct: 0.25, titration_visit_fee_cents: 4500 }, as: ClinicAdmin, captures: { plan_cfg_id: "$.data.id" } }
            - { call: "POST /clinic/memberships", payload: { patient_id: "${patient_id}", plan_id: "${plan_cfg_id}" }, as: ClinicAdmin, captures: { membership_id: "$.data.id" } }
            - { call: "POST /clinic/lab-panels", payload: { patient_id: "${patient_id}", clinician_id: "${clinician_id}", panel_type: "BASELINE" }, as: Clinician, as_user_id: "${clinician_id}", captures: { panel_id: "$.data.id" } }
            - { call: "POST /clinic/lab-panels/${panel_id}/draw", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/lab-panels/${panel_id}/result", payload: { total_testosterone_ng_dl: 320, psa_ng_ml: 1.2, hematocrit_pct: 45.0, drawn_at: "2026-04-20T09:00:00Z" }, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/lab-panels/${panel_id}/review", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/treatment-plans", payload: { patient_id: "${patient_id}", clinician_id: "${clinician_id}", baseline_panel_id: "${panel_id}", protocol_type: "TRT_INJECTION", starting_dose_mg: 100 }, as: Clinician, as_user_id: "${clinician_id}", captures: { plan_id: "$.data.id" } }
          trigger:
            - { call: "POST /clinic/treatment-plans/${plan_id}/activate", payload: {}, as: Clinician, as_user_id: "${clinician_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_MEMBERSHIP_NOT_ACTIVE"
            - "http_status == 409"

      - name: refill_create_delinquent_membership_returns_delinquent
        claim_type: violation_to_error
        grounds:
          - 'validations[priority=8.0]'
          - 'errors[ERR_MEMBERSHIP_DELINQUENT]'
        distinguishing_aspect: "Refill create with ISSUED prescription but payment_status DELINQUENT (subscription ACTIVE) -> ERR_MEMBERSHIP_DELINQUENT (402); isolates the fiscal rule (no state conflict)."
        test_recipe:
          setup: ["ISSUED prescription; membership ACTIVE but payment DELINQUENT."]
          setup_api_calls:
            - { call: "POST /clinic/clinicians", payload: { full_name: "Dr D", npi: "2000000006", dea_number: "CC6666666" }, as: ClinicAdmin, captures: { clinician_id: "$.data.id" } }
            - { call: "POST /clinic/patients", payload: { full_name: "Del Pat", date_of_birth: "1980-01-01", sex: "MALE", email: "del@x.com" }, as: ClinicAdmin, captures: { patient_id: "$.data.id" } }
            - { call: "POST /clinic/membership-plans", payload: { tier: "PLUS", monthly_fee_cents: 9000, cycle_days: 30, included_refills_per_cycle: 4, included_lab_draw_credits: 4, refill_discount_pct: 0.25, titration_visit_fee_cents: 4500 }, as: ClinicAdmin, captures: { plan_cfg_id: "$.data.id" } }
            - { call: "POST /clinic/memberships", payload: { patient_id: "${patient_id}", plan_id: "${plan_cfg_id}" }, as: ClinicAdmin, captures: { membership_id: "$.data.id" } }
            - { call: "POST /clinic/memberships/${membership_id}/activate", payload: {}, as: ClinicAdmin }
            - { call: "POST /clinic/memberships/${membership_id}/record-payment", payload: { outcome: "FAILED" }, as: ClinicAdmin }
            - { call: "POST /clinic/lab-panels", payload: { patient_id: "${patient_id}", clinician_id: "${clinician_id}", panel_type: "BASELINE" }, as: Clinician, as_user_id: "${clinician_id}", captures: { panel_id: "$.data.id" } }
            - { call: "POST /clinic/lab-panels/${panel_id}/draw", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/lab-panels/${panel_id}/result", payload: { total_testosterone_ng_dl: 320, psa_ng_ml: 1.2, hematocrit_pct: 45.0, drawn_at: "2026-04-20T09:00:00Z" }, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/lab-panels/${panel_id}/review", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/treatment-plans", payload: { patient_id: "${patient_id}", clinician_id: "${clinician_id}", baseline_panel_id: "${panel_id}", protocol_type: "TRT_INJECTION", starting_dose_mg: 100 }, as: Clinician, as_user_id: "${clinician_id}", captures: { plan_id: "$.data.id" } }
            - { call: "POST /clinic/treatment-plans/${plan_id}/activate", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/prescriptions", payload: { plan_id: "${plan_id}", patient_id: "${patient_id}", drug_name: "Testosterone Cypionate", unit_price_cents: 5000, quantity_per_fill: 8, refills_authorized: 3, is_controlled: true }, as: Clinician, as_user_id: "${clinician_id}", captures: { rx_id: "$.data.id", rx_v: "$.data.version" } }
          trigger:
            - { call: "POST /clinic/refill-orders", payload: { prescription_id: "${rx_id}", membership_id: "${membership_id}", patient_id: "${patient_id}", requested_quantity_units: 8, expected_prescription_version: "${rx_v}" }, as: ClinicAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_MEMBERSHIP_DELINQUENT"
            - "http_status == 402"

      - name: book_lab_draw_with_zero_credits_returns_insufficient
        claim_type: violation_to_error
        grounds:
          - 'validations[priority=8.1]'
          - calculations.lab_draw_credit_ledger
          - 'errors[ERR_INSUFFICIENT_LAB_DRAW_CREDITS]'
        distinguishing_aspect: "Second lab-draw booking on a plan with included_lab_draw_credits=1 (credits already 0) -> ERR_INSUFFICIENT_LAB_DRAW_CREDITS (402); non-overlapping times so no capacity conflict."
        test_recipe:
          setup: ["Membership with included_lab_draw_credits=1; one appointment already booked (credits now 0); station capacity 5."]
          setup_api_calls:
            - { call: "POST /clinic/patients", payload: { full_name: "Cred Pat", date_of_birth: "1980-01-01", sex: "MALE", email: "cred@x.com" }, as: ClinicAdmin, captures: { patient_id: "$.data.id" } }
            - { call: "POST /clinic/membership-plans", payload: { tier: "CORE", monthly_fee_cents: 5000, cycle_days: 30, included_refills_per_cycle: 2, included_lab_draw_credits: 1, refill_discount_pct: 0.10, titration_visit_fee_cents: 5000 }, as: ClinicAdmin, captures: { plan_cfg_id: "$.data.id" } }
            - { call: "POST /clinic/memberships", payload: { patient_id: "${patient_id}", plan_id: "${plan_cfg_id}" }, as: ClinicAdmin, captures: { membership_id: "$.data.id" } }
            - { call: "POST /clinic/memberships/${membership_id}/activate", payload: {}, as: ClinicAdmin }
            - { call: "POST /clinic/draw-stations", payload: { name: "St 5", concurrent_capacity: 5 }, as: ClinicAdmin, captures: { station_id: "$.data.id" } }
            - { call: "POST /clinic/lab-draw-appointments", payload: { patient_id: "${patient_id}", draw_station_id: "${station_id}", start_at: "2026-05-05T09:00:00Z", end_at: "2026-05-05T09:30:00Z" }, as: ClinicAdmin, captures: { appt1_id: "$.data.id" } }
          trigger:
            - { call: "POST /clinic/lab-draw-appointments", payload: { patient_id: "${patient_id}", draw_station_id: "${station_id}", start_at: "2026-05-05T11:00:00Z", end_at: "2026-05-05T11:30:00Z" }, as: ClinicAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INSUFFICIENT_LAB_DRAW_CREDITS"
            - "http_status == 402"

      - name: dispense_exhausted_prescription_returns_no_refills_remaining
        claim_type: violation_to_error
        grounds:
          - 'validations[priority=9.0]'
          - state_machines.ControlledSubstancePrescription.ISSUED_to_EXHAUSTED
          - 'errors[ERR_NO_REFILLS_REMAINING]'
        distinguishing_aspect: "Two PENDING refills created while ISSUED (refills_authorized=1); dispensing the first EXHAUSTS the prescription; dispensing the second -> ERR_NO_REFILLS_REMAINING (409)."
        test_recipe:
          setup: ["ISSUED prescription refills_authorized=1; two PENDING refill orders; first dispensed."]
          setup_api_calls:
            - { call: "POST /clinic/clinicians", payload: { full_name: "Dr X", npi: "2000000007", dea_number: "CC7777777" }, as: ClinicAdmin, captures: { clinician_id: "$.data.id" } }
            - { call: "POST /clinic/pharmacists", payload: { full_name: "Ph X", license_number: "PH-7" }, as: ClinicAdmin, captures: { pharmacist_id: "$.data.id" } }
            - { call: "POST /clinic/patients", payload: { full_name: "Exh Pat", date_of_birth: "1980-01-01", sex: "MALE", email: "exh@x.com" }, as: ClinicAdmin, captures: { patient_id: "$.data.id" } }
            - { call: "POST /clinic/membership-plans", payload: { tier: "PLUS", monthly_fee_cents: 9000, cycle_days: 30, included_refills_per_cycle: 4, included_lab_draw_credits: 4, refill_discount_pct: 0.25, titration_visit_fee_cents: 4500 }, as: ClinicAdmin, captures: { plan_cfg_id: "$.data.id" } }
            - { call: "POST /clinic/memberships", payload: { patient_id: "${patient_id}", plan_id: "${plan_cfg_id}" }, as: ClinicAdmin, captures: { membership_id: "$.data.id" } }
            - { call: "POST /clinic/memberships/${membership_id}/activate", payload: {}, as: ClinicAdmin }
            - { call: "POST /clinic/lab-panels", payload: { patient_id: "${patient_id}", clinician_id: "${clinician_id}", panel_type: "BASELINE" }, as: Clinician, as_user_id: "${clinician_id}", captures: { panel_id: "$.data.id" } }
            - { call: "POST /clinic/lab-panels/${panel_id}/draw", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/lab-panels/${panel_id}/result", payload: { total_testosterone_ng_dl: 320, psa_ng_ml: 1.2, hematocrit_pct: 45.0, drawn_at: "2026-04-20T09:00:00Z" }, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/lab-panels/${panel_id}/review", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/treatment-plans", payload: { patient_id: "${patient_id}", clinician_id: "${clinician_id}", baseline_panel_id: "${panel_id}", protocol_type: "TRT_INJECTION", starting_dose_mg: 100 }, as: Clinician, as_user_id: "${clinician_id}", captures: { plan_id: "$.data.id" } }
            - { call: "POST /clinic/treatment-plans/${plan_id}/activate", payload: {}, as: Clinician, as_user_id: "${clinician_id}" }
            - { call: "POST /clinic/prescriptions", payload: { plan_id: "${plan_id}", patient_id: "${patient_id}", drug_name: "Testosterone Cypionate", unit_price_cents: 5000, quantity_per_fill: 8, refills_authorized: 1, is_controlled: true }, as: Clinician, as_user_id: "${clinician_id}", captures: { rx_id: "$.data.id", rx_v1: "$.data.version" } }
            - { call: "POST /clinic/refill-orders", payload: { prescription_id: "${rx_id}", membership_id: "${membership_id}", patient_id: "${patient_id}", requested_quantity_units: 8, expected_prescription_version: "${rx_v1}" }, as: ClinicAdmin, captures: { refill1_id: "$.data.id" } }
            - { call: "GET /clinic/prescriptions/${rx_id}", payload: {}, as: ClinicAdmin, captures: { rx_v2: "$.data.version" } }
            - { call: "POST /clinic/refill-orders", payload: { prescription_id: "${rx_id}", membership_id: "${membership_id}", patient_id: "${patient_id}", requested_quantity_units: 8, expected_prescription_version: "${rx_v2}" }, as: ClinicAdmin, captures: { refill2_id: "$.data.id" } }
            - { call: "POST /clinic/refill-orders/${refill1_id}/dispense", payload: { dispensed_quantity_units: 8 }, as: Pharmacist, as_user_id: "${pharmacist_id}" }
          trigger:
            - { call: "POST /clinic/refill-orders/${refill2_id}/dispense", payload: { dispensed_quantity_units: 8 }, as: Pharmacist, as_user_id: "${pharmacist_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_NO_REFILLS_REMAINING"
            - "http_status == 409"
            - "ControlledSubstancePrescription ${rx_id}.status == EXHAUSTED"

  # ------------------------------------------------------------------ RBAC
  - section: rbac
    instances:
      - name: patient_cannot_issue_prescription_forbidden
        claim_type: role_denied
        grounds:
          - roles.Patient
          - 'endpoints["POST /clinic/prescriptions"]'
          - 'errors[ERR_INSUFFICIENT_PERMISSIONS]'
        distinguishing_aspect: "Patient calling POST /clinic/prescriptions -> ERR_INSUFFICIENT_PERMISSIONS (403); only Clinician may prescribe."
        test_recipe:
          setup: ["A patient exists; no valid plan needed since authz fails first."]
          setup_api_calls:
            - { call: "POST /clinic/patients", payload: { full_name: "RB Pat", date_of_birth: "1980-01-01", sex: "MALE", email: "rb@x.com" }, as: ClinicAdmin, captures: { patient_id: "$.data.id" } }
          trigger:
            - { call: "POST /clinic/prescriptions", payload: { plan_id: "00000000-0000-4000-8000-0000000000p1", patient_id: "${patient_id}", drug_name: "X", unit_price_cents: 5000, quantity_per_fill: 8, refills_authorized: 1 }, as: Patient, as_user_id: "${patient_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "http_status == 403"

      - name: pharmacist_cannot_create_membership_plan_forbidden
        claim_type: role_denied
        grounds:
          - roles.Pharmacist
          - 'endpoints["POST /clinic/membership-plans"]'
          - 'errors[ERR_INSUFFICIENT_PERMISSIONS]'
        distinguishing_aspect: "Pharmacist calling POST /clinic/membership-plans -> ERR_INSUFFICIENT_PERMISSIONS (403)."
        test_recipe:
          setup: ["A pharmacist exists."]
          setup_api_calls:
            - { call: "POST /clinic/pharmacists", payload: { full_name: "Ph Z", license_number: "PH-Z" }, as: ClinicAdmin, captures: { pharmacist_id: "$.data.id" } }
          trigger:
            - { call: "POST /clinic/membership-plans", payload: { tier: "CORE", monthly_fee_cents: 5000, cycle_days: 30, included_refills_per_cycle: 2, included_lab_draw_credits: 2, refill_discount_pct: 0.10, titration_visit_fee_cents: 5000 }, as: Pharmacist, as_user_id: "${pharmacist_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "http_status == 403"

      - name: adverse_triage_by_plan_owner_returns_segregation
        claim_type: role_denied
        grounds:
          - 'validations[priority=5.3]'
          - 'errors[ERR_SEGREGATION_OF_DUTIES]'
        distinguishing_aspect: "Triage performed by the same clinician who owns the plan (X-User-ID == plan.clinician_id) -> ERR_SEGREGATION_OF_DUTIES (403)."
        test_recipe:
          setup: ["ACTIVE plan owned by clinician1; adverse event REPORTED; clinician1 attempts the triage."]
          setup_api_calls:
            - { call: "POST /clinic/clinicians", payload: { full_name: "Dr Own", npi: "2000000008", dea_number: "CC8888888" }, as: ClinicAdmin, captures: { clinician1_id: "$.data.id" } }
            - { call: "POST /clinic/patients", payload: { full_name: "Seg Pat", date_of_birth: "1980-01-01", sex: "MALE", email: "seg@x.com" }, as: ClinicAdmin, captures: { patient_id: "$.data.id" } }
            - { call: "POST /clinic/membership-plans", payload: { tier: "PLUS", monthly_fee_cents: 9000, cycle_days: 30, included_refills_per_cycle: 4, included_lab_draw_credits: 4, refill_discount_pct: 0.25, titration_visit_fee_cents: 4500 }, as: ClinicAdmin, captures: { plan_cfg_id: "$.data.id" } }
            - { call: "POST /clinic/memberships", payload: { patient_id: "${patient_id}", plan_id: "${plan_cfg_id}" }, as: ClinicAdmin, captures: { membership_id: "$.data.id" } }
            - { call: "POST /clinic/memberships/${membership_id}/activate", payload: {}, as: ClinicAdmin }
            - { call: "POST /clinic/lab-panels", payload: { patient_id: "${patient_id}", clinician_id: "${clinician1_id}", panel_type: "BASELINE" }, as: Clinician, as_user_id: "${clinician1_id}", captures: { panel_id: "$.data.id" } }
            - { call: "POST /clinic/lab-panels/${panel_id}/draw", payload: {}, as: Clinician, as_user_id: "${clinician1_id}" }
            - { call: "POST /clinic/lab-panels/${panel_id}/result", payload: { total_testosterone_ng_dl: 320, psa_ng_ml: 1.2, hematocrit_pct: 45.0, drawn_at: "2026-04-20T09:00:00Z" }, as: Clinician, as_user_id: "${clinician1_id}" }
            - { call: "POST /clinic/lab-panels/${panel_id}/review", payload: {}, as: Clinician, as_user_id: "${clinician1_id}" }
            - { call: "POST /clinic/treatment-plans", payload: { patient_id: "${patient_id}", clinician_id: "${clinician1_id}", baseline_panel_id: "${panel_id}", protocol_type: "TRT_INJECTION", starting_dose_mg: 100 }, as: Clinician, as_user_id: "${clinician1_id}", captures: { plan_id: "$.data.id" } }
            - { call: "POST /clinic/treatment-plans/${plan_id}/activate", payload: {}, as: Clinician, as_user_id: "${clinician1_id}" }
            - { call: "POST /clinic/adverse-events", payload: { patient_id: "${patient_id}", plan_id: "${plan_id}", description: "headache" }, as: Patient, as_user_id: "${patient_id}", captures: { ae_id: "$.data.id" } }
          trigger:
            - { call: "POST /clinic/adverse-events/${ae_id}/triage", payload: { severity: "MILD" }, as: Clinician, as_user_id: "${clinician1_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "http_status == 403"

