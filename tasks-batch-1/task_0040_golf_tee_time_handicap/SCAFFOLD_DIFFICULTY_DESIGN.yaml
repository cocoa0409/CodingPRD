          - entities.Golfer.fields.provisional_handicap_index
        distinguishing_aspect: |
          Empty/insufficient-set boundary on a different metric (score count) via POST scores:
          at exactly 2 POSTED scores provisional_handicap_index is NULL; the third POSTED score
