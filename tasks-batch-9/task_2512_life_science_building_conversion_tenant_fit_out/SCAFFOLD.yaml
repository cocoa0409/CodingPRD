  - { error_id: ERR_EXHAUST_CAPACITY_EXCEEDED, http_status: 409, message: "The requested lab exhaust exceeds the building's available capacity" }
  - { error_id: ERR_POWER_CAPACITY_EXCEEDED, http_status: 409, message: "The requested emergency power exceeds the building's available capacity" }
  - { error_id: ERR_INVALID_RESERVATION_STATE, http_status: 409, message: "The reservation's status does not permit this operation" }
  - { error_id: ERR_CONTROL_AREA_OUT_OF_RANGE, http_status: 422, message: "control_area_index exceeds the control areas allowed on this floor" }
  - { error_id: ERR_CONTROL_AREA_MAQ_EXCEEDED, http_status: 409, message: "The quantity exceeds the control area's maximum allowable quantity" }
  - { error_id: ERR_INVALID_PERMIT_DECISION, http_status: 409, message: "The permit's status does not permit this decision" }
  - { error_id: ERR_DECISION_REASON_REQUIRED, http_status: 422, message: "A decision_reason is required to deny or revoke a permit" }
  - { error_id: ERR_AMENITY_NOT_IN_BUILDING, http_status: 422, message: "The amenity belongs to a different building than the project" }
  - { error_id: ERR_AMENITY_CAPACITY_EXCEEDED, http_status: 409, message: "The amenity's concurrent capacity would be exceeded in the requested window" }
  - { error_id: ERR_INVALID_ALLOCATION_STATE, http_status: 409, message: "The allocation's status does not permit this operation" }
  - { error_id: ERR_SCRIPT_NOT_REQUIRED, http_status: 422, message: "This script is not required for the tenant's research type" }
  - { error_id: ERR_DUPLICATE_COMMISSIONING_SCRIPT, http_status: 409, message: "An open or passed record already exists for this script" }
  - { error_id: ERR_INVALID_COMMISSIONING_STATE, http_status: 409, message: "The commissioning record already has a result" }
  - { error_id: ERR_COMMISSIONING_INCOMPLETE, http_status: 409, message: "The project has not reached substantial completion" }
  - { error_id: ERR_WITNESS_CONFLICT, http_status: 403, message: "The technician who executed a script may not witness its result" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - role: LandlordAssetManager
    identity: "opaque - the X-Role header selects the role and the X-User-ID header carries an opaque operator id used only for segregation-of-duties comparisons. No entity backs this role."
    description: Landlord asset management. Owns the building record, conversion scope, leasing, TI money and phased delivery.
    exclusive_operations:
      - "POST /buildings"
      - "POST /buildings/{buildingId}/conversion-approval"
      - "POST /buildings/{buildingId}/conversion-scope-items"
      - "POST /buildings/{buildingId}/shared-amenities"
      - "POST /tenants"
      - "POST /leases"
      - "POST /suitability-assessments/{assessmentId}/decision"
      - "POST /leases/{leaseId}/execute"
      - "POST /leases/{leaseId}/ti-disbursements"
      - "POST /leases/{leaseId}/expiration-notice"
      - "POST /leases/{leaseId}/restoration-settlement"
      - "POST /fit-out-projects"
      - "POST /fit-out-projects/{projectId}/permit-application"
      - "POST /fit-out-projects/{projectId}/construction-milestone"
      - "POST /fit-out-projects/{projectId}/phase-packages"
      - "POST /phase-packages/{phaseId}/schedule"
      - "POST /phase-packages/{phaseId}/progress"
      - "POST /capacity-reservations"
      - "POST /capacity-reservations/{reservationId}/cancel"
      - "POST /amenity-allocations/{allocationId}/confirm"
    shared_operations:
      - "POST /leases/{leaseId}/ti-proposals (as the LANDLORD party)"
      - "POST /ti-proposals/{proposalId}/accept (only of a TENANT-authored proposal, and never by the author)"
      - "POST /leases/{leaseId}/escrow-deposits"
      - "POST /hazmat-permits"
      - "POST /amenity-allocations"
      - "POST /amenity-allocations/{allocationId}/cancel"
      - "all GET endpoints"
    forbidden_operations:
      - "POST /buildings/{buildingId}/floors (engineer only)"
      - "POST /buildings/{buildingId}/suitability-assessments and /submit (engineer only)"
      - "POST /conversion-scope-items/{itemId}/complete (engineer only)"
      - "POST /phase-packages/{phaseId}/hold (engineer only)"
      - "POST /fit-out-projects/{projectId}/permit-decision and POST /hazmat-permits/{permitId}/decision (AHJ only)"
      - "POST /fit-out-projects/{projectId}/commissioning-records and POST /commissioning-records/{recordId}/result (commissioning agent only)"
      - "POST /leases/{leaseId}/execute when the same X-User-ID authored or accepted the winning proposal"

  - role: BaseBuildingEngineer
    identity: "opaque - X-Role selects the role; X-User-ID is an opaque engineer id. No entity backs this role."
    description: Base-building engineer of record. Measures the plates, scores suitability, closes out conversion scope and stops work for vibration.
    exclusive_operations:
      - "POST /buildings/{buildingId}/floors"
      - "POST /buildings/{buildingId}/suitability-assessments"
      - "POST /suitability-assessments/{assessmentId}/submit"
      - "POST /conversion-scope-items/{itemId}/complete"
      - "POST /phase-packages/{phaseId}/hold"
    shared_operations:
      - "GET /floors/{floorId}/hazmat-utilization"
      - "all other GET endpoints except GET /tenants/{tenantId}"
    forbidden_operations:
      - "every POST owned exclusively by LandlordAssetManager, AHJPermitOfficer, Tenant or CommissioningAgent"
      - "POST /suitability-assessments/{assessmentId}/decision (the engineer may not accept their own score)"

  - role: Tenant
    identity: "entity_backed: Tenant - the X-Tenant-Id header carries a Tenant.id; X-User-ID carries the acting tenant representative. Requests are scoped to leases whose tenant_id equals X-Tenant-Id."
    description: Life science tenant. Negotiates the TI allowance, funds the restoration escrow, applies for hazardous material permits and books shared amenities.
    exclusive_operations: []
    shared_operations:
      - "POST /leases/{leaseId}/ti-proposals (as the TENANT party)"
      - "POST /ti-proposals/{proposalId}/accept (only of a LANDLORD-authored proposal)"
      - "POST /leases/{leaseId}/escrow-deposits"
      - "POST /hazmat-permits"
      - "POST /amenity-allocations"
      - "POST /amenity-allocations/{allocationId}/cancel (own projects only)"
      - "GET endpoints scoped to the tenant's own leases, projects, phases, permits and allocations"
    forbidden_operations:
      - "every landlord-, engineer-, AHJ- and commissioning-exclusive POST"
      - "POST /amenity-allocations/{allocationId}/confirm (landlord programs the amenity)"
      - "any read or write touching another tenant's lease, project, permit or allocation"

  - role: AHJPermitOfficer
    identity: "opaque - X-Role selects the role; X-User-ID is an opaque permit officer id. No entity backs this role."
    description: Authority having jurisdiction. Issues construction permits and rules on hazardous material use against floor-wide control-area limits.
    exclusive_operations:
      - "POST /fit-out-projects/{projectId}/permit-decision"
      - "POST /hazmat-permits/{permitId}/decision"
    shared_operations:
      - "GET /floors/{floorId}/hazmat-utilization"
      - "GET endpoints for buildings, floors, assessments, scope items, projects, permits and commissioning records"
    forbidden_operations:
      - "every landlord-, engineer-, tenant- and commissioning-exclusive POST"
      - "POST /hazmat-permits (the AHJ never applies on a tenant's behalf)"

  - role: CommissioningAgent
    identity: "opaque - X-Role selects the role; X-User-ID is the opaque agent id compared against CommissioningRecord.executed_by_user_id for segregation of duties."
    description: Independent commissioning and validation agent. Schedules and reports validation scripts; a passing final script accepts the project.
    exclusive_operations:
      - "POST /fit-out-projects/{projectId}/commissioning-records"
      - "POST /commissioning-records/{recordId}/result"
    shared_operations:
      - "GET /fit-out-projects/{projectId}, GET /fit-out-projects, GET /phase-packages, GET /commissioning-records/{recordId}, GET /leases/{leaseId}, GET /tenants/{tenantId}"
    forbidden_operations:
      - "every landlord-, engineer-, tenant- and AHJ-exclusive POST"
      - "POST /commissioning-records/{recordId}/result with witnessed_by_user_id equal to the record's executed_by_user_id"

