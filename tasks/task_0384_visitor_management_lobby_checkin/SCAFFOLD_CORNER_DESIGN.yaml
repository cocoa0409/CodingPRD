            - "Visit.${v_b_id}.status == CLEARED"

      - name: occ_stale_visit_version_on_clearance
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[clearance-stale-visit]", "errors[ERR_STALE_VISIT_VERSION]"]
        distinguishing_aspect: "Clearance carrying a Visit version one behind current (after a re-screen advanced it) → ERR_STALE_VISIT_VERSION (412)."
        test_recipe:
          setup:
            - "A Site, Floor, Host; a COMPANY REVIEW watchlist entry; a visit FLAGGED on first screen (version captured)."
            - "The visit is re-screened (advancing Visit.version) before the officer's clearance lands."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /floors"
              payload: { site_id: "${site_id}", label: "L3", capacity: 5 }
              as: SecurityOfficer
              captures: { floor_id: $.data.id }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
