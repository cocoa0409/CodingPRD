  - section: validations
    instances:
      - name: vehicle_not_owned_by_workorder_customer
        claim_type: Violation → Error
        grounds: ["validations[priority=5]", "errors[ERR_VEHICLE_NOT_OWNED]"]
        distinguishing_aspect: "POST /work-orders where vehicle_id belongs to a different customer returns ERR_VEHICLE_NOT_OWNED (422)."
        test_recipe:
          setup: ["Two customers; a vehicle owned by customer B; an attempt to open a work order for customer A on B's vehicle."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ea@x.com", full_name: "Cust A", phone: "555-2001" }
              as: ServiceAdvisor
              captures: { cust_a: $.data.id }
            - call: "POST /customers"
              payload: { email: "eb@x.com", full_name: "Cust B", phone: "555-2002" }
              as: ServiceAdvisor
              captures: { cust_b: $.data.id }
            - call: "POST /vehicles"
