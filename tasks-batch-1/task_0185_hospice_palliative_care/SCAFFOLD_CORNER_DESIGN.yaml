          - errors[ERR_INTENSITY_FLAG_MISMATCH]
          - endpoints["POST /hospice/care-days"]
        distinguishing_aspect: "A ROUTINE day on elapsed index 0 with high_intensity=false (window says high) returns ERR_INTENSITY_FLAG_MISMATCH."
