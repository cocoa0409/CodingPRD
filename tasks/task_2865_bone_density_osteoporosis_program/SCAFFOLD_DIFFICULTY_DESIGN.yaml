              as: Scheduler
            - call: "POST /bone-density/scan-appointments"
              payload: { scan_order_id: "${order2_id}", densitometer_id: "${dev_b_id}", start_utc: "2026-03-11T14:00:00Z", end_utc: "2026-03-11T14:30:00Z" }
