          measured_syrup_gallons: 0.2
        as: SugarMaker
        as_user_id: ${boiler_id}
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE (HTTP 409); batch remains FILLING; no SyrupLot exists for the batch
  - name: voided_run_confirm_terminal_lockdown
    claim_type: terminal_lockdown
    grounds:
    - state_machines.SapRun
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: 'VOIDED is terminal: confirm on a voided DRAFT run fails ERR_INVALID_STATE.'
    test_recipe:
      setup:
      - DRAFT run voided
      setup_api_calls:
      - call: POST /sugarhouse/_clock/set_current_utc
        payload:
          to_iso8601: '2027-02-15T00:00:00Z'
        as: SugarhouseManager
      - call: POST /sugarhouse/seasons
        payload:
