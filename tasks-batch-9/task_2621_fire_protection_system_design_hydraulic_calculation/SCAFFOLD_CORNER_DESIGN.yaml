            - call: "POST /hazard-areas"
              payload: { project_id: "${p1}", label: "Bay 45ft", hazard_class: "ORDINARY_1", commodity_class: "CLASS_III", storage_height_ft: 8.0, ceiling_height_ft: 45.0, area_sqft: 24000.0, sprinkler_system_type: "WET", ceiling_slope_pct: 4.0 }
