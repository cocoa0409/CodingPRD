              as: HearingOfficer
              as_user_id: "U-HEARING-1"
              captures: { h3_id: $.data.id }
          trigger:
            - call: "POST /procurement/protests/${p6_id}/hearings"
              payload: { hearing_officer_user_id: "U-OFFICER-2", scheduled_start_utc: "2026-08-28T09:30:00Z", scheduled_end_utc: "2026-08-28T10:30:00Z", room_code: "ROOM-A" }
