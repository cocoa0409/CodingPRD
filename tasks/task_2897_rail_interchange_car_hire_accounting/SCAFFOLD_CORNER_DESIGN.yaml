      - name: open_and_out_of_period_movements_excluded_from_the_cycle
        claim_type: Input Set Filtering
        grounds:
          - calculations.settlement_statement.input_set
          - calculations.per_diem_exposure.input_set
        distinguishing_aspect: "The cycle and the exposure read consume different input sets from the same data: the cycle counts only CLOSED movements whose end_at falls in the period, so a car still sitting on BN contributes 0 to net_settlement_cents and does not raise movement_line_count — yet the very same OPEN segment is accrued at 14000 cents by the exposure read, which is what makes the exposure larger than everything ever billed."
        test_recipe:
          setup:
            - "Railroads BN/CX, car type XM, junction JCT-CHI; car 1 completes a 2026-08-24T00:00:00Z -> 2026-08-28T00:00:00Z LOADED trip on BN (odometer 1000 -> 1240, gross 11464); car 2 is delivered to BN at 2026-08-27T00:00:00Z and never returns, so its movement is still OPEN."
            - "The clock is 2026-09-01T00:00:00Z at compute time, so the OPEN segment has accrued 120.00 elapsed / 116.00 chargeable hours = 5 days = 14000 cents."
