# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3239_digital_preservation_crawls_controlled_lending_rights_requests
# Breadth probe over §1.1-§1.7 claims that §1.8 does not already exercise.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: patron_create_returns_defaults_and_envelope
        claim_type: Creation
        grounds:
          - entities.Patron
          - endpoints.POST_/archive/patrons
          - response_envelope
        distinguishing_aspect: "A patron created with only email and full_name comes back 201 with status ACTIVE, strike_count 0, active_loan_count 0, max_concurrent_loans 5, version 1, and a system-minted id; the envelope carries meta.api_request_id and response_type object."
        test_recipe:
          setup:
            - "Empty database; logical clock at its startup default 2026-09-01T00:00:00Z (no clock-set call made)."
          setup_api_calls: []
          trigger:
            - call: "POST /archive/patrons"
              payload: { email: "corner1@example.org", full_name: "Corner One" }
              as: Anonymous
              captures: { cp1: $.data.id }
          assert:
            - "the response status is 201, response_type is object, and meta.api_request_id and meta.api_request_timestamp are present"
            - "Patron.${cp1}.status == ACTIVE, strike_count == 0, active_loan_count == 0, max_concurrent_loans == 5, version == 1"
            - "Patron.${cp1}.created_at == 2026-09-01T00:00:00.000Z (logical clock default, not wall clock)"
      - name: patron_email_uniqueness_is_case_insensitive
        claim_type: Type Constraints
        grounds:
          - entities.Patron.fields.email
          - validations[priority=21]
          - errors.ERR_DUPLICATE
        distinguishing_aspect: "Registering a second patron whose email differs only by case from an existing one is rejected with ERR_DUPLICATE, and no second row is persisted."
        test_recipe:
          setup:
            - "One patron exists with email dup@example.org."
          setup_api_calls:
            - call: "POST /archive/patrons"
              payload: { email: "dup@example.org", full_name: "First" }
              as: Anonymous
          trigger:
            - call: "POST /archive/patrons"
              payload: { email: "DUP@EXAMPLE.ORG", full_name: "Second" }
              as: Anonymous
              captures: { dup_err: $.data.error_id }
          assert:
            - "the response status is 409 and dup_err == ERR_DUPLICATE"
            - "GET /archive/patrons with any listing shows exactly 1 patron (the duplicate was not persisted)"
      - name: capture_is_immutable_and_carries_no_version
        claim_type: Immutability
        grounds:
          - entities.Capture
        distinguishing_aspect: "Capture has common_fields: false — it carries id and created_at but no version and no updated_at, and no endpoint mutates a Capture after creation; only its playback_status moves via rights/exclusion cascades."
        test_recipe:
          setup:
            - "Job J RUNNING with one recorded capture."
          setup_api_calls:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Admin
            - call: "POST /archive/crawl-jobs"
              payload: { seed_url: "https://imm.site/", scheduled_at: "2026-09-01T00:10:00Z", requests_per_minute: 20 }
              as: CrawlOperator
              captures: { jimm: $.data.id }
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:10:00Z" }
              as: Admin
            - call: "POST /archive/crawl-jobs/${jimm}/start"
              payload: {}
              as: CrawlOperator
            - call: "POST /archive/captures"
              payload: { crawl_job_id: "${jimm}", url: "https://imm.site/p", content_hash: "hh1", has_dynamic_content: false }
              as: CrawlOperator
              captures: { cimm: $.data.id }
          trigger:
            - call: "GET /archive/crawl-jobs/${jimm}/captures"
              payload: {}
              as: CrawlOperator
              captures: { row: "$.data[0].id" }
          assert:
            - "the listed Capture row exposes id, created_at, url, content_hash, captured_at, has_dynamic_content, playback_status"
            - "the row has NO version field and NO updated_at field (common_fields: false)"
            - "Capture.${cimm}.playback_status == PLAYABLE at record time"
      - name: partner_library_commitment_below_five_years_rejected
        claim_type: Type Constraints
        grounds:
          - entities.PartnerLibrary.fields.storage_commitment_years
          - validations[priority=6]
          - errors.ERR_VALIDATION
        distinguishing_aspect: "storage_commitment_years == 4 is rejected at priority 6 with ERR_VALIDATION while 5 (the exact floor) is accepted — a boundary on the input schema, not on a computed counter."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /archive/partner-libraries"
              payload: { library_code: "LIB-SHORT", display_name: "Short Term", storage_commitment_years: 4 }
              as: LibraryAdmin
              captures: { short_err: $.data.error_id }
            - call: "POST /archive/partner-libraries"
              payload: { library_code: "LIB-FIVE", display_name: "Five Year", storage_commitment_years: 5 }
              as: LibraryAdmin
              captures: { five_ok: $.data.id }
          assert:
            - "short_err == ERR_VALIDATION with status 400"
            - "the 5-year registration succeeds with status 201 and PartnerLibrary.${five_ok}.status == ACTIVE"
      - name: rights_request_subject_kind_field_consistency
        claim_type: Type Constraints
        grounds:
          - entities.RightsRequest.fields.subject_kind
          - validations[priority=6]
          - errors.ERR_VALIDATION
        distinguishing_aspect: "subject_kind == WORK with work_id omitted (or url_prefix supplied) is a priority-6 schema violation; subject_kind == CAPTURE_URL_PREFIX with url_prefix omitted fails identically."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /archive/rights-requests"
              payload: { subject_kind: "WORK", claimant_name: "No Work Id" }
              as: LegalReviewer
              as_user_id: "legal-x"
              captures: { rr_err: $.data.error_id }
          assert:
            - "the response status is 400 and rr_err == ERR_VALIDATION"
            - "no RightsRequest was persisted (the create failed at priority 6)"
      - name: work_get_returns_computed_availability
        claim_type: Computed Fields
        grounds:
          - entities.Work.fields.availability
          - calculations.work_availability_recompute
          - endpoints.GET_/archive/works/{id}
        distinguishing_aspect: "availability is computed, never client-supplied: a work created without any rights requests reports AVAILABLE, and the field is absent from the create endpoint's input list."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /archive/works"
              payload: { title: "Plain Work", author: "W. Plain", publication_year: 1960 }
              as: Admin
              captures: { wp: $.data.id }
          assert:
            - "Work.${wp}.availability == AVAILABLE on the create response"
            - "GET /archive/works/${wp} returns availability == AVAILABLE and version == 1"
      - name: fk_reverse_reachability_lists_children_by_parent
        claim_type: Parent Relationships
        grounds:
          - entities.ScanItem.fields.batch_id
          - entities.BudgetLine.fields.grant_id
          - endpoints.GET_/archive/scan-batches/{id}/items
          - endpoints.GET_/archive/funding-grants/{id}/budget-lines
        distinguishing_aspect: "Every FK declared in §1.1 is reachable in reverse through a filtered-list GET: items by batch_id/work_id/owning_library_id, budget-lines by grant_id, captures by crawl_job_id, loans by patron_id/item_id."
        test_recipe:
          setup:
            - "Library, work, sealed batch with 2 items; grant with 2 budget lines."
          setup_api_calls:
            - call: "POST /archive/partner-libraries"
              payload: { library_code: "LIB-FK", display_name: "FK Lib", storage_commitment_years: 6 }
              as: LibraryAdmin
              captures: { libfk: $.data.id }
            - call: "POST /archive/works"
              payload: { title: "FK Work", author: "FK", publication_year: 2000 }
              as: Admin
              captures: { workfk: $.data.id }
            - call: "POST /archive/scan-batches"
              payload: { operator_code: "op-fk" }
              as: ScanOperator
              captures: { batchfk: $.data.id }
            - call: "POST /archive/items"
              payload: { batch_id: "${batchfk}", work_id: "${workfk}", owning_library_id: "${libfk}", page_count: 10, condition_grade: "FINE" }
              as: ScanOperator
            - call: "POST /archive/items"
              payload: { batch_id: "${batchfk}", work_id: "${workfk}", owning_library_id: "${libfk}", page_count: 20, condition_grade: "FAIR" }
              as: ScanOperator
            - call: "POST /archive/funding-grants"
              payload: { donor_name: "FK Donor", amount_cents: 100000 }
              as: FinanceAdmin
              captures: { gfk: $.data.id }
            - call: "POST /archive/budget-lines"
              payload: { grant_id: "${gfk}", category: "STORAGE", budget_reservation_cents: 1000 }
              as: FinanceAdmin
            - call: "POST /archive/budget-lines"
              payload: { grant_id: "${gfk}", category: "BANDWIDTH", budget_reservation_cents: 2000 }
              as: FinanceAdmin
          trigger:
            - call: "GET /archive/scan-batches/${batchfk}/items"
              payload: {}
              as: ScanOperator
            - call: "GET /archive/funding-grants/${gfk}/budget-lines"
              payload: {}
              as: FinanceAdmin
          assert:
            - "GET /archive/scan-batches/${batchfk}/items returns exactly 2 rows"
            - "GET /archive/funding-grants/${gfk}/budget-lines returns exactly 2 rows summing to 3000 reserved cents"
            - "GET /archive/partner-libraries/${libfk}/items returns the same 2 rows"
      - name: list_pagination_defaults_and_has_more
        claim_type: Listing
        grounds:
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - endpoints.GET_/archive/patrons/{id}/loans
        distinguishing_aspect: "Pagination defaults (limit 10, offset 0) apply when no params are given; total_count reflects the whole filtered set while has_more distinguishes the final page."
        test_recipe:
          setup:
            - "Work with 3 items; patron P holds 3 ACTIVE loans (one per item would violate one-copy-per-work — instead use 3 works each with 1 item)."
          setup_api_calls:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Admin
            - call: "POST /archive/partner-libraries"
              payload: { library_code: "LIB-PG", display_name: "Page Lib", storage_commitment_years: 5 }
              as: LibraryAdmin
              captures: { libpg: $.data.id }
            - call: "POST /archive/works"
              payload: { title: "Pg One", author: "Pg", publication_year: 2001 }
              as: Admin
              captures: { wpg1: $.data.id }
            - call: "POST /archive/works"
              payload: { title: "Pg Two", author: "Pg", publication_year: 2002 }
              as: Admin
              captures: { wpg2: $.data.id }
            - call: "POST /archive/works"
              payload: { title: "Pg Three", author: "Pg", publication_year: 2003 }
              as: Admin
              captures: { wpg3: $.data.id }
            - call: "POST /archive/scan-batches"
              payload: { operator_code: "op-pg" }
              as: ScanOperator
              captures: { bpg: $.data.id }
            - call: "POST /archive/items"
              payload: { batch_id: "${bpg}", work_id: "${wpg1}", owning_library_id: "${libpg}", page_count: 10, condition_grade: "FINE" }
              as: ScanOperator
              captures: { ipg1: $.data.id }
            - call: "POST /archive/items"
              payload: { batch_id: "${bpg}", work_id: "${wpg2}", owning_library_id: "${libpg}", page_count: 10, condition_grade: "FINE" }
              as: ScanOperator
              captures: { ipg2: $.data.id }
            - call: "POST /archive/items"
              payload: { batch_id: "${bpg}", work_id: "${wpg3}", owning_library_id: "${libpg}", page_count: 10, condition_grade: "FINE" }
              as: ScanOperator
              captures: { ipg3: $.data.id }
            - call: "POST /archive/scan-batches/${bpg}/seal"
              payload: {}
              as: ScanOperator
            - call: "POST /archive/patrons"
              payload: { email: "pg@example.org", full_name: "Pg Patron" }
              as: Anonymous
              captures: { patpg: $.data.id }
            - call: "POST /archive/loans"
              payload: { item_id: "${ipg1}", patron_id: "${patpg}", loan_kind: "STANDARD" }
              as: Patron
              as_user_id: "${patpg}"
            - call: "POST /archive/loans"
              payload: { item_id: "${ipg2}", patron_id: "${patpg}", loan_kind: "STANDARD" }
              as: Patron
              as_user_id: "${patpg}"
            - call: "POST /archive/loans"
              payload: { item_id: "${ipg3}", patron_id: "${patpg}", loan_kind: "STANDARD" }
              as: Patron
              as_user_id: "${patpg}"
          trigger:
            - call: "GET /archive/patrons/${patpg}/loans"
              payload: { limit: 2, offset: 0 }
              as: Admin
            - call: "GET /archive/patrons/${patpg}/loans"
              payload: { limit: 2, offset: 2 }
              as: Admin
          assert:
            - "first page returns exactly 2 rows with total_count == 3 and has_more == true"
            - "second page returns exactly 1 row with total_count == 3 and has_more == false"
            - "a call without limit/offset returns all 3 rows with limit defaulting to 10 and offset to 0"
      - name: work_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/archive/works/{id}
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated UUID on the path returns 404 ERR_NOT_FOUND, not a 400 and not an empty 200."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /archive/works/00000000-0000-4000-8000-000000000099"
              payload: {}
              as: Admin
              captures: { nf_err: $.data.error_id }
          assert:
            - "the response status is 404 and nf_err == ERR_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: double_return_of_same_loan_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Loan
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "RETURNED is terminal: a second return on the same loan fails with ERR_INVALID_STATE and fires no side effects (item stays LENDABLE, counters unchanged)."
        test_recipe:
          setup:
            - "Work W with LENDABLE item I; patron P returned loan LN (already RETURNED)."
          setup_api_calls:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Admin
            - call: "POST /archive/partner-libraries"
              payload: { library_code: "LIB-DR", display_name: "DR Lib", storage_commitment_years: 5 }
              as: LibraryAdmin
              captures: { libdr: $.data.id }
            - call: "POST /archive/works"
              payload: { title: "Double Return", author: "DR", publication_year: 2010 }
              as: Admin
              captures: { wdr: $.data.id }
            - call: "POST /archive/scan-batches"
              payload: { operator_code: "op-dr" }
              as: ScanOperator
              captures: { bdr: $.data.id }
            - call: "POST /archive/items"
              payload: { batch_id: "${bdr}", work_id: "${wdr}", owning_library_id: "${libdr}", page_count: 10, condition_grade: "GOOD" }
              as: ScanOperator
              captures: { idr: $.data.id }
            - call: "POST /archive/scan-batches/${bdr}/seal"
              payload: {}
              as: ScanOperator
            - call: "POST /archive/patrons"
              payload: { email: "dr@example.org", full_name: "DR Patron" }
              as: Anonymous
              captures: { pdr: $.data.id }
            - call: "POST /archive/loans"
              payload: { item_id: "${idr}", patron_id: "${pdr}", loan_kind: "STANDARD" }
              as: Patron
              as_user_id: "${pdr}"
              captures: { ldr: $.data.id }
            - call: "POST /archive/loans/${ldr}/return"
              payload: {}
              as: Patron
              as_user_id: "${pdr}"
          trigger:
            - call: "POST /archive/loans/${ldr}/return"
              payload: {}
              as: Patron
              as_user_id: "${pdr}"
              captures: { dr_err: $.data.error_id }
          assert:
            - "the second return fails with dr_err == ERR_INVALID_STATE (409)"
            - "Loan.${ldr}.status remains RETURNED; Patron.${pdr}.active_loan_count stays 0"
      - name: seal_empty_batch_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=22]
          - errors.ERR_SEAL_EMPTY_BATCH
        distinguishing_aspect: "Sealing a batch with zero items fails with ERR_SEAL_EMPTY_BATCH and the batch stays OPEN, so a later deposit followed by seal still succeeds."
        test_recipe:
          setup:
            - "Batch B created, no items."
          setup_api_calls:
            - call: "POST /archive/scan-batches"
              payload: { operator_code: "op-se" }
              as: ScanOperator
              captures: { bse: $.data.id }
          trigger:
            - call: "POST /archive/scan-batches/${bse}/seal"
              payload: {}
              as: ScanOperator
              captures: { se_err: $.data.error_id }
          assert:
            - "se_err == ERR_SEAL_EMPTY_BATCH (409)"
            - "ScanBatch.${bse}.status == OPEN and item_count == 0"
      - name: crawl_start_before_scheduled_at_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=14]
          - errors.ERR_SCHEDULE_NOT_DUE
        distinguishing_aspect: "Starting a SCHEDULED job whose scheduled_at is still in the future fails with ERR_SCHEDULE_NOT_DUE; advancing the clock to exactly scheduled_at makes the same call succeed (closed-start gate is exercised in §1.8; here the failing side)."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; job scheduled at 2026-09-02T00:00:00Z."
          setup_api_calls:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Admin
            - call: "POST /archive/crawl-jobs"
              payload: { seed_url: "https://early.site/", scheduled_at: "2026-09-02T00:00:00Z", requests_per_minute: 5 }
              as: CrawlOperator
              captures: { jearly: $.data.id }
          trigger:
            - call: "POST /archive/crawl-jobs/${jearly}/start"
              payload: {}
              as: CrawlOperator
              captures: { early_err: $.data.error_id }
          assert:
            - "early_err == ERR_SCHEDULE_NOT_DUE (409)"
            - "CrawlJob.${jearly}.status remains SCHEDULED"
      - name: crawl_job_created_under_matching_exclusion_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=15]
          - errors.ERR_CRAWL_EXCLUDED
        distinguishing_aspect: "Creating a crawl job whose seed_url is prefixed by an ACTIVE CRAWL_ONLY directive fails at create time with ERR_CRAWL_EXCLUDED (creation-time gate, distinct from the create-then-block path in §1.8-adjacent flows)."
        test_recipe:
          setup:
            - "ACTIVE ExclusionDirective url_prefix https://blocked.site/ scope CRAWL_ONLY."
          setup_api_calls:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Admin
            - call: "POST /archive/exclusion-directives"
              payload: { url_prefix: "https://blocked.site/", scope: "CRAWL_ONLY", reason: "robots" }
              as: CrawlOperator
          trigger:
            - call: "POST /archive/crawl-jobs"
              payload: { seed_url: "https://blocked.site/deep/page", scheduled_at: "2026-09-02T00:00:00Z", requests_per_minute: 5 }
              as: CrawlOperator
              captures: { cj_err: $.data.error_id }
          assert:
            - "cj_err == ERR_CRAWL_EXCLUDED (409) and no CrawlJob row is persisted"
      - name: exclusion_creation_blocks_scheduled_job
        claim_type: side_effect_execution
        grounds:
          - state_machines.CrawlJob.SCHEDULED_to_BLOCKED
          - endpoints.POST_/archive/exclusion-directives
        distinguishing_aspect: "Creating a BOTH-scoped directive after a job was scheduled cascades the job to BLOCKED and returns the blocked job ids in the directive response."
        test_recipe:
          setup:
            - "Job J SCHEDULED for seed https://site-x.com/ at a future time."
          setup_api_calls:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Admin
            - call: "POST /archive/crawl-jobs"
              payload: { seed_url: "https://site-x.com/", scheduled_at: "2026-09-05T00:00:00Z", requests_per_minute: 15 }
              as: CrawlOperator
              captures: { jx: $.data.id }
          trigger:
            - call: "POST /archive/exclusion-directives"
              payload: { url_prefix: "https://site-x.com/", scope: "BOTH", reason: "takedown" }
              as: CrawlOperator
              captures: { blocked_list: $.data.blocked_job_ids }
          assert:
            - "CrawlJob.${jx}.status == BLOCKED after the directive is created"
            - "the directive response's blocked_job_ids contains ${jx}"
            - "a later start attempt on ${jx} fails with ERR_INVALID_STATE (BLOCKED is terminal)"
      - name: loan_renewal_blocked_by_live_waitlist
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=17]
          - errors.ERR_LOAN_NOT_RENEWABLE
        distinguishing_aspect: "A renewal requested while another patron holds an OPEN waitlist entry on the same work is rejected with ERR_LOAN_NOT_RENEWABLE even though the loan is otherwise renewable (not renewed, STANDARD, before due_at, within the 42-day cap)."
        test_recipe:
          setup:
            - "Work W2i with one item I2i on ACTIVE loan to P-A (renewable); P-B holds OPEN waitlist entry on W2i."
          setup_api_calls:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Admin
            - call: "POST /archive/partner-libraries"
              payload: { library_code: "LIB-RN", display_name: "RN Lib", storage_commitment_years: 5 }
              as: LibraryAdmin
              captures: { librn: $.data.id }
            - call: "POST /archive/works"
              payload: { title: "Renewal Blocked", author: "RN", publication_year: 2011 }
              as: Admin
              captures: { wrn: $.data.id }
            - call: "POST /archive/scan-batches"
              payload: { operator_code: "op-rn" }
              as: ScanOperator
              captures: { brn: $.data.id }
            - call: "POST /archive/items"
              payload: { batch_id: "${brn}", work_id: "${wrn}", owning_library_id: "${librn}", page_count: 10, condition_grade: "GOOD" }
              as: ScanOperator
              captures: { irn: $.data.id }
            - call: "POST /archive/scan-batches/${brn}/seal"
              payload: {}
              as: ScanOperator
            - call: "POST /archive/patrons"
              payload: { email: "rna@example.org", full_name: "RN A" }
              as: Anonymous
              captures: { prna: $.data.id }
            - call: "POST /archive/patrons"
              payload: { email: "rnb@example.org", full_name: "RN B" }
              as: Anonymous
              captures: { prnb: $.data.id }
            - call: "POST /archive/loans"
              payload: { item_id: "${irn}", patron_id: "${prna}", loan_kind: "STANDARD" }
              as: Patron
              as_user_id: "${prna}"
              captures: { lrn: $.data.id }
            - call: "POST /archive/waitlist-entries"
              payload: { work_id: "${wrn}", patron_id: "${prnb}" }
              as: Patron
              as_user_id: "${prnb}"
          trigger:
            - call: "POST /archive/loans/${lrn}/renew"
              payload: {}
              as: Patron
              as_user_id: "${prna}"
              captures: { rn_err: $.data.error_id }
          assert:
            - "rn_err == ERR_LOAN_NOT_RENEWABLE (409)"
            - "Loan.${lrn}.renewed == false and due_at unchanged (2026-09-15T00:00:00Z)"
      - name: renewal_absolute_cap_42_days
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=18]
          - errors.ERR_RENEWAL_WINDOW_EXCEEDED
          - calculations.renewal_window
        distinguishing_aspect: "A renewal requested when current clock + 14 days would exceed checked_out_at + 42 days fails with ERR_RENEWAL_WINDOW_EXCEEDED — distinct error from the general renewal denial."
        test_recipe:
