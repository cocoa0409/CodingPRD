            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T00:00:00Z" }, as: HRAdmin }
            # create all four periods BEFORE closing P1 so the split schedule spans 4 periods
            - call: "POST /adjunct-hr/payroll-periods"
              payload: { period_code: "2026FA-P1", start_date: "2026-08-24", end_date: "2026-09-20" }
              as: PayrollOfficer
              captures: { p1: $.data.id }
            - call: "POST /adjunct-hr/payroll-periods"
              payload: { period_code: "2026FA-P2", start_date: "2026-09-21", end_date: "2026-10-18" }
              as: PayrollOfficer
              captures: { p2: $.data.id }
            - call: "POST /adjunct-hr/payroll-periods"
              payload: { period_code: "2026FA-P3", start_date: "2026-10-19", end_date: "2026-11-15" }
              as: PayrollOfficer
              captures: { p3: $.data.id }
            - call: "POST /adjunct-hr/payroll-periods"
              payload: { period_code: "2026FA-P4", start_date: "2026-11-16", end_date: "2026-12-13" }
              as: PayrollOfficer
              captures: { p4: $.data.id }
            # closing P1 posts P1's DAYS_WEIGHTED slice: round_half_up(9000000 * 28/110) = 2290909
            # for the big contract AND round_half_up(4500000 * 28/110) = 1145455 for the small one
            - { call: "POST /adjunct-hr/payroll-periods/${p1}/lock", payload: {}, as: PayrollOfficer }
            - { call: "POST /adjunct-hr/payroll-periods/${p1}/close", payload: {}, as: PayrollOfficer }
            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-09-14T09:00:00Z" }, as: HRAdmin }
          trigger:
            - call: "POST /adjunct-hr/sections/${sec_big}/cancel"
              payload: { cancellation_reason: "PROGRAM_CUT" }
              as: DepartmentChair
            - call: "GET /adjunct-hr/contracts/${con_big}"
              payload: {}
              as: HRAdmin
              captures: { big_payable: $.data.payable_cents }
            - call: "GET /adjunct-hr/payroll-periods/${p2}/payroll-entries"
              payload: { entry_kind: "CLAWBACK" }
              as: PayrollOfficer
              captures: { clawback_amt: "$.data[0].amount_cents" }
            - call: "GET /adjunct-hr/faculty/${faculty_id}"
              payload: {}
              as: HRAdmin
              captures: { load_after: $.data.current_term_load_units, eligible_after: $.data.benefits_eligible }
          assert:
            - "Contract.${con_big}.contract_status == CANCELLED_LATE and payable_cents == 2250000 (elapsed 22/110 earned 1800000 < floor 2250000)"
            - "link 2: a CLAWBACK PayrollEntry of amount_cents == -40909 exists in period ${p2} (accrued 2290909 - payable 2250000 = 40909 reversed)"
            - "CLAWBACK entry's contract_id == ${con_big} and entry_kind == CLAWBACK with reversal_of_entry_id referencing the P1 ACCRUAL entry"
            - "link 3: AdjunctFaculty.${faculty_id}.current_term_load_units == 1.50 (only the small ACTIVE contract counts) and benefits_eligible == false (1.50 < 4.50)"
            - "Contract.${con_small}.contract_status == ACTIVE (sibling contract untouched by the cascade)"

      - name: non_reappointment_depth2_cascade_voids_future_contracts
        grounds:
          - state_machines.RetentionEntry.LISTED_to_NON_REAPPOINTED
          - state_machines.AdjunctFaculty.RETENTION_LISTED_to_NON_REAPPOINTED
          - state_machines.Contract.ISSUED_to_VOIDED
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (Dean's mark-non-reappointed,
          not a section cancel): RetentionEntry LISTED->NON_REAPPOINTED mutates
          AdjunctFaculty (retention_status -> NON_REAPPOINTED); that faculty
          mutation itself voids every future-dated ISSUED contract and zeroes
          their payable_cents — a second propagation pattern disjoint from the
          section-cancel chain.
        test_recipe:
          setup:
            - "Faculty COMPLIANT, RETENTION_LISTED for list_term_code 2027SP"
            - "One ISSUED contract on a 2027SP section (starts after the list term's start)"
