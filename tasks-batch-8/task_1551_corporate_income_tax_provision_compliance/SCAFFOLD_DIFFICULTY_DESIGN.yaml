# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# 9 Difficulty Rules x 2 instances each = 18 instances.
# All money figures in assert: lines were computed by executing the pinned
# formulas in SCAFFOLD.yaml §1.3 against the pinned setup inputs.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: etr_forecast_vs_actual_divergence
        grounds:
          - calculations.etr_calculation
          - entities.TaxYear.fields.forecast_etr_bp
          - entities.TaxYear.fields.actual_etr_bp
        distinguishing_aspect: |
          TaxYear-domain dual variant: the forecast ETR consumes the provision
          estimate plus UTP reserve and valuation allowance (2389 bp) while the
          actual ETR replaces estimate+reserve with filed return liabilities
          (2279 bp) — same underlying data, two valid algorithms, a 110 bp gap.
        test_recipe:
          setup:
            - "FY2026 TaxYear: book income 100,000,000; prior-year tax 8,000,000; federal rate 2100 bp"
            - "Jurisdictions US-FED (2100 bp, apportionment 100%) and US-CA (884 bp, apportionment 25%)"
            - "LOCKED PERMANENT difference +2,000,000 (meals); LOCKED TEMPORARY difference +3,000,000 (warranty) -> DTA 630,000"
            - "APPROVED valuation allowance 320,000 (mltn=true, projected income 1,000,000, reversing DTL 100,000)"
            - "UTP1 2,000,000 @6000 bp (recognized, liability 0); UTP2 1,000,000 @4000 bp (liability 1,000,000)"
            - "Provision locked: FED estimate 20,946,618; CA estimate 2,254,200; current_provision 23,200,818"
            - "FED return filed at 20,800,000; CA return filed at 2,300,000"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-CA", name: "California", level: STATE, statutory_rate_bp: 884, apportionment_pct_bp: 2500, return_due_month: 4, return_due_day: 15, extension_months: 7 }
              as: TaxManager
              captures: { jur_ca: $.data.id }
            - call: "POST /tax/book-tax-differences"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", description: "meals 50pct limitation", book_amount_cents: 2000000, tax_amount_cents: 0, difference_type: PERMANENT }
              as: TaxAccountant
              captures: { diff_perm: $.data.id }
            - { call: "POST /tax/book-tax-differences/${diff_perm}/review", payload: {}, as: TaxManager }
            - call: "POST /tax/book-tax-differences"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", description: "accrued warranty", book_amount_cents: 5000000, tax_amount_cents: 2000000, difference_type: TEMPORARY }
              as: TaxAccountant
              captures: { diff_temp: $.data.id }
            - { call: "POST /tax/book-tax-differences/${diff_temp}/review", payload: {}, as: TaxManager }
            - call: "POST /tax/filings"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", original_due_date: "2027-04-15" }
              as: TaxAccountant
              captures: { fil_fed: $.data.id }
            - call: "POST /tax/filings"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_ca}", original_due_date: "2027-04-15" }
              as: TaxAccountant
              captures: { fil_ca: $.data.id }
            - { call: "POST /tax/book-tax-differences/${diff_perm}/lock", payload: {}, as: TaxManager }
            - { call: "POST /tax/book-tax-differences/${diff_temp}/lock", payload: {}, as: TaxManager }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: TaxDirector
              captures: { ty_v1: $.data.version }
            - call: "POST /tax/valuation-allowances"
              payload: { tax_year_id: "${ty_id}", more_likely_than_not: true, projected_taxable_income_cents: 1000000, reversing_dtl_cents: 100000, expected_tax_year_version: "${ty_v1}" }
              as: TaxManager
              as_user_id: "mgr-1"
              captures: { va_id: $.data.id }
            - { call: "POST /tax/valuation-allowances/${va_id}/submit", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
            - { call: "POST /tax/valuation-allowances/${va_id}/approve", payload: {}, as: TaxDirector, as_user_id: "dir-1" }
            - call: "POST /tax/uncertain-tax-positions"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", description: "R&D credit", position_amount_cents: 2000000 }
              as: TaxAccountant
              captures: { utp1: $.data.id }
            - { call: "POST /tax/uncertain-tax-positions/${utp1}/measure", payload: { cumulative_probability_bp: 6000 }, as: TaxManager }
            - call: "POST /tax/uncertain-tax-positions"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", description: "transfer pricing", position_amount_cents: 1000000 }
              as: TaxAccountant
              captures: { utp2: $.data.id }
            - { call: "POST /tax/uncertain-tax-positions/${utp2}/measure", payload: { cumulative_probability_bp: 4000 }, as: TaxManager }
            - { call: "POST /tax/tax-years/${ty_id}/lock-provision", payload: {}, as: TaxDirector }
            - { call: "POST /tax/filings/${fil_fed}/mark-ready", payload: { return_tax_liability_cents: 20800000 }, as: TaxAccountant }
            - { call: "POST /tax/filings/${fil_ca}/mark-ready", payload: { return_tax_liability_cents: 2300000 }, as: TaxAccountant }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: TaxDirector
              captures: { ty_v2: $.data.version }
            - { call: "POST /tax/filings/${fil_fed}/file", payload: { expected_tax_year_version: "${ty_v2}" }, as: TaxDirector }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: TaxDirector
              captures: { ty_v3: $.data.version }
            - { call: "POST /tax/filings/${fil_ca}/file", payload: { expected_tax_year_version: "${ty_v3}" }, as: TaxDirector }
          trigger:
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: Auditor
              captures: { fc_etr: $.data.forecast_etr_bp, ac_etr: $.data.actual_etr_bp, rtp: $.data.return_to_provision_adjustment_cents }
          assert:
            - "TaxYear.${ty_id}.current_provision_cents == 23200818  # CA 2,254,200 + FED 20,946,618 per current_tax_stack"
            - "TaxYear.${ty_id}.forecast_etr_bp == 2389  # (23,200,818 - 630,000 + 1,000,000 + 320,000) * 10000 / 100,000,000 = 2389.0818"
            - "TaxYear.${ty_id}.actual_etr_bp == 2279  # (20,800,000 + 2,300,000 - 630,000 + 320,000) * 10000 / 100,000,000 = 2279.0"
            - "TaxYear.${ty_id}.return_to_provision_adjustment_cents == -100818  # (20,800,000-20,946,618) + (2,300,000-2,254,200)"
            - "forecast_etr_bp != actual_etr_bp  # the two variants diverge by 110 bp on identical underlying data"

      - name: estimated_payment_safe_harbor_vs_annualized
        grounds:
          - calculations.estimated_payment_schedule
          - entities.EstimatedPayment.fields.method
        distinguishing_aspect: |
          EstimatedPayment-domain dual variant (different entity domain from the
          ETR instance): for the same jurisdiction and year, PRIOR_YEAR_SAFE_HARBOR
          schedules 500,600 per quarter while CURRENT_YEAR_ANNUALIZED schedules
          552,537/552,538 — two valid statutes produce different obligations.
        test_recipe:
          setup:
            - "FY2026 TaxYear: book income 100,000,000; prior-year total tax 8,000,000"
            - "Jurisdiction US-IL (883 bp, apportionment 2503 bp) and US-NY (883 bp, apportionment 2503 bp)"
            - "IL schedule generated with CURRENT_YEAR_ANNUALIZED; NY schedule with PRIOR_YEAR_SAFE_HARBOR"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-IL", name: "Illinois", level: STATE, statutory_rate_bp: 883, apportionment_pct_bp: 2503, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_il: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-NY", name: "New York", level: STATE, statutory_rate_bp: 883, apportionment_pct_bp: 2503, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_ny: $.data.id }
            - call: "POST /tax/estimated-payments/generate-schedule"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_il}", method: CURRENT_YEAR_ANNUALIZED }
              as: TaxManager
              captures: { il_q1: "$.data[0].scheduled_amount_cents", il_q2: "$.data[1].scheduled_amount_cents" }
            - call: "POST /tax/estimated-payments/generate-schedule"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_ny}", method: PRIOR_YEAR_SAFE_HARBOR }
              as: TaxManager
              captures: { ny_q1: "$.data[0].scheduled_amount_cents" }
          trigger:
            - call: "GET /tax/estimated-payments"
              payload: { tax_year_id: "${ty_id}" }
              as: Auditor
          assert:
            - "IL quarter 1 scheduled_amount_cents == 552537  # annualized annual = round(100,000,000*2503*883/1e8) = 2,210,149"
            - "IL quarter 2 scheduled_amount_cents == 552538"
            - "NY quarter 1 scheduled_amount_cents == 500600  # safe-harbor annual = round(8,000,000*2503*10000/1e8) = 2,002,400"
            - "il_q1 != ny_q1  # same year, same-shaped jurisdiction, different statute -> different obligation"

  - rule_id: combinatorial_formula
    instances:
      - name: valuation_allowance_nested_min_max
        grounds:
          - calculations.valuation_allowance_measurement
          - state_machines.BookTaxDifference.REVIEWED_to_LOCKED
        distinguishing_aspect: |
          Mode (a) combinatorial: 4 inputs (gross DTA pool, reversing DTL,
          projected income, enacted rate) interact through nested min/max under
          a conditional branch on the entity's more_likely_than_not flag —
          mltn=true yields max(0, 630,000 - min(630,000, 100,000+210,000)) =
          320,000 while mltn=false bypasses the lattice for a full 630,000.
        test_recipe:
          setup:
            - "FY2026 TaxYear (book income 100,000,000, federal rate 2100 bp); jurisdiction US-FED"
            - "TEMPORARY difference 5,000,000 book vs 2,000,000 tax reviewed but not yet locked"
            - "DRAFT valuation allowance exists BEFORE the lock, so the DTA pool change recomputes it"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id, ty_v0: $.data.version }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/valuation-allowances"
              payload: { tax_year_id: "${ty_id}", more_likely_than_not: true, projected_taxable_income_cents: 1000000, reversing_dtl_cents: 100000, expected_tax_year_version: "${ty_v0}" }
              as: TaxManager
              as_user_id: "mgr-1"
              captures: { va1: $.data.id }
            - call: "POST /tax/book-tax-differences"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", description: "accrued warranty", book_amount_cents: 5000000, tax_amount_cents: 2000000, difference_type: TEMPORARY }
              as: TaxAccountant
              captures: { diff1: $.data.id }
            - { call: "POST /tax/book-tax-differences/${diff1}/review", payload: {}, as: TaxManager }
            - { call: "POST /tax/book-tax-differences/${diff1}/lock", payload: {}, as: TaxManager }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: TaxManager
              captures: { ty_v1: $.data.version }
            - call: "POST /tax/valuation-allowances"
              payload: { tax_year_id: "${ty_id}", more_likely_than_not: false, projected_taxable_income_cents: 1000000, reversing_dtl_cents: 100000, expected_tax_year_version: "${ty_v1}" }
              as: TaxManager
              as_user_id: "mgr-1"
              captures: { va2: $.data.id }
          trigger:
            - call: "GET /tax/valuation-allowances/${va1}"
              payload: {}
              as: Auditor
              captures: { va1_amt: $.data.allowance_amount_cents, va1_status: $.data.status }
            - call: "GET /tax/valuation-allowances/${va2}"
              payload: {}
              as: Auditor
              captures: { va2_amt: $.data.allowance_amount_cents }
          assert:
            - "ValuationAllowance.${va1}.allowance_amount_cents == 320000  # max(0, 630000 - min(630000, 100000 + round(1000000*2100/10000)))"
            - "ValuationAllowance.${va1}.status == SUPERSEDED  # bare create of va2 supersedes the DRAFT va1"
            - "ValuationAllowance.${va2}.allowance_amount_cents == 630000  # mltn=false -> full allowance, lattice bypassed"
            - "DeferredTaxItem for ${diff1}: closing_balance_cents == 630000, movement_cents == 630000, item_kind == ASSET"

      - name: estimated_payment_cumulative_rounding
        grounds:
          - calculations.estimated_payment_schedule
          - entities.EstimatedPayment.fields.base_scheduled_amount_cents
        distinguishing_aspect: |
          Mode (b) nested rounding (different mode from valuation_allowance_nested_min_max):
          the pinned round-per-quarter-against-cumulative-target order yields
          552,537 / 552,538 / 552,537 / 552,537 (sum 2,210,149), whereas the
          unpinned round(annual/4)-each-time order would yield 552,537 x 4 =
          2,210,148 — the two orders diverge by exactly one cent at quarter 2.
        test_recipe:
          setup:
            - "FY2026 TaxYear (book income 100,000,000); jurisdiction US-IL (883 bp, apportionment 2503 bp)"
            - "Annualized annual estimate = round(100,000,000 * 2503 * 883 / 1e8) = 2,210,149 (== 1 mod 4)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-IL", name: "Illinois", level: STATE, statutory_rate_bp: 883, apportionment_pct_bp: 2503, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_il: $.data.id }
          trigger:
            - call: "POST /tax/estimated-payments/generate-schedule"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_il}", method: CURRENT_YEAR_ANNUALIZED }
              as: TaxManager
              captures: { q1: "$.data[0].scheduled_amount_cents", q2: "$.data[1].scheduled_amount_cents", q3: "$.data[2].scheduled_amount_cents", q4: "$.data[3].scheduled_amount_cents" }
          assert:
            - "quarter 1 scheduled_amount_cents == 552537  # round(2,210,149*1/4 - 0) = round(552,537.25)"
            - "quarter 2 scheduled_amount_cents == 552538  # round(1,105,074.50 - 552,537) = round(552,537.50) half-up"
            - "quarter 3 scheduled_amount_cents == 552537  # round(1,657,611.75 - 1,105,075)"
            - "quarter 4 scheduled_amount_cents == 552537  # round(2,210,149 - 1,657,612)"
            - "q1 + q2 + q3 + q4 == 2210149  # cumulative rounding conserves the annual estimate; naive per-quarter rounding would give 2,210,148"

  - rule_id: non_linear_state_machine
    instances:
      - name: book_tax_difference_review_rework_cycle
        grounds:
          - state_machines.BookTaxDifference.REVIEWED_to_IDENTIFIED
          - state_machines.BookTaxDifference.IDENTIFIED_to_REVIEWED
          - state_machines.BookTaxDifference.REVIEWED_to_LOCKED
        distinguishing_aspect: |
          Cyclic machine on BookTaxDifference: IDENTIFIED -> REVIEWED ->
          IDENTIFIED -> REVIEWED -> LOCKED traverses the rework loop once
          before terminating — a pure linear pipeline could not express the
          return-for-rework edge.
        test_recipe:
          setup:
            - "FY2026 TaxYear OPEN; jurisdiction US-FED; one TEMPORARY difference (5,000,000 book vs 2,000,000 tax)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/book-tax-differences"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", description: "accrued warranty", book_amount_cents: 5000000, tax_amount_cents: 2000000, difference_type: TEMPORARY }
              as: TaxAccountant
              captures: { diff1: $.data.id }
          trigger:
            - { call: "POST /tax/book-tax-differences/${diff1}/review", payload: {}, as: TaxManager }
            - { call: "POST /tax/book-tax-differences/${diff1}/return-for-rework", payload: {}, as: TaxManager, captures: { st_loop: $.data.status, v_loop: $.data.version } }
            - { call: "POST /tax/book-tax-differences/${diff1}/review", payload: {}, as: TaxManager }
            - { call: "POST /tax/book-tax-differences/${diff1}/lock", payload: {}, as: TaxManager, captures: { st_fin: $.data.status, v_fin: $.data.version } }
          assert:
            - "After loop-back: status == IDENTIFIED and version == 3 (create=1, review=2, rework=3)"
            - "After second review + lock: status == LOCKED and version == 5"
            - "DeferredTaxItem for ${diff1} exists with closing_balance_cents == 630000 (cascade fired exactly once, on the final lock)"

      - name: filing_reject_amend_refile_cycle
        grounds:
          - state_machines.Filing.FILED_to_REJECTED
          - state_machines.Filing.REJECTED_to_AMENDED
          - state_machines.Filing.AMENDED_to_READY
        distinguishing_aspect: |
          Cyclic machine on Filing (different entity from BookTaxDifference):
          READY -> FILED -> REJECTED -> AMENDED -> READY -> FILED loops the
          return through amendment; the Filing also carries the parallel
          extension_status dimension, which stays NONE throughout — two
          non-linear shapes on one entity.
        test_recipe:
          setup:
            - "FY2026 TaxYear PROVISION_LOCKED with zero differences, an APPROVED mltn=false allowance (0), no UTPs"
            - "US-FED jurisdiction; FED filing READY with liability 21,100,000 (estimate 21,000,000 stamped at lock)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id, ty_v0: $.data.version }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/filings"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", original_due_date: "2027-04-15" }
              as: TaxAccountant
              captures: { fil1: $.data.id }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: TaxManager
              captures: { ty_va_v: $.data.version }
            - call: "POST /tax/valuation-allowances"
              payload: { tax_year_id: "${ty_id}", more_likely_than_not: false, projected_taxable_income_cents: 0, reversing_dtl_cents: 0, expected_tax_year_version: "${ty_va_v}" }
              as: TaxManager
              as_user_id: "mgr-1"
              captures: { va1: $.data.id }
            - { call: "POST /tax/valuation-allowances/${va1}/submit", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
            - { call: "POST /tax/valuation-allowances/${va1}/approve", payload: {}, as: TaxDirector, as_user_id: "dir-1" }
            - { call: "POST /tax/tax-years/${ty_id}/lock-provision", payload: {}, as: TaxDirector }
            - { call: "POST /tax/filings/${fil1}/mark-ready", payload: { return_tax_liability_cents: 21100000 }, as: TaxAccountant }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: TaxDirector
              captures: { ty_v1: $.data.version }
            - { call: "POST /tax/filings/${fil1}/file", payload: { expected_tax_year_version: "${ty_v1}" }, as: TaxDirector }
          trigger:
            - { call: "POST /tax/filings/${fil1}/reject", payload: { rejection_reason: "schedule M-1 mismatch" }, as: TaxManager, captures: { st1: $.data.status } }
            - { call: "POST /tax/filings/${fil1}/amend", payload: { return_tax_liability_cents: 21100000 }, as: TaxAccountant, captures: { st2: $.data.status } }
            - { call: "POST /tax/filings/${fil1}/mark-ready", payload: { return_tax_liability_cents: 21100000 }, as: TaxAccountant, captures: { st3: $.data.status } }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: TaxDirector
              captures: { ty_v2: $.data.version }
            - { call: "POST /tax/filings/${fil1}/file", payload: { expected_tax_year_version: "${ty_v2}" }, as: TaxDirector, captures: { st4: $.data.status } }
          assert:
            - "State path: FILED -> REJECTED -> AMENDED -> READY -> FILED (st1==REJECTED, st2==AMENDED, st3==READY, st4==FILED)"
            - "Filing.${fil1}.extension_status == NONE throughout (parallel dimension untouched by the lifecycle cycle)"
            - "TaxYear.return_to_provision_adjustment_cents == 100000 after re-file (restored to the post-first-file value)"

  - rule_id: transitive_cascade
    instances:
      - name: difference_lock_cascade_depth3
        grounds:
          - state_machines.BookTaxDifference.REVIEWED_to_LOCKED
          - calculations.deferred_tax_movement
          - calculations.valuation_allowance_measurement
          - calculations.etr_calculation
        distinguishing_aspect: |
          Depth-3 cascade from the difference-lock trigger: lock ->
          DeferredTaxItem upsert (hop 1) -> TaxYear.deferred_expense_cents
          recompute (hop 2) -> TaxYear.forecast_etr_bp recompute (hop 3a),
          with a conditional hop 3b recomputing the DRAFT ValuationAllowance
          from the changed DTA pool. Three causal links across three entities,
          each hop caused by the previous one.
        test_recipe:
          setup:
            - "FY2026 TaxYear OPEN (book income 100,000,000, rate 2100 bp); jurisdiction US-FED"
            - "DRAFT valuation allowance (mltn=true, projected 1,000,000, reversing 100,000) created BEFORE any deferred item exists -> allowance 0"
            - "TEMPORARY difference 5,000,000 vs 2,000,000 in REVIEWED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id, ty_v0: $.data.version }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/valuation-allowances"
              payload: { tax_year_id: "${ty_id}", more_likely_than_not: true, projected_taxable_income_cents: 1000000, reversing_dtl_cents: 100000, expected_tax_year_version: "${ty_v0}" }
              as: TaxManager
              as_user_id: "mgr-1"
              captures: { va1: $.data.id, va1_amt0: $.data.allowance_amount_cents }
            - call: "POST /tax/book-tax-differences"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", description: "accrued warranty", book_amount_cents: 5000000, tax_amount_cents: 2000000, difference_type: TEMPORARY }
              as: TaxAccountant
              captures: { diff1: $.data.id }
            - { call: "POST /tax/book-tax-differences/${diff1}/review", payload: {}, as: TaxManager }
          trigger:
            - { call: "POST /tax/book-tax-differences/${diff1}/lock", payload: {}, as: TaxManager }
            - call: "GET /tax/deferred-tax-items"
              payload: { tax_year_id: "${ty_id}" }
              as: Auditor
              captures: { item_kind: "$.data[0].item_kind", item_mov: "$.data[0].movement_cents", item_close: "$.data[0].closing_balance_cents" }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: Auditor
              captures: { de: $.data.deferred_expense_cents, nda: $.data.net_deferred_asset_cents, fetr: $.data.forecast_etr_bp }
            - call: "GET /tax/valuation-allowances/${va1}"
              payload: {}
              as: Auditor
              captures: { va1_amt1: $.data.allowance_amount_cents }
          assert:
            - "Before lock: ValuationAllowance.${va1}.allowance_amount_cents == 0 (empty DTA pool -> realizable min(0, 310000) = 0)"
            - "Hop 1: DeferredTaxItem created with item_kind == ASSET, movement_cents == 630000, closing_balance_cents == 630000"
            - "Hop 2: TaxYear.deferred_expense_cents == -630000 and net_deferred_asset_cents == 630000"
            - "Hop 3a: TaxYear.forecast_etr_bp == -63  # (0 - 630,000 + 0 + 0) * 10000 / 100,000,000 = -63.0 (no filings -> current_provision 0)"
            - "Hop 3b: DRAFT ValuationAllowance.${va1}.allowance_amount_cents == 320000 after the lock (recomputed against the new 630,000 DTA)"

      - name: filing_file_triggers_rtp_and_payment_respread
        grounds:
          - state_machines.Filing.READY_to_FILED
          - calculations.rtp_trueup
          - entities.EstimatedPayment.fields.scheduled_amount_cents
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (Filing file, not difference
          lock): file -> TaxYear.return_to_provision_adjustment_cents recompute
          (hop 1) -> re-spread of the filed jurisdiction's SCHEDULED
          CURRENT_YEAR_ANNUALIZED payments (hop 2), with the +45,800 delta
          split 15,267/15,267/15,266 so the last quarter absorbs the remainder.
        test_recipe:
          setup:
            - "FY2026 fully provision-locked: FED + CA filings; estimates FED 20,946,618 / CA 2,254,200 (same stack as etr_forecast_vs_actual_divergence)"
            - "CA annualized schedule generated (4 x 552,500: annual round(100,000,000*2500*884/1e8) = 2,210,000); quarter 1 PAID in full"
            - "FED filed at 20,800,000 (delta -146,618; no FED payments exist to re-spread); CA about to be filed at 2,300,000 (delta +45,800 over 3 SCHEDULED quarters)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-CA", name: "California", level: STATE, statutory_rate_bp: 884, apportionment_pct_bp: 2500, return_due_month: 4, return_due_day: 15, extension_months: 7 }
              as: TaxManager
              captures: { jur_ca: $.data.id }
            - call: "POST /tax/book-tax-differences"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", description: "meals 50pct limitation", book_amount_cents: 2000000, tax_amount_cents: 0, difference_type: PERMANENT }
              as: TaxAccountant
              captures: { diff_perm: $.data.id }
            - { call: "POST /tax/book-tax-differences/${diff_perm}/review", payload: {}, as: TaxManager }
            - { call: "POST /tax/book-tax-differences/${diff_perm}/lock", payload: {}, as: TaxManager }
            - call: "POST /tax/filings"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", original_due_date: "2027-04-15" }
              as: TaxAccountant
              captures: { fil_fed: $.data.id }
            - call: "POST /tax/filings"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_ca}", original_due_date: "2027-04-15" }
              as: TaxAccountant
              captures: { fil_ca: $.data.id }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: TaxManager
              captures: { ty_v1: $.data.version }
            - call: "POST /tax/valuation-allowances"
              payload: { tax_year_id: "${ty_id}", more_likely_than_not: false, projected_taxable_income_cents: 0, reversing_dtl_cents: 0, expected_tax_year_version: "${ty_v1}" }
              as: TaxManager
              as_user_id: "mgr-1"
              captures: { va1: $.data.id }
            - { call: "POST /tax/valuation-allowances/${va1}/submit", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
            - { call: "POST /tax/valuation-allowances/${va1}/approve", payload: {}, as: TaxDirector, as_user_id: "dir-1" }
            - { call: "POST /tax/tax-years/${ty_id}/lock-provision", payload: {}, as: TaxDirector }
            - call: "POST /tax/estimated-payments/generate-schedule"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_ca}", method: CURRENT_YEAR_ANNUALIZED }
              as: TaxManager
              captures: { ca_q1: "$.data[0].id", ca_q2: "$.data[1].id", ca_q3: "$.data[2].id", ca_q4: "$.data[3].id" }
            - { call: "POST /tax/estimated-payments/${ca_q1}/record-payment", payload: { amount_cents: 552500 }, as: TaxAccountant }
            - { call: "POST /tax/filings/${fil_fed}/mark-ready", payload: { return_tax_liability_cents: 20800000 }, as: TaxAccountant }
            - { call: "POST /tax/filings/${fil_ca}/mark-ready", payload: { return_tax_liability_cents: 2300000 }, as: TaxAccountant }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: TaxDirector
              captures: { ty_v2: $.data.version }
            - { call: "POST /tax/filings/${fil_fed}/file", payload: { expected_tax_year_version: "${ty_v2}" }, as: TaxDirector }
          trigger:
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: TaxDirector
              captures: { ty_v3: $.data.version }
            - { call: "POST /tax/filings/${fil_ca}/file", payload: { expected_tax_year_version: "${ty_v3}" }, as: TaxDirector }
            - call: "GET /tax/estimated-payments"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_ca}" }
              as: Auditor
          assert:
            - "TaxYear.return_to_provision_adjustment_cents == -100818 after both filings (-146,618 + 45,800)"
            - "CA quarter 2 scheduled_amount_cents == 567767  # 552,500 + round_half_up(45,800/3)=15,267"
            - "CA quarter 3 scheduled_amount_cents == 567767"
            - "CA quarter 4 scheduled_amount_cents == 567766  # last quarter absorbs remainder: 45,800 - 2*15,267 = 15,266"
            - "CA quarter 1 scheduled_amount_cents == 552500 (PAID quarters are never re-spread) and paid_amount_cents == 552500"
            - "Sum of the three re-spread deltas == 45800 exactly (no rounding drift)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: payment_state_beats_fiscal_overpayment
        grounds:
          - validations[priority=4]
          - validations[priority=10]
          - errors[ERR_PAYMENT_ALREADY_SETTLED]
          - errors[ERR_OVERPAYMENT]
        distinguishing_aspect: |
          Error-category pair state (p4) vs business_fiscal (p10): recording a
          1-cent payment against an already-PAID quarter violates both the
          state machine (no record-payment transition from PAID) and the
          overpayment cap; the state error ERR_PAYMENT_ALREADY_SETTLED wins.
        test_recipe:
          setup:
            - "FY2026 TaxYear; US-IL annualized schedule; quarter 1 fully paid (552,537 == scheduled) -> PAID"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-IL", name: "Illinois", level: STATE, statutory_rate_bp: 883, apportionment_pct_bp: 2503, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_il: $.data.id }
            - call: "POST /tax/estimated-payments/generate-schedule"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_il}", method: CURRENT_YEAR_ANNUALIZED }
              as: TaxManager
              captures: { q1: "$.data[0].id" }
            - { call: "POST /tax/estimated-payments/${q1}/record-payment", payload: { amount_cents: 552537 }, as: TaxAccountant, captures: { st: $.data.status } }
          trigger:
            - call: "POST /tax/estimated-payments/${q1}/record-payment"
              payload: { amount_cents: 1 }
              as: TaxAccountant
              captures: { err: $.data.error_id }
          assert:
            - "Precondition established: quarter 1 status == PAID after paying exactly 552537"
            - "err == ERR_PAYMENT_ALREADY_SETTLED (state, priority 4) — NOT ERR_OVERPAYMENT (business_fiscal, priority 10), although 552537+1 > 552537 also holds"

      - name: filing_deadline_beats_utp_referential
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_FILING_DEADLINE_PASSED]
          - errors[ERR_UTP_UNDISCLOSED]
        distinguishing_aspect: |
          Error-category pair business_temporal (p8) vs business_referential
          (p9) — a different pair from payment_state_beats_fiscal_overpayment:
          filing after the due date while a disclosure-required UTP is still
          MEASURED violates both; the temporal error ERR_FILING_DEADLINE_PASSED
          wins.
        test_recipe:
          setup:
            - "FY2026 PROVISION_LOCKED: FED filing READY (liability 21,100,000); UTP 1,000,000 @4000 bp MEASURED with liability 1,000,000 (disclosure_required) and NOT disclosed"
            - "Clock advanced to 2027-04-16, one day past the unextended original due date 2027-04-15"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id, ty_v0: $.data.version }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/filings"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", original_due_date: "2027-04-15" }
              as: TaxAccountant
              captures: { fil1: $.data.id }
            - call: "POST /tax/uncertain-tax-positions"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", description: "transfer pricing", position_amount_cents: 1000000 }
              as: TaxAccountant
              captures: { utp1: $.data.id }
            - { call: "POST /tax/uncertain-tax-positions/${utp1}/measure", payload: { cumulative_probability_bp: 4000 }, as: TaxManager }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: TaxManager
              captures: { ty_va_v: $.data.version }
            - call: "POST /tax/valuation-allowances"
              payload: { tax_year_id: "${ty_id}", more_likely_than_not: false, projected_taxable_income_cents: 0, reversing_dtl_cents: 0, expected_tax_year_version: "${ty_va_v}" }
              as: TaxManager
              as_user_id: "mgr-1"
              captures: { va1: $.data.id }
            - { call: "POST /tax/valuation-allowances/${va1}/submit", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
            - { call: "POST /tax/valuation-allowances/${va1}/approve", payload: {}, as: TaxDirector, as_user_id: "dir-1" }
            - { call: "POST /tax/tax-years/${ty_id}/lock-provision", payload: {}, as: TaxDirector }
            - { call: "POST /tax/filings/${fil1}/mark-ready", payload: { return_tax_liability_cents: 21100000 }, as: TaxAccountant }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-16T00:00:00Z" }, as: PlatformAdmin }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: TaxDirector
              captures: { ty_v1: $.data.version }
          trigger:
            - call: "POST /tax/filings/${fil1}/file"
              payload: { expected_tax_year_version: "${ty_v1}" }
              as: TaxDirector
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FILING_DEADLINE_PASSED (business_temporal, priority 8) — NOT ERR_UTP_UNDISCLOSED (business_referential, priority 9), although the undisclosed UTP also blocks filing"

  - rule_id: boundary_precision_check
    instances:
      - name: utp_recognition_threshold_exact_50pct
        grounds:
          - calculations.utp_recognition_measurement
          - entities.UncertainTaxPosition.fields.recognized_benefit_cents
        distinguishing_aspect: |
          Strict-greater-than boundary on the probability metric via the
          measure endpoint: cumulative_probability_bp == 5000 exactly is NOT
          recognized (liability stays full), while 5001 is fully recognized —
          one basis point flips 1,000,000 of benefit.
        test_recipe:
          setup:
            - "FY2026 TaxYear OPEN; jurisdiction US-FED; two UTPs of 1,000,000 each"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/uncertain-tax-positions"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", description: "position at exactly 50 percent", position_amount_cents: 1000000 }
              as: TaxAccountant
              captures: { utp_a: $.data.id }
            - call: "POST /tax/uncertain-tax-positions"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", description: "position one bp above", position_amount_cents: 1000000 }
              as: TaxAccountant
              captures: { utp_b: $.data.id }
          trigger:
            - { call: "POST /tax/uncertain-tax-positions/${utp_a}/measure", payload: { cumulative_probability_bp: 5000 }, as: TaxManager, captures: { rec_a: $.data.recognized_benefit_cents, liab_a: $.data.liability_cents, dis_a: $.data.disclosure_required } }
            - { call: "POST /tax/uncertain-tax-positions/${utp_b}/measure", payload: { cumulative_probability_bp: 5001 }, as: TaxManager, captures: { rec_b: $.data.recognized_benefit_cents, liab_b: $.data.liability_cents, dis_b: $.data.disclosure_required } }
          assert:
            - "UTP ${utp_a} @5000 bp: recognized_benefit_cents == 0, liability_cents == 1000000, disclosure_required == true"
            - "UTP ${utp_b} @5001 bp: recognized_benefit_cents == 1000000, liability_cents == 0, disclosure_required == false"
            - "TaxYear.${ty_id}.utp_liability_cents == 1000000 (only the sub-threshold position contributes)"

      - name: payment_paid_in_full_vs_shortfall_at_sweep
        grounds:
          - calculations.underpayment_penalty
          - state_machines.EstimatedPayment.SCHEDULED_to_LATE
        distinguishing_aspect: |
          Zero-boundary on the shortfall metric via a different endpoint (the
          clock sweep, not measure): a quarter whose paid == scheduled exactly
          at its due date never enters LATE and owes 0 penalty, while the
          sibling quarter 1,000 cents short enters LATE with penalty 40.
        test_recipe:
          setup:
            - "FY2026 TaxYear; US-IL annualized schedule (q1 552,537 due 2026-04-15; q2 552,538 due 2026-07-15)"
            - "q1 paid in full (552,537); q2 paid 551,538 (shortfall 1,000)"
            - "Clock advanced to 2026-07-16 — past both due dates"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-IL", name: "Illinois", level: STATE, statutory_rate_bp: 883, apportionment_pct_bp: 2503, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_il: $.data.id }
            - call: "POST /tax/estimated-payments/generate-schedule"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_il}", method: CURRENT_YEAR_ANNUALIZED }
              as: TaxManager
              captures: { q1: "$.data[0].id", q2: "$.data[1].id" }
            - { call: "POST /tax/estimated-payments/${q1}/record-payment", payload: { amount_cents: 552537 }, as: TaxAccountant }
            - { call: "POST /tax/estimated-payments/${q2}/record-payment", payload: { amount_cents: 551538 }, as: TaxAccountant }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-16T00:00:00Z" }
              as: PlatformAdmin
              captures: { late_ids: $.data.late_payment_ids }
            - call: "GET /tax/estimated-payments/${q1}"
              payload: {}
              as: Auditor
              captures: { q1_st: $.data.status, q1_pen: $.data.penalty_cents }
            - call: "GET /tax/estimated-payments/${q2}"
              payload: {}
              as: Auditor
              captures: { q2_st: $.data.status, q2_pen: $.data.penalty_cents }
          assert:
            - "Quarter 1 (paid == scheduled exactly): status == PAID, penalty_cents == 0 — the sweep condition paid < scheduled is strict"
            - "Quarter 2 (shortfall 1,000): status == LATE, penalty_cents == 40  # round_half_up(1,000 * 400/10000)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: provision_lock_blocked_by_unlocked_differences
        grounds:
          - state_machines.TaxYear.OPEN_to_PROVISION_LOCKED
          - errors[ERR_UNRESOLVED_PROVISION_ITEMS]
        distinguishing_aspect: |
          Entity pair BookTaxDifference -> TaxYear: the year's lock transition
          is gated on every child difference being terminal (LOCKED/REJECTED);
          a single REVIEWED difference blocks with ERR_UNRESOLVED_PROVISION_ITEMS
          until that child transitions.
        test_recipe:
          setup:
            - "FY2026 TaxYear OPEN; jurisdiction US-FED; one PERMANENT difference stuck in REVIEWED; APPROVED valuation allowance present"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id, ty_v0: $.data.version }
            - call: "POST /tax/jurisdictions"
