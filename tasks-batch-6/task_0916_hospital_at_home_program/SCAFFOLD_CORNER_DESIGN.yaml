              captures: { ep_cc: $.data.id }
            - call: "POST /delivery-orders"
              payload: { episode_id: "${ep_cc}", order_kind: "MEDICATION", is_controlled: false, cold_chain_required: true, weight_kg: 1.0, requested_by_user_id: "log-1" }
              as: LogisticsCoordinator
              captures: { do_ok: $.data.id }
            - call: "POST /delivery-orders"
              payload: { episode_id: "${ep_cc}", order_kind: "MEDICATION", is_controlled: false, cold_chain_required: true, weight_kg: 1.0, requested_by_user_id: "log-1" }
              as: LogisticsCoordinator
              captures: { do_bad: $.data.id }
            - call: "POST /delivery-orders/${do_ok}/authorize"
              payload: {}
              as: PharmacyAuthorizer
              as_user_id: "pharm-9"
            - call: "POST /delivery-orders/${do_bad}/authorize"
              payload: {}
              as: PharmacyAuthorizer
              as_user_id: "pharm-9"
            - call: "POST /delivery-orders/${do_ok}/dispatch"
              payload: {}
