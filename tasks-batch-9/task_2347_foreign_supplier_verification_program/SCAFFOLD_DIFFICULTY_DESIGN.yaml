              as: QualifiedIndividual
              as_user_id: "${qi_b}"
              captures: { rec_ok: $.data.id }
          assert:
            - "TOUCHING cool-off — first probe HTTP status == 409"
            - "TOUCHING cool-off — first probe error_id == ERR_AUDIT_WINDOW_CONFLICT"
            - "ONE DAY LATER — second probe HTTP status == 201"
            - "VerificationRecord.${rec_ok}.record_status == RECEIVED"
