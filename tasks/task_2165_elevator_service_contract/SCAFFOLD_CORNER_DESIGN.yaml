              payload: { contract_id: "${cc4_id}", car_code: "CAR-CC4C", car_type: "TRACTION", capacity_lbs: 3000 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { car_cc4c: $.data.id }
          trigger:
            - call: "POST /elevator-program/callbacks"
              payload: { car_id: "${car_cc4a}", callback_type: "MALFUNCTION", out_of_service: true }
              as: BuildingManager
              as_user_id: "bm-c4x"
              captures: { cb_cc4a: $.data.id }
            - call: "POST /elevator-program/callbacks"
              payload: { car_id: "${car_cc4b}", callback_type: "MALFUNCTION", out_of_service: true }
              as: BuildingManager
              as_user_id: "bm-c4x"
              captures: { cb_cc4b: $.data.id }
          assert:
            - "after trigger[0]: ServiceContract.${cc4_id}.cars_out_of_service_count == 1"
            - "after trigger[0]: ServiceContract.${cc4_id}.status == \"ACTIVE\""
            - "after trigger[1]: ServiceContract.${cc4_id}.cars_out_of_service_count == 2"
            - "after trigger[1]: ServiceContract.${cc4_id}.status == \"SERVICE_ALERT\""
            - "ElevatorCar.${car_cc4c}.availability_state == \"IN_SERVICE\""
            - "ElevatorCar.${car_cc4a}.unplanned_outage_open_since == \"2026-08-01T00:00:00.000Z\""

      - name: service_alert_blocks_new_downtime_windows_on_the_contract
        claim_type: conditional_feature_flags
        grounds:
          - state_machines.ServiceContract.status.ACTIVE_to_SERVICE_ALERT
          - validations[priority=72]
          - errors[ERR_CONTRACT_NOT_ACTIVE]
        distinguishing_aspect: "SERVICE_ALERT is not a free-standing label: while the contract sits in it, POST /elevator-program/downtime-windows on the still-healthy third car returns 409 ERR_CONTRACT_NOT_ACTIVE, and the same request succeeds once one callback is cleared and the contract returns to ACTIVE."
        test_recipe:
          setup:
            - "One contract with three cars where two cars carry open out-of-service callbacks, so cars_out_of_service_count is 2 and status is SERVICE_ALERT."
            - "The third car CAR-CC5C is IN_SERVICE with no windows."
          setup_api_calls:
            - call: "POST /elevator-program/contracts"
              payload: { building_name: "Cc Five", building_address: "5 Cc St", jurisdiction_code: "NY-NYC", fire_district_code: "FD-07", building_manager_user_id: "bm-c5x", contractor_user_id: "sc-c5x", scope_type: "FULL_MAINTENANCE", penalty_schedule: "SCHEDULE_A", monthly_base_fee_cents: 400000, callback_response_minutes: 60, entrapment_response_minutes: 30, term_start_date: "2026-01-01", term_end_date: "2027-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { cc5_id: $.data.id }
            - call: "POST /elevator-program/contracts/${cc5_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/cars"
              payload: { contract_id: "${cc5_id}", car_code: "CAR-CC5A", car_type: "TRACTION", capacity_lbs: 3000 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { car_cc5a: $.data.id }
            - call: "POST /elevator-program/cars"
              payload: { contract_id: "${cc5_id}", car_code: "CAR-CC5B", car_type: "TRACTION", capacity_lbs: 3000 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { car_cc5b: $.data.id }
            - call: "POST /elevator-program/cars"
              payload: { contract_id: "${cc5_id}", car_code: "CAR-CC5C", car_type: "TRACTION", capacity_lbs: 3000 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { car_cc5c: $.data.id }
            - call: "POST /elevator-program/callbacks"
              payload: { car_id: "${car_cc5a}", callback_type: "MALFUNCTION", out_of_service: true }
              as: BuildingManager
              as_user_id: "bm-c5x"
              captures: { cb_cc5a: $.data.id }
            - call: "POST /elevator-program/callbacks"
              payload: { car_id: "${car_cc5b}", callback_type: "MALFUNCTION", out_of_service: true }
              as: BuildingManager
              as_user_id: "bm-c5x"
              captures: { cb_cc5b: $.data.id }
            - call: "POST /elevator-program/callbacks/${cb_cc5a}/arrive"
              payload: {}
              as: ServiceContractor
              as_user_id: "sc-c5x"
          trigger:
            - call: "POST /elevator-program/downtime-windows"
              payload: { car_id: "${car_cc5c}", window_type: "REPAIR", window_start: "2026-09-10T08:00:00Z", window_end: "2026-09-10T12:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { e_cc5: $.data.error_id }
            - call: "POST /elevator-program/callbacks/${cb_cc5a}/clear"
              payload: { resolution_note: "fixed" }
              as: ServiceContractor
              as_user_id: "sc-c5x"
            - call: "POST /elevator-program/downtime-windows"
              payload: { car_id: "${car_cc5c}", window_type: "REPAIR", window_start: "2026-09-10T08:00:00Z", window_end: "2026-09-10T12:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { w_cc5: $.data.id }
          assert:
            - "trigger[0] HTTP status == 409"
            - "${e_cc5} == \"ERR_CONTRACT_NOT_ACTIVE\""
            - "after trigger[0]: ElevatorCar.${car_cc5c}.scheduled_downtime_minutes == 0"
            - "after trigger[1]: ServiceContract.${cc5_id}.cars_out_of_service_count == 1"
            - "after trigger[1]: ServiceContract.${cc5_id}.status == \"ACTIVE\""
            - "trigger[2] HTTP status == 201"
            - "DowntimeWindow.${w_cc5}.status == \"SCHEDULED\""
            - "DowntimeWindow.${w_cc5}.duration_minutes == 240"
            - "ElevatorCar.${car_cc5c}.scheduled_downtime_minutes == 240"

      - name: cascading_side_effects_layer_is_already_probed_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ServiceContract.status.ACTIVE_to_SERVICE_ALERT
          - calculations.downtime_window_shift
        excluded_because:
          difficulty_instance: transitive_cascade / inspection_fail_red_tags_car_then_pulls_it_from_service_then_alerts_contract
          rationale: "The depth-4 inspection cascade and the depth-3 part-substitution cascade in §1.8 already verify N-level propagation and ordering sensitivity end to end."

      - name: dual_variant_calculation_layer_is_already_probed
        claim_type: dual_variant_calculation
        grounds:
          - calculations.car_uptime_percentage
          - calculations.penalty_assessment_amount
        excluded_because:
          difficulty_instance: dual_variant_calc / uptime_exclusive_vs_inclusive_diverge_on_same_car
          rationale: "Both variant pairs and their divergent deltas are asserted with literal expected values in §1.8."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: every_cascade_is_visible_in_the_triggering_response_immediately
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /elevator-program/inspections/{inspectionId}/record-result]
        distinguishing_aspect: "consistency_model is immediate: the record-result response itself already reports result FAIL and status COMPLETED, and an immediately following read of the car - with no intervening write and no clock advance - shows RED_TAGGED and OUT_OF_SERVICE with no lag."
        test_recipe:
          setup: ["One ACTIVE contract with one car and one SCHEDULED PERIODIC inspection."]
          setup_api_calls:
            - call: "POST /elevator-program/contracts"
              payload: { building_name: "Cm One", building_address: "1 Cm St", jurisdiction_code: "NY-NYC", fire_district_code: "FD-07", building_manager_user_id: "bm-m1", contractor_user_id: "sc-m1", scope_type: "FULL_MAINTENANCE", penalty_schedule: "SCHEDULE_A", monthly_base_fee_cents: 400000, callback_response_minutes: 60, entrapment_response_minutes: 30, term_start_date: "2026-01-01", term_end_date: "2027-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { cm1_id: $.data.id }
            - call: "POST /elevator-program/contracts/${cm1_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/cars"
              payload: { contract_id: "${cm1_id}", car_code: "CAR-CM1", car_type: "TRACTION", capacity_lbs: 3000 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { car_cm1: $.data.id, car_cm1_v0: $.data.version }
            - call: "POST /elevator-program/inspections"
              payload: { car_id: "${car_cm1}", inspection_type: "PERIODIC", scheduled_date: "2026-08-01" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { i_cm1: $.data.id }
          trigger:
            - call: "POST /elevator-program/inspections/${i_cm1}/record-result"
              payload: { result: "FAIL", deficiency_codes: ["SAFETY-01"] }
              as: StateInspector
              as_user_id: "si-1"
              captures: { i_cm1_result: $.data.result, i_cm1_status: $.data.status }
            - call: "GET /elevator-program/cars/${car_cm1}"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { car_cm1_state: $.data.availability_state, car_cm1_comp: $.data.compliance_state, car_cm1_v1: $.data.version }
          assert:
            - "${i_cm1_result} == \"FAIL\""
            - "${i_cm1_status} == \"COMPLETED\""
            - "${car_cm1_comp} == \"RED_TAGGED\""
            - "${car_cm1_state} == \"OUT_OF_SERVICE\""
            - "${car_cm1_v1} > ${car_cm1_v0}"
            - "ServiceContract.${cm1_id}.cars_out_of_service_count == 1"
            - "ServiceContract.${cm1_id}.status == \"ACTIVE\""
