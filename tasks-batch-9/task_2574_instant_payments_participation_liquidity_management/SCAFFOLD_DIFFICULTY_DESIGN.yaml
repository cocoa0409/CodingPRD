          assert:
            - "The response is HTTP 201 and CreditTransfer.fraud_score == 60 (28 baseline + 2 * min(10, floor(1000000 / 100000)) = 20 + velocity 0 + new-beneficiary 12, times the CONSUMER multiplier 1.00)"
