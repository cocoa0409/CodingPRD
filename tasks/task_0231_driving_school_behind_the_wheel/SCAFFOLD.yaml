scenario: |
  Driving School & Behind-the-Wheel: course enrollment (classroom/online/road), instructor & vehicle scheduling, required-hour tracking, permit-to-license milestones, completion certificate to DMV, package/refund, no-show, parent/teen portal

domain_name: driving-school-behind-the-wheel
api_prefix: ""

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency        # OCC on Lesson scheduling against Student.version
    - cascading_side_effects        # cancel/refund chains across Enrollment, Lesson, Student, Certificate
    - dual_variant_calculation      # refund: PRO_RATA vs SCHEDULE_TIER
    - derived_field_reconciliation  # student hour ledgers + readiness_score recomputed on lesson lifecycle

  entity_topology: flat
  # Peer entities linked by FK (Student, Enrollment, Lesson, Instructor, Vehicle,
  # Certificate, NoShowStrike, GuardianConsent, CoursePackage, WalletEntry). No
  # nesting in URL paths; children carry explicit FK fields.

  state_machine_shape: branching
  # Enrollment: branching with revert (refund/cancel rollback). Lesson: branching
  # (SCHEDULED -> {COMPLETED, NO_SHOW, CANCELLED}) with divergent side-effects.
  # Student permit-to-license: cyclic-capable milestone progression.

  relationship_patterns:
    - one_to_many        # Student -> Enrollment, Student -> Lesson, Student -> WalletEntry
    - flat_fk            # Lesson -> Instructor, Lesson -> Vehicle, Enrollment -> CoursePackage
    - cross_aggregate    # Lesson references Instructor & Vehicle across aggregate boundary

  role_model: peer_roles
  # SchoolAdmin (operator), Instructor (owns own lessons/availability), Student
  # (acts on own enrollments/lessons), Guardian (consents for minor students).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CoursePackage
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: Server-minted UUID, identity only.
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC, three fractional digits.
      - name: code
        type: string
        source: input
        description: Unique human code for the package (e.g., "TEEN_FULL").
        constraints: Unique across CoursePackage; non-empty.
      - name: name
        type: string
        source: input
        description: Display name.
      - name: price_cents
        type: integer
        source: input
        description: Total package price in integer cents (before discounts).
        constraints: ">= 0"
      - name: enrollment_fee_cents
        type: integer
        source: input
        description: Non-refundable enrollment fee portion in cents.
        constraints: ">= 0 and <= price_cents"
      - name: included_classroom_hours
        type: number
        source: input
        description: Classroom hours included in this package.
        constraints: ">= 0"
      - name: included_online_hours
        type: number
        source: input
        description: Online-course hours included in this package.
        constraints: ">= 0"
      - name: included_road_hours
        type: number
        source: input
        description: Behind-the-wheel road hours included in this package.
        constraints: ">= 0"
      - name: bundle_discount_cents
        type: integer
        source: input
        description: Flat discount applied when enrollment covers both classroom and road tracks.
        default: 0
        constraints: ">= 0"
      - name: active
        type: boolean
        source: input
        description: Whether the package is offered for new enrollments.
        default: true

  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Student legal name.
      - name: email
        type: string
        source: input
        description: Contact email; unique across Student.
        constraints: Unique; non-empty.
      - name: date_of_birth
        type: datetime
        source: input
        description: DOB as ISO 8601 date; used to derive is_minor against current clock.
      - name: is_minor
        type: boolean
        source: computed
        description: Computed true when age < 18 at current server clock; gates Guardian consent requirement.
      - name: permit_number
        type: string
        source: input
        description: DMV learner-permit number; required before any ROAD lesson is scheduled.
        default: null
      - name: status
        type: enum
        source: computed
        description: Permit-to-license milestone state. See §1.2 Student state machine.
        constraints: One of PROSPECT, ENROLLED, PERMITTED, ROAD_READY, CERTIFIED, LICENSED.
      - name: completed_classroom_hours
        type: number
        source: computed
        description: Sum of COMPLETED CLASSROOM Lesson.duration_hours for this student.
        default: 0
      - name: completed_online_hours
        type: number
        source: computed
        description: Sum of COMPLETED ONLINE Lesson.duration_hours for this student.
        default: 0
      - name: completed_road_hours
        type: number
        source: computed
        description: Sum of COMPLETED ROAD Lesson.duration_hours for this student.
        default: 0
      - name: scheduled_road_hours
        type: number
        source: computed
        description: Sum of SCHEDULED (not yet completed/cancelled) ROAD Lesson.duration_hours.
        default: 0
      - name: readiness_score
        type: number
        source: computed
        description: Weighted milestone readiness in [0,1]; see calc certificate_readiness_score.
        default: 0
      - name: no_show_count
        type: integer
        source: computed
        description: Count of NoShowStrike rows for this student; drives escalating no-show fees.
        default: 0
      - name: wallet_balance_cents
        type: integer
        source: computed
        description: Sum of WalletEntry.amount_cents for this student (credits positive, debits negative).
        default: 0

  - name: GuardianConsent
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: FK -> Student.id; the minor student this consent authorizes.
      - name: guardian_name
        type: string
        source: input
        description: Guardian legal name.
      - name: guardian_email
        type: string
        source: input
        description: Guardian contact email; the X-User-ID for Guardian role equals this consent's id.
      - name: relationship
        type: enum
        source: input
        description: Guardian relationship to student.
        constraints: One of PARENT, LEGAL_GUARDIAN.
      - name: status
        type: enum
        source: computed
        description: Consent lifecycle. See §1.2 GuardianConsent state machine.
        constraints: One of PENDING, GRANTED, REVOKED.

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: FK -> Student.id; the enrolled student.
      - name: package_id
        type: string
        source: input
        description: FK -> CoursePackage.id; the purchased package.
      - name: promo_code
        type: string
        source: input
        description: Optional promo code applied at activation (e.g., "FLAT10" for 10% off).
        default: null
      - name: status
        type: enum
        source: computed
        description: Enrollment lifecycle. See §1.2 Enrollment state machine.
        constraints: One of DRAFT, ACTIVE, COMPLETED, CANCELLED, REFUNDED.
      - name: final_price_cents
        type: integer
        source: computed
        description: Net charged price after discount stacking; see calc enrollment_final_price.
        default: 0
      - name: amount_paid_cents
        type: integer
        source: computed
        description: Total cents the student has paid against this enrollment.
        default: 0
      - name: refund_method
        type: enum
        source: computed
        description: Refund algorithm chosen at cancel time; null until cancelled.
        default: null
        constraints: One of PRO_RATA, SCHEDULE_TIER, null.
      - name: refunded_cents
        type: integer
        source: computed
        description: Cents refunded on cancellation; see calc enrollment_refund_amount.
        default: 0
      - name: activated_at
        type: datetime
        source: computed
        description: Server clock timestamp when enrollment moved DRAFT->ACTIVE; baseline for SCHEDULE_TIER refund.
        default: null

  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Instructor name.
      - name: email
        type: string
        source: input
        description: Instructor email; the X-User-ID for Instructor role equals this instructor's id.
        constraints: Unique; non-empty.
      - name: certified_road
        type: boolean
        source: input
        description: Whether the instructor may teach ROAD (behind-the-wheel) lessons.
        default: false
      - name: hourly_rate_cents
        type: integer
        source: input
        description: Instructor pay rate per hour in cents; used in payout calc.
        constraints: ">= 0"
      - name: active
        type: boolean
        source: input
        description: Whether the instructor accepts new lesson assignments.
        default: true

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - name: plate
        type: string
        source: input
        description: License plate; unique across Vehicle.
        constraints: Unique; non-empty.
      - name: dual_control
        type: boolean
        source: input
        description: Whether the vehicle has dual-control pedals (required for ROAD lessons).
        default: false
      - name: prep_buffer_minutes
        type: integer
        source: input
        description: Mandatory cleaning/fueling buffer enforced AFTER each lesson on this vehicle.
        default: 0
        constraints: ">= 0"
      - name: out_of_service
        type: boolean
        source: input
        description: Whether the vehicle is withdrawn from scheduling.
        default: false

  - name: Lesson
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: FK -> Student.id; the student attending.
      - name: enrollment_id
        type: string
        source: input
        description: FK -> Enrollment.id; the enrollment funding this lesson's hours.
      - name: instructor_id
        type: string
        source: input
        description: FK -> Instructor.id; assigned instructor (required for CLASSROOM and ROAD).
        default: null
      - name: vehicle_id
        type: string
        source: input
        description: FK -> Vehicle.id; assigned vehicle (required for ROAD only).
        default: null
      - name: lesson_type
        type: enum
        source: input
        description: Track of the lesson.
        constraints: One of CLASSROOM, ONLINE, ROAD.
      - name: start_at
        type: datetime
        source: input
        description: Lesson start time, ISO 8601 UTC. Interval is half-open [start_at, end_at).
      - name: end_at
        type: datetime
        source: input
        description: Lesson end time, ISO 8601 UTC; must be strictly after start_at.
      - name: duration_hours
        type: number
        source: computed
        description: (end_at - start_at) in hours, rounded to 2 decimals; counted toward hour ledgers.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Lesson lifecycle. See §1.2 Lesson state machine.
        constraints: One of SCHEDULED, COMPLETED, NO_SHOW, CANCELLED.
      - name: instructor_payout_cents
        type: integer
        source: computed
        description: Instructor pay for this lesson once COMPLETED; see calc instructor_lesson_payout.
        default: 0

  - name: NoShowStrike
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: Server-minted UUID, identity only.
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC, three fractional digits; chronological order key for strike escalation.
      - name: student_id
        type: string
        source: input
        description: FK -> Student.id; the student who missed the lesson.
      - name: lesson_id
        type: string
        source: input
        description: FK -> Lesson.id; the missed lesson.
      - name: strike_index
        type: integer
        source: computed
        description: 1-based ordinal of this strike for the student (by created_at); drives fee tier.
      - name: fee_charged_cents
        type: integer
        source: computed
        description: No-show fee debited for this strike; see calc no_show_fee.

  - name: WalletEntry
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: Server-minted UUID, identity only.
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC, three fractional digits.
      - name: student_id
        type: string
        source: input
        description: FK -> Student.id; wallet owner.
      - name: amount_cents
        type: integer
        source: input
        description: Signed amount; positive = credit (refund), negative = debit (no-show fee charge).
      - name: reason
        type: enum
        source: input
        description: Origin of the wallet movement.
        constraints: One of REFUND_CREDIT, NO_SHOW_DEBIT, ADMIN_ADJUSTMENT.
      - name: enrollment_id
        type: string
        source: input
        description: FK -> Enrollment.id; the enrollment that produced this entry, when applicable.
        default: null

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: FK -> Student.id; the certified student.
      - name: enrollment_id
        type: string
        source: input
        description: FK -> Enrollment.id; the enrollment whose hours satisfied certification.
      - name: dmv_reference
        type: string
        source: computed
        description: DMV submission reference, minted on issuance.
        default: null
      - name: readiness_score_at_issue
        type: number
        source: computed
        description: Snapshot of Student.readiness_score at issuance (must be 1.0).
      - name: status
        type: enum
        source: computed
        description: Certificate lifecycle. See §1.2 Certificate state machine.
        constraints: One of ISSUED, SUBMITTED, ACCEPTED, REJECTED.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: GuardianConsent
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /guardian-consents/{id}/grant"
        actor: Guardian
        preconditions:
          - "GuardianConsent.status == PENDING"
        side_effects:
          - "Set GuardianConsent.status = GRANTED"
          - "increments GuardianConsent.version by 1"
      - from: GRANTED
        to: REVOKED
        trigger: "POST /guardian-consents/{id}/revoke"
        actor: Guardian
        preconditions:
          - "GuardianConsent.status == GRANTED"
        side_effects:
          - "Set GuardianConsent.status = REVOKED"
          - "increments GuardianConsent.version by 1"
        note: "Revocation does not retroactively cancel COMPLETED lessons; it only blocks scheduling new ROAD lessons for the minor."

  - entity: Student
    initial_state: PROSPECT
    terminal_states: [LICENSED]
    transitions:
      - from: PROSPECT
        to: ENROLLED
        trigger: "system: Enrollment for this student transitions DRAFT->ACTIVE"
        actor: system
        preconditions:
          - "Student.status == PROSPECT"
        side_effects:
          - "Set Student.status = ENROLLED"
          - "increments Student.version by 1"
      - from: ENROLLED
        to: PERMITTED
        trigger: "POST /students/{id}/record-permit"
        actor: SchoolAdmin
        preconditions:
          - "Student.status == ENROLLED"
          - "request supplies non-empty permit_number"
        side_effects:
          - "Set Student.permit_number and Student.status = PERMITTED"
          - "increments Student.version by 1"
      - from: PERMITTED
        to: ROAD_READY
        trigger: "system: a ROAD Lesson transitions to COMPLETED that brings completed_road_hours >= MIN_ROAD_HOURS"
        actor: system
        preconditions:
          - "Student.status == PERMITTED"
          - "Student.completed_road_hours >= MIN_ROAD_HOURS after this completion"
        side_effects:
          - "Set Student.status = ROAD_READY"
          - "increments Student.version by 1"
      - from: ROAD_READY
        to: CERTIFIED
        trigger: "POST /students/{id}/certificate (certificate issuance)"
        actor: SchoolAdmin
        preconditions:
          - "Student.status == ROAD_READY"
          - "Student.readiness_score == 1.0"
        side_effects:
          - "Set Student.status = CERTIFIED"
          - "Create Certificate in ISSUED for this student"
          - "increments Student.version by 1"
      - from: CERTIFIED
        to: LICENSED
        trigger: "system: the student's Certificate transitions to ACCEPTED by DMV"
        actor: system
        preconditions:
          - "Student.status == CERTIFIED"
          - "Certificate.status == ACCEPTED"
        side_effects:
          - "Set Student.status = LICENSED"
          - "increments Student.version by 1"
      - from: ROAD_READY
        to: PERMITTED
        trigger: "system: a COMPLETED ROAD Lesson is cancelled, dropping completed_road_hours below MIN_ROAD_HOURS"
        actor: system
        preconditions:
          - "Student.status == ROAD_READY"
          - "Student.completed_road_hours < MIN_ROAD_HOURS after the reversal"
        side_effects:
          - "Set Student.status = PERMITTED (regression)"
          - "increments Student.version by 1"
        note: "Cyclic revert: ROAD_READY can fall back to PERMITTED when completed road hours drop below the floor."

  - entity: Enrollment
    initial_state: DRAFT
    terminal_states: [REFUNDED, CANCELLED, COMPLETED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /enrollments/{id}/activate"
        actor: SchoolAdmin
        preconditions:
          - "Enrollment.status == DRAFT"
          - "CoursePackage.active == true"
          - "if Student.is_minor: a GuardianConsent for this student exists with status == GRANTED"
        side_effects:
          - "Compute Enrollment.final_price_cents via calc enrollment_final_price"
          - "Set Enrollment.amount_paid_cents = final_price_cents"
          - "Set Enrollment.activated_at = current clock"
          - "Set Enrollment.status = ACTIVE"
          - "Create WalletEntry(amount = +0) is NOT created; payment recorded on enrollment only"
          - "If Student.status == PROSPECT, bubble Student PROSPECT->ENROLLED"
          - "increments Enrollment.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /enrollments/{id}/complete"
        actor: SchoolAdmin
        preconditions:
          - "Enrollment.status == ACTIVE"
          - "Student linked to a Certificate in status ISSUED, SUBMITTED, or ACCEPTED for this enrollment"
        side_effects:
          - "Set Enrollment.status = COMPLETED"
          - "increments Enrollment.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /enrollments/{id}/cancel"
        actor: SchoolAdmin
        preconditions:
          - "Enrollment.status == ACTIVE"
          - "no Lesson under this enrollment is in COMPLETED status (compensation only valid pre-completion)"
        side_effects:
          - "Cascade-cancel every SCHEDULED Lesson under this enrollment (Lesson SCHEDULED->CANCELLED), which itself returns scheduled_road_hours to the student ledger"
          - "Set Enrollment.status = CANCELLED"
          - "increments Enrollment.version by 1"
        note: "CANCELLED is a clean teardown with no money movement (no lessons consumed)."
      - from: ACTIVE
        to: REFUNDED
        trigger: "POST /enrollments/{id}/refund"
        actor: SchoolAdmin
        preconditions:
          - "Enrollment.status == ACTIVE"
          - "request supplies refund_method in {PRO_RATA, SCHEDULE_TIER} and refund_destination in {WALLET}"
        side_effects:
          - "Cascade-cancel every SCHEDULED Lesson under this enrollment (SCHEDULED->CANCELLED); each releases scheduled_road_hours back to the student ledger"
          - "Compute Enrollment.refunded_cents via calc enrollment_refund_amount using the chosen refund_method"
          - "Set Enrollment.refund_method and Enrollment.refunded_cents"
          - "Create WalletEntry(student_id, amount = +refunded_cents, reason = REFUND_CREDIT, enrollment_id) which raises Student.wallet_balance_cents"
          - "Set Enrollment.status = REFUNDED"
          - "increments Enrollment.version by 1"

  - entity: Lesson
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /lessons/{id}/complete"
        actor: Instructor
        preconditions:
          - "Lesson.status == SCHEDULED"
          - "current clock >= Lesson.end_at"
          - "if lesson_type == ROAD: GuardianConsent need not be re-checked at completion"
        side_effects:
          - "Set Lesson.status = COMPLETED"
          - "Recompute Student completed_<type>_hours (add duration_hours); for ROAD also subtract duration_hours from scheduled_road_hours"
          - "Compute Lesson.instructor_payout_cents via calc instructor_lesson_payout"
          - "Recompute Student.readiness_score via calc certificate_readiness_score"
          - "If lesson_type == ROAD and completed_road_hours now >= MIN_ROAD_HOURS and Student.status == PERMITTED: bubble Student PERMITTED->ROAD_READY"
          - "increments Student.version by 1"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /lessons/{id}/no-show"
        actor: SchoolAdmin
        preconditions:
          - "Lesson.status == SCHEDULED"
          - "current clock >= Lesson.start_at"
        side_effects:
          - "Set Lesson.status = NO_SHOW"
          - "Create NoShowStrike(student_id, lesson_id) with strike_index = Student.no_show_count + 1 (by created_at order)"
          - "Compute NoShowStrike.fee_charged_cents via calc no_show_fee using strike_index"
          - "If fee_charged_cents > 0: create WalletEntry(amount = -fee_charged_cents, reason = NO_SHOW_DEBIT) which lowers Student.wallet_balance_cents"
          - "For ROAD lessons: subtract duration_hours from scheduled_road_hours (hour was forfeited, not consumed)"
          - "Recompute Student.no_show_count"
          - "increments Student.version by 1"
        note: "Strike index and fee escalation are chronological by NoShowStrike.created_at; ties impossible because strikes are created one per request."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /lessons/{id}/cancel"
        actor: Student
        preconditions:
          - "Lesson.status == SCHEDULED"
          - "current clock < Lesson.start_at - CANCEL_CUTOFF_HOURS (cannot cancel inside the cutoff window)"
        side_effects:
          - "Set Lesson.status = CANCELLED"
          - "For ROAD lessons: subtract duration_hours from scheduled_road_hours (released back to the enrollment)"
          - "increments Student.version by 1"

  - entity: Certificate
    initial_state: ISSUED
    terminal_states: [ACCEPTED]
    transitions:
      - from: ISSUED
        to: SUBMITTED
        trigger: "POST /certificates/{id}/submit"
        actor: SchoolAdmin
        preconditions:
          - "Certificate.status == ISSUED"
        side_effects:
          - "Mint Certificate.dmv_reference"
          - "Set Certificate.status = SUBMITTED"
          - "increments Certificate.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /certificates/{id}/dmv-callback (outcome=ACCEPTED)"
        actor: SchoolAdmin
        preconditions:
          - "Certificate.status == SUBMITTED"
        side_effects:
          - "Set Certificate.status = ACCEPTED"
          - "Bubble Student CERTIFIED->LICENSED"
          - "increments Certificate.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /certificates/{id}/dmv-callback (outcome=REJECTED)"
        actor: SchoolAdmin
        preconditions:
          - "Certificate.status == SUBMITTED"
        side_effects:
          - "Set Certificate.status = REJECTED"
          - "increments Certificate.version by 1"
        note: "REJECTED is non-terminal in the sense it can be re-submitted: REJECTED->SUBMITTED reopens the loop."
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /certificates/{id}/submit"
        actor: SchoolAdmin
        preconditions:
          - "Certificate.status == REJECTED"
        side_effects:
          - "Re-mint Certificate.dmv_reference"
          - "Set Certificate.status = SUBMITTED"
          - "increments Certificate.version by 1"
        note: "Cyclic: SUBMITTED->REJECTED->SUBMITTED negotiation loop with the DMV."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: lesson-schedule-stale-student
    parent_entity: Student
    write_endpoint: "POST /lessons"
    occ_field: "expected_student_version"
    description: |
      Scheduling a new Lesson for a Student whose version has advanced since
      the client last observed it is rejected. A prior write (e.g., another
      lesson completion that bumped the student's hour ledgers and version, or
      a permit recording) means the scheduling client's view of the student's
      remaining road hours and status is stale, so the booking must be re-derived
      against the current student before it can legitimately proceed.
    error_id: ERR_STALE_STUDENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: enrollment_final_price
    trigger: "Enrollment DRAFT->ACTIVE (POST /enrollments/{id}/activate)"
    algorithm: tiered_pricing
    formula: |
      base = CoursePackage.price_cents
      subtotal = base
      # Step 1 (pinned first): teen discount — minors get TEEN_DISCOUNT_PCT off base
      if Student.is_minor:
          subtotal = subtotal * (1 - TEEN_DISCOUNT_PCT)
      # Step 2 (pinned second): promo percentage off the running subtotal
      if Enrollment.promo_code == "FLAT10":
          subtotal = subtotal * (1 - PROMO_FLAT10_PCT)
      # Step 3 (pinned last): bundle flat discount, applied only when the package
      # includes BOTH classroom and road tracks (included_classroom_hours > 0 AND
      # included_road_hours > 0)
      if CoursePackage.included_classroom_hours > 0 and CoursePackage.included_road_hours > 0:
          subtotal = subtotal - CoursePackage.bundle_discount_cents
      final_price_cents = max(0, round_half_up(subtotal))
    input_set: "Single Enrollment + its CoursePackage + the linked Student.is_minor flag."
    constants:
      TEEN_DISCOUNT_PCT: 0.10
      PROMO_FLAT10_PCT: 0.10
    precision: "Integer cents; round_half_up applied once after all three steps; floor at 0."
    variants:
      - name: minor_bundle_promo
        when: "Student.is_minor AND both tracks included AND promo_code == FLAT10"
        difference: "All three discounts stack in the pinned order 1->2->3 (percentages multiply, flat subtracts last)."
      - name: adult_no_promo
        when: "not is_minor AND promo_code null"
        difference: "Only the bundle flat applies; percentages skipped."

  - name: enrollment_refund_amount
    trigger: "Enrollment ACTIVE->REFUNDED (POST /enrollments/{id}/refund)"
    algorithm: forward_looking
    formula: |
      refundable_base = Enrollment.final_price_cents - CoursePackage.enrollment_fee_cents
      if refund_method == "PRO_RATA":
          # forward-looking on UNUSED road hours: hours not yet COMPLETED
          consumed = Student.completed_road_hours        # COMPLETED ROAD under this enrollment
          remaining = CoursePackage.included_road_hours - consumed
          if remaining < 0: remaining = 0
          ratio = remaining / CoursePackage.included_road_hours   # included_road_hours > 0 guaranteed for refundable packages
          refunded_cents = round_half_up(refundable_base * ratio)
      elif refund_method == "SCHEDULE_TIER":
          # chronological tier on elapsed days since activation
          elapsed_days = floor((current_clock - Enrollment.activated_at) / 1 day)
          if elapsed_days <= TIER1_DAYS:      pct = 1.00
          elif elapsed_days <= TIER2_DAYS:    pct = 0.75
          elif elapsed_days <= TIER3_DAYS:    pct = 0.50
          else:                               pct = 0.00
          refunded_cents = round_half_up(refundable_base * pct)
    input_set: "Single Enrollment, its CoursePackage, the linked Student's completed_road_hours (PRO_RATA) or the clock-vs-activated_at gap (SCHEDULE_TIER)."
    constants:
      TIER1_DAYS: 3
      TIER2_DAYS: 14
      TIER3_DAYS: 30
    precision: "Integer cents; round_half_up; enrollment_fee_cents is never refundable."
    variants:
      - name: pro_rata
        when: "refund_method == PRO_RATA"
        difference: "Refund proportional to UNUSED road hours; ignores elapsed time."
      - name: schedule_tier
        when: "refund_method == SCHEDULE_TIER"
        difference: "Refund tiered on elapsed days since activation; ignores hours consumed. Same enrollment yields a different refund than PRO_RATA."

  - name: certificate_readiness_score
    trigger: "Lesson SCHEDULED->COMPLETED (recompute on the student) and at certificate issuance check"
    algorithm: weighted_scoring
    formula: |
      road_pct   = min(Student.completed_road_hours   / MIN_ROAD_HOURS,   1.0)
      class_pct  = min(Student.completed_classroom_hours / MIN_CLASSROOM_HOURS, 1.0)
      online_pct = min(Student.completed_online_hours / MIN_ONLINE_HOURS, 1.0)
      readiness_score = round_half_up_4dp(
          W_ROAD * road_pct + W_CLASS * class_pct + W_ONLINE * online_pct )
      # readiness_score == 1.0 exactly iff all three pct terms == 1.0
    input_set: "Single Student's three completed-hour ledgers; required-hour constants."
    constants:
      MIN_ROAD_HOURS: 6
      MIN_CLASSROOM_HOURS: 30
      MIN_ONLINE_HOURS: 8
      W_ROAD: 0.5
      W_CLASS: 0.3
      W_ONLINE: 0.2
    precision: "4 decimal places, round_half_up; weights sum to exactly 1.0."

  - name: no_show_fee
    trigger: "Lesson SCHEDULED->NO_SHOW (POST /lessons/{id}/no-show)"
    algorithm: threshold
    formula: |
      # strike_index is the 1-based chronological ordinal of this strike for the student
      if strike_index <= FORGIVE_STRIKES:           # first strike forgiven
          fee_charged_cents = 0
      elif strike_index == FORGIVE_STRIKES + 1:      # second strike: base fee
          fee_charged_cents = BASE_NO_SHOW_FEE_CENTS
      else:                                          # third+ strike: doubled fee
          fee_charged_cents = BASE_NO_SHOW_FEE_CENTS * ESCALATION_MULTIPLIER
    input_set: "The new strike's strike_index, derived from Student.no_show_count at creation time (chronological by NoShowStrike.created_at)."
    constants:
      FORGIVE_STRIKES: 1
      BASE_NO_SHOW_FEE_CENTS: 4000
      ESCALATION_MULTIPLIER: 2
    precision: "Integer cents; exact."

  - name: instructor_lesson_payout
    trigger: "Lesson SCHEDULED->COMPLETED (POST /lessons/{id}/complete)"
    algorithm: aggregation
    formula: |
      # Per-line rounding pinned: round the single lesson's pay to a cent here.
      # The school's instructor-period payout (GET /instructors/{id}/payout-summary)
      # SUMS these already-rounded per-lesson values (round-per-line-then-sum),
      # NOT round(rate * total_hours).
      instructor_payout_cents = round_half_up(Instructor.hourly_rate_cents * Lesson.duration_hours)
      # period_total = sum over COMPLETED lessons of instructor_payout_cents  (per-line, then sum)
    input_set: "Single Lesson's duration_hours and assigned Instructor.hourly_rate_cents; period summary sums COMPLETED lessons in [period_start, period_end)."
    constants: {}
    precision: "Integer cents; round_half_up per lesson; period total is the sum of per-lesson rounded values (order: round per line, then sum)."

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For entity_backed roles (Student, Instructor, Guardian), the acting X-User-ID owns the targeted resource (Student owns own Lesson/Enrollment; Instructor owns own Lesson; Guardian's consent matches the student)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "ownership-scoped endpoints"

  - priority: 4
    category: existence
    check: "Every path/body resource id resolves to an existing entity, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: state
    check: "Target entity is in a valid state for the requested transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_student_version on POST /lessons matches the live Student.version"
    error_id: ERR_STALE_STUDENT_VERSION
    http_status: 412
    applies_to: "POST /lessons"

  - priority: 7
    category: business_safety
    check: "Minor student must have a GRANTED GuardianConsent before an Enrollment can be activated OR a ROAD Lesson scheduled"
    error_id: ERR_GUARDIAN_CONSENT_REQUIRED
    http_status: 422
    applies_to: "POST /enrollments/{id}/activate, POST /lessons (ROAD)"

  - priority: 8
    category: business_safety
    check: "A ROAD Lesson requires Student.status in {PERMITTED, ROAD_READY} (i.e., a recorded permit) and a certified_road Instructor and a dual_control Vehicle"
    error_id: ERR_ROAD_PREREQUISITE_NOT_MET
    http_status: 422
    applies_to: "POST /lessons (ROAD)"

  - priority: 9
    category: business_referential
    check: "Lesson's instructor_id, vehicle_id, enrollment_id all belong to a state consistent with scheduling (instructor.active, vehicle not out_of_service, enrollment ACTIVE)"
    error_id: ERR_RESOURCE_UNAVAILABLE
    http_status: 422
    applies_to: "POST /lessons"

  - priority: 10
    category: business_temporal
    check: "Lesson interval is well-formed (end_at strictly after start_at) and start_at is in the future relative to current clock"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /lessons"

  - priority: 11
    category: business_temporal
    check: "Instructor has no other SCHEDULED lesson whose half-open interval [start_at, end_at) overlaps this one (back-to-back adjacency at the boundary is allowed)"
    error_id: ERR_INSTRUCTOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /lessons"

  - priority: 12
    category: business_temporal
    check: "Vehicle has no other SCHEDULED lesson whose interval, expanded by the vehicle's prep_buffer_minutes AFTER its end, overlaps this lesson's [start_at, end_at) (buffer-padded overlap)"
    error_id: ERR_VEHICLE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /lessons (ROAD)"

  - priority: 13
    category: business_constraint
    check: "Scheduling this ROAD lesson would not push Student.scheduled_road_hours + completed_road_hours above CoursePackage.included_road_hours for the funding enrollment"
    error_id: ERR_ROAD_HOURS_EXCEEDED
    http_status: 422
    applies_to: "POST /lessons (ROAD)"

  - priority: 14
    category: business_fiscal
    check: "Certificate issuance requires Student.readiness_score == 1.0 (all required hours met)"
    error_id: ERR_READINESS_NOT_MET
    http_status: 422
    applies_to: "POST /students/{id}/certificate"

  - priority: 15
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numbers in range"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 16
    category: business_constraint
    check: "Unique constraints: Student.email, Instructor.email, Vehicle.plate, CoursePackage.code"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "create endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- CoursePackage ----
  - method: POST
    path: "/course-packages"
    description: "Create a course package."
    roles: [SchoolAdmin]
    code: 201
    input: [code, name, price_cents, enrollment_fee_cents, included_classroom_hours, included_online_hours, included_road_hours, "bundle_discount_cents?", "active?"]
    output: CoursePackage
    side_effects: []
  - method: GET
    path: "/course-packages/{id}"
    description: "Fetch a course package."
    roles: [SchoolAdmin, Student, Guardian, Instructor]
    code: 200
    input: []
    output: CoursePackage
    side_effects: []
  - method: GET
    path: "/course-packages"
    description: "List course packages."
    roles: [SchoolAdmin, Student, Guardian, Instructor]
    code: 200
    input: ["active?", "limit?", "offset?"]
    output: CoursePackage[]
    side_effects: []

  # ---- Student ----
  - method: POST
    path: "/students"
    description: "Register a student (PROSPECT)."
    roles: [SchoolAdmin]
    code: 201
    input: [full_name, email, date_of_birth, "permit_number?"]
    output: Student
    side_effects: ["Compute is_minor against current clock", "Set status = PROSPECT"]
  - method: GET
    path: "/students/{id}"
    description: "Fetch a student with computed ledgers and readiness_score."
    roles: [SchoolAdmin, Student, Guardian, Instructor]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: GET
    path: "/students"
    description: "List students."
    roles: [SchoolAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Student[]
    side_effects: []
  - method: POST
    path: "/students/{id}/record-permit"
    description: "Record a DMV learner permit (ENROLLED->PERMITTED)."
    roles: [SchoolAdmin]
    code: 200
    input: [permit_number]
    output: Student
    side_effects: ["Set permit_number", "Student ENROLLED->PERMITTED", "increments Student.version by 1"]
  - method: POST
    path: "/students/{id}/certificate"
    description: "Issue a completion Certificate to a ROAD_READY student with readiness_score == 1.0 (ROAD_READY->CERTIFIED)."
    roles: [SchoolAdmin]
    code: 201
    input: [enrollment_id]
    output: Certificate
    side_effects: ["Student ROAD_READY->CERTIFIED", "Create Certificate ISSUED", "Snapshot readiness_score_at_issue", "increments Student.version by 1"]

  # ---- GuardianConsent ----
  - method: POST
    path: "/guardian-consents"
    description: "Create a PENDING guardian consent for a minor student."
    roles: [SchoolAdmin, Guardian]
    code: 201
    input: [student_id, guardian_name, guardian_email, relationship]
    output: GuardianConsent
    side_effects: ["Set status = PENDING"]
  - method: GET
    path: "/guardian-consents/{id}"
    description: "Fetch a guardian consent."
    roles: [SchoolAdmin, Guardian]
    code: 200
    input: []
    output: GuardianConsent
    side_effects: []
  - method: GET
    path: "/guardian-consents"
    description: "List/filter guardian consents (reverse-reachability for Student)."
    roles: [SchoolAdmin, Guardian]
    code: 200
    input: ["student_id?", "status?", "limit?", "offset?"]
    output: GuardianConsent[]
    side_effects: []
  - method: POST
    path: "/guardian-consents/{id}/grant"
    description: "Guardian grants consent (PENDING->GRANTED)."
    roles: [Guardian]
    code: 200
    input: []
    output: GuardianConsent
    side_effects: ["Set status = GRANTED", "increments GuardianConsent.version by 1"]
  - method: POST
    path: "/guardian-consents/{id}/revoke"
    description: "Guardian revokes consent (GRANTED->REVOKED)."
    roles: [Guardian]
    code: 200
    input: []
    output: GuardianConsent
    side_effects: ["Set status = REVOKED", "increments GuardianConsent.version by 1"]

  # ---- Enrollment ----
  - method: POST
    path: "/enrollments"
    description: "Create a DRAFT enrollment."
    roles: [SchoolAdmin]
    code: 201
    input: [student_id, package_id, "promo_code?"]
    output: Enrollment
    side_effects: ["Set status = DRAFT"]
  - method: GET
    path: "/enrollments/{id}"
    description: "Fetch an enrollment with computed pricing/refund fields."
    roles: [SchoolAdmin, Student, Guardian]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: GET
    path: "/enrollments"
    description: "List/filter enrollments (reverse-reachability for Student and CoursePackage)."
    roles: [SchoolAdmin, Student, Guardian]
    code: 200
    input: ["student_id?", "package_id?", "status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []
  - method: POST
    path: "/enrollments/{id}/activate"
    description: "Activate enrollment, compute final price, charge student (DRAFT->ACTIVE)."
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["Compute final_price_cents", "Set amount_paid_cents", "Set activated_at", "Status DRAFT->ACTIVE", "Bubble Student PROSPECT->ENROLLED", "increments Enrollment.version by 1"]
  - method: POST
    path: "/enrollments/{id}/complete"
    description: "Close out a fully-certified enrollment (ACTIVE->COMPLETED)."
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["Status ACTIVE->COMPLETED", "increments Enrollment.version by 1"]
  - method: POST
    path: "/enrollments/{id}/cancel"
    description: "Cancel a pre-completion enrollment (ACTIVE->CANCELLED), cascade-cancelling scheduled lessons."
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["Cascade-cancel SCHEDULED lessons", "Release scheduled_road_hours", "Status ACTIVE->CANCELLED", "increments Enrollment.version by 1"]
  - method: POST
    path: "/enrollments/{id}/refund"
    description: "Refund an enrollment to wallet (ACTIVE->REFUNDED), choosing the refund algorithm."
    roles: [SchoolAdmin]
    code: 200
    input: [refund_method, refund_destination]
    output: Enrollment
    side_effects: ["Cascade-cancel SCHEDULED lessons", "Compute refunded_cents", "Create REFUND_CREDIT WalletEntry", "Raise wallet_balance_cents", "Status ACTIVE->REFUNDED", "increments Enrollment.version by 1"]

  # ---- Instructor ----
  - method: POST
    path: "/instructors"
    description: "Create an instructor."
    roles: [SchoolAdmin]
    code: 201
    input: [full_name, email, "certified_road?", hourly_rate_cents, "active?"]
    output: Instructor
    side_effects: []
  - method: GET
    path: "/instructors/{id}"
    description: "Fetch an instructor."
    roles: [SchoolAdmin, Instructor]
    code: 200
    input: []
    output: Instructor
    side_effects: []
  - method: GET
    path: "/instructors"
    description: "List instructors."
    roles: [SchoolAdmin]
    code: 200
    input: ["active?", "limit?", "offset?"]
    output: Instructor[]
    side_effects: []
  - method: GET
    path: "/instructors/{id}/payout-summary"
    description: "Computed read: instructor payout summed (round-per-line-then-sum) over COMPLETED lessons in a period."
    roles: [SchoolAdmin, Instructor]
    code: 200
    input: [period_start, period_end]
    output: { period_total_cents: integer, lesson_count: integer }
    side_effects: []

  # ---- Vehicle ----
  - method: POST
    path: "/vehicles"
    description: "Create a vehicle."
    roles: [SchoolAdmin]
    code: 201
    input: [plate, "dual_control?", "prep_buffer_minutes?", "out_of_service?"]
    output: Vehicle
    side_effects: []
  - method: GET
    path: "/vehicles/{id}"
    description: "Fetch a vehicle."
    roles: [SchoolAdmin, Instructor]
    code: 200
    input: []
    output: Vehicle
    side_effects: []
  - method: GET
    path: "/vehicles"
    description: "List vehicles."
    roles: [SchoolAdmin]
    code: 200
    input: ["out_of_service?", "limit?", "offset?"]
    output: Vehicle[]
    side_effects: []

  # ---- Lesson ----
  - method: POST
    path: "/lessons"
    description: "Schedule a lesson; OCC against the student's version; runs full scheduling validation chain."
    roles: [SchoolAdmin]
    code: 201
    input: [student_id, enrollment_id, lesson_type, start_at, end_at, "instructor_id?", "vehicle_id?", expected_student_version]
    output: Lesson
    side_effects: ["Set status = SCHEDULED", "Compute duration_hours", "For ROAD add duration_hours to scheduled_road_hours", "increments Student.version by 1"]
  - method: GET
    path: "/lessons/{id}"
    description: "Fetch a lesson."
    roles: [SchoolAdmin, Student, Instructor, Guardian]
    code: 200
    input: []
    output: Lesson
    side_effects: []
  - method: GET
    path: "/lessons"
    description: "List/filter lessons (reverse-reachability for Student, Enrollment, Instructor, Vehicle)."
    roles: [SchoolAdmin, Student, Instructor, Guardian]
    code: 200
    input: ["student_id?", "enrollment_id?", "instructor_id?", "vehicle_id?", "status?", "lesson_type?", "limit?", "offset?"]
    output: Lesson[]
    side_effects: []
  - method: POST
    path: "/lessons/{id}/complete"
    description: "Instructor completes a lesson after its end (SCHEDULED->COMPLETED); recomputes ledgers, payout, readiness, milestone."
    roles: [Instructor]
    code: 200
    input: []
    output: Lesson
    side_effects: ["Status SCHEDULED->COMPLETED", "Add hours to completed_<type>_hours", "Compute instructor_payout_cents", "Recompute readiness_score", "Bubble PERMITTED->ROAD_READY when road floor met", "increments Student.version by 1"]
  - method: POST
    path: "/lessons/{id}/no-show"
    description: "Mark a SCHEDULED lesson NO_SHOW at/after start; creates an escalating strike and wallet debit."
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: Lesson
    side_effects: ["Status SCHEDULED->NO_SHOW", "Create NoShowStrike with strike_index", "Compute fee_charged_cents", "Create NO_SHOW_DEBIT WalletEntry when fee > 0", "Release scheduled_road_hours for ROAD", "Recompute no_show_count", "increments Student.version by 1"]
  - method: POST
    path: "/lessons/{id}/cancel"
    description: "Student cancels a SCHEDULED lesson outside the cutoff window (SCHEDULED->CANCELLED)."
    roles: [Student]
    code: 200
    input: []
    output: Lesson
    side_effects: ["Status SCHEDULED->CANCELLED", "Release scheduled_road_hours for ROAD; may regress Student ROAD_READY->PERMITTED if a completed lesson were cancelled (not via this endpoint)", "increments Student.version by 1"]

  # ---- NoShowStrike (reverse-reachability for Student & Lesson) ----
  - method: GET
    path: "/no-show-strikes/{id}"
    description: "Fetch a single no-show strike."
    roles: [SchoolAdmin, Student, Guardian]
    code: 200
    input: []
    output: NoShowStrike
    side_effects: []
  - method: GET
    path: "/no-show-strikes"
    description: "List/filter no-show strikes."
    roles: [SchoolAdmin, Student, Guardian]
    code: 200
    input: ["student_id?", "lesson_id?", "limit?", "offset?"]
    output: NoShowStrike[]
    side_effects: []

  # ---- WalletEntry (reverse-reachability for Student & Enrollment) ----
  - method: GET
    path: "/wallet-entries/{id}"
    description: "Fetch a single wallet entry."
    roles: [SchoolAdmin, Student, Guardian]
    code: 200
    input: []
    output: WalletEntry
    side_effects: []
  - method: GET
    path: "/wallet-entries"
    description: "List/filter wallet entries."
    roles: [SchoolAdmin, Student, Guardian]
    code: 200
    input: ["student_id?", "enrollment_id?", "reason?", "limit?", "offset?"]
    output: WalletEntry[]
    side_effects: []
  - method: POST
    path: "/wallet-entries"
    description: "Admin wallet adjustment (business endpoint for manual credits/debits)."
    roles: [SchoolAdmin]
    code: 201
    input: [student_id, amount_cents, reason, "enrollment_id?"]
    output: WalletEntry
    side_effects: ["Recompute Student.wallet_balance_cents"]

  # ---- Certificate ----
  - method: GET
    path: "/certificates/{id}"
    description: "Fetch a certificate."
    roles: [SchoolAdmin, Student, Guardian]
    code: 200
    input: []
    output: Certificate
    side_effects: []
  - method: GET
    path: "/certificates"
    description: "List/filter certificates (reverse-reachability for Student & Enrollment)."
    roles: [SchoolAdmin, Student, Guardian]
    code: 200
    input: ["student_id?", "enrollment_id?", "status?", "limit?", "offset?"]
    output: Certificate[]
    side_effects: []
  - method: POST
    path: "/certificates/{id}/submit"
    description: "Submit certificate to DMV (ISSUED->SUBMITTED or REJECTED->SUBMITTED), minting dmv_reference."
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: Certificate
    side_effects: ["Mint dmv_reference", "Status -> SUBMITTED", "increments Certificate.version by 1"]
  - method: POST
    path: "/certificates/{id}/dmv-callback"
    description: "Record DMV decision (SUBMITTED->ACCEPTED or SUBMITTED->REJECTED); ACCEPTED bubbles Student CERTIFIED->LICENSED."
    roles: [SchoolAdmin]
    code: 200
    input: [outcome]
    output: Certificate
    side_effects: ["Status -> ACCEPTED|REJECTED", "On ACCEPTED bubble Student CERTIFIED->LICENSED", "increments Certificate.version by 1"]

  # ---- Test-driving endpoint ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: set the server's current UTC clock to drive time-gated transitions (lesson completion windows, refund tiers, minor-age derivation)."
    roles: [SchoolAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Server clock set to to_iso8601 for subsequent age/window/tier evaluations"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers, or unknown role."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for this endpoint."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "entity_backed role acting on a resource it does not own."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource id does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity not in a valid state for the requested transition."
  - id: ERR_STALE_STUDENT_VERSION
    http: 412
    condition: "expected_student_version on POST /lessons does not match live Student.version (OCC)."
  - id: ERR_GUARDIAN_CONSENT_REQUIRED
    http: 422
    condition: "Minor student lacks a GRANTED GuardianConsent for enrollment activation or ROAD scheduling."
  - id: ERR_ROAD_PREREQUISITE_NOT_MET
    http: 422
    condition: "ROAD lesson missing recorded permit (student not PERMITTED/ROAD_READY), certified_road instructor, or dual_control vehicle."
  - id: ERR_RESOURCE_UNAVAILABLE
    http: 422
    condition: "Instructor inactive, vehicle out_of_service, or funding enrollment not ACTIVE."
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "Lesson end_at not strictly after start_at, or start_at not in the future."
  - id: ERR_INSTRUCTOR_DOUBLE_BOOKED
    http: 409
    condition: "Instructor already has a SCHEDULED lesson overlapping [start_at, end_at)."
  - id: ERR_VEHICLE_DOUBLE_BOOKED
    http: 409
    condition: "Vehicle already booked in an interval that, padded by prep_buffer_minutes after its end, overlaps this lesson."
  - id: ERR_ROAD_HOURS_EXCEEDED
    http: 422
    condition: "Scheduling would push scheduled+completed road hours above the package's included_road_hours."
  - id: ERR_READINESS_NOT_MET
    http: 422
    condition: "Certificate issuance attempted while Student.readiness_score < 1.0."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: missing required field, invalid enum, out-of-range number."
  - id: ERR_DUPLICATE
    http: 409
    condition: "Unique constraint violated (Student.email, Instructor.email, Vehicle.plate, CoursePackage.code)."
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic business-rule violation not covered by a more specific code (e.g., refund_method invalid for non-refundable package)."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SchoolAdmin
    description: "School operator: manages packages, students, enrollments, scheduling, no-shows, certification, refunds, DMV."
    identity: "opaque"
    exclusive_operations:
      - "POST /course-packages"
      - "POST /students"
      - "POST /students/{id}/record-permit"
      - "POST /students/{id}/certificate"
      - "POST /enrollments"
      - "POST /enrollments/{id}/activate"
      - "POST /enrollments/{id}/complete"
      - "POST /enrollments/{id}/cancel"
      - "POST /enrollments/{id}/refund"
      - "POST /instructors"
      - "POST /vehicles"
      - "POST /lessons"
      - "POST /lessons/{id}/no-show"
      - "POST /wallet-entries"
      - "POST /certificates/{id}/submit"
      - "POST /certificates/{id}/dmv-callback"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET (all read endpoints)"
      - "POST /guardian-consents"

  - name: Student
    description: "Teen/adult learner acting on own enrollments and lessons via the portal."
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /lessons/{id}/cancel"
    shared_operations:
      - "GET own student, enrollments, lessons, certificates, wallet-entries, strikes"
      - "GET /course-packages"

  - name: Instructor
    description: "Driving instructor acting on own assigned lessons."
    identity: "entity_backed:Instructor"
    exclusive_operations:
      - "POST /lessons/{id}/complete"
    shared_operations:
      - "GET own instructor, own lessons, payout-summary"
      - "GET /course-packages, /vehicles, /students"

  - name: Guardian
    description: "Parent/legal guardian of a minor student; grants/revokes consent and views the teen's portal."
    identity: "entity_backed:GuardianConsent"
    exclusive_operations:
      - "POST /guardian-consents/{id}/grant"
      - "POST /guardian-consents/{id}/revoke"
    shared_operations:
      - "POST /guardian-consents"
      - "GET the ward's student, enrollments, lessons, certificates, wallet-entries, strikes, consents"
