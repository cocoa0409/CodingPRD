      - name: plan_reject_resubmit_loop_counts_revisions
        claim_type: cyclic
        grounds:
          - state_machines.InventoryPlan.SUBMITTED_to_DRAFT
          - entities.InventoryPlan.fields.revision_count
        excluded_because:
          difficulty_instance: inventory_plan_reject_resubmit_cycle_increments_revision_count
          rationale: "The cyclic-shape claim for InventoryPlan (SUBMITTED -> DRAFT on REJECT, resubmit, revision_count incrementing once per loop while computed_targets are recomputed each time) is the whole subject of that §1.8 non_linear_state_machine instance, which already asserts revision_count 2 after two rejects and the surviving submitted_by_user_id."

      - name: shipment_arrival_multi_hop_cascade
        claim_type: cascade_down
        grounds:
          - state_machines.CashShipment.IN_TRANSIT_to_DELIVERED.side_effects
          - calculations.branch_vault_utilization_and_posture
          - calculations.repatriation_surplus_manifest
        excluded_because:
          difficulty_instance: shipment_arrival_five_hop_cascade_to_auto_repatriation_manifest
          rationale: "The five-hop cascade (mix credit -> position totals -> branch vault fields -> posture re-derivation -> auto REPATRIATION shipment plus repatriation_pending) is exactly what that §1.8 transitive_cascade instance walks end to end with pinned per-hop literals, including the auto-generated manifest's denomination waterfall."

      - name: buyback_cancellation_compensates_liability
        claim_type: compensation
        grounds:
          - state_machines.BuybackContract.ISSUED_to_CANCELLED.side_effects
          - calculations.buyback_liability_reconciliation
        excluded_because:
          difficulty_instance: buyback_issue_then_cancel_restores_branch_liability
          rationale: "The compensation claim - every side effect of issuance (branch liability, origin transaction's buyback_contract_id, remaining notional) reversed with no drift on cancel - is the entire subject of that §1.8 compensating_invariant instance, which pins the before and after liability to the same literal."

      - name: plan_activation_guarded_by_corridor_season
        claim_type: guarded_transitions
        grounds:
          - state_machines.InventoryPlan.APPROVED_to_ACTIVE.preconditions
          - errors[ERR_PLAN_OUTSIDE_SEASON]
        excluded_because:
          difficulty_instance: plan_activation_blocked_by_corridor_season_window
          rationale: "The guarded-transition claim (APPROVED -> ACTIVE only while the clock lies inside the referenced corridor's half-open season window) is covered by that §1.8 cross_entity_state_dependency instance, which tests the instant before season_start_date, the instant at season_end_date and an in-season success on the same plan."

      - name: transaction_parallel_axes_are_independent
        claim_type: parallel
        grounds:
          - state_machines.ExchangeTransaction
          - entities.ExchangeTransaction.fields.settlement_status
          - entities.ExchangeTransaction.fields.compliance_status
        excluded_because:
          difficulty_instance: exchange_transaction_parallel_axes_settle_while_compliance_flagged
          rationale: "The parallel-shape claim (the settlement axis advances to SETTLED while the compliance axis sits at FLAGGED, and only BLOCKED stops it) is the subject of that §1.8 non_linear_state_machine instance, which asserts the full combined-state matrix."

  - section: calculations
    instances:
      - name: wholesale_selection_ignores_future_and_honours_recording_order
        claim_type: correct_result
        grounds:
          - calculations.wholesale_rate_selection
          - calculations.shipment_manifest_valuation
          - errors[ERR_WHOLESALE_RATE_NOT_FOUND]
        distinguishing_aspect: "Selection is chronological on effective_at with created_at DESC as tie-break, not on recording order: with 900000@2026-07-15 recorded first, 920000@2026-07-01 recorded second and 850000@2026-09-01 (future) recorded third, a 100000-minor manifest values at 111111 cents; adding 910000@2026-07-15 later wins the effective_at tie and the next manifest values at 109890; and a currency whose only quote is future-dated raises ERR_WHOLESALE_RATE_NOT_FOUND."
        test_recipe:
          setup:
            - "Branch BR-LHR (SOUTH); EUR and JPY profiles; the logical clock at its 2026-08-01T00:00:00Z default."
            - "EUR quotes recorded deliberately out of order; JPY's only quote is dated 2026-09-01."
          setup_api_calls:
            - call: "POST /branches"
              payload: { code: "BR-LHR", name: "London Heathrow", region_code: "SOUTH", vault_limit_usd_cents: 20000000 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id" }
            - call: "POST /currencies"
              payload: { iso_code: "EUR", display_name: "Euro", minor_unit_digits: 2, currency_class: "MAJOR", standard_denominations: [500, 1000, 2000, 5000, 10000], buyback_eligible: true }
              as: PlatformAdmin
            - call: "POST /currencies"
              payload: { iso_code: "JPY", display_name: "Japanese Yen", minor_unit_digits: 0, currency_class: "MAJOR", standard_denominations: [1000, 5000, 10000] }
              as: PlatformAdmin
            - call: "POST /wholesale-rates"
              payload: { currency_code: "EUR", mid_rate_micros: 900000, effective_at: "2026-07-15T00:00:00Z", source_code: "REUTERS_MID" }
              as: TreasuryOfficer
              captures: { wr_late: "$.data.id" }
            - call: "POST /wholesale-rates"
              payload: { currency_code: "EUR", mid_rate_micros: 920000, effective_at: "2026-07-01T00:00:00Z", source_code: "REUTERS_MID" }
              as: TreasuryOfficer
              captures: { wr_early: "$.data.id" }
            - call: "POST /wholesale-rates"
              payload: { currency_code: "EUR", mid_rate_micros: 850000, effective_at: "2026-09-01T00:00:00Z", source_code: "REUTERS_MID" }
              as: TreasuryOfficer
              captures: { wr_future: "$.data.id" }
            - call: "POST /wholesale-rates"
              payload: { currency_code: "JPY", mid_rate_micros: 15000000, effective_at: "2026-09-01T00:00:00Z", source_code: "REUTERS_MID" }
              as: TreasuryOfficer
              captures: { wr_jpy: "$.data.id" }
          trigger:
            - call: "POST /cash-shipments"
              payload: { branch_id: "${br_id}", currency_code: "EUR", direction: "REPLENISHMENT", manifest_denominations: [{ denomination_minor_units: 10000, note_count: 10 }] }
              as: TreasuryOfficer
              captures: { ship1: "$.data.id" }
            - call: "POST /wholesale-rates"
              payload: { currency_code: "EUR", mid_rate_micros: 910000, effective_at: "2026-07-15T00:00:00Z", source_code: "ECB_FIX" }
              as: TreasuryOfficer
              captures: { wr_tie: "$.data.id" }
            - call: "POST /cash-shipments"
