  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: Violation to Error
        grounds:
          - validations[priority=10]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role and no X-User-ID returns 401 ERR_UNAUTHENTICATED before any existence or body check, even when the body is well formed."
        test_recipe:
          setup: ["One Institution."]
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
          trigger:
            - call: "GET /hmda/institutions/${inst_id}"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "the request is sent with neither X-User-Role nor X-User-ID"
            - "HTTP status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

      - name: loan_officer_cannot_create_edit_runs
        claim_type: Violation to Error
        grounds:
          - validations[priority=20]
          - errors[ERR_FORBIDDEN_ROLE]
          - roles.ComplianceAnalyst
        distinguishing_aspect: "POST /hmda/edit-runs lists only ComplianceAnalyst, so a LoanOfficer gets 403 ERR_FORBIDDEN_ROLE and no EditRun row is written."
        test_recipe:
          setup: ["One Institution."]
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /hmda/edit-runs"
              payload: { institution_id: "${inst_id}", scope: "FULL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T00:00:00Z" }
              as: LoanOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"
            - "GET /hmda/institutions/${inst_id}/edit-runs returns 0 rows"

      - name: institution_admin_cannot_patch_another_institution
        claim_type: Violation to Error
        grounds:
          - validations[priority=30]
          - errors[ERR_INSTITUTION_SCOPE_VIOLATION]
          - roles.InstitutionAdmin
        distinguishing_aspect: "InstitutionAdmin is entity_backed:Institution, so acting with X-User-ID equal to institution one's id against institution two's path returns 403 ERR_INSTITUTION_SCOPE_VIOLATION and leaves institution two's name unchanged."
        test_recipe:
          setup: ["Two Institutions."]
          setup_api_calls:
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R12", name: "First Meridian Bank", activity_year: 2026, asset_size_usd_cents: 250000000000, prior_year_closed_end_originations: 700, prior_year_open_end_originations: 40 }
              as: SystemAdmin
              captures: { inst1_id: $.data.id }
            - call: "POST /hmda/institutions"
              payload: { lei: "5493001KJTIIGC8Y1R99", name: "Second Harbor Savings", activity_year: 2026, asset_size_usd_cents: 180000000000, prior_year_closed_end_originations: 610, prior_year_open_end_originations: 20 }
              as: SystemAdmin
              captures: { inst2_id: $.data.id }
          trigger:
            - call: "PATCH /hmda/institutions/${inst2_id}"
              payload: { name: "Hijacked Name" }
              as: InstitutionAdmin
              as_user_id: "${inst1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "response.data.error_id == ERR_INSTITUTION_SCOPE_VIOLATION"
            - "Institution.${inst2_id}.name == Second Harbor Savings"
            - "Institution.${inst2_id}.version == 1"

