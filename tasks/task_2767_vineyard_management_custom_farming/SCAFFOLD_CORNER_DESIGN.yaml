          rationale: "The §1.8 priority-pair instance already violates validations[priority=65] (ERR_PLAN_NOT_APPROVED) and validations[priority=110] (ERR_PLAN_BUDGET_EXCEEDED) in the same POST /work-orders request and asserts that the priority-65 error is the one returned; a corner test would duplicate that setup and assertion exactly."

      - name: priority_conflict_between_interval_and_estimate_gates
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: preharvest_interval_beats_no_yield_estimate_on_harvest_load_create
          rationale: "That §1.8 instance is precisely the priority-conflict pattern: a POST /harvest-loads request violating validations[priority=87] (ERR_PREHARVEST_INTERVAL_ACTIVE) and validations[priority=102] (ERR_NO_YIELD_ESTIMATE) together must report the priority-87 error; the sibling instance delivery_eta_outside_window_beats_window_capacity_exceeded covers the same pattern for priorities 91 and 111."

