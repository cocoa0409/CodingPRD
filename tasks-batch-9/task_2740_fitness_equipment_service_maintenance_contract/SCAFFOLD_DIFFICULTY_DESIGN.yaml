  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: preventive_visit_doc_dimension_cycles_after_visit_is_terminal
        grounds:
          - state_machines.PreventiveVisit.PENDING_to_SUBMITTED
          - state_machines.PreventiveVisit.SUBMITTED_to_REJECTED
          - state_machines.PreventiveVisit.SUBMITTED_to_CERTIFIED
          - state_machines.PreventiveVisit.IN_PROGRESS_to_COMPLETED
          - entities.PreventiveVisit.fields.pm_credit_earned
          - entities.Equipment.fields.safety_lockout_reason
        distinguishing_aspect: |
          PreventiveVisit carries two independent dimensions on one row: visit_status reaches the
          terminal COMPLETED while safety_doc_status still walks SUBMITTED -> REJECTED -> SUBMITTED
          -> CERTIFIED, and pm_credit_earned flips false then true as the two dimensions cross.
          The re-submission after a rejection is the cycle; a linear reading of the row would
          refuse any transition once COMPLETED was reached.
        test_recipe:
          setup:
            - "Clock 2026-08-12T08:00Z; club NORTH, one treadmill IN_SERVICE."
            - "Model checklist_template has two elements: BELT_TENSION (consumable, not safety-critical) and ESTOP_FUNCTION (safety-critical)."
            - "GOLD/FULL contract ACTIVE. Technician T1 does the work; Technician T2 holds is_safety_inspector == true."
            - "One visit scheduled 09:00-10:30 on 2026-08-12 assigned to T1."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - call: "POST /fleetcare/equipment-models"
              payload:
                manufacturer: "Pacemaster"
                model_code: "TM-900"
                category: "TREADMILL"
                model_year: 2019
                pm_interval_hours: 250
                expected_service_life_hours: 20000
                base_annual_service_cents: 120000
                checklist_template:
                  - { code: "BELT_TENSION", is_safety_critical: false, consumable: true }
                  - { code: "ESTOP_FUNCTION", is_safety_critical: true, consumable: false }
              as: ContractAdministrator
              captures: { model_id: "$.data.id" }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-PV-1", install_date: "2024-03-01", initial_usage_hours: 300 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Ivo Marsh", region_code: "NORTH", skill_categories: ["TREADMILL"], is_safety_inspector: true }, as: ContractAdministrator, captures: { t2_id: "$.data.id" } }
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", window_start: "2026-08-12T09:00:00Z", window_end: "2026-08-12T10:30:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator, captures: { v1_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T09:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/preventive-visits/${v1_id}/start", as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /fleetcare/preventive-visits/${v1_id}/checklist-results", payload: { item_code: "BELT_TENSION", result: "PASS", consumable_replaced: true }, as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /fleetcare/preventive-visits/${v1_id}/checklist-results", payload: { item_code: "ESTOP_FUNCTION", result: "PASS" }, as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/preventive-visits/${v1_id}/complete", as: FieldTechnician, as_user_id: "${t1_id}", captures: { credit_at_completion: "$.data.pm_credit_earned" } }
            - { call: "POST /fleetcare/preventive-visits/${v1_id}/safety-doc/submit", payload: { inspection_summary: "Deck and estop inspected, belt dressing replaced." }, as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /fleetcare/preventive-visits/${v1_id}/safety-doc/reject", payload: { rejection_reason: "Estop test evidence missing from the summary." }, as: SafetyInspector, as_user_id: "${t2_id}", captures: { status_after_reject: "$.data.visit_status", credit_after_reject: "$.data.pm_credit_earned" } }
            - { call: "POST /fleetcare/preventive-visits/${v1_id}/safety-doc/submit", payload: { inspection_summary: "Estop test evidence attached; deck and belt re-verified." }, as: FieldTechnician, as_user_id: "${t1_id}" }
          trigger:
            - { call: "POST /fleetcare/preventive-visits/${v1_id}/safety-doc/certify", as: SafetyInspector, as_user_id: "${t2_id}" }
          assert:
            - "${credit_at_completion} == false (completion alone never earns the PM credit)"
            - "${status_after_reject} == 'COMPLETED' and ${credit_after_reject} == false"
            - "PreventiveVisit.${v1_id}.visit_status == COMPLETED (unchanged by all four safety-doc transitions)"
            - "PreventiveVisit.${v1_id}.safety_doc_status == CERTIFIED"
            - "PreventiveVisit.${v1_id}.safety_doc_rejection_reason == null"
            - "PreventiveVisit.${v1_id}.safety_doc_certified_by_id == ${t2_id}"
            - "PreventiveVisit.${v1_id}.pm_credit_earned == true"
            - "PreventiveVisit.${v1_id}.consumables_replaced_count == 1"
            - "PreventiveVisit.${v1_id}.checklist_resolved_count == 2 and PreventiveVisit.${v1_id}.checklist_failed_count == 0"
            - "Equipment.${e1_id}.lifecycle_status == TAGGED_OUT with safety_lockout_reason == 'SAFETY_DOC_REJECTED' (certifying the replacement document does NOT clear the lockout)"
            - "ServiceContract.${c_id}.pm_visits_completed_count == 1 and ServiceContract.${c_id}.pm_compliance_pct == 100.00"

      - name: contract_requote_self_cycle_then_decline_fork_tears_down_schedule
        grounds:
          - state_machines.ServiceContract.ACTIVE_to_RENEWAL_QUOTED
          - state_machines.ServiceContract.RENEWAL_QUOTED_to_RENEWAL_QUOTED
          - state_machines.ServiceContract.RENEWAL_QUOTED_to_EXPIRED
          - state_machines.RenewalQuote.ISSUED_to_SUPERSEDED
          - entities.Technician.fields.committed_minutes
        distinguishing_aspect: |
          ServiceContract loops on itself at RENEWAL_QUOTED (a re-quote supersedes the standing
          quote without changing the contract's state) and only then forks; the DECLINE branch
          carries a side-effect set the ACCEPT branch does not have - it cancels the forward
          visit schedule and releases the technician's minutes.
        test_recipe:
          setup:
            - "Clock 2026-08-20T08:00Z; club NORTH with one treadmill, GOLD/FULL contract ACTIVE, technician T1."
            - "One preventive visit scheduled 2026-08-25T08:00-09:30 (planned_minutes 90) so T1.committed_minutes is 90."
            - "No quote has been issued yet."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-RC-1", install_date: "2024-03-01", initial_usage_hours: 4000 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 140000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", window_start: "2026-08-25T08:00:00Z", window_end: "2026-08-25T09:30:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator, captures: { v1_id: "$.data.id" } }
            - { call: "GET /fleetcare/technician-assignments", payload: { preventive_visit_id: "${v1_id}" }, as: ContractAdministrator, captures: { a1_id: "$.data[0].id" } }
            - { call: "GET /fleetcare/contracts/${c_id}", as: ContractAdministrator, captures: { ver_1: "$.data.version" } }
            - { call: "POST /fleetcare/contracts/${c_id}/renewal-quotes", payload: { expected_contract_version: "${ver_1}" }, as: ContractAdministrator, captures: { q1_id: "$.data.id" } }
            - { call: "GET /fleetcare/contracts/${c_id}", as: ContractAdministrator, captures: { ver_2: "$.data.version", status_after_first_quote: "$.data.status" } }
            - { call: "POST /fleetcare/contracts/${c_id}/renewal-quotes", payload: { expected_contract_version: "${ver_2}" }, as: ContractAdministrator, captures: { q2_id: "$.data.id" } }
            - { call: "GET /fleetcare/renewal-quotes/${q1_id}", as: ContractAdministrator, captures: { q1_status_after_requote: "$.data.status" } }
            - { call: "GET /fleetcare/contracts/${c_id}", as: ContractAdministrator, captures: { status_after_requote: "$.data.status" } }
          trigger:
            - { call: "POST /fleetcare/renewal-quotes/${q2_id}/decline", payload: { reason: "Club is relocating the cardio floor." }, as: ClubManager, as_user_id: "${club_id}" }
          assert:
            - "${status_after_first_quote} == 'RENEWAL_QUOTED' and ${status_after_requote} == 'RENEWAL_QUOTED' (the re-quote is a self-cycle, not a new state)"
            - "${ver_2} == ${ver_1} + 1"
            - "${q1_status_after_requote} == 'SUPERSEDED'"
            - "RenewalQuote.${q2_id}.status == DECLINED"
            - "RenewalQuote.${q2_id}.decline_reason == 'Club is relocating the cardio floor.'"
            - "ServiceContract.${c_id}.status == EXPIRED"
            - "PreventiveVisit.${v1_id}.visit_status == CANCELLED with cancellation_reason == 'CONTRACT_EXPIRED'"
            - "TechnicianAssignment.${a1_id}.status == RELEASED"
            - "Technician.${t1_id}.committed_minutes == 0 (was 90 before the decline)"
            - "ServiceContract.${c_id}.pm_compliance_pct == 100.00 (a cancelled visit enters neither counter)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: third_critical_resolve_cascades_five_hops_to_fleet_renewal_risk
        grounds:
          - state_machines.ServiceCall.ON_SITE_to_RESOLVED
          - state_machines.DowntimeEvent.OPEN_to_CLOSED
          - calculations.equipment_health_score
          - calculations.fleet_renewal_risk
          - entities.ServiceContract.fields.replacement_candidate_count
          - entities.ServiceContract.fields.fleet_renewal_risk
        distinguishing_aspect: |
          Depth 5, triggered by a service-call resolution: resolve -> DowntimeEvent CLOSED with
          provisional credit -> Equipment.downtime_minutes_ytd grows -> the third resolved call
          flips the health variant so health_score lands on exactly 40.00 and
          replacement_recommended becomes true -> contract.replacement_candidate_count becomes 1
          -> fleet_renewal_risk crosses 0.30 to HIGH. Every hop is caused by the previous one:
          without the downtime accumulation the score would be 64.00 and nothing downstream moves.
        test_recipe:
          setup:
            - "Club NORTH with EXACTLY two units so one replacement candidate is a 0.50 ratio."
            - "E4: treadmill installed 2021-06-01 with 8000 of 20000 life hours (usage health 50.00, not a candidate)."
            - "E5: treadmill installed 2025-01-01 with 100 usage hours (health 97.50, never a candidate)."
            - "GOLD/FULL contract ACTIVE, annual_base_cents 250000. Technician T1 ON_DUTY in NORTH skilled on TREADMILL."
            - "Two CRITICAL calls on E4 already resolved, each open 06:00-18:00 inside the club's operating window (720 minutes, 14400 cents provisional each) on 2026-08-02 and 2026-08-03."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T05:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH", operating_open_minute: 300, operating_close_minute: 1380 }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-CS-4", install_date: "2021-06-01", initial_usage_hours: 8000 }, as: ContractAdministrator, captures: { e4_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-CS-5", install_date: "2025-01-01", initial_usage_hours: 100 }, as: ContractAdministrator, captures: { e5_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"], max_committed_minutes: 600 }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T06:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e4_id}", severity: "CRITICAL", symptom_code: "DECK_SEIZED" }, as: ServiceCoordinator, captures: { call_1_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls/${call_1_id}/dispatch", payload: { start_at: "2026-08-02T06:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator }
            - { call: "POST /fleetcare/service-calls/${call_1_id}/arrive", as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T18:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls/${call_1_id}/resolve", payload: { resolution_code: "DECK_REPLACED" }, as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e4_id}", severity: "CRITICAL", symptom_code: "MOTOR_FAULT" }, as: ServiceCoordinator, captures: { call_2_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls/${call_2_id}/dispatch", payload: { start_at: "2026-08-03T06:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator }
            - { call: "POST /fleetcare/service-calls/${call_2_id}/arrive", as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T18:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls/${call_2_id}/resolve", payload: { resolution_code: "MOTOR_REPLACED" }, as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "GET /fleetcare/equipment/${e4_id}", as: ContractAdministrator, captures: { health_before: "$.data.health_score", variant_before: "$.data.health_score_variant", recommended_before: "$.data.replacement_recommended" } }
            - { call: "GET /fleetcare/contracts/${c_id}", as: ContractAdministrator, captures: { risk_before: "$.data.fleet_renewal_risk", candidates_before: "$.data.replacement_candidate_count" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T06:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e4_id}", severity: "CRITICAL", symptom_code: "FRAME_CRACK" }, as: ServiceCoordinator, captures: { call_3_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls/${call_3_id}/dispatch", payload: { start_at: "2026-08-04T06:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator }
            - { call: "POST /fleetcare/service-calls/${call_3_id}/arrive", as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T18:00:00Z" }, as: ContractAdministrator }
          trigger:
            - { call: "POST /fleetcare/service-calls/${call_3_id}/resolve", payload: { resolution_code: "FRAME_WELDED" }, as: FieldTechnician, as_user_id: "${t1_id}" }
          assert:
            - "${health_before} == 50.00 and ${variant_before} == 'USAGE_BASED' and ${recommended_before} == false"
            - "${risk_before} == 'LOW' and ${candidates_before} == 0"
            - "hop 1 - ServiceCall.${call_3_id}.status == RESOLVED and its DowntimeEvent.status == CLOSED"
            - "hop 2 - that DowntimeEvent.downtime_minutes == 720, operating_downtime_minutes == 720, provisional_credit_cents == 14400"
            - "hop 2 - ServiceContract.${c_id}.credit_provisional_cents == 43200"
            - "hop 3 - Equipment.${e4_id}.downtime_minutes_ytd == 2160 and health_score_variant == 'FAILURE_BASED'"
            - "hop 3 - Equipment.${e4_id}.health_score == 40.00"
            - "hop 4 - Equipment.${e4_id}.replacement_recommended == true (40.00 is inclusive)"
            - "hop 5 - ServiceContract.${c_id}.replacement_candidate_count == 1"
            - "hop 5 - ServiceContract.${c_id}.fleet_renewal_risk == HIGH (1/2 = 0.50 >= 0.30)"
            - "Equipment.${e5_id}.health_score == 97.50 and replacement_recommended == false (untouched by the cascade)"
            - "Equipment.${e4_id}.lifecycle_status == IN_SERVICE (resolve returns the unit to service)"

      - name: obsolete_critical_spare_cascades_four_hops_to_replacement_candidates
        grounds:
          - state_machines.PartCatalogEntry.ACTIVE_to_OBSOLETE
          - entities.Equipment.fields.support_status
          - entities.Equipment.fields.eos_notified_at
          - calculations.equipment_health_score
          - calculations.fleet_renewal_risk
        distinguishing_aspect: |
          Depth 4 from a completely different trigger - a parts-lifecycle declaration, not field
          work. Declaring end of support on a critical spare with no refurbished stock marks the
          part OBSOLETE, which pushes every unit of that model to UNSUPPORTED, which relaxes the
          replacement threshold from 40.00 to 60.00, which makes ONLY the 56.00 unit a candidate
          and lifts fleet_renewal_risk to HIGH. No health_score value changes anywhere in the chain.
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00Z; club NORTH with exactly two treadmills of one model."
            - "E1 installed 2019-05-10 with 6000 of 20000 life hours -> health 56.00 (above the 40.00 base threshold, at or below the 60.00 unsupported threshold)."
            - "E2 installed 2024-03-01 with 4000 of 20000 life hours -> health 76.00 (above both thresholds)."
            - "GOLD/FULL contract ACTIVE; both units support_status SUPPORTED, no service history at all."
            - "PartCatalogEntry DECK-900 for that model with is_critical_spare true, 4 new units on hand and ZERO refurbished units, lifecycle_status ACTIVE."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
