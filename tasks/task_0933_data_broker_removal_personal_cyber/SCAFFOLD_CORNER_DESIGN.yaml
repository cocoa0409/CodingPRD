        distinguishing_aspect: "One rejected request closed at 2026-05-01 counts under LIFETIME (score 95) but falls outside the 30-day COMPLIANCE_WINDOW_DAYS cutoff when the clock reads 2026-07-01 (score 100), so the two scopes disagree on identical stored data."
