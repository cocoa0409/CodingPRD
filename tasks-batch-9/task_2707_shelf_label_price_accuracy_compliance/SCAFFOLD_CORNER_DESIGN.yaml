            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California", scanner_error_rate_threshold_pct: 2.0, overcharge_refund_policy: "REFUND_DIFFERENCE_ONLY", refund_cap_cents: 5000, refund_budget_per_audit_cents: 100000 }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
