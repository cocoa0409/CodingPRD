            - "Omitting the scope query parameter returns the LIFETIME figures"

      - name: hygiene_penalty_cap_is_applied_before_the_two_factor_multiplier
        claim_type: Constants Applied
        grounds:
          - calculations.hygiene_score
          - entities.CredentialFinding.fields.weight
        distinguishing_aspect: "Three BREACHED_PASSWORD findings give raw_penalty 75, which HYGIENE_PENALTY_CAP clips to 70 BEFORE the 0.60 multiplier: the attested score is 100 - 42.00 = 58.00 (WEAK), not 100 - min(45.00, 70) = 55.00 that cap-after-multiply would produce."
