            - { call: "POST /audit-work-orders/${wo}/issue-result", payload: {}, as: AuditManager, as_user_id: "mgr-1" }
            - { call: "GET /audit-results/${res1}/billing-transactions", payload: {}, as: AuditManager, captures: { bill1: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: AuditManager }
