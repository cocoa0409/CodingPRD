  - rule_id: priority_pair_validation_conflict
    instances:

      - name: admin_suspended_cycle_state_check_outranks_course_standing_check_on_credit_filing
        grounds:
          - validations[priority 56 -> ERR_CYCLE_ADMIN_SUSPENDED]
          - validations[priority 62 -> ERR_COURSE_NOT_APPROVED]
          - state_machines.ComplianceCycle.DELINQUENT_to_ADMIN_SUSPENDED
          - state_machines.ComplianceCycle.ADMIN_SUSPENDED_to_REINSTATED
          - errors[ERR_CYCLE_ADMIN_SUSPENDED]
          - errors[ERR_COURSE_NOT_APPROVED]
        distinguishing_aspect: |
          One POST /cle/credit-records violates a `state` rule (priority 56: the resolved cycle is
          ADMIN_SUSPENDED) AND a `business_safety` rule (priority 62: the course is still
          PENDING_APPROVAL, and the acting attorney is not in good standing either). The ascending
          priority order must surface ERR_CYCLE_ADMIN_SUSPENDED (409), never
          ERR_COURSE_NOT_APPROVED. Curing only the suspension then makes the SAME request return
          ERR_COURSE_NOT_APPROVED, proving both violations were live simultaneously.
        test_recipe:
          setup:
            - "One ACTIVE attorney admitted 2009-08-01, compliance GROUP_1, with cycle 2024-01-01 -> 2026-01-01 (filing_deadline 2026-02-01) and no credits at all."
            - "That attorney also filed an individual-approval SELF_STUDY course (presented 2025-06-01, AFFIRMATION_ONLY) and never filed an application for it, so the course sits in PENDING_APPROVAL forever."
            - "Two sweeps drive the cycle to ADMIN_SUSPENDED: the first at the 2026-08-01 default clock, the second after the clock is advanced to 2026-09-30."
          setup_api_calls:
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-8008", full_name: "Nadia Farouk", admission_date: "2009-08-01T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2024-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /cle/courses"
              payload: { title: "Unreviewed Self-Study on Trust Accounting", delivery_format: "SELF_STUDY", total_minutes: 180, presented_at: "2025-06-01T09:00:00Z", attendance_verification_method: "AFFIRMATION_ONLY", credit_allocations: [ { category: "ETHICS", minutes: 180 } ] }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { crs_id: $.data.id }
            - call: "POST /cle/reporting-sweeps"
              payload: {}
              as: BoardAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /cle/reporting-sweeps"
              payload: {}
              as: BoardAdmin
          trigger:
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "${att_id}", course_id: "${crs_id}", verification_method: "AFFIRMATION", attended_minutes: 180, completion_date: "2025-07-01T00:00:00Z" }
              as: Attorney
              as_user_id: "${att_id}"
              expect_error: ERR_CYCLE_ADMIN_SUSPENDED
            - call: "GET /cle/fee-assessments?attorney_id=${att_id}"
              as: BoardAdmin
              captures: { fee_late: "$.data.items[0].id", fee_reinstate: "$.data.items[1].id" }
            - call: "POST /cle/fee-assessments/${fee_late}/settlement"
              payload: { action: "PAY" }
              as: BoardAdmin
            - call: "POST /cle/fee-assessments/${fee_reinstate}/settlement"
              payload: { action: "PAY" }
              as: BoardAdmin
            - call: "POST /cle/attorneys/${att_id}/reinstatement"
              payload: { cycle_id: "${cyc_id}", cure_basis: "BOARD_ORDER", reason: "Suspension lifted on reconsideration." }
              as: BoardAdmin
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "${att_id}", course_id: "${crs_id}", verification_method: "AFFIRMATION", attended_minutes: 180, completion_date: "2025-07-01T00:00:00Z" }
              as: Attorney
              as_user_id: "${att_id}"
              expect_error: ERR_COURSE_NOT_APPROVED
          assert:
            - "Before the first trigger: ComplianceCycle.${cyc_id}.administrative_status == ADMIN_SUSPENDED, credit_status == OPEN, and Course.${crs_id}.status == PENDING_APPROVAL"
            - "First trigger -> HTTP 409 with error.id == ERR_CYCLE_ADMIN_SUSPENDED (priority 56 wins)"
            - "First trigger -> the response error.id is NOT ERR_COURSE_NOT_APPROVED and NOT ERR_ATTORNEY_NOT_IN_GOOD_STANDING, even though both priority-62 conditions also hold"
            - "First trigger -> no CreditRecord row was created and ComplianceCycle.${cyc_id}.version is unchanged"
            - "After reinstatement: administrative_status == REINSTATED, Attorney.${att_id}.status == ACTIVE, outstanding_fee_cents == 0"
            - "Second trigger (byte-identical payload) -> HTTP 409 with error.id == ERR_COURSE_NOT_APPROVED (priority 62 now surfaces)"
            - "Second trigger -> still no CreditRecord row exists for (${att_id}, ${crs_id})"

      - name: expired_course_window_check_outranks_duplicate_record_constraint_on_refiling
        grounds:
          - validations[priority 68 -> ERR_COURSE_APPROVAL_EXPIRED]
          - validations[priority 72 -> ERR_DUPLICATE_CREDIT_RECORD]
          - entities.Course.fields.expires_at
          - errors[ERR_COURSE_APPROVAL_EXPIRED]
          - errors[ERR_DUPLICATE_CREDIT_RECORD]
        distinguishing_aspect: |
          A different error-category pair on the same endpoint: `business_temporal` (priority 68,
          completion_date later than the LIVE course's expires_at = presented_at + total_minutes)
          against `business_constraint` (priority 72, a non-terminal CreditRecord already exists for
          this attorney/course pair). The temporal error must win; correcting only the date then
          exposes the duplicate error. Falsifiable: an implementation that checks uniqueness first
          (the cheap index lookup) returns ERR_DUPLICATE_CREDIT_RECORD on the first trigger.
        test_recipe:
          setup:
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
            - "One ACCREDITED self-certifying provider with one APPROVED LIVE_IN_PERSON course of 240 minutes presented 2026-03-01T09:00:00Z, so expires_at == 2026-03-01T13:00:00Z, verified by ATTENDANCE_CODE."
            - "One ACTIVE attorney with cycle 2026-01-01 -> 2028-01-01 who already holds a VERIFIED record for that course completed exactly at 2026-03-01T13:00:00Z."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Riverbend Judicial College", provider_type: "GOVERNMENT" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
            - call: "POST /cle/courses"
              payload: { title: "Bench-Bar Evidence Seminar", delivery_format: "LIVE_IN_PERSON", total_minutes: 240, presented_at: "2026-03-01T09:00:00Z", attendance_verification_method: "ATTENDANCE_CODE", credit_allocations: [ { category: "GENERAL", minutes: 240 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { crs_id: $.data.id, crs_code: $.data.attendance_code }
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-9009", full_name: "Gregor Lindqvist", admission_date: "2014-02-01T00:00:00Z", compliance_group: "GROUP_2", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "${att_id}", course_id: "${crs_id}", verification_method: "ATTENDANCE_CODE", attended_minutes: 240, completion_date: "2026-03-01T13:00:00Z", attendance_code: "${crs_code}" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { rec1: $.data.id }
          trigger:
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "${att_id}", course_id: "${crs_id}", verification_method: "ATTENDANCE_CODE", attended_minutes: 240, completion_date: "2026-03-02T00:00:00Z", attendance_code: "${crs_code}" }
              as: Attorney
              as_user_id: "${att_id}"
              expect_error: ERR_COURSE_APPROVAL_EXPIRED
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "${att_id}", course_id: "${crs_id}", verification_method: "ATTENDANCE_CODE", attended_minutes: 240, completion_date: "2026-03-01T12:00:00Z", attendance_code: "${crs_code}" }
              as: Attorney
              as_user_id: "${att_id}"
              expect_error: ERR_DUPLICATE_CREDIT_RECORD
          assert:
            - "Course.${crs_id}.expires_at == 2026-03-01T13:00:00Z (presented_at + total_minutes for a LIVE format)"
            - "CreditRecord.${rec1}.status == VERIFIED (the boundary completion_date == expires_at is accepted)"
            - "First trigger -> HTTP 409 with error.id == ERR_COURSE_APPROVAL_EXPIRED (priority 68 wins over priority 72)"
            - "Second trigger -> HTTP 409 with error.id == ERR_DUPLICATE_CREDIT_RECORD (the temporal defect is gone, the constraint defect remains)"
            - "Exactly one CreditRecord exists for (${att_id}, ${crs_id}) after both triggers, and ComplianceCycle.${cyc_id}.earned_countable_minutes is still 240"
            - "Course.${crs_id}.verified_credit_record_count == 1"

  - rule_id: boundary_precision_check
    instances:

      - name: self_study_cap_exactly_at_360_minutes_then_one_record_past_it
        grounds:
          - domain_constants.SELF_STUDY_CAP_MINUTES
          - calculations.cycle_credit_application
          - entities.CreditRecord.fields.credited_minutes
          - entities.CreditRecord.fields.countable_minutes
          - endpoints[POST /cle/credit-records]
        distinguishing_aspect: |
          Metric under test: SELF-STUDY MINUTES against SELF_STUDY_CAP_MINUTES (360), at the endpoint
          POST /cle/credit-records. Three records straddle the cap in one cycle: 345 lands below it,
          the next 30-minute record is clipped to exactly 15 so self_study_used lands EXACTLY on 360,
          and the third record is clipped to 0. The credited/countable split is the observable: the
          clipped record keeps credited_minutes 30 while countable_minutes is 15. Falsifiable: an
          off-by-one cap (>= vs >) either rejects the second record entirely or lets 375 minutes count.
        test_recipe:
          setup:
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
            - "One ACCREDITED self-certifying provider with three APPROVED SELF_STUDY courses verified by ATTENDANCE_CODE: SSA 345 minutes, SSB 30 minutes, SSC 30 minutes, all GENERAL."
            - "One ACTIVE attorney with a non-prorated 2026-01-01 -> 2028-01-01 cycle."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Prairie State Law Institute", provider_type: "LAW_SCHOOL" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
            - call: "POST /cle/courses"
              payload: { title: "Self-Study: Land Use Basics", delivery_format: "SELF_STUDY", total_minutes: 345, presented_at: "2026-02-01T09:00:00Z", attendance_verification_method: "ATTENDANCE_CODE", credit_allocations: [ { category: "GENERAL", minutes: 345 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { ssa: $.data.id, ssa_code: $.data.attendance_code }
            - call: "POST /cle/courses"
