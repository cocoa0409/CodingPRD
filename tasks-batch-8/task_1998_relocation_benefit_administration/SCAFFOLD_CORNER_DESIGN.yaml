  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: direct_bill_claim_gets_zero_gross_up
        claim_type: input_set_filtering
        grounds: [calculations.tax_gross_up, entities.ExpenseClaim.fields.taxable]
        distinguishing_aspect: "The gross-up input set excludes DIRECT_BILL claims: a 40000-cent DIRECT_BILL claim pays gross_up_cents 0, total_payment_cents 40000, and cumulative_taxable_paid_cents stays 0."
        test_recipe:
          setup: ["MANAGER/DOMESTIC/RENTER FLAT policy; case IN_PROGRESS; DIRECT_BILL LODGING claim of 40000 APPROVED"]
          setup_api_calls:
            - call: "POST /policies"
              payload: { job_level: MANAGER, move_scope: DOMESTIC, home_ownership: RENTER, hhg_cap_cents: 500000, temp_housing_cap_cents: 300000, temp_housing_max_nights: 30, travel_cap_cents: 100000, loss_on_sale_cap_cents: 0, misc_cap_cents: 200000, home_sale_eligible: false, repayment_window_months: 24, gross_up_method: FLAT_SUPPLEMENTAL, flat_gross_up_rate: 0.22, marginal_bracket_threshold_cents: 100000, marginal_rate_low: 0.25, marginal_rate_high: 0.4, loss_basis: APPRAISED }
              as: MobilityCoordinator
            - call: "POST /employees"
              payload: { full_name: "Direct Deb", job_level: MANAGER, home_ownership: RENTER }
              as: MobilityCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /relocation-cases"
              payload: { employee_id: "${emp_id}", move_scope: DOMESTIC, origin_city: "Chicago", destination_city: "Denver", expected_move_date: "2026-09-01T00:00:00Z" }
              as: MobilityCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /relocation-cases/${case_id}/authorize"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /relocation-cases/${case_id}/start"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /expense-claims"
              payload: { case_id: "${case_id}", category: LODGING, payment_method: DIRECT_BILL, lines: [{ description: "Hotel direct bill", amount_cents: 40000 }] }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { claim_id: $.data.id, cl_taxable: $.data.taxable }
            - call: "GET /relocation-cases/${case_id}"
              as: MobilityCoordinator
              captures: { case_v: $.data.version }
            - call: "POST /expense-claims/${claim_id}/approve"
              payload: { expected_case_version: "${case_v}" }
              as: FinanceSpecialist
          trigger:
            - call: "POST /expense-claims/${claim_id}/pay"
              payload: {}
              as: FinanceSpecialist
          assert:
            - "${cl_taxable} == false"
            - "ExpenseClaim.${claim_id}.gross_up_cents == 0 and total_payment_cents == 40000"
            - "RelocationCase.${case_id}.total_paid_cents == 40000"
            - "RelocationCase.${case_id}.cumulative_taxable_paid_cents == 0"

      - name: marginal_gross_up_applies_bracket_by_payment_order
        claim_type: chronological_order
        grounds: [calculations.tax_gross_up, entities.RelocationCase.fields.cumulative_taxable_paid_cents]
        distinguishing_aspect: "Under MARGINAL_AGGREGATE the bracket split depends on cumulative taxable history at pay time: paying 60000 first consumes 60000 of the 100000 low bracket, so the second 50000 claim splits 40000 low + 10000 high (gross-up 13333 + 6667 = 20000)."
        test_recipe:
          setup: ["DIRECTOR/DOMESTIC/RENTER MARGINAL_AGGREGATE policy (threshold 100000, low 0.25, high 0.40); case IN_PROGRESS; claims A (60000) and B (50000) both APPROVED"]
          setup_api_calls:
            - call: "POST /policies"
              payload: { job_level: DIRECTOR, move_scope: DOMESTIC, home_ownership: RENTER, hhg_cap_cents: 500000, temp_housing_cap_cents: 300000, temp_housing_max_nights: 30, travel_cap_cents: 100000, loss_on_sale_cap_cents: 0, misc_cap_cents: 200000, home_sale_eligible: false, repayment_window_months: 24, gross_up_method: MARGINAL_AGGREGATE, flat_gross_up_rate: 0.22, marginal_bracket_threshold_cents: 100000, marginal_rate_low: 0.25, marginal_rate_high: 0.4, loss_basis: APPRAISED }
              as: MobilityCoordinator
            - call: "POST /employees"
              payload: { full_name: "Marg Mike", job_level: DIRECTOR, home_ownership: RENTER }
              as: MobilityCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /relocation-cases"
              payload: { employee_id: "${emp_id}", move_scope: DOMESTIC, origin_city: "Chicago", destination_city: "Denver", expected_move_date: "2026-09-01T00:00:00Z" }
              as: MobilityCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /relocation-cases/${case_id}/authorize"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /relocation-cases/${case_id}/start"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /expense-claims"
              payload: { case_id: "${case_id}", category: MEALS, payment_method: REIMBURSEMENT, lines: [{ description: "A", amount_cents: 60000 }] }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { claim_a: $.data.id }
            - call: "GET /relocation-cases/${case_id}"
              as: MobilityCoordinator
              captures: { case_v1: $.data.version }
            - call: "POST /expense-claims/${claim_a}/approve"
              payload: { expected_case_version: "${case_v1}" }
              as: FinanceSpecialist
            - call: "POST /expense-claims"
              payload: { case_id: "${case_id}", category: MEALS, payment_method: REIMBURSEMENT, lines: [{ description: "B", amount_cents: 50000 }] }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { claim_b: $.data.id }
            - call: "GET /relocation-cases/${case_id}"
              as: MobilityCoordinator
              captures: { case_v2: $.data.version }
            - call: "POST /expense-claims/${claim_b}/approve"
              payload: { expected_case_version: "${case_v2}" }
              as: FinanceSpecialist
          trigger:
            - call: "POST /expense-claims/${claim_a}/pay"
              payload: {}
              as: FinanceSpecialist
            - call: "POST /expense-claims/${claim_b}/pay"
              payload: {}
              as: FinanceSpecialist
          assert:
            - "ExpenseClaim.${claim_a}.gross_up_cents == 20000 (fully below bracket: round_half_up(60000 x 0.25 / 0.75))"
            - "ExpenseClaim.${claim_b}.gross_up_cents == 20000 (split: 40000 at 0.25 -> 13333, 10000 at 0.40 -> 6667)"
            - "RelocationCase.${case_id}.cumulative_taxable_paid_cents == 110000"
            - "RelocationCase.${case_id}.total_paid_cents == 150000"

