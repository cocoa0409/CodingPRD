# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — task_3289
#
# Breadth probe over the §1.1–§1.7 surface: every testable claim the scaffold
# declares that SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise.
# Corners that §1.8 already covers appear as `excluded_because:` stubs with no
# test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: studio_signup_returns_derived_tier_gates_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Studio
          - entities.BusinessSubscription
          - endpoints.POST_/wellness/studios
          - response_envelope.success
        distinguishing_aspect: "Signing up carries only five client-supplied fields; status, feature_gates, client_roster_count, outstanding_balance_cents, subscription_id and data_ownership_state are all derived or system-minted, and version starts at 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_tier_growth
              call: "POST /wellness/subscription-tiers"
              payload: { tier: "GROWTH", monthly_fee_cents: 9900, tier_rank: 2, included_staff_seats: 4, seat_overage_fee_cents: 1900, marketplace_listing_enabled: true, staff_payroll_enabled: true, instructor_substitution_enabled: true, waitlist_auto_promotion_enabled: true, crm_client_export_enabled: true, marketplace_commission_bps: 1500 }
              as: PlatformAdmin
            - &c_clock_jun
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: OperatorOnly
          trigger:
            - call: "POST /wellness/studios"
              payload: { legal_name: "Prana Loft", home_state_code: "CA", owner_full_name: "Nadia Okafor", tier: "GROWTH", billing_period: "MONTHLY", payroll_cap_mode: "BONUS_OUTSIDE_CAP" }
              as: Anonymous
              captures: { studio_id: $.data.id, sub_id: $.data.subscription_id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Studio.${studio_id}.status == TRIAL and Studio.${studio_id}.version == 1"
            - "Studio.${studio_id}.data_ownership_state == OWNED"
            - "Studio.${studio_id}.feature_gates.marketplace_listing == true and .staff_payroll == true, taken from the GROWTH tier"
            - "Studio.${studio_id}.client_roster_count == 0 and outstanding_balance_cents == 0"
            - "GET /wellness/subscriptions/${sub_id} returns status TRIAL, dunning_stage CURRENT, renewal_epoch 0 and monthly_fee_cents_snapshot == 9900"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

      - name: class_session_create_derives_end_price_and_posture_from_the_template
        claim_type: Computed Fields
        grounds:
          - entities.ClassSession.fields.list_price_cents
          - entities.ClassSession.fields.marketplace_price_cents
          - entities.ClassSession.fields.fullness_posture
          - calculations.session_list_price
          - calculations.seat_availability_posture
        distinguishing_aspect: "end_at, list_price_cents, marketplace_price_cents, price_version and fullness_posture are all computed on create from the template, the tier and the capacity, so two sessions on the same template at different tiers carry different prices for identical inputs."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio with a payroll period, a 4000-cent off-peak template and an instructor."
          setup_api_calls:
            - *c_tier_growth
            - *c_clock_jun
            - call: "POST /wellness/studios"
              payload: { legal_name: "Prana Loft", home_state_code: "CA", owner_full_name: "Nadia Okafor", tier: "GROWTH", billing_period: "MONTHLY", payroll_cap_mode: "BONUS_OUTSIDE_CAP" }
              as: Anonymous
              captures: { studio_id: $.data.id, sub_id: $.data.subscription_id }
            - call: "GET /wellness/subscriptions/${sub_id}"
              payload: {}
              as: PlatformAdmin
              captures: { sub_v: $.data.version }
            - &c_pp_june
              call: "POST /wellness/payroll-periods"
              payload: { studio_id: "${studio_id}", period_index: 1, start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-30T23:59:59Z" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { pp1_id: $.data.id, pp1_v: $.data.version }
            - &c_tpl_flow
              call: "POST /wellness/class-templates"
              payload: { studio_id: "${studio_id}", name: "Reformer Flow 50", duration_minutes: 50, base_price_cents: 4000, default_capacity: 2, credit_cost: 1, is_off_peak: true, buffer_minutes: 15 }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { tpl_id: $.data.id }
            - &c_staff_ivy
              call: "POST /wellness/staff-members"
              payload: { studio_id: "${studio_id}", full_name: "Ivy Chen", staff_role: "INSTRUCTOR", primary_class_template_id: "${tpl_id}", substitute_class_template_ids: ["${tpl_id}"], commission_rate_bps: 0 }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { ivy_id: $.data.id, ivy_v: $.data.version }
          trigger:
            - call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", class_template_id: "${tpl_id}", instructor_staff_id: "${ivy_id}", room_code: "ROOM-A", start_at: "2026-06-20T17:00:00Z", capacity: 2, expected_subscription_version: "${sub_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { sess_id: $.data.id }
          assert:
            - "ClassSession.${sess_id}.end_at == 2026-06-20T17:50:00Z, derived from start_at plus the template duration"
            - "ClassSession.${sess_id}.list_price_cents == 3360: 4000 base, times the 0.80 off-peak factor, times the GROWTH 1.05 tier factor, floored"
            - "ClassSession.${sess_id}.marketplace_price_cents == 3953: 3360 grossed up by ceil(3360 * 10000 / 8500)"
            - "ClassSession.${sess_id}.price_version == 1 and fullness_posture == OPEN"
            - "ClassSession.${sess_id}.promo_offer_state == NONE because no promotional allocation was requested"
            - "ClassSession.${sess_id}.payroll_period_id == ${pp1_id}"

      - name: class_session_update_ignores_client_supplied_derived_fields
        claim_type: System Fields
        grounds:
          - entities.ClassSession.fields.price_version
          - entities.ClassSession.fields.seats_taken
          - endpoints.PUT_/wellness/class-sessions/{id}
        distinguishing_aspect: "A PUT that names only capacity still leaves every derived field under server control: end_at, price_version and fullness_posture are recomputed rather than echoed, and a request cannot set seats_taken or status."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio with payroll period, template, instructor and a capacity-2 session."
          setup_api_calls:
            - *c_tier_growth
            - *c_clock_jun
            - call: "POST /wellness/studios"
              payload: { legal_name: "Prana Loft", home_state_code: "CA", owner_full_name: "Nadia Okafor", tier: "GROWTH", billing_period: "MONTHLY", payroll_cap_mode: "BONUS_OUTSIDE_CAP" }
              as: Anonymous
              captures: { studio_id: $.data.id, sub_id: $.data.subscription_id }
            - call: "GET /wellness/subscriptions/${sub_id}"
              payload: {}
              as: PlatformAdmin
              captures: { sub_v: $.data.version }
            - *c_pp_june
            - *c_tpl_flow
            - *c_staff_ivy
            - &c_sess_roomA
              call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", class_template_id: "${tpl_id}", instructor_staff_id: "${ivy_id}", room_code: "ROOM-A", start_at: "2026-06-20T17:00:00Z", capacity: 2, expected_subscription_version: "${sub_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { sess_id: $.data.id, sess_v: $.data.version }
          trigger:
            - call: "PUT /wellness/class-sessions/${sess_id}"
              payload: { capacity: 4, expected_class_session_version: "${sess_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { err_extra: $.data.error_id }
          assert:
            - "the update succeeds and ClassSession.${sess_id}.capacity == 4"
            - "ClassSession.${sess_id}.seats_taken == 0 and seats_held == 0 — neither counter is client-settable"
            - "ClassSession.${sess_id}.status == SCHEDULED and price_version == 1, because capacity alone does not reprice"
            - "an update that renames room_code to ROOM-A2 bumps price_version to 2 and recomputes both prices, so a repricing is observable through price_version"
            - "no request may carry status, seats_taken or end_at: those keys are not declared in the endpoint's input and are ignored"

      - name: sessions_list_paginates_and_total_count_counts_the_whole_filtered_set
        claim_type: Listing
        grounds:
          - endpoints.GET_/wellness/class-sessions
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three sessions on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the last row with has_more false — total_count covers the filtered set, not the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio with payroll period, template, instructor, a capacity-2 session and a capacity-30 session."
          setup_api_calls:
            - *c_tier_growth
            - *c_clock_jun
            - call: "POST /wellness/studios"
              payload: { legal_name: "Prana Loft", home_state_code: "CA", owner_full_name: "Nadia Okafor", tier: "GROWTH", billing_period: "MONTHLY", payroll_cap_mode: "BONUS_OUTSIDE_CAP" }
              as: Anonymous
              captures: { studio_id: $.data.id, sub_id: $.data.subscription_id }
            - call: "GET /wellness/subscriptions/${sub_id}"
              payload: {}
              as: PlatformAdmin
              captures: { sub_v: $.data.version }
            - *c_pp_june
            - *c_tpl_flow
            - call: "POST /wellness/class-templates"
              payload: { studio_id: "${studio_id}", name: "Candlelight Restore 60", duration_minutes: 60, base_price_cents: 5000, default_capacity: 30, credit_cost: 2, is_off_peak: false, buffer_minutes: 30 }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { tpl_restore_id: $.data.id }
            - *c_staff_ivy
            - call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", class_template_id: "${tpl_id}", instructor_staff_id: "${ivy_id}", room_code: "ROOM-A", start_at: "2026-06-20T17:00:00Z", capacity: 2, expected_subscription_version: "${sub_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { sess_1_id: $.data.id }
            - call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", class_template_id: "${tpl_id}", instructor_staff_id: "${ivy_id}", room_code: "ROOM-B", start_at: "2026-06-21T17:00:00Z", capacity: 2, expected_subscription_version: "${sub_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { sess_2_id: $.data.id }
            - call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", class_template_id: "${tpl_restore_id}", instructor_staff_id: "${ivy_id}", room_code: "ROOM-C", start_at: "2026-06-22T19:00:00Z", capacity: 30, expected_subscription_version: "${sub_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { sess_3_id: $.data.id }
          trigger:
            - call: "GET /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", limit: 2, offset: 0 }
              as: StaffMember
              as_user_id: "${ivy_id}"
          assert:
            - "the response status is 200 and response_type is array"
            - "the page returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /wellness/class-sessions?studio_id=${studio_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /wellness/class-sessions?studio_id=${studio_id}&class_template_id=${tpl_restore_id} returns exactly 1 row"
            - "GET /wellness/class-sessions?studio_id=${studio_id} with no limit defaults to limit 10 and offset 0"

      - name: class_session_get_with_an_unknown_id_returns_class_session_not_found
        claim_type: Not Found
        grounds:
          - errors.ERR_CLASS_SESSION_NOT_FOUND
          - endpoints.GET_/wellness/subscriptions/{id}
        distinguishing_aspect: "An unallocated but syntactically valid UUID produces the entity-specific 404 rather than a generic one, and the substitution a caller must avoid — ERR_STUDIO_NOT_FOUND — is a different id all told."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. One GROWTH studio exists; no class session has been created."
          setup_api_calls:
            - *c_tier_growth
            - *c_clock_jun
            - call: "POST /wellness/studios"
              payload: { legal_name: "Prana Loft", home_state_code: "CA", owner_full_name: "Nadia Okafor", tier: "GROWTH", billing_period: "MONTHLY", payroll_cap_mode: "BONUS_OUTSIDE_CAP" }
              as: Anonymous
              captures: { studio_id: $.data.id }
          trigger:
            - call: "GET /wellness/subscriptions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_SUBSCRIPTION_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"
            - "the same shape holds for ERR_STUDIO_NOT_FOUND, ERR_CLASS_SESSION_NOT_FOUND and ERR_BOOKING_NOT_FOUND on their own paths"

      - name: class_pack_create_defaults_auto_renew_and_starts_fully_credited
        claim_type: Defaults
        grounds:
          - entities.ClassPack.fields.credits_remaining
          - entities.ClassPack.fields.status
          - entities.Membership.fields.auto_renew
          - endpoints.POST_/wellness/class-packs
        distinguishing_aspect: "credits_remaining, status, expires_at and extension_days_used are all derivable at creation, so a pack created with pack_size 5 and expiry_scheme NONE stores exactly 5 spendable credits and an expiry 180 days out, never null."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio with a client."
          setup_api_calls:
            - *c_tier_growth
            - *c_clock_jun
            - call: "POST /wellness/studios"
              payload: { legal_name: "Prana Loft", home_state_code: "CA", owner_full_name: "Nadia Okafor", tier: "GROWTH", billing_period: "MONTHLY", payroll_cap_mode: "BONUS_OUTSIDE_CAP" }
              as: Anonymous
              captures: { studio_id: $.data.id }
            - &c_client_maya
              call: "POST /wellness/clients"
              payload: { home_studio_id: "${studio_id}", display_name: "Maya Alvarez", email: "maya@example.com", home_state_code: "CA" }
              as: Client
              captures: { maya_id: $.data.id, maya_v: $.data.version }
          trigger:
            - call: "POST /wellness/class-packs"
              payload: { studio_id: "${studio_id}", client_id: "${maya_id}", pack_size: 5, purchased_at: "2026-06-01T00:00:00Z", expiry_scheme: "NONE", expected_client_version: "${maya_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { pack_id: $.data.id }
          assert:
            - "ClassPack.${pack_id}.credits_remaining == 5 and status == ACTIVE"
            - "ClassPack.${pack_id}.expires_at == 2026-11-28T00:00:00Z, exactly PACK_VALIDITY_DAYS 180 days after purchased_at"
            - "ClassPack.${pack_id}.extension_days_used == 0 and pending_expiry_grace_until is null"
            - "a pack created with the PROMOTIONAL scheme expires 30 days out and refuses a pack_size above 12"
            - "Client.${maya_id}.version advanced by 1 as the OCC-guarded side effect of the pack creation"

      - name: client_create_rejects_a_duplicate_email_on_the_same_roster_but_allows_it_elsewhere
        claim_type: Type Constraints
        grounds:
          - validations.check_uniqueness_band
          - errors.ERR_CLIENT_EMAIL_CONFLICT
          - entities.Client.fields.email
          - entities.Client.fields.home_state_code
        distinguishing_aspect: "email uniqueness is scoped to a single studio roster, so the same address is admitted on a second studio while being refused as a duplicate on the first, and an out-of-vocabulary state code is refused as a bad request rather than as a conflict."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Two GROWTH studios, each with a client using the same address."
          setup_api_calls:
            - *c_tier_growth
            - *c_clock_jun
            - call: "POST /wellness/studios"
              payload: { legal_name: "Prana Loft", home_state_code: "CA", owner_full_name: "Nadia Okafor", tier: "GROWTH", billing_period: "MONTHLY", payroll_cap_mode: "BONUS_OUTSIDE_CAP" }
              as: Anonymous
              captures: { studio_id: $.data.id }
            - call: "POST /wellness/studios"
              payload: { legal_name: "Prana Annex", home_state_code: "NY", owner_full_name: "Nadia Okafor", tier: "GROWTH", billing_period: "MONTHLY", payroll_cap_mode: "BONUS_OUTSIDE_CAP" }
              as: Anonymous
              captures: { studio_b_id: $.data.id }
            - *c_client_maya
          trigger:
            - call: "POST /wellness/clients"
              payload: { home_studio_id: "${studio_id}", display_name: "Maya Duplicate", email: "maya@example.com", home_state_code: "CA" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { err_dup: $.data.error_id }
            - call: "POST /wellness/clients"
              payload: { home_studio_id: "${studio_b_id}", display_name: "Maya Alvarez", email: "maya@example.com", home_state_code: "NY" }
              as: Client
              captures: { maya_b_id: $.data.id }
            - call: "POST /wellness/clients"
              payload: { home_studio_id: "${studio_id}", display_name: "Bad State", email: "bad@example.com", home_state_code: "ZZ" }
              as: Client
              captures: { err_state: $.data.error_id }
          assert:
            - "the same-roster duplicate is refused with ERR_CLIENT_EMAIL_CONFLICT at 409"
            - "the cross-studio reuse succeeds, returning 201 with Client.${maya_b_id}.home_studio_id == ${studio_b_id}"
            - "the out-of-vocabulary state code is refused with 400 and ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER is NOT the error, so the request passed authentication and failed on the field"
            - "GET /wellness/clients?home_studio_id=${studio_id} returns exactly 1 row"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: check_in_before_the_window_opens_returns_invalid_state
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Booking.RESERVED_to_CHECKED_IN
          - errors.ERR_INVALID_STATE
          - calculations.operational_windows
        distinguishing_aspect: "Check-in is gated on the session being IN_PROGRESS and on the clock being inside the 60-minute pre-start window, so a check-in four hours early is refused with ERR_INVALID_STATE and leaves the booking RESERVED."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-20T12:00:00Z. GROWTH studio with payroll period, template, instructor, a capacity-2 session starting 2026-06-20T17:00:00Z and a booked client."
          setup_api_calls:
            - &d_tier_growth
              call: "POST /wellness/subscription-tiers"
              payload: { tier: "GROWTH", monthly_fee_cents: 9900, tier_rank: 2, included_staff_seats: 4, seat_overage_fee_cents: 1900, marketplace_listing_enabled: true, staff_payroll_enabled: true, instructor_substitution_enabled: true, waitlist_auto_promotion_enabled: true, crm_client_export_enabled: true, marketplace_commission_bps: 1500 }
              as: PlatformAdmin
            - &d_clock_jun
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: OperatorOnly
            - &d_studio
              call: "POST /wellness/studios"
              payload: { legal_name: "Prana Loft", home_state_code: "CA", owner_full_name: "Nadia Okafor", tier: "GROWTH", billing_period: "MONTHLY", payroll_cap_mode: "BONUS_OUTSIDE_CAP" }
              as: Anonymous
              captures: { studio_id: $.data.id, sub_id: $.data.subscription_id, sub_v: $.data.version }
            - &d_pp_june
              call: "POST /wellness/payroll-periods"
              payload: { studio_id: "${studio_id}", period_index: 1, start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-30T23:59:59Z" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { pp1_id: $.data.id, pp1_v: $.data.version }
            - &d_tpl_flow
              call: "POST /wellness/class-templates"
              payload: { studio_id: "${studio_id}", name: "Reformer Flow 50", duration_minutes: 50, base_price_cents: 4000, default_capacity: 2, credit_cost: 1, is_off_peak: true, buffer_minutes: 15 }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { tpl_id: $.data.id }
            - &d_staff_ivy
              call: "POST /wellness/staff-members"
              payload: { studio_id: "${studio_id}", full_name: "Ivy Chen", staff_role: "INSTRUCTOR", primary_class_template_id: "${tpl_id}", substitute_class_template_ids: ["${tpl_id}"], commission_rate_bps: 0 }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { ivy_id: $.data.id }
            - &d_sess
              call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", class_template_id: "${tpl_id}", instructor_staff_id: "${ivy_id}", room_code: "ROOM-A", start_at: "2026-06-20T17:00:00Z", capacity: 2, expected_subscription_version: "${sub_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { sess_id: $.data.id }
            - &d_client_maya
              call: "POST /wellness/clients"
              payload: { home_studio_id: "${studio_id}", display_name: "Maya Alvarez", email: "maya@example.com", home_state_code: "CA" }
              as: Client
              captures: { maya_id: $.data.id }
            - &d_booking
              call: "POST /wellness/bookings"
              payload: { client_id: "${maya_id}", class_session_id: "${sess_id}", channel: "STUDIO", payment_source: "DROP_IN" }
              as: Client
              as_user_id: "${maya_id}"
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /wellness/bookings/${bk_id}/check-in"
              payload: {}
              as: Client
              as_user_id: "${maya_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "Booking.${bk_id}.status is still RESERVED"
            - "after POST /_clock/set_current_utc to 2026-06-20T16:00:00Z the check-in is refused again, because the session itself is still SCHEDULED rather than IN_PROGRESS"
            - "after POST /_clock/set_current_utc to 2026-06-20T16:30:00Z the check-in succeeds and Booking.${bk_id}.status == CHECKED_IN"

      - name: claim_on_a_hold_that_was_never_offered_returns_entry_not_offered
        claim_type: invalid_transition
        grounds:
          - state_machines.WaitlistEntry.OFFERED_to_CLAIMED
          - errors.ERR_ENTRY_NOT_OFFERED
          - entities.WaitlistEntry.fields.status
        distinguishing_aspect: "The claim transition is declared only from OFFERED, so an ACTIVE hold — even the highest-ranked one in a session with a free seat — is refused with ERR_ENTRY_NOT_OFFERED rather than being silently accepted."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio with payroll period, template, instructor, a capacity-4 session and a client holding an ACTIVE waitlist position."
          setup_api_calls:
            - *d_tier_growth
            - *d_clock_jun
            - *d_studio
            - *d_pp_june
            - *d_tpl_flow
            - *d_staff_ivy
            - call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", class_template_id: "${tpl_id}", instructor_staff_id: "${ivy_id}", room_code: "ROOM-B", start_at: "2026-06-21T17:00:00Z", capacity: 4, expected_subscription_version: "${sub_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { sess_open_id: $.data.id }
            - *d_client_maya
            - call: "POST /wellness/waitlist-entries"
              payload: { class_session_id: "${sess_open_id}", client_id: "${maya_id}", position_mode: "QUEUED" }
              as: Client
              as_user_id: "${maya_id}"
              captures: { wl_id: $.data.id }
          trigger:
            - call: "POST /wellness/waitlist-entries/${wl_id}/claim"
              payload: { payment_source: "DROP_IN" }
              as: Client
              as_user_id: "${maya_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_ENTRY_NOT_OFFERED"
            - "WaitlistEntry.${wl_id}.status is still ACTIVE and promoted_booking_id is null"
            - "GET /wellness/bookings?class_session_id=${sess_open_id} returns 0 rows, so no booking was silently created"

      - name: payroll_period_auto_closes_when_the_reopen_window_lapses
        claim_type: valid_transition
        grounds:
          - state_machines.PayrollPeriod.LOCKED_to_CLOSED
          - state_machines.PayrollPeriod.LOCKED_to_OPEN
          - errors.ERR_PAYROLL_PERIOD_NOT_OPEN
        distinguishing_aspect: "The LOCKED → CLOSED hop is a system transition driven by the logical clock, not by an endpoint, and it is the lapsed reopen window rather than any request that seals the period."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio with a June payroll period, template, instructor and a capacity-2 session in June whose attendee has checked in."
          setup_api_calls:
            - *d_tier_growth
            - *d_clock_jun
            - *d_studio
            - *d_pp_june
            - *d_tpl_flow
            - *d_staff_ivy
            - *d_sess
            - *d_client_maya
            - *d_booking
            - call: "POST /wellness/bookings/${bk_id}/check-in"
              payload: {}
              as: Client
              as_user_id: "${maya_id}"
            - call: "POST /wellness/class-sessions/${sess_id}/complete"
              payload: {}
              as: PlatformAdmin
            - call: "POST /wellness/payroll-periods/${pp1_id}/close"
              payload: { expected_payroll_period_version: "${pp1_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { pp1_v2: $.data.version }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-15T00:00:00Z" }
              as: OperatorOnly
          assert:
            - "the close moved PayrollPeriod.${pp1_id} to LOCKED and paid the accrued commission entry"
            - "the reopen window closes 10 days after end_date, so the 2026-07-15 clock position seals the period"
            - "PayrollPeriod.${pp1_id}.status == CLOSED and a subsequent reopen is refused with ERR_PAYROLL_PERIOD_NOT_OPEN"
            - "GET /wellness/commission-entries?payroll_period_id=${pp1_id} reports the entry as PAID and durable against any later reversal, which would land on the next open period instead"

      - name: withdrawing_an_already_decided_portability_request_returns_already_decided
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ClientPortabilityRequest.PENDING_to_WITHDRAWN
          - errors.ERR_PORTABILITY_ALREADY_DECIDED
          - state_machines.ClientPortabilityRequest.PENDING_to_RESOLVED_DENIED
        distinguishing_aspect: "RESOLVED_DENIED and EXPIRED are terminal, so the withdraw transition declared from {PENDING, OBJECTED} is refused once a decision exists — the same row that was withdrawable a moment earlier is not."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio and one client whose balance is clear."
          setup_api_calls:
            - *d_tier_growth
            - *d_clock_jun
            - *d_studio
            - *d_client_maya
          trigger:
            - call: "POST /wellness/portability-requests"
              payload: { studio_id: "${studio_id}", requesting_client_id: "${maya_id}", dispute_reason: "relocating" }
              as: Client
              as_user_id: "${maya_id}"
              captures: { pr_id: $.data.id }
            - call: "POST /wellness/portability-requests/${pr_id}/resolve-deny"
              payload: { dispute_reason: "outstanding contract term" }
              as: StudioOwner
              as_user_id: "${studio_id}"
            - call: "POST /wellness/portability-requests/${pr_id}/withdraw"
              payload: {}
              as: Client
              as_user_id: "${maya_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the deny succeeds and ClientPortabilityRequest.${pr_id}.status == RESOLVED_DENIED"
            - "the withdraw is refused with error_id == ERR_PORTABILITY_ALREADY_DECIDED at 409"
            - "ClientPortabilityRequest.${pr_id}.status is still RESOLVED_DENIED and Studio.${studio_id}.data_ownership_state == OWNED"

  # ===========================================================================
  - section: calculations
    instances:

      - name: late_cancellation_fee_fires_exactly_inside_the_twelve_hour_window
        claim_type: Correct Result
        grounds:
          - calculations.cancellation_fee
          - calculations.cancellation_fee.constants.LATE_CANCEL_WINDOW_MINUTES
          - state_machines.Booking.RESERVED_to_LATE_CANCELLED
          - errors.ERR_CANCEL_WINDOW_CLOSED
        distinguishing_aspect: "The fee is decided by a single threshold comparison against start_at − 720 minutes, so 13 hours out is free and 11 hours out is charged the full list price — the exact instant of the boundary is the whole test."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-19T04:00:00Z. GROWTH studio with payroll period, template, instructor, a capacity-2 session starting 2026-06-20T17:00:00Z, client A booked and client B booked on a second session."
