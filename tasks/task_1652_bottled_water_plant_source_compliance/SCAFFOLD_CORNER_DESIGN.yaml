            - { call: "POST /api/production-lots/${lot}/complete", payload: { produced_units: 100 }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "GET /api/lab-tests?subject_lot_id=${lot}&test_type=FINISHED_PRODUCT", as: QAOfficer, captures: { fptest: "$.data[0].id" } }
            - { call: "POST /api/lab-tests/${fptest}/record-result", payload: { result: "PASS", collected_at: "2026-08-04T13:00:00Z" }, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/production-lots/${lot}/release", as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/plants/${plant}/bottles", payload: { bottle_code: "B-SM26" }, as: SanitationLead, captures: { b: $.data.id } }
            - { call: "POST /api/bottles/${b}/fill", payload: { lot_id: "${lot}" }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/plants/${plant}/recalls", payload: { reason: "micro positive", lot_ids: ["${lot}"] }, as: ComplianceOfficer, captures: { rec: $.data.id } }
          trigger:
            - { call: "POST /api/recalls/${rec}/recoveries", payload: { recovered_units: 99 }, as: ComplianceOfficer, captures: { rc1: $.data.units_recovered, st1: $.data.status } }
            - { call: "POST /api/recalls/${rec}/close", as: ComplianceOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /api/recalls/${rec}/recoveries", payload: { recovered_units: 1 }, as: ComplianceOfficer, captures: { rc2: $.data.units_recovered } }
            - { call: "POST /api/recalls/${rec}/close", as: ComplianceOfficer, captures: { st2: $.data.status } }
            - { call: "GET /api/bottles/${b}", as: SanitationLead, captures: { bst: $.data.status } }
            - { call: "GET /api/plants/${plant}", as: PlantAdmin, captures: { posture: $.data.compliance_posture } }
          assert:
            - "${rc1} == 99 and ${st1} == RECOVERING (first posting flipped INITIATED -> RECOVERING)"
            - "${err} == ERR_RECOVERY_INCOMPLETE"
            - "${rc2} == 100"
            - "${st2} == CLOSED (recovery exactly == scope satisfies the >= guard)"
            - "${bst} == RETURNED_DIRTY (quarantine released on close)"
            - "${posture} == GREEN (no open recall, no suspended permit, no overdue source test)"

      - name: recall_recovery_over_posting_rejected
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_RECOVERY_EXCEEDS_SCOPE]", entities.RecallEvent.fields.units_recovered]
        distinguishing_aspect: "A single posting that would push units_recovered past units_in_scope is rejected with ERR_RECOVERY_EXCEEDS_SCOPE (422) and does NOT flip INITIATED -> RECOVERING."
        test_recipe:
          setup: ["Plant with released lot (produced 50); recall over it"]
          setup_api_calls:
