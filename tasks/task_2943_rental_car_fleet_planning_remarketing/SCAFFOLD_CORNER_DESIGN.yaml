      - name: plan_posture_restricted_admits_an_exact_fill_and_refuses_an_overshoot
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PLAN_POSTURE_RESTRICTED]
          - validations[priority 25 ERR_PLAN_POSTURE_RESTRICTED]
          - entities[FleetPlan].posture
        distinguishing_aspect: "RESTRICTED is not a hard stop like FROZEN: at fill_ratio_bp exactly 9000 the plan still accepts an allocation that lands allocated_unit_count ON planned_unit_count, and refuses only the one that overshoots it - so the same posture yields both a 422 and a 201 depending on the requested unit_count."
        test_recipe:
          setup:
            - "One ATL market, MIDSIZE segment, RISK program, and a LOCKED ATL plan with planned_unit_count 10."
            - "A first allocation of 9 units drives fill_ratio_bp to floor(9*10000/10) == 9000, which is the bottom of the RESTRICTED band."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
