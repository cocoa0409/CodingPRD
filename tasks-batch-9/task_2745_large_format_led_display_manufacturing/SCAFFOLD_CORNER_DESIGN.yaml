              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { err_shape: $.data.error_id }
            - call: "POST /projects"
              payload: { customer_name: "Terminal Wall", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "00000000-0000-0000-0000-0000000000ff", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 10.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { err_ref: $.data.error_id }
            - call: "POST /projects"
              payload: { customer_name: "Terminal Wall", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 10.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
