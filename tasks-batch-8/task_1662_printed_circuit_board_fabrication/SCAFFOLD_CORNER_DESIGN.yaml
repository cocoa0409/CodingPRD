            - { call: "POST /pcb/panel-arrays/${arr}/release", payload: {}, as: CAMOperator }
            - { call: "POST /pcb/laminate-lots", payload: { material_code: "FR4_TG170", lot_code: "LOT-RF1", manufacture_date: "2025-09-01T00:00:00Z", panels_total: 100 }, as: ProcessEngineer, captures: { lot: $.data.id } }
            - { call: "POST /pcb/laminate-lots/${lot}/qualify", payload: {}, as: QualityInspector, captures: { lot_v: $.data.version } }
          trigger:
            - { call: "POST /pcb/laminate-reservations", payload: { fab_order_id: "${ord}", panel_array_id: "${arr}", laminate_lot_id: "00000000-0000-0000-0000-000000000000", panels_allocated: 34, expected_laminate_lot_version: "${lot_v}" }, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REFERENCE_NOT_FOUND with http 422"
