            - { call: "POST /contracts/${ct_id}/disclosures", payload: { disclosure_text: "Paid placement by FizzCo" }, as: IntegrationManager, captures: { d_id: $.data.id } }
            - { call: "POST /disclosures/${d_id}/file", as: IntegrationManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /episodes/${ep_id}/mark-aired", as: ProductionRep, as_user_id: "prod-1" }
            - { call: "POST /disclosures/${d_id}/acknowledge", as: NetworkStandardsReviewer, as_user_id: "nsr-1" }
            - { call: "POST /episodes/${ep_id}/airing-reports", payload: { contract_id: "${ct_id}", measured_segments_seconds: [35], measured_verbal_mentions: 2 }, as: VerificationAnalyst, as_user_id: "ver-1", captures: { r_id: $.data.id } }
          trigger:
            - { call: "POST /airing-reports/${r_id}/verify", as: VerificationAnalyst, as_user_id: "ver-2" }
            - { call: "GET /contracts/${ct_id}", as: IntegrationManager, captures: { ct_status: $.data.status, ct_bonus: $.data.bonus_cents, ct_final: $.data.final_settlement_cents, ct_outstanding: $.data.outstanding_balance_cents } }
          assert:
            - "captured ct_bonus == 10000 (min(250000, 5*2000))"
            - "captured ct_final == 1010000"
            - "captured ct_outstanding == 1010000"
            - "captured ct_status == SETTLED"
      - name: cross_promo_zero_owed_fulfilled_at_creation
        claim_type: threshold_boundary
        grounds: [calculations.cross_promo_balance, state_machines.CrossPromoObligation]
        distinguishing_aspect: "Boundary at zero: owed_count == 0 makes the obligation FULFILLED immediately at activation (>= semantics with equality)."
        test_recipe:
          setup: ["Full chain through contract creation with cross_promo_owed_count 0; episode LOCKED; GRANTED clearance"]
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "T", objective: "O", budget_cents: 1000000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/submit", as: BrandRep, as_user_id: "${b_id}" }
            - { call: "POST /series", payload: { name: "Night Shift", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_id: $.data.id, ep_v: $.data.version } }
            - { call: "POST /episodes/${ep_id}/opportunities", payload: { scene_description: "Kitchen", start_timecode_seconds: 0, end_timecode_seconds: 40, estimated_exposure_seconds: 25 }, as: ProductionRep, as_user_id: "prod-1", captures: { opp_id: $.data.id } }
            - { call: "POST /episodes/${ep_id}/clearances", payload: { brand_id: "${b_id}", expected_episode_version: "${ep_v}" }, as: IntegrationManager, captures: { cl_id: $.data.id } }
            - { call: "POST /clearances/${cl_id}/decide", payload: { decision: "GRANT" }, as: ClearanceOfficer, as_user_id: "co-1" }
            - { call: "POST /proposals", payload: { brief_id: "${br_id}", opportunity_id: "${opp_id}", proposed_fee_cents: 1000000, guaranteed_seconds: 30, guaranteed_verbal_mentions: 0, cross_promo_owed_count: 0, rate_cents_per_second: 2000 }, as: IntegrationManager, captures: { p_id: $.data.id } }
            - { call: "POST /proposals/${p_id}/submit", as: IntegrationManager }
            - { call: "POST /proposals/${p_id}/production-decision", payload: { decision: "APPROVE" }, as: ProductionRep, as_user_id: "prod-2" }
            - { call: "POST /proposals/${p_id}/network-decision", payload: { decision: "APPROVE" }, as: NetworkStandardsReviewer, as_user_id: "nsr-1" }
            - { call: "POST /episodes/${ep_id}/lock", as: ProductionRep, as_user_id: "prod-1" }
            - { call: "POST /proposals/${p_id}/contract", as: IntegrationManager, captures: { ct_id: $.data.id } }
          trigger:
            - { call: "POST /contracts/${ct_id}/activate", as: IntegrationManager }
            - { call: "GET /contracts/${ct_id}/cross-promos", as: IntegrationManager, captures: { cp_status: "$.data[0].status", cp_owed: "$.data[0].owed_count" } }
          assert:
            - "captured cp_owed == 0"
            - "captured cp_status == FULFILLED (zero-owed boundary at creation)"
      - name: provisional_value_at_contract_creation
        claim_type: variant_divergence
        grounds: [calculations.contract_billing_value]
        excluded_because:
          difficulty_instance: dual_variant_calc / provisional_vs_final_settlement_divergence
          rationale: "The provisional variant value 985000 is captured and asserted in the named §1.8 instance's setup chain."

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: create_series_missing_auth_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID headers fails authentication at priority 1 with 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /series", payload: { name: "NoAuth Show", network_name: "NBN" }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "request sent with no auth headers; captured err == ERR_UNAUTHENTICATED (HTTP 401)"
      - name: production_decider_cannot_be_episode_creator
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties: the ProductionRep whose X-User-ID equals episode.created_by_user_id cannot render the production decision."
        test_recipe:
          setup: ["Proposal submitted to PRODUCTION_REVIEW; episode created by prod-1"]
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "T", objective: "O", budget_cents: 1000000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_id: $.data.id } }
            - { call: "POST /briefs/${br_id}/submit", as: BrandRep, as_user_id: "${b_id}" }
            - { call: "POST /series", payload: { name: "Night Shift", network_name: "NBN", clearance_policy: "STANDARD" }, as: AgencyAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /series/${s_id}/episodes", payload: { episode_number: 1, runtime_seconds: 1200, air_date: "2026-06-01T20:00:00Z" }, as: ProductionRep, as_user_id: "prod-1", captures: { ep_id: $.data.id } }
            - { call: "POST /episodes/${ep_id}/opportunities", payload: { scene_description: "Kitchen", start_timecode_seconds: 0, end_timecode_seconds: 40, estimated_exposure_seconds: 25 }, as: ProductionRep, as_user_id: "prod-1", captures: { opp_id: $.data.id } }
            - { call: "POST /proposals", payload: { brief_id: "${br_id}", opportunity_id: "${opp_id}", proposed_fee_cents: 60000, guaranteed_seconds: 10, guaranteed_verbal_mentions: 0, cross_promo_owed_count: 0, rate_cents_per_second: 2000 }, as: IntegrationManager, captures: { p_id: $.data.id } }
            - { call: "POST /proposals/${p_id}/submit", as: IntegrationManager }
          trigger:
            - { call: "POST /proposals/${p_id}/production-decision", payload: { decision: "APPROVE" }, as: ProductionRep, as_user_id: "prod-1", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_SEGREGATION_OF_DUTIES (prod-1 created the episode)"
            - "IntegrationProposal.${p_id}.status == PRODUCTION_REVIEW (unchanged)"
      - name: verifier_cannot_verify_own_filing
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties on verification: the analyst whose X-User-ID equals report.filed_by_user_id cannot verify their own filing."
        test_recipe:
          setup: ["Full chain: ACTIVE contract, disclosure ACKNOWLEDGED, episode AIRED, report filed by ver-1"]
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "T", objective: "O", budget_cents: 1000000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_id: $.data.id } }
