      - name: promotion_run_epoch_increments_on_empty_run
        claim_type: action_endpoint
        grounds: [endpoints, entities.Program.fields.promotion_epoch]
        distinguishing_aspect: "A promotion run with no WAITING entries succeeds with 0 offers and still advances promotion_epoch."
        test_recipe:
          setup: ["Program cap 1; filler enrolled then disenrolled; one applicant OFFERED by run 1"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 1, current_policy_version: "v2026.1", max_reserve_slots: 0 }, as: ProgramCoordinator, captures: { prog_id: $.data.id } }
