      - name: bid_create_with_unknown_foreign_keys_reports_the_owning_entity_not_found
        claim_type: foreign_key_integrity
        grounds:
          - entities.Bid.fields.solicitation_id
          - entities.Bid.fields.bus_model_id
          - entities.Bid.fields.propulsion_package_id
          - validations[priority=5]
          - validations[priority=6]
          - validations[priority=7]
        distinguishing_aspect: |
          Referential integrity on a flat topology is checked per FK field and reports the owning
          entity's own 404 code: the same POST /bids body yields ERR_SOLICITATION_NOT_FOUND,
          ERR_BUS_MODEL_NOT_FOUND or ERR_PROPULSION_PACKAGE_NOT_FOUND depending on which id is bogus,
          and the existence checks (4-17) precede every business check.
