              as: Student
              as_user_id: "${s_cap}"
              captures: { rq_c9: "$.data.id" }
          trigger:
            - call: "POST /scheduling/course-requests/${rq_c9}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_cap}"
              captures: { cap_err: "$.data.error_id" }
          assert:
            - "error_id == ERR_REQUEST_CAP_EXCEEDED (422): 8 SUBMITTED primaries already exist"
      - name: room_type_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=13]"
          - "errors[ERR_SECTION_ASSIGNMENT_INVALID]"
        distinguishing_aspect: "Scheduling a LAB-required course into a STANDARD room fails ERR_SECTION_ASSIGNMENT_INVALID."
        test_recipe:
          setup:
