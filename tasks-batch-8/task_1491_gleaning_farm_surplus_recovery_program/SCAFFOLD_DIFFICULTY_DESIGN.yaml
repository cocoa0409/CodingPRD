  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: event_publish_requires_offer_scheduled
        grounds:
          - state_machines.GleanEvent.DRAFT_to_OPEN
          - state_machines.SurplusOffer
        distinguishing_aspect: |
          Pair GleanEvent -> SurplusOffer: publishing an event requires the
          parent offer in SCHEDULED; after the offer is CANCELLED (its events
          in DRAFT cascade-cancel too, so to isolate the dependency the event
          is created then the offer cancelled only after event removal — here we
          instead drive offer to CANCELLED via a fresh offer+event pair where
          the event is DRAFT, which survives the cascade with status CANCELLED,
          so we use a second DRAFT event attempt on the CANCELLED offer: create
          of the event itself requires offer OFFERED (creation flips it), so
          the cleanest probe: create event on OFFERED offer (offer->SCHEDULED),
          publish OK; create second offer, cancel it while no events exist
          (OFFERED->CANCELLED), then attempt to create an event against the
          CANCELLED offer -> ERR_INVALID_STATE. The dependency is Offer.status
          gating event lifecycle.
        test_recipe:
          setup:
            - "Offer O1 with event published fine; offer O2 cancelled while OFFERED (no events)"
          setup_api_calls:
            - call: "POST /glean/farms"
              payload: { farm_name: "FX", contact_email: "fx@x.com", county_code: "XXX", donor_tin: "10-3456789" }
              as: ProgramCoordinator
              captures: { farm_id: $.data.id }
            - call: "POST /glean/vehicles"
              payload: { plate: "PX", payload_capacity_lbs: 5000, refrigerated: false }
              as: ProgramCoordinator
              captures: { veh_id: $.data.id }
            - call: "POST /glean/volunteers"
              payload: { full_name: "Lead X", email: "leadx@x.com", crew_leader_certified: true }
              as: ProgramCoordinator
              captures: { lead_id: $.data.id }
            - call: "POST /glean/offers"
              payload: { farm_id: "${farm_id}", crop_code: "ROOT_VEG", estimated_lbs: 100.0, window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-20T00:00:00Z", perishability_class: "LOW", requires_refrigeration: false }
              as: ProgramCoordinator
              captures: { offer_1: $.data.id }
            - call: "POST /glean/offers"
              payload: { farm_id: "${farm_id}", crop_code: "APPLES", estimated_lbs: 100.0, window_start: "2026-08-06T00:00:00Z", window_end: "2026-08-21T00:00:00Z", perishability_class: "LOW", requires_refrigeration: false }
              as: ProgramCoordinator
              captures: { offer_2: $.data.id }
            - call: "POST /glean/events"
              payload: { surplus_offer_id: "${offer_1}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", crew_leader_volunteer_id: "${lead_id}", assigned_vehicle_id: "${veh_id}", crew_capacity: 1 }
              as: ProgramCoordinator
              captures: { ev1: $.data.id }
            - call: "POST /glean/events/${ev1}/publish"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /glean/offers/${offer_2}/cancel"
              payload: {}
              as: ProgramCoordinator
          trigger:
            - call: "POST /glean/events"
              payload: { surplus_offer_id: "${offer_2}", scheduled_start: "2026-08-11T08:00:00Z", scheduled_end: "2026-08-11T12:00:00Z", crew_leader_volunteer_id: "${lead_id}", assigned_vehicle_id: "${veh_id}", crew_capacity: 1 }
              as: ProgramCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE (GleanEvent creation gated by SurplusOffer.status — CANCELLED is terminal)"
            - "first publish on SCHEDULED offer succeeded, proving the dependency direction"

      - name: distribution_create_requires_event_harvested
        grounds:
          - state_machines.Distribution
          - state_machines.GleanEvent.IN_PROGRESS_to_HARVESTED
          - validations[priority=14]
