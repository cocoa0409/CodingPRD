        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          review-decision is exclusive to DesignReviewer, so the role check at priority 2 answers
          ERR_UNAUTHORIZED (403) before the segregation-of-duties rule at priority 36 is even consulted
          - the acting user eng-1 would also have failed the SoD test, which is precisely why the order
          matters: the reported code is about the role, not about the identity.
        test_recipe:
          setup:
            - 'one SELECTED FILTRATION stage with package F-100 IN_REVIEW, designed by eng-1'
          setup_api_calls:
            - call: "POST /water-treatment/_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00.000Z" }
