# =============================================================================
# PRD Benchmark Scaffold — Commercial Janitorial Services
# §1.0–§1.7 (SCAFFOLD.yaml). Difficulty (§1.8) and Corner (§1.9) designs live
# in their sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml and
# SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: "Commercial Janitorial Services: account & site scope/SOW, recurring schedule & route, crew assignment & time clock, supplies/consumables, inspection & quality score, periodic (strip/wax) add-on, complaint/callback, contract billing"

domain_name: commercial-janitorial-services
api_prefix: /accounts

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation        # estimated labor cost vs clocked actual; provisional vs final invoice
    - cascading_side_effects          # complaint -> callback visit -> credit -> invoice recompute
    - optimistic_concurrency          # OCC on Account.version and BillingPeriod.version
    - rate_threshold_triggers         # quality-score thresholds gate billing holdback and callback escalation
    - derived_field_reconciliation    # invoice line totals reconcile against visits/credits

  entity_topology: flat
  # Peer entities linked by foreign keys; URL paths are mostly flat collections
  # with a single nested billing-period sub-resource. No deep parent/child URL trees.

  state_machine_shape: branching
  # Visit forks SCHEDULED -> {COMPLETED, MISSED} with divergent side effects;
  # Complaint cycles OPEN -> ACKNOWLEDGED -> CALLBACK_SCHEDULED -> RESOLVED with
  # a reopen edge (RESOLVED -> OPEN). BillingPeriod is branching with revert.

  relationship_patterns:
    - one_to_many        # Account 1:* Site; Site 1:* Visit; BillingPeriod 1:* InvoiceLine
    - flat               # Visit *:1 Crew via TimeEntry junction; Complaint *:1 Visit
    - cross_aggregate    # Complaint (on Site) drives CallbackVisit and BillingPeriod credit

  role_model: peer_roles
  # AccountManager owns accounts/sites/SOW/contracts/billing; FieldSupervisor owns
  # visits/time-clock/inspections; ClientContact (entity-backed Site contact) raises
  # complaints and views their own site; PlatformAdmin operates clock/seed surface.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Account
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Client company name" }
      - { name: billing_email, type: string, source: input, description: "Where invoices are sent" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED | CLOSED — gates new sites/visits/contracts", constraints: "ACTIVE, SUSPENDED, CLOSED" }
      - { name: open_complaint_count, type: integer, source: computed, default: 0, description: "Count of Complaints across this account's sites whose status IN {OPEN, ACKNOWLEDGED, CALLBACK_SCHEDULED}" }

  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id" }
      - { name: contact_user_id, type: string, source: input, description: "Opaque ClientContact identifier authorized to raise complaints for this site; matched against X-User-ID for ClientContact role" }
      - { name: label, type: string, source: input, description: "Site label, e.g. 'HQ Lobby Tower'" }
      - { name: cleanable_sqft, type: integer, source: input, description: "Cleanable square footage used by labor-hour estimation", constraints: "must be > 0" }
      - { name: floor_type, type: enum, source: input, description: "CARPET | VCT | TERRAZZO | CONCRETE — VCT/TERRAZZO are strip/wax eligible", constraints: "CARPET, VCT, TERRAZZO, CONCRETE" }
      - { name: quality_target, type: integer, source: input, default: 85, description: "Minimum acceptable inspection score (0-100); inspections below this are deficient", constraints: "0..100" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | ARCHIVED — ARCHIVED sites accept no new schedules/visits", constraints: "ACTIVE, ARCHIVED" }

  - name: ServiceContract
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: monthly_base_cents, type: integer, source: input, description: "Flat recurring monthly charge for routine janitorial service", constraints: "must be > 0" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Crew billing rate per labor-hour for periodic add-on jobs and overage", constraints: "must be > 0" }
      - { name: callback_credit_pct, type: number, source: input, default: 0.10, description: "Fraction of monthly_base credited per resolved complaint callback (e.g. 0.10 = 10%)", constraints: "0.0..1.0" }
      - { name: quality_holdback_pct, type: number, source: input, default: 0.05, description: "Fraction of monthly_base withheld when the period's mean inspection score is below the site quality_target", constraints: "0.0..1.0" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT -> ACTIVE -> TERMINATED; only ACTIVE contracts bill", constraints: "DRAFT, ACTIVE, TERMINATED" }

  - name: RecurringSchedule
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: weekday, type: integer, source: input, description: "Day of week the route runs, 0=Monday..6=Sunday", constraints: "0..6" }
      - { name: window_start_min, type: integer, source: input, description: "Visit window start as minutes-after-midnight local (e.g. 1080 = 18:00)", constraints: "0..1439" }
      - { name: window_end_min, type: integer, source: input, description: "Visit window end as minutes-after-midnight local; must be > window_start_min", constraints: "1..1440" }
      - { name: assigned_crew_id, type: string, source: input, description: "FK -> CrewMember.id; crew responsible for this route slot" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | PAUSED — PAUSED schedules generate no visits", constraints: "ACTIVE, PAUSED" }

  - name: CrewMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Crew member name" }
      - { name: shift_capacity_min, type: integer, source: input, default: 480, description: "Maximum clocked minutes per local day before overtime gating", constraints: "must be > 0" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE | INACTIVE — INACTIVE crew cannot be assigned or clocked", constraints: "AVAILABLE, INACTIVE" }

  - name: Visit
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: schedule_id, type: string, source: input, description: "FK -> RecurringSchedule.id; null for ad-hoc periodic jobs and callbacks", constraints: "nullable" }
      - { name: crew_id, type: string, source: input, description: "FK -> CrewMember.id; crew expected to perform the visit" }
      - { name: visit_kind, type: enum, source: input, default: "ROUTINE", description: "ROUTINE | PERIODIC | CALLBACK — drives billing path", constraints: "ROUTINE, PERIODIC, CALLBACK" }
      - { name: service_date, type: string, source: input, description: "Local service date YYYY-MM-DD; determines which BillingPeriod the visit settles into" }
      - { name: planned_start_min, type: integer, source: input, description: "Planned start minutes-after-midnight local", constraints: "0..1439" }
      - { name: planned_end_min, type: integer, source: input, description: "Planned end minutes-after-midnight local; must be > planned_start_min", constraints: "1..1440" }
      - { name: estimated_labor_min, type: integer, source: computed, description: "Forward estimate of crew minutes from cleanable_sqft and visit_kind; see estimate_labor_minutes" }
      - { name: actual_labor_min, type: integer, source: computed, default: 0, description: "Sum of clocked minutes across this visit's COMPLETED TimeEntries; see actual_labor_minutes" }
      - { name: periodic_job_id, type: string, source: system, description: "FK -> PeriodicJob.id; set when visit_kind=PERIODIC", constraints: "nullable" }
      - { name: complaint_id, type: string, source: system, description: "FK -> Complaint.id; set when visit_kind=CALLBACK (the complaint that spawned it)", constraints: "nullable" }
      - { name: billing_period_id, type: string, source: system, description: "FK -> BillingPeriod.id; the OPEN period of the contract that captured this visit at completion", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED -> {IN_PROGRESS -> COMPLETED, MISSED}; CANCELLED from SCHEDULED", constraints: "SCHEDULED, IN_PROGRESS, COMPLETED, MISSED, CANCELLED" }

  - name: TimeEntry
    parent: null
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id" }
      - { name: crew_id, type: string, source: input, description: "FK -> CrewMember.id" }
      - { name: clock_in_min, type: integer, source: input, description: "Clock-in minutes-after-midnight local", constraints: "0..1439" }
      - { name: clock_out_min, type: integer, source: system, description: "Clock-out minutes-after-midnight local; set on close; must be > clock_in_min", constraints: "nullable, 1..1440" }
      - { name: clocked_min, type: integer, source: computed, default: 0, description: "= clock_out_min - clock_in_min once closed, else 0" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN -> COMPLETED; VOIDED from OPEN", constraints: "OPEN, COMPLETED, VOIDED" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id" }
      - { name: score, type: integer, source: input, description: "Quality score 0-100 assessed against the site quality_target", constraints: "0..100" }
      - { name: deficient, type: boolean, source: computed, default: false, description: "= score < Site.quality_target at time of inspection" }
      - { name: notes, type: string, source: input, description: "Inspector notes", constraints: "optional" }

  - name: PeriodicJob
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: job_type, type: enum, source: input, description: "STRIP_WAX | DEEP_CARPET — STRIP_WAX requires VCT/TERRAZZO floor", constraints: "STRIP_WAX, DEEP_CARPET" }
      - { name: quoted_hours, type: number, source: input, description: "Quoted labor-hours for the add-on (billed at contract hourly_rate_cents)", constraints: "must be > 0" }
      - { name: requested_date, type: string, source: input, description: "Local target date YYYY-MM-DD" }
      - { name: visit_id, type: string, source: system, description: "FK -> Visit.id; the PERIODIC visit dispatched from this job", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED -> DISPATCHED -> BILLED; CANCELLED from REQUESTED", constraints: "REQUESTED, DISPATCHED, BILLED, CANCELLED" }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id; the COMPLETED visit the complaint concerns", constraints: "nullable" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR — MAJOR forces a callback before resolution", constraints: "MINOR, MAJOR" }
      - { name: description, type: string, source: input, description: "Complaint text" }
      - { name: callback_visit_id, type: string, source: system, description: "FK -> Visit.id; the CALLBACK visit created to remedy", constraints: "nullable" }
      - { name: credit_applied_cents, type: integer, source: computed, default: 0, description: "Callback credit posted to the billing period on resolution; 0 until RESOLVED" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN -> ACKNOWLEDGED -> CALLBACK_SCHEDULED -> RESOLVED; RESOLVED -> OPEN reopen", constraints: "OPEN, ACKNOWLEDGED, CALLBACK_SCHEDULED, RESOLVED" }

  - name: BillingPeriod
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> ServiceContract.id" }
      - { name: period_month, type: string, source: input, description: "Billing month YYYY-MM; unique per contract" }
      - { name: base_cents, type: integer, source: computed, description: "Snapshot of contract.monthly_base_cents taken when the period opens" }
      - { name: periodic_cents, type: integer, source: computed, default: 0, description: "Sum of billed periodic add-on charges captured into this period" }
      - { name: callback_credit_cents, type: integer, source: computed, default: 0, description: "Sum of complaint callback credits posted into this period (negative direction)" }
      - { name: holdback_cents, type: integer, source: computed, default: 0, description: "Quality holdback withheld when mean inspection score below target; recomputed on close" }
      - { name: total_cents, type: integer, source: computed, default: 0, description: "Provisional running total while OPEN; finalized invoice total on close; see compute_period_total" }
      - { name: mean_quality_score, type: number, source: computed, description: "Mean Inspection.score over COMPLETED ROUTINE visits captured into this period; null if none", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN -> CLOSED -> REOPENED -> CLOSED; INVOICED from CLOSED", constraints: "OPEN, CLOSED, REOPENED, INVOICED" }

  - name: InvoiceLine
    parent: null
    common_fields: false   # immutable append-only ledger row: id, created_at only
    fields:
      - { name: billing_period_id, type: string, source: input, description: "FK -> BillingPeriod.id" }
      - { name: line_type, type: enum, source: system, description: "BASE | PERIODIC | CALLBACK_CREDIT | HOLDBACK", constraints: "BASE, PERIODIC, CALLBACK_CREDIT, HOLDBACK" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount: positive for charges, negative for credits/holdback" }
      - { name: memo, type: string, source: system, description: "Human-readable line memo" }

  - name: SupplyOrder
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: sku, type: enum, source: input, description: "PAPER_TOWEL | TRASH_LINER | FLOOR_FINISH | RESTROOM_KIT", constraints: "PAPER_TOWEL, TRASH_LINER, FLOOR_FINISH, RESTROOM_KIT" }
      - { name: quantity, type: integer, source: input, description: "Units ordered", constraints: "must be > 0" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED -> FULFILLED; CANCELLED from REQUESTED", constraints: "REQUESTED, FULFILLED, CANCELLED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ServiceContract
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /contracts/{contractId}/activate"
        actor: AccountManager
        preconditions:
          - "contract.status == DRAFT"
          - "Site.status == ACTIVE (ERR_SITE_ARCHIVED otherwise)"
          - "Owning Account.status == ACTIVE (ERR_ACCOUNT_NOT_ACTIVE otherwise)"
        side_effects:
          - "status -> ACTIVE; contract now eligible to back BillingPeriods"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /contracts/{contractId}/terminate"
        actor: AccountManager
        preconditions:
          - "contract.status == ACTIVE"
          - "No BillingPeriod of this contract is in status OPEN or REOPENED (ERR_PERIOD_OPEN)"
        side_effects:
          - "status -> TERMINATED; no further BillingPeriods may open"

  - entity: RecurringSchedule
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /schedules/{scheduleId}/pause"
        actor: FieldSupervisor
        preconditions:
          - "schedule.status == ACTIVE"
        side_effects:
          - "status -> PAUSED; schedule generates no new visits"

      - from: PAUSED
        to: ACTIVE
        trigger: "POST /schedules/{scheduleId}/resume"
        actor: FieldSupervisor
        preconditions:
          - "schedule.status == PAUSED"
          - "RecurringSchedule.assigned_crew_id CrewMember.status == AVAILABLE (ERR_CREW_INACTIVE otherwise)"
        side_effects:
          - "status -> ACTIVE"

  - entity: Visit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, MISSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /visits/{visitId}/start"
        actor: FieldSupervisor
        preconditions:
          - "visit.status == SCHEDULED"
          - "Visit.crew_id CrewMember.status == AVAILABLE (ERR_CREW_INACTIVE otherwise)"
          - "Site.status == ACTIVE (ERR_SITE_ARCHIVED otherwise)"
        side_effects:
          - "status -> IN_PROGRESS"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /visits/{visitId}/complete"
        actor: FieldSupervisor
        preconditions:
          - "visit.status == IN_PROGRESS"
          - "At least one TimeEntry for this visit is in status COMPLETED (ERR_NO_TIME_ENTRY)"
          - "No TimeEntry for this visit is still OPEN (ERR_OPEN_TIME_ENTRY)"
        side_effects:
          - "actual_labor_min recomputed via actual_labor_minutes (sum of COMPLETED TimeEntry.clocked_min)"
          - "status -> COMPLETED"
          - "Resolve the contract's OPEN BillingPeriod for service_date's month (open it if none exists and contract is ACTIVE); set visit.billing_period_id"
          - "Capture this visit into that BillingPeriod: bump periodic_cents (PERIODIC) and recompute total_cents via compute_period_total (CASCADE to BillingPeriod)"
          - "If visit_kind == PERIODIC: linked PeriodicJob status DISPATCHED -> BILLED (CASCADE to PeriodicJob)"

      - from: SCHEDULED
        to: MISSED
        trigger: "POST /visits/{visitId}/miss"
        actor: FieldSupervisor
        preconditions:
          - "visit.status == SCHEDULED"
        side_effects:
          - "status -> MISSED; no labor captured, no billing-period capture"
          - "If visit_kind == ROUTINE and a ServiceContract for the site is ACTIVE: the period mean_quality_score is unaffected (missed visits have no inspection)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /visits/{visitId}/cancel"
        actor: FieldSupervisor
        preconditions:
          - "visit.status == SCHEDULED"
        side_effects:
          - "status -> CANCELLED"

  - entity: TimeEntry
    initial_state: OPEN
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /time-entries/{timeEntryId}/clock-out"
        actor: FieldSupervisor
        preconditions:
          - "time_entry.status == OPEN"
          - "clock_out_min > clock_in_min (ERR_INVALID_CLOCK_RANGE)"
          - "Parent Visit.status == IN_PROGRESS (ERR_INVALID_STATE)"
          - "crew's total clocked_min for the visit service local-day, including this entry, <= CrewMember.shift_capacity_min (ERR_SHIFT_CAPACITY_EXCEEDED)"
        side_effects:
          - "clock_out_min set; clocked_min = clock_out_min - clock_in_min; status -> COMPLETED"

      - from: OPEN
        to: VOIDED
        trigger: "POST /time-entries/{timeEntryId}/void"
        actor: FieldSupervisor
        preconditions:
          - "time_entry.status == OPEN"
        side_effects:
          - "status -> VOIDED; entry excluded from actual_labor_minutes"

  - entity: PeriodicJob
    initial_state: REQUESTED
    terminal_states: [BILLED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: DISPATCHED
        trigger: "POST /periodic-jobs/{periodicJobId}/dispatch"
        actor: FieldSupervisor
        preconditions:
          - "job.status == REQUESTED"
          - "Site.status == ACTIVE (ERR_SITE_ARCHIVED otherwise)"
          - "If job_type == STRIP_WAX: Site.floor_type IN {VCT, TERRAZZO} (ERR_FLOOR_INELIGIBLE otherwise)"
          - "Assigned crew CrewMember.status == AVAILABLE (ERR_CREW_INACTIVE otherwise)"
        side_effects:
          - "Create a Visit with visit_kind=PERIODIC, periodic_job_id=this job, status=SCHEDULED (CASCADE to Visit)"
          - "job.visit_id set to the new Visit.id; status -> DISPATCHED"

      - from: DISPATCHED
        to: BILLED
        trigger: "system (automatic when the dispatched PERIODIC Visit completes)"
        actor: system
        preconditions:
          - "job.status == DISPATCHED"
          - "linked Visit.status == COMPLETED"
        side_effects:
          - "status -> BILLED"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /periodic-jobs/{periodicJobId}/cancel"
        actor: AccountManager
        preconditions:
          - "job.status == REQUESTED"
        side_effects:
          - "status -> CANCELLED"

  - entity: Complaint
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /complaints/{complaintId}/acknowledge"
        actor: FieldSupervisor
        preconditions:
          - "complaint.status == OPEN"
        side_effects:
          - "status -> ACKNOWLEDGED"
          - "Recompute owning Account.open_complaint_count (CASCADE to Account)"

      - from: ACKNOWLEDGED
        to: CALLBACK_SCHEDULED
        trigger: "POST /complaints/{complaintId}/schedule-callback"
        actor: FieldSupervisor
        preconditions:
          - "complaint.status == ACKNOWLEDGED"
          - "Site.status == ACTIVE (ERR_SITE_ARCHIVED otherwise)"
          - "Assigned crew CrewMember.status == AVAILABLE (ERR_CREW_INACTIVE otherwise)"
        side_effects:
          - "Create a Visit with visit_kind=CALLBACK, complaint_id=this complaint, status=SCHEDULED (CASCADE to Visit)"
          - "complaint.callback_visit_id set; status -> CALLBACK_SCHEDULED"

      - from: CALLBACK_SCHEDULED
        to: RESOLVED
        trigger: "POST /complaints/{complaintId}/resolve"
        actor: FieldSupervisor
        preconditions:
          - "complaint.status == CALLBACK_SCHEDULED"
          - "complaint.callback_visit_id Visit.status == COMPLETED (ERR_CALLBACK_NOT_COMPLETE otherwise)"
        side_effects:
          - "Compute credit_applied_cents via callback_credit (round to whole cents)"
          - "Post the credit into the site contract's OPEN BillingPeriod for the callback Visit.service_date month: callback_credit_cents grows, total_cents recomputed via compute_period_total (CASCADE to BillingPeriod)"
          - "status -> RESOLVED"
          - "Recompute owning Account.open_complaint_count (CASCADE to Account)"

      - from: RESOLVED
        to: OPEN
        trigger: "POST /complaints/{complaintId}/reopen"
        actor: ClientContact
        preconditions:
          - "complaint.status == RESOLVED"
          - "complaint.severity == MAJOR (only MAJOR complaints may reopen) (ERR_REOPEN_NOT_ALLOWED otherwise)"
        side_effects:
          - "status -> OPEN; callback_visit_id cleared; credit remains posted (not clawed back)"
          - "Recompute owning Account.open_complaint_count (CASCADE to Account)"

  - entity: BillingPeriod
    initial_state: OPEN
    terminal_states: [INVOICED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /billing-periods/{billingPeriodId}/close"
        actor: AccountManager
        preconditions:
          - "period.status == OPEN"
          - "expected_account_version matches owning Account.version (ERR_STALE_VERSION otherwise)"
          - "No Visit captured into this period (billing_period_id == period.id) is in status IN_PROGRESS (ERR_VISIT_IN_PROGRESS otherwise)"
        side_effects:
          - "Recompute mean_quality_score, holdback_cents and total_cents via compute_period_total (final variant)"
          - "Emit InvoiceLine rows: BASE, one PERIODIC per captured periodic charge sum, one CALLBACK_CREDIT, one HOLDBACK (CASCADE to InvoiceLine)"
          - "status -> CLOSED"
          - "increments Account.version by 1"

      - from: CLOSED
        to: REOPENED
        trigger: "POST /billing-periods/{billingPeriodId}/reopen"
        actor: AccountManager
        preconditions:
          - "period.status == CLOSED"
          - "expected_account_version matches owning Account.version (ERR_STALE_VERSION otherwise)"
        side_effects:
          - "Delete the InvoiceLine rows previously emitted for this period (compensation)"
          - "status -> REOPENED; total_cents reverts to provisional recompute"
          - "increments Account.version by 1"

      - from: REOPENED
        to: CLOSED
        trigger: "POST /billing-periods/{billingPeriodId}/close"
        actor: AccountManager
        preconditions:
          - "period.status == REOPENED"
          - "expected_account_version matches owning Account.version (ERR_STALE_VERSION otherwise)"
          - "No Visit captured into this period is in status IN_PROGRESS (ERR_VISIT_IN_PROGRESS otherwise)"
        side_effects:
          - "Recompute mean_quality_score, holdback_cents and total_cents via compute_period_total (final variant)"
          - "Re-emit InvoiceLine rows: BASE, PERIODIC, CALLBACK_CREDIT, HOLDBACK (CASCADE to InvoiceLine)"
          - "status -> CLOSED"
          - "increments Account.version by 1"

      - from: CLOSED
        to: INVOICED
        trigger: "POST /billing-periods/{billingPeriodId}/invoice"
        actor: AccountManager
        preconditions:
          - "period.status == CLOSED"
        side_effects:
          - "status -> INVOICED (terminal; figures frozen)"

# -----------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: period-close-stale-account
    parent_entity: Account
    write_endpoint: "POST /billing-periods/{billingPeriodId}/close"
    occ_field: "expected_account_version"
    description: |
      Closing a BillingPeriod against an Account whose version has advanced since
      the client last observed it is rejected as a stale-version write. Each close,
      reopen, or re-close of any period under the account increments Account.version;
      a client still presenting the pre-advance version is closing against an account
      view that no longer reflects the latest billing state and is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: period-reopen-stale-account
    parent_entity: Account
    write_endpoint: "POST /billing-periods/{billingPeriodId}/reopen"
    occ_field: "expected_account_version"
    description: |
      Reopening a CLOSED BillingPeriod against an Account whose version has advanced
      since the client last observed it is rejected as a stale-version write. The
      reopen deletes previously emitted InvoiceLines and reverts totals, so it must
      observe the current account billing state; a stale version means another period
      operation already advanced the account.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: estimate_labor_minutes
    trigger: "Visit creation (POST /visits, and cascaded PERIODIC/CALLBACK visit creation)"
    algorithm: forward_looking
    formula: |
      # Forward estimate of crew minutes BEFORE any clock data exists.
      base_min = ceil(Site.cleanable_sqft / SQFT_PER_MIN)   # productivity rate
      if visit_kind == ROUTINE:
        estimated_labor_min = base_min
      elif visit_kind == CALLBACK:
        estimated_labor_min = ceil(base_min * CALLBACK_FACTOR)   # remediation pass is lighter
      elif visit_kind == PERIODIC:
        estimated_labor_min = ceil(PeriodicJob.quoted_hours * 60)  # quote drives estimate, not sqft
    input_set: "Single Site row plus, for PERIODIC, the linked PeriodicJob.quoted_hours. No TimeEntry data."
    constants:
      SQFT_PER_MIN: 50          # 50 cleanable sqft cleaned per crew-minute
      CALLBACK_FACTOR: 0.40     # callback remediation estimated at 40% of a full routine pass
    precision: "integer minutes, ceil at each documented ceil()"
    variants:
      - name: routine_vs_periodic
        when: "visit_kind selects the formula branch"
        difference: "ROUTINE/CALLBACK derive from cleanable_sqft; PERIODIC derives from the human-quoted hours and ignores sqft entirely"

  - name: actual_labor_minutes
    trigger: "Visit completion (POST /visits/{visitId}/complete); recomputed reference for billing overage"
    algorithm: chronological
    formula: |
      # Chronological accumulation over the visit's clocked entries.
      # Process this visit's TimeEntries in created_at ASC order (id NEVER used).
      actual_labor_min = 0
      for te in TimeEntries(visit_id=visit.id) where te.status == COMPLETED ordered by created_at ASC:
        actual_labor_min += te.clocked_min       # clocked_min = clock_out_min - clock_in_min
      # VOIDED and OPEN entries are excluded.
    input_set: "All COMPLETED TimeEntry rows for the visit; VOIDED and OPEN excluded."
    constants: {}
    precision: "integer minutes; sum is exact"
    variants:
      - name: estimate_vs_actual
        when: "compared against estimate_labor_minutes for the same visit"
        difference: "estimate_labor_minutes is a forward projection from sqft/quote; actual_labor_minutes is the chronological sum of clocked entries — identical inputs, different subjects (Site/quote vs clocked entries) yield different minute counts that drive overage billing"

  - name: periodic_charge_cents
    trigger: "PERIODIC Visit completion captures the add-on into its BillingPeriod"
    algorithm: tiered_pricing
    formula: |
      # Periodic add-on billed on the GREATER of quoted and actual labor, then
      # an overage surcharge tier applies only to minutes beyond the quote.
      quoted_min  = ceil(PeriodicJob.quoted_hours * 60)
      actual_min  = Visit.actual_labor_min
      billable_min = max(quoted_min, actual_min)
      overage_min  = max(0, actual_min - quoted_min)
      straight_min = billable_min - overage_min
      rate_per_min = ServiceContract.hourly_rate_cents / 60.0
      straight_cents = round(straight_min * rate_per_min)            # round per-component
      overage_cents  = round(overage_min  * rate_per_min * OVERAGE_MULTIPLIER)
      periodic_charge_cents = straight_cents + overage_cents          # then sum (order pinned)
    input_set: "One PERIODIC Visit, its PeriodicJob, and the site's ACTIVE ServiceContract."
    constants:
      OVERAGE_MULTIPLIER: 1.5   # minutes beyond quote billed at 1.5x the straight rate
    precision: "round_half_up to whole cents, PER COMPONENT then sum (straight rounded, overage rounded, then added — NOT sum-then-round)"

  - name: callback_credit
    trigger: "Complaint resolution (CALLBACK_SCHEDULED -> RESOLVED)"
    algorithm: threshold
    formula: |
      # Credit is a fraction of the contract base, escalated for MAJOR severity,
      # and floored so it never exceeds the base.
      base = ServiceContract.monthly_base_cents
      pct  = ServiceContract.callback_credit_pct
      if complaint.severity == MAJOR:
        pct = pct + MAJOR_BONUS_PCT            # MAJOR complaints earn a larger credit
      raw = round(base * pct)                  # round_half_up to whole cents
      credit_applied_cents = min(raw, base)    # credit capped at one month's base
    input_set: "One Complaint, the site's ACTIVE ServiceContract."
    constants:
      MAJOR_BONUS_PCT: 0.05    # MAJOR severity adds 5 percentage points
    precision: "round_half_up to whole cents"
    variants:
      - name: minor_vs_major
        when: "complaint.severity"
        difference: "MAJOR adds MAJOR_BONUS_PCT to the credit fraction; MINOR uses the bare contract pct"

  - name: compute_period_total
    trigger: "Visit/PeriodicJob capture into an OPEN period (provisional), and BillingPeriod close/reopen (final)"
    algorithm: aggregation
    formula: |
      # Order of evaluation is PINNED to avoid a circular-looking holdback dependency:
      #   (1) base_cents        = snapshot of contract.monthly_base_cents at period open
      #   (2) periodic_cents    = sum of periodic_charge_cents over PERIODIC visits captured (billing_period_id == period.id)
      #   (3) callback_credit_cents = sum of credit_applied_cents over RESOLVED complaints posted to this period
      #   (4) mean_quality_score = mean(Inspection.score) over inspections of COMPLETED ROUTINE visits captured into this period
      #                            (one inspection per visit; if a visit has multiple, use the latest by created_at ASC tie-break);
      #                            null if no such inspection -> treated as meeting target (no holdback)
      #   (5) holdback_cents:
      #         PROVISIONAL variant (period OPEN): holdback_cents = 0 (quality not yet final)
      #         FINAL variant (on close/reopen->close): if mean_quality_score is not null AND
      #             mean_quality_score < Site.quality_target:
      #               holdback_cents = round(base_cents * contract.quality_holdback_pct)
      #             else holdback_cents = 0
      #   (6) total_cents = base_cents + periodic_cents - callback_credit_cents - holdback_cents
      # Holdback is keyed off base_cents (step 1), NOT off total — pinning order breaks the apparent cycle.
    input_set: "One BillingPeriod, its captured PERIODIC visits, its posted RESOLVED complaints, and inspections of its captured COMPLETED ROUTINE visits."
    constants: {}
    precision: "all cents are integers; round_half_up where round() appears"
    variants:
      - name: provisional_total
        when: "period.status == OPEN (running total as visits complete)"
        difference: "holdback_cents forced to 0 because quality is not final; total can rise/fall as captures and credits post"
      - name: final_total
        when: "period.status transitions to CLOSED (from OPEN or REOPENED)"
        difference: "holdback_cents computed from final mean_quality_score vs Site.quality_target; total frozen into InvoiceLines"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "ClientContact acting on a Site/Complaint must own it: X-User-ID == Site.contact_user_id"
    error_id: ERR_NOT_SITE_CONTACT
    http_status: 403
    applies_to: "Complaint create/reopen, GET site-scoped reads as ClientContact"

  - priority: 4
    category: existence
    check: "All path-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 5
    category: existence
    check: "Body foreign keys (account_id, site_id, contract_id, crew_id, visit_id, schedule_id) reference existing rows"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "all create endpoints with FK bodies"

  - priority: 6
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numeric ranges respected (sqft>0, minutes 0..1440, score 0..100, pct 0..1, window_end>window_start, planned_end>planned_start)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all create/update endpoints"

  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: business_referential
    check: "Cross-entity preconditions: Account ACTIVE, Site ACTIVE, CrewMember AVAILABLE, callback Visit COMPLETED, contract ACTIVE where the transition requires it"
    error_id: "ERR_ACCOUNT_NOT_ACTIVE / ERR_SITE_ARCHIVED / ERR_CREW_INACTIVE / ERR_CALLBACK_NOT_COMPLETE / ERR_CONTRACT_NOT_ACTIVE"
    http_status: 409
    applies_to: "contract activate, visit start, periodic dispatch, complaint schedule-callback/resolve, billing-period open"

  - priority: 9
    category: business_safety
    check: "STRIP_WAX periodic dispatch requires a strip/wax-eligible floor (Site.floor_type IN {VCT, TERRAZZO})"
    error_id: ERR_FLOOR_INELIGIBLE
    http_status: 409
    applies_to: "POST /periodic-jobs/{id}/dispatch"

  - priority: 10
    category: business_temporal
    check: "A clock-out's crew daily total clocked minutes (this entry plus other COMPLETED entries for the same crew on the same service local-day) must not exceed CrewMember.shift_capacity_min"
    error_id: ERR_SHIFT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /time-entries/{id}/clock-out"

  - priority: 11
    category: business_temporal
    check: "A new Visit's [planned_start_min, planned_end_min) must not overlap any existing non-terminal (SCHEDULED/IN_PROGRESS) Visit on the SAME crew on the SAME service_date; adjacency (end==start) is allowed"
    error_id: ERR_CREW_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /visits, POST /periodic-jobs/{id}/dispatch, POST /complaints/{id}/schedule-callback"

  - priority: 12
    category: business_temporal
    check: "A RecurringSchedule's [window_start_min, window_end_min] must not overlap any other ACTIVE schedule for the SAME crew on the SAME weekday; a shared boundary minute (touching windows) IS a conflict (closed-interval semantics)"
    error_id: ERR_SCHEDULE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /schedules, POST /schedules/{id}/resume"

  - priority: 13
    category: business_constraint
    check: "BillingPeriod (contract_id, period_month) is unique; cannot open a duplicate period"
    error_id: ERR_DUPLICATE_PERIOD
    http_status: 409
    applies_to: "POST /billing-periods"

  - priority: 14
    category: business_fiscal
    check: "Time entry clock range valid: clock_out_min > clock_in_min"
    error_id: ERR_INVALID_CLOCK_RANGE
    http_status: 422
    applies_to: "POST /time-entries/{id}/clock-out"

  - priority: 15
    category: state
    check: "OCC: expected_account_version must equal current Account.version on billing-period close/reopen"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /billing-periods/{id}/close, POST /billing-periods/{id}/reopen"

