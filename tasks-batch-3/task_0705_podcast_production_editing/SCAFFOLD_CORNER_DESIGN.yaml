          trigger:
            - call: "POST /sessions"
              payload: { episode_id: "${host_ep}", engineer_id: "${eng_id}", capture_mode: "STUDIO", scheduled_start_utc: "2026-03-05T10:00:00Z", scheduled_end_utc: "2026-03-05T11:00:00Z" }
              as: ProducerEng
