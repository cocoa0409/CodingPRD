# =============================================================================
# Consumer Claim & Rebate Aggregator — benchmark seed tables (Expert)
# =============================================================================

scenario: |
  1073. Consumer Claim & Rebate Aggregator: eligible-settlement/rebate catalog,
  user match & documentation, claim filing & tracking, payout & contingency fee,
  deadline & status, fraud/eligibility, notification, reporting

domain_name: consumer-claim-rebate-aggregator
api_prefix: /rebate-aggregator

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat            # peer entities linked by FK bodies; reverse discovery via sub-resource/filtered GETs
  state_machine_shape: cyclic      # Claim NEEDS_INFO<->UNDER_REVIEW loop; Payout FAILED->INITIATED retry loop
  relationship_patterns:
    - one_to_many                  # Program -> Claims, Claim -> Documents/Payouts/FraudFlags
    - many_to_many                 # Match is the Consumer <-> Program junction
    - cross_aggregate              # Payout debits Program fund; Claim fraud derived from FraudFlags
  role_model: segregation_of_duties  # four-eyes: fraud raiser cannot clear own flag; peer operator roles
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: RebateProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program / settlement display name" }
      - { name: settlement_case_id, type: string, source: input, description: "Grouping key for programs of the same underlying case/defendant; used by the window-conflict rule (NOT a foreign key)" }
      - { name: category, type: enum, source: input, description: "PRODUCT_REBATE | CLASS_ACTION | WARRANTY | PRICE_ADJUSTMENT" }
      - { name: distribution_method, type: enum, source: input, description: "FIXED (per-claim settle at approval) | PRO_RATA (batch settle at program close)" }
      - { name: fund_total_cents, type: integer, source: input, description: "Total settlement fund in cents", constraints: "> 0" }
      - { name: fund_remaining_cents, type: integer, source: computed, description: "fund_total_cents minus committed payouts; see calc program_fund_remaining" }
      - { name: advertised_amount_cents, type: integer, source: input, description: "Headline per-claim amount used for the provisional estimate", constraints: ">= 0" }
      - { name: per_claim_cap_cents, type: integer, source: input, description: "Hard maximum payout per claim", constraints: "> 0" }
      - { name: eligibility_min_purchase_cents, type: integer, source: input, default: 0, description: "Minimum claimed_amount_cents for a claim to be eligible" }
      - { name: requires_proof, type: boolean, source: input, default: true, description: "Whether supporting documents are required" }
      - { name: min_documents, type: integer, source: input, default: 1, description: "Minimum number of uploaded ClaimDocuments required to submit a claim" }
      - { name: claim_window_open_at, type: datetime, source: input, description: "Inclusive instant the claim window opens" }
      - { name: claim_window_close_at, type: datetime, source: input, description: "Exclusive instant the claim window closes (claims must be submitted before this)" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | CLOSED | EXHAUSTED", default: DRAFT }

  - name: Consumer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Login/contact email; unique across consumers" }
      - { name: full_name, type: string, source: input, description: "Consumer full name" }
      - { name: identity_status, type: enum, source: system, description: "UNVERIFIED | VERIFIED | SUSPENDED", default: UNVERIFIED }
      - { name: total_recovered_cents, type: integer, source: computed, default: 0, description: "Sum of net_amount_cents over this consumer's CLEARED payouts; see calc consumer_total_recovered" }
      - { name: optimistic_risk_score, type: integer, source: computed, description: "Risk score counting only CONFIRMED fraud flags; gates approval (calc consumer_risk_score, optimistic variant)" }
      - { name: pessimistic_risk_score, type: integer, source: computed, description: "Risk score counting CONFIRMED + OPEN fraud flags; gates payout clearing (calc consumer_risk_score, pessimistic variant)" }

  - name: Match
    parent: null
    common_fields: true
    fields:
      - { name: consumer_id, type: string, source: input, description: "FK -> Consumer.id" }
      - { name: program_id, type: string, source: input, description: "FK -> RebateProgram.id" }
      - { name: match_score, type: integer, source: computed, description: "Relevance score 0-100 of program to consumer; see calc match_score" }
      - { name: status, type: enum, source: system, description: "CANDIDATE | CONVERTED", default: CANDIDATE }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: consumer_id, type: string, source: input, description: "FK -> Consumer.id; the filer (must equal X-User-ID for Consumer role)" }
      - { name: program_id, type: string, source: input, description: "FK -> RebateProgram.id" }
      - { name: benefit_period_start, type: datetime, source: input, description: "Inclusive start of the purchase/coverage interval being claimed" }
      - { name: benefit_period_end, type: datetime, source: input, description: "Exclusive end of the purchase/coverage interval (half-open [start,end))" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Consumer-asserted eligible spend in cents", constraints: "> 0" }
      - { name: provisional_payout_cents, type: integer, source: computed, description: "Forward-looking estimate set at submit; calc claim_payout variant=provisional" }
      - { name: final_payout_cents, type: integer, source: computed, default: null, description: "Actual gross payout set at approval (FIXED) or settlement (PRO_RATA); calc claim_payout variant=final" }
      - { name: contingency_fee_cents, type: integer, source: computed, default: null, description: "Fee retained by platform on the gross payout; calc contingency_fee" }
      - { name: net_payout_cents, type: integer, source: computed, default: null, description: "final_payout_cents - contingency_fee_cents; calc net_payout" }
      - { name: eligibility_status, type: enum, source: computed, description: "UNASSESSED | ELIGIBLE | INELIGIBLE", default: UNASSESSED }
      - { name: fraud_status, type: enum, source: computed, description: "CLEAR | FLAGGED | CONFIRMED, derived from this claim's FraudFlags" }
      - { name: document_count, type: integer, source: computed, description: "Count of ClaimDocuments attached to this claim (any status)" }
      - { name: needs_info_count, type: integer, source: system, default: 0, description: "Number of times the claim has entered NEEDS_INFO" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock instant when the claim was first submitted" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | NEEDS_INFO | APPROVED | REJECTED | EXPIRED", default: DRAFT }

  - name: ClaimDocument
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id" }
      - { name: doc_type, type: enum, source: input, description: "RECEIPT | PROOF_OF_PURCHASE | ID | OTHER" }
      - { name: file_ref, type: string, source: input, description: "Opaque external storage reference" }
      - { name: status, type: enum, source: system, description: "PENDING | VERIFIED | REJECTED", default: PENDING }
      - { name: rejection_reason, type: string, source: system, default: null, description: "Set when a reviewer rejects the document" }

  - name: Payout
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id" }
      - { name: gross_amount_cents, type: integer, source: system, description: "= Claim.final_payout_cents at creation" }
      - { name: fee_amount_cents, type: integer, source: system, description: "= Claim.contingency_fee_cents at creation" }
      - { name: net_amount_cents, type: integer, source: system, description: "= gross_amount_cents - fee_amount_cents" }
      - { name: attempt_count, type: integer, source: system, default: 1, description: "Incremented on each retry" }
      - { name: status, type: enum, source: system, description: "INITIATED | CLEARED | FAILED | REVERSED", default: INITIATED }

  - name: FraudFlag
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id" }
      - { name: raised_by_user_id, type: string, source: system, description: "X-User-ID of the FraudAnalyst who raised the flag" }
      - { name: reason, type: enum, source: input, description: "DUPLICATE | IDENTITY_MISMATCH | SUSPICIOUS_DOCS | INELIGIBLE_PURCHASE | OTHER" }
      - { name: status, type: enum, source: system, description: "OPEN | CONFIRMED | CLEARED", default: OPEN }
      - { name: cleared_by_user_id, type: string, source: system, default: null, description: "X-User-ID who cleared the flag; MUST differ from raised_by_user_id (segregation of duties)" }
      - { name: resolution_note, type: string, source: input, default: null, description: "Optional note supplied on confirm/clear" }

  - name: FundTransaction
    parent: RebateProgram
    common_fields: false
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> RebateProgram.id" }
      - { name: related_claim_id, type: string, source: system, default: null, description: "Claim that caused this transaction (references Claim.id; NOT a reverse-reachable FK)" }
      - { name: type, type: enum, source: system, description: "DEBIT | CREDIT" }
      - { name: amount_cents, type: integer, source: system, description: "Absolute cents moved" }
      - { name: reason, type: enum, source: system, description: "PAYOUT_COMMIT | PAYOUT_REVERSAL" }
      - { name: balance_after_cents, type: integer, source: system, description: "RebateProgram.fund_remaining_cents immediately after this transaction" }

  - name: Notification
    parent: Consumer
    common_fields: false
    fields:
      - { name: consumer_id, type: string, source: system, description: "FK -> Consumer.id" }
      - { name: related_claim_id, type: string, source: system, default: null, description: "Claim the notification concerns (references Claim.id; NOT a reverse-reachable FK)" }
      - { name: channel, type: enum, source: system, description: "Delivery channel; all system notifications in this version are sent via EMAIL", default: EMAIL }
      - { name: event_type, type: enum, source: system, description: "CLAIM_SUBMITTED | NEEDS_INFO | CLAIM_APPROVED | CLAIM_REJECTED | CLAIM_EXPIRED | PAYOUT_CLEARED | PAYOUT_FAILED | FRAUD_FLAGGED" }
      - { name: body, type: string, source: system, description: "Rendered notification text" }
      - { name: read, type: boolean, source: system, default: false, description: "Whether the consumer has marked it read" }

  - name: EligibilityAssessment
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id" }
      - { name: assessed_by_user_id, type: string, source: system, description: "X-User-ID of the ClaimReviewer who triggered start-review" }
      - { name: eligible, type: boolean, source: system, description: "Overall eligibility determination (min_purchase_met AND documents_sufficient)" }
      - { name: min_purchase_met, type: boolean, source: system, description: "claimed_amount_cents >= program.eligibility_min_purchase_cents" }
      - { name: documents_sufficient, type: boolean, source: system, description: "count of VERIFIED documents >= program.min_documents" }
      - { name: reasons, type: array, source: system, description: "List of reason codes explaining the determination" }
      - { name: assessed_at, type: datetime, source: system, description: "Logical-clock instant of assessment" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: RebateProgram
    initial_state: DRAFT
    terminal_states: [CLOSED, EXHAUSTED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /rebate-aggregator/programs/{id}/open"
        actor: ProgramManager
        preconditions:
          - "Program is DRAFT (else ERR_INVALID_STATE)"
        side_effects:
          - "fund_remaining_cents initialized to fund_total_cents (recompute program_fund_remaining)"

      - from: OPEN
        to: CLOSED
        trigger: "POST /rebate-aggregator/programs/{id}/close"
        actor: ProgramManager
        preconditions:
          - "Program is OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "If distribution_method == PRO_RATA: run calc pro_rata_settlement over all APPROVED claims (sets final_payout_cents, contingency_fee_cents, net_payout_cents; creates one Payout per claim; DEBITs fund via FundTransaction; recompute program_fund_remaining)"
          - "CASCADE (rule transitive_cascade / program_close_expiry): every Claim of this program still in {SUBMITTED, UNDER_REVIEW, NEEDS_INFO} transitions to EXPIRED"
          - "For each Claim that transitions to EXPIRED: create a Notification(event_type=CLAIM_EXPIRED) to its consumer"

      - from: OPEN
        to: EXHAUSTED
        trigger: "system (automatic when fund_remaining_cents reaches 0 after a FIXED-program approval commits a payout)"
        actor: system
        preconditions:
          - "fund_remaining_cents == 0"
        side_effects:
          - "CASCADE (rule transitive_cascade / fund_exhaustion_reject): every Claim of this program still in {SUBMITTED, UNDER_REVIEW, NEEDS_INFO} transitions to REJECTED"
          - "For each Claim that transitions to REJECTED: create a Notification(event_type=CLAIM_REJECTED) to its consumer"

  - entity: Consumer
    initial_state: UNVERIFIED
    terminal_states: [SUSPENDED]
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /rebate-aggregator/consumers/{id}/verify"
        actor: PlatformAdmin
        preconditions:
          - "Consumer is UNVERIFIED (else ERR_INVALID_STATE)"
        side_effects: []

      - from: VERIFIED
        to: SUSPENDED
        trigger: "system (automatic when a FraudFlag on any of the consumer's claims is CONFIRMED)"
        actor: system
        preconditions: []
        side_effects:
          - "recompute optimistic_risk_score and pessimistic_risk_score"

      - from: UNVERIFIED
        to: SUSPENDED
        trigger: "system (automatic when a FraudFlag on any of the consumer's claims is CONFIRMED)"
        actor: system
        preconditions: []
        side_effects:
          - "recompute optimistic_risk_score and pessimistic_risk_score"

  - entity: Claim
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /rebate-aggregator/claims/{id}/submit"
        actor: Consumer
        preconditions:
          - "Claim is DRAFT (else ERR_INVALID_STATE)"
          - "cross-entity: program.status == OPEN (else ERR_PROGRAM_NOT_OPEN)"
          - "temporal: program.claim_window_open_at <= clock_now < program.claim_window_close_at (else ERR_CLAIM_WINDOW_CLOSED)"
          - "benefit_period does not overlap another non-terminal (status NOT IN {REJECTED, EXPIRED}) Claim of the same consumer+program (else ERR_BENEFIT_PERIOD_OVERLAP)"
          - "document_count >= program.min_documents when program.requires_proof (else ERR_INSUFFICIENT_DOCUMENTS)"
          - "eligibility: claimed_amount_cents >= program.eligibility_min_purchase_cents (else ERR_NOT_ELIGIBLE)"
        side_effects:
          - "provisional_payout_cents set (calc claim_payout variant=provisional)"
          - "submitted_at = clock_now"
          - "create Notification(event_type=CLAIM_SUBMITTED) to consumer"

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /rebate-aggregator/claims/{id}/start-review"
        actor: ClaimReviewer
        preconditions:
          - "Claim is SUBMITTED (else ERR_INVALID_STATE)"
        side_effects:
          - "create an EligibilityAssessment (calc claim_eligibility): min_purchase_met, documents_sufficient, eligible, reasons"
          - "set eligibility_status = ELIGIBLE if assessment.eligible else INELIGIBLE"

      - from: UNDER_REVIEW
        to: NEEDS_INFO
        trigger: "POST /rebate-aggregator/claims/{id}/request-info"
        actor: ClaimReviewer
        preconditions:
          - "Claim is UNDER_REVIEW (else ERR_INVALID_STATE)"
        side_effects:
          - "needs_info_count += 1"
          - "create Notification(event_type=NEEDS_INFO) to consumer"

      - from: NEEDS_INFO
        to: UNDER_REVIEW
        trigger: "POST /rebate-aggregator/claims/{id}/resubmit"
        actor: Consumer
        preconditions:
          - "Claim is NEEDS_INFO (else ERR_INVALID_STATE)"
        side_effects:
          - "re-run calc claim_eligibility and refresh eligibility_status"
        note: "Cyclic: NEEDS_INFO <-> UNDER_REVIEW revision loop"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /rebate-aggregator/claims/{id}/approve"
        actor: ClaimReviewer
        preconditions:
          - "Claim is UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "OCC: expected_program_version == program.version (else ERR_STALE_PROGRAM_VERSION)"
          - "claim.fraud_status != CONFIRMED (else ERR_FRAUD_HOLD)"
          - "safety: consumer.optimistic_risk_score < RISK_THRESHOLD (else ERR_RISK_THRESHOLD_EXCEEDED)"
          - "eligibility_status == ELIGIBLE (else ERR_NOT_ELIGIBLE)"
          - "fiscal (FIXED only): computed final_payout_cents > 0 i.e. fund_remaining_cents > 0 (else ERR_FUND_EXHAUSTED)"
        side_effects:
          - "FIXED programs — CASCADE (rule transitive_cascade / approval_payout_exhaust): (1) set final_payout_cents (calc claim_payout variant=final), contingency_fee_cents (calc contingency_fee), net_payout_cents (calc net_payout); (2) create Payout(status=INITIATED); (3) DEBIT program.fund_remaining_cents by gross via FundTransaction(reason=PAYOUT_COMMIT); (4) increments RebateProgram.version by 1; (5) if fund_remaining_cents == 0 -> program transitions OPEN->EXHAUSTED, which itself auto-REJECTs sibling non-terminal claims"
          - "PRO_RATA programs — no payout yet; final settlement deferred to program close; still increments RebateProgram.version by 1"
          - "create Notification(event_type=CLAIM_APPROVED) to consumer"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /rebate-aggregator/claims/{id}/reject"
        actor: ClaimReviewer
        preconditions:
          - "Claim is UNDER_REVIEW (else ERR_INVALID_STATE)"
        side_effects:
          - "create Notification(event_type=CLAIM_REJECTED) to consumer"
          - "recompute consumer_risk_score (rejected claim raises score)"

      - from: NEEDS_INFO
        to: REJECTED
        trigger: "POST /rebate-aggregator/claims/{id}/reject"
        actor: ClaimReviewer
        preconditions:
          - "Claim is NEEDS_INFO (else ERR_INVALID_STATE)"
        side_effects:
          - "create Notification(event_type=CLAIM_REJECTED) to consumer"
          - "recompute consumer_risk_score"

      - from: SUBMITTED
        to: EXPIRED
        trigger: "system (cascade from program close, see RebateProgram OPEN->CLOSED)"
        actor: system
        preconditions: []
        side_effects: ["create Notification(event_type=CLAIM_EXPIRED)"]

      - from: UNDER_REVIEW
        to: EXPIRED
        trigger: "system (cascade from program close)"
        actor: system
        preconditions: []
        side_effects: ["create Notification(event_type=CLAIM_EXPIRED)"]

      - from: NEEDS_INFO
        to: EXPIRED
        trigger: "system (cascade from program close)"
        actor: system
        preconditions: []
        side_effects: ["create Notification(event_type=CLAIM_EXPIRED)"]

      - from: SUBMITTED
        to: REJECTED
        trigger: "system (cascade from program EXHAUSTED)"
        actor: system
        preconditions: []
        side_effects: ["create Notification(event_type=CLAIM_REJECTED)"]

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "system (cascade from program EXHAUSTED)"
        actor: system
        preconditions: []
        side_effects: ["create Notification(event_type=CLAIM_REJECTED)"]

      - from: NEEDS_INFO
        to: REJECTED
        trigger: "system (cascade from program EXHAUSTED)"
        actor: system
        preconditions: []
        side_effects: ["create Notification(event_type=CLAIM_REJECTED)"]

  - entity: ClaimDocument
    initial_state: PENDING
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /rebate-aggregator/documents/{id}/verify"
        actor: ClaimReviewer
        preconditions:
          - "Document is PENDING (else ERR_INVALID_STATE)"
        side_effects: []

      - from: PENDING
        to: REJECTED
        trigger: "POST /rebate-aggregator/documents/{id}/reject"
        actor: ClaimReviewer
        preconditions:
          - "Document is PENDING (else ERR_INVALID_STATE)"
        side_effects:
          - "rejection_reason set from request"
          - "CASCADE (rule transitive_cascade / doc_reject_needs_info): parent Claim, if in {SUBMITTED, UNDER_REVIEW}, transitions to NEEDS_INFO -> needs_info_count += 1 -> create Notification(event_type=NEEDS_INFO)"

  - entity: Payout
    initial_state: INITIATED
    terminal_states: [REVERSED]
    transitions:
      - from: INITIATED
        to: CLEARED
        trigger: "POST /rebate-aggregator/payouts/{id}/clear"
        actor: PlatformAdmin
        preconditions:
          - "Payout is INITIATED (else ERR_INVALID_STATE)"
          - "cross-entity: consumer.identity_status == VERIFIED (else ERR_CONSUMER_NOT_VERIFIED)"
          - "safety: consumer.pessimistic_risk_score < RISK_THRESHOLD (else ERR_RISK_THRESHOLD_EXCEEDED)"
        side_effects:
          - "consumer.total_recovered_cents += net_amount_cents (calc consumer_total_recovered)"
          - "create Notification(event_type=PAYOUT_CLEARED)"

      - from: INITIATED
        to: FAILED
        trigger: "POST /rebate-aggregator/payouts/{id}/fail"
        actor: PlatformAdmin
        preconditions:
          - "Payout is INITIATED (else ERR_INVALID_STATE)"
        side_effects:
          - "create Notification(event_type=PAYOUT_FAILED)"

      - from: FAILED
        to: INITIATED
        trigger: "POST /rebate-aggregator/payouts/{id}/retry"
        actor: PlatformAdmin
        preconditions:
          - "Payout is FAILED (else ERR_INVALID_STATE)"
        side_effects:
          - "attempt_count += 1"
        note: "Cyclic: FAILED -> INITIATED retry loop (does NOT re-debit the fund; the commit happened at approval)"

      - from: CLEARED
        to: REVERSED
        trigger: "POST /rebate-aggregator/payouts/{id}/reverse"
        actor: PlatformAdmin
        preconditions:
          - "Payout is CLEARED (else ERR_INVALID_STATE)"
        side_effects:
          - "COMPENSATION (rule compensating_invariant / fund_conservation): CREDIT program.fund_remaining_cents by gross_amount_cents via FundTransaction(reason=PAYOUT_REVERSAL); increments RebateProgram.version by 1"
          - "COMPENSATION (rule compensating_invariant / recovery_conservation): consumer.total_recovered_cents -= net_amount_cents"

  - entity: FraudFlag
    initial_state: OPEN
    terminal_states: [CONFIRMED, CLEARED]
    transitions:
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /rebate-aggregator/fraud-flags/{id}/confirm"
        actor: FraudAnalyst
        preconditions:
          - "FraudFlag is OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "parent Claim.fraud_status recomputed to CONFIRMED"
          - "consumer transitions to SUSPENDED (see Consumer machine); recompute consumer_risk_score"

      - from: OPEN
        to: CLEARED
        trigger: "POST /rebate-aggregator/fraud-flags/{id}/clear"
        actor: FraudAnalyst
        preconditions:
          - "FraudFlag is OPEN (else ERR_INVALID_STATE)"
          - "segregation of duties: X-User-ID != raised_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "cleared_by_user_id = X-User-ID"
          - "parent Claim.fraud_status recomputed (CLEAR if no remaining OPEN/CONFIRMED flags); recompute consumer_risk_score"

  - entity: Match
    initial_state: CANDIDATE
    terminal_states: [CONVERTED]
    transitions:
      - from: CANDIDATE
        to: CONVERTED
        trigger: "system (automatic when POST /rebate-aggregator/claims is called with match_id referencing this Match)"
        actor: system
        preconditions:
          - "Match belongs to the same consumer_id and program_id as the new claim (else ERR_INVALID_REQUEST)"
        side_effects: []

# =============================================================================
# Table 2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: approve-claim-stale-program
    parent_entity: RebateProgram
    write_endpoint: "POST /rebate-aggregator/claims/{id}/approve"
    occ_field: "expected_program_version"
    description: |
      Approving a Claim against a FIXED-distribution RebateProgram whose version
      has advanced since the reviewer last observed it is rejected. Each approval
      that commits a payout debits the shared fund and advances program.version;
      a reviewer approving a different claim while still carrying the previously
      observed program version holds a stale view of remaining fund and is
      rejected. This is the finite-pool allocation conflict reduced to a
      stale-version check.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: claim_payout
    trigger: "provisional at POST .../claims/{id}/submit; final at POST .../claims/{id}/approve (FIXED) or POST .../programs/{id}/close settlement (PRO_RATA)"
    algorithm: forward_looking / chronological
    formula: |
      provisional (forward-looking, set at submit):
        provisional_payout_cents = min(claimed_amount_cents,
                                        program.advertised_amount_cents,
                                        program.per_claim_cap_cents)
      final (set at approval for FIXED programs):
        final_payout_cents = min(provisional_payout_cents,
                                 program.per_claim_cap_cents,
                                 program.fund_remaining_cents)
        # if final_payout_cents <= 0 the approval is rejected with ERR_FUND_EXHAUSTED
      final (PRO_RATA) is produced by calc pro_rata_settlement at program close.
    input_set: "single Claim + its RebateProgram; fund_remaining_cents reflects all prior committed payouts on the program"
    precision: "integer cents; min() is exact"
    variants:
      - name: provisional
        when: "at submit — before any fund competition"
        difference: "uses advertised_amount_cents; ignores fund_remaining_cents (forward-looking headline estimate)"
      - name: final
        when: "at approval (FIXED)"
        difference: "clamped by live fund_remaining_cents; diverges from provisional once the fund is partly depleted"

  - name: contingency_fee
    trigger: "when a Payout is created (FIXED approval, or PRO_RATA settlement at close)"
    algorithm: tiered_pricing
    formula: |
      gross = Claim.final_payout_cents
      # 1) tiered-rate SELECTION on gross (boundaries are inclusive-low, exclusive-high)
      if gross < 10000:            rate = 0.15
      elif gross < 50000:          rate = 0.20     # gross == 10000 selects this tier (>=)
      else:                        rate = 0.25
      # 2) raw fee, round_half_up to whole cents
      raw = round_half_up(gross * rate)
      # 3) clamp to [FEE_MIN_CENTS, FEE_MAX_CENTS], then never exceed gross
      clamped = min(max(raw, FEE_MIN_CENTS), FEE_MAX_CENTS)
      clamped = min(clamped, gross)
      # 4) loyalty discount for a VERIFIED consumer, applied AFTER the clamp
      if consumer.identity_status == VERIFIED:
          contingency_fee_cents = round_half_up(clamped * (1 - VERIFIED_FEE_DISCOUNT))
      else:
          contingency_fee_cents = clamped
    input_set: "one Claim (gross), its Consumer (identity_status)"
    constants:
      FEE_TIER1_RATE: 0.15
      FEE_TIER2_RATE: 0.20
      FEE_TIER3_RATE: 0.25
      FEE_TIER1_UPPER_CENTS: 10000
      FEE_TIER2_UPPER_CENTS: 50000
      FEE_MIN_CENTS: 500
      FEE_MAX_CENTS: 25000
      VERIFIED_FEE_DISCOUNT: 0.10
    precision: "round_half_up to whole cents; step order is fixed: rate -> raw round -> clamp -> gross-cap -> discount round"
    note: "Combinatorial mode (a): >=3 inputs (gross, tier rate, consumer verified flag) with tier selection + min/max clamp + conditional discount."

  - name: net_payout
    trigger: "when a Payout is created"
    algorithm: aggregation
    formula: |
      net_payout_cents = final_payout_cents - contingency_fee_cents
      # evaluation order is pinned: final_payout_cents first, then contingency_fee_cents
      # (fee depends on gross tier), then subtract.
    input_set: "one Claim"
    precision: "integer cents"

  - name: pro_rata_settlement
    trigger: "POST /rebate-aggregator/programs/{id}/close when distribution_method == PRO_RATA"
    algorithm: waterfall_allocation
    formula: |
      approved = Claims of this program with status == APPROVED
      order approved by created_at ASC (tie-break created_at; id is never used)
      total_claimed = sum(c.claimed_amount_cents for c in approved)
      pool = program.fund_total_cents
      if total_claimed <= pool:
        for c: c.final_payout_cents = min(c.claimed_amount_cents, program.per_claim_cap_cents)
      else:
        for c: raw_share(c) = c.claimed_amount_cents / total_claimed * pool
        for c: floored(c) = floor(raw_share(c))            # floor to whole cents FIRST
        remainder = pool - sum(floored)                    # leftover whole cents
        distribute remainder: +1 cent to each claim in created_at ASC order,
          one pass, until remainder is exhausted
        for c: c.final_payout_cents = floored(c) [+1 if it received a remainder cent]
      then for each c (created_at ASC): compute contingency_fee + net_payout,
        create Payout(INITIATED), DEBIT fund via FundTransaction
    input_set: "all APPROVED claims of the program at close time"
    constants: {}
    precision: "floor per-claim share to cents, THEN distribute remainder; NEVER sum-then-round"
    note: "Combinatorial mode (b): rounding order is outcome-determining and pinned."

  - name: consumer_risk_score
    trigger: "recomputed on fraud-flag raise/confirm/clear, claim reject, and consumer verify"
    algorithm: weighted_scoring
    formula: |
      confirmed = count(FraudFlag with status==CONFIRMED across the consumer's claims)
      openf     = count(FraudFlag with status==OPEN across the consumer's claims)
      rejected  = count(Claim with status==REJECTED for the consumer)
      unverified = 1 if consumer.identity_status != VERIFIED else 0
      optimistic_risk_score  = min(100, confirmed*CONFIRMED_FLAG_WEIGHT
                                        + unverified*UNVERIFIED_WEIGHT
                                        + rejected*REJECTED_CLAIM_WEIGHT)
      pessimistic_risk_score = min(100, confirmed*CONFIRMED_FLAG_WEIGHT
                                        + openf*OPEN_FLAG_WEIGHT
                                        + unverified*UNVERIFIED_WEIGHT
                                        + rejected*REJECTED_CLAIM_WEIGHT)
    input_set: "one Consumer + all their claims' FraudFlags"
    constants:
      CONFIRMED_FLAG_WEIGHT: 40
      OPEN_FLAG_WEIGHT: 25
      UNVERIFIED_WEIGHT: 20
      REJECTED_CLAIM_WEIGHT: 15
      RISK_THRESHOLD: 50
    precision: "integer; capped at 100"
    variants:
      - name: optimistic
        when: "gate for claim approval"
        difference: "excludes OPEN (unconfirmed) fraud flags"
      - name: pessimistic
        when: "gate for payout clearing"
        difference: "includes OPEN fraud flags; for the same data can cross RISK_THRESHOLD while optimistic does not"

  - name: program_fund_remaining
    trigger: "on payout commit (approval / settlement) and payout reversal"
    algorithm: aggregation
    formula: |
      fund_remaining_cents = fund_total_cents
        - sum(Payout.gross_amount_cents for payouts of this program with status IN {INITIATED, CLEARED, FAILED})
      # REVERSED payouts are excluded (their gross was credited back)
    input_set: "all non-REVERSED payouts of the program"
    precision: "integer cents"

  - name: consumer_total_recovered
    trigger: "on payout clear and payout reverse"
    algorithm: aggregation
    formula: |
      total_recovered_cents = sum(Payout.net_amount_cents
                                  for payouts of the consumer's claims with status == CLEARED)
    input_set: "all CLEARED payouts of the consumer"
    precision: "integer cents"

  - name: claim_eligibility
    trigger: "POST /rebate-aggregator/claims/{id}/start-review and on resubmit"
    algorithm: threshold
    formula: |
      min_purchase_met = claimed_amount_cents >= program.eligibility_min_purchase_cents
      verified_docs = count(ClaimDocument with status==VERIFIED for the claim)
      documents_sufficient = (not program.requires_proof) OR (verified_docs >= program.min_documents)
      eligible = min_purchase_met AND documents_sufficient
      reasons = [codes for any failing predicate]
    input_set: "one Claim + its program + its VERIFIED documents"
    precision: "boolean"

  - name: match_score
    trigger: "on POST /rebate-aggregator/matches (Match creation)"
    algorithm: weighted_scoring
    formula: |
      score = 50
      if program.status == OPEN: score += 30
      if program.claim_window_open_at <= clock_now < program.claim_window_close_at: score += 20
      match_score = min(100, score)
    input_set: "one Match's program at creation time"
    precision: "integer 0-100"

  - name: window_overlap_rules
    trigger: "benefit-period check at POST .../claims/{id}/submit; program-window check at POST /rebate-aggregator/programs"
    algorithm: interval_merge
    formula: |
      # (A) Claim benefit period — HALF-OPEN [start, end); touching endpoints do NOT overlap
      overlaps_benefit(new, existing) =
        (new.benefit_period_start < existing.benefit_period_end) AND
        (existing.benefit_period_start < new.benefit_period_end)
        # equal boundaries (a.end == b.start) => NOT overlapping (adjacency allowed)
        # existing set: claims of same consumer+program with status NOT IN {REJECTED, EXPIRED}
      # (B) Program claim window — CLOSED [open_at, close_at] with a BUFFER gap
      conflicts_program(new, existing_same_case) =
        NOT ( new.claim_window_open_at  >= existing.claim_window_close_at + BUFFER
              OR new.claim_window_close_at <= existing.claim_window_open_at  - BUFFER )
        # i.e. the two windows, each expanded by PROGRAM_WINDOW_BUFFER_DAYS, must be disjoint;
        # closed intervals mean touching endpoints DO conflict, and a gap smaller than
        # BUFFER also conflicts. existing set: programs with the same settlement_case_id.
    input_set: "(A) sibling claims of the consumer+program; (B) sibling programs of the settlement_case_id"
    constants:
      PROGRAM_WINDOW_BUFFER_DAYS: 30
    precision: "datetime comparison; BUFFER measured in whole days"
    note: "Rule resource_temporal_overlap: (A) half-open interval on Claim, adjacency allowed; (B) closed interval + buffer on RebateProgram, adjacency conflicts."

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a recognized role; X-User-ID present for every non-Anonymous role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /rebate-aggregator/consumers (Anonymous register)"

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint; for entity_backed Consumer, X-User-ID must own the target resource (claim.consumer_id == X-User-ID)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "All path/body resource ids exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing an id"

  - priority: 4
    category: existence
    check: "Body is well-formed; required fields present; enums valid; amounts > 0 where required; benefit_period_start < benefit_period_end; claim_window_open_at < claim_window_close_at"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 5
    category: state
    check: "Target resource is in a state that permits the transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_constraint
    check: "Segregation of duties: the FraudAnalyst clearing a flag must differ from the one who raised it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /rebate-aggregator/fraud-flags/{id}/clear"

  - priority: 7
    category: business_constraint
    check: "OCC: expected_program_version equals the program's current version"
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
    applies_to: "POST /rebate-aggregator/claims/{id}/approve"

  - priority: 8
    category: business_referential
    check: "Cross-entity gate: program.status == OPEN (submit); consumer.identity_status == VERIFIED (payout clear)"
    error_id: "ERR_PROGRAM_NOT_OPEN / ERR_CONSUMER_NOT_VERIFIED"
    http_status: 409
    applies_to: "POST .../claims/{id}/submit ; POST .../payouts/{id}/clear"

  - priority: 9
    category: business_temporal
    check: "Claim submitted within the program window: open_at <= clock_now < close_at"
    error_id: ERR_CLAIM_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /rebate-aggregator/claims/{id}/submit"

  - priority: 10
    category: business_temporal
    check: "New claim's benefit_period [start,end) must not overlap another non-terminal claim of the same consumer+program (half-open; touching endpoints allowed)"
    error_id: ERR_BENEFIT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /rebate-aggregator/claims/{id}/submit"

  - priority: 11
    category: business_temporal
    check: "New program's [open_at, close_at] must not overlap, and must be separated by at least PROGRAM_WINDOW_BUFFER_DAYS from, any other program with the same settlement_case_id (closed interval + buffer)"
    error_id: ERR_PROGRAM_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /rebate-aggregator/programs"

  - priority: 12
    category: business_constraint
    check: "Sufficient documents: document_count >= program.min_documents at submit when requires_proof"
    error_id: ERR_INSUFFICIENT_DOCUMENTS
    http_status: 409
    applies_to: "POST /rebate-aggregator/claims/{id}/submit"

  - priority: 13
    category: business_constraint
    check: "Eligibility: claimed_amount_cents >= program.eligibility_min_purchase_cents (submit); eligibility_status == ELIGIBLE (approve)"
    error_id: ERR_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST .../claims/{id}/submit ; POST .../claims/{id}/approve"

  - priority: 14
    category: business_safety
    check: "Fraud hold: claim.fraud_status != CONFIRMED at approval"
    error_id: ERR_FRAUD_HOLD
    http_status: 409
    applies_to: "POST /rebate-aggregator/claims/{id}/approve"

  - priority: 15
    category: business_safety
    check: "Risk gate: optimistic_risk_score < RISK_THRESHOLD (approve); pessimistic_risk_score < RISK_THRESHOLD (payout clear)"
    error_id: ERR_RISK_THRESHOLD_EXCEEDED
    http_status: 409
    applies_to: "POST .../claims/{id}/approve ; POST .../payouts/{id}/clear"

  - priority: 16
    category: business_fiscal
    check: "Fund available: computed final_payout_cents > 0 (fund_remaining_cents > 0) at FIXED approval"
    error_id: ERR_FUND_EXHAUSTED
    http_status: 409
    applies_to: "POST /rebate-aggregator/claims/{id}/approve"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- RebateProgram (catalog) ----
  - method: POST
    path: "/rebate-aggregator/programs"
    description: "Create a rebate/settlement program (DRAFT). Enforces window-conflict rule against same settlement_case_id."
    roles: [ProgramManager, PlatformAdmin]
    code: 201
    input: [name, settlement_case_id, category, distribution_method, fund_total_cents, advertised_amount_cents, per_claim_cap_cents, "eligibility_min_purchase_cents?", "requires_proof?", "min_documents?", claim_window_open_at, claim_window_close_at]
    output: RebateProgram
    side_effects: ["status=DRAFT", "window-conflict check vs same settlement_case_id (ERR_PROGRAM_WINDOW_CONFLICT)"]

  - method: GET
    path: "/rebate-aggregator/programs/{id}"
    description: "Get a program"
    roles: [Consumer, ClaimReviewer, FraudAnalyst, ProgramManager, PlatformAdmin]
    code: 200
    input: []
    output: RebateProgram
    side_effects: []

  - method: GET
    path: "/rebate-aggregator/programs"
    description: "List/browse the catalog (filterable)"
    roles: [Consumer, ClaimReviewer, FraudAnalyst, ProgramManager, PlatformAdmin]
    code: 200
    input: ["category?", "status?", "settlement_case_id?", "limit?", "offset?"]
    output: RebateProgram[]
    side_effects: []

  - method: GET
    path: "/rebate-aggregator/programs/{id}/report"
    description: "Reporting: aggregated program statistics (computed read)"
    roles: [ProgramManager, PlatformAdmin]
    code: 200
    input: []
    output: "{ program_id: string, total_claims: integer, approved_claims: integer, rejected_claims: integer, expired_claims: integer, total_committed_cents: integer, total_fees_cents: integer, total_cleared_cents: integer, fund_total_cents: integer, fund_remaining_cents: integer, average_net_payout_cents: integer }"
    side_effects: []

  - method: GET
    path: "/rebate-aggregator/programs/{id}/fund-transactions"
    description: "Reverse-reachability for FundTransaction.program_id: fund ledger of a program"
    roles: [ProgramManager, PlatformAdmin]
    code: 200
    input: []
    output: FundTransaction[]
    side_effects: []

  - method: POST
    path: "/rebate-aggregator/programs/{id}/open"
    description: "Open a program for claims (DRAFT->OPEN)"
    roles: [ProgramManager, PlatformAdmin]
    code: 200
    input: []
    output: RebateProgram
    side_effects: ["fund_remaining_cents = fund_total_cents"]

  - method: POST
    path: "/rebate-aggregator/programs/{id}/close"
    description: "Close a program (OPEN->CLOSED); PRO_RATA settlement + expire non-terminal claims"
    roles: [ProgramManager, PlatformAdmin]
    code: 200
    input: []
    output: RebateProgram
    side_effects: ["PRO_RATA settlement (calc pro_rata_settlement)", "cascade non-terminal claims -> EXPIRED", "notifications"]

  # ---- Consumer ----
  - method: POST
    path: "/rebate-aggregator/consumers"
    description: "Register a consumer (self-service, Anonymous). identity_status=UNVERIFIED."
    roles: [Anonymous, PlatformAdmin]
    code: 201
    input: [email, full_name]
    output: Consumer
    side_effects: ["identity_status=UNVERIFIED", "total_recovered_cents=0", "risk scores=0"]

  - method: GET
    path: "/rebate-aggregator/consumers/{id}"
    description: "Get a consumer"
    roles: [Consumer, ClaimReviewer, FraudAnalyst, ProgramManager, PlatformAdmin]
    code: 200
    input: []
    output: Consumer
    side_effects: []

  - method: POST
    path: "/rebate-aggregator/consumers/{id}/verify"
    description: "Verify a consumer's identity (UNVERIFIED->VERIFIED)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Consumer
    side_effects: ["identity_status=VERIFIED", "recompute risk scores"]

  - method: GET
    path: "/rebate-aggregator/consumers/{id}/notifications"
    description: "Reverse-reachability for Notification.consumer_id"
    roles: [Consumer, ProgramManager, PlatformAdmin]
    code: 200
    input: ["read?", "limit?", "offset?"]
    output: Notification[]
    side_effects: []

  # ---- Match (user match) ----
  - method: POST
    path: "/rebate-aggregator/matches"
    description: "Create a match between a consumer and a program (candidate)"
    roles: [ProgramManager, PlatformAdmin]
    code: 201
    input: [consumer_id, program_id]
    output: Match
    side_effects: ["status=CANDIDATE", "match_score computed"]

  - method: GET
    path: "/rebate-aggregator/matches/{id}"
    description: "Get a match"
    roles: [Consumer, ProgramManager, PlatformAdmin]
    code: 200
    input: []
    output: Match
    side_effects: []

  - method: GET
    path: "/rebate-aggregator/matches"
    description: "Reverse-reachability for Match.consumer_id and Match.program_id (filtered list)"
    roles: [Consumer, ProgramManager, PlatformAdmin]
    code: 200
    input: ["consumer_id?", "program_id?", "status?", "limit?", "offset?"]
    output: Match[]
    side_effects: []

  # ---- Claim (filing & tracking) ----
  - method: POST
    path: "/rebate-aggregator/claims"
    description: "Create a DRAFT claim. Optional match_id converts that Match."
    roles: [Consumer, PlatformAdmin]
    code: 201
    input: [consumer_id, program_id, benefit_period_start, benefit_period_end, claimed_amount_cents, "match_id?"]
    output: Claim
    side_effects: ["status=DRAFT", "if match_id: set that Match.status=CONVERTED"]

  - method: GET
    path: "/rebate-aggregator/claims/{id}"
    description: "Get a claim (tracking)"
    roles: [Consumer, ClaimReviewer, FraudAnalyst, ProgramManager, PlatformAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/rebate-aggregator/claims"
    description: "Reverse-reachability for Claim.consumer_id and Claim.program_id (filtered list)"
    roles: [Consumer, ClaimReviewer, FraudAnalyst, ProgramManager, PlatformAdmin]
    code: 200
    input: ["consumer_id?", "program_id?", "status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: POST
    path: "/rebate-aggregator/claims/{id}/documents"
    description: "Upload a supporting document to a claim (PENDING)"
    roles: [Consumer, PlatformAdmin]
    code: 201
    input: [doc_type, file_ref]
    output: ClaimDocument
    side_effects: ["status=PENDING", "recompute claim.document_count"]

  - method: GET
    path: "/rebate-aggregator/claims/{id}/documents"
    description: "Reverse-reachability for ClaimDocument.claim_id"
    roles: [Consumer, ClaimReviewer, FraudAnalyst, ProgramManager, PlatformAdmin]
    code: 200
    input: ["status?"]
    output: ClaimDocument[]
    side_effects: []

  - method: POST
    path: "/rebate-aggregator/claims/{id}/submit"
    description: "Submit a claim (DRAFT->SUBMITTED). Runs window/overlap/docs/eligibility checks."
    roles: [Consumer, PlatformAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: ["provisional_payout_cents set", "submitted_at set", "notification"]

  - method: POST
    path: "/rebate-aggregator/claims/{id}/start-review"
    description: "Begin review (SUBMITTED->UNDER_REVIEW); creates EligibilityAssessment"
    roles: [ClaimReviewer, PlatformAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: ["create EligibilityAssessment", "set eligibility_status"]

  - method: POST
    path: "/rebate-aggregator/claims/{id}/request-info"
    description: "Request more info (UNDER_REVIEW->NEEDS_INFO)"
    roles: [ClaimReviewer, PlatformAdmin]
    code: 200
    input: ["message?"]
    output: Claim
    side_effects: ["needs_info_count += 1", "notification"]

  - method: POST
    path: "/rebate-aggregator/claims/{id}/resubmit"
    description: "Consumer resupplies info (NEEDS_INFO->UNDER_REVIEW); cyclic"
    roles: [Consumer, PlatformAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: ["re-run claim_eligibility"]

  - method: POST
    path: "/rebate-aggregator/claims/{id}/approve"
    description: "Approve a claim (UNDER_REVIEW->APPROVED). OCC on program.version. FIXED: commit payout + debit fund."
    roles: [ClaimReviewer, PlatformAdmin]
    code: 200
    input: [expected_program_version]
    output: Claim
    side_effects: ["FIXED: set final/fee/net, create Payout, DEBIT fund, increments RebateProgram.version by 1, maybe auto-exhaust+cascade", "PRO_RATA: increments RebateProgram.version by 1", "notification"]

  - method: POST
    path: "/rebate-aggregator/claims/{id}/reject"
    description: "Reject a claim (UNDER_REVIEW|NEEDS_INFO->REJECTED)"
    roles: [ClaimReviewer, PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: Claim
    side_effects: ["notification", "recompute consumer_risk_score"]

  - method: GET
    path: "/rebate-aggregator/claims/{id}/eligibility-assessments"
    description: "Reverse-reachability for EligibilityAssessment.claim_id"
    roles: [Consumer, ClaimReviewer, ProgramManager, PlatformAdmin]
    code: 200
    input: []
    output: EligibilityAssessment[]
    side_effects: []

  # ---- Documents (review) ----
  - method: POST
    path: "/rebate-aggregator/documents/{id}/verify"
    description: "Verify a document (PENDING->VERIFIED)"
    roles: [ClaimReviewer, PlatformAdmin]
    code: 200
    input: []
    output: ClaimDocument
    side_effects: []

  - method: POST
    path: "/rebate-aggregator/documents/{id}/reject"
    description: "Reject a document (PENDING->REJECTED); cascades parent claim to NEEDS_INFO"
    roles: [ClaimReviewer, PlatformAdmin]
    code: 200
    input: [rejection_reason]
    output: ClaimDocument
    side_effects: ["rejection_reason set", "cascade parent claim -> NEEDS_INFO -> notification"]

  # ---- Fraud ----
  - method: POST
    path: "/rebate-aggregator/claims/{id}/fraud-flags"
    description: "Raise a fraud flag on a claim (OPEN)"
    roles: [FraudAnalyst, PlatformAdmin]
    code: 201
    input: [reason]
    output: FraudFlag
    side_effects: ["raised_by_user_id = X-User-ID", "claim.fraud_status -> FLAGGED", "recompute consumer_risk_score", "notification(FRAUD_FLAGGED)"]

  - method: GET
    path: "/rebate-aggregator/claims/{id}/fraud-flags"
    description: "Reverse-reachability for FraudFlag.claim_id"
    roles: [FraudAnalyst, ClaimReviewer, ProgramManager, PlatformAdmin]
    code: 200
    input: ["status?"]
    output: FraudFlag[]
    side_effects: []

  - method: POST
    path: "/rebate-aggregator/fraud-flags/{id}/confirm"
    description: "Confirm a fraud flag (OPEN->CONFIRMED); suspends consumer"
    roles: [FraudAnalyst, PlatformAdmin]
    code: 200
    input: ["resolution_note?"]
    output: FraudFlag
    side_effects: ["claim.fraud_status -> CONFIRMED", "consumer -> SUSPENDED", "recompute consumer_risk_score"]

  - method: POST
    path: "/rebate-aggregator/fraud-flags/{id}/clear"
    description: "Clear a fraud flag (OPEN->CLEARED); SoD: clearer != raiser"
    roles: [FraudAnalyst, PlatformAdmin]
    code: 200
    input: ["resolution_note?"]
    output: FraudFlag
    side_effects: ["cleared_by_user_id = X-User-ID", "recompute claim.fraud_status + consumer_risk_score"]

  # ---- Payout ----
  - method: GET
    path: "/rebate-aggregator/claims/{id}/payouts"
    description: "Reverse-reachability for Payout.claim_id"
    roles: [Consumer, ClaimReviewer, ProgramManager, PlatformAdmin]
    code: 200
    input: ["status?"]
    output: Payout[]
    side_effects: []

  - method: POST
    path: "/rebate-aggregator/payouts/{id}/clear"
    description: "Clear a payout (INITIATED->CLEARED). Requires consumer VERIFIED + risk gate."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: ["consumer.total_recovered_cents += net_amount_cents", "notification(PAYOUT_CLEARED)"]

  - method: POST
    path: "/rebate-aggregator/payouts/{id}/fail"
    description: "Mark a payout failed (INITIATED->FAILED)"
    roles: [PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: Payout
    side_effects: ["notification(PAYOUT_FAILED)"]

  - method: POST
    path: "/rebate-aggregator/payouts/{id}/retry"
    description: "Retry a failed payout (FAILED->INITIATED); cyclic. Does not re-debit fund."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: ["attempt_count += 1"]

  - method: POST
    path: "/rebate-aggregator/payouts/{id}/reverse"
    description: "Reverse a cleared payout (CLEARED->REVERSED); credits fund, decrements recovery"
    roles: [PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: Payout
    side_effects: ["CREDIT fund via FundTransaction, increments RebateProgram.version by 1", "consumer.total_recovered_cents -= net_amount_cents"]

  # ---- Logical clock (test-driving) ----
  - method: POST
    path: "/rebate-aggregator/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default (never real wall-clock)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock set; deadline/window/buffer evaluations use this value"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role missing/unknown, or X-User-ID missing for a non-Anonymous role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for the endpoint, or Consumer acting on a claim they do not own"

  # --- Existence / request ---
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced resource id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, bad enum, non-positive amount, start >= end interval"
  - id: ERR_DUPLICATE_EMAIL
    http: 409
    condition: "Consumer email already registered"
  - id: ERR_MATCH_MISMATCH
    http: 409
    condition: "match_id on claim creation references a Match whose consumer_id/program_id differ from the claim"

  # --- State ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state that permits the requested transition"

  # --- Concurrency ---
  - id: ERR_STALE_PROGRAM_VERSION
    http: 412
    condition: "expected_program_version does not match the program's current version (finite-pool OCC)"

  # --- Business: segregation of duties ---
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The FraudAnalyst clearing a flag is the same user who raised it"

  # --- Business: cross-entity / temporal ---
  - id: ERR_PROGRAM_NOT_OPEN
    http: 409
    condition: "Claim submit attempted while the program is not OPEN"
  - id: ERR_CONSUMER_NOT_VERIFIED
    http: 409
    condition: "Payout clear attempted while the consumer is not VERIFIED"
  - id: ERR_CLAIM_WINDOW_CLOSED
    http: 409
    condition: "Claim submitted outside [claim_window_open_at, claim_window_close_at)"
  - id: ERR_BENEFIT_PERIOD_OVERLAP
    http: 409
    condition: "New claim's benefit_period overlaps a non-terminal claim of same consumer+program (half-open)"
  - id: ERR_PROGRAM_WINDOW_CONFLICT
    http: 409
    condition: "New program's window overlaps or is within PROGRAM_WINDOW_BUFFER_DAYS of another program with same settlement_case_id"

  # --- Business: constraints ---
  - id: ERR_INSUFFICIENT_DOCUMENTS
    http: 409
    condition: "document_count < program.min_documents at submit while requires_proof"
  - id: ERR_NOT_ELIGIBLE
    http: 409
    condition: "claimed_amount below eligibility_min_purchase (submit) or eligibility_status != ELIGIBLE (approve)"

  # --- Business: safety ---
  - id: ERR_FRAUD_HOLD
    http: 409
    condition: "Approval attempted while claim.fraud_status == CONFIRMED"
  - id: ERR_RISK_THRESHOLD_EXCEEDED
    http: 409
    condition: "optimistic_risk_score >= RISK_THRESHOLD at approve, or pessimistic_risk_score >= RISK_THRESHOLD at payout clear"

  # --- Business: fiscal ---
  - id: ERR_FUND_EXHAUSTED
    http: 409
    condition: "FIXED approval where computed final_payout_cents <= 0 (fund_remaining_cents == 0)"

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only self-register a Consumer"
    identity: "opaque"
    exclusive_operations:
      - "POST /rebate-aggregator/consumers — Register consumer"
    shared_operations: []

  - name: Consumer
    description: "A registered consumer acting on their own claims, documents, matches, notifications"
    identity: "entity_backed:Consumer"
    exclusive_operations:
      - "POST /rebate-aggregator/claims — File a claim (consumer_id must equal X-User-ID)"
      - "POST /rebate-aggregator/claims/{id}/documents — Upload document to own claim"
      - "POST /rebate-aggregator/claims/{id}/submit — Submit own claim"
      - "POST /rebate-aggregator/claims/{id}/resubmit — Resubmit own claim after NEEDS_INFO"
    shared_operations:
      - "GET reads of own programs, claims, documents, matches, payouts, notifications, eligibility-assessments"

  - name: ClaimReviewer
    description: "Reviews claims and documents: eligibility review, request info, approve/reject, verify/reject documents"
    identity: "opaque"
    exclusive_operations:
      - "POST /rebate-aggregator/claims/{id}/start-review"
      - "POST /rebate-aggregator/claims/{id}/request-info"
      - "POST /rebate-aggregator/claims/{id}/approve"
      - "POST /rebate-aggregator/claims/{id}/reject"
      - "POST /rebate-aggregator/documents/{id}/verify"
      - "POST /rebate-aggregator/documents/{id}/reject"
    shared_operations:
      - "GET reads of programs, claims, documents, fraud-flags, eligibility-assessments"

  - name: FraudAnalyst
    description: "Raises, confirms, and clears fraud flags (four-eyes: cannot clear a flag they raised)"
    identity: "opaque"
    exclusive_operations:
      - "POST /rebate-aggregator/claims/{id}/fraud-flags — Raise flag"
      - "POST /rebate-aggregator/fraud-flags/{id}/confirm"
      - "POST /rebate-aggregator/fraud-flags/{id}/clear"
    shared_operations:
      - "GET reads of claims, fraud-flags"

  - name: ProgramManager
    description: "Manages the catalog: create/open/close programs, create matches, view fund ledger and reports"
    identity: "opaque"
    exclusive_operations:
      - "POST /rebate-aggregator/programs — Create program"
      - "POST /rebate-aggregator/programs/{id}/open"
      - "POST /rebate-aggregator/programs/{id}/close"
      - "POST /rebate-aggregator/matches — Create match"
      - "GET /rebate-aggregator/programs/{id}/report"
      - "GET /rebate-aggregator/programs/{id}/fund-transactions"
    shared_operations:
      - "GET reads of programs, consumers, claims, matches"

  - name: PlatformAdmin
    description: "Operational superuser: identity verification, payout operations, logical clock; may perform any operation as an override"
    identity: "opaque"
    exclusive_operations:
      - "POST /rebate-aggregator/consumers/{id}/verify"
      - "POST /rebate-aggregator/payouts/{id}/clear"
      - "POST /rebate-aggregator/payouts/{id}/fail"
      - "POST /rebate-aggregator/payouts/{id}/retry"
      - "POST /rebate-aggregator/payouts/{id}/reverse"
      - "POST /rebate-aggregator/_clock/set_current_utc"
    shared_operations:
      - "Superuser override of every other role's operations (listed in each endpoint's roles)"




