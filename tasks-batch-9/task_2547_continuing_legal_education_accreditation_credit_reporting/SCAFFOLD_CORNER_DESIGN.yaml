      - name: the_minimum_credit_gate_is_measured_after_the_fifteen_minute_floor
        claim_type: threshold
        grounds:
          - calculations.credit_record_category_proration
          - domain_constants.MIN_CREDITABLE_MINUTES
          - domain_constants.ROUNDING_INCREMENT_MINUTES
          - errors[ERR_BELOW_MINIMUM_CREDIT]
        distinguishing_aspect: "MIN_CREDITABLE_MINUTES is compared against credited_minutes AFTER the per-category floor to 15-minute increments, not against attended_minutes: 30 attended minutes credit exactly 30 and pass the gate, while 29 attended minutes floor to 15 and are refused — an implementation that gates on the raw attended figure accepts the 29-minute claim."
        test_recipe:
          setup:
            - "One ACCREDITED self-certifying provider and one APPROVED LIVE_IN_PERSON course of 600 minutes allocated entirely to GENERAL, verified by attendance code."
            - "Two attorneys, each with a non-prorated 2026-01-01 -> 2028-01-01 cycle (a second record for the same course must belong to a different attorney)."
