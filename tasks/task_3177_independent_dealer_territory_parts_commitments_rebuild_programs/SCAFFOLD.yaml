# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing, an unknown field is supplied, or a value is outside its declared type or enum"
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID absent, or the role is not a declared role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not permitted for the operation, or an actor backed by an entity acts on another entity's resource"
  - id: ERR_DEALER_SCOPE_MISMATCH
    http: 403
    condition: "the acting technician supervisor's dealer scope does not cover the service order's dealer"
  - id: ERR_DEALER_NOT_FOUND
    http: 404
    condition: "no Dealer exists for the supplied dealer_id or path id"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "no DealerAgreement exists for the supplied agreement_id or path id"
  - id: ERR_COMMITMENT_NOT_FOUND
    http: 404
    condition: "no PartsCommitment exists for the supplied commitment_id or path id"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "no RebuildClaim exists for the supplied claim id"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "no PerformanceReview exists for the supplied review id"
  - id: ERR_POPULATION_NOT_FOUND
    http: 404
    condition: "no MachinePopulationRecord exists for the supplied machine_serial or path id"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource is not in a state that admits the requested transition"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "the expected parent version supplied with the request no longer matches the parent's current version"
  - id: ERR_TERRITORY_OVERLAP
    http: 409
    condition: "an EXCLUSIVE representation interval for the same territory_code and product_family overlaps an existing EXCLUSIVE interval that is not TERMINATED, or the submitted planned share sits above 100"
  - id: ERR_AGREEMENT_EXCLUSIVITY_MISMATCH
    http: 409
    condition: "an EXCLUSIVE agreement's territory_code does not equal its owning dealer's territory_code"
  - id: ERR_TOOLING_INCOMPLETE
    http: 409
    condition: "the agreement's tooling_compliance_status is not COMPLIANT, or the certified technician head-count is below the product family minimum"
  - id: ERR_STOCKING_MANDATE_HARD_CAP
    http: 409
    condition: "the emergency availability target would push the stocking mandate past its hard cap, or a settled core credit reaches the mandate's settlement threshold"
  - id: ERR_COMMITMENT_EMPTY
    http: 409
    condition: "a batch cannot draw on the commitment because available_commitment_units is 0 and the batch is not an emergency order"
  - id: ERR_COMMITMENT_BATCH_OPEN
    http: 409
    condition: "an OPEN or ORDERED PartsOrderBatch of this commitment blocks the requested operation"
  - id: ERR_AGREEMENT_COMMITMENT_OPEN
    http: 409
    condition: "the agreement holds a commitment with an OPEN or ORDERED PartsOrderBatch and therefore cannot be terminated"
  - id: ERR_COMMITMENT_PERFORMANCE_DEFICIENT
    http: 409
    condition: "the commitment is PERFORMANCE_DEFICIENT so its core return cannot be accepted"
  - id: ERR_CREDIT_ALREADY_APPLIED
    http: 409
    condition: "the commitment already holds a non-zero core credit balance, so core-credit suspension is refused"
  - id: ERR_REBUILD_SPEC_EXCEEDED
    http: 422
    condition: "the machine's operating weight exceeds the certified rebuild specification's maximum weight, or the specification's technician minimum exceeds the agreement's certified head-count"
  - id: ERR_REBUILD_CORE_UNRETURNED
    http: 409
    condition: "the rebuild claim's core has not been returned under the certified return terms"
  - id: ERR_NO_RESTRICTION_PRIORITY
    http: 409
    condition: "the dealer holds no PartsCommitment in status PERFORMANCE_DEFICIENT, so the rebuild claim has no repair priority"
  - id: ERR_PARTY_SUPERSEDED
    http: 409
    condition: "a PartyRegistration for the territory is SUPERSEDED and blocks the requested decline"
  - id: ERR_MACHINE_NOT_IN_POPULATION
    http: 409
    condition: "the machine serial is not live in the dealer's ACTIVE MachinePopulationRecord rows"
  - id: ERR_MACHINE_ALREADY_REGISTERED
    http: 409
    condition: "the machine serial is already carried by an ACTIVE MachinePopulationRecord outside this dealer's own records"
  - id: ERR_MACHINE_POPULATION_RETIRED
    http: 409
    condition: "the machine serial is carried by a RETIRED MachinePopulationRecord"
  - id: ERR_MACHINE_REMARKETED
    http: 409
    condition: "the machine serial has been remarketed, so its population record cannot be reinstated"
  - id: ERR_TRADE_IN_APPRAISAL_EXCEEDS_PRICE
    http: 409
    condition: "the attached trade-in's appraised value reaches the equipment order's list price"
  - id: ERR_TRADE_IN_NOT_ACCEPTED
    http: 409
    condition: "the trade-in the operation needs is not in status ACCEPTED"
  - id: ERR_NO_ACTIVE_AGREEMENT
    http: 409
    condition: "the dealer holds no ACTIVE DealerAgreement for the machine's product family"
  - id: ERR_DEALER_TERMINATED
    http: 409
    condition: "the dealer or agreement is TERMINATED and admits no further operation"
  - id: ERR_REVIEW_OUTSTANDING
    http: 409
    condition: "a PerformanceReview of the agreement is not EVALUATED, so the agreement cannot be marked underperforming"
  - id: ERR_REVIEW_AWAITING_CIRCUMSTANCE
    http: 409
    condition: "a PerformanceReview of the agreement is CIRCUMSTANCE_PENDING, so the agreement cannot be suspended"
  - id: ERR_SLA_AUDIT_PENDING
    http: 409
    condition: "a SLA_AUDIT service order referencing the support agreement's machine serial is OPEN or IN_PROGRESS"
  - id: ERR_RESTRICTION_ALREADY_FULL_STOP
    http: 409
    condition: "the restriction order is already at FULL_STOP and cannot be raised further"
  - id: ERR_RESTRICTION_ALREADY_MINIMAL
    http: 409
    condition: "the restriction order is already at HOURS_SPENT and its compensating lower-restriction has nothing to undo"
  - id: ERR_DUPLICATE_SERIAL
    http: 409
    condition: "the machine serial is already held by a non-CANCELLED EquipmentOrder or a non-RETIRED MachinePopulationRecord"
  - id: ERR_STOCKING_MANDATE_UNMET
    http: 409
    condition: "the commitment's final stocking variant is below one unit, so it cannot be made order-ready"
  - id: ERR_EXECUTION_EPOCH_CONFLICT
    http: 409
    condition: "the batch receipt collides with a deferred re-evaluation armed for the same commitment in the same epoch"

