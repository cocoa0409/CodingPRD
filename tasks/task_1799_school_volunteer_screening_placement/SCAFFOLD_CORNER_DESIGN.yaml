            - { call: "POST /opportunities/${opp_id}/publish", payload: {}, as: CampusAdmin }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: DistrictCoordinator, captures: { completed: $.data.opportunities_completed_count } }
            - { call: "GET /opportunities/${opp_id}", payload: {}, as: CampusAdmin }
          assert:
            - "sweep reported opportunities_completed_count == 1"
            - "Opportunity.${opp_id}.status == COMPLETED"

  # ===========================================================================
  - section: calculations
    instances:
      - name: enhanced_clearance_expires_in_365_days
        claim_type: correct_result
        grounds: [calculations.clearance_validity_window, entities.BackgroundCheck.fields.expires_at]
        distinguishing_aspect: "ENHANCED validity constant 365 days: a check decided at the clock default 2026-08-01T00:00:00Z expires exactly 2027-08-01T00:00:00Z (BASIC would be 2028-07-31T00:00:00Z per the 730-day constant)."
        test_recipe:
          setup: ["UNSUPERVISED volunteer with PENDING ENHANCED check and completed never-expiring CORE training"]
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "CORE", title: "Core Orientation", required_contact_types: ["SUPERVISED", "UNSUPERVISED"] }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "Expiry Eve", email: "eve@x.com", contact_type: "UNSUPERVISED" }, as: DistrictCoordinator, captures: { v_id: $.data.id, v_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v_id}", level: "ENHANCED", expected_volunteer_version: "${v_ver}" }, as: DistrictCoordinator, captures: { chk_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
          trigger:
            - { call: "POST /background-checks/${chk_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator, captures: { decided: $.data.decided_at, expires: $.data.expires_at } }
          assert:
            - "BackgroundCheck.${chk_id}.decided_at == 2026-08-01T00:00:00Z (logical clock default)"
            - "BackgroundCheck.${chk_id}.expires_at == 2027-08-01T00:00:00Z"
            - "Volunteer.${v_id}.clearance_expires_at == 2027-08-01T00:00:00Z and required_check_level == ENHANCED"

      - name: badge_code_sequencing_and_daily_reset
        claim_type: correct_result
        grounds: [calculations.badge_code_assignment, entities.VisitCheckIn.fields.badge_code]
        distinguishing_aspect: "Badge sequences are per campus per UTC day in check-in order (LNC-0001, LNC-0002) and reset to LNC-0001 on the next day; check-out does not consume or release a sequence number."
        test_recipe:
          setup: ["campus LNC; two ACTIVE volunteers V1, V2"]
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED"], validity_days: 365 }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /campuses", payload: { name: "Lincoln Elementary", campus_code: "LNC", badge_prefix: "LNC" }, as: DistrictCoordinator, captures: { camp_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "Badge One", email: "b1@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v1_id: $.data.id, v1_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v1_id}", level: "BASIC", expected_volunteer_version: "${v1_ver}" }, as: DistrictCoordinator, captures: { ch1_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v1_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${ch1_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /volunteers", payload: { full_name: "Badge Two", email: "b2@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v2_id: $.data.id, v2_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v2_id}", level: "BASIC", expected_volunteer_version: "${v2_ver}" }, as: DistrictCoordinator, captures: { ch2_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v2_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${ch2_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: DistrictCoordinator }
          trigger:
            - { call: "POST /check-ins", payload: { campus_id: "${camp_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { b1: $.data.badge_code, ci1: $.data.id } }
            - { call: "POST /check-ins", payload: { campus_id: "${camp_id}" }, as: Volunteer, as_user_id: "${v2_id}", captures: { b2: $.data.badge_code, ci2: $.data.id } }
            - { call: "POST /check-ins/${ci1}/check-out", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /check-ins/${ci2}/check-out", payload: {}, as: Volunteer, as_user_id: "${v2_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T09:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /check-ins", payload: { campus_id: "${camp_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { b3: $.data.badge_code } }
          assert:
            - "first check-in of the day badge_code == LNC-0001"
            - "second check-in of the day badge_code == LNC-0002"
            - "next-day check-in badge_code == LNC-0001 (daily reset)"

      - name: rejected_entry_excluded_from_totals
        claim_type: input_set_filtering
        grounds: [calculations.volunteer_service_hours, state_machines.HourEntry.PENDING_to_REJECTED]
        distinguishing_aspect: "Input-set filtering: a PENDING entry counts only toward the provisional variant; rejecting it removes it from the provisional set too, and it never touches the verified variant."
        test_recipe:
          setup: ["ACTIVE volunteer with CONFIRMED placement; one 5.0 STANDARD entry PENDING"]
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED"], validity_days: 365 }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "Filter Flo", email: "flo@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v_id: $.data.id, v_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v_id}", level: "BASIC", expected_volunteer_version: "${v_ver}" }, as: DistrictCoordinator, captures: { chk_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${chk_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /campuses", payload: { name: "Lincoln Elementary", campus_code: "LNC", badge_prefix: "LNC" }, as: DistrictCoordinator, captures: { camp_id: $.data.id } }
            - { call: "POST /opportunities", payload: { campus_id: "${camp_id}", title: "Library Help", required_contact_type: "SUPERVISED", restricted_category: "NONE", capacity: 2, starts_at: "2026-08-10T14:00:00Z", ends_at: "2026-08-10T17:00:00Z" }, as: CampusAdmin, captures: { opp_id: $.data.id } }
            - { call: "POST /opportunities/${opp_id}/publish", payload: {}, as: CampusAdmin }
            - { call: "POST /placements", payload: { opportunity_id: "${opp_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /placements/${pl_id}/confirm", payload: {}, as: CampusAdmin }
            - { call: "POST /hour-entries", payload: { placement_id: "${pl_id}", worked_date: "2026-08-10", hours: 5.0, activity_category: "STANDARD" }, as: Volunteer, as_user_id: "${v_id}", captures: { he_id: $.data.id } }
            - { call: "GET /volunteers/${v_id}", payload: {}, as: DistrictCoordinator, captures: { prov_before: $.data.total_provisional_hours } }
          trigger:
            - { call: "POST /hour-entries/${he_id}/reject", payload: {}, as: CampusAdmin }
            - { call: "GET /volunteers/${v_id}", payload: {}, as: DistrictCoordinator }
          assert:
            - "before reject: total_provisional_hours == 5.0 and total_verified_hours == 0.0"
            - "after reject: total_provisional_hours == 0.0 and total_verified_hours == 0.0"
            - "HourEntry.${he_id}.status == REJECTED"

  # ===========================================================================
  - section: validations
    instances:
      - name: unauthenticated_request_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any role or existence check runs."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /volunteers", payload: {}, captures: { err: $.data.error_id } }
          assert:
            - "response is the error envelope with error_id == ERR_UNAUTHENTICATED and HTTP 401"

      - name: expired_training_blocks_confirm
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", calculations.training_compliance_check, "errors[ERR_TRAINING_INCOMPLETE]"]
        distinguishing_aspect: "Conditional validation: training compliance is re-evaluated against the logical clock at confirm time — an ORIENT record whose 365-day validity lapsed (completed 2026-07-01, expires 2027-07-01) blocks confirmation on 2027-07-15 even though the ENHANCED clearance (expires 2027-08-01) is still valid."
        test_recipe:
          setup:
            - "UNSUPERVISED volunteer ACTIVE via ENHANCED check; ORIENT (validity 365) completed 2026-07-01"
            - "clock advanced to 2027-07-15T00:00:00Z; UNSUPERVISED opportunity published with starts_at 2027-08-10 (publish window check passes)"
            - "placement REQUESTED"
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED", "UNSUPERVISED"], validity_days: 365 }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "Stale Trainee", email: "st@x.com", contact_type: "UNSUPERVISED" }, as: DistrictCoordinator, captures: { v_id: $.data.id, v_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v_id}", level: "ENHANCED", expected_volunteer_version: "${v_ver}" }, as: DistrictCoordinator, captures: { chk_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${chk_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-07-15T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /campuses", payload: { name: "Lincoln Elementary", campus_code: "LNC", badge_prefix: "LNC" }, as: DistrictCoordinator, captures: { camp_id: $.data.id } }
            - { call: "POST /opportunities", payload: { campus_id: "${camp_id}", title: "Mentor Day", required_contact_type: "UNSUPERVISED", restricted_category: "NONE", capacity: 2, starts_at: "2027-08-10T14:00:00Z", ends_at: "2027-08-10T17:00:00Z" }, as: CampusAdmin, captures: { opp_id: $.data.id } }
            - { call: "POST /opportunities/${opp_id}/publish", payload: {}, as: CampusAdmin }
            - { call: "POST /placements", payload: { opportunity_id: "${opp_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { pl_id: $.data.id } }
          trigger:
            - { call: "POST /placements/${pl_id}/confirm", payload: {}, as: CampusAdmin, captures: { err: $.data.error_id } }
          assert:
            - "confirm -> error_id == ERR_TRAINING_INCOMPLETE (422)"
            - "Placement.${pl_id}.status remains REQUESTED"
            - "Volunteer.${v_id}.status remains ACTIVE (expired training does not demote; it only gates)"

      - name: hour_entry_rule_violations_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "validations[priority=8]", "errors[ERR_HOURS_EXCEED_LIMIT]", "errors[ERR_HOURS_OUTSIDE_PLACEMENT_WINDOW]"]
        distinguishing_aspect: "Two distinct hour-entry gates on the volunteer's own CONFIRMED placement: hours > 12 fails ERR_HOURS_EXCEED_LIMIT (constraint) and an in-limit entry dated outside the placement window fails ERR_HOURS_OUTSIDE_PLACEMENT_WINDOW (temporal)."
        test_recipe:
          setup: ["ACTIVE volunteer with CONFIRMED placement on opp window 2026-08-10T14:00:00Z..2026-08-10T17:00:00Z"]
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED"], validity_days: 365 }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "Rules Rudy", email: "rudy@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v_id: $.data.id, v_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v_id}", level: "BASIC", expected_volunteer_version: "${v_ver}" }, as: DistrictCoordinator, captures: { chk_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${chk_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /campuses", payload: { name: "Lincoln Elementary", campus_code: "LNC", badge_prefix: "LNC" }, as: DistrictCoordinator, captures: { camp_id: $.data.id } }
            - { call: "POST /opportunities", payload: { campus_id: "${camp_id}", title: "Library Help", required_contact_type: "SUPERVISED", restricted_category: "NONE", capacity: 2, starts_at: "2026-08-10T14:00:00Z", ends_at: "2026-08-10T17:00:00Z" }, as: CampusAdmin, captures: { opp_id: $.data.id } }
            - { call: "POST /opportunities/${opp_id}/publish", payload: {}, as: CampusAdmin }
            - { call: "POST /placements", payload: { opportunity_id: "${opp_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /placements/${pl_id}/confirm", payload: {}, as: CampusAdmin }
          trigger:
            - { call: "POST /hour-entries", payload: { placement_id: "${pl_id}", worked_date: "2026-08-10", hours: 13.0, activity_category: "STANDARD" }, as: Volunteer, as_user_id: "${v_id}", captures: { err1: $.data.error_id } }
            - { call: "POST /hour-entries", payload: { placement_id: "${pl_id}", worked_date: "2026-08-20", hours: 2.0, activity_category: "STANDARD" }, as: Volunteer, as_user_id: "${v_id}", captures: { err2: $.data.error_id } }
          assert:
            - "13.0-hour entry -> error_id == ERR_HOURS_EXCEED_LIMIT (422)"
            - "2026-08-20 entry -> error_id == ERR_HOURS_OUTSIDE_PLACEMENT_WINDOW (422)"
            - "GET /hour-entries?placement_id=${pl_id} total_count == 0"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: pagination_limit_offset_and_has_more
        claim_type: listing
        grounds: [response_envelope, endpoints.GET_/volunteers]
        distinguishing_aspect: "Pagination envelope: limit=2 over 3 volunteers returns total_count 3 with has_more true on page 0 and exactly 1 item with has_more false at offset 2."
        test_recipe:
          setup: ["three volunteers created"]
          setup_api_calls:
            - { call: "POST /volunteers", payload: { full_name: "Page One", email: "p1@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator }
            - { call: "POST /volunteers", payload: { full_name: "Page Two", email: "p2@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator }
