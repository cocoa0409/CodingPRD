# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3097_clearing_netting_settlement_participant_operations
#
# Breadth probe. Every testable claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners already
# covered by a §1.8 instance appear as `excluded_because:` stubs with no
# test_recipe; the cited difficulty_instance exists by name in §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: participant_create_defaults_and_pending_initial_state
        claim_type: Creation
        grounds:
          - entities.Participant
          - endpoints.POST_/clearing/participants
          - entities.Participant.fields.membership_status
        distinguishing_aspect: "A participant created with only the four required fields comes back 201 with membership_status PENDING, is_defaulted false, version 1, a server-minted UUID id, and a ClearingMemberDeposit row already opened."
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /clearing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /clearing/participants"
              payload: { legal_name: "Corner Clearing LLC", lei: "LEI-CORNER1", participant_class: "BROKER_DEALER", net_capital_cents: 600000000 }
              as: PlatformAdmin
              captures: { p_corner: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Participant.${p_corner}.membership_status == PENDING"
            - "Participant.${p_corner}.is_defaulted == false and requires_segregated_custody == false"
            - "Participant.${p_corner}.version == 1 and id is a UUID with no type prefix"
            - "GET /clearing/participants/${p_corner}/deposits returns exactly one pool with posted_amount_cents 0 and status SATISFIED"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

      - name: security_get_round_trips_market_fields
        claim_type: Retrieval
        grounds:
          - entities.Security
          - endpoints.GET_/clearing/securities/{id}
        distinguishing_aspect: "Every Security field round-trips through GET exactly as posted, including the omitted currency defaulting to USD and the omitted current_volatility_bps defaulting to 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z. A Security is registered with only ticker, cusip and prev_settlement_price_cents."
          setup_api_calls:
            - call: "POST /clearing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clearing/securities"
              payload: { ticker: "RTP1", cusip: "912828XR1", prev_settlement_price_cents: 1250 }
              as: PlatformAdmin
              captures: { sec_rtp: $.data.id }
          trigger:
            - call: "GET /clearing/securities/${sec_rtp}"
              payload: {}
              as: ClearingMember
          assert:
            - "the response status is 200 and response_type is object"
            - "Security.${sec_rtp}.ticker == \"RTP1\" and cusip == \"912828XR1\""
            - "Security.${sec_rtp}.prev_settlement_price_cents == 1250"
            - "Security.${sec_rtp}.currency == \"USD\" and current_volatility_bps == 0, both applied from their declared defaults"

      - name: participants_list_paginates_and_reports_total_count
        claim_type: Listing
        grounds:
          - endpoints.GET_/clearing/participants
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three participants on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, while offset=2 returns the remaining row with has_more false — total_count counts the filtered set, not the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z. Three participants exist, two of them BROKER_DEALER and one BANK."
          setup_api_calls:
            - call: "POST /clearing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clearing/participants"
              payload: { legal_name: "Page Alpha", lei: "LEI-PG1", participant_class: "BROKER_DEALER", net_capital_cents: 600000000 }
              as: PlatformAdmin
            - call: "POST /clearing/participants"
              payload: { legal_name: "Page Beta", lei: "LEI-PG2", participant_class: "BROKER_DEALER", net_capital_cents: 600000000 }
              as: PlatformAdmin
            - call: "POST /clearing/participants"
              payload: { legal_name: "Page Gamma", lei: "LEI-PG3", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
          trigger:
            - call: "GET /clearing/participants?limit=2&offset=0&participant_class=BROKER_DEALER"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the response status is 200 and response_type is array"
            - "data has exactly 2 rows, total_count == 2 and has_more == false, because the participant_class filter narrows the set before pagination"
            - "a repeated call with limit=2&offset=0 and no filter returns 2 rows with total_count == 3 and has_more == true"

      - name: participant_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_RESOURCE_NOT_FOUND]
          - endpoints.GET_/clearing/participants/{id}
        distinguishing_aspect: "A GET against a well-formed UUID that names no participant returns 404 ERR_RESOURCE_NOT_FOUND rather than an empty object or a 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /clearing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /clearing/participants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err_nf: $.data.error_id }
          assert:
            - "the response status is 404 and response_type is error"
            - "data.error_id == ERR_RESOURCE_NOT_FOUND"

      - name: participant_create_extra_field_rejected
        claim_type: Required Fields
        grounds:
          - validations[priority=25]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Supplying an undeclared field alongside a complete valid body is refused with 422 ERR_INVALID_REQUEST and writes nothing, so the schema is closed rather than silently ignoring unknown keys."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /clearing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /clearing/participants"
              payload: { legal_name: "Strict Co", lei: "LEI-STRICT", participant_class: "BANK", net_capital_cents: 2000000000, membership_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { err_extra: $.data.error_id }
          assert:
            - "the response status is 422 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /clearing/participants?participant_class=BANK returns zero rows, because membership_status is server-owned and the unknown key rejected the whole request"

      - name: security_immutable_ticker_rejected
        claim_type: Immutability
        grounds:
          - errors[ERR_IMMUTABLE_FIELD]
          - endpoints.PUT_/clearing/securities/{id}
          - entities.Security.fields.ticker
        distinguishing_aspect: "An update that supplies the immutable ticker is refused with 422 ERR_IMMUTABLE_FIELD while an update that supplies only the mutable market fields succeeds, so immutability is enforced by field rather than by endpoint."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z. Security IMM1 is registered."
          setup_api_calls:
            - call: "POST /clearing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clearing/securities"
              payload: { ticker: "IMM1", cusip: "912828XR2", prev_settlement_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sec_imm: $.data.id }
          trigger:
            - call: "PUT /clearing/securities/${sec_imm}"
              payload: { ticker: "IMM2" }
              as: PlatformAdmin
              captures: { err_imm: $.data.error_id }
          assert:
            - "the response status is 422 and data.error_id == ERR_IMMUTABLE_FIELD"
            - "GET /clearing/securities/${sec_imm} still reports ticker == \"IMM1\""
            - "PUT /clearing/securities/${sec_imm} with prev_settlement_price_cents 6000 succeeds and leaves ticker unchanged"

      - name: net_position_computed_fields_ignore_input
        claim_type: Computed Fields
        grounds:
          - entities.NetPosition.fields.net_quantity
          - entities.NetPosition.fields.settlement_obligation_cents
        excluded_because:
          difficulty_instance: netting_net_vs_gross_position_convention
          rationale: "The net quantity, cash delta and settlement obligation are asserted as the observable outcome of that named §1.8 instance, so no separate corner is required."

      - name: trade_submission_allegation_count_is_computed
        claim_type: Computed Fields
        grounds:
          - entities.TradeSubmission.fields.allegations_received
          - state_machines.TradeSubmission.OPEN_to_LOCKED_IN
        excluded_because:
          difficulty_instance: trade_submission_parallel_lock_and_match_dimensions
          rationale: "allegations_received is a side effect of the lock-in asserted in that named §1.8 instance."

  # ===========================================================================
  - section: state_machines
    instances:

      - name: settlement_window_created_in_open_state
        claim_type: Initial State
        grounds:
          - state_machines.SettlementWindow.initial_state
          - entities.SettlementWindow.fields.status
        distinguishing_aspect: "A newly created SettlementWindow starts in OPEN regardless of the deadlines supplied, and its status is never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z. A Security exists and no window has been opened for it."
          setup_api_calls:
            - call: "POST /clearing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clearing/securities"
              payload: { ticker: "INI1", cusip: "912828XS1", prev_settlement_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sec_ini: $.data.id }
          trigger:
            - call: "POST /clearing/settlement-windows"
              payload: { security_id: "${sec_ini}", settlement_date: "2026-09-10", trade_entry_deadline: "2026-09-09T20:00:00Z", affirmation_deadline: "2026-09-09T22:00:00Z" }
              as: PlatformAdmin
              captures: { win_ini: $.data.id }
          assert:
            - "the response status is 201"
            - "SettlementWindow.${win_ini}.status == OPEN"
            - "SettlementWindow.${win_ini}.version == 1"
            - "SettlementWindow.${win_ini}.security_id == ${sec_ini} and settlement_date == \"2026-09-10\""

      - name: corporate_action_reverse_on_reversed_is_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.CorporateAction.terminal_states
          - state_machines.CorporateAction.APPLIED_to_REVERSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "REVERSED is terminal for CorporateAction, so a second reverse on the same action is refused with ERR_INVALID_STATE and no servicing is re-applied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z. Participants TA2 and TB2 are ACTIVE; Security TER1 has an OPEN window settling 2026-09-10; TA2 holds a locked-in matched BUY; a 3-for-2 SPLIT with effective_date 2026-09-09 is announced, applied and then reversed."
          setup_api_calls:
            - call: "POST /clearing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clearing/participants"
              payload: { legal_name: "Term Alpha", lei: "LEI-TA2", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_ta2: $.data.id }
            - call: "POST /clearing/participants"
              payload: { legal_name: "Term Beta", lei: "LEI-TB2", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_tb2: $.data.id }
            - call: "POST /clearing/participants/${p_ta2}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/participants/${p_tb2}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/securities"
              payload: { ticker: "TER1", cusip: "912828XS2", prev_settlement_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sec_ter: $.data.id }
            - call: "POST /clearing/settlement-windows"
              payload: { security_id: "${sec_ter}", settlement_date: "2026-09-10", trade_entry_deadline: "2026-09-09T20:00:00Z", affirmation_deadline: "2026-09-09T22:00:00Z" }
              as: PlatformAdmin
              captures: { win_ter: $.data.id }
            - call: "POST /clearing/trade-submissions"
              payload: { counterparty_participant_id: "${p_tb2}", security_id: "${sec_ter}", side: "BUY", quantity: 3, trade_price_cents: 4000, trade_date: "2026-09-08T14:00:00Z" }
              as: ClearingMember
              as_user_id: "${p_ta2}"
              captures: { t_ter: $.data.id }
            - call: "POST /clearing/trade-submissions/${t_ter}/lock-in"
              payload: {}
              as: ClearingMember
              as_user_id: "${p_ta2}"
            - call: "POST /clearing/corporate-actions"
              payload: { security_id: "${sec_ter}", action_type: "SPLIT", ratio_numerator: 3, ratio_denominator: 2, effective_date: "2026-09-09" }
              as: PlatformAdmin
              captures: { ca_ter: $.data.id }
            - call: "POST /clearing/corporate-actions/${ca_ter}/apply"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/corporate-actions/${ca_ter}/reverse"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /clearing/corporate-actions/${ca_ter}/reverse"
              payload: {}
              as: PlatformAdmin
              captures: { err_term: $.data.error_id }
          assert:
            - "the response status is 409 and data.error_id == ERR_INVALID_STATE"
            - "GET /clearing/corporate-actions/${ca_ter} still reports status == REVERSED"
            - "GET /clearing/net-positions?window_id=${win_ter} reports net_quantity == 3, unchanged by the refused second reverse"

      - name: trade_lockin_from_locked_in_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.TradeSubmission.OPEN_to_LOCKED_IN
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Repeating a lock-in on a trade already in LOCKED_IN is refused with ERR_INVALID_STATE and does not advance the version a second time."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z. Participants IA2 and IB2 are ACTIVE; Security IDM1 has an OPEN window; a BUY is submitted and locked in once."
          setup_api_calls:
            - call: "POST /clearing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clearing/participants"
              payload: { legal_name: "Idem Alpha", lei: "LEI-IA2", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_ia2: $.data.id }
            - call: "POST /clearing/participants"
              payload: { legal_name: "Idem Beta", lei: "LEI-IB2", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_ib2: $.data.id }
            - call: "POST /clearing/participants/${p_ia2}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/participants/${p_ib2}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/securities"
              payload: { ticker: "IDM1", cusip: "912828XS3", prev_settlement_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sec_idm: $.data.id }
            - call: "POST /clearing/settlement-windows"
              payload: { security_id: "${sec_idm}", settlement_date: "2026-09-10", trade_entry_deadline: "2026-09-09T20:00:00Z", affirmation_deadline: "2026-09-09T22:00:00Z" }
              as: PlatformAdmin
              captures: { win_idm: $.data.id }
            - call: "POST /clearing/trade-submissions"
              payload: { counterparty_participant_id: "${p_ib2}", security_id: "${sec_idm}", side: "BUY", quantity: 10, trade_price_cents: 4000, trade_date: "2026-09-08T14:00:00Z" }
              as: ClearingMember
              as_user_id: "${p_ia2}"
              captures: { t_idm: $.data.id }
            - call: "POST /clearing/trade-submissions/${t_idm}/lock-in"
              payload: {}
              as: ClearingMember
              as_user_id: "${p_ia2}"
          trigger:
            - call: "POST /clearing/trade-submissions/${t_idm}/lock-in"
              payload: {}
              as: ClearingMember
              as_user_id: "${p_ia2}"
              captures: { err_idem: $.data.error_id }
          assert:
            - "the response status is 409 and data.error_id == ERR_INVALID_STATE"
            - "GET /clearing/trade-submissions/${t_idm} still reports lock_status == LOCKED_IN"

      - name: fund_recompute_twice_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ClearingFund.OPEN_to_RECOMPUTED
          - errors[ERR_FUND_ALREADY_RECOMPUTED]
        distinguishing_aspect: "A second recompute with no intervening new net position on the fund's security is refused with ERR_FUND_ALREADY_RECOMPUTED, so sizing advances at most one generation per netting event."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z. Participants FA2 and FB2 are ACTIVE and class BANK; Security FRC1 exists; a BANK clearing fund for FRC1 has been recomputed once."
          setup_api_calls:
            - call: "POST /clearing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clearing/participants"
              payload: { legal_name: "Fund Alpha Two", lei: "LEI-FA2", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_fa2: $.data.id }
            - call: "POST /clearing/participants"
              payload: { legal_name: "Fund Beta Two", lei: "LEI-FB2", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
            - call: "POST /clearing/participants/${p_fa2}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/securities"
              payload: { ticker: "FRC1", cusip: "912828XS4", prev_settlement_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sec_frc: $.data.id }
            - call: "POST /clearing/clearing-funds"
              payload: { security_id: "${sec_frc}", participant_class: "BANK" }
              as: RiskOfficer
              captures: { fund_frc: $.data.id, fund_frc_v: $.data.version }
            - call: "POST /clearing/clearing-funds/${fund_frc}/recompute"
              payload: { expected_fund_version: "${fund_frc_v}" }
              as: RiskOfficer
              captures: { fund_frc_v2: $.data.version }
          trigger:
            - call: "POST /clearing/clearing-funds/${fund_frc}/recompute"
              payload: { expected_fund_version: "${fund_frc_v2}" }
              as: RiskOfficer
              captures: { err_fund: $.data.error_id }
          assert:
            - "the response status is 409 and data.error_id == ERR_FUND_ALREADY_RECOMPUTED"
            - "GET /clearing/clearing-funds/${fund_frc}/components returns exactly one generation, so no second sizing ran"

      - name: window_auto_closed_when_no_active_participant
        claim_type: Valid Transition
        grounds:
          - state_machines.SettlementWindow.OPEN_to_CLOSED
          - entities.Participant.fields.membership_status
        distinguishing_aspect: "The system-triggered OPEN to CLOSED transition fires when no participant holds membership_status ACTIVE, so a window opened in a database with only PENDING participants lands in CLOSED and can no longer be netted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z. One participant exists but is left PENDING, so no participant is ACTIVE."
          setup_api_calls:
            - call: "POST /clearing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clearing/participants"
              payload: { legal_name: "Auto Closed Co", lei: "LEI-AUTO1", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
            - call: "POST /clearing/securities"
              payload: { ticker: "AUT1", cusip: "912828XS5", prev_settlement_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sec_aut: $.data.id }
          trigger:
            - call: "POST /clearing/settlement-windows"
              payload: { security_id: "${sec_aut}", settlement_date: "2026-09-10", trade_entry_deadline: "2026-09-09T20:00:00Z", affirmation_deadline: "2026-09-09T22:00:00Z" }
              as: PlatformAdmin
              captures: { win_aut: $.data.id }
          assert:
            - "the response status is 201 and SettlementWindow.${win_aut}.status == CLOSED, because the system transition fires with no ACTIVE participant present"
            - "POST /clearing/settlement-windows/${win_aut}/net is refused with ERR_INVALID_STATE, since CLOSED is terminal"

  # ===========================================================================
  - section: calculations
    instances:

      - name: deposit_posted_balance_sums_signed_postings
        claim_type: Correct Result
        grounds:
          - calculations.deposit_posted_balance
          - entities.ClearingMemberDeposit.fields.posted_amount_cents
          - entities.DepositTransaction.fields.txn_type
        distinguishing_aspect: "posted_amount_cents is the strict integer sum of signed DepositTransaction amounts, so a 500000-cent posting followed by a 200000-cent release leaves 300000 and the release row carries txn_type RELEASE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z. One ACTIVE participant with an empty deposit pool holds a 500000-cent posting."
          setup_api_calls:
            - call: "POST /clearing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clearing/participants"
              payload: { legal_name: "Deposit Corner Co", lei: "LEI-DEP1", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_dep: $.data.id }
            - call: "POST /clearing/participants/${p_dep}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "GET /clearing/deposits?participant_id=${p_dep}"
              payload: {}
              as: PlatformAdmin
              captures: { dep_corner: "$.data[0].id" }
            - call: "POST /clearing/deposits/${dep_corner}/postings"
              payload: { amount_cents: 500000 }
              as: ClearingMember
              as_user_id: "${p_dep}"
          trigger:
            - call: "POST /clearing/deposits/${dep_corner}/postings"
              payload: { amount_cents: -200000, reason_code: "COLLATERAL_RELEASE" }
              as: ClearingMember
              as_user_id: "${p_dep}"
          assert:
            - "the response status is 201 and DepositTransaction.txn_type == RELEASE"
            - "GET /clearing/deposits/${dep_corner} reports posted_amount_cents == 300000"
            - "GET /clearing/deposits/${dep_corner} reports status == SATISFIED, because there are no outstanding non-FAILED settlement obligations to cover"

      - name: fund_scaling_counts_only_locked_in_trades
        claim_type: Input Set Filtering
        grounds:
          - calculations.clearing_fund_scaling_and_cap.input_set
          - entities.TradeSubmission.fields.lock_status
          - entities.FundComponent.fields.component_amount_cents
        distinguishing_aspect: "Open risk counts only LOCKED_IN trades on the fund's security, so an unmatched OPEN trade with a far larger notional contributes nothing to component_amount_cents."
        test_recipe:
          setup:
