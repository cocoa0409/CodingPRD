            - call: "POST /observations"
              payload: { cycle_id: "${cyc_id}", evaluator_id: "${ev_id}", observation_type: "FORMAL", scheduled_start: "2026-09-10T09:00:00Z", scheduled_end: "2026-09-10T10:00:00Z", announced: true }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { obs1_id: $.data.id }
            - call: "POST /observations/${obs1_id}/conduct"
              payload: {}
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { o1v0: $.data.version }
            - call: "POST /observations/${obs1_id}/rubric-scores"
              payload: { domain_code: "PLANNING", raw_score: 3, expected_observation_version: "${o1v0}" }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { o1v1: $.data.observation_version_after }
            - call: "POST /observations/${obs1_id}/rubric-scores"
              payload: { domain_code: "ENVIRONMENT", raw_score: 3, expected_observation_version: "${o1v1}" }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { o1v2: $.data.observation_version_after }
            - call: "POST /observations/${obs1_id}/rubric-scores"
              payload: { domain_code: "INSTRUCTION", raw_score: 4, expected_observation_version: "${o1v2}" }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { o1v3: $.data.observation_version_after }
            - call: "POST /observations/${obs1_id}/rubric-scores"
              payload: { domain_code: "PROFESSIONALISM", raw_score: 3, expected_observation_version: "${o1v3}" }
              as: Evaluator
              as_user_id: "${ev_id}"
          trigger:
            - call: "POST /observations/${obs1_id}/submit"
              payload: {}
              as: Evaluator
              as_user_id: "${ev_id}"
            - call: "GET /schools/${sch_id}"
              payload: {}
              as: HrAdmin
              captures: { committed_mid: $.data.evaluation_budget_committed_cents }
            - call: "POST /observations/${obs1_id}/void"
              payload: { void_reason: "Observation rescheduled by mutual agreement" }
              as: HrAdmin
          assert:
            - "Before the trigger, School.${sch_id}.evaluation_budget_committed_cents == 0 and evaluation_budget_remaining_cents == 100000"
            - "After the submit, Observation.${obs1_id}.stipend_cents == 12500"
            - "After the submit, School.${sch_id}.evaluation_budget_committed_cents == 12500"
            - "After the submit, School.${sch_id}.evaluation_budget_remaining_cents == 87500"
            - "After the submit, EvaluationCycle.${cyc_id}.completed_formal_count == 1 and observation_component == 3.3300"
            - "After the void, Observation.${obs1_id}.status == VOIDED and Observation.${obs1_id}.stipend_cents == 0"
            - "After the void, School.${sch_id}.evaluation_budget_committed_cents == 0"
            - "After the void, School.${sch_id}.evaluation_budget_remaining_cents == 100000"
            - "After the void, EvaluationCycle.${cyc_id}.completed_formal_count == 0 and observation_component == null"
            - "After the void, EvaluationCycle.${cyc_id}.status == SCHEDULING"

      - name: attach_then_withdraw_restores_evidence_ledger_exactly
        grounds:
          - state_machines.EvidenceArtifact.ATTACHED_to_WITHDRAWN
          - entities.Observation.fields.evidence_count
          - entities.EvaluationCycle.fields.evidence_artifact_count
          - calculations.evidence_sufficiency_adjustment
        distinguishing_aspect: |
          Conserved quantity 2 is a document count, not money: the invariant
          `EvaluationCycle.evidence_artifact_count == sum(Observation.evidence_count over the
          cycle's non-VOIDED observations)` and `Observation.evidence_count == count of
          ATTACHED artifacts` must hold at every step, so two attaches followed by two
          withdrawals return both counters to 0 with no drift.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; policy at defaults."
            - "One certified evaluator, one educator, one cycle, one CONDUCTED FORMAL observation with no artifacts."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HrAdmin
            - call: "POST /evaluation-policies"
              payload: { school_year: "2026-2027" }
              as: HrAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /schools"
              payload: { name: "Lincoln High", code: "LHS", level: "HIGH", evaluation_budget_allocated_cents: 100000 }
              as: HrAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /educators"
              payload: { school_id: "${sch_id}", employee_number: "E-C201", full_name: "Ravi Sen", service_start_date: "2024-08-15" }
              as: HrAdmin
              captures: { edu_id: $.data.id }
            - call: "POST /evaluators"
              payload: { full_name: "Pat Ortiz" }
              as: HrAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /calibration-reviews"
              payload: { evaluator_id: "${ev_id}", anchor_lesson_code: "ANCH-1", anchor_score: 3.00, evaluator_score: 3.10 }
              as: HrAdmin
              captures: { cal1_id: $.data.id }
            - call: "POST /calibration-reviews/${cal1_id}/decide"
              payload: { policy_id: "${pol_id}" }
              as: HrAdmin
            - call: "POST /evaluation-cycles"
              payload: { educator_id: "${edu_id}", policy_id: "${pol_id}", school_year: "2026-2027", cycle_type: "COMPREHENSIVE" }
              as: HrAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /observations"
              payload: { cycle_id: "${cyc_id}", evaluator_id: "${ev_id}", observation_type: "FORMAL", scheduled_start: "2026-09-10T09:00:00Z", scheduled_end: "2026-09-10T10:00:00Z", announced: true }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { obs1_id: $.data.id }
            - call: "POST /observations/${obs1_id}/conduct"
              payload: {}
              as: Evaluator
              as_user_id: "${ev_id}"
          trigger:
            - call: "POST /observations/${obs1_id}/evidence-artifacts"
              payload: { artifact_type: "LESSON_PLAN", title: "Unit 3 plan" }
              as: Evaluator
              as_user_id: "${ev_id}"
              captures: { art1_id: $.data.id }
            - call: "POST /observations/${obs1_id}/evidence-artifacts"
              payload: { artifact_type: "STUDENT_WORK", title: "Exit tickets" }
              as: Teacher
              as_user_id: "${edu_id}"
              captures: { art2_id: $.data.id }
            - call: "POST /evidence-artifacts/${art1_id}/withdraw"
              payload: {}
              as: Evaluator
              as_user_id: "${ev_id}"
            - call: "POST /evidence-artifacts/${art2_id}/withdraw"
              payload: {}
              as: Teacher
              as_user_id: "${edu_id}"
          assert:
            - "Before the trigger, Observation.${obs1_id}.evidence_count == 0 and EvaluationCycle.${cyc_id}.evidence_artifact_count == 0"
            - "After both attaches, Observation.${obs1_id}.evidence_count == 2"
            - "After both attaches, EvaluationCycle.${cyc_id}.evidence_artifact_count == 2"
            - "EvidenceArtifact.${art1_id}.submitted_by_role == EVALUATOR"
            - "EvidenceArtifact.${art2_id}.submitted_by_role == TEACHER"
            - "After the first withdrawal, Observation.${obs1_id}.evidence_count == 1 and EvaluationCycle.${cyc_id}.evidence_artifact_count == 1"
            - "After both withdrawals, Observation.${obs1_id}.evidence_count == 0"
            - "After both withdrawals, EvaluationCycle.${cyc_id}.evidence_artifact_count == 0"
            - "EvidenceArtifact.${art1_id}.status == WITHDRAWN and EvidenceArtifact.${art2_id}.status == WITHDRAWN"
            - "Observation.${obs1_id}.status == CONDUCTED (the evidence ledger movement does not change the observation state)"
