  # =====================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: risk_heat_bucket_boundary_30_vs_31_days
        grounds:
          - calculations.block_risk_heat
          - entities.Block.fields.risk_heat_score
        distinguishing_aspect: |
          Numeric threshold boundary on the 30-day decay bucket (age_days <= 30
          inclusive): two severity-2 CORROBORATED reports occurred exactly 30 and
          31 days before the clock contribute 2*1.0 = 2.0 and 2*0.5 = 1.0
          respectively, so the block heat is exactly 3.0 — an off-by-one on the
          bucket edge (>= vs >) flips the total to 4.0 or 2.0.
        test_recipe:
          setup:
            - "Clock 2026-08-31T00:00:00Z. Group with 1 REGISTERED block, 1 ACTIVE member, ACTIVE agreement."
            - "R_a occurred 2026-08-01T00:00:00Z (age exactly 30 days), severity 2, CORROBORATED."
            - "R_b occurred 2026-07-31T00:00:00Z (age exactly 31 days), severity 2, CORROBORATED."
          setup_api_calls:
            - call: "POST /watch/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: ProgramCoordinator
            - call: "POST /watch/watch-groups"
              payload: { name: "Edge Watch", precinct_code: "PCT11" }
              as: ProgramCoordinator
              captures: { wg: $.data.id }
