            - { call: "POST /make-good-credits/${mg_id}/transition", payload: { action: "APPROVE", approved_amount_cents: 187500 }, as: ActivationManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN with http 403 (credit approval is FinanceManager-exclusive)"
            - "MakeGoodCredit.${mg_id}.credit_status == REQUESTED (unchanged)"

      - name: finance_manager_cannot_drive_contract_pipeline
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "FinanceManager reads everything but cannot move the sales pipeline: POST /contracts/{id}/transition fails ERR_FORBIDDEN."
        test_recipe:
          setup: ["Venue V; ACTIVE sponsor S; DRAFT contract C"]
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Naming", term_first_season: 2026, term_last_season: 2028, base_fee_cents: 10000000, escalator_pct: 0, escalator_mode: "SIMPLE" }, as: SponsorshipSales, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: FinanceManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN with http 403"

      - name: sponsor_contact_scoped_reads_hide_other_sponsors
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "SponsorContact reads are scoped: fetching another sponsor's contract by id fails ERR_FORBIDDEN, and the contracts list filters to sponsor_id == X-User-ID."
        test_recipe:
          setup: ["Venue V; ACTIVE sponsors S1, S2; contract C1 for S1 (DRAFT), contract C2 for S2 (DRAFT)"]
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp1_id: $.data.id } }
            - { call: "POST /sponsors/${sp1_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /sponsors", payload: { legal_name: "SparkWater Inc", display_name: "SparkWater", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp2_id: $.data.id } }
            - { call: "POST /sponsors/${sp2_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp1_id}", title: "C1", term_first_season: 2026, term_last_season: 2028, base_fee_cents: 10000000, escalator_pct: 0, escalator_mode: "SIMPLE" }, as: SponsorshipSales, captures: { c1_id: $.data.id } }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp2_id}", title: "C2", term_first_season: 2026, term_last_season: 2028, base_fee_cents: 2000000, escalator_pct: 0, escalator_mode: "SIMPLE" }, as: SponsorshipSales, captures: { c2_id: $.data.id } }
          trigger:
            - { call: "GET /contracts/${c1_id}", as: SponsorContact, as_user_id: "${sp2_id}", captures: { err: $.data.error_id } }
            - { call: "GET /contracts", payload: {}, as: SponsorContact, as_user_id: "${sp2_id}", captures: { only_id: "$.data[0].id" } }
          assert:
            - "err == ERR_FORBIDDEN with http 403 (S2 reading S1's contract)"
            - "List as S2 returns exactly 1 row and only_id == ${c2_id}"

  # ===========================================================================
  # Section: cross-cutting complexity layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_version_increments_on_each_write
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[contract-countersign-stale-version]", entities.SponsorshipContract]
        distinguishing_aspect: "Contract.version starts at 1 and increments by exactly 1 on every mutation: create 1 -> PROPOSE 2 -> REVISE 3 -> PATCH 4 -> PROPOSE 5 -> countersign 6."
        test_recipe:
          setup: ["Venue V; ACTIVE sponsor S"]
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
          trigger:
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Naming", term_first_season: 2026, term_last_season: 2028, base_fee_cents: 10000000, escalator_pct: 0.03, escalator_mode: "COMPOUND" }, as: SponsorshipSales, captures: { c_id: $.data.id, v1: $.data.version } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { v2: $.data.version } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "REVISE" }, as: SponsorshipSales, captures: { v3: $.data.version } }
            - { call: "PATCH /contracts/${c_id}", payload: { title: "Naming v2" }, as: SponsorshipSales, captures: { v4: $.data.version } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { v5: $.data.version } }
            - { call: "POST /contracts/${c_id}/countersign", payload: { expected_contract_version: "${v5}" }, as: SponsorContact, as_user_id: "${sp_id}", captures: { v6: $.data.version } }
          assert:
            - "v1 == 1 and v2 == 2 and v3 == 3 and v4 == 4 and v5 == 5 and v6 == 6 (exact +1 per mutation, including PATCH and countersign)"

      - name: reject_evidence_leaves_approved_units_unchanged
        claim_type: derived_field_reconciliation
        grounds: [calculations.delivered_value, entities.Deliverable.fields.approved_units]
        distinguishing_aspect: "approved_units derives from APPROVED evidence only: a REJECTED submission contributes nothing, and a later RESUBMIT + APPROVE accrues exactly its units_claimed."
        test_recipe:
          setup: ["Venue V (2026); ACTIVE sponsor S; ACTIVE contract C; asset LED; D contracted 10 IN_PROGRESS"]
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /assets", payload: { venue_id: "${v_id}", name: "Bowl LED Ribbon", asset_class: "SIGNAGE", rate_card_unit_cents: 50000, avg_impressions_per_unit: 120000, cpm_cents: 2500 }, as: VenueAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Naming", term_first_season: 2026, term_last_season: 2026, base_fee_cents: 10000000, escalator_pct: 0, escalator_mode: "SIMPLE" }, as: SponsorshipSales, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c_v: $.data.version } }
            - { call: "POST /contracts/${c_id}/countersign", payload: { expected_contract_version: "${c_v}" }, as: SponsorContact, as_user_id: "${sp_id}" }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "ACTIVATE" }, as: SponsorshipSales }
            - { call: "POST /deliverables", payload: { contract_id: "${c_id}", asset_id: "${a_id}", season: 2026, unit_kind: "GAME_DISPLAY", contracted_units: 10 }, as: ActivationManager, captures: { d_id: $.data.id } }
            - { call: "POST /evidence-submissions", payload: { deliverable_id: "${d_id}", units_claimed: 5, evidence_uri: "s3://pop/v1.pdf" }, as: ActivationManager, as_user_id: "am-1", captures: { e_id: $.data.id } }
          trigger:
            - { call: "POST /evidence-submissions/${e_id}/transition", payload: { action: "REJECT", review_note: "wrong game" }, as: ActivationManager, as_user_id: "am-2" }
            - { call: "GET /deliverables/${d_id}", as: ActivationManager, captures: { units_mid: $.data.approved_units } }
            - { call: "POST /evidence-submissions/${e_id}/transition", payload: { action: "RESUBMIT", evidence_uri: "s3://pop/v2.pdf" }, as: ActivationManager, as_user_id: "am-2" }
            - { call: "POST /evidence-submissions/${e_id}/transition", payload: { action: "APPROVE" }, as: ActivationManager, as_user_id: "am-1" }
            - { call: "GET /deliverables/${d_id}", as: ActivationManager, captures: { units_end: $.data.approved_units } }
          assert:
            - "units_mid == 0 (REJECT accrues nothing)"
            - "units_end == 5 (accrual happens exactly once, at APPROVE)"

      - name: cascade_depth_coverage_excluded
        claim_type: n_level_chain
        grounds: [state_machines.SponsorAccount.ACTIVE_to_BLOCKED, state_machines.Deliverable.IN_PROGRESS_to_MISSED]
        excluded_because:
          difficulty_instance: sponsor_block_three_hop_termination
          rationale: "The 3-hop sponsor-block cascade and the 2-hop advance-season auto-credit cascade are asserted end-to-end by §1.8 transitive_cascade instances sponsor_block_three_hop_termination and advance_season_missed_deliverable_auto_credit."

      - name: threshold_boundary_coverage_excluded
        claim_type: rate_threshold_boundary
        grounds: [calculations.make_good_credit, state_machines.Invoice.PARTIALLY_PAID_to_PAID]
        excluded_because:
          difficulty_instance: evidence_exact_units_fulfills_deliverable
          rationale: "Boundary precision (>= vs >) is asserted by §1.8 boundary_precision_check instances evidence_exact_units_fulfills_deliverable and payment_exact_balance_marks_paid, and tier boundaries 0.90/0.70 by make_good_tier_multiplier_with_season_cap."

  # ===========================================================================
  # Section: consistency model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_visibility
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "All mutations are atomic in-request: the response to POST /assets carries the stored row, and a following GET returns identical field values with no reconciliation lag."
        test_recipe:
          setup: ["Venue V"]
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
          trigger:
            - { call: "POST /assets", payload: { venue_id: "${v_id}", name: "Bowl LED Ribbon", asset_class: "SIGNAGE", rate_card_unit_cents: 50000, avg_impressions_per_unit: 120000, cpm_cents: 2500 }, as: VenueAdmin, captures: { a_id: $.data.id, a_rate: $.data.rate_card_unit_cents } }
            - { call: "GET /assets/${a_id}", as: VenueAdmin, captures: { g_rate: $.data.rate_card_unit_cents, g_status: $.data.asset_status } }
          assert:
            - "a_rate == 50000 and g_rate == 50000 — write is visible in the very next request"
            - "g_status == AVAILABLE (system default applied at creation)"