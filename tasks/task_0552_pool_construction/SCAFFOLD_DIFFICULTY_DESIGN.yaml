  - rule_id: priority_pair_validation_conflict
    instances:
      - name: fund_state_beats_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=15]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_DRAW_EXCEEDS_CONTRACT]
        distinguishing_aspect: |
          One FUND request violates BOTH a state rule (draw still REQUESTED, priority 5) AND a
          business_fiscal rule (net 90000 > amount_remaining 50000, priority 15); the server returns
          ERR_INVALID_STATE, proving the state category outranks the business_fiscal category.
        test_recipe:
          setup:
            - "Permitted project (contract 50000); EXCAVATION gate budget 100000, PASSED; a draw requested 100000 left in REQUESTED (not approved)."
          setup_api_calls:
            - { call: "POST /pool-build/pool-projects", payload: { owner_name: "Homeowner", owner_user_id: "owner-1", site_address: "1 Pool Ln", contract_price_cents: 50000, pool_gallons: 20000 }, as: BuilderPM, captures: { pp_id: $.data.id } }
            - { call: "POST /pool-build/design-plans", payload: { pool_project_id: "${pp_id}", length_ft: 30, width_ft: 15, avg_depth_ft: 5 }, as: Designer, captures: { dp_id: $.data.id } }
