    code: 200
    input: ["show_id?", "limit?", "offset?"]
    output: "MarketingSpend[]"
    side_effects: []

  - method: GET
    path: "/tours/settlements/{settlementId}"
    description: "Flat fetch of a Settlement by id"
    roles: [TourManager, Promoter, VenueRep, SettlementAccountant]
