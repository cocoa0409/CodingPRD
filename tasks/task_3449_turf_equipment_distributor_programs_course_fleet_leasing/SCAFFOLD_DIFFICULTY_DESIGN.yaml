              captures: { ap1: $.data.id }
          trigger:
            - call: "POST /turf/appraisals/${ap1}/transition"
              payload: { to: "DISPUTED" }
              as: CourseManager
              as_user_id: "${c1}"
            - call: "POST /turf/appraisals/${ap1}/transition"
