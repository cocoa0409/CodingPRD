    code: 200
    input: []
    output: ColorChange
    side_effects: ["sets Furnace.current_color to to_color", "charges transition_loss_tons to the furnace's ACTIVE or WIND_DOWN campaign melt ledger", "increments Furnace.version by 1"]
  - method: POST
    path: "/glass-plant/color-changes/{color_change_id}/abort"
    description: "Abandon a planned colour transition"
    roles: [BatchHouseTech]
    code: 200
    input: ["reason?"]
    output: ColorChange
    side_effects: ["leaves Furnace.current_color unchanged"]

  - method: POST
    path: "/glass-plant/forming-machines"
    description: "Register a forming machine on a furnace"
    roles: [PlantManager]
    code: 201
    input: [furnace_id, code, section_count, max_cavities, primary_mold_family, "changeover_buffer_minutes?"]
