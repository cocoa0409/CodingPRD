  - rule_id: boundary_precision_check
    instances:

      - name: wet_bulb_at_exactly_27_0_starts_session_and_27_1_rejects
        grounds:
          - calculations.snowmaking_wet_bulb_yield
          - validations[priority=34]
          - errors[ERR_WET_BULB_TOO_WARM]
          - entities.SnowmakingSession.fields.wet_bulb_f
          - entities.SnowmakingSession.fields.snow_yield_factor
          - entities.DayPlan.fields.wet_bulb_f
        distinguishing_aspect: |
          The metric is temperature at one tenth of a degree Fahrenheit, tested across the exact
          WET_BULB_MAX_F edge through POST /mountain-ops/snowmaking-sessions/{id}/status. The band test is
          strict-greater, so 27.0 is admissible and lands in the coldest failing band (YIELD_MARGINAL 0.6)
          while 27.1 - one tenth warmer, the smallest representable step at the declared precision - is
          rejected. The two attempts differ only in the day plan's wet_bulb_f, and the second attempt is a
          SCHEDULED sibling on the same area and pump house, so nothing but the boundary can explain the
          divergence. An implementation using >= for the cap rejects both; one that rounds the reported
          wet bulb to whole degrees accepts both.
        test_recipe:
          setup:
            - "Open-mountain bootstrap with the published day plan carrying wet_bulb_f 27.0 and wind_speed_mph 10.0."
            - "Pump house PH1 ONLINE, max_gpm 2400. Two SCHEDULED sessions on T1/PH1 at 600 gpm each with touching, non-overlapping windows: session A [05:00, 08:00) and session B [08:00, 11:00), so neither supersedes the other and the pump peak stays 600."
            - "The clock is moved to 2026-08-01T05:00:00Z and session A is started while wet_bulb_f is still exactly 27.0."
            - "A second weather reading then sets wet_bulb_f to 27.1 with the wind unchanged at 10.0, so no lift or terrain state moves."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
