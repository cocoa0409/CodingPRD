# =============================================================================
# §1.9 Scaffold Corner Design — task_2287 Employer-Sponsored Backup Child Care
#
# Breadth probe over the nine sections of references/claim-extraction-guide.md,
# audited against SCAFFOLD.yaml §1.1-§1.7. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an `excluded_because:` stub and no
# `test_recipe:`. Every instance name is unique across BOTH design files.
#
# Logical clock default: 2026-08-01T00:00:00Z (set explicitly in every recipe).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: corner_provider_creation_returns_pending_network_status
        claim_type: Creation
        grounds:
          - endpoints[POST /backup-care/providers]
          - entities.Provider.fields.network_status
          - entities.Provider.fields.quality_score
        distinguishing_aspect: "POST /backup-care/providers with every required input present returns HTTP 201 and a row whose system/computed fields are seeded exactly: network_status PENDING, quality_score 100, lifetime_quality_score 100, completed_reservation_count 0."
        test_recipe:
          setup:
            - "Empty database; logical clock set to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /backup-care/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: network_admin
              as_user_id: "u_na_1"
          trigger:
            - call: "POST /backup-care/providers"
              payload: { provider_name: "Cornerstone Kids Center", owner_user_id: "u_pm_cs", care_mode: "CENTER_BASED", market_code: "MKT-AUS", postal_code: "78701", daily_capacity_slots: 8, max_concurrent_assignments: 1, same_day_available: true }
              as: network_admin
              as_user_id: "u_na_1"
              captures: { prov_id: $.data.id, ns: $.data.network_status, q: $.data.quality_score, lq: $.data.lifetime_quality_score, crc: $.data.completed_reservation_count, ver: $.data.version }
          assert:
            - "The call returns HTTP 201"
            - "${ns} == PENDING"
            - "${q} == 100 and ${lq} == 100"
            - "${crc} == 0"
            - "${ver} == 1"
            - "Provider.${prov_id}.provider_name == 'Cornerstone Kids Center' and Provider.${prov_id}.care_mode == CENTER_BASED and Provider.${prov_id}.market_code == 'MKT-AUS'"
            - "Provider.${prov_id}.daily_capacity_slots == 8 and Provider.${prov_id}.max_concurrent_assignments == 1 and Provider.${prov_id}.same_day_available == true"

      - name: corner_employer_retrieval_returns_stored_row
        claim_type: Retrieval
        grounds:
          - endpoints[GET /backup-care/employers/{id}]
          - entities.Employer.fields.admin_fee_pct
        distinguishing_aspect: "GET /backup-care/employers/{id} returns the identical field values that POST /backup-care/employers persisted, including the non-default admin_fee_pct 0.1200 and adult_elder_extension_enabled true."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one Employer created with admin_fee_pct 0.1200, invoicing_cycle QUARTERLY and adult_elder_extension_enabled true."
          setup_api_calls:
            - call: "POST /backup-care/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/employers"
              payload: { name: "Retrieval Rail Group", industry_code: "RAIL", contract_status: "ACTIVE", invoicing_cycle: "QUARTERLY", admin_fee_pct: 0.12, overage_billing_enabled: true, adult_elder_extension_enabled: true }
              as: network_admin
              as_user_id: "u_na_1"
              captures: { emp_id: $.data.id }
          trigger:
            - call: "GET /backup-care/employers/${emp_id}"
              payload: {}
              as: benefits_admin
              as_user_id: "u_ba_1"
              captures: { got_name: $.data.name, got_fee: $.data.admin_fee_pct, got_cycle: $.data.invoicing_cycle, got_ext: $.data.adult_elder_extension_enabled, got_ytd: $.data.ytd_billed_cents }
          assert:
            - "The call returns HTTP 200"
            - "${got_name} == 'Retrieval Rail Group'"
            - "${got_fee} == 0.12"
            - "${got_cycle} == QUARTERLY"
            - "${got_ext} == true"
            - "${got_ytd} == 0"
            - "The response body carries meta.api_request_id and meta.api_request_timestamp and response_type == 'object' per the §1.0 envelope"

      - name: corner_provider_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /backup-care/providers]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With exactly 3 Provider rows, GET /backup-care/providers?limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; exactly three Providers exist, created in a pinned order."
          setup_api_calls:
            - call: "POST /backup-care/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/providers"
              payload: { provider_name: "Page One Center", owner_user_id: "u_pm_p1", care_mode: "CENTER_BASED", market_code: "MKT-LAX", postal_code: "90001", daily_capacity_slots: 4, max_concurrent_assignments: 1, same_day_available: true }
              as: network_admin
              as_user_id: "u_na_1"
              captures: { p1_id: $.data.id }
            - call: "POST /backup-care/providers"
              payload: { provider_name: "Page Two Center", owner_user_id: "u_pm_p2", care_mode: "IN_HOME", market_code: "MKT-LAX", postal_code: "90002", daily_capacity_slots: 2, max_concurrent_assignments: 1, same_day_available: false }
              as: network_admin
              as_user_id: "u_na_1"
              captures: { p2_id: $.data.id }
            - call: "POST /backup-care/providers"
              payload: { provider_name: "Page Three Center", owner_user_id: "u_pm_p3", care_mode: "CENTER_BASED", market_code: "MKT-SFO", postal_code: "94102", daily_capacity_slots: 6, max_concurrent_assignments: 1, same_day_available: true }
              as: network_admin
              as_user_id: "u_na_1"
              captures: { p3_id: $.data.id }
          trigger:
            - call: "GET /backup-care/providers"
              payload: { limit: 2, offset: 0 }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "GET /backup-care/providers"
              payload: { limit: 2, offset: 2 }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "GET /backup-care/providers"
              payload: { market_code: "MKT-LAX", limit: 10, offset: 0 }
              as: network_admin
              as_user_id: "u_na_1"
          assert:
            - "The first call returns HTTP 200 with exactly 2 rows, total_count == 3, has_more == true, limit == 2 and offset == 0"
            - "The second call returns exactly 1 row, total_count == 3 and has_more == false"
            - "The third call returns exactly 2 rows (${p1_id} and ${p2_id}) with total_count == 2, proving the filter is applied before pagination"
            - "response_type == 'array' on all three responses"

      - name: corner_reservation_not_found_returns_404
        claim_type: Not Found
        grounds:
          - endpoints[GET /backup-care/reservations/{id}]
          - validations[priority=300]
          - errors[ERR_RESERVATION_NOT_FOUND]
        distinguishing_aspect: "GET /backup-care/reservations/{id} with a syntactically valid UUID that matches no row returns ERR_RESERVATION_NOT_FOUND with HTTP 404, not an empty 200."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no Reservation rows exist."
          setup_api_calls:
            - call: "POST /backup-care/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: network_admin
              as_user_id: "u_na_1"
          trigger:
            - call: "GET /backup-care/reservations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: care_coordinator
              as_user_id: "u_cc_1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_RESERVATION_NOT_FOUND"
            - "The call returns HTTP 404"
            - "response_type == 'error' and data.message is a non-empty string"

      - name: corner_employer_create_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - endpoints[POST /backup-care/employers]
          - validations[priority=100]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /backup-care/employers omitting the required industry_code returns ERR_INVALID_REQUEST with HTTP 400 and persists no Employer row, even though every other field is present and valid."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no Employer rows exist."
          setup_api_calls:
            - call: "POST /backup-care/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: network_admin
              as_user_id: "u_na_1"
          trigger:
            - call: "POST /backup-care/employers"
              payload: { name: "Missing Field Mills", contract_status: "ACTIVE", admin_fee_pct: 0.085 }
              as: network_admin
              as_user_id: "u_na_1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "The call returns HTTP 400"
            - "GET /backup-care/employers?limit=10&offset=0 returns total_count == 0"

      - name: corner_optional_inputs_fall_back_to_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Employer.fields.admin_fee_pct
          - entities.Employer.fields.adult_elder_extension_enabled
          - entities.Dependent.fields.status
          - entities.Employee.fields.employment_status
        distinguishing_aspect: "Omitting every optional input applies the §1.1 defaults exactly: Employer.contract_status ACTIVE, fiscal_year_start_month 1, invoicing_cycle MONTHLY, admin_fee_pct 0.085, overage_billing_enabled true, adult_elder_extension_enabled false, Employee.employment_status ACTIVE, Dependent.status ACTIVE and Dependent.care_notes the empty string."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; an ACTIVE plan exists so an employee can be enrolled."
          setup_api_calls:
            - call: "POST /backup-care/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: network_admin
              as_user_id: "u_na_1"
          trigger:
            - call: "POST /backup-care/employers"
              payload: { name: "Default Dairy Co", industry_code: "DAIRY" }
              as: network_admin
              as_user_id: "u_na_1"
              captures: { emp_id: $.data.id, emp_v: $.data.version, cs: $.data.contract_status, fym: $.data.fiscal_year_start_month, cyc: $.data.invoicing_cycle, fee: $.data.admin_fee_pct, ovr: $.data.overage_billing_enabled, ext: $.data.adult_elder_extension_enabled }
            - call: "POST /backup-care/benefit-plans"
              payload: { employer_id: "${emp_id}", expected_employer_version: "${emp_v}", plan_code: "DEF-1", annual_use_limit_days: 10, copay_center_cents_per_day: 1500, copay_in_home_cents_per_hour: 400, eligible_dependent_types: ["CHILD"], overage_rate_center_cents_per_day: 20000, overage_rate_in_home_cents_per_hour: 3000, no_show_charge_cents: 12000, effective_from: "2026-01-01T00:00:00Z" }
              as: benefits_admin
              as_user_id: "u_ba_1"
              captures: { plan_id: $.data.id, min_hrs: $.data.in_home_min_billable_hours, max_dep: $.data.max_dependents_per_reservation, cwh: $.data.cancellation_window_hours, pstat: $.data.status }
            - call: "POST /backup-care/benefit-plans/${plan_id}/activate"
              payload: {}
              as: benefits_admin
              as_user_id: "u_ba_1"
            - call: "POST /backup-care/employees"
              payload: { employer_id: "${emp_id}", benefit_plan_id: "${plan_id}", employee_external_id: "D-1", user_id: "u_ee_d1", email: "d1@defaultdairy.test", full_name: "Ines Roth" }
              as: benefits_admin
              as_user_id: "u_ba_1"
              captures: { ee_id: $.data.id, empst: $.data.employment_status, elig: $.data.eligibility_status, used: $.data.entitlement_days_used, strikes: $.data.no_show_strike_count }
            - call: "POST /backup-care/employees/${ee_id}/dependents"
              payload: { full_name: "Otto Roth", dependent_type: "CHILD", date_of_birth: "2020-05-05", relationship: "SON" }
              as: benefits_admin
              as_user_id: "u_ba_1"
              captures: { dep_id: $.data.id, dstat: $.data.status, notes: $.data.care_notes }
          assert:
            - "${cs} == ACTIVE and ${fym} == 1 and ${cyc} == MONTHLY"
            - "${fee} == 0.085 and ${ovr} == true and ${ext} == false"
            - "${pstat} == DRAFT, the BenefitPlan initial_state"
            - "${min_hrs} == 4 and ${max_dep} == 3 and ${cwh} == 24, the §1.1 BenefitPlan defaults"
            - "${empst} == ACTIVE and ${elig} == ELIGIBLE and ${used} == 0 and ${strikes} == 0"
            - "${dstat} == ACTIVE and ${notes} == ''"
            - "Employee.${ee_id}.entitlement_days_reserved == 0 and Dependent.${dep_id}.employee_id == ${ee_id}"

      - name: corner_reservation_computed_fields_derive_from_inputs
        claim_type: Computed Fields
        grounds:
          - entities.Reservation.fields.care_date
          - entities.Reservation.fields.dependent_count
          - entities.Reservation.fields.required_seats
          - entities.Reservation.fields.cancellation_deadline_utc
          - entities.Reservation.fields.plan_version_pinned
        distinguishing_aspect: "A CENTER_BASED intake for 2026-08-14 09:00Z-15:00Z with two dependents derives care_date '2026-08-14', dependent_count 2, required_seats 2 and cancellation_deadline_utc 2026-08-13T09:00:00Z, and pins plan_version_pinned to the ACTIVE plan's version — none of which appear in the request payload."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Employer + ACTIVE plan with cancellation_window_hours 24, eligible_dependent_types [CHILD] and max_dependents_per_reservation 3."
            - "One employee with two ACTIVE CHILD dependents."
          setup_api_calls:
            - call: "POST /backup-care/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/employers"
              payload: { name: "Computed Ceramics", industry_code: "CERAMIC", contract_status: "ACTIVE", admin_fee_pct: 0.085, overage_billing_enabled: true, adult_elder_extension_enabled: false }
              as: network_admin
              as_user_id: "u_na_1"
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /backup-care/benefit-plans"
              payload: { employer_id: "${emp_id}", expected_employer_version: "${emp_v}", plan_code: "CMP-1", annual_use_limit_days: 10, copay_center_cents_per_day: 1500, copay_in_home_cents_per_hour: 400, in_home_min_billable_hours: 4, eligible_dependent_types: ["CHILD"], max_dependents_per_reservation: 3, overage_rate_center_cents_per_day: 20000, overage_rate_in_home_cents_per_hour: 3000, cancellation_window_hours: 24, no_show_charge_cents: 12000, effective_from: "2026-01-01T00:00:00Z" }
              as: benefits_admin
              as_user_id: "u_ba_1"
              captures: { plan_id: $.data.id }
            - call: "POST /backup-care/benefit-plans/${plan_id}/activate"
              payload: {}
              as: benefits_admin
              as_user_id: "u_ba_1"
              captures: { plan_v: $.data.version }
            - call: "POST /backup-care/employees"
              payload: { employer_id: "${emp_id}", benefit_plan_id: "${plan_id}", employee_external_id: "C-1", user_id: "u_ee_c1", email: "c1@ceramics.test", full_name: "Vera Klein", employment_status: "ACTIVE" }
              as: benefits_admin
              as_user_id: "u_ba_1"
              captures: { ee_id: $.data.id }
            - call: "POST /backup-care/employees/${ee_id}/dependents"
              payload: { full_name: "Jonas Klein", dependent_type: "CHILD", date_of_birth: "2019-06-06", relationship: "SON", status: "ACTIVE" }
              as: benefits_admin
              as_user_id: "u_ba_1"
              captures: { d1_id: $.data.id }
            - call: "POST /backup-care/employees/${ee_id}/dependents"
              payload: { full_name: "Marta Klein", dependent_type: "CHILD", date_of_birth: "2021-07-07", relationship: "DAUGHTER", status: "ACTIVE" }
              as: benefits_admin
              as_user_id: "u_ba_1"
              captures: { d2_id: $.data.id }
          trigger:
            - call: "POST /backup-care/reservations"
              payload: { employee_id: "${ee_id}", requested_care_mode: "CENTER_BASED", market_code: "MKT-PIT", care_start_utc: "2026-08-14T09:00:00Z", care_end_utc: "2026-08-14T15:00:00Z", dependent_ids: ["${d1_id}", "${d2_id}"] }
              as: care_coordinator
              as_user_id: "u_cc_1"
              captures: { res_id: $.data.id, cdate: $.data.care_date, dcount: $.data.dependent_count, seats: $.data.required_seats, deadline: $.data.cancellation_deadline_utc, pinned: $.data.plan_version_pinned, fs: $.data.fulfillment_status, bs: $.data.billing_status, bp: $.data.benefit_plan_id }
          assert:
            - "The call returns HTTP 201"
            - "${cdate} == 2026-08-14"
            - "${dcount} == 2"
            - "${seats} == 2"
            - "${deadline} == 2026-08-13T09:00:00Z"
            - "${pinned} == ${plan_v}"
            - "${bp} == ${plan_id}"
            - "${fs} == INTAKE and ${bs} == NOT_BILLABLE"
            - "Reservation.${res_id}.days_charged_provisional == 0 and Reservation.${res_id}.copay_cents == 0 and Reservation.${res_id}.penalty_cents == 0 before any confirm"
            - "Reservation.${res_id}.excluded_provider_ids == []"

      - name: corner_system_fields_stamp_version_one_and_clock_timestamps
        claim_type: System Fields
        grounds:
          - entities.Employer.fields.accrued_overage_cents_current_period
          - endpoints[POST /backup-care/employers]
          - endpoints[PATCH /backup-care/employers/{id}]
        distinguishing_aspect: "A freshly created Employer has version 1 with created_at == updated_at == the logical clock 2026-08-01T00:00:00Z; a PATCH at clock 2026-08-05T00:00:00Z bumps version to 2 and moves updated_at to 2026-08-05T00:00:00Z while created_at is unchanged."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one Employer created at that instant."
          setup_api_calls:
            - call: "POST /backup-care/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/employers"
              payload: { name: "System Stamp Steel", industry_code: "STEEL", contract_status: "ACTIVE", admin_fee_pct: 0.085, overage_billing_enabled: true, adult_elder_extension_enabled: false }
              as: network_admin
              as_user_id: "u_na_1"
              captures: { emp_id: $.data.id, v1: $.data.version, created1: $.data.created_at, updated1: $.data.updated_at, accrued1: $.data.accrued_overage_cents_current_period }
          trigger:
            - call: "POST /backup-care/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "PATCH /backup-care/employers/${emp_id}"
              payload: { admin_fee_pct: 0.0900 }
              as: benefits_admin
              as_user_id: "u_ba_1"
              captures: { v2: $.data.version, created2: $.data.created_at, updated2: $.data.updated_at, fee2: $.data.admin_fee_pct }
          assert:
            - "${v1} == 1"
            - "${created1} == 2026-08-01T00:00:00Z and ${updated1} == 2026-08-01T00:00:00Z"
            - "${accrued1} == 0"
            - "${v2} == 2"
            - "${created2} == ${created1}"
            - "${updated2} == 2026-08-05T00:00:00Z"
            - "${fee2} == 0.09"
            - "Employer.${emp_id}.id == ${emp_id} and is unchanged by the PATCH"

      - name: corner_type_constraint_violations_rejected_as_invalid_request
        claim_type: Type Constraints
        grounds:
          - validations[priority=100]
          - validations[priority=110]
          - validations[priority=115]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_INVALID_WINDOW]
        distinguishing_aspect: "Three distinct constraint families are enforced on input: an out-of-set enum (care_mode 'HYBRID') and an out-of-range decimal (admin_fee_pct 0.9 against the [0, 0.5] ceiling) both return ERR_INVALID_REQUEST 400, while a capacity block whose end_time_utc is not strictly after start_time_utc returns ERR_INVALID_WINDOW 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one CREDENTIALED-irrelevant Provider exists so the block endpoint has a valid parent."
          setup_api_calls:
            - call: "POST /backup-care/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: network_admin
              as_user_id: "u_na_1"
            - call: "POST /backup-care/providers"
              payload: { provider_name: "Constraint Care Center", owner_user_id: "u_pm_cc", care_mode: "CENTER_BASED", market_code: "MKT-BNA", postal_code: "37201", daily_capacity_slots: 4, max_concurrent_assignments: 1, same_day_available: true }
              as: network_admin
              as_user_id: "u_na_1"
              captures: { prov_id: $.data.id }
          trigger:
            - call: "POST /backup-care/providers"
              payload: { provider_name: "Hybrid Bad Enum", owner_user_id: "u_pm_hb", care_mode: "HYBRID", market_code: "MKT-BNA", postal_code: "37202", daily_capacity_slots: 4, max_concurrent_assignments: 1, same_day_available: true }
              as: network_admin
              as_user_id: "u_na_1"
              captures: { err_enum: $.data.error_id }
            - call: "POST /backup-care/employers"
              payload: { name: "Overfee Outfitters", industry_code: "RETAIL", contract_status: "ACTIVE", admin_fee_pct: 0.9 }
              as: network_admin
              as_user_id: "u_na_1"
              captures: { err_range: $.data.error_id }
            - call: "POST /backup-care/providers/${prov_id}/capacity-blocks"
              payload: { start_time_utc: "2026-08-10T12:00:00Z", end_time_utc: "2026-08-10T12:00:00Z", total_slots: 4 }
              as: network_admin
              as_user_id: "u_na_1"
              captures: { err_window: $.data.error_id }
          assert:
            - "${err_enum} == ERR_INVALID_REQUEST with HTTP 400"
            - "${err_range} == ERR_INVALID_REQUEST with HTTP 400"
            - "${err_window} == ERR_INVALID_WINDOW with HTTP 400"
            - "GET /backup-care/providers?limit=10&offset=0 returns total_count == 1, so neither rejected write persisted"
            - "GET /backup-care/providers/${prov_id}/capacity-blocks?limit=10&offset=0 returns total_count == 0"

      - name: corner_usage_ledger_entry_is_immutable_and_versionless
        claim_type: Immutability
        grounds:
          - entities.UsageLedgerEntry
          - entities.InvoiceLine
          - endpoints[GET /backup-care/reservations/{id}/ledger-entries]
