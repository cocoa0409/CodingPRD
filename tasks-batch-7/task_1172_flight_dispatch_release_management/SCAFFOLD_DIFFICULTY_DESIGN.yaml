            - { call: "POST /dispatch/aircraft", payload: { tail_no: "N100AA", type_code: "A320", oew_kg: 42000, mzfw_kg: 61000, mtow_kg: 73500, mlw_kg: 64500, fuel_capacity_kg: 19000, cruise_tas_kts: 450, burn_kg_per_hour: 2600, min_runway_m: 1800, lemac_m: 17.0, mac_m: 4.0 }, as: DispatchSupervisor, captures: { ac1: $.data.id } }
            - { call: "POST /dispatch/dispatchers", payload: { name: "Dana One", license_no: "D001", max_active_legs: 6 }, as: DispatchSupervisor, captures: { d1: $.data.id } }
            - { call: "POST /dispatch/captains", payload: { name: "Cole One", license_no: "C001", qualified_type_codes: ["A320"] }, as: DispatchSupervisor, captures: { c1: $.data.id } }
            - { call: "POST /dispatch/legs", payload: { flight_no: "FD190", dep_station_id: "${sta}", arr_station_id: "${stb}", aircraft_id: "${ac1}", captain_id: "${c1}", distance_nm: 1200, sched_dep_utc: "2026-05-01T10:00:00Z", sched_arr_utc: "2026-05-01T12:30:00Z", dispatcher_id: "${d1}" }, as: Dispatcher, as_user_id: "${d1}", captures: { leg1: $.data.id, leg1_v: $.data.version } }
            - { call: "POST /dispatch/plans", payload: { leg_id: "${leg1}", route_code: "DCT KLOSE DCT", cruise_altitude_ft: 35000, forecast_wind_kts: 30, wind_assumption: "FORECAST", expected_leg_version: "${leg1_v}" }, as: Dispatcher, as_user_id: "${d1}", captures: { plan1: $.data.id, plan1_status: $.data.status } }
          trigger:
