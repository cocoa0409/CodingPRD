      - name: c_val_missing_auth_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "Missing X-User-Role/X-User-ID headers on any endpoint -> 401 ERR_UNAUTHENTICATED, ahead of role, existence, and state checks."
        test_recipe:
          setup: ["one complaint exists"]
          setup_api_calls:
            - call: "POST /consumer-protection/consumers"
              payload: { full_name: "AU", email: "au@x.com", state_code: "OR" }
              as: Anonymous
              captures: { con: $.data.id }
            - call: "POST /consumer-protection/businesses"
              payload: { legal_name: "AuCo", home_state: "OR", operates_in_states: ["OR"], naics_code: "454110" }
              as: Anonymous
              captures: { biz: $.data.id }
            - call: "POST /consumer-protection/complaints"
              payload: { consumer_id: "${con}", business_id: "${biz}", incident_date: "2026-07-01", incident_state: "OR", category: "OTHER", description: "au", amount_in_dispute_cents: 5 }
              as: Consumer
              as_user_id: "${con}"
              captures: { k: $.data.id }
          trigger:
            - call: "POST /consumer-protection/complaints/${k}/screen"
              payload: { decision: "ACCEPT" }
              captures: { e: $.data.error_id }
          assert:
            - "${e} == ERR_UNAUTHENTICATED (HTTP 401; no role headers presented)"
      - name: c_val_role_forbidden_for_consumer_screen
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "Consumer role is not in screen's roles [IntakeOfficer] -> 403 ERR_FORBIDDEN even when the consumer owns the complaint."
        test_recipe:
          setup: ["one complaint in RECEIVED owned by the caller consumer"]
          setup_api_calls:
            - call: "POST /consumer-protection/consumers"
              payload: { full_name: "RB", email: "rb@x.com", state_code: "OR" }
              as: Anonymous
              captures: { con: $.data.id }
            - call: "POST /consumer-protection/businesses"
              payload: { legal_name: "RbCo", home_state: "OR", operates_in_states: ["OR"], naics_code: "454110" }
              as: Anonymous
