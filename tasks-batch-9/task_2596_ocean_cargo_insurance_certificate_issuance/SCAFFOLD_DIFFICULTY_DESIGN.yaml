              as: Underwriter
              captures: { cc_id: $.data.id }
            - call: "POST /surveyors"
              payload: { name: "Rotterdam Marine Surveys BV", panel_code: "PNL-NL-01", base_port_id: "${port_disch_id}", certified_commodity_ratings: ["S2", "S3"], travel_buffer_minutes: 45 }
              as: ComplianceOfficer
