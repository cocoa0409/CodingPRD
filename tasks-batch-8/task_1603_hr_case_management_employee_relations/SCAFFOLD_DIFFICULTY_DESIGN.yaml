              captures: { ev1: $.data.id }
            - call: "POST /er/evidence-items/${ev1}/begin-review"
              payload: {}
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/evidence-items/${ev1}/admit"
              payload: { weight: 0.8 }
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/cases/${c1}/credibility-assessments"
              payload: { subject_employee_id: "${sub}", corroboration_count: 4, contradiction_count: 0, account_age_days: 2 }
              as: Investigator
              as_user_id: "${inv1}"
            - call: "POST /er/cases/${c1}/findings"
              payload: { rationale_text: "Priority case finding: the evidence and interview establish the conduct on the balance of probabilities." }
              as: Investigator
              as_user_id: "${inv1}"
              captures: { f1: $.data.id }
            - call: "POST /er/findings/${f1}/substantiate"
              payload: { outcome: "SUBSTANTIATED" }
