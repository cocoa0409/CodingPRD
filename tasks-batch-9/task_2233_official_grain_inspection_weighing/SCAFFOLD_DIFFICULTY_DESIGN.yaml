  - rule_id: priority_pair_validation_conflict
    rule_summary: "Two validation rules of different priority are violated by one request; only the higher-priority error may surface."
    instances:
      - name: expired_instrument_state_check_outranks_portion_exhaustion_constraint
        mechanism: |
          The trigger violates §1.4 priority 9 (ERR_EQUIPMENT_NOT_APPROVED — the instrument expired when
          the clock advanced past certified_until) AND §1.4 priority 11
          (ERR_SAMPLE_PORTIONS_EXHAUSTED — the single portion was already consumed by grading). Only the
          priority-9 error may surface. The pairing is deliberately non-obvious because a naive
          implementation validates cheap in-row arithmetic (portion counts) before re-reading the
          equipment row.
        distinguishing_aspect: "Pairs a state-category rule against a business-constraint rule, both inside the business tiers; the sibling pairs concurrency against a temporal rule."
        entities_involved: [Equipment, Sample, GradingResult, InspectionRequest]
        grounds:
          - "validations[priority=9]"
          - "validations[priority=11]"
          - "errors[ERR_EQUIPMENT_NOT_APPROVED]"
          - "errors[ERR_SAMPLE_PORTIONS_EXHAUSTED]"
          - "state_machines.Equipment.approval_status.APPROVED_to_EXPIRED"
        test_recipe:
          setup:
            - "A PROTEIN_INSTRUMENT certified only until 2026-08-05T00:00:00Z and a sample split into exactly one portion."
            - "The single portion is already consumed by a FINAL grading result, so portions_available is 0 and integrity_status is CONSUMED."
            - "The logical clock has been advanced to 2026-08-06T09:00:00Z, driving the instrument to EXPIRED, so both the state rule and the portion rule are live on the same call."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Gulf Designated Office", state_code: "TX", authority_type: "DESIGNATED" }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/applicants
              as: ServiceAdmin
              payload: { name: "Delta River Elevator", account_code: "DRE-006", contact_email: "ops@delta.example" }
              captures: { app: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-6001", full_name: "P. Analyst", endorsements: ["SAMPLING", "GRADING", "PROTEIN"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp: "$.data.id" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "SAMPLING_DEVICE", asset_code: "PROBE-X1", model: "Diverter D2" }
              captures: { probe: "$.data.id" }
            - call: POST /grain-inspection/equipment/${probe}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "PROTEIN_INSTRUMENT", asset_code: "NIR-X1", model: "SpectraGrain 9" }
              captures: { nir: "$.data.id" }
            - call: POST /grain-inspection/equipment/${nir}/certify
              as: ServiceAdmin
              payload: { certified_until: "2026-08-05T00:00:00Z" }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "UNLOADING", lot_identifier: "LOT-PRI", declared_quantity_bushels: 4000, requested_services: ["GRADING", "PROTEIN"] }
              captures: { req: "$.data.id" }
            - call: POST /grain-inspection/samples
              as: LicensedInspector
              payload: { inspection_request_id: "${req}", sampling_device_id: "${probe}", inspector_id: "${insp}", seal_number: "SEAL-PRI", portions_count: 1 }
              captures: { smp: "$.data.id" }
            - call: POST /grain-inspection/grading-results
              as: LicensedInspector
              payload: { inspection_request_id: "${req}", sample_id: "${smp}", inspector_id: "${insp}", test_weight_lbs_per_bushel: 56.0, moisture_pct: 13.0, damaged_total_pct: 2.0, heat_damaged_pct: 0.1, foreign_material_pct: 1.5 }
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-06T09:00:00Z" }
          trigger:
            - call: POST /grain-inspection/protein-analyses
              as: LicensedInspector
              payload: { inspection_request_id: "${req}", sample_id: "${smp}", instrument_id: "${nir}", inspector_id: "${insp}", protein_pct_as_is: 34.60, instrument_moisture_pct: 12.80 }
              captures: { err: "$.data.error_id" }
          assert:
            - "409 ERR_EQUIPMENT_NOT_APPROVED — the priority 9 state check wins"
            - "The response is NOT ERR_SAMPLE_PORTIONS_EXHAUSTED (priority 11) even though portions_available is 0"
            - "GET /grain-inspection/equipment/${nir} -> approval_status == EXPIRED (the clock sweep at 2026-08-06T09:00:00Z passed certified_until 2026-08-05T00:00:00Z)"
            - "GET /grain-inspection/samples/${smp} -> portions_consumed == 1, portions_available == 0, integrity_status == CONSUMED (unchanged by the rejected call)"
            - "No ProteinAnalysis row was created: GET /grain-inspection/protein-analyses?inspection_request_id=${req} returns total_count 0"
        expected_failure_mode_if_naive: "Checking in-row portion arithmetic first returns 422 ERR_SAMPLE_PORTIONS_EXHAUSTED, which tells the office to draw a new sample when the real problem is an uncertified instrument."

      - name: stale_certificate_version_outranks_expired_appeal_window
        mechanism: |
          The trigger violates §1.4 priority 8 (ERR_CERTIFICATE_VERSION_CONFLICT — the caller echoes the
          version it read before a dismissal bumped the certificate) AND §1.4 priority 12
          (ERR_APPEAL_WINDOW_EXPIRED — the clock is 17 days past issuance, well beyond the 10-day APPEAL
          window). The OCC check must run first and return 412, because a 422 would tell the applicant
          their rights had lapsed when in truth their read was simply stale.
        distinguishing_aspect: "Pairs concurrency (412) against a temporal business rule (422) and asserts the HTTP status class, not just the code; the sibling pairs two 4xx business tiers."
        entities_involved: [Certificate, Appeal, Applicant]
        grounds:
          - "validations[priority=8]"
          - "validations[priority=12]"
          - "concurrency_rules[certificate_appeal_occ]"
          - "errors[ERR_CERTIFICATE_VERSION_CONFLICT]"
          - "errors[ERR_APPEAL_WINDOW_EXPIRED]"
        test_recipe:
          setup:
            - "A DELEGATED area with ACTIVE GRADING and APPEAL fee schedules and an ISSUED GRADE certificate of 10000 cents."
            - "The caller holds the certificate version captured at issuance; a REINSPECTION has since been filed and DISMISSED, bumping the certificate version."
            - "The logical clock stands at 2026-08-20T09:00:00Z, past the certificate appeal_deadline_at of 2026-08-13T09:00:00Z."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Plains Delegated Office", state_code: "KS", authority_type: "DELEGATED", fee_multiplier_bp: 10000, supervision_required: false }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules
              as: ServiceAdmin
              payload: { service_area_id: "${area}", service_class: "GRADING", base_fee_cents: 8000, per_thousand_bushel_rate_cents: 2000, minimum_fee_cents: 10000, effective_from: "2026-01-01T00:00:00Z" }
              captures: { fs_g: "$.data.id" }
