        test_recipe:
          setup:
            - "one carrier with a DRAFT HOUSEHOLD_GOODS application for TX/OK/NM without hazmat"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /carriers"
              payload: { legal_name: "Hill Country Household Movers LLC", domicile_state: "TX", self_reported_vehicle_count: 25, self_reported_driver_count: 30, self_reported_oos_rate_pct: 8.0 }
              as: RegistryAdmin
