  - name: grant_ledger_running_total_reconciles_after_a_reversal
    claim_type: aggregation
    grounds:
    - calculations.grant_ledger
    - entities.FunderGrant.fields.committed_cents
    excluded_because:
      difficulty_instance: compensating_invariant / grant_money_conservation_across_approve_then_void
      rationale: That §1.8 instance asserts the running ledger after the commitment and again after the void, checking
        authorized == available + committed + disbursed at both points, which is the add-then-reverse aggregation
        claim.
  - name: projected_variant_is_used_for_commitments_and_actual_for_disbursement
    claim_type: variant_selection
    grounds:
    - calculations.wage_subsidy_total.variants
    excluded_because:
      difficulty_instance: dual_variant_calc / projected_vs_actual_wage_subsidy_diverge_on_same_shift_set
      rationale: That §1.8 instance asserts which variant lands in committed_cents and which lands in disbursed_cents
        from a single shift set.
  - name: outcome_report_variants_diverge_on_the_same_placements
    claim_type: variant_divergence
    grounds:
    - calculations.grant_outcome_report.variants
    excluded_because:
      difficulty_instance: dual_variant_calc / outcome_report_cohort_vs_exit_based_denominators
      rationale: That §1.8 instance reads both variants over one placement set and asserts the differing denominators,
        rates and benchmark verdicts.
  - name: separation_reconciles_the_projected_commitment_into_a_disbursement
    claim_type: reconciliation
    grounds:
    - calculations.wage_subsidy_total.variants
    - calculations.grant_ledger
    excluded_because:
      difficulty_instance: transitive_cascade / separation_releases_subsidy_then_flips_posture_then_promotes_deferred
      rationale: That §1.8 instance asserts the delta applied to the ledger when the variant in force switches from
        PROJECTED to the frozen ACTUAL figure at separation.
  - name: doc_completeness_threshold_is_inclusive_at_eighty
    claim_type: threshold
    grounds:
    - calculations.doc_completeness_pct.constants
    - state_machines.Participant_stage.transitions.PRE_RELEASE_to_RELEASE_READY
    excluded_because:
      difficulty_instance: boundary_precision_check / doc_completeness_exactly_eighty_advances_release_ready
      rationale: That §1.8 instance sits on 60.0 (below), then exactly 80.0 (advances), which is the threshold-1 /
        threshold pair for this calculation.
- section: validations
  instances:
  - name: request_with_a_blank_x_user_id_header_is_unauthenticated
    claim_type: violation_to_error
    grounds:
    - validations[auth-header-present]
    - errors[ERR_UNAUTHENTICATED]
    distinguishing_aspect: The auth check runs at priority 1, before request-body shape and before path existence,
      so a blank X-User-ID on an otherwise perfect create must be 401 ERR_UNAUTHENTICATED — not 422 and not 403.
    test_recipe:
      setup:
      - empty database
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00.000Z'
        as: CaseManager
        as_user_id: cm-1
      trigger:
      - call: POST /participants
        payload:
          full_name: Marcus Reed
          facility_name: Northgate Correctional
          facility_state: OH
          expected_release_date: '2026-08-10'
          record_categories:
          - PROPERTY_OFFENSE
          required_document_types:
          - STATE_ID
          - SSN_CARD
          assigned_case_manager_user_id: cm-1
        as: CaseManager
        as_user_id: ''
        captures:
          err: $.data.error_id
      - call: GET /participants
        payload:
          limit: 10
          offset: 0
        as: CaseManager
        as_user_id: cm-1
      assert:
      - 'first trigger call: HTTP 401, data.error_id == "ERR_UNAUTHENTICATED"'
      - the X-User-ID header is sent as the empty string "", not omitted whitespace
      - 'second trigger call: total_count == 0 — nothing was created'
