      - name: inspection_responded_cannot_be_redrafted_or_double_closed
        claim_type: invalid_transition
        grounds:
          - "§1.2 state_machines.InspectionRequest OPEN -> RESPONSE_DRAFTED precondition 'status IN {OPEN, RESPONSE_DRAFTED}', RESPONDED -> CLOSED_SATISFIED / CLOSED_DEFICIENT preconditions, terminal_states [CLOSED_SATISFIED, CLOSED_DEFICIENT]"
          - "§1.6 ERR_INSPECTION_NOT_DRAFTABLE (409), ERR_INSPECTION_NOT_DRAFTED (409), ERR_INSPECTION_NOT_RESPONDED (409)"
          - "§1.3 calculations.inspection_completeness_score with INSPECTION_SATISFIED_MIN 100.00"
        distinguishing_aspect: "Once RESPONDED, the only legal move is close (the RESPONDED -> RESPONSE_DRAFTED edge is system-only, reachable solely through the plan-supersede cascade): draft-response is ERR_INSPECTION_NOT_DRAFTABLE, and after CLOSED_SATISFIED both close and draft-response are refused — while submit-response from OPEN is the different error ERR_INSPECTION_NOT_DRAFTED."
