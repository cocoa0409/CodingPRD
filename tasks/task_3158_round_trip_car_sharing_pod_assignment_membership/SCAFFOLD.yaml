    side_effects: ["MaintenanceOrder.status = CANCELLED", "Vehicle.use_status = AVAILABLE when reason == CUSTOMER_IMPACT", "recompute Pod.utilization_score and Pod.available_bays", "increments Vehicle.version by 1", "increments MaintenanceOrder.version by 1"]

  # ---- Access events ----
  - method: POST
