          A different metric (integer retention slots derived by ceil over a 50 g
          slot size) on a different endpoint (POST /retention-samples). A 120 g
          aliquot takes ceil(120/50) == 3 slots and a 50 g aliquot takes exactly 1,
          so occupancy reaches 4 == capacity_slots and is still admitted (the
          admission test is <=); the next 1 g aliquot needs a 5th slot and must be
