  - rule_id: resource_temporal_overlap
    instances:
      - name: seat_occupancy_preempts_term_interval_and_terminal_terms_are_ignored
        grounds:
          - validations[priority=66]
          - validations[priority=42]
          - state_machines.CommitteeSeat.VACANT_to_FILLED
          - state_machines.CommitteeSeat.FILLED_to_VACANT
          - entities.CommitteeMember.fields.term_start_date
          - entities.CommitteeMember.fields.term_end_date
          - entities.CommitteeMember.fields.status
          - entities.CommitteeSeat.fields.status
        distinguishing_aspect: |
          A CommitteeSeat is exclusive by occupancy, not by interval: a successor whose term starts a
          full quarter after the incumbent's term_end_date is still refused with ERR_SEAT_NOT_VACANT,
          while after end-term a successor whose term OVERLAPS the resigned member's closed interval is
          accepted, because priority 66 only looks at members in {APPOINTED, TRAINING_ASSIGNED,
          ACCEPTANCE_PENDING, ACTIVE}.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; Plan with max_voting_seats 2, quorum_min_voting_members 2, charter ADOPTED."
            - "Voting seat CHAIR (FILLED by Zia) and voting seat FIN-1 (FILLED by Abel with term 2026-01-01..2026-09-30, status APPOINTED)."
            - "One non-voting seat AUDIT-1 (seat_class INDEPENDENT) left VACANT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanSponsorAdmin
            - call: "POST /governance/plans"
              payload: { plan_name: "Saltmarsh 401(k)", plan_sponsor_name: "Saltmarsh Cannery", erisa_covered: true, participant_account_count: 60, menu_slot_capacity: 4, quorum_min_voting_members: 2, voting_threshold_pct: 0.6667, max_voting_seats: 2, notice_lead_days_required: 30, blackout_buffer_days: 3, fiscal_quarter_index: 0 }
              as: PlanSponsorAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /governance/committee-seats"
              payload: { plan_id: "${plan_id}", seat_code: "CHAIR", seat_class: "CHAIR", voting: true, seat_index: 1 }
              as: PlanSponsorAdmin
              captures: { seat_chair_id: $.data.id }
            - call: "POST /governance/committee-seats"
              payload: { plan_id: "${plan_id}", seat_code: "FIN-1", seat_class: "FINANCE", voting: true, seat_index: 2 }
              as: PlanSponsorAdmin
              captures: { seat_fin_id: $.data.id }
            - call: "POST /governance/committee-seats"
              payload: { plan_id: "${plan_id}", seat_code: "AUDIT-1", seat_class: "INDEPENDENT", voting: false, seat_index: 3 }
              as: PlanSponsorAdmin
              captures: { seat_audit_id: $.data.id }
            - call: "POST /governance/plans/${plan_id}/charter/adopt"
              payload: { quorum_min_voting_members: 2, voting_threshold_pct: 0.6667, max_voting_seats: 2, charter_doc_ref: "CHARTER-SM-V1" }
              as: PlanSponsorAdmin
            - call: "POST /governance/committee-members"
              payload: { seat_id: "${seat_chair_id}", member_name: "Zia Farrell", term_start_date: "2026-01-01", term_end_date: "2027-12-31", affiliated_provider_role: "NONE" }
              as: PlanSponsorAdmin
              captures: { chair_id: $.data.id }
            - call: "POST /governance/committee-members"
              payload: { seat_id: "${seat_fin_id}", member_name: "Abel Ngata", term_start_date: "2026-01-01", term_end_date: "2026-09-30", affiliated_provider_role: "NONE" }
              as: PlanSponsorAdmin
              captures: { abel_id: $.data.id }
          trigger:
            - call: "POST /governance/committee-members"
              payload: { seat_id: "${seat_fin_id}", member_name: "Bina Oyelaran", term_start_date: "2026-10-01", term_end_date: "2027-09-30", affiliated_provider_role: "NONE" }
              as: PlanSponsorAdmin
            - call: "POST /governance/committee-members"
              payload: { seat_id: "${seat_audit_id}", member_name: "Ciro Battaglia", term_start_date: "2026-01-01", term_end_date: "2026-09-30", affiliated_provider_role: "NONE" }
              as: PlanSponsorAdmin
              captures: { ciro_id: $.data.id }
            - call: "POST /governance/committee-members/${abel_id}/end-term"
              payload: { end_term_reason: "RESIGNED", effective_date: "2026-08-01" }
              as: PlanSponsorAdmin
            - call: "POST /governance/committee-members"
              payload: { seat_id: "${seat_fin_id}", member_name: "Dena Kirchner", term_start_date: "2026-05-01", term_end_date: "2027-04-30", affiliated_provider_role: "NONE" }
              as: PlanSponsorAdmin
              captures: { dena_id: $.data.id }
            - call: "POST /governance/committee-members"
              payload: { seat_id: "${seat_fin_id}", member_name: "Efrat Salomon", term_start_date: "2027-06-01", term_end_date: "2028-05-31", affiliated_provider_role: "NONE" }
              as: PlanSponsorAdmin
            - call: "GET /governance/committee-seats/${seat_fin_id}"
              payload: {}
              as: PlanSponsorAdmin
          assert:
            - "after setup, CommitteeSeat.${seat_fin_id}.status == FILLED with CommitteeMember.${abel_id}.status == APPOINTED and term 2026-01-01..2026-09-30"
            - "trigger step 1 returns 409 ERR_SEAT_NOT_VACANT (the specific priority 42 state error), NOT 201 and NOT ERR_SEAT_TERM_OVERLAP: Bina's term 2026-10-01..2027-09-30 shares not one day with Abel's, yet a filled seat refuses a temporally disjoint successor, so the occupancy check at priority 42 runs before the interval check at priority 66"
            - "trigger step 2 returns 201 on the different, still-VACANT AUDIT-1 seat with an interval identical to Abel's (2026-01-01..2026-09-30), proving the exclusion is scoped per seat and never per plan or per interval; CommitteeSeat.${seat_audit_id}.status VACANT -> FILLED and CommitteeMember.${ciro_id}.status == APPOINTED"
            - "trigger step 3 sets CommitteeMember.${abel_id}.status == RESIGNED with end_term_reason RESIGNED and CommitteeSeat.${seat_fin_id}.status FILLED -> VACANT"
            - "trigger step 4 returns 201 even though Dena's term 2026-05-01..2027-04-30 strictly contains part of Abel's closed interval 2026-01-01..2026-09-30 — Abel is terminal, so priority 66 does not see him; an implementation that compared against all historical members would wrongly return 409 ERR_SEAT_TERM_OVERLAP here"
            - "trigger step 5 returns 409 ERR_SEAT_NOT_VACANT again: Efrat's term 2027-06-01..2028-05-31 begins more than a year after Dena's term_end_date 2027-04-30 and still cannot join an occupied seat"
            - "trigger step 6 shows CommitteeSeat.${seat_fin_id}.status == FILLED with exactly one non-terminal member (${dena_id}) and consecutive_vacant_quarters == 0"
            - "Plan.${plan_id}.max_voting_seats == 2 was never exceeded: the two voting seats CHAIR and FIN-1 stayed FILLED across the resignation and the re-appointment, and AUDIT-1 is non-voting"

      - name: engagement_term_overlap_scoped_by_role_and_live_status_adjacency_allowed
        grounds:
          - validations[priority=67]
          - state_machines.ServiceProviderEngagement.PENDING_to_TERMINATED
          - state_machines.ServiceProviderEngagement.ACTIVE_to_TERMINATED
          - entities.ServiceProviderEngagement.fields.term_start_date
          - entities.ServiceProviderEngagement.fields.term_end_date
          - entities.ServiceProviderEngagement.fields.provider_role
          - entities.ServiceProviderEngagement.fields.status
        distinguishing_aspect: |
          The engagement window is exclusive per (plan, provider_role) over live statuses only, and its
          closed intervals treat adjacency as legal — the exact opposite of the seat rule: a successor
          starting 2027-01-01 after a 2026-12-31 end is accepted, a one-day touch at 2026-12-31 is
          rejected, the same 2026 window is accepted for a different role, and it becomes free again
          once the incumbent is TERMINATED.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; a Plan with no committee activity required — engagement registration is a PlanSponsorAdmin write with no charter gate."
            - "One PENDING RECORDKEEPER engagement holding the closed window 2026-01-01..2026-12-31."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanSponsorAdmin
            - call: "POST /governance/plans"
