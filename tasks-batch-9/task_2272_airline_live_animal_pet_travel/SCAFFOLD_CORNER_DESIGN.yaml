            - "total_count == 1, has_more == false and the single row is ${res1}"
            - "Reservation.${res1}.compliance_status == VERIFIED while Reservation.${res2}.compliance_status == UNVERIFIED"
            - "both rows still report booking_status PENDING, so the two dimensions moved independently"
