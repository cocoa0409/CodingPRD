  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: provider_revoke_four_hop_cascade_reverts_cycle
        grounds:
          - state_machines.Provider.ACCREDITED_to_REVOKED
          - state_machines.Completion.VERIFIED_to_INVALIDATED
          - state_machines.RenewalCycle.REQUIREMENTS_MET_to_OPEN
          - entities.RenewalCycle.fields.final_earned_hours
        distinguishing_aspect: |
          Depth-4 chain, each link caused by the previous: Provider REVOKE -> Course DEACTIVATED ->
          that course's VERIFIED Completion INVALIDATED -> cycle.final_earned_hours recomputed ->
          cycle REQUIREMENTS_MET reverts to OPEN. Trigger differs from the rule's other cascade.
        test_recipe:
          setup:
            - "Board CA, Provider P ACCREDITED, courses ETHICS 4.0, SUBSTANCE 2.0, GENERAL 24.0 all VERIFIED so the cycle is REQUIREMENTS_MET (final 30.0)."
