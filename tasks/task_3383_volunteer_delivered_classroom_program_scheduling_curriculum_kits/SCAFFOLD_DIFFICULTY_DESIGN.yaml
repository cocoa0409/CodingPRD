              as: PlatformAdmin
              captures: { prog120_id: $.data.id }
            - call: "POST /ja-programs/partnership-agreements"
              payload: { school_id: "${school_id}", program_catalog_id: "${prog120_id}", sponsor_partner_id: "${partner1_id}", school_year: "2026-2027", funding_pledged_cents: 500000 }
              as: AreaDirector
              captures: { agr_id: $.data.id }
            - call: "POST /ja-programs/partnership-agreements/${agr_id}/transition"
              payload: { action: "PROPOSE" }
              as: AreaDirector
            - call: "POST /ja-programs/partnership-agreements/${agr_id}/transition"
              payload: { action: "ACTIVATE" }
              as: AreaDirector
            - call: "POST /ja-programs/partnership-agreements/${agr_id}/transition"
              payload: { action: "RECORD_FUNDING", amount_cents: 500000 }
              as: AreaDirector
              captures: { agr_v3: $.data.version }
            - call: "POST /ja-programs/kit-inventories"
              payload: { area_office_id: "${office_id}", program_catalog_id: "${prog120_id}" }
              as: LogisticsCoordinator
              captures: { inv120_id: $.data.id }
            - call: "POST /ja-programs/kit-inventories/${inv120_id}/transition"
              payload: { action: "ASSEMBLE", quantity: 50 }
              as: LogisticsCoordinator
            - call: "POST /ja-programs/deliveries"
              payload: { agreement_id: "${agr_id}", lead_volunteer_id: "${vol1_id}", classroom_label: "Room 3", teacher_email: "t3@rv.example", enrolled_count: 10, expected_agreement_version: "${agr_v3}" }
              as: ProgramCoordinator
              captures: { del_id: $.data.id }
            - call: "POST /ja-programs/deliveries/${del_id}/transition"
              payload: { action: "PLAN" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/sessions"
              payload: { delivery_id: "${del_id}", volunteer_id: "${vol1_id}", scheduled_date: "2026-09-08", start_minutes: 540, end_minutes: 660 }
              as: ProgramCoordinator
              captures: { s1: $.data.id }
            - call: "POST /ja-programs/sessions/${s1}/transition"
              payload: { action: "CONFIRM" }
