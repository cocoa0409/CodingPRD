        test_recipe:
          setup:
            - "PayerPolicy p1; Patient pat8 RENTAL, setup complete -> ACTIVE_THERAPY"
            - "Initiate discontinuation -> Patient DISCONTINUING, RetrievalCase rc8 OPEN, plans SUSPENDED_DISCONTINUATION"
            - "Drive retrieval: schedule-pickup -> mark-picked-up -> mark-received (RECEIVED)"
          setup_api_calls:
            - call: "POST /sleep-therapy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
