          Conserved quantity = equipment booking occupancy: a FAILED (or CANCELLED) install job releases
          its window so the SAME equipment can be re-booked for an overlapping window that previously
          collided — net active-booking count for that equipment+window returns to zero, letting a new
          09:00-10:00 job on the same truck succeed (201) where it would otherwise 409; a resource-count
          conserved quantity distinct from the monetary ledger.
