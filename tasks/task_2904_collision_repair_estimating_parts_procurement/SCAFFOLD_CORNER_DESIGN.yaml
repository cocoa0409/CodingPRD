            - "after one POST /repair-orders/${ro_id}/teardown-findings the identical blueprint call succeeds and the order is BLUEPRINTED with blueprint_by_user_id == est-100"

      - name: total_loss_from_estimate_locked_is_refused_on_stage_precondition
