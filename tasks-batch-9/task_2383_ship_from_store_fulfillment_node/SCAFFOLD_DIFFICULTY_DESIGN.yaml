          Entity 1 = FulfillmentAssignment: the pick step is a fork (PICKED vs SHORT_PICKED on
          picked_units) whose SHORT_PICKED branch carries an extra reroute side-effect set, and
          both branch arms re-join at the single PACKED state - so a linear ACCEPTED -> PICKED
