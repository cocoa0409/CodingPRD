          setup:
            - "Logical clock at 2026-08-06T00:00:00Z with an OPEN cycle window (2026-08-05 .. 2026-08-20)."
            - "One ELIGIBLE agency, one warehouse, CANNED_PEACHES posted lot of 100 cases."
            - "An order carrying one 10-case line, submitted once, returned for revision by reviewer rev-1, then re-submitted."
