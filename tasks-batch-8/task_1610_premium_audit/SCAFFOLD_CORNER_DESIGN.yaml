        grounds: ["validations[priority=10]", "errors[ERR_DUPLICATE_RECORDS_REQUEST]"]
        distinguishing_aspect: "A second OPEN request of type PAYROLL_SUMMARY on the same work order is rejected; after the first is WAIVED a replacement succeeds."
        test_recipe:
          setup: ["WC policy WC-V6 -> PHYSICAL work order with one OPEN PAYROLL_SUMMARY request"]
          setup_api_calls:
