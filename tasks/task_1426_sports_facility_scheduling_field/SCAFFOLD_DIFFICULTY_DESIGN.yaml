  - rule_id: transitive_cascade
    instances:
      - name: closure_rainout_credit_ledger_cascade
        grounds:
          - state_machines.FieldClosure
          - state_machines.Permit.CONFIRMED_to_RAINED_OUT
          - calculations.turf_rest_weekly_load
          - entities.Invoice.fields.credit_cents
        distinguishing_aspect: |
          Depth-3 cascade from closure creation: FieldClosure(ACTIVE) -> Permit RAINED_OUT ->
          Invoice credit_cents=9600 / total_cents=0 / balance_due_cents=-5000 -> UsageLedger
          awarded_prime_hours 2->0 AND Facility.weekly_prime_hours_used 2->0. Each hop is caused
          by the previous link, not by the closure directly; trigger differs from the sibling
          (no-show marking).
        test_recipe:
          setup:
            - "Happy-path CONFIRMED permit 2026-08-10 18:00-20:00 with lights (quote 9600, deposit 5000 paid)"
            - "Clock at 2026-08-10T08:00 (same Mon-Sun week as the slot, before slot start) so the weekly load field reflects it"
