  - rule_id: priority_pair_validation_conflict
    instances:
      - name: clockin_state_vs_no_active_match
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - state_machines.Visit.SCHEDULED_to_IN_PROGRESS
        distinguishing_aspect: |
          A clock-in on an already-COMPLETED visit that also lacks an ACTIVE match violates both a
          state rule (priority 5, ERR_INVALID_STATE — but clock-out path uses ERR_VISIT_NOT_IN_PROGRESS;
          here the visit is terminal so ERR_INVALID_STATE) and a business_referential rule
          (priority 10, ERR_NO_ACTIVE_MATCH); the state category (priority 5) wins and returns ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "A COMPLETED visit whose match was subsequently ENDED (so no ACTIVE match remains)."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "A", base_hourly_rate: 30.00, live_in_day_rate: 250.00, evv_rounding_minutes: 15 }
