      - name: threshold_boundary_of_the_auxiliary_electrical_ceiling
        claim_type: threshold
        grounds:
          - calculations.aux_electrical_load
          - validations.priority_72_ERR_AUX_ELECTRICAL_LOAD_EXCEEDED
        distinguishing_aspect: |
          The ceiling test accepts at exactly max_aux_amp_draw and refuses one amp above it.
        excluded_because:
          difficulty_instance: aux_electrical_load_exactly_at_chassis_ceiling_then_one_amp_over
          rationale: |
            §1.8 drives the boundary pair on the same order (approve at exactly 40 A, then the next
            interface at 41 A refused), which is strictly stronger than a single-sided check here.

      - name: tiered_pricing_band_selected_from_the_discounted_subtotal
        claim_type: tiered_pricing
        grounds:
          - calculations.build_invoice_total
        distinguishing_aspect: |
          The fee band must be read from the discounted subtotal, so a discount that drags the
          subtotal below a band edge must also drop the fee.
        excluded_because:
          difficulty_instance: build_invoice_total_pinned_tier_evaluation_order
          rationale: |
            §1.8 owns the cross-band case where the raw subtotal sits in the upper band and the
            discounted subtotal in the lower one, which is the only case that distinguishes the two
            evaluation orders; the Precision instance above covers the rounding half of the rule.

      - name: chronological_queue_promotion_after_a_freed_bay_window
        claim_type: chronological
        grounds:
          - calculations.queue_promotion_selector
          - state_machines.BuildSlot.QUEUED_to_SCHEDULED
        distinguishing_aspect: |
          Promotion order is start_date ASC then created_at ASC, and at most one QUEUED slot is
          promoted per freed window.
        excluded_because:
          difficulty_instance: chassis_return_cascades_four_hops_into_queue_promotion
          rationale: |
            Hop 3 of that §1.8 cascade is exactly this selector, including the single-promotion rule
            and the promoted slot's order moving RELEASED -> SCHEDULED.

      - name: variant_divergence_between_the_two_weight_bases
        claim_type: Variant Divergence
        grounds:
          - calculations.axle_load_distribution.variants
          - calculations.payload_capacity.variants
        distinguishing_aspect: |
          The same entity data must yield different axle loads, gvw and payload under AS_DESIGNED and
          AS_MEASURED, with the delta explained by the scale ticket and the PLANNED-inclusion rule.
        excluded_because:
          difficulty_instance: axle_load_as_designed_versus_as_measured_divergence
          rationale: |
            §1.8 pins both variants on one order with all four numbers and the included_component_count
            on each side; repeating it here would add no discriminating power.

      - name: variant_selection_between_provisional_and_final_liability
        claim_type: Variant Selection
        grounds:
          - calculations.warranty_liability_split.variants
          - state_machines.WarrantyClaim.INSPECTED_to_ADJUDICATED
        distinguishing_aspect: |
          PROVISIONAL must be stamped at submission and FINAL at adjudication, with the taint shift
          applied only in the FINAL pass and only when the order's warranty posture is compromised.
        excluded_because:
          difficulty_instance: warranty_split_provisional_versus_final_taint_shift
          rationale: |
            §1.8 walks the same claim through both variants and asserts the 60/35/5 to 15/80/5 shift
            together with the untainted control case.

      - name: reconciliation_of_the_ledger_when_a_claim_leaves_the_posted_set
        claim_type: Reconciliation
        grounds:
          - calculations.warranty_liability_split
          - entities.UpfitOrder.fields.upfitter_liability_cents
        distinguishing_aspect: |
          When a claim's basis or status changes, the delta must be applied to the order ledger with
          no residue.
        excluded_because:
          difficulty_instance: warranty_cents_conservation_across_dispute_and_readjudication
          rationale: |
            §1.8 asserts the ledger before, during and after the dispute round trip, which is the
            reconciliation claim in its strongest form.

  # =========================================================================
  # 4. From Table 4 (Validations)
  # =========================================================================
  - section: validations
    instances:

      - name: dump_body_without_a_hoist_cannot_be_released
        claim_type: Violation → Error
        grounds:
          - validations.priority_85_ERR_HYDRAULIC_SOURCE_MISSING
          - entities.BodySpec.fields.requires_hydraulics
        distinguishing_aspect: |
          Every earlier gate passes on this order — the F450 carries the 12 ft dump body inside GVWR
          and both GAWRs with room to spare — so the only thing standing between the order and
          production is the missing hydraulic source. The rule is satisfied by ANY non-removed
          PTO-driven installation, not by a hydraulic_circuit value on the body, and it is evaluated
          at release rather than at order create when no equipment has been planned yet.
        test_recipe:
          setup:
            - "F450-SRW-60CA (curb 4180 / 2320, WB 176, CA 60, GVWR 14000, front GAWR 5000, rear GAWR 9450, PTO FULL 14 gpm, DISCRETE bus, max aux 40) paired with DUMP-12FT (requires_hydraulics true, min CA 60, min WB 176)."
            - "The order sits in ENGINEERING_REVIEW with a bound inspected unit and no equipment installations at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /upfit/chassis-models"
              payload: { code: "F450-SRW-60CA", make: "FORD", gvwr_lb: 14000, front_gawr_lb: 5000, rear_gawr_lb: 9450, wheelbase_in: 176, cab_to_axle_in: 60, curb_front_axle_lb: 4180, curb_rear_axle_lb: 2320, max_aux_amp_draw: 40, electrical_bus: "DISCRETE", pto_provision: "FULL", pto_max_flow_gpm: 14, body_builder_book_rev: "BBB-2026.1", incomplete_vehicle_document_rev: "IVD-2026.1" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { cm_b: "$.data.id" }
            - call: "POST /upfit/body-specs"
              payload: { code: "DUMP-12FT", body_type: "DUMP", weight_lb: 3400, cg_from_body_front_in: 78, cargo_cg_from_body_front_in: 84, length_in: 144, required_min_ca_in: 60, required_min_wheelbase_in: 176, aux_amp_draw: 8, requires_hydraulics: true, list_price_cents: 1120000 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { bs_dump: "$.data.id" }
            - call: "POST /upfit/equipment-specs"
              payload: { code: "DUMP-HOIST-10T", equipment_class: "PTO_HOIST", weight_lb: 950, requires_pto: true, required_flow_gpm: 12, aux_amp_draw: 5, duty_priority: 2, mount_zone: "BODY_FLOOR", requires_can_gateway: false, list_price_cents: 640000 }
              as: PlantAdmin
