        distinguishing_aspect: "Award with neither any passed level nor any approved experience returns ERR_LEVELS_NOT_ALL_PASSED — the pinned referential sub-order (levels -> experience -> conduct statement -> open case) makes the levels gate fire first."
        test_recipe:
