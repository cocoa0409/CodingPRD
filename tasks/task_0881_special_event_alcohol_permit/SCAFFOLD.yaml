# =============================================================================
# Special-Event Alcohol & Temporary Permit — seed tables (Expert)
# =============================================================================

scenario: |
  Special-Event Alcohol & Temporary Permit: event & temporary-license
  application, server-training & compliance, insurance & security plan,
  occupancy & sales limit, fee & deposit, inspection & violation, multi-agency
  signoff, post-event report

domain_name: special-event-alcohol-permit
api_prefix: /permits

complexity_profile:
  primary_archetype: multi-party negotiation      # multi-agency signoff / quorum
  secondary_archetype: compliance / audit          # server-training, inspection, SoD
  complexity_layers:
    - optimistic_concurrency        # OCC on PermitApplication.version
    - cascading_side_effects        # revoke / revision cascades
    - dual_variant_calculation      # estimated vs reconciled fee; standard vs repeat fine
    - rate_threshold_triggers       # occupancy / guard / coverage boundaries

  entity_topology: flat             # peer collections under /permits linked by FK bodies
  state_machine_shape: cyclic       # PermitApplication revision loop; AgencyReview branching
  relationship_patterns:
    - one_to_many                   # application -> servers / reviews / inspections / ledger
    - cross_aggregate               # inspection references application AND inspector
  role_model: segregation_of_duties # issuer must be independent of agency reviewers
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: PermitApplication
    parent: null
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; venue booked for the event" }
      - { name: organizer_name, type: string, source: input, description: "Name of the sponsoring organization" }
      - { name: event_name, type: string, source: input, description: "Human-readable event name" }
      - { name: event_start, type: datetime, source: input, description: "ISO8601 UTC event start" }
      - { name: event_end, type: datetime, source: input, description: "ISO8601 UTC event end; must be strictly after event_start" }
      - { name: alcohol_service_hours, type: number, source: input, description: "Hours alcohol will be served during the event" }
      - { name: expected_attendance, type: integer, source: input, description: "Projected peak attendance used for estimated fee and guard sizing" }
      - { name: requested_sales_limit_cents, type: integer, source: input, description: "Requested cap on gross alcohol sales, in cents" }
      - { name: status, type: enum, source: system, description: "DRAFT|SUBMITTED|UNDER_REVIEW|REVISIONS_REQUESTED|APPROVED|PERMIT_ISSUED|EVENT_COMPLETE|CLOSED|DENIED|REVOKED" }
      - { name: permit_fee_cents, type: integer, source: computed, description: "Permit fee; ESTIMATED at submit, RECONCILED at report filing" }
      - { name: fee_basis, type: enum, source: computed, description: "ESTIMATED|RECONCILED — which variant produced permit_fee_cents" }
      - { name: deposit_cents, type: integer, source: computed, description: "Flat refundable security deposit assessed at submit" }
      - { name: balance_due_cents, type: integer, source: computed, description: "Read-only: signed sum of all LedgerEntry.amount_cents for this application" }
      - { name: deposit_status, type: enum, source: computed, default: "NONE", description: "NONE|HELD|REFUNDED|FORFEITED" }
      - { name: pending_review_count, type: integer, source: computed, description: "Count of AgencyReview rows in PENDING for this application" }
      - { name: approved_review_count, type: integer, source: computed, description: "Count of AgencyReview rows in APPROVED or APPROVED_WITH_CONDITIONS" }
      - { name: rejected_review_count, type: integer, source: computed, description: "Count of AgencyReview rows in REJECTED" }
      - { name: total_review_count, type: integer, source: computed, description: "Total AgencyReview rows created for this application (equals len(REQUIRED_AGENCIES) once opened)" }
      - { name: has_conditions, type: boolean, source: computed, default: false, description: "True if any agency approved with conditions" }
      - { name: permit_number, type: string, source: system, default: null, description: "Assigned when permit issued; null before issuance" }

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Venue name" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: occupancy_limit, type: integer, source: input, description: "Maximum occupancy per fire code; ceiling for attendance and driver of guard sizing" }
      - { name: indoor, type: boolean, source: input, default: true, description: "Whether the venue is indoors" }

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Inspector full name" }
      - { name: badge_number, type: string, source: input, description: "Inspector badge identifier" }
      - { name: agency, type: enum, source: input, description: "POLICE|FIRE|ALCOHOL_BOARD|HEALTH — employing agency" }

  - name: EventServer
    parent: PermitApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> PermitApplication.id" }
      - { name: full_name, type: string, source: input, description: "Server full name" }
      - { name: cert_number, type: string, source: input, description: "Alcohol server training certificate number" }
      - { name: training_provider, type: enum, source: input, description: "TIPS|SERVSAFE_ALCOHOL|STATE_APPROVED — accredited provider" }
      - { name: cert_issued_date, type: datetime, source: input, description: "ISO8601 UTC certificate issue date" }
      - { name: cert_expiry_date, type: datetime, source: input, description: "ISO8601 UTC certificate expiry date; must be >= event_end to verify" }
      - { name: status, type: enum, source: system, description: "PENDING|VERIFIED" }

  - name: InsurancePolicy
    parent: PermitApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> PermitApplication.id" }
      - { name: insurer_name, type: string, source: input, description: "Name of the insurance carrier" }
      - { name: coverage_cents, type: integer, source: input, description: "Liability coverage amount in cents" }
      - { name: effective_date, type: datetime, source: input, description: "ISO8601 UTC coverage start; must be <= event_start to accept" }
      - { name: expiry_date, type: datetime, source: input, description: "ISO8601 UTC coverage end; must be >= event_end to accept" }
      - { name: status, type: enum, source: system, description: "SUBMITTED|ACCEPTED" }

  - name: SecurityPlan
    parent: PermitApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> PermitApplication.id" }
      - { name: planned_guard_count, type: integer, source: input, description: "Number of security guards the organizer commits to staff" }
      - { name: has_medical_staff, type: boolean, source: input, default: false, description: "Whether on-site medical staff are provided" }
      - { name: plan_summary, type: string, source: input, description: "Free-text summary of the security plan" }
      - { name: required_guard_count, type: integer, source: computed, description: "Read-only: minimum guards required (see required_security_guards calc)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED|APPROVED" }

  - name: AgencyReview
    parent: PermitApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> PermitApplication.id" }
      - { name: agency, type: enum, source: system, description: "POLICE|FIRE|ALCOHOL_BOARD — one row per required agency, created by open-review" }
      - { name: status, type: enum, source: system, description: "PENDING|APPROVED|REJECTED|APPROVED_WITH_CONDITIONS" }
      - { name: conditions, type: string, source: system, default: null, description: "Conditions text when APPROVED_WITH_CONDITIONS; null otherwise" }
      - { name: recorded_by, type: string, source: system, default: null, description: "X-User-ID of the AgencyReviewer who recorded the decision" }

  - name: Inspection
    parent: PermitApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> PermitApplication.id" }
      - { name: inspector_id, type: string, source: input, description: "FK -> Inspector.id" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO8601 UTC inspection window start" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO8601 UTC inspection window end; must be strictly after scheduled_start" }
      - { name: result, type: enum, source: system, description: "SCHEDULED|PASSED|FAILED" }
      - { name: recorded_by, type: string, source: system, default: null, description: "X-User-ID (Inspector.id) that recorded the result" }

  - name: Violation
    parent: Inspection
    common_fields: true
    fields:
      - { name: inspection_id, type: string, source: input, description: "FK -> Inspection.id" }
      - { name: application_id, type: string, source: system, description: "Denormalized owning application id, copied from the parent Inspection" }
      - { name: severity, type: enum, source: input, description: "MINOR|MAJOR|CRITICAL" }
      - { name: description, type: string, source: input, description: "What was observed" }
      - { name: fine_cents, type: integer, source: computed, description: "Penalty amount; STANDARD or REPEAT variant (see violation_penalty calc)" }
      - { name: penalty_variant, type: enum, source: computed, description: "STANDARD|REPEAT — which variant produced fine_cents" }
      - { name: status, type: enum, source: system, description: "ISSUED|CONTESTED|UPHELD|DISMISSED" }

  - name: LedgerEntry
    parent: PermitApplication
    common_fields: false        # append-only: id + created_at only
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> PermitApplication.id" }
      - { name: entry_type, type: enum, source: system, description: "FEE|FEE_ADJUSTMENT|DEPOSIT|FINE|FINE_REVERSAL|PAYMENT|REFUND|DEPOSIT_REFUND|DEPOSIT_FORFEIT" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount; debits (owed) positive, credits (paid/refunded) negative" }
      - { name: memo, type: string, source: system, description: "Human-readable reason for the entry" }

  - name: PostEventReport
    parent: PermitApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> PermitApplication.id" }
      - { name: actual_attendance, type: integer, source: input, description: "Observed peak attendance" }
      - { name: gross_sales_cents, type: integer, source: input, description: "Actual gross alcohol sales in cents" }
      - { name: incident_count, type: integer, source: input, default: 0, description: "Number of reportable incidents during the event" }
      - { name: reconciled_fee_cents, type: integer, source: computed, description: "Fee recomputed from actuals (RECONCILED variant)" }
      - { name: status, type: enum, source: system, description: "FILED|ACCEPTED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PermitApplication
    initial_state: DRAFT
    terminal_states: [CLOSED, DENIED, REVOKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /permits/applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "Application is DRAFT (ERR_APPLICATION_NOT_DRAFT)"
          - "event_end strictly after event_start (ERR_INVALID_DATE_RANGE)"
          - "At least one EventServer, one InsurancePolicy, and one SecurityPlan exist for the application (ERR_MISSING_REQUIRED_DOCUMENTS)"
          - "expected_attendance <= Venue.occupancy_limit (ERR_INSUFFICIENT_SECURITY is NOT used here; over-occupancy uses ERR_VALIDATION at attendance>occupancy)"
          - "current_clock <= event_start - MIN_SUBMISSION_LEAD_DAYS (MIN_SUBMISSION_LEAD_DAYS=14) (ERR_SUBMISSION_TOO_LATE)"
          - "No other PermitApplication for the same venue_id in {SUBMITTED,UNDER_REVIEW,REVISIONS_REQUESTED,APPROVED,PERMIT_ISSUED} has an event interval [event_start,event_end) overlapping this one (ERR_VENUE_DOUBLE_BOOKED)"
        side_effects:
          - "permit_fee_cents computed via permit_fee ESTIMATED variant; fee_basis=ESTIMATED"
          - "deposit_cents set to DEPOSIT_CENTS (DEPOSIT_CENTS=20000)"
          - "Append LedgerEntry FEE (+permit_fee_cents) and LedgerEntry DEPOSIT (+deposit_cents); balance_due_cents recomputed"
          - "SecurityPlan.required_guard_count recomputed"

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /permits/applications/{id}/open-review"
        actor: PermitClerk
        preconditions:
          - "Application is SUBMITTED (ERR_APPLICATION_NOT_SUBMITTED)"
        side_effects:
          - "Create one AgencyReview (status PENDING) per agency in REQUIRED_AGENCIES (REQUIRED_AGENCIES=[POLICE, FIRE, ALCOHOL_BOARD], so total_review_count=3)"
          - "pending_review_count = len(REQUIRED_AGENCIES); approved_review_count=0; rejected_review_count=0; total_review_count=len(REQUIRED_AGENCIES)"

      - from: UNDER_REVIEW
        to: REVISIONS_REQUESTED
        trigger: "POST /permits/applications/{id}/request-revisions"
        actor: PermitClerk
        preconditions:
          - "Application is UNDER_REVIEW (ERR_APPLICATION_NOT_UNDER_REVIEW)"
        side_effects:
          - "CASCADE link 2: every AgencyReview not already PENDING is reset to PENDING; pending_review_count=total_review_count, approved_review_count=0, rejected_review_count=0, has_conditions=false"
        note: "Cascade #2 origin (depth 2): request-revisions mutates application, which resets child reviews."

      - from: REVISIONS_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /permits/applications/{id}/resubmit"
        actor: Applicant
        preconditions:
          - "Application is REVISIONS_REQUESTED (ERR_INVALID_STATE)"
        side_effects: []
        note: "Closes the revision cycle UNDER_REVIEW -> REVISIONS_REQUESTED -> UNDER_REVIEW."

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /permits/applications/{id}/approve"
        actor: PermitClerk
        preconditions:
          - "Application is UNDER_REVIEW (ERR_APPLICATION_NOT_UNDER_REVIEW)"
          - "approved_review_count == total_review_count (all AgencyReviews APPROVED or APPROVED_WITH_CONDITIONS) (ERR_REVIEWS_NOT_ALL_APPROVED)"
          - "All EventServers for the application are VERIFIED (ERR_SERVERS_NOT_ALL_VERIFIED)"
          - "At least one InsurancePolicy is ACCEPTED (ERR_INSURANCE_NOT_ACCEPTED)"
          - "At least one SecurityPlan is APPROVED (ERR_SECURITY_PLAN_NOT_APPROVED)"
          - "X-User-ID is not the recorded_by of any AgencyReview on this application (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "status -> APPROVED"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /permits/applications/{id}/deny"
        actor: PermitClerk
        preconditions:
          - "Application is UNDER_REVIEW (ERR_APPLICATION_NOT_UNDER_REVIEW)"
          - "rejected_review_count >= 1 (ERR_NO_REJECTED_REVIEW)"
        side_effects:
          - "For every prior PAYMENT LedgerEntry, append a REFUND LedgerEntry (negation) so paid funds are returned; balance_due_cents recomputed"
          - "deposit_status -> NONE"
          - "status -> DENIED"

      - from: APPROVED
        to: PERMIT_ISSUED
        trigger: "POST /permits/applications/{id}/issue-permit"
        actor: PermitClerk
        preconditions:
          - "Application is APPROVED (ERR_APPLICATION_NOT_APPROVED)"
          - "An Inspection for this application has result PASSED (ERR_INSPECTION_NOT_PASSED)"
          - "balance_due_cents == 0 (ERR_OUTSTANDING_BALANCE)"
        side_effects:
          - "permit_number assigned"
          - "deposit_status -> HELD"
          - "status -> PERMIT_ISSUED"

      - from: APPROVED
        to: REVOKED
        trigger: "system: cascade from Inspection SCHEDULED->FAILED"
        actor: system
        preconditions:
          - "Parent Inspection transitioned to FAILED"
        side_effects:
          - "CASCADE link 2: append LedgerEntry DEPOSIT_FORFEIT for the currently-held/paid deposit portion (min(deposit_cents, deposit paid))"
          - "CASCADE link 3: deposit_status -> FORFEITED and balance_due_cents recomputed as a consequence of the DEPOSIT_FORFEIT entry"
          - "status -> REVOKED"
        note: "Cascade #1 (depth 3): record-result FAILED -> Inspection FAILED (link1) -> application REVOKED (link2) -> DEPOSIT_FORFEIT ledger entry drives deposit_status/balance (link3)."

      - from: PERMIT_ISSUED
        to: EVENT_COMPLETE
        trigger: "system: cascade from PostEventReport creation"
        actor: system
        preconditions:
          - "A PostEventReport was filed (POST /permits/reports) for this application"
        side_effects:
          - "permit_fee_cents recomputed via permit_fee RECONCILED variant using report actuals; fee_basis=RECONCILED"
          - "Append LedgerEntry FEE_ADJUSTMENT for (reconciled_fee - previous permit_fee_cents); balance_due_cents recomputed"
          - "status -> EVENT_COMPLETE"

      - from: EVENT_COMPLETE
        to: CLOSED
        trigger: "POST /permits/applications/{id}/close"
        actor: PermitClerk
        preconditions:
          - "Application is EVENT_COMPLETE (ERR_INVALID_STATE)"
          - "No Violation on this application is in ISSUED or CONTESTED (ERR_UNRESOLVED_VIOLATIONS)"
        side_effects:
          - "deposit_refund computed; append LedgerEntry DEPOSIT_REFUND (negation of refunded portion) and, if deductions>0, LedgerEntry DEPOSIT_FORFEIT for the withheld portion"
          - "deposit_status -> REFUNDED if refund==deposit_cents else FORFEITED"
          - "PostEventReport.status -> ACCEPTED"
          - "status -> CLOSED"

  - entity: EventServer
    initial_state: PENDING
    terminal_states: [VERIFIED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /permits/servers/{id}/verify"
        actor: PermitClerk
        preconditions:
          - "Server is PENDING (ERR_INVALID_STATE)"
          - "training_provider in {TIPS,SERVSAFE_ALCOHOL,STATE_APPROVED} and cert_expiry_date >= application.event_end (ERR_CERT_EXPIRED)"
        side_effects:
          - "status -> VERIFIED"

  - entity: InsurancePolicy
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /permits/insurance-policies/{id}/accept"
        actor: PermitClerk
        preconditions:
          - "Policy is SUBMITTED (ERR_INVALID_STATE)"
          - "coverage_cents >= required coverage for application.expected_attendance tier (ERR_INSUFFICIENT_COVERAGE)"
          - "effective_date <= application.event_start and expiry_date >= application.event_end (ERR_INSURANCE_DATES_INVALID)"
        side_effects:
          - "status -> ACCEPTED"

  - entity: SecurityPlan
    initial_state: SUBMITTED
    terminal_states: [APPROVED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /permits/security-plans/{id}/approve"
        actor: PermitClerk
        preconditions:
          - "Plan is SUBMITTED (ERR_INVALID_STATE)"
          - "planned_guard_count >= required_security_guards(application) (ERR_INSUFFICIENT_SECURITY)"
        side_effects:
          - "required_guard_count recomputed and stored"
          - "status -> APPROVED"

  - entity: AgencyReview
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /permits/agency-reviews/{id}/decide (decision=APPROVE)"
        actor: AgencyReviewer
        preconditions:
          - "Review is PENDING (ERR_REVIEW_NOT_PENDING)"
          - "Parent application is UNDER_REVIEW (ERR_APPLICATION_NOT_UNDER_REVIEW)"
          - "expected_application_version matches application.version (ERR_STALE_VERSION)"
        side_effects:
          - "recorded_by set to X-User-ID"
          - "application.approved_review_count += 1, application.pending_review_count -= 1"
          - "increments PermitApplication.version by 1"

      - from: PENDING
        to: APPROVED_WITH_CONDITIONS
        trigger: "POST /permits/agency-reviews/{id}/decide (decision=APPROVE_WITH_CONDITIONS)"
        actor: AgencyReviewer
        preconditions:
          - "Review is PENDING (ERR_REVIEW_NOT_PENDING)"
          - "Parent application is UNDER_REVIEW (ERR_APPLICATION_NOT_UNDER_REVIEW)"
          - "conditions field is non-empty (ERR_VALIDATION)"
          - "expected_application_version matches application.version (ERR_STALE_VERSION)"
        side_effects:
          - "conditions stored; recorded_by set; application.has_conditions=true"
          - "application.approved_review_count += 1, application.pending_review_count -= 1 (counts as approving for the quorum)"
          - "increments PermitApplication.version by 1"
        note: "Divergent branch: same fork as APPROVE but additionally sets has_conditions and stores conditions text."

      - from: PENDING
        to: REJECTED
        trigger: "POST /permits/agency-reviews/{id}/decide (decision=REJECT)"
        actor: AgencyReviewer
        preconditions:
          - "Review is PENDING (ERR_REVIEW_NOT_PENDING)"
          - "Parent application is UNDER_REVIEW (ERR_APPLICATION_NOT_UNDER_REVIEW)"
          - "expected_application_version matches application.version (ERR_STALE_VERSION)"
        side_effects:
          - "recorded_by set; application.rejected_review_count += 1, application.pending_review_count -= 1"
          - "increments PermitApplication.version by 1"

      - from: APPROVED
        to: PENDING
        trigger: "system: cascade from application request-revisions"
        actor: system
        preconditions: []
        side_effects: ["conditions cleared; recorded_by cleared"]
      - from: APPROVED_WITH_CONDITIONS
        to: PENDING
        trigger: "system: cascade from application request-revisions"
        actor: system
        preconditions: []
        side_effects: ["conditions cleared; recorded_by cleared"]
      - from: REJECTED
        to: PENDING
        trigger: "system: cascade from application request-revisions"
        actor: system
        preconditions: []
        side_effects: ["recorded_by cleared"]

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /permits/inspections/{id}/record-result (result=PASSED)"
        actor: Inspector
        preconditions:
          - "Inspection is SCHEDULED (ERR_INSPECTION_NOT_SCHEDULED)"
          - "X-User-ID == inspection.inspector_id (ERR_INSPECTOR_MISMATCH)"
        side_effects:
          - "recorded_by set; result -> PASSED"

      - from: SCHEDULED
        to: FAILED
        trigger: "POST /permits/inspections/{id}/record-result (result=FAILED)"
        actor: Inspector
        preconditions:
          - "Inspection is SCHEDULED (ERR_INSPECTION_NOT_SCHEDULED)"
          - "X-User-ID == inspection.inspector_id (ERR_INSPECTOR_MISMATCH)"
        side_effects:
          - "recorded_by set; result -> FAILED"
          - "CASCADE link 1: if parent application is APPROVED, drive application APPROVED -> REVOKED (see PermitApplication cascade)"

  - entity: Violation
    initial_state: ISSUED
    terminal_states: [UPHELD, DISMISSED]
    transitions:
      - from: ISSUED
        to: CONTESTED
        trigger: "POST /permits/violations/{id}/contest"
        actor: Applicant
        preconditions:
          - "Violation is ISSUED (ERR_VIOLATION_NOT_CONTESTABLE)"
        side_effects: ["status -> CONTESTED"]

      - from: CONTESTED
        to: UPHELD
        trigger: "POST /permits/violations/{id}/resolve (decision=UPHELD)"
        actor: PermitClerk
        preconditions:
          - "Violation is CONTESTED (ERR_INVALID_STATE)"
        side_effects: ["status -> UPHELD; the FINE LedgerEntry stands"]

      - from: CONTESTED
        to: DISMISSED
        trigger: "POST /permits/violations/{id}/resolve (decision=DISMISSED)"
        actor: PermitClerk
        preconditions:
          - "Violation is CONTESTED (ERR_INVALID_STATE)"
        side_effects:
          - "Append LedgerEntry FINE_REVERSAL (-fine_cents) compensating the original FINE; balance_due_cents recomputed"
          - "status -> DISMISSED"

  - entity: PostEventReport
    initial_state: FILED
    terminal_states: [ACCEPTED]
    transitions:
      - from: FILED
        to: ACCEPTED
        trigger: "system: cascade from application close"
        actor: system
        preconditions: []
        side_effects: ["status -> ACCEPTED"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on PermitApplication.version)
# =============================================================================
concurrency_rules:
  - rule_id: agency-decide-stale-app
    parent_entity: PermitApplication
    write_endpoint: "POST /permits/agency-reviews/{id}/decide"
    occ_field: "expected_application_version"
    description: |
      Recording an agency decision against an application whose version has
      advanced since the reviewer last observed it is rejected. A different
      agency recording its own (still-PENDING) review legitimately bumps the
      shared application aggregate (approved/rejected counts, and thus
      version); a decision carrying the pre-bump version is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: payment-stale-app
    parent_entity: PermitApplication
    write_endpoint: "POST /permits/applications/{id}/payments"
    occ_field: "expected_application_version"
    description: |
      Recording a payment against an application whose version has advanced
      since the payer last observed it is rejected. A prior payment (or a
      fee reconciliation) legitimately changes balance_due and bumps version;
      a payment carrying the pre-bump version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: permit_fee
    trigger: "PermitApplication submit (ESTIMATED) and PostEventReport filing (RECONCILED)"
    algorithm: tiered_pricing
    formula: |
      Let attendance, sales_cents be:
        ESTIMATED variant  -> expected_attendance, requested_sales_limit_cents
        RECONCILED variant -> report.actual_attendance, report.gross_sales_cents
      Compute three line items, ROUND EACH to whole cents half-up, THEN sum:
        base_line       = BASE_PERMIT_FEE_CENTS                     (already whole)
        attendance_line = round_half_up(attendance * PER_ATTENDEE_SURCHARGE_CENTS)
        sales_line      = round_half_up(sales_cents * SALES_SURCHARGE_RATE)
      permit_fee_cents = base_line + attendance_line + sales_line
      At RECONCILED, delta = reconciled_fee - previous permit_fee_cents is posted
      as a FEE_ADJUSTMENT LedgerEntry (may be negative).
    input_set: "single application; ESTIMATED uses requested figures, RECONCILED uses report actuals"
    constants:
      BASE_PERMIT_FEE_CENTS: 5000
      PER_ATTENDEE_SURCHARGE_CENTS: 37.5
      SALES_SURCHARGE_RATE: 0.0125
    precision: "round half up, per-line then sum; whole cents"
    variants:
      - { name: ESTIMATED, when: "at submit", difference: "uses expected_attendance and requested_sales_limit_cents" }
      - { name: RECONCILED, when: "at report filing", difference: "uses actual_attendance and gross_sales_cents; posts FEE_ADJUSTMENT delta" }

  - name: required_security_guards
    trigger: "SecurityPlan approve; recomputed at application submit"
    algorithm: threshold
    formula: |
      base_guards = ceil(application.expected_attendance / ATTENDEES_PER_GUARD)
      duration_bonus = 1 if application.alcohol_service_hours > LONG_EVENT_HOURS else 0
      high_occupancy_bonus = 1 if application.expected_attendance >= (venue.occupancy_limit * HIGH_OCCUPANCY_FRACTION) else 0
      required = max(MIN_GUARDS, base_guards + duration_bonus + high_occupancy_bonus)
    input_set: "single application + its venue"
    constants:
      ATTENDEES_PER_GUARD: 75
      MIN_GUARDS: 2
      LONG_EVENT_HOURS: 5
      HIGH_OCCUPANCY_FRACTION: 0.90
    precision: "integer guards"
    note: "Mode (a) combinatorial: 3 inputs, ceil + two conditional bonuses + max floor. high_occupancy_bonus boundary is >= (inclusive)."

  - name: violation_penalty
    trigger: "Violation creation (POST /permits/violations)"
    algorithm: aggregation
    formula: |
      base = { MINOR: FINE_MINOR_CENTS, MAJOR: FINE_MAJOR_CENTS, CRITICAL: FINE_CRITICAL_CENTS }[severity]
      prior_count = count of Violations with the same application_id and status in
                    {ISSUED, CONTESTED, UPHELD} created strictly before this one
      if prior_count == 0: fine_cents = base                (variant STANDARD)
      else:                fine_cents = round_half_up(base * REPEAT_MULTIPLIER)  (variant REPEAT)
      Append LedgerEntry FINE (+fine_cents); balance_due_cents recomputed.
    input_set: "violations of one application, ordered by created_at ascending, tie-break created_at then id NOT used for value (count only)"
    constants:
      FINE_MINOR_CENTS: 2500
      FINE_MAJOR_CENTS: 10000
      FINE_CRITICAL_CENTS: 25000
      REPEAT_MULTIPLIER: 1.5
    precision: "round half up, whole cents"
    variants:
      - { name: STANDARD, when: "first qualifying violation for the application", difference: "fine = base" }
      - { name: REPEAT, when: "application already has a qualifying violation", difference: "fine = round_half_up(base * 1.5)" }

  - name: required_insurance_coverage
    trigger: "InsurancePolicy accept"
    algorithm: tiered_pricing
    formula: |
      if application.expected_attendance < 100:      required = COVERAGE_TIER_1_CENTS
      elif application.expected_attendance < 500:     required = COVERAGE_TIER_2_CENTS
      else:                                           required = COVERAGE_TIER_3_CENTS
      accept requires policy.coverage_cents >= required
    input_set: "single application"
    constants:
      COVERAGE_TIER_1_CENTS: 100000000
      COVERAGE_TIER_2_CENTS: 200000000
      COVERAGE_TIER_3_CENTS: 500000000
    precision: "whole cents"
    note: "Tier boundary at attendance 100 and 500 is strict-less-than for the lower tier (100 -> tier 2)."

  - name: deposit_refund
    trigger: "application close (EVENT_COMPLETE -> CLOSED)"
    algorithm: waterfall_allocation
    formula: |
      deductions = (CLEANUP_FEE_CENTS if report.incident_count > 0 else 0)
                 + sum(fine_cents of Violations for this application with status == UPHELD)
      refund_cents   = max(0, deposit_cents - deductions)
      forfeited_cents = deposit_cents - refund_cents
      Append LedgerEntry DEPOSIT_REFUND (-refund_cents) if refund_cents > 0
      Append LedgerEntry DEPOSIT_FORFEIT (+? no: withheld portion applied) for forfeited_cents if forfeited_cents > 0
    input_set: "deposit_cents (held), report.incident_count, UPHELD violation fines for the application"
    constants:
      CLEANUP_FEE_CENTS: 15000
    precision: "whole cents"
    note: "Conservation: deposit_cents == refund_cents + forfeited_cents (money invariant)."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role permitted for the endpoint per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All resources referenced in path AND in body foreign keys exist (validated left-to-right, path before body)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"

  - priority: 4
    category: state
    check: "Target/parent resource in the correct state for the operation"
    error_id: "varies (ERR_APPLICATION_NOT_*, ERR_REVIEW_NOT_PENDING, ERR_INSPECTION_NOT_SCHEDULED, ERR_VIOLATION_NOT_CONTESTABLE, ERR_INVALID_STATE)"
    http_status: 409
    applies_to: "state-transition endpoints"

  - priority: 5
    category: business_constraint
    check: "OCC: expected_application_version must equal application.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /permits/agency-reviews/{id}/decide, POST /permits/applications/{id}/payments"

  - priority: 6
    category: business_referential
    check: "Required linked resources present and in required state (all reviews approved; all servers verified; insurance accepted; security approved; inspection passed)"
    error_id: "ERR_REVIEWS_NOT_ALL_APPROVED | ERR_SERVERS_NOT_ALL_VERIFIED | ERR_INSURANCE_NOT_ACCEPTED | ERR_SECURITY_PLAN_NOT_APPROVED | ERR_INSPECTION_NOT_PASSED | ERR_MISSING_REQUIRED_DOCUMENTS"
    http_status: 409
    applies_to: "POST /permits/applications/{id}/submit, /approve, /issue-permit"

  - priority: 7
    category: business_safety
    check: "Server cert valid & non-expired; security guard count sufficient; insurance coverage sufficient"
    error_id: "ERR_CERT_EXPIRED | ERR_INSUFFICIENT_SECURITY | ERR_INSUFFICIENT_COVERAGE"
    http_status: 422
    applies_to: "POST /permits/servers/{id}/verify, /security-plans/{id}/approve, /insurance-policies/{id}/accept"

  - priority: 8
    category: business_temporal
    check: "Submission lead time; venue interval overlap; inspector buffer overlap; insurance dates span the event; event not yet ended for report"
    error_id: "ERR_SUBMISSION_TOO_LATE | ERR_VENUE_DOUBLE_BOOKED | ERR_INSPECTOR_UNAVAILABLE | ERR_INSURANCE_DATES_INVALID | ERR_EVENT_NOT_ENDED"
    http_status: 409
    applies_to: "POST /permits/applications/{id}/submit, /permits/inspections, /permits/insurance-policies/{id}/accept, /permits/reports"

  - priority: 9
    category: business_constraint
    check: "Segregation of duties: the issuing clerk (X-User-ID) must not be the recorded_by of any AgencyReview for the application"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /permits/applications/{id}/approve"

  - priority: 10
    category: business_fiscal
    check: "Balance must be fully paid before issuance; deny path requires a rejected review; payment amount positive; unresolved violations block close"
    error_id: "ERR_OUTSTANDING_BALANCE | ERR_NO_REJECTED_REVIEW | ERR_INVALID_PAYMENT_AMOUNT | ERR_UNRESOLVED_VIOLATIONS"
    http_status: 402
    applies_to: "POST /permits/applications/{id}/issue-permit, /deny, /payments, /close"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Venue ----
  - { method: POST, path: "/permits/venues", description: "Create a venue", roles: [PermitClerk], code: 201, input: [name, address, occupancy_limit, "indoor?"], output: Venue, side_effects: [] }
  - { method: GET, path: "/permits/venues/{id}", description: "Get a venue", roles: [Applicant, PermitClerk, AgencyReviewer, Inspector], code: 200, input: [], output: Venue, side_effects: [] }

  # ---- Inspector ----
  - { method: POST, path: "/permits/inspectors", description: "Create an inspector", roles: [PermitClerk], code: 201, input: [name, badge_number, agency], output: Inspector, side_effects: [] }
  - { method: GET, path: "/permits/inspectors/{id}", description: "Get an inspector", roles: [Applicant, PermitClerk, AgencyReviewer, Inspector], code: 200, input: [], output: Inspector, side_effects: [] }

  # ---- PermitApplication ----
  - method: POST
    path: "/permits/applications"
    description: "Create a draft permit application"
    roles: [Applicant]
    code: 201
    input: [venue_id, organizer_name, event_name, event_start, event_end, alcohol_service_hours, expected_attendance, requested_sales_limit_cents]
    output: PermitApplication
    side_effects: ["status=DRAFT; balance_due_cents=0; deposit_status=NONE"]
  - { method: GET, path: "/permits/applications", description: "List applications (filter by venue_id or status)", roles: [Applicant, PermitClerk, AgencyReviewer, Inspector], code: 200, input: ["venue_id?", "status?", "limit?", "offset?"], output: "PermitApplication[]", side_effects: [] }
  - { method: GET, path: "/permits/applications/{id}", description: "Get an application", roles: [Applicant, PermitClerk, AgencyReviewer, Inspector], code: 200, input: [], output: PermitApplication, side_effects: [] }
  - { method: POST, path: "/permits/applications/{id}/submit", description: "Submit a draft application", roles: [Applicant], code: 200, input: [], output: PermitApplication, side_effects: ["compute ESTIMATED permit_fee; assess deposit; post FEE and DEPOSIT ledger entries; DRAFT->SUBMITTED"] }
  - { method: POST, path: "/permits/applications/{id}/open-review", description: "Open multi-agency review", roles: [PermitClerk], code: 200, input: [], output: PermitApplication, side_effects: ["create AgencyReview per REQUIRED_AGENCIES; SUBMITTED->UNDER_REVIEW"] }
  - { method: POST, path: "/permits/applications/{id}/request-revisions", description: "Send application back for revisions", roles: [PermitClerk], code: 200, input: [], output: PermitApplication, side_effects: ["reset all AgencyReviews to PENDING; UNDER_REVIEW->REVISIONS_REQUESTED"] }
  - { method: POST, path: "/permits/applications/{id}/resubmit", description: "Resubmit after revisions", roles: [Applicant], code: 200, input: [], output: PermitApplication, side_effects: ["REVISIONS_REQUESTED->UNDER_REVIEW"] }
  - { method: POST, path: "/permits/applications/{id}/approve", description: "Approve application (all signoffs complete)", roles: [PermitClerk], code: 200, input: [], output: PermitApplication, side_effects: ["UNDER_REVIEW->APPROVED"] }
  - { method: POST, path: "/permits/applications/{id}/deny", description: "Deny application", roles: [PermitClerk], code: 200, input: [], output: PermitApplication, side_effects: ["refund payments; UNDER_REVIEW->DENIED"] }
  - { method: POST, path: "/permits/applications/{id}/issue-permit", description: "Issue the temporary permit", roles: [PermitClerk], code: 200, input: [], output: PermitApplication, side_effects: ["assign permit_number; deposit_status=HELD; APPROVED->PERMIT_ISSUED"] }
  - { method: POST, path: "/permits/applications/{id}/close", description: "Close application after report", roles: [PermitClerk], code: 200, input: [], output: PermitApplication, side_effects: ["compute deposit_refund; post refund/forfeit ledger; accept report; EVENT_COMPLETE->CLOSED"] }
  - method: POST
    path: "/permits/applications/{id}/payments"
    description: "Record a payment against the application balance (OCC-guarded)"
    roles: [Applicant]
    code: 201
    input: [amount_cents, expected_application_version]
    output: LedgerEntry
    side_effects: ["append PAYMENT LedgerEntry (-amount_cents); recompute balance_due_cents; increments PermitApplication.version by 1"]

  # ---- EventServer ----
  - { method: POST, path: "/permits/servers", description: "Add an event server", roles: [Applicant], code: 201, input: [application_id, full_name, cert_number, training_provider, cert_issued_date, cert_expiry_date], output: EventServer, side_effects: ["status=PENDING"] }
  - { method: GET, path: "/permits/servers", description: "List servers (filter by application_id)", roles: [Applicant, PermitClerk, AgencyReviewer, Inspector], code: 200, input: ["application_id?", "limit?", "offset?"], output: "EventServer[]", side_effects: [] }
  - { method: GET, path: "/permits/servers/{id}", description: "Get a server", roles: [Applicant, PermitClerk, AgencyReviewer, Inspector], code: 200, input: [], output: EventServer, side_effects: [] }
  - { method: POST, path: "/permits/servers/{id}/verify", description: "Verify a server's training cert", roles: [PermitClerk], code: 200, input: [], output: EventServer, side_effects: ["PENDING->VERIFIED"] }

  # ---- InsurancePolicy ----
  - { method: POST, path: "/permits/insurance-policies", description: "Submit an insurance policy", roles: [Applicant], code: 201, input: [application_id, insurer_name, coverage_cents, effective_date, expiry_date], output: InsurancePolicy, side_effects: ["status=SUBMITTED"] }
  - { method: GET, path: "/permits/insurance-policies", description: "List insurance policies (filter by application_id)", roles: [Applicant, PermitClerk, AgencyReviewer, Inspector], code: 200, input: ["application_id?", "limit?", "offset?"], output: "InsurancePolicy[]", side_effects: [] }
  - { method: GET, path: "/permits/insurance-policies/{id}", description: "Get an insurance policy", roles: [Applicant, PermitClerk, AgencyReviewer, Inspector], code: 200, input: [], output: InsurancePolicy, side_effects: [] }
  - { method: POST, path: "/permits/insurance-policies/{id}/accept", description: "Accept an insurance policy", roles: [PermitClerk], code: 200, input: [], output: InsurancePolicy, side_effects: ["SUBMITTED->ACCEPTED"] }

  # ---- SecurityPlan ----
  - { method: POST, path: "/permits/security-plans", description: "Submit a security plan", roles: [Applicant], code: 201, input: [application_id, planned_guard_count, plan_summary, "has_medical_staff?"], output: SecurityPlan, side_effects: ["status=SUBMITTED; required_guard_count computed"] }
  - { method: GET, path: "/permits/security-plans", description: "List security plans (filter by application_id)", roles: [Applicant, PermitClerk, AgencyReviewer, Inspector], code: 200, input: ["application_id?", "limit?", "offset?"], output: "SecurityPlan[]", side_effects: [] }
  - { method: GET, path: "/permits/security-plans/{id}", description: "Get a security plan", roles: [Applicant, PermitClerk, AgencyReviewer, Inspector], code: 200, input: [], output: SecurityPlan, side_effects: [] }
  - { method: POST, path: "/permits/security-plans/{id}/approve", description: "Approve a security plan", roles: [PermitClerk], code: 200, input: [], output: SecurityPlan, side_effects: ["SUBMITTED->APPROVED"] }

  # ---- AgencyReview ----
  - { method: GET, path: "/permits/agency-reviews", description: "List agency reviews (filter by application_id)", roles: [Applicant, PermitClerk, AgencyReviewer, Inspector], code: 200, input: ["application_id?", "limit?", "offset?"], output: "AgencyReview[]", side_effects: [] }
  - { method: GET, path: "/permits/agency-reviews/{id}", description: "Get an agency review", roles: [Applicant, PermitClerk, AgencyReviewer, Inspector], code: 200, input: [], output: AgencyReview, side_effects: [] }
  - method: POST
    path: "/permits/agency-reviews/{id}/decide"
    description: "Record an agency decision (OCC-guarded)"
    roles: [AgencyReviewer]
    code: 200
    input: [decision, "conditions?", expected_application_version]
    output: AgencyReview
    side_effects: ["set review status; update application review counts; increments PermitApplication.version by 1"]

  # ---- Inspection ----
  - method: POST
    path: "/permits/inspections"
    description: "Schedule an inspection for an approved application"
    roles: [PermitClerk]
    code: 201
    input: [application_id, inspector_id, scheduled_start, scheduled_end]
    output: Inspection
    side_effects: ["status=SCHEDULED"]
  - { method: GET, path: "/permits/inspections", description: "List inspections (filter by application_id or inspector_id)", roles: [Applicant, PermitClerk, AgencyReviewer, Inspector], code: 200, input: ["application_id?", "inspector_id?", "limit?", "offset?"], output: "Inspection[]", side_effects: [] }
  - { method: GET, path: "/permits/inspections/{id}", description: "Get an inspection", roles: [Applicant, PermitClerk, AgencyReviewer, Inspector], code: 200, input: [], output: Inspection, side_effects: [] }
  - { method: POST, path: "/permits/inspections/{id}/record-result", description: "Record inspection result", roles: [Inspector], code: 200, input: [result], output: Inspection, side_effects: ["SCHEDULED->PASSED or SCHEDULED->FAILED (FAILED cascades application to REVOKED)"] }

  # ---- Violation ----
  - { method: POST, path: "/permits/violations", description: "Issue a violation against an inspection", roles: [Inspector], code: 201, input: [inspection_id, severity, description], output: Violation, side_effects: ["compute fine_cents (STANDARD/REPEAT); append FINE ledger entry; status=ISSUED"] }
  - { method: GET, path: "/permits/violations", description: "List violations (filter by inspection_id)", roles: [Applicant, PermitClerk, AgencyReviewer, Inspector], code: 200, input: ["inspection_id?", "limit?", "offset?"], output: "Violation[]", side_effects: [] }
  - { method: GET, path: "/permits/violations/{id}", description: "Get a violation", roles: [Applicant, PermitClerk, AgencyReviewer, Inspector], code: 200, input: [], output: Violation, side_effects: [] }
  - { method: POST, path: "/permits/violations/{id}/contest", description: "Contest a violation", roles: [Applicant], code: 200, input: [], output: Violation, side_effects: ["ISSUED->CONTESTED"] }
  - { method: POST, path: "/permits/violations/{id}/resolve", description: "Resolve a contested violation", roles: [PermitClerk], code: 200, input: [decision], output: Violation, side_effects: ["CONTESTED->UPHELD or CONTESTED->DISMISSED (DISMISSED reverses the FINE)"] }

  # ---- LedgerEntry ----
  - { method: GET, path: "/permits/ledger-entries", description: "List ledger entries (filter by application_id)", roles: [Applicant, PermitClerk, AgencyReviewer, Inspector], code: 200, input: ["application_id?", "limit?", "offset?"], output: "LedgerEntry[]", side_effects: [] }
  - { method: GET, path: "/permits/ledger-entries/{id}", description: "Get a ledger entry", roles: [Applicant, PermitClerk, AgencyReviewer, Inspector], code: 200, input: [], output: LedgerEntry, side_effects: [] }

  # ---- PostEventReport ----
  - method: POST
    path: "/permits/reports"
    description: "File a post-event report (cascades application to EVENT_COMPLETE)"
    roles: [Applicant]
    code: 201
    input: [application_id, actual_attendance, gross_sales_cents, "incident_count?"]
    output: PostEventReport
    side_effects: ["reconcile permit_fee; post FEE_ADJUSTMENT; application PERMIT_ISSUED->EVENT_COMPLETE; status=FILED"]
  - { method: GET, path: "/permits/reports", description: "List reports (filter by application_id)", roles: [Applicant, PermitClerk, AgencyReviewer, Inspector], code: 200, input: ["application_id?", "limit?", "offset?"], output: "PostEventReport[]", side_effects: [] }
  - { method: GET, path: "/permits/reports/{id}", description: "Get a report", roles: [Applicant, PermitClerk, AgencyReviewer, Inspector], code: 200, input: [], output: PostEventReport, side_effects: [] }

  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z (at or before every default fixture date); before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Applicant, PermitClerk, AgencyReviewer, Inspector]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing/invalid body field, bad type, or attendance > venue.occupancy_limit at submit" }
  - { id: ERR_INVALID_ENUM, http: 422, condition: "Enum field value outside the allowed set" }
  - { id: ERR_INVALID_DATE_RANGE, http: 400, condition: "event_end <= event_start, or scheduled_end <= scheduled_start" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "Application id does not exist" }
  - { id: ERR_VENUE_NOT_FOUND, http: 404, condition: "venue_id does not exist" }
  - { id: ERR_INSPECTOR_NOT_FOUND, http: 404, condition: "inspector_id does not exist" }
  - { id: ERR_SERVER_NOT_FOUND, http: 404, condition: "server id does not exist" }
  - { id: ERR_INSURANCE_NOT_FOUND, http: 404, condition: "insurance policy id does not exist" }
  - { id: ERR_SECURITY_PLAN_NOT_FOUND, http: 404, condition: "security plan id does not exist" }
  - { id: ERR_AGENCY_REVIEW_NOT_FOUND, http: 404, condition: "agency review id does not exist" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "inspection id does not exist" }
  - { id: ERR_VIOLATION_NOT_FOUND, http: 404, condition: "violation id does not exist" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "report id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic wrong-state for the operation (resubmit, verify, accept, approve-plan, resolve, close)" }
  - { id: ERR_APPLICATION_NOT_DRAFT, http: 409, condition: "submit requires DRAFT" }
  - { id: ERR_APPLICATION_NOT_SUBMITTED, http: 409, condition: "open-review requires SUBMITTED" }
  - { id: ERR_APPLICATION_NOT_UNDER_REVIEW, http: 409, condition: "request-revisions/approve/deny/decide require UNDER_REVIEW" }
  - { id: ERR_APPLICATION_NOT_APPROVED, http: 409, condition: "issue-permit requires APPROVED" }
  - { id: ERR_REVIEW_NOT_PENDING, http: 409, condition: "decide requires the review to be PENDING" }
  - { id: ERR_INSPECTION_NOT_SCHEDULED, http: 409, condition: "record-result requires SCHEDULED" }
  - { id: ERR_VIOLATION_NOT_CONTESTABLE, http: 409, condition: "contest requires the violation to be ISSUED" }
  - { id: ERR_MISSING_REQUIRED_DOCUMENTS, http: 422, condition: "submit requires >=1 server, >=1 insurance policy, >=1 security plan" }
  - { id: ERR_REVIEWS_NOT_ALL_APPROVED, http: 409, condition: "approve requires approved_review_count == total_review_count" }
  - { id: ERR_SERVERS_NOT_ALL_VERIFIED, http: 409, condition: "approve requires all servers VERIFIED" }
  - { id: ERR_INSURANCE_NOT_ACCEPTED, http: 409, condition: "approve requires an ACCEPTED insurance policy" }
  - { id: ERR_SECURITY_PLAN_NOT_APPROVED, http: 409, condition: "approve requires an APPROVED security plan" }
  - { id: ERR_INSPECTION_NOT_PASSED, http: 409, condition: "issue-permit requires an inspection with result PASSED" }
  - { id: ERR_CERT_EXPIRED, http: 422, condition: "server cert_expiry_date < event_end at verify" }
  - { id: ERR_INSUFFICIENT_SECURITY, http: 422, condition: "planned_guard_count < required_security_guards at plan approve" }
  - { id: ERR_INSUFFICIENT_COVERAGE, http: 422, condition: "coverage_cents < required tier at insurance accept" }
  - { id: ERR_INSURANCE_DATES_INVALID, http: 422, condition: "policy dates do not span [event_start, event_end]" }
  - { id: ERR_SUBMISSION_TOO_LATE, http: 409, condition: "clock > event_start - MIN_SUBMISSION_LEAD_DAYS at submit" }
  - { id: ERR_VENUE_DOUBLE_BOOKED, http: 409, condition: "another active application's event interval overlaps on the same venue" }
  - { id: ERR_INSPECTOR_UNAVAILABLE, http: 409, condition: "inspector has another inspection within INSPECTION_BUFFER_MINUTES (=60) of the requested window" }
  - { id: ERR_EVENT_NOT_ENDED, http: 409, condition: "report filed before clock >= event_end" }
  - { id: ERR_OUTSTANDING_BALANCE, http: 402, condition: "issue-permit requires balance_due_cents == 0" }
  - { id: ERR_NO_REJECTED_REVIEW, http: 409, condition: "deny requires rejected_review_count >= 1" }
  - { id: ERR_INVALID_PAYMENT_AMOUNT, http: 400, condition: "payment amount_cents <= 0" }
  - { id: ERR_UNRESOLVED_VIOLATIONS, http: 409, condition: "close requires no violation in ISSUED or CONTESTED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "approving clerk X-User-ID equals a reviewer's recorded_by on the application" }
  - { id: ERR_INSPECTOR_MISMATCH, http: 403, condition: "recording inspector X-User-ID != inspection.inspector_id" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_application_version != application.version" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Applicant
    description: "Event organizer applying for the temporary permit and filing supporting docs and the post-event report"
    identity: "opaque"
    exclusive_operations:
      - "POST /permits/applications — create application"
      - "POST /permits/applications/{id}/submit"
      - "POST /permits/applications/{id}/resubmit"
      - "POST /permits/applications/{id}/payments"
      - "POST /permits/servers — add server"
      - "POST /permits/insurance-policies — submit insurance"
      - "POST /permits/security-plans — submit security plan"
      - "POST /permits/violations/{id}/contest"
      - "POST /permits/reports — file report"
    shared_operations:
      - "GET (all read endpoints)"
      - "POST /_clock/set_current_utc"

  - name: PermitClerk
    description: "Licensing authority staff who administer venues, inspectors, review workflow, issuance, fees, and closeout"
    identity: "opaque"
    exclusive_operations:
      - "POST /permits/venues, POST /permits/inspectors"
      - "POST /permits/applications/{id}/open-review, /request-revisions, /approve, /deny, /issue-permit, /close"
      - "POST /permits/servers/{id}/verify"
      - "POST /permits/insurance-policies/{id}/accept"
      - "POST /permits/security-plans/{id}/approve"
      - "POST /permits/inspections — schedule inspection"
      - "POST /permits/violations/{id}/resolve"
    shared_operations:
      - "GET (all read endpoints)"
      - "POST /_clock/set_current_utc"

  - name: AgencyReviewer
    description: "Agency representatives (police, fire, alcohol board) who record signoff decisions"
    identity: "opaque"
    exclusive_operations:
      - "POST /permits/agency-reviews/{id}/decide"
    shared_operations:
      - "GET (all read endpoints)"
      - "POST /_clock/set_current_utc"

  - name: Inspector
    description: "Field inspector who records inspection results and issues violations"
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /permits/inspections/{id}/record-result"
      - "POST /permits/violations — issue violation"
    shared_operations:
      - "GET (all read endpoints)"
      - "POST /_clock/set_current_utc"
