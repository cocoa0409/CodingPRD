# =============================================================================
# 1.8 Scaffold Difficulty Design — Test Targeting Index
# Accounts Payable Vendor Master & Payment Fraud Controls
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_discount_provisional_vs_final
        grounds:
          - calculations.invoice_pay_amount
          - entities.Invoice.fields.provisional_discount_cents
          - entities.Payment.fields.discount_applied_cents
        distinguishing_aspect: |
          Invoice-domain dual variant: the SAME invoice yields provisional_discount_cents == 1000
          at approval (clock date inside window) but discount_applied_cents == 0 on the payment
          (run scheduled past window end) — two valid date references, two different cents values.
        test_recipe:
          setup:
            - "Vendor 'Discount Mills' ACTIVE, bank primary VERIFIED 2026-08-01, discount 2% / 10-day window"
            - "GLOBAL matrix rule [0,500000) tier 1"
            - "Invoice 50000 received 2026-08-01, approved 2026-08-05 (in-window); run scheduled 2026-08-15 (past window end 2026-08-11)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
            - { call: "POST /approval-matrix-rules", payload: { cost_center: "GLOBAL", min_amount_cents: 0, max_amount_cents: 500000, tier: 1 }, as: Controller, as_user_id: "u-ctl-01" }
            - call: "POST /vendors"
              payload: { legal_name: "Discount Mills", tax_id: "10-0000001", remit_email: "ap@dm.com", phone: "+1-555-0100", address_line1: "1 Main St", city: "Springfield", country: "US", early_pay_discount_pct: 0.02, discount_window_days: 10 }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { v_id: $.data.id }
            - { call: "POST /vendors/${v_id}/documents", payload: { doc_type: "W9", valid_from: "2026-01-01", valid_until: "2027-12-31" }, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/submit", payload: {}, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/approve", payload: {}, as: VendorManager, as_user_id: "u-vm-01", captures: { v_ver: $.data.version } }
            - call: "POST /vendors/${v_id}/bank-accounts"
              payload: { account_number: "000123456789", routing_number: "021000021", account_holder_name: "Discount Mills", is_primary: true, expected_vendor_version: "${v_ver}" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { ba_id: $.data.id }
            - { call: "GET /bank-accounts/${ba_id}/callback-verifications", payload: {}, as: Auditor, as_user_id: "u-aud-01", captures: { cb_code: "$.data[0].verification_code" } }
            - { call: "POST /bank-accounts/${ba_id}/confirm-verification", payload: { verification_code: "${cb_code}" }, as: VendorManager, as_user_id: "u-vm-01" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
            - call: "POST /invoices"
              payload: { vendor_id: "${v_id}", invoice_number: "INV-5001", amount_cents: 50000, cost_center: "CC-100", received_date: "2026-08-01" }
              as: APClerk
              as_user_id: "u-ap-01"
              captures: { inv_id: $.data.id }
            - { call: "POST /invoices/${inv_id}/submit", payload: {}, as: APClerk, as_user_id: "u-ap-01" }
            - { call: "POST /invoices/${inv_id}/approve", payload: { tier: 1 }, as: APSupervisor, as_user_id: "u-sup-01" }
            - { call: "POST /invoices/${inv_id}/approve", payload: { tier: 2 }, as: APManager, as_user_id: "u-mgr-01" }
            - { call: "POST /payment-runs", payload: { scheduled_date: "2026-08-15", payment_method: "CHECK" }, as: TreasuryAnalyst, as_user_id: "u-ta-01", captures: { run_id: $.data.id } }
          trigger:
            - { call: "POST /payment-runs/${run_id}/invoices", payload: { invoice_id: "${inv_id}" }, as: TreasuryAnalyst, as_user_id: "u-ta-01", captures: { pay_id: $.data.id } }
          assert:
            - "Invoice.${inv_id}.required_tier == 2  (base 1 + new-vendor bump; bank already 96h old)"
            - "Invoice.${inv_id}.provisional_discount_cents == 1000"
            - "Payment.${pay_id}.discount_applied_cents == 0"
            - "Payment.${pay_id}.net_amount_cents == 50000"
            - "GET /payment-runs/${run_id}: total_amount_cents == 50000 and item_count == 1"

      - name: duplicate_detection_strict_passes_relaxed_blocks
        grounds:
          - calculations.duplicate_vendor_detection
          - calculations.name_similarity_score
          - validations[priority=13]
        distinguishing_aspect: |
          Vendor-domain dual variant: strict (tax_id + exact normalized name) finds no duplicate for
          'Northwind Trader' vs 'Northwind Traders', while relaxed trigram Dice scores 0.9630 >= 0.9000
          and hard-blocks — identical input, divergent verdict per variant; relaxed is the enforced one.
        test_recipe:
          setup:
            - "Vendor 'Northwind Traders' (tax 11-1111111) exists in DRAFT"
          setup_api_calls:
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Traders", tax_id: "11-1111111", remit_email: "ap@nt.com", phone: "+1-555-0200", address_line1: "2 Pine St", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
          trigger:
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Trader", tax_id: "22-2222222", remit_email: "ap@nt2.com", phone: "+1-555-0201", address_line1: "3 Pine St", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { err: $.data.error_id }
            - { call: "GET /vendors", payload: { name_contains: "Northwind" }, as: Auditor, as_user_id: "u-aud-01" }
          assert:
            - "trigger error_id == ERR_DUPLICATE_VENDOR_HARD_BLOCK (relaxed Dice 0.9630 >= 0.9000 while strict found no exact match)"
            - "GET /vendors?name_contains=Northwind: total_count == 1 (no second vendor persisted)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tier_routing_compound_bumps_capped
        grounds:
          - calculations.invoice_approval_routing
          - entities.Invoice.fields.required_tier
        distinguishing_aspect: |
          Mode (a) combinatorial: base tier 2 from the [500000,1000000) bracket, +1 new-vendor bump
          (10 days < 30), +1 recent-bank bump (24h < 72h), raw 4 capped to MAX_TIER 3 — one formula
          with 3+ inputs, conditional state branches and a min() cap.
        test_recipe:
          setup:
            - "GLOBAL rules: [0,500000) t1, [500000,1000000) t2, [1000000,inf) t3"
            - "Vendor activated 2026-08-01T00:00:00Z; primary bank VERIFIED 2026-08-10T00:00:00Z"
            - "Invoice 750000 cost_center CC-100 created and submitted at 2026-08-11T00:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
            - { call: "POST /approval-matrix-rules", payload: { cost_center: "GLOBAL", min_amount_cents: 0, max_amount_cents: 500000, tier: 1 }, as: Controller, as_user_id: "u-ctl-01" }
            - { call: "POST /approval-matrix-rules", payload: { cost_center: "GLOBAL", min_amount_cents: 500000, max_amount_cents: 1000000, tier: 2 }, as: Controller, as_user_id: "u-ctl-01" }
            - { call: "POST /approval-matrix-rules", payload: { cost_center: "GLOBAL", min_amount_cents: 1000000, tier: 3 }, as: Controller, as_user_id: "u-ctl-01" }
            - call: "POST /vendors"
              payload: { legal_name: "Capstone Materials", tax_id: "10-0000002", remit_email: "ap@cm.com", phone: "+1-555-0300", address_line1: "4 Oak St", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { v_id: $.data.id }
            - { call: "POST /vendors/${v_id}/documents", payload: { doc_type: "W9", valid_from: "2026-01-01", valid_until: "2027-12-31" }, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/submit", payload: {}, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/approve", payload: {}, as: VendorManager, as_user_id: "u-vm-01", captures: { v_ver: $.data.version } }
            - call: "POST /vendors/${v_id}/bank-accounts"
              payload: { account_number: "000987654321", routing_number: "021000021", account_holder_name: "Capstone Materials", is_primary: true, expected_vendor_version: "${v_ver}" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { ba_id: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
            - { call: "GET /bank-accounts/${ba_id}/callback-verifications", payload: {}, as: Auditor, as_user_id: "u-aud-01", captures: { cb_code: "$.data[0].verification_code" } }
            - { call: "POST /bank-accounts/${ba_id}/confirm-verification", payload: { verification_code: "${cb_code}" }, as: VendorManager, as_user_id: "u-vm-01" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
            - call: "POST /invoices"
              payload: { vendor_id: "${v_id}", invoice_number: "INV-7501", amount_cents: 750000, cost_center: "CC-100", received_date: "2026-08-11" }
              as: APClerk
              as_user_id: "u-ap-01"
              captures: { inv_id: $.data.id }
          trigger:
            - { call: "POST /invoices/${inv_id}/submit", payload: {}, as: APClerk, as_user_id: "u-ap-01" }
            - { call: "POST /invoices/${inv_id}/approve", payload: { tier: 1 }, as: APSupervisor, as_user_id: "u-sup-01" }
            - { call: "POST /invoices/${inv_id}/approve", payload: { tier: 2 }, as: APManager, as_user_id: "u-mgr-01" }
            - { call: "POST /invoices/${inv_id}/approve", payload: { tier: 3 }, as: Controller, as_user_id: "u-ctl-01" }
            - { call: "GET /invoices/${inv_id}/approvals", payload: {}, as: Auditor, as_user_id: "u-aud-01" }
          assert:
            - "Invoice.${inv_id}.required_tier == 3 (raw base2 + bump1 + bump1 = 4 capped at MAX_TIER 3)"
            - "After three ordered approvals Invoice.${inv_id}.status == APPROVED"
            - "GET approvals: total_count == 3 with approver_role sequence APSupervisor, APManager, Controller at tiers 1,2,3"

      - name: run_total_round_per_payment_then_sum
        grounds:
          - calculations.payment_run_totals
          - entities.Payment.fields.net_amount_cents
          - entities.PaymentRun.fields.total_amount_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: discounts rounded per payment (222 and 444) then summed give run
          total 32667; the FORBIDDEN sum-then-round order would give 32666 — the scaffold pins
          round-per-line-then-sum and the one-cent divergence is the observable.
        test_recipe:
          setup:
            - "Vendor aged (activated + bank verified 2026-06-01, so no tier bumps), discount 2% / 30-day window"
            - "GLOBAL rule [0,500000) t1; invoices 11111 and 22222 received 2026-08-01, both APPROVED tier1"
            - "CHECK run scheduled 2026-08-20 (inside discount window end 2026-08-31)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
            - { call: "POST /approval-matrix-rules", payload: { cost_center: "GLOBAL", min_amount_cents: 0, max_amount_cents: 500000, tier: 1 }, as: Controller, as_user_id: "u-ctl-01" }
            - call: "POST /vendors"
              payload: { legal_name: "Roundtrip Office", tax_id: "10-0000003", remit_email: "ap@ro.com", phone: "+1-555-0400", address_line1: "5 Elm St", city: "Springfield", country: "US", early_pay_discount_pct: 0.02, discount_window_days: 30 }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { v_id: $.data.id }
            - { call: "POST /vendors/${v_id}/documents", payload: { doc_type: "W9", valid_from: "2026-01-01", valid_until: "2027-12-31" }, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/submit", payload: {}, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/approve", payload: {}, as: VendorManager, as_user_id: "u-vm-01", captures: { v_ver: $.data.version } }
            - call: "POST /vendors/${v_id}/bank-accounts"
              payload: { account_number: "000111222333", routing_number: "021000021", account_holder_name: "Roundtrip Office", is_primary: true, expected_vendor_version: "${v_ver}" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { ba_id: $.data.id }
            - { call: "GET /bank-accounts/${ba_id}/callback-verifications", payload: {}, as: Auditor, as_user_id: "u-aud-01", captures: { cb_code: "$.data[0].verification_code" } }
            - { call: "POST /bank-accounts/${ba_id}/confirm-verification", payload: { verification_code: "${cb_code}" }, as: VendorManager, as_user_id: "u-vm-01" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
            - call: "POST /invoices"
              payload: { vendor_id: "${v_id}", invoice_number: "INV-11111", amount_cents: 11111, cost_center: "CC-100", received_date: "2026-08-01" }
              as: APClerk
              as_user_id: "u-ap-01"
              captures: { inv1: $.data.id }
            - { call: "POST /invoices/${inv1}/submit", payload: {}, as: APClerk, as_user_id: "u-ap-01" }
            - { call: "POST /invoices/${inv1}/approve", payload: { tier: 1 }, as: APSupervisor, as_user_id: "u-sup-01" }
            - call: "POST /invoices"
              payload: { vendor_id: "${v_id}", invoice_number: "INV-22222", amount_cents: 22222, cost_center: "CC-100", received_date: "2026-08-01" }
              as: APClerk
              as_user_id: "u-ap-01"
              captures: { inv2: $.data.id }
            - { call: "POST /invoices/${inv2}/submit", payload: {}, as: APClerk, as_user_id: "u-ap-01" }
            - { call: "POST /invoices/${inv2}/approve", payload: { tier: 1 }, as: APSupervisor, as_user_id: "u-sup-01" }
            - { call: "POST /payment-runs", payload: { scheduled_date: "2026-08-20", payment_method: "CHECK" }, as: TreasuryAnalyst, as_user_id: "u-ta-01", captures: { run_id: $.data.id } }
          trigger:
            - { call: "POST /payment-runs/${run_id}/invoices", payload: { invoice_id: "${inv1}" }, as: TreasuryAnalyst, as_user_id: "u-ta-01", captures: { pay1: $.data.id } }
            - { call: "POST /payment-runs/${run_id}/invoices", payload: { invoice_id: "${inv2}" }, as: TreasuryAnalyst, as_user_id: "u-ta-01", captures: { pay2: $.data.id } }
            - { call: "POST /payment-runs/${run_id}/compile", payload: {}, as: TreasuryAnalyst, as_user_id: "u-ta-01" }
          assert:
            - "Payment.${pay1}.discount_applied_cents == 222 and net_amount_cents == 10889"
            - "Payment.${pay2}.discount_applied_cents == 444 and net_amount_cents == 21778"
            - "PaymentRun.${run_id}.total_amount_cents == 32667 (NOT 32666, the sum-then-round result)"
            - "PaymentRun.${run_id}.item_count == 2"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: vendor_active_suspended_dormant_cycle
        grounds:
          - state_machines.Vendor.ACTIVE_to_SUSPENDED
          - state_machines.Vendor.SUSPENDED_to_ACTIVE
          - state_machines.Vendor.ACTIVE_to_DORMANT
          - state_machines.Vendor.DORMANT_to_ACTIVE
          - calculations.dormancy_evaluation
        distinguishing_aspect: |
          Vendor machine is cyclic: ACTIVE -> SUSPENDED -> ACTIVE -> DORMANT -> ACTIVE all reachable
          on one row; the DORMANT leg is entered only by the sweep once now - first_activated_at >= 180d.
        test_recipe:
          setup:
            - "Vendor 'Cycle Parts' onboarded to ACTIVE at 2026-01-01T00:00:00Z, no invoices, no cleared payments"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
            - call: "POST /vendors"
              payload: { legal_name: "Cycle Parts", tax_id: "10-0000004", remit_email: "ap@cp.com", phone: "+1-555-0500", address_line1: "6 Birch St", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { v_id: $.data.id }
            - { call: "POST /vendors/${v_id}/documents", payload: { doc_type: "W9", valid_from: "2025-01-01", valid_until: "2027-12-31" }, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/submit", payload: {}, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/approve", payload: {}, as: VendorManager, as_user_id: "u-vm-01" }
          trigger:
            - { call: "POST /vendors/${v_id}/suspend", payload: { reason: "audit" }, as: VendorManager, as_user_id: "u-vm-01" }
            - { call: "POST /vendors/${v_id}/reinstate", payload: {}, as: VendorManager, as_user_id: "u-vm-01" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
            - { call: "POST /vendor-sweeps/run", payload: {}, as: SystemAdmin, as_user_id: "u-sys-01", captures: { swept_dormant: "$.data.vendors_marked_dormant" } }
            - { call: "POST /vendors/${v_id}/reactivate", payload: {}, as: VendorManager, as_user_id: "u-vm-01" }
          assert:
            - "After suspend: Vendor.${v_id}.status == SUSPENDED"
            - "After reinstate: status == ACTIVE"
            - "Sweep at 2026-08-01 (212 days since first_activated_at 2026-01-01): vendors_marked_dormant == 1 and vendor status == DORMANT with dormant_since_at == 2026-08-01T00:00:00Z"
            - "After reactivate (screening CLEAR): status == ACTIVE and dormant_since_at == null"

      - name: invoice_reject_resubmit_resnapshots_tier
        grounds:
          - state_machines.Invoice.PENDING_APPROVAL_to_REJECTED
          - state_machines.Invoice.REJECTED_to_PENDING_APPROVAL
          - calculations.invoice_approval_routing
          - entities.Invoice.fields.approval_round
        distinguishing_aspect: |
          Invoice machine cycles PENDING_APPROVAL -> REJECTED -> PENDING_APPROVAL; the resubmit
          RE-SNAPSHOTS required_tier against the CURRENT matrix (retire tier-2 rule, create tier-1
          rule) so the same invoice needs fewer approvals in round 2, and SoD-5 is scoped per round
          (round-1 tier-1 approver may approve tier 1 again in round 2).
        test_recipe:
          setup:
            - "GLOBAL rule [0,500000) tier 2 initially; aged vendor (activated 2026-06-01), invoice 100000"
            - "Round 1: submit -> tier 2; APSupervisor approves tier 1; APManager rejects at tier 2"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
            - call: "POST /approval-matrix-rules"
              payload: { cost_center: "GLOBAL", min_amount_cents: 0, max_amount_cents: 500000, tier: 2 }
              as: Controller
              as_user_id: "u-ctl-01"
              captures: { rule_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "Resubmit Traders", tax_id: "10-0000005", remit_email: "ap@rt.com", phone: "+1-555-0600", address_line1: "7 Cedar St", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { v_id: $.data.id }
            - { call: "POST /vendors/${v_id}/documents", payload: { doc_type: "W9", valid_from: "2026-01-01", valid_until: "2027-12-31" }, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/submit", payload: {}, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/approve", payload: {}, as: VendorManager, as_user_id: "u-vm-01" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
            - call: "POST /invoices"
              payload: { vendor_id: "${v_id}", invoice_number: "INV-7701", amount_cents: 100000, cost_center: "CC-100", received_date: "2026-08-01" }
              as: APClerk
              as_user_id: "u-ap-01"
              captures: { inv_id: $.data.id }
            - { call: "POST /invoices/${inv_id}/submit", payload: {}, as: APClerk, as_user_id: "u-ap-01" }
            - { call: "POST /invoices/${inv_id}/approve", payload: { tier: 1 }, as: APSupervisor, as_user_id: "u-sup-01" }
          trigger:
            - { call: "POST /invoices/${inv_id}/reject", payload: { tier: 2, reason: "wrong cost center" }, as: APManager, as_user_id: "u-mgr-01" }
            - { call: "POST /approval-matrix-rules/${rule_id}/retire", payload: {}, as: Controller, as_user_id: "u-ctl-01" }
            - { call: "POST /approval-matrix-rules", payload: { cost_center: "GLOBAL", min_amount_cents: 0, max_amount_cents: 500000, tier: 1 }, as: Controller, as_user_id: "u-ctl-01" }
            - { call: "POST /invoices/${inv_id}/resubmit", payload: {}, as: APClerk, as_user_id: "u-ap-01" }
            - { call: "POST /invoices/${inv_id}/approve", payload: { tier: 1 }, as: APSupervisor, as_user_id: "u-sup-01" }
            - { call: "GET /invoices/${inv_id}/approvals", payload: {}, as: Auditor, as_user_id: "u-aud-01" }
          assert:
            - "After reject: Invoice.${inv_id}.status == REJECTED"
            - "Round 1 snapshot had required_tier == 2; after resubmit approval_round == 2 and required_tier == 1 (re-snapshot against the replacement rule)"
            - "Round-2 approve by the SAME user u-sup-01 who approved tier 1 in round 1 succeeds (SoD-5 is per-round) and status == APPROVED"
