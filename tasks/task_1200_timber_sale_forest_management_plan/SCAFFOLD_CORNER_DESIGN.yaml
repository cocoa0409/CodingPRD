      - name: stop_work_cascade_covered_by_difficulty
        claim_type: n_level_chain
        grounds: [state_machines.HarvestContract.HARVESTING_to_SUSPENDED]
        excluded_because:
          difficulty_instance: transitive_cascade / inspection_stop_work_depth3_chain
          rationale: "The three-hop suspend cascade (contract -> tickets -> settlements) is asserted there end-to-end."

      - name: dispute_cycle_covered_by_difficulty
        claim_type: invalid_transition
        grounds: [state_machines.ScaleTicket.VERIFIED_to_DISPUTED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / scale_ticket_dispute_cycle
          rationale: "The VERIFIED -> DISPUTED -> VERIFIED loop including cumulative_verified_bf recompute is asserted there."
