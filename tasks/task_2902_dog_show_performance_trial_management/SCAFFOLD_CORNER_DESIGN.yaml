          setup:
            - "Show Autumn Classic (${show_id}) is IN_PROGRESS on SCALE_A and class B1 (${c1_id}) is CLOSED with both of its entries CHECKED_IN: Ripple (${e1_id}) and Bramble (${e2_id})."
