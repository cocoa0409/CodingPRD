            - "r2_amt == 24806.61"
            - "revenue == 49613.22  (24806.61 + 24806.61, per-run-rounded then summed)"
            - "revenue != 49613.19  (the forbidden sum-then-round of unrounded 24806.5963 components)"
            - "SupplyAgreement.${agr_id}.ytd_settled_units == 15554"
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: supply_agreement_renegotiation_cycle_active_renegotiating_active
        grounds:
          - state_machines.SupplyAgreement.ACTIVE_to_RENEGOTIATING
          - state_machines.SupplyAgreement.RENEGOTIATING_to_ACTIVE
        distinguishing_aspect: |
          Cyclic machine on SupplyAgreement: ACTIVE -> RENEGOTIATING -> ACTIVE -> RENEGOTIATING
          -> ACTIVE completes two full loops, each amend superseding conversion terms
          (1500 -> 1600 -> 1700) and each transition bumping version by exactly 1
          (1 -> 6 across the chain).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Plant and customer exist; agreement committed 12000000, pass 0.9, conversion 1500, 2026-01-01..2026-12-31, freshly created (DRAFT, version 1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plants"
              payload: { name: "P", region: "US-SW", warehouse_capacity_units: 1000000 }
              as: PlatformAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "C", home_region: "US-SW", filling_lines_count: 1 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /supply-agreements"
              payload: { plant_id: "${plant_id}", customer_id: "${cust_id}", committed_annual_units: 12000000, pass_through_pct: 0.9, conversion_cost_cents_per_1000: 1500, start_date: "2026-01-01", end_date: "2026-12-31" }
              as: PlantManager
              captures: { agr_id: $.data.id, v1: $.data.version }
            - call: "POST /supply-agreements/${agr_id}/sign"
              payload: {}
              as: CustomerPlanner
              as_user_id: "${cust_id}"
              captures: { v2: $.data.version }
            - call: "POST /supply-agreements/${agr_id}/open-renegotiation"
              payload: {}
              as: CustomerPlanner
              as_user_id: "${cust_id}"
              captures: { v3: $.data.version }
          trigger:
            - call: "POST /supply-agreements/${agr_id}/amend"
              payload: { expected_agreement_version: "${v3}", conversion_cost_cents_per_1000: 1600 }
              as: PlantManager
              captures: { v4: $.data.version, st4: $.data.status }
            - call: "POST /supply-agreements/${agr_id}/open-renegotiation"
              payload: {}
              as: CustomerPlanner
              as_user_id: "${cust_id}"
              captures: { v5: $.data.version, st5: $.data.status }
            - call: "POST /supply-agreements/${agr_id}/amend"
              payload: { expected_agreement_version: "${v5}", conversion_cost_cents_per_1000: 1700 }
              as: PlantManager
              captures: { v6: $.data.version, st6: $.data.status }
          assert:
            - "v1 == 1 and v2 == 2 and v3 == 3 and v4 == 4 and v5 == 5 and v6 == 6"
            - "st4 == ACTIVE and st5 == RENEGOTIATING and st6 == ACTIVE — the cycle looped twice"
            - "SupplyAgreement.${agr_id}.conversion_cost_cents_per_1000 == 1700 after the second amend"
            - "SupplyAgreement.${agr_id}.pass_through_pct == 0.9 (untouched fields preserved across amends)"

      - name: production_run_hold_resume_cycle_driven_by_incidents
        grounds:
          - state_machines.ProductionRun.IN_PROGRESS_to_HELD
