      - name: unified_tod_basis_scores_tot_certificate_on_band_key_allowance
        claim_type: variant_selection
        grounds:
          - calculations.corrected_time
          - calculations.corrected_time.variants.TIME_ON_DISTANCE
          - entities.Regatta.fields.handicap_basis
        distinguishing_aspect: |
          A TOT_ORC certificate (rating_value 0.8582, band_key_spm 171.3) scored inside a
          UNIFIED_TOD regatta is corrected on the TIME_ON_DISTANCE branch using band_key_spm, not
          rating_value: 4800.0 - 171.3 * 6.0 = 3772.2, where the PER_CERTIFICATE regatta of every
          other instance would have multiplied instead and produced 4119.4. The variant is chosen
          by the regatta's basis first and only then by the certificate's rule_code.
        test_recipe:
          setup:
            - "A regatta with handicap_basis UNIFIED_TOD, fleet_minimum 2, planned_race_count 6, notice of race and sailing instructions published."
            - "Boat A carries an ISSUED TOT_ORC certificate (rating_value 0.8582, band_key_spm 171.3) and boat B an ISSUED TOD_PHRF certificate (218.8); division A (150.0-230.0 MONOHULL, min_entries 2) holds both entries, boat A fully accepted."
