      - name: warrant_count_window_half_open_overlap_with_thirty_day_cooloff
        grounds:
          - validations.priority_58.ERR_COUNT_WINDOW_OVERLAP
          - state_machines.Intersection.WARRANTED_to_UNDER_STUDY
          - entities.WarrantStudy.fields.count_window_start
          - errors.ERR_COUNT_WINDOW_OVERLAP
        distinguishing_aspect: |
          A different resource (an Intersection's study calendar) with different
          interval semantics: HALF-OPEN comparison plus a 30-day cool-off extension of
          the prior window, and prior studies count in every status including finalized
          ones. The prior window ends 2026-09-30, so the buffered edge is 2026-10-30: a
          new window starting 2026-10-29 is rejected while one starting exactly
          2026-10-30 is accepted. Closed-interval semantics would wrongly reject the
          2026-10-30 request, and ignoring finalized studies would wrongly accept both.
