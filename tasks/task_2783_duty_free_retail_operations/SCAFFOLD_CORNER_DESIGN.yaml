          priority 61 MUST win, so the answer is 409 ERR_ITINERARY_NOT_SCANNED; only after the scan does
          the constraint rule at 78 surface as 409 ERR_EMPTY_BASKET. Evaluating cheap body-shape checks
          first is the natural implementation and gives the wrong error.
