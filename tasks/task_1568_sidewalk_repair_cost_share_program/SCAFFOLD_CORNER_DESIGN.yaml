            - "l_status == SATISFIED and l_out == 0 and l_prin == 0 (full coverage at day 0, zero interest)"
            - "n_status == CLOSED (LIENED -> CLOSED cascade) and flag == false (recomputed)"

      - name: bid_supersede_marks_prior_superseded
        claim_type: valid_transition
        grounds:
          - state_machines.Bid.SUBMITTED_to_SUPERSEDED
          - entities.Bid.fields.evaluated_total_cents
        distinguishing_aspect: |
          A second bid by the same contractor on the same batch legitimately
          supersedes the first: the prior bid flips SUBMITTED -> SUPERSEDED and
          the new bid is the only SUBMITTED row, with its own evaluated total
          (45000 = 50 sqft x 900) snapshotted at submission.
        test_recipe:
          setup:
            - "DELINQUENT notice swept; batch NB-S15 sealed with one POOLED item (scope 50); one contractor"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Nan Nandina", mailing_address: "65 Nandina St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-S15", owner_id: "${owner_id}", street_address: "65 Nandina St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-S15-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 50 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_id}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-16T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /delinquency-sweeps", as: ProgramCoordinator }
            - { call: "POST /bid-batches", payload: { neighborhood_code: "NB-S15", work_window_start: "2026-09-25", work_window_end: "2026-10-15", bid_deadline: "2026-09-22T00:00:00Z" }, as: ProgramCoordinator, captures: { batch_id: "$.data.id" } }
            - { call: "POST /batch-work-items", payload: { batch_id: "${batch_id}", notice_id: "${notice_id}", scope_sqft: 50, engineer_unit_rate_cents: 1300 }, as: ProgramCoordinator }
            - { call: "POST /bid-batches/${batch_id}/seal", as: ProgramCoordinator, captures: { batch_v: "$.data.version" } }
            - { call: "POST /contractors", payload: { company_name: "Acme Paving", license_number: "L-001", insurance_valid_until: "2026-12-31" }, as: ProgramCoordinator, captures: { contractor_id: "$.data.id" } }
          trigger:
            - { call: "POST /bids", payload: { batch_id: "${batch_id}", unit_rate_cents: 1000, ramp_flat_fee_cents: 0, expected_batch_version: "${batch_v}" }, as: Contractor, as_user_id: "${contractor_id}", captures: { bid1_id: "$.data.id", eval1: "$.data.evaluated_total_cents" } }
            - { call: "GET /bid-batches/${batch_id}", as: ProgramCoordinator, captures: { batch_v2: "$.data.version" } }
            - { call: "POST /bids", payload: { batch_id: "${batch_id}", unit_rate_cents: 900, ramp_flat_fee_cents: 0, expected_batch_version: "${batch_v2}" }, as: Contractor, as_user_id: "${contractor_id}", captures: { bid2_id: "$.data.id", eval2: "$.data.evaluated_total_cents", st2: "$.data.status" } }
            - { call: "GET /bids/${bid1_id}", as: ProgramCoordinator, captures: { st1: "$.data.status" } }
          assert:
            - "eval1 == 50000 (1000 x 50 sqft)"
            - "st2 == SUBMITTED and eval2 == 45000 (900 x 50 sqft)"
            - "st1 == SUPERSEDED (only the newest bid per (batch, contractor) stays award-eligible)"

  # ===========================================================================
  # Section: calculations (Table 3 claims)
  # ===========================================================================
  - section: calculations
    instances:
      - name: severity_classification_non_vertical_types
        claim_type: correct_result
        grounds:
          - calculations.defect_severity_classification
          - entities.Defect.fields.severity_class
        distinguishing_aspect: |
          The classification table's non-VERTICAL_SEPARATION rows produce the
          pinned classes at their stated thresholds: HORIZONTAL_OPENING 0.50 ->
          MAJOR vs 0.49 -> MINOR; SETTLEMENT area 9 -> MAJOR vs 8 -> MINOR;
          SPALLING area 16 -> MAJOR; CRUMBLED_JOINT area 15 -> MINOR;
          TREE_ROOT_UPHEAVAL without a city tree at 0.40 -> MAJOR and stays OPEN
          (no forestry review is auto-created without city_tree_involved).
        test_recipe:
          setup:
            - "owner/parcel/segment registered"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Ora Osage", mailing_address: "66 Osage St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-C1", owner_id: "${owner_id}", street_address: "66 Osage St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-C1-1", length_ft: 100, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
          trigger:
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "HORIZONTAL_OPENING", measured_offset_inches: 0.5, area_sqft: 2 }, as: Inspector, as_user_id: "insp-1", captures: { sev_ho_hi: "$.data.severity_class" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "HORIZONTAL_OPENING", measured_offset_inches: 0.49, area_sqft: 2 }, as: Inspector, as_user_id: "insp-1", captures: { sev_ho_lo: "$.data.severity_class" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SETTLEMENT", area_sqft: 9 }, as: Inspector, as_user_id: "insp-1", captures: { sev_set_hi: "$.data.severity_class" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SETTLEMENT", area_sqft: 8 }, as: Inspector, as_user_id: "insp-1", captures: { sev_set_lo: "$.data.severity_class" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 16 }, as: Inspector, as_user_id: "insp-1", captures: { sev_spa: "$.data.severity_class" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "CRUMBLED_JOINT", area_sqft: 15 }, as: Inspector, as_user_id: "insp-1", captures: { sev_cj: "$.data.severity_class" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "TREE_ROOT_UPHEAVAL", measured_offset_inches: 0.4, area_sqft: 10 }, as: Inspector, as_user_id: "insp-1", captures: { sev_tru: "$.data.severity_class", st_tru: "$.data.status" } }
          assert:
            - "sev_ho_hi == MAJOR and sev_ho_lo == MINOR (0.50 inclusive boundary)"
            - "sev_set_hi == MAJOR and sev_set_lo == MINOR (9 sqft inclusive boundary)"
            - "sev_spa == MAJOR (16 sqft) and sev_cj == MINOR (15 sqft)"
            - "sev_tru == MAJOR (0.25 <= 0.40 < 0.50) and st_tru == OPEN (no city tree -> no AWAITING_FORESTRY, no review)"

      - name: segment_condition_index_two_variants
        claim_type: variant_divergence
        grounds:
          - calculations.segment_condition_index
          - entities.SidewalkSegment.fields.condition_screening
          - entities.SidewalkSegment.fields.condition_area_weighted
        distinguishing_aspect: |
          Same defect set, two declared aggregations, different stored values:
          with a TRIP_HAZARD defect (weight 100, area 10) and a MINOR defect
          (weight 25, area 15) on one segment, condition_screening == 100 (max)
          while condition_area_weighted == 55.0 (round_half_up((100*10 +
          25*15)/25, 1) = round_half_up(55.0, 1)).
        test_recipe:
          setup:
            - "owner/parcel/segment registered"
          setup_api_calls:
            - { call: "POST /property-owners", payload: { full_name: "Pia Poplar", mailing_address: "67 Poplar St" }, as: ProgramCoordinator, captures: { owner_id: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-C2", owner_id: "${owner_id}", street_address: "67 Poplar St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_id: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_id}", segment_code: "S-C2-1", length_ft: 50, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
          trigger:
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "VERTICAL_SEPARATION", measured_offset_inches: 0.75, area_sqft: 10 }, as: Inspector, as_user_id: "insp-1", captures: { sev1: "$.data.severity_class" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 15 }, as: Inspector, as_user_id: "insp-1", captures: { sev2: "$.data.severity_class" } }
