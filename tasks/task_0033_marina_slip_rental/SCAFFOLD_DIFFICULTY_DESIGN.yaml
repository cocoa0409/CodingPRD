              as: Tenant
              as_user_id: "${tf_id}"
              captures: { vf_id: $.data.id }
            - call: "POST /tenants/${tf_id}/liveaboard-applications"
              payload: { marina_id: "${mar_id}" }
              as: Tenant
              as_user_id: "${tf_id}"
            - call: "POST /tenants/${tf_id}/liveaboard-approve"
              payload: { marina_id: "${mar_id}" }
              as: HarborMaster
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: HarborMaster
            - call: "POST /leases"
              payload: { marina_id: "${mar_id}", slip_id: "${slip_id}", tenant_id: "${tf_id}", vessel_id: "${vf_id}", start_date: "2026-07-10", end_date: "2026-07-15", is_liveaboard: true, expected_slip_version: "${slip_v0}" }
              as: Tenant
              as_user_id: "${tf_id}"
              captures: { lease_f_id: $.data.id }
            - call: "POST /tenants/${tf_id}/liveaboard-revoke"
              payload: { marina_id: "${mar_id}" }
              as: HarborMaster
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: HarborMaster
          trigger:
            - call: "POST /leases/${lease_f_id}/check-in"
              payload: {}
              as: MarinaStaff
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == \"ERR_INVALID_STATE\""
            - "Tenant.${tf_id}.liveaboard_status == \"REVOKED\""

      - name: pumpout_complete_requires_lease_active
        grounds:
          - state_machines.PumpOutRequest.PENDING_to_COMPLETED
          - state_machines.Lease.ACTIVE_to_ENDED
        distinguishing_aspect: |
          Cross-entity pair (PumpOutRequest, Lease) — distinct from the
          (Lease, Tenant) pair. Completing a PumpOutRequest requires the
          parent Lease.status == ACTIVE; once the lease ENDS, the
          completion is rejected with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Active lease L_G with a PENDING pump-out request; staff then checks out the lease (Lease ACTIVE -> ENDED) before completing pump-out."
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "HMN", harbor_code: "HMN", liveaboard_cap: 1 }
              as: HarborMaster
              captures: { mar_id: $.data.id }
            - call: "POST /marinas/${mar_id}/slips"
              payload: { slip_number: "N-1", length_ft: 50, beam_ft: 15, power_amp: "A50", pumpout_available: true, base_daily_rate_cents: 5000 }
              as: HarborMaster
              captures: { slip_id: $.data.id, slip_v0: $.data.version }
            - call: "POST /tenants"
              payload: { email: "tg@x.com", full_name: "T G" }
              as: HarborMaster
              captures: { tg_id: $.data.id }
            - call: "POST /vessels"
              payload: { tenant_id: "${tg_id}", name: "VG", loa_ft: 40, beam_ft: 12, insurance_policy_number: "PG", insurance_expires_on: "2027-01-01", insurance_coverage_cents: 6000000 }
              as: Tenant
              as_user_id: "${tg_id}"
              captures: { vg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: HarborMaster
            - call: "POST /leases"
              payload: { marina_id: "${mar_id}", slip_id: "${slip_id}", tenant_id: "${tg_id}", vessel_id: "${vg_id}", start_date: "2026-07-10", end_date: "2026-07-12", expected_slip_version: "${slip_v0}" }
              as: Tenant
              as_user_id: "${tg_id}"
              captures: { lease_g_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: HarborMaster
            - call: "POST /leases/${lease_g_id}/check-in"
              payload: {}
              as: MarinaStaff
            - call: "POST /pump-out-requests"
              payload: { lease_id: "${lease_g_id}" }
              as: Tenant
              as_user_id: "${tg_id}"
              captures: { po_id: $.data.id }
            - call: "POST /leases/${lease_g_id}/check-out"
              payload: {}
              as: MarinaStaff
          trigger:
            - call: "POST /pump-out-requests/${po_id}/complete"
              payload: {}
              as: MarinaStaff
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == \"ERR_INVALID_STATE\""
            - "Lease.${lease_g_id}.status == \"ENDED\""

  # =====================================================================
  # Rule 8 — resource_temporal_overlap
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: slip_lease_half_open_overlap_rejects_strict_intersect
        grounds:
          - validations[priority=9]
          - entities.Lease.fields.end_date
        distinguishing_aspect: |
          On Slip resource — half-open `[start, end)` intersect: requested
          window 2026-09-05..2026-09-15 intersects existing 2026-09-01..2026-09-10
          on the same slip; the rule REJECTS because intersection is
          non-empty. Same metric scheme (half-open intervals) on Slip.
        test_recipe:
          setup:
            - "Marina HMO; Slip S1 with existing RESERVED Lease window [2026-09-01, 2026-09-10)."
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "HMO", harbor_code: "HMO", liveaboard_cap: 1 }
