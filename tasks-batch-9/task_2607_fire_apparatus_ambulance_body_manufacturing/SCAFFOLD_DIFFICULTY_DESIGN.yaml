          assert:
            - "UnitOrder.${u_rear_eq_id}: front_axle_load_kg == 5810, rear_axle_load_kg == 10110, gross_weight_kg == 15920, weight_status == WITHIN_LIMITS (rear load exactly equals the 10110 rating)"
            - "UnitOrder.${u_rear_over_id}: identical loads 5810 / 10110 / 15920 but weight_status == OVER_REAR against the 10109 rating — a 1 kg rating change flips the verdict"
            - "UnitOrder.${u_front_over_id}: weight_status == OVER_FRONT (front 5810 > 5809) and NOT OVER_REAR, proving the ladder is evaluated GVWR -> front -> rear"
            - "UnitOrder.${u_gvwr_eq_id}: gross_weight_kg == 15920 == gvwr_kg -> weight_status == WITHIN_LIMITS"
            - "UnitOrder.${u_gvwr_over_id}: gross_weight_kg == 15920 > gvwr_kg 15919 -> weight_status == OVER_GVWR, and the payload leg still floors to 3400 because floor(15919 * 28 / 100) == 4457 exceeds the 3400 cap"
            - "UnitOrder.${u_amb_id}: payload 898 (floor(4491 * 20 / 100) == 898 beats the 900 cap), front_axle_load_kg == 1585 and rear_axle_load_kg == 2273 — round_half_up(898 * 0.25) == 225, NOT truncation to 224 which would give 1584 / 2274"
            - "UnitOrder.${u_amb_id}.weight_status == WITHIN_LIMITS with gross_weight_kg == 3858"
            - "ApparatusProgram.${prog_id}.committed_cents == 409656000 and status == ACTIVE (soft ceiling 720000000 not breached by six units at 68276000 each)"

