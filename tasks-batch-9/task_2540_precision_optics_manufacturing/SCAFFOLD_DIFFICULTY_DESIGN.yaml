# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2540 Precision Optics Manufacturing — companion to SCAFFOLD.yaml
#
# Nine §0.5 Difficulty Rules, 25 instances. Every `grounds:` entry resolves into
# SCAFFOLD.yaml §1.1–§1.7; every `${var}` is bound by an earlier `captures:`;
# every numeric assertion is a literal computed from the §1.3 formulas.
#
# Logical clock starts at 2026-08-01T00:00:00Z (SCAFFOLD.yaml conventions).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: tolerance_stack_statistical_and_worst_case_variants_diverge_on_design
        grounds:
          - calculations.tolerance_stack_analysis
          - entities.OpticalDesign.fields.rss_stack_waves
          - entities.OpticalDesign.fields.worst_case_stack_waves
          - entities.OpticalDesign.fields.tolerance_method
          - entities.OpticalDesign.fields.tolerance_verdict
          - state_machines.OpticalDesign.DRAFT_to_TOLERANCED
        distinguishing_aspect: |
          Both variants of tolerance_stack_analysis run over the SAME four ACTIVE ToleranceAllocation
          rows and produce 0.0735 waves (STATISTICAL root-sum-square) versus 0.1470 waves (WORST_CASE
          arithmetic sum); the 0.0800 budget sits between them, so the design whose tolerance_method
          is STATISTICAL records tolerance_verdict PASS while the identically allocated WORST_CASE
          design records tolerance_verdict FAIL; both designs reach TOLERANCED (the verdict is only
          enforced later, at release), so the divergence is visible purely in the stored numbers.
        test_recipe:
          setup:
            - "Two DRAFT OpticalDesigns with identical tolerance_budget_waves 0.0800 and identical four-contributor allocation sets; the first uses the default tolerance_method STATISTICAL, the second WORST_CASE."
            - "Contributions are 0.0375, 0.0360, 0.0375 and 0.0360 waves, frozen on each ToleranceAllocation at create time."
            - "Logical clock untouched at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
              captures: { al1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "INDEX_HOMOGENEITY", sensitivity_waves_per_unit: 2.0, manufacturing_tolerance_units: 0.0180 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "WEDGE_ANGLE", sensitivity_waves_per_unit: 3.0, manufacturing_tolerance_units: 0.0125 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "CENTER_THICKNESS", sensitivity_waves_per_unit: 4.0, manufacturing_tolerance_units: 0.0090 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-B", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050, tolerance_method: "WORST_CASE" }
              as: OpticsEngineer
              captures: { d2: $.data.id }
            - call: "POST /optics/optical-designs/${d2}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d2}/tolerance-allocations"
              payload: { contributor_type: "INDEX_HOMOGENEITY", sensitivity_waves_per_unit: 2.0, manufacturing_tolerance_units: 0.0180 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d2}/tolerance-allocations"
              payload: { contributor_type: "WEDGE_ANGLE", sensitivity_waves_per_unit: 3.0, manufacturing_tolerance_units: 0.0125 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d2}/tolerance-allocations"
              payload: { contributor_type: "CENTER_THICKNESS", sensitivity_waves_per_unit: 4.0, manufacturing_tolerance_units: 0.0090 }
              as: OpticsEngineer
          trigger:
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d2}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
          assert:
            - "ToleranceAllocation.${al1}.contribution_waves == 0.0375"
            - "OpticalDesign.${d1}.rss_stack_waves == 0.0735"
            - "OpticalDesign.${d1}.worst_case_stack_waves == 0.1470"
            - "OpticalDesign.${d1}.governing_stack_waves == 0.0735"
            - "OpticalDesign.${d1}.allocated_tolerance_waves == 0.0735"
            - "OpticalDesign.${d1}.tolerance_verdict == PASS"
            - "OpticalDesign.${d1}.design_status == TOLERANCED"
            - "OpticalDesign.${d2}.rss_stack_waves == 0.0735"
            - "OpticalDesign.${d2}.worst_case_stack_waves == 0.1470"
            - "OpticalDesign.${d2}.governing_stack_waves == 0.1470"
            - "OpticalDesign.${d2}.tolerance_verdict == FAIL"
            - "OpticalDesign.${d2}.design_status == TOLERANCED"
            - "a release of ${d2} would be refused with ERR_TOLERANCE_BUDGET_EXCEEDED while a release of ${d1} is admissible"
            - "OpticalDesign.${d2}.governing_stack_waves - OpticalDesign.${d1}.governing_stack_waves == 0.0735"
            - "both tolerance-analysis calls return HTTP 200"

      - name: coating_spectral_band_average_and_worst_point_variants_diverge_on_coating_run
        grounds:
          - calculations.spectral_performance_verification
          - entities.CoatingRun.fields.band_average_reflectance_pct
          - entities.CoatingRun.fields.worst_point_reflectance_pct
          - entities.CoatingRun.fields.spectral_verdict
          - state_machines.CoatingRun.DEPOSITED_to_VERIFIED_FAIL
        distinguishing_aspect: |
          On one five-sample in-band trace the BAND_AVERAGE variant yields 0.4400 % (inside its
          0.5000 % limit, so that variant passes) while the WORST_POINT variant yields 1.3500 %
          (outside its 1.2000 % limit); the pinned conjunction therefore lands spectral_verdict FAIL
          and coating_status VERIFIED_FAIL, leaving the WorkOrder in COATING.
        test_recipe:
          setup:
            - "A released design OD-2540-A with wavelength band 450..700 nm, a certified RELEASED glass lot, a WorkOrder driven through POLISHING and FIGURING to FIGURE_ACCEPTED, and a CoatingRun in DEPOSITED on a chamber with slot_capacity 2."
            - "Logical clock untouched at 2026-08-01T00:00:00Z; instrument IF-2540-1 has base_uncertainty_waves 0.0010 so the capability ratio at scheduling is 0.0500."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/export-classifications"
              payload: { design_id: "${d1}", destination_country: "DE" }
              as: ExportComplianceOfficer
              as_user_id: "eco-001"
              captures: { x1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-1", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id }
            - call: "POST /optics/glass-lots/${g1}/certification"
              payload: { measured_index_homogeneity_grade: "H3", measured_striae_grade: "B", certificate_reference: "CERT-2540-1" }
              as: ProcurementOfficer
              captures: { g1v: $.data.version }
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-1", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v}" }
              as: ProcessTechnician
              captures: { w1: $.data.id }
            - call: "POST /optics/metrology-instruments"
              payload: { instrument_code: "IF-2540-1", instrument_type: "PHASE_SHIFTING_INTERFEROMETER", base_uncertainty_waves: 0.0010, last_calibrated_utc: "2026-08-01T00:00:00Z", lateral_resolution_um: 5.0 }
              as: PlantAdmin
              captures: { i1: $.data.id }
            - call: "POST /optics/process-runs"
              payload: { work_order_id: "${w1}", metrology_instrument_id: "${i1}", run_stage: "POLISHING", metrology_window_start_utc: "2026-08-01T08:00:00Z", metrology_window_end_utc: "2026-08-01T10:00:00Z" }
              as: ProcessTechnician
              captures: { r1: $.data.id }
            - call: "POST /optics/process-runs/${r1}/start"
              payload: {}
              as: ProcessTechnician
            - call: "POST /optics/process-runs/${r1}/complete"
              payload: { material_removed_nm: 800.0 }
              as: ProcessTechnician
            - call: "POST /optics/metrology-reports"
              payload: { process_run_id: "${r1}", surface_rms_waves: 0.0200, surface_roughness_nm_rms: 0.8000 }
              as: MetrologyTechnician
              as_user_id: "mt-001"
              captures: { rep1: $.data.id }
            - call: "POST /optics/metrology-reports/${rep1}/sign"
              payload: {}
              as: MetrologyTechnician
              as_user_id: "mt-002"
            - call: "POST /optics/process-runs"
              payload: { work_order_id: "${w1}", metrology_instrument_id: "${i1}", run_stage: "FIGURING", metrology_window_start_utc: "2026-08-01T11:00:00Z", metrology_window_end_utc: "2026-08-01T12:00:00Z" }
              as: ProcessTechnician
              captures: { r2: $.data.id }
            - call: "POST /optics/process-runs/${r2}/start"
              payload: {}
              as: ProcessTechnician
            - call: "POST /optics/process-runs/${r2}/complete"
              payload: { material_removed_nm: 400.0 }
              as: ProcessTechnician
            - call: "POST /optics/metrology-reports"
              payload: { process_run_id: "${r2}", surface_rms_waves: 0.0200, surface_roughness_nm_rms: 0.8000, transmitted_wavefront_rms_waves: 0.0500 }
              as: MetrologyTechnician
              as_user_id: "mt-001"
              captures: { rep2: $.data.id }
            - call: "POST /optics/metrology-reports/${rep2}/sign"
              payload: {}
              as: MetrologyTechnician
              as_user_id: "mt-002"
            - call: "POST /optics/coating-chambers"
              payload: { chamber_code: "CH-2540-1", slot_capacity: 2 }
              as: PlantAdmin
              captures: { ch1: $.data.id }
            - call: "POST /optics/coating-runs"
              payload: { work_order_id: "${w1}", coating_chamber_id: "${ch1}", coating_recipe_code: "AR-VIS-01", window_start_utc: "2026-08-02T08:00:00Z", window_end_utc: "2026-08-02T12:00:00Z" }
              as: ProcessTechnician
              captures: { c1: $.data.id }
            - call: "POST /optics/coating-runs/${c1}/deposit"
              payload: {}
              as: ProcessTechnician
          trigger:
            - call: "POST /optics/coating-runs/${c1}/spectral-verification"
              payload: { spectral_samples: [ { wavelength_nm: 480, reflectance_pct: 0.2000 }, { wavelength_nm: 550, reflectance_pct: 0.1800 }, { wavelength_nm: 600, reflectance_pct: 0.2200 }, { wavelength_nm: 650, reflectance_pct: 0.2500 }, { wavelength_nm: 700, reflectance_pct: 1.3500 } ] }
              as: ProcessTechnician
          assert:
            - "CoatingRun.${c1}.in_band_sample_count == 5"
            - "CoatingRun.${c1}.band_average_reflectance_pct == 0.4400"
            - "CoatingRun.${c1}.worst_point_reflectance_pct == 1.3500"
            - "CoatingRun.${c1}.spectral_verdict == FAIL"
            - "CoatingRun.${c1}.coating_status == VERIFIED_FAIL"
            - "CoatingRun.${c1}.strip_count == 0"
            - "WorkOrder.${w1}.process_status == COATING"
            - "the BAND_AVERAGE variant is inside its 0.5000 limit (0.4400 <= 0.5000) while the WORST_POINT variant is outside its 1.2000 limit (1.3500 > 1.2000)"
            - "spectral-verification returns HTTP 200"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: tolerance_stack_pins_round_per_contributor_before_summing
        grounds:
          - calculations.tolerance_stack_analysis
          - calculations.tolerance_stack_analysis.constants.CONTRIBUTION_DECIMALS
          - entities.ToleranceAllocation.fields.contribution_waves
          - entities.OpticalDesign.fields.worst_case_stack_waves
          - conventions.rounding
        distinguishing_aspect: |
          Four contributors whose raw products are 0.00125 waves each must each be rounded to
          0.0013 BEFORE the combination, giving worst_case_stack_waves 0.0052 and rss_stack_waves
          0.0026; combining the raw products and rounding once at the end would give 0.0050 and
          0.0025, so the pinned round-then-combine order is observable in the fourth decimal.
        test_recipe:
          setup:
            - "One DRAFT OpticalDesign with tolerance_method WORST_CASE and tolerance_budget_waves 0.0800."
            - "Four ACTIVE ToleranceAllocations, each sensitivity_waves_per_unit 0.5 and manufacturing_tolerance_units 0.0025, i.e. a raw product of exactly 0.00125 waves that rounds half-up to 0.0013."
            - "Logical clock untouched at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-R", aperture_mm: 80.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050, tolerance_method: "WORST_CASE" }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 0.5, manufacturing_tolerance_units: 0.0025 }
              as: OpticsEngineer
              captures: { al1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "INDEX_HOMOGENEITY", sensitivity_waves_per_unit: 0.5, manufacturing_tolerance_units: 0.0025 }
              as: OpticsEngineer
              captures: { al2: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "WEDGE_ANGLE", sensitivity_waves_per_unit: 0.5, manufacturing_tolerance_units: 0.0025 }
              as: OpticsEngineer
              captures: { al3: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "CENTER_THICKNESS", sensitivity_waves_per_unit: 0.5, manufacturing_tolerance_units: 0.0025 }
              as: OpticsEngineer
              captures: { al4: $.data.id }
          trigger:
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
          assert:
            - "ToleranceAllocation.${al1}.contribution_waves == 0.0013"
            - "ToleranceAllocation.${al2}.contribution_waves == 0.0013"
            - "ToleranceAllocation.${al3}.contribution_waves == 0.0013"
            - "ToleranceAllocation.${al4}.contribution_waves == 0.0013"
            - "OpticalDesign.${d1}.worst_case_stack_waves == 0.0052"
            - "OpticalDesign.${d1}.rss_stack_waves == 0.0026"
            - "OpticalDesign.${d1}.governing_stack_waves == 0.0052"
            - "OpticalDesign.${d1}.tolerance_verdict == PASS"
            - "OpticalDesign.${d1}.design_status == TOLERANCED"
            - "worst_case_stack_waves is NOT 0.0050 and rss_stack_waves is NOT 0.0025 (the round-once-at-the-end order)"

      - name: capability_index_nested_min_clips_drift_before_budget_scaling
        grounds:
          - calculations.metrology_capability_index
          - calculations.metrology_capability_index.constants.UNCERTAINTY_DRIFT_CAP_MULTIPLE
          - entities.MetrologyInstrument.fields.effective_uncertainty_waves
          - entities.ProcessRun.fields.capability_ratio_at_scheduling
          - validations.priority_17
          - conventions.logical_clock
        distinguishing_aspect: |
          At 92 days since calibration the linear drift term is 0.0010 * (1 + 0.02 * 92) = 0.00284
          waves, but the nested min clips it to 2 * 0.0010 = 0.002000 before the budget scaling, so
          capability_ratio_at_scheduling is 4 * 0.002000 / 0.0400 = 0.2000 and the run is accepted;
          an implementation that scales the unclipped drift gets 0.2840 and wrongly rejects the run
          with ERR_METROLOGY_CAPABILITY_INSUFFICIENT.
        test_recipe:
          setup:
            - "A RELEASED OpticalDesign whose tolerance_budget_waves is 0.0400."
            - "A RELEASED GlassLot and a WorkOrder in BLANKS_RESERVED against it."
            - "A MetrologyInstrument with base_uncertainty_waves 0.0010, calibration_interval_days 120 and last_calibrated_utc 2026-08-01T00:00:00Z, so at the moved clock it is 92 days out (not yet overdue)."
            - "The logical clock is moved forward to 2026-11-01T00:00:00Z, which is exactly 92 days after 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-C", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0400, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 0.5, manufacturing_tolerance_units: 0.0100 }
              as: OpticsEngineer
              captures: { al1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-1", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id }
            - call: "POST /optics/glass-lots/${g1}/certification"
              payload: { measured_index_homogeneity_grade: "H3", measured_striae_grade: "B", certificate_reference: "CERT-2540-1" }
              as: ProcurementOfficer
              captures: { g1v: $.data.version }
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-1", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v}" }
              as: ProcessTechnician
              captures: { w1: $.data.id }
            - call: "POST /optics/metrology-instruments"
              payload: { instrument_code: "IF-2540-1", instrument_type: "PHASE_SHIFTING_INTERFEROMETER", base_uncertainty_waves: 0.0010, last_calibrated_utc: "2026-08-01T00:00:00Z", lateral_resolution_um: 5.0, calibration_interval_days: 120 }
              as: PlantAdmin
              captures: { i1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /optics/process-runs"
              payload: { work_order_id: "${w1}", metrology_instrument_id: "${i1}", run_stage: "POLISHING", metrology_window_start_utc: "2026-11-01T08:00:00Z", metrology_window_end_utc: "2026-11-01T10:00:00Z" }
              as: ProcessTechnician
              captures: { r1: $.data.id }
          assert:
            - "the trigger returns HTTP 201"
            - "MetrologyInstrument.${i1}.days_since_calibration == 92"
            - "MetrologyInstrument.${i1}.effective_uncertainty_waves == 0.002000"
            - "MetrologyInstrument.${i1}.instrument_status == CALIBRATED"
            - "MetrologyInstrument.${i1}.booked_minutes_total == 120"
            - "ProcessRun.${r1}.capability_ratio_at_scheduling == 0.2000"
            - "ProcessRun.${r1}.window_minutes == 120"
            - "ProcessRun.${r1}.run_status == SCHEDULED"
            - "the response is NOT ERR_METROLOGY_CAPABILITY_INSUFFICIENT (the unclipped ratio would have been 0.2840 > 0.2500)"

      - name: cement_derate_tier_selected_from_subtotal_not_recomputed_on_total
        grounds:
          - calculations.assembly_transmitted_wavefront
          - calculations.assembly_transmitted_wavefront.constants.CEMENT_DERATE_TIER_2_WAVES
          - entities.Assembly.fields.subtotal_waves
          - entities.Assembly.fields.cement_derate_waves
          - entities.Assembly.fields.total_transmitted_wavefront_waves
          - state_machines.Assembly.MOUNTED_to_ALIGNED
        distinguishing_aspect: |
          The two components give element_rss_waves 0.0781 and centration_error_waves 0.0208, so
          subtotal_waves is 0.0989 and the tier-2 derate 0.0060 applies, landing
          total_transmitted_wavefront_waves at 0.1049 — just inside the 0.1050 budget, so the
          assembly reaches ALIGNED; re-selecting the tier from the 0.1049 total would pick the
          tier-3 derate 0.0150, yield 0.1139 and wrongly fail the alignment.
        test_recipe:
          setup:
            - "A RELEASED design OD-2540-A with transmitted_wavefront_budget_waves 0.1050, an approved export licence, and a WorkOrder with element_count 2 driven all the way to RELEASED_TO_ASSEMBLY."
            - "An Assembly in MOUNTED holding two ACTIVE components: slot 1 = (decenter 10.0 um, tilt 1.0 arcmin, element wavefront 0.0600) and slot 2 = (12.0 um, 0.5 arcmin, 0.0500)."
            - "Logical clock untouched at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/export-classifications"
              payload: { design_id: "${d1}", destination_country: "DE", end_use_statement: "Industrial metrology objective" }
              as: ExportComplianceOfficer
              as_user_id: "eco-001"
              captures: { x1: $.data.id }
            - call: "POST /optics/glass-lots"
