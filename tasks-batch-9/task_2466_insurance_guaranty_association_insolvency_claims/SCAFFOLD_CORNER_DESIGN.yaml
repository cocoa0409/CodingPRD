        test_recipe:
          setup:
            - "Insolvency in TRIGGERED with a PERSONAL_AUTO profile and one cancelled policy."
            - "One ACTIVE MemberInsurer with premium base 10000000 at the default 200 bps."
            - "Assessment already CERTIFIED for 150000 with exactly one MemberAssessment."
          setup_api_calls:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "PERSONAL_AUTO", per_claim_cap_cents: 3000000, per_policy_aggregate_cap_cents: 5000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 2 }
              as: AssociationAdmin
