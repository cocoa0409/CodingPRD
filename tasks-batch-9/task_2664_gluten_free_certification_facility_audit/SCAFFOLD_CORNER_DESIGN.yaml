            - "response.status == 404"
            - "response.error.code == \"ERR_CERTIFICATE_NOT_FOUND\""

      - name: nonconformance_get_with_an_unminted_id_returns_nonconformance_not_found
        claim_type: not_found
        grounds:
          - endpoints."GET /gfco/nonconformances/{nonconformanceId}"
          - validations.priority_4
          - errors.ERR_NONCONFORMANCE_NOT_FOUND
        distinguishing_aspect: |
          Nonconformances are polymorphic in their source (audit, lot test, complaint,
          surveillance run) but monomorphic in their 404 code.
        test_recipe:
          setup:
            - "Empty database apart from the clock."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "GET /gfco/nonconformances/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "adm-1"
          assert:
            - "response.status == 404"
            - "response.error.code == \"ERR_NONCONFORMANCE_NOT_FOUND\""

      - name: consumer_complaint_get_with_an_unminted_id_returns_complaint_not_found
        claim_type: not_found
        grounds:
          - endpoints."GET /gfco/consumer-complaints/{complaintId}"
          - validations.priority_4
          - errors.ERR_COMPLAINT_NOT_FOUND
        distinguishing_aspect: |
          The complaint entity's 404 code drops the CONSUMER_ prefix used in its path, and
          the code - not the path spelling - is what the contract fixes.
        test_recipe:
