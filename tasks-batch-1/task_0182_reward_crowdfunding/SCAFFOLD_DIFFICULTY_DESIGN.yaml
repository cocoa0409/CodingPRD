# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — Reward Crowdfunding
# Nine §0.5 Difficulty Rules × 2 instances each = 18 instances.
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7. All formula-derived asserts
# are literals computed against calculations[].formula + constants:.
#
# Recurring numeric facts (all computed against §1.3):
#   pledge_total(amount=5000, tier_weight=800, no add-ons, DOMESTIC)
#       items=5000, billable_kg=ceil(800/1000)=1, ship=500+1*150=650, committed=5650
#   pledge_total(amount=5000, tier_weight=800, add-on{price2000,weight300}x2, DOMESTIC)
#       items=5000+4000=9000, weight=800+600=1400 -> 2kg, ship=500+2*150=800, committed=9800
#   pledge_total(amount=3000, tier_weight=1200, no add-ons, INTL)
#       items=3000, billable_kg=2, ship=1500+2*400=2300, committed=5300
#   platform_fee per-pledge-then-sum on two 5650 pledges:
#       round_half_up(5650*0.05)=283 each -> 283+283=566 (sum-then-round=round(11300*0.05)=565)
#       settled=11300, creator_payout=11300-566=10734
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: projected_vs_settled_raise_on_campaign
        grounds:
          - calculations.projected_raise
          - calculations.settled_raise
          - entities.Campaign.fields.committed_amount_cents
          - entities.Campaign.fields.settled_amount_cents
          - state_machines.Campaign.LIVE_to_CLOSING
        distinguishing_aspect: |
          On the Campaign domain: projected_raise (forward-looking, counts PENDING_AUTH) yields
          16950 for three 5650 pledges while LIVE, but settled_raise (chronological, excludes the
          one DECLINED auth) yields 11300 at close — a 5650 divergence on the same pledge set.
        test_recipe:
          setup:
            - "Creator C1 (USD), Backer B1, ALL_OR_NOTHING campaign goal 10000, one unlimited tier price 5000 weight 800, LIVE."
            - "Three ACTIVE PENDING_AUTH pledges of 5000 DOMESTIC (committed 5650 each); committed_amount_cents == 16950."
            - "Pledge #2 has a queued DECLINED authorization; #1 and #3 SUCCEEDED."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C1", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /backers"
              payload: { email: "b1@x.com", display_name: "B1" }
              as: PlatformAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { creator_id: "${c1_id}", title: "Camp", funding_goal_cents: 10000, funding_model: "ALL_OR_NOTHING", deadline_utc: "2026-07-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c1_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/tiers"
              payload: { title: "T", price_cents: 5000, weight_grams: 800 }
              as: Creator
              as_user_id: "${c1_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: Creator
              as_user_id: "${c1_id}"
              captures: { camp_v1: $.data.version }
            - call: "POST /campaigns/${camp_id}/pledges"
              payload: { backer_id: "${b1_id}", tier_id: "${tier_id}", pledge_amount_cents: 5000, destination_zone: "DOMESTIC", expected_campaign_version: "${camp_v1}" }
              as: Backer
              as_user_id: "${b1_id}"
              captures: { p1_id: $.data.id, camp_v2: $.data.version }
            - call: "POST /campaigns/${camp_id}/pledges"
              payload: { backer_id: "${b1_id}", tier_id: "${tier_id}", pledge_amount_cents: 5000, destination_zone: "DOMESTIC", expected_campaign_version: "${camp_v2}" }
              as: Backer
              as_user_id: "${b1_id}"
              captures: { p2_id: $.data.id, camp_v3: $.data.version }
            - call: "POST /campaigns/${camp_id}/pledges"
              payload: { backer_id: "${b1_id}", tier_id: "${tier_id}", pledge_amount_cents: 5000, destination_zone: "DOMESTIC", expected_campaign_version: "${camp_v3}" }
              as: Backer
              as_user_id: "${b1_id}"
              captures: { p3_id: $.data.id }
            - call: "POST /pledges/${p1_id}/authorization"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /pledges/${p2_id}/authorization"
              payload: { outcome: "DECLINED" }
              as: PlatformAdmin
            - call: "POST /pledges/${p3_id}/authorization"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
          trigger:
            - call: "GET /campaigns/${camp_id}"
              as: PlatformAdmin
              captures: { projected: $.data.committed_amount_cents }
            - call: "POST /_clock/advance"
              payload: { now_utc: "2026-07-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "GET /campaigns/${camp_id}"
              as: PlatformAdmin
              captures: { settled: $.data.settled_amount_cents }
          assert:
            - "Before close: Campaign.${camp_id}.committed_amount_cents == 16950 (projected_raise, three PENDING_AUTH)."
            - "After close: Campaign.${camp_id}.settled_amount_cents == 11300 (settled_raise, p2 DECLINED excluded)."
            - "Campaign.${camp_id}.goal_met == true and Campaign.${camp_id}.status == SUCCESSFUL."

      - name: provisional_vs_final_backer_reliability_score
        grounds:
          - calculations.backer_reliability_score
          - entities.Backer.fields.reliability_score
          - entities.Backer.fields.declined_auth_count
          - state_machines.Pledge.PENDING_AUTH_to_AUTH_DECLINED
        distinguishing_aspect: |
          On the Backer domain (distinct from the Campaign-domain raise instance): reliability_score
          is provisional vs final for the SAME backer with identical underlying pledges. While the
          backer's only pledge is still PENDING_AUTH (no decided pledge -> total 0) the provisional
          score is 100.0; after the close-time replay DECLINES that pledge the final score collapses
          to 0.0 (good 0 / total 1). The two valid readings of the same pledge produce 100.0 vs 0.0.
        test_recipe:
          setup:
            - "Backer B1 has one PENDING_AUTH pledge of 5300 (FLEXIBLE campaign K1 LIVE) with a DECLINED auth queued."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "CK", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { ck_id: $.data.id }
            - call: "POST /backers"
              payload: { email: "b1@x.com", display_name: "B1" }
              as: PlatformAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { creator_id: "${ck_id}", title: "K1", funding_goal_cents: 1000, funding_model: "FLEXIBLE", deadline_utc: "2026-06-10T00:00:00.000Z" }
              as: Creator
              as_user_id: "${ck_id}"
              captures: { k1_id: $.data.id }
            - call: "POST /campaigns/${k1_id}/tiers"
              payload: { title: "T1", price_cents: 3000, weight_grams: 1200 }
              as: Creator
              as_user_id: "${ck_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /campaigns/${k1_id}/launch"
              payload: {}
              as: Creator
              as_user_id: "${ck_id}"
              captures: { k1_v1: $.data.version }
            - call: "POST /campaigns/${k1_id}/pledges"
              payload: { backer_id: "${b1_id}", tier_id: "${t1_id}", pledge_amount_cents: 3000, destination_zone: "INTL", expected_campaign_version: "${k1_v1}" }
              as: Backer
              as_user_id: "${b1_id}"
              captures: { p_k1: $.data.id }
            - call: "POST /pledges/${p_k1}/authorization"
              payload: { outcome: "DECLINED" }
              as: PlatformAdmin
          trigger:
            - call: "GET /backers/${b1_id}"
              as: PlatformAdmin
              captures: { score_provisional: $.data.reliability_score }
            - call: "POST /_clock/advance"
              payload: { now_utc: "2026-06-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "GET /backers/${b1_id}"
              as: PlatformAdmin
              captures: { score_final: $.data.reliability_score, declined: $.data.declined_auth_count }
          assert:
            - "Provisional (pledge still PENDING_AUTH, total 0): Backer.${b1_id}.reliability_score == 100.0."
            - "Final (after close, pledge AUTH_DECLINED): Backer.${b1_id}.reliability_score == 0.0 (good 0 / total 1)."
            - "Backer.${b1_id}.declined_auth_count == 1; the same pledge yields 100.0 vs 0.0 under the two readings."

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pledge_total_zone_weight_addons_mode_a
        grounds:
          - calculations.pledge_total
          - entities.Pledge.fields.items_subtotal_cents
          - entities.Pledge.fields.shipping_cents
          - entities.Pledge.fields.committed_amount_cents
        distinguishing_aspect: |
          Mode (a): committed_amount_cents = pledge_amount + sum(add-on line totals) + shipping, where
          shipping is a conditional branch on destination_zone, ceil-to-kg of summed weights, and a
          min() cap — >=3 interacting inputs. For amount 5000 + add-on 2000x2 (weight 800+600=1400 ->
          2kg) DOMESTIC: items 9000, ship 800, committed 9800.
        test_recipe:
          setup:
            - "LIVE campaign, tier price 5000 weight 800, add-on product price 2000 weight 300 limit 10."
            - "Backer pledges 5000 DOMESTIC then attaches 2 of the add-on."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /backers"
              payload: { email: "b@x.com", display_name: "B" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { creator_id: "${c_id}", title: "Camp", funding_goal_cents: 1000, funding_model: "FLEXIBLE", deadline_utc: "2026-07-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/tiers"
              payload: { title: "T", price_cents: 5000, weight_grams: 800 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/add-on-products"
              payload: { title: "Sticker", price_cents: 2000, limit_quantity: 10, weight_grams: 300 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { addon_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_v1: $.data.version }
            - call: "POST /campaigns/${camp_id}/pledges"
              payload: { backer_id: "${b_id}", tier_id: "${tier_id}", pledge_amount_cents: 5000, destination_zone: "DOMESTIC", expected_campaign_version: "${camp_v1}" }
              as: Backer
              as_user_id: "${b_id}"
              captures: { pledge_id: $.data.id }
          trigger:
            - call: "POST /pledges/${pledge_id}/add-ons"
              payload: { addon_id: "${addon_id}", quantity: 2 }
              as: Backer
              as_user_id: "${b_id}"
            - call: "GET /pledges/${pledge_id}"
              as: Backer
              as_user_id: "${b_id}"
              captures: { committed: $.data.committed_amount_cents }
          assert:
            - "Pledge.${pledge_id}.items_subtotal_cents == 9000 (5000 + 2*2000)."
            - "Pledge.${pledge_id}.shipping_cents == 800 (DOMESTIC, ceil(1400/1000)=2kg, 500 + 2*150)."
            - "Pledge.${pledge_id}.committed_amount_cents == 9800."

      - name: platform_fee_round_per_pledge_then_sum_mode_b
        grounds:
          - calculations.platform_fee
          - entities.Campaign.fields.settled_amount_cents
          - state_machines.Campaign.CLOSING_to_SUCCESSFUL
        distinguishing_aspect: |
          Mode (b): per-pledge fee is round_half_up(committed*0.05) computed and rounded PER captured
          pledge THEN summed. Two captured pledges of 5650 give 283+283=566, which differs from
          sum-then-round round(11300*0.05)=565. The pinned per-pledge order yields 566.
        test_recipe:
          setup:
            - "FLEXIBLE campaign, two CAPTURED pledges of 5650 each; campaign SUCCESSFUL; settled 11300."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /backers"
              payload: { email: "b1@x.com", display_name: "B1" }
              as: PlatformAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /backers"
              payload: { email: "b2@x.com", display_name: "B2" }
              as: PlatformAdmin
              captures: { b2_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { creator_id: "${c_id}", title: "Camp", funding_goal_cents: 1000, funding_model: "FLEXIBLE", deadline_utc: "2026-07-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/tiers"
              payload: { title: "T", price_cents: 5000, weight_grams: 800 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_v1: $.data.version }
            - call: "POST /campaigns/${camp_id}/pledges"
              payload: { backer_id: "${b1_id}", tier_id: "${tier_id}", pledge_amount_cents: 5000, destination_zone: "DOMESTIC", expected_campaign_version: "${camp_v1}" }
              as: Backer
              as_user_id: "${b1_id}"
              captures: { p1_id: $.data.id, camp_v2: $.data.version }
            - call: "POST /campaigns/${camp_id}/pledges"
              payload: { backer_id: "${b2_id}", tier_id: "${tier_id}", pledge_amount_cents: 5000, destination_zone: "DOMESTIC", expected_campaign_version: "${camp_v2}" }
              as: Backer
              as_user_id: "${b2_id}"
              captures: { p2_id: $.data.id }
            - call: "POST /pledges/${p1_id}/authorization"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /pledges/${p2_id}/authorization"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /_clock/advance"
              payload: { now_utc: "2026-07-01T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /campaigns/${camp_id}/settlement"
              as: PlatformAdmin
              captures: { fee: $.data.platform_fee_cents, payout: $.data.creator_payout_cents, settled: $.data.settled_amount_cents }
          assert:
            - "settlement.platform_fee_cents == 566 (283 + 283, round-per-pledge-then-sum, NOT 565)."
            - "settlement.settled_amount_cents == 11300 and settlement.creator_payout_cents == 10734."

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: tier_available_soldout_available_cycle
        grounds:
          - state_machines.RewardTier.AVAILABLE_to_SOLD_OUT
          - state_machines.RewardTier.SOLD_OUT_to_AVAILABLE
          - calculations.tier_claimed_quantity
        distinguishing_aspect: |
          RewardTier is cyclic: a limit-2 tier flips AVAILABLE->SOLD_OUT when claimed reaches 2, then
          SOLD_OUT->AVAILABLE when a pledge cancel drops claimed back to 1 — a loop the same tier
          traverses, distinct from the parallel Pledge machine in the sibling instance.
        test_recipe:
          setup:
            - "LIVE campaign, tier limit_quantity 2; two ACTIVE pledges claim it (SOLD_OUT)."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /backers"
              payload: { email: "b1@x.com", display_name: "B1" }
              as: PlatformAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /backers"
              payload: { email: "b2@x.com", display_name: "B2" }
              as: PlatformAdmin
              captures: { b2_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { creator_id: "${c_id}", title: "Camp", funding_goal_cents: 1000, funding_model: "FLEXIBLE", deadline_utc: "2026-07-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/tiers"
              payload: { title: "T", price_cents: 5000, limit_quantity: 2, weight_grams: 800 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_v1: $.data.version }
            - call: "POST /campaigns/${camp_id}/pledges"
              payload: { backer_id: "${b1_id}", tier_id: "${tier_id}", pledge_amount_cents: 5000, destination_zone: "DOMESTIC", expected_campaign_version: "${camp_v1}" }
              as: Backer
              as_user_id: "${b1_id}"
              captures: { p1_id: $.data.id, camp_v2: $.data.version }
            - call: "POST /campaigns/${camp_id}/pledges"
              payload: { backer_id: "${b2_id}", tier_id: "${tier_id}", pledge_amount_cents: 5000, destination_zone: "DOMESTIC", expected_campaign_version: "${camp_v2}" }
              as: Backer
              as_user_id: "${b2_id}"
              captures: { p2_id: $.data.id }
          trigger:
            - call: "GET /tiers/${tier_id}"
              as: PlatformAdmin
              captures: { status_soldout: $.data.status }
            - call: "POST /pledges/${p2_id}/cancel"
              payload: {}
              as: Backer
              as_user_id: "${b2_id}"
            - call: "GET /tiers/${tier_id}"
              as: PlatformAdmin
              captures: { status_after: $.data.status, claimed_after: $.data.claimed_quantity }
          assert:
            - "After two pledges: RewardTier.${tier_id}.status == SOLD_OUT and claimed_quantity == 2."
            - "After cancelling p2: RewardTier.${tier_id}.status == AVAILABLE and claimed_quantity == 1 (SOLD_OUT->AVAILABLE cycle edge)."

      - name: pledge_parallel_payment_and_fulfillment_axes
        grounds:
          - state_machines.Pledge.PENDING_AUTH_to_AUTHORIZED
          - state_machines.Pledge.AUTHORIZED_to_CAPTURED
          - state_machines.Pledge.SURVEY_SENT_to_SURVEY_COMPLETE
          - entities.Pledge.fields.payment_status
          - entities.Pledge.fields.fulfillment_status
        distinguishing_aspect: |
          Pledge carries two independent state axes on one row: payment_status advances
          PENDING_AUTH->AUTHORIZED->CAPTURED while fulfillment_status advances
          NOT_STARTED->SURVEY_SENT->SURVEY_COMPLETE. After capture, payment_status stays CAPTURED while
          fulfillment_status moves on its own axis to SURVEY_COMPLETE — a parallel machine on a
          different entity than the cyclic RewardTier instance.
        test_recipe:
          setup:
            - "FLEXIBLE campaign, one pledge AUTHORIZED then campaign SUCCESSFUL -> pledge CAPTURED, fulfillment SURVEY_SENT."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /backers"
              payload: { email: "b@x.com", display_name: "B" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { creator_id: "${c_id}", title: "Camp", funding_goal_cents: 1000, funding_model: "FLEXIBLE", deadline_utc: "2026-07-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/tiers"
              payload: { title: "T", price_cents: 3000, weight_grams: 1200 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_v1: $.data.version }
            - call: "POST /campaigns/${camp_id}/pledges"
              payload: { backer_id: "${b_id}", tier_id: "${tier_id}", pledge_amount_cents: 3000, destination_zone: "INTL", expected_campaign_version: "${camp_v1}" }
              as: Backer
              as_user_id: "${b_id}"
              captures: { pledge_id: $.data.id }
            - call: "POST /pledges/${pledge_id}/authorization"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /_clock/advance"
              payload: { now_utc: "2026-07-01T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pledges/${pledge_id}/survey"
              payload: { shipping_address: "1 Main St" }
              as: Backer
              as_user_id: "${b_id}"
            - call: "GET /pledges/${pledge_id}"
              as: Backer
              as_user_id: "${b_id}"
              captures: { pay: $.data.payment_status, ful: $.data.fulfillment_status }
          assert:
            - "Pledge.${pledge_id}.payment_status == CAPTURED (unchanged by the survey step)."
            - "Pledge.${pledge_id}.fulfillment_status == SURVEY_COMPLETE (advanced independently on the fulfillment axis)."

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: close_failed_refund_then_inventory_release_depth3
        grounds:
          - state_machines.Campaign.CLOSING_to_FAILED
          - state_machines.Pledge.AUTHORIZED_to_REFUNDED
          - state_machines.RewardTier.SOLD_OUT_to_AVAILABLE
          - calculations.tier_claimed_quantity
        distinguishing_aspect: |
          Depth-3 cascade triggered by Campaign CLOSING->FAILED: (1) finalize-failed mutates each
          AUTHORIZED Pledge to REFUNDED and creates a Refund; (2) that pledge REFUND in turn recomputes
          RewardTier.claimed_quantity; (3) the tier, formerly SOLD_OUT, drops to 0 then RETIRED. Each
          link is caused by the previous, not the original action.
        test_recipe:
          setup:
            - "ALL_OR_NOTHING campaign goal 100000 (unreachable), tier limit 1, one AUTHORIZED pledge of 5650 -> tier SOLD_OUT."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /backers"
