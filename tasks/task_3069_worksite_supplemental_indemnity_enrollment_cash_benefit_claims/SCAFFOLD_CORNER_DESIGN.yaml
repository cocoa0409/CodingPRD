      - name: non_guaranteed_issue_policy_with_preexisting_codes_declined
        claim_type: conditional_validation
        grounds: [state_machines.Policy.APPLIED_to_ISSUED, state_machines.Policy.APPLIED_to_DECLINED, entities.EnrollmentCampaign.fields.guaranteed_issue]
        distinguishing_aspect: "The guaranteed_issue flag flips the pre-existing screen: the same employee with preexisting_diagnosis_codes is ISSUED under a guaranteed-issue campaign but DECLINED at issuance under a non-guaranteed-issue campaign."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Group GD2 ACTIVE; counselors CD1, CD2 ACTIVE; series SD2 ACTIVE with PUBLISHED schedule (event D2 amount 100, max 1, lifetime 1000; premium 100; wellness 50/0/0)."
            - "Campaign CD-GI OPEN guaranteed_issue=true window 2026-09-01..2026-09-10 (counselor CD1); campaign CD-NGI OPEN guaranteed_issue=false window 2026-09-10..2026-10-01 (counselor CD2, half-open adjacency OK)."
            - "Employee ED2 ACTIVE with preexisting_diagnosis_codes ['E11.9']."
            - "Policy PD-GI applied under CD-GI; policy PD-NGI applied under CD-NGI for the same employee... wait: duplicate coverage check — PD-GI APPLIED blocks PD-NGI (same employee+series non-terminal). Use two series SD2 and SD3 with identical schedules to avoid the duplicate-coverage gate."
