            - call: "GET /registry/match-candidates/${mc_d5}/typing-requests"
              payload: {}
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { ct_2_state_b: "$.data[0].status" }
          assert:
            - "the first sweep at 2026-08-08T00:00:01Z expires the only REQUESTED row: ${ct_1} becomes \"EXPIRED\" with expired_by_sweep_at \"2026-08-08T00:00:01Z\", the D1 candidate becomes \"TYPING_EXPIRED\" with ct_attempt_count 1"
            - "that sweep does NOT promote anything: ct_attempt_count 1 is below MAX_CT_ATTEMPTS 2, so the D1 candidate keeps candidate_role \"PRIMARY\" (status TYPING_EXPIRED, promoted_from_rank null), the D5 candidate stays \"BACKUP\", backup_candidate_count stays 1 and the search stays \"PRIMARY_ENGAGED\" - not BACKUP_REQUIRED and not STALLED"
            - "the request then raised on the still-BACKUP D5 candidate gets deadline_at \"2026-08-15T00:00:01Z\" (168 h from its own requested_at 2026-08-08T00:00:01Z), while the expired row keeps its own 2026-08-08T00:00:00Z deadline"
            - "the second sweep at 2026-08-10T00:00:00Z expires nothing: ${ct_2} is still \"REQUESTED\" and the search is still \"PRIMARY_ENGAGED\""
            - "that no-op sweep still stamps last_sweep_at, which moves from \"2026-08-08T00:00:01Z\" to \"2026-08-10T00:00:00Z\""
            - "the terminal row is never revisited: ${ct_1} is still \"EXPIRED\" and its expired_by_sweep_at is STILL \"2026-08-08T00:00:01Z\" after the second sweep - a sweep that re-stamped it would be reprocessing a row outside its input set"

      - name: the_preliminary_score_floor_is_a_threshold_boundary
        claim_type: threshold
        grounds:
          - calculations.candidate_pool_materialization.algorithm
          - entities.SearchRequest.fields.min_preliminary_score
        excluded_because:
          difficulty_instance: preliminary_score_floor_is_inclusive_to_the_hundredth
          rationale: |
            §1.8 already tests the floor at score-0.01, exactly at the floor and at score+0.01 with the
            inclusive >= comparison, which is precisely the threshold boundary triple this row asks for.

      - name: derived_counters_are_running_aggregates
        claim_type: aggregation
        grounds:
          - calculations.derived_counter_reconciliation
          - entities.CollectionCenter.fields.committed_slot_minutes
          - entities.DonorProfile.fields.blocked_day_count
        excluded_because:
          difficulty_instance: booking_cancellation_restores_center_minutes_and_donor_blocked_days
          rationale: |
            The add-then-reverse behaviour of both running totals, including the floor at zero after the
            reversal, is asserted in §1.8 on the same endpoints; a §1.9 instance would re-run it.

      - name: the_claim_discount_uses_tiered_pricing_on_the_subtotal_alone
        claim_type: tiered_pricing
        grounds:
          - calculations.reimbursement_claim_amount.algorithm
          - calculations.reimbursement_claim_amount.constants.DISCOUNT_TIER_1_CENTS
        excluded_because:
          difficulty_instance: reimbursement_total_requires_pinned_discount_then_fee_order_mode_c
          rationale: |
            §1.8 already walks the tier selection and the pinned discount-then-fee order on both sides of
            DISCOUNT_TIER_1_CENTS, including the international coordination fee computed on the
            post-discount base, so the tier boundaries are covered there.

      - name: overlap_detection_merges_intervals_with_two_different_semantics
        claim_type: interval_merge
        grounds:
          - calculations.center_slot_conflict_detection
          - calculations.donor_calendar_conflict_detection
        excluded_because:
          difficulty_instance: center_slot_overlap_uses_buffered_half_open_minute_intervals
          rationale: |
            Both interval families are already exercised in §1.8 - buffered half-open minute intervals for
            the center and closed whole-day intervals with legal adjacency for the donor calendar - at
            their touching boundaries, which is the whole content of this row.

      - name: rank_score_is_a_weighted_sum_of_clamped_factors
        claim_type: weighted_scoring
        grounds:
          - calculations.candidate_rank_score
          - calculations.candidate_rank_score.constants
        excluded_because:
          difficulty_instance: candidate_rank_score_combines_three_clamped_factors_mode_a
          rationale: |
            §1.8 asserts the three weights, the clamped age factor and the three-branch logistics factor
            per donor archetype; §1.9 only needs the ORDERING consequence of those scores, which
            the_materialized_pool_is_ordered_and_role_assigned_by_rank_score covers.

      - name: the_two_match_score_variants_diverge_on_the_same_donor
        claim_type: Variant Divergence
        grounds:
          - calculations.match_probability_score.variants
          - entities.MatchCandidate.fields.confirmed_score
        excluded_because:
          difficulty_instance: preliminary_vs_confirmed_match_score_diverges_on_match_candidate
          rationale: |
            The PRELIMINARY/CONFIRMED delta on identical donor data (94.75 vs 98.25, ambiguity penalty and
            antigen-level comparison dropped) is the explicit subject of that §1.8 instance.

      - name: the_claim_variant_is_selected_by_the_lifecycle_moment
        claim_type: Variant Selection
        grounds:
          - calculations.reimbursement_claim_amount.variants
          - entities.ReimbursementClaim.fields.variant_applied
        excluded_because:
          difficulty_instance: provisional_vs_final_reimbursement_claim_diverges_on_claim
          rationale: |
            §1.8 already pins which variant each lifecycle moment selects - PROVISIONAL with the assumed
            method and window at claim creation, FINAL with the decided method at finalize - on the same
            claim row.

      - name: switching_to_the_final_variant_reconciles_the_patient_ledger
        claim_type: Reconciliation
        grounds:
          - calculations.reimbursement_claim_amount.variants
          - entities.Patient.fields.committed_cost_cents
        excluded_because:
          difficulty_instance: provisional_vs_final_reimbursement_claim_diverges_on_claim
          rationale: |
            The same §1.8 instance asserts the committed_cost_cents move by the FINAL-minus-PROVISIONAL
            delta at finalize; the §1.9 terminal-lockdown instance additionally proves the delta is applied
            only once, so no separate reconciliation instance is warranted.

  - section: validations
    instances:
      - name: an_inverted_calendar_range_is_rejected_and_never_blocks_a_day
        claim_type: Violation → Error
        grounds:
          - validations[priority=44]
          - validations[priority=3]
          - endpoints.POST_registry_donors_id_unavailability_windows
        distinguishing_aspect: |
          The temporal rule sits at priority 44, far below the schema rule at priority 3, so the same
          inverted range yields two different error ids depending on whether the reason enum is also
          wrong: a well-formed reason surfaces ERR_INVALID_DATE_RANGE (422) while reason
          COLLECTION_WINDOW - which this endpoint does not accept at all - surfaces ERR_INVALID_REQUEST
          (400) and hides the date defect. Neither attempt may leave a partially created window behind.
        test_recipe:
          setup:
            - "one domestic registry and one donor with an empty calendar (blocked_day_count 0)"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0001", age_years: 27, sex: "F", weight_kg: 68.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07", "07"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC", "MARROW"], ambiguous_loci: ["C"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_id: "$.data.id" }
          trigger:
            - call: "POST /registry/donors/${d1_id}/unavailability-windows"
              payload: { date_from: "2026-09-10", date_to: "2026-09-09", reason: "PERSONAL" }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              is_negative_trigger: true
              captures: { err_range: "$.data.error_id" }
            - call: "POST /registry/donors/${d1_id}/unavailability-windows"
              payload: { date_from: "2026-09-10", date_to: "2026-09-09", reason: "COLLECTION_WINDOW" }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              is_negative_trigger: true
              captures: { err_enum: "$.data.error_id" }
            - call: "GET /registry/donors/${d1_id}"
              payload: {}
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_blocked: "$.data.blocked_day_count", d1_avail: "$.data.availability_status" }
            - call: "GET /registry/donors/${d1_id}/unavailability-windows"
              payload: {}
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { win_total: "$.meta.total_count" }
          assert:
            - "the first attempt returns 422 with error_id \"ERR_INVALID_DATE_RANGE\" (date_to 2026-09-09 is earlier than date_from 2026-09-10)"
            - "the second attempt, with the SAME inverted dates but reason \"COLLECTION_WINDOW\", returns 400 with error_id \"ERR_INVALID_REQUEST\": the priority-3 schema rule fires before the priority-44 temporal rule, and the endpoint only admits PERSONAL and MEDICAL_HOLD"
            - "the donor is untouched by both rejections: blocked_day_count == 0, availability_status == \"AVAILABLE\""
            - "the donor's window list is empty (total_count == 0) - no partially created row survives a rejected request"

      - name: a_single_day_window_is_accepted_and_manually_releasable
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=44]
          - validations[priority=32]
          - entities.DonorUnavailability.fields.day_count
          - entities.DonorProfile.fields.blocked_day_count
        distinguishing_aspect: |
          date_to == date_from is the satisfying edge of the SAME rule the previous instance violates: the
          check is "not earlier than", so a zero-length range is legal and its closed inclusive day_count
          is 1, not 0. The running blocked_day_count then proves the release path for a PERSONAL row,
          which priority 32 allows unconditionally - unlike a DEFERRAL row.
        test_recipe:
          setup:
            - "one domestic registry and one donor with an empty calendar"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0001", age_years: 27, sex: "F", weight_kg: 68.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07", "07"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC", "MARROW"], ambiguous_loci: ["C"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_id: "$.data.id" }
          trigger:
            - call: "POST /registry/donors/${d1_id}/unavailability-windows"
              payload: { date_from: "2026-09-10", date_to: "2026-09-10", reason: "PERSONAL" }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { w1_id: "$.data.id", w1_days: "$.data.day_count", w1_status: "$.data.status", w1_reason: "$.data.reason" }
            - call: "POST /registry/donors/${d1_id}/unavailability-windows"
              payload: { date_from: "2026-09-11", date_to: "2026-09-13", reason: "MEDICAL_HOLD" }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { w2_id: "$.data.id", w2_days: "$.data.day_count" }
            - call: "GET /registry/donors/${d1_id}"
              payload: {}
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { blocked_after_add: "$.data.blocked_day_count" }
            - call: "DELETE /registry/donors/${d1_id}/unavailability-windows/${w1_id}"
