            - "trigger 1: data[0].supersedes_design_id == ${d1_id}"
            - "trigger 2: total_count == 0 and has_more == false — D3 has no successor of its own"
            - "MotorDesign.${d3_id}.total_predicted_loss_w == 525.9 and guaranteed_efficiency_pct == 92.47"

      - name: work_order_computed_cost_fields_ignore_any_caller_supplied_value
        claim_type: computed_fields
        grounds:
          - entities.WorkOrder.fields.direct_cost_cents
          - entities.WorkOrder.fields.overhead_band
          - calculations.work_order_cost
        excluded_because:
          difficulty_instance: boundary_precision_check / direct_cost_exactly_at_complex_band_minimum_selects_complex
          rationale: "That §1.8 instance already pins every computed cost field of a work order to literals derived from the pinned design and unit_count alone, with no caller-supplied cost input declared in §1.5."

  # ===========================================================================
  # Table 2 (State Machines) — 9 machines, state_machine_shape branching
  # ===========================================================================
  - section: state_machines
    instances:

      - name: newly_created_rows_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.MotorDesign.initial_state
          - state_machines.CustomerOrder.initial_state
          - state_machines.WorkOrder.initial_state
          - state_machines.StatorBuild.initial_state
          - state_machines.RotorBuild.initial_state
        distinguishing_aspect: |
          Five machines are entered in one chain and each must land on its OWN declared
          initial_state — including the WorkOrder's two-dimensional initial state
          (build_status RELEASED simultaneously with certification_status PENDING), which a
          single-status implementation cannot represent.
        test_recipe:
          setup:
            - "Empty DB; logical clock at the 2026-08-01T00:00:00.000Z startup default."
            - "Distributor (GOLD, EU, enrolled, committed 500, buffer 10) and design D1 RELEASED; one CONFIRMED order for 12 units."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Nordwind Antriebe", tier: "GOLD", jurisdiction: "EU", stocking_program_enrolled: true, committed_annual_units: 500, stock_buffer_units: 10 }
              as: PlantAdmin
              as_user_id: "u_admin_1"
              captures: { dist_id: $.data.id }
            - call: "POST /motor-designs"
              payload: { model_code: "WM-132M-7K5-IE3", frame_size: "132M", poles: 4, rated_output_kw: 7.5, rated_voltage_v: 400, target_efficiency_class: "IE3", lamination_grade: "M330_35A", lamination_stack_length_mm: 180, winding_copper_kg: 12.0, winding_type: "LAP", insulation_class: "F", stator_bore_id_mm: 135.400, design_air_gap_mm: 0.450, air_gap_tolerance_mm: 0.050, rotor_construction: "DIE_CAST_ALUMINUM", rotor_bar_count: 34, shaft_diameter_mm: 38.000, shaft_tolerance_class: "k6", bearing_spec_de: "6208-2Z", bearing_spec_nde: "6206-2Z", lubrication_spec: "GREASE_REGREASABLE", duty_type: "S1", enclosure: "IP55", mounting: "B3" }
              as: DesignEngineer
              as_user_id: "u_eng_1"
              captures: { d1_id: $.data.id, d1_status_at_create: $.data.status }
            - call: "POST /motor-designs/${d1_id}/submit-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "u_eng_1"
            - call: "POST /motor-designs/${d1_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: DesignReviewer
              as_user_id: "u_rev_1"
              captures: { d1_v: $.data.version }
            - call: "POST /customer-orders"
              payload: { distributor_id: "${dist_id}", design_id: "${d1_id}", order_type: "MADE_TO_ORDER", quantity: 12, requested_ship_date: "2026-12-01", jurisdiction: "EU" }
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { o1_id: $.data.id, o1_status_at_create: $.data.status }
            - call: "POST /customer-orders/${o1_id}/confirm"
              payload: {}
              as: ProductionPlanner
              as_user_id: "u_plan_1"
          trigger:
            - call: "POST /work-orders"
              payload: { order_id: "${o1_id}", design_id: "${d1_id}", unit_count: 12, expected_design_version: "${d1_v}" }
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { wo1_id: $.data.id, wo1_build: $.data.build_status, wo1_cert: $.data.certification_status }
            - call: "POST /stator-builds"
              payload: { work_order_id: "${wo1_id}", insulation_system: "CLASS_F_POLYESTERIMIDE", slot_fill_pct: 82.00 }
              as: BuildTechnician
              as_user_id: "u_tech_1"
              captures: { sb1_id: $.data.id, sb1_status: $.data.status }
            - call: "POST /rotor-builds"
              payload: { work_order_id: "${wo1_id}" }
              as: BuildTechnician
              as_user_id: "u_tech_1"
              captures: { rb1_id: $.data.id, rb1_status: $.data.status }
          assert:
            - "${d1_status_at_create} == DRAFT and MotorDesign.${d1_id}.revision_index == 0 and review_round == 0 at creation"
            - "${o1_status_at_create} == DRAFT"
            - "${wo1_build} == RELEASED and ${wo1_cert} == PENDING (both dimensions initialised together)"
            - "WorkOrder.${wo1_id}.design_pin_stale == false and rework_reject_count == 0"
            - "WorkOrder.${wo1_id}.pinned_design_revision_index == 0"
            - "${sb1_status} == WOUND and StatorBuild.${sb1_id}.winder_user_id == u_tech_1"
            - "${rb1_status} == PLANNED and RotorBuild.${rb1_id}.rotor_tech_user_id == u_tech_1"
            - "RotorBuild.${rb1_id}.construction == DIE_CAST_ALUMINUM (copied from the pinned design, not supplied)"
            - "CustomerOrder.${o1_id}.status == IN_PRODUCTION after the work order is created"

      - name: design_transitions_outside_the_declared_from_set_are_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.MotorDesign
          - validations[priority=30]
          - errors[ERR_INVALID_DESIGN_STATE]
        distinguishing_aspect: |
          Four out-of-set attempts on ONE design row, each from a different `from` state:
          review-decision and open-revision from DRAFT, submit-review from IN_REVIEW, and
          submit-review from RELEASED. The design's status and version must be unchanged by
          every rejected call, so no partial transition leaks.
        test_recipe:
          setup:
            - "One DRAFT MotorDesign (D1) created by u_eng_1; no other rows."
          setup_api_calls:
            - call: "POST /motor-designs"
              payload: { model_code: "WM-132M-7K5-IE3", frame_size: "132M", poles: 4, rated_output_kw: 7.5, rated_voltage_v: 400, target_efficiency_class: "IE3", lamination_grade: "M330_35A", lamination_stack_length_mm: 180, winding_copper_kg: 12.0, winding_type: "LAP", insulation_class: "F", stator_bore_id_mm: 135.400, design_air_gap_mm: 0.450, air_gap_tolerance_mm: 0.050, rotor_construction: "DIE_CAST_ALUMINUM", rotor_bar_count: 34, shaft_diameter_mm: 38.000, shaft_tolerance_class: "k6", bearing_spec_de: "6208-2Z", bearing_spec_nde: "6206-2Z", lubrication_spec: "GREASE_REGREASABLE", duty_type: "S1", enclosure: "IP55", mounting: "B3" }
              as: DesignEngineer
              as_user_id: "u_eng_1"
              captures: { d1_id: $.data.id }
          trigger:
            - call: "POST /motor-designs/${d1_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: DesignReviewer
              as_user_id: "u_rev_1"
              captures: { e_decide_from_draft: $.data.error_id }
            - call: "POST /motor-designs/${d1_id}/open-revision"
              payload: { revision_reason: "Customer asked for a B5 flange variant." }
              as: DesignEngineer
              as_user_id: "u_eng_1"
              captures: { e_revise_from_draft: $.data.error_id }
            - call: "POST /motor-designs/${d1_id}/submit-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "u_eng_1"
            - call: "POST /motor-designs/${d1_id}/submit-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "u_eng_1"
              captures: { e_submit_from_in_review: $.data.error_id }
            - call: "POST /motor-designs/${d1_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: DesignReviewer
              as_user_id: "u_rev_1"
            - call: "POST /motor-designs/${d1_id}/submit-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "u_eng_1"
              captures: { e_submit_from_released: $.data.error_id }
          assert:
            - "${e_decide_from_draft} == ERR_INVALID_DESIGN_STATE with HTTP 409"
            - "${e_revise_from_draft} == ERR_INVALID_DESIGN_STATE with HTTP 409"
            - "${e_submit_from_in_review} == ERR_INVALID_DESIGN_STATE with HTTP 409"
            - "${e_submit_from_released} == ERR_INVALID_DESIGN_STATE with HTTP 409"
            - "MotorDesign.${d1_id}.version == 3 (create 1, submit-review 2, approve 3 — the four rejected calls bumped nothing)"
            - "MotorDesign.${d1_id}.status == RELEASED and review_round == 1 and revision_index == 0"

      - name: obsolete_design_is_terminal_and_refuses_every_declared_trigger
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.MotorDesign.terminal_states
          - state_machines.MotorDesign.IN_REVIEW_to_OBSOLETE
          - validations[priority=30]
          - errors[ERR_INVALID_DESIGN_STATE]
        distinguishing_aspect: |
          OBSOLETE is the ONLY terminal state of the design machine and it is reached from
          IN_REVIEW, not from RELEASED. Once there, all three design endpoints must refuse —
          including submit-review, which is legal from two other states.
        test_recipe:
          setup:
            - "One MotorDesign (D1) driven DRAFT -> IN_REVIEW -> OBSOLETE by the reviewer."
          setup_api_calls:
