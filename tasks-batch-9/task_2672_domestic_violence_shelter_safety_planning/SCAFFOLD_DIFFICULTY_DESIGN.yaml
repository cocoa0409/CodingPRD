  - rule_id: compensating_invariant
    instances:
      - name: bed_ledger_fully_restored_after_reservation_cancel
        grounds:
          - state_machines.ShelterAdmission.occupancy_status.RESERVED_to_CANCELLED
          - state_machines.ScreeningRequest.ADMITTED_to_APPROVED
          - calculations.unit_bed_ledger
          - entities.ShelterUnit.fields.available_beds
          - entities.Shelter.fields.available_beds
          - endpoints[POST /shelter-admissions/{id}/cancel]
        distinguishing_aspect: |
          Conserved quantity: beds. Creating a RESERVED admission and cancelling it must leave the partition
          ShelterUnit.bed_capacity == available_beds + reserved_beds + occupied_beds intact AND restore every term to
          its pre-create value (4 == 4 + 0 + 0), with Shelter.available_beds back to 4 and capacity_posture back to
          OPEN - no fragmentation of the pool is allowed to survive the round trip.
        test_recipe:
          setup:
            - "One HotlineAdvocate (Rosa Marin) and one ShelterManager (Dana Whit) exist."
            - "Shelter Cedar House has a single FAMILY_SUITE unit A1 of bed_capacity 4 (nightly_rate_cents 8500, weekend_surcharge_cents 2500, child_supplement_cents 1200); before any admission it reads available_beds 4, reserved_beds 0, occupied_beds 0, status AVAILABLE and the shelter reads available_beds 4, capacity_posture OPEN."
            - "Client C-9701 (household_size 3, minor_children_count 2) has an APPROVED screening request assigned to Rosa Marin."
            - "A RESERVED admission for [2026-08-07, 2026-08-12) now holds three of the four beds, so A1 reads reserved_beds 3, available_beds 1, status HOLD and the shelter reads available_beds 1, capacity_posture NEAR_CAPACITY."
            - "The logical clock is at its startup default 2026-08-01T00:00:00Z, so the household has not checked in."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /staff-members"
              payload: { full_name: "Dana Whit", role_type: "SHELTER_MANAGER", max_caseload: 20 }
