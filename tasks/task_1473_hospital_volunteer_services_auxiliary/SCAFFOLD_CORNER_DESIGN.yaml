      - name: item_restock_and_disable_then_sale_rejected
        claim_type: crud
        grounds:
          - entities.GiftShopItem.fields.stock_on_hand
        distinguishing_aspect: "PUT restock_qty=5 raises stock 10 -> 15; PUT is_active=false soft-disables; a subsequent sale line on the inactive item fails ERR_ITEM_INACTIVE (409) and stock stays 15. Inactive items remain queryable (soft disable, not delete)."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z; item stock 10; an ONBOARDING volunteer exists (cashier eligibility is a LATER priority than the item-active check, so the inactive-item error still surfaces)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VolunteerServicesDirector }
            - { call: "POST /auxiliary/gift-shop-items", payload: { sku: "SKU-OLD", name: "Old Stock", unit_price_cents: 500, unit_cost_cents: 100, stock_on_hand: 10 }, as: AuxiliaryTreasurer, as_user_id: "treasurer-1", captures: { it1: $.data.id } }
            - { call: "POST /auxiliary/volunteer-applications", payload: { full_name: "Cash Caz", date_of_birth: "1990-01-01", email: "cz@x.org", phone: "555-9802" }, as: VolunteerCoordinator, captures: { app: $.data.id } }
