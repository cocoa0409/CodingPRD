scaffold_difficulty_design:

  # -------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # -------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:

      - name: dti_front_vs_back_end_diverge_on_loan_application
        grounds:
          - calculations.dti_ratio
          - entities.LoanApplication.fields.front_end_dti
          - entities.LoanApplication.fields.back_end_dti
        distinguishing_aspect: |
          Domain = LoanApplication. front_end variant uses housing payment alone
          (PI = 199591 cents); back_end variant adds Applicant.monthly_debt_cents
          (50000) to the numerator. Same inputs (income 7726104, debt 50000,
          principal 30000000, term 360, default rate 7.00%) deterministically
          produce front_end_dti=0.31 and back_end_dti=0.3877 — DIFFERENT values.
        test_recipe:
          setup:
            - "Empty DB. One Applicant with annual_income_cents=7726104, monthly_debt_cents=50000, credit_score=720, state_code=CA."
            - "One LoanApplication in DRAFT with applicant_id, requested_loan_amount_cents=30000000, property_value_cents=31578948, loan_term_months=360."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "Alice Q", email: "alice@test.com", ssn_last4: "1234", annual_income_cents: 7726104, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { applicant_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { applicant_id: "${applicant_id}", property_address: "123 Elm", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 31578948, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /loan-applications/${app_id}/prequalify"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
          assert:
            - "LoanApplication.${app_id}.front_end_dti == 0.31"
            - "LoanApplication.${app_id}.back_end_dti == 0.3877"
            - "LoanApplication.${app_id}.front_end_dti != LoanApplication.${app_id}.back_end_dti"
            - "LoanApplication.${app_id}.status == PREQUALIFIED"
            - "LoanApplication.${app_id}.prequal_decision == APPROVED"

      - name: apr_provisional_vs_final_diverge_on_disclosure
        grounds:
          - calculations.apr_calculation
          - entities.Disclosure.fields.apr_at_issuance
          - state_machines.Disclosure.DRAFT_to_DELIVERED
        distinguishing_aspect: |
          Domain = Disclosure (different from LoanApplication used by Rule 1
          instance 1). provisional variant ignores extension fees (prepaid=0);
          final variant subtracts cumulative RateLock.extension_fee_cents from
          principal before solving Newton-Raphson. Same lock (687 bps), same
          principal (30000000), term 360 — provisional APR snapshot on
          LOAN_ESTIMATE differs from final APR snapshot on CLOSING_DISCLOSURE
          delivered AFTER a 30-day extension that adds 75000 cents fee.
        test_recipe:
          setup:
            - "Empty DB. Clock at 2026-06-01T00:00:00Z."
            - "One Applicant + one LoanApplication PREQUALIFIED (front=0.31, back=0.3877, ltv=0.95)."
            - "One ACTIVE RateLock at 687 bps, 30-day term, application linked."
            - "One DELIVERED LOAN_ESTIMATE Disclosure on the application."
            - "RateLock extended once by 30 days; extension_count=1, extension_fee_cents=75000."
            - "One DRAFT CLOSING_DISCLOSURE Disclosure on the application, ready to be delivered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "POST /applicants"
              payload: { full_name: "Bob R", email: "bob@test.com", ssn_last4: "5678", annual_income_cents: 7726104, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { applicant_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { applicant_id: "${applicant_id}", property_address: "456 Oak", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 31578948, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_id: $.data.id, app_v1: $.data.version }
            - call: "POST /loan-applications/${app_id}/prequalify"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_v2: $.data.version }
            - call: "POST /rate-locks"
              payload: { application_id: "${app_id}", locked_rate_bps: 687, lock_term_days: 30, expected_application_version: "${app_v2}" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { lock_id: $.data.id }
            - call: "GET /loan-applications/${app_id}"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_v_after_lock: $.data.version }
            - call: "POST /disclosures"
              payload: { application_id: "${app_id}", disclosure_type: "LOAN_ESTIMATE", expected_application_version: "${app_v_after_lock}" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { le_id: $.data.id }
            - call: "POST /disclosures/${le_id}/deliver"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { le_apr: $.data.apr_at_issuance }
            - call: "POST /loan-applications/${app_id}/submit-for-review"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "POST /rate-locks/${lock_id}/extend"
              payload: { extend_days: 30 }
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "GET /loan-applications/${app_id}"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_v_after_ext: $.data.version }
            - call: "POST /disclosures"
              payload: { application_id: "${app_id}", disclosure_type: "CLOSING_DISCLOSURE", expected_application_version: "${app_v_after_ext}" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { cd_id: $.data.id }
          trigger:
            - call: "POST /disclosures/${cd_id}/deliver"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { cd_apr: $.data.apr_at_issuance }
          assert:
            - "Disclosure.${le_id}.apr_at_issuance == 6.870"
            - "Disclosure.${cd_id}.apr_at_issuance == 6.895"
            - "Disclosure.${le_id}.apr_at_issuance != Disclosure.${cd_id}.apr_at_issuance"
            - "LoanApplication.${app_id}.provisional_apr == 6.870"
            - "LoanApplication.${app_id}.final_apr == 6.895"
            - "RateLock.${lock_id}.extension_fee_cents == 75000"

  # -------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas (different modes)
  # -------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:

      - name: dti_formula_three_plus_inputs_nonlinear_interaction
        grounds:
          - calculations.dti_ratio
        distinguishing_aspect: |
          Mode (a) — formula has ≥3 inputs with non-linear interaction:
          monthly_income, requested_loan_amount, monthly_rate, term_months,
          monthly_debt all enter via the annuity formula
          PI = P * r / (1 - (1+r)^-n), then divide by income and compare to
          tier thresholds (0.31, 0.43). Compare DTI for two LoanApplications
          differing only in requested_loan_amount_cents — non-linear in
          principal because (1+r)^-n is exponential.
        test_recipe:
          setup:
            - "Empty DB. Two Applicants with identical income (7726104), debt (50000), credit (720)."
            - "Two LoanApplications in DRAFT — A with principal 30000000, B with principal 25000000 — both 360-month, property_value chosen to keep both LTV<=0.95."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "C", email: "c@test.com", ssn_last4: "1111", annual_income_cents: 7726104, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_a: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "D", email: "d@test.com", ssn_last4: "2222", annual_income_cents: 7726104, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_b: $.data.id }
            - call: "POST /loan-applications"
              payload: { applicant_id: "${app_a}", property_address: "P-A", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 31578948, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { la_a: $.data.id }
            - call: "POST /loan-applications"
              payload: { applicant_id: "${app_b}", property_address: "P-B", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 25000000, property_value_cents: 31578948, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { la_b: $.data.id }
            - call: "POST /loan-applications/${la_a}/prequalify"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
          trigger:
            - call: "POST /loan-applications/${la_b}/prequalify"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
          assert:
            - "LoanApplication.${la_a}.front_end_dti == 0.31"
            - "LoanApplication.${la_b}.front_end_dti == 0.2583"
            - "LoanApplication.${la_a}.back_end_dti == 0.3877"
            - "LoanApplication.${la_b}.back_end_dti == 0.336"

      - name: extension_fee_per_round_then_sum_pinned_order
        grounds:
          - calculations.rate_lock_extension_calc
          - entities.RateLock.fields.extension_fee_cents
          - state_machines.RateLock.ACTIVE_to_ACTIVE
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. requested_loan_amount
          chosen as 30000503 cents so each 7-day extension's bps fee is
          15000.2515 cents unrounded. Per-extension round-then-sum yields
          15000 + 15000 = 30000 cents; sum-then-round yields
          round(15000.2515 + 15000.2515) = round(30000.503) = 30001. The
          scaffold pins per-extension first, so extension_fee_cents == 30000
          after two 7-day extensions.
        test_recipe:
          setup:
            - "Empty DB. Clock at 2026-06-01T00:00:00Z."
            - "Applicant + LoanApplication PREQUALIFIED with requested_loan_amount_cents=30000503."
            - "ACTIVE RateLock at 687 bps, 30-day term."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "POST /applicants"
              payload: { full_name: "E", email: "e@test.com", ssn_last4: "3333", annual_income_cents: 9000000, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { applicant_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { applicant_id: "${applicant_id}", property_address: "789 Pine", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000503, property_value_cents: 35000000, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/prequalify"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_v: $.data.version }
            - call: "POST /rate-locks"
              payload: { application_id: "${app_id}", locked_rate_bps: 687, lock_term_days: 30, expected_application_version: "${app_v}" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { lock_id: $.data.id }
            - call: "POST /rate-locks/${lock_id}/extend"
              payload: { extend_days: 7 }
              as: LoanOfficer
              as_user_id: "lo-001"
          trigger:
            - call: "POST /rate-locks/${lock_id}/extend"
              payload: { extend_days: 7 }
              as: LoanOfficer
              as_user_id: "lo-001"
          assert:
            - "RateLock.${lock_id}.extension_count == 2"
            - "RateLock.${lock_id}.extension_fee_cents == 30000"
            - "RateLock.${lock_id}.extension_fee_cents != 30001"

  # -------------------------------------------------------------------------
  # Rule 3 — Non-linear state machine shapes on different entities
  # -------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:

      - name: appraisal_cyclic_completed_reconsidered_completed_loop
        grounds:
          - state_machines.Appraisal.COMPLETED_to_RECONSIDERED
          - state_machines.Appraisal.RECONSIDERED_to_COMPLETED
        distinguishing_aspect: |
          Entity = Appraisal. Cycle COMPLETED → RECONSIDERED → COMPLETED is a
          true revision loop (A→B→A), structurally different from any linear
          pipeline. Loop may repeat with no transition count cap; only the
          parent LoanApplication's non-terminal status gates re-entry.
        test_recipe:
          setup:
            - "Empty DB. Applicant + LoanApplication PREQUALIFIED."
            - "One Appraisal COMPLETED on the application with appraised_value_cents=31000000."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "F", email: "f@test.com", ssn_last4: "4444", annual_income_cents: 7726104, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { applicant_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { applicant_id: "${applicant_id}", property_address: "1 Cyclic Way", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 31578948, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/prequalify"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "POST /appraisals"
              payload: { application_id: "${app_id}" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { appr_id: $.data.id }
            - call: "POST /appraisals/${appr_id}/complete"
              payload: { appraised_value_cents: 31000000 }
              as: Appraiser
              as_user_id: "appr-001"
          trigger:
            - call: "POST /appraisals/${appr_id}/reconsider"
              payload: { reconsideration_note: "Comparables suggest higher.", new_appraised_value_cents: 31500000 }
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "POST /appraisals/${appr_id}/confirm-reconsideration"
              payload: {}
              as: Appraiser
              as_user_id: "appr-001"
          assert:
            - "Appraisal.${appr_id}.status == COMPLETED"
            - "Appraisal.${appr_id}.appraised_value_cents == 31500000"
            - "Appraisal.${appr_id}.reconsideration_note == 'Comparables suggest higher.'"

      - name: loan_application_prequalify_branching_approve_or_deny
        grounds:
          - state_machines.LoanApplication.DRAFT_to_PREQUALIFIED
          - state_machines.LoanApplication.DRAFT_to_DENIED
        distinguishing_aspect: |
          Entity = LoanApplication (different entity from Appraisal in instance 1).
          A single trigger (POST /prequalify) branches to PREQUALIFIED OR DENIED
          based on computed back_end_dti and ltv_ratio. Two applications with
          different inputs traverse different branches from the same DRAFT
          starting state — fork-join shape (one trigger, two terminal targets).
        test_recipe:
          setup:
            - "Empty DB. Two Applicants, two LoanApplications in DRAFT."
            - "App-PASS configured for back_dti<=0.43 and ltv<=0.95."
            - "App-FAIL configured for back_dti>0.43 (very low income)."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_name: "G-PASS", email: "g@test.com", ssn_last4: "5555", annual_income_cents: 7726104, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { ap_pass: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "H-FAIL", email: "h@test.com", ssn_last4: "6666", annual_income_cents: 4800000, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { ap_fail: $.data.id }
            - call: "POST /loan-applications"
              payload: { applicant_id: "${ap_pass}", property_address: "PASS-1", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 31578948, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { la_pass: $.data.id }
            - call: "POST /loan-applications"
              payload: { applicant_id: "${ap_fail}", property_address: "FAIL-1", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 31578948, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { la_fail: $.data.id }
          trigger:
            - call: "POST /loan-applications/${la_pass}/prequalify"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "POST /loan-applications/${la_fail}/prequalify"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-002"
          assert:
            - "LoanApplication.${la_pass}.status == PREQUALIFIED"
            - "LoanApplication.${la_pass}.prequal_decision == APPROVED"
            - "LoanApplication.${la_fail}.status == DENIED"
            - "LoanApplication.${la_fail}.prequal_decision == DENIED"

  # -------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # -------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:

      - name: appraisal_complete_ltv_denial_ratelock_cancel_depth3
        grounds:
          - state_machines.Appraisal.ORDERED_to_COMPLETED
          - state_machines.LoanApplication.PREQUALIFIED_to_DENIED
          - state_machines.RateLock.ACTIVE_to_CANCELLED
          - calculations.ltv_ratio
        distinguishing_aspect: |
          Trigger = POST /appraisals/{id}/complete. Depth-3 cascade:
          (1) Appraisal mutates (status=COMPLETED, appraised_value_cents=X)
          → that mutation triggers (2) LoanApplication.ltv_ratio recompute
          using min(property_value, X) which crosses 0.95 threshold and
          causes LoanApplication.status auto-flip to DENIED (mutation on
          LoanApp.status caused by the LTV mutation)
          → which itself triggers (3) the ACTIVE RateLock auto-CANCEL
          (mutation on RateLock.status caused by LoanApp.status DENIED).
          Each link is caused by the previous link's mutation.
        test_recipe:
          setup:
            - "Empty DB. Clock at 2026-06-01T00:00:00Z."
            - "Applicant + LoanApplication PREQUALIFIED (prequal LTV provisional=0.95 boundary; stated property_value_cents=31578948)."
            - "ACTIVE RateLock at 687 bps, 30-day term."
            - "Appraisal in ORDERED status."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "POST /applicants"
              payload: { full_name: "I", email: "i@test.com", ssn_last4: "7777", annual_income_cents: 7726104, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { applicant_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { applicant_id: "${applicant_id}", property_address: "Cascade Ln", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 31578948, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/prequalify"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_v: $.data.version }
            - call: "POST /rate-locks"
              payload: { application_id: "${app_id}", locked_rate_bps: 687, lock_term_days: 30, expected_application_version: "${app_v}" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { lock_id: $.data.id }
            - call: "POST /appraisals"
              payload: { application_id: "${app_id}" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { appr_id: $.data.id }
          trigger:
            - call: "POST /appraisals/${appr_id}/complete"
              payload: { appraised_value_cents: 30000000 }
              as: Appraiser
              as_user_id: "appr-001"
          assert:
            - "Appraisal.${appr_id}.status == COMPLETED"
            - "Appraisal.${appr_id}.appraised_value_cents == 30000000"
            - "LoanApplication.${app_id}.ltv_ratio == 1.0"
            - "LoanApplication.${app_id}.status == DENIED"
            - "RateLock.${lock_id}.status == CANCELLED"

      - name: withdraw_loan_application_cancels_active_ratelock_depth2
        grounds:
          - state_machines.LoanApplication.PREQUALIFIED_to_WITHDRAWN
          - state_machines.RateLock.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          Trigger = POST /loan-applications/{id}/withdraw (DIFFERENT trigger
          from the Appraisal trigger in instance 1). Depth-2 cascade: (1)
          LoanApplication mutates (status=WITHDRAWN) → (2) that mutation
          causes the ACTIVE RateLock on the same application to auto-CANCEL
          (mutation on RateLock.status caused by LoanApp.status mutation).
        test_recipe:
          setup:
            - "Empty DB. Clock at 2026-06-01T00:00:00Z."
            - "Applicant + LoanApplication PREQUALIFIED."
            - "ACTIVE RateLock at 687 bps."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanOfficer
              as_user_id: "lo-001"
            - call: "POST /applicants"
              payload: { full_name: "J", email: "j@test.com", ssn_last4: "8888", annual_income_cents: 7726104, monthly_debt_cents: 50000, credit_score: 720, state_code: "CA" }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { applicant_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { applicant_id: "${applicant_id}", property_address: "Withdraw Rd", property_state_code: "CA", loan_purpose: "PURCHASE", requested_loan_amount_cents: 30000000, property_value_cents: 31578948, loan_term_months: 360 }
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_id: $.data.id }
            - call: "POST /loan-applications/${app_id}/prequalify"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-001"
              captures: { app_v: $.data.version }
            - call: "POST /rate-locks"
              payload: { application_id: "${app_id}", locked_rate_bps: 687, lock_term_days: 30, expected_application_version: "${app_v}" }
              as: LoanOfficer
              as_user_id: "lo-001"
