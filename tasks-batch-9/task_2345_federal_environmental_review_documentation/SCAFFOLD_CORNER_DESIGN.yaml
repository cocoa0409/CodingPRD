            - "DecisionDocument.${dec_id}.objection_count == 0 and status == SIGNED"
            - "GET /decisions/${dec_id}/objections returns total_count == 0"

      - name: corner_certify_record_while_objection_still_filed_is_rejected
        claim_type: cascading_validation
        grounds: [validations.priority_13_business_temporal, errors.ERR_OBJECTIONS_PENDING]
        distinguishing_aspect: "Record certification depends on the outcome of a prior check chain: the window has closed (the temporal gate passes) yet an Objection is still FILED, so ERR_OBJECTIONS_PENDING is returned and review_stage stays DECIDED until the objection is resolved."
        test_recipe:
          setup:
            - "The ERO-1 Ridgeline FONSI decision was signed at 2026-11-01T12:00:00Z and one objection was filed the same instant."
            - "The logical clock has been advanced to 2026-12-16T12:00:00Z, so the objection window has closed."
          setup_api_calls:
            - *k_office
            - *k_action
            - *k_screen1
            - *k_adj_cleared
            - *k_classify
            - *k_pn1
            - *k_scope1
            - *k_get_act_v
            - *k_adopt
            - *k_alt_a
            - *k_alt_b
            - *k_screen_alt_a
            - *k_screen_alt_b
            - *k_agency_fws
            - *k_con_esa
            - *k_con_concur
            - *k_close_scope
            - *k_doc_ea
            - *k_clk_sep5
            - *k_publish
            - *k_clk_oct5
            - *k_close_comments
            - *k_doc_final
            - *k_decision_fonsi
            - *k_clk_nov1
            - *k_sign_fonsi
            - *k_objection
            - *k_clk_dec16
          trigger:
            - call: "POST /decisions/${dec_id}/certify-record"
              payload: {}
              as: ReviewingOfficial
            - call: "POST /objections/${obj_id}/resolve"
              payload: { disposition: "DENIED", resolution_note: "The published analysis already addresses the raised issue" }
              as: ObjectionReviewingOfficer
              as_user_id: "review-officer-3"
            - call: "POST /decisions/${dec_id}/certify-record"
              payload: {}
              as: ReviewingOfficial
          assert:
            - "The first certify-record returns 409 with data.error_id == ERR_OBJECTIONS_PENDING"
            - "After the failed attempt ProposedAction.${act_id}.review_stage == DECIDED and record_certified_at == null"
            - "The resolve returns 200 with Objection.${obj_id}.status == DENIED and DecisionDocument.${dec_id}.status still SIGNED"
            - "The second certify-record returns 200 with data.review_stage == RECORD_CERTIFIED and data.record_certified_at == 2026-12-16T12:00:00Z"

      - name: corner_mitigated_fonsi_without_commitment_is_rejected_at_sign
