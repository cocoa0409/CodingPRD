  - rule_id: priority_pair_validation_conflict
    instances:
      # ---- Instance 1: state (5) vs business_temporal (10/double-booked) -> state wins ----
      - name: confirm_invalid_state_beats_timing_window
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - state_machines.Reservation.HELD_to_CONFIRMED
        distinguishing_aspect: |
          A confirm on an already-CONFIRMED reservation whose slot_start has ALSO passed
          violates both state (priority 5, ERR_INVALID_STATE) and business_temporal
          (priority 7, ERR_TIMING_WINDOW); the lower-numbered state check wins -> ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Reservation 2026-07-14 20:00->22:00 confirmed; clock advanced to 20:30 (past slot_start)"
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Prio1", timezone: "UTC", peak_start_minute: 1080, peak_end_minute: 1380, peak_multiplier: 1.5, deposit_pct: 0.2, cancellation_cutoff_hours: 24, grace_minutes: 15, overage_grace_minutes: 10 }
              as: VenueManager
