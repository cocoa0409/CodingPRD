      - name: refresh_due_date_pinned_five_step_order_beats_fixed_point_iteration
        grounds:
          - calculations.refresh_due_date
          - calculations.adverse_media_uplift
          - calculations.residual_risk_score
          - calculations.risk_rating_assignment
          - state_machines.AdverseMediaEvent.NEW_to_CONFIRMED
          - entities.RespondentBank.fields.refresh_due_date
          - entities.RespondentBank.fields.approved_risk_rating
        distinguishing_aspect: |
          Mode (c) - a genuinely circular rule (cadence needs the rating, the rating needs the
          uplift, the uplift window needs the cadence) resolved by a pinned five-step order: step
          1 freezes base_window_end from approved_risk_rating HIGH (2027-08-01), step 2 sums the
          uplift over [2026-08-01, 2027-06-01) to 19.00, step 3 derives live rating PROHIBITED,
          step 4 takes cadence 0 and step 5 floors the result at MIN_CADENCE_DAYS, giving
          2026-08-31T00:00:00Z; an implementation that fed step 3's PROHIBITED back into steps 1
          and 2 would shrink the window to empty, keep the rating at HIGH and answer
          2027-08-01T00:00:00Z instead.
