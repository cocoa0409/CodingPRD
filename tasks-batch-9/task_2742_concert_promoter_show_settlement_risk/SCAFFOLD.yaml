# =============================================================================
# task_2742 — Concert Promoter Show Settlement & Risk
# Scaffold seed tables (§1.0–§1.7). Difficulty band: above Expert.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2742. Concert Promoter Show Settlement & Risk (national concert promoter): offer construction with
  guarantee, versus deal and backend split structures against projected ticket revenue, venue rental or
  co-promote arrangements with expense responsibility allocation, budgeted show expenses across production,
  marketing, staffing and hospitality with variance approval, ticket sales monitoring with pricing
  adjustments, comp allocation and hold releases, day-of-show expense capture with vendor invoices and
  settlement documentation, artist settlement calculation with expense verification, deductions and payment
  on site, cancellation and postponement handling with refunds, insurance claims and rescheduling,
  portfolio risk management across guarantee exposure and market performance

domain_name: concert-show-settlement
# Flat topology: every entity is its own top-level collection and links by foreign key
# in the request body. There is no single owning root resource, so the prefix is empty.
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities joined by FK fields in the body; no entity nesting in URL paths.
  # Action sub-paths (`POST /offers/{offer_id}/accept`) are state-transition triggers,
  # not entity nesting.

  state_machine_shape: cyclic
  secondary_state_machine_shapes: [parallel, branching]
  # cyclic:    Offer SUBMITTED -> COUNTERED -> SUBMITTED (negotiation rounds, capped at 3);
  #            Settlement CALCULATED -> REOPENED -> CALCULATED; VendorInvoice DISPUTED -> SUBMITTED.
  # parallel:  Show carries two independent dimensions — show_status (lifecycle) and
  #            sales_status (ticketing) — that advance on different triggers.
  # branching: BudgetLine PENDING_APPROVAL -> {APPROVED, REJECTED} with divergent side effects.

  relationship_patterns:
    - one_to_many          # Show -> Offer / BudgetLine / TicketTier / VendorInvoice
    - self_referential     # Show.rescheduled_from_show_id -> Show.id (postponement replacement)
    - cross_aggregate      # VendorInvoice -> BudgetLine and -> Show; Settlement reads Offer + Venue

  role_model: segregation_of_duties
  # The user who verifies a vendor invoice may not approve it; the user who calculates a
  # settlement may not reopen it. X-User-ID is persisted on the affected rows.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table  (11 entities, flat topology)
# =============================================================================
entities:

  # --- configuration / portfolio root -------------------------------------
  - name: Market
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Market name (e.g. 'Pacific Northwest')", constraints: "1..120 chars" }
      - { name: region_code, type: string, source: input, description: "Region code used for reporting", constraints: "2..8 chars, uppercase" }
      - { name: guarantee_exposure_limit_cents, type: integer, source: input, description: "Hard ceiling on outstanding artist guarantees this market may carry", constraints: ">= 1" }
      - { name: committed_guarantee_cents, type: integer, source: computed, default: 0, description: "See calculations.market_guarantee_exposure — sum of Show.committed_guarantee_cents over the market's shows with show_status IN {CONFIRMED, ON_SALE, PERFORMED}. POSTPONED is deliberately OUTSIDE this set (the guarantee comes off the exposure book the moment the date is pulled) even though POSTPONED IS inside the artist-routing set of validations priority 24 — the two predicates must not be shared" }
      - { name: at_risk_guarantee_cents, type: integer, source: computed, default: 0, description: "See calculations.market_guarantee_exposure — sum over the same show set of max(0, breakeven_cents - adjusted_gross_cents), less insurance recoveries already settled, floored at 0; because breakeven_cents folds in recognised deductible expense, an approved variance moves this field" }
      - { name: exposure_utilization_pct, type: number, source: computed, default: 0, description: "round_half_up(committed_guarantee_cents * 10000 / guarantee_exposure_limit_cents) / 100 — two decimals" }
      - { name: risk_posture, type: enum, source: computed, default: OPEN, description: "OPEN | WATCH | RESTRICTED | FROZEN — banded from exposure_utilization_pct per calculations.market_guarantee_exposure", constraints: "OPEN | WATCH | RESTRICTED | FROZEN" }
      - { name: settled_show_count, type: integer, source: computed, default: 0, description: "Count of the market's shows whose Settlement.status == PAID" }
      - { name: performance_index, type: integer, source: computed, default: 0, description: "See calculations.market_performance_index — TRAILING_SETTLED variant, integer percent; 0 when the input set is empty" }

  - name: Artist
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Artist / act name", constraints: "1..120 chars" }
      - { name: agency, type: string, source: input, description: "Booking agency of record", constraints: "1..120 chars" }
      - { name: tier, type: enum, source: input, description: "Commercial tier used for routing rules and reporting", constraints: "CLUB | THEATER | ARENA | HEADLINE" }
      - { name: historical_sellthrough_pct, type: number, source: input, description: "Historical paid sellthrough percentage used in projections", constraints: "0.00..100.00, two decimals" }
      - { name: withholding_pct, type: number, source: input, default: 0, description: "Statutory withholding percentage applied to artist earnings at settlement", constraints: "0.00..40.00, two decimals" }
      - { name: confirmed_show_count, type: integer, source: computed, default: 0, description: "Count of this artist's shows with show_status IN {CONFIRMED, ON_SALE, PERFORMED}" }

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; the market this venue reports into" }
      - { name: name, type: string, source: input, description: "Venue name", constraints: "1..120 chars" }
      - { name: gross_capacity, type: integer, source: input, description: "Physical capacity; sum of a show's TicketTier.allocation_qty may not exceed it", constraints: ">= 1" }
      - { name: facility_fee_cents_per_ticket, type: integer, source: input, description: "Venue facility fee retained per PAID ticket (comps excluded)", constraints: ">= 0" }
      - { name: ticket_tax_pct, type: number, source: input, description: "Amusement/ticket tax percentage applied to gross receipts", constraints: "0.00..25.00, two decimals" }

  # --- the dense hub ------------------------------------------------------
  - name: Show
    parent: null
    common_fields: true
    fields:
      - { name: artist_id, type: string, source: input, description: "FK -> Artist.id; act performing this show" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; venue hosting this show" }
      - { name: market_id, type: string, source: system, description: "FK -> Market.id; copied from Venue.market_id at creation and never re-derived" }
      - { name: rescheduled_from_show_id, type: string, source: input, default: null, description: "FK -> Show.id; set on a replacement show created for a POSTPONED original" }
      - { name: event_at, type: datetime, source: input, description: "Show start instant (ISO 8601 UTC, three fractional digits)" }
      - { name: load_in_at, type: datetime, source: input, description: "Start of the venue occupancy interval [load_in_at, load_out_at)" }
      - { name: load_out_at, type: datetime, source: input, description: "End of the venue occupancy interval, exclusive" }
      - { name: announce_at, type: datetime, source: input, description: "Earliest instant the show may go on sale" }
      - { name: show_status, type: enum, source: system, default: PLANNED, description: "Lifecycle dimension — see state_machines.Show", constraints: "PLANNED | CONFIRMED | ON_SALE | PERFORMED | SETTLED | CANCELLED | POSTPONED | RESCHEDULED" }
      - { name: sales_status, type: enum, source: system, default: PRE_SALE, description: "Ticketing dimension, independent of show_status — see state_machines.Show", constraints: "PRE_SALE | SELLING | PAUSED | CLOSED" }
      - { name: venue_arrangement, type: enum, source: input, description: "RENTAL (promoter bears every expense, venue takes a flat fee) or CO_PROMOTE (venue reimburses declared expense shares and takes a percentage of promoter net)", constraints: "RENTAL | CO_PROMOTE" }
      - { name: rental_fee_cents, type: integer, source: input, default: 0, description: "Flat venue rental fee; required and > 0 when venue_arrangement == RENTAL, must be 0 when CO_PROMOTE", constraints: ">= 0" }
      - { name: copromote_venue_share_pct, type: number, source: input, default: 0, description: "Venue percentage of promoter net before venue share; required and > 0 when venue_arrangement == CO_PROMOTE, must be 0 when RENTAL", constraints: "0.00..50.00, two decimals" }
      - { name: venue_expense_pct_production, type: number, source: input, default: 0, description: "Percentage of each PRODUCTION budget line the venue reimburses; must be 0 when venue_arrangement == RENTAL", constraints: "0.00..100.00, two decimals" }
      - { name: venue_expense_pct_marketing, type: number, source: input, default: 0, description: "Percentage of each MARKETING budget line the venue reimburses; must be 0 when venue_arrangement == RENTAL", constraints: "0.00..100.00, two decimals" }
      - { name: venue_expense_pct_staffing, type: number, source: input, default: 0, description: "Percentage of each STAFFING budget line the venue reimburses; must be 0 when venue_arrangement == RENTAL", constraints: "0.00..100.00, two decimals" }
      - { name: venue_expense_pct_hospitality, type: number, source: input, default: 0, description: "Percentage of each HOSPITALITY budget line the venue reimburses; must be 0 when venue_arrangement == RENTAL", constraints: "0.00..100.00, two decimals" }
      - { name: exposure_override_limit_cents, type: integer, source: system, default: null, description: "Set by POST /shows/{show_id}/exposure-override; when non-null it replaces Market.guarantee_exposure_limit_cents for THIS show's exposure check only" }
      - { name: exposure_override_justification, type: string, source: system, default: null, description: "Justification text recorded with the exposure override" }
      - { name: exposure_override_by_user_id, type: string, source: system, default: null, description: "Opaque X-User-ID of the RiskOfficer who granted the exposure override" }
      - { name: committed_guarantee_cents, type: integer, source: computed, default: 0, description: "guarantee_cents of the show's accepted offer (the single Offer with show_id == this Show.id AND status == ACCEPTED), else 0" }
      - { name: gross_sold_cents, type: integer, source: computed, default: 0, description: "Sum of TicketTier.gross_sold_cents over this show's tiers ONLY; transferred_in_gross_cents is added separately by calculations.adjusted_gross_receipts and is NOT folded in here" }
      - { name: paid_tickets_sold, type: integer, source: computed, default: 0, description: "Sum of TicketTier.sold_qty over this show's tiers ONLY; transferred_in_paid_tickets is added separately by calculations.adjusted_gross_receipts" }
      - { name: comp_tickets_issued, type: integer, source: computed, default: 0, description: "Sum of TicketTier.comp_qty over this show's tiers" }
      - { name: held_tickets, type: integer, source: computed, default: 0, description: "Sum of TicketTier.held_qty over this show's tiers" }
      - { name: transferred_in_gross_cents, type: integer, source: system, default: 0, description: "Paid gross transferred onto this show from a POSTPONED original by POST /cancellation-events/{id}/reschedule" }
      - { name: transferred_in_paid_tickets, type: integer, source: system, default: 0, description: "Paid ticket count transferred onto this show from a POSTPONED original" }
      - { name: adjusted_gross_cents, type: integer, source: computed, default: 0, description: "See calculations.adjusted_gross_receipts — recomputed on every sale, price adjustment, hold change and transfer" }
      - { name: total_budgeted_expense_cents, type: integer, source: computed, default: 0, description: "Sum of BudgetLine.budgeted_cents over this show's lines with status != VOID" }
      - { name: total_actual_expense_cents, type: integer, source: computed, default: 0, description: "Sum of BudgetLine.actual_cents (invoiced reality) over this show's lines with status != VOID; the RECOGNISED figure that reaches the artist is Settlement.total_settlement_expense_cents instead" }
      - { name: breakeven_cents, type: integer, source: computed, default: 0, description: "committed_guarantee_cents + min(sum of BudgetLine.settlement_expense_cents over is_artist_deductible lines, Offer.expense_cap_cents); 0 while no offer is ACCEPTED. See calculations.artist_settlement_earnings." }
      - { name: projected_adjusted_gross_cents, type: integer, source: computed, default: 0, description: "See calculations.show_settlement_projection PROVISIONAL variant — (allocation_qty - comp_qty - held_qty) valued at the CURRENT tier price, summed, then run through the adjusted-gross deduction ladder" }
      - { name: projected_promoter_net_cents, type: integer, source: computed, default: 0, description: "projected_adjusted_gross_cents - committed_guarantee_cents - total_budgeted_expense_cents (may be negative)" }
      - { name: budget_posture, type: enum, source: computed, default: ON_BUDGET, description: "ON_BUDGET when every BudgetLine.variance_status == WITHIN_TOLERANCE; VARIANCE_PENDING when any line is PENDING_APPROVAL; OVER_BUDGET otherwise (at least one APPROVED or REJECTED variance, none pending)", constraints: "ON_BUDGET | VARIANCE_PENDING | OVER_BUDGET" }
      - { name: refund_liability_cents, type: integer, source: computed, default: 0, description: "See calculations.refund_liability_and_recovery; 0 unless a CancellationEvent exists for this show" }

  # --- deal negotiation ----------------------------------------------------
  - name: Offer
    parent: null
    common_fields: true
    fields:
      - { name: show_id, type: string, source: input, description: "FK -> Show.id; the show this offer is written against" }
      - { name: deal_structure, type: enum, source: input, description: "FLAT_GUARANTEE | VERSUS | GUARANTEE_PLUS_BACKEND — selects the artist-earnings variant at settlement", constraints: "FLAT_GUARANTEE | VERSUS | GUARANTEE_PLUS_BACKEND" }
      - { name: guarantee_cents, type: integer, source: input, description: "Artist guarantee — the floor the promoter owes regardless of sales", constraints: ">= 1" }
      - { name: deposit_cents, type: integer, source: input, description: "Non-refundable deposit wired at confirmation; credited against payment_due_cents at settlement", constraints: ">= 0, <= guarantee_cents" }
      - { name: expense_cap_cents, type: integer, source: input, description: "Ceiling on artist-deductible show expenses recognised at settlement", constraints: ">= 1" }
      - { name: versus_pct, type: number, source: input, default: 0, description: "Artist percentage of net-after-expenses; required and > 0 when deal_structure == VERSUS, must be 0 otherwise", constraints: "0.00..100.00, two decimals" }
      - { name: backend_split_artist_pct, type: number, source: input, default: 0, description: "Artist percentage of gross over breakeven; required and > 0 when deal_structure == GUARANTEE_PLUS_BACKEND, must be 0 otherwise", constraints: "0.00..100.00, two decimals" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "See state_machines.Offer", constraints: "DRAFT | SUBMITTED | COUNTERED | ACCEPTED | WITHDRAWN | SUPERSEDED | EXPIRED" }
      - { name: round_index, type: integer, source: system, default: 1, description: "Negotiation round; incremented on every COUNTERED -> SUBMITTED revision; capped by NEGOTIATION_ROUND_LIMIT (3)" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the most recent SUBMITTED entry" }
      - { name: expires_at, type: datetime, source: system, default: null, description: "submitted_at + OFFER_TTL_HOURS (72); POST /_ops/run expires SUBMITTED offers at or past this instant" }
      - { name: counter_guarantee_cents, type: integer, source: input, default: null, description: "Guarantee the artist side asked for in the most recent counter" }
      - { name: counter_versus_pct, type: number, source: input, default: null, description: "Versus percentage the artist side asked for in the most recent counter" }
      - { name: counter_backend_split_artist_pct, type: number, source: input, default: null, description: "Backend split the artist side asked for in the most recent counter" }
      - { name: counter_note, type: string, source: input, default: null, description: "Free-text note attached to the most recent counter" }
      - { name: accepted_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ArtistRep who accepted; equals Show.artist_id" }

  # --- budget & expense capture -------------------------------------------
  - name: BudgetLine
    parent: null
    common_fields: true
    fields:
      - { name: show_id, type: string, source: input, description: "FK -> Show.id; the show this line budgets" }
      - { name: category, type: enum, source: input, description: "PRODUCTION | MARKETING | STAFFING | HOSPITALITY", constraints: "PRODUCTION | MARKETING | STAFFING | HOSPITALITY" }
      - { name: description, type: string, source: input, description: "What the line pays for", constraints: "1..200 chars" }
      - { name: budgeted_cents, type: integer, source: input, description: "Budgeted amount", constraints: ">= 1" }
      - { name: is_artist_deductible, type: boolean, source: input, default: false, description: "Whether this line enters allowed_expense_cents in the artist settlement" }
      - { name: actual_cents, type: integer, source: computed, default: 0, description: "Sum of VendorInvoice.amount_cents over this line's invoices with status == APPROVED" }
      - { name: variance_cents, type: integer, source: computed, default: 0, description: "actual_cents - budgeted_cents (may be negative)" }
      - { name: variance_pct, type: number, source: computed, default: 0, description: "round_half_up(variance_cents * 10000 / budgeted_cents) / 100 — two decimals; the ROUNDED value is what the tolerance bands compare" }
      - { name: variance_status, type: enum, source: system, default: WITHIN_TOLERANCE, description: "See state_machines.BudgetLine", constraints: "WITHIN_TOLERANCE | PENDING_APPROVAL | APPROVED | REJECTED" }
      - { name: required_approver_role, type: enum, source: computed, default: null, description: "NONE when variance_pct <= VARIANCE_TOLERANCE_PCT; TOUR_ACCOUNTANT when <= VARIANCE_ESCALATION_PCT; RISK_OFFICER when above it", constraints: "NONE | TOUR_ACCOUNTANT | RISK_OFFICER" }
      - { name: approved_cap_cents, type: integer, source: input, default: null, description: "Ceiling accepted by the variance approver; settlement recognises min(actual_cents, approved_cap_cents)" }
      - { name: variance_decided_by_user_id, type: string, source: system, default: null, description: "Opaque X-User-ID of the approver/rejecter of the current variance decision" }
      - { name: variance_justification, type: string, source: input, default: null, description: "Justification recorded with the variance decision" }
      - { name: settlement_expense_cents, type: integer, source: computed, default: 0, description: "See calculations.budget_line_variance_recognition — actual_cents, min(actual_cents, approved_cap_cents), or budgeted_cents depending on variance_status" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE while the show is open; SETTLED once the show's Settlement is PAID; VOID when the show is CANCELLED", constraints: "ACTIVE | SETTLED | VOID" }

  - name: VendorInvoice
    parent: null
    common_fields: true
    fields:
      - { name: show_id, type: string, source: input, description: "FK -> Show.id; the show being invoiced" }
      - { name: budget_line_id, type: string, source: input, description: "FK -> BudgetLine.id; the line this invoice charges" }
      - { name: vendor_name, type: string, source: input, description: "Vendor of record", constraints: "1..120 chars" }
      - { name: amount_cents, type: integer, source: input, description: "Invoiced amount", constraints: ">= 1" }
      - { name: invoice_date, type: datetime, source: input, description: "Vendor invoice date" }
      - { name: documentation_ref, type: string, source: input, description: "Settlement-book document reference (packet page / scan id)", constraints: "1..64 chars" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "See state_machines.VendorInvoice", constraints: "SUBMITTED | VERIFIED | APPROVED | DISPUTED | REJECTED" }
      - { name: verified_by_user_id, type: string, source: system, default: null, description: "Opaque X-User-ID of the TourAccountant who verified the invoice" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "Opaque X-User-ID of the approver; MUST differ from verified_by_user_id" }
      - { name: dispute_reason, type: string, source: input, default: null, description: "Reason recorded when the invoice is disputed" }
      - { name: resubmit_count, type: integer, source: system, default: 0, description: "Number of DISPUTED -> SUBMITTED resubmissions" }

  # --- ticketing -----------------------------------------------------------
  - name: TicketTier
    parent: null
    common_fields: true
    fields:
      - { name: show_id, type: string, source: input, description: "FK -> Show.id; the show this inventory belongs to" }
      - { name: tier_name, type: string, source: input, description: "Tier label (GA, PIT, BALCONY, ...)", constraints: "1..40 chars, unique per show" }
      - { name: price_cents, type: integer, source: input, description: "CURRENT face price; changed only by POST /ticket-tiers/{id}/price-adjustments", constraints: ">= 1" }
      - { name: allocation_qty, type: integer, source: input, description: "Total seats allocated to this tier — the conserved quantity", constraints: ">= 1" }
      - { name: sold_qty, type: integer, source: computed, default: 0, description: "Paid seats sold, accumulated by POST /ticket-tiers/{id}/sales" }
      - { name: gross_sold_cents, type: integer, source: computed, default: 0, description: "See calculations.tier_gross_accumulation — accumulates qty * price_cents AT THE INSTANT OF EACH SALE, never sold_qty * current price" }
      - { name: comp_qty, type: integer, source: computed, default: 0, description: "Sum of TicketHold.qty over this tier's holds where (kind == COMP AND status == HELD) OR status == CONVERTED" }
      - { name: held_qty, type: integer, source: computed, default: 0, description: "Sum of TicketHold.qty over this tier's holds where kind != COMP AND status == HELD" }
      - { name: available_qty, type: integer, source: computed, default: 0, description: "allocation_qty - sold_qty - comp_qty - held_qty; the invariant allocation_qty == sold_qty + comp_qty + held_qty + available_qty always holds" }
      - { name: price_revision_count, type: integer, source: system, default: 0, description: "Number of applied price adjustments" }
      - { name: last_price_cents, type: integer, source: system, default: null, description: "Face price immediately before the most recent adjustment" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "See state_machines.TicketTier", constraints: "DRAFT | ON_SALE | PAUSED | CLOSED" }

  - name: TicketHold
    parent: null
    common_fields: true
    fields:
      - { name: ticket_tier_id, type: string, source: input, description: "FK -> TicketTier.id; the inventory pool this hold blocks" }
      - { name: kind, type: enum, source: input, description: "COMP (papered seats, counted as comps immediately) | ARTIST_HOLD | PRODUCTION_HOLD | PROMOTER_HOLD", constraints: "COMP | ARTIST_HOLD | PRODUCTION_HOLD | PROMOTER_HOLD" }
      - { name: qty, type: integer, source: input, description: "Seats blocked", constraints: ">= 1" }
      - { name: holder, type: string, source: input, description: "Who the seats are held for", constraints: "1..120 chars" }
      - { name: expires_at, type: datetime, source: input, default: null, description: "Optional auto-release instant; POST /_ops/run expires HELD rows at or past this instant" }
      - { name: status, type: enum, source: system, default: HELD, description: "See state_machines.TicketHold", constraints: "HELD | RELEASED | CONVERTED | EXPIRED" }
      - { name: released_by_user_id, type: string, source: system, default: null, description: "Opaque X-User-ID that released or converted the hold" }

  # --- settlement ----------------------------------------------------------
  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: show_id, type: string, source: input, description: "FK -> Show.id; the show being settled" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "See state_machines.Settlement", constraints: "DRAFT | CALCULATED | ARTIST_SIGNED | PAID | DISPUTED | REOPENED" }
      - { name: deal_structure_applied, type: enum, source: computed, default: null, description: "deal_structure copied from the show's ACCEPTED Offer at each calculate", constraints: "FLAT_GUARANTEE | VERSUS | GUARANTEE_PLUS_BACKEND" }
      - { name: gross_receipts_cents, type: integer, source: computed, default: 0, description: "Show.gross_sold_cents at calculate time (time-of-sale prices, includes transferred_in_gross_cents)" }
      - { name: ticket_tax_cents, type: integer, source: computed, default: 0, description: "Deduction step 1 of calculations.adjusted_gross_receipts" }
      - { name: facility_fee_cents, type: integer, source: computed, default: 0, description: "Deduction step 2 of calculations.adjusted_gross_receipts" }
      - { name: credit_card_fee_cents, type: integer, source: computed, default: 0, description: "Deduction step 3 of calculations.adjusted_gross_receipts (post-tax base)" }
      - { name: adjusted_gross_cents, type: integer, source: computed, default: 0, description: "gross_receipts_cents - ticket_tax_cents - facility_fee_cents - credit_card_fee_cents" }
      - { name: total_settlement_expense_cents, type: integer, source: computed, default: 0, description: "Sum of BudgetLine.settlement_expense_cents over the show's lines with status != VOID" }
      - { name: allowed_expense_cents, type: integer, source: computed, default: 0, description: "min(sum of settlement_expense_cents over lines with is_artist_deductible == true, Offer.expense_cap_cents)" }
      - { name: venue_expense_reimbursement_cents, type: integer, source: computed, default: 0, description: "See calculations.venue_expense_reimbursement — rounded PER BUDGET LINE, then summed" }
      - { name: promoter_borne_expense_cents, type: integer, source: computed, default: 0, description: "total_settlement_expense_cents - venue_expense_reimbursement_cents" }
      - { name: breakeven_cents, type: integer, source: computed, default: 0, description: "allowed_expense_cents + Offer.guarantee_cents (the guarantee IS part of breakeven for backend deals)" }
      - { name: artist_base_earnings_cents, type: integer, source: computed, default: 0, description: "Step 3 of calculations.artist_settlement_earnings — before the marketing co-op deduction" }
      - { name: artist_coop_contribution_cents, type: integer, source: computed, default: 0, description: "Step 4 — min(COOP_ARTIST_SHARE_PCT of approved MARKETING settlement expense, COOP_CAP_PCT_OF_BASE of artist_base_earnings_cents)" }
      - { name: artist_earnings_cents, type: integer, source: computed, default: 0, description: "artist_base_earnings_cents - artist_coop_contribution_cents" }
      - { name: withholding_cents, type: integer, source: computed, default: 0, description: "round_half_up(artist_earnings_cents * Artist.withholding_pct / 100)" }
      - { name: deposit_credit_cents, type: integer, source: computed, default: 0, description: "Offer.deposit_cents already wired at confirmation" }
      - { name: payment_due_cents, type: integer, source: computed, default: 0, description: "artist_earnings_cents - withholding_cents - deposit_credit_cents (may be negative — an artist overpayment to claw back)" }
      - { name: venue_share_cents, type: integer, source: computed, default: 0, description: "See calculations.settlement_split — rental fee under RENTAL, percentage of promoter net before venue share under CO_PROMOTE" }
      - { name: promoter_net_cents, type: integer, source: computed, default: 0, description: "adjusted_gross_cents - artist_earnings_cents - promoter_borne_expense_cents - venue_share_cents (may be negative)" }
      - { name: calculated_by_user_id, type: string, source: system, default: null, description: "Opaque X-User-ID of the TourAccountant of the most recent calculate" }
      - { name: signed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ArtistRep who signed; equals Show.artist_id" }
      - { name: paid_at, type: datetime, source: system, default: null, description: "Logical-clock instant of payment on site" }
      - { name: payment_method, type: enum, source: input, default: null, description: "WIRE | CHECK | CASH — recorded at payment", constraints: "WIRE | CHECK | CASH" }
      - { name: payment_reference, type: string, source: input, default: null, description: "Wire/check reference captured with the payment" }
      - { name: dispute_reason, type: string, source: input, default: null, description: "Reason recorded when the artist disputes the settlement" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Number of times this settlement has been reopened" }
      - { name: reopen_reason, type: string, source: input, default: null, description: "Reason recorded on the most recent reopen" }

  # --- cancellation / postponement -----------------------------------------
  - name: CancellationEvent
    parent: null
    common_fields: true
    fields:
      - { name: show_id, type: string, source: input, description: "FK -> Show.id; the show being cancelled or postponed" }
      - { name: replacement_show_id, type: string, source: input, default: null, description: "FK -> Show.id; the replacement show linked by POST /cancellation-events/{id}/reschedule" }
      - { name: kind, type: enum, source: input, description: "CANCELLED (no replacement, refunds owed) | POSTPONED (rescheduling permitted, refunds deferred)", constraints: "CANCELLED | POSTPONED" }
      - { name: reason, type: string, source: input, description: "Why the show was pulled", constraints: "1..200 chars" }
      - { name: status, type: enum, source: system, default: OPENED, description: "See state_machines.CancellationEvent", constraints: "OPENED | REFUNDS_PROCESSED | CLAIM_FILED | CLAIM_SETTLED | CLAIM_DENIED | RESCHEDULED" }
      - { name: occurred_at, type: datetime, source: system, description: "Logical-clock instant the event was opened; starts the INSURANCE_CLAIM_WINDOW_DAYS (30) window" }
      - { name: refund_liability_cents, type: integer, source: computed, default: 0, description: "See calculations.refund_liability_and_recovery — face gross owed back to ticket buyers" }
      - { name: refunded_ticket_count, type: integer, source: computed, default: 0, description: "Paid tickets refunded when refunds were processed" }
      - { name: unrecovered_cost_cents, type: integer, source: computed, default: 0, description: "See calculations.refund_liability_and_recovery — sum of BudgetLine.settlement_expense_cents over the show's ACTIVE|VOID lines plus the accepted Offer's deposit_cents" }
      - { name: claim_amount_cents, type: integer, source: input, default: null, description: "Amount claimed against the cancellation policy" }
      - { name: covered_loss_cents, type: integer, source: computed, default: 0, description: "min(claim_amount_cents, unrecovered_cost_cents, INSURANCE_POLICY_CAP_CENTS); 0 on a denied claim" }
      - { name: insurance_recovery_cents, type: integer, source: computed, default: 0, description: "max(0, min(covered_loss_cents - INSURANCE_DEDUCTIBLE_CENTS, INSURANCE_POLICY_CAP_CENTS)); 0 until the claim is settled" }
      - { name: claim_documentation_ref, type: string, source: input, default: null, description: "Documentation reference filed with the insurer" }
      - { name: insurer_reference, type: string, source: input, default: null, description: "Insurer's claim number recorded at claim settlement" }
      - { name: filed_by_user_id, type: string, source: system, default: null, description: "Opaque X-User-ID of the RiskOfficer who filed the claim" }

# =============================================================================
# §1.2 State Machine Table  (8 entities, 9 machine entries; Show carries two independent dimensions)
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- Show (1/2)
  - entity: Show
    dimension: show_status
    initial_state: PLANNED
    terminal_states: [SETTLED, CANCELLED, RESCHEDULED]
    note: |
      Lifecycle dimension. It advances ONLY on offer acceptance, on-sale, perform, settlement payment
      and cancellation/postponement. Pausing or resuming ticket sales never changes show_status.
    transitions:
      - from: PLANNED
        to: CONFIRMED
        trigger: "POST /offers/{offer_id}/accept"
        actor: ArtistRep
        preconditions:
          - "offer.status == SUBMITTED"
          - "X-User-ID == show.artist_id (ArtistRep owns the act)"
          - "show.show_status == PLANNED"
          - "market.risk_posture != FROZEN (evaluated on the market's PRE-transition posture)"
          - "market.committed_guarantee_cents + offer.guarantee_cents <= effective_exposure_limit, where effective_exposure_limit = show.exposure_override_limit_cents when non-null else market.guarantee_exposure_limit_cents"
          - "no other Show with the same artist_id and show_status IN {CONFIRMED, ON_SALE, PERFORMED, POSTPONED} has abs(event_at - this.event_at) < ARTIST_REST_BUFFER_HOURS (36) — the ROUTING set deliberately includes POSTPONED (the act still holds that night pending a reschedule), unlike the market EXPOSURE set in calculations.market_guarantee_exposure, which does not (validations priority 24)"
        side_effects:
          - "offer.status = ACCEPTED; offer.accepted_by_user_id = X-User-ID"
          - "every other Offer for this show with status IN {SUBMITTED, COUNTERED} -> SUPERSEDED"
          - "show.committed_guarantee_cents = offer.guarantee_cents"
          - "CASCADE hop 1: show.committed_guarantee_cents changing recomputes show.breakeven_cents (calculations.artist_settlement_earnings step 2) and show.projected_promoter_net_cents"
          - "CASCADE hop 2: the show entering the {CONFIRMED, ON_SALE, PERFORMED} exposure set recomputes market.committed_guarantee_cents and market.at_risk_guarantee_cents (calculations.market_guarantee_exposure)"
          - "CASCADE hop 3: market.committed_guarantee_cents changing recomputes market.exposure_utilization_pct and re-bands market.risk_posture"
          - "artist.confirmed_show_count += 1"
          - "increments Show.version by 1; increments Market.version by 1; increments Offer.version by 1"

      - from: CONFIRMED
        to: ON_SALE
        trigger: "POST /shows/{show_id}/on-sale"
        actor: TalentBuyer
        preconditions:
          - "show.show_status == CONFIRMED"
          - "at least one TicketTier exists for the show (empty tier set is rejected)"
          - "clock_now >= show.announce_at"
          - "sum of TicketTier.allocation_qty over the show <= venue.gross_capacity"
        side_effects:
          - "show.sales_status PRE_SALE -> SELLING (same trigger advances both dimensions)"
          - "every TicketTier for the show with status == DRAFT -> ON_SALE"
          - "increments Show.version by 1"

      - from: ON_SALE
        to: PERFORMED
        trigger: "POST /shows/{show_id}/perform"
        actor: TourAccountant
        preconditions:
          - "show.show_status == ON_SALE"
          - "clock_now >= show.event_at"
        side_effects:
          - "show.sales_status -> CLOSED"
          - "every TicketTier for the show with status IN {DRAFT, ON_SALE, PAUSED} -> CLOSED"
          - "show.adjusted_gross_cents frozen at its current value (no further sales can change it)"
          - "increments Show.version by 1"

      - from: PERFORMED
        to: SETTLED
        trigger: "POST /settlements/{settlement_id}/pay (system side effect)"
        actor: system
        preconditions:
          - "settlement.status == ARTIST_SIGNED"
          - "settlement.show_id == show.id"
        side_effects:
          - "every BudgetLine for the show with status == ACTIVE -> SETTLED"
          - "artist.confirmed_show_count -= 1 — a SETTLED show is outside the {CONFIRMED, ON_SALE, PERFORMED} window the field counts"
          - "CASCADE hop 1: the show leaving the exposure set (a PAID settlement now exists) recomputes market.committed_guarantee_cents and market.at_risk_guarantee_cents"
          - "CASCADE hop 2: market.committed_guarantee_cents changing recomputes market.exposure_utilization_pct and re-bands market.risk_posture"
          - "market.performance_index recomputed (calculations.market_performance_index, TRAILING_SETTLED)"
          - "increments Show.version by 1; increments Market.version by 1"

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /cancellation-events (kind = CANCELLED)"
        actor: RiskOfficer
        preconditions:
          - "show.show_status IN {PLANNED, CONFIRMED, ON_SALE}"
          - "no CancellationEvent already exists for this show"
        side_effects:
          - "see the CONFIRMED -> CANCELLED transition; identical side-effect set, except committed_guarantee_cents is already 0 so market exposure does not move"
        note: "A show with no accepted offer can still be pulled (announce cancelled before the deal closed)."

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /cancellation-events (kind = CANCELLED)"
        actor: RiskOfficer
        preconditions:
          - "show.show_status IN {PLANNED, CONFIRMED, ON_SALE}"
          - "no CancellationEvent already exists for this show"
        side_effects:
          - "CancellationEvent created in status OPENED with occurred_at = clock_now"
          - "cancellation.refund_liability_cents = show.gross_sold_cents (calculations.refund_liability_and_recovery); show.refund_liability_cents mirrors it"
          - "show.sales_status -> CLOSED; every TicketTier -> CLOSED"
          - "every BudgetLine for the show with status == ACTIVE -> VOID"
          - "every Offer for the show with status IN {DRAFT, SUBMITTED, COUNTERED} -> WITHDRAWN"
          - "CASCADE hop 1: show.show_status leaving {CONFIRMED, ON_SALE, PERFORMED} recomputes market.committed_guarantee_cents and market.at_risk_guarantee_cents"
          - "CASCADE hop 2: market.committed_guarantee_cents changing recomputes market.exposure_utilization_pct and re-bands market.risk_posture"
          - "artist.confirmed_show_count -= 1"
          - "increments Show.version by 1; increments Market.version by 1"

      - from: ON_SALE
        to: CANCELLED
        trigger: "POST /cancellation-events (kind = CANCELLED)"
        actor: RiskOfficer
        preconditions:
          - "show.show_status IN {PLANNED, CONFIRMED, ON_SALE}"
          - "no CancellationEvent already exists for this show"
        side_effects:
          - "identical to the CONFIRMED -> CANCELLED side-effect set (refund_liability_cents is non-zero once tickets have been sold)"

      - from: ON_SALE
        to: POSTPONED
        trigger: "POST /cancellation-events (kind = POSTPONED)"
        actor: RiskOfficer
        preconditions:
          - "show.show_status IN {CONFIRMED, ON_SALE}"
          - "no CancellationEvent already exists for this show"
        side_effects:
          - "CancellationEvent created in status OPENED with occurred_at = clock_now"
          - "cancellation.refund_liability_cents = show.gross_sold_cents; show.refund_liability_cents mirrors it"
          - "show.sales_status -> CLOSED; every TicketTier -> CLOSED"
          - "BudgetLines are NOT voided (they carry to the replacement show)"
          - "artist.confirmed_show_count -= 1 — the field counts only {CONFIRMED, ON_SALE, PERFORMED}, so a postponed show leaves the count even though it keeps blocking the artist's routing window (validations priority 24)"
          - "CASCADE hop 1: show leaves the exposure set, recomputing market.committed_guarantee_cents / at_risk_guarantee_cents"
          - "CASCADE hop 2: market.exposure_utilization_pct recomputed and market.risk_posture re-banded"
          - "increments Show.version by 1; increments Market.version by 1"

      - from: CONFIRMED
        to: POSTPONED
        trigger: "POST /cancellation-events (kind = POSTPONED)"
        actor: RiskOfficer
        preconditions:
          - "show.show_status IN {CONFIRMED, ON_SALE}"
          - "no CancellationEvent already exists for this show"
        side_effects:
          - "identical to the ON_SALE -> POSTPONED side-effect set"

      - from: POSTPONED
        to: RESCHEDULED
        trigger: "POST /cancellation-events/{cancellation_event_id}/reschedule"
        actor: TalentBuyer
        preconditions:
          - "cancellation.kind == POSTPONED and cancellation.status == OPENED"
          - "replacement_show.rescheduled_from_show_id == cancellation.show_id"
          - "replacement_show.show_status == PLANNED"
        side_effects:
          - "cancellation.status -> RESCHEDULED; cancellation.replacement_show_id = replacement_show.id"
          - "replacement_show.transferred_in_gross_cents += original.gross_sold_cents; replacement_show.transferred_in_paid_tickets += original.paid_tickets_sold"
          - "CASCADE hop 1: replacement_show.gross_sold_cents / paid_tickets_sold change, recomputing replacement_show.adjusted_gross_cents (calculations.adjusted_gross_receipts)"
          - "original.refund_liability_cents = 0 and cancellation.refund_liability_cents = 0 (the money moved instead of being refunded)"
          - "increments Show.version by 1 on BOTH shows"

  # ---------------------------------------------------------------- Show (2/2)
  - entity: Show
    dimension: sales_status
    initial_state: PRE_SALE
    terminal_states: [CLOSED]
    note: |
      Ticketing dimension. SELLING <-> PAUSED cycles freely while show_status stays ON_SALE, which is what
      makes the two dimensions independent: a paused show is still ON_SALE and still settles normally.
    transitions:
      - from: PRE_SALE
        to: SELLING
        trigger: "POST /shows/{show_id}/on-sale"
        actor: TalentBuyer
        preconditions:
          - "show.sales_status == PRE_SALE"
          - "show.show_status == CONFIRMED"
        side_effects:
          - "show.show_status CONFIRMED -> ON_SALE (same trigger advances both dimensions)"
          - "every DRAFT TicketTier -> ON_SALE"

      - from: SELLING
        to: PAUSED
        trigger: "POST /shows/{show_id}/pause-sales"
        actor: TalentBuyer | RiskOfficer
        preconditions:
          - "show.sales_status == SELLING"
        side_effects:
          - "every TicketTier with status == ON_SALE -> PAUSED"
          - "show.show_status is left untouched (stays ON_SALE)"
          - "increments Show.version by 1"

      - from: PAUSED
        to: SELLING
        trigger: "POST /shows/{show_id}/resume-sales"
        actor: TalentBuyer
        preconditions:
          - "show.sales_status == PAUSED"
          - "show.show_status == ON_SALE"
        side_effects:
          - "every TicketTier with status == PAUSED -> ON_SALE"
          - "increments Show.version by 1"
        note: "Cycle in the sales dimension; round-tripping SELLING -> PAUSED -> SELLING leaves every tier counter untouched."

      - from: SELLING
        to: CLOSED
        trigger: "POST /shows/{show_id}/perform, or POST /cancellation-events (system side effect)"
        actor: system
        preconditions:
          - "show.sales_status IN {PRE_SALE, SELLING, PAUSED}"
        side_effects:
          - "every TicketTier -> CLOSED; no further sales, holds, conversions or price adjustments are accepted"

      - from: PAUSED
        to: CLOSED
        trigger: "POST /shows/{show_id}/perform, or POST /cancellation-events (system side effect)"
        actor: system
        preconditions:
          - "show.sales_status IN {PRE_SALE, SELLING, PAUSED}"
        side_effects:
          - "every TicketTier -> CLOSED"

      - from: PRE_SALE
        to: CLOSED
        trigger: "POST /cancellation-events (system side effect)"
        actor: system
        preconditions:
          - "show.sales_status == PRE_SALE"
        side_effects:
          - "every TicketTier -> CLOSED"

  # ---------------------------------------------------------------------- Offer
  - entity: Offer
    initial_state: DRAFT
    terminal_states: [ACCEPTED, WITHDRAWN, SUPERSEDED, EXPIRED]
    note: |
      Cyclic negotiation. SUBMITTED -> COUNTERED -> SUBMITTED is the loop; round_index increments on each
      re-submission and NEGOTIATION_ROUND_LIMIT (3) terminates it.
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /offers/{offer_id}/submit"
        actor: TalentBuyer
        preconditions:
          - "offer.status == DRAFT"
          - "show.show_status == PLANNED"
        side_effects:
          - "offer.submitted_at = clock_now; offer.expires_at = clock_now + OFFER_TTL_HOURS (72)"
          - "increments Offer.version by 1"

      - from: SUBMITTED
        to: COUNTERED
        trigger: "POST /offers/{offer_id}/counter"
        actor: ArtistRep
        preconditions:
          - "offer.status == SUBMITTED"
          - "X-User-ID == show.artist_id"
          - "show.show_status == PLANNED"
        side_effects:
          - "counter_guarantee_cents / counter_versus_pct / counter_backend_split_artist_pct / counter_note recorded"
          - "offer.expires_at = null (the clock stops while the ball is in the promoter's court)"
          - "increments Offer.version by 1"

      - from: COUNTERED
        to: SUBMITTED
        trigger: "POST /offers/{offer_id}/submit (revision carrying new terms)"
        actor: TalentBuyer
        preconditions:
          - "offer.status == COUNTERED"
          - "offer.round_index < NEGOTIATION_ROUND_LIMIT (3)"
          - "show.show_status == PLANNED"
        side_effects:
          - "guarantee_cents / deposit_cents / expense_cap_cents / versus_pct / backend_split_artist_pct replaced by the supplied values (omitted fields keep their current value)"
          - "offer.round_index += 1"
          - "offer.submitted_at = clock_now; offer.expires_at = clock_now + OFFER_TTL_HOURS (72)"
          - "counter_* fields are left as the historical record of the round just answered"
          - "increments Offer.version by 1"
        note: "This is the cycle edge. A fourth submission (round_index already == NEGOTIATION_ROUND_LIMIT (3)) is rejected with ERR_NEGOTIATION_ROUNDS_EXHAUSTED."

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /offers/{offer_id}/accept"
        actor: ArtistRep
        preconditions:
          - "see state_machines.Show PLANNED -> CONFIRMED preconditions (identical set)"
        side_effects:
          - "see state_machines.Show PLANNED -> CONFIRMED side effects (this transition IS the trigger of that cascade)"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /offers/{offer_id}/withdraw"
        actor: TalentBuyer
        preconditions:
          - "offer.status IN {DRAFT, SUBMITTED, COUNTERED}"
        side_effects:
          - "increments Offer.version by 1"

      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /offers/{offer_id}/withdraw"
        actor: TalentBuyer
        preconditions:
          - "offer.status IN {DRAFT, SUBMITTED, COUNTERED}"
        side_effects:
          - "increments Offer.version by 1"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /offers/{offer_id}/withdraw"
        actor: TalentBuyer
        preconditions:
          - "offer.status IN {DRAFT, SUBMITTED, COUNTERED}"
        side_effects:
          - "increments Offer.version by 1"
        note: |
          All three WITHDRAWN edges (from DRAFT, SUBMITTED and COUNTERED) are ALSO driven with
          actor: system by the cancellation cascade — "every Offer for the show with status IN
          {DRAFT, SUBMITTED, COUNTERED} -> WITHDRAWN" on POST /cancellation-events. An Offer
          already in a terminal state (ACCEPTED, SUPERSEDED, EXPIRED, WITHDRAWN) is never
          touched by that cascade.

      - from: SUBMITTED
        to: EXPIRED
        trigger: "POST /_ops/run (system sweep)"
        actor: system
        preconditions:
          - "offer.status == SUBMITTED"
          - "offer.expires_at != null and clock_now >= offer.expires_at"
        side_effects:
          - "offer.status = EXPIRED; the show stays PLANNED"
          - "increments Offer.version by 1"

      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "POST /offers (a newer offer is written for the same show)"
        actor: system
        preconditions:
          - "offer.status IN {SUBMITTED, COUNTERED}"
          - "the new offer's show_id == this offer's show_id"
        side_effects:
          - "increments Offer.version by 1 on the superseded row"
        note: "This is the legitimate supersede that makes POST /offers a true CREATE-with-supersede write, guarded by OCC on Show.version — see concurrency_rules.offer-create-stale-show."

      - from: COUNTERED
        to: SUPERSEDED
        trigger: "POST /offers (a newer offer is written for the same show)"
        actor: system
        preconditions:
          - "offer.status IN {SUBMITTED, COUNTERED}"
          - "the new offer's show_id == this offer's show_id"
        side_effects:
          - "increments Offer.version by 1 on the superseded row"

  # ----------------------------------------------------------------- BudgetLine
  - entity: BudgetLine
    dimension: variance_status
    initial_state: WITHIN_TOLERANCE
    terminal_states: []
    note: |
      Branching machine with a re-entry cycle: PENDING_APPROVAL forks into APPROVED and REJECTED with
      DIFFERENT side-effect sets (APPROVED recognises min(actual, cap); REJECTED clamps recognition back to
      budgeted_cents), and a later invoice approval can push a decided line back into PENDING_APPROVAL.
      The line's own lifecycle field BudgetLine.status is not part of this machine: ACTIVE -> SETTLED is a
      side effect of state_machines.Settlement ARTIST_SIGNED -> PAID, and ACTIVE -> VOID is a side effect of
      state_machines.Show CONFIRMED -> CANCELLED.
    transitions:
      - from: WITHIN_TOLERANCE
        to: PENDING_APPROVAL
        trigger: "POST /vendor-invoices/{vendor_invoice_id}/approve (system cascade hop 2)"
        actor: system
        preconditions:
          - "the approved invoice's budget_line_id == this line's id"
          - "after actual_cents is refreshed, the ROUNDED variance_pct > VARIANCE_TOLERANCE_PCT"
        side_effects:
          - "line.required_approver_role = TOUR_ACCOUNTANT when variance_pct <= VARIANCE_ESCALATION_PCT else RISK_OFFICER"
          - "line.settlement_expense_cents = budgeted_cents while the variance is unresolved (calculations.budget_line_variance_recognition)"
          - "CASCADE hop 3: show.budget_posture -> VARIANCE_PENDING, show.total_actual_expense_cents and show.breakeven_cents recomputed"
          - "CASCADE hop 4: show.breakeven_cents / projected_promoter_net_cents feed market.at_risk_guarantee_cents, which is recomputed, and market.risk_posture is re-banded"
          - "increments BudgetLine.version, Show.version and Market.version by 1 each"

      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /budget-lines/{budget_line_id}/variance-decision (decision = APPROVE)"
        actor: TourAccountant | RiskOfficer
        preconditions:
          - "line.variance_status == PENDING_APPROVAL"
          - "the acting role satisfies line.required_approver_role (RISK_OFFICER lines reject a TourAccountant actor)"
          - "approved_cap_cents is present and >= line.budgeted_cents"
          - "show.show_status IN {CONFIRMED, ON_SALE, PERFORMED}"
        side_effects:
          - "line.approved_cap_cents / variance_justification / variance_decided_by_user_id recorded"
          - "line.settlement_expense_cents = min(actual_cents, approved_cap_cents)"
          - "show.budget_posture recomputed (-> OVER_BUDGET when no line is left pending), show.breakeven_cents recomputed"
          - "market.at_risk_guarantee_cents recomputed and market.risk_posture re-banded"
          - "increments BudgetLine.version, Show.version and Market.version by 1 each"

      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /budget-lines/{budget_line_id}/variance-decision (decision = REJECT)"
        actor: TourAccountant | RiskOfficer
        preconditions:
          - "line.variance_status == PENDING_APPROVAL"
          - "the acting role satisfies line.required_approver_role"
          - "show.show_status IN {CONFIRMED, ON_SALE, PERFORMED}"
        side_effects:
          - "line.approved_cap_cents stays null; variance_justification / variance_decided_by_user_id recorded"
          - "line.settlement_expense_cents = budgeted_cents — the promoter absorbs the whole overage and it never reaches the artist's deductible base"
          - "show.budget_posture recomputed, show.breakeven_cents recomputed"
          - "market.at_risk_guarantee_cents recomputed and market.risk_posture re-banded"
          - "increments BudgetLine.version, Show.version and Market.version by 1 each"
        note: "Divergent branch: APPROVED recognises up to the cap, REJECTED recognises only the budget. Same from-state, different money."

      - from: APPROVED
        to: PENDING_APPROVAL
        trigger: "POST /vendor-invoices/{vendor_invoice_id}/approve (system cascade hop 2)"
        actor: system
        preconditions:
          - "line.variance_status == APPROVED"
          - "after actual_cents is refreshed, actual_cents > line.approved_cap_cents"
        side_effects:
          - "line.approved_cap_cents = null; line.variance_decided_by_user_id = null; required_approver_role re-derived from the new variance_pct"
          - "line.settlement_expense_cents = budgeted_cents until the new variance is decided"
          - "show.budget_posture -> VARIANCE_PENDING; show.breakeven_cents recomputed; market.at_risk_guarantee_cents recomputed"
        note: "Re-entry cycle: an approved cap does not survive a later invoice that breaches it."

      - from: REJECTED
        to: PENDING_APPROVAL
        trigger: "POST /vendor-invoices/{vendor_invoice_id}/approve (system cascade hop 2)"
        actor: system
        preconditions:
          - "line.variance_status == REJECTED"
          - "after actual_cents is refreshed, actual_cents is strictly greater than the value it held when the rejection was recorded"
        side_effects:
          - "required_approver_role re-derived; variance_decided_by_user_id = null; settlement_expense_cents stays budgeted_cents while pending"
          - "show.budget_posture -> VARIANCE_PENDING"

      - from: PENDING_APPROVAL
        to: WITHIN_TOLERANCE
        trigger: "POST /vendor-invoices/{vendor_invoice_id}/dispute-resolution (outcome = REJECT, system cascade)"
        actor: system
        preconditions:
          - "line.variance_status == PENDING_APPROVAL"
          - "the invoice leaving APPROVED lowers actual_cents so the ROUNDED variance_pct <= VARIANCE_TOLERANCE_PCT"
        side_effects:
          - "line.required_approver_role = NONE; settlement_expense_cents = actual_cents"
          - "show.budget_posture recomputed -> ON_BUDGET when no other line deviates"
        note: "Compensating edge — the pending variance disappears when the invoice that caused it is withdrawn from the ledger."

  # -------------------------------------------------------------- VendorInvoice
  - entity: VendorInvoice
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    note: "Cyclic: DISPUTED -> SUBMITTED lets a vendor re-paper a rejected amount without a new invoice row."
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /vendor-invoices/{vendor_invoice_id}/verify"
        actor: TourAccountant
        preconditions:
          - "invoice.status == SUBMITTED"
          - "show.show_status IN {CONFIRMED, ON_SALE, PERFORMED}"
          - "budget_line.status == ACTIVE"
        side_effects:
          - "invoice.verified_by_user_id = X-User-ID"
          - "increments VendorInvoice.version by 1"

      - from: VERIFIED
        to: APPROVED
        trigger: "POST /vendor-invoices/{vendor_invoice_id}/approve"
        actor: TourAccountant | RiskOfficer
        preconditions:
          - "invoice.status == VERIFIED"
          - "X-User-ID != invoice.verified_by_user_id (segregation of duties)"
          - "budget_line.status == ACTIVE"
          - "show.show_status IN {CONFIRMED, ON_SALE, PERFORMED}"
        side_effects:
          - "invoice.approved_by_user_id = X-User-ID"
          - "CASCADE hop 1: budget_line.actual_cents refreshed to the sum of APPROVED invoice amounts, which recomputes variance_cents and variance_pct"
          - "CASCADE hop 2: the refreshed variance_pct drives the BudgetLine variance_status machine (WITHIN_TOLERANCE / APPROVED / REJECTED -> PENDING_APPROVAL when it breaches VARIANCE_TOLERANCE_PCT) and re-derives settlement_expense_cents"
          - "CASCADE hop 3: the line's new settlement_expense_cents recomputes show.total_actual_expense_cents, show.budget_posture and show.breakeven_cents"
          - "CASCADE hop 4: show.breakeven_cents / projected_promoter_net_cents recompute market.at_risk_guarantee_cents, which re-bands market.risk_posture"
          - "increments VendorInvoice.version, BudgetLine.version, Show.version and Market.version by 1 each"

      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /vendor-invoices/{vendor_invoice_id}/dispute"
        actor: TourAccountant | VenueOperator
        preconditions:
          - "invoice.status IN {SUBMITTED, VERIFIED}"
        side_effects:
          - "invoice.dispute_reason recorded"
          - "increments VendorInvoice.version by 1"

      - from: VERIFIED
        to: DISPUTED
        trigger: "POST /vendor-invoices/{vendor_invoice_id}/dispute"
        actor: TourAccountant | VenueOperator
        preconditions:
          - "invoice.status IN {SUBMITTED, VERIFIED}"
        side_effects:
          - "invoice.dispute_reason recorded; invoice.verified_by_user_id = null (the verification is void)"
          - "increments VendorInvoice.version by 1"

      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /vendor-invoices/{vendor_invoice_id}/dispute-resolution (outcome = RESUBMIT)"
        actor: TourAccountant
        preconditions:
          - "invoice.status == DISPUTED"
          - "amount_cents and documentation_ref are both present"
        side_effects:
          - "invoice.amount_cents and documentation_ref replaced; resubmit_count += 1; dispute_reason = null; verified_by_user_id = null"
          - "increments VendorInvoice.version by 1"
        note: "Cycle edge — the row can travel SUBMITTED -> VERIFIED -> DISPUTED -> SUBMITTED any number of times."

      - from: DISPUTED
        to: REJECTED
        trigger: "POST /vendor-invoices/{vendor_invoice_id}/dispute-resolution (outcome = REJECT)"
        actor: TourAccountant
        preconditions:
          - "invoice.status == DISPUTED"
          - "reason is present"
        side_effects:
          - "budget_line.actual_cents refreshed (a rejected invoice never counts); the BudgetLine variance machine may fall back PENDING_APPROVAL -> WITHIN_TOLERANCE"
          - "show.total_actual_expense_cents / budget_posture recomputed"
          - "increments VendorInvoice.version, BudgetLine.version and Show.version by 1 each"

  # ------------------------------------------------------------------ TicketTier
  - entity: TicketTier
    initial_state: DRAFT
    terminal_states: [CLOSED]
    note: |
      Every edge is a system side effect of a Show trigger: the tier machine is slaved to
      state_machines.Show dimension sales_status, which is itself independent of dimension show_status.
      A tier therefore has no trigger of its own — POST /ticket-tiers/{id}/price-adjustments and
      POST /ticket-tiers/{id}/sales mutate fields without moving status.
    transitions:
      - from: DRAFT
        to: ON_SALE
        trigger: "POST /shows/{show_id}/on-sale (system cascade)"
        actor: system
        preconditions:
          - "tier.show_id == the show being put on sale"
          - "tier.status == DRAFT"
        side_effects:
          - "tier.available_qty = allocation_qty - sold_qty - comp_qty - held_qty (re-derived)"
          - "increments TicketTier.version by 1"

      - from: ON_SALE
        to: PAUSED
        trigger: "POST /shows/{show_id}/pause-sales (system cascade)"
        actor: system
        preconditions:
          - "tier.status == ON_SALE"
        side_effects:
          - "increments TicketTier.version by 1"

      - from: PAUSED
        to: ON_SALE
        trigger: "POST /shows/{show_id}/resume-sales (system cascade)"
        actor: system
        preconditions:
          - "tier.status == PAUSED"
        side_effects:
          - "increments TicketTier.version by 1"
        note: "Cycle edge — a tier may be paused and resumed repeatedly (e.g. between price revisions)."

      - from: ON_SALE
        to: CLOSED
        trigger: "POST /shows/{show_id}/perform | POST /cancellation-events (system cascade)"
        actor: system
        preconditions:
          - "tier.status IN {ON_SALE, PAUSED}"
        side_effects:
          - "tier.available_qty = 0"
          - "increments TicketTier.version by 1"

      - from: PAUSED
        to: CLOSED
        trigger: "POST /shows/{show_id}/perform | POST /cancellation-events (system cascade)"
        actor: system
        preconditions:
          - "tier.status IN {ON_SALE, PAUSED}"
        side_effects:
          - "tier.available_qty = 0"
          - "increments TicketTier.version by 1"

      - from: DRAFT
        to: CLOSED
        trigger: "POST /shows/{show_id}/perform | POST /cancellation-events (system cascade)"
        actor: system
        preconditions:
          - "the show being performed, or named by the cancellation event, owns this tier"
        side_effects:
          - "tier.available_qty = 0"
          - "increments TicketTier.version by 1"
        note: |
          A tier created AFTER the show went on sale never saw the DRAFT -> ON_SALE cascade, so it is
          still DRAFT when the show is performed or cancelled. Both cascades must close it: the Show
          perform side effect is declared over status IN {DRAFT, ON_SALE, PAUSED}, so DRAFT is NOT a
          state that survives the show going terminal.

  # ------------------------------------------------------------------ TicketHold
  - entity: TicketHold
    initial_state: HELD
    terminal_states: [RELEASED, CONVERTED, EXPIRED]
    transitions:
      - from: HELD
        to: RELEASED
        trigger: "POST /ticket-holds/{ticket_hold_id}/release"
        actor: TalentBuyer | ArtistRep | VenueOperator
        preconditions:
          - "hold.status == HELD"
          - "show.sales_status != CLOSED"
          - "an ArtistRep actor may release only holds whose kind == ARTIST_HOLD and whose show.artist_id is the acting artist"
          - "a VenueOperator actor may release only holds whose kind == PRODUCTION_HOLD and whose show.venue_id is the acting venue"
        side_effects:
          - "hold.released_by_user_id = X-User-ID"
          - "tier.held_qty (or comp_qty for a COMP hold) decreases by hold.qty and tier.available_qty increases by hold.qty — inventory is conserved (calculations.tier_inventory_conservation)"
          - "increments TicketHold.version and TicketTier.version by 1 each"

      - from: HELD
        to: CONVERTED
        trigger: "POST /ticket-holds/{ticket_hold_id}/convert-to-comp"
        actor: TalentBuyer
        preconditions:
          - "hold.status == HELD"
          - "hold.kind != COMP"
          - "show.sales_status IN {PRE_SALE, SELLING, PAUSED}"
          - "after conversion the show's total comp count stays within COMP_ALLOWANCE_PCT of total allocation (validations priority 32)"
        side_effects:
          - "hold.kind = COMP"
          - "tier.held_qty decreases by hold.qty and tier.comp_qty increases by hold.qty; tier.available_qty is unchanged"
          - "show.comp_tickets_issued increases by hold.qty and show.held_tickets decreases by hold.qty"
          - "increments TicketHold.version, TicketTier.version and Show.version by 1 each"
        note: "Reclassification edge — the ticket count is conserved while the money class changes from potentially-sellable to never-sellable."

      - from: HELD
        to: EXPIRED
        trigger: "POST /_ops/run"
        actor: system
        preconditions:
          - "hold.status == HELD"
          - "hold.expires_at is not null and hold.expires_at <= the current logical clock"
        side_effects:
          - "tier.held_qty (or comp_qty) decreases by hold.qty; tier.available_qty increases by hold.qty"
          - "show.held_tickets / comp_tickets_issued decrease by hold.qty"
          - "increments TicketHold.version, TicketTier.version and Show.version by 1 each"

  # ------------------------------------------------------------------ Settlement
  - entity: Settlement
    initial_state: DRAFT
    terminal_states: [PAID]
    note: "Cyclic with two re-entry paths into CALCULATED (from DISPUTED and from REOPENED); each recalculation re-reads the ledger and can produce different money."
    transitions:
      - from: DRAFT
        to: CALCULATED
        trigger: "POST /settlements/{settlement_id}/calculate"
        actor: TourAccountant
        preconditions:
          - "settlement.status IN {DRAFT, DISPUTED, REOPENED}"
          - "show.show_status == PERFORMED"
          - "exactly one Offer with show_id == show.id has status == ACCEPTED"
          - "no VendorInvoice on this show is in {SUBMITTED, VERIFIED, DISPUTED} (validations priority 36)"
          - "no BudgetLine on this show has variance_status == PENDING_APPROVAL (validations priority 37)"
        side_effects:
          - "settlement.deal_structure_applied = the accepted offer's deal_structure"
          - "the FINAL variant of calculations.show_settlement_projection runs: gross_receipts_cents, ticket_tax_cents, facility_fee_cents, credit_card_fee_cents and adjusted_gross_cents are written from calculations.adjusted_gross_receipts"
          - "total_settlement_expense_cents / allowed_expense_cents / breakeven_cents written from calculations.artist_settlement_earnings"
          - "artist_base_earnings_cents, artist_coop_contribution_cents, artist_earnings_cents, withholding_cents, deposit_credit_cents and payment_due_cents written"
          - "venue_expense_reimbursement_cents and promoter_borne_expense_cents written from calculations.venue_expense_reimbursement"
          - "venue_share_cents and promoter_net_cents written from calculations.settlement_split"
          - "settlement.calculated_by_user_id = X-User-ID"
          - "increments Settlement.version by 1"

      - from: DISPUTED
        to: CALCULATED
        trigger: "POST /settlements/{settlement_id}/calculate"
        actor: TourAccountant
        preconditions:
          - "settlement.status IN {DRAFT, DISPUTED, REOPENED}"
          - "show.show_status == PERFORMED"
        side_effects:
          - "every money field is recomputed from the current ledger; dispute_reason = null"
          - "settlement.calculated_by_user_id = X-User-ID"
          - "increments Settlement.version by 1"
        note: "Cycle edge #1."

      - from: REOPENED
        to: CALCULATED
        trigger: "POST /settlements/{settlement_id}/calculate"
        actor: TourAccountant
        preconditions:
          - "settlement.status IN {DRAFT, DISPUTED, REOPENED}"
          - "no VendorInvoice on this show is in {SUBMITTED, VERIFIED, DISPUTED}"
        side_effects:
          - "every money field is recomputed from the current ledger"
          - "increments Settlement.version by 1"
        note: "Cycle edge #2 — the loop count is carried in Settlement.reopen_count, which is never reset."

      - from: CALCULATED
        to: ARTIST_SIGNED
        trigger: "POST /settlements/{settlement_id}/artist-response (response = SIGN)"
        actor: ArtistRep
        preconditions:
          - "settlement.status == CALCULATED"
          - "the acting ArtistRep's artist_id == show.artist_id (resource ownership)"
        side_effects:
          - "settlement.signed_by_user_id = X-User-ID"
          - "increments Settlement.version by 1"

      - from: CALCULATED
        to: DISPUTED
        trigger: "POST /settlements/{settlement_id}/artist-response (response = DISPUTE)"
        actor: ArtistRep
        preconditions:
          - "settlement.status == CALCULATED"
          - "the acting ArtistRep's artist_id == show.artist_id"
          - "dispute_reason is present"
        side_effects:
          - "settlement.dispute_reason recorded; signed_by_user_id stays null"
          - "increments Settlement.version by 1"
        note: "Branch fork — SIGN and DISPUTE leave the same state to different targets with different side effects."

      - from: CALCULATED
        to: REOPENED
        trigger: "POST /settlements/{settlement_id}/reopen"
        actor: RiskOfficer
        preconditions:
          - "settlement.status IN {CALCULATED, ARTIST_SIGNED}"
          - "X-User-ID != settlement.calculated_by_user_id (segregation of duties)"
          - "reopen_reason is present"
        side_effects:
          - "settlement.reopen_count += 1; reopen_reason recorded; signed_by_user_id = null"
          - "increments Settlement.version by 1"

      - from: ARTIST_SIGNED
        to: REOPENED
        trigger: "POST /settlements/{settlement_id}/reopen"
        actor: RiskOfficer
        preconditions:
          - "settlement.status IN {CALCULATED, ARTIST_SIGNED}"
          - "X-User-ID != settlement.calculated_by_user_id"
        side_effects:
          - "settlement.reopen_count += 1; signed_by_user_id = null — an artist signature does not survive a reopen"
          - "increments Settlement.version by 1"

      - from: ARTIST_SIGNED
        to: PAID
        trigger: "POST /settlements/{settlement_id}/pay"
        actor: TourAccountant
        preconditions:
          - "settlement.status == ARTIST_SIGNED"
          - "X-User-ID != settlement.signed_by_user_id"
          - "payment_method and payment_reference are present"
          - "when payment_method == CASH, payment_due_cents <= 2000000"
        side_effects:
          - "settlement.paid_at = the current logical clock; payment_method / payment_reference recorded"
          - "CASCADE hop 1: show.show_status -> SETTLED"
          - "CASCADE hop 2: every BudgetLine on the show with status == ACTIVE -> SETTLED"
          - "CASCADE hop 3: market.committed_guarantee_cents decreases by show.committed_guarantee_cents, market.at_risk_guarantee_cents drops the show's contribution, market.settled_show_count += 1, market.exposure_utilization_pct and market.risk_posture are re-derived, and market.performance_index is recomputed (calculations.market_performance_index)"
          - "increments Settlement.version, Show.version, every touched BudgetLine.version and Market.version by 1 each"

  # ----------------------------------------------------------- CancellationEvent
  - entity: CancellationEvent
    initial_state: OPENED
    terminal_states: [CLAIM_SETTLED, CLAIM_DENIED, RESCHEDULED]
    note: "Branching: OPENED forks into the refund/insurance path and the reschedule path, which never rejoin."
    transitions:
      - from: OPENED
        to: REFUNDS_PROCESSED
        trigger: "POST /cancellation-events/{cancellation_event_id}/process-refunds"
        actor: TourAccountant
        preconditions:
          - "event.status == OPENED"
          - "show.show_status IN {CANCELLED, POSTPONED}"
        side_effects:
          - "event.refund_liability_cents = show.refund_liability_cents and event.refunded_ticket_count = show.paid_tickets_sold"
          - "event.unrecovered_cost_cents = the show's total settlement-recognised expense minus any recoverable deposit (calculations.refund_liability_and_recovery)"
          - "show.gross_sold_cents and show.adjusted_gross_cents -> 0; every TicketTier.sold_qty stays as the historical record but tier.status is already CLOSED"
          - "increments CancellationEvent.version and Show.version by 1 each"

      - from: REFUNDS_PROCESSED
        to: CLAIM_FILED
        trigger: "POST /cancellation-events/{cancellation_event_id}/file-claim"
        actor: RiskOfficer
        preconditions:
          - "event.status == REFUNDS_PROCESSED"
          - "the current logical clock is within INSURANCE_CLAIM_WINDOW_DAYS (30) of event.occurred_at (validations priority 39)"
          - "claim_amount_cents > 0 and claim_documentation_ref is present"
        side_effects:
          - "event.claim_amount_cents / claim_documentation_ref / filed_by_user_id recorded"
          - "increments CancellationEvent.version by 1"

      - from: CLAIM_FILED
        to: CLAIM_SETTLED
        trigger: "POST /cancellation-events/{cancellation_event_id}/settle-claim (outcome = SETTLE)"
        actor: RiskOfficer
        preconditions:
          - "event.status == CLAIM_FILED"
          - "X-User-ID != event.filed_by_user_id (segregation of duties)"
          - "insurer_reference is present"
        side_effects:
          - "event.covered_loss_cents = min(claim_amount_cents, unrecovered_cost_cents, INSURANCE_POLICY_CAP_CENTS) and event.insurance_recovery_cents = max(0, covered_loss_cents - INSURANCE_DEDUCTIBLE_CENTS) (calculations.refund_liability_and_recovery)"
          - "market.at_risk_guarantee_cents decreases by event.insurance_recovery_cents (floored at 0) and market.risk_posture is re-banded"
          - "increments CancellationEvent.version and Market.version by 1 each"

      - from: CLAIM_FILED
        to: CLAIM_DENIED
        trigger: "POST /cancellation-events/{cancellation_event_id}/settle-claim (outcome = DENY)"
        actor: RiskOfficer
        preconditions:
          - "event.status == CLAIM_FILED"
          - "X-User-ID != event.filed_by_user_id"
          - "reason is present"
        side_effects:
          - "event.covered_loss_cents = 0 and event.insurance_recovery_cents = 0; the promoter absorbs unrecovered_cost_cents in full"
          - "market.at_risk_guarantee_cents is left untouched — the exposure stays on the book"
          - "increments CancellationEvent.version by 1"

      - from: OPENED
        to: RESCHEDULED
        trigger: "POST /cancellation-events/{cancellation_event_id}/reschedule"
        actor: TalentBuyer
        preconditions:
          - "event.status == OPENED"
          - "event.kind == POSTPONED (a CANCELLED event can never be rescheduled)"
          - "replacement_show_id names a Show whose rescheduled_from_show_id == event.show_id and whose show_status == PLANNED (validations priority 38)"
        side_effects:
          - "event.replacement_show_id recorded"
          - "CASCADE hop 1: the original show.show_status POSTPONED -> RESCHEDULED"
          - "CASCADE hop 2: the replacement show inherits the original's paid_tickets_sold and gross_sold_cents as transferred_in_paid_tickets / transferred_in_gross_cents, and its projected figures are recomputed; the original show's refund_liability_cents -> 0"
          - "CASCADE hop 3: market.committed_guarantee_cents is UNCHANGED by this transition — the show already left the IN_SCOPE set of calculations.market_guarantee_exposure at postponement and the replacement show is still PLANNED, so it books nothing; only market.at_risk_guarantee_cents, market.exposure_utilization_pct and market.risk_posture are re-derived"
          - "increments CancellationEvent.version, both Show.version values and Market.version by 1 each"
        note: "Alternative fork — this path skips refunds entirely, so REFUNDS_PROCESSED and RESCHEDULED are mutually unreachable from each other."

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
# Both rules below survive the §1.2.1 filter: the second sequential request sees
# a Show whose state still permits the operation, so the operation would itself
# succeed on its merits — only the stale observed version rejects it. Everything
# else in this domain that looks like contention (accepting an already-accepted
# offer, paying an already-paid settlement, releasing an already-released hold)
# is a plain state precondition and lives in §1.2 / §1.4 instead.
concurrency_rules:
  - rule_id: offer-create-stale-show
    parent_entity: Show
    write_endpoint: "POST /offers"
    occ_field: "expected_show_version"
    description: |
      Creating an Offer against a Show whose version has advanced since the client
      last read it is rejected. Offer creation legitimately supersedes every other
      open Offer on the same Show (state_machines.Offer DRAFT/SUBMITTED/COUNTERED ->
      SUPERSEDED), so a writer holding a stale view of the Show would silently
      invalidate negotiation rounds it never saw — including a guarantee that has
      already been accepted and booked against the market's exposure. The stale
      version check turns that into a deterministic rejection.
    error_id: ERR_STALE_SHOW_VERSION
    http_status: 412

  - rule_id: price-adjustment-stale-show
    parent_entity: Show
    write_endpoint: "POST /ticket-tiers/{ticket_tier_id}/price-adjustments"
    occ_field: "expected_show_version"
    description: |
      Revising a TicketTier price while holding a stale Show version is rejected.
      A price revision is always a legitimate operation on an ON_SALE or PAUSED
      tier, so no state precondition can catch a writer whose view of the show
      predates another revision, a hold release, or a budget change — yet the
      revision rewrites show.projected_adjusted_gross_cents and therefore the
      market's risk posture. OCC on Show.version forces the writer to re-read the
      show before repricing it.
    error_id: ERR_STALE_SHOW_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules
# =============================================================================
calculations:
  - name: tier_gross_accumulation
    trigger: "POST /ticket-tiers/{ticket_tier_id}/sales — and re-derived on every hold, release, conversion or expiry that moves tier inventory"
    algorithm: chronological
    formula: |
      # Sales are applied in created_at order. The price used is the price the tier
      # carried AT THE INSTANT OF THE SALE; a later revision never revalues history.
      for sale in sales_of(tier) ordered by created_at ascending:
          tier.sold_qty        += sale.qty
          tier.gross_sold_cents += sale.qty * tier.price_cents_at(sale.created_at)

      tier.available_qty = tier.allocation_qty - tier.sold_qty - tier.comp_qty - tier.held_qty

      show.gross_sold_cents   = SUM(tier.gross_sold_cents) over tiers of show
      show.paid_tickets_sold  = SUM(tier.sold_qty)         over tiers of show
      show.comp_tickets_issued = SUM(tier.comp_qty)        over tiers of show
      show.held_tickets       = SUM(tier.held_qty)         over tiers of show
    input_set: "TicketTier rows of the show with status IN {ON_SALE, PAUSED, CLOSED}; DRAFT tiers contribute allocation to the comp allowance but never gross."
    constants: {}
    precision: "integer cents; qty * price is exact, no rounding"
    order_sensitivity: |
      800 tickets at 5000 followed by a revision to 6000 followed by 600 tickets accumulates
      4000000 + 3600000 = 7600000. The same two sales after the revision would accumulate
      1400 * 6000 = 8400000. Re-running the ledger with the current price is therefore WRONG
      by 800000 cents on the canonical fixture — gross_sold_cents must be an accumulator,
      never a recomputation from tier.price_cents.

  - name: adjusted_gross_receipts
    trigger: "recomputed whenever show.gross_sold_cents changes; frozen into Settlement by POST /settlements/{settlement_id}/calculate"
    algorithm: waterfall_allocation
    formula: |
      gross_receipts_cents  = show.gross_sold_cents + show.transferred_in_gross_cents
      paid_tickets          = show.paid_tickets_sold + show.transferred_in_paid_tickets

      # Bucket 1 — statutory ticket tax, taken off the raw gross.
      ticket_tax_cents      = ROUND_HALF_UP(gross_receipts_cents * venue.ticket_tax_pct / 100)

      # Bucket 2 — per-ticket facility fee, a flat unit charge (no rounding).
      facility_fee_cents    = venue.facility_fee_cents_per_ticket * paid_tickets

      # Bucket 3 — card fees, charged on the POST-TAX but PRE-FACILITY base.
      credit_card_fee_cents = ROUND_HALF_UP((gross_receipts_cents - ticket_tax_cents)
                                            * CREDIT_CARD_FEE_PCT / 100)

      adjusted_gross_cents  = gross_receipts_cents - ticket_tax_cents
                                                  - facility_fee_cents
                                                  - credit_card_fee_cents
    input_set: "The show's own accumulated gross plus any gross transferred in from a show it replaced (rescheduled_from_show_id chain)."
    constants:
      CREDIT_CARD_FEE_PCT: 2.5
    precision: "integer cents, ROUND_HALF_UP per bucket; buckets are rounded independently and never re-derived from the net"
    order_sensitivity: |
      The card-fee base deliberately excludes the ticket tax and deliberately INCLUDES the
      facility fee. Charging cards on the raw gross gives 285000 instead of 262200 on the
      canonical fixture; charging them on the fully-netted amount gives 246450. Only the
      declared order reproduces 9595800.

  - name: budget_line_variance_recognition
    trigger: "POST /vendor-invoices/{vendor_invoice_id}/approve, POST /vendor-invoices/{vendor_invoice_id}/dispute-resolution, POST /budget-lines/{budget_line_id}/variance-decision"
    algorithm: threshold
    formula: |
      line.actual_cents   = SUM(invoice.amount_cents) over VendorInvoice rows where
                              invoice.budget_line_id == line.id AND invoice.status == APPROVED
      line.variance_cents = line.actual_cents - line.budgeted_cents
      line.variance_pct   = ROUND_HALF_UP_2DP(line.variance_cents * 100 / line.budgeted_cents)

      # The banding reads the ROUNDED percentage, not the raw ratio.
      if line.variance_pct <= VARIANCE_TOLERANCE_PCT:
          line.variance_status        = WITHIN_TOLERANCE
          line.required_approver_role = NONE
          line.settlement_expense_cents = line.actual_cents
      else:
          line.variance_status        = PENDING_APPROVAL
          line.required_approver_role = TOUR_ACCOUNTANT
                                          if line.variance_pct <= VARIANCE_ESCALATION_PCT
                                          else RISK_OFFICER
          line.settlement_expense_cents = line.budgeted_cents   # unresolved -> budget only

      # After a variance-decision:
      #   APPROVE -> line.settlement_expense_cents = MIN(line.actual_cents, line.approved_cap_cents)
      #   REJECT  -> line.settlement_expense_cents = line.budgeted_cents
      show.total_actual_expense_cents   = SUM(line.actual_cents)   over ACTIVE|SETTLED lines
      show.total_budgeted_expense_cents = SUM(line.budgeted_cents) over ACTIVE|SETTLED lines
      # The RECOGNISED total (what the artist and the venue actually see) is
      # frozen onto the Settlement instead:
      settlement.total_settlement_expense_cents =
          SUM(line.settlement_expense_cents) over ACTIVE|SETTLED lines
    input_set: "Only APPROVED VendorInvoice rows feed actual_cents; SUBMITTED, VERIFIED, DISPUTED and REJECTED invoices are excluded, so approving and then rejecting an invoice returns the line to its prior recognition."
    constants:
      VARIANCE_TOLERANCE_PCT: 10.00
      VARIANCE_ESCALATION_PCT: 25.00
    precision: "variance_pct to 2 decimal places, ROUND_HALF_UP; the comparison uses the rounded value"
    boundary_notes: |
      budgeted 1500000, actual 1650000 -> variance_pct exactly 10.00 -> WITHIN_TOLERANCE (<=, not <).
      budgeted 1500000, actual 1650074 -> raw 10.004933..% -> ROUNDS to 10.00 -> still WITHIN_TOLERANCE.
      budgeted 1500000, actual 1651000 -> 10.07 -> PENDING_APPROVAL, TOUR_ACCOUNTANT.
      budgeted  200000, actual  260000 -> 30.00 -> PENDING_APPROVAL, RISK_OFFICER (> 25.00).
      A line whose variance_pct is exactly 25.00 stays with TOUR_ACCOUNTANT.

  - name: show_comp_allowance
    trigger: "POST /ticket-holds (kind = COMP) and POST /ticket-holds/{ticket_hold_id}/convert-to-comp"
    algorithm: threshold
    formula: |
      total_allocation   = SUM(tier.allocation_qty) over every TicketTier of the show
      comp_allowance_qty = ROUND_HALF_UP(total_allocation * COMP_ALLOWANCE_PCT / 100)
      comps_after        = show.comp_tickets_issued + requested_qty
      allowed            = comps_after <= comp_allowance_qty
    input_set: "All TicketTier rows of the show regardless of status, including DRAFT tiers."
    constants:
      COMP_ALLOWANCE_PCT: 3.00
    precision: "whole tickets, ROUND_HALF_UP"
    boundary_notes: "allocation 1000 -> 30 comps allowed; the 31st is rejected. allocation 2000 -> 60. Converted ARTIST_HOLD tickets count as comps from the moment of conversion."

  - name: venue_expense_reimbursement
    trigger: "POST /settlements/{settlement_id}/calculate"
    algorithm: aggregation
    formula: |
      # MODE: per-line percentage, ROUNDED PER LINE, then summed. NOT
      # ROUND(total_expense * blended_pct) and NOT a single rounding at the end.
      if show.venue_arrangement == RENTAL:
          venue_expense_reimbursement_cents = 0
      else:  # CO_PROMOTE
          venue_expense_reimbursement_cents = SUM over lines of
              ROUND_HALF_UP(line.settlement_expense_cents
                            * show.venue_expense_pct_<line.category> / 100)

      promoter_borne_expense_cents = total_settlement_expense_cents
                                       - venue_expense_reimbursement_cents
    input_set: "BudgetLine rows of the show with status IN {ACTIVE, SETTLED}; VOID lines are excluded entirely."
    constants: {}
    precision: "integer cents, ROUND_HALF_UP applied ONCE PER LINE before summation"
    divergence_notes: |
      Three lines of 250005 cents at 33.5% reimburse 251256 per-line but 251255 if the
      category total is rounded once — the per-line mode is normative and the 1-cent
      difference is observable. On the canonical co-promote fixture the four lines
      reimburse 825000 + 225000 + 600000 + 0 = 1650000, leaving 1750000 promoter-borne.

  - name: artist_settlement_earnings
    trigger: "POST /settlements/{settlement_id}/calculate (FINAL) and GET /shows/{show_id}/settlement-projection (PROVISIONAL)"
    algorithm: constraint_propagation
    formula: |
      # ---- deductible base -------------------------------------------------
      raw_allowed   = SUM(line.settlement_expense_cents) over lines where
                        line.is_artist_deductible == true
      allowed_expense_cents = MIN(raw_allowed, offer.expense_cap_cents)
                              if offer.expense_cap_cents is not null else raw_allowed

      # ---- deal-structure fork --------------------------------------------
      if offer.deal_structure == FLAT_GUARANTEE:
          breakeven_cents = offer.guarantee_cents + allowed_expense_cents
          base_cents      = offer.guarantee_cents

      elif offer.deal_structure == VERSUS:
          net_after_expense = adjusted_gross_cents - allowed_expense_cents
          breakeven_cents   = offer.guarantee_cents + allowed_expense_cents
          base_cents        = MAX(offer.guarantee_cents,
                                  ROUND_HALF_UP(offer.versus_pct * net_after_expense / 100))

      else:  # GUARANTEE_PLUS_BACKEND
          breakeven_cents = offer.guarantee_cents + allowed_expense_cents
          overage_cents   = MAX(0, adjusted_gross_cents - breakeven_cents)
          base_cents      = offer.guarantee_cents
                            + ROUND_HALF_UP(offer.backend_split_artist_pct * overage_cents / 100)

      # ---- co-op marketing contribution: the cap is keyed on the base the
      #      base itself has just produced, so the two legs must be evaluated
      #      in this order and the cap leg re-rounded independently ----------
      marketing_recognised = SUM(line.settlement_expense_cents) over lines where
                               line.category == MARKETING
      coop_share_leg = ROUND_HALF_UP(COOP_ARTIST_SHARE_PCT * marketing_recognised / 100)
      coop_cap_leg   = ROUND_HALF_UP(COOP_CAP_PCT_OF_BASE  * base_cents / 100)
      artist_coop_contribution_cents = MIN(coop_share_leg, coop_cap_leg)

      artist_base_earnings_cents = base_cents
      artist_earnings_cents      = base_cents - artist_coop_contribution_cents
      withholding_cents          = ROUND_HALF_UP(artist.withholding_pct
                                                 * artist_earnings_cents / 100)
      deposit_credit_cents       = offer.deposit_cents
      payment_due_cents          = artist_earnings_cents - withholding_cents
                                                         - deposit_credit_cents
    input_set: "The single Offer on the show with status == ACCEPTED supplies every deal term; BudgetLine rows with status IN {ACTIVE, SETTLED} supply recognition; VOID lines are excluded."
    constants:
      COOP_ARTIST_SHARE_PCT: 50
      COOP_CAP_PCT_OF_BASE: 5
    precision: "integer cents, ROUND_HALF_UP; each of the two co-op legs is rounded before MIN, never after"
    divergence_notes: |
      Canonical GUARANTEE_PLUS_BACKEND fixture: adjusted_gross 9595800, allowed 2800000,
      breakeven 7800000, overage 1795800, base 6526430; coop legs are 450000 and
      ROUND_HALF_UP(326321.5) = 326322, so coop = 326322 and artist_earnings = 6200108.
      Truncating the cap leg to 326321 (or applying the 5% cap to artist_earnings instead of
      base_cents) both produce a different settlement.
      The SAME data under VERSUS yields net_after_expense 6795800, base 5776430, coop 288822
      and artist_earnings 5487608 — 712500 cents apart from the backend structure.
    variants:
      - name: FLAT_GUARANTEE
        when: "offer.deal_structure == FLAT_GUARANTEE"
        difference: "base_cents ignores adjusted_gross entirely — the artist is indifferent to ticket sales and the promoter absorbs the whole downside."
      - name: VERSUS
        when: "offer.deal_structure == VERSUS"
        difference: "base_cents = MAX(guarantee, versus_pct of net-after-expense); the percentage applies to the WHOLE net, not just the amount above breakeven."
      - name: GUARANTEE_PLUS_BACKEND
        when: "offer.deal_structure == GUARANTEE_PLUS_BACKEND"
        difference: "base_cents = guarantee + backend split of the overage ABOVE breakeven only; below breakeven it collapses to the guarantee."

  - name: settlement_split
    trigger: "POST /settlements/{settlement_id}/calculate"
    algorithm: waterfall_allocation
    formula: |
      if show.venue_arrangement == RENTAL:
          promoter_borne_expense_cents = total_settlement_expense_cents
          venue_share_cents            = show.rental_fee_cents        # flat, paid regardless
          promoter_net_cents           = adjusted_gross_cents
                                           - artist_earnings_cents
                                           - promoter_borne_expense_cents
                                           - venue_share_cents
      else:  # CO_PROMOTE
          promoter_borne_expense_cents = total_settlement_expense_cents
                                           - venue_expense_reimbursement_cents
          net_before_venue = adjusted_gross_cents
                               - artist_earnings_cents
                               - promoter_borne_expense_cents
          venue_share_cents  = ROUND_HALF_UP(show.copromote_venue_share_pct
                                             * MAX(0, net_before_venue) / 100)
          promoter_net_cents = net_before_venue - venue_share_cents

      # Closing invariant, asserted on every CALCULATED settlement:
      adjusted_gross_cents == artist_earnings_cents
                            + promoter_borne_expense_cents
                            + venue_share_cents
                            + promoter_net_cents
    input_set: "The settlement's own frozen money fields; nothing is re-read from tiers or invoices at split time."
    constants: {}
    precision: "integer cents; venue_share is the only rounded term, and promoter_net absorbs the rounding remainder so the invariant closes exactly"
    boundary_notes: |
      Co-promote fixture: 9595800 - 6200108 - 1750000 = 1645692 before the venue split;
      15% of that is 246853.8 -> 246854, leaving promoter_net 1398838 and a residual of 0.
      Rental fixture: 1635000 - 2000000 - 500000 - 500000 = -1365000 — promoter_net is
      SIGNED and a loss must be reported, not floored at zero. A co-promote loss instead
      gives the venue a share of zero (MAX(0, ...)) and leaves the whole loss with the promoter.

  - name: show_settlement_projection
    trigger: "GET /shows/{show_id}/settlement-projection (PROVISIONAL) and POST /settlements/{settlement_id}/calculate (FINAL)"
    algorithm: forward_looking
    formula: |
      # ---------------- variant PROVISIONAL -------------------------------
      # Values the ENTIRE sellable allocation at the CURRENT tier price and
      # deducts BUDGETED expenses. Sales history is ignored on purpose.
      projected_gross = SUM over tiers of
          (tier.allocation_qty - tier.comp_qty - tier.held_qty) * tier.price_cents
      projected_adjusted_gross_cents = adjusted_gross_receipts(projected_gross,
          projected_tickets = SUM(tier.allocation_qty - tier.comp_qty - tier.held_qty))
      projected allowed_expense = SUM(line.budgeted_cents) over is_artist_deductible lines
      projected artist_earnings = artist_settlement_earnings(...) with the projected
          adjusted gross and the BUDGETED deductible base
      projected reimbursement   = venue_expense_reimbursement over line.budgeted_cents

      # ---------------- variant FINAL -------------------------------------
      # Values only tickets ACTUALLY SOLD, at the price each sale carried, and
      # deducts RECOGNISED expenses (settlement_expense_cents).
      final_gross            = show.gross_sold_cents + show.transferred_in_gross_cents
      final allowed_expense  = SUM(line.settlement_expense_cents) over deductible lines
      final artist_earnings  = artist_settlement_earnings(...) with the actual adjusted gross

      # ---------------- risk projection written onto the Show --------------
      # Deliberately a GROSS promoter margin, before any venue split, so the
      # market's exposure view is independent of the deal's venue arrangement.
      show.projected_promoter_net_cents = show.projected_adjusted_gross_cents
                                            - show.committed_guarantee_cents
                                            - show.total_budgeted_expense_cents
    input_set: "PROVISIONAL reads TicketTier.allocation_qty/comp_qty/held_qty/price_cents and BudgetLine.budgeted_cents. FINAL reads TicketTier.gross_sold_cents/sold_qty and BudgetLine.settlement_expense_cents."
    constants: {}
    precision: "integer cents, ROUND_HALF_UP; each variant runs the full receipt waterfall independently"
    divergence_notes: |
      Canonical big show, IDENTICAL data, the two variants disagree everywhere:
        PROVISIONAL projected_gross 15915000 (1940 GA at the revised 6000 + 450 PIT at 9500)
                    -> tax 1273200, facility 836500, card 366045, adjusted 13439255
                    -> allowed 2500000, breakeven 7500000, overage 5939255,
                       base 10048367, coop 400000, artist_earnings 9648367
        FINAL       gross 11400000 (800 GA at 5000 + 600 GA at 6000 + 400 PIT at 9500)
                    -> tax 912000, facility 630000, card 262200, adjusted 9595800
                    -> allowed 2800000, breakeven 7800000, overage 1795800,
                       base 6526430, coop 326322, artist_earnings 6200108
      The provisional co-op lands on its SHARE leg (400000 = 50% of the 800000 budget) while
      the final co-op lands on its CAP leg (326322 = 5% of 6526430) — the binding constraint
      itself switches between variants.
      show.projected_promoter_net_cents on the same show is 13439255 - 5000000 - 3100000 = 5339255.
    variants:
      - name: PROVISIONAL
        when: "GET /shows/{show_id}/settlement-projection, at any show_status; no Settlement row is required or created"
        difference: "Full sellable inventory at the current price; budgeted expenses; unapproved variances ignored; nothing is persisted."
      - name: FINAL
        when: "POST /settlements/{settlement_id}/calculate, only once show.show_status == PERFORMED"
        difference: "Only tickets actually sold, at their as-sold prices; recognised expenses only (capped for APPROVED variances, clamped to budget for REJECTED ones); every figure is frozen onto the Settlement row."

  - name: market_guarantee_exposure
    trigger: "POST /offers/{offer_id}/accept, POST /cancellation-events, POST /settlements/{settlement_id}/pay, POST /cancellation-events/{cancellation_event_id}/settle-claim, and any mutation that changes a member show's adjusted or projected gross"
    algorithm: aggregation
    formula: |
      IN_SCOPE = shows of the market with show_status IN {CONFIRMED, ON_SALE, PERFORMED}
      # POSTPONED is NOT in scope here. It IS in the artist-routing set of validations
      # priority 24, so the two sets differ by exactly one state and an implementation
      # that shares a single predicate between them cannot satisfy both rules.

      market.committed_guarantee_cents = SUM(show.committed_guarantee_cents) over IN_SCOPE
      market.at_risk_guarantee_cents   = SUM over IN_SCOPE of
          MAX(0, show.breakeven_cents - show.adjusted_gross_cents)
          minus SUM(event.insurance_recovery_cents) over CLAIM_SETTLED cancellation events
          of this market's shows, floored at 0

      market.exposure_utilization_pct = ROUND_HALF_UP_2DP(
          market.committed_guarantee_cents * 100 / market.guarantee_exposure_limit_cents)

      market.risk_posture =
          OPEN       if exposure_utilization_pct <= 70
          WATCH      if exposure_utilization_pct <= 90
          RESTRICTED if exposure_utilization_pct <  100
          FROZEN     otherwise            # >= 100
    input_set: "PLANNED shows contribute nothing (no guarantee is committed until an Offer is ACCEPTED); SETTLED, CANCELLED, POSTPONED and RESCHEDULED shows are all released from the book."
    constants:
      POSTURE_OPEN_MAX_PCT: 70
      POSTURE_WATCH_MAX_PCT: 90
      POSTURE_RESTRICTED_MAX_PCT: 100
    precision: "exposure_utilization_pct to 2 decimal places, ROUND_HALF_UP; the banding reads the rounded value"
    boundary_notes: |
      A market with guarantee_exposure_limit_cents 10000000 and one accepted 5000000 guarantee
      sits at exactly 50.00 -> OPEN. Adding a second 2000000 guarantee lands 70.00 -> still OPEN
      (<=, not <). Committing exactly to the limit lands 100.00 -> FROZEN, and the acceptance
      itself still succeeds (validations priority 41 uses <=), which is what makes the next
      acceptance fail on posture rather than on exposure.
    conservation_notes: |
      committed_guarantee_cents is a strictly conserved quantity: accepting an offer adds
      exactly offer.guarantee_cents and the compensating operations (creating a cancellation
      event of EITHER kind, or paying the settlement) subtract exactly the same amount, so a
      confirm/cancel round trip returns committed_guarantee_cents, exposure_utilization_pct
      and risk_posture to their pre-acceptance values with no drift.

  - name: market_performance_index
    trigger: "recomputed on POST /settlements/{settlement_id}/pay (TRAILING_SETTLED, persisted to Market.performance_index); both variants served by GET /markets/{market_id}/portfolio-risk"
    algorithm: weighted_scoring
    formula: |
      # A realisation ratio: how much of the projected promoter margin the market
      # has actually delivered, expressed as a whole percent.
      # ---------------- variant TRAILING_SETTLED ---------------------------
      SETTLED_SHOWS = shows of the market with show_status == SETTLED
      numerator   = SUM(settlement.promoter_net_cents)        over SETTLED_SHOWS
      denominator = SUM(show.projected_promoter_net_cents)    over SETTLED_SHOWS

      # ---------------- variant MARK_TO_MARKET -----------------------------
      LIVE_SHOWS = shows with show_status IN {ON_SALE, PERFORMED} and no PAID settlement
      numerator   = SUM(settlement.promoter_net_cents) over SETTLED_SHOWS
                  + SUM over LIVE_SHOWS of ROUND_HALF_UP(
                        show.projected_promoter_net_cents
                        * show.paid_tickets_sold
                        / SUM(tier.allocation_qty) over the show's tiers)
      denominator = SUM(show.projected_promoter_net_cents) over SETTLED_SHOWS + LIVE_SHOWS

      # ---------------- shared tail ----------------------------------------
      performance_index = 0 if denominator <= 0
                          else ROUND_HALF_UP(numerator * 100 / denominator)   # whole percent
    input_set: "TRAILING_SETTLED sees only shows that reached SETTLED. MARK_TO_MARKET additionally marks every ON_SALE or PERFORMED show at its realised sellthrough. CANCELLED, RESCHEDULED, PLANNED and CONFIRMED shows appear in neither."
    constants: {}
    precision: "whole percent, ROUND_HALF_UP; the per-show mark is rounded before summation"
    divergence_notes: |
      Canonical market, IDENTICAL data: the settled big show delivered promoter_net 1398838
      against a projection of 5339255, and the live small show projects 1587500 with 400 of
      1000 tickets sold, marking to 635000.
        TRAILING_SETTLED = ROUND(100 * 1398838 / 5339255)             = 26  (26.199..%)
        MARK_TO_MARKET   = ROUND(100 * 2033838 / 6926755)             = 29  (29.362..%)
      The live show is more optimistic than the settled one, so adding it RAISES the index —
      a variant that averaged the two per-show ratios instead would give 46, and a variant
      that marked the live show at its ticket-count ratio of the DENOMINATOR too would give 26.
    variants:
      - name: TRAILING_SETTLED
        when: "GET /markets/{market_id}/portfolio-risk?valuation=TRAILING_SETTLED (default), and always for the persisted Market.performance_index"
        difference: "Backward-looking: only closed books count, so a market with no SETTLED show reports 0."
      - name: MARK_TO_MARKET
        when: "GET /markets/{market_id}/portfolio-risk?valuation=MARK_TO_MARKET"
        difference: "Forward-looking: live shows are marked at projected margin scaled by realised sellthrough, so the index moves on every ticket sold."

  - name: refund_liability_and_recovery
    trigger: "POST /cancellation-events, POST /cancellation-events/{cancellation_event_id}/process-refunds, POST /cancellation-events/{cancellation_event_id}/settle-claim"
    algorithm: threshold
    formula: |
      # At cancellation: every paid ticket is refunded at FACE VALUE — the tax,
      # facility and card deductions are the promoter's sunk loss, not the buyer's.
      show.refund_liability_cents = show.gross_sold_cents + show.transferred_in_gross_cents
      event.refunded_ticket_count = show.paid_tickets_sold + show.transferred_in_paid_tickets

      # At process-refunds: what the promoter cannot claw back.
      event.unrecovered_cost_cents = SUM(line.settlement_expense_cents) over the show's
                                       BudgetLine rows with status IN {ACTIVE, VOID}
                                     + accepted_offer.deposit_cents

      # At settle-claim (outcome = SETTLE):
      event.covered_loss_cents = MIN(event.claim_amount_cents,
                                     event.unrecovered_cost_cents,
                                     INSURANCE_POLICY_CAP_CENTS)
      event.insurance_recovery_cents = MAX(0, MIN(event.covered_loss_cents
                                                   - INSURANCE_DEDUCTIBLE_CENTS,
                                                 INSURANCE_POLICY_CAP_CENTS))
      # At settle-claim (outcome = DENY): both fields are 0.
    input_set: "BudgetLine rows already VOIDed by the cancellation still count toward unrecovered cost — the money was spent before the show died. REJECTED vendor invoices never reach settlement_expense_cents and so are never recoverable."
    constants:
      INSURANCE_DEDUCTIBLE_CENTS: 500000
      INSURANCE_POLICY_CAP_CENTS: 25000000
      INSURANCE_CLAIM_WINDOW_DAYS: 30
    precision: "integer cents; no rounding — every term is a sum or a MIN/MAX of integers"
    boundary_notes: |
      Small show: unrecovered 500000 (expenses) + 500000 (deposit) = 1000000. A claim of
      1000000 covers 1000000 and recovers 500000. A claim of exactly 500000 covers 500000 and
      recovers 0 — the deductible boundary yields zero, not a negative recovery.
      Big show: unrecovered 3400000 + 1000000 = 4400000; a claim of 4400000 recovers 3900000,
      while refund_liability_cents is the full 11400000 face value and is NOT insurable.

  - name: tier_inventory_conservation
    trigger: "POST /ticket-tiers, POST /ticket-holds, POST /ticket-holds/{ticket_hold_id}/release, POST /ticket-holds/{ticket_hold_id}/convert-to-comp, POST /_ops/run, POST /ticket-tiers/{ticket_tier_id}/sales"
    algorithm: aggregation
    formula: |
      # Invariant that MUST hold after every one of the triggers above, in every
      # tier status including DRAFT and CLOSED:
      tier.allocation_qty == tier.sold_qty + tier.comp_qty + tier.held_qty + tier.available_qty

      tier.comp_qty = SUM(hold.qty) over the tier's TicketHold rows where
                        (hold.kind == COMP AND hold.status == HELD) OR hold.status == CONVERTED
      tier.held_qty = SUM(hold.qty) over the tier's TicketHold rows where
                        hold.kind != COMP AND hold.status == HELD

      # Compensating movements, each exactly reversing its counterpart:
      #   create hold      : held_qty += q, available_qty -= q
      #   release hold     : held_qty -= q, available_qty += q      (exact inverse)
      #   expire hold      : held_qty -= q, available_qty += q      (exact inverse)
      #   convert to comp  : held_qty -= q, comp_qty += q, available_qty UNCHANGED
      #   record sale      : sold_qty += q, available_qty -= q
      show.held_tickets       = SUM(tier.held_qty) over the show's tiers
      show.comp_tickets_issued = SUM(tier.comp_qty) over the show's tiers
    input_set: "Every TicketHold row of the tier; RELEASED and EXPIRED holds contribute nothing, CONVERTED holds contribute to comp_qty forever."
    constants: {}
    precision: "whole tickets; no rounding"
    conservation_notes: |
      A hold-then-release round trip on a tier of allocation 1000 with 400 sold returns
      held_qty to its prior value and available_qty to 600 with no drift, and the invariant
      closes at every intermediate step. convert-to-comp is the one movement that changes the
      CLASS of a ticket without changing available_qty, so the invariant is the only way to
      detect an implementation that double-counts a converted hold in both comp_qty and held_qty.

# =============================================================================
# 1.4 Validation Rules (evaluated in ascending priority; the FIRST violated
#     rule determines the response, and no later rule's side effects run)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the five declared roles AND that role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "Request body is well formed: every required field present, every enum value a declared member, every *_cents integer >= 0, every *_pct a number in [0, 100], every *_at a valid ISO-8601 UTC timestamp, every qty an integer >= 1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 4
    category: existence
    check: "market_id in the path or body resolves to a Market"
    error_id: ERR_MARKET_NOT_FOUND
    http_status: 404
    applies_to: "GET /markets/{market_id}, GET /markets/{market_id}/portfolio-risk, POST /venues, POST /shows, GET /venues, GET /shows"

  - priority: 5
    category: existence
    check: "artist_id in the path or body resolves to an Artist"
    error_id: ERR_ARTIST_NOT_FOUND
    http_status: 404
    applies_to: "GET /artists/{artist_id}, POST /shows, GET /shows"

  - priority: 6
    category: existence
    check: "venue_id in the path or body resolves to a Venue"
    error_id: ERR_VENUE_NOT_FOUND
    http_status: 404
    applies_to: "GET /venues/{venue_id}, POST /shows, GET /shows"

  - priority: 7
    category: existence
    check: "show_id in the path or body resolves to a Show (and rescheduled_from_show_id / replacement_show_id likewise when supplied)"
    error_id: ERR_SHOW_NOT_FOUND
    http_status: 404
    applies_to: "all show-scoped endpoints, POST /offers, POST /budget-lines, POST /ticket-tiers, POST /settlements, POST /cancellation-events, GET /offers, GET /budget-lines, GET /ticket-tiers, GET /settlements, GET /cancellation-events"

  - priority: 8
    category: existence
    check: "offer_id in the path resolves to an Offer"
    error_id: ERR_OFFER_NOT_FOUND
    http_status: 404
    applies_to: "GET /offers/{offer_id}, POST /offers/{offer_id}/submit, POST /offers/{offer_id}/counter, POST /offers/{offer_id}/accept, POST /offers/{offer_id}/withdraw"

  - priority: 9
    category: existence
    check: "budget_line_id in the path or body resolves to a BudgetLine"
    error_id: ERR_BUDGET_LINE_NOT_FOUND
    http_status: 404
    applies_to: "GET /budget-lines/{budget_line_id}, POST /budget-lines/{budget_line_id}/variance-decision, POST /vendor-invoices, GET /vendor-invoices"

  - priority: 10
    category: existence
    check: "vendor_invoice_id in the path resolves to a VendorInvoice"
    error_id: ERR_VENDOR_INVOICE_NOT_FOUND
    http_status: 404
    applies_to: "GET /vendor-invoices/{vendor_invoice_id}, POST /vendor-invoices/{vendor_invoice_id}/verify, POST /vendor-invoices/{vendor_invoice_id}/approve, POST /vendor-invoices/{vendor_invoice_id}/dispute, POST /vendor-invoices/{vendor_invoice_id}/dispute-resolution"

  - priority: 11
    category: existence
    check: "ticket_tier_id in the path or body resolves to a TicketTier"
    error_id: ERR_TICKET_TIER_NOT_FOUND
    http_status: 404
    applies_to: "GET /ticket-tiers/{ticket_tier_id}, POST /ticket-tiers/{ticket_tier_id}/price-adjustments, POST /ticket-tiers/{ticket_tier_id}/sales, POST /ticket-holds, GET /ticket-holds"

  - priority: 12
    category: existence
    check: "ticket_hold_id in the path resolves to a TicketHold"
    error_id: ERR_TICKET_HOLD_NOT_FOUND
    http_status: 404
    applies_to: "GET /ticket-holds/{ticket_hold_id}, POST /ticket-holds/{ticket_hold_id}/release, POST /ticket-holds/{ticket_hold_id}/convert-to-comp"

  - priority: 13
    category: existence
    check: "settlement_id in the path resolves to a Settlement"
    error_id: ERR_SETTLEMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /settlements/{settlement_id}, POST /settlements/{settlement_id}/calculate, POST /settlements/{settlement_id}/artist-response, POST /settlements/{settlement_id}/pay, POST /settlements/{settlement_id}/reopen"

  - priority: 14
    category: existence
    check: "cancellation_event_id in the path resolves to a CancellationEvent"
    error_id: ERR_CANCELLATION_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /cancellation-events/{cancellation_event_id}, POST /cancellation-events/{cancellation_event_id}/process-refunds, POST /cancellation-events/{cancellation_event_id}/file-claim, POST /cancellation-events/{cancellation_event_id}/settle-claim, POST /cancellation-events/{cancellation_event_id}/reschedule"

  - priority: 15
    category: business_referential
    check: "For an entity-backed role, the acting user's own resource matches the target: an ArtistRep's artist_id equals the target show's artist_id, and a VenueOperator's venue_id equals the target show's venue_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /offers/{offer_id}/accept, POST /offers/{offer_id}/counter, POST /settlements/{settlement_id}/artist-response, POST /ticket-holds, POST /ticket-holds/{ticket_hold_id}/release, POST /vendor-invoices, POST /vendor-invoices/{vendor_invoice_id}/dispute"

  - priority: 16
    category: state
    check: "expected_show_version equals the target Show's current version (concurrency_rules offer-create-stale-show and price-adjustment-stale-show)"
    error_id: ERR_STALE_SHOW_VERSION
    http_status: 412
    applies_to: "POST /offers, POST /ticket-tiers/{ticket_tier_id}/price-adjustments"

  - priority: 17
    category: state
    check: "The target resource is in a NON-TERMINAL state from which this trigger has a declared transition in §1.2 (including sub-resource guards such as show.sales_status and budget_line.status). A target already sitting in one of its own terminal_states is reported by priority 18 instead, so the two state errors never compete for the same call."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 18
    category: state
    check: "The target resource is not already in one of its terminal_states"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 19
    category: business_safety
    check: "Segregation of duties: X-User-ID differs from the user who performed the paired earlier step — invoice approve vs verify, settlement pay vs artist-response signature, settlement reopen vs calculate, claim settle vs file"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /vendor-invoices/{vendor_invoice_id}/approve, POST /settlements/{settlement_id}/pay, POST /settlements/{settlement_id}/reopen, POST /cancellation-events/{cancellation_event_id}/settle-claim"

  - priority: 20
    category: business_referential
    check: "Cross-reference coherence: an invoice's budget_line_id names a BudgetLine whose show_id equals the invoice's show_id"
    error_id: ERR_BUDGET_LINE_SHOW_MISMATCH
    http_status: 422
    applies_to: "POST /vendor-invoices"

  - priority: 21
    category: business_temporal
    check: "Show window coherence: load_in_at < event_at < load_out_at and announce_at <= event_at"
    error_id: ERR_INVALID_SHOW_WINDOW
    http_status: 422
    applies_to: "POST /shows"

  - priority: 22
    category: business_temporal
    check: "event_at is strictly after the current logical clock"
    error_id: ERR_EVENT_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /shows"

  - priority: 23
    category: business_temporal
    check: "Venue occupancy: the half-open interval [load_in_at, load_out_at) of the new show does not overlap that of any other show at the same venue whose show_status is NOT IN {CANCELLED, RESCHEDULED}. Exact adjacency (one show's load_out_at == another's load_in_at) is permitted."
    error_id: ERR_VENUE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /shows"

  - priority: 24
    category: business_temporal
    check: "Artist routing: |event_at - other.event_at| >= ARTIST_REST_BUFFER_HOURS (36) for every other show of the same artist whose show_status IS IN {CONFIRMED, ON_SALE, PERFORMED, POSTPONED}. A gap of exactly ARTIST_REST_BUFFER_HOURS (36) is permitted."
    error_id: ERR_ARTIST_ROUTING_CONFLICT
    http_status: 409
    applies_to: "POST /offers/{offer_id}/accept"

  - priority: 25
    category: business_constraint
    check: "Deal terms are coherent with deal_structure: FLAT_GUARANTEE forbids versus_pct and backend_split_artist_pct; VERSUS requires versus_pct and forbids backend_split_artist_pct; GUARANTEE_PLUS_BACKEND requires backend_split_artist_pct and forbids versus_pct. deposit_cents <= guarantee_cents in every structure, and expense_cap_cents (when present) is > 0."
    error_id: ERR_DEAL_TERMS_INCOHERENT
    http_status: 422
    applies_to: "POST /offers, POST /offers/{offer_id}/counter"

  - priority: 26
    category: business_constraint
    check: "offer.round_index < NEGOTIATION_ROUND_LIMIT (3) before a counter is recorded"
    error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /offers/{offer_id}/counter"

  - priority: 27
    category: business_temporal
    check: "The current logical clock is strictly before offer.expires_at"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /offers/{offer_id}/accept, POST /offers/{offer_id}/counter"

  - priority: 28
    category: business_temporal
    check: "The current logical clock is >= show.announce_at"
    error_id: ERR_ANNOUNCE_DATE_NOT_REACHED
    http_status: 422
    applies_to: "POST /shows/{show_id}/on-sale"

  - priority: 29
    category: business_temporal
    check: "The current logical clock is >= show.event_at"
    error_id: ERR_SHOW_NOT_YET_OCCURRED
    http_status: 422
    applies_to: "POST /shows/{show_id}/perform"

  - priority: 30
    category: business_constraint
    check: "The show has at least one TicketTier before it can go on sale, and at least one BudgetLine before a Settlement can be calculated (there is deliberately NO companion 'has an ACCEPTED offer' rule: CONFIRMED is reachable only through POST /offers/{offer_id}/accept, so that condition can never be observed and priority 17 would own the call anyway)"
    error_id: ERR_NO_TICKET_TIERS
    http_status: 422
    applies_to: "POST /shows/{show_id}/on-sale, POST /settlements/{settlement_id}/calculate"

  - priority: 32
    category: business_constraint
    check: "calculations.show_comp_allowance: comp_tickets_issued + requested_qty <= ROUND_HALF_UP(total_allocation * COMP_ALLOWANCE_PCT / 100)"
    error_id: ERR_COMP_ALLOWANCE_EXCEEDED
    http_status: 422
    applies_to: "POST /ticket-holds, POST /ticket-holds/{ticket_hold_id}/convert-to-comp"

  - priority: 33
    category: business_constraint
    check: "Requested qty <= tier.available_qty for a hold or a sale, so calculations.tier_inventory_conservation never goes negative"
    error_id: ERR_INSUFFICIENT_TIER_INVENTORY
    http_status: 422
    applies_to: "POST /ticket-holds, POST /ticket-tiers/{ticket_tier_id}/sales"

  - priority: 34
    category: business_safety
    check: "The acting role satisfies budget_line.required_approver_role — a RISK_OFFICER line cannot be decided by a TourAccountant (a RiskOfficer may decide either)"
    error_id: ERR_VARIANCE_APPROVAL_AUTHORITY
    http_status: 403
    applies_to: "POST /budget-lines/{budget_line_id}/variance-decision"

  - priority: 35
    category: business_constraint
    check: "On decision == APPROVE, approved_cap_cents is present and >= budget_line.budgeted_cents; on decision == REJECT, approved_cap_cents is absent"
    error_id: ERR_VARIANCE_CAP_INVALID
    http_status: 422
    applies_to: "POST /budget-lines/{budget_line_id}/variance-decision"

  - priority: 36
    category: business_referential
    check: "No VendorInvoice of the show is still in {SUBMITTED, VERIFIED, DISPUTED} — every invoice must be APPROVED or REJECTED before the books close"
    error_id: ERR_UNRESOLVED_INVOICES
    http_status: 409
    applies_to: "POST /settlements/{settlement_id}/calculate"

  - priority: 37
    category: business_referential
    check: "No BudgetLine of the show has variance_status == PENDING_APPROVAL"
    error_id: ERR_UNRESOLVED_VARIANCE
    http_status: 409
    applies_to: "POST /settlements/{settlement_id}/calculate"

  - priority: 38
    category: business_referential
    check: "replacement_show_id names a Show whose rescheduled_from_show_id == the event's show_id, whose show_status == PLANNED, and whose id differs from the original show"
    error_id: ERR_REPLACEMENT_SHOW_INVALID
    http_status: 422
    applies_to: "POST /cancellation-events/{cancellation_event_id}/reschedule"

  - priority: 39
    category: business_temporal
    check: "The current logical clock is within INSURANCE_CLAIM_WINDOW_DAYS (30) of cancellation_event.occurred_at (inclusive of the final instant)"
    error_id: ERR_CLAIM_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /cancellation-events/{cancellation_event_id}/file-claim"

  - priority: 40
    category: business_fiscal
    check: "market.risk_posture != FROZEN — a frozen market accepts no new guarantee commitment"
    error_id: ERR_MARKET_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /offers/{offer_id}/accept"

  - priority: 41
    category: business_fiscal
    check: "market.committed_guarantee_cents + offer.guarantee_cents <= market.guarantee_exposure_limit_cents, unless show.exposure_override_limit_cents is set and the sum is <= that override. Equality with the limit passes."
    error_id: ERR_MARKET_EXPOSURE_EXCEEDED
    http_status: 402
    applies_to: "POST /offers/{offer_id}/accept"

  - priority: 42
    category: business_fiscal
    check: "payment_method == CASH requires settlement.payment_due_cents <= CASH_PAYMENT_LIMIT_CENTS (1000000)"
    error_id: ERR_CASH_PAYMENT_LIMIT
    http_status: 422
    applies_to: "POST /settlements/{settlement_id}/pay"

  - priority: 43
    category: business_fiscal
    check: "An exposure override may not exceed twice the market's guarantee_exposure_limit_cents and must carry a non-empty justification"
    error_id: ERR_EXPOSURE_OVERRIDE_INVALID
    http_status: 422
    applies_to: "POST /shows/{show_id}/exposure-override"

  - priority: 44
    category: business_constraint
    check: "SUM(allocation_qty) over the show's TicketTier rows, including the tier being created, is <= venue.gross_capacity"
    error_id: ERR_VENUE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /ticket-tiers"

  - priority: 45
    category: business_constraint
    check: "tier_name is unique among the show's TicketTier rows"
    error_id: ERR_DUPLICATE_TIER_NAME
    http_status: 409
    applies_to: "POST /ticket-tiers"

  - priority: 46
    category: business_referential
    check: "The show has no existing Settlement whose status is anything other than PAID"
    error_id: ERR_SETTLEMENT_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /settlements"

# =============================================================================
# 1.5 API Endpoint Table  (flat topology — every entity is a top-level
#     collection; api_prefix is empty)
# =============================================================================
endpoints:

  # ------------------------------------------------------------------- Market
  - method: POST
    path: "/markets"
    description: "Open a market and set its hard guarantee-exposure ceiling."
    roles: [RiskOfficer]
    code: 201
    input: [name, region_code, guarantee_exposure_limit_cents]
    output: Market
    side_effects: ["Market created with committed_guarantee_cents 0, exposure_utilization_pct 0, risk_posture OPEN, performance_index 0, version 1"]

  - method: GET
    path: "/markets/{market_id}"
    description: "Read one market including its live exposure and posture."
    roles: [TalentBuyer, TourAccountant, RiskOfficer]
    code: 200
    input: []
    output: Market
    side_effects: []

  - method: GET
    path: "/markets"
    description: "List markets, most recently created first."
    roles: [TalentBuyer, TourAccountant, RiskOfficer]
    code: 200
    input: ["risk_posture?", "limit?", "offset?"]
    output: Market[]
    side_effects: []

  - method: GET
    path: "/markets/{market_id}/portfolio-risk"
    description: "Computed read — recomputes calculations.market_guarantee_exposure and calculations.market_performance_index for the requested valuation and returns the market with those figures. valuation defaults to TRAILING_SETTLED."
    roles: [TalentBuyer, TourAccountant, RiskOfficer]
    code: 200
    input: ["valuation?"]
    output: Market
    side_effects: ["No persistence: the MARK_TO_MARKET valuation is returned in the response body only and never overwrites the stored Market.performance_index"]

  # ------------------------------------------------------------------- Artist
  - method: POST
    path: "/artists"
    description: "Register an act with its tier, historical sellthrough and statutory withholding rate."
    roles: [TalentBuyer]
    code: 201
    input: [name, agency, tier, historical_sellthrough_pct, "withholding_pct?"]
    output: Artist
    side_effects: ["Artist created with confirmed_show_count 0"]

  - method: GET
    path: "/artists/{artist_id}"
    description: "Read one artist."
    roles: [TalentBuyer, TourAccountant, RiskOfficer, ArtistRep]
    code: 200
    input: []
    output: Artist
    side_effects: []

  - method: GET
    path: "/artists"
    description: "List acts."
    roles: [TalentBuyer, TourAccountant, RiskOfficer]
    code: 200
    input: ["tier?", "limit?", "offset?"]
    output: Artist[]
    side_effects: []

  # -------------------------------------------------------------------- Venue
  - method: POST
    path: "/venues"
    description: "Register a venue inside a market with its capacity, facility fee and ticket-tax rate."
    roles: [TalentBuyer]
    code: 201
    input: [market_id, name, gross_capacity, facility_fee_cents_per_ticket, ticket_tax_pct]
    output: Venue
    side_effects: []

  - method: GET
    path: "/venues/{venue_id}"
    description: "Read one venue."
    roles: [TalentBuyer, TourAccountant, RiskOfficer, VenueOperator]
    code: 200
    input: []
    output: Venue
    side_effects: []

  - method: GET
    path: "/venues"
    description: "List venues, optionally restricted to one market (FK reverse reachability for Venue.market_id)."
    roles: [TalentBuyer, TourAccountant, RiskOfficer, VenueOperator]
    code: 200
    input: ["market_id?", "limit?", "offset?"]
    output: Venue[]
    side_effects: []

  # --------------------------------------------------------------------- Show
  - method: POST
    path: "/shows"
    description: "Book a show date. Copies market_id from the venue, validates the show window, the venue occupancy interval [load_in_at, load_out_at) and the announce date. The show starts PLANNED / PRE_SALE and commits no guarantee."
    roles: [TalentBuyer]
    code: 201
    input: [artist_id, venue_id, event_at, load_in_at, load_out_at, announce_at, venue_arrangement, "rental_fee_cents?", "copromote_venue_share_pct?", "venue_expense_pct_production?", "venue_expense_pct_marketing?", "venue_expense_pct_staffing?", "venue_expense_pct_hospitality?", "rescheduled_from_show_id?"]
    output: Show
    side_effects:
      - "Show created with show_status PLANNED, sales_status PRE_SALE, market_id copied from venue.market_id"
      - "validations priority 21-23 run: window coherence, event_at in the future, venue occupancy overlap"

  - method: GET
    path: "/shows/{show_id}"
    description: "Read one show including both status dimensions, live ticket counters and projected figures."
    roles: [TalentBuyer, TourAccountant, RiskOfficer, ArtistRep, VenueOperator]
    code: 200
    input: []
    output: Show
    side_effects: []

  - method: GET
    path: "/shows"
    description: "List shows with filters. Serves FK reverse reachability for Show.market_id, Show.artist_id, Show.venue_id and Show.rescheduled_from_show_id."
    roles: [TalentBuyer, TourAccountant, RiskOfficer, ArtistRep, VenueOperator]
    code: 200
    input: ["market_id?", "artist_id?", "venue_id?", "rescheduled_from_show_id?", "show_status?", "sales_status?", "limit?", "offset?"]
    output: Show[]
    side_effects: []

  - method: GET
    path: "/shows/{show_id}/settlement-projection"
    description: "Computed read — runs the PROVISIONAL variant of calculations.show_settlement_projection over the show's current tier inventory and BUDGETED expenses and returns a Settlement-shaped projection. No Settlement row is created or modified."
    roles: [TalentBuyer, TourAccountant, RiskOfficer]
    code: 200
    input: []
    output: Settlement
    side_effects: ["None — the returned object is transient: id, created_at, updated_at and version are all null, status is reported as DRAFT, show_id echoes the path id, and no persisted Settlement row is created, read or mutated"]

  - method: POST
    path: "/shows/{show_id}/on-sale"
    description: "Announce and open sales. Moves show_status CONFIRMED -> ON_SALE and sales_status PRE_SALE -> SELLING, and cascades every DRAFT TicketTier to ON_SALE."
    roles: [TalentBuyer]
    code: 200
    input: []
    output: Show
    side_effects:
      - "show.show_status -> ON_SALE, show.sales_status -> SELLING"
      - "every TicketTier of the show with status DRAFT -> ON_SALE and its available_qty re-derived"
      - "increments Show.version and every touched TicketTier.version by 1"

  - method: POST
    path: "/shows/{show_id}/pause-sales"
    description: "Halt ticket sales without touching the show lifecycle. sales_status SELLING -> PAUSED and every ON_SALE tier -> PAUSED."
    roles: [TalentBuyer, RiskOfficer]
    code: 200
    input: [reason]
    output: Show
    side_effects:
      - "show.sales_status -> PAUSED; show.show_status is UNCHANGED (parallel dimensions)"
      - "every TicketTier with status ON_SALE -> PAUSED"
      - "increments Show.version and every touched TicketTier.version by 1"

  - method: POST
    path: "/shows/{show_id}/resume-sales"
    description: "Resume ticket sales. sales_status PAUSED -> SELLING and every PAUSED tier -> ON_SALE. Repeatable — this is the cyclic edge of the sales dimension."
    roles: [TalentBuyer]
    code: 200
    input: []
    output: Show
    side_effects:
      - "show.sales_status -> SELLING"
      - "every TicketTier with status PAUSED -> ON_SALE"
      - "increments Show.version and every touched TicketTier.version by 1"

  - method: POST
    path: "/shows/{show_id}/perform"
    description: "Record that the show happened. Requires the logical clock to have reached event_at. Closes ticketing and unlocks settlement."
    roles: [TalentBuyer, TourAccountant]
    code: 200
    input: []
    output: Show
    side_effects:
      - "show.show_status ON_SALE -> PERFORMED, show.sales_status -> CLOSED"
      - "every TicketTier of the show -> CLOSED with available_qty 0"
      - "show.adjusted_gross_cents recomputed via calculations.adjusted_gross_receipts"
      - "increments Show.version and every touched TicketTier.version by 1"

  - method: POST
    path: "/shows/{show_id}/exposure-override"
    description: "Grant a show-scoped exposure ceiling that replaces the market limit for this show's guarantee check only. The override never changes the market's own limit, posture bands or utilisation."
    roles: [RiskOfficer]
    code: 200
    input: [exposure_override_limit_cents, exposure_override_justification]
    output: Show
    side_effects:
      - "show.exposure_override_limit_cents / exposure_override_justification / exposure_override_by_user_id recorded"
      - "increments Show.version by 1"

  # -------------------------------------------------------------------- Offer
  - method: POST
    path: "/offers"
    description: "Write a new offer against a PLANNED show. Requires expected_show_version (concurrency_rules offer-create-stale-show): creating an offer supersedes every other SUBMITTED or COUNTERED offer on the show, so the writer must prove its view of the show is current. A sibling still in DRAFT is deliberately left alone — it was never put in front of the agent."
    roles: [TalentBuyer]
    code: 201
    input: [show_id, expected_show_version, deal_structure, guarantee_cents, deposit_cents, expense_cap_cents, "versus_pct?", "backend_split_artist_pct?"]
    output: Offer
    side_effects:
      - "Offer created with status DRAFT, round_index 1"
      - "every other Offer on the same show with status IN {SUBMITTED, COUNTERED} -> SUPERSEDED (a DRAFT sibling is NOT superseded — see state_machines.Offer, which declares the SUPERSEDED edge only from SUBMITTED and COUNTERED)"
      - "increments Show.version by 1 and every superseded Offer.version by 1"

  - method: GET
    path: "/offers/{offer_id}"
    description: "Read one offer with its full deal terms and the latest counter."
    roles: [TalentBuyer, TourAccountant, RiskOfficer, ArtistRep]
    code: 200
    input: []
    output: Offer
    side_effects: []

  - method: GET
    path: "/offers"
    description: "List offers, optionally restricted to one show (FK reverse reachability for Offer.show_id)."
    roles: [TalentBuyer, TourAccountant, RiskOfficer, ArtistRep]
    code: 200
    input: ["show_id?", "status?", "deal_structure?", "limit?", "offset?"]
    output: Offer[]
    side_effects: []

  - method: POST
    path: "/offers/{offer_id}/submit"
    description: "Send the offer to the artist side. Stamps submitted_at from the logical clock and expires_at at submitted_at + OFFER_TTL_HOURS (72). Also the re-submit edge of the negotiation cycle from COUNTERED."
    roles: [TalentBuyer]
    code: 200
    input: ["guarantee_cents?", "versus_pct?", "backend_split_artist_pct?"]
    output: Offer
    side_effects:
      - "offer.status DRAFT|COUNTERED -> SUBMITTED"
      - "offer.submitted_at = current logical clock; offer.expires_at = submitted_at + OFFER_TTL_HOURS (72)"
      - "when re-submitting from COUNTERED, offer.round_index += 1 and any supplied revised terms overwrite the deal terms"
      - "increments Offer.version by 1"

  - method: POST
    path: "/offers/{offer_id}/counter"
    description: "Artist side counters a SUBMITTED offer. Rejected once round_index has reached NEGOTIATION_ROUND_LIMIT (3), and rejected once the offer has expired."
    roles: [ArtistRep]
    code: 200
    input: [counter_guarantee_cents, "counter_versus_pct?", "counter_backend_split_artist_pct?", counter_note]
    output: Offer
    side_effects:
      - "offer.status SUBMITTED -> COUNTERED and the counter_* fields are recorded"
      - "increments Offer.version by 1"

  - method: POST
    path: "/offers/{offer_id}/accept"
    description: "Artist side accepts a SUBMITTED offer. This is the money-committing call: it confirms the show, books the guarantee against the market and re-bands the market's risk posture. Runs the artist routing check and both market exposure checks."
    roles: [ArtistRep]
    code: 200
    input: []
    output: Offer
    side_effects:
      - "offer.status SUBMITTED -> ACCEPTED, offer.accepted_by_user_id = X-User-ID"
      - "every other Offer on the show -> SUPERSEDED"
      - "CASCADE hop 1: show.show_status PLANNED -> CONFIRMED, show.committed_guarantee_cents = offer.guarantee_cents, show.breakeven_cents and show.projected_* recomputed"
      - "CASCADE hop 2: artist.confirmed_show_count += 1"
      - "CASCADE hop 3: market.committed_guarantee_cents / at_risk_guarantee_cents / exposure_utilization_pct recomputed and market.risk_posture re-banded per calculations.market_guarantee_exposure"
      - "increments Offer.version, Show.version, Artist.version and Market.version by 1 each"

  - method: POST
    path: "/offers/{offer_id}/withdraw"
    description: "Pull an offer that has not been accepted."
    roles: [TalentBuyer]
    code: 200
    input: [reason]
    output: Offer
    side_effects:
      - "offer.status DRAFT|SUBMITTED|COUNTERED -> WITHDRAWN"
      - "increments Offer.version by 1"

  # --------------------------------------------------------------- BudgetLine
  - method: POST
    path: "/budget-lines"
    description: "Budget a show expense in one of the four categories and declare whether it is artist-deductible."
    roles: [TourAccountant]
    code: 201
    input: [show_id, category, description, budgeted_cents, "is_artist_deductible?"]
    output: BudgetLine
    side_effects:
      - "BudgetLine created with actual_cents 0, variance_status WITHIN_TOLERANCE, required_approver_role NONE, settlement_expense_cents 0, status ACTIVE"
      - "show.total_budgeted_expense_cents, show.breakeven_cents and show.projected_promoter_net_cents recomputed"
      - "market.at_risk_guarantee_cents recomputed and market.risk_posture re-banded"
      - "increments Show.version and Market.version by 1 each"

  - method: GET
    path: "/budget-lines/{budget_line_id}"
    description: "Read one budget line with its variance state and recognised settlement expense."
    roles: [TalentBuyer, TourAccountant, RiskOfficer, ArtistRep, VenueOperator]
    code: 200
    input: []
    output: BudgetLine
    side_effects: []

  - method: GET
    path: "/budget-lines"
    description: "List budget lines, optionally restricted to one show (FK reverse reachability for BudgetLine.show_id)."
    roles: [TalentBuyer, TourAccountant, RiskOfficer, ArtistRep, VenueOperator]
    code: 200
    input: ["show_id?", "category?", "variance_status?", "status?", "limit?", "offset?"]
    output: BudgetLine[]
    side_effects: []

  - method: POST
    path: "/budget-lines/{budget_line_id}/variance-decision"
    description: "Decide a PENDING_APPROVAL variance. APPROVE recognises min(actual_cents, approved_cap_cents); REJECT clamps recognition back to budgeted_cents. The acting role must satisfy the line's required_approver_role."
    roles: [TourAccountant, RiskOfficer]
    code: 200
    input: [decision, "approved_cap_cents?", variance_justification]
    output: BudgetLine
    side_effects:
      - "line.variance_status PENDING_APPROVAL -> APPROVED | REJECTED with divergent settlement_expense_cents"
      - "line.variance_decided_by_user_id = X-User-ID"
      - "show.budget_posture and show.breakeven_cents recomputed"
      - "market.at_risk_guarantee_cents recomputed and market.risk_posture re-banded"
      - "increments BudgetLine.version, Show.version and Market.version by 1 each"

  # ------------------------------------------------------------ VendorInvoice
  - method: POST
    path: "/vendor-invoices"
    description: "Capture a day-of-show vendor invoice against a budget line with its settlement-book documentation reference."
    roles: [TourAccountant, VenueOperator]
    code: 201
    input: [show_id, budget_line_id, vendor_name, amount_cents, invoice_date, documentation_ref]
    output: VendorInvoice
    side_effects:
      - "VendorInvoice created with status SUBMITTED, resubmit_count 0"
      - "no budget line figures move — an unapproved invoice is invisible to the ledger"

  - method: GET
    path: "/vendor-invoices/{vendor_invoice_id}"
    description: "Read one vendor invoice."
    roles: [TalentBuyer, TourAccountant, RiskOfficer, VenueOperator]
    code: 200
    input: []
    output: VendorInvoice
    side_effects: []

  - method: GET
    path: "/vendor-invoices"
    description: "List vendor invoices, optionally restricted to one show or one budget line (FK reverse reachability for VendorInvoice.show_id and VendorInvoice.budget_line_id)."
    roles: [TalentBuyer, TourAccountant, RiskOfficer, VenueOperator]
    code: 200
    input: ["show_id?", "budget_line_id?", "status?", "limit?", "offset?"]
    output: VendorInvoice[]
    side_effects: []

  - method: POST
    path: "/vendor-invoices/{vendor_invoice_id}/verify"
    description: "Tour accountant verifies the invoice against the settlement book. Records verified_by_user_id, which the approval step must differ from."
    roles: [TourAccountant]
    code: 200
    input: []
    output: VendorInvoice
    side_effects:
      - "invoice.status SUBMITTED -> VERIFIED, invoice.verified_by_user_id = X-User-ID"
      - "increments VendorInvoice.version by 1"

  - method: POST
    path: "/vendor-invoices/{vendor_invoice_id}/approve"
    description: "Approve a verified invoice. This is the four-hop cascade trigger: the amount enters the budget line, which may open a variance, which re-postures the show, which re-prices the market's risk. Requires a different user than the verifier."
    roles: [TourAccountant, RiskOfficer]
    code: 200
    input: []
    output: VendorInvoice
    side_effects:
      - "invoice.status VERIFIED -> APPROVED, invoice.approved_by_user_id = X-User-ID"
      - "CASCADE hop 1: budget_line.actual_cents / variance_cents / variance_pct recomputed"
      - "CASCADE hop 2: budget_line.variance_status and required_approver_role re-derived; settlement_expense_cents re-derived"
      - "CASCADE hop 3: show.total_actual_expense_cents, show.budget_posture and show.breakeven_cents recomputed"
      - "CASCADE hop 4: market.at_risk_guarantee_cents recomputed and market.risk_posture re-banded"
      - "increments VendorInvoice.version, BudgetLine.version, Show.version and Market.version by 1 each"

  - method: POST
    path: "/vendor-invoices/{vendor_invoice_id}/dispute"
    description: "Dispute an invoice that has not yet been approved. Voids any verification."
    roles: [TourAccountant, VenueOperator]
    code: 200
    input: [dispute_reason]
    output: VendorInvoice
    side_effects:
      - "invoice.status SUBMITTED|VERIFIED -> DISPUTED, invoice.verified_by_user_id = null"
      - "increments VendorInvoice.version by 1"

  - method: POST
    path: "/vendor-invoices/{vendor_invoice_id}/dispute-resolution"
    description: "Resolve a dispute. outcome = RESUBMIT re-papers the amount and returns the invoice to SUBMITTED (the cycle edge, resubmit_count += 1); outcome = REJECT terminates it and withdraws the amount from the ledger, which can compensate a pending variance back to WITHIN_TOLERANCE."
    roles: [TourAccountant]
    code: 200
    input: [outcome, "amount_cents?", "documentation_ref?", "reason?"]
    output: VendorInvoice
    side_effects:
      - "outcome RESUBMIT: invoice.status DISPUTED -> SUBMITTED, amount_cents and documentation_ref replaced, resubmit_count += 1"
      - "outcome REJECT: invoice.status DISPUTED -> REJECTED; budget_line.actual_cents refreshed and its variance re-derived; show.budget_posture recomputed"
      - "increments VendorInvoice.version by 1 and, on REJECT, BudgetLine.version and Show.version by 1 each"

  # --------------------------------------------------------------- TicketTier
  - method: POST
    path: "/ticket-tiers"
    description: "Allocate a priced inventory tier on a show. The sum of a show's allocation_qty may not exceed the venue's gross_capacity."
    roles: [TalentBuyer]
    code: 201
    input: [show_id, tier_name, price_cents, allocation_qty]
    output: TicketTier
    side_effects:
      - "TicketTier created with status DRAFT, sold_qty 0, gross_sold_cents 0, comp_qty 0, held_qty 0, available_qty = allocation_qty, price_revision_count 0"
      - "show.projected_adjusted_gross_cents and show.projected_promoter_net_cents recomputed"
      - "market.at_risk_guarantee_cents recomputed and market.risk_posture re-banded"
      - "increments Show.version and Market.version by 1 each"

  - method: GET
    path: "/ticket-tiers/{ticket_tier_id}"
    description: "Read one tier with its live inventory split and accumulated gross."
    roles: [TalentBuyer, TourAccountant, RiskOfficer, ArtistRep, VenueOperator]
    code: 200
    input: []
    output: TicketTier
    side_effects: []

  - method: GET
    path: "/ticket-tiers"
    description: "List tiers, optionally restricted to one show (FK reverse reachability for TicketTier.show_id)."
    roles: [TalentBuyer, TourAccountant, RiskOfficer, ArtistRep, VenueOperator]
    code: 200
    input: ["show_id?", "status?", "limit?", "offset?"]
    output: TicketTier[]
    side_effects: []

  - method: POST
    path: "/ticket-tiers/{ticket_tier_id}/price-adjustments"
    description: "Revise the tier face price in response to sales pace. Requires expected_show_version (concurrency_rules price-adjustment-stale-show). Never revalues tickets already sold — gross_sold_cents is an accumulator."
    roles: [TalentBuyer]
    code: 200
    input: [new_price_cents, expected_show_version, reason]
    output: TicketTier
    side_effects:
      - "tier.last_price_cents = the previous price_cents; tier.price_cents = new_price_cents; tier.price_revision_count += 1"
      - "tier.gross_sold_cents and tier.sold_qty are UNCHANGED — historical sales keep their as-sold price"
      - "show.projected_adjusted_gross_cents and show.projected_promoter_net_cents recomputed at the new price"
      - "market.at_risk_guarantee_cents recomputed and market.risk_posture re-banded"
      - "increments TicketTier.version, Show.version and Market.version by 1 each"

  - method: POST
    path: "/ticket-tiers/{ticket_tier_id}/sales"
    description: "Record a block of paid ticket sales at the tier's CURRENT price. Requires the tier to be ON_SALE and enough available_qty."
    roles: [TalentBuyer, VenueOperator]
    code: 200
    input: [qty]
    output: TicketTier
    side_effects:
      - "tier.sold_qty += qty; tier.gross_sold_cents += qty * tier.price_cents; tier.available_qty -= qty (calculations.tier_gross_accumulation)"
      - "show.gross_sold_cents, show.paid_tickets_sold and show.adjusted_gross_cents recomputed"
      - "market.at_risk_guarantee_cents recomputed and market.risk_posture re-banded"
      - "increments TicketTier.version, Show.version and Market.version by 1 each"

  # --------------------------------------------------------------- TicketHold
  - method: POST
    path: "/ticket-holds"
    description: "Block seats out of a tier's sellable inventory. kind COMP counts against the show's comp allowance immediately; the other kinds do not until converted."
    roles: [TalentBuyer, ArtistRep, VenueOperator]
    code: 201
    input: [ticket_tier_id, kind, qty, holder, "expires_at?"]
    output: TicketHold
    side_effects:
      - "TicketHold created with status HELD"
      - "tier.comp_qty (kind COMP) or tier.held_qty (all other kinds) += qty and tier.available_qty -= qty"
      - "show.comp_tickets_issued / held_tickets updated; show.projected_adjusted_gross_cents recomputed"
      - "increments TicketTier.version, Show.version and Market.version by 1 each"

  - method: GET
    path: "/ticket-holds/{ticket_hold_id}"
    description: "Read one hold."
    roles: [TalentBuyer, TourAccountant, RiskOfficer, ArtistRep, VenueOperator]
    code: 200
    input: []
    output: TicketHold
    side_effects: []

  - method: GET
    path: "/ticket-holds"
    description: "List holds, optionally restricted to one tier (FK reverse reachability for TicketHold.ticket_tier_id)."
    roles: [TalentBuyer, TourAccountant, RiskOfficer, ArtistRep, VenueOperator]
    code: 200
    input: ["ticket_tier_id?", "kind?", "status?", "limit?", "offset?"]
    output: TicketHold[]
    side_effects: []

  - method: POST
    path: "/ticket-holds/{ticket_hold_id}/release"
    description: "Release held seats back into sellable inventory. Exactly reverses the hold's inventory movement (calculations.tier_inventory_conservation)."
    roles: [TalentBuyer, ArtistRep, VenueOperator]
    code: 200
    input: []
    output: TicketHold
    side_effects:
      - "hold.status HELD -> RELEASED, hold.released_by_user_id = X-User-ID"
      - "tier.comp_qty or tier.held_qty -= hold.qty and tier.available_qty += hold.qty"
      - "show.comp_tickets_issued / held_tickets updated; show.projected_adjusted_gross_cents recomputed"
      - "increments TicketHold.version, TicketTier.version, Show.version and Market.version by 1 each"

  - method: POST
    path: "/ticket-holds/{ticket_hold_id}/convert-to-comp"
    description: "Reclassify a non-COMP hold as papered comps. Ticket count is conserved and available_qty does not move, but the seats now count against the show's comp allowance."
    roles: [TalentBuyer]
    code: 200
    input: []
    output: TicketHold
    side_effects:
      - "hold.kind -> COMP, hold.status HELD -> CONVERTED, hold.released_by_user_id = X-User-ID"
      - "tier.held_qty -= qty and tier.comp_qty += qty; tier.available_qty UNCHANGED"
      - "show.comp_tickets_issued += qty and show.held_tickets -= qty"
      - "increments TicketHold.version, TicketTier.version and Show.version by 1 each"

  # --------------------------------------------------------------- Settlement
  - method: POST
    path: "/settlements"
    description: "Open the settlement book for a show. Only one non-PAID Settlement may exist per show."
    roles: [TourAccountant]
    code: 201
    input: [show_id]
    output: Settlement
    side_effects: ["Settlement created with status DRAFT, reopen_count 0, and every money field 0"]

  - method: GET
    path: "/settlements/{settlement_id}"
    description: "Read one settlement with every frozen money field."
    roles: [TalentBuyer, TourAccountant, RiskOfficer, ArtistRep, VenueOperator]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: GET
    path: "/settlements"
    description: "List settlements, optionally restricted to one show (FK reverse reachability for Settlement.show_id)."
    roles: [TalentBuyer, TourAccountant, RiskOfficer, ArtistRep, VenueOperator]
    code: 200
    input: ["show_id?", "status?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []

  - method: POST
    path: "/settlements/{settlement_id}/calculate"
    description: "Run the FINAL variant of calculations.show_settlement_projection and freeze the whole settlement onto the row. Refuses to run while any invoice or variance on the show is unresolved. Repeatable from DISPUTED and REOPENED."
    roles: [TourAccountant]
    code: 200
    input: []
    output: Settlement
    side_effects:
      - "settlement.status DRAFT|DISPUTED|REOPENED -> CALCULATED"
      - "the full receipt waterfall, expense recognition, artist earnings, venue reimbursement and the promoter/venue split are all written (calculations.adjusted_gross_receipts, artist_settlement_earnings, venue_expense_reimbursement, settlement_split)"
      - "settlement.calculated_by_user_id = X-User-ID"
      - "increments Settlement.version by 1"

  - method: POST
    path: "/settlements/{settlement_id}/artist-response"
    description: "Artist side signs or disputes the calculated settlement. response = SIGN unlocks payment; response = DISPUTE sends it back for recalculation."
    roles: [ArtistRep]
    code: 200
    input: [response, "dispute_reason?"]
    output: Settlement
    side_effects:
      - "response SIGN: settlement.status CALCULATED -> ARTIST_SIGNED, signed_by_user_id = X-User-ID"
      - "response DISPUTE: settlement.status CALCULATED -> DISPUTED, dispute_reason recorded"
      - "increments Settlement.version by 1"

  - method: POST
    path: "/settlements/{settlement_id}/pay"
    description: "Pay the artist on site. Terminal for the settlement and the trigger that closes the show and releases the market's guarantee exposure. CASH is capped at CASH_PAYMENT_LIMIT_CENTS (1000000)."
    roles: [TourAccountant]
    code: 200
    input: [payment_method, payment_reference]
    output: Settlement
    side_effects:
      - "settlement.status ARTIST_SIGNED -> PAID, paid_at = current logical clock"
      - "CASCADE hop 1: show.show_status PERFORMED -> SETTLED"
      - "CASCADE hop 2: every ACTIVE BudgetLine of the show -> SETTLED"
      - "CASCADE hop 3: market.committed_guarantee_cents / at_risk_guarantee_cents / exposure_utilization_pct recomputed, market.risk_posture re-banded, market.settled_show_count += 1, market.performance_index recomputed via the TRAILING_SETTLED variant"
      - "increments Settlement.version, Show.version, every touched BudgetLine.version and Market.version by 1 each"

  - method: POST
    path: "/settlements/{settlement_id}/reopen"
    description: "Risk officer reopens a calculated or signed settlement. Voids any artist signature and increments reopen_count. Must be a different user than the one who calculated it."
    roles: [RiskOfficer]
    code: 200
    input: [reopen_reason]
    output: Settlement
    side_effects:
      - "settlement.status CALCULATED|ARTIST_SIGNED -> REOPENED, reopen_count += 1, signed_by_user_id = null"
      - "increments Settlement.version by 1"

  # -------------------------------------------------------- CancellationEvent
  - method: POST
    path: "/cancellation-events"
    description: "Pull a show. kind CANCELLED kills it outright; kind POSTPONED keeps the deal alive for a reschedule. Either kind takes the guarantee off the market's exposure book, while POSTPONED alone leaves the artist-routing block in place. Closes all ticketing either way."
    roles: [TalentBuyer, RiskOfficer]
    code: 201
    input: [show_id, kind, reason]
    output: CancellationEvent
    side_effects:
      - "CancellationEvent created with status OPENED and occurred_at = the current logical clock"
      - "kind CANCELLED: show.show_status -> CANCELLED, every ACTIVE BudgetLine -> VOID, market.committed_guarantee_cents decreases by show.committed_guarantee_cents and market.risk_posture is re-banded"
      - "kind POSTPONED: show.show_status -> POSTPONED, BudgetLines are NOT voided, and the show leaves the market exposure set so market.committed_guarantee_cents decreases by show.committed_guarantee_cents (it remains inside the artist-routing set of validations priority 24)"
      - "show.sales_status -> CLOSED and every TicketTier -> CLOSED with available_qty 0"
      - "show.refund_liability_cents = calculations.refund_liability_and_recovery"
      - "increments Show.version, Market.version, every touched BudgetLine.version and every touched TicketTier.version by 1 each"

  - method: GET
    path: "/cancellation-events/{cancellation_event_id}"
    description: "Read one cancellation event with its refund and insurance figures."
    roles: [TalentBuyer, TourAccountant, RiskOfficer, ArtistRep, VenueOperator]
    code: 200
    input: []
    output: CancellationEvent
    side_effects: []

  - method: GET
    path: "/cancellation-events"
    description: "List cancellation events, optionally restricted to the cancelled show or the replacement show (FK reverse reachability for CancellationEvent.show_id and CancellationEvent.replacement_show_id)."
    roles: [TalentBuyer, TourAccountant, RiskOfficer, ArtistRep, VenueOperator]
    code: 200
    input: ["show_id?", "replacement_show_id?", "kind?", "status?", "limit?", "offset?"]
    output: CancellationEvent[]
    side_effects: []

  - method: POST
    path: "/cancellation-events/{cancellation_event_id}/process-refunds"
    description: "Refund every paid ticket at face value and freeze the promoter's unrecovered cost — the insurable base."
    roles: [TourAccountant]
    code: 200
    input: []
    output: CancellationEvent
    side_effects:
      - "event.status OPENED -> REFUNDS_PROCESSED"
      - "event.refund_liability_cents, refunded_ticket_count and unrecovered_cost_cents written per calculations.refund_liability_and_recovery"
      - "show.gross_sold_cents and show.adjusted_gross_cents -> 0"
      - "increments CancellationEvent.version and Show.version by 1 each"

  - method: POST
    path: "/cancellation-events/{cancellation_event_id}/file-claim"
    description: "File an insurance claim. Must be inside the INSURANCE_CLAIM_WINDOW_DAYS (30) window measured from occurred_at."
    roles: [RiskOfficer]
    code: 200
    input: [claim_amount_cents, claim_documentation_ref]
    output: CancellationEvent
    side_effects:
      - "event.status REFUNDS_PROCESSED -> CLAIM_FILED; claim_amount_cents, claim_documentation_ref and filed_by_user_id recorded"
      - "increments CancellationEvent.version by 1"

  - method: POST
    path: "/cancellation-events/{cancellation_event_id}/settle-claim"
    description: "Insurer's answer. outcome = SETTLE computes covered_loss_cents and insurance_recovery_cents net of the deductible and relieves the market's at-risk exposure; outcome = DENY leaves the whole loss with the promoter. Must be a different user than the filer."
    roles: [RiskOfficer]
    code: 200
    input: [outcome, "insurer_reference?", "reason?"]
    output: CancellationEvent
    side_effects:
      - "outcome SETTLE: event.status CLAIM_FILED -> CLAIM_SETTLED; covered_loss_cents and insurance_recovery_cents written; market.at_risk_guarantee_cents reduced and market.risk_posture re-banded"
      - "outcome DENY: event.status CLAIM_FILED -> CLAIM_DENIED with covered_loss_cents 0 and insurance_recovery_cents 0; the market's exposure is untouched"
      - "increments CancellationEvent.version by 1 and, on SETTLE, Market.version by 1"

  - method: POST
    path: "/cancellation-events/{cancellation_event_id}/reschedule"
    description: "Link a POSTPONED show to a replacement date, transferring paid tickets and gross onto the replacement. The alternative fork to the refund/insurance path."
    roles: [TalentBuyer]
    code: 200
    input: [replacement_show_id]
    output: CancellationEvent
    side_effects:
      - "event.status OPENED -> RESCHEDULED, event.replacement_show_id recorded"
      - "original show.show_status POSTPONED -> RESCHEDULED and its refund_liability_cents -> 0"
      - "replacement show.transferred_in_gross_cents / transferred_in_paid_tickets inherit the original's figures and its projections are recomputed"
      - "market.committed_guarantee_cents is unchanged by this call — the guarantee already left the book at postponement, and the PLANNED replacement re-books it only when a new offer is accepted on it; market.at_risk_guarantee_cents, exposure_utilization_pct and risk_posture are re-derived"
      - "increments CancellationEvent.version, both Show.version values and Market.version by 1 each"

  # --------------------------------- test-driving endpoints (/_ namespace) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to an arbitrary UTC instant. Until this is called the logical clock reads exactly 2026-08-01T00:00:00Z — the mandatory startup default — and NEVER falls back to real wall-clock time. Every deadline in this scaffold (offer expiry, hold expiry, announce gate, event_at gate, insurance claim window) is measured against this clock."
    roles: [TalentBuyer, TourAccountant, RiskOfficer, ArtistRep, VenueOperator]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["The logical clock is set; nothing else moves — expiries are applied only by POST /_ops/run"]

  - method: POST
    path: "/_ops/run"
    description: "Advance time-driven housekeeping at the current logical clock: expire SUBMITTED offers whose expires_at has been reached, and expire HELD ticket holds whose expires_at has been reached. Idempotent — running it twice at the same clock changes nothing the second time."
    roles: [TalentBuyer, TourAccountant, RiskOfficer]
    code: 200
    input: []
    output: null
    side_effects:
      - "every Offer with status SUBMITTED and expires_at <= now -> EXPIRED"
      - "every TicketHold with status HELD and expires_at != null and expires_at <= now -> EXPIRED, releasing its seats back into tier.available_qty"
      - "increments the version of every entity it touches by 1"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---------------------------------------------------------------
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_ROLE_FORBIDDEN, http: 403, condition: "X-User-Role is not a declared role, or is not listed on the target endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "An entity-backed role acted on a resource it does not own — an ArtistRep whose X-User-ID != show.artist_id, or a VenueOperator whose X-User-ID != show.venue_id" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The acting X-User-ID already performed the paired earlier step: approving an invoice one verified, paying a settlement one signed, reopening a settlement one calculated, or settling a claim one filed" }
  - { id: ERR_VARIANCE_APPROVAL_AUTHORITY, http: 403, condition: "A TourAccountant attempted to decide a BudgetLine whose required_approver_role == RISK_OFFICER" }

  # --- request shape ------------------------------------------------------
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, undeclared enum value, negative *_cents, *_pct outside [0, 100], malformed timestamp, or qty < 1" }

  # --- existence ----------------------------------------------------------
  - { id: ERR_MARKET_NOT_FOUND, http: 404, condition: "No Market with the supplied market_id" }
  - { id: ERR_ARTIST_NOT_FOUND, http: 404, condition: "No Artist with the supplied artist_id" }
  - { id: ERR_VENUE_NOT_FOUND, http: 404, condition: "No Venue with the supplied venue_id" }
  - { id: ERR_SHOW_NOT_FOUND, http: 404, condition: "No Show with the supplied show_id, rescheduled_from_show_id or replacement_show_id" }
  - { id: ERR_OFFER_NOT_FOUND, http: 404, condition: "No Offer with the supplied offer_id" }
  - { id: ERR_BUDGET_LINE_NOT_FOUND, http: 404, condition: "No BudgetLine with the supplied budget_line_id" }
  - { id: ERR_VENDOR_INVOICE_NOT_FOUND, http: 404, condition: "No VendorInvoice with the supplied vendor_invoice_id" }
  - { id: ERR_TICKET_TIER_NOT_FOUND, http: 404, condition: "No TicketTier with the supplied ticket_tier_id" }
  - { id: ERR_TICKET_HOLD_NOT_FOUND, http: 404, condition: "No TicketHold with the supplied ticket_hold_id" }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "No Settlement with the supplied settlement_id" }
  - { id: ERR_CANCELLATION_EVENT_NOT_FOUND, http: 404, condition: "No CancellationEvent with the supplied cancellation_event_id" }

  # --- concurrency / state ------------------------------------------------
  - { id: ERR_STALE_SHOW_VERSION, http: 412, condition: "expected_show_version does not equal the Show's current version (concurrency_rules offer-create-stale-show, price-adjustment-stale-show)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "The target resource's current state has no declared transition for this trigger — e.g. calculating a settlement for a show that is not PERFORMED, selling from a DRAFT tier, countering an offer that is not SUBMITTED, or rescheduling a CANCELLED event" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "The target resource already sits in one of its terminal states — a PAID settlement, an ACCEPTED or WITHDRAWN offer, a RELEASED hold, a SETTLED or CANCELLED show, a CLAIM_SETTLED event" }

  # --- referential / cross-entity ----------------------------------------
  - { id: ERR_BUDGET_LINE_SHOW_MISMATCH, http: 422, condition: "The invoice's budget_line_id belongs to a different show than its show_id" }
  - { id: ERR_SETTLEMENT_ALREADY_OPEN, http: 409, condition: "The show already has a Settlement in a status other than PAID" }
  - { id: ERR_UNRESOLVED_INVOICES, http: 409, condition: "Settlement calculation attempted while at least one VendorInvoice of the show is SUBMITTED, VERIFIED or DISPUTED" }
  - { id: ERR_UNRESOLVED_VARIANCE, http: 409, condition: "Settlement calculation attempted while at least one BudgetLine of the show is PENDING_APPROVAL" }
  - { id: ERR_NO_TICKET_TIERS, http: 422, condition: "The show has no TicketTier (on-sale) or no BudgetLine (settlement calculation)" }
  - { id: ERR_REPLACEMENT_SHOW_INVALID, http: 422, condition: "The replacement show does not point back at the original via rescheduled_from_show_id, is not PLANNED, or is the original show itself" }

  # --- temporal -----------------------------------------------------------
  - { id: ERR_INVALID_SHOW_WINDOW, http: 422, condition: "Not load_in_at < event_at < load_out_at, or announce_at > event_at" }
  - { id: ERR_EVENT_DATE_IN_PAST, http: 422, condition: "event_at is at or before the current logical clock at show creation" }
  - { id: ERR_VENUE_WINDOW_CONFLICT, http: 409, condition: "The new show's half-open occupancy interval [load_in_at, load_out_at) overlaps that of a live show at the same venue. Exact adjacency does NOT conflict." }
  - { id: ERR_ARTIST_ROUTING_CONFLICT, http: 409, condition: "Accepting the offer would confirm a show within ARTIST_REST_BUFFER_HOURS (36) of another confirmed show for the same artist. A gap of exactly the buffer does NOT conflict." }
  - { id: ERR_OFFER_EXPIRED, http: 409, condition: "The logical clock has reached offer.expires_at" }
  - { id: ERR_ANNOUNCE_DATE_NOT_REACHED, http: 422, condition: "On-sale attempted before show.announce_at" }
  - { id: ERR_SHOW_NOT_YET_OCCURRED, http: 422, condition: "Perform attempted before show.event_at" }
  - { id: ERR_CLAIM_WINDOW_CLOSED, http: 422, condition: "Claim filed more than INSURANCE_CLAIM_WINDOW_DAYS (30) after cancellation_event.occurred_at" }

  # --- deal / negotiation constraints ------------------------------------
  - { id: ERR_DEAL_TERMS_INCOHERENT, http: 422, condition: "Deal terms contradict deal_structure (versus_pct on a backend deal, missing backend_split_artist_pct on a backend deal, deposit_cents > guarantee_cents, expense_cap_cents < 1)" }
  - { id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED, http: 409, condition: "Counter attempted when offer.round_index has already reached NEGOTIATION_ROUND_LIMIT (3)" }
  - { id: ERR_VARIANCE_CAP_INVALID, http: 422, condition: "APPROVE without approved_cap_cents, APPROVE with approved_cap_cents < budgeted_cents, or REJECT with approved_cap_cents supplied" }

  # --- inventory constraints ---------------------------------------------
  - { id: ERR_VENUE_CAPACITY_EXCEEDED, http: 422, condition: "Total allocation across the show's tiers would exceed venue.gross_capacity" }
  - { id: ERR_DUPLICATE_TIER_NAME, http: 409, condition: "The show already has a TicketTier with this tier_name" }
  - { id: ERR_COMP_ALLOWANCE_EXCEEDED, http: 422, condition: "Comps after the request would exceed ROUND_HALF_UP(total_allocation * COMP_ALLOWANCE_PCT / 100)" }
  - { id: ERR_INSUFFICIENT_TIER_INVENTORY, http: 422, condition: "Requested hold or sale qty exceeds tier.available_qty" }

  # --- fiscal / risk ------------------------------------------------------
  - { id: ERR_MARKET_POSTURE_FROZEN, http: 409, condition: "Offer acceptance attempted while market.risk_posture == FROZEN" }
  - { id: ERR_MARKET_EXPOSURE_EXCEEDED, http: 402, condition: "market.committed_guarantee_cents + offer.guarantee_cents would exceed the applicable exposure ceiling (the show's override when set, else the market limit). Equality with the ceiling is allowed." }
  - { id: ERR_EXPOSURE_OVERRIDE_INVALID, http: 422, condition: "An exposure override above twice the market limit, or with an empty justification" }
  - { id: ERR_CASH_PAYMENT_LIMIT, http: 422, condition: "payment_method == CASH with settlement.payment_due_cents > CASH_PAYMENT_LIMIT_CENTS (1000000)" }

# =============================================================================
# 1.7 RBAC Matrix  (segregation-of-duties model)
# =============================================================================
roles:
  - name: TalentBuyer
    description: "Promoter-side buyer who books dates, writes offers, builds ticket inventory, prices, papers the house and pulls or reschedules shows."
    identity: "opaque"
    exclusive_operations:
      - "POST /artists"
      - "POST /venues"
      - "POST /shows"
      - "POST /offers"
      - "POST /offers/{offer_id}/submit"
      - "POST /offers/{offer_id}/withdraw"
      - "POST /shows/{show_id}/on-sale"
      - "POST /shows/{show_id}/resume-sales"
      - "POST /ticket-tiers"
      - "POST /ticket-tiers/{ticket_tier_id}/price-adjustments"
      - "POST /ticket-holds/{ticket_hold_id}/convert-to-comp"
      - "POST /cancellation-events/{cancellation_event_id}/reschedule"
    shared_operations:
      - "POST /shows/{show_id}/pause-sales (with RiskOfficer)"
      - "POST /shows/{show_id}/perform (with TourAccountant)"
      - "POST /ticket-tiers/{ticket_tier_id}/sales (with VenueOperator)"
      - "POST /ticket-holds (with ArtistRep, VenueOperator)"
      - "POST /ticket-holds/{ticket_hold_id}/release (with ArtistRep, VenueOperator)"
      - "POST /cancellation-events (with RiskOfficer)"
      - "every GET except GET /markets/{market_id}/portfolio-risk restrictions"
      - "POST /_clock/set_current_utc, POST /_ops/run"

  - name: ArtistRep
    description: "Artist-side representative. X-User-ID is the Artist's own id, so a rep may only act on shows booked for that artist."
    identity: "entity_backed:Artist"
    exclusive_operations:
      - "POST /offers/{offer_id}/counter"
      - "POST /offers/{offer_id}/accept"
      - "POST /settlements/{settlement_id}/artist-response"
    shared_operations:
      - "POST /ticket-holds (with TalentBuyer, VenueOperator — ARTIST_HOLD kind only)"
      - "POST /ticket-holds/{ticket_hold_id}/release (ARTIST_HOLD kind only)"
      - "GET /artists/{artist_id}, GET /shows, GET /shows/{show_id}, GET /offers, GET /offers/{offer_id}, GET /budget-lines, GET /ticket-tiers, GET /ticket-holds, GET /settlements, GET /cancellation-events"
      - "POST /_clock/set_current_utc"

  - name: VenueOperator
    description: "Venue-side operator. X-User-ID is the Venue's own id, so an operator may only act on shows at that venue."
    identity: "entity_backed:Venue"
    exclusive_operations: []
    shared_operations:
      - "POST /vendor-invoices (with TourAccountant)"
      - "POST /vendor-invoices/{vendor_invoice_id}/dispute (with TourAccountant)"
      - "POST /ticket-tiers/{ticket_tier_id}/sales (with TalentBuyer)"
      - "POST /ticket-holds (PRODUCTION_HOLD kind only)"
      - "POST /ticket-holds/{ticket_hold_id}/release (PRODUCTION_HOLD kind only)"
      - "GET /venues/{venue_id}, GET /venues, GET /shows, GET /shows/{show_id}, GET /budget-lines, GET /vendor-invoices, GET /ticket-tiers, GET /ticket-holds, GET /settlements, GET /cancellation-events"
      - "POST /_clock/set_current_utc"

  - name: TourAccountant
    description: "Promoter-side accountant who owns the budget, the invoice ledger and the settlement book. Cannot commit a guarantee and cannot reopen a settlement it calculated."
    identity: "opaque"
    exclusive_operations:
      - "POST /budget-lines"
      - "POST /vendor-invoices/{vendor_invoice_id}/verify"
      - "POST /vendor-invoices/{vendor_invoice_id}/dispute-resolution"
      - "POST /settlements"
      - "POST /settlements/{settlement_id}/calculate"
      - "POST /settlements/{settlement_id}/pay"
      - "POST /cancellation-events/{cancellation_event_id}/process-refunds"
    shared_operations:
      - "POST /shows/{show_id}/perform (with TalentBuyer)"
      - "POST /vendor-invoices (with VenueOperator)"
      - "POST /vendor-invoices/{vendor_invoice_id}/approve (with RiskOfficer)"
      - "POST /vendor-invoices/{vendor_invoice_id}/dispute (with VenueOperator)"
      - "POST /budget-lines/{budget_line_id}/variance-decision (with RiskOfficer; only lines whose required_approver_role is NONE or TOUR_ACCOUNTANT)"
      - "every GET"
      - "POST /_clock/set_current_utc, POST /_ops/run"

  - name: RiskOfficer
    description: "Portfolio risk owner. Sets market exposure ceilings and overrides, decides escalated variances, reopens settlements, and runs the insurance claim path. Cannot verify an invoice and cannot calculate or pay a settlement."
    identity: "opaque"
    exclusive_operations:
      - "POST /markets"
      - "POST /shows/{show_id}/exposure-override"
      - "POST /settlements/{settlement_id}/reopen"
      - "POST /cancellation-events/{cancellation_event_id}/file-claim"
      - "POST /cancellation-events/{cancellation_event_id}/settle-claim"
    shared_operations:
      - "POST /shows/{show_id}/pause-sales (with TalentBuyer)"
      - "POST /vendor-invoices/{vendor_invoice_id}/approve (with TourAccountant)"
      - "POST /budget-lines/{budget_line_id}/variance-decision (with TourAccountant; the ONLY role that may decide a RISK_OFFICER line)"
      - "POST /cancellation-events (with TalentBuyer)"
      - "every GET"
      - "POST /_clock/set_current_utc, POST /_ops/run"
