  # ===========================================================================
  - section: calculations
    instances:

      - name: promo_deferral_fee_matches_the_code_headline_rate
        claim_type: Constants Applied
        grounds:
          - calculations.promo_plan_tiering
          - entities.PromotionalPlan.fields.merchant_deferral_fee_cents
          - entities.PromotionalPlan.fields.installment_quarter_cents
        distinguishing_aspect: "The PROMO_12_6M constants bind exactly: on a 450000 principal the merchant deferral fee is 54000 (1200 bps) and the quarterly installment is 112500, both read from the calculation's constants block rather than from any request field."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ACTIVE, customer OPEN with an approved application, purchase ticketed at 450000."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - *c_store
            - *c_activate
            - &c_registry_t3
              call: "POST /credit-limit-registry-state"
              payload: { registry_key: "TX", credit_tier: "TIER_3", base_limit_cents: 2000000, min_down_payment_pct: 0.10, registry_type: "STATE", min_ticket_cents: 200000 }
              as: ChainAdmin
            - *c_reg_tx
            - *c_diamond
            - call: "POST /purchases"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", base_price_cents: 450000, diamond_id: "${diamond_id}" }
              as: SalesAssociate
              captures: { purchase_id: $.data.id, purchase_v: $.data.version }
            - call: "POST /credit-applications"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", requested_limit_cents: 1000000, requested_purchase_amount_cents: 450000, down_payment_cents: 45000 }
              as: SalesAssociate
              captures: { application_id: $.data.id }
            - call: "POST /credit-applications/${application_id}/decision"
              payload: { decision: "APPROVE_FULL" }
              as: CreditAnalyst
          trigger:
            - call: "POST /promotional-plans"
              payload: { customer_id: "${customer_id}", purchase_id: "${purchase_id}", plan_code: "PROMO_12_6M", expected_purchase_version: "${purchase_v}" }
              as: SalesAssociate
              captures: { plan_id: $.data.id }
          assert:
            - "PromotionalPlan.${plan_id}.principal_cents == 450000"
            - "PromotionalPlan.${plan_id}.merchant_deferral_fee_cents == 54000"
            - "PromotionalPlan.${plan_id}.installment_quarter_cents == 112500 and installment_amount_cents == 112500"
            - "PromotionalPlan.${plan_id}.deferred_months == 6 and simplicity_months == 12 and promotional_apr_pct == 26.99"
            - "PromotionalPlan.${plan_id}.deferred_interest_accrued_cents == 0 at creation and plan_status == ACCRUING"

      - name: cash_lines_are_excluded_before_the_statement_rollup_runs
        claim_type: Input Set Filtering
        grounds:
          - calculations.statement_balance_rollup
          - entities.BillingStatement.fields.statement_balance_cents
        distinguishing_aspect: "The input set filter is load-bearing: the same line list with the second line marked PAID yields 257500 rather than 525300, proving non-BILLABLE lines are dropped before either variant runs."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A customer on file."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - *c_store
            - *c_activate
          trigger:
            - call: "POST /billing-statements"
              payload: { customer_id: "${customer_id}", statement_period: "2026-09", lines: [{ amount_cents: 250000, billable_pct: 1.0, line_status: "BILLABLE" }, { amount_cents: 260000, billable_pct: 1.0, line_status: "PAID" }] }
              as: CustomerService
              captures: { statement_id: $.data.id }
          assert:
            - "BillingStatement.${statement_id}.statement_balance_cents == 257500, using only the single 250000 BILLABLE line at the 0.02 tier"
            - "including the PAID line would have produced 525300, so the exclusion is observable"
            - "BillingStatement.${statement_id}.statement_status == OPEN"

      - name: deferred_interest_accrual_is_rounded_to_whole_cents
        claim_type: Precision
        grounds:
          - calculations.promo_interest_accrual
          - entities.PromotionalPlan.fields.deferred_interest_accrued_cents
        distinguishing_aspect: "The accrual uses round_half_up to whole cents at 365 days per year: 450000 at 26.99 percent over 120 days is exactly 39930 cents, so a fractional-cent implementation would report 39929 or 39931."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Purchase ticketed at 450000 financed by a PROMO_12_6M plan created on 2026-09-01."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - *c_store
            - *c_activate
            - *c_registry_t3
            - *c_reg_tx
            - *c_diamond
            - call: "POST /purchases"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", base_price_cents: 450000, diamond_id: "${diamond_id}" }
              as: SalesAssociate
              captures: { purchase_id: $.data.id, purchase_v: $.data.version }
            - call: "POST /credit-applications"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", requested_limit_cents: 1000000, requested_purchase_amount_cents: 450000, down_payment_cents: 45000 }
              as: SalesAssociate
              captures: { application_id: $.data.id }
            - call: "POST /credit-applications/${application_id}/decision"
              payload: { decision: "APPROVE_FULL" }
              as: CreditAnalyst
            - call: "POST /promotional-plans"
              payload: { customer_id: "${customer_id}", purchase_id: "${purchase_id}", plan_code: "PROMO_12_6M", expected_purchase_version: "${purchase_v}" }
              as: SalesAssociate
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-30T00:00:00Z" }
              as: ChainAdmin
          trigger:
            - call: "GET /promotional-plans/${plan_id}"
              payload: {}
              as: CustomerService
          assert:
            - "PromotionalPlan.${plan_id}.deferred_interest_accrued_cents == 39930 exactly, at 120 elapsed days"
            - "PromotionalPlan.${plan_id}.final_settlement_amount_cents == 489930"
            - "a ceiling or truncation implementation would report 39929 or 39931, so round_half_up is observable"

      - name: capitalization_transfers_the_accrual_into_principal_at_the_window_edge
        claim_type: Variant Selection
        grounds:
          - calculations.promo_interest_accrual
          - state_machines.PromotionalPlan.ACCRUING_to_CAPITALIZED
          - entities.PromotionalPlan.fields.final_settlement_amount_cents
        distinguishing_aspect: "The correct variant is selected by the clock: at the 12-month simplicity edge the plan is still ACCRUING and settles at 488196, while one instant past it the sweep selects CAPITALIZED and the accrual is folded into principal with merchant_deferral_fee_cents zeroed."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Purchase at 450000 financed by a PROMO_12_6M plan, then the clock moved to 2027-09-01, the exact 365-day simplicity edge."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - *c_store
            - *c_activate
            - *c_registry_t3
            - *c_reg_tx
            - *c_diamond
            - call: "POST /purchases"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", base_price_cents: 450000, diamond_id: "${diamond_id}" }
              as: SalesAssociate
              captures: { purchase_id: $.data.id, purchase_v: $.data.version }
            - call: "POST /credit-applications"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", requested_limit_cents: 1000000, requested_purchase_amount_cents: 450000, down_payment_cents: 45000 }
              as: SalesAssociate
              captures: { application_id: $.data.id }
            - call: "POST /credit-applications/${application_id}/decision"
              payload: { decision: "APPROVE_FULL" }
              as: CreditAnalyst
            - call: "POST /promotional-plans"
              payload: { customer_id: "${customer_id}", purchase_id: "${purchase_id}", plan_code: "PROMO_12_6M", expected_purchase_version: "${purchase_v}" }
              as: SalesAssociate
              captures: { plan_id: $.data.id, plan_v: $.data.version }
          trigger:
            - call: "GET /promotional-plans/${plan_id}"
              payload: {}
              as: CustomerService
              captures: { at_edge_v: $.data.version }
          assert:
            - "at the exact simplicity edge PromotionalPlan.${plan_id}.plan_status is still ACCRUING, so the window is closed at its right edge rather than open"
            - "at that instant deferred_interest_accrued_cents == 450000 * 26.99/100 * 365/365 == 121455"
            - "final_settlement_amount_cents == 571455 at the edge and merchant_deferral_fee_cents is still 54000"
            - "GET /promotional-plans/${plan_id} returns version ${at_edge_v} with no capitalization side effect yet"

      - name: ledger_projection_recomputes_after_each_appended_entry
        claim_type: Reconciliation
        grounds:
          - calculations.payoff_ledger_projection
          - entities.PayoffLedgerEntry.fields.projected_total_cents
          - endpoints.POST_/payoff-ledger-entries
        distinguishing_aspect: "After each ledger append the projection reconciles to the running balance: it reads 475220 after one 40000 installment and 435220 after a second, so the derived projection never lags the entries it summarises."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Purchase at 450000 financed by a PROMO_12_6M plan, clock then advanced to 2026-12-30 so the accrual is 39930."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - *c_store
            - *c_activate
            - *c_registry_t3
            - *c_reg_tx
            - *c_diamond
            - call: "POST /purchases"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", base_price_cents: 450000, diamond_id: "${diamond_id}" }
              as: SalesAssociate
              captures: { purchase_id: $.data.id, purchase_v: $.data.version }
            - call: "POST /credit-applications"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", requested_limit_cents: 1000000, requested_purchase_amount_cents: 450000, down_payment_cents: 45000 }
              as: SalesAssociate
              captures: { application_id: $.data.id }
            - call: "POST /credit-applications/${application_id}/decision"
              payload: { decision: "APPROVE_FULL" }
              as: CreditAnalyst
            - call: "POST /promotional-plans"
              payload: { customer_id: "${customer_id}", purchase_id: "${purchase_id}", plan_code: "PROMO_12_6M", expected_purchase_version: "${purchase_v}" }
              as: SalesAssociate
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-30T00:00:00Z" }
              as: ChainAdmin
          trigger:
            - call: "POST /payoff-ledger-entries"
              payload: { plan_id: "${plan_id}", entry_kind: "INSTALLMENT", direction: "DECREASE", amount_cents: 40000, adjustment_cents: -40000, reference_bucket: "PROMOTIONAL", expected_plan_version: "${plan_v}" }
              as: CustomerService
              captures: { entry_one_id: $.data.id, plan_v2: $.data.version }
            - call: "POST /payoff-ledger-entries"
              payload: { plan_id: "${plan_id}", entry_kind: "INSTALLMENT", direction: "DECREASE", amount_cents: 40000, adjustment_cents: -40000, reference_bucket: "PROMOTIONAL", expected_plan_version: "${plan_v2}" }
              as: CustomerService
              captures: { entry_two_id: $.data.id }
          assert:
            - "the first entry reports PayoffLedgerEntry.${entry_one_id}.projected_total_cents == 489930 - 40000 == 449930"
            - "the second entry reports PayoffLedgerEntry.${entry_two_id}.projected_total_cents == 409930"
            - "PayoffLedgerEntry.${entry_two_id}.entry_sequence == 2, one past the first entry"
            - "GET /promotional-plans/${plan_id}/payoff-ledger-entries returns exactly 2 rows in entry order"
            - "PromotionalPlan.${plan_id}.total_paid_cents == 80000 after the two installments"
  # ===========================================================================
  - section: validations
    instances:

      - name: duplicate_customer_email_returns_duplicate_email
        claim_type: Violation → Error
        grounds:
          - errors.ERR_DUPLICATE_EMAIL
          - entities.Customer.fields.email
        distinguishing_aspect: "The uniqueness constraint on Customer.email fires on the second create with ERR_DUPLICATE_EMAIL and leaves exactly one customer row, while the same payload with a fresh email succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One customer already on file."
          setup_api_calls:
            - *c_clock
            - *c_cust_ivan
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Ivan P Duplicate", email: "ivan.petrov@example.com", state_code: "NV" }
              as: SalesAssociate
              captures: { error_id: $.data.error_id }
            - call: "POST /customers"
              payload: { full_name: "Ivan P Fresh", email: "ivan.fresh@example.com", state_code: "NV" }
              as: SalesAssociate
              captures: { fresh_id: $.data.id }
          assert:
            - "the duplicate request returns 409 with error_id == ERR_DUPLICATE_EMAIL"
            - "GET /customers returns exactly 2 rows in total, so the duplicate was not persisted"
            - "Customer.${fresh_id}.email == \"ivan.fresh@example.com\""

      - name: belonging_check_passes_for_the_owning_customer
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=12]
          - endpoints.POST_/credit-applications/{id}/accept
        distinguishing_aspect: "The ownership rule at priority 12 is satisfied when X-User-ID matches the application's customer_id, so accepting a countered offer succeeds for the owner and the account opens."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ACTIVE, customer on file, one countered application."
          setup_api_calls:
            - *c_clock
