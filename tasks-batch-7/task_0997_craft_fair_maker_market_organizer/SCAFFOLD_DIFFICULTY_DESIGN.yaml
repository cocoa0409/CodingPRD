# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN — Craft-Fair & Maker-Market Organizer
# §1.8 Test Targeting Index — 9 rules × 2 instances = 18 difficulty probes
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: booth_fee_provisional_vs_final_diverge
        grounds:
          - calculations.booth_fee_quote
          - calculations.booth_fee_final
          - state_machines.BoothAssignment.PENDING_PAYMENT_to_ACTIVE
        distinguishing_aspect: |
          Entity domain = BoothAssignment/BoothFeeCharge. Same inputs (base=12333,
          tier=CORNER, category=FOOD) produce provisional=16649 cents (per-line
          rounding) but final=16650 cents (sum-then-round); the 1-cent gap is
          the distinguishing observable.
        test_recipe:
          setup:
            - "MakerEvent in SCHEDULING with one FOOD zone and one CORNER booth priced 12333 cents"
            - "One application APPROVED with requested_tier=CORNER, requested_category=FOOD"
            - "BoothAssignment in PENDING_PAYMENT with PROVISIONAL charge row already minted"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maker-events"
              payload:
                name: "Spring Fair"
                opens_at: "2026-06-01T09:00:00Z"
                closes_at: "2026-06-01T18:00:00Z"
                venue_capacity: 100
                application_window_start: "2026-05-01T00:00:00Z"
                application_window_end: "2026-05-10T00:00:00Z"
                jury_quorum: 2
                commission_pct_standard: 0.10
                commission_pct_anchor: 0.05
              as: EventCoordinator
              captures: { ev_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /maker-events/${ev_id}/booth-zones"
              payload: { label: "Food Court", weather_exposure: "COVERED", category: "FOOD", category_cap: 5 }
              as: EventCoordinator
              captures: { zone_id: $.data.id }
            - call: "POST /maker-events/${ev_id}/booth-zones/${zone_id}/booths"
              payload: { code: "FC-01", tier: "CORNER", footprint_sqm: 12, price_cents: 12333 }
              as: EventCoordinator
              captures: { booth_id: $.data.id }
            - call: "POST /vendor-profiles"
              payload: { display_name: "Vendor A", contact_email: "a@x.com", home_region: "WA" }
              as: PlatformAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /maker-events/${ev_id}/open-applications"
              payload: {}
              as: EventCoordinator
            - call: "POST /maker-events/${ev_id}/applications"
              payload: { vendor_profile_id: "${vendor_id}", requested_category: "FOOD", requested_tier: "CORNER" }
              as: Vendor
              as_user_id: "${vendor_id}"
              captures: { app_id: $.data.id }
            - call: "POST /maker-events/${ev_id}/applications/${app_id}/submit"
              payload: {}
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maker-events/${ev_id}/close-applications"
              payload: {}
              as: EventCoordinator
            - call: "POST /maker-events/${ev_id}/applications/${app_id}/jury-scores"
              payload: { craftsmanship: 9, originality: 8, booth_presentation: 8 }
              as: Juror
              as_user_id: "juror-1"
            - call: "POST /maker-events/${ev_id}/applications/${app_id}/jury-scores"
              payload: { craftsmanship: 8, originality: 8, booth_presentation: 8 }
              as: Juror
              as_user_id: "juror-2"
            - call: "GET /maker-events/${ev_id}"
              payload: {}
              as: EventCoordinator
              captures: { ev_v_pre_decide: $.data.version }
            - call: "POST /maker-events/${ev_id}/applications/${app_id}/decide"
              payload: { outcome: "APPROVE", expected_event_version: "${ev_v_pre_decide}" }
              as: EventCoordinator
            - call: "POST /maker-events/${ev_id}/begin-scheduling"
              payload: {}
              as: EventCoordinator
            - call: "GET /maker-events/${ev_id}/assignments"
              payload: { vendor_application_id: "${app_id}" }
              as: EventCoordinator
              captures: { assignment_id: "$.data[0].id" }
            - call: "GET /maker-events/${ev_id}/assignments/${assignment_id}/charges"
              payload: {}
              as: EventCoordinator
              captures: { provisional_cents: "$.data[0].amount_cents" }
          trigger:
            - call: "POST /maker-events/${ev_id}/assignments/${assignment_id}/pay"
              payload: {}
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "GET /maker-events/${ev_id}/assignments/${assignment_id}/charges"
              payload: {}
              as: EventCoordinator
              captures: { final_row_kind: "$.data[1].charge_kind", final_row_cents: "$.data[1].amount_cents" }
          assert:
            - "BoothFeeCharge[0].charge_kind == 'PROVISIONAL'"
            - "BoothFeeCharge[0].amount_cents == 16649"
            - "BoothFeeCharge[1].charge_kind == 'FINAL'"
            - "BoothFeeCharge[1].amount_cents == 16650"
            - "BoothAssignment.${assignment_id}.status == 'ACTIVE'"

      - name: commission_provisional_vs_final_diverge
        grounds:
          - calculations.commission_quote
          - calculations.commission_final
          - state_machines.Settlement.APPROVED_to_PAID
        distinguishing_aspect: |
          Entity domain = Settlement/SalesLedgerEntry. With 11 rows of 10,001
          cents each (cumulative gross 110,011), commission_quote (chronological
          per-row rounding, tier-straddle on the row that crosses 100,000)
          yields 11,200 cents, while commission_final (aggregate-then-tier)
          yields 11,201 cents; the 1-cent divergence is on a different domain
          than booth_fee_quote/booth_fee_final.
        test_recipe:
          setup:
            - "MakerEvent progressed through to SETTLEMENT posture"
            - "One ACTIVE BoothAssignment on a STANDARD booth (so commission_pct_standard applies)"
            - "11 SalesLedgerEntry rows of 10,001 cents each posted during LIVE"
            - "Settlement for the assignment in PENDING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maker-events"
              payload:
                name: "Summer Fair"
                opens_at: "2026-06-01T09:00:00Z"
                closes_at: "2026-06-01T18:00:00Z"
                venue_capacity: 100
                application_window_start: "2026-05-01T00:00:00Z"
                application_window_end: "2026-05-10T00:00:00Z"
                jury_quorum: 2
                commission_pct_standard: 0.10
                commission_pct_anchor: 0.05
              as: EventCoordinator
              captures: { ev_id: $.data.id }
            - call: "POST /maker-events/${ev_id}/booth-zones"
              payload: { label: "North", weather_exposure: "INDOOR", category: "CERAMICS", category_cap: 3 }
              as: EventCoordinator
              captures: { zone_id: $.data.id }
            - call: "POST /maker-events/${ev_id}/booth-zones/${zone_id}/booths"
              payload: { code: "N-01", tier: "STANDARD", footprint_sqm: 9, price_cents: 5000 }
              as: EventCoordinator
            - call: "POST /vendor-profiles"
              payload: { display_name: "Vendor B", contact_email: "b@x.com", home_region: "OR" }
              as: PlatformAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /maker-events/${ev_id}/open-applications"
              payload: {}
              as: EventCoordinator
            - call: "POST /maker-events/${ev_id}/applications"
              payload: { vendor_profile_id: "${vendor_id}", requested_category: "CERAMICS", requested_tier: "STANDARD" }
              as: Vendor
              as_user_id: "${vendor_id}"
              captures: { app_id: $.data.id }
            - call: "POST /maker-events/${ev_id}/applications/${app_id}/submit"
              payload: {}
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maker-events/${ev_id}/close-applications"
              payload: {}
              as: EventCoordinator
            - call: "POST /maker-events/${ev_id}/applications/${app_id}/jury-scores"
              payload: { craftsmanship: 8, originality: 8, booth_presentation: 8 }
              as: Juror
              as_user_id: "juror-1"
            - call: "POST /maker-events/${ev_id}/applications/${app_id}/jury-scores"
              payload: { craftsmanship: 8, originality: 8, booth_presentation: 8 }
              as: Juror
              as_user_id: "juror-2"
            - call: "GET /maker-events/${ev_id}"
              payload: {}
              as: EventCoordinator
              captures: { ev_v_pre: $.data.version }
            - call: "POST /maker-events/${ev_id}/applications/${app_id}/decide"
              payload: { outcome: "APPROVE", expected_event_version: "${ev_v_pre}" }
              as: EventCoordinator
            - call: "POST /maker-events/${ev_id}/begin-scheduling"
              payload: {}
              as: EventCoordinator
            - call: "GET /maker-events/${ev_id}/assignments"
              payload: { vendor_application_id: "${app_id}" }
              as: EventCoordinator
              captures: { assignment_id: "$.data[0].id" }
            - call: "POST /maker-events/${ev_id}/assignments/${assignment_id}/pay"
              payload: {}
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /maker-events/${ev_id}/go-live"
              payload: {}
              as: EventCoordinator
            - call: "POST /maker-events/${ev_id}/sales-ledger"
              payload: { booth_assignment_id: "${assignment_id}", gross_cents: 10001 }
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /maker-events/${ev_id}/sales-ledger"
              payload: { booth_assignment_id: "${assignment_id}", gross_cents: 10001 }
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /maker-events/${ev_id}/sales-ledger"
              payload: { booth_assignment_id: "${assignment_id}", gross_cents: 10001 }
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /maker-events/${ev_id}/sales-ledger"
              payload: { booth_assignment_id: "${assignment_id}", gross_cents: 10001 }
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /maker-events/${ev_id}/sales-ledger"
              payload: { booth_assignment_id: "${assignment_id}", gross_cents: 10001 }
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /maker-events/${ev_id}/sales-ledger"
              payload: { booth_assignment_id: "${assignment_id}", gross_cents: 10001 }
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /maker-events/${ev_id}/sales-ledger"
              payload: { booth_assignment_id: "${assignment_id}", gross_cents: 10001 }
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /maker-events/${ev_id}/sales-ledger"
              payload: { booth_assignment_id: "${assignment_id}", gross_cents: 10001 }
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /maker-events/${ev_id}/sales-ledger"
              payload: { booth_assignment_id: "${assignment_id}", gross_cents: 10001 }
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /maker-events/${ev_id}/sales-ledger"
              payload: { booth_assignment_id: "${assignment_id}", gross_cents: 10001 }
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /maker-events/${ev_id}/sales-ledger"
              payload: { booth_assignment_id: "${assignment_id}", gross_cents: 10001 }
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maker-events/${ev_id}/end-event"
              payload: {}
              as: EventCoordinator
            - call: "GET /maker-events/${ev_id}/settlements"
              payload: { booth_assignment_id: "${assignment_id}" }
              as: Treasurer
              captures: { settlement_id: "$.data[0].id", st_v0: "$.data[0].version" }
            - call: "POST /maker-events/${ev_id}/settlements/${settlement_id}/compute"
              payload: {}
              as: Treasurer
              captures: { commission_at_computed: "$.data.commission_cents", st_v_computed: "$.data.version" }
            - call: "POST /maker-events/${ev_id}/settlements/${settlement_id}/approve"
              payload: { expected_settlement_version: "${st_v_computed}" }
              as: Treasurer
              as_user_id: "treasurer-1"
          trigger:
            - call: "POST /maker-events/${ev_id}/settlements/${settlement_id}/mark-paid"
              payload: {}
              as: Treasurer
            - call: "GET /maker-events/${ev_id}/settlements/${settlement_id}"
              payload: {}
              as: Treasurer
              captures: { commission_at_paid: "$.data.commission_cents" }
          assert:
            - "Settlement.${settlement_id}.gross_sales_cents == 110011"
            - "commission_cents at COMPUTED == 11200"
            - "commission_cents at PAID == 11201"
            - "Settlement.${settlement_id}.status == 'PAID'"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: waitlist_rank_combinatorial_scoring
        grounds:
          - calculations.waitlist_rank
          - state_machines.MakerEvent.JURY_REVIEW_to_SCHEDULING
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs and non-linear interaction. Three
          WAITLISTED applications in CERAMICS with (jury_score_total,
          created_at) pairs (25, later), (25, earlier), (20, earliest) must
          rank 2, 1, 3 respectively — the sort key has a tie on score that
          must be broken by created_at ASC; reversing either input changes
          the rank assignment.
        test_recipe:
          setup:
            - "MakerEvent in JURY_REVIEW with jury_quorum=2"
            - "Three applications in CERAMICS: A_slow (score 25, submitted second), A_fast (score 25, submitted first), A_low (score 20)"
            - "All three have 2 juror scores; coordinator WAITLISTs all three"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maker-events"
              payload:
                name: "Fall Fair"
                opens_at: "2026-06-01T09:00:00Z"
                closes_at: "2026-06-01T18:00:00Z"
                venue_capacity: 100
                application_window_start: "2026-05-01T00:00:00Z"
                application_window_end: "2026-05-10T00:00:00Z"
                jury_quorum: 2
                commission_pct_standard: 0.10
                commission_pct_anchor: 0.05
              as: EventCoordinator
              captures: { ev_id: $.data.id }
            - call: "POST /maker-events/${ev_id}/booth-zones"
              payload: { label: "Hall", weather_exposure: "INDOOR", category: "CERAMICS", category_cap: 1 }
              as: EventCoordinator
              captures: { zone_id: $.data.id }
            - call: "POST /maker-events/${ev_id}/booth-zones/${zone_id}/booths"
              payload: { code: "H-01", tier: "STANDARD", footprint_sqm: 9, price_cents: 5000 }
              as: EventCoordinator
            - call: "POST /vendor-profiles"
              payload: { display_name: "Vendor Fast", contact_email: "fast@x.com", home_region: "WA" }
              as: PlatformAdmin
              captures: { v_fast: $.data.id }
            - call: "POST /vendor-profiles"
              payload: { display_name: "Vendor Slow", contact_email: "slow@x.com", home_region: "WA" }
              as: PlatformAdmin
              captures: { v_slow: $.data.id }
            - call: "POST /vendor-profiles"
              payload: { display_name: "Vendor Low", contact_email: "low@x.com", home_region: "WA" }
              as: PlatformAdmin
              captures: { v_low: $.data.id }
            - call: "POST /maker-events/${ev_id}/open-applications"
              payload: {}
              as: EventCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maker-events/${ev_id}/applications"
              payload: { vendor_profile_id: "${v_fast}", requested_category: "CERAMICS", requested_tier: "STANDARD" }
              as: Vendor
              as_user_id: "${v_fast}"
              captures: { app_fast: $.data.id }
            - call: "POST /maker-events/${ev_id}/applications/${app_fast}/submit"
              payload: {}
              as: Vendor
              as_user_id: "${v_fast}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maker-events/${ev_id}/applications"
              payload: { vendor_profile_id: "${v_slow}", requested_category: "CERAMICS", requested_tier: "STANDARD" }
              as: Vendor
              as_user_id: "${v_slow}"
              captures: { app_slow: $.data.id }
            - call: "POST /maker-events/${ev_id}/applications/${app_slow}/submit"
              payload: {}
              as: Vendor
              as_user_id: "${v_slow}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maker-events/${ev_id}/applications"
              payload: { vendor_profile_id: "${v_low}", requested_category: "CERAMICS", requested_tier: "STANDARD" }
              as: Vendor
              as_user_id: "${v_low}"
              captures: { app_low: $.data.id }
            - call: "POST /maker-events/${ev_id}/applications/${app_low}/submit"
              payload: {}
              as: Vendor
              as_user_id: "${v_low}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maker-events/${ev_id}/close-applications"
              payload: {}
              as: EventCoordinator
            - call: "POST /maker-events/${ev_id}/applications/${app_fast}/jury-scores"
              payload: { craftsmanship: 9, originality: 8, booth_presentation: 8 }
              as: Juror
              as_user_id: "juror-1"
            - call: "POST /maker-events/${ev_id}/applications/${app_fast}/jury-scores"
              payload: { craftsmanship: 8, originality: 8, booth_presentation: 9 }
              as: Juror
              as_user_id: "juror-2"
            - call: "POST /maker-events/${ev_id}/applications/${app_slow}/jury-scores"
              payload: { craftsmanship: 9, originality: 8, booth_presentation: 8 }
              as: Juror
              as_user_id: "juror-1"
            - call: "POST /maker-events/${ev_id}/applications/${app_slow}/jury-scores"
              payload: { craftsmanship: 8, originality: 8, booth_presentation: 9 }
              as: Juror
              as_user_id: "juror-2"
            - call: "POST /maker-events/${ev_id}/applications/${app_low}/jury-scores"
              payload: { craftsmanship: 7, originality: 7, booth_presentation: 6 }
              as: Juror
              as_user_id: "juror-1"
            - call: "POST /maker-events/${ev_id}/applications/${app_low}/jury-scores"
              payload: { craftsmanship: 7, originality: 6, booth_presentation: 7 }
              as: Juror
              as_user_id: "juror-2"
            - call: "GET /maker-events/${ev_id}"
              payload: {}
              as: EventCoordinator
              captures: { ev_v1: $.data.version }
            - call: "POST /maker-events/${ev_id}/applications/${app_fast}/decide"
              payload: { outcome: "WAITLIST", expected_event_version: "${ev_v1}" }
              as: EventCoordinator
            - call: "GET /maker-events/${ev_id}"
              payload: {}
              as: EventCoordinator
              captures: { ev_v2: $.data.version }
            - call: "POST /maker-events/${ev_id}/applications/${app_slow}/decide"
              payload: { outcome: "WAITLIST", expected_event_version: "${ev_v2}" }
              as: EventCoordinator
            - call: "GET /maker-events/${ev_id}"
              payload: {}
              as: EventCoordinator
              captures: { ev_v3: $.data.version }
            - call: "POST /maker-events/${ev_id}/applications/${app_low}/decide"
              payload: { outcome: "WAITLIST", expected_event_version: "${ev_v3}" }
              as: EventCoordinator
          trigger:
            - call: "POST /maker-events/${ev_id}/begin-scheduling"
              payload: {}
              as: EventCoordinator
            - call: "GET /maker-events/${ev_id}/applications/${app_fast}"
              payload: {}
              as: EventCoordinator
              captures: { rank_fast: "$.data.waitlist_rank" }
            - call: "GET /maker-events/${ev_id}/applications/${app_slow}"
              payload: {}
              as: EventCoordinator
              captures: { rank_slow: "$.data.waitlist_rank" }
            - call: "GET /maker-events/${ev_id}/applications/${app_low}"
              payload: {}
              as: EventCoordinator
              captures: { rank_low: "$.data.waitlist_rank" }
          assert:
            - "VendorApplication.${app_fast}.jury_score_total == 50"
            - "VendorApplication.${app_slow}.jury_score_total == 50"
            - "VendorApplication.${app_low}.jury_score_total == 40"
            - "VendorApplication.${app_fast}.waitlist_rank == 1"
            - "VendorApplication.${app_slow}.waitlist_rank == 2"
            - "VendorApplication.${app_low}.waitlist_rank == 3"

      - name: booth_fee_rounding_order_pinned
        grounds:
          - calculations.booth_fee_quote
          - calculations.booth_fee_final
          - calculations.booth_fee_rounding_order
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. With base=12333,
          tier=CORNER (mult 1.25), category=FOOD (uplift 0.10), per-line-
          then-sum yields 16649 while sum-then-round yields 16650; the
          scaffold pins the provisional to per-line order and the final to
          sum-then-round order so the two computations MUST differ by 1 cent.
        test_recipe:
          setup:
            - "Same setup as booth_fee_provisional_vs_final_diverge but reaching only the PROVISIONAL quote stage (no /pay yet)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maker-events"
              payload:
                name: "Rounding Fair"
                opens_at: "2026-06-01T09:00:00Z"
                closes_at: "2026-06-01T18:00:00Z"
                venue_capacity: 100
                application_window_start: "2026-05-01T00:00:00Z"
                application_window_end: "2026-05-10T00:00:00Z"
                jury_quorum: 2
                commission_pct_standard: 0.10
                commission_pct_anchor: 0.05
              as: EventCoordinator
              captures: { ev_id: $.data.id }
            - call: "POST /maker-events/${ev_id}/booth-zones"
              payload: { label: "Food Court", weather_exposure: "COVERED", category: "FOOD", category_cap: 5 }
              as: EventCoordinator
              captures: { zone_id: $.data.id }
            - call: "POST /maker-events/${ev_id}/booth-zones/${zone_id}/booths"
              payload: { code: "FC-01", tier: "CORNER", footprint_sqm: 12, price_cents: 12333 }
              as: EventCoordinator
            - call: "POST /vendor-profiles"
              payload: { display_name: "Vendor C", contact_email: "c@x.com", home_region: "WA" }
