            - call: "POST /recommerce/trade-ins"
              payload: { customer_id: "${cust_id}", store_location_id: "${store_id}", channel: "MAIL_IN", product_category: "OUTERWEAR", declared_grade: "B", msrp_minor: 50000, item_mass_grams: 1400 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_id: "$.data.id", ti_status: "$.data.status" }
          trigger:
            - call: "POST /recommerce/trade-ins/${ti_id}/receive"
              payload: {}
              as: Authenticator
              as_user_id: "auth-001"
              captures: { e_recv_auth: "$.data.error_id" }
            - call: "POST /recommerce/trade-ins/${ti_id}/receive"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { e_recv_admin: "$.data.error_id" }
            - call: "GET /recommerce/trade-ins/${ti_id}"
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { still_submitted: "$.data.status", still_recv_at: "$.data.received_at" }
            - call: "POST /recommerce/trade-ins/${ti_id}/receive"
              payload: {}
              as: IntakeAgent
              as_user_id: "intake-001"
              captures: { recv_status: "$.data.status", recv_at: "$.data.received_at" }
            - call: "POST /recommerce/trade-ins/${ti_id}/authenticate"
              payload: { authenticity_result: "GENUINE", assessed_grade: "B" }
              as: IntakeAgent
              as_user_id: "intake-001"
              captures: { e_auth_intake: "$.data.error_id" }
            - call: "POST /recommerce/trade-ins/${ti_id}/authenticate"
              payload: { authenticity_result: "GENUINE", assessed_grade: "B" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { e_auth_admin: "$.data.error_id" }
            - call: "POST /recommerce/trade-ins/${ti_id}/authenticate"
              payload: { authenticity_result: "GENUINE", assessed_grade: "B" }
              as: Authenticator
              as_user_id: "auth-001"
              captures: { auth_status: "$.data.status", auth_grade: "$.data.assessed_grade", auth_by: "$.data.graded_by_user_id" }
          assert:
            - "${ti_status} == SUBMITTED after creation"
            - "${e_recv_auth} == ERR_ROLE_NOT_PERMITTED with HTTP 403 and ${e_recv_admin} == ERR_ROLE_NOT_PERMITTED with HTTP 403"
            - "${still_submitted} == SUBMITTED and ${still_recv_at} == null — neither refusal moved the trade-in"
            - "the IntakeAgent call returns 200 with ${recv_status} == RECEIVED and ${recv_at} == 2026-08-01T00:00:00Z"
            - "${e_auth_intake} == ERR_ROLE_NOT_PERMITTED and ${e_auth_admin} == ERR_ROLE_NOT_PERMITTED, both HTTP 403"
            - "the Authenticator call returns 200 with ${auth_status} == AUTHENTICATED, ${auth_grade} == B and ${auth_by} == auth-001"

