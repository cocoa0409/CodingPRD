          - errors[ERR_DUPLICATE_SKU]
          - endpoints[POST /fulfillment/sku-listings]
        distinguishing_aspect: "Seller A cannot register SKU-ALPHA twice (409 ERR_DUPLICATE_SKU) but seller B registers the same SKU string successfully — uniqueness is on the (seller_account_id, sku) pair, not on sku alone."
        test_recipe:
