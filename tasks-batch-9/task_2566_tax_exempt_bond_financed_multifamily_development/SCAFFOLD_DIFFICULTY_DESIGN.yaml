# ===========================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2566 - Tax-Exempt Bond Financed Multifamily Development
#
# Every instance grounds only in elements declared in SCAFFOLD.yaml §1.1-§1.7.
# Every numeric assertion below was computed by executing the corresponding
# §1.3 formula against the pinned setup inputs.
#
# Canonical fixture reused by most chains (all money in integer cents):
#   Developer "Harborview Partners"; CapPool 2026 base 500,000,000 +
#   carryforward 100,000,000 = total 600,000,000; Project "Harborview Commons"
#   with total_units 10, total_floor_space_sqft 8500, land 40,000,000,
#   depreciable 360,000,000 -> aggregate_basis 400,000,000, election MIN_40_60;
#   units 101-104 RESTRICTED at 700/800/900/950 sqft (3350 sqft, ami 60) and
#   units 201-206 MARKET at 860/860/860/860/860/850 sqft; agreement recorded
#   15/30 years; cap award 200,000,000 expiring 2027-06-30; bond sized from
#   eligible 190,000,000 + capitalized interest 6,000,000 -> allowance
#   3,920,000, par exactly 200,000,000, negative-arbitrage allowance 4,000,000.
#   Logical clock starts at its declared default 2026-08-01T00:00:00Z.
# ===========================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: fifty_percent_test_provisional_passes_then_final_variant_revokes_the_credit
        grounds:
          - calculations.fifty_percent_aggregate_basis_test
          - entities.Project.fields.provisional_fifty_percent_ratio_bps
          - entities.Project.fields.final_fifty_percent_ratio_bps
          - entities.Project.fields.automatic_credit_triggered
          - state_machines.BondIssue.DRAFT_to_ISSUED
          - state_machines.CostCertification.SUBMITTED_to_ACCEPTED
          - validations[priority=89]
        distinguishing_aspect: |
          The PROVISIONAL_AT_ISSUANCE variant divides par (200,000,000) by the
          basis filed at project creation (400,000,000) and yields exactly 5000
          bps, while the FINAL_AT_COST_CERT variant divides FUNDED draw proceeds
          (200,000,000) by the certified aggregate basis (410,000,000) and
          yields 4878 bps; the same project therefore passes at issuance and
          fails at cost certification, and automatic_credit_triggered flips from
          true to false.
        test_recipe:
          setup:
            - "Canonical fixture through bond issuance: agreement recorded, cap awarded 200,000,000, bond par exactly 200,000,000, provisional test evaluated at issuance."
            - "Both construction draws funded so cumulative funded proceeds equal 200,000,000 and undrawn_cents is 0."
            - "A cost certification restating land at 45,000,000 and depreciable basis at 365,000,000, i.e. certified_aggregate_basis_cents 410,000,000 - 10,000,000 higher than the basis filed at project creation."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              captures: { dev_id: $.data.id }
            - call: "POST /cap-pools"
              payload: { program_year: 2026, base_cap_cents: 500000000, carryforward_cents: 100000000 }
              as: HfaAllocationOfficer
              captures: { pool_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Harborview Commons", total_units: 10, total_floor_space_sqft: 8500, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "101", bedroom_count: 2, floor_space_sqft: 700, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "102", bedroom_count: 2, floor_space_sqft: 800, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "103", bedroom_count: 2, floor_space_sqft: 900, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "104", bedroom_count: 2, floor_space_sqft: 950, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "201", bedroom_count: 1, floor_space_sqft: 860, designation: "MARKET", utility_allowance_cents: 10000, market_rent_cents: 180000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "202", bedroom_count: 1, floor_space_sqft: 860, designation: "MARKET", utility_allowance_cents: 10000, market_rent_cents: 180000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "203", bedroom_count: 1, floor_space_sqft: 860, designation: "MARKET", utility_allowance_cents: 10000, market_rent_cents: 180000 }
              as: Developer
