            - "PassThroughClaim.${c2}.status == \"REJECTED\", allowed_amount_usd == null, variance_usd == 4000.00"
            - "ScheduleCycle.${cyc}.passthrough_settlement_usd == 10815.00 — base 10500.00 with a 3.0% admin fee of 315.00"
            - "ScheduleCycle.${cyc}.estimated_passthrough_total_usd == 10000.00 — the REJECTED claim's 5000.00 estimate is dropped from the estimate ledger too"

