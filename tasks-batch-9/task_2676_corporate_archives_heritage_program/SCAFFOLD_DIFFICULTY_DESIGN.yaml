            - call: "POST /archival-items"
              payload: { accession_id: "${acc_id}", storage_zone_id: "${zone_id}", item_label: "EXH-CRATE-1", unit_count: 5, condition_grade: "GOOD", original_format: "PAPER", sensitivity_level: "PUBLIC" }
              as: Archivist
