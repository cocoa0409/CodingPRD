      - name: same_provider_in_both_referral_slots_is_self_referral
        claim_type: Priority Ordering
        grounds:
          - validations[priority=14]
          - validations[priority=15]
          - errors[ERR_SELF_REFERRAL]
        distinguishing_aspect: |
          Rung 14 sits above rung 15 precisely so this error id is reachable: no Provider row can be
          both a SLEEP_PHYSICIAN and a DENTIST, so naming one row in both slots is answered with
          ERR_SELF_REFERRAL rather than with the suitability error that would otherwise mask it.
        test_recipe:
          setup:
            - "A DIAGNOSTIC_VALID SEVERE study and a registered dentist."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "MedFirst", payer_kind: "MEDICAL", prior_auth_required: false }
