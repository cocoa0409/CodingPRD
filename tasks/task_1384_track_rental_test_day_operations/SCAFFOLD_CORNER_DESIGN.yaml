# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Track Rental & Test Day Operations
# =============================================================================
# Enumerates every testable claim in §1.1–§1.7 that §1.8 does not already
# cover. Each instance has a structured test_recipe replayable against §1.5.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: track_creation_returns_201_with_defaults
        claim_type: creation
        grounds:
          - entities.Track
          - endpoints."POST /tracks"

        distinguishing_aspect: "Successful create returns 201 with system-generated id, created_at, updated_at, version=1."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /tracks"
              payload: { name: "DefaultTest", noise_limit_db: 92, run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid_e1: $.data.id, ver: $.data.version }
          assert:
            - "HTTP status == 201"
            - "Track.version == 1"
            - "Track.id is a UUID"

      - name: track_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Track.fields.noise_limit_db
          - errors[ERR_INVALID_REQUEST]

        distinguishing_aspect: "POST /tracks without noise_limit_db returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /tracks"
              payload: { name: "X", run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { err_e2: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "http_status == 400"

      - name: coach_default_active_true
        claim_type: defaults
        grounds:
          - entities.Coach.fields.active

        distinguishing_aspect: "Omitting 'active' on coach create yields active=true by default."
        test_recipe:
          setup: ["One track"]
          setup_api_calls:
            - call: "POST /tracks"
              payload: { name: "D1", noise_limit_db: 90, run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid_d1: $.data.id }
          trigger:
            - call: "POST /tracks/${tid_d1}/coaches"
              payload: { full_name: "DefaultActive", cert_level: "BASIC" }
              as: TrackOps
              captures: { cid_d1: $.data.id, active_d1: $.data.active }
          assert:
            - "Coach.active == true"

      - name: coach_invalid_enum_cert_level_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Coach.fields.cert_level
          - errors[ERR_INVALID_REQUEST]

        distinguishing_aspect: "cert_level outside {BASIC, INTERMEDIATE, RACE} returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One track"]
          setup_api_calls:
            - call: "POST /tracks"
              payload: { name: "E1", noise_limit_db: 90, run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid_e3: $.data.id }
          trigger:
            - call: "POST /tracks/${tid_e3}/coaches"
              payload: { full_name: "BadCert", cert_level: "SUPER" }
              as: TrackOps
              captures: { err_e3: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: waiver_computed_expires_at_utc
        claim_type: computed_fields
        grounds:
          - entities.Waiver.fields.expires_at_utc

        distinguishing_aspect: "expires_at_utc = signed_at_utc + WAIVER_TTL_HOURS; input value ignored, server computes."
        test_recipe:
          setup: ["Track/TrackDay/RentalBlock/Booking/Driver chain complete"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TrackOps
            - call: "POST /tracks"
              payload: { name: "W1", noise_limit_db: 90, run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid_w1: $.data.id }
            - call: "POST /tracks/${tid_w1}/track-days"
              payload: { date: "2026-09-10" }
              as: TrackOps
              captures: { tdid_w1: $.data.id }
            - call: "POST /tracks/${tid_w1}/track-days/${tdid_w1}/open"
              payload: {}
              as: TrackOps
            - call: "POST /tracks/${tid_w1}/track-days/${tdid_w1}/rental-blocks"
              payload: { block_index: 0, start_minute: 480, end_minute: 540, max_group_size: 5 }
              as: TrackOps
              captures: { rbid_w1: $.data.id }
            - call: "POST /tracks/${tid_w1}/track-days/${tdid_w1}/rental-blocks/${rbid_w1}/bookings"
              payload: { organizer_user_id: "orgW", group_name: "GW", run_group_class: "ADVANCED", driver_count: 1, insurance_policy_ref: "PW" }
              as: Organizer
              as_user_id: orgW
              captures: { bid_w1: $.data.id }
            - call: "POST /tracks/${tid_w1}/track-days/${tdid_w1}/rental-blocks/${rbid_w1}/bookings/${bid_w1}/drivers"
              payload: { full_name: "W", license_class: "STREET" }
              as: Organizer
              as_user_id: orgW
              captures: { did_w1: $.data.id }
          trigger:
            - call: "POST /tracks/${tid_w1}/track-days/${tdid_w1}/rental-blocks/${rbid_w1}/bookings/${bid_w1}/drivers/${did_w1}/waiver"
              payload: { signed_at_utc: "2026-08-01T10:00:00Z", signature_payload_hash: "h" }
              as: Organizer
              as_user_id: orgW
              captures: { waiver_id: $.data.id, expires: $.data.expires_at_utc }
          assert:
            - "Waiver.expires_at_utc > signed_at_utc (server-computed offset)"
            - "Driver.waiver_status transitions to SIGNED"

      - name: safety_inspection_computed_result
        claim_type: computed_fields
        grounds:
          - entities.SafetyInspection.fields.result

        distinguishing_aspect: "result computed as PASSED iff helmet_ok AND harness_ok; client cannot inject result."
        test_recipe:
          setup: ["Booking+Driver setup"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TrackOps
            - call: "POST /tracks"
              payload: { name: "S1", noise_limit_db: 90, run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid_s1: $.data.id }
            - call: "POST /tracks/${tid_s1}/track-days"
              payload: { date: "2026-09-11" }
              as: TrackOps
              captures: { tdid_s1: $.data.id }
            - call: "POST /tracks/${tid_s1}/track-days/${tdid_s1}/open"
              payload: {}
              as: TrackOps
            - call: "POST /tracks/${tid_s1}/track-days/${tdid_s1}/rental-blocks"
              payload: { block_index: 0, start_minute: 480, end_minute: 540, max_group_size: 5 }
              as: TrackOps
              captures: { rbid_s1: $.data.id }
            - call: "POST /tracks/${tid_s1}/track-days/${tdid_s1}/rental-blocks/${rbid_s1}/bookings"
              payload: { organizer_user_id: "orgS", group_name: "GS", run_group_class: "ADVANCED", driver_count: 1, insurance_policy_ref: "PS" }
              as: Organizer
              as_user_id: orgS
              captures: { bid_s1: $.data.id }
            - call: "POST /tracks/${tid_s1}/track-days/${tdid_s1}/rental-blocks/${rbid_s1}/bookings/${bid_s1}/drivers"
              payload: { full_name: "S", license_class: "STREET" }
              as: Organizer
              as_user_id: orgS
              captures: { did_s1: $.data.id }
          trigger:
            - call: "POST /tracks/${tid_s1}/track-days/${tdid_s1}/rental-blocks/${rbid_s1}/bookings/${bid_s1}/drivers/${did_s1}/inspect"
              payload: { inspector_user_id: "so1", helmet_ok: true, harness_ok: false }
              as: SafetyOfficer
              captures: { insp: $.data.id, result: $.data.result }
          assert:
            - "SafetyInspection.result == FAILED (harness_ok=false dominates)"

      - name: track_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]

        distinguishing_aspect: "GET on a non-existent track id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "GET /tracks/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: TrackOps
              captures: { err_nf: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "http_status == 404"

      - name: trackday_list_pagination_defaults
        claim_type: listing
        grounds:
          - response_envelope
          - endpoints."GET /tracks/{tid}/track-days"

        distinguishing_aspect: "List endpoint returns paginated response with limit/offset/total_count/has_more per envelope."
        test_recipe:
          setup: ["One track, two track days"]
          setup_api_calls:
            - call: "POST /tracks"
              payload: { name: "L1", noise_limit_db: 90, run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid_l1: $.data.id }
            - call: "POST /tracks/${tid_l1}/track-days"
              payload: { date: "2026-09-12" }
              as: TrackOps
            - call: "POST /tracks/${tid_l1}/track-days"
              payload: { date: "2026-09-13" }
              as: TrackOps
          trigger:
            - call: "GET /tracks/${tid_l1}/track-days"
              payload: {}
              as: TrackOps
          assert:
            - "Response is an array envelope with pagination fields limit, offset, total_count, has_more"
            - "total_count == 2"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: trackday_invalid_transition_schedule_to_running_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.TrackDay
          - errors[ERR_INVALID_STATE]

        distinguishing_aspect: "SCHEDULED → RUNNING is not a valid transition (must go through OPEN first); explicit resume on SCHEDULED day must fail."
        test_recipe:
          setup: ["TrackDay in SCHEDULED (just created)"]
          setup_api_calls:
            - call: "POST /tracks"
              payload: { name: "T1", noise_limit_db: 90, run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid_sm1: $.data.id }
            - call: "POST /tracks/${tid_sm1}/track-days"
              payload: { date: "2026-09-14" }
              as: TrackOps
              captures: { tdid_sm1: $.data.id, td_sm1_v: $.data.version }
          trigger:
            - call: "POST /tracks/${tid_sm1}/track-days/${tdid_sm1}/resume"
              payload: { expected_track_day_version: "${td_sm1_v}" }
              as: SafetyOfficer
              captures: { err_sm1: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (resume from SCHEDULED is not allowed; only STOPPED → RUNNING)"

      - name: booking_cannot_be_approved_twice_idempotency
        claim_type: idempotency
        grounds:
          - state_machines.Booking.PENDING_to_APPROVED
          - errors[ERR_INVALID_STATE]

        distinguishing_aspect: "Second approve on an already-APPROVED booking fails with ERR_INVALID_STATE (no double-spend of seats)."
        test_recipe:
          setup: ["Booking APPROVED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TrackOps
            - call: "POST /tracks"
              payload: { name: "T2", noise_limit_db: 90, run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid_sm2: $.data.id }
            - call: "POST /tracks/${tid_sm2}/track-days"
              payload: { date: "2026-09-15" }
              as: TrackOps
              captures: { tdid_sm2: $.data.id }
            - call: "POST /tracks/${tid_sm2}/track-days/${tdid_sm2}/open"
              payload: {}
              as: TrackOps
            - call: "POST /tracks/${tid_sm2}/track-days/${tdid_sm2}/rental-blocks"
              payload: { block_index: 0, start_minute: 480, end_minute: 540, max_group_size: 5 }
              as: TrackOps
              captures: { rbid_sm2: $.data.id, rb_sm2_v0: $.data.version }
            - call: "POST /tracks/${tid_sm2}/track-days/${tdid_sm2}/rental-blocks/${rbid_sm2}/bookings"
              payload: { organizer_user_id: "orgSM2", group_name: "G", run_group_class: "ADVANCED", driver_count: 1, insurance_policy_ref: "P" }
              as: Organizer
              as_user_id: orgSM2
              captures: { bid_sm2: $.data.id }
            - call: "POST /tracks/${tid_sm2}/track-days/${tdid_sm2}/rental-blocks/${rbid_sm2}/bookings/${bid_sm2}/approve"
              payload: { expected_rental_block_version: "${rb_sm2_v0}" }
              as: TrackOps
            - call: "GET /tracks/${tid_sm2}/track-days/${tdid_sm2}/rental-blocks/${rbid_sm2}"
              payload: {}
              as: TrackOps
              captures: { rb_sm2_v1: $.data.version }
          trigger:
            - call: "POST /tracks/${tid_sm2}/track-days/${tdid_sm2}/rental-blocks/${rbid_sm2}/bookings/${bid_sm2}/approve"
              payload: { expected_rental_block_version: "${rb_sm2_v1}" }
              as: TrackOps
              captures: { err_sm2: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "RentalBlock.seats_reserved remains 1 (no double-count)"

      - name: trackday_terminal_states_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.TrackDay

        distinguishing_aspect: "From CANCELLED no further transitions are possible; weather_hold on CANCELLED returns ERR_INVALID_STATE or ERR_TRACK_DAY_NOT_LIVE."
        test_recipe:
          setup: ["Cancelled TrackDay"]
          setup_api_calls:
            - call: "POST /tracks"
              payload: { name: "T3", noise_limit_db: 90, run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid_sm3: $.data.id }
            - call: "POST /tracks/${tid_sm3}/track-days"
              payload: { date: "2026-09-16" }
              as: TrackOps
              captures: { tdid_sm3: $.data.id }
            - call: "POST /tracks/${tid_sm3}/track-days/${tdid_sm3}/open"
              payload: {}
              as: TrackOps
            - call: "POST /tracks/${tid_sm3}/track-days/${tdid_sm3}/cancel"
              payload: { reason: "CUSTOMER" }
              as: TrackOps
          trigger:
            - call: "POST /tracks/${tid_sm3}/track-days/${tdid_sm3}/weather_hold"
              payload: {}
              as: TrackOps
              captures: { err_sm3: $.data.error_id }
          assert:
            - "error_id ∈ {ERR_INVALID_STATE, ERR_TRACK_DAY_NOT_LIVE}"

      - name: rentalblock_closed_blocks_new_booking
        claim_type: precondition_enforcement
        grounds:
          - state_machines.RentalBlock
          - errors[ERR_INVALID_STATE]

        distinguishing_aspect: "Creating a booking on a CLOSED RentalBlock fails (block's terminal state locks new bookings)."
        test_recipe:
          setup: ["RentalBlock CLOSED"]
          setup_api_calls:
            - call: "POST /tracks"
              payload: { name: "T4", noise_limit_db: 90, run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid_sm4: $.data.id }
            - call: "POST /tracks/${tid_sm4}/track-days"
              payload: { date: "2026-09-17" }
              as: TrackOps
              captures: { tdid_sm4: $.data.id }
            - call: "POST /tracks/${tid_sm4}/track-days/${tdid_sm4}/open"
              payload: {}
              as: TrackOps
            - call: "POST /tracks/${tid_sm4}/track-days/${tdid_sm4}/rental-blocks"
              payload: { block_index: 0, start_minute: 480, end_minute: 540, max_group_size: 5 }
              as: TrackOps
              captures: { rbid_sm4: $.data.id }
            - call: "POST /tracks/${tid_sm4}/track-days/${tdid_sm4}/rental-blocks/${rbid_sm4}/close_block"
              payload: {}
              as: TrackOps
          trigger:
            - call: "POST /tracks/${tid_sm4}/track-days/${tdid_sm4}/rental-blocks/${rbid_sm4}/bookings"
              payload: { organizer_user_id: "orgSM4", group_name: "G", run_group_class: "ADVANCED", driver_count: 1, insurance_policy_ref: "P" }
              as: Organizer
              as_user_id: orgSM4
              captures: { err_sm4: $.data.error_id }
          assert:
            - "error_id ∈ {ERR_INVALID_STATE, ERR_NOT_FOUND}"
            - "no Booking created"

      - name: incident_low_severity_direct_clear_allowed
        claim_type: valid_transition
        grounds:
          - state_machines.Incident.OPEN_to_CLEARED

        distinguishing_aspect: "LOW severity incident can skip INVESTIGATING and go OPEN → CLEARED directly."
        test_recipe:
          setup: ["OPEN LOW incident"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TrackOps
            - call: "POST /tracks"
              payload: { name: "T5", noise_limit_db: 90, run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid_sm5: $.data.id }
            - call: "POST /tracks/${tid_sm5}/track-days"
              payload: { date: "2026-09-18" }
              as: TrackOps
              captures: { tdid_sm5: $.data.id }
            - call: "POST /tracks/${tid_sm5}/track-days/${tdid_sm5}/open"
              payload: {}
              as: TrackOps
            - call: "POST /tracks/${tid_sm5}/track-days/${tdid_sm5}/rental-blocks"
              payload: { block_index: 0, start_minute: 480, end_minute: 540, max_group_size: 5 }
              as: TrackOps
              captures: { rbid_sm5: $.data.id }
            - call: "POST /tracks/${tid_sm5}/track-days/${tdid_sm5}/sessions"
              payload: { rental_block_id: "${rbid_sm5}", run_group_class: "ADVANCED" }
              as: TrackOps
              captures: { sid_sm5: $.data.id }
            - call: "POST /tracks/${tid_sm5}/track-days/${tdid_sm5}/incidents"
              payload: { session_id: "${sid_sm5}", severity: "LOW", reported_by_user_id: "opsX" }
              as: TrackOps
              captures: { iid_sm5: $.data.id }
          trigger:
            - call: "POST /tracks/${tid_sm5}/track-days/${tdid_sm5}/incidents/${iid_sm5}/clear"
              payload: { cleared_by_user_id: "safetyX" }
              as: SafetyOfficer
          assert:
            - "Incident.status == CLEARED (direct OPEN → CLEARED for LOW)"

      - name: garage_release_is_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.GarageAssignment

        distinguishing_aspect: "RELEASED garage cannot be released again; second release is ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE GarageAssignment"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TrackOps
            - call: "POST /tracks"
              payload: { name: "T6", noise_limit_db: 90, run_group_capacity: 10, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid_sm6: $.data.id }
            - call: "POST /tracks/${tid_sm6}/track-days"
              payload: { date: "2026-09-19" }
              as: TrackOps
              captures: { tdid_sm6: $.data.id }
            - call: "POST /tracks/${tid_sm6}/track-days/${tdid_sm6}/open"
              payload: {}
              as: TrackOps
              captures: { td_sm6_v: $.data.version }
            - call: "POST /tracks/${tid_sm6}/track-days/${tdid_sm6}/rental-blocks"
              payload: { block_index: 0, start_minute: 480, end_minute: 540, max_group_size: 5 }
              as: TrackOps
              captures: { rbid_sm6: $.data.id, rb_sm6_v: $.data.version }
            - call: "POST /tracks/${tid_sm6}/track-days/${tdid_sm6}/rental-blocks/${rbid_sm6}/bookings"
              payload: { organizer_user_id: "orgSM6", group_name: "G", run_group_class: "ADVANCED", driver_count: 1, insurance_policy_ref: "P" }
              as: Organizer
              as_user_id: orgSM6
              captures: { bid_sm6: $.data.id }
            - call: "POST /tracks/${tid_sm6}/track-days/${tdid_sm6}/rental-blocks/${rbid_sm6}/bookings/${bid_sm6}/approve"
              payload: { expected_rental_block_version: "${rb_sm6_v}" }
              as: TrackOps
            - call: "POST /tracks/${tid_sm6}/track-days/${tdid_sm6}/garage-assignments"
              payload: { booking_id: "${bid_sm6}", bay_number: 1, power_hookups: 1, water_hookup: false, expected_track_day_version: "${td_sm6_v}" }
              as: TrackOps
              captures: { gid_sm6: $.data.id }
            - call: "POST /tracks/${tid_sm6}/track-days/${tdid_sm6}/garage-assignments/${gid_sm6}/release"
              payload: {}
              as: TrackOps
          trigger:
            - call: "POST /tracks/${tid_sm6}/track-days/${tdid_sm6}/garage-assignments/${gid_sm6}/release"
              payload: {}
              as: TrackOps
              captures: { err_sm6: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: rental_block_seats_input_set_filtering
        claim_type: input_set_filtering
        grounds:
          - calculations.rental_block_seats_available

        distinguishing_aspect: "Only APPROVED bookings count toward seats_reserved; PENDING and CANCELLED bookings are excluded."
        test_recipe:
          setup: ["One block; 1 PENDING booking (driver_count=2), 1 APPROVED (driver_count=1), 1 CANCELLED (driver_count=3)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TrackOps
            - call: "POST /tracks"
              payload: { name: "C1", noise_limit_db: 90, run_group_capacity: 20, garage_bay_count: 3, paddock_stall_count: 8 }
              as: TrackOps
              captures: { tid_c1: $.data.id }
            - call: "POST /tracks/${tid_c1}/track-days"
              payload: { date: "2026-09-20" }
              as: TrackOps
              captures: { tdid_c1: $.data.id }
            - call: "POST /tracks/${tid_c1}/track-days/${tdid_c1}/open"
              payload: {}
              as: TrackOps
            - call: "POST /tracks/${tid_c1}/track-days/${tdid_c1}/rental-blocks"
              payload: { block_index: 0, start_minute: 480, end_minute: 540, max_group_size: 10 }
              as: TrackOps
              captures: { rbid_c1: $.data.id, rb_c1_v: $.data.version }
            - call: "POST /tracks/${tid_c1}/track-days/${tdid_c1}/rental-blocks/${rbid_c1}/bookings"
