      - name: driver_chargeable_complaint_clawback_reduces_accrual_by_exactly_the_stop_line
        grounds:
          - calculations.driver_reimbursement_accrual
          - calculations.complaint_remedy
          - state_machines.Complaint.REMEDY_PROPOSED_to_REMEDY_ISSUED
          - state_machines.Order.settlement_status.CHARGED_to_ADJUSTED
          - entities.ReimbursementLine.fields.line_type
          - entities.Complaint.fields.clawback_cents
          - validations.priority_37
        distinguishing_aspect: |
          The accrual identity is sum(ACCRUED lines) and the compensation is a
          NEGATIVE ACCRUED line rather than a mutation or deletion of the original
          one. Settling a two-stop route accrues 361 + 298 = 659; approving a
          driver-chargeable QUALITY complaint on the FIRST stop's order writes a
          CLAWBACK line of -361 and the accrual becomes exactly 298, while the
          original ACTUAL_STOP line of 361 must remain ACCRUED and unmodified and
          the second stop's 298 must be untouched. The customer-side remedy (1100)
          and the driver-side clawback (361) are deliberately different numbers,
          so an implementation that claws back the remedy amount is caught.
