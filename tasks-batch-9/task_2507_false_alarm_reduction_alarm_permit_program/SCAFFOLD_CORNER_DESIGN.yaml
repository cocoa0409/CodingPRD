        distinguishing_aspect: "Only COUNTED and APPEALED rows enter the chargeable set. An earlier SEVERE_WEATHER incident ruled EXEMPT on 2026-09-15 does not consume index 1, so the next chargeable incident on 2026-09-16 is numbered 1 — not 2 — and the site counters read 1."
