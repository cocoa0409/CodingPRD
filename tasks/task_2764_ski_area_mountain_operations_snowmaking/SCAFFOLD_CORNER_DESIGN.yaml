          - calculations.day_guest_capacity
        distinguishing_aspect: |
          The EXECUTED fork is decided entirely by hazard_rating_post: LOW or MODERATE clears, while
          CONSIDERABLE, HIGH or EXTREME extends the hold. The recipe reaches the hard-to-build state
          where an area is OPEN on an earlier clearance while a second mission sits EXECUTED - the only
          way the OPEN -> PATROL_HOLD side effect of HOLD_EXTENDED is reachable, since mission execution
          itself is forbidden over open terrain. It also lands on the day_guest_capacity edge case where
          terrain_open_acres falls to 0.0 while a lift is still OPEN, so crowding_density is 0.0 and
          guest_capacity equals raw_ccc.
