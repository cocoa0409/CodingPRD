      - name: issuance_split_pinned_evaluation_order
        grounds:
          - calculations.credit_issuance_split
          - entities.CreditBatch.fields.risk_tier
          - entities.CreditBatch.fields.buffer_pct
          - entities.CreditBatch.fields.buffer_credits
          - entities.CreditBatch.fields.issued_credits
          - entities.BufferAccount.fields.next_serial_number
        distinguishing_aspect: |
          The tier basis is deliberately circular-looking (tier scales buffer_pct, buffer_pct
          decides issued_credits, issued_credits feed lifetime issuance which tiers key on) and
          the scaffold pins the order: tier_basis is gross_credits + lifetime_credits_issued
          READ BEFORE the batch is booked. This chain is tuned so gross_credits 1005 lands just
          above TIER_MEDIUM_MIN_CREDITS 1000 while issued_credits 864 lands below it, so an
