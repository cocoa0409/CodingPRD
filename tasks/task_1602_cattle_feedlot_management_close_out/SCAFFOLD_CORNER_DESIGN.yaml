              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PEN_NOT_OCCUPIED"

  # ===========================================================================
  - section: calculations
    instances:
      - name: feed_cost_split_two_lots_residual_to_latest
        claim_type: correct_result
        grounds: [calculations.feed_cost_allocation]
        distinguishing_aspect: "Two commingled lots (60/40 head): the earlier-created assignment's share is rounded to whole cents and the later-created assignment receives the residual; across two calls the per-lot accumulations are 12179c and 8120c and conserve the 20249c total."
        test_recipe:
          setup:
            - "Pen T-60 commingles lot L-C60 (60 head, assigned first) and lot L-C40 (40 head, assigned second); both STEER, commingle_allowed, same ration R-C60 (19999c/ton) window [2026-08-01, 2026-08-10)"
            - "Feed call 2026-08-01 base 10.0 lbs/head -> 1000 lbs -> 10000c (0.5 x 19999 = 9999.5 -> round_half_up)"
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-C60", billing_email: "c60@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/pens"
              payload: { pen_code: "T-60", capacity_head: 200 }
              as: FeedyardManager
              captures: { p_id: $.data.id }
            - call: "POST /feedlot/rations"
              payload: { ration_name: "R-C60", step_level: 1, cost_per_ton_cents: 19999 }
              as: FeedManager
              captures: { r_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-C60", sex_class: "STEER", head_count_in: 60, in_weight_total_lbs: 42000, purchase_cost_cents: 8400000, arrival_date: "2026-08-01", commingle_allowed: true }
              as: FeedyardManager
              captures: { l60: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-C40", sex_class: "STEER", head_count_in: 40, in_weight_total_lbs: 28000, purchase_cost_cents: 5600000, arrival_date: "2026-08-01", commingle_allowed: true }
              as: FeedyardManager
              captures: { l40: $.data.id }
            - call: "POST /feedlot/ration-assignments"
              payload: { lot_id: "${l60}", ration_id: "${r_id}", start_date: "2026-08-01", end_date: "2026-08-10" }
              as: FeedManager
            - call: "POST /feedlot/ration-assignments"
              payload: { lot_id: "${l40}", ration_id: "${r_id}", start_date: "2026-08-01", end_date: "2026-08-10" }
              as: FeedManager
            - call: "POST /feedlot/assignments"
              payload: { pen_id: "${p_id}", lot_id: "${l60}", head_count: 60, start_date: "2026-08-01" }
              as: FeedyardManager
            - call: "POST /feedlot/assignments"
              payload: { pen_id: "${p_id}", lot_id: "${l40}", head_count: 40, start_date: "2026-08-01" }
              as: FeedyardManager
            - call: "POST /feedlot/feed-calls"
              payload: { pen_id: "${p_id}", call_date: "2026-08-01", base_qty_lbs_per_head: 10.0 }
              as: FeedManager
          trigger:
            - call: "POST /feedlot/feed-calls"
              payload: { pen_id: "${p_id}", call_date: "2026-08-02", bunk_score: 1 }
              as: FeedManager
              captures: { fc2_cost: $.data.total_cost_cents }
            - call: "GET /feedlot/lots/${l60}"
              as: Any
              captures: { f60: $.data.total_feed_cost_cents }
            - call: "GET /feedlot/lots/${l40}"
              as: Any
              captures: { f40: $.data.total_feed_cost_cents }
          assert:
            - "fc2_cost == 10299 (10.0 + 0.25 -> 10.3 lbs/head x 100 head = 1030 lbs; 0.515 t x 19999 = 10299.485 -> round_half_up 10299)"
            - "f60 == 12179 (6000 from call 1 + round_half_up(10299 x 0.6) = 6179 from call 2)"
            - "f40 == 8120 (4000 residual from call 1 + (10299 - 6179) = 4120 residual from call 2)"
            - "f60 + f40 == 10000 + 10299 (allocation conserves every cent)"

      - name: hedge_pnl_short_and_long
        claim_type: correct_result
        grounds: [calculations.hedge_pnl]
        distinguishing_aspect: "P&L sign convention per side: SHORT gains when the market falls (2 contracts 19000 -> 18500 = +400000c) and LONG gains when it rises (1 contract 18500 -> 19000 = +200000c); the lot accumulator nets both to 600000c."
        test_recipe:
          setup: ["Lot L-HP (80 head, avg 1000 lbs -> marketable 1200 cwt) with two hedges: H1 SHORT 2 contracts at 19000c, H2 LONG 1 contract at 18500c, both 2026-12"]
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-HP", billing_email: "hp@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-HP", sex_class: "STEER", head_count_in: 80, in_weight_total_lbs: 80000, purchase_cost_cents: 9600000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id, v0: $.data.version }
            - call: "POST /feedlot/hedges"
              payload: { lot_id: "${l_id}", contract_month: "2026-12", side: "SHORT", quantity_contracts: 2, entry_price_cents_per_cwt: 19000, expected_lot_version: "${v0}" }
              as: RiskManager
              captures: { h1: $.data.id }
            - call: "GET /feedlot/lots/${l_id}"
              as: Any
              captures: { v1: $.data.version }
            - call: "POST /feedlot/hedges"
              payload: { lot_id: "${l_id}", contract_month: "2026-12", side: "LONG", quantity_contracts: 1, entry_price_cents_per_cwt: 18500, expected_lot_version: "${v1}" }
              as: RiskManager
              captures: { h2: $.data.id }
          trigger:
            - call: "POST /feedlot/hedges/${h1}/offset"
              payload: { exit_price_cents_per_cwt: 18500, offset_date: "2026-08-01" }
              as: RiskManager
              captures: { pnl1: $.data.realized_pnl_cents }
            - call: "POST /feedlot/hedges/${h2}/offset"
              payload: { exit_price_cents_per_cwt: 19000, offset_date: "2026-08-01" }
              as: RiskManager
              captures: { pnl2: $.data.realized_pnl_cents }
            - call: "GET /feedlot/lots/${l_id}"
              as: Any
              captures: { tot: $.data.total_hedge_pnl_cents }
          assert:
            - "pnl1 == 400000 (SHORT: (19000-18500) x 400 x 2)"
            - "pnl2 == 200000 (LONG: (19000-18500) x 400 x 1)"
            - "tot == 600000"

      - name: withdrawal_clear_date_max_and_clock_clear
        claim_type: correct_result
        grounds: [calculations.withdrawal_clear_date, state_machines.HealthEvent.WITHDRAWAL_ACTIVE_to_CLEARED]
        distinguishing_aspect: "withdrawal_clear_date is the max over all events (2026-08-13, not the earlier 2026-08-06); the logical clock clears events individually as their own end dates pass."
        test_recipe:
          setup: ["Lot L-WD (5 head) with two health events on 2026-08-01: E1 withdrawal 5 days (end 2026-08-06, recorded first) and E2 withdrawal 12 days (end 2026-08-13)"]
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-WD", billing_email: "wd@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-WD", sex_class: "STEER", head_count_in: 5, in_weight_total_lbs: 3500, purchase_cost_cents: 700000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
            - call: "POST /feedlot/health-events"
              payload: { lot_id: "${l_id}", treatment_date: "2026-08-01", drug_product: "DRAXXIN", withdrawal_days: 5, head_treated: 1, treatment_cost_cents: 1000 }
              as: CattleHealthTech
            - call: "POST /feedlot/health-events"
              payload: { lot_id: "${l_id}", treatment_date: "2026-08-01", drug_product: "BAYTRIL", withdrawal_days: 12, head_treated: 1, treatment_cost_cents: 1500 }
              as: CattleHealthTech
          trigger:
            - call: "GET /feedlot/lots/${l_id}"
              as: Any
              captures: { cd1: $.data.withdrawal_clear_date }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T00:00:00Z" }
              as: FeedyardManager
            - call: "GET /feedlot/lots/${l_id}/health-events"
              as: Any
              captures: { e1_mid: "$.data[0].status", e2_mid: "$.data[1].status" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T00:00:00Z" }
              as: FeedyardManager
            - call: "GET /feedlot/lots/${l_id}/health-events"
              as: Any
              captures: { e1_end: "$.data[0].status", e2_end: "$.data[1].status" }
          assert:
            - "cd1 == 2026-08-13 (max over events, not min or latest-created)"
            - "e1_mid == CLEARED and e2_mid == WITHDRAWAL_ACTIVE at clock 2026-08-07"
            - "e1_end == CLEARED and e2_end == CLEARED at clock 2026-08-13 (cleared ON the end date)"

      - name: yardage_simple_half_open_counting
        claim_type: boundary_value
        grounds: [calculations.yardage_head_days, entities.Invoice.fields.yardage_head_days]
        distinguishing_aspect: "Half-open day counting without deaths: [2026-08-01, 2026-08-05) is exactly 4 billable days (arrival day counts, ship day does not) -> 10 head x 4 x 45c = 1800c."
        test_recipe:
