            - { call: "POST /terminals", payload: { name: "Pier O", code: "PIERO", demurrage_daily_rate_cents: 12500, slot_capacity_per_window: 1 }, as: Dispatcher, captures: { term_id: "$.data.id" } }
            - { call: "POST /bookings", payload: { container_number: "MSCUI", direction: "IMPORT", origin_terminal_id: "${term_id}", last_free_day: "2026-06-30T00:00:00Z", linehaul_base_cents: 45000 }, as: Dispatcher, captures: { bkg1_id: "$.data.id" } }
            - { call: "POST /bookings", payload: { container_number: "MSCUJ", direction: "IMPORT", origin_terminal_id: "${term_id}", last_free_day: "2026-06-30T00:00:00Z", linehaul_base_cents: 45000 }, as: Dispatcher, captures: { bkg2_id: "$.data.id" } }
            - { call: "POST /appointments", payload: { booking_id: "${bkg1_id}", terminal_id: "${term_id}", purpose: "PICKUP", window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T12:00:00Z" }, as: Dispatcher, captures: { appt1_id: "$.data.id" } }
          trigger:
            - { call: "POST /appointments", payload: { booking_id: "${bkg2_id}", terminal_id: "${term_id}", purpose: "PICKUP", window_start: "2026-05-10T10:00:00Z", window_end: "2026-05-10T14:00:00Z" }, as: Dispatcher }
            - { call: "POST /appointments", payload: { booking_id: "${bkg2_id}", terminal_id: "${term_id}", purpose: "PICKUP", window_start: "2026-05-10T12:00:00Z", window_end: "2026-05-10T16:00:00Z" }, as: Dispatcher, captures: { appt3_id: "$.data.id" } }
          assert:
            - "first trigger POST /appointments returns error_id == ERR_APPOINTMENT_SLOT_FULL (http 409)"
            - "second trigger POST /appointments succeeds; Appointment.${appt3_id}.status == BOOKED"

      - name: driver_double_book_closed_plus_buffer
        grounds:
          - validations[priority=11]
          - entities.Leg.fields.driver_id
          - errors[ERR_DRIVER_UNAVAILABLE]
        distinguishing_aspect: "Driver overlap uses CLOSED [start,end] intervals plus a 60-minute turnaround buffer (different interval arithmetic from the terminal's half-open capacity rule) on a different resource (Driver): a leg starting 30 min after the buffer boundary is rejected; one starting exactly at the buffer boundary is allowed."
        test_recipe:
          setup:
            - "One driver; leg1 RETURN [08:00,10:00]; leg2 RETURN [10:30,12:00] is within leg1.end+60min buffer (11:00) -> rejected; leg3 RETURN [11:00,12:30] starts exactly at buffer boundary -> allowed."
          setup_api_calls:
            - { call: "POST /terminals", payload: { name: "Pier P", code: "PIERP", demurrage_daily_rate_cents: 12500 }, as: Dispatcher, captures: { term_id: "$.data.id" } }
            - { call: "POST /bookings", payload: { container_number: "MSCUK", direction: "IMPORT", origin_terminal_id: "${term_id}", last_free_day: "2026-06-30T00:00:00Z", linehaul_base_cents: 45000 }, as: Dispatcher, captures: { bkg_id: "$.data.id" } }
            - { call: "POST /drivers", payload: { name: "Del Thirteen", license_number: "L13" }, as: Dispatcher, captures: { drv_id: "$.data.id" } }
            - { call: "POST /legs", payload: { booking_id: "${bkg_id}", driver_id: "${drv_id}", leg_type: "RETURN", window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T10:00:00Z" }, as: Dispatcher, captures: { leg1_id: "$.data.id" } }
          trigger:
            - { call: "POST /legs", payload: { booking_id: "${bkg_id}", driver_id: "${drv_id}", leg_type: "RETURN", window_start: "2026-05-10T10:30:00Z", window_end: "2026-05-10T12:00:00Z" }, as: Dispatcher }
            - { call: "POST /legs", payload: { booking_id: "${bkg_id}", driver_id: "${drv_id}", leg_type: "RETURN", window_start: "2026-05-10T11:00:00Z", window_end: "2026-05-10T12:30:00Z" }, as: Dispatcher, captures: { leg3_id: "$.data.id" } }
          assert:
            - "first trigger POST /legs returns error_id == ERR_DRIVER_UNAVAILABLE (http 409)"
            - "second trigger POST /legs succeeds; Leg.${leg3_id}.status == PLANNED"

  - rule_id: compensating_invariant
    instances:
      - name: chassis_assign_release_pool_count_conserved
        grounds:
          - state_machines.Chassis.AVAILABLE_to_ASSIGNED
          - state_machines.Chassis.ASSIGNED_to_AVAILABLE
          - state_machines.Booking.CONFIRMED_to_CHASSIS_ASSIGNED
          - state_machines.Booking.CHASSIS_ASSIGNED_to_CONFIRMED
        distinguishing_aspect: "Forward assign then compensating release leave the conserved quantity count(Chassis WHERE status==AVAILABLE) unchanged and per-diem at 0 — a cardinality invariant on the chassis pool."
        test_recipe:
          setup:
            - "Chassis AVAILABLE; booking confirmed; assign chassis (AVAILABLE->ASSIGNED, booking CHASSIS_ASSIGNED); release chassis (ASSIGNED->AVAILABLE, booking CONFIRMED)."
          setup_api_calls:
            - { call: "POST /terminals", payload: { name: "Pier Q", code: "PIERQ", demurrage_daily_rate_cents: 12500 }, as: Dispatcher, captures: { term_id: "$.data.id" } }
            - { call: "POST /chassis", payload: { chassis_number: "CHXE", pool_scac: "POOL", per_diem_rate_cents: 8500 }, as: Dispatcher, captures: { chx_id: "$.data.id" } }
            - { call: "POST /bookings", payload: { container_number: "MSCUL", direction: "IMPORT", origin_terminal_id: "${term_id}", last_free_day: "2026-06-30T00:00:00Z", linehaul_base_cents: 45000 }, as: Dispatcher, captures: { bkg_id: "$.data.id" } }
            - { call: "POST /bookings/${bkg_id}/confirm", payload: {}, as: Dispatcher, captures: { bkg_v: "$.data.version" } }
            - { call: "GET /chassis/${chx_id}", payload: {}, as: Dispatcher, captures: { status_before: "$.data.status" } }
            - { call: "POST /bookings/${bkg_id}/assign-chassis", payload: { chassis_id: "${chx_id}", expected_booking_version: "${bkg_v}" }, as: Dispatcher }
          trigger:
            - { call: "POST /bookings/${bkg_id}/release-chassis", payload: {}, as: Dispatcher }
          assert:
            - "captured status_before == AVAILABLE"
            - "Chassis.${chx_id}.status == AVAILABLE"
            - "Chassis.${chx_id}.per_diem_provisional_cents == 0"
            - "Booking.${bkg_id}.status == CONFIRMED"
            - "Booking.${bkg_id}.chassis_id == null"

      - name: accessorial_add_void_invoice_total_conserved
        grounds:
          - state_machines.AccessorialCharge.ACTIVE_to_VOIDED
          - calculations.invoice_total
          - entities.Invoice.fields.total_charge_cents
          - entities.AccessorialCharge.fields.amount_cents
        distinguishing_aspect: "Forward accessorial add then compensating void leave the conserved monetary quantity Invoice.total_charge_cents unchanged (54900) — a money invariant, a different conserved-quantity type from the chassis-count invariant."
        test_recipe:
          setup:
            - "Booking DELIVERED (linehaul 45000, demurrage 0, per_diem 0) -> Invoice total 54900; add STORAGE accessorial 7500 (total 62400); void it (total back to 54900)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /terminals", payload: { name: "Pier R", code: "PIERR", demurrage_daily_rate_cents: 12500 }, as: Dispatcher, captures: { term_id: "$.data.id" } }
            - { call: "POST /chassis", payload: { chassis_number: "CHXF", pool_scac: "POOL", per_diem_rate_cents: 8500, free_days: 4 }, as: Dispatcher, captures: { chx_id: "$.data.id" } }
            - { call: "POST /drivers", payload: { name: "Del Fourteen", license_number: "L14" }, as: Dispatcher, captures: { drv_id: "$.data.id" } }
            - { call: "POST /bookings", payload: { container_number: "MSCUM", direction: "IMPORT", origin_terminal_id: "${term_id}", last_free_day: "2026-06-30T00:00:00Z", linehaul_base_cents: 45000 }, as: Dispatcher, captures: { bkg_id: "$.data.id" } }
            - { call: "POST /bookings/${bkg_id}/confirm", payload: {}, as: Dispatcher, captures: { bkg_v: "$.data.version" } }
            - { call: "POST /bookings/${bkg_id}/assign-chassis", payload: { chassis_id: "${chx_id}", expected_booking_version: "${bkg_v}" }, as: Dispatcher }
            - { call: "POST /appointments", payload: { booking_id: "${bkg_id}", terminal_id: "${term_id}", purpose: "PICKUP", window_start: "2026-05-06T06:00:00Z", window_end: "2026-05-20T23:59:59Z" }, as: Dispatcher, captures: { appt_id: "$.data.id" } }
            - { call: "POST /legs", payload: { booking_id: "${bkg_id}", driver_id: "${drv_id}", leg_type: "PICKUP", appointment_id: "${appt_id}", window_start: "2026-05-06T08:00:00Z", window_end: "2026-05-06T12:00:00Z" }, as: Dispatcher, captures: { leg_id: "$.data.id" } }
            - { call: "POST /legs/${leg_id}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /legs/${leg_id}/complete", payload: {}, as: Dispatcher }
            - { call: "POST /invoices", payload: { booking_id: "${bkg_id}" }, as: Biller, captures: { inv_id: "$.data.id" } }
            - { call: "GET /invoices/${inv_id}", payload: {}, as: Biller, captures: { total_before: "$.data.total_charge_cents" } }
            - { call: "POST /invoices/${inv_id}/accessorials", payload: { kind: "STORAGE", amount_cents: 7500 }, as: Biller, captures: { acc_id: "$.data.id" } }
          trigger:
            - { call: "POST /invoices/${inv_id}/accessorials/${acc_id}/void", payload: {}, as: Biller }
          assert:
            - "captured total_before == 54900"
            - "Invoice.${inv_id}.total_charge_cents == 54900"
            - "AccessorialCharge.${acc_id}.status == VOIDED"
