        claim_type: priority_conflict
        grounds:
          - validations[priority=17]
          - validations[priority=32]
          - errors[ERR_ITEM_QUALITY_SUSPENDED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / run_schedule_safety_posture_beats_window_constraint
          rationale: "That §1.8 instance violates the suspended-posture rule and the buffer-expanded window rule in one request and asserts the 422 wins over the 409."

  # ===========================================================================
  # 5. ENDPOINTS (Table 5)
  # ===========================================================================
  - section: endpoints
    instances:
      - name: budget_ledger_computed_read_before_any_commitment
        claim_type: computed_read
        grounds:
          - endpoints[GET /private-label/programs/{program_id}/budget-ledger]
          - calculations.commitment_ledger_reconciliation
          - entities.BrandProgram.fields.active_item_count
        distinguishing_aspect: |
          The ledger is a pure projection: creating an item raises active_item_count but commits nothing, so the
          read returns committed 0, available equal to the full dev budget and both lifetime counters 0. A naive
          implementation that treats item creation as a commitment, or that derives available by subtracting
          lifetime_committed, cannot produce this row.
        test_recipe:
          setup:
            - "One ACTIVE program with dev_budget_cents 5000000 and one CONCEPT item; no specification and no run exist."
          setup_api_calls:
            - call: "POST /private-label/programs"
              payload: { brand_name: "Harvest Lane", retailer_name: "MidState Grocers", fiscal_year: 2026, dev_budget_cents: 5000000 }
              as: ProgramDirector
              as_user_id: "u-director-1"
