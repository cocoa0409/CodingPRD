            - { call: "GET /servicing/escrow-accounts/${acct_id}/advances", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { adv_id: "$.data[0].id" } }
          assert:
            - "Link 1: ledger contains DISBURSEMENT entry -70000 whose running_balance_cents == -20000"
            - "Link 2: EscrowAdvance.${adv_id} exists with amount_cents == 20000, reason == DISBURSEMENT_SHORTFALL, disbursement_id == ${disb_id}, status == OUTSTANDING"
            - "Ledger contains ADVANCE_ISSUED entry +20000 (source_entity_id == ${adv_id}) so post-release balance never below 0"
