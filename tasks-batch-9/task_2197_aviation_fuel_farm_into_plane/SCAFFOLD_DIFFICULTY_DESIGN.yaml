              payload: { to_status: "IN_SERVICE" }
              as: FarmOperator
          assert:
            - "the first trigger call returns 409 ERR_INVALID_TANK_STATE"
            - "immediately after that rejection StorageTank.${tank_id}.service_status == ISOLATED"
            - "immediately after that rejection StorageTank.${tank_id}.quality_status == QUARANTINED"
            - "immediately after that rejection StorageTank.${tank_id}.available_volume_liters == 0.00"
            - "immediately after that rejection FuelFarm.${farm_id}.posture == RESTRICTED"
            - "after the samples call StorageTank.${tank_id}.quality_status == ON_TEST"
            - "after the quality-release call StorageTank.${tank_id}.quality_status == RELEASED and FuelFarm.${farm_id}.posture == OPEN"
            - "the final trigger call returns 200 and StorageTank.${tank_id}.service_status == IN_SERVICE"
            - "StorageTank.${tank_id}.isolation_window_start_utc == null and StorageTank.${tank_id}.isolation_window_end_utc == null"
            - "StorageTank.${tank_id}.available_volume_liters == 999500.00"
            - "StorageTank.${tank_id}.book_volume_liters == 1000000.00 throughout (no ledger movement in the whole recipe)"

      - name: receipt_sampled_node_revisited_then_retest_budget_exhausted
        grounds:
          - state_machines.FuelReceipt.QUARANTINED_to_SAMPLED
          - state_machines.FuelReceipt.QUARANTINED_to_REJECTED
          - entities.FuelReceipt.fields.retest_round
          - validations.priority_26
        distinguishing_aspect: |
          The SAMPLED node is entered twice by the same endpoint, but the second entry increments
          retest_round to 2 and thereby consumes the retest budget: a third POST /fuel-receipts/{id}/samples
          from the identical QUARANTINED state returns 409 ERR_RETEST_LIMIT_REACHED, leaving REJECTED as the
          only reachable successor. Re-entering a node therefore narrows the outgoing edge set instead of
          reproducing it.
