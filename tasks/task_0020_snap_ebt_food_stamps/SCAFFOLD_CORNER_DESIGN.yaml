  - section: endpoints
    instances:
      - name: list_households_with_pagination_meta
        claim_type: standard_crud
        grounds: ["endpoints"]
        distinguishing_aspect: "GET /snap/households returns a list of Household entities with pagination semantics (envelope per §1.0); list returns total of created rows."
        test_recipe:
          setup: ["3 households created"]
          setup_api_calls:
            - call: "POST /snap/households"
              payload: { case_number: "CA-LP0001", state_code: "CA", address_line: "1" }
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/households"
              payload: { case_number: "CA-LP0002", state_code: "CA", address_line: "2" }
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/households"
              payload: { case_number: "CA-LP0003", state_code: "TX", address_line: "3" }
              as: Caseworker
              as_user_id: "cw_001"
          trigger:
            - call: "GET /snap/households"
              payload: { state_code: "CA", limit: 10, offset: 0 }
              as: Caseworker
              as_user_id: "cw_001"
