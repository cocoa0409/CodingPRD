              as: Member
              as_user_id: "${member_a_id}"
            - call: "POST /member-contracts/${contract_a_id}/execute"
              payload: {}
              as: CorpsDirector
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Casey Oduya", email: "casey@corps.test", date_of_birth: "2004-07-19", section: "PERCUSSION", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { member_b_id: "$.data.id" }
