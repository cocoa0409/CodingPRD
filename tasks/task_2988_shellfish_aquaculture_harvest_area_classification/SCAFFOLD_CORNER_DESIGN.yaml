      - name: reopen_guards_reject_an_open_area_and_a_closure_without_clean_samples
        claim_type: violation_to_error
        grounds:
          - validations[priority=39]
          - validations[priority=61]
          - errors[ERR_AREA_ALREADY_OPEN]
          - errors[ERR_INSUFFICIENT_CLEAN_SAMPLES]
        distinguishing_aspect: |
          Reopening is guarded on both sides of the closure: an area whose harvest_status is already
          OPEN is refused at 39, and a rainfall-closed area whose closure_reopen_eligible_at has
          passed is still refused at 61 because consecutive_clean_samples is 0 against a required 3 —
          the elapsed duration alone never reopens an area.
        test_recipe:
          setup:
            - "Two APPROVED/OPEN areas: GA-114 and GA-220, each with rainfall_closure_threshold_in 1.00, rainfall_closure_hours 96 and reopen_sample_count_required 3."
            - "A 1.50-inch rainfall event on GA-220 observed 2026-08-05T12:00:00Z closes it: harvest_status CLOSED_RAINFALL, closure_reopen_eligible_at 2026-08-09T12:00:00Z, consecutive_clean_samples 0."
            - "The clock is then moved to 2026-08-10T00:00:00Z, which is past GA-220's eligible instant; no clean samples have been ingested for GA-220."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-114", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
              as: ShellfishControlAuthority
              captures: { a1: $.data.id }
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-220", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
              as: ShellfishControlAuthority
              captures: { a2: $.data.id }
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${a2}/rainfall-events"
              payload: { gauge_code: "RG-7", observed_at: "2026-08-05T12:00:00Z", inches_24h: 1.5 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShellfishControlAuthority
          trigger:
            - call: "POST /shellfish/growing-areas/${a1}/reopen"
              payload: { reopen_note: "nothing to reopen" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${a2}/reopen"
              payload: { reopen_note: "duration has elapsed" }
              as: ShellfishControlAuthority
          assert:
            - "First call: HTTP 409 with data.error_id == ERR_AREA_ALREADY_OPEN"
            - "Second call: HTTP 409 with data.error_id == ERR_INSUFFICIENT_CLEAN_SAMPLES, not ERR_REOPEN_TOO_EARLY (2026-08-10T00:00:00Z is past 2026-08-09T12:00:00Z)"
            - "GET /shellfish/growing-areas/${a2} reports harvest_status == CLOSED_RAINFALL, consecutive_clean_samples == 0, reopen_sample_count_required == 3 and classification == APPROVED"
            - "GET /shellfish/growing-areas/${a1} reports harvest_status == OPEN"

      - name: lease_submit_on_a_prohibited_area_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority=41]
          - errors[ERR_AREA_PROHIBITED]
          - calculations.area_eligible_classification
        distinguishing_aspect: |
          A PROHIBITED classification blocks the lease lifecycle rather than only harvesting: the
          lease was legally created while the area was APPROVED, and the automatic downgrade
          triggered by the fifth failing sample retroactively bars the submission, leaving the lease
          in DRAFT.
        test_recipe:
          setup:
            - "GrowingArea GA-114 created APPROVED/OPEN with clean_sample_mpn_limit 14.0."
            - "Five SYSTEMATIC_RANDOM samples of 200 MPN each are ingested; on the fifth the sweep fires because the geometric mean 200.0 exceeds 14.0, so classification becomes PROHIBITED and harvest_status CLOSED_SAMPLE_FAILURE."
            - "Lease L-2988-01 was created on GA-114 (status DRAFT) after the downgrade; POST /shellfish/leases itself is not gated on classification."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-114", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
              as: ShellfishControlAuthority
              captures: { area: $.data.id }
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-05T09:00:00Z", fecal_coliform_mpn: 200, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-12T09:00:00Z", fecal_coliform_mpn: 200, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-19T09:00:00Z", fecal_coliform_mpn: 200, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-26T09:00:00Z", fecal_coliform_mpn: 200, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-31T09:00:00Z", fecal_coliform_mpn: 200, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/leases"
              payload: { growing_area_id: "${area}", lease_code: "L-2988-01", requested_acreage: 5.0, plot_codes: ["P1", "P2", "P3"], gear_types_permitted: ["BOTTOM", "RACK_AND_BAG"], authorized_gear_units: 200 }
              as: FarmOperator
              as_user_id: "op-1"
              captures: { lease: $.data.id }
          trigger:
            - call: "POST /shellfish/leases/${lease}/submit"
              payload: { submission_note: "initial siting package" }
              as: FarmOperator
              as_user_id: "op-1"
          assert:
            - "HTTP 409 with data.error_id == ERR_AREA_PROHIBITED"
            - "GET /shellfish/growing-areas/${area} reports classification == PROHIBITED and harvest_status == CLOSED_SAMPLE_FAILURE"
            - "GET /shellfish/leases/${lease} reports status == DRAFT, navigation_cleared == false, environmental_cleared == false and revision_round == 0"
            - "GET /shellfish/growing-areas/${area}/classification-summary?variant=SYSTEMATIC_RANDOM returns sample_count == 5, geometric_mean_mpn == 200.0 and eligible_classification == PROHIBITED"

      - name: unit_reauthorization_and_lapsed_inspection_are_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority=71]
          - validations[priority=72]
          - errors[ERR_UNIT_ALREADY_AUTHORIZED]
          - errors[ERR_HUSBANDRY_LAPSED]
        distinguishing_aspect: |
          A GrowoutUnit may back at most one ISSUED or ACTIVE authorization at a time, and husbandry
          currency is measured per unit: the second unit is refused with ERR_HUSBANDRY_LAPSED rather
          than ERR_PREDATOR_CONTROL_LAPSED because the 30-day inspection check at priority 72 runs
          before the 60-day predator check at 73, even though both windows are blown.
        test_recipe:
          setup:
            - "GrowingArea GA-114 APPROVED/OPEN; LISTED dealer; vessel with concurrent_authorization_capacity 2; APPROVED Lease L-2988-01 with rent paid through 2026-12-31."
            - "Unit U1 on P1 (40 gear units, 25000 seed) has an INSPECTION log at 2026-07-20T12:00:00Z and a PREDATOR_CONTROL log at 2026-07-20T13:00:00Z, and already backs one ISSUED authorization for 2026-08-10T06:00:00Z..18:00:00Z."
            - "Unit U2 on P2 (20 gear units, 15000 seed) has an INSPECTION log at 2026-06-01T12:00:00Z and a PREDATOR_CONTROL log at 2026-06-01T13:00:00Z — 61 days before the 2026-08-01T00:00:00Z clock, so both windows are lapsed."
