scaffold_corner_design:
  - section: Entities
    instances:
      - name: network_loop_creation_returns_every_declared_field_in_the_envelope
        claim_type: Creation
        grounds:
          - endpoints[POST /district-energy/network-loops]
          - entities.NetworkLoop
          - response_envelope.success
        distinguishing_aspect: "A loop created with the six required inputs returns HTTP 201 with response_type object and every NetworkLoop field present, the four computed counters seeded to their declared defaults."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
          trigger:
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-Z1", name: "Zone One Loop", service_mode: "DUAL", design_supply_temp_c: 95.0, max_pressure_kpa: 1600.0, rated_capacity_kw: 9000.0 }
              as: SystemController
              captures: { loop_z1_id: $.data.id, loop_z1_version: $.data.version }
          assert:
            - "the response status is 201 and response_type == object"
            - "NetworkLoop.${loop_z1_id}.code == LOOP-Z1"
            - "NetworkLoop.${loop_z1_id}.service_mode == DUAL"
            - "NetworkLoop.${loop_z1_id}.rated_capacity_kw == 9000.0"
            - "NetworkLoop.${loop_z1_id}.posture == NORMAL"
            - "NetworkLoop.${loop_z1_id}.committed_reserved_kw == 0.0"
            - "NetworkLoop.${loop_z1_id}.open_isolation_count == 0"
            - "NetworkLoop.${loop_z1_id}.suspect_segment_count == 0"
            - "${loop_z1_version} == 1"
            - "NetworkLoop.${loop_z1_id}.created_at == 2026-08-01T00:00:00Z"

      - name: production_asset_retrieval_returns_the_stored_row_unchanged
        claim_type: Retrieval
        grounds:
          - endpoints[GET /district-energy/production-assets/{asset_id}]
          - entities.ProductionAsset
        distinguishing_aspect: "GET on a registered asset id returns exactly the stored ProductionAsset, including the optional storage fields, with no recomputation."
        test_recipe:
          setup:
            - "NetworkLoop LOOP-Z1 with one THERMAL_STORAGE asset Z_STO."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-Z1", name: "Zone One Loop", service_mode: "DUAL", design_supply_temp_c: 95.0, max_pressure_kpa: 1600.0, rated_capacity_kw: 9000.0 }
              as: SystemController
              captures: { loop_z1_id: $.data.id }
            - call: "POST /district-energy/production-assets"
              payload: { loop_id: "${loop_z1_id}", code: "Z_STO", asset_type: "THERMAL_STORAGE", rated_capacity_kw: 1000.0, marginal_cost_per_mwh: 6.00, emission_factor_kg_per_mwh: 0.0, storage_capacity_kwh: 4000.0, state_of_charge_kwh: 3500.0 }
              as: SystemController
              captures: { z_sto_id: $.data.id }
          trigger:
            - call: "GET /district-energy/production-assets/${z_sto_id}"
              payload: {}
              as: DispatchOperator
              captures: { z_sto_soc: $.data.state_of_charge_kwh }
          assert:
            - "the response status is 200"
            - "ProductionAsset.${z_sto_id}.loop_id == ${loop_z1_id}"
            - "ProductionAsset.${z_sto_id}.asset_type == THERMAL_STORAGE"
            - "ProductionAsset.${z_sto_id}.storage_capacity_kwh == 4000.0"
            - "${z_sto_soc} == 3500.0"
            - "ProductionAsset.${z_sto_id}.availability_state == AVAILABLE"

      - name: pipe_segment_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /district-energy/pipe-segments]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three segments on one loop listed with limit 2 offset 0 return 2 rows with total_count 3 and has_more true; offset 2 returns the remaining row with has_more false."
        test_recipe:
          setup:
            - "NetworkLoop LOOP-Z1 with three PipeSegments SEG-Z1, SEG-Z2, SEG-Z3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-Z1", name: "Zone One Loop", service_mode: "DUAL", design_supply_temp_c: 95.0, max_pressure_kpa: 1600.0, rated_capacity_kw: 9000.0 }
              as: SystemController
              captures: { loop_z1_id: $.data.id }
            - call: "POST /district-energy/pipe-segments"
              payload: { loop_id: "${loop_z1_id}", code: "SEG-Z1", length_m: 400.0, diameter_mm: 200, install_year: 2014, insulation_class: "A", buried_depth_m: 1.4 }
              as: NetworkEngineer
              captures: { seg_z1_id: $.data.id }
            - call: "POST /district-energy/pipe-segments"
              payload: { loop_id: "${loop_z1_id}", code: "SEG-Z2", length_m: 500.0, diameter_mm: 200, install_year: 2014, insulation_class: "A", buried_depth_m: 1.4 }
              as: NetworkEngineer
              captures: { seg_z2_id: $.data.id }
            - call: "POST /district-energy/pipe-segments"
              payload: { loop_id: "${loop_z1_id}", code: "SEG-Z3", length_m: 600.0, diameter_mm: 200, install_year: 2014, insulation_class: "A", buried_depth_m: 1.4 }
              as: NetworkEngineer
              captures: { seg_z3_id: $.data.id }
          trigger:
            - call: "GET /district-energy/pipe-segments"
              payload: { loop_id: "${loop_z1_id}", limit: 2, offset: 0 }
              as: NetworkEngineer
            - call: "GET /district-energy/pipe-segments"
              payload: { loop_id: "${loop_z1_id}", limit: 2, offset: 2 }
              as: NetworkEngineer
          assert:
            - "the first list response has response_type == array, total_count == 3, has_more == true and exactly 2 PipeSegment rows"
            - "the second list response has total_count == 3, has_more == false and exactly 1 PipeSegment row"
            - "the second list response row id == ${seg_z3_id}"
            - "no row in either response has loop_id different from ${loop_z1_id}"

      - name: dispatch_plan_get_with_unknown_id_returns_plan_not_found
        claim_type: Not Found
        grounds:
          - endpoints[GET /district-energy/dispatch-plans/{plan_id}]
          - errors[ERR_PLAN_NOT_FOUND]
        distinguishing_aspect: "A GET against a syntactically valid but unregistered plan id returns HTTP 404 with error_id ERR_PLAN_NOT_FOUND and response_type error."
        test_recipe:
          setup:
            - "Empty database apart from the clock reset."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
          trigger:
            - call: "GET /district-energy/dispatch-plans/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: DispatchOperator
          assert:
            - "the response status is 404"
            - "the response data.error_id == ERR_PLAN_NOT_FOUND"
            - "the response response_type == error"

      - name: rate_schedule_creation_without_tiers_is_rejected_as_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints[POST /district-energy/rate-schedules]
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "tiers has source input with no default, so omitting it returns HTTP 400 ERR_INVALID_REQUEST and no RateSchedule row is created."
        test_recipe:
          setup:
            - "Empty database apart from the clock reset."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
          trigger:
            - call: "POST /district-energy/rate-schedules"
              payload: { code: "RS-BAD", customer_class: "COMMERCIAL_OFFICE", fixed_service_charge: 800.00, demand_charge_per_kw: 12.00, minimum_bill_amount: 4000.00 }
              as: BillingAnalyst
            - call: "GET /district-energy/rate-schedules"
              payload: { customer_class: "COMMERCIAL_OFFICE" }
              as: BillingAnalyst
          assert:
            - "the create response status is 400 with data.error_id == ERR_INVALID_REQUEST"
            - "the subsequent list response has total_count == 0"

      - name: optional_inputs_and_computed_counters_take_their_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.PipeSegment.fields.makeup_water_ratio
          - entities.PipeSegment.fields.historical_leak_count
          - entities.MeteringPoint.fields.multiplier
          - entities.RateSchedule.fields.ratchet_lookback_months
          - entities.ConnectionAgreement.fields.billed_demand_ratchet_kw
        distinguishing_aspect: "Omitting every optional input yields makeup_water_ratio 0.0, historical_leak_count 0, upstream_segment_id null, multiplier 1.0, ratchet_lookback_months 11, billed_demand_ratchet_kw 0.0 and balance_due 0.0 rather than nulls or zeroes chosen by the client."
        test_recipe:
          setup:
            - "NetworkLoop LOOP-Z1, one PipeSegment, one RateSchedule, one ConnectionAgreement, one MeteringPoint — each created with only its required inputs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-Z1", name: "Zone One Loop", service_mode: "DUAL", design_supply_temp_c: 95.0, max_pressure_kpa: 1600.0, rated_capacity_kw: 9000.0 }
              as: SystemController
              captures: { loop_z1_id: $.data.id }
          trigger:
            - call: "POST /district-energy/pipe-segments"
              payload: { loop_id: "${loop_z1_id}", code: "SEG-Z1", length_m: 400.0, diameter_mm: 200, install_year: 2014, insulation_class: "A", buried_depth_m: 1.4 }
              as: NetworkEngineer
              captures: { seg_z1_id: $.data.id, seg_z1_makeup: $.data.makeup_water_ratio, seg_z1_hist: $.data.historical_leak_count, seg_z1_upstream: $.data.upstream_segment_id }
            - call: "POST /district-energy/rate-schedules"
              payload: { code: "RS-C", customer_class: "COMMERCIAL_OFFICE", fixed_service_charge: 800.00, demand_charge_per_kw: 12.00, minimum_bill_amount: 4000.00, tiers: [{ load_factor_max: 100.0, energy_rate_per_mwh: 61.00 }] }
              as: BillingAnalyst
              captures: { rs_c_id: $.data.id, rs_c_lookback: $.data.ratchet_lookback_months }
            - call: "POST /district-energy/connection-agreements"
              payload: { loop_id: "${loop_z1_id}", rate_schedule_id: "${rs_c_id}", customer_name: "Zone One Tower", customer_class: "COMMERCIAL_OFFICE", reserved_capacity_kw: 1000.0, service_mode: "DUAL", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2027-01-01T00:00:00Z" }
              as: BillingAnalyst
              captures: { ag_z1_id: $.data.id, ag_z1_ratchet: $.data.billed_demand_ratchet_kw, ag_z1_balance: $.data.balance_due }
            - call: "POST /district-energy/metering-points"
              payload: { agreement_id: "${ag_z1_id}", segment_id: "${seg_z1_id}", code: "MP-Z1" }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { mp_z1_id: $.data.id, mp_z1_multiplier: $.data.multiplier, mp_z1_count: $.data.reading_count }
          assert:
            - "${seg_z1_makeup} == 0.0"
            - "${seg_z1_hist} == 0"
            - "${seg_z1_upstream} == null"
            - "PipeSegment.${seg_z1_id}.condition == SOUND"
            - "PipeSegment.${seg_z1_id}.leak_risk_score == 0.0"
            - "${rs_c_lookback} == 11"
            - "${ag_z1_ratchet} == 0.0"
            - "${ag_z1_balance} == 0.0"
            - "ConnectionAgreement.${ag_z1_id}.billing_state == CURRENT"
            - "${mp_z1_multiplier} == 1.0"
            - "${mp_z1_count} == 0"
            - "MeteringPoint.${mp_z1_id}.meter_state == INSTALLED"

      - name: meter_reading_multiplied_energy_is_computed_from_the_point_multiplier
        claim_type: Computed Fields
        grounds:
          - entities.MeterReading.fields.multiplied_energy_mwh
          - endpoints[POST /district-energy/metering-points/{point_id}/readings]
          - entities.MeteringPoint.fields.last_reading_energy_mwh
        distinguishing_aspect: "multiplied_energy_mwh has source computed: a register read of 1000.000 MWh on a point with multiplier 2.5 stores 2500.000, and the same call ignores any multiplied_energy_mwh the client tries to send because the field is not in the endpoint's input list."
        test_recipe:
          setup:
            - "COMMISSIONED MeteringPoint MP-Z2 with multiplier 2.5 on an ACTIVE agreement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-Z1", name: "Zone One Loop", service_mode: "DUAL", design_supply_temp_c: 95.0, max_pressure_kpa: 1600.0, rated_capacity_kw: 9000.0 }
              as: SystemController
              captures: { loop_z1_id: $.data.id }
            - call: "POST /district-energy/pipe-segments"
              payload: { loop_id: "${loop_z1_id}", code: "SEG-Z1", length_m: 400.0, diameter_mm: 200, install_year: 2014, insulation_class: "A", buried_depth_m: 1.4 }
              as: NetworkEngineer
              captures: { seg_z1_id: $.data.id }
            - call: "POST /district-energy/rate-schedules"
              payload: { code: "RS-C", customer_class: "COMMERCIAL_OFFICE", fixed_service_charge: 800.00, demand_charge_per_kw: 12.00, minimum_bill_amount: 4000.00, tiers: [{ load_factor_max: 100.0, energy_rate_per_mwh: 61.00 }] }
              as: BillingAnalyst
              captures: { rs_c_id: $.data.id }
            - call: "POST /district-energy/connection-agreements"
              payload: { loop_id: "${loop_z1_id}", rate_schedule_id: "${rs_c_id}", customer_name: "Zone One Tower", customer_class: "COMMERCIAL_OFFICE", reserved_capacity_kw: 1000.0, service_mode: "DUAL", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2027-01-01T00:00:00Z" }
              as: BillingAnalyst
              captures: { ag_z1_id: $.data.id }
            - call: "POST /district-energy/connection-agreements/${ag_z1_id}/activate"
              payload: {}
              as: BillingAnalyst
            - call: "POST /district-energy/metering-points"
              payload: { agreement_id: "${ag_z1_id}", segment_id: "${seg_z1_id}", code: "MP-Z2", multiplier: 2.5 }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { mp_z2_id: $.data.id }
            - call: "POST /district-energy/metering-points/${mp_z2_id}/commission"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
          trigger:
            - call: "POST /district-energy/metering-points/${mp_z2_id}/readings"
              payload: { read_at: "2026-06-01T00:00:00Z", cumulative_energy_mwh: 1000.000, peak_demand_kw: 700.0, read_type: "ACTUAL" }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { rd_z2_id: $.data.id, rd_z2_mult: $.data.multiplied_energy_mwh }
          assert:
            - "the response status is 201"
            - "${rd_z2_mult} == 2500.000"
            - "MeterReading.${rd_z2_id}.cumulative_energy_mwh == 1000.000"
            - "MeteringPoint.${mp_z2_id}.last_reading_energy_mwh == 1000.000"
            - "MeteringPoint.${mp_z2_id}.reading_count == 1"

      - name: system_fields_are_server_generated_and_client_values_are_ignored
        claim_type: System Fields
        grounds:
          - entities.NetworkLoop
          - endpoints[POST /district-energy/network-loops]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "id, created_at, updated_at and version are not in the endpoint's input list, so a create carrying id and created_at in its body still receives a server id and created_at == the logical clock 2026-05-05T00:00:00Z with version 1."
        test_recipe:
          setup:
            - "Logical clock repositioned to 2026-05-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T00:00:00Z" }
              as: SystemController
              captures: { clock_now: $.data.current_utc }
          trigger:
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-Z2", name: "Zone Two Loop", service_mode: "HEATING", design_supply_temp_c: 92.0, max_pressure_kpa: 1300.0, rated_capacity_kw: 4000.0 }
              as: SystemController
              captures: { loop_z2_id: $.data.id, loop_z2_created: $.data.created_at, loop_z2_updated: $.data.updated_at, loop_z2_version: $.data.version }
          assert:
            - "${clock_now} == 2026-05-05T00:00:00Z"
            - "${loop_z2_created} == 2026-05-05T00:00:00Z"
            - "${loop_z2_updated} == 2026-05-05T00:00:00Z"
            - "${loop_z2_version} == 1"
            - "${loop_z2_id} is a server-generated identifier and is not the string LOOP-Z2"

      - name: production_asset_rejects_an_unknown_asset_type_enum_member
        claim_type: Type Constraints
        grounds:
          - entities.ProductionAsset.fields.asset_type
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "asset_type is a closed enum of five members, so HEAT_PUMP returns HTTP 400 ERR_INVALID_REQUEST, and an inverted work-order interval fails the same rule."
        test_recipe:
          setup:
            - "NetworkLoop LOOP-Z1 with one PipeSegment SEG-Z1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-Z1", name: "Zone One Loop", service_mode: "DUAL", design_supply_temp_c: 95.0, max_pressure_kpa: 1600.0, rated_capacity_kw: 9000.0 }
              as: SystemController
              captures: { loop_z1_id: $.data.id }
            - call: "POST /district-energy/pipe-segments"
              payload: { loop_id: "${loop_z1_id}", code: "SEG-Z1", length_m: 400.0, diameter_mm: 200, install_year: 2014, insulation_class: "A", buried_depth_m: 1.4 }
              as: NetworkEngineer
              captures: { seg_z1_id: $.data.id }
          trigger:
            - call: "POST /district-energy/production-assets"
              payload: { loop_id: "${loop_z1_id}", code: "Z_HP", asset_type: "HEAT_PUMP", rated_capacity_kw: 500.0, marginal_cost_per_mwh: 20.00, emission_factor_kg_per_mwh: 50.0 }
              as: SystemController
            - call: "POST /district-energy/work-orders"
              payload: { segment_id: "${seg_z1_id}", loop_id: "${loop_z1_id}", work_type: "INSPECTION", window_start: "2026-09-02T08:00:00Z", window_end: "2026-09-01T08:00:00Z", requires_isolation: false }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "GET /district-energy/production-assets"
              payload: { loop_id: "${loop_z1_id}" }
              as: SystemController
          assert:
            - "the asset create response status is 400 with data.error_id == ERR_INVALID_REQUEST"
            - "the work-order create response status is 400 with data.error_id == ERR_INVALID_REQUEST because window_end is earlier than window_start"
            - "the asset list response has total_count == 0"

      - name: meter_reading_and_dispatch_order_are_immutable_ledger_rows
        claim_type: Immutability
        grounds:
          - entities.MeterReading
          - entities.DispatchOrder
          - endpoints[GET /district-energy/meter-readings/{reading_id}]
          - endpoints[GET /district-energy/dispatch-orders/{order_id}]
        distinguishing_aspect: "Both entities declare common_fields false, so §1.5 exposes no update or delete route for either and their responses carry no version field; the only way to change the record is to append another one."
        test_recipe:
          setup:
            - "COMMISSIONED MeteringPoint MP-Z2 with two register reads appended."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-Z1", name: "Zone One Loop", service_mode: "DUAL", design_supply_temp_c: 95.0, max_pressure_kpa: 1600.0, rated_capacity_kw: 9000.0 }
              as: SystemController
              captures: { loop_z1_id: $.data.id }
            - call: "POST /district-energy/pipe-segments"
              payload: { loop_id: "${loop_z1_id}", code: "SEG-Z1", length_m: 400.0, diameter_mm: 200, install_year: 2014, insulation_class: "A", buried_depth_m: 1.4 }
              as: NetworkEngineer
              captures: { seg_z1_id: $.data.id }
            - call: "POST /district-energy/rate-schedules"
              payload: { code: "RS-C", customer_class: "COMMERCIAL_OFFICE", fixed_service_charge: 800.00, demand_charge_per_kw: 12.00, minimum_bill_amount: 4000.00, tiers: [{ load_factor_max: 100.0, energy_rate_per_mwh: 61.00 }] }
              as: BillingAnalyst
              captures: { rs_c_id: $.data.id }
            - call: "POST /district-energy/connection-agreements"
              payload: { loop_id: "${loop_z1_id}", rate_schedule_id: "${rs_c_id}", customer_name: "Zone One Tower", customer_class: "COMMERCIAL_OFFICE", reserved_capacity_kw: 1000.0, service_mode: "DUAL", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2027-01-01T00:00:00Z" }
              as: BillingAnalyst
              captures: { ag_z1_id: $.data.id }
            - call: "POST /district-energy/connection-agreements/${ag_z1_id}/activate"
              payload: {}
              as: BillingAnalyst
            - call: "POST /district-energy/metering-points"
              payload: { agreement_id: "${ag_z1_id}", segment_id: "${seg_z1_id}", code: "MP-Z2", multiplier: 1.0 }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { mp_z2_id: $.data.id }
            - call: "POST /district-energy/metering-points/${mp_z2_id}/commission"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /district-energy/metering-points/${mp_z2_id}/readings"
              payload: { read_at: "2026-06-01T00:00:00Z", cumulative_energy_mwh: 100.000, peak_demand_kw: 500.0, read_type: "ACTUAL" }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { rd_a_id: $.data.id }
            - call: "POST /district-energy/metering-points/${mp_z2_id}/readings"
              payload: { read_at: "2026-06-15T00:00:00Z", cumulative_energy_mwh: 140.000, peak_demand_kw: 620.0, read_type: "ACTUAL" }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { rd_b_id: $.data.id }
          trigger:
            - call: "GET /district-energy/meter-readings/${rd_a_id}"
              payload: {}
              as: BillingAnalyst
            - call: "GET /district-energy/metering-points/${mp_z2_id}/readings"
              payload: { read_type: "ACTUAL" }
              as: BillingAnalyst
          assert:
            - "the single-read response carries no version field and no updated_at field"
