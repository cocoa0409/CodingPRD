scaffold_difficulty_design:

  # ─────────────────────────────────────────────────────────
  # Rule 1 — Dual-variant calculations across different entity domains
  # Two calculations whose two valid algorithms diverge, on different entity domains.
  # ─────────────────────────────────────────────────────────
  - rule_id: dual_variant_calc
    instances:
      - name: scholarship_allocation_provisional_vs_final
        grounds:
          - calculations.scholarship_allocation
          - calculations.scholarship_allocation.variants.provisional_quote
          - calculations.scholarship_allocation.variants.final_snapshot
          - endpoints.GET /camp/enrollments/{id}/fee-quote
          - endpoints.POST /camp/enrollments/{id}/confirm
          - entities.Enrollment.fields.scholarship_discount_cents
          - entities.ScholarshipAward.fields.consumed_credit_cents
        distinguishing_aspect: |
          On the ScholarshipAward / Enrollment domain, the provisional fee-quote reads the
          CURRENT (live) ScholarshipAward.consumed_credit_cents and CURRENT sibling count,
          while the final confirmation SNAPSHOTS that allocation onto Enrollment at the
          instant of CONFIRMED. The two algorithms produce different scholarship_discount_cents
          for the same Enrollment.id if any peer enrollment confirms between the quote and the
          confirm call. (Forward-looking vs chronological — pinned to chronological at confirm.)
        test_recipe:
          setup:
            - "Family F with one Child C; ScholarshipAward A(total=5000, granted_for_kind=ANY, status=ACTIVE)"
            - "Session S(kind=AFTERSCHOOL, base_weekly_fee_cents=10000, weekly_capacity=10, rainy_day_pool_per_week=0, week_count=1, age 5–12)"
            - "Open S; create Enrollment E1(C, S, week_index=0) in PENDING_AUTH; medical+pickup auth active; 1 emergency contact present"
            - "Peer family F2 with child C2; ScholarshipAward A is single-family, so peer does not consume A. Instead set up: peer Enrollment E2(C2, S, week_index=0) in PENDING_AUTH consuming a DIFFERENT award; ensure A's balance unchanged"
          trigger:
            - "GET /camp/enrollments/E1/fee-quote → record quote_scholarship_discount"
            - "POST /camp/enrollments/E1/confirm → record final_scholarship_discount on Enrollment"
          assert:
            - "quote_scholarship_discount == 5000 (the full balance available at quote time)"
            - "Enrollment.scholarship_discount_cents == 5000 after confirm"
            - "Enrollment.list_fee_cents == 10000"
            - "Enrollment.sibling_discount_cents == 0 (only one confirmed child in family)"
            - "Enrollment.final_fee_cents == 5000"
            - "ScholarshipAward A.consumed_credit_cents == 5000 after confirm; A.status == EXHAUSTED"

      - name: rainy_day_pool_chronological_vs_forward_looking
        grounds:
          - calculations.rainy_day_reroute
          - calculations.rainy_day_reroute.variants.chronological_with_existing_RAINY
          - calculations.rainy_day_reroute.variants.forward_looking_with_existing_RAINY
          - state_machines.SessionDay.NORMAL_to_RAINY
          - entities.SessionDay.fields.rainy_day_used
          - entities.SessionDay.fields.outdoor_headcount
          - entities.Session.fields.rainy_day_pool_per_week
        distinguishing_aspect: |
          On the Session/SessionDay domain (a different entity domain than the
          ScholarshipAward instance above), the rainy_day pool can be allocated two ways:
          (a) chronological-of-persistence: the FIRST day marked RAINY consumes the pool
          regardless of day-date; or (b) forward-looking: sort RAINY days by day_date and
          reallocate. The scaffold pins (a). For the same {day_0 RAINY second, day_1 RAINY first}
          inputs, (a) and (b) yield different rainy_day_used per day.
        test_recipe:
          setup:
            - "Session S(week_count=1, weekly_capacity=10, rainy_day_pool_per_week=5)"
            - "Open S; SessionDay rows day_0 (Mon) and day_1 (Tue) of week_index 0 exist"
            - "Eight CONFIRMED enrollments exist for (S, week_index=0)"
          trigger:
            - "POST /camp/session-days/day_1/set-weather { weather_status: RAINY }"
            - "POST /camp/session-days/day_0/set-weather { weather_status: RAINY }"
          assert:
            - "After first call: day_1.rainy_day_used == 5; day_1.outdoor_headcount == 3"
            - "After second call: day_0.rainy_day_used == 0; day_0.outdoor_headcount == 8"
            - "day_1.rainy_day_used is unchanged at 5 (no retroactive reallocation)"

  # ─────────────────────────────────────────────────────────
  # Rule 2 — Combinatorial formulas across different modes
  # ≥2 instances, in different modes from {(a) ≥3-input non-linear, (b) nested rounding order, (c) circular evaluation order}.
  # ─────────────────────────────────────────────────────────
  - rule_id: combinatorial_formula
    instances:
      - name: sibling_discount_tiered_with_state_filter
        grounds:
          - calculations.sibling_discount
          - calculations.sibling_discount.constants.TIER_PCT
          - entities.Enrollment.fields.list_fee_cents
          - entities.Enrollment.fields.sibling_discount_cents
          - entities.Enrollment.fields.status
        distinguishing_aspect: |
          MODE (a): a formula with ≥3 inputs (Enrollment.list_fee_cents, count N of
          CONFIRMED-status sibling enrollments matching (session_id, week_index, family_id),
          tier table TIER_PCT) whose interaction is non-linear: the discount percentage
          jumps at N=2,3,4 boundaries and depends on a STATE filter (status=CONFIRMED only).
          Two list_fee_cents inputs differ → two final_fee_cents that don't scale linearly.
        test_recipe:
          setup:
            - "Family F with three Children C1, C2, C3, each fully authorized + 1 emergency contact"
            - "Session S(kind=AFTERSCHOOL, base_weekly_fee_cents=10000, weekly_capacity=10, week_count=1, age 5–12, rainy_day_pool_per_week=0)"
            - "Open S; three PENDING_AUTH enrollments E1(C1), E2(C2), E3(C3) for (S, week_index=0)"
          trigger:
            - "POST /camp/enrollments/E1/confirm"
            - "POST /camp/enrollments/E2/confirm"
            - "POST /camp/enrollments/E3/confirm"
          assert:
            - "After E1 confirm: E1.sibling_discount_cents == 0 (N=1 → 0%); E1.final_fee_cents == 10000"
            - "After E2 confirm: E1.sibling_discount_cents == 1000 (recomputed, N=2 → 10%); E2.sibling_discount_cents == 1000; E1.final_fee_cents == 9000; E2.final_fee_cents == 9000"
            - "After E3 confirm: E1.sibling_discount_cents == 1500 (N=3 → 15%); E2.sibling_discount_cents == 1500; E3.sibling_discount_cents == 1500; all three final_fee_cents == 8500"

      - name: sibling_discount_per_line_rounding_order
        grounds:
          - calculations.sibling_discount
          - calculations.sibling_discount.precision
          - entities.Enrollment.fields.sibling_discount_cents
          - entities.Enrollment.fields.final_fee_cents
          - endpoints.GET /camp/families/{id}/invoice
        distinguishing_aspect: |
          MODE (b): nested rounding where ORDER MATTERS. The scaffold PINS per-line-item
          round_half_up of (list_fee_cents * sibling_pct) before any family-level summation.
          For base_weekly_fee_cents=10003 and N=3 siblings (15%): per-line raw = 1500.45
          → per-line rounded = 1500 (per-sibling) → family total discount across 3 lines = 4500.
          ALTERNATE (wrong) order: sum-first = 3 * 1500.45 = 4501.35 → round = 4501.
          A correct implementation MUST report 4500 (per-line, then sum). A divergence of
          exactly 1 cent at the family-invoice level falsifies a sum-then-round implementation.
        test_recipe:
          setup:
            - "Family F with three Children C1, C2, C3; all auth/contact ready"
            - "Session S(kind=AFTERSCHOOL, base_weekly_fee_cents=10003, weekly_capacity=5, week_count=1, age 5–12, rainy_day_pool_per_week=0)"
            - "Open S; create three PENDING_AUTH enrollments for week_index 0"
          trigger:
            - "POST /camp/enrollments/E1/confirm"
            - "POST /camp/enrollments/E2/confirm"
            - "POST /camp/enrollments/E3/confirm"
            - "GET /camp/families/F/invoice?week_start=<session.week_start>"
          assert:
            - "Each Enrollment.sibling_discount_cents == 1500 (per-line round of 1500.45 = 1500)"
            - "Each Enrollment.final_fee_cents == 10003 − 1500 == 8503"
            - "invoice.invoice_total_cents == 3 * 8503 == 25509"
            - "Family-level total sibling discount == 4500 (per-line order), NOT 4501 (sum-then-round)"

      - name: enrollment_fee_evaluation_order_chain
        grounds:
          - calculations.sibling_discount
          - calculations.scholarship_allocation
          - calculations.scholarship_allocation.formula
          - entities.Enrollment.fields.list_fee_cents
          - entities.Enrollment.fields.sibling_discount_cents
          - entities.Enrollment.fields.scholarship_discount_cents
          - entities.Enrollment.fields.final_fee_cents
        distinguishing_aspect: |
          MODE (c): a circular-looking evaluation order. Sibling discount depends on the
          number of currently-CONFIRMED siblings (which itself depends on whether prior
          confirmations succeeded — including whether THEIR scholarship was applied).
          Scholarship_allocation operates on net_payable = list_fee − sibling_discount,
          so its result depends on sibling_discount being computed first. The scaffold pins
          the order: list_fee → sibling_discount → scholarship_allocation → final_fee.
          Reversed order produces different scholarship_discount_cents AND different
          consumed_credit_cents on the ScholarshipAward.
        test_recipe:
          setup:
            - "Family F with two Children C1, C2; both fully authorized + emergency contact"
            - "ScholarshipAward A(family=F, total_credit_cents=2000, granted_for_kind=ANY, status=ACTIVE)"
            - "Session S(kind=AFTERSCHOOL, base_weekly_fee_cents=10000, weekly_capacity=10, week_count=1, age 5–12, rainy_day_pool_per_week=0)"
            - "Open S; two PENDING_AUTH enrollments E1(C1), E2(C2)"
          trigger:
            - "POST /camp/enrollments/E1/confirm"
            - "POST /camp/enrollments/E2/confirm"
          assert:
            - "E1 after confirm: list_fee_cents=10000, sibling_discount_cents=0 (N=1), scholarship_discount_cents=2000 (net=10000, min(2000,10000)=2000), final_fee_cents=8000"
            - "ScholarshipAward A after E1 confirm: consumed_credit_cents=2000, status=EXHAUSTED"
            - "E2 after confirm: list_fee_cents=10000, sibling_discount_cents=1000 (N=2 → 10%), scholarship_discount_cents=0 (A is EXHAUSTED), final_fee_cents=9000"
            - "E1 after E2 confirm cascade: sibling_discount_cents recomputed to 1000; final_fee_cents=10000-1000-2000=7000 (snapshotted scholarship preserved)"

  # ─────────────────────────────────────────────────────────
  # Rule 3 — Non-linear state-machine shape on different entities
  # ≥2 non-linear machines on different entities.
  # ─────────────────────────────────────────────────────────
  - rule_id: non_linear_state_machine
    instances:
      - name: enrollment_branching_with_waitlist_promotion_cycle
        grounds:
          - state_machines.Enrollment
          - state_machines.Enrollment.PENDING_AUTH_to_CONFIRMED
          - state_machines.Enrollment.PENDING_AUTH_to_WAITLISTED
          - state_machines.Enrollment.WAITLISTED_to_CONFIRMED
          - state_machines.Enrollment.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          The Enrollment state machine BRANCHES at the confirm step (PENDING_AUTH →
          {CONFIRMED, WAITLISTED} based on capacity) AND contains a system-driven cycle
          (CONFIRMED → CANCELLED triggers WAITLISTED → CONFIRMED for the next waitlist
          row, which can itself be cancelled and promote another, etc.). Sibling
          recomputation accompanies each promotion. This is not a linear pipeline.
        test_recipe:
          setup:
            - "Family F with Child C; auth + contact ready"
            - "Family F2 with Child C2; auth + contact ready"
            - "Session S(weekly_capacity=1, base_weekly_fee_cents=10000, week_count=1, age 5–12, rainy_day_pool_per_week=0); OPEN"
            - "Enrollment E1(C, S, 0) created in PENDING_AUTH; E2(C2, S, 0) created in PENDING_AUTH"
          trigger:
            - "POST /camp/enrollments/E1/confirm → E1 CONFIRMED"
            - "POST /camp/enrollments/E2/confirm → E2 WAITLISTED (capacity full, branch)"
            - "POST /camp/enrollments/E1/cancel → E1 CANCELLED; system promotes E2"
          assert:
            - "After step 1: E1.status == CONFIRMED; E2.status == PENDING_AUTH"
            - "After step 2: E2.status == WAITLISTED; E2.waitlist_position == 1"
            - "After step 3: E1.status == CANCELLED; E2.status == CONFIRMED; E2.waitlist_position == null"
            - "E2.list_fee_cents == 10000; E2.sibling_discount_cents == 0; E2.final_fee_cents == 10000"

      - name: scholarship_award_cycle_active_exhausted_active
        grounds:
          - state_machines.ScholarshipAward
          - state_machines.ScholarshipAward.ACTIVE_to_EXHAUSTED
          - state_machines.ScholarshipAward.EXHAUSTED_to_ACTIVE
          - entities.ScholarshipAward.fields.consumed_credit_cents
          - entities.ScholarshipAward.fields.total_credit_cents
        distinguishing_aspect: |
          On a DIFFERENT entity (ScholarshipAward), the state machine has a CYCLE:
          ACTIVE → EXHAUSTED → ACTIVE (and possibly back to EXHAUSTED again). Each
          transition is system-triggered by Enrollment confirm/cancel side effects and
          is reversible — this is not a linear A→B→C pipeline. Final state may stabilize
          at ACTIVE or EXHAUSTED depending on the last side-effect.
        test_recipe:
          setup:
            - "Family F + Child C (auth + contact); Session S(base_weekly_fee_cents=10000, weekly_capacity=10, week_count=1, age 5–12, rainy_day_pool_per_week=0); OPEN"
            - "ScholarshipAward A(family=F, total_credit_cents=5000, granted_for_kind=ANY, status=ACTIVE)"
            - "Enrollment E(C, S, 0) in PENDING_AUTH"
          trigger:
            - "POST /camp/enrollments/E/confirm → A → EXHAUSTED"
            - "POST /camp/enrollments/E/cancel → A back to ACTIVE"
          assert:
            - "After confirm: ScholarshipAward A.status == EXHAUSTED; A.consumed_credit_cents == 5000"
            - "After cancel: ScholarshipAward A.status == ACTIVE; A.consumed_credit_cents == 0"

  # ─────────────────────────────────────────────────────────
  # Rule 4 — Transitive cascade chains from different triggers
  # At least one depth-≥3, one depth-≥2, different originating transitions.
  # ─────────────────────────────────────────────────────────
  - rule_id: transitive_cascade
    instances:
      - name: authorization_revoke_cascade_depth_3
        grounds:
          - state_machines.Authorization.ACTIVE_to_REVOKED
          - state_machines.Enrollment.CONFIRMED_to_CANCELLED
          - state_machines.Enrollment.WAITLISTED_to_CONFIRMED
          - state_machines.ScholarshipAward.EXHAUSTED_to_ACTIVE
          - entities.Child.fields.medical_authorization_status
          - calculations.child_authorization_state_projection
          - calculations.sibling_discount
        distinguishing_aspect: |
          ORIGIN: Authorization ACTIVE→REVOKED (POST /camp/authorizations/{id}/revoke).
          DEPTH-3 chain triggered transitively by THAT mutation:
            HOP 1: Authorization.status=REVOKED → re-project Child.medical_authorization_status
                   (caused by HOP 0).
            HOP 2: Child.medical_authorization_status drop → cascade-cancel that child's
                   CONFIRMED future Enrollment (caused by HOP 1's projection result).
            HOP 3: Enrollment CONFIRMED→CANCELLED → ScholarshipAward.consumed_credit_cents
                   refund AND system-promote a WAITLISTED peer (caused by HOP 2).
          Each hop's cause is the PREVIOUS hop's mutation, not the original revoke call.
        test_recipe:
          setup:
            - "Family F + Child C; Guardian G; medical Authorization M(child=C, guardian=G, kind=MEDICAL, status=ACTIVE, expires_at far future)"
            - "Pickup Authorization P(child=C, kind=PICKUP, ACTIVE); 1 emergency contact"
            - "ScholarshipAward A(family=F, total_credit_cents=5000, granted_for_kind=ANY, ACTIVE)"
            - "Session S(weekly_capacity=1, base_weekly_fee_cents=10000, week_count=1, age 5–12, rainy_day_pool_per_week=0); OPEN; week_start in future"
            - "Enrollment E1(C, S, 0) CONFIRMED (consumed A:5000); Family F2/Child C2 in WAITLISTED on (S, 0) as E2"
          trigger:
            - "POST /camp/authorizations/M/revoke"
          assert:
            - "HOP 1: Authorization M.status == REVOKED; Child C.medical_authorization_status == EXPIRED (no other ACTIVE MEDICAL)"
            - "HOP 2: Enrollment E1.status == CANCELLED; E1.cancelled_at != null"
            - "HOP 3a: ScholarshipAward A.consumed_credit_cents == 0; A.status == ACTIVE"
            - "HOP 3b: Enrollment E2.status == CONFIRMED; E2.waitlist_position == null; E2.final_fee_cents == 10000 (no sibling, no award available to family F2)"

      - name: session_cancel_cascade_depth_2
        grounds:
          - state_machines.Session.OPEN_to_CANCELLED
          - state_machines.Enrollment.CONFIRMED_to_CANCELLED
          - state_machines.ScholarshipAward.EXHAUSTED_to_ACTIVE
          - entities.ScholarshipAward.fields.consumed_credit_cents
        distinguishing_aspect: |
          DIFFERENT ORIGIN from the depth-3 instance: Session OPEN→CANCELLED
          (POST /camp/sessions/{id}/cancel). DEPTH-2 chain:
            HOP 1: Session.status=CANCELLED → bulk-cancel every non-terminal Enrollment
                   on that session (caused by HOP 0's session-cancel call).
            HOP 2: each CONFIRMED→CANCELLED Enrollment → ScholarshipAward.consumed_credit_cents
                   refund and (potentially) EXHAUSTED→ACTIVE (caused by HOP 1).
          Hop 2's cause is the per-enrollment cancellation triggered by hop 1, not the
          original session-cancel API call.
        test_recipe:
          setup:
            - "Family F + Child C; auth + contact ready"
            - "ScholarshipAward A(family=F, total_credit_cents=5000, granted_for_kind=ANY, ACTIVE)"
            - "Session S(weekly_capacity=10, base_weekly_fee_cents=10000, week_count=1, age 5–12, rainy_day_pool_per_week=0); OPEN"
            - "Enrollment E(C, S, 0) CONFIRMED with scholarship_discount_cents=5000"
          trigger:
            - "POST /camp/sessions/S/cancel"
          assert:
            - "HOP 1: Session S.status == CANCELLED; Enrollment E.status == CANCELLED; E.cancelled_at != null"
            - "HOP 2: ScholarshipAward A.consumed_credit_cents == 0; A.status == ACTIVE"

  # ─────────────────────────────────────────────────────────
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ≥2 conflicts, different category pairs.
  # ─────────────────────────────────────────────────────────
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: medical_safety_vs_age_constraint_at_creation
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - calculations.child_age_on_reference_date
          - entities.Child.fields.medical_authorization_status
          - endpoints.POST /camp/enrollments
        distinguishing_aspect: |
          Category pair: business_safety (priority 6: ERR_MEDICAL_AUTH_REQUIRED) vs
          business_constraint (priority 10: ERR_AGE_OUT_OF_RANGE). The medical-auth
          safety check is enforced at the creation endpoint along with the age window;
          both fail simultaneously on the same POST /camp/enrollments call, and the
          lower-priority NUMBER (6, safety) MUST win. An implementation that runs the
          constraint (10) before the safety (6) check would return ERR_AGE_OUT_OF_RANGE,
          falsifying this assertion.
        test_recipe:
          setup:
            - "Family F with primary Guardian G; Child C whose date_of_birth makes age == 4 on Session.reference_date"
            - "Session S(kind=AFTERSCHOOL, age_min=8, age_max=12, base_weekly_fee_cents=10000, weekly_capacity=10, week_count=1, rainy_day_pool_per_week=0); status=OPEN"
            - "Child C has an ACTIVE pickup Authorization, 1 EmergencyContact, and NO active medical Authorization"
          trigger:
            - "POST /camp/enrollments { child_id: C.id, session_id: S.id, week_index: 0 } with headers X-User-Role=Guardian, X-User-ID=G.id"
          assert:
            - "Response status == 422"
            - "Response error_id == ERR_MEDICAL_AUTH_REQUIRED (priority 6 wins over priority 10)"
            - "No Enrollment row created"

      - name: age_constraint_vs_week_index_temporal
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - calculations.child_age_on_reference_date
          - entities.Session.fields.week_count
          - endpoints.POST /camp/enrollments
        distinguishing_aspect: |
          DIFFERENT category pair from the prior instance: business_constraint
          (priority 10: ERR_AGE_OUT_OF_RANGE) vs business_temporal (priority 11:
          ERR_INVALID_WEEK_INDEX). On POST /camp/enrollments where BOTH the child is
          age-ineligible AND the supplied week_index is outside [0, Session.week_count),
          priority 10 (constraint) MUST win over priority 11 (temporal). The pair
          {business_constraint, business_temporal} is distinct from the
          {business_safety, business_constraint} pair of instance 1.
        test_recipe:
          setup:
            - "Family F with primary Guardian G; Child C whose date_of_birth makes age == 13 on Session.reference_date"
            - "Session S(kind=AFTERSCHOOL, age_min=5, age_max=12, weekly_capacity=10, week_count=2, base_weekly_fee_cents=10000, rainy_day_pool_per_week=0); status=OPEN"
            - "Child C has ACTIVE medical + pickup Authorizations and 1 EmergencyContact"
          trigger:
            - "POST /camp/enrollments { child_id: C.id, session_id: S.id, week_index: 99 } with headers X-User-Role=Guardian, X-User-ID=G.id"
          assert:
            - "Response status == 422"
            - "Response error_id == ERR_AGE_OUT_OF_RANGE (priority 10 wins over priority 11)"
            - "No Enrollment row created"

  # ─────────────────────────────────────────────────────────
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ≥2 boundaries, different metrics, different endpoints.
  # ─────────────────────────────────────────────────────────
  - rule_id: boundary_precision_check
    instances:
      - name: weekly_capacity_strict_less_than
        grounds:
          - calculations.weekly_capacity_check
          - calculations.weekly_capacity_check.formula
          - state_machines.Enrollment.PENDING_AUTH_to_CONFIRMED
          - state_machines.Enrollment.PENDING_AUTH_to_WAITLISTED
          - endpoints.POST /camp/enrollments/{id}/confirm
        distinguishing_aspect: |
          Numeric threshold boundary: `confirmed_in_week < Session.weekly_capacity`
          (strict `<`, NOT `<=`). With weekly_capacity=2, the SECOND confirmation
          succeeds → CONFIRMED, the THIRD must route to WAITLISTED (not CONFIRMED).
          Endpoint: POST /camp/enrollments/{id}/confirm. Off-by-one implementations
          using `<=` would let the third confirmation succeed.
        test_recipe:
          setup:
            - "Three families F1/F2/F3 with one Child each, all eligible & authorized"
            - "Session S(weekly_capacity=2, base_weekly_fee_cents=10000, week_count=1, age 5–12, rainy_day_pool_per_week=0); OPEN"
            - "Three PENDING_AUTH Enrollments E1, E2, E3 for (S, week_index=0)"
          trigger:
            - "POST /camp/enrollments/E1/confirm"
            - "POST /camp/enrollments/E2/confirm"
            - "POST /camp/enrollments/E3/confirm"
          assert:
            - "E1.status == CONFIRMED (confirmed_count=1 < 2)"
            - "E2.status == CONFIRMED (confirmed_count=2; but check was 1 < 2 at the time of E2.confirm)"
            - "E3.status == WAITLISTED (confirmed_count=2, NOT < 2)"
            - "E3.waitlist_position == 1"

      - name: emergency_contact_zero_count_check
        grounds:
          - validations[priority=8]
          - entities.Child.fields.emergency_contact_count
          - endpoints.POST /camp/enrollments/{id}/confirm
          - endpoints.POST /camp/children/{child_id}/emergency-contacts
        distinguishing_aspect: |
          DIFFERENT METRIC (an empty-collection / zero-count edge, not a numeric threshold)
          and DIFFERENT ENDPOINT (the confirm pre-check on emergency_contact_count ≥ 1).
          When emergency_contact_count == 0 the confirm MUST return
          ERR_EMERGENCY_CONTACT_REQUIRED; when it == 1 the confirm proceeds.
          Boundary: the empty-vs-non-empty edge.
        test_recipe:
          setup:
            - "Family F + Child C; active medical + pickup auth"
            - "Session S(...) OPEN; Enrollment E(C, S, 0) in PENDING_AUTH"
            - "ZERO emergency contacts on C (emergency_contact_count == 0)"
          trigger:
            - "POST /camp/enrollments/E/confirm → expect rejection"
            - "POST /camp/children/C/emergency-contacts { full_name, phone, relationship, priority=1 } → C.emergency_contact_count := 1"
            - "POST /camp/enrollments/E/confirm → expect success"
          assert:
            - "First confirm: status 422, error_id ERR_EMERGENCY_CONTACT_REQUIRED"
            - "After contact create: Child C.emergency_contact_count == 1"
            - "Second confirm: 200, E.status == CONFIRMED"

  # ─────────────────────────────────────────────────────────
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ≥2 dependencies, different entity pairs.
  # ─────────────────────────────────────────────────────────
  - rule_id: cross_entity_state_dependency
    instances:
      - name: enrollment_depends_on_child_auth_state
        grounds:
          - state_machines.Enrollment.PENDING_AUTH_to_CONFIRMED
          - validations[priority=6]
          - validations[priority=7]
          - entities.Child.fields.medical_authorization_status
          - entities.Child.fields.pickup_authorization_status
          - calculations.child_authorization_state_projection
        distinguishing_aspect: |
          ENTITY PAIR: Enrollment ↔ Child. The valid Enrollment transition
          PENDING_AUTH→CONFIRMED depends on the projected medical_authorization_status
          and pickup_authorization_status on the related Child. Mutating the Child's
          projected status (by adding/revoking/expiring Authorization rows) flips
          the validity of the Enrollment transition without any change to the
          Enrollment row itself.
        test_recipe:
          setup:
            - "Family F + Child C; pickup auth active; NO medical auth yet"
            - "Session S(...) OPEN; Enrollment E(C, S, 0) PENDING_AUTH; 1 emergency contact"
          trigger:
            - "POST /camp/enrollments/E/confirm → expect ERR_MEDICAL_AUTH_REQUIRED"
            - "POST /camp/children/C/authorizations { kind=MEDICAL, guardian_id=..., scope_text=..., effective_at=now, expires_at=far-future }"
            - "POST /camp/enrollments/E/confirm → expect 200"
          assert:
            - "First confirm: 422 ERR_MEDICAL_AUTH_REQUIRED"
            - "Between: Child C.medical_authorization_status == ACTIVE"
            - "Second confirm: 200; E.status == CONFIRMED"

      - name: scholarship_award_depends_on_session_kind
        grounds:
          - calculations.scholarship_allocation
          - validations[priority=15]
          - entities.Session.fields.kind
          - entities.ScholarshipAward.fields.granted_for_kind
          - entities.ScholarshipAward.fields.status
        distinguishing_aspect: |
          DIFFERENT PAIR from instance 1: ScholarshipAward ↔ Session. Whether a
          ScholarshipAward may apply to an enrollment depends on Session.kind
          (AFTERSCHOOL vs SUMMER_CAMP). An award with granted_for_kind=SUMMER_CAMP
          is allocatable to an enrollment on a SUMMER_CAMP session but produces
          0 discount for an AFTERSCHOOL session (or ERR_SCHOLARSHIP_INELIGIBLE if
          explicitly named via input).
        test_recipe:
          setup:
            - "Family F + Child C; full auth + contact"
            - "ScholarshipAward A(family=F, total_credit_cents=5000, granted_for_kind=SUMMER_CAMP, status=ACTIVE)"
            - "Session S_AS(kind=AFTERSCHOOL, base_weekly_fee_cents=10000, ..., OPEN)"
            - "Session S_SC(kind=SUMMER_CAMP, base_weekly_fee_cents=10000, ..., OPEN)"
            - "Enrollment E_AS(C, S_AS, 0) PENDING_AUTH; Enrollment E_SC(C, S_SC, 0) PENDING_AUTH"
          trigger:
            - "POST /camp/enrollments/E_AS/confirm"
            - "POST /camp/enrollments/E_SC/confirm"
          assert:
            - "E_AS.scholarship_discount_cents == 0; E_AS.scholarship_award_id == null; E_AS.final_fee_cents == 10000"
            - "E_SC.scholarship_discount_cents == 5000; E_SC.scholarship_award_id == A.id; E_SC.final_fee_cents == 5000"
            - "ScholarshipAward A.consumed_credit_cents == 5000; A.status == EXHAUSTED"

  # ─────────────────────────────────────────────────────────
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ≥2, different interval arithmetic, different resource entities.
  # ─────────────────────────────────────────────────────────
  - rule_id: resource_temporal_overlap
    instances:
      - name: enrollment_per_week_uniqueness_inclusive_week_index
        grounds:
          - validations[priority=14]
          - entities.Enrollment.fields.week_index
          - entities.Enrollment.fields.status
          - endpoints.POST /camp/enrollments
        distinguishing_aspect: |
          RESOURCE: Enrollment. INTERVAL SEMANTICS: discrete weekly slots — the
          "interval" is a single integer week_index. Overlap rule: (child_id,
          session_id, week_index) must be UNIQUE among non-terminal enrollments.
          A second POST for the SAME triple while the first is non-terminal is
          rejected as ERR_DUPLICATE_ENROLLMENT (discrete equality semantics).
        test_recipe:
          setup:
            - "Family F + Child C, all auth ready"
            - "Session S(week_count=4, ..., OPEN)"
            - "Existing PENDING_AUTH Enrollment E1(C, S, week_index=2)"
          trigger:
            - "POST /camp/enrollments { child_id=C, session_id=S, week_index=2 }"
            - "POST /camp/enrollments { child_id=C, session_id=S, week_index=3 } (different week — should succeed)"
          assert:
            - "First POST: 409 ERR_DUPLICATE_ENROLLMENT"
            - "Second POST: 201, new Enrollment created; status == PENDING_AUTH"

      - name: authorization_active_window_half_open_interval
        grounds:
          - calculations.child_authorization_state_projection
          - entities.Authorization.fields.effective_at
          - entities.Authorization.fields.expires_at
          - state_machines.Authorization.ACTIVE_to_EXPIRED
          - endpoints.POST /_clock/advance
        distinguishing_aspect: |
          DIFFERENT RESOURCE (Authorization) and DIFFERENT INTERVAL SEMANTICS
          (half-open `[effective_at, expires_at)` — closed-open interval, with
          aggregate "any ACTIVE" coverage). An authorization is ACTIVE for instants
          t with `effective_at <= t < expires_at`. At t == expires_at it flips to
          EXPIRED. This is continuous time, not the discrete week_index of the
          first instance, and uses half-open boundaries, NOT closed-equality.
        test_recipe:
          setup:
            - "Family F + Child C + Guardian G"
            - "Authorization M(child=C, guardian=G, kind=MEDICAL, effective_at='2026-06-01T00:00:00Z', expires_at='2026-06-02T00:00:00Z', status=ACTIVE)"
            - "Clock starts at '2026-06-01T00:00:00Z'"
          trigger:
            - "GET /camp/children/C → record medical_authorization_status (at instant t=effective_at)"
            - "POST /_clock/advance { iso_timestamp: '2026-06-01T23:59:59Z' }"
            - "GET /camp/children/C → record again"
            - "POST /_clock/advance { iso_timestamp: '2026-06-02T00:00:00Z' }"
            - "GET /camp/children/C → record again"
          assert:
            - "After step 1: Child C.medical_authorization_status == ACTIVE (t == effective_at, included by closed-left boundary)"
            - "After step 3: Child C.medical_authorization_status == ACTIVE (t < expires_at)"
            - "After step 5: Child C.medical_authorization_status == EXPIRED (t == expires_at, excluded by open-right boundary)"
            - "After step 5: Authorization M.status == EXPIRED"

  # ─────────────────────────────────────────────────────────
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ≥2 invariants, different conserved quantities.
  # ─────────────────────────────────────────────────────────
  - rule_id: compensating_invariant
    instances:
      - name: scholarship_credit_invariant_round_trip
        grounds:
          - state_machines.Enrollment.PENDING_AUTH_to_CONFIRMED
          - state_machines.Enrollment.CONFIRMED_to_CANCELLED
          - state_machines.ScholarshipAward.ACTIVE_to_EXHAUSTED
          - state_machines.ScholarshipAward.EXHAUSTED_to_ACTIVE
          - entities.ScholarshipAward.fields.consumed_credit_cents
          - entities.ScholarshipAward.fields.total_credit_cents
        distinguishing_aspect: |
          CONSERVED QUANTITY: ScholarshipAward.total_credit_cents − consumed_credit_cents
          (remaining credit, in cents). FORWARD: confirm an Enrollment that takes
          X cents of credit. COMPENSATING: cancel that same Enrollment.
          INVARIANT (formula): after the round-trip,
          remaining_credit_cents_after == remaining_credit_cents_before (exactly).
          For total=5000, single confirm-then-cancel: pre = 5000, post = 5000.
        test_recipe:
          setup:
            - "Family F + Child C; full auth + contact"
            - "ScholarshipAward A(family=F, total_credit_cents=5000, granted_for_kind=ANY, status=ACTIVE)"
            - "Session S(base_weekly_fee_cents=10000, week_count=1, weekly_capacity=10, age 5–12, rainy_day_pool_per_week=0); OPEN"
            - "Enrollment E(C, S, 0) PENDING_AUTH"
          trigger:
            - "Record remaining_before = ScholarshipAward A.total_credit_cents - A.consumed_credit_cents"
            - "POST /camp/enrollments/E/confirm"
            - "POST /camp/enrollments/E/cancel"
            - "Record remaining_after = ScholarshipAward A.total_credit_cents - A.consumed_credit_cents"
          assert:
            - "remaining_before == 5000"
            - "Mid-state: ScholarshipAward A.consumed_credit_cents == 5000; A.status == EXHAUSTED; E.final_fee_cents == 5000"
            - "remaining_after == 5000"
            - "ScholarshipAward A.status == ACTIVE after cancel"

      - name: weekly_capacity_invariant_round_trip
        grounds:
          - calculations.weekly_capacity_check
          - state_machines.Enrollment.PENDING_AUTH_to_CONFIRMED
          - state_machines.Enrollment.CONFIRMED_to_CANCELLED
          - state_machines.Enrollment.WAITLISTED_to_CONFIRMED
          - entities.Enrollment.fields.status
          - entities.Enrollment.fields.waitlist_position
        distinguishing_aspect: |
          DIFFERENT conserved quantity from instance 1 (NOT money — a SEAT count).
          CONSERVED QUANTITY (formula):
            available_seats_in_week =
              Session.weekly_capacity
              − COUNT(Enrollment WHERE (session_id, week_index) match AND status == CONFIRMED).
          FORWARD: confirm E1 (consumes one seat). COMPENSATING: cancel E1
          (releases one seat). The promotion of E2 from WAITLISTED to CONFIRMED
          re-consumes the seat. Net: available_seats_in_week unchanged across the
          confirm-then-cancel round-trip on E1 when a waitlisted peer exists.
        test_recipe:
          setup:
            - "Family F1/Child C1 + Family F2/Child C2, all auth ready"
            - "Session S(weekly_capacity=1, base_weekly_fee_cents=10000, week_count=1, age 5–12, rainy_day_pool_per_week=0); OPEN"
            - "Enrollment E1(C1, S, 0) PENDING_AUTH; Enrollment E2(C2, S, 0) PENDING_AUTH"
          trigger:
            - "Record seats_before = weekly_capacity - COUNT_CONFIRMED_for(S,0) // == 1 initially"
            - "POST /camp/enrollments/E1/confirm  // E1 CONFIRMED, seats=0"
            - "POST /camp/enrollments/E2/confirm  // E2 WAITLISTED, seats=0"
            - "POST /camp/enrollments/E1/cancel   // E1 CANCELLED → promote E2 → CONFIRMED, seats=0"
            - "Record seats_after = weekly_capacity - COUNT_CONFIRMED_for(S,0)"
          assert:
            - "seats_before == 1"
            - "After E1 confirm: COUNT_CONFIRMED == 1"
            - "After E2 confirm: COUNT_CONFIRMED == 1; E2.status == WAITLISTED; E2.waitlist_position == 1"
            - "After E1 cancel: E1.status == CANCELLED; E2.status == CONFIRMED; E2.waitlist_position == null"
            - "seats_after == 0"
            - "Round-trip seat consumption == 1 (one seat consumed throughout, identity preserved: seats_before − seats_after == 1, matching the single net CONFIRMED enrollment)"
