              as: TreasuryOfficer
              captures: { doc_after: $.data.taxpayer_doc_on_file, treaty_after: $.data.treaty_exempt_claimed }
            - call: "GET /nil/deal-contracts/${dc_id}"
              payload: {}
              as: TreasuryOfficer
              captures: { dc_ver2: $.data.version }
            - call: "POST /nil/payment-releases"
