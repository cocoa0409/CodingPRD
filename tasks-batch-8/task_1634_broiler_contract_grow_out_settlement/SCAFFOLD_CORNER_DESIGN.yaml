            - { call: "POST /api/growers", payload: { grower_code: "G-RB2B", full_name: "Rbac Two B" }, as: IntegratorAdmin, captures: { g2: $.data.id } }
            - { call: "POST /api/houses", payload: { grower_id: "${g1}", house_no: "H1", capacity_birds: 5000 }, as: IntegratorAdmin, captures: { h1: $.data.id } }
            - { call: "POST /api/contracts", payload: { grower_id: "${g1}", contract_no: "C-RB2A", base_pay_cents_per_lb: 6, committed_house_count: 1, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /api/contracts/${c1}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/settlement-groups", payload: { group_code: "WK-RB2", week_ending_date: "2026-12-31" }, as: SettlementAnalyst, captures: { grp: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${h1}", contract_id: "${c1}", settlement_group_id: "${grp}", flock_no: "F-RB2A" }, as: IntegratorAdmin, captures: { f1: $.data.id } }
            - { call: "POST /api/flocks/${f1}/placements", payload: { scheduled_date: "2026-08-01", head_count: 1000 }, as: IntegratorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/placements/${p1}/confirm", payload: {}, as: IntegratorAdmin }
          trigger:
            - { call: "POST /api/flocks/${f1}/mortality-reports", payload: { report_date: "2026-08-10", dead_head: 10, condemned_head: 0 }, as: Grower, as_user_id: "${g2}", captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_UNAUTHORIZED 403 — X-User-ID ${g2} does not match the flock's owning grower ${g1}"

      - name: settlement_analyst_cannot_record_audit
        claim_type: rbac_denial
        grounds: [roles]
        distinguishing_aspect: "SettlementAnalyst invoking POST /api/houses/{id}/audits (ServiceTech-only) -> ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["house exists"]
          setup_api_calls:
            - { call: "POST /api/growers", payload: { grower_code: "G-RB3", full_name: "Rbac Three" }, as: IntegratorAdmin, captures: { g: $.data.id } }
            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H1", capacity_birds: 5000 }, as: IntegratorAdmin, captures: { h: $.data.id } }
          trigger:
            - { call: "POST /api/houses/${h}/audits", payload: { audit_date: "2026-08-10", result: PASS, quarantine_days: 0 }, as: SettlementAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_UNAUTHORIZED 403"

      - name: unauthenticated_request_rejected
        claim_type: rbac_denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Missing X-User-Role header -> ERR_UNAUTHENTICATED 401 before any role/existence check."
        test_recipe:
          setup: ["one grower exists"]
          setup_api_calls:
            - { call: "POST /api/growers", payload: { grower_code: "G-RB4", full_name: "Rbac Four" }, as: IntegratorAdmin, captures: { g: $.data.id } }
          trigger:
            - { call: "GET /api/growers/${g}", payload: {}, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED with http 401"

