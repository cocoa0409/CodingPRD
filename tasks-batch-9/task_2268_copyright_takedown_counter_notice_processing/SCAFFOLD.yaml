  # --- Test-driving endpoint -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. Before any call the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [ComplianceOfficer, TakedownAgent, AbuseInvestigator, RightsHolderRep, Subscriber]
    code: 200
    input: [current_utc]
    output: "{ current_utc }"
    side_effects:
      - "re-evaluates strike decay and expiry, recomputing account_strike_points and account standing"
      - "moves FORWARDED counter-notices whose restoration_earliest_at has passed to RESTORATION_SCHEDULED"
      - "closes EXECUTED termination cases whose appeal_deadline_at has passed without an appeal"

