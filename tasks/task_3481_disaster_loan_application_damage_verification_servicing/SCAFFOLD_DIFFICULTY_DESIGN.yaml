              as: LossVerifier
              as_user_id: "lv-dana"
            - call: "POST /disaster-relief/loan-applications/${app_id}/decision"
              payload: { decision: "APPROVED", collateral_description: "primary residence", collateral_value_cents: 30000000 }
              as: LoanApprover
              captures: { loan_id: $.data.loan_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /disaster-relief/loans/${loan_id}/accept"
              payload: {}
              as: Applicant
              as_user_id: "${ho_id}"
            - call: "GET /disaster-relief/loans/${loan_id}/disbursement-tranches"
              payload: {}
              as: ServicingAgent
              captures: { t1_id: "$.data[0].id", t2_id: "$.data[1].id" }
            - call: "POST /disaster-relief/disbursement-tranches/${t1_id}/release"
              payload: {}
              as: ServicingAgent
            - call: "POST /disaster-relief/loans/${loan_id}/repair-milestones"
              payload: { description: "roof", claimed_cost_cents: 2500000 }
              as: Applicant
              as_user_id: "${ho_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /disaster-relief/repair-milestones/${m1_id}/decision"
              payload: { decision: "VERIFIED", verified_cost_cents: 2500000 }
              as: LossVerifier
              as_user_id: "lv-erin"
            - call: "POST /disaster-relief/disbursement-tranches/${t2_id}/release"
              payload: {}
              as: ServicingAgent
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /disaster-relief/loans/${loan_id}/payments"
              payload: { amount_cents: 100000 }
              as: Applicant
              as_user_id: "${ho_id}"
              captures: { pay_id: $.data.id, p_fee: $.data.fee_portion_cents, p_int: $.data.interest_portion_cents, p_prin: $.data.principal_portion_cents }
            - call: "GET /disaster-relief/loans/${loan_id}"
              payload: {}
