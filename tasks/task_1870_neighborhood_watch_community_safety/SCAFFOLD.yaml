# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: ProgramCoordinator
    description: "Police-department civilian program staff administering the watch program. Superset operational role but barred from officer-exclusive actions (corroborate, clear, certify, schedule meetings/training)."
    identity: "opaque"
    exclusive_operations:
      - "POST /watch/watch-groups"
      - "POST /watch/watch-groups/{id}/certification-suspend"
      - "POST /watch/watch-groups/{id}/certification-reinstate"
      - "POST /watch/watch-groups/{id}/freeze"
      - "POST /watch/watch-groups/{id}/unfreeze"
      - "POST /watch/watch-groups/{id}/materials/issue"
      - "POST /watch/watch-groups/{id}/materials/recall"
      - "POST /watch/watch-groups/{id}/blocks"
      - "POST /watch/blocks/{id}/register"
      - "POST /watch/blocks/{id}/deregister"
      - "POST /watch/blocks/{id}/captain-assignments"
      - "POST /watch/captain-assignments/{id}/relieve"
      - "POST /watch/members/{id}/suspend"
      - "POST /watch/members/{id}/reinstate"
      - "POST /watch/incident-reports/{id}/begin-review"
      - "POST /watch/incident-reports/{id}/request-info"
      - "POST /watch/incident-reports/{id}/dismiss"
      - "POST /watch/alerts/{id}/send"
      - "POST /watch/alerts/{id}/recall"
      - "POST /watch/liaison-officers"
      - "POST /watch/data-share-agreements"
      - "POST /watch/certification-reviews"
      - "POST /watch/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints (all resources)"
      - "POST /watch/members (with BlockCaptain)"
      - "POST /watch/members/{id}/withdraw (with Member self)"
      - "POST /watch/alerts (with BlockCaptain)"
      - "POST /watch/alerts/{id}/queue (with BlockCaptain)"
      - "POST /watch/alerts/{id}/unqueue"
      - "POST /watch/liaison-meetings/{id}/cancel (with LiaisonOfficer)"
      - "POST /watch/data-share-agreements/{id}/revoke (with LiaisonOfficer)"
      - "POST /watch/training-sessions/{id}/cancel (with LiaisonOfficer)"
      - "POST /watch/community-events (with BlockCaptain)"
      - "POST /watch/community-events/{id}/complete"
      - "POST /watch/community-events/{id}/cancel (with LiaisonOfficer)"

  - name: LiaisonOfficer
    description: "Sworn officer liaising with watch groups; chairs meetings, delivers training, corroborates incidents, decides certification."
    identity: "entity_backed:LiaisonOfficer"
    exclusive_operations:
      - "POST /watch/liaison-meetings"
      - "POST /watch/liaison-meetings/{id}/mark-held"
      - "POST /watch/incident-reports/{id}/corroborate"
      - "POST /watch/incident-reports/{id}/clear"
      - "POST /watch/data-share-agreements/{id}/activate"
      - "POST /watch/training-sessions"
      - "POST /watch/training-sessions/{id}/complete"
      - "POST /watch/community-events/{id}/approve"
      - "POST /watch/certification-reviews/{id}/decide"
    shared_operations:
      - "GET endpoints (scoped by roster_visibility and data-share scope)"
      - "POST /watch/liaison-meetings/{id}/cancel (with ProgramCoordinator)"
      - "POST /watch/data-share-agreements/{id}/revoke (with ProgramCoordinator)"
      - "POST /watch/training-sessions/{id}/cancel (with ProgramCoordinator)"
      - "POST /watch/community-events/{id}/cancel (with ProgramCoordinator)"

  - name: BlockCaptain
    description: "Volunteer block captain; drafts and queues alerts, enrolls members, proposes events."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "GET endpoints (all resources)"
      - "POST /watch/members (with ProgramCoordinator)"
      - "POST /watch/alerts (with ProgramCoordinator)"
      - "POST /watch/alerts/{id}/queue (with ProgramCoordinator)"
      - "POST /watch/alerts/{id}/ack (with Member)"
      - "POST /watch/incident-reports (with Member)"
      - "POST /watch/incident-reports/{id}/resubmit (with Member, reporter only)"
      - "POST /watch/community-events (with ProgramCoordinator)"

  - name: Member
    description: "Enrolled watch member; files incident reports, acknowledges alerts, withdraws self."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "GET endpoints (roster scoped by roster_visibility)"
      - "POST /watch/incident-reports (with BlockCaptain)"
      - "POST /watch/incident-reports/{id}/resubmit (reporter only)"
      - "POST /watch/alerts/{id}/ack (with BlockCaptain)"
      - "POST /watch/members/{id}/withdraw (self only; ProgramCoordinator may withdraw anyone)"
