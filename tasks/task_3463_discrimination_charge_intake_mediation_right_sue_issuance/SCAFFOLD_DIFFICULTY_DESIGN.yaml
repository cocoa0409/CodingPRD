            - call: "POST /eeoc/investigation-cases/${inv_i2}/interviews"
              payload: { witness_name: "W2", interview_start: "2026-09-10T11:30:00Z", interview_end: "2026-09-10T12:00:00Z", summary: "exactly 30" }
              as: Investigator
              as_user_id: "inv-007"
              captures: { int_i2: $.data.id }
          assert:
            - "interview 1 (case A, 10:00-11:00) logged"
            - "interview at 11:29 on case B rejected: int_gap20_error == ERR_INTERVIEW_BUFFER_CONFLICT (gap 20 < INTERVIEW_BUFFER_MINUTES 30, and the buffer spans cases for one investigator)"
            - "interview at exactly 11:30 (gap == 30) succeeds — buffer comparison is inclusive-permitting at the exact buffer width"
  - rule_id: compensating_invariant
    instances:
      - name: assign_transfer_conserves_active_assignments
        grounds:
          - entities.InvestigationCase.fields.assigned_investigator_id
          - "endpoints: POST /eeoc/investigation-cases/{id}/assign"
        distinguishing_aspect: |
          Conserved quantity = count of non-terminal investigation assignments
          (a cardinality, not money): the forward action (assign both open cases
          to inv-101) plus its compensating action (transfer case A to inv-102)
          leave the global assignment total unchanged at 2 and restore inv-101's
          caseload to 1 — reassignment moves a slot, it never creates one.
        test_recipe:
          setup:
            - "two charges each declined mediation -> two OPEN InvestigationCases (A and B), both initially unassigned"
          setup_api_calls:
            - call: "POST /eeoc/employers"
              payload: { legal_name: "Load Co", state_code: "FL", employee_count_current: 40 }
              as: IntakeOfficer
