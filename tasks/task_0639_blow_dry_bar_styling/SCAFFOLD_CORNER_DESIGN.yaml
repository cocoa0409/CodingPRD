# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Blow-Dry Bar & Styling — breadth probe
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: entity_create_style_service_returns_201_and_fields
        claim_type: Creation
        grounds:
          - "entities.StyleService.fields.base_duration_minutes"
          - "endpoints"
        distinguishing_aspect: "POST /style-services with all required fields returns 201, status fields stored; active defaults true."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /style-services"
              payload: { name: "Classic Blowout", base_duration_minutes: 45, base_price_cents: 6000 }
              as: FrontDesk
              captures: { svc_id: $.data.id }
          assert:
            - "response.http_status == 201"
            - "StyleService.${svc_id}.base_duration_minutes == 45"
            - "StyleService.${svc_id}.active == true"
            - "StyleService.${svc_id}.blowout_credit_cost == 1"
            - "StyleService.${svc_id}.version == 1"

      - name: entity_get_member_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "entities.Member.fields.id"
          - "errors[ERR_MEMBER_NOT_FOUND]"
        distinguishing_aspect: "GET /members/{id} with a non-existent UUID returns ERR_MEMBER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-4000-8000-000000000111"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_MEMBER_NOT_FOUND"
            - "http_status == 404"

      - name: entity_create_addon_missing_category_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "entities.AddOn.fields.category"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /add-ons omitting the required category field returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /add-ons"
              payload: { name: "Updo", extra_duration_minutes: 30, price_cents: 3300 }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "http_status == 422"

      - name: entity_create_addon_invalid_category_enum_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.AddOn.fields.category"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /add-ons with category not in {UPDO,BRAID,EXTENSION} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /add-ons"
              payload: { name: "Mystery", category: "WIG", extra_duration_minutes: 30, price_cents: 3300 }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "http_status == 422"

      - name: entity_member_default_balances_zero_no_plan
        claim_type: Defaults
        grounds:
          - "entities.Member.fields.blowout_credit_balance"
          - "entities.Member.fields.prepay_balance_cents"
        distinguishing_aspect: "POST /members with no plan -> blowout_credit_balance 0, prepay_balance_cents 0, no_show_strikes 0, status ACTIVE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { full_name: "Plain Member", email: "plain1@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
          assert:
            - "Member.${mem_id}.blowout_credit_balance == 0"
            - "Member.${mem_id}.prepay_balance_cents == 0"
            - "Member.${mem_id}.no_show_strikes == 0"
            - "Member.${mem_id}.status == ACTIVE"

      - name: entity_member_with_plan_seeds_credits
        claim_type: Computed Fields
        grounds:
          - "entities.Member.fields.blowout_credit_balance"
          - "calculations.blowout_credit_balance"
        distinguishing_aspect: "POST /members with a VIP plan (5 credits) seeds blowout_credit_balance to 5."
        test_recipe:
          setup: ["A VIP plan with 5 included credits exists."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "VIP", monthly_fee_cents: 9900, included_blowout_credits: 5, member_discount_pct: 0.25 }
              as: FinanceManager
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { full_name: "VIP", email: "vipcornerlist@x.com", membership_plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
          assert:
            - "Member.${mem_id}.blowout_credit_balance == 5"

      - name: entity_list_members_pagination_envelope
        claim_type: Listing
        grounds:
          - "entities.Member.fields.id"
          - "endpoints"
        distinguishing_aspect: "GET /members returns array envelope with total_count and has_more present."
        test_recipe:
          setup: ["Two members exist."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "A", email: "a-list@x.com" }
              as: FrontDesk
            - call: "POST /members"
              payload: { full_name: "B", email: "b-list@x.com" }
              as: FrontDesk
          trigger:
            - call: "GET /members"
              payload: {}
              as: FrontDesk
          assert:
            - "response.response_type == array"
            - "response.meta.total_count == 2"
            - "response.meta.has_more == false"

      - name: entity_member_duplicate_email_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.Member.fields.email"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Second POST /members with an email already in use returns ERR_INVALID_REQUEST (422); email is unique."
        test_recipe:
          setup: ["A member with email dup@x.com exists."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "First", email: "dup@x.com" }
              as: FrontDesk
          trigger:
            - call: "POST /members"
              payload: { full_name: "Second", email: "dup@x.com" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "http_status == 422"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: sm_start_from_booked_returns_not_checked_in
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Appointment.CHECKED_IN_to_IN_SERVICE"
          - "errors[ERR_APPOINTMENT_NOT_CHECKED_IN]"
        distinguishing_aspect: "POST /appointments/{id}/start on a BOOKED (not CHECKED_IN) appointment returns ERR_APPOINTMENT_NOT_CHECKED_IN (409)."
        test_recipe:
          setup: ["A BOOKED appointment exists."]
          setup_api_calls:
            - call: "POST /style-services"
              payload: { name: "Classic Blowout", base_duration_minutes: 45, base_price_cents: 6000 }
              as: FrontDesk
              captures: { svc_id: $.data.id }
            - call: "POST /chairs"
              payload: { label: "Chair 1", open_minute: 480, close_minute: 1200 }
              as: FrontDesk
              captures: { chair_id: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "Sam", commission_tier: "SENIOR", shift_start_minute: 480, shift_end_minute: 1200 }
              as: FrontDesk
              captures: { sty_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "M", email: "mstart@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /appointments"
              payload: { member_id: "${mem_id}", chair_id: "${chair_id}", stylist_id: "${sty_id}", style_service_id: "${svc_id}", start_minute: 600, payment_method: "CREDIT" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /appointments/${appt_id}/start"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_APPOINTMENT_NOT_CHECKED_IN"
            - "http_status == 409"

      - name: sm_cancel_already_cancelled_returns_not_cancellable
        claim_type: Idempotency
        grounds:
          - "state_machines.Appointment.BOOKED_to_CANCELLED"
          - "errors[ERR_APPOINTMENT_NOT_CANCELLABLE]"
        distinguishing_aspect: "Second POST /appointments/{id}/cancel on an already-CANCELLED appointment returns ERR_APPOINTMENT_NOT_CANCELLABLE (409); no double refund."
        test_recipe:
          setup: ["A CANCELLED appointment (member non-member, no credits)."]
          setup_api_calls:
            - call: "POST /style-services"
              payload: { name: "Classic Blowout", base_duration_minutes: 45, base_price_cents: 6000 }
              as: FrontDesk
              captures: { svc_id: $.data.id }
            - call: "POST /chairs"
              payload: { label: "Chair 1", open_minute: 480, close_minute: 1200 }
              as: FrontDesk
              captures: { chair_id: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "Sam", commission_tier: "SENIOR", shift_start_minute: 480, shift_end_minute: 1200 }
              as: FrontDesk
              captures: { sty_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "M", email: "mcancel@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /appointments"
              payload: { member_id: "${mem_id}", chair_id: "${chair_id}", stylist_id: "${sty_id}", style_service_id: "${svc_id}", start_minute: 600, payment_method: "CREDIT" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/cancel"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /appointments/${appt_id}/cancel"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_APPOINTMENT_NOT_CANCELLABLE"
            - "http_status == 409"

      - name: sm_settle_before_completed_returns_not_completed
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Appointment.UNSETTLED_to_SETTLED"
          - "errors[ERR_APPOINTMENT_NOT_COMPLETED]"
        distinguishing_aspect: "POST /appointments/{id}/settle while lifecycle is still IN_SERVICE returns ERR_APPOINTMENT_NOT_COMPLETED (409) — cross-axis precondition."
        test_recipe:
          setup: ["An IN_SERVICE appointment (not yet COMPLETED)."]
          setup_api_calls:
            - call: "POST /style-services"
              payload: { name: "Classic Blowout", base_duration_minutes: 45, base_price_cents: 6000 }
              as: FrontDesk
              captures: { svc_id: $.data.id }
            - call: "POST /chairs"
              payload: { label: "Chair 1", open_minute: 480, close_minute: 1200 }
              as: FrontDesk
              captures: { chair_id: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "Sam", commission_tier: "SENIOR", shift_start_minute: 480, shift_end_minute: 1200 }
              as: FrontDesk
              captures: { sty_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "M", email: "msettle@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /appointments"
              payload: { member_id: "${mem_id}", chair_id: "${chair_id}", stylist_id: "${sty_id}", style_service_id: "${svc_id}", start_minute: 600, payment_method: "CREDIT" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: { arrival_status: "ON_TIME" }
              as: FrontDesk
            - call: "POST /appointments/${appt_id}/start"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
          trigger:
            - call: "POST /appointments/${appt_id}/settle"
              payload: { tip_cents: 0 }
              as: FinanceManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_APPOINTMENT_NOT_COMPLETED"
            - "http_status == 409"

      - name: sm_no_show_before_start_returns_too_early
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Appointment.BOOKED_to_NO_SHOW"
          - "errors[ERR_NO_SHOW_TOO_EARLY]"
        distinguishing_aspect: "POST /appointments/{id}/no-show before the appointment start_minute (clock at default 00:00 < 600) returns ERR_NO_SHOW_TOO_EARLY (409)."
        test_recipe:
          setup: ["A BOOKED appointment at start_minute 600; clock left at startup default 2026-01-01T00:00:00Z (current_minute 0)."]
          setup_api_calls:
            - call: "POST /style-services"
              payload: { name: "Classic Blowout", base_duration_minutes: 45, base_price_cents: 6000 }
              as: FrontDesk
              captures: { svc_id: $.data.id }
            - call: "POST /chairs"
              payload: { label: "Chair 1", open_minute: 480, close_minute: 1200 }
              as: FrontDesk
              captures: { chair_id: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "Sam", commission_tier: "SENIOR", shift_start_minute: 480, shift_end_minute: 1200 }
              as: FrontDesk
              captures: { sty_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "M", email: "mns@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /appointments"
              payload: { member_id: "${mem_id}", chair_id: "${chair_id}", stylist_id: "${sty_id}", style_service_id: "${svc_id}", start_minute: 600, payment_method: "CREDIT" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /appointments/${appt_id}/no-show"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NO_SHOW_TOO_EARLY"
            - "http_status == 409"

      - name: sm_reopen_in_progress_block_rejected
        claim_type: guarded transitions
        grounds:
          - "state_machines.EventBlock.CONFIRMED_to_HOLD"
          - "errors[ERR_BLOCK_IN_PROGRESS]"
        distinguishing_aspect: "POST /event-blocks/{id}/reopen when a block appointment is CHECKED_IN returns ERR_BLOCK_IN_PROGRESS (409)."
        test_recipe:
          setup: ["A CONFIRMED block whose first appointment is CHECKED_IN (block transitioned to CHECKED_IN)."]
          setup_api_calls:
            - call: "POST /style-services"
              payload: { name: "Classic Blowout", base_duration_minutes: 45, base_price_cents: 6000 }
              as: FrontDesk
              captures: { svc_id: $.data.id }
            - call: "POST /chairs"
              payload: { label: "Chair A", open_minute: 480, close_minute: 1200 }
              as: FrontDesk
              captures: { chair_a: $.data.id }
            - call: "POST /chairs"
              payload: { label: "Chair B", open_minute: 480, close_minute: 1200 }
              as: FrontDesk
              captures: { chair_b: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "S1", commission_tier: "SENIOR", shift_start_minute: 480, shift_end_minute: 1200 }
              as: FrontDesk
              captures: { sty1: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "S2", commission_tier: "SENIOR", shift_start_minute: 480, shift_end_minute: 1200 }
              as: FrontDesk
              captures: { sty2: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Org", email: "orgreopen@x.com" }
              as: FrontDesk
              captures: { org_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "G2", email: "g2reopen@x.com" }
              as: FrontDesk
              captures: { g2_id: $.data.id }
            - call: "POST /event-blocks"
              payload: { organizer_member_id: "${org_id}", block_type: "GROUP", window_start_minute: 540, window_end_minute: 900, reserved_chair_ids: ["${chair_a}", "${chair_b}"], party_size: 2 }
              as: FrontDesk
              captures: { blk_id: $.data.id, blk_v: $.data.version }
            - call: "POST /appointments"
              payload: { member_id: "${org_id}", chair_id: "${chair_a}", stylist_id: "${sty1}", style_service_id: "${svc_id}", start_minute: 600, payment_method: "CREDIT", event_block_id: "${blk_id}", expected_event_block_version: "${blk_v}" }
              as: FrontDesk
              captures: { appt1: $.data.id }
            - call: "GET /event-blocks/${blk_id}"
              payload: {}
              as: FrontDesk
              captures: { blk_v1: $.data.version }
            - call: "POST /appointments"
              payload: { member_id: "${g2_id}", chair_id: "${chair_b}", stylist_id: "${sty2}", style_service_id: "${svc_id}", start_minute: 600, payment_method: "CREDIT", event_block_id: "${blk_id}", expected_event_block_version: "${blk_v1}" }
              as: FrontDesk
              captures: { appt2: $.data.id }
            - call: "POST /event-blocks/${blk_id}/deposit"
              payload: { amount_cents: 4000 }
              as: FrontDesk
              captures: { blk_v2: $.data.version }
            - call: "POST /event-blocks/${blk_id}/confirm"
              payload: { expected_event_block_version: "${blk_v2}" }
              as: FrontDesk
              captures: { blk_v3: $.data.version }
            - call: "POST /appointments/${appt1}/check-in"
              payload: { arrival_status: "ON_TIME" }
              as: FrontDesk
            - call: "GET /event-blocks/${blk_id}"
              payload: {}
              as: FrontDesk
              captures: { blk_v4: $.data.version }
          trigger:
            - call: "POST /event-blocks/${blk_id}/reopen"
              payload: { expected_event_block_version: "${blk_v4}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_BLOCK_IN_PROGRESS"
            - "http_status == 409"

      - name: sm_reinstate_active_member_returns_not_suspended
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Member.SUSPENDED_to_ACTIVE"
          - "errors[ERR_MEMBER_NOT_SUSPENDED]"
        distinguishing_aspect: "POST /members/{id}/reinstate on an ACTIVE member returns ERR_MEMBER_NOT_SUSPENDED (409)."
        test_recipe:
          setup: ["An ACTIVE member exists."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Active", email: "active1@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id, mem_v: $.data.version }
          trigger:
            - call: "POST /members/${mem_id}/reinstate"
              payload: { expected_member_version: "${mem_v}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_MEMBER_NOT_SUSPENDED"
            - "http_status == 409"

      - name: sm_void_already_voided_sale_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.RetailSale.SOLD_to_VOIDED"
          - "errors[ERR_SALE_NOT_VOIDABLE]"
        distinguishing_aspect: "Second POST /retail-sales/{id}/void on a VOIDED sale returns ERR_SALE_NOT_VOIDABLE (409); stock not double-restored."
        test_recipe:
          setup: ["A VOIDED retail sale (product stock fully restored)."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "PV-01", name: "Pomade", unit_price_cents: 2000, initial_stock: 5 }
              as: FrontDesk
              captures: { prod_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Buyer", email: "buyervoid@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /retail-sales"
              payload: { product_id: "${prod_id}", member_id: "${mem_id}", quantity: 2 }
              as: FrontDesk
              captures: { sale_id: $.data.id }
            - call: "POST /retail-sales/${sale_id}/void"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /retail-sales/${sale_id}/void"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SALE_NOT_VOIDABLE"
            - "http_status == 409"
            - "Product.${prod_id}.stock_qty == 5"

      - name: sm_appointment_initial_states
        claim_type: Initial State
        grounds:
          - "state_machines.Appointment.BOOKED_to_CHECKED_IN"
          - "entities.Appointment.fields.lifecycle_status"
        distinguishing_aspect: "A newly booked appointment starts lifecycle_status BOOKED and settlement_status UNSETTLED."
        test_recipe:
          setup: ["Service, chair, stylist, member exist."]
          setup_api_calls:
            - call: "POST /style-services"
              payload: { name: "Classic Blowout", base_duration_minutes: 45, base_price_cents: 6000 }
              as: FrontDesk
              captures: { svc_id: $.data.id }
            - call: "POST /chairs"
              payload: { label: "Chair 1", open_minute: 480, close_minute: 1200 }
              as: FrontDesk
              captures: { chair_id: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "Sam", commission_tier: "SENIOR", shift_start_minute: 480, shift_end_minute: 1200 }
              as: FrontDesk
              captures: { sty_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "M", email: "minit@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { member_id: "${mem_id}", chair_id: "${chair_id}", stylist_id: "${sty_id}", style_service_id: "${svc_id}", start_minute: 600, payment_method: "CREDIT" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
          assert:
            - "Appointment.${appt_id}.lifecycle_status == BOOKED"
            - "Appointment.${appt_id}.settlement_status == UNSETTLED"
            - "Appointment.${appt_id}.scheduled_duration_minutes == 45"
            - "Appointment.${appt_id}.end_minute == 645"

      - name: sm_package_refund_after_credits_used_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.PackagePurchase.ACTIVE_to_REFUNDED"
          - "errors[ERR_CREDITS_ALREADY_USED]"
        distinguishing_aspect: "Refunding a package after its credits were consumed by a booking returns ERR_CREDITS_ALREADY_USED (409)."
        test_recipe:
          setup: ["A non-member with a 2-credit package; one credit consumed by a booking (balance 1 < 2)."]
          setup_api_calls:
            - call: "POST /style-services"
              payload: { name: "Classic Blowout", base_duration_minutes: 45, base_price_cents: 6000, blowout_credit_cost: 1 }
              as: FrontDesk
              captures: { svc_id: $.data.id }
            - call: "POST /chairs"
              payload: { label: "Chair 1", open_minute: 480, close_minute: 1200 }
              as: FrontDesk
              captures: { chair_id: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "Sam", commission_tier: "SENIOR", shift_start_minute: 480, shift_end_minute: 1200 }
              as: FrontDesk
              captures: { sty_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Pkg Member", email: "pkg1@x.com" }
              as: FrontDesk
