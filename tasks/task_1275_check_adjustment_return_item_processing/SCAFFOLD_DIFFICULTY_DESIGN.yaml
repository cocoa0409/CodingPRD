# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index) — task 1275
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: account_balance_provisional_vs_settled
        grounds:
          - calculations.account_balance_derivation
          - entities.DepositorAccount.fields.available_balance_cents
          - entities.DepositorAccount.fields.settled_balance_cents
        distinguishing_aspect: |
          On the DepositorAccount domain, the available variant counts provisional
          ledger entries while the settled variant excludes them: after a deposit
          the two balances differ by exactly the item amount (100000 vs 0), and
          only converge after pay posts SETTLEMENT_CREDIT.
        test_recipe:
          setup:
            - "Account A (STANDARD, opening 0) with one item of 100000 deposited but not yet paid"
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB One", routing_number: "111000025", claim_window_business_days: 3, warranty_window_days: 7, daily_claim_capacity: 10 }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Alice", account_number: "A-100", risk_tier: "STANDARD", reg_cc_eligible: true, opening_balance_cents: 0 }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-1", amount_cents: 100000, encoded_amount_cents: 100000, image_quality_score: 90, capture_channel: "BRANCH" }
              as: ItemProcessor
              captures: { item_id: $.data.id }
            - call: "GET /bank/accounts/${acct_id}"
              as: OperationsAdmin
              captures: { avail_pre: $.data.available_balance_cents, settled_pre: $.data.settled_balance_cents }
            - call: "POST /bank/check-items/${item_id}/present"
              as: ItemProcessor
            - call: "POST /bank/check-items/${item_id}/pay"
              as: ItemProcessor
          trigger:
            - call: "GET /bank/accounts/${acct_id}"
              as: OperationsAdmin
              captures: { avail_post: $.data.available_balance_cents, settled_post: $.data.settled_balance_cents }
          assert:
            - "avail_pre == 100000"
            - "settled_pre == 0"
            - "avail_pre != settled_pre"
            - "avail_post == 100000"
            - "settled_post == 100000"
      - name: claim_aging_business_vs_calendar
        grounds:
          - calculations.claim_aging_days
          - entities.AdjustmentClaim.fields.aging_business_days
          - entities.AdjustmentClaim.fields.aging_calendar_days
        distinguishing_aspect: |
          On the AdjustmentClaim domain (different entity domain than the account
          balance instance), a claim created Friday 2026-05-01 and read Monday
          2026-05-11 shows aging_calendar_days == 10 but aging_business_days == 6
          — the two variants diverge by the weekend days.
        test_recipe:
          setup:
            - "Encoding-error item presented at default clock 2026-05-01 (Friday) produced a DRAFT AdjustmentClaim; clock then advanced to 2026-05-11 (Monday)"
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB Two", routing_number: "111000026", claim_window_business_days: 3, warranty_window_days: 7, daily_claim_capacity: 10 }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Bob", account_number: "A-200", opening_balance_cents: 0 }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-ENC", amount_cents: 100000, encoded_amount_cents: 90000, image_quality_score: 90, capture_channel: "BRANCH" }
              as: ItemProcessor
              captures: { item_id: $.data.id }
            - call: "POST /bank/check-items/${item_id}/present"
              as: ItemProcessor
            - call: "GET /bank/check-items/${item_id}/adjustment-cases"
              as: OperationsAdmin
              captures: { case_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: OperationsAdmin
          trigger:
            - call: "GET /bank/adjustment-cases/${case_id}/claims"
              as: OperationsAdmin
              captures: { cal_days: "$.data[0].aging_calendar_days", biz_days: "$.data[0].aging_business_days", claimed: "$.data[0].claimed_amount_cents" }
          assert:
            - "cal_days == 10"
            - "biz_days == 6"
            - "cal_days != biz_days"
            - "claimed == 10000"

  - rule_id: combinatorial_formula
    instances:
      - name: return_fee_tiered_multiplier
        grounds:
          - calculations.return_item_fee
          - entities.FeeAssessment.fields.amount_cents
        distinguishing_aspect: |
          Mode (a) combinatorial: fee = round_half_up(base[reason] x risk_mult[tier])
          + surcharge_tier(prior_returns) — three inputs with non-linear tiered
          interaction. First NSF return on a HIGH_RISK account costs 3750; the
          second (prior_returns == 1) jumps a surcharge tier to 4250.
        test_recipe:
          setup:
            - "HIGH_RISK account with two items, each presented and returned; both returns coded NSF at the default clock so the second coding sees prior_returns == 1"
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB Fee", routing_number: "111000027", claim_window_business_days: 3, warranty_window_days: 7, daily_claim_capacity: 10 }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Carol", account_number: "A-300", risk_tier: "HIGH_RISK", opening_balance_cents: 1000000 }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-F1", amount_cents: 100000, encoded_amount_cents: 100000, image_quality_score: 90, capture_channel: "BRANCH" }
              as: ItemProcessor
              captures: { item1: $.data.id }
            - call: "POST /bank/check-items/${item1}/present"
              as: ItemProcessor
            - call: "POST /bank/check-items/${item1}/return-events"
              as: ItemProcessor
              captures: { re1: $.data.id }
            - call: "POST /bank/return-events/${re1}/code"
              payload: { reason_code: "NSF" }
              as: ItemProcessor
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-F2", amount_cents: 50000, encoded_amount_cents: 50000, image_quality_score: 90, capture_channel: "ATM" }
              as: ItemProcessor
              captures: { item2: $.data.id }
            - call: "POST /bank/check-items/${item2}/present"
              as: ItemProcessor
            - call: "POST /bank/check-items/${item2}/return-events"
              as: ItemProcessor
              captures: { re2: $.data.id }
            - call: "POST /bank/return-events/${re2}/code"
              payload: { reason_code: "NSF" }
              as: ItemProcessor
          trigger:
            - call: "GET /bank/fees"
              payload: { return_event_id: "${re1}" }
              as: OperationsAdmin
              captures: { fee1_amt: "$.data[0].amount_cents" }
            - call: "GET /bank/fees"
              payload: { return_event_id: "${re2}" }
              as: OperationsAdmin
              captures: { fee2_amt: "$.data[0].amount_cents" }
          assert:
            - "fee1_amt == 3750"
            - "fee2_amt == 4250"
            - "fee2_amt - fee1_amt == 500"
      - name: recredit_provisional_daily_rounding
        grounds:
          - calculations.recredit_provisional_amount
          - entities.RecreditRequest.fields.provisional_amount_cents
        distinguishing_aspect: |
          Mode (b) nested rounding (different mode than the tiered fee): interest
          is rounded per elapsed day THEN summed — principal 133333 over 5 days
          yields 5 x round_half_up(26.6666) = 135, whereas round-once-on-aggregate
          would yield 133; the scaffold pins per-day rounding, total 133468.
        test_recipe:
          setup:
            - "Reg-CC-eligible account with a PAID item of 200000; recredit request for 133333 submitted Friday 2026-05-01; clock advanced 5 calendar days to Wednesday 2026-05-06"
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB RC", routing_number: "111000028", claim_window_business_days: 3, warranty_window_days: 7, daily_claim_capacity: 10 }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Dave", account_number: "A-400", risk_tier: "STANDARD", reg_cc_eligible: true, opening_balance_cents: 0 }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-RC", amount_cents: 200000, encoded_amount_cents: 200000, image_quality_score: 90, capture_channel: "BRANCH" }
              as: ItemProcessor
              captures: { item_id: $.data.id }
            - call: "POST /bank/check-items/${item_id}/present"
              as: ItemProcessor
            - call: "POST /bank/check-items/${item_id}/pay"
              as: ItemProcessor
            - call: "POST /bank/recredit-requests"
              payload: { depositor_account_id: "${acct_id}", check_item_id: "${item_id}", claimed_amount_cents: 133333, reason: "substitute check charged incorrectly" }
              as: CustomerService
              captures: { rr_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-06T00:00:00Z" }
              as: OperationsAdmin
          trigger:
            - call: "POST /bank/recredit-requests/${rr_id}/provisional-credit"
              as: CustomerService
              captures: { rr_principal: $.data.principal_amount_cents, rr_interest: $.data.interest_cents, rr_total: $.data.provisional_amount_cents, rr_late: $.data.provisioned_late }
          assert:
            - "rr_principal == 133333"
            - "rr_interest == 135"
            - "rr_total == 133468"
            - "rr_late == true"

  - rule_id: non_linear_state_machine
    instances:
      - name: check_item_return_represent_cycle
        grounds:
          - state_machines.CheckItem.RETURNED_to_PRESENTED
          - state_machines.CheckItem.PRESENTED_to_RETURNED
          - calculations.re_presentment_eligibility
        distinguishing_aspect: |
          CheckItem is cyclic: PRESENTED -> RETURNED -> PRESENTED -> RETURNED is
          traversable while presentment_count < 2; the loop closes only when the
          count boundary is hit (terminal-ish RETURNED with no further represent).
        test_recipe:
          setup:
            - "STANDARD account (opening 500000) with one item 50000 that has been presented, returned, and coded NSF (eligible)"
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB Cyc", routing_number: "111000029", claim_window_business_days: 3, warranty_window_days: 7, daily_claim_capacity: 10 }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Erin", account_number: "A-500", risk_tier: "STANDARD", opening_balance_cents: 500000 }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-CYC", amount_cents: 50000, encoded_amount_cents: 50000, image_quality_score: 90, capture_channel: "BRANCH" }
              as: ItemProcessor
              captures: { item_id: $.data.id }
            - call: "POST /bank/check-items/${item_id}/present"
              as: ItemProcessor
            - call: "POST /bank/check-items/${item_id}/return-events"
              as: ItemProcessor
              captures: { re1: $.data.id }
            - call: "POST /bank/return-events/${re1}/code"
              payload: { reason_code: "NSF" }
              as: ItemProcessor
          trigger:
            - call: "POST /bank/check-items/${item_id}/represent"
              as: ItemProcessor
              captures: { st_after_represent: $.data.status, count_after_represent: $.data.presentment_count }
            - call: "POST /bank/check-items/${item_id}/return-events"
              as: ItemProcessor
              captures: { re2: $.data.id }
            - call: "POST /bank/return-events/${re2}/code"
              payload: { reason_code: "NSF" }
              as: ItemProcessor
            - call: "POST /bank/check-items/${item_id}/represent"
              as: ItemProcessor
              captures: { err_third: $.data.error_id }
          assert:
            - "st_after_represent == 'PRESENTED'"
            - "count_after_represent == 2"
            - "err_third == 'ERR_MAX_PRESENTMENTS_EXCEEDED'"
      - name: adjustment_case_resolve_reopen_cycle
        grounds:
          - state_machines.AdjustmentCase.RESOLVED_to_REOPENED
          - state_machines.AdjustmentCase.REOPENED_to_ASSIGNED
          - concurrency_rules[case-assign-stale-version]
        distinguishing_aspect: |
          AdjustmentCase (different entity than CheckItem) is cyclic through
          RESOLVED -> REOPENED -> ASSIGNED -> RESOLVED: reopen_count increments and
          the case can be re-resolved after re-assignment with a fresh OCC version.
        test_recipe:
          setup:
            - "RETURN_ITEM case created by the return flow and assigned to analyst-1"
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB Case", routing_number: "111000030", claim_window_business_days: 3, warranty_window_days: 7, daily_claim_capacity: 10 }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Frank", account_number: "A-600", opening_balance_cents: 500000 }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-CASE", amount_cents: 40000, encoded_amount_cents: 40000, image_quality_score: 90, capture_channel: "BRANCH" }
              as: ItemProcessor
              captures: { item_id: $.data.id }
            - call: "POST /bank/check-items/${item_id}/present"
              as: ItemProcessor
            - call: "POST /bank/check-items/${item_id}/return-events"
              as: ItemProcessor
            - call: "GET /bank/check-items/${item_id}/adjustment-cases"
              as: OperationsAdmin
              captures: { case_id: "$.data[0].id", case_v: "$.data[0].version" }
            - call: "POST /bank/adjustment-cases/${case_id}/assign"
              payload: { assigned_analyst_id: "analyst-1", expected_adjustment_case_version: "${case_v}" }
              as: OperationsAdmin
            - call: "POST /bank/adjustment-cases/${case_id}/resolve"
              payload: { disposition: "NO_ACTION" }
              as: AdjustmentAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /bank/adjustment-cases/${case_id}/reopen"
              payload: { reopen_reason: "new evidence from clearing bank" }
              as: ComplianceOfficer
              captures: { st_reopened: $.data.status, rc: $.data.reopen_count, case_v2: $.data.version }
            - call: "POST /bank/adjustment-cases/${case_id}/assign"
              payload: { assigned_analyst_id: "analyst-2", expected_adjustment_case_version: "${case_v2}" }
              as: OperationsAdmin
              captures: { st_reassigned: $.data.status }
            - call: "POST /bank/adjustment-cases/${case_id}/resolve"
              payload: { disposition: "NO_ACTION" }
              as: AdjustmentAnalyst
              as_user_id: "analyst-2"
              captures: { st_final: $.data.status }
          assert:
            - "st_reopened == 'REOPENED'"
            - "rc == 1"
            - "st_reassigned == 'ASSIGNED'"
            - "st_final == 'RESOLVED'"

  - rule_id: transitive_cascade
    instances:
      - name: return_coding_fee_freezes_account
        grounds:
          - state_machines.ReturnEvent.PENDING_CODING_to_CODED
          - state_machines.DepositorAccount.ACTIVE_to_FROZEN
          - calculations.return_item_fee
        distinguishing_aspect: |
          Depth-3 cascade from a single trigger (POST /bank/return-events/{id}/code):
          coding flips the ReturnEvent to CODED, which itself creates the
          FeeAssessment and posts FEE_DEBIT, which itself recomputes the account
          balance and auto-freezes it when available_balance_cents goes negative.
        test_recipe:
          setup:
            - "STANDARD account (opening 0) with item 100000 presented then returned: available_balance_cents == 0 after the return debit, account still ACTIVE"
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB Frz", routing_number: "111000031", claim_window_business_days: 3, warranty_window_days: 7, daily_claim_capacity: 10 }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Grace", account_number: "A-700", risk_tier: "STANDARD", opening_balance_cents: 0 }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-FRZ", amount_cents: 100000, encoded_amount_cents: 100000, image_quality_score: 90, capture_channel: "BRANCH" }
              as: ItemProcessor
              captures: { item_id: $.data.id }
            - call: "POST /bank/check-items/${item_id}/present"
              as: ItemProcessor
            - call: "POST /bank/check-items/${item_id}/return-events"
              as: ItemProcessor
              captures: { re1: $.data.id }
            - call: "GET /bank/accounts/${acct_id}"
              as: OperationsAdmin
              captures: { acct_status_pre: $.data.status, avail_pre: $.data.available_balance_cents }
          trigger:
            - call: "POST /bank/return-events/${re1}/code"
              payload: { reason_code: "NSF" }
              as: ItemProcessor
              captures: { re_status: $.data.status }
            - call: "GET /bank/fees"
              payload: { return_event_id: "${re1}" }
              as: OperationsAdmin
              captures: { fee_amt: "$.data[0].amount_cents", fee_status: "$.data[0].status" }
            - call: "GET /bank/accounts/${acct_id}"
              as: OperationsAdmin
              captures: { acct_status_post: $.data.status, avail_post: $.data.available_balance_cents }
          assert:
            - "acct_status_pre == 'ACTIVE'"
            - "avail_pre == 0"
            - "re_status == 'CODED'"
            - "fee_amt == 2500"
            - "fee_status == 'POSTED'"
            - "avail_post == -2500"
            - "acct_status_post == 'FROZEN'"
      - name: claim_writeoff_closes_case_cascade
        grounds:
          - state_machines.AdjustmentClaim.DENIED_to_WRITTEN_OFF
          - state_machines.AdjustmentCase.RESOLVED_to_CLOSED
          - state_machines.CustomerNotification.transitions
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (POST write-off, not return
          coding): write-off flips the claim to WRITTEN_OFF, which itself bubbles
          the RESOLVED case to CLOSED (no non-terminal children remain), which
          itself creates a CASE_CLOSED CustomerNotification.
        test_recipe:
          setup:
            - "ENCODING_ERROR case with its auto DRAFT claim, assigned, submitted, acknowledged, settled DENIED, and the case RESOLVED (NO_ACTION); clock advanced so aging_business_days == 30 on 2026-06-12"
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB WO", routing_number: "111000032", claim_window_business_days: 3, warranty_window_days: 7, daily_claim_capacity: 10 }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Heidi", account_number: "A-800", opening_balance_cents: 0 }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-WO", amount_cents: 100000, encoded_amount_cents: 90000, image_quality_score: 90, capture_channel: "BRANCH" }
              as: ItemProcessor
              captures: { item_id: $.data.id }
            - call: "POST /bank/check-items/${item_id}/present"
              as: ItemProcessor
            - call: "GET /bank/check-items/${item_id}/adjustment-cases"
              as: OperationsAdmin
              captures: { case_id: "$.data[0].id", case_v: "$.data[0].version" }
            - call: "POST /bank/adjustment-cases/${case_id}/assign"
              payload: { assigned_analyst_id: "analyst-1", expected_adjustment_case_version: "${case_v}" }
              as: OperationsAdmin
            - call: "GET /bank/adjustment-cases/${case_id}/claims"
              as: OperationsAdmin
              captures: { claim_id: "$.data[0].id" }
            - call: "POST /bank/adjustment-claims/${claim_id}/submit"
              as: AdjustmentAnalyst
              as_user_id: "analyst-1"
            - call: "POST /bank/adjustment-claims/${claim_id}/acknowledge"
              as: OperationsAdmin
            - call: "POST /bank/adjustment-claims/${claim_id}/settle"
              payload: { outcome: "DENIED" }
              as: AdjustmentAnalyst
              as_user_id: "analyst-1"
            - call: "POST /bank/adjustment-cases/${case_id}/resolve"
              payload: { disposition: "NO_ACTION" }
              as: AdjustmentAnalyst
              as_user_id: "analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-12T00:00:00Z" }
              as: OperationsAdmin
          trigger:
            - call: "POST /bank/adjustment-claims/${claim_id}/write-off"
              payload: { write_off_reason: "uncollectible after 30 business days" }
              as: ComplianceOfficer
              captures: { claim_status: $.data.status }
            - call: "GET /bank/adjustment-cases/${case_id}"
              as: OperationsAdmin
              captures: { case_status: $.data.status }
            - call: "GET /bank/notifications"
              payload: { adjustment_case_id: "${case_id}" }
              as: OperationsAdmin
              captures: { notif_type: "$.data[0].notification_type", notif_status: "$.data[0].status" }
          assert:
            - "claim_status == 'WRITTEN_OFF'"
            - "case_status == 'CLOSED'"
            - "notif_type == 'CASE_CLOSED'"
            - "notif_status == 'PENDING'"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: claim_submit_state_vs_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - state_machines.AdjustmentClaim.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Error-category pair state vs business_temporal: a claim already SETTLED
          (state violation, priority 6) whose claim window has also expired
          (temporal violation, priority 8) must surface ERR_INVALID_STATE, not
          ERR_CLAIM_WINDOW_EXPIRED.
        test_recipe:
          setup:
            - "Claim fully settled (ACKNOWLEDGED -> SETTLED) and clock advanced to 2026-05-11, beyond the 3-business-day claim window"
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB PC", routing_number: "111000033", claim_window_business_days: 3, warranty_window_days: 7, daily_claim_capacity: 10 }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Ivan", account_number: "A-900", opening_balance_cents: 0 }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-PC", amount_cents: 100000, encoded_amount_cents: 90000, image_quality_score: 90, capture_channel: "BRANCH" }
              as: ItemProcessor
              captures: { item_id: $.data.id }
            - call: "POST /bank/check-items/${item_id}/present"
              as: ItemProcessor
            - call: "GET /bank/check-items/${item_id}/adjustment-cases"
              as: OperationsAdmin
              captures: { case_id: "$.data[0].id", case_v: "$.data[0].version" }
            - call: "POST /bank/adjustment-cases/${case_id}/assign"
              payload: { assigned_analyst_id: "analyst-1", expected_adjustment_case_version: "${case_v}" }
              as: OperationsAdmin
            - call: "GET /bank/adjustment-cases/${case_id}/claims"
              as: OperationsAdmin
              captures: { claim_id: "$.data[0].id" }
            - call: "POST /bank/adjustment-claims/${claim_id}/submit"
              as: AdjustmentAnalyst
              as_user_id: "analyst-1"
            - call: "POST /bank/adjustment-claims/${claim_id}/acknowledge"
              as: OperationsAdmin
            - call: "POST /bank/adjustment-claims/${claim_id}/settle"
              payload: { outcome: "SETTLED", recovered_amount_cents: 10000 }
              as: AdjustmentAnalyst
              as_user_id: "analyst-2"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: OperationsAdmin
          trigger:
            - call: "POST /bank/adjustment-claims/${claim_id}/submit"
              as: AdjustmentAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_INVALID_STATE'"
      - name: recredit_referential_vs_fiscal
        grounds:
          - validations[priority=10]
          - validations[priority=11]
        distinguishing_aspect: |
          Error-category pair business_referential vs business_fiscal (different
          pair than state-vs-temporal): a recredit request whose check_item_id
          belongs to a different account (referential) AND whose claimed amount
          exceeds the item amount (fiscal) must surface ERR_RECREDIT_ITEM_MISMATCH.
        test_recipe:
          setup:
            - "Accounts A (requesting) and B (owns the PAID 50000 item); CustomerService files the request so ownership checks do not interfere"
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB RF", routing_number: "111000034", claim_window_business_days: 3, warranty_window_days: 7, daily_claim_capacity: 10 }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Judy", account_number: "A-1000", reg_cc_eligible: true, opening_balance_cents: 0 }
              as: OperationsAdmin
              captures: { acct_a: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Karl", account_number: "A-1001", reg_cc_eligible: true, opening_balance_cents: 0 }
              as: OperationsAdmin
              captures: { acct_b: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_b}", clearing_bank_id: "${cb_id}", item_reference: "ITM-B", amount_cents: 50000, encoded_amount_cents: 50000, image_quality_score: 90, capture_channel: "BRANCH" }
              as: ItemProcessor
              captures: { item_b: $.data.id }
            - call: "POST /bank/check-items/${item_b}/present"
              as: ItemProcessor
            - call: "POST /bank/check-items/${item_b}/pay"
              as: ItemProcessor
          trigger:
            - call: "POST /bank/recredit-requests"
              payload: { depositor_account_id: "${acct_a}", check_item_id: "${item_b}", claimed_amount_cents: 999999, reason: "mismatch and over-claim" }
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_RECREDIT_ITEM_MISMATCH'"

  - rule_id: boundary_precision_check
    instances:
      - name: large_item_threshold_exact
        grounds:
          - calculations.large_item_classification
          - entities.CheckItem.fields.is_large_item
        distinguishing_aspect: |
          Amount metric boundary at POST /bank/check-items: amount_cents == 500000
          (exactly the threshold) triggers UNDER_REVIEW with an auto HoldDecision,
          while 499999 stays RECEIVED with no hold — the boundary is inclusive (>=).
        test_recipe:
          setup:
            - "Active account and clearing bank; two deposits at the exact boundary and one cent below"
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB LI", routing_number: "111000035", claim_window_business_days: 3, warranty_window_days: 7, daily_claim_capacity: 10 }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Liam", account_number: "A-1100", opening_balance_cents: 0 }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-AT", amount_cents: 500000, encoded_amount_cents: 500000, image_quality_score: 90, capture_channel: "BRANCH" }
              as: ItemProcessor
              captures: { item_at: $.data.id, st_at: $.data.status, large_at: $.data.is_large_item }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-BELOW", amount_cents: 499999, encoded_amount_cents: 499999, image_quality_score: 90, capture_channel: "BRANCH" }
              as: ItemProcessor
              captures: { item_below: $.data.id, st_below: $.data.status, large_below: $.data.is_large_item }
          trigger:
            - call: "GET /bank/check-items/${item_at}/hold-decisions"
              as: OperationsAdmin
              captures: { holds_at: "$.data[0].id" }
            - call: "GET /bank/check-items/${item_below}/hold-decisions"
              as: OperationsAdmin
          assert:
            - "st_at == 'UNDER_REVIEW'"
            - "large_at == true"
            - "holds_at is non-null (exactly one auto HoldDecision exists for the at-threshold item)"
            - "st_below == 'RECEIVED'"
            - "large_below == false"
            - "the below-threshold item has zero hold decisions"
      - name: represent_count_boundary
        grounds:
          - state_machines.CheckItem.RETURNED_to_PRESENTED
          - calculations.re_presentment_eligibility
        distinguishing_aspect: |
          Count metric boundary at POST /bank/check-items/{id}/represent (different
          metric and endpoint than the amount threshold): presentment_count == 1
          allows re-presentment, but presentment_count == 2 (== MAX_PRESENTMENTS)
          is rejected with ERR_MAX_PRESENTMENTS_EXCEEDED.
        test_recipe:
          setup:
            - "Item presented once, returned, coded NSF (eligible) — presentment_count == 1"
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB MX", routing_number: "111000036", claim_window_business_days: 3, warranty_window_days: 7, daily_claim_capacity: 10 }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Mona", account_number: "A-1200", opening_balance_cents: 500000 }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-MX", amount_cents: 50000, encoded_amount_cents: 50000, image_quality_score: 90, capture_channel: "BRANCH" }
              as: ItemProcessor
              captures: { item_id: $.data.id }
            - call: "POST /bank/check-items/${item_id}/present"
              as: ItemProcessor
            - call: "POST /bank/check-items/${item_id}/return-events"
              as: ItemProcessor
              captures: { re1: $.data.id }
            - call: "POST /bank/return-events/${re1}/code"
              payload: { reason_code: "NSF" }
              as: ItemProcessor
          trigger:
            - call: "POST /bank/check-items/${item_id}/represent"
              as: ItemProcessor
              captures: { st1: $.data.status, cnt1: $.data.presentment_count }
            - call: "POST /bank/check-items/${item_id}/return-events"
              as: ItemProcessor
              captures: { re2: $.data.id }
            - call: "POST /bank/return-events/${re2}/code"
              payload: { reason_code: "NSF" }
              as: ItemProcessor
            - call: "POST /bank/check-items/${item_id}/represent"
              as: ItemProcessor
              captures: { err2: $.data.error_id }
          assert:
            - "st1 == 'PRESENTED'"
            - "cnt1 == 2"
            - "err2 == 'ERR_MAX_PRESENTMENTS_EXCEEDED'"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: present_requires_clearing_bank_active
        grounds:
          - state_machines.CheckItem.RECEIVED_to_PRESENTED
          - entities.ClearingBank.fields.status
        distinguishing_aspect: |
          CheckItem -> ClearingBank dependency: present on an item whose clearing
          bank is SUSPENDED is rejected with ERR_CLEARING_BANK_SUSPENDED even
          though the item itself is in a valid RECEIVED state.
        test_recipe:
          setup:
            - "One SUSPENDED clearing bank and one RECEIVED item referencing it"
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB Susp", routing_number: "111000037", claim_window_business_days: 3, warranty_window_days: 7, daily_claim_capacity: 10, status: "SUSPENDED" }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Nina", account_number: "A-1300", opening_balance_cents: 0 }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-SUS", amount_cents: 10000, encoded_amount_cents: 10000, image_quality_score: 90, capture_channel: "BRANCH" }
              as: ItemProcessor
              captures: { item_id: $.data.id, st0: $.data.status }
          trigger:
            - call: "POST /bank/check-items/${item_id}/present"
              as: ItemProcessor
              captures: { err: $.data.error_id }
          assert:
            - "st0 == 'RECEIVED'"
            - "err == 'ERR_CLEARING_BANK_SUSPENDED'"
      - name: claim_submit_requires_case_assigned
        grounds:
          - state_machines.AdjustmentClaim.DRAFT_to_SUBMITTED
          - state_machines.AdjustmentCase.OPEN_to_ASSIGNED
        distinguishing_aspect: |
          AdjustmentClaim -> AdjustmentCase dependency (different entity pair):
          submitting a DRAFT claim while its case is still OPEN fails with
          ERR_INVALID_STATE; after the case is assigned, the same submit succeeds.
        test_recipe:
          setup:
            - "Encoding-error presentment produced a case (OPEN) with an auto DRAFT claim; no assignment yet"
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB CS", routing_number: "111000038", claim_window_business_days: 3, warranty_window_days: 7, daily_claim_capacity: 10 }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Omar", account_number: "A-1400", opening_balance_cents: 0 }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-CS", amount_cents: 100000, encoded_amount_cents: 80000, image_quality_score: 90, capture_channel: "BRANCH" }
              as: ItemProcessor
              captures: { item_id: $.data.id }
            - call: "POST /bank/check-items/${item_id}/present"
              as: ItemProcessor
            - call: "GET /bank/check-items/${item_id}/adjustment-cases"
              as: OperationsAdmin
              captures: { case_id: "$.data[0].id", case_v: "$.data[0].version" }
            - call: "GET /bank/adjustment-cases/${case_id}/claims"
              as: OperationsAdmin
              captures: { claim_id: "$.data[0].id" }
          trigger:
            - call: "POST /bank/adjustment-claims/${claim_id}/submit"
              as: AdjustmentAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
            - call: "POST /bank/adjustment-cases/${case_id}/assign"
              payload: { assigned_analyst_id: "analyst-1", expected_adjustment_case_version: "${case_v}" }
              as: OperationsAdmin
            - call: "POST /bank/adjustment-claims/${claim_id}/submit"
              as: AdjustmentAnalyst
              as_user_id: "analyst-1"
              captures: { claim_status: $.data.status }
          assert:
            - "err == 'ERR_INVALID_STATE'"
            - "claim_status == 'SUBMITTED'"

  - rule_id: resource_temporal_overlap
    instances:
      - name: account_freeze_closed_interval_overlap
        grounds:
          - calculations.freeze_window_overlap
          - entities.AccountFreeze.fields.start_at
        distinguishing_aspect: |
          DepositorAccount freeze windows use CLOSED-interval semantics: a freeze
          [2026-05-08, 2026-05-12] touching an existing [2026-05-04, 2026-05-08]
          at the shared endpoint 2026-05-08 counts as overlap and is rejected,
          while a freeze starting 2026-05-09 is accepted.
        test_recipe:
          setup:
            - "Account with one freeze [2026-05-04T00:00:00Z, 2026-05-08T00:00:00Z]"
          setup_api_calls:
            - call: "POST /bank/accounts"
              payload: { customer_name: "Paul", account_number: "A-1500", opening_balance_cents: 0 }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/accounts/${acct_id}/freezes"
              payload: { start_at: "2026-05-04T00:00:00Z", end_at: "2026-05-08T00:00:00Z", reason: "fraud review" }
              as: ComplianceOfficer
              captures: { fz1: $.data.id }
          trigger:
            - call: "POST /bank/accounts/${acct_id}/freezes"
              payload: { start_at: "2026-05-08T00:00:00Z", end_at: "2026-05-12T00:00:00Z", reason: "touching extension" }
              as: ComplianceOfficer
              captures: { err_touch: $.data.error_id }
            - call: "POST /bank/accounts/${acct_id}/freezes"
              payload: { start_at: "2026-05-09T00:00:00Z", end_at: "2026-05-12T00:00:00Z", reason: "disjoint follow-up" }
              as: ComplianceOfficer
              captures: { fz3: $.data.id }
          assert:
            - "err_touch == 'ERR_FREEZE_WINDOW_OVERLAP'"
            - "fz3 is non-null (disjoint freeze accepted with 201)"
      - name: hold_window_half_open_adjacency
        grounds:
          - calculations.hold_window_initial
          - entities.HoldDecision.fields.hold_until
        distinguishing_aspect: |
          CheckItem hold windows use HALF-OPEN semantics (different interval
          semantics than the closed freeze windows, on a different resource):
          a manual hold [now, 2026-05-04T12:00) overlapping the auto hold
          [2026-05-01, 2026-05-05) is rejected, but at exactly 2026-05-05T00:00:00Z
          a new window touching the old one's end is accepted.
        test_recipe:
          setup:
            - "Large item (600000) auto-created an ACTIVE hold window [2026-05-01T00:00:00Z, 2026-05-05T00:00:00Z) and item is UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB Hold", routing_number: "111000039", claim_window_business_days: 3, warranty_window_days: 7, daily_claim_capacity: 10 }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Quinn", account_number: "A-1600", opening_balance_cents: 0 }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-H", amount_cents: 600000, encoded_amount_cents: 600000, image_quality_score: 90, capture_channel: "BRANCH" }
              as: ItemProcessor
              captures: { item_id: $.data.id, st0: $.data.status }
          trigger:
            - call: "POST /bank/check-items/${item_id}/hold-decisions"
              payload: { hold_until: "2026-05-04T12:00:00Z", reason: "supplementary review" }
              as: AdjustmentAnalyst
              as_user_id: "analyst-1"
              captures: { err_overlap: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /bank/check-items/${item_id}/hold-decisions"
              payload: { hold_until: "2026-05-07T00:00:00Z", reason: "adjacent follow-up hold" }
              as: AdjustmentAnalyst
              as_user_id: "analyst-1"
              captures: { hold2: $.data.id }
          assert:
            - "st0 == 'UNDER_REVIEW'"
            - "err_overlap == 'ERR_HOLD_WINDOW_OVERLAP'"
            - "hold2 is non-null (adjacent half-open window accepted with 201)"

  - rule_id: compensating_invariant
    instances:
      - name: return_debit_nets_item_ledger_zero
        grounds:
          - state_machines.CheckItem.PRESENTED_to_RETURNED
          - calculations.account_balance_derivation
          - entities.LedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity = per-item ledger net: DEPOSIT_CREDIT (+100000) paired
          with its compensating ITEM_RETURN_DEBIT (-100000) leaves the sum of all
          ledger entries referencing the item at exactly 0, and the account's
          available balance returns to its opening 7000.
        test_recipe:
          setup:
            - "Account opening 7000; item 100000 deposited, presented, returned (no re-presentment, no coding)"
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB Inv", routing_number: "111000040", claim_window_business_days: 3, warranty_window_days: 7, daily_claim_capacity: 10 }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Rosa", account_number: "A-1700", opening_balance_cents: 7000 }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-INV", amount_cents: 100000, encoded_amount_cents: 100000, image_quality_score: 90, capture_channel: "BRANCH" }
              as: ItemProcessor
              captures: { item_id: $.data.id }
            - call: "POST /bank/check-items/${item_id}/present"
              as: ItemProcessor
            - call: "POST /bank/check-items/${item_id}/return-events"
              as: ItemProcessor
          trigger:
            - call: "GET /bank/ledger-entries"
              payload: { check_item_id: "${item_id}" }
              as: OperationsAdmin
            - call: "GET /bank/accounts/${acct_id}"
              as: OperationsAdmin
              captures: { avail: $.data.available_balance_cents }
          assert:
            - "sum of LedgerEntry.amount_cents over entries with check_item_id == ${item_id} == 0 (DEPOSIT_CREDIT 100000 + ITEM_RETURN_DEBIT -100000)"
            - "avail == 7000"
      - name: recredit_clawback_nets_zero
        grounds:
          - state_machines.RecreditRequest.PROVISIONALLY_CREDITED_to_REVOKED
          - calculations.recredit_provisional_amount
        distinguishing_aspect: |
          Conserved quantity = per-request recredit ledger net (different quantity
          than the per-item ledger): RECREDIT_PROVISIONAL_CREDIT (+100000) paired
          with its compensating RECREDIT_CLAWBACK_DEBIT (-100000) on REVOKED
          leaves the request's ledger sum at exactly 0.
        test_recipe:
          setup:
            - "Reg-CC-eligible account with a PAID 200000 item; recredit request for 100000 submitted and provisionally credited at the same clock (0 elapsed days -> interest 0)"
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB RW", routing_number: "111000041", claim_window_business_days: 3, warranty_window_days: 7, daily_claim_capacity: 10 }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Sam", account_number: "A-1800", reg_cc_eligible: true, opening_balance_cents: 0 }
              as: OperationsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bank/check-items"
              payload: { depositor_account_id: "${acct_id}", clearing_bank_id: "${cb_id}", item_reference: "ITM-RW", amount_cents: 200000, encoded_amount_cents: 200000, image_quality_score: 90, capture_channel: "BRANCH" }
              as: ItemProcessor
              captures: { item_id: $.data.id }
            - call: "POST /bank/check-items/${item_id}/present"
              as: ItemProcessor
            - call: "POST /bank/check-items/${item_id}/pay"
              as: ItemProcessor
            - call: "POST /bank/recredit-requests"
              payload: { depositor_account_id: "${acct_id}", check_item_id: "${item_id}", claimed_amount_cents: 100000, reason: "paid twice" }
              as: CustomerService
              captures: { rr_id: $.data.id }
            - call: "POST /bank/recredit-requests/${rr_id}/provisional-credit"
              as: CustomerService
              captures: { rr_total: $.data.provisional_amount_cents }
          trigger:
            - call: "POST /bank/recredit-requests/${rr_id}/finalize"
              payload: { outcome: "REVOKED" }
              as: AdjustmentAnalyst
              as_user_id: "analyst-9"
              captures: { rr_status: $.data.status }
            - call: "GET /bank/ledger-entries"
              payload: { recredit_request_id: "${rr_id}" }
              as: OperationsAdmin
          assert:
            - "rr_total == 100000"
            - "rr_status == 'REVOKED'"
            - "sum of LedgerEntry.amount_cents over entries with recredit_request_id == ${rr_id} == 0 (RECREDIT_PROVISIONAL_CREDIT 100000 + RECREDIT_CLAWBACK_DEBIT -100000)"
