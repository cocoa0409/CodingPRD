    roles: [FleetAdmin, ProjectManager, Mechanic, Dispatcher]
    code: 200
    input: []
    output: Lowboy
    side_effects: []

  - method: GET
    path: "/fleet/lowboys"
    description: "List lowboys"
    roles: [FleetAdmin, ProjectManager, Mechanic, Dispatcher]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Lowboy[]
    side_effects: []

  - method: POST
    path: "/fleet/lowboys/{id}/out-of-service"
