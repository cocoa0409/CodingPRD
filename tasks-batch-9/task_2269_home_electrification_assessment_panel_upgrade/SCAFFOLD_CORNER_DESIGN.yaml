      - name: project_create_and_submit_are_shared_between_applicant_and_contractor
        claim_type: shared_operations
        grounds:
          - roles.Applicant.shared_operations
          - roles.Contractor.shared_operations
          - endpoints.POST_/rebate-projects
          - endpoints.POST_/rebate-projects/{id}/submit
        distinguishing_aspect: |
          The project pipeline is genuinely shared: the SAME project can be
          created by the Applicant and submitted by the Contractor with
          identical results, and either party may file the stacking
          declaration. Sharing a write does not imply sharing a read — the
          collection endpoint GET /rebate-projects stays reviewer/admin-only
          and answers 403 to both of them.
        test_recipe:
          setup:
            - "One OPEN program with the BASE MEASURE catalog item, a verified LOW-tier household (200 A) and an ENROLLED_ACTIVE contractor with an APPROVED assessment."
          setup_api_calls:
