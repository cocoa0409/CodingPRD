              as: ManufacturingPlanner
            - call: "POST /supply/manufacturing-lots"
              payload: { lot_code: "LOT-FKA2", product_id: "${pa_id}", quantity: 10, manufacture_date: "2026-08-01", expiry_date: "2027-08-01" }
              as: ManufacturingPlanner
            - call: "POST /supply/manufacturing-lots"
              payload: { lot_code: "LOT-FKB1", product_id: "${pb_id}", quantity: 10, manufacture_date: "2026-08-01", expiry_date: "2027-08-01" }
