        test_recipe:
          setup: ["customers Ann and Bob"]
          setup_api_calls:
            - { call: "POST /v1/customers", payload: { name: "Ann", email: "ann@x.com", account_kind: "INDIVIDUAL" }, as: Dispatcher, captures: { cust_a: $.data.id } }
            - { call: "POST /v1/customers", payload: { name: "Bob", email: "bob@x.com", account_kind: "INDIVIDUAL" }, as: Dispatcher, captures: { cust_b: $.data.id } }
