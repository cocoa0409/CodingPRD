            - &a_plate2 { call: "POST /plate-sets", payload: { plate_code: "PL-2", product_id: "${p_fd}", color_count: 6 }, as: PrintOperator, captures: { plate2: "$.data.id" } }
            - &a_plate2_mount { call: "POST /plate-sets/${plate2}/mount", payload: { press_id: "${press1}" }, as: PrintOperator }
          trigger:
            - { call: "POST /print-jobs", payload: { job_code: "PJ-A", film_roll_id: "${roll_fd}", plate_set_id: "${plate1}", press_id: "${press1}", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T12:00:00Z" }, as: PrintOperator, captures: { pja: "$.data.id" } }
            - { call: "POST /print-jobs", payload: { job_code: "PJ-B", film_roll_id: "${roll2}", plate_set_id: "${plate2}", press_id: "${press1}", window_start: "2026-08-05T09:00:00Z", window_end: "2026-08-05T15:00:00Z" }, as: PrintOperator }
            - { call: "POST /print-jobs", payload: { job_code: "PJ-C", film_roll_id: "${roll2}", plate_set_id: "${plate2}", press_id: "${press1}", window_start: "2026-08-05T12:00:00Z", window_end: "2026-08-05T18:00:00Z" }, as: PrintOperator, captures: { pjc: "$.data.id" } }
          assert:
            - "PJ-A -> 201 with PrintJob.${pja}.cylinders_required == 4 and status == SETUP"
            - "PJ-B -> 409 ERR_PRESS_CYLINDER_CAPACITY (4 occupied + 6 requested > 8 over 09:00-12:00)"
            - "after the refusal: FilmRoll.${roll2}.status == RELEASED (job creation did not consume it)"
            - "PJ-C -> 201 with PrintJob.${pjc}.cylinders_required == 6 and FilmRoll.${roll2}.status == CONSUMED"
            - "PrintPress.${press1}.cylinder_capacity == 8 and max_colors == 6"
