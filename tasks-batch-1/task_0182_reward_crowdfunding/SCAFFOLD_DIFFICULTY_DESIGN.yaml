              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /backers"
              payload: { email: "b@x.com", display_name: "B" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { creator_id: "${c_id}", title: "Camp", funding_goal_cents: 1000, funding_model: "FLEXIBLE", deadline_utc: "2026-07-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/tiers"
              payload: { title: "T", price_cents: 5000, limit_quantity: 1, weight_grams: 800 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_v1: $.data.version }
            - call: "POST /campaigns/${camp_id}/pledges"
              payload: { backer_id: "${b_id}", tier_id: "${tier_id}", pledge_amount_cents: 5000, destination_zone: "DOMESTIC", expected_campaign_version: "${camp_v1}" }
              as: Backer
              as_user_id: "${b_id}"
              captures: { pledge_id: $.data.id }
            - call: "POST /pledges/${pledge_id}/authorization"
              payload: { outcome: "DECLINED" }
              as: PlatformAdmin
            - call: "GET /tiers/${tier_id}"
              as: PlatformAdmin
              captures: { soldout_before: $.data.status }
          trigger:
            - call: "POST /_clock/advance"
              payload: { now_utc: "2026-07-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "GET /pledges/${pledge_id}"
              as: PlatformAdmin
              captures: { pay: $.data.payment_status }
            - call: "GET /tiers/${tier_id}"
              as: PlatformAdmin
              captures: { claimed: $.data.claimed_quantity }
          assert:
            - "Before close: RewardTier.${tier_id}.status == SOLD_OUT (claimed 1 == limit 1)."
            - "Pledge.${pledge_id}.payment_status == AUTH_DECLINED after close."
            - "RewardTier.${tier_id}.claimed_quantity == 0 after the AUTH_DECLINED release."

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: not_live_temporal_beats_below_tier_min_constraint
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_CAMPAIGN_NOT_LIVE]
          - errors[ERR_PLEDGE_BELOW_TIER_MIN]
        distinguishing_aspect: |
          Category pair business_temporal (priority 8, ERR_CAMPAIGN_NOT_LIVE) vs business_constraint
          (priority 9, ERR_PLEDGE_BELOW_TIER_MIN). A pledge on a DRAFT (not-LIVE) campaign with amount
          below the tier minimum violates both; priority 8 wins, so the response is
          ERR_CAMPAIGN_NOT_LIVE, not ERR_PLEDGE_BELOW_TIER_MIN.
        test_recipe:
          setup:
            - "Campaign in DRAFT (never launched) with a tier price 5000; client sends a pledge of 100 (below min) while not LIVE."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /backers"
              payload: { email: "b@x.com", display_name: "B" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /campaigns"
              payload: { creator_id: "${c_id}", title: "Camp", funding_goal_cents: 1000, funding_model: "FLEXIBLE", deadline_utc: "2026-07-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_id: $.data.id, camp_v0: $.data.version }
            - call: "POST /campaigns/${camp_id}/tiers"
              payload: { title: "T", price_cents: 5000, weight_grams: 800 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
          trigger:
            - call: "POST /campaigns/${camp_id}/pledges"
              payload: { backer_id: "${b_id}", tier_id: "${tier_id}", pledge_amount_cents: 100, destination_zone: "DOMESTIC", expected_campaign_version: "${camp_v0}" }
              as: Backer
              as_user_id: "${b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_CAMPAIGN_NOT_LIVE (priority 8 business_temporal wins over priority 9 business_constraint)."
            - "HTTP status == 409."

      - name: fk_invalid_referential_beats_below_tier_min_constraint
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors[ERR_FK_INVALID]
          - errors[ERR_PLEDGE_BELOW_TIER_MIN]
        distinguishing_aspect: |
          A DIFFERENT category pair: business_referential (priority 4, ERR_FK_INVALID) vs
          business_constraint (priority 9, ERR_PLEDGE_BELOW_TIER_MIN). On a LIVE campaign a pledge
          naming a non-existent tier_id AND amount 1 violates both; priority 4 wins, so the response is
          ERR_FK_INVALID, not ERR_PLEDGE_BELOW_TIER_MIN.
        test_recipe:
          setup:
            - "LIVE campaign with a real tier; client sends a pledge whose tier_id is a non-existent UUID and amount 1."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /backers"
              payload: { email: "b@x.com", display_name: "B" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { creator_id: "${c_id}", title: "Camp", funding_goal_cents: 1000, funding_model: "FLEXIBLE", deadline_utc: "2026-07-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/tiers"
              payload: { title: "T", price_cents: 5000, weight_grams: 800 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_v1: $.data.version }
          trigger:
            - call: "POST /campaigns/${camp_id}/pledges"
              payload: { backer_id: "${b_id}", tier_id: "00000000-0000-4000-8000-000000000000", pledge_amount_cents: 1, destination_zone: "DOMESTIC", expected_campaign_version: "${camp_v1}" }
              as: Backer
              as_user_id: "${b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_FK_INVALID (priority 4 business_referential wins over priority 9 business_constraint)."
            - "HTTP status == 422."

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: tier_soldout_at_exact_limit_on_pledge_create
        grounds:
          - calculations.tier_claimed_quantity
          - validations[priority=11]
          - errors[ERR_TIER_SOLD_OUT]
        distinguishing_aspect: |
          Metric A (tier claimed COUNT) on endpoint POST /campaigns/{id}/pledges: tier is SOLD_OUT iff
          claimed_quantity >= limit_quantity (>=, not >). With limit 1, the first pledge succeeds
          (claimed 1 == limit) and the second is rejected ERR_TIER_SOLD_OUT.
        test_recipe:
          setup:
