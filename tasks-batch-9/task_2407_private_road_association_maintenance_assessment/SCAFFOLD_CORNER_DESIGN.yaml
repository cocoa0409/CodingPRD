  - section: endpoints
    instances:

      - name: parcel_patch_partial_update_recomputes_both_share_units
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /parcels/{parcel_id}]
          - calculations.parcel_share_units
          - concurrency_rules.parcel_reclassification
        distinguishing_aspect: "PATCH is genuinely partial and version-guarded: the first call sends usage_class and trips_per_day and leaves frontage_feet at 290, the second sends frontage_feet alone and retains COMMERCIAL, and both share unit fields are recomputed after each call while version advances 1 -> 2 -> 3."
        test_recipe:
          setup:
            - "One Association with one RoadSegment and one ACTIVE parcel of 290 frontage feet, RESIDENTIAL_YEAR_ROUND, 6 trips per day. No roll exists, so no certified-roll lock applies."
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Patchwork Road Association", reserve_target_cents: 1000000 }
              as: AssociationSecretary
              as_user_id: "sec-1"
