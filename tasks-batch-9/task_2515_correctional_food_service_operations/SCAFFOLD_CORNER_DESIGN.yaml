          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Seven roles share the individual diet-order read and the ContractAdministrator - the most senior role in the model - is deliberately excluded from it, while still seeing the same population through the facility's aggregate active_special_diet_count."
