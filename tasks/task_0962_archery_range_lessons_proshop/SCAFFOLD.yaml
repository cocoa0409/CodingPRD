    roles: [ShopClerk]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["READY|DECLINED -> PICKED_UP", "wallet debit quote_total_cents when picking up a completed repair"]

errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid X-User-Role or X-User-ID" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "role not permitted, or entity-backed ownership violated (member/coach acting on another's resource)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, invalid enum, range violation (incl. ends shape, draw-length step, punches_total pack, end_at <= start_at)" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "member id does not resolve" }
  - { id: ERR_WAIVER_NOT_FOUND, http: 404, condition: "waiver id does not resolve" }
  - { id: ERR_LANE_NOT_FOUND, http: 404, condition: "lane id does not resolve" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "range session id does not resolve" }
  - { id: ERR_PARTICIPANT_NOT_FOUND, http: 404, condition: "session participant id does not resolve" }
  - { id: ERR_PUNCH_CARD_NOT_FOUND, http: 404, condition: "punch card id does not resolve" }
  - { id: ERR_RENTAL_ITEM_NOT_FOUND, http: 404, condition: "rental item id does not resolve" }
  - { id: ERR_RENTAL_AGREEMENT_NOT_FOUND, http: 404, condition: "rental agreement id does not resolve" }
  - { id: ERR_COACH_NOT_FOUND, http: 404, condition: "coach id does not resolve" }
  - { id: ERR_LESSON_NOT_FOUND, http: 404, condition: "lesson id does not resolve" }
  - { id: ERR_LEAGUE_NOT_FOUND, http: 404, condition: "league id does not resolve" }
  - { id: ERR_LEAGUE_ENTRY_NOT_FOUND, http: 404, condition: "league entry id does not resolve" }
  - { id: ERR_SCORECARD_NOT_FOUND, http: 404, condition: "scorecard id does not resolve" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "shop product id does not resolve" }
  - { id: ERR_SALE_NOT_FOUND, http: 404, condition: "sale id does not resolve" }
  - { id: ERR_REPAIR_ORDER_NOT_FOUND, http: 404, condition: "repair order id does not resolve" }
  - { id: ERR_MEMBER_SUSPENDED, http: 409, condition: "member.status != ACTIVE where ACTIVE is required (purchase, booking, entry)" }
  - { id: ERR_MEMBER_NOT_SUSPENDED, http: 409, condition: "reinstate attempted on a non-SUSPENDED member" }
  - { id: ERR_SESSION_NOT_BOOKED, http: 409, condition: "cancel/check-in/participant-add attempted on a session not in BOOKED" }
  - { id: ERR_SESSION_ALREADY_CLOSED, http: 409, condition: "operation attempted on a CLOSED (or otherwise terminal) session" }
  - { id: ERR_LESSON_NOT_ACTIONABLE, http: 409, condition: "lesson transition attempted from a state that does not allow it, or its clock precondition unmet (complete before proposed_start_at)" }
  - { id: ERR_SCORECARD_NOT_EDITABLE, http: 409, condition: "PUT on a scorecard in VERIFIED or LOCKED" }
  - { id: ERR_SCORECARD_LOCKED, http: 409, condition: "dispute/verify on a LOCKED scorecard" }
  - { id: ERR_REPAIR_INVALID_STATE, http: 409, condition: "repair-order transition attempted from a state that does not allow it" }
  - { id: ERR_RENTAL_INVALID_STATE, http: 409, condition: "rental-agreement transition attempted from a state that does not allow it (e.g., settle before return)" }
  - { id: ERR_WAIVER_NOT_REVOKABLE, http: 409, condition: "revoke attempted on a REVOKED waiver (terminal)" }
  - { id: ERR_LEAGUE_NOT_OPEN, http: 409, condition: "entry attempted on a league not OPEN; or close/cancel precondition failed" }
  - { id: ERR_COACH_INACTIVE, http: 409, condition: "lesson confirm/counter attempted while the assigned coach is INACTIVE" }
  - { id: ERR_WAIVER_MISSING, http: 422, condition: "no waiver ever signed where an ACTIVE waiver is required" }
  - { id: ERR_WAIVER_EXPIRED, http: 422, condition: "latest waiver is EXPIRED or REVOKED where ACTIVE is required" }
  - { id: ERR_MINOR_GUARDIAN_REQUIRED, http: 422, condition: "minor registration without guardian_id, or minor attempted to sign own waiver" }
  - { id: ERR_GUARDIAN_NOT_ADULT, http: 422, condition: "guardian_id references a member who is a minor, or waiver signer is not the member's adult guardian" }
  - { id: ERR_LANE_OVERLAP, http: 409, condition: "new session's half-open interval [start_at,end_at) strictly overlaps an existing BOOKED/CHECKED_IN session on the same lane" }
  - { id: ERR_LANE_CAPACITY_EXCEEDED, http: 422, condition: "participant add would exceed lane.max_archers ACTIVE participants" }
  - { id: ERR_COACH_OVERLAP, http: 409, condition: "confirm/accept would leave < 15 minutes gap to another CONFIRMED lesson of the same coach (buffered closed-interval semantics)" }
  - { id: ERR_DISCIPLINE_MISMATCH, http: 422, condition: "lesson discipline not in coach.disciplines" }
  - { id: ERR_DUPLICATE_LEAGUE_ENTRY, http: 409, condition: "member already has an entry in this league" }
  - { id: ERR_LEAGUE_FULL, http: 422, condition: "league already has max_entries CONFIRMED entries" }
  - { id: ERR_BOOKING_WINDOW_VIOLATION, http: 422, condition: "RESERVATION lead < 120 minutes, WALK_IN not same-day, or check-in outside [start_at, start_at+15min]" }
  - { id: ERR_RENTAL_ITEM_UNAVAILABLE, http: 422, condition: "rental item not AVAILABLE" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 422, condition: "sale line or quoted part qty exceeds ShopProduct.stock_quantity" }
  - { id: ERR_PUNCH_CARD_EXHAUSTED, http: 422, condition: "punch card missing, not owned by session creator, not ACTIVE, or punches_remaining < 1" }
  - { id: ERR_INSUFFICIENT_FUNDS, http: 402, condition: "wallet_balance_cents below the required charge" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }

roles:
  - name: Anonymous
    description: "Unauthenticated caller; may register and read public resources"
    identity: opaque
    exclusive_operations: ["POST /members"]
    shared_operations: ["read-only GETs of lanes, coaches, leagues, products, standings"]
  - name: Member
    description: "Registered archer; acts on own bookings, punch cards, lessons, entries, scorecards, repair approvals"
    identity: "entity_backed:Member"
    exclusive_operations: ["sign waivers (self/guardian)", "purchase punch cards for self", "request/counter/accept lessons", "enter leagues", "submit/correct scorecards", "approve/decline own repair orders"]
    shared_operations: ["book sessions, add participants, rent equipment, cancel own sessions, read own resources"]
  - name: Coach
    description: "Lesson coach; confirms, counters, completes own lessons"
    identity: "entity_backed:Coach"
    exclusive_operations: ["confirm/counter/complete lessons as the assigned coach"]
    shared_operations: ["cancel own lessons", "read lessons"]
  - name: RangeOfficer
    description: "Range staff; runs check-in/close, safety strikes, rentals"
    identity: opaque
    exclusive_operations: ["safety-strikes", "reinstate", "check-in", "close", "rental return/settle"]
    shared_operations: ["book/cancel sessions", "read members/sessions/rentals"]
  - name: ShopClerk
    description: "Pro-shop staff; products, sales, repair workflow up to pickup"
    identity: opaque
    exclusive_operations: ["create products", "ring up sales", "repair intake/quote/complete/pickup"]
    shared_operations: ["read rental agreements"]
  - name: LeagueDirector
    description: "League official; manages leagues and scoring adjudication"
    identity: opaque
    exclusive_operations: ["create/close/cancel leagues", "verify/dispute/lock scorecards"]
    shared_operations: ["read leagues, entries, standings"]
  - name: Admin
    description: "Operator superset with override power (hierarchical override) plus clock, lanes, coaches, wallet adjustments, waiver revocation"
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc", "create lanes/coaches", "wallet adjustments", "revoke waivers", "coach activate/deactivate"]
    shared_operations: ["all staff reads"]
