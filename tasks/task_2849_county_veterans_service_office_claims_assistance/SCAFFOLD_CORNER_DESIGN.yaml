      - name: corner_renew_on_an_active_accreditation_is_an_invalid_transition
        claim_type: invalid_transitions
        grounds:
          - state_machines.Representative[LAPSED->ACTIVE]
          - validations[priority=40]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "RENEW is declared only from LAPSED, so applying it to an ACTIVE accreditation returns ERR_INVALID_STATE_TRANSITION (409) even when the body carries ce_credits 12 and a future expiry; the row's ce_credits_earned stays 0."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "rep_a ACTIVE with ce_credits_earned 0 and accreditation_expires_on 2029-12-31."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-391", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
          trigger:
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "RENEW", ce_credits: 12, accreditation_expires_on: "2031-12-31" }
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION"
            - "HTTP status == 409"
            - "Representative.${rep_a}.accreditation_status == ACTIVE"
            - "Representative.${rep_a}.ce_credits_earned == 0"
            - "Representative.${rep_a}.accreditation_expires_on == 2029-12-31"
            - "Representative.${rep_a}.version == 2"

      - name: corner_discharge_document_starts_in_pending_verification
        claim_type: initial_state
        grounds:
          - state_machines.DischargeDocument.initial_state
          - endpoints[POST /cvso/veterans/{id}/discharge-documents]
        distinguishing_aspect: "A freshly submitted discharge document is in PENDING_VERIFICATION with resubmission_count 0, verified_at null and discrepancy_reason null, and the parent Veteran.discharge_doc_status moves off NOT_SUBMITTED to PENDING_VERIFICATION in the same request."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "One Veteran with discharge_doc_status NOT_SUBMITTED."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/veterans"
              payload: { full_name: "Alex Rivera", date_of_birth: "1979-03-04", service_start_date: "2001-09-11", service_end_date: "2005-09-10", household_income_cents: 1500000, net_worth_cents: 2000000, dependent_count: 2, homeless_status: "NOT_HOMELESS", referral_source: "WALK_IN" }
              as: IntakeClerk
