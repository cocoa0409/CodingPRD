            - "Plant.${plant_id}.hazardous_waste_liability_cents == 268750 (hop 2)"
            - "Plant.${plant_id}.compliance_score == 1000 - 50 = 950 (hop 2)"
            - "Charge.${charge_id}.hazard_containment_flag == true (hop 3)"

      - name: retreat_order_cascades_voids_warranties_then_bubbles_version
        grounds:
          - state_machines.Charge.ASSAYED_FAIL_to_RE_TREAT_PENDING
