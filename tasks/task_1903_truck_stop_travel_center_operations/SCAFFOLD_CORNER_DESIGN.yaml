          trigger:
            - { call: "POST /loyalty-members/${ma}/adjustments", payload: { points_delta: 1000, reason: "self serve" }, as: LoyaltyMember, as_user_id: "${ma}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_FORBIDDEN"

