  - rule_id: non_linear_state_machine
    instances:

      - name: titration_visit_held_self_loop_then_applied
        grounds:
          - state_machines.TitrationVisit.SCHEDULED_to_HELD
          - state_machines.TitrationVisit.HELD_to_HELD
          - state_machines.TitrationVisit.HELD_to_APPLIED
          - calculations.titration_applied_increment
        distinguishing_aspect: |
          Non-linearity on the TitrationVisit entity is a genuine self-loop: HELD -> HELD, driven by
          repeated MODERATE side-effect reports on the SAME visit row, and only then HELD -> APPLIED.
          Neither HELD leg touches applied_visit_count or current_advancement_mm, so the appliance is
          unchanged after two applies and moves only on the third.
        test_recipe:
          setup:
            - "A delivered CUSTOM_FABRICATED appliance, starting_advancement_mm 4.75, no applied visits."
            - "One SCHEDULED titration visit requesting 1.00 mm."
            - "Logical clock at 2026-06-01."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "MedFirst", payer_kind: "MEDICAL", prior_auth_required: false }
              as: PlatformAdmin
              captures: { payer_med_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1000000001", full_name: "Dr Sleep", provider_type: "SLEEP_PHYSICIAN" }
              as: PlatformAdmin
