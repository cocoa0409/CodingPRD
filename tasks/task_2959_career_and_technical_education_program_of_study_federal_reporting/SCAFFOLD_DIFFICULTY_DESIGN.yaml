            - call: "POST /cte/expenditures/${exp2_id}/certify-allowability"
              payload: { decision: "CERTIFY" }
              as: GrantFiscalOfficer
              as_user_id: "u_fis_1"
              captures: { appr2: $.data.approved_cents }
            - call: "GET /cte/grant-awards/${grant_id}"
              payload: {}
              as: GrantFiscalOfficer
              as_user_id: "u_fis_1"
