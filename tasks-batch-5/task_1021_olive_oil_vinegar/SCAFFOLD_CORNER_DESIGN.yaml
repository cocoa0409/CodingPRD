      - name: replenishment_receive_not_found
        claim_type: Violation to Error
        grounds: ["errors[ERR_REPLENISHMENT_NOT_FOUND]"]
        distinguishing_aspect: "Receiving a non-existent replenishment order returns ERR_REPLENISHMENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/replenishment-orders/00000000-0000-0000-0000-000000000000/receive"
              payload: { received_harvest_date: "2026-07-01T00:00:00Z" }
              as: ShopStaff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REPLENISHMENT_NOT_FOUND"

      - name: wholesale_account_not_found
        claim_type: Violation to Error
        grounds: ["errors[ERR_WHOLESALE_ACCOUNT_NOT_FOUND]"]
        distinguishing_aspect: "A decision on a non-existent wholesale account returns ERR_WHOLESALE_ACCOUNT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/wholesale-accounts/00000000-0000-0000-0000-000000000000/decision"
              payload: { decision: "APPROVE", tier: "TIER_1", expected_wholesale_account_version: "${nonexist}" }
              as: WholesaleApprover
              captures: { err: $.data.error_id }
          assert:
