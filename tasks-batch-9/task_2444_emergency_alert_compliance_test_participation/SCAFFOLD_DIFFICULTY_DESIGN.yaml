            - "chain: ${chain_b} and ${chain_c} are themselves SUPPRESSED_DUPLICATE (each within 900 s of its predecessor) — chain_b references ${chain_a} and chain_c references ${chain_b}"
            - "p_chain_probe (12:10:00Z) references ${chain_c} (received_at 12:09:00Z, the MAXIMUM candidate) and not ${chain_a} at 12:00:00Z — and the pool admitted chain_b/chain_c despite their relay_state already being SUPPRESSED_DUPLICATE ('any relay_state')"
            - "GET /alert-events filtered by suppression_reference_alert_id == ${chain_c} returns exactly one row, ${p_chain_probe} — the self-referential FK is reverse-reachable"

  # ===========================================================================
  # RULE 9 — compensating_invariant
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: filing_reversal_returns_penalty_total_to_its_exact_pre_filing_value
        grounds:
          - "§1.2 state_machines.FilingRecord ACCEPTED -> REVERSED side effect 'COMPENSATION: penalty_points_total returns to its exact pre-filing value; the station also loses CERTIFIED eligibility if no other ACCEPTED filing remains in the 365-day window'"
          - "§1.5 POST /filing-records/{id}/reverse: 'the compensating action that must return Station.penalty_points_total to its exact pre-filing value', side effect 'Station.penalty_points_total recomputed without this row'"
          - "§1.3 calculations.filing_penalty_points: 'Station.penalty_points_total = round(sum of penalty_points over filings with status IN {SUBMITTED, ACCEPTED}, 2)'"
          - "§1.3 calculations.station_compliance_score CERTIFIED variant deductions d5/d6 and certified_eligible definition"
        distinguishing_aspect: "Reversal is a true compensation rather than a fresh recomputation: penalty_points_total returns to the byte-identical pre-filing value 0.00 (captured before the filing existed), the score returns to 100.00 and the variant falls back from CERTIFIED to PROVISIONAL, yet the REVERSED row KEEPS its own penalty_points 0.94 and the TestEvent stays FILED — nothing is un-filed, only the ledger contribution is withdrawn."
        test_recipe:
          setup:
            - "Plan KS 2026-R1 requiring PEP, activated; station KWEA; dev1 READY; ma1 PEP/WXPEP ACTIVE -> compliance_score 100.00, COMPLIANT, PROVISIONAL, penalty_points_total 0.00."
            - "te1 WEEKLY [2026-08-12T00:00:00Z, 2026-08-12T01:00:00Z) -> filing_deadline_at 2026-08-17T01:00:00Z; readiness at 2026-08-12T00:30:00Z scores 40.00 + 40.00 + 0.00 = 80.00 -> READY; one TRANSMISSION and one RECEIPT/WXPEP logged; close-logging -> LOGGED."
            - "Clock advanced to 2026-08-17T02:00:00Z: one day past the deadline but inside the 10-day grace window (2026-08-27T01:00:00Z)."
          setup_api_calls:
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
            - call: "POST /eas-devices"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", model_code: "DASDEC-3", device_role: "DECODER", firmware_version: "5.2.1" }
              captures: { dev1: "$.data.id" }
            - call: "POST /eas-devices/${dev1}/readiness-check"
              as: StationEngineer
              as_user_id: eng-1
              payload: { self_test_passed: true, firmware_current: true }
            - call: "GET /stations/${station_id}"
              as: StationEngineer
              as_user_id: eng-1
              captures: { sv1: "$.data.version" }
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", device_id: "${dev1}", source_type: "PEP", source_call_sign: "WXPEP", expected_station_version: "${sv1}" }
              captures: { ma1: "$.data.id" }
            - call: "POST /test-events"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { station_id: "${station_id}", test_type: "WEEKLY", window_start_at: "2026-08-12T00:00:00Z", window_end_at: "2026-08-12T01:00:00Z" }
              captures: { te1: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-12T00:30:00Z" }
            - call: "POST /test-events/${te1}/evaluate-readiness"
              as: StationEngineer
              as_user_id: eng-1
              payload: {}
            - call: "POST /test-log-entries"
              as: StationEngineer
              as_user_id: eng-1
              payload: { test_event_id: "${te1}", device_id: "${dev1}", entry_kind: "TRANSMISSION" }
            - call: "POST /test-log-entries"
              as: StationEngineer
              as_user_id: eng-1
              payload: { test_event_id: "${te1}", device_id: "${dev1}", entry_kind: "RECEIPT", source_call_sign: "WXPEP" }
            - call: "POST /test-events/${te1}/close-logging"
              as: StationEngineer
              as_user_id: eng-1
              payload: {}
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-17T02:00:00Z" }
            - call: "GET /stations/${station_id}/compliance-summary"
              as: ComplianceAdmin
              as_user_id: adm-1
              captures: { pts_before: "$.data.penalty_points_total", score_before: "$.data.compliance_score" }
            - call: "GET /test-events/${te1}"
              as: CertifyingOfficer
              as_user_id: cert-1
              captures: { te_v: "$.data.version" }
          trigger:
            - call: "POST /filing-records"
              as: CertifyingOfficer
              as_user_id: cert-1
              payload: { test_event_id: "${te1}", expected_test_event_version: "${te_v}", attestation_note: "late weekly filing, one day past the deadline" }
              captures: { filing1: "$.data.id" }
            - call: "POST /filing-records/${filing1}/accept"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "GET /stations/${station_id}/compliance-summary"
              as: ComplianceAdmin
              as_user_id: adm-1
            - call: "POST /filing-records/${filing1}/reverse"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { reversal_reason: "ATTESTATION_WITHDRAWN" }
            - call: "GET /stations/${station_id}/compliance-summary"
              as: ComplianceAdmin
              as_user_id: adm-1
            - call: "GET /filing-records/${filing1}"
              as: ComplianceAdmin
              as_user_id: adm-1
            - call: "GET /test-events/${te1}"
              as: ComplianceAdmin
              as_user_id: adm-1
          assert:
            - "pre-filing baseline: ${pts_before} == 0.00 and ${score_before} == 100.00 with compliance_variant_applied == PROVISIONAL"
            - "filing1: late_days == 1 (2026-08-17T02:00:00Z vs filing_deadline_at 2026-08-17T01:00:00Z), entry_subtotal_points == 0.19 == round(1.8 * 0.065 * 1, 2) 0.12 + round(1.0 * 0.065 * 1, 2) 0.07, lateness_points == 0.75 == 1 * 0.75, unconfirmed_relay_points == 0.00, penalty_points == 0.94"
            - "after the filing (status SUBMITTED): Station.penalty_points_total == 0.94 but compliance_score is STILL 100.00 — the PROVISIONAL variant does not apply d6"
            - "after accept: filing1.status == ACCEPTED, compliance_variant_applied == CERTIFIED, compliance_score == 99.06 == 100.00 - 0.94, compliance_posture == COMPLIANT"
            - "after reverse: penalty_points_total == ${pts_before} == 0.00 EXACTLY — the row left the {SUBMITTED, ACCEPTED} input set rather than being netted out with a second adjustment"
            - "after reverse: compliance_variant_applied == PROVISIONAL again (no ACCEPTED filing remains in the 365-day window) and compliance_score == ${score_before} == 100.00, compliance_posture == COMPLIANT"
            - "filing1 itself is unchanged apart from the transition: status == REVERSED, reversal_reason == 'ATTESTATION_WITHDRAWN', penalty_points still == 0.94, late_days still == 1, superseded_filing_id == null"
            - "te1.status is STILL FILED with version ${te_v} + 1 — reversal does not bump TestEvent.version a second time and does not un-file the test, so unfiled_test_count stays 0"

      - name: assignment_decommission_then_reinstate_restores_coverage_without_drift
        grounds:
          - "§1.2 state_machines.MonitoringAssignment ACTIVE -> DECOMMISSIONED ('Station.accessible_source_count recomputed', 'Station recompute event fires') and DECOMMISSIONED -> ACTIVE (reinstate)"
          - "§1.2 reinstate preconditions: 'status == DECOMMISSIONED', 'no other MonitoringAssignment for the same station_id has status == ACTIVE with the same source_type', 'the referenced EASDevice status == READY'"
          - "§1.3 calculations.station_compliance_score d1 MISSING_SOURCE_DEDUCTION 25.00 per uncovered required source_type, COMPLIANT_MIN_SCORE 90.00, WATCH_MIN_SCORE 75.00"
          - "§1.6 ERR_ASSIGNMENT_NOT_DECOMMISSIONED (409)"
        distinguishing_aspect: "The reinstate exactly undoes the decommission's derived-field damage — accessible_source_count 2 -> 1 -> 2 and score 100.00 -> 75.00 -> 100.00 with the posture walking COMPLIANT -> WATCH -> COMPLIANT — and a second reinstate is rejected instead of double-counting, proving the recompute is derived from row state and not an incrementing counter."
        test_recipe:
          setup:
            - "Plan KS 2026-R1 requiring BOTH PEP and SATELLITE (required_source_count 2), activated; station KWEA; dev1 READY."
            - "ma1 PEP/WXPEP and ma2 SATELLITE/WXSAT both ACTIVE -> accessible_source_count 2, missing_source_count 0, compliance_score 100.00, COMPLIANT."
