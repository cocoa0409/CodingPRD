          - endpoints[POST /solar/punch-list-items/{item_id}/closure-decisions]
        excluded_because:
          difficulty_instance: non_linear_state_machine / punch_item_closure_cycle_repeats_before_terminal_close
          rationale: "Both action endpoints are driven through submit / reject / resubmit / close there, with preconditions and rejection_count asserted at every hop."

      - name: delivery_links_a_project_and_a_yard_zone_and_rejects_a_foreign_zone
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /solar/deliveries]
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_YARD_ZONE_NOT_FOUND]
          - errors[ERR_CROSS_PROJECT_REFERENCE]
          - calculations.yard_zone_pallet_ledger
        distinguishing_aspect: "The two references are checked independently and in ladder order: an unknown zone id answers 404 at priority 5 while a real zone belonging to ANOTHER project answers 422 at priority 6, and only the valid pairing moves pallets — the foreign project's zone is never touched."
        test_recipe:
          setup:
            - "Project P1 with yard zone Z1 (capacity 100) and Project P2 with yard zone Z2 (capacity 100)"
            - "The literal id 00000000-0000-4000-8000-0000000000zz belongs to no yard zone"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Link One", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { p1: $.data.id }
            - call: "POST /solar/projects"
              payload: { name: "Link Two", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { p2: $.data.id }
            - call: "POST /solar/projects/${p1}/yard-zones"
              payload: { zone_code: "Y1", pallet_capacity: 100 }
              as: ProcurementCoordinator
              captures: { z1: $.data.id, z1v: $.data.version }
            - call: "POST /solar/projects/${p2}/yard-zones"
              payload: { zone_code: "Y1", pallet_capacity: 100 }
              as: ProcurementCoordinator
              captures: { z2: $.data.id, z2v: $.data.version }
          trigger:
            - call: "POST /solar/deliveries"
              payload: { project_id: "${p1}", yard_zone_id: "00000000-0000-4000-8000-0000000000zz", component_type: "MODULE", unit_qty: 40, pallets: 40, planned_arrival_at: "2026-08-03T09:00:00Z", laydown_window_start: "2026-08-03T00:00:00Z", laydown_window_end: "2026-08-07T00:00:00Z", expected_yard_zone_version: "${z1v}" }
              as: ProcurementCoordinator
              captures: { e1: $.data.error_id }
            - call: "POST /solar/deliveries"
              payload: { project_id: "${p1}", yard_zone_id: "${z2}", component_type: "MODULE", unit_qty: 40, pallets: 40, planned_arrival_at: "2026-08-03T09:00:00Z", laydown_window_start: "2026-08-03T00:00:00Z", laydown_window_end: "2026-08-07T00:00:00Z", expected_yard_zone_version: "${z2v}" }
              as: ProcurementCoordinator
              captures: { e2: $.data.error_id }
            - call: "POST /solar/deliveries"
              payload: { project_id: "${p1}", yard_zone_id: "${z1}", component_type: "MODULE", unit_qty: 40, pallets: 40, planned_arrival_at: "2026-08-03T09:00:00Z", laydown_window_start: "2026-08-03T00:00:00Z", laydown_window_end: "2026-08-07T00:00:00Z", expected_yard_zone_version: "${z1v}" }
              as: ProcurementCoordinator
              captures: { ok_id: $.data.id, ok_proj: $.data.project_id, ok_zone: $.data.yard_zone_id }
            - call: "GET /solar/yard-zones/${z1}"
              payload: {}
              as: ProcurementCoordinator
              captures: { z1_res: $.data.reserved_pallets, z1_avail: $.data.available_pallets }
            - call: "GET /solar/yard-zones/${z2}"
              payload: {}
              as: ProcurementCoordinator
              captures: { z2_res: $.data.reserved_pallets, z2_ver: $.data.version }
          assert:
            - "${e1} == ERR_YARD_ZONE_NOT_FOUND with HTTP 404 — the unknown zone is caught at priority 5, before the cross-project comparison it could not perform anyway"
            - "${e2} == ERR_CROSS_PROJECT_REFERENCE with HTTP 422 — Z2 exists but belongs to ${p2}, and the fresh version it carries does not rescue the link"
            - "the valid pairing returns 201 with ${ok_proj} == ${p1} and ${ok_zone} == ${z1}"
            - "${z1_res} == 40 and ${z1_avail} == 60 — only the correctly linked zone moved"
            - "${z2_res} == 0 and ${z2_ver} == ${z2v} — the foreign zone was neither reserved against nor version-bumped by the refused attempt"

      - name: settlement_summary_reports_live_counts_and_zeroed_money_before_certification
        claim_type: computed_read
        grounds:
          - endpoints[GET /solar/projects/{id}/settlement-summary]
          - calculations.substantial_completion_settlement
          - calculations.final_acceptance_release
          - entities.Project.fields.open_critical_punch_count
        distinguishing_aspect: "The computed read separates live fields from frozen ones: adjusted_contract_cents and both punch counts track every write immediately, while the six waterfall money fields and final_payment_cents stay at 0 until the matching milestone is certified — and a WAIVED item leaves the open counts exactly as a CLOSED one does."
        test_recipe:
          setup:
            - "One PRECONSTRUCTION project (contract 10000000, retainage_pct 0.05, ld_per_day 50000, ld_cap_pct 0.05) with one approved change order of 500000"
            - "Three punch items: CRITICAL/MECHANICAL 200000, MAJOR/ELECTRICAL 100000 and MINOR/DOCUMENTATION 50000"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Summary Bench", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/change-orders"
              payload: { amount_cents: 500000, reason: "extra drainage culvert" }
              as: EpcProjectManager
              captures: { co: $.data.approved_change_order_cents }
            - call: "POST /solar/projects/${proj}/punch-list-items"
              payload: { title: "Torque tube shim missing", category: "MECHANICAL", severity: "CRITICAL", estimated_cost_cents: 200000 }
              as: OwnerEngineer
              captures: { pi1: $.data.id }
            - call: "POST /solar/projects/${proj}/punch-list-items"
              payload: { title: "Combiner label illegible", category: "ELECTRICAL", severity: "MAJOR", estimated_cost_cents: 100000 }
              as: OwnerEngineer
              captures: { pi2: $.data.id }
            - call: "POST /solar/projects/${proj}/punch-list-items"
              payload: { title: "As-built set incomplete", category: "DOCUMENTATION", severity: "MINOR", estimated_cost_cents: 50000 }
              as: OwnerEngineer
              captures: { pi3: $.data.id }
          trigger:
            - call: "GET /solar/projects/${proj}/settlement-summary"
              payload: {}
              as: OwnerEngineer
              captures: { adj1: $.data.adjusted_contract_cents, ret1: $.data.retainage_held_cents, hold1: $.data.punchlist_holdback_cents, sc1: $.data.sc_payment_due_cents, fa1: $.data.final_payment_cents, dd1: $.data.delay_days, ldc1: $.data.ld_cap_cents, lda1: $.data.ld_assessed_cents, n1: $.data.open_punch_item_count, nc1: $.data.open_critical_punch_count, tcs1: $.data.tax_credit_status }
            - call: "POST /solar/punch-list-items/${pi2}/closure-submissions"
              payload: { closure_evidence_ref: "PHOTO-2201" }
              as: InstallationForeman
              captures: { pi2_st: $.data.status }
            - call: "GET /solar/projects/${proj}/settlement-summary"
              payload: {}
              as: OwnerEngineer
              captures: { n2: $.data.open_punch_item_count, nc2: $.data.open_critical_punch_count }
            - call: "POST /solar/punch-list-items/${pi2}/closure-decisions"
              payload: { decision: "APPROVE", note: "label replaced" }
              as: OwnerEngineer
              captures: { pi2_st2: $.data.status }
            - call: "POST /solar/punch-list-items/${pi3}/closure-decisions"
              payload: { decision: "WAIVE", note: "as-builts deferred to O&M turnover" }
              as: OwnerEngineer
              captures: { pi3_st: $.data.status }
            - call: "GET /solar/projects/${proj}/settlement-summary"
              payload: {}
              as: OwnerEngineer
              captures: { adj3: $.data.adjusted_contract_cents, n3: $.data.open_punch_item_count, nc3: $.data.open_critical_punch_count, sc3: $.data.sc_payment_due_cents }
          assert:
            - "${co} == 500000, so ${adj1} == 10500000 — adjusted_contract_cents is live and needs no certification"
            - "${n1} == 3 and ${nc1} == 1 — both counts are live from the moment the items are raised"
            - "${ret1} == 0, ${hold1} == 0, ${sc1} == 0, ${fa1} == 0, ${dd1} == 0, ${ldc1} == 0 and ${lda1} == 0 — the waterfall is frozen at zero before SUBSTANTIAL_COMPLETION is certified, even though retainage would be 525000 and the holdback 525000 if it ran now"
            - "${tcs1} == UNDETERMINED before any labor compliance run"
            - "${pi2_st} == CLOSURE_SUBMITTED and ${n2} == 3 with ${nc2} == 1 — a submitted item still counts as open"
            - "${pi2_st2} == CLOSED and ${pi3_st} == WAIVED"
            - "${n3} == 1 and ${nc3} == 1 — WAIVED is excluded from the open counts exactly as CLOSED is, leaving only the untouched CRITICAL item"
            - "${adj3} == 10500000 and ${sc3} == 0 — punch churn never leaks into the frozen money fields"

      - name: energization_is_allowed_only_inside_an_approved_outage_window
        claim_type: conditional_action
        grounds:
          - endpoints[POST /solar/substations/{substation_id}/status-advances]
          - validations[priority=16]
          - errors[ERR_NO_APPROVED_OUTAGE_WINDOW]
          - state_machines.Substation.BACKFEED_REQUESTED_to_ENERGIZED
        distinguishing_aspect: "The final advance is conditional on the logical clock lying inside an APPROVED window: it is refused while the clock is before every window, refused again while the clock sits inside a DENIED window covering that instant, and only succeeds once the clock enters the approved one — the window's status, not merely its existence, is the gate."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "One substation at BACKFEED_REQUESTED with a DENIED BACKFEED window [2026-08-05T00:00Z, 2026-08-05T04:00Z] and an APPROVED BACKFEED window [2026-08-10T00:00Z, 2026-08-10T04:00Z]"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: UtilityCoordinator
            - call: "POST /solar/projects"
              payload: { name: "Backfeed Ridge", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/substations"
              payload: { substation_code: "S1", interconnection_voltage_kv: 138.0, mv_collection_km: 12.5 }
              as: UtilityCoordinator
              captures: { sub: $.data.id }
            - call: "POST /solar/substations/${sub}/outage-windows"
              payload: { start_at: "2026-08-05T00:00:00Z", end_at: "2026-08-05T04:00:00Z", purpose: "BACKFEED" }
              as: UtilityCoordinator
              captures: { ow_bad: $.data.id }
            - call: "POST /solar/outage-windows/${ow_bad}/utility-response"
              payload: { decision: "DENY", utility_reference: "SO-4460" }
              as: UtilityCoordinator
              captures: { bad_st: $.data.status }
            - call: "POST /solar/substations/${sub}/outage-windows"
              payload: { start_at: "2026-08-10T00:00:00Z", end_at: "2026-08-10T04:00:00Z", purpose: "BACKFEED" }
              as: UtilityCoordinator
              captures: { ow_ok: $.data.id }
            - call: "POST /solar/outage-windows/${ow_ok}/utility-response"
              payload: { decision: "APPROVE", utility_reference: "SO-4471" }
              as: UtilityCoordinator
              captures: { ok_st: $.data.status }
            - call: "POST /solar/substations/${sub}/status-advances"
              payload: { to_status: "STEEL_ERECTED", utility_witness_ref: "W-1" }
              as: UtilityCoordinator
            - call: "POST /solar/substations/${sub}/status-advances"
              payload: { to_status: "EQUIPMENT_SET", utility_witness_ref: "W-2" }
              as: UtilityCoordinator
            - call: "POST /solar/substations/${sub}/status-advances"
              payload: { to_status: "BACKFEED_REQUESTED", utility_witness_ref: "W-3" }
              as: UtilityCoordinator
              captures: { pre_st: $.data.status }
          trigger:
            - call: "POST /solar/substations/${sub}/status-advances"
              payload: { to_status: "ENERGIZED", utility_witness_ref: "W-4" }
              as: UtilityCoordinator
              captures: { e1: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-05T02:00:00Z" }
              as: UtilityCoordinator
            - call: "POST /solar/substations/${sub}/status-advances"
              payload: { to_status: "ENERGIZED", utility_witness_ref: "W-4" }
              as: UtilityCoordinator
              captures: { e2: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-10T02:00:00Z" }
              as: UtilityCoordinator
            - call: "POST /solar/substations/${sub}/status-advances"
              payload: { to_status: "ENERGIZED", utility_witness_ref: "W-4" }
              as: UtilityCoordinator
              captures: { s_ok: $.data.status, wit: $.data.utility_witness_ref, ow_used: $.data.energizing_outage_window_id }
            - call: "GET /solar/outage-windows/${ow_bad}"
              payload: {}
              as: UtilityCoordinator
              captures: { bad_st2: $.data.status }
          assert:
            - "${bad_st} == DENIED, ${ok_st} == APPROVED and ${pre_st} == BACKFEED_REQUESTED"
            - "${e1} == ERR_NO_APPROVED_OUTAGE_WINDOW (422) at 2026-08-01 — an approved window exists but does not cover now"
            - "${e2} == ERR_NO_APPROVED_OUTAGE_WINDOW (422) at 2026-08-05T02:00:00Z — a window covers now, but it is DENIED"
            - "Substation.${sub}.status is still BACKFEED_REQUESTED after both refusals, and utility_witness_ref is unchanged from W-3"
            - "at 2026-08-10T02:00:00Z the same request returns 200 with ${s_ok} == ENERGIZED, ${wit} == W-4 and ${ow_used} == ${ow_ok}"
            - "${bad_st2} == DENIED — the denied window is not marked EXECUTED by the successful energization"


