            - "${s1_state0} == 'RECORDED' and ${s1_density} == 0.8333 (250000 tons over the 300000 cy lost against certified_airspace_cy 1000000)"
            - "Landfill.${lf_id}.remaining_life_years == 1.94 and Landfill.${lf_id}.operating_status == 'RESTRICTED_AIRSPACE' after S1"
            - "trigger 1 returns ERR_SURVEY_PERIOD_OVERLAP with HTTP 409: 2026-07-31 is S1's coverage_period_end and the intervals are CLOSED, so touching is overlapping even though the 106-day spacing is fine"
            - "trigger 2 returns ERR_SURVEY_SPACING_VIOLATION with HTTP 409: the coverage is disjoint but 2026-08-01 to 2026-10-29 is only 89 whole days"
            - "trigger 3 violates BOTH rules and returns ERR_SURVEY_PERIOD_OVERLAP with HTTP 409, because priority 17 is evaluated before priority 18"
            - "no AerialSurvey row is created by triggers 1-3, and AerialSurvey.${s1_id}.status is still 'RECORDED' with an unchanged version"
