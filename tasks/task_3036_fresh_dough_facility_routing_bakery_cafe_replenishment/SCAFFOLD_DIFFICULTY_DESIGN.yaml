  - rule_id: resource_temporal_overlap
    instances:
      - name: route_stop_window_overlap_rejected
        grounds:
          - validations[priority=10]
          - entities.RouteStop.fields.planned_arrival
          - entities.RouteStop.fields.window_start_local
        distinguishing_aspect: |
          Interval semantics #1 (adjacency = conflict): two stops on the SAME
          cafe must not have overlapping or zero-gap windows; [03:00,04:00] and
          [04:00,05:00] touch at 04:00 and are rejected. Resource = the cafe's
          dock at that morning.
        test_recipe:
          setup:
            - "F1, C1 exist; route R1 DRAFT already carries stop S1 for C1 window 03:00-04:00"
          setup_api_calls:
            - call: "POST /dough-ops/facilities"
              payload: { name: "F1", effective_capacity_units: 2000 }
              as: FacilityPlanner
              captures: { f1_id: $.data.id }
            - call: "POST /dough-ops/cafes"
              payload: { name: "C1", facility_id: "${f1_id}", ownership_type: "FRANCHISE", credit_limit_cents: 90000 }
              as: FacilityPlanner
              captures: { c1_id: $.data.id }
            - call: "POST /dough-ops/facilities/${f1_id}/routes"
              payload: { production_date: "2026-09-10", vehicle_capacity_units: 500 }
              as: RouteDispatcher
              captures: { r1_id: $.data.id }
            - call: "POST /dough-ops/facilities/${f1_id}/routes/${r1_id}/stops"
              payload: { seq: 1, cafe_id: "${c1_id}", planned_arrival: "2026-09-10T03:10:00Z", window_start_local: "03:00", window_end_local: "04:00", planned_units: 100 }
              as: RouteDispatcher
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /dough-ops/facilities/${f1_id}/routes/${r1_id}/stops"
              payload: { seq: 2, cafe_id: "${c1_id}", planned_arrival: "2026-09-10T04:10:00Z", window_start_local: "04:00", window_end_local: "05:00", planned_units: 50 }
              as: RouteDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STOP_WINDOW_VIOLATION   # zero-gap adjacency on the same cafe is a conflict"
            - "http status == 422"

