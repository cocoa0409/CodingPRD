              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /otb/vendor-authorizations"
              payload: { vendor_id: "${vendor_id}", category_id: "${cat_id}", max_open_units: 40000 }
              as: MerchOpsAdmin
              captures: { va_id: $.data.id }
          trigger:
            - call: "GET /otb/departments/dept-nope"
              payload: {}
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { e_dept: $.data.error_id }
            - call: "GET /otb/store-clusters/clu-nope"
              payload: {}
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { e_clu: $.data.error_id }
            - call: "GET /otb/vendor-authorizations/va-nope"
