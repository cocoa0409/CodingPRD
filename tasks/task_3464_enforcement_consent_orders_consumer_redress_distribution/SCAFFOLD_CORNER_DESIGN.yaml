              payload: {}
              as: StaffAttorney
              captures: { e_inv: $.data.error_id }
            - call: "GET /enforcement/judgments/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: Commissioner
              captures: { e_judgment: $.data.error_id }
            - call: "GET /enforcement/redress-funds/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: FundAdministrator
              as_user_id: "fa-1"
              captures: { e_fund: $.data.error_id }
            - call: "GET /enforcement/claims/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: FundAdministrator
              as_user_id: "fa-1"
              captures: { e_claim: $.data.error_id }
            - call: "POST /enforcement/claims"
              payload: { claimant_id: "00000000-0000-4000-8000-000000000006", redress_fund_id: "00000000-0000-4000-8000-000000000004", documented_loss_cents: 1000 }
