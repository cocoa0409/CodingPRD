scaffold_difficulty_design:
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: session_charge_provisional_vs_final
        grounds:
          - calculations.table_session_charge
          - entities.TableSession.fields.provisional_charge_cents
          - entities.TableSession.fields.final_charge_cents
          - state_machines.TableSession.OPEN_to_CLOSED
        distinguishing_aspect: "On one TableSession the provisional variant (off-peak flat, no discount) yields 2400 while the final variant (peak split + SILVER discount) yields 2700 — same entity, two algorithms, different cents."
        test_recipe:
          setup:
            - "SILVER plan (discount 0.10); member on it with wallet 100000; POOL_9FT table rate 1200/hr; reservation 2026-07-02T17:00-19:00 CONFIRMED; clock at 17:00."
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { tier: "SILVER", monthly_fee_cents: 5000, table_discount_pct: 0.10 }
              as: Manager
              captures: { silver_plan: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "dv1@x.com", full_name: "DV One", plan_id: "${silver_plan}" }
              as: Manager
              captures: { m1: "$.data.id" }
            - call: "POST /v1/members/${m1}/wallet/adjustments"
              payload: { amount_cents: 100000 }
              as: Manager
            - call: "POST /v1/tables"
              payload: { table_number: 1, table_type: "POOL_9FT", seat_capacity: 6, hourly_rate_cents: 1200 }
              as: Manager
              captures: { t1: "$.data.id" }
            - call: "POST /v1/reservations"
              payload: { member_id: "${m1}", table_id: "${t1}", start_at: "2026-07-02T17:00:00Z", end_at: "2026-07-02T19:00:00Z", party_size: 2 }
              as: FrontDesk
              captures: { r1: "$.data.id" }
            - call: "POST /v1/reservations/${r1}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T17:00:00Z" }
              as: Manager
          trigger:
            - call: "POST /v1/reservations/${r1}/check-in"
              payload: {}
              as: FrontDesk
              captures: { sess1: "$.data.id" }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T19:00:00Z" }
              as: Manager
            - call: "POST /v1/sessions/${sess1}/close"
              payload: {}
              as: FrontDesk
          assert:
            - "TableSession.${sess1}.provisional_charge_cents == 2400"
            - "TableSession.${sess1}.final_charge_cents == 2700"
            - "TableSession.${sess1}.provisional_charge_cents != TableSession.${sess1}.final_charge_cents"
            - "Member.${m1}.wallet_credit_cents == 97300"

      - name: handicap_spot_full_vs_capped
        grounds:
          - calculations.tournament_handicap_spot
          - entities.TournamentEntry.fields.handicap_spot
          - state_machines.Tournament.REGISTRATION_OPEN_to_SEEDED
        distinguishing_aspect: "For a rating-4 entrant under a rating-9 top seed, FULL mode stamps handicap_spot 5 whereas CAPPED mode stamps 3 — dual-variant on the competition-handicap domain, distinct from session billing."
        test_recipe:
          setup:
            - "Four members rated 9,7,5,4; two tournaments (entry_fee 0) — one handicap_mode FULL, one CAPPED — each with all four entered and REGISTRATION_OPEN."
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { tier: "BRONZE", monthly_fee_cents: 3000, table_discount_pct: 0.0 }
              as: Manager
              captures: { bronze: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "h9@x.com", full_name: "H9", plan_id: "${bronze}", handicap_rating: 9 }
              as: Manager
              captures: { m9: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "h7@x.com", full_name: "H7", plan_id: "${bronze}", handicap_rating: 7 }
              as: Manager
              captures: { m7: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "h5@x.com", full_name: "H5", plan_id: "${bronze}", handicap_rating: 5 }
              as: Manager
              captures: { m5: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "h4@x.com", full_name: "H4", plan_id: "${bronze}", handicap_rating: 4 }
              as: Manager
              captures: { m4: "$.data.id" }
            - call: "POST /v1/tournaments"
              payload: { name: "FullCup", format: "SINGLE_ELIM", handicap_mode: "FULL", entry_fee_cents: 0, max_entries: 8 }
              as: Manager
              captures: { tf: "$.data.id" }
            - call: "POST /v1/tournaments/${tf}/open"
              payload: {}
              as: Manager
            - call: "POST /v1/tournament-entries"
              payload: { tournament_id: "${tf}", member_id: "${m9}" }
              as: Member
              as_user_id: "${m9}"
            - call: "POST /v1/tournament-entries"
              payload: { tournament_id: "${tf}", member_id: "${m7}" }
              as: Member
              as_user_id: "${m7}"
            - call: "POST /v1/tournament-entries"
              payload: { tournament_id: "${tf}", member_id: "${m5}" }
              as: Member
              as_user_id: "${m5}"
            - call: "POST /v1/tournament-entries"
              payload: { tournament_id: "${tf}", member_id: "${m4}" }
              as: Member
              as_user_id: "${m4}"
              captures: { ef4: "$.data.id" }
            - call: "POST /v1/tournaments"
              payload: { name: "CapCup", format: "SINGLE_ELIM", handicap_mode: "CAPPED", entry_fee_cents: 0, max_entries: 8 }
              as: Manager
              captures: { tc: "$.data.id" }
            - call: "POST /v1/tournaments/${tc}/open"
              payload: {}
              as: Manager
            - call: "POST /v1/tournament-entries"
              payload: { tournament_id: "${tc}", member_id: "${m9}" }
              as: Member
              as_user_id: "${m9}"
            - call: "POST /v1/tournament-entries"
              payload: { tournament_id: "${tc}", member_id: "${m7}" }
              as: Member
              as_user_id: "${m7}"
            - call: "POST /v1/tournament-entries"
              payload: { tournament_id: "${tc}", member_id: "${m5}" }
              as: Member
              as_user_id: "${m5}"
            - call: "POST /v1/tournament-entries"
              payload: { tournament_id: "${tc}", member_id: "${m4}" }
              as: Member
              as_user_id: "${m4}"
              captures: { ec4: "$.data.id" }
          trigger:
            - call: "POST /v1/tournaments/${tf}/seed"
              payload: {}
              as: Manager
            - call: "POST /v1/tournaments/${tc}/seed"
              payload: {}
              as: Manager
          assert:
            - "TournamentEntry.${ef4}.handicap_spot == 5"
            - "TournamentEntry.${ec4}.handicap_spot == 3"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: session_final_peak_split_and_discount_mode_a
        grounds:
          - calculations.table_session_charge
          - state_machines.TableSession.OPEN_to_CLOSED
          - entities.PoolTable.fields.hourly_rate_cents
          - entities.MembershipPlan.fields.table_discount_pct
        distinguishing_aspect: "Mode (a): final_charge_cents = round((offpeak_min*rate/60 + peak_min*rate/60*1.5) * (1 - discount)) has >=3 inputs (rate, peak split, discount) with nested tier selection and a single final rounding, yielding 2700 for the 17:00-19:00 SILVER window."
        test_recipe:
          setup:
            - "SILVER member funded; rate-1200 table; reservation 17:00-19:00 confirmed; clock 17:00; checked in."
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { tier: "SILVER", monthly_fee_cents: 5000, table_discount_pct: 0.10 }
              as: Manager
              captures: { sp: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "cf1@x.com", full_name: "CF One", plan_id: "${sp}" }
              as: Manager
              captures: { cm: "$.data.id" }
            - call: "POST /v1/members/${cm}/wallet/adjustments"
              payload: { amount_cents: 100000 }
              as: Manager
            - call: "POST /v1/tables"
              payload: { table_number: 2, table_type: "POOL_9FT", seat_capacity: 6, hourly_rate_cents: 1200 }
              as: Manager
              captures: { ct: "$.data.id" }
            - call: "POST /v1/reservations"
              payload: { member_id: "${cm}", table_id: "${ct}", start_at: "2026-07-02T17:00:00Z", end_at: "2026-07-02T19:00:00Z", party_size: 2 }
              as: FrontDesk
              captures: { cr: "$.data.id" }
            - call: "POST /v1/reservations/${cr}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T17:00:00Z" }
              as: Manager
            - call: "POST /v1/reservations/${cr}/check-in"
              payload: {}
              as: FrontDesk
              captures: { cs: "$.data.id" }
          trigger:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T19:00:00Z" }
              as: Manager
            - call: "POST /v1/sessions/${cs}/close"
              payload: {}
              as: FrontDesk
          assert:
            - "TableSession.${cs}.final_charge_cents == 2700"

      - name: fnb_total_round_per_line_then_sum_mode_b
        grounds:
          - calculations.fnb_order_total
          - state_machines.FnbOrder.OPEN_to_SUBMITTED
          - entities.FnbOrder.fields.tax_cents
        distinguishing_aspect: "Mode (b): two 60-cent lines tax per-line to round(5.25)=5 each => tax 10, total 130; summing first then rounding round(120*0.0875)=round(10.5)=11 would give 131 — the pinned per-line order produces the smaller value."
        test_recipe:
          setup:
            - "Member funded; open walk-in session; an OPEN fnb tab with two line items of unit_price 60 qty 1."
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { tier: "BRONZE", monthly_fee_cents: 3000, table_discount_pct: 0.0 }
              as: Manager
              captures: { bp: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "fb1@x.com", full_name: "FB One", plan_id: "${bp}" }
              as: Manager
              captures: { fm: "$.data.id" }
            - call: "POST /v1/members/${fm}/wallet/adjustments"
              payload: { amount_cents: 100000 }
              as: Manager
            - call: "POST /v1/tables"
              payload: { table_number: 3, table_type: "POOL_7FT", seat_capacity: 4, hourly_rate_cents: 1000 }
              as: Manager
              captures: { ft: "$.data.id" }
            - call: "POST /v1/sessions"
              payload: { table_id: "${ft}", member_id: "${fm}" }
              as: FrontDesk
              captures: { fs: "$.data.id" }
            - call: "POST /v1/fnb-orders"
              payload: { session_id: "${fs}", member_id: "${fm}", line_items: [ { name: "Cola", unit_price_cents: 60, qty: 1 }, { name: "Water", unit_price_cents: 60, qty: 1 } ] }
              as: FrontDesk
              captures: { fo: "$.data.id" }
          trigger:
            - call: "POST /v1/fnb-orders/${fo}/submit"
              payload: {}
              as: FrontDesk
          assert:
            - "FnbOrder.${fo}.subtotal_cents == 120"
            - "FnbOrder.${fo}.tax_cents == 10"
            - "FnbOrder.${fo}.total_cents == 130"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: event_parallel_booking_and_payment_axes
        grounds:
          - state_machines.Event
          - entities.Event.fields.booking_status
          - entities.Event.fields.payment_status
        distinguishing_aspect: "On one Event the payment axis reaches DEPOSIT_PAID while the booking axis is still QUOTED, then booking advances to BOOKED with payment left at DEPOSIT_PAID — two state dimensions evolve independently on the same row."
        test_recipe:
          setup:
            - "Host member funded 100000; one ACTIVE table; Event (1 table, 2h) QUOTED with deposit_cents 2000."
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { tier: "GOLD", monthly_fee_cents: 8000, table_discount_pct: 0.20 }
              as: Manager
              captures: { gp: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "ev1@x.com", full_name: "EV One", plan_id: "${gp}" }
              as: Manager
              captures: { hm: "$.data.id" }
            - call: "POST /v1/members/${hm}/wallet/adjustments"
              payload: { amount_cents: 100000 }
              as: Manager
            - call: "POST /v1/tables"
              payload: { table_number: 4, table_type: "POOL_9FT", seat_capacity: 8, hourly_rate_cents: 1200 }
              as: Manager
              captures: { et: "$.data.id" }
            - call: "POST /v1/events"
              payload: { host_member_id: "${hm}", table_count: 1, start_at: "2026-07-04T10:00:00Z", end_at: "2026-07-04T12:00:00Z" }
              as: Member
              as_user_id: "${hm}"
              captures: { ev: "$.data.id" }
            - call: "POST /v1/events/${ev}/quote"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /v1/events/${ev}/pay-deposit"
              payload: {}
              as: Member
              as_user_id: "${hm}"
            - call: "POST /v1/events/${ev}/book"
              payload: {}
              as: Member
              as_user_id: "${hm}"
          assert:
            - "Event.${ev}.booking_status == BOOKED"
            - "Event.${ev}.payment_status == DEPOSIT_PAID"
            - "Event.${ev}.deposit_paid_cents == 2000"
            - "Member.${hm}.wallet_credit_cents == 98000"

      - name: pooltable_maintenance_activate_cycle
        grounds:
          - state_machines.PoolTable
          - state_machines.PoolTable.ACTIVE_to_MAINTENANCE
          - state_machines.PoolTable.MAINTENANCE_to_ACTIVE
        distinguishing_aspect: "A PoolTable cycles ACTIVE -> MAINTENANCE -> ACTIVE (a back-edge), a different non-linear entity than Event; the second activate returns status to ACTIVE."
        test_recipe:
          setup:
            - "One ACTIVE table."
          setup_api_calls:
            - call: "POST /v1/tables"
              payload: { table_number: 5, table_type: "SNOOKER", seat_capacity: 2, hourly_rate_cents: 1500 }
              as: Manager
              captures: { mt: "$.data.id" }
          trigger:
            - call: "POST /v1/tables/${mt}/maintenance"
              payload: {}
              as: Manager
            - call: "POST /v1/tables/${mt}/activate"
              payload: {}
              as: Manager
          assert:
            - "PoolTable.${mt}.status == ACTIVE"

  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: table_retire_cancels_reservation_cancels_event_refunds_deposit
        grounds:
          - state_machines.PoolTable.ACTIVE_to_RETIRED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - state_machines.Event
          - entities.Event.fields.payment_status
        distinguishing_aspect: "Depth-3 chain from a table retire: PoolTable retire -> its future Reservation CANCELLED -> that Reservation's Event CANCELLED -> host wallet refunded the 2000 deposit; each hop is caused by the prior one."
        test_recipe:
          setup:
            - "Host funded 100000; one ACTIVE table; Event(1 table, 2h) QUOTED, deposit paid (2000), BOOKED — creating one CONFIRMED event reservation on the table; clock 2026-07-01."
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { tier: "GOLD", monthly_fee_cents: 8000, table_discount_pct: 0.20 }
              as: Manager
              captures: { gp2: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "tc1@x.com", full_name: "TC One", plan_id: "${gp2}" }
              as: Manager
              captures: { th: "$.data.id" }
            - call: "POST /v1/members/${th}/wallet/adjustments"
              payload: { amount_cents: 100000 }
              as: Manager
            - call: "POST /v1/tables"
              payload: { table_number: 6, table_type: "POOL_9FT", seat_capacity: 8, hourly_rate_cents: 1200 }
              as: Manager
              captures: { rt: "$.data.id" }
            - call: "POST /v1/events"
              payload: { host_member_id: "${th}", table_count: 1, start_at: "2026-07-03T10:00:00Z", end_at: "2026-07-03T12:00:00Z" }
              as: Member
              as_user_id: "${th}"
              captures: { rev: "$.data.id" }
            - call: "POST /v1/events/${rev}/quote"
              payload: {}
              as: Manager
            - call: "POST /v1/events/${rev}/pay-deposit"
              payload: {}
              as: Member
              as_user_id: "${th}"
            - call: "POST /v1/events/${rev}/book"
              payload: {}
              as: Member
              as_user_id: "${th}"
            - call: "GET /v1/reservations?event_id=${rev}"
              payload: {}
              as: FrontDesk
              captures: { rres: "$.data[0].id" }
          trigger:
            - call: "POST /v1/tables/${rt}/retire"
              payload: {}
              as: Manager
          assert:
            - "PoolTable.${rt}.status == RETIRED"
            - "Reservation.${rres}.status == CANCELLED"
            - "Event.${rev}.booking_status == CANCELLED"
            - "Event.${rev}.payment_status == REFUNDED"
            - "Member.${th}.wallet_credit_cents == 100000"

      - name: reservation_noshow_suspends_member_cancels_other_reservations
        grounds:
          - state_machines.Reservation.CONFIRMED_to_NO_SHOW
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - entities.Member.fields.no_show_strikes
        distinguishing_aspect: "Depth-2 chain from a different trigger (no-show): the 3rd Reservation NO_SHOW pushes no_show_strikes to 3 -> Member ACTIVE->SUSPENDED -> the member's remaining CONFIRMED reservation is CANCELLED."
        test_recipe:
          setup:
            - "Member ACTIVE with no strikes; one table; three CONFIRMED reservations at 10-11, 12-13, 14-15 on 2026-07-02 plus one CONFIRMED survivor on 2026-07-05 10-11; clock 2026-07-01."
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { tier: "BRONZE", monthly_fee_cents: 3000, table_discount_pct: 0.0 }
              as: Manager
              captures: { nbp: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "ns1@x.com", full_name: "NS One", plan_id: "${nbp}" }
              as: Manager
              captures: { nm: "$.data.id" }
            - call: "POST /v1/tables"
              payload: { table_number: 7, table_type: "POOL_7FT", seat_capacity: 4, hourly_rate_cents: 1000 }
              as: Manager
              captures: { nt: "$.data.id" }
            - call: "POST /v1/reservations"
              payload: { member_id: "${nm}", table_id: "${nt}", start_at: "2026-07-02T10:00:00Z", end_at: "2026-07-02T11:00:00Z", party_size: 2 }
              as: FrontDesk
              captures: { nr1: "$.data.id" }
            - call: "POST /v1/reservations/${nr1}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /v1/reservations"
              payload: { member_id: "${nm}", table_id: "${nt}", start_at: "2026-07-02T12:00:00Z", end_at: "2026-07-02T13:00:00Z", party_size: 2 }
              as: FrontDesk
              captures: { nr2: "$.data.id" }
            - call: "POST /v1/reservations/${nr2}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /v1/reservations"
              payload: { member_id: "${nm}", table_id: "${nt}", start_at: "2026-07-02T14:00:00Z", end_at: "2026-07-02T15:00:00Z", party_size: 2 }
              as: FrontDesk
              captures: { nr3: "$.data.id" }
            - call: "POST /v1/reservations/${nr3}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /v1/reservations"
              payload: { member_id: "${nm}", table_id: "${nt}", start_at: "2026-07-05T10:00:00Z", end_at: "2026-07-05T11:00:00Z", party_size: 2 }
              as: FrontDesk
              captures: { nr4: "$.data.id" }
            - call: "POST /v1/reservations/${nr4}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T10:20:00Z" }
              as: Manager
            - call: "POST /v1/reservations/${nr1}/no-show"
              payload: {}
              as: FrontDesk
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T12:20:00Z" }
              as: Manager
            - call: "POST /v1/reservations/${nr2}/no-show"
              payload: {}
              as: FrontDesk
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T14:20:00Z" }
              as: Manager
          trigger:
            - call: "POST /v1/reservations/${nr3}/no-show"
              payload: {}
              as: FrontDesk
          assert:
            - "Member.${nm}.no_show_strikes == 3"
            - "Member.${nm}.membership_status == SUSPENDED"
            - "Reservation.${nr3}.status == NO_SHOW"
            - "Reservation.${nr4}.status == CANCELLED"

  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_tournament_entry
        grounds:
          - validations[priority=4]
          - validations[priority=13]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INSUFFICIENT_FUNDS]
        distinguishing_aspect: "An entry into a SCHEDULED (not REGISTRATION_OPEN) tournament by a broke member violates both the state check (priority 4) and the fiscal check (priority 13); the state error wins — category pair state vs business_fiscal."
        test_recipe:
          setup:
            - "Member with wallet 0; tournament entry_fee 5000 left in SCHEDULED (never opened)."
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { tier: "BRONZE", monthly_fee_cents: 3000, table_discount_pct: 0.0 }
              as: Manager
              captures: { p5a: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "pc1@x.com", full_name: "PC One", plan_id: "${p5a}" }
              as: Manager
              captures: { pm1: "$.data.id" }
            - call: "POST /v1/tournaments"
              payload: { name: "SchedCup", format: "SINGLE_ELIM", entry_fee_cents: 5000, max_entries: 8 }
              as: Manager
              captures: { pt1: "$.data.id" }
          trigger:
            - call: "POST /v1/tournament-entries"
              payload: { tournament_id: "${pt1}", member_id: "${pm1}" }
              as: Member
              as_user_id: "${pm1}"
              captures: { err5a: "$.data.error_id" }
          assert:
            - "trigger response data.error_id == ERR_INVALID_STATE"
            - "trigger response HTTP status == 409"
            - "Member.${pm1}.wallet_credit_cents == 0"

      - name: temporal_beats_constraint_on_reservation
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_TABLE_TIME_CONFLICT]
          - errors[ERR_CAPACITY_EXCEEDED]
        distinguishing_aspect: "A reservation that both overlaps an existing one (priority 8) and exceeds seat_capacity (priority 10) returns ERR_TABLE_TIME_CONFLICT — category pair business_temporal vs business_constraint, distinct from the state/fiscal pair above."
        test_recipe:
          setup:
            - "Table seat_capacity 4; a CONFIRMED reservation 2026-07-06T10:00-11:00 on it."
