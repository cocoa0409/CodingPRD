  # ===========================================================================
  # Section: validations — violation-to-error not already covered by §1.8
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "Request without X-User-ID/X-User-Role returns ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER 400."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "GET /grow/customers", payload: {}, as: None, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "http_status == 400"

      - name: confirm_empty_order_returns_empty_order
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_EMPTY_ORDER]"
          - "state_machines.StandingOrder.DRAFT_to_CONFIRMED"
        distinguishing_aspect: "Confirming a DRAFT order with zero lines fails with ERR_EMPTY_ORDER."
        test_recipe:
          setup: ["customer; DRAFT order with no lines"]
          setup_api_calls:
            - { call: "POST /grow/customers", payload: { business_name: "R5", contact_email: "r5@r.com", delivery_zone: "NORTH" }, as: OpsManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /grow/standing-orders", payload: { customer_id: "${cust_id}", effective_week_start: "2026-08-03", change_cutoff_day: 2 }, as: Chef, as_user_id: "${cust_id}", captures: { so_id: "$.data.id", so_v: "$.data.version" } }
          trigger:
            - { call: "POST /grow/standing-orders/${so_id}/confirm", payload: { expected_standing_order_version: "${so_v}" }, as: Chef, as_user_id: "${cust_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_EMPTY_ORDER"
            - "StandingOrder(${so_id}).status == DRAFT (unchanged)"

      - name: dispatch_empty_route_returns_empty_route
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_EMPTY_ROUTE]"
          - "state_machines.DeliveryRoute.PLANNED_to_DISPATCHED"
        distinguishing_aspect: "Dispatching a route with zero SCHEDULED stops fails with ERR_EMPTY_ROUTE."
        test_recipe:
          setup: ["PLANNED route with no stops"]
          setup_api_calls:
            - { call: "POST /grow/delivery-routes", payload: { route_code: "R-EMPTY", service_date: "2026-08-14", min_stop_subtotal_cents: 100 }, as: OpsManager, captures: { route_id: "$.data.id" } }
          trigger:
            - { call: "POST /grow/delivery-routes/${route_id}/dispatch", payload: {}, as: OpsManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_EMPTY_ROUTE"
            - "DeliveryRoute(${route_id}).status == PLANNED (unchanged)"

