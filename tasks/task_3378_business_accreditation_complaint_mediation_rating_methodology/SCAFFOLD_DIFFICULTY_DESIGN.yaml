  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: dues_payment_then_refunds_conserve_bureau_collected_total
        grounds:
          - state_machines.DuesInvoice
          - calculations.dues_amount
          - entities.Bureau.fields.dues_collected_cents
        distinguishing_aspect: "Conserved MONEY quantity (different quantity type from the complaint-count instance): Bureau.dues_collected_cents == sum over non-VOID invoices of (paid_cents - refunded_cents); a full payment followed by a partial and a completing refund returns the bureau to its initial collected total and the invoice to ISSUED."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Bureau fee 0 over IA/NE; SMALL business (10 employees, founded 2020-01-01)."
            - "Application approved; invoice issued: amount_due_cents 64600 (round_half_up(68000 * 0.95)), status ISSUED."
          setup_api_calls:
            - *d_clock
            - *d_bureau
            - call: "POST /businesses"
              payload: { legal_name: "Small Ledger LLC", home_state_code: "IA", employee_count: 10, founded_on: "2020-01-01T00:00:00Z" }
              as: BureauAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /businesses/${biz_id}/accreditation-applications"
              payload: { billing_plan: "ANNUAL_PREPAID", license_number: "LIC-S-1" }
              as: BusinessRep
              as_user_id: "${biz_id}"
              captures: { app_id: $.data.id }
            - call: "POST /accreditation-applications/${app_id}/submit"
              payload: {}
              as: BusinessRep
              as_user_id: "${biz_id}"
            - call: "POST /accreditation-applications/${app_id}/decision"
              payload: { decision: "APPROVE", advertising_practices_result: "PASS", complaint_history_result: "PASS", licensing_result: "PASS" }
              as: StandardsReviewer
              captures: { inv_id: $.data.dues_invoice_id }
            - call: "POST /bureaus/${bureau_id}/run_daily_close"
              payload: {}
              as: BureauAdmin
              captures: { collected_0: $.data.dues_collected_cents }
          trigger:
            - call: "POST /dues-invoices/${inv_id}/ledger-entries"
              payload: { kind: "PAYMENT", amount_cents: 64600 }
              as: BusinessRep
              as_user_id: "${biz_id}"
              captures: { inv_status_paid: $.data.status }
            - call: "POST /bureaus/${bureau_id}/run_daily_close"
              payload: {}
              as: BureauAdmin
              captures: { collected_1: $.data.dues_collected_cents }
            - call: "POST /dues-invoices/${inv_id}/ledger-entries"
              payload: { kind: "REFUND", amount_cents: 20000 }
              as: BureauAdmin
              captures: { inv_status_partial: $.data.status, inv_balance_partial: $.data.balance_cents }
            - call: "POST /bureaus/${bureau_id}/run_daily_close"
              payload: {}
              as: BureauAdmin
              captures: { collected_2: $.data.dues_collected_cents }
            - call: "POST /dues-invoices/${inv_id}/ledger-entries"
              payload: { kind: "REFUND", amount_cents: 44600 }
              as: BureauAdmin
              captures: { inv_status_final: $.data.status, inv_balance_final: $.data.balance_cents }
            - call: "POST /bureaus/${bureau_id}/run_daily_close"
              payload: {}
              as: BureauAdmin
              captures: { collected_3: $.data.dues_collected_cents }
          assert:
            - "collected sequence is 0 -> 64600 -> 44600 -> 0: dues_collected_cents == sum(paid_cents - refunded_cents) at every step"
            - "payment of 64600 == amount_due_cents flips ISSUED -> PAID with balance_cents == 0"
            - "partial refund 20000 flips PAID -> PARTIALLY_PAID with balance_cents == 20000"
            - "completing refund 44600 (== paid 64600 - refunded 20000) flips PARTIALLY_PAID -> ISSUED with balance_cents == 64600"
            - "invariant end-state: collected_3 == collected_0 == 0 (no drift from the forward+compensating pair)"
            - "the ACCREDITED application and Business.accreditation_status are unaffected by the refunds (no revert cascade)"

      - name: complaint_close_then_reopen_conserves_total_filed_count
        grounds:
          - state_machines.Complaint.RESPONSE_RECEIVED_to_RESOLVED
          - state_machines.Complaint.RESOLVED_to_FORWARDED
          - entities.Business.fields.complaints_open_count
        distinguishing_aspect: "Conserved COUNT quantity (different quantity type from the dues instance): for the business, complaints_open_count + complaints_closed_count == total complaints filed (2) across the forward close (RESOLVED) and its compensating reopen."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Bureau fee 0 over IA/NE; consumer; LARGE business founded 2018-01-01."
            - "Two complaints c1, c2 filed (open 2, closed 0)."
          setup_api_calls:
            - *d_clock
            - *d_bureau
            - *d_consumer
            - *d_biz_large
            - *d_c1_file
            - *d_c2_file
          trigger:
            - call: "GET /businesses/${biz_id}"
              payload: {}
              as: BureauAdmin
              captures: { open_0: $.data.complaints_open_count, closed_0: $.data.complaints_closed_count }
            - *d_c1_forward
            - call: "POST /complaints/${c1_id}/responses"
              payload: { kind: "BUSINESS_RESPONSE", body: "we fixed it" }
              as: BusinessRep
              as_user_id: "${biz_id}"
            - call: "POST /complaints/${c1_id}/responses"
              payload: { kind: "CONSUMER_ACCEPT", body: "thanks" }
              as: Consumer
              as_user_id: "${consumer_id}"
            - call: "GET /businesses/${biz_id}"
              payload: {}
              as: BureauAdmin
              captures: { open_1: $.data.complaints_open_count, closed_1: $.data.complaints_closed_count }
            - call: "POST /complaints/${c1_id}/reopen"
              payload: {}
              as: BureauAdmin
              captures: { c1_status: $.data.status, c1_reopens: $.data.reopen_count }
            - call: "GET /businesses/${biz_id}"
              payload: {}
              as: BureauAdmin
              captures: { open_2: $.data.complaints_open_count, closed_2: $.data.complaints_closed_count }
          assert:
            - "after filing: complaints_open_count == 2 and complaints_closed_count == 0"
            - "after CONSUMER_ACCEPT: c1 RESOLVED with resolution_outcome CONSUMER_ACCEPTED, and open == 1, closed == 1 (sum 2 conserved)"
            - "after reopen: c1 FORWARDED with reopen_count == 1, closed_at null, and open == 2, closed == 0 (sum 2 conserved)"
            - "Complaint.${c1_id}.response_deadline_at == the new forwarded_at + 14 days (fresh window), and c2 is untouched (still RECEIVED)"
