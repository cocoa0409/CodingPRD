      - name: malt_lot_availability_excludes_lines_on_draft_orders
        claim_type: Input Set Filtering
        grounds:
          - calculations.malt_lot_availability
          - entities.MaltLot.fields.committed_lbs
          - entities.MaltLot.fields.available_lbs
        distinguishing_aspect: "Only lines whose order has reached CONFIRMED or beyond consume the lot: a 1000 lb line parked on a DRAFT order must leave available_lbs untouched, while a 1500 lb line on a confirmed order draws it down — and cancelling that order returns the poundage."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer with credit_limit_cents 5000000; BASE malt product PALE-ALE; a 5000 lb lot analysed and RELEASED."
            - "Order D holds a 1000 lb MALT line and stays DRAFT. Order C holds a 1500 lb MALT line and is confirmed."
