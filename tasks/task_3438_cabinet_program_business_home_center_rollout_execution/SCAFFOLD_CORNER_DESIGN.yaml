# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: cabinet_program_business_home_center_rollout_execution
# Breadth walk of SCAFFOLD.yaml 1.1-1.7 per claim-extraction-guide taxonomy.
# Negative-polarity instances are named with _rejected / _cannot_ / _not_found_
# style markers or capture $.data.error_id.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: account_creation_applies_defaults_and_system_fields
        claim_type: creation_defaults
        grounds: [entities.Account]
        distinguishing_aspect: "A minimal POST /cabinet/accounts returns 201 with system fields (id, created_at, updated_at, version == 1), status defaulting to ACTIVE and open_exposure_cents computed as 0; omitted store_codes defaults to []."
        test_recipe:
          setup: ["empty DB, clock default"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /cabinet/accounts"
              payload: { name: "Dealer A", channel: DEALER, pricing_class: STANDARD, lead_time_class: STANDARD, credit_limit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
          assert:
            - "Response 201; data.id is a UUID; version == 1; created_at == updated_at"
            - "data.status == ACTIVE; data.open_exposure_cents == 0; data.store_codes == []"

      - name: account_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.Account, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting credit_limit_cents (input, no default) fails validation with ERR_INVALID_REQUEST and persists nothing."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cabinet/accounts"
              payload: { name: "Dealer B", channel: DEALER, pricing_class: STANDARD, lead_time_class: STANDARD }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (400)"
            - "Error envelope carries meta.api_request_id and data.message per response_envelope"

      - name: account_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.Account.fields.open_exposure_cents]
        distinguishing_aspect: "Client-supplied open_exposure_cents is ignored: the server-computed 0 is returned and stored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cabinet/accounts"
              payload: { name: "Dealer C", channel: DEALER, pricing_class: STANDARD, lead_time_class: STANDARD, credit_limit_cents: 50000, open_exposure_cents: 999999 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
          assert:
            - "GET /cabinet/accounts/${acct}: open_exposure_cents == 0 (client input ignored)"

      - name: account_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Account, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID yields the error envelope with ERR_NOT_FOUND and http 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /cabinet/accounts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND; envelope response_type == error"

      - name: program_line_self_referential_supersedes_link
        claim_type: parent_relationships
        grounds: [entities.ProgramLine.fields.supersedes_line_id]
        distinguishing_aspect: "The superseding line carries supersedes_line_id of the line it replaced; the reverse filter GET /cabinet/lines?supersedes_line_id=<old> returns exactly the new line."
        test_recipe:
          setup: ["Dealer account; program ACTIVE with line L1; program version observed"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/accounts"
              payload: { name: "Dealer D", channel: DEALER, pricing_class: STANDARD, lead_time_class: STANDARD, credit_limit_cents: 100000000, store_codes: [] }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /cabinet/programs"
              payload: { account_id: "${acct}", name: "P", program_discount_pct: 0.0 }
              as: ProgramManager
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L1", effective_start_week: "2026-W36", families: [{ family_code: "F1", standard_price_cents: 10000, base_lead_weeks: 2, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v}" }
              as: ProgramManager
              captures: { line1: $.data.id }
            - { call: "POST /cabinet/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - call: "GET /cabinet/programs/${prog}"
              as: ProgramManager
              captures: { prog_v2: $.data.version }
          trigger:
            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L2", effective_start_week: "2026-W38", families: [{ family_code: "F1", standard_price_cents: 11000, base_lead_weeks: 2, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v2}", old_line_disposition_qty: 0 }
              as: ProgramManager
              captures: { line2: $.data.id }
          assert:
            - "GET /cabinet/lines/${line2}: supersedes_line_id == ${line1}"
            - "GET /cabinet/lines?supersedes_line_id=${line1}: total_count == 1 and data[0].id == ${line2}"
            - "GET /cabinet/lines/${line1}: status == SUNSETTING"

      - name: order_destination_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Order.fields.destination_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "destination_type outside {JOB_SITE, STORE} fails with ERR_INVALID_REQUEST before any business rule runs."
        test_recipe:
          setup: ["Dealer account; program ACTIVE with line L1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/accounts"
              payload: { name: "Dealer E", channel: DEALER, pricing_class: STANDARD, lead_time_class: STANDARD, credit_limit_cents: 100000000, store_codes: [] }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /cabinet/programs"
              payload: { account_id: "${acct}", name: "P", program_discount_pct: 0.0 }
              as: ProgramManager
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L1", effective_start_week: "2026-W36", families: [{ family_code: "F1", standard_price_cents: 10000, base_lead_weeks: 2, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v}" }
              as: ProgramManager
            - { call: "POST /cabinet/programs/${prog}/activate", payload: {}, as: ProgramManager }
          trigger:
            - call: "POST /cabinet/orders"
              payload: { account_id: "${acct}", program_id: "${prog}", destination_type: PALLET, jobsite_address: "1 Job Ln", requested_delivery_week: "2026-W40", lines: [{ family_code: "F1", finish_code: "OAK", quantity: 1 }] }
              as: DealerRep
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "GET /cabinet/orders?account_id=${acct}: total_count == 0"

  - section: state_machines
    instances:
      - name: program_activate_without_line_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Program.DRAFT_to_ACTIVE, "errors[ERR_NO_ACTIVE_LINE]"]
        distinguishing_aspect: "Activating a DRAFT program that has no ACTIVE line fails with ERR_NO_ACTIVE_LINE; the program stays DRAFT."
        test_recipe:
          setup: ["Dealer account; program created but no line"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/accounts"
              payload: { name: "Dealer F", channel: DEALER, pricing_class: STANDARD, lead_time_class: STANDARD, credit_limit_cents: 1000000, store_codes: [] }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /cabinet/programs"
              payload: { account_id: "${acct}", name: "P", program_discount_pct: 0.0 }
              as: ProgramManager
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /cabinet/programs/${prog}/activate"
              payload: {}
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NO_ACTIVE_LINE"
            - "GET /cabinet/programs/${prog}: status == DRAFT"

      - name: program_transition_roundtrip_auto_returns_active
        claim_type: valid_transition
        grounds: [state_machines.Program.TRANSITIONING_to_ACTIVE]
        distinguishing_aspect: "Full cycle DRAFT->ACTIVE->TRANSITIONING->ACTIVE with the final hop system-derived from line retirement."
        excluded_because:
          difficulty_instance: disposition_actions_conserve_physical_units
          rationale: "That instance's final asserts pin line RETIRED and program back to ACTIVE after the DESTROY reconciliation; same chain, same observables."

      - name: shipment_terminal_delivered_rejects_transition
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Shipment, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A DELIVERED shipment rejects any further to_status with ERR_INVALID_STATE; delivered_at and the linked order stay untouched."
        test_recipe:
          setup: ["Delivered order with its shipment DELIVERED (dealer chain through MFG_COMPLETE)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/accounts"
              payload: { name: "Dealer G", channel: DEALER, pricing_class: VOLUME, lead_time_class: STANDARD, credit_limit_cents: 100000000, store_codes: [] }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /cabinet/programs"
              payload: { account_id: "${acct}", name: "P", program_discount_pct: 0.0 }
              as: ProgramManager
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L1", effective_start_week: "2026-W36", families: [{ family_code: "F1", standard_price_cents: 10000, base_lead_weeks: 3, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v}" }
              as: ProgramManager
            - { call: "POST /cabinet/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /cabinet/production-slots", payload: { plant_code: PLANT_EAST, family_code: "F1", week: "2026-W37", capacity_units: 10 }, as: PlantScheduler }
            - { call: "POST /cabinet/finish-batches", payload: { finish_code: "OAK", batch_code: "B1", lab_l: 50, lab_a: 20, lab_b: 30, effective_from: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/orders"
              payload: { account_id: "${acct}", program_id: "${prog}", destination_type: JOB_SITE, jobsite_address: "1 Job Ln", requested_delivery_week: "2026-W40", lines: [{ family_code: "F1", finish_code: "OAK", quantity: 1 }] }
              as: DealerRep
              as_user_id: "${acct}"
              captures: { o1: $.data.id }
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: ACKNOWLEDGED }, as: ProgramManager }
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: SCHEDULED }, as: PlantScheduler }
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: IN_PRODUCTION }, as: PlantScheduler }
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: MFG_COMPLETE }, as: PlantScheduler }
            - call: "GET /cabinet/shipments?order_id=${o1}"
              as: LogisticsCoordinator
              captures: { ship: "$.data[0].id" }
            - { call: "POST /cabinet/shipments/${ship}/transition", payload: { to_status: LOADED }, as: LogisticsCoordinator }
            - { call: "POST /cabinet/shipments/${ship}/transition", payload: { to_status: IN_TRANSIT }, as: LogisticsCoordinator }
            - { call: "POST /cabinet/shipments/${ship}/transition", payload: { to_status: DELIVERED }, as: LogisticsCoordinator }
          trigger:
            - call: "POST /cabinet/shipments/${ship}/transition"
              payload: { to_status: FAILED }
              as: LogisticsCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "GET /cabinet/shipments/${ship}: status == DELIVERED, attempt_count == 0, delivered_at == 2026-09-01T00:00:00Z"

      - name: shipment_retry_cycle_exhausts_to_auto_returned
        claim_type: valid_transition
        grounds: [state_machines.Shipment.IN_TRANSIT_to_FAILED, state_machines.Shipment.FAILED_to_RETURNED]
        distinguishing_aspect: "The FAILED -> PLANNED retry loop is bounded: the third FAILED transition auto-moves the shipment to RETURNED (system transition), and further replan is rejected."
        test_recipe:
          setup: ["Order at MFG_COMPLETE; shipment PLANNED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/accounts"
              payload: { name: "Dealer H", channel: DEALER, pricing_class: VOLUME, lead_time_class: STANDARD, credit_limit_cents: 100000000, store_codes: [] }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /cabinet/programs"
              payload: { account_id: "${acct}", name: "P", program_discount_pct: 0.0 }
              as: ProgramManager
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L1", effective_start_week: "2026-W36", families: [{ family_code: "F1", standard_price_cents: 10000, base_lead_weeks: 3, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v}" }
              as: ProgramManager
            - { call: "POST /cabinet/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /cabinet/production-slots", payload: { plant_code: PLANT_EAST, family_code: "F1", week: "2026-W37", capacity_units: 10 }, as: PlantScheduler }
            - { call: "POST /cabinet/finish-batches", payload: { finish_code: "OAK", batch_code: "B1", lab_l: 50, lab_a: 20, lab_b: 30, effective_from: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/orders"
              payload: { account_id: "${acct}", program_id: "${prog}", destination_type: JOB_SITE, jobsite_address: "1 Job Ln", requested_delivery_week: "2026-W40", lines: [{ family_code: "F1", finish_code: "OAK", quantity: 1 }] }
              as: DealerRep
              as_user_id: "${acct}"
              captures: { o1: $.data.id }
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: ACKNOWLEDGED }, as: ProgramManager }
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: SCHEDULED }, as: PlantScheduler }
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: IN_PRODUCTION }, as: PlantScheduler }
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: MFG_COMPLETE }, as: PlantScheduler }
            - call: "GET /cabinet/shipments?order_id=${o1}"
              as: LogisticsCoordinator
              captures: { ship: "$.data[0].id" }
          trigger:
            - { call: "POST /cabinet/shipments/${ship}/transition", payload: { to_status: LOADED }, as: LogisticsCoordinator }
            - { call: "POST /cabinet/shipments/${ship}/transition", payload: { to_status: IN_TRANSIT }, as: LogisticsCoordinator }
            - { call: "POST /cabinet/shipments/${ship}/transition", payload: { to_status: FAILED }, as: LogisticsCoordinator }
            - { call: "POST /cabinet/shipments/${ship}/transition", payload: { to_status: PLANNED }, as: LogisticsCoordinator }
            - { call: "POST /cabinet/shipments/${ship}/transition", payload: { to_status: LOADED }, as: LogisticsCoordinator }
            - { call: "POST /cabinet/shipments/${ship}/transition", payload: { to_status: IN_TRANSIT }, as: LogisticsCoordinator }
            - { call: "POST /cabinet/shipments/${ship}/transition", payload: { to_status: FAILED }, as: LogisticsCoordinator }
            - { call: "POST /cabinet/shipments/${ship}/transition", payload: { to_status: PLANNED }, as: LogisticsCoordinator }
            - { call: "POST /cabinet/shipments/${ship}/transition", payload: { to_status: LOADED }, as: LogisticsCoordinator }
            - { call: "POST /cabinet/shipments/${ship}/transition", payload: { to_status: IN_TRANSIT }, as: LogisticsCoordinator }
            - { call: "POST /cabinet/shipments/${ship}/transition", payload: { to_status: FAILED }, as: LogisticsCoordinator }
          assert:
            - "GET /cabinet/shipments/${ship}: attempt_count == 3 AND status == RETURNED (auto-transition on the third failure)"
            - "A further PLANNED attempt is rejected with ERR_INVALID_STATE (RETURNED is terminal)"

      - name: order_skipping_states_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Order, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A SUBMITTED order cannot jump to IN_PRODUCTION; only the declared edge ACKNOWLEDGED is legal from SUBMITTED."
        test_recipe:
          setup: ["Dealer account; program ACTIVE with F1; order SUBMITTED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/accounts"
              payload: { name: "Dealer I", channel: DEALER, pricing_class: VOLUME, lead_time_class: STANDARD, credit_limit_cents: 100000000, store_codes: [] }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /cabinet/programs"
              payload: { account_id: "${acct}", name: "P", program_discount_pct: 0.0 }
              as: ProgramManager
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L1", effective_start_week: "2026-W36", families: [{ family_code: "F1", standard_price_cents: 10000, base_lead_weeks: 3, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v}" }
              as: ProgramManager
            - { call: "POST /cabinet/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - call: "POST /cabinet/orders"
              payload: { account_id: "${acct}", program_id: "${prog}", destination_type: JOB_SITE, jobsite_address: "1 Job Ln", requested_delivery_week: "2026-W40", lines: [{ family_code: "F1", finish_code: "OAK", quantity: 1 }] }
              as: DealerRep
              as_user_id: "${acct}"
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /cabinet/orders/${o1}/transition"
              payload: { to_status: IN_PRODUCTION }
              as: PlantScheduler
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "GET /cabinet/orders/${o1}: status == SUBMITTED (unchanged)"

      - name: order_mfg_complete_auto_creates_planned_shipment
        claim_type: side_effect_execution
        grounds: [state_machines.Order.IN_PRODUCTION_to_MFG_COMPLETE, endpoints.GET_/cabinet/shipments]
        distinguishing_aspect: "The cascade-created Shipment is not in any create response; it is discoverable only via the reverse filter and starts PLANNED with destination copied from the order."
        test_recipe:
          setup: ["Order progressed to IN_PRODUCTION (slot + batch in place)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/accounts"
              payload: { name: "Dealer J", channel: DEALER, pricing_class: VOLUME, lead_time_class: STANDARD, credit_limit_cents: 100000000, store_codes: [] }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /cabinet/programs"
              payload: { account_id: "${acct}", name: "P", program_discount_pct: 0.0 }
              as: ProgramManager
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L1", effective_start_week: "2026-W36", families: [{ family_code: "F1", standard_price_cents: 10000, base_lead_weeks: 3, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v}" }
              as: ProgramManager
            - { call: "POST /cabinet/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /cabinet/production-slots", payload: { plant_code: PLANT_WEST, family_code: "F1", week: "2026-W37", capacity_units: 10 }, as: PlantScheduler }
            - { call: "POST /cabinet/finish-batches", payload: { finish_code: "OAK", batch_code: "B1", lab_l: 50, lab_a: 20, lab_b: 30, effective_from: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/orders"
              payload: { account_id: "${acct}", program_id: "${prog}", destination_type: STORE, store_code: "ST-7", requested_delivery_week: "2026-W40", lines: [{ family_code: "F1", finish_code: "OAK", quantity: 1 }] }
              as: DealerRep
              as_user_id: "${acct}"
              captures: { o1: $.data.id }
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: ACKNOWLEDGED }, as: ProgramManager }
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: SCHEDULED }, as: PlantScheduler }
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: IN_PRODUCTION }, as: PlantScheduler }
          trigger:
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: MFG_COMPLETE }, as: PlantScheduler }
          assert:
            - "GET /cabinet/shipments?order_id=${o1}: total_count == 1, data[0].status == PLANNED"
            - "data[0].destination_type == STORE AND data[0].store_code == ST-7 (copied from the order)"

      - name: display_resets_auto_created_per_store_on_supersede
        claim_type: side_effect_execution
        grounds: [state_machines.ProgramLine.ACTIVE_to_SUNSETTING, entities.DisplayReset]
        distinguishing_aspect: "Superseding the line of a RETAIL program with store_codes [ST-1, ST-2] creates exactly two DisplayResets (one per store code), each PLANNED with line_id pointing at the sunsetting line."
        test_recipe:
          setup: ["RETAIL account with two stores; program ACTIVE with line L1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/accounts"
              payload: { name: "Retail R4", channel: RETAIL, pricing_class: STANDARD, lead_time_class: STANDARD, credit_limit_cents: 100000000, store_codes: ["ST-1", "ST-2"] }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /cabinet/programs"
              payload: { account_id: "${acct}", name: "P", program_discount_pct: 0.0 }
              as: ProgramManager
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /cabinet/programs/${prog}/lines"
