# =============================================================================
# PRD Benchmark Scaffold — Creator Monetization Review, Content Claims &
# Revenue Split (YouTube)
#
# §1.0-§1.7 only.  §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml and §1.9 lives
# in SCAFFOLD_CORNER_DESIGN.yaml — neither key appears in this file.
# =============================================================================

scenario: |
  Creator Monetization Review, Content Claims & Revenue Split (YouTube): channel
  eligibility for monetization based on watch time, subscriber thresholds and
  policy review, advertiser-friendly content classification with limited or no
  ads outcomes and appeal, rights holder reference files generating automatic
  claims on uploads with match confidence, claim dispute and appeal ladder
  escalating to takedown with copyright strike consequences, revenue routing
  during a disputed claim with retroactive payment after resolution, channel
  strike system with expiration and termination thresholds, membership, super
  chat and shopping revenue streams with separate splits, payment threshold, tax
  documentation and withholding by country

domain_name: creator-monetization-claims
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - scheduled_deferred_actions
    - rate_threshold_triggers
    - selector_policy
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim; no scenario customization)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Channel
    parent: null
    common_fields: true
    fields:
      - { name: channel_name, type: string, source: input, description: "Display name of the channel" }
      - { name: country_code, type: string, source: input, description: "ISO-3166 alpha-2 country of the channel owner; selects the withholding regime" }
      - { name: lifetime_watch_hours, type: integer, source: input, description: "Public watch hours accumulated over the trailing 365 days" }
      - { name: subscriber_count, type: integer, source: input, description: "Current subscriber count" }
      - { name: policy_strike_count, type: integer, source: input, default: 0, description: "Community-guideline policy strikes currently ACTIVE on this channel (> 0 pins the channel at RESTRICTED)" }
      - { name: copyright_strike_count, type: computed, default: 0, description: "Number of CopyrightStrike rows whose status == ACTIVE for this channel" }
      - { name: last_copyright_strike_activated_at, type: datetime, source: computed, description: "created_at of the most recent CopyrightStrike whose status is ACTIVE or EXPIRED; null when none exists" }
      - { name: monetization_status, type: enum, source: system, default: MONETIZATION_NOT_APPLIED, constraints: "MONETIZATION_NOT_APPLIED | MONETIZATION_PENDING | MONETIZATION_APPROVED | MONETIZATION_REJECTED | MONETIZATION_REVOKED" }
      - { name: monetization_posture, type: enum, source: computed, constraints: "OPEN | RESTRICTED | FROZEN — derived field; gates every revenue-generating operation on this channel" }
      - { name: membership_offered, type: boolean, source: input, default: false, description: "Whether the channel sells memberships" }
      - { name: tax_tin_status, type: enum, source: input, default: TIN_MISSING, constraints: "TIN_MISSING | TIN_PROVIDED" }
      - { name: tax_treaty, type: boolean, source: input, default: false, description: "Whether a reduced-rate treaty applies for a non-US country_code" }
      - { name: payment_threshold_cents, type: integer, source: input, default: 10000, description: "Adjusted-net balance that must be reached before a payout batch may be issued" }

  - name: ContentItem
    parent: Channel
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: system, description: "FK -> Channel.id; the owning channel" }
      - { name: title, type: string, source: input, description: "Video title" }
      - { name: duration_seconds, type: integer, source: input, description: "Runtime length of the upload" }
      - { name: category_code, type: string, source: input, description: "Advertiser category used by the content classification rules" }
      - { name: self_declared_mature, type: boolean, source: input, default: false, description: "Uploader's own maturity marking" }
      - { name: upload_status, type: enum, source: system, default: UPLOADED, constraints: "UPLOADED | CLASSIFYING | CLASSIFIED | CLAIM_SCAN_COMPLETE" }
      - { name: ad_suitability, type: enum, source: system, description: "AD_FRIENDLY | LIMITED_ADS | NO_ADS — derived, resolved only when upload_status == CLAIM_SCAN_COMPLETE" }
      - { name: limited_ads_reasons, type: array, source: computed, description: "Sorted category codes that triggered a LIMITED_ADS or NO_ADS outcome; empty for AD_FRIENDLY" }
      - { name: gross_revenue_cents, type: integer, source: system, default: 0, description: "Ad revenue earned by this item and not yet routed" }
      - { name: routed_revenue_cents, type: integer, source: computed, default: 0, description: "Sum of the creator_shares of all RevenueRouting rows recorded against this item" }
      - { name: holds_revenue, type: boolean, source: computed, default: false, description: "True while at least one RevenueRouting row on this item is in status ESCROW or RETROACTIVE_OWED" }
      - { name: takedown_flag, type: boolean, source: computed, default: false, description: "True while any Claim on this item is in status TAKEN_DOWN" }

  - name: AdReview
    parent: ContentItem
    common_fields: false
    fields:
      - { name: content_item_id, type: string, source: system, description: "FK -> ContentItem.id; the classified upload" }
      - { name: outcome, type: enum, source: system, constraints: "AD_FRIENDLY | LIMITED_ADS | NO_ADS" }
      - { name: reason_codes, type: array, source: system, description: "Sorted category_code values that produced a non-AD_FRIENDLY outcome" }
      - { name: matched_categories, type: array, source: system, description: "Sorted limited-eligible category codes actually matched by this item" }
      - { name: like_count, type: integer, source: input, description: "Likes at classification time (mild-language predictor input)" }
      - { name: comment_count, type: integer, source: input, description: "Comments at classification time (mild-language predictor input)" }
      - { name: appeal_outcome, type: enum, source: system, constraints: "NONE | UPHELD" }
      - { name: is_visible, type: boolean, source: system, default: true, description: "False once the item is taken down" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits — the reviewer-pass timestamp" }

  - name: ReferenceFile
    parent: null
    common_fields: true
    fields:
      - { name: rights_holder_name, type: string, source: input, description: "Name of the rights holder" }
      - { name: asset_kind, type: enum, source: input, constraints: "AUDIO | VIDEO | VISUAL" }
      - { name: reference_fingerprint, type: string, source: input, description: "Globally unique fingerprint of the reference asset; no two ReferenceFiles may share it" }
      - { name: policy_mode, type: enum, source: input, constraints: "MONETIZE | TRACK | BLOCK" }
      - { name: claimed_segment_seconds, type: integer, source: input, description: "Length of the matched segment whenever this reference fires" }
      - { name: is_active, type: boolean, source: input, default: true }

  - name: Claim
    parent: ContentItem
    common_fields: true
    fields:
      - { name: content_item_id, type: string, source: system, description: "FK -> ContentItem.id; the claimed upload" }
      - { name: reference_file_id, type: string, source: system, description: "FK -> ReferenceFile.id; the reference that matched" }
      - { name: match_confidence, type: number, source: system, description: "Match confidence 0.000-1.000 (three decimals, floor) between the upload and the reference fingerprint" }
      - { name: source, type: enum, source: system, constraints: "REFERENCE_AUTO | MANUAL" }
      - { name: status, type: enum, source: system, constraints: "ACTIVE | DISPUTED | APPEALED | REINSTATED | RELEASED | TAKEN_DOWN" }
      - { name: claim_level, type: enum, source: system, default: STANDARD, constraints: "STANDARD | HIGH" }
      - { name: lock_reason, type: enum, source: system, default: NONE, constraints: "NONE | PENDING_RETRO | RETROACTIVE_OWED" }
      - { name: revenue_locked, type: boolean, source: computed, default: false, description: "True while lock_reason != NONE" }
      - { name: taken_down_at, type: datetime, source: system, nullable: true, description: "Null until the claim reaches TAKEN_DOWN" }
      - { name: dispute_deadline_at, type: datetime, source: system, nullable: true, description: "Set when the claim first becomes DISPUTED — created_at + 30 days" }
      - { name: appeal_attempts, type: integer, source: computed, default: 0, description: "Number of creator appeal attempts recorded against this claim" }
      - { name: appeal_count, type: integer, source: computed, default: 0, description: "Number of ClaimAppeal rows whose status == PENDING for this claim" }
      - { name: copyright_counter_notified, type: boolean, source: input, default: false, description: "Set true by POST /claims/{claimId}/counter-notifications; the standing prerequisite for releasing a TAKEN_DOWN claim" }

  - name: ClaimDispute
    parent: Claim
    common_fields: false
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; the disputed claim" }
      - { name: reason_code, type: enum, source: input, constraints: "FAIR_USE | LICENSED | PUBLIC_DOMAIN | MISMATCH | OWNERSHIP" }
      - { name: narrative, type: string, source: input, description: "Free-text justification (max 2000 characters)" }
      - { name: status, type: enum, source: system, constraints: "FILED | RELEASED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits — the dispute filing timestamp" }

  - name: ClaimAppeal
    parent: Claim
    common_fields: false
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; the appealed claim" }
      - { name: appeal_level, type: enum, source: system, constraints: "FIRST | SECOND" }
      - { name: grounds_code, type: enum, source: input, constraints: "REVIEW_ERROR | NEW_EVIDENCE | MISIDENTIFIED" }
      - { name: status, type: enum, source: system, constraints: "PENDING | UPHELD | DENIED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits — the appeal filing timestamp" }

  - name: CopyrightStrike
    parent: null
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: system, description: "FK -> Channel.id; the struck channel" }
      - { name: content_item_id, type: string, source: system, description: "FK -> ContentItem.id; the taken-down upload that produced this strike" }
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; the claim that escalated to takedown" }
      - { name: strike_sequence, type: integer, source: system, description: "1-based ordinal of this strike within its channel, ordered by created_at ASC" }
      - { name: status, type: enum, source: system, constraints: "ACTIVE | EXPIRED" }
      - { name: acknowledged, type: boolean, source: input, default: false, description: "The creator has confirmed receipt of the takedown notice" }
      - { name: expires_at, type: datetime, source: system, description: "created_at + 90 days; the strike is swept to EXPIRED once the logical clock reaches this instant" }

  - name: RevenueRouting
    parent: ContentItem
    common_fields: false
    fields:
      - { name: content_item_id, type: string, source: system, description: "FK -> ContentItem.id; the item whose revenue is being routed" }
      - { name: claim_id, type: string, source: system, nullable: true, description: "FK -> Claim.id; the claim that captured this segment, or null when no claim applies" }
      - { name: stream_type, type: enum, source: input, constraints: "AD | MEMBERSHIP | SUPER_CHAT | SHOPPING" }
      - { name: gross_revenue_cents, type: integer, source: input, description: "Gross revenue in cents for this routing record" }
      - { name: matched_segment_seconds, type: integer, source: computed, default: 0, description: "Claimed segment length consumed by this record (0 for a full-item routing)" }
      - { name: creator_share_cents, type: integer, source: computed, description: "Cents payable to the creator under the applicable stream split" }
      - { name: partner_share_cents, type: integer, source: computed, description: "Cents payable to the claimant; always gross_revenue_cents - creator_share_cents" }
      - { name: status, type: enum, source: system, constraints: "ESCROW | PAID_CREATOR | RETROACTIVE_OWED | RELEASED_TO_CREATOR" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits — the routing timestamp" }

  - name: RevenueEvent
    parent: Channel
    common_fields: false
    fields:
      - { name: channel_id, type: string, source: system, description: "FK -> Channel.id; the earning channel" }
      - { name: stream_type, type: enum, source: input, constraints: "AD | MEMBERSHIP | SUPER_CHAT | SHOPPING" }
      - { name: content_item_id, type: string, source: system, nullable: true, description: "FK -> ContentItem.id; null for a channel-wide stream event" }
      - { name: amount_cents, type: integer, source: input, description: "Gross amount in cents" }
      - { name: occurred_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits; defaults to the logical clock at creation" }
      - { name: routed, type: boolean, source: system, default: false, description: "True once a RevenueRouting row has been created from this event" }

  - name: PayoutBatch
    parent: Channel
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: system, description: "FK -> Channel.id; the channel being paid" }
      - { name: route_batch_id, type: string, source: system, description: "FK -> PayoutBatch.id; the route stage of payout. Null when this row IS the route stage; self-reference links the PAYOUT row to its ROUTE row" }
      - { name: stage, type: enum, source: system, constraints: "ROUTE | PAYOUT" }
      - { name: status, type: enum, source: system, constraints: "LOCKED | RELEASED | FAILED" }
      - { name: period_start_at, type: datetime, source: input, description: "Inclusive lower bound on RevenueRouting.created_at" }
      - { name: period_end_at, type: datetime, source: input, description: "Exclusive upper bound on RevenueRouting.created_at" }
      - { name: gross_cents, type: integer, source: computed, default: 0, description: "Sum of gross_revenue_cents over the routed set" }
      - { name: creator_share_cents, type: integer, source: computed, default: 0, description: "Sum of creator_share_cents over the routed set" }
      - { name: partner_share_cents, type: integer, source: computed, default: 0, description: "Sum of partner_share_cents over the routed set" }
      - { name: held_cents, type: integer, source: computed, default: 0, description: "Sum of creator_share_cents over the held (ESCROW) subset — parked, not paid" }
      - { name: tax_withheld_cents, type: integer, source: computed, default: 0, description: "Withholding applied to the payable set at release" }
      - { name: withholding_rate_pct, type: number, source: computed, description: "Effective withholding rate selected from the channel's country regime" }
      - { name: adjusted_net_cents, type: integer, source: computed, description: "creator_share_cents - held_cents - tax_withheld_cents; floored at 0" }
      - { name: paid_at, type: datetime, source: system, nullable: true, description: "Set when the batch is released" }

  - name: ChannelStrike
    parent: Channel
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: system, description: "FK -> Channel.id; the struck channel" }
      - { name: kind, type: enum, source: input, constraints: "COMMUNITY" }
      - { name: reason_code, type: enum, source: input, constraints: "SEXUAL_CONTENT | VIOLENT_CONTENT | HATE_SPEECH" }
      - { name: status, type: enum, source: system, constraints: "ACTIVE | EXPIRED" }
      - { name: issued_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits; the issuance instant" }
      - { name: expires_at, type: datetime, source: system, description: "issued_at + 90 days; swept to EXPIRED once the logical clock reaches this instant" }

  - name: MembershipSchedule
    parent: Channel
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: system, description: "FK -> Channel.id; the selling channel" }
      - { name: tier_name, type: string, source: input, description: "Name of the membership tier" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Gross membership fee in cents" }
      - { name: perks, type: array, source: input, default: [], description: "Free-text perk list" }
      - { name: creator_share_cents, type: integer, source: computed, description: "Monthly fee times MEMBERSHIP_CREATOR_RATE (0.70), rounded half-up" }
      - { name: platform_share_cents, type: integer, source: computed, description: "Monthly fee times 0.30, rounded half-up" }
      - { name: network_fee_cents, type: integer, source: computed, description: "Monthly fee times NETWORK_FEE_RATE (0.03), rounded half-up" }
      - { name: member_charge_cents, type: integer, source: computed, description: "monthly_fee_cents + network_fee_cents" }

  - name: ChannelMembership
    parent: Channel
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: system, description: "FK -> Channel.id; the joined channel" }
      - { name: member_name, type: string, source: input, description: "Display name of the member" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Fee this member pays each month" }
      - { name: joined_at, type: datetime, source: input, description: "Membership start instant; the primary tie-break in member_payout_ranking" }
      - { name: paid_member_months, type: integer, source: computed, default: 0, description: "Count of paid months; the ranking key for member_payout_ranking" }
      - { name: status, type: enum, source: system, default: ACTIVE, constraints: "ACTIVE" }
      - { name: payout_cents, type: integer, source: computed, default: 0, description: "Cents granted by the most recent member payout run" }
# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Channel
    initial_state: MONETIZATION_NOT_APPLIED
    terminal_states: []
    transitions:
      - from: MONETIZATION_NOT_APPLIED
        to: MONETIZATION_PENDING
        trigger: "POST /channels/{channelId}/monetization-applications"
        actor: Creator
        preconditions:
          - "channel.lifetime_watch_hours >= 4000"
          - "channel.subscriber_count >= 1000"
          - "channel.policy_strike_count == 0"
        side_effects:
          - "Channel.monetization_status -> MONETIZATION_PENDING"
          - "Channel.monetization_posture recomputed (still OPEN: only MONETIZATION_REVOKED or policy_strike_count > 0 force RESTRICTED/FROZEN)"

      - from: MONETIZATION_PENDING
        to: MONETIZATION_APPROVED
        trigger: "POST /channels/{channelId}/monetization-review"
        actor: MonetizationReviewer
        preconditions:
          - "channel.monetization_status == MONETIZATION_PENDING"
          - "every ContentItem of the channel with upload_status == CLASSIFIED or CLAIM_SCAN_COMPLETE has ad_suitability != NO_ADS"
        side_effects:
          - "Channel.monetization_status -> MONETIZATION_APPROVED"
          - "hop 1: for the reviewed channel, settle every ContentItem with upload_status == CLASSIFIED -> CLAIM_SCAN_COMPLETE"
          - "hop 2: the settlement in hop 1 materializes one Claim per ContentItem whose rights-scan match_confidence >= 0.500; if the reviewed channel's monetization_posture == OPEN each such Claim starts ACTIVE with lock_reason=PENDING_RETRO"
          - "hop 3: each ACTIVE Claim from hop 2 fires the claim-revenue-lock cascade (PATCH /content-items/{id}/revenue-lock): the item's RevenueRouting rows with status PAID_CREATOR -> RETROACTIVE_OWED, creator_share_cents -> 0 and partner_share_cents -> gross_revenue_cents, item.routed_revenue_cents recomputed to 0"
          - "hop 4: the same PATCH recomputes ContentItem.holds_revenue to TRUE, which is the state the review response reports"

      - from: MONETIZATION_PENDING
        to: MONETIZATION_REJECTED
        trigger: "POST /channels/{channelId}/monetization-review"
        actor: MonetizationReviewer
        preconditions:
          - "channel.monetization_status == MONETIZATION_PENDING"
          - "decision payload == REJECT"
        side_effects:
          - "Channel.monetization_status -> MONETIZATION_REJECTED"
          - "Channel.monetization_posture recomputed"
        note: "A rejection does not settle any ContentItem — the settlement cascade belongs to the APPROVE branch only."

      - from: MONETIZATION_REJECTED
        to: MONETIZATION_PENDING
        trigger: "POST /channels/{channelId}/monetization-applications"
        actor: Creator
        preconditions:
          - "channel.lifetime_watch_hours >= 4000"
          - "channel.subscriber_count >= 1000"
          - "channel.policy_strike_count == 0"
        side_effects:
          - "Channel.monetization_status -> MONETIZATION_PENDING"
        note: "Re-application loop: the eligibility thresholds are re-checked against the channel's current counters."

      - from: MONETIZATION_APPROVED
        to: MONETIZATION_REVOKED
        trigger: "system: the third ACTIVE ChannelStrike of kind COMMUNITY is created on this channel"
        actor: system
        preconditions: []
        side_effects:
          - "Channel.monetization_status -> MONETIZATION_REVOKED"
          - "Channel.monetization_posture recomputed -> FROZEN"
          - "every PayoutBatch of this channel with status LOCKED -> FAILED"

      - from: MONETIZATION_REVOKED
        to: MONETIZATION_PENDING
        trigger: "system: the sweeper expires strikes and every ChannelStrike and CopyrightStrike of this channel is EXPIRED"
        actor: system
        preconditions:
          - "channel.policy_strike_count == 0"
          - "channel.copyright_strike_count == 0"
        side_effects:
          - "Channel.monetization_status -> MONETIZATION_PENDING"
          - "Channel.monetization_posture recomputed -> OPEN"

  - entity: ContentItem
    initial_state: UPLOADED
    terminal_states: []
    transitions:
      - from: UPLOADED
        to: CLASSIFYING
        trigger: "POST /channels/{channelId}/content-items/{itemId}/requests-review"
        actor: Creator
        preconditions:
          - "channel.monetization_posture != FROZEN"
        side_effects:
          - "ContentItem.upload_status -> CLASSIFYING"
          - "no AdReview row yet; ad_suitability remains null"

      - from: CLASSIFYING
        to: CLASSIFIED
        trigger: "system: rights scan completed with zero reference matches at or above 0.500"
        actor: system
        preconditions: []
        side_effects:
          - "AdReview row created carrying the classification output of service_ad_review_decision"
          - "ContentItem.ad_suitability and ContentItem.limited_ads_reasons set from the AdReview row"
          - "ContentItem.upload_status -> CLASSIFIED"

      - from: CLASSIFYING
        to: CLAIM_SCAN_COMPLETE
        trigger: "system: rights scan completed with at least one reference match at or above 0.500"
        actor: system
        preconditions: []
        side_effects:
          - "AdReview row created carrying the classification output of service_ad_review_decision"
          - "ContentItem.ad_suitability and ContentItem.limited_ads_reasons set from the AdReview row"
          - "one Claim per matching ReferenceFile created with source=REFERENCE_AUTO and match_confidence = the scan score"
          - "if Channel.monetization_posture == OPEN, each created Claim is ACTIVE with lock_reason=PENDING_RETRO"
          - "ContentItem.upload_status -> CLAIM_SCAN_COMPLETE"

      - from: CLASSIFIED
        to: CLAIM_SCAN_COMPLETE
        trigger: "system: a newly registered ReferenceFile fingerprint matches this item at or above 0.500"
        actor: system
        preconditions: []
        side_effects:
          - "Claim created with source=REFERENCE_AUTO"
          - "if Channel.monetization_posture == OPEN: Claim ACTIVE with lock_reason=PENDING_RETRO, then the claim-revenue-lock cascade runs against the item"
          - "ContentItem.upload_status -> CLAIM_SCAN_COMPLETE"

      - from: CLAIM_SCAN_COMPLETE
        to: CLASSIFIED
        trigger: "system: every Claim on this item reaches RELEASED, REINSTATED or TAKEN_DOWN and no ReferenceFile fingerprint remains matched"
        actor: system
        preconditions: []
        side_effects:
          - "ContentItem.holds_revenue recomputed FALSE"

      - from: CLASSIFIED
        to: CLASSIFIED
        trigger: "POST /channels/{channelId}/content-items/{itemId}/classification-appeals"
        actor: MonetizationReviewer
        preconditions:
          - "ContentItem.upload_status == CLASSIFIED"
          - "ContentItem.ad_suitability IN {LIMITED_ADS, NO_ADS}"
        side_effects:
          - "AdReview.appeal_outcome -> UPHELD"
          - "ContentItem.ad_suitability, limited_ads_reasons unchanged"

      - from: CLASSIFIED
        to: CLASSIFIED
        trigger: "system: re-classification resolves to NO_ADS"
        actor: system
        preconditions: []
        side_effects:
          - "ContentItem.ad_suitability -> NO_ADS"
          - "hop 1: every Claim on this item -> TAKEN_DOWN"
          - "hop 2: one CopyrightStrike per claim created ACTIVE with expires_at = created_at + 90 days"
          - "hop 3: if this is the channel's third ACTIVE CopyrightStrike then Channel.monetization_status -> MONETIZATION_REVOKED, else if it is the second then Channel.monetization_posture -> RESTRICTED"
          - "ContentItem.takedown_flag -> TRUE; AdReview.is_visible -> FALSE"

      - from: CLAIM_SCAN_COMPLETE
        to: CLAIM_SCAN_COMPLETE
        trigger: "system: re-classification resolves to NO_ADS"
        actor: system
        preconditions: []
        side_effects:
          - "ContentItem.ad_suitability -> NO_ADS"
          - "hop 1: every Claim on this item -> TAKEN_DOWN"
          - "hop 2: one CopyrightStrike per claim created ACTIVE with expires_at = created_at + 90 days"
          - "hop 3: if this is the channel's third ACTIVE CopyrightStrike then Channel.monetization_status -> MONETIZATION_REVOKED, else if it is the second then Channel.monetization_posture -> RESTRICTED"
          - "ContentItem.takedown_flag -> TRUE; AdReview.is_visible -> FALSE"

  - entity: Claim
    initial_state: ACTIVE
    terminal_states: [RELEASED, TAKEN_DOWN]
    transitions:
      - from: ACTIVE
        to: DISPUTED
        trigger: "POST /claims/{claimId}/dispute"
        actor: Creator
        preconditions:
          - "Claim.status == ACTIVE"
          - "Claim.created_at >= clock - 30 days"
          - "Channel.monetization_posture != FROZEN"
        side_effects:
          - "ClaimDispute row created with status FILED"
          - "Claim.dispute_deadline_at = Claim.created_at + 30 days"
          - "Claim.status -> DISPUTED"
          - "hop 1: every RevenueRouting row of the claimed ContentItem with status PAID_CREATOR -> RETROACTIVE_OWED, creator_share_cents -> 0 and partner_share_cents -> gross_revenue_cents"
          - "hop 2: ContentItem.routed_revenue_cents recomputed to 0"
          - "hop 3: ContentItem.holds_revenue recomputed TRUE"

      - from: ACTIVE
        to: RELEASED
        trigger: "system: dispute window lapsed with no dispute filed"
        actor: system
        preconditions:
          - "clock >= Claim.created_at + 30 days"
        side_effects:
          - "Claim.status -> RELEASED"
          - "Claim.lock_reason -> NONE"
          - "ContentItem.holds_revenue recomputed"

      - from: DISPUTED
        to: APPEALED
        trigger: "POST /claims/{claimId}/appeals"
        actor: RightsHolder
        preconditions:
          - "Claim.status == DISPUTED"
          - "Claim.appeal_count == 0"
          - "the referenced ContentItem is not taken down"
        side_effects:
          - "ClaimAppeal row created with appeal_level=FIRST and status=PENDING"
          - "Claim.lock_reason -> RETROACTIVE_OWED"
          - "Claim.appeal_attempts recomputed"

      - from: DISPUTED
        to: RELEASED
        trigger: "POST /claims/{claimId}/dispute/resolve"
        actor: RightsHolder
        preconditions:
          - "Claim.status == DISPUTED"
          - "resolution payload == RELEASE"
        side_effects:
          - "the open ClaimDispute row -> RELEASED"
          - "Claim.status -> RELEASED"
          - "Claim.lock_reason -> NONE"
          - "ContentItem.holds_revenue recomputed FALSE; ContentItem.routed_revenue_cents recomputed"

      - from: APPEALED
        to: REINSTATED
        trigger: "POST /claims/{claimId}/appeals/{appealId}/decide"
        actor: RightsHolder
        preconditions:
          - "Claim.status == APPEALED"
          - "the decided ClaimAppeal.appeal_level == FIRST"
          - "Claim.appeal_attempts < 2"
        side_effects:
          - "ClaimAppeal.status -> UPHELD"
          - "Claim.status -> REINSTATED"
          - "Claim.lock_reason -> NONE"
          - "hop 1: every RevenueRouting row of the claimed ContentItem with status RETROACTIVE_OWED -> RELEASED_TO_CREATOR, restoring creator_share_cents and partner_share_cents to the royalty_share_split values for the recorded gross_revenue_cents"
          - "hop 2: ContentItem.routed_revenue_cents recomputed, ContentItem.holds_revenue recomputed FALSE"

      - from: APPEALED
        to: DISPUTED
        trigger: "POST /claims/{claimId}/appeals/{appealId}/decide"
        actor: RightsHolder
        preconditions:
          - "Claim.status == APPEALED"
          - "the decided ClaimAppeal.appeal_level == FIRST"
          - "decision payload == DENY"
        side_effects:
          - "ClaimAppeal.status -> DENIED"
          - "Claim.status -> DISPUTED"
          - "Claim.lock_reason -> RETROACTIVE_OWED"
        note: "Denial returns the claim to DISPUTED so a SECOND-level appeal becomes available."

      - from: DISPUTED
        to: APPEALED
        trigger: "POST /claims/{claimId}/appeals"
        actor: RightsHolder
        preconditions:
          - "Claim.status == DISPUTED"
          - "Claim.appeal_attempts == 1"
          - "the most recent ClaimAppeal has status DENIED or UPHELD and appeal_level == FIRST"
        side_effects:
          - "ClaimAppeal row created with appeal_level=SECOND and status=PENDING"
          - "Claim.lock_reason -> RETROACTIVE_OWED"
          - "Claim.appeal_attempts recomputed"

      - from: APPEALED
        to: TAKEN_DOWN
        trigger: "POST /claims/{claimId}/takedown"
        actor: RightsHolder
        preconditions:
          - "Claim.status == APPEALED"
          - "the pending ClaimAppeal.appeal_level == SECOND"
          - "Channel.monetization_posture != FROZEN"
        side_effects:
          - "hop 1: Claim.status -> TAKEN_DOWN; taken_down_at = logical clock; CopyrightStrike created ACTIVE with expires_at = created_at + 90 days"
          - "hop 2: Channel.copyright_strike_count recomputed; Channel.last_copyright_strike_activated_at recomputed"
          - "hop 3: if Channel.copyright_strike_count >= 3 then Channel.monetization_status -> MONETIZATION_REVOKED and Channel.monetization_posture -> FROZEN and every PayoutBatch of the channel with status LOCKED -> FAILED; else if Channel.copyright_strike_count == 2 then Channel.monetization_posture -> RESTRICTED"
          - "hop 4: ContentItem.ad_suitability -> NO_ADS; ContentItem.takedown_flag -> TRUE; AdReview.is_visible -> FALSE"

      - from: REINSTATED
        to: APPEALED
        trigger: "POST /claims/{claimId}/appeals"
        actor: RightsHolder
        preconditions:
          - "Claim.status == REINSTATED"
          - "clock >= the REINSTATED ClaimAppeal.created_at + 14 days"
        side_effects:
          - "ClaimAppeal row created with appeal_level=FIRST and status=PENDING"
          - "Claim.status -> APPEALED"
          - "Claim.lock_reason -> RETROACTIVE_OWED"
        note: "Cycle: a reinstated claim may be appealed again once the 14-day lockout lapses."

      - from: TAKEN_DOWN
        to: RELEASED
        trigger: "POST /claims/{claimId}/dispute/resolve"
        actor: RightsHolder
        preconditions:
          - "Claim.status == TAKEN_DOWN"
          - "the creator has filed a counter-notification (copyright_counter_notified == true)"
          - "resolution payload == RELEASE"
        side_effects:
          - "Claim.status -> RELEASED"
          - "Claim.lock_reason -> NONE"
          - "ContentItem.takedown_flag recomputed FALSE"
          - "Claim is never returned to ACTIVE; no further takedown may be issued for this claim"

  - entity: CopyrightStrike
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: strike sweeper runs when the logical clock reaches expires_at"
        actor: system
        preconditions:
          - "clock >= CopyrightStrike.expires_at"
        side_effects:
          - "CopyrightStrike.status -> EXPIRED"
          - "Channel.copyright_strike_count recomputed (count of ACTIVE CopyrightStrikes)"
          - "Channel.monetization_posture recomputed"
          - "if the branch Channel row is MONETIZATION_REVOKED and Channel.copyright_strike_count == 0, Channel.monetization_status -> MONETIZATION_PENDING"

  - entity: ChannelStrike
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: strike sweeper runs when the logical clock reaches expires_at"
        actor: system
        preconditions:
          - "clock >= ChannelStrike.expires_at"
        side_effects:
          - "ChannelStrike.status -> EXPIRED"
          - "Channel.policy_strike_count recomputed (count of ACTIVE ChannelStrikes of kind COMMUNITY)"
          - "Channel.monetization_posture recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only — OCC on the parent's version)
# =============================================================================
concurrency_rules:

  - rule_id: route-create-stale-item
    parent_entity: ContentItem
    write_endpoint: "POST /revenue-routings"
    occ_field: "expected_content_item_version"
    description: |
      Creating a RevenueRouting for a ContentItem whose version has advanced
      since the client last observed it is rejected. This captures the case
      where a claim has just locked the item's revenue (advancing the item's
      version) and the current writer's view of the item is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: release-batch-stale-batch
    parent_entity: PayoutBatch
    write_endpoint: "POST /channels/{channelId}/payouts/{batchId}/release"
    occ_field: "expected_payout_batch_version"
    description: |
      Releasing a PayoutBatch whose version has advanced since the client last
      observed it is rejected. A lock-stage assembly or a tax-status change
      legitimately advances the batch version between the client's read and
      this release call.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: dispute-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /claims/{claimId}/dispute"
    occ_field: "expected_claim_version"
    description: |
      Filing a dispute against a Claim whose version has advanced since the
      client last observed it is rejected. A concurrent appeal decision or an
      automatic release advances the claim version before this call lands.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: royalty_share_split
    trigger: "creating a RevenueRouting row"
    algorithm: tiered_pricing
    formula: |
      rate = {"AD": 0.55, "MEMBERSHIP": 0.70, "SUPER_CHAT": 0.70, "SHOPPING": 0.60}[RevenueRouting.stream_type]
      creator_share_cents = floor_half_up(gross_revenue_cents * rate)      # per-record rounding, pinned
      partner_share_cents = gross_revenue_cents - creator_share_cents
      assert creator_share_cents + partner_share_cents == gross_revenue_cents   # exact conservation, zero drift
    input_set: "one RevenueRouting row; no state filtering"
    constants:
      AD_CREATOR_RATE: 0.55
      MEMBERSHIP_CREATOR_RATE: 0.70
      SUPER_CHAT_CREATOR_RATE: 0.70
      SHOPPING_CREATOR_RATE: 0.60
    precision: "integer cents; round_half_up applied per RevenueRouting row, never to a batch total"
    variants:
      - name: per_record_rounding
        when: "always — rounding happens once per RevenueRouting row"
        difference: "This is the only sanctioned order. Summing first and rounding the batch total produces different cents: three AD routings of 1001 gross each yield creator shares 551 + 551 + 551 = 1653, whereas rounding the 3003 sum yields 1652."

  - name: tax_withholding_by_country
    trigger: "PayoutBatch release (POST /channels/{channelId}/payouts/{batchId}/release)"
    algorithm: threshold
    formula: |
      rate = 0.30 if Channel.tax_tin_status == TIN_MISSING else withholding_rate_for(Channel.country_code, Channel.tax_treaty)
      withholding_rate_for(country_code, tax_treaty):
        if country_code == "US": return 0.00
        if tax_treaty:           return 0.15
        return {"GB": 0.20, "DE": 0.26, "IN": 0.24, "BR": 0.24}.get(country_code, 0.24)
    input_set: "the payable set of a PayoutBatch = its RevenueRouting rows with status RELEASED_TO_CREATOR or PAID_CREATOR"
    constants:
      US_RATE: 0.00
      TREATY_RATE: 0.15
      GB_RATE: 0.20
      DE_RATE: 0.26
      IN_RATE: 0.24
      BR_RATE: 0.24
      DEFAULT_NON_TREATY_RATE: 0.24
      TIN_MISSING_PENALTY_RATE: 0.30
    precision: "rate is a 3-decimal fraction; withholding is integer cents via floor_half_up on the batch creator total"
    variants:
      - name: tin_missing_overrides_everything
        when: "Channel.tax_tin_status == TIN_MISSING"
        difference: "Every country code yields 0.30 regardless of treaty flag or country table. For IN the delta against the documented regime is 0.30 - 0.24 = 0.06."
      - name: treaty_reduces_non_us
        when: "Channel.tax_tin_status == TIN_PROVIDED and Channel.tax_treaty == true and country_code != US"
        difference: "Rate collapses to 0.15 for every non-US country with a treaty, overriding the country table (DE drops 0.26 -> 0.15)."

  - name: membership_schedule
    trigger: "POST /channels/{channelId}/membership-schedules"
    algorithm: weighted_scoring
    formula: |
      monthly_creator_share_cents = floor_half_up(monthly_fee_cents * MEMBERSHIP_CREATOR_RATE)
      platform_share_cents        = floor_half_up(monthly_fee_cents * (1 - MEMBERSHIP_CREATOR_RATE))
      network_fee_cents           = floor_half_up(monthly_fee_cents * NETWORK_FEE_RATE)   # added on top, paid by the member
      member_charge_cents         = monthly_fee_cents + network_fee_cents
    input_set: "one MembershipSchedule"
    constants:
      NETWORK_FEE_RATE: 0.03
    precision: "integer cents; round_half_up per component"
    variants:
      - name: components_rounded_independently
        when: "always"
        difference: "The two shares plus the network fee are each rounded separately; the platform share is never derived by subtracting the creator share from a rounded member charge."

  - name: adjusted_net_balance
    trigger: "PayoutBatch release (POST /channels/{channelId}/payouts/{batchId}/release)"
    algorithm: waterfall_allocation
    formula: |
      gross_cents        = sum(r.gross_revenue_cents for r in routed_set)
      creator_share_cents= sum(r.creator_share_cents  for r in routed_set)
      held_cents         = sum(r.creator_share_cents  for r in routed_set if r.status == ESCROW)
      payer_base_cents   = creator_share_cents - held_cents
      tax_withheld_cents = floor_half_up(payer_base_cents * withholding_rate)
      raw_net_cents      = payer_base_cents - tax_withheld_cents
      adjusted_net_cents = 0 if raw_net_cents < 0 else raw_net_cents
      routed_set         = { r : r.content_item_id belongs to Channel, r.status IN {RELEASED_TO_CREATOR, PAID_CREATOR, ESCROW},
                             r.created_at >= period_start_at, r.created_at < period_end_at }
      status = LOCKED   # the payment threshold is enforced at release, never at lock
    input_set: "routed_set pinned to three statuses and a half-open created_at window [period_start_at, period_end_at)"
    constants:
      PAYMENT_THRESHOLD_DEFAULT_CENTS: 10000
    precision: "integer cents; round_half_up at the tax step; floor at 0 after subtraction"
    variants:
      - name: provisional_estimate_at_lock
        when: "POST /channels/{channelId}/payouts/lock"
        difference: "Against the same routed_set this variant reports gross_cents - held_cents - tax_withheld_cents and omits the residual rounding adjustment; it may differ from the adjusted_net_cents that the release variant commits."
      - name: post_resolution_ledger
        when: "POST /channels/{channelId}/payouts/{batchId}/release"
        difference: "Commits adjusted_net_cents as computed above and is the amount actually paid; the two variants disagree whenever the routed_set gains any row minted after the lock (a PAID_CREATOR routing, or a RELEASED_TO_CREATOR row minted by a claim release)."

  - name: member_payout_ranking
    trigger: "POST /channels/{channelId}/member-payout-runs"
    algorithm: waterfall_allocation
    formula: |
      eligible = { m : m.channel_id == Channel.id, m.status == ACTIVE }
      if eligible is empty: reject with ERR_NO_ELIGIBLE_MEMBERS
      for m in sorted(eligible, key=lambda m: (-m.paid_member_months, m.joined_at, m.created_at)):
        grant = floor_half_up(m.paid_member_months * MEMBER_REVENUE_UNIT_CENTS)
        if remaining_cents < grant: grant = remaining_cents            # clamp to what is left
        m.payout_cents = grant
        remaining_cents -= grant
    input_set: "ChannelMembership rows whose status == ACTIVE for the target channel, ranked deterministically"
    constants:
      MEMBER_REVENUE_UNIT_CENTS: 25
      SELECTOR_VERSION: 1
    precision: "integer cents; round_half_up per member"
    variants:
      - name: paid_month_descending
        when: "always"
        difference: "Ranking key is paid_member_months DESC, then joined_at ASC, then created_at ASC — never id. Ties on paid_member_months resolve on the earlier joined_at."

  - name: settlement_waterfall_for_item
    trigger: "POST /content-items/{itemId}/settle"
    algorithm: waterfall_allocation
    formula: |
      buckets = [Claim rows of the ContentItem ordered by match_confidence DESC, then created_at ASC,
                 then the null-claim bucket, then the channel bucket]
      remaining = ContentItem.gross_revenue_cents
      for bucket in buckets[0 : len(buckets) - 1]:
        holder_amount = remaining - floor_half_up(remaining * SPLITTER_SHARE_RATE)   # holder keeps 45%
        bucket.amount = holder_amount
        remaining -= holder_amount
      buckets[-1].amount = remaining                                               # final bucket absorbs the remainder
      assert sum(bucket.amount for bucket in buckets) == ContentItem.gross_revenue_cents
    input_set: "ordered bucket list as pinned above; ties on match_confidence break on created_at ASC"
    constants:
      HOLDER_KEEP_RATE: 0.45
      SPLITTER_SHARE_RATE: 0.55
    precision: "integer cents; round_half_up per bucket; the final bucket absorbs the rounding remainder"
    variants:
      - name: highest_confidence_first
        when: "always"
        difference: "Buckets are consumed highest-confidence-first; reordering to lowest-first changes every bucket subtotal while leaving the total conserved."

  - name: ad_review_decision
    trigger: "POST /channels/{channelId}/content-items/{itemId}/requests-review"
    algorithm: threshold
    formula: |
      LIMITED_ELIGIBLE = {"GAMBLING", "ALCOHOL", "POLITICS", "NEWS", "TRAGEDY", "MILDLANGUAGE"}
      submitted = the category set supplied to this classification pass (the item's category_code on upload, the category_codes list on re-classification)
      matched = sorted(c for c in submitted if c in LIMITED_ELIGIBLE)
      like_comments = AdReview.like_count + AdReview.comment_count
      if "MILDLANGUAGE" in matched and like_comments >= 1000:
        matched.remove("MILDLANGUAGE")
      if len(matched) == 0:
        outcome = AD_FRIENDLY
      elif len(matched) == 1:
        outcome = LIMITED_ADS
      else:
        outcome = NO_ADS
      reason_codes = matched (empty when AD_FRIENDLY)
    input_set: "the item's category_code plus the reviewer-supplied like_count and comment_count"
    constants:
      MILDLANGUAGE_SUPPRESSION_ENGAGEMENT_THRESHOLD: 1000
    precision: "integer counts; boundary is inclusive (>= 1000 suppresses, 999 does not)"
    variants:
      - name: single_match_limited_versus_multi_match_no_ads
        when: "len(matched) == 1 vs len(matched) >= 2"
        difference: "One matched limited-eligible category yields LIMITED_ADS; two matched categories on an identical revenue profile yield NO_ADS, which is the outcome difference the boundary sits on."

  - name: strike_escalation_thresholds
    trigger: "CopyrightStrike or ChannelStrike creation and the strike sweeper"
    algorithm: threshold
    formula: |
      strikes = Channel.copyright_strike_count          # count of ACTIVE CopyrightStrike rows
      if strike.kind == COMMUNITY and Channel.policy_strike_count >= 3:
        Channel.monetization_status = MONETIZATION_REVOKED
      if strikes >= 3:
        Channel.monetization_status = MONETIZATION_REVOKED
        Channel.monetization_posture = FROZEN
      elif strikes == 2:
        Channel.monetization_posture = RESTRICTED
    input_set: "ACTIVE strikes only; EXPIRED strikes are excluded from both counters"
    constants:
      COPYRIGHT_TERMINATION_THRESHOLD: 3
      COPYRIGHT_RESTRICTION_THRESHOLD: 2
      POLICY_TERMINATION_THRESHOLD: 3
      STRIKE_LIFETIME_DAYS: 90
    precision: "exact integer comparison; boundaries are inclusive (>= 3 terminates, == 2 restricts)"

  - name: monetization_posture
    trigger: "any change to Channel.monetization_status, policy_strike_count or copyright_strike_count"
    algorithm: constraint_propagation
    formula: |
      if Channel.monetization_status == MONETIZATION_REVOKED: posture = FROZEN
      elif Channel.policy_strike_count > 0:                   posture = RESTRICTED
      elif Channel.copyright_strike_count >= 2:               posture = RESTRICTED
      else:                                                   posture = OPEN
    input_set: "the parent Channel row only"
    precision: "exact enum selection; evaluation order is top-to-bottom and the first matching branch wins"

  - name: strike_expiry_sweep
    trigger: "POST /_clock/set_current_utc"
    algorithm: projection
    formula: |
      for each ChannelStrike or CopyrightStrike with status == ACTIVE:
        if clock >= strike.expires_at: strike.status = EXPIRED
      then recompute Channel.policy_strike_count, Channel.copyright_strike_count,
      Channel.monetization_posture, and (when the branch is MONETIZATION_REVOKED with
      both counters at 0) Channel.monetization_status -> MONETIZATION_PENDING
    input_set: "every ACTIVE strike whose expires_at <= clock; already-EXPIRED strikes are never revisited"
    constants:
      STRIKE_LIFETIME_DAYS: 90
    precision: "datetime comparison at second resolution; boundary is inclusive (clock == expires_at expires the strike)"

  - name: channel_health_ranking
    trigger: "GET /review-queue"
    algorithm: weighted_scoring
    formula: |
      eligible = { c : c.monetization_status == MONETIZATION_PENDING }
      if eligible is empty: return an empty array (no error)
      score(c) = (c.lifetime_watch_hours / 1000) + (c.subscriber_count / 500) - (10 * c.copyright_strike_count)
      ranked = sorted(eligible, key=lambda c: (-score(c), c.created_at))   # created_at ASC, never id
    input_set: "channels in MONETIZATION_PENDING, ranked by the pinned score expression"
    constants:
      WATCH_HOURS_DIVISOR: 1000
      SUBSCRIBER_DIVISOR: 500
      STRIKE_PENALTY: 10
    precision: "score computed as a float; ties on the rounded-to-6-decimals score break on created_at ASC"
    variants:
      - name: pending_only
        when: "always"
        difference: "Channels in MONETIZATION_APPROVED, REJECTED, REVOKED or NOT_APPLIED are excluded from the candidate set regardless of score."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role header present and is a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the caller's role is permitted for the operation; entity-backed roles may act only on their own channel, claim or content item"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "path and body resources exist, validated left-to-right along the path"
    error_id: ERR_CHANNEL_NOT_FOUND / ERR_CONTENT_ITEM_NOT_FOUND / ERR_CLAIM_NOT_FOUND / ERR_REFERENCE_FILE_NOT_FOUND / ERR_PAYOUT_BATCH_NOT_FOUND / ERR_APPEAL_NOT_FOUND / ERR_MEMBERSHIP_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "the target resource is in a state that admits the requested operation; publishing a membership schedule additionally requires the owning channel to be in MONETIZATION_APPROVED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints and PATCH /content-items/{itemId}/revenue-lock"

  - priority: 5
    category: business_safety
    check: "channel posture gates: FROZEN rejects every revenue-generating or monetization write; RESTRICTED rejects new monetization applications and dispute filings"
    error_id: ERR_POSTURE_FROZEN / ERR_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "revenue-routings, payout lock, payout release, monetization-applications, dispute, takedown, classification-appeals"

  - priority: 6
    category: business_temporal
    check: "the 30-day dispute window: a claim may be disputed only while Claim.created_at >= clock - 30 days"
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /claims/{claimId}/dispute"

  - priority: 7
    category: business_safety
    check: "appeal ladder: at most 2 appeals per claim, the SECOND appeal only after a DENIED FIRST appeal, and no third appeal"
    error_id: ERR_APPEAL_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /claims/{claimId}/appeals"

  - priority: 8
    category: business_temporal
    check: "a REINSTATED claim may be re-appealed only after the 14-day appeal lockout"
    error_id: ERR_APPEAL_LOCKOUT
    http_status: 409
    applies_to: "POST /claims/{claimId}/appeals"

  - priority: 9
    category: business_referential
    check: "at most one PENDING ClaimAppeal per claim; a claim already in TAKEN_DOWN can never be appealed again"
    error_id: ERR_APPEAL_ALREADY_PENDING / ERR_CLAIM_TERMINAL
    http_status: 409
    applies_to: "POST /claims/{claimId}/appeals"

  - priority: 10
    category: business_constraint
    check: "ReferenceFile.reference_fingerprint is globally unique; registration with a duplicate fingerprint is rejected"
    error_id: ERR_DUPLICATE_REFERENCE_FINGERPRINT
    http_status: 409
    applies_to: "POST /reference-files"

  - priority: 11
    category: business_fiscal
    check: "the payout adjusted-net balance must reach the channel payment threshold before a payout batch may be released"
    error_id: ERR_BELOW_PAYMENT_THRESHOLD
    http_status: 409
    applies_to: "POST /channels/{channelId}/payouts/{batchId}/release"

  - priority: 12
    category: business_fiscal
    check: "a member payout run needs at least one ACTIVE ChannelMembership; an empty candidate set is rejected rather than silently paying nothing"
    error_id: ERR_NO_ELIGIBLE_MEMBERS
    http_status: 409
    applies_to: "POST /channels/{channelId}/member-payout-runs"

  - priority: 13
    category: business_constraint
    check: "claim match_confidence supplied on a manual claim must lie in [0.500, 1.000]; 0.499 is rejected, 0.500 is accepted"
    error_id: ERR_INVALID_MATCH_CONFIDENCE
    http_status: 400
    applies_to: "POST /claims, POST /content-items/{itemId}/classifications"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Clock (test-driving) -------------------------------------------------
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Advance the logical clock. The server's startup default clock time is fixed at 2026-09-01T00:00:00Z and MUST NOT fall back to real wall-clock time before this endpoint is ever called. Setting the clock runs the strike expiry sweep."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["every ACTIVE ChannelStrike and CopyrightStrike with expires_at <= to_iso8601 -> EXPIRED", "Channel.policy_strike_count, copyright_strike_count and monetization_posture recomputed", "a MONETIZATION_REVOKED channel whose both strike counters reach 0 -> MONETIZATION_PENDING"]

  # --- Channel --------------------------------------------------------------
  - method: POST
    path: "/api/channels"
    description: "Create a channel"
    roles: [Anonymous, PlatformAdmin]
    code: 201
    input: [channel_name, country_code, lifetime_watch_hours, subscriber_count, "membership_offered?", "tax_tin_status?", "tax_treaty?", "payment_threshold_cents?", "policy_strike_count?"]
    output: Channel
    side_effects: ["monetization_status=MONETIZATION_NOT_APPLIED", "monetization_posture=OPEN", "copyright_strike_count=0", "last_copyright_strike_activated_at=null"]

  - method: GET
    path: "/api/channels"
    description: "List channels"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: Channel[]
    side_effects: []

  - method: GET
    path: "/api/channels/{id}"
    description: "Get one channel"
    roles: [Any]
    code: 200
    input: []
    output: Channel
    side_effects: []

  - method: PATCH
    path: "/api/channels/{id}"
    description: "Update mutable channel configuration (name, country, tax flags, payment threshold, policy strike count)"
    roles: [Creator, PlatformAdmin]
    code: 200
    input: ["channel_name?", "country_code?", "tax_tin_status?", "tax_treaty?", "payment_threshold_cents?", "policy_strike_count?"]
    output: Channel
    side_effects: ["Channel.version increments by 1", "Channel.monetization_posture recomputed"]

  # --- Monetization application & review -----------------------------------
  - method: POST
    path: "/api/channels/{id}/monetization-applications"
    description: "Apply for monetization (also used to re-apply after a rejection)"
    roles: [Creator]
    code: 200
    input: []
    output: Channel
    side_effects: ["Channel.monetization_status -> MONETIZATION_PENDING", "Channel.version increments by 1", "Channel.monetization_posture recomputed"]

  - method: POST
    path: "/api/channels/{id}/monetization-review"
    description: "Reviewer decision on a pending monetization application"
    roles: [MonetizationReviewer]
    code: 200
    input: [decision, "note?"]
    output: Channel
    side_effects: ["decision=APPROVE: status -> MONETIZATION_APPROVED, then settle every CLASSIFIED item -> CLAIM_SCAN_COMPLETE, materialize claims at match_confidence >= 0.500, and run the claim-revenue-lock cascade", "decision=REJECT: status -> MONETIZATION_REJECTED with no item settlement", "Channel.version increments by 1"]

  - method: GET
    path: "/api/review-queue"
    description: "Reviewer queue: channels in MONETIZATION_PENDING ranked by the channel_health_ranking score expression"
    roles: [MonetizationReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: Channel[]
    side_effects: []

  # --- Content item ---------------------------------------------------------
  - method: POST
    path: "/api/channels/{id}/content-items"
    description: "Upload a content item"
    roles: [Creator, PlatformAdmin]
    code: 201
    input: [title, duration_seconds, category_code, "self_declared_mature?"]
    output: ContentItem
    side_effects: ["upload_status=UPLOADED", "ad_suitability=null", "gross_revenue_cents=0", "routed_revenue_cents=0", "holds_revenue=false", "takedown_flag=false"]

  - method: GET
    path: "/api/channels/{id}/content-items"
    description: "List content items of a channel"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: ContentItem[]
    side_effects: []

  - method: GET
    path: "/api/content-items"
    description: "List content items across channels"
    roles: [Any]
    code: 200
    input: ["channel_id?", "limit?", "offset?"]
    output: ContentItem[]
    side_effects: []

  - method: GET
    path: "/api/content-items/{id}"
    description: "Get one content item"
    roles: [Any]
    code: 200
    input: []
    output: ContentItem
    side_effects: []

  - method: POST
    path: "/api/channels/{id}/content-items/{id}/requests-review"
    description: "Drive item UPLOADED -> CLASSIFYING; the rights scan then resolves the item to CLASSIFIED or CLAIM_SCAN_COMPLETE"
    roles: [Creator]
    code: 200
    input: []
    output: ContentItem
    side_effects: ["upload_status -> CLASSIFYING then to CLASSIFIED or CLAIM_SCAN_COMPLETE", "AdReview created from ad_review_decision", "one Claim per matching ReferenceFile at match_confidence >= 0.500", "ContentItem.version increments by 1"]

  - method: POST
    path: "/api/channels/{id}/content-items/{id}/classification-appeals"
    description: "Creator appeal against a LIMITED_ADS or NO_ADS classification"
    roles: [MonetizationReviewer]
    code: 200
    input: [grounds_code]
    output: ContentItem
    side_effects: ["AdReview.appeal_outcome -> UPHELD", "ContentItem.version increments by 1"]

  - method: POST
    path: "/api/content-items/{id}/classifications"
    description: "Re-classify an item; a NO_ADS resolution drives the takedown cascade"
    roles: [Reviewer, MonetizationReviewer]
    code: 200
    input: [category_codes, like_count, comment_count]
    output: ContentItem
    side_effects: ["ContentItem.ad_suitability, limited_ads_reasons recomputed from the supplied category set", "on NO_ADS: every Claim of the item -> TAKEN_DOWN, one CopyrightStrike created ACTIVE per claim, Channel strike counters and posture recomputed, ContentItem.takedown_flag -> TRUE", "ContentItem.version increments by 1"]

  - method: POST
    path: "/api/content-items/{id}/settle"
    description: "Run the settlement waterfall over the item's claims and channel"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ContentItem
    side_effects: ["settlement_waterfall_for_item buckets updated", "ContentItem.version increments by 1"]

  - method: PATCH
    path: "/api/content-items/{id}/revenue-lock"
    description: "System cascade endpoint: lock or unlock the item's routed revenue as claims are created and resolved"
    roles: [PlatformAdmin]
    code: 200
    input: [locked, reason_code]
    output: ContentItem
    side_effects: ["locked=true: RevenueRouting rows of the item with status PAID_CREATOR -> RETROACTIVE_OWED, creator_share_cents -> 0 and partner_share_cents -> gross_revenue_cents", "routed_revenue_cents recomputed", "holds_revenue recomputed", "ContentItem.version increments by 1"]

  # --- Reference file -------------------------------------------------------
  - method: POST
    path: "/api/reference-files"
    description: "Register a rights-holder reference file; its fingerprint is matched against existing CLASSIFIED items"
    roles: [RightsHolder, PlatformAdmin]
    code: 201
    input: [rights_holder_name, asset_kind, reference_fingerprint, policy_mode, claimed_segment_seconds, "is_active?"]
    output: ReferenceFile
    side_effects: ["CLASSIFIED items matching the fingerprint at >= 0.500 -> CLAIM_SCAN_COMPLETE with a new ACTIVE Claim", "ReferenceFile.version increments by 1"]

  - method: GET
    path: "/api/reference-files"
    description: "List reference files"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: ReferenceFile[]
    side_effects: []

  - method: GET
    path: "/api/reference-files/{id}"
    description: "Get one reference file"
    roles: [Any]
    code: 200
    input: []
    output: ReferenceFile
    side_effects: []

  - method: GET
    path: "/api/content-items/{id}/ad-reviews"
    description: "List the classification reviews of an item (reverse reachability for AdReview.content_item_id)"
    roles: [Any]
    code: 200
    input: []
    output: AdReview[]
    side_effects: []

  - method: GET
    path: "/api/payouts/{id}/route-batch"
    description: "Get the ROUTE-stage batch linked from a PAYOUT-stage batch (reverse reachability for PayoutBatch.route_batch_id)"
    roles: [Any]
    code: 200
    input: []
    output: "PayoutBatch[]"
    side_effects: []

  - method: GET
    path: "/api/channels/{id}"
    description: "Get one channel (collection-segment anchor for /api/channels)"
    roles: [Any]
    code: 200
    input: []
    output: Channel
    side_effects: []

  - method: GET
    path: "/api/content-items/{id}/revenue-events"
    description: "List revenue events attributed to an item (reverse reachability for RevenueEvent.content_item_id)"
    roles: [Any]
    code: 200
    input: []
    output: RevenueEvent[]
    side_effects: []

  # --- Claim ----------------------------------------------------------------
  - method: POST
    path: "/api/claims"
    description: "File a manual claim against a content item"
    roles: [RightsHolder, PlatformAdmin]
    code: 201
    input: [content_item_id, reference_file_id, match_confidence, "claim_level?"]
    output: Claim
    side_effects: ["source=MANUAL", "status=ACTIVE when Channel.monetization_posture==OPEN", "lock_reason=PENDING_RETRO", "claim-revenue-lock cascade on the item"]

  - method: GET
    path: "/api/claims"
    description: "List claims filtered by content item, reference file or status"
    roles: [Any]
    code: 200
    input: ["content_item_id?", "reference_file_id?", "status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: GET
    path: "/api/claims/{id}"
    description: "Get one claim"
    roles: [Any]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/api/claims/{id}/dispute"
    description: "Creator files a dispute inside the 30-day window (OCC-guarded)"
    roles: [Creator]
    code: 200
    input: [expected_claim_version, reason_code, "narrative?"]
    output: Claim
    side_effects: ["ClaimDispute created FILED", "dispute_deadline_at = Claim.created_at + 30 days", "Claim.status -> DISPUTED", "RevenueRouting rows of the item with status PAID_CREATOR -> RETROACTIVE_OWED and creator_share_cents -> 0", "ContentItem.routed_revenue_cents recomputed", "ContentItem.holds_revenue -> TRUE", "Claim.version increments by 1", "ContentItem.version increments by 1"]

  - method: GET
    path: "/api/claims/{id}/disputes"
    description: "List the disputes filed against a claim (reverse reachability for ClaimDispute.claim_id)"
    roles: [Any]
    code: 200
    input: []
    output: ClaimDispute[]
    side_effects: []

  - method: POST
    path: "/api/claims/{id}/dispute/resolve"
    description: "Rights holder releases or upholds a disputed or taken-down claim"
    roles: [RightsHolder]
    code: 200
    input: [resolution]
    output: Claim
    side_effects: ["RELEASE: open ClaimDispute -> RELEASED, Claim.status -> RELEASED, lock_reason -> NONE", "on a TAKEN_DOWN claim: ContentItem.takedown_flag recomputed FALSE", "Claim.version increments by 1"]

  - method: POST
    path: "/api/claims/{id}/appeals"
    description: "File a claim appeal (FIRST, SECOND, or the post-reinstatement re-appeal); returns the created ClaimAppeal"
    roles: [RightsHolder]
    code: 200
    input: [grounds_code]
    output: ClaimAppeal
    side_effects: ["ClaimAppeal created PENDING", "Claim.status -> APPEALED", "lock_reason -> RETROACTIVE_OWED", "appeal_attempts and appeal_count recomputed", "Claim.version increments by 1"]

  - method: GET
    path: "/api/claims/{id}/appeals"
    description: "List the appeals filed against a claim (reverse reachability for ClaimAppeal.claim_id)"
    roles: [Any]
    code: 200
    input: []
    output: ClaimAppeal[]
    side_effects: []

  - method: POST
    path: "/api/claims/{id}/appeals/{id}/decide"
    description: "Decide a pending claim appeal; returns the decided ClaimAppeal"
    roles: [RightsHolder]
    code: 200
    input: [decision]
    output: ClaimAppeal
    side_effects: ["UPHOLD on a FIRST appeal: ClaimAppeal -> UPHELD, Claim.status -> REINSTATED, lock_reason -> NONE, RETROACTIVE_OWED routings -> RELEASED_TO_CREATOR, ContentItem.routed_revenue_cents recomputed", "DENY on a FIRST appeal: ClaimAppeal -> DENIED, Claim.status -> DISPUTED, lock_reason stays RETROACTIVE_OWED", "Claim.version increments by 1", "ContentItem.version increments by 1"]

  - method: POST
    path: "/api/claims/{id}/counter-notifications"
    description: "Creator files a counter-notification against a taken-down claim"
    roles: [Creator]
    code: 200
    input: [statement]
    output: Claim
    side_effects: ["Claim.copyright_counter_notified -> TRUE", "Claim.version increments by 1"]

  - method: POST
    path: "/api/claims/{id}/takedown"
    description: "Escalate an appealed claim to takedown; issues a copyright strike on the owning channel"
    roles: [RightsHolder]
    code: 200
    input: []
    output: Claim
    side_effects: ["hop 1: Claim.status -> TAKEN_DOWN, CopyrightStrike created ACTIVE with expires_at = created_at + 90 days", "hop 2: Channel.copyright_strike_count remeasured", "hop 3: 3rd strike -> MONETIZATION_REVOKED + FROZEN, 2nd strike -> RESTRICTED", "hop 4: ContentItem.ad_suitability -> NO_ADS, takedown_flag -> TRUE", "Claim.version increments by 1", "ContentItem.version increments by 1", "Channel.version increments by 1"]

  # --- Copyright strike -----------------------------------------------------
  - method: GET
    path: "/api/channels/{id}/copyright-strikes"
    description: "List copyright strikes of a channel (reverse reachability for CopyrightStrike.channel_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: CopyrightStrike[]
    side_effects: []

  - method: GET
    path: "/api/content-items/{id}/copyright-strikes"
    description: "List copyright strikes raised on a content item (reverse reachability for CopyrightStrike.content_item_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: CopyrightStrike[]
    side_effects: []

  - method: GET
    path: "/api/claims/{id}/copyright-strikes"
    description: "List copyright strikes caused by a claim (reverse reachability for CopyrightStrike.claim_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: CopyrightStrike[]
    side_effects: []

  # --- Channel strike -------------------------------------------------------
  - method: POST
    path: "/api/channels/{id}/strikes"
    description: "Issue a community policy strike on a channel"
    roles: [Moderator, PlatformAdmin]
    code: 201
    input: [kind, reason_code]
    output: ChannelStrike
    side_effects: ["ChannelStrike ACTIVE with expires_at = issued_at + 90 days", "Channel.policy_strike_count recomputed", "Channel.monetization_posture recomputed", "on the 3rd ACTIVE COMMUNITY strike, Channel.monetization_status -> MONETIZATION_REVOKED and every LOCKED PayoutBatch -> FAILED"]

  - method: GET
    path: "/api/channels/{id}/strikes"
    description: "List strikes of a channel (reverse reachability for ChannelStrike.channel_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: ChannelStrike[]
    side_effects: []

  # --- Revenue --------------------------------------------------------------
  - method: POST
    path: "/api/channels/{id}/revenue-events"
    description: "Record a gross revenue event on a stream"
    roles: [PlatformAdmin]
    code: 201
    input: [stream_type, amount_cents, "content_item_id?"]
    output: RevenueEvent
    side_effects: ["RevenueEvent created with routed=false and occurred_at = logical clock"]

  - method: GET
    path: "/api/channels/{id}/revenue-events"
    description: "List revenue events of a channel (reverse reachability for RevenueEvent.channel_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: RevenueEvent[]
    side_effects: []

  - method: POST
    path: "/api/revenue-routings"
    description: "Route an item's gross revenue into a RevenueRouting row (OCC-guarded on the content item)"
    roles: [PlatformAdmin]
    code: 201
    input: [content_item_id, "claim_id?", stream_type, gross_revenue_cents, expected_content_item_version]
    output: RevenueRouting
    side_effects: ["creator_share_cents and partner_share_cents split by royalty_share_split", "status=ESCROW when the item holds revenue, else PAID_CREATOR; creator_share_cents + partner_share_cents always equals gross_revenue_cents", "ContentItem.routed_revenue_cents recomputed", "ContentItem.version increments by 1"]

  - method: GET
    path: "/api/content-items/{id}/revenue-routings"
    description: "List routing records of an item (reverse reachability for RevenueRouting.content_item_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: RevenueRouting[]
    side_effects: []

  - method: GET
    path: "/api/claims/{id}/revenue-routings"
    description: "List routing records attributable to a claim (reverse reachability for RevenueRouting.claim_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: RevenueRouting[]
    side_effects: []

  - method: GET
    path: "/api/channels/{id}/revenue-routings"
    description: "List every routing record of a channel"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: RevenueRouting[]
    side_effects: []

  # --- Membership & payout --------------------------------------------------
  - method: POST
    path: "/api/channels/{id}/membership-schedules"
    description: "Publish a membership pricing schedule"
    roles: [Creator]
    code: 201
    input: [tier_name, monthly_fee_cents, "perks?"]
    output: MembershipSchedule
    side_effects: ["creator_share_cents, platform_share_cents, network_fee_cents and member_charge_cents computed by membership_schedule", "Channel.membership_offered -> TRUE"]

  - method: GET
    path: "/api/channels/{id}/membership-schedules"
    description: "List membership schedules of a channel (reverse reachability for MembershipSchedule.channel_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: MembershipSchedule[]
    side_effects: []

  - method: POST
    path: "/api/channels/{id}/memberships"
    description: "Enroll a member on the channel"
    roles: [Creator, PlatformAdmin]
    code: 201
    input: [member_name, monthly_fee_cents, "joined_at?"]
    output: ChannelMembership
    side_effects: ["status=ACTIVE", "paid_member_months=0", "payout_cents=0"]

  - method: GET
    path: "/api/channels/{id}/memberships"
    description: "List members of a channel (reverse reachability for ChannelMembership.channel_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: ChannelMembership[]
    side_effects: []

  - method: POST
    path: "/api/channels/{id}/member-payout-runs"
    description: "Run the member payout waterfall over the channel's ACTIVE members"
    roles: [PlatformAdmin]
    code: 200
    input: [total_payout_cents, expected_channel_version]
    output: null
    side_effects: ["each ACTIVE member's payout_cents set by member_payout_ranking", "Channel.version increments by 1"]

  - method: POST
    path: "/api/channels/{id}/payouts/lock"
    description: "Assemble and lock a payout batch for a period using the provisional estimate"
    roles: [PlatformAdmin]
    code: 200
    input: [period_start_at, period_end_at, expected_channel_version]
    output: PayoutBatch
    side_effects: ["stage=ROUTE", "gross_cents, creator_share_cents, partner_share_cents and held_cents summed over the routed set", "status=LOCKED", "Channel.version increments by 1"]

  - method: POST
    path: "/api/channels/{id}/payouts/{id}/release"
    description: "Release a locked payout batch, applying withholding (OCC-guarded on the batch)"
    roles: [PlatformAdmin]
    code: 200
    input: [expected_payout_batch_version]
    output: PayoutBatch
    side_effects: ["tax_withheld_cents and withholding_rate_pct applied by tax_withholding_by_country", "adjusted_net_cents = creator_share_cents - held_cents - tax_withheld_cents floored at 0", "a PAYOUT-stage PayoutBatch row created with stage=PAYOUT, route_batch_id linking this ROUTE row, status RELEASED and paid_at = logical clock", "this ROUTE row -> status RELEASED and paid_at = logical clock", "PayoutBatch.version increments by 1"]

  - method: GET
    path: "/api/payouts/{id}"
    description: "Get one payout batch by its own id (collection-segment anchor for /api/payouts)"
    roles: [Any]
    code: 200
    input: []
    output: PayoutBatch
    side_effects: []

  - method: GET
    path: "/api/channels/{id}/payouts"
    description: "List payout batches of a channel (reverse reachability for PayoutBatch.channel_id)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: PayoutBatch[]
    side_effects: []

  - method: GET
    path: "/api/channels/{id}/payouts/{id}"
    description: "Get one payout batch"
    roles: [Any]
    code: 200
    input: []
    output: PayoutBatch
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "the caller's role is not permitted for this operation, or an entity-backed caller is acting on a resource it does not own" }

  - { id: ERR_CHANNEL_NOT_FOUND, http: 404, condition: "no Channel with the supplied channelId in the path" }
  - { id: ERR_CONTENT_ITEM_NOT_FOUND, http: 404, condition: "no ContentItem with the supplied itemId, or it does not belong to the path's channel" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "no Claim with the supplied claimId" }
  - { id: ERR_REFERENCE_FILE_NOT_FOUND, http: 404, condition: "no ReferenceFile with the supplied reference_file_id" }
  - { id: ERR_PAYOUT_BATCH_NOT_FOUND, http: 404, condition: "no PayoutBatch with the supplied batchId for the channel" }
  - { id: ERR_APPEAL_NOT_FOUND, http: 404, condition: "no ClaimAppeal with the supplied appealId for the claim" }
  - { id: ERR_MEMBERSHIP_NOT_FOUND, http: 404, condition: "no ChannelMembership with the supplied membership id for the channel" }

  - { id: ERR_INVALID_STATE, http: 409, condition: "the target resource is not in a state that admits the requested operation (e.g. a monetization review on a channel that is not MONETIZATION_PENDING, a review request on an item that is not UPLOADED)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "the expected_*_version supplied on an OCC-guarded write is not the parent's current version" }
  - { id: ERR_CLAIM_ALREADY_DISPUTED, http: 409, condition: "a Claim already in DISPUTED receives a second dispute filing" }
  - { id: ERR_CLAIM_TERMINAL, http: 409, condition: "a Claim in TAKEN_DOWN receives a dispute, appeal or second takedown" }
  - { id: ERR_DISPUTE_WINDOW_CLOSED, http: 409, condition: "the claim's 30-day dispute window has lapsed (clock >= Claim.created_at + 30 days)" }
  - { id: ERR_APPEAL_LIMIT_REACHED, http: 409, condition: "a third appeal is filed against a claim, or a SECOND-level appeal is filed without a decided FIRST appeal" }
  - { id: ERR_APPEAL_ALREADY_PENDING, http: 409, condition: "the claim already has a ClaimAppeal in status PENDING" }
  - { id: ERR_APPEAL_LOCKOUT, http: 409, condition: "a REINSTATED claim is re-appealed before the 14-day appeal lockout lapses" }
  - { id: ERR_CONTENT_ITEM_NOT_TAKEN_DOWN, http: 409, condition: "a counter-notification or a takedown-scoped resolution targets a claim that is not in TAKEN_DOWN" }

  - { id: ERR_POSTURE_FROZEN, http: 409, condition: "the channel's monetization_posture is FROZEN and the operation generates or routes revenue" }
  - { id: ERR_POSTURE_RESTRICTED, http: 409, condition: "the channel's monetization_posture is RESTRICTED and the operation is a monetization application, dispute filing, takedown or classification appeal" }

  - { id: ERR_MONETIZATION_INELIGIBLE, http: 409, condition: "a monetization application or re-application is filed below 4000 lifetime watch hours or below 1000 subscribers" }
  - { id: ERR_MONETIZATION_BLOCKED_BY_STRIKE, http: 409, condition: "a monetization application is filed while Channel.policy_strike_count > 0" }
  - { id: ERR_CLASSIFICATION_BLOCKS_MONETIZATION, http: 409, condition: "a monetization review payload is APPROVE while a reviewed item carries ad_suitability == NO_ADS" }
  - { id: ERR_INVALID_CATEGORY_CODE, http: 400, condition: "a classification pass supplies a category_codes value outside the recognised category vocabulary" }

  - { id: ERR_DUPLICATE_REFERENCE_FINGERPRINT, http: 409, condition: "a ReferenceFile registration reuses an existing reference_fingerprint" }
  - { id: ERR_INVALID_MATCH_CONFIDENCE, http: 400, condition: "a manual claim supplies match_confidence outside [0.000, 1.000]" }

  - { id: ERR_BELOW_PAYMENT_THRESHOLD, http: 409, condition: "a payout batch release is attempted while adjusted_net_cents < payment_threshold_cents" }
  - { id: ERR_NO_ELIGIBLE_MEMBERS, http: 409, condition: "a member payout run finds zero ChannelMembership rows with status ACTIVE for the channel" }

  - { id: ERR_UNSUPPORTED_STREAM_TYPE, http: 400, condition: "a RevenueRouting or RevenueEvent uses a stream_type outside AD | MEMBERSHIP | SUPER_CHAT | SHOPPING" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: Anonymous
    description: "Unauthenticated caller; may only create a channel and read public listings"
    identity: opaque
    exclusive_operations:
      - "POST /channels"
    shared_operations:
      - "GET /channels, GET /channels/{channelId}"

  - name: Creator
    description: "The channel owner; acts as itself and may only touch its own channel, items and claims"
    identity: entity_backed:Channel
    exclusive_operations:
      - "POST /channels/{channelId}/monetization-applications"
      - "POST /channels/{channelId}/content-items"
      - "POST /channels/{channelId}/content-items/{itemId}/requests-review"
      - "POST /claims/{claimId}/dispute"
      - "POST /claims/{claimId}/counter-notifications"
      - "POST /channels/{channelId}/membership-schedules"
    shared_operations:
      - "PATCH /channels/{channelId}"
      - "GET /channels/{channelId}, GET /content-items/{itemId}, GET /claims/{claimId}"

  - name: MonetizationReviewer
    description: "Platform reviewer who decides monetization applications and hears classification appeals"
    identity: opaque
    exclusive_operations:
      - "POST /channels/{channelId}/monetization-review"
      - "GET /review-queue"
      - "POST /channels/{channelId}/content-items/{itemId}/classification-appeals"
    shared_operations:
      - "POST /content-items/{itemId}/classifications"

  - name: Reviewer
    description: "Advertiser-friendly classification operator"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /content-items/{itemId}/classifications"

  - name: RightsHolder
    description: "Owner of a ReferenceFile; registers references, appeals claims and escalates to takedown"
    identity: entity_backed:ReferenceFile
    exclusive_operations:
      - "POST /reference-files"
      - "POST /claims"
      - "POST /claims/{claimId}/appeals"
      - "POST /claims/{claimId}/appeals/{appealId}/decide"
      - "POST /claims/{claimId}/takedown"
      - "POST /claims/{claimId}/dispute/resolve"
    shared_operations:
      - "GET /claims, GET /claims/{claimId}, GET /reference-files"

  - name: Moderator
    description: "Community-guideline moderator; issues strikes and records policy actions"
    identity: opaque
    exclusive_operations:
      - "POST /channels/{channelId}/strikes"
    shared_operations:
      - "GET /channels/{channelId}/strikes"

  - name: PlatformAdmin
    description: "Operator; owns clock control, revenue recording, routing, settlement and payouts"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /channels/{channelId}/revenue-events"
      - "POST /revenue-routings"
      - "POST /content-items/{itemId}/settle"
      - "PATCH /content-items/{itemId}/revenue-lock"
      - "POST /channels/{channelId}/member-payout-runs"
      - "POST /channels/{channelId}/payouts/lock"
      - "POST /channels/{channelId}/payouts/{batchId}/release"
    shared_operations:
      - "PATCH /channels/{channelId}"
      - "POST /channels/{channelId}/strikes"
      - "POST /channels/{channelId}/memberships"
      - "POST /claims"
      - "POST /reference-files"
      - "POST /channels"
      - "POST /channels/{channelId}/content-items"

  - name: Any
    description: "Convenience umbrella used by the read-only surface; every authenticated role may read listings"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET listings and single-resource reads across §1.5"
