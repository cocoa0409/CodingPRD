          setup: ["Case MAPPING with a DRAFT document"]
          setup_api_calls:
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-V03", utility_district: "D1", county: "King", parcel_id: "P-V03", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 100 }
