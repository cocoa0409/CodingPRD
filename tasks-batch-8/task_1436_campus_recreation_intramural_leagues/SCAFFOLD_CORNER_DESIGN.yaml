            - "partial payment 100 -> fines 200 -> still blocked (ERR_OUTSTANDING_FINES)"
            - "paying the remaining 200 -> checkout succeeds (OUT); gate is exactly outstanding_fines_cents == 0"
      - name: error_class_already_registered_and_time_conflict
        claim_type: violation_to_error
        grounds: ["errors[ERR_CLASS_ALREADY_REGISTERED]", "errors[ERR_CLASS_TIME_CONFLICT]", "validations[priority=9]"]
        distinguishing_aspect: "Two distinct member-scoped gates: re-registering the SAME class is ERR_CLASS_ALREADY_REGISTERED (constraint); a different class overlapping in time is ERR_CLASS_TIME_CONFLICT (temporal) — facilities differ so only the member clock collides."
        test_recipe:
          setup: ["classes C1 (Studio1 Tue 18:00-19:00) and C2 (Studio2 Tue 18:30-19:15); member M REGISTERED in C1"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T00:00:00Z" }, as: RecAdmin }
            - { call: "POST /v1/facilities", payload: { name: "Studio 1", kind: "ROOM", operating_windows: [ { day_of_week: 1, open_minute: 1020, close_minute: 1320 } ] }, as: RecAdmin, captures: { f1_id: "$.data.id" } }
            - { call: "POST /v1/facilities", payload: { name: "Studio 2", kind: "ROOM", operating_windows: [ { day_of_week: 1, open_minute: 1020, close_minute: 1320 } ] }, as: RecAdmin, captures: { f2_id: "$.data.id" } }
            - { call: "POST /v1/staff", payload: { full_name: "Instr I", staff_role: "INSTRUCTOR", base_hourly_rate_cents: 3000, certified_class_types: ["YOGA", "PILATES"] }, as: RecAdmin, captures: { i_id: "$.data.id" } }
            - { call: "POST /v1/fitness-classes", payload: { title: "Yoga C1", class_type: "YOGA", instructor_staff_id: "${i_id}", facility_id: "${f1_id}", start_at: "2026-09-08T18:00:00Z", end_at: "2026-09-08T19:00:00Z", capacity: 6 }, as: RecAdmin, captures: { c1_id: "$.data.id" } }
            - { call: "POST /v1/fitness-classes", payload: { title: "Pilates C2", class_type: "PILATES", instructor_staff_id: "${i_id}", facility_id: "${f2_id}", start_at: "2026-09-08T18:30:00Z", end_at: "2026-09-08T19:15:00Z", capacity: 6 }, as: RecAdmin, captures: { c2_id: "$.data.id" } }
            - { call: "POST /v1/members", payload: { email: "mm@x.edu", full_name: "Mem M", affiliation: "STUDENT" }, as: RecAdmin, captures: { mM_id: "$.data.id", mM_v: "$.data.version" } }
            - { call: "POST /v1/members/${mM_id}/waiver-sign", as: Member, as_user_id: "${mM_id}", captures: { mM_v2: "$.data.version" } }
            - { call: "POST /v1/members/${mM_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${mM_v2}" }, as: Member, as_user_id: "${mM_id}" }
            - { call: "POST /v1/fitness-classes/${c1_id}/registrations", payload: { member_id: "${mM_id}" }, as: Member, as_user_id: "${mM_id}" }
          trigger:
            - { call: "POST /v1/fitness-classes/${c1_id}/registrations", payload: { member_id: "${mM_id}" }, as: Member, as_user_id: "${mM_id}", captures: { err1: "$.data.error_id" } }
            - { call: "POST /v1/fitness-classes/${c2_id}/registrations", payload: { member_id: "${mM_id}" }, as: Member, as_user_id: "${mM_id}", captures: { err2: "$.data.error_id" } }
          assert:
            - "same class again: error_id == ERR_CLASS_ALREADY_REGISTERED (409)"
            - "overlapping other class: error_id == ERR_CLASS_TIME_CONFLICT (409) — 18:30 < 19:00"
      - name: error_injury_game_mismatch
        claim_type: violation_to_error
        grounds: ["errors[ERR_INJURY_GAME_MISMATCH]", entities.InjuryReport.fields.game_id]
        distinguishing_aspect: "Cross-aggregate reference validation: a game-linked injury report requires the member to hold an ACTIVE RosterEntry on one of the game's teams; an outsider member is rejected."
        test_recipe:
          setup: ["2-team league IN_SEASON; game g Alpha-Beta; member MX on neither team"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T00:00:00Z" }, as: RecAdmin }
            - { call: "POST /v1/facilities", payload: { name: "Court 1", kind: "COURT", operating_windows: [ { day_of_week: 1, open_minute: 1020, close_minute: 1320 } ] }, as: RecAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /v1/leagues", payload: { name: "Hoops", sport: "BASKETBALL", divisions: [ { name: "A", capacity: 4, skill_min: 1, skill_max: 10 } ], registration_open_at: "2026-08-20T00:00:00Z", registration_close_at: "2026-09-05T00:00:00Z", season_start_at: "2026-09-07T00:00:00Z", season_end_at: "2026-12-04T00:00:00Z", team_capacity: 4, min_teams: 2, roster_min: 1, roster_max: 3 }, as: RecAdmin, captures: { lg_id: "$.data.id" } }
            - { call: "POST /v1/leagues/${lg_id}/open-registration", as: LeagueCoordinator }
            - { call: "POST /v1/members", payload: { email: "ca@x.edu", full_name: "Cap A", affiliation: "STUDENT" }, as: RecAdmin, captures: { ca_id: "$.data.id", ca_v: "$.data.version" } }
            - { call: "POST /v1/members/${ca_id}/waiver-sign", as: Member, as_user_id: "${ca_id}", captures: { ca_v2: "$.data.version" } }
            - { call: "POST /v1/members/${ca_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${ca_v2}" }, as: Member, as_user_id: "${ca_id}" }
            - { call: "POST /v1/members", payload: { email: "cb@x.edu", full_name: "Cap B", affiliation: "STUDENT" }, as: RecAdmin, captures: { cb_id: "$.data.id", cb_v: "$.data.version" } }
            - { call: "POST /v1/members/${cb_id}/waiver-sign", as: Member, as_user_id: "${cb_id}", captures: { cb_v2: "$.data.version" } }
            - { call: "POST /v1/members/${cb_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${cb_v2}" }, as: Member, as_user_id: "${cb_id}" }
            - { call: "POST /v1/teams", payload: { league_id: "${lg_id}", name: "Alpha", captain_member_id: "${ca_id}", skill_rating: 5 }, as: LeagueCoordinator, captures: { ta_id: "$.data.id" } }
            - { call: "POST /v1/teams/${ta_id}/roster-entries", payload: { member_id: "${ca_id}" }, as: Member, as_user_id: "${ca_id}" }
            - { call: "POST /v1/teams", payload: { league_id: "${lg_id}", name: "Beta", captain_member_id: "${cb_id}", skill_rating: 5 }, as: LeagueCoordinator, captures: { tb_id: "$.data.id" } }
            - { call: "POST /v1/teams/${tb_id}/roster-entries", payload: { member_id: "${cb_id}" }, as: Member, as_user_id: "${cb_id}" }
            - { call: "POST /v1/leagues/${lg_id}/close-registration", as: LeagueCoordinator }
            - { call: "POST /v1/teams/${ta_id}/place-division", payload: { division_name: "A" }, as: LeagueCoordinator }
            - { call: "POST /v1/teams/${tb_id}/place-division", payload: { division_name: "A" }, as: LeagueCoordinator }
            - { call: "POST /v1/leagues/${lg_id}/start-season", as: LeagueCoordinator }
            - { call: "GET /v1/leagues/${lg_id}", as: LeagueCoordinator, captures: { lg_v: "$.data.version" } }
            - { call: "POST /v1/leagues/${lg_id}/games", payload: { home_team_id: "${ta_id}", away_team_id: "${tb_id}", facility_id: "${f_id}", start_at: "2026-09-08T18:00:00Z", end_at: "2026-09-08T19:30:00Z", expected_league_version: "${lg_v}" }, as: LeagueCoordinator, captures: { g_id: "$.data.id" } }
            - { call: "POST /v1/members", payload: { email: "mx@x.edu", full_name: "Mem X", affiliation: "STUDENT" }, as: RecAdmin, captures: { mx_id: "$.data.id" } }
          trigger:
            - { call: "POST /v1/injury-reports", payload: { member_id: "${mx_id}", severity: "MINOR", description: "spectator trip", game_id: "${g_id}" }, as: FacilityManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INJURY_GAME_MISMATCH (422): MX has no ACTIVE roster entry on Alpha or Beta"
  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: staff_role_cannot_settle_assignment
        claim_type: role_denial
        grounds: [roles.LeagueCoordinator, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Authorization (priority 2) precedes existence (priority 3): a Staff caller hitting settle on even a nonexistent assignment id gets ERR_FORBIDDEN, never 404."
        test_recipe:
          setup: ["a Staff identity exists (its id is irrelevant to the denial path)"]
          setup_api_calls:
            - { call: "POST /v1/staff", payload: { full_name: "Ref O", staff_role: "OFFICIAL", base_hourly_rate_cents: 2000, certification_level: 1 }, as: RecAdmin, captures: { o_id: "$.data.id" } }
          trigger:
            - { call: "POST /v1/officiating-assignments/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/settle", as: Staff, as_user_id: "${o_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_FORBIDDEN (403) — role check beats the 404"
      - name: facility_manager_cannot_clear_injury
        claim_type: role_denial
        grounds: [roles.RecAdmin, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Segregation of duties: the role that REPORTS injuries (FacilityManager) cannot CLEAR them (RecAdmin-only medical clearance)."
        test_recipe:
          setup: ["member M with a MINOR report filed by FacilityManager"]
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "mm@x.edu", full_name: "Mem M", affiliation: "STUDENT" }, as: RecAdmin, captures: { mM_id: "$.data.id" } }
            - { call: "POST /v1/injury-reports", payload: { member_id: "${mM_id}", severity: "MINOR", description: "bruise" }, as: FacilityManager, captures: { ir_id: "$.data.id" } }
          trigger:
            - { call: "POST /v1/injury-reports/${ir_id}/clear", payload: { clearance_note: "self-clear attempt" }, as: FacilityManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_FORBIDDEN (403); report stays REPORTED"
      - name: non_instructor_staff_cannot_complete_class
        claim_type: ownership_denial
        grounds: [state_machines.FitnessClass.SCHEDULED_to_COMPLETED, roles.Staff]
        distinguishing_aspect: "Staff ownership on the instructor rail: a different INSTRUCTOR (right role, wrong identity) cannot complete the class."
        test_recipe:
          setup: ["class taught by I1 ended (clock past end); I2 is another INSTRUCTOR"]
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T00:00:00Z" }, as: RecAdmin }
            - { call: "POST /v1/facilities", payload: { name: "Studio", kind: "ROOM", operating_windows: [ { day_of_week: 1, open_minute: 1020, close_minute: 1320 } ] }, as: RecAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /v1/staff", payload: { full_name: "Instr One", staff_role: "INSTRUCTOR", base_hourly_rate_cents: 3000, certified_class_types: ["YOGA"] }, as: RecAdmin, captures: { i1_id: "$.data.id" } }
            - { call: "POST /v1/staff", payload: { full_name: "Instr Two", staff_role: "INSTRUCTOR", base_hourly_rate_cents: 3000, certified_class_types: ["YOGA"] }, as: RecAdmin, captures: { i2_id: "$.data.id" } }
            - { call: "POST /v1/fitness-classes", payload: { title: "Yoga PM", class_type: "YOGA", instructor_staff_id: "${i1_id}", facility_id: "${f_id}", start_at: "2026-09-08T18:00:00Z", end_at: "2026-09-08T19:00:00Z", capacity: 5 }, as: RecAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-08T19:01:00Z" }, as: RecAdmin }
          trigger:
            - { call: "POST /v1/fitness-classes/${c_id}/complete", payload: { no_show_registration_ids: [] }, as: Staff, as_user_id: "${i2_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_FORBIDDEN (I2 is not the class instructor); class stays SCHEDULED"
      - name: member_cannot_access_admin_reads_denied_none
        claim_type: role_allowance
        grounds: [roles.Member]
        distinguishing_aspect: "Positive RBAC coverage: all five roles may read any GET endpoint — a Member can read a league and a Staff can read a locker without denial."
        test_recipe:
          setup: ["one league and one locker exist"]
          setup_api_calls:
            - { call: "POST /v1/leagues", payload: { name: "Hoops", sport: "BASKETBALL", divisions: [ { name: "A", capacity: 4, skill_min: 1, skill_max: 10 } ], registration_open_at: "2026-08-20T00:00:00Z", registration_close_at: "2026-09-05T00:00:00Z", season_start_at: "2026-09-07T00:00:00Z", season_end_at: "2026-12-04T00:00:00Z", team_capacity: 4, min_teams: 2, roster_min: 1, roster_max: 3 }, as: RecAdmin, captures: { lg_id: "$.data.id" } }
            - { call: "POST /v1/lockers", payload: { locker_number: 101, size: "M" }, as: RecAdmin, captures: { l_id: "$.data.id" } }
            - { call: "POST /v1/members", payload: { email: "mm@x.edu", full_name: "Mem M", affiliation: "STUDENT" }, as: RecAdmin, captures: { mM_id: "$.data.id" } }
            - { call: "POST /v1/staff", payload: { full_name: "Ref O", staff_role: "OFFICIAL", base_hourly_rate_cents: 2000, certification_level: 1 }, as: RecAdmin, captures: { o_id: "$.data.id" } }
          trigger:
            - { call: "GET /v1/leagues/${lg_id}", as: Member, as_user_id: "${mM_id}", captures: { lg_name: "$.data.name" } }
            - { call: "GET /v1/lockers/${l_id}", as: Staff, as_user_id: "${o_id}", captures: { l_st: "$.data.status" } }
          assert:
            - "Member GET league: 200 with name == Hoops"
            - "Staff GET locker: 200 with status == AVAILABLE"
