            - "TestRun.${eval_id}.run_state == EVALUATED and TestRun.${cert_id}.run_state == CERTIFIED"
            - "the second release returns 200, PumpPackage.${pkg_ok_id}.status == RELEASED and PumpPackage.${pkg_ok_id}.guarantee_basis == CERTIFIED_CURVE"
            - "BuildOrder.${b1_id}.status == TESTED"

  # =====================================================================
  # Rule 8 - resource_temporal_overlap
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: pattern_pour_windows_conflict_on_touching_endpoints_under_closed_interval_semantics
        grounds:
          - validations[priority=67]
          - entities.CastingLot.fields.pour_window_end
          - endpoints["POST /casting-lots"]
        distinguishing_aspect: |
          The pattern resource uses CLOSED-interval semantics, so a window that merely TOUCHES an
          existing one conflicts: with H-9001 holding 2026-08-05 to 2026-08-10, a new lot starting
          exactly on 2026-08-10 must be rejected, while starting one day later succeeds. This is
          the opposite convention from the foundry-capacity instance below, so a single shared
          overlap helper cannot satisfy both.
        test_recipe:
          setup:
            - "Foundry FDY-NORTH ACTIVE with concurrent_pour_capacity 2 and PumpModel HSC-14 ORDERABLE."
            - "PatternAsset PAT-HSC14-A QUALIFIED with wear_threshold 20."
            - "CastingLot H-9001 poured from PAT-HSC14-A occupying 2026-08-05T00:00:00Z to 2026-08-10T00:00:00Z, status POURED."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /pump-models"
              payload: { model_code: "HSC-14", generation: 2, interchange_group: "IG-HSC-14", max_impeller_diameter_mm: 355.0, min_impeller_diameter_mm: 300.0, shutoff_head_m: 92.0, bep_flow_m3h: 300.0, bep_head_m: 72.0, bep_efficiency_pct: 82.0, npshr_at_bep_m: 4.20, rated_speed_rpm: 2950, max_flow_m3h: 380.0, rotor_mass_kg: 68.0, balance_grade: "G6_3" }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /pattern-assets"
              payload: { pump_model_id: "${m1_id}", foundry_id: "${f1_id}", pattern_code: "PAT-HSC14-A", wear_threshold: 20 }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /casting-lots"
              payload: { pattern_asset_id: "${p1_id}", foundry_id: "${f1_id}", heat_number: "H-9001", alloy_code: "CI_GG25", qty_poured: 4, pour_window_start: "2026-08-05T00:00:00Z", pour_window_end: "2026-08-10T00:00:00Z" }
              as: FoundryPartner
              as_user_id: "${f1_id}"
              captures: { l1_id: $.data.id }
          trigger:
            - call: "POST /casting-lots"
              payload: { pattern_asset_id: "${p1_id}", foundry_id: "${f1_id}", heat_number: "H-9002", alloy_code: "CI_GG25", qty_poured: 4, pour_window_start: "2026-08-10T00:00:00Z", pour_window_end: "2026-08-14T00:00:00Z" }
              as: FoundryPartner
              as_user_id: "${f1_id}"
            - call: "POST /casting-lots"
              payload: { pattern_asset_id: "${p1_id}", foundry_id: "${f1_id}", heat_number: "H-9003", alloy_code: "CI_GG25", qty_poured: 4, pour_window_start: "2026-08-11T00:00:00Z", pour_window_end: "2026-08-14T00:00:00Z" }
              as: FoundryPartner
              as_user_id: "${f1_id}"
              captures: { l3_id: $.data.id }
          assert:
            - "the first call returns 409 with error_id ERR_PATTERN_WINDOW_CONFLICT"
            - "the second call returns 201 and CastingLot.${l3_id}.status == POURED"
            - "count(CastingLot WHERE pattern_asset_id == ${p1_id}) == 2"
            - "PatternAsset.${p1_id}.pours_since_refurb == 2 and PatternAsset.${p1_id}.wear_index == 2 and PatternAsset.${p1_id}.status == QUALIFIED"
            - "CastingLot.${l1_id}.pour_window_end == \"2026-08-10T00:00:00Z\" and CastingLot.${l3_id}.pour_window_start == \"2026-08-11T00:00:00Z\""

      - name: foundry_concurrent_pour_capacity_counts_half_open_overlaps_only
        grounds:
          - validations[priority=68]
          - entities.Foundry.fields.concurrent_pour_capacity
          - endpoints["POST /casting-lots"]
        distinguishing_aspect: |
          An AGGREGATE capacity limit under HALF-OPEN semantics, on a different resource from
          instance 1: two live windows already overlap at FDY-NORTH, so a third overlapping window
          exceeds capacity 2, yet a fourth window starting exactly when the first one ends is
          accepted because touching windows do not count. The rejected and the accepted request
          use the SAME pattern, so only the interval convention and the aggregate count can explain
          the difference.
        test_recipe:
          setup:
            - "Foundry FDY-NORTH ACTIVE with concurrent_pour_capacity 2 and PumpModel HSC-14 with three distinct QUALIFIED patterns PAT-A, PAT-B and PAT-C (wear_threshold 20 each) so pattern-level conflicts cannot interfere."
            - "CastingLot H-9001 on PAT-A occupies 2026-08-05 to 2026-08-10; CastingLot H-9002 on PAT-B occupies 2026-08-07 to 2026-08-12. These two overlap, so the foundry is at capacity for any window touching 2026-08-07 to 2026-08-10."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /pump-models"
              payload: { model_code: "HSC-14", generation: 2, interchange_group: "IG-HSC-14", max_impeller_diameter_mm: 355.0, min_impeller_diameter_mm: 300.0, shutoff_head_m: 92.0, bep_flow_m3h: 300.0, bep_head_m: 72.0, bep_efficiency_pct: 82.0, npshr_at_bep_m: 4.20, rated_speed_rpm: 2950, max_flow_m3h: 380.0, rotor_mass_kg: 68.0, balance_grade: "G6_3" }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /pattern-assets"
              payload: { pump_model_id: "${m1_id}", foundry_id: "${f1_id}", pattern_code: "PAT-A", wear_threshold: 20 }
              as: PlatformAdmin
              captures: { pa_id: $.data.id }
            - call: "POST /pattern-assets"
              payload: { pump_model_id: "${m1_id}", foundry_id: "${f1_id}", pattern_code: "PAT-B", wear_threshold: 20 }
              as: PlatformAdmin
              captures: { pb_id: $.data.id }
            - call: "POST /pattern-assets"
              payload: { pump_model_id: "${m1_id}", foundry_id: "${f1_id}", pattern_code: "PAT-C", wear_threshold: 20 }
              as: PlatformAdmin
              captures: { pc_id: $.data.id }
            - call: "POST /casting-lots"
              payload: { pattern_asset_id: "${pa_id}", foundry_id: "${f1_id}", heat_number: "H-9001", alloy_code: "CI_GG25", qty_poured: 4, pour_window_start: "2026-08-05T00:00:00Z", pour_window_end: "2026-08-10T00:00:00Z" }
              as: FoundryPartner
              as_user_id: "${f1_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /casting-lots"
              payload: { pattern_asset_id: "${pb_id}", foundry_id: "${f1_id}", heat_number: "H-9002", alloy_code: "CI_GG25", qty_poured: 4, pour_window_start: "2026-08-07T00:00:00Z", pour_window_end: "2026-08-12T00:00:00Z" }
              as: FoundryPartner
              as_user_id: "${f1_id}"
              captures: { l2_id: $.data.id }
          trigger:
            - call: "POST /casting-lots"
              payload: { pattern_asset_id: "${pc_id}", foundry_id: "${f1_id}", heat_number: "H-9003", alloy_code: "CI_GG25", qty_poured: 4, pour_window_start: "2026-08-09T00:00:00Z", pour_window_end: "2026-08-11T00:00:00Z" }
              as: FoundryPartner
              as_user_id: "${f1_id}"
            - call: "POST /casting-lots"
              payload: { pattern_asset_id: "${pc_id}", foundry_id: "${f1_id}", heat_number: "H-9004", alloy_code: "CI_GG25", qty_poured: 4, pour_window_start: "2026-08-10T00:00:00Z", pour_window_end: "2026-08-14T00:00:00Z" }
              as: FoundryPartner
              as_user_id: "${f1_id}"
              captures: { l4_id: $.data.id }
          assert:
            - "the first call returns 409 with error_id ERR_FOUNDRY_POUR_CAPACITY_EXCEEDED"
            - "after the first call count(CastingLot WHERE foundry_id == ${f1_id}) == 2 and PatternAsset.${pc_id}.pours_since_refurb == 0"
            - "the second call returns 201 and CastingLot.${l4_id}.status == POURED"
            - "count(CastingLot WHERE foundry_id == ${f1_id}) == 3"
            - "PatternAsset.${pc_id}.pours_since_refurb == 1 and PatternAsset.${pc_id}.status == QUALIFIED"
            - "CastingLot.${l1_id}.status == POURED and CastingLot.${l2_id}.status == POURED"

  # =====================================================================
  # Rule 9 - compensating_invariant
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: repair_kit_unit_conservation_holds_across_reserve_release_issue_and_consume
        grounds:
          - calculations.kit_allocation_charge
          - state_machines.KitAllocation.RESERVED_to_RELEASED
          - state_machines.KitAllocation.RESERVED_to_ISSUED
          - state_machines.KitAllocation.ISSUED_to_CONSUMED
          - entities.RepairKit.fields.qty_received_total
        distinguishing_aspect: |
          Conserved quantity: qty_on_hand + qty_reserved + qty_issued + qty_consumed_total must
          equal qty_received_total after EVERY allocation transition. The recipe walks a full
          compensating round trip (reserve 2 then release 2, restoring the opening balance
          exactly) and then a forward path (reserve 3, issue 3, consume 3) that moves units into a
          terminal bucket. An implementation that decrements on_hand on release, or that forgets
          to drain qty_issued on consume, drifts the sum away from 5 even though individual
          statuses look right.
        test_recipe:
          setup:
            - "Master data, APPROVED Selection on APP-1001, ACCEPTED CastingLot H-9001 and BuildOrder SN-0001 as in rule 5 instance 3."
            - "RepairKit RK-HSC14-G2 (gen 2-2, preferred_generation 2, penalty 0.0, unit_price 980.00, window 2026-01-01 to 2029-01-01) with 5 units received: qty_received_total 5, qty_on_hand 5, all other buckets 0."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /pump-models"
              payload: { model_code: "HSC-14", generation: 2, interchange_group: "IG-HSC-14", max_impeller_diameter_mm: 355.0, min_impeller_diameter_mm: 300.0, shutoff_head_m: 92.0, bep_flow_m3h: 300.0, bep_head_m: 72.0, bep_efficiency_pct: 82.0, npshr_at_bep_m: 4.20, rated_speed_rpm: 2950, max_flow_m3h: 380.0, rotor_mass_kg: 68.0, balance_grade: "G6_3" }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /pattern-assets"
              payload: { pump_model_id: "${m1_id}", foundry_id: "${f1_id}", pattern_code: "PAT-HSC14-A", wear_threshold: 20 }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /material-seal-configs"
              payload: { pump_model_id: "${m1_id}", config_code: "MSC-CI-P11", casing_material: "CI_GG25", impeller_material: "CI_GG25", seal_type: "SINGLE_CARTRIDGE", flush_plan: "API_PLAN_11", service_class: "CLEAN", max_solids_pct: 0.0, max_viscosity_cst: 50.0, max_chloride_ppm: 200.0, max_temp_c: 120.0, min_running_clearance_mm: 0.30 }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /duty-applications"
              payload: { application_code: "APP-1001", customer_name: "Delta Refining", duty_flow_m3h: 265.0, duty_head_m: 74.0, npsha_available_m: 5.00, specific_gravity: 1.00, viscosity_cst: 1.2, solids_pct: 0.0, chloride_ppm: 150.0, process_temp_c: 60.0, min_efficiency_pct: 74.0, test_grade: "GRADE_1B", witness_required: true, service_class_required: "CLEAN" }
              as: ApplicationEngineer
              as_user_id: "eng-101"
              captures: { d1_id: $.data.id, d1_ver: $.data.version }
            - call: "POST /selections"
              payload: { duty_application_id: "${d1_id}", pump_model_id: "${m1_id}", material_seal_config_id: "${c1_id}", expected_duty_application_version: "${d1_ver}" }
              as: ApplicationEngineer
              as_user_id: "eng-101"
              captures: { s1_id: $.data.id }
            - call: "POST /selections/${s1_id}/propose"
              payload: {}
              as: ApplicationEngineer
              as_user_id: "eng-101"
            - call: "POST /selections/${s1_id}/approve"
              payload: {}
              as: HydraulicApprover
              as_user_id: "appr-201"
            - call: "POST /casting-lots"
              payload: { pattern_asset_id: "${p1_id}", foundry_id: "${f1_id}", heat_number: "H-9001", alloy_code: "CI_GG25", qty_poured: 4, pour_window_start: "2026-08-05T00:00:00Z", pour_window_end: "2026-08-10T00:00:00Z" }
              as: FoundryPartner
              as_user_id: "${f1_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /casting-lots/${l1_id}/inspect"
              payload: {}
              as: QualityInspector
              as_user_id: "qi-301"
            - call: "POST /casting-lots/${l1_id}/accept"
              payload: {}
              as: QualityInspector
              as_user_id: "qi-301"
            - call: "POST /build-orders"
              payload: { selection_id: "${s1_id}", casting_lot_id: "${l1_id}", serial_number: "SN-0001" }
              as: ProductionPlanner
              captures: { b1_id: $.data.id }
            - call: "POST /repair-kits"
              payload: { pump_model_id: "${m1_id}", kit_code: "RK-HSC14-G2", interchange_group: "IG-HSC-14", gen_min: 2, gen_max: 2, preferred_generation: 2, substitution_penalty_pct: 0.0, unit_price: 980.00, support_window_start: "2026-01-01T00:00:00Z", support_window_end: "2029-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { k1_id: $.data.id }
            - call: "POST /repair-kits/${k1_id}/receipts"
              payload: { qty: 5 }
              as: ProductionPlanner
              captures: { k1_ver: $.data.version }
          trigger:
            - call: "POST /kit-allocations"
              payload: { repair_kit_id: "${k1_id}", build_order_id: "${b1_id}", requested_qty: 2, expected_repair_kit_version: "${k1_ver}" }
              as: ProductionPlanner
              captures: { ka1_id: $.data.id }
            - call: "POST /kit-allocations/${ka1_id}/release"
              payload: {}
              as: ProductionPlanner
            - call: "GET /repair-kits/${k1_id}"
              payload: {}
              as: ProductionPlanner
              captures: { k1_ver2: $.data.version }
            - call: "POST /kit-allocations"
              payload: { repair_kit_id: "${k1_id}", build_order_id: "${b1_id}", requested_qty: 3, expected_repair_kit_version: "${k1_ver2}" }
              as: ProductionPlanner
              captures: { ka2_id: $.data.id }
            - call: "POST /kit-allocations/${ka2_id}/issue"
              payload: {}
              as: ProductionPlanner
            - call: "POST /kit-allocations/${ka2_id}/consume"
              payload: {}
              as: ProductionPlanner
          assert:
            - "KitAllocation.${ka1_id}.status == RELEASED and KitAllocation.${ka1_id}.parts_extended == 1960.00 and KitAllocation.${ka1_id}.handling_rate == 0.08 and KitAllocation.${ka1_id}.handling_fee == 156.80 and KitAllocation.${ka1_id}.total_charge == 2116.80"
            - "KitAllocation.${ka2_id}.status == CONSUMED and KitAllocation.${ka2_id}.parts_extended == 2940.00 and KitAllocation.${ka2_id}.total_charge == 3175.20"
            - "RepairKit.${k1_id}.qty_received_total == 5"
            - "RepairKit.${k1_id}.qty_on_hand == 2 and RepairKit.${k1_id}.qty_reserved == 0 and RepairKit.${k1_id}.qty_issued == 0 and RepairKit.${k1_id}.qty_consumed_total == 3"
            - "RepairKit.${k1_id}.qty_on_hand + RepairKit.${k1_id}.qty_reserved + RepairKit.${k1_id}.qty_issued + RepairKit.${k1_id}.qty_consumed_total == 5"
            - "RepairKit.${k1_id}.version > ${k1_ver2}"

      - name: casting_lot_piece_conservation_holds_across_scrap_revision_and_repair_verification
        grounds:
          - calculations.casting_yield_ledger
          - state_machines.CastingDefect.DISPOSITIONED_SCRAP_to_DISPOSITIONED_REPAIR
          - state_machines.CastingDefect.DISPOSITIONED_REPAIR_to_REPAIR_VERIFIED
          - entities.CastingLot.fields.qty_accepted
        distinguishing_aspect: |
          A second conserved quantity on a different aggregate: qty_poured must always equal
          qty_accepted + qty_rework_pending + qty_scrapped. The two pieces move scrapped -> rework
          -> accepted through a disposition REVISION and a repair verification, so the same two
          units traverse all three buckets while the total stays 6. The lot is ACCEPTED with
          committed_build_count 0 throughout, so qty_accepted never falls below max(1, 0) and no
          quarantine cascade masks the ledger arithmetic.
        test_recipe:
          setup:
            - "Foundry FDY-NORTH ACTIVE, PumpModel HSC-14 and PatternAsset PAT-HSC14-A (wear_threshold 20) as in rule 1 instance 1."
            - "CastingLot H-9001 poured with qty_poured 6; one MAJOR CastingDefect DF-1 with affected_qty 2 reported by the FoundryPartner, then the lot inspected."
            - "DF-1 dispositioned SCRAP by qi-301, leaving qty_scrapped 2, qty_rework_pending 0 and qty_accepted 4; the lot is then ACCEPTED (no REPORTED defects remain and qty_accepted >= 1) and has no BuildOrder bound to it."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /pump-models"
              payload: { model_code: "HSC-14", generation: 2, interchange_group: "IG-HSC-14", max_impeller_diameter_mm: 355.0, min_impeller_diameter_mm: 300.0, shutoff_head_m: 92.0, bep_flow_m3h: 300.0, bep_head_m: 72.0, bep_efficiency_pct: 82.0, npshr_at_bep_m: 4.20, rated_speed_rpm: 2950, max_flow_m3h: 380.0, rotor_mass_kg: 68.0, balance_grade: "G6_3" }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /pattern-assets"
              payload: { pump_model_id: "${m1_id}", foundry_id: "${f1_id}", pattern_code: "PAT-HSC14-A", wear_threshold: 20 }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /casting-lots"
              payload: { pattern_asset_id: "${p1_id}", foundry_id: "${f1_id}", heat_number: "H-9001", alloy_code: "CI_GG25", qty_poured: 6, pour_window_start: "2026-08-05T00:00:00Z", pour_window_end: "2026-08-10T00:00:00Z" }
              as: FoundryPartner
              as_user_id: "${f1_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /casting-lots/${l1_id}/defects"
              payload: { defect_code: "DF-1", defect_type: "POROSITY", severity: "MAJOR", affected_qty: 2 }
              as: FoundryPartner
              as_user_id: "${f1_id}"
              captures: { df1_id: $.data.id }
            - call: "POST /casting-lots/${l1_id}/inspect"
              payload: {}
              as: QualityInspector
              as_user_id: "qi-301"
            - call: "POST /casting-defects/${df1_id}/disposition"
              payload: { disposition: "SCRAP" }
              as: QualityInspector
              as_user_id: "qi-301"
            - call: "POST /casting-lots/${l1_id}/accept"
              payload: {}
              as: QualityInspector
              as_user_id: "qi-301"
          trigger:
            - call: "POST /casting-defects/${df1_id}/revise-disposition"
              payload: { disposition: "REPAIR_WELD" }
              as: QualityInspector
              as_user_id: "qi-301"
            - call: "POST /casting-defects/${df1_id}/repair-verified"
              payload: {}
              as: QualityInspector
              as_user_id: "qi-301"
          assert:
            - "immediately after the revision CastingLot.${l1_id}.qty_scrapped == 0, qty_rework_pending == 2 and qty_accepted == 4, and CastingDefect.${df1_id}.status == DISPOSITIONED_REPAIR"
            - "after the repair verification CastingLot.${l1_id}.qty_scrapped == 0, CastingLot.${l1_id}.qty_rework_pending == 0 and CastingLot.${l1_id}.qty_accepted == 6"
            - "CastingLot.${l1_id}.qty_accepted + CastingLot.${l1_id}.qty_rework_pending + CastingLot.${l1_id}.qty_scrapped == CastingLot.${l1_id}.qty_poured"
            - "CastingLot.${l1_id}.qty_poured == 6 and CastingLot.${l1_id}.status == ACCEPTED"
            - "CastingDefect.${df1_id}.status == REPAIR_VERIFIED and CastingDefect.${df1_id}.disposition == REPAIR_WELD"
            - "PatternAsset.${p1_id}.defect_pours_since_refurb == 0 and PatternAsset.${p1_id}.wear_index == 1 and PatternAsset.${p1_id}.status == QUALIFIED"
