      - name: recall_reconcile_with_outstanding_units_blocked
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Recall.IN_PROGRESS_to_RECONCILED
          - errors[ERR_RECALL_UNITS_OUTSTANDING]
          - entities.Recall.fields.units_reconciled
          - entities.Recall.fields.units_in_scope
          - endpoints["POST /pharmacy-compounding/recalls/{rid}/reconcile"]
        distinguishing_aspect: "Recall reconcile attempted directly from IN_PROGRESS without reconciling all in-scope units (units_reconciled < units_in_scope) -> ERR_RECALL_UNITS_OUTSTANDING (409)."
        excluded_because:
          difficulty_instance: non_linear_state_machine / recall_in_progress_reopen_cycle_back_to_initiated
          rationale: "The recall IN_PROGRESS state and its units_in_scope/units_reconciled counters are established by the recall difficulty instance's setup; the reconcile-with-outstanding guard rides on that same recall lifecycle and is verified there as the reconcile precondition."

      - name: finished_preparation_parallel_dimensions_independent
        claim_type: Side Effect Execution
        grounds:
          - state_machines.FinishedPreparation.IN_INVENTORY_to_DISPENSED
          - state_machines.FinishedPreparation.AWAITING_QC_to_QC_RELEASED
          - entities.FinishedPreparation.fields.qc_status
          - entities.FinishedPreparation.fields.dispense_status
        distinguishing_aspect: "A dispensed prep carries qc_status==QC_RELEASED and dispense_status==DISPENSED simultaneously — two parallel dimensions evolved independently."
        excluded_because:
          difficulty_instance: compensating_invariant / recall_then_decrement_conserves_prescription_units_dispensed
          rationale: "That instance releases (qc_status->QC_RELEASED) then dispenses (dispense_status->DISPENSED) the same prep, observing both parallel dimensions before the recall override."

  # ===========================================================================
  # Calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: potency_adjusted_grams_4dp_rounding
        claim_type: Precision
        grounds:
          - calculations.lot_potency_adjustment
          - entities.BatchIngredientUsage.fields.potency_adjusted_grams
          - endpoints["POST /pharmacy-compounding/batch-ingredient-usages"]
        distinguishing_aspect: "Charging grams_used=12.5 from a lot at labeled_potency_pct=101.2 -> potency_adjusted_grams == round(12.5*1.012,4) == 12.65."
        test_recipe:
          setup:
            - "A DRAFT batch and a lot at potency 101.2%."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Acme", registration_type: "503A", state_code: "CA" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
            - call: "POST /pharmacy-compounding/master-formulation-records"
              payload: { facility_id: "${f_id}", name: "F1", dosage_form: "ORAL_SOLID", default_bud_days_nonsterile: 90, theoretical_yield_units: 100, anticipatory_max_units: 500 }
              as: CompoundingPharmacist
              captures: { mfr_id: $.data.id }
            - call: "POST /pharmacy-compounding/ingredient-lots"
              payload: { facility_id: "${f_id}", component_name: "API X", lot_number: "X-1", labeled_potency_pct: 101.2, initial_grams: 50, expiration_utc: "2030-01-01T00:00:00.000Z" }
              as: CompoundingPharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /pharmacy-compounding/compounding-batches"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", purpose: "OFFICE_USE" }
              as: CompoundingPharmacist
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /pharmacy-compounding/batch-ingredient-usages"
              payload: { compounding_batch_id: "${batch_id}", ingredient_lot_id: "${lot_id}", grams_used: 12.5 }
              as: CompoundingPharmacist
              captures: { usage_id: $.data.id, pag: $.data.potency_adjusted_grams }
          assert:
            - "BatchIngredientUsage.${usage_id}.potency_adjusted_grams == 12.65"

      - name: anticipatory_ledger_computed_read_consumed_units
        claim_type: Correct Result
        grounds:
          - calculations.anticipatory_consumed_units
          - entities.AnticipatoryLimitLedger.fields.consumed_units
          - entities.AnticipatoryLimitLedger.fields.remaining_units
          - endpoints["GET /pharmacy-compounding/master-formulation-records/{mid}/anticipatory-ledger"]
        distinguishing_aspect: "After one OFFICE_USE batch (yield 120) released, GET anticipatory-ledger returns consumed_units==120, remaining_units==80 for max 200."
        excluded_because:
          difficulty_instance: resource_temporal_overlap / anticipatory_rolling_window_aggregate_capacity_overlap
          rationale: "The anticipatory ledger consumed/remaining computation after a 120-unit release is computed and asserted (120/80) inside that difficulty instance."

      - name: anticipatory_window_excludes_out_of_window_release
        claim_type: Input Set Filtering
        grounds:
          - calculations.anticipatory_consumed_units
          - entities.AnticipatoryLimitLedger.fields.window_start_utc
          - entities.CompoundingBatch.fields.released_at_utc
          - endpoints["GET /pharmacy-compounding/master-formulation-records/{mid}/anticipatory-ledger"]
        distinguishing_aspect: "A 120-unit OFFICE_USE batch released at 2026-06-01 falls outside a 30-day window when the clock advances to 2026-08-01; GET ledger then returns consumed_units==0, remaining_units==200."
        test_recipe:
          setup:
            - "503B facility, MFR anticipatory_window_days=30, anticipatory_max_units=200, theoretical_yield_units=120."
            - "One OFFICE_USE batch released at 2026-06-01 (120 units), then clock advanced to 2026-08-01 (61 days later, outside the 30-day window)."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Win B", registration_type: "503B", state_code: "TX" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
            - call: "POST /pharmacy-compounding/facilities/${f_id}/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /pharmacy-compounding/master-formulation-records"
              payload: { facility_id: "${f_id}", name: "Win F", dosage_form: "ORAL_LIQUID", default_bud_days_nonsterile: 90, theoretical_yield_units: 120, anticipatory_max_units: 200, anticipatory_window_days: 30 }
