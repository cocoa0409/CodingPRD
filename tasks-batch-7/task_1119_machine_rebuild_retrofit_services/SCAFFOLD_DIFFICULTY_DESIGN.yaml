            - { call: "POST /api/projects/${proj}/shipment-stages", payload: { window_id: "${win}", stage_sequence: 1, planned_ship_date: "2026-06-10T00:00:00Z", planned_return_date: "2026-06-15T00:00:00Z" }, as: LogisticsCoordinator, captures: { st1: $.data.id } }
