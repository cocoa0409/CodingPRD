scaffold_corner_design:
  - section: entities
    instances:
      - name: guardian_creation_applies_system_defaults
        claim_type: creation_defaults
        grounds:
        - "entities.Guardian"
        distinguishing_aspect: "POST /guardians returns 201 with membership_status NONE, loyalty_tier BRONZE, all counters 0, version 1 — system/computed fields cannot be set by input."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: Admin }
          trigger:
            - { call: "POST /guardians", payload: { full_name: "G D", email: "gd@x.com", phone: "901" }, as: Anonymous, captures: { g: $.data.id, v: $.data.version, tier: $.data.loyalty_tier, ms: $.data.membership_status } }
          assert:
            - "Guardian.${g}.version == 1, membership_status == NONE, loyalty_tier == BRONZE"
            - "credits_granted/consumed/held/available/statement, lifetime_points, points_balance all == 0"
            - "id is a bare UUID without a type prefix"

      - name: child_creation_missing_birth_date_returns_invalid_request
        claim_type: required_fields
        grounds:
        - "entities.Child.fields.birth_date"
        - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Omitting required birth_date on child creation yields ERR_VALIDATION (400)."
        test_recipe:
          setup: ["guardian g exists"]
          setup_api_calls:
            - { call: "POST /guardians", payload: { full_name: "G E", email: "ge@x.com", phone: "902" }, as: Anonymous, captures: { g: $.data.id } }
          trigger:
            - { call: "POST /guardians/${g}/children", payload: { full_name: "Kid X" }, as: Guardian, as_user_id: "${g}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION and http status 400"

      - name: child_creation_invalid_allergen_enum_rejected
        claim_type: type_constraints
        grounds:
        - "entities.Child.fields.allergies"
        - "errors[ERR_INVALID_ENUM]"
        distinguishing_aspect: "An allergy code outside the declared 8-member allergen enum is rejected with ERR_INVALID_ENUM."
        test_recipe:
          setup: ["guardian g exists"]
          setup_api_calls:
            - { call: "POST /guardians", payload: { full_name: "G F", email: "gf@x.com", phone: "903" }, as: Anonymous, captures: { g: $.data.id } }
          trigger:
            - { call: "POST /guardians/${g}/children", payload: { full_name: "Kid Y", birth_date: "2020-01-15", allergies: ["GLUTEN"] }, as: Guardian, as_user_id: "${g}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_ENUM (GLUTEN is not a declared allergen; WHEAT is)"

      - name: get_nonexistent_guardian_returns_not_found
        claim_type: not_found
        grounds:
        - "errors[ERR_NOT_FOUND]"
        - "validations[priority=3]"
        distinguishing_aspect: "GET with a random UUID yields 404 ERR_NOT_FOUND in the fixed error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /staff-members", payload: { full_name: "Mgr One", role: "MANAGER" }, as: Admin, captures: { mgr: $.data.id } }
          trigger:
            - { call: "GET /guardians/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Manager, as_user_id: "${mgr}", captures: { err: $.data.error_id } }
          assert:
            - "http 404 and error envelope: response_type == error, data.error_id == ERR_NOT_FOUND"

      - name: slot_counters_reflect_reservation_and_checkin
        claim_type: computed_fields
        grounds:
        - "entities.SessionSlot.fields.reserved_count"
        - "entities.SessionSlot.fields.checked_in_count"
        - "calculations.session_slot_load"
        distinguishing_aspect: "Derived counters reconcile with source visits: 2 reservations then 1 check-in => reserved_count 1, checked_in_count 1."
        test_recipe:
          setup: ["OPEN slot cap 10; guardian with waiver and two children; two reservations; one checked in"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: Admin }
            - { call: "POST /staff-members", payload: { full_name: "FD One", role: "FRONT_DESK" }, as: Admin, captures: { fd: $.data.id } }
            - { call: "POST /staff-members", payload: { full_name: "Mgr One", role: "MANAGER" }, as: Admin, captures: { mgr: $.data.id } }
            - { call: "POST /session-slots", payload: { slot_date: "2026-06-06", start_at: "2026-06-06T14:00:00Z", end_at: "2026-06-06T15:30:00Z", capacity: 10 }, as: Manager, as_user_id: "${mgr}", captures: { s1: $.data.id } }
            - { call: "POST /session-slots/${s1}/open", payload: {}, as: Manager, as_user_id: "${mgr}" }
            - { call: "POST /guardians", payload: { full_name: "G G", email: "gg@x.com", phone: "904" }, as: Anonymous, captures: { g: $.data.id, g_ver: $.data.version } }
            - { call: "POST /guardians/${g}/waivers", payload: { expected_guardian_version: "${g_ver}" }, as: Guardian, as_user_id: "${g}" }
            - { call: "POST /guardians/${g}/children", payload: { full_name: "K1", birth_date: "2020-01-15" }, as: Guardian, as_user_id: "${g}", captures: { c1: $.data.id } }
            - { call: "POST /guardians/${g}/children", payload: { full_name: "K2", birth_date: "2019-06-15" }, as: Guardian, as_user_id: "${g}", captures: { c2: $.data.id } }
            - { call: "POST /visits", payload: { session_slot_id: "${s1}", child_id: "${c1}", guardian_id: "${g}", visit_type: "RESERVATION", booked_duration_minutes: 60 }, as: Guardian, as_user_id: "${g}", captures: { v1: $.data.id } }
            - { call: "POST /visits", payload: { session_slot_id: "${s1}", child_id: "${c2}", guardian_id: "${g}", visit_type: "RESERVATION", booked_duration_minutes: 60 }, as: Guardian, as_user_id: "${g}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-06T14:05:00Z" }, as: Admin }
            - { call: "POST /visits/${v1}/check-in", payload: { sock_method: "OWN_GRIP_SOCKS" }, as: FrontDesk, as_user_id: "${fd}" }
          trigger:
            - { call: "GET /session-slots/${s1}", payload: {}, as: Manager, as_user_id: "${mgr}", captures: { rc: $.data.reserved_count, cc: $.data.checked_in_count } }
          assert:
            - "SessionSlot.${s1}.reserved_count == 1 and checked_in_count == 1"

  - section: state_machines
    instances:
      - name: party_booking_created_in_held
        claim_type: initial_state
        grounds:
        - "state_machines.PartyBooking"
        distinguishing_aspect: "A new party booking starts in HELD (not CONFIRMED) with deposit_paid false."
        test_recipe:
          setup: ["room + STD package + guardian"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: Admin }
            - { call: "POST /party-packages", payload: { name: "STD", duration_minutes: 120, base_price_cents: 30000, included_children: 10, extra_child_price_cents: 1500, cafe_credit_cents: 2000 }, as: Admin, captures: { pkg: $.data.id } }
            - { call: "POST /party-rooms", payload: { name: "Room A", capacity_children: 20 }, as: Admin, captures: { r1: $.data.id, r_ver: $.data.version } }
            - { call: "POST /guardians", payload: { full_name: "G H", email: "gh@x.com", phone: "905" }, as: Anonymous, captures: { g: $.data.id } }
          trigger:
            - { call: "POST /party-bookings", payload: { party_room_id: "${r1}", party_package_id: "${pkg}", guardian_id: "${g}", start_at: "2026-06-08T10:00:00Z", child_count: 10, expected_party_room_version: "${r_ver}" }, as: Guardian, as_user_id: "${g}", captures: { pb: $.data.id, st: $.data.status, dp: $.data.deposit_paid } }
          assert:
            - "PartyBooking.${pb}.status == HELD and deposit_paid == false"

      - name: waiver_new_signature_supersedes_prior
        claim_type: side_effect_execution
        grounds:
        - "state_machines.Waiver.SIGNED_to_SUPERSEDED"
        distinguishing_aspect: "Signing a second waiver flips the first to SUPERSEDED; exactly one SIGNED waiver remains."
        test_recipe:
          setup: ["guardian g with one signed waiver"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: Admin }
            - { call: "POST /guardians", payload: { full_name: "G I", email: "gi@x.com", phone: "906" }, as: Anonymous, captures: { g: $.data.id, gv: $.data.version } }
            - { call: "POST /guardians/${g}/waivers", payload: { expected_guardian_version: "${gv}" }, as: Guardian, as_user_id: "${g}", captures: { w1: $.data.id } }
            - { call: "GET /guardians/${g}", payload: {}, as: Guardian, as_user_id: "${g}", captures: { gv2: $.data.version } }
          trigger:
            - { call: "POST /guardians/${g}/waivers", payload: { expected_guardian_version: "${gv2}" }, as: Guardian, as_user_id: "${g}", captures: { w2: $.data.id } }
            - { call: "GET /guardians/${g}/waivers", payload: {}, as: Guardian, as_user_id: "${g}" }
          assert:
            - "Waiver.${w1}.status == SUPERSEDED and Waiver.${w2}.status == SIGNED"
            - "waivers list contains exactly 2 entries, exactly one SIGNED"

      - name: checkout_of_completed_visit_rejected
        claim_type: invalid_transition
        grounds:
        - "state_machines.Visit"
        - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "COMPLETED is terminal: a second check-out returns ERR_INVALID_STATE and recomputes nothing."
        test_recipe:
          setup: ["visit v1 fully completed (60-min booking, checked in 14:05, out 15:00; final 55min*20c = 1100)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: Admin }
            - { call: "POST /staff-members", payload: { full_name: "FD One", role: "FRONT_DESK" }, as: Admin, captures: { fd: $.data.id } }
            - { call: "POST /staff-members", payload: { full_name: "Mgr One", role: "MANAGER" }, as: Admin, captures: { mgr: $.data.id } }
            - { call: "POST /session-slots", payload: { slot_date: "2026-06-06", start_at: "2026-06-06T14:00:00Z", end_at: "2026-06-06T15:30:00Z", capacity: 10 }, as: Manager, as_user_id: "${mgr}", captures: { s1: $.data.id } }
            - { call: "POST /session-slots/${s1}/open", payload: {}, as: Manager, as_user_id: "${mgr}" }
            - { call: "POST /guardians", payload: { full_name: "G J", email: "gj@x.com", phone: "907" }, as: Anonymous, captures: { g: $.data.id, g_ver: $.data.version } }
            - { call: "POST /guardians/${g}/children", payload: { full_name: "K1", birth_date: "2020-01-15" }, as: Guardian, as_user_id: "${g}", captures: { c1: $.data.id } }
            - { call: "POST /guardians/${g}/waivers", payload: { expected_guardian_version: "${g_ver}" }, as: Guardian, as_user_id: "${g}" }
            - { call: "POST /visits", payload: { session_slot_id: "${s1}", child_id: "${c1}", guardian_id: "${g}", visit_type: "RESERVATION", booked_duration_minutes: 60 }, as: Guardian, as_user_id: "${g}", captures: { v1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-06T14:05:00Z" }, as: Admin }
            - { call: "POST /visits/${v1}/check-in", payload: { sock_method: "OWN_GRIP_SOCKS" }, as: FrontDesk, as_user_id: "${fd}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-06T15:00:00Z" }, as: Admin }
            - { call: "POST /visits/${v1}/check-out", payload: {}, as: FrontDesk, as_user_id: "${fd}", captures: { fin: $.data.final_charge_cents } }
          trigger:
            - { call: "POST /visits/${v1}/check-out", payload: {}, as: FrontDesk, as_user_id: "${fd}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (COMPLETED is terminal)"
            - "Visit.${v1}.final_charge_cents remains 1100 (55 elapsed minutes * 20c; no recomputation)"

      - name: closed_incident_cannot_be_reopened
        claim_type: terminal_lockdown
        grounds:
        - "state_machines.Incident"
        - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "CLOSED is terminal for Incident: reopen from CLOSED returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["incident closed via triage -> resolve -> close"]
          setup_api_calls:
            - { call: "POST /staff-members", payload: { full_name: "FD One", role: "FRONT_DESK" }, as: Admin, captures: { fd: $.data.id } }
            - { call: "POST /staff-members", payload: { full_name: "Mgr One", role: "MANAGER" }, as: Admin, captures: { mgr: $.data.id } }
            - { call: "POST /incidents", payload: { kind: "INJURY", severity: "LOW", description: "scraped knee" }, as: FrontDesk, as_user_id: "${fd}", captures: { i1: $.data.id } }
            - { call: "POST /incidents/${i1}/triage", payload: {}, as: Manager, as_user_id: "${mgr}" }
            - { call: "POST /incidents/${i1}/resolve", payload: { resolution_note: "band-aid applied" }, as: Manager, as_user_id: "${mgr}" }
            - { call: "POST /incidents/${i1}/close", payload: {}, as: Manager, as_user_id: "${mgr}" }
          trigger:
            - { call: "POST /incidents/${i1}/reopen", payload: {}, as: Manager, as_user_id: "${mgr}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; Incident.${i1}.status remains CLOSED"

      - name: ops_run_marks_overdue_reserved_visit_no_show
        claim_type: automatic_transition
        grounds:
        - "state_machines.Visit.RESERVED_to_NO_SHOW"
        distinguishing_aspect: "Ops run at slot.start+16min flips an un-arrived RESERVED visit to NO_SHOW and frees reserved_count."
        test_recipe:
          setup: ["OPEN slot 14:00-15:30; RESERVED visit, never checked in; clock advanced to 14:16"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: Admin }
            - { call: "POST /staff-members", payload: { full_name: "Mgr One", role: "MANAGER" }, as: Admin, captures: { mgr: $.data.id } }
            - { call: "POST /session-slots", payload: { slot_date: "2026-06-06", start_at: "2026-06-06T14:00:00Z", end_at: "2026-06-06T15:30:00Z", capacity: 10 }, as: Manager, as_user_id: "${mgr}", captures: { s1: $.data.id } }
            - { call: "POST /session-slots/${s1}/open", payload: {}, as: Manager, as_user_id: "${mgr}" }
            - { call: "POST /guardians", payload: { full_name: "G K", email: "gk@x.com", phone: "908" }, as: Anonymous, captures: { g: $.data.id, g_ver: $.data.version } }
            - { call: "POST /guardians/${g}/children", payload: { full_name: "K1", birth_date: "2020-01-15" }, as: Guardian, as_user_id: "${g}", captures: { c1: $.data.id } }
            - { call: "POST /guardians/${g}/waivers", payload: { expected_guardian_version: "${g_ver}" }, as: Guardian, as_user_id: "${g}" }
            - { call: "POST /visits", payload: { session_slot_id: "${s1}", child_id: "${c1}", guardian_id: "${g}", visit_type: "RESERVATION", booked_duration_minutes: 60 }, as: Guardian, as_user_id: "${g}", captures: { v1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-06T14:16:00Z" }, as: Admin }
          trigger:
            - { call: "POST /ops-runs", payload: {}, as: Admin }
            - { call: "GET /visits/${v1}", payload: {}, as: Manager, as_user_id: "${mgr}", captures: { adm: $.data.admission_status } }
            - { call: "GET /session-slots/${s1}", payload: {}, as: Manager, as_user_id: "${mgr}", captures: { rc: $.data.reserved_count } }
          assert:
            - "Visit.${v1}.admission_status == NO_SHOW (grace is start+15min; 14:16 >= 14:15)"
            - "SessionSlot.${s1}.reserved_count == 0 (hold released)"

      - name: cafe_order_serve_before_preparing_rejected
        claim_type: invalid_transition
        grounds:
        - "state_machines.CafeOrder"
        - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "PLACED -> SERVED is not a declared transition; serve before start-preparing fails."
        test_recipe:
          setup: ["PLACED order for guardian g"]
          setup_api_calls:
            - { call: "POST /cafe-menu-items", payload: { name: "Latte", price_cents: 425, allergen_tags: ["MILK"] }, as: Admin, captures: { latte: $.data.id } }
            - { call: "POST /staff-members", payload: { full_name: "Cafe One", role: "CAFE_STAFF" }, as: Admin, captures: { cafe: $.data.id } }
            - { call: "POST /guardians", payload: { full_name: "G M", email: "gm@x.com", phone: "910" }, as: Anonymous, captures: { g: $.data.id } }
            - { call: "POST /cafe-orders", payload: { guardian_id: "${g}", lines: [ { menu_item_id: "${latte}", quantity: 1 } ], child_ids: [] }, as: Guardian, as_user_id: "${g}", captures: { o: $.data.id } }
          trigger:
            - { call: "POST /cafe-orders/${o}/serve", payload: {}, as: CafeStaff, as_user_id: "${cafe}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; CafeOrder.${o}.status remains PLACED"

      - name: incident_resolved_can_reopen_to_triaged
        claim_type: cyclic_transition
        grounds:
        - "state_machines.Incident.RESOLVED_to_TRIAGED"
        distinguishing_aspect: "The Incident machine is cyclic: RESOLVED -> TRIAGED is legal and clears resolved_at."
        test_recipe:
          setup: ["incident in RESOLVED"]
          setup_api_calls:
            - { call: "POST /staff-members", payload: { full_name: "FD One", role: "FRONT_DESK" }, as: Admin, captures: { fd: $.data.id } }
            - { call: "POST /staff-members", payload: { full_name: "Mgr One", role: "MANAGER" }, as: Admin, captures: { mgr: $.data.id } }
            - { call: "POST /incidents", payload: { kind: "BEHAVIOR", severity: "MEDIUM", description: "sandpit dispute" }, as: FrontDesk, as_user_id: "${fd}", captures: { i1: $.data.id } }
            - { call: "POST /incidents/${i1}/triage", payload: {}, as: Manager, as_user_id: "${mgr}" }
            - { call: "POST /incidents/${i1}/resolve", payload: { resolution_note: "parents spoken to" }, as: Manager, as_user_id: "${mgr}" }
          trigger:
            - { call: "POST /incidents/${i1}/reopen", payload: {}, as: Manager, as_user_id: "${mgr}", captures: { st: $.data.status, ra: $.data.resolved_at } }
          assert:
            - "Incident.${i1}.status == TRIAGED and resolved_at is null"

  - section: calculations
    instances:
      - name: reservation_quota_floored_for_odd_capacity
        claim_type: constants_applied
        grounds:
        - "calculations.session_slot_load"
        distinguishing_aspect: "floor(capacity * 0.7): capacity 11 -> quota 7 (7.7 floored), not 8."
        test_recipe:
          setup: ["manager staff member"]
          setup_api_calls:
            - { call: "POST /staff-members", payload: { full_name: "Mgr One", role: "MANAGER" }, as: Admin, captures: { mgr: $.data.id } }
          trigger:
            - { call: "POST /session-slots", payload: { slot_date: "2026-06-06", start_at: "2026-06-06T14:00:00Z", end_at: "2026-06-06T15:30:00Z", capacity: 11 }, as: Manager, as_user_id: "${mgr}", captures: { s1: $.data.id, q: $.data.reservation_quota } }
          assert:
            - "SessionSlot.${s1}.reservation_quota == 7 (floor(7.7))"

      - name: party_deposit_minimum_clamp_applies
        claim_type: threshold_boundary
        grounds:
        - "calculations.party_booking_quote"
        distinguishing_aspect: "Deposit clamp: 20% of a 20000-cent weekday SMALL quote is 4000, below the 5000 minimum, so deposit is exactly 5000."
        test_recipe:
          setup: ["SMALL package (base 20000, incl 10); room; guardian without membership; Monday start, 8 children"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T08:00:00Z" }, as: Admin }
            - { call: "POST /party-packages", payload: { name: "SMALL", duration_minutes: 90, base_price_cents: 20000, included_children: 10, extra_child_price_cents: 1200, cafe_credit_cents: 0 }, as: Admin, captures: { pkg: $.data.id } }
            - { call: "POST /party-rooms", payload: { name: "Room B", capacity_children: 15 }, as: Admin, captures: { r1: $.data.id, r_ver: $.data.version } }
            - { call: "POST /guardians", payload: { full_name: "G N", email: "gn@x.com", phone: "911" }, as: Anonymous, captures: { g: $.data.id } }
          trigger:
            - { call: "POST /party-bookings", payload: { party_room_id: "${r1}", party_package_id: "${pkg}", guardian_id: "${g}", start_at: "2026-06-08T10:00:00Z", child_count: 8, expected_party_room_version: "${r_ver}" }, as: Guardian, as_user_id: "${g}", captures: { pb: $.data.id, qt: $.data.quoted_total_cents, dep: $.data.deposit_cents } }
          assert:
            - "PartyBooking.${pb}.quoted_total_cents == 20000 (no extra children, Monday => no peak, no membership => no discount)"
            - "PartyBooking.${pb}.deposit_cents == 5000 (max(5000, 4000) — minimum clamp engaged)"

  - section: validations
    instances:
      - name: missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
        - "validations[priority=1]"
        - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request without X-User-Role/X-User-ID fails priority-1 auth before any other check."
        test_recipe:
          setup: ["guardian g exists"]
          setup_api_calls:
            - { call: "POST /guardians", payload: { full_name: "G O", email: "go@x.com", phone: "912" }, as: Anonymous, captures: { g: $.data.id } }
          trigger:
            - { call: "GET /guardians/${g}", payload: {}, as: Guardian, as_user_id: "${g}", captures: { err: $.data.error_id } }
          assert:
            - "with headers omitted, error_id == ERR_UNAUTHENTICATED and http 401 (the call above simulates the missing-header case; auth precedes existence and ownership)"

      - name: guardian_cannot_read_other_guardian_record
        claim_type: violation_to_error
        grounds:
        - "validations[priority=2]"
        - "errors[ERR_FORBIDDEN]"
        - "roles[Guardian]"
        distinguishing_aspect: "Ownership scoping: Guardian B reading Guardian A's record yields ERR_FORBIDDEN."
        test_recipe:
          setup: ["guardians A and B exist"]
          setup_api_calls:
            - { call: "POST /guardians", payload: { full_name: "G A", email: "ga2@x.com", phone: "913" }, as: Anonymous, captures: { ga: $.data.id } }
            - { call: "POST /guardians", payload: { full_name: "G B", email: "gb2@x.com", phone: "914" }, as: Anonymous, captures: { gb: $.data.id } }
          trigger:
            - { call: "GET /guardians/${ga}", payload: {}, as: Guardian, as_user_id: "${gb}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN (X-User-ID ${gb} != path guardian ${ga})"

      - name: duplicate_reservation_same_child_slot_rejected
        claim_type: violation_to_error
        grounds:
        - "validations[priority=6]"
        - "errors[ERR_DUPLICATE_VISIT]"
