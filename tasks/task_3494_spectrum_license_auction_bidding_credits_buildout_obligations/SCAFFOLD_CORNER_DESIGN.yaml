        distinguishing_aspect: "Filter and pagination compose: with two PENDING_PAYMENT licenses on the auction, status=PENDING_PAYMENT&limit=1 returns one row with total_count 2 and has_more true; offset=1 returns the other row with has_more false; status=ACTIVE returns total_count 0."
