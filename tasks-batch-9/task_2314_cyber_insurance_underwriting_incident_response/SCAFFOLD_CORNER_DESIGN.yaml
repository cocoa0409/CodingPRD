      - name: payment_reversal_reverses_every_original_side_effect
        claim_type: side_effect_execution
        grounds:
          - state_machines.ClaimPayment.POSTED_to_REVERSED.side_effects
          - state_machines.Policy.EXHAUSTED_to_PARTIALLY_ERODED
        excluded_because:
          difficulty_instance: payment_reversal_restores_aggregate_sublimit_and_claim_ledger
          rationale: "The compensation pattern (sublimit credited by gross, aggregate credited by net, claim ledger unwound, limit_status recomputed and the claim rolled back out of SETTLED with no drift) is the first compensating_invariant instance and is asserted there quantity by quantity."
      - name: claim_denial_terminates_live_engagements_and_releases_slots
        claim_type: side_effect_execution
        grounds:
          - state_machines.IncidentClaim.TRIAGE_to_DENIED.side_effects
          - state_machines.VendorEngagement.AUTHORIZED_to_TERMINATED
        excluded_because:
          difficulty_instance: claim_denial_restores_panel_vendor_capacity_slots
          rationale: "The cross-entity denial cascade (every AUTHORIZED or ACTIVE engagement TERMINATED and one decrement of active_engagement_count per engagement, conserving the vendor's capacity) is the second compensating_invariant instance."
