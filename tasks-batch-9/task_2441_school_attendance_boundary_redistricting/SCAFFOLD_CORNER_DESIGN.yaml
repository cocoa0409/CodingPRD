  - name: contiguity_detects_a_school_split_into_two_components
    claim_type: correct_result
    grounds:
    - calculations.contiguity_evaluation
    - validations[priority=65]
    - errors[ERR_CONTIGUITY_BROKEN]
    - entities.BoundaryScenario.fields.noncontiguous_school_ids
    - endpoints[GET /redistricting/scenarios/{id}/impact-analysis]
    distinguishing_aspect: Cedar is given A-01 and A-03 while Birch takes A-02, so Cedar's area set splits into two components across the A-01 - A-02 - A-03 chain and the submit is refused. Birch's single area and any empty set are vacuously connected, so only Cedar appears in noncontiguous_school_ids. Because the submit fails, the STORED contiguity fields keep their empty-scenario values and the split is visible only through the computed impact-analysis read - which is what separates the atomicity rule from the graph algorithm.
