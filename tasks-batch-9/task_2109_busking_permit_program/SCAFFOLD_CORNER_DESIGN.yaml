      - name: corner_error_permit_suspended_on_booking
        claim_type: error_triggerable
        grounds: ["errors[ERR_PERMIT_SUSPENDED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / booking_admission_depends_on_permit_compliance_axis
          rationale: "Asserted as the 409 returned while the permit sits SUSPENDED."

      - name: corner_error_revision_limit_exceeded
        claim_type: error_triggerable
        grounds: ["errors[ERR_REVISION_LIMIT_EXCEEDED]"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / application_revision_loop_cycles_back_to_submitted_until_limit
          rationale: "Asserted as the 409 returned on the third change request."


