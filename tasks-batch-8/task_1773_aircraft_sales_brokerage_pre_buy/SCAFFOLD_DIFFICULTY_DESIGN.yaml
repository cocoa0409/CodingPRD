              as: BuyerAgent
              captures: { byr_id: $.data.id }
            - call: "POST /api/buyers/${byr_id}/qualify"
              payload: { qualified_budget_usd: 3000000.00, proof_of_funds_ref: "POF-8891" }
              as: BuyerAgent
          trigger:
            - call: "POST /api/lois"
              payload: { listing_id: "${lst_id}", buyer_id: "${byr_id}", offer_price_usd: 2000000.00, deposit_amount_usd: 100000.00 }
