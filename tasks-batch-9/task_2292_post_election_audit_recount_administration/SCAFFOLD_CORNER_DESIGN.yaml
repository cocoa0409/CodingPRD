          A name-only PATCH leaves certification_deadline_at and every derived timeline value untouched,
          while a deadline-only PATCH leaves the amended name untouched and re-runs the projection for the
          audit: slack_hours moves from 416.00 to 560.00 and contest_window_ends_at from 2026-12-04T17:00:00Z
          to 2026-12-10T17:00:00Z.
        test_recipe:
          setup:
            - "E1 at clock 2026-11-05T09:00:00Z with C1 canvassed and audit A1 seeded with one round drawn,"
            - "so exactly one pending round projects completion at 2026-11-07T09:00:00Z."
