            - "Field.${fld_south_id}.required_setback_ft == 100, excluded_acres == 0.00 and net_applicable_acres == 20.00"
      - name: body_foreign_keys_are_validated_in_declaration_order
        claim_type: flat
        grounds:
          - validations[priority=6]
