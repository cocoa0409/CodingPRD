  # ===========================================================================
  - section: errors
    instances:
      - name: error_holdback_not_active_on_bid
        claim_type: violation_to_error
        grounds: ["errors[ERR_HOLDBACK_NOT_ACTIVE]"]
        distinguishing_aspect: "Stub — the error's trigger is asserted in the difficulty index."
        excluded_because:
          difficulty_instance: draw_create_requires_active_holdback
          rationale: "ERR_HOLDBACK_NOT_ACTIVE asserted on draw create against a DRAFT holdback there."
      - name: error_no_selected_contractor
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_SELECTED_CONTRACTOR]"]
        distinguishing_aspect: "Stub — asserted in the difficulty index."
        excluded_because:
          difficulty_instance: draw_create_requires_active_holdback
          rationale: "The mid-chain trigger asserts ERR_NO_SELECTED_CONTRACTOR on an ACTIVE holdback with no selected bid."
      - name: error_shortfall_unfunded
        claim_type: violation_to_error
        grounds: ["errors[ERR_SHORTFALL_UNFUNDED]"]
        distinguishing_aspect: "Stub — asserted in the difficulty index."
        excluded_because:
          difficulty_instance: draw_approve_shortfall_pledge_cascade
          rationale: "pay attempt against PLEDGED pledges asserts ERR_SHORTFALL_UNFUNDED there."
      - name: error_work_not_submitted
        claim_type: violation_to_error
        grounds: ["errors[ERR_WORK_NOT_SUBMITTED]"]
        distinguishing_aspect: "Stub — asserted in the difficulty index."
        excluded_because:
          difficulty_instance: final_inspection_requires_completion_submitted
          rationale: "FINAL_VERIFICATION report against an IN_PROGRESS work order asserts ERR_WORK_NOT_SUBMITTED there."
      - name: error_inspector_schedule_conflict
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSPECTOR_SCHEDULE_CONFLICT]"]
        distinguishing_aspect: "Stub — asserted in the difficulty index."
        excluded_because:
          difficulty_instance: inspector_calendar_half_open_overlap
          rationale: "Overlapping half-open window asserts ERR_INSPECTOR_SCHEDULE_CONFLICT there."
      - name: error_inspection_slot_occupied
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSPECTION_SLOT_OCCUPIED]"]
        distinguishing_aspect: "Stub — asserted in the difficulty index."
        excluded_because:
          difficulty_instance: property_slot_closed_interval_overlap
          rationale: "Adjacent closed-interval conflict asserts ERR_INSPECTION_SLOT_OCCUPIED there."
      - name: error_extension_already_pending
        claim_type: violation_to_error
        grounds: ["errors[ERR_EXTENSION_ALREADY_PENDING]"]
        distinguishing_aspect: "Stub — asserted in the difficulty index."
        excluded_because:
          difficulty_instance: extension_pending_constraint_before_temporal
          rationale: "Dual-failure trigger asserts ERR_EXTENSION_ALREADY_PENDING wins over the temporal error there."
      - name: error_not_expired
        claim_type: violation_to_error
        grounds: ["errors[ERR_NOT_EXPIRED]"]
        distinguishing_aspect: "Stub — asserted in the difficulty index."
        excluded_because:
          difficulty_instance: expire_deadline_date_boundary
          rationale: "Expire on the deadline date asserts ERR_NOT_EXPIRED there."

