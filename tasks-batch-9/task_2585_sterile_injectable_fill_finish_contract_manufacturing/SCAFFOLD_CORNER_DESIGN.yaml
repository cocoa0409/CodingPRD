        excluded_because:
          difficulty_instance: suite_half_open_window_plus_directional_changeover_buffer_strict_boundary
          rationale: "The §1.8 resource_temporal_overlap instance already asserts the half-open suite interval extended by the directional changeover buffer at the exact 16:59 / 17:00 boundary, which covers ERR_SUITE_CHANGEOVER_CONFLICT."

