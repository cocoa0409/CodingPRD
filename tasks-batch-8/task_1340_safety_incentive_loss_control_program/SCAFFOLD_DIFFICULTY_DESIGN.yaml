            - { call: "POST /safety/contractor-orgs/${c_id}/submit", payload: {}, as: ContractorRep, as_user_id: "${c_id}", captures: { st4: $.data.status } }
            - { call: "POST /safety/contractor-orgs/${c_id}/decide", payload: { decision: "APPROVE" }, as: SafetyManager, as_user_id: "${m_id}", captures: { st5: $.data.status } }
          assert:
            - "First submit score == 66.90 with computed_decision CONDITIONAL; decide CONDITIONAL -> status CONDITIONAL"
            - "Remediation resubmit with changed metrics -> UNDER_REVIEW with recomputed score 80.00"
            - "decide APPROVE -> APPROVED with prequal_valid_until == 2027-09-01T00:00:00Z"
            - "suspend -> SUSPENDED; resubmit -> UNDER_REVIEW; second APPROVE -> APPROVED (full cycle)"

  - rule_id: transitive_cascade
    instances:
      - name: control_verify_close_cascade
        grounds:
          - state_machines.ControlItem.IMPLEMENTED_to_VERIFIED
          - state_machines.Hazard.PENDING_VERIFICATION_to_CLOSED
          - state_machines.Observation.LINKED_to_CLOSED
          - calculations.incentive_event_points
        distinguishing_aspect: |
          Depth-4 chain from POST /safety/controls/{id}/verify PASS: control VERIFIED ->
          hazard auto-CLOSED (last control) -> LINKED observations auto-CLOSED -> one
          IncentiveEvent per closed observation plus the CONTROL_VERIFIED event — each
          link caused by the previous one; trigger differs from the sweep cascade.
        test_recipe:
          setup:
            - "ACTIVE program; LOW-class employees A (reporter + implementer) and M (verifier/triager)"
            - "Hazard assessed CRITICAL (4x4 = 16, SLA 7 days) with single control due 2026-06-20"
            - "Observations o1 (OBSERVATION) and o2 (NEAR_MISS) by A, both triaged LINK_EXISTING to the hazard"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - call: "POST /safety/programs"
              payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 1000000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }] }
              as: EHSAdmin
              captures: { p_id: $.data.id }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Ann A", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /safety/hazards", payload: { program_id: "${p_id}", location: "Press 7", description: "Missing guard", identified_by: "${a_id}" }, as: SafetyManager, as_user_id: "${m_id}", captures: { h_id: $.data.id } }
            - { call: "POST /safety/hazards/${h_id}/assess", payload: { severity: 4, probability: 4 }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/hazards/${h_id}/controls", payload: { description: "Fit interlock", implementer_id: "${a_id}", due_date: "2026-06-20T00:00:00Z" }, as: SafetyManager, as_user_id: "${m_id}", captures: { c_id: $.data.id } }
            - { call: "POST /safety/observations", payload: { program_id: "${p_id}", reporter_id: "${a_id}", kind: "OBSERVATION", description: "Guard off", occurred_at: "2026-05-30T00:00:00Z" }, as: Employee, as_user_id: "${a_id}", captures: { o1_id: $.data.id } }
            - { call: "POST /safety/observations", payload: { program_id: "${p_id}", reporter_id: "${a_id}", kind: "NEAR_MISS", description: "Hand nearly caught", occurred_at: "2026-05-30T00:00:00Z" }, as: Employee, as_user_id: "${a_id}", captures: { o2_id: $.data.id } }
            - { call: "POST /safety/observations/${o1_id}/triage", payload: { action: "LINK_EXISTING", hazard_id: "${h_id}" }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/observations/${o2_id}/triage", payload: { action: "LINK_EXISTING", hazard_id: "${h_id}" }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/controls/${c_id}/implement", payload: {}, as: Supervisor, as_user_id: "${a_id}" }
          trigger:
            - { call: "POST /safety/controls/${c_id}/verify", payload: { outcome: "PASS" }, as: SafetyManager, as_user_id: "${m_id}", captures: { c_status: $.data.status } }
            - { call: "GET /safety/hazards/${h_id}", payload: {}, as: SafetyManager, as_user_id: "${m_id}", captures: { h_status: $.data.status } }
            - { call: "GET /safety/observations/${o1_id}", payload: {}, as: SafetyManager, as_user_id: "${m_id}", captures: { o1_status: $.data.status } }
            - { call: "GET /safety/observations/${o2_id}", payload: {}, as: SafetyManager, as_user_id: "${m_id}", captures: { o2_status: $.data.status } }
            - { call: "GET /safety/incentive-events", payload: { program_id: "${p_id}", employee_id: "${a_id}", source_type: "NEAR_MISS_VALIDATED" }, as: EHSAdmin, captures: { nm_pts: "$.data[0].points_awarded" } }
          assert:
            - "ControlItem.status == VERIFIED (link 1)"
            - "Hazard.status == CLOSED (link 2: auto-close when last control verified)"
            - "Observation o1.status == CLOSED and o2.status == CLOSED (link 3: cascade from hazard close)"
            - "NEAR_MISS_VALIDATED event for A has points_awarded == 20 (link 4: event from observation close)"
            - "A's events in the program total 10 + 20 + 19 = 49 points (CONTROL_VERIFIED on time: round(15*1.0*1.25) = 19)"

      - name: sweep_posture_cascade
        grounds:
          - state_machines.ControlItem.PLANNED_to_OVERDUE
          - calculations.program_posture
          - entities.SafetyProgram.fields.posture
          - entities.SafetyProgram.fields.overdue_control_count
          - errors[ERR_PROGRAM_RESTRICTED]
        distinguishing_aspect: |
          Depth-3 chain from POST /safety/programs/{id}/sweep: PLANNED controls past due
          flip OVERDUE -> hazard and program overdue_control_count aggregates recompute ->
          posture flips RESTRICTED at >= 3 -> the RESTRICTED posture then gates a
          contractor APPROVE decision; trigger (sweep) differs from the verify cascade.
        test_recipe:
          setup:
            - "ACTIVE program; three hazards each assessed MEDIUM (3x2, SLA 30 days -> 2026-07-01) with one PLANNED control due 2026-06-10"
            - "Contractor submitted (score 80.00, band APPROVE) awaiting decide"
            - "Clock advanced to 2026-06-15: all three controls past due; no hazard SLA breach yet"
