  - rule_id: transitive_cascade
    instances:
      - name: incident_escalation_depth4_cascade
        grounds:
          - state_machines.IncidentReport.UNDER_REVIEW_to_ESCALATED
          - state_machines.Animal.ACTIVE_to_WELFARE_HOLD
          - state_machines.Certification.ACTIVE_to_SUSPENDED
          - state_machines.Visit.SCHEDULED_to_CANCELLED
          - state_machines.VisitRequest.ACCEPTED_to_OPEN
        distinguishing_aspect: |
          Trigger = incident escalate; depth 4 chain: incident escalation ->
          Animal WELFARE_HOLD (hop 1) -> Certification SUSPENDED (hop 2) ->
          SCHEDULED Visits CANCELLED (hop 3) -> request-backed VisitRequest
          returns to OPEN (hop 4). Each hop is caused by the previous hop's
          mutation, not by the original trigger.
        test_recipe:
          setup:
            - "Certified team t + ACTIVE facility f; visit v_done COMPLETED on 2026-08-03; request r ACCEPTED with backed visit v_req SCHEDULED for 2026-08-10T14:00:00Z-15:00:00Z"
