  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: unlisted_spot_vs_insufficient_wallet_prefers_state_over_fiscal
        grounds:
          - validations[priority=40]
          - validations[priority=50]
          - errors[ERR_SPOT_UNLISTED]
          - errors[ERR_INSUFFICIENT_WALLET]
        distinguishing_aspect: >-
          Category pair business_constraint(P40 ERR_SPOT_UNLISTED) vs business_fiscal(P50
          ERR_INSUFFICIENT_WALLET): a booking on an UNLISTED spot by a zero-wallet driver fails
          both, and the lower-priority-number P40 ERR_SPOT_UNLISTED wins.
        test_recipe:
          setup:
            - "Spot S9 UNLISTED; Driver D9 with wallet 0; booking attempt would also exceed wallet."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "h9@x.com", display_name: "H9", payout_account_ref: "pa_9" }
              as: Anonymous
              captures: { h9: $.data.id }
            - call: "POST /drivers"
              payload: { email: "d9@x.com", display_name: "D9" }
              as: Anonymous
              captures: { d9: $.data.id }
            - call: "POST /spots"
              payload: { host_id: "${h9}", title: "S9", zone_code: "Z9", base_hourly_cents: 400, base_daily_cents: 6000, monthly_flat_cents: 120000, availability_start: "2026-04-01T00:00:00Z", availability_end: "2026-05-01T00:00:00Z" }
              as: Host
              as_user_id: "${h9}"
              captures: { s9: $.data.id }
            - call: "POST /spots/${s9}/unlist"
              payload: {}
              as: Host
              as_user_id: "${h9}"
              captures: { s9v: $.data.version }
          trigger:
            - call: "POST /bookings"
              payload: { spot_id: "${s9}", driver_id: "${d9}", rate_kind: "HOURLY", start_at: "2026-04-20T10:00:00Z", end_at: "2026-04-20T11:00:00Z", expected_spot_version: "${s9v}" }
              as: Driver
              as_user_id: "${d9}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SPOT_UNLISTED"

      - name: invalid_window_vs_time_conflict_prefers_temporal_over_constraint
        grounds:
          - validations[priority=20]
          - validations[priority=30]
          - errors[ERR_INVALID_WINDOW]
          - errors[ERR_SPOT_TIME_CONFLICT]
        distinguishing_aspect: >-
          Category pair business_temporal(P20 ERR_INVALID_WINDOW) vs business_constraint(P30
          ERR_SPOT_TIME_CONFLICT): a request with end_at <= start_at AND a window that would also
          overlap an existing booking fails both; the lower-number P20 ERR_INVALID_WINDOW wins.
        test_recipe:
          setup:
            - "Spot S10 with an existing RESERVED Booking [10:00,12:00). New request has end_at<=start_at AND overlaps."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "h10@x.com", display_name: "H10", payout_account_ref: "pa_10" }
              as: Anonymous
              captures: { h10: $.data.id }
            - call: "POST /drivers"
              payload: { email: "d10@x.com", display_name: "D10" }
              as: Anonymous
              captures: { d10: $.data.id }
            - call: "POST /drivers/${d10}/wallet/topup"
              payload: { amount_cents: 5000 }
              as: Driver
              as_user_id: "${d10}"
            - call: "POST /spots"
              payload: { host_id: "${h10}", title: "S10", zone_code: "Z10", base_hourly_cents: 400, base_daily_cents: 6000, monthly_flat_cents: 120000, availability_start: "2026-04-01T00:00:00Z", availability_end: "2026-05-01T00:00:00Z" }
              as: Host
              as_user_id: "${h10}"
              captures: { s10: $.data.id, s10v: $.data.version }
            - call: "POST /bookings"
              payload: { spot_id: "${s10}", driver_id: "${d10}", rate_kind: "HOURLY", start_at: "2026-04-20T10:00:00Z", end_at: "2026-04-20T12:00:00Z", expected_spot_version: "${s10v}" }
              as: Driver
              as_user_id: "${d10}"
              captures: { b10: $.data.id }
            - call: "GET /spots/${s10}"
              payload: {}
              as: Host
              as_user_id: "${h10}"
              captures: { s10v2: $.data.version }
          trigger:
            - call: "POST /bookings"
              payload: { spot_id: "${s10}", driver_id: "${d10}", rate_kind: "HOURLY", start_at: "2026-04-20T11:00:00Z", end_at: "2026-04-20T11:00:00Z", expected_spot_version: "${s10v2}" }
              as: Driver
              as_user_id: "${d10}"
              captures: { err: $.data.error_id }
          assert:
