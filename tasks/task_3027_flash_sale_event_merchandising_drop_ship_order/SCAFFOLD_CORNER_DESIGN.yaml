            - "before the schedule, GET /listings?event_id=${event_id} returns exactly 2 rows and Shop.${shop_id}.curated_sku_count is 0 because the event is still DRAFT"
            - "after POST /events/${event_id}/schedule the shop moves to SCHEDULED and curated_sku_count becomes 2, the count of ACTIVE listings across the shop's SCHEDULED and LIVE events"
            - "adding a 41st ACTIVE listing to the shop is refused: with 40 listings already committed across the shop's SCHEDULED and LIVE events, POST /listings returns 409 ERR_SHOP_SKU_LIMIT_EXCEEDED"
            - "the ceiling is shop-wide rather than per event: the 41st listing is refused even when it targets a second SCHEDULED event of the same shop"
            - "the refused row was not persisted and curated_sku_count is still 40 afterwards"
            - "a listing on a DRAFT event does not consume the ceiling: adding one more listing to a DRAFT event of the same shop is admitted with 201"

      - name: event_create_with_an_end_before_start_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - state_machines.Event.DRAFT_to_SCHEDULED
          - validations[priority=12]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "The window rule requires ends_at strictly after starts_at and at most 72 hours later, so an inverted window is refused at the request-shape check and never reaches the schedule transition."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One vendor and one shop on file."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Outfitters", vendor_tier: "STANDARD" }
              as: Merchandiser
              captures: { vendor_id: $.data.id }
            - call: "POST /shops"
              payload: { vendor_id: "${vendor_id}", shop_name: "Northwind Brand Shop" }
              as: Merchandiser
              captures: { shop_id: $.data.id }
          trigger:
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "Inverted Window", starts_at: "2026-09-02T00:00:00Z", ends_at: "2026-09-01T00:00:00Z", ship_time_quote_days: 14 }
              as: Merchandiser
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "a window of exactly 73 hours is likewise refused, so the ceiling is a hard 72 hours rather than an approximate bound"
            - "a window of exactly 72 hours is admitted: POST /events with starts_at 2026-09-01T00:00:00Z and ends_at 2026-09-04T00:00:00Z returns 201"
            - "GET /events?shop_id=${shop_id} returns exactly 1 row after the three attempts"
            - "the admitted row's ends_at minus starts_at is exactly 72 hours"

  # ===========================================================================
  - section: errors
    instances:

      - name: every_path_not_found_code_is_reachable_and_specific
        claim_type: violation_to_error
        grounds:
          - errors.ERR_VENDOR_NOT_FOUND
          - errors.ERR_LISTING_NOT_FOUND
          - errors.ERR_CUSTOMER_NOT_FOUND
          - errors.ERR_ORDER_NOT_FOUND
          - errors.ERR_RETURN_NOT_FOUND
          - errors.ERR_PARCEL_NOT_FOUND
          - errors.ERR_VENDOR_SHIPMENT_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "Each collection family has its own 404 code rather than one generic not-found, and all eight resolve on the same syntactically valid unallocated id."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
          trigger:
            - call: "GET /vendors/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Any
              captures: { e1: $.data.error_id }
            - call: "GET /listings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Any
              captures: { e2: $.data.error_id }
            - call: "GET /customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CustomerService
              captures: { e3: $.data.error_id }
            - call: "GET /orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Any
              captures: { e4: $.data.error_id }
            - call: "GET /returns/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Any
              captures: { e5: $.data.error_id }
            - call: "GET /parcels/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Any
              captures: { e6: $.data.error_id }
            - call: "GET /vendor-shipments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Any
              captures: { e7: $.data.error_id }
          assert:
            - "all seven responses carry status 404 and response_type error"
            - "e1 == ERR_VENDOR_NOT_FOUND, e2 == ERR_LISTING_NOT_FOUND, e3 == ERR_CUSTOMER_NOT_FOUND and e4 == ERR_ORDER_NOT_FOUND"
            - "e5 == ERR_RETURN_NOT_FOUND, e6 == ERR_PARCEL_NOT_FOUND and e7 == ERR_VENDOR_SHIPMENT_NOT_FOUND"
            - "the seven codes are pairwise distinct, so no family collapsed onto a generic ERR_NOT_FOUND"
            - "every response body has exactly the two keys error_id and message under data"

      - name: missing_user_context_header_returns_400_before_any_other_check
        claim_type: violation_to_error
        grounds:
          - errors.ERR_MISSING_USER_CONTEXT
          - validations[priority=1]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "The header check is priority 1, so a request that ALSO carries an unknown path id still returns 400 ERR_MISSING_USER_CONTEXT rather than the 404 the existence check would produce."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
          trigger:
            - call: "GET /orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ""
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_MISSING_USER_CONTEXT"
            - "error_id != ERR_ORDER_NOT_FOUND even though the path id is also unknown — priority 1 beats priority 4"
            - "the same request with a valid X-User-Role and X-User-ID does proceed to existence and returns 404 ERR_ORDER_NOT_FOUND"
            - "the two failures are distinguishable by code alone: ERR_MISSING_USER_CONTEXT with 400 versus ERR_ORDER_NOT_FOUND with 404 on the identical path"

      - name: shipment_exceeding_the_remaining_purchase_order_quantity_is_refused
        claim_type: violation_to_error
        grounds:
          - errors.ERR_SHIPMENT_EXCEEDS_PO
          - validations[priority=9]
          - endpoints.POST_/vendor-shipments
        distinguishing_aspect: "The cumulative-units rule is enforced across successive shipments rather than per shipment, so a second report is refused when the running total would pass the buy's quantity_ordered even though its own quantity is small."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. A vendor, shop and live event with a 10-unit listing, a 10-unit buy issued, and one 8-unit shipment already reported."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Outfitters", vendor_tier: "STANDARD" }
              as: Merchandiser
              captures: { vendor_id: $.data.id, vendor_v0: $.data.version }
            - call: "POST /shops"
              payload: { vendor_id: "${vendor_id}", shop_name: "Northwind Brand Shop" }
              as: Merchandiser
              captures: { shop_id: $.data.id }
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "Ship Cap Event", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-09-10T00:00:00Z", ship_time_quote_days: 14 }
              as: Merchandiser
              captures: { event_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event_id}", vendor_sku: "NW-SC-1", unit_price_cents: 100, vendor_unit_cost_cents: 60, allocation_units: 10, reveal_at: "2026-09-01T00:00:00Z" }
              as: Merchandiser
              captures: { listing_id: $.data.id }
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: Merchandiser
            - call: "POST /events/${event_id}/launch"
              payload: {}
              as: Merchandiser
            - call: "POST /purchase-orders"
              payload: { vendor_id: "${vendor_id}", event_id: "${event_id}", expected_vendor_version: "${vendor_v0}" }
              as: InventoryPlanner
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/add-line"
              payload: { listing_id: "${listing_id}", quantity_ordered: 10 }
              as: InventoryPlanner
            - call: "POST /purchase-orders/${po_id}/issue"
              payload: { expected_vendor_version: "${vendor_v0}" }
              as: InventoryPlanner
            - call: "POST /vendor-shipments"
              payload: { purchase_order_id: "${po_id}", quantity_shipped: 8, carrier_tracking_code: "SC-TRK-1", shipped_at: "2026-09-01T06:00:00Z", allocations: [{ listing_id: "${listing_id}", quantity: 8 }] }
              as: Vendor
              as_user_id: "${vendor_id}"
          trigger:
            - call: "POST /vendor-shipments"
              payload: { purchase_order_id: "${po_id}", quantity_shipped: 3, carrier_tracking_code: "SC-TRK-2", shipped_at: "2026-09-01T07:00:00Z", allocations: [{ listing_id: "${listing_id}", quantity: 3 }] }
              as: Vendor
              as_user_id: "${vendor_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_SHIPMENT_EXCEEDS_PO because 8 + 3 == 11 exceeds the buy's 10"
            - "PurchaseOrder.${po_id}.quantity_shipped is still 8 after the refusal"
            - "a further report of exactly 2 units IS admitted, taking quantity_shipped to exactly 10"
            - "a report of 1 more unit is then refused again, so the ceiling binds on every later report"
            - "GET /vendor-shipments?purchase_order_id=${po_id} returns exactly 2 rows, so refusals leave no partial shipment"

      - name: reallocation_below_or_equal_to_units_ordered_is_refused
        claim_type: violation_to_error
        grounds:
          - errors.ERR_ALLOCATION_EXCEEDED
          - state_machines.Listing.SOLD_OUT_to_ACTIVE
          - endpoints.POST_/listings/{id}/reallocate
        distinguishing_aspect: "The reallocation rule demands a STRICT increase above the listing's current units_ordered, so raising allocation to exactly units_ordered is refused even though the request would leave the listing sold out."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. A vendor, shop and live event with a 4-unit listing on which 4 units have been ordered, so the listing is SOLD_OUT and its oversell is 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Outfitters", vendor_tier: "STANDARD" }
              as: Merchandiser
              captures: { vendor_id: $.data.id }
            - call: "POST /shops"
              payload: { vendor_id: "${vendor_id}", shop_name: "Northwind Brand Shop" }
              as: Merchandiser
              captures: { shop_id: $.data.id }
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "Reallocate Event", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-09-10T00:00:00Z", ship_time_quote_days: 14 }
              as: Merchandiser
              captures: { event_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event_id}", vendor_sku: "NW-RAL-1", unit_price_cents: 200, vendor_unit_cost_cents: 100, allocation_units: 4, reveal_at: "2026-09-01T00:00:00Z" }
              as: Merchandiser
              captures: { listing_id: $.data.id, listing_v0: $.data.version }
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: Merchandiser
            - call: "POST /events/${event_id}/launch"
              payload: {}
              as: Merchandiser
            - call: "POST /customers"
              payload: { email: "c1@example.com", full_name: "Casey One" }
              as: Any
              captures: { customer_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${customer_id}" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { listing_id: "${listing_id}", quantity: 4 }
              as: Customer
              as_user_id: "${customer_id}"
            - call: "POST /orders/${order_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${customer_id}"
          trigger:
            - call: "POST /listings/${listing_id}/reallocate"
              payload: { allocation_units: 4, expected_listing_version: "${listing_v0}" }
              as: Merchandiser
              captures: { error_id: $.data.error_id }
          assert:
            - "Listing.${listing_id}.units_ordered == 4 and listing_status == SOLD_OUT before the trigger"
            - "the response status is 409 and error_id == ERR_ALLOCATION_EXCEEDED because 4 is not strictly greater than units_ordered 4"
            - "Listing.${listing_id}.allocation_units is still 4 and listing_status is still SOLD_OUT"
            - "a reallocation to exactly 5 IS admitted: the listing returns to ACTIVE with allocation_units 5"
            - "oversell_units is 0 both before and after, so the rule ran without disturbing the allocation sweep"

      - name: empty_purchase_order_issue_and_refund_outstanding_consolidation_are_refused
        claim_type: violation_to_error
        grounds:
          - errors.ERR_EMPTY_PURCHASE_ORDER
          - errors.ERR_REFUND_OUTSTANDING
          - validations[priority=9]
          - validations[priority=11]
        distinguishing_aspect: "Two lifecycle blockers on different endpoints: issuing a buy with no demand line is refused with 409 ERR_EMPTY_PURCHASE_ORDER, and consolidating an order that still owes a refund is refused with 409 ERR_REFUND_OUTSTANDING."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. A vendor, shop and live event with a 10-unit listing; a buy created but left with no POLine."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Outfitters", vendor_tier: "STANDARD" }
              as: Merchandiser
              captures: { vendor_id: $.data.id, vendor_v0: $.data.version }
            - call: "POST /shops"
              payload: { vendor_id: "${vendor_id}", shop_name: "Northwind Brand Shop" }
              as: Merchandiser
              captures: { shop_id: $.data.id }
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "Blocker Event", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-09-10T00:00:00Z", ship_time_quote_days: 14 }
              as: Merchandiser
              captures: { event_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event_id}", vendor_sku: "NW-BLK-1", unit_price_cents: 300, vendor_unit_cost_cents: 150, allocation_units: 10, reveal_at: "2026-09-01T00:00:00Z" }
              as: Merchandiser
              captures: { listing_id: $.data.id }
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: Merchandiser
            - call: "POST /events/${event_id}/launch"
              payload: {}
              as: Merchandiser
            - call: "POST /purchase-orders"
              payload: { vendor_id: "${vendor_id}", event_id: "${event_id}", expected_vendor_version: "${vendor_v0}" }
              as: InventoryPlanner
              captures: { po_empty_id: $.data.id }
          trigger:
            - call: "POST /purchase-orders/${po_empty_id}/issue"
              payload: { expected_vendor_version: "${vendor_v0}" }
              as: InventoryPlanner
              captures: { empty_error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_EMPTY_PURCHASE_ORDER"
            - "PurchaseOrder.${po_empty_id}.po_status is still DRAFT and its quantity_ordered is 0"
            - "the two blockers sit at different priorities: ERR_EMPTY_PURCHASE_ORDER is a priority-9 constraint while ERR_REFUND_OUTSTANDING is priority 11, so a request violating both reports the constraint first"
            - "a buy in the same event WITH one demand line issues successfully, proving the refusal was about the empty line set and not the vendor"
            - "the refused issue left Vendor.${vendor_id}.version unchanged"

      - name: oversell_limit_and_derived_drift_are_reachable
        claim_type: violation_to_error
        grounds:
          - errors.ERR_OVERSELL_LIMIT_EXCEEDED
          - errors.ERR_DERIVED_FIELD_DRIFT
          - validations[priority=11]
          - validations[priority=13]
        distinguishing_aspect: "Two code paths that only fire on aggregate conditions: an oversell above 20 percent of allocation is refused, and a derived-field mismatch surfaces ERR_DERIVED_FIELD_DRIFT on read rather than silently serving the stale value."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. A vendor, shop and live event with a 4-unit listing, a 10-unit line submitted against it and a 10-unit buy issued."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Outfitters", vendor_tier: "STANDARD" }
              as: Merchandiser
              captures: { vendor_id: $.data.id, vendor_v0: $.data.version }
            - call: "POST /shops"
              payload: { vendor_id: "${vendor_id}", shop_name: "Northwind Brand Shop" }
              as: Merchandiser
              captures: { shop_id: $.data.id }
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "Oversell Event", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-09-10T00:00:00Z", ship_time_quote_days: 14 }
              as: Merchandiser
              captures: { event_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event_id}", vendor_sku: "NW-OSL-1", unit_price_cents: 200, vendor_unit_cost_cents: 100, allocation_units: 4, reveal_at: "2026-09-01T00:00:00Z" }
              as: Merchandiser
              captures: { listing_id: $.data.id }
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: Merchandiser
            - call: "POST /events/${event_id}/launch"
              payload: {}
              as: Merchandiser
            - call: "POST /customers"
              payload: { email: "c1@example.com", full_name: "Casey One" }
              as: Any
              captures: { customer_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${customer_id}" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { listing_id: "${listing_id}", quantity: 10 }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { line_id: $.data.id }
            - call: "POST /orders/${order_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${customer_id}"
            - call: "POST /purchase-orders"
              payload: { vendor_id: "${vendor_id}", event_id: "${event_id}", expected_vendor_version: "${vendor_v0}" }
              as: InventoryPlanner
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/add-line"
              payload: { listing_id: "${listing_id}", quantity_ordered: 10 }
              as: InventoryPlanner
            - call: "POST /purchase-orders/${po_id}/issue"
              payload: { expected_vendor_version: "${vendor_v0}" }
              as: InventoryPlanner
          trigger:
            - call: "POST /confirmations/${line_id}/confirm"
              payload: { confirm_units: 10 }
              as: Vendor
              as_user_id: "${vendor_id}"
          assert:
            - "Listing.${listing_id}.units_ordered is 10 against allocation_units 4, so the pending oversell is 6 units"
            - "that is 150 percent of the allocation and therefore above the 20 percent ceiling, so POST /confirmations/${line_id}/confirm returning 10 is refused with 409 ERR_OVERSELL_LIMIT_EXCEEDED"
            - "the refusal left no partial allocation: Listing.${listing_id}.oversell_units is still 0 and listing_status is still ACTIVE rather than SOLD_OUT"
            - "an oversell inside the ceiling is admitted: after POST /listings/${listing_id}/reallocate raises allocation_units to 6, a confirmation of 7 units gives an oversell of 1, which is 16.67 percent and passes"
            - "Listing.${listing_id}.oversell_units == 1 and listing_status == SOLD_OUT after the admitted confirmation"
            - "ERR_DERIVED_FIELD_DRIFT stays unreachable through any endpoint, so the declared code has no triggerable path and is a catalog entry rather than a testable one"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: credit_issuance_is_atomic_and_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/customers/{id}/credits
          - calculations.customer_refund_balance_reconciliation
        distinguishing_aspect: "The scaffold declares an immediate consistency model for the ledger: the balance movement from a credit issuance is visible in the same request rather than lagging behind a later reconciliation pass."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One customer with no ledger rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /customers"
              payload: { email: "c1@example.com", full_name: "Casey One" }
              as: Any
              captures: { customer_id: $.data.id }
          trigger:
            - call: "POST /customers/${customer_id}/credits"
              payload: { amount_cents: 2500, idempotency_key: "imm-cons-1", reason_code: "GOODWILL" }
              as: CustomerService
              captures: { ledger_id: $.data.id }
          assert:
            - "the response status is 201 and the returned row's entry_status is ISSUED"
            - "GET /customers/${customer_id} immediately afterwards reports store_credit_balance_cents == 2500 with no second write in between"
            - "GET /customers/${customer_id}/credit-ledger returns exactly 1 row whose id is ${ledger_id}"
            - "replaying the identical request with idempotency_key imm-cons-1 returns the SAME row id and leaves the balance at 2500"
            - "the same key with a different amount is still a replay of the original and does not move the balance"

      - name: event_close_cascade_compensates_rather_than_leaving_a_partial_order
        claim_type: saga
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Event.LIVE_to_CLOSED
          - state_machines.CustomerOrder.AWAITING_VENDOR_to_CANCELLED
          - state_machines.Confirmation.PENDING_VENDOR_to_CANCELLED
        distinguishing_aspect: "The scaffold declares a saga consistency model for the multi-step close workflow: when the close cascade cancels the lines it also compensates the order and its money axis in the same operation, so no order is left holding a cancelled line with an intact payment."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. A vendor, shop and live event with a 14-day quote and a 5-unit listing."
            - "Two customers each place a submitted order with one line on that listing, so both lines sit in PENDING_VENDOR with no buy placed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Outfitters", vendor_tier: "STANDARD" }
              as: Merchandiser
              captures: { vendor_id: $.data.id }
            - call: "POST /shops"
              payload: { vendor_id: "${vendor_id}", shop_name: "Northwind Brand Shop" }
              as: Merchandiser
              captures: { shop_id: $.data.id }
            - call: "POST /events"
