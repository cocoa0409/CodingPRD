              as: FranchiseeOwner
              captures: { rep1_id: $.data.id }
            - call: "POST /offices/${office_id}/retention-reports/compute"
              payload: { period_month: "2026-09", report_variant: "CHURN" }
              as: FranchiseeOwner
              captures: { rep2_id: $.data.id }
          assert:
            - "the first report computes headcount_start == 1, headcount_end == 1, retention_bps == 10000, churned_agent_count == 0"
            - "after the second compute, AgentRetentionReport.${rep1_id}.status == ARCHIVED and ${rep2_id}.status == COMPUTED"
            - "GET /offices/${office_id}/retention-reports?status=COMPUTED returns exactly 1 row"

