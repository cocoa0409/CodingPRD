              as_user_id: "co_1"
            - call: "POST /technicians/${tech_id}/suspend"
              payload: { reason: "DOC_MISMATCH" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /technicians/${tech_id}/revoke"
              payload: { reason: "FRAUD" }
              as: ComplianceOfficer
              as_user_id: "co_1"
          assert:
