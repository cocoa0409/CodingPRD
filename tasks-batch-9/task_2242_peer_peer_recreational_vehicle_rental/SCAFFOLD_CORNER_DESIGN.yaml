      - name: nightly_rounding_happens_once_per_night
        claim_type: precision
        grounds:
          - calculations.booking_nightly_subtotal
          - entities.Booking.fields.base_subtotal_cents
        excluded_because:
          difficulty_instance: boundary_precision_check / nightly_subtotal_rounds_per_night_not_once_at_the_end
          rationale: >-
            The named §1.8 instance pins 110896 against the 110895 that
            round-once-at-the-end produces, which is precisely this precision
            claim.

      - name: late_return_fee_threshold_and_cap
        claim_type: threshold
        grounds:
          - calculations.late_return_fee
          - entities.Booking.fields.late_return_fee_cents
        excluded_because:
          difficulty_instance: boundary_precision_check / late_return_grace_admits_exactly_sixty_minutes_and_bills_at_sixty_one
          rationale: >-
            The named §1.8 instance tests the grace boundary at exactly 60 and
            61 minutes and the LATE_FEE_CAP_BP ceiling, covering the threshold
            algorithm's boundary claims.

      - name: ledger_aggregate_survives_add_and_reversal
        claim_type: aggregation
        grounds:
          - calculations.booking_ledger_conservation
          - calculations.settlement_ledger_posting
        excluded_because:
          difficulty_instance: compensating_invariant / settlement_reversal_restores_every_derived_money_field_and_keeps_the_ledger_at_zero
          rationale: >-
            The named §1.8 instance asserts the running ledger sum is 0 after the
            forward posting and still 0 after the reversal doubles the row count,
            which is the aggregation add/reverse claim.

      - name: waitlist_promotion_processes_candidates_in_created_at_order
        claim_type: chronological
        grounds:
          - calculations.dropoff_waitlist_promotion
          - state_machines.DeliveryAssignment.transitions.WAITLISTED_to_SCHEDULED
        excluded_because:
          difficulty_instance: transitive_cascade / trip_start_promotes_a_waitlisted_dropoff_and_re_debits_the_other_renters_hold
          rationale: >-
            The named §1.8 instance drives the promotion selector end to end,
            including its created_at ASC ordering and the downstream hold
            re-debit, covering the chronological algorithm's ordering claim.

      - name: loyalty_band_straddling_at_the_tier_2_boundary
        claim_type: tiered_pricing
        grounds:
          - calculations.booking_quote_total
          - entities.Booking.fields.loyalty_tier
        excluded_because:
          difficulty_instance: combinatorial_formula / quote_mode_campground_dropoff_delivery_term_crosses_into_tier_2
          rationale: >-
            The named §1.8 instance shows the same booking crossing from
            LOYALTY_TIER_1 to LOYALTY_TIER_2 when the delivery term enters
            pre_discount_cents, which is the cross-tier straddling claim.

      - name: quote_chain_reaches_a_fixed_point_without_self_reference
        claim_type: constraint_propagation
        grounds:
          - calculations.booking_quote_total
        excluded_because:
          difficulty_instance: combinatorial_formula / quote_mode_pickup_tier_keyed_on_pre_discount_not_grand_total
          rationale: >-
            The named §1.8 instance pins the six-step evaluation order and proves
            the tier key is pre_discount_cents rather than the grand total, which
            is the propagation-to-fixed-point claim.

      - name: premium_weighting_terms_do_not_drift_under_the_cap
        claim_type: weighted_scoring
        grounds:
          - calculations.protection_premium
        excluded_because:
          difficulty_instance: combinatorial_formula / premium_mode_coverage_ceiling_cap_binds_the_min
          rationale: >-
            The named §1.8 instance drives the premium formula into the branch
            where the coverage-ceiling cap binds the outer min, covering the
            weighted-scoring claim that the terms compose without drift.

      - name: record_points_variants_disagree_on_the_same_rows
        claim_type: variant_divergence
        grounds:
          - calculations.renter_driving_record_points.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / driving_record_rolling_36m_gate_vs_most_recent_only_snapshot
          rationale: >-
            The named §1.8 instance reads 6 from ROLLING_36M and 2 from
            MOST_RECENT_ONLY over one identical set of qualification rows.

      - name: overage_variant_selection_by_context
        claim_type: variant_selection
        grounds:
          - calculations.metered_overage.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / metered_overage_segment_wise_bills_where_trip_total_reports_zero
          rationale: >-
            The named §1.8 instance asserts that final_overage_cents takes the
            SEGMENT_WISE variant while trip_total_overage_cents takes TRIP_TOTAL
            on the same return call.

      - name: overage_variant_switch_reconciles_the_hold
        claim_type: reconciliation
        grounds:
          - calculations.metered_overage.variants
          - entities.Booking.fields.balance_due_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / variant_switch_from_declared_estimate_to_segment_wise_yields_refund
          rationale: >-
            The named §1.8 instance switches the declared-estimate variant for
            the measured SEGMENT_WISE variant at return and asserts the resulting
            negative balance_due_cents / refund delta.

  # ===========================================================================
  - section: validations
