        distinguishing_aspect: "The two ACKNOWLEDGED exits are a genuine fork: LANE_OPENED stores resolved_lane_id and leaves diverted_pax_total alone, MITIGATED_BY_DIVERSION adds to diverted_pax_total and leaves resolved_lane_id null. An implementation that shares one resolve handler will move both counters."
        test_recipe:
          setup:
