  - rule_id: compensating_invariant
    instances:
      - name: slot_supersede_credits_line_committed_days_ledger
        grounds:
          - calculations.line_committed_days_ledger
          - calculations.slot_days_and_end_date
          - endpoints[POST /packaging-oem/build-slots]
          - state_machines.BuildSlot.transitions[RESERVED -> RELEASED]
          - entities.ProductionLine.fields.committed_slot_days
          - entities.BuildSlot.fields.superseded_by_slot_id
        distinguishing_aspect: |
          Conserved quantity: PRODUCTION-LINE CAPACITY DAYS. Re-slotting an order must never double
          count: the superseding create both debits the new 15 days and credits back the superseded
          slot's 20 days in the same request, so committed_slot_days lands on 15 and not 35. The
          released slot keeps its own slot_days as history, which is exactly why a naive
          "add the new slot's days" implementation drifts.
        test_recipe:
          setup:
            - "ProductionLine LINE-A OPEN, changeover_buffer_days 5, capacity_days_per_quarter 120"
            - "Order ENGINEERED (rework_days 0) with one RESERVED slot [2026-08-06, 2026-08-26), slot_days 20"
            - "ProductionLine.committed_slot_days is 20 before the trigger"
