            - call: "POST /inspection-stations/${st_id}/status"
              payload: { target_status: "OPEN" }
              as: ProgramAdmin
            - call: "POST /inspectors"
              payload: { full_name: "Ada Field", home_station_id: "${st_id}" }
              as: ProgramAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /inspectors/${insp_a}/training-records"
              payload: { module_code: "AIS-101", hours: 8, passed: true }
              as: TrainingOfficer
            - call: "POST /inspectors"
              payload: { full_name: "Ben Rinse", home_station_id: "${st_id}", decon_endorsement: true }
              as: ProgramAdmin
              captures: { insp_b: $.data.id }
            - call: "POST /inspectors/${insp_b}/training-records"
              payload: { module_code: "AIS-DECON-200", hours: 40, passed: true }
              as: TrainingOfficer
            - call: "POST /inspectors"
              payload: { full_name: "Cara Dock", home_station_id: "${st_id}" }
              as: ProgramAdmin
              captures: { insp_c: $.data.id }
            - call: "POST /inspectors/${insp_c}/training-records"
              payload: { module_code: "AIS-201", hours: 40, passed: true }
              as: TrainingOfficer
          trigger:
            - call: "POST /inspectors/${insp_c}/status"
              payload: { target_status: "SUSPENDED", reason: "pending internal review" }
              as: ProgramAdmin
          assert:
            - "the trigger returns 200 with data.status == SUSPENDED and data.certification_level == LEVEL_2 - suspension does not strip the credited level"
            - "GET /inspection-stations/${st_id} shows certified_inspector_count == 1 and decon_service_available == false, because 1 < CERTIFIED_INSPECTOR_DECON_THRESHOLD 2"
            - "before the trigger the same read showed certified_inspector_count == 2 and decon_service_available == true"
            - "control: suspending insp_a (LEVEL_1, never counted) leaves certified_inspector_count == 1 and decon_service_available == false unchanged, so the cascade is keyed on {LEVEL_2, DECON_CERTIFIED} and not on headcount"
            - "control: POST /inspectors/${insp_c}/status with target_status ACTIVE returns 200 and restores certified_inspector_count == 2 and decon_service_available == true, closing the ACTIVE -> SUSPENDED -> ACTIVE loop"
            - "hot_water_capable stays true throughout: decon_service_available is a conjunction, and only its staffing operand moved"

