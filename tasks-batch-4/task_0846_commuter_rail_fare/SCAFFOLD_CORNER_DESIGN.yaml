scaffold_corner_design:

  # =================================================================
  - section: entities
    instances:
      - name: passenger_creation_returns_system_fields
        claim_type: system_fields
        grounds: [entities.Passenger.email, entities.Passenger.evasion_count]
        distinguishing_aspect: "POST /passengers returns 201 with server-minted id, created_at, version==1, and defaults wallet_credit_cents==0 and evasion_count==0."
        test_recipe:
          setup: ["Empty DB; clock at default."]
          setup_api_calls:
            - call: "POST /passengers"
              payload: { email: "sys@x.com", full_name: "Sys", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id, v: $.data.version }
          trigger:
            - call: "GET /passengers/${pax}"
              payload: {}
              as: FareAdmin
          assert:
            - "Passenger.${pax}.version == 1"
            - "Passenger.${pax}.wallet_credit_cents == 0"
            - "Passenger.${pax}.evasion_count == 0"
            - "Passenger.${pax}.reduced_fare_category == NONE"

      - name: passenger_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Passenger.email, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /passengers with email omitted is rejected with ERR_INVALID_REQUEST (422); no passenger is created."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /passengers"
              payload: { full_name: "NoEmail", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: get_ticket_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Ticket.passenger_id, "errors[ERR_TICKET_NOT_FOUND]"]
        distinguishing_aspect: "GET /tickets/{unknown-uuid} returns ERR_TICKET_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /tickets/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FareAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_TICKET_NOT_FOUND"
            - "HTTP status == 404"

      - name: fare_product_apportionment_method_defaults_zone_count
        claim_type: defaults
        grounds: [entities.FareProduct.apportionment_method]
        distinguishing_aspect: "POST /fare-products omitting apportionment_method applies the default ZONE_COUNT."
        test_recipe:
          setup: ["Empty DB; clock default."]
          setup_api_calls: []
          trigger:
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 3, ticket_type: "SINGLE", base_fare_cents: 1000, peak_surcharge_cents: 300 }
              as: FareAdmin
              captures: { fp: $.data.id }
          assert:
            - "FareProduct.${fp}.apportionment_method == ZONE_COUNT"

      - name: inspection_evasion_result_computed_no_ticket
        claim_type: computed_fields
        grounds: [entities.Inspection.result, entities.Inspection.fare_shortfall_cents]
        distinguishing_aspect: "POST /inspections with no ticket_id computes result EVASION and fare_shortfall_cents==1000 (EVASION_FARE_ESTIMATE_CENTS)."
        test_recipe:
          setup: ["Clock 2026-03-01. Passenger exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /passengers"
              payload: { email: "ev@x.com", full_name: "Ev", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id }
          trigger:
            - call: "POST /inspections"
              payload: { passenger_id: "${pax}", observed_destination_zone: 3 }
              as: Conductor
              captures: { insp: $.data.id }
          assert:
            - "Inspection.${insp}.result == EVASION"
            - "Inspection.${insp}.fare_shortfall_cents == 1000"

      - name: disruption_severity_computed_major
        claim_type: computed_fields
        grounds: [entities.ServiceDisruption.delay_minutes, entities.ServiceDisruption.severity]
        distinguishing_aspect: "A disruption with a 45-minute delay computes delay_minutes==45 and severity==MAJOR."
        test_recipe:
          setup: ["Clock 2026-03-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
          trigger:
            - call: "POST /service-disruptions"
              payload: { line_code: "S1", scheduled_departure: "2026-03-02T08:00:00Z", actual_departure: "2026-03-02T08:45:00Z", window_start: "2026-03-02T08:00:00Z", window_end: "2026-03-02T09:00:00Z" }
              as: FareAdmin
              captures: { dis: $.data.id }
          assert:
            - "ServiceDisruption.${dis}.delay_minutes == 45"
            - "ServiceDisruption.${dis}.severity == MAJOR"

  # =================================================================
  - section: state_machines
    instances:
      - name: validate_purchased_ticket_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Ticket.ACTIVATED_to_VALIDATED, "errors[ERR_INVALID_TICKET_STATE]"]
        distinguishing_aspect: "Scan-validating a ticket that is still PURCHASED (never activated) is rejected with ERR_INVALID_TICKET_STATE (409)."
        test_recipe:
          setup: ["Clock 2026-03-01. FareProduct SINGLE (1->3). Passenger buys a ticket (PURCHASED, not activated)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 3, ticket_type: "SINGLE", base_fare_cents: 1000, peak_surcharge_cents: 300, apportionment_method: "ZONE_COUNT" }
              as: FareAdmin
              captures: { fp: $.data.id }
            - call: "POST /passengers"
              payload: { email: "st@x.com", full_name: "St", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id }
            - call: "POST /tickets"
              payload: { passenger_id: "${pax}", fare_product_id: "${fp}", travel_period: "PEAK" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { tkt: $.data.id }
          trigger:
            - call: "POST /tickets/${tkt}/validate"
              payload: {}
              as: Passenger
              as_user_id: "${pax}"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_TICKET_STATE"
            - "HTTP status == 409"

      - name: pay_dismissed_citation_returns_invalid_state
        claim_type: terminal_state
        grounds: [state_machines.Citation.CONTESTED_to_DISMISSED, "errors[ERR_INVALID_CITATION_STATE]"]
        distinguishing_aspect: "Paying a citation already in terminal DISMISSED is rejected with ERR_INVALID_CITATION_STATE (409)."
        test_recipe:
          setup: ["Clock 2026-03-01. Passenger with an EVASION citation that is contested and DISMISSED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /passengers"
              payload: { email: "dm@x.com", full_name: "Dm", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id }
            - call: "POST /inspections"
              payload: { passenger_id: "${pax}", observed_destination_zone: 3 }
              as: Conductor
              captures: { insp: $.data.id }
            - call: "POST /citations"
              payload: { inspection_id: "${insp}", passenger_id: "${pax}" }
              as: Conductor
              captures: { cit: $.data.id }
            - call: "POST /citations/${cit}/contest"
              payload: { grounds: "g" }
              as: Passenger
              as_user_id: "${pax}"
            - call: "POST /citations/${cit}/resolve"
              payload: { decision: "DISMISSED" }
              as: FareAdmin
          trigger:
            - call: "POST /citations/${cit}/pay"
              payload: {}
              as: Passenger
              as_user_id: "${pax}"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_CITATION_STATE"
            - "HTTP status == 409"

      - name: refund_approve_twice_second_returns_invalid_refund_state
        claim_type: idempotency
        grounds: [state_machines.RefundRequest.REQUESTED_to_APPROVED, "errors[ERR_INVALID_REFUND_STATE]"]
        distinguishing_aspect: "Approving an already-APPROVED refund request a second time is rejected with ERR_INVALID_REFUND_STATE (409)."
        test_recipe:
          setup: ["Clock 2026-03-01. FareProduct SINGLE (1->3). Passenger buys, requests WALLET refund, admin approves once."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 3, ticket_type: "SINGLE", base_fare_cents: 1000, peak_surcharge_cents: 300, apportionment_method: "ZONE_COUNT" }
              as: FareAdmin
              captures: { fp: $.data.id }
            - call: "POST /passengers"
              payload: { email: "id@x.com", full_name: "Id", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id }
            - call: "POST /tickets"
              payload: { passenger_id: "${pax}", fare_product_id: "${fp}", travel_period: "PEAK" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { tkt: $.data.id }
            - call: "POST /refund-requests"
              payload: { ticket_id: "${tkt}", reason: "x", refund_destination: "WALLET" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { rr: $.data.id }
            - call: "POST /refund-requests/${rr}/approve"
              payload: {}
              as: FareAdmin
          trigger:
            - call: "POST /refund-requests/${rr}/approve"
              payload: {}
              as: FareAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_REFUND_STATE"
            - "HTTP status == 409"

  # =================================================================
  - section: validations
    instances:
      - name: refund_on_validated_ticket_returns_not_refundable
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_TICKET_NOT_REFUNDABLE]"]
        distinguishing_aspect: "A SINGLE ticket that has been activated and scan-validated (VALIDATED terminal) cannot be refunded: POST /refund-requests returns ERR_TICKET_NOT_REFUNDABLE (409)."
        test_recipe:
          setup: ["Clock 2026-03-01. FareProduct SINGLE (1->3). Passenger buys, activates, and validates a ticket."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 3, ticket_type: "SINGLE", base_fare_cents: 1000, peak_surcharge_cents: 300, apportionment_method: "ZONE_COUNT" }
              as: FareAdmin
              captures: { fp: $.data.id }
            - call: "POST /passengers"
              payload: { email: "nr@x.com", full_name: "Nr", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id }
            - call: "POST /tickets"
              payload: { passenger_id: "${pax}", fare_product_id: "${fp}", travel_period: "PEAK" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { tkt: $.data.id }
            - call: "POST /tickets/${tkt}/activate"
              payload: {}
              as: Passenger
              as_user_id: "${pax}"
            - call: "POST /tickets/${tkt}/validate"
              payload: {}
              as: Passenger
              as_user_id: "${pax}"
          trigger:
            - call: "POST /refund-requests"
              payload: { ticket_id: "${tkt}", reason: "x", refund_destination: "WALLET" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_TICKET_NOT_REFUNDABLE"
            - "HTTP status == 409"

      - name: approve_senior_under_age_returns_age_not_met
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_SENIOR_AGE_NOT_MET]", state_machines.ReducedFareApplication.SUBMITTED_to_APPROVED]
        distinguishing_aspect: "Approving a SENIOR application for a passenger aged 26 at the clock is rejected with ERR_SENIOR_AGE_NOT_MET (422)."
        test_recipe:
          setup: ["Clock 2026-03-01. Passenger dob 2000-01-01 submits a SENIOR application."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /passengers"
              payload: { email: "sr@x.com", full_name: "Sr", date_of_birth: "2000-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id, pv0: $.data.version }
            - call: "POST /reduced-fare-applications"
              payload: { passenger_id: "${pax}", category: "SENIOR", proof_document_ref: "d", proof_expires_at: "2027-01-01T00:00:00Z", expected_passenger_version: "${pv0}" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { app: $.data.id }
          trigger:
            - call: "POST /reduced-fare-applications/${app}/approve"
              payload: {}
              as: FareAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_SENIOR_AGE_NOT_MET"
            - "HTTP status == 422"

      - name: validate_after_expiry_returns_ticket_expired
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_TICKET_EXPIRED]"]
        distinguishing_aspect: "Scan-validating a SINGLE ticket after its 90-minute window (clock advanced to 02:00 vs expiry 01:30) is rejected with ERR_TICKET_EXPIRED (409)."
        test_recipe:
          setup: ["Clock 2026-03-01T00:00. FareProduct SINGLE (1->3). Passenger buys+activates (expires 01:30); clock advanced to 02:00."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 3, ticket_type: "SINGLE", base_fare_cents: 1000, peak_surcharge_cents: 300, apportionment_method: "ZONE_COUNT" }
              as: FareAdmin
              captures: { fp: $.data.id }
            - call: "POST /passengers"
              payload: { email: "ex@x.com", full_name: "Ex", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id }
            - call: "POST /tickets"
              payload: { passenger_id: "${pax}", fare_product_id: "${fp}", travel_period: "PEAK" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { tkt: $.data.id }
            - call: "POST /tickets/${tkt}/activate"
              payload: {}
              as: Passenger
              as_user_id: "${pax}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T02:00:00Z" }
              as: FareAdmin
          trigger:
            - call: "POST /tickets/${tkt}/validate"
              payload: {}
              as: Passenger
              as_user_id: "${pax}"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_TICKET_EXPIRED"
            - "HTTP status == 409"

      - name: refund_after_window_returns_window_elapsed
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_REFUND_WINDOW_ELAPSED]"]
        distinguishing_aspect: "Requesting a refund for a still-PURCHASED ticket more than 60 days after purchase (clock advanced to 2026-06-01) is rejected with ERR_REFUND_WINDOW_ELAPSED (409)."
        test_recipe:
          setup: ["Clock 2026-03-01. FareProduct SINGLE (1->3). Passenger buys; clock advanced to 2026-06-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 3, ticket_type: "SINGLE", base_fare_cents: 1000, peak_surcharge_cents: 300, apportionment_method: "ZONE_COUNT" }
              as: FareAdmin
              captures: { fp: $.data.id }
            - call: "POST /passengers"
              payload: { email: "rw@x.com", full_name: "Rw", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id }
            - call: "POST /tickets"
              payload: { passenger_id: "${pax}", fare_product_id: "${fp}", travel_period: "PEAK" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { tkt: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FareAdmin
          trigger:
            - call: "POST /refund-requests"
              payload: { ticket_id: "${tkt}", reason: "late", refund_destination: "ORIGINAL" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_REFUND_WINDOW_ELAPSED"
            - "HTTP status == 409"

      - name: upgrade_ticket_mismatch_returns_error
        claim_type: cross_entity_validation
        grounds: ["validations[priority=6]", "errors[ERR_UPGRADE_TICKET_MISMATCH]"]
        distinguishing_aspect: "An upgrade whose ticket_id does not equal the inspection's ticket_id is rejected with ERR_UPGRADE_TICKET_MISMATCH (409) before any upgrade fare is computed."
        test_recipe:
          setup: ["Clock 2026-03-01. FareProduct SINGLE (1->3). Passenger buys two tickets A and B; A is activated. Inspection on A with observed zone 5 (UPGRADE_REQUIRED)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 3, ticket_type: "SINGLE", base_fare_cents: 1000, peak_surcharge_cents: 300, apportionment_method: "ZONE_COUNT" }
              as: FareAdmin
              captures: { fp: $.data.id }
            - call: "POST /passengers"
              payload: { email: "mm@x.com", full_name: "Mm", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id }
            - call: "POST /tickets"
              payload: { passenger_id: "${pax}", fare_product_id: "${fp}", travel_period: "PEAK" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { tkt_a: $.data.id }
            - call: "POST /tickets"
              payload: { passenger_id: "${pax}", fare_product_id: "${fp}", travel_period: "PEAK" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { tkt_b: $.data.id }
            - call: "POST /tickets/${tkt_a}/activate"
              payload: {}
              as: Passenger
              as_user_id: "${pax}"
            - call: "POST /inspections"
              payload: { passenger_id: "${pax}", ticket_id: "${tkt_a}", observed_destination_zone: 5 }
              as: Conductor
              captures: { insp: $.data.id }
          trigger:
            - call: "POST /upgrades"
              payload: { inspection_id: "${insp}", ticket_id: "${tkt_b}" }
              as: Conductor
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_UPGRADE_TICKET_MISMATCH"
            - "HTTP status == 409"

      - name: citation_on_valid_inspection_returns_no_evasion
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_NO_EVASION_FOUND]", entities.Inspection.result]
        distinguishing_aspect: "Issuing a citation from an inspection whose result is VALID (observed zone equals ticket destination) is rejected with ERR_NO_EVASION_FOUND (409)."
        test_recipe:
          setup: ["Clock 2026-03-01. FareProduct SINGLE (1->3). Passenger buys+activates a ticket; inspection observed 3 -> VALID."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 3, ticket_type: "SINGLE", base_fare_cents: 1000, peak_surcharge_cents: 300, apportionment_method: "ZONE_COUNT" }
              as: FareAdmin
              captures: { fp: $.data.id }
            - call: "POST /passengers"
              payload: { email: "ne@x.com", full_name: "Ne", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id }
            - call: "POST /tickets"
              payload: { passenger_id: "${pax}", fare_product_id: "${fp}", travel_period: "PEAK" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { tkt: $.data.id }
            - call: "POST /tickets/${tkt}/activate"
              payload: {}
              as: Passenger
              as_user_id: "${pax}"
            - call: "POST /inspections"
              payload: { passenger_id: "${pax}", ticket_id: "${tkt}", observed_destination_zone: 3 }
              as: Conductor
              captures: { insp: $.data.id }
          trigger:
            - call: "POST /citations"
              payload: { inspection_id: "${insp}", passenger_id: "${pax}" }
              as: Conductor
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_NO_EVASION_FOUND"
            - "HTTP status == 409"

      - name: service_credit_below_threshold_returns_delay_below
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_DELAY_BELOW_THRESHOLD]", calculations.service_credit_amount]
        distinguishing_aspect: "A service credit for a disruption with a 29-minute delay (below the 30-minute threshold) is rejected with ERR_DELAY_BELOW_THRESHOLD (422)."
        test_recipe:
          setup: ["Clock 2026-03-01. FareProduct SINGLE (1->3). Passenger buys a ticket. Disruption with 29-minute delay."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FareAdmin
            - call: "POST /fare-products"
              payload: { origin_zone: 1, destination_zone: 3, ticket_type: "SINGLE", base_fare_cents: 1000, peak_surcharge_cents: 300, apportionment_method: "ZONE_COUNT" }
              as: FareAdmin
              captures: { fp: $.data.id }
            - call: "POST /passengers"
              payload: { email: "db@x.com", full_name: "Db", date_of_birth: "1990-01-01" }
              as: FareAdmin
              captures: { pax: $.data.id }
            - call: "POST /tickets"
              payload: { passenger_id: "${pax}", fare_product_id: "${fp}", travel_period: "PEAK" }
              as: Passenger
              as_user_id: "${pax}"
              captures: { tkt: $.data.id }
            - call: "POST /service-disruptions"
              payload: { line_code: "S9", scheduled_departure: "2026-03-01T08:00:00Z", actual_departure: "2026-03-01T08:29:00Z", window_start: "2026-03-01T08:00:00Z", window_end: "2026-03-01T09:00:00Z" }
