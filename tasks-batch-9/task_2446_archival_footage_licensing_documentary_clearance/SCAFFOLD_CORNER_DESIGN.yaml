# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 2446 · Archival Footage Licensing & Documentary Clearance
# Breadth probe: walks references/claim-extraction-guide.md section by section
# against SCAFFOLD.yaml §1.1–§1.7. Corners already asserted by an §1.8
# instance appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: production_creation_stamps_system_fields_and_declared_defaults
        claim_type: creation
        grounds:
          - entities.Production
          - endpoints.POST_/productions
          - response_envelope.success
        distinguishing_aspect: "A bare production with only the two required inputs must come back 201 with every computed/system field at its declared default — status DEVELOPMENT, posture OPEN, all four counters 0, version 1 — and with the success envelope's meta block populated."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /productions"
              payload: { title: "Salt Flats", delivery_deadline_date: "2027-06-30" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id, prod_v: $.data.version }
          assert:
            - "HTTP 201 and the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == \"object\""
            - "Production.${prod_id}.status == DEVELOPMENT, posture == OPEN"
            - "asset_count == 0, cleared_asset_count == 0, open_asset_count == 0, committed_fee_cents == 0, sweep_epoch == 0"
            - "version == 1 and created_at == updated_at"
            - "festival_premiere_date is null and eo_carrier_name is null (both optional inputs were omitted)"

      - name: asset_creation_missing_required_usage_purpose_rejected
        claim_type: required_fields
        grounds:
          - endpoints.POST_/productions/{id}/assets
          - validations[priority=7]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "usage_purpose has source input and no default, and it selects the fair-use weighting variant — omitting it must be a 400, not a silent default to CRITICAL_COMMENTARY."
        test_recipe:
          setup: ["One production in status CLEARANCE."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Salt Flats", delivery_deadline_date: "2027-06-30" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
          trigger:
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Untitled roll", timecode_in_seconds: 0, timecode_out_seconds: 45 }
              as: ArchiveResearcher
          assert:
            - "HTTP 400 with error_id ERR_INVALID_REQUEST and response_type == \"error\""
            - "GET /assets?production_id=${prod_id} returns 0 rows"
            - "Production.${prod_id}.asset_count == 0 and version unchanged"

      - name: asset_inverted_timecodes_rejected_as_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Asset.fields.timecode_out_seconds
          - validations[priority=7]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "timecode_out_seconds must strictly exceed timecode_in_seconds; equality is also rejected, so duration_seconds can never be 0 and billable_units can never be 0."
        test_recipe:
          setup: ["One production in status CLEARANCE."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Salt Flats", delivery_deadline_date: "2027-06-30" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
          trigger:
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Zero length", timecode_in_seconds: 120, timecode_out_seconds: 120, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "MUSIC", title: "Backwards cue", timecode_in_seconds: 200, timecode_out_seconds: 100, usage_purpose: "ILLUSTRATIVE_BACKGROUND" }
              as: ArchiveResearcher
          assert:
            - "both trigger calls return HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "GET /assets?production_id=${prod_id} returns 0 rows"

      - name: rate_card_defaults_applied_when_every_multiplier_is_omitted
        claim_type: defaults
        grounds:
          - entities.RateCard.fields.tier1_max_seconds
          - entities.RateCard.fields.tier2_rate_multiplier
          - entities.RateCard.fields.term_multiplier_per_year
          - entities.RateCard.fields.status
          - endpoints.POST_/archives/{id}/rate-cards
        distinguishing_aspect: "Fourteen of the card's seventeen numeric fields are optional with declared defaults; supplying only the four required ones must materialise all fourteen defaults verbatim (not null, not 0) because the fee formula reads them by name."
        test_recipe:
          setup: ["One ACTIVE archive."]
          setup_api_calls:
            - call: "POST /archives"
              payload: { name: "Pathe Vault", holder_type: "FILM_ARCHIVE" }
              as: ArchiveResearcher
              captures: { arch_id: $.data.id }
          trigger:
            - call: "POST /archives/${arch_id}/rate-cards"
              payload: { base_rate_per_30s_cents: 60000, minimum_fee_cents: 150000, festival_minimum_fee_cents: 40000, effective_from_date: "2026-01-01" }
              as: ArchiveResearcher
              captures: { rc_id: $.data.id }
          assert:
            - "RateCard.${rc_id}.tier1_max_seconds == 30, tier2_max_seconds == 120, tier2_rate_multiplier == 1.25, tier3_rate_multiplier == 1.6"
            - "media_multiplier_theatrical == 1.4, media_multiplier_broadcast == 1.15, media_multiplier_streaming == 1.3, media_multiplier_all_media == 1.75"
            - "territory_multiplier_world == 1.5, territory_multiplier_domestic == 1.0"
            - "term_multiplier_per_year == 0.2, festival_window_multiplier == 0.35, all_media_window_multiplier == 1.0"
            - "status == ACTIVE and archive_id == ${arch_id} (taken from the path, never the body)"

      - name: license_computed_money_fields_ignore_any_client_supplied_input
        claim_type: computed_fields
        grounds:
          - entities.License.fields.rate_card_fee_cents
          - entities.License.fields.executed_fee_cents
          - entities.License.fields.billable_units
          - entities.License.fields.rate_card_id
          - endpoints.POST_/licenses
        distinguishing_aspect: "POST /licenses declares no money field in its input: rate_card_id, billable_units and rate_card_fee_cents are resolved server-side from the archive's ACTIVE card and the asset's duration, and executed_fee_cents stays null until execution. Extra body keys must be ignored rather than honoured."
        test_recipe:
          setup: ["A production in CLEARANCE, an ACTIVE archive with the standard rate card, one 45-second asset with a SELECTED AVAILABLE candidate."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Computed Money", delivery_deadline_date: "2027-06-30" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "POST /archives"
              payload: { name: "Pathe Vault", holder_type: "FILM_ARCHIVE" }
              as: ArchiveResearcher
              captures: { arch_id: $.data.id }
            - call: "POST /archives/${arch_id}/rate-cards"
              payload: { base_rate_per_30s_cents: 60000, minimum_fee_cents: 150000, festival_minimum_fee_cents: 40000, effective_from_date: "2026-01-01" }
              as: ArchiveResearcher
              captures: { rc_id: $.data.id }
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Quarry blast", timecode_in_seconds: 0, timecode_out_seconds: 45, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
              captures: { asset_id: $.data.id }
            - call: "POST /assets/${asset_id}/source-candidates"
              payload: { archive_id: "${arch_id}", availability_status: "AVAILABLE" }
              as: ArchiveResearcher
              captures: { cand_id: $.data.id }
            - call: "POST /assets/${asset_id}/select-source"
              payload: { source_candidate_id: "${cand_id}" }
              as: ArchiveResearcher
          trigger:
            - call: "POST /licenses"
              payload: { production_id: "${prod_id}", asset_id: "${asset_id}", archive_id: "${arch_id}", rights_leg: "FOOTAGE", media: "BROADCAST", territory: "WORLD", window_class: "ALL_MEDIA_WINDOW", term_months: 36, term_start_date: "2026-08-15", term_end_date: "2029-08-15" }
              as: ClearanceSupervisor
              captures: { lic_id: $.data.id }
          assert:
            - "License.${lic_id}.rate_card_id == ${rc_id} (resolved, never supplied)"
            - "billable_units == 2 and rate_card_fee_cents == 362250"
            - "executed_fee_cents is null, mfn_benchmark_fee_cents is null, mfn_topup_cents == 0, renewal_delta_cents == 0"
            - "status == DRAFT, round_count == 0, current_proposed_fee_cents is null, version == 1"
            - "Asset.${asset_id}.licensing_status == IN_NEGOTIATION and Production.${prod_id}.committed_fee_cents == 0"

      - name: negotiation_round_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.NegotiationRound
          - endpoints.GET_/licenses/{id}/negotiation-rounds
        distinguishing_aspect: "NegotiationRound is declared common_fields: false — it exposes only id and created_at plus its own columns, has no version and no update or state endpoint anywhere in §1.5; the audit trail is append-only."
        test_recipe:
          setup: ["A licence in status COUNTERED after a LICENSOR round of 362250 and a PRODUCER counter of 300000."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Append Only", delivery_deadline_date: "2027-06-30" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "POST /archives"
              payload: { name: "Pathe Vault", holder_type: "FILM_ARCHIVE" }
              as: ArchiveResearcher
              captures: { arch_id: $.data.id }
            - call: "POST /archives/${arch_id}/rate-cards"
              payload: { base_rate_per_30s_cents: 60000, minimum_fee_cents: 150000, festival_minimum_fee_cents: 40000, effective_from_date: "2026-01-01" }
              as: ArchiveResearcher
              captures: { rc_id: $.data.id }
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Quarry blast", timecode_in_seconds: 0, timecode_out_seconds: 45, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
              captures: { asset_id: $.data.id }
            - call: "POST /assets/${asset_id}/source-candidates"
              payload: { archive_id: "${arch_id}", availability_status: "AVAILABLE" }
              as: ArchiveResearcher
              captures: { cand_id: $.data.id }
            - call: "POST /assets/${asset_id}/select-source"
              payload: { source_candidate_id: "${cand_id}" }
              as: ArchiveResearcher
            - call: "POST /licenses"
              payload: { production_id: "${prod_id}", asset_id: "${asset_id}", archive_id: "${arch_id}", rights_leg: "FOOTAGE", media: "BROADCAST", territory: "WORLD", window_class: "ALL_MEDIA_WINDOW", term_months: 36, term_start_date: "2026-08-15", term_end_date: "2029-08-15" }
              as: ClearanceSupervisor
              captures: { lic_id: $.data.id, lic_v1: $.data.version }
            - call: "POST /licenses/${lic_id}/negotiation-rounds"
              payload: { party: "LICENSOR", proposed_fee_cents: 362250, expected_license_version: "${lic_v1}" }
              as: RightsHolderRep
              as_user_id: "${arch_id}"
              captures: { r1_id: $.data.id, lic_v2: $.data.license_version_after }
            - call: "POST /licenses/${lic_id}/negotiation-rounds"
              payload: { party: "PRODUCER", proposed_fee_cents: 300000, expected_license_version: "${lic_v2}" }
              as: ProductionAdmin
              captures: { r2_id: $.data.id }
          trigger:
            - call: "GET /licenses/${lic_id}/negotiation-rounds"
              payload: {}
              as: ProductionAdmin
          assert:
            - "the response is a 2-row array; response_type == \"array\""
            - "each row exposes id and created_at but NO version and NO updated_at field"
            - "row 1: round_number == 1, party == LICENSOR, proposed_fee_cents == 362250, license_version_after == 2"
            - "row 2: round_number == 2, party == PRODUCER, proposed_fee_cents == 300000, license_version_after == 3"
            - "License.${lic_id}.status == COUNTERED, round_count == 2, current_proposed_fee_cents == 300000, version == 3"
            - "§1.5 declares no PATCH/PUT/DELETE and no /state endpoint for NegotiationRound"

      - name: license_get_with_unknown_uuid_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=5]
          - errors.ERR_LICENSE_NOT_FOUND
          - errors.ERR_ASSET_NOT_FOUND
          - errors.ERR_SOURCE_CANDIDATE_NOT_FOUND
        distinguishing_aspect: "Path-parameter existence (priority 5) is checked before every business rule and returns the entity-specific 404; a body FK to a missing row (priority 6) returns the 404 of the entity the FK points at, not of the addressed resource."
        test_recipe:
          setup: ["One production in CLEARANCE with one asset that has no source candidates."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Ghost Ids", delivery_deadline_date: "2027-06-30" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Orphan shot", timecode_in_seconds: 0, timecode_out_seconds: 45, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
              captures: { asset_id: $.data.id }
          trigger:
            - call: "GET /licenses/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProductionAdmin
            - call: "GET /assets/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ProductionAdmin
            - call: "POST /assets/${asset_id}/select-source"
              payload: { source_candidate_id: "00000000-0000-4000-8000-000000000002" }
              as: ArchiveResearcher
          assert:
            - "call 1 is 404 ERR_LICENSE_NOT_FOUND, call 2 is 404 ERR_ASSET_NOT_FOUND"
            - "call 3 is 404 ERR_SOURCE_CANDIDATE_NOT_FOUND — the addressed asset exists, so the 404 names the missing FK target"
            - "Asset.${asset_id}.selected_source_candidate_id is still null and its version did not change"

      - name: asset_listing_filters_and_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/assets
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "The list endpoint must combine an entity filter (asset_type) with limit/offset paging and still report total_count over the FILTERED set, with has_more derived from offset + returned rows against that same total."
        test_recipe:
          setup: ["One production in CLEARANCE with three ARCHIVAL_FOOTAGE assets and one MUSIC asset, created in that order."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Paging", delivery_deadline_date: "2027-06-30" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Shot one", timecode_in_seconds: 0, timecode_out_seconds: 45, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
              captures: { a1: $.data.id }
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Shot two", timecode_in_seconds: 0, timecode_out_seconds: 45, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
              captures: { a2: $.data.id }
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "Shot three", timecode_in_seconds: 0, timecode_out_seconds: 45, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
              captures: { a3: $.data.id }
            - call: "POST /productions/${prod_id}/assets"
              payload: { asset_type: "MUSIC", title: "Title cue", timecode_in_seconds: 0, timecode_out_seconds: 60, usage_purpose: "ILLUSTRATIVE_BACKGROUND" }
              as: ArchiveResearcher
              captures: { am: $.data.id }
          trigger:
            - call: "GET /assets?production_id=${prod_id}&asset_type=ARCHIVAL_FOOTAGE&limit=2&offset=0"
              payload: {}
              as: ProductionAdmin
            - call: "GET /assets?production_id=${prod_id}&asset_type=ARCHIVAL_FOOTAGE&limit=2&offset=2"
              payload: {}
              as: ProductionAdmin
            - call: "GET /assets?production_id=${prod_id}"
              payload: {}
              as: ProductionAdmin
          assert:
            - "call 1 returns 2 rows with total_count == 3 and has_more == true"
            - "call 2 returns 1 row with total_count == 3 and has_more == false"
            - "the MUSIC asset ${am} appears in neither filtered page"
            - "call 3 (no paging params) returns all 4 rows with limit defaulted to 10, offset 0, total_count == 4, has_more == false"
            - "Production.${prod_id}.asset_count == 4 matches total_count of the unfiltered list"

      - name: source_candidate_under_nonexistent_parent_asset_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.SourceCandidate.fields.asset_id
          - validations[priority=5]
          - errors.ERR_ASSET_NOT_FOUND
        distinguishing_aspect: "SourceCandidate is created only through the nested route, so its parent is the path segment: an unknown parent id must 404 on the parent entity before the body is even considered, and no orphan row may appear on the archive's reverse list."
        test_recipe:
          setup: ["One ACTIVE archive; no assets at all."]
          setup_api_calls:
            - call: "POST /archives"
              payload: { name: "Pathe Vault", holder_type: "FILM_ARCHIVE" }
              as: ArchiveResearcher
              captures: { arch_id: $.data.id }
          trigger:
            - call: "POST /assets/00000000-0000-4000-8000-0000000000aa/source-candidates"
              payload: { archive_id: "${arch_id}", availability_status: "AVAILABLE" }
              as: ArchiveResearcher
          assert:
            - "HTTP 404 with error_id ERR_ASSET_NOT_FOUND"
            - "GET /archives/${arch_id}/source-candidates returns 0 rows"

      - name: license_rejects_an_asset_belonging_to_another_production
        claim_type: graph_topology
        grounds:
          - validations[priority=17]
          - errors.ERR_ASSET_PRODUCTION_MISMATCH
          - complexity_profile.entity_topology
        distinguishing_aspect: "License is the junction of Production, Asset, Archive and RateCard, so a caller can name a consistent-looking but cross-wired triple. Referential integrity across the graph must reject an asset that belongs to a different production with a 422, distinct from the 404 used for missing rows."
        test_recipe:
          setup: ["Two productions in CLEARANCE, each with its own 45-second asset and SELECTED candidate at the same ACTIVE archive."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Film A", delivery_deadline_date: "2027-06-30" }
              as: ProductionAdmin
              captures: { prod_a: $.data.id }
            - call: "POST /productions/${prod_a}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "POST /productions"
              payload: { title: "Film B", delivery_deadline_date: "2027-07-31" }
              as: ProductionAdmin
              captures: { prod_b: $.data.id }
            - call: "POST /productions/${prod_b}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "POST /archives"
              payload: { name: "Pathe Vault", holder_type: "FILM_ARCHIVE" }
              as: ArchiveResearcher
              captures: { arch_id: $.data.id }
            - call: "POST /archives/${arch_id}/rate-cards"
              payload: { base_rate_per_30s_cents: 60000, minimum_fee_cents: 150000, festival_minimum_fee_cents: 40000, effective_from_date: "2026-01-01" }
              as: ArchiveResearcher
              captures: { rc_id: $.data.id }
            - call: "POST /productions/${prod_b}/assets"
              payload: { asset_type: "ARCHIVAL_FOOTAGE", title: "B roll", timecode_in_seconds: 0, timecode_out_seconds: 45, usage_purpose: "CRITICAL_COMMENTARY" }
              as: ArchiveResearcher
              captures: { asset_b: $.data.id }
            - call: "POST /assets/${asset_b}/source-candidates"
              payload: { archive_id: "${arch_id}", availability_status: "AVAILABLE" }
              as: ArchiveResearcher
              captures: { cand_b: $.data.id }
            - call: "POST /assets/${asset_b}/select-source"
              payload: { source_candidate_id: "${cand_b}" }
              as: ArchiveResearcher
          trigger:
            - call: "POST /licenses"
              payload: { production_id: "${prod_a}", asset_id: "${asset_b}", archive_id: "${arch_id}", rights_leg: "FOOTAGE", media: "BROADCAST", territory: "WORLD", window_class: "ALL_MEDIA_WINDOW", term_months: 36, term_start_date: "2026-08-15", term_end_date: "2029-08-15" }
              as: ClearanceSupervisor
          assert:
            - "HTTP 422 with error_id ERR_ASSET_PRODUCTION_MISMATCH"
            - "GET /licenses?production_id=${prod_a} returns 0 rows and GET /licenses?asset_id=${asset_b} returns 0 rows"
            - "Asset.${asset_b}.licensing_status is still UNCLEARED (no DRAFT licence was created, so the IN_NEGOTIATION rollup never fired)"

      - name: eo_application_rejects_a_chart_pinned_on_another_production
        claim_type: graph_topology
        grounds:
          - validations[priority=19]
          - errors.ERR_CHART_PRODUCTION_MISMATCH
          - entities.EOApplication.fields.clearance_chart_id
        distinguishing_aspect: "A second cross-aggregate mis-wire on a different junction: the E&O application takes its production from the path and its chart from the body, so the two can disagree. The 422 must fire before the coverage-limit check (priority 43), which is deliberately also violated in the same request."
        test_recipe:
          setup: ["Two productions in CLEARANCE with no assets; production A has no chart, production B has one PINNED chart."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Film A", delivery_deadline_date: "2027-06-30" }
              as: ProductionAdmin
              captures: { prod_a: $.data.id }
            - call: "POST /productions/${prod_a}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "POST /productions"
              payload: { title: "Film B", delivery_deadline_date: "2027-07-31" }
              as: ProductionAdmin
              captures: { prod_b: $.data.id }
            - call: "POST /productions/${prod_b}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "GET /productions/${prod_b}"
              payload: {}
              as: ClearanceSupervisor
              captures: { prod_b_v: $.data.version }
            - call: "POST /productions/${prod_b}/clearance-charts"
              payload: { chart_label: "B v1", expected_production_version: "${prod_b_v}" }
              as: ClearanceSupervisor
              captures: { chart_b: $.data.id }
          trigger:
            - call: "POST /productions/${prod_a}/eo-applications"
              payload: { clearance_chart_id: "${chart_b}", coverage_limit_cents: 50000, retention_cents: 100000 }
              as: ProductionAdmin
          assert:
            - "HTTP 422 with error_id ERR_CHART_PRODUCTION_MISMATCH"
            - "the response is NOT ERR_COVERAGE_LIMIT_INVALID even though coverage_limit_cents 50000 is below the 100000 minimum AND below retention_cents (priority 19 precedes priority 43)"
            - "GET /eo-applications?production_id=${prod_a} returns 0 rows"
            - "ClearanceChart.${chart_b}.status is still PINNED and its production_id is still ${prod_b}"

  - section: state_machines
    instances:

      - name: license_execute_from_draft_rejected_as_not_quoted
        claim_type: invalid_transition
        grounds:
          - state_machines.License.transitions.QUOTED_to_EXECUTED
          - validations[priority=10]
          - validations[priority=12]
          - errors.ERR_LICENSE_NOT_QUOTED
