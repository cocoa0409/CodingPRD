            - "PayoutBatch.${b_lk}.gross_cents == 10000 and creator_share_cents == 5500 and partner_share_cents == 4500"
            - "PayoutBatch.${b_lk}.held_cents == 0"

      - name: claim_reverse_list_filters_by_status
        claim_type: Standard CRUD
        grounds:
          - endpoints.GET_/api/claims
          - entities.Claim
        distinguishing_aspect: "GET /api/claims?content_item_id=&status=ACTIVE returns the ACTIVE claim and excludes one already RELEASED on the same item."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One item with two claims where the first was released by its rights holder."
          setup_api_calls:
