scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: honey_yield_provisional_vs_final_diverge_on_lot
        grounds:
          - calculations.honey_yield
          - entities.HoneyLot.fields.provisional_yield_kg
          - entities.HoneyLot.fields.final_yield_kg
          - state_machines.HoneyLot.DRAFT_to_EXTRACTED
        distinguishing_aspect: "On HoneyLot, provisional_yield_kg (frames*2.5) and final_yield_kg (gross_weight*0.96) are produced by two valid variants of honey_yield and differ for identical input data — provisional 25.0 kg vs final 28.8 kg for the same lot."
        test_recipe:
          setup:
            - "Apiary CA exists, owned by its ApiaryManager identity."
            - "Hive H1 (HEALTHY) in apiary CA."
            - "HoneyLot L1 DRAFT in apiary CA with two RECORDED harvests: frames_pulled 4 (weight 12.0) and 6 (weight 18.0); gross_weight_kg=30.0; provisional_yield_kg=25.0."
            - "Clock at 2026-05-10 (past any withdrawal)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /apiaries"
              payload: { name: "CA Yard", state_code: "CA", latitude: 38.5, longitude: -121.5, max_yard_colonies: 50 }
              as: ApiaryManager
              captures: { ap_id: $.data.id }
            - call: "POST /hives"
              payload: { apiary_id: "${ap_id}", tag: "H1", brood_frames: 6 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { h1_id: $.data.id }
            - call: "POST /honey-lots"
              payload: { apiary_id: "${ap_id}", lot_code: "L1", floral_source: "WILDFLOWER" }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /honey-lots/${l1_id}/harvests"
              payload: { hive_id: "${h1_id}", frames_pulled: 4, weight_kg: 12.0 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
            - call: "POST /honey-lots/${l1_id}/harvests"
              payload: { hive_id: "${h1_id}", frames_pulled: 6, weight_kg: 18.0 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
          trigger:
            - call: "POST /honey-lots/${l1_id}/extract"
              payload: {}
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { final_y: $.data.final_yield_kg, prov_y: $.data.provisional_yield_kg }
          assert:
            - "HoneyLot.${l1_id}.provisional_yield_kg == 25.0"
            - "HoneyLot.${l1_id}.final_yield_kg == 28.8"
            - "HoneyLot.${l1_id}.provisional_yield_kg != HoneyLot.${l1_id}.final_yield_kg"

      - name: colony_strength_point_in_time_vs_forward_projected_diverge_on_hive
        grounds:
          - calculations.colony_strength_scoring
          - entities.Hive.fields.inspection_strength
          - entities.HivePlacement.fields.contract_rated_strength
          - state_machines.HivePlacement.PROPOSED_to_CONFIRMED
        distinguishing_aspect: "On a different entity domain (Hive/HivePlacement, not HoneyLot), point_in_time strength is 59 (SUB_GRADE) while forward_projected at bloom is 100 (CONTRACT_GRADE) for the SAME hive — two valid variants of colony_strength_scoring diverge."
        test_recipe:
          setup:
            - "Clock at 2026-01-06."
            - "Apiary CA with an ACTIVE state registration."
            - "Hive H1 HEALTHY/QUEENRIGHT, inspected with brood_frames_observed=5, honey_frames_observed=3, mite=1.0 -> inspection_strength = 5*8+3*3+10 = 59 (SUB today, < CONTRACT_GRADE_MIN 60)."
            - "PollinationContract C1 SIGNED, bloom_start=2026-02-04 (29 days ahead -> 4 whole weeks -> +8 brood capped/used)."
            - "HivePlacement P1 PROPOSED for H1 on C1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /apiaries"
              payload: { name: "CA Yard", state_code: "CA", latitude: 38.5, longitude: -121.5, max_yard_colonies: 50 }
              as: ApiaryManager
              captures: { ap_id: $.data.id }
            - call: "POST /apiaries/${ap_id}/registrations"
              payload: { registration_number: "CA-001", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z" }
              as: StateApiarist
              captures: { reg_id: $.data.id }
            - call: "POST /apiaries/${ap_id}/registrations/${reg_id}/approve"
              payload: {}
              as: StateApiarist
            - call: "POST /hives"
              payload: { apiary_id: "${ap_id}", tag: "H1", brood_frames: 5 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { h1_id: $.data.id }
            - call: "POST /hives/${h1_id}/inspections"
              payload: { inspected_at: "2026-01-06T00:00:00Z", mites_per_100_bees: 1.0, brood_frames_observed: 5, honey_frames_observed: 3, queen_seen: true }
              as: ApiaryManager
              as_user_id: "${ap_id}"
            - call: "POST /pollination-contracts"
              payload: { grower_name: "Almond Co", orchard_state_code: "CA", bloom_start: "2026-02-04T00:00:00Z", bloom_end: "2026-03-06T00:00:00Z", required_strong_hives: 1, max_hives_on_site: 4, base_rate_cents: 20000 }
              as: ContractCoordinator
              captures: { c1_id: $.data.id }
            - call: "POST /pollination-contracts/${c1_id}/sign"
              payload: {}
              as: ContractCoordinator
              captures: { c1_v: $.data.version }
            - call: "POST /pollination-contracts/${c1_id}/placements"
              payload: { hive_id: "${h1_id}", placement_start: "2026-02-04T00:00:00Z", removal_due: "2026-03-06T00:00:00Z" }
              as: ContractCoordinator
              captures: { p1_id: $.data.id }
          trigger:
            - call: "GET /hives/${h1_id}"
              payload: {}
              as: ContractCoordinator
              captures: { pit: $.data.inspection_strength }
            - call: "POST /hive-placements/${p1_id}/confirm"
              payload: { expected_contract_version: "${c1_v}" }
              as: ContractCoordinator
              captures: { fwd: $.data.contract_rated_strength, grade: $.data.grade }
          assert:
            - "Hive.${h1_id}.inspection_strength == 59"
            - "HivePlacement.${p1_id}.contract_rated_strength == 100"
            - "HivePlacement.${p1_id}.grade == CONTRACT_GRADE"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across DIFFERENT modes {(a),(b),(c)}
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pollination_payout_nested_min_max_tiered_mode_a
        grounds:
          - calculations.pollination_payout
          - entities.PollinationContract.fields.projected_payout_cents
          - entities.HivePlacement.fields.grade
          - state_machines.PollinationContract.SIGNED_to_PLACED
        distinguishing_aspect: "Mode (a): pollination_payout combines >=3 inputs (per-hive grade, contract_rated_strength tier, base_rate, placed/required counts) with nested max()/conditional branches — 2 CONTRACT_GRADE hives @strength100 yield 58000 cents (48000 subtotal + 10000 fulfillment bonus, 0 shortfall penalty)."
        test_recipe:
          setup:
            - "Clock 2026-01-06; Apiary CA ACTIVE-registered."
            - "Two HEALTHY hives H1,H2 each inspected brood=5 -> forward_projected 100 at bloom."
            - "Contract C1 SIGNED, required_strong_hives=2, base_rate_cents=20000, max_hives_on_site=4."
            - "Both placements CONFIRMED as CONTRACT_GRADE -> placed_strong_hives=2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /apiaries"
              payload: { name: "CA Yard", state_code: "CA", latitude: 38.5, longitude: -121.5, max_yard_colonies: 50 }
              as: ApiaryManager
              captures: { ap_id: $.data.id }
            - call: "POST /apiaries/${ap_id}/registrations"
              payload: { registration_number: "CA-001", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z" }
              as: StateApiarist
              captures: { reg_id: $.data.id }
            - call: "POST /apiaries/${ap_id}/registrations/${reg_id}/approve"
              payload: {}
              as: StateApiarist
            - call: "POST /hives"
              payload: { apiary_id: "${ap_id}", tag: "H1", brood_frames: 5 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { h1_id: $.data.id }
            - call: "POST /hives/${h1_id}/inspections"
              payload: { inspected_at: "2026-01-06T00:00:00Z", mites_per_100_bees: 1.0, brood_frames_observed: 5, honey_frames_observed: 3, queen_seen: true }
              as: ApiaryManager
              as_user_id: "${ap_id}"
            - call: "POST /hives"
              payload: { apiary_id: "${ap_id}", tag: "H2", brood_frames: 5 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { h2_id: $.data.id }
            - call: "POST /hives/${h2_id}/inspections"
              payload: { inspected_at: "2026-01-06T00:00:00Z", mites_per_100_bees: 1.0, brood_frames_observed: 5, honey_frames_observed: 3, queen_seen: true }
              as: ApiaryManager
              as_user_id: "${ap_id}"
            - call: "POST /pollination-contracts"
              payload: { grower_name: "Almond Co", orchard_state_code: "CA", bloom_start: "2026-02-04T00:00:00Z", bloom_end: "2026-03-06T00:00:00Z", required_strong_hives: 2, max_hives_on_site: 4, base_rate_cents: 20000 }
              as: ContractCoordinator
              captures: { c1_id: $.data.id }
            - call: "POST /pollination-contracts/${c1_id}/sign"
              payload: {}
              as: ContractCoordinator
              captures: { c1_v0: $.data.version }
            - call: "POST /pollination-contracts/${c1_id}/placements"
              payload: { hive_id: "${h1_id}", placement_start: "2026-02-04T00:00:00Z", removal_due: "2026-03-06T00:00:00Z" }
              as: ContractCoordinator
              captures: { p1_id: $.data.id }
            - call: "POST /hive-placements/${p1_id}/confirm"
              payload: { expected_contract_version: "${c1_v0}" }
              as: ContractCoordinator
              captures: { c1_v1: $.data.version }
            - call: "GET /pollination-contracts/${c1_id}"
              payload: {}
              as: ContractCoordinator
              captures: { c1_v_after_p1: $.data.version }
            - call: "POST /pollination-contracts/${c1_id}/placements"
              payload: { hive_id: "${h2_id}", placement_start: "2026-02-04T00:00:00Z", removal_due: "2026-03-06T00:00:00Z" }
              as: ContractCoordinator
              captures: { p2_id: $.data.id }
            - call: "POST /hive-placements/${p2_id}/confirm"
              payload: { expected_contract_version: "${c1_v_after_p1}" }
              as: ContractCoordinator
          trigger:
            - call: "POST /pollination-contracts/${c1_id}/finalize-placement"
              payload: {}
              as: ContractCoordinator
              captures: { payout: $.data.projected_payout_cents, status: $.data.status }
          assert:
            - "PollinationContract.${c1_id}.status == PLACED"
            - "PollinationContract.${c1_id}.placed_strong_hives == 2"
            - "PollinationContract.${c1_id}.projected_payout_cents == 58000"

      - name: honey_revenue_discount_keyed_on_total_tier_mode_c
        grounds:
          - calculations.honey_revenue
          - entities.HoneyLot.fields.price_per_kg_cents
          - entities.HoneyLot.fields.gross_revenue_cents
          - entities.HoneyLot.fields.net_revenue_cents
          - state_machines.HoneyLot.EXTRACTED_to_SOLD
        distinguishing_aspect: "Mode (c): honey_revenue is circular-looking — net_revenue depends on a volume discount keyed on the gross_revenue tier it then modifies; the pinned order (gross 115200 -> tier1 5% -> subtract 5760 -> net 109440) makes the value well-defined."
        test_recipe:
          setup:
            - "Apiary CA; clock 2026-05-10."
            - "HoneyLot L1 EXTRACTED with final_yield_kg=28.8 (gross 30.0 kg * 0.96)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /apiaries"
              payload: { name: "CA Yard", state_code: "CA", latitude: 38.5, longitude: -121.5, max_yard_colonies: 50 }
              as: ApiaryManager
              captures: { ap_id: $.data.id }
            - call: "POST /hives"
              payload: { apiary_id: "${ap_id}", tag: "H1", brood_frames: 6 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { h1_id: $.data.id }
            - call: "POST /honey-lots"
              payload: { apiary_id: "${ap_id}", lot_code: "L1", floral_source: "WILDFLOWER" }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /honey-lots/${l1_id}/harvests"
              payload: { hive_id: "${h1_id}", frames_pulled: 5, weight_kg: 12.0 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
            - call: "POST /honey-lots/${l1_id}/harvests"
              payload: { hive_id: "${h1_id}", frames_pulled: 5, weight_kg: 18.0 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
            - call: "POST /honey-lots/${l1_id}/extract"
              payload: {}
              as: ApiaryManager
              as_user_id: "${ap_id}"
          trigger:
            - call: "POST /honey-lots/${l1_id}/sell"
              payload: { price_per_kg_cents: 4000 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { lot_status: $.data.status, gross: $.data.gross_revenue_cents, net: $.data.net_revenue_cents }
          assert:
            - "HoneyLot.${l1_id}.final_yield_kg == 28.8"
            - "HoneyLot.${l1_id}.status == SOLD"
            - "HoneyLot.${l1_id}.gross_revenue_cents == 115200"
            - "HoneyLot.${l1_id}.net_revenue_cents == 109440"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on DIFFERENT entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: hive_parallel_axes_health_and_queen_evolve_independently
        grounds:
          - state_machines.Hive
          - entities.Hive.fields.health_status
          - entities.Hive.fields.queen_status
          - state_machines.Hive.queen_status=QUEENRIGHT_to_queen_status=QUEENLESS
        distinguishing_aspect: "Hive carries two independent state axes: marking it QUEENLESS (queen axis) leaves health_status==HEALTHY unchanged, and quarantining (health axis) leaves queen_status untouched — parallel dimensions on one entity."
        test_recipe:
          setup:
            - "Apiary CA; Hive H1 HEALTHY/QUEENRIGHT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /apiaries"
              payload: { name: "CA Yard", state_code: "CA", latitude: 38.5, longitude: -121.5, max_yard_colonies: 50 }
              as: ApiaryManager
              captures: { ap_id: $.data.id }
            - call: "POST /hives"
              payload: { apiary_id: "${ap_id}", tag: "H1", brood_frames: 5 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { h1_id: $.data.id }
          trigger:
            - call: "POST /hives/${h1_id}/mark-queenless"
              payload: {}
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { qs: $.data.queen_status, hs: $.data.health_status }
          assert:
            - "Hive.${h1_id}.queen_status == QUEENLESS"
            - "Hive.${h1_id}.health_status == HEALTHY"

      - name: contract_cyclic_disputed_back_to_placed
        grounds:
          - state_machines.PollinationContract
          - state_machines.PollinationContract.PLACED_to_DISPUTED
          - state_machines.PollinationContract.DISPUTED_to_PLACED
          - entities.PollinationContract.fields.status
        distinguishing_aspect: "On a different entity (PollinationContract, not Hive), the machine is cyclic: PLACED -> DISPUTED -> PLACED returns the contract to a previously-visited state, which a linear pipeline cannot."
        test_recipe:
          setup:
            - "Clock 2026-01-06; Apiary CA ACTIVE-registered; Hive H1 inspected (forward 100)."
            - "Contract C1 PLACED with one CONTRACT_GRADE placement (required=1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /apiaries"
              payload: { name: "CA Yard", state_code: "CA", latitude: 38.5, longitude: -121.5, max_yard_colonies: 50 }
              as: ApiaryManager
              captures: { ap_id: $.data.id }
            - call: "POST /apiaries/${ap_id}/registrations"
              payload: { registration_number: "CA-001", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z" }
              as: StateApiarist
              captures: { reg_id: $.data.id }
            - call: "POST /apiaries/${ap_id}/registrations/${reg_id}/approve"
              payload: {}
              as: StateApiarist
            - call: "POST /hives"
              payload: { apiary_id: "${ap_id}", tag: "H1", brood_frames: 5 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { h1_id: $.data.id }
            - call: "POST /hives/${h1_id}/inspections"
              payload: { inspected_at: "2026-01-06T00:00:00Z", mites_per_100_bees: 1.0, brood_frames_observed: 5, honey_frames_observed: 3, queen_seen: true }
              as: ApiaryManager
              as_user_id: "${ap_id}"
            - call: "POST /pollination-contracts"
              payload: { grower_name: "Almond Co", orchard_state_code: "CA", bloom_start: "2026-02-04T00:00:00Z", bloom_end: "2026-03-06T00:00:00Z", required_strong_hives: 1, max_hives_on_site: 4, base_rate_cents: 20000 }
              as: ContractCoordinator
              captures: { c1_id: $.data.id }
            - call: "POST /pollination-contracts/${c1_id}/sign"
              payload: {}
              as: ContractCoordinator
              captures: { c1_v0: $.data.version }
            - call: "POST /pollination-contracts/${c1_id}/placements"
              payload: { hive_id: "${h1_id}", placement_start: "2026-02-04T00:00:00Z", removal_due: "2026-03-06T00:00:00Z" }
              as: ContractCoordinator
              captures: { p1_id: $.data.id }
            - call: "POST /hive-placements/${p1_id}/confirm"
              payload: { expected_contract_version: "${c1_v0}" }
              as: ContractCoordinator
            - call: "POST /pollination-contracts/${c1_id}/finalize-placement"
              payload: {}
              as: ContractCoordinator
            - call: "POST /pollination-contracts/${c1_id}/dispute"
              payload: {}
              as: ContractCoordinator
              captures: { st_disputed: $.data.status }
          trigger:
            - call: "POST /pollination-contracts/${c1_id}/resolve-dispute"
              payload: {}
              as: ContractCoordinator
              captures: { st_resolved: $.data.status }
          assert:
            - "PollinationContract.${c1_id}.status == DISPUTED (after dispute) then == PLACED (after resolve-dispute)"
            - "PollinationContract.${c1_id}.status == PLACED"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from DIFFERENT triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: deadout_cascade_hive_to_placement_to_contract_understaffed
        grounds:
          - state_machines.Hive.health_status=ANY_NON_DEADOUT_to_health_status=DEADOUT
          - state_machines.HivePlacement.CONFIRMED_to_REMOVED
          - state_machines.PollinationContract.PLACED_to_UNDERSTAFFED
          - entities.PollinationContract.fields.placed_strong_hives
          - entities.PollinationContract.fields.projected_payout_cents
        distinguishing_aspect: "Depth-3 cascade from POST /hives/{id}/deadout: Hive->DEADOUT decrements apiary count AND removes its CONFIRMED placement (hop2), the placement removal drops placed_strong_hives below required which flips the contract PLACED->UNDERSTAFFED and recomputes projected_payout to 19000 (hop3) — each hop caused by the prior."
        test_recipe:
          setup:
            - "Clock 2026-01-06; Apiary CA ACTIVE-registered; two hives H1,H2 inspected forward 100."
            - "Contract C1 PLACED, required_strong_hives=2, both placements CONFIRMED CONTRACT_GRADE, payout 58000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /apiaries"
              payload: { name: "CA Yard", state_code: "CA", latitude: 38.5, longitude: -121.5, max_yard_colonies: 50 }
              as: ApiaryManager
              captures: { ap_id: $.data.id }
            - call: "POST /apiaries/${ap_id}/registrations"
              payload: { registration_number: "CA-001", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z" }
              as: StateApiarist
              captures: { reg_id: $.data.id }
            - call: "POST /apiaries/${ap_id}/registrations/${reg_id}/approve"
              payload: {}
              as: StateApiarist
            - call: "POST /hives"
              payload: { apiary_id: "${ap_id}", tag: "H1", brood_frames: 5 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { h1_id: $.data.id }
            - call: "POST /hives/${h1_id}/inspections"
              payload: { inspected_at: "2026-01-06T00:00:00Z", mites_per_100_bees: 1.0, brood_frames_observed: 5, honey_frames_observed: 3, queen_seen: true }
              as: ApiaryManager
              as_user_id: "${ap_id}"
            - call: "POST /hives"
              payload: { apiary_id: "${ap_id}", tag: "H2", brood_frames: 5 }
              as: ApiaryManager
              as_user_id: "${ap_id}"
              captures: { h2_id: $.data.id }
            - call: "POST /hives/${h2_id}/inspections"
              payload: { inspected_at: "2026-01-06T00:00:00Z", mites_per_100_bees: 1.0, brood_frames_observed: 5, honey_frames_observed: 3, queen_seen: true }
              as: ApiaryManager
              as_user_id: "${ap_id}"
            - call: "POST /pollination-contracts"
              payload: { grower_name: "Almond Co", orchard_state_code: "CA", bloom_start: "2026-02-04T00:00:00Z", bloom_end: "2026-03-06T00:00:00Z", required_strong_hives: 2, max_hives_on_site: 4, base_rate_cents: 20000 }
              as: ContractCoordinator
              captures: { c1_id: $.data.id }
            - call: "POST /pollination-contracts/${c1_id}/sign"
              payload: {}
              as: ContractCoordinator
