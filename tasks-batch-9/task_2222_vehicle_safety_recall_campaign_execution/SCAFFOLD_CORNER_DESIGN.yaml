scaffold_corner_design:

  # ===========================================================================
  # Conventions used by every test_recipe below
  #   * The logical clock is pinned with POST /_clock/set_current_utc first.
  #   * Users: u-eng-1 / u-eng-2 (SafetyEngineer), u-comp-1 / u-comp-2
  #     (ComplianceOfficer), u-ops-1 (RecallOperationsManager), u-aud-1
  #     (ClaimsAuditor). DealerServiceManager calls always pass the Dealer id
  #     itself as as_user_id (identity: entity_backed:Dealer).
  #   * "BASE-FILED" prose shorthand = campaign 26V-1xx created, one or more
  #     build records loaded, an INCLUDE population rule published, defect
  #     determination recorded 2026-08-03T09:00:00Z, population run executed,
  #     DEFECT_NOTICE filed by u-comp-1 (campaign_status FILED).
  #   * Unknown-id literals use 00000000-0000-4000-8000-0000000009xx.
  # ===========================================================================

  - section: entities
    instances:

      - name: vehicle_creation_returns_201_with_all_input_fields_persisted
        claim_type: creation
        grounds:
          - entities.Vehicle
          - endpoints[POST /vehicles]
        distinguishing_aspect: |
          A build record is accepted on its own, with no campaign context at all: Vehicle is a
          standalone aggregate root, so POST /vehicles must succeed against an empty database and
          echo back every supplied build attribute unchanged.
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: RecallOperationsManager
          trigger:
            - call: "POST /vehicles"
              payload: { vin: "1HGCM82633A004352", plant_code: "PLT1", model_code: "MDLA", model_year: 2024, production_date: "2024-03-15", suspect_part_number: 1500, region_code: "NE", sale_status: "IN_DEALER_STOCK", in_service_date: "2024-05-02", owner_name: "Ann Vega", owner_address_valid: true }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
              captures: { veh1_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "response.data.vin == \"1HGCM82633A004352\""
            - "response.data.plant_code == \"PLT1\" and response.data.model_code == \"MDLA\" and response.data.model_year == 2024"
            - "response.data.production_date == \"2024-03-15\" and response.data.suspect_part_number == 1500"
            - "response.data.region_code == \"NE\" and response.data.sale_status == \"IN_DEALER_STOCK\""
            - "response.data.in_service_date == \"2024-05-02\" and response.data.owner_name == \"Ann Vega\" and response.data.owner_address_valid == true"
            - "response.data.stop_sale_hold == false"

      - name: campaign_retrieval_returns_stored_population_counters
        claim_type: retrieval
        grounds:
          - entities.RecallCampaign.fields.affected_vehicle_count
          - entities.RecallCampaign.fields.recall_population_count
          - endpoints[GET /recall-campaigns/{id}]
        distinguishing_aspect: |
          GET /recall-campaigns/{id} is a pure read: it returns the counters the population run
          already wrote (2 matched vehicles), and does not re-run matching, so the read is stable.
        test_recipe:
          setup:
            - "BASE-FILED with two NE build records inside the window; population run matched both."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-110", defect_type: "SAFETY_DEFECT", defect_description: "Inflator may rupture" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { camp_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "1HGCM82633A004352", plant_code: "PLT1", model_code: "MDLA", model_year: 2024, production_date: "2024-03-15", suspect_part_number: 1500, region_code: "NE", sale_status: "SOLD" }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
            - call: "POST /vehicles"
              payload: { vin: "1HGCM82633A004353", plant_code: "PLT1", model_code: "MDLA", model_year: 2024, production_date: "2024-03-16", suspect_part_number: 1501, region_code: "NE", sale_status: "SOLD" }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
            - call: "POST /recall-campaigns/${camp_id}/population-rules"
              payload: { inclusion_mode: "INCLUDE", plant_code: "PLT1", model_code: "MDLA", model_year: 2024, production_start_date: "2024-01-01", production_end_date: "2024-07-01", part_number_low: 1000, part_number_high: 1999 }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /recall-campaigns/${camp_id}/defect-determination"
              payload: { defect_determination_date: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /recall-campaigns/${camp_id}/population-runs"
              payload: {}
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
          trigger:
            - call: "GET /recall-campaigns/${camp_id}"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-aud-1"
          assert:
            - "HTTP status is 200"
            - "response.data.campaign_number == \"26V-110\""
            - "response.data.affected_vehicle_count == 2 and response.data.recall_population_count == 2"
            - "response.data.remedied_count == 0 and response.data.completion_rate_pct == 0.00"
            - "response.data.campaign_status == \"DEFECT_DETERMINED\" and response.data.remedy_status == \"REMEDY_UNDER_DEVELOPMENT\""

      - name: campaign_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /recall-campaigns]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three campaigns exist; limit=2/offset=0 must return exactly 2 rows with total_count 3 and
          has_more true, and the second page (offset=2) must return 1 row with has_more false --
          proving total_count counts the whole filtered set, not the page.
        test_recipe:
          setup:
            - "Three DRAFT campaigns 26V-121, 26V-122, 26V-123 exist; nothing else."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-121", defect_type: "SAFETY_DEFECT", defect_description: "Inflator may rupture" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-122", defect_type: "NONCOMPLIANCE", defect_description: "Lamp intensity below standard" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-123", defect_type: "SAFETY_DEFECT", defect_description: "Brake hose abrasion" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
          trigger:
            - call: "GET /recall-campaigns"
              payload: { limit: 2, offset: 0 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
            - call: "GET /recall-campaigns"
              payload: { limit: 2, offset: 2 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
          assert:
            - "the first trigger call returned HTTP 200 with exactly 2 elements in response.data"
            - "the first trigger call returned total_count == 3, limit == 2, offset == 0, has_more == true"
            - "the second trigger call returned exactly 1 element in response.data"
            - "the second trigger call returned total_count == 3, limit == 2, offset == 2, has_more == false"

      - name: campaign_retrieval_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_CAMPAIGN_NOT_FOUND]
          - endpoints[GET /recall-campaigns/{id}]
        distinguishing_aspect: |
          A well-formed but unused UUID in the path must produce 404 ERR_CAMPAIGN_NOT_FOUND, not an
          empty 200 body and not a 400 -- path-id resolution is priority 3, above ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
          trigger:
            - call: "GET /recall-campaigns/00000000-0000-4000-8000-000000000901"
              payload: {}
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "response.data.error_id == \"ERR_CAMPAIGN_NOT_FOUND\""

      - name: vehicle_creation_missing_required_vin_is_rejected
        claim_type: required_fields
        grounds:
          - entities.Vehicle.fields.vin
          - validations[priority=10]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          vin has source: input and no default, so omitting it is a shape error (400
          ERR_INVALID_REQUEST) decided before any domain lookup -- no Vehicle row is created.
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: RecallOperationsManager
          trigger:
            - call: "POST /vehicles"
              payload: { plant_code: "PLT1", model_code: "MDLA", model_year: 2024, production_date: "2024-03-15", suspect_part_number: 1500, region_code: "NE" }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 400"
            - "response.data.error_id == \"ERR_INVALID_REQUEST\""

      - name: campaign_creation_omitting_optional_fields_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.RecallCampaign.fields.risk_severity
          - entities.RecallCampaign.fields.campaign_status
          - entities.RecallCampaign.fields.remedy_status
          - entities.RecallCampaign.fields.remedy_effectiveness_score
        distinguishing_aspect: |
          With risk_severity and supersedes_campaign_id omitted, the campaign must come back
          MODERATE / DRAFT / REMEDY_UNDER_DEVELOPMENT with remedy_effectiveness_score 100.00 and
          every counter at zero -- the defaults, not nulls.
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
          trigger:
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-130", defect_type: "SAFETY_DEFECT", defect_description: "Inflator may rupture" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { camp_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "response.data.risk_severity == \"MODERATE\""
            - "response.data.campaign_status == \"DRAFT\" and response.data.remedy_status == \"REMEDY_UNDER_DEVELOPMENT\""
            - "response.data.remedy_effectiveness_score == 100.00 and response.data.completion_rate_pct == 0.00"
            - "response.data.days_late == 0 and response.data.late_filing_flag == false"
            - "response.data.stop_sale_flag == false and response.data.do_not_drive_flag == false"
            - "response.data.remedy_revision_count == 0 and response.data.quarterly_filing_count == 0 and response.data.open_followup_wave_count == 0"
            - "response.data.reimbursement_obligation_cents == 0 and response.data.supersedes_campaign_id is null"

      - name: remedy_part_creation_computes_unallocated_qty_from_total_procured
        claim_type: computed_fields
        grounds:
          - entities.RemedyPart.fields.unallocated_qty
          - entities.RemedyPart.fields.consumed_qty
          - entities.RemedyPart.fields.lead_time_days
        distinguishing_aspect: |
          unallocated_qty is computed, not supplied: a part procured at 100 units starts with
          unallocated_qty 100 and consumed_qty 0, and lead_time_days falls back to its default 30.
        test_recipe:
          setup:
            - "A DRAFT campaign 26V-140 exists; clock at 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-140", defect_type: "SAFETY_DEFECT", defect_description: "Inflator may rupture" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /recall-campaigns/${camp_id}/remedy-parts"
              payload: { part_number: "P-88123", unit_cost: 21.90, total_procured_qty: 100 }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { part_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "response.data.total_procured_qty == 100 and response.data.unallocated_qty == 100 and response.data.consumed_qty == 0"
            - "response.data.lead_time_days == 30"
            - "response.data.campaign_id == ${camp_id} and response.data.unit_cost == 21.90"

      - name: dealer_creation_stamps_system_id_timestamps_and_version
        claim_type: system_fields
        grounds:
          - entities.Dealer
          - entities.Dealer.fields.status
          - endpoints[POST /dealers]
        distinguishing_aspect: |
          Dealer declares common_fields: true, so the system -- not the caller -- supplies id,
          created_at, updated_at and version 1; status is ACTIVE and suspension_reason null.
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: RecallOperationsManager
          trigger:
            - call: "POST /dealers"
              payload: { dealer_code: "D-NE-01", name: "Vega Motors", region_code: "NE", labor_rate_per_hour: 138.74, monthly_repair_capacity: 40 }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
              captures: { dlr_id: $.data.id, dlr_v: $.data.version }
          assert:
            - "HTTP status is 201"
            - "response.data.id is a non-empty system-generated identifier and response.data.version == 1"
            - "response.data.created_at == \"2026-08-03T09:00:00Z\" and response.data.updated_at == \"2026-08-03T09:00:00Z\""
            - "response.data.status == \"ACTIVE\" and response.data.suspension_reason is null"

      - name: population_rule_with_equal_start_and_end_dates_is_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=29]
          - errors[ERR_INVALID_DATE_RANGE]
          - entities.VehiclePopulationRule.fields.production_start_date
        distinguishing_aspect: |
          The production window is half-open [start, end), so start == end describes an empty
          window; it must be refused with 422 ERR_INVALID_DATE_RANGE rather than stored as a rule
          that can never match a build record.
        test_recipe:
          setup:
            - "A DRAFT campaign 26V-150 exists; clock at 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-150", defect_type: "SAFETY_DEFECT", defect_description: "Inflator may rupture" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /recall-campaigns/${camp_id}/population-rules"
              payload: { inclusion_mode: "INCLUDE", plant_code: "PLT1", model_code: "MDLA", model_year: 2024, production_start_date: "2024-03-01", production_end_date: "2024-03-01", part_number_low: 1000, part_number_high: 1999 }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "response.data.error_id == \"ERR_INVALID_DATE_RANGE\""
            - "GET /recall-campaigns/${camp_id}/population-rules returns total_count == 0"

      - name: outreach_attempt_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.OutreachAttempt
          - endpoints[GET /affected-vehicles/{id}/outreach-attempts]
        distinguishing_aspect: |
          OutreachAttempt declares common_fields: false: the listed row carries only
          affected_vehicle_id / channel / outcome / attempt_number / attempted_at / note, with no
          version and no updated_at, and §1.5 exposes no PATCH or DELETE for it -- an outreach log
          entry can only be appended.
        test_recipe:
          setup:
            - "BASE-FILED with one NE build record matched into the population."
            - "One outreach attempt has been logged against the AffectedVehicle."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-160", defect_type: "SAFETY_DEFECT", defect_description: "Inflator may rupture" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { camp_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "1HGCM82633A004352", plant_code: "PLT1", model_code: "MDLA", model_year: 2024, production_date: "2024-03-15", suspect_part_number: 1500, region_code: "NE", sale_status: "SOLD" }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
              captures: { veh1_id: $.data.id }
            - call: "POST /recall-campaigns/${camp_id}/population-rules"
              payload: { inclusion_mode: "INCLUDE", plant_code: "PLT1", model_code: "MDLA", model_year: 2024, production_start_date: "2024-01-01", production_end_date: "2024-07-01", part_number_low: 1000, part_number_high: 1999 }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /recall-campaigns/${camp_id}/defect-determination"
              payload: { defect_determination_date: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /recall-campaigns/${camp_id}/population-runs"
              payload: {}
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
            - call: "GET /affected-vehicles"
              payload: { campaign_id: "${camp_id}", vehicle_id: "${veh1_id}" }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
              captures: { av1_id: "$.data[0].id" }
            - call: "POST /affected-vehicles/${av1_id}/outreach-attempts"
              payload: { channel: "PHONE", outcome: "NO_RESPONSE", note: "Left voicemail" }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
          trigger:
            - call: "GET /affected-vehicles/${av1_id}/outreach-attempts"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-aud-1"
          assert:
            - "HTTP status is 200 with total_count == 1"
            - "response.data[0].attempt_number == 1 and response.data[0].channel == \"PHONE\" and response.data[0].outcome == \"NO_RESPONSE\""
            - "response.data[0].attempted_at == \"2026-08-03T09:00:00Z\" and response.data[0].affected_vehicle_id == ${av1_id}"
            - "response.data[0] exposes no version field, no id field, no created_at field and no updated_at field"

      - name: owner_reimbursement_with_unknown_vehicle_returns_vehicle_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=11]
          - errors[ERR_VEHICLE_NOT_FOUND]
          - entities.OwnerReimbursementRequest.fields.vehicle_id
        distinguishing_aspect: |
          OwnerReimbursementRequest names its Vehicle parent in the request body, so an unused UUID
          there is a body-id 404 (ERR_VEHICLE_NOT_FOUND at priority 11) -- resolved before the
          in-population check at priority 26 and before any reimbursement arithmetic.
        test_recipe:
          setup:
            - "BASE-FILED for campaign 26V-170 (one matched NE build record)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-170", defect_type: "SAFETY_DEFECT", defect_description: "Inflator may rupture" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { camp_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "1HGCM82633A004352", plant_code: "PLT1", model_code: "MDLA", model_year: 2024, production_date: "2024-03-15", suspect_part_number: 1500, region_code: "NE", sale_status: "SOLD" }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
            - call: "POST /recall-campaigns/${camp_id}/population-rules"
              payload: { inclusion_mode: "INCLUDE", plant_code: "PLT1", model_code: "MDLA", model_year: 2024, production_start_date: "2024-01-01", production_end_date: "2024-07-01", part_number_low: 1000, part_number_high: 1999 }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /recall-campaigns/${camp_id}/defect-determination"
              payload: { defect_determination_date: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /recall-campaigns/${camp_id}/population-runs"
              payload: {}
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
          trigger:
            - call: "POST /owner-reimbursements"
              payload: { campaign_id: "${camp_id}", vehicle_id: "00000000-0000-4000-8000-000000000902", invoice_date: "2026-07-15", invoice_amount: 412.75, labor_hours_claimed: 1.30 }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "response.data.error_id == \"ERR_VEHICLE_NOT_FOUND\""
            - "GET /owner-reimbursements with campaign_id == ${camp_id} returns total_count == 0"

      - name: repair_claim_naming_another_campaigns_labor_operation_is_rejected
        claim_type: foreign_key_validated
        grounds:
          - validations[priority=27]
          - errors[ERR_PART_CAMPAIGN_MISMATCH]
          - entities.RepairClaim.fields.labor_operation_id
        distinguishing_aspect: |
          entity_topology is flat, so a RepairClaim can syntactically point at a LaborOperation
          belonging to a different campaign. The labor op's window DOES contain repair_date, so the
          temporal check at priority 25 passes and the cross-campaign integrity check at priority 27
          is the one that must fire (422 ERR_PART_CAMPAIGN_MISMATCH).
        test_recipe:
          setup:
            - "Campaign A = 26V-180 is BASE-FILED, remedy released 2026-08-03 with its own R180-01 (2026-08-01..2027-12-31), part P-88180 (100 units), dealer D-NE-01 holding a 1-unit ALLOCATED allocation."
            - "Campaign B = 26V-181 is a separate DRAFT campaign carrying LaborOperation R181-01 with flat_hours 1.10 effective 2026-08-01..2027-12-31 -- a window that also contains 2026-08-03."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
