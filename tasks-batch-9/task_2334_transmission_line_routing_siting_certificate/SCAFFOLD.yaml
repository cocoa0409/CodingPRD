  - method: GET
    path: "/siting/hearing-sessions"
    description: "List hearing sessions (filtered-list FK reverse lookup for HearingSession.application_id)"
    roles: *all_roles
    code: 200
    input: ["application_id?", "kind?", "status?", "limit?", "offset?"]
    output: HearingSession[]
    side_effects: []

  - method: GET
    path: "/siting/certificate-conditions"
    description: "List certificate conditions (filtered-list FK reverse lookup for CertificateCondition.certificate_id)"
