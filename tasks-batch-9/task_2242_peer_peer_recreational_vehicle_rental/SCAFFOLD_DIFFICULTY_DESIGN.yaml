            - *c_verify_reg
            - *c_verify_ins
            - *c_submit
            - *c_list_approve
            - *c_fund
            - *c_booking
            - *c_bk_approve
            - *c_bk_confirm
            - *c_read_pre
            - *c_tp_pre_front
            - *c_tp_pre_rear
            - *c_tp_pre_interior
            - *c_tp_pre_roof
            - *c_tp_pre_under
            - *c_bk_start
            - &c_get_booking
              call: "GET /rv-marketplace/bookings/${booking_id}"
              as: PlatformAdmin
            - *c_read_mid
            - *c_read_post
            - *c_tp_post_front
            - *c_tp_post_rear
            - *c_tp_post_interior
