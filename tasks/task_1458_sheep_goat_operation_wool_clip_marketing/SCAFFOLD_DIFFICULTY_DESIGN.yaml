# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Sheep & Goat Operation & Wool Clip Marketing
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and is replayable from
# empty-DB via its setup_api_calls chain.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc: two calculations, different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: wool_lot_provisional_vs_certified_value
        grounds:
          - calculations.lot_value
          - calculations.wool_grade_classify
          - entities.WoolLot.fields.effective_value_cents
          - state_machines.CoreTest.RESULTED_to_LOCKED
        distinguishing_aspect: |
          Wool valuation domain: the provisional variant prices GREASY lbs from the
          estimated grade (100.0 lbs * 330 = 33000 cents), while the certified variant
          prices CLEAN lbs from the locked core test (100.0 * 0.62 clean lbs * 720 =
          44640 cents) — different formulas on the same WoolLot rows, unlike the
          livestock-sale variant pair which lives on LivestockSale.
        test_recipe:
          setup:
            - "Flock F (SHEEP, baseline 500); crew C; shearing event completed with greasy 200.0 / skirtings 20.0 lbs"
            - "WoolLot L1 = 100.0 lbs graded at estimated_micron 20.0 (FINE); no core test yet"
            - "Then a CoreTest is resulted (micron 19.0, yield 62.0, VM 1.2) and LOCKED by a different user"
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "DV Ranch", species: "SHEEP", baseline_headcount: 500, guardian_dog_count: 2 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/shearing-crews", payload: { crew_name: "Crew DV", head_per_day_capacity: 300, daily_rate_cents: 40000 }, as: RanchManager, captures: { cr: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/shearing-events", payload: { flock_id: "${fl}", crew_id: "${cr}", scheduled_start: "2026-08-03T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", expected_head: 400 }, as: RanchManager, captures: { ev: $.data.id } }
            - { call: "POST /api/shearing-events/${ev}/transitions", payload: { to: "IN_PROGRESS" }, as: RangeHand }
            - { call: "POST /api/shearing-events/${ev}/complete", payload: { shorn_head_count: 400, greasy_weight_lbs: 200.0, skirtings_weight_lbs: 20.0 }, as: RangeHand }
            - { call: "GET /api/wool-clips", payload: { shearing_event_id: "${ev}" }, as: RanchManager, captures: { clip: "$.data[0].id" } }
            - { call: "POST /api/wool-lots", payload: { clip_id: "${clip}", lot_code: "L1", weight_lbs: 100.0 }, as: RanchManager, captures: { lot: $.data.id } }
            - { call: "POST /api/wool-lots/${lot}/grade", payload: { estimated_micron: 20.0 }, as: RanchManager }
            - { call: "POST /api/core-tests", payload: { lot_id: "${lot}", lab_ref: "LAB-DV-1" }, as: WoolPoolOperator, as_user_id: "wpo-1", captures: { ct: $.data.id } }
            - { call: "POST /api/core-tests/${ct}/results", payload: { measured_micron: 19.0, clean_yield_pct: 62.0, vegetable_matter_pct: 1.2 }, as: WoolPoolOperator, as_user_id: "wpo-1" }
          trigger:
            - { call: "POST /api/core-tests/${ct}/transitions", payload: { to: "LOCKED" }, as: RanchManager, as_user_id: "rm-1" }
          assert:
            - "Before lock: WoolLot.${lot}.provisional_value_cents == 33000 and grade_code == FINE and certified_value_cents == null"
            - "After lock: WoolLot.${lot}.grade_code == SUPERFINE (certified 19.0 < 19.5)"
            - "After lock: WoolLot.${lot}.certified_value_cents == 44640"
            - "After lock: WoolLot.${lot}.effective_value_cents == 44640 (certified supersedes provisional 33000)"

      - name: meat_sale_booked_vs_settled_price
        grounds:
          - calculations.sale_price
          - calculations.holiday_premium_selection
          - state_machines.LivestockSale
          - entities.LivestockSale.fields.settled_price_cents
        distinguishing_aspect: |
          Livestock-sale pricing domain (distinct from wool-lot valuation): the booked
          variant prices the offered head_count * avg_weight_lbs (4099200 cents) while
          the settled variant reprices the actual scale weight at delivery (3996720
          cents) — same sale, same holiday window, different outputs.
        test_recipe:
          setup:
            - "Flock (SHEEP, baseline 500), no treatments (withdrawal_until null)"
            - "HolidayWindow EID_AL_ADHA 2026-09-01 <= date < 2026-09-15, premium 22%, min_head 50"
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "DV Meats", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/holiday-windows", payload: { holiday_name: "EID_AL_ADHA", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-15T00:00:00Z", premium_pct: 22.0, min_head: 50 }, as: RanchManager }
          trigger:
            - { call: "POST /api/livestock-sales", payload: { flock_id: "${fl}", sale_type: "MEAT", channel: "ETHNIC_MARKET", head_count: 100, avg_weight_lbs: 120.0, base_price_per_cwt_cents: 28000, scheduled_date: "2026-09-05T00:00:00Z" }, as: RanchManager, captures: { sale: $.data.id } }
            - { call: "POST /api/livestock-sales/${sale}/record-payment", payload: { amount_cents: 4099200 }, as: RanchManager }
            - { call: "POST /api/livestock-sales/${sale}/load", payload: {}, as: RangeHand }
            - { call: "POST /api/livestock-sales/${sale}/deliver", payload: { actual_total_weight_lbs: 11700.0 }, as: RangeHand }
          assert:
            - "LivestockSale.${sale}.booked_price_cents == 4099200 (gross 3360000 + premium 739200)"
            - "LivestockSale.${sale}.applied_holiday_name == EID_AL_ADHA and premium_pct_applied == 22.0"
            - "LivestockSale.${sale}.settled_price_cents == 3996720 (gross 3276000 + premium 720720)"
            - "LivestockSale.${sale}.settled_price_cents != LivestockSale.${sale}.booked_price_cents"
            - "Flock.${fl}.current_headcount == 400 (500 - 100 delivered MEAT head)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula: three instances, modes (a), (b), (c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: sale_pricing_channel_branch_with_commission_cap
        grounds:
          - calculations.sale_price
          - calculations.holiday_premium_selection
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: the AUCTION channel branch
          applies MIN(round(gross*3.5%), 15000) (cap branch engaged: 117600 -> 15000)
          while the ETHNIC_MARKET premium branch is simultaneously suppressed despite
          the scheduled date falling inside a holiday window (channel gate).
        test_recipe:
          setup:
            - "Flock (SHEEP, baseline 500); EID_AL_ADHA window 2026-09-01..2026-09-15 exists but must NOT apply to AUCTION"
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Auction Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/holiday-windows", payload: { holiday_name: "EID_AL_ADHA", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-15T00:00:00Z", premium_pct: 22.0, min_head: 50 }, as: RanchManager }
          trigger:
            - { call: "POST /api/livestock-sales", payload: { flock_id: "${fl}", sale_type: "MEAT", channel: "AUCTION", head_count: 100, avg_weight_lbs: 120.0, base_price_per_cwt_cents: 28000, scheduled_date: "2026-09-05T00:00:00Z" }, as: RanchManager, captures: { sale: $.data.id } }
          assert:
            - "LivestockSale.${sale}.booked_price_cents == 3345000 (gross 3360000 - commission capped at 15000)"
            - "LivestockSale.${sale}.premium_pct_applied == 0 and applied_holiday_name == null despite the in-window scheduled_date"

      - name: pool_statement_rounds_per_lot_then_sums
        grounds:
          - calculations.pool_settlement
          - calculations.pool_fee_tier
          - calculations.consignment_advance
        distinguishing_aspect: |
          Mode (b) — pinned nested rounding order: each lot's fee is rounded to integer
          cents at settlement (6586.645 -> 6587; 6506.565 -> 6507) and the statement
          sums those rounded per-lot values (total fee 13094, total settlement 169510);
          summing unrounded values first would yield fee 13093 and settlement 169511.
        test_recipe:
          setup:
            - "Flock (SHEEP, baseline 500); clip with lotA 50.0 lbs (FINE, provisional 16500) and lotB 40.0 lbs (MEDIUM, provisional 10400)"
            - "Both consigned to pool WWPA-R2, advanced, sold (gross 101333 and 100101), settled; total consigned weight 90 lbs -> tier 6.5%"
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Rounding Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/shearing-crews", payload: { crew_name: "Crew R", head_per_day_capacity: 300, daily_rate_cents: 40000 }, as: RanchManager, captures: { cr: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/shearing-events", payload: { flock_id: "${fl}", crew_id: "${cr}", scheduled_start: "2026-08-03T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", expected_head: 400 }, as: RanchManager, captures: { ev: $.data.id } }
            - { call: "POST /api/shearing-events/${ev}/transitions", payload: { to: "IN_PROGRESS" }, as: RangeHand }
            - { call: "POST /api/shearing-events/${ev}/complete", payload: { shorn_head_count: 400, greasy_weight_lbs: 120.0, skirtings_weight_lbs: 10.0 }, as: RangeHand }
            - { call: "GET /api/wool-clips", payload: { shearing_event_id: "${ev}" }, as: RanchManager, captures: { clip: "$.data[0].id" } }
            - { call: "POST /api/wool-lots", payload: { clip_id: "${clip}", lot_code: "RA", weight_lbs: 50.0 }, as: RanchManager, captures: { lotA: $.data.id } }
            - { call: "POST /api/wool-lots", payload: { clip_id: "${clip}", lot_code: "RB", weight_lbs: 40.0 }, as: RanchManager, captures: { lotB: $.data.id } }
            - { call: "POST /api/wool-lots/${lotA}/grade", payload: { estimated_micron: 20.0 }, as: RanchManager }
            - { call: "POST /api/wool-lots/${lotB}/grade", payload: { estimated_micron: 23.0 }, as: RanchManager }
            - { call: "POST /api/consignments", payload: { lot_id: "${lotA}", pool_ref: "WWPA-R2" }, as: RanchManager, captures: { conA: $.data.id } }
            - { call: "POST /api/consignments", payload: { lot_id: "${lotB}", pool_ref: "WWPA-R2" }, as: RanchManager, captures: { conB: $.data.id } }
            - { call: "POST /api/consignments/${conA}/transitions", payload: { to: "ACCEPTED" }, as: WoolPoolOperator }
            - { call: "POST /api/consignments/${conB}/transitions", payload: { to: "ACCEPTED" }, as: WoolPoolOperator }
            - { call: "POST /api/consignments/${conA}/transitions", payload: { to: "ADVANCED" }, as: WoolPoolOperator }
            - { call: "POST /api/consignments/${conB}/transitions", payload: { to: "ADVANCED" }, as: WoolPoolOperator }
            - { call: "POST /api/consignments/${conA}/sell", payload: { sale_gross_cents: 101333 }, as: WoolPoolOperator }
            - { call: "POST /api/consignments/${conB}/sell", payload: { sale_gross_cents: 100101 }, as: WoolPoolOperator }
            - { call: "POST /api/consignments/${conA}/transitions", payload: { to: "SETTLED" }, as: WoolPoolOperator }
            - { call: "POST /api/consignments/${conB}/transitions", payload: { to: "SETTLED" }, as: WoolPoolOperator }
          trigger:
            - { call: "GET /api/pool-statements/WWPA-R2", payload: {}, as: RanchManager }
          assert:
            - "Consignment.${conA}: advance_cents == 11550, pool_fee_cents == 6587, settlement_cents == 83196"
            - "Consignment.${conB}: advance_cents == 7280, pool_fee_cents == 6507, settlement_cents == 86314"
            - "Pool statement WWPA-R2: consignment_count == 2, total_sale_gross_cents == 201434, total_pool_fee_cents == 13094, total_advance_cents == 18830, total_settlement_cents == 169510"
            - "169510 != 169511 (the sum-then-round trap value)"

      - name: pool_fee_tier_counts_own_weight
        grounds:
          - calculations.pool_fee_tier
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order: the
          settling lot's own 600 lbs pushes the ranch's pool total from 9500 lbs
          (tier 6.5%) to 10100 lbs (tier 5.0%); the fee is computed with the tier
          selected AFTER including the current lot, not before.
        test_recipe:
          setup:
            - "Flock (SHEEP, baseline 2000); clip greasy 10500.0 / skirtings 0.0"
            - "lotC 9500 lbs (MEDIUM, provisional 2470000) consigned to WWPA-T, advanced, sold at 2000000, settled first at tier 6.5%"
            - "lotD 600 lbs (MEDIUM, provisional 156000) then consigned to WWPA-T, advanced, sold at 130000, settled"
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Tier Ranch", species: "SHEEP", baseline_headcount: 2000 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/shearing-crews", payload: { crew_name: "Crew T", head_per_day_capacity: 1000, daily_rate_cents: 90000 }, as: RanchManager, captures: { cr: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/shearing-events", payload: { flock_id: "${fl}", crew_id: "${cr}", scheduled_start: "2026-08-03T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", expected_head: 2000 }, as: RanchManager, captures: { ev: $.data.id } }
            - { call: "POST /api/shearing-events/${ev}/transitions", payload: { to: "IN_PROGRESS" }, as: RangeHand }
            - { call: "POST /api/shearing-events/${ev}/complete", payload: { shorn_head_count: 2000, greasy_weight_lbs: 10500.0, skirtings_weight_lbs: 0.0 }, as: RangeHand }
            - { call: "GET /api/wool-clips", payload: { shearing_event_id: "${ev}" }, as: RanchManager, captures: { clip: "$.data[0].id" } }
            - { call: "POST /api/wool-lots", payload: { clip_id: "${clip}", lot_code: "TC", weight_lbs: 9500.0 }, as: RanchManager, captures: { lotC: $.data.id } }
            - { call: "POST /api/wool-lots", payload: { clip_id: "${clip}", lot_code: "TD", weight_lbs: 600.0 }, as: RanchManager, captures: { lotD: $.data.id } }
            - { call: "POST /api/wool-lots/${lotC}/grade", payload: { estimated_micron: 23.0 }, as: RanchManager }
            - { call: "POST /api/wool-lots/${lotD}/grade", payload: { estimated_micron: 23.0 }, as: RanchManager }
            - { call: "POST /api/consignments", payload: { lot_id: "${lotC}", pool_ref: "WWPA-T" }, as: RanchManager, captures: { conC: $.data.id } }
            - { call: "POST /api/consignments/${conC}/transitions", payload: { to: "ACCEPTED" }, as: WoolPoolOperator }
            - { call: "POST /api/consignments/${conC}/transitions", payload: { to: "ADVANCED" }, as: WoolPoolOperator }
            - { call: "POST /api/consignments/${conC}/sell", payload: { sale_gross_cents: 2000000 }, as: WoolPoolOperator }
            - { call: "POST /api/consignments/${conC}/transitions", payload: { to: "SETTLED" }, as: WoolPoolOperator }
            - { call: "POST /api/consignments", payload: { lot_id: "${lotD}", pool_ref: "WWPA-T" }, as: RanchManager, captures: { conD: $.data.id } }
            - { call: "POST /api/consignments/${conD}/transitions", payload: { to: "ACCEPTED" }, as: WoolPoolOperator }
            - { call: "POST /api/consignments/${conD}/transitions", payload: { to: "ADVANCED" }, as: WoolPoolOperator }
            - { call: "POST /api/consignments/${conD}/sell", payload: { sale_gross_cents: 130000 }, as: WoolPoolOperator }
          trigger:
            - { call: "POST /api/consignments/${conD}/transitions", payload: { to: "SETTLED" }, as: WoolPoolOperator }
          assert:
            - "Consignment.${conC}: pool_fee_cents == 130000 (9500 lbs alone -> 6.5%), settlement_cents == 141000"
            - "Consignment.${conD}: pool_fee_cents == 6500 (9500 + 600 = 10100 lbs INCLUDING itself -> 5.0%)"
            - "Consignment.${conD}: settlement_cents == 14300 (130000 - 6500 - 109200)"
            - "6500 != 8450 (the 6.5% fee that excluding-own-weight would produce)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine: cycle / parallel dims / negotiation cycle
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: wool_lot_regrade_and_reconsign_cycles
        grounds:
          - state_machines.WoolLot.GRADED_to_REGRADING
          - state_machines.WoolLot.REGRADING_to_GRADED
          - state_machines.WoolLot.CONSIGNED_to_WITHDRAWN
          - state_machines.WoolLot.WITHDRAWN_to_CONSIGNED
        distinguishing_aspect: |
          WoolLot exhibits TWO cycles on one entity (GRADED->REGRADING->GRADED and
          CONSIGNED->WITHDRAWN->CONSIGNED); the regrade changes grade_code from FINE
          to SUPERFINE and reprices the lot mid-loop, and re-consignment after
          withdrawal creates a second Consignment on the same lot.
        test_recipe:
          setup:
            - "Flock (SHEEP, 500); clip greasy 200.0 / skirtings 20.0; lot L1 100.0 lbs"
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Cycle Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/shearing-crews", payload: { crew_name: "Crew CY", head_per_day_capacity: 300, daily_rate_cents: 40000 }, as: RanchManager, captures: { cr: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/shearing-events", payload: { flock_id: "${fl}", crew_id: "${cr}", scheduled_start: "2026-08-03T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", expected_head: 400 }, as: RanchManager, captures: { ev: $.data.id } }
            - { call: "POST /api/shearing-events/${ev}/transitions", payload: { to: "IN_PROGRESS" }, as: RangeHand }
            - { call: "POST /api/shearing-events/${ev}/complete", payload: { shorn_head_count: 400, greasy_weight_lbs: 200.0, skirtings_weight_lbs: 20.0 }, as: RangeHand }
            - { call: "GET /api/wool-clips", payload: { shearing_event_id: "${ev}" }, as: RanchManager, captures: { clip: "$.data[0].id" } }
            - { call: "POST /api/wool-lots", payload: { clip_id: "${clip}", lot_code: "L1", weight_lbs: 100.0 }, as: RanchManager, captures: { lot: $.data.id } }
            - { call: "POST /api/wool-lots/${lot}/grade", payload: { estimated_micron: 20.0 }, as: RanchManager }
            - { call: "POST /api/wool-lots/${lot}/transitions", payload: { to: "REGRADING" }, as: RanchManager, captures: { lot_v3: $.data.version } }
          trigger:
            - { call: "POST /api/wool-lots/${lot}/regrade", payload: { estimated_micron: 18.0, expected_wool_lot_version: "${lot_v3}" }, as: RanchManager }
            - { call: "POST /api/consignments", payload: { lot_id: "${lot}", pool_ref: "WWPA-CYC" }, as: RanchManager, captures: { con1: $.data.id } }
            - { call: "POST /api/consignments/${con1}/transitions", payload: { to: "ACCEPTED" }, as: WoolPoolOperator }
            - { call: "POST /api/consignments/${con1}/transitions", payload: { to: "WITHDRAWN" }, as: RanchManager }
            - { call: "POST /api/consignments", payload: { lot_id: "${lot}", pool_ref: "WWPA-CYC2" }, as: RanchManager, captures: { con2: $.data.id } }
          assert:
            - "After regrade: WoolLot.${lot}.lot_status == GRADED, grade_code == SUPERFINE, provisional_value_cents == 38000 (was 33000 at FINE)"
            - "After first withdraw: WoolLot.${lot}.lot_status == WITHDRAWN and Consignment.${con1}.consignment_status == WITHDRAWN"
            - "After re-consign: WoolLot.${lot}.lot_status == CONSIGNED and Consignment.${con2}.consignment_status == TENDERED (second consignment on the same lot)"

      - name: livestock_sale_parallel_payment_delivery_dimensions
        grounds:
          - state_machines.LivestockSale
          - entities.LivestockSale.fields.payment_status
          - entities.LivestockSale.fields.delivery_status
        distinguishing_aspect: |
          LivestockSale carries two independent state dimensions on one row: paying
          moves payment UNPAID->PAID while delivery stays PENDING, and loading is
          gated on payment PAID (ERR_SALE_UNPAID otherwise) — a parallel-dimensions
          machine, distinct from WoolLot's revision cycles and the contract's
          negotiation loop.
        test_recipe:
          setup:
            - "Flock (GOAT, baseline 500); BREEDING sale of 10 head at 45000 cents/head"
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Boer Goats", species: "GOAT", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/livestock-sales", payload: { flock_id: "${fl}", sale_type: "BREEDING", channel: "DIRECT", head_count: 10, per_head_price_cents: 45000, scheduled_date: "2026-09-05T00:00:00Z" }, as: RanchManager, captures: { sale: $.data.id } }
          trigger:
            - { call: "POST /api/livestock-sales/${sale}/load", payload: {}, as: RangeHand, captures: { err: $.data.error_id } }
            - { call: "POST /api/livestock-sales/${sale}/record-payment", payload: { amount_cents: 450000 }, as: RanchManager }
            - { call: "POST /api/livestock-sales/${sale}/load", payload: {}, as: RangeHand }
            - { call: "POST /api/livestock-sales/${sale}/deliver", payload: { actual_head_delivered: 9 }, as: RangeHand }
          assert:
            - "First load rejected: error_id == ERR_SALE_UNPAID (409) and delivery_status stays PENDING"
            - "After record-payment: payment_status == PAID while delivery_status == PENDING (dimensions independent)"
            - "After deliver: delivery_status == DELIVERED, settled_price_cents == 405000 (9 * 45000), booked_price_cents == 450000"
            - "Flock.${fl}.current_headcount == 491 (500 - 9 delivered BREEDING head)"

      - name: grazing_contract_negotiation_cycle
        grounds:
          - state_machines.GrazingContract.PROPOSED_to_COUNTERED
          - state_machines.GrazingContract.COUNTERED_to_PROPOSED
          - state_machines.GrazingContract.COUNTERED_to_ACCEPTED
          - concurrency_rules[contract-counter-stale-version]
        distinguishing_aspect: |
          GrazingContract loops PROPOSED->COUNTERED->PROPOSED->COUNTERED before
          ACCEPTED — a negotiation cycle with role-alternating transitions (client
          counters, ranch re-proposes, ranch accepts the counter) and terms_version
          increments per counter; distinct machine shape from WoolLot and LivestockSale.
        test_recipe:
          setup:
            - "Flock (SHEEP, baseline 800); contract window 2026-09-01..2026-09-30, rate 100, min_head 50, max_head 600, target 70"
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Contract Ranch", species: "SHEEP", baseline_headcount: 800 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/grazing-contracts", payload: { flock_id: "${fl}", client_org_name: "City Weed Board", parcel_name: "North 40", service_window_start: "2026-09-01T00:00:00Z", service_window_end: "2026-09-30T00:00:00Z", rate_per_head_day_cents: 100, min_head: 50, max_head: 600, target_cover_reduction_pct: 70.0 }, as: RanchManager, captures: { gc: $.data.id } }
            - { call: "POST /api/grazing-contracts/${gc}/transitions", payload: { to: "PROPOSED" }, as: RanchManager, captures: { gc_v2: $.data.version } }
          trigger:
            - { call: "POST /api/grazing-contracts/${gc}/counter", payload: { expected_grazing_contract_version: "${gc_v2}", rate_per_head_day_cents: 120 }, as: GrazingClient, captures: { gc_v3: $.data.version, tv1: $.data.terms_version } }
            - { call: "POST /api/grazing-contracts/${gc}/transitions", payload: { to: "PROPOSED" }, as: RanchManager, captures: { gc_v4: $.data.version } }
            - { call: "POST /api/grazing-contracts/${gc}/counter", payload: { expected_grazing_contract_version: "${gc_v4}", rate_per_head_day_cents: 110 }, as: GrazingClient, captures: { tv2: $.data.terms_version } }
            - { call: "POST /api/grazing-contracts/${gc}/transitions", payload: { to: "ACCEPTED" }, as: RanchManager }
          assert:
            - "terms_version == 2 after first counter and == 3 after second counter"
            - "rate_per_head_day_cents == 120 after first counter, == 110 after second counter"
            - "Final contract_status == ACCEPTED (ranch accepted the client's counter from COUNTERED)"
            - "GrazingContract.${gc}.contract_status path was DRAFT -> PROPOSED -> COUNTERED -> PROPOSED -> COUNTERED -> ACCEPTED"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade: depth-3 (loss verify) and depth-2 (test lock)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: loss_verify_cascade_headcount_breach_moves
        grounds:
          - state_machines.LossReport.UNDER_REVIEW_to_VERIFIED
          - calculations.flock_headcount_reconciliation
          - entities.GrazingContract.fields.breach_flag
          - state_machines.GrazingMove.PLANNED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 cascade from the VERIFY trigger: LossReport -> Flock.current_headcount
          (140) -> GrazingContract.breach_flag (140 < min_head 150) -> PLANNED contract
          GrazingMove auto-CANCELLED; each link is caused by the previous link's
          mutation, and the own-ranch PLANNED move is untouched (conditional scope).
        test_recipe:
          setup:
            - "Flock (SHEEP, baseline 200); ACTIVE grazing contract (min_head 150) with one PLANNED contract move"
            - "One unrelated own-ranch PLANNED move on a pasture"
            - "LossReport of 60 head (COYOTE) taken UNDER_REVIEW"
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Cascade Ranch", species: "SHEEP", baseline_headcount: 200, guardian_dog_count: 3 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/grazing-contracts", payload: { flock_id: "${fl}", client_org_name: "Fire District", parcel_name: "Fuel Break 7", service_window_start: "2026-09-01T00:00:00Z", service_window_end: "2026-09-30T00:00:00Z", rate_per_head_day_cents: 100, min_head: 150, max_head: 600, target_cover_reduction_pct: 70.0 }, as: RanchManager, captures: { gc: $.data.id } }
            - { call: "POST /api/grazing-contracts/${gc}/transitions", payload: { to: "PROPOSED" }, as: RanchManager }
            - { call: "POST /api/grazing-contracts/${gc}/transitions", payload: { to: "ACCEPTED" }, as: GrazingClient }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/grazing-contracts/${gc}/transitions", payload: { to: "ACTIVE" }, as: RanchManager }
            - { call: "POST /api/pastures", payload: { pasture_name: "Home Pivot", acres: 640.0, carrying_capacity_head: 500 }, as: RanchManager, captures: { pas: $.data.id } }
            - { call: "POST /api/grazing-moves", payload: { flock_id: "${fl}", pasture_id: "${pas}", move_start: "2026-09-12T00:00:00Z", move_end: "2026-09-20T00:00:00Z", head_count: 100 }, as: RangeHand, captures: { mv_home: $.data.id } }
            - { call: "POST /api/grazing-moves", payload: { flock_id: "${fl}", contract_id: "${gc}", move_start: "2026-09-12T00:00:00Z", move_end: "2026-09-25T00:00:00Z", head_count: 180 }, as: RangeHand, captures: { mv_contract: $.data.id } }
            - { call: "POST /api/loss-reports", payload: { flock_id: "${fl}", loss_date: "2026-09-09T00:00:00Z", head_lost: 60, predator_type: "COYOTE", guardian_on_duty: true }, as: RangeHand, captures: { lr: $.data.id } }
            - { call: "POST /api/loss-reports/${lr}/transitions", payload: { to: "UNDER_REVIEW" }, as: RanchManager }
          trigger:
            - { call: "POST /api/loss-reports/${lr}/transitions", payload: { to: "VERIFIED" }, as: RanchManager }
          assert:
            - "LossReport.${lr}.report_status == VERIFIED"
            - "Flock.${fl}.current_headcount == 140 (200 - 60)"
            - "GrazingContract.${gc}.breach_flag == true (140 < min_head 150) and contract_status still ACTIVE"
            - "GrazingMove.${mv_contract}.move_status == CANCELLED (breach cascade)"
            - "GrazingMove.${mv_home}.move_status == PLANNED (own-ranch move not linked to the breached contract is untouched)"

      - name: core_test_lock_repricing_cascade
        grounds:
          - state_machines.CoreTest.RESULTED_to_LOCKED
          - calculations.lot_value
          - entities.Consignment.fields.pending_clawback_cents
        distinguishing_aspect: |
          Depth-2 cascade from the LOCK trigger: CoreTest LOCKED -> WoolLot certified
          fields + grade recompute (FINE 33000 -> MEDIUM 28600) -> open Consignment in
          ADVANCED repriced with pending_clawback_cents 3080; a different triggering
          transition than the loss-verify cascade.
        test_recipe:
          setup:
            - "Flock (SHEEP, 500); clip; lot L1 100.0 lbs FINE (provisional 33000)"
            - "Consignment ADVANCED with advance_cents 23100 (0.70 * 33000)"
            - "CoreTest RESULTED with micron 24.0 (MEDIUM), yield 55.0"
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Lock Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/shearing-crews", payload: { crew_name: "Crew L", head_per_day_capacity: 300, daily_rate_cents: 40000 }, as: RanchManager, captures: { cr: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/shearing-events", payload: { flock_id: "${fl}", crew_id: "${cr}", scheduled_start: "2026-08-03T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", expected_head: 400 }, as: RanchManager, captures: { ev: $.data.id } }
            - { call: "POST /api/shearing-events/${ev}/transitions", payload: { to: "IN_PROGRESS" }, as: RangeHand }
            - { call: "POST /api/shearing-events/${ev}/complete", payload: { shorn_head_count: 400, greasy_weight_lbs: 200.0, skirtings_weight_lbs: 20.0 }, as: RangeHand }
            - { call: "GET /api/wool-clips", payload: { shearing_event_id: "${ev}" }, as: RanchManager, captures: { clip: "$.data[0].id" } }
            - { call: "POST /api/wool-lots", payload: { clip_id: "${clip}", lot_code: "L1", weight_lbs: 100.0 }, as: RanchManager, captures: { lot: $.data.id } }
            - { call: "POST /api/wool-lots/${lot}/grade", payload: { estimated_micron: 20.0 }, as: RanchManager }
            - { call: "POST /api/consignments", payload: { lot_id: "${lot}", pool_ref: "WWPA-LOCK" }, as: RanchManager, captures: { con: $.data.id } }
            - { call: "POST /api/consignments/${con}/transitions", payload: { to: "ACCEPTED" }, as: WoolPoolOperator }
            - { call: "POST /api/consignments/${con}/transitions", payload: { to: "ADVANCED" }, as: WoolPoolOperator, captures: { con_v: $.data.version } }
            - { call: "POST /api/core-tests", payload: { lot_id: "${lot}", lab_ref: "LAB-L1" }, as: WoolPoolOperator, as_user_id: "wpo-1", captures: { ct: $.data.id } }
            - { call: "POST /api/core-tests/${ct}/results", payload: { measured_micron: 24.0, clean_yield_pct: 55.0, vegetable_matter_pct: 2.0 }, as: WoolPoolOperator, as_user_id: "wpo-1" }
          trigger:
            - { call: "POST /api/core-tests/${ct}/transitions", payload: { to: "LOCKED" }, as: RanchManager, as_user_id: "rm-1" }
          assert:
            - "WoolLot.${lot}: certified_micron == 24.0, grade_code == MEDIUM, certified_value_cents == 28600 (100.0 * 0.55 * 520)"
            - "Consignment.${con}.pending_clawback_cents == 3080 (23100 - round(0.70 * 28600) = 23100 - 20020)"
            - "Consignment.${con}.version > ${con_v} (cascade bumped the consignment)"
            - "Consignment.${con}.consignment_status == ADVANCED (cascade reprices; it does not move the machine)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict: two different category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: retired_flock_state_beats_withdrawal_safety
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - state_machines.Flock.ACTIVE_to_RETIRED
        distinguishing_aspect: |
          Category pair state(5) vs business_safety(7): the sale request violates both
          (flock RETIRED; MEAT scheduled_date 2026-08-20 < withdrawal_until 2026-10-01)
          and must return ERR_FLOCK_RETIRED, the higher-priority state error.
        test_recipe:
          setup:
            - "Flock (SHEEP, 500) with a 60-day withdrawal treatment on 2026-08-02 (withdrawal_until 2026-10-01); clock 2026-08-13"
            - "Flock then RETIRED (treatments do not block retire)"
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Retire Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/parasite-treatments", payload: { flock_id: "${fl}", product_name: "Ivermectin", treatment_date: "2026-08-02T00:00:00Z", withdrawal_days: 60, fecal_egg_count_before: 300 }, as: RangeHand }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/flocks/${fl}/retire", payload: {}, as: RanchManager }
          trigger:
            - { call: "POST /api/livestock-sales", payload: { flock_id: "${fl}", sale_type: "MEAT", channel: "DIRECT", head_count: 10, avg_weight_lbs: 100.0, base_price_per_cwt_cents: 20000, scheduled_date: "2026-08-20T00:00:00Z" }, as: RanchManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FLOCK_RETIRED (http 409), NOT ERR_WITHDRAWAL_ACTIVE"
            - "No LivestockSale row is created for flock ${fl} (GET /api/livestock-sales?flock_id= returns total_count 0)"

      - name: pasture_overlap_temporal_beats_capacity_constraint
        grounds:
          - validations[priority=11]
          - validations[priority=19]
        distinguishing_aspect: |
          Category pair business_temporal(11) vs business_constraint(19): the move
          overlaps an existing PLANNED move AND exceeds pasture capacity (150 > 100);
          the overlap error ERR_PASTURE_OVERLAP must win.
        test_recipe:
          setup:
            - "Flock (SHEEP, 500); Pasture P capacity 100 with a PLANNED move [2026-09-01, 2026-09-15) of 80 head"
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Overlap Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/pastures", payload: { pasture_name: "Little Pasture", acres: 40.0, carrying_capacity_head: 100 }, as: RanchManager, captures: { pas: $.data.id } }
            - { call: "POST /api/grazing-moves", payload: { flock_id: "${fl}", pasture_id: "${pas}", move_start: "2026-09-01T00:00:00Z", move_end: "2026-09-15T00:00:00Z", head_count: 80 }, as: RangeHand, captures: { mv1: $.data.id } }
          trigger:
            - { call: "POST /api/grazing-moves", payload: { flock_id: "${fl}", pasture_id: "${pas}", move_start: "2026-09-10T00:00:00Z", move_end: "2026-09-20T00:00:00Z", head_count: 150 }, as: RangeHand, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PASTURE_OVERLAP (http 409), NOT ERR_CAPACITY_EXCEEDED"
            - "Only one move exists on pasture ${pas} (the PLANNED original)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check: micron / datetime / weight, distinct endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: micron_grade_lower_bound_inclusive
        grounds:
          - calculations.wool_grade_classify
          - state_machines.WoolLot.DRAFT_to_GRADED
        distinguishing_aspect: |
          Metric: fibre micron, via POST /api/wool-lots/{id}/grade. The grade band
          lower bound is INCLUSIVE: micron exactly 19.5 -> FINE (not SUPERFINE),
          while 19.49 -> SUPERFINE; the two lots reprice accordingly (26400 vs 30400).
        test_recipe:
          setup:
            - "Flock (SHEEP, 500); clip greasy 200.0 / skirtings 10.0; two 80.0-lb lots"
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Micron Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/shearing-crews", payload: { crew_name: "Crew M", head_per_day_capacity: 300, daily_rate_cents: 40000 }, as: RanchManager, captures: { cr: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/shearing-events", payload: { flock_id: "${fl}", crew_id: "${cr}", scheduled_start: "2026-08-03T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", expected_head: 400 }, as: RanchManager, captures: { ev: $.data.id } }
            - { call: "POST /api/shearing-events/${ev}/transitions", payload: { to: "IN_PROGRESS" }, as: RangeHand }
            - { call: "POST /api/shearing-events/${ev}/complete", payload: { shorn_head_count: 400, greasy_weight_lbs: 200.0, skirtings_weight_lbs: 10.0 }, as: RangeHand }
            - { call: "GET /api/wool-clips", payload: { shearing_event_id: "${ev}" }, as: RanchManager, captures: { clip: "$.data[0].id" } }
            - { call: "POST /api/wool-lots", payload: { clip_id: "${clip}", lot_code: "B1", weight_lbs: 80.0 }, as: RanchManager, captures: { lotH: $.data.id } }
            - { call: "POST /api/wool-lots", payload: { clip_id: "${clip}", lot_code: "B2", weight_lbs: 80.0 }, as: RanchManager, captures: { lotI: $.data.id } }
          trigger:
            - { call: "POST /api/wool-lots/${lotH}/grade", payload: { estimated_micron: 19.5 }, as: RanchManager }
            - { call: "POST /api/wool-lots/${lotI}/grade", payload: { estimated_micron: 19.49 }, as: RanchManager }
          assert:
            - "WoolLot.${lotH}: grade_code == FINE, provisional_value_cents == 26400 (80.0 * 330)"
            - "WoolLot.${lotI}: grade_code == SUPERFINE, provisional_value_cents == 30400 (80.0 * 380)"

      - name: withdrawal_date_equality_allows_meat_sale
        grounds:
          - calculations.withdrawal_window
          - validations[priority=7]
        distinguishing_aspect: |
          Metric: datetime, via POST /api/livestock-sales. The withdrawal gate is a
          >= comparison: scheduled_date exactly equal to withdrawal_until (2026-08-24)
          is allowed, while one day earlier (2026-08-23) is rejected ERR_WITHDRAWAL_ACTIVE.
        test_recipe:
          setup:
            - "Flock (SHEEP, 500) with treatment on 2026-08-10, withdrawal_days 14 (withdrawal_until 2026-08-24); clock 2026-08-13"
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Withdrawal Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/parasite-treatments", payload: { flock_id: "${fl}", product_name: "Cydectin", treatment_date: "2026-08-10T00:00:00Z", withdrawal_days: 14, fecal_egg_count_before: 250 }, as: RangeHand, captures: { tr: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/livestock-sales", payload: { flock_id: "${fl}", sale_type: "MEAT", channel: "DIRECT", head_count: 10, avg_weight_lbs: 100.0, base_price_per_cwt_cents: 20000, scheduled_date: "2026-08-23T00:00:00Z" }, as: RanchManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/livestock-sales", payload: { flock_id: "${fl}", sale_type: "MEAT", channel: "DIRECT", head_count: 10, avg_weight_lbs: 100.0, base_price_per_cwt_cents: 20000, scheduled_date: "2026-08-24T00:00:00Z" }, as: RanchManager, captures: { sale: $.data.id } }
          assert:
            - "Control sale (2026-08-23): error_id == ERR_WITHDRAWAL_ACTIVE (422)"
            - "ParasiteTreatment.${tr}.withdrawal_until == 2026-08-24T00:00:00Z"
            - "Boundary sale (2026-08-24 == withdrawal_until): created; LivestockSale.${sale}.booked_price_cents == 200000"

      - name: pool_fee_tier_exactly_10000_lbs
        grounds:
          - calculations.pool_fee_tier
          - calculations.pool_settlement
        distinguishing_aspect: |
          Metric: consigned weight lbs, via the consignment settle chain
          (POST /api/consignments/{id}/transitions). The tier lower bound is INCLUSIVE:
          a pool total of exactly 10000 lbs settles at 5.0%, while the first lot that
          settled at 6000 lbs paid 6.5%.
        test_recipe:
          setup:
            - "Flock (SHEEP, 2000); clip greasy 10200.0 / skirtings 0.0; lotE 6000 lbs and lotF 4000 lbs, both MEDIUM"
            - "lotE consigned to WWPA-B1 and settled first (alone: 6000 lbs -> 6.5%); lotF consigned after, sold at 100000"
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Boundary Ranch", species: "SHEEP", baseline_headcount: 2000 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/shearing-crews", payload: { crew_name: "Crew B", head_per_day_capacity: 1000, daily_rate_cents: 90000 }, as: RanchManager, captures: { cr: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/shearing-events", payload: { flock_id: "${fl}", crew_id: "${cr}", scheduled_start: "2026-08-03T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", expected_head: 2000 }, as: RanchManager, captures: { ev: $.data.id } }
            - { call: "POST /api/shearing-events/${ev}/transitions", payload: { to: "IN_PROGRESS" }, as: RangeHand }
            - { call: "POST /api/shearing-events/${ev}/complete", payload: { shorn_head_count: 2000, greasy_weight_lbs: 10200.0, skirtings_weight_lbs: 0.0 }, as: RangeHand }
            - { call: "GET /api/wool-clips", payload: { shearing_event_id: "${ev}" }, as: RanchManager, captures: { clip: "$.data[0].id" } }
            - { call: "POST /api/wool-lots", payload: { clip_id: "${clip}", lot_code: "BE", weight_lbs: 6000.0 }, as: RanchManager, captures: { lotE: $.data.id } }
            - { call: "POST /api/wool-lots", payload: { clip_id: "${clip}", lot_code: "BF", weight_lbs: 4000.0 }, as: RanchManager, captures: { lotF: $.data.id } }
            - { call: "POST /api/wool-lots/${lotE}/grade", payload: { estimated_micron: 23.0 }, as: RanchManager }
            - { call: "POST /api/wool-lots/${lotF}/grade", payload: { estimated_micron: 23.0 }, as: RanchManager }
            - { call: "POST /api/consignments", payload: { lot_id: "${lotE}", pool_ref: "WWPA-B1" }, as: RanchManager, captures: { conE: $.data.id } }
            - { call: "POST /api/consignments/${conE}/transitions", payload: { to: "ACCEPTED" }, as: WoolPoolOperator }
            - { call: "POST /api/consignments/${conE}/transitions", payload: { to: "ADVANCED" }, as: WoolPoolOperator }
            - { call: "POST /api/consignments/${conE}/sell", payload: { sale_gross_cents: 1700000 }, as: WoolPoolOperator }
            - { call: "POST /api/consignments/${conE}/transitions", payload: { to: "SETTLED" }, as: WoolPoolOperator }
            - { call: "POST /api/consignments", payload: { lot_id: "${lotF}", pool_ref: "WWPA-B1" }, as: RanchManager, captures: { conF: $.data.id } }
            - { call: "POST /api/consignments/${conF}/transitions", payload: { to: "ACCEPTED" }, as: WoolPoolOperator }
            - { call: "POST /api/consignments/${conF}/transitions", payload: { to: "ADVANCED" }, as: WoolPoolOperator }
            - { call: "POST /api/consignments/${conF}/sell", payload: { sale_gross_cents: 100000 }, as: WoolPoolOperator }
          trigger:
            - { call: "POST /api/consignments/${conF}/transitions", payload: { to: "SETTLED" }, as: WoolPoolOperator }
          assert:
            - "Consignment.${conE}: pool_fee_cents == 110500 (6000 lbs -> 6.5%), advance_cents == 1092000, settlement_cents == 497500"
            - "Consignment.${conF}: pool_fee_cents == 5000 (6000 + 4000 == 10000 exactly -> 5.0%), advance_cents == 728000"
            - "Consignment.${conF}: settlement_cents == -633000 (100000 - 5000 - 728000; negative means the grower repays)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency: three different entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: meat_sale_gated_by_flock_withdrawal
        grounds:
          - validations[priority=7]
          - calculations.withdrawal_window
          - entities.Flock.fields.withdrawal_until
        distinguishing_aspect: |
          Entity pair LivestockSale -> ParasiteTreatment (via Flock.withdrawal_until):
          a MEAT sale scheduled strictly inside the withdrawal window is rejected even
          though the sale's own fields are all valid; BREEDING sales are exempt.
        test_recipe:
          setup:
            - "Flock (SHEEP, 500); treatment 2026-08-10 + 14 days (until 2026-08-24); clock 2026-08-13"
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Gate Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/parasite-treatments", payload: { flock_id: "${fl}", product_name: "Valbazen", treatment_date: "2026-08-10T00:00:00Z", withdrawal_days: 14, fecal_egg_count_before: 100 }, as: RangeHand }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/livestock-sales", payload: { flock_id: "${fl}", sale_type: "MEAT", channel: "DIRECT", head_count: 20, avg_weight_lbs: 110.0, base_price_per_cwt_cents: 21000, scheduled_date: "2026-08-20T00:00:00Z" }, as: RanchManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/livestock-sales", payload: { flock_id: "${fl}", sale_type: "BREEDING", channel: "DIRECT", head_count: 5, per_head_price_cents: 60000, scheduled_date: "2026-08-20T00:00:00Z" }, as: RanchManager, captures: { ok: $.data.id } }
          assert:
            - "MEAT sale inside withdrawal: error_id == ERR_WITHDRAWAL_ACTIVE (422)"
            - "BREEDING sale on the same date: created (withdrawal gate applies to MEAT only); LivestockSale.${ok}.booked_price_cents == 300000"

      - name: consignment_requires_lot_graded_or_withdrawn
        grounds:
          - validations[priority=16]
          - state_machines.WoolLot
          - state_machines.Consignment
        distinguishing_aspect: |
          Entity pair Consignment -> WoolLot: consigning a DRAFT (never graded) lot is
          rejected ERR_LOT_INVALID_STATE; after grading, the identical request succeeds
          — the lot's machine state gates the consignment's creation.
        test_recipe:
          setup:
            - "Flock (SHEEP, 500); clip; lot L1 100.0 lbs still DRAFT"
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Gate2 Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/shearing-crews", payload: { crew_name: "Crew G2", head_per_day_capacity: 300, daily_rate_cents: 40000 }, as: RanchManager, captures: { cr: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/shearing-events", payload: { flock_id: "${fl}", crew_id: "${cr}", scheduled_start: "2026-08-03T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", expected_head: 400 }, as: RanchManager, captures: { ev: $.data.id } }
            - { call: "POST /api/shearing-events/${ev}/transitions", payload: { to: "IN_PROGRESS" }, as: RangeHand }
            - { call: "POST /api/shearing-events/${ev}/complete", payload: { shorn_head_count: 400, greasy_weight_lbs: 200.0, skirtings_weight_lbs: 20.0 }, as: RangeHand }
            - { call: "GET /api/wool-clips", payload: { shearing_event_id: "${ev}" }, as: RanchManager, captures: { clip: "$.data[0].id" } }
            - { call: "POST /api/wool-lots", payload: { clip_id: "${clip}", lot_code: "G1", weight_lbs: 100.0 }, as: RanchManager, captures: { lot: $.data.id } }
          trigger:
            - { call: "POST /api/consignments", payload: { lot_id: "${lot}", pool_ref: "WWPA-G2" }, as: RanchManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/wool-lots/${lot}/grade", payload: { estimated_micron: 20.0 }, as: RanchManager }
            - { call: "POST /api/consignments", payload: { lot_id: "${lot}", pool_ref: "WWPA-G2" }, as: RanchManager, captures: { con: $.data.id } }
          assert:
            - "First consign attempt: error_id == ERR_LOT_INVALID_STATE (409)"
            - "After grade: Consignment.${con}.consignment_status == TENDERED and WoolLot.${lot}.lot_status == CONSIGNED"

      - name: contract_move_requires_contract_active
        grounds:
          - validations[priority=6]
          - state_machines.GrazingContract
          - entities.GrazingMove.fields.contract_id
        distinguishing_aspect: |
          Entity pair GrazingMove -> GrazingContract: creating a contract-linked move
          while the contract is PROPOSED is rejected ERR_CONTRACT_INVALID_STATE; after
          the contract reaches ACTIVE (window reached), the same move creation succeeds.
        test_recipe:
          setup:
            - "Flock (SHEEP, 800); contract PROPOSED with window 2026-09-01..2026-09-30"
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Gate3 Ranch", species: "SHEEP", baseline_headcount: 800 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/grazing-contracts", payload: { flock_id: "${fl}", client_org_name: "Solar Farm LLC", parcel_name: "Array Block 3", service_window_start: "2026-09-01T00:00:00Z", service_window_end: "2026-09-30T00:00:00Z", rate_per_head_day_cents: 90, min_head: 100, max_head: 600, target_cover_reduction_pct: 65.0 }, as: RanchManager, captures: { gc: $.data.id } }
            - { call: "POST /api/grazing-contracts/${gc}/transitions", payload: { to: "PROPOSED" }, as: RanchManager }
          trigger:
            - { call: "POST /api/grazing-moves", payload: { flock_id: "${fl}", contract_id: "${gc}", move_start: "2026-09-05T00:00:00Z", move_end: "2026-09-20T00:00:00Z", head_count: 300 }, as: RangeHand, captures: { err: $.data.error_id } }
            - { call: "POST /api/grazing-contracts/${gc}/transitions", payload: { to: "ACCEPTED" }, as: GrazingClient }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/grazing-contracts/${gc}/transitions", payload: { to: "ACTIVE" }, as: RanchManager }
            - { call: "POST /api/grazing-moves", payload: { flock_id: "${fl}", contract_id: "${gc}", move_start: "2026-09-05T00:00:00Z", move_end: "2026-09-20T00:00:00Z", head_count: 300 }, as: RangeHand, captures: { mv: $.data.id } }
          assert:
            - "First move attempt: error_id == ERR_CONTRACT_INVALID_STATE (409)"
            - "After contract ACTIVE: GrazingMove.${mv}.move_status == PLANNED"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap: half-open pasture vs buffered crew
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: pasture_half_open_interval_allows_adjacency
        grounds:
          - validations[priority=11]
          - entities.GrazingMove.fields.move_start
        distinguishing_aspect: |
          Resource Pasture with HALF-OPEN interval semantics [start, end): a move
          starting 2026-09-10 overlapping [09-01, 09-15) is rejected, while a move
          starting exactly at the other's end (2026-09-15) is accepted — adjacency OK.
        test_recipe:
          setup:
            - "Flock (SHEEP, 500); Pasture P capacity 500 with PLANNED move [09-01, 09-15) of 80 head"
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "HalfOpen Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/pastures", payload: { pasture_name: "Section 12", acres: 640.0, carrying_capacity_head: 500 }, as: RanchManager, captures: { pas: $.data.id } }
            - { call: "POST /api/grazing-moves", payload: { flock_id: "${fl}", pasture_id: "${pas}", move_start: "2026-09-01T00:00:00Z", move_end: "2026-09-15T00:00:00Z", head_count: 80 }, as: RangeHand, captures: { mv1: $.data.id } }
          trigger:
            - { call: "POST /api/grazing-moves", payload: { flock_id: "${fl}", pasture_id: "${pas}", move_start: "2026-09-10T00:00:00Z", move_end: "2026-09-20T00:00:00Z", head_count: 90 }, as: RangeHand, captures: { err: $.data.error_id } }
            - { call: "POST /api/grazing-moves", payload: { flock_id: "${fl}", pasture_id: "${pas}", move_start: "2026-09-15T00:00:00Z", move_end: "2026-09-25T00:00:00Z", head_count: 70 }, as: RangeHand, captures: { mv3: $.data.id } }
          assert:
            - "Overlapping move [09-10, 09-20): error_id == ERR_PASTURE_OVERLAP (409)"
            - "Adjacent move [09-15, 09-25) touching move_end: created, GrazingMove.${mv3}.move_status == PLANNED"
            - "Pasture ${pas} now has exactly 2 moves (the original + the adjacent one)"

      - name: shearing_crew_24h_buffer_forbids_adjacency
        grounds:
          - validations[priority=12]
          - entities.ShearingEvent.fields.scheduled_start
        distinguishing_aspect: |
          Resource ShearingCrew with a 24h sanitation buffer between bookings — a
          geometrically different rule than the pasture's half-open adjacency: a second
          booking starting exactly at the first booking's end is a CONFLICT, and only a
          start >= end + 24h is accepted.
        test_recipe:
          setup:
            - "Flock (SHEEP, 500); Crew C capacity 500/day; event1 [09-01, 09-03) for 500 head (2 days * 500 >= 500)"
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Buffer Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/shearing-crews", payload: { crew_name: "Crew Buf", head_per_day_capacity: 500, daily_rate_cents: 60000 }, as: RanchManager, captures: { cr: $.data.id } }
            - { call: "POST /api/shearing-events", payload: { flock_id: "${fl}", crew_id: "${cr}", scheduled_start: "2026-09-01T00:00:00Z", scheduled_end: "2026-09-03T00:00:00Z", expected_head: 500 }, as: RanchManager, captures: { ev1: $.data.id } }
          trigger:
            - { call: "POST /api/shearing-events", payload: { flock_id: "${fl}", crew_id: "${cr}", scheduled_start: "2026-09-03T00:00:00Z", scheduled_end: "2026-09-05T00:00:00Z", expected_head: 400 }, as: RanchManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/shearing-events", payload: { flock_id: "${fl}", crew_id: "${cr}", scheduled_start: "2026-09-04T00:00:00Z", scheduled_end: "2026-09-06T00:00:00Z", expected_head: 400 }, as: RanchManager, captures: { ev3: $.data.id } }
          assert:
            - "Adjacent booking [09-03, 09-05): error_id == ERR_CREW_OVERLAP (409) — adjacency forbidden under the buffer rule"
            - "Booking [09-04, 09-06) starting exactly end+24h: created, ShearingEvent.${ev3}.shearing_status == SCHEDULED"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant: weight lbs / head count / cents
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: clip_weight_create_delete_conservation
        grounds:
          - calculations.clip_weight_reconciliation
          - entities.WoolClip.fields.unallocated_weight_lbs
        distinguishing_aspect: |
          Conserved quantity: wool pounds. Forward action (lot create 100.0 lbs) and its
          compensating action (DELETE of the DRAFT lot) leave the clip's conservation
          identity greasy - skirtings == allocated + unallocated (270.0 lbs) intact at
          every step.
        test_recipe:
          setup:
            - "Flock (SHEEP, 500); clip greasy 300.0 / skirtings 30.0 (net 270.0)"
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Weight Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/shearing-crews", payload: { crew_name: "Crew W", head_per_day_capacity: 300, daily_rate_cents: 40000 }, as: RanchManager, captures: { cr: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/shearing-events", payload: { flock_id: "${fl}", crew_id: "${cr}", scheduled_start: "2026-08-03T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", expected_head: 400 }, as: RanchManager, captures: { ev: $.data.id } }
            - { call: "POST /api/shearing-events/${ev}/transitions", payload: { to: "IN_PROGRESS" }, as: RangeHand }
            - { call: "POST /api/shearing-events/${ev}/complete", payload: { shorn_head_count: 400, greasy_weight_lbs: 300.0, skirtings_weight_lbs: 30.0 }, as: RangeHand }
            - { call: "GET /api/wool-clips", payload: { shearing_event_id: "${ev}" }, as: RanchManager, captures: { clip: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/wool-lots", payload: { clip_id: "${clip}", lot_code: "WA", weight_lbs: 100.0 }, as: RanchManager, captures: { lotA: $.data.id } }
            - { call: "POST /api/wool-lots", payload: { clip_id: "${clip}", lot_code: "WB", weight_lbs: 50.0 }, as: RanchManager, captures: { lotB: $.data.id } }
            - { call: "DELETE /api/wool-lots/${lotA}", payload: {}, as: RanchManager }
          assert:
            - "After lotA: clip unallocated_weight_lbs == 170.0 (300 - 30 - 100)"
            - "After lotB: clip unallocated_weight_lbs == 120.0 and allocated_weight_lbs == 150.0"
            - "After DELETE lotA (DRAFT): unallocated_weight_lbs == 220.0 and allocated_weight_lbs == 50.0"
            - "Invariant holds at every step: greasy_weight_lbs - skirtings_weight_lbs == allocated_weight_lbs + unallocated_weight_lbs == 270.0"

      - name: pasture_occupancy_start_complete_conservation
        grounds:
          - state_machines.GrazingMove.PLANNED_to_ACTIVE
          - state_machines.GrazingMove.ACTIVE_to_COMPLETED
          - entities.Pasture.fields.occupied_head_count
        distinguishing_aspect: |
          Conserved quantity: head count on a pasture (distinct from wool pounds and
          money). The forward action (move start, occupied 0 -> 250) paired with its
          compensating action (move complete) returns Pasture.occupied_head_count to
          exactly its pre-pair value 0, per occupied == SUM(head_count of ACTIVE moves).
        test_recipe:
          setup:
            - "Flock (SHEEP, 400); Pasture P capacity 500, rest_days 21; move [09-01, 09-10) of 250 head; clock 2026-09-03"
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Occupy Ranch", species: "SHEEP", baseline_headcount: 400 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/pastures", payload: { pasture_name: "East Bench", acres: 320.0, carrying_capacity_head: 500, rest_days: 21 }, as: RanchManager, captures: { pas: $.data.id } }
            - { call: "POST /api/grazing-moves", payload: { flock_id: "${fl}", pasture_id: "${pas}", move_start: "2026-09-01T00:00:00Z", move_end: "2026-09-10T00:00:00Z", head_count: 250 }, as: RangeHand, captures: { mv: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/grazing-moves/${mv}/transitions", payload: { to: "ACTIVE" }, as: RangeHand }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/grazing-moves/${mv}/transitions", payload: { to: "COMPLETED" }, as: RangeHand }
          assert:
            - "Before start: Pasture.${pas}.occupied_head_count == 0 and pasture_status == AVAILABLE"
            - "After start: occupied_head_count == 250 and pasture_status == OCCUPIED"
            - "After complete: occupied_head_count == 0 (conserved across the start+complete pair)"
            - "After complete: pasture_status == RESTING (clock 2026-09-10 < move_end 2026-09-10 + 21 rest days)"

      - name: consignment_advance_clawback_zero_net_cash
        grounds:
          - calculations.consignment_advance
          - state_machines.Consignment.ADVANCED_to_WITHDRAWN
          - entities.Consignment.fields.clawback_cents
        distinguishing_aspect: |
          Conserved quantity: cents (distinct from pounds and head count). The forward
          action (advance posts 23100 cents to the grower) paired with its compensating
          action (withdrawal from ADVANCED claws back exactly advance_cents) leaves net
          pool cash movement for the lot at exactly 0.
        test_recipe:
          setup:
            - "Flock (SHEEP, 500); clip; lot L1 100.0 lbs FINE (provisional 33000); consignment ADVANCED (advance 23100)"
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Clawback Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/shearing-crews", payload: { crew_name: "Crew CB", head_per_day_capacity: 300, daily_rate_cents: 40000 }, as: RanchManager, captures: { cr: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/shearing-events", payload: { flock_id: "${fl}", crew_id: "${cr}", scheduled_start: "2026-08-03T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", expected_head: 400 }, as: RanchManager, captures: { ev: $.data.id } }
            - { call: "POST /api/shearing-events/${ev}/transitions", payload: { to: "IN_PROGRESS" }, as: RangeHand }
            - { call: "POST /api/shearing-events/${ev}/complete", payload: { shorn_head_count: 400, greasy_weight_lbs: 200.0, skirtings_weight_lbs: 20.0 }, as: RangeHand }
            - { call: "GET /api/wool-clips", payload: { shearing_event_id: "${ev}" }, as: RanchManager, captures: { clip: "$.data[0].id" } }
            - { call: "POST /api/wool-lots", payload: { clip_id: "${clip}", lot_code: "CB1", weight_lbs: 100.0 }, as: RanchManager, captures: { lot: $.data.id } }
            - { call: "POST /api/wool-lots/${lot}/grade", payload: { estimated_micron: 20.0 }, as: RanchManager }
            - { call: "POST /api/consignments", payload: { lot_id: "${lot}", pool_ref: "WWPA-CB" }, as: RanchManager, captures: { con: $.data.id } }
            - { call: "POST /api/consignments/${con}/transitions", payload: { to: "ACCEPTED" }, as: WoolPoolOperator }
            - { call: "POST /api/consignments/${con}/transitions", payload: { to: "ADVANCED" }, as: WoolPoolOperator }
          trigger:
            - { call: "POST /api/consignments/${con}/transitions", payload: { to: "WITHDRAWN" }, as: RanchManager }
          assert:
            - "Consignment.${con}.advance_cents == 23100 (round_half_up(0.70 * 33000))"
            - "After withdrawal: clawback_cents == 23100 (== advance_cents, full clawback)"
            - "Net pool cash for the lot: advance_cents - clawback_cents == 0"
            - "WoolLot.${lot}.lot_status == WITHDRAWN and consignment_status == WITHDRAWN"
