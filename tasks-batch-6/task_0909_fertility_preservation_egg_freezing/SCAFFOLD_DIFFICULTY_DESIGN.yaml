            - "StorageTank.${tank1}.is_full == true"
            - "StorageSubscription.${sub_id}.specimen_count == 2"

      - name: thaw_execute_cascade_depth3
        grounds:
          - state_machines.ThawTransferAuthorization.AUTHORIZED_to_EXECUTED
          - state_machines.CryoSpecimen.RESERVED_to_THAWED
          - entities.StorageTank.fields.used_slots
