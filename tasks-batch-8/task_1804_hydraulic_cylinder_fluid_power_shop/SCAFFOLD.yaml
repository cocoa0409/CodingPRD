      - { name: status, type: enum, source: system, description: "REQUESTED | SCHEDULED | DISPATCHED | COMPLETED | CANCELLED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: WorkOrder
    initial_state: INTAKE
    terminal_states: [CLOSED, SCRAPPED, CANCELLED]
    transitions:
      - from: INTAKE
        to: TEARDOWN
        trigger: "POST /fluid-power/work-orders/{id}/start-teardown"
        actor: ServiceAdvisor | ShopAdmin
        preconditions:
          - "technician_id references an active Technician whose skills include CYLINDER_REPAIR (else ERR_NOT_FOUND / ERR_INVALID_STATE)"
        side_effects:
          - "assigned_technician_id := technician_id"
          - "increments WorkOrder.version by 1"

      - from: TEARDOWN
        to: QUOTE_DRAFT
        trigger: "system (cascade from POST /fluid-power/teardown-reports creation)"
        actor: system
        preconditions:
          - "no TeardownReport exists for this work order (else ERR_TEARDOWN_REPORT_EXISTS)"
        side_effects:
          - "TeardownReport created with version 1"

      - from: QUOTE_DRAFT
        to: QUOTE_SENT
        trigger: "system (cascade from POST /fluid-power/quotes/{id}/send)"
        actor: system
        preconditions:
          - "the sent Quote.pinned_teardown_version == current TeardownReport.version (else ERR_TEARDOWN_STALE)"
        side_effects:
          - "Quote.sent_at := current clock"

      - from: QUOTE_SENT
        to: REVISION_REQUESTED
        trigger: "system (cascade from POST /fluid-power/quotes/{id}/request-revision)"
        actor: system
        preconditions: []
        side_effects:
          - "Quote.status := REVISION_REQUESTED"

      - from: REVISION_REQUESTED
        to: QUOTE_DRAFT
        trigger: "system (cascade from POST /fluid-power/quotes creating a replacement quote)"
        actor: system
        preconditions: []
        side_effects:
          - "the prior REVISION_REQUESTED quote transitions to SUPERSEDED"
        note: "revision loop: QUOTE_DRAFT -> QUOTE_SENT -> REVISION_REQUESTED -> QUOTE_DRAFT"

      - from: QUOTE_SENT
        to: APPROVED
        trigger: "system (cascade from POST /fluid-power/quotes/{id}/approve)"
        actor: system
        preconditions:
          - "quote not past TTL (else quote -> EXPIRED and ERR_QUOTE_EXPIRED)"
          - "customer credit exposure including this quote's provisional_total_cents <= credit_limit_cents (else ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "auto-create one StockReservation (status OPEN) for the rod if teardown.rod_needed, and one for the tube if teardown.tube_needed, via stock_cut_allocation against the quoted lengths"
          - "each selected InventoryItem.length_mm reduced by (cut_length_mm + kerf_mm); if remainder < min_remnant_mm the item -> DEPLETED and the reservation records scrap_length_mm and scrap_charge_cents"

      - from: APPROVED
        to: IN_REPAIR
        trigger: "POST /fluid-power/work-orders/{id}/start-repair"
        actor: Technician
        preconditions:
          - "acting technician's X-User-ID == assigned_technician_id (else ERR_NOT_OWNER)"
        side_effects: []

      - from: IN_REPAIR
        to: ASSEMBLED
        trigger: "POST /fluid-power/work-orders/{id}/complete-assembly"
        actor: Technician
        preconditions:
          - "acting technician's X-User-ID == assigned_technician_id (else ERR_NOT_OWNER)"
          - "cleanliness_passed == true (else ERR_CLEANLINESS_CLASS_EXCEEDED)"
          - "every StockReservation of this work order is CONSUMED (else ERR_RESERVATION_NOT_OPEN)"
        side_effects: []

      - from: ASSEMBLED
        to: TEST_PENDING
        trigger: "system (cascade from POST /fluid-power/pressure-tests creation)"
        actor: system
        preconditions: []
        side_effects:
          - "PressureTest created SCHEDULED with required_hold_psi computed"

      - from: TEST_PENDING
        to: TEST_PENDING
        trigger: "system (cascade from POST /fluid-power/pressure-tests creation — re-test after a CANCELLED test or a certificate revoke)"
        actor: system
        preconditions: ["no SCHEDULED test already exists for the work order (else ERR_INVALID_STATE)"]
        side_effects:
          - "PressureTest created SCHEDULED with required_hold_psi computed"
        note: "re-entry keeps the work order in TEST_PENDING; this is the recovery path from a revoked certificate"

      - from: TEST_PENDING
        to: TEST_PASSED
        trigger: "system (cascade from POST /fluid-power/pressure-tests/{id}/record-result with passed=true)"
        actor: system
        preconditions: []
        side_effects: []

      - from: TEST_PENDING
        to: IN_REPAIR
        trigger: "system (cascade from POST /fluid-power/pressure-tests/{id}/record-result with passed=false)"
        actor: system
        preconditions: []
        side_effects:
          - "cleanliness_passed := false and latest_cleanliness_* retained for history (rework loop: IN_REPAIR -> ASSEMBLED -> TEST_PENDING again)"
        note: "rework cycle: TEST_PENDING -> IN_REPAIR -> ASSEMBLED -> TEST_PENDING"

      - from: TEST_PASSED
        to: CERTIFIED
        trigger: "system (cascade from POST /fluid-power/certificates)"
        actor: system
        preconditions:
          - "issuing inspector X-User-ID != assigned_technician_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)"
          - "no other Certificate with status ISSUED for this work order (else ERR_CERTIFICATE_EXISTS)"
        side_effects:
          - "Certificate created ISSUED, pressure_test_id := latest PASSED test"

      - from: CERTIFIED
        to: TEST_PENDING
        trigger: "system (cascade from POST /fluid-power/certificates/{id}/revoke)"
        actor: system
        preconditions: []
        side_effects:
          - "the Certificate.pressure_test_id PressureTest transitions PASSED -> VOIDED"
        note: "certification revert: CERTIFIED -> TEST_PENDING; a fresh pressure test must then be created and passed before re-certification"

      - from: CERTIFIED
        to: CLOSED
        trigger: "POST /fluid-power/work-orders/{id}/close"
        actor: ServiceAdvisor | ShopAdmin
        preconditions:
          - "actual_labor_hours > 0 provided"
        side_effects:
          - "final_total_cents computed via quote_pricing final variant (actual hours, consumed material costs, scrap charges)"
          - "invoice_total_cents computed via invoice_total_settlement"
          - "Customer.ytd_spend_cents += invoice_total_cents"

      - from: QUOTE_SENT
        to: SCRAP_AUTHORIZED
        trigger: "POST /fluid-power/work-orders/{id}/authorize-scrap"
        actor: Customer
        preconditions:
          - "acting customer's X-User-ID == work_order.customer_id (else ERR_NOT_OWNER)"
        side_effects:
          - "the SENT Quote transitions to REJECTED_SCRAP"

      - from: REVISION_REQUESTED
        to: SCRAP_AUTHORIZED
        trigger: "POST /fluid-power/work-orders/{id}/authorize-scrap"
        actor: Customer
        preconditions:
          - "acting customer's X-User-ID == work_order.customer_id (else ERR_NOT_OWNER)"
        side_effects: []

      - from: SCRAP_AUTHORIZED
        to: SCRAPPED
        trigger: "POST /fluid-power/work-orders/{id}/complete-scrap"
        actor: ServiceAdvisor | ShopAdmin
        preconditions: []
        side_effects:
          - "Cylinder.status := RETIRED"

      - from: QUOTE_SENT
        to: EXCHANGE_SELECTED
        trigger: "POST /fluid-power/work-orders/{id}/select-exchange"
        actor: Customer
        preconditions:
          - "acting customer's X-User-ID == work_order.customer_id (else ERR_NOT_OWNER)"
          - "exchange_unit_id references an ExchangeUnit with status IN_POOL (else ERR_UNIT_NOT_IN_POOL)"
          - "unit bore_mm, stroke_mm, rod_diameter_mm, pressure_class all equal the cylinder's (else ERR_SPEC_MISMATCH)"
        side_effects:
          - "the SENT Quote transitions to SUPERSEDED"
          - "ExchangeUnit.status := RESERVED; ExchangeUnit.work_order_id := this work order"

      - from: EXCHANGE_SELECTED
        to: EXCHANGE_FULFILLED
        trigger: "system (cascade from POST /fluid-power/exchange-units/{id}/fulfill)"
        actor: system
        preconditions: []
        side_effects:
          - "ExchangeUnit.status := FULFILLED"
          - "ExchangeUnit.provisional_credit_cents computed via exchange_core_credit provisional variant (GOOD + COMPLETE assumed)"
          - "Cylinder.status := EXCHANGED"

      - from: EXCHANGE_FULFILLED
        to: CLOSED
        trigger: "POST /fluid-power/work-orders/{id}/close"
        actor: ServiceAdvisor | ShopAdmin
        preconditions:
          - "the RESERVED/FULFILLED ExchangeUnit for this work order has status SETTLED (else ERR_CORE_NOT_RETURNED)"
        side_effects:
          - "invoice_total_cents := unit_price_cents - final_credit_cents (+ core_disposal_fee_cents when condition == SCRAP)"
          - "core_credit_applied_cents := final_credit_cents"
          - "Customer.ytd_spend_cents += invoice_total_cents"

      - from: INTAKE
        to: CANCELLED
        trigger: "POST /fluid-power/work-orders/{id}/cancel"
        actor: ServiceAdvisor | ShopAdmin | Customer
        preconditions: ["Customer actor must own the work order (else ERR_NOT_OWNER)"]
        side_effects: []

      - from: TEARDOWN
        to: CANCELLED
        trigger: "POST /fluid-power/work-orders/{id}/cancel"
        actor: ServiceAdvisor | ShopAdmin | Customer
        preconditions: ["Customer actor must own the work order (else ERR_NOT_OWNER)"]
        side_effects: []

      - from: QUOTE_DRAFT
        to: CANCELLED
        trigger: "POST /fluid-power/work-orders/{id}/cancel"
        actor: ServiceAdvisor | ShopAdmin | Customer
        preconditions: ["Customer actor must own the work order (else ERR_NOT_OWNER)"]
        side_effects:
          - "any DRAFT quote of this work order -> SUPERSEDED"

      - from: QUOTE_SENT
        to: CANCELLED
        trigger: "POST /fluid-power/work-orders/{id}/cancel"
        actor: ServiceAdvisor | ShopAdmin | Customer
        preconditions:
          - "Customer actor must own the work order (else ERR_NOT_OWNER)"
        side_effects:
          - "the SENT quote -> SUPERSEDED"

      - from: REVISION_REQUESTED
        to: CANCELLED
        trigger: "POST /fluid-power/work-orders/{id}/cancel"
        actor: ServiceAdvisor | ShopAdmin | Customer
        preconditions: ["Customer actor must own the work order (else ERR_NOT_OWNER)"]
        side_effects: []

  - entity: Quote
    initial_state: DRAFT
    terminal_states: [APPROVED, EXPIRED, SUPERSEDED, REJECTED_SCRAP]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /fluid-power/quotes/{id}/send"
        actor: ServiceAdvisor | ShopAdmin
        preconditions:
          - "quote.pinned_teardown_version == current TeardownReport.version (else ERR_TEARDOWN_STALE)"
          - "WorkOrder.status == QUOTE_DRAFT (else ERR_INVALID_STATE)"
        side_effects:
          - "WorkOrder QUOTE_DRAFT -> QUOTE_SENT"
          - "sent_at := current clock"

      - from: SENT
        to: APPROVED
        trigger: "POST /fluid-power/quotes/{id}/approve"
        actor: Customer
        preconditions:
          - "acting customer owns the work order (else ERR_NOT_OWNER)"
          - "now <= sent_at + quote_ttl_hours (else quote -> EXPIRED and ERR_QUOTE_EXPIRED)"
          - "credit exposure check passes (else ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "WorkOrder QUOTE_SENT -> APPROVED with the material-reservation cascade described on the WorkOrder transition"

      - from: SENT
        to: REVISION_REQUESTED
        trigger: "POST /fluid-power/quotes/{id}/request-revision"
        actor: Customer
        preconditions: ["acting customer owns the work order (else ERR_NOT_OWNER)"]
        side_effects:
          - "WorkOrder QUOTE_SENT -> REVISION_REQUESTED"

      - from: SENT
        to: EXPIRED
        trigger: "system (lazy: an approve attempt arriving after sent_at + quote_ttl_hours)"
        actor: system
        preconditions: []
        side_effects: ["the approve call fails with ERR_QUOTE_EXPIRED"]

      - from: SENT
        to: SUPERSEDED
        trigger: "system (cascade from work-order cancel or select-exchange)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SENT
        to: REJECTED_SCRAP
        trigger: "system (cascade from work-order authorize-scrap)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (cascade from work-order cancel)"
        actor: system
        preconditions: []
        side_effects: []

      - from: REVISION_REQUESTED
        to: SUPERSEDED
        trigger: "system (cascade from POST /fluid-power/quotes creating a replacement quote)"
        actor: system
        preconditions: []
        side_effects:
          - "WorkOrder REVISION_REQUESTED -> QUOTE_DRAFT"

  - entity: ExchangeUnit
    initial_state: IN_POOL
    terminal_states: [SETTLED]
    transitions:
      - from: IN_POOL
        to: RESERVED
        trigger: "system (cascade from POST /fluid-power/work-orders/{id}/select-exchange)"
        actor: system
        preconditions: ["spec match with the cylinder (else ERR_SPEC_MISMATCH)"]
        side_effects: ["work_order_id set"]

      - from: RESERVED
        to: IN_POOL
        trigger: "POST /fluid-power/exchange-units/{id}/release"
        actor: ServiceAdvisor | ShopAdmin
        preconditions: []
        side_effects:
          - "work_order_id := null; provisional_credit_cents := null"
          - "linked WorkOrder remains EXCHANGE_SELECTED and may select another unit"
        note: "reserve/release cycle: IN_POOL -> RESERVED -> IN_POOL"

      - from: RESERVED
        to: FULFILLED
        trigger: "POST /fluid-power/exchange-units/{id}/fulfill"
        actor: ServiceAdvisor | ShopAdmin
        preconditions:
          - "the linked WorkOrder is EXCHANGE_SELECTED for this unit (else ERR_INVALID_STATE)"
        side_effects:
          - "provisional_credit_cents computed (GOOD + COMPLETE assumed)"
          - "Cylinder.status := EXCHANGED"
          - "WorkOrder EXCHANGE_SELECTED -> EXCHANGE_FULFILLED"

      - from: FULFILLED
        to: CORE_RECEIVED
        trigger: "POST /fluid-power/exchange-units/{id}/receive-core"
        actor: ServiceAdvisor | ShopAdmin
        preconditions: []
        side_effects: []

      - from: CORE_RECEIVED
        to: SETTLED
        trigger: "POST /fluid-power/exchange-units/{id}/evaluate-core"
        actor: QualityInspector
        preconditions: []
        side_effects:
          - "final_credit_cents computed via exchange_core_credit final variant"

  - entity: StockReservation
    initial_state: OPEN
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: OPEN
        to: CONSUMED
        trigger: "POST /fluid-power/stock-reservations/{id}/consume"
        actor: Technician
        preconditions:
          - "acting technician is the assigned technician of the linked work order (else ERR_NOT_OWNER)"
          - "linked WorkOrder.status == IN_REPAIR (else ERR_INVALID_STATE)"
        side_effects:
          - "consumed_length_mm := cut_length_mm"

      - from: OPEN
        to: RELEASED
        trigger: "POST /fluid-power/stock-reservations/{id}/release"
        actor: ServiceAdvisor | ShopAdmin
        preconditions: []
        side_effects:
          - "if cut_length_mm >= min_remnant_mm: create a new InventoryItem (origin REMNANT, length_mm = cut_length_mm, same material/diameter/cost_per_mm) AVAILABLE"
          - "if cut_length_mm < min_remnant_mm: the cut piece is scrapped (scrap_length_mm += cut_length_mm, scrap_charge_cents recomputed)"

  - entity: PressureTest
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, VOIDED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /fluid-power/pressure-tests/{id}/record-result with passed=true"
        actor: QualityInspector
        preconditions:
          - "measured_hold_psi >= required_hold_psi AND duration_min >= test_hold_min_minutes AND leakage_drops == 0 (else ERR_PRESSURE_HOLD_INSUFFICIENT)"
        side_effects:
          - "WorkOrder TEST_PENDING -> TEST_PASSED"

      - from: SCHEDULED
        to: FAILED
        trigger: "POST /fluid-power/pressure-tests/{id}/record-result with passed=false"
        actor: QualityInspector
        preconditions: []
        side_effects:
          - "WorkOrder TEST_PENDING -> IN_REPAIR; cleanliness_passed := false"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /fluid-power/pressure-tests/{id}/cancel"
        actor: QualityInspector | ShopAdmin
        preconditions: []
        side_effects: ["bay window freed"]

      - from: PASSED
        to: VOIDED
        trigger: "system (cascade from certificate revoke)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Certificate
    initial_state: ISSUED
    terminal_states: [REVOKED]
    transitions:
      - from: ISSUED
        to: REVOKED
        trigger: "POST /fluid-power/certificates/{id}/revoke"
        actor: QualityInspector
        preconditions: []
        side_effects:
          - "WorkOrder CERTIFIED -> TEST_PENDING"
          - "Certificate.pressure_test_id PressureTest PASSED -> VOIDED"

  - entity: FieldServiceJob
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /fluid-power/field-service-jobs/{id}/schedule"
        actor: ServiceAdvisor | ShopAdmin
        preconditions:
          - "technician active and skills include FIELD_SERVICE (else ERR_INVALID_STATE)"
          - "window_start >= current clock (else ERR_WINDOW_IN_PAST)"
          - "no half-open interval overlap with another SCHEDULED/DISPATCHED job of the technician (else ERR_TECHNICIAN_WINDOW_OVERLAP)"
          - "expected_technician_version matches Technician.version (else ERR_STALE_VERSION)"
        side_effects:
          - "technician_id, window_start, window_end set"
          - "emergency_callout computed (window_start - created_at <= emergency_callout_window_hours)"
          - "increments Technician.version by 1"

      - from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /fluid-power/field-service-jobs/{id}/dispatch"
        actor: Technician
        preconditions: ["acting technician's X-User-ID == technician_id (else ERR_NOT_OWNER)"]
        side_effects: []

      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /fluid-power/field-service-jobs/{id}/complete"
        actor: Technician
        preconditions:
          - "acting technician's X-User-ID == technician_id (else ERR_NOT_OWNER)"
          - "every assembly's |crimp_measured_mm - crimp_spec_mm| <= crimp_tolerance_mm (else ERR_CRIMP_OUT_OF_TOLERANCE; measurements persist and the job stays DISPATCHED)"
        side_effects:
          - "final_price_cents computed via field_service_pricing final variant"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /fluid-power/field-service-jobs/{id}/cancel"
        actor: ServiceAdvisor | ShopAdmin | Customer
        preconditions: ["Customer actor must own the job (else ERR_NOT_OWNER)"]
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /fluid-power/field-service-jobs/{id}/cancel"
        actor: ServiceAdvisor | ShopAdmin | Customer
        preconditions: ["Customer actor must own the job (else ERR_NOT_OWNER)"]
        side_effects: ["technician window freed"]

  - entity: InventoryItem
    initial_state: AVAILABLE
    terminal_states: [DEPLETED]
    transitions:
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system (cascade from stock_cut_allocation when post-cut remainder < min_remnant_mm)"
        actor: system
        preconditions: []
        side_effects: ["remainder length recorded as scrap_length_mm on the reservation"]

  - entity: Customer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /fluid-power/customers/{id}/suspend"
        actor: ShopAdmin
        preconditions: []
        side_effects: []

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /fluid-power/customers/{id}/reactivate"
        actor: ShopAdmin
        preconditions: []
        side_effects: []

  - entity: Cylinder
    initial_state: ACTIVE
    terminal_states: [RETIRED, EXCHANGED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "system (cascade from work-order complete-scrap)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: EXCHANGED
        trigger: "system (cascade from exchange-unit fulfill)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: teardown-report-patch-stale
    parent_entity: TeardownReport
    write_endpoint: "PATCH /fluid-power/teardown-reports/{id}"
    occ_field: expected_teardown_report_version
    description: |
      A PATCH to a TeardownReport whose version has advanced since the client
      last observed it is rejected: the client's edits are based on a stale
      revision of the findings. A sequential retry carrying the current
      version succeeds (revision edits legitimately build on one another).
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: field-job-schedule-stale-technician
    parent_entity: Technician
    write_endpoint: "POST /fluid-power/field-service-jobs/{id}/schedule"
    occ_field: expected_technician_version
    description: |
      Scheduling a FieldServiceJob against a Technician whose version has
      advanced since the client last observed the technician's calendar is
      rejected: the schedule view is stale even when the requested window
      itself is free. A sequential retry carrying the current version succeeds
      (multiple non-overlapping jobs legitimately share one technician).
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: shop-config-patch-stale
    parent_entity: Shop
    write_endpoint: "PATCH /fluid-power/shops/{id}"
    occ_field: expected_shop_version
    description: |
      A PATCH to Shop configuration whose version has advanced since the
      client last read it is rejected: rate and cutoff edits must build on the
      current configuration. A sequential retry with the current version
      succeeds.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: quote_pricing
    trigger: "quote creation (provisional variant); work-order close (final variant)"
    algorithm: tiered_pricing
    formula: |
      tier_mult = STANDARD ? 1.0 : (EXPEDITE ? expedite_multiplier : emergency_multiplier)   # from quote.tier_snapshot
      # line 1 SEAL_KIT: kit price (teardown.seal_kit_id if set else cylinder.seal_kit_id)
      seal_line = SealKit.price_cents
      # line 2 ROD (only when teardown.rod_needed):
      #   provisional: rod_cut_length_mm x default_chrome_rod_cost_per_mm_cents + cut_fee_cents
      #   final:       consumed_length_mm x consumed item cost_per_mm_cents + cut_fee_cents
      # line 3 TUBE (only when teardown.tube_needed): same shape with honing-tube cost
      # line 4 HONING = honing_passes x honing_pass_fee_cents
      # line 5 LABOR: labor_raw = hours x labor_rate_cents_per_hour x tier_mult
      #               labor_line = round_half_up(labor_raw)   # hours = estimated (provisional) | actual (final)
      # line 6 SUPPLIES: supplies_raw = supplies_pct_of_labor x labor_raw  (RAW labor, unrounded)
      #                  supplies_line = round_half_up(supplies_raw)
      # line 7 SCRAP (final only): sum of scrap_charge_cents over the work order's reservations
      # TOTAL: round EACH line to integer cents FIRST (round_half_up), THEN sum.
      #   Pinned order: per-line round, then sum. Sum-then-round is wrong and differs
      #   whenever two or more raw lines carry a fractional .5 cent.
      total_cents = sum(round_half_up(line) for each line)
    input_set: "teardown findings of the pinned report version; shop config; consumed reservations (final variant)"
    constants:
      STANDARD_MULTIPLIER: 1.0
    precision: "integer cents; round_half_up per line, then sum"
    variants:
      - name: provisional
        when: "quote creation"
        difference: "uses estimated_labor_hours and shop default per-mm material costs; no SCRAP line"
      - name: final
        when: "work-order close (repair path)"
        difference: "uses actual_labor_hours, consumed reservation cost_per_mm_cents, and adds the SCRAP line; same line structure and rounding order"

  - name: invoice_total_settlement
    trigger: "work-order close (repair path)"
    algorithm: waterfall_allocation
    formula: |
      # Pinned evaluation order (the tier test uses the PRE-discount subtotal and PRE-invoice ytd):
      # 1) subtotal = work_order.final_total_cents
      # 2) tier_test = customer.ytd_spend_cents (before this invoice) + subtotal
      #    tier = GOLD if tier_test >= loyalty_gold_threshold_cents
      #           else SILVER if tier_test >= loyalty_silver_threshold_cents else NONE
      # 3) discount = round_half_up(subtotal x tier_pct)
      # 4) discounted = subtotal - discount
      # 5) env_fee = max(env_fee_min_cents, round_half_up(discounted x env_fee_pct))
      # 6) invoice_total_cents = discounted + env_fee
    input_set: "closing work order; its customer"
    precision: "integer cents; round_half_up at steps 3 and 5"

  - name: exchange_core_credit
    trigger: "exchange-unit fulfill (provisional); core evaluation (final)"
    algorithm: constraint_propagation
    formula: |
      base = bore_mm <= core_bore_medium_max_mm ? core_base_small_cents
           : bore_mm <= core_bore_large_max_mm ? core_base_medium_cents
           : core_base_large_cents
      cond_factor = GOOD ? 1.0 : WORN ? 0.6 : DAMAGED ? 0.25 : 0.0      # SCRAP -> 0.0
      comp_factor = COMPLETE ? 1.0 : 0.5                                 # MISSING_PARTS -> 0.5
      cap = round_half_down(unit_price_cents x exchange_credit_cap_pct)
      credit = min(cap, round_half_up(base x cond_factor x comp_factor))
      # SCRAP condition: credit = 0 AND core_disposal_fee_cents is charged at work-order close
      credit = max(0, credit)
    input_set: "exchange unit; cylinder bore of the linked work order (core = the returned cylinder)"
    precision: "integer cents; round_half_up on the product; cap truncation round_half_down"
    variants:
      - name: provisional
        when: "fulfill"
        difference: "assumes condition GOOD and completeness COMPLETE (both factors 1.0)"
      - name: final
        when: "evaluate-core"
        difference: "uses inspected condition and completeness; may diverge arbitrarily from provisional"

  - name: stock_cut_allocation
    trigger: "stock-reservation creation (manual or auto-cascade on quote approval)"
    algorithm: constraint_propagation
    formula: |
      required_mm = cut_length_mm + kerf_mm
      candidates = InventoryItem where material matches AND diameter_mm matches
                   AND status == AVAILABLE AND length_mm >= required_mm
      selector: rank candidates by length_mm ASC (smallest sufficient piece);
                tie-break by created_at ASC; empty candidate set => ERR_NO_STOCK_FITS.
      On selection: item.length_mm -= required_mm
      if item.length_mm < min_remnant_mm:
        reservation.scrap_length_mm = item.length_mm
        reservation.scrap_charge_cents = scrap_length_mm x item.cost_per_mm_cents
        item.length_mm = 0
        item.status = DEPLETED
      # Invariant: received_total_mm == sum(AVAILABLE item lengths) + sum(OPEN/CONSUMED reservation cut lengths)
      #            + sum(scrap lengths) + sum(kerf lengths)
    input_set: "reservation request; all InventoryItem rows"
    precision: "integer mm; integer cents"

  - name: cleanliness_code_rollup
    trigger: "POST /fluid-power/work-orders/{id}/cleanliness-checks"
    algorithm: threshold
    formula: |
      code(c) = 0 if c == 0 else ceil(log2(c))       # ISO 4406: count <= 2^code
      # e.g. c = 2^13 = 8192 -> code 13 (boundary inclusive); c = 8193 -> code 14
      passes = (code(c4) <= cleanliness_target_code4)
               AND (code(c6) <= cleanliness_target_code6)
               AND (code(c14) <= cleanliness_target_code14)
      # stores latest_cleanliness_code4/6/14 and cleanliness_passed on the work order
    input_set: "single sample counts c4_count, c6_count, c14_count; shop targets"
    precision: "integer codes"

  - name: pressure_hold_requirement
    trigger: "pressure-test creation"
    algorithm: threshold
    formula: |
      rated = cylinder.pressure_class == CLASS_3000 ? rated_pressure_class_3000_psi : rated_pressure_class_5000_psi
      required_hold_psi = round_half_up(pressure_test_factor x rated)   # 1.5 x 3000 = 4500
      # record-result passed=true is only valid when measured_hold_psi >= required_hold_psi
      # (boundary inclusive) AND duration_min >= test_hold_min_minutes AND leakage_drops == 0
    input_set: "work order's cylinder pressure class; shop factor"
    precision: "integer psi"

  - name: turnaround_tier_gate
    trigger: "work-order creation"
    algorithm: threshold
    formula: |
      if promised_hours <= emergency_cutoff_hours:   tier must be EMERGENCY            # boundary inclusive: 24 -> EMERGENCY
      elif promised_hours <= expedite_cutoff_hours:  tier must be EMERGENCY or EXPEDITE # boundary inclusive: 48 -> EXPEDITE ok
      else:                                          any tier allowed
      # violation => ERR_PROMISE_INFEASIBLE
    input_set: "requested tier, promised_hours, shop cutoffs"
    precision: "integer hours"

  - name: field_service_pricing
    trigger: "field-job creation (provisional); field-job completion (final)"
    algorithm: aggregation
    formula: |
      hose_rate(type) = WIRE_BRAID_2SN ? hose_price_wire_braid_2sn_cents_per_m
                      : SPIRAL_4SH ? hose_price_spiral_4sh_cents_per_m
                      : hose_price_thermoplastic_cents_per_m
      per_assembly(a) = crimp_fee_cents + round_half_up(a.length_m x hose_rate(a.hose_type)) + 2 x a.fitting_price_cents
      mileage = max(0, distance_km - mileage_free_km) x mileage_rate_cents_per_km
      callout = callout_base_cents x (emergency_callout ? emergency_callout_multiplier : 1.0)
      total = callout + sum(per_assembly) + mileage
    input_set: "job assemblies, distance_km, emergency_callout flag, shop config"
    precision: "integer cents; per-assembly hose term round_half_up before summing"
    variants:
      - name: provisional
        when: "job creation"
        difference: "assumes emergency_callout = false (callout multiplier 1.0)"
      - name: final
        when: "job completion"
        difference: "uses the emergency_callout flag computed at schedule time"

  - name: credit_exposure_check
    trigger: "quote approval"
    algorithm: aggregation
    formula: |
      open_exposure = sum(provisional_total_cents of APPROVED quotes whose work order
                          belongs to this customer and is not CLOSED/CANCELLED/SCRAPPED)
      require open_exposure + this_quote.provisional_total_cents <= customer.credit_limit_cents
      # boundary inclusive: exactly equal passes
    input_set: "customer; all APPROVED quotes on that customer's non-terminal work orders; the quote being approved"
    precision: "integer cents"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: business_constraint, check: "Request body shape: required fields present, types and enum members valid", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role and X-User-ID headers present; role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 3, category: auth, check: "Role permitted for this endpoint per RBAC matrix", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 4, category: auth, check: "Entity-backed ownership: Customer actor's X-User-ID == resource.customer_id; Technician actor's X-User-ID == work_order.assigned_technician_id / job.technician_id", error_id: ERR_NOT_OWNER, http_status: 403, applies_to: "owner-scoped endpoints (approve, request-revision, authorize-scrap, select-exchange, cancel as Customer; start-repair, complete-assembly, consume, dispatch, complete as Technician)" }
  - { priority: 5, category: existence, check: "Path ids and body foreign keys reference existing resources, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 6, category: existence, check: "OCC: expected_<parent>_version equals the parent entity's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /fluid-power/teardown-reports/{id}, POST /fluid-power/field-service-jobs/{id}/schedule, PATCH /fluid-power/shops/{id}" }
  - { priority: 7, category: state, check: "Resource in a valid from-state for the requested transition; terminal resources reject everything", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state-transition endpoints" }
  - { priority: 8, category: state, check: "Domain state guards: quote approvable (SENT), teardown uniqueness, unit IN_POOL, reservation OPEN, scrap authorized before complete-scrap, core FULFILLED before receive-core, cylinder ACTIVE for new work order, customer not SUSPENDED for new work order, pressure-test creation only from ASSEMBLED/TEST_PENDING with no SCHEDULED test outstanding", error_id: "ERR_QUOTE_NOT_APPROVABLE | ERR_TEARDOWN_REPORT_EXISTS | ERR_UNIT_NOT_IN_POOL | ERR_RESERVATION_NOT_OPEN | ERR_SCRAP_NOT_AUTHORIZED | ERR_EXCHANGE_NOT_FULFILLED | ERR_CORE_NOT_RETURNED | ERR_CYLINDER_RETIRED | ERR_CUSTOMER_SUSPENDED | ERR_INVALID_STATE", http_status: 409, applies_to: "transition-specific" }
  - { priority: 9, category: business_safety, check: "Safety/compliance gates: cleanliness class within target for assembly; segregation of duties on certification; pass-record consistency with measured pressure/duration/leakage; crimp tolerance on field completion; seal-kit bore/fluid/pressure-class compatibility", error_id: "ERR_CLEANLINESS_CLASS_EXCEEDED | ERR_SEGREGATION_OF_DUTIES | ERR_PRESSURE_HOLD_INSUFFICIENT | ERR_CRIMP_OUT_OF_TOLERANCE | ERR_SEAL_KIT_INCOMPATIBLE", http_status: 422, applies_to: "complete-assembly, certificates, record-result, field complete, cylinder create / teardown seal-kit override" }
  - { priority: 10, category: business_temporal, check: "Temporal rules: bay window overlap incl. buffer; technician half-open window overlap; window not in past; quote TTL; turnaround tier feasibility", error_id: "ERR_TEST_BAY_WINDOW_OVERLAP | ERR_TECHNICIAN_WINDOW_OVERLAP | ERR_WINDOW_IN_PAST | ERR_QUOTE_EXPIRED | ERR_PROMISE_INFEASIBLE", http_status: 409, applies_to: "pressure-test create, field schedule, quote approve, work-order create" }
  - { priority: 11, category: business_constraint, check: "Aggregate/structural constraints: at most one DRAFT-or-SENT quote per work order; exchange spec match; stock piece exists; at most one ISSUED certificate per work order", error_id: "ERR_ACTIVE_QUOTE_EXISTS | ERR_SPEC_MISMATCH | ERR_NO_STOCK_FITS | ERR_CERTIFICATE_EXISTS", http_status: 409, applies_to: "quote create, select-exchange, reservation create, certificate create" }
  - { priority: 12, category: business_referential, check: "Version pinning: quote send requires pinned_teardown_version == current TeardownReport.version", error_id: ERR_TEARDOWN_STALE, http_status: 409, applies_to: "POST /fluid-power/quotes/{id}/send" }
  - { priority: 13, category: business_fiscal, check: "Fiscal: credit exposure including this quote must not exceed customer credit limit (inclusive boundary passes)", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 402, applies_to: "POST /fluid-power/quotes/{id}/approve" }

# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/fluid-power/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time."
    roles: [ShopAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced"]

  # --- Shop config ---
  - method: POST
    path: "/fluid-power/shops"
    description: "Create shop configuration (all rate/cutoff fields optional, defaults per entity table)"
    roles: [ShopAdmin]
    code: 201
    input: [name, "labor_rate_cents_per_hour?", "expedite_multiplier?", "emergency_multiplier?", "expedite_cutoff_hours?", "emergency_cutoff_hours?", "honing_pass_fee_cents?", "cut_fee_cents?", "kerf_mm?", "min_remnant_mm?", "cleanliness_target_code4?", "cleanliness_target_code6?", "cleanliness_target_code14?", "quote_ttl_hours?", "bay_buffer_minutes?"]
    output: Shop
    side_effects: []
  - method: GET
    path: "/fluid-power/shops/{id}"
    description: "Get shop config"
    roles: [ShopAdmin, ServiceAdvisor, Technician, QualityInspector, Customer]
    code: 200
    input: []
    output: Shop
    side_effects: []
  - method: PATCH
    path: "/fluid-power/shops/{id}"
    description: "Update shop config (OCC-guarded)"
    roles: [ShopAdmin]
    code: 200
    input: [expected_shop_version, "labor_rate_cents_per_hour?", "expedite_multiplier?", "emergency_multiplier?", "expedite_cutoff_hours?", "emergency_cutoff_hours?", "honing_pass_fee_cents?", "cut_fee_cents?", "min_remnant_mm?", "quote_ttl_hours?", "bay_buffer_minutes?"]
    output: Shop
    side_effects: ["increments Shop.version by 1"]

  # --- Customer ---
  - method: POST
    path: "/fluid-power/customers"
    description: "Register a customer"
    roles: [ShopAdmin, ServiceAdvisor]
    code: 201
    input: [full_name, email, credit_limit_cents, "opening_ytd_spend_cents?"]
    output: Customer
    side_effects: ["status=ACTIVE; ytd_spend_cents := opening_ytd_spend_cents"]
  - method: GET
    path: "/fluid-power/customers/{id}"
    description: "Get a customer"
    roles: [ShopAdmin, ServiceAdvisor, Technician, QualityInspector, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: POST
    path: "/fluid-power/customers/{id}/suspend"
    description: "Suspend a customer (credit hold); suspended customers cannot open new work orders"
    roles: [ShopAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: ["status ACTIVE -> SUSPENDED"]
  - method: POST
    path: "/fluid-power/customers/{id}/reactivate"
    description: "Reactivate a suspended customer"
    roles: [ShopAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: ["status SUSPENDED -> ACTIVE"]

  # --- Technician ---
  - method: POST
    path: "/fluid-power/technicians"
    description: "Onboard a technician"
    roles: [ShopAdmin]
    code: 201
    input: [full_name, skills, "active?"]
    output: Technician
    side_effects: []
  - method: GET
    path: "/fluid-power/technicians/{id}"
    description: "Get a technician"
    roles: [ShopAdmin, ServiceAdvisor, Technician, QualityInspector, Customer]
    code: 200
    input: []
    output: Technician
    side_effects: []

  # --- SealKit catalog ---
  - method: POST
    path: "/fluid-power/seal-kits"
    description: "Create a seal kit catalog entry"
    roles: [ShopAdmin]
    code: 201
    input: [kit_code, bore_min_mm, bore_max_mm, pressure_class_max, fluid_compat, price_cents, material]
    output: SealKit
    side_effects: []
  - method: GET
    path: "/fluid-power/seal-kits/{id}"
    description: "Get a seal kit"
    roles: [ShopAdmin, ServiceAdvisor, Technician, QualityInspector, Customer]
    code: 200
    input: []
    output: SealKit
    side_effects: []

  # --- Cylinder ---
  - method: POST
    path: "/fluid-power/cylinders"
    description: "Register a cylinder with spec and seal-kit configuration; kit compatibility validated (safety)"
    roles: [ShopAdmin, ServiceAdvisor, Customer]
    code: 201
    input: [customer_id, serial_number, bore_mm, stroke_mm, rod_diameter_mm, pressure_class, fluid_type, seal_kit_id]
    output: Cylinder
    side_effects: ["status=ACTIVE; Customer actor must register with customer_id == own X-User-ID"]
  - method: GET
    path: "/fluid-power/cylinders/{id}"
    description: "Get a cylinder"
    roles: [ShopAdmin, ServiceAdvisor, Technician, QualityInspector, Customer]
    code: 200
    input: []
    output: Cylinder
    side_effects: []
  - method: GET
    path: "/fluid-power/cylinders"
    description: "List cylinders with filters"
    roles: [ShopAdmin, ServiceAdvisor, Technician, QualityInspector, Customer]
    code: 200
    input: ["customer_id?", "seal_kit_id?", "status?", "limit?", "offset?"]
    output: Cylinder[]
    side_effects: []

  # --- WorkOrder ---
  - method: POST
    path: "/fluid-power/work-orders"
    description: "Open a repair work order; turnaround tier feasibility gate applies"
    roles: [ShopAdmin, ServiceAdvisor, Customer]
    code: 201
    input: [cylinder_id, tier, promised_hours, complaint]
    output: WorkOrder
    side_effects: ["status=INTAKE; customer_id denormalized from cylinder; tier feasibility per turnaround_tier_gate; cylinder must be ACTIVE and customer not SUSPENDED"]
  - method: GET
    path: "/fluid-power/work-orders/{id}"
    description: "Get a work order"
    roles: [ShopAdmin, ServiceAdvisor, Technician, QualityInspector, Customer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: GET
    path: "/fluid-power/work-orders"
    description: "List work orders with filters"
    roles: [ShopAdmin, ServiceAdvisor, Technician, QualityInspector, Customer]
    code: 200
    input: ["cylinder_id?", "customer_id?", "status?", "assigned_technician_id?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []
  - method: POST
    path: "/fluid-power/work-orders/{id}/start-teardown"
    description: "Assign technician and begin teardown"
    roles: [ShopAdmin, ServiceAdvisor]
    code: 200
    input: [technician_id]
    output: WorkOrder
    side_effects: ["INTAKE -> TEARDOWN; assigned_technician_id set; increments WorkOrder.version by 1"]
  - method: POST
    path: "/fluid-power/work-orders/{id}/cancel"
    description: "Cancel a work order (early states only)"
    roles: [ShopAdmin, ServiceAdvisor, Customer]
    code: 200
    input: ["reason?"]
    output: WorkOrder
    side_effects: ["-> CANCELLED; active quotes -> SUPERSEDED"]
  - method: POST
    path: "/fluid-power/work-orders/{id}/authorize-scrap"
    description: "Customer authorizes scrapping the unit instead of repair"
    roles: [Customer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["QUOTE_SENT/REVISION_REQUESTED -> SCRAP_AUTHORIZED; SENT quote -> REJECTED_SCRAP"]
  - method: POST
    path: "/fluid-power/work-orders/{id}/complete-scrap"
    description: "Record disposal and close out scrap"
    roles: [ShopAdmin, ServiceAdvisor]
    code: 200
    input: [disposal_method]
    output: WorkOrder
    side_effects: ["SCRAP_AUTHORIZED -> SCRAPPED; Cylinder -> RETIRED"]
  - method: POST
    path: "/fluid-power/work-orders/{id}/start-repair"
    description: "Begin physical repair after approval"
    roles: [Technician]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["APPROVED -> IN_REPAIR"]
  - method: POST
    path: "/fluid-power/work-orders/{id}/complete-assembly"
    description: "Mark assembly complete; requires passing cleanliness and all reservations consumed"
    roles: [Technician]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["IN_REPAIR -> ASSEMBLED"]
  - method: POST
    path: "/fluid-power/work-orders/{id}/cleanliness-checks"
    description: "Record a contamination sample; computes ISO 4406 codes and cleanliness_passed"
    roles: [Technician, QualityInspector]
    code: 200
    input: [c4_count, c6_count, c14_count]
    output: WorkOrder
    side_effects: ["cleanliness_code_rollup; latest_cleanliness_* and cleanliness_passed updated"]
  - method: POST
    path: "/fluid-power/work-orders/{id}/select-exchange"
    description: "Customer elects a remanufactured exchange unit instead of repair"
    roles: [Customer]
    code: 200
    input: [exchange_unit_id]
    output: WorkOrder
    side_effects: ["QUOTE_SENT -> EXCHANGE_SELECTED; quote -> SUPERSEDED; unit -> RESERVED"]
  - method: POST
    path: "/fluid-power/work-orders/{id}/close"
    description: "Close a certified repair or a settled exchange; computes final pricing and invoice"
    roles: [ShopAdmin, ServiceAdvisor]
    code: 200
    input: [actual_labor_hours]
    output: WorkOrder
    side_effects: ["CERTIFIED/EXCHANGE_FULFILLED -> CLOSED; quote_pricing final variant; invoice_total_settlement; Customer.ytd_spend_cents updated"]

  # --- TeardownReport ---
  - method: POST
    path: "/fluid-power/teardown-reports"
    description: "File teardown findings; moves work order to QUOTE_DRAFT"
    roles: [Technician]
    code: 201
    input: [work_order_id, rod_needed, "rod_cut_length_mm?", tube_needed, "tube_cut_length_mm?", "honing_passes?", "seal_kit_id?", estimated_labor_hours, "findings_notes?"]
    output: TeardownReport
    side_effects: ["WorkOrder TEARDOWN -> QUOTE_DRAFT; seal-kit override compatibility re-validated"]
  - method: GET
    path: "/fluid-power/teardown-reports/{id}"
    description: "Get a teardown report"
    roles: [ShopAdmin, ServiceAdvisor, Technician, QualityInspector, Customer]
    code: 200
    input: []
    output: TeardownReport
    side_effects: []
  - method: GET
    path: "/fluid-power/teardown-reports"
    description: "List teardown reports"
    roles: [ShopAdmin, ServiceAdvisor, Technician, QualityInspector, Customer]
    code: 200
    input: ["work_order_id?", "seal_kit_id?", "limit?", "offset?"]
    output: TeardownReport[]
    side_effects: []
  - method: PATCH
    path: "/fluid-power/teardown-reports/{id}"
    description: "Revise findings (OCC-guarded); allowed only while the work order is QUOTE_DRAFT or REVISION_REQUESTED"
    roles: [Technician]
    code: 200
    input: [expected_teardown_report_version, "rod_needed?", "rod_cut_length_mm?", "tube_needed?", "tube_cut_length_mm?", "honing_passes?", "seal_kit_id?", "estimated_labor_hours?", "findings_notes?"]
    output: TeardownReport
    side_effects: ["increments TeardownReport.version by 1; DRAFT quotes pinned to older versions become stale (send then fails ERR_TEARDOWN_STALE)"]

  # --- Quote ---
  - method: POST
    path: "/fluid-power/quotes"
    description: "Draft a quote from the current teardown report; pins the report version; computes provisional pricing"
    roles: [ShopAdmin, ServiceAdvisor]
    code: 201
    input: [work_order_id]
    output: Quote
    side_effects: ["status=DRAFT; pinned_teardown_version set; quote_pricing provisional variant; in REVISION_REQUESTED supersedes the revised quote and returns WorkOrder to QUOTE_DRAFT"]
  - method: GET
    path: "/fluid-power/quotes/{id}"
    description: "Get a quote"
    roles: [ShopAdmin, ServiceAdvisor, Technician, QualityInspector, Customer]
    code: 200
    input: []
    output: Quote
    side_effects: []
  - method: GET
    path: "/fluid-power/quotes"
    description: "List quotes"
