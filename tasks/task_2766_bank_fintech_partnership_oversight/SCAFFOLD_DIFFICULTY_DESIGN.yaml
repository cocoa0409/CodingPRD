  - rule_id: compensating_invariant
    instances:

      - name: clawback_restores_every_conserved_settlement_term_to_its_pre_funding_value
        grounds:
          - state_machines.SettlementBatch.funding_status=FUNDED_to_funding_status=CLAWED_BACK
          - calculations.settlement_funding_computation
          - invariants.settlement_conservation_invariant
          - entities.LedgerEntry.fields.reversal_of_entry_id
        distinguishing_aspect: |
          The conserved quantity is money_cents: funding moves settlement_base
          out of FBO_END_USER into three destinations, and the clawback must
          restore all four terms - FBO_END_USER balance, RESERVE balance,
          cumulative_paid_out_cents and cumulative_bank_fee_cents - to their
          exact pre-funding values (20000000 / 1250000 / 0 / 0) by writing three
          CLAWBACK LedgerEntry rows that each carry reversal_of_entry_id, while
          net_to_partner_cents 7614000 is retained on the batch as history.
          NOTE ON SCOPE: only Invariant 2 of settlement_conservation_invariant is
          asserted here. Invariant 1 as declared does not hold, because the
          funding legs plus the cumulative_bank_fee_cents increment count the fee
          twice, so CONSERVED_SETTLEMENT_CENTS falls by exactly bank_fee_cents at
          fund time (21250000 -> 21189000) even in a correct implementation.
        test_recipe:
          setup:
            - "Partner 'Cardinal Payments' LIVE at reserve_requirement_bps = 500 with FBO_END_USER 20000000 and RESERVE 1250000, so required_reserve = max(250000, 1000000, 0) = 1000000 and shortfall = 0."
            - "Batch over [2026-07-01, 2026-07-15) with gross 8000000, interchange 120000, returns 45000 and partner_reported_net 8000000; bank reports 8000000 so reconciliation is MATCHED with variance 0."
            - "settlement_base = 8000000 + 120000 - 45000 = 8075000; gross 8000000 < TIER_2_GROSS_FLOOR_CENTS 10000000 so bank_fee_bps_applied = 45 and bank_fee = BANK_BASE_FEE_CENTS 25000 + round_half_up(8000000 * 45 / 10000) = 25000 + 36000 = 61000; reserve_funding is keyed on gross, not on the base: 8000000 * 500 / 10000 = 400000; net_to_partner = 8075000 - 61000 - 400000 = 7614000."
