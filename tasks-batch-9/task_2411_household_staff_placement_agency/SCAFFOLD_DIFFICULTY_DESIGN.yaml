        reads availability_status == AVAILABLE
      - after the booking the requisition reads status == TRIALING with active_trial_count == 1 and the candidate
        reads availability_status == ON_TRIAL
      - the trigger returns 200 with status == CANCELLED and cancel_reason == CLIENT_REQUEST
