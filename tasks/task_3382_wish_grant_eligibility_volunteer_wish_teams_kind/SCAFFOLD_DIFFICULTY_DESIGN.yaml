        grounds:
          - state_machines.WishEvent.SCHEDULED_to_COMPLETED
          - state_machines.Wish.SCHEDULED_to_GRANTED
          - state_machines.FulfillmentPlan.APPROVED_to_COMPLETED
          - state_machines.PlanLineItem.COMMITTED_to_CONSUMED
          - calculations.chapter_cost_averages
        distinguishing_aspect: |
          Depth-5 cascade from POST /wish-grant/wish-events/{id}/complete: event
          COMPLETED causes wish GRANTED, which completes the APPROVED plan, which
          consumes its COMMITTED lines, which decrements each offer's
          quantity_reserved AND quantity_total, which recomputes the chapter's
          committed/granted aggregates and posture. The sibling cascade originates
          from a different trigger (plan abort).
