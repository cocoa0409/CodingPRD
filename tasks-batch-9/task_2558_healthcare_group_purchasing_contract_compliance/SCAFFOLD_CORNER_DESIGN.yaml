              captures: { m2: $.data.id }
            - call: "POST /gpo/commitments"
              payload: { member_id: "${m1}", contract_id: "${c1}", elected_tier_code: "TIER_0", committed_volume_units: 100, effective_from: "2026-08-01" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { k1: $.data.id, kv1: $.data.version }
            - call: "POST /gpo/commitments"
              payload: { member_id: "${m2}", contract_id: "${c1}", elected_tier_code: "TIER_0", committed_volume_units: 100, effective_from: "2026-08-01" }
              as: MemberMaterialsManager
              as_user_id: "${m2}"
              captures: { k2: $.data.id }
          trigger:
            - call: "POST /gpo/commitments/${k1}/open-requalification"
              payload: { reason: "annual review" }
              as: ComplianceAnalyst
              captures: { e1: $.data.error_id }
            - call: "POST /gpo/compliance-measurements"
              payload: { commitment_id: "${k1}", period_start: "2026-08-01", period_end: "2026-09-01", expected_commitment_version: "${kv1}" }
              as: ComplianceAnalyst
              captures: { e2: $.data.error_id }
            - call: "POST /gpo/commitments/${k2}/terminate"
              payload: { reason: "member left the aggregation group" }
              as: ComplianceAnalyst
              captures: { es2: $.data.election_status, ls2: $.data.lop_status }
            - call: "POST /gpo/commitments/${k2}/lop/issue"
              payload: {}
              as: ContractManager
              captures: { e3: $.data.error_id }
            - call: "POST /gpo/commitments/${k1}/lop/issue"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/commitments/${k1}/lop/sign"
              payload: { signer_name: "Dana Whitfield" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
            - call: "POST /gpo/commitments/${k1}/lop/countersign"
              payload: {}
              as: ContractManager
              captures: { es1: $.data.election_status }
            - call: "POST /gpo/commitments/${k1}/open-requalification"
              payload: { reason: "annual review" }
              as: ComplianceAnalyst
              captures: { es1b: $.data.election_status, kv2: $.data.version }
            - call: "POST /gpo/compliance-measurements"
              payload: { commitment_id: "${k1}", period_start: "2026-08-01", period_end: "2026-09-01", expected_commitment_version: "${kv2}" }
              as: ComplianceAnalyst
              captures: { ms: $.data.status }
          assert:
            - "${e1} == ERR_COMMITMENT_NOT_ACTIVE with HTTP 409 — requalification opens only from ACTIVE"
            - "${e2} == ERR_COMMITMENT_NOT_ACTIVE and NOT ERR_STALE_COMMITMENT_VERSION, even though ${kv1} was the commitment's true version: the state band (priority 8) precedes the OCC band (priority 9)"
            - "${es2} == TERMINATED with ${ls2} == NOT_ISSUED — terminating an ELECTED commitment leaves the document dimension untouched"
            - "${e3} == ERR_COMMITMENT_NOT_ELECTED with HTTP 409 — the lop_status guard passes (NOT_ISSUED) and the election guard is what refuses"
            - "${es1} == ACTIVE after countersign, then ${es1b} == REQUAL_REVIEW: the very same open-requalification call now succeeds"
            - "the final measurement create returns 201 with ${ms} == DRAFT — REQUAL_REVIEW is an acceptable state for measuring"

      - name: measurement_and_distribution_state_guards_return_their_own_codes
        claim_type: violation_to_error
        grounds:
          - errors.ERR_INVALID_MEASUREMENT_STATE
          - errors.ERR_DUPLICATE_DISTRIBUTION_PERIOD
          - errors.ERR_DISTRIBUTION_BASIS_MISMATCH
          - state_machines.ComplianceMeasurement.DRAFT_to_PRELIMINARY
        distinguishing_aspect: "Each settlement machine reports its own state code: finalizing a DRAFT measurement and measuring an already-PRELIMINARY one are both ERR_INVALID_MEASUREMENT_STATE, a second distribution over the same (contract, period) is ERR_DUPLICATE_DISTRIBUTION_PERIOD, and on an ACCRUAL-basis contract the COLLECTED row cannot be distributed at all — ERR_DISTRIBUTION_BASIS_MISMATCH — which is the mirror image of the COLLECTED-basis contract's ERR_DISTRIBUTION_BASIS_NOT_COLLECTABLE."
