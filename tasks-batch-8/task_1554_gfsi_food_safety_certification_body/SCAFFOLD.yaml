# =============================================================================
# SCAFFOLD.yaml — GFSI Food Safety Certification Body (SQF/BRC)
# §1.0–§1.7 seed tables. Difficulty and corner designs live in the sibling
# files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: "GFSI Food Safety Certification Body (SQF/BRC certification body): client scope & scheme selection, auditor assignment & competency/conflict check, audit scheduling & unannounced window, nonconformity grading & corrective-action deadline, certificate issuance/suspension & appeal, auditor calibration & witness audits, certification decision independence, database publication & scope change"

domain_name: gfsi-certification-body
api_prefix: /certification-body

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency   # OCC on Certificate.version for scope changes
    - cascading_side_effects   # NC overdue -> certificate suspension -> directory unlist
    - scheduled_actions        # logical clock drives deadline & expiry sweeps
    - rate_threshold_triggers  # score thresholds, CAP rejection limit
  entity_topology: flat            # peer entities joined by foreign keys, no URL nesting of the aggregate roots
  state_machine_shape: branching   # certificate fork-with-revert; NC cycle; forked appeal/scope-change
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties  # the certification decision maker must not be the auditor of record
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Scheme
    parent: null
    common_fields: true
    fields:
      - { name: code, type: enum, source: input, description: "Scheme code", constraints: "SQF | BRC" }
      - { name: name, type: string, source: input, description: "Human-readable scheme name" }
      - { name: supported_category_codes, type: array, source: input, description: "List of product category codes this scheme certifies (e.g. BAKERY, DAIRY, MEAT); non-empty" }
      - { name: critical_nc_days, type: integer, source: input, description: "Calendar days from NC creation to corrective-action deadline for CRITICAL grade" }
      - { name: major_nc_days, type: integer, source: input, description: "Calendar days for MAJOR grade" }
      - { name: minor_nc_days, type: integer, source: input, description: "Calendar days for MINOR grade" }
      - { name: pass_score, type: integer, source: input, description: "Minimum resolved audit score required to GRANT (inclusive boundary: >= passes)" }
      - { name: unannounced_every_n, type: integer, source: input, description: "Every Nth audit in a client+scheme cycle must be UNANNOUNCED (sequence_number % n == 0)" }
      - { name: unannounced_min_window_days, type: integer, source: input, description: "Minimum window length in days for UNANNOUNCED audits" }
      - { name: announced_max_window_days, type: integer, source: input, description: "Maximum window length in days for INITIAL/SURVEILLANCE audits" }
      - { name: min_audit_gap_days, type: integer, source: input, description: "Minimum separation in days between window_end of one audit and window_start of the next for the same client+scheme" }
      - { name: cert_validity_days, type: integer, source: input, description: "Certificate validity period in days from issuance" }
      - { name: witness_validity_days, type: integer, source: input, description: "A PASS witness audit keeps an auditor calibrated for this many days" }
      - { name: appeal_window_days, type: integer, source: input, description: "Days from certificate.status_changed_at within which an appeal may be filed (inclusive boundary)" }
      - { name: max_cap_rejections, type: integer, source: input, description: "When an NC's rejection_count reaches this number, the suspension cascade fires" }
      - { name: rotation_limit, type: integer, source: input, description: "An auditor may not be assigned if they audited this many most-recent consecutive audits for the same client+scheme" }
      - { name: base_fee, type: number, source: input, description: "Flat certification fee component" }
      - { name: per_category_fee, type: number, source: input, description: "Fee per scoped product category (before risk-tier multiplier)" }
      - { name: day_rate, type: number, source: input, description: "Audit day rate for the audit-fee component" }
      - { name: unannounced_uplift_pct, type: number, source: input, description: "Fractional uplift applied to the day-rate component for UNANNOUNCED audits (0.10 = 10%)" }
      - { name: high_risk_multiplier, type: number, source: input, description: "Per-category fee multiplier for categories with risk_tier HIGH" }

  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Client organization legal name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: country, type: string, source: input, description: "Country of operation (ISO-ish free text)" }

  - name: Auditor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Auditor full name" }
      - { name: competency_categories, type: array, source: input, description: "Product category codes the auditor is competent to audit" }
      - { name: conflicted_client_ids, type: array, source: input, default: [], description: "List of Client ids the auditor has declared a conflict of interest with; the auditor may never be assigned to those clients' audits" }
      - { name: active_audit_count, type: integer, source: computed, default: 0, description: "Count of audits with auditor_id == this auditor and status IN {SCHEDULED, IN_PROGRESS}" }
      - { name: calibration_status, type: enum, source: computed, default: LAPSED, description: "CURRENT | LAPSED — CURRENT iff a PASS WitnessAudit exists with witnessed_on >= (current logical time - scheme.witness_validity_days)" }
      - { name: last_witnessed_on, type: datetime, source: computed, description: "Most recent PASS witness audit date, null when none" }

  - name: DecisionMaker
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Reviewer full name" }
      - { name: linked_auditor_id, type: string, source: input, default: null, description: "FK -> Auditor.id; nullable — set when this decision maker is also a registered auditor (drives independence checks)" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; taken from X-User-ID of the creating ClientAdmin" }
      - { name: scheme_id, type: string, source: input, description: "FK -> Scheme.id; the scheme (SQF/BRC) the client applies under" }
      - { name: site_name, type: string, source: input, description: "Manufacturing site name" }
      - { name: product_categories, type: array, source: input, description: "Requested scope: array of { category_code, risk_tier } objects; risk_tier IN {STANDARD, HIGH}; non-empty; every category_code must be in scheme.supported_category_codes" }
      - { name: scope_text, type: string, source: input, description: "Free-text scope description (e.g. 'production of baked goods')" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED" }
      - { name: provisional_fee_quote, type: number, source: computed, default: null, description: "Quote variant of certification_fee, computed when the application is ACCEPTED" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical time of submission" }
      - { name: reviewed_at, type: datetime, source: system, default: null, description: "Logical time of scope-review decision" }

  - name: Audit
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; the application this audit belongs to" }
      - { name: auditor_id, type: string, source: system, default: null, description: "FK -> Auditor.id; assigned auditor, null until assign" }
      - { name: decision_maker_id, type: string, source: system, default: null, description: "FK -> DecisionMaker.id; who rendered the certification decision" }
      - { name: sequence_number, type: integer, source: system, description: "1-based sequence of this audit within its (client, scheme) chain; ordering key for audit lists" }
      - { name: audit_type, type: enum, source: system, description: "INITIAL (sequence 1) | SURVEILLANCE | UNANNOUNCED (sequence % scheme.unannounced_every_n == 0)" }
      - { name: window_start, type: datetime, source: system, description: "Start of the audit window (may be changed by reschedule while SCHEDULED)" }
      - { name: window_end, type: datetime, source: system, description: "End of the audit window" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | REPORT_SUBMITTED | DECIDED | CANCELLED" }
      - { name: reported_score, type: number, source: computed, default: null, description: "audit_score reported variant, frozen at submit-report" }
      - { name: resolved_score, type: number, source: computed, default: null, description: "audit_score resolved variant, computed at decision" }
      - { name: audit_fee, type: number, source: computed, default: null, description: "Day-rate fee component for this audit, computed at submit-report (includes unannounced uplift when applicable)" }
      - { name: actual_days, type: integer, source: input, default: null, description: "Actual audit duration in days, declared at submit-report; >= 1" }
      - { name: decision_outcome, type: enum, source: system, default: null, description: "GRANT | DENY | null until DECIDED" }
      - { name: started_at, type: datetime, source: system, default: null, description: "Logical time the audit started" }
      - { name: reported_at, type: datetime, source: system, default: null, description: "Logical time the report was submitted" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Logical time of the certification decision" }

  - name: Nonconformity
    parent: null
    common_fields: true
    fields:
      - { name: audit_id, type: string, source: system, description: "FK -> Audit.id; the audit this finding was raised in" }
      - { name: grade, type: enum, source: input, description: "CRITICAL | MAJOR | MINOR" }
      - { name: clause_ref, type: string, source: input, description: "Scheme clause reference (e.g. 'SQF 2.4.3')" }
      - { name: description, type: string, source: input, description: "Finding description" }
      - { name: status, type: enum, source: system, description: "OPEN | UNDER_REVIEW | CLOSED | OVERDUE" }
      - { name: deadline, type: datetime, source: computed, description: "created_at + scheme deadline days for this grade (see nc_deadline calculation)" }
      - { name: cap_text, type: string, source: input, default: null, description: "Corrective-action plan text from the client" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical time of the latest CAP submission" }
      - { name: rejection_count, type: integer, source: system, default: 0, description: "Number of times the CAP has been rejected; reaching scheme.max_cap_rejections fires the suspension cascade" }
      - { name: reviewed_at, type: datetime, source: system, default: null, description: "Logical time of the latest CAP review" }

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id" }
      - { name: scheme_id, type: string, source: system, description: "FK -> Scheme.id" }
      - { name: application_id, type: string, source: system, description: "FK -> Application.id" }
      - { name: audit_id, type: string, source: system, description: "FK -> Audit.id; the issuing (initial) audit" }
      - { name: certificate_number, type: string, source: system, description: "System-minted, format CERT-NNNNNN with a zero-padded 6-digit global issuance sequence" }
      - { name: product_categories, type: array, source: system, description: "Certified scope, copied from the application at issuance and replaced on approved scope change" }
      - { name: scope_text, type: string, source: system, description: "Scope text copied from the application at issuance" }
      - { name: valid_from, type: datetime, source: system, description: "Decision timestamp of the issuing GRANT" }
      - { name: valid_to, type: datetime, source: system, description: "valid_from + scheme.cert_validity_days" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | WITHDRAWN | EXPIRED" }
      - { name: suspension_reason, type: enum, source: system, default: null, description: "MANUAL | NC_OVERDUE | CAP_REJECT_LIMIT; null unless SUSPENDED" }
      - { name: status_changed_at, type: datetime, source: system, description: "Logical time of the last status change; anchors the appeal window" }
      - { name: final_fee, type: number, source: computed, description: "Invoice variant of certification_fee, computed at issuance" }

  - name: ScopeChange
    parent: null
    common_fields: true
    fields:
      - { name: certificate_id, type: string, source: system, description: "FK -> Certificate.id; the certificate whose scope is being changed" }
      - { name: requested_categories, type: array, source: input, description: "Replacement scope: array of { category_code, risk_tier }; non-empty; every category_code must be in the scheme's supported_category_codes" }
      - { name: reason, type: string, source: input, description: "Client's reason for the scope change" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED" }
      - { name: decided_by, type: string, source: system, default: null, description: "DecisionMaker id who decided (audit-trail stamp)" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Logical time of the scope-change decision" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: certificate_id, type: string, source: system, description: "FK -> Certificate.id; the suspended/withdrawn certificate under appeal" }
      - { name: grounds, type: string, source: input, description: "Appeal grounds text" }
      - { name: status, type: enum, source: system, description: "FILED | UPHELD | OVERTURNED" }
      - { name: decided_by, type: string, source: system, default: null, description: "DecisionMaker id who decided the appeal (audit-trail stamp)" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Logical time of the appeal decision" }

  - name: WitnessAudit
    parent: null
    common_fields: true
    fields:
      - { name: auditor_id, type: string, source: system, description: "FK -> Auditor.id; the auditor who was witnessed" }
      - { name: witnessed_on, type: datetime, source: input, description: "Date the witness audit took place" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL" }
      - { name: notes, type: string, source: input, default: null, description: "Optional assessor notes" }

  - name: DirectoryListing
    parent: null
    common_fields: true
    fields:
      - { name: certificate_id, type: string, source: system, description: "FK -> Certificate.id; unique — exactly one listing per certificate" }
      - { name: client_name, type: string, source: system, description: "Denormalized client name for public display" }
      - { name: scheme_code, type: string, source: system, description: "Denormalized scheme code (SQF | BRC)" }
      - { name: scope_summary, type: string, source: computed, description: "Category codes of certificate.product_categories sorted ASC, joined with ',' — regenerated on approved scope change" }
      - { name: status, type: enum, source: system, description: "LISTED | UNLISTED" }
      - { name: listed_at, type: datetime, source: system, description: "Logical time of the last transition to LISTED" }
      - { name: unlisted_at, type: datetime, source: system, default: null, description: "Logical time of the last transition to UNLISTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Application
    initial_state: DRAFT
    terminal_states: [REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /certification-body/applications/{id}/submit"
        actor: ClientAdmin
        preconditions:
          - "caller owns the application: application.client_id == X-User-ID (ERR_FORBIDDEN_OWNERSHIP — checked first)"
          - "application.status == DRAFT (ERR_INVALID_APPLICATION_STATE)"
        side_effects:
          - "sets submitted_at = current logical time; bumps version"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /certification-body/applications/{id}/review with outcome=ACCEPTED"
        actor: SchemeAdmin
        preconditions:
          - "application.status == SUBMITTED (ERR_INVALID_APPLICATION_STATE)"
          - "no other application for the same (client_id, scheme_id) in status IN {DRAFT, SUBMITTED} (ERR_DUPLICATE_APPLICATION)"
          - "no certificate for the same (client_id, scheme_id) in status IN {ACTIVE, SUSPENDED} (ERR_DUPLICATE_CERTIFICATION_SCOPE)"
        side_effects:
          - "computes provisional_fee_quote (certification_fee quote variant); bumps version"
          - "creates Audit: sequence_number=1, audit_type=INITIAL, status=SCHEDULED, window_start = reviewed_at + 14 days, window_end = window_start + scheme.announced_max_window_days days"
          - "sets reviewed_at = current logical time"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /certification-body/applications/{id}/review with outcome=REJECTED"
        actor: SchemeAdmin
        preconditions:
          - "application.status == SUBMITTED (ERR_INVALID_APPLICATION_STATE)"
        side_effects:
          - "sets reviewed_at; stores rejection_reason; bumps version"

  - entity: Audit
    initial_state: SCHEDULED
    terminal_states: [DECIDED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /certification-body/audits/{id}/start"
        actor: Auditor
        preconditions:
          - "caller ownership: audit.auditor_id is non-null and != X-User-ID (ERR_FORBIDDEN_OWNERSHIP — checked first)"
          - "audit.status == SCHEDULED (ERR_INVALID_AUDIT_STATE)"
          - "the parent application is ACCEPTED (ERR_INVALID_APPLICATION_STATE)"
          - "window_start <= current logical time <= window_end (ERR_OUTSIDE_AUDIT_WINDOW)"
          - "audit.auditor_id IS NOT NULL (ERR_AUDIT_UNASSIGNED — reached only when no assignee exists to fail ownership)"
        side_effects:
          - "sets started_at = current logical time; bumps version"
      - from: IN_PROGRESS
        to: REPORT_SUBMITTED
        trigger: "POST /certification-body/audits/{id}/submit-report"
        actor: Auditor
        preconditions:
          - "caller is the assigned auditor (ERR_FORBIDDEN_OWNERSHIP — checked first)"
          - "audit.status == IN_PROGRESS (ERR_INVALID_AUDIT_STATE)"
          - "actual_days >= 1 (ERR_INVALID_REQUEST)"
        side_effects:
          - "computes and stores reported_score (audit_score reported variant over all NCs of this audit)"
          - "computes and stores audit_fee = round_half_up(actual_days * scheme.day_rate * (1 + (audit_type == UNANNOUNCED ? scheme.unannounced_uplift_pct : 0)), 2)"
          - "sets reported_at; bumps version"
      - from: REPORT_SUBMITTED
        to: DECIDED
        trigger: "POST /certification-body/audits/{id}/decision"
        actor: DecisionMaker
        preconditions:
          - "audit.status == REPORT_SUBMITTED (ERR_INVALID_AUDIT_STATE)"
          - "independence: acting decision maker's linked_auditor_id IS NULL or != audit.auditor_id (ERR_DECISION_NOT_INDEPENDENT)"
          - "for outcome=GRANT: zero nonconformities of this audit in status != CLOSED (ERR_OPEN_NCS_REMAIN)"
          - "for outcome=GRANT: resolved_score >= scheme.pass_score (ERR_SCORE_BELOW_PASS)"
        side_effects:
          - "computes and stores resolved_score (audit_score resolved variant); sets decision_outcome, decision_maker_id, decided_at; bumps version"
          - "assigned auditor's active_audit_count decrements by 1"
          - "GRANT + audit_type=INITIAL: creates Certificate (valid_from=decided_at, valid_to=decided_at + scheme.cert_validity_days, status=ACTIVE, status_changed_at=decided_at, certificate_number=CERT-NNNNNN next global sequence, product_categories/scope_text copied from application), computes final_fee (invoice variant), creates DirectoryListing(status=LISTED, listed_at=decided_at), and creates the next Audit (see next_audit_sequence_and_type)"
          - "GRANT + audit_type IN {SURVEILLANCE, UNANNOUNCED}: existing certificate for (client, scheme) stays ACTIVE; creates the next Audit"
          - "DENY + audit_type=INITIAL: no certificate is created and no next audit is created"
          - "DENY + audit_type IN {SURVEILLANCE, UNANNOUNCED}: the ACTIVE certificate for (client, scheme) transitions to WITHDRAWN (status_changed_at=decided_at) and its DirectoryListing transitions to UNLISTED (unlisted_at=decided_at); no next audit is created"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /certification-body/audits/{id}/cancel"
        actor: SchemeAdmin
        preconditions:
          - "audit.status == SCHEDULED (ERR_INVALID_AUDIT_STATE)"
        side_effects:
          - "if assigned, the auditor's active_audit_count decrements by 1; bumps version"

  - entity: Nonconformity
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /certification-body/nonconformities/{id}/submit-cap"
        actor: ClientAdmin
        preconditions:
          - "caller owns the client behind the finding: audit.application.client_id == X-User-ID (ERR_FORBIDDEN_OWNERSHIP — checked first)"
          - "nonconformity.status == OPEN or OVERDUE (ERR_INVALID_NC_STATE)"
        side_effects:
          - "stores cap_text; sets submitted_at = current logical time; bumps version"
      - from: OVERDUE
        to: UNDER_REVIEW
        trigger: "POST /certification-body/nonconformities/{id}/submit-cap (late submission)"
        actor: ClientAdmin
        preconditions:
          - "ownership as above (ERR_FORBIDDEN_OWNERSHIP — checked first)"
          - "nonconformity.status == OPEN or OVERDUE (ERR_INVALID_NC_STATE)"
        side_effects:
          - "stores cap_text; sets submitted_at; bumps version (the certificate suspension, if any, is NOT auto-reverted — reinstatement is a separate guarded transition)"
      - from: UNDER_REVIEW
        to: CLOSED
        trigger: "POST /certification-body/nonconformities/{id}/review-cap with outcome=ACCEPT"
        actor: Auditor
        preconditions:
          - "caller is the auditor of the finding's audit (ERR_FORBIDDEN_OWNERSHIP — checked first)"
          - "nonconformity.status == UNDER_REVIEW (ERR_INVALID_NC_STATE)"
        side_effects:
          - "sets reviewed_at; bumps version"
      - from: UNDER_REVIEW
        to: OPEN
        trigger: "POST /certification-body/nonconformities/{id}/review-cap with outcome=REJECT"
        actor: Auditor
        preconditions:
          - "caller is the auditor of the finding's audit (ERR_FORBIDDEN_OWNERSHIP — checked first)"
          - "nonconformity.status == UNDER_REVIEW (ERR_INVALID_NC_STATE)"
        side_effects:
          - "rejection_count += 1; sets reviewed_at; bumps version"
          - "if rejection_count reaches scheme.max_cap_rejections: a certificate for the same (client, scheme) in status ACTIVE transitions to SUSPENDED with suspension_reason=CAP_REJECT_LIMIT and status_changed_at=now; that suspension transitions its DirectoryListing to UNLISTED (unlisted_at=now)"
      - from: OPEN
        to: OVERDUE
        trigger: "system sweep fired by POST /certification-body/_clock/set_current_utc (see overdue_nc_sweep)"
        actor: system
        preconditions:
          - "nonconformity.status == OPEN AND current logical time > nonconformity.deadline (strictly greater — exactly at the deadline is NOT overdue)"
        side_effects:
          - "a certificate for the same (client, scheme) in status ACTIVE transitions to SUSPENDED with suspension_reason=NC_OVERDUE and status_changed_at=now"
          - "that suspension transitions the certificate's DirectoryListing to UNLISTED (unlisted_at=now)"

  - entity: Certificate
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN, EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /certification-body/certificates/{id}/suspend (manual) OR system cascade from NC OVERDUE / CAP rejection limit"
        actor: DecisionMaker | system
        preconditions:
          - "certificate.status == ACTIVE (ERR_INVALID_CERTIFICATE_STATE)"
        side_effects:
          - "sets suspension_reason (MANUAL | NC_OVERDUE | CAP_REJECT_LIMIT) and status_changed_at=now; bumps version"
          - "its DirectoryListing transitions to UNLISTED (unlisted_at=now)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /certification-body/certificates/{id}/reinstate OR appeal OVERTURNED cascade"
        actor: DecisionMaker | system
        preconditions:
          - "certificate.status == SUSPENDED (ERR_INVALID_CERTIFICATE_STATE)"
          - "manual reinstate only: when suspension_reason IN {NC_OVERDUE, CAP_REJECT_LIMIT}, every nonconformity raised on audits of the same (client, scheme) must be CLOSED (ERR_OPEN_NCS_REMAIN); suspension_reason == MANUAL carries no NC guard"
        side_effects:
          - "clears suspension_reason to null; sets status_changed_at=now; bumps version"
          - "its DirectoryListing transitions to LISTED (listed_at=now)"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /certification-body/certificates/{id}/withdraw OR DENY decision on a SURVEILLANCE/UNANNOUNCED audit"
        actor: DecisionMaker | system
        preconditions:
          - "certificate.status IN {ACTIVE, SUSPENDED} (ERR_INVALID_CERTIFICATE_STATE)"
        side_effects:
          - "sets status_changed_at=now; bumps version"
          - "its DirectoryListing transitions to UNLISTED (unlisted_at=now)"
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /certification-body/certificates/{id}/withdraw"
        actor: DecisionMaker
        preconditions:
          - "certificate.status IN {ACTIVE, SUSPENDED} (ERR_INVALID_CERTIFICATE_STATE)"
        side_effects:
          - "sets status_changed_at=now; bumps version; DirectoryListing -> UNLISTED"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system sweep fired by POST /certification-body/_clock/set_current_utc (see certificate_expiry_sweep)"
        actor: system
        preconditions:
          - "certificate.status IN {ACTIVE, SUSPENDED} AND current logical time > valid_to (strictly greater)"
        side_effects:
          - "sets status_changed_at=now; bumps version; DirectoryListing -> UNLISTED (unlisted_at=now)"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system sweep fired by POST /certification-body/_clock/set_current_utc"
        actor: system
        preconditions:
          - "certificate.status IN {ACTIVE, SUSPENDED} AND current logical time > valid_to"
        side_effects:
          - "sets status_changed_at=now; bumps version; DirectoryListing -> UNLISTED (unlisted_at=now)"

  - entity: ScopeChange
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /certification-body/scope-changes/{id}/decision with outcome=APPROVED"
        actor: DecisionMaker
        preconditions:
          - "scope_change.status == PENDING (ERR_INVALID_SCOPE_CHANGE_STATE)"
        side_effects:
          - "certificate.product_categories := scope_change.requested_categories; certificate.version increments by 1"
          - "the certificate's DirectoryListing.scope_summary is regenerated from the new product_categories"
          - "sets decided_by, decided_at; bumps version"
      - from: PENDING
        to: REJECTED
        trigger: "POST /certification-body/scope-changes/{id}/decision with outcome=REJECTED"
        actor: DecisionMaker
        preconditions:
          - "scope_change.status == PENDING (ERR_INVALID_SCOPE_CHANGE_STATE)"
        side_effects:
          - "sets decided_by, decided_at; bumps version; certificate untouched"

  - entity: Appeal
    initial_state: FILED
    terminal_states: [UPHELD, OVERTURNED]
    transitions:
      - from: FILED
        to: UPHELD
        trigger: "POST /certification-body/appeals/{id}/decide with outcome=UPHELD"
        actor: DecisionMaker
        preconditions:
          - "appeal.status == FILED (ERR_INVALID_APPEAL_STATE)"
          - "independence: acting decision maker's id != the certificate's issuing audit's decision_maker_id AND acting decision maker's linked_auditor_id != that audit's auditor_id (ERR_APPEAL_NOT_INDEPENDENT)"
        side_effects:
          - "sets decided_by, decided_at; bumps version; certificate status unchanged"
      - from: FILED
        to: OVERTURNED
        trigger: "POST /certification-body/appeals/{id}/decide with outcome=OVERTURNED"
        actor: DecisionMaker
        preconditions:
          - "appeal.status == FILED (ERR_INVALID_APPEAL_STATE)"
          - "independence as above (ERR_APPEAL_NOT_INDEPENDENT)"
        side_effects:
          - "sets decided_by, decided_at; bumps version"
          - "the certificate transitions SUSPENDED -> ACTIVE or WITHDRAWN -> ACTIVE (suspension_reason cleared, status_changed_at=now, certificate.version +1)"
          - "that reinstatement transitions the certificate's DirectoryListing to LISTED (listed_at=now)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: certificate-scope-change-stale-occ
    parent_entity: Certificate
    write_endpoint: "POST /certification-body/certificates/{id}/scope-changes"
    occ_field: "expected_certificate_version"
    description: |
      Creating a ScopeChange against a Certificate whose version has advanced
      since the client last observed it is rejected. Scope changes are written
      against the scope the client read; when another write (an earlier scope
      change request, a suspension, a reinstatement, an approval) has advanced
      Certificate.version, the requester's view of the certificate is stale and
      the create is refused with 412.
    error_id: ERR_STALE_CERTIFICATE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: audit_score
    trigger: "POST /certification-body/audits/{id}/submit-report stores the reported variant; POST /certification-body/audits/{id}/decision computes the resolved variant"
    algorithm: weighted_scoring
    formula: |
      weights = { CRITICAL: 25, MAJOR: 10, MINOR: 3 }
      reported  = max(0, 100 - sum(weights[g] for g in all NCs of the audit))
      resolved  = max(0, 100 - sum(weights[g] for NC in NCs where status != CLOSED)
                              - sum(floor(weights[g] / 2) for NC in NCs where status == CLOSED))
      floor halves: CRITICAL -> 12, MAJOR -> 5, MINOR -> 1
      GRANT additionally requires resolved >= scheme.pass_score (inclusive)
    input_set: "All Nonconformity rows of the audit, regardless of status (reported) / filtered by status at decision time (resolved)"
    constants:
      W_CRITICAL: 25
      W_MAJOR: 10
      W_MINOR: 3
      BASE_SCORE: 100
    precision: "integer arithmetic; floor on halving; result clamped at 0"
    variants:
      - name: reported
        when: "at submit-report; frozen onto audit.reported_score"
        difference: "every NC deducts its full weight regardless of closure status"
      - name: resolved
        when: "at certification decision; stored onto audit.resolved_score"
        difference: "CLOSED NCs deduct only floor(weight/2); non-CLOSED NCs deduct full weight — identical NC data therefore yields a higher resolved score once findings close"

  - name: certification_fee
    trigger: "quote variant on application ACCEPT (stored on application.provisional_fee_quote); invoice variant at certificate issuance (stored on certificate.final_fee)"
    algorithm: tiered_pricing
    formula: |
      quote   = round_half_up(base_fee + n_categories * per_category_fee, 2)
      invoice = round_half_up(base_fee, 2)
              + sum over each scoped category c of round_half_up(per_category_fee * mult(c), 2)
              + round_half_up(actual_days * day_rate * (1 + (audit_type == UNANNOUNCED ? unannounced_uplift_pct : 0)), 2)
      where mult(c) = scheme.high_risk_multiplier when c.risk_tier == HIGH else 1.0
      ROUNDING ORDER IS PINNED: each line item is rounded to 2 decimals FIRST, then summed.
      (Sum-then-round is the forbidden alternative and yields different cents, e.g.
       2 x round(333.33*1.5)=1000.00 vs round(2*499.995)=999.99.)
      The third line of the invoice equals the issuing audit's audit_fee.
    input_set: "Scheme fee constants; application/certificate product_categories; issuing audit's actual_days and audit_type"
    constants: {}
    precision: "2 decimal places, round_half_up, round-per-line-then-sum"
    variants:
      - name: quote
        when: "application acceptance — no audit has run yet"
        difference: "flat base + unmultiplied per-category count; no day-rate component, no risk-tier multiplier, no uplift"
      - name: invoice
        when: "certificate issuance"
        difference: "adds risk-tier multipliers per category line and the day-rate component with unannounced uplift; same scope data therefore produces a different total than the quote"

  - name: nc_deadline
    trigger: "Nonconformity creation (POST /certification-body/audits/{id}/nonconformities)"
    algorithm: threshold
    formula: |
      deadline = nc.created_at + scheme.{critical|major|minor}_nc_days * 24h
      (scheme = the scheme of the audit's application; days added as exact 24-hour multiples)
      OVERDUE iff current logical time > deadline (strictly greater; equality is NOT overdue)
    input_set: "The new NC's grade and created_at; scheme deadline constants"
    constants: {}
    precision: "second precision on UTC timestamps"
    variants: []

  - name: auditor_calibration_status
    trigger: "evaluated on auditor read and on every assign attempt"
    algorithm: threshold
    formula: |
      CURRENT iff exists WitnessAudit w with w.auditor_id == auditor.id AND w.result == PASS
              AND w.witnessed_on >= (current logical time - scheme.witness_validity_days * 24h)
      (boundary is inclusive: exactly witness_validity_days old still counts)
      else LAPSED. FAIL witness audits never count.
    input_set: "WitnessAudit rows for the auditor, ordered by witnessed_on DESC; ties broken by created_at ASC"
    constants: {}
    precision: "second precision"
    variants: []

  - name: next_audit_sequence_and_type
    trigger: "audit DECIDED with outcome GRANT"
    algorithm: projection
    formula: |
      next.sequence_number = decided.sequence_number + 1
      next.audit_type = UNANNOUNCED if next.sequence_number % scheme.unannounced_every_n == 0 else SURVEILLANCE
      next.window_start = max(decided_at + 14 days, decided.window_end + scheme.min_audit_gap_days * 24h)
      next.window_end   = next.window_start + (UNANNOUNCED ? scheme.unannounced_min_window_days
                                                          : scheme.announced_max_window_days) * 24h
    input_set: "The just-decided audit; scheme scheduling constants"
    constants: {}
    precision: "second precision"
    variants: []

  - name: overdue_nc_sweep
    trigger: "POST /certification-body/_clock/set_current_utc advances the logical clock"
    algorithm: threshold
    formula: |
      for each Nonconformity with status == OPEN and now > deadline, in created_at ASC order:
        NC -> OVERDUE
        if a Certificate for the same (client_id, scheme_id) has status == ACTIVE:
          Certificate -> SUSPENDED (suspension_reason=NC_OVERDUE, status_changed_at=now, version+1)
          its DirectoryListing -> UNLISTED (unlisted_at=now)
        (an already-SUSPENDED certificate is not re-transitioned; no drift on repeated sweeps)
    input_set: "All NCs with status == OPEN; certificates in status ACTIVE of the same (client, scheme)"
    constants: {}
    precision: "second precision; strict > comparison against deadline"
    variants: []

  - name: certificate_expiry_sweep
    trigger: "POST /certification-body/_clock/set_current_utc advances the logical clock"
    algorithm: threshold
    formula: |
      for each Certificate with status IN {ACTIVE, SUSPENDED} and now > valid_to (strictly greater),
      in created_at ASC order:
        Certificate -> EXPIRED (status_changed_at=now, version+1)
        its DirectoryListing -> UNLISTED (unlisted_at=now)
    input_set: "Certificates in status ACTIVE or SUSPENDED"
    constants: {}
    precision: "second precision; strict > comparison against valid_to"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except GET /certification-body/directory"
  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "Ownership: entity-backed caller matches the resource owner where an owner is attached (ClientAdmin: the resource's client chain equals X-User-ID; Auditor: audit.auditor_id is non-null and equals X-User-ID). A null assignee does NOT fail this check — it is caught by the ERR_AUDIT_UNASSIGNED constraint at priority 9"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "owned-resource endpoints (submit, submit-cap, scope-changes, appeals create, start, submit-report, nonconformities create, review-cap, scoped reads)"
  - priority: 4
    category: existence
    check: "Path identifiers exist, validated left-to-right"
    error_id: ERR_CLIENT_NOT_FOUND / ERR_SCHEME_NOT_FOUND / ERR_AUDITOR_NOT_FOUND / ERR_DECISION_MAKER_NOT_FOUND / ERR_APPLICATION_NOT_FOUND / ERR_AUDIT_NOT_FOUND / ERR_NC_NOT_FOUND / ERR_CERTIFICATE_NOT_FOUND / ERR_SCOPE_CHANGE_NOT_FOUND / ERR_APPEAL_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 5
    category: state
    check: "Target entity status permits the requested transition; for scope-change creation, expected_certificate_version == certificate.version"
    error_id: ERR_INVALID_APPLICATION_STATE / ERR_INVALID_AUDIT_STATE / ERR_INVALID_NC_STATE / ERR_INVALID_CERTIFICATE_STATE / ERR_INVALID_SCOPE_CHANGE_STATE / ERR_INVALID_APPEAL_STATE / ERR_STALE_CERTIFICATE_VERSION
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: business_referential
    check: "Body foreign-key references exist (auditor_id on assign; certificate_id on appeal create)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "POST .../assign, POST /appeals"
  - priority: 7
    category: business_safety
    check: "Regulatory independence and conflict rules: no conflict-of-interest assignment; certification decision maker is not the audit's auditor (linked_auditor_id); appeal decision maker is neither the original decision maker nor the audit's auditor"
    error_id: ERR_AUDITOR_CONFLICT_OF_INTEREST / ERR_DECISION_NOT_INDEPENDENT / ERR_APPEAL_NOT_INDEPENDENT
    http_status: 422
    applies_to: "POST .../assign, POST .../decision, POST /appeals/{id}/decide"
  - priority: 8
    category: business_temporal
    check: "Temporal rules: start inside the audit window; window length bounds by audit type; auditor windows must not intersect; same client+scheme windows must respect the minimum gap; appeal filed within the appeal window; rescheduled window must not end in the past"
    error_id: ERR_OUTSIDE_AUDIT_WINDOW / ERR_INVALID_AUDIT_WINDOW / ERR_AUDITOR_WINDOW_OVERLAP / ERR_AUDIT_WINDOW_TOO_CLOSE / ERR_APPEAL_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST .../start, POST .../reschedule, POST .../assign, POST /appeals"
  - priority: 9
    category: business_constraint
    check: "Capability and aggregate constraints: auditor competency covers every scoped category; auditor calibration CURRENT; rotation limit; application/scope-change categories supported by the scheme; no duplicate open application; no duplicate active certificate scope; no duplicate open appeal; auditor assigned before start; GRANT requires zero non-CLOSED NCs and resolved_score >= pass_score"
    error_id: ERR_AUDITOR_COMPETENCY_GAP / ERR_AUDITOR_NOT_CALIBRATED / ERR_AUDITOR_ROTATION_LIMIT / ERR_SCOPE_CATEGORY_UNSUPPORTED / ERR_DUPLICATE_APPLICATION / ERR_DUPLICATE_CERTIFICATION_SCOPE / ERR_DUPLICATE_APPEAL / ERR_AUDIT_UNASSIGNED / ERR_OPEN_NCS_REMAIN / ERR_SCORE_BELOW_PASS
    http_status: 422
    applies_to: "POST .../assign, POST /applications, POST .../review, POST /appeals, POST .../start, POST .../decision, POST .../scope-changes"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- schemes ----
  - method: POST
    path: /certification-body/schemes
    description: "Register a certification scheme with its rule constants"
    roles: [SchemeAdmin]
    code: 201
    input: [code, name, supported_category_codes, critical_nc_days, major_nc_days, minor_nc_days, pass_score, unannounced_every_n, unannounced_min_window_days, announced_max_window_days, min_audit_gap_days, cert_validity_days, witness_validity_days, appeal_window_days, max_cap_rejections, rotation_limit, base_fee, per_category_fee, day_rate, unannounced_uplift_pct, high_risk_multiplier]
    output: Scheme
    side_effects: []
  - method: GET
    path: /certification-body/schemes
    description: "List schemes (created_at ASC), paginated"
    roles: [SchemeAdmin, ClientAdmin, Auditor, DecisionMaker]
    code: 200
    input: ["limit?", "offset?"]
    output: Scheme[]
    side_effects: []
  - method: GET
    path: /certification-body/schemes/{id}
    description: "Get one scheme"
    roles: [SchemeAdmin, ClientAdmin, Auditor, DecisionMaker]
    code: 200
    input: []
    output: Scheme
    side_effects: []

  # ---- clients ----
  - method: POST
    path: /certification-body/clients
    description: "Register a client organization; the returned id is the ClientAdmin's X-User-ID"
    roles: [SchemeAdmin]
    code: 201
    input: [name, contact_email, country]
    output: Client
    side_effects: []
  - method: GET
    path: /certification-body/clients/{id}
    description: "Get one client (ClientAdmin may read only its own id)"
    roles: [SchemeAdmin, ClientAdmin]
    code: 200
    input: []
    output: Client
    side_effects: []

  # ---- auditors ----
  - method: POST
    path: /certification-body/auditors
    description: "Register an auditor with competency categories and declared client conflicts"
    roles: [SchemeAdmin]
    code: 201
    input: [name, competency_categories, "conflicted_client_ids?"]
    output: Auditor
    side_effects: []
  - method: GET
    path: /certification-body/auditors/{id}
    description: "Get one auditor (includes computed calibration_status and active_audit_count)"
    roles: [SchemeAdmin, Auditor, DecisionMaker]
    code: 200
    input: []
    output: Auditor
    side_effects: []
  - method: GET
    path: /certification-body/auditors/{id}/audits
    description: "List audits assigned to an auditor (sequence_number ASC)"
    roles: [SchemeAdmin, Auditor, DecisionMaker]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Audit[]
    side_effects: []
  - method: POST
    path: /certification-body/auditors/{id}/witness-audits
    description: "Record a witness (calibration) audit for an auditor"
    roles: [SchemeAdmin]
    code: 201
    input: [witnessed_on, result, "notes?"]
    output: WitnessAudit
    side_effects: ["refreshes the auditor's computed calibration_status and last_witnessed_on"]
  - method: GET
    path: /certification-body/auditors/{id}/witness-audits
    description: "List an auditor's witness audits (witnessed_on DESC, created_at ASC)"
    roles: [SchemeAdmin, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: WitnessAudit[]
    side_effects: []

  # ---- decision makers ----
  - method: POST
    path: /certification-body/decision-makers
    description: "Register a certification decision maker; linked_auditor_id set when the person is also an auditor"
    roles: [SchemeAdmin]
    code: 201
    input: [name, "linked_auditor_id?"]
    output: DecisionMaker
    side_effects: []
  - method: GET
    path: /certification-body/decision-makers/{id}
    description: "Get one decision maker"
    roles: [SchemeAdmin, DecisionMaker]
    code: 200
    input: []
    output: DecisionMaker
    side_effects: []
  - method: GET
    path: /certification-body/decision-makers
    description: "List decision makers, optionally filtered by linked_auditor_id (created_at ASC)"
    roles: [SchemeAdmin, DecisionMaker]
    code: 200
    input: ["linked_auditor_id?", "limit?", "offset?"]
    output: DecisionMaker[]
    side_effects: []
  - method: GET
    path: /certification-body/decision-makers/{id}/audits
    description: "List audits whose certification decision this decision maker rendered (sequence_number ASC)"
    roles: [SchemeAdmin, DecisionMaker]
    code: 200
    input: ["limit?", "offset?"]
    output: Audit[]
    side_effects: []

  # ---- applications ----
  - method: POST
    path: /certification-body/applications
    description: "Client creates a certification application selecting scheme + site + product-category scope; rejected when the same (client, scheme) already has an application in DRAFT or SUBMITTED"
    roles: [ClientAdmin]
    code: 201
    input: [scheme_id, site_name, product_categories, scope_text]
    output: Application
    side_effects: []
  - method: GET
    path: /certification-body/applications
    description: "List applications with optional filters (created_at ASC), paginated; ClientAdmin sees only its own"
    roles: [SchemeAdmin, ClientAdmin, DecisionMaker]
    code: 200
    input: ["client_id?", "scheme_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: GET
    path: /certification-body/applications/{id}
    description: "Get one application"
    roles: [SchemeAdmin, ClientAdmin, Auditor, DecisionMaker]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: POST
    path: /certification-body/applications/{id}/submit
    description: "Submit a DRAFT application for scope review"
    roles: [ClientAdmin]
    code: 200
    input: []
    output: Application
    side_effects: ["DRAFT -> SUBMITTED; sets submitted_at; increments Application.version by 1"]
  - method: POST
    path: /certification-body/applications/{id}/review
    description: "SchemeAdmin accepts (scope valid, no duplicate) or rejects a SUBMITTED application; acceptance computes the fee quote and creates the INITIAL audit"
    roles: [SchemeAdmin]
    code: 200
    input: [outcome, "rejection_reason?"]
    output: Application
    side_effects: ["on ACCEPTED: computes provisional_fee_quote; creates Audit sequence_number=1 type=INITIAL window [reviewed_at+14d, +announced_max_window_days]; on REJECTED: stores rejection_reason; increments Application.version by 1"]
  - method: GET
    path: /certification-body/applications/{id}/audits
    description: "List audits of an application (sequence_number ASC)"
    roles: [SchemeAdmin, ClientAdmin, Auditor, DecisionMaker]
    code: 200
    input: ["limit?", "offset?"]
    output: Audit[]
    side_effects: []

  # ---- audits ----
  - method: GET
    path: /certification-body/audits/{id}
    description: "Get one audit"
    roles: [SchemeAdmin, ClientAdmin, Auditor, DecisionMaker]
    code: 200
    input: []
    output: Audit
    side_effects: []
  - method: POST
    path: /certification-body/audits/{id}/assign
    description: "Assign an auditor: competency superset, no declared conflict, calibration CURRENT, rotation limit, and no window intersection with the auditor's other SCHEDULED/IN_PROGRESS audits"
    roles: [SchemeAdmin]
    code: 200
    input: [auditor_id]
    output: Audit
    side_effects: ["sets auditor_id; assigned auditor's active_audit_count increments by 1; increments Audit.version by 1"]
  - method: POST
    path: /certification-body/audits/{id}/reschedule
    description: "Change the window of a SCHEDULED audit; enforces per-type length bounds, minimum client+scheme gap against sibling audits, no intersection with the assigned auditor's other audits, and window_end not in the past"
    roles: [SchemeAdmin]
    code: 200
    input: [window_start, window_end]
    output: Audit
    side_effects: ["sets window_start/window_end; increments Audit.version by 1"]
  - method: POST
    path: /certification-body/audits/{id}/cancel
    description: "Cancel a SCHEDULED audit"
    roles: [SchemeAdmin]
    code: 200
    input: []
    output: Audit
    side_effects: ["SCHEDULED -> CANCELLED; assigned auditor's active_audit_count decrements by 1; increments Audit.version by 1"]
  - method: POST
    path: /certification-body/audits/{id}/start
    description: "Assigned auditor starts the audit inside its window"
    roles: [Auditor]
    code: 200
    input: []
    output: Audit
    side_effects: ["SCHEDULED -> IN_PROGRESS; sets started_at; increments Audit.version by 1"]
  - method: POST
    path: /certification-body/audits/{id}/nonconformities
    description: "Assigned auditor records a graded finding while the audit is IN_PROGRESS; deadline is computed from the scheme's per-grade day constants"
    roles: [Auditor]
    code: 201
    input: [grade, clause_ref, description]
    output: Nonconformity
    side_effects: ["creates Nonconformity OPEN with computed deadline"]
  - method: GET
    path: /certification-body/audits/{id}/nonconformities
    description: "List findings of an audit (created_at ASC)"
    roles: [SchemeAdmin, ClientAdmin, Auditor, DecisionMaker]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Nonconformity[]
    side_effects: []
  - method: POST
    path: /certification-body/audits/{id}/submit-report
    description: "Assigned auditor submits the audit report with the actual duration; freezes reported_score and audit_fee"
    roles: [Auditor]
    code: 200
    input: [actual_days]
    output: Audit
    side_effects: ["IN_PROGRESS -> REPORT_SUBMITTED; computes reported_score and audit_fee; sets reported_at; increments Audit.version by 1"]
  - method: POST
    path: /certification-body/audits/{id}/decision
    description: "Independent decision maker renders GRANT/DENY; GRANT on an INITIAL audit issues the certificate, computes the final fee, publishes the directory listing, and schedules the next audit"
    roles: [DecisionMaker]
    code: 200
    input: [outcome]
    output: Audit
    side_effects: ["REPORT_SUBMITTED -> DECIDED; computes resolved_score; auditor active_audit_count -1; on INITIAL GRANT creates Certificate + DirectoryListing; on GRANT creates next audit; on surveillance DENY withdraws the certificate and unlists the listing; increments Audit.version by 1"]
  - method: GET
    path: /certification-body/audits/{id}/certificate
    description: "Get the certificate issued by this audit (array of 0 or 1)"
    roles: [SchemeAdmin, ClientAdmin, Auditor, DecisionMaker]
    code: 200
    input: ["limit?", "offset?"]
    output: Certificate[]
    side_effects: []

  # ---- nonconformities ----
  - method: GET
    path: /certification-body/nonconformities/{id}
    description: "Get one nonconformity"
    roles: [SchemeAdmin, ClientAdmin, Auditor, DecisionMaker]
    code: 200
    input: []
    output: Nonconformity
    side_effects: []
  - method: POST
    path: /certification-body/nonconformities/{id}/submit-cap
    description: "Owning client submits (or re-submits) a corrective-action plan; allowed from OPEN and OVERDUE"
    roles: [ClientAdmin]
    code: 200
    input: [cap_text]
    output: Nonconformity
    side_effects: ["OPEN|OVERDUE -> UNDER_REVIEW; sets cap_text and submitted_at; increments Nonconformity.version by 1"]
  - method: POST
    path: /certification-body/nonconformities/{id}/review-cap
    description: "The audit's auditor accepts (CLOSED) or rejects (back to OPEN) the CAP; rejection reaching the scheme limit fires the suspension cascade"
    roles: [Auditor]
    code: 200
    input: [outcome, "review_notes?"]
    output: Nonconformity
    side_effects: ["ACCEPT: UNDER_REVIEW -> CLOSED; REJECT: UNDER_REVIEW -> OPEN and rejection_count +1, with certificate suspension cascade when rejection_count reaches scheme.max_cap_rejections; increments Nonconformity.version by 1"]

  # ---- certificates ----
  - method: GET
    path: /certification-body/certificates
    description: "List certificates with optional filters (created_at ASC), paginated"
    roles: [SchemeAdmin, ClientAdmin, DecisionMaker]
    code: 200
    input: ["client_id?", "scheme_id?", "application_id?", "status?", "limit?", "offset?"]
    output: Certificate[]
    side_effects: []
  - method: GET
    path: /certification-body/certificates/{id}
    description: "Get one certificate"
    roles: [SchemeAdmin, ClientAdmin, Auditor, DecisionMaker]
    code: 200
    input: []
    output: Certificate
    side_effects: []
  - method: POST
    path: /certification-body/certificates/{id}/suspend
    description: "Decision maker manually suspends an ACTIVE certificate"
    roles: [DecisionMaker]
    code: 200
    input: [reason]
    output: Certificate
    side_effects: ["ACTIVE -> SUSPENDED with suspension_reason=MANUAL; sets status_changed_at; DirectoryListing -> UNLISTED; increments Certificate.version by 1"]
  - method: POST
    path: /certification-body/certificates/{id}/reinstate
    description: "Decision maker reinstates a SUSPENDED certificate; NC-triggered suspensions first require every finding of the (client, scheme) CLOSED"
    roles: [DecisionMaker]
    code: 200
    input: []
    output: Certificate
    side_effects: ["SUSPENDED -> ACTIVE; clears suspension_reason; sets status_changed_at; DirectoryListing -> LISTED; increments Certificate.version by 1"]
  - method: POST
    path: /certification-body/certificates/{id}/withdraw
    description: "Decision maker withdraws an ACTIVE or SUSPENDED certificate (terminal)"
    roles: [DecisionMaker]
    code: 200
    input: []
    output: Certificate
    side_effects: ["ACTIVE|SUSPENDED -> WITHDRAWN; sets status_changed_at; DirectoryListing -> UNLISTED; increments Certificate.version by 1"]
  - method: POST
    path: /certification-body/certificates/{id}/scope-changes
    description: "Owning client requests a scope change against the certificate version it last read (OCC guard); certificate must be ACTIVE"
    roles: [ClientAdmin]
    code: 201
    input: [requested_categories, reason, expected_certificate_version]
    output: ScopeChange
    side_effects: ["creates ScopeChange PENDING; increments Certificate.version by 1 (touches the certificate record)"]
  - method: GET
    path: /certification-body/certificates/{id}/scope-changes
    description: "List scope-change requests of a certificate (created_at ASC)"
    roles: [SchemeAdmin, ClientAdmin, DecisionMaker]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ScopeChange[]
    side_effects: []
  - method: GET
    path: /certification-body/certificates/{id}/appeals
    description: "List appeals of a certificate (created_at ASC)"
    roles: [SchemeAdmin, ClientAdmin, DecisionMaker]
    code: 200
    input: ["limit?", "offset?"]
    output: Appeal[]
    side_effects: []
  - method: GET
    path: /certification-body/certificates/{id}/directory-listing
    description: "Get the public directory listing of a certificate (array of 0 or 1)"
    roles: [SchemeAdmin, ClientAdmin, DecisionMaker]
    code: 200
    input: ["limit?", "offset?"]
    output: DirectoryListing[]
    side_effects: []

  # ---- scope changes ----
  - method: POST
    path: /certification-body/scope-changes/{id}/decision
    description: "Decision maker approves (replaces certificate scope and refreshes the directory listing) or rejects a PENDING scope change"
    roles: [DecisionMaker]
    code: 200
    input: [outcome]
    output: ScopeChange
    side_effects: ["on APPROVED: certificate.product_categories := requested_categories, increments Certificate.version by 1, regenerates DirectoryListing.scope_summary; sets decided_by/decided_at; increments ScopeChange.version by 1"]

  # ---- appeals ----
  - method: POST
    path: /certification-body/appeals
    description: "Owning client appeals a SUSPENDED or WITHDRAWN certificate within scheme.appeal_window_days of status_changed_at; only one open appeal per certificate"
    roles: [ClientAdmin]
    code: 201
    input: [certificate_id, grounds]
    output: Appeal
    side_effects: []
  - method: POST
    path: /certification-body/appeals/{id}/decide
    description: "An independent decision maker upholds or overturns the appealed certificate status; OVERTURNED reinstates the certificate and re-lists the directory entry"
    roles: [DecisionMaker]
    code: 200
    input: [outcome]
    output: Appeal
    side_effects: ["FILED -> UPHELD|OVERTURNED; on OVERTURNED: certificate -> ACTIVE (version +1) and DirectoryListing -> LISTED; sets decided_by/decided_at; increments Appeal.version by 1"]

  # ---- public directory ----
  - method: GET
    path: /certification-body/directory
    description: "Public certification database; no authentication required; optional filters (created_at ASC), paginated"
    roles: [Anonymous, ClientAdmin, Auditor, DecisionMaker, SchemeAdmin]
    code: 200
    input: ["scheme_code?", "status?", "limit?", "offset?"]
    output: DirectoryListing[]
    side_effects: []

  # ---- logical clock (test-driving) ----
  - method: POST
    path: /certification-body/_clock/set_current_utc
    description: "Set the server's logical clock (ISO8601 UTC). Startup default is 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time. Advancing the clock fires overdue_nc_sweep and certificate_expiry_sweep."
    roles: [SchemeAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["sets the logical clock; runs overdue_nc_sweep and certificate_expiry_sweep"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Entity-backed caller does not own the target resource (client chain mismatch or auditor not assigned)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed value, or enum value outside the allowed set" }
  - { id: ERR_CLIENT_NOT_FOUND, http: 404, condition: "Client path id does not exist" }
  - { id: ERR_SCHEME_NOT_FOUND, http: 404, condition: "Scheme path id does not exist" }
  - { id: ERR_AUDITOR_NOT_FOUND, http: 404, condition: "Auditor path id does not exist" }
  - { id: ERR_DECISION_MAKER_NOT_FOUND, http: 404, condition: "DecisionMaker path id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "Application path id does not exist" }
  - { id: ERR_AUDIT_NOT_FOUND, http: 404, condition: "Audit path id does not exist" }
  - { id: ERR_NC_NOT_FOUND, http: 404, condition: "Nonconformity path id does not exist" }
  - { id: ERR_CERTIFICATE_NOT_FOUND, http: 404, condition: "Certificate path id does not exist" }
  - { id: ERR_SCOPE_CHANGE_NOT_FOUND, http: 404, condition: "ScopeChange path id does not exist" }
  - { id: ERR_APPEAL_NOT_FOUND, http: 404, condition: "Appeal path id does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "Body foreign-key reference does not exist (auditor_id on assign; certificate_id on appeal create)" }
  - { id: ERR_INVALID_APPLICATION_STATE, http: 409, condition: "Application status does not permit the requested transition" }
  - { id: ERR_INVALID_AUDIT_STATE, http: 409, condition: "Audit status does not permit the requested transition" }
  - { id: ERR_INVALID_NC_STATE, http: 409, condition: "Nonconformity status does not permit the requested transition" }
  - { id: ERR_INVALID_CERTIFICATE_STATE, http: 409, condition: "Certificate status does not permit the requested transition (incl. appeal target not SUSPENDED/WITHDRAWN and scope change on non-ACTIVE certificate)" }
  - { id: ERR_INVALID_SCOPE_CHANGE_STATE, http: 409, condition: "ScopeChange status does not permit the requested transition" }
  - { id: ERR_INVALID_APPEAL_STATE, http: 409, condition: "Appeal status does not permit the requested transition" }
  - { id: ERR_STALE_CERTIFICATE_VERSION, http: 412, condition: "expected_certificate_version does not match the certificate's current version (OCC)" }
  - { id: ERR_AUDITOR_COMPETENCY_GAP, http: 422, condition: "Auditor's competency_categories do not cover every product category in the application's scope" }
  - { id: ERR_AUDITOR_CONFLICT_OF_INTEREST, http: 422, condition: "Auditor has declared a conflict with the client (client id in conflicted_client_ids)" }
  - { id: ERR_AUDITOR_NOT_CALIBRATED, http: 422, condition: "Auditor has no PASS witness audit within scheme.witness_validity_days" }
  - { id: ERR_AUDITOR_ROTATION_LIMIT, http: 422, condition: "Auditor performed the scheme.rotation_limit most recent consecutive audits for this client+scheme" }
  - { id: ERR_AUDITOR_WINDOW_OVERLAP, http: 409, condition: "Audit window intersects another SCHEDULED/IN_PROGRESS audit window of the same auditor (inclusive-boundary intersection; [s1,e1] vs [s2,e2] overlap iff s1 <= e2 AND s2 <= e1)" }
  - { id: ERR_AUDIT_WINDOW_TOO_CLOSE, http: 409, condition: "Window violates the minimum gap versus a sibling audit of the same client+scheme: another audit's window_start - this window_end, or this window_start - another's window_end, must be >= scheme.min_audit_gap_days" }
  - { id: ERR_INVALID_AUDIT_WINDOW, http: 422, condition: "Window malformed: window_start >= window_end; announced type length > announced_max_window_days; unannounced length < unannounced_min_window_days; or window_end in the past" }
  - { id: ERR_OUTSIDE_AUDIT_WINDOW, http: 422, condition: "Current logical time is not within [window_start, window_end] at audit start" }
  - { id: ERR_AUDIT_UNASSIGNED, http: 422, condition: "Start attempted on an audit with no assigned auditor" }
  - { id: ERR_SCOPE_CATEGORY_UNSUPPORTED, http: 422, condition: "A product_categories category_code is not in the scheme's supported_category_codes (checked on application create and on scope-change create)" }
  - { id: ERR_DUPLICATE_APPLICATION, http: 409, condition: "Same (client, scheme) already has an application in DRAFT or SUBMITTED" }
  - { id: ERR_DUPLICATE_CERTIFICATION_SCOPE, http: 409, condition: "Application acceptance would duplicate a certificate in ACTIVE or SUSPENDED for the same (client, scheme)" }
  - { id: ERR_DUPLICATE_APPEAL, http: 409, condition: "Certificate already has an appeal in FILED status" }
  - { id: ERR_OPEN_NCS_REMAIN, http: 422, condition: "GRANT decision or NC-guarded reinstatement attempted while findings of the audit / (client, scheme) are not all CLOSED" }
  - { id: ERR_SCORE_BELOW_PASS, http: 422, condition: "GRANT decision with resolved_score < scheme.pass_score" }
  - { id: ERR_DECISION_NOT_INDEPENDENT, http: 403, condition: "Acting decision maker is linked (linked_auditor_id) to the auditor of the audit being decided" }
  - { id: ERR_APPEAL_NOT_INDEPENDENT, http: 403, condition: "Acting decision maker is the original decision maker of the certificate's issuing audit, or is linked to that audit's auditor" }
  - { id: ERR_APPEAL_WINDOW_EXPIRED, http: 422, condition: "Appeal filed after certificate.status_changed_at + scheme.appeal_window_days (inclusive boundary: exactly at the deadline is allowed)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SchemeAdmin
    description: "Certification-body operations staff: registers schemes, clients, auditors and decision makers; reviews application scope; assigns and schedules audits; records witness audits; drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /certification-body/schemes"
      - "POST /certification-body/clients"
      - "POST /certification-body/auditors"
      - "POST /certification-body/auditors/{id}/witness-audits"
      - "POST /certification-body/decision-makers"
      - "POST /certification-body/applications/{id}/review"
      - "POST /certification-body/audits/{id}/assign"
      - "POST /certification-body/audits/{id}/reschedule"
      - "POST /certification-body/audits/{id}/cancel"
      - "POST /certification-body/_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"
  - name: ClientAdmin
    description: "The certified (or applicant) food-business client; X-User-ID equals the Client id"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /certification-body/applications"
      - "POST /certification-body/applications/{id}/submit"
      - "POST /certification-body/nonconformities/{id}/submit-cap"
      - "POST /certification-body/certificates/{id}/scope-changes"
      - "POST /certification-body/appeals"
    shared_operations:
      - "GET endpoints scoped to own resources"
  - name: Auditor
    description: "Registered scheme auditor; X-User-ID equals the Auditor id; acts only on audits assigned to it"
    identity: "entity_backed:Auditor"
    exclusive_operations:
      - "POST /certification-body/audits/{id}/start"
      - "POST /certification-body/audits/{id}/nonconformities"
      - "POST /certification-body/audits/{id}/submit-report"
      - "POST /certification-body/nonconformities/{id}/review-cap"
    shared_operations:
      - "GET endpoints for own audits, findings, and witness record"
  - name: DecisionMaker
    description: "Independent certification decision maker; X-User-ID equals the DecisionMaker id; segregation of duties forbids deciding an audit whose auditor is the same person (linked_auditor_id) and forbids deciding an appeal when involved in the original decision"
    identity: "entity_backed:DecisionMaker"
    exclusive_operations:
      - "POST /certification-body/audits/{id}/decision"
      - "POST /certification-body/certificates/{id}/suspend"
      - "POST /certification-body/certificates/{id}/reinstate"
      - "POST /certification-body/certificates/{id}/withdraw"
      - "POST /certification-body/scope-changes/{id}/decision"
      - "POST /certification-body/appeals/{id}/decide"
    shared_operations:
      - "GET endpoints"
  - name: Anonymous
    description: "Unauthenticated public caller; may only query the public certification directory"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /certification-body/directory"
