  - name: validation_stale_species_version_masks_the_already_cleared_state_error
    claim_type: Priority conflict
    grounds:
    - §1.4 priority 9 (ERR_STALE_SPECIES_VERSION)
    - §1.4 priority 10 (ERR_INVALID_STATE)
    - §1.6 ERR_STALE_SPECIES_VERSION (412)
    - §1.2.1 concurrency_rules clearance-stale-species-quota
    - §1.2 AcquisitionRequest READY_FOR_CLEARANCE -> CLEARED (increments Species.version)
    distinguishing_aspect: The replayed clearance violates BOTH the OCC guard (Species.version moved when the first clearance reserved against it) and the state rule (the request is no longer READY_FOR_CLEARANCE). Priority 9 runs before priority 10, so the answer is 412 ERR_STALE_SPECIES_VERSION, never 409 ERR_INVALID_STATE.
    test_recipe:
      setup:
      - A CLEARED CAPTIVE_BRED request for 1 specimen; the caller still holds the expected_species_version it read before the clearance.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
        payload: {system_code: LSS-COLD-1, system_type: RECIRCULATING_MARINE, design_habitat: COLD_MARINE, redundancy_class: N_PLUS_1, redundancy_test_interval_days: 90}
        as: ComplianceDirector
        captures: {lss_id: $.data.id}
      - call: POST /aquarium/exhibits
        payload: {exhibit_code: EX-COLD-1, name: Cold Water Reef, habitat_type: COLD_MARINE, life_support_system_id: '${lss_id}', display_volume_liters: 120000, bioload_capacity_units: 100}
        as: CuratorOfCollections
        captures: {ex_id: $.data.id, ex_v1: $.data.version}
      - call: POST /aquarium/species
        payload: {scientific_name: Sebastes ruberrimus, common_name: yelloweye rockfish, taxon_group: TELEOST, protection_status: UNLISTED, sustainability_rating: GREEN, bioload_units_per_specimen: 12, base_quarantine_days: 30, wild_take_quota_annual: 4}
        as: CuratorOfCollections
        captures: {sp_id: $.data.id, sp_v1: $.data.version}
      - call: POST /aquarium/collection-plan-entries
        payload: {exhibit_id: '${ex_id}', species_id: '${sp_id}', planned_count: 2, sustainability_requirement: GREEN_ONLY, expected_exhibit_version: '${ex_v1}'}
        as: CuratorOfCollections
        captures: {cpe_id: $.data.id}
      - call: POST /aquarium/collection-plan-entries/${cpe_id}/status-actions
        payload: {action: APPROVE}
        as: ComplianceDirector
        as_user_id: dir-plan-approver
      - call: POST /aquarium/acquisition-requests
        payload: {collection_plan_entry_id: '${cpe_id}', source_type: CAPTIVE_BRED, requested_count: 1}
        as: CuratorOfCollections
        captures: {ar_id: $.data.id}
      - call: POST /aquarium/acquisition-requests/${ar_id}/submission
        payload: {}
        as: CuratorOfCollections
      - call: GET /aquarium/species/${sp_id}
        payload: {}
        as: ComplianceDirector
        captures: {sp_stale: $.data.version}
      - call: POST /aquarium/acquisition-requests/${ar_id}/clearance
        payload: {expected_species_version: '${sp_stale}'}
        as: ComplianceDirector
        as_user_id: dir-clearance-officer
      trigger:
      - call: POST /aquarium/acquisition-requests/${ar_id}/clearance
        payload: {expected_species_version: '${sp_stale}'}
        as: ComplianceDirector
        as_user_id: dir-clearance-officer-2
        captures: {err: $.data.error_id}
      - call: GET /aquarium/acquisition-requests/${ar_id}
        payload: {}
        as: ComplianceDirector
      - call: GET /aquarium/species/${sp_id}
        payload: {}
        as: ComplianceDirector
      assert:
      - HTTP 412 and data.error_id == ERR_STALE_SPECIES_VERSION
      - NOT 409 ERR_INVALID_STATE, although the request is already CLEARED
      - AcquisitionRequest.status == CLEARED with the FIRST clearer's cleared_by_user_id == "dir-clearance-officer"
      - AcquisitionRequest.sustainability_score_variant == FINAL (unchanged)
      - Species.version is one greater than ${sp_stale} and is not bumped again by the rejected call
  - name: validation_unknown_species_id_in_the_body_returns_species_not_found
    claim_type: Violation → Error
    grounds:
    - §1.4 priority 6 (body-FK existence)
    - §1.6 ERR_SPECIES_NOT_FOUND (404)
    - §1.5 POST /aquarium/collection-plan-entries
