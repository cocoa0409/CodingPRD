# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3462_pesticide_registration_review_label_amendment
#
# Breadth probe over §1.1-§1.7 claims not exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Corners already covered there appear as
# excluded_because: stubs with no test_recipe. All chains replay from empty-DB
# with the logical clock (default 2026-09-01T00:00:00Z).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: active_ingredient_create_echoes_fields_and_stamps_system_fields
        claim_type: Creation
        grounds: [entities.ActiveIngredient, endpoints.POST_/pesticide-registry/active-ingredients]
        distinguishing_aspect: "A well-formed create returns 201 with every input echoed and system fields stamped: server UUID id, created_at/updated_at at the logical clock, version 1."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdministrator
              as_user_id: "sys-1"
          trigger:
            - call: "POST /pesticide-registry/active-ingredients"
              payload: { common_name: "nominex", cas_number: "100-00-1", tox_category: "III", reference_dose_mg_kg_day: 0.05, aquatic_lc50_ppm: 100.0 }
              as: SystemAdministrator
              as_user_id: "sys-1"
              captures: { ai: $.data.id }
          assert:
            - "response status 201, response_type object, meta.api_request_id and meta.api_request_timestamp present"
            - "ActiveIngredient.${ai}: common_name == \"nominex\", cas_number == \"100-00-1\", tox_category == \"III\", reference_dose_mg_kg_day == 0.05, aquatic_lc50_ppm == 100.0"
            - "version == 1 and created_at == 2026-09-01T00:00:00Z"

      - name: product_create_defaults_and_owner_stamping
        claim_type: Defaults
        grounds: [entities.Product, endpoints.POST_/pesticide-registry/products]
        distinguishing_aspect: "A product created with only the three required inputs defaults status UNREGISTERED, classification GENERAL_USE, signal_word null, epa_registration_number null, version 1, and stamps registrant_ref from X-User-ID."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. One active ingredient."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdministrator
              as_user_id: "sys-1"
            - call: "POST /pesticide-registry/active-ingredients"
              payload: { common_name: "nominex", cas_number: "100-00-1", tox_category: "III", reference_dose_mg_kg_day: 0.05, aquatic_lc50_ppm: 100.0 }
              as: SystemAdministrator
              as_user_id: "sys-1"
              captures: { ai: $.data.id }
          trigger:
            - call: "POST /pesticide-registry/products"
              payload: { product_name: "Nominex G", active_ingredient_id: "${ai}", formulation_type: "GRANULAR" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { p: $.data.id }
          assert:
            - "response status 201; Product.${p}.status == UNREGISTERED and classification == GENERAL_USE"
            - "Product.${p}.signal_word is null and epa_registration_number is null"
            - "Product.${p}.registrant_ref == \"reg-alice\" (stamped from X-User-ID, never client-supplied)"
            - "Product.${p}.version == 1"

      - name: application_create_mints_proposed_use_sites_and_defaults
        claim_type: Creation
        grounds: [entities.RegistrationApplication, entities.UseSite, endpoints.POST_/pesticide-registry/registration-applications]
        distinguishing_aspect: "Creating an application with two proposed use sites mints two UseSite rows in PROPOSED (origin INITIAL_APPLICATION) while the application itself starts DRAFT with deficiency_count 0 and review_due_at null."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. One product owned by reg-alice."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdministrator
              as_user_id: "sys-1"
            - call: "POST /pesticide-registry/active-ingredients"
              payload: { common_name: "nominex", cas_number: "100-00-1", tox_category: "III", reference_dose_mg_kg_day: 0.05, aquatic_lc50_ppm: 100.0 }
              as: SystemAdministrator
              as_user_id: "sys-1"
              captures: { ai: $.data.id }
            - call: "POST /pesticide-registry/products"
              payload: { product_name: "Nominex G", active_ingredient_id: "${ai}", formulation_type: "GRANULAR" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { p: $.data.id }
          trigger:
            - call: "POST /pesticide-registry/registration-applications"
              payload: { product_id: "${p}", use_pattern: "NON_FOOD_USE", requested_classification: "GENERAL_USE", proposed_use_sites: [{ site_code: "TURF", pest_code: "GRUB", max_application_rate_lbs_acre: 1.0, max_applications_per_season: 2, preharvest_interval_days: 0, application_method: "GROUND", restricted_entry_interval_hours: 24 }, { site_code: "ORNAMENTAL", pest_code: "APHID", max_application_rate_lbs_acre: 0.5, max_applications_per_season: 4, preharvest_interval_days: 0, application_method: "GROUND", restricted_entry_interval_hours: 12 }] }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { app: $.data.id }
          assert:
            - "response status 201; RegistrationApplication.${app}.status == DRAFT, deficiency_count == 0, review_due_at is null, submitted_at is null"
            - "GET /pesticide-registry/products/${p}/use-sites?status=PROPOSED returns exactly 2 rows, both origin == INITIAL_APPLICATION, carrying site_code TURF and ORNAMENTAL with the posted rates"

      - name: registration_number_minted_sequentially_across_products
        claim_type: System Fields
        grounds: [entities.Product.fields.epa_registration_number, calculations.signal_word_and_registration_number]
        distinguishing_aspect: "The first APPROVED application mints EPA-RR-000001 and the second mints EPA-RR-000002 — the sequence counts previously approved applications, never ids or timestamps."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. Two NON_FOOD_USE products, each fully approved through the application pipeline in order (P1 then P2)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdministrator
              as_user_id: "sys-1"
            - call: "POST /pesticide-registry/active-ingredients"
              payload: { common_name: "nominex", cas_number: "100-00-1", tox_category: "III", reference_dose_mg_kg_day: 0.05, aquatic_lc50_ppm: 100.0 }
              as: SystemAdministrator
              as_user_id: "sys-1"
              captures: { ai: $.data.id }
            - call: "POST /pesticide-registry/products"
              payload: { product_name: "Nominex G", active_ingredient_id: "${ai}", formulation_type: "GRANULAR" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { p1: $.data.id }
            - call: "POST /pesticide-registry/registration-applications"
              payload: { product_id: "${p1}", use_pattern: "NON_FOOD_USE", requested_classification: "GENERAL_USE", proposed_use_sites: [{ site_code: "TURF", pest_code: "GRUB", max_application_rate_lbs_acre: 1.0, max_applications_per_season: 2, preharvest_interval_days: 0, application_method: "GROUND", restricted_entry_interval_hours: 24 }] }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { app1: $.data.id }
            - call: "POST /pesticide-registry/study-submissions"
              payload: { application_id: "${app1}", study_type: "EFFICACY", guideline_reference: "OCSPP 810.3000" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { s1e: $.data.id }
            - call: "POST /pesticide-registry/study-submissions"
              payload: { application_id: "${app1}", study_type: "TOXICOLOGY", guideline_reference: "OCSPP 870.1100" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { s1t: $.data.id }
            - call: "POST /pesticide-registry/study-submissions"
              payload: { application_id: "${app1}", study_type: "ENVIRONMENTAL_FATE", guideline_reference: "OCSPP 835.2120" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { s1f: $.data.id }
            - call: "POST /pesticide-registry/study-submissions/${s1e}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/study-submissions/${s1t}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/study-submissions/${s1f}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/registration-applications/${app1}/submit"
              payload: { payment_cents: 150000 }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
            - call: "POST /pesticide-registry/risk-assessments"
              payload: { application_id: "${app1}", tier: "SCREENING" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/registration-applications/${app1}/review-decisions"
              payload: { decision: "APPROVE", final_classification: "GENERAL_USE" }
              as: RegistrationReviewer
              as_user_id: "rr-1"
            - call: "POST /pesticide-registry/products"
              payload: { product_name: "Nominex WP", active_ingredient_id: "${ai}", formulation_type: "WETTABLE_POWDER" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { p2: $.data.id }
            - call: "POST /pesticide-registry/registration-applications"
              payload: { product_id: "${p2}", use_pattern: "NON_FOOD_USE", requested_classification: "GENERAL_USE", proposed_use_sites: [{ site_code: "TURF", pest_code: "GRUB", max_application_rate_lbs_acre: 1.0, max_applications_per_season: 2, preharvest_interval_days: 0, application_method: "GROUND", restricted_entry_interval_hours: 24 }] }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { app2: $.data.id }
            - call: "POST /pesticide-registry/study-submissions"
              payload: { application_id: "${app2}", study_type: "EFFICACY", guideline_reference: "OCSPP 810.3000" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { s2e: $.data.id }
            - call: "POST /pesticide-registry/study-submissions"
              payload: { application_id: "${app2}", study_type: "TOXICOLOGY", guideline_reference: "OCSPP 870.1100" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { s2t: $.data.id }
            - call: "POST /pesticide-registry/study-submissions"
              payload: { application_id: "${app2}", study_type: "ENVIRONMENTAL_FATE", guideline_reference: "OCSPP 835.2120" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { s2f: $.data.id }
            - call: "POST /pesticide-registry/study-submissions/${s2e}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/study-submissions/${s2t}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/study-submissions/${s2f}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/registration-applications/${app2}/submit"
              payload: { payment_cents: 150000 }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
            - call: "POST /pesticide-registry/risk-assessments"
              payload: { application_id: "${app2}", tier: "SCREENING" }
              as: RiskAssessor
              as_user_id: "ra-1"
          trigger:
            - call: "POST /pesticide-registry/registration-applications/${app2}/review-decisions"
              payload: { decision: "APPROVE", final_classification: "GENERAL_USE" }
              as: RegistrationReviewer
              as_user_id: "rr-1"
          assert:
            - "Product.${p1}.epa_registration_number == \"EPA-RR-000001\""
            - "Product.${p2}.epa_registration_number == \"EPA-RR-000002\""
            - "both products REGISTERED with version 2 (one mutation at creation, one at approval)"

      - name: amendment_create_computes_review_due_and_priia_category
        claim_type: Computed Fields
        grounds: [entities.LabelAmendment.fields.review_due_at, calculations.amendment_review_timeline]
        distinguishing_aspect: "A plain METHOD_CHANGE on a GENERAL_USE product with no bulletins takes the untouched 91-day base: submitted 2026-09-05 -> review_due_at 2026-12-05 and priia_category METHOD_CHANGE (no suffix)."
        test_recipe:
          setup: ["Clock 2026-09-05T00:00:00Z. NON_FOOD_USE product REGISTERED with one ACTIVE TURF use site."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdministrator
              as_user_id: "sys-1"
            - call: "POST /pesticide-registry/active-ingredients"
              payload: { common_name: "nominex", cas_number: "100-00-1", tox_category: "III", reference_dose_mg_kg_day: 0.05, aquatic_lc50_ppm: 100.0 }
              as: SystemAdministrator
              as_user_id: "sys-1"
              captures: { ai: $.data.id }
            - call: "POST /pesticide-registry/products"
              payload: { product_name: "Nominex G", active_ingredient_id: "${ai}", formulation_type: "GRANULAR" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { p: $.data.id }
            - call: "POST /pesticide-registry/registration-applications"
              payload: { product_id: "${p}", use_pattern: "NON_FOOD_USE", requested_classification: "GENERAL_USE", proposed_use_sites: [{ site_code: "TURF", pest_code: "GRUB", max_application_rate_lbs_acre: 1.0, max_applications_per_season: 2, preharvest_interval_days: 0, application_method: "GROUND", restricted_entry_interval_hours: 24 }] }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { app: $.data.id }
            - call: "POST /pesticide-registry/study-submissions"
              payload: { application_id: "${app}", study_type: "EFFICACY", guideline_reference: "OCSPP 810.3000" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { se: $.data.id }
            - call: "POST /pesticide-registry/study-submissions"
              payload: { application_id: "${app}", study_type: "TOXICOLOGY", guideline_reference: "OCSPP 870.1100" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { st: $.data.id }
            - call: "POST /pesticide-registry/study-submissions"
              payload: { application_id: "${app}", study_type: "ENVIRONMENTAL_FATE", guideline_reference: "OCSPP 835.2120" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { sf: $.data.id }
            - call: "POST /pesticide-registry/study-submissions/${se}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/study-submissions/${st}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/study-submissions/${sf}/review-decisions"
              payload: { decision: "ACCEPT" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/registration-applications/${app}/submit"
              payload: { payment_cents: 150000 }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
            - call: "POST /pesticide-registry/risk-assessments"
              payload: { application_id: "${app}", tier: "SCREENING" }
              as: RiskAssessor
              as_user_id: "ra-1"
            - call: "POST /pesticide-registry/registration-applications/${app}/review-decisions"
              payload: { decision: "APPROVE", final_classification: "GENERAL_USE" }
              as: RegistrationReviewer
              as_user_id: "rr-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: SystemAdministrator
              as_user_id: "sys-1"
            - call: "GET /pesticide-registry/products/${p}"
              payload: {}
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { pv: $.data.version }
            - call: "GET /pesticide-registry/products/${p}/use-sites?status=ACTIVE"
              payload: {}
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { site1: "$.data[0].id" }
          trigger:
            - call: "POST /pesticide-registry/label-amendments"
              payload: { product_id: "${p}", amendment_type: "METHOD_CHANGE", payload: { use_site_id: "${site1}", new_application_method: "AERIAL" }, expected_product_version: "${pv}" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { am: $.data.id }
          assert:
            - "LabelAmendment.${am}: submitted_at == 2026-09-05T00:00:00Z, review_due_at == 2026-12-05T00:00:00Z (91-day base, no adders, no halving)"
            - "LabelAmendment.${am}.priia_category == \"METHOD_CHANGE\" and status == SUBMITTED"

      - name: product_create_unknown_field_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["validations[priority=3]", errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: "The request schema is closed: a client-supplied status field (trying to pre-set REGISTERED) is an unknown key and yields 400 ERR_INVALID_REQUEST, not silent acceptance."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. One active ingredient."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdministrator
              as_user_id: "sys-1"
            - call: "POST /pesticide-registry/active-ingredients"
              payload: { common_name: "nominex", cas_number: "100-00-1", tox_category: "III", reference_dose_mg_kg_day: 0.05, aquatic_lc50_ppm: 100.0 }
              as: SystemAdministrator
              as_user_id: "sys-1"
              captures: { ai: $.data.id }
          trigger:
            - call: "POST /pesticide-registry/products"
              payload: { product_name: "Nominex G", active_ingredient_id: "${ai}", formulation_type: "GRANULAR", status: "REGISTERED" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { err: $.data.error_id }
          assert:
            - "response status 400 and error_id == ERR_INVALID_REQUEST"
            - "no Product row is created (GET /pesticide-registry/products returns total_count 0)"

      - name: product_create_missing_product_name_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Product.fields.product_name, "validations[priority=3]", errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: "product_name is a required input with no default; omitting it is a 400 ERR_INVALID_REQUEST from the schema check before any existence or state logic."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. One active ingredient."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdministrator
              as_user_id: "sys-1"
            - call: "POST /pesticide-registry/active-ingredients"
              payload: { common_name: "nominex", cas_number: "100-00-1", tox_category: "III", reference_dose_mg_kg_day: 0.05, aquatic_lc50_ppm: 100.0 }
              as: SystemAdministrator
              as_user_id: "sys-1"
              captures: { ai: $.data.id }
          trigger:
            - call: "POST /pesticide-registry/products"
              payload: { active_ingredient_id: "${ai}", formulation_type: "GRANULAR" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { err: $.data.error_id }
          assert:
            - "response status 400 and error_id == ERR_INVALID_REQUEST"

      - name: product_create_invalid_formulation_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Product.fields.formulation_type, "validations[priority=3]", errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: "formulation_type is a closed enum of five; a value outside the set (\"AEROSOL\") is rejected 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. One active ingredient."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdministrator
              as_user_id: "sys-1"
            - call: "POST /pesticide-registry/active-ingredients"
              payload: { common_name: "nominex", cas_number: "100-00-1", tox_category: "III", reference_dose_mg_kg_day: 0.05, aquatic_lc50_ppm: 100.0 }
              as: SystemAdministrator
              as_user_id: "sys-1"
              captures: { ai: $.data.id }
          trigger:
            - call: "POST /pesticide-registry/products"
              payload: { product_name: "Nominex G", active_ingredient_id: "${ai}", formulation_type: "AEROSOL" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { err: $.data.error_id }
          assert:
            - "response status 400 and error_id == ERR_INVALID_REQUEST"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: application_double_submit_returns_not_submittable
        claim_type: invalid_transition
        grounds: [state_machines.RegistrationApplication.DRAFT_to_IN_REVIEW, errors.ERR_APPLICATION_NOT_SUBMITTABLE]
        distinguishing_aspect: "submit is defined only from DRAFT or DATA_DEFICIENCY; a second submit from IN_REVIEW fails 409 ERR_APPLICATION_NOT_SUBMITTABLE and review_due_at stays at the first submit's value."
        test_recipe:
          setup: ["Clock 2026-09-01T00:00:00Z. NON_FOOD_USE application with its three studies, already submitted once."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdministrator
              as_user_id: "sys-1"
            - call: "POST /pesticide-registry/active-ingredients"
              payload: { common_name: "nominex", cas_number: "100-00-1", tox_category: "III", reference_dose_mg_kg_day: 0.05, aquatic_lc50_ppm: 100.0 }
              as: SystemAdministrator
              as_user_id: "sys-1"
              captures: { ai: $.data.id }
            - call: "POST /pesticide-registry/products"
              payload: { product_name: "Nominex G", active_ingredient_id: "${ai}", formulation_type: "GRANULAR" }
              as: RegistrantRepresentative
              as_user_id: "reg-alice"
              captures: { p: $.data.id }
