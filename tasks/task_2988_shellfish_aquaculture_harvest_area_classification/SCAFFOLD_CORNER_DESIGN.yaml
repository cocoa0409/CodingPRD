          - "entities.Lease.fields.navigation_clearance"
        excluded_because:
          difficulty_instance: lease_revision_cycle_returns_to_under_review_with_cleared_flags_reset
          rationale: "The §1.8 non_linear_state_machine instance already walks the objection/resubmission cycle end to end, asserting revision_round increments and that BOTH clearance flags and reviewer ids reset to PENDING/null on re-entry; a separate breadth recipe would repeat the same call sequence with weaker asserts."

