          - state_machines.Meeting.NOTICED_to_IN_SESSION
        distinguishing_aspect: "Opening an AgendaItem is rejected with ERR_MEETING_NOT_IN_SESSION while the parent Meeting is only NOTICED; the item's valid transition depends on the Meeting entity's state (pair AgendaItem->Meeting)."
