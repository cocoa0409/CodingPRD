      - name: applicable_fraction_counts_only_restricted_rows_and_excludes_employee_units_from_both_numerators
        claim_type: input_set_filtering
        grounds:
          - calculations.applicable_fraction
          - entities.Project.fields.unit_fraction_bps
          - entities.Project.fields.floor_space_fraction_bps
          - entities.Project.fields.employee_unit_count
          - endpoints[PATCH /unit-restrictions/{id}]
        distinguishing_aspect: |
          A ten-unit project with three designations separates the numerator set
          from the denominator set: 4 RESTRICTED rows of 700+800+900+950 = 3350
          sqft, 2 EMPLOYEE_UNIT rows of 860 each and 4 MARKET rows of
          860+860+860+850, total 8500 sqft. EMPLOYEE_UNIT rows must be excluded
          from both numerators yet remain inside total_units 10 and
          total_floor_space_sqft 8500, giving unit_fraction 4000 and floor-space
          fraction floor(3350*10000/8500) = 3941 - so the applicable fraction is
          the SMALLER 3941, not the unit-count figure. Re-designating one employee
          unit as restricted moves it into both numerators at once: 5 units gives
          5000 and 4210 sqft gives floor(4210*10000/8500) = 4952.
        test_recipe:
          setup:
            - "One sponsor with a ten-unit project: total_floor_space_sqft 8500, land 50,000,000, depreciable 450,000,000, election MIN_40_60."
            - "Four RESTRICTED units at 60% AMI (700, 800, 900 and 950 sqft), two EMPLOYEE_UNIT units of 860 sqft with no ami_percent, and four MARKET units (860, 860, 860 and 850 sqft)."
