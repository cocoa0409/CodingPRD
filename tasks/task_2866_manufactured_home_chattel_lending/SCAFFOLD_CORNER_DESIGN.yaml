        excluded_because:
          difficulty_instance: dual_variant_calc / valuation_origination_vs_recovery_liquidation_on_one_unit
          rationale: "That §1.8 instance computes both variants on one unit from the same guide and asserts the exact divergence, including the detach-and-move term that only one variant can carry."

  - section: consistency_model
    instances:

      - name: every_cascade_is_visible_in_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        excluded_because:
          difficulty_instance: transitive_cascade / default_declaration_four_hop_loan_case_unit_borrower_cascade
          rationale: "The consistency model is immediate, and that §1.8 instance asserts all four hops of a single default declaration - the loan's servicing_state, the new case, the unit's recovery hold and the borrower's suspension - are readable straight after the one call with no second write and no settling period, which is exactly what immediate consistency claims."
