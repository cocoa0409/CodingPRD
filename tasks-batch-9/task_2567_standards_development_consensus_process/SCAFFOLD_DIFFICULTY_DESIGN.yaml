          The Draft machine is cyclic: one and the same Draft row occupies SUBCOMMITTEE_BALLOT twice
          in a single run (ballot_round_count goes 1 -> 2) after passing through COMMENT_RESOLUTION
          and back to DRAFTING, with revision_number still 1, which no acyclic pipeline can produce.
