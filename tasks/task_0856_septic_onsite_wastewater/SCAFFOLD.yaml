scenario: "856. Septic & On-Site Wastewater Permit (health dept): site evaluation & perc test, system design & permit, installer license & cover inspection, operating permit & pumping compliance, failure & repair order, well-setback & water-quality, real-estate transfer inspection, reporting"
domain_name: "septic-onsite-wastewater-permit"
api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Peer entities linked by explicit foreign keys (flat topology): no entity is
    nested inside another's URL path except for the two read-only sub-resource
    listings that exist purely for FK reverse-reachability. Two state machines
    are cyclic (SiteEvaluation review loop, SystemDesign revision loop), one is
    parallel-dimensioned (OperatingPermit.status x OperatingPermit.compliance_status),
    and one is branching (RepairOrder resolves OR escalates with divergent
    side-effect sets). The health department's segregation-of-duties control
    forbids the Environmental Health Specialist who approved a SystemDesign from
    recording the COVER inspection result on the permit built from that design.

entities:
  - name: Parcel
    parent: null
    common_fields: true
    fields:
      - name: apn
        type: string
        source: input
        description: "Assessor parcel number; the legal identifier of the property"
        constraints: "non-empty; unique together with county_code"
      - name: county_code
        type: string
        source: input
        description: "Two-letter county code the parcel sits in"
        constraints: "non-empty; unique together with apn"
      - name: owner_user_id
        type: string
        source: system
        description: "Opaque Applicant user id copied from the X-User-ID header of the creating request; ownership checks compare X-User-ID to this field"
      - name: site_address
        type: string
        source: input
        description: "Street address of the parcel"
        constraints: "non-empty"
      - name: lot_size_sqft
        type: integer
        source: input
        description: "Lot area in square feet"
        constraints: ">= 1"
      - name: water_source
        type: enum
        source: input
        description: "Potable water source serving the parcel"
        constraints: "one of PUBLIC_WATER, PRIVATE_WELL"
      - name: max_design_flow_gpd
        type: integer
        source: computed
        description: "Hydraulic allowance for the parcel; see calculations.parcel_max_design_flow"
      - name: permitted_design_flow_gpd
        type: integer
        source: computed
        description: "Sum of design_flow_gpd over this parcel's non-released ConstructionPermits; see calculations.parcel_permitted_flow_ledger"
        default: 0
      - name: fees_assessed_cents
        type: integer
        source: computed
        description: "Lifetime total of permit fees charged to this parcel"
        default: 0
      - name: fees_paid_cents
        type: integer
        source: computed
        description: "Lifetime total of payments recorded against this parcel"
        default: 0
      - name: fees_credited_cents
        type: integer
        source: computed
        description: "Lifetime total of fee reversals produced by compensating actions (permit void)"
        default: 0
      - name: fee_balance_cents
        type: integer
        source: computed
        description: "Outstanding balance; see calculations.parcel_fee_ledger"
        default: 0
      - name: open_repair_order_count
        type: integer
        source: computed
        description: "Count of this parcel's RepairOrders whose status is in {ISSUED, EXTENDED}"
        default: 0
      - name: water_quality_flag
        type: boolean
        source: computed
        description: "True when at least one Well on this parcel has advisory_status in {ADVISORY, CONDEMNED}"
        default: false
      - name: risk_tier
        type: enum
        source: computed
        description: "Aggregate parcel risk; see calculations.parcel_risk_tier"
        default: LOW
        constraints: "one of LOW, ELEVATED, HIGH"
      - name: transfer_hold
        type: boolean
        source: computed
        description: "True when open_repair_order_count > 0 OR any OperatingPermit on this parcel has status REVOKED OR any Well on this parcel has advisory_status CONDEMNED; blocks transfer-inspection certification"
        default: false

  - name: Well
    parent: null
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: "FK -> Parcel.id; the parcel the well is located on"
      - name: well_type
        type: enum
        source: input
        description: "Use class of the well"
        constraints: "one of DOMESTIC, IRRIGATION, MONITORING"
      - name: location_x_ft
        type: number
        source: input
        description: "East-west site-plan coordinate of the well head, in feet"
      - name: location_y_ft
        type: number
        source: input
        description: "North-south site-plan coordinate of the well head, in feet"
      - name: depth_ft
        type: integer
        source: input
        description: "Total drilled depth of the well in feet"
        constraints: ">= 1"
      - name: advisory_status
        type: enum
        source: computed
        description: "Water-quality posture of the well; set by water-sample results"
        default: CLEAR
        constraints: "one of CLEAR, ADVISORY, CONDEMNED"
      - name: last_sample_collected_at
        type: datetime
        source: computed
        description: "collected_at of the most recently posted WaterSample for this well; null when none"

  - name: WaterSample
    parent: null
    common_fields: false
    fields:
      - name: well_id
        type: string
        source: input
        description: "FK -> Well.id; the well the sample was drawn from"
      - name: collected_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the sample was collected"
      - name: nitrate_mg_l
        type: number
        source: input
        description: "Measured nitrate-as-nitrogen concentration in milligrams per litre"
        constraints: ">= 0"
      - name: coliform_present
        type: boolean
        source: input
        description: "True when total coliform bacteria were detected"
      - name: result
        type: enum
        source: computed
        description: "Laboratory verdict; see calculations.water_sample_result"
        constraints: "one of PASS, EXCEEDANCE, UNSAFE"
      - name: exceedance_reasons
        type: array
        source: computed
        description: "Sorted array of reason codes; subset of [COLIFORM_DETECTED, NITRATE_MCL_EXCEEDED]; empty for PASS"

  - name: SiteEvaluation
    parent: null
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: "FK -> Parcel.id; the parcel that was evaluated"
      - name: evaluator_user_id
        type: string
        source: system
        description: "Opaque DesignProfessional user id copied from X-User-ID on creation"
      - name: evaluated_on
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the soil profile was cut and logged"
      - name: soil_group
        type: enum
        source: input
        description: "USDA-style texture class of the limiting soil horizon"
        constraints: "one of SANDY, LOAMY, CLAY_LOAM, CLAY"
      - name: depth_to_limiting_layer_in
        type: integer
        source: input
        description: "Inches from finished grade down to bedrock, hardpan or seasonal water table"
        constraints: ">= 0"
      - name: perc_holes
        type: array
        source: computed
        description: "Append-only array of percolation-hole readings, each an object {hole_number, drop_inches, elapsed_minutes, presoak_ok, valid, rate_min_per_in}; grown by POST /site-evaluations/{id}/perc-holes"
        default: []
      - name: preliminary_perc_rate_min_per_in
        type: number
        source: computed
        description: "PRELIMINARY variant of calculations.perc_rate_evaluation; null while no valid hole exists"
      - name: certified_perc_rate_min_per_in
        type: number
        source: computed
        description: "CERTIFIED variant of calculations.perc_rate_evaluation; null while no valid hole exists"
      - name: soil_loading_rate_gpd_per_sqft
        type: number
        source: computed
        description: "Tier selected from certified_perc_rate_min_per_in; see calculations.soil_loading_rate"
      - name: valid_until
        type: datetime
        source: computed
        description: "evaluated_on plus SITE_EVAL_VALIDITY_YEARS; a design may only cite this evaluation while the logical clock is at or before this instant"
      - name: status
        type: enum
        source: computed
        description: "Review lifecycle state; see state_machines.SiteEvaluation"
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, APPROVED, REJECTED, SUPERSEDED"
      - name: review_note
        type: string
        source: computed
        description: "Free-text note recorded by the most recent review decision; null before first review"
      - name: revision_round
        type: integer
        source: computed
        description: "Number of times this evaluation has entered SUBMITTED; starts at 0, incremented by every submit"
        default: 0

  - name: SystemDesign
    parent: null
    common_fields: true
    fields:
      - name: site_evaluation_id
        type: string
        source: input
        description: "FK -> SiteEvaluation.id; the approved evaluation the design is sized from"
      - name: designer_user_id
        type: string
        source: system
        description: "Opaque DesignProfessional user id copied from X-User-ID on creation"
      - name: system_type
        type: enum
        source: input
        description: "Treatment/dispersal technology proposed"
        constraints: "one of CONVENTIONAL, MOUND, ATU, DRIP"
      - name: bedrooms
        type: integer
        source: input
        description: "Bedroom count the system is sized for"
        constraints: ">= 1 and <= 8"
      - name: tank_capacity_gal
        type: integer
        source: input
        description: "Septic tank working capacity in gallons"
        constraints: ">= 750"
      - name: drainfield_x_ft
        type: number
        source: input
        description: "East-west site-plan coordinate of the drainfield centroid, in feet"
      - name: drainfield_y_ft
        type: number
        source: input
        description: "North-south site-plan coordinate of the drainfield centroid, in feet"
      - name: design_flow_gpd
        type: integer
        source: computed
        description: "Design sewage flow; see calculations.design_flow"
      - name: required_drainfield_sqft
        type: integer
        source: computed
        description: "Absorption area required; see calculations.required_drainfield_area"
      - name: nearest_well_distance_ft
        type: number
        source: computed
        description: "Distance from the drainfield centroid to the closest qualifying well; see calculations.well_setback_evaluation; null when the parcel has no qualifying well"
      - name: required_setback_ft
        type: number
        source: computed
        description: "Minimum lawful drainfield-to-well separation; see calculations.well_setback_evaluation"
      - name: setback_status
        type: enum
        source: computed
        description: "Setback posture; see calculations.well_setback_evaluation and state_machines.SystemDesign"
        default: NOT_APPLICABLE
        constraints: "one of NOT_APPLICABLE, COMPLIANT, VARIANCE_REQUIRED, VARIANCE_GRANTED, VARIANCE_DENIED"
      - name: status
        type: enum
        source: computed
        description: "Plan-review lifecycle state; see state_machines.SystemDesign"
        default: DRAFT
        constraints: "one of DRAFT, UNDER_REVIEW, REVISIONS_REQUIRED, APPROVED, PERMITTED, SUPERSEDED"
      - name: review_ehs_user_id
        type: string
        source: computed
        description: "Opaque EnvironmentalHealthSpecialist user id that recorded the APPROVE decision; null until approved; the segregation-of-duties check reads this field"
      - name: revision_round
        type: integer
        source: computed
        description: "Number of times this design has entered UNDER_REVIEW; starts at 0, incremented by every submit"
        default: 0

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - name: business_name
        type: string
        source: input
        description: "Registered trade name of the licensed firm"
        constraints: "non-empty"
      - name: license_number
        type: string
        source: input
        description: "State-issued licence number"
        constraints: "non-empty; globally unique"
      - name: license_class
        type: enum
        source: input
        description: "Scope of work the licence authorises"
        constraints: "one of INSTALLER, PUMPER, DUAL"
      - name: license_expires_on
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the licence lapses; the licence is expired once the logical clock is strictly after this instant"
      - name: bond_amount_cents
        type: integer
        source: input
        description: "Surety bond posted by the firm, in cents"
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "Administrative licence status set by POST /contractors/{id}/license-status"
        default: ACTIVE
        constraints: "one of ACTIVE, SUSPENDED, REVOKED"
      - name: effective_status
        type: enum
        source: computed
        description: "Derived licence posture; see calculations.contractor_effective_status"
        default: ACTIVE
        constraints: "one of ACTIVE, SUSPENDED, REVOKED, EXPIRED"

  - name: ConstructionPermit
    parent: null
    common_fields: true
    fields:
      - name: system_design_id
        type: string
        source: input
        description: "FK -> SystemDesign.id; the approved design the permit authorises"
      - name: parcel_id
        type: string
        source: computed
        description: "FK -> Parcel.id; copied from the cited design's SiteEvaluation.parcel_id at issue time"
      - name: contractor_id
        type: string
        source: input
        description: "FK -> Contractor.id; the licensed firm authorised to build the system"
      - name: permit_number
        type: string
        source: computed
        description: "Human-readable permit number formed as '<county_code>-CP-<zero-padded 6-digit sequence>' where the sequence is the count of ConstructionPermits already issued in that county plus one"
      - name: valid_from
        type: datetime
        source: input
        description: "First instant construction may lawfully begin"
      - name: valid_until
        type: datetime
        source: input
        description: "Last instant the permit authorises work; the parcel construction window is the CLOSED interval [valid_from, valid_until]"
      - name: design_flow_gpd
        type: integer
        source: computed
        description: "Snapshot of SystemDesign.design_flow_gpd taken at issue time"
      - name: fee_cents
        type: integer
        source: computed
        description: "Permit fee; see calculations.construction_permit_fee"
      - name: status
        type: enum
        source: computed
        description: "Construction lifecycle state; see state_machines.ConstructionPermit"
        default: ISSUED
        constraints: "one of ISSUED, UNDER_CONSTRUCTION, COVER_PASSED, COMPLETED, VOIDED, EXPIRED"
      - name: cover_inspection_passed_at
        type: datetime
        source: computed
        description: "Logical-clock instant the COVER inspection was recorded as PASSED; null until then"

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - name: construction_permit_id
        type: string
        source: input
        description: "FK -> ConstructionPermit.id; the permit being inspected"
      - name: contractor_id
        type: string
        source: computed
        description: "FK -> Contractor.id; copied from the permit's contractor_id at scheduling time; the firm must be on site"
      - name: inspection_type
        type: enum
        source: input
        description: "Kind of field visit"
        constraints: "one of COVER, FINAL, COMPLAINT"
      - name: inspector_user_id
        type: string
        source: system
        description: "Opaque EnvironmentalHealthSpecialist user id copied from X-User-ID of the scheduling request"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Start of the on-site visit window"
      - name: scheduled_end
        type: datetime
        source: input
        description: "End of the on-site visit window; the contractor occupation interval is HALF-OPEN [scheduled_start, scheduled_end)"
      - name: status
        type: enum
        source: computed
        description: "Visit lifecycle state; see state_machines.Inspection"
        default: SCHEDULED
        constraints: "one of SCHEDULED, PASSED, FAILED, CANCELLED"
      - name: result_recorded_at
        type: datetime
        source: computed
        description: "Logical-clock instant the PASS/FAIL verdict was recorded; null while SCHEDULED"
      - name: deficiency_codes
        type: array
        source: computed
        description: "Array of deficiency code strings supplied with a FAIL verdict; empty for PASS"
        default: []
      - name: reinspection_round
        type: integer
        source: computed
        description: "Number of times this inspection has been rescheduled after a FAIL; starts at 0"
        default: 0

  - name: OperatingPermit
    parent: null
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: computed
        description: "FK -> Parcel.id; copied from the completed ConstructionPermit at issue time"
      - name: construction_permit_id
        type: string
        source: input
        description: "FK -> ConstructionPermit.id; the COMPLETED construction permit this operating permit follows"
      - name: household_size
        type: integer
        source: input
        description: "Number of residents the permit is rated for"
        constraints: ">= 1 and <= 12"
      - name: tank_capacity_gal
        type: integer
        source: computed
        description: "Snapshot of the system design's tank_capacity_gal taken at issue time"
      - name: issued_on
        type: datetime
        source: computed
        description: "Logical-clock instant the operating permit was issued"
      - name: expires_on
        type: datetime
        source: computed
        description: "issued_on plus OPERATING_PERMIT_TERM_YEARS"
      - name: last_pumped_on
        type: datetime
        source: computed
        description: "pumped_on of the latest accepted PumpingRecord for this permit; null when none"
      - name: pumping_interval_months
        type: integer
        source: computed
        description: "Current servicing interval; see calculations.pumping_interval"
      - name: next_pumping_due_on
        type: datetime
        source: computed
        description: "Deadline for the next tank pump-out; see calculations.pumping_interval"
      - name: monitoring_required
        type: boolean
        source: computed
        description: "True once a groundwater advisory cascade reaches this permit; halves the pumping interval"
        default: false
      - name: status
        type: enum
        source: computed
        description: "Administrative dimension of the parallel state machine; see state_machines.OperatingPermit"
        default: ACTIVE
        constraints: "one of ACTIVE, SUSPENDED, REVOKED, EXPIRED"
      - name: compliance_status
        type: enum
        source: computed
        description: "Pumping-compliance dimension of the parallel state machine; see calculations.pumping_compliance_status"
        default: COMPLIANT
        constraints: "one of COMPLIANT, DUE_SOON, DELINQUENT"

  - name: PumpingRecord
    parent: null
    common_fields: false
    fields:
      - name: operating_permit_id
        type: string
        source: input
        description: "FK -> OperatingPermit.id; the permitted system that was serviced"
      - name: contractor_id
        type: string
        source: system
        description: "FK -> Contractor.id; copied from X-User-ID of the Pumper submitting the record"
      - name: pumped_on
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the tank was pumped"
      - name: gallons_removed
        type: integer
        source: input
        description: "Volume removed from the tank"
        constraints: ">= 1"
      - name: sludge_depth_in
        type: number
        source: input
        description: "Sludge blanket depth measured before pumping, in inches"
        constraints: ">= 0"
      - name: scum_depth_in
        type: number
        source: input
        description: "Scum layer depth measured before pumping, in inches"
        constraints: ">= 0"
      - name: accepted
        type: boolean
        source: computed
        description: "Always true for a successfully created record; a rejected submission produces an error instead of a row"
        default: true

  - name: RepairOrder
    parent: null
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: computed
        description: "FK -> Parcel.id; copied from the cited operating permit at creation"
      - name: operating_permit_id
        type: string
        source: input
        description: "FK -> OperatingPermit.id; the failing permitted system"
      - name: failure_type
        type: enum
        source: input
        description: "Observed mode of failure"
        constraints: "one of SURFACING_EFFLUENT, BACKUP, STRUCTURAL, GROUNDWATER_CONTAMINATION"
      - name: reported_on
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the failure was reported to the department"
      - name: severity
        type: enum
        source: computed
        description: "Enforcement severity; see calculations.repair_order_severity_and_deadline"
        constraints: "one of ROUTINE, URGENT, IMMINENT_HAZARD"
      - name: compliance_deadline
        type: datetime
        source: computed
        description: "Deadline to complete the repair; see calculations.repair_order_severity_and_deadline; null while DRAFT"
      - name: issued_by_user_id
        type: string
        source: computed
        description: "Opaque HealthOfficer user id that issued the order; null while DRAFT"
      - name: closed_by_user_id
        type: string
        source: computed
        description: "Opaque EnvironmentalHealthSpecialist user id that resolved or escalated the order; null until closed"
      - name: extension_count
        type: integer
        source: computed
        description: "Number of granted deadline extensions; capped at MAX_REPAIR_EXTENSIONS"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Enforcement lifecycle state; see state_machines.RepairOrder"
        default: DRAFT
        constraints: "one of DRAFT, ISSUED, EXTENDED, RESOLVED, ESCALATED"

  - name: TransferInspection
    parent: null
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: "FK -> Parcel.id; the parcel changing hands"
      - name: operating_permit_id
        type: string
        source: input
        description: "FK -> OperatingPermit.id; the operating permit whose system is being certified"
      - name: requested_on
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the buyer or seller requested the certificate"
      - name: buyer_name
        type: string
        source: input
        description: "Name of the purchasing party"
        constraints: "non-empty"
      - name: seller_name
        type: string
        source: input
        description: "Name of the selling party"
        constraints: "non-empty"
      - name: inspection_mode
        type: enum
        source: input
        description: "Which variant of calculations.transfer_certificate_grade applies"
        constraints: "one of DESK_REVIEW, FIELD_VERIFIED"
      - name: expedited
        type: boolean
        source: input
        description: "True when the requester pays for expedited turnaround"
        default: false
      - name: tank_condition
        type: enum
        source: input
        description: "Field-observed septic tank condition; required when inspection_mode is FIELD_VERIFIED, must be omitted for DESK_REVIEW"
        constraints: "one of GOOD, FAIR, POOR"
      - name: drainfield_condition
        type: enum
        source: input
        description: "Field-observed drainfield condition; required when inspection_mode is FIELD_VERIFIED, must be omitted for DESK_REVIEW"
        constraints: "one of GOOD, FAIR, POOR"
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Pre-expedite fee; see calculations.transfer_inspection_charges"
      - name: expedite_fee_cents
        type: integer
        source: computed
        description: "Expedite surcharge; see calculations.transfer_inspection_charges"
        default: 0
      - name: total_due_cents
        type: integer
        source: computed
        description: "subtotal_cents + expedite_fee_cents; see calculations.transfer_inspection_charges"
      - name: certificate_grade
        type: enum
        source: computed
        description: "Verdict written at certification; see calculations.transfer_certificate_grade; null while REQUESTED or BLOCKED"
        constraints: "one of SATISFACTORY, CONDITIONAL, UNSATISFACTORY"
      - name: certified_at
        type: datetime
        source: computed
        description: "Logical-clock instant the certificate was signed; null until CERTIFIED"
      - name: certificate_valid_until
        type: datetime
        source: computed
        description: "certified_at plus TRANSFER_CERT_VALIDITY_DAYS; null until CERTIFIED"
      - name: status
        type: enum
        source: computed
        description: "Certificate lifecycle state; see state_machines.TransferInspection"
        default: REQUESTED
        constraints: "one of REQUESTED, BLOCKED, CERTIFIED, DENIED"

state_machines:
  - entity: SiteEvaluation
    dimension: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /site-evaluations/{id}/submit"
        actor: DesignProfessional
        preconditions:
          - "X-User-ID equals SiteEvaluation.evaluator_user_id"
          - "perc_holes contains at least one entry whose valid is true, else ERR_NO_VALID_PERC_HOLES"
        side_effects:
          - "recompute preliminary_perc_rate_min_per_in and certified_perc_rate_min_per_in per calculations.perc_rate_evaluation"
          - "recompute soil_loading_rate_gpd_per_sqft per calculations.soil_loading_rate"
          - "increment revision_round by 1"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /site-evaluations/{id}/submit"
        actor: DesignProfessional
        preconditions:
          - "X-User-ID equals SiteEvaluation.evaluator_user_id"
          - "perc_holes contains at least one entry whose valid is true, else ERR_NO_VALID_PERC_HOLES"
        side_effects:
          - "recompute preliminary_perc_rate_min_per_in and certified_perc_rate_min_per_in per calculations.perc_rate_evaluation"
          - "recompute soil_loading_rate_gpd_per_sqft per calculations.soil_loading_rate"
          - "increment revision_round by 1"
        note: "Revision loop — REJECTED evaluations may be re-cut and resubmitted without limit; this is the cyclic edge of the machine."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /site-evaluations/{id}/review with decision APPROVE"
        actor: EnvironmentalHealthSpecialist
        preconditions:
          - "certified_perc_rate_min_per_in <= MAX_PERCOLATION_RATE_MIN_PER_IN, else ERR_SOIL_UNSUITABLE"
          - "depth_to_limiting_layer_in >= MIN_LIMITING_LAYER_DEPTH_IN, else ERR_SOIL_UNSUITABLE"
        side_effects:
          - "set review_note from the request body"
          - "every other SiteEvaluation with the same parcel_id whose status is APPROVED transitions APPROVED -> SUPERSEDED"
          - "every SystemDesign citing a now-SUPERSEDED evaluation whose status is in {DRAFT, UNDER_REVIEW, REVISIONS_REQUIRED, APPROVED} transitions to SUPERSEDED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /site-evaluations/{id}/review with decision REJECT"
        actor: EnvironmentalHealthSpecialist
        preconditions: []
        side_effects:
          - "set review_note from the request body"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: a later SiteEvaluation on the same parcel is APPROVED"
        actor: system
        preconditions:
          - "another SiteEvaluation with the same parcel_id has just entered APPROVED"
        side_effects:
          - "cascades to SystemDesign: designs citing this evaluation move to SUPERSEDED"

  - entity: SystemDesign
    dimension: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /system-designs/{id}/submit"
        actor: DesignProfessional
        preconditions:
          - "cited SiteEvaluation.status == APPROVED, else ERR_SITE_EVALUATION_NOT_APPROVED"
          - "logical clock <= cited SiteEvaluation.valid_until, else ERR_SITE_EVALUATION_EXPIRED"
          - "setback_status != VARIANCE_DENIED, else ERR_SETBACK_VIOLATION"
        side_effects:
          - "recompute design_flow_gpd, required_drainfield_sqft, nearest_well_distance_ft, required_setback_ft and setback_status"
          - "increment revision_round by 1"
      - from: REVISIONS_REQUIRED
        to: UNDER_REVIEW
        trigger: "POST /system-designs/{id}/submit"
        actor: DesignProfessional
        preconditions:
          - "cited SiteEvaluation.status == APPROVED, else ERR_SITE_EVALUATION_NOT_APPROVED"
          - "logical clock <= cited SiteEvaluation.valid_until, else ERR_SITE_EVALUATION_EXPIRED"
          - "setback_status != VARIANCE_DENIED, else ERR_SETBACK_VIOLATION"
        side_effects:
          - "recompute design_flow_gpd, required_drainfield_sqft, nearest_well_distance_ft, required_setback_ft and setback_status"
          - "increment revision_round by 1"
        note: "Plan-review revision loop — this is the cyclic edge of the machine."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /system-designs/{id}/review with decision APPROVE"
        actor: EnvironmentalHealthSpecialist
        preconditions:
          - "setback_status is in {NOT_APPLICABLE, COMPLIANT, VARIANCE_GRANTED}, else ERR_SETBACK_VIOLATION"
          - "soil_loading_rate_gpd_per_sqft is not null, else ERR_SOIL_UNSUITABLE"
        side_effects:
          - "set review_ehs_user_id to the reviewing X-User-ID (this is the value the segregation-of-duties check later reads)"
          - "every other SystemDesign with the same site_evaluation_id whose status is APPROVED transitions APPROVED -> SUPERSEDED"
      - from: UNDER_REVIEW
        to: REVISIONS_REQUIRED
        trigger: "POST /system-designs/{id}/review with decision REQUEST_REVISIONS"
        actor: EnvironmentalHealthSpecialist
        preconditions: []
        side_effects:
          - "no field other than status, updated_at and version changes; the design keeps its computed sizing until the next submit recomputes it"
      - from: APPROVED
        to: PERMITTED
        trigger: "POST /construction-permits"
        actor: HealthOfficer
        preconditions:
          - "no other ConstructionPermit references this design with status in {ISSUED, UNDER_CONSTRUCTION, COVER_PASSED, COMPLETED}"
        side_effects:
          - "a ConstructionPermit row is created in state ISSUED"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: a later SystemDesign on the same site_evaluation_id is APPROVED, or the cited SiteEvaluation becomes SUPERSEDED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SystemDesign
    dimension: setback_status
    initial_state: NOT_APPLICABLE
    terminal_states: [VARIANCE_DENIED]
    shape: branching
    transitions:
      - from: NOT_APPLICABLE
        to: COMPLIANT
        trigger: "system: recomputed on POST /system-designs and on POST /system-designs/{id}/submit"
        actor: system
        preconditions:
          - "the design's parcel has at least one Well with well_type in {DOMESTIC, IRRIGATION}"
          - "nearest_well_distance_ft >= required_setback_ft"
        side_effects: []
      - from: NOT_APPLICABLE
        to: VARIANCE_REQUIRED
        trigger: "system: recomputed on POST /system-designs and on POST /system-designs/{id}/submit"
        actor: system
        preconditions:
          - "the design's parcel has at least one Well with well_type in {DOMESTIC, IRRIGATION}"
          - "nearest_well_distance_ft < required_setback_ft"
        side_effects: []
      - from: VARIANCE_REQUIRED
        to: VARIANCE_GRANTED
        trigger: "POST /system-designs/{id}/variance-decision with decision GRANT"
        actor: HealthOfficer
        preconditions:
          - "SystemDesign.status is in {DRAFT, UNDER_REVIEW, REVISIONS_REQUIRED}, else ERR_INVALID_STATE"
          - "the parcel's water_quality_flag is false, else ERR_WATER_QUALITY_HOLD"
        side_effects:
          - "recompute fee inputs: a granted variance adds the variance line item to calculations.construction_permit_fee"
      - from: VARIANCE_REQUIRED
        to: VARIANCE_DENIED
        trigger: "POST /system-designs/{id}/variance-decision with decision DENY"
        actor: HealthOfficer
        preconditions:
          - "SystemDesign.status is in {DRAFT, UNDER_REVIEW, REVISIONS_REQUIRED}, else ERR_INVALID_STATE"
        side_effects:
          - "if SystemDesign.status is UNDER_REVIEW it transitions UNDER_REVIEW -> REVISIONS_REQUIRED"

  - entity: Contractor
    dimension: status
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    shape: branching
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /contractors/{id}/license-status with action SUSPEND"
        actor: HealthOfficer
        preconditions: []
        side_effects:
          - "recompute effective_status"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /contractors/{id}/license-status with action REINSTATE"
        actor: HealthOfficer
        preconditions: []
        side_effects:
          - "recompute effective_status"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /contractors/{id}/license-status with action REVOKE"
        actor: HealthOfficer
        preconditions: []
        side_effects:
          - "recompute effective_status"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /contractors/{id}/license-status with action REVOKE"
        actor: HealthOfficer
        preconditions: []
        side_effects:
          - "recompute effective_status"

  - entity: ConstructionPermit
    dimension: status
    initial_state: ISSUED
    terminal_states: [COMPLETED, VOIDED, EXPIRED]
    shape: branching
    transitions:
      - from: ISSUED
        to: UNDER_CONSTRUCTION
        trigger: "POST /inspections (the first inspection scheduled against this permit)"
        actor: EnvironmentalHealthSpecialist
        preconditions:
          - "logical clock is within the CLOSED interval [valid_from, valid_until], else ERR_PERMIT_NOT_IN_WINDOW"
        side_effects:
          - "an Inspection row is created in state SCHEDULED"
      - from: UNDER_CONSTRUCTION
        to: COVER_PASSED
        trigger: "POST /inspections/{id}/result with result PASS on an inspection whose inspection_type is COVER"
        actor: EnvironmentalHealthSpecialist
        preconditions:
          - "the recording X-User-ID differs from the cited SystemDesign.review_ehs_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "the permit's Contractor.effective_status == ACTIVE, else ERR_CONTRACTOR_NOT_ACTIVE"
        side_effects:
          - "set cover_inspection_passed_at to the logical clock"
      - from: COVER_PASSED
        to: COMPLETED
        trigger: "POST /inspections/{id}/result with result PASS on an inspection whose inspection_type is FINAL"
        actor: EnvironmentalHealthSpecialist
        preconditions:
          - "the permit's Contractor.effective_status == ACTIVE, else ERR_CONTRACTOR_NOT_ACTIVE"
        side_effects:
          - "the permit becomes eligible for POST /operating-permits"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /construction-permits/{id}/void"
        actor: HealthOfficer
        preconditions:
          - "no Inspection on this permit has status PASSED, else ERR_INVALID_STATE"
        side_effects:
          - "COMPENSATION: Parcel.fees_credited_cents increases by this permit's fee_cents, then Parcel.fee_balance_cents is re-derived per calculations.parcel_fee_ledger"
          - "COMPENSATION: Parcel.permitted_design_flow_gpd is re-derived per calculations.parcel_permitted_flow_ledger, releasing this permit's design_flow_gpd"
          - "the cited SystemDesign transitions PERMITTED -> APPROVED"
          - "every Inspection on this permit whose status is SCHEDULED or FAILED transitions to CANCELLED"
      - from: UNDER_CONSTRUCTION
        to: VOIDED
        trigger: "POST /construction-permits/{id}/void"
        actor: HealthOfficer
        preconditions:
          - "no Inspection on this permit has status PASSED, else ERR_INVALID_STATE"
        side_effects:
          - "COMPENSATION: Parcel.fees_credited_cents increases by this permit's fee_cents, then Parcel.fee_balance_cents is re-derived per calculations.parcel_fee_ledger"
          - "COMPENSATION: Parcel.permitted_design_flow_gpd is re-derived per calculations.parcel_permitted_flow_ledger, releasing this permit's design_flow_gpd"
          - "the cited SystemDesign transitions PERMITTED -> APPROVED"
          - "every Inspection on this permit whose status is SCHEDULED or FAILED transitions to CANCELLED"
      - from: ISSUED
        to: EXPIRED
        trigger: "system: POST /_clock/set_current_utc advances the clock strictly past valid_until"
        actor: system
        preconditions:
          - "new clock > valid_until"
        side_effects:
          - "Parcel.permitted_design_flow_gpd is re-derived, releasing this permit's design_flow_gpd"
          - "every Inspection on this permit whose status is SCHEDULED transitions to CANCELLED"
      - from: UNDER_CONSTRUCTION
        to: EXPIRED
        trigger: "system: POST /_clock/set_current_utc advances the clock strictly past valid_until"
        actor: system
        preconditions:
          - "new clock > valid_until"
        side_effects:
          - "Parcel.permitted_design_flow_gpd is re-derived, releasing this permit's design_flow_gpd"
          - "every Inspection on this permit whose status is SCHEDULED transitions to CANCELLED"

  - entity: Inspection
    dimension: status
    initial_state: SCHEDULED
    terminal_states: [PASSED, CANCELLED]
    shape: cyclic
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /inspections/{id}/result with result PASS"
        actor: EnvironmentalHealthSpecialist
        preconditions:
          - "the parent ConstructionPermit.status is in {UNDER_CONSTRUCTION, COVER_PASSED}, else ERR_INVALID_STATE"
          - "inspection_type COVER requires permit status UNDER_CONSTRUCTION; inspection_type FINAL requires permit status COVER_PASSED, else ERR_INSPECTION_SEQUENCE"
          - "for COVER only: recording X-User-ID != SystemDesign.review_ehs_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "Contractor.effective_status == ACTIVE, else ERR_CONTRACTOR_NOT_ACTIVE"
        side_effects:
          - "set result_recorded_at to the logical clock"
          - "COVER: parent ConstructionPermit transitions UNDER_CONSTRUCTION -> COVER_PASSED"
          - "FINAL: parent ConstructionPermit transitions COVER_PASSED -> COMPLETED"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /inspections/{id}/result with result FAIL"
        actor: EnvironmentalHealthSpecialist
        preconditions:
          - "the parent ConstructionPermit.status is in {UNDER_CONSTRUCTION, COVER_PASSED}, else ERR_INVALID_STATE"
          - "deficiency_codes in the request body is a non-empty array, else ERR_INVALID_REQUEST"
        side_effects:
          - "set result_recorded_at to the logical clock and store deficiency_codes"
          - "the parent ConstructionPermit.status is unchanged"
      - from: FAILED
        to: SCHEDULED
        trigger: "POST /inspections/{id}/reschedule"
        actor: EnvironmentalHealthSpecialist
        preconditions:
          - "the parent ConstructionPermit.status is in {UNDER_CONSTRUCTION, COVER_PASSED}, else ERR_INVALID_STATE"
          - "the new [scheduled_start, scheduled_end) window does not collide with another SCHEDULED Inspection on the same contractor_id under calculations.contractor_slot_overlap, else ERR_CONTRACTOR_SCHEDULE_CONFLICT"
        side_effects:
          - "increment reinspection_round by 1"
          - "clear result_recorded_at and deficiency_codes"
        note: "Re-inspection loop — this is the cyclic edge of the machine."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: the parent ConstructionPermit becomes VOIDED or EXPIRED"
        actor: system
        preconditions: []
        side_effects: []
      - from: FAILED
        to: CANCELLED
        trigger: "system: the parent ConstructionPermit becomes VOIDED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Well
    dimension: advisory_status
    initial_state: CLEAR
    terminal_states: []
    shape: branching
    transitions:
      - from: CLEAR
        to: ADVISORY
        trigger: "POST /wells/{id}/water-samples whose computed result is EXCEEDANCE"
        actor: EnvironmentalHealthSpecialist
        preconditions:
          - "the posted sample's result is EXCEEDANCE"
        side_effects:
          - "CASCADE step 2: because this well entered ADVISORY, its Parcel.water_quality_flag becomes true and Parcel.risk_tier is re-derived per calculations.parcel_risk_tier"
          - "CASCADE step 3: because Parcel.water_quality_flag became true, every OperatingPermit on that parcel whose status is ACTIVE sets monitoring_required to true, which halves pumping_interval_months per calculations.pumping_interval and pulls next_pumping_due_on earlier"
          - "CASCADE step 4: because next_pumping_due_on moved earlier, compliance_status is re-derived per calculations.pumping_compliance_status and may move COMPLIANT -> DUE_SOON or COMPLIANT -> DELINQUENT"
      - from: CLEAR
        to: CONDEMNED
        trigger: "POST /wells/{id}/water-samples whose computed result is UNSAFE"
        actor: EnvironmentalHealthSpecialist
        preconditions:
          - "the posted sample's result is UNSAFE"
        side_effects:
          - "CASCADE step 2: because this well entered CONDEMNED, its Parcel.water_quality_flag becomes true, Parcel.transfer_hold becomes true and Parcel.risk_tier is re-derived per calculations.parcel_risk_tier"
          - "CASCADE step 3: because Parcel.water_quality_flag became true, every OperatingPermit on that parcel whose status is ACTIVE sets monitoring_required to true, which halves pumping_interval_months per calculations.pumping_interval and pulls next_pumping_due_on earlier"
          - "CASCADE step 4: because next_pumping_due_on moved earlier, compliance_status is re-derived per calculations.pumping_compliance_status and may move COMPLIANT -> DUE_SOON or COMPLIANT -> DELINQUENT"
      - from: ADVISORY
        to: CONDEMNED
        trigger: "POST /wells/{id}/water-samples whose computed result is UNSAFE"
        actor: EnvironmentalHealthSpecialist
        preconditions:
          - "the posted sample's result is UNSAFE"
        side_effects:
          - "Parcel.risk_tier is re-derived"
      - from: ADVISORY
        to: CLEAR
        trigger: "POST /wells/{id}/water-samples whose computed result is PASS"
        actor: EnvironmentalHealthSpecialist
        preconditions:
          - "the posted sample's result is PASS"
        side_effects:
          - "Parcel.water_quality_flag is re-derived over all wells on the parcel; Parcel.risk_tier is re-derived"
        note: "Clearance loop — an advisory is lifted by a clean resample; CONDEMNED is not clearable through this API."

  - entity: OperatingPermit
    dimension: status
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    shape: parallel
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /repair-orders/{id}/issue, or POST /operating-permits/{id}/status with action SUSPEND"
        actor: HealthOfficer
        preconditions: []
        side_effects:
          - "CASCADE step 3: because this permit entered SUSPENDED, every TransferInspection with this operating_permit_id whose status is REQUESTED transitions REQUESTED -> BLOCKED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /repair-orders/{id}/resolve with outcome REPAIRED, or POST /operating-permits/{id}/status with action REINSTATE"
        actor: HealthOfficer
        preconditions:
          - "the parcel has no other RepairOrder whose status is in {ISSUED, EXTENDED}, else ERR_OPEN_REPAIR_ORDER"
        side_effects:
          - "every TransferInspection with this operating_permit_id whose status is BLOCKED transitions BLOCKED -> REQUESTED"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /repair-orders/{id}/resolve with outcome ESCALATE, or POST /operating-permits/{id}/status with action REVOKE"
        actor: HealthOfficer
        preconditions: []
        side_effects:
          - "Parcel.transfer_hold becomes true and Parcel.risk_tier is re-derived"
          - "every TransferInspection with this operating_permit_id whose status is in {REQUESTED, BLOCKED} transitions to DENIED with certificate_grade UNSATISFACTORY"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /repair-orders/{id}/resolve with outcome ESCALATE, or POST /operating-permits/{id}/status with action REVOKE"
        actor: HealthOfficer
        preconditions: []
        side_effects:
          - "Parcel.transfer_hold becomes true and Parcel.risk_tier is re-derived"
          - "every TransferInspection with this operating_permit_id whose status is in {REQUESTED, BLOCKED} transitions to DENIED with certificate_grade UNSATISFACTORY"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /_clock/set_current_utc advances the clock strictly past expires_on"
        actor: system
        preconditions:
          - "new clock > expires_on"
        side_effects: []
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system: POST /_clock/set_current_utc advances the clock strictly past expires_on"
        actor: system
        preconditions:
          - "new clock > expires_on"
        side_effects: []

  - entity: OperatingPermit
    dimension: compliance_status
    initial_state: COMPLIANT
    terminal_states: []
    shape: parallel
    transitions:
      - from: COMPLIANT
        to: DUE_SOON
        trigger: "system: re-derived by POST /_clock/set_current_utc, POST /pumping-records and any recompute of next_pumping_due_on"
        actor: system
        preconditions:
          - "0 <= whole days from the logical clock to next_pumping_due_on <= PUMPING_DUE_SOON_DAYS"
        side_effects: []
      - from: DUE_SOON
        to: DELINQUENT
        trigger: "system: re-derived by POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "the logical clock is strictly after next_pumping_due_on"
        side_effects: []
      - from: COMPLIANT
        to: DELINQUENT
        trigger: "system: re-derived by POST /_clock/set_current_utc when the clock jumps past the deadline without passing through the due-soon window"
        actor: system
        preconditions:
          - "the logical clock is strictly after next_pumping_due_on"
        side_effects: []
      - from: DELINQUENT
        to: COMPLIANT
        trigger: "POST /pumping-records"
        actor: Pumper
        preconditions:
          - "the new record's pumped_on is at or before the logical clock"
        side_effects:
          - "last_pumped_on, pumping_interval_months and next_pumping_due_on are re-derived per calculations.pumping_interval"
      - from: DUE_SOON
        to: COMPLIANT
        trigger: "POST /pumping-records"
        actor: Pumper
        preconditions:
          - "the new record's pumped_on is at or before the logical clock"
        side_effects:
          - "last_pumped_on, pumping_interval_months and next_pumping_due_on are re-derived per calculations.pumping_interval"
    note: |
      The two OperatingPermit dimensions evolve independently: an ACTIVE permit
      may be DELINQUENT, a SUSPENDED permit may be COMPLIANT, and a status
      change never rewrites compliance_status (nor the reverse). The single
      COMPLIANT -> DUE_SOON edge has two distinct causes: the passage of the
      logical clock, and CASCADE step 4 in which monitoring_required flips true
      and halves pumping_interval_months, pulling next_pumping_due_on earlier.

  - entity: RepairOrder
    dimension: status
    initial_state: DRAFT
    terminal_states: [RESOLVED, ESCALATED]
    shape: branching
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /repair-orders/{id}/issue"
        actor: HealthOfficer
        preconditions:
          - "the cited OperatingPermit.status is in {ACTIVE, SUSPENDED}, else ERR_OPERATING_PERMIT_NOT_ACTIVE"
        side_effects:
          - "severity and compliance_deadline are computed per calculations.repair_order_severity_and_deadline"
          - "issued_by_user_id is set to the issuing X-User-ID"
          - "Parcel.open_repair_order_count is re-derived (increments by 1) and Parcel.transfer_hold becomes true"
          - "CASCADE step 2: because this order entered ISSUED, the cited OperatingPermit transitions ACTIVE -> SUSPENDED"
          - "CASCADE step 3: because that OperatingPermit entered SUSPENDED, every TransferInspection with that operating_permit_id whose status is REQUESTED transitions REQUESTED -> BLOCKED"
          - "Parcel.risk_tier is re-derived per calculations.parcel_risk_tier"
      - from: ISSUED
        to: EXTENDED
        trigger: "POST /repair-orders/{id}/extend"
        actor: HealthOfficer
        preconditions:
          - "extension_count < MAX_REPAIR_EXTENSIONS, else ERR_MAX_EXTENSIONS_REACHED"
          - "severity != IMMINENT_HAZARD, else ERR_EXTENSION_NOT_ALLOWED"
        side_effects:
          - "compliance_deadline advances by REPAIR_EXTENSION_DAYS whole days"
          - "increment extension_count by 1"
      - from: EXTENDED
        to: EXTENDED
        trigger: "POST /repair-orders/{id}/extend"
        actor: HealthOfficer
        preconditions:
          - "extension_count < MAX_REPAIR_EXTENSIONS, else ERR_MAX_EXTENSIONS_REACHED"
          - "severity != IMMINENT_HAZARD, else ERR_EXTENSION_NOT_ALLOWED"
        side_effects:
          - "compliance_deadline advances by REPAIR_EXTENSION_DAYS whole days"
          - "increment extension_count by 1"
        note: "Self-loop — the extension cycle, bounded by MAX_REPAIR_EXTENSIONS."
      - from: ISSUED
        to: RESOLVED
        trigger: "POST /repair-orders/{id}/resolve with outcome REPAIRED"
        actor: EnvironmentalHealthSpecialist
        preconditions:
          - "the logical clock is at or before compliance_deadline, else ERR_REPAIR_DEADLINE_PASSED"
        side_effects:
          - "closed_by_user_id is set to the resolving X-User-ID"
          - "Parcel.open_repair_order_count is re-derived (decrements by 1)"
          - "the cited OperatingPermit transitions SUSPENDED -> ACTIVE when no other RepairOrder on the parcel is in {ISSUED, EXTENDED}"
          - "every TransferInspection on that operating permit whose status is BLOCKED transitions BLOCKED -> REQUESTED"
          - "Parcel.transfer_hold and Parcel.risk_tier are re-derived"
      - from: EXTENDED
        to: RESOLVED
        trigger: "POST /repair-orders/{id}/resolve with outcome REPAIRED"
        actor: EnvironmentalHealthSpecialist
        preconditions:
          - "the logical clock is at or before compliance_deadline, else ERR_REPAIR_DEADLINE_PASSED"
        side_effects:
          - "closed_by_user_id is set to the resolving X-User-ID"
          - "Parcel.open_repair_order_count is re-derived (decrements by 1)"
          - "the cited OperatingPermit transitions SUSPENDED -> ACTIVE when no other RepairOrder on the parcel is in {ISSUED, EXTENDED}"
          - "every TransferInspection on that operating permit whose status is BLOCKED transitions BLOCKED -> REQUESTED"
          - "Parcel.transfer_hold and Parcel.risk_tier are re-derived"
      - from: ISSUED
        to: ESCALATED
        trigger: "POST /repair-orders/{id}/resolve with outcome ESCALATE"
        actor: EnvironmentalHealthSpecialist
        preconditions: []
        side_effects:
          - "closed_by_user_id is set to the resolving X-User-ID"
          - "Parcel.open_repair_order_count is re-derived (decrements by 1)"
          - "the cited OperatingPermit transitions to REVOKED (branch-divergent: the REPAIRED branch reinstates, this branch revokes)"
          - "every TransferInspection on that operating permit whose status is in {REQUESTED, BLOCKED} transitions to DENIED with certificate_grade UNSATISFACTORY"
          - "Parcel.transfer_hold stays true because a REVOKED operating permit holds the parcel; Parcel.risk_tier is re-derived"
      - from: EXTENDED
        to: ESCALATED
        trigger: "POST /repair-orders/{id}/resolve with outcome ESCALATE"
        actor: EnvironmentalHealthSpecialist
        preconditions: []
        side_effects:
          - "closed_by_user_id is set to the resolving X-User-ID"
          - "Parcel.open_repair_order_count is re-derived (decrements by 1)"
          - "the cited OperatingPermit transitions to REVOKED"
          - "every TransferInspection on that operating permit whose status is in {REQUESTED, BLOCKED} transitions to DENIED with certificate_grade UNSATISFACTORY"
          - "Parcel.transfer_hold stays true because a REVOKED operating permit holds the parcel; Parcel.risk_tier is re-derived"

  - entity: TransferInspection
    dimension: status
    initial_state: REQUESTED
    terminal_states: [CERTIFIED, DENIED]
    shape: branching
    transitions:
      - from: REQUESTED
        to: CERTIFIED
        trigger: "POST /transfer-inspections/{id}/certify with decision CERTIFY"
        actor: EnvironmentalHealthSpecialist
        preconditions:
          - "the cited OperatingPermit.status == ACTIVE, else ERR_OPERATING_PERMIT_NOT_ACTIVE"
          - "Parcel.transfer_hold is false, else ERR_TRANSFER_HOLD_ACTIVE"
          - "Parcel.fee_balance_cents == 0, else ERR_OUTSTANDING_FEE_BALANCE"
        side_effects:
          - "certificate_grade is computed per calculations.transfer_certificate_grade using the variant named by inspection_mode"
          - "certified_at is set to the logical clock and certificate_valid_until to certified_at + TRANSFER_CERT_VALIDITY_DAYS"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /transfer-inspections/{id}/certify with decision DENY"
        actor: EnvironmentalHealthSpecialist
        preconditions: []
        side_effects:
          - "certificate_grade is set to UNSATISFACTORY; certified_at and certificate_valid_until stay null"
      - from: REQUESTED
        to: BLOCKED
        trigger: "system: the cited OperatingPermit leaves ACTIVE for SUSPENDED"
        actor: system
        preconditions: []
        side_effects: []
      - from: BLOCKED
        to: REQUESTED
        trigger: "system: the cited OperatingPermit returns SUSPENDED -> ACTIVE"
        actor: system
        preconditions: []
        side_effects: []
      - from: BLOCKED
        to: DENIED
        trigger: "POST /transfer-inspections/{id}/certify with decision DENY, or system when the cited OperatingPermit is REVOKED"
        actor: EnvironmentalHealthSpecialist
        preconditions: []
        side_effects:
          - "certificate_grade is set to UNSATISFACTORY"

concurrency_rules:
  - rule_id: transfer-inspection-create-stale-parcel
    parent_entity: Parcel
    write_endpoint: "POST /transfer-inspections"
    occ_field: "expected_parcel_version"
    description: |
      Requesting a transfer inspection against a Parcel whose version has
      advanced since the client last observed it is rejected. A new
      TransferInspection legitimately supersedes an earlier request for the same
      parcel (a re-listed sale), so the department cannot resolve the conflict by
      state alone; instead the requester must be working from a current view of
      the parcel's holds, fee balance and repair-order count.
    error_id: ERR_STALE_PARCEL_VERSION
    http_status: 412
  - rule_id: system-design-create-stale-site-evaluation
    parent_entity: SiteEvaluation
    write_endpoint: "POST /system-designs"
    occ_field: "expected_site_evaluation_version"
    description: |
      Creating a SystemDesign against a SiteEvaluation whose version has advanced
      since the client last observed it is rejected. A newer design legitimately
      supersedes the prior design drawn from the same evaluation, so the writer
      must confirm the evaluation's certified perc rate and soil loading rate have
      not been re-derived under them.
    error_id: ERR_STALE_SITE_EVALUATION_VERSION
    http_status: 412

calculations:
  - name: parcel_max_design_flow
    trigger: "on POST /parcels, and re-derived whenever lot_size_sqft is read for a flow check"
    algorithm: threshold
    formula: |
      max_design_flow_gpd = min(floor(lot_size_sqft / LOT_SQFT_PER_GPD), PARCEL_FLOW_CAP_GPD)
    input_set: "the Parcel's own lot_size_sqft only"
    constants:
      LOT_SQFT_PER_GPD: 20
      PARCEL_FLOW_CAP_GPD: 1500
    precision: "integer gallons per day, floor division then cap"

  - name: parcel_permitted_flow_ledger
    trigger: "on POST /construction-permits (assign), on POST /construction-permits/{id}/void (release), and on the system EXPIRED transition of a ConstructionPermit"
    algorithm: aggregation
    formula: |
      Parcel.permitted_design_flow_gpd
        = sum of ConstructionPermit.design_flow_gpd
          over every ConstructionPermit whose parcel_id == Parcel.id
          and whose status is in {ISSUED, UNDER_CONSTRUCTION, COVER_PASSED, COMPLETED}
      CONSERVATION INVARIANT (compensating action):
        issuing a permit for F gpd and then voiding that same permit MUST leave
        Parcel.permitted_design_flow_gpd exactly equal to its pre-issue value.
    input_set: "ConstructionPermits with status in {ISSUED, UNDER_CONSTRUCTION, COVER_PASSED, COMPLETED}; VOIDED and EXPIRED permits are excluded"
    constants: {}
    precision: "integer gallons per day; no rounding"

  - name: parcel_fee_ledger
    trigger: "on POST /construction-permits (assess), POST /parcels/{id}/fee-payments (pay), POST /construction-permits/{id}/void (credit)"
    algorithm: aggregation
    formula: |
      fees_assessed_cents += ConstructionPermit.fee_cents            # on issue
      fees_paid_cents     += request.amount_cents                    # on payment
      fees_credited_cents += ConstructionPermit.fee_cents            # on void
      fee_balance_cents = fees_assessed_cents - fees_paid_cents - fees_credited_cents
      CONSERVATION INVARIANT (compensating action):
        issuing a permit whose fee is C cents and then voiding that same permit
        MUST leave Parcel.fee_balance_cents exactly equal to its pre-issue value,
        while fees_assessed_cents and fees_credited_cents have each grown by C.
    input_set: "all fee events ever recorded against the Parcel; nothing is filtered out"
    constants: {}
    precision: "integer cents; fee_balance_cents may be negative when overpaid"

  - name: water_sample_result
    trigger: "on POST /wells/{id}/water-samples, before the well advisory transition"
    algorithm: threshold
    formula: |
      if coliform_present == true:
          result = UNSAFE
      elif nitrate_mg_l >= NITRATE_MCL_MG_L:
          result = EXCEEDANCE
      else:
          result = PASS
      exceedance_reasons = sorted list containing
          "COLIFORM_DETECTED"      when coliform_present == true
          "NITRATE_MCL_EXCEEDED"   when nitrate_mg_l >= NITRATE_MCL_MG_L
      (a sample may carry both reason codes when it is UNSAFE and also over the MCL)
    input_set: "the single posted sample; prior samples are not consulted"
    constants:
      NITRATE_MCL_MG_L: 10.0
    precision: "comparison is inclusive: exactly 10.0 mg/L is an EXCEEDANCE, 9.9 mg/L is a PASS"

  - name: perc_rate_evaluation
    trigger: "on POST /site-evaluations/{id}/perc-holes and on POST /site-evaluations/{id}/submit"
    algorithm: aggregation
    formula: |
      for each entry in perc_holes:
          valid = (presoak_ok == true) and (drop_inches > 0) and (elapsed_minutes > 0)
          rate_min_per_in = round_half_up(elapsed_minutes / drop_inches, 2)   # only when valid
      V = [entry.rate_min_per_in for entry in perc_holes if entry.valid]
      if V is empty:
          preliminary_perc_rate_min_per_in = null
          certified_perc_rate_min_per_in  = null
      else:
          PRELIMINARY: preliminary_perc_rate_min_per_in = round_half_up(sum(V) / count(V), 2)
          CERTIFIED:   certified_perc_rate_min_per_in  = max(V)
    input_set: "perc_holes entries whose valid flag is true; invalid holes (failed pre-soak, zero drop, zero elapsed) are excluded from BOTH variants"
    constants: {}
    precision: "2 decimal places, round_half_up, applied per hole first and then once more to the PRELIMINARY mean"
    variants:
      - name: PRELIMINARY
        when: "reported on SiteEvaluation.preliminary_perc_rate_min_per_in and shown to the applicant as an indicative rate"
        difference: "arithmetic mean of the valid hole rates; a single fast hole pulls the number down"
      - name: CERTIFIED
        when: "reported on SiteEvaluation.certified_perc_rate_min_per_in and is the ONLY value calculations.soil_loading_rate and the approval gate may read"
        difference: "the slowest (numerically largest) valid hole rate governs; the mean is never used for sizing"

  - name: soil_loading_rate
    trigger: "whenever certified_perc_rate_min_per_in is (re)computed"
    algorithm: tiered_pricing
    formula: |
      R = certified_perc_rate_min_per_in
      if R is null:                 soil_loading_rate_gpd_per_sqft = null
      elif R <= 5:                  soil_loading_rate_gpd_per_sqft = 1.20
      elif R <= 15:                 soil_loading_rate_gpd_per_sqft = 0.80
      elif R <= 30:                 soil_loading_rate_gpd_per_sqft = 0.60
      elif R <= 60:                 soil_loading_rate_gpd_per_sqft = 0.40
      elif R <= MAX_PERCOLATION_RATE_MIN_PER_IN: soil_loading_rate_gpd_per_sqft = 0.20
      else:                         soil_loading_rate_gpd_per_sqft = null   # soil unsuitable
    input_set: "the certified variant only"
    constants:
      TIER_1_MAX_MIN_PER_IN: 5
      TIER_2_MAX_MIN_PER_IN: 15
      TIER_3_MAX_MIN_PER_IN: 30
      TIER_4_MAX_MIN_PER_IN: 60
      MAX_PERCOLATION_RATE_MIN_PER_IN: 120
    precision: "each tier boundary is INCLUSIVE of its upper bound: R == 15 selects 0.80, R == 15.01 selects 0.60"

  - name: design_flow
    trigger: "on POST /system-designs and on POST /system-designs/{id}/submit"
    algorithm: threshold
    formula: |
      design_flow_gpd = max(bedrooms, MIN_BILLABLE_BEDROOMS) * FLOW_PER_BEDROOM_GPD
    input_set: "the design's own bedrooms field"
    constants:
      FLOW_PER_BEDROOM_GPD: 120
      MIN_BILLABLE_BEDROOMS: 2
    precision: "integer gallons per day"

  - name: required_drainfield_area
    trigger: "on POST /system-designs and on POST /system-designs/{id}/submit"
    algorithm: constraint_propagation
    formula: |
      # Four interacting inputs: design flow, the soil loading tier, the treatment
      # technology multiplier and the shallow-soil penalty. The clamp is applied
      # LAST, after both multipliers.
      L = SiteEvaluation.soil_loading_rate_gpd_per_sqft          # null -> ERR_SOIL_UNSUITABLE
      M = SYSTEM_TYPE_AREA_MULTIPLIER[SystemDesign.system_type]
      D = SHALLOW_SOIL_MULTIPLIER if SiteEvaluation.depth_to_limiting_layer_in < SHALLOW_SOIL_THRESHOLD_IN else 1.00
      raw = (design_flow_gpd / L) * M * D
      required_drainfield_sqft = min(max(ceil(raw), MIN_DRAINFIELD_SQFT), MAX_DRAINFIELD_SQFT)
    input_set: "the design's own design_flow_gpd and system_type, plus the cited SiteEvaluation's soil_loading_rate_gpd_per_sqft and depth_to_limiting_layer_in"
    constants:
      SYSTEM_TYPE_AREA_MULTIPLIER: { CONVENTIONAL: 1.00, MOUND: 1.25, ATU: 0.75, DRIP: 0.85 }
      SHALLOW_SOIL_THRESHOLD_IN: 36
      SHALLOW_SOIL_MULTIPLIER: 1.20
      MIN_DRAINFIELD_SQFT: 150
      MAX_DRAINFIELD_SQFT: 4000
    precision: "perform (design_flow_gpd / L) * M * D in EXACT DECIMAL arithmetic (never binary floating point) so that an exact multiple such as 360 / 0.60 yields exactly 600 and is not pushed to 601 by representation error; then ceil to the next whole square foot; then apply the min/max clamp. The multipliers are applied in the order (flow / L) then * M then * D."

  - name: well_setback_evaluation
    trigger: "on POST /system-designs, on POST /system-designs/{id}/submit, and whenever a Well is added to the parcel"
    algorithm: threshold
    formula: |
      candidates = Wells whose parcel_id == the design's parcel
                   AND whose well_type is in {DOMESTIC, IRRIGATION}
                   (MONITORING wells are excluded from the setback rule)
      if candidates is empty:
          nearest_well_distance_ft = null
          required_setback_ft      = SETBACK_BASE_FT[system_type] + (SANDY_SETBACK_SURCHARGE_FT if soil_group == SANDY else 0)
          setback_status           = NOT_APPLICABLE
      else:
          for each well: d = round_half_up(sqrt((well.location_x_ft - drainfield_x_ft)^2
                                              + (well.location_y_ft - drainfield_y_ft)^2), 2)
          nearest_well_distance_ft = min(d over candidates)
          required_setback_ft      = SETBACK_BASE_FT[system_type] + (SANDY_SETBACK_SURCHARGE_FT if soil_group == SANDY else 0)
          setback_status = COMPLIANT           if nearest_well_distance_ft >= required_setback_ft
                           else VARIANCE_REQUIRED
      # a granted or denied variance is NOT recomputed away by an ordinary submit:
      # once setback_status is VARIANCE_GRANTED or VARIANCE_DENIED it is sticky.
      # The ONE event that clears it is POST /wells adding a well to the parcel,
      # which re-derives setback_status from scratch for every SystemDesign on the
      # parcel whose status is in {DRAFT, UNDER_REVIEW, REVISIONS_REQUIRED, APPROVED}.
    input_set: "Wells on the parcel with well_type in {DOMESTIC, IRRIGATION}; the design's drainfield coordinates; the cited SiteEvaluation's soil_group"
    constants:
      SETBACK_BASE_FT: { CONVENTIONAL: 100, MOUND: 100, ATU: 75, DRIP: 75 }
      SANDY_SETBACK_SURCHARGE_FT: 25
    precision: "distance rounded to 2 decimal places, round_half_up; the comparison is INCLUSIVE — a distance exactly equal to required_setback_ft is COMPLIANT"

  - name: construction_permit_fee
    trigger: "on POST /construction-permits"
    algorithm: tiered_pricing
    formula: |
      # Four line items, in this fixed order:
      L1 = PERMIT_BASE_REVIEW_CENTS
      L2 = SystemDesign.design_flow_gpd * PERMIT_FLOW_RATE_CENTS_PER_GPD
      L3 = SYSTEM_TYPE_SURCHARGE_CENTS[SystemDesign.system_type]
      L4 = PERMIT_VARIANCE_CENTS if SystemDesign.setback_status == VARIANCE_GRANTED else 0
      # ROUNDING ORDER IS PINNED: apply the combined statutory surcharge to EACH
      # line item, round THAT line to whole cents (round_half_up), and only then
      # sum. Summing the raw line items and applying the surcharge once is WRONG
      # and produces a different total.
      combined = 1 + STATE_SURCHARGE_RATE + COUNTY_TECH_FEE_RATE      # = 1.0675
      fee_cents = sum over i in [L1, L2, L3, L4] of round_half_up(i * combined, 0)
    input_set: "the cited SystemDesign's design_flow_gpd, system_type and setback_status at the instant the permit is issued"
    constants:
      PERMIT_BASE_REVIEW_CENTS: 45000
      PERMIT_FLOW_RATE_CENTS_PER_GPD: 65
      SYSTEM_TYPE_SURCHARGE_CENTS: { CONVENTIONAL: 0, MOUND: 30000, ATU: 42500, DRIP: 27500 }
      PERMIT_VARIANCE_CENTS: 15000
      STATE_SURCHARGE_RATE: 0.045
      COUNTY_TECH_FEE_RATE: 0.0225
    precision: "whole cents, round_half_up, applied PER LINE ITEM then summed (never sum-then-round)"

  - name: contractor_effective_status
    trigger: "read-time derivation on every Contractor read and on every gate that consults a contractor licence"
    algorithm: projection
    formula: |
      if status == REVOKED:                          effective_status = REVOKED
      elif status == SUSPENDED:                      effective_status = SUSPENDED
      elif logical_clock > license_expires_on:       effective_status = EXPIRED
      else:                                          effective_status = ACTIVE
    input_set: "the Contractor's own status and license_expires_on, plus the logical clock"
    constants: {}
    precision: "the expiry comparison is STRICT: a clock exactly equal to license_expires_on is still ACTIVE"

  - name: contractor_slot_overlap
    trigger: "on POST /inspections and on POST /inspections/{id}/reschedule"
    algorithm: interval_merge
    formula: |
      # Resource: the Contractor. Occupation interval is HALF-OPEN [start, end).
      # A one-sided TRAVEL buffer is appended AFTER each existing window's end.
      for each existing Inspection E with the same contractor_id and status SCHEDULED:
          e_start = E.scheduled_start
          e_end   = E.scheduled_end + TRAVEL_BUFFER_MINUTES
          conflict if (new.scheduled_start < e_end) and (e_start < new.scheduled_end + TRAVEL_BUFFER_MINUTES)
      any conflict -> ERR_CONTRACTOR_SCHEDULE_CONFLICT
    input_set: "Inspections with status SCHEDULED on the same contractor_id; PASSED, FAILED and CANCELLED inspections do not occupy the contractor"
    constants:
      TRAVEL_BUFFER_MINUTES: 45
    precision: "half-open on both raw endpoints; a new window starting EXACTLY at (existing end + 45 minutes) does NOT conflict, one minute earlier does"

  - name: parcel_construction_window_overlap
    trigger: "on POST /construction-permits"
    algorithm: interval_merge
    formula: |
      # Resource: the Parcel. Occupation interval is the CLOSED interval
      # [valid_from, valid_until] with NO buffer.
      for each existing ConstructionPermit P on the same parcel_id
          with status in {ISSUED, UNDER_CONSTRUCTION, COVER_PASSED}:
          conflict if (new.valid_from <= P.valid_until) and (P.valid_from <= new.valid_until)
      any conflict -> ERR_PERMIT_WINDOW_CONFLICT
    input_set: "ConstructionPermits on the same parcel with status in {ISSUED, UNDER_CONSTRUCTION, COVER_PASSED}; COMPLETED, VOIDED and EXPIRED permits release the parcel"
    constants: {}
    precision: "closed on both endpoints and unbuffered — a new window whose valid_from equals an existing valid_until DOES conflict, unlike the contractor rule where exact adjacency is allowed"

  - name: pumping_interval
    trigger: "on POST /operating-permits, on POST /pumping-records, and whenever monitoring_required flips"
    algorithm: tiered_pricing
    formula: |
      gpp = tank_capacity_gal / household_size          # exact rational, not rounded
      if   gpp >= 500: base_months = 60
      elif gpp >= 300: base_months = 48
      elif gpp >= 200: base_months = 36
      elif gpp >= 125: base_months = 24
      else:            base_months = 12
      pumping_interval_months = floor(base_months / 2) if monitoring_required else base_months
      anchor = last_pumped_on if last_pumped_on is not null else issued_on
      next_pumping_due_on = anchor advanced by pumping_interval_months CALENDAR months
          (same day-of-month and same time-of-day; when the target month is shorter,
           clamp to the last day of that month)
    input_set: "the OperatingPermit's own tank_capacity_gal, household_size, monitoring_required and the pumped_on of its latest accepted PumpingRecord"
    constants:
      TANK_GAL_PER_PERSON_TIER_1: 500
      TANK_GAL_PER_PERSON_TIER_2: 300
      TANK_GAL_PER_PERSON_TIER_3: 200
      TANK_GAL_PER_PERSON_TIER_4: 125
    precision: "each tier boundary is INCLUSIVE of its lower bound: gpp exactly 200.0 selects 36 months, 199.99 selects 24 months"

  - name: pumping_compliance_status
    trigger: "on POST /_clock/set_current_utc, on POST /pumping-records, and whenever next_pumping_due_on changes"
    algorithm: threshold
    formula: |
      days_until_due = whole days from the logical clock to next_pumping_due_on
                       (floor of the exact difference; negative when the deadline has passed)
      if days_until_due < 0:                        compliance_status = DELINQUENT
      elif days_until_due <= PUMPING_DUE_SOON_DAYS: compliance_status = DUE_SOON
      else:                                         compliance_status = COMPLIANT
    input_set: "the OperatingPermit's own next_pumping_due_on and the logical clock; the permit's administrative status is NOT consulted"
    constants:
      PUMPING_DUE_SOON_DAYS: 90
    precision: "boundaries are inclusive on both sides of the due-soon window: exactly 90 days out is DUE_SOON, 91 days out is COMPLIANT, exactly 0 days out is DUE_SOON"

  - name: parcel_risk_tier
    trigger: "whenever water_quality_flag, open_repair_order_count, or any OperatingPermit status/compliance_status on the parcel changes"
    algorithm: weighted_scoring
    formula: |
      points = 0
      points += WATER_FLAG_POINTS      if water_quality_flag == true
      points += REPAIR_ORDER_POINTS * min(open_repair_order_count, REPAIR_ORDER_POINT_CAP)
      points += DELINQUENT_POINTS      if any OperatingPermit on the parcel has compliance_status == DELINQUENT
      points += REVOKED_POINTS         if any OperatingPermit on the parcel has status == REVOKED
      risk_tier = HIGH      if points >= HIGH_RISK_POINTS
                  ELEVATED  if points >= ELEVATED_RISK_POINTS
                  LOW       otherwise
    input_set: "the parcel's own water_quality_flag and open_repair_order_count, plus every OperatingPermit whose parcel_id is this parcel regardless of status"
    constants:
      WATER_FLAG_POINTS: 40
      REPAIR_ORDER_POINTS: 25
      REPAIR_ORDER_POINT_CAP: 2
      DELINQUENT_POINTS: 20
      REVOKED_POINTS: 35
      ELEVATED_RISK_POINTS: 25
      HIGH_RISK_POINTS: 60
    precision: "integer points; both tier comparisons are >= — exactly 25 points is ELEVATED and exactly 60 points is HIGH"

  - name: repair_order_severity_and_deadline
    trigger: "on POST /repair-orders/{id}/issue"
    algorithm: threshold
    formula: |
      if failure_type == GROUNDWATER_CONTAMINATION or Parcel.water_quality_flag == true:
          severity = IMMINENT_HAZARD
      elif failure_type in {SURFACING_EFFLUENT, BACKUP}:
          severity = URGENT
      else:                                    # STRUCTURAL
          severity = ROUTINE
      compliance_deadline = logical_clock advanced by REPAIR_DEADLINE_DAYS[severity] whole days
    input_set: "the order's own failure_type plus the parcel's water_quality_flag as it stands at issue time"
    constants:
      REPAIR_DEADLINE_DAYS: { IMMINENT_HAZARD: 10, URGENT: 30, ROUTINE: 90 }
      REPAIR_EXTENSION_DAYS: 30
      MAX_REPAIR_EXTENSIONS: 2
    precision: "whole days added to the logical clock, preserving time-of-day"

  - name: transfer_certificate_grade
    trigger: "on POST /transfer-inspections/{id}/certify with decision CERTIFY"
    algorithm: weighted_scoring
    formula: |
      # STEP 1 — records base grade (identical for both variants)
      if Parcel.open_repair_order_count > 0
         or OperatingPermit.status in {SUSPENDED, REVOKED, EXPIRED}:
          base = UNSATISFACTORY
      elif OperatingPermit.compliance_status in {DUE_SOON, DELINQUENT}
           or Parcel.water_quality_flag == true:
          base = CONDITIONAL
      else:
          base = SATISFACTORY
      # STEP 2 — variant-specific adjustment (see variants below)
    input_set: "the parcel's open_repair_order_count and water_quality_flag, the cited OperatingPermit's status and compliance_status, and (FIELD_VERIFIED only) the recorded tank_condition and drainfield_condition"
    constants: {}
    precision: "enumerated grade, no rounding"
    variants:
      - name: DESK_REVIEW
        when: "TransferInspection.inspection_mode == DESK_REVIEW"
        difference: |
          certificate_grade = base, unchanged. Field conditions are neither
          collected nor consulted.
      - name: FIELD_VERIFIED
        when: "TransferInspection.inspection_mode == FIELD_VERIFIED"
        difference: |
          if tank_condition == POOR or drainfield_condition == POOR:
              certificate_grade = UNSATISFACTORY
          elif tank_condition == FAIR or drainfield_condition == FAIR:
              certificate_grade = CONDITIONAL if base == SATISFACTORY else base
          else:   # both GOOD
              # field verification may CLEAR a records-only CONDITIONAL, but only
              # when the sole cause was a DUE_SOON pumping deadline
              if base == CONDITIONAL
                 and OperatingPermit.compliance_status == DUE_SOON
                 and Parcel.water_quality_flag == false:
                  certificate_grade = SATISFACTORY
              else:
                  certificate_grade = base
          Identical records therefore yield CONDITIONAL under DESK_REVIEW and
          SATISFACTORY under FIELD_VERIFIED whenever the only defect is DUE_SOON.

  - name: transfer_inspection_charges
    trigger: "on POST /transfer-inspections"
    algorithm: waterfall_allocation
    formula: |
      subtotal_cents = TRANSFER_BASE_FEE_CENTS
                     + (FIELD_VERIFICATION_FEE_CENTS if inspection_mode == FIELD_VERIFIED else 0)
                     + (RECORDS_RESEARCH_FEE_CENTS   if Parcel.open_repair_order_count > 0 else 0)
      # The expedite rate is keyed on a TOTAL tier, and the total contains the
      # expedite fee — a circular-looking dependency. EVALUATION ORDER IS PINNED:
      # the tier is selected from subtotal_cents ALONE (the pre-expedite amount).
      # Never iterate to a fixed point and never re-select the tier after adding
      # the expedite fee.
      if expedited == false:
          expedite_fee_cents = 0
      else:
          rate = EXPEDITE_RATE_LOW  if subtotal_cents <  EXPEDITE_TIER_1_CENTS
                 EXPEDITE_RATE_MID  if subtotal_cents <  EXPEDITE_TIER_2_CENTS
                 EXPEDITE_RATE_HIGH otherwise
          expedite_fee_cents = round_half_up(subtotal_cents * rate, 0)
      total_due_cents = subtotal_cents + expedite_fee_cents
    input_set: "the request's inspection_mode and expedited flag plus the parcel's open_repair_order_count at request time"
    constants:
      TRANSFER_BASE_FEE_CENTS: 18500
      FIELD_VERIFICATION_FEE_CENTS: 9500
      RECORDS_RESEARCH_FEE_CENTS: 4000
      EXPEDITE_TIER_1_CENTS: 20000
      EXPEDITE_TIER_2_CENTS: 30000
      EXPEDITE_RATE_LOW: 0.30
      EXPEDITE_RATE_MID: 0.20
      EXPEDITE_RATE_HIGH: 0.15
    precision: "whole cents, round_half_up; the tier comparison uses strict < against each tier ceiling"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every resource named by a path segment exists, validated left-to-right"
    error_id: "ERR_PARCEL_NOT_FOUND | ERR_WELL_NOT_FOUND | ERR_SITE_EVALUATION_NOT_FOUND | ERR_SYSTEM_DESIGN_NOT_FOUND | ERR_CONTRACTOR_NOT_FOUND | ERR_CONSTRUCTION_PERMIT_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_OPERATING_PERMIT_NOT_FOUND | ERR_PUMPING_RECORD_NOT_FOUND | ERR_REPAIR_ORDER_NOT_FOUND | ERR_TRANSFER_INSPECTION_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"
  - priority: 4
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row"
    error_id: "ERR_PARCEL_NOT_FOUND | ERR_SITE_EVALUATION_NOT_FOUND | ERR_SYSTEM_DESIGN_NOT_FOUND | ERR_CONTRACTOR_NOT_FOUND | ERR_CONSTRUCTION_PERMIT_NOT_FOUND | ERR_OPERATING_PERMIT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /wells, POST /site-evaluations, POST /system-designs, POST /construction-permits, POST /inspections, POST /operating-permits, POST /pumping-records, POST /repair-orders, POST /transfer-inspections"
  - priority: 5
    category: business_constraint
    check: "request body shape is well formed: required fields present, enums in range, numbers within declared bounds, scheduled_end strictly after scheduled_start, valid_until strictly after valid_from, pagination limit within 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 6
    category: auth
    check: "an Applicant acting on a Parcel-scoped resource must satisfy X-User-ID == Parcel.owner_user_id"
    error_id: ERR_NOT_PARCEL_OWNER
    http_status: 403
    applies_to: "POST /parcels/{id}/fee-payments, POST /transfer-inspections"
  - priority: 7
    category: auth
    check: "a Pumper submitting a pumping record must act as a Contractor whose license_class is in {PUMPER, DUAL}; an Installer named on a permit must have license_class in {INSTALLER, DUAL}"
    error_id: ERR_LICENSE_CLASS_MISMATCH
    http_status: 403
    applies_to: "POST /pumping-records, POST /construction-permits"
  - priority: 8
    category: auth
    check: "SEGREGATION OF DUTIES — the EnvironmentalHealthSpecialist recording a PASS on a COVER inspection must not be the same X-User-ID stored in the permit's SystemDesign.review_ehs_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /inspections/{id}/result"
  - priority: 9
    category: state
    check: "optimistic concurrency — the supplied expected_<parent>_version equals the parent's current version"
    error_id: "ERR_STALE_PARCEL_VERSION | ERR_STALE_SITE_EVALUATION_VERSION"
    http_status: 412
    applies_to: "POST /transfer-inspections, POST /system-designs"
  - priority: 10
    category: state
    check: "the target resource is in a state from which this transition is declared in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint"
  - priority: 11
    category: state
    check: "cross-entity state gates: the cited SiteEvaluation is APPROVED for a design submit; the cited SystemDesign is APPROVED for a permit issue; the cited ConstructionPermit is COMPLETED for an operating permit issue; the cited OperatingPermit is ACTIVE for a transfer certification; the named Contractor's effective_status is ACTIVE for an inspection result"
    error_id: "ERR_SITE_EVALUATION_NOT_APPROVED | ERR_DESIGN_NOT_APPROVED | ERR_CONSTRUCTION_NOT_COMPLETED | ERR_OPERATING_PERMIT_NOT_ACTIVE | ERR_CONTRACTOR_NOT_ACTIVE"
    http_status: 409
    applies_to: "POST /system-designs/{id}/submit, POST /construction-permits, POST /operating-permits, POST /transfer-inspections/{id}/certify, POST /inspections/{id}/result"
  - priority: 12
    category: state
    check: "inspection sequencing: a COVER inspection may only be resulted while its permit is UNDER_CONSTRUCTION, a FINAL inspection only while its permit is COVER_PASSED"
    error_id: ERR_INSPECTION_SEQUENCE
    http_status: 409
    applies_to: "POST /inspections/{id}/result"
  - priority: 13
    category: business_safety
    check: "soil suitability — certified_perc_rate_min_per_in must be <= MAX_PERCOLATION_RATE_MIN_PER_IN and depth_to_limiting_layer_in >= MIN_LIMITING_LAYER_DEPTH_IN, and soil_loading_rate_gpd_per_sqft must be non-null"
    error_id: ERR_SOIL_UNSUITABLE
    http_status: 422
    applies_to: "POST /site-evaluations/{id}/review, POST /system-designs/{id}/review"
  - priority: 14
    category: business_safety
    check: "well setback — a permit may not be issued and a design may not be approved while setback_status is VARIANCE_REQUIRED or VARIANCE_DENIED"
    error_id: ERR_SETBACK_VIOLATION
    http_status: 422
    applies_to: "POST /system-designs/{id}/submit, POST /system-designs/{id}/review, POST /construction-permits"
  - priority: 15
    category: business_safety
    check: "water-quality hold — a setback variance may not be granted while the parcel's water_quality_flag is true"
    error_id: ERR_WATER_QUALITY_HOLD
    http_status: 422
    applies_to: "POST /system-designs/{id}/variance-decision"
  - priority: 16
    category: business_temporal
    check: "the cited SiteEvaluation has not lapsed: the logical clock is at or before SiteEvaluation.valid_until"
    error_id: ERR_SITE_EVALUATION_EXPIRED
    http_status: 409
    applies_to: "POST /system-designs/{id}/submit, POST /construction-permits"
  - priority: 17
    category: business_temporal
    check: "the parcel construction window is free — see calculations.parcel_construction_window_overlap (CLOSED interval, no buffer)"
    error_id: ERR_PERMIT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /construction-permits"
  - priority: 18
    category: business_temporal
    check: "the contractor's inspection calendar is free — see calculations.contractor_slot_overlap (HALF-OPEN interval plus a 45-minute trailing travel buffer)"
    error_id: ERR_CONTRACTOR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /inspections, POST /inspections/{id}/reschedule"
  - priority: 19
    category: business_temporal
    check: "the logical clock lies within the permit's CLOSED [valid_from, valid_until] window when scheduling an inspection, and the repair deadline has not lapsed when resolving REPAIRED"
    error_id: "ERR_PERMIT_NOT_IN_WINDOW | ERR_REPAIR_DEADLINE_PASSED"
    http_status: 409
    applies_to: "POST /inspections, POST /repair-orders/{id}/resolve"
  - priority: 20
    category: business_referential
    check: "uniqueness — (apn, county_code) is unique across Parcels; Contractor.license_number is globally unique"
    error_id: "ERR_DUPLICATE_APN | ERR_DUPLICATE_LICENSE_NUMBER"
    http_status: 409
    applies_to: "POST /parcels, POST /contractors"
  - priority: 21
    category: business_referential
    check: "a transfer certificate may not be signed while Parcel.transfer_hold is true"
    error_id: ERR_TRANSFER_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /transfer-inspections/{id}/certify"
  - priority: 22
    category: business_referential
    check: "an operating permit may only be reinstated when the parcel carries no RepairOrder in {ISSUED, EXTENDED}"
    error_id: ERR_OPEN_REPAIR_ORDER
    http_status: 409
    applies_to: "POST /operating-permits/{id}/status"
  - priority: 23
    category: business_constraint
    check: "a site evaluation may not be submitted while perc_holes contains no entry whose valid flag is true"
    error_id: ERR_NO_VALID_PERC_HOLES
    http_status: 422
    applies_to: "POST /site-evaluations/{id}/submit"
  - priority: 24
    category: business_constraint
    check: "FIELD_VERIFIED transfer inspections require both tank_condition and drainfield_condition; DESK_REVIEW must omit both"
    error_id: ERR_FIELD_CONDITIONS_REQUIRED
    http_status: 422
    applies_to: "POST /transfer-inspections"
  - priority: 25
    category: business_constraint
    check: "extension limits — extension_count < MAX_REPAIR_EXTENSIONS and severity != IMMINENT_HAZARD"
    error_id: "ERR_MAX_EXTENSIONS_REACHED | ERR_EXTENSION_NOT_ALLOWED"
    http_status: 422
    applies_to: "POST /repair-orders/{id}/extend"
  - priority: 26
    category: business_fiscal
    check: "aggregate hydraulic capacity — Parcel.permitted_design_flow_gpd + the new design's design_flow_gpd must not exceed Parcel.max_design_flow_gpd"
    error_id: ERR_DESIGN_FLOW_EXCEEDS_PARCEL_CAP
    http_status: 422
    applies_to: "POST /construction-permits"
  - priority: 27
    category: business_fiscal
    check: "the parcel carries no outstanding fee balance (fee_balance_cents == 0) when a transfer certificate is signed"
    error_id: ERR_OUTSTANDING_FEE_BALANCE
    http_status: 402
    applies_to: "POST /transfer-inspections/{id}/certify"

endpoints:
  - method: POST
    path: "/parcels"
    description: "Register a parcel in the on-site wastewater register"
    roles: [Applicant]
    code: 201
    input: ["apn", "county_code", "site_address", "lot_size_sqft", "water_source"]
    output: Parcel
    side_effects:
      - "owner_user_id is set from the X-User-ID header"
      - "max_design_flow_gpd is computed per calculations.parcel_max_design_flow"
      - "all four fee ledger fields start at 0, risk_tier starts LOW, transfer_hold starts false"
  - method: GET
    path: "/parcels"
    description: "List parcels with filters and pagination"
    roles: [Applicant, DesignProfessional, Installer, Pumper, EnvironmentalHealthSpecialist, HealthOfficer, RecordsClerk]
    code: 200
    input: ["county_code?", "risk_tier?", "transfer_hold?", "limit?", "offset?"]
    output: Parcel[]
    side_effects: []
  - method: GET
    path: "/parcels/{id}"
    description: "Read one parcel with its derived ledgers and postures"
    roles: [Applicant, DesignProfessional, Installer, Pumper, EnvironmentalHealthSpecialist, HealthOfficer, RecordsClerk]
    code: 200
    input: []
    output: Parcel
    side_effects: []
  - method: GET
    path: "/parcels/{id}/wells"
    description: "List the wells recorded on a parcel (FK reverse-reachability for Well.parcel_id)"
    roles: [Applicant, DesignProfessional, EnvironmentalHealthSpecialist, HealthOfficer, RecordsClerk]
    code: 200
    input: ["well_type?", "limit?", "offset?"]
    output: Well[]
    side_effects: []
  - method: GET
    path: "/parcels/{id}/site-evaluations"
    description: "List the site evaluations cut on a parcel (FK reverse-reachability for SiteEvaluation.parcel_id)"
    roles: [Applicant, DesignProfessional, EnvironmentalHealthSpecialist, HealthOfficer, RecordsClerk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SiteEvaluation[]
    side_effects: []
  - method: GET
    path: "/parcels/{id}/compliance-dossier"
    description: |
      Computed read: the department's one-page compliance picture for a parcel. Field definitions:
      parcel_id, risk_tier, transfer_hold, fee_balance_cents, permitted_design_flow_gpd,
      max_design_flow_gpd, open_repair_order_count and water_quality_flag are copied from the
      Parcel; well_count = Wells on the parcel; active_operating_permit_count = OperatingPermits on
      the parcel with status ACTIVE; latest_certificate_grade = certificate_grade of the parcel's
      TransferInspection with the greatest certified_at (null when none is CERTIFIED).
    roles: [Applicant, EnvironmentalHealthSpecialist, HealthOfficer, RecordsClerk]
    code: 200
    input: []
    output: "{ parcel_id: string, risk_tier: string, transfer_hold: boolean, fee_balance_cents: integer, permitted_design_flow_gpd: integer, max_design_flow_gpd: integer, open_repair_order_count: integer, water_quality_flag: boolean, well_count: integer, active_operating_permit_count: integer, latest_certificate_grade: string }"
    side_effects: []
  - method: POST
    path: "/parcels/{id}/fee-payments"
    description: "Record a payment against the parcel's permit-fee ledger"
    roles: [Applicant, RecordsClerk]
    code: 200
    input: ["amount_cents"]
    output: Parcel
    side_effects:
      - "fees_paid_cents increases by amount_cents"
      - "fee_balance_cents is re-derived per calculations.parcel_fee_ledger"
      - "increments Parcel.version by 1"
  - method: POST
    path: "/contractors"
    description: "Register a licensed installer and/or pumper"
    roles: [HealthOfficer]
    code: 201
    input: ["business_name", "license_number", "license_class", "license_expires_on", "bond_amount_cents"]
    output: Contractor
    side_effects:
      - "status starts ACTIVE and effective_status is derived per calculations.contractor_effective_status"
  - method: GET
    path: "/contractors/{id}"
    description: "Read one contractor licence record"
    roles: [Applicant, DesignProfessional, Installer, Pumper, EnvironmentalHealthSpecialist, HealthOfficer, RecordsClerk]
    code: 200
    input: []
    output: Contractor
    side_effects: []
  - method: POST
    path: "/contractors/{id}/license-status"
    description: "Suspend, reinstate or revoke a contractor licence"
    roles: [HealthOfficer]
    code: 200
    input: ["action"]
    output: Contractor
    side_effects:
      - "status moves per state_machines.Contractor and effective_status is re-derived"
  - method: POST
    path: "/wells"
    description: "Record a well on a parcel"
    roles: [Applicant, DesignProfessional]
    code: 201
    input: ["parcel_id", "well_type", "location_x_ft", "location_y_ft", "depth_ft"]
    output: Well
    side_effects:
      - "advisory_status starts CLEAR"
      - "every SystemDesign on this parcel whose status is in {DRAFT, UNDER_REVIEW, REVISIONS_REQUIRED, APPROVED} has nearest_well_distance_ft, required_setback_ft and setback_status re-derived from scratch per calculations.well_setback_evaluation, discarding any earlier VARIANCE_GRANTED or VARIANCE_DENIED verdict; PERMITTED and SUPERSEDED designs are left untouched"
  - method: GET
    path: "/wells/{id}"
    description: "Read one well"
    roles: [Applicant, DesignProfessional, EnvironmentalHealthSpecialist, HealthOfficer, RecordsClerk]
    code: 200
    input: []
    output: Well
    side_effects: []
  - method: GET
    path: "/wells/{id}/water-samples"
    description: "List the water samples drawn from a well (FK reverse-reachability for WaterSample.well_id)"
    roles: [Applicant, DesignProfessional, EnvironmentalHealthSpecialist, HealthOfficer, RecordsClerk]
    code: 200
    input: ["result?", "limit?", "offset?"]
    output: WaterSample[]
    side_effects: []
  - method: POST
    path: "/wells/{id}/water-samples"
    description: "Post a laboratory water-quality result for a well"
    roles: [EnvironmentalHealthSpecialist]
    code: 201
    input: ["collected_at", "nitrate_mg_l", "coliform_present"]
    output: WaterSample
    side_effects:
      - "result and exceedance_reasons are computed per calculations.water_sample_result"
      - "Well.last_sample_collected_at is set to collected_at and Well.advisory_status moves per state_machines.Well"
      - "CASCADE: Parcel.water_quality_flag, Parcel.transfer_hold and Parcel.risk_tier, then OperatingPermit.monitoring_required / pumping_interval_months / next_pumping_due_on, then OperatingPermit.compliance_status"
  - method: POST
    path: "/site-evaluations"
    description: "Open a soil/site evaluation on a parcel in DRAFT"
    roles: [DesignProfessional]
    code: 201
    input: ["parcel_id", "evaluated_on", "soil_group", "depth_to_limiting_layer_in"]
    output: SiteEvaluation
    side_effects:
      - "evaluator_user_id is set from X-User-ID; status starts DRAFT; perc_holes starts empty"
      - "valid_until is set to evaluated_on plus SITE_EVAL_VALIDITY_YEARS"
  - method: GET
    path: "/site-evaluations/{id}"
    description: "Read one site evaluation including its perc_holes array and both perc-rate variants"
    roles: [Applicant, DesignProfessional, EnvironmentalHealthSpecialist, HealthOfficer, RecordsClerk]
    code: 200
    input: []
    output: SiteEvaluation
    side_effects: []
  - method: GET
    path: "/site-evaluations/{id}/system-designs"
    description: "List the designs drawn from an evaluation (FK reverse-reachability for SystemDesign.site_evaluation_id)"
    roles: [Applicant, DesignProfessional, EnvironmentalHealthSpecialist, HealthOfficer, RecordsClerk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SystemDesign[]
    side_effects: []
  - method: POST
    path: "/site-evaluations/{id}/perc-holes"
    description: "Append one percolation-hole reading to a DRAFT or REJECTED evaluation"
    roles: [DesignProfessional]
    code: 200
    input: ["hole_number", "drop_inches", "elapsed_minutes", "presoak_ok"]
    output: SiteEvaluation
    side_effects:
      - "the reading is appended to perc_holes with its derived valid flag and rate_min_per_in"
      - "preliminary_perc_rate_min_per_in, certified_perc_rate_min_per_in and soil_loading_rate_gpd_per_sqft are re-derived"
  - method: POST
    path: "/site-evaluations/{id}/submit"
    description: "Submit a DRAFT or REJECTED evaluation for departmental review"
    roles: [DesignProfessional]
    code: 200
    input: []
    output: SiteEvaluation
    side_effects:
      - "status moves to SUBMITTED and revision_round increments by 1"
      - "both perc-rate variants and soil_loading_rate_gpd_per_sqft are re-derived"
  - method: POST
    path: "/site-evaluations/{id}/review"
    description: "Record the department's APPROVE or REJECT decision on a SUBMITTED evaluation"
    roles: [EnvironmentalHealthSpecialist]
    code: 200
    input: ["decision", "review_note?"]
    output: SiteEvaluation
    side_effects:
      - "APPROVE supersedes every other APPROVED evaluation on the parcel, which in turn supersedes designs citing them"
      - "REJECT returns the evaluation to the revision loop"
  - method: POST
    path: "/system-designs"
    description: "Draw a system design from an APPROVED site evaluation (OCC on the evaluation)"
    roles: [DesignProfessional]
    code: 201
    input: ["site_evaluation_id", "expected_site_evaluation_version", "system_type", "bedrooms", "tank_capacity_gal", "drainfield_x_ft", "drainfield_y_ft"]
    output: SystemDesign
    side_effects:
      - "increments SiteEvaluation.version by 1"
      - "design_flow_gpd, required_drainfield_sqft, nearest_well_distance_ft, required_setback_ft and setback_status are computed"
      - "designer_user_id is set from X-User-ID; status starts DRAFT"
  - method: GET
    path: "/system-designs/{id}"
    description: "Read one system design with its computed sizing and setback posture"
    roles: [Applicant, DesignProfessional, EnvironmentalHealthSpecialist, HealthOfficer, RecordsClerk]
    code: 200
    input: []
    output: SystemDesign
    side_effects: []
  - method: POST
    path: "/system-designs/{id}/submit"
    description: "Submit a DRAFT or REVISIONS_REQUIRED design for plan review"
    roles: [DesignProfessional]
    code: 200
    input: []
    output: SystemDesign
    side_effects:
      - "status moves to UNDER_REVIEW and revision_round increments by 1"
      - "all computed sizing and setback fields are re-derived"
  - method: POST
    path: "/system-designs/{id}/review"
    description: "Record the plan reviewer's APPROVE or REQUEST_REVISIONS decision"
    roles: [EnvironmentalHealthSpecialist]
    code: 200
    input: ["decision"]
    output: SystemDesign
    side_effects:
      - "APPROVE stores review_ehs_user_id from X-User-ID (the segregation-of-duties anchor) and supersedes sibling APPROVED designs"
      - "REQUEST_REVISIONS returns the design to the revision loop"
  - method: POST
    path: "/system-designs/{id}/variance-decision"
    description: "Grant or deny a well-setback variance on a design whose setback_status is VARIANCE_REQUIRED"
    roles: [HealthOfficer]
    code: 200
    input: ["decision"]
    output: SystemDesign
    side_effects:
      - "setback_status moves to VARIANCE_GRANTED or VARIANCE_DENIED"
      - "a DENY on an UNDER_REVIEW design also moves status UNDER_REVIEW -> REVISIONS_REQUIRED"
  - method: POST
    path: "/construction-permits"
    description: "Issue a construction permit against an APPROVED design and a licensed installer"
    roles: [HealthOfficer]
    code: 201
    input: ["system_design_id", "contractor_id", "valid_from", "valid_until"]
    output: ConstructionPermit
    side_effects:
      - "parcel_id and design_flow_gpd are snapshotted from the design; permit_number is minted"
      - "fee_cents is computed per calculations.construction_permit_fee"
      - "Parcel.fees_assessed_cents increases by fee_cents and fee_balance_cents is re-derived"
      - "Parcel.permitted_design_flow_gpd is re-derived per calculations.parcel_permitted_flow_ledger"
      - "the cited SystemDesign transitions APPROVED -> PERMITTED"
  - method: GET
    path: "/construction-permits/{id}"
    description: "Read one construction permit"
    roles: [Applicant, DesignProfessional, Installer, EnvironmentalHealthSpecialist, HealthOfficer, RecordsClerk]
    code: 200
    input: []
    output: ConstructionPermit
    side_effects: []
  - method: GET
    path: "/construction-permits"
    description: "List construction permits filtered by parcel, design, contractor or status (FK reverse-reachability for all three ConstructionPermit foreign keys)"
    roles: [Applicant, DesignProfessional, Installer, EnvironmentalHealthSpecialist, HealthOfficer, RecordsClerk]
    code: 200
    input: ["parcel_id?", "system_design_id?", "contractor_id?", "status?", "limit?", "offset?"]
    output: ConstructionPermit[]
    side_effects: []
  - method: POST
    path: "/construction-permits/{id}/void"
    description: "Void a construction permit and compensate both parcel ledgers"
    roles: [HealthOfficer]
    code: 200
    input: ["reason"]
    output: ConstructionPermit
    side_effects:
      - "Parcel.fees_credited_cents increases by this permit's fee_cents and fee_balance_cents is re-derived (money conservation)"
      - "Parcel.permitted_design_flow_gpd is re-derived, releasing this permit's design_flow_gpd (flow conservation)"
      - "the cited SystemDesign transitions PERMITTED -> APPROVED"
      - "SCHEDULED and FAILED inspections on this permit are CANCELLED"
  - method: POST
    path: "/inspections"
    description: "Schedule a COVER, FINAL or COMPLAINT inspection on a construction permit"
    roles: [EnvironmentalHealthSpecialist]
    code: 201
    input: ["construction_permit_id", "inspection_type", "scheduled_start", "scheduled_end"]
    output: Inspection
    side_effects:
      - "contractor_id is snapshotted from the permit and inspector_user_id from X-User-ID"
      - "the contractor calendar is checked per calculations.contractor_slot_overlap"
      - "the parent ConstructionPermit transitions ISSUED -> UNDER_CONSTRUCTION on the first inspection"
  - method: GET
    path: "/inspections/{id}"
    description: "Read one inspection"
    roles: [Applicant, DesignProfessional, Installer, EnvironmentalHealthSpecialist, HealthOfficer, RecordsClerk]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: GET
    path: "/inspections"
    description: "List inspections filtered by permit, contractor or status (FK reverse-reachability for both Inspection foreign keys)"
    roles: [Applicant, DesignProfessional, Installer, EnvironmentalHealthSpecialist, HealthOfficer, RecordsClerk]
    code: 200
    input: ["construction_permit_id?", "contractor_id?", "status?", "inspection_type?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: POST
    path: "/inspections/{id}/result"
    description: "Record a PASS or FAIL verdict on a SCHEDULED inspection"
    roles: [EnvironmentalHealthSpecialist]
    code: 200
    input: ["result", "deficiency_codes?"]
    output: Inspection
    side_effects:
      - "result_recorded_at is set to the logical clock"
      - "PASS on COVER moves the permit UNDER_CONSTRUCTION -> COVER_PASSED and stamps cover_inspection_passed_at"
      - "PASS on FINAL moves the permit COVER_PASSED -> COMPLETED"
      - "FAIL stores deficiency_codes and leaves the permit status unchanged"
  - method: POST
    path: "/inspections/{id}/reschedule"
    description: "Re-book a FAILED inspection into a new contractor window (the re-inspection loop)"
    roles: [EnvironmentalHealthSpecialist]
    code: 200
    input: ["scheduled_start", "scheduled_end"]
    output: Inspection
    side_effects:
      - "status returns FAILED -> SCHEDULED and reinspection_round increments by 1"
      - "result_recorded_at and deficiency_codes are cleared"
      - "the contractor calendar is re-checked per calculations.contractor_slot_overlap"
  - method: POST
    path: "/operating-permits"
    description: "Issue the operating permit that follows a COMPLETED construction permit"
    roles: [HealthOfficer]
    code: 201
    input: ["construction_permit_id", "household_size"]
    output: OperatingPermit
    side_effects:
      - "parcel_id and tank_capacity_gal are snapshotted; issued_on is the logical clock and expires_on is issued_on plus OPERATING_PERMIT_TERM_YEARS"
      - "pumping_interval_months and next_pumping_due_on are computed per calculations.pumping_interval"
      - "compliance_status is derived per calculations.pumping_compliance_status"
  - method: GET
    path: "/operating-permits/{id}"
    description: "Read one operating permit with both parallel state dimensions"
    roles: [Applicant, DesignProfessional, Installer, Pumper, EnvironmentalHealthSpecialist, HealthOfficer, RecordsClerk]
    code: 200
    input: []
    output: OperatingPermit
    side_effects: []
  - method: GET
    path: "/operating-permits"
    description: "List operating permits filtered by parcel, construction permit, status or compliance_status (FK reverse-reachability for both OperatingPermit foreign keys)"
    roles: [Applicant, DesignProfessional, Installer, Pumper, EnvironmentalHealthSpecialist, HealthOfficer, RecordsClerk]
    code: 200
    input: ["parcel_id?", "construction_permit_id?", "status?", "compliance_status?", "limit?", "offset?"]
    output: OperatingPermit[]
    side_effects: []
  - method: POST
    path: "/operating-permits/{id}/status"
    description: "Suspend, reinstate or revoke an operating permit administratively"
    roles: [HealthOfficer]
    code: 200
    input: ["action"]
    output: OperatingPermit
    side_effects:
      - "status moves per state_machines.OperatingPermit (dimension status); compliance_status is untouched"
      - "SUSPEND blocks REQUESTED transfer inspections; REINSTATE unblocks them; REVOKE denies them"
  - method: POST
    path: "/pumping-records"
    description: "File a tank pump-out record against an operating permit"
    roles: [Pumper]
    code: 201
    input: ["operating_permit_id", "pumped_on", "gallons_removed", "sludge_depth_in", "scum_depth_in"]
    output: PumpingRecord
    side_effects:
      - "contractor_id is taken from X-User-ID"
      - "OperatingPermit.last_pumped_on, pumping_interval_months and next_pumping_due_on are re-derived"
      - "OperatingPermit.compliance_status is re-derived and typically returns to COMPLIANT"
      - "Parcel.risk_tier is re-derived"
  - method: GET
    path: "/pumping-records/{id}"
    description: "Read one pumping record"
    roles: [Applicant, Pumper, EnvironmentalHealthSpecialist, HealthOfficer, RecordsClerk]
    code: 200
    input: []
    output: PumpingRecord
    side_effects: []
  - method: GET
    path: "/pumping-records"
    description: "List pumping records filtered by operating permit or pumper (FK reverse-reachability for both PumpingRecord foreign keys)"
    roles: [Applicant, Pumper, EnvironmentalHealthSpecialist, HealthOfficer, RecordsClerk]
    code: 200
    input: ["operating_permit_id?", "contractor_id?", "limit?", "offset?"]
    output: PumpingRecord[]
    side_effects: []
  - method: POST
    path: "/repair-orders"
    description: "Open a failure investigation in DRAFT against an operating permit"
    roles: [EnvironmentalHealthSpecialist]
    code: 201
    input: ["operating_permit_id", "failure_type", "reported_on"]
    output: RepairOrder
    side_effects:
      - "parcel_id is snapshotted from the operating permit; status starts DRAFT; severity and compliance_deadline stay null"
  - method: GET
    path: "/repair-orders/{id}"
    description: "Read one repair order"
    roles: [Applicant, Installer, EnvironmentalHealthSpecialist, HealthOfficer, RecordsClerk]
    code: 200
    input: []
    output: RepairOrder
    side_effects: []
  - method: GET
    path: "/repair-orders"
    description: "List repair orders filtered by parcel, operating permit or status (FK reverse-reachability for both RepairOrder foreign keys)"
    roles: [Applicant, Installer, EnvironmentalHealthSpecialist, HealthOfficer, RecordsClerk]
    code: 200
    input: ["parcel_id?", "operating_permit_id?", "status?", "severity?", "limit?", "offset?"]
    output: RepairOrder[]
    side_effects: []
  - method: POST
    path: "/repair-orders/{id}/issue"
    description: "Issue the repair order, starting the enforcement cascade"
    roles: [HealthOfficer]
    code: 200
    input: []
    output: RepairOrder
    side_effects:
      - "severity and compliance_deadline are computed per calculations.repair_order_severity_and_deadline"
      - "CASCADE: OperatingPermit ACTIVE -> SUSPENDED, then REQUESTED transfer inspections -> BLOCKED"
      - "Parcel.open_repair_order_count, transfer_hold and risk_tier are re-derived"
  - method: POST
    path: "/repair-orders/{id}/extend"
    description: "Grant a deadline extension on an ISSUED or EXTENDED order"
    roles: [HealthOfficer]
    code: 200
    input: []
    output: RepairOrder
    side_effects:
      - "compliance_deadline advances by REPAIR_EXTENSION_DAYS and extension_count increments by 1"
  - method: POST
    path: "/repair-orders/{id}/resolve"
    description: "Close the order as REPAIRED (reinstates the operating permit) or ESCALATE (revokes it)"
    roles: [EnvironmentalHealthSpecialist]
    code: 200
    input: ["outcome"]
    output: RepairOrder
    side_effects:
      - "REPAIRED: OperatingPermit SUSPENDED -> ACTIVE and BLOCKED transfer inspections return to REQUESTED"
      - "ESCALATE: OperatingPermit -> REVOKED and REQUESTED/BLOCKED transfer inspections -> DENIED with grade UNSATISFACTORY"
      - "Parcel.open_repair_order_count, transfer_hold and risk_tier are re-derived on both branches"
  - method: POST
    path: "/transfer-inspections"
    description: "Request a real-estate transfer certificate for a parcel (OCC on the parcel)"
    roles: [Applicant, RecordsClerk]
    code: 201
    input: ["parcel_id", "operating_permit_id", "expected_parcel_version", "requested_on", "buyer_name", "seller_name", "inspection_mode", "expedited?", "tank_condition?", "drainfield_condition?"]
    output: TransferInspection
    side_effects:
      - "increments Parcel.version by 1"
      - "subtotal_cents, expedite_fee_cents and total_due_cents are computed per calculations.transfer_inspection_charges"
      - "status starts REQUESTED, or BLOCKED when the cited operating permit is already SUSPENDED"
  - method: GET
    path: "/transfer-inspections/{id}"
    description: "Read one transfer inspection request or certificate"
    roles: [Applicant, EnvironmentalHealthSpecialist, HealthOfficer, RecordsClerk]
    code: 200
    input: []
    output: TransferInspection
    side_effects: []
  - method: GET
    path: "/transfer-inspections"
    description: "List transfer inspections filtered by parcel, operating permit or status (FK reverse-reachability for both TransferInspection foreign keys)"
    roles: [Applicant, EnvironmentalHealthSpecialist, HealthOfficer, RecordsClerk]
    code: 200
    input: ["parcel_id?", "operating_permit_id?", "status?", "inspection_mode?", "limit?", "offset?"]
    output: TransferInspection[]
    side_effects: []
  - method: POST
    path: "/transfer-inspections/{id}/certify"
    description: "Sign or deny the transfer certificate"
    roles: [EnvironmentalHealthSpecialist]
    code: 200
    input: ["decision"]
    output: TransferInspection
    side_effects:
      - "CERTIFY computes certificate_grade per calculations.transfer_certificate_grade using the variant named by inspection_mode"
      - "CERTIFY stamps certified_at from the logical clock and certificate_valid_until = certified_at + TRANSFER_CERT_VALIDITY_DAYS"
      - "DENY sets certificate_grade to UNSATISFACTORY and leaves both timestamps null"
  - method: GET
    path: "/reports/compliance-summary"
    description: |
      Computed read: department-wide on-site wastewater compliance roll-up, optionally scoped to
      one county via county_code. Field definitions: parcel_count = Parcels in scope;
      active_operating_permit_count = OperatingPermits whose parcel is in scope with status ACTIVE;
      delinquent_permit_count / due_soon_permit_count = OperatingPermits in scope whose
      compliance_status is DELINQUENT / DUE_SOON regardless of status; open_repair_order_count =
      RepairOrders in scope whose status is in {ISSUED, EXTENDED}; high_risk_parcel_count = Parcels
      in scope whose risk_tier is HIGH; total_fee_balance_cents = sum of fee_balance_cents over
      Parcels in scope; advisory_well_count = Wells on Parcels in scope whose advisory_status is in
      {ADVISORY, CONDEMNED}.
    roles: [HealthOfficer, RecordsClerk]
    code: 200
    input: ["county_code?"]
    output: "{ parcel_count: integer, active_operating_permit_count: integer, delinquent_permit_count: integer, due_soon_permit_count: integer, open_repair_order_count: integer, high_risk_parcel_count: integer, total_fee_balance_cents: integer, advisory_well_count: integer }"
    side_effects: []
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-05-01T00:00:00Z; the server never falls back to real wall-clock time. Every deadline, expiry and window rule is evaluated against this logical clock."
    roles: [Applicant, DesignProfessional, Installer, Pumper, EnvironmentalHealthSpecialist, HealthOfficer, RecordsClerk]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: string }"
    side_effects:
      - "every ConstructionPermit in {ISSUED, UNDER_CONSTRUCTION} whose valid_until is strictly before the new clock transitions to EXPIRED, releasing its design flow and cancelling its SCHEDULED inspections"
      - "every OperatingPermit in {ACTIVE, SUSPENDED} whose expires_on is strictly before the new clock transitions to EXPIRED"
      - "every OperatingPermit has compliance_status re-derived per calculations.pumping_compliance_status"
      - "every Parcel has risk_tier re-derived per calculations.parcel_risk_tier"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the seven declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_PARCEL_OWNER
    http: 403
    condition: "an Applicant acts on a parcel-scoped resource whose Parcel.owner_user_id differs from X-User-ID"
  - id: ERR_LICENSE_CLASS_MISMATCH
    http: 403
    condition: "a Pumper files a pumping record without license_class in {PUMPER, DUAL}, or a permit names an installer without license_class in {INSTALLER, DUAL}"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the EnvironmentalHealthSpecialist recording a COVER inspection result is the same user that approved the permit's SystemDesign"
  - id: ERR_PARCEL_NOT_FOUND
    http: 404
    condition: "no Parcel with the given id"
  - id: ERR_WELL_NOT_FOUND
    http: 404
    condition: "no Well with the given id"
  - id: ERR_SITE_EVALUATION_NOT_FOUND
    http: 404
    condition: "no SiteEvaluation with the given id"
  - id: ERR_SYSTEM_DESIGN_NOT_FOUND
    http: 404
    condition: "no SystemDesign with the given id"
  - id: ERR_CONTRACTOR_NOT_FOUND
    http: 404
    condition: "no Contractor with the given id"
  - id: ERR_CONSTRUCTION_PERMIT_NOT_FOUND
    http: 404
    condition: "no ConstructionPermit with the given id"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "no Inspection with the given id"
  - id: ERR_OPERATING_PERMIT_NOT_FOUND
    http: 404
    condition: "no OperatingPermit with the given id"
  - id: ERR_PUMPING_RECORD_NOT_FOUND
    http: 404
    condition: "no PumpingRecord with the given id"
  - id: ERR_REPAIR_ORDER_NOT_FOUND
    http: 404
    condition: "no RepairOrder with the given id"
  - id: ERR_TRANSFER_INSPECTION_NOT_FOUND
    http: 404
    condition: "no TransferInspection with the given id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum member, out-of-range number, non-positive interval, or pagination parameter outside 1..100 / offset < 0"
  - id: ERR_STALE_PARCEL_VERSION
    http: 412
    condition: "expected_parcel_version does not equal the Parcel's current version on POST /transfer-inspections"
  - id: ERR_STALE_SITE_EVALUATION_VERSION
    http: 412
    condition: "expected_site_evaluation_version does not equal the SiteEvaluation's current version on POST /system-designs"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource is not in a state from which the requested transition is declared"
  - id: ERR_SITE_EVALUATION_NOT_APPROVED
    http: 409
    condition: "a design submit cites a SiteEvaluation whose status is not APPROVED"
  - id: ERR_DESIGN_NOT_APPROVED
    http: 409
    condition: "a construction permit cites a SystemDesign whose status is not APPROVED"
  - id: ERR_CONSTRUCTION_NOT_COMPLETED
    http: 409
    condition: "an operating permit cites a ConstructionPermit whose status is not COMPLETED"
  - id: ERR_OPERATING_PERMIT_NOT_ACTIVE
    http: 409
    condition: "a transfer certification or repair-order issue cites an OperatingPermit that is not in the required status"
  - id: ERR_CONTRACTOR_NOT_ACTIVE
    http: 409
    condition: "an inspection result is recorded while the permit's Contractor.effective_status is not ACTIVE"
  - id: ERR_INSPECTION_SEQUENCE
    http: 409
    condition: "a COVER result is recorded on a permit that is not UNDER_CONSTRUCTION, or a FINAL result on a permit that is not COVER_PASSED"
  - id: ERR_SOIL_UNSUITABLE
    http: 422
    condition: "certified perc rate exceeds MAX_PERCOLATION_RATE_MIN_PER_IN, depth to limiting layer is below MIN_LIMITING_LAYER_DEPTH_IN, or the soil loading rate is null"
  - id: ERR_SETBACK_VIOLATION
    http: 422
    condition: "the design's setback_status is VARIANCE_REQUIRED or VARIANCE_DENIED at submit, approval or permit issue"
  - id: ERR_WATER_QUALITY_HOLD
    http: 422
    condition: "a setback variance is requested on a parcel whose water_quality_flag is true"
  - id: ERR_SITE_EVALUATION_EXPIRED
    http: 409
    condition: "the logical clock is strictly after the cited SiteEvaluation.valid_until"
  - id: ERR_PERMIT_WINDOW_CONFLICT
    http: 409
    condition: "the requested [valid_from, valid_until] closed window intersects a live construction permit on the same parcel"
  - id: ERR_CONTRACTOR_SCHEDULE_CONFLICT
    http: 409
    condition: "the requested [scheduled_start, scheduled_end) window plus travel buffer intersects another SCHEDULED inspection on the same contractor"
  - id: ERR_PERMIT_NOT_IN_WINDOW
    http: 409
    condition: "an inspection is scheduled while the logical clock lies outside the permit's closed [valid_from, valid_until] window"
  - id: ERR_REPAIR_DEADLINE_PASSED
    http: 409
    condition: "a repair order is resolved REPAIRED after its compliance_deadline"
  - id: ERR_DUPLICATE_APN
    http: 409
    condition: "a parcel with the same (apn, county_code) pair already exists"
  - id: ERR_DUPLICATE_LICENSE_NUMBER
    http: 409
    condition: "a contractor with the same license_number already exists"
  - id: ERR_TRANSFER_HOLD_ACTIVE
    http: 409
    condition: "a transfer certificate is signed while Parcel.transfer_hold is true"
  - id: ERR_OPEN_REPAIR_ORDER
    http: 409
    condition: "an operating permit is reinstated while the parcel still carries a RepairOrder in {ISSUED, EXTENDED}"
  - id: ERR_NO_VALID_PERC_HOLES
    http: 422
    condition: "a site evaluation is submitted while no perc hole has valid == true"
  - id: ERR_FIELD_CONDITIONS_REQUIRED
    http: 422
    condition: "a FIELD_VERIFIED transfer inspection omits tank_condition or drainfield_condition, or a DESK_REVIEW request supplies either"
  - id: ERR_MAX_EXTENSIONS_REACHED
    http: 422
    condition: "an extension is requested when extension_count already equals MAX_REPAIR_EXTENSIONS"
  - id: ERR_EXTENSION_NOT_ALLOWED
    http: 422
    condition: "an extension is requested on an IMMINENT_HAZARD repair order"
  - id: ERR_DESIGN_FLOW_EXCEEDS_PARCEL_CAP
    http: 422
    condition: "permitted_design_flow_gpd plus the new design's design_flow_gpd would exceed the parcel's max_design_flow_gpd"
  - id: ERR_OUTSTANDING_FEE_BALANCE
    http: 402
    condition: "a transfer certificate is signed while Parcel.fee_balance_cents is non-zero"

roles:
  - name: Applicant
    description: "Property owner or their agent; registers parcels and wells, pays fees, requests transfer certificates"
    identity: "opaque"
    exclusive_operations:
      - "POST /parcels"
    shared_operations:
      - "POST /wells"
      - "POST /parcels/{id}/fee-payments"
      - "POST /transfer-inspections"
      - "all GET reads except /reports/compliance-summary"
      - "POST /_clock/set_current_utc"
  - name: DesignProfessional
    description: "Certified soil evaluator and system designer; cuts site evaluations, logs perc holes, draws and submits designs"
    identity: "opaque"
    exclusive_operations:
      - "POST /site-evaluations"
      - "POST /site-evaluations/{id}/perc-holes"
      - "POST /site-evaluations/{id}/submit"
      - "POST /system-designs"
      - "POST /system-designs/{id}/submit"
    shared_operations:
      - "POST /wells"
      - "most GET reads"
      - "POST /_clock/set_current_utc"
  - name: Installer
    description: "Licensed installation contractor named on a construction permit; acts as a persisted Contractor row"
    identity: "entity_backed:Contractor"
    exclusive_operations: []
    shared_operations:
      - "GET /construction-permits, GET /inspections, GET /repair-orders and the single-resource reads of those collections"
      - "POST /_clock/set_current_utc"
  - name: Pumper
    description: "Licensed septage hauler; files pump-out records against operating permits"
    identity: "entity_backed:Contractor"
    exclusive_operations:
      - "POST /pumping-records"
    shared_operations:
      - "GET /pumping-records, GET /operating-permits"
      - "POST /_clock/set_current_utc"
  - name: EnvironmentalHealthSpecialist
    description: "Field and plan-review staff; reviews evaluations and designs, schedules and results inspections, posts water samples, opens and closes repair orders, signs transfer certificates"
    identity: "opaque"
    exclusive_operations:
      - "POST /site-evaluations/{id}/review"
      - "POST /system-designs/{id}/review"
      - "POST /wells/{id}/water-samples"
      - "POST /inspections"
      - "POST /inspections/{id}/result"
      - "POST /inspections/{id}/reschedule"
      - "POST /repair-orders"
      - "POST /repair-orders/{id}/resolve"
      - "POST /transfer-inspections/{id}/certify"
    shared_operations:
      - "most GET reads"
      - "POST /_clock/set_current_utc"
  - name: HealthOfficer
    description: "Registrar and signing authority; licenses contractors, grants setback variances, issues and voids construction permits, issues operating permits, issues and extends repair orders"
    identity: "opaque"
    exclusive_operations:
      - "POST /contractors"
      - "POST /contractors/{id}/license-status"
      - "POST /system-designs/{id}/variance-decision"
      - "POST /construction-permits"
      - "POST /construction-permits/{id}/void"
      - "POST /operating-permits"
      - "POST /operating-permits/{id}/status"
      - "POST /repair-orders/{id}/issue"
      - "POST /repair-orders/{id}/extend"
    shared_operations:
      - "GET /reports/compliance-summary"
      - "all GET reads"
      - "POST /_clock/set_current_utc"
  - name: RecordsClerk
    description: "Front-counter records staff; takes payments, opens transfer-certificate requests on behalf of walk-ins, runs departmental reports"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /parcels/{id}/fee-payments"
      - "POST /transfer-inspections"
      - "GET /reports/compliance-summary"
      - "all GET reads"
      - "POST /_clock/set_current_utc"

global_constants:
  DEFAULT_LOGICAL_CLOCK_UTC: "2026-05-01T00:00:00Z"
  DATETIME_RENDERING: "Every datetime field in every response - system stamps (created_at, updated_at), server-computed instants (valid_until, next_pumping_due_on, compliance_deadline, certified_at, certificate_valid_until, expires_on, issued_on, result_recorded_at, cover_inspection_passed_at, last_sample_collected_at, last_pumped_on) AND echoed client inputs (evaluated_on, collected_at, valid_from, valid_until, scheduled_start, scheduled_end, pumped_on, reported_on, requested_on, license_expires_on) - is rendered in ISO 8601 UTC with EXACTLY three fractional-second digits and a trailing Z, e.g. 2026-05-01T00:00:00.000Z. A client that submits 2026-05-01T00:00:00Z reads back 2026-05-01T00:00:00.000Z."
  SITE_EVAL_VALIDITY_YEARS: 5
  MIN_LIMITING_LAYER_DEPTH_IN: 18
  OPERATING_PERMIT_TERM_YEARS: 5
  TRANSFER_CERT_VALIDITY_DAYS: 180
