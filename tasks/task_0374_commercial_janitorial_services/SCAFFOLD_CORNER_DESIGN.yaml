# =============================================================================
# §1.9 Scaffold Corner Design (Breadth probe / Test-state-reachability index)
# Task: Commercial Janitorial Services (task_0374)
# Difficulty tier: Expert.
# Breadth enumeration of every testable §1.1–§1.7 claim NOT already exercised by
# §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml). Sections + claim_types are taken
# verbatim from references/claim-extraction-guide.md. Every grounds[] ref
# resolves into SCAFFOLD.yaml §1.1–§1.7. Every numeric assert literal was
# computed against the relevant §1.3 formula + constants. `excluded_because:`
# stubs cite a §1.8 instance by name and carry NO test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_account_returns_201_with_system_defaults
        claim_type: Creation
        grounds:
          - entities.Account
          - entities.Account.fields.status
          - entities.Account.fields.open_complaint_count
          - endpoints.POST_/accounts
        distinguishing_aspect: "POST /accounts with name+billing_email returns 201; status defaults ACTIVE, open_complaint_count 0, version 1 — input cannot set system fields."
        test_recipe:
          setup:
            - "Empty DB; an AccountManager actor."
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id, st: $.data.status, occ: $.data.open_complaint_count, ver: $.data.version }
          assert:
            - "HTTP status == 201"
            - "Account.${acct_id}.status == ACTIVE"
            - "Account.${acct_id}.open_complaint_count == 0"
            - "Account.${acct_id}.version == 1"

      - name: get_account_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - endpoints.GET_/accounts/{accountId}
          - entities.Account.fields.name
        distinguishing_aspect: "GET /accounts/{id} returns the same name/billing_email stored on create; round-trip identity."
        test_recipe:
          setup:
            - "One account created with name=Acme."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
          trigger:
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: AccountManager
              captures: { got_name: $.data.name }
          assert:
            - "HTTP status == 200"
            - "Account.${acct_id}.name == 'Acme'"
            - "Account.${acct_id}.billing_email == 'ap@acme.test'"

      - name: list_accounts_paginated_envelope
        claim_type: Listing
        grounds:
          - endpoints.GET_/accounts
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /accounts?limit=1 returns an array page with total_count and has_more reflecting >1 stored accounts."
        test_recipe:
          setup:
            - "Two accounts created."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "a@acme.test" }
              as: AccountManager
            - call: "POST /accounts"
              payload: { name: "Beta", billing_email: "b@beta.test" }
              as: AccountManager
          trigger:
            - call: "GET /accounts?limit=1&offset=0"
              payload: {}
              as: AccountManager
          assert:
            - "HTTP status == 200; response_type == array"
            - "total_count == 2"
            - "has_more == true"
            - "returned page (data array) contains exactly 1 account"

      - name: get_account_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/accounts/{accountId}
          - errors[ERR_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "GET /accounts/{nonexistent} returns ERR_NOT_FOUND (404), priority-4 existence check."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/acct_does_not_exist"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_site_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/sites
          - entities.Site.fields.cleanable_sqft
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=6]
        distinguishing_aspect: "POST /sites without cleanable_sqft (input field, no default) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "One ACTIVE account."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", floor_type: "CARPET" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_site_omits_quality_target_applies_default_85
        claim_type: Defaults
        grounds:
          - endpoints.POST_/sites
          - entities.Site.fields.quality_target
        distinguishing_aspect: "POST /sites without quality_target applies the default 85."
        test_recipe:
          setup:
            - "One ACTIVE account."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { qt: $.data.quality_target }
          assert:
            - "HTTP status == 201"
            - "Site.quality_target == 85"

      - name: create_crew_omits_shift_capacity_applies_default_480
        claim_type: Defaults
        grounds:
          - endpoints.POST_/crew
          - entities.CrewMember.fields.shift_capacity_min
          - entities.CrewMember.fields.status
        distinguishing_aspect: "POST /crew without shift_capacity_min applies default 480 and status AVAILABLE."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /crew"
              payload: { full_name: "Pat Crew" }
              as: FieldSupervisor
              captures: { cap: $.data.shift_capacity_min, st: $.data.status }
          assert:
            - "HTTP status == 201"
            - "CrewMember.shift_capacity_min == 480"
            - "CrewMember.status == AVAILABLE"

      - name: inspection_deficient_computed_below_target
        claim_type: Computed Fields
        grounds:
          - endpoints.POST_/inspections
          - entities.Inspection.fields.deficient
          - entities.Site.fields.quality_target
        distinguishing_aspect: "Inspection.deficient is computed = score < Site.quality_target; score 80 vs target 85 → deficient true even if a client-supplied deficient flag were sent."
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site (quality_target=85), AVAILABLE crew."
            - "A ROUTINE visit started (IN_PROGRESS)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET", quality_target: 85 }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /crew"
              payload: { full_name: "Pat Crew" }
              as: FieldSupervisor
              captures: { crew_id: $.data.id }
            - call: "POST /visits"
              payload: { site_id: "${site_id}", crew_id: "${crew_id}", service_date: "2026-06-16", planned_start_min: 540, planned_end_min: 600, visit_kind: "ROUTINE" }
              as: FieldSupervisor
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/start"
              payload: {}
              as: FieldSupervisor
          trigger:
            - call: "POST /inspections"
              payload: { visit_id: "${visit_id}", score: 80 }
              as: FieldSupervisor
              captures: { def: $.data.deficient }
          assert:
            - "HTTP status == 201"
            - "Inspection.deficient == true (80 < 85)"

      - name: create_site_bad_floor_type_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - endpoints.POST_/sites
          - entities.Site.fields.floor_type
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=6]
        distinguishing_aspect: "POST /sites with floor_type='MARBLE' (not in CARPET|VCT|TERRAZZO|CONCRETE) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "One ACTIVE account."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "MARBLE" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_site_nonpositive_sqft_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - endpoints.POST_/sites
          - entities.Site.fields.cleanable_sqft
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=6]
        distinguishing_aspect: "POST /sites with cleanable_sqft=0 violates the >0 numeric range and returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "One ACTIVE account."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 0, floor_type: "CARPET" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_schedule_window_end_le_start_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - endpoints.POST_/schedules
          - entities.RecurringSchedule.fields.window_start_min
          - entities.RecurringSchedule.fields.window_end_min
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=6]
        distinguishing_aspect: "POST /schedules with window_end_min <= window_start_min (660 <= 660) violates window_end>window_start → ERR_INVALID_REQUEST (422), distinct from the priority-12 window-conflict check."
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site, AVAILABLE crew."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /crew"
              payload: { full_name: "Pat Crew" }
              as: FieldSupervisor
              captures: { crew_id: $.data.id }
          trigger:
            - call: "POST /schedules"
              payload: { site_id: "${site_id}", weekday: 0, window_start_min: 660, window_end_min: 660, assigned_crew_id: "${crew_id}" }
              as: FieldSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: invoice_line_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.InvoiceLine
          - entities.InvoiceLine.fields.amount_cents
          - state_machines.BillingPeriod.OPEN_to_CLOSED
        distinguishing_aspect: "InvoiceLine has common_fields:false — append-only ledger rows carry id+created_at only, no version/updated_at, and there is no update/delete endpoint (only re-emit on close/reopen)."
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site, ACTIVE contract (base 300000), OPEN period 2026-06, closed once so a BASE InvoiceLine exists."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", monthly_base_cents: 300000, hourly_rate_cents: 6000 }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /billing-periods"
              payload: { contract_id: "${contract_id}", period_month: "2026-06" }
              as: AccountManager
              captures: { period_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: AccountManager
              captures: { ver0: $.data.version }
            - call: "POST /billing-periods/${period_id}/close"
              payload: { expected_account_version: "${ver0}" }
              as: AccountManager
          trigger:
            - call: "GET /billing-periods/${period_id}/invoice-lines"
              payload: {}
              as: AccountManager
              captures: { lines: $.data }
          assert:
            - "HTTP status == 200"
            - "Exactly one InvoiceLine present with line_type BASE, amount_cents 300000"
            - "Each InvoiceLine row carries id and created_at but no version or updated_at field"

      - name: create_site_unknown_account_fk_returns_fk_not_found
        claim_type: Parent Relationships
        grounds:
          - endpoints.POST_/sites
          - entities.Site.fields.account_id
          - errors[ERR_FK_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: "flat topology FK integrity: POST /sites with account_id referencing a non-existent Account returns ERR_FK_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB (no accounts)."
          setup_api_calls: []
          trigger:
            - call: "POST /sites"
              payload: { account_id: "acct_missing", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "data.error_id == ERR_FK_NOT_FOUND"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_visit_from_completed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Visit.SCHEDULED_to_CANCELLED
          - state_machines.Visit.IN_PROGRESS_to_COMPLETED
          - errors[ERR_INVALID_STATE]
          - validations[priority=7]
        distinguishing_aspect: "Visit cancel is defined only from SCHEDULED; cancelling a COMPLETED visit (terminal) returns ERR_INVALID_STATE (409), no side effects."
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site, AVAILABLE crew."
            - "A ROUTINE visit completed (terminal COMPLETED) via one clocked TimeEntry."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /crew"
              payload: { full_name: "Pat Crew" }
              as: FieldSupervisor
              captures: { crew_id: $.data.id }
            - call: "POST /visits"
              payload: { site_id: "${site_id}", crew_id: "${crew_id}", service_date: "2026-06-16", planned_start_min: 540, planned_end_min: 600, visit_kind: "ROUTINE" }
              as: FieldSupervisor
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/start"
              payload: {}
              as: FieldSupervisor
            - call: "POST /time-entries"
              payload: { visit_id: "${visit_id}", crew_id: "${crew_id}", clock_in_min: 540 }
              as: FieldSupervisor
              captures: { te_id: $.data.id }
            - call: "POST /time-entries/${te_id}/clock-out"
              payload: { clock_out_min: 600 }
              as: FieldSupervisor
            - call: "POST /visits/${visit_id}/complete"
              payload: {}
              as: FieldSupervisor
          trigger:
            - call: "POST /visits/${visit_id}/cancel"
              payload: {}
              as: FieldSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "Visit.${visit_id}.status == COMPLETED (unchanged)"

      - name: pause_schedule_idempotent_second_pause_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.RecurringSchedule.ACTIVE_to_PAUSED
          - errors[ERR_INVALID_STATE]
          - validations[priority=7]
        distinguishing_aspect: "Pause is defined only from ACTIVE; pausing an already-PAUSED schedule a second time returns ERR_INVALID_STATE (409) — not idempotent-success."
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site, AVAILABLE crew, one ACTIVE schedule, paused once."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /crew"
              payload: { full_name: "Pat Crew" }
              as: FieldSupervisor
              captures: { crew_id: $.data.id }
            - call: "POST /schedules"
              payload: { site_id: "${site_id}", weekday: 0, window_start_min: 600, window_end_min: 660, assigned_crew_id: "${crew_id}" }
              as: FieldSupervisor
              captures: { sched_id: $.data.id }
            - call: "POST /schedules/${sched_id}/pause"
              payload: {}
              as: FieldSupervisor
          trigger:
            - call: "POST /schedules/${sched_id}/pause"
              payload: {}
              as: FieldSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "RecurringSchedule.${sched_id}.status == PAUSED (unchanged)"

      - name: terminate_contract_with_open_period_returns_period_open
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ServiceContract.ACTIVE_to_TERMINATED
          - errors[ERR_PERIOD_OPEN]
          - entities.BillingPeriod.fields.status
        distinguishing_aspect: "Terminating an ACTIVE contract while one of its BillingPeriods is still OPEN returns ERR_PERIOD_OPEN (409); the contract stays ACTIVE."
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site, an ACTIVE contract with one OPEN BillingPeriod for 2026-06."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", monthly_base_cents: 300000, hourly_rate_cents: 6000 }
              as: AccountManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /billing-periods"
              payload: { contract_id: "${contract_id}", period_month: "2026-06" }
              as: AccountManager
              captures: { period_id: $.data.id }
          trigger:
            - call: "POST /contracts/${contract_id}/terminate"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_PERIOD_OPEN"
            - "ServiceContract.${contract_id}.status == ACTIVE (unchanged)"

      - name: complete_visit_with_open_time_entry_returns_open_time_entry
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Visit.IN_PROGRESS_to_COMPLETED
          - errors[ERR_OPEN_TIME_ENTRY]
          - entities.TimeEntry.fields.status
        distinguishing_aspect: "Completing an IN_PROGRESS visit while a TimeEntry is still OPEN returns ERR_OPEN_TIME_ENTRY (409); visit stays IN_PROGRESS."
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site, AVAILABLE crew."
            - "A ROUTINE visit started, with one OPEN (not clocked-out) TimeEntry."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /crew"
              payload: { full_name: "Pat Crew" }
              as: FieldSupervisor
              captures: { crew_id: $.data.id }
            - call: "POST /visits"
              payload: { site_id: "${site_id}", crew_id: "${crew_id}", service_date: "2026-06-16", planned_start_min: 540, planned_end_min: 600, visit_kind: "ROUTINE" }
              as: FieldSupervisor
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/start"
              payload: {}
              as: FieldSupervisor
            - call: "POST /time-entries"
              payload: { visit_id: "${visit_id}", crew_id: "${crew_id}", clock_in_min: 540 }
              as: FieldSupervisor
              captures: { te_id: $.data.id }
          trigger:
            - call: "POST /visits/${visit_id}/complete"
              payload: {}
              as: FieldSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_OPEN_TIME_ENTRY"
            - "Visit.${visit_id}.status == IN_PROGRESS (unchanged)"

      - name: complete_visit_with_no_completed_time_entry_returns_no_time_entry
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Visit.IN_PROGRESS_to_COMPLETED
          - errors[ERR_NO_TIME_ENTRY]
        distinguishing_aspect: "Completing an IN_PROGRESS visit whose only TimeEntry was VOIDED (no COMPLETED entry, none OPEN) returns ERR_NO_TIME_ENTRY (409) — distinct from ERR_OPEN_TIME_ENTRY."
        test_recipe:
          setup:
            - "ACTIVE account, ACTIVE site, AVAILABLE crew."
            - "A ROUTINE visit started; its single TimeEntry was VOIDED (no COMPLETED entries remain, none OPEN)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "ap@acme.test" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", contact_user_id: "cc-1", label: "HQ", cleanable_sqft: 8000, floor_type: "CARPET" }
