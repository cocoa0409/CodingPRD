          assert:
            - "before the trigger: ImplantLot.${lot_id}.status == AVAILABLE, quantity_reserved == 2, available_quantity == 3; ImplantReservation.${res_id}.status == HELD with line_subtotal_cents == 60000, consignment_credit_cents == 0 (owned lot) and consignment_liability_cents == 60000"
            - "after the trigger: ImplantLot.${lot_id}.status == QUARANTINED, available_quantity == 0, quantity_reserved == 0, quantity_on_hand == 5 (no units were destroyed)"
            - "after the trigger: ImplantReservation.${res_id}.status == RELEASED with restocking_fee_cents == 0 and consignment_liability_cents == 0 - the recall waiver, not the 15% tier"
            - "after the trigger: GET /practices/${prac_id} reports consignment_committed_cents == 0"

      - name: permit_probation_then_back_to_active_cycle
        claim_type: cyclic
        grounds:
          - state_machines[AnesthesiaPermit.status] PROBATION -> ACTIVE
        excluded_because:
          difficulty_instance: non_linear_state_machine / permit_probation_remediation_cycle
          rationale: "The full ACTIVE -> PROBATION -> ACTIVE loop, the never-decremented probation_count and the cleared remediation_deadline_at are asserted by that instance."

      - name: case_scheduling_and_clearance_are_parallel_dimensions
        claim_type: parallel
        grounds:
          - state_machines[SurgicalCase.scheduling_status]
          - state_machines[SurgicalCase.clearance_status]
        excluded_because:
          difficulty_instance: non_linear_state_machine / case_scheduling_and_clearance_dimensions_advance_independently
          rationale: "That instance drives both dimensions on one row and asserts the combined state after each hop."

      - name: privilege_suspension_cascades_down_to_reservations
        claim_type: cascade_down
        grounds:
          - state_machines[AnesthesiaPermit.status] ACTIVE -> SUSPENDED
        excluded_because:
          difficulty_instance: transitive_cascade / critical_inspection_five_hop_suspension_cascade
          rationale: "All five hops (privilege, cases, evaluations, reservations, lot and practice counters) are asserted end-to-end there."

      - name: probation_cascade_is_conditional_on_anesthesia_level
        claim_type: conditional_cascade
        grounds:
          - state_machines[AnesthesiaPermit.status] ACTIVE -> PROBATION
        excluded_because:
          difficulty_instance: transitive_cascade / sentinel_event_three_hop_probation_cascade
          rationale: "That instance asserts that PROBATION defers only DEEP_SEDATION_GENERAL clearances and leaves the other levels alone."

      - name: adverse_event_two_tracks_join_at_closed
        claim_type: branching
        grounds:
          - state_machines[AdverseEvent.status]
        excluded_because:
          difficulty_instance: non_linear_state_machine / adverse_event_fork_join_regulator_track
          rationale: "The independent regulator track and the CLOSED join guard are asserted there."

      - name: confirmation_is_guarded_by_the_practice_privilege_state
        claim_type: guarded_transitions
        grounds:
          - state_machines[SurgicalCase.scheduling_status] BLOCK_HELD -> CONFIRMED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / case_confirmation_depends_on_practice_privilege_state
          rationale: "That instance drives the same transition across three different privilege states of the parent practice."

      - name: cancellation_compensates_the_block_minute_ledger
        claim_type: compensation
        grounds:
          - state_machines[SurgicalCase.scheduling_status] CONFIRMED -> CANCELLED
        excluded_because:
          difficulty_instance: compensating_invariant / block_minute_conservation_on_cancel
          rationale: "The before/after minute reconciliation and the released-vs-open distinction are asserted there."

  # ==========================================================================
  - section: calculations
    instances:
      - name: inspection_score_of_exactly_seventy_passes
        claim_type: threshold
        grounds:
          - calculations.inspection_score
          - state_machines[FacilityInspection.status]
        distinguishing_aspect: "PASSING_SCORE is compared with >=, so 100 - 2(1) - 7(4) == 70 must PASS while 100 - 7(5) == 65 must FAIL_CORRECTABLE. The pair is run on one permit so the failure hop back to APPLIED is observable before the boundary hop."
        test_recipe:
          setup:
            - "one MINIMAL_SEDATION permit, no drills logged at all"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Score OMS", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /anesthesia-permits"
              payload: { practice_id: "${prac_id}", permit_level: "MINIMAL_SEDATION", applied_on: "2026-09-01T00:00:00Z" }
              as: PracticeAdministrator
              captures: { perm_id: $.data.id }
          trigger:
            - call: "POST /facility-inspections"
              payload: { permit_id: "${perm_id}", scheduled_for: "2026-09-02T09:00:00Z" }
              as: PracticeAdministrator
              captures: { insp1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /facility-inspections/${insp1}/result"
              payload: { minor_deficiency_count: 0, major_deficiency_count: 5, critical_deficiency_count: 0 }
              as: PracticeAdministrator
            - call: "POST /facility-inspections"
              payload: { permit_id: "${perm_id}", scheduled_for: "2026-09-10T09:00:00Z" }
              as: PracticeAdministrator
              captures: { insp2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /facility-inspections/${insp2}/result"
              payload: { minor_deficiency_count: 1, major_deficiency_count: 4, critical_deficiency_count: 0 }
              as: PracticeAdministrator
          assert:
            - "after trigger[2]: FacilityInspection.${insp1}.inspection_score == 65 with status == FAILED_CORRECTABLE, and AnesthesiaPermit.${perm_id}.status is back to APPLIED"
            - "after trigger[5]: FacilityInspection.${insp2}.inspection_score == 70 exactly (100 - 2 - 28) with status == PASSED"
            - "after trigger[5]: the permit leaves INSPECTION_PENDING for PROBATION, not ACTIVE, because drill_compliance_ratio == 0.00 is below the 0.75 floor even though the score passed"
            - "issued_at is still null on the permit (only the ACTIVE hop stamps it)"

      - name: dental_only_patient_route_prices_at_creation
        claim_type: correct_result
        grounds:
          - calculations.benefit_route
          - calculations.benefit_allocation
          - endpoints["POST /benefit-determinations"]
        distinguishing_aspect: "A dental-only patient yields route DENTAL_PRIMARY with primary_payer DENTAL, and pricing happens at creation (not only at submit): 50% of the 90000 line is allowed, medical stays 0 because no medical plan is active, and the snapshot pins the patient's default 150000 annual remainder."
        test_recipe:
          setup:
            - "patient with dental_plan_active true, medical_plan_active omitted (defaults to false)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Route OMS", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Dental", date_of_birth: "1980-03-15T00:00:00Z", asa_class: 2, airway_class: 2, weight_kg: 80, dental_plan_active: true }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_id}", primary_surgeon_id: "${surg_id}", planned_anesthesia_level: "LOCAL_ONLY", procedure_category: "IMPLANT", planned_start: "2026-09-20T13:00:00Z", planned_end: "2026-09-20T14:00:00Z", total_charge_cents: 90000 }
              as: SchedulingCoordinator
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /benefit-determinations"
              payload: { case_id: "${case_id}", service_lines: [{ code: "D6010", charge_cents: 90000, benefit_class: "DENTAL" }] }
              as: BenefitsSpecialist
              captures: { det_id: $.data.id }
          assert:
            - "HTTP 201 with data.route == DENTAL_PRIMARY, data.primary_payer == DENTAL, data.status == DRAFT, data.submission_count == 0"
            - "data.dental_annual_remaining_snapshot_cents == 150000 (the patient default, copied at creation)"
            - "data.dental_allowed_cents == 45000 (90000 * 0.50), data.medical_allowed_cents == 0, data.patient_responsibility_cents == 45000"
            - "45000 + 0 + 45000 == SurgicalCase.total_charge_cents (90000): the money identity holds from creation"
            - "Patient.${pat_id}.dental_annual_remaining_cents is still 150000 - only an APPROVED payer response decrements it"

      - name: self_pay_route_allows_nothing_to_either_plan
        claim_type: threshold
        grounds:
          - calculations.benefit_route
          - calculations.benefit_allocation
        distinguishing_aspect: "With both coverage flags false the route falls through every branch to SELF_PAY, primary_payer is null (the only route where it is), both allowances short-circuit to 0 and the whole charge lands on the patient - the categorical boundary of the route ladder."
