  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: fine_schedule_half_open_adjacency
        grounds:
          - calculations.citation_fine_lookup
          - entities.FineSchedule.fields.effective_from
          - entities.FineSchedule.fields.effective_to
          - errors[ERR_SCHEDULE_OVERLAP]
        distinguishing_aspect: |
          Interval semantics = half-open [effective_from, effective_to): row R2
          whose effective_from == R1.effective_to is ADJACENT and legal (no
          overlap, no gap), while an R2 starting one second BEFORE R1.effective_to
          is rejected ERR_SCHEDULE_OVERLAP; a citation assessed exactly AT the
          shared boundary resolves to R2's amount, not R1's.
        test_recipe:
          setup:
            - "Association A; member MB; FineSchedule row S1: INACCURACY 30000c [2026-01-01, 2026-10-01)"
          setup_api_calls:
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations"
              payload: { association_code: "TO1", name: "Overlap Assoc", membership_dues_cents: 120000, late_fee_tier1_cents: 5000, late_fee_tier2_cents: 15000 }
              as: AssociationStaff
              captures: { assoc_id: $.data.id, assoc_v0: $.data.version }
            - call: "POST /mls/associations/${assoc_id}/members"
              payload: { member_nr: "MB", full_name: "Broker" }
              as: AssociationStaff
              captures: { mb_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/fine-schedules"
              payload: { rule_code: "INACCURACY", fine_amount_cents: 30000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z" }
              as: AssociationStaff
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /mls/associations/${assoc_id}/fine-schedules"
              payload: { rule_code: "INACCURACY", fine_amount_cents: 45000, effective_from: "2026-10-01T00:00:00Z" }
              as: AssociationStaff
              captures: { s2_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/fine-schedules"
              payload: { rule_code: "INACCURACY", fine_amount_cents: 99000, effective_from: "2026-09-30T23:59:59Z" }
              as: AssociationStaff
              captures: { overlap_err: $.data.error_id }
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc_id}/citations"
              payload: { member_id: "${mb_id}", rule_code: "INACCURACY" }
              as: AssociationStaff
              captures: { cit_fine: $.data.fine_amount_cents }
          assert:
            - "Adjacent row creation succeeds (S2 id non-null; effective_from == S1.effective_to is legal under half-open semantics)"
            - "Overlap attempt rejected error_id == ERR_SCHEDULE_OVERLAP"
            - "Citation assessed exactly at the boundary 2026-10-01T00:00:00Z has fine_amount_cents == 45000 (belongs to S2, not S1)"
      - name: consolidated_association_mutation_freeze_window
        grounds:
          - state_machines.ConsolidationEvent.SCHEDULED_to_EXECUTED
          - state_machines.Association.MERGING_to_MERGED
          - errors[ERR_ASSOCIATION_MERGED]
          - errors[ERR_CONSOLIDATION_NOT_DUE]
        distinguishing_aspect: |
          Interval semantics = scheduled-freeze window (different from half-open
          overlap): between scheduling and effective_at the absorbed association
          is MERGING (new consolidation events rejected) yet member-facing
          mutations still succeed; at effective_at it flips MERGED and ALL
          mutations freeze; executing one instant BEFORE effective_at is rejected
          ERR_CONSOLIDATION_NOT_DUE — an instant-boundary window on the
          Association resource, not row-vs-row interval arithmetic.
        test_recipe:
          setup:
            - "Survivor AS; absorbed AA; consolidation CE on AS absorbing AA effective 2026-10-01T00:00:00Z; member MX in AA; clock at 2026-09-30T23:59:59Z"
          setup_api_calls:
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations"
              payload: { association_code: "AS1", name: "Survivor", membership_dues_cents: 120000, late_fee_tier1_cents: 5000, late_fee_tier2_cents: 15000 }
              as: AssociationStaff
              captures: { survivor_id: $.data.id }
            - call: "POST /mls/associations"
              payload: { association_code: "AA1", name: "Absorbed", membership_dues_cents: 90000, late_fee_tier1_cents: 4000, late_fee_tier2_cents: 12000 }
              as: AssociationStaff
              captures: { absorbed_id: $.data.id }
            - call: "POST /mls/associations/${absorbed_id}/members"
              payload: { member_nr: "MX", full_name: "Member X" }
              as: AssociationStaff
              captures: { mx_id: $.data.id }
            - call: "POST /mls/associations/${survivor_id}/consolidations"
              payload: { absorbed_association_id: "${absorbed_id}", effective_at: "2026-10-01T00:00:00Z" }
              as: AssociationStaff
              captures: { ce_id: $.data.id }
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T23:59:59Z" }
              as: AssociationStaff
          trigger:
            - call: "POST /mls/associations/${survivor_id}/consolidations/${ce_id}/execute"
              payload: {}
              as: AssociationStaff
              captures: { early_err: $.data.error_id }
            - call: "POST /mls/associations/${absorbed_id}/members"
              payload: { member_nr: "MY", full_name: "Member Y" }
              as: AssociationStaff
              captures: { my_id: $.data.id }
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations/${survivor_id}/consolidations/${ce_id}/execute"
              payload: {}
              as: AssociationStaff
            - call: "POST /mls/associations/${absorbed_id}/members"
              payload: { member_nr: "MZ", full_name: "Member Z" }
              as: AssociationStaff
              captures: { merged_err: $.data.error_id }
            - call: "GET /mls/associations/${absorbed_id}/members/${mx_id}"
              payload: {}
              as: AssociationStaff
              captures: { mx_assoc: $.data.association_id }
          assert:
            - "Early execute rejected error_id == ERR_CONSOLIDATION_NOT_DUE (one second before effective_at)"
            - "Member create under MERGING absorbed association SUCCEEDS (my_id non-null — freeze begins at effective_at, not at scheduling)"
            - "Execute at exactly effective_at succeeds; Association.${absorbed_id}.consolidation_state == MERGED, consolidated_into_id == ${survivor_id}"
            - "Member create under MERGED association rejected error_id == ERR_ASSOCIATION_MERGED"
            - "Member.${mx_id}.association_id == ${survivor_id} after execution (re-pointed)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: citation_pay_then_waive_via_overturn_conserves_credit_balance
        grounds:
          - state_machines.Citation.OPEN_to_PAID
          - state_machines.Citation.HEARING_PENDING_to_WAIVED
          - entities.Member.fields.sanction_credit_balance_cents
        distinguishing_aspect: |
          Conserved quantity: member credit balance. Two citations of identical
          fine; C1 paid directly (balance += fine), C2 heard and OVERTURNED
          (balance unchanged). The forward action (issue + hearing) paired with
          its compensating outcome (overturn) leaves the balance exactly as if
          the citation never existed: total credits == C1.fine only, no drift
          from the C2 cycle.
        test_recipe:
          setup:
            - "Association A; broker MB; member MV; panel pool P1, P2 (MV excluded as subject; MB broker eligible); office O; listing L ACTIVE; FineSchedule INACCURACY 30000c from 2026-01-01"
            - "C1 issued and paid (balance 30000); C2 issued, hearing requested, panel convened and hearing held"
          setup_api_calls:
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations"
              payload: { association_code: "CI1", name: "Conserve Assoc", membership_dues_cents: 120000, late_fee_tier1_cents: 5000, late_fee_tier2_cents: 15000, sanction_credit_cap_cents: 200000 }
              as: AssociationStaff
              captures: { assoc_id: $.data.id, assoc_v0: $.data.version }
            - call: "POST /mls/associations/${assoc_id}/members"
              payload: { member_nr: "MB", full_name: "Broker" }
              as: AssociationStaff
              captures: { mb_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/members"
              payload: { member_nr: "MV", full_name: "Violator" }
              as: AssociationStaff
              captures: { mv_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/members"
              payload: { member_nr: "P1", full_name: "Panel One" }
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc_id}/members"
              payload: { member_nr: "P2", full_name: "Panel Two" }
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc_id}/fine-schedules"
              payload: { rule_code: "INACCURACY", fine_amount_cents: 30000, effective_from: "2026-01-01T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc_id}/offices"
              payload: { office_code: "O1", broker_member_id: "${mb_id}" }
              as: AssociationStaff
              captures: { office_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/policy-revisions"
              payload: { revision_code: "R1", effective_at: "2026-09-01T00:00:00Z", comp_display_mode: "COMP_DISPLAY_ON", expected_association_version: "${assoc_v0}" }
              as: AssociationStaff
            - call: "POST /mls/_clock/advance_day"
              payload: { days: 1 }
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings"
              payload: { listing_member_id: "${mb_id}", mls_number: "MLS-CI1", property_address: "6 Ledger Ln", list_price_cents: 26000000 }
              as: Member
              as_user_id: "${mb_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings/${listing_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${mb_id}"
            - call: "POST /mls/associations/${assoc_id}/citations"
              payload: { member_id: "${mv_id}", rule_code: "INACCURACY" }
              as: AssociationStaff
              captures: { c1_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/citations/${c1_id}/pay"
              payload: { tender_cents: 30000 }
              as: Member
              as_user_id: "${mv_id}"
            - call: "POST /mls/associations/${assoc_id}/citations"
              payload: { member_id: "${mv_id}", rule_code: "INACCURACY" }
              as: AssociationStaff
              captures: { c2_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/citations/${c2_id}/request-hearing"
              payload: {}
              as: Member
              as_user_id: "${mv_id}"
            - call: "POST /mls/associations/${assoc_id}/hearing-panels"
              payload: { case_type: "CITATION", case_id: "${c2_id}" }
              as: AssociationStaff
              captures: { panel_id: $.data.id, panelist_1: "$.data.selected_member_ids[0]", panelist_2: "$.data.selected_member_ids[1]" }
            - call: "POST /mls/associations/${assoc_id}/hearing-panels/${panel_id}/hold-hearing"
              payload: {}
              as: HearingPanelist
              as_user_id: "${panelist_1}"
          trigger:
            - call: "POST /mls/associations/${assoc_id}/hearing-panels/${panel_id}/rule"
              payload: { decision: "OVERTURN" }
              as: HearingPanelist
              as_user_id: "${panelist_2}"
            - call: "GET /mls/associations/${assoc_id}/members/${mv_id}"
              payload: {}
              as: AssociationStaff
          assert:
            - "Citation.${c2_id}.status == WAIVED"
            - "Member.${mv_id}.sanction_credit_balance_cents == 30000 (invariant: hearing+overturn cycle adds exactly 0; only C1's paid fine persists)"
            - "Member.${mv_id}.strikes_12m == 1 (only the PAID citation counts; WAIVED adds no strike)"
      - name: consolidation_execute_then_recognition_conserves_invoice_total
        grounds:
          - state_machines.ConsolidationEvent.SCHEDULED_to_EXECUTED
          - calculations.dues_invoice_amounts.variants.consolidated_member_variant
          - entities.DuesInvoice.fields.amount_due_cents
        distinguishing_aspect: |
          Conserved quantity: per-member annual dues liability (different quantity
          from credits). A member of the absorbed association with a PENDING
          invoice for year Y survives consolidation with the invoice intact; the
          survivor's bill run for the SAME year SKIPS that member — sum of the
          member's year-Y invoices before and after the survivor's bill ==
          exactly one invoice, no double-billing drift from the forward
          (consolidate) + compensating (skip) action pair.
        test_recipe:
          setup:
            - "Survivor AS (dues 120000c); absorbed AA (dues 90000c); member MX in AA"
            - "AA period PY (year 2027, amount 90000c) billed at 2027-01-10 -> MX invoice 90000c PENDING"
            - "Consolidation executed 2027-02-01; AS period SY (year 2027, amount 120000c) billed at 2027-02-02"
          setup_api_calls:
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations"
              payload: { association_code: "AS2", name: "Survivor Two", membership_dues_cents: 120000, late_fee_tier1_cents: 5000, late_fee_tier2_cents: 15000 }
              as: AssociationStaff
              captures: { survivor_id: $.data.id }
            - call: "POST /mls/associations"
              payload: { association_code: "AA2", name: "Absorbed Two", membership_dues_cents: 90000, late_fee_tier1_cents: 4000, late_fee_tier2_cents: 12000 }
              as: AssociationStaff
              captures: { absorbed_id: $.data.id }
            - call: "POST /mls/associations/${absorbed_id}/members"
              payload: { member_nr: "MX", full_name: "Member X" }
              as: AssociationStaff
              captures: { mx_id: $.data.id }
            - call: "POST /mls/associations/${survivor_id}/consolidations"
              payload: { absorbed_association_id: "${absorbed_id}", effective_at: "2027-02-01T00:00:00Z" }
              as: AssociationStaff
              captures: { ce_id: $.data.id }
            - call: "POST /mls/associations/${absorbed_id}/dues-periods"
              payload: { year: 2027, period_start_date: "2026-12-01T00:00:00Z", due_date: "2027-01-31T00:00:00Z", grace_end_date: "2027-03-02T00:00:00Z", amount_cents: 90000 }
              as: AssociationStaff
              captures: { a_period: $.data.id, a_period_v: $.data.version }
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-10T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations/${absorbed_id}/dues-periods/${a_period}/bill"
              payload: { expected_dues_period_version: "${a_period_v}" }
              as: AssociationStaff
            - call: "POST /mls/associations/${survivor_id}/dues-periods"
              payload: { year: 2027, period_start_date: "2026-12-01T00:00:00Z", due_date: "2027-02-28T00:00:00Z", grace_end_date: "2027-03-30T00:00:00Z", amount_cents: 120000 }
              as: AssociationStaff
              captures: { s_period: $.data.id, s_period_v: $.data.version }
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations/${survivor_id}/consolidations/${ce_id}/execute"
              payload: {}
              as: AssociationStaff
          trigger:
            - call: "POST /mls/associations/${survivor_id}/dues-periods/${s_period}/bill"
              payload: { expected_dues_period_version: "${s_period_v}" }
              as: AssociationStaff
            - call: "GET /mls/dues-invoices?member_id=${mx_id}"
              payload: {}
              as: AssociationStaff
          assert:
            - "MX has exactly ONE DuesInvoice (absorbed association's 90000c invoice; survivor bill skipped MX per consolidated_member_variant)"
            - "Sum of MX year-2027 invoice amount_due_cents == 90000 (invariant: exactly one annual liability, no double-billing)"
            - "Survivor bill created 0 invoices for re-pointed members with a prior same-year invoice"
