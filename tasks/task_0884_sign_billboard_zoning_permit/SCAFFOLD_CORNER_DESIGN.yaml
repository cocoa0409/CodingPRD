        claim_type: Violation to Error
        grounds: ["validations[priority=2]", "errors[ERR_UNAUTHORIZED]", "roles.Planner"]
        distinguishing_aspect: "An Applicant calling the Planner-only POST /parcels is rejected with ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["An applicant exists to act as."]
          setup_api_calls:
            - call: "POST /applicants"
              payload: { name: "Sneaky Signs", contact_email: "sn@x.com" }
              as: Planner
              as_user_id: "planner-1"
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /parcels"
              payload: { zoning_district: "COMMERCIAL", max_sign_area_sqft: 200, max_height_ft: 50, min_setback_ft: 10, allowed_illumination: "EXTERNAL", max_signs: 5 }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"

      - name: applicant_cannot_decide_variance_unauthorized
        claim_type: Violation to Error
        grounds: ["validations[priority=2]", "errors[ERR_UNAUTHORIZED]", "roles.ZoningBoard"]
        distinguishing_aspect: "Only ZoningBoard may POST /variances/{id}/decide; an Applicant attempt returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A variance under review."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { zoning_district: "COMMERCIAL", max_sign_area_sqft: 100, max_height_ft: 50, min_setback_ft: 10, allowed_illumination: "EXTERNAL", max_signs: 3 }
              as: Planner
              as_user_id: "planner-1"
              captures: { parcel_id: $.data.id }
            - call: "POST /applicants"
              payload: { name: "Board Signs", contact_email: "bd@x.com" }
              as: Planner
              as_user_id: "planner-1"
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { parcel_id: "${parcel_id}", applicant_id: "${applicant_id}", sign_type: "MONUMENT", requested_area_sqft: 150, requested_height_ft: 20, requested_setback_ft: 15, requested_illumination: "EXTERNAL" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { application_id: $.data.id }
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /variances"
              payload: { application_id: "${application_id}", kind: "AREA", requested_value: 150, justification: "hardship" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { variance_id: $.data.id }
            - call: "POST /variances/${variance_id}/recommend"
              payload: { recommendation: "RECOMMEND_APPROVE" }
              as: Planner
              as_user_id: "planner-1"
          trigger:
            - call: "POST /variances/${variance_id}/decide"
              payload: { decision: "GRANT", granted_value: 100 }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_application_version_on_permit_issue
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[permit-issue-stale-application]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Issuing a permit with expected_application_version one behind the current application.version returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["An APPROVED application; the client holds a stale (pre-approval) version number."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { zoning_district: "COMMERCIAL", max_sign_area_sqft: 200, max_height_ft: 50, min_setback_ft: 10, allowed_illumination: "EXTERNAL", max_signs: 5 }
              as: Planner
              as_user_id: "planner-1"
              captures: { parcel_id: $.data.id }
            - call: "POST /applicants"
              payload: { name: "OCC Signs", contact_email: "oc@x.com" }
              as: Planner
              as_user_id: "planner-1"
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { parcel_id: "${parcel_id}", applicant_id: "${applicant_id}", sign_type: "WALL", requested_area_sqft: 40, requested_height_ft: 20, requested_setback_ft: 15, requested_illumination: "NONE" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { application_id: $.data.id }
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${application_id}/review"
              payload: { review_type: "DIMENSIONAL", outcome: "PASS" }
              as: Planner
              as_user_id: "planner-1"
            - call: "POST /applications/${application_id}/review"
              payload: { review_type: "OVERLAY", outcome: "CLEARED" }
              as: Planner
              as_user_id: "planner-1"
            - call: "POST /applications/${application_id}/decide"
              payload: { decision: "APPROVE" }
              as: Planner
              as_user_id: "planner-1"
              captures: { app_ver: $.data.version }
          trigger:
            - call: "POST /permits"
              payload: { application_id: "${application_id}", expected_application_version: "${app_ver} - 1" }
              as: Planner
              as_user_id: "planner-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"

      - name: occ_stale_billboard_version_on_lease_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[lease-create-stale-billboard]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Creating a second lease with a billboard version captured before the first lease bumped it returns ERR_STALE_VERSION (412), even though the interval is free."
        test_recipe:
          setup: ["A registered billboard; a first lease has already advanced billboard.version; client reuses the pre-first-lease version."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { zoning_district: "COMMERCIAL", max_sign_area_sqft: 200, max_height_ft: 60, min_setback_ft: 10, allowed_illumination: "EXTERNAL", max_signs: 3 }
              as: Planner
              as_user_id: "planner-1"
              captures: { parcel_id: $.data.id }
            - call: "POST /applicants"
              payload: { name: "OCC Media", contact_email: "ocm@x.com" }
              as: Planner
              as_user_id: "planner-1"
              captures: { operator_id: $.data.id }
            - call: "POST /billboards"
              payload: { parcel_id: "${parcel_id}", operator_id: "${operator_id}", face_count: 1, is_digital: false, structure_height_ft: 40 }
              as: Applicant
              as_user_id: "${operator_id}"
              captures: { billboard_id: $.data.id }
            - call: "POST /billboards/${billboard_id}/register"
              payload: { amount_cents: 3333 }
              as: Applicant
              as_user_id: "${operator_id}"
              captures: { bb_ver: $.data.version }
            - call: "POST /billboard-leases"
              payload: { billboard_id: "${billboard_id}", lessee_name: "Buyer One", start_date: "2026-06-01T00:00:00Z", end_date: "2026-07-01T00:00:00Z", expected_billboard_version: "${bb_ver}" }
              as: Applicant
              as_user_id: "${operator_id}"
              captures: { lease_a: $.data.id }
          trigger:
            - call: "POST /billboard-leases"
              payload: { billboard_id: "${billboard_id}", lessee_name: "Buyer Two", start_date: "2026-08-01T00:00:00Z", end_date: "2026-09-01T00:00:00Z", expected_billboard_version: "${bb_ver}" }
              as: Applicant
              as_user_id: "${operator_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"

      - name: cascade_escalation_depth3_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: ["state_machines.Violation.OPEN_to_ESCALATED"]
        excluded_because:
          difficulty_instance: transitive_cascade / escalation_removal_revoke_cancel_depth3
          rationale: "Depth-3 escalate cascade asserted in the named §1.8 instance."

      - name: cascade_lapse_depth2_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: ["state_machines.Billboard.REGISTERED_to_LAPSED"]
        excluded_because:
          difficulty_instance: transitive_cascade / registration_lapse_lease_suspend_depth2
          rationale: "Depth-2 lapse->suspend cascade asserted in the named §1.8 instance."

