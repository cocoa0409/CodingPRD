            - "eligible 999999 -> provisional_amount_cents == 20000 (tier 0.02; round_half_up(19999.98, 0))"
      - name: reorder_suggestion_deducts_pipeline
        claim_type: correct_result
        grounds: [calculations.reorder_suggestion]
        distinguishing_aspect: "Open pipeline (PLACED order remainder) is deducted before ceiling to order_multiple: max(0, 100-20-30)=50, rounded up to multiple 6 -> 54."
        test_recipe:
          setup: ["Facility F; ACTIVE agreement (lum false); product PX order_multiple 6, case 1, price 10; program position {PX, par 100, reorder 25, on_hand 20}; PLACED order for 30 units of PX"]
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac RS", health_system_name: "HS RS", facility_type: "ACUTE_CARE", ship_to_address: "34 Vine St" }
              as: SupplyChainAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "RS-1", name: "Reorder item", brand_type: "BRANDED", category: "WOUND_CARE", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 10, order_multiple: 6 }
              as: SupplyChainAdmin
              captures: { px_id: $.data.id }
            - call: "POST /supply/prime-vendor-agreements"
              payload: { facility_id: "${fac_id}", committed_fill_rate_pct: 90.0, deliveries_per_week: 3, lum_commitment: false, annual_commitment_cents: 100000000, start_date: "2026-08-01", end_date: "2027-08-31" }
              as: SupplyChainAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /supply/inventory-programs"
              payload: { facility_id: "${fac_id}", program_type: "STOCKROOM_MANAGED", positions: [ { product_id: "${px_id}", par_level: 100, reorder_point: 25, on_hand: 20 } ] }
              as: SupplyChainAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /supply/distribution-orders"
              payload: { agreement_id: "${agr_id}", requested_delivery_date: "2026-09-15", lines: [ { product_id: "${px_id}", ordered_qty: 30 } ] }
              as: FacilitySupplyDirector
              as_user_id: "${fac_id}"
          trigger:
            - call: "GET /supply/inventory-programs/${prog_id}"
              payload: {}
              as: SupplyChainAdmin
              captures: { sug: "$.data.positions[0].suggested_order_qty", rst: "$.data.positions[0].reorder_status" }
          assert:
            - "positions[0].reorder_status == DUE (20 <= 25)"
            - "positions[0].suggested_order_qty == 54 (raw need 80 minus pipeline 30 = 50, ceiling to multiple of 6)"
      - name: rolling_input_set_excludes_unreceived
        claim_type: input_set_filtering
        grounds: [calculations.rolling_agreement_fill_rate]
        distinguishing_aspect: "Only RECEIVED orders feed the rolling rate: a SHIPPED-but-unreceived order leaves rolling_fill_rate_pct and spent_cents untouched."
        test_recipe:
          setup: ["Facility F; product P1 price 100; agreement committed 90.0; O1 (x100) fully shipped+received (rolling 100.00, spent 10000); O2 (x100) placed and shipped 50"]
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac RU", health_system_name: "HS RU", facility_type: "ACUTE_CARE", ship_to_address: "35 Vine St" }
