          assert:
            - "error_id == ERR_ASSESSMENT_NOT_USABLE (422)"

      - name: assessment_expired_when_referenced_by_quote_create
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_ASSESSMENT_EXPIRED]", state_machines.SiteAssessment.SUBMITTED_to_EXPIRED]
        distinguishing_aspect: "Assessment submitted at clock 2026-08-01 is referenced by quote create at 2026-09-05 (> 30 days): flips to EXPIRED and the create fails ERR_ASSESSMENT_EXPIRED."
        test_recipe:
          setup: ["SUBMITTED assessment; clock advanced to 2026-09-05"]
          setup_api_calls:
