            - { call: "POST /compliance/employees", payload: { employee_no: "E-E2", full_name: "Eff Two", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { e2: "$.data.id" } }
