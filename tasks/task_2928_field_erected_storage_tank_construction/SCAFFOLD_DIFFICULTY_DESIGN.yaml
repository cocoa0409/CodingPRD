              payload: { holidays_found: 2, test_voltage_v: 900 }
              as: QcInspector
            - call: "POST /coating-applications/${ca_id}/surface-prep"
              payload: { achieved_prep_standard: "SSPC_SP10", profile_mils: 3.0, dew_point_spread_f: 8.0 }
              as: QcInspector
            - call: "POST /coating-applications/${ca_id}/dft-readings"
              payload: { spot_readings: [ [ 12.0, 12.0, 12.0 ] ] }
              as: QcInspector
            - call: "POST /coating-applications/${ca_id}/holiday-test"
              payload: { holidays_found: 1, test_voltage_v: 900 }
              as: QcInspector
            - call: "POST /coating-applications/${ca_id}/surface-prep"
              payload: { achieved_prep_standard: "SSPC_SP5", profile_mils: 3.5, dew_point_spread_f: 10.0 }
              as: QcInspector
            - call: "POST /coating-applications/${ca_id}/dft-readings"
              payload: { spot_readings: [ [ 10.0, 11.0, 12.0 ] ] }
              as: QcInspector
            - call: "POST /coating-applications/${ca_id}/holiday-test"
              payload: { holidays_found: 0, test_voltage_v: 675 }
              as: QcInspector
            - call: "POST /coating-applications/${ca_id}/surface-prep"
              payload: { achieved_prep_standard: "SSPC_SP10", profile_mils: 3.0, dew_point_spread_f: 12.0 }
              as: QcInspector
          assert:
            - "after the first holiday-test CoatingApplication.${ca_id}.status == REWORK_REQUIRED, holidays_found == 2, and Tank.${tank_id}.quality_posture == RESTRICTED with open_nonconformance_count == 1"
            - "after the first re-preparation status == PREP_ACCEPTED, rework_cycle_count == 1, dft_verdict == NOT_EVALUATED, spot_count == 0, computed_spot_average_min_mils == 0.0, computed_spot_average_max_mils == 0.0, computed_overall_average_mils == 0.0, computed_min_gauge_reading_mils == 0.0, holidays_found == null, holiday_test_voltage_v == null"
            - "after the first re-preparation Tank.${tank_id}.open_nonconformance_count == 0 and quality_posture == OPEN"
            - "after the second dft-readings spot_count == 1 and computed_overall_average_mils == 12.00 (a full recompute over one spot, not an accumulation of the earlier two)"
            - "after the second holiday-test status == REWORK_REQUIRED and rework_cycle_count is still 1"
            - "after the second re-preparation status == PREP_ACCEPTED and rework_cycle_count == 2 (the loop has no cap)"
            - "after the third dft-readings dft_verdict == PASS and computed_overall_average_mils == 11.00"
            - "the holiday-test with holidays_found 0 and test_voltage_v 675 returns 201 and status == ACCEPTED"
            - "the final surface-prep on the ACCEPTED application returns 409 ERR_COATING_STEP_INVALID and rework_cycle_count stays 2"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: nde_rejection_five_hop_posture_suspension_water_release
        grounds:
          - state_machines.NdeReport.SCHEDULED_to_REPORTED_REJECT
          - state_machines.Tank.quality_posture.OPEN_to_RESTRICTED
          - state_machines.HydrotestPlan.APPROVED_to_SUSPENDED
          - state_machines.WaterWithdrawal.RESERVED_to_CANCELLED
          - calculations.water_volume_ledger
        distinguishing_aspect: |
          Trigger: one QcInspector result call. Depth 5 and five distinct entity types:
          NdeReport -> WeldSeam -> Tank.quality_posture -> HydrotestPlan -> WaterWithdrawal
          -> WaterSource ledger. The last hop is a numeric ledger release, not a status
          flip, so a partial implementation that stops at the plan suspension leaves the
          water permit oversubscribed.
        test_recipe:
          setup:
            - "A tank driven to SHELL_COMPLETE: ACCEPTED foundation, one ADEQUATE course, seam V1 welded and RT-accepted, then an explicit phase transition."
            - "A water source with 2000000 gal permitted, an APPROVED hydrotest plan, and two RESERVED withdrawals of 100000 gal each in adjacent non-overlapping windows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectEngineer
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /foundation-packages"
              payload: { tank_id: "${tank_id}", foundation_type: "RINGWALL_CONCRETE", settlement_evaluation_method: "COSINE_BEST_FIT", permitted_uniform_settlement_in: 6.0, permitted_differential_ratio: 0.005, monitoring_point_count: 8 }
              as: CivilContractor
              captures: { fp_id: $.data.id }
            - call: "POST /settlement-surveys"
              payload: { foundation_package_id: "${fp_id}", fill_percent: 0, point_readings: [ { point_index: 1, elevation_in: 100.000 }, { point_index: 2, elevation_in: 100.000 }, { point_index: 3, elevation_in: 100.000 }, { point_index: 4, elevation_in: 100.000 }, { point_index: 5, elevation_in: 100.000 }, { point_index: 6, elevation_in: 100.000 }, { point_index: 7, elevation_in: 100.000 }, { point_index: 8, elevation_in: 100.000 } ] }
              as: CivilContractor
            - call: "POST /foundation-packages/${fp_id}/acceptance"
              payload: { decision: "ACCEPT" }
              as: ProjectEngineer
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank_id}", course_number: 1, course_width_ft: 8, plate_thickness_in: 0.4375, material_spec: "A516-70", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { course_id: $.data.id }
            - call: "POST /shell-courses/${course_id}/fitup"
              as: ErectionSuperintendent
            - call: "POST /welders"
              payload: { welder_stamp: "W-07", full_name: "R. Alvarez", process: "SMAW", qualified_positions: [ "3G" ], welder_qualified_thickness_max_in: 0.75, wps_number: "WPS-SMAW-01", wps_qualified_thickness_max_in: 0.75, qualification_date_utc: "2026-06-01T00:00:00Z" }
              as: AuthorizedInspector
              as_user_id: "ai-1"
              captures: { w1_id: $.data.id }
            - call: "POST /weld-seams"
              payload: { shell_course_id: "${course_id}", seam_type: "VERTICAL", seam_label: "V1", length_in: 96, sequence_index: 1 }
              as: ErectionSuperintendent
              captures: { seam_id: $.data.id }
            - call: "POST /weld-seams/${seam_id}/weld-log"
              payload: { welder_id: "${w1_id}" }
              as: Welder
              as_user_id: "${w1_id}"
            - call: "POST /nde-reports"
              payload: { weld_seam_id: "${seam_id}", method: "RT", window_start_utc: "2026-08-11T10:00:00Z", window_end_utc: "2026-08-11T11:00:00Z", coverage_pct: 100, technician_stamp: "RT-3" }
              as: QcInspector
