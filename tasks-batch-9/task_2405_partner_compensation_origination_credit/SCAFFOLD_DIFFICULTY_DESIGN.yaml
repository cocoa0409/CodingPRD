  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: credit_claim_remand_cycle_bounded_at_max_remands
        grounds:
          - state_machines.CreditClaim.DRAFT_to_SUBMITTED
          - state_machines.CreditClaim.SUBMITTED_to_DISPUTED
          - state_machines.CreditClaim.DISPUTED_to_DRAFT
          - state_machines.CreditClaim.DISPUTED_to_ALLOCATED
          - entities.CreditClaim.fields.remand_count
          - entities.CreditClaim.fields.revision_count
          - errors[ERR_CLAIM_NOT_ADJUDICABLE]
        distinguishing_aspect: |
          The CreditClaim machine is cyclic: DRAFT -> SUBMITTED -> DISPUTED -> DRAFT
          re-enters an already-visited state, and the loop is bounded by
          MAX_REMANDS = 2 rather than by state alone, so the third REMAND is rejected
          with ERR_CLAIM_NOT_ADJUDICABLE from the same DISPUTED state that accepted
          the first two.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; cycle fiscal_year 2026 in OPEN_INTAKE with claim_deadline_on 2026-09-30."
            - "Partner A (claimant, billing and responsible attorney of Matter M), Partner B (disputer), Partner ARB (is_credit_arbiter)."
            - "A's NEW_CLIENT claim on M has already been remanded twice: remand_count 2, revision_count 2."
            - "After the second remand the claim was re-submitted and re-disputed, so it sits in DISPUTED again."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CycleAdmin
            - call: "POST /comp/cycles"
              payload: { fiscal_year: 2026, distributable_pool_cents: 100000000, lockstep_unit_cents: 0, discretionary_pool_pct: 0.2000, draw_pct: 0.8000, claim_deadline_on: "2026-09-30", assessment_deadline_on: "2026-10-31" }
              as: CycleAdmin
              captures: { cy: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Ada Origin", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2010 }
              as: CycleAdmin
              captures: { pa: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Ben Counter", practice_group: "CORPORATE", compensation_model: "FORMULA", admission_year: 2011 }
              as: CycleAdmin
              captures: { pb: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Rex Arbiter", practice_group: "REGULATORY", compensation_model: "FORMULA", admission_year: 2004, is_credit_arbiter: true }
              as: CycleAdmin
              captures: { parb: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-L1", client_display_name: "Loop Logistics", matter_type: "NEW_CLIENT", practice_group: "CORPORATE", opened_on: "2026-01-15", billing_attorney_id: "${pa}", responsible_attorney_id: "${pa}" }
              as: CycleAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /comp/credit-claims"
              payload: { cycle_id: "${cy}", matter_id: "${m1}", claim_basis: "NEW_CLIENT", requested_pct: 100.00, narrative: "First contact and pitch were mine." }
              as: Partner
              as_user_id: "${pa}"
              captures: { cl1: "$.data.id" }
            - call: "POST /comp/credit-claims/${cl1}/submit"
              payload: {}
              as: Partner
              as_user_id: "${pa}"
            - call: "POST /comp/credit-claims/${cl1}/dispute"
              payload: { contested_pct: 50.00, dispute_grounds: "The client was already mine." }
              as: Partner
              as_user_id: "${pb}"
            - call: "GET /comp/matters/${m1}"
              payload: {}
              as: CycleAdmin
              captures: { mv1: "$.data.version" }
            - call: "POST /comp/credit-claims/${cl1}/adjudicate"
              payload: { decision: "REMAND", remand_reason: "Provide the engagement letter.", expected_matter_version: "${mv1}" }
              as: CreditArbiter
              as_user_id: "${parb}"
            - call: "POST /comp/credit-claims/${cl1}/submit"
              payload: {}
              as: Partner
              as_user_id: "${pa}"
            - call: "POST /comp/credit-claims/${cl1}/dispute"
              payload: { contested_pct: 50.00, dispute_grounds: "Still my relationship." }
              as: Partner
              as_user_id: "${pb}"
            - call: "GET /comp/matters/${m1}"
              payload: {}
              as: CycleAdmin
              captures: { mv2: "$.data.version" }
            - call: "POST /comp/credit-claims/${cl1}/adjudicate"
              payload: { decision: "REMAND", remand_reason: "Both narratives still conflict.", expected_matter_version: "${mv2}" }
              as: CreditArbiter
              as_user_id: "${parb}"
            - call: "POST /comp/credit-claims/${cl1}/submit"
              payload: {}
              as: Partner
              as_user_id: "${pa}"
            - call: "POST /comp/credit-claims/${cl1}/dispute"
              payload: { contested_pct: 50.00, dispute_grounds: "Unchanged position." }
              as: Partner
              as_user_id: "${pb}"
            - call: "GET /comp/matters/${m1}"
              payload: {}
              as: CycleAdmin
              captures: { mv3: "$.data.version" }
          trigger:
            - call: "POST /comp/credit-claims/${cl1}/adjudicate"
