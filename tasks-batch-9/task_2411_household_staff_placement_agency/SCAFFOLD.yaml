  - method: POST
    path: /background-verifications/{id}/record-result
    purpose: "Record the provider's result. The three results fork into three different side-effect sets."
    roles: [VettingSpecialist]
    input: [result, "findings_note?"]
    output: BackgroundVerification
    side_effects:
      - "result=CLEARED: status -> CLEARED and Candidate.vetting_status BACKGROUND_PENDING -> CLEARED"
      - "result=FLAGGED: status -> FLAGGED and the candidate is left at BACKGROUND_PENDING awaiting adjudication"
      - "result=INCONCLUSIVE: status -> INCONCLUSIVE with no candidate-side effect; a repeat call from INCONCLUSIVE increments rerun_count"
      - "recomputes calculations.candidate_vetting_score"
    errors: [ERR_MISSING_AUTH_HEADER, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_INVALID_ENUM, ERR_BACKGROUND_VERIFICATION_NOT_FOUND, ERR_ENTITY_TERMINAL, ERR_INVALID_STATE_TRANSITION]

  - method: POST
    path: /background-verifications/{id}/adjudicate
    purpose: "Adjudicate a FLAGGED background result. PASS clears with a recorded waiver; FAIL triggers the rejection cascade."
    roles: [AgencyPrincipal]
    input: [disposition, expected_candidate_version, "waiver_note?"]
    output: BackgroundVerification
    side_effects:
      - "disposition=PASS: status -> ADJUDICATED_PASS and Candidate.vetting_status BACKGROUND_PENDING -> CLEARED"
      - "disposition=FAIL: status -> ADJUDICATED_FAIL, Candidate.vetting_status -> REJECTED, every SCHEDULED / IN_PROGRESS TrialEngagement of the candidate -> CANCELLED with cancel_reason VETTING_FAILED, every affected TRIALING RoleRequisition whose active_trial_count reaches 0 -> SOURCING, and Candidate.availability_status ON_TRIAL -> INACTIVE"
      - "increments Candidate.version"
    errors: [ERR_MISSING_AUTH_HEADER, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_INVALID_ENUM, ERR_BACKGROUND_VERIFICATION_NOT_FOUND, ERR_STALE_CANDIDATE_VERSION, ERR_ENTITY_TERMINAL, ERR_BACKGROUND_NOT_FLAGGED]

