# ============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Domain: inventory-accuracy-tagging-program  (task 2571)
#
# Nine §0.5 rule_ids, 23 instances. Every literal in every `assert:` line was
# computed by executing the referenced calculations[].formula against the
# `setup:` inputs before it was written here.
#
# Shared fixture conventions used by the chains below:
#   logical clock default            2026-08-01T00:00:00Z (never set unless noted)
#   Category APPAREL                 cadence 30, tol_units 2, tol_value 20000,
#                                    uplift 750 bps, EITHER, min_accuracy 97.00
#   Category HOME                    cadence 30, tol_units 5, tol_value 6000,
#                                    uplift 0 bps, EITHER, min_accuracy 95.00
#   Category ELEC                    cadence 14, tol_units 0, tol_value 4000,
#                                    uplift 250 bps, HANDHELD, min_accuracy 99.00
#   Store S100                       reader_capability BOTH, overhead capacity 2
#   Store S200                       reader_capability HANDHELD_ONLY, capacity 0
#   Item TEE-001                     APPAREL, unit_cost 1234
#   Item TEE-002                     APPAREL, unit_cost 2500
#   Item PAN-01                      HOME,    unit_cost 1500
#   Item SOFA-01                     HOME,    unit_cost 5000
#   opaque operator ids              u_analyst_1, u_analyst_2, u_super_1,
#                                    u_super_2, u_ctrl_1, u_admin_1
# ============================================================================

scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: shrink_attribution_provisional_vs_final_diverge
        grounds:
          - calculations.shrink_attribution
          - entities.ShrinkPeriod.fields.provisional_total_shrink_cents
          - entities.ShrinkPeriod.fields.final_total_shrink_cents
          - entities.ShrinkPeriod.fields.unresolved_cents
          - state_machines.VarianceInvestigation.CAUSE_APPROVED_to_CLOSED
        distinguishing_aspect: |
          This instance is dual-variant on the SHRINK-ACCOUNTING domain (ShrinkPeriod): with one
          CLOSED THEFT investigation of 6633 cents and one still-IN_REVIEW investigation of 32250
          cents in the same period, the provisional variant reports 38883 cents / 78 bps because it
          parks the unresolved amount in the total, while the final variant reports 6633 cents /
          13 bps because it drops non-terminal investigations entirely.
        test_recipe:
          setup:
            - "Category APPAREL with variance_tolerance_units 2, variance_tolerance_value_cents 20000 and landed_cost_uplift_bps 750."
            - "Store S100 with both reader technologies; Vendor VEND1; Items TEE-001 (1234 cents) and TEE-002 (2500 cents)."
            - "Stock positions at S100: TEE-001 opening 100 units, TEE-002 opening 50 units."
            - "An OPEN ShrinkPeriod for S100 covering 2026-07-01..2026-09-30 with sales_at_cost_cents 5000000."
            - "A submitted cycle count with two out-of-tolerance lines valued 6633 and 32250 cents, so two investigations exist."
            - "The 6633-cent investigation is driven all the way to CLOSED with approved_root_cause THEFT; the 32250-cent one is only assigned, so it sits in IN_REVIEW."
            - "The logical clock is left at its 2026-08-01T00:00:00Z default throughout."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750, reader_mode_required: "EITHER", auto_correct_negative: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7, tag_required: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-002", description: "V-neck tee", unit_cost_cents: 2500, retail_price_cents: 4999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7, tag_required: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee2: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee1}", baseline_on_hand_units: 100, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee2}", baseline_on_hand_units: 50, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_tee2: "$.data.id" }
            - call: "POST /inventory-integrity/shrink-periods"
              payload: { store_id: "${store_s100}", period_start: "2026-07-01", period_end: "2026-09-30", sales_at_cost_cents: 5000000 }
              as: ShrinkController
              as_user_id: "u_ctrl_1"
              captures: { sp1: "$.data.id" }
            - call: "POST /inventory-integrity/count-schedules"
              payload: { store_id: "${store_s100}", category_id: "${cat_apparel}", reader_mode: "HANDHELD", first_due_date: "2026-08-01", cadence_days: 30 }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { sched1: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks"
              payload: { count_schedule_id: "${sched1}", reader_mode: "HANDHELD", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-03T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { task1: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks/${task1}/start"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
            - call: "POST /inventory-integrity/count-tasks/${task1}/lines"
              payload: { item_id: "${item_tee1}", counted_units: 105, read_mode_used: "HANDHELD" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { line_a: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks/${task1}/lines"
              payload: { item_id: "${item_tee2}", counted_units: 62, read_mode_used: "HANDHELD" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { line_b: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks/${task1}/submit"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
            - call: "GET /inventory-integrity/variance-investigations"
              payload: { count_line_id: "${line_a}" }
              as: InventorySupervisor
              as_user_id: "u_super_1"
              captures: { inv_a: "$.data[0].id" }
            - call: "GET /inventory-integrity/variance-investigations"
              payload: { count_line_id: "${line_b}" }
              as: InventorySupervisor
              as_user_id: "u_super_1"
              captures: { inv_b: "$.data[0].id" }
            - call: "POST /inventory-integrity/variance-investigations/${inv_a}/assign"
              payload: { assigned_investigator_id: "u_analyst_1" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { inv_a_v: "$.data.version" }
            - call: "POST /inventory-integrity/variance-investigations/${inv_a}/propose-cause"
              payload: { proposed_root_cause: "THEFT", evidence_note: "CCTV review of the fitting-room exit", expected_investigation_version: "${inv_a_v}" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
            - call: "POST /inventory-integrity/variance-investigations/${inv_a}/approve-cause"
              payload: {}
              as: InventorySupervisor
              as_user_id: "u_super_1"
            - call: "POST /inventory-integrity/variance-investigations/${inv_a}/close"
              payload: {}
              as: InventorySupervisor
              as_user_id: "u_super_1"
            - call: "POST /inventory-integrity/variance-investigations/${inv_b}/assign"
              payload: { assigned_investigator_id: "u_analyst_2" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
          trigger:
            - call: "GET /inventory-integrity/shrink-periods/${sp1}/attribution"
              payload: {}
              as: ShrinkController
              as_user_id: "u_ctrl_1"
          assert:
            - "response data.theft_cents == 6633"
            - "response data.unresolved_cents == 32250"
            - "response data.damage_cents == 0 and data.process_error_cents == 0 and data.vendor_shortage_cents == 0"
            - "response data.provisional_total_shrink_cents == 38883"
            - "response data.final_total_shrink_cents == 6633"
            - "response data.provisional_shrink_rate_bps == 78"
            - "response data.final_shrink_rate_bps == 13"
            - "response data.total_attributable_variance_cents == 38883"
            - "response data.active_variant == \"provisional\" because ShrinkPeriod.${sp1}.status == OPEN"
            - "VarianceInvestigation.${inv_b}.status == IN_REVIEW — it is counted by the provisional variant and excluded by the final variant"

      - name: stock_accuracy_unit_vs_value_diverge
        grounds:
          - calculations.stock_accuracy_pct
          - entities.StockPosition.fields.unit_accuracy_pct
          - entities.StockPosition.fields.value_accuracy_pct
          - entities.Category.fields.landed_cost_uplift_bps
          - state_machines.CountTask.IN_PROGRESS_to_COUNTED
        distinguishing_aspect: |
          This instance is dual-variant on the OPERATIONAL-ACCURACY domain (StockPosition), a
          different entity domain from the ShrinkPeriod instance: the same single count of a
          100-unit position with a 5-unit shortfall scores 95.00 on the unit variant and 94.62 on
          the value variant, because only the value variant carries the 750 bps landed-cost uplift
          into its numerator while its denominator stays pure book cost.
        test_recipe:
          setup:
            - "Category APPAREL with landed_cost_uplift_bps 750 and min_accuracy_pct 97.00."
            - "Store S100; Vendor VEND1; Item TEE-001 at 1234 cents unit cost."
            - "One stock position at S100 for TEE-001 with opening on-hand 100 units — the only APPAREL position at that store, so the in-scope denominator is 1."
            - "An OPEN ShrinkPeriod for S100 covering 2026-07-01..2026-09-30, needed because the count line will be out of tolerance."
            - "A cycle count submitted with a single line counting 105 units against a system snapshot of 100, i.e. variance +5 units valued 6633 cents."
            - "The logical clock is left at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750, reader_mode_required: "EITHER", auto_correct_negative: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7, tag_required: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee1}", baseline_on_hand_units: 100, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/shrink-periods"
              payload: { store_id: "${store_s100}", period_start: "2026-07-01", period_end: "2026-09-30", sales_at_cost_cents: 5000000 }
              as: ShrinkController
              as_user_id: "u_ctrl_1"
              captures: { sp1: "$.data.id" }
            - call: "POST /inventory-integrity/count-schedules"
              payload: { store_id: "${store_s100}", category_id: "${cat_apparel}", reader_mode: "HANDHELD", first_due_date: "2026-08-01", cadence_days: 30 }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { sched1: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks"
              payload: { count_schedule_id: "${sched1}", reader_mode: "HANDHELD", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-03T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { task1: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks/${task1}/start"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
            - call: "POST /inventory-integrity/count-tasks/${task1}/lines"
              payload: { item_id: "${item_tee1}", counted_units: 105, read_mode_used: "HANDHELD" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { line_a: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks/${task1}/submit"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
          trigger:
            - call: "GET /inventory-integrity/stock-positions/${pos_tee1}/accuracy"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
          assert:
            - "response data.last_count_system_units == 100"
            - "response data.last_count_book_value_cents == 123400"
            - "response data.last_variance_units == 5"
            - "response data.last_variance_value_cents == 6633"
            - "response data.unit_accuracy_pct == 95.00"
            - "response data.value_accuracy_pct == 94.62"
            - "response data.unit_accuracy_pct != data.value_accuracy_pct — the 750 bps uplift is the entire difference"
            - "response data.min_accuracy_pct == 97.00 and data.promising_state == \"RESTRICTED\""
            - "StockPosition.${pos_tee1}.unit_accuracy_pct == 95.00 and StockPosition.${pos_tee1}.value_accuracy_pct == 94.62"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: variance_valuation_round_per_line_then_sum
        grounds:
          - calculations.count_variance_valuation
          - entities.CountLine.fields.variance_value_cents
          - entities.CountTask.fields.total_variance_value_cents
          - state_machines.CountTask.IN_PROGRESS_to_COUNTED
        distinguishing_aspect: |
          MODE (a) — combination-order sensitivity. Two inputs (a 5-unit variance on a 1234-cent
          item and a 3-unit variance on a 2500-cent item) are each uplifted by 750 bps and rounded
          half-up PER LINE before being summed: 6633 + 8063 = 14696. Summing the raw amounts first
          and rounding once gives 13670 * 1.075 = 14695.25 -> 14695, which is off by one cent. The
          other two instances of this rule are nested-threshold (mode b) and pinned-evaluation-order
          (mode c) respectively, not order-of-rounding.
        test_recipe:
          setup:
            - "Category APPAREL with landed_cost_uplift_bps 750, variance_tolerance_units 2, variance_tolerance_value_cents 20000."
            - "Store S100; Vendor VEND1; Items TEE-001 (1234 cents) and TEE-002 (2500 cents)."
            - "Stock positions at S100: TEE-001 opening 100 units, TEE-002 opening 50 units — in-scope population is exactly 2."
            - "An OPEN ShrinkPeriod for S100 covering 2026-07-01..2026-09-30 so the two out-of-tolerance lines can open investigations."
            - "A started HANDHELD cycle count with two HANDHELD lines: TEE-001 counted 105 (+5 units) and TEE-002 counted 53 (+3 units)."
            - "Both lines are out of tolerance on the unit test (5 > 2 and 3 > 2), so both are retained for investigation; coverage is 2/2 = 100.00."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750, reader_mode_required: "EITHER", auto_correct_negative: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7, tag_required: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-002", description: "V-neck tee", unit_cost_cents: 2500, retail_price_cents: 4999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7, tag_required: true }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee2: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee1}", baseline_on_hand_units: 100, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee2}", baseline_on_hand_units: 50, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_tee2: "$.data.id" }
            - call: "POST /inventory-integrity/shrink-periods"
              payload: { store_id: "${store_s100}", period_start: "2026-07-01", period_end: "2026-09-30", sales_at_cost_cents: 5000000 }
              as: ShrinkController
              as_user_id: "u_ctrl_1"
              captures: { sp1: "$.data.id" }
            - call: "POST /inventory-integrity/count-schedules"
              payload: { store_id: "${store_s100}", category_id: "${cat_apparel}", reader_mode: "HANDHELD", first_due_date: "2026-08-01", cadence_days: 30 }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { sched1: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks"
              payload: { count_schedule_id: "${sched1}", reader_mode: "HANDHELD", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-03T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { task1: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks/${task1}/start"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
            - call: "POST /inventory-integrity/count-tasks/${task1}/lines"
              payload: { item_id: "${item_tee1}", counted_units: 105, read_mode_used: "HANDHELD" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { line_a: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks/${task1}/lines"
              payload: { item_id: "${item_tee2}", counted_units: 53, read_mode_used: "HANDHELD" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { line_b: "$.data.id" }
          trigger:
            - call: "POST /inventory-integrity/count-tasks/${task1}/submit"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
          assert:
            - "response data.status == \"COUNTED\""
            - "response data.in_scope_position_count == 2 and data.counted_line_count == 2 and data.coverage_pct == 100.00"
            - "response data.variance_line_count == 2"
            - "response data.total_variance_value_cents == 14696"
            - "response data.total_variance_value_cents != 14695 — 14695 is the sum-then-round answer and is wrong"
            - "CountLine.${line_a}.variance_units == 5 and CountLine.${line_a}.variance_value_cents == 6633 and CountLine.${line_a}.within_tolerance == false"
            - "CountLine.${line_b}.variance_units == 3 and CountLine.${line_b}.variance_value_cents == 8063 and CountLine.${line_b}.within_tolerance == false"
            - "GET /inventory-integrity/shrink-periods/${sp1}/attribution returns data.unresolved_cents == 14696"

      - name: adjustment_authority_nested_threshold
        grounds:
          - calculations.adjustment_authority_threshold
          - entities.Adjustment.fields.authority_threshold_cents
          - entities.Adjustment.fields.approval_state
          - entities.VarianceInvestigation.fields.approved_root_cause
        distinguishing_aspect: |
          MODE (b) — a nested min/max over four inputs where one input is a conditional branch on
          ANOTHER entity's state. base = max(CATEGORY_FLOOR 5000, min(category tolerance 20000,
          STORE_CAP 100000)) = 20000; strictness comes from the linked investigation's
          approved_root_cause but only because that investigation reached CLOSED (THEFT -> 5000 bps);
          the repeat-offender penalty comes from counting sibling POSTED adjustments (1 -> 1000 bps).
          Only that exact nesting order yields floor(20000 * 0.5 * 0.9) = 9000, against which a
          9872-cent impact tips into PENDING. This is threshold nesting, not rounding order (mode a)
          and not evaluation-order pinning (mode c).
        test_recipe:
          setup:
            - "Category APPAREL (variance_tolerance_value_cents 20000, uplift 750 bps); Store S100; Vendor VEND1; Item TEE-001 at 1234 cents."
            - "One stock position at S100 for TEE-001 with opening on-hand 100 units."
            - "An OPEN ShrinkPeriod for S100 covering 2026-07-01..2026-09-30."
            - "A submitted cycle count whose single line counts 105 against 100, opening one investigation."
            - "That investigation is driven to CLOSED with approved_root_cause THEFT, so the strictness input is armed at 5000 bps."
            - "One earlier adjustment of -5 units is created and POSTED on the same position; at that moment prior_posted was 0, so its own threshold was floor(20000 * 0.5 * 1.0) = 10000 and its 6170-cent impact needed no approval."
            - "The position version is re-read after the posting because posting bumps StockPosition.version."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
