      - name: territory_estimate_variant_divergence_on_identical_comps
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: territory_value_estimate_diverges_between_comparable_weighted_and_cast_adjusted
          rationale: |
            The COMPARABLE_WEIGHTED vs CAST_ADJUSTED delta on one identical comparable set, including
            the exact 1.40x relationship and the downstream ask/floor deltas, is that §1.8 instance's
            whole subject; the §1.9 corner here is limited to variant SELECTION and freezing.

      - name: buyer_exposure_variant_divergence_after_a_receipt
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: buyer_exposure_diverges_between_gross_pipeline_and_net_unpaid_after_first_receipt
          rationale: |
            GROSS_PIPELINE vs NET_UNPAID on the same buyer after the first receipt is exactly that §1.8
            instance, which also pins both stored fields on the Buyer row.

      - name: commission_rate_is_selected_from_the_pre_receipt_running_total
        claim_type: correct_result
        excluded_because:
          difficulty_instance: commission_rate_picked_from_pre_receipt_total_never_split_across_breakpoint
          rationale: |
            The pinned four-step evaluation order of sales_commission_accrual, the TIER1_BREAK /
            TIER2_BREAK selection and the forbidden straddle-split are all asserted there with a
            receipt sequence this §1.9 section does not need to duplicate.

      - name: waterfall_per_tier_rounding_order_shifts_a_cent
        claim_type: precision
        excluded_because:
          difficulty_instance: waterfall_round_each_tier_share_before_subtracting_shifts_a_cent_to_equity_tier
          rationale: |
            Round-then-subtract versus subtract-then-round inside the tier loop is a one-cent claim that
            §1.8 already isolates; the §1.9 waterfall corner instead covers the all-capped residual path.

      - name: comparable_sample_size_and_lookback_boundaries
        claim_type: constants_applied
        excluded_because:
          difficulty_instance: comparable_sample_boundary_at_min_sample_and_at_the_lookback_year_edge
          rationale: |
            MIN_COMP_SAMPLE 3 at exactly 3 and 2, and COMP_LOOKBACK_YEARS 7 at the inclusive year edge,
            are walked there together with ERR_NO_COMPARABLE_TITLES and ERR_INSUFFICIENT_COMP_SAMPLE.

      - name: screening_room_turnaround_interval_semantics
        claim_type: correct_result
        excluded_because:
          difficulty_instance: screening_room_requires_exactly_thirty_minutes_turnaround_on_both_sides
          rationale: |
            The half-open interval plus two-sided TURNAROUND_MINUTES buffer, including the gap-0,
            gap-29 and gap-30 cases, is that §1.8 instance in full.

      - name: meeting_table_touching_windows_and_minute_cap
        claim_type: correct_result
        excluded_because:
          difficulty_instance: meeting_tables_allow_touching_windows_but_cap_buyer_minutes_at_exactly_240
          rationale: |
            The no-buffer table geometry and the separate MEETING_MINUTES_CAP aggregate dimension are
            both asserted there, including the equality-passes boundary at exactly 240 minutes.

      - name: commission_ledger_reconciliation_when_a_receipt_is_undone
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: reverse_receipt_restores_cash_and_tiered_commission_with_zero_drift
          rationale: |
            The only ledger reconciliation in the domain is the delta applied when a booked receipt is
            reversed, and that §1.8 instance asserts gross_collected_usd, commission_earned_usd, the
            resynced tier cap and the account balance all returning to their pre-receipt values with zero
            residual drift, which is strictly more than a one-directional reconciliation check.

  # ===========================================================================
  - section: validations
    instances:

      - name: missing_headers_return_unauthenticated_before_every_other_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=10]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: |
          Priority 10 is absolute: a request that is ALSO role-forbidden (priority 20), aimed at a
          non-existent film (priority 30) and missing a required body field (priority 42) still returns
          ERR_UNAUTHENTICATED at 401, so an implementation that resolves the path or validates the body
          before authenticating is detectable from the error_id alone.
        test_recipe:
          setup:
            - "Empty DB; no clock call is needed because the request never reaches domain logic."
          setup_api_calls: []
          trigger:
            - call: "PATCH /film-sales/films/11111111-1111-4111-8111-111111111111"
              payload: { principal_cast_score: 999 }
              as: "(no X-User-Role and no X-User-ID header sent)"
              captures: { err_auth: $.data.error_id }
          assert:
            - "${err_auth} == ERR_UNAUTHENTICATED at HTTP 401"
            - "not ERR_UNAUTHORIZED, not ERR_FILM_NOT_FOUND and not ERR_INVALID_REQUEST"
            - "the response body carries only the error envelope; no Film row is touched"

      - name: role_check_returns_unauthorized_before_body_validation
        claim_type: priority_ordering
        grounds:
          - validations[priority=20]
          - validations[priority=42]
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: |
          Priority 20 outranks priority 42: a CollectionAgent posting a Film (a PlatformAdmin-only
          endpoint) with a body that is ALSO missing title and genre gets ERR_UNAUTHORIZED at 403, never
          ERR_INVALID_REQUEST — the role gate is evaluated on the endpoint, before the payload is parsed.
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-01T00:00:00Z; empty DB."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /film-sales/films"
              payload: { production_budget_usd: 24000000.00 }
              as: CollectionAgent
              captures: { err_role: $.data.error_id }
          assert:
            - "${err_role} == ERR_UNAUTHORIZED at HTTP 403, not ERR_INVALID_REQUEST"
            - "GET /film-sales/films as PlatformAdmin returns an empty list afterwards"

      - name: unknown_path_id_returns_contract_not_found_before_invalid_request
        claim_type: priority_ordering
        grounds:
          - validations[priority=34]
          - validations[priority=42]
          - errors.ERR_CONTRACT_NOT_FOUND
        distinguishing_aspect: |
          Path-id resolution (priorities 30-41) runs before body validation (42): a milestone POST at an
          unknown contract id with a body that omits pct_of_mg and due_date returns
          ERR_CONTRACT_NOT_FOUND at 404, so the 404-vs-400 choice is decided by the URL, not the body.
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-01T00:00:00Z; no PreSaleContract rows exist."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /film-sales/pre-sale-contracts/22222222-2222-4222-8222-222222222222/payment-milestones"
              payload: { label: "ON_SIGNATURE" }
              as: SalesAgent
              captures: { err_c: $.data.error_id }
          assert:
            - "${err_c} == ERR_CONTRACT_NOT_FOUND at HTTP 404, not ERR_INVALID_REQUEST"

      - name: film_lookup_outranks_territory_lookup_when_both_body_ids_are_not_found
        claim_type: priority_ordering
        grounds:
          - validations[priority=30]
          - validations[priority=31]
          - errors.ERR_FILM_NOT_FOUND
        distinguishing_aspect: |
