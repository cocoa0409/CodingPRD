          numeric_value == critical_high triggers CRITICAL_HIGH (the comparison is `>=`, not `>`).
          Three RELEASED results on the same panel: value 5.99 -> ABNORMAL (above reference_high
          5.10 but below critical_high 6.00), value 6.00 -> CRITICAL_HIGH (boundary), value 6.01
