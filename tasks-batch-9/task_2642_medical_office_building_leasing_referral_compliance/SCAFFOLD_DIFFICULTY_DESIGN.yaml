  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: lease_execute_blocked_by_building_restricted_posture
        grounds:
          - validations[25]
          - errors.ERR_BUILDING_MIX_RESTRICTED
          - calculations.building_tenant_mix
          - entities.Building.fields.tenant_mix_posture
          - entities.Tenant.fields.affiliation
        distinguishing_aspect: |
          ENTITY PAIR (Lease, Building): the affiliated cardiology lease is
          internally perfect — certified, signed, a vacant suite, a clean term —
          and is refused solely because a THIRD entity, the Building, reads
          tenant_mix_posture RESTRICTED at that moment. Executing an unrelated
          independent lease dilutes anchor_share_pct from 1.0000 to 0.7059,
          flipping the building to ANCHOR_CONCENTRATED, and the byte-identical
          retry then succeeds — after which the building lands back on RESTRICTED
          at 0.7619 because the newly executed lease is itself health-system.
        test_recipe:
          setup:
            - "One 100000 sf Building at 30.00 psf market with a 12000 sf STANDARD_EXAM suite, a 4000 sf PROCEDURE suite and a 5000 sf STANDARD_EXAM suite."
            - "One HEALTH_SYSTEM_ANCHOR tenant executed on the 12000 sf suite at 28.00 psf while the posture is still BALANCED, which drives anchor_share_pct to 1.0000 and the posture to RESTRICTED."
            - "One HEALTH_SYSTEM_AFFILIATED cardiology tenant certified and signed on the 4000 sf PROCEDURE suite at 34.25 psf, ready to execute."
            - "One INDEPENDENT_PRACTICE tenant certified and signed on the 5000 sf suite at 30.00 psf, held in reserve as the diluting lease."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
