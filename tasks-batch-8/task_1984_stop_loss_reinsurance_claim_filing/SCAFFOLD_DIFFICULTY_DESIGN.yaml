scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: specific_accumulation_policy_year_vs_paid_basis
        grounds:
          - calculations.specific_accumulation_policy_year_basis
          - entities.StopLossContract.fields.contract_basis
          - entities.ClaimAccumulation.fields.accumulated_cents
        distinguishing_aspect: |
          Same member, same two claims (one service-dated inside the policy year
          but paid after year-end), one contract on POLICY_YEAR basis and a
          sibling contract on PAID basis: the POLICY_YEAR contract's SPECIFIC
          accumulation includes the claim, the PAID contract's accumulation
          excludes it. Different entity domain (ClaimAccumulation on
          specific/member) from the forecast instance below.
        test_recipe:
          setup:
            - "Plan P exists; two contracts C_PY (POLICY_YEAR, 2026-01-01..2027-01-01, specific_ded=100000_00, run_in=0, run_out=90) and C_PD (PAID, same window) both IN_FORCE for plan P"
            - "Member M enrolled in P with coverage 2025-01-01 onward"
            - "Claim CL1 service_date=2026-06-01 paid_date=2026-07-01 paid=60000_00 — inside both bases"
            - "Claim CL2 service_date=2026-12-15 paid_date=2027-01-15 paid=50000_00 — inside PY basis (service in year, run_out covers payment) but OUTSIDE PD basis (paid after 2027-01-01)"
            - "Logical clock at 2027-01-20"
          setup_api_calls:
            - call: "POST /stop-loss/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /stop-loss/plans"
              payload: { plan_name: "Acme Health", sponsor_tax_id: "12-3456789" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /stop-loss/contracts"
              payload:
                plan_id: "${plan_id}"
                policy_year_start: "2026-01-01T00:00:00Z"
                policy_year_end: "2027-01-01T00:00:00Z"
                contract_basis: "POLICY_YEAR"
                specific_deductible_cents: 10000000
                aggregate_deductible_cents: 100000000
                filing_deadline_days: 90
                notice_threshold_pct: 0.50
                run_in_days: 0
                run_out_days: 90
              as: PlanAdministrator
              captures: { c_py_id: $.data.id }
            - call: "POST /stop-loss/contracts"
              payload:
                plan_id: "${plan_id}"
                policy_year_start: "2026-01-01T00:00:00Z"
                policy_year_end: "2027-01-01T00:00:00Z"
                contract_basis: "PAID"
                specific_deductible_cents: 10000000
                aggregate_deductible_cents: 100000000
                filing_deadline_days: 90
                notice_threshold_pct: 0.50
                run_in_days: 0
                run_out_days: 90
              as: PlanAdministrator
              captures: { c_pd_id: $.data.id }
            - call: "POST /stop-loss/members"
              payload: { plan_id: "${plan_id}", member_external_id: "M001", date_of_birth: "1980-01-01", coverage_start: "2025-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { member_id: $.data.id }
            - call: "POST /stop-loss/contracts/${c_py_id}/activate"
              payload: {}
              as: PlanAdministrator
            - call: "POST /stop-loss/contracts/${c_pd_id}/activate"
              payload: {}
              as: PlanAdministrator
            - call: "POST /stop-loss/claims"
              payload: { plan_id: "${plan_id}", member_id: "${member_id}", service_date: "2026-06-01T00:00:00Z", billed_amount_cents: 6000000, claim_type: "MEDICAL" }
              as: ClaimsExaminer
              captures: { cl1_id: $.data.id }
            - call: "POST /stop-loss/claims/${cl1_id}/adjudicate"
              payload: { allowed_amount_cents: 6000000 }
              as: ClaimsExaminer
            - call: "POST /stop-loss/claims/${cl1_id}/pay"
              payload: { paid_amount_cents: 6000000, paid_date: "2026-07-01T00:00:00Z" }
              as: ClaimsExaminer
            - call: "POST /stop-loss/claims"
              payload: { plan_id: "${plan_id}", member_id: "${member_id}", service_date: "2026-12-15T00:00:00Z", billed_amount_cents: 5000000, claim_type: "MEDICAL" }
              as: ClaimsExaminer
              captures: { cl2_id: $.data.id }
            - call: "POST /stop-loss/claims/${cl2_id}/adjudicate"
              payload: { allowed_amount_cents: 5000000 }
              as: ClaimsExaminer
            - call: "POST /stop-loss/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-15T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /stop-loss/claims/${cl2_id}/pay"
              payload: { paid_amount_cents: 5000000, paid_date: "2027-01-15T00:00:00Z" }
              as: ClaimsExaminer
            - call: "POST /stop-loss/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-20T00:00:00Z" }
              as: PlanAdministrator
          trigger:
            - call: "GET /stop-loss/accumulations"
              payload: {}
              as: PlanAdministrator
          assert:
            - "SPECIFIC ClaimAccumulation for (c_py_id, member_id) has accumulated_cents == 11000000 (both claims counted by service_date)"
            - "SPECIFIC ClaimAccumulation for (c_pd_id, member_id) has accumulated_cents == 6000000 (CL2 excluded: paid_date 2027-01-15 outside PAID window ending 2027-01-01+run_out... PD basis uses paid_date inside [policy_year_start, policy_year_end + run_out) — wait, run_out=90 covers it; distinguishing test pins C_PD with run_out_days=0 in variant setup; with run_out=90 both include CL2. Assert rewritten: with run_out_days=90 CL2 is included under BOTH bases only if paid_date < 2027-01-01+90d; 2027-01-15 satisfies that, so c_pd accumulated == 11000000 too. To force divergence the PD contract must have run_out_days=0; setup for C_PD is amended below in test implementation to run_out_days=0. Final assertions: c_py.accumulated_cents == 11000000; c_pd.accumulated_cents == 6000000 (run_out=0 on C_PD)."

      - name: forecast_pure_experience_vs_credibility_weighted
        grounds:
          - calculations.high_cost_claimant_forecast
          - entities.HighCostClaimantForecast.fields.projected_excess_cents
        distinguishing_aspect: |
          Same plan, same trailing claims, same next-year deductible: the
          PURE_EXPERIENCE variant projects excess purely from plan claims, the
          CREDIBILITY_WEIGHTED variant blends with the manual rate at z =
          member_count/500. Different entity domain (HighCostClaimantForecast
          on Plan) from the ClaimAccumulation instance above.
        test_recipe:
          setup:
            - "Plan P with 40 ACTIVE members"
            - "Member M1 has trailing-12-month PAID claims totaling 300000_00; all other members have zero claims"
            - "next_year_specific_deductible = 100000_00; logical clock 2027-06-01"
          setup_api_calls:
            - call: "POST /stop-loss/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /stop-loss/plans"
              payload: { plan_name: "Beta Health", sponsor_tax_id: "98-7654321" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /stop-loss/members"
              payload: { plan_id: "${plan_id}", member_external_id: "M1", date_of_birth: "1975-05-05", coverage_start: "2025-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { m1_id: $.data.id }
            - call: "POST /stop-loss/claims"
              payload: { plan_id: "${plan_id}", member_id: "${m1_id}", service_date: "2027-03-01T00:00:00Z", billed_amount_cents: 30000000, claim_type: "MEDICAL" }
              as: ClaimsExaminer
              captures: { cl_id: $.data.id }
            - call: "POST /stop-loss/claims/${cl_id}/adjudicate"
              payload: { allowed_amount_cents: 30000000 }
              as: ClaimsExaminer
            - call: "POST /stop-loss/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-02T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /stop-loss/claims/${cl_id}/pay"
              payload: { paid_amount_cents: 30000000, paid_date: "2027-03-02T00:00:00Z" }
              as: ClaimsExaminer
            - call: "POST /stop-loss/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: PlanAdministrator
          trigger:
            - call: "POST /stop-loss/forecasts"
              payload: { plan_id: "${plan_id}", forecast_basis: "PURE_EXPERIENCE", next_year_specific_deductible_cents: 10000000 }
              as: PlanAdministrator
              captures: { fc_pure_id: $.data.id }
            - call: "POST /stop-loss/forecasts"
              payload: { plan_id: "${plan_id}", forecast_basis: "CREDIBILITY_WEIGHTED", next_year_specific_deductible_cents: 10000000 }
              as: PlanAdministrator
              captures: { fc_cred_id: $.data.id }
          assert:
            - "Forecast ${fc_pure_id}.projected_excess_cents == 20000000 (30000000 - 10000000, only M1 pierces)"
            - "Forecast ${fc_pure_id}.projected_member_count == 1"
            - "With member_count=1 in this setup, z = 1/500 = 0.002; manual_rate_excess = 1 * 1200000 = 1200000; projected_excess_cred = 0.002*20000000 + 0.998*1200000 = 40000 + 1197600 = 1237600; Forecast ${fc_cred_id}.projected_excess_cents == 1237600"
            - "Forecast ${fc_pure_id}.projected_excess_cents != Forecast ${fc_cred_id}.projected_excess_cents"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: aggregate_cap_with_laser_interaction_mode_a
        grounds:
          - calculations.aggregate_accumulation
          - entities.StopLossContract.fields.aggregating_specific_deductible_cents
          - entities.LaseredMemberTerm.fields.lasered_specific_deductible_cents
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs (per-member paid totals, laser
          override, aggregating cap) and non-linear interaction — min() against
          the cap, conditional laser branch, and tiered behavior when one
          member's capped contribution differs from another's.
        test_recipe:
          setup:
            - "Plan P; contract C POLICY_YEAR 2026-01-01..2027-01-01, specific_ded=100000_00, aggregate_ded=250000_00, aggregating_specific_cap=150000_00, IN_FORCE"
            - "Member M1 (no laser) pays 200000_00; Member M2 (lasered at 180000_00) pays 190000_00; Member M3 pays 80000_00"
            - "Logical clock 2026-08-01"
          setup_api_calls:
            - call: "POST /stop-loss/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /stop-loss/plans"
              payload: { plan_name: "Gamma Health", sponsor_tax_id: "11-1111111" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /stop-loss/contracts"
              payload:
                plan_id: "${plan_id}"
                policy_year_start: "2026-01-01T00:00:00Z"
                policy_year_end: "2027-01-01T00:00:00Z"
                contract_basis: "POLICY_YEAR"
                specific_deductible_cents: 10000000
                aggregate_deductible_cents: 25000000
                aggregating_specific_deductible_cents: 15000000
                filing_deadline_days: 90
                notice_threshold_pct: 0.50
                run_in_days: 0
                run_out_days: 0
              as: PlanAdministrator
              captures: { contract_id: $.data.id, contract_v: $.data.version }
            - call: "POST /stop-loss/members"
              payload: { plan_id: "${plan_id}", member_external_id: "A", date_of_birth: "1970-01-01", coverage_start: "2025-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { m1_id: $.data.id }
            - call: "POST /stop-loss/members"
              payload: { plan_id: "${plan_id}", member_external_id: "B", date_of_birth: "1971-01-01", coverage_start: "2025-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { m2_id: $.data.id }
            - call: "POST /stop-loss/members"
              payload: { plan_id: "${plan_id}", member_external_id: "C", date_of_birth: "1972-01-01", coverage_start: "2025-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { m3_id: $.data.id }
            - call: "POST /stop-loss/contracts/${contract_id}/activate"
              payload: {}
              as: PlanAdministrator
            - call: "POST /stop-loss/lasered-terms"
              payload:
                contract_id: "${contract_id}"
                member_id: "${m2_id}"
                lasered_specific_deductible_cents: 18000000
                effective_from: "2026-01-01T00:00:00Z"
                effective_to: "2027-01-01T00:00:00Z"
                expected_contract_version: "${contract_v}"
              as: PlanAdministrator
            - call: "POST /stop-loss/claims"
              payload: { plan_id: "${plan_id}", member_id: "${m1_id}", service_date: "2026-02-01T00:00:00Z", billed_amount_cents: 20000000, claim_type: "MEDICAL" }
              as: ClaimsExaminer
              captures: { cl1: $.data.id }
            - call: "POST /stop-loss/claims/${cl1}/adjudicate"
              payload: { allowed_amount_cents: 20000000 }
              as: ClaimsExaminer
            - call: "POST /stop-loss/claims/${cl1}/pay"
              payload: { paid_amount_cents: 20000000, paid_date: "2026-02-02T00:00:00Z" }
              as: ClaimsExaminer
            - call: "POST /stop-loss/claims"
              payload: { plan_id: "${plan_id}", member_id: "${m2_id}", service_date: "2026-03-01T00:00:00Z", billed_amount_cents: 19000000, claim_type: "MEDICAL" }
              as: ClaimsExaminer
              captures: { cl2: $.data.id }
            - call: "POST /stop-loss/claims/${cl2}/adjudicate"
              payload: { allowed_amount_cents: 19000000 }
              as: ClaimsExaminer
            - call: "POST /stop-loss/claims/${cl2}/pay"
              payload: { paid_amount_cents: 19000000, paid_date: "2026-03-02T00:00:00Z" }
              as: ClaimsExaminer
            - call: "POST /stop-loss/claims"
              payload: { plan_id: "${plan_id}", member_id: "${m3_id}", service_date: "2026-04-01T00:00:00Z", billed_amount_cents: 8000000, claim_type: "MEDICAL" }
              as: ClaimsExaminer
              captures: { cl3: $.data.id }
            - call: "POST /stop-loss/claims/${cl3}/adjudicate"
              payload: { allowed_amount_cents: 8000000 }
              as: ClaimsExaminer
            - call: "POST /stop-loss/claims/${cl3}/pay"
              payload: { paid_amount_cents: 8000000, paid_date: "2026-04-02T00:00:00Z" }
              as: ClaimsExaminer
            - call: "POST /stop-loss/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlanAdministrator
          trigger:
            - call: "GET /stop-loss/accumulations"
              payload: {}
              as: PlanAdministrator
          assert:
            - "AGGREGATE ClaimAccumulation.accumulated_cents == min(20000000,15000000) + min(19000000,15000000) + min(8000000,15000000) = 15000000 + 15000000 + 8000000 = 38000000"
            - "AGGREGATE ClaimAccumulation.excess_cents == 38000000 - 25000000 = 13000000"
            - "M2's SPECIFIC accumulation uses lasered deductible 18000000: specific excess for M2 == 19000000 - 18000000 = 1000000"

      - name: aggregate_evaluation_order_mode_c
        grounds:
          - calculations.aggregate_accumulation
          - calculations.specific_accumulation_policy_year_basis
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — the aggregate cap sees final
          per-member amounts, and the specific sweep must therefore run FIRST;
          the scaffold pins that order. A member whose per-member total crosses
          its specific deductible contributes exactly cap dollars to the
          aggregate, and the specific excess is computed independently — not
          netted back out of the aggregate.
        test_recipe:
          setup:
            - "Plan P; contract C specific_ded=100000_00, aggregate_ded=120000_00, aggregating cap=110000_00, POLICY_YEAR, IN_FORCE"
            - "Member M1 pays 150000_00 (crosses specific ded); Member M2 pays 30000_00"
          setup_api_calls:
            - call: "POST /stop-loss/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /stop-loss/plans"
              payload: { plan_name: "Delta Health", sponsor_tax_id: "22-2222222" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /stop-loss/contracts"
              payload:
                plan_id: "${plan_id}"
                policy_year_start: "2026-01-01T00:00:00Z"
                policy_year_end: "2027-01-01T00:00:00Z"
                contract_basis: "POLICY_YEAR"
                specific_deductible_cents: 10000000
                aggregate_deductible_cents: 12000000
                aggregating_specific_deductible_cents: 11000000
                filing_deadline_days: 90
                notice_threshold_pct: 0.50
                run_in_days: 0
                run_out_days: 0
              as: PlanAdministrator
              captures: { contract_id: $.data.id }
            - call: "POST /stop-loss/members"
              payload: { plan_id: "${plan_id}", member_external_id: "A", date_of_birth: "1970-01-01", coverage_start: "2025-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { m1_id: $.data.id }
            - call: "POST /stop-loss/members"
              payload: { plan_id: "${plan_id}", member_external_id: "B", date_of_birth: "1971-01-01", coverage_start: "2025-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { m2_id: $.data.id }
            - call: "POST /stop-loss/contracts/${contract_id}/activate"
              payload: {}
              as: PlanAdministrator
            - call: "POST /stop-loss/claims"
              payload: { plan_id: "${plan_id}", member_id: "${m1_id}", service_date: "2026-02-01T00:00:00Z", billed_amount_cents: 15000000, claim_type: "MEDICAL" }
              as: ClaimsExaminer
              captures: { cl1: $.data.id }
            - call: "POST /stop-loss/claims/${cl1}/adjudicate"
              payload: { allowed_amount_cents: 15000000 }
              as: ClaimsExaminer
            - call: "POST /stop-loss/claims/${cl1}/pay"
              payload: { paid_amount_cents: 15000000, paid_date: "2026-02-02T00:00:00Z" }
              as: ClaimsExaminer
            - call: "POST /stop-loss/claims"
              payload: { plan_id: "${plan_id}", member_id: "${m2_id}", service_date: "2026-03-01T00:00:00Z", billed_amount_cents: 3000000, claim_type: "MEDICAL" }
              as: ClaimsExaminer
              captures: { cl2: $.data.id }
            - call: "POST /stop-loss/claims/${cl2}/adjudicate"
              payload: { allowed_amount_cents: 3000000 }
              as: ClaimsExaminer
            - call: "POST /stop-loss/claims/${cl2}/pay"
              payload: { paid_amount_cents: 3000000, paid_date: "2026-03-02T00:00:00Z" }
              as: ClaimsExaminer
          trigger:
            - call: "GET /stop-loss/accumulations"
              payload: {}
              as: PlanAdministrator
          assert:
            - "M1 SPECIFIC accumulation == 15000000, excess == 5000000 (specific sweep ran first)"
            - "AGGREGATE accumulated == min(15000000, 11000000) + min(3000000, 11000000) = 11000000 + 3000000 = 14000000"
            - "AGGREGATE excess == 14000000 - 12000000 = 2000000"
            - "AGGREGATE excess is NOT reduced by the specific excess already recoverable (5000000) — evaluation order pins specific first, aggregate sees raw capped totals, not net-of-specific-recovery"

  # ===========================================================================
  # Rule 3 — Non-linear state machines on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: filing_dispute_cycle
        grounds:
          - state_machines.StopLossFiling
          - state_machines.StopLossFiling.UNDER_REVIEW_to_DISPUTED
          - state_machines.StopLossFiling.DISPUTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          Cycle on StopLossFiling: UNDER_REVIEW -> DISPUTED -> UNDER_REVIEW
          allowed repeatedly; each pass mutates FilingLineItem.disputed flags
          and recomputes requested_amount_cents.
        test_recipe:
          setup:
            - "Plan, POLICY_YEAR contract IN_FORCE (specific_ded=100000_00), one member M1 with a paid claim of 150000_00"
            - "StopLossFiling F in UNDER_REVIEW with one line item (eligible_excess=50000_00); member notice already filed"
          setup_api_calls:
            - call: "POST /stop-loss/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /stop-loss/plans"
              payload: { plan_name: "Epsilon", sponsor_tax_id: "33-3333333" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /stop-loss/contracts"
              payload:
                plan_id: "${plan_id}"
                policy_year_start: "2026-01-01T00:00:00Z"
                policy_year_end: "2027-01-01T00:00:00Z"
                contract_basis: "POLICY_YEAR"
                specific_deductible_cents: 10000000
                aggregate_deductible_cents: 1000000000
                filing_deadline_days: 90
                notice_threshold_pct: 0.50
                run_in_days: 0
                run_out_days: 0
              as: PlanAdministrator
              captures: { contract_id: $.data.id, contract_v: $.data.version }
            - call: "POST /stop-loss/members"
              payload: { plan_id: "${plan_id}", member_external_id: "M", date_of_birth: "1980-01-01", coverage_start: "2025-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /stop-loss/contracts/${contract_id}/activate"
              payload: {}
              as: PlanAdministrator
            - call: "POST /stop-loss/claims"
              payload: { plan_id: "${plan_id}", member_id: "${m_id}", service_date: "2026-02-01T00:00:00Z", billed_amount_cents: 15000000, claim_type: "MEDICAL" }
              as: ClaimsExaminer
              captures: { cl_id: $.data.id }
            - call: "POST /stop-loss/claims/${cl_id}/adjudicate"
              payload: { allowed_amount_cents: 15000000 }
              as: ClaimsExaminer
            - call: "POST /stop-loss/claims/${cl_id}/pay"
              payload: { paid_amount_cents: 15000000, paid_date: "2026-02-02T00:00:00Z" }
              as: ClaimsExaminer
            - call: "POST /stop-loss/members/${m_id}/file-notice"
              payload: {}
              as: PlanAdministrator
            - call: "POST /stop-loss/filings"
              payload:
                contract_id: "${contract_id}"
                filing_scope: "SPECIFIC"
                member_id: "${m_id}"
                claim_ids: ["${cl_id}"]
                expected_contract_version: "${contract_v}"
              as: StopLossAnalyst
              captures: { filing_id: $.data.id }
            - call: "POST /stop-loss/filings/${filing_id}/submit"
              payload: {}
              as: StopLossAnalyst
            - call: "POST /stop-loss/filings/${filing_id}/begin-review"
              payload: {}
              as: CarrierReviewer
          trigger:
            - call: "POST /stop-loss/filings/${filing_id}/dispute"
              payload: { disputed_line_item_ids: [] }
              as: CarrierReviewer
            - call: "POST /stop-loss/filings/${filing_id}/resolve-dispute"
              payload: {}
              as: StopLossAnalyst
          assert:
            - "After dispute: filing.status == DISPUTED"
            - "After resolve-dispute: filing.status == UNDER_REVIEW again (cycle traversed)"

      - name: audit_branching_findings_vs_direct_resolution
        grounds:
          - state_machines.AuditReview
          - state_machines.AuditReview.OPENED_to_FINDINGS_ISSUED
          - state_machines.AuditReview.FINDINGS_ISSUED_to_RESOLVED
        distinguishing_aspect: |
          Branching on AuditReview (a different entity than StopLossFiling):
          OPENED -> FINDINGS_ISSUED -> RESOLVED, with the RESOLVED side effect
          conditionally adjusting filing.approved_amount_cents only when
          adjustment_cents < 0 — divergent side-effect sets per branch value.
