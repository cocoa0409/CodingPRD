      - call: "POST /idv/method-attempts/${a2}/document-captures"
        payload: {document_type: RESIDENCE_PERMIT, required_feature_count: 10, passed_feature_count: 5, tamper_signal_count: 3, mrz_checksum_valid: false}
        as: ClientIntegrator
        as_user_id: "${client_id}"
      - call: "POST /idv/method-attempts/${a2}/finalize"
        payload: {}
        as: ClientIntegrator
        as_user_id: "${client_id}"
      - call: "GET /idv/verification-sessions/${s2}/manual-review-cases"
        payload: {}
        as: ReviewManager
        as_user_id: rm-1
        captures:
          c2: "$.data[0].id"
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: "2026-11-08T07:00:00Z"
        as: PlatformAdmin
        as_user_id: admin-1
      - call: POST /idv/verification-sessions
        payload:
          client_id: "${client_id}"
          external_subject_ref: subj-sw3
          requested_assurance_tier: BASIC
          subject_jurisdiction_code: US
        as: ClientIntegrator
        as_user_id: "${client_id}"
        captures: {s3: $.data.id}
      trigger:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: "2026-11-08T09:00:00Z"
