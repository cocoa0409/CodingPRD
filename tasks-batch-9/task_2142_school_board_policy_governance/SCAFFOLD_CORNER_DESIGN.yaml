              payload: { notice_code: "LUS-2026-030", policy_id: "${pol}", citation: "GC 54960", issued_on: "2026-08-01T00:00:00Z", compliance_deadline: "2026-12-15T00:00:00Z", required_action: "REVISE_EXISTING" }
              as: LegalUpdateService
              captures: { e_notice: $.data.error_id }
            - call: "POST /governance/manual-publications"
              payload: { publication_label: "2026-FALL", as_of_date: "2026-08-05T00:00:00Z" }
              as: PolicyAnalyst
              captures: { e_label: $.data.error_id }
            - call: "POST /governance/superintendent-evaluations"
              payload: { cycle_year: 2027, window_start_date: "2026-09-01T00:00:00Z", window_end_date: "2027-07-31T00:00:00Z", midyear_checkpoint_date: "2027-02-15T00:00:00Z", goal_count: 3, weight_instructional: 0.25, weight_fiscal: 0.25, weight_community: 0.25, weight_governance: 0.25 }
              as: BoardClerk
