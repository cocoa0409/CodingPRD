scenario: |
  1842. Fuel Terminal Rack Pricing & Allocation (refiner rack marketing desk): daily rack price setting by product & terminal, customer lifting rights & ratable allocation, exchange agreements between suppliers, BOL capture & inventory drawdown, additive injection & branded blending, tax jurisdiction determination at load, credit hold at the rack, shortage/allocation notice

domain_name: fuel-terminal-rack-pricing
api_prefix: /rack

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Terminal
    parent: null
    common_fields: true
    fields:
      - { name: terminal_code, type: string, source: input, description: "Unique terminal code, e.g. 'LAX-01'" }
      - { name: legal_name, type: string, source: input, description: "Legal name of the terminal operator" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code where terminal is located; drives default tax jurisdiction" }
      - { name: county_code, type: string, source: input, description: "County FIPS code; may add county-level motor-fuel excise" }
      - { name: city_code, type: string, source: input, description: "City code; may add city-level motor-fuel excise" }
      - { name: rack_status, type: enum, source: system, description: "OPEN | SHORTAGE | FROZEN. FROZEN blocks all liftings; SHORTAGE caps reservations at rationed share", constraints: "enum {OPEN, SHORTAGE, FROZEN}" }
      - { name: inventory_gallons, type: integer, source: computed, default: 0, description: "Live physical inventory across all products at this terminal; debited on BOL post, credited on BOL reversal" }
      - { name: daily_allocation_pool_gallons, type: integer, source: computed, default: 0, description: "Total gallons the terminal will honor today across all customers; set by AllocationNotice publish" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: product_code, type: string, source: input, description: "Unique product code, e.g. 'REG87', 'PREM93', 'ULSD'" }
      - { name: display_name, type: string, source: input, description: "Human-readable product name" }
      - { name: product_family, type: enum, source: input, description: "GASOLINE | DIESEL | JET — drives which additive packages and which excise tax tables apply", constraints: "enum {GASOLINE, DIESEL, JET}" }
      - { name: is_brandable, type: boolean, source: input, default: false, description: "Whether the product supports branded additive injection" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: customer_code, type: string, source: input, description: "Unique customer code" }
      - { name: legal_name, type: string, source: input, description: "Customer legal name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Credit ceiling in cents; lifting is denied when open_lifting_exposure_cents would exceed this" }
      - { name: open_lifting_exposure_cents, type: integer, source: computed, default: 0, description: "Read-only sum of gross_cents on all lifting tickets in state RESERVED or BOL_ISSUED (i.e., post-reservation pre-invoice); debited on reservation, credited on invoice or cancel" }
      - { name: credit_status, type: enum, source: system, default: "GOOD", description: "GOOD | HOLD. HOLD blocks new reservations and BOL capture", constraints: "enum {GOOD, HOLD}" }
      - { name: hold_reason, type: string, source: system, description: "Reason string recorded when credit_status transitions to HOLD; cleared on release" }

  - name: RackPriceSchedule
    parent: null
    common_fields: true
    fields:
      - { name: terminal_id, type: string, source: input, description: "FK -> Terminal.id; one active schedule per (terminal, product, effective_date) triple" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: effective_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) the price takes effect at 00:00 local terminal time" }
      - { name: posted_rack_cents_per_gal, type: integer, source: input, description: "Unbranded rack price in whole cents per gallon, before additives and taxes" }
      - { name: branded_premium_cents_per_gal, type: integer, source: input, default: 0, description: "Premium added per gallon when buyer elects branded additive injection" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | SUPERSEDED | VOIDED", constraints: "enum {DRAFT, PUBLISHED, SUPERSEDED, VOIDED}" }
      - { name: published_at, type: datetime, source: system, description: "Timestamp when schedule transitioned DRAFT→PUBLISHED; immutable once set" }

  - name: LiftingRight
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: terminal_id, type: string, source: input, description: "FK -> Terminal.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: contract_id, type: string, source: input, description: "FK -> SupplyContract.id" }
      - { name: daily_ratable_gallons, type: integer, source: input, description: "Customer's daily ratable entitlement under normal operations; allocations during SHORTAGE scale this down" }
      - { name: lifted_today_gallons, type: integer, source: computed, default: 0, description: "Gallons BOL-posted against this right today; resets at each AllocationNotice publish for the next effective_date" }
      - { name: reserved_gallons, type: integer, source: computed, default: 0, description: "Gallons currently held in RESERVED state; debited on reservation, credited on BOL post or reservation cancel" }
      - { name: allocated_gallons, type: integer, source: computed, default: 0, description: "Effective daily entitlement under the currently-PUBLISHED AllocationNotice; equals daily_ratable_gallons when no notice is published or terminal is OPEN, else the ratable_allocation output" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | EXPIRED", constraints: "enum {ACTIVE, SUSPENDED, EXPIRED}" }

  - name: SupplyContract
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: start_date, type: string, source: input, description: "ISO date contract becomes effective" }
      - { name: end_date, type: string, source: input, description: "ISO date contract expires; must be >= start_date" }
      - { name: volume_commitment_gallons, type: integer, source: input, description: "Total committed gallons over the contract term" }
      - { name: lifted_to_date_gallons, type: integer, source: computed, default: 0, description: "Cumulative gallons BOL-posted against any LiftingRight tied to this contract" }
      - { name: pricing_tier, type: enum, source: input, description: "RACK | RACK_MINUS_1 | RACK_MINUS_2 — discount tier applied at BOL price determination", constraints: "enum {RACK, RACK_MINUS_1, RACK_MINUS_2}" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | CLOSED | DEFAULTED", constraints: "enum {DRAFT, ACTIVE, CLOSED, DEFAULTED}" }

  - name: ExchangeAgreement
    parent: null
    common_fields: true
    fields:
      - { name: delivering_terminal_id, type: string, source: input, description: "FK -> Terminal.id; terminal that physically delivers product under the exchange" }
      - { name: receiving_supplier_code, type: string, source: input, description: "Opaque code identifying the counterparty supplier (no entity persisted; counterparty is external)" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: monthly_exchange_cap_gallons, type: integer, source: input, description: "Maximum gallons the delivering terminal will honor for this counterparty in a calendar month" }
      - { name: delivered_this_month_gallons, type: integer, source: computed, default: 0, description: "Gallons delivered under this agreement in the calendar month of the current logical clock" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACTIVE | SUSPENDED | TERMINATED", constraints: "enum {PROPOSED, ACTIVE, SUSPENDED, TERMINATED}" }

  - name: AllocationNotice
    parent: null
    common_fields: true
    fields:
      - { name: terminal_id, type: string, source: input, description: "FK -> Terminal.id" }
      - { name: effective_date, type: string, source: input, description: "ISO date this notice governs" }
      - { name: total_pool_gallons, type: integer, source: input, description: "Total gallons the terminal will sell across all customers on effective_date" }
      - { name: allocation_method, type: enum, source: input, description: "PRO_RATA | RATCHET — PRO_RATA divides pool proportional to daily_ratable_gallons; RATCHET gives each customer min(daily_ratable_gallons, equal_share) then redistributes surplus to customers still short", constraints: "enum {PRO_RATA, RATCHET}" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | SUPERSEDED", constraints: "enum {DRAFT, PUBLISHED, SUPERSEDED}" }
      - { name: published_at, type: datetime, source: system, description: "Timestamp when notice transitioned DRAFT→PUBLISHED" }

  - name: LiftingTicket
    parent: null
    common_fields: true
    fields:
      - { name: lifting_right_id, type: string, source: input, description: "FK -> LiftingRight.id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id (denormalized from LiftingRight for query convenience)" }
      - { name: terminal_id, type: string, source: input, description: "FK -> Terminal.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: requested_gallons, type: integer, source: input, description: "Gallons requested at reservation time" }
      - { name: branded, type: boolean, source: input, default: false, description: "If true, branded additive package is injected at load; requires product.is_brandable == true" }
      - { name: additive_package_code, type: string, source: input, description: "Required iff branded=true; selects the additive recipe" }
      - { name: unit_price_cents_per_gal, type: integer, source: computed, description: "Final per-gallon price pinned at BOL post; = posted_rack_cents_per_gal + (branded ? branded_premium_cents_per_gal : 0) − pricing_tier discount" }
      - { name: additive_cost_cents, type: integer, source: computed, default: 0, description: "Total additive injection cost in cents for this ticket; 0 when branded=false" }
      - { name: tax_cents, type: integer, source: computed, description: "Total motor-fuel tax cents; computed at BOL post via tax_jurisdiction_determination" }
      - { name: gross_cents, type: integer, source: computed, description: "gross_cents = requested_gallons * unit_price_cents_per_gal + additive_cost_cents + tax_cents; computed at BOL post" }
      - { name: bol_number, type: string, source: system, description: "Bill of lading number, minted when BOL posts; format 'BOL-<terminal_code>-<yyyymmdd>-<seq>'" }
      - { name: status, type: enum, source: system, description: "RESERVED | BOL_ISSUED | INVOICED | CANCELLED", constraints: "enum {RESERVED, BOL_ISSUED, INVOICED, CANCELLED}" }

  - name: BolEvent
    parent: null
    common_fields: false
    fields:
      - { name: lifting_ticket_id, type: string, source: system, description: "FK -> LiftingTicket.id" }
      - { name: event_type, type: enum, source: system, description: "RESERVED | POSTED | REVERSED | CANCELLED", constraints: "enum {RESERVED, POSTED, REVERSED, CANCELLED}" }
      - { name: event_payload, type: object, source: system, description: "Snapshot of computed price/tax/inventory deltas at event time" }
      - { name: occurred_at, type: datetime, source: system, description: "Logical clock timestamp when event was recorded" }

  - name: TaxJurisdictionRule
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_level, type: enum, source: input, description: "FEDERAL | STATE | COUNTY | CITY", constraints: "enum {FEDERAL, STATE, COUNTY, CITY}" }
      - { name: jurisdiction_code, type: string, source: input, description: "Code identifying the jurisdiction; e.g. 'US', 'CA', '06037' (county FIPS), 'LAX'" }
      - { name: product_family, type: enum, source: input, description: "GASOLINE | DIESEL | JET", constraints: "enum {GASOLINE, DIESEL, JET}" }
      - { name: rate_cents_per_gal, type: integer, source: input, description: "Excise tax rate in whole cents per gallon for this (level, jurisdiction, family)" }
      - { name: effective_start_date, type: string, source: input, description: "ISO date this rate becomes effective" }
      - { name: effective_end_date, type: string, source: input, description: "ISO date this rate expires; inclusive" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", constraints: "enum {ACTIVE, RETIRED}" }

  - name: CreditHoldLog
    parent: null
    common_fields: false
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: event_type, type: enum, source: system, description: "PLACED | RELEASED", constraints: "enum {PLACED, RELEASED}" }
      - { name: trigger_reason, type: string, source: system, description: "Why the hold event fired (OVER_LIMIT | MANUAL | SHORTAGE_ABUSE | RELEASED)" }
      - { name: open_exposure_cents_at_event, type: integer, source: system, description: "Snapshot of Customer.open_lifting_exposure_cents at the moment of the event" }
      - { name: occurred_at, type: datetime, source: system, description: "Logical clock timestamp when event was recorded" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RackPriceSchedule
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, VOIDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /rack/price-schedules/{scheduleId}/publish"
        actor: RackPriceAnalyst
        preconditions:
          - "Schedule must be in DRAFT (ERR_SCHEDULE_NOT_DRAFT)"
          - "effective_date must be >= logical-clock current date (ERR_SCHEDULE_DATE_IN_PAST)"
          - "posted_rack_cents_per_gal must be > 0 (ERR_INVALID_PRICE)"
          - "expected_terminal_version body field must equal Terminal.version (OCC; ERR_STALE_VERSION)"
        side_effects:
          - "Any other PUBLISHED schedule for the same (terminal_id, product_id, effective_date) triple transitions to SUPERSEDED"
          - "Terminal.version increments by 1"
          - "Bumps Terminal.updated_at"

      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (cascade when a newer DRAFT for the same (terminal, product, date) publishes)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DRAFT
        to: VOIDED
        trigger: "POST /rack/price-schedules/{scheduleId}/void"
        actor: RackPriceAnalyst
        preconditions:
          - "Schedule must be in DRAFT (ERR_SCHEDULE_NOT_DRAFT)"
        side_effects: []

  - entity: AllocationNotice
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /rack/allocation-notices/{noticeId}/publish"
        actor: AllocationManager
        preconditions:
          - "Notice must be in DRAFT (ERR_NOTICE_NOT_DRAFT)"
          - "effective_date must be >= logical-clock current date (ERR_NOTICE_DATE_IN_PAST)"
          - "total_pool_gallons must be > 0 (ERR_INVALID_POOL)"
        side_effects:
          - "Any other PUBLISHED notice for same (terminal_id, effective_date) → SUPERSEDED"
          - "Terminal.rack_status transitions OPEN→SHORTAGE if total_pool_gallons < sum of daily_ratable_gallons across ACTIVE LiftingRights at this terminal; otherwise stays OPEN"
          - "Terminal.daily_allocation_pool_gallons ← total_pool_gallons"
          - "Every ACTIVE LiftingRight at this terminal has lifted_today_gallons reset to 0 for the new effective_date"
          - "Terminal.version increments by 1"

      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (cascade when a newer DRAFT for same (terminal, date) publishes)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LiftingRight
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /rack/lifting-rights/{rightId}/suspend"
        actor: AllocationManager
        preconditions:
          - "Right must be in ACTIVE (ERR_RIGHT_NOT_ACTIVE)"
        side_effects:
          - "All RESERVED LiftingTickets referencing this right transition to CANCELLED; their reserved_gallons are credited back to LiftingRight.reserved_gallons"
          - "Customer.open_lifting_exposure_cents credited by the sum of gross_cents on those cancelled RESERVED tickets"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /rack/lifting-rights/{rightId}/reinstate"
        actor: AllocationManager
        preconditions:
          - "Right must be in SUSPENDED (ERR_RIGHT_NOT_SUSPENDED)"
          - "Customer.credit_status must be GOOD (ERR_CUSTOMER_ON_CREDIT_HOLD)"
        side_effects: []

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when SupplyContract.end_date < logical clock current date)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUSPENDED
        to: EXPIRED
        trigger: "system (automatic when SupplyContract.end_date < logical clock current date)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SupplyContract
    initial_state: DRAFT
    terminal_states: [CLOSED, DEFAULTED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /rack/supply-contracts/{contractId}/activate"
        actor: ContractAdministrator
        preconditions:
          - "Contract must be in DRAFT (ERR_CONTRACT_NOT_DRAFT)"
          - "start_date must be <= logical clock current date <= end_date (ERR_CONTRACT_NOT_IN_WINDOW)"
        side_effects: []

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /rack/supply-contracts/{contractId}/close"
        actor: ContractAdministrator
        preconditions:
          - "Contract must be in ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
          - "lifted_to_date_gallons must be >= volume_commitment_gallons (ERR_VOLUME_SHORTFALL) — else transition is to DEFAULTED"
        side_effects:
          - "All LiftingRights tied to this contract that are still ACTIVE transition to EXPIRED"

      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /rack/supply-contracts/{contractId}/close"
        actor: ContractAdministrator
        preconditions:
          - "Contract must be in ACTIVE"
          - "lifted_to_date_gallons < volume_commitment_gallons"
        side_effects:
          - "All LiftingRights tied to this contract that are still ACTIVE transition to EXPIRED"
          - "Customer.credit_status transitions GOOD→HOLD with hold_reason='CONTRACT_DEFAULT'; CreditHoldLog records PLACED event with trigger_reason=CONTRACT_DEFAULT"

  - entity: ExchangeAgreement
    initial_state: PROPOSED
    terminal_states: [TERMINATED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /rack/exchange-agreements/{agreementId}/activate"
        actor: ExchangeCoordinator
        preconditions:
          - "Agreement must be in PROPOSED (ERR_AGREEMENT_NOT_PROPOSED)"
        side_effects: []

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /rack/exchange-agreements/{agreementId}/suspend"
        actor: ExchangeCoordinator
        preconditions:
          - "Agreement must be in ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects: []

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /rack/exchange-agreements/{agreementId}/reinstate"
        actor: ExchangeCoordinator
        preconditions:
          - "Agreement must be in SUSPENDED (ERR_AGREEMENT_NOT_SUSPENDED)"
        side_effects: []

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /rack/exchange-agreements/{agreementId}/terminate"
        actor: ExchangeCoordinator
        preconditions:
          - "Agreement must be in ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects: []

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /rack/exchange-agreements/{agreementId}/terminate"
        actor: ExchangeCoordinator
        preconditions:
          - "Agreement must be in SUSPENDED"
        side_effects: []

  - entity: LiftingTicket
    initial_state: RESERVED
    terminal_states: [INVOICED, CANCELLED]
    transitions:
      - from: RESERVED
        to: BOL_ISSUED
        trigger: "POST /rack/lifting-tickets/{ticketId}/post-bol"
        actor: TerminalOperator
        preconditions:
          - "Ticket must be in RESERVED (ERR_TICKET_NOT_RESERVED)"
          - "Terminal.rack_status must NOT be FROZEN (ERR_TERMINAL_FROZEN)"
          - "Customer.credit_status must be GOOD (ERR_CUSTOMER_ON_CREDIT_HOLD)"
          - "Terminal.inventory_gallons must be >= requested_gallons (ERR_INSUFFICIENT_INVENTORY)"
          - "A PUBLISHED RackPriceSchedule must exist for (terminal_id, product_id, effective_date == logical clock date) (ERR_NO_PUBLISHED_PRICE)"
        side_effects:
          - "Compute unit_price_cents_per_gal via rack_price_determination"
          - "Compute additive_cost_cents via additive_injection_cost (0 if branded=false)"
          - "Compute tax_cents via tax_jurisdiction_determination"
          - "Compute gross_cents = requested_gallons * unit_price_cents_per_gal + additive_cost_cents + tax_cents"
          - "Mint bol_number"
          - "Terminal.inventory_gallons -= requested_gallons"
          - "LiftingRight.lifted_today_gallons += requested_gallons"
          - "LiftingRight.reserved_gallons -= requested_gallons"
          - "SupplyContract.lifted_to_date_gallons += requested_gallons"
          - "If ExchangeAgreement matches (terminal, product) and status==ACTIVE: ExchangeAgreement.delivered_this_month_gallons += requested_gallons"
          - "BolEvent POSTED appended"
          - "If Customer.open_lifting_exposure_cents (which already includes this ticket's gross_cents from reservation) > Customer.credit_limit_cents: Customer.credit_status → HOLD with hold_reason='OVER_LIMIT'; CreditHoldLog PLACED event"
          - "If Customer.open_lifting_exposure_cents > Customer.credit_limit_cents after gross_cents computed: this ticket still posts but Customer.credit_status → HOLD (contagion)"

      - from: RESERVED
        to: CANCELLED
        trigger: "POST /rack/lifting-tickets/{ticketId}/cancel"
        actor: TerminalOperator
        preconditions:
          - "Ticket must be in RESERVED (ERR_TICKET_NOT_RESERVED)"
        side_effects:
          - "LiftingRight.reserved_gallons -= requested_gallons"
          - "Customer.open_lifting_exposure_cents -= gross_cents"
          - "BolEvent CANCELLED appended"

      - from: BOL_ISSUED
        to: INVOICED
        trigger: "POST /rack/lifting-tickets/{ticketId}/invoice"
        actor: BillingClerk
        preconditions:
          - "Ticket must be in BOL_ISSUED (ERR_TICKET_NOT_BOL_ISSUED)"
        side_effects:
          - "Customer.open_lifting_exposure_cents -= gross_cents"

      - from: BOL_ISSUED
        to: RESERVED
        trigger: "POST /rack/lifting-tickets/{ticketId}/reverse-bol"
        actor: TerminalOperator
        preconditions:
          - "Ticket must be in BOL_ISSUED (ERR_TICKET_NOT_BOL_ISSUED)"
          - "Must be executed within 24 logical hours of the post-bol call (ERR_REVERSAL_WINDOW_EXPIRED)"
        side_effects:
          - "Terminal.inventory_gallons += requested_gallons (compensating action)"
          - "LiftingRight.lifted_today_gallons -= requested_gallons"
          - "LiftingRight.reserved_gallons += requested_gallons"
          - "SupplyContract.lifted_to_date_gallons -= requested_gallons"
          - "ExchangeAgreement.delivered_this_month_gallons -= requested_gallons (if previously incremented)"
          - "BolEvent REVERSED appended with original event_payload"
          - "Customer.open_lifting_exposure_cents unchanged (still includes gross_cents; ticket returns to RESERVED)"

  - entity: Customer
    initial_state: GOOD
    terminal_states: []
    transitions:
      - from: GOOD
        to: HOLD
        trigger: "system (cascade on post-bol when open_lifting_exposure_cents > credit_limit_cents) OR POST /rack/customers/{customerId}/place-hold"
        actor: system
        preconditions: []
        side_effects:
          - "CreditHoldLog PLACED event appended"
          - "hold_reason set on Customer"

      - from: HOLD
        to: GOOD
        trigger: "POST /rack/customers/{customerId}/release-hold"
        actor: CreditAnalyst
        preconditions:
          - "Customer must be in HOLD (ERR_CUSTOMER_NOT_ON_HOLD)"
        side_effects:
          - "CreditHoldLog RELEASED event appended"
          - "hold_reason cleared"

  - entity: Terminal
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: SHORTAGE
        trigger: "system (cascade on AllocationNotice publish when pool < sum of daily ratable)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SHORTAGE
        to: OPEN
        trigger: "system (cascade on AllocationNotice publish when pool >= sum of daily ratable)"
        actor: system
        preconditions: []
        side_effects: []

      - from: OPEN
        to: FROZEN
        trigger: "POST /rack/terminals/{terminalId}/freeze"
        actor: TerminalOperator
        preconditions:
          - "Terminal must be in OPEN (ERR_TERMINAL_NOT_OPEN)"
        side_effects: []

      - from: SHORTAGE
        to: FROZEN
        trigger: "POST /rack/terminals/{terminalId}/freeze"
        actor: TerminalOperator
        preconditions:
          - "Terminal must be in OPEN or SHORTAGE"
        side_effects: []

      - from: FROZEN
        to: OPEN
        trigger: "POST /rack/terminals/{terminalId}/unfreeze"
        actor: TerminalOperator
        preconditions:
          - "Terminal must be in FROZEN (ERR_TERMINAL_NOT_FROZEN)"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: price-publish-stale-terminal
    parent_entity: Terminal
    write_endpoint: "POST /rack/price-schedules/{scheduleId}/publish"
    occ_field: "expected_terminal_version"
    description: |
      Publishing a RackPriceSchedule against a Terminal whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just published a competing schedule for the same
      (terminal, product, effective_date) triple — which legitimately supersedes
      the prior under §3.2 — and the current writer's view of the terminal is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: allocation-publish-stale-terminal
    parent_entity: Terminal
    write_endpoint: "POST /rack/allocation-notices/{noticeId}/publish"
    occ_field: "expected_terminal_version"
    description: |
      Publishing an AllocationNotice against a Terminal whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just published a competing notice for the same
      (terminal, effective_date) pair — which legitimately supersedes the prior —
      and the current writer's view of the terminal is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: rack_price_determination
    trigger: "On LiftingTicket post-bol transition (RESERVED→BOL_ISSUED)"
    algorithm: tiered_pricing
    formula: |
      base = RackPriceSchedule.posted_rack_cents_per_gal
           for (ticket.terminal_id, ticket.product_id, effective_date == today)
      if ticket.branded:
        base += RackPriceSchedule.branded_premium_cents_per_gal
      discount_per_gal = case ticket.SupplyContract.pricing_tier:
                           RACK         -> 0
                           RACK_MINUS_1 -> 1
                           RACK_MINUS_2 -> 2
      unit_price_cents_per_gal = max(0, base - discount_per_gal)
    input_set: "Single PUBLISHED RackPriceSchedule matching (terminal, product, today). If multiple PUBLISHED exist for the triple (race), pick the one with latest published_at; tie-break by created_at ASC."
    constants:
      TIER_RACK_DISCOUNT: 0
      TIER_RACK_MINUS_1_DISCOUNT: 1
      TIER_RACK_MINUS_2_DISCOUNT: 2
    precision: "integer cents per gallon"
    variants:
      - name: provisional_at_reservation
        when: "Computed at ticket creation (RESERVED) using the price schedule in effect on the *reservation* date"
        difference: "Uses RackPriceSchedule published for the reservation's logical-clock date; if the published schedule changes between reservation and BOL post, the provisional price is discarded"
      - name: final_at_bol_post
        when: "Computed at post-bol using the price schedule in effect on the *post* date (logical clock at post time)"
        difference: "Re-reads the PUBLISHED schedule at post time; if a new schedule was published between reservation and post, the new price wins"

  - name: additive_injection_cost
    trigger: "On LiftingTicket post-bol when branded=true"
    algorithm: constraint_propagation
    formula: |
      # Per-additive rounding: each additive line is rounded to integer cents
      # BEFORE summation. Order matters: round-then-sum vs sum-then-round differ
      # by up to (n-1) cents on an n-line recipe.
      recipe = ADDITIVE_RECIPES[ticket.additive_package_code]   # list of (rate_per_gal_millicents, flat_fee_cents)
      total = 0
      for each (rate_millicents_per_gal, flat_fee_cents) in recipe:
        line_cents = round_half_up(ticket.requested_gallons * rate_millicents_per_gal / 1000.0) + flat_fee_cents
        total += line_cents   # sum of ROUNDED lines, not round of sum
      additive_cost_cents = total
    input_set: "The single additive recipe matching ticket.additive_package_code; ignored entirely when ticket.branded=false (cost = 0)"
    constants:
      ADDITIVE_RECIPES:
        PKG_A: [ { rate_millicents_per_gal: 250, flat_fee_cents: 500 }, { rate_millicents_per_gal: 100, flat_fee_cents: 0 } ]
        PKG_B: [ { rate_millicents_per_gal: 175, flat_fee_cents: 750 } ]
        PKG_C: [ { rate_millicents_per_gal: 333, flat_fee_cents: 0 }, { rate_millicents_per_gal: 167, flat_fee_cents: 250 }, { rate_millicents_per_gal: 100, flat_fee_cents: 0 } ]
    precision: "integer cents, round_half_up per line THEN sum (pinned order)"
    variants: []

  - name: tax_jurisdiction_determination
    trigger: "On LiftingTicket post-bol"
    algorithm: aggregation
    formula: |
      # Four-level stack: FEDERAL + STATE + COUNTY + CITY.
      # Each level selects the ACTIVE TaxJurisdictionRule matching
      #   (level, jurisdiction_code, product.product_family)
      # whose [effective_start_date, effective_end_date] (inclusive) contains
      # today's logical-clock date. For STATE, jurisdiction_code = terminal.state_code.
      # For COUNTY, jurisdiction_code = terminal.county_code.
      # For CITY, jurisdiction_code = terminal.city_code. For FEDERAL, 'US'.
      # If multiple ACTIVE rules match a single level, pick the one with the
      # LATEST effective_start_date; tie-break by created_at ASC.
      tax_cents = 0
      for level in [FEDERAL, STATE, COUNTY, CITY]:
        rule = select_active_rule(level, ticket.terminal, ticket.product, today)
        if rule is not None:
          tax_cents += ticket.requested_gallons * rule.rate_cents_per_gal
    input_set: "ACTIVE TaxJurisdictionRules matching terminal jurisdiction codes and product family, with [effective_start_date, effective_end_date] containing today"
    constants: {}
    precision: "integer cents (rate_cents_per_gal * gallons, no rounding needed since rate is whole cents)"
    variants:
      - name: branded_blend_tax_uplift
        when: "ticket.branded == true AND terminal.state_code == 'CA'"
        difference: "An additional 2 cents-per-gallon branded-blend uplift is added at the STATE level for California-branded loads (regulatory blend tax); applied BEFORE summing into tax_cents"

  - name: ratable_allocation
    trigger: "On AllocationNotice publish; recomputes each ACTIVE LiftingRight's effective daily entitlement for the notice's effective_date"
    algorithm: waterfall_allocation
    formula: |
      # PRO_RATA variant: each right gets
      #   allocation = floor(total_pool_gallons * daily_ratable_gallons / sum_daily_ratable)
      # Remainder gallons (from floor) are distributed one gallon at a time to
      # rights in order of (daily_ratable_gallons DESC, created_at ASC).
      #
      # RATCHET variant: two-pass waterfall.
      #   Pass 1: each right gets min(daily_ratable_gallons, equal_share) where
      #     equal_share = floor(total_pool_gallons / count_active_rights)
      #   Pass 2: surplus = total_pool_gallons - sum(allocated_pass1); distribute
      #     surplus iteratively to rights still short of their daily_ratable_gallons,
      #     one gallon at a time, in order of (daily_ratable_gallons DESC, created_at ASC).
      if notice.allocation_method == PRO_RATA:
        sum_ratable = sum(daily_ratable_gallons for right in active_rights)
        for right in active_rights:
          right.allocated_gallons = floor(notice.total_pool_gallons * right.daily_ratable_gallons / sum_ratable)
        remainder = notice.total_pool_gallons - sum(right.allocated_gallons)
        for right in sort(active_rights, by=(daily_ratable_gallons DESC, created_at ASC)):
          if remainder == 0: break
          right.allocated_gallons += 1
          remainder -= 1
      elif notice.allocation_method == RATCHET:
        equal_share = floor(notice.total_pool_gallons / len(active_rights))
        for right in active_rights:
          right.allocated_gallons = min(right.daily_ratable_gallons, equal_share)
        surplus = notice.total_pool_gallons - sum(right.allocated_gallons)
        while surplus > 0:
          short_rights = [r for r in active_rights if r.allocated_gallons < r.daily_ratable_gallons]
          if not short_rights: break
          for right in sort(short_rights, by=(daily_ratable_gallons DESC, created_at ASC)):
            if surplus == 0: break
            right.allocated_gallons += 1
            surplus -= 1
    input_set: "ACTIVE LiftingRights at this terminal (status==ACTIVE on the notice's effective_date); rights in SUSPENDED or EXPIRED are excluded from the pool"
    constants: {}
    precision: "integer gallons, floor for proportional shares, remainder/ratchet redistribution as defined"
    variants:
      - name: pro_rata
        when: "AllocationNotice.allocation_method == PRO_RATA"
        difference: "Single-pass proportional with floor + remainder redistribution"
      - name: ratchet
        when: "AllocationNotice.allocation_method == RATCHET"
        difference: "Two-pass waterfall: equal-share cap first, then surplus to rights still short"

  - name: credit_exposure_tracking
    trigger: "On LiftingTicket create (RESERVED), cancel, post-bol, reverse-bol, invoice"
    algorithm: aggregation
    formula: |
      # Customer.open_lifting_exposure_cents is the sum of gross_cents over all
      # tickets whose status is RESERVED or BOL_ISSUED. Tickets transition into
      # INVOICED or CANCELLED remove their gross_cents from the exposure.
      # At RESERVED time, gross_cents is provisionally computed using
      # rack_price_determination.provisional_at_reservation; at BOL_ISSUED it is
      # REPLACED by the final value (which may differ).
      Customer.open_lifting_exposure_cents =
        sum(t.gross_cents for t in LiftingTicket
            where t.customer_id == Customer.id
              and t.status in {RESERVED, BOL_ISSUED})
    input_set: "LiftingTickets with status in {RESERVED, BOL_ISSUED} for the customer"
    constants: {}
    precision: "integer cents"
    variants:
      - name: optimistic_at_reservation
        when: "At RESERVED creation, gross_cents is provisional"
        difference: "Uses provisional unit price; exposure may shift when ticket posts to BOL"
      - name: final_at_invoice
        when: "On INVOICED transition, gross_cents is final and removed from exposure"
        difference: "Exposure drops to reflect only open pipeline"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted to invoke this endpoint per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path-template ids reference existing resources; body FK references resolve"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition is allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (publish, void, suspend, reinstate, activate, close, terminate, freeze, unfreeze, post-bol, reverse-bol, cancel, invoice, place-hold, release-hold)"

  - priority: 5
    category: business_safety
    check: "Terminal.rack_status != FROZEN before post-bol"
    error_id: ERR_TERMINAL_FROZEN
    http_status: 409
    applies_to: "POST /rack/lifting-tickets/{ticketId}/post-bol"

  - priority: 6
    category: business_safety
    check: "Customer.credit_status == GOOD before ticket create or post-bol"
    error_id: ERR_CUSTOMER_ON_CREDIT_HOLD
    http_status: 402
    applies_to: "POST /rack/lifting-tickets, POST /rack/lifting-tickets/{ticketId}/post-bol"

  - priority: 7
    category: business_constraint
    check: "Requested gallons do not exceed LiftingRight.daily_ratable_gallons minus lifted_today_gallons minus reserved_gallons when terminal is in SHORTAGE (use allocated_gallons from ratable_allocation when notice is PUBLISHED for today)"
    error_id: ERR_ALLOCATION_EXCEEDED
    http_status: 422
    applies_to: "POST /rack/lifting-tickets"

  - priority: 8
    category: business_constraint
    check: "branded=true requires product.is_brandable == true and additive_package_code present in ADDITIVE_RECIPES"
    error_id: ERR_INVALID_ADDITIVE_PACKAGE
    http_status: 422
    applies_to: "POST /rack/lifting-tickets"

  - priority: 9
    category: business_constraint
    check: "Terminal.inventory_gallons >= requested_gallons at post-bol"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 422
    applies_to: "POST /rack/lifting-tickets/{ticketId}/post-bol"

  - priority: 10
    category: business_referential
    check: "PUBLISHED RackPriceSchedule exists for (terminal, product, today) at post-bol"
    error_id: ERR_NO_PUBLISHED_PRICE
    http_status: 422
    applies_to: "POST /rack/lifting-tickets/{ticketId}/post-bol"

  - priority: 11
    category: business_temporal
    check: "Reverse-bol within 24 logical hours of the post-bol call"
    error_id: ERR_REVERSAL_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /rack/lifting-tickets/{ticketId}/reverse-bol"

  - priority: 12
    category: business_temporal
    check: "effective_date on RackPriceSchedule and AllocationNotice is >= logical clock date at publish"
    error_id: ERR_SCHEDULE_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /rack/price-schedules/{id}/publish, POST /rack/allocation-notices/{id}/publish"

  - priority: 13
    category: business_fiscal
    check: "After adding this reservation, Customer.open_lifting_exposure_cents (including new provisional gross_cents) must be <= Customer.credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /rack/lifting-tickets"

  - priority: 14
    category: business_constraint
    check: "SupplyContract.volume_commitment_gallons satisfied before close transitions to CLOSED"
    error_id: ERR_VOLUME_SHORTFALL
    http_status: 422
    applies_to: "POST /rack/supply-contracts/{id}/close (when caller requests CLOSED outcome; server selects DEFAULTED otherwise — this error fires only when caller explicitly passes outcome=CLOSED and shortfall exists)"

  - priority: 15
    category: business_constraint
    check: "expected_terminal_version equals current Terminal.version on publish endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /rack/price-schedules/{id}/publish, POST /rack/allocation-notices/{id}/publish"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Terminal ---
  - method: POST
    path: "/rack/terminals"
    description: "Create a terminal"
    roles: [PlatformAdmin]
    code: 201
    input: [terminal_code, legal_name, state_code, county_code, city_code]
    output: Terminal
    side_effects: []

  - method: GET
    path: "/rack/terminals/{terminalId}"
    description: "Fetch a terminal"
    roles: [PlatformAdmin, RackPriceAnalyst, AllocationManager, TerminalOperator, ExchangeCoordinator, CreditAnalyst, BillingClerk, ContractAdministrator]
    code: 200
    input: []
    output: Terminal
    side_effects: []

  - method: GET
    path: "/rack/terminals"
    description: "List terminals"
    roles: [PlatformAdmin, RackPriceAnalyst, AllocationManager, TerminalOperator, ExchangeCoordinator, CreditAnalyst, BillingClerk, ContractAdministrator]
    code: 200
    input: ["state_code?", "rack_status?", "limit?", "offset?"]
    output: Terminal[]
    side_effects: []

  - method: POST
    path: "/rack/terminals/{terminalId}/freeze"
    description: "Freeze a terminal (block all liftings)"
    roles: [TerminalOperator]
    code: 200
    input: []
    output: Terminal
    side_effects: ["Terminal.rack_status OPEN|SHORTAGE → FROZEN", "increments Terminal.version"]

  - method: POST
    path: "/rack/terminals/{terminalId}/unfreeze"
    description: "Unfreeze a terminal"
    roles: [TerminalOperator]
    code: 200
    input: []
    output: Terminal
    side_effects: ["Terminal.rack_status FROZEN → OPEN", "increments Terminal.version"]

  - method: POST
    path: "/rack/terminals/{terminalId}/inventory/adjust"
    description: "Manual inventory adjustment (positive adds gallons, negative removes)"
    roles: [TerminalOperator]
    code: 200
    input: [delta_gallons, reason]
    output: Terminal
    side_effects: ["Terminal.inventory_gallons += delta_gallons", "increments Terminal.version"]

  # --- Product ---
  - method: POST
    path: "/rack/products"
    description: "Create a product"
    roles: [PlatformAdmin]
    code: 201
    input: [product_code, display_name, product_family, "is_brandable?"]
    output: Product
    side_effects: []

  - method: GET
    path: "/rack/products/{productId}"
    description: "Fetch a product"
    roles: [PlatformAdmin, RackPriceAnalyst, AllocationManager, TerminalOperator, ExchangeCoordinator, CreditAnalyst, BillingClerk, ContractAdministrator]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: GET
    path: "/rack/products"
    description: "List products"
    roles: [PlatformAdmin, RackPriceAnalyst, AllocationManager, TerminalOperator, ExchangeCoordinator, CreditAnalyst, BillingClerk, ContractAdministrator]
    code: 200
    input: ["product_family?", "limit?", "offset?"]
    output: Product[]
    side_effects: []

  # --- Customer ---
  - method: POST
    path: "/rack/customers"
    description: "Create a customer"
    roles: [PlatformAdmin]
    code: 201
    input: [customer_code, legal_name, credit_limit_cents]
    output: Customer
    side_effects: []

  - method: GET
    path: "/rack/customers/{customerId}"
    description: "Fetch a customer"
    roles: [PlatformAdmin, CreditAnalyst, BillingClerk, ContractAdministrator, TerminalOperator]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/rack/customers"
    description: "List customers"
    roles: [PlatformAdmin, CreditAnalyst, BillingClerk, ContractAdministrator]
    code: 200
    input: ["credit_status?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []

  - method: POST
    path: "/rack/customers/{customerId}/place-hold"
    description: "Manually place customer on credit hold"
    roles: [CreditAnalyst]
    code: 200
    input: [reason]
    output: Customer
    side_effects: ["Customer.credit_status GOOD→HOLD", "CreditHoldLog PLACED event"]

  - method: POST
    path: "/rack/customers/{customerId}/release-hold"
    description: "Release customer credit hold"
    roles: [CreditAnalyst]
    code: 200
    input: []
    output: Customer
    side_effects: ["Customer.credit_status HOLD→GOOD", "CreditHoldLog RELEASED event"]

  # --- SupplyContract ---
  - method: POST
    path: "/rack/supply-contracts"
    description: "Create a supply contract"
    roles: [ContractAdministrator]
    code: 201
    input: [customer_id, start_date, end_date, volume_commitment_gallons, pricing_tier]
    output: SupplyContract
    side_effects: []

  - method: GET
    path: "/rack/supply-contracts/{contractId}"
    description: "Fetch a supply contract"
    roles: [PlatformAdmin, ContractAdministrator, CreditAnalyst, BillingClerk]
    code: 200
    input: []
    output: SupplyContract
    side_effects: []

  - method: GET
    path: "/rack/supply-contracts"
    description: "List supply contracts (filterable by customer_id or status)"
    roles: [PlatformAdmin, ContractAdministrator, CreditAnalyst, BillingClerk]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: SupplyContract[]
    side_effects: []

  - method: POST
    path: "/rack/supply-contracts/{contractId}/activate"
    description: "Activate a supply contract"
    roles: [ContractAdministrator]
    code: 200
    input: []
    output: SupplyContract
    side_effects: ["SupplyContract DRAFT→ACTIVE"]

  - method: POST
    path: "/rack/supply-contracts/{contractId}/close"
    description: "Close a supply contract; transitions to CLOSED if volume met, DEFAULTED otherwise (or error if caller requests outcome=CLOSED explicitly and shortfall exists)"
    roles: [ContractAdministrator]
    code: 200
    input: ["outcome?"]
    output: SupplyContract
    side_effects: ["SupplyContract ACTIVE→CLOSED or ACTIVE→DEFAULTED", "cascade: ACTIVE LiftingRights → EXPIRED", "on DEFAULTED: Customer.credit_status GOOD→HOLD, CreditHoldLog PLACED"]

  # --- LiftingRight ---
  - method: POST
    path: "/rack/lifting-rights"
    description: "Create a lifting right for a customer at a terminal for a product under a contract"
    roles: [AllocationManager]
    code: 201
    input: [customer_id, terminal_id, product_id, contract_id, daily_ratable_gallons]
    output: LiftingRight
    side_effects: []

  - method: GET
    path: "/rack/lifting-rights/{rightId}"
    description: "Fetch a lifting right"
    roles: [PlatformAdmin, AllocationManager, TerminalOperator, ContractAdministrator]
    code: 200
    input: []
    output: LiftingRight
    side_effects: []

  - method: GET
    path: "/rack/lifting-rights"
    description: "List lifting rights"
    roles: [PlatformAdmin, AllocationManager, TerminalOperator, ContractAdministrator]
    code: 200
    input: ["customer_id?", "terminal_id?", "product_id?", "contract_id?", "status?", "limit?", "offset?"]
    output: LiftingRight[]
    side_effects: []

  - method: POST
    path: "/rack/lifting-rights/{rightId}/suspend"
    description: "Suspend a lifting right; cancels all RESERVED tickets"
    roles: [AllocationManager]
    code: 200
    input: []
    output: LiftingRight
    side_effects: ["LiftingRight ACTIVE→SUSPENDED", "cascade: RESERVED LiftingTickets→CANCELLED", "Customer.open_lifting_exposure_cents credited"]

  - method: POST
    path: "/rack/lifting-rights/{rightId}/reinstate"
    description: "Reinstate a suspended lifting right"
    roles: [AllocationManager]
    code: 200
    input: []
    output: LiftingRight
    side_effects: ["LiftingRight SUSPENDED→ACTIVE"]

  # --- RackPriceSchedule ---
  - method: POST
    path: "/rack/price-schedules"
    description: "Create a draft price schedule"
    roles: [RackPriceAnalyst]
    code: 201
    input: [terminal_id, product_id, effective_date, posted_rack_cents_per_gal, "branded_premium_cents_per_gal?"]
    output: RackPriceSchedule
    side_effects: []

  - method: GET
    path: "/rack/price-schedules/{scheduleId}"
    description: "Fetch a price schedule"
    roles: [PlatformAdmin, RackPriceAnalyst, TerminalOperator]
    code: 200
    input: []
    output: RackPriceSchedule
    side_effects: []

  - method: GET
    path: "/rack/price-schedules"
    description: "List price schedules"
    roles: [PlatformAdmin, RackPriceAnalyst, TerminalOperator]
    code: 200
    input: ["terminal_id?", "product_id?", "effective_date?", "status?", "limit?", "offset?"]
    output: RackPriceSchedule[]
    side_effects: []

  - method: POST
    path: "/rack/price-schedules/{scheduleId}/publish"
    description: "Publish a price schedule (OCC-guarded on Terminal.version); supersedes prior PUBLISHED for same (terminal, product, date)"
    roles: [RackPriceAnalyst]
    code: 200
    input: [expected_terminal_version]
    output: RackPriceSchedule
    side_effects: ["RackPriceSchedule DRAFT→PUBLISHED", "prior PUBLISHED for same triple → SUPERSEDED", "increments Terminal.version"]

  - method: POST
    path: "/rack/price-schedules/{scheduleId}/void"
    description: "Void a draft price schedule"
    roles: [RackPriceAnalyst]
    code: 200
    input: []
    output: RackPriceSchedule
    side_effects: ["RackPriceSchedule DRAFT→VOIDED"]

  # --- AllocationNotice ---
  - method: POST
    path: "/rack/allocation-notices"
    description: "Create a draft allocation notice"
    roles: [AllocationManager]
    code: 201
    input: [terminal_id, effective_date, total_pool_gallons, allocation_method]
    output: AllocationNotice
    side_effects: []

  - method: GET
    path: "/rack/allocation-notices/{noticeId}"
    description: "Fetch an allocation notice"
    roles: [PlatformAdmin, AllocationManager, TerminalOperator]
    code: 200
    input: []
    output: AllocationNotice
    side_effects: []

  - method: GET
    path: "/rack/allocation-notices"
    description: "List allocation notices"
    roles: [PlatformAdmin, AllocationManager, TerminalOperator]
    code: 200
    input: ["terminal_id?", "effective_date?", "status?", "limit?", "offset?"]
    output: AllocationNotice[]
    side_effects: []

  - method: POST
    path: "/rack/allocation-notices/{noticeId}/publish"
    description: "Publish an allocation notice (OCC-guarded on Terminal.version)"
    roles: [AllocationManager]
    code: 200
    input: [expected_terminal_version]
    output: AllocationNotice
    side_effects: ["AllocationNotice DRAFT→PUBLISHED", "prior PUBLISHED for same (terminal, date) → SUPERSEDED", "Terminal.rack_status re-evaluated", "LiftingRight.lifted_today_gallons reset", "increments Terminal.version"]

  # --- ExchangeAgreement ---
  - method: POST
    path: "/rack/exchange-agreements"
    description: "Create an exchange agreement"
    roles: [ExchangeCoordinator]
    code: 201
    input: [delivering_terminal_id, receiving_supplier_code, product_id, monthly_exchange_cap_gallons]
    output: ExchangeAgreement
    side_effects: []

  - method: GET
    path: "/rack/exchange-agreements/{agreementId}"
    description: "Fetch an exchange agreement"
    roles: [PlatformAdmin, ExchangeCoordinator, TerminalOperator]
    code: 200
    input: []
    output: ExchangeAgreement
    side_effects: []

  - method: GET
    path: "/rack/exchange-agreements"
    description: "List exchange agreements"
    roles: [PlatformAdmin, ExchangeCoordinator, TerminalOperator]
    code: 200
    input: ["delivering_terminal_id?", "product_id?", "status?", "limit?", "offset?"]
    output: ExchangeAgreement[]
    side_effects: []

  - method: POST
    path: "/rack/exchange-agreements/{agreementId}/activate"
    description: "Activate an exchange agreement"
    roles: [ExchangeCoordinator]
    code: 200
    input: []
    output: ExchangeAgreement
    side_effects: ["ExchangeAgreement PROPOSED→ACTIVE"]

  - method: POST
    path: "/rack/exchange-agreements/{agreementId}/suspend"
    description: "Suspend an exchange agreement"
    roles: [ExchangeCoordinator]
    code: 200
    input: []
    output: ExchangeAgreement
    side_effects: ["ExchangeAgreement ACTIVE→SUSPENDED"]

  - method: POST
    path: "/rack/exchange-agreements/{agreementId}/reinstate"
    description: "Reinstate a suspended exchange agreement"
    roles: [ExchangeCoordinator]
    code: 200
    input: []
    output: ExchangeAgreement
    side_effects: ["ExchangeAgreement SUSPENDED→ACTIVE"]

  - method: POST
    path: "/rack/exchange-agreements/{agreementId}/terminate"
    description: "Terminate an exchange agreement"
    roles: [ExchangeCoordinator]
    code: 200
    input: []
    output: ExchangeAgreement
    side_effects: ["ExchangeAgreement ACTIVE|SUSPENDED→TERMINATED"]

  # --- LiftingTicket ---
  - method: POST
    path: "/rack/lifting-tickets"
    description: "Reserve a lifting (creates ticket in RESERVED state, computes provisional gross_cents)"
    roles: [TerminalOperator]
    code: 201
    input: [lifting_right_id, requested_gallons, "branded?", "additive_package_code?"]
    output: LiftingTicket
    side_effects: ["LiftingTicket created RESERVED", "provisional gross_cents computed", "LiftingRight.reserved_gallons += requested_gallons", "Customer.open_lifting_exposure_cents += provisional gross_cents"]

  - method: GET
    path: "/rack/lifting-tickets/{ticketId}"
    description: "Fetch a lifting ticket"
    roles: [PlatformAdmin, TerminalOperator, BillingClerk, AllocationManager, CreditAnalyst]
    code: 200
    input: []
    output: LiftingTicket
    side_effects: []

  - method: GET
    path: "/rack/lifting-tickets"
    description: "List lifting tickets"
    roles: [PlatformAdmin, TerminalOperator, BillingClerk, AllocationManager, CreditAnalyst]
    code: 200
    input: ["lifting_right_id?", "customer_id?", "terminal_id?", "product_id?", "status?", "limit?", "offset?"]
    output: LiftingTicket[]
    side_effects: []

  - method: POST
    path: "/rack/lifting-tickets/{ticketId}/post-bol"
    description: "Capture BOL and post the lifting (finalizes pricing/tax, debits inventory)"
    roles: [TerminalOperator]
    code: 200
    input: []
    output: LiftingTicket
    side_effects: ["LiftingTicket RESERVED→BOL_ISSUED", "final price/tax/gross_cents computed", "Terminal.inventory_gallons -= requested_gallons", "LiftingRight.lifted_today_gallons += requested_gallons", "SupplyContract.lifted_to_date_gallons += requested_gallons", "ExchangeAgreement.delivered_this_month_gallons incremented when applicable", "BolEvent POSTED", "contagion: credit hold placed if exposure > limit"]

  - method: POST
    path: "/rack/lifting-tickets/{ticketId}/reverse-bol"
    description: "Reverse a posted BOL within 24 logical hours (compensating action)"
    roles: [TerminalOperator]
    code: 200
    input: []
    output: LiftingTicket
    side_effects: ["LiftingTicket BOL_ISSUED→RESERVED", "Terminal.inventory_gallons += requested_gallons", "LiftingRight.lifted_today_gallons -= requested_gallons", "LiftingRight.reserved_gallons += requested_gallons", "SupplyContract.lifted_to_date_gallons -= requested_gallons", "ExchangeAgreement.delivered_this_month_gallons decremented when applicable", "BolEvent REVERSED"]

  - method: POST
    path: "/rack/lifting-tickets/{ticketId}/cancel"
    description: "Cancel a RESERVED ticket"
    roles: [TerminalOperator]
    code: 200
    input: []
    output: LiftingTicket
    side_effects: ["LiftingTicket RESERVED→CANCELLED", "LiftingRight.reserved_gallons -= requested_gallons", "Customer.open_lifting_exposure_cents -= gross_cents", "BolEvent CANCELLED"]

  - method: POST
    path: "/rack/lifting-tickets/{ticketId}/invoice"
    description: "Invoice a BOL_ISSUED ticket (removes exposure, finalizes revenue)"
    roles: [BillingClerk]
    code: 200
    input: []
    output: LiftingTicket
    side_effects: ["LiftingTicket BOL_ISSUED→INVOICED", "Customer.open_lifting_exposure_cents -= gross_cents"]

  # --- BolEvent (read-only audit) ---
  - method: GET
    path: "/rack/bol-events/{eventId}"
    description: "Fetch a single BOL event"
    roles: [PlatformAdmin, TerminalOperator, BillingClerk]
    code: 200
    input: []
    output: BolEvent
    side_effects: []

  - method: GET
    path: "/rack/bol-events"
    description: "List BOL events (filterable by ticket)"
    roles: [PlatformAdmin, TerminalOperator, BillingClerk]
    code: 200
    input: ["lifting_ticket_id?", "event_type?", "limit?", "offset?"]
    output: BolEvent[]
    side_effects: []

  # --- TaxJurisdictionRule ---
  - method: POST
    path: "/rack/tax-rules"
    description: "Create a tax jurisdiction rule"
    roles: [PlatformAdmin]
    code: 201
    input: [jurisdiction_level, jurisdiction_code, product_family, rate_cents_per_gal, effective_start_date, effective_end_date]
    output: TaxJurisdictionRule
    side_effects: []

  - method: GET
    path: "/rack/tax-rules/{ruleId}"
    description: "Fetch a tax rule"
    roles: [PlatformAdmin, RackPriceAnalyst, TerminalOperator]
    code: 200
    input: []
    output: TaxJurisdictionRule
    side_effects: []

  - method: GET
    path: "/rack/tax-rules"
    description: "List tax rules"
    roles: [PlatformAdmin, RackPriceAnalyst, TerminalOperator]
    code: 200
    input: ["jurisdiction_level?", "jurisdiction_code?", "product_family?", "status?", "limit?", "offset?"]
    output: TaxJurisdictionRule[]
    side_effects: []

  # --- CreditHoldLog (read-only audit) ---
  - method: GET
    path: "/rack/credit-hold-logs/{logId}"
    description: "Fetch a single credit hold log event"
    roles: [PlatformAdmin, CreditAnalyst]
    code: 200
    input: []
    output: CreditHoldLog
    side_effects: []

  - method: GET
    path: "/rack/credit-hold-logs"
    description: "List credit hold log events"
    roles: [PlatformAdmin, CreditAnalyst]
    code: 200
    input: ["customer_id?", "event_type?", "limit?", "offset?"]
    output: CreditHoldLog[]
    side_effects: []

  # --- Test-driving clock endpoint ---
  - method: POST
    path: "/rack/_clock/set_current_utc"
    description: "Set the server's logical clock to a specific ISO8601 UTC timestamp. On server start the clock defaults to 2026-08-01T00:00:00Z and does NOT track wall-clock time; this endpoint is the only way to advance it."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Logical clock set", "system transitions fire: LiftingRight EXPIRED cascade when contract end_date passed"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted to invoke this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failure (wrong from-state)" }
  - { id: ERR_SCHEDULE_NOT_DRAFT, http: 409, condition: "RackPriceSchedule must be DRAFT for publish/void" }
  - { id: ERR_NOTICE_NOT_DRAFT, http: 409, condition: "AllocationNotice must be DRAFT for publish" }
  - { id: ERR_SCHEDULE_DATE_IN_PAST, http: 422, condition: "effective_date is before logical clock current date at publish" }
  - { id: ERR_NOTICE_DATE_IN_PAST, http: 422, condition: "AllocationNotice effective_date is before logical clock current date at publish" }
  - { id: ERR_INVALID_PRICE, http: 422, condition: "posted_rack_cents_per_gal must be > 0" }
  - { id: ERR_INVALID_POOL, http: 422, condition: "total_pool_gallons must be > 0" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_terminal_version does not match current Terminal.version (OCC)" }
  - { id: ERR_RIGHT_NOT_ACTIVE, http: 409, condition: "LiftingRight must be ACTIVE for this operation" }
  - { id: ERR_RIGHT_NOT_SUSPENDED, http: 409, condition: "LiftingRight must be SUSPENDED for reinstate" }
  - { id: ERR_CONTRACT_NOT_DRAFT, http: 409, condition: "SupplyContract must be DRAFT for activate" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "SupplyContract must be ACTIVE for close" }
  - { id: ERR_CONTRACT_NOT_IN_WINDOW, http: 422, condition: "Current logical date not within [start_date, end_date] at activate" }
  - { id: ERR_VOLUME_SHORTFALL, http: 422, condition: "Caller explicitly requested CLOSED but lifted_to_date_gallons < volume_commitment_gallons" }
  - { id: ERR_AGREEMENT_NOT_PROPOSED, http: 409, condition: "ExchangeAgreement must be PROPOSED for activate" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "ExchangeAgreement must be ACTIVE for this operation" }
  - { id: ERR_AGREEMENT_NOT_SUSPENDED, http: 409, condition: "ExchangeAgreement must be SUSPENDED for reinstate" }
  - { id: ERR_TICKET_NOT_RESERVED, http: 409, condition: "LiftingTicket must be RESERVED for this operation" }
  - { id: ERR_TICKET_NOT_BOL_ISSUED, http: 409, condition: "LiftingTicket must be BOL_ISSUED for this operation" }
  - { id: ERR_TERMINAL_FROZEN, http: 409, condition: "Terminal.rack_status == FROZEN at post-bol" }
  - { id: ERR_TERMINAL_NOT_OPEN, http: 409, condition: "Terminal must be OPEN for freeze from OPEN" }
  - { id: ERR_TERMINAL_NOT_FROZEN, http: 409, condition: "Terminal must be FROZEN for unfreeze" }
  - { id: ERR_CUSTOMER_ON_CREDIT_HOLD, http: 402, condition: "Customer.credit_status == HOLD; ticket create and post-bol are blocked" }
  - { id: ERR_CUSTOMER_NOT_ON_HOLD, http: 409, condition: "Customer must be in HOLD for release-hold" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Reservation would push Customer.open_lifting_exposure_cents over credit_limit_cents" }
  - { id: ERR_ALLOCATION_EXCEEDED, http: 422, condition: "Requested gallons exceed allocated share under SHORTAGE (or exceed daily ratable under OPEN)" }
  - { id: ERR_INVALID_ADDITIVE_PACKAGE, http: 422, condition: "branded=true on non-brandable product, or unknown additive_package_code" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 422, condition: "Terminal.inventory_gallons < requested_gallons at post-bol" }
  - { id: ERR_NO_PUBLISHED_PRICE, http: 422, condition: "No PUBLISHED RackPriceSchedule covers (terminal, product, today)" }
  - { id: ERR_REVERSAL_WINDOW_EXPIRED, http: 422, condition: "Reverse-bol invoked more than 24 logical hours after post-bol" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Superuser; manages terminals, products, customers, tax rules, clock"
    identity: opaque
    exclusive_operations:
      - "POST /rack/terminals"
      - "POST /rack/products"
      - "POST /rack/customers"
      - "POST /rack/tax-rules"
      - "POST /rack/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: RackPriceAnalyst
    description: "Owns daily rack price setting"
    identity: opaque
    exclusive_operations:
      - "POST /rack/price-schedules"
      - "POST /rack/price-schedules/{id}/publish"
      - "POST /rack/price-schedules/{id}/void"
    shared_operations:
      - "GET /rack/terminals*"
      - "GET /rack/products*"
      - "GET /rack/price-schedules*"
      - "GET /rack/tax-rules*"

  - name: AllocationManager
    description: "Owns lifting rights and allocation notices"
    identity: opaque
    exclusive_operations:
      - "POST /rack/lifting-rights"
      - "POST /rack/lifting-rights/{id}/suspend"
      - "POST /rack/lifting-rights/{id}/reinstate"
      - "POST /rack/allocation-notices"
      - "POST /rack/allocation-notices/{id}/publish"
    shared_operations:
      - "GET /rack/terminals*"
      - "GET /rack/lifting-rights*"
      - "GET /rack/allocation-notices*"
      - "GET /rack/lifting-tickets*"

  - name: TerminalOperator
    description: "Operates the rack; captures BOLs and manages inventory"
    identity: opaque
    exclusive_operations:
      - "POST /rack/terminals/{id}/freeze"
      - "POST /rack/terminals/{id}/unfreeze"
      - "POST /rack/terminals/{id}/inventory/adjust"
      - "POST /rack/lifting-tickets"
      - "POST /rack/lifting-tickets/{id}/post-bol"
      - "POST /rack/lifting-tickets/{id}/reverse-bol"
      - "POST /rack/lifting-tickets/{id}/cancel"
    shared_operations:
      - "GET /rack/terminals*"
      - "GET /rack/lifting-tickets*"
      - "GET /rack/lifting-rights*"
      - "GET /rack/allocation-notices*"
      - "GET /rack/price-schedules*"
      - "GET /rack/products*"
      - "GET /rack/tax-rules*"
      - "GET /rack/bol-events*"

  - name: ExchangeCoordinator
    description: "Manages exchange agreements between suppliers"
    identity: opaque
    exclusive_operations:
      - "POST /rack/exchange-agreements"
      - "POST /rack/exchange-agreements/{id}/activate"
      - "POST /rack/exchange-agreements/{id}/suspend"
      - "POST /rack/exchange-agreements/{id}/reinstate"
      - "POST /rack/exchange-agreements/{id}/terminate"
    shared_operations:
      - "GET /rack/exchange-agreements*"
      - "GET /rack/terminals*"
      - "GET /rack/products*"

  - name: CreditAnalyst
    description: "Manages customer credit holds (segregated from contract administration and billing)"
    identity: opaque
    exclusive_operations:
      - "POST /rack/customers/{id}/place-hold"
      - "POST /rack/customers/{id}/release-hold"
    shared_operations:
      - "GET /rack/customers*"
      - "GET /rack/credit-hold-logs*"
      - "GET /rack/supply-contracts*"
      - "GET /rack/lifting-tickets*"

  - name: BillingClerk
    description: "Invoices posted liftings"
    identity: opaque
    exclusive_operations:
      - "POST /rack/lifting-tickets/{id}/invoice"
    shared_operations:
      - "GET /rack/lifting-tickets*"
      - "GET /rack/customers*"
      - "GET /rack/bol-events*"
      - "GET /rack/supply-contracts*"

  - name: ContractAdministrator
    description: "Owns supply contracts; segregated from credit actions (cannot place/release holds)"
    identity: opaque
    exclusive_operations:
      - "POST /rack/supply-contracts"
      - "POST /rack/supply-contracts/{id}/activate"
      - "POST /rack/supply-contracts/{id}/close"
    shared_operations:
      - "GET /rack/supply-contracts*"
      - "GET /rack/customers*"
      - "GET /rack/lifting-rights*"
