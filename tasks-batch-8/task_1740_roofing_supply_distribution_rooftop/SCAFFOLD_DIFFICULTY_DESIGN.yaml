              captures: { ca_l1_v2: $.data.version }
          trigger:
            - call: "POST /roofing/orders/${ord_l1b}/confirm"
              payload: { expected_contractor_account_version: "${ca_l1_v2}" }
              as: Contractor
              as_user_id: "${ca_l1}"
              captures: { err_l1: $.data.error_id }
          assert:
            - "Second confirm rejected with ERR_LIEN_BLOCKS_ORDER (cascade end-state)"
            - "ContractorAccount.${ca_l1}.status == LIEN_DEFAULT"

      - name: surge_close_cascades_to_allocation_expiry_and_pool_release
        grounds:
          - state_machines.StormSurgeEvent.ACTIVE_to_CLOSED
          - state_machines.Allocation.transitions
        distinguishing_aspect: |
          Depth-2 cascade with a different trigger than the lien chain:
          closing a StormSurgeEvent mutates its child Allocations to EXPIRED,
          and each allocation expiry itself releases granted-but-unconsumed
          bundles back into the event's allocated_bundles ledger — the pool
          change is caused by the allocation transition, not directly by the
          close call.
        test_recipe:
          setup:
            - "Surge event ACTIVE with pool 1000; VOLUME-tier contractor (cap 500) requests 400 -> GRANTED 400, none consumed"
            - "Close the event"
          setup_api_calls:
            - call: "POST /roofing/branches"
              payload: { branch_code: "BR-S1", name: "Surge", rooftop_delivery_capacity_per_day: 4, conveyor_fleet_size: 2, crane_available: true }
              as: PlatformAdmin
              captures: { br_s1: $.data.id }
            - call: "POST /roofing/products"
              payload: { sku: "SH-S1", manufacturer_name: "Acme", color_code: "WHT", bundles_per_square: 3.0, base_price_per_bundle_cents: 3000 }
              as: PlatformAdmin
              captures: { prod_s1: $.data.id }
            - call: "POST /roofing/branches/${br_s1}/inventory-lots"
              payload: { product_id: "${prod_s1}", lot_code: "LOT-S", on_hand_bundles: 2000 }
              as: WarehouseClerk
            - call: "POST /roofing/contractor-accounts"
              payload: { company_name: "Surge Co", credit_limit_cents: 10000000, pricing_tier: "VOLUME" }
              as: CreditAnalyst
              captures: { ca_s1: $.data.id }
            - call: "POST /roofing/branches/${br_s1}/surge-events"
              payload: { event_name: "Hail-S1", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-31T23:59:59Z", surge_multiplier_pct: 10, allocation_pool_bundles: 1000 }
              as: BranchManager
              captures: { ev_s1: $.data.id }
            - call: "POST /roofing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roofing/surge-events/${ev_s1}/allocations"
              payload: { contractor_account_id: "${ca_s1}", product_id: "${prod_s1}", requested_bundles: 400 }
              as: Contractor
              as_user_id: "${ca_s1}"
              captures: { al_s1: $.data.id }
            - call: "GET /roofing/surge-events/${ev_s1}"
              payload: {}
              as: BranchManager
              captures: { ev_s1_v: $.data.version }
            - call: "POST /roofing/allocations/${al_s1}/grant"
              payload: { expected_storm_surge_event_version: "${ev_s1_v}" }
              as: BranchManager
          trigger:
            - call: "POST /roofing/surge-events/${ev_s1}/close"
              payload: {}
              as: BranchManager
          assert:
            - "StormSurgeEvent.${ev_s1}.status == CLOSED"
            - "Branch.${br_s1}.surge_mode == NORMAL"
            - "Allocation.${al_s1}.status == EXPIRED"
            - "StormSurgeEvent.${ev_s1}.allocated_bundles == 0 (unconsumed 400 released; consumed 0 because no order was confirmed)"

  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict: two DIFFERENT error-category
  # pairs. Instance 1 = state vs business_fiscal. Instance 2 =
  # business_safety vs business_referential.
