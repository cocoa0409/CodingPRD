  - rule_id: cross_entity_state_dependency
    instances:
      - name: agreement_reinstatement_reads_the_carrier_standing
        grounds:
          - state_machines.ServiceAgreement.SUSPENDED_to_ACTIVE
          - state_machines.Carrier
          - validations.priority_8
          - errors.ERR_CARRIER_NOT_IN_GOOD_STANDING
          - endpoints.POST_/eas/service-agreements/{id}/status-actions
        dependency_pair:
          dependent: "ServiceAgreement SUSPENDED -> ACTIVE"
          depended_on: "Carrier.status IN {ACTIVE, PROBATION}"
        distinguishing_aspect: |
          The dependency runs child -> parent and is *asymmetric with the cascade that created it*:
          suspending the Carrier pushes its ACTIVE agreements to SUSPENDED automatically, but
          reinstating the Carrier does not pull them back — each agreement needs its own REINSTATE,
          and that REINSTATE reads the Carrier's current standing. The permitted set is two-valued
          ({ACTIVE, PROBATION}), so PROBATION must be shown to pass while SUSPENDED and DEBARRED fail.
        test_recipe:
          setup:
            - "Community HYS SUBSIDIZED under ACTIVE agreement A1 (Prairie Air, 1600000.00, term 24)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eas/communities"
              payload: { code: "HYS", name: "Hays", state_code: "KS", driving_miles_to_nearest_hub: 165.0, enplanements_prior_year: 6200, min_required_weekly_round_trips: 12, min_required_weekly_seats: 400 }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /eas/communities/${comm_id}/eligibility-determinations"
              payload: { waiver_requested: false }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /eas/aircraft-types"
              payload: { code: "B190", name: "Beechcraft 1900D", seats: 19, is_jet: false, fuel_burn_gal_per_hour: 68.0, hourly_operating_cost_usd: 1450.00 }
              as: ProgramAdmin
              captures: { ac_b190_id: $.data.id }
            - call: "POST /eas/carriers"
              payload: { name: "Prairie Air", certificate_number: "CERT-1001" }
              as: ProgramAdmin
              captures: { car1_id: $.data.id }
            - call: "POST /eas/solicitations"
              payload: { community_id: "${comm_id}", closes_at: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { sol_id: $.data.id }
            - call: "POST /eas/proposals"
              payload: { solicitation_id: "${sol_id}", carrier_id: "${car1_id}", aircraft_type_id: "${ac_b190_id}", service_level: "ESSENTIAL_MINIMUM", weekly_round_trips: 12, seats_per_departure: 19, annual_subsidy_request_usd: 1600000.00, term_months: 24, payment_basis: "COMPLETED_FLIGHT_PRORATION" }
              as: Carrier
              as_user_id: "${car1_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /eas/proposals/${p1_id}/actions"
              payload: { action: "SUBMIT" }
              as: Carrier
              as_user_id: "${car1_id}"
            - call: "POST /eas/solicitations/${sol_id}/actions"
              payload: { action: "CLOSE" }
              as: ProgramAdmin
            - call: "POST /eas/solicitations/${sol_id}/selection-order"
              payload: { order_note: "award to sole candidate" }
              as: SelectionOfficer
              as_user_id: "officer-1"
              captures: { agr_id: $.data.id }
            - call: "POST /eas/carriers/${car1_id}/standing"
              payload: { action: "SUSPEND", note: "certificate action" }
              as: ProgramAdmin
          trigger:
            - call: "POST /eas/service-agreements/${agr_id}/status-actions"
              payload: { action: "REINSTATE", note: "premature" }
              as: ProgramAdmin
              captures: { blocked_error_id: $.data.error_id }
            - call: "POST /eas/carriers/${car1_id}/standing"
              payload: { action: "REINSTATE", note: "certificate restored" }
              as: ProgramAdmin
            - call: "POST /eas/service-agreements/${agr_id}/status-actions"
              payload: { action: "REINSTATE", note: "carrier back in good standing" }
              as: ProgramAdmin
            - call: "POST /eas/carriers/${car1_id}/standing"
              payload: { action: "PLACE_ON_PROBATION", note: "watch list" }
              as: ProgramAdmin
            - call: "POST /eas/service-agreements/${agr_id}/status-actions"
              payload: { action: "SUSPEND", note: "administrative hold" }
              as: ProgramAdmin
            - call: "POST /eas/service-agreements/${agr_id}/status-actions"
              payload: { action: "REINSTATE", note: "probation is acceptable standing" }
              as: ProgramAdmin
            - call: "POST /eas/service-agreements/${agr_id}/status-actions"
              payload: { action: "SUSPEND", note: "second administrative hold" }
              as: ProgramAdmin
            - call: "POST /eas/carriers/${car1_id}/standing"
              payload: { action: "DEBAR", note: "certificate revoked" }
              as: ProgramAdmin
            - call: "POST /eas/service-agreements/${agr_id}/status-actions"
              payload: { action: "REINSTATE", note: "must stay blocked" }
              as: ProgramAdmin
              captures: { debarred_error_id: $.data.error_id }
          assert:
            - "The carrier SUSPEND cascaded: ServiceAgreement.${agr_id}.status == SUSPENDED without any call against the agreement"
            - "REINSTATE with the carrier SUSPENDED returns 409 with ${blocked_error_id} == ERR_CARRIER_NOT_IN_GOOD_STANDING and the agreement stays SUSPENDED"
            - "Reinstating the carrier alone does NOT reactivate the agreement: it is still SUSPENDED and Carrier.${car1_id}.status == ACTIVE with consecutive_watch_count == 0"
            - "The agreement REINSTATE then succeeds: ServiceAgreement.${agr_id}.status == ACTIVE"
            - "With Carrier.${car1_id}.status == PROBATION the agreement REINSTATE succeeds again, so PROBATION is inside the permitted set"
            - "With Carrier.${car1_id}.status == DEBARRED the REINSTATE returns 409 with ${debarred_error_id} == ERR_CARRIER_NOT_IN_GOOD_STANDING and the agreement is stranded in SUSPENDED"
            - "Community.${comm_id}.status stays SUBSIDIZED throughout: a carrier standing change never moves the community by itself"

      - name: hold_in_release_reads_the_successor_agreement_state
        grounds:
          - validations.priority_11
          - state_machines.ServiceAgreement.HOLD_IN_to_TERMINATED
          - errors.ERR_REPLACEMENT_AGREEMENT_REQUIRED
          - entities.ServiceAgreement.fields.predecessor_agreement_id
          - endpoints.POST_/eas/service-agreements/{id}/status-actions
        dependency_pair:
          dependent: "ServiceAgreement HOLD_IN -> TERMINATED"
          depended_on: "the existence of another ServiceAgreement whose predecessor_agreement_id is this agreement and whose status == ACTIVE"
        distinguishing_aspect: |
          The depended-on entity is another row of the *same* entity type reached through the
          self-referential predecessor_agreement_id edge, and it does not exist yet at the moment the
          guard first refuses — the operator cannot satisfy the guard by changing any state, only by
          running a whole replacement solicitation to award. It is also the only guard in this rule
          whose satisfaction is expressed as a system cascade rather than as an operator call.
