        claim_type: bulk_action
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - state_machines.License.transitions.ACTIVE_to_EXPIRED
          - calculations.license_period_roll
        distinguishing_aspect: "One clock advance past 2028-01-15 sweeps BOTH licences in a single pass — expired_license_count is 2 while every other counter in the same envelope stays 0 — and each row is stamped with reinstatement_eligible_until 2030-01-14."
        test_recipe:
          setup:
            - "Two engineers each hold an ACTIVE STANDARD licence issued 2026-01-15 (both periods end 2028-01-15)."
            - "No exam authorizations, appointments or firm registrations exist."
