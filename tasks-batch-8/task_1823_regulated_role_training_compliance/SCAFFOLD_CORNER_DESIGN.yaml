            - "ok_st == \"ACKNOWLEDGED\" (ComplianceAdmin owns level 3)"

  # =====================================================================
  # Section: complexity_layers
  # =====================================================================
  - section: complexity_layers
    instances:
      - name: occ_stale_curriculum_patch_returns_412
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[curriculum-patch-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "After a successful PATCH advances Curriculum.version, a second PATCH replaying the previously observed version is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Regulator REG-OCC1; curriculum CUR-OCC1 created (version captured at create)"]
          setup_api_calls:
            - { call: "POST /compliance/regulators", payload: { code: "REG-OCC1", name: "OCC1 Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-OCC1", title: "OCC1 Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur_id: "$.data.id", cur_v: "$.data.version" } }
          trigger:
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { validity_months: 6, expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin, captures: { v2: "$.data.version" } }
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { validity_months: 9, expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
            - { call: "GET /compliance/curricula/${cur_id}", as: ComplianceAdmin, captures: { vm: "$.data.validity_months", vnow: "$.data.version" } }
          assert:
            - "v2 == 2 (first patch applied)"
            - "err == \"ERR_STALE_VERSION\" (HTTP 412 — the replayed version is stale)"
            - "vm == 6 and vnow == 2 (losing patch left no trace)"

      - name: occ_stale_extension_grant_returns_412
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[extension-grant-stale-assignment]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "OCC (priority 6) fires before the single-active-extension constraint (priority 9): a second grant replaying the pre-grant version gets 412, not 409."
        test_recipe:
          setup: ["Clock 2026-08-03T09:00:00Z; regulator REG-OCC2; curriculum CUR-OCC2 ACTIVE; roles R-OCC2M (manager M), R-OCC2 (SOFT req due 30); employee E-OCC2 reports to M and holds A"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-OCC2", name: "OCC2 Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-OCC2", title: "OCC2 Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur_id: "$.data.id", cur_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://occ2-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-OCC2M", name: "OCC2 Mgr" }, as: ComplianceAdmin, captures: { role_mgr: "$.data.id" } }
            - { call: "POST /compliance/roles", payload: { code: "R-OCC2", name: "OCC2 Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_id}", recurrence: "INITIAL_ONLY", due_in_days: 30, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "M-OCC2-1", full_name: "OCC2 Mgr", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_mgr}" }, as: HRAdmin, captures: { mgr: "$.data.id" } }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-OCC2-1", full_name: "OCC2 Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}", manager_id: "${mgr}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp}" }, as: ComplianceAdmin, captures: { a: "$.data[0].id", av: "$.data[0].version" } }
          trigger:
            - { call: "POST /compliance/assignments/${a}/extensions", payload: { extend_by_days: 3, reason: "travel", expected_assignment_version: "${av}" }, as: Manager, as_user_id: "${mgr}", captures: { av2: "$.data.version" } }
            - { call: "POST /compliance/assignments/${a}/extensions", payload: { extend_by_days: 3, reason: "travel again", expected_assignment_version: "${av}" }, as: Manager, as_user_id: "${mgr}", captures: { err: "$.data.error_id" } }
          assert:
            - "av2 == 2 (first grant bumped the version)"
            - "err == \"ERR_STALE_VERSION\" (stale OCC version is detected before the active-extension constraint)"

      - name: scheduled_role_change_not_applied_until_sweep
        claim_type: scheduled_actions
        grounds:
          - "state_machines.EmployeeRoleChange.SCHEDULED_to_APPLIED"
          - "endpoints[POST /compliance/_sweeps/run]"
        distinguishing_aspect: "Passing effective_at on the clock does NOT apply the change by itself: reads still show the old role until a sweep runs, then the change applies exactly once."
        test_recipe:
          setup: ["Clock 2026-08-03T09:00:00Z; roles R-DA1, R-DA2 (no requirements); employee E-DA in R-DA1; RC to R-DA2 effective 2026-08-05T00:00:00Z (SCHEDULED)"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-DA1", name: "DA One" }, as: ComplianceAdmin, captures: { r1: "$.data.id" } }
            - { call: "POST /compliance/roles", payload: { code: "R-DA2", name: "DA Two" }, as: ComplianceAdmin, captures: { r2: "$.data.id" } }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-DA-1", full_name: "DA Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${r1}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "POST /compliance/employees/${emp}/role-changes", payload: { to_role_id: "${r2}", effective_at: "2026-08-05T00:00:00Z" }, as: HRAdmin, captures: { rc: "$.data.id", rc_st: "$.data.status" } }
          trigger:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "GET /compliance/employees/${emp}", as: ComplianceAdmin, captures: { role_pre: "$.data.current_role_id" } }
            - { call: "GET /compliance/role-changes/${rc}", as: ComplianceAdmin, captures: { rc_pre: "$.data.status" } }
            - { call: "POST /compliance/_sweeps/run", payload: {}, as: ComplianceAdmin, captures: { sw_rca: "$.data.role_changes_applied" } }
            - { call: "GET /compliance/employees/${emp}", as: ComplianceAdmin, captures: { role_post: "$.data.current_role_id" } }
            - { call: "GET /compliance/role-changes/${rc}", as: ComplianceAdmin, captures: { rc_post: "$.data.status", rc_applied: "$.data.applied_at" } }
          assert:
            - "role_pre == ${r1} and rc_pre == \"SCHEDULED\" (clock past effective_at but no sweep yet — deferred execution)"
            - "sw_rca == 1"
            - "role_post == ${r2} and rc_post == \"APPLIED\" and rc_applied == \"2026-08-06T00:00:00Z\" (sweep time, not effective_at)"

      - name: extension_limit_after_successful_grant_returns_409
        claim_type: rate_threshold_triggers
        grounds:
          - "errors[ERR_EXTENSION_LIMIT_ACTIVE]"
          - "entities.TrainingAssignment.fields.active_extension_days"
        distinguishing_aspect: "With a FRESH OCC version, a second grant while an extension is active fails 409 ERR_EXTENSION_LIMIT_ACTIVE — the constraint twin of the 412 stale-version case."
        test_recipe:
          setup: ["Clock 2026-08-03T09:00:00Z; regulator REG-XL; curriculum CUR-XL ACTIVE; roles R-XLM (manager M), R-XL (SOFT req due 30); employee E-XL reports to M; A already extended +5 days (version now 2)"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-XL", name: "XL Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-XL", title: "XL Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur_id: "$.data.id", cur_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://xl-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-XLM", name: "XL Mgr" }, as: ComplianceAdmin, captures: { role_mgr: "$.data.id" } }
            - { call: "POST /compliance/roles", payload: { code: "R-XL", name: "XL Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_id}", recurrence: "INITIAL_ONLY", due_in_days: 30, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "M-XL-1", full_name: "XL Mgr", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_mgr}" }, as: HRAdmin, captures: { mgr: "$.data.id" } }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-XL-1", full_name: "XL Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}", manager_id: "${mgr}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp}" }, as: ComplianceAdmin, captures: { a: "$.data[0].id", av: "$.data[0].version" } }
            - { call: "POST /compliance/assignments/${a}/extensions", payload: { extend_by_days: 5, reason: "first", expected_assignment_version: "${av}" }, as: Manager, as_user_id: "${mgr}" }
            - { call: "GET /compliance/assignments/${a}", as: ComplianceAdmin, captures: { av2: "$.data.version", ae: "$.data.active_extension_days" } }
          trigger:
            - { call: "POST /compliance/assignments/${a}/extensions", payload: { extend_by_days: 4, reason: "second", expected_assignment_version: "${av2}" }, as: Manager, as_user_id: "${mgr}", captures: { err: "$.data.error_id" } }
          assert:
            - "ae == 5 (first extension active)"
            - "err == \"ERR_EXTENSION_LIMIT_ACTIVE\" (409 — fresh version passes OCC, single-active-extension constraint fires)"

  # =====================================================================
  # Section: consistency_model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: synchronous_role_change_apply_immediately_visible
        claim_type: immediate_visibility
        grounds:
          - "complexity_profile.consistency_model"
          - "state_machines.EmployeeRoleChange"
        distinguishing_aspect: "Immediate consistency: a synchronously applied role change (effective_at <= now) and all its cascades are visible in the very next reads of the same request sequence."
        test_recipe:
          setup: ["Clock 2026-08-03T09:00:00Z; regulator REG-IM; curricula CUR-IM1, CUR-IM2 ACTIVE; R-IM1 (req CUR-IM1), R-IM2 (req CUR-IM2); employee E-IM in R-IM1 with A1 ASSIGNED"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-IM", name: "IM Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-IM1", title: "IM One", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur1: "$.data.id", cur1_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur1}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://im1-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur1}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur1_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-IM2", title: "IM Two", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur2: "$.data.id", cur2_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur2}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://im2-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur2}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur2_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-IM1", name: "IM One" }, as: ComplianceAdmin, captures: { r1: "$.data.id" } }
            - { call: "POST /compliance/roles/${r1}/requirements", payload: { curriculum_id: "${cur1}", recurrence: "INITIAL_ONLY", due_in_days: 30, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-IM2", name: "IM Two" }, as: ComplianceAdmin, captures: { r2: "$.data.id" } }
            - { call: "POST /compliance/roles/${r2}/requirements", payload: { curriculum_id: "${cur2}", recurrence: "INITIAL_ONLY", due_in_days: 30, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-IM-1", full_name: "IM Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${r1}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
          trigger:
            - { call: "POST /compliance/employees/${emp}/role-changes", payload: { to_role_id: "${r2}", effective_at: "2026-08-03T09:00:00Z" }, as: HRAdmin, captures: { rc_st: "$.data.status", rc: "$.data.id" } }
            - { call: "GET /compliance/employees/${emp}", as: ComplianceAdmin, captures: { e_role: "$.data.current_role_id" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp}", curriculum_id: "${cur1}" }, as: ComplianceAdmin, captures: { a1_prog: "$.data[0].progress_status" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp}", curriculum_id: "${cur2}" }, as: ComplianceAdmin, captures: { a2_prog: "$.data[0].progress_status", a2_trig: "$.data[0].trigger_source" } }
          assert:
            - "rc_st == \"APPLIED\" in the mutation's own response"
            - "e_role == ${r2} (visible on the immediate next read)"
            - "a1_prog == \"CANCELLED\" and a2_prog == \"ASSIGNED\" and a2_trig == \"ROLE_CHANGE\" (cascades already settled)"
