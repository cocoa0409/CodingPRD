              as: PricingManager
              captures: { rate_1: $.data.id }
            - call: "POST /rental-network/lane-rates/${rate_1}/activate"
              payload: {}
              as: PricingManager
            - call: "POST /rental-network/vehicle-profiles"
              payload: { label: "Sedan", make: "Honda", model: "Accord", year: 2020, curb_weight_lbs: 3300, tow_capacity_lbs: 0, hitch_class: "NONE" }
              as: Customer
              captures: { veh_1: $.data.id }
            - call: "POST /rental-network/customers"
              payload: { email: "c14@x.com", full_name: "Cust Fourteen", vehicle_profile_id: "${veh_1}" }
              as: Customer
              captures: { cust_1: $.data.id }
            - call: "POST /rental-network/customers/${cust_1}/verify-license"
              payload: {}
              as: DealerAgent
              as_user_id: "${dealer_a}"
            - call: "POST /rental-network/reservations"
              payload: { customer_id: "${cust_1}", origin_dealer_id: "${dealer_a}", dest_location_id: "${loc_b}", equipment_type: "TRUCK_10FT", rental_kind: "ONE_WAY", pickup_date: "2026-11-10T10:00:00Z", dropoff_date: "2026-11-12T10:00:00Z" }
              as: Customer
              as_user_id: "${cust_1}"
              captures: { rsv_1: $.data.id, rsv_1_v: $.data.version }
            - call: "POST /rental-network/reservations/${rsv_1}/confirm"
              payload: { expected_reservation_version: "${rsv_1_v}" }
              as: Customer
              as_user_id: "${cust_1}"
            - call: "POST /rental-network/rental-agreements"
              payload: { reservation_id: "${rsv_1}", equipment_unit_id: "${unit_1}", return_location_id: "${loc_b}" }
              as: DealerAgent
              as_user_id: "${dealer_a}"
              captures: { agr_1: $.data.id }
            - call: "POST /rental-network/rental-agreements/${agr_1}/return"
              payload: {}
              as: DealerAgent
