- rule_id: resource_temporal_overlap
  instances:
  - name: certification_window_adjacency_vs_overlap
    grounds:
    - calculations.certification_window_overlap
    - validations[priority=8]
    - errors[ERR_CERTIFICATION_WINDOW_OVERLAP]
    distinguishing_aspect: "InterfaceCertification interval semantics: closed-interior overlap rejected but contiguous touch (a.end + 1 day == b.start) allowed \u2014\
      \ window [09-01,09-10] then [09-11,09-20] succeeds (adjacent), while [09-10,09-15] fails with ERR_CERTIFICATION_WINDOW_OVERLAP because it shares interior date\
      \ 09-10."
