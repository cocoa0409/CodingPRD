scenario: |
  Generate task harder than expert level!

  2693. Surplus Public Land Disposition (public agency real property office): declaration of surplus
  with statutory notice to other agencies and preference entities, affordable housing preference
  offers and good-faith negotiation requirements, appraisal, minimum price setting and appraisal
  challenge processes, competitive sale, negotiated sale and exchange authority differences,
  environmental review, title curative and easement reservation before conveyance, deed
  restrictions, reverter clauses and enforcement, proceeds allocation to designated funds,
  unsuccessful disposition and re-offering procedures
domain_name: surplus-public-land-disposition
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - selector_policy

  entity_topology: graph
  # Parcel is the hub; SurplusDeclaration, Appraisal, TitleCurativeItem, EnvironmentalReview,
  # DispositionOffering, Conveyance and ProceedsAllocation reference each other across aggregate
  # boundaries (Conveyance points at BOTH Offering and Parcel; PreferenceOffer points at
  # Declaration, Notice AND Agency), so the reference graph is many-to-many rather than a tree.

  state_machine_shape: cyclic
  # SurplusDeclaration cycles OFFERING_AUTHORIZED -> UNSUCCESSFUL -> NOTICED (re-offering);
  # Appraisal cycles REPORTED -> CHALLENGED -> REPORTED (sustained challenge revision);
  # DispositionOffering cycles AWARDED -> EVALUATION (award rescission to backup bidder);
  # PreferenceOffer, Bid and Conveyance each carry two independent state dimensions.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - polymorphic
  # polymorphic: Conveyance.grantee is either a Bidder (sale) or an Agency (exchange/preference),
  # expressed as two mutually exclusive nullable FKs plus grantee_kind.

  role_model: segregation_of_duties
  # BoardClerk adopts the declaration and BoardClerk determines appraisal challenges, but the SAME
  # X-User-ID may not do both on one declaration; RealPropertyOfficer negotiates while
  # ComplianceMonitor grades good faith; FinanceOfficer owns fund configuration only.

  consistency_model: immediate
  difficulty_level: beyond_expert

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Agency
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: legal name of the public agency
        constraints: "1..200 chars"
      - name: agency_type
        type: enum
        source: input
        description: statutory class of the agency, drives notice ordering
        constraints: "STATE | COUNTY | MUNICIPAL | SCHOOL_DISTRICT | TRANSIT | HOUSING_AUTHORITY | FEDERAL"
      - name: is_preference_entity
        type: boolean
        source: input
        description: whether the agency holds a statutory preference right on surplus land
        default: false
      - name: preference_category
        type: enum
        source: input
        description: preference class asserted by this agency
        default: NONE
        constraints: "AFFORDABLE_HOUSING | PARK_OPEN_SPACE | SCHOOL_SITE | INFILL_INFRASTRUCTURE | NONE"
      - name: contact_email
        type: string
        source: input
        description: notice delivery address
      - name: notice_registry_status
        type: enum
        source: input
        description: whether the agency is currently on the statutory notice registry
        default: REGISTERED
        constraints: "REGISTERED | LAPSED"

  - name: Parcel
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: apn
        type: string
        source: input
        description: assessor parcel number, unique across all parcels
        constraints: "unique; 1..40 chars"
      - name: address
        type: string
        source: input
        description: street address or legal location description
      - name: acreage
        type: number
        source: input
        description: parcel size in acres
        constraints: "> 0"
      - name: zoning_code
        type: string
        source: input
        description: current zoning designation
      - name: book_value_cents
        type: integer
        source: input
        description: carrying value on the agency's books, in cents
        constraints: ">= 0"
      - name: custodian_agency_id
        type: string
        source: input
        description: "FK -> Agency.id; the public agency holding custody of the parcel"
      - name: ownership_status
        type: enum
        source: system
        description: whether the agency still holds title
        default: AGENCY_OWNED
        constraints: "AGENCY_OWNED | CONVEYED | REVERTED_TO_AGENCY"
      - name: valuation_status
        type: enum
        source: system
        description: whether a currently valid ACCEPTED appraisal backs the parcel
        default: UNVALUED
        constraints: "UNVALUED | CURRENT | STALE"
      - name: open_title_item_count
        type: integer
        source: computed
        description: count of TitleCurativeItem rows for this parcel with status == OPEN
        default: 0
      - name: disposition_ready
        type: boolean
        source: computed
        description: "true iff valuation_status == CURRENT AND open_title_item_count == 0 AND ownership_status == AGENCY_OWNED"
        default: false

  - name: SurplusDeclaration
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: parcel_id
        type: string
        source: input
        description: "FK -> Parcel.id; the parcel being declared surplus"
      - name: justification
        type: string
        source: input
        description: written finding that the parcel is no longer needed for agency use
      - name: intended_use_restriction
        type: string
        source: input
        description: use restriction the agency intends to record on the deed; null when unrestricted
        default: null
      - name: status
        type: enum
        source: system
        description: disposition lifecycle state of the declaration
        default: DRAFT
        constraints: "DRAFT | ADOPTED | NOTICED | PREFERENCE_CLOSED | NEGOTIATION_AGREED | OFFERING_AUTHORIZED | UNSUCCESSFUL | CONVEYED | WITHDRAWN"
      - name: resolution_number
        type: string
        source: system
        description: governing-body resolution number recorded at adoption
        default: null
      - name: adopted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the BoardClerk who adopted the declaration; compared against challenge determiners for segregation of duties"
        default: null
      - name: adopted_at
        type: datetime
        source: system
        description: logical-clock instant of adoption
        default: null
      - name: notice_issued_at
        type: datetime
        source: system
        description: logical-clock instant the current notice round was issued
        default: null
      - name: notice_response_window_days
        type: integer
        source: system
        description: statutory response window applied to the current notice round
        default: null
      - name: notice_response_deadline_at
        type: datetime
        source: computed
        description: "notice_issued_at + notice_response_window_days (see calculations.statutory_window_deadlines)"
        default: null
      - name: authorized_disposition_type
        type: enum
        source: system
        description: disposition authority granted by the governing body
        default: null
        constraints: "COMPETITIVE_SALE | NEGOTIATED_SALE | EXCHANGE"
      - name: authority_findings
        type: string
        source: system
        description: findings text supporting the authorized disposition type
        default: null
      - name: reoffer_count
        type: integer
        source: system
        description: number of completed unsuccessful disposition cycles for this declaration
        default: 0
      - name: reoffer_eligible_at
        type: datetime
        source: system
        description: earliest logical-clock instant at which re-offering may be initiated
        default: null
      - name: preference_offer_count
        type: integer
        source: computed
        description: count of PreferenceOffer rows whose declaration_id == this declaration
        default: 0
      - name: unresolved_preference_count
        type: integer
        source: computed
        description: "count of PreferenceOffer rows for this declaration with good_faith_status IN {UNREVIEWED, UNDER_REVIEW} OR negotiation_status IN {OPEN, IN_NEGOTIATION}"
        default: 0
      - name: withdrawn_reason
        type: string
        source: system
        description: reason recorded when the governing body withdraws the declaration
        default: null

  - name: StatutoryNotice
    parent: SurplusDeclaration
    common_fields: true
    kind: resource
    fields:
      - name: declaration_id
        type: string
        source: system
        description: "FK -> SurplusDeclaration.id; the declaration whose surplus status is noticed"
      - name: recipient_agency_id
        type: string
        source: system
        description: "FK -> Agency.id; the agency served with the statutory notice"
      - name: notice_round
        type: integer
        source: system
        description: "1 on the first notice issuance, incremented on each re-offering round"
        default: 1
      - name: issued_at
        type: datetime
        source: system
        description: logical-clock instant the notice was issued
      - name: response_window_days
        type: integer
        source: system
        description: statutory response window in days copied from the issuing call
      - name: response_deadline_at
        type: datetime
        source: computed
        description: "issued_at + response_window_days days; responses at exactly this instant are timely"
      - name: status
        type: enum
        source: system
        description: notice response state
        default: ISSUED
        constraints: "ISSUED | INTEREST_EXPRESSED | DECLINED | EXPIRED"
      - name: responded_at
        type: datetime
        source: system
        description: logical-clock instant the recipient responded
        default: null
      - name: response_type
        type: enum
        source: system
        description: recipient's election
        default: null
        constraints: "EXPRESS_INTEREST | DECLINE"
      - name: claimed_preference_category
        type: enum
        source: system
        description: preference class the recipient asserted when expressing interest
        default: null
        constraints: "AFFORDABLE_HOUSING | PARK_OPEN_SPACE | SCHOOL_SITE | INFILL_INFRASTRUCTURE | NONE"
      - name: intended_use
        type: string
        source: system
        description: recipient's stated intended use of the parcel
        default: null

  - name: PreferenceOffer
    parent: SurplusDeclaration
    common_fields: true
    kind: resource
    fields:
      - name: declaration_id
        type: string
        source: system
        description: "FK -> SurplusDeclaration.id; declaration under which the preference offer arose"
      - name: notice_id
        type: string
        source: system
        description: "FK -> StatutoryNotice.id; the notice whose EXPRESS_INTEREST response created this offer"
      - name: offeror_agency_id
        type: string
        source: system
        description: "FK -> Agency.id; the preference entity negotiating for the parcel"
      - name: preference_category
        type: enum
        source: system
        description: preference class copied from the notice response
        constraints: "AFFORDABLE_HOUSING | PARK_OPEN_SPACE | SCHOOL_SITE | INFILL_INFRASTRUCTURE"
      - name: negotiation_status
        type: enum
        source: system
        description: "state dimension A - progress of the good-faith negotiation itself"
        default: OPEN
        constraints: "OPEN | IN_NEGOTIATION | AGREED | IMPASSE | LAPSED"
      - name: good_faith_status
        type: enum
        source: system
        description: "state dimension B - compliance grading of the agency's negotiating conduct, evolves independently of negotiation_status"
        default: UNREVIEWED
        constraints: "UNREVIEWED | UNDER_REVIEW | SATISFIED | DEFICIENT"
      - name: negotiation_opened_at
        type: datetime
        source: system
        description: logical-clock instant the notice response created this offer
      - name: negotiation_deadline_at
        type: datetime
        source: computed
        description: "negotiation_opened_at + GOOD_FAITH_NEGOTIATION_DAYS (90) days"
      - name: ah_minimum_price_cents
        type: integer
        source: computed
        description: "minimum price quoted to this offeror, AFFORDABLE_HOUSING_PREFERENCE variant when preference_category == AFFORDABLE_HOUSING, MARKET_FLOOR variant otherwise"
        default: null
      - name: agreed_price_cents
        type: integer
        source: system
        description: price recorded when the negotiation concludes with outcome AGREED
        default: null
      - name: officer_round_count
        type: integer
        source: computed
        description: count of NegotiationRound rows for this offer with party == CUSTODIAN_AGENCY
        default: 0
      - name: entity_round_count
        type: integer
        source: computed
        description: count of NegotiationRound rows for this offer with party == PREFERENCE_ENTITY
        default: 0
      - name: timely_response_count
        type: integer
        source: computed
        description: count of NegotiationRound rows for this offer with party == PREFERENCE_ENTITY AND is_timely == true
        default: 0
      - name: interim_good_faith_score
        type: integer
        source: computed
        description: "interim variant of calculations.good_faith_compliance_score, recomputed on every round append"
        default: 0
      - name: final_good_faith_score
        type: integer
        source: system
        description: "final_determination variant of calculations.good_faith_compliance_score, frozen at good-faith determination"
        default: null
      - name: remediation_note
        type: string
        source: system
        description: compliance note recorded at good-faith determination
        default: null

  - name: NegotiationRound
    parent: PreferenceOffer
    common_fields: false
    kind: event
    fields:
      - name: offer_id
        type: string
        source: system
        description: "FK -> PreferenceOffer.id; the negotiation this round belongs to"
      - name: round_number
        type: integer
        source: system
        description: "1-based sequence number within the offer, assigned in created_at order"
      - name: party
        type: enum
        source: input
        description: which side tendered this round
        constraints: "CUSTODIAN_AGENCY | PREFERENCE_ENTITY"
      - name: price_offered_cents
        type: integer
        source: input
        description: price tendered in this round, in cents
        constraints: ">= 0"
      - name: terms_summary
        type: string
        source: input
        description: summary of the terms tendered
      - name: responded_to_round_number
        type: integer
        source: input
        description: round_number of the opposite party's round this one answers; null for an opening round
        default: null
      - name: responded_within_days
        type: integer
        source: computed
        description: "whole days between the answered round's created_at and this round's created_at, floor; null when responded_to_round_number is null"
        default: null
      - name: is_timely
        type: boolean
        source: computed
        description: "true iff responded_within_days is not null AND responded_within_days <= TIMELY_RESPONSE_DAYS (15)"
        default: false

  - name: Appraiser
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: appraiser's legal name
      - name: license_number
        type: string
        source: input
        description: state appraisal license number, unique across appraisers
        constraints: "unique"
      - name: license_expires_on
        type: datetime
        source: input
        description: "ISO 8601 UTC instant at which the license lapses"
      - name: license_status
        type: enum
        source: computed
        description: "ACTIVE while current logical clock < license_expires_on, EXPIRED at or after it"
        default: ACTIVE
        constraints: "ACTIVE | EXPIRED"
      - name: active_engagement_count
        type: integer
        source: computed
        description: "count of Appraisal rows for this appraiser with status IN {ORDERED, REPORTED, CHALLENGED}"
        default: 0

  - name: Appraisal
    parent: Parcel
    common_fields: true
    kind: resource
    fields:
      - name: parcel_id
        type: string
        source: input
        description: "FK -> Parcel.id; the parcel being valued"
      - name: appraiser_id
        type: string
        source: input
        description: "FK -> Appraiser.id; the engaged appraiser"
      - name: method
        type: enum
        source: input
        description: valuation approach
        constraints: "SALES_COMPARISON | INCOME | COST"
      - name: engagement_start_on
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the appraiser's engagement interval (closed)"
      - name: engagement_end_on
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the appraiser's engagement interval (closed); must be >= engagement_start_on"
      - name: status
        type: enum
        source: system
        description: appraisal lifecycle state
        default: ORDERED
        constraints: "ORDERED | REPORTED | CHALLENGED | ACCEPTED | SUPERSEDED | EXPIRED"
      - name: appraised_value_cents
        type: integer
        source: system
        description: reported opinion of value in cents; overwritten by a SUSTAINED challenge's revised value
        default: null
      - name: effective_date
        type: datetime
        source: system
        description: "ISO 8601 UTC valuation date supplied with the report"
        default: null
      - name: narrative
        type: string
        source: system
        description: report narrative supplied with the report
        default: null
      - name: reported_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent report submission
        default: null
      - name: expires_on
        type: datetime
        source: computed
        description: "effective_date + APPRAISAL_VALIDITY_DAYS (365) days; null before the first report"
        default: null
      - name: challenge_count
        type: integer
        source: system
        description: number of AppraisalChallenge rows filed against this appraisal
        default: 0
      - name: revaluation_required
        type: boolean
        source: system
        description: set true when an unsuccessful disposition cascades back onto this appraisal
        default: false
      - name: accepted_at
        type: datetime
        source: system
        description: logical-clock instant the real property office accepted the report
        default: null

  - name: AppraisalChallenge
    parent: Appraisal
    common_fields: true
    kind: resource
    fields:
      - name: appraisal_id
        type: string
        source: system
        description: "FK -> Appraisal.id; the report being challenged"
      - name: challenger_agency_id
        type: string
        source: system
        description: "FK -> Agency.id; the agency filing the challenge (X-User-ID of the acting AgencyRepresentative)"
      - name: asserted_value_cents
        type: integer
        source: input
        description: value the challenger asserts is correct, in cents
        constraints: ">= 0"
      - name: grounds
        type: string
        source: input
        description: written grounds for the challenge
      - name: required_deposit_cents
        type: integer
        source: computed
        description: "see calculations.challenge_deposit_requirement; frozen at filing time"
      - name: deposit_paid_cents
        type: integer
        source: input
        description: deposit tendered with the challenge, in cents
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: challenge determination state
        default: SUBMITTED
        constraints: "SUBMITTED | SUSTAINED | DENIED"
      - name: determined_by_user_id
        type: string
        source: system
        description: "X-User-ID of the BoardClerk who determined the challenge; must differ from the declaration's adopted_by_user_id"
        default: null
      - name: revised_value_cents
        type: integer
        source: system
        description: value written back onto the appraisal when the challenge is SUSTAINED
        default: null
      - name: deposit_refunded_cents
        type: integer
        source: system
        description: deposit returned to the challenger when SUSTAINED
        default: 0
      - name: deposit_forfeited_cents
        type: integer
        source: system
        description: deposit forfeited to the rank-1 designated fund when DENIED
        default: 0

  - name: EnvironmentalReview
    parent: SurplusDeclaration
    common_fields: true
    kind: resource
    fields:
      - name: declaration_id
        type: string
        source: system
        description: "FK -> SurplusDeclaration.id; declaration whose disposition is under environmental review"
      - name: determination_class
        type: enum
        source: input
        description: level of environmental documentation prepared
        constraints: "EXEMPT | NEGATIVE_DECLARATION | MITIGATED_NEG_DEC | FULL_EIR"
      - name: circulation_start_on
        type: datetime
        source: input
        description: "ISO 8601 UTC first day of the public circulation interval (closed)"
      - name: circulation_end_on
        type: datetime
        source: input
        description: "ISO 8601 UTC last day of the public circulation interval (closed)"
      - name: circulation_round
        type: integer
        source: system
        description: "1 for the initial circulation, incremented on each recirculation"
        default: 1
      - name: status
        type: enum
        source: system
        description: "review state; determination_class == EXEMPT lands directly in CERTIFIED at creation"
        default: CIRCULATING
        constraints: "CIRCULATING | RECIRCULATION_REQUIRED | CERTIFIED"
      - name: certified_at
        type: datetime
        source: system
        description: logical-clock instant of certification
        default: null
      - name: recirculation_reason
        type: string
        source: system
        description: reason recorded when the review is sent back for recirculation
        default: null

  - name: TitleCurativeItem
    parent: Parcel
    common_fields: true
    kind: resource
    fields:
      - name: parcel_id
        type: string
        source: system
        description: "FK -> Parcel.id; the parcel whose title carries this defect"
      - name: item_type
        type: enum
        source: input
        description: class of title defect
        constraints: "LIEN | ENCROACHMENT | MISSING_ACCESS_EASEMENT | BOUNDARY_GAP | UNRECORDED_LEASE"
      - name: description
        type: string
        source: input
        description: description of the defect
      - name: cure_cost_estimate_cents
        type: integer
        source: input
        description: "estimated cost to cure, used by minimum-price setting"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: curative resolution state
        default: OPEN
        constraints: "OPEN | CURED | WAIVED_WITH_ENDORSEMENT | RESERVED_AS_EASEMENT"
      - name: actual_cure_cost_cents
        type: integer
        source: system
        description: "actual cost incurred, recorded at resolution; feeds BOTH the minimum-price cure deduction (CURED rows only) and the proceeds curative-recovery cap"
        default: null
      - name: easement_purpose
        type: string
        source: system
        description: purpose of the easement reserved to the agency when resolution == RESERVED_AS_EASEMENT
        default: null
      - name: easement_area_sqft
        type: number
        source: system
        description: reserved easement area in square feet when resolution == RESERVED_AS_EASEMENT
        default: null
      - name: resolved_at
        type: datetime
        source: system
        description: logical-clock instant of resolution
        default: null

  - name: DispositionOffering
    parent: SurplusDeclaration
    common_fields: true
    kind: resource
    fields:
      - name: declaration_id
        type: string
        source: input
        description: "FK -> SurplusDeclaration.id; the authorized declaration being offered"
      - name: offering_type
        type: enum
        source: input
        description: disposition mechanism used for this offering
        constraints: "COMPETITIVE_SALE | NEGOTIATED_SALE | EXCHANGE"
      - name: counterparty_bidder_id
        type: string
        source: input
        description: "FK -> Bidder.id; polymorphic counterparty leg A - permitted only when offering_type == NEGOTIATED_SALE and counterparty_agency_id is null"
        default: null
      - name: counterparty_agency_id
        type: string
        source: input
        description: "FK -> Agency.id; polymorphic counterparty leg B - required when offering_type == EXCHANGE, permitted for NEGOTIATED_SALE when the buyer is the AGREED preference entity, must be null for COMPETITIVE_SALE"
        default: null
      - name: bid_open_at
        type: datetime
        source: input
        description: "ISO 8601 UTC inclusive start of the offering interval"
      - name: bid_close_at
        type: datetime
        source: input
        description: "ISO 8601 UTC exclusive end of the offering interval; must be > bid_open_at"
      - name: minimum_price_cents
        type: integer
        source: computed
        description: "see calculations.minimum_price_determination; frozen at offering creation"
      - name: minimum_price_variant
        type: enum
        source: computed
        description: which minimum-price variant produced minimum_price_cents
        constraints: "MARKET_FLOOR | AFFORDABLE_HOUSING_PREFERENCE"
      - name: required_deposit_cents
        type: integer
        source: computed
        description: "see calculations.required_bid_deposit; frozen at offering creation"
      - name: status
        type: enum
        source: system
        description: offering lifecycle state
        default: DRAFT
        constraints: "DRAFT | OPEN | EVALUATION | AWARDED | FAILED_NO_QUALIFYING_BID | CLOSED_CONVEYED | CANCELLED"
      - name: qualified_bid_count
        type: integer
        source: computed
        description: count of Bid rows for this offering with qualification_status == QUALIFIED
        default: 0
      - name: winning_bid_amount_cents
        type: integer
        source: system
        description: amount of the bid selected by calculations.award_selection
        default: null
      - name: awarded_at
        type: datetime
        source: system
        description: logical-clock instant of award
        default: null
      - name: awarded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the BoardClerk who awarded the offering"
        default: null
      - name: rescind_count
        type: integer
        source: system
        description: number of award rescissions on this offering
        default: 0
      - name: cancellation_reason
        type: string
        source: system
        description: reason recorded when the offering is cancelled by a declaration withdrawal cascade
        default: null

  - name: Bidder
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: legal_name
        type: string
        source: input
        description: bidder's legal name
      - name: entity_type
        type: enum
        source: input
        description: legal form of the bidder
        constraints: "INDIVIDUAL | CORPORATION | NONPROFIT | PARTNERSHIP"
      - name: contact_email
        type: string
        source: input
        description: bidder contact address
      - name: debarment_status
        type: enum
        source: system
        description: whether the bidder is barred from public-land purchases
        default: CLEAR
        constraints: "CLEAR | DEBARRED"
      - name: debarment_reason
        type: string
        source: system
        description: reason recorded with the most recent debarment action
        default: null
      - name: available_funds_cents
        type: integer
        source: system
        description: unencumbered cash the bidder has on deposit with the agency, in cents
        default: 0
      - name: escrow_held_cents
        type: integer
        source: system
        description: cash currently held as bid deposits, in cents
        default: 0
      - name: lifetime_deposits_cents
        type: integer
        source: system
        description: "cumulative cash the bidder has ever funded; equals available_funds_cents + escrow_held_cents until a conveyance applies a deposit"
        default: 0

  - name: Bid
    parent: DispositionOffering
    common_fields: true
    kind: resource
    fields:
      - name: offering_id
        type: string
        source: system
        description: "FK -> DispositionOffering.id; the offering bid upon"
      - name: bidder_id
        type: string
        source: system
        description: "FK -> Bidder.id; the acting bidder (X-User-ID of the Bidder role)"
      - name: amount_cents
        type: integer
        source: input
        description: bid amount in cents
        constraints: ">= 0"
      - name: deposit_amount_cents
        type: integer
        source: input
        description: deposit tendered with the bid, in cents
        constraints: ">= 0"
      - name: intended_use
        type: string
        source: input
        description: bidder's stated intended use
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant of submission; primary tie-break for award selection
      - name: qualification_status
        type: enum
        source: system
        description: "state dimension A - responsiveness and award standing of the bid"
        default: SUBMITTED
        constraints: "SUBMITTED | QUALIFIED | DISQUALIFIED | WINNING | BACKUP | WITHDRAWN"
      - name: deposit_status
        type: enum
        source: system
        description: "state dimension B - disposition of the bid deposit, evolves independently of qualification_status"
        default: HELD
        constraints: "HELD | RELEASED | APPLIED"
      - name: award_rank
        type: integer
        source: system
        description: "1-based rank assigned by calculations.award_selection at award time; null before award"
        default: null
      - name: disqualification_reason
        type: string
        source: system
        description: reason recorded when the bid is disqualified during bid evaluation
        default: null

  - name: Conveyance
    parent: DispositionOffering
    common_fields: true
    kind: resource
    fields:
      - name: offering_id
        type: string
        source: system
        description: "FK -> DispositionOffering.id; the awarded offering being closed"
      - name: parcel_id
        type: string
        source: system
        description: "FK -> Parcel.id; the parcel being conveyed"
      - name: grantee_kind
        type: enum
        source: system
        description: which grantee FK is populated
        constraints: "BIDDER | AGENCY"
      - name: grantee_bidder_id
        type: string
        source: system
        description: "FK -> Bidder.id; populated when grantee_kind == BIDDER, null otherwise"
        default: null
      - name: grantee_agency_id
        type: string
        source: system
        description: "FK -> Agency.id; populated when grantee_kind == AGENCY, null otherwise"
        default: null
      - name: sale_price_cents
        type: integer
        source: system
        description: "consideration: the winning bid amount for COMPETITIVE_SALE, the offering minimum price for NEGOTIATED_SALE and EXCHANGE"
      - name: closing_costs_cents
        type: integer
        source: input
        description: escrow and closing costs charged against the sale, in cents
        constraints: ">= 0"
      - name: broker_fee_cents
        type: integer
        source: input
        description: broker commission charged against the sale, in cents
        constraints: ">= 0"
      - name: recoverable_curative_cost_cents
        type: integer
        source: computed
        description: "see calculations.net_proceeds_determination; capped share of actual curative cost recovered off the top"
        default: 0
      - name: net_proceeds_cents
        type: integer
        source: computed
        description: "see calculations.net_proceeds_determination; the amount fed into the proceeds waterfall"
        default: 0
      - name: deed_restrictions
        type: array
        source: input
        description: list of restriction clause strings recorded on the deed
        constraints: "1..10 items"
      - name: reverter_condition
        type: string
        source: input
        description: condition whose breach triggers the reverter clause
      - name: reverter_cure_period_days
        type: integer
        source: input
        description: days the grantee has to cure a noticed violation before reversion may be enforced
        default: 180
        constraints: "30..730"
      - name: recording_status
        type: enum
        source: system
        description: "state dimension A - title/recording progress of the deed"
        default: PENDING_TITLE
        constraints: "PENDING_TITLE | READY_TO_RECORD | RECORDED | RESCINDED"
      - name: compliance_status
        type: enum
        source: system
        description: "state dimension B - deed-restriction compliance monitoring, evolves independently of recording_status"
        default: NOT_MONITORED
        constraints: "NOT_MONITORED | COMPLIANT | VIOLATION_NOTICED | CURED | REVERTED"
      - name: recorded_instrument_number
        type: string
        source: system
        description: county recorder instrument number
        default: null
      - name: recorded_at
        type: datetime
        source: system
        description: logical-clock instant of recording
        default: null
      - name: violation_noticed_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent notice of violation
        default: null
      - name: cure_deadline_at
        type: datetime
        source: computed
        description: "violation_noticed_at + reverter_cure_period_days days; null when no violation is outstanding"
        default: null
      - name: violation_description
        type: string
        source: system
        description: description recorded with the most recent notice of violation
        default: null
      - name: cure_note
        type: string
        source: system
        description: note recorded when a cure is accepted
        default: null
      - name: reverted_at
        type: datetime
        source: system
        description: logical-clock instant title reverted to the agency
        default: null
      - name: allocated_proceeds_cents
        type: integer
        source: computed
        description: "sum of ProceedsAllocation.amount_cents for this conveyance with status == POSTED"
        default: 0

  - name: Fund
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - name: name
        type: string
        source: input
        description: designated fund name
      - name: fund_code
        type: string
        source: input
        description: accounting code, unique across funds
        constraints: "unique"
      - name: priority_rank
        type: integer
        source: input
        description: waterfall position, 1 first; unique across funds
        constraints: ">= 1; unique"
      - name: allocation_pct
        type: number
        source: input
        description: "share of the post-reserve remainder, 0..1 with at most 4 decimals; the sum across all funds must equal 1.0 at recording time"
        constraints: "0 <= allocation_pct <= 1"
      - name: fixed_reserve_cents
        type: integer
        source: input
        description: statutory fixed reserve taken off the top before percentage shares
        default: 0
        constraints: ">= 0"
      - name: balance_cents
        type: integer
        source: system
        description: current fund balance in cents
        default: 0
      - name: lifetime_credits_cents
        type: integer
        source: system
        description: cumulative credits posted to the fund
        default: 0
      - name: lifetime_debits_cents
        type: integer
        source: system
        description: cumulative debits posted to the fund by allocation reversals
        default: 0

  - name: ProceedsAllocation
    parent: Conveyance
    common_fields: false
    kind: event
    fields:
      - name: conveyance_id
        type: string
        source: system
        description: "FK -> Conveyance.id; the conveyance whose net proceeds were allocated; null on CHALLENGE_FORFEITURE rows, which arise outside any conveyance"
        default: null
      - name: fund_id
        type: string
        source: system
        description: "FK -> Fund.id; the designated fund credited"
      - name: amount_cents
        type: integer
        source: system
        description: amount posted to the fund in cents
      - name: allocation_basis
        type: enum
        source: system
        description: which waterfall step produced this row
        constraints: "FIXED_RESERVE | PERCENTAGE | CHALLENGE_FORFEITURE"
      - name: residual_included_cents
        type: integer
        source: system
        description: "rounding residual folded into this row; non-zero only on the last percentage row"
        default: 0
      - name: status
        type: enum
        source: system
        description: whether the posting is still in force
        default: POSTED
        constraints: "POSTED | REVERSED"
      - name: reversed_at
        type: datetime
        source: system
        description: logical-clock instant the posting was reversed by reverter enforcement
        default: null

state_machines:
  - entity: SurplusDeclaration
    initial_state: DRAFT
    terminal_states: [CONVEYED, WITHDRAWN]
    shape: "cyclic with branching: PREFERENCE_CLOSED forks three ways and OFFERING_AUTHORIZED -> UNSUCCESSFUL -> NOTICED closes a re-offering loop"
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /declarations"
        actor: RealPropertyOfficer
        preconditions:
          - "Parcel exists"
          - "Parcel.ownership_status == AGENCY_OWNED"
          - "no other SurplusDeclaration exists for this parcel_id with status NOT IN {CONVEYED, WITHDRAWN} (else ERR_DUPLICATE_ACTIVE_DECLARATION)"
        side_effects:
          - "SurplusDeclaration created with status DRAFT, reoffer_count 0, preference_offer_count 0, unresolved_preference_count 0"
      - from: DRAFT
        to: ADOPTED
        trigger: "POST /declarations/{id}/adopt"
        actor: BoardClerk
        preconditions:
          - "status == DRAFT (else ERR_INVALID_DECLARATION_STATE)"
        side_effects:
          - "resolution_number := request.resolution_number"
          - "adopted_by_user_id := X-User-ID of the acting BoardClerk"
          - "adopted_at := current logical clock"
      - from: ADOPTED
        to: NOTICED
        trigger: "POST /declarations/{id}/issue-notices"
        actor: RealPropertyOfficer
        preconditions:
          - "status == ADOPTED (else ERR_INVALID_DECLARATION_STATE)"
          - "recipient_agency_ids has 1..20 distinct entries, each resolving to an Agency (else ERR_AGENCY_NOT_FOUND)"
          - "every recipient Agency.notice_registry_status == REGISTERED (else ERR_NOTICE_REGISTRY_LAPSED)"
          - "response_window_days IN 60..90 when supplied (else ERR_INVALID_REQUEST)"
        side_effects:
          - "creates one StatutoryNotice per recipient with notice_round 1, status ISSUED, issued_at := clock, response_window_days := request value or 60, response_deadline_at := issued_at + response_window_days days"
          - "notice_issued_at := clock; notice_response_window_days := response_window_days; notice_response_deadline_at recomputed"
      - from: NOTICED
        to: PREFERENCE_CLOSED
        trigger: "POST /declarations/{id}/close-preference-window"
        actor: RealPropertyOfficer
        preconditions:
          - "status == NOTICED (else ERR_INVALID_DECLARATION_STATE)"
          - "every StatutoryNotice of the current notice round has status != ISSUED, OR current logical clock >= notice_response_deadline_at (else ERR_PREFERENCE_WINDOW_STILL_OPEN)"
        side_effects:
          - "every StatutoryNotice of the current notice round with status == ISSUED transitions ISSUED -> EXPIRED"
          - "unresolved_preference_count recomputed over PreferenceOffer rows of this declaration"
      - from: PREFERENCE_CLOSED
        to: NEGOTIATION_AGREED
        trigger: "POST /preference-offers/{id}/conclude with outcome AGREED (system transition on the parent declaration)"
        actor: RealPropertyOfficer
        preconditions:
          - "declaration.status == PREFERENCE_CLOSED (else ERR_INVALID_DECLARATION_STATE)"
          - "offer.negotiation_status == IN_NEGOTIATION (else ERR_INVALID_OFFER_STATE)"
          - "request.agreed_price_cents >= offer.ah_minimum_price_cents (else ERR_AGREED_PRICE_BELOW_MINIMUM)"
        side_effects:
          - "offer.negotiation_status := AGREED; offer.agreed_price_cents := request value"
          - "every sibling PreferenceOffer of this declaration with negotiation_status IN {OPEN, IN_NEGOTIATION} transitions to LAPSED"
          - "unresolved_preference_count recomputed"
      - from: PREFERENCE_CLOSED
        to: OFFERING_AUTHORIZED
        trigger: "POST /declarations/{id}/authorize-disposition with disposition_type IN {COMPETITIVE_SALE, EXCHANGE}"
        actor: BoardClerk
        preconditions:
          - "status == PREFERENCE_CLOSED (else ERR_INVALID_DECLARATION_STATE)"
          - "every PreferenceOffer of this declaration has good_faith_status == SATISFIED (ERR_GOOD_FAITH_NOT_DETERMINED when UNREVIEWED or UNDER_REVIEW, ERR_GOOD_FAITH_DEFICIENT when DEFICIENT)"
          - "every PreferenceOffer of this declaration has negotiation_status IN {IMPASSE, LAPSED} (else ERR_NEGOTIATION_STILL_ACTIVE)"
          - "an EnvironmentalReview for this declaration has status == CERTIFIED (else ERR_ENV_REVIEW_NOT_CERTIFIED)"
          - "Parcel.disposition_ready == true (else ERR_PARCEL_NOT_DISPOSITION_READY)"
        side_effects:
          - "authorized_disposition_type := request.disposition_type; authority_findings := request.authority_findings"
      - from: NEGOTIATION_AGREED
        to: OFFERING_AUTHORIZED
        trigger: "POST /declarations/{id}/authorize-disposition with disposition_type IN {NEGOTIATED_SALE, EXCHANGE}"
        actor: BoardClerk
        preconditions:
          - "status == NEGOTIATION_AGREED (else ERR_INVALID_DECLARATION_STATE)"
          - "the PreferenceOffer with negotiation_status == AGREED has good_faith_status == SATISFIED (else ERR_GOOD_FAITH_NOT_DETERMINED / ERR_GOOD_FAITH_DEFICIENT)"
          - "an EnvironmentalReview for this declaration has status == CERTIFIED (else ERR_ENV_REVIEW_NOT_CERTIFIED)"
          - "Parcel.disposition_ready == true (else ERR_PARCEL_NOT_DISPOSITION_READY)"
          - "disposition_type != COMPETITIVE_SALE (else ERR_OFFERING_TYPE_AUTHORITY_MISMATCH)"
        side_effects:
          - "authorized_disposition_type := request.disposition_type; authority_findings := request.authority_findings"
      - from: OFFERING_AUTHORIZED
        to: UNSUCCESSFUL
        trigger: "system cascade link 2 of POST /offerings/{id}/close-bidding when the offering lands in FAILED_NO_QUALIFYING_BID"
        actor: system
        preconditions:
          - "the offering that just transitioned to FAILED_NO_QUALIFYING_BID has declaration_id == this declaration"
        side_effects:
          - "reoffer_count += 1"
          - "reoffer_eligible_at := current logical clock + REOFFER_COOLING_OFF_DAYS (30) days"
          - "authorized_disposition_type := null"
          - "cascade link 3: every Appraisal with parcel_id == this declaration's parcel_id and status == ACCEPTED transitions ACCEPTED -> SUPERSEDED with revaluation_required := true"
          - "cascade link 4: because the parcel lost its ACCEPTED appraisal, Parcel.valuation_status transitions CURRENT -> STALE and Parcel.disposition_ready recomputes to false"
      - from: UNSUCCESSFUL
        to: NOTICED
        trigger: "POST /declarations/{id}/re-offer"
        actor: RealPropertyOfficer
        preconditions:
          - "status == UNSUCCESSFUL (else ERR_INVALID_DECLARATION_STATE)"
          - "current logical clock >= reoffer_eligible_at (else ERR_REOFFER_COOLING_OFF)"
        side_effects:
          - "for every distinct recipient_agency_id of the highest existing notice_round, creates a StatutoryNotice with notice_round := that round + 1, status ISSUED, issued_at := clock, response_window_days := prior round's response_window_days, response_deadline_at := issued_at + response_window_days days"
          - "notice_issued_at := clock; notice_response_deadline_at recomputed"
          - "PreferenceOffer rows from earlier rounds keep their negotiation_status and good_faith_status unchanged"
      - from: OFFERING_AUTHORIZED
        to: CONVEYED
        trigger: "system cascade link 2 of POST /conveyances/{id}/record"
        actor: system
        preconditions:
          - "the parcel just transitioned to ownership_status CONVEYED"
        side_effects:
          - "cascade link 3: the proceeds waterfall runs, creating ProceedsAllocation rows and crediting Fund.balance_cents"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /declarations/{id}/withdraw"
        actor: BoardClerk
        preconditions:
          - "status NOT IN {CONVEYED, WITHDRAWN} (else ERR_INVALID_DECLARATION_STATE)"
        side_effects:
          - "withdrawn_reason := request.withdrawn_reason"
        note: "the same transition is declared from ADOPTED, NOTICED, PREFERENCE_CLOSED, NEGOTIATION_AGREED, OFFERING_AUTHORIZED and UNSUCCESSFUL; see the OFFERING_AUTHORIZED_to_WITHDRAWN row for the cascade"
      - from: OFFERING_AUTHORIZED
        to: WITHDRAWN
        trigger: "POST /declarations/{id}/withdraw"
        actor: BoardClerk
        preconditions:
          - "status NOT IN {CONVEYED, WITHDRAWN} (else ERR_INVALID_DECLARATION_STATE)"
        side_effects:
          - "withdrawn_reason := request.withdrawn_reason"
          - "cascade link 1: every DispositionOffering of this declaration with status IN {DRAFT, OPEN, EVALUATION, AWARDED} transitions to CANCELLED with cancellation_reason := 'declaration withdrawn'"
          - "cascade link 2: caused by each offering reaching CANCELLED, every Bid on it with qualification_status IN {SUBMITTED, QUALIFIED, WINNING, BACKUP} transitions to WITHDRAWN and its deposit_status transitions HELD -> RELEASED"
          - "cascade link 3: caused by each deposit reaching RELEASED, the owning Bidder gets escrow_held_cents -= bid.deposit_amount_cents and available_funds_cents += bid.deposit_amount_cents"

  - entity: StatutoryNotice
    initial_state: ISSUED
    terminal_states: [INTEREST_EXPRESSED, DECLINED, EXPIRED]
    shape: "branching: a single ISSUED state forks into three mutually exclusive outcomes with divergent side-effect sets"
    transitions:
      - from: ISSUED
        to: INTEREST_EXPRESSED
        trigger: "POST /notices/{id}/respond with response_type EXPRESS_INTEREST"
        actor: AgencyRepresentative
        preconditions:
          - "status == ISSUED (else ERR_INVALID_NOTICE_STATE)"
          - "X-User-ID == recipient_agency_id (else ERR_NOT_RESOURCE_OWNER)"
          - "current logical clock <= response_deadline_at (else ERR_NOTICE_RESPONSE_LATE)"
          - "recipient Agency.is_preference_entity == true (else ERR_NOT_PREFERENCE_ENTITY)"
          - "claimed_preference_category is supplied and equals the recipient Agency.preference_category (else ERR_INVALID_REQUEST)"
        side_effects:
          - "responded_at := clock; response_type := EXPRESS_INTEREST; claimed_preference_category and intended_use copied from the request"
          - "creates a PreferenceOffer with declaration_id, notice_id, offeror_agency_id := recipient_agency_id, preference_category := claimed_preference_category, negotiation_status OPEN, good_faith_status UNREVIEWED, negotiation_opened_at := clock, negotiation_deadline_at := clock + GOOD_FAITH_NEGOTIATION_DAYS (90) days"
          - "the new PreferenceOffer's ah_minimum_price_cents is computed by calculations.minimum_price_determination using the AFFORDABLE_HOUSING_PREFERENCE variant when preference_category == AFFORDABLE_HOUSING and the MARKET_FLOOR variant otherwise"
          - "declaration.preference_offer_count += 1; declaration.unresolved_preference_count recomputed"
      - from: ISSUED
        to: DECLINED
        trigger: "POST /notices/{id}/respond with response_type DECLINE"
        actor: AgencyRepresentative
        preconditions:
          - "status == ISSUED (else ERR_INVALID_NOTICE_STATE)"
          - "X-User-ID == recipient_agency_id (else ERR_NOT_RESOURCE_OWNER)"
          - "current logical clock <= response_deadline_at (else ERR_NOTICE_RESPONSE_LATE)"
        side_effects:
          - "responded_at := clock; response_type := DECLINE"
          - "no PreferenceOffer is created"
      - from: ISSUED
        to: EXPIRED
        trigger: "system side effect of POST /declarations/{id}/close-preference-window"
        actor: system
        preconditions:
          - "the notice belongs to the declaration's current notice round and status == ISSUED"
        side_effects:
          - "no PreferenceOffer is created; the recipient forfeits its preference right for this round"

  - entity: PreferenceOffer
    initial_state: "negotiation_status OPEN x good_faith_status UNREVIEWED"
    terminal_states: [AGREED, IMPASSE, LAPSED, SATISFIED, DEFICIENT]
    shape: "parallel dimensions: negotiation_status (OPEN -> IN_NEGOTIATION -> AGREED|IMPASSE|LAPSED) and good_faith_status (UNREVIEWED -> UNDER_REVIEW -> SATISFIED|DEFICIENT) advance independently on the same row"
    transitions:
      - from: OPEN
        to: IN_NEGOTIATION
        trigger: "POST /preference-offers/{id}/rounds (first round appended)"
        actor: RealPropertyOfficer
        dimension: negotiation_status
        preconditions:
          - "negotiation_status == OPEN (else no dimension-A change occurs)"
          - "declaration.status IN {NOTICED, PREFERENCE_CLOSED} (else ERR_INVALID_DECLARATION_STATE)"
          - "current logical clock <= negotiation_deadline_at (else ERR_NEGOTIATION_WINDOW_EXPIRED)"
        side_effects:
          - "NegotiationRound created with round_number := existing round count + 1"
          - "officer_round_count / entity_round_count / timely_response_count recomputed"
          - "interim_good_faith_score recomputed via the INTERIM variant of calculations.good_faith_compliance_score"
      - from: IN_NEGOTIATION
        to: IN_NEGOTIATION
        trigger: "POST /preference-offers/{id}/rounds (subsequent rounds, either party)"
        actor: "RealPropertyOfficer | AgencyRepresentative"
        dimension: negotiation_status
        preconditions:
          - "negotiation_status == IN_NEGOTIATION (else ERR_INVALID_OFFER_STATE)"
          - "current logical clock <= negotiation_deadline_at (else ERR_NEGOTIATION_WINDOW_EXPIRED)"
          - "when responded_to_round_number is supplied it must name an existing round of this offer whose party differs from the new round's party (else ERR_INVALID_ROUND_REFERENCE)"
          - "when the actor is AgencyRepresentative, X-User-ID == offeror_agency_id and party == PREFERENCE_ENTITY (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "NegotiationRound created; responded_within_days and is_timely computed against the answered round's created_at"
          - "officer_round_count / entity_round_count / timely_response_count recomputed"
          - "interim_good_faith_score recomputed"
        note: "self-loop - this is the negotiation-round cycle"
      - from: IN_NEGOTIATION
        to: IMPASSE
        trigger: "POST /preference-offers/{id}/conclude with outcome IMPASSE"
        actor: RealPropertyOfficer
        dimension: negotiation_status
        preconditions:
          - "negotiation_status == IN_NEGOTIATION (else ERR_INVALID_OFFER_STATE)"
          - "declaration.status == PREFERENCE_CLOSED (else ERR_INVALID_DECLARATION_STATE)"
        side_effects:
          - "agreed_price_cents stays null; declaration.unresolved_preference_count recomputed"
      - from: IN_NEGOTIATION
        to: AGREED
        trigger: "POST /preference-offers/{id}/conclude with outcome AGREED"
        actor: RealPropertyOfficer
        dimension: negotiation_status
        preconditions:
          - "negotiation_status == IN_NEGOTIATION (else ERR_INVALID_OFFER_STATE)"
          - "declaration.status == PREFERENCE_CLOSED (else ERR_INVALID_DECLARATION_STATE)"
          - "agreed_price_cents supplied and >= ah_minimum_price_cents (else ERR_AGREED_PRICE_BELOW_MINIMUM)"
          - "at least REQUIRED_ROUNDS (3) NegotiationRound rows with party == CUSTODIAN_AGENCY exist on this offer, so the statutory good-faith negotiation duty is discharged before an agreement is struck (else ERR_GOOD_FAITH_ROUNDS_NOT_MET)"
        side_effects:
          - "agreed_price_cents := request value"
          - "declaration transitions PREFERENCE_CLOSED -> NEGOTIATION_AGREED"
          - "sibling offers with negotiation_status IN {OPEN, IN_NEGOTIATION} transition to LAPSED"
      - from: OPEN
        to: LAPSED
        trigger: "system side effect of a sibling offer concluding AGREED"
        actor: system
        dimension: negotiation_status
        preconditions:
          - "negotiation_status IN {OPEN, IN_NEGOTIATION} and a sibling offer of the same declaration just reached AGREED"
        side_effects:
          - "declaration.unresolved_preference_count recomputed"
      - from: UNREVIEWED
        to: UNDER_REVIEW
        trigger: "POST /preference-offers/{id}/good-faith-review"
        actor: ComplianceMonitor
        dimension: good_faith_status
        preconditions:
          - "good_faith_status == UNREVIEWED (else ERR_INVALID_GOOD_FAITH_STATE)"
        side_effects:
          - "negotiation_status is NOT changed by this transition"
          - "declaration.unresolved_preference_count recomputed"
      - from: UNDER_REVIEW
        to: SATISFIED
        trigger: "POST /preference-offers/{id}/good-faith-determination when the final score >= GOOD_FAITH_PASS_SCORE (70)"
        actor: ComplianceMonitor
        dimension: good_faith_status
        preconditions:
          - "good_faith_status == UNDER_REVIEW (else ERR_INVALID_GOOD_FAITH_STATE)"
          - "negotiation_status IN {AGREED, IMPASSE, LAPSED} (else ERR_NEGOTIATION_STILL_ACTIVE)"
        side_effects:
          - "final_good_faith_score := FINAL variant of calculations.good_faith_compliance_score, frozen"
          - "remediation_note := request value when supplied"
          - "declaration.unresolved_preference_count recomputed"
      - from: UNDER_REVIEW
        to: DEFICIENT
        trigger: "POST /preference-offers/{id}/good-faith-determination when the final score < GOOD_FAITH_PASS_SCORE (70)"
        actor: ComplianceMonitor
        dimension: good_faith_status
        preconditions:
          - "good_faith_status == UNDER_REVIEW (else ERR_INVALID_GOOD_FAITH_STATE)"
          - "negotiation_status IN {AGREED, IMPASSE, LAPSED} (else ERR_NEGOTIATION_STILL_ACTIVE)"
        side_effects:
          - "final_good_faith_score := FINAL variant score, frozen"
          - "the declaration can no longer be authorized while this offer is DEFICIENT (ERR_GOOD_FAITH_DEFICIENT)"

  - entity: Appraisal
    initial_state: ORDERED
    terminal_states: [SUPERSEDED, EXPIRED]
    shape: "cyclic: REPORTED -> CHALLENGED -> REPORTED closes a revision loop driven by sustained appraisal challenges"
    transitions:
      - from: null
        to: ORDERED
        trigger: "POST /appraisals"
        actor: RealPropertyOfficer
        preconditions:
          - "Parcel and Appraiser exist (else ERR_PARCEL_NOT_FOUND / ERR_APPRAISER_NOT_FOUND)"
          - "expected_parcel_version == Parcel.version (else ERR_STALE_PARCEL_VERSION)"
          - "Appraiser.license_status == ACTIVE (else ERR_APPRAISER_LICENSE_EXPIRED)"
          - "engagement_end_on >= engagement_start_on (else ERR_INVALID_REQUEST)"
          - "the appraiser has at most APPRAISER_MAX_CONCURRENT_ENGAGEMENTS - 1 (1) existing engagements whose closed interval [engagement_start_on, engagement_end_on] intersects the requested closed interval, counting only appraisals with status IN {ORDERED, REPORTED, CHALLENGED} (else ERR_APPRAISER_CAPACITY_EXCEEDED)"
        side_effects:
          - "Appraisal created with status ORDERED"
          - "Parcel.version += 1 (the OCC token this create consumed is now stale for every other writer)"
          - "Appraiser.active_engagement_count recomputed"
      - from: ORDERED
        to: REPORTED
        trigger: "POST /appraisals/{id}/report"
        actor: Appraiser
        preconditions:
          - "status == ORDERED (else ERR_INVALID_APPRAISAL_STATE)"
          - "X-User-ID == appraiser_id (else ERR_NOT_RESOURCE_OWNER)"
          - "appraised_value_cents >= 0 and effective_date is a valid ISO 8601 UTC instant (else ERR_INVALID_REQUEST)"
        side_effects:
          - "appraised_value_cents, effective_date, narrative recorded; reported_at := clock"
          - "expires_on := effective_date + APPRAISAL_VALIDITY_DAYS (365) days"
      - from: REPORTED
        to: ACCEPTED
        trigger: "POST /appraisals/{id}/accept"
        actor: RealPropertyOfficer
        preconditions:
          - "status == REPORTED (else ERR_INVALID_APPRAISAL_STATE)"
          - "no AppraisalChallenge on this appraisal has status == SUBMITTED (else ERR_INVALID_APPRAISAL_STATE)"
          - "current logical clock < expires_on (else ERR_APPRAISAL_EXPIRED)"
        side_effects:
          - "accepted_at := clock"
          - "every other Appraisal for the same parcel with status == ACCEPTED transitions ACCEPTED -> SUPERSEDED"
          - "Parcel.valuation_status := CURRENT and Parcel.disposition_ready recomputed"
      - from: REPORTED
        to: CHALLENGED
        trigger: "system side effect of POST /appraisals/{id}/challenges"
        actor: system
        preconditions:
          - "status == REPORTED and the filed challenge passed all validations"
        side_effects:
          - "challenge_count += 1"
      - from: CHALLENGED
        to: REPORTED
        trigger: "system side effect of POST /appraisal-challenges/{id}/determine"
        actor: system
        preconditions:
          - "the determination is SUSTAINED (appraised_value_cents is overwritten) or DENIED (value preserved)"
        side_effects:
          - "on SUSTAINED: appraised_value_cents := challenge.revised_value_cents; expires_on unchanged (effective_date is not re-dated)"
          - "on DENIED: appraised_value_cents unchanged"
        note: "this is the cycle edge - a parcel can be re-challenged after revision, so REPORTED -> CHALLENGED -> REPORTED may repeat"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system side effect of accepting a newer Appraisal for the same parcel, or cascade link 3 of an unsuccessful disposition"
        actor: system
        preconditions:
          - "status == ACCEPTED"
        side_effects:
          - "when triggered by the unsuccessful-disposition cascade, revaluation_required := true and Parcel.valuation_status transitions CURRENT -> STALE"
      - from: ACCEPTED
        to: EXPIRED
        trigger: "system evaluation at POST /offerings when current logical clock >= expires_on"
        actor: system
        preconditions:
          - "status == ACCEPTED and current logical clock >= expires_on"
        side_effects:
          - "Parcel.valuation_status := STALE; the offering create that observed the expiry is rejected with ERR_APPRAISAL_EXPIRED"

  - entity: AppraisalChallenge
    initial_state: SUBMITTED
    terminal_states: [SUSTAINED, DENIED]
    shape: "branching: SUBMITTED forks into SUSTAINED and DENIED with disjoint side-effect sets (refund + revaluation vs forfeiture into the rank-1 fund)"
    transitions:
      - from: null
        to: SUBMITTED
        trigger: "POST /appraisals/{id}/challenges"
        actor: AgencyRepresentative
        preconditions:
          - "Appraisal exists and status == REPORTED (else ERR_INVALID_APPRAISAL_STATE)"
          - "X-User-ID resolves to an Agency (else ERR_AGENCY_NOT_FOUND)"
          - "current logical clock <= reported_at + CHALLENGE_WINDOW_DAYS (30) days (else ERR_CHALLENGE_WINDOW_CLOSED)"
          - "abs(asserted_value_cents - appraisal.appraised_value_cents) >= round_half_up(CHALLENGE_MIN_DELTA_PCT (0.05) * appraisal.appraised_value_cents) (else ERR_CHALLENGE_DELTA_TOO_SMALL)"
          - "deposit_paid_cents >= required_deposit_cents from calculations.challenge_deposit_requirement (else ERR_CHALLENGE_DEPOSIT_INSUFFICIENT)"
        side_effects:
          - "AppraisalChallenge created with required_deposit_cents frozen"
          - "Appraisal transitions REPORTED -> CHALLENGED and challenge_count += 1"
      - from: SUBMITTED
        to: SUSTAINED
        trigger: "POST /appraisal-challenges/{id}/determine with determination SUSTAINED"
        actor: BoardClerk
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_APPRAISAL_STATE)"
          - "X-User-ID != the declaration's adopted_by_user_id for the declaration on this appraisal's parcel (else ERR_SEGREGATION_OF_DUTIES)"
          - "revised_value_cents supplied and >= 0 (else ERR_INVALID_REQUEST)"
        side_effects:
          - "determined_by_user_id := X-User-ID; revised_value_cents recorded"
          - "deposit_refunded_cents := deposit_paid_cents; deposit_forfeited_cents := 0"
          - "Appraisal transitions CHALLENGED -> REPORTED with appraised_value_cents := revised_value_cents"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /appraisal-challenges/{id}/determine with determination DENIED"
        actor: BoardClerk
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_APPRAISAL_STATE)"
          - "X-User-ID != the declaration's adopted_by_user_id for the declaration on this appraisal's parcel (else ERR_SEGREGATION_OF_DUTIES)"
          - "at least one Fund exists (else ERR_FUNDS_NOT_CONFIGURED)"
        side_effects:
          - "determined_by_user_id := X-User-ID; revised_value_cents stays null"
          - "cascade link 1: deposit_forfeited_cents := deposit_paid_cents; deposit_refunded_cents := 0"
          - "cascade link 2: caused by the forfeiture, a ProceedsAllocation row is created with conveyance_id null, fund_id := the Fund with the lowest priority_rank, allocation_basis CHALLENGE_FORFEITURE, amount_cents := deposit_forfeited_cents, status POSTED"
          - "cascade link 3: caused by the posting, that Fund gets balance_cents += amount_cents and lifetime_credits_cents += amount_cents"
          - "Appraisal transitions CHALLENGED -> REPORTED with appraised_value_cents unchanged"

  - entity: EnvironmentalReview
    initial_state: CIRCULATING
    terminal_states: [CERTIFIED]
    shape: "cyclic: CIRCULATING -> RECIRCULATION_REQUIRED -> CIRCULATING, with an EXEMPT branch that skips circulation entirely"
    transitions:
      - from: null
        to: CIRCULATING
        trigger: "POST /declarations/{id}/environmental-reviews with determination_class IN {NEGATIVE_DECLARATION, MITIGATED_NEG_DEC, FULL_EIR}"
        actor: RealPropertyOfficer
        preconditions:
          - "declaration exists and status IN {ADOPTED, NOTICED, PREFERENCE_CLOSED, NEGOTIATION_AGREED} (else ERR_INVALID_DECLARATION_STATE)"
          - "circulation_end_on - circulation_start_on >= ENV_CIRCULATION_MIN_DAYS (30) days (else ERR_CIRCULATION_TOO_SHORT)"
          - "the requested closed interval [circulation_start_on, circulation_end_on] does not intersect the closed interval of any existing EnvironmentalReview on this declaration - touching endpoints count as an intersection (else ERR_CIRCULATION_WINDOW_OVERLAP)"
        side_effects:
          - "EnvironmentalReview created with status CIRCULATING, circulation_round 1"
      - from: null
        to: CERTIFIED
        trigger: "POST /declarations/{id}/environmental-reviews with determination_class EXEMPT"
        actor: RealPropertyOfficer
        preconditions:
          - "declaration exists and status IN {ADOPTED, NOTICED, PREFERENCE_CLOSED, NEGOTIATION_AGREED} (else ERR_INVALID_DECLARATION_STATE)"
          - "circulation_start_on and circulation_end_on are optional on this branch and are ignored: an exemption is not circulated, so neither the ENV_CIRCULATION_MIN_DAYS floor nor the interval-overlap check applies"
        side_effects:
          - "EnvironmentalReview created already CERTIFIED with certified_at := clock - no separate certify call is possible (that branch's side-effect set differs from the CIRCULATING branch)"
      - from: CIRCULATING
        to: CERTIFIED
        trigger: "POST /environmental-reviews/{id}/certify"
        actor: RealPropertyOfficer
        preconditions:
          - "status == CIRCULATING (else ERR_INVALID_ENV_REVIEW_STATE)"
          - "current logical clock >= circulation_end_on (else ERR_INVALID_ENV_REVIEW_STATE)"
        side_effects:
          - "certified_at := clock"
      - from: CIRCULATING
        to: RECIRCULATION_REQUIRED
        trigger: "POST /environmental-reviews/{id}/recirculate"
        actor: RealPropertyOfficer
        preconditions:
          - "status == CIRCULATING (else ERR_INVALID_ENV_REVIEW_STATE)"
          - "the new closed interval starts at least RECIRCULATION_BUFFER_DAYS (30) days after the current circulation_end_on (else ERR_RECIRCULATION_BUFFER_VIOLATION)"
          - "the new closed interval spans >= ENV_CIRCULATION_MIN_DAYS (30) days (else ERR_CIRCULATION_TOO_SHORT)"
        side_effects:
          - "recirculation_reason := request.recirculation_reason"
          - "status is set to RECIRCULATION_REQUIRED and then immediately to CIRCULATING with circulation_start_on / circulation_end_on replaced by the request values and circulation_round += 1"
        note: "closes the recirculation cycle - the review returns to CIRCULATING with a new interval"

  - entity: TitleCurativeItem
    initial_state: OPEN
    terminal_states: [CURED, WAIVED_WITH_ENDORSEMENT, RESERVED_AS_EASEMENT]
    shape: "branching: OPEN forks into three resolutions with divergent side-effect sets"
    transitions:
      - from: OPEN
        to: CURED
        trigger: "POST /title-items/{id}/resolve with resolution CURED"
        actor: RealPropertyOfficer
        preconditions:
          - "status == OPEN (else ERR_INVALID_TITLE_ITEM_STATE)"
        side_effects:
          - "actual_cure_cost_cents := request.actual_cure_cost_cents when supplied, else cure_cost_estimate_cents; resolved_at := clock"
          - "Parcel.open_title_item_count -= 1 and Parcel.disposition_ready recomputed"
      - from: OPEN
        to: WAIVED_WITH_ENDORSEMENT
        trigger: "POST /title-items/{id}/resolve with resolution WAIVED_WITH_ENDORSEMENT"
        actor: RealPropertyOfficer
        preconditions:
          - "status == OPEN (else ERR_INVALID_TITLE_ITEM_STATE)"
        side_effects:
          - "actual_cure_cost_cents := 0 (an insurer endorsement carries no curative spend); resolved_at := clock"
          - "Parcel.open_title_item_count -= 1 and Parcel.disposition_ready recomputed"
      - from: OPEN
        to: RESERVED_AS_EASEMENT
        trigger: "POST /title-items/{id}/resolve with resolution RESERVED_AS_EASEMENT"
        actor: RealPropertyOfficer
        preconditions:
          - "status == OPEN (else ERR_INVALID_TITLE_ITEM_STATE)"
          - "easement_purpose and easement_area_sqft are both supplied and easement_area_sqft > 0 (else ERR_INVALID_REQUEST)"
        side_effects:
          - "easement_purpose / easement_area_sqft recorded; actual_cure_cost_cents := 0; resolved_at := clock"
          - "Parcel.open_title_item_count -= 1 and Parcel.disposition_ready recomputed"
          - "raises the parcel's reserved-easement count, which POST /offerings/{id}/conveyance enforces: len(deed_restrictions) must be >= the count of RESERVED_AS_EASEMENT TitleCurativeItem rows on the parcel (else ERR_EASEMENT_RESERVATION_MISSING)"

  - entity: DispositionOffering
    initial_state: DRAFT
    terminal_states: [CLOSED_CONVEYED, CANCELLED]
    shape: "branching by offering_type plus an AWARDED -> EVALUATION rescission cycle: COMPETITIVE_SALE runs OPEN -> EVALUATION -> AWARDED while NEGOTIATED_SALE and EXCHANGE run OPEN -> AWARDED directly, and rescission diverges per branch"
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /offerings"
        actor: RealPropertyOfficer
        preconditions:
          - "declaration exists and status == OFFERING_AUTHORIZED (else ERR_INVALID_DECLARATION_STATE)"
          - "expected_declaration_version == SurplusDeclaration.version (else ERR_STALE_DECLARATION_VERSION)"
          - "offering_type == declaration.authorized_disposition_type (else ERR_OFFERING_TYPE_AUTHORITY_MISMATCH)"
          - "when offering_type == NEGOTIATED_SALE: exactly one of counterparty_bidder_id / counterparty_agency_id is supplied and resolvable (else ERR_NEGOTIATED_BUYER_REQUIRED)"
          - "when offering_type == NEGOTIATED_SALE and the declaration reached OFFERING_AUTHORIZED from NEGOTIATION_AGREED: counterparty_agency_id MUST equal the offeror_agency_id of the PreferenceOffer whose negotiation_status == AGREED (else ERR_NEGOTIATED_BUYER_REQUIRED)"
          - "when offering_type == EXCHANGE: counterparty_agency_id supplied and resolvable and counterparty_bidder_id null (else ERR_EXCHANGE_COUNTERPARTY_REQUIRED)"
          - "when offering_type == COMPETITIVE_SALE: both counterparty fields null (else ERR_INVALID_REQUEST)"
          - "Parcel.disposition_ready == true (else ERR_PARCEL_NOT_DISPOSITION_READY)"
          - "an Appraisal for the parcel has status == ACCEPTED (else ERR_NO_ACCEPTED_APPRAISAL)"
          - "current logical clock < that appraisal's expires_on (else ERR_APPRAISAL_EXPIRED)"
          - "bid_close_at > bid_open_at (else ERR_OFFERING_WINDOW_INVALID)"
          - "the half-open interval [bid_open_at, bid_close_at) does not intersect the half-open interval of any other DispositionOffering on the same parcel with status IN {DRAFT, OPEN, EVALUATION, AWARDED} - touching endpoints (new.bid_open_at == other.bid_close_at) do NOT intersect (else ERR_OFFERING_WINDOW_CONFLICT)"
        side_effects:
          - "minimum_price_cents and minimum_price_variant computed by calculations.minimum_price_determination and frozen"
          - "required_deposit_cents computed by calculations.required_bid_deposit and frozen"
          - "SurplusDeclaration.version += 1"
      - from: DRAFT
        to: OPEN
        trigger: "POST /offerings/{id}/publish"
        actor: RealPropertyOfficer
        preconditions:
          - "status == DRAFT (else ERR_INVALID_OFFERING_STATE)"
          - "current logical clock < bid_close_at (else ERR_INVALID_OFFERING_STATE)"
        side_effects:
          - "the offering becomes bid-eligible for the window [bid_open_at, bid_close_at)"
      - from: OPEN
        to: EVALUATION
        trigger: "POST /offerings/{id}/close-bidding when at least one bid grades QUALIFIED"
        actor: RealPropertyOfficer
        preconditions:
          - "status == OPEN (else ERR_INVALID_OFFERING_STATE)"
          - "offering_type == COMPETITIVE_SALE (else ERR_INVALID_OFFERING_STATE)"
          - "current logical clock >= bid_close_at (else ERR_BIDDING_STILL_OPEN)"
        side_effects:
          - "every Bid with qualification_status == SUBMITTED is graded: QUALIFIED when its Bidder.debarment_status == CLEAR, otherwise DISQUALIFIED with disqualification_reason 'bidder debarred'"
          - "each DISQUALIFIED bid's deposit_status transitions HELD -> RELEASED, and its Bidder gets escrow_held_cents -= deposit_amount_cents and available_funds_cents += deposit_amount_cents"
          - "qualified_bid_count recomputed"
      - from: OPEN
        to: FAILED_NO_QUALIFYING_BID
        trigger: "POST /offerings/{id}/close-bidding when the qualifying candidate set is empty"
        actor: RealPropertyOfficer
        preconditions:
          - "status == OPEN and offering_type == COMPETITIVE_SALE"
          - "current logical clock >= bid_close_at (else ERR_BIDDING_STILL_OPEN)"
          - "after grading, qualified_bid_count == 0 (the empty-candidate-set fallback of calculations.award_selection)"
        side_effects:
          - "cascade link 1: this offering reaches FAILED_NO_QUALIFYING_BID"
          - "cascade link 2: caused by link 1, SurplusDeclaration transitions OFFERING_AUTHORIZED -> UNSUCCESSFUL, reoffer_count += 1, reoffer_eligible_at := clock + 30 days, authorized_disposition_type := null"
          - "cascade link 3: caused by link 2, every ACCEPTED Appraisal on the parcel transitions ACCEPTED -> SUPERSEDED with revaluation_required := true"
          - "cascade link 4: caused by link 3, Parcel.valuation_status transitions CURRENT -> STALE and Parcel.disposition_ready recomputes to false"
      - from: EVALUATION
        to: AWARDED
        trigger: "POST /offerings/{id}/award (competitive branch)"
        actor: BoardClerk
        preconditions:
          - "status == EVALUATION (else ERR_INVALID_OFFERING_STATE)"
          - "qualified_bid_count >= 1 (else ERR_NO_QUALIFYING_BID)"
        side_effects:
          - "calculations.award_selection ranks the qualified bids; rank 1 becomes WINNING, ranks 2..n become BACKUP, each with award_rank set"
          - "winning_bid_amount_cents := the winning bid's amount_cents; awarded_at := clock; awarded_by_user_id := X-User-ID"
      - from: OPEN
        to: AWARDED
        trigger: "POST /offerings/{id}/award (negotiated / exchange branch)"
        actor: BoardClerk
        preconditions:
          - "status == OPEN (else ERR_INVALID_OFFERING_STATE)"
          - "offering_type IN {NEGOTIATED_SALE, EXCHANGE} (else ERR_INVALID_OFFERING_STATE)"
          - "no Bid exists on this offering (bids are only accepted on COMPETITIVE_SALE offerings)"
        side_effects:
          - "winning_bid_amount_cents := the agreed_price_cents of the PreferenceOffer on this declaration whose negotiation_status == AGREED when one exists, otherwise := minimum_price_cents"
          - "awarded_at := clock; awarded_by_user_id := X-User-ID; no bid rows are touched"
        note: "divergent side-effect set from the competitive branch: no ranking, no deposit movement"
      - from: AWARDED
        to: EVALUATION
        trigger: "POST /offerings/{id}/rescind-award on a COMPETITIVE_SALE offering"
        actor: BoardClerk
        preconditions:
          - "status == AWARDED (else ERR_INVALID_OFFERING_STATE)"
          - "offering_type == COMPETITIVE_SALE"
          - "no Conveyance on this offering has recording_status == RECORDED (else ERR_INVALID_CONVEYANCE_STATE)"
        side_effects:
          - "rescind_count += 1; winning_bid_amount_cents := null; awarded_at := null; awarded_by_user_id := null"
          - "the WINNING bid transitions to DISQUALIFIED with disqualification_reason := request.cancellation_reason, award_rank := null, and its deposit_status transitions HELD -> RELEASED with the bidder refunded"
          - "every BACKUP bid transitions back to QUALIFIED with award_rank := null"
          - "any Conveyance on this offering with recording_status IN {PENDING_TITLE, READY_TO_RECORD} transitions to RESCINDED"
          - "qualified_bid_count recomputed"
        note: "cycle edge - the offering can be awarded again to the former backup bidder"
      - from: AWARDED
        to: CANCELLED
        trigger: "POST /offerings/{id}/rescind-award on a NEGOTIATED_SALE or EXCHANGE offering"
        actor: BoardClerk
        preconditions:
          - "status == AWARDED and offering_type IN {NEGOTIATED_SALE, EXCHANGE}"
          - "no Conveyance on this offering has recording_status == RECORDED (else ERR_INVALID_CONVEYANCE_STATE)"
        side_effects:
          - "rescind_count += 1; cancellation_reason := request.cancellation_reason; winning_bid_amount_cents := null"
          - "any Conveyance on this offering with recording_status IN {PENDING_TITLE, READY_TO_RECORD} transitions to RESCINDED"
        note: "there is no backup candidate pool on a negotiated or exchange offering, so rescission is terminal for the offering"
      - from: AWARDED
        to: CLOSED_CONVEYED
        trigger: "system cascade of POST /conveyances/{id}/record"
        actor: system
        preconditions:
          - "the conveyance on this offering just reached recording_status RECORDED"
        side_effects:
          - "the winning Bid (when one exists) transitions deposit_status HELD -> APPLIED and its Bidder gets escrow_held_cents -= deposit_amount_cents (the cash leaves the bidder's balance sheet)"
      - from: OPEN
        to: CANCELLED
        trigger: "system cascade of POST /declarations/{id}/withdraw"
        actor: system
        preconditions:
          - "status IN {DRAFT, OPEN, EVALUATION, AWARDED}"
        side_effects:
          - "cancellation_reason := 'declaration withdrawn'"
          - "every Bid with qualification_status IN {SUBMITTED, QUALIFIED, WINNING, BACKUP} transitions to WITHDRAWN with deposit_status HELD -> RELEASED and the bidder refunded"

  - entity: Bid
    initial_state: "qualification_status SUBMITTED x deposit_status HELD"
    terminal_states: [DISQUALIFIED, WITHDRAWN, RELEASED, APPLIED]
    shape: "parallel dimensions: qualification_status (responsiveness / award standing) and deposit_status (custody of the cash) advance independently on the same row"
    transitions:
      - from: null
        to: SUBMITTED
        trigger: "POST /offerings/{id}/bids"
        actor: Bidder
        dimension: qualification_status
        preconditions:
          - "offering exists and status == OPEN (else ERR_INVALID_OFFERING_STATE)"
          - "offering_type == COMPETITIVE_SALE (else ERR_COMPETITIVE_BID_NOT_ALLOWED)"
          - "bid_open_at <= current logical clock < bid_close_at (else ERR_BIDDING_CLOSED)"
          - "X-User-ID resolves to a Bidder (else ERR_BIDDER_NOT_FOUND)"
          - "Bidder.debarment_status == CLEAR (else ERR_BIDDER_DEBARRED)"
          - "amount_cents >= offering.minimum_price_cents (else ERR_BID_BELOW_MINIMUM)"
          - "deposit_amount_cents >= offering.required_deposit_cents (else ERR_DEPOSIT_INSUFFICIENT)"
          - "deposit_amount_cents <= Bidder.available_funds_cents (else ERR_INSUFFICIENT_BIDDER_FUNDS)"
        side_effects:
          - "Bid created with qualification_status SUBMITTED, deposit_status HELD, submitted_at := clock"
          - "Bidder.available_funds_cents -= deposit_amount_cents and Bidder.escrow_held_cents += deposit_amount_cents; lifetime_deposits_cents is NOT touched (it tracks funding credits only)"
      - from: SUBMITTED
        to: QUALIFIED
        trigger: "system grading during POST /offerings/{id}/close-bidding"
        actor: system
        dimension: qualification_status
        preconditions:
          - "qualification_status == SUBMITTED and the owning Bidder.debarment_status == CLEAR"
        side_effects:
          - "offering.qualified_bid_count += 1; deposit_status stays HELD"
      - from: SUBMITTED
        to: DISQUALIFIED
        trigger: "system grading during POST /offerings/{id}/close-bidding when the bidder was debarred after submission"
        actor: system
        dimension: qualification_status
        preconditions:
          - "qualification_status == SUBMITTED and the owning Bidder.debarment_status == DEBARRED"
        side_effects:
          - "disqualification_reason := 'bidder debarred'"
          - "deposit_status transitions HELD -> RELEASED with the bidder refunded"
      - from: QUALIFIED
        to: WINNING
        trigger: "system ranking during POST /offerings/{id}/award"
        actor: system
        dimension: qualification_status
        preconditions:
          - "qualification_status == QUALIFIED and calculations.award_selection assigned rank 1"
        side_effects:
          - "award_rank := 1"
      - from: QUALIFIED
        to: BACKUP
        trigger: "system ranking during POST /offerings/{id}/award"
        actor: system
        dimension: qualification_status
        preconditions:
          - "qualification_status == QUALIFIED and calculations.award_selection assigned rank >= 2"
        side_effects:
          - "award_rank := the assigned rank"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /bids/{id}/withdraw"
        actor: Bidder
        dimension: qualification_status
        preconditions:
          - "qualification_status == SUBMITTED (else ERR_INVALID_BID_STATE)"
          - "X-User-ID == bidder_id (else ERR_NOT_RESOURCE_OWNER)"
          - "offering.status == OPEN and current logical clock < offering.bid_close_at (else ERR_BIDDING_CLOSED)"
        side_effects:
          - "deposit_status transitions HELD -> RELEASED"
          - "Bidder.escrow_held_cents -= deposit_amount_cents; Bidder.available_funds_cents += deposit_amount_cents (compensating action - the pair leaves available_funds_cents + escrow_held_cents unchanged)"
      - from: HELD
        to: RELEASED
        trigger: "system side effect of bid withdrawal, disqualification, award rescission or declaration withdrawal"
        actor: system
        dimension: deposit_status
        preconditions:
          - "deposit_status == HELD"
        side_effects:
          - "Bidder.escrow_held_cents -= deposit_amount_cents; Bidder.available_funds_cents += deposit_amount_cents"
      - from: HELD
        to: APPLIED
        trigger: "system side effect of POST /conveyances/{id}/record for the WINNING bid"
        actor: system
        dimension: deposit_status
        preconditions:
          - "deposit_status == HELD and qualification_status == WINNING"
        side_effects:
          - "Bidder.escrow_held_cents -= deposit_amount_cents and available_funds_cents is NOT credited - the deposit is applied to the purchase price"

  - entity: Conveyance
    initial_state: "recording_status PENDING_TITLE x compliance_status NOT_MONITORED"
    terminal_states: [RESCINDED, REVERTED]
    shape: "parallel dimensions with a cycle on dimension B: recording_status (PENDING_TITLE -> READY_TO_RECORD -> RECORDED -> RESCINDED) and compliance_status (NOT_MONITORED -> COMPLIANT -> VIOLATION_NOTICED -> CURED -> VIOLATION_NOTICED ... -> REVERTED)"
    transitions:
      - from: null
        to: PENDING_TITLE
        trigger: "POST /offerings/{id}/conveyance"
        actor: RealPropertyOfficer
        dimension: recording_status
        preconditions:
          - "offering exists and status == AWARDED (else ERR_INVALID_OFFERING_STATE)"
          - "no other Conveyance on this offering has recording_status IN {PENDING_TITLE, READY_TO_RECORD, RECORDED} (else ERR_INVALID_CONVEYANCE_STATE)"
          - "len(deed_restrictions) >= the count of TitleCurativeItem rows on the parcel with status == RESERVED_AS_EASEMENT, and deed_restrictions has 1..10 entries (else ERR_EASEMENT_RESERVATION_MISSING)"
          - "reverter_cure_period_days IN 30..730 when supplied (else ERR_INVALID_REQUEST)"
        side_effects:
          - "parcel_id copied from the declaration; sale_price_cents := offering.winning_bid_amount_cents"
          - "grantee_kind := BIDDER with grantee_bidder_id := the WINNING bid's bidder_id for COMPETITIVE_SALE, or := offering.counterparty_bidder_id when that leg is populated; grantee_kind := AGENCY with grantee_agency_id := offering.counterparty_agency_id otherwise"
          - "compliance_status stays NOT_MONITORED - dimension B does not start until the deed is recorded"
      - from: PENDING_TITLE
        to: READY_TO_RECORD
        trigger: "POST /conveyances/{id}/clear-title"
        actor: RealPropertyOfficer
        dimension: recording_status
        preconditions:
          - "recording_status == PENDING_TITLE (else ERR_INVALID_CONVEYANCE_STATE)"
          - "every TitleCurativeItem on the parcel has status != OPEN (else ERR_TITLE_ITEMS_UNRESOLVED)"
          - "an EnvironmentalReview on the declaration has status == CERTIFIED (else ERR_ENV_REVIEW_NOT_CERTIFIED)"
        side_effects:
          - "recoverable_curative_cost_cents and net_proceeds_cents are computed by calculations.net_proceeds_determination and frozen on the conveyance"
      - from: READY_TO_RECORD
        to: RECORDED
        trigger: "POST /conveyances/{id}/record"
        actor: RealPropertyOfficer
        dimension: recording_status
        preconditions:
          - "recording_status == READY_TO_RECORD (else ERR_INVALID_CONVEYANCE_STATE)"
          - "at least one Fund exists (else ERR_FUNDS_NOT_CONFIGURED)"
          - "the sum of allocation_pct over all Funds equals exactly 1.0 (else ERR_ALLOCATION_PCT_SUM_INVALID)"
        side_effects:
          - "recorded_instrument_number and recorded_at recorded; compliance_status transitions NOT_MONITORED -> COMPLIANT (dimension B starts)"
          - "cascade link 1: Parcel.ownership_status transitions AGENCY_OWNED -> CONVEYED and Parcel.disposition_ready recomputes to false"
          - "cascade link 2: caused by link 1, SurplusDeclaration transitions OFFERING_AUTHORIZED -> CONVEYED and DispositionOffering transitions AWARDED -> CLOSED_CONVEYED"
          - "cascade link 3: caused by link 2, calculations.proceeds_waterfall_allocation runs and creates one ProceedsAllocation row per participating Fund"
          - "cascade link 4: caused by link 3, each credited Fund gets balance_cents += amount_cents and lifetime_credits_cents += amount_cents; allocated_proceeds_cents recomputed on the conveyance"
          - "the WINNING bid (COMPETITIVE_SALE only) transitions deposit_status HELD -> APPLIED and its Bidder gets escrow_held_cents -= deposit_amount_cents"
      - from: PENDING_TITLE
        to: RESCINDED
        trigger: "system cascade of POST /offerings/{id}/rescind-award"
        actor: system
        dimension: recording_status
        preconditions:
          - "recording_status IN {PENDING_TITLE, READY_TO_RECORD}"
        side_effects:
          - "net_proceeds_cents and recoverable_curative_cost_cents are reset to 0; no fund is touched because nothing was ever posted"
      - from: COMPLIANT
        to: VIOLATION_NOTICED
        trigger: "POST /conveyances/{id}/violation-notice"
        actor: ComplianceMonitor
        dimension: compliance_status
        preconditions:
          - "compliance_status IN {COMPLIANT, CURED} (else ERR_INVALID_CONVEYANCE_STATE)"
          - "recording_status == RECORDED (else ERR_INVALID_CONVEYANCE_STATE)"
        side_effects:
          - "violation_noticed_at := clock; violation_description := request value"
          - "cure_deadline_at := violation_noticed_at + reverter_cure_period_days days"
      - from: VIOLATION_NOTICED
        to: CURED
        trigger: "POST /conveyances/{id}/accept-cure"
        actor: ComplianceMonitor
        dimension: compliance_status
        preconditions:
          - "compliance_status == VIOLATION_NOTICED (else ERR_INVALID_CONVEYANCE_STATE)"
          - "current logical clock <= cure_deadline_at (else ERR_CURE_PERIOD_EXPIRED)"
        side_effects:
          - "cure_note := request value; cure_deadline_at := null; violation_noticed_at := null"
        note: "cycle edge - a CURED conveyance can be noticed again, so COMPLIANT -> VIOLATION_NOTICED -> CURED -> VIOLATION_NOTICED may repeat"
      - from: VIOLATION_NOTICED
        to: REVERTED
        trigger: "POST /conveyances/{id}/revert"
        actor: ComplianceMonitor
        dimension: compliance_status
        preconditions:
          - "compliance_status == VIOLATION_NOTICED (else ERR_INVALID_CONVEYANCE_STATE)"
          - "recording_status == RECORDED (else ERR_INVALID_CONVEYANCE_STATE)"
          - "current logical clock > cure_deadline_at, strictly after (else ERR_CURE_PERIOD_NOT_EXPIRED)"
        side_effects:
          - "reverted_at := clock; recording_status transitions RECORDED -> RESCINDED"
          - "cascade link 1: Parcel.ownership_status transitions CONVEYED -> REVERTED_TO_AGENCY"
          - "cascade link 2: caused by link 1, Parcel.valuation_status is set to STALE and disposition_ready recomputes to false"
          - "cascade link 3: caused by the reversion of consideration, every ProceedsAllocation row for this conveyance with status == POSTED transitions POSTED -> REVERSED with reversed_at := clock"
          - "cascade link 4: caused by link 3, each affected Fund gets balance_cents -= amount_cents and lifetime_debits_cents += amount_cents; allocated_proceeds_cents recomputes to 0"

concurrency_rules:
  - rule_id: appraisal-order-stale-parcel
    parent_entity: Parcel
    write_endpoint: "POST /appraisals"
    occ_field: "expected_parcel_version"
    description: |
      Ordering an Appraisal against a Parcel whose version has advanced since the
      client last read it is rejected. Under the product semantics a newly
      ACCEPTED appraisal legitimately supersedes the prior ACCEPTED appraisal for
      the parcel, so a second engagement order is not blocked by any state
      precondition - it would succeed and quietly retire another writer's
      valuation. The OCC token on Parcel.version turns that into a deterministic
      stale-version rejection.
    error_id: ERR_STALE_PARCEL_VERSION
    http_status: 412
  - rule_id: offering-create-stale-declaration
    parent_entity: SurplusDeclaration
    write_endpoint: "POST /offerings"
    occ_field: "expected_declaration_version"
    description: |
      Creating a DispositionOffering against a SurplusDeclaration whose version
      has advanced since the client last read it is rejected. A declaration in
      OFFERING_AUTHORIZED legitimately admits more than one offering over its
      life (re-offerings, adjacent windows), so a second create observes the same
      OFFERING_AUTHORIZED state and would succeed on its own terms; the OCC token
      on SurplusDeclaration.version makes the stale view detectable.
    error_id: ERR_STALE_DECLARATION_VERSION
    http_status: 412

calculations:
  - name: minimum_price_determination
    trigger: |
      Runs on POST /offerings (freezing DispositionOffering.minimum_price_cents and
      minimum_price_variant) and again on POST /preference-offers/{id}/rounds where
      the AFFORDABLE_HOUSING_PREFERENCE variant is stored on
      PreferenceOffer.ah_minimum_price_cents.
    algorithm: threshold
    formula: |
      base_value_cents =
        appraised value of the governing Appraisal for the parcel, where the
        governing appraisal is the one with status == ACCEPTED; if that appraisal
        has revaluation_required == true its appraised_value_cents has already been
        replaced by the SUSTAINED AppraisalChallenge's revised_value_cents, so the
        formula always reads Appraisal.appraised_value_cents

      cure_deduction_cents =
        sum of actual_cure_cost_cents over TitleCurativeItem rows on the parcel
        with status == CURED
        (OPEN, WAIVED_WITH_ENDORSEMENT and RESERVED_AS_EASEMENT rows contribute 0)

      write_down_pct  = AH_WRITE_DOWN_PCT for the AFFORDABLE_HOUSING_PREFERENCE
                        variant, else 0
      reoffer_discount_pct =
        min(declaration.reoffer_count * REOFFER_DISCOUNT_PCT_PER_CYCLE,
            REOFFER_DISCOUNT_CAP_PCT)

      gross_cents = round_half_up(
        base_value_cents * (1 - write_down_pct) * (1 - reoffer_discount_pct))

      raw_minimum_cents = gross_cents - cure_deduction_cents

      minimum_price_cents =
        MARKET_FLOOR variant                 -> max(raw_minimum_cents, parcel.book_value_cents)
        AFFORDABLE_HOUSING_PREFERENCE variant -> max(raw_minimum_cents, 0)
    input_set: |
      Exactly one Appraisal per parcel with status == ACCEPTED (ORDERED, REPORTED,
      CHALLENGED, SUPERSEDED and EXPIRED appraisals are excluded, which is why
      POST /offerings raises ERR_NO_ACCEPTED_APPRAISAL when none exists); all
      TitleCurativeItem rows on the parcel, filtered to status == CURED; the
      declaration's own reoffer_count.
    constants:
      AH_WRITE_DOWN_PCT: 0.35
      REOFFER_DISCOUNT_PCT_PER_CYCLE: 0.10
      REOFFER_DISCOUNT_CAP_PCT: 0.20
    precision: "whole cents, round_half_up applied once to gross_cents before the cure deduction"
    variants:
      - name: MARKET_FLOOR
        when: |
          offering_type == COMPETITIVE_SALE, or offering_type IN {NEGOTIATED_SALE,
          EXCHANGE} where no PreferenceOffer on the declaration has
          negotiation_status == AGREED with preference_category == AFFORDABLE_HOUSING
        difference: |
          No statutory write-down (write_down_pct = 0) and the result is floored at
          the parcel's book_value_cents, so the agency can never offer public land
          below carrying value on the open market.
      - name: AFFORDABLE_HOUSING_PREFERENCE
        when: |
          offering_type IN {NEGOTIATED_SALE, EXCHANGE} where the AGREED
          PreferenceOffer on the declaration has
          preference_category == AFFORDABLE_HOUSING; also the variant stored on
          PreferenceOffer.ah_minimum_price_cents for every AFFORDABLE_HOUSING offer
          while it is in negotiation
        difference: |
          Applies the 35% statutory affordable-housing write-down and deliberately
          drops the book_value_cents floor, so identical parcel, appraisal and
          curative data yield a strictly lower minimum price than MARKET_FLOOR and
          may legally fall below book value.

  - name: net_proceeds_determination
    trigger: "POST /conveyances/{id}/clear-title, which freezes recoverable_curative_cost_cents and net_proceeds_cents on the Conveyance"
    algorithm: threshold
    formula: |
      provisional_net_cents = sale_price_cents - closing_costs_cents - broker_fee_cents
      recovery_cap_cents    = round_half_up(provisional_net_cents * CURATIVE_RECOVERY_CAP_PCT)
      incurred_curative_cents =
        sum of actual_cure_cost_cents over TitleCurativeItem rows on the
        conveyance's parcel with status == CURED
      recoverable_curative_cost_cents = min(incurred_curative_cents, recovery_cap_cents)
      net_proceeds_cents = provisional_net_cents - recoverable_curative_cost_cents

      provisional_net_cents <= 0 is rejected upstream by ERR_NET_PROCEEDS_NON_POSITIVE
    input_set: "the conveyance's own frozen sale_price_cents plus the operator-supplied closing and broker figures; TitleCurativeItem rows on the parcel filtered to status == CURED"
    constants:
      CURATIVE_RECOVERY_CAP_PCT: 0.15
    precision: "whole cents, round_half_up on the cap only"

  - name: proceeds_waterfall_allocation
    trigger: "cascade link 3 of POST /conveyances/{id}/record"
    algorithm: waterfall_allocation
    formula: |
      remaining_cents = conveyance.net_proceeds_cents
      funds = all Fund rows ordered by priority_rank ascending
              (priority_rank is unique, so the order is total and never needs a
              fallback; no random id ever participates)

      # pass 1 - fixed reserves, in priority_rank order, first bucket fills first
      for fund in funds:
        take = min(fund.fixed_reserve_cents, remaining_cents)
        if take > 0:
          emit ProceedsAllocation(fund_id=fund.id, amount_cents=take,
                                  allocation_basis=FIXED_RESERVE,
                                  residual_included_cents=0)
          remaining_cents -= take

      # pass 2 - percentage split of whatever survived pass 1
      pct_funds = [f for f in funds if f.allocation_pct > 0]   # still priority_rank order
      base_cents = remaining_cents
      for fund in pct_funds:
        share = round_half_up(base_cents * fund.allocation_pct)
        emit ProceedsAllocation(fund_id=fund.id, amount_cents=share,
                                allocation_basis=PERCENTAGE,
                                residual_included_cents=0)
        remaining_cents -= share

      # pass 3 - rounding residual, positive or negative, lands on the LAST
      # percentage fund in priority_rank order (never on a fixed-reserve row)
      if remaining_cents != 0 and pct_funds is not empty:
        last = pct_funds[-1]
        that row's amount_cents += remaining_cents
        that row's residual_included_cents = remaining_cents
        remaining_cents = 0

      invariant: sum of emitted amount_cents == conveyance.net_proceeds_cents
    input_set: "every Fund row (Fund is configuration and is never soft-deleted); the sum of allocation_pct across all funds must equal exactly 1.0, enforced by ERR_ALLOCATION_PCT_SUM_INVALID before any row is emitted"
    constants:
      REQUIRED_ALLOCATION_PCT_SUM: 1.0
    precision: "whole cents, round_half_up per percentage share; the signed residual is absorbed by the last percentage fund so the emitted rows always reconcile to net_proceeds_cents exactly"

  - name: challenge_forfeiture_allocation
    trigger: "cascade of POST /appraisal-challenges/{id}/determine with determination DENIED"
    algorithm: aggregation
    formula: |
      forfeited_cents = challenge.deposit_paid_cents
      target_fund     = the Fund with the lowest priority_rank
      emit ProceedsAllocation(conveyance_id=null, fund_id=target_fund.id,
                              amount_cents=forfeited_cents,
                              allocation_basis=CHALLENGE_FORFEITURE)
      target_fund.balance_cents        += forfeited_cents
      target_fund.lifetime_credits_cents += forfeited_cents
      challenge.deposit_forfeited_cents = forfeited_cents
      challenge.deposit_refunded_cents  = 0
    input_set: "the single DENIED AppraisalChallenge and the rank-1 Fund; when no Fund exists the determination is rejected with ERR_FUNDS_NOT_CONFIGURED"
    constants: {}
    precision: "whole cents, no rounding - the paid deposit moves in full"

  - name: good_faith_compliance_score
    trigger: |
      The INTERIM variant recomputes PreferenceOffer.interim_good_faith_score on every
      POST /preference-offers/{id}/rounds; the FINAL variant runs once on
      POST /preference-offers/{id}/good-faith-determination and writes
      final_good_faith_score, which decides SATISFIED vs DEFICIENT.
    algorithm: weighted_scoring
    formula: |
      officer_rounds = count of NegotiationRound rows on the offer with
                       party == CUSTODIAN_AGENCY
      timely_rounds  = count of NegotiationRound rows on the offer with
                       party == CUSTODIAN_AGENCY and is_timely == true

      engagement_points = ENGAGEMENT_WEIGHT
                          * min(officer_rounds, REQUIRED_ROUNDS) / REQUIRED_ROUNDS
      timeliness_points = TIMELINESS_WEIGHT
                          * min(timely_rounds, REQUIRED_ROUNDS) / REQUIRED_ROUNDS

      latest_officer_price_cents =
        price_offered_cents of the CUSTODIAN_AGENCY round with the highest
        round_number (rounds are numbered densely from 1, so this is unambiguous)
      near_band_cents = round_half_up(offer.ah_minimum_price_cents * NEAR_BAND_MULT)
      wide_band_cents = round_half_up(offer.ah_minimum_price_cents * WIDE_BAND_MULT)
      concession_points =
        CONCESSION_WEIGHT       if latest_officer_price_cents <= near_band_cents
        CONCESSION_PARTIAL      if near_band_cents < latest_officer_price_cents <= wide_band_cents
        0                       otherwise
      # both band comparisons are inclusive of the band value itself

      premature_penalty =
        PREMATURE_IMPASSE_PENALTY when negotiation_status == IMPASSE and the
        logical clock at conclusion was strictly before negotiation_deadline_at,
        else 0

      score = round_half_up(engagement_points + timeliness_points
                            + concession_points - premature_penalty)
      score is then clamped into 0..100
    input_set: "all NegotiationRound rows on the offer (rounds are immutable events, so the score is a pure projection of the round log); the offer's own ah_minimum_price_cents and negotiation_deadline_at"
    constants:
      ENGAGEMENT_WEIGHT: 45
      TIMELINESS_WEIGHT: 30
      CONCESSION_WEIGHT: 25
      CONCESSION_PARTIAL: 12
      REQUIRED_ROUNDS: 3
      NEAR_BAND_MULT: 1.05
      WIDE_BAND_MULT: 1.20
      PREMATURE_IMPASSE_PENALTY: 15
      GOOD_FAITH_PASS_SCORE: 70
      INTERIM_SCORE_CAP: 75
    precision: "integer 0..100, round_half_up applied once to the component sum"
    variants:
      - name: INTERIM
        when: "recomputed on every appended NegotiationRound and exposed as PreferenceOffer.interim_good_faith_score"
        difference: |
          Omits concession_points entirely (treats it as 0) and omits
          premature_penalty, then caps the result at INTERIM_SCORE_CAP = 75,
          because price convergence cannot be judged while the parties are still
          exchanging offers. For identical round data the INTERIM score is
          therefore always <= the FINAL score, and can sit below
          GOOD_FAITH_PASS_SCORE while the FINAL score clears it.
      - name: FINAL
        when: "computed once at POST /preference-offers/{id}/good-faith-determination and stored as final_good_faith_score"
        difference: |
          Adds concession_points from the price bands, subtracts
          premature_impasse_penalty, applies no 75 cap, and is the only variant
          compared against GOOD_FAITH_PASS_SCORE to drive
          good_faith_status SATISFIED vs DEFICIENT.

  - name: required_bid_deposit
    trigger: "POST /offerings freezes DispositionOffering.required_deposit_cents; POST /offerings/{id}/bids validates the submitted deposit_amount_cents against it"
    algorithm: threshold
    formula: |
      required_deposit_cents = max(round_half_up(minimum_price_cents * DEPOSIT_PCT),
                                   DEPOSIT_MIN_CENTS)
      a bid is deposit-sufficient when deposit_amount_cents >= required_deposit_cents
      (exactly equal is sufficient; one cent short is ERR_DEPOSIT_INSUFFICIENT)
    input_set: "the offering's own frozen minimum_price_cents"
    constants:
      DEPOSIT_PCT: 0.05
      DEPOSIT_MIN_CENTS: 500000
    precision: "whole cents, round_half_up before the floor is applied"

  - name: challenge_deposit_requirement
    trigger: "POST /appraisals/{id}/challenges computes AppraisalChallenge.required_deposit_cents and compares it against the submitted deposit_paid_cents"
    algorithm: threshold
    formula: |
      raw_cents = round_half_up(appraisal.appraised_value_cents * CHALLENGE_DEPOSIT_PCT)
      required_deposit_cents = min(max(raw_cents, CHALLENGE_DEPOSIT_MIN_CENTS),
                                   CHALLENGE_DEPOSIT_MAX_CENTS)

      the challenge is admissible only when
        deposit_paid_cents >= required_deposit_cents        (else ERR_CHALLENGE_DEPOSIT_INSUFFICIENT)
        and abs(asserted_value_cents - appraisal.appraised_value_cents)
            >= round_half_up(appraisal.appraised_value_cents * CHALLENGE_MIN_DELTA_PCT)
                                                            (else ERR_CHALLENGE_DELTA_TOO_SMALL)
    input_set: "the challenged Appraisal's appraised_value_cents at the moment of submission"
    constants:
      CHALLENGE_DEPOSIT_PCT: 0.01
      CHALLENGE_DEPOSIT_MIN_CENTS: 100000
      CHALLENGE_DEPOSIT_MAX_CENTS: 2500000
      CHALLENGE_MIN_DELTA_PCT: 0.05
    precision: "whole cents, round_half_up before clamping"

  - name: award_selection
    trigger: "POST /offerings/{id}/award on a COMPETITIVE_SALE offering"
    algorithm: chronological
    formula: |
      # element 1 - eligibility filter (a bid failing any clause is not a candidate)
      candidates = Bid rows on the offering where
          qualification_status == QUALIFIED
          and amount_cents >= offering.minimum_price_cents
          and deposit_amount_cents >= offering.required_deposit_cents
          and the bidder's debarment_status == CLEAR
      if candidates is empty -> ERR_NO_QUALIFYING_BID

      # element 2 - primary ranking: highest consideration to the public wins
      sort candidates by amount_cents DESCENDING

      # element 3 - first tie-break: the earlier submission wins
      then by submitted_at ASCENDING

      # element 4 - final deterministic fallback: creation order.
      then by created_at ASCENDING
      # id is never consulted at any level

      award_rank = 1..N in that order
      rank 1        -> qualification_status WINNING, offering.winning_bid_amount_cents = its amount_cents
      ranks 2..N    -> qualification_status BACKUP
    input_set: "Bid rows on this offering only; SUBMITTED, DISQUALIFIED and WITHDRAWN bids are excluded, and a bid whose bidder was debarred after submission is excluded even if it grades QUALIFIED"
    constants: {}
    precision: "exact integer comparison on amount_cents; no rounding"

  - name: statutory_window_deadlines
    trigger: "computed whenever the source timestamp is written; every window is closed at its upper bound except the reverter cure period"
    algorithm: interval_merge
    formula: |
      StatutoryNotice.response_deadline_at =
        issued_at + response_window_days days
        -> a response is timely when clock <= response_deadline_at (INCLUSIVE)

      SurplusDeclaration.notice_response_deadline_at =
        notice_issued_at + notice_response_window_days days
        -> POST /declarations/{id}/close-preference-window requires
           clock >= notice_response_deadline_at (INCLUSIVE at the boundary)

      PreferenceOffer.negotiation_deadline_at =
        negotiation_opened_at + GOOD_FAITH_NEGOTIATION_DAYS days
        -> appending a round requires clock <= negotiation_deadline_at (INCLUSIVE)

      NegotiationRound.responded_within_days =
        whole days between the referenced round's created_at and this round's
        created_at, floor division on 86400-second units
      NegotiationRound.is_timely =
        responded_to_round_number is not null
        and responded_within_days <= TIMELY_RESPONSE_DAYS (INCLUSIVE)

      Appraisal.expires_on = effective_date + APPRAISAL_VALIDITY_DAYS days
        -> an ACCEPTED appraisal is usable while clock < expires_on (EXCLUSIVE
           upper bound: on expires_on itself it is already EXPIRED)

      SurplusDeclaration.reoffer_eligible_at =
        the FAILED_NO_QUALIFYING_BID close timestamp + REOFFER_COOLING_OFF_DAYS days
        -> POST /declarations/{id}/re-offer requires clock >= reoffer_eligible_at (INCLUSIVE)

      Conveyance.cure_deadline_at =
        violation_noticed_at + reverter_cure_period_days days
        -> accept-cure requires clock <= cure_deadline_at (INCLUSIVE);
           revert requires clock > cure_deadline_at (STRICT) - the single
           exclusive boundary in the domain, so the deadline instant itself
           belongs to the grantee
    input_set: "the logical clock (default 2026-08-01T00:00:00Z until POST /_clock/set_current_utc moves it) and the stored source timestamps"
    constants:
      NOTICE_RESPONSE_WINDOW_MIN_DAYS: 60
      NOTICE_RESPONSE_WINDOW_MAX_DAYS: 90
      GOOD_FAITH_NEGOTIATION_DAYS: 90
      TIMELY_RESPONSE_DAYS: 15
      APPRAISAL_VALIDITY_DAYS: 365
      REOFFER_COOLING_OFF_DAYS: 30
    precision: "whole-day arithmetic on UTC instants; no timezone conversion, no calendar-month arithmetic"

  - name: appraiser_engagement_load
    trigger: "POST /appraisals, before the Appraisal row is created"
    algorithm: interval_merge
    formula: |
      requested = [engagement_start_on, engagement_end_on]   # CLOSED at both ends

      overlapping = Appraisal rows for the same appraiser_id where
          status IN {ORDERED, REPORTED, CHALLENGED}
          and NOT (existing.engagement_end_on < requested.start
                   or existing.engagement_start_on > requested.end)
      # closed-interval semantics: sharing a single endpoint day IS an overlap.
      # requested.start == existing.end -> overlap; requested.start ==
      # existing.end + 1 day -> no overlap.

      active_engagement_count = len(overlapping)
      if active_engagement_count >= APPRAISER_MAX_CONCURRENT_ENGAGEMENTS
        -> ERR_APPRAISER_CAPACITY_EXCEEDED

      ACCEPTED, SUPERSEDED and EXPIRED appraisals release the appraiser and are
      never counted.
    input_set: "Appraisal rows for this appraiser filtered to the three in-flight statuses; every other appraiser's calendar is irrelevant"
    constants:
      APPRAISER_MAX_CONCURRENT_ENGAGEMENTS: 2
    precision: "whole-day closed-interval comparison; endpoints inclusive on both sides"

  - name: environmental_recirculation_window
    trigger: "POST /declarations/{id}/environmental-reviews and POST /environmental-reviews/{id}/recirculate"
    algorithm: interval_merge
    formula: |
      circulation interval = [circulation_start_on, circulation_end_on]  # CLOSED
      duration_days = circulation_end_on - circulation_start_on
      for determination_class != EXEMPT:
        duration_days >= ENV_CIRCULATION_MIN_DAYS      (else ERR_CIRCULATION_TOO_SHORT)
      for determination_class == EXEMPT:
        the interval is ignored and the review is created already CERTIFIED

      recirculation (round N+1) requires
        new.circulation_start_on >= prior.circulation_end_on + RECIRCULATION_BUFFER_DAYS days
                                                       (else ERR_RECIRCULATION_BUFFER_VIOLATION)
      and two reviews on the same declaration may never have overlapping closed
      intervals                                        (else ERR_CIRCULATION_WINDOW_OVERLAP)
    input_set: "EnvironmentalReview rows on the same declaration, all rounds, any status"
    constants:
      ENV_CIRCULATION_MIN_DAYS: 30
      RECIRCULATION_BUFFER_DAYS: 30
    precision: "whole-day arithmetic; the buffer boundary day itself is allowed (>=)"

  - name: offering_window_placement
    trigger: "POST /offerings"
    algorithm: interval_merge
    formula: |
      bidding window = [bid_open_at, bid_close_at)   # HALF-OPEN: close instant excluded
      bid_close_at > bid_open_at                     (else ERR_INVALID_REQUEST)

      two offerings on the same parcel conflict when their half-open windows
      intersect:
          new.bid_open_at < other.bid_close_at
          and other.bid_open_at < new.bid_close_at
      -> ERR_OFFERING_WINDOW_CONFLICT
      Adjacency is legal: new.bid_open_at == other.bid_close_at does NOT conflict.
      Only offerings with status IN {DRAFT, OPEN, EVALUATION, AWARDED} are
      considered; FAILED_NO_QUALIFYING_BID, CANCELLED and CLOSED_CONVEYED
      offerings free their window.

      bid acceptance: POST /offerings/{id}/bids requires
          bid_open_at <= clock < bid_close_at
      (open instant inclusive, close instant already closed -> ERR_BIDDING_CLOSED)
    input_set: "all DispositionOffering rows whose declaration points at the same parcel_id, in the four live statuses"
    constants: {}
    precision: "instant comparison, half-open interval; contrast with the closed intervals used by appraiser engagements and environmental circulation"

  - name: parcel_disposition_readiness
    trigger: "recomputed on every write that touches a Parcel, its Appraisals, or its TitleCurativeItems"
    algorithm: constraint_propagation
    formula: |
      open_title_item_count =
        count of TitleCurativeItem rows on the parcel with status == OPEN

      valuation_status =
        CURRENT  when an Appraisal on the parcel has status == ACCEPTED and
                 clock < that appraisal.expires_on
        STALE    when an Appraisal on the parcel reached ACCEPTED at some point but
                 no ACCEPTED appraisal is currently usable (superseded, expired, or
                 invalidated by a reverted conveyance)
        UNVALUED when no Appraisal on the parcel has ever reached ACCEPTED

      disposition_ready =
        ownership_status == AGENCY_OWNED
        and valuation_status == CURRENT
        and open_title_item_count == 0

      propagation chain: resolving the last OPEN title item drops
      open_title_item_count to 0, which flips disposition_ready to true without
      any direct write to the Parcel; accepting a newer appraisal supersedes the
      older one and keeps valuation_status == CURRENT; recording a conveyance
      sets ownership_status = CONVEYED which forces disposition_ready = false;
      reverting that conveyance sets ownership_status = REVERTED_TO_AGENCY and
      valuation_status = STALE, so disposition_ready stays false until a fresh
      appraisal is accepted.
    input_set: "the parcel's own ownership_status plus all Appraisal and TitleCurativeItem rows on the parcel"
    constants: {}
    precision: "boolean and integer derivation; reaches a fixed point in one pass because no derived field feeds another parcel"

  - name: bidder_escrow_ledger
    trigger: "POST /bidders/{id}/funding, POST /offerings/{id}/bids, POST /bids/{id}/withdraw, and every deposit release or application cascade"
    algorithm: aggregation
    formula: |
      credit (POST /bidders/{id}/funding, amount_cents > 0):
        available_funds_cents   += amount_cents
        lifetime_deposits_cents += amount_cents

      bid submission:
        require available_funds_cents >= deposit_amount_cents
                                        (else ERR_INSUFFICIENT_BIDDER_FUNDS)
        available_funds_cents -= deposit_amount_cents
        escrow_held_cents     += deposit_amount_cents
        # lifetime_deposits_cents is untouched here - it counts funding credits

      deposit RELEASED (withdrawal, disqualification, award rescission,
      declaration withdrawal):
        escrow_held_cents     -= bid.deposit_amount_cents
        available_funds_cents += bid.deposit_amount_cents

      deposit APPLIED (winning bid at POST /conveyances/{id}/record):
        escrow_held_cents -= bid.deposit_amount_cents
        available_funds_cents unchanged - the money leaves the bidder for good

      invariant (compensating): for any bidder,
        available_funds_cents + escrow_held_cents
          == lifetime_deposits_cents
             - sum of deposit_amount_cents over bids whose deposit_status == APPLIED
      and escrow_held_cents == sum of deposit_amount_cents over that bidder's bids
      with deposit_status == HELD, at all times, so a release/re-submit round trip
      returns the ledger to its exact pre-bid pair of values.
    input_set: "the bidder's own funding credits and every Bid row belonging to that bidder, partitioned by deposit_status"
    constants: {}
    precision: "whole cents, no rounding anywhere; every movement is an exact transfer between the two counters"

validations:
  # ---- authentication ----------------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role header is present and names a role declared in the RBAC matrix"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-ID header is present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  # ---- authorization -----------------------------------------------------
  - priority: 3
    category: auth
    check: "the acting role appears in the endpoint's declared roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 4
    category: auth
    check: "for an entity_backed role, X-User-ID resolves to an existing row of the backing entity (AgencyRepresentative -> Agency, Appraiser -> Appraiser, Bidder -> Bidder)"
    error_id: ERR_IDENTITY_NOT_RESOLVABLE
    http_status: 403
    applies_to: "every endpoint acted on by AgencyRepresentative, Appraiser or Bidder"
  - priority: 5
    category: auth
    check: "the acting principal owns the addressed resource: X-User-ID == notice.recipient_agency_id on respond, == offer.offeror_agency_id for a PREFERENCE_ENTITY round, == bid.bidder_id on withdraw"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /notices/{id}/respond, POST /preference-offers/{id}/rounds, POST /bids/{id}/withdraw"
  - priority: 6
    category: auth
    check: "the acting Appraiser is the engaged appraiser: X-User-ID == appraisal.appraiser_id"
    error_id: ERR_NOT_ENGAGED_APPRAISER
    http_status: 403
    applies_to: "POST /appraisals/{id}/report"
  - priority: 7
    category: auth
    check: "segregation of duties - the BoardClerk determining an AppraisalChallenge must not be the user recorded in the parent declaration's adopted_by_user_id, and the BoardClerk awarding an offering must not be the user recorded in awarded_by_user_id of the rescinded award on the same offering"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /appraisal-challenges/{id}/determine, POST /offerings/{id}/award"
  # ---- request shape -----------------------------------------------------
  - priority: 8
    category: business_constraint
    check: "every required input field is present, every enum value is a declared member, every *_cents integer is >= 0, every date field parses as an ISO-8601 UTC instant, recipient_agency_ids holds 1..20 distinct ids, deed_restrictions holds 1..10 entries, reverter_cure_period_days is within 30..730, claimed_preference_category is supplied on an EXPRESS_INTEREST response and equals the recipient agency's preference_category, a COMPETITIVE_SALE offering supplies neither counterparty field, and client-supplied computed or system fields are ignored rather than honoured"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  # ---- existence and identity integrity ----------------------------------
  - priority: 9
    category: existence
    check: "path resources are resolved left to right: Parcel, SurplusDeclaration, StatutoryNotice, PreferenceOffer, Appraiser, Appraisal, AppraisalChallenge, EnvironmentalReview, TitleCurativeItem, DispositionOffering, Bidder, Bid, Conveyance, Fund"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"
  - priority: 10
    category: existence
    check: "body foreign keys resolve: parcel_id, custodian_agency_id, declaration_id, appraiser_id, counterparty_bidder_id, counterparty_agency_id and every entry of recipient_agency_ids"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /parcels, POST /declarations, POST /declarations/{id}/issue-notices, POST /appraisals, POST /offerings"
  - priority: 11
    category: business_referential
    check: "natural keys are unique across the store: Parcel.apn, Appraiser.license_number, Fund.fund_code and Fund.priority_rank"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /parcels, POST /appraisers, POST /funds"
  - priority: 12
    category: business_referential
    check: "no other SurplusDeclaration on the same parcel has a status outside {CONVEYED, WITHDRAWN}"
    error_id: ERR_DUPLICATE_ACTIVE_DECLARATION
    http_status: 409
    applies_to: "POST /declarations"
  # ---- optimistic concurrency -------------------------------------------
  - priority: 13
    category: business_safety
    check: "expected_parcel_version equals the parcel's current version"
    error_id: ERR_STALE_PARCEL_VERSION
    http_status: 412
    applies_to: "POST /appraisals"
  - priority: 14
    category: business_safety
    check: "expected_declaration_version equals the declaration's current version"
    error_id: ERR_STALE_DECLARATION_VERSION
    http_status: 412
    applies_to: "POST /offerings"
  # ---- state preconditions ----------------------------------------------
  - priority: 15
    category: state
    check: "the SurplusDeclaration is in a status the requested transition declares as its from-state"
    error_id: ERR_INVALID_DECLARATION_STATE
    http_status: 409
    applies_to: "POST /declarations/{id}/adopt, /issue-notices, /close-preference-window, /authorize-disposition, /re-offer, /withdraw, /environmental-reviews, POST /offerings, POST /preference-offers/{id}/rounds, POST /preference-offers/{id}/conclude"
  - priority: 16
    category: state
    check: "the StatutoryNotice is still ISSUED and has not already been responded to"
    error_id: ERR_INVALID_NOTICE_STATE
    http_status: 409
    applies_to: "POST /notices/{id}/respond"
  - priority: 17
    category: state
    check: "the PreferenceOffer's negotiation dimension admits the transition: rounds require OPEN or IN_NEGOTIATION, conclude requires IN_NEGOTIATION"
    error_id: ERR_INVALID_OFFER_STATE
    http_status: 409
    applies_to: "POST /preference-offers/{id}/rounds, POST /preference-offers/{id}/conclude"
  - priority: 18
    category: state
    check: "the PreferenceOffer's good-faith dimension admits the transition: good-faith-review requires UNREVIEWED, good-faith-determination requires UNDER_REVIEW"
    error_id: ERR_INVALID_GOOD_FAITH_STATE
    http_status: 409
    applies_to: "POST /preference-offers/{id}/good-faith-review, POST /preference-offers/{id}/good-faith-determination"
  - priority: 19
    category: state
    check: "the Appraisal is in the required status: report requires ORDERED, accept requires REPORTED, challenges require REPORTED"
    error_id: ERR_INVALID_APPRAISAL_STATE
    http_status: 409
    applies_to: "POST /appraisals/{id}/report, /accept, /challenges"
  - priority: 20
    category: state
    check: "the AppraisalChallenge is still SUBMITTED"
    error_id: ERR_INVALID_CHALLENGE_STATE
    http_status: 409
    applies_to: "POST /appraisal-challenges/{id}/determine"
  - priority: 21
    category: state
    check: "the EnvironmentalReview is CIRCULATING, and certify additionally requires the clock to have reached circulation_end_on"
    error_id: ERR_INVALID_ENV_REVIEW_STATE
    http_status: 409
    applies_to: "POST /environmental-reviews/{id}/certify, /recirculate"
  - priority: 22
    category: state
    check: "the TitleCurativeItem is still OPEN"
    error_id: ERR_INVALID_TITLE_ITEM_STATE
    http_status: 409
    applies_to: "POST /title-items/{id}/resolve"
  - priority: 23
    category: state
    check: "the DispositionOffering is in a status the requested transition declares as its from-state: publish requires DRAFT and a clock before bid_close_at, close-bidding requires OPEN on a COMPETITIVE_SALE, award requires EVALUATION for COMPETITIVE_SALE and OPEN for NEGOTIATED_SALE or EXCHANGE, rescind-award requires AWARDED, conveyance requires AWARDED, bids require OPEN"
    error_id: ERR_INVALID_OFFERING_STATE
    http_status: 409
    applies_to: "POST /offerings/{id}/publish, /close-bidding, /award, /rescind-award, /conveyance, /bids"
  - priority: 24
    category: state
    check: "the Bid is still SUBMITTED with deposit_status HELD"
    error_id: ERR_INVALID_BID_STATE
    http_status: 409
    applies_to: "POST /bids/{id}/withdraw"
  - priority: 25
    category: state
    check: "the Conveyance dimension admits the transition: clear-title requires PENDING_TITLE, record requires READY_TO_RECORD, violation-notice requires RECORDED plus compliance COMPLIANT or CURED, accept-cure and revert require VIOLATION_NOTICED; rescind-award additionally refuses to unwind a RECORDED conveyance"
    error_id: ERR_INVALID_CONVEYANCE_STATE
    http_status: 409
    applies_to: "POST /conveyances/{id}/clear-title, /record, /violation-notice, /accept-cure, /revert, POST /offerings/{id}/rescind-award"
  - priority: 26
    category: state
    check: "bids are accepted only on a COMPETITIVE_SALE offering; a negotiated sale or exchange never receives bids"
    error_id: ERR_COMPETITIVE_BID_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /offerings/{id}/bids"
  - priority: 27
    category: business_temporal
    check: "the offering's bidding window is live: bid_open_at <= clock < bid_close_at; a bid withdrawal likewise requires clock < bid_close_at"
    error_id: ERR_BIDDING_CLOSED
    http_status: 409
    applies_to: "POST /offerings/{id}/bids, POST /bids/{id}/withdraw"
  - priority: 28
    category: business_temporal
    check: "close-bidding is refused while the window is still live: clock >= bid_close_at"
    error_id: ERR_BIDDING_STILL_OPEN
    http_status: 409
    applies_to: "POST /offerings/{id}/close-bidding"
  # ---- business rules: statutory and regulatory compliance ---------------
  - priority: 29
    category: business_temporal
    check: "response_window_days, when supplied, is within 60..90 inclusive at both ends"
    error_id: ERR_NOTICE_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /declarations/{id}/issue-notices"
  - priority: 30
    category: business_safety
    check: "every recipient Agency has notice_registry_status == REGISTERED at the moment the notice round is served"
    error_id: ERR_NOTICE_REGISTRY_LAPSED
    http_status: 422
    applies_to: "POST /declarations/{id}/issue-notices, POST /declarations/{id}/re-offer"
  - priority: 31
    category: business_safety
    check: "responding EXPRESS_INTEREST requires the responding agency to hold a statutory preference right (is_preference_entity == true); a DECLINE response carries no such requirement"
    error_id: ERR_NOT_PREFERENCE_ENTITY
    http_status: 422
    applies_to: "POST /notices/{id}/respond"
  - priority: 32
    category: business_temporal
    check: "the statutory response window has run its course: every notice of the current round has status != ISSUED, or clock >= declaration.notice_response_deadline_at (the deadline instant itself qualifies)"
    error_id: ERR_PREFERENCE_WINDOW_STILL_OPEN
    http_status: 409
    applies_to: "POST /declarations/{id}/close-preference-window"
  - priority: 33
    category: business_temporal
    check: "a notice response arrives on or before the notice's own response_deadline_at (inclusive)"
    error_id: ERR_NOTICE_RESPONSE_LATE
    http_status: 409
    applies_to: "POST /notices/{id}/respond"
  - priority: 34
    category: business_temporal
    check: "the good-faith negotiation window is still open: clock <= offer.negotiation_deadline_at (inclusive)"
    error_id: ERR_NEGOTIATION_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /preference-offers/{id}/rounds"
  - priority: 35
    category: business_safety
    check: "concluding an offer AGREED requires at least REQUIRED_ROUNDS (3) CUSTODIAN_AGENCY rounds on that offer"
    error_id: ERR_GOOD_FAITH_ROUNDS_NOT_MET
    http_status: 422
    applies_to: "POST /preference-offers/{id}/conclude"
  - priority: 36
    category: business_safety
    check: "a good-faith determination requires the negotiation dimension to be concluded (negotiation_status IN {AGREED, IMPASSE, LAPSED}); authorizing COMPETITIVE_SALE requires every PreferenceOffer on the declaration to be IMPASSE or LAPSED"
    error_id: ERR_NEGOTIATION_STILL_ACTIVE
    http_status: 409
    applies_to: "POST /preference-offers/{id}/good-faith-determination, POST /declarations/{id}/authorize-disposition"
  - priority: 37
    category: business_safety
    check: "every PreferenceOffer whose good faith the authorization depends on has already been determined (good_faith_status is not UNREVIEWED and not UNDER_REVIEW)"
    error_id: ERR_GOOD_FAITH_NOT_DETERMINED
    http_status: 422
    applies_to: "POST /declarations/{id}/authorize-disposition"
  - priority: 38
    category: business_safety
    check: "no PreferenceOffer the authorization depends on has good_faith_status == DEFICIENT"
    error_id: ERR_GOOD_FAITH_DEFICIENT
    http_status: 422
    applies_to: "POST /declarations/{id}/authorize-disposition"
  - priority: 39
    category: business_safety
    check: "authorizing NEGOTIATED_SALE requires a PreferenceOffer on the declaration with negotiation_status == AGREED"
    error_id: ERR_PREFERENCE_UNRESOLVED
    http_status: 422
    applies_to: "POST /declarations/{id}/authorize-disposition"
  - priority: 40
    category: business_safety
    check: "authority classes do not cross: a declaration that reached OFFERING_AUTHORIZED from NEGOTIATION_AGREED cannot be authorized COMPETITIVE_SALE, and an offering's offering_type must equal declaration.authorized_disposition_type"
    error_id: ERR_OFFERING_TYPE_AUTHORITY_MISMATCH
    http_status: 422
    applies_to: "POST /declarations/{id}/authorize-disposition, POST /offerings"
  - priority: 41
    category: business_safety
    check: "authorizing EXCHANGE requires non-empty authority_findings"
    error_id: ERR_EXCHANGE_FINDINGS_REQUIRED
    http_status: 422
    applies_to: "POST /declarations/{id}/authorize-disposition"
  - priority: 42
    category: business_safety
    check: "an Appraisal on the parcel has status == ACCEPTED"
    error_id: ERR_NO_ACCEPTED_APPRAISAL
    http_status: 422
    applies_to: "POST /offerings"
  - priority: 43
    category: business_temporal
    check: "the ACCEPTED appraisal is still inside its validity window: clock < appraisal.expires_on (on expires_on itself the appraisal is EXPIRED)"
    error_id: ERR_APPRAISAL_EXPIRED
    http_status: 409
    applies_to: "POST /offerings"
  - priority: 44
    category: business_temporal
    check: "a re-offer waits out the cooling-off period: clock >= declaration.reoffer_eligible_at (inclusive)"
    error_id: ERR_REOFFER_COOLING_OFF
    http_status: 409
    applies_to: "POST /declarations/{id}/re-offer"
  - priority: 45
    category: business_constraint
    check: "declaration.reoffer_count < MAX_REOFFER_CYCLES (2), so a parcel is re-offered at most twice before the disposition must be abandoned"
    error_id: ERR_REOFFER_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /declarations/{id}/re-offer"
  - priority: 46
    category: business_safety
    check: "every TitleCurativeItem on the parcel has status != OPEN"
    error_id: ERR_TITLE_ITEMS_UNRESOLVED
    http_status: 422
    applies_to: "POST /conveyances/{id}/clear-title"
  - priority: 47
    category: business_safety
    check: "an EnvironmentalReview on the declaration has status == CERTIFIED"
    error_id: ERR_ENV_REVIEW_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /conveyances/{id}/clear-title, POST /declarations/{id}/authorize-disposition"
  - priority: 48
    category: business_safety
    check: "len(deed_restrictions) >= the count of TitleCurativeItem rows on the parcel with status == RESERVED_AS_EASEMENT, so every reserved easement is carried into the deed"
    error_id: ERR_EASEMENT_RESERVATION_MISSING
    http_status: 422
    applies_to: "POST /offerings/{id}/conveyance"
  - priority: 49
    category: business_temporal
    check: "accepting a cure requires clock <= cure_deadline_at (inclusive)"
    error_id: ERR_CURE_PERIOD_EXPIRED
    http_status: 409
    applies_to: "POST /conveyances/{id}/accept-cure"
  - priority: 50
    category: business_temporal
    check: "enforcing the reverter requires clock > cure_deadline_at (strictly after; on the deadline instant the grantee still holds the cure right)"
    error_id: ERR_CURE_PERIOD_NOT_EXPIRED
    http_status: 409
    applies_to: "POST /conveyances/{id}/revert"
  - priority: 51
    category: business_safety
    check: "the appraiser's licence covers the whole engagement: license_status == ACTIVE and license_expires_on > engagement_end_on"
    error_id: ERR_APPRAISER_LICENSE_EXPIRED
    http_status: 422
    applies_to: "POST /appraisals"
  - priority: 52
    category: business_safety
    check: "the bidder's debarment_status == CLEAR"
    error_id: ERR_BIDDER_DEBARRED
    http_status: 422
    applies_to: "POST /offerings/{id}/bids"
  - priority: 53
    category: business_temporal
    check: "the appraisal challenge window is open: clock <= appraisal.reported_at + CHALLENGE_WINDOW_DAYS (30) days"
    error_id: ERR_CHALLENGE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /appraisals/{id}/challenges"
  - priority: 54
    category: business_referential
    check: "the challenging Agency received a StatutoryNotice on the declaration that covers this parcel"
    error_id: ERR_CHALLENGER_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /appraisals/{id}/challenges"
  # ---- business rules: constraint satisfaction ---------------------------
  - priority: 55
    category: business_constraint
    check: "the appraiser has fewer than APPRAISER_MAX_CONCURRENT_ENGAGEMENTS (2) in-flight appraisals whose closed engagement interval overlaps the requested one"
    error_id: ERR_APPRAISER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /appraisals"
  - priority: 56
    category: business_temporal
    check: "a non-EXEMPT environmental review circulates for at least ENV_CIRCULATION_MIN_DAYS (30) days"
    error_id: ERR_CIRCULATION_TOO_SHORT
    http_status: 422
    applies_to: "POST /declarations/{id}/environmental-reviews, POST /environmental-reviews/{id}/recirculate"
  - priority: 57
    category: business_temporal
    check: "a recirculation starts no earlier than the prior round's circulation_end_on + RECIRCULATION_BUFFER_DAYS (30) days; the boundary day itself is allowed"
    error_id: ERR_RECIRCULATION_BUFFER_VIOLATION
    http_status: 422
    applies_to: "POST /environmental-reviews/{id}/recirculate"
  - priority: 58
    category: business_temporal
    check: "no two EnvironmentalReview rows on the same declaration hold overlapping closed circulation intervals; sharing a single endpoint day counts as an overlap"
    error_id: ERR_CIRCULATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /declarations/{id}/environmental-reviews, POST /environmental-reviews/{id}/recirculate"
  - priority: 59
    category: business_temporal
    check: "bid_close_at is strictly after bid_open_at"
    error_id: ERR_OFFERING_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /offerings"
  - priority: 60
    category: business_temporal
    check: "the new offering's half-open bidding window [bid_open_at, bid_close_at) does not intersect the window of any live offering on the same parcel; sharing the boundary instant is allowed"
    error_id: ERR_OFFERING_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /offerings"
  - priority: 61
    category: business_constraint
    check: "the parcel is disposition-ready: ownership_status == AGENCY_OWNED, valuation_status == CURRENT and open_title_item_count == 0"
    error_id: ERR_PARCEL_NOT_DISPOSITION_READY
    http_status: 422
    applies_to: "POST /offerings, POST /declarations/{id}/authorize-disposition"
  - priority: 62
    category: business_constraint
    check: "a NEGOTIATED_SALE offering supplies exactly one resolvable counterparty leg, and when the declaration reached OFFERING_AUTHORIZED from NEGOTIATION_AGREED the supplied counterparty_agency_id equals the AGREED PreferenceOffer's offeror_agency_id"
    error_id: ERR_NEGOTIATED_BUYER_REQUIRED
    http_status: 422
    applies_to: "POST /offerings"
  - priority: 63
    category: business_constraint
    check: "an EXCHANGE offering supplies counterparty_agency_id and leaves counterparty_bidder_id null"
    error_id: ERR_EXCHANGE_COUNTERPARTY_REQUIRED
    http_status: 422
    applies_to: "POST /offerings"
  - priority: 64
    category: business_constraint
    check: "no other Conveyance on the offering has recording_status IN {PENDING_TITLE, READY_TO_RECORD, RECORDED}"
    error_id: ERR_CONVEYANCE_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /offerings/{id}/conveyance"
  - priority: 65
    category: business_constraint
    check: "the bidder holds no other live bid on this offering (qualification_status IN {SUBMITTED, QUALIFIED, WINNING, BACKUP})"
    error_id: ERR_DUPLICATE_BID
    http_status: 409
    applies_to: "POST /offerings/{id}/bids"
  - priority: 66
    category: business_referential
    check: "responded_to_round_number, when supplied, names an existing round on the same offer that belongs to the opposite party and carries a strictly lower round_number"
    error_id: ERR_INVALID_ROUND_REFERENCE
    http_status: 422
    applies_to: "POST /preference-offers/{id}/rounds"
  - priority: 67
    category: business_constraint
    check: "abs(asserted_value_cents - appraisal.appraised_value_cents) >= round_half_up(appraised_value_cents * CHALLENGE_MIN_DELTA_PCT); a challenge exactly at the 5% delta is admissible"
    error_id: ERR_CHALLENGE_DELTA_TOO_SMALL
    http_status: 422
    applies_to: "POST /appraisals/{id}/challenges"
  # ---- business rules: fiscal -------------------------------------------
  - priority: 68
    category: business_fiscal
    check: "agreed_price_cents >= offer.ah_minimum_price_cents when concluding AGREED"
    error_id: ERR_AGREED_PRICE_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /preference-offers/{id}/conclude"
  - priority: 69
    category: business_fiscal
    check: "bid amount_cents >= offering.minimum_price_cents (a bid exactly at the minimum is acceptable)"
    error_id: ERR_BID_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /offerings/{id}/bids"
  - priority: 70
    category: business_fiscal
    check: "deposit_amount_cents >= offering.required_deposit_cents (exact equality is sufficient; one cent short fails)"
    error_id: ERR_DEPOSIT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /offerings/{id}/bids"
  - priority: 71
    category: business_fiscal
    check: "the bidder's available_funds_cents >= deposit_amount_cents"
    error_id: ERR_INSUFFICIENT_BIDDER_FUNDS
    http_status: 422
    applies_to: "POST /offerings/{id}/bids"
  - priority: 72
    category: business_fiscal
    check: "deposit_paid_cents >= the challenge's computed required_deposit_cents"
    error_id: ERR_CHALLENGE_DEPOSIT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /appraisals/{id}/challenges"
  - priority: 73
    category: business_fiscal
    check: "at least one Fund row exists before any money moves"
    error_id: ERR_FUNDS_NOT_CONFIGURED
    http_status: 422
    applies_to: "POST /conveyances/{id}/record, POST /appraisal-challenges/{id}/determine"
  - priority: 74
    category: business_fiscal
    check: "the sum of allocation_pct over all Fund rows equals exactly 1.0"
    error_id: ERR_ALLOCATION_PCT_SUM_INVALID
    http_status: 422
    applies_to: "POST /conveyances/{id}/record"
  - priority: 75
    category: business_fiscal
    check: "provisional net proceeds (sale_price_cents - closing_costs_cents - broker_fee_cents) > 0"
    error_id: ERR_NET_PROCEEDS_NON_POSITIVE
    http_status: 422
    applies_to: "POST /conveyances/{id}/clear-title"
  - priority: 76
    category: business_fiscal
    check: "at least one bid survives the award eligibility filter of calculations.award_selection"
    error_id: ERR_NO_QUALIFYING_BID
    http_status: 422
    applies_to: "POST /offerings/{id}/award"

endpoints:
  # ---- test-driving surface ---------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: |
      Sets the server's logical clock to any UTC instant, so deadline, window and
      expiry rules are exercised deterministically. MANDATORY DEFAULT: before any
      call to this endpoint the logical clock reads exactly
      2026-08-01T00:00:00Z and never falls back to real wall-clock time. Every
      timestamp the server writes (created_at, issued_at, awarded_at, recorded_at,
      ...) is read from this clock.
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, FinanceOfficer, AgencyRepresentative, Appraiser, Bidder, SystemAdministrator]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "the logical clock jumps to current_utc; no entity is mutated and no state machine advances as a side effect of the jump itself"
  # ---- agencies ----------------------------------------------------------
  - method: POST
    path: "/agencies"
    description: "Registers a public agency, optionally as a statutory preference entity."
    roles: [SystemAdministrator]
    code: 201
    input: [name, agency_type, contact_email, "is_preference_entity?", "preference_category?"]
    output: Agency
    side_effects:
      - "Agency created with notice_registry_status REGISTERED"
  - method: GET
    path: "/agencies/{id}"
    description: "Reads one agency."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, FinanceOfficer, AgencyRepresentative, SystemAdministrator]
    code: 200
    input: []
    output: Agency
    side_effects: []
  - method: GET
    path: "/agencies"
    description: "Lists agencies, filterable by statutory class and preference status."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, FinanceOfficer, AgencyRepresentative, SystemAdministrator]
    code: 200
    input: ["agency_type?", "is_preference_entity?", "preference_category?", "notice_registry_status?", "limit?", "offset?"]
    output: Agency[]
    side_effects: []
  - method: PATCH
    path: "/agencies/{id}"
    description: "Updates an agency's notice registry standing or contact address."
    roles: [SystemAdministrator]
    code: 200
    input: ["notice_registry_status?", "contact_email?"]
    output: Agency
    side_effects:
      - "increments Agency.version by 1"
      - "a LAPSED agency is skipped by the next statutory notice round"
  # ---- parcels -----------------------------------------------------------
  - method: POST
    path: "/parcels"
    description: "Records a publicly owned parcel in the real property inventory."
    roles: [RealPropertyOfficer]
    code: 201
    input: [apn, address, acreage, zoning_code, book_value_cents, custodian_agency_id]
    output: Parcel
    side_effects:
      - "Parcel created with ownership_status AGENCY_OWNED, valuation_status UNVALUED, open_title_item_count 0 and disposition_ready false"
  - method: GET
    path: "/parcels/{id}"
    description: "Reads one parcel including its computed readiness fields."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, FinanceOfficer, AgencyRepresentative, Appraiser, Bidder, SystemAdministrator]
    code: 200
    input: []
    output: Parcel
    side_effects: []
  - method: GET
    path: "/parcels"
    description: "Lists parcels; the custodian_agency_id filter is the reverse lookup from an Agency to the parcels it holds."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, FinanceOfficer, AgencyRepresentative, Bidder, SystemAdministrator]
    code: 200
    input: ["custodian_agency_id?", "ownership_status?", "valuation_status?", "disposition_ready?", "limit?", "offset?"]
    output: Parcel[]
    side_effects: []
  - method: PATCH
    path: "/parcels/{id}"
    description: "Updates carrying value or descriptive attributes of a parcel; this is the operator action that advances Parcel.version and therefore invalidates a client's OCC token."
    roles: [RealPropertyOfficer]
    code: 200
    input: ["book_value_cents?", "zoning_code?", "address?"]
    output: Parcel
    side_effects:
      - "increments Parcel.version by 1"
      - "recomputes disposition_ready"
  # ---- title curative items ---------------------------------------------
  - method: POST
    path: "/parcels/{id}/title-items"
    description: "Opens a title curative item against a parcel."
    roles: [RealPropertyOfficer]
    code: 201
    input: [item_type, description, cure_cost_estimate_cents]
    output: TitleCurativeItem
    side_effects:
      - "TitleCurativeItem created with status OPEN"
      - "increments Parcel.open_title_item_count by 1 and recomputes Parcel.disposition_ready to false"
  - method: GET
    path: "/parcels/{id}/title-items"
    description: "Lists the title curative items on a parcel (reverse lookup for TitleCurativeItem.parcel_id)."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, AgencyRepresentative, SystemAdministrator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TitleCurativeItem[]
    side_effects: []
  - method: GET
    path: "/title-items/{id}"
    description: "Reads one title curative item."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, AgencyRepresentative, SystemAdministrator]
    code: 200
    input: []
    output: TitleCurativeItem
    side_effects: []
  - method: POST
    path: "/title-items/{id}/resolve"
    description: "Resolves a title item by curing it, waiving it with a title endorsement, or reserving the burden as an easement retained by the agency."
    roles: [RealPropertyOfficer]
    code: 200
    input: [resolution, "actual_cure_cost_cents?", "easement_purpose?", "easement_area_sqft?"]
    output: TitleCurativeItem
    side_effects:
      - "status moves OPEN -> CURED | WAIVED_WITH_ENDORSEMENT | RESERVED_AS_EASEMENT and resolved_at is stamped"
      - "decrements Parcel.open_title_item_count by 1 and recomputes Parcel.disposition_ready"
      - "a CURED item's actual_cure_cost_cents enters both minimum_price_determination and net_proceeds_determination"
      - "a RESERVED_AS_EASEMENT item raises the deed-restriction floor enforced at POST /offerings/{id}/conveyance"
  # ---- surplus declarations ---------------------------------------------
  - method: POST
    path: "/declarations"
    description: "Drafts a declaration of surplus for one parcel."
    roles: [RealPropertyOfficer]
    code: 201
    input: [parcel_id, justification, "intended_use_restriction?"]
    output: SurplusDeclaration
    side_effects:
      - "SurplusDeclaration created in DRAFT with reoffer_count 0"
  - method: GET
    path: "/declarations/{id}"
    description: "Reads one surplus declaration with its computed preference counters."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, FinanceOfficer, AgencyRepresentative, Bidder, SystemAdministrator]
    code: 200
    input: []
    output: SurplusDeclaration
    side_effects: []
  - method: GET
    path: "/declarations"
    description: "Lists declarations; the parcel_id filter is the reverse lookup from a Parcel to its declarations."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, FinanceOfficer, AgencyRepresentative, Bidder, SystemAdministrator]
    code: 200
    input: ["parcel_id?", "status?", "authorized_disposition_type?", "limit?", "offset?"]
    output: SurplusDeclaration[]
    side_effects: []
  - method: POST
    path: "/declarations/{id}/adopt"
    description: "Board adoption of the surplus resolution."
    roles: [BoardClerk]
    code: 200
    input: [resolution_number]
    output: SurplusDeclaration
    side_effects:
      - "status DRAFT -> ADOPTED; resolution_number, adopted_by_user_id (the acting X-User-ID) and adopted_at recorded"
      - "increments SurplusDeclaration.version by 1"
  - method: POST
    path: "/declarations/{id}/issue-notices"
    description: "Serves the statutory notice of availability on every registered preference entity."
    roles: [RealPropertyOfficer]
    code: 200
    input: [recipient_agency_ids, "response_window_days?"]
    output: SurplusDeclaration
    side_effects:
      - "status ADOPTED -> NOTICED; notice_issued_at := clock, notice_response_window_days := response_window_days (default 60 when omitted) and notice_response_deadline_at computed"
      - "creates one StatutoryNotice per entry of recipient_agency_ids with notice_round 1, status ISSUED, issued_at := clock, its own response_window_days and computed response_deadline_at"
      - "increments SurplusDeclaration.version by 1"
  - method: POST
    path: "/declarations/{id}/close-preference-window"
    description: "Closes the statutory response window and expires every notice that drew no response."
    roles: [RealPropertyOfficer]
    code: 200
    input: []
    output: SurplusDeclaration
    side_effects:
      - "status NOTICED -> PREFERENCE_CLOSED"
      - "every StatutoryNotice still ISSUED moves to EXPIRED"
      - "unresolved_preference_count recomputed from the surviving PreferenceOffer rows"
      - "increments SurplusDeclaration.version by 1"
  - method: POST
    path: "/declarations/{id}/authorize-disposition"
    description: "Board finding that fixes the disposition authority: competitive sale, negotiated sale, or exchange."
    roles: [BoardClerk]
    code: 200
    input: [disposition_type, "authority_findings?"]
    output: SurplusDeclaration
    side_effects:
      - "status PREFERENCE_CLOSED or NEGOTIATION_AGREED -> OFFERING_AUTHORIZED; authorized_disposition_type and authority_findings recorded"
      - "increments SurplusDeclaration.version by 1"
  - method: POST
    path: "/declarations/{id}/re-offer"
    description: "Re-noticing after an unsuccessful disposition; the re-offer cycle lowers the statutory minimum price."
    roles: [RealPropertyOfficer]
    code: 200
    input: []
    output: SurplusDeclaration
    side_effects:
      - "status UNSUCCESSFUL -> NOTICED; increments reoffer_count by 1; clears reoffer_eligible_at"
      - "re-serves every distinct recipient_agency_id of the highest existing notice round: one new StatutoryNotice each with notice_round = that round + 1, the prior round's response_window_days, issued_at := clock and recomputed response_deadline_at; notice_issued_at and notice_response_deadline_at recomputed on the declaration"
      - "increments SurplusDeclaration.version by 1"
  - method: POST
    path: "/declarations/{id}/withdraw"
    description: "Withdraws the declaration of surplus; from OFFERING_AUTHORIZED this unwinds the live offering."
    roles: [BoardClerk]
    code: 200
    input: [withdrawn_reason]
    output: SurplusDeclaration
    side_effects:
      - "status DRAFT or OFFERING_AUTHORIZED -> WITHDRAWN"
      - "any DispositionOffering in DRAFT, OPEN or EVALUATION on this declaration moves to CANCELLED, every live Bid on it moves to WITHDRAWN and every HELD deposit moves to RELEASED with the escrow returned to the bidder's available_funds_cents"
      - "increments SurplusDeclaration.version by 1"
  # ---- statutory notices -------------------------------------------------
  - method: GET
    path: "/notices/{id}"
    description: "Reads one statutory notice."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, AgencyRepresentative, SystemAdministrator]
    code: 200
    input: []
    output: StatutoryNotice
    side_effects: []
  - method: GET
    path: "/notices"
    description: "Lists statutory notices; the declaration_id and recipient_agency_id filters are the reverse lookups for both FKs."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, AgencyRepresentative, SystemAdministrator]
    code: 200
    input: ["declaration_id?", "recipient_agency_id?", "status?", "notice_round?", "limit?", "offset?"]
    output: StatutoryNotice[]
    side_effects: []
  - method: POST
    path: "/notices/{id}/respond"
    description: "The noticed agency expresses statutory interest or declines."
    roles: [AgencyRepresentative]
    code: 200
    input: [response_type, "claimed_preference_category?", "intended_use?"]
    output: StatutoryNotice
    side_effects:
      - "status ISSUED -> INTEREST_EXPRESSED or DECLINED; responded_at, response_type, claimed_preference_category and intended_use recorded"
      - "EXPRESS_INTEREST creates a PreferenceOffer in negotiation_status OPEN x good_faith_status UNREVIEWED with negotiation_opened_at set from the clock, computed negotiation_deadline_at and computed ah_minimum_price_cents"
      - "increments SurplusDeclaration.preference_offer_count and unresolved_preference_count on EXPRESS_INTEREST"
  # ---- preference offers and negotiation rounds -------------------------
  - method: GET
    path: "/preference-offers/{id}"
    description: "Reads one preference offer including both status dimensions and the interim good-faith score."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, AgencyRepresentative, SystemAdministrator]
    code: 200
    input: []
    output: PreferenceOffer
    side_effects: []
  - method: GET
    path: "/preference-offers"
    description: "Lists preference offers; the declaration_id, notice_id and offeror_agency_id filters are the reverse lookups for those FKs."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, AgencyRepresentative, SystemAdministrator]
    code: 200
    input: ["declaration_id?", "notice_id?", "offeror_agency_id?", "negotiation_status?", "good_faith_status?", "preference_category?", "limit?", "offset?"]
    output: PreferenceOffer[]
    side_effects: []
  - method: POST
    path: "/preference-offers/{id}/rounds"
    description: "Appends an immutable negotiation round to the good-faith record; either party may write, and the round log is the sole input to the good-faith score."
    roles: [RealPropertyOfficer, AgencyRepresentative]
    code: 201
    input: [party, price_offered_cents, terms_summary, "responded_to_round_number?"]
    output: NegotiationRound
    side_effects:
      - "NegotiationRound created with round_number = current round count + 1, computed responded_within_days and computed is_timely"
      - "negotiation_status OPEN -> IN_NEGOTIATION on the first round; subsequent rounds keep IN_NEGOTIATION"
      - "recomputes officer_round_count, entity_round_count, timely_response_count and the INTERIM variant of good_faith_compliance_score into interim_good_faith_score"
  - method: GET
    path: "/preference-offers/{id}/rounds"
    description: "Lists the negotiation rounds on an offer in round_number order (reverse lookup for NegotiationRound.offer_id)."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, AgencyRepresentative, SystemAdministrator]
    code: 200
    input: ["party?", "limit?", "offset?"]
    output: NegotiationRound[]
    side_effects: []
  - method: POST
    path: "/preference-offers/{id}/good-faith-review"
    description: "Compliance opens the good-faith review on an offer."
    roles: [ComplianceMonitor]
    code: 200
    input: []
    output: PreferenceOffer
    side_effects:
      - "good_faith_status UNREVIEWED -> UNDER_REVIEW; the negotiation dimension is untouched"
  - method: POST
    path: "/preference-offers/{id}/good-faith-determination"
    description: "Compliance determines whether the agency negotiated in good faith, using the FINAL variant of the score."
    roles: [ComplianceMonitor]
    code: 200
    input: ["remediation_note?"]
    output: PreferenceOffer
    side_effects:
      - "computes the FINAL variant of good_faith_compliance_score into final_good_faith_score"
      - "good_faith_status UNDER_REVIEW -> SATISFIED when final_good_faith_score >= 70, else -> DEFICIENT with remediation_note stored"
  - method: POST
    path: "/preference-offers/{id}/conclude"
    description: "Concludes the negotiation as AGREED or IMPASSE; AGREED also advances the parent declaration and lapses the sibling offers."
    roles: [RealPropertyOfficer]
    code: 200
    input: [outcome, "agreed_price_cents?"]
    output: PreferenceOffer
    side_effects:
      - "negotiation_status IN_NEGOTIATION -> AGREED (agreed_price_cents stored) or -> IMPASSE"
      - "on AGREED every sibling PreferenceOffer on the declaration still in OPEN moves to LAPSED and the declaration moves PREFERENCE_CLOSED -> NEGOTIATION_AGREED"
      - "recomputes SurplusDeclaration.unresolved_preference_count and increments SurplusDeclaration.version by 1"
  # ---- appraisers, appraisals and challenges -----------------------------
  - method: POST
    path: "/appraisers"
    description: "Registers a licensed appraiser available for engagement."
    roles: [SystemAdministrator]
    code: 201
    input: [name, license_number, license_expires_on]
    output: Appraiser
    side_effects:
      - "Appraiser created; license_status computed ACTIVE when license_expires_on is after the logical clock, else EXPIRED"
  - method: GET
    path: "/appraisers/{id}"
    description: "Reads one appraiser including the computed active_engagement_count."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, Appraiser, SystemAdministrator]
    code: 200
    input: []
    output: Appraiser
    side_effects: []
  - method: GET
    path: "/appraisers"
    description: "Lists appraisers."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, Appraiser, SystemAdministrator]
    code: 200
    input: ["license_status?", "limit?", "offset?"]
    output: Appraiser[]
    side_effects: []
  - method: POST
    path: "/appraisals"
    description: "Orders an appraisal of a parcel from a licensed appraiser for a closed engagement interval. Carries the OCC token on the parcel, because a later ACCEPTED appraisal supersedes the earlier one."
    roles: [RealPropertyOfficer]
    code: 201
    input: [parcel_id, appraiser_id, method, engagement_start_on, engagement_end_on, expected_parcel_version]
    output: Appraisal
    side_effects:
      - "Appraisal created in ORDERED"
      - "increments Parcel.version by 1"
      - "recomputes Appraiser.active_engagement_count"
  - method: GET
    path: "/appraisals/{id}"
    description: "Reads one appraisal."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, AgencyRepresentative, Appraiser, SystemAdministrator]
    code: 200
    input: []
    output: Appraisal
    side_effects: []
  - method: GET
    path: "/appraisals"
    description: "Lists appraisals; the parcel_id and appraiser_id filters are the reverse lookups for both FKs."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, AgencyRepresentative, Appraiser, SystemAdministrator]
    code: 200
    input: ["parcel_id?", "appraiser_id?", "status?", "method?", "limit?", "offset?"]
    output: Appraisal[]
    side_effects: []
  - method: POST
    path: "/appraisals/{id}/report"
    description: "The engaged appraiser delivers the valuation report."
    roles: [Appraiser]
    code: 200
    input: [appraised_value_cents, effective_date, narrative]
    output: Appraisal
    side_effects:
      - "status ORDERED -> REPORTED; appraised_value_cents, effective_date, narrative and reported_at recorded; expires_on computed as effective_date + 365 days"
  - method: POST
    path: "/appraisals/{id}/accept"
    description: "The real property office accepts the report as the governing valuation of the parcel."
    roles: [RealPropertyOfficer]
    code: 200
    input: []
    output: Appraisal
    side_effects:
      - "status REPORTED -> ACCEPTED with accepted_at stamped"
      - "any other ACCEPTED Appraisal on the same parcel moves to SUPERSEDED"
      - "Parcel.valuation_status recomputed to CURRENT, Parcel.disposition_ready recomputed, and Parcel.version incremented by 1"
      - "recomputes Appraiser.active_engagement_count (an ACCEPTED appraisal releases the engagement slot)"
  - method: POST
    path: "/appraisals/{id}/challenges"
    description: "A noticed preference entity challenges the reported value, posting the statutory challenge deposit."
    roles: [AgencyRepresentative]
    code: 201
    input: [asserted_value_cents, grounds, deposit_paid_cents]
    output: AppraisalChallenge
    side_effects:
      - "AppraisalChallenge created in SUBMITTED with computed required_deposit_cents; challenger_agency_id taken from the acting X-User-ID"
      - "Appraisal status REPORTED -> CHALLENGED and challenge_count incremented by 1"
  - method: GET
    path: "/appraisal-challenges/{id}"
    description: "Reads one appraisal challenge including its deposit disposition."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, FinanceOfficer, AgencyRepresentative, SystemAdministrator]
    code: 200
    input: []
    output: AppraisalChallenge
    side_effects: []
  - method: GET
    path: "/appraisal-challenges"
    description: "Lists challenges; the appraisal_id and challenger_agency_id filters are the reverse lookups for both FKs."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, FinanceOfficer, AgencyRepresentative, SystemAdministrator]
    code: 200
    input: ["appraisal_id?", "challenger_agency_id?", "status?", "limit?", "offset?"]
    output: AppraisalChallenge[]
    side_effects: []
  - method: POST
    path: "/appraisal-challenges/{id}/determine"
    description: "Board determination on the challenge; sustaining it revises the governing value, denying it forfeits the deposit to the highest-priority fund."
    roles: [BoardClerk]
    code: 200
    input: [determination, "revised_value_cents?"]
    output: AppraisalChallenge
    side_effects:
      - "status SUBMITTED -> SUSTAINED or DENIED with determined_by_user_id set to the acting X-User-ID"
      - "SUSTAINED: revised_value_cents stored, the parent Appraisal returns CHALLENGED -> REPORTED with appraised_value_cents replaced by revised_value_cents and revaluation_required true, and the deposit is refunded in full (deposit_refunded_cents = deposit_paid_cents)"
      - "DENIED: the parent Appraisal returns CHALLENGED -> REPORTED with its original value intact, and challenge_forfeiture_allocation posts the deposit to the lowest priority_rank Fund, creating a ProceedsAllocation with allocation_basis CHALLENGE_FORFEITURE and conveyance_id null"
  # ---- environmental review ---------------------------------------------
  - method: POST
    path: "/declarations/{id}/environmental-reviews"
    description: "Opens the environmental review for the disposition; an EXEMPT determination is certified on creation."
    roles: [RealPropertyOfficer]
    code: 201
    input: [determination_class, "circulation_start_on?", "circulation_end_on?"]
    output: EnvironmentalReview
    side_effects:
      - "EnvironmentalReview created in CIRCULATING with circulation_round 1, or directly in CERTIFIED with certified_at stamped when determination_class == EXEMPT"
  - method: GET
    path: "/declarations/{id}/environmental-reviews"
    description: "Lists the environmental reviews on a declaration (reverse lookup for EnvironmentalReview.declaration_id)."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, AgencyRepresentative, SystemAdministrator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EnvironmentalReview[]
    side_effects: []
  - method: GET
    path: "/environmental-reviews/{id}"
    description: "Reads one environmental review."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, AgencyRepresentative, SystemAdministrator]
    code: 200
    input: []
    output: EnvironmentalReview
    side_effects: []
  - method: POST
    path: "/environmental-reviews/{id}/certify"
    description: "Certifies the completed environmental document."
    roles: [RealPropertyOfficer]
    code: 200
    input: []
    output: EnvironmentalReview
    side_effects:
      - "status CIRCULATING -> CERTIFIED with certified_at stamped"
  - method: POST
    path: "/environmental-reviews/{id}/recirculate"
    description: "Sends the document back out for a further circulation round after substantial new information; the new window must respect the statutory buffer."
    roles: [RealPropertyOfficer]
    code: 200
    input: [recirculation_reason, circulation_start_on, circulation_end_on]
    output: EnvironmentalReview
    side_effects:
      - "status CIRCULATING -> RECIRCULATION_REQUIRED and immediately back to CIRCULATING on the new window; circulation_round incremented by 1; circulation_start_on and circulation_end_on replaced; recirculation_reason stored"
  # ---- disposition offerings ---------------------------------------------
  - method: POST
    path: "/offerings"
    description: "Creates the disposition offering under the authorized authority type and freezes the minimum price, its variant, and the required bid deposit. Carries the OCC token on the declaration."
    roles: [RealPropertyOfficer]
    code: 201
    input: [declaration_id, offering_type, bid_open_at, bid_close_at, "counterparty_bidder_id?", "counterparty_agency_id?", expected_declaration_version]
    output: DispositionOffering
    side_effects:
      - "DispositionOffering created in DRAFT with computed minimum_price_cents, minimum_price_variant and required_deposit_cents"
      - "any ACCEPTED Appraisal on the parcel whose expires_on is at or before the clock moves to EXPIRED first, which is what makes ERR_APPRAISAL_EXPIRED observable"
      - "increments SurplusDeclaration.version by 1"
  - method: GET
    path: "/offerings/{id}"
    description: "Reads one offering including its frozen pricing and qualified bid count."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, FinanceOfficer, AgencyRepresentative, Bidder, SystemAdministrator]
    code: 200
    input: []
    output: DispositionOffering
    side_effects: []
  - method: GET
    path: "/offerings"
    description: "Lists offerings; the declaration_id, counterparty_bidder_id and counterparty_agency_id filters are the reverse lookups for those FKs."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, FinanceOfficer, AgencyRepresentative, Bidder, SystemAdministrator]
    code: 200
    input: ["declaration_id?", "counterparty_bidder_id?", "counterparty_agency_id?", "offering_type?", "status?", "minimum_price_variant?", "limit?", "offset?"]
    output: DispositionOffering[]
    side_effects: []
  - method: POST
    path: "/offerings/{id}/publish"
    description: "Publishes the offering so bids may be received."
    roles: [RealPropertyOfficer]
    code: 200
    input: []
    output: DispositionOffering
    side_effects:
      - "status DRAFT -> OPEN"
  - method: POST
    path: "/offerings/{id}/bids"
    description: "A bidder submits a sealed bid with its deposit, which moves from the bidder's available funds into escrow."
    roles: [Bidder]
    code: 201
    input: [amount_cents, deposit_amount_cents, "intended_use?"]
    output: Bid
    side_effects:
      - "Bid created in qualification_status SUBMITTED x deposit_status HELD with bidder_id from the acting X-User-ID and submitted_at from the clock"
      - "Bidder.available_funds_cents decreases by deposit_amount_cents and escrow_held_cents increases by the same amount; lifetime_deposits_cents is unchanged"
  - method: POST
    path: "/offerings/{id}/close-bidding"
    description: "Closes bidding and grades every submitted bid; an empty qualifying set fails the disposition and starts the re-offering clock."
    roles: [RealPropertyOfficer]
    code: 200
    input: []
    output: DispositionOffering
    side_effects:
      - "each SUBMITTED Bid grades to QUALIFIED, or to DISQUALIFIED when its bidder is now DEBARRED (its deposit moves HELD -> RELEASED and the escrow returns to available_funds_cents)"
      - "qualified_bid_count recomputed; status OPEN -> EVALUATION when at least one bid qualifies"
      - "status OPEN -> FAILED_NO_QUALIFYING_BID when none qualifies, which cascades: the declaration moves OFFERING_AUTHORIZED -> UNSUCCESSFUL with reoffer_eligible_at = clock + 30 days, the parcel's ACCEPTED appraisal moves to SUPERSEDED with Parcel.valuation_status STALE, and Parcel.disposition_ready recomputes to false"
      - "increments SurplusDeclaration.version by 1 on the failure cascade"
  - method: POST
    path: "/offerings/{id}/award"
    description: "Awards the offering: to the ranked winning bid on a competitive sale, or to the declared counterparty on a negotiated sale or exchange."
    roles: [BoardClerk]
    code: 200
    input: []
    output: DispositionOffering
    side_effects:
      - "competitive branch: award_selection ranks the candidate bids, rank 1 becomes WINNING and the rest BACKUP, winning_bid_amount_cents is set from rank 1, and status EVALUATION -> AWARDED"
      - "negotiated / exchange branch: status OPEN -> AWARDED with winning_bid_amount_cents set to minimum_price_cents (or to the AGREED PreferenceOffer's agreed_price_cents when one exists)"
      - "awarded_at and awarded_by_user_id (the acting X-User-ID) recorded"
  - method: POST
    path: "/offerings/{id}/rescind-award"
    description: "Rescinds an award; a competitive offering returns to EVALUATION for re-ranking while a negotiated sale or exchange is cancelled outright."
    roles: [BoardClerk]
    code: 200
    input: [cancellation_reason]
    output: DispositionOffering
    side_effects:
      - "COMPETITIVE_SALE: status AWARDED -> EVALUATION, the WINNING bid moves to DISQUALIFIED with its deposit HELD -> RELEASED, every BACKUP bid returns to QUALIFIED, winning_bid_amount_cents cleared and rescind_count incremented by 1"
      - "NEGOTIATED_SALE or EXCHANGE: status AWARDED -> CANCELLED with cancellation_reason stored"
      - "any Conveyance on the offering in PENDING_TITLE or READY_TO_RECORD moves to RESCINDED with its frozen net_proceeds_cents and recoverable_curative_cost_cents reset to 0"
  # ---- bidders and bids --------------------------------------------------
  - method: POST
    path: "/bidders"
    description: "Registers a prospective bidder."
    roles: [SystemAdministrator]
    code: 201
    input: [legal_name, entity_type, contact_email]
    output: Bidder
    side_effects:
      - "Bidder created with debarment_status CLEAR and a zero ledger"
  - method: GET
    path: "/bidders/{id}"
    description: "Reads one bidder including the two ledger counters."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, FinanceOfficer, Bidder, SystemAdministrator]
    code: 200
    input: []
    output: Bidder
    side_effects: []
  - method: GET
    path: "/bidders"
    description: "Lists bidders."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, FinanceOfficer, SystemAdministrator]
    code: 200
    input: ["debarment_status?", "entity_type?", "limit?", "offset?"]
    output: Bidder[]
    side_effects: []
  - method: POST
    path: "/bidders/{id}/funding"
    description: "Credits verified funds to a bidder's account so deposits can be posted."
    roles: [FinanceOfficer]
    code: 200
    input: [amount_cents]
    output: Bidder
    side_effects:
      - "available_funds_cents and lifetime_deposits_cents both increase by amount_cents"
      - "increments Bidder.version by 1"
  - method: POST
    path: "/bidders/{id}/debarment"
    description: "Debars a bidder for cause; already-submitted bids are graded DISQUALIFIED at close of bidding."
    roles: [ComplianceMonitor]
    code: 200
    input: [debarment_reason]
    output: Bidder
    side_effects:
      - "debarment_status CLEAR -> DEBARRED with debarment_reason stored"
      - "increments Bidder.version by 1"
  - method: GET
    path: "/bids/{id}"
    description: "Reads one bid including both status dimensions and its award rank."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, FinanceOfficer, Bidder, SystemAdministrator]
    code: 200
    input: []
    output: Bid
    side_effects: []
  - method: GET
    path: "/bids"
    description: "Lists bids; the offering_id and bidder_id filters are the reverse lookups for both FKs."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, FinanceOfficer, Bidder, SystemAdministrator]
    code: 200
    input: ["offering_id?", "bidder_id?", "qualification_status?", "deposit_status?", "limit?", "offset?"]
    output: Bid[]
    side_effects: []
  - method: POST
    path: "/bids/{id}/withdraw"
    description: "The bidder withdraws a bid before bidding closes and the deposit leaves escrow."
    roles: [Bidder]
    code: 200
    input: []
    output: Bid
    side_effects:
      - "qualification_status SUBMITTED -> WITHDRAWN and deposit_status HELD -> RELEASED"
      - "Bidder.escrow_held_cents decreases and available_funds_cents increases by deposit_amount_cents, restoring the ledger to its exact pre-bid values"
  # ---- conveyance --------------------------------------------------------
  - method: POST
    path: "/offerings/{id}/conveyance"
    description: "Opens the conveyance file on an awarded offering, capturing the deed restrictions and the reverter condition that will bind the grantee."
    roles: [RealPropertyOfficer]
    code: 201
    input: [closing_costs_cents, broker_fee_cents, deed_restrictions, reverter_condition, "reverter_cure_period_days?"]
    output: Conveyance
    side_effects:
      - "Conveyance created in recording_status PENDING_TITLE x compliance_status NOT_MONITORED with parcel_id copied from the declaration and sale_price_cents copied from the offering's winning_bid_amount_cents"
      - "grantee_kind, grantee_bidder_id and grantee_agency_id resolved from the winning bid or the offering's counterparty leg"
  - method: GET
    path: "/conveyances/{id}"
    description: "Reads one conveyance including its frozen proceeds figures and reverter tracking."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, FinanceOfficer, AgencyRepresentative, Bidder, SystemAdministrator]
    code: 200
    input: []
    output: Conveyance
    side_effects: []
  - method: GET
    path: "/conveyances"
    description: "Lists conveyances; the offering_id, parcel_id, grantee_bidder_id and grantee_agency_id filters are the reverse lookups for those FKs."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, FinanceOfficer, AgencyRepresentative, Bidder, SystemAdministrator]
    code: 200
    input: ["offering_id?", "parcel_id?", "grantee_bidder_id?", "grantee_agency_id?", "recording_status?", "compliance_status?", "limit?", "offset?"]
    output: Conveyance[]
    side_effects: []
  - method: POST
    path: "/conveyances/{id}/clear-title"
    description: "Certifies that title is clear and the environmental document certified, and freezes the recoverable curative cost and the net proceeds."
    roles: [RealPropertyOfficer]
    code: 200
    input: []
    output: Conveyance
    side_effects:
      - "recording_status PENDING_TITLE -> READY_TO_RECORD"
      - "net_proceeds_determination runs and freezes recoverable_curative_cost_cents and net_proceeds_cents"
  - method: POST
    path: "/conveyances/{id}/record"
    description: "Records the deed, which transfers the parcel, closes out the offering and the declaration, and posts the net proceeds to the designated funds."
    roles: [RealPropertyOfficer]
    code: 200
    input: [recorded_instrument_number]
    output: Conveyance
    side_effects:
      - "recording_status READY_TO_RECORD -> RECORDED with recorded_instrument_number and recorded_at stored; compliance_status NOT_MONITORED -> COMPLIANT"
      - "Parcel.ownership_status AGENCY_OWNED -> CONVEYED, Parcel.disposition_ready recomputed to false and Parcel.version incremented by 1"
      - "DispositionOffering AWARDED -> CLOSED_CONVEYED and SurplusDeclaration OFFERING_AUTHORIZED -> CONVEYED with its version incremented by 1"
      - "proceeds_waterfall_allocation posts one ProceedsAllocation per participating Fund; each Fund's balance_cents and lifetime_credits_cents rise by its amount_cents; allocated_proceeds_cents set to the posted total"
      - "the WINNING Bid's deposit_status moves HELD -> APPLIED and the bidder's escrow_held_cents falls by the deposit"
  - method: POST
    path: "/conveyances/{id}/violation-notice"
    description: "Notices a breach of a deed restriction and starts the reverter cure period."
    roles: [ComplianceMonitor]
    code: 200
    input: [violation_description]
    output: Conveyance
    side_effects:
      - "compliance_status COMPLIANT or CURED -> VIOLATION_NOTICED with violation_noticed_at, violation_description and computed cure_deadline_at"
      - "any prior cure_note is retained for the audit trail"
  - method: POST
    path: "/conveyances/{id}/accept-cure"
    description: "Accepts the grantee's cure inside the cure period, returning the conveyance to compliance and re-arming the reverter."
    roles: [ComplianceMonitor]
    code: 200
    input: [cure_note]
    output: Conveyance
    side_effects:
      - "compliance_status VIOLATION_NOTICED -> CURED with cure_note stored and violation_noticed_at and cure_deadline_at cleared"
      - "a subsequent violation-notice is admissible from CURED, which is what closes the compliance cycle"
  - method: POST
    path: "/conveyances/{id}/revert"
    description: "Enforces the reverter clause after the cure period lapses: title returns to the agency and the posted proceeds are reversed."
    roles: [ComplianceMonitor]
    code: 200
    input: []
    output: Conveyance
    side_effects:
      - "compliance_status VIOLATION_NOTICED -> REVERTED and recording_status RECORDED -> RESCINDED with reverted_at stamped"
      - "Parcel.ownership_status CONVEYED -> REVERTED_TO_AGENCY, Parcel.valuation_status set to STALE, disposition_ready recomputed to false and Parcel.version incremented by 1"
      - "every POSTED ProceedsAllocation on this conveyance moves to REVERSED with reversed_at stamped; each Fund's balance_cents falls and lifetime_debits_cents rises by amount_cents; allocated_proceeds_cents recomputed to 0"
  # ---- funds and proceeds allocations ------------------------------------
  - method: POST
    path: "/funds"
    description: "Configures a designated fund with its statutory priority rank, fixed reserve and percentage share."
    roles: [FinanceOfficer]
    code: 201
    input: [name, fund_code, priority_rank, allocation_pct, "fixed_reserve_cents?"]
    output: Fund
    side_effects:
      - "Fund created with a zero balance and zero lifetime counters"
  - method: GET
    path: "/funds/{id}"
    description: "Reads one fund with its balance and lifetime credit and debit counters."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, FinanceOfficer, SystemAdministrator]
    code: 200
    input: []
    output: Fund
    side_effects: []
  - method: GET
    path: "/funds"
    description: "Lists funds in priority_rank order."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, FinanceOfficer, SystemAdministrator]
    code: 200
    input: ["limit?", "offset?"]
    output: Fund[]
    side_effects: []
  - method: PATCH
    path: "/funds/{id}"
    description: "Adjusts a fund's percentage share or fixed reserve; the allocation percentages must still sum to 1.0 when proceeds are posted."
    roles: [FinanceOfficer]
    code: 200
    input: ["allocation_pct?", "fixed_reserve_cents?"]
    output: Fund
    side_effects:
      - "increments Fund.version by 1"
  - method: GET
    path: "/funds/{id}/proceeds-allocations"
    description: "Lists the allocation rows posted to a fund, including CHALLENGE_FORFEITURE rows that belong to no conveyance (reverse lookup for ProceedsAllocation.fund_id)."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, FinanceOfficer, SystemAdministrator]
    code: 200
    input: ["status?", "allocation_basis?", "limit?", "offset?"]
    output: ProceedsAllocation[]
    side_effects: []
  - method: GET
    path: "/conveyances/{id}/proceeds-allocations"
    description: "Lists the allocation rows produced by recording a conveyance, in priority_rank order (reverse lookup for ProceedsAllocation.conveyance_id)."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, FinanceOfficer, SystemAdministrator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ProceedsAllocation[]
    side_effects: []
  - method: GET
    path: "/proceeds-allocations"
    description: "Lists allocation rows across the register, filterable by fund, conveyance, basis and posting status."
    roles: [RealPropertyOfficer, BoardClerk, ComplianceMonitor, FinanceOfficer, SystemAdministrator]
    code: 200
    input: ["conveyance_id?", "fund_id?", "allocation_basis?", "status?", "limit?", "offset?"]
    output: ProceedsAllocation[]
    side_effects: []

errors:
  # ---- authentication and authorization ---------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role is missing or unknown, or X-User-ID is missing or empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the endpoint"
  - id: ERR_IDENTITY_NOT_RESOLVABLE
    http: 403
    condition: "an entity_backed role's X-User-ID does not resolve to a row of its backing entity"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "the acting agency or bidder does not own the addressed notice, preference offer or bid"
  - id: ERR_NOT_ENGAGED_APPRAISER
    http: 403
    condition: "the acting Appraiser is not the appraisal's engaged appraiser"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the same operator id would perform two duties the domain keeps apart (adopting a declaration and determining a challenge on it; rescinding an award and re-awarding the same offering)"
  # ---- request shape -----------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required field is missing, an enum value is not a declared member, a numeric or date field is out of its declared range, a list length is out of bounds, or a field is supplied that the offering type forbids"
  # ---- existence ---------------------------------------------------------
  - id: ERR_AGENCY_NOT_FOUND
    http: 404
    condition: "an agency id in the path, in custodian_agency_id, in counterparty_agency_id or in recipient_agency_ids does not exist"
  - id: ERR_PARCEL_NOT_FOUND
    http: 404
    condition: "the parcel id in the path or in parcel_id does not exist"
  - id: ERR_DECLARATION_NOT_FOUND
    http: 404
    condition: "the declaration id in the path or in declaration_id does not exist"
  - id: ERR_NOTICE_NOT_FOUND
    http: 404
    condition: "the statutory notice id in the path does not exist"
  - id: ERR_PREFERENCE_OFFER_NOT_FOUND
    http: 404
    condition: "the preference offer id in the path does not exist"
  - id: ERR_APPRAISER_NOT_FOUND
    http: 404
    condition: "the appraiser id in the path or in appraiser_id does not exist"
  - id: ERR_APPRAISAL_NOT_FOUND
    http: 404
    condition: "the appraisal id in the path does not exist"
  - id: ERR_CHALLENGE_NOT_FOUND
    http: 404
    condition: "the appraisal challenge id in the path does not exist"
  - id: ERR_ENV_REVIEW_NOT_FOUND
    http: 404
    condition: "the environmental review id in the path does not exist"
  - id: ERR_TITLE_ITEM_NOT_FOUND
    http: 404
    condition: "the title curative item id in the path does not exist"
  - id: ERR_OFFERING_NOT_FOUND
    http: 404
    condition: "the disposition offering id in the path does not exist"
  - id: ERR_BIDDER_NOT_FOUND
    http: 404
    condition: "the bidder id in the path or in counterparty_bidder_id does not exist, or the acting Bidder's X-User-ID resolves to no bidder"
  - id: ERR_BID_NOT_FOUND
    http: 404
    condition: "the bid id in the path does not exist"
  - id: ERR_CONVEYANCE_NOT_FOUND
    http: 404
    condition: "the conveyance id in the path does not exist"
  - id: ERR_FUND_NOT_FOUND
    http: 404
    condition: "the fund id in the path does not exist"
  # ---- referential integrity and duplication ----------------------------
  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "Parcel.apn, Appraiser.license_number, Fund.fund_code or Fund.priority_rank is already taken"
  - id: ERR_DUPLICATE_ACTIVE_DECLARATION
    http: 409
    condition: "the parcel already carries a declaration whose status is outside {CONVEYED, WITHDRAWN}"
  - id: ERR_DUPLICATE_BID
    http: 409
    condition: "the bidder already holds a live bid on this offering"
  - id: ERR_CONVEYANCE_ALREADY_EXISTS
    http: 409
    condition: "the offering already carries a conveyance in PENDING_TITLE, READY_TO_RECORD or RECORDED"
  - id: ERR_INVALID_ROUND_REFERENCE
    http: 422
    condition: "responded_to_round_number does not name an earlier round of the opposite party on the same offer"
  - id: ERR_CHALLENGER_NOT_ELIGIBLE
    http: 422
    condition: "the challenging agency received no statutory notice on the declaration covering the appraised parcel"
  # ---- optimistic concurrency -------------------------------------------
  - id: ERR_STALE_PARCEL_VERSION
    http: 412
    condition: "expected_parcel_version does not equal the parcel's current version"
  - id: ERR_STALE_DECLARATION_VERSION
    http: 412
    condition: "expected_declaration_version does not equal the declaration's current version"
  # ---- state -------------------------------------------------------------
  - id: ERR_INVALID_DECLARATION_STATE
    http: 409
    condition: "the declaration's status is not a from-state of the requested transition"
  - id: ERR_INVALID_NOTICE_STATE
    http: 409
    condition: "the statutory notice is no longer ISSUED"
  - id: ERR_INVALID_OFFER_STATE
    http: 409
    condition: "the preference offer's negotiation_status does not admit the requested transition"
  - id: ERR_INVALID_GOOD_FAITH_STATE
    http: 409
    condition: "the preference offer's good_faith_status does not admit the requested transition"
  - id: ERR_INVALID_APPRAISAL_STATE
    http: 409
    condition: "the appraisal's status does not admit reporting, acceptance or a challenge"
  - id: ERR_INVALID_CHALLENGE_STATE
    http: 409
    condition: "the appraisal challenge is no longer SUBMITTED"
  - id: ERR_INVALID_ENV_REVIEW_STATE
    http: 409
    condition: "the environmental review is not CIRCULATING, or certification is attempted before circulation_end_on"
  - id: ERR_INVALID_TITLE_ITEM_STATE
    http: 409
    condition: "the title curative item is no longer OPEN"
  - id: ERR_INVALID_OFFERING_STATE
    http: 409
    condition: "the offering's status does not admit the requested transition for its offering_type"
  - id: ERR_INVALID_BID_STATE
    http: 409
    condition: "the bid is no longer SUBMITTED with its deposit HELD"
  - id: ERR_INVALID_CONVEYANCE_STATE
    http: 409
    condition: "the conveyance's recording_status or compliance_status does not admit the requested transition, or a RECORDED conveyance blocks an award rescission"
  - id: ERR_COMPETITIVE_BID_NOT_ALLOWED
    http: 409
    condition: "a bid was submitted on a NEGOTIATED_SALE or EXCHANGE offering"
  - id: ERR_BIDDING_CLOSED
    http: 409
    condition: "the clock is outside [bid_open_at, bid_close_at) for a bid submission or withdrawal"
  - id: ERR_BIDDING_STILL_OPEN
    http: 409
    condition: "close-bidding was called before bid_close_at"
  # ---- statutory and regulatory compliance -------------------------------
  - id: ERR_NOTICE_WINDOW_INVALID
    http: 422
    condition: "response_window_days falls outside 60..90"
  - id: ERR_NOTICE_REGISTRY_LAPSED
    http: 422
    condition: "a notice recipient's notice_registry_status is LAPSED"
  - id: ERR_NOT_PREFERENCE_ENTITY
    http: 422
    condition: "the responding agency does not hold a statutory preference right"
  - id: ERR_PREFERENCE_WINDOW_STILL_OPEN
    http: 409
    condition: "the preference window is closed while notices of the current round are still ISSUED and the response deadline has not been reached"
  - id: ERR_NOTICE_RESPONSE_LATE
    http: 409
    condition: "a notice response arrives after the notice's response_deadline_at"
  - id: ERR_NEGOTIATION_WINDOW_EXPIRED
    http: 409
    condition: "a negotiation round is appended after the offer's negotiation_deadline_at"
  - id: ERR_GOOD_FAITH_ROUNDS_NOT_MET
    http: 422
    condition: "an offer is concluded AGREED with fewer than three custodian-agency negotiation rounds"
  - id: ERR_NEGOTIATION_STILL_ACTIVE
    http: 409
    condition: "a good-faith determination is attempted while the negotiation is unconcluded, or a competitive authorization is attempted while an offer is still OPEN or IN_NEGOTIATION"
  - id: ERR_GOOD_FAITH_NOT_DETERMINED
    http: 422
    condition: "authorization is attempted while a relevant offer's good_faith_status is UNREVIEWED or UNDER_REVIEW"
  - id: ERR_GOOD_FAITH_DEFICIENT
    http: 422
    condition: "authorization is attempted while a relevant offer's good_faith_status is DEFICIENT"
  - id: ERR_PREFERENCE_UNRESOLVED
    http: 422
    condition: "a negotiated sale is authorized with no AGREED preference offer on the declaration"
  - id: ERR_OFFERING_TYPE_AUTHORITY_MISMATCH
    http: 422
    condition: "the requested disposition type contradicts the path the declaration took, or an offering's offering_type differs from authorized_disposition_type"
  - id: ERR_EXCHANGE_FINDINGS_REQUIRED
    http: 422
    condition: "an exchange is authorized without authority_findings"
  - id: ERR_NO_ACCEPTED_APPRAISAL
    http: 422
    condition: "an offering is created for a parcel with no ACCEPTED appraisal"
  - id: ERR_APPRAISAL_EXPIRED
    http: 409
    condition: "the parcel's ACCEPTED appraisal has reached its expires_on"
  - id: ERR_REOFFER_COOLING_OFF
    http: 409
    condition: "a re-offer is attempted before reoffer_eligible_at"
  - id: ERR_REOFFER_LIMIT_REACHED
    http: 422
    condition: "a third re-offer cycle is attempted on the same declaration"
  - id: ERR_TITLE_ITEMS_UNRESOLVED
    http: 422
    condition: "title is cleared while an OPEN title curative item remains on the parcel"
  - id: ERR_ENV_REVIEW_NOT_CERTIFIED
    http: 422
    condition: "title is cleared or a disposition authorized with no CERTIFIED environmental review on the declaration"
  - id: ERR_EASEMENT_RESERVATION_MISSING
    http: 422
    condition: "the deed restrictions supplied are fewer than the reserved easements on the parcel"
  - id: ERR_CURE_PERIOD_EXPIRED
    http: 409
    condition: "a cure is accepted after cure_deadline_at"
  - id: ERR_CURE_PERIOD_NOT_EXPIRED
    http: 409
    condition: "the reverter is enforced at or before cure_deadline_at"
  - id: ERR_APPRAISER_LICENSE_EXPIRED
    http: 422
    condition: "the appraiser's licence is EXPIRED or lapses before the engagement ends"
  - id: ERR_BIDDER_DEBARRED
    http: 422
    condition: "a debarred bidder submits a bid"
  - id: ERR_CHALLENGE_WINDOW_CLOSED
    http: 409
    condition: "a challenge is filed more than 30 days after the appraisal was reported"
  # ---- constraint satisfaction ------------------------------------------
  - id: ERR_APPRAISER_CAPACITY_EXCEEDED
    http: 409
    condition: "the appraiser already holds two in-flight engagements overlapping the requested closed interval"
  - id: ERR_CIRCULATION_TOO_SHORT
    http: 422
    condition: "a non-exempt circulation window spans fewer than 30 days"
  - id: ERR_RECIRCULATION_BUFFER_VIOLATION
    http: 422
    condition: "a recirculation starts less than 30 days after the prior round's circulation_end_on"
  - id: ERR_CIRCULATION_WINDOW_OVERLAP
    http: 409
    condition: "two environmental review windows on the same declaration share a day"
  - id: ERR_OFFERING_WINDOW_INVALID
    http: 422
    condition: "bid_close_at is at or before bid_open_at"
  - id: ERR_OFFERING_WINDOW_CONFLICT
    http: 409
    condition: "the new bidding window intersects a live offering's window on the same parcel"
  - id: ERR_PARCEL_NOT_DISPOSITION_READY
    http: 422
    condition: "the parcel is not agency-owned, not currently valued, or still carries an open title item"
  - id: ERR_NEGOTIATED_BUYER_REQUIRED
    http: 422
    condition: "a negotiated sale supplies no counterparty leg, supplies both legs, or names a counterparty other than the agreed preference entity"
  - id: ERR_EXCHANGE_COUNTERPARTY_REQUIRED
    http: 422
    condition: "an exchange supplies no counterparty_agency_id, or supplies a bidder leg instead"
  - id: ERR_CHALLENGE_DELTA_TOO_SMALL
    http: 422
    condition: "the asserted value differs from the appraised value by less than 5%"
  # ---- fiscal ------------------------------------------------------------
  - id: ERR_AGREED_PRICE_BELOW_MINIMUM
    http: 422
    condition: "the agreed negotiated price is below the offer's affordable-housing minimum"
  - id: ERR_BID_BELOW_MINIMUM
    http: 422
    condition: "the bid amount is below the offering's frozen minimum price"
  - id: ERR_DEPOSIT_INSUFFICIENT
    http: 422
    condition: "the bid deposit is below the offering's required deposit"
  - id: ERR_INSUFFICIENT_BIDDER_FUNDS
    http: 422
    condition: "the bidder's available funds cannot cover the deposit"
  - id: ERR_CHALLENGE_DEPOSIT_INSUFFICIENT
    http: 422
    condition: "the posted challenge deposit is below the computed requirement"
  - id: ERR_FUNDS_NOT_CONFIGURED
    http: 422
    condition: "money must move but no Fund is configured"
  - id: ERR_ALLOCATION_PCT_SUM_INVALID
    http: 422
    condition: "the configured allocation percentages do not sum to exactly 1.0"
  - id: ERR_NET_PROCEEDS_NON_POSITIVE
    http: 422
    condition: "closing costs and broker fees consume the whole sale price"
  - id: ERR_NO_QUALIFYING_BID
    http: 422
    condition: "an award is attempted with no bid surviving the eligibility filter"

roles:
  - name: RealPropertyOfficer
    description: "the real property office staff who draft declarations, serve notices, run negotiations, order appraisals, resolve title, publish offerings and drive conveyances to recording"
    identity: opaque
    exclusive_operations:
      - "POST /parcels"
      - "PATCH /parcels/{id}"
      - "POST /parcels/{id}/title-items"
      - "POST /title-items/{id}/resolve"
      - "POST /declarations"
      - "POST /declarations/{id}/issue-notices"
      - "POST /declarations/{id}/close-preference-window"
      - "POST /declarations/{id}/re-offer"
      - "POST /declarations/{id}/environmental-reviews"
      - "POST /environmental-reviews/{id}/certify"
      - "POST /environmental-reviews/{id}/recirculate"
      - "POST /appraisals"
      - "POST /appraisals/{id}/accept"
      - "POST /preference-offers/{id}/conclude"
      - "POST /offerings"
      - "POST /offerings/{id}/publish"
      - "POST /offerings/{id}/close-bidding"
      - "POST /offerings/{id}/conveyance"
      - "POST /conveyances/{id}/clear-title"
      - "POST /conveyances/{id}/record"
    shared_operations:
      - "POST /preference-offers/{id}/rounds (shared with AgencyRepresentative, party CUSTODIAN_AGENCY only)"
      - "every GET read endpoint"
      - "POST /_clock/set_current_utc"
  - name: BoardClerk
    description: "clerk of the governing board, who records the board's own acts: adoption, disposition authority, challenge determinations, awards, rescissions and withdrawals"
    identity: opaque
    exclusive_operations:
      - "POST /declarations/{id}/adopt"
      - "POST /declarations/{id}/authorize-disposition"
      - "POST /declarations/{id}/withdraw"
      - "POST /appraisal-challenges/{id}/determine"
      - "POST /offerings/{id}/award"
      - "POST /offerings/{id}/rescind-award"
    shared_operations:
      - "every GET read endpoint"
      - "POST /_clock/set_current_utc"
  - name: ComplianceMonitor
    description: "compliance staff who judge good faith in preference negotiations, debar bidders, and police deed restrictions and reverter clauses after recording"
    identity: opaque
    exclusive_operations:
      - "POST /preference-offers/{id}/good-faith-review"
      - "POST /preference-offers/{id}/good-faith-determination"
      - "POST /bidders/{id}/debarment"
      - "POST /conveyances/{id}/violation-notice"
      - "POST /conveyances/{id}/accept-cure"
      - "POST /conveyances/{id}/revert"
    shared_operations:
      - "every GET read endpoint"
      - "POST /_clock/set_current_utc"
  - name: FinanceOfficer
    description: "treasury staff who configure the designated funds and credit verified bidder funds"
    identity: opaque
    exclusive_operations:
      - "POST /funds"
      - "PATCH /funds/{id}"
      - "POST /bidders/{id}/funding"
    shared_operations:
      - "GET /funds, GET /funds/{id}, GET /funds/{id}/proceeds-allocations, GET /proceeds-allocations, GET /conveyances/{id}/proceeds-allocations"
      - "the remaining GET read endpoints"
      - "POST /_clock/set_current_utc"
  - name: AgencyRepresentative
    description: "an officer of a noticed public agency or preference entity, acting for its own agency only"
    identity: "entity_backed:Agency"
    exclusive_operations:
      - "POST /notices/{id}/respond"
      - "POST /appraisals/{id}/challenges"
    shared_operations:
      - "POST /preference-offers/{id}/rounds (shared with RealPropertyOfficer, party PREFERENCE_ENTITY only)"
      - "the GET read endpoints on parcels, declarations, notices, preference offers, appraisals, challenges, environmental reviews, title items, offerings and conveyances"
      - "POST /_clock/set_current_utc"
  - name: Appraiser
    description: "the licensed appraiser engaged on a specific appraisal, who may report only on that engagement"
    identity: "entity_backed:Appraiser"
    exclusive_operations:
      - "POST /appraisals/{id}/report"
    shared_operations:
      - "GET /appraisers, GET /appraisers/{id}, GET /appraisals, GET /appraisals/{id}, GET /parcels/{id}"
      - "POST /_clock/set_current_utc"
  - name: Bidder
    description: "a prospective purchaser bidding into a competitive sale, acting for its own bidder record only"
    identity: "entity_backed:Bidder"
    exclusive_operations:
      - "POST /offerings/{id}/bids"
      - "POST /bids/{id}/withdraw"
    shared_operations:
      - "GET /offerings, GET /offerings/{id}, GET /bids, GET /bids/{id}, GET /bidders/{id}, GET /parcels, GET /parcels/{id}, GET /declarations, GET /declarations/{id}, GET /conveyances, GET /conveyances/{id}"
      - "POST /_clock/set_current_utc"
  - name: SystemAdministrator
    description: "registry administrator for the reference data the workflow depends on: agencies, appraisers and bidders"
    identity: opaque
    exclusive_operations:
      - "POST /agencies"
      - "PATCH /agencies/{id}"
      - "POST /appraisers"
      - "POST /bidders"
    shared_operations:
      - "every GET read endpoint"
      - "POST /_clock/set_current_utc"
