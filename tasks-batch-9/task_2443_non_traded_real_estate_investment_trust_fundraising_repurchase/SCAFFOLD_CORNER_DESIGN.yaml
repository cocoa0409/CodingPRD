              as: SponsorOperator
              captures: { le_id: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "Ulla Sorensen", email: "ulla.sorensen@example.com", state_code: "TX", net_worth_cents: 5000000000, annual_income_cents: 1000000000 }
              as: SponsorOperator
              captures: { inv_id: $.data.id }
            - call: "POST /repurchase-periods"
              payload: { offering_id: "${off_id}", period_month: "2026-08", opens_at: "2026-08-01T00:00:00Z", request_cutoff_at: "2026-08-10T00:00:00Z", settlement_date: "2026-08-12" }
              as: TransferAgent
              captures: { rp_id: $.data.id }
          trigger:
            - call: "POST /offerings/${off_id}/escrow"
              payload: { action: "BREAK" }
              as: SponsorOperator
              captures: { escrow_role_error: $.error.error_id }
            - call: "POST /offerings"
              payload: { name: "Compliance Cannot Register This", minimum_offering_amount_cents: 30000000, maximum_offering_amount_cents: 50000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000 }
              as: ComplianceOfficer
              captures: { offering_role_error: $.error.error_id }
            - call: "POST /broker-dealers"
              payload: { firm_name: "Sponsor Cannot Register This", crd_number: "CRD-350001" }
              as: SponsorOperator
              captures: { bd_role_error: $.error.error_id }
            - call: "POST /liquidity-events/${le_id}/status"
              payload: { action: "BOARD_APPROVE" }
              as: SponsorOperator
              captures: { board_role_error: $.error.error_id }
            - call: "POST /repurchase-requests"
              payload: { repurchase_period_id: "${rp_id}", share_class_id: "${sc_id}", shares_requested_e4: 10000 }
              as: SponsorOperator
              captures: { request_role_error: $.error.error_id }
            - call: "POST /share-classes/${sc_id}/status"
              payload: { to_status: "CLOSED_TO_NEW" }
              as: ComplianceOfficer
              captures: { class_status_role_error: $.error.error_id }
            - call: "POST /repurchase-periods"
              payload: { offering_id: "${off_id}", period_month: "2026-09", opens_at: "2026-09-01T00:00:00Z", request_cutoff_at: "2026-09-10T00:00:00Z", settlement_date: "2026-09-12" }
              as: InvestorUser
              as_user_id: "${inv_id}"
              captures: { period_role_error: $.error.error_id }
            - call: "POST /offerings/${off_id}/escrow"
              payload: { action: "BREAK" }
              as: ComplianceOfficer
