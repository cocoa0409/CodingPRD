            - "call 3 returns HTTP 409 with error_id == ERR_DUPLICATE_RECORD_LOCATOR"
            - "call 4 returns HTTP 409 with error_id == ERR_DUPLICATE_TAG_NUMBER"
            - "call 5 returns HTTP 409 with error_id == ERR_DUPLICATE_SEQUENCE_INDEX"
            - "Booking.${bk_id}.segment_count == 1 and Booking.${bk_id}.collected_total_cents == 54500 — no rejected call wrote anything"

      - name: pagination_parameters_outside_declared_bounds_rejected
