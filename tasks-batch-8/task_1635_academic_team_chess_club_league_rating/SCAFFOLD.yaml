    actor: FederationAdmin
    preconditions:
    - Section in OPEN (ERR_SECTION_INVALID_STATE)
    side_effects: []
  - from: LOCKED
    to: OPEN
    trigger: POST /api/sections/{sectionId}/unlock
    actor: FederationAdmin
    preconditions:
    - Section in LOCKED (ERR_SECTION_INVALID_STATE)
    side_effects: []
  - from: OPEN
    to: CLOSED
    trigger: system (tournament start or cancel)
    actor: system
    preconditions: []
    side_effects: []
  - from: LOCKED
    to: CLOSED
    trigger: system (tournament start or cancel)
    actor: system
    preconditions: []
    side_effects: []
- entity: TournamentEntry
  initial_state: REGISTERED
  terminal_states:
  - FINISHED
  - WITHDRAWN
  transitions:
  - from: REGISTERED
    to: CHECKED_IN
    trigger: POST /api/entries/{entryId}/check-in
    actor: Proctor | FederationAdmin
    preconditions:
    - Entry in REGISTERED (ERR_ENTRY_INVALID_STATE — checked first)
    - Parent tournament in RUNNING (ERR_TOURNAMENT_INVALID_STATE)
    side_effects:
    - Player.performance_points += 2
  - from: REGISTERED
    to: WITHDRAWN
    trigger: POST /api/entries/{entryId}/withdraw or tournament cancel cascade
    actor: ClubCoach | system
    preconditions:
    - Entry in REGISTERED | CHECKED_IN (ERR_ENTRY_INVALID_STATE)
    side_effects:
    - refund_cents per withdrawal_refund (100% while REGISTRATION_OPEN, 50% while REGISTRATION_CLOSED, 0% while RUNNING|COMPLETED;
      100% on tournament cancel)
    - 'If refund_cents > 0: post LedgerEntry ENTRY_REFUND amount_cents = +refund_cents with entry_id set; recompute club balance
      and standing'
    - section.current_entries -= 1
  - from: CHECKED_IN
    to: WITHDRAWN
    trigger: POST /api/entries/{entryId}/withdraw or tournament cancel cascade
    actor: ClubCoach | system
    preconditions:
    - Entry in REGISTERED | CHECKED_IN (ERR_ENTRY_INVALID_STATE)
    side_effects:
    - 'Manual withdrawal from CHECKED_IN: refund_cents = 0; cancel cascade: refund_cents = fee_cents'
    - 'If refund_cents > 0: post LedgerEntry ENTRY_REFUND; recompute club balance and standing'
    - section.current_entries -= 1
  - from: REGISTERED
    to: FINISHED
    trigger: system (tournament complete)
    actor: system
    preconditions: []
    side_effects: []
  - from: CHECKED_IN
    to: FINISHED
    trigger: system (tournament complete)
    actor: system
    preconditions: []
    side_effects: []
