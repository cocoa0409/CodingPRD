            - { call: "POST /project-orders/${ord_id}/submit", payload: { expected_order_version: "${ord_v}" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_DEALER_SUSPENDED and http status 409; order stays DRAFT"

  # ============================================================= endpoints ====
  - section: endpoints
    instances:
      - name: ep_pagination_defaults_and_offset
        claim_type: listing
        grounds:
          - "response_envelope"
          - "endpoints.\"GET /configurations\""
        distinguishing_aspect: "default pagination is limit 10 / offset 0: 11 configurations list as 10 items with total_count 11 and has_more true; offset 10 returns the last item with has_more false."
        test_recipe:
          setup: ["dealer with 11 configurations"]
          setup_api_calls:
            - { call: "POST /product-families", payload: { family_code: "SEAT-2200", name: "Seating 2200", category: "SEATING", base_lead_time_days: 28 }, as: ManufacturerAdmin }
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI"], service_capability_level: 4 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
            - { call: "POST /configurations", payload: { name: "C01", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 1 }] }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /configurations", payload: { name: "C02", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 1 }] }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /configurations", payload: { name: "C03", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 1 }] }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /configurations", payload: { name: "C04", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 1 }] }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /configurations", payload: { name: "C05", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 1 }] }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /configurations", payload: { name: "C06", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 1 }] }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /configurations", payload: { name: "C07", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 1 }] }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /configurations", payload: { name: "C08", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 1 }] }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /configurations", payload: { name: "C09", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 1 }] }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /configurations", payload: { name: "C10", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 1 }] }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /configurations", payload: { name: "C11", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 1 }] }, as: DealerRep, as_user_id: "${dlr_id}" }
          trigger:
            - { call: "GET /configurations", as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "GET /configurations", payload: { offset: 10 }, as: DealerRep, as_user_id: "${dlr_id}" }
          assert:
            - "first page: 10 items, total_count == 11, has_more == true (defaults limit 10, offset 0)"
            - "second call: 1 item, has_more == false"

      - name: ep_filter_project_orders_by_agreement
        claim_type: standard_crud
        grounds:
          - "endpoints.\"GET /project-orders\""
          - "entities.ProjectOrder.fields.volume_agreement_id"
        distinguishing_aspect: "the volume_agreement_id filter returns exactly the orders of that agreement (1 of 2), each item echoing the filtered FK."
        test_recipe:
          setup: ["two active agreements (end users A and B); one submitted order under each"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ManufacturerAdmin }
            - { call: "POST /product-families", payload: { family_code: "SEAT-2200", name: "Seating 2200", category: "SEATING", base_lead_time_days: 28 }, as: ManufacturerAdmin }
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI"], service_capability_level: 4 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
            - { call: "POST /end-users", payload: { name: "MegaCorp", industry: "technology" }, as: ManufacturerAdmin, captures: { euA: "$.data.id" } }
            - { call: "POST /end-users", payload: { name: "GigaCorp", industry: "finance" }, as: ManufacturerAdmin, captures: { euB: "$.data.id" } }
            - { call: "POST /volume-agreements", payload: { end_user_id: "${euA}", effective_start: "2026-01-01", effective_end: "2027-12-31", tier1_discount_pct: 0.10, tier2_discount_pct: 0.15, tier3_discount_pct: 0.20 }, as: ManufacturerAdmin, captures: { agrA: "$.data.id" } }
            - { call: "POST /volume-agreements/${agrA}/activate", as: ManufacturerAdmin }
            - { call: "POST /volume-agreements", payload: { end_user_id: "${euB}", effective_start: "2026-01-01", effective_end: "2027-12-31", tier1_discount_pct: 0.10, tier2_discount_pct: 0.15, tier3_discount_pct: 0.20 }, as: ManufacturerAdmin, captures: { agrB: "$.data.id" } }
            - { call: "POST /volume-agreements/${agrB}/activate", as: ManufacturerAdmin }
            - { call: "POST /configurations", payload: { name: "Chairs", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 1 }] }, as: DealerRep, as_user_id: "${dlr_id}", captures: { cfg_id: "$.data.id" } }
            - { call: "POST /project-orders", payload: { volume_agreement_id: "${agrA}", configuration_id: "${cfg_id}", territory_code: "MI", requested_install_date: "2026-12-15" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders", payload: { volume_agreement_id: "${agrB}", configuration_id: "${cfg_id}", territory_code: "MI", requested_install_date: "2026-12-15" }, as: DealerRep, as_user_id: "${dlr_id}" }
          trigger:
            - { call: "GET /project-orders", payload: { volume_agreement_id: "${agrA}" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { first_agr: "$.data[0].volume_agreement_id" } }
          assert:
            - "exactly 1 item returned and its volume_agreement_id == ${agrA}"

      - name: ep_response_envelope_shapes
        claim_type: standard_crud
        grounds:
          - "response_envelope"
        distinguishing_aspect: "success responses carry meta.api_request_id, meta.api_request_timestamp, response_type and data; error responses carry response_type 'error' and data.error_id + data.message."
        test_recipe:
          setup: ["one dealer exists"]
          setup_api_calls:
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI"], service_capability_level: 4 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
          trigger:
            - { call: "GET /configurations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: DealerRep, as_user_id: "${dlr_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error response: response_type == error, data.error_id == ERR_CONFIGURATION_NOT_FOUND, data.message is a non-empty string, meta.api_request_id present"
            - "the create response carried meta.api_request_id, meta.api_request_timestamp and response_type == object"

  # ================================================================ errors ====
  - section: errors
    instances:
      - name: errors_not_found_sweep_returns_404
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_DEALER_NOT_FOUND]"
          - "errors[ERR_END_USER_NOT_FOUND]"
          - "errors[ERR_AGREEMENT_NOT_FOUND]"
          - "errors[ERR_PRODUCT_FAMILY_NOT_FOUND]"
          - "errors[ERR_PHASE_NOT_FOUND]"
          - "errors[ERR_WINDOW_NOT_FOUND]"
          - "errors[ERR_PUNCH_NOT_FOUND]"
          - "errors[ERR_CLAIM_NOT_FOUND]"
        distinguishing_aspect: "every resource-specific 404 in the catalog is triggerable on its own endpoint with a well-formed unknown UUID (order/configuration 404s are exercised by their own corner instances)."
        test_recipe:
          setup: ["dealer exists for scoped calls"]
          setup_api_calls:
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI"], service_capability_level: 4 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
          trigger:
            - { call: "PATCH /dealers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: { service_capability_level: 5 }, as: ManufacturerAdmin, captures: { e1: "$.data.error_id" } }
            - { call: "POST /volume-agreements", payload: { end_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", effective_start: "2026-01-01", effective_end: "2027-12-31", tier1_discount_pct: 0.10, tier2_discount_pct: 0.15, tier3_discount_pct: 0.20 }, as: ManufacturerAdmin, captures: { e2: "$.data.error_id" } }
            - { call: "GET /volume-agreements/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: ManufacturerAdmin, captures: { e3: "$.data.error_id" } }
            - { call: "PATCH /product-families/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: { lifecycle_status: "SUNSETTING", last_order_date: "2026-12-31" }, as: ManufacturerAdmin, captures: { e4: "$.data.error_id" } }
            - { call: "POST /phases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/start-install", as: DealerRep, as_user_id: "${dlr_id}", captures: { e5: "$.data.error_id" } }
            - { call: "POST /install-windows/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/cancel", as: DealerRep, as_user_id: "${dlr_id}", captures: { e6: "$.data.error_id" } }
            - { call: "POST /punch-tickets/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/resolve", payload: { resolution_note: "x" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { e7: "$.data.error_id" } }
            - { call: "POST /warranty-claims/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/review", payload: { decision: "APPROVE" }, as: ManufacturerAdmin, captures: { e8: "$.data.error_id" } }
          assert:
            - "e1 == ERR_DEALER_NOT_FOUND, e2 == ERR_END_USER_NOT_FOUND, e3 == ERR_AGREEMENT_NOT_FOUND, e4 == ERR_PRODUCT_FAMILY_NOT_FOUND"
            - "e5 == ERR_PHASE_NOT_FOUND, e6 == ERR_WINDOW_NOT_FOUND, e7 == ERR_PUNCH_NOT_FOUND, e8 == ERR_CLAIM_NOT_FOUND"

      - name: error_lead_time_violation
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_LEAD_TIME_VIOLATION]"
        excluded_because:
          difficulty_instance: lead_time_max_over_modules_plus_unit_queue_tier
          rationale: "ERR_LEAD_TIME_VIOLATION is the failure leg of the named §1.8 instance (2026-10-22 fails, 2026-10-23 passes)."

      - name: error_spec_not_locked
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_SPEC_NOT_LOCKED]"
        excluded_because:
          difficulty_instance: order_submit_requires_configuration_locked
          rationale: "asserted as the failure path of the named §1.8 instance."

      - name: error_order_not_acknowledged
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_ORDER_NOT_ACKNOWLEDGED]"
        excluded_because:
          difficulty_instance: phase_reserve_requires_order_acknowledged
          rationale: "asserted as the failure path of the named §1.8 instance."

      - name: error_window_conflict
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_WINDOW_CONFLICT]"
        excluded_because:
          difficulty_instance: freight_elevator_exclusive_with_15min_turnover_buffer
          rationale: "the 12:14-start leg of the named §1.8 instance asserts ERR_WINDOW_CONFLICT."

      - name: error_zone_crew_capacity
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_ZONE_CREW_CAPACITY]"
        excluded_because:
          difficulty_instance: zone_crew_aggregate_capacity_across_overlapping_windows
          rationale: "the W_c leg (crew sum 11 > 10) of the named §1.8 instance asserts ERR_ZONE_CREW_CAPACITY."

      - name: error_plant_capacity_exceeded
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_PLANT_CAPACITY_EXCEEDED]"
        excluded_because:
          difficulty_instance: plant_capacity_conserved_across_reserve_and_cancel
          rationale: "the first reserve of order B's phase asserts ERR_PLANT_CAPACITY_EXCEEDED in the named §1.8 instance."

      - name: error_open_critical_punch
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_OPEN_CRITICAL_PUNCH]"
        excluded_because:
          difficulty_instance: zero_open_critical_punches_gate_at_complete
          rationale: "asserted twice (OPEN and RESOLVED legs) in the named §1.8 instance."

      - name: error_product_line_discontinued
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_PRODUCT_LINE_DISCONTINUED]"
        excluded_because:
          difficulty_instance: referential_error_beats_capacity_error_on_reserve_slot
          rationale: "asserted as the winning error of the named §1.8 priority instance."

      - name: error_union_crew_minimum
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_UNION_CREW_MINIMUM]"
        excluded_because:
          difficulty_instance: safety_error_beats_temporal_error_on_window
          rationale: "asserted as the winning error of the named §1.8 priority instance."

      - name: error_punch_create_invalid_state
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_INVALID_STATE]"
        excluded_because:
          difficulty_instance: punch_create_requires_install_in_progress
          rationale: "punch creation against a non-IN_PROGRESS phase is asserted in the named §1.8 instance."

  # ================================================================== rbac ====
  - section: rbac
    instances:
      - name: rbac_dealerrep_cannot_create_dealer
        claim_type: role_denied
        grounds:
          - "roles.DealerRep"
          - "roles.ManufacturerAdmin"
          - "errors[ERR_UNAUTHORIZED_ROLE]"
        distinguishing_aspect: "DealerRep is not in POST /dealers roles -> 403 ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["a dealer exists to authenticate as"]
          setup_api_calls:
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI"], service_capability_level: 4 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
          trigger:
            - { call: "POST /dealers", payload: { name: "Dealer Beta", territory_codes: ["OH"], service_capability_level: 2 }, as: DealerRep, as_user_id: "${dlr_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE and http status 403"

      - name: rbac_enduserrep_cannot_create_configuration
        claim_type: role_denied
        grounds:
          - "roles.EndUserRep"
          - "errors[ERR_UNAUTHORIZED_ROLE]"
        distinguishing_aspect: "EndUserRep is not in POST /configurations roles -> 403."
        test_recipe:
          setup: ["an end user exists to authenticate as"]
          setup_api_calls:
