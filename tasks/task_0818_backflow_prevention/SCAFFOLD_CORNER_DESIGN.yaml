scaffold_corner_design:
- section: entities
  instances:
  - name: connection_create_returns_all_fields
    claim_type: creation
    grounds:
    - entities.ServiceConnection
    - endpoints.POST /service-connections
    distinguishing_aspect: POST /service-connections with all required fields returns 201 with a server-minted id, created_at, version==1, compliance_posture==COMPLIANT and risk_tier==LOW.
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-03-01T00:00:00Z'
        as: UtilityAdmin
      trigger:
      - call: POST /service-connections
        payload:
          account_number: AC-C01
          address: 9 Elm St
          owner_user_id: owner-9
          hazard_class: LOW_HAZARD
        as: UtilityAdmin
        captures:
          cid: $.data.id
      assert:
      - response HTTP status == 201
      - ServiceConnection.${cid}.version == 1
      - ServiceConnection.${cid}.compliance_posture == COMPLIANT
      - ServiceConnection.${cid}.risk_tier == LOW
  - name: device_get_nonexistent_id_returns_not_found
    claim_type: not_found
    grounds:
    - entities.BackflowDevice
    - errors[ERR_DEVICE_NOT_FOUND]
    distinguishing_aspect: GET /devices/{id} with a non-existent UUID returns ERR_DEVICE_NOT_FOUND (404).
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-03-01T00:00:00Z'
        as: UtilityAdmin
      trigger:
      - call: GET /devices/00000000-0000-4000-8000-000000000000
        as: UtilityAdmin
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_DEVICE_NOT_FOUND
      - HTTP status == 404
  - name: device_create_missing_required_serial_returns_validation
    claim_type: required_fields
    grounds:
    - entities.BackflowDevice.fields.serial_number
    - errors[ERR_VALIDATION]
    distinguishing_aspect: POST /devices without serial_number returns ERR_VALIDATION (400).
    test_recipe:
      setup:
      - One connection exists.
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-C02
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
      trigger:
      - call: POST /devices
        payload:
          service_connection_id: ${conn_id}
          device_type: RP
          hazard_rating: HIGH
          install_date: '2026-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_VALIDATION
      - HTTP status == 400
  - name: device_create_invalid_enum_type_returns_validation
    claim_type: type_constraints
    grounds:
    - entities.BackflowDevice.fields.device_type
    - errors[ERR_VALIDATION]
    distinguishing_aspect: POST /devices with device_type not in {RP,DC,PVB,DCDA} returns ERR_VALIDATION (400).
    test_recipe:
      setup:
      - One connection exists.
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-C03
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
      trigger:
      - call: POST /devices
        payload:
          service_connection_id: ${conn_id}
          serial_number: SN-C03
          device_type: XYZ
          hazard_rating: HIGH
          install_date: '2026-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_VALIDATION
      - HTTP status == 400
  - name: device_next_due_date_computed_from_install
    claim_type: computed_fields
    grounds:
    - entities.BackflowDevice.fields.next_test_due_date
    - calculations.device_next_test_due_date
    distinguishing_aspect: On create with install_date 2025-03-01 and interval 12, next_test_due_date is computed to 2026-03-01 (from_install) in the creation response; any client-sent value is ignored.
    test_recipe:
      setup:
      - One connection exists.
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-C04
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
      trigger:
      - call: POST /devices
        payload:
          service_connection_id: ${conn_id}
          serial_number: SN-C04
          device_type: RP
          hazard_rating: HIGH
          test_interval_months: 12
          install_date: '2025-03-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          due: $.data.next_test_due_date
      assert:
      - BackflowDevice next_test_due_date == 2026-03-01T00:00:00Z (install + 12 months)
  - name: connection_list_returns_pagination_envelope
    claim_type: listing
    grounds:
    - endpoints.GET /service-connections
    - response_envelope.pagination_fields
    distinguishing_aspect: GET /service-connections returns an array response with total_count and has_more after two connections are created.
    test_recipe:
      setup:
      - Two connections exist.
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-C05A
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
      - call: POST /service-connections
        payload:
          account_number: AC-C05B
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn2_id: $.data.id
      trigger:
      - call: GET /service-connections
        as: UtilityAdmin
      assert:
      - response_type == array
      - meta/pagination total_count >= 2
- section: state_machines
  instances:
  - name: accept_already_accepted_report_returns_report_not_pending
    claim_type: invalid_transition
    grounds:
    - state_machines.TestReport.SUBMITTED_to_ACCEPTED
    - errors[ERR_REPORT_NOT_PENDING]
    distinguishing_aspect: Accepting a TestReport that is already ACCEPTED returns ERR_REPORT_NOT_PENDING (409); no side effect re-fires.
    test_recipe:
      setup:
      - A PASS report accepted once (status ACCEPTED).
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-C06
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
      - call: POST /devices
        payload:
          service_connection_id: ${conn_id}
          serial_number: SN-C06
          device_type: RP
          hazard_rating: HIGH
          test_interval_months: 12
          install_date: '2026-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          dev_id: $.data.id
      - call: POST /testers
        payload:
          name: Jane Tester
          certification_number: CN-C06
          cert_effective_date: '2025-01-01T00:00:00Z'
          cert_expiry_date: '2027-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          tester_id: $.data.id
      - call: POST /test-reports
        payload:
          device_id: ${dev_id}
          tester_id: ${tester_id}
          test_date: '2026-02-20T00:00:00Z'
          relief_valve_differential_psid: 2.5
          check_valve_1_psid: 1.5
        as: Tester
        as_user_id: ${tester_id}
        captures:
          report_id: $.data.id
      - call: POST /test-reports/${report_id}/accept
        payload: {}
        as: UtilityAdmin
      trigger:
      - call: POST /test-reports/${report_id}/accept
        payload: {}
        as: UtilityAdmin
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_REPORT_NOT_PENDING
      - HTTP status == 409
  - name: cancel_already_cancelled_appointment_returns_not_booked
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.TestAppointment.BOOKED_to_CANCELLED
    - errors[ERR_APPOINTMENT_NOT_BOOKED]
    distinguishing_aspect: Cancelling a CANCELLED appointment returns ERR_APPOINTMENT_NOT_BOOKED (409) — terminal lockdown.
    test_recipe:
      setup:
      - An appointment booked then cancelled.
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-C07
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
      - call: POST /devices
        payload:
          service_connection_id: ${conn_id}
          serial_number: SN-C07
          device_type: RP
          hazard_rating: HIGH
          test_interval_months: 12
          install_date: '2026-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          dev_id: $.data.id
      - call: POST /testers
        payload:
          name: Jane Tester
          certification_number: CN-C07
          cert_effective_date: '2025-01-01T00:00:00Z'
          cert_expiry_date: '2027-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          tester_id: $.data.id
      - call: POST /test-appointments
        payload:
          device_id: ${dev_id}
          tester_id: ${tester_id}
          scheduled_start: '2026-04-20T09:00:00Z'
          scheduled_end: '2026-04-20T10:00:00Z'
        as: Tester
        as_user_id: ${tester_id}
        captures:
          appt_id: $.data.id
      - call: POST /test-appointments/${appt_id}/cancel
        payload: {}
        as: Tester
        as_user_id: ${tester_id}
      trigger:
      - call: POST /test-appointments/${appt_id}/cancel
        payload: {}
        as: Tester
        as_user_id: ${tester_id}
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_APPOINTMENT_NOT_BOOKED
      - HTTP status == 409
  - name: device_initial_state_is_active
    claim_type: initial_state
    grounds:
    - state_machines.BackflowDevice
    - entities.BackflowDevice.fields.status
    distinguishing_aspect: A newly created BackflowDevice has status == ACTIVE in the creation response.
    test_recipe:
      setup:
      - One connection exists.
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-C08
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
      trigger:
      - call: POST /devices
        payload:
          service_connection_id: ${conn_id}
          serial_number: SN-C08
          device_type: DC
          hazard_rating: LOW
          install_date: '2026-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          st: $.data.status
      assert:
      - BackflowDevice status == ACTIVE
  - name: rescind_already_rescinded_notice_returns_not_issued
    claim_type: idempotency
    grounds:
    - state_machines.ShutoffNotice.ISSUED_to_RESCINDED
    - errors[ERR_NOTICE_NOT_ISSUED]
    distinguishing_aspect: Rescinding a RESCINDED notice a second time returns ERR_NOTICE_NOT_ISSUED (409) — the operation is not idempotent-success.
    test_recipe:
      setup:
      - A notice issued then rescinded on a device-free connection.
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-C09
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
      - call: POST /shutoff-notices
        payload:
          service_connection_id: ${conn_id}
          reason: OVERDUE_TEST
        as: UtilityAdmin
        captures:
          notice_id: $.data.id
      - call: POST /shutoff-notices/${notice_id}/rescind
        payload: {}
        as: UtilityAdmin
      trigger:
      - call: POST /shutoff-notices/${notice_id}/rescind
        payload: {}
        as: UtilityAdmin
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_NOTICE_NOT_ISSUED
      - HTTP status == 409
- section: validations
  instances:
  - name: appointment_end_not_after_start_returns_time_range
    claim_type: violation_to_error
    grounds:
    - validations[priority=9]
    - errors[ERR_INVALID_TIME_RANGE]
    distinguishing_aspect: POST /test-appointments with scheduled_end <= scheduled_start returns ERR_INVALID_TIME_RANGE (400).
    test_recipe:
      setup:
      - Connection, device and tester exist.
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-C10
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
      - call: POST /devices
        payload:
          service_connection_id: ${conn_id}
          serial_number: SN-C10
          device_type: RP
          hazard_rating: HIGH
          test_interval_months: 12
          install_date: '2026-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          dev_id: $.data.id
      - call: POST /testers
        payload:
          name: Jane Tester
          certification_number: CN-C10
          cert_effective_date: '2025-01-01T00:00:00Z'
          cert_expiry_date: '2027-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          tester_id: $.data.id
      trigger:
      - call: POST /test-appointments
        payload:
          device_id: ${dev_id}
          tester_id: ${tester_id}
          scheduled_start: '2026-04-21T10:00:00Z'
          scheduled_end: '2026-04-21T09:00:00Z'
        as: Tester
        as_user_id: ${tester_id}
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_INVALID_TIME_RANGE
      - HTTP status == 400
  - name: duplicate_serial_number_returns_conflict
    claim_type: violation_to_error
    grounds:
    - validations[priority=13]
    - errors[ERR_DUPLICATE_VALUE]
    distinguishing_aspect: POST /devices reusing an existing serial_number returns ERR_DUPLICATE_VALUE (409).
    test_recipe:
      setup:
      - Connection with a device serial SN-C11 already registered.
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-C11
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
      - call: POST /devices
        payload:
          service_connection_id: ${conn_id}
          serial_number: SN-C11
          device_type: RP
          hazard_rating: HIGH
          test_interval_months: 12
          install_date: '2026-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          dev_id: $.data.id
      trigger:
      - call: POST /devices
        payload:
          service_connection_id: ${conn_id}
          serial_number: SN-C11
          device_type: DC
          hazard_rating: LOW
          install_date: '2026-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_DUPLICATE_VALUE
      - HTTP status == 409
  - name: complete_replacement_without_serial_returns_required
    claim_type: violation_to_error
    grounds:
    - validations[priority=12]
    - errors[ERR_REPLACEMENT_SERIAL_REQUIRED]
    distinguishing_aspect: Completing a REPLACEMENT order with no replacement_serial_number returns ERR_REPLACEMENT_SERIAL_REQUIRED (422).
    test_recipe:
      setup:
      - Device in NEEDS_REPAIR with an OPEN REPLACEMENT order lacking a serial.
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-C12
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
      - call: POST /devices
        payload:
          service_connection_id: ${conn_id}
          serial_number: SN-C12
          device_type: RP
          hazard_rating: HIGH
          test_interval_months: 12
          install_date: '2026-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          dev_id: $.data.id
      - call: POST /testers
        payload:
          name: Jane Tester
          certification_number: CN-C12
          cert_effective_date: '2025-01-01T00:00:00Z'
          cert_expiry_date: '2027-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          tester_id: $.data.id
      - call: POST /test-reports
        payload:
          device_id: ${dev_id}
          tester_id: ${tester_id}
          test_date: '2026-02-20T00:00:00Z'
          relief_valve_differential_psid: 1.5
          check_valve_1_psid: 1.5
        as: Tester
        as_user_id: ${tester_id}
        captures:
          report_id: $.data.id
      - call: POST /test-reports/${report_id}/accept
        payload: {}
        as: UtilityAdmin
      - call: POST /repair-orders
        payload:
          device_id: ${dev_id}
          order_type: REPLACEMENT
          description: replace assembly
        as: UtilityAdmin
        captures:
          order_id: $.data.id
      trigger:
      - call: POST /repair-orders/${order_id}/complete
        payload: {}
        as: UtilityAdmin
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_REPLACEMENT_SERIAL_REQUIRED
      - HTTP status == 422
  - name: enforce_issued_notice_before_due_returns_not_due
    claim_type: violation_to_error
    grounds:
    - validations[priority=8]
    - errors[ERR_ENFORCEMENT_NOT_DUE]
    distinguishing_aspect: Enforcing a still-ISSUED notice before current_utc reaches enforcement_due_date returns ERR_ENFORCEMENT_NOT_DUE (409) — the pure temporal path (state precondition satisfied).
    test_recipe:
      setup:
      - LOW-risk connection; notice issued 2026-03-01 with enforcement_due 2026-03-31; clock stays 2026-03-01.
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-C13
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
      - call: POST /shutoff-notices
        payload:
          service_connection_id: ${conn_id}
          reason: OVERDUE_TEST
        as: UtilityAdmin
        captures:
          notice_id: $.data.id
      trigger:
      - call: POST /shutoff-notices/${notice_id}/enforce
        payload: {}
        as: UtilityAdmin
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_ENFORCEMENT_NOT_DUE
      - HTTP status == 409
  - name: rescind_blocked_while_device_needs_repair
    claim_type: violation_to_error
    grounds:
    - validations[priority=7]
    - errors[ERR_NOTICE_RESCIND_BLOCKED]
    distinguishing_aspect: Rescinding the auto-issued notice while the device is still NEEDS_REPAIR returns ERR_NOTICE_RESCIND_BLOCKED (409).
    test_recipe:
      setup:
      - FAIL accept left the device NEEDS_REPAIR and a FAILED_TEST notice ISSUED; no repair yet.
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-C14
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
      - call: POST /devices
        payload:
          service_connection_id: ${conn_id}
          serial_number: SN-C14
          device_type: RP
          hazard_rating: HIGH
          test_interval_months: 12
          install_date: '2026-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          dev_id: $.data.id
      - call: POST /testers
        payload:
          name: Jane Tester
          certification_number: CN-C14
          cert_effective_date: '2025-01-01T00:00:00Z'
          cert_expiry_date: '2027-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          tester_id: $.data.id
      - call: POST /test-reports
        payload:
          device_id: ${dev_id}
          tester_id: ${tester_id}
          test_date: '2026-02-20T00:00:00Z'
          relief_valve_differential_psid: 1.5
          check_valve_1_psid: 1.5
        as: Tester
        as_user_id: ${tester_id}
        captures:
          report_id: $.data.id
      - call: POST /test-reports/${report_id}/accept
        payload: {}
        as: UtilityAdmin
      - call: GET /shutoff-notices
        as: UtilityAdmin
        captures:
          notice_id: $.data[0].id
      trigger:
      - call: POST /shutoff-notices/${notice_id}/rescind
        payload: {}
        as: UtilityAdmin
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_NOTICE_RESCIND_BLOCKED
      - HTTP status == 409
  - name: remove_already_removed_device_returns_not_removable
    claim_type: violation_to_error
    grounds:
    - validations[priority=4]
    - errors[ERR_DEVICE_NOT_REMOVABLE]
    distinguishing_aspect: Removing a device that is already REMOVED returns ERR_DEVICE_NOT_REMOVABLE (409).
    test_recipe:
      setup:
      - A device created then removed.
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-C15
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
      - call: POST /devices
        payload:
          service_connection_id: ${conn_id}
          serial_number: SN-C15
          device_type: RP
          hazard_rating: HIGH
          test_interval_months: 12
          install_date: '2026-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          dev_id: $.data.id
      - call: POST /devices/${dev_id}/remove
        payload: {}
        as: UtilityAdmin
      trigger:
      - call: POST /devices/${dev_id}/remove
        payload: {}
        as: UtilityAdmin
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_DEVICE_NOT_REMOVABLE
      - HTTP status == 409
  - name: restore_non_shutoff_connection_returns_not_shutoff
    claim_type: violation_to_error
    grounds:
    - validations[priority=4]
    - errors[ERR_NOT_SHUTOFF]
    distinguishing_aspect: Restoring a COMPLIANT connection (not in SHUTOFF) returns ERR_NOT_SHUTOFF (409).
    test_recipe:
      setup:
      - A fresh COMPLIANT connection.
      setup_api_calls:
      - call: POST /service-connections
        payload:
          account_number: AC-C16
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
      trigger:
      - call: POST /service-connections/${conn_id}/restore
        payload: {}
        as: UtilityAdmin
        captures:
          err: $.data.error_id
      assert:
      - response error_id == ERR_NOT_SHUTOFF
      - HTTP status == 409
- section: endpoints
  instances:
  - name: utility_report_counts_populated_pool
    claim_type: computed_read
    grounds:
    - endpoints.GET /utility-report
    - calculations.utility_report_aggregate
    distinguishing_aspect: With one COMPLIANT connection, GET /utility-report returns total_connections 1, compliant_count 1, non_compliant_count 0, compliance_rate 100.00.
    test_recipe:
      setup:
      - Exactly one connection with no devices (COMPLIANT).
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-03-01T00:00:00Z'
        as: UtilityAdmin
      - call: POST /service-connections
        payload:
          account_number: AC-C17
          address: 1 Main St
          owner_user_id: owner-1
          hazard_class: HIGH_HAZARD
        as: UtilityAdmin
        captures:
          conn_id: $.data.id
      trigger:
      - call: GET /utility-report
        as: UtilityAdmin
        captures:
          cc: $.data.compliant_count
          tc: $.data.total_connections
      assert:
      - total_connections == 1
      - compliant_count == 1
      - non_compliant_count == 0
      - compliance_rate == 100.00
  - name: tester_suspend_then_reinstate_restores_active
    claim_type: action_endpoint
    grounds:
    - state_machines.Tester.ACTIVE_to_SUSPENDED
    - state_machines.Tester.SUSPENDED_to_ACTIVE
    distinguishing_aspect: POST /testers/{id}/suspend then /reinstate returns the tester to status ACTIVE while the certification is still valid.
    test_recipe:
      setup:
      - A tester suspended.
      setup_api_calls:
      - call: POST /testers
        payload:
          name: Jane Tester
          certification_number: CN-C18
          cert_effective_date: '2025-01-01T00:00:00Z'
          cert_expiry_date: '2027-01-01T00:00:00Z'
        as: UtilityAdmin
        captures:
          tester_id: $.data.id
      - call: POST /testers/${tester_id}/suspend
        payload: {}
        as: UtilityAdmin
      trigger:
      - call: POST /testers/${tester_id}/reinstate
        payload: {}
        as: UtilityAdmin
        captures:
          st: $.data.status
      assert:
      - Tester.${tester_id}.status == ACTIVE
