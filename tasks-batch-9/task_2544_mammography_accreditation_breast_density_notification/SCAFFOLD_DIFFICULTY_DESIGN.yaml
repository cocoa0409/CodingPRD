              as: Technologist
              as_user_id: "${tech_id}"
              captures: { mm_a_id: $.data.id }
            - call: "POST /exams/${mm_a_id}/interpret"
              payload: { birads_assessment: 1, density_category: "B" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-9202", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-03T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { mm_b_id: $.data.id }
            - call: "POST /exams/${mm_b_id}/interpret"
              payload: { birads_assessment: 1, density_category: "B" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams"
              payload: { unit_id: "${unit2_id}", technologist_id: "${tech_id}", patient_ref: "PT-9203", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-04T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { mm_c_id: $.data.id }
            - call: "POST /exams/${mm_c_id}/interpret"
              payload: { birads_assessment: 1, density_category: "B" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams"
              payload: { unit_id: "${unit2_id}", technologist_id: "${tech_id}", patient_ref: "PT-9204", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-05T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { mm_d_id: $.data.id }
            - call: "POST /exams/${mm_d_id}/interpret"
              payload: { birads_assessment: 1, density_category: "B" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { mm_u_v1: $.data.version }
            - call: "POST /units/${unit_id}/clinical-image-reviews"
              payload: { exam_ids: ["${mm_a_id}", "${mm_b_id}"], expected_unit_version: "${mm_u_v1}", reviewer_note: "Initial accreditation packet" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { mm_sub_id: $.data.id }
            - call: "POST /clinical-image-reviews/${mm_sub_id}/review"
              payload: { decision: "PASS", reviewer_note: "Meets clinical image quality criteria" }
              as: AccreditationBodyReviewer
              as_user_id: "reviewer-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2029-08-01T00:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { mm_u_v2: $.data.version }
          trigger:
            - call: "POST /units/${unit_id}/clinical-image-reviews"
              payload: { exam_ids: ["${mm_c_id}", "${mm_d_id}"], expected_unit_version: "${mm_u_v2}", reviewer_note: "Reaccreditation packet built from the wrong unit" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          assert:
            - "HTTP status == 422"
            - "error_id == \"ERR_EXAM_UNIT_MISMATCH\""
            - "error_id != \"ERR_REACCREDITATION_WINDOW_CLOSED\""
            - "MammographyUnit.${unit_id}.accreditation_expires_on == \"2029-07-31T00:00:00Z\""
            - "MammographyUnit.${unit_id}.reaccreditation_attempts_remaining == 3 — no attempt was consumed"
            - "Facility.${fac_id}.prepaid_credit_cents == 750000 and fee_held_cents == 0 and fee_consumed_cents == 250000 — no new escrow was taken"

      - name: open_level_1_finding_outranks_insufficient_prepaid_credit
        grounds:
