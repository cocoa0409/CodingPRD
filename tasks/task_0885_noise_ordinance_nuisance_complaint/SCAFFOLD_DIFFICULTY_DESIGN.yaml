            - { call: "POST /complaints/${a1}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${a1}/inspections", payload: { measured_decibel: 80, measured_at: "2026-05-10T12:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${a1}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1" }
            - { call: "POST /complaints", payload: { property_id: "${propA}", reported_at: "2026-05-11T12:00:00Z", noise_type: "AMPLIFIED_MUSIC" }, as: CodeOfficer, captures: { a2: "$.data.id" } }
            - { call: "POST /complaints/${a2}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${a2}/inspections", payload: { measured_decibel: 80, measured_at: "2026-05-11T12:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${a2}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1", captures: { enfA: "$.data.id" } }
            - { call: "POST /enforcements/${enfA}/contest", payload: {}, as: Resident }
            - { call: "POST /properties", payload: { address: "17 B St", zoning_type: "COMMERCIAL" }, as: CodeOfficer, captures: { propB: "$.data.id" } }
            - { call: "POST /complaints", payload: { property_id: "${propB}", reported_at: "2026-05-10T12:00:00Z", noise_type: "AMPLIFIED_MUSIC" }, as: CodeOfficer, captures: { b1: "$.data.id" } }
            - { call: "POST /complaints/${b1}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${b1}/inspections", payload: { measured_decibel: 80, measured_at: "2026-05-10T12:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${b1}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1" }
            - { call: "POST /complaints", payload: { property_id: "${propB}", reported_at: "2026-05-11T12:00:00Z", noise_type: "AMPLIFIED_MUSIC" }, as: CodeOfficer, captures: { b2: "$.data.id" } }
            - { call: "POST /complaints/${b2}/review", payload: {}, as: CodeOfficer }
            - { call: "POST /complaints/${b2}/inspections", payload: { measured_decibel: 80, measured_at: "2026-05-11T12:00:00Z" }, as: CodeOfficer }
            - { call: "POST /complaints/${b2}/substantiate", payload: {}, as: CodeOfficer, as_user_id: "officer-1", captures: { enfB: "$.data.id" } }
            - { call: "POST /enforcements/${enfB}/contest", payload: {}, as: Resident }
            - { call: "POST /enforcements/${enfA}/hearings", payload: { scheduled_at: "2026-05-20T10:00:00Z", hearing_officer_id: "hof-9", duration_minutes: 30 }, as: HearingOfficer, captures: { hearA: "$.data.id" } }
          trigger:
            - { call: "POST /enforcements/${enfB}/hearings", payload: { scheduled_at: "2026-05-20T10:45:00Z", hearing_officer_id: "hof-9", duration_minutes: 30 }, as: HearingOfficer, captures: { err: "$.data.error_id" } }
            - { call: "POST /enforcements/${enfB}/hearings", payload: { scheduled_at: "2026-05-20T12:00:00Z", hearing_officer_id: "hof-9", duration_minutes: 30 }, as: HearingOfficer, captures: { hearB: "$.data.id" } }
          assert:
