# =============================================================================
# Bookstore — Scaffold Difficulty Design (§1.8 Test Targeting Index)
# 9 rules x 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml §1.1-§1.7.
# All formula-derived asserts are literals computed against §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: special_order_quote_distributor_vs_pod_diverge
        grounds:
          - calculations.special_order_quote
          - state_machines.SpecialOrder.DRAFT_to_QUOTED
          - entities.SpecialOrder.fields.quoted_unit_cents
        distinguishing_aspect: |
          Same Title (list_price_cents=2000), two fulfillment methods on the SpecialOrder
          domain: DISTRIBUTOR quotes 2000 cents / 7-day ETA; POD quotes 2400 cents / 3-day ETA.
          The two valid variants of one calc produce different numbers on identical title data.
        test_recipe:
          setup:
            - "Clock at default 2026-01-01T00:00:00Z."
            - "Title T (list_price_cents=2000, pod_eligible=true) exists."
            - "Member M registered."
            - "Two special orders for T: SO_dist (DISTRIBUTOR), SO_pod (POD)."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn13: "9780000000001", name: "T", list_price_cents: 2000, pod_eligible: true }
              as: Bookseller
              captures: { t_id: $.data.id }
            - call: "POST /special-orders"
              payload: { member_id: "${m_id}", title_id: "${t_id}", quantity: 1, fulfillment_method: "DISTRIBUTOR" }
              as: Member
              as_user_id: "${m_id}"
              captures: { so_dist_id: $.data.id }
            - call: "POST /special-orders"
              payload: { member_id: "${m_id}", title_id: "${t_id}", quantity: 1, fulfillment_method: "POD" }
              as: Member
              as_user_id: "${m_id}"
              captures: { so_pod_id: $.data.id }
          trigger:
            - call: "POST /special-orders/${so_dist_id}/quote"
              payload: {}
              as: Bookseller
              captures: { dist_unit: $.data.quoted_unit_cents }
            - call: "POST /special-orders/${so_pod_id}/quote"
              payload: {}
              as: Bookseller
              captures: { pod_unit: $.data.quoted_unit_cents }
          assert:
            - "SpecialOrder.${so_dist_id}.quoted_unit_cents == 2000"
            - "SpecialOrder.${so_pod_id}.quoted_unit_cents == 2400"
            - "SpecialOrder.${so_dist_id}.promised_eta == 2026-01-08T00:00:00.000Z"
            - "SpecialOrder.${so_pod_id}.promised_eta == 2026-01-04T00:00:00.000Z"

      - name: loyalty_provisional_stored_only_vs_final_credited
        grounds:
          - calculations.loyalty_points
          - state_machines.SalesOrder.UNPAID_to_PAID
          - state_machines.SalesOrder.RESERVED_to_FULFILLED
          - entities.Member.fields.loyalty_points
        distinguishing_aspect: |
          On the SalesOrder/Member domain, the provisional variant stores points_provisional=50
          at PAY without crediting Member.loyalty_points (stays 0); the final variant awards the
          same 50 to Member.loyalty_points only at FULFILL. Different entity domain than instance 1
          (Member balance side-effect, not SpecialOrder pricing).
        test_recipe:
          setup:
            - "Member M (REGULAR), Title T (list 2500) with >=2 AVAILABLE stock items."
            - "Order O with one line of quantity 2 (subtotal 5000)."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "m2@x.com", full_name: "M Two", tier: "REGULAR" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn13: "9780000000002", name: "T2", list_price_cents: 2500 }
              as: Bookseller
              captures: { t_id: $.data.id }
            - call: "POST /titles/${t_id}/stock-items"
              payload: { quantity: 2 }
              as: Bookseller
            - call: "POST /sales-orders"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id }
            - call: "POST /sales-orders/${o_id}/lines"
              payload: { title_id: "${t_id}", quantity: 2 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /sales-orders/${o_id}/pay"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { v_after_pay: $.data.version }
          trigger:
            - call: "POST /sales-orders/${o_id}/reserve"
              payload: { expected_sales_order_version: "${v_after_pay}" }
              as: Bookseller
              captures: { v_after_reserve: $.data.version }
            - call: "POST /sales-orders/${o_id}/fulfill"
              payload: {}
              as: Bookseller
          assert:
            - "SalesOrder.${o_id}.points_provisional == 50"
            - "SalesOrder.${o_id}.points_final == 50"
            - "Member.${m_id}.loyalty_points == 50"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: buyback_offer_per_line_round_then_sum
        grounds:
          - calculations.buyback_offer
          - state_machines.BuybackTransaction.PENDING_to_OFFERED
          - entities.BuybackTransaction.fields.offer_total_cents
        distinguishing_aspect: |
          Mode (b) nested-rounding-order: per-copy offers are round_half_up FIRST then summed.
          Line1 (list 2499, LIKE_NEW, HIGH) -> 1000; Line2 (list 1599, GOOD, NORMAL) -> 336;
          total 1336. The forbidden 'sum-raw-then-round-once' would give 1335 — the scaffold pins
          per-line rounding, so 1336 is the only correct total.
        test_recipe:
          setup:
            - "Member M; Title A (list 2499, demand HIGH); Title B (list 1599, demand NORMAL)."
            - "Buyback B with two lines: A LIKE_NEW q1, B GOOD q1."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "m3@x.com", full_name: "M Three" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn13: "9780000000003", name: "A", list_price_cents: 2499, demand_flag: "HIGH" }
              as: Bookseller
              captures: { ta_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn13: "9780000000004", name: "B", list_price_cents: 1599, demand_flag: "NORMAL" }
              as: Bookseller
              captures: { tb_id: $.data.id }
            - call: "POST /buybacks"
              payload: { member_id: "${m_id}" }
              as: Bookseller
              captures: { bb_id: $.data.id }
            - call: "POST /buybacks/${bb_id}/lines"
              payload: { title_id: "${ta_id}", condition_grade: "LIKE_NEW", quantity: 1 }
              as: Bookseller
            - call: "POST /buybacks/${bb_id}/lines"
              payload: { title_id: "${tb_id}", condition_grade: "GOOD", quantity: 1 }
              as: Bookseller
          trigger:
            - call: "POST /buybacks/${bb_id}/offer"
              payload: {}
              as: Bookseller
          assert:
            - "BuybackTransaction.${bb_id}.offer_total_cents == 1336"
            - "BuybackTransaction.${bb_id}.state == OFFERED"

      - name: ticket_price_surcharge_then_discount_nonlinear
        grounds:
          - calculations.ticket_price
          - entities.EventTicket.fields.price_paid_cents
          - entities.Title.fields.demand_flag
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear pinned-order: price = (base 2000) + HIGH-surcharge(500) then
          minus GOLD-discount computed on the post-surcharge gross (2500*0.05=125) -> 2375. Inputs
          interact (demand_flag, member.tier, base_price); evaluating discount on base instead of on
          gross would give a different number. Different mode (a) than instance 1's mode (b).
        test_recipe:
          setup:
            - "Clock default 2026-01-01. Title T (demand HIGH). GOLD member M."
            - "Future event E (starts 2026-02-01) base_price 2000, capacity 10."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "m4@x.com", full_name: "M Four", tier: "GOLD" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn13: "9780000000005", name: "T", list_price_cents: 3000, demand_flag: "HIGH" }
              as: Bookseller
              captures: { t_id: $.data.id }
            - call: "POST /author-events"
              payload: { title_id: "${t_id}", name: "Signing", starts_at: "2026-02-01T18:00:00Z", capacity: 10, base_price_cents: 2000 }
              as: Bookseller
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /author-events/${e_id}/tickets"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { tk_id: $.data.id }
          assert:
            - "EventTicket.${tk_id}.price_paid_cents == 2375"
            - "EventTicket.${tk_id}.state == BOOKED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: sales_order_parallel_payment_x_fulfillment_axes
        grounds:
          - state_machines.SalesOrder.UNPAID_to_PAID
          - state_machines.SalesOrder.OPEN_to_RESERVED
          - entities.SalesOrder.fields.payment_status
          - entities.SalesOrder.fields.fulfillment_status
        distinguishing_aspect: |
          SalesOrder carries two independent state axes: paying flips payment_status UNPAID->PAID
          while fulfillment_status stays OPEN; reserving then flips fulfillment_status OPEN->RESERVED
          while payment_status stays PAID. Parallel dimensions on one entity (not a linear pipeline).
        test_recipe:
          setup:
            - "Member M, Title T with 1 AVAILABLE stock item, Order O with one line q1."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "m5@x.com", full_name: "M Five" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn13: "9780000000006", name: "T", list_price_cents: 1000 }
              as: Bookseller
              captures: { t_id: $.data.id }
            - call: "POST /titles/${t_id}/stock-items"
              payload: { quantity: 1 }
              as: Bookseller
            - call: "POST /sales-orders"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id }
            - call: "POST /sales-orders/${o_id}/lines"
              payload: { title_id: "${t_id}", quantity: 1 }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /sales-orders/${o_id}/pay"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { v_pay: $.data.version }
            - call: "POST /sales-orders/${o_id}/reserve"
              payload: { expected_sales_order_version: "${v_pay}" }
              as: Bookseller
          assert:
            - "SalesOrder.${o_id}.payment_status == PAID"
            - "SalesOrder.${o_id}.fulfillment_status == RESERVED"

      - name: special_order_quoted_to_draft_revision_cycle
        grounds:
          - state_machines.SpecialOrder.DRAFT_to_QUOTED
          - state_machines.SpecialOrder.QUOTED_to_DRAFT
          - entities.SpecialOrder.fields.revision_count
        distinguishing_aspect: |
          SpecialOrder cycles QUOTED->DRAFT (revise) and back DRAFT->QUOTED, a true loop on a
          different entity than instance 1; each revise increments revision_count (0->1->2), and
          quoted_unit_cents is cleared on the way back.
        test_recipe:
          setup:
            - "Title T (list 2000), Member M, SpecialOrder SO (DISTRIBUTOR) in DRAFT."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "m6@x.com", full_name: "M Six" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn13: "9780000000007", name: "T", list_price_cents: 2000 }
              as: Bookseller
              captures: { t_id: $.data.id }
            - call: "POST /special-orders"
              payload: { member_id: "${m_id}", title_id: "${t_id}", quantity: 1, fulfillment_method: "DISTRIBUTOR" }
              as: Member
              as_user_id: "${m_id}"
              captures: { so_id: $.data.id }
            - call: "POST /special-orders/${so_id}/quote"
              payload: {}
              as: Bookseller
          trigger:
            - call: "POST /special-orders/${so_id}/revise"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /special-orders/${so_id}/quote"
              payload: {}
              as: Bookseller
            - call: "POST /special-orders/${so_id}/revise"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "SpecialOrder.${so_id}.state == DRAFT"
            - "SpecialOrder.${so_id}.revision_count == 2"
            - "SpecialOrder.${so_id}.quoted_unit_cents == null"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: fulfill_to_consignment_sold_to_agreement_counters
        grounds:
          - state_machines.SalesOrder.RESERVED_to_FULFILLED
          - state_machines.ConsignmentCopy.ON_SHELF_to_SOLD
          - entities.ConsignmentAgreement.fields.units_sold_to_date
          - entities.ConsignmentAgreement.fields.total_payout_cents
        distinguishing_aspect: |
          Depth-3 cascade from SalesOrder fulfill: (1) fulfill flips the reserved StockItem to SOLD;
          (2) because that StockItem is CONSIGNMENT-sourced, its ConsignmentCopy transitions
          ON_SHELF->SOLD; (3) that copy-sale bumps ConsignmentAgreement.units_sold_to_date 0->1 and
          total_payout_cents by payout(2000,u=0)=1200. Each link is caused by the previous link.
        test_recipe:
          setup:
            - "Local-author member AU (is_local_author). Buyer member M. Title T."
            - "ACTIVE agreement AG (AU,T) with one ON_SHELF copy (sale_price 2000) and its backing CONSIGNMENT StockItem AVAILABLE."
            - "Order O with one line of T q1, paid; reserve picks the consignment copy (only stock)."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "au@x.com", full_name: "Author", is_local_author: true }
              as: Anonymous
              captures: { au_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m7@x.com", full_name: "Buyer" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn13: "9780000000008", name: "T", list_price_cents: 2000 }
              as: InventoryManager
              captures: { t_id: $.data.id }
            - call: "POST /consignment-agreements"
              payload: { author_member_id: "${au_id}", title_id: "${t_id}" }
              as: InventoryManager
              captures: { ag_id: $.data.id }
            - call: "POST /consignment-agreements/${ag_id}/copies"
              payload: { sale_price_cents: 2000 }
              as: InventoryManager
            - call: "POST /sales-orders"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id }
            - call: "POST /sales-orders/${o_id}/lines"
              payload: { title_id: "${t_id}", quantity: 1 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /sales-orders/${o_id}/pay"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { v_pay: $.data.version }
            - call: "POST /sales-orders/${o_id}/reserve"
              payload: { expected_sales_order_version: "${v_pay}" }
              as: Bookseller
          trigger:
            - call: "POST /sales-orders/${o_id}/fulfill"
              payload: {}
              as: Bookseller
          assert:
            - "ConsignmentAgreement.${ag_id}.units_sold_to_date == 1"
            - "ConsignmentAgreement.${ag_id}.total_payout_cents == 1200"

      - name: event_cancel_to_tickets_refunded_to_member_credit
        grounds:
          - state_machines.AuthorEvent.SCHEDULED_to_CANCELLED
          - state_machines.EventTicket.BOOKED_to_REFUNDED
          - entities.CreditLedgerEntry.fields.delta_cents
          - entities.Member.fields.store_credit_cents
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (AuthorEvent cancel): (1) cancel transitions each
          BOOKED EventTicket BOOKED->REFUNDED; (2) each refund appends a CreditLedgerEntry of
          +price_paid_cents and recomputes the holder Member.store_credit_cents. Distinct propagation
          pattern from the fulfill cascade.
        test_recipe:
          setup:
            - "Clock default. REGULAR member M, NORMAL-demand Title T, future event E (capacity 5, base 2000)."
            - "M holds one BOOKED ticket at price 2000; M.store_credit_cents starts 0."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "m8@x.com", full_name: "M Eight", tier: "REGULAR" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn13: "9780000000009", name: "T", list_price_cents: 1500, demand_flag: "NORMAL" }
              as: Bookseller
              captures: { t_id: $.data.id }
            - call: "POST /author-events"
              payload: { title_id: "${t_id}", name: "Reading", starts_at: "2026-03-01T18:00:00Z", capacity: 5, base_price_cents: 2000 }
              as: Bookseller
              captures: { e_id: $.data.id }
            - call: "POST /author-events/${e_id}/tickets"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { tk_id: $.data.id }
          trigger:
            - call: "POST /author-events/${e_id}/cancel"
              payload: {}
              as: Bookseller
          assert:
            - "EventTicket.${tk_id}.state == REFUNDED"
            - "Member.${m_id}.store_credit_cents == 2000"
            - "AuthorEvent.${e_id}.tickets_sold == 0"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: reserve_insufficient_stock_beats_stale_version
        grounds:
          - validations[priority=12]
          - validations[priority=15]
          - state_machines.SalesOrder.OPEN_to_RESERVED
        distinguishing_aspect: |
          On reserve a request both carries a stale expected_sales_order_version AND requests more
          copies than AVAILABLE. business_safety (ERR_INSUFFICIENT_STOCK, prio 12) is checked before
          business_constraint OCC (ERR_STALE_VERSION, prio 15)? No — pin: OCC stale-version (prio 15)
          is evaluated; here the test pins INSUFFICIENT_STOCK wins because priority 12 < 15. Category
          pair: business_safety vs business_constraint.
        test_recipe:
          setup:
            - "Member M, Title T with exactly 1 AVAILABLE copy, Order O with a line of q2 (needs 2)."
            - "Client observed O.version, then O.version advanced via a no-op? Use a line add to bump version."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "m9@x.com", full_name: "M Nine" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn13: "9780000000010", name: "T", list_price_cents: 1000 }
              as: Bookseller
              captures: { t_id: $.data.id }
            - call: "POST /titles/${t_id}/stock-items"
              payload: { quantity: 1 }
              as: Bookseller
            - call: "POST /sales-orders"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id, v0: $.data.version }
            - call: "POST /sales-orders/${o_id}/lines"
              payload: { title_id: "${t_id}", quantity: 2 }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /sales-orders/${o_id}/reserve"
              payload: { expected_sales_order_version: "${v0}" }
              as: Bookseller
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INSUFFICIENT_STOCK"

      - name: pay_owner_check_beats_insufficient_credit
        grounds:
          - validations[priority=3]
          - validations[priority=14]
          - state_machines.SalesOrder.UNPAID_to_PAID
        distinguishing_aspect: |
          On pay a non-owner member redeems more credit than the owner holds. auth ownership
          (ERR_NOT_RESOURCE_OWNER, prio 3) is checked before business_fiscal credit (ERR_INSUFFICIENT_CREDIT,
          prio 14), so the owner-check error wins. Category pair: auth vs business_fiscal — different
          pair than instance 1's business_safety vs business_constraint.
        test_recipe:
          setup:
            - "Owner member M1 (store_credit 0). Intruder member M2. Title T (list 1000)."
            - "Order O owned by M1 with credit_redeemed_cents=500 (exceeds M1's 0 credit), one line q1."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "m10a@x.com", full_name: "Owner" }
              as: Anonymous
              captures: { m1_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m10b@x.com", full_name: "Intruder" }
              as: Anonymous
              captures: { m2_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn13: "9780000000011", name: "T", list_price_cents: 1000 }
              as: Bookseller
              captures: { t_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { member_id: "${m1_id}", credit_redeemed_cents: 500 }
              as: Member
              as_user_id: "${m1_id}"
              captures: { o_id: $.data.id }
            - call: "POST /sales-orders/${o_id}/lines"
              payload: { title_id: "${t_id}", quantity: 1 }
              as: Member
              as_user_id: "${m1_id}"
          trigger:
            - call: "POST /sales-orders/${o_id}/pay"
              payload: {}
              as: Member
              as_user_id: "${m2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_NOT_RESOURCE_OWNER"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: consignment_tier_boundary_unit_10_drops_to_035
        grounds:
          - calculations.consignment_payout
          - state_machines.ConsignmentCopy.ON_SHELF_to_SOLD
          - entities.ConsignmentCopy.fields.payout_cents
        distinguishing_aspect: |
          Numeric threshold on units_sold_to_date: the 10th copy to sell (u==9 before counting) still
          pays the 0.40 tier -> payout 1200 on a 2000 copy; the 11th (u==10 before) drops to 0.35 ->
          payout 1300. Boundary reached through POST /consignment-copies/{id}/mark-sold.
        test_recipe:
          setup:
            - "Author AU (is_local_author), Title T, ACTIVE agreement AG with 11 ON_SHELF copies each sale_price 2000."
            - "Copies 1..9 already SOLD (units_sold_to_date=9 before the 10th sale)."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "au2@x.com", full_name: "Author Two", is_local_author: true }
              as: Anonymous
              captures: { au_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn13: "9780000000012", name: "T", list_price_cents: 2000 }
              as: InventoryManager
              captures: { t_id: $.data.id }
            - call: "POST /consignment-agreements"
              payload: { author_member_id: "${au_id}", title_id: "${t_id}" }
              as: InventoryManager
              captures: { ag_id: $.data.id }
            - call: "POST /consignment-agreements/${ag_id}/copies"
              payload: { sale_price_cents: 2000 }
              as: InventoryManager
              captures: { c1: $.data.id }
            - call: "POST /consignment-copies/${c1}/mark-sold"
              payload: {}
              as: Bookseller
            - call: "POST /consignment-agreements/${ag_id}/copies"
              payload: { sale_price_cents: 2000 }
              as: InventoryManager
              captures: { c2: $.data.id }
