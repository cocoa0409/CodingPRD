# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3145_dental_benefit_plan_administration_fee_tiers_predetermination
#
# Depth probe. Two instances per Difficulty Rule (§0.5). Every instance grounds
# in SCAFFOLD.yaml §1.1–§1.7 and is reachable from empty-DB via setup_api_calls.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: claim_pricing_pinned_vs_free_by_service_date
        grounds:
          - calculations.allowed_amount_resolution
          - entities.Predetermination.fields.version_pin_fee_schedule_id
          - state_machines.Predetermination.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Entity domain = Claim/ClaimLine pricing. Two claims with identical
          service_date, cdt_code, and submitted amount price differently because
          claim A references an APPROVED predetermination that pins schedule v1
          (allowed 100000) while claim B prices free against the schedule ACTIVE
          at service_date (v2, allowed 80000).
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z."
            - "Plan P: annual_max 150000, deductible 5000, preventive exempt from deductible, prev 100% / basic 80% / major 50%, no waiting periods, missing-tooth off, ABP off."
            - "Provider PRV tier PPO."
            - "FeeSchedule v1 PPO effective 2026-01-01 with D2740 allowed 100000 (MAJOR, no attachment); ACTIVE."
            - "Subscriber effective 2026-01-01, cob_priority PRIMARY."
            - "Predetermination for D2740 submitted 110000 planned 2026-04-15, assigned and APPROVED (pins v1)."
            - "FeeSchedule v2 PPO effective 2026-04-01 with D2740 allowed 80000; activated — v1's window truncated to [2026-01-01, 2026-04-01)."
          setup_api_calls:
            - call: "POST /dental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /dental/plans"
              payload: { plan_code: "DD-DV1", plan_year_start_month: 1, annual_maximum_cents: 150000, deductible_cents: 5000, deductible_applies_preventive: false, preventive_coinsurance_pct: 100, basic_coinsurance_pct: 80, major_coinsurance_pct: 50, basic_waiting_months: 0, major_waiting_months: 0, missing_tooth_clause_active: false, abp_enabled: false }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /dental/plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /dental/providers"
              payload: { npi: "1234567890", legal_name: "Smile Dental", tier: "PPO", license_state: "CA", contracted_on: "2025-01-01T00:00:00Z" }
              as: NetworkManager
              captures: { provider_id: $.data.id }
            - call: "POST /dental/fee-schedules"
              payload: { tier: "PPO", effective_from: "2026-01-01T00:00:00Z", entries: [{ cdt_code: "D2740", allowed_cents: 100000, category: "MAJOR", requires_attachment: false, abp_alternative_cdt: "" }] }
              as: NetworkManager
              captures: { fees_v1: $.data.id }
            - call: "POST /dental/fee-schedules/${fees_v1}/activate"
              payload: {}
              as: NetworkManager
            - call: "POST /dental/subscribers"
              payload: { plan_id: "${plan_id}", member_id: "M-DV1", full_name: "Alice Prime", date_of_birth: "1980-06-15T00:00:00Z", effective_date: "2026-01-01T00:00:00Z", cob_priority: "PRIMARY" }
              as: PlanAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /dental/predeterminations"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", cdt_code: "D2740", submitted_amount_cents: 110000, planned_service_date: "2026-04-15T00:00:00Z" }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { predet_id: $.data.id }
            - call: "POST /dental/predeterminations/${predet_id}/assign"
              payload: { clinical_reviewer_id: "rev-1" }
              as: ClinicalReviewer
              as_user_id: "rev-1"
              captures: { predet_v: $.data.version }
            - call: "POST /dental/predeterminations/${predet_id}/approve"
              payload: { expected_predetermination_version: "${predet_v}" }
              as: ClinicalReviewer
              as_user_id: "rev-1"
            - call: "POST /dental/fee-schedules"
              payload: { tier: "PPO", effective_from: "2026-04-01T00:00:00Z", entries: [{ cdt_code: "D2740", allowed_cents: 80000, category: "MAJOR", requires_attachment: false, abp_alternative_cdt: "" }] }
              as: NetworkManager
              captures: { fees_v2: $.data.id }
            - call: "POST /dental/fee-schedules/${fees_v2}/activate"
              payload: {}
              as: NetworkManager
          trigger:
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", predetermination_id: "${predet_id}", service_date: "2026-04-15T00:00:00Z", received_date: "2026-04-16T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D2740", tooth_number: "14", submitted_amount_cents: 110000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { claim_a: $.data.id }
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-04-15T00:00:00Z", received_date: "2026-04-16T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D2740", tooth_number: "15", submitted_amount_cents: 110000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { claim_b: $.data.id }
            - call: "GET /dental/claims/${claim_a}/lines"
              payload: {}
              as: ClaimsExaminer
              captures: { line_a_allowed: "$.data[0].allowed_cents" }
            - call: "GET /dental/claims/${claim_b}/lines"
              payload: {}
              as: ClaimsExaminer
              captures: { line_b_allowed: "$.data[0].allowed_cents" }
          assert:
            - "claim A (predetermination-pinned) line allowed_cents == 100000 — priced against pinned schedule v1"
            - "claim B (no predetermination) line allowed_cents == 80000 — priced against schedule v2 ACTIVE at service_date"
            - "claim A status == ADJUDICATED and claim B status == ADJUDICATED"
            - "the two identical-price inputs diverge by exactly 20000 cents solely due to the pricing variant"

      - name: predet_estimate_at_assign_vs_at_approve
        grounds:
          - calculations.predetermination_estimate
          - state_machines.FeeSchedule.PENDING_to_ACTIVE
          - entities.Predetermination.fields.estimated_plan_pay_cents
        distinguishing_aspect: |
          Entity domain = Predetermination. The same predetermination produces
          estimated_plan_pay_cents 50000 at assign time (schedule v1 priced
          D2740 at 100000) and 40000 at approve time after schedule v2
          (D2740 at 80000) was activated in between — the two estimate variants
          diverge because the estimate re-runs against the currently governing
          schedule at each variant's trigger.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z."
            - "Plan: annual_max 150000, deductible 0, prev 100 / basic 80 / major 50, no waiting, ABP off."
            - "Provider PPO; schedule v1 PPO effective 2026-01-01 with D2740 allowed 100000; ACTIVE."
            - "Subscriber effective 2026-01-01 PRIMARY."
            - "Predetermination D2740 submitted 110000 planned 2026-06-01, assigned to rev-1."
          setup_api_calls:
            - call: "POST /dental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /dental/plans"
              payload: { plan_code: "DD-DV2", plan_year_start_month: 1, annual_maximum_cents: 150000, deductible_cents: 0, deductible_applies_preventive: false, preventive_coinsurance_pct: 100, basic_coinsurance_pct: 80, major_coinsurance_pct: 50, basic_waiting_months: 0, major_waiting_months: 0, missing_tooth_clause_active: false, abp_enabled: false }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /dental/plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /dental/providers"
              payload: { npi: "1234567891", legal_name: "Smile Dental 2", tier: "PPO", license_state: "CA", contracted_on: "2025-01-01T00:00:00Z" }
              as: NetworkManager
              captures: { provider_id: $.data.id }
            - call: "POST /dental/fee-schedules"
              payload: { tier: "PPO", effective_from: "2026-01-01T00:00:00Z", entries: [{ cdt_code: "D2740", allowed_cents: 100000, category: "MAJOR", requires_attachment: false, abp_alternative_cdt: "" }] }
              as: NetworkManager
              captures: { fees_v1: $.data.id }
            - call: "POST /dental/fee-schedules/${fees_v1}/activate"
              payload: {}
              as: NetworkManager
            - call: "POST /dental/subscribers"
              payload: { plan_id: "${plan_id}", member_id: "M-DV2", full_name: "Bob Prime", date_of_birth: "1979-03-20T00:00:00Z", effective_date: "2026-01-01T00:00:00Z", cob_priority: "PRIMARY" }
              as: PlanAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /dental/predeterminations"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", cdt_code: "D2740", submitted_amount_cents: 110000, planned_service_date: "2026-06-01T00:00:00Z" }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { predet_id: $.data.id }
            - call: "POST /dental/predeterminations/${predet_id}/assign"
              payload: { clinical_reviewer_id: "rev-1" }
              as: ClinicalReviewer
              as_user_id: "rev-1"
              captures: { est_allowed_assign: $.data.estimated_allowed_cents, est_plan_assign: $.data.estimated_plan_pay_cents }
            - call: "POST /dental/fee-schedules"
              payload: { tier: "PPO", effective_from: "2026-05-01T00:00:00Z", entries: [{ cdt_code: "D2740", allowed_cents: 80000, category: "MAJOR", requires_attachment: false, abp_alternative_cdt: "" }] }
              as: NetworkManager
              captures: { fees_v2: $.data.id }
            - call: "POST /dental/fee-schedules/${fees_v2}/activate"
              payload: {}
              as: NetworkManager
            - call: "GET /dental/predeterminations/${predet_id}"
              payload: {}
              as: ClinicalReviewer
              as_user_id: "rev-1"
              captures: { predet_v: $.data.version }
          trigger:
            - call: "POST /dental/predeterminations/${predet_id}/approve"
              payload: { expected_predetermination_version: "${predet_v}" }
              as: ClinicalReviewer
              as_user_id: "rev-1"
              captures: { est_allowed_final: $.data.estimated_allowed_cents, est_plan_final: $.data.estimated_plan_pay_cents, pin: $.data.version_pin_fee_schedule_id }
          assert:
            - "assign-time estimate: estimated_allowed_cents == 100000 and estimated_plan_pay_cents == 50000 (floor(100000 * 50/100))"
            - "approve-time estimate: estimated_allowed_cents == 80000 and estimated_plan_pay_cents == 40000"
            - "Predetermination.version_pin_fee_schedule_id == fees_v2"
            - "Predetermination.status == APPROVED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: patient_cost_share_multi_input_nonlinear
        grounds:
          - calculations.patient_cost_share
          - entities.ClaimLine.fields.deductible_applied_cents
          - entities.Plan.fields.deductible_applies_preventive
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula. Line 1 (PREVENTIVE, exempt
          from deductible) skips the deductible entirely while line 2 (BASIC)
          absorbs the full 5000 deductible, then coinsurance floors 80% of the
          5000 remainder — category branch + nested min + conditional deductible
          interact; a naive formula that applies deductible to both lines yields
          9000 plan pay instead of the correct 9000-with-different-split
          (preventive 5000 / basic 4000 vs wrong 4000 / 4000).
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z."
            - "Plan: annual_max 150000, deductible 5000, preventive NOT subject to deductible, prev 100 / basic 80 / major 50, no waiting, ABP off."
            - "Provider PPO; schedule with D0120 PREVENTIVE allowed 5000 and D2391 BASIC allowed 10000; ACTIVE."
            - "Subscriber effective 2026-01-01 PRIMARY."
          setup_api_calls:
            - call: "POST /dental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /dental/plans"
              payload: { plan_code: "DD-CF1", plan_year_start_month: 1, annual_maximum_cents: 150000, deductible_cents: 5000, deductible_applies_preventive: false, preventive_coinsurance_pct: 100, basic_coinsurance_pct: 80, major_coinsurance_pct: 50, basic_waiting_months: 0, major_waiting_months: 0, missing_tooth_clause_active: false, abp_enabled: false }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /dental/plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /dental/providers"
              payload: { npi: "1234567892", legal_name: "Smile Dental 3", tier: "PPO", license_state: "CA", contracted_on: "2025-01-01T00:00:00Z" }
              as: NetworkManager
              captures: { provider_id: $.data.id }
            - call: "POST /dental/fee-schedules"
              payload: { tier: "PPO", effective_from: "2026-01-01T00:00:00Z", entries: [{ cdt_code: "D0120", allowed_cents: 5000, category: "PREVENTIVE", requires_attachment: false, abp_alternative_cdt: "" }, { cdt_code: "D2391", allowed_cents: 10000, category: "BASIC", requires_attachment: false, abp_alternative_cdt: "" }] }
              as: NetworkManager
              captures: { fees_id: $.data.id }
            - call: "POST /dental/fee-schedules/${fees_id}/activate"
              payload: {}
              as: NetworkManager
            - call: "POST /dental/subscribers"
              payload: { plan_id: "${plan_id}", member_id: "M-CF1", full_name: "Carol Prime", date_of_birth: "1985-11-05T00:00:00Z", effective_date: "2026-01-01T00:00:00Z", cob_priority: "PRIMARY" }
              as: PlanAdmin
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-02-01T00:00:00Z", received_date: "2026-02-02T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D0120", tooth_number: "", submitted_amount_cents: 5000 }, { line_number: 2, cdt_code: "D2391", tooth_number: "19", submitted_amount_cents: 12000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { claim_id: $.data.id }
            - call: "GET /dental/claims/${claim_id}/lines"
              payload: {}
              as: ClaimsExaminer
              captures: { l1_ded: "$.data[0].deductible_applied_cents", l1_plan: "$.data[0].plan_pay_cents", l2_ded: "$.data[1].deductible_applied_cents", l2_plan: "$.data[1].plan_pay_cents", l2_allowed: "$.data[1].allowed_cents" }
          assert:
            - "line 1 (D0120 PREVENTIVE): allowed_cents == 5000, deductible_applied_cents == 0, plan_pay_cents == 5000 (100% coinsurance, deductible-exempt)"
            - "line 2 (D2391 BASIC): allowed_cents == 10000 (min(12000, 10000)), deductible_applied_cents == 5000, coinsurance base == 5000, plan_pay_cents == 4000 (floor(5000*80/100))"
            - "GET /dental/subscribers/${sub_id}/accumulators returns one row with deductible_met_cents == 5000 and annual_max_used_cents == 9000"
            - "Claim.total_plan_pay_cents == 9000 and total_patient_pay_cents == 6000"

      - name: annual_max_circular_cap_draws_down_in_line_order
        grounds:
          - calculations.patient_cost_share
          - calculations.annual_max_accumulator
          - entities.BenefitAccumulator.fields.annual_max_used_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — the annual-max cap on line N
          depends on annual_max_used, which the same formula increments per
          line; evaluation order is pinned (line_number ASC). Three identical
          8000-allowed major lines against a 10000 cap pay 4000, 4000, then
          2000 (capped); any other evaluation order or a cap check that reads
          the pre-claim accumulator would mis-pay line 3.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z."
            - "Plan: annual_max 10000, deductible 0, major 50, no waiting, ABP off."
            - "Provider PPO; schedule with D2740 MAJOR allowed 8000; ACTIVE."
            - "Subscriber effective 2026-01-01 PRIMARY."
          setup_api_calls:
            - call: "POST /dental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /dental/plans"
              payload: { plan_code: "DD-CF2", plan_year_start_month: 1, annual_maximum_cents: 10000, deductible_cents: 0, deductible_applies_preventive: false, preventive_coinsurance_pct: 100, basic_coinsurance_pct: 80, major_coinsurance_pct: 50, basic_waiting_months: 0, major_waiting_months: 0, missing_tooth_clause_active: false, abp_enabled: false }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /dental/plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /dental/providers"
              payload: { npi: "1234567893", legal_name: "Smile Dental 4", tier: "PPO", license_state: "CA", contracted_on: "2025-01-01T00:00:00Z" }
              as: NetworkManager
              captures: { provider_id: $.data.id }
            - call: "POST /dental/fee-schedules"
              payload: { tier: "PPO", effective_from: "2026-01-01T00:00:00Z", entries: [{ cdt_code: "D2740", allowed_cents: 8000, category: "MAJOR", requires_attachment: false, abp_alternative_cdt: "" }] }
              as: NetworkManager
              captures: { fees_id: $.data.id }
            - call: "POST /dental/fee-schedules/${fees_id}/activate"
              payload: {}
              as: NetworkManager
            - call: "POST /dental/subscribers"
              payload: { plan_id: "${plan_id}", member_id: "M-CF2", full_name: "Dan Prime", date_of_birth: "1990-01-01T00:00:00Z", effective_date: "2026-01-01T00:00:00Z", cob_priority: "PRIMARY" }
              as: PlanAdmin
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-02-01T00:00:00Z", received_date: "2026-02-02T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D2740", tooth_number: "3", submitted_amount_cents: 8000 }, { line_number: 2, cdt_code: "D2740", tooth_number: "4", submitted_amount_cents: 8000 }, { line_number: 3, cdt_code: "D2740", tooth_number: "5", submitted_amount_cents: 8000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { claim_id: $.data.id }
            - call: "GET /dental/claims/${claim_id}/lines"
              payload: {}
              as: ClaimsExaminer
              captures: { p1: "$.data[0].plan_pay_cents", p2: "$.data[1].plan_pay_cents", p3: "$.data[2].plan_pay_cents" }
          assert:
            - "line 1 plan_pay_cents == 4000 (floor(8000*50/100), cap not yet binding)"
            - "line 2 plan_pay_cents == 4000 (accumulator at 4000, remaining 6000 >= 4000)"
            - "line 3 plan_pay_cents == 2000 (coinsurance 4000 capped by remaining 10000-8000=2000)"
            - "GET /dental/subscribers/${sub_id}/accumulators returns annual_max_used_cents == 10000 (cap fully consumed)"
            - "Claim.total_plan_pay_cents == 10000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: predetermination_reassign_cycle_then_expiry
        grounds:
          - state_machines.Predetermination.UNDER_REVIEW_to_UNDER_REVIEW
          - state_machines.Predetermination.APPROVED_to_EXPIRED
          - calculations.predetermination_estimate
        distinguishing_aspect: |
          Entity = Predetermination. Non-linear: UNDER_REVIEW loops back to
          UNDER_REVIEW via reassign (cycle), and APPROVED auto-decays to
          EXPIRED when the clock passes expires_on — a lazy, time-driven
          transition rather than a pure forward pipeline.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z."
            - "Plan (no waiting, ABP off, deductible 0, major 50, max 150000), PPO provider, schedule with D2740 100000 ACTIVE, subscriber effective 2026-01-01."
            - "Predetermination D2740 submitted 110000 planned 2026-06-01 in SUBMITTED."
          setup_api_calls:
            - call: "POST /dental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /dental/plans"
              payload: { plan_code: "DD-NL1", plan_year_start_month: 1, annual_maximum_cents: 150000, deductible_cents: 0, deductible_applies_preventive: false, preventive_coinsurance_pct: 100, basic_coinsurance_pct: 80, major_coinsurance_pct: 50, basic_waiting_months: 0, major_waiting_months: 0, missing_tooth_clause_active: false, abp_enabled: false }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /dental/plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /dental/providers"
              payload: { npi: "1234567894", legal_name: "Smile Dental 5", tier: "PPO", license_state: "CA", contracted_on: "2025-01-01T00:00:00Z" }
              as: NetworkManager
              captures: { provider_id: $.data.id }
            - call: "POST /dental/fee-schedules"
              payload: { tier: "PPO", effective_from: "2026-01-01T00:00:00Z", entries: [{ cdt_code: "D2740", allowed_cents: 100000, category: "MAJOR", requires_attachment: false, abp_alternative_cdt: "" }] }
              as: NetworkManager
              captures: { fees_id: $.data.id }
            - call: "POST /dental/fee-schedules/${fees_id}/activate"
              payload: {}
              as: NetworkManager
            - call: "POST /dental/subscribers"
              payload: { plan_id: "${plan_id}", member_id: "M-NL1", full_name: "Eve Prime", date_of_birth: "1988-08-08T00:00:00Z", effective_date: "2026-01-01T00:00:00Z", cob_priority: "PRIMARY" }
              as: PlanAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /dental/predeterminations"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", cdt_code: "D2740", submitted_amount_cents: 110000, planned_service_date: "2026-06-01T00:00:00Z" }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { predet_id: $.data.id }
          trigger:
            - call: "POST /dental/predeterminations/${predet_id}/assign"
              payload: { clinical_reviewer_id: "rev-1" }
              as: ClinicalReviewer
              as_user_id: "rev-1"
            - call: "POST /dental/predeterminations/${predet_id}/reassign"
              payload: { clinical_reviewer_id: "rev-2" }
              as: ClinicalReviewer
              as_user_id: "rev-2"
              captures: { predet_v: $.data.version, reviewer_now: $.data.clinical_reviewer_id }
            - call: "POST /dental/predeterminations/${predet_id}/approve"
              payload: { expected_predetermination_version: "${predet_v}" }
              as: ClinicalReviewer
              as_user_id: "rev-2"
              captures: { expires_on: $.data.expires_on }
            - call: "POST /dental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: PlanAdmin
            - call: "GET /dental/predeterminations/${predet_id}"
              payload: {}
              as: ClinicalReviewer
              as_user_id: "rev-2"
              captures: { final_status: $.data.status }
          assert:
