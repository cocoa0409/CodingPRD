  # ===========================================================================
  # RULE 8 — resource_temporal_overlap
  # Two DIFFERENT resource entities with DELIBERATELY OPPOSITE interval semantics:
  #   instance 1 = Bed        — CLOSED [start, start + projected] with the FROZEN
  #                             turnover buffer on the existing side; touching
  #                             endpoints DO collide (validation 13.3)
  #   instance 2 = ShiftAssignment — HALF-OPEN [start, end); touching endpoints
  #                             do NOT overlap, plus the 720-minute span cap
  #                             (validation 13.2)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: bed_hold_collides_inside_the_frozen_buffer_and_on_the_touching_endpoint_but_admits_one_minute_later
        grounds:
          - validations[priority 13.3]
          - validations[priority 8.07]
          - errors[ERR_BED_TURNOVER_CONFLICT]
          - calculations.induction_capacity_projection
          - entities.InductionBooking.fields.requested_start_utc
          - entities.InductionBooking.fields.expected_labor_minutes
          - entities.InductionBooking.fields.projected_occupancy_minutes
          - entities.Bed.fields.status
          - entities.Bed.fields.held_booking_id
          - entities.ObstetricUnit.fields.turnover_buffer_minutes
          - state_machines.InductionBooking.REQUESTED_to_CAPACITY_HELD
          - state_machines.InductionBooking.CONFIRMED_to_ADMITTED
          - state_machines.Bed.OCCUPIED_to_TURNOVER
          - state_machines.Bed.TURNOVER_to_AVAILABLE
          - endpoints[POST /induction-bookings/{bookingId}/hold-capacity]
          - endpoints[POST /obstetric-units/{unitId}/capacity-sweep]
        distinguishing_aspect: |
          Validation 13.3 declares an ASYMMETRIC CLOSED interval: the EXISTING
          side is [requested_start_utc, requested_start_utc +
          projected_occupancy_minutes] — labour PLUS the turnover buffer frozen
          at hold time — while the NEW side is [requested_start_utc,
          requested_start_utc + expected_labor_minutes], with no buffer at all,
          and endpoints that merely touch DO collide. Booking A occupies LDR-01
          from 08:00 with expected_labor_minutes 600 and a frozen
          projected_occupancy_minutes of 645, so its blocking window is
          [08:00, 18:45] even though its labour ends at 18:00. Three probes on
          the same bed separate every wrong reading at once:
            * 18:30 -> 409. Inside the frozen buffer. An implementation that
              compares against expected_labor_minutes on the existing side
              (window ending 18:00) admits this hold.
            * 18:45 -> 409. Exactly touching A's end. An implementation with
              HALF-OPEN bed semantics — the semantics validation 13.2 uses for
              shifts, one entity away — admits this hold.
            * 18:46 -> 200. One minute clear. An implementation that adds the
              buffer to the NEW side as well (window starting 18:46 is fine, but
              a symmetric reading pushes A's end to 18:45 + nothing and its own
              start back by 45 to 18:01) or that rounds to a 15-minute grid
              refuses this hold.
          The pre-emption ladder is also nailed down: LDR-01 is genuinely
          AVAILABLE at trigger time (booking A was ADMITTED, the encounter was
          transferred out, and the capacity sweep cleared the bed from TURNOVER),
          so 8.07 cannot fire and the 409 must be the INTERVAL rule, not the bed
          lifecycle; and max_daily_induction_bed_minutes is 20000, so priority 15
          (PRIORITY CONFLICT PAIR 4's other half) has nothing to say. Booking A
          stays in status ADMITTED throughout, which is what keeps it inside
          13.3's colliding status set {CAPACITY_HELD, CONFIRMED, ADMITTED} even
          though it no longer holds the bed.
        test_recipe:
          setup: |
            One unit (3 LDR beds, 1 OR room, a deliberately huge 20000-minute day
            budget) whose cesarean readiness has been lifted to DEGRADED by one
            validated DECISION_TO_INCISION drill — required because /confirm
            refuses at readiness NOT_READY (11.4). Booking A (PREECLAMPSIA at 39
            weeks, so MEDICALLY_INDICATED and immune to the elective rule 11.8)
            requests 2026-08-20T08:00:00Z for 600 minutes, is held on LDR-01 while
            the posture is OPEN — freezing projected_occupancy_minutes at
            600 + 45 = 645 — confirmed, then admitted at 07:30 (exactly the
            30-minute early-admit grace boundary), which sends LDR-01 to OCCUPIED
            and mints an encounter. That encounter is immediately transferred out,
            which releases LDR-01 to TURNOVER; the clock then moves to 09:00 (past
            any turnover_clear_at the 45- or 75-minute buffer could produce) and a
            capacity sweep clears LDR-01 back to AVAILABLE. Booking A remains
            ADMITTED with bed_id LDR-01 and its frozen 645-minute window. Three
            further ELECTIVE_39_WEEK bookings of 120 minutes each are then created
            at 18:30, 18:45 and 18:46 on the same day, and the unit version is read
            in the last setup call so the priority-6 OCC guard passes for all three
            probes (the two rejected holds mutate nothing, so one version serves).
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-20T06:00:00Z" }
              as: PerinatalSafetyOfficer
