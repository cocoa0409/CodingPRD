      - name: two_instruments_diverge_on_the_same_joint_counts
        claim_type: variant_divergence
        grounds:
          - calculations.visit_disease_activity_score.variants
        excluded_because:
          difficulty_instance: visit_instrument_variant_divergence_cdai_vs_das28
          rationale: "The §1.8 dual-variant instance already scores two visits with identical joint counts under CDAI and DAS28_CRP, pins 9.00 / LOW against 3.62 / MODERATE and shows each variant ignoring the other's inputs."

      - name: pharmacy_and_medical_channels_price_the_same_dose_differently
        claim_type: variant_divergence
        grounds:
          - calculations.episode_cost_share_estimate.variants
        excluded_because:
          difficulty_instance: cost_share_channel_variant_divergence_pharmacy_vs_medical
          rationale: "The §1.8 dual-variant instance already contrasts the PHARMACY and MEDICAL vectors for the same acquisition cost and pins the 75000-cent facility-fee delta, which is the whole content of a variant-divergence corner here."

      - name: per_dose_rounding_precedes_summation
        claim_type: precision
        grounds:
          - calculations.episode_cost_share_estimate.formula
        excluded_because:
          difficulty_instance: per_dose_rounding_then_sum_pins_medical_cost_share_total
          rationale: "The §1.8 combinatorial-formula instance pins total_member_share_cents 420054 against the 420053 produced by summing before rounding, so the rounding discipline is already falsifiable there."

      - name: assistance_tier_is_keyed_on_the_gross_share
        claim_type: constants_applied
        grounds:
          - calculations.assistance_benefit_application.formula
        excluded_because:
          difficulty_instance: assistance_tier_evaluation_order_pins_applied_and_out_of_pocket
          rationale: "The §1.8 instance pins 111007 / 27752 against the 124883 / 13876 produced by deriving the tier from the residual out-of-pocket amount, which covers the evaluation-order claim end to end."

      - name: cdai_category_ladder_at_the_moderate_ceiling
        claim_type: precision
        grounds:
          - calculations.visit_disease_activity_score.variants[CDAI]
        excluded_because:
          difficulty_instance: cdai_exactly_at_moderate_ceiling_scores_moderate_not_high
          rationale: "The §1.8 boundary instance already walks 21.90 / 22.00 / 22.10 through the CDAI ladder and pins MODERATE, MODERATE, HIGH."

      - name: quality_window_is_half_open
        claim_type: precision
        grounds:
          - calculations.quality_report_aggregation.formula
        excluded_because:
          difficulty_instance: quality_report_half_open_window_excludes_visit_at_period_end
          rationale: "The §1.8 boundary instance already shows a visit at exactly period_end being excluded and the resulting ERR_QUALITY_PERIOD_NO_VISITS, which is the strongest form of the half-open claim."

  - section: validations
    instances:
      - name: invalid_request_shape_outranks_the_body_reference_lookup_on_episode_create
        claim_type: priority_conflict
        grounds:
          - validations.priority_12_ERR_INVALID_REQUEST
          - validations.priority_13_ERR_REFERENCE_NOT_FOUND
        distinguishing_aspect: "One POST /therapy-episodes body violates both priority 12 (therapy_start_at is not an ISO-8601 instant) and priority 13 (patient_id names no row); the ladder must answer ERR_INVALID_REQUEST 422, and only after the shape is repaired does the same body answer ERR_REFERENCE_NOT_FOUND 404."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. One rheumatologist, one drug, one payer plan and one Patient exist; the patient id used in the trigger bodies is the all-zero UUID, which is never issued."
          setup_api_calls:
