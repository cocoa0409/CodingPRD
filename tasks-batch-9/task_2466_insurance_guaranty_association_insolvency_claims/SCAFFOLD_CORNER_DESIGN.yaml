          - validations[priority=9]
          - validations[priority=10]
          - validations[priority=11]
          - validations[priority=11.5]
        distinguishing_aspect: "Each aggregate has its own 404 rather than a shared generic one: the same well-formed but unminted UUID produces ERR_INSOLVENCY_NOT_FOUND, ERR_POLICY_NOT_FOUND, ERR_TRANSFER_NOT_FOUND, ERR_ASSESSMENT_NOT_FOUND, ERR_MEMBER_ASSESSMENT_NOT_FOUND and ERR_MEMBER_INSURER_NOT_FOUND depending on which collection is addressed."
