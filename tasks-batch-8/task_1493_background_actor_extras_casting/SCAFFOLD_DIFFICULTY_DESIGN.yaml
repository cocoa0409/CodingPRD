          assert:
            - "Voucher.${vc}.net_work_minutes == 480 (boundary)"
            - "Voucher.${vc}.ot_tier1_minutes == 0 and ot_tier2_minutes == 0 and ot_wages_cents == 0"
            - "Voucher.${vc}.gross_total_cents == 10000 (exactly the day rate, no OT)"
      - name: union_ratio_exactly_at_requirement_locks
        grounds:
          - calculations.union_ratio_projected
          - validations[priority=17]
        distinguishing_aspect: |
          Different metric (integer union headcount) and different endpoint
          (POST /casting-calls/{id}/lock): projected_union_count exactly equal to
          required_union_slots (2 == 2) must PASS (>= semantics); the contrast case
          with 1-of-2 is covered in corner design as ERR_UNION_RATIO_SHORTFALL.
        test_recipe:
          setup:
            - "Production ACTIVE; two SAG_AFTRA actors ELIGIBLE; call (union_slots 2, nonunion_slots 1) PUBLISHED; both union bookings created (OFFERED counts toward projection)"
          setup_api_calls:
