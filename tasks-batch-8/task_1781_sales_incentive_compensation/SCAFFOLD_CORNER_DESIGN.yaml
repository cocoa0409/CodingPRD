  - section: endpoints
    instances:
      - name: reps_list_pagination_limit_offset
        claim_type: pagination_with_filtering
        grounds: [response_envelope]
        distinguishing_aspect: "limit=2 over 3 reps returns 2 rows with total_count 3 and has_more true; offset=2 returns the final row with has_more false — envelope pagination fields honored."
        test_recipe:
          setup: ["program with exactly 3 reps"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog PG" }, as: CompAdmin, captures: { ppg: $.data.id } }
            - { call: "POST /reps", payload: { program_id: "${ppg}", name: "PG 1", employee_ref: "PG-1" }, as: CompAdmin }
            - { call: "POST /reps", payload: { program_id: "${ppg}", name: "PG 2", employee_ref: "PG-2" }, as: CompAdmin }
            - { call: "POST /reps", payload: { program_id: "${ppg}", name: "PG 3", employee_ref: "PG-3" }, as: CompAdmin }
          trigger:
            - { call: "GET /reps?program_id=${ppg}&limit=2&offset=0", as: CompAdmin }
            - { call: "GET /reps?program_id=${ppg}&limit=2&offset=2", as: CompAdmin }
          assert:
            - "page 1: 2 items, total_count == 3, has_more == true"
            - "page 2 (offset 2): 1 item, total_count == 3, has_more == false"

      - name: transactions_list_status_filter
        claim_type: listing
        grounds: [endpoints.GET_/transactions]
        distinguishing_aspect: "The status filter on GET /transactions isolates CANCELLED rows: after cancelling one of two transactions, status=CANCELLED returns exactly the cancelled one."
        test_recipe:
          setup: ["accepted rep; transactions F-T1 (cancelled) and F-T2 (still BOOKED)"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog LF" }, as: CompAdmin, captures: { plf: $.data.id } }
            - { call: "POST /plans", payload: { program_id: "${plf}", name: "Plan LF", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_lf: $.data.id } }
            - { call: "POST /plans/${plan_lf}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${plf}", name: "Rep LF", employee_ref: "LF-R1" }, as: CompAdmin, captures: { rlf: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${plf}", rep_id: "${rlf}", plan_id: "${plan_lf}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_lf: $.data.id } }
            - { call: "POST /assignments/${asg_lf}/accept", payload: {}, as: Rep, as_user_id: "${rlf}" }
            - { call: "POST /transactions", payload: { program_id: "${plf}", external_ref: "LF-T1", amount_cents: 100000, transaction_date: "2026-02-01", splits: [{ rep_id: "${rlf}", split_bps: 10000 }] }, as: CompAnalyst, captures: { txn_lf1: $.data.id } }
            - { call: "POST /transactions", payload: { program_id: "${plf}", external_ref: "LF-T2", amount_cents: 150000, transaction_date: "2026-02-02", splits: [{ rep_id: "${rlf}", split_bps: 10000 }] }, as: CompAnalyst, captures: { txn_lf2: $.data.id } }
            - { call: "POST /transactions/${txn_lf1}/cancel", payload: {}, as: CompAnalyst }
          trigger:
            - { call: "GET /transactions?program_id=${plf}&status=CANCELLED", as: CompAdmin }
            - { call: "GET /transactions?program_id=${plf}&status=BOOKED", as: CompAdmin }
          assert:
            - "status=CANCELLED: exactly 1 item with id == ${txn_lf1}"
            - "status=BOOKED: exactly 1 item with id == ${txn_lf2}"

      - name: response_envelope_shape_success_and_error
        claim_type: creation
        grounds: [response_envelope]
        distinguishing_aspect: "Success envelope carries meta.api_request_id, meta.api_request_timestamp, response_type 'object' and data; error envelope carries response_type 'error' and data.error_id + data.message."
        test_recipe:
          setup: ["one program exists"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog ENV" }, as: CompAdmin, captures: { penv: $.data.id } }
          trigger:
            - { call: "GET /programs/${penv}", as: CompAdmin }
            - { call: "GET /programs/00000000-0000-0000-0000-000000000000", as: CompAdmin, captures: { err_env: $.data.error_id } }
          assert:
            - "success: meta.api_request_id present, meta.api_request_timestamp present, response_type == 'object', data.id == ${penv}"
            - "error: response_type == 'error', data.error_id == ERR_NOT_FOUND, data.message present, HTTP 404"

