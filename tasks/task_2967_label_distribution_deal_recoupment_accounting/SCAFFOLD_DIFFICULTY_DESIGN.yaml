            - call: "POST /releases/${rel1_id}/release"
              payload: { actual_release_date: "2026-02-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /artist-agreements"
              payload: { artist_id: "${artist_id}", release_id: "${rel1_id}", royalty_rate_pct: 0.1200, escalated_royalty_rate_pct: 0.1800, advance_amount_cents: 0, recording_costs_cents: 0, recording_recoupable_pct: 0.0000, marketing_recoup_share_pct: 0.5000 }
              as: LabelAdmin
