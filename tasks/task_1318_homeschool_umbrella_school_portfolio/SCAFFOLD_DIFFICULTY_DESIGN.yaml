          trigger:
            - { call: "POST /curriculum-plans/${pln}/submit", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /curriculum-plans/${pln}/review", payload: { decision: "REQUEST_REVISION", notes: "add PE detail" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /curriculum-plans/${pln}/submit", payload: {}, as: Parent, as_user_id: "${fam}", captures: { rc: $.data.revision_count } }
