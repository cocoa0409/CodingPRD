              as: DockOps
              captures: { appt2_id: $.data.id }
          assert:
            - "DockAppointment.${appt2_id}.status == SCHEDULED"
            - "response.http_status == 201"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
