  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: to_boat_halfopen_adjacency_allowed
        grounds:
          - calculations.boat_rotation_select
          - state_machines.Reservation.REQUESTED_to_CONFIRMED
          - errors[ERR_NO_BOAT_AVAILABLE]
        distinguishing_aspect: "On the single-boat pool, a reservation whose window strictly overlaps an existing CONFIRMED reservation on that boat is rejected (ERR_NO_BOAT_AVAILABLE), but an adjacent window that only touches at the boundary (start == other end) is accepted — half-open [start,end) interval semantics with adjacency permitted, on the Boat resource."
        test_recipe:
          setup:
            - "Two SAIL members m1 and m2 at a dock with a SINGLE PONTOON boat b1. m1 holds a CONFIRMED reservation r_a for 10:00-12:00 on b1."
          setup_api_calls:
            - { call: "POST /membership-tiers", payload: { tier_code: "SAIL", monthly_dues_cents: 25000, max_active_reservations: 2, reservations_per_week: 4, reciprocal_access_allowed: true, advance_booking_days_max: 14 }, as: ClubAdmin }
            - { call: "POST /docks", payload: { name: "Home", location_code: "HM", capacity: 10, is_reciprocal: false }, as: ClubAdmin, captures: { hd: "$.data.id" } }
            - { call: "POST /boats", payload: { dock_id: "${hd}", boat_type: "PONTOON" }, as: ClubAdmin, captures: { b1: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "M1", email: "m1@x.com", membership_tier: "SAIL", home_dock_id: "${hd}" }, as: ClubAdmin, captures: { m1: "$.data.id" } }
