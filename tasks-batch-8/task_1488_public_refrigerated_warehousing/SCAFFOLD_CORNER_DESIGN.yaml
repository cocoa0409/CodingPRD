      - name: allocate_on_already_allocated_order_rejected
        claim_type: conditional_action
        grounds:
          - "state_machines.OutboundOrder"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "allocate is legal from SUBMITTED and SHORTED only; on an already-ALLOCATED (fully filled) order it fails ERR_INVALID_STATE — the same action is conditionally available by state."
        test_recipe:
          setup: ["Customer with card A; 2 pallets lot AL; order for 2 ALLOCATED"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Cond Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { cCd: $.data.id, cCd_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${cCd}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${cCd_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-CD", temp_class: FROZEN, capacity_pallets: 5, dock_doors: 2 }, as: WarehouseOperator, captures: { zCd: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${cCd}", zone_id: "${zCd}", product_code: "PEAS", lot_code: "AL", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 2, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${cCd}", captures: { rCd: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rCd}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rCd}/complete", payload: { actual_pallets: 2 }, as: WarehouseOperator }
            - { call: "POST /api/outbound-orders", payload: { customer_id: "${cCd}", product_code: "PEAS", requested_pallets: 2 }, as: CustomerAdmin, as_user_id: "${cCd}", captures: { oCd: $.data.id } }
            - { call: "POST /api/outbound-orders/${oCd}/submit", payload: {}, as: CustomerAdmin, as_user_id: "${cCd}" }
            - { call: "POST /api/outbound-orders/${oCd}/allocate", payload: {}, as: WarehouseOperator }
          trigger:
            - { call: "POST /api/outbound-orders/${oCd}/allocate", payload: {}, as: WarehouseOperator, captures: { errCd: $.data.error_id } }
          assert:
            - "Second allocate on ALLOCATED order: error_id == ERR_INVALID_STATE"
            - "OutboundOrder.${oCd}.allocated_pallets == 2 (unchanged)"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: missing_auth_headers_return_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "Requests without X-User-Role / X-User-ID are rejected 401 ERR_UNAUTHENTICATED before any other check (even on a well-formed request to an existing endpoint)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/zones", as: WarehouseOperator, captures: { errAuth: $.data.error_id } }
          assert:
            - "Test omits the X-User-Role and X-User-ID headers entirely (the `as:` above documents intent only)"
            - "HTTP 401 with error_id == ERR_UNAUTHENTICATED"

      - name: err_zone_full_covered
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_ZONE_FULL]"
        excluded_because:
          difficulty_instance: zone_capacity_exact_fill_then_overflow
          rationale: "ERR_ZONE_FULL is the asserted outcome of that §1.8 instance's trigger."

      - name: err_credit_limit_covered
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_CREDIT_LIMIT_EXCEEDED]"
        excluded_because:
          difficulty_instance: credit_check_forward_tier_evaluation_order
          rationale: "Credit-limit rejection at 101 pallets is asserted there."

      - name: err_booking_conflict_covered
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_BOOKING_WINDOW_CONFLICT]"
        excluded_because:
          difficulty_instance: blast_cell_turnaround_buffer_semantics
          rationale: "12:15-gap rejection is asserted there."

      - name: err_dock_capacity_covered
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_DOCK_CAPACITY_EXCEEDED]"
        excluded_because:
          difficulty_instance: dock_door_aggregate_capacity_semantics
          rationale: "Overlapping-window rejection at dock_doors == 1 is asserted there."

      - name: err_invoice_amount_mismatch_covered
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_INVOICE_AMOUNT_MISMATCH]"
        excluded_because:
          difficulty_instance: invoice_settle_exact_amount_boundary
          rationale: "Settle 8199 vs 8200 boundary is asserted there."

      - name: err_excursion_not_confirmed_covered
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_EXCURSION_NOT_CONFIRMED]"
        excluded_because:
          difficulty_instance: claim_create_gated_by_excursion_state
          rationale: "Claim against REPORTED excursion is asserted there."

      - name: err_lot_recalled_covered
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_LOT_RECALLED]"
        excluded_because:
          difficulty_instance: safety_recall_beats_fiscal_credit_on_submit
          rationale: "Lot-override submit against a RECALLED lot is asserted there."

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: customer_admin_cannot_manage_zones
        claim_type: rbac_denial
        grounds:
          - "roles[WarehouseOperator]"
          - "endpoints[POST /api/zones]"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "Zone management is WarehouseOperator-exclusive; a CustomerAdmin create is rejected ERR_FORBIDDEN even for a well-formed payload."
        test_recipe:
          setup: ["A customer exists (to supply a valid CustomerAdmin identity)"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Rbac Co", credit_limit_cents: 50000 }, as: BillingAdmin, captures: { cRb: $.data.id } }
          trigger:
            - { call: "POST /api/zones", payload: { zone_code: "FZ-RB", temp_class: FROZEN, capacity_pallets: 5, dock_doors: 1 }, as: CustomerAdmin, as_user_id: "${cRb}", captures: { errRb: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN (403); no zone persisted"

      - name: customer_admin_cannot_read_other_customers_order
        claim_type: rbac_denial
        grounds:
          - "roles[CustomerAdmin]"
          - "validations[priority=4]"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "Ownership: CustomerAdmin B reading customer A's order is ERR_FORBIDDEN (ownership check compares X-User-ID to order.customer_id); operators can read it."
        test_recipe:
          setup: ["Customers A and B; A has an order (DRAFT)"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Own A", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { cOwA: $.data.id } }
            - { call: "POST /api/customers", payload: { name: "Own B", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { cOwB: $.data.id } }
            - { call: "POST /api/outbound-orders", payload: { customer_id: "${cOwA}", product_code: "PEAS", requested_pallets: 1 }, as: CustomerAdmin, as_user_id: "${cOwA}", captures: { oOw: $.data.id } }
          trigger:
            - { call: "GET /api/outbound-orders/${oOw}", as: CustomerAdmin, as_user_id: "${cOwB}", captures: { errOw: $.data.error_id } }
            - { call: "GET /api/outbound-orders/${oOw}", as: WarehouseOperator, captures: { oOw_st: $.data.status } }
          assert:
            - "CustomerAdmin B -> error_id == ERR_FORBIDDEN (403)"
            - "WarehouseOperator -> 200, status == DRAFT"

      - name: warehouse_operator_cannot_confirm_excursion
        claim_type: rbac_denial
        grounds:
          - "roles[QualityManager]"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "Excursion adjudication is QualityManager-exclusive; a WarehouseOperator confirm is ERR_FORBIDDEN at the role check (p3), before any SoD or state evaluation."
        test_recipe:
          setup: ["Zone with a REPORTED excursion"]
          setup_api_calls:
            - { call: "POST /api/zones", payload: { zone_code: "FZ-RX", temp_class: FROZEN, capacity_pallets: 5, dock_doors: 1 }, as: WarehouseOperator, captures: { zRx: $.data.id } }
            - { call: "POST /api/temperature-excursions", payload: { zone_id: "${zRx}", observed_temp_c: -2.0, window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-04T00:00:00Z" }, as: WarehouseOperator, as_user_id: "op-1", captures: { exRx: $.data.id } }
          trigger:
            - { call: "POST /api/temperature-excursions/${exRx}/confirm", payload: {}, as: WarehouseOperator, as_user_id: "op-2", captures: { errRx: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN (role not in endpoint roles); excursion stays REPORTED"

      - name: claims_adjuster_cannot_run_billing
        claim_type: rbac_denial
        grounds:
          - "roles[BillingAdmin]"
          - "endpoints[POST /api/billing/run]"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "Billing runs are BillingAdmin-exclusive; ClaimsAdjuster is denied ERR_FORBIDDEN."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/billing/run", payload: {}, as: ClaimsAdjuster, captures: { errBr: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN (403)"

  # ---------------------------------------------------------------------------
  - section: complexity_layers
    instances:
      - name: occ_rate_card_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[rate-card-supersede-stale-customer]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "OCC on Customer.version: after card1 creation bumps the customer to version 2, a second create still carrying the pre-card1 version is rejected 412 ERR_STALE_VERSION; refetching and retrying succeeds and supersedes card1 (exactly one ACTIVE card remains)."
        test_recipe:
          setup: ["Customer created (version captured); card1 created ACTIVE"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Occ Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { cOc: $.data.id, cOc_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${cOc}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${cOc_v}" }, as: BillingAdmin, captures: { rcOc1: $.data.id } }
          trigger:
            - { call: "POST /api/rate-cards", payload: { customer_id: "${cOc}", storage_method: FULL_MONTH, frozen_storage_cents_per_pallet_month: 9999, chilled_storage_cents_per_pallet_month: 9999, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${cOc_v}" }, as: BillingAdmin, captures: { errOc: $.data.error_id } }
            - { call: "GET /api/customers/${cOc}", as: BillingAdmin, captures: { cOc_v2: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${cOc}", storage_method: FULL_MONTH, frozen_storage_cents_per_pallet_month: 9999, chilled_storage_cents_per_pallet_month: 9999, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${cOc_v2}" }, as: BillingAdmin, captures: { rcOc3: $.data.id } }
            - { call: "GET /api/rate-cards?customer_id=${cOc}&status=ACTIVE", as: BillingAdmin, captures: { rcOc_active: "$.data[0].id" } }
            - { call: "GET /api/rate-cards/${rcOc1}", as: BillingAdmin, captures: { rcOc1_st: $.data.status } }
          assert:
            - "Stale create (expected ${cOc_v} after card1 bumped version): HTTP 412, error_id == ERR_STALE_VERSION"
            - "Retry with fresh version succeeds: RateCard.${rcOc3} exists, status ACTIVE"
            - "RateCard.${rcOc1}.status == SUPERSEDED; exactly one ACTIVE card for the customer (${rcOc3})"
            - "Customer.${cOc}.version == 3 after two successful card creations (1 -> 2 -> 3)"

      - name: occ_order_amend_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[order-amend-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "OCC on OutboundOrder.version: an amend carrying version-1 (one behind) is rejected 412; the current version amends successfully and bumps version, after which the previously-current value is itself stale."
        test_recipe:
          setup: ["Customer with card A; DRAFT order (version captured at create)"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Occ2 Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { cO2: $.data.id, cO2_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${cO2}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${cO2_v}" }, as: BillingAdmin }
            - { call: "POST /api/outbound-orders", payload: { customer_id: "${cO2}", product_code: "PEAS", requested_pallets: 5 }, as: CustomerAdmin, as_user_id: "${cO2}", captures: { oO2: $.data.id, oO2_v: $.data.version } }
          trigger:
            - { call: "POST /api/outbound-orders/${oO2}/amend", payload: { requested_pallets: 4, expected_order_version: "${oO2_v} - 1" }, as: CustomerAdmin, as_user_id: "${cO2}", captures: { errO2a: $.data.error_id } }
            - { call: "POST /api/outbound-orders/${oO2}/amend", payload: { requested_pallets: 4, expected_order_version: "${oO2_v}" }, as: CustomerAdmin, as_user_id: "${cO2}", captures: { oO2_rp: $.data.requested_pallets, oO2_v2: $.data.version } }
            - { call: "POST /api/outbound-orders/${oO2}/amend", payload: { requested_pallets: 3, expected_order_version: "${oO2_v}" }, as: CustomerAdmin, as_user_id: "${cO2}", captures: { errO2b: $.data.error_id } }
          assert:
            - "Amend with version-1: HTTP 412 ERR_STALE_VERSION; requested_pallets still 5"
            - "Amend with current version: succeeds, requested_pallets == 4, version incremented"
            - "Replaying the now-stale version: HTTP 412 ERR_STALE_VERSION again"

      - name: version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[rate-card-supersede-stale-customer]"
          - "entities.Customer"
        distinguishing_aspect: "common_fields version semantics: PATCH (credit limit change) increments Customer.version by exactly 1 per mutation; reads never increment."
        test_recipe:
          setup: ["Customer created (version 1)"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Ver Co", credit_limit_cents: 50000 }, as: BillingAdmin, captures: { cVe: $.data.id, cVe_v: $.data.version } }
          trigger:
            - { call: "PATCH /api/customers/${cVe}", payload: { credit_limit_cents: 60000 }, as: BillingAdmin, captures: { cVe_v2: $.data.version } }
            - { call: "GET /api/customers/${cVe}", as: BillingAdmin, captures: { cVe_v3: $.data.version } }
            - { call: "PATCH /api/customers/${cVe}", payload: { credit_limit_cents: 70000 }, as: BillingAdmin, captures: { cVe_v4: $.data.version } }
          assert:
            - "After create: version == 1"
            - "After first PATCH: version == 2"
            - "After GET (read): version still == 2"
            - "After second PATCH: version == 3"

      - name: billing_run_checkpoint_idempotent
        claim_type: ops_run_checkpoint
        grounds:
          - "endpoints[POST /api/billing/run]"
          - "state_machines.Invoice"
        distinguishing_aspect: "The billing checkpoint finalizes exactly the OPEN invoices whose period_end <= now: first run at 2026-09-01 finalizes 1 (August) and opens September; an immediate second run finalizes 0 — the epoch advance is not repeatable without clock movement."
        test_recipe:
          setup: ["One customer with OPEN August invoice; clock at 2026-09-01"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "Run Co", credit_limit_cents: 50000 }, as: BillingAdmin, captures: { cRu: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BillingAdmin }
          trigger:
            - { call: "POST /api/billing/run", payload: {}, as: BillingAdmin, captures: { run1_n: $.data.finalized_count } }
            - { call: "POST /api/billing/run", payload: {}, as: BillingAdmin, captures: { run2_n: $.data.finalized_count } }
            - { call: "GET /api/invoices?customer_id=${cRu}&status=OPEN", as: BillingAdmin, captures: { invRu_ps: "$.data[0].period_start", invRu_st: "$.data[0].status" } }
          assert:
            - "First run: finalized_count == 1"
            - "Second run (same clock): finalized_count == 0"
            - "The single OPEN invoice now has period_start == 2026-09-01T00:00:00Z (September successor)"

      - name: cascading_side_effects_layer_covered
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.TemperatureExcursion"
          - "state_machines.RecallEvent"
        excluded_because:
          difficulty_instance: excursion_confirm_four_hop_cascade
          rationale: "Multi-hop cascades are asserted end-to-end by the three transitive_cascade instances in §1.8."

      - name: rate_threshold_layer_covered
        claim_type: rate_threshold_triggers
        grounds:
          - "calculations.dwell_surcharge"
          - "calculations.handling_out_estimate"
          - "calculations.zone_posture"
        excluded_because:
          difficulty_instance: dwell_tier_at_exactly_60_days
          rationale: "Threshold boundaries (dwell 60-day tier, volume tiers, posture) are asserted by §1.8 boundary/combinatorial instances; posture TIGHT band additionally covered by zone_posture_tight_threshold_boundary."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_accrued_charges
        claim_type: immediate_consistency
        grounds:
          - "complexity_profile.consistency_model"
          - "entities.Invoice.fields.handling_in_cents"
        distinguishing_aspect: "Immediate consistency: the handling-in charge is visible on the customer's OPEN invoice on the very next read after receipt completion — no billing run or reconciliation lag is required."
        test_recipe:
          setup: ["Customer with card A; receipt for 2 pallets completed"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Imm Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { cIm: $.data.id, cIm_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${cIm}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${cIm_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-IM", temp_class: FROZEN, capacity_pallets: 5, dock_doors: 2 }, as: WarehouseOperator, captures: { zIm: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${cIm}", zone_id: "${zIm}", product_code: "PEAS", lot_code: "IM", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 2, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${cIm}", captures: { rIm: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rIm}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rIm}/complete", payload: { actual_pallets: 2 }, as: WarehouseOperator }
          trigger:
            - { call: "GET /api/invoices?customer_id=${cIm}&status=OPEN", as: BillingAdmin, captures: { invIm_hi: "$.data[0].handling_in_cents", invIm_tot: "$.data[0].total_cents" } }
          assert:
            - "OPEN invoice.handling_in_cents == 2000 immediately (2 * 1000)"
            - "OPEN invoice.total_cents == 2000 (storage/dwell remain 0 until finalization)"
