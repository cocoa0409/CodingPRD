      - name: proration_mid_year_transfer_allocation
        claim_type: correct_result
        grounds: [calculations.ownership_proration, calculations.allocation_engine]
        distinguishing_aspect: "Chronological day-segment proration: a 2000bps transfer effective 2025-07-02 (181 days at 6000 / 184 at 4000) yields weighted days 1822000 vs 1828000, so a FINAL run computed after settle splits net ordinary 3650000 into exactly 1822000 and 1828000."
        test_recipe:
          setup: ["Fund B (fee 0) with T1 (6000bps) and T2 (4000bps); TaxYear 2025 (gross ordinary 3650000); SETTLED transfer T1 -> T2 of 2000bps effective and settled 2025-07-02 (default clock 2026-08-01 is past settlement)"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund K4", ein: "22-3000004", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
