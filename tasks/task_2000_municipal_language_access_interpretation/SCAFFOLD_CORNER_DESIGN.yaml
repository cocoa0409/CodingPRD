              payload: { department_id: "${dept_b_id}", language_code: "es", modality: "PHONE", encounter_setting: "GENERAL", scheduled_duration_minutes: 30 }
              as: DepartmentLiaison
              as_user_id: "${dept_a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE (HTTP 403); nothing persisted"

      - name: interpreter_cannot_complete_others_assignment
        claim_type: rbac_denial
        grounds: [roles, "validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Assignment ownership: interpreter Y (entity-backed) completing a request assigned to X -> 403 ERR_FORBIDDEN_ROLE; the request stays ASSIGNED."
        test_recipe:
          setup: ["Department D budget 1000000; contract ACTIVE (phone 50c/min); interpreters X (created at clock T) and Y (T+60s), both CERTIFIED [es] [PHONE] conf current, both 0 minutes — X wins the tie-break by created_at; request ASSIGNED to X"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Own", service_area_code: "SA-C36", annual_budget_cents: 1000000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_name: "VendorOwn", ceiling_cents: 500000, phone_per_minute_cents: 50, video_per_minute_cents: 75, in_person_per_minute_cents: 100, translation_per_word_cents: 20, in_person_travel_flat_cents: 2500 }
              as: LanguageAccessCoordinator
              captures: { contract_id: $.data.id }
            - call: "POST /vendor-contracts/${contract_id}/activate"
              as: LanguageAccessCoordinator
            - call: "POST /interpreters"
              payload: { full_name: "X Owner", language_codes: ["es"], modalities: ["PHONE"], tier: "CERTIFIED", vendor_contract_id: "${contract_id}" }
              as: LanguageAccessCoordinator
              captures: { x_id: $.data.id }
            - call: "PATCH /interpreters/${x_id}"
              payload: { confidentiality_signed: true }
              as: LanguageAccessCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:01:00Z" }
              as: LanguageAccessCoordinator
            - call: "POST /interpreters"
              payload: { full_name: "Y Other", language_codes: ["es"], modalities: ["PHONE"], tier: "CERTIFIED", vendor_contract_id: "${contract_id}" }
              as: LanguageAccessCoordinator
              captures: { y_id: $.data.id }
            - call: "PATCH /interpreters/${y_id}"
              payload: { confidentiality_signed: true }
              as: LanguageAccessCoordinator
            - call: "POST /interpretation-requests"
              payload: { department_id: "${dept_id}", language_code: "es", modality: "PHONE", encounter_setting: "GENERAL", scheduled_duration_minutes: 30 }
