              captures: { p_id: $.data.id }
            - call: "POST /facilities/${fac_id}/permits"
              payload: { patron_id: "${p_id}", start_at: "2026-09-06T10:00:00Z", end_at: "2026-09-06T12:00:00Z" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { perm_id: $.data.id }
            - call: "POST /permits/${perm_id}/payments"
              payload: { fee_component_cents: 20000, deposit_component_cents: 1500 }
              as: FinanceClerk
          trigger:
            - call: "POST /facilities/${fac_id}/permits/${perm_id}/grant"
              payload: { expected_facility_version: "${fac_v}" }
              as: RecCoordinator
              captures: { st: $.data.status, ff: $.data.final_fee_cents, dh: $.data.deposit_held_cents }
          assert:
            - "Grant response data.status == GRANTED"
