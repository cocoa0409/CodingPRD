            - { call: "POST /employer-groups", payload: { name: "G18", group_code: "G18", participation_minimum_pct: 0.0, participation_minimum_count: 0, proration_convention: "DAILY" }, as: CarrierAdmin, captures: { g18: $.data.id } }
