      - name: temporal_window_blocks_submission_after_seven_days
        claim_type: Temporal validation
        grounds:
          - validations[priority=13]
          - errors[ERR_APPEAL_WINDOW_CLOSED]
          - entities.Appeal.fields.filed_at_utc
        distinguishing_aspect: "A submission that is valid on the filing day becomes invalid purely through the passage of the logical clock, so the same call succeeds at day 6 and fails at day 7."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community with a banned account whose sanction is ACTIVE and an appeal filed but not submitted."
          setup_api_calls:
