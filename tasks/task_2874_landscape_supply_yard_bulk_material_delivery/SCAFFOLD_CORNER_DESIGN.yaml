          trigger:
            - call: "GET /materials/00000000-0000-0000-0000-00000000dead"
              payload: {}
              as: YardAdmin
            - call: "GET /price-schedules/00000000-0000-0000-0000-00000000dead"
              payload: {}
              as: YardAdmin
            - call: "GET /inventory-lots/00000000-0000-0000-0000-00000000dead"
              payload: {}
              as: YardAdmin
            - call: "GET /contractor-accounts/00000000-0000-0000-0000-00000000dead"
              payload: {}
              as: YardAdmin
            - call: "GET /job-purchase-orders/00000000-0000-0000-0000-00000000dead"
              payload: {}
              as: YardAdmin
            - call: "GET /prebuy-contracts/00000000-0000-0000-0000-00000000dead"
              payload: {}
              as: YardAdmin
            - call: "GET /material-orders/00000000-0000-0000-0000-00000000dead"
              payload: {}
              as: YardAdmin
            - call: "GET /order-lines/00000000-0000-0000-0000-00000000dead"
              payload: {}
              as: YardAdmin
            - call: "GET /delivery-trucks/00000000-0000-0000-0000-00000000dead"
              payload: {}
              as: DispatchPlanner
            - call: "GET /delivery-loads/00000000-0000-0000-0000-00000000dead"
              payload: {}
              as: DispatchPlanner
            - call: "GET /will-call-tickets/00000000-0000-0000-0000-00000000dead"
              payload: {}
              as: YardLoader
            - call: "GET /container-returns/00000000-0000-0000-0000-00000000dead"
              payload: {}
              as: YardLoader
            - call: "GET /claim-cases/00000000-0000-0000-0000-00000000dead"
              payload: {}
              as: ClaimsAdjuster
          assert:
            - "every trigger returns HTTP 404 with response_type \"error\" and a populated data.message"
            - "the error ids come back in trigger order: ERR_MATERIAL_NOT_FOUND, ERR_PRICE_SCHEDULE_NOT_FOUND, ERR_INVENTORY_LOT_NOT_FOUND, ERR_ACCOUNT_NOT_FOUND, ERR_PO_NOT_FOUND, ERR_PREBUY_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_ORDER_LINE_NOT_FOUND, ERR_TRUCK_NOT_FOUND, ERR_LOAD_NOT_FOUND, ERR_TICKET_NOT_FOUND, ERR_CONTAINER_RETURN_NOT_FOUND, ERR_CLAIM_NOT_FOUND"
            - "each response still carries meta.api_request_id and meta.api_request_timestamp"

      - name: insufficient_inventory_is_triggerable_when_no_single_lot_covers_the_line
        claim_type: error_triggerability
        grounds:
          - errors[ERR_INSUFFICIENT_INVENTORY]
          - validations[priority=32]
        distinguishing_aspect: "Lots are never split, so 9.00 net cubic yards spread over two 4.50 lots cannot serve a 6.0 cubic-yard line even though the material's available_net_cubic_yards is 9.00; the same order confirms once a single lot is large enough."
        test_recipe:
          setup:
            - "One material at 2000 cents/cy with two 5.0 cubic-yard intake lots (net 4.50 each, available_net 9.00) and an account with a 5000000 cent line holding a DRAFT 6.0 cubic-yard WILL_CALL order."
          setup_api_calls:
            - call: "POST /materials"
              payload: { sku: "AGG-X1", name: "Split Stone", offered_forms: [BULK], seasonal_category: "AGGREGATE", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10, moisture_pct: 15.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: false }
              as: YardAdmin
              captures: { mat_id: $.data.id, mat_ver: $.data.version }
            - call: "POST /price-schedules"
              payload: { material_id: "${mat_id}", effective_from: "2026-07-01T00:00:00.000Z", bulk_price_per_cubic_yard_cents: 2000, bagged_price_per_bag_cents: 899, seasonal_surcharge_pct: 0.0, expected_material_version: "${mat_ver}" }
              as: YardAdmin
            - call: "POST /inventory-lots"
              payload: { material_id: "${mat_id}", gross_cubic_yards: 5.0, moisture_pct_at_intake: 15.0 }
              as: YardAdmin
            - call: "POST /inventory-lots"
              payload: { material_id: "${mat_id}", gross_cubic_yards: 5.0, moisture_pct_at_intake: 15.0 }
              as: YardAdmin
            - call: "POST /contractor-accounts"
              payload: { business_name: "Split Landscapes", credit_limit_cents: 5000000, po_required: false, driveway_protection_required: false }
              as: YardAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /material-orders"
              payload: { contractor_account_id: "${acct_id}", fulfillment_mode: "WILL_CALL" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /order-lines"
              payload: { material_order_id: "${ord_id}", material_id: "${mat_id}", form: "BULK", quantity: 6.0 }
              as: Contractor
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /material-orders/${ord_id}/confirm"
              payload: {}
              as: Contractor
              as_user_id: "${acct_id}"
            - call: "POST /inventory-lots"
              payload: { material_id: "${mat_id}", gross_cubic_yards: 10.0, moisture_pct_at_intake: 15.0 }
              as: YardAdmin
              captures: { big_lot: $.data.id }
            - call: "POST /material-orders/${ord_id}/confirm"
              payload: {}
              as: Contractor
              as_user_id: "${acct_id}"
          assert:
            - "trigger 1: HTTP 409 with data.error_id == \"ERR_INSUFFICIENT_INVENTORY\"; the order stays DRAFT, both lots keep reserved_cubic_yards 0.00 and no line has an inventory_lot_id"
            - "trigger 2: HTTP 201 with net_sellable_cubic_yards == 9.00, lifting Material.available_net_cubic_yards to 18.00"
            - "trigger 3: HTTP 200 with fulfillment_status == CONFIRMED and quoted_total_cents == 12000; the line pins ${big_lot} (the only lot whose 9.00 net covers 6.0) and that lot's reserved_cubic_yards == 6.00 while the two small lots stay at 0.00"

  - section: rbac
    instances:
      - name: each_role_can_run_one_of_its_exclusive_operations
        claim_type: exclusive_operations
        grounds:
          - roles.YardAdmin
          - roles.CreditManager
          - roles.DispatchPlanner
          - roles.YardLoader
          - roles.ClaimsAdjuster
          - roles.Contractor
        distinguishing_aspect: "Six calls, one per role, each on an endpoint whose roles list names only that role, so the sweep proves the six grants are live and disjoint rather than a single permissive check."
        test_recipe:
          setup:
            - "One material with an EFFECTIVE price row and a 100 cubic-yard lot, one ACTIVE account with a CONFIRMED 4.0 cubic-yard WILL_CALL order, a QUEUED ticket requested at 2026-07-31T07:00 and a SUBMITTED short-load claim on that order."
          setup_api_calls:
            - call: "POST /materials"
              payload: { sku: "AGG-R1", name: "Role Stone", offered_forms: [BULK], seasonal_category: "AGGREGATE", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10, moisture_pct: 15.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: false }
              as: YardAdmin
              captures: { mat_id: $.data.id, mat_ver: $.data.version }
            - call: "POST /price-schedules"
              payload: { material_id: "${mat_id}", effective_from: "2026-07-01T00:00:00.000Z", bulk_price_per_cubic_yard_cents: 2000, bagged_price_per_bag_cents: 899, seasonal_surcharge_pct: 0.0, expected_material_version: "${mat_ver}" }
              as: YardAdmin
            - call: "POST /inventory-lots"
              payload: { material_id: "${mat_id}", gross_cubic_yards: 100.0, moisture_pct_at_intake: 15.0 }
              as: YardAdmin
            - call: "POST /contractor-accounts"
              payload: { business_name: "Role Landscapes", credit_limit_cents: 5000000, po_required: false, driveway_protection_required: false }
              as: YardAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /material-orders"
              payload: { contractor_account_id: "${acct_id}", fulfillment_mode: "WILL_CALL" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /order-lines"
              payload: { material_order_id: "${ord_id}", material_id: "${mat_id}", form: "BULK", quantity: 4.0 }
              as: Contractor
              as_user_id: "${acct_id}"
            - call: "POST /material-orders/${ord_id}/confirm"
              payload: {}
              as: Contractor
              as_user_id: "${acct_id}"
            - call: "POST /will-call-tickets"
              payload: { material_order_id: "${ord_id}", requested_pickup_at: "2026-07-31T07:00:00.000Z" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { ticket_id: $.data.id }
            - call: "POST /claim-cases"
              payload: { material_order_id: "${ord_id}", claim_type: "SHORT_LOAD", claimed_amount_cents: 1000, description: "Bucket count looked light.", will_call_ticket_id: "${ticket_id}" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { claim_id: $.data.id }
            - call: "GET /contractor-accounts/${acct_id}"
              payload: {}
              as: CreditManager
              captures: { acct_ver: $.data.version }
          trigger:
            - call: "PATCH /materials/${mat_id}"
              payload: { moisture_pct: 16.0 }
              as: YardAdmin
            - call: "POST /contractor-accounts/${acct_id}/credit-adjustments"
              payload: { new_credit_limit_cents: 6000000, memo: "Seasonal increase.", expected_contractor_account_version: "${acct_ver}" }
              as: CreditManager
            - call: "POST /delivery-trucks"
              payload: { truck_code: "TND-R1", axle_class: "TANDEM", max_payload_lb: 40000, bed_capacity_cubic_yards: 12.0, min_driveway_access_class: "CLASS_B" }
              as: DispatchPlanner
            - call: "POST /will-call-tickets/stage-next"
              payload: { staging_window_start: "2026-08-01T09:00:00.000Z", staging_window_end: "2026-08-01T10:00:00.000Z" }
              as: YardLoader
              as_user_id: "loader-r1"
            - call: "POST /claim-cases/${claim_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adjuster-r1"
            - call: "POST /material-orders"
              payload: { contractor_account_id: "${acct_id}", fulfillment_mode: "WILL_CALL" }
              as: Contractor
              as_user_id: "${acct_id}"
          assert:
            - "trigger 1: HTTP 200 (YardAdmin owns material maintenance) with moisture_pct == 16.00 and effective_density_lb_per_cubic_yard recomputed to 1010.00"
            - "trigger 2: HTTP 200 (CreditManager owns the credit line) with credit_limit_cents == 6000000 and version incremented by 1"
            - "trigger 3: HTTP 201 (DispatchPlanner owns the fleet) with status == AVAILABLE"
            - "trigger 4: HTTP 200 (YardLoader owns the yard queue) staging ${ticket_id} into STAGED"
            - "trigger 5: HTTP 200 (ClaimsAdjuster owns claim review) with status == UNDER_REVIEW and review_round == 1"
            - "trigger 6: HTTP 201 (only a Contractor may open an order) with fulfillment_status == DRAFT"

      - name: other_roles_exclusive_operations_are_rejected_with_403
        claim_type: unauthorized_operations
        grounds:
          - roles.YardAdmin
          - roles.CreditManager
          - roles.DispatchPlanner
          - roles.YardLoader
          - roles.ClaimsAdjuster
          - roles.Contractor
        distinguishing_aspect: "Authorisation sits at priority 2, above path existence at priority 6, so each cross-role attempt returns 403 even when the target id does not exist at all — the wrong role never learns whether the row is there."
        test_recipe:
          setup:
            - "One account (so the credit-adjustment attempt carries a real id and a real version), and nothing else; the claim id below is deliberately unused."
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { business_name: "Forbidden Landscapes", credit_limit_cents: 500000, po_required: false, driveway_protection_required: false }
              as: YardAdmin
              captures: { acct_id: $.data.id, acct_ver: $.data.version }
          trigger:
            - call: "POST /materials"
              payload: { sku: "AGG-R2", name: "Forbidden Stone", offered_forms: [BULK], seasonal_category: "AGGREGATE", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10 }
              as: Contractor
              as_user_id: "contractor-r2"
            - call: "POST /delivery-trucks"
              payload: { truck_code: "TND-R2", axle_class: "TANDEM", max_payload_lb: 40000, bed_capacity_cubic_yards: 12.0, min_driveway_access_class: "CLASS_B" }
              as: YardLoader
              as_user_id: "loader-r2"
            - call: "POST /claim-cases/00000000-0000-0000-0000-00000000beef/start-review"
              payload: {}
              as: DispatchPlanner
              as_user_id: "planner-r2"
            - call: "POST /contractor-accounts/${acct_id}/credit-adjustments"
              payload: { new_credit_limit_cents: 900000, memo: "Not my desk.", expected_contractor_account_version: "${acct_ver}" }
              as: ClaimsAdjuster
              as_user_id: "adjuster-r2"
            - call: "POST /material-orders"
              payload: { contractor_account_id: "${acct_id}", fulfillment_mode: "WILL_CALL" }
              as: YardAdmin
              as_user_id: "admin-r2"
            - call: "POST /will-call-tickets/stage-next"
              payload: { staging_window_start: "2026-08-01T09:00:00.000Z", staging_window_end: "2026-08-01T10:00:00.000Z" }
              as: CreditManager
              as_user_id: "credit-r2"
          assert:
            - "every trigger returns HTTP 403 with data.error_id == \"ERR_UNAUTHORIZED\""
            - "trigger 3 returns 403 rather than 404 even though the claim id does not exist, and trigger 4 returns 403 rather than touching ContractorAccount.${acct_id}.credit_limit_cents (still 500000, version still ${acct_ver})"
            - "no Material, DeliveryTruck, MaterialOrder or WillCallTicket row is created — GET /materials returns total_count 0"

      - name: unauthenticated_and_unknown_role_requests_are_rejected_with_401
        claim_type: unauthenticated
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
        distinguishing_aspect: "Authentication is priority 1, so a missing role header, an empty-string X-User-ID and a role spelled outside the six declared names all fail before any payload or authorisation reasoning happens."
        test_recipe:
          setup:
            - "No domain rows are needed. The X-User-ID values below are literal empty strings, not spaces."
          setup_api_calls:
            - call: "GET /materials"
              payload: { limit: 10, offset: 0 }
              as: YardAdmin
          trigger:
            - call: "GET /materials"
              payload: { limit: 10, offset: 0 }
              as: "__OMIT_ROLE_HEADER__"
              as_user_id: "admin-r3"
            - call: "GET /materials"
              payload: { limit: 10, offset: 0 }
              as: YardAdmin
              as_user_id: "__OMIT_USER_HEADER__"
            - call: "GET /materials"
              payload: { limit: 10, offset: 0 }
              as: YardAdmin
              as_user_id: ""
            - call: "POST /materials"
              payload: { sku: "AGG-R3", name: "Unknown Role Stone", offered_forms: [BULK], seasonal_category: "AGGREGATE", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10 }
              as: "YardManager"
              as_user_id: "manager-r3"
          assert:
            - "trigger 1: the X-User-Role header is omitted entirely -> HTTP 401 with data.error_id == \"ERR_UNAUTHENTICATED\""
            - "trigger 2: the X-User-ID header is omitted entirely -> HTTP 401 with data.error_id == \"ERR_UNAUTHENTICATED\""
            - "trigger 3: X-User-ID is sent as the empty string -> HTTP 401 with data.error_id == \"ERR_UNAUTHENTICATED\""
            - "trigger 4: X-User-Role is \"YardManager\", outside the six declared roles -> HTTP 401 (not 403) and no Material row is created"

      - name: contractor_reading_another_accounts_rows_is_rejected_with_403
        claim_type: account_scope
        grounds:
          - errors[ERR_ACCOUNT_SCOPE_VIOLATION]
          - validations[priority=3]
        distinguishing_aspect: "Contractor is a legitimate role on both read endpoints, so the block comes from the priority-3 scope rule comparing X-User-ID against the row's contractor_account_id — and the owning contractor still reads the very same rows."
        test_recipe:
          setup:
            - "Two accounts A and B; account B owns one DRAFT WILL_CALL order."
          setup_api_calls:
            - call: "POST /contractor-accounts"
              payload: { business_name: "Scope A", credit_limit_cents: 500000, po_required: false, driveway_protection_required: false }
              as: YardAdmin
              captures: { acct_a: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Scope B", credit_limit_cents: 500000, po_required: false, driveway_protection_required: false }
              as: YardAdmin
              captures: { acct_b: $.data.id }
            - call: "POST /material-orders"
              payload: { contractor_account_id: "${acct_b}", fulfillment_mode: "WILL_CALL" }
              as: Contractor
              as_user_id: "${acct_b}"
              captures: { ord_b: $.data.id }
          trigger:
            - call: "GET /material-orders/${ord_b}"
              payload: {}
              as: Contractor
              as_user_id: "${acct_a}"
            - call: "GET /contractor-accounts/${acct_b}"
              payload: {}
              as: Contractor
              as_user_id: "${acct_a}"
            - call: "GET /material-orders/${ord_b}"
              payload: {}
              as: Contractor
              as_user_id: "${acct_b}"
            - call: "GET /material-orders/${ord_b}"
              payload: {}
              as: CreditManager
              as_user_id: "credit-r4"
          assert:
            - "trigger 1: HTTP 403 with data.error_id == \"ERR_ACCOUNT_SCOPE_VIOLATION\""
            - "trigger 2: HTTP 403 with data.error_id == \"ERR_ACCOUNT_SCOPE_VIOLATION\""
            - "trigger 3: HTTP 200 — the owning contractor sees the order (fulfillment_status DRAFT)"
            - "trigger 4: HTTP 200 — staff roles are not account-scoped"

      - name: same_user_cannot_dispatch_a_load_and_decide_its_claim
        claim_type: segregation_of_duties
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES]
