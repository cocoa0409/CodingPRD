      - name: ingredient_approval_gated_by_verified_document_set_of_its_supplier
        grounds:
          - validations.priority_23
          - validations.priority_24
          - errors.ERR_REQUIRED_SUPPLIER_DOCS_MISSING
          - entities.Ingredient.fields.verified_doc_types
          - entities.SupplierDocument.fields.lab_ppm_claim
          - state_machines.SupplierDocument.PENDING_to_VERIFIED
          - state_machines.Ingredient.UNDER_REVIEW_to_APPROVED
          - entities.Supplier.fields.verified_document_count
        distinguishing_aspect: |
          Approval of one entity is gated by the aggregate VERIFIED state of a sibling collection
          on a third entity: a HIGH_RISK_GRAIN ingredient needs all three of ALLERGEN_STATEMENT,
          PROCESS_FLOW and COA verified, and a COA that merely EXISTS in PENDING does not count.
          The instance holds a positive control in the same supplier - an otherwise identical
          HIGH_RISK_GRAIN ingredient whose COA was verified at a lab_ppm_claim of exactly 5, the
          cap for its risk class - so a naive implementation that counts documents rather than
          verified doc_types, or that applies the GF_PROCESSED cap of 10, fails one of the two.
        test_recipe:
          setup:
            - "One applicant and one supplier."
            - "Ingredient A (HIGH_RISK_GRAIN) has an ALLERGEN_STATEMENT and a PROCESS_FLOW verified and a COA that was submitted but never verified, so verified_doc_types holds exactly two of the three required types; A is UNDER_REVIEW."
            - "Ingredient B (HIGH_RISK_GRAIN, the positive control) has all three documents verified, its COA carrying lab_ppm_claim exactly 5 (the HIGH_RISK_GRAIN cap, accepted at the boundary), and has already been APPROVED through the same review endpoint."
            - "Supplier.verified_document_count is therefore 5: two for A and three for B, with A's PENDING COA excluded."
