            - "Clock 2026-08-01T00:00:00Z; facility NRH, department DEPT-A1, asset A1 (adjusted RULS 30.00)."
            - "Cycle C1 plan_year 2027 driven to ALLOCATED; request R1 SCORED (composite 66.18)."
            - "Members: M1 seat CHAIR weight 3 with department_id DEPT-A1 (so M1 is excluded from E by the department conflict but may still close voting under V36), M2 seat FINANCE weight 2 system-wide."
            - "M2 casts APPROVE, moving R1 to IN_COMMITTEE with one non-superseded ballot of counted_weight 2; E = {M2}, quorum_weight 2."
            - "M2 is then deactivated with PATCH active false."
