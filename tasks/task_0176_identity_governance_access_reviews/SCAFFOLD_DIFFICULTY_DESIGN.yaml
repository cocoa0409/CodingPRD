            - call: "POST /identities/${c7}/grants"
              payload: { entitlement_id: "${entc}", expected_identity_version: "${c7v}" }
              as: AccessManager
              captures: { gc7: $.data.id }
            - call: "POST /certification-campaigns"
              payload: { name: "CampC", scope_role_id: "${rolec}", review_window_start: "2026-06-01T00:00:00Z", review_window_end: "2026-06-30T00:00:00Z" }
              as: CampaignAdmin
              captures: { campc: $.data.id }
            - call: "POST /certification-campaigns/${campc}/launch"
              payload: {}
              as: CampaignAdmin
            - call: "GET /certification-items?grant_id=${gc1}"
              payload: {}
              as: Certifier
              captures: { it1: $.data.0.id }
            - call: "POST /certification-items/${it1}/certify"
