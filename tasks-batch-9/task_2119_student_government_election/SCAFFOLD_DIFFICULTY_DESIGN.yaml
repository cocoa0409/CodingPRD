        grounds:
          - calculations.venue_booking_occupation
          - validations[priority=16]
          - errors[ERR_VENUE_DOUBLE_BOOKED]
          - entities.CampaignExpense.fields.venue_code
        distinguishing_aspect: |
          A different resource entity (CampaignExpense venue bookings) with the opposite geometry:
          closed intervals widened by TEARDOWN_BUFFER_MINUTES = 30 on both sides, so a rally
          starting 30 minutes after another ends is still rejected, whereas the election-calendar
          rule accepts exact adjacency.
        test_recipe:
          setup:
            - "One election in PETITIONING with one office and two DRAFT candidacies c_1 and c_2 belonging to different students."
            - "c_1 already holds an EVENT booking of QUAD-A for [2026-08-20T18:00:00Z, 2026-08-20T20:00:00Z], whose buffered interval is [17:30, 20:30]."
