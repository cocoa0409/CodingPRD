          - roles.Underwriter.description
          - errors.ERR_INSUFFICIENT_PERMISSIONS
        distinguishing_aspect: "Escalation resolution belongs to ChannelManager only, so an Underwriter — who owns the loan's forward transitions — is refused on the escalation route."
        test_recipe:
          setup:
            - "Logical clock 2026-09-20T00:00:00Z. Broker B approved with a loan in underwriting and one open escalation."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic
            - *k_fin
            - *k_fin_pass
            - *k_pe
            - *k_pe_app
            - *k_plan
            - *k_approve
            - *k_sheet
            - *k_quote
            - *k_submit
            - *k_uw
            - call: "POST /wholesale-channel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /wholesale-channel/loan-submissions/${l}/turn-time-escalations"
              payload: {}
              as: Any
              captures: { esc_rbac: "$.data[0].id" }
          trigger:
            - call: "POST /wholesale-channel/turn-time-escalations/${esc_rbac}/resolve"
              payload: { resolution_note: "underwriter attempting to resolve" }
              as: Underwriter
              as_user_id: "uw-dana"
              captures: { error_id_esc_role: $.data.error_id }
          assert:
            - "the response status is 403 and error_id_esc_role == ERR_INSUFFICIENT_PERMISSIONS"
            - "GET /wholesale-channel/loan-submissions/${l}/turn-time-escalations reports the escalation is still OPEN"

      - name: analyst_cannot_underwrite_and_channel_manager_cannot_review_quality
        claim_type: RBAC denial
        grounds:
          - roles.QualityControlAnalyst.exclusive_operations
          - roles.ChannelManager.exclusive_operations
          - errors.ERR_INSUFFICIENT_PERMISSIONS
        distinguishing_aspect: "The two operational roles hold disjoint exclusive operations: the analyst is refused on the underwriting route and the channel manager is refused on the QC creation route."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B approved with a submitted loan and a funded loan."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic
