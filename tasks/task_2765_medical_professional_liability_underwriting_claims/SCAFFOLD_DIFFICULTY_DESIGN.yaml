      - name: adequacy_ratio_of_exactly_zero_point_nine_thousand_is_adequate_and_approvable
        grounds:
          - calculations.reserve_adequacy_ratio
          - validations[priority=57]
          - entities.RateFiling.fields.adequacy_flag
          - entities.RateFiling.fields.reserve_adequacy_ratio
        distinguishing_aspect: |
          A single in-scope claim needing 835200.00 and carrying exactly 751680.00 produces a ratio
          of exactly 0.9000, which the inclusive DEFICIENT/ADEQUATE boundary must classify as
          ADEQUATE so that priority 57 lets the filing be approved rather than blocking it with
          ERR_RESERVE_DEFICIENCY_BLOCKS_FILING.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; OBSTETRICS_GYNECOLOGY class, COOK_IL insured (venue factor 1.45), IN_FORCE claims-made term."
            - "One COVERED claim: demand 1000000.00 -> BAND_3 factor 0.45, so required reserve is round(1000000.00 * 0.45 * 1.45 * 1.28, 2) = 835200.00."
            - "A CASE_BASIS reserve entry of indemnity 600000.00 plus expense 151680.00 carries exactly 751680.00, which is 0.90 of the requirement."
            - "Filing prepared and submitted by act-1 so that chief-1 can decide it."
          setup_api_calls:
