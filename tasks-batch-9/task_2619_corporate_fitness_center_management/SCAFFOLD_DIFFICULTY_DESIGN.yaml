              as: SiteManager
              as_user_id: "${mgr_id}"
              captures: { off_id: $.data.id }
            - call: "POST /program-offerings/${off_id}/status-changes"
              payload: { action: "ACTIVATE" }
              as: SiteManager
              as_user_id: "${mgr_id}"
            - call: "POST /program-sessions"
              payload: { offering_id: "${off_id}", room_id: "${room_a_id}", scheduled_start_utc: "2026-08-05T12:00:00Z", scheduled_end_utc: "2026-08-05T12:55:00Z", forecast_attendance: 3, direct_supply_cost_cents: 0 }
              as: SiteManager
              as_user_id: "${mgr_id}"
              captures: { sess_a_id: $.data.id }
            - call: "POST /program-sessions"
              payload: { offering_id: "${off_id}", room_id: "${room_a_id}", scheduled_start_utc: "2026-08-12T12:00:00Z", scheduled_end_utc: "2026-08-12T12:55:00Z", forecast_attendance: 3, direct_supply_cost_cents: 0 }
              as: SiteManager
              as_user_id: "${mgr_id}"
              captures: { sess_b_id: $.data.id }
            - call: "POST /program-sessions/${sess_a_id}/status-changes"
              payload: { action: "CANCEL", cancel_reason: "NO_COVER" }
              as: SiteManager
              as_user_id: "${mgr_id}"
            - call: "POST /program-sessions/${sess_b_id}/status-changes"
              payload: { action: "CANCEL", cancel_reason: "NO_COVER" }
              as: SiteManager
              as_user_id: "${mgr_id}"
            - call: "GET /client-contracts/${c_id}"
              payload: {}
              as: OperatorAdmin
              captures: { c_ver: $.data.version }
          trigger:
            - call: "POST /monthly-invoices"
              payload: { contract_id: "${c_id}", period_month: "2026-08", expected_contract_version: "${c_ver}" }
              as: OperatorAdmin
              captures: { inv_id: $.data.id }
          assert:
            - "MonthlyInvoice.${inv_id}.fee_structure_snapshot == \"MANAGEMENT_FEE\""
            - "MonthlyInvoice.${inv_id}.gross_amount_cents == 40000"
            - "MonthlyInvoice.${inv_id}.admin_markup_cents == 0"
            - "MonthlyInvoice.${inv_id}.volume_credit_cents == 0"
            - "MonthlyInvoice.${inv_id}.labor_subtotal_cents == 0"
            - "MonthlyInvoice.${inv_id}.program_direct_cost_cents == 0"
            - "MonthlyInvoice.${inv_id}.downtime_credit_cents == 0"
            - "MonthlyInvoice.${inv_id}.coverage_penalty_cents == 600"
            - "MonthlyInvoice.${inv_id}.net_amount_cents == 39400"
            - "MonthlyInvoice.${inv_id}.nte_capped == false"
            - "MonthlyInvoice.${inv_id}.status == \"DRAFT\""
            - "ClientContract.${c_id}.uncovered_session_count == 2"
            - "ClientContract.${c_id}.pending_penalty_cents == 600"

      # ---------------------------------------------------------------- 2 / 2 --
