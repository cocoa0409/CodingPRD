      - name: enrollment_center_mismatch_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority=18]", "errors[ERR_CENTER_MISMATCH]"]
        distinguishing_aspect: "The applicant is ASSIGNED to center A (its only WELDING seat pool); enrolling into center B's CARPENTRY program fails with ERR_CENTER_MISMATCH even though the program is OPEN and the applicant is eligible."
        test_recipe:
          setup: ["center A with WELDING program; center B with CARPENTRY program; applicant (desired trade WELDING) assigned to A"]
          setup_api_calls:
            - { call: "POST /jc/centers", payload: { name: "Mismatch A", region_code: "R-NORTH", total_beds: 4 }, as: OperatorAdmin, captures: { ca: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${ca}", trade_code: "WELDING", capacity: 3 }, as: OperatorAdmin, captures: { pa: $.data.id } }
