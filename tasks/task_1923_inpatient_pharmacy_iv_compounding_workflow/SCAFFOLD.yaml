    side_effects: []
  - method: GET
    path: /pharmacy/drug-products/{id}
    description: "Fetch one drug"
    roles: [PharmacyAdmin, Prescriber, Pharmacist, PharmacyTechnician, Nurse, DiversionOfficer]
    code: 200
    input: []
    output: DrugProduct
    side_effects: []
  - method: GET
    path: /pharmacy/drug-products
    description: "List drugs"
    roles: [PharmacyAdmin, Prescriber, Pharmacist, PharmacyTechnician, Nurse, DiversionOfficer]
    code: 200
    input: ["status?", "is_hazardous?", "schedule?", "in_shortage?", "limit?", "offset?"]
    output: DrugProduct[]
    side_effects: []
  - method: PATCH
    path: /pharmacy/drug-products/{id}
