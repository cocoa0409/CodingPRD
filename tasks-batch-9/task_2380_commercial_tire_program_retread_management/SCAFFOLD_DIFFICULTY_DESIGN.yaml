            - call: "POST /casings/${casing_id}/collect"
              payload: { collected_at_location_id: "${loc_id}" }
              as: TireTechnician
              captures: { casing_v2: $.data.version }
            - call: "POST /casings/${casing_id}/inspect"
              payload: { grade: "A", expected_casing_version: "${casing_v2}" }
              as: CasingInspector
              as_user_id: "inspector-1"
            - call: "POST /retread-jobs"
              payload: { casing_id: "${casing_id}", retread_line_id: "${line_id}", tread_design_code: "TD-DRIVE-A", scheduled_start_at: "2026-09-01T08:00:00Z", scheduled_end_at: "2026-09-01T12:00:00Z" }
              as: PlantScheduler
              captures: { job_id: $.data.id }
            - call: "POST /retread-jobs/${job_id}/start"
              payload: { started_at: "2026-09-01T08:00:00Z" }
              as: PlantScheduler
            - call: "POST /retread-jobs/${job_id}/complete"
              payload: { completed_at: "2026-09-01T12:00:00Z", cost_basis_cents: 30000 }
              as: PlantScheduler
              captures: { new_asset_id: $.data.produced_tire_asset_id }
            - call: "POST /tire-assets/${new_asset_id}/mount"
              payload: { vehicle_id: "${veh_id}", position: "DRIVE", mounted_at: "2026-09-02T09:00:00Z", odometer_at_mount: 5000, tread_depth_at_mount_32nds: 24 }
              as: TireTechnician
          assert:
            - "Casing.${casing_id}.status observed in order: COLLECTED, INSPECTED, RETREAD_QUEUED, IN_RETREAD, RETREADED, ON_WHEEL"
            - "Casing.${casing_id}.status == ON_WHEEL at the end of the loop — the initial state, reached again"
            - "Casing.${casing_id}.retread_count == 1 and inspection_grade == null after the loop"
            - "Casing.${casing_id}.collected_at_location_id == null after the mount hop"
            - "ServiceLocation.${loc_id}.casings_in_holding_count == 0 after the mount hop"

      - name: road_service_call_parallel_dispatch_and_billing_dimensions
        grounds:
          - state_machines.RoadServiceCall.OPEN_to_DISPATCHED
          - state_machines.RoadServiceCall.ON_SITE_to_COMPLETED
          - state_machines.RoadServiceCall.UNBILLED_to_INVOICED
          - state_machines.RoadServiceCall.BILLED_TO_NATIONAL_to_UNBILLED
          - entities.RoadServiceCall.fields.dispatch_status
          - entities.RoadServiceCall.fields.billing_status
        distinguishing_aspect: |
          PARALLEL STATE DIMENSIONS on entity RoadServiceCall: dispatch_status advances
          OPEN -> DISPATCHED -> ON_SITE -> COMPLETED without ever moving billing_status off
          UNBILLED, and billing_status later advances UNBILLED -> INVOICED ->
          BILLED_TO_NATIONAL -> UNBILLED while dispatch_status stays frozen at COMPLETED.
