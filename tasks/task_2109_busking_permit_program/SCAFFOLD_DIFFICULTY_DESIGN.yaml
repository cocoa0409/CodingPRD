              as: PermitOfficer
              as_user_id: "officer-beta"
            - call: "GET /busking/permits?application_id=${app_a}"
              as: PermitOfficer
              captures: { permit_a: "$.data[0].id" }
            - call: "GET /busking/permits/${permit_a}/fee-invoices"
              as: PermitOfficer
              captures: { inv_a: "$.data[0].id" }
            - call: "POST /busking/fee-invoices/${inv_a}/payments"
              payload: { amount_cents: 5400 }
              as: Performer
              as_user_id: "${perf_a}"
            - call: "GET /busking/permits/${permit_a}"
              as: PermitOfficer
              captures: { pv1: "$.data.version" }
            - call: "POST /busking/session-bookings"
              payload: { permit_id: "${permit_a}", pitch_id: "${p4}", start_at: "2026-08-10T20:00:00Z", end_at: "2026-08-10T21:00:00Z", expected_permit_version: "${pv1}", amplification_planned: false }
              as: Performer
