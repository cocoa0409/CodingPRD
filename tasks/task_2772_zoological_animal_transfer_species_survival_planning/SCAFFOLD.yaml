scenario: |
  2772. Zoological Animal Transfer & Species Survival Planning (accredited zoological institution):
  population management plans with breeding and transfer recommendations from a coordinating body,
  genetic and demographic analysis informing pairing and holding decisions, transfer agreement
  negotiation covering ownership, breeding rights and offspring disposition, pre-shipment testing,
  quarantine and health certificate requirements with interstate and international permits, crate
  training, transport logistics and temperature-controlled shipping arrangements, introduction
  protocols at the receiving institution with behavioral monitoring, record keeping in the
  international species database with studbook submissions, accreditation standards compliance and
  disposition policy for surplus animals

domain_name: zoological-transfer-ssp
api_prefix: "/"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Twelve peer entities linked by explicit foreign keys; no entity is nested in a URL path.
  # Every collection lives directly under the root, e.g. /animals, /transfer-agreements.

  state_machine_shape: cyclic
  # TransferAgreement cycles OFFERED <-> COUNTERED across negotiation rounds; IntroductionProtocol
  # regresses FULL_CONTACT -> PARTIAL_CONTACT -> HOWDY on aggression breach; Animal carries two
  # independent parallel dimensions (location_status x genetic_designation); SpeciesProgram is a
  # compound machine whose CYCLE_CLOSED state derives from its children's aggregate state.

  relationship_patterns:
    - one_to_many          # SpeciesProgram -> Animal, TransferAgreement -> ComplianceDocument
    - self_referential     # Animal.sire_id / Animal.dam_id reference Animal.id (pedigree)
    - cross_aggregate      # QuarantineOccupancy references Institution, Animal and TransferAgreement
    - polymorphic          # ComplianceDocument.document_type selects issuing authority and field set

  role_model: segregation_of_duties
  # The party that made the last negotiation action may not accept it; the veterinarian who issues
  # the pre-shipment health certificate may not clear the receiving quarantine.

  consistency_model: immediate

difficulty_level: expert_plus
# 12 entities / 55 endpoints / 44 error codes / 10 state machines / 8 calculations with 6 variants.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: SpeciesProgram
    parent: null
    common_fields: true
    fields:
      - name: taxon_name
        type: string
        source: input
        description: "Scientific name of the managed taxon, e.g. Panthera uncia."
      - name: program_type
        type: enum
        source: input
        description: "Coordinating-body management tier; drives PROGRAM_WEIGHT in demographic_need_index."
        constraints: "one of SSP_GREEN | SSP_YELLOW | SSP_RED | STUDBOOK_ONLY"
      - name: target_population_size
        type: integer
        source: input
        description: "Target managed population for the current plan cycle."
        constraints: ">= 1"
      - name: studbook_keeper_name
        type: string
        source: input
        description: "Name of the studbook keeper of record at the coordinating body."
      - name: plan_status
        type: enum
        source: system
        description: "Lifecycle of the population management plan."
        default: DRAFT
        constraints: "one of DRAFT | PUBLISHED | CYCLE_CLOSED"
      - name: current_plan_cycle
        type: integer
        source: system
        description: "Plan cycle ordinal stamped onto every recommendation created while PUBLISHED."
        default: 1
      - name: current_population_count
        type: integer
        source: computed
        description: "count(Animal where species_program_id == this.id AND location_status IN {HELD, RESERVED, IN_TRANSIT, IN_QUARANTINE, AWAITING_INTRODUCTION, INTRODUCING}); DISPOSED animals excluded."
      - name: open_recommendation_count
        type: integer
        source: computed
        description: "count(PopulationRecommendation where species_program_id == this.id AND plan_cycle == this.current_plan_cycle AND status IN {PROPOSED, ENDORSED})."
      - name: cycle_closed_on
        type: datetime
        source: system
        description: "Logical-clock instant at which plan_status became CYCLE_CLOSED; null while open."
        default: null

  - name: Institution
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Accredited zoological institution name."
      - name: jurisdiction_code
        type: string
        source: input
        description: "Regulatory jurisdiction as COUNTRY-SUBDIVISION, e.g. US-CA, US-TX, CA-ON. The substring before the first '-' is the country code used to derive TransferAgreement.transfer_scope."
        constraints: "matches ^[A-Z]{2}-[A-Z0-9]{2,3}$"
      - name: accreditation_status
        type: enum
        source: input
        description: "Accreditation standing with the accrediting association."
        default: ACCREDITED
        constraints: "one of ACCREDITED | PROVISIONAL | SUSPENDED | TERMINATED"
      - name: accreditation_expires_on
        type: string
        source: input
        description: "ISO 8601 calendar date (YYYY-MM-DD) on which the current accreditation term ends."
      - name: holding_capacity_slots
        type: integer
        source: input
        description: "Maximum number of managed animals the institution may hold or hold-in-reserve."
        constraints: ">= 0"
      - name: disposition_policy_on_file
        type: boolean
        source: input
        description: "True when a written disposition policy for surplus animals is on file with the accrediting association."
        default: false
      - name: occupied_slots
        type: integer
        source: computed
        description: "count(Animal where holding_institution_id == this.id AND location_status IN {HELD, IN_QUARANTINE, AWAITING_INTRODUCTION, INTRODUCING})."
      - name: reserved_slots
        type: integer
        source: computed
        description: "count(TransferAgreement where receiving_institution_id == this.id AND status == EXECUTED AND its animal.location_status IN {RESERVED, IN_TRANSIT})."
      - name: transfer_credit_balance
        type: number
        source: computed
        description: "Signed double-entry ledger of transfer credit points; credited on outbound transfer, debited on inbound. 2 decimal places."
        default: 0.00
      - name: compliance_points_balance
        type: number
        source: computed
        description: "Running sum of StudbookSubmission.total_compliance_points for this institution. 2 decimal places."
        default: 0.00

  - name: Veterinarian
    parent: null
    common_fields: true
    fields:
      - name: institution_id
        type: string
        source: input
        description: "FK -> Institution.id; employing institution of this veterinarian."
      - name: full_name
        type: string
        source: input
        description: "Veterinarian name printed on certificates."
      - name: license_number
        type: string
        source: input
        description: "State/provincial veterinary licence number."
      - name: license_jurisdiction
        type: string
        source: input
        description: "Jurisdiction code that issued the licence, same format as Institution.jurisdiction_code."
      - name: license_status
        type: enum
        source: input
        description: "Licence standing; only ACTIVE may sign a certificate or clear a quarantine."
        default: ACTIVE
        constraints: "one of ACTIVE | LAPSED | REVOKED"
      - name: usda_accreditation_category
        type: enum
        source: input
        description: "Federal accreditation category; CATEGORY_II is required to sign an INTERNATIONAL-scope certificate."
        default: NONE
        constraints: "one of NONE | CATEGORY_I | CATEGORY_II"

  - name: Animal
    parent: null
    common_fields: true
    fields:
      - name: species_program_id
        type: string
        source: input
        description: "FK -> SpeciesProgram.id; managed population this animal belongs to."
      - name: holding_institution_id
        type: string
        source: input
        description: "FK -> Institution.id; institution physically holding the animal. Must equal the acting Registrar's X-User-ID at creation."
      - name: owning_institution_id
        type: string
        source: input
        description: "FK -> Institution.id; legal owner of record, which diverges from the holder under a breeding loan."
      - name: local_id
        type: string
        source: input
        description: "Institution-local accession identifier."
        constraints: "unique per (holding_institution_id, local_id)"
      - name: sex
        type: enum
        source: input
        description: "Recorded sex; a BREED_WITH pairing requires one MALE and one FEMALE."
        constraints: "one of MALE | FEMALE | UNDETERMINED"
      - name: birth_date
        type: string
        source: input
        description: "ISO 8601 calendar date (YYYY-MM-DD) of birth or hatch; drives husbandry_component age."
      - name: sire_id
        type: string
        source: input
        description: "FK -> Animal.id; recorded sire, null for a wild-caught founder."
        default: null
      - name: dam_id
        type: string
        source: input
        description: "FK -> Animal.id; recorded dam, null for a wild-caught founder."
        default: null
      - name: founder_representation_pct
        type: number
        source: input
        description: "Percentage of the managed gene pool traceable to this animal's founder lineage; drives founder_scarcity."
        default: 0.0
        constraints: "0.0 <= value <= 100.0"
      - name: location_status
        type: enum
        source: system
        description: "Physical-custody dimension of the animal's parallel state machine."
        default: HELD
        constraints: "one of HELD | RESERVED | IN_TRANSIT | IN_QUARANTINE | AWAITING_INTRODUCTION | INTRODUCING | DISPOSED"
      - name: genetic_designation
        type: enum
        source: system
        description: "Breeding-management dimension of the animal's parallel state machine; evolves independently of location_status."
        default: UNEVALUATED
        constraints: "one of UNEVALUATED | BREED_RECOMMENDED | HOLD_NO_BREED | SURPLUS_APPROVED"
      - name: pending_recommendation_id
        type: string
        source: system
        description: "FK -> PopulationRecommendation.id; the newest PROPOSED or ENDORSED recommendation whose subject_animal_id is this animal, null when none."
        default: null
      - name: crate_training_sessions_count
        type: integer
        source: computed
        description: "Number of crate-conditioning sessions logged for this animal."
        default: 0
      - name: last_crate_session_on
        type: string
        source: system
        description: "ISO 8601 calendar date of the most recent crate-conditioning session; null when none logged."
        default: null

  - name: PopulationRecommendation
    parent: null
    common_fields: true
    fields:
      - name: species_program_id
        type: string
        source: input
        description: "FK -> SpeciesProgram.id; must equal the acting ProgramCoordinator's X-User-ID."
      - name: plan_cycle
        type: integer
        source: system
        description: "Copied from SpeciesProgram.current_plan_cycle at creation."
      - name: recommendation_type
        type: enum
        source: input
        description: "Coordinating-body directive for the subject animal."
        constraints: "one of BREED_WITH | HOLD | TRANSFER_OUT | SURPLUS_DISPOSITION"
      - name: subject_animal_id
        type: string
        source: input
        description: "FK -> Animal.id; animal the directive is about."
      - name: paired_animal_id
        type: string
        source: input
        description: "FK -> Animal.id; proposed mate, required when recommendation_type == BREED_WITH and null otherwise."
        default: null
      - name: sending_institution_id
        type: string
        source: input
        description: "FK -> Institution.id; institution expected to send the animal, required when recommendation_type IN {BREED_WITH, TRANSFER_OUT}."
        default: null
      - name: receiving_institution_id
        type: string
        source: input
        description: "FK -> Institution.id; institution expected to receive the animal, required when recommendation_type IN {BREED_WITH, TRANSFER_OUT}."
        default: null
      - name: analysis_mode
        type: enum
        source: input
        description: "Selects the kinship variant used by the pairing_genetic_analysis calculation."
        constraints: "one of PEDIGREE_ONLY | PEDIGREE_PLUS_MOLECULAR"
      - name: molecular_similarity_pct
        type: number
        source: input
        description: "Marker-panel band-sharing percentage between subject and paired animal; required when analysis_mode == PEDIGREE_PLUS_MOLECULAR."
        default: null
        constraints: "0.0 <= value <= 100.0"
      - name: kinship_coefficient
        type: number
        source: computed
        description: "Kinship f(subject, paired) from pairing_genetic_analysis; null when recommendation_type != BREED_WITH. 4 decimal places."
        default: null
      - name: projected_offspring_inbreeding
        type: number
        source: computed
        description: "Projected inbreeding coefficient F of the offspring; equals kinship_coefficient. Null when recommendation_type != BREED_WITH. 4 decimal places."
        default: null
      - name: pairing_verdict
        type: enum
        source: computed
        description: "Verdict derived from projected_offspring_inbreeding; NOT_APPLICABLE when recommendation_type != BREED_WITH."
        constraints: "one of RECOMMENDED | CONDITIONAL | NOT_RECOMMENDED | NOT_APPLICABLE"
      - name: demographic_need_index
        type: number
        source: computed
        description: "Weighted demographic/genetic need score in [0, 1] from the demographic_need_index calculation. 4 decimal places."
      - name: genetic_value_score
        type: number
        source: computed
        description: "round(100 * demographic_need_index, 2); the genetic input to transfer_credit_valuation."
      - name: priority_rank
        type: integer
        source: input
        description: "Coordinating-body priority ordinal; 1 is highest."
        constraints: ">= 1"
      - name: expires_on
        type: string
        source: input
        description: "ISO 8601 calendar date after which the recommendation may no longer be endorsed."
      - name: status
        type: enum
        source: system
        description: "Recommendation lifecycle."
        default: PROPOSED
        constraints: "one of PROPOSED | ENDORSED | DECLINED | SUPERSEDED | FULFILLED | EXPIRED"

  - name: TransferAgreement
    parent: null
    common_fields: true
    fields:
      - name: recommendation_id
        type: string
        source: input
        description: "FK -> PopulationRecommendation.id; the ENDORSED directive the agreement implements."
      - name: animal_id
        type: string
        source: input
        description: "FK -> Animal.id; animal being transferred; must equal recommendation.subject_animal_id."
      - name: sending_institution_id
        type: string
        source: input
        description: "FK -> Institution.id; party sending the animal; must equal the acting Registrar's X-User-ID at creation."
      - name: receiving_institution_id
        type: string
        source: input
        description: "FK -> Institution.id; party receiving the animal."
      - name: ownership_disposition
        type: enum
        source: input
        description: "Ownership term currently on the table; selects OWNERSHIP_MULTIPLIER in transfer_credit_valuation."
        constraints: "one of OWNERSHIP_TRANSFER | BREEDING_LOAN | LOAN_WITH_RETAINED_OWNERSHIP"
      - name: offspring_disposition_rule
        type: enum
        source: input
        description: "Term governing disposition of offspring produced under the agreement."
        constraints: "one of FIRST_TO_SENDER | ALTERNATING | SPLIT_50_50 | ALL_TO_RECEIVER"
      - name: breeding_rights
        type: enum
        source: input
        description: "Breeding rights granted to the receiving institution."
        constraints: "one of FULL | RESTRICTED_NO_BREED | CONTRACEPTION_REQUIRED"
      - name: transport_cost_share_pct
        type: number
        source: input
        description: "Share of transport cost borne by the receiving institution; drives logistics_offset."
        constraints: "0.0 <= value <= 100.0"
      - name: transfer_scope
        type: enum
        source: computed
        description: "INTRA_JURISDICTION when both parties share jurisdiction_code; INTERNATIONAL when their country codes differ; INTERSTATE otherwise. Selects REQUIRED_DOCUMENT_SET and the required test panel."
        constraints: "one of INTRA_JURISDICTION | INTERSTATE | INTERNATIONAL"
      - name: round_number
        type: integer
        source: system
        description: "Count of completed negotiation actions of type OFFER or COUNTER; capped by MAX_NEGOTIATION_ROUNDS."
        default: 0
      - name: last_action_institution_id
        type: string
        source: system
        description: "FK -> Institution.id; party that performed the most recent OFFER or COUNTER; null while DRAFT."
        default: null
      - name: status
        type: enum
        source: system
        description: "Negotiation and execution lifecycle."
        default: DRAFT
        constraints: "one of DRAFT | OFFERED | COUNTERED | ACCEPTED | EXECUTED | COMPLETED | TERMINATED"
      - name: provisional_credit_points
        type: number
        source: computed
        description: "Credit posted to the ledger at execution by the provisional_at_execution variant; null before EXECUTED. 2 decimal places."
        default: null
      - name: final_credit_points
        type: number
        source: computed
        description: "Credit recomputed at delivery by the final_at_delivery variant; null before delivery. 2 decimal places."
        default: null
      - name: executed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which status became EXECUTED; null before."
        default: null
      - name: termination_reason
        type: string
        source: system
        description: "Free-text reason captured from the terminate request; null unless TERMINATED."
        default: null

  - name: ComplianceDocument
    parent: null
    common_fields: true
    fields:
      - name: transfer_agreement_id
        type: string
        source: input
        description: "FK -> TransferAgreement.id; transfer this document authorises."
      - name: document_type
        type: enum
        source: input
        description: "Polymorphic document kind; INTERSTATE_CVI is signed by a Veterinarian, every permit type is decided by AccreditationAdmin."
        constraints: "one of INTERSTATE_CVI | STATE_IMPORT_PERMIT | CITES_EXPORT_PERMIT | CITES_IMPORT_PERMIT | USDA_TRANSPORT_PERMIT"
      - name: issuing_veterinarian_id
        type: string
        source: input
        description: "FK -> Veterinarian.id; required when document_type == INTERSTATE_CVI, must be null otherwise."
        default: null
      - name: issuing_authority_name
        type: string
        source: input
        description: "Government authority named on a permit; required for every document_type other than INTERSTATE_CVI."
        default: null
      - name: exam_date
        type: string
        source: input
        description: "ISO 8601 calendar date of the pre-shipment physical exam; required when document_type == INTERSTATE_CVI, must be null otherwise."
        default: null
      - name: document_number
        type: string
        source: system
        description: "Authority-assigned number captured at the decision; null until ISSUED."
        default: null
      - name: valid_from
        type: string
        source: computed
        description: "For INTERSTATE_CVI equals exam_date; for permits equals the decision date. Null until ISSUED."
        default: null
      - name: valid_until
        type: string
        source: computed
        description: "For INTERSTATE_CVI equals exam_date + CVI_VALIDITY_DAYS; for permits equals the valid_until supplied at the decision. Null until ISSUED."
        default: null
      - name: status
        type: enum
        source: system
        description: "Document lifecycle."
        default: DRAFT
        constraints: "one of DRAFT | ISSUED | DENIED | VOIDED"
      - name: decision_note
        type: string
        source: system
        description: "Note captured at the issue/deny decision; null while DRAFT."
        default: null

  - name: PreShipmentTest
    parent: null
    common_fields: false
    fields:
      - name: transfer_agreement_id
        type: string
        source: input
        description: "FK -> TransferAgreement.id; transfer the sample was drawn for."
      - name: animal_id
        type: string
        source: input
        description: "FK -> Animal.id; animal sampled; must equal the agreement's animal_id."
      - name: collecting_veterinarian_id
        type: string
        source: input
        description: "FK -> Veterinarian.id; veterinarian who drew the sample; must equal the acting Veterinarian's X-User-ID."
      - name: test_code
        type: enum
        source: input
        description: "Diagnostic assay performed."
        constraints: "one of TB | BRUCELLA | HERPESVIRUS | FECAL_PARASITE"
      - name: collected_on
        type: string
        source: input
        description: "ISO 8601 calendar date the sample was collected."
      - name: result
        type: enum
        source: input
        description: "Laboratory outcome, immutable once recorded."
        constraints: "one of NEGATIVE | POSITIVE | INCONCLUSIVE"
      - name: lab_reference
        type: string
        source: input
        description: "Laboratory accession reference."

  - name: QuarantineOccupancy
    parent: null
    common_fields: true
    fields:
      - name: institution_id
        type: string
        source: input
        description: "FK -> Institution.id; receiving institution whose quarantine room is occupied."
      - name: transfer_agreement_id
        type: string
        source: input
        description: "FK -> TransferAgreement.id; transfer this occupancy serves."
      - name: animal_id
        type: string
        source: input
        description: "FK -> Animal.id; animal to be quarantined."
      - name: clearing_veterinarian_id
        type: string
        source: system
        description: "FK -> Veterinarian.id; veterinarian who cleared or failed the quarantine; null while SCHEDULED or ACTIVE."
        default: null
      - name: quarantine_room_code
        type: string
        source: input
        description: "Room identifier within the institution; the (institution_id, quarantine_room_code) pair is the occupied resource."
      - name: scheduled_start_date
        type: string
        source: input
        description: "ISO 8601 calendar date on which the occupancy interval opens (inclusive)."
      - name: scheduled_end_date
        type: string
        source: input
        description: "ISO 8601 calendar date on which the occupancy interval closes (exclusive)."
        constraints: "must be strictly after scheduled_start_date"
      - name: actual_start_date
        type: string
        source: system
        description: "Calendar date on which phase became ACTIVE, stamped from the logical clock at shipment delivery; null while SCHEDULED."
        default: null
      - name: isolation_class
        type: enum
        source: system
        description: "STANDARD by default; upgraded to ENHANCED when the delivering shipment's thermal_excursion_minutes exceeds MAX_EXCURSION_MINUTES."
        default: STANDARD
        constraints: "one of STANDARD | ENHANCED"
      - name: required_days
        type: integer
        source: computed
        description: "QUARANTINE_MIN_DAYS_STANDARD while isolation_class == STANDARD, QUARANTINE_MIN_DAYS_ENHANCED once ENHANCED."
        default: 30
      - name: phase
        type: enum
        source: system
        description: "Occupancy lifecycle."
        default: SCHEDULED
        constraints: "one of SCHEDULED | ACTIVE | CLEARED | FAILED | CANCELLED"
      - name: cleared_on
        type: string
        source: system
        description: "Calendar date on which phase became CLEARED or FAILED; null before."
        default: null

  - name: ShipmentBooking
    parent: null
    common_fields: true
    fields:
      - name: transfer_agreement_id
        type: string
        source: input
        description: "FK -> TransferAgreement.id; transfer being shipped."
      - name: carrier_code
        type: string
        source: input
        description: "Air-cargo carrier identifier; the carrier is the shared resource whose overlapping-booking capacity is CARRIER_OVERLAP_LIMIT."
      - name: crate_serial
        type: string
        source: input
        description: "Serial of the IATA-compliant shipping crate the animal was conditioned to."
      - name: departure_utc
        type: datetime
        source: input
        description: "Scheduled departure instant (ISO 8601 UTC); interval start, inclusive."
      - name: arrival_utc
        type: datetime
        source: input
        description: "Scheduled arrival instant (ISO 8601 UTC); interval end, inclusive."
        constraints: "must be strictly after departure_utc"
      - name: temp_min_c
        type: number
        source: input
        description: "Lower bound of the contracted temperature envelope in Celsius; a sample equal to this bound is compliant."
      - name: temp_max_c
        type: number
        source: input
        description: "Upper bound of the contracted temperature envelope in Celsius; a sample equal to this bound is compliant."
        constraints: "must be strictly greater than temp_min_c"
      - name: temperature_samples
        type: array
        source: system
        description: "Ordered array of Celsius readings captured at SAMPLE_INTERVAL_MINUTES spacing, supplied at delivery; null before."
        default: null
      - name: thermal_excursion_minutes
        type: integer
        source: computed
        description: "SAMPLE_INTERVAL_MINUTES * count(temperature_samples strictly outside [temp_min_c, temp_max_c]); 0 before delivery."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Booking lifecycle."
        default: RESERVED
        constraints: "one of RESERVED | CONFIRMED | IN_TRANSIT | DELIVERED | ABORTED"
      - name: departed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which status became IN_TRANSIT; null before."
        default: null
      - name: delivered_at
        type: datetime
        source: system
        description: "Logical-clock instant at which status became DELIVERED; null before."
        default: null

  - name: IntroductionProtocol
    parent: null
    common_fields: true
    fields:
      - name: transfer_agreement_id
        type: string
        source: input
        description: "FK -> TransferAgreement.id; transfer whose animal is being introduced."
      - name: animal_id
        type: string
        source: input
        description: "FK -> Animal.id; animal being introduced to the resident group."
      - name: institution_id
        type: string
        source: input
        description: "FK -> Institution.id; receiving institution running the protocol; must equal the acting Registrar's X-User-ID."
      - name: resident_group_code
        type: string
        source: input
        description: "Identifier of the resident social group the animal is introduced to."
      - name: stage
        type: enum
        source: system
        description: "Behavioral-introduction stage; advances and regresses on observation outcomes."
        default: HOWDY
        constraints: "one of HOWDY | PARTIAL_CONTACT | FULL_CONTACT | INTEGRATED | ABORTED"
      - name: sessions_at_stage
        type: integer
        source: system
        description: "Observation sessions logged since the current stage was entered; reset to 0 on every stage change."
        default: 0
      - name: aggression_score_total
        type: number
        source: computed
        description: "Sum of AGGRESSION_POINTS over observations logged since the current stage was entered; reset to 0 on every stage change."
        default: 0
      - name: regression_count
        type: integer
        source: system
        description: "Number of aggression-driven regressions so far; MAX_REGRESSIONS aborts the protocol."
        default: 0
      - name: observation_count
        type: integer
        source: computed
        description: "Total observations logged over the protocol's whole life; never reset."
        default: 0
      - name: started_on
        type: string
        source: system
        description: "Calendar date stamped from the logical clock at creation."

  - name: StudbookSubmission
    parent: null
    common_fields: true
    fields:
      - name: species_program_id
        type: string
        source: input
        description: "FK -> SpeciesProgram.id; studbook the record is filed into."
      - name: institution_id
        type: string
        source: input
        description: "FK -> Institution.id; filing institution; must equal the acting Registrar's X-User-ID."
      - name: transfer_agreement_id
        type: string
        source: input
        description: "FK -> TransferAgreement.id; transfer being reported, null for BIRTH submissions."
        default: null
      - name: submission_type
        type: enum
        source: input
        description: "Kind of studbook event reported to the international species database."
        constraints: "one of ACQUISITION | DISPOSITION | BIRTH | TRANSFER"
      - name: reporting_period_end
        type: string
        source: input
        description: "ISO 8601 calendar date closing the reporting period; the filing deadline is this date + SUBMISSION_GRACE_DAYS."
      - name: submitted_on
        type: string
        source: system
        description: "Calendar date stamped from the logical clock at creation."
      - name: days_late
        type: integer
        source: computed
        description: "max(0, submitted_on - (reporting_period_end + SUBMISSION_GRACE_DAYS)) in whole days."
      - name: base_points
        type: number
        source: computed
        description: "Late-filing base points before surcharge; 2 decimal places."
      - name: surcharge_multiplier
        type: number
        source: computed
        description: "Surcharge tier selected from base_points alone and never re-evaluated against the total."
      - name: surcharge_points
        type: number
        source: computed
        description: "round(base_points * surcharge_multiplier, 2)."
      - name: total_compliance_points
        type: number
        source: computed
        description: "round(base_points + surcharge_points, 2); added to Institution.compliance_points_balance."
      - name: status
        type: enum
        source: system
        description: "Submission review lifecycle."
        default: SUBMITTED
        constraints: "one of SUBMITTED | ACCEPTED | REJECTED"
      - name: review_note
        type: string
        source: system
        description: "Coordinator note captured at review; null while SUBMITTED."
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SpeciesProgram
    state_field: plan_status
    shape: compound_with_reopen
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /species-programs/{speciesProgramId}/publish-plan"
        actor: ProgramCoordinator
        preconditions:
          - "plan_status == DRAFT"
          - "X-User-ID equals this SpeciesProgram.id"
          - "target_population_size >= 1"
        side_effects:
          - "current_plan_cycle stays 1 on the first publication"
          - "recommendations may now be created for this program"
      - from: PUBLISHED
        to: CYCLE_CLOSED
        trigger: "system, evaluated at the end of every transition that moves a PopulationRecommendation out of {PROPOSED, ENDORSED}"
        actor: system
        preconditions:
          - "plan_status == PUBLISHED"
          - "open_recommendation_count recomputes to 0"
          - "at least one PopulationRecommendation exists with plan_cycle == current_plan_cycle"
        side_effects:
          - "plan_status := CYCLE_CLOSED"
          - "cycle_closed_on := logical clock now"
        note: "Compound/bubble-up: the parent's state is a function of its children's aggregate state. This is link 4 of the execute cascade and of the introduction-abort cascade."
      - from: CYCLE_CLOSED
        to: PUBLISHED
        trigger: "system, evaluated after a compensating transition returns a PopulationRecommendation to ENDORSED"
        actor: system
        preconditions:
          - "plan_status == CYCLE_CLOSED"
          - "open_recommendation_count recomputes to a value > 0"
        side_effects:
          - "plan_status := PUBLISHED"
          - "cycle_closed_on := null"
        note: "Reopen path; makes the program machine cyclic and keeps the cycle-closure derivation consistent after a TransferAgreement termination."

  - entity: Institution
    state_field: accreditation_status
    shape: branching_with_threshold_demotion
    initial_state: ACCREDITED
    terminal_states: [TERMINATED]
    transitions:
      - from: ACCREDITED
        to: PROVISIONAL
        trigger: "PATCH /institutions/{institutionId} with accreditation_status = PROVISIONAL"
        actor: AccreditationAdmin
        preconditions:
          - "accreditation_status != TERMINATED"
        side_effects:
          - "INTERNATIONAL-scope executions are blocked while PROVISIONAL"
      - from: ACCREDITED
        to: PROVISIONAL
        trigger: "system, at the end of POST /studbook-submissions when compliance_points_balance crosses the review threshold"
        actor: system
        preconditions:
          - "accreditation_status == ACCREDITED"
          - "compliance_points_balance >= ACCREDITATION_REVIEW_POINTS after the new submission is added"
        side_effects:
          - "accreditation_status := PROVISIONAL"
        note: "Rate/threshold trigger with an exact >= boundary at 21.00 points."
      - from: PROVISIONAL
        to: ACCREDITED
        trigger: "PATCH /institutions/{institutionId} with accreditation_status = ACCREDITED"
        actor: AccreditationAdmin
        preconditions:
          - "accreditation_status == PROVISIONAL"
        side_effects:
          - "compliance_points_balance is NOT reset by reinstatement"
      - from: ACCREDITED
        to: SUSPENDED
        trigger: "PATCH /institutions/{institutionId} with accreditation_status = SUSPENDED"
        actor: AccreditationAdmin
        preconditions:
          - "accreditation_status IN {ACCREDITED, PROVISIONAL}"
        side_effects:
          - "no cascade onto existing agreements; suspension acts as a forward guard on accept and execute"
      - from: PROVISIONAL
        to: SUSPENDED
        trigger: "PATCH /institutions/{institutionId} with accreditation_status = SUSPENDED"
        actor: AccreditationAdmin
        preconditions:
          - "accreditation_status IN {ACCREDITED, PROVISIONAL}"
        side_effects:
          - "no cascade onto existing agreements"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "PATCH /institutions/{institutionId} with accreditation_status = TERMINATED"
        actor: AccreditationAdmin
        preconditions:
          - "accreditation_status == SUSPENDED"
        side_effects:
          - "institution can no longer be named as a party on a new TransferAgreement"

  - entity: Animal
    state_field: location_status
    shape: parallel_dimension_1_of_2
    initial_state: HELD
    terminal_states: [DISPOSED]
    transitions:
      - from: HELD
        to: RESERVED
        trigger: "POST /transfer-agreements/{agreementId}/execute"
        actor: system
        preconditions:
          - "location_status == HELD"
          - "holding_institution_id == agreement.sending_institution_id"
        side_effects:
          - "link 1 of the execute cascade; the sending institution's occupied_slots drops by 1 and the receiving institution's reserved_slots rises by 1"
          - "because the animal left HELD, its pending_recommendation_id recommendation transitions ENDORSED -> FULFILLED (link 2)"
      - from: RESERVED
        to: HELD
        trigger: "POST /transfer-agreements/{agreementId}/terminate"
        actor: system
        preconditions:
          - "location_status == RESERVED"
        side_effects:
          - "compensating step of the execute cascade; slot accounting returns to its pre-execution values"
      - from: RESERVED
        to: IN_TRANSIT
        trigger: "POST /shipment-bookings/{bookingId}/depart"
        actor: system
        preconditions:
          - "location_status == RESERVED"
          - "booking.status == CONFIRMED"
        side_effects:
          - "receiving institution keeps the reserved slot; no occupied slot is charged at either party"
      - from: IN_TRANSIT
        to: IN_QUARANTINE
        trigger: "POST /shipment-bookings/{bookingId}/deliver"
        actor: system
        preconditions:
          - "location_status == IN_TRANSIT"
        side_effects:
          - "holding_institution_id := agreement.receiving_institution_id"
          - "because the shipment was delivered, the agreement's SCHEDULED QuarantineOccupancy transitions to ACTIVE (link 2 of the delivery cascade)"
          - "receiving institution's reserved_slots drops by 1 and occupied_slots rises by 1"
      - from: IN_QUARANTINE
        to: AWAITING_INTRODUCTION
        trigger: "POST /quarantine-occupancies/{occupancyId}/clear"
        actor: system
        preconditions:
          - "location_status == IN_QUARANTINE"
          - "occupancy.phase == ACTIVE"
        side_effects:
          - "animal becomes eligible for an IntroductionProtocol"
      - from: IN_QUARANTINE
        to: HELD
        trigger: "POST /quarantine-occupancies/{occupancyId}/fail"
        actor: system
        preconditions:
          - "location_status == IN_QUARANTINE"
        side_effects:
          - "animal remains physically at the receiving institution under veterinary hold"
          - "because the quarantine failed, the agreement transitions EXECUTED -> TERMINATED (link 2 of the quarantine-failure cascade)"
      - from: AWAITING_INTRODUCTION
        to: INTRODUCING
        trigger: "POST /introduction-protocols"
        actor: system
        preconditions:
          - "location_status == AWAITING_INTRODUCTION"
        side_effects:
          - "protocol.stage := HOWDY; protocol.started_on := logical clock date"
      - from: INTRODUCING
        to: HELD
        trigger: "POST /introduction-protocols/{protocolId}/observations that advances the protocol to INTEGRATED"
        actor: system
        preconditions:
          - "location_status == INTRODUCING"
          - "protocol.stage becomes INTEGRATED"
        side_effects:
          - "because the protocol integrated, the agreement transitions EXECUTED -> COMPLETED"
      - from: INTRODUCING
        to: HELD
        trigger: "POST /introduction-protocols/{protocolId}/observations that aborts the protocol"
        actor: system
        preconditions:
          - "location_status == INTRODUCING"
          - "protocol.stage becomes ABORTED"
        side_effects:
          - "because the protocol aborted, genetic_designation := HOLD_NO_BREED (link 2 of the introduction-abort cascade)"
      - from: HELD
        to: DISPOSED
        trigger: "POST /animals/{animalId}/disposition"
        actor: Registrar
        preconditions:
          - "location_status == HELD"
          - "genetic_designation == SURPLUS_APPROVED"
          - "holding_institution_id == X-User-ID"
          - "holding institution disposition_policy_on_file == true"
          - "no TransferAgreement referencing this animal is in {DRAFT, OFFERED, COUNTERED, ACCEPTED, EXECUTED}"
        side_effects:
          - "location_status := DISPOSED"
          - "species program current_population_count recomputed (the animal drops out of the managed population)"
          - "holding institution occupied_slots drops by 1"

  - entity: Animal
    state_field: genetic_designation
    shape: parallel_dimension_2_of_2
    initial_state: UNEVALUATED
    terminal_states: []
    transitions:
      - from: UNEVALUATED
        to: BREED_RECOMMENDED
        trigger: "POST /population-recommendations/{recommendationId}/endorse where recommendation_type == BREED_WITH"
        actor: system
        preconditions:
          - "recommendation.status == PROPOSED"
          - "recommendation.pairing_verdict IN {RECOMMENDED, CONDITIONAL}"
        side_effects:
          - "both subject_animal and paired_animal receive genetic_designation := BREED_RECOMMENDED"
        note: "location_status is untouched: the two dimensions of the Animal machine evolve independently."
      - from: UNEVALUATED
        to: HOLD_NO_BREED
        trigger: "POST /population-recommendations/{recommendationId}/endorse where recommendation_type == HOLD"
        actor: system
        preconditions:
          - "recommendation.status == PROPOSED"
        side_effects:
          - "subject_animal genetic_designation := HOLD_NO_BREED"
      - from: BREED_RECOMMENDED
        to: HOLD_NO_BREED
        trigger: "POST /introduction-protocols/{protocolId}/observations that aborts the protocol"
        actor: system
        preconditions:
          - "protocol.stage becomes ABORTED"
        side_effects:
          - "because the designation became HOLD_NO_BREED, every BREED_WITH recommendation in {PROPOSED, ENDORSED} naming this animal as subject or pair transitions to DECLINED (link 3 of the introduction-abort cascade)"
      - from: UNEVALUATED
        to: SURPLUS_APPROVED
        trigger: "POST /population-recommendations/{recommendationId}/endorse where recommendation_type == SURPLUS_DISPOSITION"
        actor: system
        preconditions:
          - "recommendation.status == PROPOSED"
        side_effects:
          - "subject_animal genetic_designation := SURPLUS_APPROVED, unlocking POST /animals/{animalId}/disposition"
      - from: HOLD_NO_BREED
        to: SURPLUS_APPROVED
        trigger: "POST /population-recommendations/{recommendationId}/endorse where recommendation_type == SURPLUS_DISPOSITION"
        actor: system
        preconditions:
          - "recommendation.status == PROPOSED"
        side_effects:
          - "subject_animal genetic_designation := SURPLUS_APPROVED"

  - entity: PopulationRecommendation
    state_field: status
    shape: branching_with_compensating_revert
    initial_state: PROPOSED
    terminal_states: [DECLINED, SUPERSEDED, EXPIRED]
    transitions:
      - from: PROPOSED
        to: ENDORSED
        trigger: "POST /population-recommendations/{recommendationId}/endorse"
        actor: Registrar
        preconditions:
          - "status == PROPOSED"
          - "X-User-ID equals sending_institution_id for recommendation_type IN {BREED_WITH, TRANSFER_OUT}, or equals subject animal holding_institution_id for recommendation_type IN {HOLD, SURPLUS_DISPOSITION}"
          - "logical clock date <= expires_on"
          - "pairing_verdict != NOT_RECOMMENDED"
        side_effects:
          - "status := ENDORSED"
          - "subject and paired animals receive the genetic_designation the recommendation_type implies (see the Animal genetic_designation machine)"
      - from: PROPOSED
        to: EXPIRED
        trigger: "POST /population-recommendations/{recommendationId}/endorse when the logical clock date is after expires_on"
        actor: system
        preconditions:
          - "status == PROPOSED"
          - "logical clock date > expires_on"
        side_effects:
          - "status := EXPIRED and subject animal pending_recommendation_id := null are persisted, then the endorse request itself fails with ERR_RECOMMENDATION_EXPIRED (422)"
        note: "Lazy expiry: the rejected request still advances the recommendation, so a follow-up GET observes EXPIRED."
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "POST /population-recommendations creating a newer recommendation with the same subject_animal_id and plan_cycle"
        actor: system
        preconditions:
          - "status == PROPOSED"
        side_effects:
          - "status := SUPERSEDED"
          - "subject animal pending_recommendation_id := the newer recommendation id"
        note: "Only PROPOSED recommendations are superseded; an ENDORSED or FULFILLED predecessor makes the create fail with ERR_RECOMMENDATION_ALREADY_ENDORSED."
      - from: ENDORSED
        to: FULFILLED
        trigger: "POST /transfer-agreements/{agreementId}/execute"
        actor: system
        preconditions:
          - "status == ENDORSED"
          - "the executing agreement's recommendation_id equals this recommendation id"
        side_effects:
          - "status := FULFILLED; subject animal pending_recommendation_id := null"
          - "because this recommendation left the open set, the species program's open_recommendation_count is recomputed (link 3 of the execute cascade)"
      - from: FULFILLED
        to: ENDORSED
        trigger: "POST /transfer-agreements/{agreementId}/terminate on an EXECUTED agreement, or the system termination raised by POST /quarantine-occupancies/{occupancyId}/fail"
        actor: system
        preconditions:
          - "status == FULFILLED"
        side_effects:
          - "status := ENDORSED; subject animal pending_recommendation_id := this recommendation id"
          - "because this recommendation re-entered the open set, the species program's open_recommendation_count is recomputed and a CYCLE_CLOSED program reopens to PUBLISHED"
      - from: ENDORSED
        to: DECLINED
        trigger: "POST /introduction-protocols/{protocolId}/observations that aborts the protocol"
        actor: system
        preconditions:
          - "status == ENDORSED"
          - "recommendation_type == BREED_WITH"
          - "the aborted protocol's animal is this recommendation's subject_animal_id or paired_animal_id"
        side_effects:
          - "status := DECLINED (link 3 of the introduction-abort cascade)"
          - "because this recommendation left the open set, open_recommendation_count is recomputed (link 4)"
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /introduction-protocols/{protocolId}/observations that aborts the protocol"
        actor: system
        preconditions:
          - "status == PROPOSED"
          - "recommendation_type == BREED_WITH"
          - "the aborted protocol's animal is this recommendation's subject_animal_id or paired_animal_id"
        side_effects:
          - "status := DECLINED; subject animal pending_recommendation_id := null when it pointed here"

  - entity: TransferAgreement
    state_field: status
    shape: cyclic_negotiation
    initial_state: DRAFT
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: DRAFT
        to: OFFERED
        trigger: "POST /transfer-agreements/{agreementId}/offer"
        actor: Registrar
        preconditions:
          - "status == DRAFT"
          - "X-User-ID == sending_institution_id"
          - "round_number < MAX_NEGOTIATION_ROUNDS"
        side_effects:
          - "round_number += 1 (0 -> 1)"
          - "last_action_institution_id := X-User-ID"
          - "terms named in the payload overwrite the corresponding agreement fields"
      - from: OFFERED
        to: COUNTERED
        trigger: "POST /transfer-agreements/{agreementId}/counter"
        actor: Registrar
        preconditions:
          - "status == OFFERED"
          - "X-User-ID IN {sending_institution_id, receiving_institution_id}"
          - "X-User-ID != last_action_institution_id"
          - "round_number < MAX_NEGOTIATION_ROUNDS"
        side_effects:
          - "round_number += 1"
          - "last_action_institution_id := X-User-ID"
          - "the countering party's terms overwrite ownership_disposition, offspring_disposition_rule, breeding_rights and transport_cost_share_pct"
      - from: COUNTERED
        to: OFFERED
        trigger: "POST /transfer-agreements/{agreementId}/offer"
        actor: Registrar
        preconditions:
          - "status == COUNTERED"
          - "X-User-ID IN {sending_institution_id, receiving_institution_id}"
          - "X-User-ID != last_action_institution_id"
          - "round_number < MAX_NEGOTIATION_ROUNDS"
        side_effects:
          - "round_number += 1"
          - "last_action_institution_id := X-User-ID"
          - "terms named in the payload overwrite the corresponding agreement fields"
        note: "Closes the OFFERED -> COUNTERED -> OFFERED negotiation cycle; the round cap is the only termination guarantee."
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /transfer-agreements/{agreementId}/accept"
        actor: Registrar
        preconditions:
          - "status IN {OFFERED, COUNTERED}"
          - "X-User-ID IN {sending_institution_id, receiving_institution_id}"
          - "X-User-ID != last_action_institution_id"
          - "receiving institution accreditation_status IN {ACCREDITED, PROVISIONAL}"
          - "recommendation.status == ENDORSED"
        side_effects:
          - "status := ACCEPTED; round_number is NOT incremented; last_action_institution_id is left unchanged"
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /transfer-agreements/{agreementId}/accept"
        actor: Registrar
        preconditions:
          - "status IN {OFFERED, COUNTERED}"
          - "X-User-ID IN {sending_institution_id, receiving_institution_id}"
          - "X-User-ID != last_action_institution_id"
          - "receiving institution accreditation_status IN {ACCREDITED, PROVISIONAL}"
          - "recommendation.status == ENDORSED"
        side_effects:
          - "status := ACCEPTED; the terms standing at acceptance are the terms of record"
      - from: ACCEPTED
        to: EXECUTED
        trigger: "POST /transfer-agreements/{agreementId}/execute"
        actor: Registrar
        preconditions:
          - "status == ACCEPTED"
          - "X-User-ID == sending_institution_id"
          - "recommendation.status == ENDORSED"
          - "animal.holding_institution_id == sending_institution_id AND animal.location_status == HELD"
          - "receiving institution accreditation_status IN {ACCREDITED, PROVISIONAL}"
          - "transfer_scope != INTERNATIONAL OR receiving institution accreditation_status == ACCREDITED"
          - "ownership_disposition != OWNERSHIP_TRANSFER OR receiving institution disposition_policy_on_file == true"
          - "receiving.occupied_slots + receiving.reserved_slots + 1 <= receiving.holding_capacity_slots"
        side_effects:
          - "status := EXECUTED; executed_at := logical clock now"
          - "transfer_credit_valuation variant provisional_at_execution runs; provisional_credit_points is stored"
          - "double-entry ledger posting: sending.transfer_credit_balance += provisional_credit_points and receiving.transfer_credit_balance -= provisional_credit_points"
          - "if ownership_disposition == OWNERSHIP_TRANSFER then animal.owning_institution_id := receiving_institution_id"
          - "link 1: animal.location_status HELD -> RESERVED"
          - "link 2: because the animal left HELD, its recommendation ENDORSED -> FULFILLED and animal.pending_recommendation_id := null"
          - "link 3: because that recommendation left the open set, species program open_recommendation_count is recomputed"
          - "link 4: because open_recommendation_count reached 0 while PUBLISHED, species program plan_status -> CYCLE_CLOSED and cycle_closed_on is stamped"
          - "occupied_slots and reserved_slots recomputed for both parties"
      - from: EXECUTED
        to: COMPLETED
        trigger: "POST /introduction-protocols/{protocolId}/observations that advances the protocol to INTEGRATED"
        actor: system
        preconditions:
          - "status == EXECUTED"
          - "protocol.stage becomes INTEGRATED"
        side_effects:
          - "status := COMPLETED; the ledger is left exactly as the final_at_delivery posting left it"
      - from: OFFERED
        to: TERMINATED
        trigger: "POST /transfer-agreements/{agreementId}/terminate"
        actor: Registrar
        preconditions:
          - "status IN {OFFERED, COUNTERED, ACCEPTED, EXECUTED}"
          - "X-User-ID IN {sending_institution_id, receiving_institution_id}"
          - "animal.location_status IN {HELD, RESERVED}"
        side_effects:
          - "status := TERMINATED; termination_reason := payload reason"
      - from: COUNTERED
        to: TERMINATED
        trigger: "POST /transfer-agreements/{agreementId}/terminate"
        actor: Registrar
        preconditions:
          - "status IN {OFFERED, COUNTERED, ACCEPTED, EXECUTED}"
          - "X-User-ID IN {sending_institution_id, receiving_institution_id}"
          - "animal.location_status IN {HELD, RESERVED}"
        side_effects:
          - "status := TERMINATED; termination_reason := payload reason"
      - from: ACCEPTED
        to: TERMINATED
        trigger: "POST /transfer-agreements/{agreementId}/terminate"
        actor: Registrar
        preconditions:
          - "status IN {OFFERED, COUNTERED, ACCEPTED, EXECUTED}"
          - "X-User-ID IN {sending_institution_id, receiving_institution_id}"
          - "animal.location_status IN {HELD, RESERVED}"
        side_effects:
          - "status := TERMINATED; termination_reason := payload reason"
          - "every ComplianceDocument for this agreement in {DRAFT, ISSUED} -> VOIDED"
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /transfer-agreements/{agreementId}/terminate, or system termination raised by POST /quarantine-occupancies/{occupancyId}/fail"
        actor: Registrar
        preconditions:
          - "status == EXECUTED"
          - "for the Registrar-triggered form: X-User-ID IN {sending_institution_id, receiving_institution_id} AND animal.location_status IN {HELD, RESERVED}"
          - "for the system form raised by quarantine failure: no location precondition applies"
        side_effects:
          - "status := TERMINATED; termination_reason := payload reason, or 'QUARANTINE_FAILED' for the system form"
          - "compensating ledger reversal: the net posted amount (final_credit_points when not null, else provisional_credit_points) is subtracted from sending.transfer_credit_balance and added back to receiving.transfer_credit_balance, so both balances return to their pre-execution values"
          - "if ownership_disposition == OWNERSHIP_TRANSFER then animal.owning_institution_id := sending_institution_id"
          - "if animal.location_status == RESERVED then animal.location_status := HELD"
          - "because the agreement was terminated, its recommendation FULFILLED -> ENDORSED and animal.pending_recommendation_id := that recommendation id"
          - "because that recommendation re-entered the open set, open_recommendation_count is recomputed and a CYCLE_CLOSED program reopens to PUBLISHED"
          - "every ShipmentBooking for this agreement in {RESERVED, CONFIRMED} -> ABORTED"
          - "every QuarantineOccupancy for this agreement in {SCHEDULED} -> CANCELLED"
          - "every ComplianceDocument for this agreement in {DRAFT, ISSUED} -> VOIDED"

  - entity: ComplianceDocument
    state_field: status
    shape: branching_with_guarded_issue
    initial_state: DRAFT
    terminal_states: [DENIED, VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /compliance-documents/{documentId}/decision with outcome == ISSUE"
        actor: Veterinarian
        preconditions:
          - "status == DRAFT"
          - "for document_type == INTERSTATE_CVI the actor must be a Veterinarian and X-User-ID must equal issuing_veterinarian_id; for every permit type the actor must be AccreditationAdmin (otherwise ERR_WRONG_ISSUING_AUTHORITY)"
          - "for document_type == INTERSTATE_CVI: the issuing veterinarian license_status == ACTIVE (else ERR_VET_LICENSE_INVALID) and license_jurisdiction == the sending institution jurisdiction_code"
          - "for document_type == INTERSTATE_CVI on an INTERNATIONAL agreement: the issuing veterinarian usda_accreditation_category == CATEGORY_II (else ERR_VET_NOT_ACCREDITED_FOR_SCOPE)"
          - "for document_type == INTERSTATE_CVI: at least one PreShipmentTest exists for the agreement and the required panel is complete - one test per test_code in the panel required by transfer_scope, each collected within TEST_VALIDITY_DAYS of exam_date (else ERR_TEST_PANEL_INCOMPLETE), and no test in that panel has result POSITIVE or INCONCLUSIVE (else ERR_POSITIVE_TEST_RESULT)"
          - "the parent agreement status IN {ACCEPTED, EXECUTED}"
        side_effects:
          - "status := ISSUED; document_number := the payload document_number"
          - "valid_from := exam_date for INTERSTATE_CVI, else the logical clock date"
          - "valid_until := document_validity_window (exam_date + CVI_VALIDITY_DAYS for INTERSTATE_CVI; the payload valid_until for every permit type)"
      - from: DRAFT
        to: DENIED
        trigger: "POST /compliance-documents/{documentId}/decision with outcome == DENY"
        actor: AccreditationAdmin
        preconditions:
          - "status == DRAFT"
          - "the same issuing-authority rule as the ISSUE outcome applies"
        side_effects:
          - "status := DENIED; decision_note := the payload decision_note"
          - "no document_number, valid_from or valid_until is assigned"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /pre-shipment-tests recording result == POSITIVE for the agreement, or POST /transfer-agreements/{agreementId}/terminate"
        actor: system
        preconditions:
          - "status == ISSUED"
          - "for the test-driven form: document_type == INTERSTATE_CVI and the test's transfer_agreement_id equals this document's transfer_agreement_id"
        side_effects:
          - "status := VOIDED; decision_note := 'VOIDED_BY_POSITIVE_TEST' or 'VOIDED_BY_TERMINATION'"
          - "for the test-driven form, every ShipmentBooking of the agreement in {RESERVED, CONFIRMED} -> ABORTED"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /transfer-agreements/{agreementId}/terminate"
        actor: system
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "status := VOIDED; decision_note := 'VOIDED_BY_TERMINATION'"
    note: "An ISSUED document is never moved to a separate expired state; expiry is evaluated against the logical clock at POST /shipment-bookings/{bookingId}/confirm and surfaces as ERR_HEALTH_CERTIFICATE_EXPIRED while status stays ISSUED."

  - entity: QuarantineOccupancy
    state_field: phase
    shape: branching_with_cross_entity_cascade
    initial_state: SCHEDULED
    terminal_states: [CLEARED, FAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /shipment-bookings/{bookingId}/deliver"
        actor: system
        preconditions:
          - "phase == SCHEDULED"
          - "the delivering booking's transfer_agreement_id equals this occupancy's transfer_agreement_id"
        side_effects:
          - "phase := ACTIVE; actual_start_date := the logical clock date at delivery"
          - "isolation_class := ENHANCED when the delivering booking's thermal_excursion_minutes > MAX_EXCURSION_MINUTES, else STANDARD"
          - "required_days := QUARANTINE_MIN_DAYS_ENHANCED for ENHANCED, else QUARANTINE_MIN_DAYS_STANDARD"
          - "animal.location_status IN_TRANSIT -> IN_QUARANTINE"
      - from: ACTIVE
        to: CLEARED
        trigger: "POST /quarantine-occupancies/{occupancyId}/clear"
        actor: Veterinarian
        preconditions:
          - "phase == ACTIVE"
          - "the clearing veterinarian's institution_id == this occupancy's institution_id (else ERR_VET_INSTITUTION_MISMATCH)"
          - "the clearing veterinarian license_status == ACTIVE"
          - "days elapsed from actual_start_date to the logical clock date >= required_days (else ERR_QUARANTINE_MINIMUM_NOT_MET)"
        side_effects:
          - "phase := CLEARED; cleared_on := the logical clock date; clearing_veterinarian_id := X-User-ID"
          - "animal.location_status IN_QUARANTINE -> AWAITING_INTRODUCTION"
      - from: ACTIVE
        to: FAILED
        trigger: "POST /quarantine-occupancies/{occupancyId}/fail"
        actor: Veterinarian
        preconditions:
          - "phase == ACTIVE"
          - "the failing veterinarian's institution_id == this occupancy's institution_id"
          - "the failing veterinarian license_status == ACTIVE"
        side_effects:
          - "phase := FAILED; cleared_on stays null; clearing_veterinarian_id := X-User-ID"
          - "the parent agreement EXECUTED -> TERMINATED with termination_reason 'QUARANTINE_FAILED', which runs the full compensating reversal chain of that transition"
          - "animal.location_status IN_QUARANTINE -> HELD and animal.holding_institution_id := the agreement's sending_institution_id"
          - "the room's post-occupancy sanitation buffer widens from SANITATION_BUFFER_DAYS to EXTENDED_SANITATION_DAYS for every later occupancy of the same (institution_id, quarantine_room_code)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /transfer-agreements/{agreementId}/terminate"
        actor: system
        preconditions:
          - "phase == SCHEDULED"
        side_effects:
          - "phase := CANCELLED; the room interval it held is released, so a later occupancy may reuse it without any sanitation buffer"

  - entity: ShipmentBooking
    state_field: status
    shape: linear_with_abort_branch
    initial_state: RESERVED
    terminal_states: [DELIVERED, ABORTED]
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /shipment-bookings/{bookingId}/confirm"
        actor: Registrar
        preconditions:
          - "status == RESERVED"
          - "X-User-ID == the agreement's sending_institution_id"
          - "the agreement status == EXECUTED"
          - "animal.crate_training_sessions_count >= MIN_CRATE_SESSIONS (else ERR_CRATE_TRAINING_INCOMPLETE, priority 66)"
          - "departure_utc date minus animal.last_crate_session_on <= CRATE_RECENCY_DAYS (else ERR_CRATE_TRAINING_STALE, priority 67)"
          - "an INTERSTATE_CVI ComplianceDocument with status ISSUED exists for the agreement (else ERR_HEALTH_CERTIFICATE_MISSING, priority 70)"
          - "every permit type required by the agreement's transfer_scope has an ISSUED ComplianceDocument (else ERR_PERMIT_NOT_ISSUED, priority 71)"
          - "a QuarantineOccupancy with phase == SCHEDULED exists at the receiving institution for the agreement (else ERR_QUARANTINE_NOT_SCHEDULED, priority 72)"
          - "the INTERSTATE_CVI valid_until >= the arrival_utc date (else ERR_HEALTH_CERTIFICATE_EXPIRED, priority 74)"
        side_effects:
          - "status := CONFIRMED"
      - from: CONFIRMED
        to: IN_TRANSIT
        trigger: "POST /shipment-bookings/{bookingId}/depart"
        actor: Registrar
        preconditions:
          - "status == CONFIRMED"
          - "X-User-ID == the agreement's sending_institution_id"
          - "animal.location_status == RESERVED"
        side_effects:
          - "status := IN_TRANSIT; departed_at := the logical clock instant"
          - "animal.location_status RESERVED -> IN_TRANSIT"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /shipment-bookings/{bookingId}/deliver"
        actor: Registrar
        preconditions:
          - "status == IN_TRANSIT"
          - "X-User-ID == the agreement's receiving_institution_id"
        side_effects:
          - "temperature_samples := the payload samples; thermal_excursion_minutes := thermal_excursion_window over them"
          - "status := DELIVERED; delivered_at := the logical clock instant"
          - "transfer_credit_valuation variant final_at_delivery runs; final_credit_points is stored and the ledger is adjusted by (final_credit_points - provisional_credit_points) on both institutions"
          - "animal.holding_institution_id := the agreement's receiving_institution_id"
          - "the agreement's SCHEDULED QuarantineOccupancy -> ACTIVE, which sets isolation_class and required_days and moves the animal IN_TRANSIT -> IN_QUARANTINE"
          - "occupied_slots and reserved_slots recomputed for both institutions"
      - from: RESERVED
        to: ABORTED
        trigger: "POST /shipment-bookings superseding this booking for the same agreement, POST /transfer-agreements/{agreementId}/terminate, or POST /pre-shipment-tests recording a POSITIVE result that voids the CVI"
        actor: system
        preconditions:
          - "status == RESERVED"
        side_effects:
          - "status := ABORTED; the carrier interval it held is released, so it no longer counts toward CARRIER_OVERLAP_LIMIT"
      - from: CONFIRMED
        to: ABORTED
        trigger: "POST /transfer-agreements/{agreementId}/terminate, or POST /pre-shipment-tests recording a POSITIVE result that voids the CVI"
        actor: system
        preconditions:
          - "status == CONFIRMED"
        side_effects:
          - "status := ABORTED; the carrier interval it held is released"

  - entity: IntroductionProtocol
    state_field: stage
    shape: cyclic_with_regression_and_abort
    initial_state: HOWDY
    terminal_states: [INTEGRATED, ABORTED]
    transitions:
      - from: HOWDY
        to: PARTIAL_CONTACT
        trigger: "POST /introduction-protocols/{protocolId}/observations"
        actor: Registrar
        preconditions:
          - "stage == HOWDY"
          - "sessions_at_stage (after counting this observation) >= MIN_SESSIONS_PER_STAGE"
          - "the last CALM_ADVANCE_MAX observations recorded at this stage, this one included, all have aggression_level == CALM"
          - "the stage aggression points accumulated at this stage < AGGRESSION_REGRESSION_THRESHOLD"
        side_effects:
          - "stage := PARTIAL_CONTACT; sessions_at_stage := 0; the stage aggression accumulator resets to 0"
          - "aggression_score_total and observation_count keep accumulating across stages and are never reset"
      - from: PARTIAL_CONTACT
        to: FULL_CONTACT
        trigger: "POST /introduction-protocols/{protocolId}/observations"
        actor: Registrar
        preconditions:
          - "stage == PARTIAL_CONTACT"
          - "sessions_at_stage (after counting this observation) >= MIN_SESSIONS_PER_STAGE"
          - "the last CALM_ADVANCE_MAX observations recorded at this stage all have aggression_level == CALM"
          - "the stage aggression points accumulated at this stage < AGGRESSION_REGRESSION_THRESHOLD"
        side_effects:
          - "stage := FULL_CONTACT; sessions_at_stage := 0; the stage aggression accumulator resets to 0"
      - from: FULL_CONTACT
        to: INTEGRATED
        trigger: "POST /introduction-protocols/{protocolId}/observations"
        actor: Registrar
        preconditions:
          - "stage == FULL_CONTACT"
          - "sessions_at_stage (after counting this observation) >= MIN_SESSIONS_PER_STAGE"
          - "the last CALM_ADVANCE_MAX observations recorded at this stage all have aggression_level == CALM"
          - "the stage aggression points accumulated at this stage < AGGRESSION_REGRESSION_THRESHOLD"
        side_effects:
          - "stage := INTEGRATED"
          - "animal.location_status INTRODUCING -> HELD"
          - "the parent agreement EXECUTED -> COMPLETED"
      - from: FULL_CONTACT
        to: PARTIAL_CONTACT
        trigger: "POST /introduction-protocols/{protocolId}/observations whose points push the stage accumulator to AGGRESSION_REGRESSION_THRESHOLD or above"
        actor: system
        preconditions:
          - "stage == FULL_CONTACT"
          - "the stage aggression points accumulated at this stage, this observation included, >= AGGRESSION_REGRESSION_THRESHOLD"
          - "regression_count + 1 <= MAX_REGRESSIONS"
        side_effects:
          - "stage := PARTIAL_CONTACT; regression_count += 1; sessions_at_stage := 0; the stage aggression accumulator resets to 0"
        note: "Regression outranks advancement: when both the advance condition and the regression condition could read true for one observation, the regression is applied."
      - from: PARTIAL_CONTACT
        to: HOWDY
        trigger: "POST /introduction-protocols/{protocolId}/observations whose points push the stage accumulator to AGGRESSION_REGRESSION_THRESHOLD or above"
        actor: system
        preconditions:
          - "stage == PARTIAL_CONTACT"
          - "the stage aggression points accumulated at this stage, this observation included, >= AGGRESSION_REGRESSION_THRESHOLD"
          - "regression_count + 1 <= MAX_REGRESSIONS"
        side_effects:
          - "stage := HOWDY; regression_count += 1; sessions_at_stage := 0; the stage aggression accumulator resets to 0"
        note: "Closes the HOWDY -> PARTIAL_CONTACT -> HOWDY cycle; MAX_REGRESSIONS is the termination guarantee."
      - from: HOWDY
        to: ABORTED
        trigger: "POST /introduction-protocols/{protocolId}/observations whose points push the stage accumulator to AGGRESSION_REGRESSION_THRESHOLD or above at the first stage"
        actor: system
        preconditions:
          - "stage == HOWDY"
          - "the stage aggression points accumulated at this stage, this observation included, >= AGGRESSION_REGRESSION_THRESHOLD"
        side_effects:
          - "stage := ABORTED (there is no stage below HOWDY to regress into)"
          - "link 2: animal.location_status INTRODUCING -> HELD and animal.genetic_designation BREED_RECOMMENDED -> HOLD_NO_BREED"
          - "link 3: every PopulationRecommendation with recommendation_type BREED_WITH naming this animal as subject_animal_id or paired_animal_id in {PROPOSED, ENDORSED} -> DECLINED"
          - "link 4: the species program's open_recommendation_count is recomputed, and a PUBLISHED program whose count reaches 0 moves to CYCLE_CLOSED"
      - from: PARTIAL_CONTACT
        to: ABORTED
        trigger: "POST /introduction-protocols/{protocolId}/observations that would raise regression_count above MAX_REGRESSIONS"
        actor: system
        preconditions:
          - "stage == PARTIAL_CONTACT"
          - "the stage aggression points accumulated at this stage, this observation included, >= AGGRESSION_REGRESSION_THRESHOLD"
          - "regression_count + 1 > MAX_REGRESSIONS"
        side_effects:
          - "stage := ABORTED; regression_count is left at MAX_REGRESSIONS"
          - "the same four-link abort cascade as the HOWDY -> ABORTED transition runs"
      - from: FULL_CONTACT
        to: ABORTED
        trigger: "POST /introduction-protocols/{protocolId}/observations that would raise regression_count above MAX_REGRESSIONS"
        actor: system
        preconditions:
          - "stage == FULL_CONTACT"
          - "the stage aggression points accumulated at this stage, this observation included, >= AGGRESSION_REGRESSION_THRESHOLD"
          - "regression_count + 1 > MAX_REGRESSIONS"
        side_effects:
          - "stage := ABORTED; the same four-link abort cascade runs"

  - entity: StudbookSubmission
    state_field: status
    shape: branching_with_threshold_posting
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /studbook-submissions/{submissionId}/review with outcome == ACCEPT"
        actor: ProgramCoordinator
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID == the submission's species_program_id (the coordinating body of that program)"
        side_effects:
          - "status := ACCEPTED; review_note := the payload review_note"
          - "the submission's total_compliance_points are posted: institution.compliance_points_balance += total_compliance_points"
          - "if the posting leaves an ACCREDITED institution with compliance_points_balance >= ACCREDITATION_REVIEW_POINTS then its accreditation_status ACCREDITED -> PROVISIONAL"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /studbook-submissions/{submissionId}/review with outcome == REJECT"
        actor: ProgramCoordinator
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID == the submission's species_program_id"
        side_effects:
          - "status := REJECTED; review_note := the payload review_note"
          - "the same compliance-points posting and the same threshold demotion run: a rejected submission is still a filed submission and its lateness is still charged"
          - "because the submission left the SUBMITTED set, a replacement submission for the same (species_program_id, institution_id, reporting_period_end, submission_type) is accepted, while a duplicate against a SUBMITTED or ACCEPTED one is rejected with ERR_DUPLICATE_STUDBOOK_SUBMISSION"

concurrency_rules:
  - rule_id: recommendation-create-stale-animal
    parent_entity: Animal
    write_endpoint: "POST /population-recommendations"
    occ_field: "expected_subject_animal_version"
    description: |
      A new PopulationRecommendation for a subject animal legitimately supersedes any
      PROPOSED recommendation already standing for that animal in the same plan cycle,
      so a writer whose view of the animal predates that supersede would otherwise
      overwrite a decision it never saw. Creating a recommendation against an Animal
      whose version has advanced past the submitted expected_subject_animal_version is
      therefore rejected with ERR_STALE_ANIMAL_VERSION, and the writer must re-read the
      animal (whose pending_recommendation_id now names the standing recommendation)
      before retrying.
    error_id: ERR_STALE_ANIMAL_VERSION
    http_status: 412
  - rule_id: booking-create-stale-agreement
    parent_entity: TransferAgreement
    write_endpoint: "POST /shipment-bookings"
    occ_field: "expected_transfer_agreement_version"
    description: |
      A new ShipmentBooking legitimately supersedes a RESERVED booking already held
      against the same agreement, moving the earlier booking to ABORTED and releasing
      its carrier interval, so a writer holding a stale view of the agreement would
      cancel transport arrangements it never observed. Creating a booking against a
      TransferAgreement whose version has advanced past the submitted
      expected_transfer_agreement_version is rejected with ERR_STALE_AGREEMENT_VERSION.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

calculations:
  - name: kinship_and_pairing_verdict
    trigger: "On POST /population-recommendations, before the recommendation row is persisted."
    algorithm: threshold
    formula: |
      # --- pedigree kinship between subject_animal and paired_animal ---
      # Evaluate every relationship class below against the two animals' sire_id / dam_id
      # ancestry (three generations are sufficient because the API stores sire_id/dam_id only).
      # A null parent pointer never matches another null parent pointer.
      applicable = []
      if subject.sire_id == paired.sire_id != null AND subject.dam_id == paired.dam_id != null:
          applicable += [0.2500]     # full siblings
      elif (subject.sire_id == paired.sire_id != null) XOR (subject.dam_id == paired.dam_id != null):
          applicable += [0.1250]     # half siblings
      if paired.id IN {subject.sire_id, subject.dam_id} OR subject.id IN {paired.sire_id, paired.dam_id}:
          applicable += [0.2500]     # parent - offspring
      if paired.id IN grandparents(subject) OR subject.id IN grandparents(paired):
          applicable += [0.1250]     # grandparent - grandoffspring
      if paired IS a full or half sibling of a parent of subject OR vice versa:
          applicable += [0.1250]     # aunt/uncle - niece/nephew
      if a parent of subject and a parent of paired are full or half siblings:
          applicable += [0.0625]     # first cousins
      f_pedigree = max(applicable) if applicable else 0.0000
      kinship_coefficient = round_half_up(f_pedigree, 4)

      # --- projected offspring inbreeding: analysis-mode dependent (see variants) ---
      if analysis_mode == "PEDIGREE_ONLY":
          projected_offspring_inbreeding = round_half_up(f_pedigree, 4)
      else:  # PEDIGREE_PLUS_MOLECULAR
          projected_offspring_inbreeding = round_half_up(
              MOLECULAR_WEIGHT * (molecular_similarity_pct / 100)
              + (1 - MOLECULAR_WEIGHT) * f_pedigree, 4)

      # --- verdict: inclusive lower bounds on both bands ---
      if recommendation_type != "BREED_WITH":
          pairing_verdict = "NOT_APPLICABLE"          # and both coefficients are 0.0000
      elif projected_offspring_inbreeding >= MAX_OFFSPRING_INBREEDING:
          pairing_verdict = "NOT_RECOMMENDED"
      elif projected_offspring_inbreeding >= MAX_OFFSPRING_INBREEDING / 2:
          pairing_verdict = "CONDITIONAL"
      else:
          pairing_verdict = "RECOMMENDED"
    input_set: |
      The subject animal, the paired animal, and their sire_id / dam_id ancestry. Animals with
      location_status == DISPOSED still count as ancestors: pedigree is history, not inventory.
      molecular_similarity_pct is read only when analysis_mode == PEDIGREE_PLUS_MOLECULAR; when
      analysis_mode == PEDIGREE_ONLY a submitted molecular_similarity_pct is stored but ignored.
    constants:
      MAX_OFFSPRING_INBREEDING: 0.125
      MOLECULAR_WEIGHT: 0.40
    precision: "kinship_coefficient and projected_offspring_inbreeding: 4 decimal places, round_half_up. The verdict comparison uses the rounded value, never the unrounded intermediate."
    variants:
      - name: pedigree_only
        when: "analysis_mode == PEDIGREE_ONLY"
        difference: "projected_offspring_inbreeding equals the pedigree kinship coefficient exactly; molecular_similarity_pct contributes nothing, so an unrelated pair scores 0.0000 and always lands on RECOMMENDED."
      - name: pedigree_plus_molecular
        when: "analysis_mode == PEDIGREE_PLUS_MOLECULAR"
        difference: "projected_offspring_inbreeding blends MOLECULAR_WEIGHT of the marker similarity with (1 - MOLECULAR_WEIGHT) of the pedigree coefficient, so an unrelated pair (f_pedigree 0.0000) can still be pushed to NOT_RECOMMENDED once molecular_similarity_pct reaches 31.25."

  - name: demographic_need_index
    trigger: "On POST /population-recommendations, after kinship_and_pairing_verdict has produced kinship_coefficient."
    algorithm: weighted_scoring
    formula: |
      gap_ratio = clamp(round_half_up(
          (program.target_population_size - program.current_population_count)
          / program.target_population_size, 6), 0.0, 1.0)
      founder_scarcity = round_half_up(1 - (subject_animal.founder_representation_pct / 100), 4)
      kinship_relief   = clamp(round_half_up(
          1 - (kinship_coefficient / MAX_OFFSPRING_INBREEDING), 4), 0.0, 1.0)
      demographic_need_index = round_half_up(
          PROGRAM_WEIGHT[program.program_type]
          * (0.5 * gap_ratio + 0.3 * founder_scarcity + 0.2 * kinship_relief), 4)
      genetic_value_score = round_half_up(demographic_need_index * 100, 2)
    input_set: |
      The species program named by the recommendation and its live current_population_count
      (animals of that program whose location_status != DISPOSED), plus the subject animal's
      founder_representation_pct and the kinship coefficient computed for this recommendation.
      The three factor weights 0.5 / 0.3 / 0.2 are fixed and sum to 1.0; PROGRAM_WEIGHT scales
      the whole composite afterwards, so a STUDBOOK_ONLY program can never out-score an SSP_RED
      program on identical demographics.
    constants:
      PROGRAM_WEIGHT: { SSP_GREEN: 0.6, SSP_YELLOW: 0.8, SSP_RED: 1.0, STUDBOOK_ONLY: 0.3 }
      MAX_OFFSPRING_INBREEDING: 0.125
    precision: |
      Each factor is rounded before the weighted sum (gap_ratio to 6 places, founder_scarcity
      and kinship_relief to 4), the composite to 4 places, genetic_value_score to 2 places, all
      round_half_up. genetic_value_score is derived from the ROUNDED demographic_need_index, not
      from the unrounded composite.

  - name: transfer_credit_valuation
    trigger: "Variant provisional_at_execution runs on POST /transfer-agreements/{agreementId}/execute; variant final_at_delivery runs on POST /shipment-bookings/{bookingId}/deliver."
    algorithm: weighted_scoring
    formula: |
      # valuation_date = the logical clock date of the triggering request
      animal_age_years = whole elapsed anniversaries from animal.birth_date to valuation_date
                         (the year count increments on the birth-date anniversary, so an
                          animal born 2019-05-10 is 7 on 2026-05-10 and still 6 on 2026-05-09)

      # THREE COMPONENTS, EACH ROUNDED TO 2 PLACES BEFORE THEY ARE SUMMED.
      genetic_component   = round_half_up(recommendation.genetic_value_score * GENETIC_RATE, 2)
      husbandry_component = round_half_up(animal_age_years * HUSBANDRY_RATE, 2)
      transport_component = round_half_up(TRANSPORT_BASE_POINTS
                                         * (agreement.transport_cost_share_pct / 100), 2)
      subtotal = genetic_component + husbandry_component + transport_component
      credit_points = round_half_up(subtotal * OWNERSHIP_MULTIPLIER[ownership_disposition], 2)

      # Variant provisional_at_execution stops here:
      provisional_credit_points = credit_points

      # Variant final_at_delivery continues with the transport penalty:
      thermal_penalty     = round_half_up(booking.thermal_excursion_minutes
                                          * THERMAL_PENALTY_PER_MINUTE, 2)
      final_credit_points = max(round_half_up(credit_points - thermal_penalty, 2), 0.00)
    input_set: |
      The agreement's recommendation (for genetic_value_score frozen at recommendation creation),
      the transferred animal (for birth_date), the agreement terms standing at the triggering
      request, and — for final_at_delivery only — the delivering booking's
      thermal_excursion_minutes. A terminated agreement's posting is reversed at its recorded
      net value, never recomputed.
    constants:
      GENETIC_RATE: 0.50
      HUSBANDRY_RATE: 1.125
      TRANSPORT_BASE_POINTS: 12.5
      OWNERSHIP_MULTIPLIER: { OWNERSHIP_TRANSFER: 1.00, BREEDING_LOAN: 0.50, LOAN_WITH_RETAINED_OWNERSHIP: 0.65 }
      THERMAL_PENALTY_PER_MINUTE: 0.05
    precision: |
      2 decimal places, round_half_up, and THE ROUNDING ORDER IS PART OF THE RULE: each of the
      three components is rounded to 2 places first and the rounded values are summed. Summing
      the unrounded components and rounding once at the end is a different number
      (HUSBANDRY_RATE 1.125 and TRANSPORT_BASE_POINTS 12.5 are chosen so that the two orders
      diverge by 0.01 on ordinary inputs). The ownership multiplier is applied to the subtotal
      after that sum, and the product is rounded again.
    variants:
      - name: provisional_at_execution
        when: "POST /transfer-agreements/{agreementId}/execute — the animal has not moved yet"
        difference: "Valued at the execution date and with no transport penalty, because no temperature record exists yet. Stored in provisional_credit_points and posted to both institutions' transfer_credit_balance immediately."
      - name: final_at_delivery
        when: "POST /shipment-bookings/{bookingId}/deliver — the animal has arrived"
        difference: "Re-valued at the DELIVERY date, so an animal that crossed a birthday in transit gains a husbandry year, and the thermal penalty for the delivered temperature record is subtracted. Stored in final_credit_points; the ledger is adjusted by the delta (final_credit_points - provisional_credit_points) on both institutions rather than re-posted."

  - name: thermal_excursion_window
    trigger: "On POST /shipment-bookings/{bookingId}/deliver, from the temperature_samples in the request body."
    algorithm: chronological
    formula: |
      # samples are ordered readings taken SAMPLE_INTERVAL_MINUTES apart across the journey
      out_of_envelope = count(s in temperature_samples
                              where s < booking.temp_min_c OR s > booking.temp_max_c)
      thermal_excursion_minutes = SAMPLE_INTERVAL_MINUTES * out_of_envelope
    input_set: |
      Only the samples submitted with the delivery request, evaluated against the temp_min_c /
      temp_max_c envelope recorded when the booking was created. The envelope is INCLUSIVE at
      both ends: a reading exactly equal to temp_min_c or temp_max_c is inside the envelope and
      contributes zero minutes. An empty temperature_samples array yields 0 minutes.
    constants:
      SAMPLE_INTERVAL_MINUTES: 30
      MAX_EXCURSION_MINUTES: 90
    precision: "Integer minutes; no rounding is involved because the count is exact."

  - name: quarantine_requirement
    trigger: "On POST /shipment-bookings/{bookingId}/deliver, when the agreement's SCHEDULED QuarantineOccupancy is activated."
    algorithm: threshold
    formula: |
      isolation_class = "ENHANCED" if booking.thermal_excursion_minutes > MAX_EXCURSION_MINUTES
                        else "STANDARD"
      required_days   = QUARANTINE_MIN_DAYS_ENHANCED if isolation_class == "ENHANCED"
                        else QUARANTINE_MIN_DAYS_STANDARD
      # clearance eligibility, evaluated on POST /quarantine-occupancies/{id}/clear
      days_served = (logical clock date - occupancy.actual_start_date) in whole days
      clearance_allowed = days_served >= occupancy.required_days
    input_set: |
      The delivering booking's thermal_excursion_minutes and, at clearance time, the occupancy's
      actual_start_date (the DELIVERY date, not the scheduled_start_date) against the logical
      clock. The threshold is STRICT: an excursion of exactly MAX_EXCURSION_MINUTES stays
      STANDARD, and one sample-interval more flips the occupancy to ENHANCED and adds 15 days.
      Clearance eligibility is INCLUSIVE: serving exactly required_days is enough.
    constants:
      MAX_EXCURSION_MINUTES: 90
      QUARANTINE_MIN_DAYS_STANDARD: 30
      QUARANTINE_MIN_DAYS_ENHANCED: 45
    precision: "Whole days, computed on calendar dates in UTC; partial days are truncated."

  - name: quarantine_room_availability
    trigger: "On POST /quarantine-occupancies, before the occupancy is persisted."
    algorithm: interval_merge
    formula: |
      for each existing occupancy E with the same (institution_id, quarantine_room_code)
      and E.phase IN {SCHEDULED, ACTIVE, CLEARED, FAILED}:
          buffer_days = EXTENDED_SANITATION_DAYS if E.phase == "FAILED"
                        else SANITATION_BUFFER_DAYS
          E_end = (E.cleared_on if E.phase == "CLEARED" else E.scheduled_end_date)
          blocked = [E.scheduled_start_date, E_end + buffer_days)      # HALF-OPEN
          if [new.scheduled_start_date, new.scheduled_end_date) overlaps blocked:
              reject ERR_QUARANTINE_ROOM_CONFLICT
      # CANCELLED occupancies block nothing and carry no sanitation buffer.
    input_set: |
      Every non-CANCELLED occupancy of the same room at the same institution, whatever its
      transfer agreement. Intervals are HALF-OPEN on both sides, so a new occupancy may start on
      the exact day the previous blocked window ends. The buffer is phase-conditional: a room
      released by a FAILED occupancy is blocked for EXTENDED_SANITATION_DAYS instead of
      SANITATION_BUFFER_DAYS, so the same requested dates are accepted after a clean occupancy
      and rejected after a failed one.
    constants:
      SANITATION_BUFFER_DAYS: 3
      EXTENDED_SANITATION_DAYS: 14
    precision: "Whole calendar dates in UTC."

  - name: carrier_overlap_capacity
    trigger: "On POST /shipment-bookings, before the booking is persisted."
    algorithm: aggregation
    formula: |
      overlapping = count(B in ShipmentBooking
                          where B.carrier_code == new.carrier_code
                            and B.status IN {RESERVED, CONFIRMED, IN_TRANSIT}
                            and B.departure_utc <= new.arrival_utc
                            and new.departure_utc <= B.arrival_utc)      # CLOSED intervals
      if overlapping >= CARRIER_OVERLAP_LIMIT:
          reject ERR_CARRIER_CAPACITY_EXCEEDED
    input_set: |
      Live bookings of the same carrier_code across every institution and every agreement.
      DELIVERED and ABORTED bookings release their interval and are excluded. The comparison is
      CLOSED on both ends, so two journeys that merely touch endpoints (one arriving exactly
      when the next departs) DO count as overlapping — deliberately the opposite of the
      half-open room rule, so the two overlap rules cannot share one implementation.
    constants:
      CARRIER_OVERLAP_LIMIT: 2
    precision: "Instant comparison at second granularity on the UTC timestamps."

  - name: crate_training_currency
    trigger: "Recomputed on POST /animals/{animalId}/crate-training-sessions; read on POST /shipment-bookings/{bookingId}/confirm."
    algorithm: aggregation
    formula: |
      crate_training_sessions_count = count(sessions recorded for the animal)
      last_crate_session_on        = max(session_date over those sessions)
      # confirmation gate
      if crate_training_sessions_count < MIN_CRATE_SESSIONS: reject ERR_CRATE_TRAINING_INCOMPLETE
      staleness_days = (booking.departure_utc date - last_crate_session_on) in whole days
      if staleness_days > CRATE_RECENCY_DAYS: reject ERR_CRATE_TRAINING_STALE
    input_set: |
      Every crate-training session ever recorded for the animal, including sessions recorded
      before the current agreement existed. Sessions are never expired or pruned, so the count
      gate and the recency gate are independent: an animal can satisfy the count and still fail
      recency, and the two produce different errors at different priorities.
    constants:
      MIN_CRATE_SESSIONS: 5
      CRATE_RECENCY_DAYS: 14
    precision: "Whole calendar days; last_crate_session_on is the latest session_date, which need not be the most recently created session."

  - name: document_validity_window
    trigger: "On POST /compliance-documents/{documentId}/decision with outcome == ISSUE."
    algorithm: chronological
    formula: |
      if document_type == "INTERSTATE_CVI":
          valid_from  = exam_date
          valid_until = exam_date + CVI_VALIDITY_DAYS
      else:                                    # every permit type
          valid_from  = logical clock date of the decision
          valid_until = the valid_until supplied in the decision payload
      # panel currency, checked before the CVI is issued
      panel_current = every required test has
                      0 <= (exam_date - test.collected_on) <= TEST_VALIDITY_DAYS
      # expiry gate, evaluated on POST /shipment-bookings/{bookingId}/confirm
      if certificate.valid_until < booking.arrival_utc date:
          reject ERR_HEALTH_CERTIFICATE_EXPIRED
    input_set: |
      The document's own exam_date for a CVI, the decision payload for permits, and the
      PreShipmentTest rows of the same agreement for the panel-currency check. A test collected
      AFTER the exam_date does not count toward the panel. The expiry gate compares against the
      booking's ARRIVAL date, not its departure date, so a certificate that is valid at
      departure but lapses in flight is refused.
    constants:
      CVI_VALIDITY_DAYS: 30
      TEST_VALIDITY_DAYS: 60
    precision: "Whole calendar dates in UTC; valid_until is INCLUSIVE."

  - name: studbook_lateness_assessment
    trigger: "Computed on POST /studbook-submissions; posted to the institution on POST /studbook-submissions/{submissionId}/review."
    algorithm: tiered_pricing
    formula: |
      deadline  = reporting_period_end + SUBMISSION_GRACE_DAYS
      days_late = max(0, (submitted_on - deadline) in whole days)
      base_points = min(round_half_up(days_late * LATE_POINT_PER_DAY, 2), LATE_POINT_CAP)

      # THE TIER IS SELECTED FROM base_points ONLY, AND IS NEVER RE-EVALUATED AFTERWARDS.
      surcharge_multiplier = 0.40 if base_points >= 15
                       else  0.25 if base_points >= 8
                       else  0.10 if base_points >= 3
                       else  0.00
      surcharge_points        = round_half_up(base_points * surcharge_multiplier, 2)
      total_compliance_points = round_half_up(base_points + surcharge_points, 2)

      # posting, at review time, for BOTH review outcomes
      institution.compliance_points_balance += total_compliance_points
      if institution.accreditation_status == "ACCREDITED"
         and institution.compliance_points_balance >= ACCREDITATION_REVIEW_POINTS:
             institution.accreditation_status = "PROVISIONAL"
    input_set: |
      One submission at a time for the base and surcharge; the institution's whole submission
      history for the posted balance, since compliance_points_balance accumulates across every
      REVIEWED submission and is never decayed. Submissions still in SUBMITTED contribute
      nothing to the balance, so the demotion fires at review time, not at filing time.
    constants:
      SUBMISSION_GRACE_DAYS: 30
      LATE_POINT_PER_DAY: 0.5
      LATE_POINT_CAP: 20
      ACCREDITATION_REVIEW_POINTS: 21.00
    precision: |
      2 decimal places, round_half_up, and THE EVALUATION ORDER IS PART OF THE RULE: the tier is
      keyed on base_points alone. Re-deriving the multiplier from total_compliance_points (or
      applying the cap after the surcharge instead of before it) puts ordinary inputs in a
      higher tier and yields a different total.

  - name: holding_slot_occupancy
    trigger: "Recomputed on every transition that moves an Animal between location_status values: agreement execute, booking depart, booking deliver, quarantine clear/fail, protocol integrate/abort, agreement terminate, animal disposition."
    algorithm: aggregation
    formula: |
      occupied_slots(I) = count(A in Animal
                                where A.holding_institution_id == I.id
                                  and A.location_status IN {HELD, IN_QUARANTINE,
                                        AWAITING_INTRODUCTION, INTRODUCING})
      reserved_slots(I) = count(A in Animal
                                where A.location_status IN {RESERVED, IN_TRANSIT}
                                  and A's live agreement (status IN {EXECUTED})
                                      .receiving_institution_id == I.id)
      # capacity gate on POST /transfer-agreements/{agreementId}/execute
      if receiving.occupied_slots + receiving.reserved_slots + 1 > receiving.holding_capacity_slots:
          reject ERR_HOLDING_CAPACITY_EXCEEDED
      # SLOT_CONSERVATION invariant, true after every write
      sum over all institutions of (occupied_slots + reserved_slots)
          == count(A in Animal where A.location_status != "DISPOSED")
    input_set: |
      Every animal that is not DISPOSED, counted exactly once system-wide: an animal in HELD,
      IN_QUARANTINE, AWAITING_INTRODUCTION or INTRODUCING occupies a slot at its holder, and an
      animal in RESERVED or IN_TRANSIT reserves a slot at the receiving institution of its
      executed agreement while no longer occupying one at the sender. DISPOSED animals occupy
      and reserve nothing.
    constants: {}
    precision: "Integer counts; both fields are fully recomputed on every triggering write rather than incremented, so a compensating transition cannot leave drift."

  - name: transfer_credit_ledger
    trigger: "Posted on agreement execute, adjusted on booking deliver, reversed on agreement terminate."
    algorithm: aggregation
    formula: |
      execute:   sending.transfer_credit_balance += provisional_credit_points
                 receiving.transfer_credit_balance -= provisional_credit_points
      deliver:   delta = final_credit_points - provisional_credit_points
                 sending.transfer_credit_balance += delta
                 receiving.transfer_credit_balance -= delta
      terminate: net = final_credit_points if final_credit_points is not null
                       else provisional_credit_points
                 sending.transfer_credit_balance -= net
                 receiving.transfer_credit_balance += net
      # ZERO_SUM invariant, true after every write
      sum over all institutions of transfer_credit_balance == 0.00
    input_set: |
      Only the two institutions party to the agreement are ever touched, and every posting is
      double-entry, so the system-wide sum is 0.00 at rest, after execution, after delivery
      re-valuation and after a compensating termination. A terminated agreement's reversal uses
      the RECORDED net posting, never a fresh valuation, so a birthday or a temperature record
      between execution and termination cannot leave residue.
    constants: {}
    precision: "2 decimal places, round_half_up; balances are stored signed and may be negative."

  - name: program_recommendation_rollup
    trigger: "Recomputed on recommendation create/endorse/supersede/expire/decline, on agreement execute and terminate, and on protocol abort."
    algorithm: aggregation
    formula: |
      current_population_count(P) = count(A in Animal
                                          where A.species_program_id == P.id
                                            and A.location_status != "DISPOSED")
      open_recommendation_count(P) = count(R in PopulationRecommendation
                                           where R.species_program_id == P.id
                                             and R.plan_cycle == P.current_plan_cycle
                                             and R.status IN {PROPOSED, ENDORSED})
      # plan-cycle bubble-up
      if P.plan_status == "PUBLISHED" and open_recommendation_count(P) == 0
         and at least one recommendation has ever existed in the current cycle:
             P.plan_status = "CYCLE_CLOSED"; P.cycle_closed_on = logical clock date
      if P.plan_status == "CYCLE_CLOSED" and open_recommendation_count(P) > 0:
             P.plan_status = "PUBLISHED"; P.cycle_closed_on = null
    input_set: |
      Recommendations of the program's CURRENT plan cycle only; recommendations left over from an
      earlier cycle are ignored even when still PROPOSED. FULFILLED, DECLINED, SUPERSEDED and
      EXPIRED recommendations all leave the open set, which is what makes the cycle close, and a
      compensating revert from FULFILLED back to ENDORSED is what makes it reopen.
    constants: {}
    precision: "Integer counts, fully recomputed on every triggering write."

  - name: transfer_scope_derivation
    trigger: "On POST /transfer-agreements, from the two institutions' jurisdiction_code values."
    algorithm: threshold
    formula: |
      sending_country   = first 2 characters of sending.jurisdiction_code
      receiving_country = first 2 characters of receiving.jurisdiction_code
      if sending.jurisdiction_code == receiving.jurisdiction_code:
          transfer_scope = "INTRA_JURISDICTION"
      elif sending_country != receiving_country:
          transfer_scope = "INTERNATIONAL"
      else:
          transfer_scope = "INTERSTATE"
      # required document panel, keyed on the derived scope
      REQUIRED_DOCUMENTS = {
        INTRA_JURISDICTION: [],
        INTERSTATE:         ["INTERSTATE_CVI", "STATE_IMPORT_PERMIT"],
        INTERNATIONAL:      ["INTERSTATE_CVI", "CITES_EXPORT_PERMIT", "CITES_IMPORT_PERMIT"],
      }
      REQUIRED_TEST_PANEL = {
        INTRA_JURISDICTION: ["TB"],
        INTERSTATE:         ["TB", "BRUCELLA"],
        INTERNATIONAL:      ["TB", "BRUCELLA", "HERPESVIRUS", "FECAL_PARASITE"],
      }
    input_set: |
      The two institutions as they stand when the agreement is created. transfer_scope is frozen
      at creation: a later change to either institution's jurisdiction_code does not re-derive it,
      so the document and test panels an agreement must satisfy are stable for its whole life.
      USDA_TRANSPORT_PERMIT is never required by any scope and is accepted as an optional extra.
    constants: {}
    precision: "Exact string comparison; jurisdiction_code always matches ^[A-Z]{2}-[A-Z0-9]{2,3}$."

  - name: introduction_aggression_accumulator
    trigger: "On POST /introduction-protocols/{protocolId}/observations, before the stage decision is taken."
    algorithm: chronological
    formula: |
      points(observation) = AGGRESSION_POINTS[observation.aggression_level]
      stage_points  = sum of points over the observations recorded SINCE the current stage began
                      (this observation included)
      aggression_score_total = sum of points over EVERY observation of the protocol, never reset
      observation_count      = count of every observation of the protocol, never reset
      sessions_at_stage      = count of observations since the current stage began

      # decision order: regression is evaluated BEFORE advancement
      if stage_points >= AGGRESSION_REGRESSION_THRESHOLD:
          -> regress one stage (or ABORT from HOWDY, or ABORT when
             regression_count + 1 > MAX_REGRESSIONS); reset stage_points and sessions_at_stage
      elif sessions_at_stage >= MIN_SESSIONS_PER_STAGE
           and the last CALM_ADVANCE_MAX observations at this stage are all CALM:
          -> advance one stage; reset stage_points and sessions_at_stage
      else:
          -> stay at the current stage
    input_set: |
      Observations are processed in the order they were recorded (by created_at); the stage
      accumulator sees only the observations recorded since the last stage change, while
      aggression_score_total and observation_count span the protocol's whole history. Because
      the accumulator resets on every stage change, the SAME sequence of aggression levels
      produces different stages depending on where the resets fell.
    constants:
      AGGRESSION_POINTS: { CALM: 0, MINOR_AGGRESSION: 2, SEVERE_AGGRESSION: 5 }
      AGGRESSION_REGRESSION_THRESHOLD: 6
      MAX_REGRESSIONS: 2
      MIN_SESSIONS_PER_STAGE: 3
      CALM_ADVANCE_MAX: 2
    precision: "Integer points; aggression_score_total is stored with 2 decimal places for envelope consistency but is always an exact integer value."

validations:
  - priority: 10
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 20
    category: auth
    check: "The X-User-Role value is one of the four declared roles and appears in the endpoint's authorized_roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 25
    category: business_constraint
    check: "Request body and query parameters satisfy the declared schema: required fields present, enum values in range, numbers within their stated bounds, dates and instants well-formed ISO-8601, scheduled_end_date strictly after scheduled_start_date, arrival_utc strictly after departure_utc, temp_max_c strictly greater than temp_min_c, limit in [1,100] and offset >= 0."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 30
    category: existence
    check: "Every resource named in the path exists, validated left to right, before any resource named in the body; then every foreign key in the body exists, validated in the field order declared in §1.1."
    error_id: "ERR_SPECIES_PROGRAM_NOT_FOUND | ERR_INSTITUTION_NOT_FOUND | ERR_VETERINARIAN_NOT_FOUND | ERR_ANIMAL_NOT_FOUND | ERR_RECOMMENDATION_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_DOCUMENT_NOT_FOUND | ERR_TEST_NOT_FOUND | ERR_OCCUPANCY_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_PROTOCOL_NOT_FOUND | ERR_SUBMISSION_NOT_FOUND"
    http_status: 404
    applies_to: "all"
  - priority: 35
    category: business_referential
    check: "The acting identity owns the resource it is acting on: a Registrar's X-User-ID must equal the Institution id the write belongs to, and a ProgramCoordinator's X-User-ID must equal the SpeciesProgram id."
    error_id: ERR_ACTOR_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /species-programs/{speciesProgramId}/publish-plan, POST /veterinarians, POST /animals, POST /animals/{animalId}/crate-training-sessions, POST /animals/{animalId}/disposition, POST /studbook-submissions, POST /studbook-submissions/{submissionId}/review, POST /introduction-protocols"
  - priority: 35
    category: business_referential
    check: "The acting institution is the sending or the receiving party of the agreement it is acting on."
    error_id: ERR_NOT_A_PARTY_TO_AGREEMENT
    http_status: 403
    applies_to: "POST /transfer-agreements/{agreementId}/offer, POST /transfer-agreements/{agreementId}/counter, POST /transfer-agreements/{agreementId}/accept, POST /transfer-agreements/{agreementId}/execute, POST /transfer-agreements/{agreementId}/terminate, POST /shipment-bookings, POST /shipment-bookings/{bookingId}/confirm, POST /shipment-bookings/{bookingId}/depart, POST /shipment-bookings/{bookingId}/deliver, POST /compliance-documents, POST /pre-shipment-tests, POST /quarantine-occupancies"
  - priority: 35
    category: business_referential
    check: "A Veterinarian acts only for their own institution: the acting veterinarian's institution_id must equal the institution that owns the resource (the occupancy's institution_id, or the sending institution for a pre-shipment test or a CVI)."
    error_id: ERR_VET_INSTITUTION_MISMATCH
    http_status: 403
    applies_to: "POST /pre-shipment-tests, POST /compliance-documents/{documentId}/decision, POST /quarantine-occupancies/{occupancyId}/clear, POST /quarantine-occupancies/{occupancyId}/fail"
  - priority: 35
    category: business_referential
    check: "The issuing authority matches the document kind: an INTERSTATE_CVI is decided only by a Veterinarian, and every permit type only by an AccreditationAdmin."
    error_id: ERR_WRONG_ISSUING_AUTHORITY
    http_status: 403
    applies_to: "POST /compliance-documents/{documentId}/decision"
  - priority: 38
    category: business_referential
    check: "Negotiation alternates: the acting institution must not be the agreement's last_action_institution_id."
    error_id: ERR_NOT_COUNTERPARTY_TURN
    http_status: 403
    applies_to: "POST /transfer-agreements/{agreementId}/counter, POST /transfer-agreements/{agreementId}/accept, POST /transfer-agreements/{agreementId}/offer on a COUNTERED agreement"
  - priority: 38
    category: business_referential
    check: "Duties are segregated: the veterinarian who collected a pre-shipment test for the agreement must not be the veterinarian who signs the agreement's INTERSTATE_CVI, and the veterinarian who clears a quarantine occupancy must not be the one who signed that agreement's CVI."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /compliance-documents/{documentId}/decision, POST /quarantine-occupancies/{occupancyId}/clear"
  - priority: 45
    category: state
    check: "expected_subject_animal_version equals the subject Animal's current version (concurrency_rules[recommendation-create-stale-animal])."
    error_id: ERR_STALE_ANIMAL_VERSION
    http_status: 412
    applies_to: "POST /population-recommendations"
  - priority: 45
    category: state
    check: "expected_transfer_agreement_version equals the parent TransferAgreement's current version (concurrency_rules[booking-create-stale-agreement])."
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    applies_to: "POST /shipment-bookings"
  - priority: 50
    category: state
    check: "The species program's plan_status is PUBLISHED, so recommendations may be raised against the current cycle."
    error_id: ERR_PROGRAM_PLAN_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /population-recommendations"
  - priority: 50
    category: state
    check: "A standing recommendation for the same (subject_animal_id, plan_cycle) is still PROPOSED, so it can be superseded; an ENDORSED or FULFILLED predecessor blocks the create."
    error_id: ERR_RECOMMENDATION_ALREADY_ENDORSED
    http_status: 409
    applies_to: "POST /population-recommendations"
  - priority: 50
    category: state
    check: "The recommendation is in the state its operation requires: PROPOSED to be endorsed, ENDORSED to found or execute an agreement."
    error_id: ERR_RECOMMENDATION_NOT_ENDORSED
    http_status: 409
    applies_to: "POST /population-recommendations/{recommendationId}/endorse, POST /transfer-agreements, POST /transfer-agreements/{agreementId}/accept, POST /transfer-agreements/{agreementId}/execute"
  - priority: 50
    category: state
    check: "The agreement's status admits the requested transition, per the TransferAgreement state machine."
    error_id: ERR_AGREEMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /transfer-agreements/{agreementId}/offer, POST /transfer-agreements/{agreementId}/counter, POST /transfer-agreements/{agreementId}/accept, POST /transfer-agreements/{agreementId}/execute, POST /transfer-agreements/{agreementId}/terminate, POST /compliance-documents, POST /pre-shipment-tests, POST /quarantine-occupancies, POST /shipment-bookings, POST /introduction-protocols"
  - priority: 50
    category: state
    check: "The compliance document is still DRAFT, so a decision can be recorded."
    error_id: ERR_DOCUMENT_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /compliance-documents/{documentId}/decision"
  - priority: 50
    category: state
    check: "The booking's status admits the requested transition (RESERVED to confirm, CONFIRMED to depart, IN_TRANSIT to deliver)."
    error_id: ERR_BOOKING_INVALID_STATE
    http_status: 409
    applies_to: "POST /shipment-bookings/{bookingId}/confirm, POST /shipment-bookings/{bookingId}/depart, POST /shipment-bookings/{bookingId}/deliver"
  - priority: 50
    category: state
    check: "The quarantine occupancy is ACTIVE, so it can be cleared or failed."
    error_id: ERR_QUARANTINE_NOT_CLEARED
    http_status: 409
    applies_to: "POST /quarantine-occupancies/{occupancyId}/clear, POST /quarantine-occupancies/{occupancyId}/fail, POST /introduction-protocols"
  - priority: 50
    category: state
    check: "The introduction protocol's stage is not terminal, so an observation can still be recorded."
    error_id: ERR_PROTOCOL_STAGE_INVALID
    http_status: 409
    applies_to: "POST /introduction-protocols/{protocolId}/observations"
  - priority: 50
    category: state
    check: "The studbook submission is still SUBMITTED, so a review can be recorded."
    error_id: ERR_SUBMISSION_ALREADY_REVIEWED
    http_status: 409
    applies_to: "POST /studbook-submissions/{submissionId}/review"
  - priority: 50
    category: state
    check: "The animal's location_status admits the operation: HELD to found or execute an agreement or to be disposed, RESERVED to depart, IN_TRANSIT to be delivered, AWAITING_INTRODUCTION to start a protocol."
    error_id: ERR_ANIMAL_LOCATION_CONFLICT
    http_status: 409
    applies_to: "POST /transfer-agreements, POST /transfer-agreements/{agreementId}/execute, POST /animals/{animalId}/disposition, POST /shipment-bookings/{bookingId}/depart, POST /shipment-bookings/{bookingId}/deliver, POST /introduction-protocols"
  - priority: 50
    category: state
    check: "No other TransferAgreement for the same animal is in DRAFT, OFFERED, COUNTERED, ACCEPTED or EXECUTED."
    error_id: ERR_ANIMAL_HAS_ACTIVE_AGREEMENT
    http_status: 409
    applies_to: "POST /transfer-agreements"
  - priority: 60
    category: business_safety
    check: "Both parties hold live accreditation (ACCREDITED or PROVISIONAL); a SUSPENDED or TERMINATED institution may neither send nor receive."
    error_id: ERR_INSTITUTION_NOT_ACCREDITED
    http_status: 422
    applies_to: "POST /transfer-agreements, POST /transfer-agreements/{agreementId}/accept, POST /transfer-agreements/{agreementId}/execute"
  - priority: 60
    category: business_safety
    check: "An INTERNATIONAL transfer requires the receiving institution to be fully ACCREDITED; PROVISIONAL standing is sufficient only for domestic scopes."
    error_id: ERR_INTERNATIONAL_TRANSFER_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /transfer-agreements/{agreementId}/execute"
  - priority: 60
    category: business_safety
    check: "An OWNERSHIP_TRANSFER requires the receiving institution to have disposition_policy_on_file == true."
    error_id: ERR_DISPOSITION_POLICY_MISSING
    http_status: 422
    applies_to: "POST /transfer-agreements/{agreementId}/execute"
  - priority: 60
    category: business_safety
    check: "The acting or referenced veterinarian's license_status is ACTIVE and the license_jurisdiction matches the jurisdiction the document is issued for."
    error_id: ERR_VET_LICENSE_INVALID
    http_status: 422
    applies_to: "POST /pre-shipment-tests, POST /compliance-documents/{documentId}/decision, POST /quarantine-occupancies/{occupancyId}/clear, POST /quarantine-occupancies/{occupancyId}/fail"
  - priority: 60
    category: business_safety
    check: "An INTERSTATE_CVI for an INTERNATIONAL agreement requires usda_accreditation_category == CATEGORY_II."
    error_id: ERR_VET_NOT_ACCREDITED_FOR_SCOPE
    http_status: 422
    applies_to: "POST /compliance-documents/{documentId}/decision"
  - priority: 60
    category: business_safety
    check: "Disposition of an animal requires genetic_designation == SURPLUS_APPROVED, established by an ENDORSED SURPLUS_DISPOSITION recommendation."
    error_id: ERR_ANIMAL_NOT_SURPLUS_APPROVED
    http_status: 422
    applies_to: "POST /animals/{animalId}/disposition"
  - priority: 64
    category: business_safety
    check: "No pre-shipment test in the agreement's required panel has result POSITIVE or INCONCLUSIVE."
    error_id: ERR_POSITIVE_TEST_RESULT
    http_status: 422
    applies_to: "POST /compliance-documents/{documentId}/decision"
  - priority: 65
    category: business_safety
    check: "The agreement's required test panel is complete: one test per required test_code, each collected within TEST_VALIDITY_DAYS before the exam_date. An agreement with zero recorded tests fails here rather than passing an empty-set check."
    error_id: ERR_TEST_PANEL_INCOMPLETE
    http_status: 422
    applies_to: "POST /compliance-documents/{documentId}/decision"
  - priority: 66
    category: business_constraint
    check: "The animal has at least MIN_CRATE_SESSIONS recorded crate-training sessions."
    error_id: ERR_CRATE_TRAINING_INCOMPLETE
    http_status: 422
    applies_to: "POST /shipment-bookings/{bookingId}/confirm"
  - priority: 67
    category: business_temporal
    check: "The animal's last_crate_session_on is no more than CRATE_RECENCY_DAYS before the booking's departure date."
    error_id: ERR_CRATE_TRAINING_STALE
    http_status: 422
    applies_to: "POST /shipment-bookings/{bookingId}/confirm"
  - priority: 70
    category: business_referential
    check: "An ISSUED INTERSTATE_CVI exists for the agreement."
    error_id: ERR_HEALTH_CERTIFICATE_MISSING
    http_status: 422
    applies_to: "POST /shipment-bookings/{bookingId}/confirm"
  - priority: 71
    category: business_referential
    check: "Every permit type in the panel required by the agreement's transfer_scope has an ISSUED ComplianceDocument."
    error_id: ERR_PERMIT_NOT_ISSUED
    http_status: 422
    applies_to: "POST /shipment-bookings/{bookingId}/confirm"
  - priority: 72
    category: business_referential
    check: "A QuarantineOccupancy with phase == SCHEDULED exists at the receiving institution for the agreement."
    error_id: ERR_QUARANTINE_NOT_SCHEDULED
    http_status: 422
    applies_to: "POST /shipment-bookings/{bookingId}/confirm"
  - priority: 74
    category: business_temporal
    check: "The agreement's ISSUED INTERSTATE_CVI is still valid on the booking's arrival date (valid_until >= arrival date)."
    error_id: ERR_HEALTH_CERTIFICATE_EXPIRED
    http_status: 422
    applies_to: "POST /shipment-bookings/{bookingId}/confirm"
  - priority: 74
    category: business_temporal
    check: "The recommendation has not passed its expires_on date; the rejected request still records the recommendation as EXPIRED."
    error_id: ERR_RECOMMENDATION_EXPIRED
    http_status: 422
    applies_to: "POST /population-recommendations/{recommendationId}/endorse"
  - priority: 78
    category: business_safety
    check: "A BREED_WITH recommendation whose projected_offspring_inbreeding reached MAX_OFFSPRING_INBREEDING (pairing_verdict NOT_RECOMMENDED) cannot be endorsed."
    error_id: ERR_INBREEDING_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /population-recommendations/{recommendationId}/endorse"
  - priority: 78
    category: business_constraint
    check: "The pairing is structurally valid: a BREED_WITH recommendation names a paired_animal_id distinct from the subject, both animals belong to the same species_program_id, neither is DISPOSED, and their sex values are MALE and FEMALE in some order. HOLD and SURPLUS_DISPOSITION recommendations name no paired animal."
    error_id: ERR_INVALID_PAIRING
    http_status: 422
    applies_to: "POST /population-recommendations"
  - priority: 80
    category: business_constraint
    check: "No other animal at the same holding institution already carries the submitted local_id."
    error_id: ERR_DUPLICATE_ANIMAL_LOCAL_ID
    http_status: 422
    applies_to: "POST /animals"
  - priority: 82
    category: business_temporal
    check: "The requested quarantine room interval does not overlap another non-CANCELLED occupancy of the same (institution_id, quarantine_room_code) once that occupancy's phase-conditional sanitation buffer is added."
    error_id: ERR_QUARANTINE_ROOM_CONFLICT
    http_status: 422
    applies_to: "POST /quarantine-occupancies"
  - priority: 82
    category: business_temporal
    check: "Fewer than CARRIER_OVERLAP_LIMIT live bookings of the same carrier_code overlap the requested journey window on closed intervals."
    error_id: ERR_CARRIER_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /shipment-bookings"
  - priority: 82
    category: business_constraint
    check: "No SUBMITTED or ACCEPTED submission already exists for the same (species_program_id, institution_id, reporting_period_end, submission_type)."
    error_id: ERR_DUPLICATE_STUDBOOK_SUBMISSION
    http_status: 422
    applies_to: "POST /studbook-submissions"
  - priority: 86
    category: business_constraint
    check: "The agreement's round_number is below MAX_NEGOTIATION_ROUNDS before an offer or counter is recorded."
    error_id: ERR_NEGOTIATION_ROUND_LIMIT
    http_status: 422
    applies_to: "POST /transfer-agreements/{agreementId}/offer, POST /transfer-agreements/{agreementId}/counter"
  - priority: 86
    category: business_temporal
    check: "The occupancy has served at least required_days since actual_start_date."
    error_id: ERR_QUARANTINE_MINIMUM_NOT_MET
    http_status: 422
    applies_to: "POST /quarantine-occupancies/{occupancyId}/clear"
  - priority: 90
    category: business_fiscal
    check: "The receiving institution has a free slot: occupied_slots + reserved_slots + 1 <= holding_capacity_slots."
    error_id: ERR_HOLDING_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /transfer-agreements/{agreementId}/execute"
  - priority: 90
    category: business_fiscal
    check: "The animal is physically held by the sending institution named on the agreement."
    error_id: ERR_ANIMAL_NOT_HELD_BY_SENDER
    http_status: 422
    applies_to: "POST /transfer-agreements, POST /transfer-agreements/{agreementId}/execute"

endpoints:
  # ---------------------------------------------------------------- institutions
  - method: POST
    path: "/institutions"
    description: "Register an accredited zoological institution with its holding capacity and accreditation standing."
    roles: [AccreditationAdmin]
    code: 201
    input: [name, jurisdiction_code, accreditation_status, accreditation_expires_on, holding_capacity_slots, disposition_policy_on_file]
    output: Institution
    side_effects:
      - "occupied_slots := 0, reserved_slots := 0, transfer_credit_balance := 0.00, compliance_points_balance := 0.00"
  - method: PATCH
    path: "/institutions/{institutionId}"
    description: "Adjust an institution's accreditation standing, expiry, holding capacity or disposition-policy flag."
    roles: [AccreditationAdmin]
    code: 200
    input: ["accreditation_status?", "accreditation_expires_on?", "holding_capacity_slots?", "disposition_policy_on_file?"]
    output: Institution
    side_effects:
      - "only the supplied fields change; computed slot, credit and compliance fields are never writable"
      - "increments Institution.version by 1"
  - method: GET
    path: "/institutions/{institutionId}"
    description: "Read one institution, including its live slot counts, credit balance and compliance-points balance."
    roles: [AccreditationAdmin, ProgramCoordinator, Registrar, Veterinarian]
    code: 200
    input: []
    output: Institution
    side_effects: []
  - method: GET
    path: "/institutions"
    description: "List institutions, filterable by jurisdiction and accreditation standing."
    roles: [AccreditationAdmin, ProgramCoordinator, Registrar, Veterinarian]
    code: 200
    input: ["jurisdiction_code?", "accreditation_status?", "limit?", "offset?"]
    output: Institution[]
    side_effects: []

  # ------------------------------------------------------------- species programs
  - method: POST
    path: "/species-programs"
    description: "Create a coordinating population management programme for one taxon."
    roles: [AccreditationAdmin]
    code: 201
    input: [taxon_name, program_type, target_population_size, studbook_keeper_name]
    output: SpeciesProgram
    side_effects:
      - "plan_status := DRAFT, current_plan_cycle := 1, current_population_count := 0, open_recommendation_count := 0"
  - method: POST
    path: "/species-programs/{speciesProgramId}/publish-plan"
    description: "Publish the current population management plan so recommendations may be raised against this cycle, or reopen a closed cycle as the next one."
    roles: [ProgramCoordinator]
    code: 200
    input: ["publication_note?"]
    output: SpeciesProgram
    side_effects:
      - "DRAFT -> PUBLISHED leaves current_plan_cycle unchanged; CYCLE_CLOSED -> PUBLISHED increments current_plan_cycle by 1 and clears cycle_closed_on"
      - "program_recommendation_rollup recomputes current_population_count and open_recommendation_count"
      - "increments SpeciesProgram.version by 1"
  - method: GET
    path: "/species-programs/{speciesProgramId}"
    description: "Read one species programme with its live population and open-recommendation counts."
    roles: [AccreditationAdmin, ProgramCoordinator, Registrar, Veterinarian]
    code: 200
    input: []
    output: SpeciesProgram
    side_effects: []
  - method: GET
    path: "/species-programs"
    description: "List species programmes, filterable by programme type and plan status."
    roles: [AccreditationAdmin, ProgramCoordinator, Registrar, Veterinarian]
    code: 200
    input: ["program_type?", "plan_status?", "limit?", "offset?"]
    output: SpeciesProgram[]
    side_effects: []

  # -------------------------------------------------------------- veterinarians
  - method: POST
    path: "/veterinarians"
    description: "Register a veterinarian at the acting institution with their licence and USDA accreditation category."
    roles: [Registrar]
    code: 201
    input: [institution_id, full_name, license_number, license_jurisdiction, license_status, usda_accreditation_category]
    output: Veterinarian
    side_effects:
      - "licence status and accreditation category are fixed at registration; they are the values every later document, test and clearance check reads"
  - method: GET
    path: "/veterinarians/{veterinarianId}"
    description: "Read one veterinarian."
    roles: [AccreditationAdmin, ProgramCoordinator, Registrar, Veterinarian]
    code: 200
    input: []
    output: Veterinarian
    side_effects: []
  - method: GET
    path: "/veterinarians"
    description: "List veterinarians, filterable by employing institution and licence status."
    roles: [AccreditationAdmin, ProgramCoordinator, Registrar, Veterinarian]
    code: 200
    input: ["institution_id?", "license_status?", "usda_accreditation_category?", "limit?", "offset?"]
    output: Veterinarian[]
    side_effects: []

  # --------------------------------------------------------------------- animals
  - method: POST
    path: "/animals"
    description: "Accession an animal into the acting institution's collection with its pedigree pointers and founder representation."
    roles: [Registrar]
    code: 201
    input: ["species_program_id", "holding_institution_id", "owning_institution_id", "local_id", "sex", "birth_date", "sire_id?", "dam_id?", "founder_representation_pct"]
    output: Animal
    side_effects:
      - "location_status := HELD, genetic_designation := UNEVALUATED, pending_recommendation_id := null"
      - "crate_training_sessions_count := 0, last_crate_session_on := null"
      - "program_recommendation_rollup recomputes the programme's current_population_count"
      - "holding_slot_occupancy recomputes the holder's occupied_slots"
  - method: POST
    path: "/animals/{animalId}/crate-training-sessions"
    description: "Record one crate-training session for the animal."
    roles: [Registrar]
    code: 201
    input: [session_date, trainer_name, duration_minutes]
    output: Animal
    side_effects:
      - "crate_training_currency recomputes crate_training_sessions_count and last_crate_session_on"
      - "increments Animal.version by 1"
  - method: POST
    path: "/animals/{animalId}/disposition"
    description: "Dispose of a surplus animal under the institution's disposition policy."
    roles: [Registrar]
    code: 200
    input: ["disposition_method", "disposition_note?"]
    output: Animal
    side_effects:
      - "location_status HELD -> DISPOSED"
      - "program_recommendation_rollup recomputes current_population_count and open_recommendation_count"
      - "holding_slot_occupancy recomputes the former holder's occupied_slots"
      - "increments Animal.version by 1"
  - method: GET
    path: "/animals/{animalId}"
    description: "Read one animal, including both dimensions of its parallel state and its crate-training currency."
    roles: [AccreditationAdmin, ProgramCoordinator, Registrar, Veterinarian]
    code: 200
    input: []
    output: Animal
    side_effects: []
  - method: GET
    path: "/animals"
    description: "List animals, filterable by programme, holder, owner, pedigree pointer, pending recommendation and either state dimension."
    roles: [AccreditationAdmin, ProgramCoordinator, Registrar, Veterinarian]
    code: 200
    input: ["species_program_id?", "holding_institution_id?", "owning_institution_id?", "sire_id?", "dam_id?", "pending_recommendation_id?", "location_status?", "genetic_designation?", "limit?", "offset?"]
    output: Animal[]
    side_effects: []

  # ------------------------------------------------------ population recommendations
  - method: POST
    path: "/population-recommendations"
    description: "Raise a breeding, holding, transfer or surplus-disposition recommendation against the programme's published plan. Supersedes any PROPOSED recommendation standing for the same subject animal in the same cycle, which is why the subject animal's version must be supplied."
    roles: [ProgramCoordinator]
    code: 201
    input: ["species_program_id", "recommendation_type", "subject_animal_id", "paired_animal_id?", "sending_institution_id?", "receiving_institution_id?", "analysis_mode", "molecular_similarity_pct?", "priority_rank", "expires_on", "expected_subject_animal_version"]
    output: PopulationRecommendation
    side_effects:
      - "plan_cycle := the programme's current_plan_cycle; status := PROPOSED"
      - "kinship_and_pairing_verdict computes kinship_coefficient, projected_offspring_inbreeding and pairing_verdict"
      - "demographic_need_index computes demographic_need_index and genetic_value_score"
      - "any PROPOSED recommendation for the same (subject_animal_id, plan_cycle) -> SUPERSEDED"
      - "subject animal pending_recommendation_id := this recommendation id"
      - "increments Animal.version by 1"
      - "program_recommendation_rollup recomputes open_recommendation_count and may reopen a CYCLE_CLOSED plan"
  - method: POST
    path: "/population-recommendations/{recommendationId}/endorse"
    description: "The holding or sending institution endorses the coordinating body's recommendation, which fixes the animals' breeding designations."
    roles: [Registrar]
    code: 200
    input: ["endorsement_note?"]
    output: PopulationRecommendation
    side_effects:
      - "status PROPOSED -> ENDORSED"
      - "BREED_WITH sets both animals' genetic_designation := BREED_RECOMMENDED; HOLD sets the subject's := HOLD_NO_BREED; SURPLUS_DISPOSITION sets the subject's := SURPLUS_APPROVED"
      - "increments Animal.version by 1 for every animal whose designation changed"
      - "an endorsement attempted after expires_on records status := EXPIRED and clears the animal's pending_recommendation_id before failing with ERR_RECOMMENDATION_EXPIRED"
      - "increments PopulationRecommendation.version by 1"
  - method: GET
    path: "/population-recommendations/{recommendationId}"
    description: "Read one recommendation with its genetic and demographic analysis."
    roles: [AccreditationAdmin, ProgramCoordinator, Registrar, Veterinarian]
    code: 200
    input: []
    output: PopulationRecommendation
    side_effects: []
  - method: GET
    path: "/population-recommendations"
    description: "List recommendations, filterable by programme, either animal, either institution, type, verdict and status."
    roles: [AccreditationAdmin, ProgramCoordinator, Registrar, Veterinarian]
    code: 200
    input: ["species_program_id?", "subject_animal_id?", "paired_animal_id?", "sending_institution_id?", "receiving_institution_id?", "recommendation_type?", "pairing_verdict?", "status?", "plan_cycle?", "limit?", "offset?"]
    output: PopulationRecommendation[]
    side_effects: []

  # ---------------------------------------------------------- transfer agreements
  - method: POST
    path: "/transfer-agreements"
    description: "Open a transfer agreement in DRAFT against an endorsed recommendation, fixing the parties and the opening terms."
    roles: [Registrar]
    code: 201
    input: [recommendation_id, animal_id, sending_institution_id, receiving_institution_id, ownership_disposition, offspring_disposition_rule, breeding_rights, transport_cost_share_pct]
    output: TransferAgreement
    side_effects:
      - "status := DRAFT, round_number := 0, last_action_institution_id := null"
      - "transfer_scope_derivation freezes transfer_scope from the two jurisdiction codes"
  - method: POST
    path: "/transfer-agreements/{agreementId}/offer"
    description: "Put terms on the table, either the opening offer from DRAFT or a fresh offer answering the counterparty's counter."
    roles: [Registrar]
    code: 200
    input: ["ownership_disposition?", "offspring_disposition_rule?", "breeding_rights?", "transport_cost_share_pct?"]
    output: TransferAgreement
    side_effects:
      - "status DRAFT -> OFFERED or COUNTERED -> OFFERED"
      - "round_number += 1; last_action_institution_id := X-User-ID"
      - "supplied terms overwrite the corresponding agreement fields"
      - "increments TransferAgreement.version by 1"
  - method: POST
    path: "/transfer-agreements/{agreementId}/counter"
    description: "Answer the standing offer with revised terms."
    roles: [Registrar]
    code: 200
    input: ["ownership_disposition?", "offspring_disposition_rule?", "breeding_rights?", "transport_cost_share_pct?"]
    output: TransferAgreement
    side_effects:
      - "status OFFERED -> COUNTERED"
      - "round_number += 1; last_action_institution_id := X-User-ID"
      - "increments TransferAgreement.version by 1"
  - method: POST
    path: "/transfer-agreements/{agreementId}/accept"
    description: "Accept the terms standing on the table; only the party that did not act last may accept."
    roles: [Registrar]
    code: 200
    input: ["acceptance_note?"]
    output: TransferAgreement
    side_effects:
      - "status OFFERED or COUNTERED -> ACCEPTED; round_number and last_action_institution_id are unchanged"
      - "increments TransferAgreement.version by 1"
  - method: POST
    path: "/transfer-agreements/{agreementId}/execute"
    description: "Execute the accepted agreement: reserve the animal, post the provisional transfer credit and run the four-link plan cascade."
    roles: [Registrar]
    code: 200
    input: ["execution_note?"]
    output: TransferAgreement
    side_effects:
      - "status ACCEPTED -> EXECUTED; executed_at := the logical clock instant"
      - "transfer_credit_valuation variant provisional_at_execution sets provisional_credit_points"
      - "transfer_credit_ledger posts the provisional amount to both institutions"
      - "OWNERSHIP_TRANSFER moves owning_institution_id to the receiving institution"
      - "link 1: animal.location_status HELD -> RESERVED; link 2: recommendation ENDORSED -> FULFILLED; link 3: open_recommendation_count recomputed; link 4: PUBLISHED -> CYCLE_CLOSED when the count reaches 0"
      - "holding_slot_occupancy recomputes both institutions' slot counts"
      - "increments TransferAgreement.version by 1 and Animal.version by 1"
  - method: POST
    path: "/transfer-agreements/{agreementId}/terminate"
    description: "Terminate the agreement and compensate every side effect it has produced."
    roles: [Registrar]
    code: 200
    input: [reason]
    output: TransferAgreement
    side_effects:
      - "status -> TERMINATED; termination_reason := reason"
      - "transfer_credit_ledger reverses the recorded net posting on both institutions"
      - "OWNERSHIP_TRANSFER returns owning_institution_id to the sending institution; a RESERVED animal returns to HELD"
      - "a FULFILLED recommendation reverts to ENDORSED and a CYCLE_CLOSED plan reopens to PUBLISHED"
      - "RESERVED or CONFIRMED bookings -> ABORTED; SCHEDULED occupancies -> CANCELLED; DRAFT or ISSUED documents -> VOIDED"
      - "increments TransferAgreement.version by 1"
  - method: GET
    path: "/transfer-agreements/{agreementId}"
    description: "Read one transfer agreement with its negotiation counters, derived scope and both credit valuations."
    roles: [AccreditationAdmin, ProgramCoordinator, Registrar, Veterinarian]
    code: 200
    input: []
    output: TransferAgreement
    side_effects: []
  - method: GET
    path: "/transfer-agreements"
    description: "List transfer agreements, filterable by recommendation, animal, either party, the party that acted last, derived scope and status."
    roles: [AccreditationAdmin, ProgramCoordinator, Registrar, Veterinarian]
    code: 200
    input: ["recommendation_id?", "animal_id?", "sending_institution_id?", "receiving_institution_id?", "last_action_institution_id?", "transfer_scope?", "status?", "limit?", "offset?"]
    output: TransferAgreement[]
    side_effects: []

  # -------------------------------------------------------- compliance documents
  - method: POST
    path: "/compliance-documents"
    description: "Open a DRAFT health certificate or permit application against the agreement."
    roles: [Registrar]
    code: 201
    input: ["transfer_agreement_id", "document_type", "issuing_veterinarian_id?", "issuing_authority_name", "exam_date"]
    output: ComplianceDocument
    side_effects:
      - "status := DRAFT; document_number, valid_from, valid_until and decision_note stay null"
  - method: POST
    path: "/compliance-documents/{documentId}/decision"
    description: "Issue or deny the document. A health certificate is signed by its named veterinarian and requires a complete, negative pre-shipment panel; every permit type is decided by the accrediting body."
    roles: [Veterinarian, AccreditationAdmin]
    code: 200
    input: ["outcome", "document_number?", "valid_until?", "decision_note?"]
    output: ComplianceDocument
    side_effects:
      - "status DRAFT -> ISSUED or DRAFT -> DENIED"
      - "document_validity_window sets valid_from and valid_until on issue"
      - "increments ComplianceDocument.version by 1"
  - method: GET
    path: "/compliance-documents/{documentId}"
    description: "Read one compliance document with its validity window."
    roles: [AccreditationAdmin, ProgramCoordinator, Registrar, Veterinarian]
    code: 200
    input: []
    output: ComplianceDocument
    side_effects: []
  - method: GET
    path: "/compliance-documents"
    description: "List compliance documents, filterable by agreement, issuing veterinarian, kind and status."
    roles: [AccreditationAdmin, ProgramCoordinator, Registrar, Veterinarian]
    code: 200
    input: ["transfer_agreement_id?", "issuing_veterinarian_id?", "document_type?", "status?", "limit?", "offset?"]
    output: ComplianceDocument[]
    side_effects: []

  # -------------------------------------------------------- pre-shipment testing
  - method: POST
    path: "/pre-shipment-tests"
    description: "Record an immutable pre-shipment test result collected by a veterinarian of the sending institution."
    roles: [Veterinarian]
    code: 201
    input: [transfer_agreement_id, animal_id, collecting_veterinarian_id, test_code, collected_on, result, lab_reference]
    output: PreShipmentTest
    side_effects:
      - "the record is immutable: there is no update endpoint and the entity carries no version field"
      - "a POSITIVE result voids every ISSUED INTERSTATE_CVI of the agreement and aborts its RESERVED or CONFIRMED bookings"
  - method: GET
    path: "/pre-shipment-tests/{testId}"
    description: "Read one pre-shipment test record."
    roles: [AccreditationAdmin, ProgramCoordinator, Registrar, Veterinarian]
    code: 200
    input: []
    output: PreShipmentTest
    side_effects: []
  - method: GET
    path: "/pre-shipment-tests"
    description: "List pre-shipment tests, filterable by agreement, animal, collecting veterinarian, panel code and result."
    roles: [AccreditationAdmin, ProgramCoordinator, Registrar, Veterinarian]
    code: 200
    input: ["transfer_agreement_id?", "animal_id?", "collecting_veterinarian_id?", "test_code?", "result?", "limit?", "offset?"]
    output: PreShipmentTest[]
    side_effects: []

  # ------------------------------------------------------------------ quarantine
  - method: POST
    path: "/quarantine-occupancies"
    description: "Reserve a quarantine room at the receiving institution for the agreement's arrival window."
    roles: [Registrar]
    code: 201
    input: [institution_id, transfer_agreement_id, animal_id, quarantine_room_code, scheduled_start_date, scheduled_end_date]
    output: QuarantineOccupancy
    side_effects:
      - "phase := SCHEDULED; actual_start_date, isolation_class, required_days, cleared_on and clearing_veterinarian_id stay null"
      - "quarantine_room_availability rejects the reservation when the requested interval collides with another occupancy's phase-conditional sanitation window"
  - method: POST
    path: "/quarantine-occupancies/{occupancyId}/clear"
    description: "Release the animal from quarantine once it has served its required days."
    roles: [Veterinarian]
    code: 200
    input: ["clearance_note?"]
    output: QuarantineOccupancy
    side_effects:
      - "phase ACTIVE -> CLEARED; cleared_on := the logical clock date; clearing_veterinarian_id := X-User-ID"
      - "animal.location_status IN_QUARANTINE -> AWAITING_INTRODUCTION"
      - "increments QuarantineOccupancy.version by 1 and Animal.version by 1"
  - method: POST
    path: "/quarantine-occupancies/{occupancyId}/fail"
    description: "Fail the quarantine, which terminates the agreement, returns the animal to its sender and widens the room's sanitation window."
    roles: [Veterinarian]
    code: 200
    input: [failure_reason]
    output: QuarantineOccupancy
    side_effects:
      - "phase ACTIVE -> FAILED; clearing_veterinarian_id := X-User-ID; cleared_on stays null"
      - "the parent agreement EXECUTED -> TERMINATED with the whole compensating reversal chain"
      - "animal.location_status -> HELD and holding_institution_id returns to the sending institution"
      - "later occupancies of the same room are blocked for EXTENDED_SANITATION_DAYS instead of SANITATION_BUFFER_DAYS"
      - "increments QuarantineOccupancy.version by 1"
  - method: GET
    path: "/quarantine-occupancies/{occupancyId}"
    description: "Read one quarantine occupancy with its isolation class and required days."
    roles: [AccreditationAdmin, ProgramCoordinator, Registrar, Veterinarian]
    code: 200
    input: []
    output: QuarantineOccupancy
    side_effects: []
  - method: GET
    path: "/quarantine-occupancies"
    description: "List quarantine occupancies, filterable by institution, agreement, animal, clearing veterinarian, room and phase."
    roles: [AccreditationAdmin, ProgramCoordinator, Registrar, Veterinarian]
    code: 200
    input: ["institution_id?", "transfer_agreement_id?", "animal_id?", "clearing_veterinarian_id?", "quarantine_room_code?", "phase?", "isolation_class?", "limit?", "offset?"]
    output: QuarantineOccupancy[]
    side_effects: []

  # ------------------------------------------------------------------- transport
  - method: POST
    path: "/shipment-bookings"
    description: "Book temperature-controlled transport for the executed agreement. A new booking supersedes any RESERVED booking already held against the agreement, which is why the agreement's version must be supplied."
    roles: [Registrar]
    code: 201
    input: [transfer_agreement_id, carrier_code, crate_serial, departure_utc, arrival_utc, temp_min_c, temp_max_c, expected_transfer_agreement_version]
    output: ShipmentBooking
    side_effects:
      - "status := RESERVED; temperature_samples := [], thermal_excursion_minutes := 0"
      - "any RESERVED booking of the same agreement -> ABORTED, releasing its carrier interval"
      - "carrier_overlap_capacity rejects the booking when CARRIER_OVERLAP_LIMIT live journeys of the same carrier already overlap the window"
      - "increments TransferAgreement.version by 1"
  - method: POST
    path: "/shipment-bookings/{bookingId}/confirm"
    description: "Confirm the booking once crate training, the health certificate, the permit panel and the receiving quarantine reservation are all in place."
    roles: [Registrar]
    code: 200
    input: ["confirmation_note?"]
    output: ShipmentBooking
    side_effects:
      - "status RESERVED -> CONFIRMED"
      - "increments ShipmentBooking.version by 1"
  - method: POST
    path: "/shipment-bookings/{bookingId}/depart"
    description: "Record departure; the animal goes in transit."
    roles: [Registrar]
    code: 200
    input: ["departure_note?"]
    output: ShipmentBooking
    side_effects:
      - "status CONFIRMED -> IN_TRANSIT; departed_at := the logical clock instant"
      - "animal.location_status RESERVED -> IN_TRANSIT"
      - "increments ShipmentBooking.version by 1 and Animal.version by 1"
  - method: POST
    path: "/shipment-bookings/{bookingId}/deliver"
    description: "Record arrival with the journey's temperature log; re-values the transfer credit, activates quarantine and sets the isolation class."
    roles: [Registrar]
    code: 200
    input: [temperature_samples]
    output: ShipmentBooking
    side_effects:
      - "status IN_TRANSIT -> DELIVERED; delivered_at := the logical clock instant"
      - "thermal_excursion_window sets thermal_excursion_minutes from the submitted samples"
      - "transfer_credit_valuation variant final_at_delivery sets the agreement's final_credit_points and transfer_credit_ledger adjusts both balances by the delta"
      - "animal.holding_institution_id := the receiving institution"
      - "the agreement's SCHEDULED occupancy -> ACTIVE, quarantine_requirement sets isolation_class and required_days, and the animal moves IN_TRANSIT -> IN_QUARANTINE"
      - "holding_slot_occupancy recomputes both institutions' slot counts"
      - "increments ShipmentBooking.version by 1, TransferAgreement.version by 1 and Animal.version by 1"
  - method: GET
    path: "/shipment-bookings/{bookingId}"
    description: "Read one shipment booking with its temperature log and excursion total."
    roles: [AccreditationAdmin, ProgramCoordinator, Registrar, Veterinarian]
    code: 200
    input: []
    output: ShipmentBooking
    side_effects: []
  - method: GET
    path: "/shipment-bookings"
    description: "List shipment bookings, filterable by agreement, carrier and status."
    roles: [AccreditationAdmin, ProgramCoordinator, Registrar, Veterinarian]
    code: 200
    input: ["transfer_agreement_id?", "carrier_code?", "status?", "limit?", "offset?"]
    output: ShipmentBooking[]
    side_effects: []

  # ---------------------------------------------------------------- introduction
  - method: POST
    path: "/introduction-protocols"
    description: "Open a behavioural introduction protocol for an animal that has cleared quarantine at the receiving institution."
    roles: [Registrar]
    code: 201
    input: [transfer_agreement_id, animal_id, institution_id, resident_group_code]
    output: IntroductionProtocol
    side_effects:
      - "stage := HOWDY, sessions_at_stage := 0, regression_count := 0, aggression_score_total := 0.00, observation_count := 0, started_on := the logical clock date"
      - "animal.location_status AWAITING_INTRODUCTION -> INTRODUCING"
      - "increments Animal.version by 1"
  - method: POST
    path: "/introduction-protocols/{protocolId}/observations"
    description: "Record one behavioural observation, which may hold, advance, regress or abort the protocol."
    roles: [Registrar]
    code: 201
    input: [aggression_level, observer_name, observed_on]
    output: IntroductionProtocol
    side_effects:
      - "introduction_aggression_accumulator updates observation_count, aggression_score_total, sessions_at_stage and the stage accumulator, then takes the stage decision with regression evaluated before advancement"
      - "advancing out of FULL_CONTACT reaches INTEGRATED, returns the animal to HELD and completes the agreement"
      - "an abort runs the four-link cascade: protocol ABORTED, animal HELD and HOLD_NO_BREED, BREED_WITH recommendations DECLINED, open_recommendation_count recomputed"
      - "increments IntroductionProtocol.version by 1"
  - method: GET
    path: "/introduction-protocols/{protocolId}"
    description: "Read one introduction protocol with its stage, session counters and regression count."
    roles: [AccreditationAdmin, ProgramCoordinator, Registrar, Veterinarian]
    code: 200
    input: []
    output: IntroductionProtocol
    side_effects: []
  - method: GET
    path: "/introduction-protocols"
    description: "List introduction protocols, filterable by agreement, animal, institution, resident group and stage."
    roles: [AccreditationAdmin, ProgramCoordinator, Registrar, Veterinarian]
    code: 200
    input: ["transfer_agreement_id?", "animal_id?", "institution_id?", "resident_group_code?", "stage?", "limit?", "offset?"]
    output: IntroductionProtocol[]
    side_effects: []

  # -------------------------------------------------------- studbook submissions
  - method: POST
    path: "/studbook-submissions"
    description: "File a studbook record submission with the coordinating body for a reporting period; its lateness assessment is computed on filing."
    roles: [Registrar]
    code: 201
    input: ["species_program_id", "institution_id", "transfer_agreement_id?", "submission_type", "reporting_period_end"]
    output: StudbookSubmission
    side_effects:
      - "status := SUBMITTED; submitted_on := the logical clock date"
      - "studbook_lateness_assessment computes days_late, base_points, surcharge_multiplier, surcharge_points and total_compliance_points, none of which are posted yet"
  - method: POST
    path: "/studbook-submissions/{submissionId}/review"
    description: "The coordinating body accepts or rejects the submission; either outcome posts its compliance points to the filing institution."
    roles: [ProgramCoordinator]
    code: 200
    input: ["outcome", "review_note?"]
    output: StudbookSubmission
    side_effects:
      - "status SUBMITTED -> ACCEPTED or SUBMITTED -> REJECTED; review_note := the supplied note"
      - "institution.compliance_points_balance += total_compliance_points"
      - "an ACCREDITED institution whose balance reaches ACCREDITATION_REVIEW_POINTS is demoted to PROVISIONAL"
      - "increments StudbookSubmission.version by 1 and Institution.version by 1"
  - method: GET
    path: "/studbook-submissions/{submissionId}"
    description: "Read one studbook submission with its full lateness assessment."
    roles: [AccreditationAdmin, ProgramCoordinator, Registrar, Veterinarian]
    code: 200
    input: []
    output: StudbookSubmission
    side_effects: []
  - method: GET
    path: "/studbook-submissions"
    description: "List studbook submissions, filterable by programme, institution, agreement, type and status."
    roles: [AccreditationAdmin, ProgramCoordinator, Registrar, Veterinarian]
    code: 200
    input: ["species_program_id?", "institution_id?", "transfer_agreement_id?", "submission_type?", "status?", "limit?", "offset?"]
    output: StudbookSubmission[]
    side_effects: []

  # ------------------------------------------------------------- test-driving API
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every deadline, expiry, age, quarantine-day and validity-window rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [AccreditationAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "the logical clock is set to the supplied instant; no entity is mutated and no lazy transition is triggered by the clock move itself"

errors:
  # ---- authentication, authorization, schema
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing or empty."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is not one of the four declared roles, or is not in the endpoint's authorized_roles list."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum value, out-of-range number, malformed date or instant, end not after start, temp_max_c not above temp_min_c, or pagination parameter out of range."
  # ---- existence
  - id: ERR_SPECIES_PROGRAM_NOT_FOUND
    http: 404
    condition: "The species programme named in the path or body does not exist."
  - id: ERR_INSTITUTION_NOT_FOUND
    http: 404
    condition: "An institution named in the path or body does not exist."
  - id: ERR_VETERINARIAN_NOT_FOUND
    http: 404
    condition: "A veterinarian named in the path or body does not exist."
  - id: ERR_ANIMAL_NOT_FOUND
    http: 404
    condition: "An animal named in the path or body — including a sire_id, dam_id or paired_animal_id — does not exist."
  - id: ERR_RECOMMENDATION_NOT_FOUND
    http: 404
    condition: "The population recommendation named in the path or body does not exist."
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "The transfer agreement named in the path or body does not exist."
  - id: ERR_DOCUMENT_NOT_FOUND
    http: 404
    condition: "The compliance document named in the path does not exist."
  - id: ERR_TEST_NOT_FOUND
    http: 404
    condition: "The pre-shipment test named in the path does not exist."
  - id: ERR_OCCUPANCY_NOT_FOUND
    http: 404
    condition: "The quarantine occupancy named in the path does not exist."
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "The shipment booking named in the path does not exist."
  - id: ERR_PROTOCOL_NOT_FOUND
    http: 404
    condition: "The introduction protocol named in the path does not exist."
  - id: ERR_SUBMISSION_NOT_FOUND
    http: 404
    condition: "The studbook submission named in the path does not exist."
  # ---- actor scope and separation of duties
  - id: ERR_ACTOR_SCOPE_VIOLATION
    http: 403
    condition: "A Registrar acts on an institution other than the one its X-User-ID names, or a ProgramCoordinator acts on a programme other than the one its X-User-ID names."
  - id: ERR_NOT_A_PARTY_TO_AGREEMENT
    http: 403
    condition: "The acting institution is neither the sending nor the receiving party of the agreement."
  - id: ERR_VET_INSTITUTION_MISMATCH
    http: 403
    condition: "The acting veterinarian's employing institution is not the institution that owns the resource being acted on."
  - id: ERR_WRONG_ISSUING_AUTHORITY
    http: 403
    condition: "A permit decision is attempted by a Veterinarian, or an INTERSTATE_CVI decision by an AccreditationAdmin."
  - id: ERR_NOT_COUNTERPARTY_TURN
    http: 403
    condition: "The acting institution is the agreement's last_action_institution_id and therefore cannot counter, re-offer or accept its own standing terms."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The veterinarian who collected the agreement's pre-shipment tests attempts to sign its health certificate, or the veterinarian who signed the certificate attempts to clear the quarantine."
  # ---- optimistic concurrency
  - id: ERR_STALE_ANIMAL_VERSION
    http: 412
    condition: "expected_subject_animal_version does not equal the subject animal's current version (concurrency_rules[recommendation-create-stale-animal])."
  - id: ERR_STALE_AGREEMENT_VERSION
    http: 412
    condition: "expected_transfer_agreement_version does not equal the agreement's current version (concurrency_rules[booking-create-stale-agreement])."
  # ---- state preconditions
  - id: ERR_PROGRAM_PLAN_NOT_PUBLISHED
    http: 409
    condition: "A recommendation is raised against a programme whose plan_status is DRAFT or CYCLE_CLOSED."
  - id: ERR_RECOMMENDATION_ALREADY_ENDORSED
    http: 409
    condition: "A new recommendation is raised for a subject animal whose standing recommendation in the same plan cycle is ENDORSED or FULFILLED and therefore cannot be superseded."
  - id: ERR_RECOMMENDATION_NOT_ENDORSED
    http: 409
    condition: "An endorsement is attempted on a recommendation that is not PROPOSED, or an agreement is founded, accepted or executed against a recommendation that is not ENDORSED."
  - id: ERR_AGREEMENT_INVALID_STATE
    http: 409
    condition: "The agreement's status does not admit the requested transition or the requested child resource — for example countering a DRAFT agreement, executing an OFFERED one, or booking transport against an agreement that is not EXECUTED."
  - id: ERR_DOCUMENT_ALREADY_DECIDED
    http: 409
    condition: "A decision is recorded on a compliance document that is already ISSUED, DENIED or VOIDED."
  - id: ERR_BOOKING_INVALID_STATE
    http: 409
    condition: "The booking's status does not admit the requested transition — confirming a CONFIRMED booking, departing a RESERVED one, or delivering one that has not departed."
  - id: ERR_QUARANTINE_NOT_CLEARED
    http: 409
    condition: "A clearance or failure is recorded on an occupancy that is not ACTIVE, or an introduction protocol is opened before the occupancy reached CLEARED."
  - id: ERR_PROTOCOL_STAGE_INVALID
    http: 409
    condition: "An observation is recorded on a protocol whose stage is already INTEGRATED or ABORTED."
  - id: ERR_SUBMISSION_ALREADY_REVIEWED
    http: 409
    condition: "A review is recorded on a submission that is already ACCEPTED or REJECTED."
  - id: ERR_ANIMAL_LOCATION_CONFLICT
    http: 409
    condition: "The animal's location_status does not admit the operation — founding or executing an agreement for an animal that is not HELD, departing one that is not RESERVED, delivering one that is not IN_TRANSIT, opening a protocol for one that is not AWAITING_INTRODUCTION, or disposing of one that is not HELD."
  - id: ERR_ANIMAL_HAS_ACTIVE_AGREEMENT
    http: 409
    condition: "Another transfer agreement for the same animal is still in DRAFT, OFFERED, COUNTERED, ACCEPTED or EXECUTED."
  # ---- accreditation and veterinary safety
  - id: ERR_INSTITUTION_NOT_ACCREDITED
    http: 422
    condition: "A party to the transfer is SUSPENDED or TERMINATED rather than ACCREDITED or PROVISIONAL."
  - id: ERR_INTERNATIONAL_TRANSFER_NOT_PERMITTED
    http: 422
    condition: "An INTERNATIONAL agreement is executed while the receiving institution holds only PROVISIONAL accreditation."
  - id: ERR_DISPOSITION_POLICY_MISSING
    http: 422
    condition: "An OWNERSHIP_TRANSFER is executed while the receiving institution has no disposition policy on file."
  - id: ERR_VET_LICENSE_INVALID
    http: 422
    condition: "The veterinarian's license_status is LAPSED or REVOKED, or their license_jurisdiction does not match the jurisdiction the document is issued for."
  - id: ERR_VET_NOT_ACCREDITED_FOR_SCOPE
    http: 422
    condition: "An INTERSTATE_CVI for an INTERNATIONAL agreement is signed by a veterinarian whose usda_accreditation_category is not CATEGORY_II."
  - id: ERR_ANIMAL_NOT_SURPLUS_APPROVED
    http: 422
    condition: "A disposition is attempted on an animal whose genetic_designation is not SURPLUS_APPROVED."
  - id: ERR_POSITIVE_TEST_RESULT
    http: 422
    condition: "A health certificate is issued while a test in the agreement's required panel has result POSITIVE or INCONCLUSIVE."
  - id: ERR_TEST_PANEL_INCOMPLETE
    http: 422
    condition: "The agreement's required test panel is missing a code, has a test collected outside the TEST_VALIDITY_DAYS window before the exam date, or has no recorded tests at all."
  # ---- crate training, documents, transport windows
  - id: ERR_CRATE_TRAINING_INCOMPLETE
    http: 422
    condition: "The animal has fewer than MIN_CRATE_SESSIONS recorded crate-training sessions."
  - id: ERR_CRATE_TRAINING_STALE
    http: 422
    condition: "The animal's most recent crate-training session is more than CRATE_RECENCY_DAYS before the booking's departure date."
  - id: ERR_HEALTH_CERTIFICATE_MISSING
    http: 422
    condition: "No ISSUED INTERSTATE_CVI exists for the agreement at confirmation."
  - id: ERR_PERMIT_NOT_ISSUED
    http: 422
    condition: "A permit type required by the agreement's transfer_scope has no ISSUED compliance document at confirmation."
  - id: ERR_QUARANTINE_NOT_SCHEDULED
    http: 422
    condition: "No SCHEDULED quarantine occupancy exists at the receiving institution for the agreement at confirmation."
  - id: ERR_HEALTH_CERTIFICATE_EXPIRED
    http: 422
    condition: "The agreement's ISSUED INTERSTATE_CVI has a valid_until earlier than the booking's arrival date."
  - id: ERR_RECOMMENDATION_EXPIRED
    http: 422
    condition: "An endorsement is attempted after the recommendation's expires_on date; the recommendation is recorded as EXPIRED by the same request."
  # ---- genetics, capacity and overlap constraints
  - id: ERR_INBREEDING_LIMIT_EXCEEDED
    http: 422
    condition: "A BREED_WITH recommendation whose pairing_verdict is NOT_RECOMMENDED — projected_offspring_inbreeding at or above MAX_OFFSPRING_INBREEDING — is submitted for endorsement."
  - id: ERR_INVALID_PAIRING
    http: 422
    condition: "A BREED_WITH recommendation names no paired animal, names the subject animal itself, crosses two programmes, involves a DISPOSED animal, or pairs two animals that are not one MALE and one FEMALE; or a HOLD or SURPLUS_DISPOSITION recommendation names a paired animal."
  - id: ERR_DUPLICATE_ANIMAL_LOCAL_ID
    http: 422
    condition: "Another animal at the same holding institution already carries the submitted local_id."
  - id: ERR_QUARANTINE_ROOM_CONFLICT
    http: 422
    condition: "The requested quarantine interval overlaps another non-CANCELLED occupancy of the same room once that occupancy's phase-conditional sanitation buffer is applied."
  - id: ERR_CARRIER_CAPACITY_EXCEEDED
    http: 422
    condition: "CARRIER_OVERLAP_LIMIT live bookings of the same carrier already overlap the requested journey window on closed intervals."
  - id: ERR_DUPLICATE_STUDBOOK_SUBMISSION
    http: 422
    condition: "A SUBMITTED or ACCEPTED submission already exists for the same programme, institution, reporting period and submission type."
  - id: ERR_NEGOTIATION_ROUND_LIMIT
    http: 422
    condition: "An offer or counter is attempted when the agreement's round_number already equals MAX_NEGOTIATION_ROUNDS."
  - id: ERR_QUARANTINE_MINIMUM_NOT_MET
    http: 422
    condition: "A clearance is attempted before the occupancy has served its required_days since actual_start_date."
  - id: ERR_HOLDING_CAPACITY_EXCEEDED
    http: 422
    condition: "Executing the agreement would push the receiving institution's occupied plus reserved slots past its holding_capacity_slots."
  - id: ERR_ANIMAL_NOT_HELD_BY_SENDER
    http: 422
    condition: "The animal's holding_institution_id is not the sending institution named on the agreement."

roles:
  - name: AccreditationAdmin
    description: "Staff of the accrediting association. Maintains the register of institutions and species programmes, decides every permit application, and drives the logical clock for scenario setup."
    identity: "opaque"
    exclusive_operations:
      - "POST /institutions"
      - "PATCH /institutions/{institutionId}"
      - "POST /species-programs"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /compliance-documents/{documentId}/decision (permit types only; an INTERSTATE_CVI decision is refused with ERR_WRONG_ISSUING_AUTHORITY)"
      - "every GET endpoint"
  - name: ProgramCoordinator
    description: "The coordinating body for one species programme. Publishes the population management plan, raises genetic and demographic recommendations, and reviews studbook submissions. X-User-ID is the SpeciesProgram id."
    identity: "entity_backed:SpeciesProgram"
    exclusive_operations:
      - "POST /species-programs/{speciesProgramId}/publish-plan"
      - "POST /population-recommendations"
      - "POST /studbook-submissions/{submissionId}/review"
    shared_operations:
      - "every GET endpoint"
  - name: Registrar
    description: "Registrar of one accredited institution. Accessions animals, endorses recommendations, negotiates and executes transfer agreements, opens compliance documents, reserves quarantine rooms, books transport, runs introductions and files studbook submissions. X-User-ID is the Institution id."
    identity: "entity_backed:Institution"
    exclusive_operations:
      - "POST /veterinarians"
      - "POST /animals"
      - "POST /animals/{animalId}/crate-training-sessions"
      - "POST /animals/{animalId}/disposition"
      - "POST /population-recommendations/{recommendationId}/endorse"
      - "POST /transfer-agreements"
      - "POST /transfer-agreements/{agreementId}/offer"
      - "POST /transfer-agreements/{agreementId}/counter"
      - "POST /transfer-agreements/{agreementId}/accept"
      - "POST /transfer-agreements/{agreementId}/execute"
      - "POST /transfer-agreements/{agreementId}/terminate"
      - "POST /compliance-documents"
      - "POST /quarantine-occupancies"
      - "POST /shipment-bookings"
      - "POST /shipment-bookings/{bookingId}/confirm"
      - "POST /shipment-bookings/{bookingId}/depart"
      - "POST /shipment-bookings/{bookingId}/deliver"
      - "POST /introduction-protocols"
      - "POST /introduction-protocols/{protocolId}/observations"
      - "POST /studbook-submissions"
    shared_operations:
      - "every GET endpoint"
  - name: Veterinarian
    description: "Attending veterinarian employed by one institution. Collects pre-shipment tests, signs interstate health certificates, and clears or fails quarantine. X-User-ID is the Veterinarian id, and the veterinarian's institution_id decides which resources are in scope."
    identity: "entity_backed:Veterinarian"
    exclusive_operations:
      - "POST /pre-shipment-tests"
      - "POST /quarantine-occupancies/{occupancyId}/clear"
      - "POST /quarantine-occupancies/{occupancyId}/fail"
    shared_operations:
      - "POST /compliance-documents/{documentId}/decision (INTERSTATE_CVI only; a permit decision is refused with ERR_WRONG_ISSUING_AUTHORITY)"
      - "every GET endpoint"
