              payload: { customer_id: "${cust_p5b}", property_address: "P5b St" }
              as: OperationsAdmin
              captures: { proj_p5b: $.data.id }
          trigger:
            - call: "POST /projects/${proj_p5b}/zones"
              payload: { transformer_id: "00000000-0000-4000-8000-000000000000", label: "Ghost" }
              as: LightingDesigner
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_RESOURCE_NOT_FOUND"
            - "no Zone is created for project ${proj_p5b}"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: transformer_capacity_at_exact_usable_boundary
        grounds:
          - calculations.transformer_committed_load
          - calculations.transformer_usable_capacity
          - validations[priority=12]
          - entities.Fixture.fields.wattage_w
        distinguishing_aspect: |
          Numeric threshold metric: committed_load_va == usable_capacity_va (240==240) is ALLOWED;
          a subsequent 1W assignment pushing to 241 > 240 is rejected with
          ERR_TRANSFORMER_CAPACITY_EXCEEDED. Tests the <= vs > boundary on the load endpoint.
        test_recipe:
          setup:
            - "Project, 300VA transformer (usable 240), one zone. Three 80W fixtures plus one 1W fixture available."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Owner B1", email: "b1@x.com" }
              as: OperationsAdmin
              captures: { cust_b1: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_b1}", property_address: "B1 St" }
              as: OperationsAdmin
              captures: { proj_b1: $.data.id }
