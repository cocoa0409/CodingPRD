        grounds:
          - state_machines[entity=RecallNotice]
          - validations[priority=40]
          - errors[ERR_RECALL_NOT_REMEDIATED]
          - entities.RecallNotice.fields.remediated_unit_count
          - state_machines[entity=EquipmentUnit].transitions[IN_QUARANTINE->IN_STOCK]
        distinguishing_aspect: |
          The notice's two counters come from different clocks: affected_unit_count is a SNAPSHOT
          taken at creation while remediated_unit_count is LIVE, so closure is only possible after a
          service call restamps the unit, and closure cannot be reached from OPEN at all.
        test_recipe:
          setup:
            - "One branch (Tampa Bay, FL) with a single IN_STOCK unit SC-1001 of model CONC-5L, pm_interval_days 365. No contract or placement exists, so the CLASS_I cascade touches only the unit."
          setup_api_calls:
