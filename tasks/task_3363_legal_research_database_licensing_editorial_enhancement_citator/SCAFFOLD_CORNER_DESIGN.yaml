              as: AttorneyEditor
              as_user_id: "ed-author-1"
              captures: {hn_id: $.data.id}
            - {call: "POST /legal-research/headnotes/${hn_id}/submit", payload: {}, as: AttorneyEditor, as_user_id: "ed-author-1"}
            - {call: "POST /legal-research/headnotes/${hn_id}/decide", payload: {decision: APPROVE, review_note: "ok"}, as: AttorneyEditor, as_user_id: "ed-reviewer-1"}
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-15T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/removal-orders"
              payload: {document_id: "${doc_id}", scope: SEAL, effective_from: "2026-09-01", effective_until: "2026-09-30", reason: "seal then lift"}
