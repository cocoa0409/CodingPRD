    side_effects: []

  - method: POST
    path: "/liquidity/posture-evaluations"
    description: "Manual posture evaluation: appends PostureSnapshot per posture_evaluation rules (de-escalation requires LiquidityCommittee and clean reds/breaches)"
    roles: [RiskOfficer, LiquidityCommittee]
    code: 201
    input: []
    output: PostureSnapshot
    side_effects:
      - "appends PostureSnapshot (trigger MANUAL_EVALUATION)"
      - "entering SEVERE/CRISIS escalates OPEN breaches"

  - method: GET
    path: "/liquidity/posture-snapshots"
    description: "List PostureSnapshots ordered by snapshot_seq"
    roles: [TreasuryAnalyst, RiskOfficer, TreasuryOps, LiquidityCommittee]
    code: 200
    input: ["limit?", "offset?"]
    output: PostureSnapshot[]
    side_effects: []

  - method: POST
    path: "/liquidity/contingency-playbooks"
    description: "Create a ContingencyPlaybook (DRAFT)"
    roles: [TreasuryAnalyst]
    code: 201
    input: [name, scenario_id, min_activation_posture, target_capacity_cents]
    output: ContingencyPlaybook
    side_effects: ["created_by_user_id = X-User-ID"]

  - method: GET
    path: "/liquidity/contingency-playbooks"
    description: "List playbooks (scenario_id filter provides FK reverse-reachability)"
    roles: [TreasuryAnalyst, RiskOfficer, TreasuryOps, LiquidityCommittee]
    code: 200
    input: ["scenario_id?", "status?", "limit?", "offset?"]
    output: ContingencyPlaybook[]
    side_effects: []

  - method: GET
    path: "/liquidity/contingency-playbooks/{id}"
    description: "Get a playbook"
    roles: [TreasuryAnalyst, RiskOfficer, TreasuryOps, LiquidityCommittee]
    code: 200
    input: []
    output: ContingencyPlaybook
    side_effects: []

  - method: PATCH
    path: "/liquidity/contingency-playbooks/{id}"
    description: "Edit a DRAFT playbook; OCC on playbook version"
    roles: [TreasuryAnalyst]
    code: 200
    input: [expected_playbook_version, "name?", "min_activation_posture?", "target_capacity_cents?"]
