            - "the captured ${df_status_after} == EXPIRED after the sweep one second later"
            - "the captured ${df_result} == COMPLIANT and PhysicalExam.${df_ex_id}.performed_at is still 2026-08-10T14:00:00Z"
            - "Player.${df_p_id}.last_physical_passed_at == 2026-08-10T14:00:00Z and medical_status == CLEARED — expiry of the exam does not rewrite the player's medical dimension"

