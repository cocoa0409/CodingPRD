    output: Employee[]
    side_effects: []
  - method: GET
    path: "/ale-reporting/employees/{id}"
    description: "Read one employee, including effective_measurement_method, full_time_months, full_time_month_count, measured_average_hours and ft_source_by_month."
    roles: [ComplianceOfficer, Preparer, FilingAgent, BenefitsAdmin, EmployeeSelfService]
    code: 200
    input: []
    output: Employee
    side_effects: []
  - method: PATCH
    path: "/ale-reporting/employees/{employee_id}"
    description: "Update the wage inputs and measurement-method override that the affordability and full-time calculations read."
    roles: [BenefitsAdmin]
    code: 200
    input: ["w2_box1_wages_cents?", "hourly_rate_cents?", "monthly_salary_cents?", "measurement_method_override?"]
