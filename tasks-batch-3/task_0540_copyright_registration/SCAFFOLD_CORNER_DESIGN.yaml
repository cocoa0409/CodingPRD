        grounds: ["errors[ERR_PERIOD_OVERLAP]"]
        excluded_because:
          difficulty_instance: royalty_period_overlap_closed
          rationale: "ERR_PERIOD_OVERLAP is the asserted failure of the named §1.8 overlap instance."

      - name: work_not_registered_covered_by_difficulty
        claim_type: Violation → Error
        grounds: ["errors[ERR_WORK_NOT_REGISTERED]"]
        excluded_because:
          difficulty_instance: license_requires_work_registered
          rationale: "ERR_WORK_NOT_REGISTERED is the asserted failure of the named §1.8 cross-entity instance."

      - name: takedown_not_effective_covered_by_difficulty
        claim_type: Violation → Error
        grounds: ["errors[ERR_TAKEDOWN_NOT_EFFECTIVE]"]
        excluded_because:
          difficulty_instance: counter_notice_requires_takedown_effective
          rationale: "ERR_TAKEDOWN_NOT_EFFECTIVE is the asserted failure of the named §1.8 cross-entity instance."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: works_list_pagination_envelope
        claim_type: Computed read
        grounds: [endpoints, response_envelope.pagination_fields]
        distinguishing_aspect: "GET /copyright/works returns a paginated array envelope with total_count and has_more."
        test_recipe:
          setup: ["Two works exist"]
          setup_api_calls:
            - call: "POST /copyright/works"
              payload: { title: "W1", work_type: "LITERARY", year_of_creation: 2024, author_name: "A", owner_shares: [{ name: "A", share_bps: 10000 }] }
              as: RightsHolder
              as_user_id: "rh_1"
            - call: "POST /copyright/works"
              payload: { title: "W2", work_type: "MUSICAL", year_of_creation: 2024, author_name: "B", owner_shares: [{ name: "B", share_bps: 10000 }] }
              as: RightsHolder
              as_user_id: "rh_1"
          trigger:
            - call: "GET /copyright/works?limit=1&offset=0"
              payload: {}
              as: RightsHolder
              as_user_id: "rh_1"
          assert:
            - "response.meta present; response_type == array"
            - "total_count == 2 and has_more == true"

      - name: invalid_pagination_returns_error
        claim_type: Standard CRUD
        grounds: ["errors[ERR_INVALID_PAGINATION]"]
        distinguishing_aspect: "GET /copyright/works with limit=0 (below min 1) returns ERR_INVALID_PAGINATION (422)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /copyright/works?limit=0"
              payload: {}
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_PAGINATION"

      - name: deposits_filtered_by_application_fk
        claim_type: Computed read
        grounds: [endpoints, entities.Deposit.fields.application_id]
        distinguishing_aspect: "GET /copyright/deposits?application_id={id} returns only that application's deposits (FK reverse-reachability)."
        test_recipe:
          setup: ["Application with one deposit"]
          setup_api_calls:
            - call: "POST /copyright/works"
              payload: { title: "W", work_type: "LITERARY", year_of_creation: 2024, author_name: "A", owner_shares: [{ name: "A", share_bps: 10000 }] }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { w_id: $.data.id }
            - call: "POST /copyright/applications"
              payload: { work_id: "${w_id}", filing_basis: "STANDARD" }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { app_id: $.data.id }
            - call: "POST /copyright/deposits"
              payload: { application_id: "${app_id}", deposit_type: "ELECTRONIC", copy_count: 1 }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { dep_id: $.data.id }
          trigger:
            - call: "GET /copyright/deposits?application_id=${app_id}"
              payload: {}
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { first_dep: "$.data[0].id" }
          assert:
            - "response contains exactly the deposit ${dep_id}; total_count == 1"

  # ===========================================================================
  - section: rbac
    instances:
      - name: rightsholder_cannot_register_application
        claim_type: exclusive_operation_denied
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "register is Examiner-exclusive; a RightsHolder calling it returns ERR_FORBIDDEN (403) before any state check."
        test_recipe:
          setup: ["Application in DRAFT"]
          setup_api_calls:
            - call: "POST /copyright/works"
              payload: { title: "W", work_type: "LITERARY", year_of_creation: 2024, author_name: "A", owner_shares: [{ name: "A", share_bps: 10000 }] }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { w_id: $.data.id }
            - call: "POST /copyright/applications"
              payload: { work_id: "${w_id}", filing_basis: "STANDARD" }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /copyright/applications/${app_id}/register"
              payload: {}
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FORBIDDEN"

      - name: examiner_cannot_create_work
        claim_type: exclusive_operation_denied
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "POST /copyright/works is RightsHolder-exclusive; an Examiner is denied with ERR_FORBIDDEN (403)."
