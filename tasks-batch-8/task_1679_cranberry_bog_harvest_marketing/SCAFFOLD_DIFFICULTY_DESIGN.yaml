            - "MemberQuota.posture == WITHIN_QUOTA (delivered 1000 == base 1000 is not over)"

  # ==========================================================================
  # Rule 7 — cross_entity_state_dependency (HarvestTicket→Bog vs Delivery→Pool)
  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ticket_approve_blocked_when_bog_not_active
        grounds:
          - state_machines.HarvestTicket.REQUESTED_to_APPROVED
          - entities.Bog.fields.status
          - errors[ERR_BOG_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair HarvestTicket -> Bog: the ticket's REQUESTED -> APPROVED
          transition is gated on the referenced Bog being ACTIVE; after the
          grower moves the bog to RENOVATION_PLANNED, approval fails with
          ERR_BOG_NOT_ACTIVE. The sibling instance crosses Delivery -> Pool.
        test_recipe:
          setup:
            - "Member ACTIVE, ACTIVE bog, season 2026 OPEN"
            - "Ticket T1 REQUESTED on the bog while ACTIVE"
            - "Bog then transitioned ACTIVE -> RENOVATION_PLANNED by the owner"
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/bogs"
              payload: { name: "North Bog", acres: 10, variety: "STEVENS", sprinkler_demand_gpm: 500 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { b1: "$.data.id" }
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /coop/harvest-tickets"
              payload: { bog_id: "${b1}", season_id: "${s1}", method: "DRY", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-05T00:00:00Z" }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { t1: "$.data.id" }
            - call: "POST /coop/bogs/${b1}/transition"
              payload: { to: "RENOVATION_PLANNED" }
              as: GrowerMember
              as_user_id: "${m1}"
          trigger:
            - call: "POST /coop/harvest-tickets/${t1}/transition"
              payload: { to: "APPROVED" }
              as: FieldOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_BOG_NOT_ACTIVE"
            - "HarvestTicket.${t1}.status remains REQUESTED"

      - name: delivery_accept_blocked_when_main_pool_closed
        grounds:
          - state_machines.Delivery.GRADED_to_ACCEPTED
          - entities.Pool.fields.status
          - errors[ERR_POOL_NOT_OPEN]
        distinguishing_aspect: |
          Entity pair Delivery -> Pool: acceptance is gated on the season's
          MAIN pool being OPEN; with MAIN CLOSED (season kept OPEN by a second
          OPEN pool), accept fails with ERR_POOL_NOT_OPEN. The sibling instance
          crosses HarvestTicket -> Bog.
        test_recipe:
          setup:
            - "Member ACTIVE, ACTIVE bog, season OPEN; station 5000"
            - "MAIN pool and OVER_QUOTA pool both created; MAIN then CLOSED (no RECEIVED/GRADED/DISPUTED pipeline at close time: delivery still SCHEDULED); season stays OPEN because OVER_QUOTA pool is OPEN"
            - "Delivery then received and graded B -> GRADED"
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/bogs"
              payload: { name: "North Bog", acres: 10, variety: "STEVENS", sprinkler_demand_gpm: 500 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { b1: "$.data.id" }
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /coop/seasons/${s1}/open"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/stations"
              payload: { name: "Station A", daily_capacity_barrels: 5000 }
              as: CoopAdmin
              captures: { st1: "$.data.id" }
            - call: "POST /coop/pools"
              payload: { season_id: "${s1}", code: "MAIN", provisional_advance_rate_per_barrel: 0.50, retain_pct: 0.20 }
              as: PoolManager
              captures: { p1: "$.data.id" }
            - call: "POST /coop/pools"
              payload: { season_id: "${s1}", code: "OVER_QUOTA", provisional_advance_rate_per_barrel: 0.25, retain_pct: 0.20 }
              as: PoolManager
              captures: { p2: "$.data.id" }
            - call: "POST /coop/deliveries"
              payload: { season_id: "${s1}", bog_id: "${b1}", receiving_station_id: "${st1}", scheduled_date: "2026-10-10", expected_barrels: 150 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { d1: "$.data.id" }
            - call: "POST /coop/pools/${p1}/transition"
              payload: { to: "CLOSED" }
              as: PoolManager
            - call: "POST /coop/deliveries/${d1}/receive"
              payload: { gross_barrels: 150, tare_barrels: 50 }
              as: StationOperator
              as_user_id: "${st1}"
            - call: "POST /coop/deliveries/${d1}/grade"
              payload: { color_score: 7.5, firmness_score: 7.0, foreign_matter_pct: 3.0 }
              as: StationOperator
              as_user_id: "${st1}"
          trigger:
            - call: "POST /coop/deliveries/${d1}/accept"
              payload: {}
              as: PoolManager
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_POOL_NOT_OPEN (MAIN pool CLOSED; season still OPEN so this is the pool gate, not the season gate)"
            - "Delivery.${d1}.status remains GRADED"

  # ==========================================================================
  # Rule 8 — resource_temporal_overlap (Bog half-open adjacency vs ReceivingStation aggregate bucket)
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: harvest_ticket_half_open_overlap_on_bog
        grounds:
          - calculations.harvest_window_overlap
          - errors[ERR_HARVEST_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource = Bog, pairwise half-open interval semantics: an overlapping
          second window [10-04, 10-08) is rejected, while the exactly-adjacent
          window [10-05, 10-09) (start == first window's end) is accepted. The
          sibling instance uses aggregate-capacity semantics on a different
          resource (ReceivingStation).
        test_recipe:
          setup:
            - "Member ACTIVE, ACTIVE bog, season 2026 OPEN"
            - "Ticket T1 [2026-10-01T00:00Z, 2026-10-05T00:00Z) DRY APPROVED on the bog"
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/bogs"
              payload: { name: "North Bog", acres: 10, variety: "STEVENS", sprinkler_demand_gpm: 500 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { b1: "$.data.id" }
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /coop/harvest-tickets"
              payload: { bog_id: "${b1}", season_id: "${s1}", method: "DRY", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-05T00:00:00Z" }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { t1: "$.data.id" }
            - call: "POST /coop/harvest-tickets/${t1}/transition"
              payload: { to: "APPROVED" }
              as: FieldOfficer
          trigger:
            - call: "POST /coop/harvest-tickets"
              payload: { bog_id: "${b1}", season_id: "${s1}", method: "DRY", window_start: "2026-10-04T00:00:00Z", window_end: "2026-10-08T00:00:00Z" }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { err: "$.data.error_id" }
            - call: "POST /coop/harvest-tickets"
              payload: { bog_id: "${b1}", season_id: "${s1}", method: "WET", window_start: "2026-10-05T00:00:00Z", window_end: "2026-10-09T00:00:00Z" }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { t3: "$.data.id", t3_status: "$.data.status" }
          assert:
            - "Overlapping ticket rejected with error_id == ERR_HARVEST_WINDOW_OVERLAP"
            - "Adjacent ticket [10-05, 10-09) created with status == REQUESTED (half-open semantics: end == start is not a conflict)"

      - name: station_daily_aggregate_capacity_bucket
        grounds:
          - calculations.station_daily_capacity
          - errors[ERR_STATION_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Resource = ReceivingStation, aggregate-capacity bucket semantics: two
          deliveries of 300 and 200 expected barrels exactly fill the 500-barrel
          day bucket (allowed, <=), and a further 1-barrel delivery tips the
          aggregate over capacity and is rejected. This is a cumulative
          threshold over a calendar-day bucket, not pairwise interval overlap
          (the sibling instance's semantics).
        test_recipe:
          setup:
            - "Member ACTIVE, ACTIVE bog, season 2026 OPEN"
            - "Station with daily_capacity_barrels 500"
            - "Deliveries D1 (expected 300) and D2 (expected 200) already SCHEDULED on 2026-10-10 (500 == 500, allowed)"
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/bogs"
              payload: { name: "North Bog", acres: 10, variety: "STEVENS", sprinkler_demand_gpm: 500 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { b1: "$.data.id" }
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /coop/seasons/${s1}/open"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/stations"
              payload: { name: "Station A", daily_capacity_barrels: 500 }
              as: CoopAdmin
              captures: { st1: "$.data.id" }
            - call: "POST /coop/deliveries"
              payload: { season_id: "${s1}", bog_id: "${b1}", receiving_station_id: "${st1}", scheduled_date: "2026-10-10", expected_barrels: 300 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { d1: "$.data.id" }
            - call: "POST /coop/deliveries"
              payload: { season_id: "${s1}", bog_id: "${b1}", receiving_station_id: "${st1}", scheduled_date: "2026-10-10", expected_barrels: 200 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { d2: "$.data.id" }
          trigger:
            - call: "POST /coop/deliveries"
              payload: { season_id: "${s1}", bog_id: "${b1}", receiving_station_id: "${st1}", scheduled_date: "2026-10-10", expected_barrels: 1 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_STATION_CAPACITY_EXCEEDED (300 + 200 + 1 = 501 > 500)"
            - "The exact-fill 500-barrel load was accepted before (boundary is inclusive <=)"

  # ==========================================================================
  # Rule 9 — compensating_invariant (barrels vs currency)
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: accept_void_roundtrip_conserves_quota_barrels
        grounds:
          - state_machines.Delivery.GRADED_to_ACCEPTED
          - state_machines.Delivery.ACCEPTED_to_VOIDED
          - entities.MemberQuota.fields.delivered_barrels
        distinguishing_aspect: |
          Conserved quantity = barrels: MemberQuota.delivered_barrels must equal
          the sum of quota_applied_barrels over ACCEPTED, non-VOIDED deliveries;
          accept (950) followed by its compensating void returns the conserved
          quantity to 0 with zero drift. The sibling instance conserves
          currency (pool advances), a different quantity.
        test_recipe:
          setup:
            - "Member ACTIVE, ACTIVE bog, season OPEN (quota base 2000), station 5000, MAIN pool OPEN (rate 0.50)"
            - "Delivery graded A: net 950 (gross 1000, tare 50), weighted 1045"
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/bogs"
              payload: { name: "North Bog", acres: 10, variety: "STEVENS", sprinkler_demand_gpm: 500 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { b1: "$.data.id" }
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /coop/seasons/${s1}/open"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/stations"
              payload: { name: "Station A", daily_capacity_barrels: 5000 }
              as: CoopAdmin
              captures: { st1: "$.data.id" }
            - call: "POST /coop/pools"
              payload: { season_id: "${s1}", code: "MAIN", provisional_advance_rate_per_barrel: 0.50, retain_pct: 0.20 }
              as: PoolManager
              captures: { p1: "$.data.id" }
            - call: "POST /coop/deliveries"
              payload: { season_id: "${s1}", bog_id: "${b1}", receiving_station_id: "${st1}", scheduled_date: "2026-10-10", expected_barrels: 1000 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { d1: "$.data.id" }
            - call: "POST /coop/deliveries/${d1}/receive"
              payload: { gross_barrels: 1000, tare_barrels: 50 }
              as: StationOperator
              as_user_id: "${st1}"
            - call: "POST /coop/deliveries/${d1}/grade"
              payload: { color_score: 9.0, firmness_score: 8.5, foreign_matter_pct: 1.5 }
              as: StationOperator
              as_user_id: "${st1}"
          trigger:
            - call: "POST /coop/deliveries/${d1}/accept"
              payload: {}
              as: PoolManager
            - call: "GET /coop/quotas"
              payload: { member_id: "${m1}", season_id: "${s1}" }
              as: CoopAdmin
              captures: { q_after_accept: "$.data[0].delivered_barrels" }
            - call: "POST /coop/deliveries/${d1}/void"
              payload: {}
              as: PoolManager
            - call: "GET /coop/quotas"
              payload: { member_id: "${m1}", season_id: "${s1}" }
              as: CoopAdmin
              captures: { q_after_void: "$.data[0].delivered_barrels", q_over_after_void: "$.data[0].over_quota_barrels", q_posture: "$.data[0].posture" }
          assert:
            - "After accept: MemberQuota.delivered_barrels == 950"
            - "After void: MemberQuota.delivered_barrels == 0 (compensation exact, no drift)"
            - "After void: MemberQuota.over_quota_barrels == 0 and posture == WITHIN_QUOTA"
            - "Delivery.${d1}.status == VOIDED"

      - name: accept_void_roundtrip_conserves_pool_advances
        grounds:
          - state_machines.Delivery.GRADED_to_ACCEPTED
          - state_machines.Delivery.ACCEPTED_to_VOIDED
          - entities.Pool.fields.advances_outstanding
        distinguishing_aspect: |
          Conserved quantity = currency: Pool.advances_outstanding must equal
          the sum of advance_amount over ACCEPTED, non-VOIDED deliveries tagged
          to it; accept books 522.50, the compensating void removes exactly
          522.50, returning the pool's money aggregates to zero. Different
          conserved quantity from the sibling (barrels).
        test_recipe:
          setup:
            - "Member ACTIVE, ACTIVE bog, season OPEN, station 5000, MAIN pool OPEN (rate 0.50, retain 0.20)"
            - "Delivery graded A: net 950, weighted 1045"
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/bogs"
              payload: { name: "North Bog", acres: 10, variety: "STEVENS", sprinkler_demand_gpm: 500 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { b1: "$.data.id" }
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /coop/seasons/${s1}/open"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/stations"
              payload: { name: "Station A", daily_capacity_barrels: 5000 }
              as: CoopAdmin
              captures: { st1: "$.data.id" }
            - call: "POST /coop/pools"
              payload: { season_id: "${s1}", code: "MAIN", provisional_advance_rate_per_barrel: 0.50, retain_pct: 0.20 }
              as: PoolManager
              captures: { p1: "$.data.id" }
            - call: "POST /coop/deliveries"
              payload: { season_id: "${s1}", bog_id: "${b1}", receiving_station_id: "${st1}", scheduled_date: "2026-10-10", expected_barrels: 1000 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { d1: "$.data.id" }
            - call: "POST /coop/deliveries/${d1}/receive"
              payload: { gross_barrels: 1000, tare_barrels: 50 }
              as: StationOperator
              as_user_id: "${st1}"
            - call: "POST /coop/deliveries/${d1}/grade"
              payload: { color_score: 9.0, firmness_score: 8.5, foreign_matter_pct: 1.5 }
              as: StationOperator
              as_user_id: "${st1}"
          trigger:
            - call: "POST /coop/deliveries/${d1}/accept"
              payload: {}
              as: PoolManager
              captures: { d_advance: "$.data.advance_amount" }
            - call: "GET /coop/pools/${p1}"
              payload: {}
              as: PoolManager
              captures: { p_adv_accept: "$.data.advances_outstanding", p_weighted_accept: "$.data.weighted_barrels_total" }
            - call: "POST /coop/deliveries/${d1}/void"
              payload: {}
              as: PoolManager
            - call: "GET /coop/pools/${p1}"
              payload: {}
              as: PoolManager
              captures: { p_adv_void: "$.data.advances_outstanding", p_weighted_void: "$.data.weighted_barrels_total", p_net_void: "$.data.accepted_net_barrels" }
          assert:
            - "Delivery.${d1}.advance_amount == 522.50 (round2(1045 * 0.50))"
            - "After accept: Pool.advances_outstanding == 522.50 and weighted_barrels_total == 1045"
            - "After void: Pool.advances_outstanding == 0, weighted_barrels_total == 0, accepted_net_barrels == 0 (exact monetary compensation)"
