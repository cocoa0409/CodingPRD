      - name: corner_must_carry_election_requesting_expanded_basic_is_refused
        claim_type: Precondition Enforcement
        grounds:
          - validations[priority=17]
          - state_machines.CarriageElection.DRAFT_to_ELECTION_EFFECTIVE
          - errors.ERR_MUST_CARRY_NO_NEGOTIATION
        distinguishing_aspect: "The MUST_CARRY branch of the filing fork requires requested_tier == BROADCAST_BASIC, so filing a MUST_CARRY election that asks for EXPANDED_BASIC returns 422 ERR_MUST_CARRY_NO_NEGOTIATION and the election stays DRAFT."
