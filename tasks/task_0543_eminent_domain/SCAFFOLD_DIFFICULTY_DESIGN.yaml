          Negotiation opening depends on Parcel.research_status == OWNERSHIP_CLEARED; a parcel still RESEARCHING (never cleared)
          blocks the negotiation with ERR_OWNERSHIP_NOT_CLEARED — a dependency across the Negotiation<->Parcel pair.
