  - rule_id: transitive_cascade
    instances:
      - name: hazard_revision_cascades_to_plan_cycle_revision
        grounds:
          - state_machines.HazardProfile.PUBLISHED_to_PUBLISHED
          - state_machines.VulnerabilityAssessment.ASSESSED_to_STALE
          - state_machines.LifelineAsset.RANKED_to_RECOMPUTE_REQUIRED
          - state_machines.BenefitCostAnalysis.CERTIFIED_to_STALE
          - state_machines.PlanCycle.ENDORSEMENT_ROUND_to_REVISION
          - endpoints.post_hazard_profile_revision
        distinguishing_aspect: |
          A single hazard-profile revision propagates five hops down the graph edge chain
          HazardProfile -> VulnerabilityAssessment -> LifelineAsset -> BenefitCostAnalysis ->
          AdaptationProject -> PlanCycle, and the terminal hop invalidates an already-cast
          Endorsement — the cascade crosses four aggregates and ends by moving a *different* root
          entity (the plan cycle) backwards out of ENDORSEMENT_ROUND.
        test_recipe:
          setup:
            - "Two ACTIVE Jurisdictions with endorsement_weight 4 and 3."
            - "One PlanCycle with quorum_weight_bps 6600, max_revision_rounds 1 and required_session_count 1, advanced to ENDORSEMENT_ROUND with round_number 1 and revision_count 0."
            - "One PUBLISHED HazardProfile with published_version 1 and exposure_index 0.80."
            - "One ASSESSED VulnerabilityAssessment on that profile with vulnerability_score 0.82."
            - "One RANKED LifelineAsset with consequence_score 14.17 and criticality_tier TIER_2."
            - "One SCREENED_IN AdaptationProject with one ProjectAssetLink and one CERTIFIED BenefitCostAnalysis whose stale_reason is NONE."
            - "One COMPLETED EngagementSession and one Endorsement already cast with decision ENDORSED in round 1."
