# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3403_plant_based_protein_extrusion_foodservice_launch_reformulation
# 9 difficulty rules x >= 2 instances = 20 instances total.
# Every recipe replays from empty-DB using only §1.5 endpoints.
# Clock default is 2026-09-01T00:00:00Z; recipes set it explicitly anyway.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dvc_lot_landed_cost_provisional_vs_final
        grounds:
          - calculations.lot_landed_unit_cost
          - entities.IngredientLot.fields.provisional_unit_cost_cents
          - entities.IngredientLot.fields.final_unit_cost_cents
        distinguishing_aspect: "Procurement-cost domain: the SAME lot yields two different landed costs — provisional uses indexed base + freight ESTIMATE (580), final uses clamped invoice + ACTUAL freight (555) — and both are stored side by side."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Supplier SUP-LC-1 (PEA) QUALIFIED with ACTIVE agreement: base 500, floor 400, cap 540, committed 10000 kg."
            - "Lot LOT-LC-1 received with market_index_pct 0.10: indexed base = round_half_up(500 * 1.10) = 550, clamped to cap 540, plus freight estimate 40 -> provisional 580."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &c_sup_create
              call: "POST /protein-ops/suppliers"
              payload: { supplier_code: "SUP-LC-1", isolate_type: "PEA", committed_volume_kg: 10000, base_price_per_kg_cents: 500, price_floor_cents: 400, price_cap_cents: 540, agreement_start_date: "2026-08-01T00:00:00Z", agreement_end_date: "2027-08-01T00:00:00Z" }
              as: ProcurementManager
              captures: { sup_id: $.data.id }
            - &c_sup_qualify
              call: "POST /protein-ops/suppliers/${sup_id}/transitions"
              payload: { dimension: "QUALIFICATION", target_status: "QUALIFIED", audit_score: 90 }
              as: ProcurementManager
            - &c_sup_activate
              call: "POST /protein-ops/suppliers/${sup_id}/transitions"
              payload: { dimension: "AGREEMENT", target_status: "ACTIVE" }
              as: ProcurementManager
            - call: "POST /protein-ops/ingredient-lots"
              payload: { supplier_id: "${sup_id}", lot_code: "LOT-LC-1", quantity_kg: 100, received_at: "2026-09-01T00:00:00Z", market_index_pct: 0.10, moisture_pct: 6.5, protein_content_pct: 82.0 }
              as: ProcurementManager
              captures: { lot_id: $.data.id, prov_cost: $.data.provisional_unit_cost_cents }
          trigger:
            - call: "POST /protein-ops/ingredient-lots/${lot_id}/qc-decision"
              payload: { decision: "RELEASED", invoiced_unit_cost_cents: 520, actual_freight_cents_per_kg: 35 }
              as: QualityManager
          assert:
            - "IngredientLot.${lot_id}.provisional_unit_cost_cents == 580 (indexed 550 clamped to cap 540, plus 40 freight estimate)"
            - "IngredientLot.${lot_id}.final_unit_cost_cents == 555 (clamp(520, 400, 540) = 520, plus 35 actual freight)"
            - "provisional and final differ (580 != 555) for identical lot identity — the two variants are both persisted"
            - "IngredientLot.${lot_id}.qc_status == RELEASED"

      - name: dvc_writedown_provisional_vs_nrv_final
        grounds:
          - calculations.write_down_amounts
          - entities.InventoryWriteDown.fields.provisional_amount_cents
          - entities.InventoryWriteDown.fields.final_amount_cents
        distinguishing_aspect: "Inventory-valuation domain (different entity domain from dvc_lot_landed_cost): the SAME write-down is 17000 cents at full-cost provisional yet 11000 cents at NRV-adjusted final once POSTED — provisional values the whole cost, final only the unrecoverable portion."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. PEA supplier QUALIFIED, agreement ACTIVE. Lot of 500 kg released with invoiced 465 + freight 35 -> final 500 cents/kg."
            - "OWNED line CERTIFIED; product PROD-WD-1 ACTIVE with APPROVED label; run of 100 kg on RETAIL_FROZEN channel completed -> batch of 10 cases at unit_cost_cents_per_case = round_half_up(85 * 500 / 10) = 4250."
            - "Run RECALLED by QualityManager so recall_flag is true and RECALL write-downs are legal."
          setup_api_calls:
            - *c_clock
            - &c_sup_create_wd
              call: "POST /protein-ops/suppliers"
              payload: { supplier_code: "SUP-WD-1", isolate_type: "PEA", committed_volume_kg: 10000, base_price_per_kg_cents: 500, price_floor_cents: 400, price_cap_cents: 540, agreement_start_date: "2026-08-01T00:00:00Z", agreement_end_date: "2027-08-01T00:00:00Z" }
              as: ProcurementManager
              captures: { sup_id: $.data.id }
            - *c_sup_qualify
            - *c_sup_activate
            - call: "POST /protein-ops/ingredient-lots"
              payload: { supplier_id: "${sup_id}", lot_code: "LOT-WD-1", quantity_kg: 500, received_at: "2026-09-01T00:00:00Z", market_index_pct: 0.0, moisture_pct: 6.5, protein_content_pct: 82.0 }
              as: ProcurementManager
              captures: { lot_id: $.data.id }
            - call: "POST /protein-ops/ingredient-lots/${lot_id}/qc-decision"
              payload: { decision: "RELEASED", invoiced_unit_cost_cents: 465, actual_freight_cents_per_kg: 35 }
              as: QualityManager
            - &c_line_owned
              call: "POST /protein-ops/production-lines"
              payload: { line_code: "LINE-WD-1", site_type: "OWNED", hourly_capacity_kg: 250, supported_isolate_types: ["PEA", "SOY"] }
              as: PlantManager
              captures: { line_id: $.data.id, line_v: $.data.version }
            - &c_prod_create
              call: "POST /protein-ops/products"
              payload: { product_code: "PROD-WD-1", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - &c_label_create
              call: "POST /protein-ops/products/${prod_id}/label-versions"
              payload: { version_number: 1, protein_g: 22, fat_g: 5, sodium_mg: 320, claims: ["HIGH_PROTEIN"], ingredient_statement: "Water, pea protein isolate, expeller-pressed canola oil" }
              as: ProductManager
              captures: { lbl_id: $.data.id }
            - &c_label_submit
              call: "POST /protein-ops/label-versions/${lbl_id}/transitions"
              payload: { target_status: "SUBMITTED" }
              as: ProductManager
            - &c_label_approve
              call: "POST /protein-ops/label-versions/${lbl_id}/transitions"
              payload: { target_status: "APPROVED", expected_product_version: "${prod_v}" }
              as: ProductManager
            - &c_prod_pilot
              call: "POST /protein-ops/products/${prod_id}/lifecycle-transitions"
              payload: { target_state: "PILOT" }
              as: ProductManager
            - &c_prod_activate
              call: "POST /protein-ops/products/${prod_id}/lifecycle-transitions"
              payload: { target_state: "ACTIVE" }
              as: ProductManager
            - call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_id}", label_version_id: "${lbl_id}", channel: "RETAIL_FROZEN", planned_quantity_kg: 100, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T12:00:00Z", expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { run_id: $.data.id }
            - call: "POST /protein-ops/production-runs/${run_id}/transitions"
              payload: { target_status: "IN_PROGRESS" }
              as: PlantManager
            - call: "POST /protein-ops/production-runs/${run_id}/transitions"
              payload: { target_status: "COMPLETED", actual_quantity_kg: 100 }
              as: PlantManager
            - call: "GET /protein-ops/finished-goods-batches"
              payload: { production_run_id: "${run_id}" }
              as: PlantManager
              captures: { batch_id: "$.data[0].id" }
            - call: "POST /protein-ops/production-runs/${run_id}/transitions"
              payload: { target_status: "RECALLED" }
              as: QualityManager
            - call: "POST /protein-ops/inventory-write-downs"
              payload: { finished_goods_batch_id: "${batch_id}", quantity_cases: 4, reason: "RECALL" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { wd_id: $.data.id, wd_prov: $.data.provisional_amount_cents }
          trigger:
            - call: "POST /protein-ops/inventory-write-downs/${wd_id}/decision"
              payload: { decision: "POSTED" }
              as: FinanceController
              as_user_id: "fin-1"
          assert:
            - "InventoryWriteDown.${wd_id}.provisional_amount_cents == 17000 (4 cases * 4250 full cost)"
            - "InventoryWriteDown.${wd_id}.final_amount_cents == 11000 (4 * max(0, 4250 - NRV_CENTS_PER_CASE_RETAIL_FROZEN 1500))"
            - "provisional != final (17000 != 11000) for identical quantity and batch"
            - "InventoryWriteDown.${wd_id}.status == POSTED"
            - "FinishedGoodsBatch.${batch_id}.available_cases == 6 and written_off_cases == 4"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cf_price_parity_nested_inputs
        grounds:
          - calculations.price_parity_index
          - entities.Product.fields.price_parity_index
        distinguishing_aspect: "Mode (a) >= 3 inputs with non-linear interaction: two lot costs weighted by remaining kg, multiplied by a 35% extrusion markup, plus 110 packaging cents, divided by the 920 reference — the nested weight-then-scale-then-add-then-divide chain yields exactly 823 cents/kg and parity index 0.8946."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Supplier SUP-PAR-1 (PEA) QUALIFIED, agreement ACTIVE (base 500, floor 400, cap 540)."
            - "Lot LOT-PAR-A: 200 kg, released with invoiced 520 + freight 35 -> final 555. Lot LOT-PAR-B: 100 kg, released with invoiced 440 + freight 35 -> final 475."
            - "Product PROD-PAR-1 (PEA) in PILOT with APPROVED label; no consumption yet, so both lots fully remaining."
          setup_api_calls:
            - *c_clock
            - call: "POST /protein-ops/suppliers"
              payload: { supplier_code: "SUP-PAR-1", isolate_type: "PEA", committed_volume_kg: 10000, base_price_per_kg_cents: 500, price_floor_cents: 400, price_cap_cents: 540, agreement_start_date: "2026-08-01T00:00:00Z", agreement_end_date: "2027-08-01T00:00:00Z" }
              as: ProcurementManager
              captures: { sup_id: $.data.id }
            - *c_sup_qualify
            - *c_sup_activate
            - call: "POST /protein-ops/ingredient-lots"
              payload: { supplier_id: "${sup_id}", lot_code: "LOT-PAR-A", quantity_kg: 200, received_at: "2026-09-01T00:00:00Z", market_index_pct: 0.0, moisture_pct: 6.5, protein_content_pct: 82.0 }
              as: ProcurementManager
              captures: { lot_a: $.data.id }
            - call: "POST /protein-ops/ingredient-lots/${lot_a}/qc-decision"
              payload: { decision: "RELEASED", invoiced_unit_cost_cents: 520, actual_freight_cents_per_kg: 35 }
              as: QualityManager
            - call: "POST /protein-ops/ingredient-lots"
              payload: { supplier_id: "${sup_id}", lot_code: "LOT-PAR-B", quantity_kg: 100, received_at: "2026-09-02T00:00:00Z", market_index_pct: 0.0, moisture_pct: 6.2, protein_content_pct: 83.0 }
              as: ProcurementManager
              captures: { lot_b: $.data.id }
            - call: "POST /protein-ops/ingredient-lots/${lot_b}/qc-decision"
              payload: { decision: "RELEASED", invoiced_unit_cost_cents: 440, actual_freight_cents_per_kg: 35 }
              as: QualityManager
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-PAR-1", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /protein-ops/products/${prod_id}/label-versions"
              payload: { version_number: 1, protein_g: 22, fat_g: 5, sodium_mg: 320, claims: ["HIGH_PROTEIN"], ingredient_statement: "Water, pea protein isolate" }
              as: ProductManager
              captures: { lbl_id: $.data.id }
            - call: "POST /protein-ops/label-versions/${lbl_id}/transitions"
              payload: { target_status: "SUBMITTED" }
              as: ProductManager
            - call: "POST /protein-ops/label-versions/${lbl_id}/transitions"
              payload: { target_status: "APPROVED", expected_product_version: "${prod_v}" }
              as: ProductManager
            - call: "POST /protein-ops/products/${prod_id}/lifecycle-transitions"
              payload: { target_state: "PILOT" }
              as: ProductManager
          trigger:
            - call: "POST /protein-ops/products/${prod_id}/lifecycle-transitions"
              payload: { target_state: "ACTIVE" }
              as: ProductManager
          assert:
            - "Product.${prod_id}.unit_cost_per_kg_cents == 823 (weighted avg (555*200 + 475*100)/300 = 528.3333; * 1.35 = 713.25; + 110 = 823.25 -> round_half_up 823)"
            - "Product.${prod_id}.price_parity_index == 0.8946 (823 / 920 = 0.89456... at 4dp round_half_up)"
            - "Product.${prod_id}.parity_goal_met == true (0.8946 <= PARITY_GOAL_MAX 1.05)"
            - "Product.${prod_id}.status == ACTIVE"

      - name: cf_delivered_cases_per_run_floor
        grounds:
          - calculations.program_attainment
          - calculations.batch_costing
          - entities.GrowthProgram.fields.delivered_cases
        distinguishing_aspect: "Mode (b) nested rounding where order matters (different mode from cf_price_parity_nested_inputs): per-run floor(105/10) = 10 cases summed twice = 20, whereas floor-after-sum would give floor(210/10) = 21 — the scaffold pins per-run floor then sum, so delivered_cases is 20 and attainment 83.33 blocks conversion."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Supplier QUALIFIED/ACTIVE with 500 kg released lot (final 535). OWNED line. Product PROD-CF-2 ACTIVE with APPROVED label."
            - "FOODSERVICE_LTO program PROG-CF-2 for partner CHAIN-CF, window 2026-09-01..2026-10-31, committed_cases 24, status IN_WINDOW."
            - "Two dedicated FOODSERVICE runs of 105 kg each complete on non-overlapping windows 2026-09-05 and 2026-09-06 (each consumes ceil(105*0.85) = 90 kg of isolate)."
          setup_api_calls:
            - *c_clock
            - call: "POST /protein-ops/suppliers"
              payload: { supplier_code: "SUP-CF-2", isolate_type: "PEA", committed_volume_kg: 10000, base_price_per_kg_cents: 500, price_floor_cents: 400, price_cap_cents: 540, agreement_start_date: "2026-08-01T00:00:00Z", agreement_end_date: "2027-08-01T00:00:00Z" }
              as: ProcurementManager
              captures: { sup_id: $.data.id }
            - *c_sup_qualify
            - *c_sup_activate
            - call: "POST /protein-ops/ingredient-lots"
              payload: { supplier_id: "${sup_id}", lot_code: "LOT-CF-2", quantity_kg: 500, received_at: "2026-09-01T00:00:00Z", market_index_pct: 0.0, moisture_pct: 6.5, protein_content_pct: 82.0 }
              as: ProcurementManager
              captures: { lot_id: $.data.id }
            - call: "POST /protein-ops/ingredient-lots/${lot_id}/qc-decision"
              payload: { decision: "RELEASED", invoiced_unit_cost_cents: 500, actual_freight_cents_per_kg: 35 }
              as: QualityManager
            - call: "POST /protein-ops/production-lines"
              payload: { line_code: "LINE-CF-2", site_type: "OWNED", hourly_capacity_kg: 250, supported_isolate_types: ["PEA"] }
              as: PlantManager
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-CF-2", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /protein-ops/products/${prod_id}/label-versions"
              payload: { version_number: 1, protein_g: 22, fat_g: 5, sodium_mg: 320, claims: ["HIGH_PROTEIN"], ingredient_statement: "Water, pea protein isolate" }
              as: ProductManager
              captures: { lbl_id: $.data.id }
            - call: "POST /protein-ops/label-versions/${lbl_id}/transitions"
              payload: { target_status: "SUBMITTED" }
              as: ProductManager
            - call: "POST /protein-ops/label-versions/${lbl_id}/transitions"
              payload: { target_status: "APPROVED", expected_product_version: "${prod_v}" }
              as: ProductManager
            - call: "POST /protein-ops/products/${prod_id}/lifecycle-transitions"
              payload: { target_state: "PILOT" }
              as: ProductManager
            - call: "POST /protein-ops/products/${prod_id}/lifecycle-transitions"
              payload: { target_state: "ACTIVE" }
              as: ProductManager
            - call: "POST /protein-ops/programs"
              payload: { program_code: "PROG-CF-2", program_type: "FOODSERVICE_LTO", partner_code: "CHAIN-CF", product_id: "${prod_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-31T23:59:59Z", committed_cases: 24, dedicated_run_required: true }
              as: ChannelManager
              captures: { prog_id: $.data.id }
            - call: "POST /protein-ops/programs/${prog_id}/lifecycle"
              payload: { target_status: "ACTIVE" }
              as: ChannelManager
            - call: "POST /protein-ops/programs/${prog_id}/lifecycle"
              payload: { target_status: "IN_WINDOW" }
              as: ChannelManager
            - call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_id}", label_version_id: "${lbl_id}", program_id: "${prog_id}", channel: "FOODSERVICE", planned_quantity_kg: 105, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T12:00:00Z", expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { run1_id: $.data.id }
            - call: "POST /protein-ops/production-runs/${run1_id}/transitions"
              payload: { target_status: "IN_PROGRESS" }
              as: PlantManager
            - call: "POST /protein-ops/production-runs/${run1_id}/transitions"
              payload: { target_status: "COMPLETED", actual_quantity_kg: 105 }
              as: PlantManager
            - call: "POST /protein-ops/production-lines/${line_id}/operational-transitions"
              payload: { target_status: "IDLE" }
              as: PlantManager
            - call: "GET /protein-ops/production-lines"
              payload: {}
              as: PlantManager
              captures: { line_v2: "$.data[0].version" }
            - call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_id}", label_version_id: "${lbl_id}", program_id: "${prog_id}", channel: "FOODSERVICE", planned_quantity_kg: 105, scheduled_start: "2026-09-06T08:00:00Z", scheduled_end: "2026-09-06T12:00:00Z", expected_line_version: "${line_v2}" }
              as: PlantManager
              captures: { run2_id: $.data.id }
            - call: "POST /protein-ops/production-runs/${run2_id}/transitions"
              payload: { target_status: "IN_PROGRESS" }
              as: PlantManager
            - call: "POST /protein-ops/production-runs/${run2_id}/transitions"
              payload: { target_status: "COMPLETED", actual_quantity_kg: 105 }
              as: PlantManager
            - call: "POST /protein-ops/programs/${prog_id}/lifecycle"
              payload: { target_status: "EVALUATING" }
              as: ChannelManager
          trigger:
            - call: "POST /protein-ops/programs/${prog_id}/lifecycle"
              payload: { target_status: "CONVERTED" }
              as: ChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "GrowthProgram.${prog_id}.delivered_cases == 20 (per-run floor(105/10) = 10 twice; NOT 21 from floor(210/10))"
            - "GrowthProgram.${prog_id}.attainment_pct == 83.33 (round_half_up(20 * 100 / 24, 2))"
            - "trigger fails with error_id ERR_PROGRAM_TARGET_NOT_MET because 83.33 < LAUNCH_MIN_ATTAINMENT_PCT 85.00"
            - "GrowthProgram.${prog_id}.status == EVALUATING (unchanged)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nsm_supplier_requalification_cycle
        grounds:
          - state_machines.Supplier.QUALIFIED_to_SUSPENDED
          - state_machines.Supplier.SUSPENDED_to_QUALIFIED
        distinguishing_aspect: "Cyclic machine on Supplier: QUALIFIED -> SUSPENDED -> QUALIFIED loops, and the loop-back leg is STRICTER than first qualification (requalification needs audit_score >= 80, not >= 70) — 75 fails, 85 succeeds."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Supplier SUP-CYC-1 created and QUALIFIED with audit_score 90."
          setup_api_calls:
            - *c_clock
            - call: "POST /protein-ops/suppliers"
              payload: { supplier_code: "SUP-CYC-1", isolate_type: "SOY", committed_volume_kg: 5000, base_price_per_kg_cents: 300, price_floor_cents: 250, price_cap_cents: 380, agreement_start_date: "2026-08-01T00:00:00Z", agreement_end_date: "2027-08-01T00:00:00Z" }
              as: ProcurementManager
              captures: { sup_id: $.data.id }
            - *c_sup_qualify
            - call: "POST /protein-ops/suppliers/${sup_id}/transitions"
              payload: { dimension: "QUALIFICATION", target_status: "SUSPENDED" }
              as: ProcurementManager
          trigger:
            - call: "POST /protein-ops/suppliers/${sup_id}/transitions"
              payload: { dimension: "QUALIFICATION", target_status: "QUALIFIED", audit_score: 75 }
              as: ProcurementManager
              captures: { err1: $.data.error_id }
            - call: "POST /protein-ops/suppliers/${sup_id}/transitions"
              payload: { dimension: "QUALIFICATION", target_status: "QUALIFIED", audit_score: 85 }
              as: ProcurementManager
          assert:
            - "first reinstate attempt fails with ERR_SUPPLIER_NOT_QUALIFIABLE (75 < REQUALIFY_MIN_AUDIT_SCORE 80 even though 75 >= first-time 70)"
            - "Supplier.${sup_id}.qualification_status == QUALIFIED after the 85 attempt (cycle QUALIFIED -> SUSPENDED -> QUALIFIED completed)"
            - "Supplier.${sup_id}.audit_score == 85 (latest audit score stored)"

      - name: nsm_label_revision_cycle
        grounds:
          - state_machines.LabelVersion.DRAFT_to_SUBMITTED
          - state_machines.LabelVersion.SUBMITTED_to_DRAFT
          - state_machines.LabelVersion.SUBMITTED_to_APPROVED
        distinguishing_aspect: "Cyclic machine on LabelVersion (different entity from Supplier): DRAFT -> SUBMITTED -> DRAFT -> SUBMITTED -> APPROVED — the revision loop is legal, and only the final APPROVED bumps product.version from 1 to 2."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Product PROD-CYC-1 (DEVELOPMENT, version 1) with label version 1 in DRAFT."
          setup_api_calls:
            - *c_clock
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-CYC-1", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /protein-ops/products/${prod_id}/label-versions"
              payload: { version_number: 1, protein_g: 22, fat_g: 5, sodium_mg: 320, claims: ["HIGH_PROTEIN"], ingredient_statement: "Water, pea protein isolate" }
              as: ProductManager
              captures: { lbl_id: $.data.id }
            - *c_label_submit
          trigger:
            - call: "POST /protein-ops/label-versions/${lbl_id}/transitions"
              payload: { target_status: "DRAFT" }
              as: ProductManager
            - *c_label_submit
            - *c_label_approve
          assert:
            - "LabelVersion.${lbl_id}.status == APPROVED after the DRAFT -> SUBMITTED -> DRAFT -> SUBMITTED -> APPROVED loop"
            - "Product.${prod_id}.version == 2 (only the APPROVED transition bumps product.version; submit/return do not)"

      - name: nsm_line_parallel_dimensions
        grounds:
          - entities.ProductionLine.fields.certification_status
          - entities.ProductionLine.fields.operational_status
          - calculations.equivalence_audit_result
        distinguishing_aspect: "Parallel state dimensions on one entity (different shape from the two cycles): a CO_MAN line's certification (PENDING/CERTIFIED/SUSPENDED) and operational (IDLE/SETUP/RUNNING/CLEANING/DOWN) dimensions evolve independently — the line can sit in SUSPENDED x SETUP after an audit fails mid-setup."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. CO_MAN line LINE-PAR-1 created: certification PENDING, operational IDLE."
          setup_api_calls:
            - *c_clock
            - call: "POST /protein-ops/production-lines"
              payload: { line_code: "LINE-PAR-1", site_type: "CO_MAN", coman_partner_name: "CoPack Industries", monthly_reserved_capacity_kg: 5000, hourly_capacity_kg: 200, supported_isolate_types: ["PEA"] }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "POST /protein-ops/production-lines/${line_id}/certification-audits"
              payload: { texture_score: 90, moisture_variance_pct: 1.0 }
              as: QualityManager
          trigger:
            - call: "POST /protein-ops/production-lines/${line_id}/operational-transitions"
              payload: { target_status: "SETUP" }
              as: PlantManager
            - call: "POST /protein-ops/production-lines/${line_id}/certification-audits"
              payload: { texture_score: 70, moisture_variance_pct: 1.0 }
              as: QualityManager
          assert:
            - "ProductionLine.${line_id}.certification_status == CERTIFIED after the passing audit while operational_status stayed IDLE"
            - "after operational transition: certification_status == CERTIFIED and operational_status == SETUP (independent dims)"
            - "after failing audit: certification_status == SUSPENDED and operational_status == SETUP (audit does not disturb the operational dimension)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: tc_run_completion_depth3
        grounds:
          - state_machines.ProductionRun.IN_PROGRESS_to_COMPLETED
          - state_machines.IngredientLot.RELEASED_to_DEPLETED
          - state_machines.Supplier.transitions (ACTIVE_to_COMPLETED agreement completion)
        distinguishing_aspect: "Depth-3 chain: run completion decrements lot remaining_kg (link 1), the lot hitting 0 flips RELEASED -> DEPLETED (link 2), and that depletion re-evaluates the supplier agreement into COMPLETED (link 3) — each link caused by the previous one, not by the original POST."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Supplier SUP-TC-1 (PEA) QUALIFIED, agreement ACTIVE with committed_volume_kg exactly 85; one lot of exactly 85 kg RELEASED (delivered_volume_kg = 85 >= 85 but open_lot_count = 1, so agreement still ACTIVE)."
            - "OWNED line; product PROD-TC-1 ACTIVE with APPROVED label; run planned 100 kg scheduled 2026-09-05T08:00:00Z..12:00:00Z, IN_PROGRESS."
          setup_api_calls:
            - *c_clock
            - call: "POST /protein-ops/suppliers"
              payload: { supplier_code: "SUP-TC-1", isolate_type: "PEA", committed_volume_kg: 85, base_price_per_kg_cents: 500, price_floor_cents: 400, price_cap_cents: 540, agreement_start_date: "2026-08-01T00:00:00Z", agreement_end_date: "2027-08-01T00:00:00Z" }
              as: ProcurementManager
              captures: { sup_id: $.data.id }
            - *c_sup_qualify
            - *c_sup_activate
            - call: "POST /protein-ops/ingredient-lots"
              payload: { supplier_id: "${sup_id}", lot_code: "LOT-TC-1", quantity_kg: 85, received_at: "2026-09-01T00:00:00Z", market_index_pct: 0.0, moisture_pct: 6.5, protein_content_pct: 82.0 }
              as: ProcurementManager
              captures: { lot_id: $.data.id }
            - call: "POST /protein-ops/ingredient-lots/${lot_id}/qc-decision"
              payload: { decision: "RELEASED", invoiced_unit_cost_cents: 500, actual_freight_cents_per_kg: 35 }
              as: QualityManager
            - call: "POST /protein-ops/production-lines"
              payload: { line_code: "LINE-TC-1", site_type: "OWNED", hourly_capacity_kg: 250, supported_isolate_types: ["PEA"] }
              as: PlantManager
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-TC-1", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /protein-ops/products/${prod_id}/label-versions"
              payload: { version_number: 1, protein_g: 22, fat_g: 5, sodium_mg: 320, claims: ["HIGH_PROTEIN"], ingredient_statement: "Water, pea protein isolate" }
              as: ProductManager
              captures: { lbl_id: $.data.id }
            - call: "POST /protein-ops/label-versions/${lbl_id}/transitions"
              payload: { target_status: "SUBMITTED" }
              as: ProductManager
            - call: "POST /protein-ops/label-versions/${lbl_id}/transitions"
              payload: { target_status: "APPROVED", expected_product_version: "${prod_v}" }
              as: ProductManager
            - call: "POST /protein-ops/products/${prod_id}/lifecycle-transitions"
              payload: { target_state: "PILOT" }
              as: ProductManager
            - call: "POST /protein-ops/products/${prod_id}/lifecycle-transitions"
              payload: { target_state: "ACTIVE" }
              as: ProductManager
            - call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_id}", label_version_id: "${lbl_id}", channel: "RETAIL_FROZEN", planned_quantity_kg: 100, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T12:00:00Z", expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { run_id: $.data.id }
            - call: "POST /protein-ops/production-runs/${run_id}/transitions"
              payload: { target_status: "IN_PROGRESS" }
              as: PlantManager
          trigger:
            - call: "POST /protein-ops/production-runs/${run_id}/transitions"
              payload: { target_status: "COMPLETED", actual_quantity_kg: 100 }
              as: PlantManager
            - call: "GET /protein-ops/ingredient-lots/${lot_id}"
              as: QualityManager
            - call: "GET /protein-ops/suppliers"
              payload: {}
              as: ProcurementManager
              captures: { agr: "$.data[0].agreement_status" }
            - call: "GET /protein-ops/finished-goods-batches"
              payload: { production_run_id: "${run_id}" }
              as: PlantManager
              captures: { batch_id: "$.data[0].id", batch_cases: "$.data[0].quantity_cases" }
          assert:
            - "IngredientLot.${lot_id}.remaining_kg == 0 and qc_status == DEPLETED (link 2: system transition on full consumption of ceil(100*0.85) = 85 kg)"
            - "Supplier.${sup_id}.agreement_status == COMPLETED (link 3: delivered 85 >= committed 85 and open_lot_count == 0)"
            - "FinishedGoodsBatch.${batch_id}.quantity_cases == 10 (floor(100/10)) and unit_cost_cents_per_case == 4548 (round_half_up(85 * 535 / 10) = round_half_up(4547.5))"
            - "ProductionRun.${run_id}.consumed_lot_ids == [${lot_id}]"
            - "ProductionLine.${line_id}.operational_status == CLEANING after completion"

      - name: tc_supplier_disqualify_depth2
        grounds:
          - state_machines.Supplier.QUALIFIED_to_DISQUALIFIED
          - state_machines.Supplier.ACTIVE_to_TERMINATED (agreement cascade)
          - state_machines.IngredientLot.QUARANTINE_to_REJECTED
        distinguishing_aspect: "Depth-2 chain from a different trigger than tc_run_completion_depth3: disqualifying the supplier terminates the ACTIVE agreement (link 1), and that termination rejects the QUARANTINE lot (link 2) — the lot mutation is caused by the agreement termination, not directly by the disqualify call."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Supplier SUP-TC-2 QUALIFIED, agreement ACTIVE; lot LOT-TC-2 of 100 kg still in QUARANTINE."
          setup_api_calls:
            - *c_clock
            - call: "POST /protein-ops/suppliers"
              payload: { supplier_code: "SUP-TC-2", isolate_type: "MUNG_BEAN", committed_volume_kg: 1000, base_price_per_kg_cents: 300, price_floor_cents: 250, price_cap_cents: 380, agreement_start_date: "2026-08-01T00:00:00Z", agreement_end_date: "2027-08-01T00:00:00Z" }
              as: ProcurementManager
              captures: { sup_id: $.data.id }
            - *c_sup_qualify
            - *c_sup_activate
            - call: "POST /protein-ops/ingredient-lots"
              payload: { supplier_id: "${sup_id}", lot_code: "LOT-TC-2", quantity_kg: 100, received_at: "2026-09-01T00:00:00Z", market_index_pct: 0.0, moisture_pct: 6.5, protein_content_pct: 80.0 }
              as: ProcurementManager
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /protein-ops/suppliers/${sup_id}/transitions"
              payload: { dimension: "QUALIFICATION", target_status: "DISQUALIFIED" }
              as: ProcurementManager
            - call: "GET /protein-ops/ingredient-lots/${lot_id}"
              as: QualityManager
          assert:
            - "Supplier.${sup_id}.qualification_status == DISQUALIFIED"
            - "Supplier.${sup_id}.agreement_status == TERMINATED (link 1)"
            - "IngredientLot.${lot_id}.qc_status == REJECTED (link 2 fired by the agreement termination)"
            - "IngredientLot.${lot_id}.remaining_kg == 100 (rejection never consumes quantity)"

