          trigger:
            - call: "POST /op/device-orders"
              payload: { prescription_id: "${rx_id}", supplier_id: "${sup_id}", fitting_practitioner_id: "${fit_id}" }
              as: BillingSpecialist
              captures: { ord_id: $.data.id, st: $.data.status }
          assert:
            - "HTTP 201; DeviceOrder created (Rx exactly at +6mo boundary is in-window)"
            - "Prescription.${rx_id}.status == CONSUMED"

      - name: derived_field_milestone_progress_reconciled_on_add
        claim_type: derived_field_reconciliation
        grounds: [calculations.fabrication_progress, entities.DeviceOrder.fields.milestone_progress_pct]
        distinguishing_aspect: "After completing 1 of 2 milestones (weights 2 and 3), milestone_progress_pct reconciles to round_half_up(2*100/5)==40 on the order read."
        test_recipe:
          setup: ["A no-auth orthosis order with two milestones (weights 2 and 3), in FABRICATION."]
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /op/physicians"
              payload: { full_name: "Dr Rx", npi: "1111111111", pecos_enrolled: true }
              as: ComplianceOfficer
              captures: { rx_phys_id: $.data.id }
            - call: "POST /op/physicians"
              payload: { full_name: "Tech Fit", npi: "2222222222", pecos_enrolled: true }
              as: ComplianceOfficer
              captures: { fit_id: $.data.id }
            - call: "POST /op/suppliers"
              payload: { legal_name: "Acme O&P", accreditation_expiry: "2028-01-01T00:00:00Z", surety_bond_active: true }
              as: ComplianceOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /op/patients"
              payload: { full_name: "Pat Df", date_of_birth: "1960-01-01", payer_type: "COMMERCIAL" }
              as: BillingSpecialist
              captures: { pat_id: $.data.id }
            - call: "POST /op/prescriptions"
              payload: { patient_id: "${pat_id}", physician_id: "${rx_phys_id}", device_category: "LOWER_EXTREMITY_ORTHOSIS", primary_diagnosis_code: "M21.6X1", face_to_face_date: "2026-05-20" }
              as: Physician
              as_user_id: "${rx_phys_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /op/prescriptions/${rx_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "${rx_phys_id}"
            - call: "POST /op/device-orders"
              payload: { prescription_id: "${rx_id}", supplier_id: "${sup_id}", fitting_practitioner_id: "${fit_id}" }
              as: BillingSpecialist
              captures: { ord_id: $.data.id }
            - call: "POST /op/device-orders/${ord_id}/fabrication-milestones"
              payload: { step: "CASTING", weight: 2 }
              as: Practitioner
              as_user_id: "${fit_id}"
              captures: { ms1_id: $.data.id }
            - call: "POST /op/device-orders/${ord_id}/fabrication-milestones"
              payload: { step: "ASSEMBLY", weight: 3 }
              as: Practitioner
              as_user_id: "${fit_id}"
              captures: { ms2_id: $.data.id }
            - call: "POST /op/device-orders/${ord_id}/start-fabrication"
              payload: {}
              as: Practitioner
              as_user_id: "${fit_id}"
          trigger:
            - call: "POST /op/fabrication-milestones/${ms1_id}/complete"
              payload: {}
              as: Practitioner
              as_user_id: "${fit_id}"
            - call: "GET /op/device-orders/${ord_id}"
              payload: {}
              as: Practitioner
              as_user_id: "${fit_id}"
              captures: { pct: $.data.milestone_progress_pct, st: $.data.status }
          assert:
            - "DeviceOrder.${ord_id}.milestone_progress_pct == 40"
            - "DeviceOrder.${ord_id}.status == FABRICATION (not yet all complete)"

  # =================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_ledger_visible_same_response
        claim_type: immediate
        grounds: [calculations.order_allowed_total, state_machines.ClaimLine.SUBMITTED_to_ADJUDICATED]
        distinguishing_aspect: "Adjudicating a line makes the order's allowed_total_cents reflect the new allowed_cents on the very next read in the same request flow (immediate consistency, no lag)."
        excluded_because:
          difficulty_instance: dual_variant_calc / order_allowed_total_estimate_vs_ledger
          rationale: "Immediate visibility of the recomputed ledger after adjudication is asserted directly by the named §1.8 dual-variant instance's final assertion on allowed_total_cents."
