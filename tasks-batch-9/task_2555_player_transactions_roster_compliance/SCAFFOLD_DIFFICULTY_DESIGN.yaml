  # ===========================================================================
  # R5 — priority_pair_validation_conflict
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: frozen_club_safety_check_beats_cap_excess_on_filing_creation
        grounds:
          - validations[priority=15]
          - validations[priority=37]
          - errors[ERR_TEAM_TRANSACTIONS_FROZEN]
          - errors[ERR_CAP_LIMIT_EXCEEDED]
          - state_machines.Team.NON_COMPLIANT_to_TRANSACTION_FROZEN
          - calculations.team_compliance_evaluation
        distinguishing_aspect: |
          The conflicting pair is business_safety (priority 15) against business_fiscal
          (priority 37) on POST /transactions: the club is frozen AND the new filing would
          break a 50000000 cap, and the response is ERR_TEAM_TRANSACTIONS_FROZEN, never
          ERR_CAP_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z."
