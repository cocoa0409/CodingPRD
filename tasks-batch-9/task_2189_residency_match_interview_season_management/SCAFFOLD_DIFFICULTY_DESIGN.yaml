  # ===========================================================================
  # Rule 5 — Priority-pair validation conflicts on DIFFERENT priority pairs
  #   instance 1 → priority 5 (state) beats priority 10 (business_constraint)
  #   instance 2 → priority 7 (business_safety) beats priority 9 (business_temporal)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_check_precedes_screening_filter_on_already_rejected_application
        grounds:
          - validations.priority_5.ERR_INVALID_STATE
          - validations.priority_10.ERR_SCREENING_FILTER_FAILED
          - state_machines.Application.UNDER_REVIEW_to_REJECTED
        conflict_pair:
          higher_priority: "5 — ERR_INVALID_STATE (409): no ADVANCED transition is declared out of REJECTED"
          lower_priority: "10 — ERR_SCREENING_FILTER_FAILED (422): step2_score 210 < min_step2_score 220"
          expected_winner: "ERR_INVALID_STATE, HTTP 409"
        distinguishing_aspect: |
          The same request violates both checks at once: the application is already REJECTED (state,
          priority 5) AND its applicant fails the inclusive Step 2 floor (business constraint,
          priority 10). Only the priority-5 error may be reported, and the two errors carry
          different HTTP statuses (409 vs 422), so an implementation that runs the screening filters
          before the state check is observably wrong.
        test_recipe:
          setup:
            - "one Program in REVIEW_OPEN with min_step2_score 220"
            - "applicant cand1 with step2_score 210, and applicant cand2 also with step2_score 210"
            - "application app1 reviewed twice then screened with decision REJECT, so it is REJECTED"
            - "application app2 reviewed twice and left UNDER_REVIEW as the single-violation control"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
            - call: "POST /programs"
