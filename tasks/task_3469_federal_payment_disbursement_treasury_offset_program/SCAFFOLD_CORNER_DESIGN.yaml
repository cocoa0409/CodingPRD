            - call: "GET /offsets"
              payload: { debt_id: "${debt_b}" }
              as: Auditor
              captures: { off_b_amt: "$.data[0].offset_amount_cents" }
            - call: "GET /offsets"
              payload: { debt_id: "${debt_a}" }
              as: Auditor
              captures: { off_a_amt: "$.data[0].offset_amount_cents" }
          assert:
            - "the offset on debt B (older delinquency 2026-01-01) is 8000 — it is served first despite being created second"
            - "the offset on debt A (delinquency 2026-02-01) is 2000 — the remainder of the 10000-cent pool"
            - "both offsets carry priority_rank == 30 (FEDERAL_NONTAX); order was decided by delinquent_since alone"

      - name: matching_excludes_non_active_debts
        claim_type: Input Set Filtering
        grounds:
          - calculations.waterfall_allocation
