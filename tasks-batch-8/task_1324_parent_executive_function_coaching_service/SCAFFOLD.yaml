# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_FORBIDDEN_SCOPE, http: 403, condition: "Entity-backed caller does not own the path resource (wrong family, wrong coach, wrong contact, non-author coach, non-supervisor coach on HELD)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced id does not exist (checked left-to-right)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, invalid enum member, range violation (baseline_score 0..100, credits_total >= 1, capacity >= 1, hours > 0, scheduled_end <= scheduled_start, duration > 120 minutes, due_at/expires_at/window_start not in the future)" }
  - { id: ERR_STALE_CLIENT_VERSION, http: 412, condition: "expected_client_version != Client.version on POST /clients/{id}/plans" }
  - { id: ERR_STALE_FAMILY_VERSION, http: 412, condition: "expected_family_version != Family.version on POST /families/{id}/consents" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic invalid-from transition or terminal-state write on any state machine" }
  - { id: ERR_FAMILY_NOT_ACTIVE, http: 409, condition: "Family not ACTIVE where required (plan accept, package purchase, session schedule, enrollment, package refund from CLOSED)" }
  - { id: ERR_FAMILY_NO_CLIENTS, http: 409, condition: "Family INTAKE -> ACTIVE with zero clients" }
  - { id: ERR_FAMILY_DELINQUENT, http: 409, condition: "Family SUSPENDED -> ACTIVE while outstanding_balance_cents > 20000" }
  - { id: ERR_FAMILY_HAS_ACTIVE_DEPENDENCIES, http: 409, condition: "Family close with ACTIVE plans, ACTIVE packages, or ENROLLED/WAITLISTED enrollments" }
  - { id: ERR_CLIENT_NOT_ACTIVE, http: 409, condition: "Client status not in the required set (ACTIVE for scheduling/enrollment; INTAKE|ACTIVE for plan accept)" }
  - { id: ERR_CLIENT_HAS_ACTIVE_PLAN, http: 409, condition: "Client discharge attempted while a plan is ACTIVE" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "Plan not ACTIVE where required (session schedule, check-in create/submit, goal ACHIEVE)" }
  - { id: ERR_PLAN_HAS_OPEN_SESSIONS, http: 409, condition: "Plan completion with sessions still SCHEDULED" }
  - { id: ERR_GOALS_NOT_RESOLVED, http: 409, condition: "Propose without any SET/IN_PROGRESS goal; complete with any non-terminal goal" }
  - { id: ERR_INTAKE_NOT_APPROVED, http: 409, condition: "Plan create/propose referencing an intake not in APPROVED" }
  - { id: ERR_INTAKE_CLIENT_MISMATCH, http: 422, condition: "intake_id belongs to a different client than the path client" }
  - { id: ERR_PACKAGE_NOT_ACTIVE, http: 409, condition: "Session scheduling against a package not in ACTIVE" }
  - { id: ERR_PACKAGE_NOT_REFUNDABLE, http: 409, condition: "Refund attempted from EXHAUSTED or REFUNDED" }
  - { id: ERR_NO_CREDITS_AVAILABLE, http: 422, condition: "credits_remaining - reserved_count < 1 at session scheduling" }
  - { id: ERR_TRACK_MISMATCH, http: 422, condition: "Session scheduled against a GROUP package, or workshop enrollment for an INDIVIDUAL-track client" }
  - { id: ERR_CASELOAD_CAP_REACHED, http: 422, condition: "Plan acceptance when coach.active_caseload >= coach.caseload_cap" }
  - { id: ERR_COACH_SUPERVISION_DEFICIT, http: 422, condition: "Plan acceptance while coach.status == SUPERVISION_DEFICIT" }
  - { id: ERR_COACH_HAS_ACTIVE_PLANS, http: 409, condition: "Coach deactivation with active_caseload > 0" }
  - { id: ERR_COACH_DOUBLE_BOOKED, http: 409, condition: "Half-open overlap with another SCHEDULED session of the same coach (adjacency allowed)" }
  - { id: ERR_COACH_BUFFER_CONFLICT, http: 409, condition: "Session within 15-minute buffer of an OPEN/LOCKED workshop facilitated by the same coach (exactly 15 minutes clear is allowed)" }
  - { id: ERR_CADENCE_WINDOW_VIOLATION, http: 422, condition: "First session outside [0,14] days of activation, or gap outside [4,10] (WEEKLY) / [11,17] (BIWEEKLY) days inclusive" }
  - { id: ERR_SESSION_IN_PAST, http: 422, condition: "Session creation with scheduled_start <= now; workshop open with window_start <= now" }
  - { id: ERR_SESSION_ALREADY_STARTED, http: 422, condition: "Cancel attempted when now >= scheduled_start" }
  - { id: ERR_SESSION_NOT_STARTED, http: 422, condition: "Complete or mark-no-show attempted when now < scheduled_start" }
  - { id: ERR_CHECKIN_EXPIRED, http: 422, condition: "Check-in submit when now > due_at + 72h" }
  - { id: ERR_CONSENT_NOT_ACTIVE, http: 409, condition: "Note share without an ACTIVE ConsentGrant for (family, contact)" }
  - { id: ERR_CONSENT_EXPIRED, http: 409, condition: "Consent sign attempted when now >= expires_at" }
  - { id: ERR_CONSENT_SCOPE_INSUFFICIENT, http: 422, condition: "ACTIVE consent exists but its scope does not cover the note topic" }
  - { id: ERR_CONTACT_NOT_LINKED, http: 422, condition: "Contact belongs to a different family than the consent path family or the note's client" }
  - { id: ERR_WORKSHOP_NOT_OPEN, http: 409, condition: "Enrollment or drop while workshop not OPEN" }
  - { id: ERR_WORKSHOP_WINDOW_NOT_ENDED, http: 422, condition: "Workshop completion attempted before window_end" }
  - { id: ERR_DUPLICATE_ENROLLMENT, http: 409, condition: "Non-terminal enrollment already exists for (workshop, client)" }
  - { id: ERR_ENROLLMENT_NOT_DROPPABLE, http: 409, condition: "Drop attempted from DROPPED or REFUNDED" }
  - { id: ERR_SELF_SUPERVISION, http: 422, condition: "supervisor_coach_id == coach_id on supervision record creation" }
  - { id: ERR_CREDENTIAL_INSUFFICIENT, http: 403, condition: "Intake approval by ASSOCIATE coach; supervision record naming a non-SUPERVISOR supervisor" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PracticeAdmin
    description: "Practice operations administrator; manages families, coaches, packages, workshops, supervision verification, sweeps, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/families, /api/families/{id}/transition, /api/coaches, /api/coaches/{id}/transition"
      - "POST /api/families/{id}/packages, /api/packages/{id}/refund"
      - "POST /api/workshops, /api/workshops/{id}/transition"
      - "POST /api/coaches/{id}/supervision-records; supervision VERIFIED/CANCELLED transitions"
      - "POST /api/clients/{id}/transition"
      - "POST /api/_clock/set_current_utc, /api/admin/run-daily-sweep"
    shared_operations:
      - "All GET endpoints"
      - "POST /api/plans/{id}/transition to_state TERMINATED (shared with FamilyMember)"
      - "POST /api/families/{id}/clients, /api/clients/{id}/intakes (shared with FamilyMember)"
  - name: Coach
    description: "Coaching practitioner; reviews intakes, drafts and delivers plans, sessions, check-ins, notes, snapshots; a coach with credential_level SUPERVISOR also marks supervision records HELD"
    identity: "entity_backed:Coach"
    exclusive_operations:
      - "Intake UNDER_REVIEW / APPROVED / NEEDS_REVISION transitions (APPROVED requires CERTIFIED or SUPERVISOR)"
      - "POST /api/clients/{id}/plans; plan PROPOSED / COMPLETED transitions"
      - "POST /api/plans/{id}/goals, /api/goals/{id}/transition"
      - "POST /api/plans/{id}/sessions, /api/sessions/{id}/complete, /api/sessions/{id}/mark-no-show"
      - "POST /api/plans/{id}/checkins, /api/checkins/{id}/acknowledge"
      - "POST /api/clients/{id}/progress-snapshots"
      - "POST /api/clients/{id}/notes, /api/notes/{id}/transition, /api/notes/{id}/share"
      - "Supervision HELD transition (only the named supervisor_coach_id)"
    shared_operations:
      - "GET endpoints for clients, plans, sessions, check-ins, snapshots, notes, workshops, enrollments, packages, coaches"
      - "POST /api/sessions/{id}/cancel (shared with FamilyMember)"
  - name: FamilyMember
    description: "Parent/guardian acting for a household; owns intake submission, plan acceptance, payments, check-in submission, contacts and consents, workshop enrollment"
    identity: "entity_backed:Family"
    exclusive_operations:
      - "POST /api/families/{id}/payments"
      - "Intake create (shared with admin) and SUBMITTED / DRAFT(revise) transitions (exclusive)"
      - "Plan ACTIVE acceptance and PROPOSED -> DRAFT change requests"
      - "POST /api/checkins/{id}/submit"
      - "POST /api/families/{id}/contacts, /api/contacts/{id}/transition"
      - "POST /api/families/{id}/consents, /api/consents/{id}/transition"
      - "POST /api/workshops/{id}/enrollments, /api/enrollments/{id}/drop"
    shared_operations:
      - "GET endpoints for own family subtree, workshops, packages"
      - "POST /api/sessions/{id}/cancel (shared with Coach)"
      - "POST /api/plans/{id}/transition to_state TERMINATED (shared with PracticeAdmin)"
  - name: ExternalContact
    description: "School or clinician contact; sees exactly the notes shared with them that remain unsealed — consent-limited visibility"
    identity: "entity_backed:CoordinationContact"
    exclusive_operations:
      - "GET /api/contacts/{id}/shared-notes (self only)"
    shared_operations: []
