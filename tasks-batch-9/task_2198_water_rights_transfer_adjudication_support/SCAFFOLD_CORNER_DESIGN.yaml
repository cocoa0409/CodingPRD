            - {call: "POST /transfer-applications/${app}/injury-analyses", payload: {method: INSTANTANEOUS_DEPLETION, pod_move_miles: 4.00, return_flow_credit_af: 0.00}, as: WaterRightsAnalyst, captures: {ia_inst: "$.data.id"}}
