          The venue-scope check sits at priority 4, above every existence check, so a sommelier aiming
          at a foreign venue is refused with 403 even when the body also carries an unknown lot_id
          that would otherwise produce a 404. Its own venue's identical call still succeeds, proving
          the rule is scope-based rather than a blanket denial.
