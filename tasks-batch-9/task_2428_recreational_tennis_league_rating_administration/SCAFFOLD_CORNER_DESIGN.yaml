  - section: rbac
    instances:
      - name: committee_member_voting_on_its_own_appeal_returns_403_sod_interested_party
        claim_type: Segregation of duties
        grounds:
          - validations.priority_8_ERR_SOD_INTERESTED_PARTY
          - complexity_profile.role_model.segregation_of_duties
        distinguishing_aspect: "Roles here are entity-backed on Player, so the appellant can legitimately present the CommitteeMember role header — nothing about the role check is violated. The bar is on the identity behind the role: X-User-ID equals the appeal's player_id, so the same human would be both subject and judge. This is why the rule must be enforced on the (role, user id, subject) triple rather than on the role list, and why it must fire before the subject-status rule at priority 30."
        test_recipe:
          setup:
            - "The appellant's own appeal is UNDER_REVIEW, so the ballot is open and a disinterested member could vote. The appellant sends the ballot with the CommitteeMember role header and its own X-User-ID."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_pa1
            - *a_ra1
            - *a_chair
            - *a_cm1
            - *a_ap1
            - *a_ap1_review
          trigger:
            - call: "POST /tennis/committee-votes"
              payload: {subject_type: "RATING_APPEAL", subject_id: "${ap1_id}", vote: "SUPPORT", note: "I support my own appeal."}
              as: CommitteeMember
              as_user_id: "${pa1_id}"
          assert:
            - "HTTP 403"
            - "$.data.error_id == 'ERR_SOD_INTERESTED_PARTY'"
            - "$.data.error_id != 'ERR_ROLE_NOT_PERMITTED' because CommitteeMember is the role this endpoint requires"
            - "$.data.error_id != 'ERR_SUBJECT_NOT_UNDER_REVIEW' because the subject is UNDER_REVIEW"
            - "a follow-up GET /tennis/rating-appeals/${ap1_id} returns $.data.support_vote_count == 0 and $.data.oppose_vote_count == 0"
            - "a follow-up GET /tennis/players/${pa1_id}/committee-votes returns $.data.total_count == 0"
            - "the identical ballot sent with X-User-ID ${cm1_id} returns HTTP 201, proving only the interested identity was barred"

      - name: chair_deciding_an_appeal_it_voted_on_returns_403_chair_voted_on_subject
        claim_type: Segregation of duties
        grounds:
          - validations.priority_9_ERR_CHAIR_VOTED_ON_SUBJECT
          - complexity_profile.role_model.segregation_of_duties
        distinguishing_aspect: "The two steps of the appeal workflow — casting a ballot and pronouncing the decision — must be performed by different humans, and the check keys on the ballot's voter_player_id, not on the role header used at either step. The chair reached the quorum with its own SUPPORT ballot, so support_vote_count is 2 and the quorum rule at priority 55 is satisfied; only the segregation rule can reject, and a second chair who cast no ballot must be able to decide the very same appeal."
        test_recipe:
          setup:
            - "The appeal is UNDER_REVIEW with two SUPPORT ballots: one from an ordinary member and one cast by the chair itself wearing the CommitteeMember role header. A second chair exists who cast no ballot."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_pa1
            - *a_ra1
            - *a_chair
            - *a_cm1
            - &a_chair2
              call: "POST /tennis/players"
              payload: {section_id: "${sec_id}", full_name: "Dana Deputy", birth_year: 1968, gender: "F"}
              as: SectionAdmin
              captures: {chair2_id: "$.data.id"}
            - *a_ap1
            - *a_ap1_review
            - *a_vote1
            - &a_vote_chair
              call: "POST /tennis/committee-votes"
              payload: {subject_type: "RATING_APPEAL", subject_id: "${ap1_id}", vote: "SUPPORT", note: "Chair also supports."}
              as: CommitteeMember
              as_user_id: "${chair_id}"
              captures: {vote_chair_id: "$.data.id"}
          trigger:
            - call: "POST /tennis/rating-appeals/${ap1_id}/decide"
              payload: {outcome: "GRANT", decision_note: "Granting on the committee's recommendation."}
              as: CommitteeChair
              as_user_id: "${chair_id}"
          assert:
            - "HTTP 403"
            - "$.data.error_id == 'ERR_CHAIR_VOTED_ON_SUBJECT'"
            - "$.data.error_id != 'ERR_QUORUM_NOT_MET' because support_vote_count is 2 against 0 opposed"
            - "a follow-up GET /tennis/rating-appeals/${ap1_id} returns $.data.status == 'UNDER_REVIEW', $.data.support_vote_count == 2, $.data.decided_by_chair_player_id == null and $.data.granted_level == null"
            - "a follow-up GET /tennis/players/${pa1_id} returns $.data.rating_level == 3.5 and $.data.rating_type == 'COMPUTER_RATED'"
            - "the identical decide sent with X-User-ID ${chair2_id} returns HTTP 200 with $.data.status == 'GRANTED', $.data.granted_level == 4.0 and $.data.decided_by_chair_player_id == '${chair2_id}'"

      - name: player_creating_a_league_returns_403_role_not_permitted
        claim_type: Violation → Error
        grounds:
          - rbac.SectionAdmin.exclusive_operations
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "League creation is a SectionAdmin-exclusive operation, so a real, resolvable, non-disqualified Player is refused at the role gate (priority 4) before any payload validation runs — the trigger payload is deliberately well-formed and would create the league verbatim under the admin header. A 403 here, not a 401 (identity is fine) and not a 422 (the body is fine)."
        test_recipe:
          setup:
            - "A section exists with one ACTIVE player who presents the Player role header and its own X-User-ID."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_pa1
          trigger:
            - call: "POST /tennis/leagues"
              payload:
                section_id: "${sec_id}"
                parent_league_id: null
                tier: "SECTION"
                ntrp_level: 3.5
                age_group: "AGE_18_OVER"
                format: "MENS_DOUBLES"
                registration_opens_at: "2026-08-01T00:00:00Z"
                registration_closes_at: "2026-12-01T00:00:00Z"
                roster_lock_at: "2026-12-01T00:00:00Z"
                season_end_at: "2026-12-31T00:00:00Z"
              as: Player
              as_user_id: "${pa1_id}"
          assert:
            - "HTTP 403"
            - "$.data.error_id == 'ERR_ROLE_NOT_PERMITTED'"
            - "$.data.error_id != 'ERR_UNKNOWN_ROLE' because Player is one of the six declared roles"
            - "$.data.error_id != 'ERR_VALIDATION' because the role gate precedes payload validation"
            - "a follow-up GET /tennis/leagues with section_id=${sec_id} returns $.data.total_count == 0"
            - "the identical payload as SectionAdmin returns HTTP 201 with $.data.tier == 'SECTION' and $.data.status == 'DRAFT'"

      - name: captain_write_without_a_user_id_returns_401_missing_user_id
        claim_type: Violation → Error
        grounds:
          - errors[ERR_MISSING_USER_ID]
        distinguishing_aspect: "Captain is an entity_backed role, so the role header alone does not constitute an identity: with no X-User-ID the request cannot be attributed to a Player row and must 401 before the endpoint's own rules run. The second clause is separate and equally required — an X-User-ID that is syntactically fine but resolves to no Player row fails the same way, which distinguishes 'absent' from 'unresolvable'."
        test_recipe:
          setup:
            - "A league is open for registration and a facility exists, so the team creation below would otherwise succeed. The trigger sends X-User-Role: Captain with no X-User-ID header."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_fac
            - *a_lgp
            - *a_lgp_open
            - *a_lg
            - *a_lg_open
            - *a_pa1
            - *a_ra1
          trigger:
            - call: "POST /tennis/teams"
              payload: {league_id: "${lg_id}", name: "Headerless Hitters", home_facility_id: "${fac_id}"}
              as: Captain
              as_user_id: null
          assert:
            - "HTTP 401"
            - "$.data.error_id == 'ERR_MISSING_USER_ID'"
            - "$.data.error_id != 'ERR_MISSING_ROLE_HEADER' because the role header is present and valid"
            - "$.data.error_id != 'ERR_NOT_TEAM_CAPTAIN' because there is no identity to compare against yet"
            - "a follow-up GET /tennis/teams with league_id=${lg_id} returns $.data.total_count == 0"
            - "the same request with X-User-ID 00000000-0000-4000-8000-000000000000 also returns HTTP 401 with $.data.error_id == 'ERR_MISSING_USER_ID' because the id must resolve to a Player"
            - "the same request with X-User-ID ${pa1_id} returns HTTP 201 with $.data.captain_player_id == '${pa1_id}'"

      - name: player_rating_another_player_returns_403_not_self
        claim_type: Violation → Error
        grounds:
          - validations.priority_6_ERR_NOT_SELF
          - errors[ERR_NOT_SELF]
        distinguishing_aspect: "The ratings endpoint is shared between two roles with asymmetric scope: a LeagueCoordinator may write any player's rating, a Player only its own. The rule therefore cannot be expressed on the endpoint's role list at all — it compares X-User-ID against the path id, and it fires here even though the payload would be a legal SELF rating for the target, who is still UNRATED."
        test_recipe:
          setup:
            - "Two players exist in the section; the first is COMPUTER_RATED at 3.5 and the second is still UNRATED so a self-rating would be admissible for the target."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_pa1
            - *a_pa2
            - *a_ra1
          trigger:
            - call: "POST /tennis/players/${pa2_id}/ratings"
              payload: {source: "SELF", level: 3.0}
              as: Player
              as_user_id: "${pa1_id}"
          assert:
            - "HTTP 403"
            - "$.data.error_id == 'ERR_NOT_SELF'"
            - "$.data.error_id != 'ERR_ROLE_NOT_PERMITTED' because Player is listed on this endpoint"
            - "$.data.error_id != 'ERR_SELF_RATING_LOCKED' because the target is UNRATED and could be self-rated by its own owner"
            - "a follow-up GET /tennis/players/${pa2_id} returns $.data.rating_type == 'UNRATED', $.data.rating_level == null and $.data.self_rated_level == null"
            - "the identical call with X-User-ID ${pa2_id} returns HTTP 200 with $.data.rating_type == 'SELF_RATED' and $.data.self_rated_level == 3.0"
            - "the same path as LeagueCoordinator with source COMPUTER and level 3.0 returns HTTP 200, showing the scope restriction binds only the Player role"

      - name: captain_adding_a_spot_to_another_captains_team_returns_403_not_team_captain
        claim_type: Violation → Error
        grounds:
          - validations.priority_7_ERR_NOT_TEAM_CAPTAIN
          - errors[ERR_NOT_TEAM_CAPTAIN]
        distinguishing_aspect: "Captains are peers holding the same role over disjoint resources, so the guard is ownership rather than permission: the actor is a genuine Captain of its own team and the payload names a real player and the live version of the target team, yet Team.captain_player_id does not match X-User-ID. The check must precede the OCC and roster rules — an implementation ordering the version check first would answer 412 or 409 on a request that must never be considered at all."
        test_recipe:
          setup:
            - "Two DRAFT teams exist in the district league with different captains, and no roster spot has been added to either."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_fac
            - *a_lgp
            - *a_lgp_open
            - *a_lg
            - *a_lg_open
            - *a_pa1
            - *a_pa2
            - *a_ra1
            - *a_ra2
            - *a_tma
            - *a_pb1
            - *a_pb2
            - *a_rb1
            - *a_rb2
            - *a_tmb
          trigger:
            - call: "POST /tennis/roster-spots"
              payload: {team_id: "${tmb_id}", player_id: "${pb2_id}", expected_team_version: "${tmb_v0}"}
              as: Captain
              as_user_id: "${pa1_id}"
          assert:
            - "HTTP 403"
            - "$.data.error_id == 'ERR_NOT_TEAM_CAPTAIN'"
            - "$.data.error_id != 'ERR_STALE_TEAM_VERSION' because ${tmb_v0} is the live version of the target team"
            - "$.data.error_id != 'ERR_ROLE_NOT_PERMITTED' because Captain is the only role this endpoint accepts"
            - "a follow-up GET /tennis/roster-spots with team_id=${tmb_id} returns $.data.total_count == 0"
            - "a follow-up GET /tennis/teams/${tmb_id} returns $.data.version == ${tmb_v0} because a refused write bumps nothing"
            - "the identical payload with X-User-ID ${pb1_id} returns HTTP 201 with $.data.status == 'PENDING'"

      - name: disqualified_captain_write_returns_403_actor_disqualified
        claim_type: Violation → Error
        grounds:
          - validations.priority_5_ERR_ACTOR_DISQUALIFIED
          - errors[ERR_ACTOR_DISQUALIFIED]
        distinguishing_aspect: "Actor status is checked at priority 5, ahead of ownership at 7 and of every business rule: the actor still IS the captain of the target team and the payload is impeccable, but two SCORECARD_FALSIFICATION strikes carry weight 6 and reach the section's disqualification_strike_limit, which bars the human from writing anything as an entity-backed role. Reads stay open, and the team's own state is untouched by the refusal."
        test_recipe:
          setup:
            - "The captain of a DRAFT team has accumulated two weight-3 strikes, so strike_count is 6: the first crossed strike_limit 3 and suspended the captain, the second reached disqualification_strike_limit 6. The captain's own ACTIVE spot is already INELIGIBLE from the suspension cascade."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_fac
            - *a_lgp
            - *a_lgp_open
            - *a_lg
            - *a_lg_open
            - *a_pa1
            - *a_pa2
            - *a_ra1
            - *a_ra2
            - *a_tma
            - *a_xa1
            - *a_ya1
            - &a_strk_a1a
              call: "POST /tennis/strikes"
              payload: {player_id: "${pa1_id}", kind: "SCORECARD_FALSIFICATION", reason: "First falsification finding"}
              as: LeagueCoordinator
              captures: {strk_a1a_id: "$.data.id"}
            - &a_strk_a1b
              call: "POST /tennis/strikes"
              payload: {player_id: "${pa1_id}", kind: "SCORECARD_FALSIFICATION", reason: "Second falsification finding"}
              as: LeagueCoordinator
              captures: {strk_a1b_id: "$.data.id"}
            - &a_gta_disq
              call: "GET /tennis/teams/${tma_id}"
              as: LeagueCoordinator
              captures: {tma_v_disq: "$.data.version"}
          trigger:
            - call: "POST /tennis/roster-spots"
              payload: {team_id: "${tma_id}", player_id: "${pa2_id}", expected_team_version: "${tma_v_disq}"}
              as: Captain
              as_user_id: "${pa1_id}"
          assert:
            - "HTTP 403"
            - "$.data.error_id == 'ERR_ACTOR_DISQUALIFIED'"
            - "$.data.error_id != 'ERR_NOT_TEAM_CAPTAIN' because ${pa1_id} is still Team.captain_player_id"
            - "$.data.error_id != 'ERR_PLAYER_NOT_PLAYABLE' because the player being added is ACTIVE — that rule guards the target, this one guards the actor"
            - "a follow-up GET /tennis/players/${pa1_id} returns $.data.status == 'DISQUALIFIED' and $.data.strike_count == 6"
            - "a follow-up GET /tennis/roster-spots with team_id=${tma_id} returns $.data.total_count == 1 with items[0].status == 'INELIGIBLE' and items[0].ineligible_reason == 'PLAYER_SUSPENDED'"
            - "a follow-up GET /tennis/teams/${tma_id} returns $.data.version == ${tma_v_disq} and $.data.active_roster_size == 0"
            - "a follow-up GET /tennis/teams/${tma_id} as Captain with X-User-ID ${pa1_id} returns HTTP 200 because the bar covers write endpoints only"

      - name: single_player_read_is_shared_by_all_six_roles_while_the_collection_is_not
        claim_type: Satisfaction → Pass
        grounds:
          - rbac.Player.shared_operations
          - endpoints.GET /tennis/players/{id}
          - endpoints.GET /tennis/players
        distinguishing_aspect: "The RBAC matrix draws two different lines on the same entity and both must hold: every one of the six roles may read a single player, but the Player role is deliberately absent from the collection listing, and creation is shared by exactly two roles. A single blanket 'reads are open' shortcut passes the first clause and fails the other two."
        test_recipe:
          setup:
            - "A section with one registered player exists; the reader presents the CommitteeMember role with a resolvable X-User-ID."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_pa1
          trigger:
            - call: "GET /tennis/players/${pa1_id}"
              as: CommitteeMember
              as_user_id: "${pa1_id}"
          assert:
            - "HTTP 200"
            - "$.data.id == '${pa1_id}', $.data.full_name == 'Adam Ace', $.data.rating_type == 'UNRATED', $.data.status == 'ACTIVE'"
            - "the identical read as SectionAdmin, as LeagueCoordinator, as Captain with X-User-ID ${pa1_id}, as Player with X-User-ID ${pa1_id} and as CommitteeChair with X-User-ID ${pa1_id} each return HTTP 200 with the same body"
            - "GET /tennis/players as Player with X-User-ID ${pa1_id} returns HTTP 403 with $.data.error_id == 'ERR_ROLE_NOT_PERMITTED' because the collection listing omits the Player role"
            - "GET /tennis/players as LeagueCoordinator returns HTTP 200 with $.data.total_count == 1"
            - "POST /tennis/players as LeagueCoordinator with section_id ${sec_id} returns HTTP 201, and the identical creation as Captain with X-User-ID ${pa1_id} returns HTTP 403 with $.data.error_id == 'ERR_ROLE_NOT_PERMITTED'"

  - section: cross_cutting_complexity_layers
    instances:
      - name: roster_spot_write_with_the_pre_activation_team_version_returns_412_stale_team_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.roster-spot-create-stale-team
          - validations.priority_18_ERR_STALE_TEAM_VERSION
          - errors[ERR_STALE_TEAM_VERSION]
        distinguishing_aspect: "Two accepted writes have already advanced Team.version since the captured value: the spot creation and the activation that followed it. A client replaying the version it observed at team creation is deciding against a roster of size 0 that no longer exists, and the guard must fire before the roster-size and duplicate rules — the request is otherwise entirely legal, so any implementation that ignores the field would answer 201."
        test_recipe:
          setup:
            - "A DRAFT team has one ACTIVE roster spot; the team's version was captured at creation, then advanced twice — once by the spot creation and once by its activation."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_fac
            - *a_lgp
            - *a_lgp_open
            - *a_lg
            - *a_lg_open
            - *a_pa1
            - *a_pa2
            - *a_ra1
            - *a_ra2
            - *a_tma
            - *a_xa1
            - *a_ya1
          trigger:
            - call: "POST /tennis/roster-spots"
              payload: {team_id: "${tma_id}", player_id: "${pa2_id}", expected_team_version: "${tma_v0}"}
              as: Captain
              as_user_id: "${pa1_id}"
          assert:
            - "HTTP 412"
            - "$.data.error_id == 'ERR_STALE_TEAM_VERSION'"
            - "$.data.error_id != 'ERR_DUPLICATE_ROSTER_SPOT' because ${pa2_id} holds no spot in this league"
            - "$.data.error_id != 'ERR_ROSTER_SIZE_EXCEEDED' because max_roster_size is 14 and only one spot exists"
            - "a follow-up GET /tennis/roster-spots with team_id=${tma_id} returns $.data.total_count == 1"
            - "a follow-up GET /tennis/teams/${tma_id} returns $.data.version == ${tma_v0} + 2 and $.data.active_roster_size == 1, unchanged by the refusal"
            - "replaying the identical payload with expected_team_version taken from that read returns HTTP 201 with $.data.status == 'PENDING' and $.data.version == 1"

      - name: match_reschedule_with_the_creation_version_returns_412_stale_match_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.match-schedule-stale-match
          - validations.priority_19_ERR_STALE_MATCH_VERSION
          - errors[ERR_STALE_MATCH_VERSION]
        distinguishing_aspect: "The schedule endpoint is a self-loop that legitimately overwrites the slot it finds, so no state precondition can separate a valid reschedule from a lost update — only the version can. The trigger carries the version observed at fixture creation, which the first successful schedule call has already superseded, and the payload it carries is a slot that would otherwise be accepted."
        test_recipe:
          setup:
            - "A league is IN_PLAY with one fixture that has been scheduled once; the client still holds the version captured when the fixture was created."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_fac
            - *a_lgp
            - *a_lgp_open
            - *a_lg
            - *a_lg_open
            - *a_pa1
            - *a_pa2
            - *a_ra1
            - *a_ra2
            - *a_tma
            - *a_xa1
            - *a_ya1
            - *a_gta2
            - *a_xa2
            - *a_ya2
            - *a_rega
            - *a_pb1
            - *a_pb2
            - *a_rb1
            - *a_rb2
            - *a_tmb
            - *a_xb1
            - *a_yb1
            - *a_gtb2
            - *a_xb2
            - *a_yb2
            - *a_regb
            - *c_lock
            - *a_lock
            - *a_start
            - *a_mk1
            - *a_sh1
          trigger:
            - call: "POST /tennis/matches/${m1_id}/schedule"
              payload: {facility_id: "${fac_id}", scheduled_start_at: "2026-08-16T18:00:00Z", courts_required: 3, expected_match_version: "${m1_v0}"}
              as: LeagueCoordinator
          assert:
            - "HTTP 412"
            - "$.data.error_id == 'ERR_STALE_MATCH_VERSION'"
            - "$.data.error_id != 'ERR_MATCH_SCHEDULE_STATE_INVALID' because SCHEDULED -> SCHEDULED is a permitted self-loop"
            - "$.data.error_id != 'ERR_FACILITY_COURTS_EXCEEDED' because the superseded slot of this same match is excluded from the capacity sum, leaving all 6 courts free"
            - "a follow-up GET /tennis/matches/${m1_id} returns $.data.scheduled_start_at == '2026-08-15T18:00:00Z', $.data.schedule_status == 'SCHEDULED' and $.data.version == ${m1_v0} + 1"
            - "replaying the identical payload with expected_match_version == ${m1_v0} + 1 returns HTTP 200 with $.data.scheduled_start_at == '2026-08-16T18:00:00Z', $.data.scheduled_end_at == '2026-08-16T21:00:00Z' and $.data.version == ${m1_v0} + 2"

      - name: roster_spot_write_omitting_the_version_field_returns_400_missing_expected_version
        claim_type: optimistic_concurrency
        grounds:
          - validations.priority_17_ERR_MISSING_EXPECTED_VERSION
          - errors[ERR_MISSING_EXPECTED_VERSION]
        distinguishing_aspect: "Absence and staleness are distinct failures with distinct codes and are checked in that order: a missing OCC field is a malformed request at 400, not a precondition failure at 412. A client that simply drops the field must not be treated as if it had sent the current version, which is what an implementation defaulting the field would do."
        test_recipe:
          setup:
            - "A DRAFT team exists with one ACTIVE roster spot, so the current version is knowable but deliberately not sent."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_fac
            - *a_lgp
            - *a_lgp_open
            - *a_lg
            - *a_lg_open
            - *a_pa1
            - *a_pa2
            - *a_ra1
            - *a_ra2
            - *a_tma
            - *a_xa1
            - *a_ya1
          trigger:
            - call: "POST /tennis/roster-spots"
              payload: {team_id: "${tma_id}", player_id: "${pa2_id}"}
              as: Captain
              as_user_id: "${pa1_id}"
          assert:
            - "HTTP 400"
            - "$.data.error_id == 'ERR_MISSING_EXPECTED_VERSION'"
            - "$.data.error_id != 'ERR_STALE_TEAM_VERSION' and the status is not 412 — absence is checked at priority 17, before the equality test at 18"
            - "$.data.error_id != 'ERR_VALIDATION' because the OCC rules own this field"
            - "a follow-up GET /tennis/roster-spots with team_id=${tma_id} returns $.data.total_count == 1"
            - "a follow-up GET /tennis/teams/${tma_id} returns $.data.version == ${tma_v0} + 2, unchanged"

      - name: every_accepted_write_advances_the_team_version_while_reads_leave_it_alone
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.roster-spot-create-stale-team
          - endpoints.POST /tennis/roster-spots
          - entities.Team.version
        distinguishing_aspect: "The counter must move on every accepted mutation of the aggregate, including the ones that arrive through a child endpoint — the spot creation, its activation and a removal each bump the parent Team — while an arbitrary number of reads leave it untouched. Implementations that bump only on direct writes to /teams, or that bump once per request regardless of cascades, diverge here."
        test_recipe:
          setup:
            - "A DRAFT team has one ACTIVE spot; its version has been read back after the activation so the client holds the live value."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_fac
            - *a_lgp
            - *a_lgp_open
            - *a_lg
            - *a_lg_open
            - *a_pa1
            - *a_pa2
            - *a_ra1
            - *a_ra2
            - *a_tma
            - *a_xa1
            - *a_ya1
            - *a_gta2
          trigger:
            - call: "POST /tennis/roster-spots"
              payload: {team_id: "${tma_id}", player_id: "${pa2_id}", expected_team_version: "${tma_v2}"}
              as: Captain
              as_user_id: "${pa1_id}"
          assert:
            - "HTTP 201"
            - "$.data.status == 'PENDING' and $.data.version == 1 — the child carries its own counter, starting at 1"
            - "${tma_v2} == ${tma_v0} + 2, one bump for the first spot creation and one for its activation"
            - "a follow-up GET /tennis/teams/${tma_id} returns $.data.version == ${tma_v2} + 1 and $.data.active_roster_size == 1, because a PENDING spot bumps the version without counting as active"
            - "three further GET /tennis/teams/${tma_id} reads all return the same $.data.version, and GET /tennis/roster-spots with team_id=${tma_id} does not change it either"
            - "activating the new spot returns HTTP 200 and a follow-up read returns $.data.version == ${tma_v2} + 2 with $.data.active_roster_size == 2 and $.data.roster_compliant == true"
            - "removing that spot with DELETE /tennis/roster-spots returns HTTP 204 and a follow-up read returns $.data.version == ${tma_v2} + 3 with $.data.active_roster_size == 1"

      - name: verifying_one_scorecard_walks_the_whole_chain_from_card_to_league_counters
        claim_type: cascading_side_effects
        grounds:
