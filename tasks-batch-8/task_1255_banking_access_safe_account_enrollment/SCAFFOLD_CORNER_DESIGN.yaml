            - { call: "POST /api/referrals/${ref_id}/book", payload: { event_id: "${e1}" }, as: AgencyNavigator, as_user_id: "nav-1" }
          trigger:
            - { call: "POST /api/account-applications", payload: { participant_id: "${p_id}", institution_id: "${inst_id}", id_type_presented: "MATRICULA_CONSULAR", referral_id: "${ref_id}", event_id: "${e2}" }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { err: $.data.error_id } }
          assert:
            - "Create fails with error_id == ERR_REFERRAL_MISMATCH (event_id E2 != booked_event_id E1)"
            - "E1 booked_count remains 1 and referral remains BOOKED (no partial mutation)"

      - name: non_monotonic_clock_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Setting the logical clock backwards from the default 2026-05-01T00:00:00Z is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["empty database; clock at startup default"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: CoalitionAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION (400); subsequent reads still see 2026-05-01T00:00:00Z"

      - name: docs_complete_requires_verified_docs
        claim_type: violation_to_error
        grounds: [state_machines.Referral.DOCS_PENDING_to_DOCS_COMPLETE, "errors[ERR_DOCS_INCOMPLETE]"]
        distinguishing_aspect: "docs-complete on a referral whose participant lacks VERIFIED identity docs fails with ERR_DOCS_INCOMPLETE (422) and the referral stays DOCS_PENDING."
        test_recipe:
          setup: ["participant with identity doc SUBMITTED only; referral DOCS_PENDING"]
          setup_api_calls:
            - { call: "POST /api/participants", payload: { full_name: "Ana Ruiz", date_of_birth: "1990-04-12", contact_zip: "90001", prior_banking_record: "CLEAN", id_documents: [ { doc_type: "MATRICULA_CONSULAR", status: "SUBMITTED" }, { doc_type: "PROOF_OF_ADDRESS", status: "VERIFIED" } ] }, as: AgencyNavigator, as_user_id: "nav-1", captures: { p_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { participant_id: "${p_id}", created_via: "NAVIGATOR" }, as: AgencyNavigator, as_user_id: "nav-1", captures: { ref_id: $.data.id } }
          trigger:
            - { call: "POST /api/referrals/${ref_id}/docs-complete", payload: {}, as: AgencyNavigator, as_user_id: "nav-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DOCS_INCOMPLETE; Referral.${ref_id}.status remains DOCS_PENDING"

  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: referrals_list_pagination
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "List envelope honors limit/offset with total_count and has_more: 3 referrals, limit=2 -> 2 rows + has_more true; offset=2 -> 1 row + has_more false."
        test_recipe:
          setup: ["three participants each with one referral"]
          setup_api_calls:
            - { call: "POST /api/participants", payload: { full_name: "P One", date_of_birth: "1990-01-01", contact_zip: "90001", prior_banking_record: "CLEAN" }, as: AgencyNavigator, as_user_id: "nav-1", captures: { p1: $.data.id } }
            - { call: "POST /api/participants", payload: { full_name: "P Two", date_of_birth: "1990-01-02", contact_zip: "90001", prior_banking_record: "CLEAN" }, as: AgencyNavigator, as_user_id: "nav-1", captures: { p2: $.data.id } }
            - { call: "POST /api/participants", payload: { full_name: "P Three", date_of_birth: "1990-01-03", contact_zip: "90001", prior_banking_record: "CLEAN" }, as: AgencyNavigator, as_user_id: "nav-1", captures: { p3: $.data.id } }
            - { call: "POST /api/referrals", payload: { participant_id: "${p1}", created_via: "NAVIGATOR" }, as: AgencyNavigator, as_user_id: "nav-1" }
            - { call: "POST /api/referrals", payload: { participant_id: "${p2}", created_via: "NAVIGATOR" }, as: AgencyNavigator, as_user_id: "nav-1" }
            - { call: "POST /api/referrals", payload: { participant_id: "${p3}", created_via: "NAVIGATOR" }, as: AgencyNavigator, as_user_id: "nav-1" }
          trigger:
            - { call: "GET /api/referrals?limit=2&offset=0", payload: {}, as: CoalitionAdmin }
            - { call: "GET /api/referrals?limit=2&offset=2", payload: {}, as: CoalitionAdmin }
          assert:
            - "Page 1: response_type == array, data length 2, total_count == 3, has_more == true"
            - "Page 2: data length 1, total_count == 3, has_more == false"

