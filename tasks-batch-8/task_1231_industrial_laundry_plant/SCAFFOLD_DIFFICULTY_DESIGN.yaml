              as: PlantAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /plants/${p_id}/customers"
              payload: { name: "C", customer_kind: "HOSPITALITY", billing_mode: "RENTAL", chip_tracking_enabled: false, credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { c_id: $.data.id }
            - call: "PUT /customers/${c_id}/par-levels/${cat_id}"
              payload: { par_pieces: 10 }
              as: PlantAdmin
            - call: "POST /plants/${p_id}/routes"
              payload: { service_date: "2026-05-02", driver_name: "D1" }
              as: RouteDriver
              captures: { r1_id: $.data.id }
            - call: "POST /routes/${r1_id}/stops"
              payload: { customer_id: "${c_id}", sequence_index: 1, declared_soiled_weight_lb: 0.0 }
              as: RouteDriver
              captures: { s1_id: $.data.id }
            - call: "POST /routes/${r1_id}/dispatch"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s1_id}/arrive"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s1_id}/pickup"
              payload: { carts: [ { cart_tag: "CART-1", scale_weight_lb: 0.1 } ] }
              as: RouteDriver
            - call: "GET /stops/${s1_id}/carts"
              as: PlantOperator
              captures: { cart1_id: "$.data[0].id" }
            - call: "POST /carts/${cart1_id}/receive"
              payload: {}
              as: PlantOperator
            - call: "GET /customers/${c_id}"
              as: RouteDriver
              captures: { cust_ver1: $.data.version }
            - call: "POST /stops/${s1_id}/deliveries"
              payload: { category_id: "${cat_id}", pieces_promised: 5 }
              as: RouteDriver
              captures: { d5_id: $.data.id }
            - call: "POST /deliveries/${d5_id}/mark-delivered"
              payload: { pieces_delivered: 5, expected_customer_version: "${cust_ver1}" }
              as: RouteDriver
            - call: "GET /customers/${c_id}/par-levels"
              as: RouteDriver
              captures: { on_site_after_d5: "$.data[0].current_on_site_pieces" }
          trigger:
            - call: "POST /plants/${p_id}/routes"
              payload: { service_date: "2026-05-03", driver_name: "D1" }
              as: RouteDriver
              captures: { r2_id: $.data.id }
            - call: "POST /routes/${r2_id}/stops"
              payload: { customer_id: "${c_id}", sequence_index: 1, declared_soiled_weight_lb: 0.0 }
              as: RouteDriver
              captures: { s2_id: $.data.id }
            - call: "POST /routes/${r2_id}/dispatch"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s2_id}/arrive"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s2_id}/pickup"
              payload: { carts: [ { cart_tag: "CART-2", scale_weight_lb: 0.1 } ] }
              as: RouteDriver
            - call: "GET /stops/${s2_id}/carts"
              as: PlantOperator
              captures: { cart2_id: "$.data[0].id" }
            - call: "POST /carts/${cart2_id}/receive"
              payload: {}
              as: PlantOperator
            - call: "GET /customers/${c_id}"
              as: RouteDriver
              captures: { cust_ver2: $.data.version }
            - call: "POST /stops/${s2_id}/deliveries"
              payload: { category_id: "${cat_id}", pieces_promised: 1 }
              as: RouteDriver
              captures: { d4_id: $.data.id }
            - call: "POST /deliveries/${d4_id}/mark-delivered"
              payload: { pieces_delivered: 1, expected_customer_version: "${cust_ver2}" }
