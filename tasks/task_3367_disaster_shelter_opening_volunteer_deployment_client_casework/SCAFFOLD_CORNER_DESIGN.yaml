scaffold_corner_design:
  - section: entities
    instances:
      - name: region_not_found_returns_404
        claim_type: not_found
        grounds:
          - "entities.Region"
          - "errors[ERR_REGION_NOT_FOUND]"
        distinguishing_aspect: "A GET against an id that was never minted returns 404 with ERR_REGION_NOT_FOUND rather than an empty object."
        test_recipe:
          setup: ["empty database, only the logical clock exists"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NationalHQAdmin
          trigger:
            - call: "GET /api/v1/regions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NationalHQAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response is 404 with error_id == ERR_REGION_NOT_FOUND"

      - name: client_defaults_primary_client_null
        claim_type: defaults
        grounds:
          - "entities.Client.fields.primary_client_id"
          - "entities.Client.fields.household_size"
        distinguishing_aspect: "Omitting the optional primary_client_id on creation leaves it null while household_size is stored verbatim, proving the declared default is applied rather than an invented value."
        test_recipe:
          setup: ["region GL exists"]
          setup_api_calls:
            - call: "POST /api/v1/regions"
              payload: { code: "GL", name: "Great Lakes", state_codes: ["MI", "OH"], coordinator_user_id: "rc_gl", volunteer_pool_target: 40, authorized_agency_codes: ["SALVATION_ARMY"] }
              as: NationalHQAdmin
              captures: { reg_gl: $.data.id }
            - call: "POST /api/v1/clients"
              payload: { full_name: "Ana Lopez", household_size: 4, region_id: "${reg_gl}" }
              as: Caseworker
              captures: { cl_id: $.data.id, primary: $.data.primary_client_id }
          trigger:
            - call: "GET /api/v1/clients/${cl_id}"
              payload: {}
              as: Caseworker
              captures: { primary_read: $.data.primary_client_id, hh: $.data.household_size }
          assert:
            - "Client.${cl_id}.primary_client_id == null on both the create response and the subsequent read"
            - "Client.${cl_id}.household_size == 4"

      - name: client_household_members_reverse_lookup
        claim_type: parent_relationships
        grounds:
          - "entities.Client.fields.primary_client_id"
          - "entities.Client"
          - "validations[priority=3]"
        distinguishing_aspect: "The self-referential foreign key is reachable in reverse: two members attached to one head of household appear under that head's household-members list and not under anyone else's."
        test_recipe:
          setup: ["region GL, one head-of-household client and two attached household members"]
          setup_api_calls:
            - call: "POST /api/v1/regions"
              payload: { code: "GL", name: "Great Lakes", state_codes: ["MI", "OH"], coordinator_user_id: "rc_gl", volunteer_pool_target: 40, authorized_agency_codes: ["SALVATION_ARMY"] }
              as: NationalHQAdmin
              captures: { reg_gl: $.data.id }
            - call: "POST /api/v1/clients"
              payload: { full_name: "Ana Lopez", household_size: 4, region_id: "${reg_gl}" }
              as: Caseworker
              captures: { head: $.data.id }
            - call: "POST /api/v1/clients"
              payload: { full_name: "Luis Lopez", household_size: 1, region_id: "${reg_gl}", primary_client_id: "${head}" }
              as: Caseworker
              captures: { m1: $.data.id }
            - call: "POST /api/v1/clients"
              payload: { full_name: "Mia Lopez", household_size: 1, region_id: "${reg_gl}", primary_client_id: "${head}" }
              as: Caseworker
              captures: { m2: $.data.id }
          trigger:
            - call: "GET /api/v1/clients"
              payload: { primary_client_id: "${head}" }
              as: Caseworker
              captures: { first_member: "$.data[0].id", second_member: "$.data[1].id" }
          assert:
            - "the filtered list for primary_client_id ${head} contains exactly the two members ${m1} and ${m2}"
            - "the head ${head} is not itself returned by that filter"

      - name: volunteer_create_rejects_undeclared_field
        claim_type: type_constraints
        grounds:
          - "entities.Volunteer.fields.credential_status"
          - "validations[priority=1]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "A client-supplied credential_status on creation is rejected as an undeclared field instead of being silently honoured, so computed fields can never be seeded through the write surface."
        test_recipe:
          setup: ["region GL exists"]
          setup_api_calls:
            - call: "POST /api/v1/regions"
              payload: { code: "GL", name: "Great Lakes", state_codes: ["MI", "OH"], coordinator_user_id: "rc_gl", volunteer_pool_target: 40, authorized_agency_codes: ["SALVATION_ARMY"] }
              as: NationalHQAdmin
              captures: { reg_gl: $.data.id }
          trigger:
            - call: "POST /api/v1/volunteers"
              payload: { full_name: "Dana Ruiz", home_region_id: "${reg_gl}", qualified_role_codes: ["SHELTER_MANAGER"], credential_status: "ACTIVE" }
              as: RegionalCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "the response is 400 with error_id == ERR_INVALID_REQUEST"
            - "no Volunteer row is created"

      - name: shelter_site_pagination_second_page
        claim_type: listing
        grounds:
          - "entities.ShelterSite"
          - "response_envelope.pagination_defaults"
        distinguishing_aspect: "Paging a filtered sub-resource list with limit=1 returns one site per page and the second page returns a different site, so offset paging is honoured rather than ignored."
        test_recipe:
          setup: ["region GL with two shelter sites A and B"]
          setup_api_calls:
            - call: "POST /api/v1/regions"
              payload: { code: "GL", name: "Great Lakes", state_codes: ["MI", "OH"], coordinator_user_id: "rc_gl", volunteer_pool_target: 40, authorized_agency_codes: ["SALVATION_ARMY"] }
              as: NationalHQAdmin
              captures: { reg_gl: $.data.id }
            - call: "POST /api/v1/shelter-sites"
              payload: { facility_name: "Lincoln High", address_line: "1 Main St", region_id: "${reg_gl}", capacity_beds: 8, accessibility_rating: "FULL", functional_needs_support: true, generator_onsite: true, agreement_expires_at: "2027-09-01T00:00:00Z" }
              as: RegionalCoordinator
              captures: { site_a: $.data.id }
            - call: "POST /api/v1/shelter-sites"
              payload: { facility_name: "Roosevelt Gym", address_line: "2 Oak St", region_id: "${reg_gl}", capacity_beds: 12, accessibility_rating: "PARTIAL", functional_needs_support: false, generator_onsite: true, agreement_expires_at: "2027-09-01T00:00:00Z" }
              as: RegionalCoordinator
              captures: { site_b: $.data.id }
          trigger:
            - call: "GET /api/v1/regions/${reg_gl}/shelter-sites"
              payload: { limit: 1, offset: 0 }
              as: RegionalCoordinator
              captures: { page0: "$.data[0].id" }
            - call: "GET /api/v1/regions/${reg_gl}/shelter-sites"
              payload: { limit: 1, offset: 1 }
              as: RegionalCoordinator
              captures: { page1: "$.data[0].id" }
          assert:
            - "page 0 returns exactly one site and page 1 returns exactly one site"
            - "the two pages return different ids drawn from {${site_a}, ${site_b}}"

      - name: shelter_registration_bed_selector_lowest_code
        claim_type: computed_fields
        grounds:
          - "calculations.dormitory_bed_assignment"
          - "entities.ShelterRegistration.fields.dormitory_bed_code"
        distinguishing_aspect: "Omitting requested_bed_code makes the server assign the lowest-ranked eligible code B-001 on the first registration and B-002 on the second, proving the computed field is server-derived rather than echoed from input."
        test_recipe:
          setup: ["region GL, operation DR-9101, APPROVED site with 2 verified beds, shelter OPEN with one ARRIVED volunteer, two clients"]
          setup_api_calls:
            - call: "POST /api/v1/regions"
              payload: { code: "GL", name: "Great Lakes", state_codes: ["MI", "OH"], coordinator_user_id: "rc_gl", volunteer_pool_target: 40, authorized_agency_codes: ["SALVATION_ARMY"] }
              as: NationalHQAdmin
              captures: { reg_gl: $.data.id }
            - call: "POST /api/v1/disaster-relief-operations"
              payload: { incident_code: "DR-9101", incident_type: "FLOOD", declared_at: "2026-09-02T00:00:00Z", region_id: "${reg_gl}" }
              as: RegionalCoordinator
              captures: { op_id: $.data.id }
            - call: "POST /api/v1/shelter-sites"
              payload: { facility_name: "Two Bed Hall", address_line: "3 Main St", region_id: "${reg_gl}", capacity_beds: 2, accessibility_rating: "FULL", functional_needs_support: true, generator_onsite: true, agreement_expires_at: "2027-09-01T00:00:00Z" }
              as: RegionalCoordinator
              captures: { site_id: $.data.id, site_v: $.data.version }
            - call: "POST /api/v1/shelter-sites/${site_id}/inspections"
              payload: { expected_shelter_site_version: "${site_v}", inspected_at: "2026-09-02T12:00:00Z", inspector_user_id: "rc_gl", capacity_verified_beds: 2, accessibility_verified: true, functional_needs_verified: true, deficiency_count: 0, result: "PASS" }
              as: RegionalCoordinator
            - call: "POST /api/v1/volunteers"
              payload: { full_name: "Dana Ruiz", home_region_id: "${reg_gl}", qualified_role_codes: ["SHELTER_MANAGER"] }
              as: RegionalCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /api/v1/volunteers/${vol_id}/credential-refresh"
              payload: {}
              as: RegionalCoordinator
            - call: "POST /api/v1/shelter-operations"
              payload: { shelter_site_id: "${site_id}", disaster_relief_operation_id: "${op_id}" }
              as: RegionalCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /api/v1/volunteer-deployments"
              payload: { volunteer_id: "${vol_id}", disaster_relief_operation_id: "${op_id}", shelter_operation_id: "${so_id}", role_code: "SHELTER_MANAGER", travel_mode: "AIR", rotation_start_at: "2026-09-03T00:00:00Z", rotation_days: 14 }
              as: RegionalCoordinator
              captures: { dep_id: $.data.id }
            - call: "POST /api/v1/volunteer-deployments/${dep_id}/approve"
              payload: {}
              as: RegionalCoordinator
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NationalHQAdmin
            - call: "POST /api/v1/shelter-operations/${so_id}/open"
              payload: {}
              as: RegionalCoordinator
            - call: "POST /api/v1/clients"
              payload: { full_name: "Ana Lopez", household_size: 2, region_id: "${reg_gl}" }
              as: ShelterManager
              captures: { cl1: $.data.id }
            - call: "POST /api/v1/clients"
              payload: { full_name: "Ben Okafor", household_size: 1, region_id: "${reg_gl}" }
              as: ShelterManager
              captures: { cl2: $.data.id }
          trigger:
            - call: "POST /api/v1/shelter-operations/${so_id}/registrations"
              payload: { client_id: "${cl1}", occupied_from_at: "2026-09-03T20:00:00Z", functional_needs_flag: false }
              as: ShelterManager
              captures: { bed1: $.data.dormitory_bed_code }
            - call: "POST /api/v1/shelter-operations/${so_id}/registrations"
              payload: { client_id: "${cl2}", occupied_from_at: "2026-09-03T20:00:00Z", functional_needs_flag: false }
              as: ShelterManager
              captures: { bed2: $.data.dormitory_bed_code }
          assert:
            - "the first registration has dormitory_bed_code == B-001"
            - "the second registration has dormitory_bed_code == B-002"

      - name: shelter_registration_requires_known_client
        claim_type: creation
        grounds:
          - "entities.ShelterRegistration"
          - "errors[ERR_CLIENT_NOT_FOUND]"
          - "validations[priority=3]"
        distinguishing_aspect: "Creating a registration for an id that was never minted fails on the existence check before any capacity or posture logic runs."
        test_recipe:
          setup: ["region GL, operation DR-9101, APPROVED site, shelter OPEN with one ARRIVED volunteer"]
          setup_api_calls:
            - call: "POST /api/v1/regions"
              payload: { code: "GL", name: "Great Lakes", state_codes: ["MI", "OH"], coordinator_user_id: "rc_gl", volunteer_pool_target: 40, authorized_agency_codes: ["SALVATION_ARMY"] }
              as: NationalHQAdmin
              captures: { reg_gl: $.data.id }
            - call: "POST /api/v1/disaster-relief-operations"
              payload: { incident_code: "DR-9101", incident_type: "FLOOD", declared_at: "2026-09-02T00:00:00Z", region_id: "${reg_gl}" }
              as: RegionalCoordinator
              captures: { op_id: $.data.id }
            - call: "POST /api/v1/shelter-sites"
              payload: { facility_name: "Lincoln High", address_line: "1 Main St", region_id: "${reg_gl}", capacity_beds: 8, accessibility_rating: "FULL", functional_needs_support: true, generator_onsite: true, agreement_expires_at: "2027-09-01T00:00:00Z" }
              as: RegionalCoordinator
              captures: { site_id: $.data.id, site_v: $.data.version }
            - call: "POST /api/v1/shelter-sites/${site_id}/inspections"
              payload: { expected_shelter_site_version: "${site_v}", inspected_at: "2026-09-02T12:00:00Z", inspector_user_id: "rc_gl", capacity_verified_beds: 8, accessibility_verified: true, functional_needs_verified: true, deficiency_count: 0, result: "PASS" }
              as: RegionalCoordinator
            - call: "POST /api/v1/volunteers"
              payload: { full_name: "Dana Ruiz", home_region_id: "${reg_gl}", qualified_role_codes: ["SHELTER_MANAGER"] }
              as: RegionalCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /api/v1/volunteers/${vol_id}/credential-refresh"
              payload: {}
              as: RegionalCoordinator
            - call: "POST /api/v1/shelter-operations"
              payload: { shelter_site_id: "${site_id}", disaster_relief_operation_id: "${op_id}" }
              as: RegionalCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /api/v1/volunteer-deployments"
              payload: { volunteer_id: "${vol_id}", disaster_relief_operation_id: "${op_id}", shelter_operation_id: "${so_id}", role_code: "SHELTER_MANAGER", travel_mode: "AIR", rotation_start_at: "2026-09-03T00:00:00Z", rotation_days: 14 }
              as: RegionalCoordinator
              captures: { dep_id: $.data.id }
            - call: "POST /api/v1/volunteer-deployments/${dep_id}/approve"
              payload: {}
              as: RegionalCoordinator
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NationalHQAdmin
            - call: "POST /api/v1/shelter-operations/${so_id}/open"
              payload: {}
              as: RegionalCoordinator
          trigger:
            - call: "POST /api/v1/shelter-operations/${so_id}/registrations"
              payload: { client_id: "00000000-0000-4000-8000-000000000000", occupied_from_at: "2026-09-03T20:00:00Z", functional_needs_flag: false }
              as: ShelterManager
              captures: { err: $.data.error_id }
          assert:
            - "the response is 404 with error_id == ERR_CLIENT_NOT_FOUND"
            - "ShelterOperation.${so_id}.occupied_beds stays 0"

      - name: registration_requires_known_shelter_operation
        claim_type: creation
        grounds:
          - "errors[ERR_SHELTER_OPERATION_NOT_FOUND]"
          - "validations[priority=3]"
        distinguishing_aspect: "The path identifier is validated left to right, so an unknown shelter operation is reported before the body client_id is even considered."
        test_recipe:
          setup: ["region GL with one client"]
          setup_api_calls:
            - call: "POST /api/v1/regions"
              payload: { code: "GL", name: "Great Lakes", state_codes: ["MI", "OH"], coordinator_user_id: "rc_gl", volunteer_pool_target: 40, authorized_agency_codes: ["SALVATION_ARMY"] }
              as: NationalHQAdmin
              captures: { reg_gl: $.data.id }
            - call: "POST /api/v1/clients"
              payload: { full_name: "Ana Lopez", household_size: 4, region_id: "${reg_gl}" }
              as: Caseworker
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /api/v1/shelter-operations/00000000-0000-4000-8000-000000000000/registrations"
              payload: { client_id: "00000000-0000-4000-8000-000000000000", occupied_from_at: "2026-09-03T20:00:00Z", functional_needs_flag: false }
              as: ShelterManager
              captures: { err: $.data.error_id }
          assert:
            - "the response is 404 with error_id == ERR_SHELTER_OPERATION_NOT_FOUND, the leftmost unresolvable identifier"

  - section: state_machines
    instances:
      - name: shelter_operation_starts_pending_open
        claim_type: initial_state
        grounds:
          - "state_machines.ShelterOperation.initial_state"
          - "entities.ShelterOperation.fields.posture"
        distinguishing_aspect: "A freshly created shelter operation is PENDING_OPEN and reports zeroed occupancy and staffing, so no child operation is admitted before the open call."
        test_recipe:
          setup: ["region GL, operation DR-9101, APPROVED shelter site"]
          setup_api_calls:
            - call: "POST /api/v1/regions"
              payload: { code: "GL", name: "Great Lakes", state_codes: ["MI", "OH"], coordinator_user_id: "rc_gl", volunteer_pool_target: 40, authorized_agency_codes: ["SALVATION_ARMY"] }
              as: NationalHQAdmin
              captures: { reg_gl: $.data.id }
            - call: "POST /api/v1/disaster-relief-operations"
              payload: { incident_code: "DR-9101", incident_type: "FLOOD", declared_at: "2026-09-02T00:00:00Z", region_id: "${reg_gl}" }
              as: RegionalCoordinator
              captures: { op_id: $.data.id }
            - call: "POST /api/v1/shelter-sites"
              payload: { facility_name: "Lincoln High", address_line: "1 Main St", region_id: "${reg_gl}", capacity_beds: 8, accessibility_rating: "FULL", functional_needs_support: true, generator_onsite: true, agreement_expires_at: "2027-09-01T00:00:00Z" }
              as: RegionalCoordinator
              captures: { site_id: $.data.id, site_v: $.data.version }
            - call: "POST /api/v1/shelter-sites/${site_id}/inspections"
              payload: { expected_shelter_site_version: "${site_v}", inspected_at: "2026-09-02T12:00:00Z", inspector_user_id: "rc_gl", capacity_verified_beds: 8, accessibility_verified: true, functional_needs_verified: true, deficiency_count: 0, result: "PASS" }
              as: RegionalCoordinator
          trigger:
            - call: "POST /api/v1/shelter-operations"
              payload: { shelter_site_id: "${site_id}", disaster_relief_operation_id: "${op_id}" }
              as: RegionalCoordinator
              captures: { so_id: $.data.id, posture: $.data.posture, occupied: $.data.occupied_beds, suff: $.data.staffing_sufficiency }
          assert:
            - "ShelterOperation.${so_id}.posture == PENDING_OPEN"
            - "ShelterOperation.${so_id}.occupied_beds == 0 and registered_client_count == 0 and staffed_volunteer_count == 0"
            - "ShelterOperation.${so_id}.staffing_sufficiency == 0.0000 and opened_at == null"

      - name: closed_shelter_rejects_reopen
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.ShelterOperation.terminal_states"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "CLOSED is terminal for a shelter operation: re-issuing the open action on a closed shelter is rejected rather than silently reopening it."
        test_recipe:
          setup: ["region GL, operation DR-9101 in DEMOBILIZATION, APPROVED site, shelter OPEN with one ARRIVED volunteer and zero registered clients"]
          setup_api_calls:
            - call: "POST /api/v1/regions"
              payload: { code: "GL", name: "Great Lakes", state_codes: ["MI", "OH"], coordinator_user_id: "rc_gl", volunteer_pool_target: 40, authorized_agency_codes: ["SALVATION_ARMY"] }
              as: NationalHQAdmin
              captures: { reg_gl: $.data.id }
            - call: "POST /api/v1/disaster-relief-operations"
              payload: { incident_code: "DR-9101", incident_type: "FLOOD", declared_at: "2026-09-02T00:00:00Z", region_id: "${reg_gl}" }
              as: RegionalCoordinator
              captures: { op_id: $.data.id }
            - call: "POST /api/v1/shelter-sites"
              payload: { facility_name: "Lincoln High", address_line: "1 Main St", region_id: "${reg_gl}", capacity_beds: 8, accessibility_rating: "FULL", functional_needs_support: true, generator_onsite: true, agreement_expires_at: "2027-09-01T00:00:00Z" }
              as: RegionalCoordinator
              captures: { site_id: $.data.id, site_v: $.data.version }
            - call: "POST /api/v1/shelter-sites/${site_id}/inspections"
              payload: { expected_shelter_site_version: "${site_v}", inspected_at: "2026-09-02T12:00:00Z", inspector_user_id: "rc_gl", capacity_verified_beds: 8, accessibility_verified: true, functional_needs_verified: true, deficiency_count: 0, result: "PASS" }
              as: RegionalCoordinator
            - call: "POST /api/v1/volunteers"
              payload: { full_name: "Dana Ruiz", home_region_id: "${reg_gl}", qualified_role_codes: ["SHELTER_MANAGER"] }
              as: RegionalCoordinator
              captures: { vol_id: $.data.id }
            - call: "POST /api/v1/volunteers/${vol_id}/credential-refresh"
              payload: {}
              as: RegionalCoordinator
            - call: "POST /api/v1/shelter-operations"
              payload: { shelter_site_id: "${site_id}", disaster_relief_operation_id: "${op_id}" }
              as: RegionalCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /api/v1/volunteer-deployments"
              payload: { volunteer_id: "${vol_id}", disaster_relief_operation_id: "${op_id}", shelter_operation_id: "${so_id}", role_code: "SHELTER_MANAGER", travel_mode: "AIR", rotation_start_at: "2026-09-03T00:00:00Z", rotation_days: 14 }
              as: RegionalCoordinator
              captures: { dep_id: $.data.id }
            - call: "POST /api/v1/volunteer-deployments/${dep_id}/approve"
              payload: {}
              as: RegionalCoordinator
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NationalHQAdmin
            - call: "POST /api/v1/shelter-operations/${so_id}/open"
              payload: {}
              as: RegionalCoordinator
            - call: "POST /api/v1/disaster-relief-operations/${op_id}/advance-phase"
              payload: {}
              as: RegionalCoordinator
            - call: "POST /api/v1/disaster-relief-operations/${op_id}/advance-phase"
              payload: {}
              as: RegionalCoordinator
            - call: "POST /api/v1/shelter-operations/${so_id}/close"
              payload: {}
              as: RegionalCoordinator
              captures: { posture_closed: $.data.posture }
          trigger:
            - call: "POST /api/v1/shelter-operations/${so_id}/open"
              payload: {}
              as: RegionalCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "ShelterOperation.${so_id}.posture == CLOSED before the trigger"
            - "the reopen attempt returns 409 with error_id ERR_ALREADY_TERMINAL or ERR_INVALID_STATE"
            - "ShelterOperation.${so_id}.posture is still CLOSED afterwards"

      - name: deployment_double_approve_rejected
        claim_type: idempotency
        grounds:
          - "state_machines.VolunteerDeployment.REQUESTED_to_APPROVED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Repeating the approve action on an already APPROVED deployment is rejected instead of re-pricing travel or double-counting the volunteer, so the transition is not idempotent by design."
        test_recipe:
          setup: ["region GL, operation DR-9101, APPROVED site, one ACTIVE/AVAILABLE volunteer, one REQUESTED deployment"]
          setup_api_calls:
            - call: "POST /api/v1/regions"
