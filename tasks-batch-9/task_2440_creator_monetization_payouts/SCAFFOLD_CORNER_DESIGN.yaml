          - "constants[FUND_GUARANTEED_FLOOR_CENTS]"
        distinguishing_aspect: "max_allocation_cents 4999 is legal for a PRO_RATA_WATCH_TIME fund and illegal for GUARANTEED_FLOOR_WATERFALL, because rule 65 compares it against FUND_GUARANTEED_FLOOR_CENTS 5000 only for that methodology."
        test_recipe:
