              as_user_id: "${tech1_id}"
              captures: { e_inspect: $.data.error_id }
            - call: "GET /duct-sealing/leakage-tests/${pre1_id}"
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { still_accepted: $.data.status }
          assert:
            - "${e_review} == ERR_UNAUTHORIZED with HTTP 403 — review is QAVerifier-exclusive, and the 403 precedes the ERR_LEAKAGE_TEST_INVALID_STATE the same call would have earned from an ACCEPTED test at priority 60"
            - "${e_masks} == ERR_UNAUTHORIZED with HTTP 403: masking is FieldTechnician-exclusive"
            - "${e_report} == ERR_UNAUTHORIZED with HTTP 403: drafting a report is QAVerifier-exclusive, even for the ProgramAdmin who owns the programme"
            - "${e_tech_create} == ERR_UNAUTHORIZED with HTTP 403: a technician cannot enrol technicians"
            - "${e_claim_create} == ERR_UNAUTHORIZED with HTTP 403 — the 403 (priority 20) beats the ERR_VERIFICATION_REPORT_NOT_FOUND (priority 40) that the bogus report id would otherwise raise"
            - "${e_inspect} == ERR_UNAUTHORIZED with HTTP 403 for the same reason, on an unknown claim id"
            - "${still_accepted} == ACCEPTED and reviewed_by_user_id is unchanged: none of the six refusals mutated anything, and the shared GET still answers the rejected caller with HTTP 200"
            - "GET /duct-sealing/rebate-claims returns total_count == 0 and GET /duct-sealing/verification-reports returns total_count == 0"

      - name: the_technician_who_measured_may_not_review_the_measurement
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=30]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - state_machines.LeakageTest[RECORDED->ACCEPTED]
        distinguishing_aspect: "Pair (a) of the priority-30 rule. The trap is that the check is on X-User-ID ONLY: the call below carries the correct X-User-Role (QAVerifier, so priority 20 passes) but the technician's own X-User-ID, and must still be refused. Re-running the identical request under a different X-User-ID then succeeds, proving the refusal keyed on identity rather than on role or payload."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; a PRE leakage test on AHU-1 in RECORDED state, measured at 300.0 CFM by ${tech1_id}"
