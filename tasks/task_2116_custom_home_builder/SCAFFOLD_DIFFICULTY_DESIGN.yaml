  # ===========================================================================
  # Rule 7 - Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: task_release_gated_by_driving_allowance_item_lock
        grounds:
          - state_machines.ScheduleTask.PLANNED_to_RELEASED
          - state_machines.AllowanceItem.SELECTED_to_LOCKED
          - calculations.schedule_material_readiness
          - errors[ERR_ALLOWANCE_NOT_LOCKED]
          - entities.ScheduleTask.fields.driving_allowance_item_id
        distinguishing_aspect: |
          Entity pair = (ScheduleTask, AllowanceItem): the task's PLANNED -> RELEASED transition is
          refused with ERR_ALLOWANCE_NOT_LOCKED while its driving allowance item is OPEN, and
          becomes legal only once that item reaches LOCKED and material_ready_at
          2026-08-24T00:00:00.000Z falls on or before planned_start 2026-09-01T00:00:00.000Z.
        test_recipe:
          setup:
            - "Project is UNDER_CONSTRUCTION and the logical clock still reads its 2026-08-01T00:00:00.000Z default."
            - "AllowanceItem CABINETRY with allowance_amount 25000.00 is OPEN."
            - "ScheduleTask 'Cabinet install' is PLANNED over 2026-09-01..2026-10-15 with driving_allowance_item_id pointing at that item."
          setup_api_calls:
            - call: "POST /clients"
