      - name: state_beats_token_overdraw_on_reconcile
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Pair state (priority 6, ERR_INVALID_STATE) vs business_fiscal (priority 11,
          ERR_TOKEN_OVERDRAW): reconciling an already-RECONCILED redemption whose token_count would
          also overdraw the batch returns ERR_INVALID_STATE (priority 6 wins over the fiscal cap).
