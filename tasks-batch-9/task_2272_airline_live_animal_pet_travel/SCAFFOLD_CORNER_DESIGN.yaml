          setup:
            - "Container CABIN-S 35 x 25 x 28, tare 2, ventilation 10 pct over 2 sides, wheels removable, cabin eligible"
            - "A CABIN reservation with is_service_animal_booking true whose animal_kind is SERVICE_ANIMAL (height 20, length 30, declared 8, age 40 weeks) and whose behavior_attestation_on_file was left at its false default"
            - "The animal is screened and comes out COMPLIANT: required height 28, required length 35, required ventilation 10 pct, required 2 ventilated sides, gross weight 10 within the 12 kg cabin cap"
