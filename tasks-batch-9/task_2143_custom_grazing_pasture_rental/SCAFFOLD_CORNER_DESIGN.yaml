        distinguishing_aspect: "Omitting min_days, shrink_pct, out_shrink_pct, treatment_cost_split_pct, infrastructure_owner_cap_cents and death_loss_threshold_pct yields 60, 0, 0, 0, 100000 and 2.0 respectively."
