  # =================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: reconfigure_stale_project_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[project-reconfigure-stale-version]"
          - "errors[ERR_STALE_PROJECT_VERSION]"
        distinguishing_aspect: "After one successful reconfigure advances ResearchProject.version, a second reconfigure still carrying the originally-observed version is rejected with ERR_STALE_PROJECT_VERSION (412)."
        test_recipe:
          setup:
            - "DRAFT project; version observed at create; one successful reconfigure already applied (version advanced)"
          setup_api_calls:
            - call: "POST /genealogy/clients"
              payload: { name: "E20 C", email: "e20@x.com" }
              as: ProjectManager
              captures: { client_id: $.data.id }
            - call: "POST /genealogy/researchers"
              payload: { name: "E20 R", email: "e20r@x.com", hourly_rate_cents: 9000 }
              as: ProjectManager
              captures: { researcher_id: $.data.id }
            - call: "POST /genealogy/projects"
              payload: { client_id: "${client_id}", lead_researcher_id: "${researcher_id}", title: "P", objective: "obj", package_type: "BASIC_PACKAGE", package_price_cents: 100000, budget_hours: 10 }
              as: ProjectManager
              captures: { project_id: $.data.id, p_v: $.data.version }
            - call: "POST /genealogy/projects/${project_id}/reconfigure"
              payload: { expected_project_version: "${p_v}", budget_hours: 12 }
              as: ProjectManager
          trigger:
            - call: "POST /genealogy/projects/${project_id}/reconfigure"
              payload: { expected_project_version: "${p_v}", budget_hours: 15 }
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_PROJECT_VERSION"

      - name: reconfigure_with_current_version_succeeds_and_bumps_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[project-reconfigure-stale-version]"
          - "entities.ResearchProject.fields.budget_hours"
        distinguishing_aspect: "A reconfigure carrying the current version succeeds, updates budget_hours, and increments ResearchProject.version from 1 to 2."
        test_recipe:
          setup:
            - "DRAFT project at version 1"
          setup_api_calls:
            - call: "POST /genealogy/clients"
              payload: { name: "E21 C", email: "e21@x.com" }
              as: ProjectManager
              captures: { client_id: $.data.id }
            - call: "POST /genealogy/researchers"
              payload: { name: "E21 R", email: "e21r@x.com", hourly_rate_cents: 9000 }
              as: ProjectManager
              captures: { researcher_id: $.data.id }
            - call: "POST /genealogy/projects"
              payload: { client_id: "${client_id}", lead_researcher_id: "${researcher_id}", title: "P", objective: "obj", package_type: "BASIC_PACKAGE", package_price_cents: 100000, budget_hours: 10 }
              as: ProjectManager
              captures: { project_id: $.data.id, p_v: $.data.version }
          trigger:
            - call: "POST /genealogy/projects/${project_id}/reconfigure"
              payload: { expected_project_version: "${p_v}", budget_hours: 20 }
              as: ProjectManager
          assert:
            - "ResearchProject.${project_id}.budget_hours == 20"
            - "ResearchProject.${project_id}.version == 2"

