  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency
  # Every instance pairs the refusal with the same call succeeding once the OTHER
  # entity's state changes, so the dependency direction is pinned.
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: transfer_blocked_by_event_transfer_window_closing_instant
        grounds:
          - validations[priority=14]
          - errors.ERR_EVENT_STATE_FORBIDS_TRANSFER
          - entities.Event.fields.transfer_window_closes_at
          - state_machines.TransferRequest.initial_state
          - endpoints[POST /transfer-requests/{id}/accept]
        distinguishing_aspect: |
          TransferRequest creation AND acceptance both depend on a field of a different
          entity, Event.transfer_window_closes_at, compared strictly: the clock must be
          strictly BEFORE the closing instant. At 2026-09-12T16:59:59Z the offer is
          created; at exactly 2026-09-12T17:00:00Z both a new offer and the acceptance of
          the already-PENDING offer are refused. The already-created request is stranded in
          PENDING rather than auto-declined, so the window governs the transition, not the
          request.
        test_recipe:
          setup:
            - "Event ON_SALE with transfer_window_closes_at 2026-09-12T17:00:00Z and transfer_limit_per_ticket 2; AccessZone GA1."
            - "Ada and Ben verified; Ada holds two PAID 12000-cent tickets tA1 and tA2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
                price_cap_regime: "VENUE_POLICY"
                transfer_limit_per_ticket: 2
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/access-zones"
              payload:
                zone_code: "GA1"
                required_entitlement_level: "GA"
                fire_code_capacity: 200
                face_value_reference_cents: 8750
                credential_capacity: 4
                comp_discount_pct: 0.85
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { z_ga_id: $.data.id }
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "ON_SALE" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /patrons"
              payload: { email: "ada@example.com", display_name: "Ada Lovelace" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { p_ada_id: $.data.id }
            - call: "POST /patrons/${p_ada_id}/verify-identity"
              payload: { document_reference: "DL-ADA-1" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
            - call: "POST /patrons"
              payload: { email: "ben@example.com", display_name: "Ben Hall" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { p_ben_id: $.data.id }
            - call: "POST /patrons/${p_ben_id}/verify-identity"
              payload: { document_reference: "DL-BEN-1" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
            - call: "POST /tickets"
              payload: { event_id: "${ev_id}", access_zone_id: "${z_ga_id}", holder_patron_id: "${p_ada_id}", ticket_type: "PAID", face_value_cents: 12000 }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { t_a1_id: $.data.id }
            - call: "POST /tickets"
              payload: { event_id: "${ev_id}", access_zone_id: "${z_ga_id}", holder_patron_id: "${p_ada_id}", ticket_type: "PAID", face_value_cents: 12000 }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { t_a2_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T16:59:59Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /transfer-requests"
              payload: { ticket_id: "${t_a1_id}", to_patron_id: "${p_ben_id}" }
              as: Patron
              as_user_id: "${p_ada_id}"
              captures: { tr1_id: $.data.id, tr1_status: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T17:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /transfer-requests"
              payload: { ticket_id: "${t_a2_id}", to_patron_id: "${p_ben_id}" }
              as: Patron
              as_user_id: "${p_ada_id}"
              captures: { err_create: $.data.error_id }
            - call: "POST /transfer-requests/${tr1_id}/accept"
              as: Patron
              as_user_id: "${p_ben_id}"
              captures: { err_accept: $.data.error_id }
          assert:
            - "${tr1_status} == PENDING and the creation at 2026-09-12T16:59:59Z returned HTTP 201 — one second inside the window is fine"
            - "${err_create} == ERR_EVENT_STATE_FORBIDS_TRANSFER with HTTP 409 at exactly transfer_window_closes_at — the comparison is strictly-before, so equality is refused"
            - "${err_accept} == ERR_EVENT_STATE_FORBIDS_TRANSFER with HTTP 409 — acceptance carries the same cross-entity dependency"
            - "TransferRequest.${tr1_id}.status is still PENDING with decided_at == null — the window closing does not auto-decline it"
            - "Ticket.${t_a1_id}.holder_patron_id is still ${p_ada_id}, transfer_count == 0, lifecycle_status == ISSUED"
            - "GET /transfer-requests?ticket_id=${t_a2_id} has total_count == 0"

      - name: scan_refused_when_the_gate_of_the_session_is_no_longer_scanning
        grounds:
          - validations[priority=11]
          - errors.ERR_GATE_NOT_SCANNING
          - state_machines.Gate.SCANNING_to_IDLE
          - state_machines.Gate.IDLE_to_SCANNING
          - state_machines.ScanSession.OPEN_to_CLOSED
          - concurrency_rules[scan-session-open-stale-gate]
        distinguishing_aspect: |
          The scan-events endpoint depends on the state of the Gate, an entity two hops
          away (ScanEvent → ScanSession → Gate). Closing the session flips the gate to
          IDLE, and the very next scan against that session reports
          ERR_GATE_NOT_SCANNING — not ERR_SESSION_NOT_OPEN — because priority 11 sits above
          priority 15. Opening a fresh session on the same gate restores Gate.status to
          SCANNING and the identical scan then succeeds, proving the dependency is on the
          gate rather than on the session id.
        test_recipe:
          setup:
            - "Event DOORS_OPEN; AccessZone GA1 (fire_code_capacity 200); Gate G1 on GA1."
            - "Ada and Ben verified, each with a PAID 12000-cent ticket bound to their own device."
            - "ScanSession S1 opened on G1 at 2026-09-12T18:10:00Z; Ada scans IN; the session is closed at 2026-09-12T18:10:30Z so Gate.status == IDLE and S1.status == CLOSED."
