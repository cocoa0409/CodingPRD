      - name: corner_contraband_sanction_bars_the_worker
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /cfs/contraband-incidents/{id}/disposition]
          - state_machines[ContrabandIncident].transitions[OPEN -> SANCTIONED]
          - state_machines[InmateWorker clearance axis].transitions[CLEARED -> BARRED]
        distinguishing_aspect: "A WORK_BAR sanction reaches across three entities in one call: the incident becomes SANCTIONED, the worker is BARRED and force-unassigned with work_area nulled, and the facility's open-incident tally drops back to zero - and the dispositioning officer must differ from the discovering officer."
        test_recipe:
          setup:
            - "Facility FAC-P02 with an ASSIGNED worker in COOK_CHILL and one OPEN ContrabandIncident discovered by co-001 naming that worker."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/service-contracts"
              payload: { contract_code: "CFS-2515-P02", vendor_name: "Aramark Correctional Services", contracted_kcal_per_meal_day: 2800, contracted_protein_grams_per_meal_day: 55.0, contracted_sodium_mg_cap_per_meal_day: 2400, cost_ceiling_cents_per_meal_day: 320, ld_cents_per_missed_meal: 750, ld_monthly_cap_cents: 5000000, substitution_allowance_pct: 0.30 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { contract_id: $.data.id }
            - call: "POST /cfs/facilities"
              payload: { contract_id: "${contract_id}", facility_code: "FAC-P02", name: "North Unit Kitchen", sharps_authorized_count: 12 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { facility_id: $.data.id }
            - call: "POST /cfs/inmates"
              payload: { facility_id: "${facility_id}", booking_number: "BK-P02", housing_unit: "GENERAL" }
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { inmate_id: $.data.id }
            - call: "POST /cfs/inmate-workers"
              payload: { inmate_id: "${inmate_id}", facility_id: "${facility_id}", medical_clearance_expires_at: "2026-12-31T00:00:00Z", sharps_eligible: true }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { worker_id: $.data.id }
            - call: "POST /cfs/inmate-workers/${worker_id}/assign"
              payload: { work_area: "COOK_CHILL" }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { assigned: $.data.assignment_status, area: $.data.work_area }
            - call: "POST /cfs/contraband-incidents"
              payload: { facility_id: "${facility_id}", item_class: "YEAST_ALCOHOL", severity: "MAJOR", narrative: "Fermenting jug behind the mixer.", inmate_worker_id: "${worker_id}" }
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { incident_id: $.data.id, discovered_by: $.data.discovered_by_user_id, incident_status: $.data.status }
            - call: "GET /cfs/facilities/${facility_id}"
              payload: {}
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { posture_with_one_open: $.data.kitchen_posture }
          trigger:
            - call: "POST /cfs/contraband-incidents/${incident_id}/disposition"
              payload: { disposition: "SANCTIONED", sanction_type: "WORK_BAR" }
              as: CorrectionalOfficer
              as_user_id: "co-002"
              captures: { final_status: $.data.status, sanction: $.data.sanction_type, decider: $.data.disposition_by_user_id }
            - call: "GET /cfs/inmate-workers/${worker_id}"
              payload: {}
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { clearance: $.data.clearance_status, assignment: $.data.assignment_status, work_area: $.data.work_area, strikes: $.data.contraband_strike_count }
            - call: "GET /cfs/facilities/${facility_id}"
              payload: {}
              as: CorrectionalOfficer
              as_user_id: "co-002"
              captures: { final_posture: $.data.kitchen_posture }
          assert:
            - "${assigned} == ASSIGNED with ${area} == COOK_CHILL and ${incident_status} == OPEN before the trigger"
            - "${posture_with_one_open} == OPEN - one open incident is below CONTRABAND_RESTRICT_THRESHOLD 2"
            - "${final_status} == SANCTIONED, ${sanction} == WORK_BAR, ${discovered_by} == 'co-001' and ${decider} == 'co-002'"
            - "${clearance} == BARRED, ${assignment} == UNASSIGNED, ${work_area} == null and ${strikes} == 1"
            - "${final_posture} == OPEN and Facility.${facility_id}.open_contraband_incident_count == 0"

