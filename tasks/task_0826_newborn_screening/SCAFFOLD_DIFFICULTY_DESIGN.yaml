scaffold_difficulty_design:

  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: specimen_timeliness_provisional_ontime_vs_final_delayed
        grounds:
          - calculations.specimen_timeliness
          - entities.Specimen.fields.timeliness_provisional
          - entities.Specimen.fields.timeliness_final
          - state_machines.Specimen.IN_TESTING_to_TESTED
        distinguishing_aspect: "On one Specimen the PROVISIONAL variant (collection age 30h + transit 18h) yields ON_TIME while the FINAL variant (birth->report turnaround 130h > 120h) yields DELAYED — the two variants disagree on the same row."
        test_recipe:
          setup:
            - "Term infant born 2026-02-27T06:00:00Z; INITIAL specimen collected at age 30h, received with 18h transit and 5 spots (SATISFACTORY, provisional ON_TIME); screen opened; metabolic reported at clock 2026-03-04T16:00:00Z (130h after birth)."
          setup_api_calls:
            - call: "POST /nbs/facilities"
              payload: { name: "General Hospital", facility_type: "HOSPITAL", state_region: "CA" }
              as: ProgramAdmin
              captures: { hosp_id: "$.data.id" }
            - call: "POST /nbs/infants"
              payload: { facility_id: "${hosp_id}", birth_datetime: "2026-02-27T06:00:00Z", gestational_age_weeks: 39, birth_weight_grams: 3200, sex: "F" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { inf_id: "$.data.id", inf_v: "$.data.version" }
            - call: "POST /nbs/specimens"
              payload: { infant_id: "${inf_id}", specimen_type: "INITIAL", collection_datetime: "2026-02-28T12:00:00Z", expected_infant_version: "${inf_v}" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { spec_id: "$.data.id" }
            - call: "POST /nbs/specimens/${spec_id}/receive"
              payload: { received_datetime: "2026-03-01T06:00:00Z", blood_spot_count: 5 }
              as: LabTechnician
            - call: "POST /nbs/screens"
              payload: { specimen_id: "${spec_id}" }
              as: LabTechnician
              captures: { screen_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-04T16:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /nbs/screens/${screen_id}/report-metabolic"
              payload: { metabolic_result: "NORMAL" }
              as: LabTechnician
          assert:
            - "Specimen.${spec_id}.timeliness_provisional == ON_TIME"
            - "Specimen.${spec_id}.timeliness_final == DELAYED"
            - "Specimen.${spec_id}.status == TESTED"

      - name: followup_priority_initial_50_vs_revised_confirmed_90
        grounds:
          - calculations.followup_priority_score
          - entities.FollowUpCase.fields.priority_score
          - entities.FollowUpCase.fields.priority_variant
          - state_machines.FollowUpCase.OPEN_to_CONFIRMED_POSITIVE
        distinguishing_aspect: "On one FollowUpCase the INITIAL variant scores 50 (W_CRITICAL*1) while the REVISED variant after a CONFIRMED resolve scores 90 (base 50 + W_CONFIRMED 40) — a different entity domain (FollowUpCase) than the specimen timeliness dual-variant."
        test_recipe:
          setup:
            - "Term infant (gest 39, bw 3200); satisfactory specimen; screen reported PRESUMPTIVE_POSITIVE with critical_analyte_count 1 -> case opens with INITIAL priority 50; a METABOLIC_GENETICS referral is scheduled, its appointment completed, and the referral resolved COMPLETED."
          setup_api_calls:
            - call: "POST /nbs/facilities"
              payload: { name: "General Hospital", facility_type: "HOSPITAL", state_region: "CA" }
              as: ProgramAdmin
              captures: { hosp_id: "$.data.id" }
            - call: "POST /nbs/infants"
              payload: { facility_id: "${hosp_id}", birth_datetime: "2026-02-27T06:00:00Z", gestational_age_weeks: 39, birth_weight_grams: 3200, sex: "F" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { inf_id: "$.data.id", inf_v: "$.data.version" }
            - call: "POST /nbs/specimens"
              payload: { infant_id: "${inf_id}", specimen_type: "INITIAL", collection_datetime: "2026-02-28T12:00:00Z", expected_infant_version: "${inf_v}" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { spec_id: "$.data.id" }
            - call: "POST /nbs/specimens/${spec_id}/receive"
              payload: { received_datetime: "2026-03-01T06:00:00Z", blood_spot_count: 5 }
              as: LabTechnician
            - call: "POST /nbs/screens"
              payload: { specimen_id: "${spec_id}" }
              as: LabTechnician
              captures: { screen_id: "$.data.id" }
            - call: "POST /nbs/screens/${screen_id}/report-metabolic"
              payload: { metabolic_result: "PRESUMPTIVE_POSITIVE", critical_analyte_count: 1 }
              as: LabTechnician
            - call: "GET /nbs/follow-up-cases?screen_id=${screen_id}"
              payload: {}
              as: FollowUpCoordinator
              captures: { case_id: "$.data[0].id", initial_score: "$.data[0].priority_score" }
            - call: "POST /nbs/specialty-clinics"
              payload: { name: "Metabolic Genetics Clinic", specialty: "METABOLIC_GENETICS", concurrent_capacity: 2 }
              as: ProgramAdmin
              captures: { clinic_id: "$.data.id" }
            - call: "POST /nbs/referrals"
              payload: { follow_up_case_id: "${case_id}", specialty_clinic_id: "${clinic_id}", referral_reason: "METABOLIC_GENETICS" }
              as: FollowUpCoordinator
              captures: { ref_id: "$.data.id" }
            - call: "POST /nbs/confirmatory-appointments"
              payload: { referral_id: "${ref_id}", start_datetime: "2026-03-05T09:00:00Z", end_datetime: "2026-03-05T10:00:00Z" }
              as: FollowUpCoordinator
              captures: { appt_id: "$.data.id" }
            - call: "POST /nbs/confirmatory-appointments/${appt_id}/complete"
              payload: { attended: true }
              as: SpecialtyClinician
              as_user_id: "${clinic_id}"
            - call: "POST /nbs/referrals/${ref_id}/resolve"
              payload: { outcome: "COMPLETED" }
              as: FollowUpCoordinator
          trigger:
            - call: "POST /nbs/follow-up-cases/${case_id}/resolve"
              payload: { outcome: "CONFIRMED" }
              as: FollowUpCoordinator
          assert:
            - "FollowUpCase.${case_id}.priority_variant == REVISED"
            - "FollowUpCase.${case_id}.priority_score == 90"
            - "FollowUpCase.${case_id}.status == LONG_TERM_MONITORING"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: specimen_acceptability_term_early_conditional_branch
        grounds:
          - calculations.specimen_acceptability
          - entities.Specimen.fields.acceptability
          - entities.Infant.fields.gestational_age_weeks
          - state_machines.Specimen.RECEIVED_to_UNSATISFACTORY
        distinguishing_aspect: "Mode (a): a 4-input formula (blood_spot_count, collection_age_hours, transit_time_hours, gestational_age_weeks) with a conditional branch — a term infant (gest 39 >= 37) collected at age 12h (< 24h) resolves to UNSAT_EARLY, whereas a preterm infant at the same age would be exempt."
        test_recipe:
          setup:
            - "Term infant (gest 39) born 2026-02-27T06:00:00Z; INITIAL specimen collected at age 12h (2026-02-27T18:00:00Z); received with 5 spots and 12h transit."
          setup_api_calls:
            - call: "POST /nbs/facilities"
              payload: { name: "General Hospital", facility_type: "HOSPITAL", state_region: "CA" }
              as: ProgramAdmin
              captures: { hosp_id: "$.data.id" }
            - call: "POST /nbs/infants"
              payload: { facility_id: "${hosp_id}", birth_datetime: "2026-02-27T06:00:00Z", gestational_age_weeks: 39, birth_weight_grams: 3200, sex: "M" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { inf_id: "$.data.id", inf_v: "$.data.version" }
            - call: "POST /nbs/specimens"
              payload: { infant_id: "${inf_id}", specimen_type: "INITIAL", collection_datetime: "2026-02-27T18:00:00Z", expected_infant_version: "${inf_v}" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { spec_id: "$.data.id" }
          trigger:
            - call: "POST /nbs/specimens/${spec_id}/receive"
              payload: { received_datetime: "2026-02-28T06:00:00Z", blood_spot_count: 5 }
              as: LabTechnician
          assert:
            - "Specimen.${spec_id}.acceptability == UNSAT_EARLY"
            - "Specimen.${spec_id}.status == UNSATISFACTORY"

      - name: program_timeliness_rate_round_then_average_75
        grounds:
          - calculations.program_timeliness_rate
          - entities.Specimen.fields.timeliness_final
          - entities.Facility.fields.state_region
          - endpoints.GET /nbs/program/timeliness-summary
        distinguishing_aspect: "Mode (b): rounding order is pinned — Hosp A rate 50.0 (1 of 2 timely) and Hosp B rate 100.0 (1 of 1 timely) average to 75.0, whereas sum-timely/sum-total (2/3 = 66.7) would differ; the scaffold uses round-per-facility-then-average."
        test_recipe:
          setup:
            - "Two CA hospitals. Hosp A has two reported INITIAL specimens: one TIMELY (turnaround 48h) and one DELAYED (turnaround 138h) -> facility rate 50.0. Hosp B has one reported INITIAL specimen, TIMELY -> facility rate 100.0."
          setup_api_calls:
            - call: "POST /nbs/facilities"
              payload: { name: "Hosp A", facility_type: "HOSPITAL", state_region: "CA" }
              as: ProgramAdmin
              captures: { hospA: "$.data.id" }
            - call: "POST /nbs/facilities"
              payload: { name: "Hosp B", facility_type: "HOSPITAL", state_region: "CA" }
              as: ProgramAdmin
              captures: { hospB: "$.data.id" }
            - call: "POST /nbs/infants"
              payload: { facility_id: "${hospA}", birth_datetime: "2026-02-27T06:00:00Z", gestational_age_weeks: 39, birth_weight_grams: 3200, sex: "F" }
              as: BirthFacilityUser
              as_user_id: "${hospA}"
              captures: { a1_inf: "$.data.id", a1_v: "$.data.version" }
            - call: "POST /nbs/infants"
              payload: { facility_id: "${hospA}", birth_datetime: "2026-02-27T06:00:00Z", gestational_age_weeks: 39, birth_weight_grams: 3200, sex: "F" }
              as: BirthFacilityUser
              as_user_id: "${hospA}"
              captures: { a2_inf: "$.data.id", a2_v: "$.data.version" }
            - call: "POST /nbs/infants"
              payload: { facility_id: "${hospB}", birth_datetime: "2026-02-27T06:00:00Z", gestational_age_weeks: 39, birth_weight_grams: 3200, sex: "M" }
              as: BirthFacilityUser
              as_user_id: "${hospB}"
              captures: { b1_inf: "$.data.id", b1_v: "$.data.version" }
            - call: "POST /nbs/specimens"
              payload: { infant_id: "${a1_inf}", specimen_type: "INITIAL", collection_datetime: "2026-02-28T12:00:00Z", expected_infant_version: "${a1_v}" }
              as: BirthFacilityUser
              as_user_id: "${hospA}"
              captures: { a1_spec: "$.data.id" }
            - call: "POST /nbs/specimens/${a1_spec}/receive"
              payload: { received_datetime: "2026-03-01T06:00:00Z", blood_spot_count: 5 }
              as: LabTechnician
            - call: "POST /nbs/screens"
              payload: { specimen_id: "${a1_spec}" }
              as: LabTechnician
              captures: { a1_screen: "$.data.id" }
            - call: "POST /nbs/specimens"
              payload: { infant_id: "${a2_inf}", specimen_type: "INITIAL", collection_datetime: "2026-02-28T12:00:00Z", expected_infant_version: "${a2_v}" }
              as: BirthFacilityUser
              as_user_id: "${hospA}"
              captures: { a2_spec: "$.data.id" }
            - call: "POST /nbs/specimens/${a2_spec}/receive"
              payload: { received_datetime: "2026-03-01T06:00:00Z", blood_spot_count: 5 }
              as: LabTechnician
            - call: "POST /nbs/screens"
              payload: { specimen_id: "${a2_spec}" }
              as: LabTechnician
              captures: { a2_screen: "$.data.id" }
            - call: "POST /nbs/specimens"
              payload: { infant_id: "${b1_inf}", specimen_type: "INITIAL", collection_datetime: "2026-02-28T12:00:00Z", expected_infant_version: "${b1_v}" }
              as: BirthFacilityUser
              as_user_id: "${hospB}"
              captures: { b1_spec: "$.data.id" }
            - call: "POST /nbs/specimens/${b1_spec}/receive"
              payload: { received_datetime: "2026-03-01T06:00:00Z", blood_spot_count: 5 }
              as: LabTechnician
            - call: "POST /nbs/screens"
              payload: { specimen_id: "${b1_spec}" }
              as: LabTechnician
              captures: { b1_screen: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T06:00:00Z" }
              as: ProgramAdmin
            - call: "POST /nbs/screens/${a1_screen}/report-metabolic"
              payload: { metabolic_result: "NORMAL" }
              as: LabTechnician
            - call: "POST /nbs/screens/${b1_screen}/report-metabolic"
              payload: { metabolic_result: "NORMAL" }
              as: LabTechnician
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /nbs/screens/${a2_screen}/report-metabolic"
              payload: { metabolic_result: "NORMAL" }
              as: LabTechnician
          trigger:
            - call: "GET /nbs/program/timeliness-summary?state_region=CA"
              payload: {}
              as: ProgramAdmin
          assert:
            - "program_rate == 75.0"
            - "facility_count == 2"
            - "eligible_specimen_count == 3"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: screen_three_axes_evolve_independently
        grounds:
          - state_machines.Screen.NOT_DONE_to_REFER
          - state_machines.Screen.NOT_DONE_to_PASS
          - entities.Screen.fields.hearing_status
          - entities.Screen.fields.cchd_status
          - entities.Screen.fields.metabolic_status
        distinguishing_aspect: "On one Screen row the hearing axis reaches REFER and the cchd axis reaches PASS while the metabolic axis stays PENDING — three parallel status dimensions move independently (non-linear parallel shape) on entity Screen."
        test_recipe:
          setup:
            - "Term infant; satisfactory specimen; screen opened (all axes at initial). Hearing reported REFER; metabolic left unreported."
          setup_api_calls:
            - call: "POST /nbs/facilities"
              payload: { name: "General Hospital", facility_type: "HOSPITAL", state_region: "CA" }
              as: ProgramAdmin
              captures: { hosp_id: "$.data.id" }
            - call: "POST /nbs/infants"
              payload: { facility_id: "${hosp_id}", birth_datetime: "2026-02-27T06:00:00Z", gestational_age_weeks: 39, birth_weight_grams: 3200, sex: "F" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { inf_id: "$.data.id", inf_v: "$.data.version" }
            - call: "POST /nbs/specimens"
              payload: { infant_id: "${inf_id}", specimen_type: "INITIAL", collection_datetime: "2026-02-28T12:00:00Z", expected_infant_version: "${inf_v}" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { spec_id: "$.data.id" }
            - call: "POST /nbs/specimens/${spec_id}/receive"
              payload: { received_datetime: "2026-03-01T06:00:00Z", blood_spot_count: 5 }
              as: LabTechnician
            - call: "POST /nbs/screens"
              payload: { specimen_id: "${spec_id}" }
              as: LabTechnician
              captures: { screen_id: "$.data.id" }
            - call: "POST /nbs/screens/${screen_id}/point-of-care"
              payload: { component: "HEARING", hearing_result: "REFER" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
          trigger:
            - call: "POST /nbs/screens/${screen_id}/point-of-care"
              payload: { component: "CCHD", spo2_right_hand: 98, spo2_foot: 97 }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
          assert:
            - "Screen.${screen_id}.hearing_status == REFER"
            - "Screen.${screen_id}.cchd_status == PASS"
            - "Screen.${screen_id}.metabolic_status == PENDING"

      - name: followup_case_repeat_loop_reaches_count_two
        grounds:
          - state_machines.FollowUpCase.REPEAT_RECEIVED_to_REPEAT_REQUESTED
          - state_machines.FollowUpCase.REPEAT_REQUESTED_to_REPEAT_RECEIVED
          - entities.FollowUpCase.fields.repeat_count
          - entities.FollowUpCase.fields.status
        distinguishing_aspect: "A FollowUpCase loops REPEAT_RECEIVED -> REPEAT_REQUESTED a second time (cyclic shape), driving repeat_count to 2 — entity FollowUpCase, distinct from the Screen parallel-axis instance."
        test_recipe:
          setup:
            - "Case opened via PRESUMPTIVE_POSITIVE. request-repeat -> REPEAT_REQUESTED (count 1); a REPEAT specimen is tested -> case REPEAT_RECEIVED."
          setup_api_calls:
            - call: "POST /nbs/facilities"
              payload: { name: "General Hospital", facility_type: "HOSPITAL", state_region: "CA" }
              as: ProgramAdmin
              captures: { hosp_id: "$.data.id" }
            - call: "POST /nbs/infants"
              payload: { facility_id: "${hosp_id}", birth_datetime: "2026-02-27T06:00:00Z", gestational_age_weeks: 39, birth_weight_grams: 3200, sex: "F" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { inf_id: "$.data.id", inf_v: "$.data.version" }
            - call: "POST /nbs/specimens"
              payload: { infant_id: "${inf_id}", specimen_type: "INITIAL", collection_datetime: "2026-02-28T12:00:00Z", expected_infant_version: "${inf_v}" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { spec_id: "$.data.id" }
            - call: "POST /nbs/specimens/${spec_id}/receive"
              payload: { received_datetime: "2026-03-01T06:00:00Z", blood_spot_count: 5 }
              as: LabTechnician
            - call: "POST /nbs/screens"
              payload: { specimen_id: "${spec_id}" }
              as: LabTechnician
              captures: { screen_id: "$.data.id" }
            - call: "POST /nbs/screens/${screen_id}/report-metabolic"
              payload: { metabolic_result: "PRESUMPTIVE_POSITIVE", critical_analyte_count: 1 }
              as: LabTechnician
            - call: "GET /nbs/follow-up-cases?screen_id=${screen_id}"
              payload: {}
              as: FollowUpCoordinator
              captures: { case_id: "$.data[0].id" }
            - call: "POST /nbs/follow-up-cases/${case_id}/request-repeat"
              payload: { note: "first repeat" }
              as: FollowUpCoordinator
            - call: "GET /nbs/infants/${inf_id}"
              payload: {}
              as: LabTechnician
              captures: { inf_v2: "$.data.version" }
            - call: "POST /nbs/specimens"
              payload: { infant_id: "${inf_id}", specimen_type: "REPEAT", collection_datetime: "2026-03-02T12:00:00Z", expected_infant_version: "${inf_v2}" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { rspec_id: "$.data.id" }
            - call: "POST /nbs/specimens/${rspec_id}/receive"
              payload: { received_datetime: "2026-03-02T18:00:00Z", blood_spot_count: 5 }
              as: LabTechnician
            - call: "POST /nbs/screens"
              payload: { specimen_id: "${rspec_id}" }
              as: LabTechnician
              captures: { rscreen_id: "$.data.id" }
            - call: "POST /nbs/screens/${rscreen_id}/report-metabolic"
              payload: { metabolic_result: "NORMAL" }
              as: LabTechnician
          trigger:
            - call: "POST /nbs/follow-up-cases/${case_id}/request-repeat"
              payload: { note: "second repeat" }
              as: FollowUpCoordinator
          assert:
            - "FollowUpCase.${case_id}.status == REPEAT_REQUESTED"
            - "FollowUpCase.${case_id}.repeat_count == 2"

  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: consent_refusal_voids_specimen_cancels_screen_closes_case
        grounds:
          - state_machines.Specimen.IN_TESTING_to_VOIDED
          - state_machines.Screen.PENDING_to_CANCELLED
          - state_machines.FollowUpCase.OPEN_to_CLOSED
          - entities.Infant.fields.open_case_count
        distinguishing_aspect: "Depth-4 cascade from consent REFUSAL through ONE screen: Infant.consent_status=REFUSED -> Specimen (IN_TESTING) VOIDED -> that Screen's metabolic_status CANCELLED -> the OPEN FollowUpCase on that screen CLOSED -> Infant.open_case_count decremented to 0; each hop is caused by the previous one."
        test_recipe:
          setup:
            - "Term infant; satisfactory specimen; screen opened (specimen IN_TESTING, metabolic still PENDING). A CCHD FAIL (SpO2 85/88 -> lower 85 < 90) opens a SHORT_TERM follow-up case for that screen WITHOUT reporting metabolic, so the specimen stays IN_TESTING (open_case_count 1)."
          setup_api_calls:
            - call: "POST /nbs/facilities"
              payload: { name: "General Hospital", facility_type: "HOSPITAL", state_region: "CA" }
              as: ProgramAdmin
              captures: { hosp_id: "$.data.id" }
            - call: "POST /nbs/infants"
              payload: { facility_id: "${hosp_id}", birth_datetime: "2026-02-27T06:00:00Z", gestational_age_weeks: 39, birth_weight_grams: 3200, sex: "F" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { inf_id: "$.data.id", inf_v: "$.data.version" }
            - call: "POST /nbs/specimens"
              payload: { infant_id: "${inf_id}", specimen_type: "INITIAL", collection_datetime: "2026-02-28T12:00:00Z", expected_infant_version: "${inf_v}" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { spec_id: "$.data.id" }
            - call: "POST /nbs/specimens/${spec_id}/receive"
              payload: { received_datetime: "2026-03-01T06:00:00Z", blood_spot_count: 5 }
              as: LabTechnician
            - call: "POST /nbs/screens"
              payload: { specimen_id: "${spec_id}" }
              as: LabTechnician
              captures: { screen_id: "$.data.id" }
            - call: "POST /nbs/screens/${screen_id}/point-of-care"
              payload: { component: "CCHD", spo2_right_hand: 85, spo2_foot: 88 }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
            - call: "GET /nbs/follow-up-cases?screen_id=${screen_id}"
              payload: {}
              as: FollowUpCoordinator
              captures: { case_id: "$.data[0].id" }
          trigger:
            - call: "POST /nbs/infants/${inf_id}/consent"
              payload: { decision: "REFUSAL", recorded_by: "parent" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
          assert:
            - "Specimen.${spec_id}.status == VOIDED"
            - "Screen.${screen_id}.metabolic_status == CANCELLED"
            - "FollowUpCase.${case_id}.status == CLOSED"
            - "Infant.${inf_id}.consent_status == REFUSED"
            - "Infant.${inf_id}.open_case_count == 0"

      - name: unsatisfactory_receipt_spawns_recollection_bumps_infant_counter
        grounds:
          - state_machines.Specimen.RECEIVED_to_UNSATISFACTORY
          - entities.RecollectionOrder.fields.status
          - entities.Infant.fields.open_recollection_count
