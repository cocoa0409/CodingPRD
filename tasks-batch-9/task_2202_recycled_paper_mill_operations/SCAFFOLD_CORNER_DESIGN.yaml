          setup: ["The spine: an APPROVED batch with charged_tons 20.000, provisional_accepted_tons 16.880, final_accepted_tons 18.000 and available_tons 18.000, plus a SCHEDULED run on RUNNABLE PM1 drawing 17.500 tons."]
