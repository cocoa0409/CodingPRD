# =============================================================================
# Scaffold: Independent Practice Association Capitation & Risk Pool Distribution
# Task 2420 — §1.0 through §1.7
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2420. Independent Practice Association Capitation & Risk Pool Distribution
  (independent practice association): member physician contracting with payer
  delegation agreements, member assignment and monthly capitation payment
  reconciliation by enrollment file, professional versus institutional risk
  pool accounting and settlement timing, incurred-but-not-reported reserve
  estimation, claim payment or delegated adjudication for downstream
  providers, quality withhold and shared savings distribution formula by panel
  performance, stop-loss attachment and reinsurance recovery, physician exit,
  panel transfer and continuity-of-care obligations

domain_name: ipa-capitation-risk-pool
api_prefix: /ipa

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Multi-party negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: graph
  # MemberAssignment and PoolDistribution are junction entities; DownstreamClaim
  # references four aggregates (DelegationAgreement, Enrollee, PhysicianMember,
  # RiskPool); MemberAssignment.pending_to_physician_id points at the same entity
  # type as MemberAssignment.physician_id, so the panel-transfer graph is
  # self-referential across PhysicianMember nodes.

  state_machine_shape: parallel
  # PhysicianMember carries two independent dimensions (credential_status ×
  # panel_status). RiskPool, EnrollmentFile, DownstreamClaim and MemberAssignment
  # each carry a cycle; DownstreamClaim additionally forks RECEIVED →
  # {ADJUDICATED_APPROVED, ADJUDICATED_DENIED} with divergent side-effect sets.

  relationship_patterns:
    - one_to_many        # DelegationAgreement → PhysicianMember / Enrollee / EnrollmentFile / RiskPool
    - many_to_many       # MemberAssignment (Enrollee × PhysicianMember), PoolDistribution (RiskPool × PhysicianMember)
    - self_referential   # MemberAssignment.physician_id and .pending_to_physician_id both target PhysicianMember
    - cross_aggregate    # DownstreamClaim.pool_id resolved across the RiskPool aggregate by service_date

  role_model: segregation_of_duties
  # The ClaimsExaminer X-User-ID that submits a StopLossRecovery may not be the
  # ReinsuranceUnderwriter X-User-ID that adjudicates it.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 12 entities, 44 endpoints, 42 error codes, 12 calculations (2 with declared
  # variants), 11 state machines across 10 entities, 29 ordered validations.

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: DelegationAgreement
    parent: null
    common_fields: true
    fields:
      - { name: payer_name, type: string, source: input, description: "Payer legal name" }
      - { name: payer_tax_id, type: string, source: input, description: "Payer federal tax id; unique across agreements", constraints: "unique" }
      - { name: delegation_scope, type: enum, source: input, description: "Scope delegated by the payer to the IPA", constraints: "CLAIMS_ONLY | CLAIMS_AND_UM | FULL_RISK" }
      - { name: base_pmpm_cents, type: integer, source: input, description: "Base per-member-per-month capitation in whole cents before risk/age/tier adjustment", constraints: ">= 1" }
      - { name: reconciliation_method, type: enum, source: input, description: "Selects which variant of calculations.expected_capitation_for_coverage_month runs", constraints: "ROSTER_SNAPSHOT | MEMBER_MONTHS_PRORATED" }
      - { name: ibnr_method, type: enum, source: input, description: "Default variant of calculations.ibnr_reserve_estimate", constraints: "COMPLETION_FACTOR | PMPM_LOSS_RATIO" }
      - { name: ibnr_completion_factor_bps, type: integer, source: input, description: "Completion factor in basis points used by the COMPLETION_FACTOR IBNR variant", constraints: "1 <= value <= 10000" }
      - { name: target_claims_pmpm_cents, type: integer, source: input, description: "Target claims cost per member month used by the PMPM_LOSS_RATIO IBNR variant", constraints: ">= 0" }
      - { name: professional_pool_share_bps, type: integer, source: input, description: "Basis points of net payable capitation routed to the PROFESSIONAL risk pool", constraints: "0 <= value <= 10000" }
      - { name: institutional_pool_share_bps, type: integer, source: input, description: "Basis points routed to the INSTITUTIONAL risk pool; must sum with professional_pool_share_bps to exactly 10000", constraints: "0 <= value <= 10000" }
      - { name: quality_withhold_bps, type: integer, source: input, description: "Basis points of expected capitation withheld pending panel quality performance", constraints: "0 <= value <= 3000" }
      - { name: stop_loss_attachment_cents, type: integer, source: input, description: "Per-enrollee per-pool attachment point; recovery applies strictly above this amount", constraints: ">= 0" }
      - { name: reinsurance_recovery_bps, type: integer, source: input, description: "Basis points of the excess above attachment recoverable from the reinsurer", constraints: "0 <= value <= 10000" }
      - { name: continuity_of_care_days, type: integer, source: input, default: 90, description: "Days after a physician exit notice during which their assignments may not be TERMINATED" }
      - { name: max_panel_size, type: integer, source: input, description: "Maximum count of MemberAssignment rows with status == ACTIVE per PhysicianMember", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | TERMINATED", default: "DRAFT" }
      - { name: capitation_posture, type: enum, source: computed, description: "CURRENT | UNDER_REVIEW | WITHHELD — derived per calculations.capitation_posture_derivation; gates panel reopening", default: "CURRENT" }
      - { name: accrued_capitation_cents, type: integer, source: computed, description: "= sum over CapitationRemittance of this agreement with status IN {RECONCILED, POSTED} of (expected_capitation_cents + retro_adjustment_cents)", default: 0 }
      - { name: withheld_balance_cents, type: integer, source: computed, description: "Undistributed quality withhold; incremented by CapitationRemittance.withhold_cents on POST, decremented by the physician withhold shares recognised at RiskPool SETTLED", default: 0 }
      - { name: forfeited_withhold_cents, type: integer, source: computed, description: "Withhold share not released to physicians at settlement because withhold_release_bps < 10000", default: 0 }
      - { name: total_assigned_members, type: integer, source: computed, description: "Count of MemberAssignment rows with status == ACTIVE whose physician_id belongs to this agreement", default: 0 }

  - name: PhysicianMember
    parent: DelegationAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> DelegationAgreement.id; taken from the creation path, never from the body" }
      - { name: npi, type: string, source: input, description: "National Provider Identifier; unique within the agreement", constraints: "unique per agreement_id" }
      - { name: full_name, type: string, source: input, description: "Physician display name" }
      - { name: specialty, type: enum, source: input, description: "PRIMARY_CARE | PEDIATRICS | INTERNAL_MEDICINE | OB_GYN" }
      - { name: credential_status, type: enum, source: system, description: "APPLICANT | CREDENTIALED | ACTIVE | NOTICE_GIVEN | EXITED — contracting dimension", default: "APPLICANT" }
      - { name: panel_status, type: enum, source: system, description: "OPEN | CLOSED_TO_NEW | TRANSFER_PENDING | TRANSFERRED — panel dimension, evolves independently of credential_status", default: "OPEN" }
      - { name: panel_size, type: integer, source: computed, description: "Count of MemberAssignment rows with physician_id == this.id and status == ACTIVE", default: 0 }
      - { name: exit_notice_at, type: datetime, source: system, description: "Logical clock instant at which credential_status became NOTICE_GIVEN; null before that", default: null }
      - { name: continuity_of_care_until, type: datetime, source: computed, description: "= exit_notice_at + DelegationAgreement.continuity_of_care_days; null while exit_notice_at is null", default: null }
      - { name: quality_composite_bps, type: integer, source: computed, description: "composite_score_bps of this physician's most recently FINAL QualityScorecard ordered by measurement_period DESC then created_at DESC; 0 when none is FINAL", default: 0 }
      - { name: latest_scorecard_period, type: string, source: system, description: "measurement_period of the most recently created QualityScorecard for this physician; null when none exists", default: null }

  - name: Enrollee
    parent: DelegationAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> DelegationAgreement.id; taken from the creation path" }
      - { name: external_member_id, type: string, source: input, description: "Payer-side member identifier used to match EnrollmentFileRow rows; unique within the agreement", constraints: "unique per agreement_id" }
      - { name: age_band, type: enum, source: input, description: "PEDIATRIC | ADULT | SENIOR — selects AGE_BAND_FACTOR_BPS" }
      - { name: benefit_tier, type: enum, source: input, description: "HMO | POS | HMO_PLUS — selects BENEFIT_TIER_ADD_CENTS" }
      - { name: risk_score_bps, type: integer, source: input, description: "Risk-adjustment factor in basis points; 10000 == 1.00", constraints: "1 <= value <= 50000" }
      - { name: coverage_start_date, type: datetime, source: input, description: "First instant of payer coverage; assignments may not start earlier" }
      - { name: coverage_end_date, type: datetime, source: input, description: "Last instant of payer coverage; null when open-ended", default: null }
      - { name: assigned_physician_id, type: string, source: computed, description: "FK -> PhysicianMember.id; physician_id of this enrollee's single MemberAssignment with status == ACTIVE, null when none exists" }
      - { name: gross_pmpm_cents, type: integer, source: computed, description: "Per calculations.member_pmpm_components; floor/ceiling-capped risk-adjusted capitation before withhold", default: 0 }
      - { name: withhold_cents, type: integer, source: computed, description: "Per-enrollee quality withhold portion of gross_pmpm_cents", default: 0 }
      - { name: net_pmpm_cents, type: integer, source: computed, description: "= gross_pmpm_cents - withhold_cents", default: 0 }
      - { name: cumulative_paid_claims_cents, type: integer, source: computed, description: "= sum of DownstreamClaim.paid_cents for this enrollee across claims with status == PAID", default: 0 }

  - name: MemberAssignment
    parent: null
    common_fields: true
    fields:
      - { name: enrollee_id, type: string, source: input, description: "FK -> Enrollee.id" }
      - { name: physician_id, type: string, source: input, description: "FK -> PhysicianMember.id; the physician currently holding the panel slot" }
      - { name: pending_to_physician_id, type: string, source: system, description: "FK -> PhysicianMember.id; transfer target while status IN {TRANSFER_PROPOSED, TRANSFER_ACCEPTED}, null otherwise", default: null }
      - { name: effective_date, type: datetime, source: input, description: "Inclusive start of the assignment interval" }
      - { name: term_date, type: datetime, source: system, description: "Exclusive end of the assignment interval; null while open-ended", default: null }
      - { name: status, type: enum, source: system, description: "ACTIVE | TRANSFER_PROPOSED | TRANSFER_ACCEPTED | TRANSFERRED | TERMINATED", default: "ACTIVE" }
      - { name: assignment_source, type: enum, source: input, description: "MANUAL | ENROLLMENT_FILE | PANEL_TRANSFER — PANEL_TRANSFER is only written by the system on the TRANSFER_ACCEPTED → TRANSFERRED cascade" }
      - { name: continuity_of_care_until, type: datetime, source: system, description: "Set on the successor assignment created by a panel transfer to transfer_effective_date + DelegationAgreement.continuity_of_care_days; null otherwise", default: null }
      - { name: superseded_by_assignment_id, type: string, source: system, description: "Assignment id that superseded this one via supersede_prior; null when never superseded (identity pointer only, never a decision input)", default: null }

  - name: EnrollmentFile
    parent: DelegationAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> DelegationAgreement.id; taken from the creation path" }
      - { name: coverage_month, type: string, source: input, description: "Coverage month in YYYY-MM form; unique per agreement among files with status != DISPUTED", constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$" }
      - { name: payer_file_reference, type: string, source: input, description: "Payer's transmission reference for audit" }
      - { name: received_at, type: datetime, source: system, description: "Logical clock instant at creation" }
      - { name: status, type: enum, source: system, description: "RECEIVED | PARSED | RECONCILED | DISPUTED | POSTED", default: "RECEIVED" }
      - { name: row_count, type: integer, source: computed, description: "Count of EnrollmentFileRow rows with file_id == this.id", default: 0 }
      - { name: matched_row_count, type: integer, source: computed, description: "Count of this file's rows with match_status == MATCHED; 0 until the RECEIVED → PARSED transition runs", default: 0 }
      - { name: exception_row_count, type: integer, source: computed, description: "= row_count - matched_row_count after parsing", default: 0 }
      - { name: claimed_capitation_cents, type: integer, source: computed, description: "Per calculations.file_claimed_capitation; sum of claimed_capitation_cents over MATCHED rows with row_action IN {ADD, CHANGE, TERM}", default: 0 }

  - name: EnrollmentFileRow
    parent: EnrollmentFile
    common_fields: false
    fields:
      - { name: file_id, type: string, source: system, description: "FK -> EnrollmentFile.id; taken from the creation path" }
      - { name: external_member_id, type: string, source: input, description: "Payer member identifier as transmitted; matched against Enrollee.external_member_id within the file's agreement" }
      - { name: physician_npi, type: string, source: input, description: "Payer-asserted assigned physician NPI; matched against PhysicianMember.npi within the file's agreement" }
      - { name: row_action, type: enum, source: input, description: "ADD | TERM | CHANGE | RETRO_ADD | RETRO_TERM" }
      - { name: claimed_capitation_cents, type: integer, source: input, description: "Capitation the payer asserts for this row in whole cents", constraints: ">= 0" }
      - { name: effective_date, type: datetime, source: input, description: "Payer-asserted effective instant for the row action" }
      - { name: match_status, type: enum, source: computed, description: "UNMATCHED | MATCHED_ENROLLEE_ONLY | MATCHED | EXCEPTION_PHYSICIAN_INACTIVE — written once by the RECEIVED → PARSED transition and immutable thereafter; UNMATCHED before parsing", default: "UNMATCHED" }

  - name: CapitationRemittance
    parent: EnrollmentFile
    common_fields: true
    fields:
      - { name: file_id, type: string, source: system, description: "FK -> EnrollmentFile.id; a file may accumulate several remittances across dispute/resubmit cycles" }
      - { name: coverage_month, type: string, source: system, description: "Copied from EnrollmentFile.coverage_month at creation" }
      - { name: reconciliation_method_used, type: enum, source: system, description: "ROSTER_SNAPSHOT | MEMBER_MONTHS_PRORATED — snapshot of the agreement's reconciliation_method at reconcile time" }
      - { name: expected_capitation_cents, type: integer, source: computed, description: "Per calculations.expected_capitation_for_coverage_month under reconciliation_method_used", default: 0 }
      - { name: claimed_capitation_cents, type: integer, source: computed, description: "Snapshot of EnrollmentFile.claimed_capitation_cents at reconcile time", default: 0 }
      - { name: retro_adjustment_cents, type: integer, source: computed, description: "Per calculations.file_claimed_capitation; + for RETRO_ADD rows, - for RETRO_TERM rows, MATCHED rows only", default: 0 }
      - { name: variance_cents, type: integer, source: computed, description: "= claimed_capitation_cents + retro_adjustment_cents - expected_capitation_cents", default: 0 }
      - { name: withhold_cents, type: integer, source: computed, description: "= round_half_up(expected_capitation_cents * DelegationAgreement.quality_withhold_bps / 10000), rounded once at remittance level (NOT the sum of per-enrollee withholds)", default: 0 }
      - { name: net_payable_cents, type: integer, source: computed, description: "= expected_capitation_cents - withhold_cents + retro_adjustment_cents", default: 0 }
      - { name: institutional_allocation_cents, type: integer, source: computed, description: "= round_half_up(net_payable_cents * institutional_pool_share_bps / 10000)", default: 0 }
      - { name: professional_allocation_cents, type: integer, source: computed, description: "= net_payable_cents - institutional_allocation_cents; the professional pool absorbs the rounding remainder", default: 0 }
      - { name: member_month_count_bps, type: integer, source: computed, description: "Member months contributed by this coverage month in basis points (10000 == 1.000 member month); per calculations.expected_capitation_for_coverage_month", default: 0 }
      - { name: status, type: enum, source: system, description: "RECONCILED | DISPUTED | POSTED", default: "RECONCILED" }

  - name: RiskPool
    parent: DelegationAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> DelegationAgreement.id; taken from the creation path" }
      - { name: pool_type, type: enum, source: input, description: "PROFESSIONAL | INSTITUTIONAL — determines the funding share and the settlement lag" }
      - { name: pool_year_start, type: datetime, source: input, description: "Inclusive first instant of the incurral period" }
      - { name: pool_year_end, type: datetime, source: input, description: "Inclusive last instant of the incurral period; pool periods of the same pool_type may not overlap under CLOSED interval semantics" }
      - { name: status, type: enum, source: system, description: "ACCUMULATING | CLOSED_FOR_INCURRAL | RESERVED | SETTLEMENT_PROPOSED | SETTLED", default: "ACCUMULATING" }
      - { name: settlement_due_date, type: datetime, source: computed, description: "= pool_year_end + SETTLEMENT_LAG_DAYS[pool_type] (PROFESSIONAL 180, INSTITUTIONAL 270)" }
      - { name: funded_cents, type: integer, source: computed, description: "Sum of CapitationRemittance allocations routed to this pool by POSTED remittances whose coverage month start falls inside [pool_year_start, pool_year_end]", default: 0 }
      - { name: member_months_bps, type: integer, source: computed, description: "Sum of CapitationRemittance.member_month_count_bps over the same POSTED remittances", default: 0 }
      - { name: paid_claims_cents, type: integer, source: computed, description: "= sum of DownstreamClaim.paid_cents for claims with pool_id == this.id and status == PAID", default: 0 }
      - { name: ibnr_reserve_cents, type: integer, source: computed, description: "Per calculations.ibnr_reserve_estimate; 0 until the pool reaches RESERVED", default: 0 }
      - { name: ibnr_method_used, type: enum, source: system, description: "COMPLETION_FACTOR | PMPM_LOSS_RATIO — the variant applied by the most recent RESERVED estimate; null before that", default: null }
      - { name: stop_loss_recovery_cents, type: integer, source: computed, description: "= sum of StopLossRecovery.recovery_cents for this pool with status IN {APPROVED, RECOVERED}", default: 0 }
      - { name: stop_loss_eligible_enrollee_count, type: integer, source: computed, description: "Count of distinct Enrollee ids whose PAID claim total in this pool strictly exceeds the agreement's stop_loss_attachment_cents", default: 0 }
      - { name: loss_ratio_bps, type: integer, source: computed, description: "= round_half_up(paid_claims_cents * 10000 / funded_cents), or 0 when funded_cents == 0", default: 0 }
      - { name: deficit_flag, type: boolean, source: computed, description: "= loss_ratio_bps > POOL_DEFICIT_LOSS_RATIO_BPS (9500); strictly greater, equality does not flag", default: false }
      - { name: surplus_tier, type: enum, source: computed, description: "NONE | TIER_1 | TIER_2 | TIER_3 — keyed on the PRE-admin-fee surplus ratio; null before the pool reaches SETTLEMENT_PROPOSED", default: null }
      - { name: raw_surplus_cents, type: integer, source: computed, description: "= funded_cents - (paid_claims_cents - stop_loss_recovery_cents + ibnr_reserve_cents); may be negative", default: 0 }
      - { name: admin_fee_cents, type: integer, source: computed, description: "Per calculations.pool_settlement_waterfall step S7", default: 0 }
      - { name: distributable_surplus_cents, type: integer, source: computed, description: "= max(0, raw_surplus_cents) - admin_fee_cents", default: 0 }
      - { name: shared_savings_pool_cents, type: integer, source: computed, description: "= round_half_up(distributable_surplus_cents * SHARED_SAVINGS_SHARE_BPS_BY_TIER[surplus_tier] / 10000)", default: 0 }

  - name: DownstreamClaim
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> DelegationAgreement.id" }
      - { name: enrollee_id, type: string, source: input, description: "FK -> Enrollee.id" }
      - { name: attributed_physician_id, type: string, source: input, description: "FK -> PhysicianMember.id; the panel physician the claim is attributed to for shared-savings purposes" }
      - { name: pool_id, type: string, source: computed, description: "FK -> RiskPool.id; the RiskPool of this agreement whose pool_type == this.pool_type and whose [pool_year_start, pool_year_end] closed interval contains service_date" }
      - { name: pool_type, type: enum, source: input, description: "PROFESSIONAL | INSTITUTIONAL" }
      - { name: downstream_provider_name, type: string, source: input, description: "Rendering downstream provider" }
      - { name: billed_cents, type: integer, source: input, description: "Amount billed by the downstream provider", constraints: ">= 1" }
      - { name: service_date, type: datetime, source: input, description: "Date of service; drives pool attribution" }
      - { name: received_date, type: datetime, source: system, description: "Logical clock instant at claim intake" }
      - { name: allowed_cents, type: integer, source: system, description: "Allowed amount recorded by delegated adjudication; null until ADJUDICATED_APPROVED", default: null }
      - { name: paid_cents, type: integer, source: system, description: "= allowed_cents once the claim reaches PAID; reset to null on VOIDED", default: null }
      - { name: status, type: enum, source: system, description: "RECEIVED | ADJUDICATED_APPROVED | ADJUDICATED_DENIED | PAID | VOIDED", default: "RECEIVED" }
      - { name: denial_reason, type: enum, source: system, description: "NOT_COVERED | DUPLICATE | NO_AUTHORIZATION — set on ADJUDICATED_DENIED, cleared on appeal", default: null }
      - { name: appeal_count, type: integer, source: system, description: "Number of ADJUDICATED_DENIED → RECEIVED appeals taken; capped at APPEAL_LIMIT (2)", default: 0 }

  - name: StopLossRecovery
    parent: RiskPool
    common_fields: true
    fields:
      - { name: pool_id, type: string, source: input, description: "FK -> RiskPool.id" }
      - { name: enrollee_id, type: string, source: input, description: "FK -> Enrollee.id" }
      - { name: attachment_cents, type: integer, source: system, description: "Snapshot of DelegationAgreement.stop_loss_attachment_cents at creation" }
      - { name: eligible_paid_cents, type: integer, source: computed, description: "= sum of DownstreamClaim.paid_cents where enrollee_id == this.enrollee_id and pool_id == this.pool_id and status == PAID, evaluated at creation" }
      - { name: excess_cents, type: integer, source: computed, description: "= max(0, eligible_paid_cents - attachment_cents)" }
      - { name: recovery_cents, type: integer, source: computed, description: "= round_half_up(excess_cents * DelegationAgreement.reinsurance_recovery_bps / 10000)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | DENIED | RECOVERED", default: "DRAFT" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the ClaimsExaminer that moved this recovery to SUBMITTED; null before that", default: null }
      - { name: adjudicated_by_user_id, type: string, source: system, description: "X-User-ID of the ReinsuranceUnderwriter that approved or denied; must differ from submitted_by_user_id", default: null }
      - { name: denial_reason, type: enum, source: system, description: "BELOW_ATTACHMENT | LATE_FILING | POOL_SETTLED — set on DENIED", default: null }

  - name: QualityScorecard
    parent: PhysicianMember
    common_fields: true
    fields:
      - { name: physician_id, type: string, source: input, description: "FK -> PhysicianMember.id" }
      - { name: measurement_period, type: string, source: input, description: "Calendar year in YYYY form; matched against YEAR(RiskPool.pool_year_start) at settlement proposal", constraints: "matches ^[0-9]{4}$" }
      - { name: hedis_composite_bps, type: integer, source: input, description: "HEDIS composite performance in basis points", constraints: "0 <= value <= 10000" }
      - { name: access_score_bps, type: integer, source: input, description: "Access-to-care performance in basis points", constraints: "0 <= value <= 10000" }
      - { name: patient_experience_bps, type: integer, source: input, description: "Patient experience performance in basis points", constraints: "0 <= value <= 10000" }
      - { name: attributed_member_months, type: integer, source: input, description: "Member months attributed to this physician for the measurement period, as reported by the payer", constraints: ">= 0" }
      - { name: composite_score_bps, type: integer, source: computed, description: "Per calculations.quality_composite_and_withhold_release; 0 until FINAL", default: 0 }
      - { name: withhold_release_bps, type: integer, source: computed, description: "Basis points of this physician's withhold share released at settlement; 0 until FINAL", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | FINAL | SUPERSEDED", default: "DRAFT" }

  - name: PoolDistribution
    parent: RiskPool
    common_fields: true
    fields:
      - { name: pool_id, type: string, source: system, description: "FK -> RiskPool.id; set by the RESERVED → SETTLEMENT_PROPOSED cascade" }
      - { name: physician_id, type: string, source: system, description: "FK -> PhysicianMember.id; set by the same cascade" }
      - { name: composite_score_bps_snapshot, type: integer, source: system, description: "PhysicianMember.quality_composite_bps at proposal time" }
      - { name: withhold_release_bps_snapshot, type: integer, source: system, description: "withhold_release_bps of the FINAL QualityScorecard used at proposal time" }
      - { name: panel_member_months_bps, type: integer, source: computed, description: "Member months in basis points contributed by this physician's assignments across the pool's POSTED remittances" }
      - { name: withhold_share_cents, type: integer, source: computed, description: "Largest-remainder share of DelegationAgreement.withheld_balance_cents allocated by panel_member_months_bps" }
      - { name: withhold_release_cents, type: integer, source: computed, description: "= round_half_up(withhold_share_cents * withhold_release_bps_snapshot / 10000)" }
      - { name: shared_savings_cents, type: integer, source: computed, description: "Largest-remainder share of RiskPool.shared_savings_pool_cents allocated by panel_member_months_bps * composite_score_bps_snapshot" }
      - { name: net_distribution_cents, type: integer, source: computed, description: "= withhold_release_cents + shared_savings_cents" }
      - { name: status, type: enum, source: system, description: "PROPOSED | VOIDED | PAID", default: "PROPOSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: DelegationAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /ipa/delegation-agreements/{id}/state { to_state: ACTIVE }"
        actor: IpaAdmin
        preconditions:
          - "status == DRAFT"
          - "professional_pool_share_bps + institutional_pool_share_bps == 10000"
        side_effects:
          - "status = ACTIVE"
          - "capitation_posture = CURRENT"
          - "increments DelegationAgreement.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /ipa/delegation-agreements/{id}/state { to_state: SUSPENDED }"
        actor: IpaAdmin
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "status = SUSPENDED"
          - "every PhysicianMember of this agreement with panel_status == OPEN is set to CLOSED_TO_NEW"
          - "increments DelegationAgreement.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /ipa/delegation-agreements/{id}/state { to_state: ACTIVE }"
        actor: IpaAdmin
        preconditions: ["status == SUSPENDED"]
        side_effects:
          - "status = ACTIVE"
          - "increments DelegationAgreement.version by 1"
        note: "Suspend/reinstate cycle; panel_status values are NOT auto-reopened — reopening is an explicit PATCH per physician."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /ipa/delegation-agreements/{id}/state { to_state: TERMINATED }"
        actor: IpaAdmin
        preconditions:
          - "status == ACTIVE"
          - "no RiskPool of this agreement has status IN {ACCUMULATING, CLOSED_FOR_INCURRAL, RESERVED, SETTLEMENT_PROPOSED}"
        side_effects:
          - "status = TERMINATED"
          - "increments DelegationAgreement.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /ipa/delegation-agreements/{id}/state { to_state: TERMINATED }"
        actor: IpaAdmin
        preconditions:
          - "status == SUSPENDED"
          - "no RiskPool of this agreement has status IN {ACCUMULATING, CLOSED_FOR_INCURRAL, RESERVED, SETTLEMENT_PROPOSED}"
        side_effects:
          - "status = TERMINATED"
          - "increments DelegationAgreement.version by 1"

  - entity: PhysicianMember
    initial_state: APPLICANT
    terminal_states: [EXITED]
    note: |
      PhysicianMember carries TWO independent state dimensions on the same row.
      Dimension 1 (credential_status, this block): APPLICANT → CREDENTIALED →
      ACTIVE ⇄ NOTICE_GIVEN → EXITED.  Dimension 2 (panel_status, the block
      below): OPEN ⇄ CLOSED_TO_NEW, plus system-driven TRANSFER_PENDING and the
      terminal TRANSFERRED.  Neither dimension constrains the other's legal
      transitions except where a precondition says so explicitly.
    transitions:
      - from: APPLICANT
        to: CREDENTIALED
        trigger: "POST /ipa/physicians/{id}/state { to_state: CREDENTIALED }"
        actor: NetworkManager
        preconditions:
          - "credential_status == APPLICANT"
          - "DelegationAgreement.status == ACTIVE"
        side_effects:
          - "credential_status = CREDENTIALED"
          - "increments PhysicianMember.version by 1"
      - from: CREDENTIALED
        to: ACTIVE
        trigger: "POST /ipa/physicians/{id}/state { to_state: ACTIVE }"
        actor: NetworkManager
        preconditions:
          - "credential_status == CREDENTIALED"
          - "DelegationAgreement.status == ACTIVE"
        side_effects:
          - "credential_status = ACTIVE"
          - "increments PhysicianMember.version by 1"
      - from: ACTIVE
        to: NOTICE_GIVEN
        trigger: "POST /ipa/physicians/{id}/state { to_state: NOTICE_GIVEN }"
        actor: NetworkManager | PhysicianUser
        preconditions: ["credential_status == ACTIVE"]
        side_effects:
          - "credential_status = NOTICE_GIVEN"
          - "exit_notice_at = current logical clock instant"
          - "continuity_of_care_until = exit_notice_at + DelegationAgreement.continuity_of_care_days"
          - "panel_status is set to CLOSED_TO_NEW when it is OPEN (TRANSFER_PENDING and TRANSFERRED are left untouched)"
          - "increments PhysicianMember.version by 1"
      - from: NOTICE_GIVEN
        to: ACTIVE
        trigger: "POST /ipa/physicians/{id}/state { to_state: ACTIVE }"
        actor: NetworkManager
        preconditions: ["credential_status == NOTICE_GIVEN"]
        side_effects:
          - "credential_status = ACTIVE"
          - "exit_notice_at = null"
          - "continuity_of_care_until = null"
          - "panel_status is left unchanged"
          - "increments PhysicianMember.version by 1"
        note: "Rescind-notice cycle ACTIVE → NOTICE_GIVEN → ACTIVE on the credential dimension."
      - from: NOTICE_GIVEN
        to: EXITED
        trigger: "POST /ipa/physicians/{id}/state { to_state: EXITED }"
        actor: NetworkManager
        preconditions:
          - "credential_status == NOTICE_GIVEN"
          - "zero MemberAssignment rows with physician_id == this.id have status IN {ACTIVE, TRANSFER_PROPOSED, TRANSFER_ACCEPTED} (cross-entity dependency PhysicianMember → MemberAssignment)"
        side_effects:
          - "credential_status = EXITED"
          - "panel_status = TRANSFERRED"
          - "increments PhysicianMember.version by 1"

  - entity: PhysicianMember
    initial_state: OPEN
    terminal_states: [TRANSFERRED]
    note: "Second (panel) dimension of PhysicianMember; field panel_status."
    transitions:
      - from: OPEN
        to: CLOSED_TO_NEW
        trigger: "PATCH /ipa/physicians/{id}/panel-status { panel_status: CLOSED_TO_NEW }"
        actor: NetworkManager | PhysicianUser
        preconditions: ["panel_status == OPEN"]
        side_effects:
          - "panel_status = CLOSED_TO_NEW"
          - "increments PhysicianMember.version by 1"
      - from: CLOSED_TO_NEW
        to: OPEN
        trigger: "PATCH /ipa/physicians/{id}/panel-status { panel_status: OPEN }"
        actor: NetworkManager
        preconditions:
          - "panel_status == CLOSED_TO_NEW"
          - "credential_status == ACTIVE"
          - "DelegationAgreement.capitation_posture == CURRENT (posture gate; cross-entity dependency PhysicianMember → DelegationAgreement)"
        side_effects:
          - "panel_status = OPEN"
          - "increments PhysicianMember.version by 1"
        note: "Reopen cycle CLOSED_TO_NEW → OPEN → CLOSED_TO_NEW on the panel dimension."
      - from: OPEN
        to: TRANSFER_PENDING
        trigger: "system — POST /ipa/member-assignments/{id}/state { to_state: TRANSFER_PROPOSED } on any assignment held by this physician"
        actor: system
        preconditions: ["panel_status IN {OPEN, CLOSED_TO_NEW}"]
        side_effects:
          - "panel_status = TRANSFER_PENDING"
          - "increments PhysicianMember.version by 1"
      - from: CLOSED_TO_NEW
        to: TRANSFER_PENDING
        trigger: "system — same as above"
        actor: system
        preconditions: ["panel_status IN {OPEN, CLOSED_TO_NEW}"]
        side_effects:
          - "panel_status = TRANSFER_PENDING"
          - "increments PhysicianMember.version by 1"
      - from: TRANSFER_PENDING
        to: CLOSED_TO_NEW
        trigger: "system — the source physician's last assignment in status IN {TRANSFER_PROPOSED, TRANSFER_ACCEPTED} leaves those states (rejection back to ACTIVE, or completion to TRANSFERRED)"
        actor: system
        preconditions:
          - "panel_status == TRANSFER_PENDING"
          - "zero MemberAssignment rows with physician_id == this.id have status IN {TRANSFER_PROPOSED, TRANSFER_ACCEPTED}"
          - "credential_status != EXITED"
        side_effects:
          - "panel_status = CLOSED_TO_NEW"
          - "increments PhysicianMember.version by 1"
      - from: TRANSFER_PENDING
        to: TRANSFERRED
        trigger: "system — NOTICE_GIVEN → EXITED on the credential dimension"
        actor: system
        preconditions: ["panel_status == TRANSFER_PENDING", "credential_status transitions to EXITED"]
        side_effects:
          - "panel_status = TRANSFERRED"
          - "increments PhysicianMember.version by 1"
      - from: CLOSED_TO_NEW
        to: TRANSFERRED
        trigger: "system — NOTICE_GIVEN → EXITED on the credential dimension"
        actor: system
        preconditions: ["panel_status == CLOSED_TO_NEW", "credential_status transitions to EXITED"]
        side_effects:
          - "panel_status = TRANSFERRED"
          - "increments PhysicianMember.version by 1"

  - entity: MemberAssignment
    initial_state: ACTIVE
    terminal_states: [TRANSFERRED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: TRANSFER_PROPOSED
        trigger: "POST /ipa/member-assignments/{id}/state { to_state: TRANSFER_PROPOSED, to_physician_id, transfer_effective_date }"
        actor: NetworkManager
        preconditions:
          - "status == ACTIVE"
          - "to_physician_id resolves to a PhysicianMember with the same agreement_id as the assignment's current physician"
          - "target physician credential_status == ACTIVE"
          - "target physician panel_size < DelegationAgreement.max_panel_size"
          - "transfer_effective_date >= current logical clock instant"
        side_effects:
          - "status = TRANSFER_PROPOSED"
          - "pending_to_physician_id = to_physician_id"
          - "source PhysicianMember.panel_status = TRANSFER_PENDING"
          - "because the row left ACTIVE, source PhysicianMember.panel_size is recomputed (-1) and DelegationAgreement.total_assigned_members is recomputed (-1)"
          - "increments MemberAssignment.version by 1"
      - from: TRANSFER_PROPOSED
        to: ACTIVE
        trigger: "POST /ipa/member-assignments/{id}/state { to_state: ACTIVE }"
        actor: PhysicianUser
        preconditions:
          - "status == TRANSFER_PROPOSED"
          - "X-User-ID == pending_to_physician_id (only the transfer target may reject)"
        side_effects:
          - "status = ACTIVE"
          - "pending_to_physician_id = null"
          - "source PhysicianMember.panel_status = CLOSED_TO_NEW when no other assignment of that physician remains in TRANSFER_PROPOSED or TRANSFER_ACCEPTED — it does NOT return to OPEN"
          - "because the row returned to ACTIVE, source PhysicianMember.panel_size and DelegationAgreement.total_assigned_members are recomputed back to their exact pre-proposal values (compensating-action invariant on a count quantity)"
          - "increments MemberAssignment.version by 1"
        note: "Rejection cycle ACTIVE → TRANSFER_PROPOSED → ACTIVE; the compensating action of the proposal. The two count quantities are restored exactly; panel_status is deliberately NOT restored to OPEN."
      - from: TRANSFER_PROPOSED
        to: TRANSFER_ACCEPTED
        trigger: "POST /ipa/member-assignments/{id}/state { to_state: TRANSFER_ACCEPTED }"
        actor: PhysicianUser
        preconditions:
          - "status == TRANSFER_PROPOSED"
          - "X-User-ID == pending_to_physician_id"
          - "target physician credential_status == ACTIVE"
        side_effects:
          - "status = TRANSFER_ACCEPTED"
          - "increments MemberAssignment.version by 1"
      - from: TRANSFER_ACCEPTED
        to: TRANSFERRED
        trigger: "POST /ipa/member-assignments/{id}/state { to_state: TRANSFERRED }"
        actor: NetworkManager
        preconditions:
          - "status == TRANSFER_ACCEPTED"
          - "current logical clock instant >= the transfer_effective_date recorded on the proposal"
        side_effects:
          - "L1 — status = TRANSFERRED; term_date = transfer_effective_date"
          - "L2 — because this assignment termed, a successor MemberAssignment is created with enrollee_id unchanged, physician_id = pending_to_physician_id, effective_date = transfer_effective_date, assignment_source = PANEL_TRANSFER, status = ACTIVE, continuity_of_care_until = transfer_effective_date + DelegationAgreement.continuity_of_care_days"
          - "L3 — because the successor row is ACTIVE, source PhysicianMember.panel_size is recomputed (-1), target PhysicianMember.panel_size is recomputed (+1), and Enrollee.assigned_physician_id is repointed to the target physician"
          - "L4 — because the target physician's panel_size changed and now equals DelegationAgreement.max_panel_size, the target's panel_status moves OPEN → CLOSED_TO_NEW"
          - "pending_to_physician_id = null; source PhysicianMember.panel_status = CLOSED_TO_NEW when no other assignment of that physician remains in TRANSFER_PROPOSED or TRANSFER_ACCEPTED"
          - "DelegationAgreement.total_assigned_members is recomputed back to its pre-proposal value, because the successor row is ACTIVE where the predecessor no longer is"
          - "increments MemberAssignment.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /ipa/member-assignments/{id}/state { to_state: TERMINATED }"
        actor: NetworkManager
        preconditions:
          - "status == ACTIVE"
          - "the holding physician's continuity_of_care_until is null OR current logical clock instant >= continuity_of_care_until"
        side_effects:
          - "status = TERMINATED; term_date = current logical clock instant"
          - "PhysicianMember.panel_size recomputed (-1); Enrollee.assigned_physician_id = null"
          - "DelegationAgreement.total_assigned_members recomputed (-1)"
          - "increments MemberAssignment.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system — POST /ipa/member-assignments with supersede_prior: true for the same enrollee_id"
        actor: system
        preconditions: ["status == ACTIVE", "the new assignment's effective_date > this row's effective_date"]
        side_effects:
          - "status = TERMINATED; term_date = the new assignment's effective_date"
          - "superseded_by_assignment_id = the new assignment's id"
          - "PhysicianMember.panel_size recomputed (-1) for the prior physician"
          - "increments MemberAssignment.version by 1"
        note: "The supersede path bypasses the continuity-of-care gate because the enrollee keeps a panel physician without interruption."

  - entity: EnrollmentFile
    initial_state: RECEIVED
    terminal_states: [POSTED]
    transitions:
      - from: RECEIVED
        to: PARSED
        trigger: "POST /ipa/enrollment-files/{id}/state { to_state: PARSED }"
        actor: IpaAdmin | PayerRepresentative
        preconditions:
          - "status == RECEIVED"
          - "row_count >= 1"
        side_effects:
          - "status = PARSED"
          - "each EnrollmentFileRow of this file receives match_status per calculations.enrollment_row_matching"
          - "matched_row_count, exception_row_count and claimed_capitation_cents are recomputed"
          - "increments EnrollmentFile.version by 1"
      - from: PARSED
        to: RECONCILED
        trigger: "POST /ipa/enrollment-files/{id}/state { to_state: RECONCILED }"
        actor: IpaAdmin
        preconditions:
          - "status == PARSED"
          - "matched_row_count >= 1"
        side_effects:
          - "status = RECONCILED"
          - "a CapitationRemittance is created with status RECONCILED, reconciliation_method_used = DelegationAgreement.reconciliation_method, and every computed money field per calculations.expected_capitation_for_coverage_month and calculations.remittance_variance_and_allocation"
          - "DelegationAgreement.accrued_capitation_cents += (remittance.expected_capitation_cents + remittance.retro_adjustment_cents)"
          - "increments EnrollmentFile.version by 1 and DelegationAgreement.version by 1"
      - from: RECONCILED
        to: DISPUTED
        trigger: "POST /ipa/enrollment-files/{id}/state { to_state: DISPUTED, dispute_reason }"
        actor: PayerRepresentative
        preconditions:
          - "status == RECONCILED"
        side_effects:
          - "status = DISPUTED"
          - "the file's CapitationRemittance with status == RECONCILED moves to DISPUTED"
          - "DelegationAgreement.accrued_capitation_cents -= (that remittance's expected_capitation_cents + retro_adjustment_cents) — exactly reversing the RECONCILED accrual"
          - "DelegationAgreement.capitation_posture re-derived per calculations.capitation_posture_derivation (becomes WITHHELD)"
          - "increments EnrollmentFile.version by 1 and DelegationAgreement.version by 1"
        note: "Compensating action for PARSED → RECONCILED; the named conserved quantity is DelegationAgreement.accrued_capitation_cents."
      - from: DISPUTED
        to: RECEIVED
        trigger: "POST /ipa/enrollment-files/{id}/state { to_state: RECEIVED }"
        actor: PayerRepresentative
        preconditions: ["status == DISPUTED"]
        side_effects:
          - "status = RECEIVED"
          - "matched_row_count = 0, exception_row_count = 0, claimed_capitation_cents = 0; every row's match_status resets to UNMATCHED so a re-parse recomputes them"
          - "the DISPUTED CapitationRemittance is retained as history and is NOT reopened; a later RECONCILED creates a new remittance"
          - "DelegationAgreement.capitation_posture re-derived"
          - "increments EnrollmentFile.version by 1"
        note: "Resubmit cycle RECEIVED → PARSED → RECONCILED → DISPUTED → RECEIVED."
      - from: RECONCILED
        to: POSTED
        trigger: "POST /ipa/enrollment-files/{id}/state { to_state: POSTED }"
        actor: IpaAdmin
        preconditions:
          - "status == RECONCILED"
          - "DelegationAgreement.status == ACTIVE"
        side_effects:
          - "L1 — status = POSTED and the file's RECONCILED CapitationRemittance moves to POSTED"
          - "L2 — because that remittance became POSTED, each RiskPool of the agreement whose [pool_year_start, pool_year_end] contains the first instant of coverage_month is funded: PROFESSIONAL pool.funded_cents += remittance.professional_allocation_cents, INSTITUTIONAL pool.funded_cents += remittance.institutional_allocation_cents, and both pools' member_months_bps += remittance.member_month_count_bps; DelegationAgreement.withheld_balance_cents += remittance.withhold_cents"
          - "L3 — because each funded pool's funded_cents changed, that pool's loss_ratio_bps is recomputed and deficit_flag is set to (loss_ratio_bps > 9500)"
          - "L4 — because a pool's deficit_flag became true, DelegationAgreement.capitation_posture is re-derived to UNDER_REVIEW"
          - "L5 — because capitation_posture left CURRENT, every PhysicianMember of the agreement with panel_status == OPEN is set to CLOSED_TO_NEW"
          - "increments EnrollmentFile.version by 1, DelegationAgreement.version by 1, and the version of every mutated RiskPool and PhysicianMember by 1"

  - entity: CapitationRemittance
    initial_state: RECONCILED
    terminal_states: [DISPUTED, POSTED]
    transitions:
      - from: RECONCILED
        to: DISPUTED
        trigger: "system — EnrollmentFile RECONCILED → DISPUTED"
        actor: system
        preconditions: ["status == RECONCILED"]
        side_effects: ["status = DISPUTED", "increments CapitationRemittance.version by 1"]
      - from: RECONCILED
        to: POSTED
        trigger: "system — EnrollmentFile RECONCILED → POSTED"
        actor: system
        preconditions: ["status == RECONCILED"]
        side_effects: ["status = POSTED", "increments CapitationRemittance.version by 1"]

  - entity: RiskPool
    initial_state: ACCUMULATING
    terminal_states: [SETTLED]
    transitions:
      - from: ACCUMULATING
        to: CLOSED_FOR_INCURRAL
        trigger: "POST /ipa/risk-pools/{id}/state { to_state: CLOSED_FOR_INCURRAL }"
        actor: IpaAdmin
        preconditions:
          - "status == ACCUMULATING"
          - "current logical clock instant >= pool_year_end"
        side_effects:
          - "status = CLOSED_FOR_INCURRAL"
          - "increments RiskPool.version by 1"
        note: "Claims with a service_date inside the period may still be received and adjudicated after this point; only new incurral accounting is closed."
      - from: CLOSED_FOR_INCURRAL
        to: RESERVED
        trigger: "POST /ipa/risk-pools/{id}/state { to_state: RESERVED, ibnr_method_override? }"
        actor: IpaAdmin
        preconditions: ["status == CLOSED_FOR_INCURRAL"]
        side_effects:
          - "ibnr_method_used = ibnr_method_override when supplied, else DelegationAgreement.ibnr_method"
          - "ibnr_reserve_cents = calculations.ibnr_reserve_estimate under ibnr_method_used"
          - "status = RESERVED"
          - "increments RiskPool.version by 1"
      - from: RESERVED
        to: RESERVED
        trigger: "POST /ipa/risk-pools/{id}/state { to_state: RESERVED, ibnr_method_override? }"
        actor: IpaAdmin
        preconditions: ["status == RESERVED"]
        side_effects:
          - "ibnr_method_used and ibnr_reserve_cents are recomputed exactly as above"
          - "increments RiskPool.version by 1"
        note: "Self-loop re-estimate: the same pool data re-reserved under the other variant yields a different ibnr_reserve_cents."
      - from: RESERVED
        to: SETTLEMENT_PROPOSED
        trigger: "POST /ipa/risk-pools/{id}/state { to_state: SETTLEMENT_PROPOSED }"
        actor: IpaAdmin
        preconditions:
          - "status == RESERVED"
          - "every PhysicianMember of this agreement with credential_status IN {ACTIVE, NOTICE_GIVEN} has a QualityScorecard with status == FINAL and measurement_period == the four-digit year of pool_year_start (cross-entity dependency RiskPool → QualityScorecard)"
        side_effects:
          - "raw_surplus_cents, surplus_tier, admin_fee_cents, distributable_surplus_cents and shared_savings_pool_cents are computed per calculations.pool_settlement_waterfall"
          - "one PoolDistribution with status PROPOSED is created per qualifying PhysicianMember per calculations.pool_distribution_allocation"
          - "status = SETTLEMENT_PROPOSED"
          - "increments RiskPool.version by 1"
      - from: SETTLEMENT_PROPOSED
        to: RESERVED
        trigger: "POST /ipa/risk-pools/{id}/state { to_state: RESERVED, dispute_reason }"
        actor: PayerRepresentative
        preconditions: ["status == SETTLEMENT_PROPOSED"]
        side_effects:
          - "every PoolDistribution of this pool with status == PROPOSED moves to VOIDED"
          - "surplus_tier = null; admin_fee_cents = 0; distributable_surplus_cents = 0; shared_savings_pool_cents = 0; raw_surplus_cents = 0"
          - "ibnr_reserve_cents and ibnr_method_used are retained"
          - "status = RESERVED"
          - "increments RiskPool.version by 1"
        note: "Settlement dispute cycle RESERVED → SETTLEMENT_PROPOSED → RESERVED; a re-proposal recomputes the waterfall from current data."
      - from: SETTLEMENT_PROPOSED
        to: SETTLED
        trigger: "POST /ipa/risk-pools/{id}/state { to_state: SETTLED }"
        actor: IpaAdmin
        preconditions:
          - "status == SETTLEMENT_PROPOSED"
          - "current logical clock instant >= settlement_due_date"
        side_effects:
          - "every PoolDistribution of this pool with status == PROPOSED moves to PAID"
          - "DelegationAgreement.withheld_balance_cents -= sum of those distributions' withhold_share_cents"
          - "DelegationAgreement.forfeited_withhold_cents += sum of (withhold_share_cents - withhold_release_cents) over those distributions"
          - "status = SETTLED"
          - "increments RiskPool.version by 1 and DelegationAgreement.version by 1"

  - entity: DownstreamClaim
    initial_state: RECEIVED
    terminal_states: [VOIDED]
    note: "Branching fork RECEIVED → {ADJUDICATED_APPROVED, ADJUDICATED_DENIED} with divergent side-effect sets, plus the appeal cycle ADJUDICATED_DENIED → RECEIVED."
    transitions:
      - from: RECEIVED
        to: ADJUDICATED_APPROVED
        trigger: "POST /ipa/downstream-claims/{id}/state { to_state: ADJUDICATED_APPROVED, allowed_cents }"
        actor: ClaimsExaminer
        preconditions:
          - "status == RECEIVED"
          - "DelegationAgreement.delegation_scope IN {CLAIMS_ONLY, CLAIMS_AND_UM, FULL_RISK}"
          - "allowed_cents <= billed_cents"
        side_effects:
          - "status = ADJUDICATED_APPROVED; allowed_cents recorded; denial_reason = null"
          - "increments DownstreamClaim.version by 1"
      - from: RECEIVED
        to: ADJUDICATED_DENIED
        trigger: "POST /ipa/downstream-claims/{id}/state { to_state: ADJUDICATED_DENIED, denial_reason }"
        actor: ClaimsExaminer
        preconditions: ["status == RECEIVED"]
        side_effects:
          - "status = ADJUDICATED_DENIED; denial_reason recorded; allowed_cents = 0"
          - "no pool ledger movement occurs on this branch"
          - "increments DownstreamClaim.version by 1"
      - from: ADJUDICATED_DENIED
        to: RECEIVED
        trigger: "POST /ipa/downstream-claims/{id}/state { to_state: RECEIVED }"
        actor: NetworkManager | PhysicianUser
        preconditions:
          - "status == ADJUDICATED_DENIED"
          - "appeal_count < 2 (APPEAL_LIMIT)"
        side_effects:
          - "status = RECEIVED; appeal_count += 1; denial_reason = null; allowed_cents = null"
          - "increments DownstreamClaim.version by 1"
        note: "Appeal cycle; a third appeal is rejected with ERR_INVALID_STATE_TRANSITION."
      - from: ADJUDICATED_APPROVED
        to: PAID
        trigger: "POST /ipa/downstream-claims/{id}/state { to_state: PAID }"
        actor: ClaimsExaminer
        preconditions:
          - "status == ADJUDICATED_APPROVED"
          - "pool_id resolves to a RiskPool with status != SETTLED"
        side_effects:
          - "L1 — status = PAID; paid_cents = allowed_cents"
          - "L2 — because paid_cents was set, RiskPool.paid_claims_cents += paid_cents and that pool's loss_ratio_bps is recomputed"
          - "L3 — because the pool's paid ledger moved, Enrollee.cumulative_paid_claims_cents += paid_cents and, when that enrollee's PAID total in this pool strictly exceeds DelegationAgreement.stop_loss_attachment_cents for the first time, RiskPool.stop_loss_eligible_enrollee_count += 1"
          - "L4 — because loss_ratio_bps changed, deficit_flag is re-evaluated as (loss_ratio_bps > 9500) and, when it becomes true, DelegationAgreement.capitation_posture is re-derived to UNDER_REVIEW"
          - "increments DownstreamClaim.version by 1, RiskPool.version by 1 and Enrollee.version by 1"
      - from: PAID
        to: VOIDED
        trigger: "POST /ipa/downstream-claims/{id}/state { to_state: VOIDED }"
        actor: ClaimsExaminer
        preconditions:
          - "status == PAID"
          - "pool_id resolves to a RiskPool with status IN {ACCUMULATING, CLOSED_FOR_INCURRAL}"
        side_effects:
          - "status = VOIDED; the recouped amount is removed: RiskPool.paid_claims_cents -= paid_cents, Enrollee.cumulative_paid_claims_cents -= paid_cents, then paid_cents = null"
          - "RiskPool.loss_ratio_bps, deficit_flag and stop_loss_eligible_enrollee_count are recomputed; DelegationAgreement.capitation_posture is re-derived"
          - "increments DownstreamClaim.version by 1, RiskPool.version by 1 and Enrollee.version by 1"
        note: "Compensating action for ADJUDICATED_APPROVED → PAID; the named conserved quantity is RiskPool.paid_claims_cents."
      - from: ADJUDICATED_DENIED
        to: VOIDED
        trigger: "POST /ipa/downstream-claims/{id}/state { to_state: VOIDED }"
        actor: ClaimsExaminer
        preconditions: ["status == ADJUDICATED_DENIED", "appeal_count == 2"]
        side_effects:
          - "status = VOIDED; no ledger movement (the claim never paid)"
          - "increments DownstreamClaim.version by 1"

  - entity: StopLossRecovery
    initial_state: DRAFT
    terminal_states: [DENIED, RECOVERED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /ipa/stop-loss-recoveries/{id}/state { to_state: SUBMITTED }"
        actor: ClaimsExaminer
        preconditions: ["status == DRAFT", "excess_cents > 0"]
        side_effects:
          - "status = SUBMITTED; submitted_by_user_id = X-User-ID"
          - "increments StopLossRecovery.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /ipa/stop-loss-recoveries/{id}/state { to_state: APPROVED }"
        actor: ReinsuranceUnderwriter
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != submitted_by_user_id (segregation of duties)"
          - "RiskPool.status IN {ACCUMULATING, CLOSED_FOR_INCURRAL, RESERVED} (cross-entity dependency StopLossRecovery → RiskPool)"
        side_effects:
          - "status = APPROVED; adjudicated_by_user_id = X-User-ID"
          - "RiskPool.stop_loss_recovery_cents += recovery_cents"
          - "increments StopLossRecovery.version by 1 and RiskPool.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /ipa/stop-loss-recoveries/{id}/state { to_state: DENIED, denial_reason }"
        actor: ReinsuranceUnderwriter
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != submitted_by_user_id"
        side_effects:
          - "status = DENIED; adjudicated_by_user_id = X-User-ID; denial_reason recorded"
          - "increments StopLossRecovery.version by 1"
      - from: APPROVED
        to: RECOVERED
        trigger: "POST /ipa/stop-loss-recoveries/{id}/state { to_state: RECOVERED }"
        actor: IpaAdmin
        preconditions: ["status == APPROVED"]
        side_effects:
          - "status = RECOVERED"
          - "RiskPool.stop_loss_recovery_cents is unchanged (already recognised at APPROVED)"
          - "increments StopLossRecovery.version by 1"

  - entity: QualityScorecard
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINAL
        trigger: "POST /ipa/quality-scorecards/{id}/state { to_state: FINAL }"
        actor: IpaAdmin
        preconditions:
          - "status == DRAFT"
          - "PhysicianMember.credential_status IN {ACTIVE, NOTICE_GIVEN}"
        side_effects:
          - "composite_score_bps and withhold_release_bps computed per calculations.quality_composite_and_withhold_release"
          - "status = FINAL"
          - "any other QualityScorecard of the same physician with the same measurement_period and status == FINAL moves to SUPERSEDED"
          - "PhysicianMember.quality_composite_bps = this scorecard's composite_score_bps"
          - "increments QualityScorecard.version by 1 and PhysicianMember.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system — POST /ipa/quality-scorecards creates a newer scorecard for the same physician_id and measurement_period"
        actor: system
        preconditions: ["status == DRAFT"]
        side_effects: ["status = SUPERSEDED", "increments QualityScorecard.version by 1"]
      - from: FINAL
        to: SUPERSEDED
        trigger: "system — a newer scorecard for the same physician_id and measurement_period reaches FINAL"
        actor: system
        preconditions: ["status == FINAL"]
        side_effects: ["status = SUPERSEDED", "increments QualityScorecard.version by 1"]

  - entity: PoolDistribution
    initial_state: PROPOSED
    terminal_states: [VOIDED, PAID]
    transitions:
      - from: PROPOSED
        to: VOIDED
        trigger: "system — RiskPool SETTLEMENT_PROPOSED → RESERVED"
        actor: system
        preconditions: ["status == PROPOSED"]
        side_effects: ["status = VOIDED", "increments PoolDistribution.version by 1"]
      - from: PROPOSED
        to: PAID
        trigger: "system — RiskPool SETTLEMENT_PROPOSED → SETTLED"
        actor: system
        preconditions: ["status == PROPOSED"]
        side_effects: ["status = PAID", "increments PoolDistribution.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-enrollee
    parent_entity: Enrollee
    write_endpoint: "POST /ipa/member-assignments"
    occ_field: "expected_enrollee_version"
    description: |
      Creating a MemberAssignment against an Enrollee whose version has advanced
      since the client last read it is rejected. This captures the case where a
      prior create with supersede_prior: true has already re-pointed
      Enrollee.assigned_physician_id (which the product legitimately allows a
      later assignment to supersede), so the current writer's view of the
      enrollee's panel placement is stale.
    error_id: ERR_STALE_ENROLLEE_VERSION
    http_status: 412

  - rule_id: scorecard-create-stale-physician
    parent_entity: PhysicianMember
    write_endpoint: "POST /ipa/quality-scorecards"
    occ_field: "expected_physician_version"
    description: |
      Creating a QualityScorecard against a PhysicianMember whose version has
      advanced since the client last read it is rejected. A new scorecard for the
      same physician and measurement_period legitimately supersedes the prior one,
      so the guard is a stale-version check rather than a uniqueness conflict:
      without it a writer working from an outdated read would silently supersede a
      scorecard it never saw.
    error_id: ERR_STALE_PHYSICIAN_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: member_pmpm_components
    trigger: "On POST /ipa/delegation-agreements/{id}/enrollees, and re-derived whenever the agreement's base_pmpm_cents or quality_withhold_bps changes via a DRAFT → ACTIVE activation."
    algorithm: threshold
    formula: |
      raw_cents        = round_half_up(agreement.base_pmpm_cents
                                       * AGE_BAND_FACTOR_BPS[enrollee.age_band] / 10000
                                       * enrollee.risk_score_bps / 10000)
                         + BENEFIT_TIER_ADD_CENTS[enrollee.benefit_tier]
      # nested clamp: the ceiling is applied to the floored value, so an enrollee
      # below the floor can never be pushed above the ceiling and vice versa
      gross_pmpm_cents = min(PMPM_CEILING_CENTS, max(PMPM_FLOOR_CENTS, raw_cents))
      withhold_cents   = round_half_up(gross_pmpm_cents * agreement.quality_withhold_bps / 10000)
      net_pmpm_cents   = gross_pmpm_cents - withhold_cents
      # the multiplication chain is evaluated left-to-right on the *unrounded*
      # product and rounded ONCE, before the tier add-on is applied; the tier
      # add-on is a flat cent amount and is never risk-adjusted
    input_set: "The single Enrollee being created or re-derived, plus its parent DelegationAgreement. Enrollees of agreements in status TERMINATED are not re-derived."
    constants:
      AGE_BAND_FACTOR_BPS: { PEDIATRIC: 6500, ADULT: 10000, SENIOR: 14500 }
      BENEFIT_TIER_ADD_CENTS: { HMO: 0, POS: 1200, HMO_PLUS: 2500 }
      PMPM_FLOOR_CENTS: 8000
      PMPM_CEILING_CENTS: 95000
    precision: "whole cents, round_half_up; a single rounding step on the risk-adjusted product, then integer arithmetic only"
    worked_examples: |
      agreement.base_pmpm_cents = 30000, quality_withhold_bps = 700
      ADULT/HMO/risk 12500      -> raw 37500 -> gross 37500 -> withhold 2625 -> net 34875
      SENIOR/HMO_PLUS/risk 20000-> raw 89500 -> gross 89500 -> withhold 6265 -> net 83235
      PEDIATRIC/HMO/risk 3000   -> raw  5850 -> FLOOR   8000 -> withhold  560 -> net  7440
      SENIOR/HMO_PLUS/risk 22000-> raw 98200 -> CEILING 95000-> withhold 6650 -> net 88350

  - name: enrollment_row_matching
    trigger: "On the EnrollmentFile RECEIVED → PARSED transition, for every EnrollmentFileRow of the file."
    algorithm: projection
    formula: |
      enrollee  = Enrollee where agreement_id == file.agreement_id
                              and external_member_id == row.external_member_id
      physician = PhysicianMember where agreement_id == file.agreement_id
                                    and npi == row.physician_npi
      if enrollee is null:
          match_status = UNMATCHED
      elif physician is null:
          match_status = MATCHED_ENROLLEE_ONLY
      elif physician.credential_status NOT IN {ACTIVE, NOTICE_GIVEN}:
          match_status = EXCEPTION_PHYSICIAN_INACTIVE
      else:
          match_status = MATCHED
      file.matched_row_count   = count(rows where match_status == MATCHED)
      file.exception_row_count = file.row_count - file.matched_row_count
    input_set: "All EnrollmentFileRow rows of the file; matching is scoped to the file's own agreement — an identical external_member_id under a different agreement never matches."
    constants: {}
    precision: "exact string equality on external_member_id and physician_npi; no trimming, no case folding"

  - name: file_claimed_capitation
    trigger: "On the EnrollmentFile RECEIVED → PARSED transition (file totals) and again on PARSED → RECONCILED (remittance snapshot)."
    algorithm: aggregation
    formula: |
      claimed_capitation_cents = sum(row.claimed_capitation_cents
                                     for row in file.rows
                                     if row.match_status == MATCHED
                                     and row.row_action IN {ADD, CHANGE, TERM})
      retro_adjustment_cents   = sum(+row.claimed_capitation_cents for MATCHED rows with row_action == RETRO_ADD)
                               - sum( row.claimed_capitation_cents for MATCHED rows with row_action == RETRO_TERM)
      # rows with match_status != MATCHED contribute to NEITHER total; they are
      # exceptions the payer must resolve on resubmission
    input_set: "EnrollmentFileRow rows of this file whose match_status == MATCHED. UNMATCHED, MATCHED_ENROLLEE_ONLY and EXCEPTION_PHYSICIAN_INACTIVE rows are excluded from both totals."
    constants: {}
    precision: "whole cents; pure integer summation, no rounding"

  - name: expected_capitation_for_coverage_month
    trigger: "On the EnrollmentFile PARSED → RECONCILED transition, when the CapitationRemittance is created."
    algorithm: chronological
    formula: |
      month_start = first instant of file.coverage_month
      month_end   = last instant of file.coverage_month
      days_in_month = calendar day count of file.coverage_month
      roster = every Enrollee of file.agreement_id that has at least one
               MemberAssignment whose half-open [effective_date, term_date)
               interval overlaps [month_start, month_end], in ANY status — the
               interval itself records when the enrollee occupied a panel slot,
               so a member who termed mid-month is still owed the days served

      # ---- variant-specific per-enrollee amount, then a common summation ----
      per_member = []
      for e in roster ordered by e.created_at ASC:            # never by id
          covered_days = count of days d in the coverage month such that some
                         qualifying assignment interval [effective_date, term_date)
                         of e contains d, and month-clamped coverage
                         [e.coverage_start_date, e.coverage_end_date] contains d
          per_member.append(<variant amount>)                  # see variants
      expected_capitation_cents = sum(per_member)              # sum of ALREADY-rounded per-member amounts
      member_month_count_bps    = sum over roster of round_half_up(covered_days * 10000 / days_in_month)

      # ORDER IS PINNED: round each member's amount to whole cents FIRST, then sum.
      # Summing unrounded prorated amounts and rounding the total once is WRONG
      # and diverges by cents on realistic rosters.
    input_set: "Enrollees of the file's agreement with at least one assignment interval overlapping the coverage month. Enrollees with no assignment at all, enrollees whose assignments term at or before month_start, enrollees whose assignments start after month_end, and enrollees of other agreements are all excluded."
    constants: {}
    precision: "whole cents, round_half_up, applied PER ENROLLEE before summation; member_month_count_bps likewise rounded per enrollee then summed"
    variants:
      - name: ROSTER_SNAPSHOT
        when: "DelegationAgreement.reconciliation_method == ROSTER_SNAPSHOT (snapshot of the method taken at reconcile time and stored on CapitationRemittance.reconciliation_method_used)"
        difference: |
          Amount per enrollee = e.gross_pmpm_cents when a qualifying assignment
          covers month_start itself, else 0. Mid-month adds contribute nothing;
          mid-month terms contribute the full month. covered_days is ignored for
          the money amount, and member_month_count_bps contributes 10000 per
          enrollee on the snapshot date, 0 otherwise.
      - name: MEMBER_MONTHS_PRORATED
        when: "DelegationAgreement.reconciliation_method == MEMBER_MONTHS_PRORATED"
        difference: |
          Amount per enrollee = round_half_up(e.gross_pmpm_cents * covered_days
          / days_in_month). Mid-month adds and terms are both prorated by covered
          days, and member_month_count_bps reflects fractional member months.
    worked_examples: |
      coverage_month 2026-07 (31 days), agreement base_pmpm 30000 / withhold 700
      E1 ADULT/HMO/12500       gross 37500, assigned all 31 days
      E2 SENIOR/HMO_PLUS/20000 gross 89500, assignment effective 2026-07-16 (16 days)
      E3 PEDIATRIC/HMO/3000    gross  8000, effective 2026-07-01 term 2026-07-11 (10 days)
      MEMBER_MONTHS_PRORATED -> per member [37500, 46194, 2581] -> 86275
        (sum-then-round would give 86274 — the pinned order is per-member-then-sum)
      ROSTER_SNAPSHOT        -> 37500 + 0 + 8000 = 45500 (E2 excluded, not on roster at 2026-07-01)
      member_month_count_bps (prorated) = 10000 + 5161 + 3226 = 18387

  - name: remittance_variance_and_allocation
    trigger: "On the EnrollmentFile PARSED → RECONCILED transition, immediately after expected_capitation_for_coverage_month."
    algorithm: waterfall_allocation
    formula: |
      S1 claimed_capitation_cents      = file.claimed_capitation_cents          # snapshot
      S2 retro_adjustment_cents        = file retro net (see file_claimed_capitation)
      S3 variance_cents                = claimed_capitation_cents + retro_adjustment_cents
                                         - expected_capitation_cents            # may be negative
      S4 withhold_cents                = round_half_up(expected_capitation_cents
                                                       * agreement.quality_withhold_bps / 10000)
      S5 net_payable_cents             = expected_capitation_cents - withhold_cents
                                         + retro_adjustment_cents
      S6 institutional_allocation_cents= round_half_up(net_payable_cents
                                                       * agreement.institutional_pool_share_bps / 10000)
      S7 professional_allocation_cents = net_payable_cents - institutional_allocation_cents
      # The withhold is rounded ONCE at remittance level on the expected total.
      # It is NOT the sum of the per-enrollee Enrollee.withhold_cents values —
      # those two quantities differ by cents and only S4 is authoritative.
      # The professional bucket is the residual, so the two allocations always
      # re-sum to net_payable_cents with zero drift.
    input_set: "The single CapitationRemittance being created plus its parent EnrollmentFile and DelegationAgreement."
    constants: {}
    precision: "whole cents, round_half_up; exactly two rounding steps (S4 and S6), residual absorbed by S7"
    worked_examples: |
      expected 86275, claimed 80081, retro 0, quality_withhold_bps 700,
      institutional_pool_share_bps 4000, professional_pool_share_bps 6000
      variance = 80081 - 86275 = -6194
      withhold = round_half_up(86275 * 700 / 10000) = 6039
        (per-enrollee withhold sum for the same roster = 6040 — divergent, and wrong)
      net_payable = 86275 - 6039 = 80236
      institutional = round_half_up(80236 * 4000 / 10000) = 32094
      professional  = 80236 - 32094 = 48142

  - name: capitation_posture_derivation
    trigger: "Re-derived on every transition that changes a CapitationRemittance status, a RiskPool.deficit_flag, or an EnrollmentFile status."
    algorithm: constraint_propagation
    formula: |
      # strict precedence, first match wins — never a bitmask or a sum
      if any CapitationRemittance of this agreement has status == DISPUTED:
          capitation_posture = WITHHELD
      elif any RiskPool of this agreement has deficit_flag == true:
          capitation_posture = UNDER_REVIEW
      else:
          capitation_posture = CURRENT
      # WITHHELD dominates UNDER_REVIEW: an agreement with BOTH a disputed
      # remittance AND a deficit pool reads WITHHELD, and resolving only the
      # deficit leaves it WITHHELD.
    input_set: "All CapitationRemittance rows and all RiskPool rows of this agreement, in any status."
    constants: {}
    precision: "exact enum; no intermediate numeric value"

  - name: pool_loss_ratio_and_deficit
    trigger: "Recomputed on every RiskPool.funded_cents or RiskPool.paid_claims_cents movement — i.e. on EnrollmentFile RECONCILED → POSTED, DownstreamClaim ADJUDICATED_APPROVED → PAID, and DownstreamClaim PAID → VOIDED."
    algorithm: threshold
    formula: |
      loss_ratio_bps = 0 if funded_cents == 0
                       else round_half_up(paid_claims_cents * 10000 / funded_cents)
      deficit_flag   = loss_ratio_bps > POOL_DEFICIT_LOSS_RATIO_BPS
      # STRICTLY greater. A ratio of exactly 9500 bps does NOT flag a deficit.
    input_set: "The single RiskPool being recomputed. Only DownstreamClaim rows with status == PAID contribute to paid_claims_cents; RECEIVED, ADJUDICATED_APPROVED, ADJUDICATED_DENIED and VOIDED claims contribute nothing."
    constants:
      POOL_DEFICIT_LOSS_RATIO_BPS: 9500
    precision: "whole basis points, round_half_up"
    worked_examples: |
      funded 20000, paid 19000 -> 9500 bps -> deficit_flag false (equality does not flag)
      funded 20000, paid 19001 -> 9501 bps -> deficit_flag true

  - name: ibnr_reserve_estimate
    trigger: "On the RiskPool CLOSED_FOR_INCURRAL → RESERVED transition and on every RESERVED → RESERVED re-estimate."
    algorithm: forward_looking
    formula: |
      method = ibnr_method_override if supplied on the request
               else agreement.ibnr_method
      ibnr_reserve_cents = <variant result>   # see variants; never negative
      ibnr_method_used   = method
    input_set: "DownstreamClaim rows with pool_id == this pool and status == PAID (the reported side of the triangle). Claims in RECEIVED, ADJUDICATED_APPROVED, ADJUDICATED_DENIED or VOIDED are NOT reported for reserving purposes even though a RECEIVED claim is literally known — the reserve models the unreported tail relative to the *paid* triangle."
    constants: {}
    precision: "whole cents, round_half_up; a single rounding step per variant, then max(0, ...)"
    variants:
      - name: COMPLETION_FACTOR
        when: "method == COMPLETION_FACTOR"
        difference: |
          ultimate_cents = round_half_up(paid_claims_cents * 10000
                                         / agreement.ibnr_completion_factor_bps)
          ibnr = max(0, ultimate_cents - paid_claims_cents)
          Scales the observed paid triangle up to ultimate; independent of
          enrolment volume, so a pool with few member months and heavy paid
          claims reserves a large tail.
      - name: PMPM_LOSS_RATIO
        when: "method == PMPM_LOSS_RATIO"
        difference: |
          expected_cents = round_half_up(agreement.target_claims_pmpm_cents
                                         * pool.member_months_bps / 10000)
          ibnr = max(0, expected_cents - paid_claims_cents)
          Anchors on exposure rather than on the paid triangle; when paid claims
          already exceed the exposure-based expectation the reserve collapses to 0.
    worked_examples: |
      pool funded 20000, paid_claims 13520, member_months_bps 10000,
      ibnr_completion_factor_bps 8000, target_claims_pmpm_cents 15000
      COMPLETION_FACTOR: ultimate = round_half_up(13520 * 10000 / 8000) = 16900
                         ibnr = 16900 - 13520 = 3380
      PMPM_LOSS_RATIO:   expected = round_half_up(15000 * 10000 / 10000) = 15000
                         ibnr = 15000 - 13520 = 1480
      Same pool data, two methods, 3380 vs 1480 — a re-estimate under the other
      variant changes the reserve and therefore the whole settlement waterfall.

  - name: stop_loss_recovery
    trigger: "On POST /ipa/stop-loss-recoveries, when the recovery row is created."
    algorithm: threshold
    formula: |
      attachment_cents    = agreement.stop_loss_attachment_cents        # snapshotted
      eligible_paid_cents = sum(claim.paid_cents
                                for claim in DownstreamClaim
                                if claim.enrollee_id == this.enrollee_id
                                and claim.pool_id == this.pool_id
                                and claim.status == PAID)
      excess_cents        = max(0, eligible_paid_cents - attachment_cents)
      recovery_cents      = round_half_up(excess_cents
                                          * agreement.reinsurance_recovery_bps / 10000)
      # Attachment is pierced only when eligible_paid_cents is STRICTLY greater
      # than attachment_cents. Exactly at attachment, excess_cents == 0 and the
      # create is rejected with ERR_STOP_LOSS_NOT_ATTACHED.
    input_set: "PAID DownstreamClaim rows for this enrollee in this pool only. Claims for the same enrollee in the *other* pool_type's pool never cross-apply, and VOIDED claims drop out of the sum."
    constants: {}
    precision: "whole cents, round_half_up; one rounding step"
    worked_examples: |
      attachment 5000000, reinsurance_recovery_bps 9000
      eligible_paid 5000000 -> excess 0       -> create rejected ERR_STOP_LOSS_NOT_ATTACHED
      eligible_paid 5000001 -> excess 1       -> recovery round_half_up(0.9) = 1
      eligible_paid 6000000 -> excess 1000000 -> recovery 900000

  - name: pool_settlement_waterfall
    trigger: "On the RiskPool RESERVED → SETTLEMENT_PROPOSED transition."
    algorithm: waterfall_allocation
    formula: |
      S1 gross_claims_cents        = pool.paid_claims_cents
      S2 recovery_cents            = pool.stop_loss_recovery_cents
      S3 net_claims_cents          = gross_claims_cents - recovery_cents + pool.ibnr_reserve_cents
      S4 raw_surplus_cents         = pool.funded_cents - net_claims_cents        # may be negative
      S5 surplus_ratio_bps         = 0 if raw_surplus_cents <= 0 or funded_cents == 0
                                     else floor(raw_surplus_cents * 10000 / pool.funded_cents)
         surplus_tier              = NONE   if raw_surplus_cents <= 0
                                     TIER_1 if surplus_ratio_bps <= 500
                                     TIER_2 if 500 < surplus_ratio_bps <= 1500
                                     TIER_3 if surplus_ratio_bps > 1500
      S6 admin_fee_bps             = ADMIN_FEE_BPS_BY_TIER[surplus_tier]
      S7 admin_fee_cents           = round_half_up(max(0, raw_surplus_cents) * admin_fee_bps / 10000)
      S8 distributable_surplus_cents = max(0, raw_surplus_cents) - admin_fee_cents
      S9 shared_savings_pool_cents = round_half_up(distributable_surplus_cents
                                     * SHARED_SAVINGS_SHARE_BPS_BY_TIER[surplus_tier] / 10000)

      # STEP ORDER IS PINNED. surplus_tier is keyed on the PRE-admin-fee ratio
      # computed at S5. Recomputing the ratio after the admin fee is deducted
      # (i.e. re-tiering on distributable_surplus_cents / funded_cents) is
      # FORBIDDEN and produces a different tier, a different share rate, and a
      # different shared_savings_pool_cents on the same data.
      # S5's ratio uses floor, NOT round_half_up: a surplus ratio of 1500.6 bps
      # stays in TIER_2.
    input_set: "The single RiskPool. funded_cents reflects only POSTED remittances; paid_claims_cents only PAID claims; stop_loss_recovery_cents only APPROVED and RECOVERED recoveries (DRAFT, SUBMITTED and DENIED recoveries are excluded)."
    constants:
      ADMIN_FEE_BPS_BY_TIER: { NONE: 0, TIER_1: 300, TIER_2: 600, TIER_3: 1000 }
      SHARED_SAVINGS_SHARE_BPS_BY_TIER: { NONE: 0, TIER_1: 4000, TIER_2: 5000, TIER_3: 6000 }
      SETTLEMENT_LAG_DAYS: { PROFESSIONAL: 180, INSTITUTIONAL: 270 }
    precision: "whole cents, round_half_up at S7 and S9; whole basis points, floor at S5"
    worked_examples: |
      funded 20000, paid_claims 13520, stop_loss_recovery 0, ibnr 3380
      S3 net_claims = 13520 - 0 + 3380 = 16900
      S4 raw_surplus = 20000 - 16900 = 3100
      S5 ratio = floor(3100 * 10000 / 20000) = 1550 -> TIER_3
      S6 admin_fee_bps = 1000 ; S7 admin_fee = 310
      S8 distributable = 3100 - 310 = 2790
      S9 shared_savings_pool = round_half_up(2790 * 6000 / 10000) = 1674
      Post-fee re-tiering (FORBIDDEN) would give floor(2790*10000/20000) = 1395
      -> TIER_2 -> 5000 bps -> 1395, a different and incorrect answer.

  - name: quality_composite_and_withhold_release
    trigger: "On the QualityScorecard DRAFT → FINAL transition."
    algorithm: weighted_scoring
    formula: |
      composite_score_bps = round_half_up(
            scorecard.hedis_composite_bps      * QUALITY_WEIGHTS_BPS.hedis              / 10000
          + scorecard.access_score_bps         * QUALITY_WEIGHTS_BPS.access             / 10000
          + scorecard.patient_experience_bps   * QUALITY_WEIGHTS_BPS.patient_experience / 10000)
      # weights sum to exactly 10000 bps; the weighted sum is accumulated
      # unrounded and rounded ONCE at the end, so per-term rounding drift
      # cannot creep into the composite
      withhold_release_bps = 10000 if composite_score_bps >= 8500
                             7500  if composite_score_bps >= 7000
                             5000  if composite_score_bps >= 5500
                             0     otherwise
      # each band uses >= : a composite of exactly 8500 releases the FULL withhold
    input_set: "The single QualityScorecard being finalised. SUPERSEDED and DRAFT scorecards never contribute to PhysicianMember.quality_composite_bps."
    constants:
      QUALITY_WEIGHTS_BPS: { hedis: 5000, access: 2000, patient_experience: 3000 }
      WITHHOLD_RELEASE_FULL_THRESHOLD_BPS: 8500
      WITHHOLD_RELEASE_HIGH_THRESHOLD_BPS: 7000
      WITHHOLD_RELEASE_PARTIAL_THRESHOLD_BPS: 5500
    precision: "whole basis points, round_half_up, single rounding step on the accumulated weighted sum"
    worked_examples: |
      hedis 9000 / access 8000 / experience 7000
        -> 4500 + 1600 + 2100 = 8200 bps -> withhold_release_bps 7500
      hedis 7000 / access 7000 / experience 7000
        -> 3500 + 1400 + 2100 = 7000 bps -> withhold_release_bps 7500 (band edge, >=)
      hedis 8500 / access 8500 / experience 8500
        -> 8500 bps -> withhold_release_bps 10000

  - name: pool_distribution_allocation
    trigger: "On the RiskPool RESERVED → SETTLEMENT_PROPOSED transition, after pool_settlement_waterfall."
    algorithm: waterfall_allocation
    formula: |
      participants = PhysicianMember rows of this agreement with
                     credential_status IN {ACTIVE, NOTICE_GIVEN} and a
                     QualityScorecard with status == FINAL for
                     measurement_period == YEAR(pool.pool_year_start),
                     ordered by created_at ASC, then npi ASC        # NEVER by id
      for p in participants:
          panel_member_months_bps = sum of member_month_count_bps contributed by
              POSTED CapitationRemittance rows of this pool, attributed to p by
              the enrollees whose qualifying assignment in that coverage month
              was held by p
          withhold_weight = panel_member_months_bps
          savings_weight  = panel_member_months_bps * composite_score_bps_snapshot

      # ---- largest-remainder allocation, run twice with different weights ----
      allocate(total, weights):
          exact_i  = total * weights[i] / sum(weights)          # rational, unrounded
          share_i  = floor(exact_i)
          leftover = total - sum(share_i)
          hand out one extra cent to the leftover participants with the largest
          fractional part of exact_i; ties broken by participants order above
          (created_at ASC, then npi ASC) — never by id, never randomly
          return share

      withhold_share_cents   = allocate(agreement.withheld_balance_cents, withhold_weight)
      withhold_release_cents = round_half_up(withhold_share_cents
                                             * withhold_release_bps_snapshot / 10000)
      shared_savings_cents   = allocate(pool.shared_savings_pool_cents, savings_weight)
      net_distribution_cents = withhold_release_cents + shared_savings_cents
      # allocate() is exact: sum(shared_savings_cents) == shared_savings_pool_cents
      # and sum(withhold_share_cents) == withheld_balance_cents, always.
    input_set: "Participants as filtered above. Physicians in credential_status APPLICANT, CREDENTIALED or EXITED receive no PoolDistribution even when they hold a FINAL scorecard; physicians whose only scorecard is DRAFT or SUPERSEDED block the transition rather than being skipped."
    constants: {}
    precision: "whole cents; floor plus largest-remainder top-up so the allocation is exact, plus one round_half_up on the withhold release"
    worked_examples: |
      shared_savings_pool_cents 3348, two participants
      P1 panel_member_months_bps 10000, composite 8200 -> savings_weight 82000000
      P2 panel_member_months_bps 10000, composite 7000 -> savings_weight 70000000
      exact: P1 3348*82/152 = 1806.1578..., P2 3348*70/152 = 1541.8421...
      floors 1806 + 1541 = 3347, leftover 1 cent -> largest fraction is P2 (.842)
      -> P1 1806, P2 1542, sum 3348

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
# Evaluation is strictly top-down: the FIRST rule whose condition is violated
# determines the response, and no lower-priority rule is evaluated. Two of the
# pairings are deliberately reachable in a single request — see the
# priority_conflicts notes on rows 9 and 15.
validations:

  - priority: 1
    category: auth
    check: "X-User-Role header is present and names a role declared in §1.7; X-User-ID header is present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The role in X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Request body parses, every required input field is present, every field has the declared type, every enum value is a declared member, and every numeric field satisfies its declared range; pagination limit is 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Every path id resolves to an existing resource, validated left-to-right (agreementId before physicianId, fileId before rowId)"
    error_id: "ERR_AGREEMENT_NOT_FOUND | ERR_PHYSICIAN_NOT_FOUND | ERR_ENROLLEE_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_ENROLLMENT_FILE_NOT_FOUND | ERR_REMITTANCE_NOT_FOUND | ERR_RISK_POOL_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_RECOVERY_NOT_FOUND | ERR_SCORECARD_NOT_FOUND | ERR_DISTRIBUTION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing resource, validated in the field order declared by the endpoint's input list"
    error_id: "ERR_ENROLLEE_NOT_FOUND | ERR_PHYSICIAN_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_RISK_POOL_NOT_FOUND"
    http_status: 404
    applies_to: "POST /ipa/member-assignments, POST /ipa/member-assignments/{id}/state, POST /ipa/downstream-claims, POST /ipa/stop-loss-recoveries, POST /ipa/quality-scorecards"

  - priority: 6
    category: auth
    check: "For a PhysicianUser, the X-User-ID must equal the PhysicianMember id the operation acts on (its own physician record, its own assignment transfer target, its own claim appeal); for a PayerRepresentative, X-User-ID must equal the DelegationAgreement id the operation acts under"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all endpoints whose roles list includes PhysicianUser or PayerRepresentative"

  - priority: 7
    category: state
    check: "The supplied expected_<parent>_version equals the parent's current version (§1.2.1 rules assignment-create-stale-enrollee and scorecard-create-stale-physician)"
    error_id: "ERR_STALE_ENROLLEE_VERSION | ERR_STALE_PHYSICIAN_VERSION"
    http_status: 412
    applies_to: "POST /ipa/member-assignments, POST /ipa/quality-scorecards"

  - priority: 8
    category: state
    check: "The governing DelegationAgreement has status == ACTIVE"
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /ipa/delegation-agreements/{id}/enrollees, POST /ipa/delegation-agreements/{id}/enrollment-files, POST /ipa/delegation-agreements/{id}/risk-pools, POST /ipa/member-assignments, POST /ipa/downstream-claims"

  - priority: 9
    category: state
    check: "The target PhysicianMember has credential_status == ACTIVE"
    error_id: ERR_PHYSICIAN_NOT_ACCEPTING_ASSIGNMENTS
    http_status: 409
    applies_to: "POST /ipa/member-assignments, POST /ipa/member-assignments/{id}/state"
    priority_conflict: |
      Deliberate conflict pair {state, business_fiscal}: a physician in
      credential_status NOTICE_GIVEN whose panel_size already equals
      max_panel_size violates BOTH this rule and priority 27
      (ERR_PANEL_CAPACITY_EXCEEDED). This state rule wins —
      ERR_PHYSICIAN_NOT_ACCEPTING_ASSIGNMENTS (409), never the fiscal error.

  - priority: 10
    category: state
    check: "The target PhysicianMember has panel_status == OPEN"
    error_id: ERR_PANEL_CLOSED_TO_NEW
    http_status: 409
    applies_to: "POST /ipa/member-assignments"

  - priority: 11
    category: state
    check: "The requested to_state is reachable from the resource's current state under the §1.2 transition list for that entity, and the transition's own state preconditions hold (appeal_count < APPEAL_LIMIT, clock past pool_year_end, clock past settlement_due_date is checked separately at priority 17)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all POST .../{id}/state endpoints and PATCH /ipa/physicians/{id}/panel-status"

  - priority: 12
    category: business_referential
    check: "Cross-referenced resources belong to the same DelegationAgreement: an assignment's enrollee and physician share an agreement; a transfer target shares the source physician's agreement; a claim's enrollee, attributed physician and pool all share the claim's agreement; a recovery's enrollee belongs to the pool's agreement; a scorecard's physician belongs to a live agreement"
    error_id: ERR_AGREEMENT_MISMATCH
    http_status: 422
    applies_to: "POST /ipa/member-assignments, POST /ipa/member-assignments/{id}/state, POST /ipa/downstream-claims, POST /ipa/stop-loss-recoveries"

  - priority: 13
    category: business_safety
    check: "An enrollee with age_band == PEDIATRIC may only be assigned to a physician whose specialty IN {PEDIATRICS, PRIMARY_CARE}; an enrollee with age_band == SENIOR may only be assigned to a physician whose specialty IN {INTERNAL_MEDICINE, PRIMARY_CARE}"
    error_id: ERR_SPECIALTY_AGE_BAND_MISMATCH
    http_status: 422
    applies_to: "POST /ipa/member-assignments, POST /ipa/member-assignments/{id}/state"

  - priority: 14
    category: business_safety
    check: "An ACTIVE assignment may not be TERMINATED while the holding physician's continuity_of_care_until is set and the logical clock has not reached it (the supersede_prior path is exempt because the enrollee keeps a physician without a gap)"
    error_id: ERR_CONTINUITY_OF_CARE_ACTIVE
    http_status: 422
    applies_to: "POST /ipa/member-assignments/{id}/state"

  - priority: 15
    category: business_temporal
    check: "MemberAssignment.effective_date >= Enrollee.coverage_start_date, and (when coverage_end_date is set) effective_date <= coverage_end_date"
    error_id: ERR_ASSIGNMENT_BEFORE_COVERAGE
    http_status: 422
    applies_to: "POST /ipa/member-assignments"
    priority_conflict: |
      Deliberate conflict pair {business_temporal, business_constraint}: an
      effective_date earlier than the enrollee's coverage_start_date that also
      opens an interval overlapping the enrollee's existing ACTIVE assignment
      violates BOTH this rule and priority 18
      (ERR_ASSIGNMENT_PERIOD_OVERLAP). This temporal rule wins —
      ERR_ASSIGNMENT_BEFORE_COVERAGE (422), never
      ERR_ASSIGNMENT_PERIOD_OVERLAP (409). Note this pair is reachable with the
      target physician ACTIVE and OPEN, so no state-category rule interferes.

  - priority: 16
    category: business_temporal
    check: "A DownstreamClaim's service_date falls inside the closed [pool_year_start, pool_year_end] interval of some RiskPool of the claim's agreement whose pool_type matches the claim's pool_type"
    error_id: ERR_NO_POOL_FOR_SERVICE_DATE
    http_status: 422
    applies_to: "POST /ipa/downstream-claims"

  - priority: 17
    category: business_temporal
    check: "A pool may only reach SETTLED once the logical clock has reached its settlement_due_date (pool_year_end + 180 days for PROFESSIONAL, + 270 days for INSTITUTIONAL)"
    error_id: ERR_SETTLEMENT_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /ipa/risk-pools/{id}/state"

  - priority: 18
    category: business_constraint
    check: "A new MemberAssignment interval must not overlap any existing non-terminal assignment interval for the same enrollee. Intervals are HALF-OPEN [effective_date, term_date): an assignment terming exactly at 2026-07-01T00:00:00Z and a new one starting at that instant are adjacent, not overlapping, and both are allowed. When supersede_prior is true the prior ACTIVE assignment is termed at the new effective_date instead of triggering this error."
    error_id: ERR_ASSIGNMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /ipa/member-assignments"

  - priority: 19
    category: business_constraint
    check: "A new RiskPool period must not overlap an existing pool of the same agreement with the same pool_type. Pool periods are CLOSED [pool_year_start, pool_year_end]: a pool ending exactly at 2026-12-31T23:59:59Z and a new one starting at that same instant DO collide. Note the deliberate asymmetry with priority 18's half-open assignment intervals."
    error_id: ERR_POOL_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /ipa/delegation-agreements/{id}/risk-pools"

  - priority: 20
    category: business_constraint
    check: "Uniqueness: payer_tax_id across agreements; npi within an agreement; external_member_id within an agreement; coverage_month among the agreement's EnrollmentFile rows with status != DISPUTED"
    error_id: "ERR_DUPLICATE_TAX_ID | ERR_DUPLICATE_NPI | ERR_DUPLICATE_MEMBER_ID | ERR_COVERAGE_MONTH_DUPLICATE"
    http_status: 409
    applies_to: "POST /ipa/delegation-agreements, POST /ipa/delegation-agreements/{id}/physicians, POST /ipa/delegation-agreements/{id}/enrollees, POST /ipa/delegation-agreements/{id}/enrollment-files"

  - priority: 21
    category: business_constraint
    check: "professional_pool_share_bps + institutional_pool_share_bps == 10000 exactly"
    error_id: ERR_POOL_SHARE_SUM_INVALID
    http_status: 422
    applies_to: "POST /ipa/delegation-agreements, POST /ipa/delegation-agreements/{id}/state"

  - priority: 22
    category: business_constraint
    check: "An EnrollmentFile may only reach PARSED with row_count >= 1, and may only reach RECONCILED with matched_row_count >= 1"
    error_id: ERR_ENROLLMENT_FILE_EMPTY
    http_status: 422
    applies_to: "POST /ipa/enrollment-files/{id}/state"

  - priority: 23
    category: business_constraint
    check: "A pool may only reach SETTLEMENT_PROPOSED when every PhysicianMember of the agreement with credential_status IN {ACTIVE, NOTICE_GIVEN} has a QualityScorecard with status == FINAL for measurement_period == YEAR(pool_year_start)"
    error_id: ERR_SCORECARD_NOT_FINAL
    http_status: 422
    applies_to: "POST /ipa/risk-pools/{id}/state"

  - priority: 24
    category: business_constraint
    check: "A physician may only reach EXITED when zero MemberAssignment rows with physician_id == that physician have status IN {ACTIVE, TRANSFER_PROPOSED, TRANSFER_ACCEPTED}"
    error_id: ERR_PANEL_NOT_TRANSFERRED
    http_status: 422
    applies_to: "POST /ipa/physicians/{id}/state"

  - priority: 25
    category: business_safety
    check: "The X-User-ID adjudicating a StopLossRecovery (APPROVED or DENIED) must differ from the recovery's submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /ipa/stop-loss-recoveries/{id}/state"

  - priority: 26
    category: business_fiscal
    check: "A StopLossRecovery may only be created when the enrollee's PAID claim total in the pool STRICTLY exceeds the agreement's stop_loss_attachment_cents; exactly at attachment, excess_cents == 0 and the create is rejected"
    error_id: ERR_STOP_LOSS_NOT_ATTACHED
    http_status: 422
    applies_to: "POST /ipa/stop-loss-recoveries"

  - priority: 27
    category: business_fiscal
    check: "The target physician's panel_size must be strictly less than DelegationAgreement.max_panel_size after counting only assignments with status == ACTIVE"
    error_id: ERR_PANEL_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /ipa/member-assignments, POST /ipa/member-assignments/{id}/state"

  - priority: 28
    category: business_fiscal
    check: "allowed_cents supplied on an ADJUDICATED_APPROVED transition must be <= the claim's billed_cents"
    error_id: ERR_ALLOWED_EXCEEDS_BILLED
    http_status: 422
    applies_to: "POST /ipa/downstream-claims/{id}/state"

  - priority: 29
    category: business_fiscal
    check: "A panel may only be reopened (CLOSED_TO_NEW → OPEN) while the agreement's capitation_posture == CURRENT"
    error_id: ERR_CAPITATION_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "PATCH /ipa/physicians/{id}/panel-status"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
# 44 endpoints: 24 GET (reads, sub-resource listings, one computed read) and
# 20 writes (19 POST + 1 PATCH: creates, nine generic state-transition
# endpoints, one test-driving clock endpoint). Every FK declared in §1.1 has a
# reverse-reachability GET here, in sub-resource or filtered-list form.
endpoints:

  # ---------------------------------------------------------------- agreements
  - method: POST
    path: "/ipa/delegation-agreements"
    description: "Create a payer delegation agreement in DRAFT."
    roles: [IpaAdmin]
    code: 201
    input: [payer_name, payer_tax_id, delegation_scope, base_pmpm_cents, reconciliation_method, ibnr_method, ibnr_completion_factor_bps, target_claims_pmpm_cents, professional_pool_share_bps, institutional_pool_share_bps, quality_withhold_bps, stop_loss_attachment_cents, reinsurance_recovery_bps, max_panel_size, "continuity_of_care_days?"]
    output: DelegationAgreement
    side_effects:
      - "status = DRAFT, capitation_posture = CURRENT, all ledger counters 0"
      - "continuity_of_care_days defaults to 90 when omitted"

  - method: GET
    path: "/ipa/delegation-agreements"
    description: "List delegation agreements."
    roles: [IpaAdmin, NetworkManager, ClaimsExaminer, ReinsuranceUnderwriter, PayerRepresentative]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DelegationAgreement[]
    side_effects: []

  - method: GET
    path: "/ipa/delegation-agreements/{id}"
    description: "Read one delegation agreement including its derived ledger counters and capitation_posture."
    roles: [IpaAdmin, NetworkManager, ClaimsExaminer, ReinsuranceUnderwriter, PayerRepresentative]
    code: 200
    input: []
    output: DelegationAgreement
    side_effects: []

  - method: POST
    path: "/ipa/delegation-agreements/{id}/state"
    description: "Drive the agreement state machine (ACTIVE, SUSPENDED, TERMINATED)."
    roles: [IpaAdmin]
    code: 200
    input: [to_state]
    output: DelegationAgreement
    side_effects:
      - "per §1.2 DelegationAgreement transitions"
      - "on ACTIVE from DRAFT: capitation_posture = CURRENT and every Enrollee's gross/withhold/net PMPM components are derived per calculations.member_pmpm_components"
      - "on SUSPENDED: every PhysicianMember with panel_status == OPEN becomes CLOSED_TO_NEW"
      - "increments DelegationAgreement.version by 1"

  # ---------------------------------------------------------------- physicians
  - method: POST
    path: "/ipa/delegation-agreements/{id}/physicians"
    description: "Enroll a member physician under the agreement in credential_status APPLICANT."
    roles: [IpaAdmin, NetworkManager]
    code: 201
    input: [npi, full_name, specialty]
    output: PhysicianMember
    side_effects:
      - "agreement_id taken from the path; credential_status = APPLICANT; panel_status = OPEN; panel_size = 0"

  - method: GET
    path: "/ipa/delegation-agreements/{id}/physicians"
    description: "List the agreement's member physicians (reverse reachability for PhysicianMember.agreement_id)."
    roles: [IpaAdmin, NetworkManager, ClaimsExaminer, PayerRepresentative]
    code: 200
    input: ["credential_status?", "panel_status?", "limit?", "offset?"]
    output: PhysicianMember[]
    side_effects: []

  - method: GET
    path: "/ipa/physicians/{id}"
    description: "Read one member physician, including both state dimensions, panel_size, quality_composite_bps and continuity_of_care_until."
    roles: [IpaAdmin, NetworkManager, ClaimsExaminer, PayerRepresentative, PhysicianUser]
    code: 200
    input: []
    output: PhysicianMember
    side_effects: []

  - method: POST
    path: "/ipa/physicians/{id}/state"
    description: "Drive the physician credential dimension (CREDENTIALED, ACTIVE, NOTICE_GIVEN, EXITED)."
    roles: [NetworkManager, PhysicianUser]
    code: 200
    input: [to_state]
    output: PhysicianMember
    side_effects:
      - "per §1.2 PhysicianMember credential transitions"
      - "on NOTICE_GIVEN: exit_notice_at set from the logical clock, continuity_of_care_until derived, panel_status OPEN -> CLOSED_TO_NEW"
      - "on ACTIVE from NOTICE_GIVEN: exit_notice_at and continuity_of_care_until cleared, panel_status unchanged"
      - "on EXITED: panel_status = TRANSFERRED"
      - "increments PhysicianMember.version by 1"

  - method: PATCH
    path: "/ipa/physicians/{id}/panel-status"
    description: "Open or close the physician's panel to new assignments (the panel state dimension)."
    roles: [NetworkManager, PhysicianUser]
    code: 200
    input: [panel_status]
    output: PhysicianMember
    side_effects:
      - "per §1.2 PhysicianMember panel transitions; reopening requires credential_status == ACTIVE and agreement capitation_posture == CURRENT"
      - "increments PhysicianMember.version by 1"

  # ----------------------------------------------------------------- enrollees
  - method: POST
    path: "/ipa/delegation-agreements/{id}/enrollees"
    description: "Register a covered enrollee and derive its PMPM components."
    roles: [IpaAdmin, PayerRepresentative]
    code: 201
    input: [external_member_id, age_band, benefit_tier, risk_score_bps, coverage_start_date, "coverage_end_date?"]
    output: Enrollee
    side_effects:
      - "agreement_id taken from the path"
      - "gross_pmpm_cents, withhold_cents and net_pmpm_cents computed per calculations.member_pmpm_components"
      - "assigned_physician_id = null; cumulative_paid_claims_cents = 0"

  - method: GET
    path: "/ipa/enrollees"
    description: "List enrollees (reverse reachability for Enrollee.agreement_id and Enrollee.assigned_physician_id)."
    roles: [IpaAdmin, NetworkManager, ClaimsExaminer, PayerRepresentative, PhysicianUser]
    code: 200
    input: ["agreement_id?", "assigned_physician_id?", "age_band?", "limit?", "offset?"]
    output: Enrollee[]
    side_effects: []

  - method: GET
    path: "/ipa/enrollees/{id}"
    description: "Read one enrollee including gross/withhold/net PMPM and cumulative_paid_claims_cents."
    roles: [IpaAdmin, NetworkManager, ClaimsExaminer, ReinsuranceUnderwriter, PayerRepresentative, PhysicianUser]
    code: 200
    input: []
    output: Enrollee
    side_effects: []

  # ---------------------------------------------------------- member assignment
  - method: POST
    path: "/ipa/member-assignments"
    description: "Assign an enrollee to a member physician's panel. Carries the OCC guard on the parent Enrollee (§1.2.1 assignment-create-stale-enrollee)."
    roles: [IpaAdmin, NetworkManager]
    code: 201
    input: [enrollee_id, physician_id, effective_date, assignment_source, expected_enrollee_version, "supersede_prior?"]
    output: MemberAssignment
    side_effects:
      - "status = ACTIVE; pending_to_physician_id = null; term_date = null"
      - "when supersede_prior is true the enrollee's existing ACTIVE assignment is TERMINATED at the new effective_date and its superseded_by_assignment_id is set to the new row"
      - "PhysicianMember.panel_size recomputed; Enrollee.assigned_physician_id repointed; DelegationAgreement.total_assigned_members recomputed"
      - "target PhysicianMember.panel_status moves OPEN -> CLOSED_TO_NEW when panel_size reaches DelegationAgreement.max_panel_size"
      - "increments Enrollee.version by 1"

  - method: GET
    path: "/ipa/member-assignments"
    description: "List member assignments (reverse reachability for enrollee_id, physician_id and pending_to_physician_id)."
    roles: [IpaAdmin, NetworkManager, ClaimsExaminer, PayerRepresentative, PhysicianUser]
    code: 200
    input: ["enrollee_id?", "physician_id?", "pending_to_physician_id?", "status?", "limit?", "offset?"]
    output: MemberAssignment[]
    side_effects: []

  - method: GET
    path: "/ipa/member-assignments/{id}"
    description: "Read one member assignment including its transfer target and continuity window."
    roles: [IpaAdmin, NetworkManager, ClaimsExaminer, PayerRepresentative, PhysicianUser]
    code: 200
    input: []
    output: MemberAssignment
    side_effects: []

  - method: POST
    path: "/ipa/member-assignments/{id}/state"
    description: "Drive the assignment state machine: propose a panel transfer, accept or reject it as the target physician, complete the transfer, or terminate the assignment."
    roles: [NetworkManager, PhysicianUser]
    code: 200
    input: [to_state, "to_physician_id?", "transfer_effective_date?"]
    output: MemberAssignment
    side_effects:
      - "per §1.2 MemberAssignment transitions"
      - "on TRANSFER_PROPOSED: pending_to_physician_id set, source PhysicianMember.panel_status = TRANSFER_PENDING"
      - "on ACTIVE from TRANSFER_PROPOSED: pending_to_physician_id cleared and the source panel_status resolves back to CLOSED_TO_NEW"
      - "on TRANSFERRED: the four-level cascade of §1.2 (term this row, create the successor assignment for the target physician, recompute both panel_size values and Enrollee.assigned_physician_id, close the target panel at capacity)"
      - "on TERMINATED: panel_size and total_assigned_members recomputed; Enrollee.assigned_physician_id = null"
      - "increments MemberAssignment.version by 1"

  # ----------------------------------------------------------- enrollment files
  - method: POST
    path: "/ipa/delegation-agreements/{id}/enrollment-files"
    description: "Receive a monthly payer enrollment file in RECEIVED."
    roles: [IpaAdmin, PayerRepresentative]
    code: 201
    input: [coverage_month, payer_file_reference]
    output: EnrollmentFile
    side_effects:
      - "agreement_id from the path; received_at from the logical clock; status = RECEIVED; all row counters 0"

  - method: GET
    path: "/ipa/delegation-agreements/{id}/enrollment-files"
    description: "List the agreement's enrollment files (reverse reachability for EnrollmentFile.agreement_id)."
    roles: [IpaAdmin, NetworkManager, PayerRepresentative]
    code: 200
    input: ["status?", "coverage_month?", "limit?", "offset?"]
    output: EnrollmentFile[]
    side_effects: []

  - method: GET
    path: "/ipa/enrollment-files/{id}"
    description: "Read one enrollment file with its row counters and claimed capitation total."
    roles: [IpaAdmin, NetworkManager, PayerRepresentative]
    code: 200
    input: []
    output: EnrollmentFile
    side_effects: []

  - method: POST
    path: "/ipa/enrollment-files/{id}/rows"
    description: "Append a payer-transmitted row to a file that is still in RECEIVED."
    roles: [IpaAdmin, PayerRepresentative]
    code: 201
    input: [external_member_id, physician_npi, row_action, claimed_capitation_cents, effective_date]
    output: EnrollmentFileRow
    side_effects:
      - "file_id from the path; match_status = UNMATCHED until the file is PARSED"
      - "EnrollmentFile.row_count incremented; EnrollmentFile.version incremented by 1"

  - method: GET
    path: "/ipa/enrollment-files/{id}/rows"
    description: "List a file's rows with their computed match_status (reverse reachability for EnrollmentFileRow.file_id)."
    roles: [IpaAdmin, NetworkManager, PayerRepresentative]
    code: 200
    input: ["match_status?", "row_action?", "limit?", "offset?"]
    output: EnrollmentFileRow[]
    side_effects: []

  - method: POST
    path: "/ipa/enrollment-files/{id}/state"
    description: "Drive the enrollment-file state machine (PARSED, RECONCILED, DISPUTED, RECEIVED on resubmit, POSTED)."
    roles: [IpaAdmin, PayerRepresentative]
    code: 200
    input: [to_state, "dispute_reason?"]
    output: EnrollmentFile
    side_effects:
      - "per §1.2 EnrollmentFile transitions"
      - "on PARSED: calculations.enrollment_row_matching and calculations.file_claimed_capitation run"
      - "on RECONCILED: a CapitationRemittance is created per calculations.expected_capitation_for_coverage_month and calculations.remittance_variance_and_allocation; DelegationAgreement.accrued_capitation_cents increases"
      - "on DISPUTED: the remittance is DISPUTED, the accrual is exactly reversed, capitation_posture becomes WITHHELD"
      - "on POSTED: the five-level funding cascade of §1.2 (remittance POSTED, pools funded and member months added, withheld_balance_cents raised, loss_ratio_bps and deficit_flag recomputed, capitation_posture re-derived, open panels closed)"
      - "increments EnrollmentFile.version by 1"

  - method: GET
    path: "/ipa/enrollment-files/{id}/remittances"
    description: "List the capitation remittances produced by this file across dispute/resubmit cycles (reverse reachability for CapitationRemittance.file_id)."
    roles: [IpaAdmin, NetworkManager, PayerRepresentative]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CapitationRemittance[]
    side_effects: []

  - method: GET
    path: "/ipa/capitation-remittances/{id}"
    description: "Read one capitation remittance with every computed money field and the reconciliation variant that produced it."
    roles: [IpaAdmin, NetworkManager, PayerRepresentative]
    code: 200
    input: []
    output: CapitationRemittance
    side_effects: []

  # ---------------------------------------------------------------- risk pools
  - method: POST
    path: "/ipa/delegation-agreements/{id}/risk-pools"
    description: "Open a professional or institutional risk pool for an incurral period."
    roles: [IpaAdmin]
    code: 201
    input: [pool_type, pool_year_start, pool_year_end]
    output: RiskPool
    side_effects:
      - "agreement_id from the path; status = ACCUMULATING; all ledger counters 0"
      - "settlement_due_date = pool_year_end + SETTLEMENT_LAG_DAYS[pool_type]"

  - method: GET
    path: "/ipa/delegation-agreements/{id}/risk-pools"
    description: "List the agreement's risk pools (reverse reachability for RiskPool.agreement_id)."
    roles: [IpaAdmin, NetworkManager, ClaimsExaminer, ReinsuranceUnderwriter, PayerRepresentative]
    code: 200
    input: ["pool_type?", "status?", "limit?", "offset?"]
    output: RiskPool[]
    side_effects: []

  - method: GET
    path: "/ipa/risk-pools/{id}"
    description: "Read one risk pool with its funding, paid-claims, IBNR, recovery, loss-ratio and settlement fields."
    roles: [IpaAdmin, NetworkManager, ClaimsExaminer, ReinsuranceUnderwriter, PayerRepresentative]
    code: 200
    input: []
    output: RiskPool
    side_effects: []

  - method: GET
    path: "/ipa/risk-pools/{id}/settlement-preview"
    description: "Computed read: re-run calculations.pool_settlement_waterfall against the pool's current ledger without changing state, so the pre-fee tier decision is observable before SETTLEMENT_PROPOSED."
    roles: [IpaAdmin, PayerRepresentative]
    code: 200
    input: ["ibnr_method_override?"]
    output: "{ gross_claims_cents: integer, stop_loss_recovery_cents: integer, ibnr_reserve_cents: integer, net_claims_cents: integer, raw_surplus_cents: integer, surplus_ratio_bps: integer, surplus_tier: string, admin_fee_bps: integer, admin_fee_cents: integer, distributable_surplus_cents: integer, shared_savings_pool_cents: integer }"
    side_effects: []

  - method: POST
    path: "/ipa/risk-pools/{id}/state"
    description: "Drive the risk-pool state machine (CLOSED_FOR_INCURRAL, RESERVED including the re-estimate self-loop, SETTLEMENT_PROPOSED, RESERVED again on payer dispute, SETTLED)."
    roles: [IpaAdmin, PayerRepresentative]
    code: 200
    input: [to_state, "ibnr_method_override?", "dispute_reason?"]
    output: RiskPool
    side_effects:
      - "per §1.2 RiskPool transitions"
      - "on RESERVED: calculations.ibnr_reserve_estimate runs under ibnr_method_used"
      - "on SETTLEMENT_PROPOSED: calculations.pool_settlement_waterfall then calculations.pool_distribution_allocation; one PROPOSED PoolDistribution per qualifying physician"
      - "on RESERVED from SETTLEMENT_PROPOSED: distributions VOIDED and every waterfall output reset"
      - "on SETTLED: distributions PAID; DelegationAgreement.withheld_balance_cents reduced and forfeited_withhold_cents raised"
      - "increments RiskPool.version by 1"

  # ----------------------------------------------------------- downstream claims
  - method: POST
    path: "/ipa/downstream-claims"
    description: "Intake a downstream provider claim for delegated adjudication; the risk pool is resolved from service_date and pool_type."
    roles: [ClaimsExaminer, IpaAdmin]
    code: 201
    input: [agreement_id, enrollee_id, attributed_physician_id, pool_type, downstream_provider_name, billed_cents, service_date]
    output: DownstreamClaim
    side_effects:
      - "pool_id resolved to the agreement's RiskPool of the same pool_type whose closed period contains service_date"
      - "received_date from the logical clock; status = RECEIVED; allowed_cents = null; paid_cents = null; appeal_count = 0"

  - method: GET
    path: "/ipa/downstream-claims"
    description: "List downstream claims (reverse reachability for agreement_id, enrollee_id, attributed_physician_id and pool_id)."
    roles: [IpaAdmin, NetworkManager, ClaimsExaminer, ReinsuranceUnderwriter, PayerRepresentative, PhysicianUser]
    code: 200
    input: ["agreement_id?", "enrollee_id?", "attributed_physician_id?", "pool_id?", "status?", "limit?", "offset?"]
    output: DownstreamClaim[]
    side_effects: []

  - method: GET
    path: "/ipa/downstream-claims/{id}"
    description: "Read one downstream claim with its adjudication and payment fields."
    roles: [IpaAdmin, NetworkManager, ClaimsExaminer, ReinsuranceUnderwriter, PayerRepresentative, PhysicianUser]
    code: 200
    input: []
    output: DownstreamClaim
    side_effects: []

  - method: POST
    path: "/ipa/downstream-claims/{id}/state"
    description: "Drive delegated adjudication: approve or deny, appeal a denial, pay an approved claim, or void."
    roles: [ClaimsExaminer, NetworkManager, PhysicianUser]
    code: 200
    input: [to_state, "allowed_cents?", "denial_reason?"]
    output: DownstreamClaim
    side_effects:
      - "per §1.2 DownstreamClaim transitions"
      - "on ADJUDICATED_APPROVED: allowed_cents recorded (must not exceed billed_cents); no ledger movement"
      - "on ADJUDICATED_DENIED: denial_reason recorded, allowed_cents = 0, no ledger movement"
      - "on RECEIVED from ADJUDICATED_DENIED: appeal_count incremented, denial_reason and allowed_cents cleared"
      - "on PAID: the four-level cascade of §1.2 (paid_cents set, RiskPool.paid_claims_cents raised, Enrollee.cumulative_paid_claims_cents raised and stop_loss_eligible_enrollee_count recomputed, deficit_flag and capitation_posture re-derived)"
      - "on VOIDED from PAID: the same ledger movements exactly reversed and paid_cents cleared"
      - "increments DownstreamClaim.version by 1"

  # -------------------------------------------------------- stop-loss recoveries
  - method: POST
    path: "/ipa/stop-loss-recoveries"
    description: "Open a reinsurance recovery claim for an enrollee whose paid claims in a pool have pierced the attachment point."
    roles: [ClaimsExaminer]
    code: 201
    input: [pool_id, enrollee_id]
    output: StopLossRecovery
    side_effects:
      - "attachment_cents snapshotted from the agreement; eligible_paid_cents, excess_cents and recovery_cents computed per calculations.stop_loss_recovery"
      - "status = DRAFT; submitted_by_user_id and adjudicated_by_user_id null"

  - method: GET
    path: "/ipa/stop-loss-recoveries"
    description: "List reinsurance recoveries (reverse reachability for StopLossRecovery.pool_id and enrollee_id)."
    roles: [IpaAdmin, ClaimsExaminer, ReinsuranceUnderwriter, PayerRepresentative]
    code: 200
    input: ["pool_id?", "enrollee_id?", "status?", "limit?", "offset?"]
    output: StopLossRecovery[]
    side_effects: []

  - method: GET
    path: "/ipa/stop-loss-recoveries/{id}"
    description: "Read one reinsurance recovery including the submitter and adjudicator user ids."
    roles: [IpaAdmin, ClaimsExaminer, ReinsuranceUnderwriter, PayerRepresentative]
    code: 200
    input: []
    output: StopLossRecovery
    side_effects: []

  - method: POST
    path: "/ipa/stop-loss-recoveries/{id}/state"
    description: "Submit, approve, deny or settle a reinsurance recovery. Approval and denial are reserved to the ReinsuranceUnderwriter and enforce segregation of duties against submitted_by_user_id."
    roles: [ClaimsExaminer, ReinsuranceUnderwriter, IpaAdmin]
    code: 200
    input: [to_state, "denial_reason?"]
    output: StopLossRecovery
    side_effects:
      - "per §1.2 StopLossRecovery transitions"
      - "on SUBMITTED: submitted_by_user_id = X-User-ID"
      - "on APPROVED: adjudicated_by_user_id = X-User-ID and RiskPool.stop_loss_recovery_cents increased"
      - "on DENIED: adjudicated_by_user_id = X-User-ID, denial_reason recorded, no ledger movement"
      - "increments StopLossRecovery.version by 1"

  # ------------------------------------------------------------ quality / payout
  - method: POST
    path: "/ipa/quality-scorecards"
    description: "Record a panel-performance scorecard in DRAFT. Carries the OCC guard on the parent PhysicianMember (§1.2.1 scorecard-create-stale-physician)."
    roles: [IpaAdmin, PayerRepresentative]
    code: 201
    input: [physician_id, measurement_period, hedis_composite_bps, access_score_bps, patient_experience_bps, attributed_member_months, expected_physician_version]
    output: QualityScorecard
    side_effects:
      - "status = DRAFT; composite_score_bps = 0; withhold_release_bps = 0"
      - "any earlier DRAFT scorecard for the same physician and measurement_period becomes SUPERSEDED"
      - "PhysicianMember.latest_scorecard_period updated; increments PhysicianMember.version by 1"

  - method: GET
    path: "/ipa/physicians/{id}/scorecards"
    description: "List a physician's quality scorecards (reverse reachability for QualityScorecard.physician_id)."
    roles: [IpaAdmin, NetworkManager, PayerRepresentative, PhysicianUser]
    code: 200
    input: ["status?", "measurement_period?", "limit?", "offset?"]
    output: QualityScorecard[]
    side_effects: []

  - method: GET
    path: "/ipa/quality-scorecards/{id}"
    description: "Read one quality scorecard with its computed composite and withhold-release basis points."
    roles: [IpaAdmin, NetworkManager, PayerRepresentative, PhysicianUser]
    code: 200
    input: []
    output: QualityScorecard
    side_effects: []

  - method: POST
    path: "/ipa/quality-scorecards/{id}/state"
    description: "Finalise a scorecard, computing the weighted composite and the withhold-release band."
    roles: [IpaAdmin]
    code: 200
    input: [to_state]
    output: QualityScorecard
    side_effects:
      - "per §1.2 QualityScorecard transitions"
      - "on FINAL: calculations.quality_composite_and_withhold_release runs; any other FINAL scorecard for the same physician and period becomes SUPERSEDED; PhysicianMember.quality_composite_bps updated"
      - "increments QualityScorecard.version by 1 and PhysicianMember.version by 1"

  - method: GET
    path: "/ipa/pool-distributions"
    description: "List proposed, voided and paid pool distributions (reverse reachability for PoolDistribution.pool_id and physician_id)."
    roles: [IpaAdmin, NetworkManager, PayerRepresentative, PhysicianUser]
    code: 200
    input: ["pool_id?", "physician_id?", "status?", "limit?", "offset?"]
    output: PoolDistribution[]
    side_effects: []

  - method: GET
    path: "/ipa/pool-distributions/{id}"
    description: "Read one pool distribution with its withhold share, released withhold and shared-savings allocation."
    roles: [IpaAdmin, NetworkManager, PayerRepresentative, PhysicianUser]
    code: 200
    input: []
    output: PoolDistribution
    side_effects: []

  # ------------------------------------------------------ test-driving endpoint
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to an arbitrary UTC instant. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z — that fixed default is the server's startup time and it MUST NOT fall back to real wall-clock time. Every deadline, coverage window, continuity-of-care window, pool close and settlement-window rule in this scaffold is evaluated against this logical clock."
    roles: [IpaAdmin, NetworkManager, ClaimsExaminer, ReinsuranceUnderwriter, PayerRepresentative, PhysicianUser]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "the logical clock used by every subsequent request is set to current_utc; no business entity is mutated"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # ---- auth
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty, or X-User-Role names a role not declared in §1.7"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the target endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "A PhysicianUser acts on a PhysicianMember, assignment transfer or claim appeal that is not its own, or a PayerRepresentative acts outside its own DelegationAgreement"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-ID approving or denying a StopLossRecovery equals its submitted_by_user_id"

  # ---- request shape
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required input field, wrong type, undeclared enum value, out-of-range numeric, coverage_month not matching ^\\d{4}-(0[1-9]|1[0-2])$, measurement_period not matching ^\\d{4}$, or pagination limit outside 1..100 / negative offset"

  # ---- existence
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "agreementId in the path, or agreement_id in the body, does not resolve to a DelegationAgreement"
  - id: ERR_PHYSICIAN_NOT_FOUND
    http: 404
    condition: "physicianId in the path, or physician_id / attributed_physician_id / to_physician_id in the body, does not resolve to a PhysicianMember"
  - id: ERR_ENROLLEE_NOT_FOUND
    http: 404
    condition: "enrolleeId in the path, or enrollee_id in the body, does not resolve to an Enrollee"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "assignmentId does not resolve to a MemberAssignment"
  - id: ERR_ENROLLMENT_FILE_NOT_FOUND
    http: 404
    condition: "fileId does not resolve to an EnrollmentFile"
  - id: ERR_REMITTANCE_NOT_FOUND
    http: 404
    condition: "remittanceId does not resolve to a CapitationRemittance"
  - id: ERR_RISK_POOL_NOT_FOUND
    http: 404
    condition: "poolId in the path, or pool_id in the body, does not resolve to a RiskPool"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "claimId does not resolve to a DownstreamClaim"
  - id: ERR_RECOVERY_NOT_FOUND
    http: 404
    condition: "recoveryId does not resolve to a StopLossRecovery"
  - id: ERR_SCORECARD_NOT_FOUND
    http: 404
    condition: "scorecardId does not resolve to a QualityScorecard"
  - id: ERR_DISTRIBUTION_NOT_FOUND
    http: 404
    condition: "distributionId does not resolve to a PoolDistribution"

  # ---- concurrency (§1.2.1)
  - id: ERR_STALE_ENROLLEE_VERSION
    http: 412
    condition: "expected_enrollee_version on POST /ipa/member-assignments does not equal the Enrollee's current version"
  - id: ERR_STALE_PHYSICIAN_VERSION
    http: 412
    condition: "expected_physician_version on POST /ipa/quality-scorecards does not equal the PhysicianMember's current version"

  # ---- state
  - id: ERR_AGREEMENT_NOT_ACTIVE
    http: 409
    condition: "The governing DelegationAgreement is in DRAFT, SUSPENDED or TERMINATED when a dependent create is attempted"
  - id: ERR_PHYSICIAN_NOT_ACCEPTING_ASSIGNMENTS
    http: 409
    condition: "The target PhysicianMember's credential_status is not ACTIVE (APPLICANT, CREDENTIALED, NOTICE_GIVEN or EXITED)"
  - id: ERR_PANEL_CLOSED_TO_NEW
    http: 409
    condition: "The target PhysicianMember's panel_status is not OPEN when a new assignment is created"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The requested to_state is not reachable from the resource's current state, including a third appeal on a claim whose appeal_count is already 2, closing a pool for incurral before pool_year_end, or any transition out of a terminal state"
  - id: ERR_CAPITATION_POSTURE_RESTRICTED
    http: 409
    condition: "A panel reopen (CLOSED_TO_NEW → OPEN) is attempted while the agreement's capitation_posture is UNDER_REVIEW or WITHHELD"

  # ---- constraint / uniqueness
  - id: ERR_DUPLICATE_TAX_ID
    http: 409
    condition: "payer_tax_id already exists on another DelegationAgreement"
  - id: ERR_DUPLICATE_NPI
    http: 409
    condition: "npi already exists on another PhysicianMember of the same agreement"
  - id: ERR_DUPLICATE_MEMBER_ID
    http: 409
    condition: "external_member_id already exists on another Enrollee of the same agreement"
  - id: ERR_COVERAGE_MONTH_DUPLICATE
    http: 409
    condition: "The agreement already has an EnrollmentFile for this coverage_month with status != DISPUTED"
  - id: ERR_ASSIGNMENT_PERIOD_OVERLAP
    http: 409
    condition: "A new assignment's half-open [effective_date, term_date) interval overlaps a non-terminal assignment of the same enrollee and supersede_prior is not set; exactly adjacent intervals do NOT collide"
  - id: ERR_POOL_PERIOD_OVERLAP
    http: 409
    condition: "A new pool's closed [pool_year_start, pool_year_end] interval overlaps an existing pool of the same agreement and pool_type; touching endpoints DO collide"

  # ---- referential / safety / temporal
  - id: ERR_AGREEMENT_MISMATCH
    http: 422
    condition: "Cross-referenced resources belong to different DelegationAgreements (enrollee vs physician, transfer target vs source, claim's enrollee/physician/pool, recovery's enrollee vs pool)"
  - id: ERR_SPECIALTY_AGE_BAND_MISMATCH
    http: 422
    condition: "A PEDIATRIC enrollee is assigned to a physician whose specialty is not PEDIATRICS or PRIMARY_CARE, or a SENIOR enrollee to a physician whose specialty is not INTERNAL_MEDICINE or PRIMARY_CARE"
  - id: ERR_CONTINUITY_OF_CARE_ACTIVE
    http: 422
    condition: "An ACTIVE assignment is terminated while the holding physician's continuity_of_care_until has not been reached by the logical clock"
  - id: ERR_ASSIGNMENT_BEFORE_COVERAGE
    http: 422
    condition: "MemberAssignment.effective_date is earlier than Enrollee.coverage_start_date or later than a set coverage_end_date"
  - id: ERR_NO_POOL_FOR_SERVICE_DATE
    http: 422
    condition: "No RiskPool of the claim's agreement and pool_type has a closed period containing service_date"
  - id: ERR_SETTLEMENT_WINDOW_NOT_OPEN
    http: 422
    condition: "SETTLED is requested before the logical clock reaches the pool's settlement_due_date"
  - id: ERR_POOL_SHARE_SUM_INVALID
    http: 422
    condition: "professional_pool_share_bps + institutional_pool_share_bps does not equal 10000"
  - id: ERR_ENROLLMENT_FILE_EMPTY
    http: 422
    condition: "PARSED is requested on a file with row_count == 0, or RECONCILED on a file with matched_row_count == 0"
  - id: ERR_SCORECARD_NOT_FINAL
    http: 422
    condition: "SETTLEMENT_PROPOSED is requested while some PhysicianMember with credential_status IN {ACTIVE, NOTICE_GIVEN} lacks a FINAL QualityScorecard for the pool year"
  - id: ERR_PANEL_NOT_TRANSFERRED
    http: 422
    condition: "EXITED is requested while the physician still holds assignments in ACTIVE, TRANSFER_PROPOSED or TRANSFER_ACCEPTED"
  - id: ERR_STOP_LOSS_NOT_ATTACHED
    http: 422
    condition: "A StopLossRecovery create resolves to excess_cents == 0 because the enrollee's PAID total in the pool does not strictly exceed stop_loss_attachment_cents"
  - id: ERR_PANEL_CAPACITY_EXCEEDED
    http: 422
    condition: "The target physician's ACTIVE assignment count already equals DelegationAgreement.max_panel_size"
  - id: ERR_ALLOWED_EXCEEDS_BILLED
    http: 422
    condition: "allowed_cents supplied on an ADJUDICATED_APPROVED transition exceeds the claim's billed_cents"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
# Role model: segregation_of_duties layered over peer operational roles. The
# ClaimsExaminer X-User-ID that submits a reinsurance recovery may never be the
# ReinsuranceUnderwriter X-User-ID that adjudicates it, and no role is a
# superset of another — IpaAdmin cannot credential physicians, NetworkManager
# cannot post remittances, and neither can adjudicate reinsurance.
roles:

  - name: IpaAdmin
    description: "IPA finance and contracting operator: owns agreements, enrollment-file posting, risk pools, IBNR reserving, settlement proposal and scorecard finalisation."
    identity: "opaque"
    exclusive_operations:
      - "POST /ipa/delegation-agreements"
      - "POST /ipa/delegation-agreements/{id}/state"
      - "POST /ipa/delegation-agreements/{id}/risk-pools"
      - "POST /ipa/quality-scorecards/{id}/state"
    shared_operations:
      - "POST /ipa/delegation-agreements/{id}/physicians (with NetworkManager)"
      - "POST /ipa/delegation-agreements/{id}/enrollees (with PayerRepresentative)"
      - "POST /ipa/delegation-agreements/{id}/enrollment-files (with PayerRepresentative)"
      - "POST /ipa/enrollment-files/{id}/rows (with PayerRepresentative)"
      - "POST /ipa/enrollment-files/{id}/state (with PayerRepresentative)"
      - "POST /ipa/risk-pools/{id}/state (with PayerRepresentative)"
      - "POST /ipa/member-assignments (with NetworkManager)"
      - "POST /ipa/downstream-claims (with ClaimsExaminer)"
      - "POST /ipa/quality-scorecards (with PayerRepresentative)"
      - "POST /ipa/stop-loss-recoveries/{id}/state (with ClaimsExaminer and ReinsuranceUnderwriter)"
      - "GET /ipa/risk-pools/{id}/settlement-preview (with PayerRepresentative)"
      - "all GET reads"
      - "POST /_clock/set_current_utc"

  - name: NetworkManager
    description: "Provider network operator: credentials physicians, manages panels, assignments, panel transfers and physician exit."
    identity: "opaque"
    exclusive_operations:
      - "POST /ipa/physicians/{id}/state for CREDENTIALED, ACTIVE and EXITED"
      - "POST /ipa/member-assignments/{id}/state for TRANSFER_PROPOSED, TRANSFERRED and TERMINATED"
      - "PATCH /ipa/physicians/{id}/panel-status for CLOSED_TO_NEW → OPEN"
    shared_operations:
      - "POST /ipa/delegation-agreements/{id}/physicians (with IpaAdmin)"
      - "POST /ipa/member-assignments (with IpaAdmin)"
      - "POST /ipa/physicians/{id}/state for NOTICE_GIVEN (with PhysicianUser)"
      - "PATCH /ipa/physicians/{id}/panel-status for OPEN → CLOSED_TO_NEW (with PhysicianUser)"
      - "POST /ipa/downstream-claims/{id}/state for the appeal transition (with PhysicianUser)"
      - "all GET reads except stop-loss recoveries"
      - "POST /_clock/set_current_utc"

  - name: ClaimsExaminer
    description: "Delegated adjudication operator: intakes downstream claims, approves, denies, pays and voids them, and opens and submits reinsurance recoveries."
    identity: "opaque"
    exclusive_operations:
      - "POST /ipa/downstream-claims/{id}/state for ADJUDICATED_APPROVED, ADJUDICATED_DENIED, PAID and VOIDED"
      - "POST /ipa/stop-loss-recoveries"
      - "POST /ipa/stop-loss-recoveries/{id}/state for SUBMITTED"
    shared_operations:
      - "POST /ipa/downstream-claims (with IpaAdmin)"
      - "GET reads on agreements, physicians, enrollees, assignments, claims, pools, recoveries"
      - "POST /_clock/set_current_utc"

  - name: ReinsuranceUnderwriter
    description: "Reinsurance carrier adjudicator: approves or denies submitted stop-loss recoveries. Segregation of duties bars it from acting on a recovery it submitted."
    identity: "opaque"
    exclusive_operations:
      - "POST /ipa/stop-loss-recoveries/{id}/state for APPROVED and DENIED"
    shared_operations:
      - "GET reads on agreements, enrollees, risk pools, claims and recoveries"
      - "POST /_clock/set_current_utc"

  - name: PhysicianUser
    description: "A member physician acting on their own record: gives or is asked to accept panel transfers, gives exit notice, closes their own panel and appeals denied claims."
    identity: "entity_backed:PhysicianMember"
    exclusive_operations:
      - "POST /ipa/member-assignments/{id}/state for TRANSFER_ACCEPTED and for the ACTIVE rejection, where X-User-ID must equal the assignment's pending_to_physician_id"
    shared_operations:
      - "POST /ipa/physicians/{id}/state for NOTICE_GIVEN on its own record (with NetworkManager)"
      - "PATCH /ipa/physicians/{id}/panel-status for OPEN → CLOSED_TO_NEW on its own record (with NetworkManager)"
      - "POST /ipa/downstream-claims/{id}/state for the appeal transition (with NetworkManager)"
      - "GET reads scoped to its own physician record, its own panel's enrollees and assignments, its own scorecards and distributions"
      - "POST /_clock/set_current_utc"

  - name: PayerRepresentative
    description: "Payer-side counterparty for one delegation agreement: supplies enrollees and enrollment files, disputes remittances, disputes settlement proposals and reports quality scores."
    identity: "entity_backed:DelegationAgreement"
    exclusive_operations:
      - "POST /ipa/enrollment-files/{id}/state for DISPUTED and for the RECEIVED resubmit"
      - "POST /ipa/risk-pools/{id}/state for the SETTLEMENT_PROPOSED → RESERVED dispute"
    shared_operations:
      - "POST /ipa/delegation-agreements/{id}/enrollees (with IpaAdmin)"
      - "POST /ipa/delegation-agreements/{id}/enrollment-files (with IpaAdmin)"
      - "POST /ipa/enrollment-files/{id}/rows (with IpaAdmin)"
      - "POST /ipa/enrollment-files/{id}/state for PARSED (with IpaAdmin)"
      - "POST /ipa/quality-scorecards (with IpaAdmin)"
      - "GET /ipa/risk-pools/{id}/settlement-preview (with IpaAdmin)"
      - "GET reads scoped to its own agreement"
      - "POST /_clock/set_current_utc"
