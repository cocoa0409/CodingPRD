  - name: case_version_increments_by_one_on_each_mutation
    claim_type: optimistic_concurrency
    grounds:
    - entities.ShortSaleCase.fields.version
    - entities.ShortSaleCase.fields.junior_lien_count
    distinguishing_aspect: 'ShortSaleCase.version starts at 1 on creation and advances by exactly 1 per mutation: creating a junior lien (which rewrites junior_lien_count) takes it to 2 and updated_at is refreshed.'
    test_recipe:
      setup:
      - One GSE case at version 1 with no junior liens.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-05T00:00:00Z'
        as: PlatformAdmin
        as_user_id: adm-900
      - call: POST /short-sale/cases
        payload:
          property_address: 63 Oakhollow Ln, Reno NV
          investor_type: GSE
          unpaid_principal_balance_cents: 26800000
          servicer_name: Cascade Servicing
        as: Negotiator
        as_user_id: neg-001
        captures:
          case_id: $.data.id
      - call: GET /short-sale/cases/${case_id}
        payload: {}
        as: Negotiator
        as_user_id: neg-001
        captures:
          v_before: $.data.version
      trigger:
      - call: POST /short-sale/cases/${case_id}/junior-liens
        payload:
          lien_position: 2
          holder_name: Truckee Credit Union
          holder_user_id: jlh-700
          balance_cents: 3500000
        as: Negotiator
        as_user_id: neg-001
        captures:
          lien_id: $.data.id
      assert:
      - before the trigger, ShortSaleCase.${case_id}.version == 1
      - after the trigger, ShortSaleCase.${case_id}.version == 2
      - ShortSaleCase.${case_id}.junior_lien_count == 1
      - ShortSaleCase.${case_id}.updated_at is strictly greater than its created_at value is not required, but the field is present and ISO-8601 with three fractional digits
