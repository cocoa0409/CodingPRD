  # =====================================================================
  - section: rbac
    instances:
      - name: technician_cannot_quote_spec
        claim_type: rbac_exclusive_denied
        grounds: [roles, endpoints]
        distinguishing_aspect: "quote is a FittingSpecialist exclusive; RepairTechnician gets 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["DRAFT spec exists"]
          setup_api_calls:
            - call: "POST /golf-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
