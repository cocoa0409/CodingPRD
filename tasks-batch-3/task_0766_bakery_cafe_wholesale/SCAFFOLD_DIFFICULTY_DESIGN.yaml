            - "error_id == ERR_ACCOUNT_SUSPENDED"
            - "DeliveryOrder.${order_id}.fulfillment_status == PENDING"

      - name: complete_stop_requires_route_dispatched
        grounds:
          - state_machines.RouteStop.PENDING_to_DELIVERED
          - validations[priority=4]
          - entities.DeliveryRoute.fields.status
        distinguishing_aspect: "RouteStop PENDING->DELIVERED (via complete) is blocked (ERR_ROUTE_NOT_DISPATCHED) because its DeliveryRoute is still PLANNED; pair RouteStop->DeliveryRoute, distinct from order->account."
