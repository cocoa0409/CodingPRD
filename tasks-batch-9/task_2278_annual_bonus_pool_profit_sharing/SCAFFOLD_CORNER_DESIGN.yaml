      - name: accrual_double_post_and_out_of_order_reversal_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_68
          - validations.priority_92
          - errors.ERR_ACCRUAL_ALREADY_POSTED
          - errors.ERR_ACCRUAL_REVERSAL_OUT_OF_ORDER
          - "state_machines.AccrualPeriod: POSTED -> REVERSED"
        distinguishing_aspect: |
          Posting is once-only (POSTED is not re-enterable) and reversal is
          strict LIFO: H1 cannot be reversed while H2 is still POSTED, but the same
          call succeeds after H2 is reversed. The ledger therefore walks
          2,135,304 -> 2,135,304 -> 2,135,304 (H2 reversed) -> 0 without ever
          double-counting the rejected post.
        test_recipe:
          setup:
            - "BASE-shaped plan (no metrics needed: the forecast supplies the company component) with one L5 participant at 20,000,000 hired 2025-03-01."
            - "Two tiling accrual periods both POSTED: H1 2026-01-01..2026-06-30 (total 2,135,304) and H2 2026-07-01..2026-12-31."
          setup_api_calls:
            - call: "POST /business-units"
              payload: { unit_code: "H9", name: "Unit H9" }
              as: PlanAdmin
              captures: { unit_id: "$.data.id" }
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Accrual Ladder Plan", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00 }
              as: PlanAdmin
              captures: { plan_id: "$.data.id" }
