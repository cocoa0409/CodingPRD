            - "${err_id} == ERR_MARKS_NOT_POSTED with HTTP 422"
            - "After POST /ethanol-ops/plants/${plant_id}/market-marks with all five marks the same GET returns 200"

      - name: blend_execution_into_a_tank_without_room_rejected
