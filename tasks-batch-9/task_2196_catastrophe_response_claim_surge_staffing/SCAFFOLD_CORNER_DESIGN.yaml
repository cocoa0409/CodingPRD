              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-1012B", peril_type: "HAIL", jurisdiction_state: "OK", event_start_utc: "2026-07-26T00:00:00.000Z", exposure_count: 250, avg_insured_value: 130000, expected_severity_index: 0.0000 }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev_b: $.data.id }
            - call: "POST /catastrophe-events/${ev_b}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /adjusters"
              payload: { full_name: "Both States Bo", employment_type: "STAFF", home_state: "TX", licensed_states: ["TX", "OK"], license_expiry_utc: "2027-06-30T00:00:00.000Z", max_open_claims: 8, daily_rate: 600, per_diem_rate: 80, desk_certified: false, aerial_certified: false }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { adj_both: $.data.id }
            - call: "POST /adjusters"
              payload: { full_name: "Texas Only Tia", employment_type: "STAFF", home_state: "TX", licensed_states: ["TX"], license_expiry_utc: "2027-06-30T00:00:00.000Z", max_open_claims: 8, daily_rate: 600, per_diem_rate: 80, desk_certified: false, aerial_certified: false }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { adj_tx: $.data.id }
            - call: "POST /claims"
              payload: { policy_number: "POL-1012A", loss_state: "TX", loss_date_utc: "2026-07-26T00:00:00.000Z", reported_loss_amount: 40000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 100000, deductible_amount: 0, estimated_damage_amount: 50000 }], event_id: "${ev_a}" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
