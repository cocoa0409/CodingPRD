              as: CreditAnalyst
              captures: { countered_v: $.data.version }
          trigger:
            - call: "POST /credit-applications/${application_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${other_customer_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_NOT_RESOURCE_OWNER"
            - "CreditApplication.${application_id}.decision_status is still COUNTERED"
            - "CreditApplication.${application_id}.version is still ${countered_v}"
            - "Customer.${other_customer_id}.account_status is still NO_FILE"

      - name: unpaid_plan_shortfall_on_default_sweep_is_flagged_by_plan_status
