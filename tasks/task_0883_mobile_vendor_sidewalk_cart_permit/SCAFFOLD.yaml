scenario: "Mobile-Vendor & Sidewalk-Cart Permit: vendor & cart permit, zone/route & spacing rule, commissary & health compliance, fee & lottery for prime spots, insurance & inspection, violation & impound, renewal, complaint"

domain_name: mobile-vendor-sidewalk-cart-permit
api_prefix: "/"

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Prime sidewalk spots are a finite pool competed for through a deterministic
    lottery (ranked by seniority/compliance/violation-points, tie-break created_at
    ASC — never random). Standard spots are assigned directly. Spot occupation is
    guarded by two distinct overlap semantics: half-open time windows per Spot and
    a spatial buffer (spacing_min_feet) across a Zone. Permit lifecycle is cyclic
    (ISSUED <-> SUSPENDED) and Violation lifecycle is cyclic (ISSUED <-> CONTESTED).
    Health/insurance/inspection state on sibling entities gates permit issuance and
    cart approval; complaint substantiation and inspection failure drive multi-hop
    cascades that suspend permits and release their spot assignments.

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered vendor/business legal name" }
      - { name: contact_email, type: string, source: input, description: "Contact email" }
      - { name: seniority_years, type: integer, source: input, default: 0, description: "Years operating; a lottery ranking input" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED | REVOKED — vendor-level standing" }
      - { name: insurance_effective_at, type: datetime, source: input, description: "Start of current liability policy coverage window; null until first policy submitted" }
      - { name: insurance_expires_at, type: datetime, source: input, description: "End of current liability policy coverage window; null until first policy submitted" }
      - { name: insurance_coverage_cents, type: integer, source: input, default: 0, description: "Per-occurrence liability coverage amount in cents" }
      - { name: insurance_status, type: enum, source: computed, description: "NONE | ACTIVE | LAPSED — ACTIVE iff insurance_effective_at <= clock < insurance_expires_at AND insurance_coverage_cents >= MIN_INSURANCE_COVERAGE_CENTS" }
      - { name: total_charged_cents, type: integer, source: system, default: 0, description: "Running sum of all charges levied on this vendor (permit fees, fines, impound release fees, lottery entry fees)" }
      - { name: total_credited_cents, type: integer, source: system, default: 0, description: "Running sum of all credits (payments received, dismissed-fine reversals)" }
      - { name: balance_owed_cents, type: integer, source: computed, description: "= total_charged_cents - total_credited_cents (money conservation invariant)" }
      - { name: compliance_score, type: integer, source: computed, description: "= clamp(100 - 5 * count(UPHELD violations across vendor permits), 0, 100); a lottery ranking input" }

  - name: Commissary
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Licensed commissary / base-of-operations facility name" }
      - { name: health_grade, type: enum, source: input, description: "A | B | C health department grade" }
      - { name: license_expires_at, type: datetime, source: input, description: "Facility license expiry timestamp" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED — a commissary is usable for cart approval only when ACTIVE and license unexpired" }

  - name: Cart
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; owning vendor" }
      - { name: commissary_id, type: string, source: input, description: "FK -> Commissary.id; the cart's base-of-operations commissary" }
      - { name: cart_type, type: enum, source: input, description: "FOOD | PRODUCE | MERCHANDISE" }
      - { name: size_sqft, type: integer, source: input, description: "Cart footprint in square feet; drives size fee tier" }
      - { name: inspection_status, type: enum, source: computed, default: "PENDING", description: "PENDING | PASS | FAIL — latest inspection result; PASS also requires inspection_expires_at > clock" }
      - { name: inspection_score, type: integer, source: system, description: "Score from the most recent inspection (0-100); null if never inspected" }
      - { name: inspection_expires_at, type: datetime, source: system, description: "Expiry of the most recent passing inspection; null if never inspected" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | APPROVED | IMPOUNDED | RETIRED" }

  - name: Zone
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vending zone / route name" }
      - { name: zone_type, type: enum, source: input, description: "PRIME | STANDARD — PRIME spots are allocated by lottery" }
      - { name: capacity_slots, type: integer, source: input, description: "Total concurrent spot occupations permitted in this zone" }
      - { name: spacing_min_feet, type: integer, source: input, description: "Minimum feet required between two concurrently-occupied spots (spatial buffer; equality is allowed)" }
      - { name: assigned_slots, type: integer, source: computed, default: 0, description: "= count(SpotAssignment where zone_id == this.id AND status == ACTIVE)" }
      - { name: available_slots, type: integer, source: computed, description: "= capacity_slots - assigned_slots (slot conservation invariant: assigned_slots + available_slots == capacity_slots)" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CLOSED — new assignments blocked when CLOSED" }

  - name: Spot
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> Zone.id; the zone this spot belongs to" }
      - { name: label, type: string, source: input, description: "Human label for the spot" }
      - { name: position_feet, type: integer, source: input, description: "Linear position of the spot along the zone route, in feet; used for spacing arithmetic" }
      - { name: status, type: enum, source: computed, default: "AVAILABLE", description: "AVAILABLE | ASSIGNED | BLOCKED — ASSIGNED iff it has an ACTIVE SpotAssignment" }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; permit holder" }
      - { name: cart_id, type: string, source: input, description: "FK -> Cart.id; the cart operated under this permit" }
      - { name: zone_id, type: string, source: input, description: "FK -> Zone.id; the zone the permit authorizes vending in" }
      - { name: permit_type, type: enum, source: input, description: "FOOD | PRODUCE | MERCHANDISE" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | ISSUED | SUSPENDED | REVOKED" }
      - { name: fee_variant, type: enum, source: system, description: "NEW | RENEWAL_EARLY | RENEWAL_LATE — which fee algorithm produced fee_amount_cents on the last assessment" }
      - { name: fee_amount_cents, type: integer, source: computed, description: "Assessed permit fee (see permit_fee calculation); set at issue and re-set at each renew" }
      - { name: issued_at, type: datetime, source: system, description: "Timestamp the permit was first issued; null while DRAFT/SUBMITTED" }
      - { name: expires_at, type: datetime, source: system, description: "Current term expiry = issued_at (or last renewal instant) + PERMIT_TERM_DAYS; null while DRAFT/SUBMITTED" }
      - { name: violation_points, type: integer, source: computed, default: 0, description: "= sum of points over UPHELD violations on this permit within trailing VIOLATION_POINT_WINDOW_DAYS of clock" }

  - name: Lottery
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> Zone.id; the PRIME zone whose spots are being allocated" }
      - { name: entry_fee_cents, type: integer, source: input, description: "Non-refundable fee charged to a vendor's balance on each entry" }
      - { name: term_start_at, type: datetime, source: input, description: "start_at applied to SpotAssignments minted by the draw (half-open interval start)" }
      - { name: term_end_at, type: datetime, source: input, description: "end_at applied to SpotAssignments minted by the draw (half-open interval end)" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | DRAWN — DRAWN is terminal" }
      - { name: awarded_count, type: integer, source: computed, default: 0, description: "= count(LotteryEntry where lottery_id == this.id AND status == AWARDED)" }

  - name: LotteryEntry
    parent: null
    common_fields: true
    fields:
      - { name: lottery_id, type: string, source: input, description: "FK -> Lottery.id; the lottery entered" }
      - { name: permit_id, type: string, source: input, description: "FK -> Permit.id; the ISSUED permit under which the vendor competes" }
      - { name: preferred_spot_ids, type: array, source: input, description: "Ordered list of Spot ids (most preferred first) the entrant will accept" }
      - { name: rank_score, type: integer, source: computed, description: "Deterministic lottery ranking score (see lottery_ranking calculation); set at draw" }
      - { name: awarded_spot_id, type: string, source: system, description: "Spot id awarded to this entry, or null if WAITLISTED" }
      - { name: status, type: enum, source: system, default: "ENTERED", description: "ENTERED | AWARDED | WAITLISTED — AWARDED/WAITLISTED are terminal, set by draw" }

  - name: SpotAssignment
    parent: null
    common_fields: true
    fields:
      - { name: spot_id, type: string, source: input, description: "FK -> Spot.id; the occupied spot" }
      - { name: permit_id, type: string, source: input, description: "FK -> Permit.id; the permit occupying the spot" }
      - { name: zone_id, type: string, source: system, description: "Denormalized zone id copied from Spot.zone_id for spacing/capacity queries (not a direct request FK)" }
      - { name: position_feet, type: integer, source: system, description: "Denormalized Spot.position_feet snapshot for spacing arithmetic" }
      - { name: start_at, type: datetime, source: input, description: "Occupation window start (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "Occupation window end (exclusive); half-open interval [start_at, end_at)" }
      - { name: origin, type: enum, source: system, default: "DIRECT", description: "DIRECT | LOTTERY — how the assignment was created" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | RELEASED — RELEASED is terminal" }

  - name: Violation
    parent: null
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: input, description: "FK -> Permit.id; the permit cited" }
      - { name: violation_type, type: enum, source: input, description: "MINOR | MAJOR | CRITICAL — determines points and fine" }
      - { name: description, type: string, source: input, description: "Free-text citation detail" }
      - { name: points, type: integer, source: computed, description: "= VIOLATION_POINTS[violation_type]; contributes to permit.violation_points only while UPHELD" }
      - { name: fine_cents, type: integer, source: computed, description: "= VIOLATION_FINE_CENTS[violation_type]; charged to vendor balance at issue, reversed on DISMISSED" }
      - { name: issuer_user_id, type: string, source: system, description: "X-User-ID of the EnforcementOfficer who issued the citation; used for four-eyes segregation on adjudication" }
      - { name: source_complaint_id, type: string, source: system, description: "Complaint id that generated this citation when auto-created by substantiation; null for officer-issued citations" }
      - { name: status, type: enum, source: system, default: "ISSUED", description: "ISSUED | CONTESTED | UPHELD | DISMISSED — UPHELD/DISMISSED terminal" }

  - name: Impound
    parent: null
    common_fields: true
    fields:
      - { name: cart_id, type: string, source: input, description: "FK -> Cart.id; the impounded cart" }
      - { name: reason, type: enum, source: input, description: "UNPERMITTED | HEALTH_HAZARD | ABANDONMENT | SPACING" }
      - { name: impounded_at, type: datetime, source: input, description: "Instant the cart entered impound (storage accrual start)" }
      - { name: settled_at, type: datetime, source: system, description: "Instant of release or forfeiture (storage accrual end); null while HELD" }
      - { name: storage_days, type: integer, source: computed, description: "= max(1, ceil((settled_at - impounded_at)/1 day)); billed days" }
      - { name: settlement_variant, type: enum, source: system, description: "RELEASE | FORFEITURE — which settlement algorithm was applied" }
      - { name: release_fee_cents, type: integer, source: computed, description: "Amount charged to the vendor on RELEASE; 0 under FORFEITURE (see impound_settlement calculation)" }
      - { name: municipal_writeoff_cents, type: integer, source: computed, description: "Municipal cost recorded on FORFEITURE; 0 under RELEASE (see impound_settlement calculation)" }
      - { name: status, type: enum, source: system, default: "HELD", description: "HELD | RELEASED | FORFEITED — RELEASED/FORFEITED terminal" }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: input, description: "FK -> Permit.id; the permit complained about" }
      - { name: complaint_type, type: enum, source: input, description: "NOISE | SANITATION | BLOCKING | UNPERMITTED" }
      - { name: description, type: string, source: input, description: "Free-text complaint detail" }
      - { name: resolution, type: string, source: system, description: "Officer resolution note; null until resolved" }
      - { name: generated_violation_id, type: string, source: system, description: "Violation id auto-created on SUBSTANTIATED resolution; null otherwise" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | SUBSTANTIATED | UNFOUNDED — SUBSTANTIATED/UNFOUNDED terminal" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Permit
    initial_state: DRAFT
    terminal_states: [REVOKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /permits/{id}/submit"
        actor: Vendor
        preconditions: ["acting vendor owns the permit (X-User-ID == permit.vendor_id)"]
        side_effects: []

      - from: SUBMITTED
        to: ISSUED
        trigger: "POST /permits/{id}/issue"
        actor: PermitOfficer
        preconditions:
          - "vendor.insurance_status == ACTIVE (else ERR_INSURANCE_NOT_ACTIVE) [Permit<->Vendor cross-entity]"
          - "cart.status == APPROVED (else ERR_CART_NOT_APPROVED) [Permit<->Cart cross-entity]"
          - "no other Permit for permit.cart_id in status ISSUED whose [issued_at, expires_at] validity window (inclusive/closed) overlaps this permit's prospective [clock, clock+PERMIT_TERM_DAYS] window (else ERR_PERMIT_OVERLAP)"
        side_effects:
          - "fee_variant = NEW; fee_amount_cents computed via permit_fee(NEW)"
          - "issued_at = clock; expires_at = clock + PERMIT_TERM_DAYS"
          - "vendor.total_charged_cents += fee_amount_cents; vendor.balance_owed_cents recomputed"

      - from: ISSUED
        to: SUSPENDED
        trigger: "POST /permits/{id}/suspend OR system cascade (points threshold / inspection FAIL / cart impound)"
        actor: "PermitOfficer | EnforcementOfficer | system"
        preconditions: []
        side_effects:
          - "every ACTIVE SpotAssignment with permit_id == this.id transitions ACTIVE->RELEASED (cascade); each release sets its Spot AVAILABLE and decrements zone.assigned_slots and bumps zone.version"

      - from: SUSPENDED
        to: ISSUED
        trigger: "POST /permits/{id}/reinstate"
        actor: PermitOfficer
        preconditions:
          - "permit.violation_points < SUSPENSION_POINT_THRESHOLD (else ERR_INVALID_STATE)"
          - "cart.status == APPROVED (else ERR_CART_NOT_APPROVED)"
        side_effects: ["updated_at refreshed; spot assignments are NOT auto-restored"]
        note: "Cyclic edge: ISSUED <-> SUSPENDED (revision loop)"

      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /permits/{id}/revoke"
        actor: PermitOfficer
        preconditions: []
        side_effects: ["permit permanently closed; no further transitions"]

  - entity: Cart
    initial_state: PENDING
    terminal_states: [RETIRED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /carts/{id}/approve"
        actor: PermitOfficer
        preconditions:
          - "cart.inspection_status == PASS with unexpired inspection (else ERR_INSPECTION_NOT_PASSED)"
          - "commissary.status == ACTIVE AND commissary.license_expires_at > clock (else ERR_COMMISSARY_NOT_ACTIVE) [Cart<->Commissary cross-entity]"
        side_effects: []

      - from: APPROVED
        to: IMPOUNDED
        trigger: "POST /carts/{id}/impounds (Impound created)"
        actor: EnforcementOfficer
        preconditions: []
        side_effects:
          - "creates Impound (HELD)"
          - "every ISSUED Permit with cart_id == this.id transitions ISSUED->SUSPENDED (cascade), which itself releases that permit's ACTIVE SpotAssignments"

      - from: IMPOUNDED
        to: APPROVED
        trigger: "POST /impounds/{id}/release"
        actor: EnforcementOfficer
        preconditions: ["impound.status == HELD"]
        side_effects: ["impound settlement RELEASE computed; release_fee charged to vendor balance"]
        note: "Cyclic edge: APPROVED <-> IMPOUNDED"

      - from: IMPOUNDED
        to: RETIRED
        trigger: "POST /impounds/{id}/forfeit"
        actor: EnforcementOfficer
        preconditions: ["impound.status == HELD"]
        side_effects: ["impound settlement FORFEITURE computed; municipal_writeoff recorded; cart permanently retired"]

  - entity: Violation
    initial_state: ISSUED
    terminal_states: [UPHELD, DISMISSED]
    transitions:
      - from: ISSUED
        to: CONTESTED
        trigger: "POST /violations/{id}/contest"
        actor: Vendor
        preconditions: ["acting vendor owns the cited permit"]
        side_effects: []

      - from: CONTESTED
        to: ISSUED
        trigger: "POST /violations/{id}/withdraw-contest"
        actor: Vendor
        preconditions: ["acting vendor owns the cited permit"]
        side_effects: []
        note: "Cyclic edge: ISSUED <-> CONTESTED (negotiation loop)"

      - from: ISSUED
        to: UPHELD
        trigger: "POST /violations/{id}/adjudicate (outcome=UPHOLD)"
        actor: EnforcementOfficer
        preconditions: ["adjudicating officer X-User-ID != violation.issuer_user_id (else ERR_SELF_ADJUDICATION, four-eyes SoD)"]
        side_effects:
          - "points now count toward permit.violation_points (recompute over window)"
          - "if permit.violation_points >= SUSPENSION_POINT_THRESHOLD and permit.status == ISSUED: permit ISSUED->SUSPENDED (cascade, which releases ACTIVE spot assignments)"

      - from: CONTESTED
        to: UPHELD
        trigger: "POST /violations/{id}/adjudicate (outcome=UPHOLD)"
        actor: EnforcementOfficer
        preconditions: ["adjudicating officer X-User-ID != violation.issuer_user_id (else ERR_SELF_ADJUDICATION)"]
        side_effects:
          - "points now count toward permit.violation_points (recompute over window)"
          - "if permit.violation_points >= SUSPENSION_POINT_THRESHOLD and permit.status == ISSUED: permit ISSUED->SUSPENDED (cascade)"

      - from: ISSUED
        to: DISMISSED
        trigger: "POST /violations/{id}/adjudicate (outcome=DISMISS)"
        actor: EnforcementOfficer
        preconditions: ["adjudicating officer X-User-ID != violation.issuer_user_id (else ERR_SELF_ADJUDICATION)"]
        side_effects: ["vendor.total_credited_cents += fine_cents (compensating reversal of the issue-time charge); balance_owed recomputed"]

      - from: CONTESTED
        to: DISMISSED
        trigger: "POST /violations/{id}/adjudicate (outcome=DISMISS)"
        actor: EnforcementOfficer
        preconditions: ["adjudicating officer X-User-ID != violation.issuer_user_id (else ERR_SELF_ADJUDICATION)"]
        side_effects: ["vendor.total_credited_cents += fine_cents (compensating reversal); balance_owed recomputed"]

  - entity: Complaint
    initial_state: OPEN
    terminal_states: [SUBSTANTIATED, UNFOUNDED]
    transitions:
      - from: OPEN
        to: SUBSTANTIATED
        trigger: "POST /complaints/{id}/resolve (resolution_outcome=SUBSTANTIATED)"
        actor: EnforcementOfficer
        preconditions: ["complaint.status == OPEN"]
        side_effects:
          - "auto-create Violation on complaint.permit_id with violation_type = SANITATION-mapped severity MAJOR, status=ISSUED, then immediately UPHELD by the resolving officer; sets complaint.generated_violation_id"
          - "the generated UPHELD violation recomputes permit.violation_points which may trigger the ISSUED->SUSPENDED cascade (depth-4 chain: Complaint -> Violation -> Permit -> SpotAssignment -> Zone/Spot)"

      - from: OPEN
        to: UNFOUNDED
        trigger: "POST /complaints/{id}/resolve (resolution_outcome=UNFOUNDED)"
        actor: EnforcementOfficer
        preconditions: ["complaint.status == OPEN"]
        side_effects: ["no violation created; branch produces no fiscal or permit-state effect"]

  - entity: Lottery
    initial_state: OPEN
    terminal_states: [DRAWN]
    transitions:
      - from: OPEN
        to: DRAWN
        trigger: "POST /lotteries/{id}/draw"
        actor: PermitOfficer
        preconditions: ["lottery.status == OPEN (else ERR_LOTTERY_NOT_OPEN)", "lottery.zone.status == OPEN"]
        side_effects:
          - "rank all ENTERED entries by lottery_ranking (desc score, tie-break entry.created_at ASC)"
          - "iterate ranked entries; award each its first available preferred Spot while zone.available_slots > 0; awarded entries -> AWARDED with awarded_spot_id, create SpotAssignment(origin=LOTTERY, ACTIVE), Spot->ASSIGNED, zone.assigned_slots++, zone.version++"
          - "entries with no available preferred spot or beyond capacity -> WAITLISTED"

  - entity: LotteryEntry
    initial_state: ENTERED
    terminal_states: [AWARDED, WAITLISTED]
    transitions:
      - from: ENTERED
        to: AWARDED
        trigger: "system (during POST /lotteries/{id}/draw)"
        actor: system
        preconditions: ["entry ranked within zone.available_slots and a preferred spot still available"]
        side_effects: ["awarded_spot_id set; SpotAssignment minted"]
      - from: ENTERED
        to: WAITLISTED
        trigger: "system (during POST /lotteries/{id}/draw)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SpotAssignment
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /spot-assignments/{id}/release OR system cascade (permit suspended)"
        actor: "PermitOfficer | Vendor | system"
        preconditions: ["assignment.status == ACTIVE"]
        side_effects:
          - "Spot -> AVAILABLE; zone.assigned_slots -= 1; zone.available_slots recomputed; zone.version += 1"

  - entity: Impound
    initial_state: HELD
    terminal_states: [RELEASED, FORFEITED]
    transitions:
      - from: HELD
        to: RELEASED
        trigger: "POST /impounds/{id}/release"
        actor: EnforcementOfficer
        preconditions: ["impound.status == HELD"]
        side_effects:
          - "settled_at = release_at; storage_days computed; settlement_variant=RELEASE; release_fee_cents via impound_settlement(RELEASE); vendor.total_charged_cents += release_fee_cents"
          - "cart IMPOUNDED -> APPROVED"

      - from: HELD
        to: FORFEITED
        trigger: "POST /impounds/{id}/forfeit"
        actor: EnforcementOfficer
        preconditions: ["impound.status == HELD"]
        side_effects:
          - "settled_at = forfeit_at; storage_days computed; settlement_variant=FORFEITURE; municipal_writeoff_cents via impound_settlement(FORFEITURE); release_fee_cents = 0 (no vendor charge)"
          - "cart IMPOUNDED -> RETIRED"

# =============================================================================
# Table 1.2.1: Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-zone
    parent_entity: Zone
    write_endpoint: "POST /permits/{id}/spot-assignments"
    occ_field: "expected_zone_version"
    description: |
      Creating a SpotAssignment consumes a Zone slot and advances Zone.version.
      A create whose expected_zone_version no longer matches the Zone's current
      version is rejected as stale: it captures the case where the client's view
      of the zone (its remaining capacity / occupied positions) has been
      invalidated by another assignment that legitimately consumed a slot since
      the client last read the zone.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: permit_fee
    trigger: "POST /permits/{id}/issue (NEW) and POST /permits/{id}/renew (RENEWAL_EARLY | RENEWAL_LATE)"
    algorithm: tiered_pricing
    formula: |
      components (whole cents):
        base_component = (variant == RENEWAL_EARLY) ? round_half_up(PERMIT_BASE_FEE_CENTS * RENEWAL_BASE_FACTOR)
                                                     : PERMIT_BASE_FEE_CENTS
        zone_component = ZONE_SURCHARGE_CENTS[zone.zone_type]          # PRIME=15000, STANDARD=5000
        size_component = CART_SIZE_FEE_CENTS[size_tier(cart.size_sqft)] # SMALL<=20:3500, MEDIUM 21..40:6500, LARGE>40:11000
      # ROUND-PER-COMPONENT then SUM (pinned order; NOT sum-then-round):
      tax = round_half_up(base_component * FEE_TAX_RATE)
          + round_half_up(zone_component * FEE_TAX_RATE)
          + round_half_up(size_component * FEE_TAX_RATE)
      fee = base_component + zone_component + size_component + tax
      if variant == RENEWAL_LATE: fee += RENEWAL_LATE_PENALTY_CENTS
    input_set: "single Permit's zone.zone_type and cart.size_sqft; variant selected by endpoint and renewal timing"
    constants:
      PERMIT_BASE_FEE_CENTS: 20000
      ZONE_SURCHARGE_CENTS: { PRIME: 15000, STANDARD: 5000 }
      CART_SIZE_FEE_CENTS: { SMALL: 3500, MEDIUM: 6500, LARGE: 11000 }
      FEE_TAX_RATE: 0.0875
      RENEWAL_BASE_FACTOR: 0.80
      RENEWAL_LATE_PENALTY_CENTS: 7500
      PERMIT_TERM_DAYS: 365
      RENEWAL_GRACE_DAYS: 30
    precision: "whole cents, round_half_up applied per component before summing"
    variants:
      - name: NEW
        when: "first issuance (POST /permits/{id}/issue)"
        difference: "base_component is full PERMIT_BASE_FEE_CENTS; no penalty"
      - name: RENEWAL_EARLY
        when: "renew while clock < permit.expires_at"
        difference: "base_component discounted by RENEWAL_BASE_FACTOR; no penalty"
      - name: RENEWAL_LATE
        when: "renew while permit.expires_at <= clock < permit.expires_at + RENEWAL_GRACE_DAYS"
        difference: "base_component full; RENEWAL_LATE_PENALTY_CENTS added after tax. clock >= expires_at + grace => ERR_RENEWAL_WINDOW_CLOSED"

  - name: impound_settlement
    trigger: "POST /impounds/{id}/release (RELEASE) and POST /impounds/{id}/forfeit (FORFEITURE)"
    algorithm: tiered_pricing
    formula: |
      storage_days = max(1, ceil((settled_at - impounded_at) / 1 day))
      # tiered storage: first STORAGE_TIER1_DAYS at RATE1, remainder at RATE2
      tier1 = min(storage_days, STORAGE_TIER1_DAYS)
      tier2 = max(0, storage_days - STORAGE_TIER1_DAYS)
      storage_cost = tier1 * STORAGE_DAILY_RATE1_CENTS + tier2 * STORAGE_DAILY_RATE2_CENTS
      if variant == RELEASE:
        release_fee_cents = IMPOUND_BASE_FEE_CENTS + storage_cost + IMPOUND_ADMIN_FEE_CENTS
        municipal_writeoff_cents = 0
      if variant == FORFEITURE:
        municipal_writeoff_cents = IMPOUND_BASE_FEE_CENTS + storage_cost   # no admin fee, no vendor charge
        release_fee_cents = 0
    input_set: "single Impound's impounded_at and settlement instant; variant selected by endpoint"
    constants:
      IMPOUND_BASE_FEE_CENTS: 10000
      IMPOUND_ADMIN_FEE_CENTS: 5000
      STORAGE_TIER1_DAYS: 7
      STORAGE_DAILY_RATE1_CENTS: 2500
      STORAGE_DAILY_RATE2_CENTS: 4000
      FORFEIT_AFTER_DAYS: 30
    precision: "whole cents"
    variants:
      - name: RELEASE
        when: "owner reclaims cart via release"
        difference: "vendor charged base + tiered storage + admin fee; no municipal writeoff"
      - name: FORFEITURE
        when: "cart forfeited via forfeit"
        difference: "no vendor charge; municipal writeoff = base + tiered storage (admin fee excluded)"

  - name: violation_points_total
    trigger: "any Violation transition into or out of UPHELD; read on permit issuance-gating and reinstate"
    algorithm: aggregation
    formula: |
      permit.violation_points = sum(
        VIOLATION_POINTS[v.violation_type]
        for v in Violations
        where v.permit_id == permit.id
          and v.status == UPHELD
          and v.updated_at >= clock - VIOLATION_POINT_WINDOW_DAYS days
      )
      # threshold side-effect handled in Violation UPHELD transition:
      if permit.violation_points >= SUSPENSION_POINT_THRESHOLD: suspend permit (>=, boundary inclusive)
    input_set: "UPHELD violations on the permit within the trailing window; DISMISSED/CONTESTED/ISSUED excluded"
    constants:
      VIOLATION_POINTS: { MINOR: 3, MAJOR: 6, CRITICAL: 12 }
      VIOLATION_FINE_CENTS: { MINOR: 5000, MAJOR: 12000, CRITICAL: 30000 }
      SUSPENSION_POINT_THRESHOLD: 12
      VIOLATION_POINT_WINDOW_DAYS: 365
    precision: "integer points"

  - name: lottery_ranking
    trigger: "POST /lotteries/{id}/draw"
    algorithm: weighted_scoring
    formula: |
      for each ENTERED entry e (vendor = e.permit.vendor):
        if entry is INELIGIBLE -> excluded from award (forced WAITLISTED). INELIGIBLE iff:
             e.permit.status != ISSUED
             OR vendor has any Cart with an Impound in status HELD
        else:
          rank_score = vendor.seniority_years * LOTTERY_W_SENIORITY
                     + vendor.compliance_score * LOTTERY_W_COMPLIANCE
                     - e.permit.violation_points * LOTTERY_W_VIOLATION
      order eligible entries by rank_score DESC, then entry.created_at ASC (tie-break; never id/random)
      award down the ordered list, each taking its first still-available preferred spot,
      until zone.available_slots is exhausted; the rest -> WAITLISTED
    input_set: "ENTERED entries on the lottery; ineligible ones never win a spot"
    constants:
      LOTTERY_W_SENIORITY: 10
      LOTTERY_W_COMPLIANCE: 1
      LOTTERY_W_VIOLATION: 5
    precision: "integer score; selector fully deterministic (eligibility predicate, ranking key, created_at tie-break, empty-pool -> all WAITLISTED)"

  - name: spot_occupation_conflict
    trigger: "POST /permits/{id}/spot-assignments and lottery award"
    algorithm: interval_merge
    formula: |
      # (i) TIME overlap on the SAME Spot (resource = Spot); half-open intervals [start,end)
      reject (ERR_SPOT_TIME_CONFLICT) if exists ACTIVE SpotAssignment a2 with
        a2.spot_id == new.spot_id
        and new.start_at < a2.end_at and a2.start_at < new.end_at   # touching at a boundary is allowed
      # (ii) SPACING buffer across the Zone (resource = Zone); spatial distance semantics
      reject (ERR_SPACING_VIOLATION) if exists ACTIVE SpotAssignment a2 with
        a2.zone_id == new.zone_id
        and abs(new.position_feet - a2.position_feet) < zone.spacing_min_feet   # equality allowed (>=)
        and new.start_at < a2.end_at and a2.start_at < new.end_at
    input_set: "ACTIVE SpotAssignments in the target Spot / Zone"
    precision: "time overlap is half-open (boundary-touch OK); spacing is strict-less-than the buffer (equality OK)"

  - name: money_conservation
    trigger: "any charge or credit side effect on a Vendor"
    algorithm: aggregation
    formula: |
      vendor.balance_owed_cents = vendor.total_charged_cents - vendor.total_credited_cents
      # conserved: for every forward charge (permit fee, fine, impound release fee, lottery entry fee)
      # paired with its compensating credit (payment, dismissed-fine reversal),
      # balance_owed_cents returns to its pre-pair value. No drift.
    input_set: "all charge/credit accumulator mutations on the vendor"
    precision: "whole cents"

  - name: zone_slot_conservation
    trigger: "SpotAssignment ACTIVE create / RELEASED"
    algorithm: aggregation
    formula: |
      zone.assigned_slots = count(SpotAssignment where zone_id == zone.id and status == ACTIVE)
      zone.available_slots = zone.capacity_slots - zone.assigned_slots
      # invariant (conserved partition): assigned_slots + available_slots == capacity_slots always
    input_set: "ACTIVE SpotAssignments in the zone"
    precision: "integer slot counts"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and valid"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "acting role permitted for this endpoint per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "entity_backed Vendor acting on a resource it does not own (X-User-ID != resource.vendor_id / owning permit's vendor_id)"
    error_id: ERR_OWNERSHIP
    http_status: 403
    applies_to: "vendor-owned mutations (carts, insurance, payments, permit submit/renew, contest/withdraw-contest, own lottery entry, spot-assignment release by vendor)"

  - priority: 4
    category: existence
    check: "all path/body referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: business_constraint
    check: "request body well-formed; required fields present; types correct"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all writes

  - priority: 6
    category: business_constraint
    check: "enum fields carry a declared member"
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "endpoints with enum inputs"

  - priority: 7
    category: state
    check: "target resource in a legal state for the transition (incl. terminal-state lockdown)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: state
    check: "transition attempted from a terminal state"
    error_id: ERR_TERMINAL_STATE
    http_status: 409
    applies_to: "resources with terminal states"

  - priority: 9
    category: business_safety
    check: "permit issuance requires vendor.insurance_status == ACTIVE"
    error_id: ERR_INSURANCE_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /permits/{id}/issue"

  - priority: 10
    category: business_safety
    check: "insurance submission coverage below MIN_INSURANCE_COVERAGE_CENTS"
    error_id: ERR_INSUFFICIENT_COVERAGE
    http_status: 422
    applies_to: "POST /vendors/{id}/insurance"

  - priority: 11
    category: business_safety
    check: "cart approval requires a PASS unexpired inspection and an ACTIVE unexpired commissary"
    error_id: "ERR_INSPECTION_NOT_PASSED | ERR_COMMISSARY_NOT_ACTIVE"
    http_status: 422
    applies_to: "POST /carts/{id}/approve"

  - priority: 12
    category: business_temporal
    check: "no ISSUED permit for the same cart with an overlapping validity window (closed interval)"
    error_id: ERR_PERMIT_OVERLAP
    http_status: 409
    applies_to: "POST /permits/{id}/issue"

  - priority: 13
    category: business_temporal
    check: "renewal attempted after expires_at + RENEWAL_GRACE_DAYS"
    error_id: ERR_RENEWAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /permits/{id}/renew"

  - priority: 14
    category: business_temporal
    check: "spot occupation time window collides with an ACTIVE assignment on the same Spot (half-open)"
    error_id: ERR_SPOT_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /permits/{id}/spot-assignments"

  - priority: 15
    category: business_constraint
    check: "spot within spacing_min_feet of a concurrently ACTIVE assignment in the zone (strict-less buffer)"
    error_id: ERR_SPACING_VIOLATION
    http_status: 409
    applies_to: "POST /permits/{id}/spot-assignments"

  - priority: 16
    category: business_constraint
    check: "four-eyes: adjudicating officer must differ from the citing officer"
    error_id: ERR_SELF_ADJUDICATION
    http_status: 403
    applies_to: "POST /violations/{id}/adjudicate"

  - priority: 17
    category: business_constraint
    check: "lottery entry requires an ISSUED permit; draw requires an OPEN lottery"
    error_id: "ERR_NOT_ELIGIBLE_LOTTERY | ERR_LOTTERY_NOT_OPEN"
    http_status: 422
    applies_to: "POST /lotteries/{id}/entries, POST /lotteries/{id}/draw"

  - priority: 18
    category: business_fiscal
    check: "zone at capacity (available_slots <= 0) or zone CLOSED"
    error_id: "ERR_ZONE_CAPACITY_FULL | ERR_ZONE_CLOSED"
    http_status: 409
    applies_to: "POST /permits/{id}/spot-assignments"

  - priority: 19
    category: business_fiscal
    check: "payment amount must be > 0 and not exceed current balance_owed_cents"
    error_id: ERR_PAYMENT_INVALID
    http_status: 422
    applies_to: "POST /vendors/{id}/payments"

  - priority: 20
    category: concurrency
    check: "expected_zone_version must equal Zone.version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /permits/{id}/spot-assignments"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- System / clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Default before any call: 2026-05-01T00:00:00Z (never real wall-clock). All deadline/expiry/window rules read this clock."
    roles: [PermitOfficer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

  # --- Vendor ---
  - method: POST
    path: "/vendors"
    description: "Register a vendor"
    roles: [PermitOfficer]
    code: 201
    input: ["legal_name", "contact_email", "seniority_years?"]
    output: Vendor
    side_effects: ["status=ACTIVE, insurance_status=NONE, accumulators=0"]

  - method: GET
    path: "/vendors/{id}"
    description: "Get a vendor (incl. computed insurance_status, balance_owed_cents, compliance_score)"
    roles: [Vendor, PermitOfficer, EnforcementOfficer, HealthInspector]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  - method: POST
    path: "/vendors/{id}/insurance"
    description: "Submit/renew the vendor's liability policy (replaces current coverage window)"
    roles: [Vendor]
    code: 200
    input: [insurance_effective_at, insurance_expires_at, insurance_coverage_cents]
    output: Vendor
    side_effects: ["coverage window fields set; insurance_status recomputed against clock and MIN_INSURANCE_COVERAGE_CENTS"]

  - method: POST
    path: "/vendors/{id}/payments"
    description: "Record a payment against the vendor's outstanding balance"
    roles: [Vendor]
    code: 200
    input: [amount_cents]
    output: Vendor
    side_effects: ["vendor.total_credited_cents += amount_cents; balance_owed_cents recomputed"]

  # --- Commissary ---
  - method: POST
    path: "/commissaries"
    description: "Register a commissary facility"
    roles: [HealthInspector]
    code: 201
    input: [name, health_grade, license_expires_at]
    output: Commissary
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/commissaries/{id}"
    description: "Get a commissary"
    roles: [Vendor, HealthInspector, PermitOfficer]
    code: 200
    input: []
    output: Commissary
    side_effects: []

  - method: PATCH
    path: "/commissaries/{id}"
    description: "Update commissary status / license (e.g., suspend on health failure)"
    roles: [HealthInspector]
    code: 200
    input: ["status?", "license_expires_at?"]
    output: Commissary
    side_effects: ["status/license updated (does not retroactively un-approve already-APPROVED carts)"]

  # --- Cart ---
  - method: POST
    path: "/carts"
    description: "Register a cart under a vendor and commissary"
    roles: [Vendor]
    code: 201
    input: [vendor_id, commissary_id, cart_type, size_sqft]
    output: Cart
    side_effects: ["status=PENDING, inspection_status=PENDING"]

  - method: GET
    path: "/carts/{id}"
    description: "Get a cart"
    roles: [Vendor, PermitOfficer, HealthInspector, EnforcementOfficer]
    code: 200
    input: []
    output: Cart
    side_effects: []

  - method: GET
    path: "/carts"
    description: "List carts (filterable). Reverse-reachability for Cart.vendor_id and Cart.commissary_id."
    roles: [Vendor, PermitOfficer, HealthInspector, EnforcementOfficer]
    code: 200
    input: ["vendor_id?", "commissary_id?", "status?", "limit?", "offset?"]
    output: Cart[]
    side_effects: []

  - method: POST
    path: "/carts/{id}/inspect"
    description: "Record a health/safety inspection result on a cart"
    roles: [HealthInspector]
    code: 201
    input: ["inspection_type", "result", "score", "inspection_expires_at?"]
    output: Cart
    side_effects:
      - "inspection_status = result (PASS|FAIL), inspection_score, inspection_expires_at set"
      - "on result=FAIL: every ISSUED Permit with this cart_id transitions ISSUED->SUSPENDED (cascade -> releases ACTIVE SpotAssignments)"

  - method: POST
    path: "/carts/{id}/approve"
    description: "Approve a cart for operation"
    roles: [PermitOfficer]
    code: 200
    input: []
    output: Cart
    side_effects: ["PENDING->APPROVED (requires PASS inspection + ACTIVE commissary)"]

  # --- Zone / Spot ---
  - method: POST
    path: "/zones"
    description: "Create a vending zone/route"
    roles: [PermitOfficer]
    code: 201
    input: [name, zone_type, capacity_slots, spacing_min_feet]
    output: Zone
    side_effects: ["status=OPEN, assigned_slots=0, available_slots=capacity_slots"]

  - method: GET
    path: "/zones/{id}"
    description: "Get a zone (incl. computed slot counts)"
    roles: [Vendor, PermitOfficer]
    code: 200
    input: []
    output: Zone
    side_effects: []

  - method: POST
    path: "/zones/{id}/spots"
    description: "Create a spot at a linear position within a zone"
    roles: [PermitOfficer]
    code: 201
    input: [label, position_feet]
    output: Spot
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/zones/{id}/spots"
    description: "List spots in a zone. Reverse-reachability for Spot.zone_id."
    roles: [Vendor, PermitOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Spot[]
    side_effects: []

  - method: GET
    path: "/spots/{id}"
    description: "Get a spot"
    roles: [Vendor, PermitOfficer]
    code: 200
    input: []
    output: Spot
    side_effects: []

  # --- Permit ---
  - method: POST
    path: "/permits"
    description: "Create a permit application (DRAFT)"
    roles: [Vendor]
    code: 201
    input: [vendor_id, cart_id, zone_id, permit_type]
    output: Permit
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/permits/{id}"
    description: "Get a permit (incl. computed fee_amount_cents, violation_points)"
    roles: [Vendor, PermitOfficer, EnforcementOfficer]
    code: 200
    input: []
    output: Permit
    side_effects: []

  - method: GET
    path: "/permits"
    description: "List permits (filterable). Reverse-reachability for Permit.vendor_id, Permit.cart_id, Permit.zone_id."
    roles: [Vendor, PermitOfficer, EnforcementOfficer]
    code: 200
    input: ["vendor_id?", "cart_id?", "zone_id?", "status?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []

  - method: POST
    path: "/permits/{id}/submit"
    description: "Submit a DRAFT permit"
    roles: [Vendor]
    code: 200
    input: []
    output: Permit
    side_effects: ["DRAFT->SUBMITTED"]

  - method: POST
    path: "/permits/{id}/issue"
    description: "Issue a SUBMITTED permit (gated by insurance/cart/overlap); charges NEW fee"
    roles: [PermitOfficer]
    code: 200
    input: []
    output: Permit
    side_effects:
      - "SUBMITTED->ISSUED"
      - "fee_variant=NEW; fee_amount_cents = permit_fee(NEW); vendor.total_charged_cents += fee_amount_cents"
      - "issued_at=clock; expires_at=clock+PERMIT_TERM_DAYS"

  - method: POST
    path: "/permits/{id}/suspend"
    description: "Suspend an ISSUED permit"
    roles: [PermitOfficer, EnforcementOfficer]
    code: 200
    input: ["reason?"]
    output: Permit
    side_effects: ["ISSUED->SUSPENDED; releases all ACTIVE SpotAssignments (cascade)"]

  - method: POST
    path: "/permits/{id}/reinstate"
    description: "Reinstate a SUSPENDED permit"
    roles: [PermitOfficer]
    code: 200
    input: []
    output: Permit
    side_effects: ["SUSPENDED->ISSUED (requires violation_points < threshold and cart APPROVED)"]

  - method: POST
    path: "/permits/{id}/revoke"
    description: "Revoke a SUSPENDED permit (terminal)"
    roles: [PermitOfficer]
    code: 200
    input: []
    output: Permit
    side_effects: ["SUSPENDED->REVOKED"]

  - method: POST
    path: "/permits/{id}/renew"
    description: "Renew an ISSUED permit; charges RENEWAL_EARLY or RENEWAL_LATE fee depending on clock vs expires_at"
    roles: [Vendor]
    code: 200
    input: []
    output: Permit
    side_effects:
      - "fee_variant=RENEWAL_EARLY|RENEWAL_LATE; fee_amount_cents = permit_fee(variant); vendor.total_charged_cents += fee_amount_cents"
      - "expires_at = clock + PERMIT_TERM_DAYS"

  - method: POST
    path: "/permits/{id}/violations"
    description: "Issue a violation/citation against a permit"
    roles: [EnforcementOfficer]
    code: 201
    input: [violation_type, description]
    output: Violation
    side_effects:
      - "status=ISSUED; points and fine_cents computed; issuer_user_id = X-User-ID"
      - "vendor.total_charged_cents += fine_cents (fine charged at issue)"

  - method: GET
    path: "/permits/{id}/violations"
    description: "List violations on a permit. Reverse-reachability for Violation.permit_id."
    roles: [Vendor, PermitOfficer, EnforcementOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Violation[]
    side_effects: []

  - method: POST
    path: "/permits/{id}/complaints"
    description: "File a public complaint against a permit"
    roles: [Resident, Vendor]
    code: 201
    input: [complaint_type, description]
    output: Complaint
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/permits/{id}/complaints"
    description: "List complaints on a permit. Reverse-reachability for Complaint.permit_id."
    roles: [Vendor, PermitOfficer, EnforcementOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []

  # --- Violation ---
  - method: GET
    path: "/violations/{id}"
    description: "Get a violation"
    roles: [Vendor, PermitOfficer, EnforcementOfficer]
    code: 200
    input: []
    output: Violation
    side_effects: []

  - method: POST
    path: "/violations/{id}/contest"
    description: "Vendor contests a violation"
    roles: [Vendor]
    code: 200
    input: []
    output: Violation
    side_effects: ["ISSUED->CONTESTED"]

  - method: POST
    path: "/violations/{id}/withdraw-contest"
    description: "Vendor withdraws a contest (cyclic back to ISSUED)"
    roles: [Vendor]
    code: 200
    input: []
    output: Violation
    side_effects: ["CONTESTED->ISSUED"]

  - method: POST
    path: "/violations/{id}/adjudicate"
    description: "Officer adjudicates a violation (four-eyes: adjudicator != issuer)"
    roles: [EnforcementOfficer]
    code: 200
    input: [outcome]
    output: Violation
    side_effects:
      - "outcome=UPHOLD: ->UPHELD; recompute permit.violation_points; may cascade permit ISSUED->SUSPENDED at threshold"
      - "outcome=DISMISS: ->DISMISSED; vendor.total_credited_cents += fine_cents (reversal)"

  # --- Impound (child of Cart) ---
  - method: POST
    path: "/carts/{id}/impounds"
    description: "Impound a cart (creates Impound HELD)"
    roles: [EnforcementOfficer]
    code: 201
    input: [reason, impounded_at]
    output: Impound
    side_effects:
      - "status=HELD; cart APPROVED->IMPOUNDED"
      - "every ISSUED Permit for this cart -> SUSPENDED (cascade -> releases ACTIVE SpotAssignments)"

  - method: GET
    path: "/carts/{id}/impounds"
    description: "List impounds for a cart. Reverse-reachability for Impound.cart_id."
    roles: [Vendor, EnforcementOfficer, PermitOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Impound[]
    side_effects: []

  - method: GET
    path: "/impounds/{id}"
    description: "Get an impound"
    roles: [Vendor, EnforcementOfficer, PermitOfficer]
    code: 200
    input: []
    output: Impound
    side_effects: []

  - method: POST
    path: "/impounds/{id}/release"
    description: "Release an impounded cart; charges RELEASE settlement to vendor"
    roles: [EnforcementOfficer]
    code: 200
    input: [release_at]
    output: Impound
    side_effects:
      - "HELD->RELEASED; storage_days + release_fee_cents via impound_settlement(RELEASE); vendor.total_charged_cents += release_fee_cents"
      - "cart IMPOUNDED->APPROVED"

  - method: POST
    path: "/impounds/{id}/forfeit"
    description: "Forfeit an impounded cart; records municipal writeoff, retires cart"
    roles: [EnforcementOfficer]
    code: 200
    input: [forfeit_at]
    output: Impound
    side_effects:
      - "HELD->FORFEITED; municipal_writeoff_cents via impound_settlement(FORFEITURE); release_fee_cents=0"
      - "cart IMPOUNDED->RETIRED"

  # --- Complaint ---
  - method: GET
    path: "/complaints/{id}"
    description: "Get a complaint"
    roles: [Vendor, Resident, PermitOfficer, EnforcementOfficer]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: POST
    path: "/complaints/{id}/resolve"
    description: "Resolve a complaint as SUBSTANTIATED (auto-creates+upholds a violation) or UNFOUNDED"
    roles: [EnforcementOfficer]
    code: 200
    input: ["resolution_outcome", "resolution?"]
    output: Complaint
    side_effects:
      - "OPEN->SUBSTANTIATED: auto-create Violation (MAJOR) on the permit, immediately UPHELD; sets generated_violation_id; may cascade permit suspension (depth-4)"
      - "OPEN->UNFOUNDED: no side effects"

  # --- Lottery ---
  - method: POST
    path: "/lotteries"
    description: "Open a lottery for a PRIME zone's spots"
    roles: [PermitOfficer]
    code: 201
    input: [zone_id, entry_fee_cents, term_start_at, term_end_at]
    output: Lottery
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/lotteries/{id}"
    description: "Get a lottery"
    roles: [Vendor, PermitOfficer]
    code: 200
    input: []
    output: Lottery
    side_effects: []

  - method: GET
    path: "/lotteries"
    description: "List lotteries (filterable). Reverse-reachability for Lottery.zone_id."
    roles: [Vendor, PermitOfficer]
    code: 200
    input: ["zone_id?", "status?", "limit?", "offset?"]
    output: Lottery[]
    side_effects: []

  - method: POST
    path: "/lotteries/{id}/entries"
    description: "Enter a lottery under an ISSUED permit (charges entry fee)"
    roles: [Vendor]
    code: 201
    input: [permit_id, preferred_spot_ids]
    output: LotteryEntry
    side_effects: ["status=ENTERED; vendor.total_charged_cents += lottery.entry_fee_cents"]

  - method: POST
    path: "/lotteries/{id}/draw"
    description: "Draw the lottery: deterministically rank entries and award spots"
    roles: [PermitOfficer]
    code: 200
    input: []
    output: Lottery
    side_effects:
      - "OPEN->DRAWN; entries ranked (lottery_ranking) and set AWARDED/WAITLISTED"
      - "AWARDED entries: SpotAssignment(origin=LOTTERY) minted; Spot->ASSIGNED; zone.assigned_slots++; zone.version++"

  - method: GET
    path: "/lottery-entries/{id}"
    description: "Get a lottery entry"
    roles: [Vendor, PermitOfficer]
    code: 200
    input: []
    output: LotteryEntry
    side_effects: []

  - method: GET
    path: "/lottery-entries"
    description: "List lottery entries (filterable). Reverse-reachability for LotteryEntry.lottery_id and LotteryEntry.permit_id."
    roles: [Vendor, PermitOfficer]
    code: 200
    input: ["lottery_id?", "permit_id?", "status?", "limit?", "offset?"]
    output: LotteryEntry[]
    side_effects: []

  # --- SpotAssignment ---
  - method: POST
    path: "/permits/{id}/spot-assignments"
    description: "Directly assign a spot to a permit (standard zones); enforces time overlap, spacing, capacity, and Zone OCC"
    roles: [PermitOfficer]
    code: 201
    input: [spot_id, start_at, end_at, expected_zone_version]
    output: SpotAssignment
    side_effects:
      - "status=ACTIVE; origin=DIRECT; zone_id/position_feet denormalized from Spot"
      - "Spot->ASSIGNED; zone.assigned_slots += 1; zone.available_slots recomputed; increments Zone.version by 1"

  - method: GET
    path: "/spot-assignments/{id}"
    description: "Get a spot assignment"
    roles: [Vendor, PermitOfficer]
    code: 200
    input: []
    output: SpotAssignment
    side_effects: []

  - method: GET
    path: "/spot-assignments"
    description: "List spot assignments (filterable). Reverse-reachability for SpotAssignment.spot_id and SpotAssignment.permit_id."
    roles: [Vendor, PermitOfficer]
    code: 200
    input: ["spot_id?", "permit_id?", "zone_id?", "status?", "limit?", "offset?"]
    output: SpotAssignment[]
    side_effects: []

  - method: POST
    path: "/spot-assignments/{id}/release"
    description: "Release an ACTIVE spot assignment"
    roles: [PermitOfficer, Vendor]
    code: 200
    input: []
    output: SpotAssignment
    side_effects: ["ACTIVE->RELEASED; Spot->AVAILABLE; zone.assigned_slots -= 1; zone.version += 1"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for endpoint" }
  - { id: ERR_OWNERSHIP, http: 403, condition: "Vendor acting on a resource it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body / missing required field / bad type" }
  - { id: ERR_INVALID_ENUM, http: 422, condition: "Enum field carries a non-member value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a legal state for the transition" }
  - { id: ERR_TERMINAL_STATE, http: 409, condition: "Transition attempted from a terminal state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_zone_version does not match Zone.version (OCC)" }
  - { id: ERR_INSURANCE_NOT_ACTIVE, http: 422, condition: "Permit issue attempted while vendor insurance not ACTIVE" }
  - { id: ERR_INSUFFICIENT_COVERAGE, http: 422, condition: "Insurance coverage below MIN_INSURANCE_COVERAGE_CENTS" }
  - { id: ERR_CART_NOT_APPROVED, http: 409, condition: "Permit issue/reinstate requires an APPROVED cart" }
  - { id: ERR_COMMISSARY_NOT_ACTIVE, http: 422, condition: "Cart approval requires an ACTIVE, unexpired commissary" }
  - { id: ERR_INSPECTION_NOT_PASSED, http: 422, condition: "Cart approval requires a PASS unexpired inspection" }
  - { id: ERR_PERMIT_OVERLAP, http: 409, condition: "Another ISSUED permit for the same cart has an overlapping validity window" }
  - { id: ERR_SPOT_TIME_CONFLICT, http: 409, condition: "Spot occupation time window collides with an ACTIVE assignment on the same spot" }
  - { id: ERR_SPACING_VIOLATION, http: 409, condition: "Spot within spacing_min_feet of a concurrently ACTIVE assignment in the zone" }
  - { id: ERR_ZONE_CAPACITY_FULL, http: 409, condition: "Zone has no available slots" }
  - { id: ERR_ZONE_CLOSED, http: 409, condition: "Zone status CLOSED; assignment blocked" }
  - { id: ERR_RENEWAL_WINDOW_CLOSED, http: 422, condition: "Renewal attempted after expires_at + RENEWAL_GRACE_DAYS" }
  - { id: ERR_SELF_ADJUDICATION, http: 403, condition: "Adjudicating officer equals the citing officer (four-eyes)" }
  - { id: ERR_LOTTERY_NOT_OPEN, http: 409, condition: "Draw attempted on a non-OPEN lottery" }
  - { id: ERR_NOT_ELIGIBLE_LOTTERY, http: 422, condition: "Lottery entry requires an ISSUED permit" }
  - { id: ERR_PAYMENT_INVALID, http: 422, condition: "Payment amount <= 0 or exceeds outstanding balance" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: Vendor
    description: "The permit holder / applicant. Acts only on its own vendor, carts, permits, insurance, payments, contests, lottery entries, and spot-assignment releases."
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /vendors/{id}/insurance"
      - "POST /vendors/{id}/payments"
      - "POST /carts (own vendor_id)"
      - "POST /permits (own vendor_id)"
      - "POST /permits/{id}/submit"
      - "POST /permits/{id}/renew"
      - "POST /violations/{id}/contest"
      - "POST /violations/{id}/withdraw-contest"
      - "POST /lotteries/{id}/entries (own permit)"
    shared_operations:
      - "POST /permits/{id}/complaints (with Resident)"
      - "POST /spot-assignments/{id}/release (with PermitOfficer)"
      - "GET reads on own vendor/carts/permits/violations/complaints/lotteries/spots/assignments"

  - name: PermitOfficer
    description: "Municipal permit administrator: registers vendors, manages zones/spots, issues/suspends/reinstates/revokes/renews-review permits, runs lotteries and direct spot assignments."
    identity: "opaque"
    exclusive_operations:
      - "POST /vendors"
      - "POST /zones, POST /zones/{id}/spots"
      - "POST /carts/{id}/approve"
      - "POST /permits/{id}/issue"
      - "POST /permits/{id}/reinstate"
      - "POST /permits/{id}/revoke"
      - "POST /lotteries, POST /lotteries/{id}/draw"
      - "POST /permits/{id}/spot-assignments"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /permits/{id}/suspend (with EnforcementOfficer)"
      - "POST /spot-assignments/{id}/release (with Vendor)"
      - "GET reads"

  - name: HealthInspector
    description: "Health department: manages commissaries and records cart inspections."
    identity: "opaque"
    exclusive_operations:
      - "POST /commissaries, PATCH /commissaries/{id}"
      - "POST /carts/{id}/inspect"
    shared_operations:
      - "GET reads on vendors/carts/commissaries"

  - name: EnforcementOfficer
    description: "Field enforcement: issues violations, adjudicates (four-eyes), impounds/releases/forfeits carts, resolves complaints."
    identity: "opaque"
    exclusive_operations:
      - "POST /permits/{id}/violations"
      - "POST /violations/{id}/adjudicate"
      - "POST /carts/{id}/impounds"
      - "POST /impounds/{id}/release, POST /impounds/{id}/forfeit"
      - "POST /complaints/{id}/resolve"
    shared_operations:
      - "POST /permits/{id}/suspend (with PermitOfficer)"
      - "GET reads"

  - name: Resident
    description: "Member of the public who files complaints. Opaque operational identity, not tied to any persisted entity."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /permits/{id}/complaints (with Vendor)"
      - "GET /complaints/{id}"

# Additional global constants referenced above
constants:
  MIN_INSURANCE_COVERAGE_CENTS: 100000000   # $1,000,000 minimum liability coverage
  PERMIT_TERM_DAYS: 365
  RENEWAL_GRACE_DAYS: 30
  SUSPENSION_POINT_THRESHOLD: 12
  VIOLATION_POINT_WINDOW_DAYS: 365
  DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00Z"
