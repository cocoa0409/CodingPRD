          - entities.Campaign.fields.objective_type
          - validations[priority 4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "objective_type is closed over {TRIAL_GENERATION, REVIEW_ACQUISITION, AWARENESS}; a fourth member is a priority-4 type violation (400), not a stored free-text value."
        test_recipe:
          setup:
            - "Empty database apart from the clock pin."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
