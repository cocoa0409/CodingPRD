              captures: { tx: $.data.id }
          trigger:
            - call: "POST /api/transactions/${tx}/void"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FORBIDDEN"

      - name: teller_cannot_read_ctr_filings
        claim_type: rbac_denial
        grounds: [roles, "endpoints[GET /api/ctr-filings]"]
        distinguishing_aspect: "CTRFiling reads are restricted to BranchManager/HeadTeller/Auditor: a Teller read is 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["Branch B; teller T exists"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
          trigger:
            - call: "GET /api/ctr-filings"
              payload: { branch_id: "${b_id}" }
              as: Teller
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FORBIDDEN"

  # -------------------------------------------------------------------------
  - section: complexity_layers
    instances:
      - name: version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules, entities.TellerDrawer]
        distinguishing_aspect: "Derived-field reconciliation of common fields: a drawer's version starts at 1 and increments by exactly 1 on each mutation (count -> 2, attest -> 3), with updated_at refreshed."
        test_recipe:
          setup: ["Branch B; teller T with OPEN drawer"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /api/drawers/${d_id}/count"
              payload: { counted_cash_cents: 0 }
              as: Teller
              as_user_id: "${t_id}"
              captures: { v1: $.data.version }
            - call: "POST /api/drawers/${d_id}/attest"
              payload: {}
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { v2: $.data.version }
          assert:
            - "${v0} == 1 and ${v1} == 2 and ${v2} == 3"

      - name: withdrawal_available_balance_net_of_holds
        claim_type: derived_field_reconciliation
        grounds: ["validations[priority=9]", calculations.hold_capture_amount, "errors[ERR_INSUFFICIENT_FUNDS]"]
        distinguishing_aspect: "Available funds are balance minus ACTIVE hold amounts: an account opened at 280000 whose 270000-faced check deposit credited 20000 immediately and holds 250000 has exactly 50000 available — a 60000 withdrawal is rejected (ERR_INSUFFICIENT_FUNDS) but 50000 succeeds."
        test_recipe:
          setup: ["Branch B; teller T with OPEN drawer; account A balance 280000 with a 270000-faced CHECK_DEPOSIT posted (20000 immediate credit included -> ledger 300000; hold 250000 ACTIVE -> available 50000)"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/accounts"
              payload: { owner_name: "A", balance_cents: 280000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/drawers/${d_id}/buy-from-vault"
              payload: { amount_cents: 100000 }
              as: Teller
              as_user_id: "${t_id}"
            - call: "POST /api/drawers/${d_id}/transactions"
              payload: { account_id: "${a_id}", type: "CHECK_DEPOSIT", amount_cents: 270000 }
              as: Teller
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /api/drawers/${d_id}/transactions"
              payload: { account_id: "${a_id}", type: "CASH_WITHDRAWAL", amount_cents: 60000 }
              as: Teller
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
            - call: "POST /api/drawers/${d_id}/transactions"
              payload: { account_id: "${a_id}", type: "CASH_WITHDRAWAL", amount_cents: 50000 }
              as: Teller
              as_user_id: "${t_id}"
              captures: { ok: $.data.status }
          assert:
            - "${err} == ERR_INSUFFICIENT_FUNDS (280000 + 20000 immediate - 250000 held = 50000 available < 60000)"
            - "${ok} == POSTED (50000 <= 50000 available; the available-funds comparison is not-strictly-less)"

  # -------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: posted_transaction_immediately_visible
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: a POSTED transaction is fully readable with its computed fields (fee_cents 0, status POSTED) in the same moment, and the drawer expected-cash read reflects it without delay."
        test_recipe:
          setup: ["Branch B; teller T with OPEN drawer; account A"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/accounts"
              payload: { owner_name: "A", balance_cents: 0 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /api/drawers/${d_id}/transactions"
              payload: { account_id: "${a_id}", type: "CASH_DEPOSIT", amount_cents: 12345 }
              as: Teller
              as_user_id: "${t_id}"
              captures: { tx: $.data.id, tx_status: $.data.status, tx_fee: $.data.fee_cents }
            - call: "GET /api/drawers/${d_id}/expected-cash"
              as: Teller
              as_user_id: "${t_id}"
              captures: { exp: $.data.expected_cash_cents }
          assert:
            - "${tx_status} == POSTED and ${tx_fee} == 0"
            - "GET /api/transactions/${tx} returns amount_cents == 12345 immediately"
            - "${exp} == 12345"

  # -------------------------------------------------------------------------
  # Excluded corners — already exercised by §1.8 difficulty instances
  # -------------------------------------------------------------------------
  - section: validations
    instances:
      - name: error_order_below_minimum_on_zero_quantity
        claim_type: violation_to_error
        grounds: ["errors[ERR_ORDER_BELOW_MINIMUM]"]
        excluded_because:
          difficulty_instance: combinatorial_formula / cash_order_step_rounding_before_capacity_clamp
          rationale: "Asserted there as the capacity-clamped-to-zero branch."

      - name: error_duplicate_cash_order_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_CASH_ORDER]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / cash_order_delivery_date_exclusion
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_audit_in_progress_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_AUDIT_IN_PROGRESS]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / audit_session_lifecycle_overlap_exclusion
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_over_short_unresolved_blocks_close
        claim_type: violation_to_error
        grounds: ["errors[ERR_OVER_SHORT_UNRESOLVED]"]
        excluded_because:
          difficulty_instance: corner lifecycle over_short_case_lifecycle_gates_drawer_close
          rationale: "Asserted in the lifecycle corner instance's close attempt."

      - name: error_branch_frozen_blocks_cash
        claim_type: violation_to_error
        grounds: ["errors[ERR_BRANCH_FROZEN]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / frozen_branch_reported_before_insufficient_funds
          rationale: "Asserted as the winning error of the named §1.8 instance; also in cash_order_deliver_blocked_while_branch_frozen."
