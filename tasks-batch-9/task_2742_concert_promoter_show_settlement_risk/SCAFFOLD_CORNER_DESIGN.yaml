            - "BAND 2 BOUNDARY, INCLUSIVE — ${rt_com_2} == 900000 gives ${rt_util_2} == 90.00 and ${rt_post_2} == WATCH, not RESTRICTED"
            - "BAND 3 IS REACHABLE AND IS EXCLUSIVE AT THE TOP — ${rt_com_3} == 999000 gives ${rt_util_3} == 99.90 and ${rt_post_3} == RESTRICTED; this is the only band that requires a utilization strictly between 90 and 100"
            - "BAND 4 STARTS EXACTLY AT PARITY — ${rt_com_4} == 1000000 gives ${rt_util_4} == 100.00 and ${rt_post_4} == FROZEN; the guarantee equal to the limit is ACCEPTED (priority 41 passes at equality) and the same instant freezes the market"
