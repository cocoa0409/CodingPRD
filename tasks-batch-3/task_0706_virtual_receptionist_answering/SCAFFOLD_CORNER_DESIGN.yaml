          - roles.AccountOwner
          - roles.Receptionist
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "AccountOwner calling POST /va/calls/{callId}/answer (a Receptionist exclusive op) -> ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup:
            - "Account with PUBLISHED 24h script; a RINGING call."
          setup_api_calls:
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /va/service-plans"
              payload: { name: "Prb", billing_model: "PER_CALL", base_fee_cents: 0, overage_rate_cents: 50, overage_tier2_rate_cents: 50, hard_cap_overage_cents: 100000, included_calls: 100, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Rb", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /va/call-scripts"
              payload: { account_id: "${acct_id}", greeting_en: "hi", business_open_minute: 0, business_close_minute: 1440 }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { script_id: $.data.id }
            - call: "POST /va/call-scripts/${script_id}/publish"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /va/calls"
              payload: { account_id: "${acct_id}", caller_id: "5550001", requested_language: "EN" }
              as: PlatformAdmin
              captures: { call_id: $.data.id }
          trigger:
            - call: "POST /va/calls/${call_id}/answer"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "error_id == \"ERR_FORBIDDEN_ROLE\""

      # ---- peer roles: Receptionist cannot create a service plan (PlatformAdmin exclusive)
      - name: receptionist_cannot_create_service_plan
        claim_type: forbidden_role
        grounds:
          - roles.Receptionist
          - roles.PlatformAdmin
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Receptionist calling POST /va/service-plans (PlatformAdmin exclusive) -> ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup:
            - "One receptionist (to supply a valid X-User-ID for the Receptionist role)."
          setup_api_calls:
            - call: "POST /va/receptionists"
              payload: { display_name: "R", languages: ["EN"], max_concurrent_calls: 1 }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /va/service-plans"
              payload: { name: "Nope", billing_model: "PER_CALL", base_fee_cents: 0, overage_rate_cents: 50, overage_tier2_rate_cents: 50, hard_cap_overage_cents: 100000, included_calls: 100, overage_tier2_threshold: 100 }
              as: Receptionist
              as_user_id: "${rec_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "error_id == \"ERR_FORBIDDEN_ROLE\""

      # ---- ownership: AccountOwner cannot act on another account's resource
      - name: account_owner_cannot_publish_other_accounts_script
        claim_type: ownership_violation
        grounds:
          - roles.AccountOwner
          - validations[priority=4]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "An AccountOwner (X-User-ID == account A) publishing account B's call script -> ERR_NOT_RESOURCE_OWNER (403); entity_backed ownership compares X-User-ID to the script's account_id."
        test_recipe:
          setup:
            - "Two accounts A and B; B owns a DRAFT script. A acts on B's script."
          setup_api_calls:
            - call: "POST /va/service-plans"
              payload: { name: "Pown", billing_model: "PER_CALL", base_fee_cents: 0, overage_rate_cents: 50, overage_tier2_rate_cents: 50, hard_cap_overage_cents: 100000, included_calls: 100, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "A", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_a: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "B", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_b: $.data.id }
            - call: "POST /va/call-scripts"
              payload: { account_id: "${acct_b}", greeting_en: "hi", business_open_minute: 0, business_close_minute: 1440 }
              as: AccountOwner
              as_user_id: "${acct_b}"
              captures: { script_b: $.data.id }
          trigger:
            - call: "POST /va/call-scripts/${script_b}/publish"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_a}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "error_id == \"ERR_NOT_RESOURCE_OWNER\""

      # ---- auth: missing headers
      - name: missing_auth_headers_unauthenticated
        claim_type: forbidden_role
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers -> ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup:
            - "Empty DB; a request issued with no auth headers."
          setup_api_calls: []
          trigger:
            - call: "GET /va/service-plans"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response status == 401"
            - "error_id == \"ERR_UNAUTHENTICATED\""

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      # ---- OCC: appointment-book-stale-slot stale version -> 412
      - name: occ_book_stale_slot_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[appointment-book-stale-slot]
          - errors[ERR_STALE_SLOT_VERSION]
          - endpoints.POST_/va/appointments
        distinguishing_aspect: "After a first booking bumps CalendarSlot.version, a second booking carrying the pre-bump expected_slot_version -> ERR_STALE_SLOT_VERSION (412)."
        test_recipe:
          setup:
            - "OPEN slot capacity 3 buffer 0; client observes slot version v0; books once (version -> v1); second book still carries v0."
          setup_api_calls:
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /va/service-plans"
              payload: { name: "Pocc", billing_model: "PER_CALL", base_fee_cents: 0, overage_rate_cents: 50, overage_tier2_rate_cents: 50, hard_cap_overage_cents: 100000, included_calls: 100, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Occ", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /va/calendar-slots"
              payload: { account_id: "${acct_id}", window_start: "2026-03-02T09:00:00Z", window_end: "2026-03-02T17:00:00Z", buffer_minutes: 0, capacity: 3 }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /va/appointments"
              payload: { account_id: "${acct_id}", slot_id: "${slot_id}", start_at: "2026-03-02T10:00:00Z", end_at: "2026-03-02T10:30:00Z", expected_slot_version: "${slot_v0}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { appt1: $.data.id }
          trigger:
            - call: "POST /va/appointments"
              payload: { account_id: "${acct_id}", slot_id: "${slot_id}", start_at: "2026-03-02T11:00:00Z", end_at: "2026-03-02T11:30:00Z", expected_slot_version: "${slot_v0}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "first booking succeeded and bumped CalendarSlot.${slot_id}.version above ${slot_v0}"
            - "second booking response status == 412"
            - "second booking error_id == \"ERR_STALE_SLOT_VERSION\""

      # ---- OCC: period close stale version -> 412
      - name: occ_close_stale_period_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - errors[ERR_STALE_PERIOD_VERSION]
          - endpoints.POST_/va/billing-periods/{periodId}/close
          - validations[priority=5]
        distinguishing_aspect: "Closing a BillingPeriod with an expected_period_version one less than current (a deliberately stale value) -> ERR_STALE_PERIOD_VERSION (412)."
        test_recipe:
          setup:
            - "A fresh account; its OPEN period has version v (captured); close is attempted with expected_period_version = v - 1 (stale)."
          setup_api_calls:
            - call: "POST /va/service-plans"
              payload: { name: "Pocc2", billing_model: "PER_CALL", base_fee_cents: 0, overage_rate_cents: 50, overage_tier2_rate_cents: 50, hard_cap_overage_cents: 100000, included_calls: 100, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Occ2", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, period_id: $.data.current_period_id }
            - call: "GET /va/billing-periods/${period_id}"
              payload: {}
              as: PlatformAdmin
              captures: { period_v: $.data.version }
          trigger:
            - call: "POST /va/billing-periods/${period_id}/close"
              payload: { expected_period_version: "${period_v} - 1" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "error_id == \"ERR_STALE_PERIOD_VERSION\""

      # ---- version increments on every mutation
      - name: appointment_version_increments_on_reschedule
        claim_type: optimistic_concurrency
        grounds:
          - entities.Appointment.fields.status
          - endpoints.POST_/va/appointments/{appointmentId}/reschedule
        distinguishing_aspect: "An Appointment's version (common_fields) starts at 1 on create and increments by 1 on each mutation (confirm, reschedule)."
        test_recipe:
          setup:
            - "Account; OPEN slot capacity 1 buffer 0; one appointment booked then confirmed."
          setup_api_calls:
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /va/service-plans"
              payload: { name: "Pver", billing_model: "PER_CALL", base_fee_cents: 0, overage_rate_cents: 50, overage_tier2_rate_cents: 50, hard_cap_overage_cents: 100000, included_calls: 100, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Ver", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /va/calendar-slots"
              payload: { account_id: "${acct_id}", window_start: "2026-03-02T08:00:00Z", window_end: "2026-03-02T20:00:00Z", buffer_minutes: 0, capacity: 1 }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /va/appointments"
              payload: { account_id: "${acct_id}", slot_id: "${slot_id}", start_at: "2026-03-02T10:00:00Z", end_at: "2026-03-02T10:30:00Z", expected_slot_version: "${slot_v}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { appt_id: $.data.id, v_create: $.data.version }
            - call: "POST /va/appointments/${appt_id}/confirm"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { v_confirm: $.data.version }
          trigger:
            - call: "POST /va/appointments/${appt_id}/reschedule"
              payload: { start_at: "2026-03-02T11:00:00Z", end_at: "2026-03-02T11:30:00Z" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { v_resched: $.data.version }
          assert:
            - "Appointment.${appt_id}.version == 1 on create"
            - "Appointment.${appt_id}.version == 2 after confirm"
            - "Appointment.${appt_id}.version == 3 after reschedule"

      # ---- rate_threshold_triggers: DELINQUENT at first overage unit (below cap)
      - name: first_overage_unit_marks_delinquent
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines.ClientAccount.status.ACTIVE_to_DELINQUENT
          - entities.BillingPeriod.fields.overage_units
          - entities.BillingPeriod.fields.overage_charge_cents
        distinguishing_aspect: "When a completed call pushes overage_units > 0 but overage_charge_cents stays below hard_cap, ClientAccount flips ACTIVE -> DELINQUENT (not SUSPENDED)."
        test_recipe:
          setup:
            - "PER_MINUTE plan included_minutes=0, R1=100, tier2_threshold=100, hard_cap=100000 (high). A 61s call bills 2 units -> overage 2 -> charge 200 < cap."
          setup_api_calls:
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /va/service-plans"
              payload: { name: "Pdel", billing_model: "PER_MINUTE", base_fee_cents: 0, overage_rate_cents: 100, overage_tier2_rate_cents: 100, hard_cap_overage_cents: 100000, included_minutes: 0, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Del", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, period_id: $.data.current_period_id }
            - call: "POST /va/call-scripts"
              payload: { account_id: "${acct_id}", greeting_en: "hi", business_open_minute: 0, business_close_minute: 1440 }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { script_id: $.data.id }
            - call: "POST /va/call-scripts/${script_id}/publish"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /va/receptionists"
              payload: { display_name: "Rina", languages: ["EN"], max_concurrent_calls: 5 }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /va/receptionists/${rec_id}/availability-windows"
              payload: { start_minute: 0, end_minute: 1440 }
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/receptionists/${rec_id}/go-online"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/calls"
              payload: { account_id: "${acct_id}", caller_id: "5550001", requested_language: "EN" }
              as: Receptionist
              as_user_id: "${rec_id}"
              captures: { call_id: $.data.id }
            - call: "POST /va/calls/${call_id}/answer"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/calls/${call_id}/start"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:01:01Z" }
              as: PlatformAdmin
            - call: "POST /va/calls/${call_id}/wrap"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
          trigger:
            - call: "POST /va/calls/${call_id}/complete"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
              captures: { units: $.data.billed_units }
          assert:
            - "Call.${call_id}.billed_units == 2"
            - "BillingPeriod.${period_id}.overage_units == 2"
            - "BillingPeriod.${period_id}.overage_charge_cents == 200"
            - "ClientAccount.${acct_id}.status == \"DELINQUENT\" (overage>0, below hard cap)"

      # ---- derived_field_reconciliation: open_call_count tracks lifecycle
      - name: open_call_count_reconciles_through_lifecycle
        claim_type: derived_field_reconciliation
        grounds:
          - entities.ClientAccount.fields.open_call_count
          - state_machines.Call.handling_status.WRAP_UP_to_COMPLETED
        distinguishing_aspect: "ClientAccount.open_call_count is 1 while a call is RINGING..WRAP_UP and reconciles to 0 once the call reaches terminal COMPLETED."
        test_recipe:
          setup:
            - "Account with PUBLISHED 24h script; one call taken through to COMPLETED."
          setup_api_calls:
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /va/service-plans"
              payload: { name: "Pocc3", billing_model: "PER_CALL", base_fee_cents: 0, overage_rate_cents: 50, overage_tier2_rate_cents: 50, hard_cap_overage_cents: 100000, included_calls: 100, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Recon", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /va/call-scripts"
              payload: { account_id: "${acct_id}", greeting_en: "hi", business_open_minute: 0, business_close_minute: 1440 }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { script_id: $.data.id }
            - call: "POST /va/call-scripts/${script_id}/publish"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /va/receptionists"
              payload: { display_name: "Rina", languages: ["EN"], max_concurrent_calls: 5 }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /va/receptionists/${rec_id}/availability-windows"
              payload: { start_minute: 0, end_minute: 1440 }
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/receptionists/${rec_id}/go-online"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/calls"
              payload: { account_id: "${acct_id}", caller_id: "5550001", requested_language: "EN" }
              as: Receptionist
              as_user_id: "${rec_id}"
              captures: { call_id: $.data.id }
            - call: "GET /va/accounts/${acct_id}"
              payload: {}
              as: PlatformAdmin
              captures: { open_after_intake: $.data.open_call_count }
            - call: "POST /va/calls/${call_id}/answer"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/calls/${call_id}/start"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T12:01:00Z" }
              as: PlatformAdmin
            - call: "POST /va/calls/${call_id}/wrap"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
          trigger:
            - call: "POST /va/calls/${call_id}/complete"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "GET /va/accounts/${acct_id}"
              payload: {}
              as: PlatformAdmin
              captures: { open_after_complete: $.data.open_call_count }
          assert:
            - "ClientAccount.${acct_id}.open_call_count == 1 after intake (before completion)"
            - "ClientAccount.${acct_id}.open_call_count == 0 after the call reaches COMPLETED"

      # ---- excluded_because: cascade + adjust already deeply covered in §1.8
      - name: cascading_suspend_layer_stub
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ClientAccount.status.ACTIVE_to_SUSPENDED
        excluded_because:
          difficulty_instance: transitive_cascade / complete_call_suspends_account_cancels_appointments
          rationale: "The multi-level suspend cascade (N>=3) is verified end-to-end by the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      # ---- immediate: booking response shows updated slot counts in the same request chain
      - name: immediate_slot_counts_visible_after_booking
        claim_type: immediate
        grounds:
          - entities.CalendarSlot.fields.booked_count
          - entities.CalendarSlot.fields.available_count
          - endpoints.POST_/va/appointments
        distinguishing_aspect: "consistency_model immediate: immediately after a booking, GET /va/calendar-slots/{slotId} reflects booked_count 1 / available_count (capacity-1) with no lag."
        test_recipe:
          setup:
            - "OPEN slot capacity 2 buffer 0; one booking."
          setup_api_calls:
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /va/service-plans"
              payload: { name: "Pim", billing_model: "PER_CALL", base_fee_cents: 0, overage_rate_cents: 50, overage_tier2_rate_cents: 50, hard_cap_overage_cents: 100000, included_calls: 100, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Imm", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /va/calendar-slots"
              payload: { account_id: "${acct_id}", window_start: "2026-03-02T09:00:00Z", window_end: "2026-03-02T17:00:00Z", buffer_minutes: 0, capacity: 2 }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /va/appointments"
              payload: { account_id: "${acct_id}", slot_id: "${slot_id}", start_at: "2026-03-02T10:00:00Z", end_at: "2026-03-02T10:30:00Z", expected_slot_version: "${slot_v}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
          trigger:
            - call: "GET /va/calendar-slots/${slot_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { booked: $.data.booked_count, avail: $.data.available_count }
          assert:
            - "CalendarSlot.${slot_id}.booked_count == 1 (visible immediately)"
            - "CalendarSlot.${slot_id}.available_count == 1"
