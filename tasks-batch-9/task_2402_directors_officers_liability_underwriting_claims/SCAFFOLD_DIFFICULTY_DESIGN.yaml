            - "trigger call 1 returns 201 with is_primary == true; GET /dno/policies/${policy_id} then reads placed_limit_usd == 10000000.00 and tower_posture == CONTIGUOUS (one band starting at 0 with participation summing to 1.00)"
            - "trigger call 2 returns 201; the DIC share is 10000000 x 0.60 == 6000000.00 <= DIC_SHARE_CAP 0.40 x 20000000 == 8000000.00, so priority 72 passes, and GET /dno/policies/${policy_id} now reads placed_limit_usd == 16000000.00 with tower_posture == INCOMPLETE because the second band's participation sums to only 0.60"
            - "trigger call 3 returns 201: the band (10000000, 10000000) is an EXACT match of the existing band, which the overlap rule admits as quota-share co-participation; placed_limit_usd becomes 20000000.00 == program_target_limit_usd exactly (the boundary passes priority 87) and tower_posture returns to CONTIGUOUS"
            - "trigger call 4 returns 409 ERR_LAYER_OVERLAP: band [12000000, 17000000) is neither identical to nor disjoint from [10000000, 20000000) — 12000000 >= 20000000 is false and 17000000 <= 10000000 is false — and priority 70 answers before priority 87 would have complained about the placed limit"
            - "trigger call 5 returns 409 ERR_PARTICIPATION_OVERSUBSCRIBED: the band matches exactly so priority 70 passes, but 0.60 + 0.40 + 0.20 == 1.20 > 1.00 trips priority 71"
            - "trigger call 6 returns 409 ERR_TOWER_LIMIT_EXCEEDED: band [20000000, 25000000) is ADJACENT with gap 0 to [10000000, 20000000) and therefore not an overlap, so the request dies on the fiscal rule instead — 20000000.00 + 5000000.00 > 20000000"
            - "trigger calls 4, 5 and 6 leave GET /dno/layers?policy_id=${policy_id} at total_count == 3 and placed_limit_usd == 20000000.00: no rejected band was persisted"
            - "trigger call 7 returns 200 with tower_sealed == true and tower_posture == SEALED (the SEALED rung outranks CONTIGUOUS), because the bands are contiguous from 0 and every band's participation sums to exactly 1.00"
            - "trigger call 8 returns 409 ERR_TOWER_ALREADY_SEALED, so the same adjacent band that previously failed on the fiscal rule now fails earlier at priority 45"
      - name: side_c_capacity_over_half_open_overlapping_policy_periods
        grounds:
          - validations[priority=86]
          - calculations.entity_side_c_capacity
          - entities.Insured.fields.aggregate_bound_side_c_usd
          - entities.Insured.fields.capacity_posture
          - state_machines.Quote.OFFERED_to_ACCEPTED
        distinguishing_aspect: |
          Interval semantics #2 — intervals in TIME space, and a different overlap predicate. The
          accept-time admission test aggregates Side C only over policy periods that overlap the
          candidate period under a half-open comparison (a.start < b.end AND b.start < a.end), so a
          period beginning exactly at another's period_end is admitted while a one-day straddle is
          refused. The STORED aggregate_bound_side_c_usd is deliberately not period-filtered, so the
          insured can legally end up holding 10,000,000 of Side C against a 5,000,000 cap with
          capacity_posture EXHAUSTED — and an abutting quote still binds in that state.
