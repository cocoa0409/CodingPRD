              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "the response is NOT a 404: auth outranks existence"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: fund_manual_open_transition_rejected_system_only
        claim_type: Conditional Action
        grounds:
          - state_machines.RedressFund.ACCUMULATING_to_OPEN_FOR_CLAIMS
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "ACCUMULATING -> OPEN_FOR_CLAIMS is system-only: a FundAdministrator requesting target_state OPEN_FOR_CLAIMS on an ACCUMULATING fund (500000 collected, below the 1000000 minimum) is rejected 409 ERR_INVALID_STATE_TRANSITION — the fund opens only via the payment cascade."
        test_recipe:
          setup:
            - "Judgment 1500000 entered; one COLLECTION of 500000 posted (below FUND_OPEN_MINIMUM_CENTS, so the fund is still ACCUMULATING)."
          setup_api_calls:
            - *c_clock
            - call: "POST /enforcement/subject-companies"
              payload: { legal_name: "Acme Gadgets Inc", complaint_count_90d: 60 }
              as: PlatformAdmin
              captures: { company_id: $.data.id }
            - *c_inv
            - *c_inv_pr
            - *c_inv_eg
            - *c_inv_ng
            - *c_order
            - *c_propose
            - *c_clock_oct
            - *c_finalize
            - *c_monitor
            - *c_judgment
            - *c_get_fund
            - call: "POST /enforcement/judgments/${judgment_id}/payments"
              payload: { amount_cents: 500000, kind: "COLLECTION" }
              as: CompanyRepresentative
              as_user_id: "${company_id}"
            - call: "GET /enforcement/redress-funds/${fund_id}"
              payload: {}
              as: FundAdministrator
              as_user_id: "fa-1"
              captures: { fund_v: $.data.version }
          trigger:
            - call: "POST /enforcement/redress-funds/${fund_id}/transition"
              payload: { target_state: "OPEN_FOR_CLAIMS", expected_redress_fund_version: "${fund_v}" }
              as: FundAdministrator
              as_user_id: "fa-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE_TRANSITION (manual OPEN_FOR_CLAIMS is not a client-triggerable transition)"
            - "RedressFund.${fund_id} remains ACCUMULATING with total_collected_cents == 500000"

      - name: comment_posting_appends_entry_and_increments_count
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/enforcement/comment-periods/{periodId}/comments
          - entities.PublicCommentPeriod.fields.comment_count
        distinguishing_aspect: "Posting a comment to an OPEN period appends {author_email, body, submitted_at} with the logical clock stamp and raises comment_count from 0 to 1, all visible in the response."
        test_recipe:
          setup:
            - "Consent order proposed at 2026-09-01T00:00:00Z; round-1 comment period OPEN."
          setup_api_calls:
            - *c_clock
            - call: "POST /enforcement/subject-companies"
