scaffold_difficulty_design:

  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_flexible_vs_moderate_diverge
        grounds:
          - calculations.cancellation_refund
          - entities.Booking.fields.refund_cents
          - state_machines.Booking.HOLD_to_CANCELLED
        distinguishing_aspect: "For identical booking amounts cancelled 29 days before check-in, FLEXIBLE refunds 82500 (full) while MODERATE refunds 48750 (50%) — dual variant on the Booking (guest-refund) domain."
        test_recipe:
          setup:
            - "One LISTED property (base 20000, cleaning 15000, permit tax 10%). Two HOLD bookings for the same guest, non-overlapping dates, one FLEXIBLE (check_in 2026-07-01) and one MODERATE (check_in 2026-09-01), each 3 nights, each nightly_subtotal 60000 / tax 7500 / total 82500. Clock is reset to 29 days before each booking's check_in immediately before cancelling it."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /owners", payload: { legal_name: "O1", email: "o1@x.com", default_management_fee_pct: 20 }, as: PlatformAdmin, captures: { o1: "$.data.id" } }
            - { call: "POST /properties", payload: { owner_id: "${o1}", address: "1 A St", city: "Austin", state_code: "TX", jurisdiction_code: "TX-ATX", base_nightly_rate_cents: 20000, cleaning_fee_cents: 15000, max_occupancy: 6 }, as: PropertyManager, captures: { p1: "$.data.id" } }
            - { call: "POST /permits", payload: { property_id: "${p1}", permit_number: "PN1", jurisdiction_code: "TX-ATX", occupancy_tax_pct: 10, issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }, as: PropertyManager, captures: { perm1: "$.data.id" } }
            - { call: "POST /permits/${perm1}/activate", payload: {}, as: PropertyManager }
            - { call: "POST /properties/${p1}/list", payload: {}, as: PropertyManager }
            - { call: "POST /guests", payload: { full_name: "G1", email: "g1@x.com" }, as: Anonymous, captures: { g1: "$.data.id" } }
            - { call: "POST /bookings", payload: { property_id: "${p1}", guest_id: "${g1}", check_in: "2026-07-01T00:00:00Z", check_out: "2026-07-04T00:00:00Z", cancellation_policy: "FLEXIBLE" }, as: PropertyManager, captures: { bf: "$.data.id" } }
            - { call: "POST /bookings", payload: { property_id: "${p1}", guest_id: "${g1}", check_in: "2026-09-01T00:00:00Z", check_out: "2026-09-04T00:00:00Z", cancellation_policy: "MODERATE" }, as: PropertyManager, captures: { bm: "$.data.id" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /bookings/${bf}/cancel", payload: {}, as: PropertyManager, captures: { rf: "$.data.refund_cents" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /bookings/${bm}/cancel", payload: {}, as: PropertyManager, captures: { rm: "$.data.refund_cents" } }
          assert:
            - "Booking.${bf}.refund_cents == 82500"
            - "Booking.${bm}.refund_cents == 48750"
            - "Booking.${bf}.stay_status == CANCELLED"

      - name: payout_provisional_vs_final_diverge
        grounds:
          - calculations.owner_statement_split
          - entities.OwnerStatement.fields.owner_payout_cents
          - state_machines.OwnerStatement.DRAFT_to_FINALIZED
        distinguishing_aspect: "Same statement: provisional owner_payout_cents is 25524 at DRAFT generation, but final owner_payout_cents is 20524 after a 5000 owner-billable work order is approved before finalize — dual variant on the OwnerStatement (money) domain, a different entity domain than the refund variant."
        test_recipe:
          setup:
            - "Owner O2 (mgmt 15%). Property base 10010, cleaning 0, tax 0. Three CHECKED_OUT 1-night bookings (nightly_subtotal 10010 each) with check_out in 2026-06. Statement generated (DRAFT): gross 30030, mgmt 4506, payout 25524. One WorkOrder billable_to OWNER cost 5000 completed and then APPROVED, posting a -5000 line onto the DRAFT statement."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /owners", payload: { legal_name: "O2", email: "o2@x.com", default_management_fee_pct: 15 }, as: PlatformAdmin, captures: { o2: "$.data.id" } }
            - { call: "POST /properties", payload: { owner_id: "${o2}", address: "2 B St", city: "Austin", state_code: "TX", jurisdiction_code: "TX-ATX", base_nightly_rate_cents: 10010, cleaning_fee_cents: 0, max_occupancy: 4 }, as: PropertyManager, captures: { p2: "$.data.id" } }
            - { call: "POST /permits", payload: { property_id: "${p2}", permit_number: "PN2", jurisdiction_code: "TX-ATX", occupancy_tax_pct: 0, issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }, as: PropertyManager, captures: { perm2: "$.data.id" } }
            - { call: "POST /permits/${perm2}/activate", payload: {}, as: PropertyManager }
            - { call: "POST /properties/${p2}/list", payload: {}, as: PropertyManager }
            - { call: "POST /guests", payload: { full_name: "G2", email: "g2@x.com" }, as: Anonymous, captures: { g2: "$.data.id" } }
            - { call: "POST /bookings", payload: { property_id: "${p2}", guest_id: "${g2}", check_in: "2026-06-05T00:00:00Z", check_out: "2026-06-06T00:00:00Z" }, as: PropertyManager, captures: { b1: "$.data.id" } }
            - { call: "POST /bookings/${b1}/screen", payload: { decision: "APPROVED" }, as: PropertyManager }
            - { call: "POST /bookings/${b1}/confirm", payload: {}, as: PropertyManager }
            - { call: "POST /bookings", payload: { property_id: "${p2}", guest_id: "${g2}", check_in: "2026-06-06T00:00:00Z", check_out: "2026-06-07T00:00:00Z" }, as: PropertyManager, captures: { b2: "$.data.id" } }
            - { call: "POST /bookings/${b2}/screen", payload: { decision: "APPROVED" }, as: PropertyManager }
            - { call: "POST /bookings/${b2}/confirm", payload: {}, as: PropertyManager }
            - { call: "POST /bookings", payload: { property_id: "${p2}", guest_id: "${g2}", check_in: "2026-06-07T00:00:00Z", check_out: "2026-06-08T00:00:00Z" }, as: PropertyManager, captures: { b3: "$.data.id" } }
            - { call: "POST /bookings/${b3}/screen", payload: { decision: "APPROVED" }, as: PropertyManager }
            - { call: "POST /bookings/${b3}/confirm", payload: {}, as: PropertyManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /bookings/${b1}/check-in", payload: {}, as: PropertyManager }
            - { call: "POST /bookings/${b1}/check-out", payload: {}, as: PropertyManager }
            - { call: "POST /bookings/${b2}/check-in", payload: {}, as: PropertyManager }
            - { call: "POST /bookings/${b2}/check-out", payload: {}, as: PropertyManager }
            - { call: "POST /bookings/${b3}/check-in", payload: {}, as: PropertyManager }
            - { call: "POST /bookings/${b3}/check-out", payload: {}, as: PropertyManager }
            - { call: "POST /owner-statements", payload: { owner_id: "${o2}", period_year: 2026, period_month: 6 }, as: PropertyManager, captures: { st: "$.data.id", payout_prov: "$.data.owner_payout_cents" } }
            - { call: "POST /work-orders", payload: { property_id: "${p2}", description: "fix heater", cost_cents: 5000, billable_to: "OWNER" }, as: PropertyManager, captures: { wo: "$.data.id" } }
            - { call: "POST /vendors", payload: { name: "MaintCo", vendor_type: "MAINTENANCE", email: "m@x.com" }, as: PropertyManager, captures: { vm: "$.data.id" } }
            - { call: "POST /work-orders/${wo}/assign", payload: { vendor_id: "${vm}" }, as: PropertyManager }
            - { call: "POST /work-orders/${wo}/start", payload: {}, as: Vendor, as_user_id: "${vm}" }
            - { call: "POST /work-orders/${wo}/complete", payload: {}, as: Vendor, as_user_id: "${vm}" }
            - { call: "POST /work-orders/${wo}/approve", payload: {}, as: PropertyManager }
          trigger:
            - { call: "POST /owner-statements/${st}/finalize", payload: {}, as: PropertyManager, captures: { payout_final: "$.data.owner_payout_cents" } }
          assert:
            - "payout_prov == 25524"
            - "OwnerStatement.${st}.owner_payout_cents == 20524"
            - "OwnerStatement.${st}.status == FINALIZED"

  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: dynamic_quote_seasonal_occupancy_lastminute
        grounds:
          - calculations.dynamic_nightly_quote
          - calculations.occupancy_pct
          - entities.PricingRule.fields.multiplier_bps
        distinguishing_aspect: "Mode (a): per_night = round_half_up(base 20000 * seasonal 1.5 * occupancy_tier 1.0 * last_minute 0.85) = 25500 — three inputs with tiered occupancy selection and a conditional last-minute branch."
        test_recipe:
          setup:
            - "LISTED property base 20000, cleaning 15000, tax 10%. One active SEASONAL PricingRule multiplier_bps 15000 covering [2026-06-01, 2026-06-30). Clock 2026-06-01. Quote for check_in 2026-06-06 (5 days out => last-minute), 3 nights, occupancy 0 => tier 1.0."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /owners", payload: { legal_name: "O3", email: "o3@x.com", default_management_fee_pct: 20 }, as: PlatformAdmin, captures: { o3: "$.data.id" } }
            - { call: "POST /properties", payload: { owner_id: "${o3}", address: "3 C St", city: "Austin", state_code: "TX", jurisdiction_code: "TX-ATX", base_nightly_rate_cents: 20000, cleaning_fee_cents: 15000, max_occupancy: 6 }, as: PropertyManager, captures: { p3: "$.data.id" } }
            - { call: "POST /permits", payload: { property_id: "${p3}", permit_number: "PN3", jurisdiction_code: "TX-ATX", occupancy_tax_pct: 10, issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }, as: PropertyManager, captures: { perm3: "$.data.id" } }
            - { call: "POST /permits/${perm3}/activate", payload: {}, as: PropertyManager }
            - { call: "POST /properties/${p3}/list", payload: {}, as: PropertyManager }
            - { call: "GET /properties/${p3}", payload: {}, as: PropertyManager, captures: { p3v: "$.data.version" } }
            - { call: "POST /properties/${p3}/pricing-rules", payload: { rule_type: "SEASONAL", multiplier_bps: 15000, start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-30T00:00:00Z", priority: 1, expected_property_version: "${p3v}" }, as: PropertyManager }
          trigger:
            - { call: "POST /properties/${p3}/quote", payload: { check_in: "2026-06-06T00:00:00Z", check_out: "2026-06-09T00:00:00Z" }, as: PropertyManager, captures: { pn: "$.data.per_night_rate_cents", nsub: "$.data.nightly_subtotal_cents", occ: "$.data.occupancy_pct", tot: "$.data.total_cents" } }
          assert:
            - "pn == 25500"
            - "nsub == 76500"
            - "occ == 0"
            - "tot == 100650"

      - name: mgmt_fee_round_per_booking_then_sum
        grounds:
          - calculations.owner_statement_split
          - entities.OwnerStatement.fields.mgmt_fee_cents
        distinguishing_aspect: "Mode (b): management fee rounded per booking then summed = 1502*3 = 4506, which differs from sum-then-round (round(30030*0.15)=4505); the scaffold pins round-per-booking."
        test_recipe:
          setup:
            - "Owner O4 mgmt 15%. Property base 10010, cleaning 0, tax 0. Three CHECKED_OUT 1-night bookings (nightly_subtotal 10010 each) with check_out in 2026-06. Statement generated for 2026-06."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /owners", payload: { legal_name: "O4", email: "o4@x.com", default_management_fee_pct: 15 }, as: PlatformAdmin, captures: { o4: "$.data.id" } }
            - { call: "POST /properties", payload: { owner_id: "${o4}", address: "4 D St", city: "Austin", state_code: "TX", jurisdiction_code: "TX-ATX", base_nightly_rate_cents: 10010, cleaning_fee_cents: 0, max_occupancy: 4 }, as: PropertyManager, captures: { p4: "$.data.id" } }
            - { call: "POST /permits", payload: { property_id: "${p4}", permit_number: "PN4", jurisdiction_code: "TX-ATX", occupancy_tax_pct: 0, issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }, as: PropertyManager, captures: { perm4: "$.data.id" } }
            - { call: "POST /permits/${perm4}/activate", payload: {}, as: PropertyManager }
            - { call: "POST /properties/${p4}/list", payload: {}, as: PropertyManager }
            - { call: "POST /guests", payload: { full_name: "G4", email: "g4@x.com" }, as: Anonymous, captures: { g4: "$.data.id" } }
            - { call: "POST /bookings", payload: { property_id: "${p4}", guest_id: "${g4}", check_in: "2026-06-05T00:00:00Z", check_out: "2026-06-06T00:00:00Z" }, as: PropertyManager, captures: { c1: "$.data.id" } }
            - { call: "POST /bookings/${c1}/screen", payload: { decision: "APPROVED" }, as: PropertyManager }
            - { call: "POST /bookings/${c1}/confirm", payload: {}, as: PropertyManager }
            - { call: "POST /bookings", payload: { property_id: "${p4}", guest_id: "${g4}", check_in: "2026-06-06T00:00:00Z", check_out: "2026-06-07T00:00:00Z" }, as: PropertyManager, captures: { c2: "$.data.id" } }
            - { call: "POST /bookings/${c2}/screen", payload: { decision: "APPROVED" }, as: PropertyManager }
            - { call: "POST /bookings/${c2}/confirm", payload: {}, as: PropertyManager }
            - { call: "POST /bookings", payload: { property_id: "${p4}", guest_id: "${g4}", check_in: "2026-06-07T00:00:00Z", check_out: "2026-06-08T00:00:00Z" }, as: PropertyManager, captures: { c3: "$.data.id" } }
            - { call: "POST /bookings/${c3}/screen", payload: { decision: "APPROVED" }, as: PropertyManager }
            - { call: "POST /bookings/${c3}/confirm", payload: {}, as: PropertyManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /bookings/${c1}/check-in", payload: {}, as: PropertyManager }
            - { call: "POST /bookings/${c1}/check-out", payload: {}, as: PropertyManager }
            - { call: "POST /bookings/${c2}/check-in", payload: {}, as: PropertyManager }
            - { call: "POST /bookings/${c2}/check-out", payload: {}, as: PropertyManager }
            - { call: "POST /bookings/${c3}/check-in", payload: {}, as: PropertyManager }
            - { call: "POST /bookings/${c3}/check-out", payload: {}, as: PropertyManager }
          trigger:
            - { call: "POST /owner-statements", payload: { owner_id: "${o4}", period_year: 2026, period_month: 6 }, as: PropertyManager, captures: { st4: "$.data.id", mf: "$.data.mgmt_fee_cents", gr: "$.data.gross_rental_cents" } }
          assert:
            - "OwnerStatement.${st4}.gross_rental_cents == 30030"
            - "OwnerStatement.${st4}.mgmt_fee_cents == 4506"

  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: booking_parallel_screening_and_stay_dimensions
        grounds:
          - state_machines.Booking.PENDING_to_APPROVED
          - state_machines.Booking.HOLD_to_CONFIRMED
          - entities.Booking.fields.screening_status
        distinguishing_aspect: "Booking carries two independent status axes: screening_status advances PENDING->APPROVED while stay_status stays HOLD, then stay_status advances HOLD->CONFIRMED — parallel dimensions on the Booking entity."
        test_recipe:
          setup:
            - "One LISTED property with an approved-screenable HOLD booking (screening PENDING, stay HOLD)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /owners", payload: { legal_name: "O5", email: "o5@x.com", default_management_fee_pct: 20 }, as: PlatformAdmin, captures: { o5: "$.data.id" } }
            - { call: "POST /properties", payload: { owner_id: "${o5}", address: "5 E St", city: "Austin", state_code: "TX", jurisdiction_code: "TX-ATX", base_nightly_rate_cents: 20000, cleaning_fee_cents: 15000, max_occupancy: 6 }, as: PropertyManager, captures: { p5: "$.data.id" } }
            - { call: "POST /permits", payload: { property_id: "${p5}", permit_number: "PN5", jurisdiction_code: "TX-ATX", occupancy_tax_pct: 10, issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }, as: PropertyManager, captures: { perm5: "$.data.id" } }
            - { call: "POST /permits/${perm5}/activate", payload: {}, as: PropertyManager }
            - { call: "POST /properties/${p5}/list", payload: {}, as: PropertyManager }
            - { call: "POST /guests", payload: { full_name: "G5", email: "g5@x.com" }, as: Anonymous, captures: { g5: "$.data.id" } }
            - { call: "POST /bookings", payload: { property_id: "${p5}", guest_id: "${g5}", check_in: "2026-07-01T00:00:00Z", check_out: "2026-07-04T00:00:00Z" }, as: PropertyManager, captures: { b5: "$.data.id" } }
          trigger:
            - { call: "POST /bookings/${b5}/screen", payload: { decision: "APPROVED" }, as: PropertyManager, captures: { sc: "$.data.screening_status", stay_after_screen: "$.data.stay_status" } }
            - { call: "POST /bookings/${b5}/confirm", payload: {}, as: PropertyManager, captures: { stay_final: "$.data.stay_status", sc_final: "$.data.screening_status" } }
          assert:
            - "sc == APPROVED"
            - "stay_after_screen == HOLD"
            - "Booking.${b5}.stay_status == CONFIRMED"
            - "Booking.${b5}.screening_status == APPROVED"

      - name: work_order_needs_info_revision_loop
        grounds:
          - state_machines.WorkOrder.IN_PROGRESS_to_NEEDS_INFO
          - state_machines.WorkOrder.NEEDS_INFO_to_ASSIGNED
          - state_machines.WorkOrder.ASSIGNED_to_IN_PROGRESS
        distinguishing_aspect: "WorkOrder cycles ASSIGNED->IN_PROGRESS->NEEDS_INFO->ASSIGNED->IN_PROGRESS, a revision loop returning to a previously-visited state — non-linear on the WorkOrder entity (a different entity than the parallel Booking machine)."
        test_recipe:
          setup:
            - "One property, one MAINTENANCE vendor, one OPEN work order assigned and started (IN_PROGRESS)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /owners", payload: { legal_name: "O6", email: "o6@x.com", default_management_fee_pct: 20 }, as: PlatformAdmin, captures: { o6: "$.data.id" } }
            - { call: "POST /properties", payload: { owner_id: "${o6}", address: "6 F St", city: "Austin", state_code: "TX", jurisdiction_code: "TX-ATX", base_nightly_rate_cents: 20000, cleaning_fee_cents: 15000, max_occupancy: 6 }, as: PropertyManager, captures: { p6: "$.data.id" } }
            - { call: "POST /vendors", payload: { name: "Fix It", vendor_type: "MAINTENANCE", email: "fix@x.com" }, as: PropertyManager, captures: { v6: "$.data.id" } }
            - { call: "POST /work-orders", payload: { property_id: "${p6}", description: "leaky faucet", cost_cents: 4000, billable_to: "COMPANY" }, as: PropertyManager, captures: { w6: "$.data.id" } }
            - { call: "POST /work-orders/${w6}/assign", payload: { vendor_id: "${v6}" }, as: PropertyManager }
            - { call: "POST /work-orders/${w6}/start", payload: {}, as: Vendor, as_user_id: "${v6}" }
          trigger:
            - { call: "POST /work-orders/${w6}/request-info", payload: {}, as: Vendor, as_user_id: "${v6}", captures: { s1: "$.data.status" } }
            - { call: "POST /work-orders/${w6}/resume", payload: {}, as: PropertyManager, captures: { s2: "$.data.status" } }
            - { call: "POST /work-orders/${w6}/start", payload: {}, as: Vendor, as_user_id: "${v6}", captures: { s3: "$.data.status" } }
          assert:
            - "s1 == NEEDS_INFO"
            - "s2 == ASSIGNED"
            - "WorkOrder.${w6}.status == IN_PROGRESS"

  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: offboard_cancels_booking_then_turnover_then_inspection
        grounds:
          - state_machines.Property.LISTED_to_OFFBOARDED
          - state_machines.Booking.HOLD_to_CANCELLED
          - state_machines.TurnoverTask.SCHEDULED_to_CANCELLED
          - state_machines.Inspection.COMPLETED_to_CANCELLED
        distinguishing_aspect: "Depth-3 chain from a single trigger: property offboard -> Booking CANCELLED -> its TurnoverTask CANCELLED -> that task's Inspection CANCELLED, each hop caused by the prior hop."
        test_recipe:
          setup:
            - "LISTED property with a HOLD booking; a FAILED (non-terminal) TurnoverTask linked to that booking; that task has one COMPLETED Inspection (result FAIL)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /owners", payload: { legal_name: "O7", email: "o7@x.com", default_management_fee_pct: 20 }, as: PlatformAdmin, captures: { o7: "$.data.id" } }
            - { call: "POST /properties", payload: { owner_id: "${o7}", address: "7 G St", city: "Austin", state_code: "TX", jurisdiction_code: "TX-ATX", base_nightly_rate_cents: 20000, cleaning_fee_cents: 15000, max_occupancy: 6 }, as: PropertyManager, captures: { p7: "$.data.id" } }
            - { call: "POST /permits", payload: { property_id: "${p7}", permit_number: "PN7", jurisdiction_code: "TX-ATX", occupancy_tax_pct: 10, issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }, as: PropertyManager, captures: { perm7: "$.data.id" } }
            - { call: "POST /permits/${perm7}/activate", payload: {}, as: PropertyManager }
            - { call: "POST /properties/${p7}/list", payload: {}, as: PropertyManager }
            - { call: "POST /guests", payload: { full_name: "G7", email: "g7@x.com" }, as: Anonymous, captures: { g7: "$.data.id" } }
            - { call: "POST /bookings", payload: { property_id: "${p7}", guest_id: "${g7}", check_in: "2026-07-10T00:00:00Z", check_out: "2026-07-13T00:00:00Z" }, as: PropertyManager, captures: { b7: "$.data.id" } }
            - { call: "POST /vendors", payload: { name: "CleanCo", vendor_type: "CLEANER", email: "clean@x.com" }, as: PropertyManager, captures: { vc7: "$.data.id" } }
            - { call: "POST /vendors", payload: { name: "InspectCo", vendor_type: "INSPECTOR", email: "insp@x.com" }, as: PropertyManager, captures: { vi7: "$.data.id" } }
