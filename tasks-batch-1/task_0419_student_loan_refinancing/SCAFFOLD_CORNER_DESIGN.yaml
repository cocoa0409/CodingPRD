  # ===========================================================================
  # SECTION 3 — Calculations (correct result, input-set filtering, constants,
  # precision, variant divergence/selection)
  # ===========================================================================
  - section: calculations
    instances:
      - name: soft_pull_subprime_moves_up_to_near_prime
        claim_type: Correct Result
        grounds:
          - calculations.soft_pull
          - entities.Application.fields.soft_pull_fico_band
        distinguishing_aspect: "soft_pull maps borrower band SUBPRIME (index 0) one notch up to NEAR_PRIME; the self-reported band is superseded by the deterministic correction."
        test_recipe:
          setup:
            - "A DRAFT application for a SUBPRIME borrower; a SUBPRIME-eligible FIXED 60-month grid cell exists."
          setup_api_calls:
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 60, min_fico_band: "SUBPRIME", base_apr_bps: 900, index_apr_bps: 0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /borrowers"
              payload: { email: "corner.b16@x.com", full_name: "Corner B16", annual_income_cents: 20000000, fico_band: "SUBPRIME" }
              as: Borrower
              captures: { cb16_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${cb16_id}", requested_principal_cents: 4000000, requested_term_months: 60, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "${cb16_id}"
              captures: { capp16_id: $.data.id }
          trigger:
            - call: "POST /applications/${capp16_id}/prequalify"
              payload: {}
              as: Borrower
              as_user_id: "${cb16_id}"
          assert:
            - "Application.${capp16_id}.soft_pull_fico_band == NEAR_PRIME"

      - name: estimated_apr_variable_adds_index_and_band_surcharge
        claim_type: Correct Result
        grounds:
          - calculations.estimated_apr
          - entities.Offer.fields.estimated_apr_bps
        distinguishing_aspect: "For a VARIABLE offer, estimated_apr_bps == base + index + band_surcharge; with base 500, index 120, soft_pull NEAR_PRIME surcharge 150 the estimate is 770 bps."
        test_recipe:
          setup:
            - "A VARIABLE 84-month grid cell (base 500, index 120, min_fico_band NEAR_PRIME); borrower fico_band SUBPRIME (soft pull -> NEAR_PRIME)."
          setup_api_calls:
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "VARIABLE", term_months: 84, min_fico_band: "NEAR_PRIME", base_apr_bps: 500, index_apr_bps: 120 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /borrowers"
              payload: { email: "corner.b17@x.com", full_name: "Corner B17", annual_income_cents: 30000000, fico_band: "SUBPRIME" }
              as: Borrower
              captures: { cb17_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${cb17_id}", requested_principal_cents: 4000000, requested_term_months: 84, requested_rate_type: "VARIABLE" }
              as: Borrower
              as_user_id: "${cb17_id}"
              captures: { capp17_id: $.data.id }
            - call: "POST /applications/${capp17_id}/prequalify"
              payload: {}
              as: Borrower
              as_user_id: "${cb17_id}"
          trigger:
            - call: "GET /offers"
              payload: { application_id: "${capp17_id}" }
              as: Borrower
              as_user_id: "${cb17_id}"
              captures: { coffer17_id: "$.data[0].id", est17: "$.data[0].estimated_apr_bps" }
          assert:
            - "Offer.${coffer17_id}.estimated_apr_bps == 770 (500 base + 120 index + 150 NEAR_PRIME surcharge)"
            - "Offer.${coffer17_id}.rate_type == VARIABLE"

      - name: locked_apr_member_tier_discount_after_autopay
        claim_type: Constants Applied
        grounds:
          - calculations.locked_apr
          - entities.Offer.fields.locked_apr_bps
          - entities.Borrower.fields.member_tier
        distinguishing_aspect: "locked_apr applies AUTOPAY_DISCOUNT_BPS (25) then MEMBER_DISCOUNT_BPS; a NONE-tier borrower with autopay on an 800-bps estimate locks at 775 bps (member discount 0)."
        test_recipe:
          setup:
            - "A prequalified application, member_tier NONE, one PRESENTED offer with estimated_apr_bps 800."
          setup_api_calls:
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 120, min_fico_band: "NEAR_PRIME", base_apr_bps: 650, index_apr_bps: 0 }
