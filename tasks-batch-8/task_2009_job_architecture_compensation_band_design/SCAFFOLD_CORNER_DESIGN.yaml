            - { call: "POST /comp/job-profiles/${prof1}/approve", payload: {}, as: CompManager }
            - { call: "POST /comp/departments", payload: { name: "Dept A", code: "DA", adjustment_pool_cents: 5000000 }, as: CompAdmin, captures: { deptA: $.data.id } }
            - { call: "POST /comp/departments", payload: { name: "Dept B", code: "DB", adjustment_pool_cents: 5000000 }, as: CompAdmin, captures: { deptB: $.data.id } }
            - { call: "POST /comp/employees", payload: { employee_ref: "E1", department_id: "${deptA}", job_profile_id: "${prof1}", geo_zone_id: "${nat}", base_salary_cents: 10000000, hire_date: "2020-01-15" }, as: HRBP, captures: { emp1: $.data.id } }
            - { call: "POST /comp/employees", payload: { employee_ref: "E2", department_id: "${deptB}", job_profile_id: "${prof1}", geo_zone_id: "${nat}", base_salary_cents: 11000000, hire_date: "2021-03-01" }, as: HRBP, captures: { emp2: $.data.id } }
          trigger:
            - { call: "GET /comp/employees", payload: { department_id: "${deptA}" }, as: CompAnalyst, as_user_id: "analyst-1" }
          assert:
            - "filtered list contains exactly [${emp1}] with total_count == 1 and has_more == false"
            - "unfiltered GET /comp/employees has total_count == 2"

      - name: terminate_reconciles_payroll_rollup
        claim_type: derived_field_reconciliation
        grounds: ["entities.Department.fields.projected_payroll_cents", "entities.CompProgram.fields.total_payroll_projection_cents", "state_machines.Employee.transitions"]
        distinguishing_aspect: "Terminating the only employee recomputes both derived payroll levels in the same request scope: department 10000000 -> 0 and program 10000000 -> 0."
        test_recipe:
          setup: ["program exists (any state); dept DA with employee E1 salary 10000000 (payroll rollups at 10000000)"]
          setup_api_calls:
            - { call: "POST /comp/job-families", payload: { code: "ENG", name: "Engineering" }, as: CompAdmin, captures: { fam: $.data.id } }
            - { call: "POST /comp/job-levels", payload: { level_code: "P1", title: "Engineer I", rank_order: 1 }, as: CompAdmin, captures: { lv1: $.data.id } }
            - { call: "POST /comp/geo-zones", payload: { zone_code: "US-NAT", name: "US National", differential_ratio: 1.000000 }, as: CompAdmin, captures: { nat: $.data.id } }
            - { call: "POST /comp/job-profiles", payload: { job_family_id: "${fam}", job_level_id: "${lv1}", title: "SWE I", summary: "s", salary_basis_weekly_cents: 200000, duties_test_passed: true }, as: CompAnalyst, captures: { prof1: $.data.id } }
            - { call: "POST /comp/job-profiles/${prof1}/determine-flsa", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof1}/submit", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof1}/approve", payload: {}, as: CompManager }
            - { call: "POST /comp/programs", payload: { fiscal_year: 2027, merit_budget_cents: 50000000, refresh_budget_cents: 2000000, pricing_as_of_date: "2026-08-01" }, as: CompAdmin, captures: { prog: $.data.id } }
            - { call: "POST /comp/departments", payload: { name: "Dept A", code: "DA", adjustment_pool_cents: 5000000 }, as: CompAdmin, captures: { dept: $.data.id } }
            - { call: "POST /comp/employees", payload: { employee_ref: "E1", department_id: "${dept}", job_profile_id: "${prof1}", geo_zone_id: "${nat}", base_salary_cents: 10000000, hire_date: "2020-01-15" }, as: HRBP, captures: { emp: $.data.id } }
          trigger:
            - { call: "POST /comp/employees/${emp}/terminate", payload: {}, as: HRBP, as_user_id: "hrbp-1", captures: { st: $.data.status } }
          assert:
            - "Employee.${emp}.status == TERMINATED"
            - "Department.${dept}.projected_payroll_cents == 0 (was 10000000)"
            - "CompProgram.${prog}.total_payroll_projection_cents == 0 (was 10000000)"

      - name: cascading_side_effects_covered
        claim_type: cascading_side_effects
        grounds: ["complexity_profile.complexity_layers"]
        excluded_because:
          difficulty_instance: refresh_apply_cascade_depth3
          rationale: "N-level cascade verified end-to-end by the named §1.8 instance (and by mapping_approve_cascade_depth3)."
      - name: dual_variant_layer_covered
        claim_type: dual_variant_calculation
        grounds: ["complexity_profile.complexity_layers"]
        excluded_because:
          difficulty_instance: market_composite_provisional_vs_official
          rationale: "Both variants and their divergence asserted by the named §1.8 instance (and by reslot_provisional_vs_final_adjustment)."

  - section: consistency_model
    instances:
      - name: create_response_immediately_consistent
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "calculations.compa_ratio_and_range_position"]
        distinguishing_aspect: "Immediate consistency: the POST /comp/employees response body itself carries the computed compa_ratio 1.0769 and range_position IN_RANGE against the already-PUBLISHED band — no re-read or settling delay."
        test_recipe:
          setup: ["ENG P2 band PUBLISHED mid 13000000 [11050000-14950000]; program PRICING (publish legal); dept DA"]
          setup_api_calls:
            - { call: "POST /comp/job-families", payload: { code: "ENG", name: "Engineering" }, as: CompAdmin, captures: { fam: $.data.id } }
            - { call: "POST /comp/job-levels", payload: { level_code: "P1", title: "Engineer I", rank_order: 1 }, as: CompAdmin }
            - { call: "POST /comp/job-levels", payload: { level_code: "P2", title: "Engineer II", rank_order: 2 }, as: CompAdmin, captures: { lv2: $.data.id } }
            - { call: "POST /comp/geo-zones", payload: { zone_code: "US-NAT", name: "US National", differential_ratio: 1.000000 }, as: CompAdmin, captures: { nat: $.data.id } }
            - { call: "POST /comp/job-profiles", payload: { job_family_id: "${fam}", job_level_id: "${lv2}", title: "SWE II", summary: "s", salary_basis_weekly_cents: 200000, duties_test_passed: true }, as: CompAnalyst, captures: { prof2: $.data.id } }
            - { call: "POST /comp/job-profiles/${prof2}/determine-flsa", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof2}/submit", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof2}/approve", payload: {}, as: CompManager }
            - { call: "POST /comp/programs", payload: { fiscal_year: 2027, merit_budget_cents: 50000000, refresh_budget_cents: 2000000, pricing_as_of_date: "2026-08-01" }, as: CompAdmin, captures: { prog: $.data.id } }
            - { call: "POST /comp/programs/${prog}/transition", payload: { to_state: "FRAMEWORK_LOCKED" }, as: CompAdmin }
            - { call: "POST /comp/programs/${prog}/transition", payload: { to_state: "PRICING" }, as: CompAdmin }
            - { call: "POST /comp/market-surveys", payload: { name: "S", publisher: "Pub", survey_year: 2026, effective_date: "2026-08-01" }, as: CompAnalyst, captures: { s: $.data.id } }
            - { call: "POST /comp/market-surveys/${s}/accept", payload: {}, as: CompManager }
            - { call: "POST /comp/market-cuts", payload: { market_survey_id: "${s}", job_profile_id: "${prof2}", geo_zone_id: "${nat}", p50_cents: 13000000, sample_size: 20, effective_date: "2026-08-01" }, as: CompAnalyst }
            - { call: "POST /comp/pay-bands", payload: { comp_program_id: "${prog}", job_family_id: "${fam}", job_level_id: "${lv2}", geo_zone_id: "${nat}", target_percentile: "P50", spread_pct: 0.3000 }, as: CompAnalyst, captures: { band2: $.data.id, band2_v: $.data.version } }
            - { call: "POST /comp/pay-bands/${band2}/price", payload: { pricing_variant: "OFFICIAL", expected_pay_band_version: "${band2_v}" }, as: CompAnalyst }
            - { call: "POST /comp/pay-bands/${band2}/approve", payload: {}, as: CompManager }
            - { call: "POST /comp/pay-bands/${band2}/publish", payload: {}, as: CompManager }
            - { call: "POST /comp/departments", payload: { name: "Dept A", code: "DA", adjustment_pool_cents: 5000000 }, as: CompAdmin, captures: { dept: $.data.id } }
          trigger:
            - { call: "POST /comp/employees", payload: { employee_ref: "E1", department_id: "${dept}", job_profile_id: "${prof2}", geo_zone_id: "${nat}", base_salary_cents: 14000000, hire_date: "2019-05-01" }, as: HRBP, captures: { cr: $.data.compa_ratio, rp: $.data.range_position } }
          assert:
            - "create response data already shows compa_ratio == 1.0769 and range_position == IN_RANGE"
            - "Department.${dept}.projected_payroll_cents == 14000000 immediately after the same request"
