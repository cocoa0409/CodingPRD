              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T13:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs/${pid}/groups/${gid}/sessions/${s_p3}/attendance"
              payload: { participant_id: "${pa}", access_modality: "IN_PERSON" }
              as: Facilitator
              as_user_id: "${fid}"
              captures: { a_p3: $.data.id }
            - call: "POST /programs/${pid}/groups/${gid}/sessions/${s_p3}/attendance/${a_p3}/checkout"
              payload: {}
              as: Facilitator
              as_user_id: "${fid}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T14:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs/${pid}/groups/${gid}/sessions/${s_p3}/complete"
              payload: {}
              as: Facilitator
              as_user_id: "${fid}"
            # Streak should now be 3
            - call: "GET /participants/${pa}"
              payload: {}
              as: ProgramAdmin
              captures: { streak_pre: $.data.attendance_streak }
            # New session, check in
            - call: "POST /programs/${pid}/groups/${gid}/sessions"
              payload: { start_at: "2026-08-02T15:00:00Z", end_at: "2026-08-02T16:00:00Z", primary_facilitator_id: "${fid}", room_id: "${rid}" }
              as: ProgramAdmin
              captures: { s_new: $.data.id }
            - call: "GET /facilitators/${fid}"
              payload: {}
              as: ProgramAdmin
              captures: { fv4: $.data.version }
            - call: "POST /programs/${pid}/groups/${gid}/sessions/${s_new}/schedule"
              payload: { expected_facilitator_version: "${fv4}" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T15:30:00Z" }
              as: ProgramAdmin
            - call: "POST /programs/${pid}/groups/${gid}/sessions/${s_new}/attendance"
              payload: { participant_id: "${pa}", access_modality: "IN_PERSON" }
              as: Facilitator
              as_user_id: "${fid}"
              captures: { a_new: $.data.id }
          trigger:
            - call: "POST /programs/${pid}/groups/${gid}/sessions/${s_new}/attendance/${a_new}/void"
              payload: {}
              as: Facilitator
              as_user_id: "${fid}"
            - call: "GET /participants/${pa}"
              payload: {}
              as: ProgramAdmin
              captures: { streak_post: $.data.attendance_streak }
          assert:
            - "streak_pre == 3 (after 3 ATTENDED records)"
            - "Check-in did NOT change streak (only checkout does)"
            - "VOID compensates the check-in; streak remains at prior value"
            - "streak_post == 3"
            - "streak_post == streak_pre"
            - "Invariant: checkin + void leaves attendance_streak unchanged"
