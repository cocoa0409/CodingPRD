          - validations.priority_12_ERR_CROSS_PLAN_YEAR_REFERENCE
          - entities.ComparativeAnalysis.fields.supersedes_analysis_id
        distinguishing_aspect: "The coherence rule's fourth arm: supersedes_analysis_id must carry the same nqtl_item_id as the new analysis, so a DRAFT analysis of a sibling item — perfectly supersedable in its own right — is refused."
        test_recipe:
          setup:
            - "One Administrator, one OPEN PlanYear, one classification, two NqtlItems (PRIOR_AUTHORIZATION and CONCURRENT_REVIEW)."
            - "One DRAFT ComparativeAnalysis on the PRIOR_AUTHORIZATION item."
