      - name: coupon_min_purchase_inclusive_boundary
        grounds:
          - calculations.checkout_charge
          - validations[priority=11]
          - errors[ERR_COUPON_MIN_PURCHASE_NOT_MET]
          - entities.Enrollment.fields.discount_cents
        distinguishing_aspect: |
          Monetary boundary on the enroll endpoint: coupon applies iff list_price_cents >=
          min_purchase_cents. Plan 15000 with coupon min_purchase 15000 (equal) APPLIES, discount
          floor(15000*0.10)=1500. Different metric (money) and endpoint (POST /enrollments) than the
          temporal refund boundary.
        test_recipe:
          setup:
            - "Published course, ONE_TIME plan 15000, ACTIVE PERCENT-10 coupon MIN15K min_purchase 15000 (wide window)"
          setup_api_calls:
            - call: "POST /creators"
              payload: { email: "c@x.com", display_name: "C" }
