            - { call: "POST /submissions", payload: { submission_round_id: "${r1}", editor_id: "${edF2}" }, as: Agent, as_user_id: "${agent1}", captures: { s2: $.data.id } }
            - { call: "POST /submission-rounds/${r1}/open", payload: { expected_submission_round_version: "${rv1}" }, as: Agent, as_user_id: "${agent1}" }
