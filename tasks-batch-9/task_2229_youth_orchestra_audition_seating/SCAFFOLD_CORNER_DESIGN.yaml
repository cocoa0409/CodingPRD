          setup:
            - "Season 2026-27 in PLACEMENT. One ensemble, Symphony (tier SYMPHONY,"
            - "max_total_size 6), owns exactly two sections: VIOLIN min 1 / target 1 / max 1"
            - "with rotation_policy ROTATING, and VIOLA min 1 / target 2 / max 2 with"
            - "rotation_policy FIXED. Adjudicated auditions: Vi Olin (VIOLIN, 94.60 ->"
            - "SYMPHONY), Vla One and Vla Two (VIOLA, 94.60 -> SYMPHONY), Phil Ip (VIOLIN,"
            - "81.80 -> PHILHARMONIC) and Cel Lo (CELLO, 94.60 -> SYMPHONY). Nots Cored"
