      - name: the_release_gate_reports_a_missing_an_incomplete_and_an_unapproved_package_differently
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DOCUMENTATION_PACKAGE_NOT_FOUND
          - errors.ERR_DOCUMENTATION_INCOMPLETE
          - errors.ERR_DOCUMENTATION_NOT_APPROVED
          - validations.priority_24
          - calculations.documentation_completeness
        distinguishing_aspect: |
          The documentation half of the release gate has three distinct failure modes and the same release
          call walks through all of them in order: no package at all is a 404
          ERR_DOCUMENTATION_PACKAGE_NOT_FOUND, a package that exists but is only three fifths complete
