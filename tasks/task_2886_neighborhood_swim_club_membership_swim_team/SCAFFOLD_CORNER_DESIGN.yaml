      - name: violation_to_error_zone_conflict_and_aggregate_bather_capacity
        claim_type: violation_to_error
        grounds:
          - validations[priority=63]
          - validations[priority=64]
          - entities.Season.fields.bather_load_capacity
          - endpoints[POST /swim-club/party-reservations]
        distinguishing_aspect: |
          These two rules read the SAME overlapping-reservation set through different lenses, and the
          fixture separates them: SHALLOW_END never conflicts with PAVILION, so a shallow-end booking
          slips past priority 63 and is then stopped by the aggregate capacity rule at priority 64 -
          which sums loads across zones. Adjacency is used twice as a control: a reservation starting
          exactly when another ends neither conflicts nor contributes to the load, because the overlap
          window is half-open. The capacity comparison is then shown to be inclusive at exactly 40.
        test_recipe:
          setup:
            - "One COUPLE category with bond 0 and party_privileges true."
            - "One OPEN 2027 season with bather_load_capacity deliberately lowered to 40."
            - "Three households A, B and C, each with an invoiced ACTIVE membership, so DELINQUENCY_TOLERANCE_CENTS 0 never blocks a household's first booking."
            - "The clock sits at 2027-07-01T09:00Z, before every party window."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "COUPLE", label: "Couple", bond_cents: 0, initiation_fee_cents: 0, seasonal_dues_cents: 30000, guest_pass_allotment: 2, max_household_size: 4, volunteer_credits_required: 2, waitlist_required: false, proration_allowed: true, party_privileges: true }
