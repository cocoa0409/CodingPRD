  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: same_investor_half_open_windows_allow_adjacency_but_reject_one_second_overlap
        grounds:
          - calculations.outreach_window_conflict
          - validations.priority_35_ERR_OUTREACH_WINDOW_OVERLAP
          - state_machines.OutreachEngagement.REQUESTED_to_SCHEDULED
          - entities.OutreachEngagement.fields.investor_key
        distinguishing_aspect: |
          The scarce resource is an investor's calendar, keyed by investor_key rather than by row id, and the
          intervals are HALF-OPEN [window_start, window_end): a slot beginning at the exact instant another ends
          is legal, while a slot beginning one second earlier is not. The same fixture also proves the conflict is
          scoped to the investor: a DIFFERENT investor_key may book a wholly containing window with no complaint.
        test_recipe:
          setup:
            - "MINI fixture with an APPROVED one-peer group and PayProgram P1 whose meeting_date is 2027-05-12T00:00:00Z, so the quiet period [2027-05-02T00:00:00Z, 2027-05-12T00:00:00Z] is far away from every window used here."
            - "Engagement E_A for investor_key BLACKROCK, SCHEDULED into [2027-03-01T00:00:00Z, 2027-03-05T00:00:00Z)."
            - "Engagement E_B for investor_key BLACKROCK, SCHEDULED into [2027-03-05T00:00:00Z, 2027-03-08T00:00:00Z) — exactly adjacent to E_A and therefore accepted."
            - "Engagement E_C for investor_key BLACKROCK, still REQUESTED."
            - "Engagement E_D for investor_key VANGUARD, still REQUESTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Acme Industries Inc", ticker: "ACME", is_issuer: true, gics_sector: "TECH", revenue_usd: 10000000000, market_cap_usd: 20000000000, share_price_usd: 50.00, ceo_tdc_usd: 15000000 }
              as: CompConsultant
              captures: { acme_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Bravo Corp", ticker: "BRVO", is_issuer: false, gics_sector: "TECH", revenue_usd: 8000000000, market_cap_usd: 16000000000, share_price_usd: 40.00, ceo_tdc_usd: 12000000 }
              as: CompConsultant
              captures: { bravo_id: $.data.id }
            - call: "POST /exec-comp/companies/${acme_id}/executives"
              payload: { full_name: "Dana Reyes", role_title: "CEO", is_neo: true, base_salary_usd: 1200000, sti_target_pct: 150.00 }
              as: CompConsultant
              captures: { ceo_id: $.data.id }
            - call: "POST /exec-comp/peer-groups"
              payload: { issuer_company_id: "${acme_id}", fiscal_year: 2026, benchmark_basis: "RAW_MEDIAN" }
              as: CompConsultant
              captures: { pg_id: $.data.id, pg_v0: $.data.version }
            - call: "POST /exec-comp/peer-groups/${pg_id}/members"
              payload: { peer_company_id: "${bravo_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pg_v0}" }
              as: CompConsultant
            - call: "POST /exec-comp/peer-groups/${pg_id}/screen"
              payload: {}
              as: CompConsultant
            - call: "POST /exec-comp/peer-groups/${pg_id}/approve"
              payload: {}
              as: CompCommitteeChair
              as_user_id: "chair-001"
            - call: "POST /exec-comp/pay-programs"
              payload: { issuer_company_id: "${acme_id}", peer_group_id: "${pg_id}", ceo_executive_id: "${ceo_id}", fiscal_year: 2026, salary_pct: 15.00, sti_pct: 25.00, lti_pct: 60.00, lti_performance_share_pct: 60.00, sti_max_multiple: 2.0, tsr_percentile_rank: 30.00, meeting_date: "2027-05-12T00:00:00Z" }
              as: CompConsultant
              captures: { pp_id: $.data.id }
            - call: "POST /exec-comp/pay-programs/${pp_id}/outreach-engagements"
              payload: { investor_name: "BlackRock", investor_key: "BLACKROCK", ownership_pct: 20.00, channel: "VIDEO_CALL" }
              as: InvestorRelationsLead
              captures: { eng_a_id: $.data.id }
            - call: "POST /exec-comp/outreach-engagements/${eng_a_id}/schedule"
              payload: { window_start: "2027-03-01T00:00:00Z", window_end: "2027-03-05T00:00:00Z" }
              as: InvestorRelationsLead
            - call: "POST /exec-comp/pay-programs/${pp_id}/outreach-engagements"
              payload: { investor_name: "BlackRock", investor_key: "BLACKROCK", ownership_pct: 20.00, channel: "IN_PERSON" }
              as: InvestorRelationsLead
              captures: { eng_b_id: $.data.id }
            - call: "POST /exec-comp/outreach-engagements/${eng_b_id}/schedule"
              payload: { window_start: "2027-03-05T00:00:00Z", window_end: "2027-03-08T00:00:00Z" }
              as: InvestorRelationsLead
            - call: "POST /exec-comp/pay-programs/${pp_id}/outreach-engagements"
              payload: { investor_name: "BlackRock", investor_key: "BLACKROCK", ownership_pct: 20.00, channel: "PHONE" }
              as: InvestorRelationsLead
              captures: { eng_c_id: $.data.id }
            - call: "POST /exec-comp/pay-programs/${pp_id}/outreach-engagements"
              payload: { investor_name: "Vanguard", investor_key: "VANGUARD", ownership_pct: 11.00, channel: "VIDEO_CALL" }
              as: InvestorRelationsLead
              captures: { eng_d_id: $.data.id }
          trigger:
            - call: "POST /exec-comp/outreach-engagements/${eng_c_id}/schedule"
              payload: { window_start: "2027-03-04T23:59:59Z", window_end: "2027-03-06T00:00:00Z" }
              as: InvestorRelationsLead
          assert:
            - "the E_B setup call returned HTTP 200 with engagement_status SCHEDULED: window_start 2027-03-05T00:00:00Z exactly equals E_A's window_end and half-open adjacency is PERMITTED"
            - "the trigger returns HTTP 409 with error_id == ERR_OUTREACH_WINDOW_OVERLAP: [2027-03-04T23:59:59Z, 2027-03-06T00:00:00Z) overlaps E_A by exactly one second"
            - "OutreachEngagement.${eng_c_id}.engagement_status is still REQUESTED with window_start and window_end null"
            - "scheduling ${eng_c_id} into [2027-03-08T00:00:00Z, 2027-03-10T00:00:00Z) instead succeeds — adjacency to E_B's end is again permitted"
            - "scheduling ${eng_d_id} (investor_key VANGUARD) into [2027-03-01T00:00:00Z, 2027-03-20T00:00:00Z), which wholly contains all three BlackRock windows, succeeds because the conflict is scoped to investor_key"
            - "a REQUESTED rival never blocks: while ${eng_c_id} was REQUESTED with null bounds it constrained nothing"

      - name: restatement_lookback_windows_reject_adjacency_because_of_the_one_day_buffer
        grounds:
          - calculations.restatement_lookback_conflict
          - validations.priority_36_ERR_LOOKBACK_PERIOD_COLLISION
          - state_machines.RestatementEvent.RECOVERY_ORDERED_to_CLOSED
          - entities.RestatementEvent.fields.lookback_start
        distinguishing_aspect: |
          The opposite interval convention to the outreach windows: lookback periods are CLOSED on both ends and
          additionally padded by LOOKBACK_BUFFER_DAYS 1, so adjacency is FORBIDDEN and the first legal start is a
          full day after the incumbent's end. One second of separation is enough for an outreach window and not
          enough for a lookback window — the two rules in this pair therefore disagree about the same geometry.
          The fixture also pins the input set: CLOSED events stop blocking entirely.
        test_recipe:
          setup:
            - "Company ACME (issuer). No programs or awards are needed — the collision rule looks only at RestatementEvent rows of the same company."
            - "RestatementEvent E1 declared with lookback [2026-01-01T00:00:00Z, 2026-12-31T23:59:59Z], left in status DECLARED so it is a live rival."
            - "The buffered rival interval is therefore [2025-12-31T00:00:00Z, 2027-01-01T23:59:59Z]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Acme Industries Inc", ticker: "ACME", is_issuer: true, gics_sector: "TECH", revenue_usd: 10000000000, market_cap_usd: 20000000000, share_price_usd: 50.00, ceo_tdc_usd: 15000000 }
              as: CompConsultant
              captures: { acme_id: $.data.id }
            - call: "POST /exec-comp/companies/${acme_id}/restatement-events"
              payload: { restatement_date: "2027-03-01T00:00:00Z", lookback_start: "2026-01-01T00:00:00Z", lookback_end: "2026-12-31T23:59:59Z", accounting_reason: "Revenue recognition error overstating adjusted EPS for fiscal 2026." }
              as: SecuritiesCounsel
              as_user_id: "counsel-001"
              captures: { rev1_id: $.data.id }
          trigger:
            - call: "POST /exec-comp/companies/${acme_id}/restatement-events"
              payload: { restatement_date: "2027-06-01T00:00:00Z", lookback_start: "2027-01-01T00:00:00Z", lookback_end: "2027-06-30T23:59:59Z", accounting_reason: "Lease accounting error in the first half of fiscal 2027." }
              as: SecuritiesCounsel
              as_user_id: "counsel-001"
          assert:
            - "HTTP 409 with error_id == ERR_LOOKBACK_PERIOD_COLLISION: candidate.lookback_start 2027-01-01T00:00:00Z is at or before E1.lookback_end + 1 day == 2027-01-01T23:59:59Z, so exact adjacency to the day boundary collides"
            - "no second RestatementEvent row exists and RestatementEvent.${rev1_id} is untouched (status DECLARED, determination_count 0, recoverable_total_usd 0.00, recovered_total_usd 0.00, version unchanged)"
            - "GET /exec-comp/companies/${acme_id}/restatement-events returns exactly 1 row"
            - "the identical request with lookback_start 2027-01-02T00:00:00Z is ACCEPTED with HTTP 201, because 2027-01-02T00:00:00Z is strictly after 2027-01-01T23:59:59Z"
            - "an event whose lookback ends at 2025-12-30T23:59:59Z is also accepted, exercising the symmetric lower edge lookback_start - 1 day == 2025-12-31T00:00:00Z"
            - "contrast with the outreach rule: an outreach window may start at the exact instant another ends, while a lookback may not start within a day of another ending"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: mix_reallocation_round_trip_conserves_hundred_points_and_restores_every_derived_field
        grounds:
          - calculations.pay_mix_reallocation
          - calculations.target_total_direct_comp
          - concurrency_rules.mix-reallocation-stale-program
          - entities.PayProgram.fields.performance_based_pct
        distinguishing_aspect: |
          The conserved quantity is the 100.00-point mix total, and the invariant is stronger than conservation:
          the forward/reverse pair must restore all SIX derived fields (performance_based_pct, benchmark_ratio,
          lti_multiple, lti_target_usd, target_tdc_usd, benchmark_posture) to their exact prior values even though
          the intermediate state crossed a different lti_multiple TIER (4.0 -> 3.0 -> 4.0) and a different posture
          (ABOVE_MARKET -> ALIGNED -> ABOVE_MARKET). Version and screen staleness are deliberately NOT restored,
          so the test also pins what a compensating action must leave changed.
        test_recipe:
          setup:
            - "MINI fixture with an APPROVED one-peer group (benchmark_target_tdc_usd 12,000,000.00) and PayProgram P1 left in DRAFT so reallocation is permitted."
            - "Baseline mix 15/25/60 with lti_performance_share_pct 60.00 gives performance_based_pct 61.00, fixed_leg_usd 3,000,000.00, benchmark_ratio 0.6250, lti_multiple 4.0, lti_target_usd 12,000,000.00, target_tdc_usd 15,000,000.00, benchmark_posture ABOVE_MARKET."
            - "An ISS ProxyAdvisorScreen run while the program had no awards, so it recorded concern_score 36.70, concern_level MEDIUM, recommendation FOR, status SCREENED."
            - "Forward leg: move 10.00 points SALARY -> LTI, giving 5/25/70 (salary sits exactly on MIX_COMPONENT_MIN 5.00), performance_based_pct 67.00, benchmark_ratio 0.8333, lti_multiple 3.0, lti_target_usd 9,000,000.00, target_tdc_usd 12,000,000.00, benchmark_posture ALIGNED."
            - "Each leg re-reads the program version, because expected_pay_program_version must be the current one."
