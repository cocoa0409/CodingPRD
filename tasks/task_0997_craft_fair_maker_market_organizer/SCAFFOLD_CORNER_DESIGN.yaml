            - call: "POST /maker-events/${ev_id}/applications/${app_id}/jury-scores"
              payload: { craftsmanship: 8, originality: 8, booth_presentation: 8 }
              as: Juror
              as_user_id: "juror-2"
            - call: "GET /maker-events/${ev_id}"
              payload: {}
              as: EventCoordinator
              captures: { ev_v: $.data.version }
            - call: "POST /maker-events/${ev_id}/applications/${app_id}/decide"
              payload: { outcome: "APPROVE", expected_event_version: "${ev_v}" }
              as: EventCoordinator
            - call: "POST /maker-events/${ev_id}/begin-scheduling"
              payload: {}
              as: EventCoordinator
            - call: "GET /maker-events/${ev_id}/assignments"
              payload: { vendor_application_id: "${app_id}" }
              as: EventCoordinator
              captures: { assignment_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /maker-events/${ev_id}/assignments/${assignment_id}/pay"
              payload: {}
              as: Vendor
              as_user_id: "${vendor_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == 'ERR_PAYMENT_WINDOW_EXPIRED'"

      - name: category_cap_exceeded_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=9]"
          - "errors.ERR_CATEGORY_CAP_EXCEEDED"
        distinguishing_aspect: "Approving the (cap+1)th application in same category returns ERR_CATEGORY_CAP_EXCEEDED"
        test_recipe:
          setup: ["MakerEvent JURY_REVIEW with category_cap=1, one already APPROVED, second pending decide"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maker-events"
              payload:
                name: "Cap Fair"
                opens_at: "2026-06-01T09:00:00Z"
                closes_at: "2026-06-01T18:00:00Z"
                venue_capacity: 100
                application_window_start: "2026-05-01T00:00:00Z"
                application_window_end: "2026-05-10T00:00:00Z"
                jury_quorum: 2
