# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2610 — Utility & Cargo Trailer Manufacturing
#
# Every instance below grounds only in elements declared in SCAFFOLD.yaml §1.1–§1.7.
# Shared fixture literals used across instances (all pinned, none derived at test time):
#   model TA-7X14 : provisional_gvwr_lbs 7000, certified_gvwr_lbs 6300, base_curb 1980,
#                   base_dealer_price_cents 489900, nominal 4267 x 2134 mm, width 78.5 in
#   dealer DLR-001: labor_rate_cents_per_hour 9500, floor_plan_limit_cents 200000000,
#                   allocation_quota_per_month 5
#   jig JIG-TA-01 : changeover_buffer_min 45;  lane LANE-01: max_concurrent_tests 2
#   logical clock : starts at the documented default 2026-08-01T00:00:00Z
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: gvwr_provisional_estimate_versus_certified_final
        grounds:
          - calculations.gvwr_rating
          - entities.TrailerModel.fields.provisional_gvwr_lbs
          - entities.TrailerModel.fields.certified_gvwr_lbs
          - state_machines.TrailerModel.DRAFT_to_IN_ENGINEERING_REVIEW
          - state_machines.TrailerModel.IN_ENGINEERING_REVIEW_to_CERTIFIED
        distinguishing_aspect: |
          This is the TrailerModel-domain variant pair: the provisional variant omits
          tire_capacity_lbs from the min() set and skips UNBRAKED_AXLE_DERATE, so the same
          model row carries provisional_gvwr_lbs 7000 and certified_gvwr_lbs 6300 — a 700 lb
          divergence produced by input-set membership plus a derate, not by a coverage factor.
        test_recipe:
          setup:
            - "Empty DB; logical clock at the default 2026-08-01T00:00:00Z."
            - "One TrailerModel TA-7X14 in DRAFT with axle_count 2, axle_rating_lbs 3500, design_braked_axle_count 1 (one unbraked axle), tire_load_rating_lbs 1820, frame_design_rated_lbs 7200, coupler_rating_lbs 7500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantEngineer
              as_user_id: "pe-1"
            - call: "POST /trailer-models"
              payload: { model_code: "TA-7X14", description: "Tandem 7x14 cargo", axle_count: 2, axle_rating_lbs: 3500, design_braked_axle_count: 1, tire_load_rating_lbs: 1820, frame_design_code: "TA", frame_design_rated_lbs: 7200, coupler_rating_lbs: 7500, overall_width_in: 78.5, nominal_length_mm: 4267, nominal_width_mm: 2134, base_curb_weight_lbs: 1980, base_dealer_price_cents: 489900 }
              as: PlantEngineer
              as_user_id: "pe-1"
              captures: { model_id: $.data.id }
          trigger:
            - call: "POST /trailer-models/${model_id}/certification-submission"
              payload: { engineering_note: "initial GVWR package" }
              as: PlantEngineer
              as_user_id: "pe-1"
            - call: "POST /trailer-models/${model_id}/certification-decision"
              payload: { decision: "CERTIFIED", decision_note: "capacities verified" }
              as: CertificationOfficer
              as_user_id: "co-1"
          assert:
            - "TrailerModel.${model_id}.provisional_gvwr_lbs == 7000"
            - "TrailerModel.${model_id}.certified_gvwr_lbs == 6300"
            - "TrailerModel.${model_id}.provisional_gvwr_lbs - TrailerModel.${model_id}.certified_gvwr_lbs == 700"
            - "TrailerModel.${model_id}.certification_status == CERTIFIED"
            - "TrailerModel.${model_id}.certified_by_user_id == co-1"
      - name: warranty_in_warranty_full_versus_goodwill_prorated
        grounds:
          - calculations.warranty_reimbursement
          - entities.WarrantyClaim.fields.coverage_variant
          - entities.WarrantyClaim.fields.reimbursement_total_cents
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          This is the WarrantyClaim-domain variant pair, and it diverges on a different
          mechanism than gvwr_rating: both variants consume the identical gross_cents 49535,
          and only the days-past-expiry coverage_factor differs (1.00 -> 49535 versus 0.75 ->
          37151), so the delta comes from a temporal multiplier rather than from the input set.
        test_recipe:
          setup:
            - "TrailerModel TA-7X14 CERTIFIED at 6300 lb; jig JIG-TA-01; lane LANE-01; dealer DLR-001 with labor_rate_cents_per_hour 9500."
            - "One trailer unit SN-000101 built, road tested, labeled, allocated to order PO-10001 and DELIVERED with the clock at 2026-08-05T00:00:00Z, so warranty_start_date is 2026-08-05 and the 730-day expiry is 2028-08-04."
            - "Clock advanced to 2028-08-20T00:00:00Z before either claim is filed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantEngineer
              as_user_id: "pe-1"
            - call: "POST /trailer-models"
              payload: { model_code: "TA-7X14", description: "Tandem 7x14 cargo", axle_count: 2, axle_rating_lbs: 3500, design_braked_axle_count: 1, tire_load_rating_lbs: 1820, frame_design_code: "TA", frame_design_rated_lbs: 7200, coupler_rating_lbs: 7500, overall_width_in: 78.5, nominal_length_mm: 4267, nominal_width_mm: 2134, base_curb_weight_lbs: 1980, base_dealer_price_cents: 489900 }
              as: PlantEngineer
              as_user_id: "pe-1"
              captures: { model_id: $.data.id }
            - call: "POST /trailer-models/${model_id}/certification-submission"
              payload: { engineering_note: "initial GVWR package" }
              as: PlantEngineer
              as_user_id: "pe-1"
            - call: "POST /trailer-models/${model_id}/certification-decision"
              payload: { decision: "CERTIFIED", decision_note: "capacities verified" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /weld-jigs"
              payload: { jig_code: "JIG-TA-01", frame_design_code: "TA", changeover_buffer_min: 45 }
              as: PlantEngineer
              as_user_id: "pe-1"
              captures: { jig_id: $.data.id, jig_v0: $.data.version }
            - call: "POST /test-lanes"
              payload: { lane_code: "LANE-01", surface_type: "ASPHALT", max_concurrent_tests: 2 }
              as: PlantEngineer
              as_user_id: "pe-1"
              captures: { lane_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "DLR-001", name: "Prairie Trailer Sales", labor_rate_cents_per_hour: 9500, floor_plan_limit_cents: 200000000, allocation_quota_per_month: 5 }
              as: SalesAdmin
              as_user_id: "sa-1"
              captures: { dealer_id: $.data.id, dealer_v0: $.data.version }
            - call: "POST /trailer-units"
              payload: { serial_number: "SN-000101", model_id: "${model_id}", planned_start_date: "2026-08-03T07:00:00Z" }
              as: WeldSupervisor
              as_user_id: "ws-1"
              captures: { unit_id: $.data.id }
            - call: "POST /weld-jigs/${jig_id}/jig-reservations"
              payload: { unit_id: "${unit_id}", window_start_at: "2026-08-03T09:00:00Z", window_end_at: "2026-08-03T11:00:00Z", expected_weld_jig_version: "${jig_v0}" }
              as: WeldSupervisor
              as_user_id: "ws-1"
            - call: "POST /trailer-units/${unit_id}/frame-inspections"
              payload: { measured_length_mm: 4267, measured_width_mm: 2134, diagonal_a_mm: 4770, diagonal_b_mm: 4770, critical_weld_defect_count: 0, non_critical_weld_defect_count: 0 }
              as: WeldSupervisor
              as_user_id: "ws-1"
            - call: "POST /trailer-units/${unit_id}/systems-install"
              payload: { stage: "LIGHTING", stop_tail_turn_lamp_count: 2, clearance_lamp_count: 0, side_marker_lamp_count: 2, license_plate_lamp_count: 1, reflex_reflector_count: 4 }
              as: AssemblyTech
              as_user_id: "at-1"
            - call: "POST /trailer-units/${unit_id}/systems-install"
              payload: { stage: "BRAKE_AND_AXLE", installed_braked_axle_count: 1, breakaway_kit_installed: true }
              as: AssemblyTech
              as_user_id: "at-1"
            - call: "POST /trailer-units/${unit_id}/road-tests"
              payload: { lane_id: "${lane_id}", window_start_at: "2026-08-04T10:00:00Z", window_end_at: "2026-08-04T11:00:00Z", protocol_code: "STANDARD_20MI" }
              as: QualityInspector
              as_user_id: "qi-1"
              captures: { road_test_id: $.data.id }
            - call: "POST /road-tests/${road_test_id}/result"
              payload: { brake_stop_distance_ft: 32.5, lighting_check_passed: true, result_notes: "within spec" }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /trailer-units/${unit_id}/certification-label"
              payload: { tire_size_code: "ST205/75R15" }
              as: CertificationOfficer
              as_user_id: "co-2"
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dealer_id}", model_id: "${model_id}", po_ref: "PO-10001", stocking_program: "STOCK" }
              as: SalesAdmin
              as_user_id: "sa-1"
              captures: { order_id: $.data.id }
            - call: "POST /dealer-orders/${order_id}/allocation"
              payload: { expected_dealer_version: "${dealer_v0}" }
              as: SalesAdmin
              as_user_id: "sa-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: SalesAdmin
              as_user_id: "sa-1"
            - call: "POST /dealer-orders/${order_id}/delivery"
              payload: { delivery_note: "hauled by dealer" }
              as: SalesAdmin
              as_user_id: "sa-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-08-20T00:00:00Z" }
              as: SalesAdmin
              as_user_id: "sa-1"
          trigger:
            - call: "POST /warranty-claims"
              payload: { claim_ref: "WC-IN-WARRANTY", unit_id: "${unit_id}", dealer_id: "${dealer_id}", complaint_code: "BRAKE", labor_hours: 2.4, part_lines: [{ unit_cost_cents: 5398, quantity: 3 }, { unit_cost_cents: 911, quantity: 1 }], failure_date: "2028-08-04T00:00:00Z" }
              as: SalesAdmin
              as_user_id: "sa-1"
              captures: { claim_full_id: $.data.id }
            - call: "POST /warranty-claims/${claim_full_id}/review"
              payload: { decision: "APPROVE", review_note: "inside 730 days" }
              as: SalesAdmin
              as_user_id: "sa-1"
            - call: "POST /warranty-claims"
              payload: { claim_ref: "WC-GOODWILL", unit_id: "${unit_id}", dealer_id: "${dealer_id}", complaint_code: "BRAKE", labor_hours: 2.4, part_lines: [{ unit_cost_cents: 5398, quantity: 3 }, { unit_cost_cents: 911, quantity: 1 }], failure_date: "2028-08-14T00:00:00Z" }
              as: SalesAdmin
              as_user_id: "sa-1"
              captures: { claim_goodwill_id: $.data.id }
            - call: "POST /warranty-claims/${claim_goodwill_id}/review"
              payload: { decision: "APPROVE", review_note: "10 days past expiry, goodwill" }
              as: SalesAdmin
              as_user_id: "sa-1"
          assert:
            - "TrailerUnit.${unit_id}.warranty_start_date == 2026-08-05T00:00:00Z"
            - "WarrantyClaim.${claim_full_id}.coverage_variant == IN_WARRANTY_FULL"
            - "WarrantyClaim.${claim_full_id}.coverage_factor == 1.00"
            - "WarrantyClaim.${claim_full_id}.labor_cents == 22800"
            - "WarrantyClaim.${claim_full_id}.parts_subtotal_cents == 22235"
            - "WarrantyClaim.${claim_full_id}.freight_cents == 4500"
            - "WarrantyClaim.${claim_full_id}.reimbursement_total_cents == 49535"
            - "WarrantyClaim.${claim_goodwill_id}.coverage_variant == GOODWILL_PRORATED"
            - "WarrantyClaim.${claim_goodwill_id}.coverage_factor == 0.75"
            - "WarrantyClaim.${claim_goodwill_id}.labor_cents == 22800"
            - "WarrantyClaim.${claim_goodwill_id}.parts_subtotal_cents == 22235"
            - "WarrantyClaim.${claim_goodwill_id}.reimbursement_total_cents == 37151"
            - "WarrantyClaim.${claim_full_id}.reimbursement_total_cents - WarrantyClaim.${claim_goodwill_id}.reimbursement_total_cents == 12384"
            - "Both claims are APPROVED (part_line_count == 2, so neither auto-closes)"
  - rule_id: combinatorial_formula
    instances:
      - name: order_invoice_pinned_seven_step_evaluation_order
        grounds:
          - calculations.order_invoice_and_draw
          - calculations.dealer_allocation_counters
          - entities.DealerOrder.fields.volume_discount_pct
          - entities.DealerOrder.fields.freight_cents
          - entities.DealerOrder.fields.floor_plan_draw_cents
          - state_machines.DealerOrder.PENDING_to_ALLOCATED
        distinguishing_aspect: |
          Combinatorial mode (a): a circular-looking chain resolved by a pinned step order —
          the freight decision (step 5) reads the volume tier (step 3), the total (step 6) reads
          the freight, and the draw (step 7) reads the total, so two allocations with an identical
          invoice_subtotal_cents 489900 land on invoice_total_cents 579400 and 475203 purely
          because the dealer's allocations_ytd_count moved from 0 to 1 between them.
        test_recipe:
          setup:
            - "TrailerModel TA-7X14 CERTIFIED; jig JIG-TA-01 (buffer 45); lane LANE-01; dealer DLR-001 with floor_plan_limit_cents 200000000 and allocation_quota_per_month 5."
            - "Two units SN-000101 and SN-000102 built, road tested, labeled and RELEASED_TO_STOCK; neither carries any OptionInstall, so options_total_cents is 0 for both."
            - "Two PENDING orders PO-10001 and PO-10002 for the same dealer and model; dealer.allocations_ytd_count is 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantEngineer
              as_user_id: "pe-1"
            - call: "POST /trailer-models"
              payload: { model_code: "TA-7X14", description: "Tandem 7x14 cargo", axle_count: 2, axle_rating_lbs: 3500, design_braked_axle_count: 1, tire_load_rating_lbs: 1820, frame_design_code: "TA", frame_design_rated_lbs: 7200, coupler_rating_lbs: 7500, overall_width_in: 78.5, nominal_length_mm: 4267, nominal_width_mm: 2134, base_curb_weight_lbs: 1980, base_dealer_price_cents: 489900 }
              as: PlantEngineer
              as_user_id: "pe-1"
              captures: { model_id: $.data.id }
            - call: "POST /trailer-models/${model_id}/certification-submission"
              payload: { engineering_note: "initial GVWR package" }
              as: PlantEngineer
              as_user_id: "pe-1"
            - call: "POST /trailer-models/${model_id}/certification-decision"
              payload: { decision: "CERTIFIED", decision_note: "capacities verified" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /weld-jigs"
              payload: { jig_code: "JIG-TA-01", frame_design_code: "TA", changeover_buffer_min: 45 }
              as: PlantEngineer
              as_user_id: "pe-1"
              captures: { jig_id: $.data.id, jig_v0: $.data.version }
            - call: "POST /test-lanes"
              payload: { lane_code: "LANE-01", surface_type: "ASPHALT", max_concurrent_tests: 2 }
              as: PlantEngineer
              as_user_id: "pe-1"
              captures: { lane_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "DLR-001", name: "Prairie Trailer Sales", labor_rate_cents_per_hour: 9500, floor_plan_limit_cents: 200000000, allocation_quota_per_month: 5 }
              as: SalesAdmin
              as_user_id: "sa-1"
              captures: { dealer_id: $.data.id, dealer_v0: $.data.version }
            - call: "POST /trailer-units"
              payload: { serial_number: "SN-000101", model_id: "${model_id}", planned_start_date: "2026-08-03T07:00:00Z" }
              as: WeldSupervisor
              as_user_id: "ws-1"
              captures: { unit1_id: $.data.id }
            - call: "POST /trailer-units"
              payload: { serial_number: "SN-000102", model_id: "${model_id}", planned_start_date: "2026-08-03T07:00:00Z" }
              as: WeldSupervisor
              as_user_id: "ws-1"
              captures: { unit2_id: $.data.id }
            - call: "POST /weld-jigs/${jig_id}/jig-reservations"
              payload: { unit_id: "${unit1_id}", window_start_at: "2026-08-03T09:00:00Z", window_end_at: "2026-08-03T11:00:00Z", expected_weld_jig_version: "${jig_v0}" }
              as: WeldSupervisor
              as_user_id: "ws-1"
            - call: "GET /weld-jigs/${jig_id}"
              payload: {}
              as: WeldSupervisor
              as_user_id: "ws-1"
              captures: { jig_v1: $.data.version }
            - call: "POST /weld-jigs/${jig_id}/jig-reservations"
              payload: { unit_id: "${unit2_id}", window_start_at: "2026-08-03T12:00:00Z", window_end_at: "2026-08-03T14:00:00Z", expected_weld_jig_version: "${jig_v1}" }
              as: WeldSupervisor
              as_user_id: "ws-1"
            - call: "POST /trailer-units/${unit1_id}/frame-inspections"
              payload: { measured_length_mm: 4267, measured_width_mm: 2134, diagonal_a_mm: 4770, diagonal_b_mm: 4770, critical_weld_defect_count: 0, non_critical_weld_defect_count: 0 }
              as: WeldSupervisor
              as_user_id: "ws-1"
            - call: "POST /trailer-units/${unit2_id}/frame-inspections"
              payload: { measured_length_mm: 4267, measured_width_mm: 2134, diagonal_a_mm: 4770, diagonal_b_mm: 4770, critical_weld_defect_count: 0, non_critical_weld_defect_count: 0 }
              as: WeldSupervisor
              as_user_id: "ws-1"
            - call: "POST /trailer-units/${unit1_id}/systems-install"
              payload: { stage: "LIGHTING", stop_tail_turn_lamp_count: 2, clearance_lamp_count: 0, side_marker_lamp_count: 2, license_plate_lamp_count: 1, reflex_reflector_count: 4 }
              as: AssemblyTech
              as_user_id: "at-1"
            - call: "POST /trailer-units/${unit1_id}/systems-install"
              payload: { stage: "BRAKE_AND_AXLE", installed_braked_axle_count: 1, breakaway_kit_installed: true }
              as: AssemblyTech
              as_user_id: "at-1"
            - call: "POST /trailer-units/${unit2_id}/systems-install"
              payload: { stage: "LIGHTING", stop_tail_turn_lamp_count: 2, clearance_lamp_count: 0, side_marker_lamp_count: 2, license_plate_lamp_count: 1, reflex_reflector_count: 4 }
              as: AssemblyTech
              as_user_id: "at-1"
            - call: "POST /trailer-units/${unit2_id}/systems-install"
              payload: { stage: "BRAKE_AND_AXLE", installed_braked_axle_count: 1, breakaway_kit_installed: true }
              as: AssemblyTech
              as_user_id: "at-1"
            - call: "POST /trailer-units/${unit1_id}/road-tests"
              payload: { lane_id: "${lane_id}", window_start_at: "2026-08-04T10:00:00Z", window_end_at: "2026-08-04T11:00:00Z", protocol_code: "STANDARD_20MI" }
              as: QualityInspector
              as_user_id: "qi-1"
              captures: { rt1_id: $.data.id }
            - call: "POST /road-tests/${rt1_id}/result"
              payload: { brake_stop_distance_ft: 32.5, lighting_check_passed: true, result_notes: "within spec" }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /trailer-units/${unit2_id}/road-tests"
              payload: { lane_id: "${lane_id}", window_start_at: "2026-08-04T12:00:00Z", window_end_at: "2026-08-04T13:00:00Z", protocol_code: "STANDARD_20MI" }
              as: QualityInspector
              as_user_id: "qi-1"
              captures: { rt2_id: $.data.id }
            - call: "POST /road-tests/${rt2_id}/result"
              payload: { brake_stop_distance_ft: 33.0, lighting_check_passed: true, result_notes: "within spec" }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /trailer-units/${unit1_id}/certification-label"
              payload: { tire_size_code: "ST205/75R15" }
              as: CertificationOfficer
              as_user_id: "co-2"
            - call: "POST /trailer-units/${unit2_id}/certification-label"
              payload: { tire_size_code: "ST205/75R15" }
              as: CertificationOfficer
              as_user_id: "co-2"
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dealer_id}", model_id: "${model_id}", po_ref: "PO-10001", stocking_program: "STOCK" }
              as: SalesAdmin
              as_user_id: "sa-1"
              captures: { order1_id: $.data.id }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dealer_id}", model_id: "${model_id}", po_ref: "PO-10002", stocking_program: "STOCK" }
              as: SalesAdmin
              as_user_id: "sa-1"
              captures: { order2_id: $.data.id }
          trigger:
            - call: "POST /dealer-orders/${order1_id}/allocation"
              payload: { expected_dealer_version: "${dealer_v0}" }
              as: SalesAdmin
              as_user_id: "sa-1"
            - call: "GET /dealers/${dealer_id}"
              payload: {}
              as: SalesAdmin
              as_user_id: "sa-1"
              captures: { dealer_v1: $.data.version }
            - call: "POST /dealer-orders/${order2_id}/allocation"
              payload: { expected_dealer_version: "${dealer_v1}" }
              as: SalesAdmin
              as_user_id: "sa-1"
          assert:
            - "DealerOrder.${order1_id}.allocated_unit_id == ${unit1_id}  # selector tie broken by serial_number SN-000101 < SN-000102, never by id"
            - "DealerOrder.${order1_id}.invoice_subtotal_cents == 489900"
            - "DealerOrder.${order1_id}.volume_discount_pct == 0.00"
            - "DealerOrder.${order1_id}.volume_discount_cents == 0"
            - "DealerOrder.${order1_id}.freight_cents == 89500"
            - "DealerOrder.${order1_id}.invoice_total_cents == 579400"
            - "DealerOrder.${order1_id}.floor_plan_draw_cents == 521460"
            - "DealerOrder.${order2_id}.allocated_unit_id == ${unit2_id}"
            - "DealerOrder.${order2_id}.invoice_subtotal_cents == 489900"
            - "DealerOrder.${order2_id}.volume_discount_pct == 0.03"
            - "DealerOrder.${order2_id}.volume_discount_cents == 14697"
            - "DealerOrder.${order2_id}.freight_cents == 0"
            - "DealerOrder.${order2_id}.invoice_total_cents == 475203"
            - "DealerOrder.${order2_id}.floor_plan_draw_cents == 427683"
            - "Dealer.${dealer_id}.floor_plan_outstanding_cents == 949143"
            - "Dealer.${dealer_id}.allocations_ytd_count == 2"
      - name: warranty_parts_markup_rounds_per_line_before_quantity
        grounds:
          - calculations.warranty_reimbursement
          - entities.WarrantyClaim.fields.parts_subtotal_cents
