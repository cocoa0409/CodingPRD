# =============================================================================
# Pension / Defined-Benefit Plan Administration (PBGC) — benchmark seed tables
# =============================================================================

scenario: |
  Pension / Defined-Benefit Plan Administration (PBGC): participant census &
  service credit, benefit formula (final-avg-pay/cash-balance), vesting &
  accrual, retirement election & J&S annuity options, lump-sum window &
  relative-value, QDRO split, PBGC premium & 5500/AFTAP, payment setup & COLA

domain_name: pension-db-administration
api_prefix: /plans

# Difficulty target: EXPERT (10-15 entities, 20-32 endpoints, 18-30 errors,
# 3+ roles, 4+ state machines with cycles or parallel dimensions).
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation        # final-avg-pay vs cash-balance; APV vs annuity relative-value
    - posture_driven_gating           # AFTAP funded-status posture gates plan operations
    - cascading_side_effects          # QDRO split / election commencement cascade across benefit + payments
    - optimistic_concurrency          # OCC on PensionPlan.version for filing supersede

  entity_topology: hybrid
  # PensionPlan is a parent tree root (participants, filings, premiums nest under it),
  # but BenefitElection / QDRO / BenefitPayment cross-cut a single Participant with
  # flat FK references rather than deep nesting.

  state_machine_shape: parallel
  # Participant carries parallel employment_status × vesting_status axes; BenefitElection
  # and QDRO carry branching+cyclic (revision loop) machines; PensionPlan funding_posture
  # is posture_driven (derived from latest certified AFTAP).

  relationship_patterns:
    - one_to_many        # PensionPlan -> Participant, PlanYearFiling, PbgcPremiumFiling
    - cross_aggregate    # BenefitPayment references BenefitElection across the election aggregate
    - polymorphic        # QdroAward.alternate_payee_kind references SPOUSE | FORMER_SPOUSE | CHILD

  role_model: segregation_of_duties
  # PlanActuary certifies AFTAP/relative-value; BenefitsAdministrator drafts/approves
  # elections & payments; PlanSponsor funds & freezes; the same actor cannot both
  # submit and approve an election (segregation of duties).

  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: PensionPlan
    parent: null
    common_fields: true
    fields:
      - { name: plan_name, type: string, source: input, description: "Plan legal name" }
      - { name: ein_psn, type: string, source: input, description: "Employer EIN + plan number, unique across all plans" }
      - { name: benefit_formula_type, type: enum, source: input, description: "FINAL_AVERAGE_PAY | CASH_BALANCE — pins which benefit calculation variant the plan uses", constraints: "FINAL_AVERAGE_PAY | CASH_BALANCE" }
      - { name: normal_retirement_age, type: integer, source: input, default: 65, description: "NRA in whole years" }
      - { name: cola_pct, type: number, source: input, default: 0.0, description: "Annual cost-of-living adjustment fraction applied to in-pay benefits (e.g., 0.02 = 2%)" }
      - { name: fap_accrual_rate, type: number, source: input, description: "Final-average-pay benefit multiplier per year of service (e.g., 0.015). Ignored when benefit_formula_type=CASH_BALANCE" }
      - { name: cb_pay_credit_rate, type: number, source: input, description: "Cash-balance annual pay-credit fraction of comp (e.g., 0.05). Ignored when benefit_formula_type=FINAL_AVERAGE_PAY" }
      - { name: cb_interest_crediting_rate, type: number, source: input, description: "Cash-balance annual interest credit fraction (e.g., 0.04). Ignored when FINAL_AVERAGE_PAY" }
      - { name: funding_posture, type: enum, source: computed, description: "OPEN | RESTRICTED | FROZEN — derived from latest CERTIFIED PlanYearFiling.aftap_pct per the funding_posture calculation; OPEN when no certified filing", constraints: "OPEN | RESTRICTED | FROZEN" }
      - { name: latest_certified_filing_id, type: string, source: computed, description: "Computed pointer to the CERTIFIED PlanYearFiling with the greatest plan_year that drives funding_posture (null when none certified). Not a stored FK; discover certified filings via the filings list filtered by status." }
      - { name: status, type: enum, source: system, description: "ACTIVE | TERMINATING — plan termination lifecycle", constraints: "ACTIVE | TERMINATING" }

  - name: Participant
    parent: PensionPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> PensionPlan.id" }
      - { name: ssn_last4, type: string, source: input, description: "Last four of SSN, unique per plan" }
      - { name: date_of_birth, type: datetime, source: input, description: "ISO-8601 date of birth" }
      - { name: hire_date, type: datetime, source: input, description: "ISO-8601 original hire date; service credit accrues from here" }
      - { name: credited_service_years, type: number, source: computed, description: "Whole+fractional years of credited service from hire_date to termination/measurement, computed by the service_credit calculation" }
      - { name: final_average_pay_cents, type: integer, source: computed, description: "Average of highest-3 consecutive AnnualCompensation.gross_comp_cents (FAP plans); recomputed when compensation rows change" }
      - { name: cash_balance_account_cents, type: integer, source: computed, description: "Running cash-balance hypothetical account from pay credits + interest credits (CB plans)" }
      - { name: vesting_status, type: enum, source: computed, description: "UNVESTED | PARTIALLY_VESTED | FULLY_VESTED — derived from credited_service_years via the vesting calculation; independent axis from employment_status", constraints: "UNVESTED | PARTIALLY_VESTED | FULLY_VESTED" }
      - { name: vested_pct, type: number, source: computed, description: "Vested fraction (0.0..1.0) from the cliff/graded vesting schedule" }
      - { name: employment_status, type: enum, source: system, description: "ACTIVE | TERMINATED | RETIRED | DECEASED — employment lifecycle axis, independent of vesting_status", constraints: "ACTIVE | TERMINATED | RETIRED | DECEASED" }
      - { name: termination_date, type: datetime, source: system, description: "ISO-8601 date the participant terminated employment (null while ACTIVE)" }

  - name: AnnualCompensation
    parent: Participant
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id" }
      - { name: plan_year, type: integer, source: input, description: "Calendar plan year (e.g., 2021); unique per participant" }
      - { name: gross_comp_cents, type: integer, source: input, description: "Gross W-2 compensation for the year, in cents (capped at COMP_LIMIT_CENTS by the compensation calculation)" }
      - { name: capped_comp_cents, type: integer, source: computed, description: "min(gross_comp_cents, COMP_LIMIT_CENTS) — the recognized compensation used by benefit formulas" }

  - name: ServiceCreditAdjustment
    parent: Participant
    common_fields: false
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id" }
      - { name: adjustment_kind, type: enum, source: input, description: "MILITARY_BUYBACK | BREAK_IN_SERVICE | PRIOR_SERVICE_GRANT — reason for the credited-service change", constraints: "MILITARY_BUYBACK | BREAK_IN_SERVICE | PRIOR_SERVICE_GRANT" }
      - { name: delta_service_years, type: number, source: input, description: "Signed change to credited service in half-year increments (positive grant, negative break)" }
      - { name: applied, type: boolean, source: system, default: true, description: "Append-only event; always applied at creation, feeding the service_credit recompute" }

  - name: PlanYearFiling
    parent: PensionPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> PensionPlan.id" }
      - { name: plan_year, type: integer, source: input, description: "Plan year this 5500/AFTAP filing covers; unique per plan" }
      - { name: plan_assets_cents, type: integer, source: input, description: "Actuarial value of plan assets in cents" }
      - { name: funding_target_cents, type: integer, source: input, description: "Funding target (PV of accrued liabilities) in cents" }
      - { name: aftap_pct, type: number, source: computed, description: "Adjusted Funding Target Attainment Percentage = plan_assets_cents / funding_target_cents, rounded per the aftap calculation" }
      - { name: status, type: enum, source: system, description: "DRAFT | CERTIFIED | SUPERSEDED — actuary certification lifecycle", constraints: "DRAFT | CERTIFIED | SUPERSEDED" }

  - name: PbgcPremiumFiling
    parent: PensionPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> PensionPlan.id" }
      - { name: premium_year, type: integer, source: input, description: "Premium year; unique per plan" }
      - { name: participant_count, type: integer, source: input, description: "Headcount used for flat-rate premium" }
      - { name: unfunded_vested_benefits_cents, type: integer, source: input, description: "UVB = max(0, premium funding target - assets) used for variable-rate premium" }
      - { name: flat_rate_premium_cents, type: integer, source: computed, description: "participant_count * FLAT_RATE_PER_HEAD_CENTS" }
      - { name: variable_rate_premium_cents, type: integer, source: computed, description: "Variable-rate premium on UVB, subject to the per-participant cap; computed by the pbgc_premium calculation" }
      - { name: total_premium_cents, type: integer, source: computed, description: "flat_rate_premium_cents + variable_rate_premium_cents" }

  - name: BenefitElection
    parent: Participant
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id" }
      - { name: plan_id, type: string, source: system, description: "Denormalized owning-plan id, copied from the participant's plan_id (not an independently navigable FK; discover elections via the participant sub-resource list)" }
      - { name: payment_form, type: enum, source: input, description: "SINGLE_LIFE | JOINT_AND_SURVIVOR | LUMP_SUM — elected form of payment", constraints: "SINGLE_LIFE | JOINT_AND_SURVIVOR | LUMP_SUM" }
      - { name: js_survivor_pct, type: number, source: input, description: "Survivor continuation fraction for J&S forms (0.50 | 0.75 | 1.00); required when payment_form=JOINT_AND_SURVIVOR, ignored otherwise" }
      - { name: spouse_date_of_birth, type: datetime, source: input, description: "Contingent annuitant DOB; required for JOINT_AND_SURVIVOR" }
      - { name: annuity_start_date, type: datetime, source: input, description: "Elected benefit commencement date" }
      - { name: gross_accrued_monthly_cents, type: integer, source: computed, description: "Single-life accrued monthly benefit at annuity_start_date from the benefit_formula calculation (pre J&S reduction, pre QDRO)" }
      - { name: js_reduced_monthly_cents, type: integer, source: computed, description: "Monthly benefit after applying the J&S reduction factor (equals gross for SINGLE_LIFE)" }
      - { name: lump_sum_value_cents, type: integer, source: computed, description: "Actuarial present value of the single-life benefit for LUMP_SUM elections (0 for annuity forms), from the lump_sum_apv calculation" }
      - { name: relative_value_pct, type: number, source: computed, description: "lump_sum APV / SLA present value — the 417(e) relative-value ratio; populated for LUMP_SUM elections" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the BenefitsAdministrator who submitted (for segregation-of-duties on approval)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | SPOUSAL_CONSENT_PENDING | APPROVED | COMMENCED | REJECTED — election lifecycle with revision loop", constraints: "DRAFT | SUBMITTED | SPOUSAL_CONSENT_PENDING | APPROVED | COMMENCED | REJECTED" }

  - name: QdroAward
    parent: Participant
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id" }
      - { name: plan_id, type: string, source: system, description: "Denormalized owning-plan id, copied from the participant's plan_id (not an independently navigable FK; discover QDROs via the participant sub-resource list)" }
      - { name: alternate_payee_kind, type: enum, source: input, description: "SPOUSE | FORMER_SPOUSE | CHILD — polymorphic alternate-payee classification", constraints: "SPOUSE | FORMER_SPOUSE | CHILD" }
      - { name: split_method, type: enum, source: input, description: "PERCENTAGE | SHARED_INTEREST — separate-interest percentage split vs shared-interest fixed-amount split", constraints: "PERCENTAGE | SHARED_INTEREST" }
      - { name: award_pct, type: number, source: input, description: "Marital-share fraction (0.0..1.0); required when split_method=PERCENTAGE" }
      - { name: award_fixed_monthly_cents, type: integer, source: input, description: "Fixed monthly amount to alternate payee; required when split_method=SHARED_INTEREST" }
      - { name: alternate_payee_monthly_cents, type: integer, source: computed, description: "Monthly amount carved to the alternate payee by the qdro_split calculation" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | QUALIFIED | REJECTED — qualification lifecycle with amend loop", constraints: "DRAFT | SUBMITTED | QUALIFIED | REJECTED" }

  - name: BenefitPayment
    parent: BenefitElection
    common_fields: true
    fields:
      - { name: election_id, type: string, source: system, description: "FK -> BenefitElection.id" }
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id" }
      - { name: plan_id, type: string, source: system, description: "FK -> PensionPlan.id" }
      - { name: base_monthly_cents, type: integer, source: computed, description: "Net monthly to the participant at setup: js_reduced_monthly_cents minus QUALIFIED QdroAward carve-outs, from the payment_setup calculation" }
      - { name: current_monthly_cents, type: integer, source: computed, description: "base_monthly_cents grown by COLA across applied adjustments (see cola calculation)" }
      - { name: cola_applied_count, type: integer, source: system, default: 0, description: "Number of COLA increases applied so far" }
      - { name: status, type: enum, source: system, description: "PENDING_SETUP | IN_PAY | SUSPENDED | TERMINATED — payment lifecycle with suspend/resume cycle", constraints: "PENDING_SETUP | IN_PAY | SUSPENDED | TERMINATED" }

  - name: SpousalConsent
    parent: BenefitElection
    common_fields: false
    fields:
      - { name: election_id, type: string, source: system, description: "FK -> BenefitElection.id" }
      - { name: consenting_spouse_dob, type: datetime, source: input, description: "DOB of the consenting spouse, must match the election spouse_date_of_birth" }
      - { name: notary_reference, type: string, source: input, description: "Notarization reference string evidencing witnessed consent" }
      - { name: waives_qjsa, type: boolean, source: input, description: "True when the spouse waives the Qualified Joint & Survivor Annuity to permit a non-QJSA form" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  # ---- Participant: PARALLEL dimensions (employment_status × vesting_status) ----
  - entity: Participant
    initial_state: ACTIVE              # employment_status axis initial; vesting_status starts UNVESTED
    terminal_states: [DECEASED]
    note: |
      Two INDEPENDENT axes on the same row. employment_status: ACTIVE → TERMINATED →
      RETIRED → DECEASED (DECEASED reachable from any). vesting_status: UNVESTED →
      PARTIALLY_VESTED → FULLY_VESTED, recomputed by the vesting calculation whenever
      credited_service_years changes (compensation/service mutations), and NOT gated by
      employment_status — a TERMINATED participant may still be FULLY_VESTED, an ACTIVE
      one may still be UNVESTED.
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /plans/participants/{participantId}/terminate"
        actor: BenefitsAdministrator
        preconditions:
          - "employment_status == ACTIVE (else ERR_INVALID_STATE)"
          - "termination_date >= hire_date (else ERR_INVALID_REQUEST)"
        side_effects:
          - "set termination_date; freeze credited_service_years at termination measurement (service_credit calculation)"
          - "recompute vesting_status / vested_pct on the independent vesting axis (vesting calculation)"
          - "recompute final_average_pay_cents (FAP plans) using compensation through termination"

      - from: TERMINATED
        to: RETIRED
        trigger: "system: BenefitElection COMMENCED side-effect"
        actor: system
        preconditions:
          - "a BenefitElection for this participant transitioned to COMMENCED"
        side_effects:
          - "employment_status → RETIRED (vesting axis untouched)"

      - from: ACTIVE
        to: DECEASED
        trigger: "POST /plans/participants/{participantId}/record-death"
        actor: BenefitsAdministrator
        preconditions: []
        side_effects:
          - "any IN_PAY BenefitPayment for this participant → TERMINATED (cascade)"

      - from: TERMINATED
        to: DECEASED
        trigger: "POST /plans/participants/{participantId}/record-death"
        actor: BenefitsAdministrator
        preconditions: []
        side_effects:
          - "any IN_PAY BenefitPayment for this participant → TERMINATED (cascade)"

      - from: RETIRED
        to: DECEASED
        trigger: "POST /plans/participants/{participantId}/record-death"
        actor: BenefitsAdministrator
        preconditions: []
        side_effects:
          - "any IN_PAY BenefitPayment for this participant → TERMINATED (cascade)"

  # ---- BenefitElection: BRANCHING + CYCLIC (revision loop) ----
  - entity: BenefitElection
    initial_state: DRAFT
    terminal_states: [COMMENCED, REJECTED]
    note: |
      Branch on payment_form: JOINT_AND_SURVIVOR and LUMP_SUM require spousal consent
      and route SUBMITTED → SPOUSAL_CONSENT_PENDING → APPROVED; SINGLE_LIFE (the QJSA
      default) routes SUBMITTED → APPROVED directly. Revision loop: APPROVED → DRAFT
      lets an administrator re-open and revise, then resubmit (cycle).
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /plans/elections/{electionId}/submit"
        actor: BenefitsAdministrator
        preconditions:
          - "participant.employment_status == TERMINATED (else ERR_PARTICIPANT_NOT_ELIGIBLE)"
          - "participant.vesting_status == FULLY_VESTED (else ERR_PARTICIPANT_NOT_VESTED)"
          - "plan.funding_posture != FROZEN for LUMP_SUM payment_form (else ERR_FUNDING_RESTRICTED)"
          - "annuity_start_date implies attained age >= 55 (else ERR_BENEFIT_NOT_AVAILABLE)"
        side_effects:
          - "compute gross_accrued_monthly_cents (benefit_formula), js_reduced_monthly_cents (js_reduction)"
          - "for LUMP_SUM: compute lump_sum_value_cents (lump_sum_apv) and relative_value_pct"
          - "record submitted_by_user_id = X-User-ID"

      - from: SUBMITTED
        to: SPOUSAL_CONSENT_PENDING
        trigger: "system: automatic when payment_form in {JOINT_AND_SURVIVOR, LUMP_SUM}"
        actor: system
        preconditions:
          - "payment_form in {JOINT_AND_SURVIVOR, LUMP_SUM}"
        side_effects: []

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /plans/elections/{electionId}/approve"
        actor: BenefitsAdministrator
        preconditions:
          - "payment_form == SINGLE_LIFE (QJSA form needs no waiver)"
          - "X-User-ID != submitted_by_user_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []

      - from: SPOUSAL_CONSENT_PENDING
        to: APPROVED
        trigger: "POST /plans/elections/{electionId}/approve"
        actor: BenefitsAdministrator
        preconditions:
          - "a SpousalConsent exists for this election with waives_qjsa == true (else ERR_SPOUSAL_CONSENT_REQUIRED)"
          - "for LUMP_SUM: relative_value_pct >= RELATIVE_VALUE_FLOOR (else ERR_RELATIVE_VALUE_FAILED)"
          - "X-User-ID != submitted_by_user_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []

      - from: APPROVED
        to: COMMENCED
        trigger: "POST /plans/elections/{electionId}/commence"
        actor: BenefitsAdministrator
        preconditions:
          - "all QdroAward for the participant are QUALIFIED or REJECTED (no DRAFT/SUBMITTED pending; else ERR_QDRO_PENDING)"
          - "annuity_start_date <= current date is NOT required; commencement may be prospective"
        side_effects:
          - "create BenefitPayment in PENDING_SETUP with base_monthly_cents (payment_setup, nets QUALIFIED QDRO carve-outs)"
          - "participant.employment_status TERMINATED → RETIRED (cascade)"

      - from: APPROVED
        to: DRAFT
        trigger: "POST /plans/elections/{electionId}/reopen"
        actor: BenefitsAdministrator
        preconditions:
          - "no BenefitPayment has been created for this election (else ERR_INVALID_STATE)"
        side_effects:
          - "clear computed benefit fields; election may be resubmitted (revision cycle)"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /plans/elections/{electionId}/reject"
        actor: BenefitsAdministrator
        preconditions: []
        side_effects: []

      - from: SPOUSAL_CONSENT_PENDING
        to: REJECTED
        trigger: "POST /plans/elections/{electionId}/reject"
        actor: BenefitsAdministrator
        preconditions: []
        side_effects: []

  # ---- QdroAward: BRANCHING + CYCLIC (amend loop) ----
  - entity: QdroAward
    initial_state: DRAFT
    terminal_states: [QUALIFIED]
    note: |
      DRAFT → SUBMITTED → QUALIFIED on qualification, or SUBMITTED → REJECTED on defect;
      REJECTED → DRAFT amend loop lets the order be corrected and resubmitted (cycle).
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /plans/qdros/{qdroId}/submit"
        actor: BenefitsAdministrator
        preconditions:
          - "split_method==PERCENTAGE requires award_pct in (0,1] (else ERR_INVALID_REQUEST)"
          - "split_method==SHARED_INTEREST requires award_fixed_monthly_cents > 0 (else ERR_INVALID_REQUEST)"
        side_effects: []

      - from: SUBMITTED
        to: QUALIFIED
        trigger: "POST /plans/qdros/{qdroId}/qualify"
        actor: BenefitsAdministrator
        preconditions:
          - "no COMMENCED BenefitElection exists yet for the participant (else ERR_QDRO_TOO_LATE)"
          - "cumulative QUALIFIED award_pct + this award_pct <= 1.0 for PERCENTAGE (else ERR_QDRO_OVER_ALLOCATED)"
        side_effects:
          - "compute alternate_payee_monthly_cents (qdro_split)"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /plans/qdros/{qdroId}/reject"
        actor: BenefitsAdministrator
        preconditions: []
        side_effects: []

      - from: REJECTED
        to: DRAFT
        trigger: "POST /plans/qdros/{qdroId}/amend"
        actor: BenefitsAdministrator
        preconditions: []
        side_effects:
          - "clear alternate_payee_monthly_cents; order may be resubmitted (amend cycle)"

  # ---- PlanYearFiling: certification + supersede ----
  - entity: PlanYearFiling
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /plans/filings/{filingId}/certify"
        actor: PlanActuary
        preconditions:
          - "funding_target_cents > 0 (else ERR_INVALID_REQUEST)"
          - "expected_plan_version matches PensionPlan.version (OCC; else ERR_STALE_VERSION)"
        side_effects:
          - "compute aftap_pct (aftap)"
          - "recompute plan.funding_posture from this and prior certified filings (funding_posture)"
          - "set plan.latest_certified_filing_id when this filing has the greatest plan_year among CERTIFIED"
          - "increment PensionPlan.version by 1"

      - from: CERTIFIED
        to: SUPERSEDED
        trigger: "system: a later certify for a >= plan_year supersedes this CERTIFIED filing"
        actor: system
        preconditions:
          - "a newly CERTIFIED filing has plan_year >= this filing's plan_year"
        side_effects:
          - "plan.funding_posture re-derived from the superseding filing (funding_posture)"

  # ---- BenefitPayment: SUSPEND/RESUME CYCLE ----
  - entity: BenefitPayment
    initial_state: PENDING_SETUP
    terminal_states: [TERMINATED]
    note: |
      PENDING_SETUP → IN_PAY on setup; IN_PAY ⇄ SUSPENDED suspend/resume cycle; COLA
      may be applied only while IN_PAY; DECEASED participant or plan termination drives
      IN_PAY/SUSPENDED → TERMINATED.
    transitions:
      - from: PENDING_SETUP
        to: IN_PAY
        trigger: "POST /plans/payments/{paymentId}/activate"
        actor: BenefitsAdministrator
        preconditions:
          - "election.status == COMMENCED (else ERR_INVALID_STATE)"
          - "participant.employment_status == RETIRED (else ERR_PARTICIPANT_NOT_ELIGIBLE)"
        side_effects:
          - "current_monthly_cents = base_monthly_cents"

      - from: IN_PAY
        to: SUSPENDED
        trigger: "POST /plans/payments/{paymentId}/suspend"
        actor: BenefitsAdministrator
        preconditions: []
        side_effects: []

      - from: SUSPENDED
        to: IN_PAY
        trigger: "POST /plans/payments/{paymentId}/resume"
        actor: BenefitsAdministrator
        preconditions: []
        side_effects: []

      - from: IN_PAY
        to: IN_PAY
        trigger: "POST /plans/payments/{paymentId}/apply-cola"
        actor: BenefitsAdministrator
        preconditions:
          - "status == IN_PAY (else ERR_INVALID_STATE)"
          - "plan.cola_pct > 0 (else ERR_NO_COLA_CONFIGURED)"
        side_effects:
          - "current_monthly_cents grown by cola (cola calculation); cola_applied_count += 1"

      - from: IN_PAY
        to: TERMINATED
        trigger: "system: participant DECEASED cascade OR plan TERMINATING cascade"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUSPENDED
        to: TERMINATED
        trigger: "system: participant DECEASED cascade OR plan TERMINATING cascade"
        actor: system
        preconditions: []
        side_effects: []

  # ---- PensionPlan: termination lifecycle ----
  - entity: PensionPlan
    initial_state: ACTIVE
    terminal_states: [TERMINATING]
    transitions:
      - from: ACTIVE
        to: TERMINATING
        trigger: "POST /plans/{planId}/terminate"
        actor: PlanSponsor
        preconditions:
          - "funding_posture != RESTRICTED (a RESTRICTED plan cannot be voluntarily standard-terminated; else ERR_FUNDING_RESTRICTED)"
        side_effects:
          - "no new BenefitElection may be submitted (enforced by validation)"
          - "cascade: every IN_PAY or SUSPENDED BenefitPayment under the plan → TERMINATED"

# =============================================================================
# Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: filing-certify-stale-plan
    parent_entity: PensionPlan
    write_endpoint: "POST /plans/{planId}/filings/{filingId}/certify"
    occ_field: "expected_plan_version"
    description: |
      Certifying a PlanYearFiling against a PensionPlan whose version has advanced
      since the actuary last observed it is rejected. This captures the case where
      another certify already ran (which legitimately supersedes prior filings and
      re-derives funding_posture under the funding_posture calculation), so the
      current actuary's view of the plan — and of which filing is latest_certified —
      is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: service_credit
    trigger: "participant create; terminate transition; compensation row add; service-credit adjustment add"
    algorithm: chronological
    formula: |
      measurement_date = termination_date if employment_status==TERMINATED else MEASUREMENT_DATE_CONST
      raw_years = (measurement_date - hire_date) in days / 365.25
      elapsed = floor(raw_years * 2) / 2                       # elapsed service, rounded DOWN to nearest half-year
      adj = sum(delta_service_years over ServiceCreditAdjustment for participant)   # signed half-year deltas
      credited_service_years = max(0, elapsed + adj)
    input_set: "hire_date through measurement_date plus all ServiceCreditAdjustment deltas; service is frozen at termination_date once TERMINATED, but adjustments still apply"
    constants:
      MEASUREMENT_DATE_CONST: "2025-01-01"   # the system 'as-of' date for active participants
    precision: "half-year increments, round_down on elapsed; deltas added after rounding; floor at 0"

  - name: vesting
    trigger: "service_credit recompute (participant create, terminate, compensation add)"
    algorithm: threshold
    formula: |
      y = credited_service_years
      # 3-to-7 graded vesting schedule
      if y < 3:        vested_pct = 0.00 ; vesting_status = UNVESTED
      elif y < 7:      vested_pct = 0.20 * (floor(y) - 2) ; vesting_status = PARTIALLY_VESTED
      else:            vested_pct = 1.00 ; vesting_status = FULLY_VESTED
    input_set: "credited_service_years of this participant only"
    constants:
      CLIFF_YEARS: 3
      FULL_VEST_YEARS: 7
    precision: "vested_pct to 2 decimals"

  - name: compensation
    trigger: "AnnualCompensation create"
    algorithm: threshold
    formula: |
      capped_comp_cents = min(gross_comp_cents, COMP_LIMIT_CENTS)
    input_set: "the single AnnualCompensation row"
    constants:
      COMP_LIMIT_CENTS: 33000000   # $330,000 IRC 401(a)(17) annual compensation limit
    precision: "integer cents"

  - name: benefit_formula
    trigger: "election submit transition"
    algorithm: dual_variant
    formula: |
      # DUAL VARIANT keyed on plan.benefit_formula_type
      if plan.benefit_formula_type == FINAL_AVERAGE_PAY:
        # final_average_pay = mean of highest-3 consecutive capped_comp years; if <3 rows, mean of all
        gross_accrued_monthly_cents =
          round( final_average_pay_cents * fap_accrual_rate * credited_service_years * vested_pct / 12 )
      else:  # CASH_BALANCE
        # cash_balance_account = sum over years of (capped_comp*pay_credit) then interest-credited forward to ASD
        # annuitize the vested account at the plan annuity conversion factor
        gross_accrued_monthly_cents =
          round( cash_balance_account_cents * vested_pct / ANNUITY_CONVERSION_FACTOR / 12 )
    input_set: "participant's capped compensation rows and credited_service_years; vested_pct"
    constants:
      ANNUITY_CONVERSION_FACTOR: 12.0   # CB account -> annual annuity divisor (account/12 = annual annuity)
    precision: "integer cents, round_half_up"
    variants:
      - name: final_average_pay
        when: "plan.benefit_formula_type == FINAL_AVERAGE_PAY"
        difference: "monthly = FAP * accrual_rate * service * vested_pct / 12"
      - name: cash_balance
        when: "plan.benefit_formula_type == CASH_BALANCE"
        difference: "monthly = vested account annuitized via ANNUITY_CONVERSION_FACTOR / 12"

  - name: final_average_pay
    trigger: "compensation row add; election submit (FAP plans)"
    algorithm: aggregation
    formula: |
      rows = AnnualCompensation for participant, sorted by plan_year ASC
      if count(rows) >= 3:
        # highest sum of any 3 CONSECUTIVE plan_years by capped_comp_cents
        best = max over consecutive windows of length 3 of sum(capped_comp_cents)
        # tie-break: earliest starting plan_year window
        final_average_pay_cents = round(best / 3)
      else:
        final_average_pay_cents = round(sum(capped_comp_cents) / count(rows))   # all rows when <3
    input_set: "all AnnualCompensation rows of the participant (capped_comp_cents)"
    constants: {}
    precision: "integer cents, round_half_up; window tie-break earliest plan_year"

  - name: js_reduction
    trigger: "election submit transition"
    algorithm: weighted_scoring
    formula: |
      if payment_form == SINGLE_LIFE or payment_form == LUMP_SUM:
        js_reduced_monthly_cents = gross_accrued_monthly_cents
      else:  # JOINT_AND_SURVIVOR
        # ages are attained WHOLE years at annuity_start_date
        age_diff = participant_whole_age_at_ASD - spouse_whole_age_at_ASD   # may be negative
        factor = BASE_JS_FACTOR - (js_survivor_pct * SURVIVOR_LOAD) - (age_diff * AGE_DIFF_LOAD)
        factor = clamp(factor, FACTOR_FLOOR, 1.0)
        js_reduced_monthly_cents = round(gross_accrued_monthly_cents * factor)
    input_set: "gross_accrued_monthly_cents, js_survivor_pct, participant & spouse attained whole-year ages at annuity_start_date"
    constants:
      BASE_JS_FACTOR: 1.00
      SURVIVOR_LOAD: 0.12     # per unit of survivor pct (0.50 -> 0.06 reduction)
      AGE_DIFF_LOAD: 0.005    # per year participant older than spouse
      FACTOR_FLOOR: 0.70
    precision: "integer cents, round_half_up; factor clamped to [0.70, 1.00]"

  - name: lump_sum_apv
    trigger: "election submit transition (LUMP_SUM only)"
    algorithm: dual_variant
    formula: |
      # Two PVs of the same single-life monthly benefit on two different bases.
      annual = gross_accrued_monthly_cents * 12
      # (1) SLA comparator: plan funding annuity basis — a single constant factor.
      sla_pv_cents = round(annual * SLA_ANNUITY_FACTOR)
      # (2) Lump sum: 417(e) segment-rate basis — factor selected by attained-age band
      #     at annuity_start_date (younger commencement -> lower segment factor).
      age = attained whole years at annuity_start_date
      if age >= 65:        ls_factor = SEGMENT_FACTOR_65_PLUS
      elif age >= 60:      ls_factor = SEGMENT_FACTOR_60_64
      else:                ls_factor = SEGMENT_FACTOR_55_59   # 55..59
      lump_sum_value_cents = round(annual * ls_factor)
      relative_value_pct = round(lump_sum_value_cents / sla_pv_cents, 4)
    input_set: "gross_accrued_monthly_cents and participant attained age (years) at annuity_start_date"
    constants:
      SLA_ANNUITY_FACTOR: 12.5         # PV of $1/yr straight-life annuity (plan basis)
      SEGMENT_FACTOR_65_PLUS: 12.4     # 417(e) factor at/after NRA
      SEGMENT_FACTOR_60_64: 11.9       # 417(e) factor ages 60-64
      SEGMENT_FACTOR_55_59: 10.8       # 417(e) factor ages 55-59 (drives relative value below floor)
    precision: "integer cents, round_half_up; relative_value_pct to 4 decimals"
    variants:
      - name: sla_present_value
        when: "computing the annuity comparator"
        difference: "single SLA_ANNUITY_FACTOR (plan funding annuity basis), age-independent"
      - name: lump_sum_present_value
        when: "computing the cash-out amount"
        difference: "age-banded 417(e) SEGMENT_FACTOR_*; for ages 55-59 the relative value (~0.864) falls below RELATIVE_VALUE_FLOOR, failing the 417(e) relative-value test"

  - name: qdro_split
    trigger: "qdro qualify transition; payment_setup"
    algorithm: waterfall_allocation
    formula: |
      base = election.js_reduced_monthly_cents
      # QUALIFIED awards applied in order of QdroAward.created_at ASC (NEVER id)
      remaining = base
      for award in QUALIFIED awards sorted by created_at ASC:
        if award.split_method == PERCENTAGE:
          carve = round(base * award.award_pct)             # pct of ORIGINAL base, not remaining
        else:  # SHARED_INTEREST
          carve = min(award.award_fixed_monthly_cents, remaining)
        award.alternate_payee_monthly_cents = carve
        remaining = remaining - carve
      # remaining is the participant net used by payment_setup
    input_set: "QUALIFIED QdroAwards for the participant; election.js_reduced_monthly_cents"
    constants: {}
    precision: "integer cents, round_half_up; allocation order created_at ASC, tie-break created_at then plan_year"

  - name: payment_setup
    trigger: "election commence transition"
    algorithm: aggregation
    formula: |
      base_monthly_cents = election.js_reduced_monthly_cents
                           - sum(alternate_payee_monthly_cents of QUALIFIED QdroAwards for participant)
      base_monthly_cents = max(0, base_monthly_cents)
    input_set: "election.js_reduced_monthly_cents minus QUALIFIED QDRO carve-outs"
    constants: {}
    precision: "integer cents, floor at 0"

  - name: cola
    trigger: "payment apply-cola transition"
    algorithm: decay_function
    formula: |
      # compound COLA on current_monthly_cents
      current_monthly_cents = round(current_monthly_cents * (1 + plan.cola_pct))
      cola_applied_count += 1
    input_set: "current_monthly_cents, plan.cola_pct"
    constants: {}
    precision: "integer cents, round_half_up; compounded per application"

  - name: aftap
    trigger: "filing certify transition"
    algorithm: threshold
    formula: |
      aftap_pct = round(plan_assets_cents / funding_target_cents, 4)
    input_set: "the filing's plan_assets_cents and funding_target_cents"
    constants: {}
    precision: "ratio to 4 decimals"

  - name: funding_posture
    trigger: "filing certify / supersede transition"
    algorithm: threshold
    formula: |
      # driven by the CERTIFIED filing with the greatest plan_year (latest_certified_filing_id)
      a = latest_certified_filing.aftap_pct   (OPEN when no certified filing)
      if a is null:        funding_posture = OPEN
      elif a >= 0.80:      funding_posture = OPEN
      elif a >= 0.60:      funding_posture = RESTRICTED   # benefit restrictions; lump sums limited
      else:                funding_posture = FROZEN        # accruals/lump sums frozen
    input_set: "aftap_pct of the latest CERTIFIED PlanYearFiling (greatest plan_year; tie-break greatest created_at)"
    constants:
      RESTRICTED_FLOOR: 0.60
      OPEN_FLOOR: 0.80
    precision: "exact threshold compare; >= boundaries"

  - name: pbgc_premium
    trigger: "premium filing create / file"
    algorithm: tiered_pricing
    formula: |
      flat_rate_premium_cents = participant_count * FLAT_RATE_PER_HEAD_CENTS
      raw_variable = round(unfunded_vested_benefits_cents * VARIABLE_RATE)   # rate per $ of UVB
      per_participant_cap = participant_count * VARIABLE_CAP_PER_HEAD_CENTS
      variable_rate_premium_cents = min(raw_variable, per_participant_cap)   # statutory cap
      total_premium_cents = flat_rate_premium_cents + variable_rate_premium_cents
    input_set: "participant_count, unfunded_vested_benefits_cents on the filing"
    constants:
      FLAT_RATE_PER_HEAD_CENTS: 10100      # $101 per participant flat-rate
      VARIABLE_RATE: 0.0052                # $52 per $10,000 UVB
      VARIABLE_CAP_PER_HEAD_CENTS: 65200   # $652 per-participant variable-rate cap
    precision: "integer cents, round_half_up; cap applied AFTER rate, never before"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-referenced resources exist, validated left-to-right (plan before participant before child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, amounts non-negative, dates ISO-8601"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 5
    category: business_constraint
    check: "Per-parent uniqueness: PensionPlan.ein_psn global; Participant.ssn_last4 per plan; AnnualCompensation.plan_year per participant; PlanYearFiling.plan_year per plan; PbgcPremiumFiling.premium_year per plan"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST create endpoints"

  - priority: 6
    category: state
    check: "Target resource in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 7
    category: business_referential
    check: "Cross-entity gating: election submit requires participant TERMINATED & FULLY_VESTED; payment activate requires election COMMENCED & participant RETIRED; qdro qualify requires no COMMENCED election yet"
    error_id: ERR_PARTICIPANT_NOT_ELIGIBLE
    http_status: 409
    applies_to: "election submit, payment activate"

  - priority: 8
    category: business_safety
    check: "Vesting gate: election submit requires participant.vesting_status == FULLY_VESTED"
    error_id: ERR_PARTICIPANT_NOT_VESTED
    http_status: 409
    applies_to: "election submit"

  - priority: 9
    category: business_safety
    check: "Segregation of duties: the approver's X-User-ID must differ from the election's submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "election approve"

  - priority: 10
    category: business_safety
    check: "Funding gate: when plan.funding_posture == FROZEN, LUMP_SUM elections cannot be submitted; a RESTRICTED plan cannot be voluntarily terminated"
    error_id: ERR_FUNDING_RESTRICTED
    http_status: 409
    applies_to: "election submit (LUMP_SUM), plan terminate"

  - priority: 11
    category: business_safety
    check: "Spousal consent gate: approving a JOINT_AND_SURVIVOR or LUMP_SUM election from SPOUSAL_CONSENT_PENDING requires a SpousalConsent with waives_qjsa == true"
    error_id: ERR_SPOUSAL_CONSENT_REQUIRED
    http_status: 409
    applies_to: "election approve"

  - priority: 12
    category: business_safety
    check: "Relative-value gate: a LUMP_SUM election approval requires relative_value_pct >= RELATIVE_VALUE_FLOOR (0.95)"
    error_id: ERR_RELATIVE_VALUE_FAILED
    http_status: 409
    applies_to: "election approve (LUMP_SUM)"

  - priority: 13
    category: business_constraint
    check: "QDRO timing & allocation: an award cannot qualify after a COMMENCED election (ERR_QDRO_TOO_LATE); cumulative QUALIFIED award_pct cannot exceed 1.0 (ERR_QDRO_OVER_ALLOCATED); commencement requires no DRAFT/SUBMITTED QDRO pending (ERR_QDRO_PENDING)"
    error_id: ERR_QDRO_OVER_ALLOCATED
    http_status: 409
    applies_to: "qdro qualify, election commence"

  - priority: 14
    category: business_temporal
    check: "Benefit availability: annuity_start_date must imply attained age >= EARLY_RETIREMENT_AGE (55)"
    error_id: ERR_BENEFIT_NOT_AVAILABLE
    http_status: 409
    applies_to: "election submit"

  - priority: 15
    category: business_constraint
    check: "COLA availability: apply-cola requires plan.cola_pct > 0"
    error_id: ERR_NO_COLA_CONFIGURED
    http_status: 409
    applies_to: "payment apply-cola"

  - priority: 16
    category: state
    check: "OCC: certify carries expected_plan_version equal to PensionPlan.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "filing certify"

# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- PensionPlan (root; flat collections live under the /plans namespace) ----
  - method: POST
    path: "/plans"
    description: "Create a pension plan"
    roles: [PlanSponsor]
    code: 201
    input: [plan_name, ein_psn, benefit_formula_type, "normal_retirement_age?", "cola_pct?", "fap_accrual_rate?", "cb_pay_credit_rate?", "cb_interest_crediting_rate?"]
    output: PensionPlan
    side_effects: ["status=ACTIVE, funding_posture=OPEN (no certified filing), version=1"]

  - method: GET
    path: "/plans/{planId}"
    description: "Get a pension plan"
    roles: [PlanSponsor, PlanActuary, BenefitsAdministrator]
    code: 200
    input: []
    output: PensionPlan
    side_effects: []

  - method: POST
    path: "/plans/{planId}/terminate"
    description: "Begin standard plan termination"
    roles: [PlanSponsor]
    code: 200
    input: []
    output: PensionPlan
    side_effects: ["status → TERMINATING (ERR_FUNDING_RESTRICTED when posture RESTRICTED)"]

  # ---- Participant ----
  - method: POST
    path: "/plans/participants"
    description: "Add a participant to the census"
    roles: [BenefitsAdministrator]
    code: 201
    input: [plan_id, ssn_last4, date_of_birth, hire_date]
    output: Participant
    side_effects: ["employment_status=ACTIVE; compute credited_service_years (service_credit), vesting_status (vesting)"]

  - method: GET
    path: "/plans/participants/{participantId}"
    description: "Get a participant"
    roles: [PlanSponsor, PlanActuary, BenefitsAdministrator]
    code: 200
    input: []
    output: Participant
    side_effects: []

  - method: GET
    path: "/plans/participants"
    description: "List participants (filter by plan_id for reverse-reachability of Participant.plan_id)"
    roles: [PlanSponsor, PlanActuary, BenefitsAdministrator]
    code: 200
    input: ["plan_id?", "employment_status?", "vesting_status?"]
    output: "Participant[]"
    side_effects: []

  - method: POST
    path: "/plans/participants/{participantId}/terminate"
    description: "Record employment termination"
    roles: [BenefitsAdministrator]
    code: 200
    input: [termination_date]
    output: Participant
    side_effects: ["employment_status → TERMINATED; freeze service_credit; recompute vesting, final_average_pay"]

  - method: POST
    path: "/plans/participants/{participantId}/record-death"
    description: "Record participant death"
    roles: [BenefitsAdministrator]
    code: 200
    input: []
    output: Participant
    side_effects: ["employment_status → DECEASED; cascade IN_PAY/SUSPENDED BenefitPayment → TERMINATED"]

  # ---- AnnualCompensation ----
  - method: POST
    path: "/plans/compensation"
    description: "Add an annual compensation record"
    roles: [BenefitsAdministrator]
    code: 201
    input: [participant_id, plan_year, gross_comp_cents]
    output: AnnualCompensation
    side_effects: ["compute capped_comp_cents (compensation); recompute participant final_average_pay / cash_balance_account"]

  - method: GET
    path: "/plans/participants/{id}/compensation"
    description: "List a participant's compensation rows (sub-resource reverse-reachability for AnnualCompensation.participant_id)"
    roles: [PlanSponsor, PlanActuary, BenefitsAdministrator]
    code: 200
    input: []
    output: "AnnualCompensation[]"
    side_effects: []

  # ---- ServiceCreditAdjustment (append-only) ----
  - method: POST
    path: "/plans/service-adjustments"
    description: "Record a credited-service adjustment (buyback / break / prior-service grant)"
    roles: [BenefitsAdministrator]
    code: 201
    input: [participant_id, adjustment_kind, delta_service_years]
    output: ServiceCreditAdjustment
    side_effects: ["recompute participant credited_service_years (service_credit) then vesting_status (vesting)"]

  - method: GET
    path: "/plans/participants/{id}/service-adjustments"
    description: "List a participant's service-credit adjustments (sub-resource reverse-reachability for ServiceCreditAdjustment.participant_id)"
    roles: [PlanSponsor, PlanActuary, BenefitsAdministrator]
    code: 200
    input: []
    output: "ServiceCreditAdjustment[]"
    side_effects: []

  # ---- PlanYearFiling (5500 / AFTAP) ----
  - method: POST
    path: "/plans/filings"
    description: "Create a 5500/AFTAP draft filing"
    roles: [PlanActuary]
    code: 201
    input: [plan_id, plan_year, plan_assets_cents, funding_target_cents]
    output: PlanYearFiling
    side_effects: ["status=DRAFT; aftap_pct computed (aftap)"]

  - method: GET
    path: "/plans/filings/{filingId}"
    description: "Get a plan-year filing"
    roles: [PlanSponsor, PlanActuary, BenefitsAdministrator]
    code: 200
    input: []
    output: PlanYearFiling
    side_effects: []

  - method: GET
    path: "/plans/filings"
    description: "List plan-year filings (filter by plan_id for reverse-reachability of PlanYearFiling.plan_id)"
    roles: [PlanSponsor, PlanActuary, BenefitsAdministrator]
    code: 200
    input: ["plan_id?", "status?"]
    output: "PlanYearFiling[]"
    side_effects: []

  - method: POST
    path: "/plans/filings/{filingId}/certify"
    description: "Actuary certifies the filing (OCC on plan.version)"
    roles: [PlanActuary]
    code: 200
    input: [expected_plan_version]
    output: PlanYearFiling
    side_effects:
      - "status → CERTIFIED; compute aftap_pct (aftap)"
      - "re-derive plan.funding_posture (funding_posture); set plan.latest_certified_filing_id"
      - "supersede prior CERTIFIED filing of <= plan_year"
      - "increment PensionPlan.version by 1"

  # ---- PbgcPremiumFiling ----
  - method: POST
    path: "/plans/premiums"
    description: "Create a PBGC premium filing draft"
    roles: [PlanActuary, PlanSponsor]
    code: 201
    input: [plan_id, premium_year, participant_count, unfunded_vested_benefits_cents]
    output: PbgcPremiumFiling
    side_effects: ["compute flat_rate/variable_rate/total premium (pbgc_premium)"]

  - method: GET
    path: "/plans/premiums/{premiumId}"
    description: "Get a PBGC premium filing"
    roles: [PlanSponsor, PlanActuary, BenefitsAdministrator]
    code: 200
    input: []
    output: PbgcPremiumFiling
    side_effects: []

  - method: GET
    path: "/plans/premiums"
    description: "List PBGC premium filings (filter by plan_id for reverse-reachability of PbgcPremiumFiling.plan_id)"
    roles: [PlanSponsor, PlanActuary, BenefitsAdministrator]
    code: 200
    input: ["plan_id?", "premium_year?"]
    output: "PbgcPremiumFiling[]"
    side_effects: []

  # ---- BenefitElection ----
  - method: POST
    path: "/plans/elections"
    description: "Draft a retirement benefit election"
    roles: [BenefitsAdministrator]
    code: 201
    input: [participant_id, payment_form, annuity_start_date, "js_survivor_pct?", "spouse_date_of_birth?"]
    output: BenefitElection
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/plans/elections/{electionId}"
    description: "Get a benefit election"
    roles: [PlanSponsor, PlanActuary, BenefitsAdministrator]
    code: 200
    input: []
    output: BenefitElection
    side_effects: []

  - method: GET
    path: "/plans/participants/{id}/elections"
    description: "List a participant's elections (sub-resource reverse-reachability for BenefitElection.participant_id)"
    roles: [PlanSponsor, PlanActuary, BenefitsAdministrator]
    code: 200
    input: ["status?"]
    output: "BenefitElection[]"
    side_effects: []

  - method: POST
    path: "/plans/elections/{electionId}/submit"
    description: "Submit the election for review (computes benefit, J&S, lump-sum APV)"
    roles: [BenefitsAdministrator]
    code: 200
    input: []
    output: BenefitElection
    side_effects:
      - "status → SUBMITTED then auto SPOUSAL_CONSENT_PENDING for J&S/LUMP_SUM"
      - "compute gross_accrued_monthly_cents (benefit_formula), js_reduced_monthly_cents (js_reduction)"
      - "compute lump_sum_value_cents and relative_value_pct (lump_sum_apv) for LUMP_SUM"
      - "record submitted_by_user_id"

  - method: POST
    path: "/plans/elections/{electionId}/approve"
    description: "Approve the election (segregation of duties enforced)"
    roles: [BenefitsAdministrator]
    code: 200
    input: []
    output: BenefitElection
    side_effects: ["status → APPROVED"]

  - method: POST
    path: "/plans/elections/{electionId}/reject"
    description: "Reject the election"
    roles: [BenefitsAdministrator]
    code: 200
    input: []
    output: BenefitElection
    side_effects: ["status → REJECTED"]

  - method: POST
    path: "/plans/elections/{electionId}/reopen"
    description: "Re-open an APPROVED election for revision (revision cycle)"
    roles: [BenefitsAdministrator]
    code: 200
    input: []
    output: BenefitElection
    side_effects: ["status APPROVED → DRAFT; clear computed benefit fields"]

  - method: POST
    path: "/plans/elections/{electionId}/commence"
    description: "Commence the benefit (creates payment, retires participant)"
    roles: [BenefitsAdministrator]
    code: 200
    input: []
    output: BenefitElection
    side_effects:
      - "status → COMMENCED"
      - "create BenefitPayment in PENDING_SETUP with base_monthly_cents (payment_setup)"
      - "participant.employment_status TERMINATED → RETIRED (cascade)"

  - method: POST
    path: "/plans/elections/{electionId}/spousal-consent"
    description: "Record a notarized spousal consent for a J&S/LUMP_SUM election"
    roles: [BenefitsAdministrator]
    code: 201
    input: [consenting_spouse_dob, notary_reference, waives_qjsa]
    output: SpousalConsent
    side_effects: ["SpousalConsent created and linked to the election"]

  - method: GET
    path: "/plans/elections/{id}/spousal-consent"
    description: "List spousal consents for an election (sub-resource reverse-reachability for SpousalConsent.election_id)"
    roles: [PlanSponsor, PlanActuary, BenefitsAdministrator]
    code: 200
    input: []
    output: "SpousalConsent[]"
    side_effects: []

  # ---- QdroAward ----
  - method: POST
    path: "/plans/qdros"
    description: "Draft a QDRO award against a participant's benefit"
    roles: [BenefitsAdministrator]
    code: 201
    input: [participant_id, alternate_payee_kind, split_method, "award_pct?", "award_fixed_monthly_cents?"]
    output: QdroAward
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/plans/participants/{id}/qdros"
    description: "List a participant's QDRO awards (sub-resource reverse-reachability for QdroAward.participant_id)"
    roles: [PlanSponsor, PlanActuary, BenefitsAdministrator]
    code: 200
    input: ["status?"]
    output: "QdroAward[]"
    side_effects: []

  - method: POST
    path: "/plans/qdros/{qdroId}/submit"
    description: "Submit a QDRO for qualification review"
    roles: [BenefitsAdministrator]
    code: 200
    input: []
    output: QdroAward
    side_effects: ["status → SUBMITTED"]

  - method: POST
    path: "/plans/qdros/{qdroId}/qualify"
    description: "Qualify the QDRO (computes alternate-payee carve-out)"
    roles: [BenefitsAdministrator]
    code: 200
    input: []
    output: QdroAward
    side_effects: ["status → QUALIFIED; compute alternate_payee_monthly_cents (qdro_split)"]

  - method: POST
    path: "/plans/qdros/{qdroId}/reject"
    description: "Reject the QDRO as defective"
    roles: [BenefitsAdministrator]
    code: 200
    input: []
    output: QdroAward
    side_effects: ["status → REJECTED"]

  - method: POST
    path: "/plans/qdros/{qdroId}/amend"
    description: "Re-open a REJECTED QDRO for amendment (amend cycle)"
    roles: [BenefitsAdministrator]
    code: 200
    input: []
    output: QdroAward
    side_effects: ["status REJECTED → DRAFT; clear alternate_payee_monthly_cents"]

  # ---- BenefitPayment ----
  - method: GET
    path: "/plans/payments/{paymentId}"
    description: "Get a benefit payment"
    roles: [PlanSponsor, PlanActuary, BenefitsAdministrator]
    code: 200
    input: []
    output: BenefitPayment
    side_effects: []

  - method: GET
    path: "/plans/payments"
    description: "List benefit payments (filter by election_id / participant_id / plan_id for reverse-reachability of BenefitPayment.election_id, .participant_id, .plan_id)"
    roles: [PlanSponsor, PlanActuary, BenefitsAdministrator]
    code: 200
    input: ["election_id?", "participant_id?", "plan_id?", "status?"]
    output: "BenefitPayment[]"
    side_effects: []

  - method: POST
    path: "/plans/payments/{paymentId}/activate"
    description: "Activate a pending payment (begin pay)"
    roles: [BenefitsAdministrator]
    code: 200
    input: []
    output: BenefitPayment
    side_effects: ["status → IN_PAY; current_monthly_cents = base_monthly_cents"]

  - method: POST
    path: "/plans/payments/{paymentId}/suspend"
    description: "Suspend an in-pay benefit"
    roles: [BenefitsAdministrator]
    code: 200
    input: []
    output: BenefitPayment
    side_effects: ["status → SUSPENDED"]

  - method: POST
    path: "/plans/payments/{paymentId}/resume"
    description: "Resume a suspended benefit"
    roles: [BenefitsAdministrator]
    code: 200
    input: []
    output: BenefitPayment
    side_effects: ["status → IN_PAY"]

  - method: POST
    path: "/plans/payments/{paymentId}/apply-cola"
    description: "Apply one COLA increase to an in-pay benefit"
    roles: [BenefitsAdministrator]
    code: 200
    input: []
    output: BenefitPayment
    side_effects: ["current_monthly_cents grown by cola; cola_applied_count += 1"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing or malformed"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Caller's role is not permitted for this endpoint"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path-referenced resource does not exist (validated left-to-right)"

  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Malformed body: missing required field, invalid enum, negative amount, bad date, or split_method/payment_form field mismatch"

  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "Uniqueness violation (ein_psn, ssn_last4 per plan, plan_year per participant/plan, premium_year per plan)"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource not in a state from which the requested transition is defined"

  - id: ERR_PARTICIPANT_NOT_ELIGIBLE
    http: 409
    condition: "Cross-entity eligibility unmet: election submit needs TERMINATED participant; payment activate needs RETIRED participant / COMMENCED election"

  - id: ERR_PARTICIPANT_NOT_VESTED
    http: 409
    condition: "Election submit attempted for a participant whose vesting_status is not FULLY_VESTED"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "Election approver's X-User-ID equals the submitter's submitted_by_user_id"

  - id: ERR_FUNDING_RESTRICTED
    http: 409
    condition: "Plan funding_posture blocks the action: FROZEN blocks LUMP_SUM submit; RESTRICTED blocks voluntary plan termination"

  - id: ERR_SPOUSAL_CONSENT_REQUIRED
    http: 409
    condition: "Approving a J&S/LUMP_SUM election with no SpousalConsent waiving QJSA"

  - id: ERR_RELATIVE_VALUE_FAILED
    http: 409
    condition: "LUMP_SUM election relative_value_pct is below RELATIVE_VALUE_FLOOR (0.95)"

  - id: ERR_QDRO_TOO_LATE
    http: 409
    condition: "QDRO qualify attempted after a COMMENCED election exists for the participant"

  - id: ERR_QDRO_OVER_ALLOCATED
    http: 409
    condition: "Cumulative QUALIFIED PERCENTAGE award_pct would exceed 1.0"

  - id: ERR_QDRO_PENDING
    http: 409
    condition: "Election commence attempted while a DRAFT/SUBMITTED QDRO is still pending for the participant"

  - id: ERR_BENEFIT_NOT_AVAILABLE
    http: 409
    condition: "annuity_start_date implies attained age below EARLY_RETIREMENT_AGE (55)"

  - id: ERR_NO_COLA_CONFIGURED
    http: 409
    condition: "apply-cola called on a plan whose cola_pct is 0"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "certify carries expected_plan_version not equal to current PensionPlan.version (OCC)"

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: PlanSponsor
    description: "Employer/plan sponsor: creates plans, funds & files PBGC premiums, terminates the plan. Cannot administer individual benefits or certify actuarial filings."
    identity: "opaque"
    exclusive_operations:
      - "POST /plans — Create plan"
      - "POST /plans/{id}/terminate — Begin plan termination"
    shared_operations:
      - "POST /plans/{id}/premiums — Create premium filing (with PlanActuary)"
      - "GET endpoints (read across the plan)"

  - name: PlanActuary
    description: "Enrolled actuary: drafts and certifies 5500/AFTAP filings, drives funding_posture, prepares premium filings. Cannot administer benefits or approve elections."
    identity: "opaque"
    exclusive_operations:
      - "POST /plans/{id}/filings — Create plan-year filing"
      - "POST /plans/{id}/filings/{id}/certify — Certify filing (OCC)"
    shared_operations:
      - "POST /plans/{id}/premiums — Create premium filing (with PlanSponsor)"
      - "GET endpoints (read across the plan)"

  - name: BenefitsAdministrator
    description: "Third-party administrator: manages census, service/comp, elections, QDROs, payments, COLA. Same person cannot both submit and approve an election (segregation of duties keyed on X-User-ID)."
    identity: "opaque"
    exclusive_operations:
      - "POST /plans/{id}/participants — Add participant"
      - "POST /plans/{id}/participants/{id}/terminate — Terminate participant"
      - "POST /plans/{id}/participants/{id}/record-death — Record death"
      - "POST /plans/{id}/participants/{id}/compensation — Add compensation"
      - "POST /plans/{id}/participants/{id}/elections — Draft election"
      - "POST /plans/{id}/elections/{id}/submit — Submit election"
      - "POST /plans/{id}/elections/{id}/approve — Approve election"
      - "POST /plans/{id}/elections/{id}/reject — Reject election"
      - "POST /plans/{id}/elections/{id}/reopen — Reopen election"
      - "POST /plans/{id}/elections/{id}/commence — Commence election"
      - "POST /plans/{id}/elections/{id}/spousal-consent — Record spousal consent"
      - "POST /plans/{id}/participants/{id}/qdros — Draft QDRO"
      - "POST /plans/{id}/qdros/{id}/submit — Submit QDRO"
      - "POST /plans/{id}/qdros/{id}/qualify — Qualify QDRO"
      - "POST /plans/{id}/qdros/{id}/reject — Reject QDRO"
      - "POST /plans/{id}/qdros/{id}/amend — Amend QDRO"
      - "POST /plans/{id}/payments/{id}/activate — Activate payment"
      - "POST /plans/{id}/payments/{id}/suspend — Suspend payment"
      - "POST /plans/{id}/payments/{id}/resume — Resume payment"
      - "POST /plans/{id}/payments/{id}/apply-cola — Apply COLA"
      - "POST /plans/{id}/payments/{id}/terminate — Terminate payment"
    shared_operations:
      - "GET endpoints (read across the plan)"
