          trigger:
            - call: "POST /vital-events/${ev}/register"
              payload: {}
              as: StateRegistrar
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_CERTIFICATION_REQUIRED"

      - name: apostille_authenticate_blocked_when_copy_not_issued
        grounds:
          - state_machines.ApostilleRequest.SUBMITTED_to_AUTHENTICATED
          - entities.CertifiedCopyRequest.fields.status
          - errors[ERR_COPY_NOT_ISSUED]
        distinguishing_aspect: "ApostilleRequest's SUBMITTED->AUTHENTICATED depends on CertifiedCopyRequest.status == ISSUED; with the copy only ID_VERIFIED, authenticate is rejected with ERR_COPY_NOT_ISSUED (pair ApostilleRequest -> CertifiedCopyRequest, distinct from the VitalEvent->MedicalCertification pair)."
        test_recipe:
          setup:
            - "A REGISTERED BIRTH event in CTY-18; a copy request only ID_VERIFIED (not issued); a SUBMITTED ApostilleRequest on it."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "H18", facility_type: "HOSPITAL", jurisdiction_code: "CTY-18", npi: "NPI-018" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "BIRTH", event_date: "2026-02-25T00:00:00Z", subject_last_name: "Ives", subject_first_name: "Iv", sex: "FEMALE", jurisdiction_code: "CTY-18", facility_id: "${fac}", place_of_event: "H18" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev: "$.data.id" }
            - call: "POST /vital-events/${ev}/file"
              payload: {}
              as: FacilityFiler
              as_user_id: "${fac}"
            - call: "POST /vital-events/${ev}/register"
              payload: {}
              as: StateRegistrar
            - call: "POST /certified-copy-requests"
              payload: { vital_event_id: "${ev}", requester_name: "Iv Ives", requester_relationship: "SELF", id_document_type: "PASSPORT", copy_count: 1 }
              as: Applicant
              captures: { cc: "$.data.id" }
            - call: "POST /certified-copy-requests/${cc}/verify-id"
              payload: {}
              as: StateRegistrar
            - call: "POST /apostille-requests"
              payload: { certified_copy_request_id: "${cc}", destination_country: "FR", apostille_type: "APOSTILLE" }
              as: Applicant
              captures: { ap: "$.data.id" }
          trigger:
            - call: "POST /apostille-requests/${ap}/authenticate"
              payload: {}
              as: StateRegistrar
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_COPY_NOT_ISSUED"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: hearing_slot_closed_interval_buffer_conflict
        grounds:
          - state_machines.DelayedRegistrationPacket.SUBMITTED_to_ACCEPTED
          - entities.DelayedRegistrationPacket.fields.hearing_start
          - entities.DelayedRegistrationPacket.fields.hearing_end
          - errors[ERR_HEARING_SLOT_CONFLICT]
        distinguishing_aspect: "DelayedRegistrationPacket hearing slots use CLOSED intervals with a 15-minute buffer: a second slot starting 10 minutes after the first ends (< buffer) collides -> ERR_HEARING_SLOT_CONFLICT."
        test_recipe:
          setup:
            - "A HOSPITAL facility and a DRAFT event in CTY-19; packet A accepted with hearing 09:00-10:00 on 2026-03-10 in hearing jurisdiction HRG-19; packet B submitted with hearing 10:10-11:00 (gap 10 min < 15)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "H19", facility_type: "HOSPITAL", jurisdiction_code: "CTY-19", npi: "NPI-019" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "BIRTH", event_date: "2026-02-25T00:00:00Z", subject_last_name: "Orr", subject_first_name: "Ol", sex: "MALE", jurisdiction_code: "CTY-19", facility_id: "${fac}", place_of_event: "H19" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev: "$.data.id" }
            - call: "POST /delayed-registration-packets"
              payload: { vital_event_id: "${ev}", packet_type: "DELAYED", documentary_evidence_count: 2, hearing_start: "2026-03-10T09:00:00Z", hearing_end: "2026-03-10T10:00:00Z", hearing_jurisdiction_code: "HRG-19" }
              as: StateRegistrar
              captures: { pa: "$.data.id" }
            - call: "POST /delayed-registration-packets/${pa}/accept"
              payload: {}
              as: StateRegistrar
            - call: "POST /delayed-registration-packets"
              payload: { vital_event_id: "${ev}", packet_type: "DELAYED", documentary_evidence_count: 3, hearing_start: "2026-03-10T10:10:00Z", hearing_end: "2026-03-10T11:00:00Z", hearing_jurisdiction_code: "HRG-19" }
              as: StateRegistrar
              captures: { pb: "$.data.id" }
          trigger:
            - call: "POST /delayed-registration-packets/${pb}/accept"
              payload: {}
              as: StateRegistrar
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_HEARING_SLOT_CONFLICT"

      - name: statistics_period_half_open_overlap_rejected
        grounds:
          - validations[priority=20]
          - entities.StatisticsReport.fields.period_start
          - entities.StatisticsReport.fields.period_end
          - errors[ERR_REPORT_PERIOD_OVERLAP]
        distinguishing_aspect: "StatisticsReport periods use HALF-OPEN [start,end) intervals (adjacency allowed): report B [2026-01-15,2026-03-01) overlaps existing A [2026-01-01,2026-02-01) in the same jurisdiction and is rejected -> ERR_REPORT_PERIOD_OVERLAP (a different resource and interval semantics than the buffered hearing slot)."
        test_recipe:
          setup:
            - "An existing StatisticsReport A over [2026-01-01,2026-02-01) in jurisdiction CTY-20."
          setup_api_calls:
            - call: "POST /statistics-reports"
              payload: { jurisdiction_code: "CTY-20", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }
              as: StateRegistrar
              captures: { ra: "$.data.id" }
          trigger:
            - call: "POST /statistics-reports"
              payload: { jurisdiction_code: "CTY-20", period_start: "2026-01-15T00:00:00Z", period_end: "2026-03-01T00:00:00Z" }
              as: StateRegistrar
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_REPORT_PERIOD_OVERLAP"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_conserves_facility_registered_count
        grounds:
          - state_machines.VitalEvent.FILED_to_REGISTERED
          - state_machines.VitalEvent.REGISTERED_to_VOIDED
          - entities.Facility.fields.registered_count
        distinguishing_aspect: "Conserved quantity = Facility.registered_count == count of VitalEvents with facility_id==F and status IN {REGISTERED, AMENDED}: register increments it to 1, the compensating void decrements it back to 0 (count invariant)."
        test_recipe:
          setup:
            - "A HOSPITAL facility with a FILED BIRTH event in CTY-21 ready to register."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "H21", facility_type: "HOSPITAL", jurisdiction_code: "CTY-21", npi: "NPI-021" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "BIRTH", event_date: "2026-02-25T00:00:00Z", subject_last_name: "Uma", subject_first_name: "Um", sex: "FEMALE", jurisdiction_code: "CTY-21", facility_id: "${fac}", place_of_event: "H21" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev: "$.data.id" }
            - call: "POST /vital-events/${ev}/file"
              payload: {}
              as: FacilityFiler
              as_user_id: "${fac}"
          trigger:
            - call: "POST /vital-events/${ev}/register"
              payload: {}
              as: StateRegistrar
            - call: "GET /facilities/${fac}"
              payload: {}
              as: StateRegistrar
              captures: { c_after_reg: "$.data.registered_count" }
            - call: "POST /vital-events/${ev}/void"
              payload: {}
              as: StateRegistrar
            - call: "GET /facilities/${fac}"
              payload: {}
              as: StateRegistrar
              captures: { c_after_void: "$.data.registered_count" }
          assert:
            - "Facility.${fac}.registered_count == 1 immediately after register"
            - "Facility.${fac}.registered_count == 0 after the compensating void"

      - name: void_conserves_event_fee_ledger
        grounds:
          - state_machines.CertifiedCopyRequest.ID_VERIFIED_to_ISSUED
          - state_machines.VitalEvent.REGISTERED_to_VOIDED
          - entities.VitalEvent.fields.fees_collected_cents
          - entities.VitalEvent.fields.copies_issued_count
        distinguishing_aspect: "Conserved quantity = VitalEvent.fees_collected_cents == sum of fee_total_cents over ISSUED copies: issuing a 1500c copy raises it to 1500 (copies_issued_count 1), and the compensating void reverses both to 0 (monetary invariant, different from the facility count)."
        test_recipe:
          setup:
            - "A REGISTERED BIRTH event in CTY-22 with one ID_VERIFIED STANDARD copy_count=1 request (confidential -> CERTIFIED -> fee 1500c)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "H22", facility_type: "HOSPITAL", jurisdiction_code: "CTY-22", npi: "NPI-022" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "BIRTH", event_date: "2026-02-25T00:00:00Z", subject_last_name: "Wynn", subject_first_name: "Win", sex: "MALE", jurisdiction_code: "CTY-22", facility_id: "${fac}", place_of_event: "H22" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev: "$.data.id" }
            - call: "POST /vital-events/${ev}/file"
              payload: {}
              as: FacilityFiler
              as_user_id: "${fac}"
            - call: "POST /vital-events/${ev}/register"
              payload: {}
              as: StateRegistrar
            - call: "POST /certified-copy-requests"
              payload: { vital_event_id: "${ev}", requester_name: "Win Wynn", requester_relationship: "SELF", requester_category: "STANDARD", id_document_type: "DRIVERS_LICENSE", copy_count: 1 }
              as: Applicant
              captures: { cc: "$.data.id" }
            - call: "POST /certified-copy-requests/${cc}/verify-id"
              payload: {}
              as: StateRegistrar
          trigger:
            - call: "GET /vital-events/${ev}"
              payload: {}
              as: StateRegistrar
              captures: { ev_v: "$.data.version" }
            - call: "POST /certified-copy-requests/${cc}/issue"
              payload: { expected_vital_event_version: "${ev_v}" }
              as: StateRegistrar
            - call: "GET /vital-events/${ev}"
              payload: {}
              as: StateRegistrar
              captures: { fees_after: "$.data.fees_collected_cents", copies_after: "$.data.copies_issued_count" }
            - call: "POST /vital-events/${ev}/void"
              payload: {}
              as: StateRegistrar
            - call: "GET /vital-events/${ev}"
              payload: {}
              as: StateRegistrar
              captures: { fees_void: "$.data.fees_collected_cents", copies_void: "$.data.copies_issued_count" }
          assert:
            - "VitalEvent.${ev}.fees_collected_cents == 1500 immediately after issue"
            - "VitalEvent.${ev}.copies_issued_count == 1 immediately after issue"
            - "VitalEvent.${ev}.fees_collected_cents == 0 after the compensating void"
            - "VitalEvent.${ev}.copies_issued_count == 0 after the compensating void"
