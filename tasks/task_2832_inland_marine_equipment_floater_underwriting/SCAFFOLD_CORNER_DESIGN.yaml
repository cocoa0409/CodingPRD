              payload: { vehicle_id: "00000000-0000-0000-0000-0000000000ff", origin_territory_code: "T3_INLAND", destination_territory_code: "T2_URBAN", departure_at: "2026-09-01T08:00:00Z", arrival_at: "2026-09-01T18:00:00Z", declared_value_cents: 1000000 }
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/claims"
              payload: { coverage_part_id: "${cp}", loss_date: "2026-08-01", loss_type: "THEFT", equipment_item_id: "00000000-0000-0000-0000-0000000000ff" }
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/claims"
              payload: { coverage_part_id: "00000000-0000-0000-0000-0000000000ff", loss_date: "2026-08-01", loss_type: "THEFT", equipment_item_id: "${it1}" }
              as: Underwriter
          assert:
            - "trigger[0] HTTP status == 404 and error_id == ERR_JOBSITE_NOT_FOUND"
            - "trigger[1] HTTP status == 404 and error_id == ERR_VEHICLE_NOT_FOUND"
            - "trigger[2] HTTP status == 404 and error_id == ERR_LOSS_SUBJECT_NOT_FOUND"
            - "trigger[3] HTTP status == 404 and error_id == ERR_LOSS_SUBJECT_NOT_FOUND (an unresolvable coverage_part_id on claim creation is the same existence rule, priority 34, not the generic priority 30 part lookup)"
            - "after all four triggers: EquipmentItem.${it1}.assigned_jobsite_id is still null and rated_premium_cents is still 173318"
            - "after all four triggers: Policy.${pol}.version == ${pol_v1} - a rejected write never bumps the OCC version"
            - "after all four triggers: 0 TransitShipment rows and 0 Claim rows exist"

      - name: corner_request_shape_rejections_are_400_not_422
