  - name: member_months_mid_month_boundary
    claim_type: computed_fields
    grounds:
    - calculations.member_months
    - entities.AttributionRecord.fields.member_months
    distinguishing_aspect: 'Mid-month rule: a span starting exactly on the 15th counts that month (12 mm); starting the 16th does not (11 mm) — computed at run compute, not at record create.'
    test_recipe:
      setup:
      - Canonical program/contract/year opened; member MA span 2026-01-15..2026-12-31; member MB span 2026-01-16..2026-12-31; both attributed to PR1 in a DRAFT run
      setup_api_calls:
      - call: POST /vbc/_clock/set_current_utc
        payload:
          to_iso8601: '2026-01-01T00:00:00Z'
        as: PayerAdmin
      - call: POST /vbc/programs
        payload:
          program_name: P1
          line_of_business: MEDICARE_ADVANTAGE
        as: PayerAdmin
        captures:
          pg: $.data.id
      - call: POST /vbc/programs/${pg}/activate
        payload: {}
        as: PayerAdmin
      - call: POST /vbc/practice-groups
        payload:
          group_name: G1
          tin: '100000001'
        as: PayerAdmin
        captures:
          g1: $.data.id
      - call: POST /vbc/practices
        payload:
          practice_group_id: ${g1}
          practice_name: PR1
          npi: '2000000001'
        as: PayerAdmin
        captures:
          pr1: $.data.id
      - call: POST /vbc/contracts
        payload:
          program_id: ${pg}
          practice_group_id: ${g1}
          contract_ref: C-1
          effective_start: '2026-01-01'
          effective_end: '2027-01-01'
          risk_track: ONE_SIDED_UPSIDE
          risk_model: PROSPECTIVE
          benchmark_pmpm_cents: 100000
          shared_savings_rate_bp: 5000
          min_savings_rate_bp: 200
          savings_cap_bp: 1000
          stop_loss_cents: 2000000
          withhold_rate_bp: 500
          quality_gate_floor_points: 30
          quality_gate_excellence_points: 80
          estimate_method: ANNUALIZATION
          quality_measures:
          - measure_code: HBA1C
            weight_bp: 10000
            decile_thresholds_bp:
            - 1000
            - 2000
            - 3000
            - 4000
            - 5000
            - 6000
            - 7000
            - 8000
            - 9000
        as: ContractManager
        captures:
          c1: $.data.id
      - call: POST /vbc/contracts/${c1}/activate
        payload: {}
        as: ContractManager
      - call: POST /vbc/performance-years
        payload:
          contract_id: ${c1}
          year_label: 2026
          period_start: '2026-01-01'
          period_end: '2027-01-01'
        as: PayerAdmin
        captures:
          y1: $.data.id
      - call: POST /vbc/performance-years/${y1}/open-attribution
        payload: {}
        as: PayerAdmin
      - call: POST /vbc/members
        payload:
          program_id: ${pg}
          member_ref: M-A
          birth_year: 1980
        as: PayerAdmin
        captures:
          ma: $.data.id
      - call: POST /vbc/members
        payload:
          program_id: ${pg}
          member_ref: M-B
          birth_year: 1981
        as: PayerAdmin
        captures:
          mb: $.data.id
      - call: POST /vbc/eligibility-spans
        payload:
          member_id: ${ma}
          start_date: '2026-01-15'
          end_date: '2026-12-31'
        as: PayerAdmin
      - call: POST /vbc/eligibility-spans
        payload:
          member_id: ${mb}
          start_date: '2026-01-16'
          end_date: '2026-12-31'
        as: PayerAdmin
      - call: GET /vbc/performance-years/${y1}
        payload: {}
        as: PayerAdmin
        captures:
          yv: $.data.version
      - call: POST /vbc/performance-years/${y1}/attribution-runs
        payload:
          run_label: R-1
          expected_performance_year_version: ${yv}
        as: AttributionAnalyst
        captures:
          r1: $.data.id
      - call: POST /vbc/attribution-runs/${r1}/records
        payload:
          member_id: ${ma}
          practice_id: ${pr1}
        as: AttributionAnalyst
      - call: POST /vbc/attribution-runs/${r1}/records
        payload:
          member_id: ${mb}
          practice_id: ${pr1}
        as: AttributionAnalyst
      trigger:
      - call: POST /vbc/attribution-runs/${r1}/compute
        payload: {}
        as: AttributionAnalyst
      - call: GET /vbc/attribution-records?member_id=${ma}
        payload: {}
        as: AttributionAnalyst
        captures:
          mma: $.data[0].member_months
      - call: GET /vbc/attribution-records?member_id=${mb}
        payload: {}
        as: AttributionAnalyst
        captures:
          mmb: $.data[0].member_months
      assert:
      - MA member_months == 12 (Jan 15 span start covers the 15th)
      - MB member_months == 11 (Jan 16 start misses the 15th)
      - Records flipped PROVISIONAL -> CONFIRMED by compute
