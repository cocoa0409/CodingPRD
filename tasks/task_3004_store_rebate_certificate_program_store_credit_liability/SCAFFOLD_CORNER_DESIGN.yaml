              captures: { s: $.data.id, s_v: $.data.version }
          trigger:
            - call: "PATCH /stores/${s}"
              payload: { expected_store_version: "${s_v}", submission_window_days: 45 }
              as: StoreAdmin
            - call: "PATCH /stores/${s}"
              payload: { expected_store_version: "${s_v}", submission_window_days: 60 }
              as: StoreAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the second PATCH fails with error_id ERR_STALE_VERSION (HTTP 412)"
            - "Store.${s}.submission_window_days == 45 and version == 2"

