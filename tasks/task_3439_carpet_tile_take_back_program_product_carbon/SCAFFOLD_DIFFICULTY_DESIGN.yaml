            - *k_clock
            - *k_col_grave_none
            - *k_lot_net200
            - *k_lot_vir200
            - *k_qc_lot1
            - *k_qc_lot2
            - *k_batch_b1
            - *k_alloc1
            - *k_alloc2
            - *k_rel_b1
            - *k_rep1
            - *k_submit1
            - *k_assign1
            - *k_clear1
            - *k_publish1
            - *k_tgt2
            - &k_reading_breach
              call: "POST /carpetloop/manufacturing-targets/${tgt2}/readings"
              payload: { period_end: "2026-10-05T00:00:00Z", intensity_kgco2e_per_m2: 8.5 }
              as: SustainabilityManager
              as_user_id: "sm-carol"
