  # ===================================================================
  # RULE 9 — Compensating invariants (three different conserved quantities)
  # ===================================================================
  - rule_id: compensating_invariant
    instances:

      - name: invoice_dispute_restores_credit_ledger_sum
        grounds:
          - calculations.casing_credit_balance
          - state_machines.CrossLocationInvoice.SUBMITTED_to_DISPUTED
          - entities.CasingCreditEntry.fields.entry_type
          - entities.FleetAccount.fields.casing_credit_balance_cents
        distinguishing_aspect: |
          CONSERVED QUANTITY: SUM(CasingCreditEntry.amount_cents) for the fleet, mirrored by
          FleetAccount.casing_credit_balance_cents. Submitting consumes 6334 cents of credit
          via an APPLICATION entry; disputing posts the exact +6334 REVERSAL, so the running
          sum returns to 10500 with zero drift. The compensation is additive — the
          APPLICATION row is never deleted or edited, leaving a three-row audit trail.
        test_recipe:
          setup:
            - "ACTIVE agreement with tier_discount_pct 0.125 and casing_credit_rate_cents 15000"
            - "two COMPLETED NORMAL calls worth 12820 and 16140 cents in the August period"
            - "one casing graded B at retread_count 0, accruing 10500 cents of credit"
            - "an invoice created (net 25339, cap 6334, credit_applied 6334, total 19005) and then submitted"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Ledger Commercial", location_code: "LGC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-2929", scrap_permit_expires_on: "2027-12-31" }
