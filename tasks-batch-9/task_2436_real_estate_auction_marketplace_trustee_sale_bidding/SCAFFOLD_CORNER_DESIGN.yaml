      - name: auth_then_role_outrank_existence_on_a_missing_listing
        claim_type: priority_ordering
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=4]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "The same call against a NON-EXISTENT listing id returns three different errors depending on the caller: no X-User-ID gives ERR_UNAUTHENTICATED (401), a Seller gives ERR_FORBIDDEN_ROLE (403), and only the TitleOfficer gets as far as ERR_ASSET_LISTING_NOT_FOUND (404) — existence is never leaked to an unauthorised caller."
        test_recipe:
          setup:
            - "An empty database except one seller row; the id 00000000-0000-0000-0000-0000000000ff belongs to no listing."
          setup_api_calls:
            - call: "POST /sellers"
              payload: { org_name: "Ladder Auth Bank", seller_type: "BANK", contact_email: "a@authladder.example", settlement_account_ref: "ACH-AUTH" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
          trigger:
            - call: "POST /asset-listings/00000000-0000-0000-0000-0000000000ff/title-clearance"
              payload: { clearance_outcome: "CLEARED", verified_title_condition: "CLEAR", title_report_reference: "TR-AUTH-1" }
              as: Anonymous
              captures: { err_unauth: $.data.error_id }
            - call: "POST /asset-listings/00000000-0000-0000-0000-0000000000ff/title-clearance"
              payload: { clearance_outcome: "CLEARED", verified_title_condition: "CLEAR", title_report_reference: "TR-AUTH-1" }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { err_role: $.data.error_id }
            - call: "POST /asset-listings/00000000-0000-0000-0000-0000000000ff/title-clearance"
              payload: { clearance_outcome: "CLEARED", verified_title_condition: "CLEAR", title_report_reference: "TR-AUTH-1" }
              as: TitleOfficer
              captures: { err_missing: $.data.error_id }
          assert:
            - "First trigger (no X-User-ID header): HTTP 401 and ${err_unauth} == ERR_UNAUTHENTICATED"
            - "Second trigger: HTTP 403 and ${err_role} == ERR_FORBIDDEN_ROLE"
            - "Third trigger: HTTP 404 and ${err_missing} == ERR_ASSET_LISTING_NOT_FOUND"
            - "${err_unauth} != ERR_ASSET_LISTING_NOT_FOUND and ${err_role} != ERR_ASSET_LISTING_NOT_FOUND"

      - name: invalid_enum_outranks_the_listing_state_check
        claim_type: priority_conflict
        grounds:
          - validations[priority=14]
          - validations[priority=17]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A call that violates BOTH the enum contract (priority 14) and the INTAKE precondition (priority 17) returns ERR_INVALID_REQUEST (400) rather than ERR_LISTING_NOT_IN_INTAKE (409): shape is validated before state, so the state error is unreachable for a malformed payload."
        test_recipe:
          setup:
            - "One asset listing has already filed disclosures and is DISCLOSURE_READY (so the INTAKE precondition is violated)."
          setup_api_calls:
            - call: "POST /sellers"
              payload: { org_name: "Shape First Bank", seller_type: "BANK", contact_email: "s@shape.example", settlement_account_ref: "ACH-SHAP" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "1 Shape Rd", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 26000000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /asset-listings/${listing_id}/disclosures"
              payload: { occupancy_status: "VACANT", title_condition: "CLEAR" }
              as: Seller
              as_user_id: "${seller_id}"
          trigger:
            - call: "POST /asset-listings/${listing_id}/disclosures"
              payload: { occupancy_status: "SQUATTER_OCCUPIED", title_condition: "CLEAR" }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { err_both: $.data.error_id }
            - call: "POST /asset-listings/${listing_id}/disclosures"
              payload: { occupancy_status: "OWNER_OCCUPIED", title_condition: "CLEAR" }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { err_state_only: $.data.error_id }
          assert:
            - "First trigger: HTTP 400 and ${err_both} == ERR_INVALID_REQUEST"
            - "${err_both} != ERR_LISTING_NOT_IN_INTAKE"
            - "Second trigger (well-formed, still wrong state): HTTP 409 and ${err_state_only} == ERR_LISTING_NOT_IN_INTAKE"
            - "AssetListing.${listing_id}.occupancy_status == VACANT after both rejections"

      - name: lot_county_must_match_its_event_county
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=38]
