      - name: occ_location_change_patch_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[location-change-patch-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Conflicting edits to a PENDING_REVIEW LocationChange are serialized on its own version: the first patch wins, the second (same observed version) gets 412."
        test_recipe:
          setup: ["OR/NJ locations; employee in OR; LocationChange PENDING_REVIEW (version captured at creation)"]
          setup_api_calls:
            - { call: "POST /etax/work-locations", payload: { label: "Portland Office", address_line1: "100 Main St", city: "Portland", state_code: "OR", postal_code: "97201", location_type: "COMPANY_OFFICE" }, as: NexusAnalyst, captures: { wl_or: $.data.id } }
            - { call: "POST /etax/work-locations", payload: { label: "Jersey Home", address_line1: "5 Grove St", city: "Jersey City", state_code: "NJ", postal_code: "07302", location_type: "REMOTE_HOME" }, as: NexusAnalyst, captures: { wl_nj: $.data.id } }
            - { call: "POST /etax/employees", payload: { employee_ref: "E-7004", full_name: "BL One", resident_state_code: "OR", hire_date: "2026-08-01T00:00:00Z", annual_wage_cents: 3000000, current_work_location_id: "${wl_or}" }, as: NexusAnalyst, captures: { e_id: $.data.id } }
            - { call: "POST /etax/location-changes", payload: { employee_id: "${e_id}", to_work_location_id: "${wl_nj}", effective_date: "2026-09-01T00:00:00Z", reason: "Move" }, as: Employee, as_user_id: "${e_id}", captures: { lc_id: $.data.id, lc_v: $.data.version } }
          trigger:
            - { call: "PATCH /etax/location-changes/${lc_id}", payload: { effective_date: "2026-09-15T00:00:00Z", expected_location_change_version: "${lc_v}" }, as: NexusAnalyst, captures: { v2: $.data.version, eff: $.data.effective_date } }
            - { call: "PATCH /etax/location-changes/${lc_id}", payload: { reason: "Changed mind on timing", expected_location_change_version: "${lc_v}" }, as: NexusAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "First patch: version == 2, effective_date == 2026-09-15T00:00:00Z"
            - "Second patch with the stale creation-time version: error_id == ERR_STALE_VERSION"

