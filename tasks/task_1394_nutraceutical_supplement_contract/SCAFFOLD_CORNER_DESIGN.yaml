- section: cross_cutting_layers
  instances:
  - name: formula_update_stale_version_412
    claim_type: occ_stale_version
    grounds:
    - concurrency_rules[formula-update-stale-version]
    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: 'OCC on Formula.version: two strictly sequential PUTs carrying the same base version — the first
      succeeds (version advances), the second is rejected 412 ERR_STALE_VERSION.'
    test_recipe:
      setup:
      - DRAFT formula, version captured at create
      setup_api_calls:
      - call: POST /api/customers
        payload:
          brand_name: Acme
        as: ProductionPlanner
        captures:
          cust_id: $.data.id
      - call: POST /api/raw-materials
        payload:
          name: VitC
          allergen_class: NONE
        as: ProductionPlanner
        captures:
          rm_id: $.data.id
      - call: POST /api/customers/${cust_id}/formulas
        payload:
          name: C500
          dosage_form: TABLET
          allergen_class: NONE
          min_order_qty: 1000
          batch_size_units: 10000
          shelf_life_months: 24
          overage_basis: THEORETICAL
          lines:
          - raw_material_id: ${rm_id}
            theoretical_qty_mg_per_unit: 500
            overage_pct: 10
            is_label_claim_line: true
            label_claim_mg_per_unit: 450
          price_tiers:
          - min_qty: 1000
            unit_price_cents: 120
        as: ProductionPlanner
        captures:
          f_id: $.data.id
          f_v: $.data.version
      trigger:
      - call: PUT /api/formulas/${f_id}
        payload:
          expected_formula_version: ${f_v}
          name: C500-v1.1
        as: ProductionPlanner
        captures:
          f_v2: $.data.version
      - call: PUT /api/formulas/${f_id}
        payload:
          expected_formula_version: ${f_v}
