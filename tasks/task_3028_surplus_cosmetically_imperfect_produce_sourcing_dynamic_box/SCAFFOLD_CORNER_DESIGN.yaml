  - name: shipped_total_stacks_the_fee_and_tax_tiers_in_the_pinned_order
    claim_type: correct_result
    grounds:
    - entities.BoxOrder.fields.shipped_total_cents
    - entities.BoxOrder.fields.service_fee_cents
    - entities.BoxOrder.fields.tax_cents
    distinguishing_aspect: "The two flat tiers stack in the pinned order \u2014 subtotal is the discounted merchandise, tax is 5 percent of that subtotal only, and the service fee of 599 is added after tax \u2014 so a 5000 cent box totals 5299, not the 5949 a fee-then-tax reading gives."
