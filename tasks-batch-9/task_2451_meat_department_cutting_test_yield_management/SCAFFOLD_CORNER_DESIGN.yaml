            - "RetailItem.${grd_id}.yield_adjusted_cost_per_lb_cents == 212.5000 and country_of_origin_label == MULTIPLE"
            - "TrimLot.${tla_id} and TrimLot.${tlb_id} are both status CONSUMED with consumed_lb == 10.00, allocated_lb == 0.00 and remaining_lb == 0.00"
            - "GrindInput.${gi1_id}.consumed == true and GrindInput.${gi2_id}.consumed == true"

      - name: pre_order_cancellation_splits_the_deposit_at_the_window_boundary
