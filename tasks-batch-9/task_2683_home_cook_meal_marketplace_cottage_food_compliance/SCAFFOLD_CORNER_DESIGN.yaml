            - call: POST /menu-items
              payload: { cook_id: "${cook_id}", name: "Sourdough Loaf", food_category: "BAKED_NON_TCS", allergens: ["WHEAT"], allergen_free_attested: false, shelf_life_days: 5, requires_refrigeration: false, handoff_mode: "BATCH_COOK_AND_CHILL", unit_price_cents: 400, label_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"] }
              as: Cook
              as_user_id: "${cook_id}"
