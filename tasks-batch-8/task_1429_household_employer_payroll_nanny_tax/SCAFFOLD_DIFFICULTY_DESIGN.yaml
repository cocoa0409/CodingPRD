            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "DD", agency: "SIT_WITHHOLDING", expected_employer_version: "${e_v2}" }, as: PayrollAdmin, captures: { reg_sit: "$.data.id" } }
            - { call: "GET /household-payroll/employers/${e_id}", as: PayrollAdmin, captures: { e_v3: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "DD", agency: "SUTA", expected_employer_version: "${e_v3}" }, as: PayrollAdmin, captures: { reg_suta: "$.data.id" } }
            - { call: "POST /household-payroll/registrations/${reg_nh}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_nh}/activate", payload: { agency_account_number: "NH-001" }, as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_sit}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_sit}/activate", payload: { agency_account_number: "SIT-001" }, as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_suta}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_suta}/activate", payload: { agency_account_number: "SUTA-001" }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers/${e_id}/workers", payload: { full_name: "Liv AuPair", ssn: "123456789", work_state_code: "DD", hire_date: "2026-01-05", work_arrangement: "LIVE_IN" }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_id: "$.data.id", w_v: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/classify", payload: { classification_answers: [ { question_key: "controls_schedule", answer: "EMPLOYER" }, { question_key: "supplies_own_tools", answer: "EMPLOYER" }, { question_key: "hires_own_substitutes", answer: "NOT_ALLOWED" }, { question_key: "paid_by", answer: "HOURLY" } ] }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_v2: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/agreements", payload: { hourly_rate_cents: 3000, pay_method: "GUARANTEED_SALARY_FWW", guaranteed_minutes_per_week: 2400, effective_from: "2026-01-01", expected_worker_version: "${w_v2}" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/workers/${w_id}/activate", payload: { new_hire_report_date: "2026-01-06" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/workers/${w_id}/timesheets", payload: { period_start: "2026-01-05", period_end: "2026-01-12", entries: [ { work_date: "2026-01-05", worked_minutes: 602 }, { work_date: "2026-01-06", worked_minutes: 602 }, { work_date: "2026-01-07", worked_minutes: 602 }, { work_date: "2026-01-08", worked_minutes: 602 }, { work_date: "2026-01-09", worked_minutes: 602 } ] }, as: Worker, as_user_id: "${w_id}", captures: { ts_id: "$.data.id" } }
