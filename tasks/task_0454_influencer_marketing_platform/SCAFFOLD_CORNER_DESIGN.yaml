              payload: { follower_count: 50000, avg_engagement_rate: 0.05, estimated_reach: 25000, fake_follower_pct: 0.05 }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { brand_id: "${brand_id}", title: "DF", campaign_budget_cents: 100000, requires_ftc_disclosure: false, starts_at: "2026-02-01T00:00:00Z", ends_at: "2026-03-01T00:00:00Z" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { campaign_id: $.data.id, cv0: $.data.version }
            - call: "POST /campaigns/${campaign_id}/deliverables"
              payload: { content_type: "FEED_POST", quantity: 1, due_at: "2026-02-20T00:00:00Z", base_rate_cents: 70000 }
              as: Brand
              as_user_id: "${brand_id}"
            - call: "POST /campaigns/${campaign_id}/open"
              payload: { expected_campaign_version: "${cv0}" }
              as: Brand
              as_user_id: "${brand_id}"
            - call: "POST /offers"
              payload: { campaign_id: "${campaign_id}", creator_id: "${creator_id}", current_amount_cents: 70000, exclusivity_days: 0 }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { offer_id: $.data.id, ov0: $.data.version }
            - call: "POST /offers/${offer_id}/accept"
              payload: { expected_offer_version: "${ov0}" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { ov_acc: $.data.version }
          trigger:
            - call: "POST /contracts"
              payload: { offer_id: "${offer_id}", expected_offer_version: "${ov_acc}" }
