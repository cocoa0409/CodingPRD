        distinguishing_aspect: "Action on a non-existent report UUID yields 404 ERR_PERFORMANCE_REPORT_NOT_FOUND."
        test_recipe:
          setup: ["A MANAGEMENT member exists"]
          setup_api_calls:
            - { call: "POST /team-members", payload: { full_name: "Adam Admin", email: "adam@x.com", specialty: "MANAGEMENT" }, as: ProgramAdmin, captures: { m_admin: $.data.id } }
          trigger:
            - { call: "POST /performance-reports/00000000-0000-0000-0000-000000000000/submit", as: ProjectAdministrator, as_user_id: "${m_admin}", captures: { err: $.data.error_id } }
