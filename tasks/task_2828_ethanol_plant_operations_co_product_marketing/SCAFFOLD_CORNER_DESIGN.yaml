            - "${ng_us} == 10000 and ${ng_un} == 300000 ((330.00 - 320.0) * 3 * 10000 with the SHORT sign)"
            - "HedgePosition.${corn_id}.realized_pnl_cents == 0 and contracts_open == 20"
            - "HedgePosition.${ng_id}.status == OPEN and contracts_closed == 0"

