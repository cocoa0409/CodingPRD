            - { call: "POST /licensure/applications/${app}/deficiency-plans", payload: { expected_application_version: "${app_v}" }, as: CredentialEvaluator, captures: { plan: $.data.id } }
            - { call: "POST /licensure/deficiency-plans/${plan}/state", payload: { to_status: "ACCEPTED" }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/emergency-permits", payload: { district_code: "D02", valid_from: "2026-09-01T00:00:00Z", valid_until: "2027-03-01T00:00:00Z" }, as: CredentialEvaluator, captures: { perm: $.data.id } }
            - { call: "POST /licensure/deficiency-plans/${plan}/evidence", payload: { hours: 30 }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "EVALUATION" }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/transcripts", payload: { institution_name: "Night School", degree_level: "BACHELORS", total_semester_hours: 90, courses: [ { course_code: "BIO101", credit_hours: 4, letter_grade: "B" } ] }, as: Applicant, as_user_id: "${ap}", captures: { tr: $.data.id } }
            - { call: "POST /licensure/transcripts/${tr}/verify", payload: { verification_status: "VERIFIED", subject_relevant_hours: 18 }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/test-scores", payload: { exam_code: "PRAXIS_SUBJECT", raw_score: 60, tested_on: "2026-07-01T00:00:00Z" }, as: Applicant, as_user_id: "${ap}", captures: { ts1: $.data.id } }
            - { call: "POST /licensure/test-scores/${ts1}/verify", payload: { verification_status: "VERIFIED" }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/test-scores", payload: { exam_code: "PEDAGOGY", raw_score: 30, tested_on: "2026-07-02T00:00:00Z" }, as: Applicant, as_user_id: "${ap}", captures: { ts2: $.data.id } }
            - { call: "POST /licensure/test-scores/${ts2}/verify", payload: { verification_status: "VERIFIED" }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/background-checks", payload: { adverse_findings: [ { offense_category: "FELONY_OTHER", offense_date: "2024-08-01T00:00:00Z", disposition: "CONVICTION" } ] }, as: BackgroundInvestigator, captures: { bg: $.data.id } }
            - { call: "POST /licensure/background-checks/${bg}/state", payload: { to_status: "PRINTS_SUBMITTED", fingerprint_submitted_at: "2026-08-05T00:00:00Z" }, as: BackgroundInvestigator }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "BACKGROUND_REVIEW" }, as: CredentialEvaluator }
            - { call: "POST /licensure/background-checks/${bg}/state", payload: { to_status: "ADJUDICATION" }, as: LegalOfficer }
          trigger:
            - { call: "POST /licensure/background-checks/${bg}/state", payload: { to_status: "DENIED" }, as: LegalOfficer }
          assert:
            - "BackgroundCheck.${bg}.status == 'DENIED'"
            - "CredentialApplication.${app}.status == 'DENIED'"
            - "EmergencyPermit.${perm}.status == 'REVOKED'"
            - "DeficiencyPlan.${plan}.status == 'COMPLETED'"

  # ------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_withdrawn_application
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_FEE_UNPAID]
        distinguishing_aspect: |
          Pair state vs business_fiscal: advancing a WITHDRAWN application toward
          INTAKE_REVIEW fails BOTH the state check (no transition from WITHDRAWN) and the
          fiscal check (fee_status REFUNDED); priority 5 < 10 so ERR_INVALID_STATE wins.
        test_recipe:
          setup:
            - "Application paid, advanced to INTAKE_REVIEW, then withdrawn by the applicant (fee_status REFUNDED)"
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Jay Ja", email: "jay@x.com", date_of_birth: "1994-01-01T00:00:00Z", ssn_last4: "1212", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap}", pathway: "ALTERNATIVE", subject_area: "ELEMENTARY", grade_band: "PK_6" }, as: Applicant, as_user_id: "${ap}", captures: { app: $.data.id } }
            - { call: "POST /licensure/applications/${app}/fee-payment", payload: { payment_token: "tok_1" }, as: Applicant, as_user_id: "${ap}" }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "INTAKE_REVIEW" }, as: IntakeOfficer }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "WITHDRAWN" }, as: Applicant, as_user_id: "${ap}" }
          trigger:
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "INTAKE_REVIEW" }, as: IntakeOfficer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_INVALID_STATE'"
            - "CredentialApplication.${app}.fee_status == 'REFUNDED'"

      - name: safety_beats_constraint_on_permit_creation
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_BACKGROUND_HOLD]
          - errors[ERR_PERMIT_INTERVAL_OVERLAP]
        distinguishing_aspect: |
          Pair business_safety vs business_constraint (different pair than the other
          instance): permit creation while the applicant has a FLAGGED background check AND
          the requested interval overlaps an existing permit fails both; priority 6 < 7 so
          ERR_BACKGROUND_HOLD wins.
        test_recipe:
          setup:
            - "ALTERNATIVE SCIENCE application in DEFICIENCY_PENDING with ACCEPTED plan; permit P1 ISSUED for D01 [2026-09-01, 2027-03-01); background check FLAGGED (risk 60)"
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Kim Ki", email: "kim@x.com", date_of_birth: "1990-12-12T00:00:00Z", ssn_last4: "3434", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap}", pathway: "ALTERNATIVE", subject_area: "SCIENCE", grade_band: "G5_8" }, as: Applicant, as_user_id: "${ap}", captures: { app: $.data.id } }
            - { call: "POST /licensure/applications/${app}/fee-payment", payload: { payment_token: "tok_1" }, as: Applicant, as_user_id: "${ap}" }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "INTAKE_REVIEW" }, as: IntakeOfficer }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "EVALUATION" }, as: IntakeOfficer }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "DEFICIENCY_PENDING" }, as: CredentialEvaluator, captures: { app_v: $.data.version } }
            - { call: "POST /licensure/applications/${app}/deficiency-plans", payload: { expected_application_version: "${app_v}" }, as: CredentialEvaluator, captures: { plan: $.data.id } }
            - { call: "POST /licensure/deficiency-plans/${plan}/state", payload: { to_status: "ACCEPTED" }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/emergency-permits", payload: { district_code: "D01", valid_from: "2026-09-01T00:00:00Z", valid_until: "2027-03-01T00:00:00Z" }, as: CredentialEvaluator, captures: { perm1: $.data.id } }
            - { call: "POST /licensure/applications/${app}/background-checks", payload: { adverse_findings: [ { offense_category: "FELONY_OTHER", offense_date: "2024-08-01T00:00:00Z", disposition: "CONVICTION" } ] }, as: BackgroundInvestigator, captures: { bg: $.data.id } }
            - { call: "POST /licensure/background-checks/${bg}/state", payload: { to_status: "PRINTS_SUBMITTED", fingerprint_submitted_at: "2026-08-05T00:00:00Z" }, as: BackgroundInvestigator }
          trigger:
            - { call: "POST /licensure/applications/${app}/emergency-permits", payload: { district_code: "D01", valid_from: "2026-12-01T00:00:00Z", valid_until: "2027-06-01T00:00:00Z" }, as: CredentialEvaluator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_BACKGROUND_HOLD'"
            - "BackgroundCheck.${bg}.status == 'FLAGGED'"
            - "BackgroundCheck.${bg}.risk_score == 60"

  # ------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: scaled_score_exactly_at_threshold_passes
        grounds:
          - calculations.test_score_scaling
          - entities.TestScore.fields.passing
        distinguishing_aspect: |
          Metric scaled_score: PRAXIS_SUBJECT raw 57 -> scaled 157 == PASSING 157; the
          threshold uses >= semantics so the exact boundary passes (raw 56 would fail).
          Reached via POST /licensure/test-scores/{id}/verify.
        test_recipe:
          setup: ["RECIPROCITY application with a REPORTED PRAXIS_SUBJECT score raw=57"]
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Lee Le", email: "lee@x.com", date_of_birth: "1995-05-05T00:00:00Z", ssn_last4: "5656", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap}", pathway: "RECIPROCITY", subject_area: "MATHEMATICS", grade_band: "G7_12" }, as: Applicant, as_user_id: "${ap}", captures: { app: $.data.id } }
            - { call: "POST /licensure/applications/${app}/test-scores", payload: { exam_code: "PRAXIS_SUBJECT", raw_score: 57, tested_on: "2026-07-01T00:00:00Z" }, as: Applicant, as_user_id: "${ap}", captures: { ts: $.data.id } }
          trigger:
            - { call: "POST /licensure/test-scores/${ts}/verify", payload: { verification_status: "VERIFIED" }, as: CredentialEvaluator, captures: { scaled: $.data.scaled_score, passing: $.data.passing } }
          assert:
            - "TestScore.${ts}.scaled_score == 157"
            - "TestScore.${ts}.passing == true"

      - name: zero_deficiency_full_reciprocity_skips_plan
        grounds:
          - calculations.deficiency_credit_computation
          - calculations.reciprocity_equivalency_mapping
          - state_machines.CredentialApplication.EVALUATION_to_BACKGROUND_REVIEW
        distinguishing_aspect: |
          Metric deficiency_hours_required at the zero/empty boundary (different metric
          than scaled_score): RECIPROCITY FULL maps to 0 deficiency, so EVALUATION ->
          BACKGROUND_REVIEW succeeds with NO DeficiencyPlan ever created — reached via
          POST /licensure/applications/{id}/state, a different endpoint than test-score verify.
        test_recipe:
          setup: ["RECIPROCITY application with TX/STANDARD DETERMINISTIC evaluation (FULL, 0), one VERIFIED transcript, CLEARED background"]
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Meg Me", email: "meg@x.com", date_of_birth: "1987-08-08T00:00:00Z", ssn_last4: "7878", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap}", pathway: "RECIPROCITY", subject_area: "MATHEMATICS", grade_band: "G7_12" }, as: Applicant, as_user_id: "${ap}", captures: { app: $.data.id } }
            - { call: "POST /licensure/applications/${app}/fee-payment", payload: { payment_token: "tok_1" }, as: Applicant, as_user_id: "${ap}" }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "INTAKE_REVIEW" }, as: IntakeOfficer }
            - { call: "POST /licensure/applications/${app}/reciprocity-evaluations", payload: { source_state: "TX", source_license_type: "STANDARD", years_teaching: 2 }, as: CredentialEvaluator, captures: { re: $.data.id } }
            - { call: "POST /licensure/reciprocity-evaluations/${re}/finalize", payload: { mapping_mode: "DETERMINISTIC" }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "EVALUATION" }, as: IntakeOfficer }
            - { call: "POST /licensure/applications/${app}/transcripts", payload: { institution_name: "TX State", degree_level: "BACHELORS", total_semester_hours: 120, courses: [ { course_code: "MATH101", credit_hours: 3, letter_grade: "A" } ] }, as: Applicant, as_user_id: "${ap}", captures: { tr: $.data.id } }
            - { call: "POST /licensure/transcripts/${tr}/verify", payload: { verification_status: "VERIFIED", subject_relevant_hours: 18 }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/background-checks", payload: { adverse_findings: [] }, as: BackgroundInvestigator, captures: { bg: $.data.id } }
            - { call: "POST /licensure/background-checks/${bg}/state", payload: { to_status: "PRINTS_SUBMITTED", fingerprint_submitted_at: "2026-08-05T00:00:00Z" }, as: BackgroundInvestigator }
          trigger:
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "BACKGROUND_REVIEW" }, as: CredentialEvaluator, captures: { def_hours: $.data.deficiency_hours_required } }
          assert:
            - "CredentialApplication.${app}.status == 'BACKGROUND_REVIEW'"
            - "CredentialApplication.${app}.deficiency_hours_required == 0"

  # ------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: application_blocked_until_background_cleared
        grounds:
          - state_machines.CredentialApplication.BACKGROUND_REVIEW_to_PENDING_DECISION
          - state_machines.BackgroundCheck.ADJUDICATION_to_CLEARED
          - errors[ERR_BACKGROUND_NOT_CLEARED]
        distinguishing_aspect: |
          Pair CredentialApplication x BackgroundCheck: BACKGROUND_REVIEW -> PENDING_DECISION
          is rejected while the check is FLAGGED, and the identical call succeeds after the
          check is adjudicated CLEARED.
        test_recipe:
          setup: ["RECIPROCITY FULL application in BACKGROUND_REVIEW; background check FLAGGED (MISDEMEANOR_DRUG conviction ~2y old: 40 x 1.0 = 40, not < 40)"]
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Ned Ne", email: "ned@x.com", date_of_birth: "1986-03-03T00:00:00Z", ssn_last4: "9090", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap}", pathway: "RECIPROCITY", subject_area: "MATHEMATICS", grade_band: "G7_12" }, as: Applicant, as_user_id: "${ap}", captures: { app: $.data.id } }
            - { call: "POST /licensure/applications/${app}/fee-payment", payload: { payment_token: "tok_1" }, as: Applicant, as_user_id: "${ap}" }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "INTAKE_REVIEW" }, as: IntakeOfficer }
            - { call: "POST /licensure/applications/${app}/reciprocity-evaluations", payload: { source_state: "TX", source_license_type: "STANDARD", years_teaching: 5 }, as: CredentialEvaluator, captures: { re: $.data.id } }
            - { call: "POST /licensure/reciprocity-evaluations/${re}/finalize", payload: { mapping_mode: "DETERMINISTIC" }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "EVALUATION" }, as: IntakeOfficer }
            - { call: "POST /licensure/applications/${app}/transcripts", payload: { institution_name: "TX State", degree_level: "BACHELORS", total_semester_hours: 120, courses: [ { course_code: "MATH101", credit_hours: 3, letter_grade: "A" } ] }, as: Applicant, as_user_id: "${ap}", captures: { tr: $.data.id } }
            - { call: "POST /licensure/transcripts/${tr}/verify", payload: { verification_status: "VERIFIED", subject_relevant_hours: 18 }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/background-checks", payload: { adverse_findings: [ { offense_category: "MISDEMEANOR_DRUG", offense_date: "2024-08-01T00:00:00Z", disposition: "CONVICTION" } ] }, as: BackgroundInvestigator, captures: { bg: $.data.id } }
            - { call: "POST /licensure/background-checks/${bg}/state", payload: { to_status: "PRINTS_SUBMITTED", fingerprint_submitted_at: "2026-08-05T00:00:00Z" }, as: BackgroundInvestigator }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "BACKGROUND_REVIEW" }, as: CredentialEvaluator }
          trigger:
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "PENDING_DECISION" }, as: BackgroundInvestigator, captures: { err: $.data.error_id } }
            - { call: "POST /licensure/background-checks/${bg}/state", payload: { to_status: "ADJUDICATION" }, as: LegalOfficer }
            - { call: "POST /licensure/background-checks/${bg}/state", payload: { to_status: "CLEARED" }, as: LegalOfficer }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "PENDING_DECISION" }, as: BackgroundInvestigator }
          assert:
            - "first advance error_id == 'ERR_BACKGROUND_NOT_CLEARED'"
            - "after adjudication CredentialApplication.${app}.status == 'PENDING_DECISION'"
            - "BackgroundCheck.${bg}.risk_score == 40"

      - name: reinstate_requires_restoration_audit_passed
        grounds:
          - state_machines.License.EXPIRED_to_ACTIVE
          - state_machines.CEAudit.UNDER_REVIEW_to_PASSED
          - errors[ERR_AUDIT_NOT_PASSED]
        distinguishing_aspect: |
