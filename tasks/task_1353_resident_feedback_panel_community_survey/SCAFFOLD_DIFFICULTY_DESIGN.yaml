  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: incentive_pool_authorize_pay_forfeit_conservation
        grounds:
          - entities.SurveyWave.fields.incentive_pool_available_cents
          - state_machines.IncentiveAward."payout UNPAID_to_payout AUTHORIZED"
          - state_machines.IncentiveAward."payout AUTHORIZED_to_payout PAID"
          - state_machines.IncentiveAward."payout AUTHORIZED_to_payout FORFEITED"
        distinguishing_aspect: |
          Conserved quantity: cents. For every award transition the wave's three pool
          buckets keep available + reserved + paid == incentive_pool_total_cents
          (50000): authorize moves available->reserved, pay moves reserved->paid,
          forfeit moves reserved->available; literal buckets asserted after each hop.
        test_recipe:
          setup:
            - "Cell target 10; P1,P2 ACTIVE locale en; locked instrument; wave FIELDING pool 50000 base 1000"
            - "Both respond (100%, 300s -> 2000 each) and are ACCEPTED; awards ELIGIBLE/UNPAID"
          setup_api_calls:
            - { call: "POST /feedback-panel/panel-cells", payload: { age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", target_size: 10 }, as: PanelManager, captures: { c1_id: $.data.id } }
