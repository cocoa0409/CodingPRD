            - "the REPAIR decision returns 200: Permit.${repair_permit_id}.status == ISSUED with issued_at == 2026-08-05T13:00:00Z"
            - "Dam.${dam_id}.regulatory_status == REGISTERED (only a REMOVAL permit would move it)"
