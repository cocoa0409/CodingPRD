            - "The filtered list returns HTTP 200 with total_count == 1, has_more == false and data[0].id == ${heat_id}"
            - "The review returns HTTP 200 with status == REJECTED and ${hv2} == 2"
            - "GET /material-heats?status=QUARANTINE now returns total_count == 0 while GET /material-heats?status=REJECTED returns total_count == 1"

