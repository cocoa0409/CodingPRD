            - { call: "POST /glass/programs/${p_id}/execute-nda", payload: { nda_reference: "NDA-001" }, as: ProgramManager }
            - { call: "POST /glass/compositions", payload: { program_id: "${p_id}", composition_code: "GX-100", complexity_multiplier: 1.0 }, as: ProgramManager, captures: { cx1_id: $.data.id } }
            - { call: "POST /glass/qual-cycles", payload: { composition_id: "${cx1_id}", test_plan_ref: "TP-1" }, as: ProgramManager, captures: { q_id: $.data.id } }
            - { call: "POST /glass/qual-cycles/${q_id}/begin-testing", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/qual-cycles/${q_id}/record-result", payload: { outcome: "PASSED" }, as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/compositions", payload: { program_id: "${p_id}", composition_code: "GX-300", complexity_multiplier: 1.0 }, as: ProgramManager, captures: { cx2_id: $.data.id } }
            - { call: "GET /glass/programs/${p_id}", as: ProgramManager, captures: { p_v: $.data.version } }
            - { call: "POST /glass/commitments", payload: { program_id: "${p_id}", committed_units: 5000, required_units: 5000, prepayment_cents: 2500000, expected_program_version: "${p_v}" }, as: ProgramManager, captures: { c_id: $.data.id } }
            - { call: "POST /glass/commitments/${c_id}/sign", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/commitments/${c_id}/countersign", as: CapacityPlanner, as_user_id: "planner-01" }
            - { call: "POST /glass/commitments/${c_id}/confirm-prepayment", as: FinanceController, as_user_id: "fin-01" }
            - { call: "POST /glass/tanks", payload: { commitment_id: "${c_id}", capacity_units_per_day: 1000 }, as: CapacityPlanner, captures: { t_id: $.data.id } }
            - { call: "POST /glass/_clock/set_current_utc", payload: { to_iso8601: "2028-02-23T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /glass/tanks/${t_id}/commission", as: CapacityPlanner }
            - { call: "POST /glass/campaigns", payload: { tank_id: "${t_id}", composition_id: "${cx1_id}", start_date: "2028-03-01T00:00:00Z", end_date: "2029-03-01T00:00:00Z", planned_units: 10000 }, as: CapacityPlanner, captures: { camp_a: $.data.id } }
          trigger:
            - { call: "POST /glass/campaigns", payload: { tank_id: "${t_id}", composition_id: "${cx2_id}", start_date: "2028-06-01T00:00:00Z", end_date: "2029-06-01T00:00:00Z", planned_units: 10000 }, as: CapacityPlanner, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TANK_SCHEDULE_CONFLICT with http 422 (temporal priority 13 pre-empts referential priority 17 even though composition GX-300 is EXPERIMENTAL)"
            - "no second campaign exists on the tank"

  - rule_id: boundary_precision_check
    instances:
      - name: freeze_design_at_exact_deadline_succeeds
        grounds:
          - validations[priority=11]
          - state_machines.Program.QUALIFICATION_to_DESIGN_FROZEN
          - errors[ERR_DESIGN_FREEZE_PASSED]
        distinguishing_aspect: |
          Metric = timestamp on the freeze-design endpoint. The rule is an inclusive
          <= against design_freeze_date: at exactly 2027-03-01T00:00:00Z the freeze
          succeeds; one second later it must fail (companion corner instance covers
          the failure side).
        test_recipe:
          setup:
            - "Program in QUALIFICATION with design_freeze_date == 2027-03-01T00:00:00Z and one QUALIFIED composition"
            - "Logical clock set to exactly the deadline"
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Acme Devices", region: "US" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /glass/programs", payload: { device_maker_id: "${m_id}", name: "Eagle", primary_market: "CONSUMER_ELECTRONICS" }, as: ProgramManager, captures: { p_id: $.data.id } }
            - { call: "POST /glass/programs/${p_id}/execute-nda", payload: { nda_reference: "NDA-001" }, as: ProgramManager }
            - { call: "POST /glass/compositions", payload: { program_id: "${p_id}", composition_code: "GX-100", complexity_multiplier: 1.0 }, as: ProgramManager, captures: { cx_id: $.data.id } }
            - { call: "POST /glass/qual-cycles", payload: { composition_id: "${cx_id}", test_plan_ref: "TP-1" }, as: ProgramManager, captures: { q_id: $.data.id } }
            - { call: "POST /glass/qual-cycles/${q_id}/begin-testing", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/qual-cycles/${q_id}/record-result", payload: { outcome: "PASSED" }, as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/programs/${p_id}/begin-qualification", payload: { design_freeze_date: "2027-03-01T00:00:00Z" }, as: ProgramManager }
            - { call: "POST /glass/_clock/set_current_utc", payload: { to_iso8601: "2027-03-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /glass/programs/${p_id}/freeze-design", as: ProgramManager, captures: { p_status: $.data.status } }
          assert:
            - "Program.${p_id}.status == DESIGN_FROZEN (clock == design_freeze_date exactly satisfies the inclusive boundary)"
            - "http 200, no error"

      - name: campaign_min_length_exactly_365_days_succeeds
        grounds:
          - validations[priority=12]
          - calculations.yield_learning_curve
          - errors[ERR_INVALID_CAMPAIGN_WINDOW]
        distinguishing_aspect: |
          Metric = integer campaign length in days on the campaign-create endpoint
          (distinct metric and endpoint from the freeze-deadline timestamp). A window
          of exactly CONST.MIN_CAMPAIGN_DAYS = 365 days is allowed (>= semantics);
          the companion corner instance shows 364 days rejected.
