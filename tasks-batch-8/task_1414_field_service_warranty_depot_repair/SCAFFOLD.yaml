scenario: 'Field Service & Warranty Depot Repair (OEM depot repair center): RMA authorization & inbound triage, warranty eligibility
  by serial/purchase date, repair vs replace decision & cost threshold, loaner/advance-exchange inventory, parts consumption
  & failure code capture, turnaround SLA & customer notification, out-of-warranty quote & approval, recurring-failure escalation
  to engineering'
domain_name: field-service-warranty-depot-repair
api_prefix: /depot
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
  - optimistic_concurrency
  - cascading_side_effects
  - dual_variant_calculation
  - rate_threshold_triggers
  - selector_policy
  - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
  - one_to_many
  - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\"\
    : \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\"\
    \ } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: Customer
  parent: null
  common_fields: true
  fields:
  - name: name
    type: string
    source: input
    description: Customer display name
  - name: email
    type: string
    source: input
    description: Notification recipient address; unique
  - name: credit_limit_cents
    type: integer
    source: input
    default: 100000
    description: Max outstanding loaner deposit exposure allowed
  - name: loyalty_tier
    type: enum
    source: input
    default: STANDARD
    description: STANDARD | PREFERRED — informational only; settlement tier is computed from gross, not this flag
  - name: deposit_exposure_cents
    type: integer
    source: computed
    default: 0
    description: Sum of deposit_value_cents over this customer's LoanerReservations in {RESERVED, SHIPPED}
- name: ProductModel
  parent: null
  common_fields: true
  fields:
  - name: model_code
    type: string
    source: input
    description: Unique OEM model code
  - name: description
    type: string
    source: input
    description: Model description
  - name: standard_warranty_days
    type: integer
    source: input
    description: Warranty length in calendar days from basis date
  - name: registration_bonus_days
    type: integer
    source: input
    default: 30
    description: Extra days granted when a RETAIL unit has registration_date
  - name: replacement_cost_cents
    type: integer
    source: input
    description: Full replacement unit cost; basis of repair-vs-replace threshold
  - name: flat_rate_repair_cents
    type: integer
    source: input
    description: Book-rate provisional repair estimate used before diagnosis
  - name: labor_rate_cents_per_minute
    type: integer
    source: input
    description: Labor billing rate per minute
  - name: replace_threshold_pct
    type: integer
    source: input
    description: REPLACE when final estimate >= this percent of replacement_cost_cents
  - name: sla_turnaround_business_days
    type: integer
    source: input
    description: Depot turnaround SLA in business days from receive to ship
  - name: loaner_grace_days
    type: integer
    source: input
    default: 10
    description: Free calendar days after repaired-unit ship before loaner late fees accrue
  - name: recurring_failure_threshold
    type: integer
    source: input
    default: 3
    description: recurring_failure_score at-or-above which an EngineeringEscalation auto-opens
  - name: quote_valid_days
    type: integer
    source: input
    default: 14
    description: Calendar days a SENT quote remains approvable
  - name: containment_flag
    type: boolean
    source: system
    default: false
    description: True while an EngineeringEscalation for this model is CONTAINMENT_ACTIVE; blocks replacement shipment
- name: Unit
  parent: null
  common_fields: true
  fields:
  - name: serial_number
    type: string
    source: input
    description: Unique device serial (global uniqueness)
  - name: model_id
    type: string
    source: input
    description: FK -> ProductModel.id
  - name: customer_id
    type: string
    source: input
    description: FK -> Customer.id; owning customer
  - name: channel
    type: enum
    source: input
    description: RETAIL | ENTERPRISE — selects warranty basis date
  - name: purchase_date
    type: string
    source: input
    description: ISO date of customer purchase (RETAIL warranty basis)
  - name: ship_date
    type: string
    source: input
    description: ISO date OEM shipped to enterprise (ENTERPRISE warranty basis)
  - name: registration_date
    type: string
    source: input
    description: ISO date of optional product registration; grants bonus days on RETAIL channel
    default: null
  - name: disposition
    type: enum
    source: system
    default: ACTIVE
    description: ACTIVE | SCRAPPED — set when an RMA scraps the unit
- name: ServiceRMA
  parent: null
  common_fields: true
  fields:
  - name: rma_number
    type: string
    source: system
    description: Human reference RMA-<zero-padded sequence>, assigned at creation
  - name: customer_id
    type: string
    source: input
    description: FK -> Customer.id
  - name: unit_id
    type: string
    source: input
    description: FK -> Unit.id
  - name: service_option
    type: enum
    source: input
    default: STANDARD
    description: STANDARD | LOANER | ADVANCE_EXCHANGE
  - name: reported_issue
    type: string
    source: input
    description: Customer-reported symptom text
  - name: status
    type: enum
    source: system
    description: DRAFT | AUTHORIZED | RECEIVED | TRIAGED | DIAGNOSED | AWAITING_QUOTE_APPROVAL | QUOTE_DECLINED | IN_REPAIR
      | AWAITING_PARTS | QA_HOLD | READY_TO_SHIP | REPLACEMENT_PENDING | SHIPPED | CLOSED | SCRAPPED | CANCELLED
  - name: coverage_path
    type: enum
    source: system
    description: IN_WARRANTY | OUT_OF_WARRANTY | GOODWILL_FULL | GOODWILL_PARTIAL — pinned at authorize, mutated only by warranty-override
  - name: warranty_end_date_used
    type: string
    source: system
    description: ISO warranty end date computed at authorize and pinned on the RMA
  - name: goodwill_pct
    type: integer
    source: system
    default: 0
    description: Discount percent applied to quotes when coverage_path == GOODWILL_PARTIAL
  - name: warranty_override_by
    type: string
    source: system
    description: X-User-ID of WarrantyAdministrator who granted goodwill; null when none
    default: null
  - name: provisional_estimate_cents
    type: integer
    source: system
    description: Flat-rate estimate pinned at authorize
  - name: final_estimate_cents
    type: integer
    source: system
    description: Diagnosis-based estimate (labor + raw planned parts); null until diagnose
    default: null
  - name: decision
    type: enum
    source: system
    description: REPAIR | REPLACE — computed at diagnose; null until then
    default: null
  - name: decision_overridden
    type: boolean
    source: system
    default: false
    description: True when DepotManager override-decision changed the computed decision
  - name: repairability
    type: enum
    source: system
    description: REPAIRABLE | BER (beyond economical repair); null until diagnose
    default: null
  - name: labor_minutes_est
    type: integer
    source: system
    description: Diagnosed labor minutes; null until diagnose
    default: null
  - name: planned_parts
    type: array
    source: system
    default: []
    description: Snapshot array of {part_id, quantity} from diagnose; drives AWAITING_PARTS resume matching
  - name: diagnosed_by
    type: string
    source: system
    description: X-User-ID of diagnosing DepotTechnician; null until diagnose
    default: null
  - name: repair_completed_by
    type: string
    source: system
    description: X-User-ID of technician who called repair-complete; null until then
    default: null
  - name: primary_failure_code_id
    type: string
    source: system
    description: FK -> FailureCode.id; pinned at triage
    default: null
  - name: bay_id
    type: string
    source: system
    description: FK -> DepotBay.id; booked repair bench
    default: null
  - name: bay_start_date
    type: string
    source: system
    description: ISO date, inclusive bay booking start
    default: null
  - name: bay_end_date
    type: string
    source: system
    description: ISO date, inclusive bay booking end
    default: null
  - name: authorized_at
    type: datetime
    source: system
    description: Logical-clock timestamp of authorize
    default: null
  - name: received_at
    type: datetime
    source: system
    description: Logical-clock timestamp of receive; SLA anchor
    default: null
  - name: shipped_at
    type: datetime
    source: system
    default: null
    description: Logical-clock timestamp of ship
  - name: closed_at
    type: datetime
    source: system
    default: null
    description: Logical-clock timestamp of close
  - name: sla_pause_intervals
    type: array
    source: system
    default: []
    description: Array of {from, to} half-open ISO datetime intervals while in AWAITING_QUOTE_APPROVAL or QUOTE_DECLINED
  - name: sla_breached
    type: boolean
    source: system
    default: false
    description: Set by run_daily_close when net business days exceed model SLA
  - name: engineering_review_pending
    type: boolean
    source: system
    default: false
    description: True while a recurring-failure escalation requires engineering review; gates qa-release PASS
  - name: rework_count
    type: integer
    source: system
    default: 0
    description: Number of QA_HOLD -> IN_REPAIR rework loops
  - name: return_reason
    type: enum
    source: system
    description: REPAIRED | REPLACED | UNREPAIRED — pinned at ship
    default: null
  - name: current_quote_id
    type: string
    source: system
    description: FK -> Quote.id; latest non-superseded quote; null when none
    default: null
  - name: settlement_gross_cents
    type: integer
    source: system
    description: Gross customer charge computed at close; null until close
    default: null
  - name: settlement_loyalty_credit_cents
    type: integer
    source: system
    description: Tiered loyalty credit computed at close; null until close
    default: null
  - name: settlement_total_cents
    type: integer
    source: system
    description: Net customer charge computed at close; null until close
    default: null
- name: Quote
  parent: null
  common_fields: true
  fields:
  - name: rma_id
    type: string
    source: system
    description: FK -> ServiceRMA.id
  - name: quote_seq
    type: integer
    source: system
    description: 1-based per-RMA quote sequence; increments on each revision
  - name: status
    type: enum
    source: system
    description: SENT | APPROVED | DECLINED | EXPIRED | SUPERSEDED
  - name: lines
    type: array
    source: system
    description: Snapshot array of {part_id, quantity, unit_cost_cents, line_total_cents}; per-line rounding applied at creation
  - name: labor_minutes
    type: integer
    source: system
    description: Labor minutes billed on this quote
  - name: labor_cents
    type: integer
    source: system
    description: round_half_up(labor_minutes * model.labor_rate_cents_per_minute)
  - name: parts_subtotal_cents
    type: integer
    source: system
    description: Sum of per-line rounded line_total_cents
  - name: discount_pct
    type: integer
    source: system
    description: Discount percent applied (goodwill_pct or explicit input)
  - name: discount_cents
    type: integer
    source: system
    description: round_half_up(subtotal * discount_pct / 100)
  - name: taxable_cents
    type: integer
    source: system
    description: subtotal - discount_cents
  - name: tax_cents
    type: integer
    source: system
    description: round_half_up(taxable_cents * 8%)
  - name: expedite
    type: boolean
    source: system
    default: false
    description: Expedite flag adds flat expedite fee
  - name: expedite_fee_cents
    type: integer
    source: system
    default: 0
    description: 7500 when expedite else 0
  - name: total_cents
    type: integer
    source: system
    description: taxable_cents + tax_cents + expedite_fee_cents
  - name: sent_at
    type: datetime
    source: system
    description: Logical-clock timestamp when quote became SENT
  - name: expires_at
    type: datetime
    source: system
    description: sent_at + model.quote_valid_days; approve after this -> ERR_QUOTE_EXPIRED
  - name: decided_at
    type: datetime
    source: system
    default: null
    description: Timestamp of approve/decline
  - name: payment_reference
    type: string
    source: system
    default: null
    description: Payment handle captured at approve
- name: RepairLine
  parent: null
  common_fields: true
  fields:
  - name: rma_id
    type: string
    source: system
    description: FK -> ServiceRMA.id
  - name: part_id
    type: string
    source: input
    description: FK -> Part.id
  - name: failure_code_id
    type: string
    source: input
    description: FK -> FailureCode.id attributed to this consumption
  - name: quantity
    type: integer
    source: input
    description: Units consumed; must be >= 1
  - name: unit_cost_cents
    type: integer
    source: system
    description: Part.unit_cost_cents snapshot at consumption
  - name: line_total_cents
    type: integer
    source: system
    description: quantity * unit_cost_cents (no handling; raw cost accounting)
  - name: status
    type: enum
    source: system
    description: CONSUMED | REVERSED
  - name: consumed_by
    type: string
    source: system
    description: X-User-ID of recording technician
- name: Part
  parent: null
  common_fields: true
  fields:
  - name: sku
    type: string
    source: input
    description: Unique part SKU
  - name: name
    type: string
    source: input
    description: Part name
  - name: unit_cost_cents
    type: integer
    source: input
    description: Replacement cost per unit
  - name: stock_on_hand
    type: integer
    source: computed
    description: Physical stock; decremented by consumption, incremented by restock and reversal
  - name: reorder_point
    type: integer
    source: input
    default: 0
    description: Informational low-water mark
- name: FailureCode
  parent: null
  common_fields: true
  fields:
  - name: code
    type: string
    source: input
    description: Unique failure code, e.g. F-PWR-01
  - name: description
    type: string
    source: input
    description: Failure description
  - name: severity
    type: enum
    source: input
    description: LOW | MEDIUM | HIGH | CRITICAL
- name: DepotBay
  parent: null
  common_fields: true
  fields:
  - name: bay_code
    type: string
    source: input
    description: Unique bench identifier
  - name: status
    type: enum
    source: system
    description: ACTIVE | OUT_OF_SERVICE
- name: LoanerUnit
  parent: null
  common_fields: true
  fields:
  - name: asset_tag
    type: string
    source: input
    description: Unique pool asset tag
  - name: model_id
    type: string
    source: input
    description: FK -> ProductModel.id this loaner satisfies
  - name: condition_grade
    type: enum
    source: input
    description: A | B | C — C excluded from auto-select
  - name: deposit_value_cents
    type: integer
    source: input
    description: Deposit exposure while RESERVED or SHIPPED
  - name: status
    type: enum
    source: system
    description: AVAILABLE | RESERVED | SHIPPED_OUT | INSPECTION | RETIRED
  - name: completed_loan_cycles
    type: integer
    source: system
    default: 0
    description: Count of full loan cycles; auto-select ranks ascending on this
- name: LoanerReservation
  parent: null
  common_fields: true
  fields:
  - name: rma_id
    type: string
    source: system
    description: FK -> ServiceRMA.id
  - name: loaner_unit_id
    type: string
    source: system
    description: FK -> LoanerUnit.id (explicit or selector-chosen)
  - name: mode
    type: enum
    source: system
    description: LOANER | ADVANCE_EXCHANGE — copied from ServiceRMA.service_option
  - name: start_date
    type: string
    source: input
    description: ISO date; half-open window start (inclusive)
  - name: end_date
    type: string
    source: input
    description: ISO date; half-open window end (exclusive)
  - name: status
    type: enum
    source: system
    description: RESERVED | SHIPPED | CLOSED_RETURNED | CLOSED_DAMAGED | CLOSED_FORFEITED | CANCELLED
  - name: shipped_at
    type: datetime
    source: system
    default: null
    description: Loaner ship timestamp
  - name: due_date
    type: string
    source: system
    default: null
    description: ISO date; repaired-unit ship date + model.loaner_grace_days (LOANER mode only)
  - name: returned_at
    type: datetime
    source: system
    default: null
    description: Return receive timestamp
  - name: late_fee_cents
    type: integer
    source: system
    default: 0
    description: Accrued late fee; recomputed by run_daily_close and at return/forfeit
  - name: damage_fee_cents
    type: integer
    source: system
    default: 0
    description: min(damage_assessment_cents, deposit_value_cents) on damaged return
  - name: forfeit_charge_cents
    type: integer
    source: system
    default: 0
    description: deposit_value_cents + accrued late fees on forfeit
  - name: late_notification_sent
    type: boolean
    source: system
    default: false
    description: Ensures LOANER_LATE notification fires once
- name: EngineeringEscalation
  parent: null
  common_fields: true
  fields:
  - name: rma_id
    type: string
    source: system
    description: FK -> ServiceRMA.id that triggered the escalation
  - name: model_id
    type: string
    source: system
    description: FK -> ProductModel.id (denormalized from the RMA's unit)
  - name: failure_code_id
    type: string
    source: system
    description: FK -> FailureCode.id under escalation
  - name: trigger_source
    type: enum
    source: system
    description: AUTO_RECURRING | MANUAL
  - name: status
    type: enum
    source: system
    description: OPEN | ACKNOWLEDGED | CONTAINMENT_ACTIVE | RESOLVED | MONITORING | CLOSED_FINAL
  - name: monitoring_until
    type: string
    source: system
    default: null
    description: ISO date; MONITORING auto-closes after this date
  - name: recurrence_count
    type: integer
    source: system
    default: 0
    description: Times this escalation reopened from MONITORING
  - name: resolution_note
    type: string
    source: system
    default: null
    description: Engineering resolution summary
- name: NotificationEvent
  parent: null
  common_fields: false
  fields:
  - name: rma_id
    type: string
    source: system
    description: FK -> ServiceRMA.id
  - name: event_type
    type: enum
    source: system
    description: RMA_AUTHORIZED | RECEIVED | QUOTE_SENT | QUOTE_APPROVED | QUOTE_DECLINED | QUOTE_EXPIRED | SHIPPED | SLA_BREACH
      | LOANER_LATE | ESCALATION_OPENED | CLOSED | CANCELLED
  - name: recipient
    type: string
    source: system
    description: Customer email at event time
  - name: message
    type: string
    source: system
    description: Rendered notification text
state_machines:
- entity: ServiceRMA
  initial_state: DRAFT
  terminal_states:
  - CLOSED
  - SCRAPPED
  - CANCELLED
  transitions:
  - from: DRAFT
    to: AUTHORIZED
    trigger: POST /depot/rmas/{rmaId}/authorize
    actor: IntakeAgent
    preconditions:
    - No other ServiceRMA for the same unit_id in a non-terminal state (ERR_UNIT_HAS_OPEN_RMA)
    side_effects:
    - coverage_path computed via warranty_eligibility as of logical clock date; warranty_end_date_used pinned
    - provisional_estimate_cents = model.flat_rate_repair_cents
    - authorized_at = logical clock
    - NotificationEvent RMA_AUTHORIZED created
  - from: DRAFT
    to: CANCELLED
    trigger: POST /depot/rmas/{rmaId}/cancel
    actor: Customer (owner) | IntakeAgent
    preconditions: []
    side_effects:
    - NotificationEvent CANCELLED created
  - from: AUTHORIZED
    to: RECEIVED
    trigger: POST /depot/rmas/{rmaId}/receive
    actor: IntakeAgent
    preconditions:
    - payload serial_number must equal unit.serial_number (ERR_SERIAL_MISMATCH)
    side_effects:
    - received_at = logical clock (SLA anchor)
    - NotificationEvent RECEIVED created
  - from: AUTHORIZED
    to: CANCELLED
    trigger: POST /depot/rmas/{rmaId}/cancel
    actor: Customer (owner) | IntakeAgent
    preconditions: []
    side_effects:
    - Each LoanerReservation for this RMA in RESERVED -> CANCELLED; its LoanerUnit RESERVED -> AVAILABLE; customer.deposit_exposure_cents
      decremented by deposit_value_cents
    - NotificationEvent CANCELLED created
  - from: RECEIVED
    to: TRIAGED
    trigger: POST /depot/rmas/{rmaId}/triage
    actor: IntakeAgent
    preconditions:
    - primary_failure_code_id must reference an existing FailureCode (ERR_FAILURE_CODE_NOT_FOUND)
    side_effects:
    - primary_failure_code_id pinned
    - 'recurring_failure_score recomputed for (unit_id, primary_failure_code_id); if score >= model.recurring_failure_threshold
      and no escalation for (model_id, failure_code_id) in {OPEN, ACKNOWLEDGED, CONTAINMENT_ACTIVE, MONITORING}: EngineeringEscalation
      created OPEN with trigger_source AUTO_RECURRING, engineering_review_pending = true, NotificationEvent ESCALATION_OPENED
      created'
  - from: TRIAGED
    to: DIAGNOSED
    trigger: POST /depot/rmas/{rmaId}/diagnose
    actor: DepotTechnician
    preconditions:
    - Every planned_parts part_id must reference an existing Part (ERR_PART_NOT_FOUND)
    side_effects:
    - final_estimate_cents computed via repair_cost_estimate (final variant)
    - decision computed via repair_vs_replace_decision; repairability, labor_minutes_est, planned_parts, diagnosed_by pinned
    - 'System auto-routes in the same request: decision==REPAIR and coverage_path in {IN_WARRANTY, GOODWILL_FULL} -> IN_REPAIR;
      decision==REPAIR and coverage_path in {OUT_OF_WARRANTY, GOODWILL_PARTIAL} -> AWAITING_QUOTE_APPROVAL (auto-create Quote
      SENT quote_seq=1 from planned parts + labor, goodwill_pct as discount_pct; NotificationEvent QUOTE_SENT; SLA pause interval
      opens); decision==REPLACE -> REPLACEMENT_PENDING'
  - from: DIAGNOSED
    to: IN_REPAIR
    trigger: system (auto-route after diagnose or override-decision)
    actor: system
    preconditions:
    - decision == REPAIR
    - coverage_path IN {IN_WARRANTY, GOODWILL_FULL}
    side_effects: []
  - from: DIAGNOSED
    to: AWAITING_QUOTE_APPROVAL
    trigger: system (auto-route after diagnose or override-decision)
    actor: system
    preconditions:
    - decision == REPAIR
    - coverage_path IN {OUT_OF_WARRANTY, GOODWILL_PARTIAL}
    side_effects:
    - Quote auto-created SENT
    - SLA pause interval opens
  - from: DIAGNOSED
    to: REPLACEMENT_PENDING
    trigger: system (auto-route after diagnose or override-decision)
    actor: system
    preconditions:
    - decision == REPLACE
    side_effects: []
  - from: REPLACEMENT_PENDING
    to: DIAGNOSED
    trigger: POST /depot/rmas/{rmaId}/override-decision with new_decision=REPAIR
    actor: DepotManager
    preconditions:
    - actor X-User-ID != diagnosed_by (ERR_SEGREGATION_OF_DUTIES)
    side_effects:
    - decision = REPAIR; decision_overridden = true
    - 'Auto-route re-fires: coverage in {IN_WARRANTY, GOODWILL_FULL} -> IN_REPAIR; else -> AWAITING_QUOTE_APPROVAL with auto-created
      Quote'
  - from: AWAITING_QUOTE_APPROVAL
    to: DIAGNOSED
    trigger: POST /depot/rmas/{rmaId}/override-decision with new_decision=REPLACE
    actor: DepotManager
    preconditions:
    - actor X-User-ID != diagnosed_by (ERR_SEGREGATION_OF_DUTIES)
    - current quote (if any) must not be APPROVED (ERR_INVALID_RMA_STATE)
    side_effects:
    - decision = REPLACE; decision_overridden = true
    - SENT quote (if any) -> SUPERSEDED; current_quote_id cleared
    - Auto-route re-fires to REPLACEMENT_PENDING; SLA pause interval closes
  - from: AWAITING_QUOTE_APPROVAL
    to: IN_REPAIR
    trigger: POST /depot/quotes/{quoteId}/approve
    actor: Customer (owner)
    preconditions:
    - quote.rma_id == this RMA and quote is the current_quote (else ERR_QUOTE_NOT_FOUND / ERR_INVALID_QUOTE_STATE)
    - quote.status == SENT (ERR_INVALID_QUOTE_STATE)
    - logical clock <= quote.expires_at (ERR_QUOTE_EXPIRED)
    - payment_reference present (ERR_PAYMENT_REQUIRED)
    side_effects:
    - quote.status -> APPROVED; decided_at, payment_reference pinned
    - SLA pause interval closes (paused interval appended to sla_pause_intervals)
    - NotificationEvent QUOTE_APPROVED created
  - from: AWAITING_QUOTE_APPROVAL
    to: QUOTE_DECLINED
    trigger: POST /depot/quotes/{quoteId}/decline
    actor: Customer (owner)
    preconditions:
    - quote.status == SENT (ERR_INVALID_QUOTE_STATE)
    side_effects:
    - quote.status -> DECLINED; decided_at pinned
    - NotificationEvent QUOTE_DECLINED created (SLA pause remains open)
  - from: QUOTE_DECLINED
    to: AWAITING_QUOTE_APPROVAL
    trigger: POST /depot/rmas/{rmaId}/quotes (revised quote)
    actor: DepotTechnician
    preconditions:
    - expected_rma_version == ServiceRMA.version (ERR_STALE_RMA_VERSION)
    - latest quote status IN {DECLINED, EXPIRED} (ERR_INVALID_QUOTE_STATE)
    side_effects:
    - previous latest quote -> SUPERSEDED
    - new Quote created SENT with quote_seq = prior + 1, totals via quote_total
    - increments ServiceRMA.version by 1
    - NotificationEvent QUOTE_SENT created
  - from: AWAITING_QUOTE_APPROVAL
    to: AWAITING_QUOTE_APPROVAL
    trigger: POST /depot/rmas/{rmaId}/quotes (depot-side revision of SENT or EXPIRED quote)
    actor: DepotTechnician
    preconditions:
    - expected_rma_version == ServiceRMA.version (ERR_STALE_RMA_VERSION)
    - latest quote status IN {SENT, EXPIRED} (ERR_INVALID_QUOTE_STATE)
    side_effects:
    - previous latest quote -> SUPERSEDED
    - new Quote created SENT with quote_seq = prior + 1
    - increments ServiceRMA.version by 1
    - NotificationEvent QUOTE_SENT created
  - from: QUOTE_DECLINED
    to: READY_TO_SHIP
    trigger: POST /depot/rmas/{rmaId}/return-unrepaired
    actor: IntakeAgent
    preconditions: []
    side_effects:
    - return_reason = UNREPAIRED
    - SLA pause interval closes
  - from: QUOTE_DECLINED
    to: SCRAPPED
    trigger: POST /depot/rmas/{rmaId}/scrap
    actor: DepotManager
    preconditions:
    - warranty_override_by is null OR actor X-User-ID != warranty_override_by (ERR_SEGREGATION_OF_DUTIES)
    side_effects:
    - Unit.disposition -> SCRAPPED
    - SLA pause interval closes
    - settlement fields computed via settlement_total (loaner fees only)
  - from: IN_REPAIR
    to: AWAITING_PARTS
    trigger: POST /depot/rmas/{rmaId}/await-parts
    actor: DepotTechnician
    preconditions: []
    side_effects: []
  - from: AWAITING_PARTS
    to: IN_REPAIR
    trigger: system (auto on POST /depot/parts/{partId}/restock when restocked part is in this RMA's planned_parts)
    actor: system
    preconditions: []
    side_effects:
    - All matching AWAITING_PARTS RMAs resume in created_at ASC order
  - from: IN_REPAIR
    to: QA_HOLD
    trigger: POST /depot/rmas/{rmaId}/repair-complete
    actor: DepotTechnician
    preconditions:
    - At least one RepairLine with status CONSUMED exists for this RMA (ERR_NO_WORK_RECORDED)
    side_effects:
    - repair_completed_by = actor X-User-ID
  - from: QA_HOLD
    to: READY_TO_SHIP
    trigger: POST /depot/rmas/{rmaId}/qa-release with outcome=PASS
    actor: DepotTechnician
    preconditions:
    - actor X-User-ID != repair_completed_by (ERR_SEGREGATION_OF_DUTIES)
    - engineering_review_pending == false (ERR_ENGINEERING_REVIEW_PENDING)
    side_effects:
    - bay booking released for future overlap checks (window kept for audit)
  - from: QA_HOLD
    to: IN_REPAIR
    trigger: POST /depot/rmas/{rmaId}/qa-release with outcome=FAIL
    actor: DepotTechnician
    preconditions:
    - actor X-User-ID != repair_completed_by (ERR_SEGREGATION_OF_DUTIES)
    side_effects:
    - rework_count += 1
  - from: READY_TO_SHIP
    to: SHIPPED
    trigger: POST /depot/rmas/{rmaId}/ship
    actor: DepotTechnician
    preconditions: []
    side_effects:
    - shipped_at = logical clock; return_reason = REPAIRED if set null and decision was REPAIR, else keeps UNREPAIRED
    - 'For each LOANER-mode LoanerReservation in SHIPPED: due_date = ship date + model.loaner_grace_days'
    - NotificationEvent SHIPPED created
  - from: REPLACEMENT_PENDING
    to: SHIPPED
    trigger: POST /depot/rmas/{rmaId}/ship
    actor: DepotTechnician
    preconditions:
    - unit's ProductModel.containment_flag == false (ERR_MODEL_CONTAINMENT)
    - 'If service_option == ADVANCE_EXCHANGE: an ADVANCE_EXCHANGE LoanerReservation for this RMA exists in status SHIPPED
      (ERR_EXCHANGE_NOT_FULFILLED)'
    side_effects:
    - shipped_at = logical clock; return_reason = REPLACED
    - 'For each LOANER-mode LoanerReservation in SHIPPED: due_date = ship date + model.loaner_grace_days'
    - NotificationEvent SHIPPED created
  - from: SHIPPED
    to: CLOSED
    trigger: POST /depot/rmas/{rmaId}/close
    actor: IntakeAgent | DepotManager
    preconditions:
    - No LoanerReservation for this RMA in {RESERVED, SHIPPED} (ERR_LOANER_OUTSTANDING)
    side_effects:
    - closed_at = logical clock
    - settlement_gross_cents / settlement_loyalty_credit_cents / settlement_total_cents computed via settlement_total
    - recurring_failure_score recomputed; matching MONITORING EngineeringEscalation for (model_id, primary_failure_code_id)
      reopens to OPEN with recurrence_count += 1
    - NotificationEvent CLOSED created
  - from: AUTHORIZED
    to: CANCELLED
    trigger: system (run_daily_close when authorized_at older than 30 calendar days and never received)
    actor: system
    preconditions: []
    side_effects:
    - LoanerReservations in RESERVED -> CANCELLED; their LoanerUnits -> AVAILABLE; deposit exposure released
    - NotificationEvent CANCELLED created
- entity: Quote
  initial_state: SENT
  terminal_states:
  - APPROVED
  - DECLINED
  - EXPIRED
  - SUPERSEDED
  transitions:
  - from: SENT
    to: APPROVED
    trigger: POST /depot/quotes/{quoteId}/approve
    actor: Customer (owner)
    preconditions:
    - logical clock <= expires_at (ERR_QUOTE_EXPIRED)
    - payment_reference present (ERR_PAYMENT_REQUIRED)
    side_effects:
    - RMA AWAITING_QUOTE_APPROVAL -> IN_REPAIR
    - SLA pause closes
    - NotificationEvent QUOTE_APPROVED
  - from: SENT
    to: DECLINED
    trigger: POST /depot/quotes/{quoteId}/decline
    actor: Customer (owner)
    preconditions: []
    side_effects:
    - RMA AWAITING_QUOTE_APPROVAL -> QUOTE_DECLINED
    - NotificationEvent QUOTE_DECLINED
  - from: SENT
    to: EXPIRED
    trigger: system (run_daily_close when logical clock > expires_at)
    actor: system
    preconditions: []
    side_effects:
    - NotificationEvent QUOTE_EXPIRED
    - RMA remains AWAITING_QUOTE_APPROVAL (SLA still paused)
  - from: SENT
    to: SUPERSEDED
    trigger: POST /depot/rmas/{rmaId}/quotes or override-decision to REPLACE
    actor: DepotTechnician | DepotManager
    preconditions: []
    side_effects:
    - New quote becomes current_quote with quote_seq + 1
  - from: DECLINED
    to: SUPERSEDED
    trigger: POST /depot/rmas/{rmaId}/quotes
    actor: DepotTechnician
    preconditions: []
    side_effects:
    - New quote created SENT; RMA QUOTE_DECLINED -> AWAITING_QUOTE_APPROVAL
  - from: EXPIRED
    to: SUPERSEDED
    trigger: POST /depot/rmas/{rmaId}/quotes
    actor: DepotTechnician
    preconditions: []
    side_effects:
    - New quote created SENT
- entity: LoanerUnit
  initial_state: AVAILABLE
  terminal_states:
  - RETIRED
  transitions:
  - from: AVAILABLE
    to: RESERVED
    trigger: POST /depot/rmas/{rmaId}/loaner-reservations (explicit pick or selector)
    actor: IntakeAgent
    preconditions:
    - No window overlap with existing {RESERVED, SHIPPED} reservations on this unit (ERR_LOANER_WINDOW_OVERLAP)
    - 'When loaner_unit_id omitted: selector must find an eligible unit, else ERR_LOANER_UNAVAILABLE'
    side_effects:
    - customer.deposit_exposure_cents += deposit_value_cents
  - from: RESERVED
    to: SHIPPED_OUT
    trigger: POST /depot/loaner-reservations/{reservationId}/ship
    actor: IntakeAgent
    preconditions: []
    side_effects:
    - reservation.shipped_at pinned
  - from: SHIPPED_OUT
    to: INSPECTION
    trigger: POST /depot/loaner-reservations/{reservationId}/return
    actor: IntakeAgent
    preconditions: []
    side_effects:
    - reservation closed (RETURNED or DAMAGED); customer.deposit_exposure_cents -= deposit_value_cents
  - from: INSPECTION
    to: AVAILABLE
    trigger: POST /depot/loaner-units/{loanerUnitId}/inspect with outcome=PASS
    actor: DepotTechnician
    preconditions: []
    side_effects:
    - completed_loan_cycles += 1
  - from: INSPECTION
    to: RETIRED
    trigger: POST /depot/loaner-units/{loanerUnitId}/inspect with outcome=FAIL
    actor: DepotTechnician
    preconditions: []
    side_effects: []
  - from: RESERVED
    to: AVAILABLE
    trigger: POST /depot/loaner-reservations/{reservationId}/cancel or RMA cancel cascade
    actor: IntakeAgent | system
    preconditions: []
    side_effects:
    - customer.deposit_exposure_cents -= deposit_value_cents
  - from: SHIPPED_OUT
    to: RETIRED
    trigger: POST /depot/loaner-reservations/{reservationId}/forfeit
    actor: IntakeAgent | DepotManager
    preconditions: []
    side_effects:
    - customer.deposit_exposure_cents -= deposit_value_cents; forfeit charge computed
- entity: LoanerReservation
  initial_state: RESERVED
  terminal_states:
  - CLOSED_RETURNED
  - CLOSED_DAMAGED
  - CLOSED_FORFEITED
  - CANCELLED
  transitions:
  - from: RESERVED
    to: SHIPPED
    trigger: POST /depot/loaner-reservations/{reservationId}/ship
    actor: IntakeAgent
    preconditions:
    - loaner unit status == RESERVED (desync impossible via public API; reservation state is the operative guard — ERR_INVALID_RESERVATION_STATE
      when already shipped)
    side_effects:
    - LoanerUnit RESERVED -> SHIPPED_OUT
  - from: SHIPPED
    to: CLOSED_RETURNED
    trigger: POST /depot/loaner-reservations/{reservationId}/return with condition=OK
    actor: IntakeAgent
    preconditions: []
    side_effects:
    - late_fee_cents finalized via loaner_late_fee (LOANER mode; ADVANCE_EXCHANGE return forbidden -> ERR_INVALID_RESERVATION_STATE)
    - LoanerUnit SHIPPED_OUT -> INSPECTION
    - customer.deposit_exposure_cents -= deposit_value_cents
  - from: SHIPPED
    to: CLOSED_DAMAGED
    trigger: POST /depot/loaner-reservations/{reservationId}/return with condition=DAMAGED
    actor: IntakeAgent
    preconditions: []
    side_effects:
    - late_fee_cents finalized; damage_fee_cents = min(damage_assessment_cents, deposit_value_cents)
    - LoanerUnit SHIPPED_OUT -> INSPECTION
    - customer.deposit_exposure_cents -= deposit_value_cents
  - from: SHIPPED
    to: CLOSED_FORFEITED
    trigger: POST /depot/loaner-reservations/{reservationId}/forfeit
    actor: IntakeAgent | DepotManager
    preconditions: []
    side_effects:
    - forfeit_charge_cents = deposit_value_cents + late_fee_cents
    - LoanerUnit SHIPPED_OUT -> RETIRED
    - customer.deposit_exposure_cents -= deposit_value_cents
  - from: RESERVED
    to: CANCELLED
    trigger: POST /depot/loaner-reservations/{reservationId}/cancel or RMA cancel cascade
    actor: IntakeAgent | system
    preconditions: []
    side_effects:
    - LoanerUnit RESERVED -> AVAILABLE
    - customer.deposit_exposure_cents -= deposit_value_cents
- entity: EngineeringEscalation
  initial_state: OPEN
  terminal_states:
  - CLOSED_FINAL
  transitions:
  - from: OPEN
    to: ACKNOWLEDGED
    trigger: POST /depot/engineering-escalations/{escalationId}/acknowledge
    actor: EngineeringLead
    preconditions: []
    side_effects: []
  - from: ACKNOWLEDGED
    to: CONTAINMENT_ACTIVE
    trigger: POST /depot/engineering-escalations/{escalationId}/contain
    actor: EngineeringLead
    preconditions: []
    side_effects:
    - ProductModel.containment_flag = true (blocks replacement shipment of this model)
  - from: OPEN
    to: CONTAINMENT_ACTIVE
    trigger: POST /depot/engineering-escalations/{escalationId}/contain
    actor: EngineeringLead
    preconditions: []
    side_effects:
    - ProductModel.containment_flag = true
  - from: OPEN
    to: RESOLVED
    trigger: POST /depot/engineering-escalations/{escalationId}/resolve
    actor: EngineeringLead
    preconditions: []
    side_effects:
    - engineering_review_pending cleared on all RMAs sharing (model_id, failure_code_id) of this escalation
    - ProductModel.containment_flag = false if no other CONTAINMENT_ACTIVE escalation for this model
    - Immediately transitions to MONITORING with monitoring_until = logical clock date + 90 days
  - from: ACKNOWLEDGED
    to: RESOLVED
    trigger: POST /depot/engineering-escalations/{escalationId}/resolve
    actor: EngineeringLead
    preconditions: []
    side_effects:
    - same as OPEN -> RESOLVED
  - from: CONTAINMENT_ACTIVE
    to: RESOLVED
    trigger: POST /depot/engineering-escalations/{escalationId}/resolve
    actor: EngineeringLead
    preconditions: []
    side_effects:
    - same as OPEN -> RESOLVED (containment released)
  - from: RESOLVED
    to: MONITORING
    trigger: system (automatic companion of resolve)
    actor: system
    preconditions: []
    side_effects: []
  - from: MONITORING
    to: OPEN
    trigger: system (a ServiceRMA for the same (model_id, failure_code_id) reaches CLOSED while logical clock date <= monitoring_until)
    actor: system
    preconditions: []
    side_effects:
    - recurrence_count += 1
    - NotificationEvent ESCALATION_OPENED on the triggering RMA
  - from: MONITORING
    to: CLOSED_FINAL
    trigger: system (run_daily_close when logical clock date > monitoring_until)
    actor: system
    preconditions: []
    side_effects: []
- entity: DepotBay
  initial_state: ACTIVE
  terminal_states: []
  transitions:
  - from: ACTIVE
    to: OUT_OF_SERVICE
    trigger: POST /depot/depot-bays/{bayId}/deactivate
    actor: DepotManager
    preconditions: []
    side_effects: []
  - from: OUT_OF_SERVICE
    to: ACTIVE
    trigger: POST /depot/depot-bays/{bayId}/reactivate
    actor: DepotManager
    preconditions: []
    side_effects: []
- entity: RepairLine
  initial_state: CONSUMED
  terminal_states:
  - REVERSED
  transitions:
  - from: CONSUMED
    to: REVERSED
    trigger: POST /depot/repair-lines/{repairLineId}/reverse
    actor: DepotTechnician
    preconditions:
    - RepairLine status == CONSUMED (else ERR_INVALID_LINE_STATE)
    - RMA must be in {IN_REPAIR, AWAITING_PARTS} (ERR_INVALID_RMA_STATE)
    side_effects:
    - Part.stock_on_hand += quantity (compensating restock)
concurrency_rules:
- rule_id: rma-patch-stale-version
  parent_entity: ServiceRMA
  write_endpoint: PATCH /depot/rmas/{rmaId}
  occ_field: expected_rma_version
  description: 'Updating a DRAFT ServiceRMA with an expected_rma_version that no longer

    matches ServiceRMA.version is rejected. The client''s view of the draft is

    stale (another write has advanced the version since it was observed).

    '
  error_id: ERR_STALE_RMA_VERSION
  http_status: 412
- rule_id: quote-create-supersede-stale-rma
  parent_entity: ServiceRMA
  write_endpoint: POST /depot/rmas/{rmaId}/quotes
  occ_field: expected_rma_version
  description: 'Creating a revised Quote against a ServiceRMA whose version has advanced

    since the client last observed it is rejected. A newer quote may already

    have legitimately superseded the prior one; the client''s revision base is

    therefore stale.

    '
  error_id: ERR_STALE_RMA_VERSION
  http_status: 412
- rule_id: parts-consumption-stale-rma
  parent_entity: ServiceRMA
  write_endpoint: POST /depot/rmas/{rmaId}/parts
  occ_field: expected_rma_version
  description: 'Recording a parts-consumption RepairLine with an expected_rma_version

    that does not match ServiceRMA.version is rejected; the client has not

    observed the latest consumption-driven mutations of the RMA.

    '
  error_id: ERR_STALE_RMA_VERSION
  http_status: 412
calculations:
- name: warranty_eligibility
  trigger: POST /depot/rmas/{rmaId}/authorize (as-of date = logical clock date)
  algorithm: threshold
  formula: "if unit.channel == RETAIL:\n  basis_end = unit.purchase_date + model.standard_warranty_days\n  if unit.registration_date\
    \ is not null:\n    reg_end = unit.registration_date + model.standard_warranty_days + model.registration_bonus_days\n\
    \    basis_end = max(basis_end, reg_end)\nelse:  # ENTERPRISE\n  basis_end = unit.ship_date + model.standard_warranty_days\n\
    warranty_end_date_used = basis_end\ncoverage_path = IN_WARRANTY if as_of_date <= basis_end else OUT_OF_WARRANTY\n# Boundary:\
    \ eligibility is INCLUSIVE of the final warranty day (<=).\n"
  input_set: The RMA's unit and its ProductModel; evaluated once at authorize and pinned
  precision: calendar-day granularity, dates compared as ISO dates
  variants:
  - name: purchase_basis
    when: unit.channel == RETAIL without registration_date
    difference: end = purchase_date + standard_warranty_days
  - name: enterprise_ship_basis
    when: unit.channel == ENTERPRISE
    difference: end = ship_date + standard_warranty_days; purchase_date ignored — the two bases yield different end dates
      for identical model constants
- name: repair_cost_estimate
  trigger: authorize (provisional variant) and diagnose (final variant)
  algorithm: aggregation
  formula: "provisional: estimate = model.flat_rate_repair_cents\nfinal: estimate = round_half_up(labor_minutes_est * model.labor_rate_cents_per_minute)\n\
    \                  + sum(qty * part.unit_cost_cents for each planned_parts line)\n# The final variant uses RAW part costs\
    \ (no handling uplift); quote_total\n# applies handling separately. The two variants therefore differ for the\n# same\
    \ RMA whenever labor/parts diverge from the flat book rate.\n"
  input_set: 'Provisional: model constants only. Final: diagnose payload (labor_minutes_est, planned_parts) + Part.unit_cost_cents
    snapshots'
  precision: integer cents; round_half_up on the labor term only
  variants:
  - name: provisional
    when: at authorize; stored on ServiceRMA.provisional_estimate_cents
    difference: flat book rate; no labor/parts detail
  - name: final
    when: at diagnose; stored on ServiceRMA.final_estimate_cents
    difference: labor minutes * rate + raw planned parts; drives repair_vs_replace_decision
- name: repair_vs_replace_decision
  trigger: POST /depot/rmas/{rmaId}/diagnose (and re-evaluated after override-decision)
  algorithm: threshold
  formula: "threshold_cents = floor(model.replacement_cost_cents * model.replace_threshold_pct / 100)\nif repairability ==\
    \ BER:\n  decision = REPLACE\nelif recurring_failure_score(unit_id, primary_failure_code_id, as_of=clock) >= model.recurring_failure_threshold:\n\
    \  decision = REPLACE            # lemon rule: recurring failure forces replacement\nelif final_estimate_cents >= threshold_cents:\n\
    \  decision = REPLACE            # boundary: exact equality IS replace (>=)\nelse:\n  decision = REPAIR\n"
  input_set: final_estimate_cents, repairability, recurring_failure_score of (unit, primary failure code), model constants
  constants:
    THRESHOLD_ROUNDING: floor
  precision: integer cents; comparison is >= (inclusive)
  variants: []
- name: quote_total
  trigger: Quote creation (auto at OOW diagnose; manual via POST /depot/rmas/{rmaId}/quotes)
  algorithm: tiered_pricing
  formula: '# ROUNDING ORDER IS PINNED: per-line rounding FIRST, then sum.

    for each line: line_total_cents = round_half_up(quantity * unit_cost_cents * (1 + HANDLING_PCT))

    parts_subtotal_cents = sum(line_total_cents)          # sum of already-rounded lines

    labor_cents = round_half_up(labor_minutes * model.labor_rate_cents_per_minute)

    subtotal = parts_subtotal_cents + labor_cents

    discount_cents = round_half_up(subtotal * discount_pct / 100)

    taxable_cents = subtotal - discount_cents

    tax_cents = round_half_up(taxable_cents * TAX_RATE_PCT / 100)

    expedite_fee_cents = EXPEDITE_FEE_CENTS if expedite else 0

    total_cents = taxable_cents + tax_cents + expedite_fee_cents

    # NOTE: "sum raw lines then round once" can differ by cents from the

    # pinned per-line-round-then-sum order; the pinned order is authoritative.

    '
  input_set: Quote lines {part_id, quantity, unit_cost_cents snapshot}, labor_minutes, discount_pct (goodwill_pct or input),
    expedite flag, model.labor_rate_cents_per_minute
  constants:
    HANDLING_PCT: 5
    TAX_RATE_PCT: 8
    EXPEDITE_FEE_CENTS: 7500
  precision: integer cents, round_half_up at each pinned step
  variants: []
- name: settlement_total
  trigger: POST /depot/rmas/{rmaId}/close (and scrap)
  algorithm: tiered_pricing
  formula: "# EVALUATION ORDER PINNED (circular-looking dependency):\n# (1) gross, (2) tier FROM GROSS, (3) credit, (4) net.\
    \ The tier is keyed\n# on gross BEFORE the credit; the net is never re-fed into tier selection.\ngross = (current APPROVED\
    \ quote.total_cents or 0)\n        + sum(reservation.late_fee_cents + reservation.damage_fee_cents + reservation.forfeit_charge_cents\n\
    \              over all LoanerReservations of this RMA)\ntier_pct = 10 if gross >= LOYALTY_TIER1_CENTS else (5 if gross\
    \ >= LOYALTY_TIER2_CENTS else 0)\nsettlement_loyalty_credit_cents = round_half_up(gross * tier_pct / 100)\nsettlement_total_cents\
    \ = gross - settlement_loyalty_credit_cents\nsettlement_gross_cents = gross\n"
  input_set: Approved quote (if any) + all LoanerReservation fee fields of the RMA
  constants:
    LOYALTY_TIER1_CENTS: 50000
    LOYALTY_TIER2_CENTS: 20000
  precision: integer cents, round_half_up
  variants: []
- name: recurring_failure_score
  trigger: triage (primary code pinned) and each POST /depot/rmas/{rmaId}/parts (line failure_code_id) and close
  algorithm: weighted_scoring
  formula: "score(unit_id, failure_code_id, as_of) =\n  sum over CLOSED ServiceRMA r where r.unit_id == unit_id\n      and\
    \ r.primary_failure_code_id == failure_code_id\n      and r.closed_at in [as_of - 365 days, as_of]:\n      weight = 2\
    \ if r.closed_at >= as_of - 90 days else 1\n  + 2 if the evaluating (current, non-terminal) RMA has evidence for\n   \
    \   failure_code_id: primary_failure_code_id == failure_code_id OR a\n      RepairLine with status CONSUMED references\
    \ failure_code_id\nif score >= model.recurring_failure_threshold:\n  open EngineeringEscalation (deduped: skip if one\
    \ exists for\n  (model_id, failure_code_id) in {OPEN, ACKNOWLEDGED, CONTAINMENT_ACTIVE, MONITORING})\n  and set engineering_review_pending\
    \ = true on the evaluating RMA\n"
  input_set: CLOSED RMAs of the same unit in a rolling 365-day window + current RMA evidence
  constants:
    RECENT_WINDOW_DAYS: 90
    HISTORY_WINDOW_DAYS: 365
    CURRENT_RMA_WEIGHT: 2
  precision: integer score; threshold comparison is >= (inclusive)
  variants: []
- name: sla_turnaround
  trigger: run_daily_close
  algorithm: chronological
  formula: "business_days(d1, d2) = count of Mon-Fri dates strictly after d1 and on-or-before d2\nelapsed = business_days(received_at\
    \ date, clock date)\npaused  = sum over sla_pause_intervals [from, to) of business_days(from date, to date)\nnet = elapsed\
    \ - paused\nif net > model.sla_turnaround_business_days and not sla_breached:\n  sla_breached = true; create NotificationEvent\
    \ SLA_BREACH\n# Boundary: net == target is NOT a breach (strict >).\n"
  input_set: RMAs in {RECEIVED, TRIAGED, DIAGNOSED, AWAITING_QUOTE_APPROVAL, QUOTE_DECLINED, IN_REPAIR, AWAITING_PARTS, QA_HOLD,
    READY_TO_SHIP, REPLACEMENT_PENDING}
  precision: whole business days; Mon-Fri only; no holiday calendar
  variants: []
- name: loaner_late_fee
  trigger: run_daily_close (accrual) and return/forfeit (finalization)
  algorithm: threshold
  formula: "# LOANER mode only. due_date = RMA repaired-unit ship date + model.loaner_grace_days\nif due_date is null: late_fee_cents\
    \ = 0           # repaired unit not yet shipped\nelif as_of_date <= due_date: late_fee_cents = 0   # boundary: on due_date,\
    \ zero fee\nelse:\n  days_late = calendar days strictly after due_date up to and including as_of_date\n  late_fee_cents\
    \ = min(days_late * DAILY_LATE_FEE_CENTS, loaner_unit.deposit_value_cents)\n"
  input_set: LoanerReservations in SHIPPED with due_date set (accrual) or the closing reservation (finalization)
  constants:
    DAILY_LATE_FEE_CENTS: 2500
  precision: integer cents; calendar days
  variants: []
- name: loaner_unit_selector
  trigger: POST /depot/rmas/{rmaId}/loaner-reservations when loaner_unit_id omitted
  algorithm: selector_policy
  formula: "candidates = LoanerUnit where status == AVAILABLE\n             and model_id == rma.unit.model_id\n          \
    \   and condition_grade in {A, B}          # C excluded from auto-select\nrank by completed_loan_cycles ASC, tie-break\
    \ created_at ASC\nif candidates empty: reject ERR_LOANER_UNAVAILABLE\nelse: select first\n"
  input_set: LoanerUnits matching the RMA unit's model
  precision: deterministic ordering; created_at is the only tie-break (never id)
  variants: []
- name: restock_resume
  trigger: POST /depot/parts/{partId}/restock
  algorithm: selector_policy
  formula: "candidates = ServiceRMA where status == AWAITING_PARTS\n             and restocked part_id appears in planned_parts\n\
    resume (AWAITING_PARTS -> IN_REPAIR) in created_at ASC order\n"
  input_set: AWAITING_PARTS RMAs whose diagnosis planned the restocked part
  precision: created_at ASC ordering; no id tie-break
  variants: []
validations:
- priority: 1
  category: auth
  check: X-User-Role header present and names a declared role; X-User-ID present
  error_id: ERR_UNAUTHENTICATED
  http_status: 401
  applies_to: all endpoints
- priority: 2
  category: auth
  check: Acting role is listed in the endpoint's roles
  error_id: ERR_FORBIDDEN
  http_status: 403
  applies_to: all endpoints
- priority: 3
  category: auth
  check: Customer role may only act on resources whose customer_id == X-User-ID (RMA create/read/cancel, quote approve/decline,
    own customer record, own units, own reservations/notifications)
  error_id: ERR_NOT_OWNER
  http_status: 403
  applies_to: customer-scoped endpoints
- priority: 4
  category: existence
  check: Path identifiers resolve left-to-right (customer, model, unit, part, failure code, bay, loaner unit, RMA, quote,
    reservation, escalation, repair line)
  error_id: ERR_CUSTOMER_NOT_FOUND | ERR_MODEL_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_PART_NOT_FOUND | ERR_FAILURE_CODE_NOT_FOUND
    | ERR_BAY_NOT_FOUND | ERR_LOANER_UNIT_NOT_FOUND | ERR_RMA_NOT_FOUND | ERR_QUOTE_NOT_FOUND | ERR_RESERVATION_NOT_FOUND
    | ERR_ESCALATION_NOT_FOUND | ERR_REPAIR_LINE_NOT_FOUND
  http_status: 404
  applies_to: all endpoints with path ids
- priority: 5
  category: state
  check: 'OCC: expected_rma_version equals ServiceRMA.version'
  error_id: ERR_STALE_RMA_VERSION
  http_status: 412
  applies_to: PATCH /depot/rmas/{rmaId}; POST /depot/rmas/{rmaId}/quotes; POST /depot/rmas/{rmaId}/parts
- priority: 6
  category: state
  check: Target entity is in a state permitting the requested transition
  error_id: ERR_INVALID_RMA_STATE | ERR_INVALID_QUOTE_STATE | ERR_INVALID_RESERVATION_STATE | ERR_INVALID_LOANER_STATE | ERR_INVALID_ESCALATION_STATE
    | ERR_INVALID_LINE_STATE
  http_status: 409
  applies_to: all action/transition endpoints
- priority: 7
  category: business_safety
  check: Replacement shipment blocked while the unit's ProductModel.containment_flag is true
  error_id: ERR_MODEL_CONTAINMENT
  http_status: 409
  applies_to: POST /depot/rmas/{rmaId}/ship from REPLACEMENT_PENDING
- priority: 8
  category: business_safety
  check: qa-release PASS blocked while engineering_review_pending is true
  error_id: ERR_ENGINEERING_REVIEW_PENDING
  http_status: 409
  applies_to: POST /depot/rmas/{rmaId}/qa-release
- priority: 9
  category: business_safety
  check: 'Segregation of duties: override-decision actor != diagnosed_by; qa-release actor != repair_completed_by; scrap actor
    != warranty_override_by (when set)'
  error_id: ERR_SEGREGATION_OF_DUTIES
  http_status: 403
  applies_to: POST /depot/rmas/{rmaId}/override-decision; POST /depot/rmas/{rmaId}/qa-release; POST /depot/rmas/{rmaId}/scrap
- priority: 10
  category: business_referential
  check: 'POST /depot/rmas: unit.customer_id must equal payload customer_id'
  error_id: ERR_UNIT_CUSTOMER_MISMATCH
  http_status: 422
  applies_to: POST /depot/rmas
- priority: 11
  category: business_referential
  check: 'receive: payload serial_number must equal the unit''s serial_number'
  error_id: ERR_SERIAL_MISMATCH
  http_status: 409
  applies_to: POST /depot/rmas/{rmaId}/receive
- priority: 12
  category: business_constraint
  check: Unit serial_number globally unique
  error_id: ERR_DUPLICATE_SERIAL
  http_status: 409
  applies_to: POST /depot/units
- priority: 13
  category: business_constraint
  check: 'authorize: no other non-terminal RMA exists for the same unit_id'
  error_id: ERR_UNIT_HAS_OPEN_RMA
  http_status: 409
  applies_to: POST /depot/rmas/{rmaId}/authorize
- priority: 14
  category: business_temporal
  check: 'Bay booking window: end_date >= start_date; both ISO dates'
  error_id: ERR_INVALID_BAY_WINDOW
  http_status: 422
  applies_to: POST /depot/rmas/{rmaId}/schedule-bay
- priority: 15
  category: business_constraint
  check: Bay must be ACTIVE
  error_id: ERR_BAY_INACTIVE
  http_status: 409
  applies_to: POST /depot/rmas/{rmaId}/schedule-bay
- priority: 16
  category: business_constraint
  check: 'Bay overlap with buffer: bay bookings are CLOSED intervals and require a 1-day turnaround buffer; a new booking
    [s,e] conflicts when [s-1d, e+1d] intersects any existing [bs,be] on the same bay held by an RMA in {TRIAGED, DIAGNOSED,
    IN_REPAIR, AWAITING_PARTS, QA_HOLD, READY_TO_SHIP}'
  error_id: ERR_BAY_OVERLAP
  http_status: 409
  applies_to: POST /depot/rmas/{rmaId}/schedule-bay
- priority: 17
  category: business_temporal
  check: 'Loaner window shape: end_date > start_date (half-open window, end exclusive)'
  error_id: ERR_INVALID_LOANER_WINDOW
  http_status: 422
  applies_to: POST /depot/rmas/{rmaId}/loaner-reservations
- priority: 18
  category: business_temporal
  check: 'Loaner overlap, half-open semantics: a new reservation [s,e) on a unit conflicts with an existing {RESERVED, SHIPPED}
    reservation [s2,e2) iff s < e2 AND s2 < e; adjacency (e == s2) is allowed'
  error_id: ERR_LOANER_WINDOW_OVERLAP
  http_status: 409
  applies_to: POST /depot/rmas/{rmaId}/loaner-reservations
- priority: 19
  category: business_constraint
  check: Loaner reservation requires service_option in {LOANER, ADVANCE_EXCHANGE}; explicit loaner_unit_id must match RMA
    unit's model
  error_id: ERR_SERVICE_OPTION_INCOMPATIBLE | ERR_LOANER_MODEL_MISMATCH
  http_status: 422
  applies_to: POST /depot/rmas/{rmaId}/loaner-reservations
- priority: 20
  category: business_fiscal
  check: 'Reservation deposit: customer.deposit_exposure_cents + unit.deposit_value_cents <= customer.credit_limit_cents'
  error_id: ERR_CREDIT_LIMIT_EXCEEDED
  http_status: 402
  applies_to: POST /depot/rmas/{rmaId}/loaner-reservations
- priority: 21
  category: business_fiscal
  check: 'Parts consumption: part.stock_on_hand >= quantity'
  error_id: ERR_INSUFFICIENT_STOCK
  http_status: 409
  applies_to: POST /depot/rmas/{rmaId}/parts
- priority: 22
  category: business_temporal
  check: 'Quote approve: logical clock <= quote.expires_at'
  error_id: ERR_QUOTE_EXPIRED
  http_status: 409
  applies_to: POST /depot/quotes/{quoteId}/approve
- priority: 23
  category: business_fiscal
  check: 'Quote approve: payment_reference present and non-empty'
  error_id: ERR_PAYMENT_REQUIRED
  http_status: 402
  applies_to: POST /depot/quotes/{quoteId}/approve
- priority: 24
  category: business_constraint
  check: 'repair-complete: at least one CONSUMED RepairLine exists'
  error_id: ERR_NO_WORK_RECORDED
  http_status: 409
  applies_to: POST /depot/rmas/{rmaId}/repair-complete
- priority: 25
  category: business_constraint
  check: 'ship replacement: ADVANCE_EXCHANGE requires a SHIPPED exchange reservation'
  error_id: ERR_EXCHANGE_NOT_FULFILLED
  http_status: 409
  applies_to: POST /depot/rmas/{rmaId}/ship
- priority: 26
  category: business_constraint
  check: 'close: no LoanerReservation in {RESERVED, SHIPPED}'
  error_id: ERR_LOANER_OUTSTANDING
  http_status: 409
  applies_to: POST /depot/rmas/{rmaId}/close
- priority: 27
  category: business_constraint
  check: 'Payload shape: required fields present, enums valid, integers in range (quantity >= 1), dates ISO'
  error_id: ERR_VALIDATION
  http_status: 400
  applies_to: all endpoints
endpoints:
- method: POST
  path: /depot/_clock/set_current_utc
  description: Set the logical clock. Startup default (before any set call) is exactly 2026-08-01T00:00:00Z; the clock never
    falls back to wall-clock time. All date arithmetic (warranty, SLA, quote expiry, late fees) reads this clock.
  roles:
  - DepotManager
  code: 200
  input:
  - to_iso8601
  output:
    current_utc: string
  side_effects:
  - Logical clock advanced; no entity mutations
- method: POST
  path: /depot/ops/run_daily_close
  description: 'Daily ops checkpoint against the logical clock: expire SENT quotes past expires_at, auto-cancel AUTHORIZED
    RMAs older than 30 days without receive, evaluate SLA breach, accrue loaner late fees (LOANER_LATE notification once),
    close MONITORING escalations past monitoring_until'
  roles:
  - DepotManager
  code: 200
  output: '{ expired_quote_ids: string[], auto_cancelled_rma_ids: string[], sla_breached_rma_ids: string[], late_fee_reservation_ids:
    string[], closed_final_escalation_ids: string[] }'
  side_effects:
  - SENT quote with clock > expires_at -> EXPIRED + NotificationEvent QUOTE_EXPIRED
  - AUTHORIZED RMA with authorized_at older than 30 days -> CANCELLED (reservations released) + NotificationEvent CANCELLED
  - sla_turnaround evaluated; breach sets sla_breached + NotificationEvent SLA_BREACH
  - 'SHIPPED LOANER reservations past due_date: late_fee_cents recomputed; NotificationEvent LOANER_LATE once'
  - MONITORING escalation past monitoring_until -> CLOSED_FINAL
- method: POST
  path: /depot/customers
  description: Register a customer account
  roles:
  - IntakeAgent
  code: 201
  input:
  - name
  - email
  - credit_limit_cents?
  - loyalty_tier?
  output: Customer
  side_effects:
  - deposit_exposure_cents = 0
- method: GET
  path: /depot/customers/{customerId}
  description: Get a customer (Customer role limited to own record)
  roles:
  - Customer
  - IntakeAgent
  - DepotManager
  - WarrantyAdministrator
  code: 200
  input: []
  output: Customer
  side_effects: []
- method: POST
  path: /depot/product-models
  description: Create a product model with warranty/commercial constants
  roles:
  - DepotManager
  code: 201
  input:
  - model_code
  - description
  - standard_warranty_days
  - replacement_cost_cents
  - flat_rate_repair_cents
  - labor_rate_cents_per_minute
  - replace_threshold_pct
  - sla_turnaround_business_days
  - registration_bonus_days?
  - loaner_grace_days?
  - recurring_failure_threshold?
  - quote_valid_days?
  output: ProductModel
  side_effects:
  - containment_flag = false
- method: GET
  path: /depot/product-models/{modelId}
  description: Get a product model
  roles:
  - IntakeAgent
  - DepotTechnician
  - DepotManager
  - WarrantyAdministrator
  - EngineeringLead
  code: 200
  input: []
  output: ProductModel
  side_effects: []
- method: POST
  path: /depot/units
  description: Register a serialized unit for a customer
  roles:
  - IntakeAgent
  code: 201
  input:
  - serial_number
  - model_id
  - customer_id
  - channel
  - purchase_date
  - ship_date
  - registration_date?
  output: Unit
  side_effects:
  - disposition = ACTIVE
- method: GET
  path: /depot/units/{unitId}
  description: Get a unit (Customer role limited to own units)
  roles:
  - Customer
  - IntakeAgent
  - DepotTechnician
  - DepotManager
  code: 200
  input: []
  output: Unit
  side_effects: []
- method: GET
  path: /depot/units
  description: List units with filters
  roles:
  - IntakeAgent
  - DepotTechnician
  - DepotManager
  code: 200
  input:
  - customer_id?
  - model_id?
  - serial_number?
  - limit?
  - offset?
  output: Unit[]
  side_effects: []
- method: POST
  path: /depot/parts
  description: Create a catalog part with initial stock
  roles:
  - DepotManager
  code: 201
  input:
  - sku
  - name
  - unit_cost_cents
  - initial_stock
  - reorder_point?
  output: Part
  side_effects:
  - stock_on_hand = initial_stock
- method: GET
  path: /depot/parts/{partId}
  description: Get a part
  roles:
  - DepotTechnician
  - DepotManager
  code: 200
  input: []
  output: Part
  side_effects: []
- method: POST
  path: /depot/parts/{partId}/restock
  description: Add stock; auto-resumes matching AWAITING_PARTS RMAs (created_at ASC)
  roles:
  - DepotManager
  code: 200
  input:
  - quantity
  output: Part
  side_effects:
  - stock_on_hand += quantity
  - 'restock_resume: matching AWAITING_PARTS RMAs -> IN_REPAIR in created_at ASC order'
  - increments Part.version by 1
- method: POST
  path: /depot/failure-codes
  description: Create a failure code
  roles:
  - EngineeringLead
  code: 201
  input:
  - code
  - description
  - severity
  output: FailureCode
  side_effects: []
- method: POST
  path: /depot/depot-bays
  description: Register a repair bench
  roles:
  - DepotManager
  code: 201
  input:
  - bay_code
  output: DepotBay
  side_effects:
  - status = ACTIVE
- method: GET
  path: /depot/depot-bays/{bayId}
  description: Get a bay
  roles:
  - DepotTechnician
  - DepotManager
  code: 200
  input: []
  output: DepotBay
  side_effects: []
- method: POST
  path: /depot/depot-bays/{bayId}/deactivate
  description: Take a bay out of service
  roles:
  - DepotManager
  code: 200
  input: []
  output: DepotBay
  side_effects:
  - status -> OUT_OF_SERVICE
- method: POST
  path: /depot/depot-bays/{bayId}/reactivate
  description: Return a bay to service
  roles:
  - DepotManager
  code: 200
  input: []
  output: DepotBay
  side_effects:
  - status -> ACTIVE
- method: POST
  path: /depot/loaner-units
  description: Register a pool loaner unit
  roles:
  - DepotManager
  code: 201
  input:
  - asset_tag
  - model_id
  - condition_grade
  - deposit_value_cents
  output: LoanerUnit
  side_effects:
  - status = AVAILABLE
  - completed_loan_cycles = 0
- method: GET
  path: /depot/loaner-units/{loanerUnitId}
  description: Get a loaner unit
  roles:
  - IntakeAgent
  - DepotTechnician
  - DepotManager
  code: 200
  input: []
  output: LoanerUnit
  side_effects: []
- method: GET
  path: /depot/loaner-units
  description: List loaner units with filters
  roles:
  - IntakeAgent
  - DepotManager
  code: 200
  input:
  - model_id?
  - status?
  - limit?
  - offset?
  output: LoanerUnit[]
  side_effects: []
- method: POST
  path: /depot/loaner-units/{loanerUnitId}/inspect
  description: 'Post-return inspection: PASS -> AVAILABLE (cycle completes), FAIL -> RETIRED'
  roles:
  - DepotTechnician
  code: 200
  input:
  - outcome
  output: LoanerUnit
  side_effects:
  - 'PASS: completed_loan_cycles += 1 and status -> AVAILABLE; FAIL: status -> RETIRED'
- method: POST
  path: /depot/rmas
  description: Open a draft RMA for a unit
  roles:
  - Customer
  - IntakeAgent
  code: 201
  input:
  - customer_id
  - unit_id
  - reported_issue
  - service_option?
  output: ServiceRMA
  side_effects:
  - status = DRAFT
  - rma_number assigned
- method: GET
  path: /depot/rmas/{rmaId}
  description: Get an RMA (Customer role limited to own RMAs)
  roles:
  - Customer
  - IntakeAgent
  - DepotTechnician
  - DepotManager
  - WarrantyAdministrator
  - EngineeringLead
  code: 200
  input: []
  output: ServiceRMA
  side_effects: []
- method: GET
  path: /depot/rmas
  description: List RMAs with filters
  roles:
  - IntakeAgent
  - DepotTechnician
  - DepotManager
  - WarrantyAdministrator
  - EngineeringLead
  code: 200
  input:
  - customer_id?
  - unit_id?
  - bay_id?
  - status?
  - primary_failure_code_id?
  - current_quote_id?
  - limit?
  - offset?
  output: ServiceRMA[]
  side_effects: []
- method: PATCH
  path: /depot/rmas/{rmaId}
  description: Edit a DRAFT RMA (OCC-guarded)
  roles:
  - Customer
  - IntakeAgent
  code: 200
  input:
  - reported_issue?
  - service_option?
  - expected_rma_version
  output: ServiceRMA
  side_effects:
  - increments ServiceRMA.version by 1
- method: POST
  path: /depot/rmas/{rmaId}/authorize
  description: Authorize the RMA; evaluates and pins warranty coverage
  roles:
  - IntakeAgent
  code: 200
  input: []
  output: ServiceRMA
  side_effects:
  - warranty_eligibility computed; coverage_path + warranty_end_date_used pinned
  - provisional_estimate_cents = model.flat_rate_repair_cents
  - status DRAFT -> AUTHORIZED; authorized_at pinned; NotificationEvent RMA_AUTHORIZED
- method: POST
  path: /depot/rmas/{rmaId}/receive
  description: Record inbound receipt; serial must match
  roles:
  - IntakeAgent
  code: 200
  input:
  - serial_number
  output: ServiceRMA
  side_effects:
  - status AUTHORIZED -> RECEIVED; received_at pinned; NotificationEvent RECEIVED
- method: POST
  path: /depot/rmas/{rmaId}/triage
  description: Record inbound triage and primary failure code
  roles:
  - IntakeAgent
  code: 200
  input:
  - primary_failure_code_id
  - notes?
  output: ServiceRMA
  side_effects:
  - status RECEIVED -> TRIAGED; primary_failure_code_id pinned
  - recurring_failure_score recomputed; threshold crossing auto-opens EngineeringEscalation and sets engineering_review_pending
- method: POST
  path: /depot/rmas/{rmaId}/diagnose
  description: Record diagnosis; computes final estimate, decision, and auto-routes
  roles:
  - DepotTechnician
  code: 200
  input:
  - labor_minutes_est
  - repairability
  - planned_parts?
  output: ServiceRMA
  side_effects:
  - final_estimate_cents + decision computed; diagnosed_by pinned
  - 'Auto-route: REPAIR+covered -> IN_REPAIR; REPAIR+OOW -> AWAITING_QUOTE_APPROVAL with auto-created SENT quote; REPLACE
    -> REPLACEMENT_PENDING'
- method: POST
  path: /depot/rmas/{rmaId}/schedule-bay
  description: Book a depot bay window (closed interval + 1-day buffer overlap rule). Valid only when the RMA is in {TRIAGED,
    DIAGNOSED, IN_REPAIR, AWAITING_PARTS} (else ERR_INVALID_RMA_STATE)
  roles:
  - DepotTechnician
  code: 200
  input:
  - bay_id
  - start_date
  - end_date
  output: ServiceRMA
  side_effects:
  - bay_id, bay_start_date, bay_end_date pinned
- method: POST
  path: /depot/rmas/{rmaId}/await-parts
  description: Flag repair as waiting on parts
  roles:
  - DepotTechnician
  code: 200
  input: []
  output: ServiceRMA
  side_effects:
  - status IN_REPAIR -> AWAITING_PARTS
- method: POST
  path: /depot/rmas/{rmaId}/parts
  description: Record part consumption with failure-code attribution (OCC-guarded)
  roles:
  - DepotTechnician
  code: 200
  input:
  - part_id
  - quantity
  - failure_code_id
  - expected_rma_version
  output: RepairLine
  side_effects:
  - RepairLine created CONSUMED with unit_cost snapshot; Part.stock_on_hand -= quantity
  - increments ServiceRMA.version by 1
  - recurring_failure_score recomputed for the line's failure code; threshold crossing auto-opens escalation + engineering_review_pending
- method: POST
  path: /depot/rmas/{rmaId}/repair-complete
  description: Mark repair work complete; requires recorded work
  roles:
  - DepotTechnician
  code: 200
  input: []
  output: ServiceRMA
  side_effects:
  - status IN_REPAIR -> QA_HOLD; repair_completed_by pinned
- method: POST
  path: /depot/rmas/{rmaId}/qa-release
  description: 'QA gate: PASS -> READY_TO_SHIP, FAIL -> IN_REPAIR rework loop (four-eyes: actor != repair_completed_by)'
  roles:
  - DepotTechnician
  code: 200
  input:
  - outcome
  output: ServiceRMA
  side_effects:
  - 'PASS: status -> READY_TO_SHIP (bay booking released); FAIL: status -> IN_REPAIR, rework_count += 1'
- method: POST
  path: /depot/rmas/{rmaId}/ship
  description: Ship repaired unit (from READY_TO_SHIP) or replacement unit (from REPLACEMENT_PENDING)
  roles:
  - DepotTechnician
  code: 200
  input:
  - carrier
  - tracking_number
  output: ServiceRMA
  side_effects:
  - status -> SHIPPED; shipped_at, return_reason pinned
  - LOANER-mode reservations in SHIPPED get due_date = ship date + model.loaner_grace_days
  - NotificationEvent SHIPPED
- method: POST
  path: /depot/rmas/{rmaId}/close
  description: Close a shipped RMA; computes settlement and recurrence bookkeeping
  roles:
  - IntakeAgent
  - DepotManager
  code: 200
  input: []
  output: ServiceRMA
  side_effects:
  - status -> CLOSED; closed_at pinned
  - settlement_total computed (gross, tiered loyalty credit, net)
  - recurring check may reopen matching MONITORING escalation
  - NotificationEvent CLOSED
- method: POST
  path: /depot/rmas/{rmaId}/cancel
  description: Cancel a DRAFT or AUTHORIZED RMA with compensating release of reservations
  roles:
  - Customer
  - IntakeAgent
  code: 200
  input: []
  output: ServiceRMA
  side_effects:
  - status -> CANCELLED; RESERVED reservations cancelled, units released, deposit exposure decremented; NotificationEvent
    CANCELLED
- method: POST
  path: /depot/rmas/{rmaId}/return-unrepaired
  description: 'After quote decline: return the unit unrepaired'
  roles:
  - IntakeAgent
  code: 200
  input: []
  output: ServiceRMA
  side_effects:
  - status QUOTE_DECLINED -> READY_TO_SHIP; return_reason = UNREPAIRED; SLA pause closes
- method: POST
  path: /depot/rmas/{rmaId}/scrap
  description: 'After quote decline: scrap the unit (SoD vs goodwill grantor)'
  roles:
  - DepotManager
  code: 200
  input: []
  output: ServiceRMA
  side_effects:
  - status QUOTE_DECLINED -> SCRAPPED; Unit.disposition -> SCRAPPED; settlement computed (loaner fees only)
- method: POST
  path: /depot/rmas/{rmaId}/override-decision
  description: Manager override of the computed repair/replace decision (SoD vs diagnoser)
  roles:
  - DepotManager
  code: 200
  input:
  - new_decision
  - reason
  output: ServiceRMA
  side_effects:
  - decision replaced; decision_overridden = true; auto-route re-fires; SENT quote superseded when overriding to REPLACE
- method: POST
  path: /depot/rmas/{rmaId}/warranty-override
  description: Goodwill warranty grant; regenerates an outstanding SENT quote with the goodwill discount
  roles:
  - WarrantyAdministrator
  code: 200
  input:
  - override_coverage
  - goodwill_pct?
  - reason
  output: ServiceRMA
  side_effects:
  - coverage_path -> GOODWILL_FULL or GOODWILL_PARTIAL; goodwill_pct + warranty_override_by pinned
  - 'If a SENT quote exists: it is SUPERSEDED and a replacement quote (seq+1) is created with discount_pct = goodwill_pct;
    RMA in AWAITING_QUOTE_APPROVAL stays'
  - 'If RMA routed to AWAITING_QUOTE_APPROVAL and override is GOODWILL_FULL: RMA re-routes to IN_REPAIR (quote superseded)'
- method: POST
  path: /depot/rmas/{rmaId}/quotes
  description: Create a revised quote (supersedes latest SENT/DECLINED/EXPIRED quote; OCC-guarded)
  roles:
  - DepotTechnician
  code: 201
  input:
  - labor_minutes
  - parts_lines
  - discount_pct?
  - expedite?
  - expected_rma_version
  output: Quote
  side_effects:
  - Latest quote in {SENT, DECLINED, EXPIRED} -> SUPERSEDED; new quote SENT with quote_seq+1, totals via quote_total
  - RMA QUOTE_DECLINED -> AWAITING_QUOTE_APPROVAL (or stays); increments ServiceRMA.version by 1
  - NotificationEvent QUOTE_SENT
- method: GET
  path: /depot/quotes/{quoteId}
  description: Get a quote (Customer role limited to own RMAs' quotes)
  roles:
  - Customer
  - IntakeAgent
  - DepotTechnician
  - DepotManager
  code: 200
  input: []
  output: Quote
  side_effects: []
- method: GET
  path: /depot/rmas/{id}/quotes
  description: List quotes for an RMA
  roles:
  - Customer
  - IntakeAgent
  - DepotTechnician
  - DepotManager
  code: 200
  input:
  - limit?
  - offset?
  output: Quote[]
  side_effects: []
- method: POST
  path: /depot/quotes/{quoteId}/approve
  description: Customer approves a SENT quote
  roles:
  - Customer
  code: 200
  input:
  - payment_reference
  output: Quote
  side_effects:
  - quote -> APPROVED; RMA AWAITING_QUOTE_APPROVAL -> IN_REPAIR; SLA pause closes; NotificationEvent QUOTE_APPROVED
- method: POST
  path: /depot/quotes/{quoteId}/decline
  description: Customer declines a SENT quote
  roles:
  - Customer
  code: 200
  input: []
  output: Quote
  side_effects:
  - quote -> DECLINED; RMA -> QUOTE_DECLINED; NotificationEvent QUOTE_DECLINED
- method: POST
  path: /depot/rmas/{rmaId}/loaner-reservations
  description: Reserve a loaner/exchange unit; server-selects when loaner_unit_id omitted
  roles:
  - IntakeAgent
  code: 201
  input:
  - loaner_unit_id?
  - start_date
  - end_date
  output: LoanerReservation
  side_effects:
  - 'LoanerUnit AVAILABLE -> RESERVED (selector: cycles ASC, created_at ASC tie-break; ERR_LOANER_UNAVAILABLE when empty)'
  - mode copied from RMA.service_option; customer.deposit_exposure_cents += deposit_value_cents
- method: GET
  path: /depot/loaner-reservations/{reservationId}
  description: Get a loaner reservation (Customer role limited to own RMAs' reservations)
  roles:
  - Customer
  - IntakeAgent
  - DepotTechnician
  - DepotManager
  code: 200
  input: []
  output: LoanerReservation
  side_effects: []
- method: GET
  path: /depot/loaner-reservations
  description: List loaner reservations with filters
  roles:
  - IntakeAgent
  - DepotTechnician
  - DepotManager
  code: 200
  input:
  - rma_id?
  - loaner_unit_id?
  - status?
  - limit?
  - offset?
  output: LoanerReservation[]
  side_effects: []
- method: POST
  path: /depot/loaner-reservations/{reservationId}/ship
  description: Ship the loaner to the customer
  roles:
  - IntakeAgent
  code: 200
  input: []
  output: LoanerReservation
  side_effects:
  - reservation RESERVED -> SHIPPED; LoanerUnit RESERVED -> SHIPPED_OUT; shipped_at pinned
- method: POST
  path: /depot/loaner-reservations/{reservationId}/return
  description: Receive the loaner back (LOANER mode only); condition drives damage fee
  roles:
  - IntakeAgent
  code: 200
  input:
  - condition
  - damage_assessment_cents?
  output: LoanerReservation
  side_effects:
  - reservation -> CLOSED_RETURNED or CLOSED_DAMAGED; late fee finalized; damage fee = min(assessment, deposit); LoanerUnit
    -> INSPECTION; deposit exposure released
- method: POST
  path: /depot/loaner-reservations/{reservationId}/cancel
  description: Cancel a RESERVED (not yet shipped) reservation
  roles:
  - IntakeAgent
  code: 200
  input: []
  output: LoanerReservation
  side_effects:
  - reservation -> CANCELLED; LoanerUnit -> AVAILABLE; deposit exposure released
- method: POST
  path: /depot/loaner-reservations/{reservationId}/forfeit
  description: Customer keeps the loaner; full deposit plus late fees charged
  roles:
  - IntakeAgent
  - DepotManager
  code: 200
  input: []
  output: LoanerReservation
  side_effects:
  - reservation -> CLOSED_FORFEITED; forfeit_charge_cents = deposit_value_cents + late_fee_cents; LoanerUnit -> RETIRED; deposit
    exposure released
- method: POST
  path: /depot/engineering-escalations
  description: Manually open an escalation for an RMA + failure code (model derived from the RMA's unit)
  roles:
  - EngineeringLead
  code: 201
  input:
  - rma_id
  - failure_code_id
  output: EngineeringEscalation
  side_effects:
  - status = OPEN; trigger_source = MANUAL; engineering_review_pending = true on the linked RMA
- method: GET
  path: /depot/engineering-escalations/{escalationId}
  description: Get an engineering escalation
  roles:
  - DepotTechnician
  - DepotManager
  - EngineeringLead
  code: 200
  input: []
  output: EngineeringEscalation
  side_effects: []
- method: GET
  path: /depot/engineering-escalations
  description: List escalations with filters
  roles:
  - DepotTechnician
  - DepotManager
  - EngineeringLead
  code: 200
  input:
  - rma_id?
  - failure_code_id?
  - model_id?
  - status?
  - limit?
  - offset?
  output: EngineeringEscalation[]
  side_effects: []
- method: POST
  path: /depot/engineering-escalations/{escalationId}/acknowledge
  description: Acknowledge an OPEN escalation
  roles:
  - EngineeringLead
  code: 200
  input: []
  output: EngineeringEscalation
  side_effects:
  - status OPEN -> ACKNOWLEDGED
- method: POST
  path: /depot/engineering-escalations/{escalationId}/contain
  description: Activate containment; sets the model's containment_flag
  roles:
  - EngineeringLead
  code: 200
  input: []
  output: EngineeringEscalation
  side_effects:
  - status {OPEN, ACKNOWLEDGED} -> CONTAINMENT_ACTIVE; ProductModel.containment_flag = true
- method: POST
  path: /depot/engineering-escalations/{escalationId}/resolve
  description: Resolve; releases containment, clears review gates, enters MONITORING (90 days)
  roles:
  - EngineeringLead
  code: 200
  input:
  - resolution_note
  output: EngineeringEscalation
  side_effects:
  - status -> RESOLVED then MONITORING; monitoring_until = clock date + 90d; engineering_review_pending cleared on related
    RMAs; containment_flag released when no other containment active for the model
- method: GET
  path: /depot/repair-lines/{repairLineId}
  description: Get a repair line
  roles:
  - DepotTechnician
  - DepotManager
  - EngineeringLead
  code: 200
  input: []
  output: RepairLine
  side_effects: []
- method: GET
  path: /depot/repair-lines
  description: List repair lines with filters
  roles:
  - DepotTechnician
  - DepotManager
  - EngineeringLead
  code: 200
  input:
  - rma_id?
  - part_id?
  - failure_code_id?
  - status?
  - limit?
  - offset?
  output: RepairLine[]
  side_effects: []
- method: POST
  path: /depot/repair-lines/{repairLineId}/reverse
  description: Reverse an erroneous consumption; restocks the part (compensating action)
  roles:
  - DepotTechnician
  code: 200
  input: []
  output: RepairLine
  side_effects:
  - RepairLine CONSUMED -> REVERSED; Part.stock_on_hand += quantity
- method: GET
  path: /depot/rmas/{id}/notifications
  description: List notification events for an RMA (Customer role limited to own RMAs)
  roles:
  - Customer
  - IntakeAgent
  - DepotManager
  code: 200
  input:
  - event_type?
  - limit?
  - offset?
  output: NotificationEvent[]
  side_effects: []
errors:
- id: ERR_UNAUTHENTICATED
  http: 401
  condition: Missing or unrecognized X-User-Role / X-User-ID headers
- id: ERR_FORBIDDEN
  http: 403
  condition: Role not permitted on this endpoint
- id: ERR_NOT_OWNER
  http: 403
  condition: Customer role acting on a resource owned by another customer
- id: ERR_VALIDATION
  http: 400
  condition: 'Malformed payload: missing required field, invalid enum, quantity < 1, bad ISO date'
- id: ERR_CUSTOMER_NOT_FOUND
  http: 404
  condition: customer_id path/body reference does not exist
- id: ERR_MODEL_NOT_FOUND
  http: 404
  condition: model_id reference does not exist
- id: ERR_UNIT_NOT_FOUND
  http: 404
  condition: unit_id reference does not exist
- id: ERR_PART_NOT_FOUND
  http: 404
  condition: part_id reference does not exist
- id: ERR_FAILURE_CODE_NOT_FOUND
  http: 404
  condition: failure_code_id reference does not exist
- id: ERR_BAY_NOT_FOUND
  http: 404
  condition: bay_id reference does not exist
- id: ERR_LOANER_UNIT_NOT_FOUND
  http: 404
  condition: loaner_unit_id reference does not exist
- id: ERR_RMA_NOT_FOUND
  http: 404
  condition: rmaId path reference does not exist
- id: ERR_QUOTE_NOT_FOUND
  http: 404
  condition: quoteId path reference does not exist
- id: ERR_RESERVATION_NOT_FOUND
  http: 404
  condition: reservationId path reference does not exist
- id: ERR_ESCALATION_NOT_FOUND
  http: 404
  condition: escalationId path reference does not exist
- id: ERR_REPAIR_LINE_NOT_FOUND
  http: 404
  condition: repairLineId path reference does not exist
- id: ERR_INVALID_LINE_STATE
  http: 409
  condition: RepairLine not CONSUMED (e.g., reversing an already-REVERSED line)
- id: ERR_STALE_RMA_VERSION
  http: 412
  condition: expected_rma_version does not match ServiceRMA.version (OCC)
- id: ERR_INVALID_RMA_STATE
  http: 409
  condition: ServiceRMA not in a state permitting the requested transition
- id: ERR_INVALID_QUOTE_STATE
  http: 409
  condition: Quote not in a state permitting the requested transition (or quote does not belong to the RMA's current quote
    chain)
- id: ERR_INVALID_RESERVATION_STATE
  http: 409
  condition: LoanerReservation not in a state permitting the requested transition (e.g., return of ADVANCE_EXCHANGE reservation)
- id: ERR_INVALID_LOANER_STATE
  http: 409
  condition: LoanerUnit not in the required state (e.g., inspect when not INSPECTION)
- id: ERR_INVALID_ESCALATION_STATE
  http: 409
  condition: EngineeringEscalation not in a state permitting the requested transition
- id: ERR_UNIT_CUSTOMER_MISMATCH
  http: 422
  condition: 'POST /rmas: unit is not owned by the payload customer'
- id: ERR_SERIAL_MISMATCH
  http: 409
  condition: 'receive: payload serial_number differs from the unit''s registered serial'
- id: ERR_DUPLICATE_SERIAL
  http: 409
  condition: Unit serial_number already registered
- id: ERR_UNIT_HAS_OPEN_RMA
  http: 409
  condition: 'authorize: another non-terminal RMA exists for the same unit'
- id: ERR_INVALID_BAY_WINDOW
  http: 422
  condition: Bay booking end_date before start_date
- id: ERR_BAY_INACTIVE
  http: 409
  condition: Bay is OUT_OF_SERVICE
- id: ERR_BAY_OVERLAP
  http: 409
  condition: 'Bay booking conflicts: closed intervals plus 1-day turnaround buffer intersect an existing booking'
- id: ERR_INVALID_LOANER_WINDOW
  http: 422
  condition: Loaner window end_date must be strictly after start_date (half-open)
- id: ERR_LOANER_WINDOW_OVERLAP
  http: 409
  condition: Loaner unit already committed for an overlapping half-open window
- id: ERR_SERVICE_OPTION_INCOMPATIBLE
  http: 422
  condition: Loaner reservation requested on a STANDARD service-option RMA
- id: ERR_LOANER_MODEL_MISMATCH
  http: 422
  condition: Explicitly picked loaner unit's model differs from the RMA unit's model
- id: ERR_LOANER_UNAVAILABLE
  http: 409
  condition: Auto-select found no AVAILABLE loaner of the right model with grade A/B
- id: ERR_CREDIT_LIMIT_EXCEEDED
  http: 402
  condition: Reservation would push customer deposit exposure above credit_limit_cents
- id: ERR_INSUFFICIENT_STOCK
  http: 409
  condition: Part stock_on_hand below requested consumption quantity
- id: ERR_QUOTE_EXPIRED
  http: 409
  condition: Approve attempted after quote.expires_at
- id: ERR_PAYMENT_REQUIRED
  http: 402
  condition: Quote approve missing payment_reference
- id: ERR_MODEL_CONTAINMENT
  http: 409
  condition: Replacement shipment blocked by active engineering containment on the model
- id: ERR_ENGINEERING_REVIEW_PENDING
  http: 409
  condition: qa-release PASS blocked while engineering_review_pending is set
- id: ERR_SEGREGATION_OF_DUTIES
  http: 403
  condition: Actor held a prior conflicting role on this RMA (diagnoser/overrider, repairer/QA, goodwill-grantor/scrapper)
- id: ERR_NO_WORK_RECORDED
  http: 409
  condition: repair-complete with no CONSUMED repair line
- id: ERR_EXCHANGE_NOT_FULFILLED
  http: 409
  condition: Replacement ship for ADVANCE_EXCHANGE without a SHIPPED exchange reservation
- id: ERR_LOANER_OUTSTANDING
  http: 409
  condition: Close blocked by a reservation still in RESERVED or SHIPPED
roles:
- name: Customer
  description: End customer owning units and RMAs; approves/declines quotes; may only touch own resources (customer_id ==
    X-User-ID)
  identity: entity_backed:Customer
  exclusive_operations:
  - POST /depot/quotes/{quoteId}/approve
  - POST /depot/quotes/{quoteId}/decline
  shared_operations:
  - POST /depot/rmas (own units only)
  - GET /depot/rmas/{rmaId}, GET /depot/rmas/{rmaId}/quotes, GET /depot/rmas/{rmaId}/notifications (own only)
  - PATCH /depot/rmas/{rmaId}, POST /depot/rmas/{rmaId}/cancel (own only)
  - GET /depot/customers/{customerId}, GET /depot/units/{unitId}, GET /depot/quotes/{quoteId}, GET /depot/loaner-reservations/{reservationId}
    (own only)
- name: IntakeAgent
  description: 'Depot front-desk operator: customer/unit registration, RMA authorization, receiving, triage, loaner logistics'
  identity: opaque
  exclusive_operations:
  - POST /depot/customers
  - POST /depot/units
  - POST /depot/rmas/{rmaId}/authorize
  - POST /depot/rmas/{rmaId}/receive
  - POST /depot/rmas/{rmaId}/triage
  - POST /depot/rmas/{rmaId}/return-unrepaired
  - POST /depot/rmas/{rmaId}/loaner-reservations
  - POST /depot/loaner-reservations/{reservationId}/ship
  - POST /depot/loaner-reservations/{reservationId}/return
  - POST /depot/loaner-reservations/{reservationId}/cancel
  shared_operations:
  - POST /depot/rmas (on behalf of customer)
  - PATCH /depot/rmas/{rmaId}, POST /depot/rmas/{rmaId}/cancel
  - POST /depot/rmas/{rmaId}/close, POST /depot/loaner-reservations/{reservationId}/forfeit
  - GET endpoints per endpoint roles list
- name: DepotTechnician
  description: 'Bench technician: diagnosis, bay scheduling, parts consumption, repair, QA, shipping'
  identity: opaque
  exclusive_operations:
  - POST /depot/rmas/{rmaId}/diagnose
  - POST /depot/rmas/{rmaId}/schedule-bay
  - POST /depot/rmas/{rmaId}/await-parts
  - POST /depot/rmas/{rmaId}/parts
  - POST /depot/rmas/{rmaId}/repair-complete
  - POST /depot/rmas/{rmaId}/qa-release
  - POST /depot/rmas/{rmaId}/ship
  - POST /depot/rmas/{rmaId}/quotes
  - POST /depot/loaner-units/{loanerUnitId}/inspect
  - POST /depot/repair-lines/{repairLineId}/reverse
  shared_operations:
  - GET endpoints per endpoint roles list
- name: DepotManager
  description: 'Depot manager: catalog/pool administration, decision override, scrap approval, daily ops'
  identity: opaque
  exclusive_operations:
  - POST /depot/product-models, POST /depot/parts, POST /depot/parts/{partId}/restock
  - POST /depot/depot-bays, POST /depot/depot-bays/{bayId}/deactivate, POST /depot/depot-bays/{bayId}/reactivate
  - POST /depot/loaner-units
  - POST /depot/rmas/{rmaId}/override-decision
  - POST /depot/rmas/{rmaId}/scrap
  - POST /depot/ops/run_daily_close
  - POST /depot/_clock/set_current_utc
  shared_operations:
  - POST /depot/rmas/{rmaId}/close, POST /depot/loaner-reservations/{reservationId}/forfeit
  - GET endpoints per endpoint roles list
- name: WarrantyAdministrator
  description: 'Warranty policy owner: goodwill coverage grants (segregated from scrap approval on the same RMA)'
  identity: opaque
  exclusive_operations:
  - POST /depot/rmas/{rmaId}/warranty-override
  shared_operations:
  - GET /depot/customers/{customerId}, GET /depot/product-models/{modelId}, GET /depot/rmas (list and detail)
- name: EngineeringLead
  description: Engineering owner of failure codes and escalations
  identity: opaque
  exclusive_operations:
  - POST /depot/failure-codes
  - POST /depot/engineering-escalations/{escalationId}/acknowledge
  - POST /depot/engineering-escalations/{escalationId}/contain
  - POST /depot/engineering-escalations/{escalationId}/resolve
  shared_operations:
  - GET endpoints per endpoint roles list
