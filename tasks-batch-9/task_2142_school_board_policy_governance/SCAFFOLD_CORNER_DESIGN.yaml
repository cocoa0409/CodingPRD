              as: BoardClerk
              captures: { ai1: $.data.id, m_v2: $.data.meeting_version_after }
          trigger:
            - call: "POST /governance/agenda-items"
              payload: { meeting_id: "${m}", item_type: "CONSENT", title: "Approve field trips", expected_meeting_version: "${m_v2} - 1" }
              as: BoardClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "response data.error_id == ERR_STALE_VERSION"
            - "response response_type == error"
            - "GET /governance/agenda-items?meeting_id=${m} returns total_count == 1"

