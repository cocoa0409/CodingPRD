            - {call: "GET /score-discovery-requests/${dr}", payload: {}, as: ScoreConsumer, as_user_id: "${lic}", captures: {dr_now: $.data.status, dr_sr_now: $.data.consumed_score_result_id}}
          assert:
            - "data.dr_status == \"REGISTERED\" and data.dr_sr is null on registration"
            - "data.dr_now == \"CONSUMED\" and data.dr_sr_now == ScoreResult.${sr}"
            - "the posting itself reports a null reference_set_id, because no reference set was ever compiled for this consumer"

      - name: endpoint_model_documentation_file_unlocks_the_release_gate
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/model-documentation/{documentationId}/file
          - entities.ModelDocumentation.fields.status
          - entities.ModelDocumentation.fields.checksum
        distinguishing_aspect: "Filing is the only action that moves a document to FILED, and it stamps filed_at and recomputes the checksum, which is what the release gate reads."
        test_recipe:
          setup:
            - "One DEVELOPMENT model M1 with a released AUTO variant and a DRAFT MODEL_RISK_REPORT."
          setup_api_calls:
