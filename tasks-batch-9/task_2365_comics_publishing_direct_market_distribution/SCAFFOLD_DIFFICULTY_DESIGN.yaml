            - "after the issue: RoyaltyStatement.${st_1}.status == ISSUED, Title.${t1}.royalty_accrued_cents == 60432, CreativeAssignment.${a_w}.unrecouped_advance_cents == 0"
            - "after the reverse: RoyaltyStatement.${st_1}.status == REVERSED with reversal_reason set"
            - "after the reverse: Title.${t1}.royalty_accrued_cents == 0 exactly and CreativeAssignment.${a_w}.unrecouped_advance_cents == 25000 exactly (both restored, no residue)"
            - "the reversed row keeps its own figures (gross 85432, recoupment_applied_cents 25000, payable 60432) for audit"
            - "no drift on re-issue: RoyaltyStatement.${st_2}.recoupment_applied_cents == 25000, payable_cents == 60432, and after issuing it Title.${t1}.royalty_accrued_cents == 60432 with unrecouped_advance_cents == 0 again"
            - "the duplicate guard permits ${st_2} only because ${st_1} is REVERSED: a third identical DRAFT statement now -> 409 ERR_DUPLICATE_STATEMENT_PERIOD"
            - "POST /comics/royalty-statements/${st_1}/reverse again -> 409 ERR_INVALID_STATE, so the compensation cannot be replayed"

      - name: solicitation_withdrawal_restores_the_catalog_slot_capacity
        grounds:
          - state_machines.Solicitation.ACCEPTED_to_WITHDRAWN
          - state_machines.Solicitation.SUBMITTED_to_ACCEPTED
          - calculations.catalog_slot_rollup
          - entities.Catalog.fields.accepted_slot_count
          - validations.priority_23_ERR_CATALOG_SLOTS_EXHAUSTED
        distinguishing_aspect: |
          A third conserved quantity: the catalog's finite slot capacity. With max_slots 2 and two
          accepted solicitations the third acceptance is refused; withdrawing one recomputes
          accepted_slot_count back to 1 and hands the freed slot to the waiting solicitation, so the
          count is a recomputation over the ACCEPTED set rather than an incrementing counter.
        test_recipe:
          setup:
            - "logical clock advanced 2026-08-01 -> 2026-08-21"
            - "GREENLIT title with three issues on a 21-day cadence (2026-10-14, 2026-11-04, 2026-11-25), each with a STANDARD cover and an IN_PROGRESS SCRIPT stage"
            - "catalog 2026-08 with max_slots 2, deadline 2026-08-20, holding three SUBMITTED solicitations (one per issue)"
            - "the catalog LOCKED at 2026-08-21 and the first two solicitations ACCEPTED, so accepted_slot_count == 2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ManagingEditor
            - call: "POST /comics/creators"
              payload: { full_name: "Wanda Writer", crafts: ["SCRIPT"], default_page_rate_cents: 12000 }
              as: EditorInChief
              captures: { cr_w: $.data.id }
            - call: "POST /comics/titles"
              payload: { name: "Nebula Knights", planned_issue_count: 6, royalty_pool_bps: 1200, cover_participation_bps: 1500 }
              as: EditorInChief
              captures: { t1: $.data.id }
            - call: "POST /comics/titles/${t1}/greenlight"
              payload: {}
              as: EditorInChief
              captures: { tv1: $.data.version }
            - call: "POST /comics/titles/${t1}/creative-assignments"
              payload: { creator_id: "${cr_w}", craft: "SCRIPT", page_rate_cents: 12000, royalty_share_bps: 4000, booking_start_date: "2026-08-01", booking_end_date: "2026-12-01", expected_title_version: "${tv1}" }
              as: EditorInChief
              captures: { a_w: $.data.id }
            - call: "POST /comics/creative-assignments/${a_w}/accept"
              payload: {}
              as: Creator
              as_user_id: "${cr_w}"
            - call: "POST /comics/titles/${t1}/issues"
              payload: { issue_number: 1, page_count: 22, cover_price_cents: 399, target_on_sale_date: "2026-10-14" }
              as: ManagingEditor
              captures: { i1: $.data.id }
            - call: "POST /comics/titles/${t1}/issues"
              payload: { issue_number: 2, page_count: 22, cover_price_cents: 399, target_on_sale_date: "2026-11-04" }
              as: ManagingEditor
              captures: { i2: $.data.id }
            - call: "POST /comics/titles/${t1}/issues"
              payload: { issue_number: 3, page_count: 22, cover_price_cents: 399, target_on_sale_date: "2026-11-25" }
              as: ManagingEditor
              captures: { i3: $.data.id }
            - call: "POST /comics/issues/${i1}/production-stages"
              payload: { assignment_id: "${a_w}", craft: "SCRIPT", planned_start_date: "2026-08-01", planned_due_date: "2026-09-30" }
              as: ManagingEditor
              captures: { st_1: $.data.id }
            - call: "POST /comics/production-stages/${st_1}/start"
              payload: {}
              as: Creator
              as_user_id: "${cr_w}"
            - call: "POST /comics/issues/${i2}/production-stages"
              payload: { assignment_id: "${a_w}", craft: "SCRIPT", planned_start_date: "2026-08-01", planned_due_date: "2026-10-20" }
              as: ManagingEditor
              captures: { st_2: $.data.id }
            - call: "POST /comics/production-stages/${st_2}/start"
              payload: {}
              as: Creator
              as_user_id: "${cr_w}"
            - call: "POST /comics/issues/${i3}/production-stages"
              payload: { assignment_id: "${a_w}", craft: "SCRIPT", planned_start_date: "2026-08-01", planned_due_date: "2026-11-10" }
              as: ManagingEditor
              captures: { st_3: $.data.id }
            - call: "POST /comics/production-stages/${st_3}/start"
              payload: {}
              as: Creator
              as_user_id: "${cr_w}"
            - call: "POST /comics/issues/${i1}/variant-covers"
              payload: { code: "A", kind: "STANDARD", cover_price_cents: 399 }
              as: SalesDirector
              captures: { cv1: $.data.id }
            - call: "POST /comics/issues/${i2}/variant-covers"
              payload: { code: "A", kind: "STANDARD", cover_price_cents: 399 }
              as: SalesDirector
              captures: { cv2: $.data.id }
            - call: "POST /comics/issues/${i3}/variant-covers"
              payload: { code: "A", kind: "STANDARD", cover_price_cents: 399 }
              as: SalesDirector
              captures: { cv3: $.data.id }
            - call: "POST /comics/catalogs"
              payload: { solicitation_month: "2026-08", submission_deadline: "2026-08-20", on_sale_month: "2026-10", max_slots: 2 }
              as: SalesDirector
              captures: { cat: $.data.id }
            - call: "POST /comics/catalogs/${cat}/solicitations"
              payload: { issue_id: "${i1}", cover_image_url: "https://cdn.example.com/nk1.jpg", copy_text: "Nebula Knights #1 debut: the Knights answer a distress call from the rim colonies.", variant_cover_ids: ["${cv1}"] }
              as: ManagingEditor
              captures: { sol1: $.data.id }
            - call: "POST /comics/solicitations/${sol1}/submit"
              payload: {}
              as: ManagingEditor
            - call: "POST /comics/catalogs/${cat}/solicitations"
              payload: { issue_id: "${i2}", cover_image_url: "https://cdn.example.com/nk2.jpg", copy_text: "Nebula Knights #2: the rim colony siege begins as Vex changes sides.", variant_cover_ids: ["${cv2}"] }
              as: ManagingEditor
              captures: { sol2: $.data.id }
            - call: "POST /comics/solicitations/${sol2}/submit"
              payload: {}
              as: ManagingEditor
            - call: "POST /comics/catalogs/${cat}/solicitations"
              payload: { issue_id: "${i3}", cover_image_url: "https://cdn.example.com/nk3.jpg", copy_text: "Nebula Knights #3: the Knights regroup above the shattered ring for a last stand.", variant_cover_ids: ["${cv3}"] }
              as: ManagingEditor
              captures: { sol3: $.data.id }
            - call: "POST /comics/solicitations/${sol3}/submit"
              payload: {}
              as: ManagingEditor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T00:00:00Z" }
              as: SalesDirector
            - call: "POST /comics/catalogs/${cat}/lock"
              payload: {}
              as: SalesDirector
            - call: "POST /comics/solicitations/${sol1}/accept"
              payload: {}
              as: SalesDirector
            - call: "POST /comics/solicitations/${sol2}/accept"
              payload: {}
              as: SalesDirector
          trigger:
            - call: "POST /comics/solicitations/${sol3}/accept"
              payload: {}
              as: SalesDirector
            - call: "POST /comics/solicitations/${sol2}/withdraw"
              payload: { reason: "cover art not cleared" }
              as: SalesDirector
            - call: "POST /comics/solicitations/${sol3}/accept"
              payload: {}
              as: SalesDirector
          assert:
            - "before the trigger Catalog.${cat}.accepted_slot_count == 2 == Catalog.${cat}.max_slots"
            - "the first ${sol3} accept -> 409 ERR_CATALOG_SLOTS_EXHAUSTED with Solicitation.${sol3}.status still SUBMITTED and accepted_slot_count still 2"
            - "the withdraw -> 200 with Solicitation.${sol2}.status == WITHDRAWN, withdrawn_reason set, and Catalog.${cat}.accepted_slot_count == 1 (recomputed over the ACCEPTED set)"
            - "the second ${sol3} accept -> 200 with Solicitation.${sol3}.status == ACCEPTED and Catalog.${cat}.accepted_slot_count == 2 again"
            - "the freed slot went to a different issue: publishing the catalog now sets Issue.${i1}.commercial_status == SOLICITED and Issue.${i3}.commercial_status == SOLICITED while Issue.${i2}.commercial_status stays UNSOLICITED"
            - "withdrawing ${sol2} a second time -> 409 ERR_INVALID_STATE and accepted_slot_count stays 2 (no double credit)"
            - "a SUBMITTED (never accepted) solicitation withdrawal does not change accepted_slot_count, so the compensation is conditional on the row having held a slot"
