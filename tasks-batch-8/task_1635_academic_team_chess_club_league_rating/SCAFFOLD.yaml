- entity: QualificationBid
  initial_state: OFFERED
  terminal_states:
  - ACCEPTED
  - DECLINED
  - EXPIRED
  transitions:
  - from: OFFERED
    to: ACCEPTED
    trigger: POST /api/qualification-bids/{bidId}/accept
    actor: ClubCoach
    preconditions:
    - Bid in OFFERED (ERR_BID_INVALID_STATE — checked first)
    - Season of the bid in ACTIVE | FINALIZING (ERR_SEASON_INVALID_STATE)
    - Acting coach belongs to bid.club_id (ERR_FORBIDDEN_RESOURCE_OWNERSHIP)
    side_effects:
    - 'If bid_type == TEAM_STATE and club.account_balance_cents >= 0: system creates a NATIONAL bid (OFFERED, same club, offer_deadline
      = clock + 7 days)'
  - from: OFFERED
    to: DECLINED
    trigger: POST /api/qualification-bids/{bidId}/decline
    actor: ClubCoach
    preconditions:
    - Bid in OFFERED (ERR_BID_INVALID_STATE — checked first)
    - Acting coach belongs to bid.club_id (ERR_FORBIDDEN_RESOURCE_OWNERSHIP)
    side_effects:
    - 'If bid_type == INDIVIDUAL_STATE: promote next eligible player in the same region per qualification_bid_selection; empty
      pool -> no new bid'
  - from: OFFERED
    to: EXPIRED
    trigger: system (POST /api/_clock/set_current_utc sweep when offer_deadline < new clock)
    actor: system
    preconditions: []
    side_effects:
    - 'If bid_type == INDIVIDUAL_STATE: promote next eligible player in the same region per qualification_bid_selection; empty
      pool -> no new bid'
- entity: RatingEvent
  initial_state: EFFECTIVE
  terminal_states:
  - VOIDED
  transitions:
  - from: EFFECTIVE
    to: VOIDED
    trigger: system (dispute OVERTURNED cascade on an already-confirmed pairing)
    actor: system
    preconditions: []
    side_effects:
    - Owning player replayed via rating_replay; rating, peak_rating, rated_games_played, is_provisional recomputed
concurrency_rules:
- rule_id: pairing-create-stale-meet
  parent_entity: Meet
  write_endpoint: POST /api/meets/{meetId}/pairings
  occ_field: expected_meet_version
  description: 'Creating a Pairing supersedes any existing non-terminal pairing at the same

    (round_number, board_number) slot, and this is legitimate repeatedly while the

    meet is in DRAFT or SCHEDULED. A create carrying an expected_meet_version that

    no longer matches Meet.version is rejected as stale, because another pairing

    write has advanced the meet since the client observed it.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: ledger-adjust-stale-club
  parent_entity: Club
  write_endpoint: POST /api/clubs/{clubId}/ledger-entries
  occ_field: expected_club_version
  description: 'Posting a manual ADJUSTMENT LedgerEntry is always legitimate product-wise, so

    the only guard against a writer whose view of the Club account is outdated is

    the OCC check: a post carrying an expected_club_version that no longer matches

    Club.version (because a prior ledger post advanced it) is rejected as stale.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: standings-finalize-stale-season
  parent_entity: Season
  write_endpoint: POST /api/seasons/{seasonId}/standings/finalize
  occ_field: expected_season_version
  description: 'Finalizing standings in FINALIZING replaces the prior snapshot set and may be

    repeated legitimately; a finalize carrying an expected_season_version that no

    longer matches Season.version (because a prior finalize advanced it) is

    rejected as stale.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
calculations:
- name: rating_update
  trigger: Pairing reaches CONFIRMED with a rated result (WHITE_WIN | BLACK_WIN | DRAW); also during rating_replay for each
    effective event
  algorithm: weighted_scoring
  formula: "Inputs: Rp = player rating before event, Ro = opponent_rating_snapshot,\n        S = score (1 | 0.5 | 0), n =\
    \ player rated games before this event\n        (initial_rated_games + count of prior effective events),\n        T =\
    \ season.provisional_game_threshold.\nVariant selection: n < T -> PROVISIONAL else ESTABLISHED.\nPROVISIONAL: new = round_half_up(\
    \ (Rp * n + Ro + 400 * (2*S - 1)) / (n + 1) )\nESTABLISHED: E = 1 / (1 + 10 ^ ((Ro - Rp) / 400))\n             K = 32\
    \ if Rp < 2100; 24 if 2100 <= Rp < 2400; 16 if Rp >= 2400\n             new = Rp + round_half_up(K * (S - E))\nBoth: new\
    \ = clamp(new, RATING_FLOOR, RATING_CEIL).\nround_half_up(x) = floor(x + 0.5) for all signs.\nRatingEvent stores formula_variant,\
    \ k_factor (null for PROVISIONAL),\nopponent_rating_snapshot, score, rating_before, rating_after, confirmed_at.\nForfeit\
    \ results (WHITE_FORFEIT_WIN | BLACK_FORFEIT_WIN | DOUBLE_FORFEIT)\ncreate NO RatingEvents.\n"
  input_set: The two players of a CONFIRMED pairing with a rated result
  constants:
    RATING_FLOOR: 100
    RATING_CEILING: 2900
    PROVISIONAL_SWING: 400
    K_LOW: 32
    K_MID: 24
    K_HIGH: 16
    K_TIER_BOUND_1: 2100
    K_TIER_BOUND_2: 2400
  precision: integer ratings, round_half_up via floor(x+0.5)
  variants:
  - name: PROVISIONAL
    when: player's rated games before the event < season.provisional_game_threshold
    difference: running-average formula; no K-factor; produces different results than ESTABLISHED for identical (Rp, Ro, S)
  - name: ESTABLISHED
    when: player's rated games before the event >= season.provisional_game_threshold
    difference: Elo expectation with tiered K; produces different results than PROVISIONAL for identical (Rp, Ro, S)
- name: rating_replay
  trigger: any RatingEvent of the player is created or voided
  algorithm: projection
  formula: 'effective_events = player''s RatingEvents with status == EFFECTIVE,

    ordered by (confirmed_at ASC, pairing created_at ASC) — never by id.

    Replay: rating = initial_rating; games = initial_rated_games;

    for each event in order: recompute rating_before = rating,

    rating_after = rating_update(rating, event.opponent_rating_snapshot,

    event.score, games, T), then rating = rating_after, games += 1.

    opponent_rating_snapshot is frozen at original confirmation and is NOT

    recomputed during replay, so each player''s replay is self-contained.

    After replay: player.rating = rating; rated_games_played = games;

    peak_rating = max(initial_rating, all effective rating_after);

    is_provisional = games < T.

    '
  input_set: all RatingEvents of one player with status == EFFECTIVE
  precision: integer ratings per rating_update
- name: membership_fee
  trigger: POST /api/memberships (at creation)
  algorithm: threshold
  formula: "fee_cents = season.regular_due_cents if created_at <= season.dues_deadline\n            else season.late_due_cents\n\
    Boundary: created_at exactly equal to dues_deadline pays regular.\n"
  input_set: the Membership being created and its Season
  precision: integer cents, no rounding
- name: entry_fee
  trigger: POST /api/sections/{sectionId}/entries (at creation)
  algorithm: tiered_pricing
  formula: "if tournament.early_bird_deadline is set and logical clock <= early_bird_deadline:\n  fee_cents = round_half_up_cents(tournament.entry_fee_cents\
    \ * (1 - tournament.early_bird_discount_pct))\nelse:\n  fee_cents = tournament.entry_fee_cents\nROUNDING ORDER IS PINNED:\
    \ each entry's fee is rounded to whole cents\n(round_half_up) at creation; a club's total charge is the SUM of the\nper-entry\
    \ rounded fees, never round(sum of unrounded fees).\nBoundary: clock exactly equal to early_bird_deadline gets the discount.\n"
  input_set: the TournamentEntry being created and its Tournament
  precision: integer cents, round_half_up per entry
  variants:
  - name: EARLY_BIRD
    when: clock <= tournament.early_bird_deadline
    difference: percentage discount applied then rounded per entry
  - name: STANDARD
    when: no deadline configured or clock past it
    difference: full entry_fee_cents, no rounding needed
- name: withdrawal_refund
  trigger: POST /api/entries/{entryId}/withdraw and tournament cancel cascade
  algorithm: threshold
  formula: "Manual withdraw, keyed on tournament.status at withdrawal time:\n  REGISTRATION_OPEN   -> refund_cents = fee_cents\n\
    \  REGISTRATION_CLOSED -> refund_cents = round_half_up(fee_cents * 0.5)\n  RUNNING | COMPLETED -> refund_cents = 0\nTournament\
    \ cancel cascade: refund_cents = fee_cents regardless of status.\nManual withdraw from CHECKED_IN: refund_cents = 0 regardless\
    \ of status.\n"
  input_set: the TournamentEntry being withdrawn and its Tournament
  constants:
    CLOSED_REFUND_PCT: 0.5
  precision: integer cents, round_half_up
- name: club_account_balance
  trigger: any LedgerEntry is posted for the club
  algorithm: aggregation
  formula: "account_balance_cents = SUM(amount_cents) over ALL LedgerEntry rows of the club\n(reversals are separate REVERSAL\
    \ rows carrying the negated amount; originals\nare never mutated in amount).\nAfter each recompute, apply Club standing\
    \ auto-transition:\n  GOOD_STANDING and balance < 0  -> DELINQUENT\n  DELINQUENT and balance >= 0    -> GOOD_STANDING\n\
    \  SUSPENDED                      -> unchanged by posts\n"
  input_set: all LedgerEntry rows of one club
  precision: integer cents
- name: team_standings
  trigger: Meet -> COMPLETED (live read recomputes on every call); standings/finalize snapshots the result
  algorithm: aggregation
  formula: "For each club of the season, over meets with status == COMPLETED only:\n  board points per pairing (CONFIRMED\
    \ only):\n    WHITE_WIN -> host 1, away 0; BLACK_WIN -> host 0, away 1;\n    DRAW -> 0.5 each; WHITE_FORFEIT_WIN -> host\
    \ 1, away 0;\n    BLACK_FORFEIT_WIN -> host 0, away 1; DOUBLE_FORFEIT -> 0 each.\n  forfeit_losses: +1 to the forfeiting\
    \ side (both on DOUBLE_FORFEIT).\n  meet game_points_gp = sum of board points; match_points:\n    gp > opp gp -> 2; gp\
    \ == opp gp -> 1; gp < opp gp -> 0.\n  sonneborn_berger = SUM over completed meets of\n    (opponent's FINAL season match_points\
    \ * our match result vs them (1 | 0.5 | 0)).\nRanking order (pinned cascade, no randomness):\n  1. match_points DESC\n\
    \  2. head-to-head match points DESC — applied only when exactly two clubs are\n     tied on match_points; skipped (0)\
    \ for larger tied groups\n  3. sonneborn_berger DESC\n  4. game_points DESC\n  5. forfeit_losses ASC\n  6. club created_at\
    \ ASC (earlier-created club ranks higher; ids never used)\n"
  input_set: clubs of the season; meets with status == COMPLETED; pairings of those meets with status == CONFIRMED
  precision: game points in half-point units
- name: performance_points
  trigger: Pairing CONFIRMED with rated or forfeit result; dispute OVERTURNED cascade; entry check-in
  algorithm: aggregation
  formula: "Per player, full recompute from sources:\n  +3 per CONFIRMED meet game won (WHITE_WIN as white / BLACK_WIN as\
    \ black)\n  +1 per CONFIRMED DRAW\n  +1 per CONFIRMED forfeit win (WHITE_FORFEIT_WIN as white / BLACK_FORFEIT_WIN as black)\n\
    \  +0 per loss or DOUBLE_FORFEIT\n  +2 per TournamentEntry in CHECKED_IN | FINISHED\nOnly pairings of meets in IN_PROGRESS\
    \ | COMPLETED with status CONFIRMED count.\n"
  input_set: CONFIRMED pairings of the player; the player's TournamentEntries in CHECKED_IN | FINISHED
  precision: integer points
- name: qualification_bid_selection
  trigger: POST /api/seasons/{seasonId}/bids/generate; DECLINED/EXPIRED promotion for INDIVIDUAL_STATE bids
  algorithm: topological
  formula: "INDIVIDUAL_STATE eligibility (per player, per season):\n  player.status == ACTIVE AND club.status != SUSPENDED\
    \ AND\n  membership for (player, season) in PAID | WAIVED AND\n  performance_points >= MIN_BID_POINTS AND\n  no existing\
    \ bid for (player, season) in OFFERED | ACCEPTED.\nCandidate pool grouped by club.region_code.\nRanking (pinned): performance_points\
    \ DESC, rating DESC,\n  rated_games_played DESC, player.created_at ASC. Ids never used.\ngenerate: offer to top season.state_bid_slots_per_region\
    \ per region.\npromotion (on DECLINED | EXPIRED): offer to the single highest-ranked\n  player in the same region satisfying\
    \ the eligibility filter above AND\n  having no INDIVIDUAL_STATE bid for the season in ANY status\n  (OFFERED | ACCEPTED\
    \ | DECLINED | EXPIRED all exclude); if the pool is\n  empty, no new bid is created.\noffer_deadline = logical clock +\
    \ BID_OFFER_DAYS days.\nTEAM_STATE (generate only): per region, the club ranked first by\n  team_standings over that region's\
    \ clubs receives one bid.\nNATIONAL: created by the system when a TEAM_STATE bid is ACCEPTED and the\n  club's account_balance_cents\
    \ >= 0.\n"
  input_set: players/clubs of the season passing the eligibility filters
  constants:
    MIN_BID_POINTS: 6
    BID_OFFER_DAYS: 7
  precision: integer points and ratings
- name: travel_stipend
  trigger: POST /api/travel-stipends (ACTUAL posting); Club read (PROJECTED field)
  algorithm: aggregation
  formula: "meets_completed = count of meets this season with status == COMPLETED\n  where club is host or away\nmeets_projected\
    \ = count of meets with status in\n  SCHEDULED | PAIRINGS_PUBLISHED | IN_PROGRESS | COMPLETED\nACTUAL amount_cents = club.travel_tier\
    \ * season.travel_base_cents * min(meets_completed, MEET_CAP)\nPROJECTED (Club.projected_travel_stipend_cents) =\n  club.travel_tier\
    \ * season.travel_base_cents * min(meets_projected, MEET_CAP)\nVariants differ only in inclusion set; identical data with\
    \ a scheduled-but-\nuncompleted meet yields PROJECTED > ACTUAL.\n"
  input_set: meets of the club's season filtered by status per variant
  constants:
    MEET_CAP: 10
  precision: integer cents
  variants:
  - name: PROJECTED
    when: computed on Club read
    difference: counts SCHEDULED | PAIRINGS_PUBLISHED | IN_PROGRESS | COMPLETED meets (forward-looking)
  - name: ACTUAL
    when: posted via POST /api/travel-stipends in FINALIZING season
    difference: counts COMPLETED meets only
- name: season_invoice_total
  trigger: GET /api/clubs/{clubId}/season-invoice?season_id=...
  algorithm: waterfall_allocation
  formula: "EVALUATION ORDER IS PINNED (the credit tier keys on the pre-credit subtotal,\nso order must not be rearranged):\n\
    \  1. dues_subtotal_cents = SUM(fee_cents) over memberships of the club's\n     players for the season with status ==\
    \ PAID (WAIVED, INVOICED and\n     REFUNDED contribute 0)\n  2. entries_subtotal_cents = SUM(fee_cents - refund_cents)\
    \ over all\n     TournamentEntries of the club's players in tournaments of the season\n  3. subtotal = dues_subtotal_cents\
    \ + entries_subtotal_cents\n  4. credit_tier_pct = 0.10 if subtotal >= TIER2_CENTS else\n                       0.05 if\
    \ subtotal >= TIER1_CENTS else 0\n  5. volume_credit_cents = round_half_up(subtotal * credit_tier_pct)\n  6. total_cents\
    \ = subtotal - volume_credit_cents\nBoundary: subtotal exactly TIER1_CENTS earns 5%; TIER1_CENTS - 1 earns 0.\n"
  input_set: memberships and entries of the club for the season per the status filters above
  constants:
    TIER1_CENTS: 40000
    TIER2_CENTS: 80000
    TIER1_PCT: 0.05
    TIER2_PCT: 0.1
  precision: integer cents, round_half_up at step 5 only
validations:
- priority: 1
  category: auth
  check: X-User-ID and X-User-Role headers present and non-empty
  error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
  http_status: 400
  applies_to: all
- priority: 2
  category: auth
  check: X-User-Role is listed in the endpoint's roles
  error_id: ERR_INSUFFICIENT_PERMISSIONS
  http_status: 403
  applies_to: all
- priority: 3
  category: existence
  check: Path ids resolve left-to-right (season, club, coach, player, meet, pairing, dispute, tournament, section, entry,
    assignment, bid, ledger entry, stipend)
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all endpoints with path ids
- priority: 4
  category: existence
  check: Body FK references (club_id, player_id, season_id, host_club_id, away_club_id, white_player_id, black_player_id,
    coach_id, meet_id, tournament_id) resolve
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: create endpoints with FK inputs
- priority: 5
  category: auth
  check: 'Entity-backed ownership: ClubCoach acts only within own club''s scope (players, memberships, meets of own club,
    entries of own players, disputes on own meets, bids of own club); Proctor confirms only own assignment'
  error_id: ERR_FORBIDDEN_RESOURCE_OWNERSHIP
  http_status: 403
  applies_to: role-scoped mutation endpoints
- priority: 6
  category: concurrency
  check: expected_<parent>_version matches the parent's current version
  error_id: ERR_STALE_VERSION
  http_status: 412
  applies_to: POST /api/meets/{meetId}/pairings; POST /api/clubs/{clubId}/ledger-entries; POST /api/seasons/{seasonId}/standings/finalize
- priority: 7
  category: business_request
  check: Required fields present, types correct, enums in range, no unknown fields; date ranges ordered (start <= end); reason
    >= 10 chars; amount_cents non-zero; round/board within meet bounds
  error_id: ERR_INVALID_REQUEST
  http_status: 400
  applies_to: all mutation endpoints
- priority: 8
  category: state
  check: Target entity in a from-state listed for the transition (per-entity errors); on POST /api/sections/{sectionId}/entries
    the tournament state check precedes the section state check
  error_id: ERR_SEASON_INVALID_STATE | ERR_CLUB_INVALID_STATE | ERR_COACH_INVALID_STATE | ERR_PLAYER_INVALID_STATE | ERR_MEMBERSHIP_NOT_PAYABLE
    | ERR_MEMBERSHIP_NOT_REFUNDABLE | ERR_MEET_INVALID_STATE | ERR_PAIRING_INVALID_STATE | ERR_DISPUTE_INVALID_STATE | ERR_TOURNAMENT_INVALID_STATE
    | ERR_SECTION_INVALID_STATE | ERR_ENTRY_INVALID_STATE | ERR_ASSIGNMENT_INVALID_STATE | ERR_BID_INVALID_STATE
  http_status: 409
  applies_to: all action endpoints
- priority: 9
  category: business_integrity
  check: 'Club not SUSPENDED for roster/meet/entry/bid writes (ERR_CLUB_SUSPENDED); player not SUSPENDED for pairing/entry
    (ERR_PLAYER_SUSPENDED); segregation of duties: ledger reverser != poster (ERR_SEGREGATION_OF_DUTIES); pairing confirmer''s
    club != reporter''s club (ERR_SAME_CLUB_CONFIRMATION)'
  error_id: ERR_CLUB_SUSPENDED | ERR_PLAYER_SUSPENDED | ERR_SEGREGATION_OF_DUTIES | ERR_SAME_CLUB_CONFIRMATION
  http_status: 403
  applies_to: scoped mutations
- priority: 10
  category: business_referential
  check: Pairing/entry requires membership of the player for the season in PAID | WAIVED (ERR_MEMBERSHIP_REQUIRED); pairing
    players belong to the meet's host/away clubs in the right colors (ERR_PLAYER_CLUB_MISMATCH)
  error_id: ERR_MEMBERSHIP_REQUIRED | ERR_PLAYER_CLUB_MISMATCH
  http_status: 409
  applies_to: POST /api/meets/{meetId}/pairings; POST /api/sections/{sectionId}/entries
- priority: 11
  category: business_constraint
  check: Rating band inclusive (ERR_RATING_OUT_OF_BAND); provisional gate (ERR_PROVISIONAL_NOT_ALLOWED); section capacity
    (ERR_SECTION_FULL); tournament capacity (ERR_TOURNAMENT_CAPACITY_EXCEEDED); uniqueness (ERR_DUPLICATE_ENTRY, ERR_DUPLICATE_MEMBERSHIP,
    ERR_DUPLICATE_STIPEND); host != away (ERR_SAME_CLUB_MEET); ledger entry not already reversed (ERR_ALREADY_REVERSED)
  error_id: ERR_RATING_OUT_OF_BAND | ERR_PROVISIONAL_NOT_ALLOWED | ERR_SECTION_FULL | ERR_TOURNAMENT_CAPACITY_EXCEEDED | ERR_DUPLICATE_ENTRY
    | ERR_DUPLICATE_MEMBERSHIP | ERR_DUPLICATE_STIPEND | ERR_SAME_CLUB_MEET | ERR_ALREADY_REVERSED
  http_status: 409
  applies_to: creation and reversal endpoints
- priority: 12
  category: business_temporal
  check: Meet date occupation per club (ERR_MEET_DATE_CONFLICT); proctor overlap with 1-day rest buffer (ERR_PROCTOR_DOUBLE_BOOKED)
  error_id: ERR_MEET_DATE_CONFLICT | ERR_PROCTOR_DOUBLE_BOOKED
  http_status: 409
  applies_to: meet schedule/reschedule; proctor-assignment create
- priority: 13
  category: business_fiscal
  check: 'Charges may not drive club balance below zero: membership pay and entry creation require account_balance_cents -
    charge >= 0'
  error_id: ERR_INSUFFICIENT_FUNDS
  http_status: 402
  applies_to: POST /api/memberships/{membershipId}/pay; POST /api/sections/{sectionId}/entries
endpoints:
- method: POST
  path: /api/_clock/set_current_utc
  description: Set the server's logical clock. Before any call the clock reads exactly 2026-08-01T00:00:00Z and never falls
    back to wall-clock. Setting the clock sweeps OFFERED QualificationBids whose offer_deadline < new time into EXPIRED (with
    promotion cascade).
  roles:
  - FederationAdmin
  code: 200
  input:
  - to_iso8601
  output:
    current_utc: string
  side_effects:
  - bid expiry sweep with promotion
- method: POST
  path: /api/seasons
  description: Create a season
  roles:
  - FederationAdmin
  code: 201
  input:
  - name
  - start_date
  - end_date
  - dues_deadline
  - regular_due_cents
  - late_due_cents
  - provisional_game_threshold?
  - base_rating?
  - state_bid_slots_per_region?
  - travel_base_cents
  output: Season
  side_effects:
  - status = REGISTRATION
- method: GET
  path: /api/seasons
  description: List seasons
  roles:
  - FederationAdmin
  - ClubCoach
  - Proctor
  - Treasurer
  - Auditor
  code: 200
  input:
  - status?
  - limit?
  - offset?
  output: Season[]
  side_effects: []
- method: GET
  path: /api/seasons/{seasonId}
  description: Get a season
  roles:
  - FederationAdmin
  - ClubCoach
  - Proctor
  - Treasurer
  - Auditor
  code: 200
  input: []
  output: Season
  side_effects: []
- method: POST
  path: /api/seasons/{seasonId}/activate
  description: REGISTRATION -> ACTIVE
  roles:
  - FederationAdmin
  code: 200
  input: []
  output: Season
  side_effects: []
- method: POST
  path: /api/seasons/{seasonId}/finalize
  description: ACTIVE -> FINALIZING
  roles:
  - FederationAdmin
  code: 200
  input: []
  output: Season
  side_effects: []
- method: POST
  path: /api/seasons/{seasonId}/reopen
  description: FINALIZING -> ACTIVE (cyclic)
  roles:
  - FederationAdmin
  code: 200
  input: []
  output: Season
  side_effects: []
- method: POST
  path: /api/seasons/{seasonId}/complete
  description: FINALIZING -> COMPLETED; requires standings snapshot and no open disputes
  roles:
  - FederationAdmin
  code: 200
  input: []
  output: Season
  side_effects:
  - grade-12 ACTIVE players of season clubs -> GRADUATED
- method: GET
  path: /api/seasons/{seasonId}/standings
  description: Live computed standings for the season (team_standings)
  roles:
  - FederationAdmin
  - ClubCoach
  - Proctor
  - Treasurer
  - Auditor
  code: 200
  input: []
  output:
    standings: array
  side_effects: []
- method: POST
  path: /api/seasons/{seasonId}/standings/finalize
  description: Snapshot standings (replaces prior snapshots); OCC on Season.version; only in FINALIZING
  roles:
  - FederationAdmin
  code: 201
  input:
  - expected_season_version
  output: StandingSnapshot[]
  side_effects:
  - delete prior StandingSnapshots of the season; create one per club with rank; increments Season.version by 1
- method: POST
  path: /api/seasons/{seasonId}/bids/generate
  description: Bulk-generate INDIVIDUAL_STATE (top slots per region) and TEAM_STATE (top club per region) bids; only in FINALIZING
  roles:
  - FederationAdmin
  code: 201
  input: []
  output: QualificationBid[]
  side_effects:
  - creates OFFERED bids per qualification_bid_selection; skips players already OFFERED/ACCEPTED
- method: POST
  path: /api/clubs
  description: Register a club for a season
  roles:
  - FederationAdmin
  code: 201
  input:
  - season_id
  - name
  - school_name
  - region_code
  - travel_tier
  output: Club
  side_effects:
  - status = GOOD_STANDING; account_balance_cents = 0
- method: GET
  path: /api/clubs
  description: List clubs
  roles:
  - FederationAdmin
  - ClubCoach
  - Proctor
  - Treasurer
  - Auditor
  code: 200
  input:
  - season_id?
  - status?
  - region_code?
  - limit?
  - offset?
  output: Club[]
  side_effects: []
- method: GET
  path: /api/clubs/{clubId}
  description: Get a club (includes computed balance, standing, projected stipend)
  roles:
  - FederationAdmin
  - ClubCoach
  - Proctor
  - Treasurer
  - Auditor
  code: 200
  input: []
  output: Club
  side_effects: []
- method: POST
  path: /api/clubs/{clubId}/suspend
  description: GOOD_STANDING|DELINQUENT -> SUSPENDED
  roles:
  - FederationAdmin
  code: 200
  input: []
  output: Club
  side_effects: []
- method: POST
  path: /api/clubs/{clubId}/reinstate
  description: SUSPENDED -> GOOD_STANDING (or DELINQUENT when balance < 0)
  roles:
  - FederationAdmin
  code: 200
  input: []
  output: Club
  side_effects: []
- method: GET
  path: /api/clubs/{clubId}/season-invoice
  description: Computed season invoice with volume credit (season_invoice_total)
  roles:
  - FederationAdmin
  - ClubCoach
  - Treasurer
  - Auditor
  code: 200
  input:
  - season_id
  output:
    dues_subtotal_cents: integer
    entries_subtotal_cents: integer
    volume_credit_cents: integer
    total_cents: integer
    credit_tier_pct: number
  side_effects: []
- method: POST
  path: /api/coaches
  description: Create a coach
  roles:
  - FederationAdmin
  code: 201
  input:
  - club_id
  - full_name
  - email
  - certification_level
  output: Coach
  side_effects:
  - status = ACTIVE
- method: GET
  path: /api/coaches
  description: List coaches
  roles:
  - FederationAdmin
  - ClubCoach
  - Proctor
  - Treasurer
  - Auditor
  code: 200
  input:
  - club_id?
  - status?
  - limit?
  - offset?
  output: Coach[]
  side_effects: []
- method: GET
  path: /api/coaches/{coachId}
  description: Get a coach
  roles:
  - FederationAdmin
  - ClubCoach
  - Proctor
  - Treasurer
  - Auditor
  code: 200
  input: []
  output: Coach
  side_effects: []
- method: POST
  path: /api/coaches/{coachId}/deactivate
  description: ACTIVE -> INACTIVE; releases ASSIGNED proctor assignments
  roles:
  - FederationAdmin
  code: 200
  input: []
  output: Coach
  side_effects:
  - ASSIGNED ProctorAssignments -> RELEASED
- method: POST
  path: /api/coaches/{coachId}/reactivate
  description: INACTIVE -> ACTIVE
  roles:
  - FederationAdmin
  code: 200
  input: []
  output: Coach
  side_effects: []
- method: POST
  path: /api/players
  description: Create a player (ClubCoach limited to own club); optional federation-seeded initial_rating/initial_rated_games
  roles:
  - ClubCoach
  - FederationAdmin
  code: 201
  input:
  - club_id
  - full_name
  - grade_level
  - initial_rating?
  - initial_rated_games?
  output: Player
  side_effects:
  - rating = initial_rating or season.base_rating; rated_games_played = initial_rated_games; is_provisional computed
- method: GET
  path: /api/players
  description: List players
  roles:
  - FederationAdmin
  - ClubCoach
  - Proctor
  - Treasurer
  - Auditor
  code: 200
  input:
  - club_id?
  - status?
  - is_provisional?
  - limit?
  - offset?
  output: Player[]
  side_effects: []
- method: GET
  path: /api/players/{playerId}
  description: Get a player (computed rating fields)
  roles:
  - FederationAdmin
  - ClubCoach
  - Proctor
  - Treasurer
  - Auditor
  code: 200
  input: []
  output: Player
  side_effects: []
- method: POST
  path: /api/players/{playerId}/deactivate
  description: ACTIVE -> INACTIVE
  roles:
  - ClubCoach
  - FederationAdmin
  code: 200
  input: []
  output: Player
  side_effects: []
- method: POST
  path: /api/players/{playerId}/reactivate
  description: INACTIVE -> ACTIVE
  roles:
  - ClubCoach
  - FederationAdmin
  code: 200
  input: []
  output: Player
  side_effects: []
- method: POST
  path: /api/players/{playerId}/suspend
  description: ACTIVE|INACTIVE -> SUSPENDED
  roles:
  - FederationAdmin
  code: 200
  input: []
  output: Player
  side_effects: []
- method: POST
  path: /api/memberships
  description: Create a membership (fee computed by membership_fee); one per (player, season)
  roles:
  - ClubCoach
  - FederationAdmin
  code: 201
  input:
  - player_id
  - season_id
  output: Membership
  side_effects:
  - fee_cents computed from logical clock vs season.dues_deadline; status = INVOICED
- method: GET
  path: /api/memberships
  description: List memberships
  roles:
  - FederationAdmin
  - ClubCoach
  - Proctor
  - Treasurer
  - Auditor
  code: 200
  input:
  - player_id?
  - season_id?
  - status?
  - limit?
  - offset?
  output: Membership[]
  side_effects: []
- method: GET
  path: /api/memberships/{membershipId}
  description: Get a membership
  roles:
  - FederationAdmin
  - ClubCoach
  - Proctor
  - Treasurer
  - Auditor
  code: 200
  input: []
  output: Membership
  side_effects: []
- method: POST
  path: /api/memberships/{membershipId}/pay
  description: INVOICED -> PAID; debits club ledger
  roles:
  - ClubCoach
  - Treasurer
  - FederationAdmin
  code: 200
  input: []
  output: Membership
  side_effects:
  - post MEMBERSHIP_DUE LedgerEntry -fee_cents; paid_at = clock; club balance + standing recompute
- method: POST
  path: /api/memberships/{membershipId}/waive
  description: INVOICED -> WAIVED
  roles:
  - FederationAdmin
  code: 200
  input: []
  output: Membership
  side_effects: []
- method: POST
  path: /api/memberships/{membershipId}/refund
  description: PAID -> REFUNDED; credits club ledger
  roles:
  - Treasurer
  code: 200
  input: []
