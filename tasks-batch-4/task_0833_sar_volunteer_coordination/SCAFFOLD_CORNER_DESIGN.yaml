  # ==========================================================================
  - section: cross_cutting
    instances:
      - name: occ_stale_resource_version_on_assignment_create_returns_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[assignment-create-stale-resource]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "A second assignment (non-overlapping window) carrying the pre-first-assignment expected_resource_version is rejected with ERR_STALE_VERSION (412); OCC checked after temporal passes."
        test_recipe:
          setup: ["A resource with one assignment already created (Resource.version advanced from the observed value)."]
          setup_api_calls:
            - call: "POST /sar/incidents"
              payload: { name: "Occ Inc", incident_type: "AIR_SEARCH", ics_incident_number: "OR-2026-1018" }
              as: Coordinator
              captures: { inc_id: $.data.id }
            - call: "POST /sar/tasks"
              payload: { incident_id: "${inc_id}", task_number: "T-1", task_type: "AIR_RECON", segment_area_sqkm: 20.0, planned_searcher_hours: 4, planned_start: "2026-05-02T06:00:00Z", planned_end: "2026-05-02T20:00:00Z" }
              as: Coordinator
              captures: { task_id: $.data.id }
            - call: "POST /sar/resources"
              payload: { name: "Fixed W1", resource_type: "FIXED_WING" }
              as: Coordinator
              captures: { res_id: $.data.id, r_v0: $.data.version }
            - call: "POST /sar/resource-assignments"
              payload: { resource_id: "${res_id}", task_id: "${task_id}", window_start: "2026-05-02T09:00:00Z", window_end: "2026-05-02T11:00:00Z", expected_resource_version: "${r_v0}" }
              as: Coordinator
          trigger:
            - call: "POST /sar/resource-assignments"
              payload: { resource_id: "${res_id}", task_id: "${task_id}", window_start: "2026-05-02T12:00:00Z", window_end: "2026-05-02T14:00:00Z", expected_resource_version: "${r_v0}" }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION"

      - name: occ_resource_version_increments_on_assignment_create
        claim_type: optimistic_concurrency
        grounds:
          - entities.Resource.fields.active_assignment_count
          - concurrency_rules[assignment-create-stale-resource]
        distinguishing_aspect: "Creating an assignment increments Resource.version by exactly 1 (from 1 to 2), giving the OCC check something to observe."
        test_recipe:
          setup: ["A fresh resource (version 1) and one assignment created against it."]
          setup_api_calls:
            - call: "POST /sar/incidents"
              payload: { name: "Occ2 Inc", incident_type: "AIR_SEARCH", ics_incident_number: "OR-2026-1019" }
              as: Coordinator
              captures: { inc_id: $.data.id }
            - call: "POST /sar/tasks"
              payload: { incident_id: "${inc_id}", task_number: "T-1", task_type: "AIR_RECON", segment_area_sqkm: 20.0, planned_searcher_hours: 4, planned_start: "2026-05-02T06:00:00Z", planned_end: "2026-05-02T20:00:00Z" }
              as: Coordinator
              captures: { task_id: $.data.id }
            - call: "POST /sar/resources"
              payload: { name: "UTV U1", resource_type: "UTV" }
              as: Coordinator
              captures: { res_id: $.data.id, r_v0: $.data.version }
            - call: "POST /sar/resource-assignments"
              payload: { resource_id: "${res_id}", task_id: "${task_id}", window_start: "2026-05-02T09:00:00Z", window_end: "2026-05-02T11:00:00Z", expected_resource_version: "${r_v0}" }
              as: Coordinator
          trigger:
            - call: "GET /sar/resources/${res_id}"
              payload: {}
              as: Coordinator
              captures: { ver: $.data.version, cnt: $.data.active_assignment_count }
          assert:
            - "ver == 2"
            - "cnt == 1"

      - name: fk_filtered_list_callouts_by_task_returns_children
        claim_type: flat
        grounds:
          - entities.Callout.fields.task_id
        distinguishing_aspect: "GET /sar/callouts?task_id returns the task's callouts as an array (FK reverse-reachability)."
        test_recipe:
          setup: ["A task with one callout."]
          setup_api_calls:
            - call: "POST /sar/incidents"
              payload: { name: "Fk Inc", incident_type: "WILDERNESS_SEARCH", ics_incident_number: "OR-2026-1020" }
              as: Coordinator
              captures: { inc_id: $.data.id }
            - call: "POST /sar/incidents/${inc_id}/activate"
              payload: {}
              as: IncidentCommander
            - call: "POST /sar/teams"
              payload: { name: "Fk Team", team_type: "GROUND", base_location: "Bend" }
              as: Coordinator
              captures: { team_id: $.data.id }
            - call: "POST /sar/members"
              payload: { team_id: "${team_id}", full_name: "Fk Vol", email: "fk@x.org", member_role: "SEARCHER" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /sar/tasks"
              payload: { incident_id: "${inc_id}", task_number: "T-1", task_type: "GRID_SEARCH", segment_area_sqkm: 5.0, planned_searcher_hours: 4, planned_start: "2026-05-02T08:00:00Z", planned_end: "2026-05-02T16:00:00Z" }
              as: Coordinator
              captures: { task_id: $.data.id }
            - call: "POST /sar/callouts"
              payload: { task_id: "${task_id}", member_id: "${m_id}" }
              as: Coordinator
              captures: { co_id: $.data.id }
          trigger:
            - call: "GET /sar/callouts?task_id=${task_id}"
              payload: {}
              as: Coordinator
              captures: { first_id: "$.data[0].id" }
          assert:
            - "first_id == ${co_id}"

  # ==========================================================================
  # excluded_because stubs — corners already exercised by a §1.8 instance
  # ==========================================================================
  - section: validations
    instances:
      - name: error_member_double_booked_stub
        claim_type: Temporal validation
        grounds:
          - errors[ERR_MEMBER_DOUBLE_BOOKED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / member_buffer_doublebook_on_deploy
          rationale: "The member closed-window + buffer double-book error is asserted as the trigger of the named §1.8 instance."

      - name: error_resource_window_conflict_stub
        claim_type: Temporal validation
        grounds:
          - errors[ERR_RESOURCE_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / resource_halfopen_adjacent_ok_overlap_rejected
          rationale: "The resource half-open overlap error is asserted as the trigger of the named §1.8 instance."

      - name: error_cert_requirement_not_met_stub
        claim_type: Violation → Error
        grounds:
          - errors[ERR_CERT_REQUIREMENT_NOT_MET]
        excluded_because:
          difficulty_instance: boundary_precision_check / cert_expiry_inclusive_boundary_on_deploy
          rationale: "The missing-valid-cert error is asserted at the inclusive expiry boundary in the named §1.8 instance."

      - name: error_task_not_ready_stub
        claim_type: Cross-entity validation
        grounds:
          - errors[ERR_TASK_NOT_READY]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / deploy_requires_task_ready
          rationale: "The Callout->Task readiness dependency error is asserted in the named §1.8 instance."

      - name: error_incident_not_demobilizing_stub
        claim_type: Cross-entity validation
        grounds:
          - errors[ERR_INCIDENT_NOT_DEMOBILIZING]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / claim_approve_requires_incident_demobilizing
          rationale: "The Claim->Incident approval-gate error is asserted in the named §1.8 instance."

  - section: state_machines
    instances:
      - name: cascade_incident_cancel_stub
        claim_type: Cascade down
        grounds:
          - state_machines.Incident.ACTIVE_to_CANCELLED
        excluded_because:
          difficulty_instance: transitive_cascade / incident_cancel_cascade_depth3
          rationale: "The incident-cancel cascade over tasks/callouts/members is exercised end-to-end by the named §1.8 instance."
