  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: monitoring_ratio_exactly_watch_floor_versus_ten_below
        grounds:
          - calculations.season_sink_faucet_ratio_bp
          - entities.MonitoringRun.fields.resulting_health
          - entities.Season.fields.economy_health
        distinguishing_aspect: |
          Epoch 1 lands on exactly ECONOMY_WATCH_FLOOR_BP (400/1000 = 4000 bp) and must resolve
          to WATCH because the band test is `>=`, while epoch 2 at 3990 bp (399/1000) — ten basis
          points below the same floor — must resolve to INFLATED.
        test_recipe:
          setup:
            - "Season S7 LIVE; player p1 (NA) with a SOFT_COIN account."
            - "Epoch-1 window rows: FAUCET 1000 and SINK 400, both appended on 2026-08-01."
            - "Epoch-2 window rows: FAUCET 1000 appended 2026-08-04 and SINK 399 appended 2026-08-05."
            - "MonitoringRun epoch 1 over [2026-08-01T00:00:00Z, 2026-08-02T00:00:00Z); MonitoringRun epoch 2 over [2026-08-04T00:00:00Z, 2026-08-06T00:00:00Z)."
            - "No reversal rows exist, so both windows are unaffected by the net-of-reversal exclusion."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { to_status: "LIVE" }
              as: ContentProducer
            - call: "POST /players"
              payload: { handle: "tide_p1", region_code: "NA", active_season_id: "${season_id}" }
              as: LiveOpsCommander
              captures: { p1_id: $.data.id }
