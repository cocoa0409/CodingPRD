  # ===================================================================
  # RULE 4 - Transitive cascades: A -> B -> C where each link is caused
  #          by the previous link, not by the original request
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: venue_close_cascades_slots_assignments_and_personnel_minutes_ledger
        grounds:
          - state_machines.Venue.OPEN_to_CLOSED
          - state_machines.SessionSlot.SCHEDULED_to_DISPLACED
          - state_machines.PersonnelAssignment.CONFIRMED_to_RELEASED
          - state_machines.SportEvent.SEEDED_to_SCHEDULE_HOLD
          - state_machines.SessionSlot.DISPLACED_to_SCHEDULED
          - entities.Personnel.fields.assigned_minutes_total
          - entities.SessionSlot.fields.confirmed_official_count
        distinguishing_aspect: |
          DEPTH 4 ON THE FACILITY SPINE, triggered by POST /venues/{venue_id}/close: link 1 sets
          Venue.status = CLOSED, link 2 is caused by link 1 (SessionSlot SCHEDULED -> DISPLACED),
          link 3 is caused by link 2 (PersonnelAssignment CONFIRMED -> RELEASED, which the close
          request never named), link 4 is caused by link 3 (Personnel.assigned_minutes_total falls
          60 -> 0), and link 2 additionally drives SportEvent SEEDED -> SCHEDULE_HOLD; the
          subsequent reschedule proves the cascade is NOT symmetric, restoring the slot and the
          event but leaving the released assignment and the zeroed minutes ledger untouched.
