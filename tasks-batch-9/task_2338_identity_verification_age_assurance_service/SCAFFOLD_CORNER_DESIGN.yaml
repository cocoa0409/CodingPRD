      - call: POST /idv/method-profiles
        payload: {method_code: DATABASE_CHECK, vendor_code: dbv1, assurance_weight: 25, acceptance_floor_bps: 6000, far_bps: 80, frr_bps: 600, strong_evidence: false, cost_cents: 40}
        as: PlatformAdmin
