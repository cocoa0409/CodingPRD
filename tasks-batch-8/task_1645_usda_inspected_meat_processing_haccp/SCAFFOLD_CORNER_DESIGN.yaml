      - name: humane_audit_exact_thresholds_pass
        claim_type: threshold
        grounds: [calculations.humane_audit_outcome, entities.HumaneHandlingAudit.fields.outcome]
        distinguishing_aspect: "All three audit thresholds are inclusive at the passing edge: 99.0 / 3.0 / 10.0 yields PASSED and creates no NR."
        test_recipe:
          setup: ["OPEN day on a SLAUGHTER plan"]
          setup_api_calls:
