            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Single offer", body_text: "One offer disapproved by R1 and appealed by its owner.", declared_category_codes: ["FIN_CREDIT"], target_country_codes: ["US"], landing_page_url: "https://www.beaconlending.example/one", display_url: "https://www.beaconlending.example/one" }
              as: Advertiser
