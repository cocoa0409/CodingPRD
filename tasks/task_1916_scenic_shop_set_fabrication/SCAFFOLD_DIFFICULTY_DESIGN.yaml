      - name: bay_window_adjacency_end_equals_start_allowed
        grounds:
          - errors[ERR_BAY_OVERLAP]
          - state_machines.BayReservation.ACTIVE_to_RELEASED
        distinguishing_aspect: |
          Metric: interval adjacency (half-open [start, end)). A reservation
          whose window_start equals an existing reservation's window_end on
          the SAME bay_slot must be ACCEPTED (zero overlap), while one
          overlapping by a day must be rejected — pinning the half-open
          boundary treatment.
        test_recipe:
          setup:
            - "Production SCHEDULED (deadline 2026-09-26); one ACTIVE reservation slot 1 [2026-09-01, 2026-09-10)"
