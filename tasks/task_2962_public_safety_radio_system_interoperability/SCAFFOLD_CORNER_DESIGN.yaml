          trigger:
            - call: "POST /radio-system/talkpath-requests"
              payload: { site_id: "${site_prc_id}", talkgroup_id: "${tg_prc_id}", unit_id: "${unit_prc5}", request_kind: "PRIORITY" }
              as: Dispatcher
              as_user_id: "${agency_prc_id}"
              captures: { priority_class_error_id: "$.data.error_id" }
            - call: "POST /radio-system/talkpath-requests"
              payload: { site_id: "${site_prc_id}", talkgroup_id: "${tg_prc_id}", unit_id: "${unit_prc3}", request_kind: "PRIORITY" }
              as: Dispatcher
              as_user_id: "${agency_prc_id}"
