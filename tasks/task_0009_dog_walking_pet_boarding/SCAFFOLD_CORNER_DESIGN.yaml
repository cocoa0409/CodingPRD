  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_correct_version_succeeds_on_cancel
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[booking-cancel-stale-version]"]
        excluded_because:
          difficulty_instance: compensating_invariant / cancel_confirmed_booking_preserves_money_ledger_invariant
          rationale: "Same OCC cancel call (with correct version) is the trigger in the named §1.8 instance; the success path is asserted there."

      - name: occ_stale_version_rejected_on_cancel
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[booking-cancel-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Negative OCC path: cancelling a CONFIRMED Booking with expected_booking_version one less than current returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Booking b_occ CONFIRMED; version captured at confirm."]
          setup_api_calls:
            - call: "POST /api/v1/owners/register"
              payload: { email: "oocc@example.com", full_name: "O OCC", phone: "+12025559110" }
