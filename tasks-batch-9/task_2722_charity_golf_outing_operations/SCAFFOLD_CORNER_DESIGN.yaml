      - name: parallel_play_and_finance_dimensions_move_independently
        claim_type: Valid Transition
        grounds:
          - state_machines[Outing.play_status]
          - state_machines[Outing.finance_status]
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: outing_field_reopen_cycle_with_independent_finance_dimension
          rationale: "That §1.8 instance already drives both Outing dimensions in one fixture - two FIELD_LOCKED -> OPEN reopens against RECONCILE/REOPEN on the finance side - and asserts that neither dimension's counter or variant is disturbed by the other. A separate breadth test would replay the same edges with weaker assertions."

      - name: registration_cancel_cascades_into_players_teams_and_inventory
        claim_type: Side Effect Execution
        grounds:
          - state_machines[Registration][CONFIRMED -> CANCELLED].side_effects
          - calculations.waitlist_promotion
        excluded_because:
          difficulty_instance: registration_cancel_cascades_allocation_asset_outing_inventory_and_waitlist
          rationale: "The four-level cancel cascade - allocation RELEASED, asset capacity restored, outing counters re-derived, waitlist promotion - is asserted hop by hop by that §1.8 instance, including the ordering requirement that the promotion reads the counters only after step 6."

      - name: releasing_an_allocation_reverses_its_reservation
        claim_type: Side Effect Execution
        grounds:
          - state_machines[SponsorAllocation][RESERVED -> RELEASED]
          - calculations.asset_occupancy_availability
        excluded_because:
          difficulty_instance: allocation_release_restores_the_asset_capacity_conservation_identity
          rationale: "Compensation is the whole point of that §1.8 instance: it asserts the capacity == remaining + reserved + committed + fulfilled identity before the reservation, after it, and after the release, which strictly subsumes a breadth check that RELEASE simply frees the slot."

  - section: calculations
