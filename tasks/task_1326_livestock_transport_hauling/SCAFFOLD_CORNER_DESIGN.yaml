  - section: complexity_layers
    instances:
      - name: occ_allocation_stale_load_version
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[occ-load-plan-allocation]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "After allocation A1 bumps Load.version 1->2, a second allocate carrying the stale expected_load_version 1 is rejected 412 ERR_STALE_VERSION; retrying with the fresh version succeeds."
        test_recipe:
          setup: ["trailer c1 (40/45000); DRAFT load; allocation A1 created with version 1"]
          setup_api_calls:
            - { call: "POST /haul/shippers", payload: { name: "Ranchco", contact_email: "r@x.com" }, as: CarrierAdmin, captures: { sh: $.data.id } }
            - { call: "POST /haul/trailers", payload: { trailer_no: "T-L1", max_gross_weight_lb: 50000, compartments: [ { compartment_index: 1, max_head_count: 40, max_weight_lb: 45000 } ] }, as: CarrierAdmin, captures: { tr: $.data.id } }
            - { call: "GET /haul/trailers/${tr}/compartments", as: Any, captures: { c1: "$.data[0].id" } }
            - { call: "POST /haul/loads", payload: { shipper_id: "${sh}", species: "CATTLE", declared_head_count: 40, declared_weight_lb: 40000, origin: "A", destination: "B", planned_departure_at: "2026-08-02T08:00:00Z", planned_duration_hours: 10, rate_per_loaded_mile_cents: 300, loaded_miles: 500 }, as: Dispatcher, captures: { ld: $.data.id, ld_v: $.data.version } }
