            - "after ${bad_survey} Tank.${tank_id}.open_nonconformance_count == 1 and quality_posture == RESTRICTED, while construction_phase stays SHELL_COMPLETE"
            - "the first approval returns 409 ERR_TANK_POSTURE_RESTRICTED (priority 24), NOT ERR_PLAN_STATE_INVALID - the plan is validly DRAFT"
            - "after the failed approval HydrotestPlan.${plan_id}.status is still DRAFT, approved_by_user_id is null and Tank.${tank_id}.active_hydrotest_plan_id is null"
            - "SettlementSurvey.${good_survey}: uniform_settlement_in == 2.000, max_out_of_plane_in == 0.000, max_adjacent_differential_in == 0.000, verdict == WITHIN_TOLERANCE"
            - "recording ${good_survey} sets SettlementSurvey.${bad_survey}.nonconformance_state == CLOSED_BY_SUPERSEDING_SURVEY with superseded_by_survey_id == ${good_survey}, and Tank.${tank_id}.open_nonconformance_count == 0 with quality_posture == OPEN in that same response"
            - "the second approval (byte-identical payload, same actor, same plan) returns 200 with HydrotestPlan.${plan_id}.status == APPROVED, approved_by_user_id == pe-1 and Tank.${tank_id}.active_hydrotest_plan_id == ${plan_id}"
            - "the plan was never SUSPENDED: state_before_suspension stays null throughout, because posture suspension only reaches plans in APPROVED, FILLING or FILL_HOLD"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rt_window_buffered_closed_interval_exclusion_per_tank
        grounds:
          - calculations.rt_examination_window_conflict
          - validations.priority_47_ERR_EXAM_WINDOW_CONFLICT
          - state_machines.NdeReport.SCHEDULED_to_VOIDED
          - endpoints.POST_nde_reports
        distinguishing_aspect: |
          Interval semantics: CLOSED comparison after a symmetric 60-minute buffer is added
          to both ends, so windows that merely touch after buffering DO conflict and the
          decisive granularity is one second. The contended resource is the TANK (a
          radiography shot area excludes other trades tank-wide, across all shell courses),
          the exclusion is pairwise rather than additive, and it is filtered by method: UT
          in the same minutes is always legal, and voiding a report frees its window again.
        test_recipe:
          setup:
            - "Two tanks TK-101 and TK-102, each with one FITTED course; TK-101 carries three welded seams V1..V3 and TK-102 one welded seam V1. One RT report is already SCHEDULED on TK-101's V1 for 2026-08-11 10:00-11:00Z."
