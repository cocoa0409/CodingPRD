  - rule_id: priority_pair_validation_conflict
    instances:

      - name: enrollment_referential_rung_beats_consent_safety_rung_on_visit_create
        grounds:
          - validations[priority=15]
          - validations[priority=18]
          - errors[ERR_ENROLLMENT_NOT_ACTIVE]
          - errors[ERR_CONSENT_REQUIRED]
        distinguishing_aspect: |
          Error-category pair business_referential (rung 15,
          ERR_ENROLLMENT_NOT_ACTIVE) versus business_safety (rung 18,
          ERR_CONSENT_REQUIRED). One POST /sbhc/visits violates both at once and
          must return ERR_ENROLLMENT_NOT_ACTIVE; activating the enrollment and
          repeating the identical request then surfaces ERR_CONSENT_REQUIRED,
          proving the ordering rather than a single-rule coincidence.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-04T09:00:00Z."
            - "One ACTIVE school and one MEDICAL clinician."
            - "One student whose only Enrollment is still in status PENDING, and who has no Consent rows at all."
          setup_api_calls:
            - call: "POST /sbhc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: SbhcAdmin
            - call: "POST /sbhc/schools"
              payload: { name: "Lincoln High", site_code: "LHS", sponsor_hospital_name: "Mercy Sponsor Hospital", telehealth_concurrent_capacity: 1 }
              as: SbhcAdmin
              captures: { school_id: "$.data.id" }
            - call: "POST /sbhc/clinicians"
              payload: { full_name: "Dana Reyes NP", discipline: "MEDICAL", license_number: "NP-1001" }
              as: SbhcAdmin
              captures: { clin_med_id: "$.data.id" }
            - call: "POST /sbhc/students"
              payload: { first_name: "Ava", last_name: "Nguyen", date_of_birth: "2010-04-15" }
              as: Registrar
              captures: { stu_id: "$.data.id", stu_v1: "$.data.version" }
            - call: "POST /sbhc/students/${stu_id}/enrollments"
              payload: { school_id: "${school_id}", school_year: "2025-2026", expected_student_version: "${stu_v1}" }
              as: Registrar
              captures: { enr_id: "$.data.id" }
          trigger:
            - call: "POST /sbhc/visits"
              payload: { student_id: "${stu_id}", school_id: "${school_id}", clinician_id: "${clin_med_id}", visit_type: "ACUTE", scheduled_start_at: "2026-05-04T10:00:00Z" }
              as: Clinician
              as_user_id: "${clin_med_id}"
              captures: { err_both: "$.data.error_id" }
            - call: "POST /sbhc/enrollments/${enr_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /sbhc/visits"
              payload: { student_id: "${stu_id}", school_id: "${school_id}", clinician_id: "${clin_med_id}", visit_type: "ACUTE", scheduled_start_at: "2026-05-04T10:00:00Z" }
              as: Clinician
              as_user_id: "${clin_med_id}"
              captures: { err_consent_only: "$.data.error_id" }
          assert:
            - "the first POST /sbhc/visits returns HTTP 409 with data.error_id == ERR_ENROLLMENT_NOT_ACTIVE"
            - "the second POST /sbhc/visits returns HTTP 409 with data.error_id == ERR_CONSENT_REQUIRED"
            - "Enrollment.${enr_id}.status == ACTIVE"
            - "zero Visit rows exist with student_id == ${stu_id}"

      - name: clinician_temporal_rung_beats_school_capacity_constraint_rung_on_session_create
        grounds:
          - validations[priority=26]
          - validations[priority=27]
          - calculations.telehealth_resource_conflict
          - errors[ERR_CLINICIAN_SLOT_CONFLICT]
          - errors[ERR_SCHOOL_CAPACITY_EXCEEDED]
