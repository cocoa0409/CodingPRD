  - rule_id: boundary_precision_check
    instances:

      - name: coverage_rate_exactly_at_floor_certifies_one_impression_less_quarantines
        grounds:
          - calculations.viewability_and_coverage
          - state_machines.MeasurementBatch.SCORED_to_CERTIFIED
          - state_machines.MeasurementBatch.SCORED_to_QUARANTINED
          - entities.MethodologyVersion.fields.coverage_rate_floor
        distinguishing_aspect: |
          Metric: coverage_rate, at the inclusive floor, on endpoint
          POST /measurement-batches/{id}/certify. measurable 7000 of measured
          10000 is exactly 0.7000 == coverage_rate_floor and must CERTIFY
          (the comparison is >=, not >), while 6999 of 10000 rounds to 0.6999
          - a single impression less - and must QUARANTINE. An implementation
          using > , or rounding coverage to 2 decimals (both cases would read
          0.70), collapses the two outcomes.
