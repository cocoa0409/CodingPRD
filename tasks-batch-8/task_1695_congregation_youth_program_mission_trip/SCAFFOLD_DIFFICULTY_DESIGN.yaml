            - { call: "POST /youth-ministry/_clock/set-current-utc", payload: {to_iso8601: "2027-01-15T00:00:01Z"}, as: ProgramDirector }
            - { call: "GET /youth-ministry/registrations/${reg1}", as: ProgramDirector, captures: {reg1_status: $.data.payment_status, reg1_fees: $.data.late_fees_total_cents} }
            - { call: "GET /youth-ministry/registrations/${reg2}", as: ProgramDirector, captures: {reg2_status: $.data.payment_status, reg2_fees: $.data.late_fees_total_cents, reg2_due: $.data.amount_due_cents} }
          assert:
            - "pay1_posted == 2027-01-15T00:00:00Z — posted exactly AT the deadline counts as on time (inclusive)"
            - "reg2_status_at_due == PENDING_DEPOSIT and reg2_fees_at_due == 0 — at clock == due_at the strict-> sweep does NOT fire"
            - "reg1_status == PARTIALLY_PAID and reg1_fees == 0 after the +1s sweep (deposit covered in time)"
            - "reg2_status == DELINQUENT and reg2_fees == 4000 (max(2500, round_half_up(0.05*80000)) = 4000) and reg2_due == 84000"

