                channel_id: "${ch1_id}"
                broadcast_day: "2026-08-03"
                schedule_start_utc: "2026-08-03T12:00:00Z"
                window_duration_seconds: 1800
                items:
                  - { sequence_number: 1, element_kind: PROGRAM, asset_id: "${aprog_id}", scheduled_start_utc: "2026-08-03T12:00:00Z", scheduled_duration_seconds: 1800 }
                  - { sequence_number: 2, element_kind: COMMERCIAL, asset_id: "${aspot_id}", scheduled_start_utc: "2026-08-03T12:30:00Z", scheduled_duration_seconds: 31 }
              as: TrafficCoordinator
              captures: { pl_v31_id: "$.data.id" }
            - call: "POST /playlists/${pl_v30_id}/state"
              payload: { target_status: VALIDATED }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
