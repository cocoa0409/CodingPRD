          - calculations.inspection_delta_and_verdict
          - entities.QualityInspection.fields.sphere_delta
        distinguishing_aspect: >-
          A raw gap of 0.125 diopters is rounded half-up to 0.13 BEFORE the comparison, so it ties the
          0.13 tolerance and passes; truncation or round-half-even would give 0.12 (still a pass but a
          different stored delta) and comparing the unrounded 0.125 against 0.13 would also pass while
          storing 0.125, so the stored value is what pins the rule down.
