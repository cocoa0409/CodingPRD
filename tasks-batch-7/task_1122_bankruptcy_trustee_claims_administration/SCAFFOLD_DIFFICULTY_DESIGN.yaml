              payload: { case_number: "26-10017", debtor_name: "Debtor Seventeen", filed_on: "2026-01-15T00:00:00Z", district: "D.Del.", trustee_user_id: "trust-0001" }
              as: Clerk
              captures: { case_id: $.data.id }
