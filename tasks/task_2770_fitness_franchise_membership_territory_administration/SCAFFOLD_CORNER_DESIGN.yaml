        grounds:
          - errors.ERR_INVALID_ALLOCATION_STATE
          - endpoints[POST /franchise/corporate-accounts/{id}/recall-allocation]
        distinguishing_aspect: "Recall is the compensating half of allocate and has nothing to undo while allocated_cents is 0, so the call is refused with ERR_INVALID_ALLOCATION_STATE and the funded pool balance is not double-credited back into itself."
        test_recipe:
          setup:
            - "One ACTIVE corporate account funded with 100000 cents that has never been allocated."
          setup_api_calls:
            - call: "POST /franchise/corporate-accounts"
