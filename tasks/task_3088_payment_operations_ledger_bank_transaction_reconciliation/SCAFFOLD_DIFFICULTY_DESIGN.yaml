    distinguishing_aspect: 'A two-hop cascade originating from the statement revision rather than from any payment
      transition: revising the statement (hop one) resolves the STATEMENT_VARIANCE exception and, as a by-product
      of that same hop, re-runs deposit_attribution over the predecessor''s still-unmatched lines; that sub-pass
      (hop two) raises a brand-new UNMATCHED_DEPOSIT exception, so the second hop is caused by the first hop''s
      side effect.'
