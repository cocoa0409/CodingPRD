  # =========================================================================
  # Rule 8 — resource_temporal_overlap (2 instances, different interval semantics)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: availability_window_half_open_adjacent_ok_overlap_rejects
        grounds:
          - validations[priority=26]
          - errors[ERR_WINDOW_OVERLAP]
          - entities.AvailabilityWindow.fields.start_ts
          - entities.AvailabilityWindow.fields.end_ts
        distinguishing_aspect: |
          Half-open interval semantics [start_ts, end_ts): two windows sharing an endpoint
          (a.end_ts == b.start_ts) are ADJACENT and MUST succeed; overlapping windows
          (a.start_ts < b.end_ts AND b.start_ts < a.end_ts) fire ERR_WINDOW_OVERLAP.
          Resource entity: Program (via AvailabilityWindow).
        test_recipe:
          setup:
            - "clock 2026-06-01T00:00:00Z"
            - "Program PROG15 with capacity_slots_total=10 (headroom for two 3-slot windows)"
            - "Existing AvailabilityWindow AW15a on PROG15 covering [2026-08-01T10:00:00Z, 2026-08-01T12:00:00Z) with max_slots=3"
            - "Existing AvailabilityWindow AW15b on PROG15 covering [2026-08-01T12:00:00Z, 2026-08-01T14:00:00Z) with max_slots=3 — ADJACENT to AW15a, no overlap under half-open, so this creation SUCCEEDED during setup"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funders"
              payload: { name: "F15", fiscal_year_start_month: 7, grant_cents_total: 100000000, reporting_currency: "USD" }
              as: PlatformAdmin
              captures: { f15_id: $.data.id }
            - call: "POST /providers"
              payload: { legal_name: "P15", location_lat: 40.00, location_lng: -74.00, accessibility_features: ["WHEELCHAIR"], languages_supported: ["EN"] }
              as: PlatformAdmin
              captures: { p15_id: $.data.id }
            - call: "POST /programs"
              payload: { provider_id: "${p15_id}", funder_id: "${f15_id}", category: "FOOD", eligibility_income_max_cents: 500000, eligibility_age_min: 18, eligibility_age_max: 65, unit_cost_cents: 10000, capacity_slots_total: 10 }
              as: PlatformAdmin
              captures: { prog15_id: $.data.id }
            - call: "POST /programs/${prog15_id}/availability-windows"
              payload: { start_ts: "2026-08-01T10:00:00Z", end_ts: "2026-08-01T12:00:00Z", max_slots: 3 }
              as: ProviderStaff
              as_user_id: "${p15_id}"
              captures: { aw15a_id: $.data.id }
            - call: "POST /programs/${prog15_id}/availability-windows"
              payload: { start_ts: "2026-08-01T12:00:00Z", end_ts: "2026-08-01T14:00:00Z", max_slots: 3 }
              as: ProviderStaff
              as_user_id: "${p15_id}"
              captures: { aw15b_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog15_id}/availability-windows"
              payload: { start_ts: "2026-08-01T11:00:00Z", end_ts: "2026-08-01T13:00:00Z", max_slots: 3 }
              as: ProviderStaff
              as_user_id: "${p15_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "Setup: AvailabilityWindow.${aw15a_id} and AvailabilityWindow.${aw15b_id} coexist (adjacent windows sharing 12:00Z do NOT overlap under half-open [start, end) semantics)"
            - "Trigger: overlapping window [11:00, 13:00) collides with both existing windows → error_id == ERR_WINDOW_OVERLAP"
            - "HTTP status == 409"

      - name: transport_plan_closed_closed_with_30_minute_buffer_rejects_29min_gap
        grounds:
          - validations[priority=27]
          - errors[ERR_TRANSPORT_OVERLAP]
          - entities.TransportPlan.fields.pickup_start_ts
          - entities.TransportPlan.fields.pickup_end_ts
