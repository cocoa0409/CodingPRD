# ===========================================================================
  # Rule 4 — transitive_cascade (≥ 2 instances, depth ≥ 3 and depth ≥ 2 from different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: quality_breach_cascade_three_hop_clinic_to_contract_to_plan_to_auth
        grounds:
          - state_machines.Clinic.CONTRACTED_to_PROBATION
          - state_machines.ClinicContract.ACTIVE_to_FROZEN
          - state_machines.TreatmentPlan.AUTHORIZATION_PENDING_to_PLANNING_REVISION
          - state_machines.ClinicContract.ACTIVE_to_FROZEN
          - calculations.network_quality_score
        distinguishing_aspect: "A single report-outcome call cascades THREE causally chained hops — the clinic's recomputed quality recompute moves Clinic CONTRACTED to PROBATION, that clinic mutation is the sole cause of the ClinicContract ACTIVE to FROZEN flip, and the frozen contract is in turn the sole cause of the plan's IN_PROGRESS to PLANNING_REVISION move — so hop three does not fire unless hop two fired, unlike a fan-out that mutates clinic, contract and plan directly off the original call."
