            - "June 2026 revenue of 3000000 cents booked and released, producing six ACCRUED disbursements totalling 2280656 cents"
            - "The well is then moved PRODUCING -> SHUT_IN effective 2026-07-01 and L-001 never receives a shut-in payment, so nothing holds it past its 2026-09-30 primary term"
