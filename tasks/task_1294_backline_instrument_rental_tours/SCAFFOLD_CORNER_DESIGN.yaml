              as: OpsManager
              captures: { am: $.data.id }
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${am}", serial_number: "AV-U1", home_city_code: "LAX" }
              as: OpsManager
              captures: { au: $.data.id }
            - call: "POST /backline/tours"
              payload: { artist_id: "${aa}", name: "Avail Tour", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z" }
              as: TourManager
              captures: { at: $.data.id }
            - call: "POST /backline/tours/${at}/stops"
              payload: { city_code: "LAX", venue_date: "2026-08-12T00:00:00Z", load_in_ts: "2026-08-12T10:00:00Z" }
              as: TourManager
              captures: { as1: $.data.id }
            - call: "POST /backline/tour-stops/${as1}/rider-lines"
              payload: { gear_model_id: "${am}", quantity: 1 }
              as: TourManager
              captures: { arl: $.data.id }
            - call: "POST /backline/rider-lines/${arl}/source"
              payload: { origin_city_code: "LAX", dest_city_code: "LAX", start_date: "2026-08-10T00:00:00Z", end_date: "2026-08-15T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { ar: $.data.id }
          trigger:
            - call: "GET /backline/gear-units/${au}/availability"
              payload: { start_date: "2026-08-14T00:00:00Z", end_date: "2026-08-20T00:00:00Z" }
              as: LogisticsCoordinator
            - call: "GET /backline/gear-units/${au}/availability"
              payload: { start_date: "2026-08-15T00:00:00Z", end_date: "2026-08-20T00:00:00Z" }
              as: LogisticsCoordinator
          assert:
