            - { call: "GET /api/allocations/${alloc}", payload: {}, as: PlatformOps }
          assert:
            - "Inspection.${i_bad}.status == VERIFIED and mite_load_per_100 == 9.50 (>= 9.00 quarantine threshold)"
            - "link 1: Hive.${hv}.posture == QUARANTINED and lifecycle_status == QUARANTINED (caused by the verify)"
            - "link 2: Harvest.${h2}.status == VOIDED (caused by the hive quarantine, not by the verify directly)"
            - "link 3: HoneyAllocation.${alloc}.projected_pool_net_kg == 5.000 and projected_host_kg == 1.475 (recompute caused by the harvest void)"
            - "captured ${pool_before} == 10.000 (allocation reflected both harvests before the cascade)"
            - "Harvest.${h1}.status == APPROVED (approved harvest is not voided by the cascade — only RECORDED)"

      - name: rollover_invoice_subscription_host_cascade
        grounds:
          - state_machines.Invoice.OPEN_to_OVERDUE
          - state_machines.Subscription.ACTIVE_to_PAST_DUE
          - state_machines.Host.ACTIVE_to_LIMITED
          - calculations.invoice_total
        distinguishing_aspect: |
          Depth-3 chain from the rollover trigger (different trigger than verify): rollover ages
          invoice1 to OVERDUE; the overdue invoice moves the subscription ACTIVE -> PAST_DUE;
          the subscription standing moves the host ACTIVE -> LIMITED. Invoice2 issued with
          carried 2999 + late 270 (3 full weeks x 90) + fee 2999 = 6268.
        test_recipe:
          setup:
            - "Season S1 OPEN; host ACTIVE; BASIC subscription ACTIVE; invoice1 (2999, issued 2026-05-01, due 2026-05-08) UNPAID"
            - "Logical clock 2026-06-01 at rollover (24 days past due = 3 full weeks)"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S2026", frost_date: "2026-10-15T00:00:00Z" }, as: PlatformOps, captures: { s1: $.data.id } }
            - { call: "POST /api/hosts", payload: { full_name: "Host Eleven", email: "h11@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/subscriptions", payload: { host_id: "${h}", plan: "BASIC" }, as: PlatformOps, captures: { sub: $.data.id } }
            - { call: "GET /api/invoices", payload: { subscription_id: "${sub}" }, as: PlatformOps, captures: { inv1: "$.data[0].id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformOps }
          trigger:
            - { call: "POST /api/seasons/${s1}/rollover", payload: { name: "S2026-mid", frost_date: "2027-10-15T00:00:00Z" }, as: PlatformOps }
            - { call: "GET /api/invoices/${inv1}", payload: {}, as: PlatformOps }
            - { call: "GET /api/invoices", payload: { subscription_id: "${sub}" }, as: PlatformOps, captures: { inv2: "$.data[1].id" } }
            - { call: "GET /api/subscriptions/${sub}", payload: {}, as: PlatformOps }
            - { call: "GET /api/hosts/${h}", payload: {}, as: PlatformOps }
          assert:
            - "link 1: Invoice.${inv1}.status == OVERDUE (aging caused by the rollover)"
            - "link 2: Subscription.${sub}.status == PAST_DUE (caused by invoice1 becoming OVERDUE)"
            - "link 3: Host.${h}.status == LIMITED (caused by the subscription entering PAST_DUE)"
            - "Invoice.${inv2}.carried_balance_cents == 2999 and late_fee_cents == 270 (3 weeks x round(2999*0.03)=90)"
            - "Invoice.${inv2}.total_cents == 6268 (2999 fee + 2999 carried + 270 late, per-line rounded then summed)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict: three instances on DIFFERENT
  # error-category pairs: (state, business_safety), (business_safety,
  # business_fiscal), (business_constraint, business_temporal)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: harvest_state_error_beats_withdrawal_safety
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_HIVE_NOT_OPERABLE]
          - errors[ERR_WITHDRAWAL_WINDOW_ACTIVE]
        distinguishing_aspect: |
          Pair state(p6) vs business_safety(p7): the hive is DEAD (state violation) AND
          collected_on 2026-05-20 lies inside the withdrawal window [2026-05-02, 2026-05-24)
          (safety violation); the p6 error ERR_HIVE_NOT_OPERABLE must win.
        test_recipe:
          setup:
            - "Season S1 OPEN; host ACTIVE; site CLEAR; agreement ACTIVE; hive installed"
            - "Treatment on the hive COMPLETED: window [2026-05-02, 2026-05-10), withdrawal_end 2026-05-24"
            - "Hive marked DEAD on 2026-05-15; clock left at 2026-05-15 for the trigger"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S2026", frost_date: "2026-10-15T00:00:00Z" }, as: PlatformOps, captures: { s1: $.data.id } }
            - { call: "POST /api/hosts", payload: { full_name: "Host Twelve", email: "h12@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "12 Hickory Hl", base_capacity_hives: 2, water_source: true, setback_feet: 10 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv: $.data.id } }
            - { call: "POST /api/treatments", payload: { hive_id: "${hv}", product: "APIVAR", start_date: "2026-05-02T00:00:00Z", end_date: "2026-05-10T00:00:00Z" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { tr: $.data.id } }
            - { call: "POST /api/treatments/${tr}/start", payload: {}, as: Beekeeper, as_user_id: "bk-1" }
            - { call: "POST /api/treatments/${tr}/complete", payload: {}, as: Beekeeper, as_user_id: "bk-1" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: PlatformOps }
            - { call: "POST /api/hives/${hv}/mark-dead", payload: {}, as: ApiaryManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "POST /api/harvests", payload: { hive_id: "${hv}", collected_on: "2026-05-20T00:00:00Z", gross_kg: 2.000, moisture_pct: 18.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_HIVE_NOT_OPERABLE (p6 state outranks p7 business_safety)"
            - "the failing collected_on 2026-05-20 IS inside withdrawal [2026-05-02, 2026-05-24): the safety rule also failed, so the observed error proves the priority order"

      - name: removal_waiver_safety_beats_balance_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_WAIVER_CURRENT_REQUIRED]
          - errors[ERR_OUTSTANDING_BALANCE]
        distinguishing_aspect: |
          Pair business_safety(p7) vs business_fiscal(p11): the host's waiver is 366 days old
          (expired) AND the host carries an unpaid invoice (balance_due_cents 2999 > 0);
          the safety error ERR_WAIVER_CURRENT_REQUIRED must win on removal-job creation.
        test_recipe:
          setup:
            - "Season S1 OPEN; host signed waiver at 2026-05-01 (default clock); site/agreement/hive in place"
            - "BASIC subscription created; invoice1 (2999) left UNPAID -> balance_due_cents == 2999"
            - "Logical clock advanced to 2027-05-02 (waiver age 366 days > 365 -> expired)"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S2026", frost_date: "2026-10-15T00:00:00Z" }, as: PlatformOps, captures: { s1: $.data.id } }
            - { call: "POST /api/hosts", payload: { full_name: "Host Thirteen", email: "h13@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "13 Alder Pl", base_capacity_hives: 2, water_source: true, setback_feet: 8 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv: $.data.id } }
            - { call: "POST /api/subscriptions", payload: { host_id: "${h}", plan: "BASIC" }, as: PlatformOps, captures: { sub: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-05-02T00:00:00Z" }, as: PlatformOps }
          trigger:
            - { call: "POST /api/removal-jobs", payload: { hive_id: "${hv}", reason: "NUISANCE" }, as: Host, as_user_id: "${h}", captures: { err: $.data.error_id } }
          assert:
            - "captured ${err} == ERR_WAIVER_CURRENT_REQUIRED (p7 business_safety outranks p11 business_fiscal)"
            - "host balance_due_cents == 2999 at trigger time, so the fiscal rule also failed — observed error proves the ordering"

      - name: schedule_crew_conflict_beats_notice_temporal
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_CREW_SCHEDULE_CONFLICT]
          - errors[ERR_REMOVAL_NOTICE_TOO_SHORT]
        distinguishing_aspect: |
          Pair business_constraint(p8) vs business_temporal(p10): the requested start collides
          with job1's crew window (constraint violation) AND is only ~22.5h ahead of the
          2026-06-09T12:00 clock (temporal violation); ERR_CREW_SCHEDULE_CONFLICT must win.
        test_recipe:
          setup:
            - "Season S1 OPEN; host ACTIVE; site with 2 hives; agreement ACTIVE"
            - "removal1 (hive1) APPROVED and SCHEDULED at 2026-06-10T09:00:00Z with crew crew-1 (window [09:00, 11:00))"
            - "removal2 (hive2) APPROVED; logical clock advanced to 2026-06-09T12:00:00Z"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S2026", frost_date: "2026-10-15T00:00:00Z" }, as: PlatformOps, captures: { s1: $.data.id } }
            - { call: "POST /api/hosts", payload: { full_name: "Host Fourteen", email: "h14@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "14 Beech St", base_capacity_hives: 2, water_source: true, setback_feet: 10 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv1: $.data.id } }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv2: $.data.id } }
            - { call: "POST /api/removal-jobs", payload: { hive_id: "${hv1}", reason: "RELOCATION" }, as: Host, as_user_id: "${h}", captures: { rj1: $.data.id } }
            - { call: "POST /api/removal-jobs/${rj1}/approve", payload: { decision: "APPROVE" }, as: ApiaryManager, as_user_id: "mgr-1" }
            - { call: "POST /api/removal-jobs/${rj1}/schedule", payload: { scheduled_start: "2026-06-10T09:00:00Z", crew_id: "crew-1" }, as: ApiaryManager, as_user_id: "mgr-1" }
