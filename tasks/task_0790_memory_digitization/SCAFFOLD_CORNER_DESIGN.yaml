scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_customer_success
        claim_type: Creation
        grounds: [entities.Customer, endpoints]
        distinguishing_aspect: "POST /customers with email/full_name/state_code returns 201 with a server-minted id, wallet_credit_cents 0 and risk_score 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { email: "c_new@x.com", full_name: "New Cust", state_code: "NY" }
              as: Admin
              captures: { cust_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Customer.${cust_id}.wallet_credit_cents == 0"
            - "Customer.${cust_id}.risk_score == 0"

      - name: order_optional_defaults_applied
        claim_type: Defaults
        grounds: [entities.Order.fields.lost_damage_protection, entities.Order.fields.is_gift]
        distinguishing_aspect: "Omitting lost_damage_protection and is_gift on POST /orders applies the declared defaults false/false."
        test_recipe:
          setup: ["One customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "def@x.com", full_name: "Def", state_code: "CA" }
              as: Admin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", plan_tier: "STANDARD_KIT", turnaround: "STANDARD", output_option: "CLOUD", declared_tape_count: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
          assert:
            - "Order.${ord_id}.lost_damage_protection == false"
            - "Order.${ord_id}.is_gift == false"

      - name: create_order_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds: [entities.Order, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /orders without the required turnaround field returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["One customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "mr@x.com", full_name: "MR", state_code: "CA" }
              as: Admin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", plan_tier: "STANDARD_KIT", output_option: "CLOUD" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: create_order_invalid_enum_turnaround_returns_validation
        claim_type: Type Constraints
        grounds: [entities.Order.fields.turnaround, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /orders with turnaround outside {STANDARD, RUSH} returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["One customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ie@x.com", full_name: "IE", state_code: "CA" }
              as: Admin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", plan_tier: "STANDARD_KIT", turnaround: "OVERNIGHT", output_option: "CLOUD" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: get_order_unknown_id_not_found
        claim_type: Not Found
        grounds: [entities.Order, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /orders/{unknown uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["One customer (as an authenticated caller)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "nf@x.com", full_name: "NF", state_code: "CA" }
              as: Admin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "GET /orders/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_order_unknown_customer_not_found
        claim_type: Parent Relationships
        grounds: [entities.Order.fields.customer_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /orders whose customer_id references no Customer returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB (no customers)."]
          setup_api_calls: []
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "00000000-0000-0000-0000-0000000000aa", plan_tier: "STANDARD_KIT", turnaround: "STANDARD", output_option: "CLOUD" }
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

  # =========================================================================
  - section: state_machines
    instances:
      - name: capture_before_authorize_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Order, "errors[ERR_INVALID_STATE]", entities.Order.fields.payment_status]
        distinguishing_aspect: "capture-payment on a QUOTED/UNPAID order (payment never AUTHORIZED) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A freshly created order (payment UNPAID)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cb@x.com", full_name: "CB", state_code: "CA" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", plan_tier: "STANDARD_KIT", turnaround: "STANDARD", output_option: "CLOUD", declared_tape_count: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /orders/${ord_id}/capture-payment"
              payload: {}
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: run_batch_twice_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.Batch.LOADED_to_RUNNING, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second POST /batches/{id}/run on an already-RUNNING batch (no longer LOADED) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Order RECEIVED with one loaded item; batch already run once (RUNNING)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "rb@x.com", full_name: "RB", state_code: "CA" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", plan_tier: "STANDARD_KIT", turnaround: "STANDARD", output_option: "CLOUD", declared_tape_count: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/authorize-payment"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${ord_id}/receive"
              payload: {}
              as: IntakeTech
            - call: "POST /storage-bins"
              payload: { label: "RBB", capacity: 10 }
              as: Admin
              captures: { bin_id: $.data.id }
            - call: "POST /orders/${ord_id}/media-items"
              payload: { media_type: "TAPE", bin_id: "${bin_id}" }
              as: IntakeTech
              captures: { mi_id: $.data.id }
            - call: "POST /machines"
              payload: { name: "RBM", kind: "TAPE_DECK" }
              as: Admin
              captures: { machine_id: $.data.id }
            - call: "POST /batches"
              payload: { machine_id: "${machine_id}", scheduled_start: "2026-03-01T09:00:00Z", scheduled_end: "2026-03-01T10:00:00Z" }
              as: LabTech
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/load"
              payload: { media_item_id: "${mi_id}" }
              as: LabTech
            - call: "POST /batches/${batch_id}/run"
              payload: {}
              as: LabTech
          trigger:
            - call: "POST /batches/${batch_id}/run"
              payload: {}
              as: LabTech
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: rescan_at_max_attempts_returns_qc_attempts_exceeded
        claim_type: invalid_transition
        grounds: [state_machines.MediaItem.QC_FAIL_to_SCANNING, "validations[priority=27]", "errors[ERR_QC_ATTEMPTS_EXCEEDED]"]
        distinguishing_aspect: "After three failing QC reviews (qc_attempts == MAX_QC_ATTEMPTS=3), POST rescan is rejected with ERR_QC_ATTEMPTS_EXCEEDED (409)."
        test_recipe:
          setup: ["One tape item cycled through three failing QC reviews (qc_attempts == 3, status QC_FAIL)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "qx@x.com", full_name: "QX", state_code: "CA" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", plan_tier: "STANDARD_KIT", turnaround: "STANDARD", output_option: "CLOUD", declared_tape_count: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/authorize-payment"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${ord_id}/receive"
              payload: {}
              as: IntakeTech
            - call: "POST /storage-bins"
              payload: { label: "QXB", capacity: 10 }
              as: Admin
              captures: { bin_id: $.data.id }
            - call: "POST /orders/${ord_id}/media-items"
              payload: { media_type: "TAPE", bin_id: "${bin_id}" }
              as: IntakeTech
              captures: { mi_id: $.data.id }
            - call: "POST /machines"
              payload: { name: "QXM", kind: "TAPE_DECK" }
              as: Admin
              captures: { machine_id: $.data.id }
            - call: "POST /batches"
              payload: { machine_id: "${machine_id}", scheduled_start: "2026-03-01T09:00:00Z", scheduled_end: "2026-03-01T10:00:00Z" }
              as: LabTech
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/load"
              payload: { media_item_id: "${mi_id}" }
              as: LabTech
            - call: "POST /batches/${batch_id}/run"
              payload: {}
              as: LabTech
            - call: "POST /media-items/${mi_id}/complete-scan"
              payload: { digitized_minutes: 30 }
              as: LabTech
            - call: "POST /media-items/${mi_id}/qc-review"
              payload: { decision: "FAIL" }
              as: LabTech
            - call: "POST /media-items/${mi_id}/rescan"
              payload: {}
              as: LabTech
            - call: "POST /media-items/${mi_id}/complete-scan"
              payload: { digitized_minutes: 30 }
              as: LabTech
            - call: "POST /media-items/${mi_id}/qc-review"
              payload: { decision: "FAIL" }
              as: LabTech
            - call: "POST /media-items/${mi_id}/rescan"
              payload: {}
              as: LabTech
            - call: "POST /media-items/${mi_id}/complete-scan"
              payload: { digitized_minutes: 30 }
              as: LabTech
            - call: "POST /media-items/${mi_id}/qc-review"
              payload: { decision: "FAIL" }
              as: LabTech
          trigger:
            - call: "POST /media-items/${mi_id}/rescan"
              payload: {}
              as: LabTech
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_QC_ATTEMPTS_EXCEEDED"
            - "MediaItem.${mi_id}.qc_attempts == 3"

      - name: machine_double_book_corner
        claim_type: guarded_transition
        grounds: ["validations[priority=25]", "errors[ERR_MACHINE_DOUBLE_BOOKED]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / machine_pairwise_halfopen_double_book
          rationale: "Machine half-open overlap rejection is asserted by the named §1.8 instance."

      - name: mediaitem_qc_cycle_corner
        claim_type: cyclic
        grounds: [state_machines.MediaItem.QC_FAIL_to_SCANNING]
        excluded_because:
          difficulty_instance: non_linear_state_machine / mediaitem_qc_revision_cycle
          rationale: "The QC revision cycle is asserted by the named §1.8 instance."

  # =========================================================================
  - section: calculations
    instances:
      - name: rush_fee_thirty_percent_of_subtotal
        claim_type: Correct Result
        grounds: [calculations.order_total, entities.Order.fields.estimate_total_cents]
        distinguishing_aspect: "10 tapes with turnaround RUSH adds a 30% rush fee (3600) to the 12000 subtotal: estimate_total_cents == 15600."
        test_recipe:
          setup: ["One customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "rf@x.com", full_name: "RF", state_code: "CA" }
              as: Admin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", plan_tier: "STANDARD_KIT", turnaround: "RUSH", output_option: "CLOUD", declared_tape_count: 10 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
          assert:
            - "Order.${ord_id}.estimate_total_cents == 15600"

      - name: damage_payout_no_protection_limited_liability
        claim_type: Correct Result
        grounds: [calculations.damage_payout, entities.DamageClaim.fields.payout_cents]
        distinguishing_aspect: "With no protection, a TAPE claim payout is capped at NO_PROTECTION_CAP: payout_cents == 1000 (declared value ignored)."
        test_recipe:
          setup: ["Order WITHOUT protection, captured, one tape item OUTPUT_READY; claim filed with declared_value_cents 5000."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "np@x.com", full_name: "NP", state_code: "CA" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", plan_tier: "STANDARD_KIT", turnaround: "STANDARD", output_option: "CLOUD", lost_damage_protection: false, declared_tape_count: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/authorize-payment"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${ord_id}/capture-payment"
              payload: {}
              as: Admin
            - call: "POST /orders/${ord_id}/receive"
              payload: {}
              as: IntakeTech
            - call: "POST /storage-bins"
              payload: { label: "NPB", capacity: 10 }
              as: Admin
              captures: { bin_id: $.data.id }
            - call: "POST /orders/${ord_id}/media-items"
              payload: { media_type: "TAPE", bin_id: "${bin_id}" }
              as: IntakeTech
              captures: { mi_id: $.data.id }
            - call: "POST /machines"
              payload: { name: "NPM", kind: "TAPE_DECK" }
              as: Admin
              captures: { machine_id: $.data.id }
            - call: "POST /batches"
              payload: { machine_id: "${machine_id}", scheduled_start: "2026-03-01T09:00:00Z", scheduled_end: "2026-03-01T10:00:00Z" }
              as: LabTech
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/load"
              payload: { media_item_id: "${mi_id}" }
              as: LabTech
            - call: "POST /batches/${batch_id}/run"
              payload: {}
              as: LabTech
            - call: "POST /media-items/${mi_id}/complete-scan"
              payload: { digitized_minutes: 30 }
              as: LabTech
            - call: "POST /media-items/${mi_id}/qc-review"
              payload: { decision: "PASS" }
              as: LabTech
            - call: "POST /damage-claims"
              payload: { order_id: "${ord_id}", media_item_id: "${mi_id}", claim_type: "DAMAGED", declared_value_cents: 5000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /damage-claims/${claim_id}/review"
              payload: { decision: "APPROVE" }
              as: ClaimsAdjuster
          assert:
            - "DamageClaim.${claim_id}.payout_cents == 1000"

      - name: damage_payout_protection_honors_declared_to_cap
        claim_type: Correct Result
        grounds: [calculations.damage_payout, entities.DamageClaim.fields.payout_cents]
        distinguishing_aspect: "With protection, a FILM claim declaring 20000 is paid at min(20000, PROTECTION_CAP=10000): payout_cents == 10000."
        test_recipe:
          setup: ["Order WITH protection, captured, one film item OUTPUT_READY; claim filed with declared_value_cents 20000."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "pp@x.com", full_name: "PP", state_code: "CA" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", plan_tier: "FAMILY_KIT", turnaround: "STANDARD", output_option: "CLOUD", lost_damage_protection: true, declared_film_count: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/authorize-payment"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${ord_id}/capture-payment"
              payload: {}
              as: Admin
            - call: "POST /orders/${ord_id}/receive"
              payload: {}
              as: IntakeTech
            - call: "POST /storage-bins"
              payload: { label: "PPB", capacity: 10 }
              as: Admin
              captures: { bin_id: $.data.id }
            - call: "POST /orders/${ord_id}/media-items"
              payload: { media_type: "FILM", bin_id: "${bin_id}" }
              as: IntakeTech
              captures: { mi_id: $.data.id }
            - call: "POST /machines"
              payload: { name: "PPM", kind: "FILM_SCANNER" }
              as: Admin
              captures: { machine_id: $.data.id }
            - call: "POST /batches"
              payload: { machine_id: "${machine_id}", scheduled_start: "2026-03-01T09:00:00Z", scheduled_end: "2026-03-01T10:00:00Z" }
              as: LabTech
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/load"
              payload: { media_item_id: "${mi_id}" }
              as: LabTech
            - call: "POST /batches/${batch_id}/run"
              payload: {}
              as: LabTech
            - call: "POST /media-items/${mi_id}/complete-scan"
              payload: { digitized_minutes: 40 }
              as: LabTech
            - call: "POST /media-items/${mi_id}/qc-review"
              payload: { decision: "PASS" }
              as: LabTech
            - call: "POST /damage-claims"
              payload: { order_id: "${ord_id}", media_item_id: "${mi_id}", claim_type: "LOST", declared_value_cents: 20000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /damage-claims/${claim_id}/review"
              payload: { decision: "APPROVE" }
              as: ClaimsAdjuster
          assert:
            - "DamageClaim.${claim_id}.payout_cents == 10000"

      - name: estimate_vs_final_corner
        claim_type: Variant Divergence
        grounds: [calculations.order_total]
        excluded_because:
          difficulty_instance: dual_variant_calc / order_estimate_vs_final_total_diverge
          rationale: "Estimate-vs-final divergence is asserted by the named §1.8 instance."

  # =========================================================================
  - section: validations
    instances:
      - name: invalid_promo_code_returns_invalid_promo
        claim_type: violation_to_error
        grounds: ["validations[priority=51]", "errors[ERR_INVALID_PROMO]"]
        distinguishing_aspect: "POST /orders with promo_code other than SAVE5 returns ERR_INVALID_PROMO (422)."
        test_recipe:
          setup: ["One customer."]
          setup_api_calls:
            - call: "POST /customers"
