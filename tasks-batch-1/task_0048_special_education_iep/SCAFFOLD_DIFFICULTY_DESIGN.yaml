            - "IEP.${iep_id}.lre_setting == FULL_INCLUSION"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: lre_add_then_discontinue_service_restores_pct
        grounds:
          - calculations.lre_general_ed_pct
          - state_machines.RelatedService.ACTIVE_to_DISCONTINUED
          - entities.IEP.fields.lre_general_ed_pct
        distinguishing_aspect: >-
          Conserved quantity = IEP.lre_general_ed_pct. Adding a pull-out service (forward) then
          discontinuing it (compensating) MUST leave lre_general_ed_pct back at 100.00 — the named
          LRE percentage returns to its pre-action value with no drift.
        test_recipe:
          setup:
            - "A DRAFT IEP (school_day_minutes=360, lre_general_ed_pct=100.0) for an eligible student."
          setup_api_calls:
