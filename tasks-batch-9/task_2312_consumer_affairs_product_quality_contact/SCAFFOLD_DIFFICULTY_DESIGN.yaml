            - { call: "POST /products", as: SystemAdmin, payload: { sku: "SKU-MUG", name: "Ceramic Mug", category: HOUSEWARE, is_regulated_food: false, unit_retail_price_cents: 1800, units_per_case: 6 }, captures: { pr2: "$.data.id" } }
            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr2}", production_line_id: "${ln1}", batch_code: "LOT-T", code_date: "2026-07-01T00:00:00Z", units_produced: 100000 }, captures: { lott: "$.data.id" } }
            - { call: "POST /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}", channel: WEB, received_at: "2026-07-15T00:00:00Z", raw_message: "Chip in the rim." }, captures: { cta: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${cta}", complaint_type: FOREIGN_MATERIAL, reported_batch_code: "LOTT" }, captures: { cpa: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-05T00:00:00Z" } }
            - { call: "POST /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}", channel: WEB, received_at: "2026-08-05T00:00:00Z", raw_message: "Another chipped rim." }, captures: { ctb: "$.data.id" } }
