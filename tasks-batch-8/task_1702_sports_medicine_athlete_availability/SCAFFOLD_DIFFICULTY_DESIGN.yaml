            - "st_final == PAID (cycle DENIED -> APPEALED -> ADJUDICATED -> PAID)"
            - "Claim.${claim_id}.payer_paid_cents == 40000 and patient_resp_cents == 10000 after re-adjudication"

  # =================================================================
  # Rule 4 — transitive_cascade (2 instances, depth>=3 and depth>=2)
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: clearance_grant_four_hop_cascade
        grounds:
          - state_machines.ClearanceAuthorization.PENDING_to_GRANTED
          - state_machines.RTPProtocol.AWAITING_CLEARANCE_to_CLEARED
          - state_machines.InjuryCase.RTP_to_CLEARED
          - calculations.availability_tier_derivation
        distinguishing_aspect: |
          Depth-4 chain caused link-by-link: decide(GRANTED) mutates
          ClearanceAuthorization; that mutation drives RTPProtocol
          AWAITING_CLEARANCE->CLEARED; that drives InjuryCase RTP->CLEARED
          (cleared_on set); that drives Athlete.availability_tier recompute —
          each hop triggered by the previous link, not the original call.
        test_recipe:
          setup:
            - "Team; athlete; MINOR non-concussion case fully progressed: OPEN->REHAB->RTP; protocol total_stages 3 advanced to final stage (AWAITING_CLEARANCE)"
            - "Clearance requested by MedicalStaff user 'med-1' (PENDING); latest DailyStatusEntry recorded by 'med-1' today (fresh)"
            - "Athlete.availability_tier currently LIMITED (RTP + AWAITING_CLEARANCE caps at LIMITED)"
            - "Clock 2026-08-12"
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "FOOTBALL", season_start_date: "2026-08-01", season_end_date: "2027-02-01" }
