              captures: { dl: $.data.id, dl_v: $.data.version }
            - call: "POST /dealer-contracts"
              payload: { dealer_id: "${dl}", terminal_id: "${term}", pricing_mode: "FIXED", fixed_price_mc_per_gal: 90000, volume_committed_gal: 100000, window_start: "2026-08-01", window_end: "2026-08-31" }
