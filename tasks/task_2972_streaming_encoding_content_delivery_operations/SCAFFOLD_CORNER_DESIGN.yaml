          - endpoints.POST_/drm-packages/{id}/revoke
        distinguishing_aspect: "With two assets of which one is QC_PASSED, a LOCKED ladder and a PENDING package the Title reads 100.00 provisional / 45.00 certified; revoking the package drops provisional to 70.00 and leaves certified at 45.00 — a REVOKED package is excluded from the provisional inclusion set as well, and the QC_REJECTED-free denominator of 2 assets is unchanged."
        test_recipe:
          setup:
            - "One ACTIVE DeviceProfile, one Title with two MezzanineAssets (only the first QC-run, verdict PASS), one LOCKED ladder and one PENDING DrmPackage."
          setup_api_calls:
            - call: "POST /device-profiles"
              payload: { device_class: "SMART_TV_HD", max_height_px: 1080, supported_codecs: ["H264"], min_bitrate_kbps: 500, max_bitrate_kbps: 8000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 55.00, quality_normalization_factor: 1.00 }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /titles"
              payload: { external_ref: "TTL-READY-REVOKE", title_name: "Revoked Package Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/rev-a.mxf", duration_seconds: 5400, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a_pass: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/rev-b.mxf", duration_seconds: 5400, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a_ingested: $.data.id }
            - call: "POST /mezzanine-assets/${a_pass}/qc-runs"
              payload: {}
              as: QcAnalyst
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }], expected_title_version: "${t_ver}" }
              as: EncodingEngineer
              captures: { l_id: $.data.id }
            - call: "POST /encoding-ladders/${l_id}/validate"
              payload: {}
              as: EncodingEngineer
            - call: "POST /encoding-ladders/${l_id}/lock"
              payload: {}
              as: EncodingEngineer
            - call: "POST /drm-packages"
              payload: { title_id: "${t_id}", ladder_id: "${l_id}", drm_systems: ["WIDEVINE"], license_server_url: "https://lic.novapic.example/wv" }
              as: DrmOperator
              captures: { pk_id: $.data.id }
          trigger:
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
            - call: "POST /drm-packages/${pk_id}/revoke"
              payload: {}
              as: DrmOperator
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
          assert:
            - "first read: Title.${t_id}.readiness_score_provisional == 100.00 and readiness_score_certified == 45.00"
            - "revoke: HTTP status == 200 and DrmPackage.${pk_id}.state == REVOKED"
            - "second read: Title.${t_id}.readiness_score_provisional == 70.00"
            - "second read: Title.${t_id}.readiness_score_certified == 45.00"
            - "MezzanineAsset.${a_ingested}.qc_state == INGESTED and MezzanineAsset.${a_pass}.qc_state == QC_PASSED"

      - name: title_readiness_variants_diverge_on_the_same_data
        claim_type: variant_divergence
        grounds:
          - calculations.title_readiness_score.variants
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / title_readiness_provisional_vs_certified
          rationale: "The five-asset fixture that makes readiness_score_provisional 100.00 while readiness_score_certified is 80.00 from identical stored rows is the named §1.8 instance's subject, including the asserted delta."

      - name: vendor_capacity_equality_admits_the_reservation
        claim_type: aggregation
        grounds:
          - calculations.vendor_capacity_availability
          - validations[priority=19]
        excluded_because:
          difficulty_instance: boundary_precision_check / vendor_capacity_equality_admits_reservation
          rationale: "The held_gbps + requested == committed_gbps acceptance and the one-hundredth-Gbps rejection above it are asserted as adjacent cases by the named §1.8 instance."

      - name: empty_active_device_pool_yields_a_zero_score
        claim_type: correct_result
        grounds:
          - calculations.device_compat_score
          - entities.EncodingLadder.fields.validation_reason_code
        excluded_because:
          difficulty_instance: boundary_precision_check / empty_active_device_pool_rejects_ladder
          rationale: "The empty-ACTIVE-pool arm — device_compat_score 0.00, compatible_device_count 0, state REJECTED with NO_COMPATIBLE_DEVICE at HTTP 200 — is exactly what the named §1.8 instance asserts."

      - name: reservation_buffer_intervals_are_closed_on_both_ends
        claim_type: interval_merge
        grounds:
          - calculations.vendor_capacity_availability
          - entities.LiveEventReservation.fields.buffer_minutes
        excluded_because:
          difficulty_instance: resource_temporal_overlap / live_reservation_buffer_closed_interval_capacity
          rationale: "The closed-interval, buffer-inflated collision geometry (touching inflated endpoints DO collide and are aggregated) is the named §1.8 instance's subject."

      - name: availability_windows_may_abut_without_overlapping
        claim_type: interval_merge
        grounds:
          - calculations.availability_window_overlap
          - validations[priority=16]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / availability_window_half_open_adjacency
          rationale: "The half-open adjacency case (abutting windows accepted, one millisecond of true overlap rejected with ERR_WINDOW_OVERLAP) is asserted as adjacent cases by the named §1.8 instance."

  # ===========================================================================
  # SECTION 4 — From Table 4 (Validations)
  # Priority-ordering pairs walked down the §1.4 ladder, plus one instance per
  # validation pattern row (priority conflict, cross-entity, temporal,
  # aggregate, conditional, cascading) and the satisfaction-to-pass arm.
  # ===========================================================================
  - section: validations
    instances:

      - name: auth_check_beats_payload_schema_returns_unauthenticated
        claim_type: priority_ordering
        grounds:
          - validations[priority=1]
          - validations[priority=6]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request that omits the X-User-Role header AND omits the required title_name field answers 401 ERR_UNAUTHENTICATED, not 400 ERR_INVALID_REQUEST — priority 1 is evaluated before the payload schema, so the body is never parsed for validity."
        test_recipe:
          setup:
            - "Empty database. The trigger call deliberately sends no X-User-Role header while also omitting a required body field."
          setup_api_calls: []
          trigger:
            - call: "POST /titles"
              payload: { external_ref: "TTL-AUTH-FIRST", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: NO_ROLE_HEADER_SENT
          assert:
            - "HTTP status == 401"
            - "error_id == ERR_UNAUTHENTICATED"
            - "no Title is created"

      - name: role_check_beats_path_existence_returns_forbidden
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=7]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - errors[ERR_TITLE_NOT_FOUND]
        distinguishing_aspect: "GET /titles/{id} for a never-minted UUID answers 403 ERR_ROLE_NOT_PERMITTED when the caller is a VendorOperator (a role absent from that endpoint's list) and 404 ERR_TITLE_NOT_FOUND for the same URL as ContentOps — the role gate runs before the path lookup, so existence never leaks to an unauthorized role."
        test_recipe:
          setup:
            - "Empty database; no Title exists. UUID_ABSENT is used as the path id in both calls."
          setup_api_calls: []
          trigger:
            - call: "GET /titles/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: VendorOperator
            - call: "GET /titles/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ContentOps
          assert:
            - "first call: HTTP status == 403 and error_id == ERR_ROLE_NOT_PERMITTED"
            - "second call: HTTP status == 404 and error_id == ERR_TITLE_NOT_FOUND"

      - name: payload_schema_beats_body_fk_lookup_returns_invalid_request
        claim_type: priority_ordering
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_TITLE_NOT_FOUND]
        distinguishing_aspect: "POST /mezzanine-assets carrying BOTH an unknown frame_rate (30.0, outside the six declared values) and a never-minted title_id answers 400 ERR_INVALID_REQUEST; correcting only the frame_rate turns the same request into 404 ERR_TITLE_NOT_FOUND — schema validation precedes every body foreign-key lookup."
        test_recipe:
          setup:
            - "Empty database; no Title exists."
          setup_api_calls: []
          trigger:
            - call: "POST /mezzanine-assets"
              payload: { title_id: "11111111-1111-4111-8111-111111111111", source_uri: "s3://mez/nope.mxf", duration_seconds: 3600, frame_rate: 30.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, audio_language: "en" }
              as: ContentOps
            - call: "POST /mezzanine-assets"
              payload: { title_id: "11111111-1111-4111-8111-111111111111", source_uri: "s3://mez/nope.mxf", duration_seconds: 3600, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, audio_language: "en" }
              as: ContentOps
          assert:
            - "first call: HTTP status == 400 and error_id == ERR_INVALID_REQUEST"
            - "second call: HTTP status == 404 and error_id == ERR_TITLE_NOT_FOUND"
            - "no MezzanineAsset is created by either call"

      - name: body_fk_lookup_beats_ladder_bindability_returns_not_found
        claim_type: priority_ordering
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_LADDER_NOT_FOUND]
          - errors[ERR_LADDER_NOT_BINDABLE]
        distinguishing_aspect: "POST /drm-packages with a never-minted ladder_id answers 404 ERR_LADDER_NOT_FOUND, while the same call naming a REJECTED ladder of the same Title answers 409 ERR_LADDER_NOT_BINDABLE — existence at priority 8 is decided before the bindable-state guard at priority 11."
        test_recipe:
          setup:
            - "One Title and one REJECTED EncodingLadder: with no DeviceProfile in the database at all, validate takes the REJECTED arm with validation_reason_code NO_COMPATIBLE_DEVICE at HTTP 200."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-BIND-ORDER", title_name: "Bind Order Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }], expected_title_version: "${t_ver}" }
              as: EncodingEngineer
              captures: { l_id: $.data.id }
            - call: "POST /encoding-ladders/${l_id}/validate"
              payload: {}
              as: EncodingEngineer
          trigger:
            - call: "POST /drm-packages"
              payload: { title_id: "${t_id}", ladder_id: "11111111-1111-4111-8111-111111111111", drm_systems: ["WIDEVINE"], license_server_url: "https://lic.novapic.example/wv" }
              as: DrmOperator
            - call: "POST /drm-packages"
              payload: { title_id: "${t_id}", ladder_id: "${l_id}", drm_systems: ["WIDEVINE"], license_server_url: "https://lic.novapic.example/wv" }
              as: DrmOperator
          assert:
            - "EncodingLadder.${l_id}.state == REJECTED and validation_reason_code == NO_COMPATIBLE_DEVICE and device_compat_score == 0.00"
            - "first call: HTTP status == 404 and error_id == ERR_LADDER_NOT_FOUND"
            - "second call: HTTP status == 409 and error_id == ERR_LADDER_NOT_BINDABLE"
            - "no DrmPackage exists after either call"

      - name: stale_title_version_beats_rung_shape_check
        claim_type: priority_conflict
        grounds:
          - validations[priority=12]
          - validations[priority=17]
          - concurrency_rules.ladder-create-stale-title
          - errors[ERR_STALE_TITLE_VERSION]
          - errors[ERR_RUNG_SHAPE_INVALID]
        distinguishing_aspect: "A ladder-create request that is BOTH version-stale and shape-invalid (heights 720 then 480, not strictly increasing) answers 412 ERR_STALE_TITLE_VERSION; re-sending the identical rungs with the current version answers 409 ERR_RUNG_SHAPE_INVALID, proving the shape rule was reachable and was simply outranked."
        test_recipe:
          setup:
            - "One Title whose version is captured, then bumped by a PATCH so the captured value is stale; the post-PATCH version is captured separately."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-OCC-SHAPE", title_name: "Occ Shape Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver_stale: $.data.version }
            - call: "PATCH /titles/${t_id}"
              payload: { title_name: "Occ Shape Cut (renamed)" }
              as: ContentOps
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver_fresh: $.data.version }
          trigger:
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "720p", height_px: 720, bitrate_kbps: 2500 }, { label: "480p", height_px: 480, bitrate_kbps: 1200 }], expected_title_version: "${t_ver_stale}" }
              as: EncodingEngineer
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "720p", height_px: 720, bitrate_kbps: 2500 }, { label: "480p", height_px: 480, bitrate_kbps: 1200 }], expected_title_version: "${t_ver_fresh}" }
              as: EncodingEngineer
          assert:
            - "${t_ver_fresh} == ${t_ver_stale} + 1"
            - "first call: HTTP status == 412 and error_id == ERR_STALE_TITLE_VERSION"
            - "second call: HTTP status == 409 and error_id == ERR_RUNG_SHAPE_INVALID"
            - "no EncodingLadder exists for ${t_id} after either call"
            - "Title.${t_id}.version == ${t_ver_fresh} (neither rejected call incremented it)"

      - name: own_state_gate_beats_cross_entity_guard_on_lock
        claim_type: priority_conflict
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_LADDER_STATE_INVALID]
          - errors[ERR_NO_PASSED_ASSET]
        distinguishing_aspect: "Locking a DRAFT ladder whose Title also has no QC_PASSED asset answers 409 ERR_LADDER_STATE_INVALID (priority 10); once the ladder is VALIDATED the same call answers 409 ERR_NO_PASSED_ASSET (priority 11) — the entity's own state is checked before any other entity's."
        test_recipe:
          setup:
            - "One Title with a single MezzanineAsset left in INGESTED (never QC-run) and one DRAFT ladder; no DeviceProfile yet."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-GATE-ORDER", title_name: "Gate Order Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/gate-order.mxf", duration_seconds: 3600, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a_id: $.data.id }
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }], expected_title_version: "${t_ver}" }
              as: EncodingEngineer
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /encoding-ladders/${l_id}/lock"
              payload: {}
              as: EncodingEngineer
            - call: "POST /device-profiles"
              payload: { device_class: "MOBILE_HIGH", max_height_px: 1080, supported_codecs: ["H264"], min_bitrate_kbps: 500, max_bitrate_kbps: 8000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 45.00, quality_normalization_factor: 1.00 }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /encoding-ladders/${l_id}/validate"
              payload: {}
              as: EncodingEngineer
            - call: "POST /encoding-ladders/${l_id}/lock"
              payload: {}
              as: EncodingEngineer
          assert:
            - "first lock: HTTP status == 409 and error_id == ERR_LADDER_STATE_INVALID"
            - "validate: HTTP status == 200 and EncodingLadder.${l_id}.state == VALIDATED and device_compat_score == 18.00"
            - "second lock: HTTP status == 409 and error_id == ERR_NO_PASSED_ASSET"
            - "EncodingLadder.${l_id}.state == VALIDATED and Title.${t_id}.locked_ladder_count == 0"
            - "MezzanineAsset.${a_id}.qc_state == INGESTED"

      - name: entitlement_rule_safety_beats_region_licensing
        claim_type: priority_conflict
        grounds:
          - validations[priority=13]
          - validations[priority=14]
          - errors[ERR_HDCP_FLOOR_VIOLATION]
          - errors[ERR_RULE_REGION_NOT_LICENSED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / entitlement_rule_safety_beats_referential
          rationale: "The named §1.8 instance sends a rule that violates both the HDCP floor (priority 13) and the region-licensing reference (priority 14) and then repairs one at a time, which is exactly this ordering claim."

      - name: reservation_state_gate_beats_failover_capacity
        claim_type: priority_conflict
        grounds:
          - validations[priority=10]
          - validations[priority=19]
          - errors[ERR_RESERVATION_STATE_INVALID]
          - errors[ERR_VENDOR_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / reservation_failover_state_beats_capacity
          rationale: "The named §1.8 instance fails over a RESERVED (not yet ARMED) reservation onto an over-subscribed failover vendor and asserts the state error wins, then arms it to expose the capacity error."

      - name: resteer_of_an_unroutable_policy_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=10]
          - validations[priority=17]
          - endpoints.POST_/routing-policies/{id}/resteer
          - calculations.routing_vendor_selection
        distinguishing_aspect: "RoutingPolicy is exempt from the priority-10 state gate: a policy already UNROUTABLE with every vendor excluded still returns 200 on resteer and only bumps resteer_count from 1 to 2, leaving primary null, selection_reason_code NO_CANDIDATE and projected_egress_cost_usd 0.00."
        test_recipe:
          setup:
            - "One Title and exactly one CdnVendor serving US, so the first policy is STANDBY_ONLY and a single resteer exhausts the pool."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-RESTEER-OK", title_name: "Resteer Exempt Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /cdn-vendors"
              payload: { vendor_code: "SOLOCDN", regions: ["US"], committed_gbps: 30.00, cost_per_gb_usd: 0.0200 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /routing-policies"
              payload: { title_id: "${t_id}", region_code: "US", steering_mode: "PERFORMANCE" }
              as: DeliveryEngineer
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /routing-policies/${p_id}/resteer"
              payload: {}
              as: DeliveryEngineer
            - call: "POST /routing-policies/${p_id}/resteer"
              payload: {}
              as: DeliveryEngineer
          assert:
            - "policy at creation: state == STANDBY_ONLY and primary_vendor_id == ${v_id} and backup_vendor_id == null"
            - "first resteer: HTTP status == 200 and RoutingPolicy.${p_id}.state == UNROUTABLE"
            - "first resteer: primary_vendor_id == null and backup_vendor_id == null and selection_reason_code == NO_CANDIDATE"
            - "first resteer: excluded_vendor_ids == [${v_id}] and resteer_count == 1 and projected_egress_cost_usd == 0.00"
            - "second resteer: HTTP status == 200 and resteer_count == 2"
            - "second resteer: state == UNROUTABLE and excluded_vendor_ids == [${v_id}] (no primary existed to append)"

      - name: metric_window_ending_at_the_clock_accepted_and_one_second_later_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=15]
          - errors[ERR_METRIC_WINDOW_IN_FUTURE]
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "A metric window whose window_end_at equals the logical clock exactly (2026-08-01T00:00:00Z) is accepted at 201, while the same window ending one second later is rejected with 422 ERR_METRIC_WINDOW_IN_FUTURE — the bound is at-or-before, not strictly before."
        test_recipe:
          setup:
            - "One Title, one ACTIVE DeviceProfile, one CdnVendor serving US; the logical clock stays at its 2026-08-01T00:00:00Z startup default."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-METRIC-CLOCK", title_name: "Clock Bound Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /device-profiles"
              payload: { device_class: "MOBILE_HIGH", max_height_px: 1080, supported_codecs: ["H264"], min_bitrate_kbps: 500, max_bitrate_kbps: 8000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 45.00, quality_normalization_factor: 1.00 }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /cdn-vendors"
              payload: { vendor_code: "CLOCKCDN", regions: ["US"], committed_gbps: 25.00, cost_per_gb_usd: 0.0200 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /playback-metrics"
              payload: { title_id: "${t_id}", device_profile_id: "${d_id}", vendor_id: "${v_id}", region_code: "US", window_start_at: "2026-07-31T00:00:00Z", window_end_at: "2026-08-01T00:00:00Z", play_attempts: 1000, rebuffer_events: 0, startup_ms_p95: 1000, error_count: 0 }
              as: DeliveryEngineer
              captures: { m_id: $.data.id }
            - call: "POST /playback-metrics"
              payload: { title_id: "${t_id}", device_profile_id: "${d_id}", vendor_id: "${v_id}", region_code: "US", window_start_at: "2026-07-31T00:00:00Z", window_end_at: "2026-08-01T00:00:01Z", play_attempts: 1000, rebuffer_events: 0, startup_ms_p95: 1000, error_count: 0 }
              as: DeliveryEngineer
          assert:
            - "first ingest: HTTP status == 201 and PlaybackMetricWindow.${m_id}.quality_index == 100.00 and breach_flag == false"
            - "second ingest: HTTP status == 422 and error_id == ERR_METRIC_WINDOW_IN_FUTURE"
            - "exactly one PlaybackMetricWindow exists for ${v_id}"
            - "CdnVendor.${v_id}.health_score_rolling == 100.00 and breach_window_count == 0"

      - name: reprocess_source_checks_cascade_from_asset_pool_to_ladder_state
        claim_type: cascading_validation
        grounds:
          - validations[priority=11]
          - validations[priority=18]
          - errors[ERR_REPROCESS_NO_SOURCE_ASSET]
          - errors[ERR_LADDER_NOT_LOCKED]
        distinguishing_aspect: "The priority-11 ladder-LOCKED arm for reprocess jobs is cascading: with zero eligible MezzanineAssets the request reports 422 ERR_REPROCESS_NO_SOURCE_ASSET even though the source ladder is also not LOCKED, and adding one INGESTED asset flips the same request to 409 ERR_LADDER_NOT_LOCKED."
        test_recipe:
          setup:
            - "One Title with a DRAFT H264 ladder and NO MezzanineAssets at all."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-REPROC-CASCADE", title_name: "Cascade Check Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }], expected_title_version: "${t_ver}" }
              as: EncodingEngineer
              captures: { l_id: $.data.id }
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver2: $.data.version }
          trigger:
            - call: "POST /reprocess-jobs"
              payload: { title_id: "${t_id}", source_ladder_id: "${l_id}", trigger_reason: "STANDARD_UPDATE", target_codec_family: "HEVC", expected_title_version: "${t_ver2}" }
              as: EncodingEngineer
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/cascade.mxf", duration_seconds: 3600, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a_id: $.data.id }
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver3: $.data.version }
            - call: "POST /reprocess-jobs"
              payload: { title_id: "${t_id}", source_ladder_id: "${l_id}", trigger_reason: "STANDARD_UPDATE", target_codec_family: "HEVC", expected_title_version: "${t_ver3}" }
              as: EncodingEngineer
          assert:
            - "first job attempt: HTTP status == 422 and error_id == ERR_REPROCESS_NO_SOURCE_ASSET"
            - "asset creation: HTTP status == 201 and MezzanineAsset.${a_id}.qc_state == INGESTED"
            - "second job attempt: HTTP status == 409 and error_id == ERR_LADDER_NOT_LOCKED"
            - "no ReprocessJob exists for ${t_id}"

      - name: package_bound_to_another_titles_ladder_is_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=14]
          - errors[ERR_LADDER_TITLE_MISMATCH]
          - endpoints.POST_/drm-packages
        distinguishing_aspect: "Both ids exist and the ladder is in a bindable DRAFT state, yet POST /drm-packages is rejected 422 ERR_LADDER_TITLE_MISMATCH because the ladder belongs to a different Title — and the identical call against that ladder's own Title succeeds with 201."
        test_recipe:
          setup:
            - "Two Titles, each with its own DRAFT H264 ladder."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-MISMATCH-A", title_name: "Mismatch A", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_a: $.data.id }
            - call: "POST /titles"
              payload: { external_ref: "TTL-MISMATCH-B", title_name: "Mismatch B", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_b: $.data.id }
            - call: "GET /titles/${t_b}"
              payload: {}
              as: ContentOps
              captures: { t_b_ver: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_b}", codec_family: "H264", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }], expected_title_version: "${t_b_ver}" }
              as: EncodingEngineer
              captures: { l_b: $.data.id }
          trigger:
            - call: "POST /drm-packages"
              payload: { title_id: "${t_a}", ladder_id: "${l_b}", drm_systems: ["WIDEVINE"], license_server_url: "https://lic.novapic.example/wv" }
              as: DrmOperator
            - call: "POST /drm-packages"
              payload: { title_id: "${t_b}", ladder_id: "${l_b}", drm_systems: ["WIDEVINE"], license_server_url: "https://lic.novapic.example/wv" }
              as: DrmOperator
              captures: { pk_id: $.data.id }
          assert:
            - "first call: HTTP status == 422 and error_id == ERR_LADDER_TITLE_MISMATCH"
            - "second call: HTTP status == 201 and DrmPackage.${pk_id}.state == PENDING and hdcp_floor == NONE"
            - "Title.${t_a}.packaging_state == UNPACKAGED"

      - name: offline_rule_on_a_non_persistent_package_is_rejected
        claim_type: conditional_validation
        grounds:
          - validations[priority=13]
          - errors[ERR_OFFLINE_NOT_LICENSED]
          - entities.DrmPackage.fields.persistent_license_allowed
        distinguishing_aspect: "The offline clause only bites when the package forbids persistent licenses: with persistent_license_allowed at its false default, a rule requesting offline_playback_allowed true is rejected 422 ERR_OFFLINE_NOT_LICENSED, while the same rule with offline_playback_allowed false is accepted 201."
        test_recipe:
          setup:
            - "One Title with a DRAFT 720p H264 ladder (so hdcp_floor is NONE) and one PENDING DrmPackage created without persistent_license_allowed, i.e. at its false default."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-OFFLINE", title_name: "Offline Rule Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }], expected_title_version: "${t_ver}" }
              as: EncodingEngineer
              captures: { l_id: $.data.id }
            - call: "POST /drm-packages"
              payload: { title_id: "${t_id}", ladder_id: "${l_id}", drm_systems: ["WIDEVINE"], license_server_url: "https://lic.novapic.example/wv" }
              as: DrmOperator
              captures: { pk_id: $.data.id }
          trigger:
            - call: "POST /drm-packages/${pk_id}/entitlement-rules"
              payload: { region_code: "*", subscription_tier: "PREMIUM", max_concurrent_streams: 3, max_playback_height_px: 720, hdcp_level: "NONE", offline_playback_allowed: true, priority: 70 }
              as: DrmOperator
            - call: "POST /drm-packages/${pk_id}/entitlement-rules"
              payload: { region_code: "*", subscription_tier: "PREMIUM", max_concurrent_streams: 3, max_playback_height_px: 720, hdcp_level: "NONE", offline_playback_allowed: false, priority: 70 }
              as: DrmOperator
              captures: { r_id: $.data.id }
          assert:
            - "first call: HTTP status == 422 and error_id == ERR_OFFLINE_NOT_LICENSED"
            - "after the first call: DrmPackage.${pk_id}.entitlement_rule_count == 0"
            - "second call: HTTP status == 201 and EntitlementRule.${r_id}.offline_playback_allowed == false"
            - "after the second call: DrmPackage.${pk_id}.entitlement_rule_count == 1"

      - name: encode_budget_debit_rejected_one_cent_short_then_accepted_at_equality
        claim_type: aggregate_validation
        grounds:
          - validations[priority=20]
          - calculations.encode_budget_ledger
          - errors[ERR_ENCODE_BUDGET_EXCEEDED]
          - endpoints.POST_/reprocess-jobs/{id}/run
        distinguishing_aspect: "A job whose frozen cost_estimate_usd is 229.32 is refused 422 ERR_ENCODE_BUDGET_EXCEEDED against a 229.31 budget and accepted at exactly 229.32, leaving encode_budget_remaining_usd at 0.00 — equality is inside the limit and the frozen cost is NOT recomputed when the budget changes."
        test_recipe:
          setup:
            - "One ACTIVE DeviceProfile, one Title created with encode_budget_usd 229.31, one QC_PASSED 10-hour asset, one LOCKED 4-rung H264 ladder and one QUEUED AV1 reprocess job whose frozen cost is 229.32."
          setup_api_calls:
            - call: "POST /device-profiles"
              payload: { device_class: "MOBILE_HIGH", max_height_px: 1080, supported_codecs: ["H264"], min_bitrate_kbps: 500, max_bitrate_kbps: 8000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 45.00, quality_normalization_factor: 1.00 }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /titles"
              payload: { external_ref: "TTL-BUDGET-EQ", title_name: "Budget Equality Cut", content_type: "MOVIE", studio_code: "NOVAPIC", encode_budget_usd: 229.31 }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/budget.mxf", duration_seconds: 36000, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a_id: $.data.id }
            - call: "POST /mezzanine-assets/${a_id}/qc-runs"
              payload: {}
              as: QcAnalyst
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "240p", height_px: 240, bitrate_kbps: 400 }, { label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }, { label: "1080p", height_px: 1080, bitrate_kbps: 5000 }], expected_title_version: "${t_ver}" }
              as: EncodingEngineer
              captures: { l_id: $.data.id }
            - call: "POST /encoding-ladders/${l_id}/validate"
              payload: {}
              as: EncodingEngineer
            - call: "POST /encoding-ladders/${l_id}/lock"
              payload: {}
              as: EncodingEngineer
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver2: $.data.version }
            - call: "POST /reprocess-jobs"
              payload: { title_id: "${t_id}", source_ladder_id: "${l_id}", trigger_reason: "CODEC_DEPRECATION", target_codec_family: "AV1", expected_title_version: "${t_ver2}" }
              as: EncodingEngineer
              captures: { j_id: $.data.id }
          trigger:
            - call: "POST /reprocess-jobs/${j_id}/run"
              payload: {}
              as: EncodingEngineer
            - call: "PATCH /titles/${t_id}"
              payload: { encode_budget_usd: 229.32 }
              as: ContentOps
            - call: "POST /reprocess-jobs/${j_id}/run"
              payload: {}
              as: EncodingEngineer
          assert:
            - "ReprocessJob.${j_id}.cost_estimate_usd == 229.32 at creation"
            - "first run: HTTP status == 422 and error_id == ERR_ENCODE_BUDGET_EXCEEDED"
            - "after the first run: ReprocessJob.${j_id}.state == QUEUED and committed_usd == 0.00 and Title.${t_id}.encode_budget_remaining_usd == 229.31"
            - "PATCH: HTTP status == 200 and Title.${t_id}.encode_budget_usd == 229.32 and encode_budget_remaining_usd == 229.32"
            - "second run: HTTP status == 200 and ReprocessJob.${j_id}.state == RUNNING and committed_usd == 229.32"
            - "after the second run: Title.${t_id}.encode_budget_remaining_usd == 0.00"
            - "ReprocessJob.${j_id}.cost_estimate_usd == 229.32 (unchanged by the PATCH)"

  # ===========================================================================
  # SECTION 5 — From Table 5 (Endpoints)
  # One instance per endpoint pattern row, chosen so that every declared
  # side_effect that no other section already asserts is covered here.
  # ===========================================================================
  - section: endpoints
    instances:

      - name: clock_advance_alone_transitions_nothing
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - state_machines.AvailabilityWindow.transitions
        distinguishing_aspect: "Moving the logical clock two months past a SCHEDULED window's end returns 200 with the new current_utc but leaves the window SCHEDULED and the Title SCHEDULED — only POST /availability-sweep applies temporal consequences."
        test_recipe:
          setup:
            - "One Title with one SCHEDULED US window covering August 2026; the clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-CLOCK-ONLY", title_name: "Clock Only Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /titles/${t_id}/availability-windows"
              payload: { region_code: "US", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", license_tier: "STANDARD" }
              as: ContentOps
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "HTTP status == 200 and response current_utc == 2026-10-01T00:00:00Z"
            - "AvailabilityWindow.${w_id}.state == SCHEDULED and activated_at == null and closed_at == null"
            - "Title.${t_id}.availability_state == SCHEDULED and last_sweep_at == null"

      - name: sweep_on_an_empty_database_returns_nine_zero_counters
        claim_type: bulk_action
        grounds:
          - endpoints.POST_/availability-sweep
          - endpoints.POST_/availability-sweep.output
        distinguishing_aspect: "The sweep is callable with nothing to do: on an empty database it returns 200 with all nine declared counters present and equal to 0, and a second call is identical — the counters are always reported, never omitted."
        test_recipe:
          setup:
            - "Empty database; clock at its startup default."
          setup_api_calls: []
          trigger:
            - call: "POST /availability-sweep"
              payload: {}
              as: PlatformAdmin
            - call: "POST /availability-sweep"
              payload: {}
              as: ContentOps
          assert:
            - "both calls: HTTP status == 200"
            - "both calls: windows_activated == 0 and windows_closed == 0"
            - "both calls: reservations_started == 0 and reservations_ended == 0"
            - "both calls: jobs_completed == 0 and jobs_failed == 0"
            - "both calls: titles_published == 0 and titles_taken_down == 0 and titles_expired == 0"

      - name: title_patch_bumps_version_without_touching_either_state_dimension
        claim_type: standard_crud
        grounds:
          - endpoints.PATCH_/titles/{id}
          - entities.Title.fields.availability_state
          - entities.Title.fields.packaging_state
        distinguishing_aspect: "PATCH /titles/{id} with title_name and studio_code returns 200, increments version from 1 to 2 and rewrites updated_at, while availability_state stays DRAFT, packaging_state stays UNPACKAGED and both readiness variants stay 0.00."
        test_recipe:
          setup:
            - "One freshly created Title at version 1."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-PATCH-VER", title_name: "Patch Version Cut", content_type: "EPISODE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id, t_ver: $.data.version }
          trigger:
            - call: "PATCH /titles/${t_id}"
              payload: { title_name: "Patch Version Cut (v2)", studio_code: "LUMEN" }
              as: ContentOps
          assert:
            - "HTTP status == 200"
            - "Title.${t_id}.version == ${t_ver} + 1"
            - "Title.${t_id}.title_name == Patch Version Cut (v2) and studio_code == LUMEN"
            - "Title.${t_id}.availability_state == DRAFT and packaging_state == UNPACKAGED"
            - "Title.${t_id}.readiness_score_provisional == 0.00 and readiness_score_certified == 0.00"
            - "Title.${t_id}.updated_at is later than or equal to created_at"

      - name: vendor_terms_patch_does_not_resteer_existing_policies
        claim_type: conditional_action
        grounds:
          - endpoints.PATCH_/cdn-vendors/{id}
          - endpoints.POST_/routing-policies/{id}/resteer
          - entities.RoutingPolicy.fields.projected_egress_cost_usd
        distinguishing_aspect: "Raising the primary's cost_per_gb_usd from 0.0100 to 0.9000 leaves the COST-mode policy frozen — same primary, resteer_count 0 and projected_egress_cost_usd still 10.80 — and only the explicit resteer moves it to the 0.0300 vendor with a recomputed 32.40."
        test_recipe:
          setup:
            - "One Title and two CdnVendors serving US, ALPHACDN at 0.0100 and BRAVOCDN at 0.0300, with a COST-mode policy that therefore selects ALPHACDN."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-FROZEN-SEL", title_name: "Frozen Selection Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /cdn-vendors"
              payload: { vendor_code: "ALPHACDN", regions: ["US"], committed_gbps: 100.00, cost_per_gb_usd: 0.0100 }
              as: PlatformAdmin
              captures: { v_alpha: $.data.id }
            - call: "POST /cdn-vendors"
              payload: { vendor_code: "BRAVOCDN", regions: ["US"], committed_gbps: 100.00, cost_per_gb_usd: 0.0300 }
              as: PlatformAdmin
              captures: { v_bravo: $.data.id }
            - call: "POST /routing-policies"
              payload: { title_id: "${t_id}", region_code: "US", steering_mode: "COST" }
              as: DeliveryEngineer
              captures: { p_id: $.data.id }
          trigger:
            - call: "PATCH /cdn-vendors/${v_alpha}"
              payload: { cost_per_gb_usd: 0.9000 }
              as: PlatformAdmin
            - call: "GET /routing-policies/${p_id}"
              payload: {}
              as: DeliveryEngineer
            - call: "POST /routing-policies/${p_id}/resteer"
              payload: {}
              as: DeliveryEngineer
          assert:
            - "PATCH: HTTP status == 200 and CdnVendor.${v_alpha}.cost_per_gb_usd == 0.9000 and version == 2"
            - "read after PATCH: RoutingPolicy.${p_id}.primary_vendor_id == ${v_alpha} and resteer_count == 0"
            - "read after PATCH: RoutingPolicy.${p_id}.projected_egress_cost_usd == 10.80"
            - "resteer: HTTP status == 200 and primary_vendor_id == ${v_bravo} and backup_vendor_id == null"
            - "resteer: state == STANDBY_ONLY and selection_reason_code == COST_RANK and resteer_count == 1"
            - "resteer: excluded_vendor_ids == [${v_alpha}] and projected_egress_cost_usd == 32.40"

      - name: new_device_profile_does_not_rescore_a_validated_ladder
        claim_type: computed_read
        grounds:
          - endpoints.POST_/device-profiles
          - endpoints.GET_/encoding-ladders/{id}
          - calculations.device_compat_score
        distinguishing_aspect: "device_compat_score is a snapshot taken at validate time: a ladder validated at 24.00 with one compatible profile still reads 24.00 and compatible_device_count 1 after a second compatible profile is registered — registering a device never re-scores existing ladders."
        test_recipe:
          setup:
            - "One ACTIVE SMART_TV_HD DeviceProfile at 60.00 share, one Title, and one 2-rung H264 ladder already VALIDATED against that single profile."
          setup_api_calls:
            - call: "POST /device-profiles"
              payload: { device_class: "SMART_TV_HD", max_height_px: 1080, supported_codecs: ["H264"], min_bitrate_kbps: 500, max_bitrate_kbps: 8000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 60.00, quality_normalization_factor: 1.00 }
              as: PlatformAdmin
              captures: { d_first: $.data.id }
            - call: "POST /titles"
              payload: { external_ref: "TTL-SNAPSHOT", title_name: "Snapshot Score Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }], expected_title_version: "${t_ver}" }
              as: EncodingEngineer
              captures: { l_id: $.data.id }
            - call: "POST /encoding-ladders/${l_id}/validate"
              payload: {}
              as: EncodingEngineer
          trigger:
            - call: "POST /device-profiles"
              payload: { device_class: "MOBILE_HIGH", max_height_px: 1080, supported_codecs: ["H264"], min_bitrate_kbps: 500, max_bitrate_kbps: 8000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 30.00, quality_normalization_factor: 0.90 }
              as: PlatformAdmin
              captures: { d_second: $.data.id }
            - call: "GET /encoding-ladders/${l_id}"
              payload: {}
              as: EncodingEngineer
          assert:
            - "device registration: HTTP status == 201"
            - "EncodingLadder.${l_id}.device_compat_score == 24.00"
            - "EncodingLadder.${l_id}.compatible_device_count == 1"
            - "EncodingLadder.${l_id}.state == VALIDATED and validation_reason_code == OK"

      - name: qc_reports_are_listed_in_attempt_number_order
        claim_type: standard_crud
        grounds:
          - endpoints.GET_/mezzanine-assets/{id}/qc-reports
          - entities.QualityControlReport.fields.attempt_number
          - state_machines.MezzanineAsset.transitions
        distinguishing_aspect: "After a FAIL, a remediation request and a resubmit that changes nothing, the second run produces attempt_number 2 and the sub-resource list returns exactly [1, 2] in attempt order with both severities at 32.00 — the reports are the only channel exposing per-attempt severity, and the resubmit did not reset the counter."
        test_recipe:
          setup:
            - "One Title with one MezzanineAsset carrying artifact_defect_count 8 (an ARTIFACT_BURST on every attempt), driven once around the QC revision loop."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-QC-LIST", title_name: "Report Order Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/loop.mxf", duration_seconds: 3600, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 8, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a_id: $.data.id }
            - call: "POST /mezzanine-assets/${a_id}/qc-runs"
              payload: {}
              as: QcAnalyst
            - call: "POST /mezzanine-assets/${a_id}/remediation-request"
              payload: {}
              as: QcAnalyst
            - call: "POST /mezzanine-assets/${a_id}/resubmit"
              payload: {}
              as: ContentOps
            - call: "POST /mezzanine-assets/${a_id}/qc-runs"
              payload: {}
              as: QcAnalyst
          trigger:
            - call: "GET /mezzanine-assets/${a_id}/qc-reports"
              payload: {}
              as: QcAnalyst
          assert:
            - "HTTP status == 200 and exactly 2 QualityControlReports returned"
            - "report[0].attempt_number == 1 and report[1].attempt_number == 2"
            - "report[0].severity_index == 32.00 and report[0].blocking_defect_code == ARTIFACT_BURST and report[0].verdict == FAIL"
