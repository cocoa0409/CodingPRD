      - name: requests_missing_x_user_headers_are_rejected_as_unauthenticated
        claim_type: Error triggerable
        grounds:
          - validations.priority_1
          - validations.priority_2
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: |
          Priority 1 is the outermost gate, so it must answer even for requests that are ALSO malformed and
          ALSO addressed to an endpoint the named role could never use: an unknown role name is
          authentication (401), not authorisation (403), and a present role with a blank X-User-ID is still
          401. This is the only instance that probes the transport headers rather than the body.
        setup_note: "the three failing calls omit or corrupt the identity headers; `as: OMITTED` means the X-User-Role header is absent and `as_user_id: OMITTED` means X-User-ID is absent"
        test_recipe:
          setup:
            - "no rows required; the gate runs before any lookup"
          setup_api_calls: []
          trigger:
            - call: "POST /models"
              payload: { name: "fraud-scorer", task_type: "CLASSIFICATION", owner_team: "risk-ml" }
              as: OMITTED
              as_user_id: "u_mle_1"
              captures: { no_role_err: $.data.error_id }
            - call: "POST /models"
              payload: { name: "fraud-scorer", task_type: "CLASSIFICATION", owner_team: "risk-ml" }
              as: MLEngineer
              as_user_id: OMITTED
              captures: { no_user_err: $.data.error_id }
            - call: "POST /models"
              payload: { name: "fraud-scorer", task_type: "CLASSIFICATION", owner_team: "risk-ml" }
              as: Auditor
              as_user_id: "u_aud_1"
              captures: { bad_role_err: $.data.error_id }
            - call: "GET /models"
              payload: { limit: 10, offset: 0 }
              as: OMITTED
              as_user_id: OMITTED
              captures: { read_err: $.data.error_id }
            - call: "POST /models"
              payload: { name: "fraud-scorer", task_type: "CLASSIFICATION", owner_team: "risk-ml" }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { ok_id: $.data.id }
          assert:
            - "a request with no X-User-Role header returns HTTP 401 'ERR_UNAUTHENTICATED'"
            - "a request with a valid role but no X-User-ID header returns HTTP 401 'ERR_UNAUTHENTICATED' — both headers are required"
            - "a role name outside the five declared roles ('Auditor') returns HTTP 401 'ERR_UNAUTHENTICATED', not 403 — an unrecognised principal is not an unauthorised one"
            - "read endpoints are gated identically: GET /models with no headers returns HTTP 401 'ERR_UNAUTHENTICATED'"
            - "no row was created by any rejected call: the first authenticated POST /models succeeds with HTTP 201, so the earlier attempts did not consume the (name, owner_team) uniqueness pair"

      - name: registry_uniqueness_pairs_and_hash_lineage_identities
        claim_type: Error triggerable
        grounds:
          - validations.priority_43
          - validations.priority_47
          - validations.priority_50
          - validations.priority_52
          - errors.ERR_DUPLICATE_MODEL_NAME
          - errors.ERR_DUPLICATE_SERVING_ENDPOINT_NAME
          - errors.ERR_FEATURE_SPEC_MISMATCH
          - errors.ERR_LINEAGE_MODEL_MISMATCH
        distinguishing_aspect: |
          Four structural-integrity codes whose interesting property is what they permit: uniqueness is on
          the PAIR (name, owner_team) and (name, region), so the same name is legal under a different
          owner or region. ERR_FEATURE_SPEC_MISMATCH covers two different identities on two different
          endpoints (version-vs-dataset hash and endpoint-vs-version hash), and the lineage code fires on
          a cross-model parent while a same-model parent is accepted.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z startup default"
            - "model A (fraud-scorer / risk-ml), model B (churn-scorer / risk-ml), and one APPROVED dataset with feature_hash fs-v1"
