  # =================================================================
  - section: endpoints
    instances:
      - name: fnb_void_from_open_succeeds
        claim_type: Action endpoint
        grounds: [state_machines.FnbOrder.OPEN_to_VOIDED, endpoints]
        distinguishing_aspect: "POST /v1/fnb-orders/{id}/void moves an OPEN tab to VOIDED with no wallet debit."
        test_recipe:
          setup: ["Open walk-in session with an OPEN fnb tab."]
          setup_api_calls:
