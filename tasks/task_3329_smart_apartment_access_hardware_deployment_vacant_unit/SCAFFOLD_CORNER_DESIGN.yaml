          trigger:
            - call: "POST /properties/${prop_ag}/buildings"
              payload: { name: "Fresh", network_design: "FIELD_MESH", wifi_rssi_dbm: -74, last_hub_service_at: "2026-08-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { bld_fresh: $.data.id }
            - call: "POST /properties/${prop_ag}/buildings"
              payload: { name: "Aged", network_design: "FIELD_MESH", wifi_rssi_dbm: -74, last_hub_service_at: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              captures: { bld_aged: $.data.id }
          assert:
            - "Building.${bld_fresh}.connectivity_ok == true (age_penalty 0, -74 >= -75)"
            - "Building.${bld_aged}.connectivity_ok == false (age_penalty floor(0.1*20)=2, effective -76 < -75)"

# ===========================================================================
  - section: validations
    instances:

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A call with no X-User-Role header is rejected 401 ERR_UNAUTHENTICATED before any existence or state check runs."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /properties"
              payload: { name: "No Auth", address_line: "1 Anon Ave", unit_capacity: 1, temp_budget_cents_per_day: 400 }
              as: Anonymous
              captures: { e_au: $.data.error_id }
          assert:
            - "the response status is 401 and response_type is error"
            - "error_id == ERR_UNAUTHENTICATED"

      - name: notice_lead_time_satisfied_then_outside_window_rejected
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_OUTSIDE_NOTICE_WINDOW]
        distinguishing_aspect: "Notice served 60 hours ahead clears the 48-hour lead-time check (priority 10), so the ONLY remaining failure is the 21:00 start landing outside the 08:00–20:00 notice window — a clean single-violation ERR_OUTSIDE_NOTICE_WINDOW."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Unit U with a non-emergency REQUESTED MaintenanceVisit V starting 2026-09-03T21:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Window Watch", address_line: "8 Clock Ct", unit_capacity: 1, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_ww: $.data.id }
            - call: "POST /properties/${prop_ww}/units"
              payload: { unit_number: "U-WW1" }
              as: PropertyManager
              captures: { unit_ww: $.data.id }
            - call: "POST /units/${unit_ww}/maintenance-visits"
              payload: { technician_id: "tech-ned", start_at: "2026-09-03T21:00:00Z", end_at: "2026-09-04T00:00:00Z", is_emergency: false }
              as: PropertyManager
              captures: { visit_ww: $.data.id }
          trigger:
            - call: "POST /maintenance-visits/${visit_ww}/certify_notice"
              payload: { notice_mailed_at: "2026-09-01T09:00:00Z" }
              as: PropertyManager
              captures: { e_ww: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_OUTSIDE_NOTICE_WINDOW"
            - "the 60-hour lead time alone did NOT trip ERR_NOTICE_REQUIREMENT_UNMET (priority 10 passed)"
            - "MaintenanceVisit.${visit_ww}.status remains REQUESTED"

      - name: budget_committed_boundary_rejects_visit_that_exceeds_cap
        claim_type: Violation → Error
        grounds:
          - validations[priority=20]
          - errors[ERR_BUDGET_EXCEEDED]
          - entities.Property.fields.temp_budget_cents_per_day
        distinguishing_aspect: "With a 400-cent daily cap, a 4100-cent accrual pushes budget_committed_cents past the cap and the certify is rejected ERR_BUDGET_EXCEEDED (409) after the notice checks pass."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Property P with temp_budget_cents_per_day=400, unit U, non-emergency REQUESTED visit V starting 2026-09-03T10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Tight Purse", address_line: "4 Frugal Rd", unit_capacity: 1, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_tp: $.data.id }
            - call: "POST /properties/${prop_tp}/units"
              payload: { unit_number: "U-TP1" }
              as: PropertyManager
              captures: { unit_tp: $.data.id }
            - call: "POST /units/${unit_tp}/maintenance-visits"
              payload: { technician_id: "tech-gil", start_at: "2026-09-03T10:00:00Z", end_at: "2026-09-03T13:00:00Z", is_emergency: false }
              as: PropertyManager
              captures: { visit_tp: $.data.id }
          trigger:
            - call: "POST /maintenance-visits/${visit_tp}/certify_notice"
              payload: { notice_mailed_at: "2026-09-01T09:00:00Z" }
              as: PropertyManager
              captures: { e_tp: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_BUDGET_EXCEEDED"
            - "Property.${prop_tp}.budget_committed_cents remains 0 (the accrual was not committed)"
            - "MaintenanceVisit.${visit_tp}.status remains REQUESTED"

      - name: duplicate_unit_number_within_property_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=19]
          - errors[ERR_DUPLICATE_UNIT_NUMBER]
        distinguishing_aspect: "unit_number is unique per property only: a second U-1 in the same property is rejected ERR_DUPLICATE_UNIT_NUMBER (409), while a U-1 in a different property is allowed."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Properties P1 and P2; P1 already has unit_number U-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "P1", address_line: "1 One St", unit_capacity: 2, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_u1: $.data.id }
            - call: "POST /properties"
              payload: { name: "P2", address_line: "2 Two St", unit_capacity: 2, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_u2: $.data.id }
            - call: "POST /properties/${prop_u1}/units"
              payload: { unit_number: "U-1" }
              as: PropertyManager
          trigger:
            - call: "POST /properties/${prop_u1}/units"
              payload: { unit_number: "U-1" }
              as: PropertyManager
              captures: { e_du: $.data.error_id }
            - call: "POST /properties/${prop_u2}/units"
              payload: { unit_number: "U-1" }
              as: PropertyManager
          assert:
            - "the second U-1 in P1 returns 409 ERR_DUPLICATE_UNIT_NUMBER"
            - "the U-1 in P2 succeeds with status 201 (uniqueness is property-scoped)"

      - name: setpoint_override_out_of_range_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=18]
          - errors[ERR_SETPOINT_OUT_OF_RANGE]
          - endpoints.POST_/units/{unitId}/vacant-automation
        distinguishing_aspect: "A setpoint_override_c of 40 lies above SETPOINT_MAX_C 27 and is rejected 422 ERR_SETPOINT_OUT_OF_RANGE, while 27 (the maximum) is accepted."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Unit U (VACANT)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Range Ranch", address_line: "17 Limit Ln", unit_capacity: 1, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_rr: $.data.id }
            - call: "POST /properties/${prop_rr}/units"
              payload: { unit_number: "U-RR1" }
              as: PropertyManager
              captures: { unit_rr: $.data.id }
          trigger:
            - call: "POST /units/${unit_rr}/vacant-automation"
              payload: { window_forecast_c: 25, relative_humidity_pct: 40, setpoint_override_c: 40 }
              as: PropertyManager
              captures: { e_rr: $.data.error_id }
            - call: "POST /units/${unit_rr}/vacant-automation"
              payload: { window_forecast_c: 25, relative_humidity_pct: 40, setpoint_override_c: 27 }
              as: PropertyManager
          assert:
            - "the override 40 returns 422 ERR_SETPOINT_OUT_OF_RANGE and Unit.${unit_rr}.target_setpoint_c is unchanged"
            - "the override 27 (the inclusive maximum) succeeds and Unit.${unit_rr}.target_setpoint_c == 27.0"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: device_scan_drains_battery_of_unreachable_devices
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/buildings/{buildingId}/device-scans
          - entities.Device.fields.battery_pct
        distinguishing_aspect: "A scan decrements battery_pct by BATTERY_DRAIN_PER_SCAN for each device absent from reachable_device_ids, while a reachable device keeps its full charge."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Building B with two locks D-online and D-offline, both at battery_pct 100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Drain Depot", address_line: "10 Cell St", unit_capacity: 1, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_dp: $.data.id }
            - call: "POST /properties/${prop_dp}/buildings"
              payload: { name: "DP-B1", network_design: "FIELD_MESH", wifi_rssi_dbm: -60 }
              as: PlatformAdmin
              captures: { bld_dp: $.data.id }
            - call: "POST /devices"
              payload: { device_type: "SMART_LOCK", building_id: "${bld_dp}", firmware_version: "LATEST", battery_pct: 100 }
              as: HardwareTechnician
              captures: { dev_on: $.data.id }
            - call: "POST /devices"
              payload: { device_type: "SMART_LOCK", building_id: "${bld_dp}", firmware_version: "LATEST", battery_pct: 100 }
              as: HardwareTechnician
              captures: { dev_off: $.data.id }
          trigger:
            - call: "POST /buildings/${bld_dp}/device-scans"
              payload: { reachable_device_ids: ["${dev_on}"] }
              as: HardwareTechnician
          assert:
            - "Device.${dev_on}.battery_pct == 100 (reachable, no drain)"
            - "Device.${dev_off}.battery_pct == 99 (absent, drained by BATTERY_DRAIN_PER_SCAN=1)"
            - "Device.${dev_off}.status == UNREACHABLE and Device.${dev_on}.status == ONLINE"

      - name: clock_advance_expires_guest_pass_and_credential
        claim_type: Computed read
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - state_machines.GuestPass.transitions.ACTIVE_to_EXPIRED
          - state_machines.AccessCredential.transitions.ACTIVE_to_EXPIRED
        distinguishing_aspect: "Advancing the logical clock past a guest pass's end_at flips it ACTIVE→EXPIRED and expires the matching GUEST credential, with no wall-clock dependency."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Unit U with ACTIVE resident R and an ACTIVE GuestPass G ending 2026-09-06T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Tick Tock", address_line: "6 Tick Rd", unit_capacity: 1, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_tk: $.data.id }
            - call: "POST /properties/${prop_tk}/buildings"
              payload: { name: "TK-B1", network_design: "FIELD_MESH", wifi_rssi_dbm: -60 }
              as: PlatformAdmin
              captures: { bld_tk: $.data.id }
            - call: "POST /properties/${prop_tk}/units"
              payload: { unit_number: "U-TK1", building_id: "${bld_tk}" }
              as: PropertyManager
              captures: { unit_tk: $.data.id }
            - call: "POST /devices"
              payload: { device_type: "SMART_LOCK", unit_id: "${unit_tk}", building_id: "${bld_tk}", firmware_version: "LATEST", battery_pct: 100 }
              as: HardwareTechnician
              captures: { dev_tk: $.data.id }
            - call: "POST /buildings/${bld_tk}/device-scans"
              payload: { reachable_device_ids: ["${dev_tk}"] }
              as: HardwareTechnician
            - call: "POST /residents"
              payload: { property_id: "${prop_tk}", unit_id: "${unit_tk}", full_name: "Tia Tick", email: "tia@x.com" }
              as: PropertyManager
              captures: { res_tk: $.data.id }
            - call: "POST /residents/${res_tk}/onboard"
              payload: {}
              as: PropertyManager
            - call: "POST /units/${unit_tk}/guest-passes"
              payload: { host_resident_id: "${res_tk}", guest_label: "Tick Guest", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-06T09:00:00Z" }
              as: PropertyManager
              captures: { pass_tk: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-07T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "GuestPass.${pass_tk}.status == EXPIRED after the clock passes 2026-09-06T09:00:00Z"
            - "the GUEST AccessCredential on ${unit_tk} is EXPIRED"
            - "the RESIDENT credential for ${res_tk} remains ACTIVE (its window has no end)"

      - name: replace_battery_restores_charge_and_increments_counter
        claim_type: Action endpoint
        grounds:
