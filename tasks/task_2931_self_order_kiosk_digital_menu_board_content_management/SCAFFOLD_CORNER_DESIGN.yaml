          assert:
            - "${mismatch_err} == ERR_DEVICE_IDENTITY_MISMATCH with HTTP 403"
            - "${mismatch_before_404_err} == ERR_DEVICE_IDENTITY_MISMATCH with HTTP 403, not ERR_RESOURCE_NOT_FOUND — priority 3 precedes priority 5"
            - "the self-directed heartbeat succeeds with ${own_score} == 100 (all four components healthy) and ${own_health} == ONLINE"
            - "GET /kiosk-ops/devices/${dev2_id} as PlatformAdmin still shows rolling_health_score 100 with last_heartbeat_utc null and health_state ONLINE — the refused heartbeat left no trace"

      - name: a_store_operator_cannot_reach_into_another_stores_rows
        claim_type: peer_roles
        grounds:
          - roles.StoreOperator.exclusive_operations
          - errors.ERR_STORE_SCOPE_VIOLATION
          - validations.priority_4_ERR_STORE_SCOPE_VIOLATION
          - entities.StoreItemAvailability.parent
        distinguishing_aspect: "StoreOperator authority is scoped by X-User-ID to the owning store: S002's operator is refused on S001's availability row with ERR_STORE_SCOPE_VIOLATION (403) on both the nested create and the row-level action, while S001's own operator succeeds on the identical payload."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A, cluster CL_WEST, two stores S001 and S002; Item A exists."
