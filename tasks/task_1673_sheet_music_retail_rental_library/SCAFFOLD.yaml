  - method: POST
    path: "/library/damage-invoices/{id}/issue"
    description: "Issue a DRAFT invoice (segregation of duties enforced)"
    roles: [BillingManager]
    code: 200
    input: []
    output: DamageInvoice
    side_effects: ["status → ISSUED; report → INVOICED; exposure recompute + possible standing HOLD cascade"]
  - method: POST
    path: "/library/damage-invoices/{id}/record-payment"
    description: "Record payment of an ISSUED/DISPUTED invoice"
    roles: [BillingManager]
    code: 200
    input: []
    output: DamageInvoice
    side_effects: ["status → PAID; exposures recompute"]
  - method: POST
    path: "/library/damage-invoices/{id}/resolve"
    description: "Resolve a disputed invoice (accept or waive)"
    roles: [BillingManager]
    code: 200
    input: [resolution]
    output: DamageInvoice
    side_effects: ["status → RESOLVED_ACCEPTED | RESOLVED_WAIVED; exposures recompute"]
  - method: POST
    path: "/library/damage-invoices/{id}/reissue"
    description: "Re-issue a disputed invoice against a superseding re-assessment"
    roles: [BillingManager]
    code: 200
    input: [new_condition_report_id]
    output: DamageInvoice
    side_effects: ["old report → SUPERSEDED; amount updated; status → ISSUED; exposures recompute"]

  # --- PerusalRequest ---
  - method: POST
    path: "/library/perusal-requests"
    description: "Request a perusal / approval copy"
    roles: [Customer, LibraryClerk]
    code: 201
    input: [account_id, work_id, format]
    output: PerusalRequest
    side_effects: ["status = REQUESTED"]
  - method: GET
    path: "/library/perusal-requests"
    description: "List perusal requests"
    roles: [LibraryAdmin, LibraryClerk, ReturnsClerk, BillingManager, RightsAdvisor, Customer]
    code: 200
    input: ["account_id?", "work_id?", "limit?", "offset?"]
    output: "PerusalRequest[]"
    side_effects: []
  - method: GET
    path: "/library/perusal-requests/{id}"
    description: "Get perusal request"
    roles: [LibraryAdmin, LibraryClerk, ReturnsClerk, BillingManager, RightsAdvisor, Customer]
    code: 200
    input: []
    output: PerusalRequest
    side_effects: []
  - method: POST
    path: "/library/perusal-requests/{id}/approve"
    description: "Approve perusal (reserves the buffered hold interval)"
    roles: [LibraryClerk]
    code: 200
    input: []
    output: PerusalRequest
    side_effects: ["ship_date/return_due_date/hold interval set; status → APPROVED; increments PerusalRequest.version by 1"]
  - method: POST
    path: "/library/perusal-requests/{id}/reject"
    description: "Reject a perusal request"
    roles: [LibraryClerk]
    code: 200
    input: []
    output: PerusalRequest
    side_effects: ["status → REJECTED"]
  - method: POST
    path: "/library/perusal-requests/{id}/ship"
    description: "Mark perusal shipped"
    roles: [LibraryClerk]
    code: 200
    input: []
    output: PerusalRequest
    side_effects: ["status → SHIPPED; increments PerusalRequest.version by 1"]
  - method: POST
    path: "/library/perusal-requests/{id}/record-return"
    description: "Record perusal copy return"
    roles: [ReturnsClerk]
    code: 200
    input: []
    output: PerusalRequest
    side_effects: ["status → RETURNED; standing restoration check"]
  - method: POST
    path: "/library/perusal-requests/{id}/convert"
    description: "Convert perusal to rental or purchase"
    roles: [LibraryClerk]
    code: 200
    input: [converted_target_kind, "rental_set_id?", "copies_requested?", "checkout_date?", "due_date?", "quantity?"]
    output: PerusalRequest
    side_effects: ["creates RentalOrder(RESERVED) or SaleRecord(INVOICED with conversion discount); converted_target_id recorded; increments PerusalRequest.version by 1"]

  # --- SaleRecord ---
  - method: POST
    path: "/library/sale-records"
    description: "Create a direct sale (no perusal)"
    roles: [LibraryClerk, BillingManager]
    code: 201
    input: [account_id, work_id, quantity, "perusal_request_id?"]
    output: SaleRecord
    side_effects: ["unit_price/total per perusal_conversion_credit (discount only when perusal_request_id present); status = INVOICED; exposure recompute"]
  - method: GET
    path: "/library/sale-records"
    description: "List sale records"
    roles: [LibraryAdmin, LibraryClerk, ReturnsClerk, BillingManager, Customer]
    code: 200
    input: ["account_id?", "work_id?", "perusal_request_id?", "limit?", "offset?"]
    output: "SaleRecord[]"
    side_effects: []
  - method: GET
    path: "/library/sale-records/{id}"
    description: "Get sale record"
    roles: [LibraryAdmin, LibraryClerk, ReturnsClerk, BillingManager, Customer]
    code: 200
    input: []
    output: SaleRecord
    side_effects: []
  - method: POST
    path: "/library/sale-records/{id}/record-payment"
    description: "Record sale payment"
    roles: [BillingManager]
    code: 200
    input: []
    output: SaleRecord
    side_effects: ["status → PAID; balance_due_cents → 0; exposures recompute"]
  - method: POST
    path: "/library/sale-records/{id}/write-off"
    description: "Write off an unpaid sale"
    roles: [BillingManager]
    code: 200
    input: []
    output: SaleRecord
    side_effects: ["status → WRITTEN_OFF; balance_due_cents → 0; exposures recompute"]

  # --- RightsAdvisoryCase ---
  - method: POST
    path: "/library/rights-advisory-cases"
    description: "Open a performance-rights advisory case"
    roles: [Customer, LibraryClerk, RightsAdvisor]
    code: 201
    input: [account_id, work_id, venue_kind, question]
    output: RightsAdvisoryCase
    side_effects: ["status = OPEN; determination = PENDING"]
  - method: GET
    path: "/library/rights-advisory-cases"
    description: "List advisory cases"
    roles: [LibraryAdmin, LibraryClerk, ReturnsClerk, BillingManager, RightsAdvisor, Customer]
    code: 200
    input: ["account_id?", "work_id?", "limit?", "offset?"]
    output: "RightsAdvisoryCase[]"
    side_effects: []
  - method: GET
    path: "/library/rights-advisory-cases/{id}"
    description: "Get advisory case"
    roles: [LibraryAdmin, LibraryClerk, ReturnsClerk, BillingManager, RightsAdvisor, Customer]
    code: 200
    input: []
    output: RightsAdvisoryCase
    side_effects: []
  - method: POST
    path: "/library/rights-advisory-cases/{id}/decide"
    description: "Issue a rights determination"
    roles: [RightsAdvisor]
    code: 200
    input: [determination]
    output: RightsAdvisoryCase
    side_effects: ["status → DECIDED; decided_by_user_id recorded; increments RightsAdvisoryCase.version by 1"]
  - method: POST
    path: "/library/rights-advisory-cases/{id}/withdraw"
    description: "Withdraw an open case"
    roles: [Customer]
    code: 200
    input: []
    output: RightsAdvisoryCase
    side_effects: ["status → WITHDRAWN"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_FORBIDDEN_ACCOUNT, http: 403, condition: "Customer role acting on a resource outside its own account" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid required field, bad enum, due_date <= checkout_date, quantity < 1, malformed date" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "CustomerAccount id not found" }
  - { id: ERR_PUBLISHER_NOT_FOUND, http: 404, condition: "Publisher id not found" }
  - { id: ERR_WORK_NOT_FOUND, http: 404, condition: "Work id not found" }
  - { id: ERR_RENTAL_SET_NOT_FOUND, http: 404, condition: "RentalSet id not found" }
  - { id: ERR_PO_NOT_FOUND, http: 404, condition: "PurchaseOrder id not found" }
  - { id: ERR_RENTAL_ORDER_NOT_FOUND, http: 404, condition: "RentalOrder id not found" }
  - { id: ERR_RENTAL_LINE_NOT_FOUND, http: 404, condition: "RentalLine id not found" }
  - { id: ERR_CONDITION_REPORT_NOT_FOUND, http: 404, condition: "ConditionReport id not found" }
  - { id: ERR_DAMAGE_INVOICE_NOT_FOUND, http: 404, condition: "DamageInvoice id not found" }
  - { id: ERR_PERUSAL_REQUEST_NOT_FOUND, http: 404, condition: "PerusalRequest id not found" }
  - { id: ERR_SALE_RECORD_NOT_FOUND, http: 404, condition: "SaleRecord id not found" }
  - { id: ERR_RIGHTS_CASE_NOT_FOUND, http: 404, condition: "RightsAdvisoryCase id not found" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a from-state permitting the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current parent version (OCC)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Invoice issuer/resolver is the same user as the condition assessor on that line" }
  - { id: ERR_RIGHTS_NOT_CLEARED, http: 409, condition: "Dispatch of GRAND_RIGHTS/RESTRICTED work without a DECIDED+CLEARED advisory case" }
  - { id: ERR_LICENSE_FORMAT_NOT_AVAILABLE, http: 422, condition: "Requested DIGITAL format not licensed for this work/publisher" }
  - { id: ERR_RENTAL_SET_NOT_RENTABLE, http: 409, condition: "Set not IN_SERVICE or condition_grade == D" }
  - { id: ERR_WORK_NOT_RENTABLE, http: 409, condition: "Work WITHDRAWN or Publisher SUSPENDED" }
  - { id: ERR_INSUFFICIENT_COPIES, http: 409, condition: "Fewer allocatable copies than copies_requested for the requested window (half-open overlap)" }
  - { id: ERR_RENEWAL_CONFLICT, http: 409, condition: "Renewal extension collides with another order's window on the same set" }
  - { id: ERR_PERUSAL_HOLD_CONFLICT, http: 409, condition: "Perusal hold violates closed-interval + quarantine-buffer separation on the same work" }
  - { id: ERR_PO_NOT_USABLE, http: 409, condition: "Required PO missing, not APPROVED, or outside validity window" }
  - { id: ERR_PO_AMOUNT_EXCEEDED, http: 402, condition: "PO encumbrance plus new fee would exceed authorized_amount_cents" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "settled_exposure_cents + estimated_fee_cents exceeds credit_limit_cents (> 0)" }
  - { id: ERR_PREPAYMENT_REQUIRED, http: 402, condition: "PREPAY account dispatching with prepayment_cents < estimated_fee_cents" }
  - { id: ERR_PREPAYMENT_SHORTFALL, http: 402, condition: "Settle on PREPAY account with final fee above prepayment and no top-up" }
  - { id: ERR_ACCOUNT_NOT_IN_GOOD_STANDING, http: 409, condition: "Account standing HOLD/BARRED blocks reserve/dispatch/renew/PO-approve/perusal-approve" }
  - { id: ERR_ACCOUNT_STILL_DELINQUENT, http: 409, condition: "Reinstate attempted while overdue rentals or perusals remain" }
  - { id: ERR_PO_REQUIRES_INSTITUTION, http: 422, condition: "Purchase orders require SCHOOL/INSTITUTION account kind" }
  - { id: ERR_PERUSAL_REQUIRES_INSTITUTION, http: 422, condition: "Perusal requests require SCHOOL/INSTITUTION account kind" }
  - { id: ERR_PERUSAL_NOT_ALLOWED, http: 409, condition: "Work.perusal_allowed false, work WITHDRAWN, or publisher SUSPENDED" }
  - { id: ERR_RENEWAL_CAP_REACHED, http: 409, condition: "renewal_count already at cap 2" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "Cancel requires DRAFT or RESERVED" }
  - { id: ERR_NOTHING_TO_DISPUTE, http: 409, condition: "Dispute requires at least one ISSUED damage invoice on the order" }
  - { id: ERR_UNSETTLED_DAMAGE_INVOICES, http: 409, condition: "Settle requires all invoices in PAID/RESOLVED_ACCEPTED/RESOLVED_WAIVED" }
  - { id: ERR_UNRESOLVED_DISPUTES, http: 409, condition: "resolve-dispute with invoices still DISPUTED" }
  - { id: ERR_REASSESSMENT_REQUIRED, http: 409, condition: "Reissue without a superseding FILED condition report" }
  - { id: ERR_PO_HAS_OPEN_ORDERS, http: 409, condition: "PO close/expire blocked by non-terminal rental orders referencing it" }
  - { id: ERR_SET_HAS_OPEN_LOANS, http: 409, condition: "Set retire blocked by open rental lines" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LibraryAdmin
    description: "Library administrator: catalog, sets, accounts, clock/sweep, publisher governance"
    identity: opaque
    exclusive_operations:
      - "POST /library/publishers, PATCH /library/publishers/{id}"
      - "POST /library/works, PATCH /library/works/{id}"
      - "POST /library/rental-sets, PATCH /library/rental-sets/{id}"
      - "POST /library/_clock/set_current_utc, POST /library/_sweep/run_daily"
    shared_operations:
      - "POST /library/customer-accounts (with BillingManager)"
      - "All GET list/detail endpoints"
  - name: LibraryClerk
    description: "Front-desk librarian: reservations, dispatch, renewals, perusals, sales, lost copies"
    identity: opaque
    exclusive_operations:
      - "POST /library/rental-orders/{id}/reserve, /dispatch, /renew, /cancel"
      - "POST /library/rental-lines/{id}/report-lost"
      - "POST /library/perusal-requests/{id}/approve, /reject, /ship, /convert"
    shared_operations:
      - "POST /library/rental-orders (with Customer)"
      - "POST /library/perusal-requests (with Customer)"
      - "POST /library/sale-records (with BillingManager)"
      - "POST /library/rights-advisory-cases (with Customer, RightsAdvisor)"
      - "All GET list/detail endpoints"
  - name: ReturnsClerk
    description: "Returns desk: check-in, condition assessment, perusal returns. NEVER issues/resolves damage invoices for lines it assessed."
    identity: opaque
    exclusive_operations:
      - "POST /library/rental-orders/{id}/check-in"
      - "POST /library/condition-reports"
      - "POST /library/perusal-requests/{id}/record-return"
    shared_operations:
      - "All GET list/detail endpoints"
  - name: BillingManager
    description: "Billing and credit: POs, damage invoices, payments, account standing, credit adjustments"
    identity: opaque
    exclusive_operations:
      - "POST /library/purchase-orders/{id}/approve, /reject, /close"
      - "POST /library/damage-invoices (create), /issue, /record-payment, /resolve, /reissue"
      - "POST /library/rental-orders/{id}/settle, /resolve-dispute, /prepayments"
      - "POST /library/customer-accounts/{id}/credit-adjustments, /bar, /reinstate"
      - "POST /library/sale-records/{id}/record-payment, /write-off"
    shared_operations:
      - "POST /library/purchase-orders (with Customer)"
      - "POST /library/customer-accounts (with LibraryAdmin)"
      - "POST /library/sale-records (with LibraryClerk)"
      - "All GET list/detail endpoints"
  - name: RightsAdvisor
    description: "Performance rights specialist"
    identity: opaque
    exclusive_operations:
      - "POST /library/rights-advisory-cases/{id}/decide"
    shared_operations:
      - "POST /library/rights-advisory-cases (with Customer, LibraryClerk)"
      - "All GET list/detail endpoints"
  - name: Customer
    description: "External account holder (school/institution contact or individual). X-User-ID equals its CustomerAccount.id for ownership checks."
    identity: entity_backed:CustomerAccount
    exclusive_operations:
      - "POST /library/rental-orders/{id}/confirm-receipt, /dispute (own account only)"
      - "POST /library/rights-advisory-cases/{id}/withdraw (own account only)"
    shared_operations:
      - "POST /library/rental-orders (with LibraryClerk)"
      - "POST /library/purchase-orders (with BillingManager)"
      - "POST /library/perusal-requests (with LibraryClerk)"
      - "POST /library/rights-advisory-cases (with LibraryClerk, RightsAdvisor)"
      - "GET endpoints (own-account scoping enforced on sensitive reads)"
