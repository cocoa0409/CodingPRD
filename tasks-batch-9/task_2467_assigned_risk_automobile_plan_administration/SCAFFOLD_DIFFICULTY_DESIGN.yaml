              payload: { cancellation_reason_code: "NON_PAYMENT_OF_PREMIUM", cancellation_effective_date: "2026-12-15T00:00:00Z" }
              as: ProducerAgent
              as_user_id: "${p1_id}"
          assert:
            - "Policy.${pol1_id}.total_annual_charge_cents == 246834 and Policy.${pol2_id}.total_annual_charge_cents == 246834"
            - "Policy.${pol1_id}.cancellation_initiated_by == CARRIER and Policy.${pol1_id}.refund_basis == PRO_RATA"
            - "Policy.${pol1_id}.earned_premium_cents == 61539"
            - "Policy.${pol1_id}.refund_paid_cents == 185295"
            - "Policy.${pol1_id}.premium_credited_cents == 61539 and Policy.${pol1_id}.balance_due_cents == 0"
            - "Policy.${pol2_id}.cancellation_initiated_by == INSURED and Policy.${pol2_id}.refund_basis == SHORT_RATE"
            - "Policy.${pol2_id}.earned_premium_cents == 67693"
            - "Policy.${pol2_id}.refund_paid_cents == 179141"
            - "Policy.${pol1_id}.refund_paid_cents - Policy.${pol2_id}.refund_paid_cents == 6154"
            - "Policy.${pol1_id}.premium_settlement_status == REFUND_ISSUED and Policy.${pol2_id}.premium_settlement_status == REFUND_ISSUED"

      - name: quota_variance_policy_count_versus_car_year_basis_divergence
        grounds:
          - calculations.quota_reconciliation_variance
          - calculations.exposure_car_years
          - calculations.carrier_quota_target_units
          - entities.QuotaReconciliation.fields.variance_units
          - entities.QuotaReconciliation.fields.penalty_cents
          - concurrency_rules[quota-reconciliation-supersede]
        distinguishing_aspect: |
          On the Carrier quota domain (not the Policy money domain of the sibling
          instance) the same carrier and the same period reconcile to variance 0 with
          penalty 0 on the POLICY_COUNT basis and to variance -0.1151 with penalty 2878
          cents on the CAR_YEAR_EXPOSURE basis, because headcount credits the carrier for
          two risks it holds while earned exposure credits it for only the 6 days its one
          issued policy was in force before the period closed.
        test_recipe:
          setup:
            - "Plan period 2026-P3 over 2026-09-01..2026-11-30, moved to RECONCILING at clock 2026-11-30 with total_assignable_units 3 and total_assignable_car_years 0.2630."
            - "Atlas Mutual (5000 bps, licensed T02 only, enrollment_sequence 1) holds quota_target_units 2 and assigned_risk_count 2; Beacon Casualty (5000 bps, licensed T01 only, enrollment_sequence 2) holds target 1 and assigned_risk_count 1."
            - "Atlas issued exactly one policy, effective 2026-11-24 (6 days of exposure inside the window); Beacon issued one policy effective 2026-09-01 (90 days); Atlas's second assignment is ACCEPTED with no policy."
