scaffold_corner_design:

  # =================================================================
  # Entities — creation, required fields, computed/system fields, not-found, defaults, type constraints
  # =================================================================
  - section: entities
    instances:
      - name: create_member_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Member, endpoints]
        distinguishing_aspect: "POST /members/register with required fields returns 201; waiver_status defaults UNSIGNED, training_level NONE, membership_tier NONE, deposit_hold_cents 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /members/register"
              payload: { full_name: "New Rider", email: "new@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { mem_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Member.${mem_id}.waiver_status == UNSIGNED"
            - "Member.${mem_id}.training_level == NONE"
            - "Member.${mem_id}.membership_tier == NONE"
            - "Member.${mem_id}.deposit_hold_cents == 0"
            - "Member.${mem_id}.version == 1"

      - name: create_member_missing_email_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Member.fields.email, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /members/register without email -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /members/register"
              payload: { full_name: "No Email", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_unit_invalid_class_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Unit.fields.unit_class, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /units with unit_class not in {TRAIL,UTILITY,MOUNTAIN} -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /units"
              payload: { vin_tag: "BAD-1", unit_class: "ROCKET", daily_rate_cents: 5000, deposit_cents: 25000, tank_capacity_liters: 30 }
              as: DispatchOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: get_member_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Member, "validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /members/{id} with a non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: DispatchOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: confirm_recomputes_member_deposit_hold_computed_field
        claim_type: Computed Fields
        grounds: [entities.Member.fields.deposit_hold_cents, state_machines.Reservation.PENDING_to_CONFIRMED]
        distinguishing_aspect: "After confirming one reservation (unit deposit 25000), Member.deposit_hold_cents == 25000 (computed from active HELD holds, not client-supplied)."
        test_recipe:
          setup: ["Member NONE waiver SIGNED; Unit TRAIL deposit 25000; departure SCHEDULED."]
          setup_api_calls:
            - call: "POST /trails"
              payload: { name: "CompT", required_class: "TRAIL", max_riders: 10 }
              as: DispatchOperator
              captures: { trail_id: $.data.id }
            - call: "POST /units"
              payload: { vin_tag: "CU-1", unit_class: "TRAIL", daily_rate_cents: 5000, deposit_cents: 25000, tank_capacity_liters: 30 }
              as: DispatchOperator
              captures: { unit_id: $.data.id }
            - call: "POST /tour-departures"
              payload: { trail_id: "${trail_id}", starts_at: "2027-02-01T09:00:00Z", ends_at: "2027-02-01T12:00:00Z", required_guide_class: "TRAIL", capacity_riders: 10 }
              as: DispatchOperator
              captures: { dep_id: $.data.id, dep_ver: $.data.version }
            - call: "POST /members/register"
              payload: { full_name: "Comp Mem", email: "comp@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /reservations"
              payload: { member_id: "${mem_id}", tour_departure_id: "${dep_id}", unit_id: "${unit_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/confirm"
              payload: { expected_tour_departure_version: "${dep_ver}" }
              as: Member
              as_user_id: "${mem_id}"
          assert:
            - "Member.${mem_id}.deposit_hold_cents == 25000"
            - "Reservation.${res_id}.deposit_hold_cents == 25000"

      - name: create_reservation_gear_kind_mismatch_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Reservation.fields.helmet_gear_id, "validations[priority=5.1]", "errors[ERR_GEAR_KIND_MISMATCH]"]
        distinguishing_aspect: "POST /reservations with helmet_gear_id pointing at a SUIT item -> ERR_GEAR_KIND_MISMATCH (422)."
        test_recipe:
          setup: ["Trail, unit, departure; a SUIT gear item exists; reservation request puts the SUIT id in helmet_gear_id."]
          setup_api_calls:
            - call: "POST /trails"
              payload: { name: "MisT", required_class: "TRAIL", max_riders: 10 }
              as: DispatchOperator
              captures: { trail_id: $.data.id }
            - call: "POST /units"
              payload: { vin_tag: "MU-1", unit_class: "TRAIL", daily_rate_cents: 5000, deposit_cents: 25000, tank_capacity_liters: 30 }
              as: DispatchOperator
              captures: { unit_id: $.data.id }
            - call: "POST /gear-items"
              payload: { kind: "SUIT", size_code: "L", replacement_cost_cents: 20000 }
              as: DispatchOperator
              captures: { suit_id: $.data.id }
            - call: "POST /tour-departures"
              payload: { trail_id: "${trail_id}", starts_at: "2027-02-03T09:00:00Z", ends_at: "2027-02-03T12:00:00Z", required_guide_class: "TRAIL", capacity_riders: 10 }
              as: DispatchOperator
              captures: { dep_id: $.data.id }
            - call: "POST /members/register"
              payload: { full_name: "Mis Mem", email: "mis@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { member_id: "${mem_id}", tour_departure_id: "${dep_id}", unit_id: "${unit_id}", helmet_gear_id: "${suit_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "error_id == ERR_GEAR_KIND_MISMATCH"

  # =================================================================
  # State machines — invalid transitions, terminal lockdown, idempotency, initial state, side-effect execution
  # =================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_reservation_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Reservation.PENDING_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A reservation already CANCELLED cannot be cancelled again -> ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["A PENDING reservation cancelled once (now CANCELLED)."]
          setup_api_calls:
            - call: "POST /trails"
              payload: { name: "TermT", required_class: "TRAIL", max_riders: 10 }
              as: DispatchOperator
              captures: { trail_id: $.data.id }
            - call: "POST /units"
              payload: { vin_tag: "TU-1", unit_class: "TRAIL", daily_rate_cents: 5000, deposit_cents: 25000, tank_capacity_liters: 30 }
              as: DispatchOperator
              captures: { unit_id: $.data.id }
            - call: "POST /tour-departures"
              payload: { trail_id: "${trail_id}", starts_at: "2027-02-05T09:00:00Z", ends_at: "2027-02-05T12:00:00Z", required_guide_class: "TRAIL", capacity_riders: 10 }
              as: DispatchOperator
              captures: { dep_id: $.data.id }
            - call: "POST /members/register"
              payload: { full_name: "Term Mem", email: "term@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { mem_id: $.data.id }
            - call: "POST /reservations"
              payload: { member_id: "${mem_id}", tour_departure_id: "${dep_id}", unit_id: "${unit_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
          trigger:
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Reservation.${res_id}.reservation_status == CANCELLED"

      - name: depart_from_scheduled_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.TourDeparture.LOCKED_to_DEPARTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Departing a SCHEDULED (not LOCKED) departure -> ERR_INVALID_STATE (409); depart requires LOCKED."
        test_recipe:
          setup: ["Departure SCHEDULED with one assigned guide and one CONFIRMED reservation but never LOCKED; clock >= starts_at."]
          setup_api_calls:
            - call: "POST /trails"
              payload: { name: "SchT", required_class: "TRAIL", max_riders: 10 }
              as: DispatchOperator
              captures: { trail_id: $.data.id }
            - call: "POST /units"
              payload: { vin_tag: "SU-1", unit_class: "TRAIL", daily_rate_cents: 5000, deposit_cents: 25000, tank_capacity_liters: 30 }
              as: DispatchOperator
              captures: { unit_id: $.data.id }
            - call: "POST /guides"
              payload: { full_name: "Sch Guide", max_class: "TRAIL" }
              as: DispatchOperator
              captures: { guide_id: $.data.id }
            - call: "POST /tour-departures"
              payload: { trail_id: "${trail_id}", starts_at: "2027-02-07T09:00:00Z", ends_at: "2027-02-07T12:00:00Z", required_guide_class: "TRAIL", capacity_riders: 10 }
              as: DispatchOperator
              captures: { dep_id: $.data.id, dep_ver: $.data.version }
            - call: "POST /members/register"
              payload: { full_name: "Sch Mem", email: "sch@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /reservations"
              payload: { member_id: "${mem_id}", tour_departure_id: "${dep_id}", unit_id: "${unit_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: { expected_tour_departure_version: "${dep_ver}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /tour-departures/${dep_id}/assign-guide"
              payload: { guide_id: "${guide_id}" }
              as: DispatchOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-07T09:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /tour-departures/${dep_id}/depart"
              payload: {}
              as: Guide
              as_user_id: "${guide_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "error_id == ERR_INVALID_STATE"
            - "TourDeparture.${dep_id}.status == SCHEDULED"

      - name: complete_terminal_departure_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.TourDeparture.DEPARTED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED departure is terminal; POST complete on it -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Departure SCHEDULED then CANCELLED (terminal)."]
          setup_api_calls:
            - call: "POST /trails"
              payload: { name: "CanT", required_class: "TRAIL", max_riders: 10 }
              as: DispatchOperator
              captures: { trail_id: $.data.id }
            - call: "POST /tour-departures"
              payload: { trail_id: "${trail_id}", starts_at: "2027-02-09T09:00:00Z", ends_at: "2027-02-09T12:00:00Z", required_guide_class: "TRAIL", capacity_riders: 10 }
              as: DispatchOperator
              captures: { dep_id: $.data.id }
            - call: "POST /guides"
              payload: { full_name: "Can Guide", max_class: "TRAIL" }
              as: DispatchOperator
              captures: { guide_id: $.data.id }
            - call: "POST /tour-departures/${dep_id}/cancel"
              payload: {}
              as: DispatchOperator
          trigger:
            - call: "POST /tour-departures/${dep_id}/complete"
              payload: {}
              as: Guide
              as_user_id: "${guide_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "error_id == ERR_INVALID_STATE"
            - "TourDeparture.${dep_id}.status == CANCELLED"

      - name: sign_waiver_underage_without_guardian_ack_returns_invalid_request
        claim_type: Precondition Enforcement
        grounds: [state_machines.Member.UNSIGNED_to_SIGNED, calculations.eligibility_constants, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Signing a waiver for a member under 18 at sign instant without guardian_ack=true -> ERR_INVALID_REQUEST (422); guardian_ack=true would pass."
        test_recipe:
          setup: ["Member born 2012-01-01; clock at default 2026-04-01 -> age 14 < 18; no guardian_ack supplied."]
          setup_api_calls:
            - call: "POST /members/register"
              payload: { full_name: "Kid Mem", email: "kid@x.com", date_of_birth: "2012-01-01" }
              as: Anonymous
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /members/${mem_id}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "error_id == ERR_INVALID_REQUEST"
            - "Member.${mem_id}.waiver_status == UNSIGNED"

      - name: waiver_expires_after_validity_window_on_clock_set
        claim_type: Side Effect Execution
        grounds: [state_machines.Member.SIGNED_to_EXPIRED, calculations.eligibility_constants, entities.Member.fields.waiver_status]
        distinguishing_aspect: "A waiver SIGNED at 2026-04-01 expires (SIGNED->EXPIRED) when expire-waiver runs after clock moves past 365 days (2027-05-01)."
        test_recipe:
          setup: ["Member adult, waiver SIGNED at default clock 2026-04-01; clock then advanced to 2027-05-01."]
          setup_api_calls:
            - call: "POST /members/register"
              payload: { full_name: "Exp W Mem", email: "expw@x.com", date_of_birth: "1980-01-01" }
              as: Anonymous
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /members/${mem_id}/expire-waiver"
              payload: {}
              as: DispatchOperator
          assert:
            - "Member.${mem_id}.waiver_status == EXPIRED"
            - "Member.${mem_id}.waiver_signed_at == null"

      - name: maintenance_unit_then_confirm_blocked_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Unit.AVAILABLE_to_MAINTENANCE, state_machines.Unit.AVAILABLE_to_RESERVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A Unit in MAINTENANCE cannot be reserved; confirming a reservation on it -> ERR_INVALID_STATE (409) because Unit AVAILABLE->RESERVED is undefined from MAINTENANCE."
        test_recipe:
          setup: ["Unit placed in MAINTENANCE; a PENDING reservation references it; departure SCHEDULED; member waiver SIGNED."]
          setup_api_calls:
            - call: "POST /trails"
              payload: { name: "MntT", required_class: "TRAIL", max_riders: 10 }
              as: DispatchOperator
              captures: { trail_id: $.data.id }
            - call: "POST /units"
              payload: { vin_tag: "MNT-1", unit_class: "TRAIL", daily_rate_cents: 5000, deposit_cents: 25000, tank_capacity_liters: 30 }
              as: DispatchOperator
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/maintenance"
              payload: {}
              as: DispatchOperator
            - call: "POST /tour-departures"
              payload: { trail_id: "${trail_id}", starts_at: "2027-02-11T09:00:00Z", ends_at: "2027-02-11T12:00:00Z", required_guide_class: "TRAIL", capacity_riders: 10 }
              as: DispatchOperator
              captures: { dep_id: $.data.id, dep_ver: $.data.version }
            - call: "POST /members/register"
              payload: { full_name: "Mnt Mem", email: "mnt@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /reservations"
              payload: { member_id: "${mem_id}", tour_departure_id: "${dep_id}", unit_id: "${unit_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/confirm"
              payload: { expected_tour_departure_version: "${dep_ver}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Unit.${unit_id}.status == MAINTENANCE"

      - name: complete_departure_releases_guide_back_to_available
        claim_type: Side Effect Execution
        grounds: [state_machines.TourDeparture.DEPARTED_to_COMPLETED, state_machines.Guide.OFF_DUTY_to_AVAILABLE, entities.Guide.fields.status]
        distinguishing_aspect: "Completing a DEPARTED departure (all riders RETURNED) sets its assigned Guide OFF_DUTY->AVAILABLE and guide_count to 0."
        test_recipe:
          setup: ["Departure DEPARTED with one CHECKED_OUT reservation returned, one assigned guide; clock at return time."]
          setup_api_calls:
            - call: "POST /trails"
              payload: { name: "CmpT", required_class: "TRAIL", max_riders: 10 }
              as: DispatchOperator
              captures: { trail_id: $.data.id }
            - call: "POST /units"
              payload: { vin_tag: "CMP-1", unit_class: "TRAIL", daily_rate_cents: 5000, deposit_cents: 25000, tank_capacity_liters: 30 }
              as: DispatchOperator
              captures: { unit_id: $.data.id }
            - call: "POST /guides"
              payload: { full_name: "Cmp Guide", max_class: "TRAIL" }
              as: DispatchOperator
              captures: { guide_id: $.data.id }
            - call: "POST /tour-departures"
              payload: { trail_id: "${trail_id}", starts_at: "2027-02-13T09:00:00Z", ends_at: "2027-02-13T12:00:00Z", required_guide_class: "TRAIL", capacity_riders: 10 }
              as: DispatchOperator
              captures: { dep_id: $.data.id, dep_ver: $.data.version }
            - call: "POST /members/register"
              payload: { full_name: "Cmp Mem", email: "cmp@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /reservations"
              payload: { member_id: "${mem_id}", tour_departure_id: "${dep_id}", unit_id: "${unit_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: { expected_tour_departure_version: "${dep_ver}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /tour-departures/${dep_id}/assign-guide"
              payload: { guide_id: "${guide_id}" }
              as: DispatchOperator
            - call: "POST /tour-departures/${dep_id}/lock"
              payload: {}
              as: DispatchOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-13T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /tour-departures/${dep_id}/depart"
              payload: {}
              as: Guide
              as_user_id: "${guide_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-13T11:30:00Z" }
              as: PlatformAdmin
            - call: "POST /reservations/${res_id}/return"
              payload: { fuel_return_fraction: 1.0 }
              as: DispatchOperator
          trigger:
            - call: "POST /tour-departures/${dep_id}/complete"
              payload: {}
              as: Guide
              as_user_id: "${guide_id}"
          assert:
            - "TourDeparture.${dep_id}.status == COMPLETED"
            - "TourDeparture.${dep_id}.guide_count == 0"
            - "Guide.${guide_id}.status == AVAILABLE"

      - name: trail_close_with_no_departures_count_zero
        claim_type: Side Effect Execution
        grounds: [state_machines.Trail.OPEN_to_CLOSED, entities.ClosureEvent.fields.cancelled_departure_count]
        distinguishing_aspect: "Closing a trail with no SCHEDULED/LOCKED departures creates a ClosureEvent with cancelled_departure_count == 0."
        test_recipe:
          setup: ["Trail OPEN, no departures."]
          setup_api_calls:
            - call: "POST /trails"
              payload: { name: "EmptyT", required_class: "TRAIL", max_riders: 10 }
              as: DispatchOperator
              captures: { trail_id: $.data.id }
          trigger:
            - call: "POST /trails/${trail_id}/closure"
              payload: { new_condition: "CLOSED", reason: "preemptive" }
              as: DispatchOperator
              captures: { cnt: $.data.cancelled_departure_count }
          assert:
            - "response.status == 201"
            - "ClosureEvent.cancelled_departure_count == 0"
            - "Trail.${trail_id}.condition == CLOSED"

  # =================================================================
  # Calculations — boundary/edge claims not in §1.8, constants applied, precision
  # =================================================================
  - section: calculations
    instances:
      - name: fuel_charge_at_ok_fraction_boundary_zero
        claim_type: Correct Result
        grounds: [calculations.fuel_charge, entities.Settlement.fields.fuel_charge_cents]
        distinguishing_aspect: "fuel_return_fraction exactly 0.95 (== FUEL_OK_FRACTION) yields fuel_charge_cents 0 (>= threshold is inclusive-free); a different metric/boundary from §1.8's late-fee grace."
        test_recipe:
          setup: ["Reservation CHECKED_OUT, returned on time, fuel exactly 0.95 on a 40L tank."]
          setup_api_calls:
            - call: "POST /trails"
