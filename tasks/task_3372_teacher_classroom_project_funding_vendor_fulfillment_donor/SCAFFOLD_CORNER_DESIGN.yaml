          - errors.ERR_TEACHER_SUSPENDED
        distinguishing_aspect: "After a CONFIRMED fraud case suspends the teacher (and cancels their pipeline), any new teacher-initiated write fails with ERR_TEACHER_SUSPENDED — distinct from the PENDING_VERIFICATION error and from the now-satisfied pipeline gate."
        test_recipe:
