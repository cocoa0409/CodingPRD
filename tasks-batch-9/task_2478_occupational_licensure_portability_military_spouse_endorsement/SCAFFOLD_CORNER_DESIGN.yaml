        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / equivalency_variant_divergence_strict_vs_universal
          rationale: "Both variants and the 20.00 delta are asserted there from one shared credential; the risk-index pair is covered by the sibling §1.8 instance risk_index_reported_vs_effective_variant_divergence."

      - name: rate_threshold_trigger_at_deficiency_cycle_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: non_linear_state_machine / deficiency_cycle_cap_third_deficiency_denies_instead_of_looping
          rationale: "The cumulative-threshold boundary is asserted there at the exact cycle where branch A becomes branch B."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: submit_response_reflects_all_derived_fields_in_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_licensure_applications_id_submit
          - calculations.net_fee_due_cents
          - calculations.application_fee_balance
        distinguishing_aspect: "Consistency is immediate: the submit response body itself already carries gross_total_cents 48000, statutory_waiver_pct 0.00, fee_balance_cents 48000, review_deadline_at 2026-10-30 and version 2, and an immediately following GET returns byte-identical values with no lag."
        test_recipe:
          setup:
            - "Profession RN; non-military TX applicant with a verified ACTIVE credential."
            - "One DRAFT ENDORSEMENT application at version 1 with all derived fee fields at 0."
          setup_api_calls:
            - call: "POST /licensure/professions"
              payload: { profession_code: "RN", title: "Registered Nurse", required_scope_elements: ["ASSESS", "TREAT", "PRESCRIBE", "SUPERVISE"], critical_scope_elements: ["PRESCRIBE"], required_practice_hours: 2000, requirement_hours_total: 240.0, exam_waiver_min_score: 70.00, jurisprudence_exam_required: true, universal_recognition_min_residency_months: 12, standard_processing_days: 90, base_fee_cents: 25000, endorsement_fee_cents: 10000, exam_fee_cents: 8000, jurisprudence_fee_cents: 5000, permit_fee_cents: 6000, expedite_surcharge_pct: 0.15 }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { prof: $.data.id }
            - call: "POST /licensure/applicants"
              payload: { full_name: "Aurel Vasquez", state_code: "TX", residency_months: 24, military_status: "NONE" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { ap: $.data.id }
            - call: "POST /licensure/applicants/${ap}/out-of-state-credentials"
              payload: { issuing_state: "OK", license_number: "OK-19001", scope_elements: ["ASSESS", "TREAT", "SUPERVISE"], practice_hours: 1200, status: "ACTIVE", verified_good_standing: true, issued_at: "2020-05-01T00:00:00Z" }
              as: Applicant
              as_user_id: "${ap}"
              captures: { cred: $.data.id }
            - call: "POST /licensure/applications"
              payload: { applicant_id: "${ap}", profession_id: "${prof}", primary_credential_id: "${cred}", pathway: "ENDORSEMENT", expedited: false }
              as: Applicant
              as_user_id: "${ap}"
              captures: { app: $.data.id }
          trigger:
            - call: "POST /licensure/applications/${app}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${ap}"
            - call: "GET /licensure/applications/${app}"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "anl_1"
            - call: "GET /licensure/applications/${app}/fee-ledger-entries"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "anl_1"
          assert:
            - "The submit response body carries status SUBMITTED, submitted_at 2026-08-01T00:00:00Z, review_deadline_at 2026-10-30T00:00:00Z, gross_total_cents 48000, statutory_waiver_pct 0.00, fee_balance_cents 48000 and version 2"
            - "The GET returns exactly those same seven values"
            - "The ledger GET returns total_count == 2 with ASSESSMENT +48000 and WAIVER_CREDIT 0, both already visible"
            - "LicenseApplication.${app}.processing_elapsed_days == 0 and processing_standard_met is null"
