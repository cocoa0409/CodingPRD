    side_effects: []
  - method: GET
    path: "/econsult/specialty-tracks/{id}"
    description: "Get a specialty track"
    roles: [ProgramCoordinator, ReferringProvider, Specialist, QualityReviewer, BillingClerk]
    code: 200
    input: []
    output: SpecialtyTrack
    side_effects: []

  # --- Referring providers ---
  - method: POST
    path: "/econsult/referring-providers"
