            payload: { credit_rating_tier: 3 }
            as: CreditOfficer
          assert:
            - "all of the credit officer's calls succeed against BOTH member banks, confirming its scope is global rather than entity-backed"
            - "Cascade Mutual now reports credit_rating_tier 3, community_lending_eligible true and delivery_required false"
            - "GET /fhlb/member-banks/{member_a} and GET /fhlb/member-banks/{member_b} both succeed for the same credit officer"

