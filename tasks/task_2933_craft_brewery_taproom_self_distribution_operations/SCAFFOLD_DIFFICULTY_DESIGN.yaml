            - call: "POST /beers/${beer_id}/filings/LABEL/decision"
              payload: { decision: "APPROVED", cola_id: "COLA-24-0917" }
              as: StateRegulator
            - call: "POST /beers/${beer_id}/filings/LABEL/decision"
              payload: { decision: "REVOKED", note: "net contents statement does not match the fill" }
              as: StateRegulator
            - call: "POST /state-licenses"
              payload: { state_code: "ID", license_type: "SELF_DISTRIBUTION", annual_barrel_cap: 1000.00, franchise_state: false, effective_from_utc: "2026-01-01T00:00:00Z", expires_at_utc: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
          trigger:
