          assert:
            - "visit 2 at exactly 30 days after visit 1 (2026-11-02 -> 2026-12-02) succeeds (201)"
            - "visit 3 at 15 days after visit 2 fails 409 with error_id == ERR_VISIT_TOO_SOON (even though it is 45 days after visit 1)"
            - "GET /awards/${award_id}/compliance-visits returns exactly 2 rows"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: slot_conservation_across_fill_vacate_refill_retire
        grounds:
          - state_machines.PositionSlot.OPEN_to_RESERVED
          - state_machines.PositionSlot.FILLED_to_VACATED
          - state_machines.PositionSlot.VACATED_to_OPEN
          - state_machines.PositionSlot.VACATED_to_RETIRED
          - entities.GrantAward.fields.awarded_slot_count
        distinguishing_aspect: "Conserved quantity: slot positions — at every step count(status in {OPEN,RESERVED,FILLED}) + count(RETIRED) == awarded_slot_count == 2, across enroll (reserve+fill), exit (vacate), refill (reopen), and retirement; the pair enroll/exit never creates or destroys a slot."
        test_recipe:
          setup:
            - "Award with 2 FULL_TIME slots (federal 4600000 == 2 x cap, CASH match 1104000 exactly 24%). Members A, B, C all cleared."
          setup_api_calls:
            - *d_clock0
            - *d_org
            - *d_comp
            - call: "POST /competitions/${comp_id}/applications"
              payload: { organization_id: "${org_id}", federal_share_requested_cents: 4600000, slot_requests: [{ term_category: "FULL_TIME", count: 2 }], match_lines: [{ category: "CASH", amount_cents: 1104000 }] }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { app_id: $.data.id }
            - *d_submit
            - *d_clock_close
            - *d_close
            - call: "POST /applications/${app_id}/award"
              payload: { federal_share_awarded_cents: 4600000 }
              as: CNCSProgramOfficer
              captures: { award_id: $.data.id, award_v1: $.data.version }
            - *d_member_a
            - *d_check_a
            - *d_clr_a1
            - *d_clr_a2
            - *d_clr_a3
            - *d_member_b
            - *d_check_b
            - *d_clr_b1
            - *d_clr_b2
            - *d_clr_b3
            - &d_member_c
              call: "POST /members/register"
              payload: { full_name: "Casey Jo", date_of_birth: "2001-03-03", citizenship_status: "LAWFUL_PERMANENT_RESIDENT" }
              as: Anonymous
              captures: { m_c: $.data.id }
            - &d_check_c
              call: "POST /members/${m_c}/criminal-history-checks"
              payload: {}
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { chk_c: $.data.id }
            - &d_clr_c1
              call: "POST /criminal-history-checks/${chk_c}/component-results"
              payload: { component: "NSOPR", result: "CLEAR" }
              as: CNCSProgramOfficer
            - &d_clr_c2
              call: "POST /criminal-history-checks/${chk_c}/component-results"
              payload: { component: "STATE_REPOSITORY", result: "CLEAR" }
              as: CNCSProgramOfficer
            - &d_clr_c3
              call: "POST /criminal-history-checks/${chk_c}/component-results"
              payload: { component: "FBI_FINGERPRINT", result: "CLEAR" }
              as: CNCSProgramOfficer
          trigger:
            - call: "POST /awards/${award_id}/enrollments"
              payload: { member_id: "${m_a}", term_category: "FULL_TIME", service_start_date: "2026-10-15", service_end_date: "2027-08-15", expected_award_version: "${award_v1}" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { enr_a: $.data.id, slot_a: $.data.slot_id }
            - call: "GET /awards/${award_id}"
              payload: {}
              as: CNCSProgramOfficer
              captures: { award_v2: $.data.version }
            - call: "POST /awards/${award_id}/enrollments"
              payload: { member_id: "${m_b}", term_category: "FULL_TIME", service_start_date: "2026-10-15", service_end_date: "2027-08-15", expected_award_version: "${award_v2}" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { enr_b: $.data.id }
            - call: "POST /enrollments/${enr_a}/hour-entries"
              payload: { service_date: "2026-10-16", minutes: 15300, activity_code: "DIRECT_SERVICE" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { ent_a1: $.data.id }
            - call: "POST /hour-entries/${ent_a1}/certify"
              payload: {}
              as: GranteeStaff
              as_user_id: "${org_id}"
            - call: "POST /enrollments/${enr_a}/exit"
              payload: { exit_reason: "COMPELLING_CIRCUMSTANCE" }
              as: GranteeStaff
              as_user_id: "${org_id}"
            - call: "GET /awards/${award_id}"
              payload: {}
              as: CNCSProgramOfficer
              captures: { award_v3: $.data.version }
            - call: "POST /awards/${award_id}/enrollments"
              payload: { member_id: "${m_c}", term_category: "FULL_TIME", service_start_date: "2026-11-01", service_end_date: "2027-09-01", expected_award_version: "${award_v3}" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { enr_c: $.data.id, slot_c: $.data.slot_id }
            - call: "POST /enrollments/${enr_c}/exit"
              payload: { exit_reason: "FOR_CAUSE" }
              as: GranteeStaff
              as_user_id: "${org_id}"
            - call: "GET /awards/${award_id}/slots"
              payload: {}
              as: CNCSProgramOfficer
          assert:
            - "after two enrollments: slots FILLED == 2, OPEN == 0, RETIRED == 0 (2 + 0 == awarded_slot_count)"
            - "after member A's COMPELLING exit: slot ${slot_a} OPEN with fill_count == 1; FILLED == 1, OPEN == 1, RETIRED == 0"
            - "the refill selector assigns member C to ${slot_a} (lowest slot_index among OPEN): MemberEnrollment.${enr_c}.slot_id == ${slot_a}"
            - "after member C's FOR_CAUSE exit: ${slot_a} is RETIRED (fill_count == 2); final counts FILLED == 1 (member B), RETIRED == 1, OPEN == 0 — 1 + 0 + 1 == awarded_slot_count == 2"
            - "Member.${m_c}.status == DEBARRED and no EducationAward exists for ${enr_c}"

      - name: education_award_trust_ledger_approve_rescind
        grounds:
          - state_machines.EducationAwardUse.PENDING_APPROVAL_to_APPROVED
          - state_machines.EducationAwardUse.APPROVED_to_RESCINDED
          - entities.EducationAward.fields.remaining_balance_cents
        distinguishing_aspect: "Conserved quantity: trust dollars — remaining_balance_cents + sum(APPROVED use amounts) == issued_amount_cents (261000) after every approve and every compensating rescind; a rescind restores the exact debit with zero drift."
        test_recipe:
          setup:
            - "Member A exited COMPELLING_CIRCUMSTANCE at 36000/102000 minutes: EducationAward issued 261000 cents, deadline 2033-10-02T00:00:00Z, version 1."
          setup_api_calls:
            - *d_clock0
            - *d_org
            - *d_comp
            - *d_app_2ft_4m
            - *d_submit
            - *d_clock_close
            - *d_close
            - *d_award_4m
            - *d_member_a
            - *d_check_a
            - *d_clr_a1
            - *d_clr_a2
            - *d_clr_a3
            - *d_enroll_a
            - call: "POST /enrollments/${enr_a}/hour-entries"
              payload: { service_date: "2026-10-16", minutes: 36000, activity_code: "DIRECT_SERVICE" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { ent_a1: $.data.id }
            - call: "POST /hour-entries/${ent_a1}/certify"
              payload: {}
              as: GranteeStaff
              as_user_id: "${org_id}"
            - call: "POST /enrollments/${enr_a}/exit"
              payload: { exit_reason: "COMPELLING_CIRCUMSTANCE" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { edu_a: $.data.education_award_id }
            - call: "GET /education-awards/${edu_a}"
              payload: {}
              as: TrustAdministrator
              captures: { edu_v1: $.data.version }
          trigger:
            - call: "POST /education-awards/${edu_a}/uses"
              payload: { use_type: "TUITION", amount_cents: 100000, institution_title_iv: true, expected_education_award_version: "${edu_v1}" }
              as: Member
              as_user_id: "${m_a}"
              captures: { use_1: $.data.id }
            - call: "GET /education-awards/${edu_a}"
              payload: {}
              as: TrustAdministrator
              captures: { edu_v2: $.data.version }
            - call: "POST /education-award-uses/${use_1}/decide"
              payload: { decision: "APPROVE" }
              as: TrustAdministrator
            - call: "POST /education-awards/${edu_a}/uses"
              payload: { use_type: "QUALIFIED_LOAN", amount_cents: 50000, expected_education_award_version: "${edu_v2} + 1" }
              as: Member
              as_user_id: "${m_a}"
              captures: { use_2: $.data.id }
            - call: "POST /education-award-uses/${use_2}/decide"
              payload: { decision: "APPROVE" }
              as: TrustAdministrator
            - call: "POST /education-award-uses/${use_1}/rescind"
              payload: { reason: "Duplicate disbursement" }
              as: TrustAdministrator
            - call: "GET /education-awards/${edu_a}"
              payload: {}
              as: TrustAdministrator
          assert:
            - "after use_1 APPROVE: remaining_balance_cents == 161000 and status == PARTIALLY_USED"
            - "after use_2 APPROVE: remaining_balance_cents == 111000"
            - "after use_1 RESCIND: remaining_balance_cents == 211000 and status == PARTIALLY_USED (not ISSUED — use_2 still approved)"
            - "invariant: 211000 + 50000 (sum of APPROVED uses) == 261000 == issued_amount_cents"
            - "EducationAwardUse.${use_1}.status == RESCINDED and EducationAwardUse.${use_2}.status == APPROVED"

