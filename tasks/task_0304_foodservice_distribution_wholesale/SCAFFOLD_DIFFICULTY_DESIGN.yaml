            - call: "POST /price-tiers"
              payload: { product_id: "${prod}", min_cases: 1, case_price_cents: 2400 }
              as: DistributorAdmin
            - call: "POST /customers"
              payload: { distributor_id: "${dist}", route_id: "${route}", name: "Diner A", credit_limit_cents: 100000, split_fee_cents: 0 }
              as: SalesRep
              captures: { cust: $.data.id, cust_v: $.data.version }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", requested_delivery_date: "2026-06-17T00:00:00Z" }
