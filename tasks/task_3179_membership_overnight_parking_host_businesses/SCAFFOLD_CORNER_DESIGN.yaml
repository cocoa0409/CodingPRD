        test_recipe:
          setup: ["Logical clock at the 2026-09-01T00:00:00Z default"]
          setup_api_calls:
            - call: "POST /api/hosts"
              payload: { legal_name: "Fresh Farm", category: "FARM", address_line1: "31 Fresh Rd", state_code: "TX" }
