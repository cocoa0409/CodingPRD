      - name: partial_refund_uses_floor_truncation
        claim_type: precision
        grounds: [calculations.refund_amount_cents, entities.Enrollment.fields.refund_cents, constants.REFUND_PARTIAL_RATE]
        distinguishing_aspect: "The PARTIAL_HALF tier floors rather than rounds, so a 3333-cent enrollment cancelled in the half band refunds exactly 1666 rather than 1667."
        test_recipe:
          setup:
            - "Teacher ada is ACTIVE; a PUBLISHED ONE_TIME listing priced 3333 has one OPEN section starting 2026-11-05T14:00:00Z"
            - "Learner ln_1 holds a RESERVED enrollment at discounted_price_cents 3333"
            - "The logical clock reads 2026-11-01T10:00:00Z, exactly 100 hours before the section start"
          setup_api_calls:
