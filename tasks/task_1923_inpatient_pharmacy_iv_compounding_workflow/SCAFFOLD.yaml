    description: "Fetch one intervention"
    roles: [PharmacyAdmin, Prescriber, Pharmacist, PharmacyTechnician, Nurse, DiversionOfficer]
    code: 200
    input: []
    output: ClinicalIntervention
    side_effects: []
  - method: GET
    path: /pharmacy/interventions
    description: "List interventions"
    roles: [PharmacyAdmin, Prescriber, Pharmacist, PharmacyTechnician, Nurse, DiversionOfficer]
    code: 200
    input: ["pharmacist_staff_id?", "limit?", "offset?"]
    output: ClinicalIntervention[]
    side_effects: []
  - method: POST
    path: /pharmacy/medication-orders/{id}/substitute
    description: "Apply an ACTIVE substitution protocol to a flagged order"
    roles: [Pharmacist]
    code: 200
    input: [protocol_id, "expected_order_version?"]
    output: MedicationOrder
    side_effects: ["substitution_equivalent_dose", "renal_dose_adjustment for new drug", "substitution_pending := false", "increments MedicationOrder.version by 1"]

  # --- hood sessions & coverage ---
