            - "Keg.${k1_id}.custody_state == ISSUED_TO_BREWER (STOLEN_SUSPECTED has no custody transition) and KegPool.${p1_id}.kegs_written_off == 0"

  # ==========================================================================
  # RULE 7 — cross_entity_state_dependency
  # Instance (i)  entity pair: IssuanceOrder  <- KegPool.posture
  # Instance (ii) entity pair: ScanEvent/Keg  <- FloatAgreement.float_posture
  #                            (itself driven by Brewer.status)
  # Disjoint entity pairs, disjoint gating dimensions.
  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_allocate_blocked_by_frozen_pool_state
        grounds:
          - validations.priority_13_ERR_POOL_FROZEN
          - calculations.pool_posture
          - entities.KegPool.fields.posture
          - state_machines.IssuanceOrder.REQUESTED_to_ALLOCATED
          - errors.ERR_POOL_FROZEN
        distinguishing_aspect: |
          Dependency pair: the IssuanceOrder transition REQUESTED -> ALLOCATED depends on a
          state that lives on KegPool, an entity the request never names. Both orders were
          created while the pool was OPEN, so nothing about io2 itself is wrong; draining the
          last keg through io1 is what makes io2's allocate illegal. The refusal must be
          ERR_POOL_FROZEN (13) rather than ERR_FLOAT_SUSPENDED (15) or ERR_NO_ELIGIBLE_KEGS
          (45), both of which are also true at that moment, and the brewer must still read
          ACTIVE — proving the block is pool-derived.
        test_recipe:
          setup:
            - "Clock parked at 2026-08-01T23:00:00Z."
            - "Pool with exactly four kegs, freeze_threshold_pct 10, so draining all four puts available_pct at 0.00 and the posture at FROZEN."
            - "Agreement float_size_kegs 10 so validation 43 never fires (4 + 0 and 1 + 0 are both under the cap)."
            - "BOTH orders are created BEFORE any allocation, while the pool is still OPEN at 100.00: io1 for four kegs, io2 for one."
            - "A fresh GET /float-agreements read is taken after io1's allocate because that allocate bumps the agreement version; otherwise priority 9 would mask the pool gate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /commodity-index"
