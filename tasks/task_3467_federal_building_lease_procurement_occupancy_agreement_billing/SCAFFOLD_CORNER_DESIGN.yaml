      - name: plan_execute_succeeding_lease_creates_successor
        claim_type: conditional_action
        grounds: ["state_machines.ExpirationPlan.OPTION_SELECTED_to_EXECUTED", "entities.Lease.fields.succeeds_lease_id"]
        distinguishing_aspect: "Executing a SUCCEEDING_LEASE plan on an EXPIRING lease creates the successor Lease (AWARDED, succeeds_lease_id == old lease) and sets executed_option; the subsequent end-of-term sweep lands the old lease in SUCCEEDED (not EXPIRED)."
        test_recipe:
          setup: ["lease COMMENCED then EXPIRING (clock 2035-07-01); plan OPTION_SELECTED with SUCCEEDING_LEASE"]
