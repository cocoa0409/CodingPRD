          trigger:
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "IW" }, as: SpdTechnician, as_user_id: "${ta}", captures: { iw: "$.data.id", s0: "$.data.status" } }
            - { call: "POST /spd/trays/${iw}/decontamination/start", as: SpdTechnician, as_user_id: "${ta}", captures: { s1: "$.data.status" } }
            - { call: "GET /spd/trays/${iw}", as: Any, captures: { s2: "$.data.status" } }
            - { call: "GET /spd/trays?status=IN_DECONTAMINATION", as: Any }
          assert:
            - "s0 == AWAITING_DECONTAMINATION (create response reflects initial state)"
            - "s1 == IN_DECONTAMINATION (transition response reflects the mutation)"
            - "s2 == IN_DECONTAMINATION and the status-filtered list already contains the tray (total_count == 1)"
