          - state_machines.FeeArrangement
          - state_machines.Matter
          - entities.Matter.fields.fee_arrangement_id
        distinguishing_aspect: |
          Cascade chain of depth 3 originating from FeeArrangement activation
          with supersedes_arrangement_id set: (1) new arrangement transitions
          PENDING_APPROVAL→ACTIVE, which (2) transitions prior arrangement
          ACTIVE→SUPERSEDED (cross-entity), which (3) updates
          Matter.fee_arrangement_id to point to the successor. Each link is
