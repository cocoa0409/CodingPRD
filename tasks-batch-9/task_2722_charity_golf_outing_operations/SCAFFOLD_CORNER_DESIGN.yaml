      - name: waitlist_promotion_filters_by_freed_slots_before_ranking_by_tier_price
        claim_type: Input Set Filtering
        grounds:
          - calculations.waitlist_promotion
          - state_machines[Registration][WAITLISTED -> CONFIRMED]
        distinguishing_aspect: "The eligibility filter runs BEFORE the ranking, so the most expensive waitlisted package loses: a four-player 400000 package cannot fit the two slots a cancelled twosome freed and is filtered out entirely, and the winner is then the higher-priced of the two twosomes - and exactly ONE registration is promoted even though both remaining candidates would fit."
        test_recipe:
          setup:
            - "An OPEN outing with field_capacity_teams 2, i.e. 8 player slots, and three tiers: TEAM4 at 400000 for 4 slots, PAIR_A at 100000 for 2 slots and PAIR_B at 200000 for 2 slots."
            - "Confirmed: Alpha on TEAM4 (4 slots), Bravo on PAIR_A (2) and Foxtrot on PAIR_A (2) - the field is exactly full at 8."
            - "Waitlisted in creation order: Charlie on TEAM4, Delta on PAIR_A, Echo on PAIR_B."
            - "The clock is 2026-08-01 and the outing is played 2026-09-19 with the default 30-day notice, so the cancellation is not late and no fee is retained."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TournamentDirector
            - call: "POST /outing-ops/outings"
              payload: { name: "Waitlist Open", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 2, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { o_id: $.data.id }
            - call: "POST /outing-ops/contracts"
              payload: { outing_id: "${o_id}", course_name: "Cedar Ridge GC", rate_per_player_cents: 9500, guaranteed_player_count: 0 }
              as: CourseOperations
              captures: { c_id: $.data.id }
            - call: "POST /outing-ops/contracts/${c_id}/lifecycle"
              payload: { action: "SIGN" }
              as: CourseOperations
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "TEAM4", kind: "TEAM", price_cents: 400000, player_slots: 4, gsv_cents: 24000, inventory_cap: 10 }
              as: TournamentDirector
              captures: { t4_id: $.data.id }
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "PAIR_A", kind: "TEAM", price_cents: 100000, player_slots: 2, gsv_cents: 12000, inventory_cap: 10 }
              as: TournamentDirector
              captures: { ta_id: $.data.id }
            - call: "POST /outing-ops/package-tiers"
              payload: { outing_id: "${o_id}", code: "PAIR_B", kind: "TEAM", price_cents: 200000, player_slots: 2, gsv_cents: 12000, inventory_cap: 10 }
              as: TournamentDirector
              captures: { tb_id: $.data.id }
            - call: "POST /outing-ops/outings/${o_id}/play-transition"
              payload: { action: "OPEN_REGISTRATION" }
              as: TournamentDirector
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${t4_id}", buyer_name: "Alpha", player_count: 4 }
              as: TournamentDirector
              captures: { ra_id: $.data.id }
            - call: "POST /outing-ops/registrations/${ra_id}/payment"
              payload: { amount_cents: 400000 }
              as: CharityTreasurer
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${ta_id}", buyer_name: "Bravo", player_count: 2 }
              as: TournamentDirector
              captures: { rb_id: $.data.id }
            - call: "POST /outing-ops/registrations/${rb_id}/payment"
              payload: { amount_cents: 100000 }
              as: CharityTreasurer
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${ta_id}", buyer_name: "Foxtrot", player_count: 2 }
              as: TournamentDirector
              captures: { rf_id: $.data.id }
            - call: "POST /outing-ops/registrations/${rf_id}/payment"
              payload: { amount_cents: 100000 }
              as: CharityTreasurer
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${t4_id}", buyer_name: "Charlie", player_count: 4 }
              as: TournamentDirector
              captures: { rc_id: $.data.id }
            - call: "POST /outing-ops/registrations/${rc_id}/payment"
              payload: { amount_cents: 400000 }
              as: CharityTreasurer
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${ta_id}", buyer_name: "Delta", player_count: 2 }
              as: TournamentDirector
              captures: { rd_id: $.data.id }
            - call: "POST /outing-ops/registrations/${rd_id}/payment"
              payload: { amount_cents: 100000 }
              as: CharityTreasurer
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${tb_id}", buyer_name: "Echo", player_count: 2 }
              as: TournamentDirector
