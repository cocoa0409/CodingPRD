            - call: "POST /rental-orders"
              payload: { account_id: "${acct}", container_type_id: "${ct}", site_address: "32 Main", requested_delivery_date: "2026-06-01" }
              as: Contractor
              as_user_id: "${acct}"
              captures: { ord1: $.data.id }
            - call: "GET /service-stops?order_id=${ord1}&stop_type=DELIVERY"
              payload: {}
              as: Dispatcher
              captures: { stop1: "$.data[0].id" }
            - call: "POST /rental-orders"
              payload: { account_id: "${acct}", container_type_id: "${ct}", site_address: "33 Main", requested_delivery_date: "2026-06-01" }
              as: Contractor
              as_user_id: "${acct}"
              captures: { ord2: $.data.id }
            - call: "GET /service-stops?order_id=${ord2}&stop_type=DELIVERY"
              payload: {}
              as: Dispatcher
              captures: { stop2: "$.data[0].id" }
            - call: "POST /routes"
              payload: { service_date: "2026-06-01", truck_code: "TRKo", capacity_stops: 5 }
              as: Dispatcher
              captures: { r1: $.data.id, r1_v0: $.data.version }
            - call: "POST /routes/${r1}/stops"
              payload: { service_stop_id: "${stop1}", expected_route_version: "${r1_v0}" }
              as: Dispatcher
          trigger:
            - call: "POST /routes/${r1}/stops"
              payload: { service_stop_id: "${stop2}", expected_route_version: "${r1_v0}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 412"
            - "trigger response data.error_id == ERR_STALE_ROUTE_VERSION"
            - "ServiceStop.${stop2}.status == UNASSIGNED"

      - name: version_increments_on_container_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.Container.fields.version
          - state_machines.Container.IN_YARD_to_OUT_OF_SERVICE
        distinguishing_aspect: "Each container mutation bumps version by exactly 1: create -> 1, retire -> 2, restore -> 3."
        test_recipe:
          setup: ["one container type"]
          setup_api_calls:
            - call: "POST /container-types"
              payload: { size_code: "YD30", base_rate_cents: 50000, included_days: 7, overage_day_cents: 1500, included_tonnage_lbs: 4000, overage_rate_cents_per_lb: 9 }
              as: YardAdmin
              captures: { ct: $.data.id }
            - call: "POST /containers"
              payload: { container_type_id: "${ct}", asset_tag: "T-VR", yard_code: "Y1" }
              as: YardAdmin
              captures: { cont: $.data.id, v0: $.data.version }
            - call: "POST /containers/${cont}/retire-asset"
              payload: {}
              as: YardAdmin
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /containers/${cont}/restore-asset"
              payload: {}
              as: YardAdmin
              captures: { v2: $.data.version }
          assert:
            - "Container.${cont}.version == 3"
            - "Container.${cont}.status == IN_YARD"

      - name: cascade_pickup_finalize_chain
        claim_type: cascading_side_effects
        grounds:
          - state_machines.RentalOrder.ESTIMATED_to_FINALIZED
        excluded_because:
          difficulty_instance: transitive_cascade / pickup_complete_finalize_invoice_account_depth3
          rationale: "The PICKUP-complete -> finalize -> invoice -> account cascade is the named §1.8 transitive_cascade instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: dispatch_response_reflects_scheduled_immediately
        claim_type: immediate
        grounds:
          - state_machines.RentalOrder.BOOKED_to_SCHEDULED
          - entities.RentalOrder.fields.container_id
        distinguishing_aspect: "The dispatch-delivery response body immediately shows logistics_status SCHEDULED and the committed container_id in the same request (immediate consistency)."
        test_recipe:
          setup: ["BOOKED order with an IN_YARD container"]
          setup_api_calls:
            - call: "POST /container-types"
              payload: { size_code: "YD30", base_rate_cents: 50000, included_days: 7, overage_day_cents: 1500, included_tonnage_lbs: 4000, overage_rate_cents_per_lb: 9 }
              as: YardAdmin
              captures: { ct: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Imm2", credit_limit_cents: 500000 }
              as: YardAdmin
              captures: { acct: $.data.id }
            - call: "POST /containers"
              payload: { container_type_id: "${ct}", asset_tag: "T-IC", yard_code: "Y1" }
              as: YardAdmin
              captures: { cont: $.data.id, cont_v: $.data.version }
            - call: "POST /rental-orders"
              payload: { account_id: "${acct}", container_type_id: "${ct}", site_address: "34 Main", requested_delivery_date: "2026-06-01" }
              as: Contractor
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /rental-orders/${ord}/dispatch-delivery"
              payload: { container_id: "${cont}", expected_container_version: "${cont_v}" }
              as: Dispatcher
              captures: { ls: $.data.logistics_status, cid: $.data.container_id }
          assert:
            - "trigger response data.logistics_status == SCHEDULED"
            - "trigger response data.container_id == ${cont}"
