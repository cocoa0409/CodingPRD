              as: SystemAdmin
              captures: { seg_speed: $.data.effective_speed_mph, seg_status: $.data.status, seg_defect: $.data.defect_open }
          assert:
            - "captured seg_speed == 25 (min(60, DEFECT_CAP_MPH[MONITOR]))"
            - "captured seg_status == IN_SERVICE"
            - "captured seg_defect == true"

