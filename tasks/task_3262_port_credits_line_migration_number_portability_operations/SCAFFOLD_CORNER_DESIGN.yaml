              payload: {}
              as: PlatformAdmin
            - call: "POST /portability/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /portability/subscriber-lines/${line}"
              as: PlatformAdmin
              captures: { observed_v: $.data.version }
