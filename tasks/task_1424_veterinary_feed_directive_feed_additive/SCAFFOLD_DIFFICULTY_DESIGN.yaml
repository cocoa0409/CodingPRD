              captures: { case_id: $.data.id }
            - call: "POST /vfd/residue-cases/${case_id}/open-investigation"
              payload: {}
              as: Inspector
          trigger:
            - call: "POST /vfd/residue-cases/${case_id}/dismiss"
              payload: {}
              as: Inspector
          assert:
            - "ResidueCase.${case_id}.status == DISMISSED"
            - "VeterinaryClinic.${clinic_id}.compliance_score == 1000 (unchanged; no penalty applied on dismiss)"
            - "VeterinaryClinic.${clinic_id}.audit_ready == true"
