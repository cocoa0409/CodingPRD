  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: slab_area_conserved_reserve_then_release
        grounds:
          - state_machines.Slab.IN_STOCK_to_RESERVED
          - state_machines.Slab.RESERVED_to_IN_STOCK
          - calculations.slab_remaining_area
        distinguishing_aspect: |
          Reserving a slab (remaining 50.00 -> 9.80) then cancelling the fab order restores
          Slab.remaining_sqft to 50.00 == nominal_sqft; the conserved quantity is SLAB AREA.
        test_recipe:
          setup:
            - "PREMIUM project, quote, deposit, approved template, slab nominal 50, fab order SCHEDULED reserving 40.20 (remaining 9.80)."
          setup_api_calls:
            - call: "POST /projects"
