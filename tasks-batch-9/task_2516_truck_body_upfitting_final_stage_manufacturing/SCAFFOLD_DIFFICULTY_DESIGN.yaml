  - rule_id: non_linear_state_machine
    instances:
      - name: order_build_and_compliance_dimensions_advance_independently
        grounds:
          - state_machines.UpfitOrder.build_status
          - state_machines.UpfitOrder.compliance_status
          - entities.UpfitOrder.fields.rework_round
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          UpfitOrder carries two independent parallel dimensions. Approving the AS_DESIGNED
          certification drives compliance_status NOT_STARTED -> DESIGN_CERTIFIED while build_status
          is still ENGINEERING_REVIEW, and the ENGINEERING_REVIEW -> REWORK -> ENGINEERING_REVIEW
          production loop (rework_round 0 -> 1) leaves compliance_status untouched at
          DESIGN_CERTIFIED. An implementation that models one linear status collapses the pair.
