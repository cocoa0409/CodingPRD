  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: laser_interval_overlap_half_open
        grounds:
          - validations[priority=9]
          - entities.LaseredMemberTerm.fields.effective_from
        distinguishing_aspect: |
          Half-open interval semantics on LaseredMemberTerm: [effective_from,
          effective_to) — an incoming laser whose effective_from EQUALS the
          existing laser's effective_to does NOT overlap (adjacent, allowed),
          but one ending 1 second into the existing interval DOES overlap
          (rejected).
        test_recipe:
          setup:
            - "Plan, contract IN_FORCE, member M; existing ACTIVE laser L1 [2026-01-01, 2026-07-01)"
          setup_api_calls:
            - call: "POST /stop-loss/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /stop-loss/plans"
              payload: { plan_name: "Omicron", sponsor_tax_id: "15-1515151" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /stop-loss/contracts"
              payload:
                plan_id: "${plan_id}"
                policy_year_start: "2026-01-01T00:00:00Z"
                policy_year_end: "2027-01-01T00:00:00Z"
                contract_basis: "POLICY_YEAR"
                specific_deductible_cents: 10000000
                aggregate_deductible_cents: 1000000000
                filing_deadline_days: 90
                notice_threshold_pct: 0.50
                run_in_days: 0
                run_out_days: 0
              as: PlanAdministrator
              captures: { contract_id: $.data.id, contract_v: $.data.version }
            - call: "POST /stop-loss/members"
              payload: { plan_id: "${plan_id}", member_external_id: "M", date_of_birth: "1980-01-01", coverage_start: "2025-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /stop-loss/contracts/${contract_id}/activate"
              payload: {}
              as: PlanAdministrator
            - call: "GET /stop-loss/contracts/${contract_id}"
              payload: {}
              as: PlanAdministrator
              captures: { contract_v2: $.data.version }
            - call: "POST /stop-loss/lasered-terms"
              payload:
                contract_id: "${contract_id}"
                member_id: "${m_id}"
                lasered_specific_deductible_cents: 15000000
                effective_from: "2026-01-01T00:00:00Z"
                effective_to: "2026-07-01T00:00:00Z"
                expected_contract_version: "${contract_v2}"
              as: PlanAdministrator
              captures: { laser1_id: $.data.id }
            - call: "GET /stop-loss/contracts/${contract_id}"
              payload: {}
              as: PlanAdministrator
              captures: { contract_v3: $.data.version }
          trigger:
            - call: "POST /stop-loss/lasered-terms"
              payload:
                contract_id: "${contract_id}"
                member_id: "${m_id}"
                lasered_specific_deductible_cents: 16000000
                effective_from: "2026-07-01T00:00:00Z"
                effective_to: "2027-01-01T00:00:00Z"
                expected_contract_version: "${contract_v3}"
              as: PlanAdministrator
              captures: { laser2_id: $.data.id }
          assert:
            - "Adjacent laser L2 [2026-07-01, 2027-01-01) created successfully (half-open semantics: L1.effective_to == L2.effective_from does not overlap)"
            - "GET /stop-loss/lasered-terms?contract_id&member_id returns 2 ACTIVE lasers"

      - name: run_in_run_out_window_ambiguity_between_contracts
        grounds:
          - validations[priority=7]
          - entities.StopLossContract.fields.run_in_days
          - entities.StopLossContract.fields.run_out_days
        distinguishing_aspect: |
          Aggregate-capacity semantics on StopLossContract (different resource
          entity, different interval rule from laser half-open): a claim whose
          paid_date falls inside the run-out window of contract A AND the
          run-in window of successor contract B is ambiguous and MUST be
          rejected with ERR_CLAIM_WINDOW_AMBIGUITY — a whole-window coverage
          collision, not a point-in-interval test.
        test_recipe:
          setup:
            - "Plan P; contract A policy 2026 (run_out_days=60) IN_FORCE; contract B policy 2027 (run_in_days=60) IN_FORCE"
            - "Claim with service_date=2026-12-15, paid_date=2027-01-15 — inside A's run-out AND B's run-in"
          setup_api_calls:
            - call: "POST /stop-loss/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdministrator
