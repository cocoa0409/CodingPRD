  - section: errors
    instances:
      - name: unknown_ids_return_entity_specific_not_found
        claim_type: error_triggerable
        grounds:
          - validations[priority=10]
          - errors.ERR_ACCOUNT_NOT_FOUND
          - errors.ERR_CONTENT_NOT_FOUND
          - errors.ERR_QUEUE_NOT_FOUND
          - errors.ERR_REPORT_NOT_FOUND
          - errors.ERR_AUDIT_SAMPLE_NOT_FOUND
          - errors.ERR_DETECTION_SIGNAL_NOT_FOUND
        distinguishing_aspect: "Every path-parameterised read reports its OWN 404 id for the same unknown UUID, so a client can tell which reference failed; the six remaining catalogue 404s are covered here in one sweep."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T09:00:00Z; the store is empty."
          setup_api_calls:
            - call: "POST /moderation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
          trigger:
            - call: "GET /moderation/accounts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "GET /moderation/content-items/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "GET /moderation/review-queues/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "GET /moderation/transparency-reports/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "GET /moderation/audit-samples/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: QAAuditor
              as_user_id: "qa-lead"
            - call: "GET /moderation/detection-signals/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
          assert:
            - "all six responses are HTTP 404 with response_type error"
            - "the error_ids are, in order, ERR_ACCOUNT_NOT_FOUND, ERR_CONTENT_NOT_FOUND, ERR_QUEUE_NOT_FOUND, ERR_REPORT_NOT_FOUND, ERR_AUDIT_SAMPLE_NOT_FOUND, ERR_DETECTION_SIGNAL_NOT_FOUND"
            - "each body carries meta.api_request_id and meta.api_request_timestamp alongside data.message"
      - name: request_without_role_header_is_unauthenticated
        claim_type: error_triggerable
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Missing identity headers are refused at priority 1 with 401 on an endpoint the caller would otherwise be allowed to use, which separates authentication from the 403 authorisation failure."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T09:00:00Z; one reviewer exists."
          setup_api_calls:
            - call: "POST /moderation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
          trigger:
            - call: "GET /moderation/reviewers"
              payload: {}
              as: MISSING
              as_user_id: "(both X-User-Role and X-User-ID omitted)"
          assert:
            - "HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "sending X-User-ID but an X-User-Role value that is not one of the six §1.7 roles also returns ERR_UNAUTHENTICATED, not ERR_UNAUTHORIZED"
            - "the same GET with X-User-Role TrustSafetyAdmin returns HTTP 200"
