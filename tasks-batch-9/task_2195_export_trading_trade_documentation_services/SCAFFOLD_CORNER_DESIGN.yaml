              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 with data.error_id == \"ERR_LICENSE_WINDOW_OVERLAP\" — the shared instant 2026-09-30T00:00:00Z counts as an intersection"
            - "an otherwise identical licence with valid_from 2026-10-01T00:00:00Z returns HTTP 201 with status \"ISSUED\", consumed_value_usd 0 and remaining_value_usd 80000.00"
            - "an otherwise identical licence for ECCN 5A002 in the touching window also returns HTTP 201 — the index is per ECCN and buyer"
