# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index (breadth probe)
# Home Décor & Home-Goods Store. Walks the claim-extraction guide against
# SCAFFOLD.yaml §1.1–§1.7. All calls conform to §1.5.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_store_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Store]
        distinguishing_aspect: "POST /stores with all required fields returns 201 and status ACTIVE, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /stores"
              payload: { name: "Store E1", region_code: "CA", oversized_slots_per_day: 3 }
              as: Admin
              captures: { store_id: $.data.id }
          assert:
            - "Store.${store_id}.status == ACTIVE"
            - "Store.${store_id}.version == 1"
            - "Store.${store_id}.oversized_slots_per_day == 3"

      - name: get_store_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_STORE_NOT_FOUND]"]
        distinguishing_aspect: "GET /stores/{id} for a non-existent UUID returns ERR_STORE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /stores/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STORE_NOT_FOUND"

      - name: create_product_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds: [entities.Product.fields.base_price_cents, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /products omitting base_price_cents returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "SKU-BAD", name: "No Price", category: "DECOR", clearance_floor_cents: 100, first_received_at: "2026-06-25T00:00:00Z" }
              as: MerchandisingManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: order_system_fields_generated_on_create
        claim_type: System Fields
        grounds: [entities.Order.fields.fulfillment_status, entities.Order.fields.payment_status]
        distinguishing_aspect: "New Order starts fulfillment_status PENDING and payment_status AUTHORIZED regardless of input."
        test_recipe:
          setup: ["Store ACTIVE."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Store E2", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "CARRYOUT" }
              as: StoreAssociate
              captures: { oid: $.data.id }
          assert:
            - "Order.${oid}.fulfillment_status == PENDING"
            - "Order.${oid}.payment_status == AUTHORIZED"
            - "Order.${oid}.version == 1"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: ready_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Order.PENDING_to_READY, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second POST /orders/{id}/ready from READY has no PENDING->READY edge -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["Order with one line, already marked READY."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Store SM2", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-SM2", name: "Mug", category: "KITCHEN", base_price_cents: 900, clearance_floor_cents: 100, first_received_at: "2026-06-25T00:00:00Z" }
              as: MerchandisingManager
              captures: { pid: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", product_id: "${pid}", allocated_qty: 5 }
              as: MerchandisingManager
              captures: { inv_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "BOPIS" }
              as: StoreAssociate
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 1 }
              as: StoreAssociate
              captures: { lid: $.data.id }
            - call: "POST /orders/${oid}/ready"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /orders/${oid}/ready"
              payload: {}
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: cancel_fulfilled_order_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Order.PENDING_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancel is only valid from PENDING/READY; from terminal FULFILLED it returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Order fully fulfilled."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Store SM3", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-SM3", name: "Tray", category: "KITCHEN", base_price_cents: 1200, clearance_floor_cents: 100, first_received_at: "2026-06-25T00:00:00Z" }
              as: MerchandisingManager
              captures: { pid: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", product_id: "${pid}", allocated_qty: 5 }
              as: MerchandisingManager
              captures: { inv_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "CARRYOUT" }
              as: StoreAssociate
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 1 }
              as: StoreAssociate
              captures: { lid: $.data.id }
            - call: "POST /orders/${oid}/capture"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${oid}/ready"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${oid}/fulfill"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /orders/${oid}/cancel"
              payload: {}
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: complete_booking_from_scheduled_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.DeliveryBooking.CONFIRMED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Complete requires CONFIRMED; completing a SCHEDULED booking returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A SCHEDULED (unconfirmed) booking."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Admin
            - call: "POST /stores"
              payload: { name: "Store SM4", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "OVERSIZED_DELIVERY" }
              as: StoreAssociate
              captures: { oid: $.data.id }
            - call: "POST /delivery-bookings"
              payload: { order_id: "${oid}", store_id: "${store_id}", delivery_date: "2026-07-10" }
              as: DeliveryCoordinator
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /delivery-bookings/${b1}/complete"
              payload: {}
              as: DeliveryCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: confirm_special_order_from_quoted_not_reviewable
        claim_type: invalid_transition
        grounds: [state_machines.SpecialOrder.CUSTOMER_REVIEW_to_CONFIRMED, "errors[ERR_SPECIAL_ORDER_NOT_REVIEWABLE]"]
        distinguishing_aspect: "Confirm requires CUSTOMER_REVIEW; confirming a QUOTED special order returns ERR_SPECIAL_ORDER_NOT_REVIEWABLE."
        test_recipe:
          setup: ["SpecialOrder quoted (status QUOTED)."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Store SM5", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /loyalty-members"
              payload: { email: "sm5@x.com", full_name: "SM Five" }
              as: StoreAssociate
              captures: { mid: $.data.id }
            - call: "POST /special-orders"
              payload: { store_id: "${store_id}", member_id: "${mid}", description: "Custom desk" }
              as: StoreAssociate
              captures: { so_id: $.data.id, so_v1: $.data.version }
            - call: "POST /special-orders/${so_id}/quote"
              payload: { quoted_price_cents: 40000, expected_special_order_version: "${so_v1}" }
              as: StoreAssociate
              captures: { so_v2: $.data.version }
          trigger:
            - call: "POST /special-orders/${so_id}/confirm"
              payload: {}
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SPECIAL_ORDER_NOT_REVIEWABLE"

      - name: add_item_to_closed_registry_returns_registry_closed
        claim_type: invalid_transition
        grounds: [state_machines.Registry.ACTIVE_to_CLOSED, "errors[ERR_REGISTRY_CLOSED]"]
        distinguishing_aspect: "Adding an item to a CLOSED registry returns ERR_REGISTRY_CLOSED."
        test_recipe:
          setup: ["Registry created by its owner, then closed."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Store SM6", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-SM6", name: "Sconce", category: "DECOR", base_price_cents: 2500, clearance_floor_cents: 200, first_received_at: "2026-06-25T00:00:00Z" }
              as: MerchandisingManager
              captures: { pid: $.data.id }
            - call: "POST /loyalty-members"
              payload: { email: "sm6@x.com", full_name: "SM Six" }
              as: StoreAssociate
              captures: { mid: $.data.id }
            - call: "POST /registries"
              payload: { owner_member_id: "${mid}", title: "Wedding", event_date: "2026-11-01" }
              as: Customer
              as_user_id: "${mid}"
              captures: { reg_id: $.data.id }
            - call: "POST /registries/${reg_id}/close"
              payload: {}
              as: Customer
              as_user_id: "${mid}"
          trigger:
            - call: "POST /registries/${reg_id}/items"
              payload: { product_id: "${pid}", desired_qty: 1 }
              as: Customer
              as_user_id: "${mid}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REGISTRY_CLOSED"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: silver_tier_discount_on_order_line
        claim_type: Correct Result
        grounds: [calculations.order_totals, calculations.loyalty_tier, entities.OrderLine.fields.line_net_cents]
        distinguishing_aspect: "SILVER member (5% discount): line unit 1000 x qty 2 -> round_half_up(2000*0.95)=1900; subtotal 1900."
        test_recipe:
          setup: ["SILVER member (lifetime_spend 60000); FULL-price product 1000; one line qty 2."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Admin
            - call: "POST /stores"
              payload: { name: "Store CA2", region_code: "NY", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-CA2", name: "Napkin Set", category: "TEXTILE", base_price_cents: 1000, clearance_floor_cents: 100, first_received_at: "2026-06-25T00:00:00Z" }
              as: MerchandisingManager
              captures: { pid: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", product_id: "${pid}", allocated_qty: 5 }
              as: MerchandisingManager
              captures: { inv_id: $.data.id }
            - call: "POST /loyalty-members"
              payload: { email: "ca2@x.com", full_name: "CA Two", initial_lifetime_spend_cents: 60000 }
              as: StoreAssociate
              captures: { mid: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "CARRYOUT", member_id: "${mid}" }
              as: StoreAssociate
              captures: { oid: $.data.id }
          trigger:
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 2 }
              as: StoreAssociate
              captures: { lid: $.data.id }
          assert:
            - "LoyaltyMember.${mid}.tier == SILVER"
            - "OrderLine.${lid}.line_net_cents == 1900"
            - "Order.${oid}.subtotal_cents == 1900"

      - name: return_restocking_fee_on_oversized_delivery
        claim_type: Correct Result
        grounds: [calculations.return_refund, entities.Return.fields.restocking_fee_cents]
        distinguishing_aspect: "OVERSIZED_DELIVERY order: RECEIPTED return base 10000 incurs 15% restocking fee 1500 -> refund 8500."
        test_recipe:
          setup: ["STANDARD member; FULL-price product 10000; OVERSIZED_DELIVERY order fulfilled; RECEIPTED return qty 1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Admin
            - call: "POST /stores"
              payload: { name: "Store CA3", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-CA3", name: "Bookshelf", category: "FURNITURE", base_price_cents: 10000, clearance_floor_cents: 1000, first_received_at: "2026-06-25T00:00:00Z" }
              as: MerchandisingManager
              captures: { pid: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", product_id: "${pid}", allocated_qty: 5 }
              as: MerchandisingManager
              captures: { inv_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "OVERSIZED_DELIVERY" }
              as: StoreAssociate
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 1 }
              as: StoreAssociate
              captures: { lid: $.data.id }
            - call: "POST /orders/${oid}/capture"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${oid}/ready"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${oid}/fulfill"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /returns"
              payload: { order_id: "${oid}", product_id: "${pid}", returned_qty: 1, variant: "RECEIPTED" }
              as: StoreAssociate
              captures: { rid: $.data.id }
          assert:
            - "Return.${rid}.base_refund_cents == 10000"
            - "Return.${rid}.restocking_fee_cents == 1500"
            - "Return.${rid}.refund_amount_cents == 8500"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: fulfill_before_capture_returns_payment_not_captured
        claim_type: violation_to_error
        grounds: [state_machines.Order.READY_to_FULFILLED, "errors[ERR_PAYMENT_NOT_CAPTURED]"]
        distinguishing_aspect: "Fulfill from READY while payment_status AUTHORIZED returns ERR_PAYMENT_NOT_CAPTURED."
        test_recipe:
          setup: ["Order READY but payment never captured."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Store V1", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-V1", name: "Basket", category: "DECOR", base_price_cents: 1500, clearance_floor_cents: 100, first_received_at: "2026-06-25T00:00:00Z" }
              as: MerchandisingManager
              captures: { pid: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", product_id: "${pid}", allocated_qty: 5 }
              as: MerchandisingManager
              captures: { inv_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "BOPIS" }
              as: StoreAssociate
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 1 }
              as: StoreAssociate
              captures: { lid: $.data.id }
            - call: "POST /orders/${oid}/ready"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /orders/${oid}/fulfill"
              payload: {}
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PAYMENT_NOT_CAPTURED"

      - name: booking_delivery_date_in_past_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_DELIVERY_DATE_IN_PAST]"]
        distinguishing_aspect: "delivery_date before clock_now date returns ERR_DELIVERY_DATE_IN_PAST."
        test_recipe:
          setup: ["Clock 2026-07-01; booking requested for 2026-06-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Admin
            - call: "POST /stores"
              payload: { name: "Store V2", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "OVERSIZED_DELIVERY" }
              as: StoreAssociate
              captures: { oid: $.data.id }
          trigger:
            - call: "POST /delivery-bookings"
              payload: { order_id: "${oid}", store_id: "${store_id}", delivery_date: "2026-06-01" }
              as: DeliveryCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DELIVERY_DATE_IN_PAST"

      - name: return_after_window_returns_window_expired
        claim_type: temporal_validation
        grounds: ["validations[priority=7]", "errors[ERR_RETURN_WINDOW_EXPIRED]"]
        distinguishing_aspect: "Return created more than 30 days after Order.fulfilled_at returns ERR_RETURN_WINDOW_EXPIRED."
        test_recipe:
          setup: ["Order fulfilled at 2026-07-01; clock advanced to 2026-09-01 (>30 days)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Admin
            - call: "POST /stores"
              payload: { name: "Store V3", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-V3", name: "Quilt", category: "TEXTILE", base_price_cents: 4000, clearance_floor_cents: 400, first_received_at: "2026-06-25T00:00:00Z" }
              as: MerchandisingManager
              captures: { pid: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", product_id: "${pid}", allocated_qty: 5 }
              as: MerchandisingManager
              captures: { inv_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "CARRYOUT" }
              as: StoreAssociate
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 1 }
              as: StoreAssociate
              captures: { lid: $.data.id }
            - call: "POST /orders/${oid}/capture"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${oid}/ready"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${oid}/fulfill"
              payload: {}
              as: StoreAssociate
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Admin
          trigger:
            - call: "POST /returns"
              payload: { order_id: "${oid}", product_id: "${pid}", returned_qty: 1, variant: "RECEIPTED" }
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RETURN_WINDOW_EXPIRED"

      - name: duplicate_line_for_same_product_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_DUPLICATE_LINE]"]
        distinguishing_aspect: "A second line for the same product on one order returns ERR_DUPLICATE_LINE."
        test_recipe:
          setup: ["Order already has a line for product P."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Store V4", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-V4", name: "Jar", category: "KITCHEN", base_price_cents: 700, clearance_floor_cents: 100, first_received_at: "2026-06-25T00:00:00Z" }
              as: MerchandisingManager
              captures: { pid: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", product_id: "${pid}", allocated_qty: 10 }
              as: MerchandisingManager
              captures: { inv_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "CARRYOUT" }
              as: StoreAssociate
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 1 }
              as: StoreAssociate
              captures: { l1: $.data.id }
          trigger:
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 1 }
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_LINE"

      - name: add_line_product_not_stocked_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority=5]", "errors[ERR_PRODUCT_NOT_STOCKED]"]
        distinguishing_aspect: "Adding a line for a product with no StoreInventory at the order's store returns ERR_PRODUCT_NOT_STOCKED."
        test_recipe:
          setup: ["Product exists but is not allocated to the order's store."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Store V5", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-V5", name: "Runner", category: "TEXTILE", base_price_cents: 1800, clearance_floor_cents: 200, first_received_at: "2026-06-25T00:00:00Z" }
              as: MerchandisingManager
              captures: { pid: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "CARRYOUT" }
              as: StoreAssociate
              captures: { oid: $.data.id }
          trigger:
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 1 }
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PRODUCT_NOT_STOCKED"

      - name: booking_crew_from_other_store_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority=5]", "errors[ERR_CREW_STORE_MISMATCH]"]
        distinguishing_aspect: "A booking whose crew_id belongs to a different store than store_id returns ERR_CREW_STORE_MISMATCH."
        test_recipe:
          setup: ["Store A booking references crew belonging to Store B."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Admin
            - call: "POST /stores"
              payload: { name: "Store A", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_a: $.data.id }
            - call: "POST /stores"
              payload: { name: "Store B", region_code: "NY", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_b: $.data.id }
            - call: "POST /assembly-crews"
              payload: { store_id: "${store_b}", name: "Crew B" }
              as: Admin
              captures: { crew_b: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_a}", order_type: "OVERSIZED_DELIVERY" }
              as: StoreAssociate
              captures: { oid: $.data.id }
          trigger:
            - call: "POST /delivery-bookings"
              payload: { order_id: "${oid}", store_id: "${store_a}", delivery_date: "2026-07-10", needs_assembly: true, crew_id: "${crew_b}", assembly_window_start: "2026-07-10T09:00:00Z", assembly_window_end: "2026-07-10T11:00:00Z" }
              as: DeliveryCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CREW_STORE_MISMATCH"

      - name: redeem_points_exceeds_balance_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_INSUFFICIENT_POINTS]"]
        distinguishing_aspect: "requested_redeem_points greater than member.points_balance returns ERR_INSUFFICIENT_POINTS."
        test_recipe:
          setup: ["Member with points_balance 100; order requests 500 redeem points."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Store V6", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /loyalty-members"
              payload: { email: "v6@x.com", full_name: "V Six", initial_points_balance: 100 }
              as: StoreAssociate
              captures: { mid: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "CARRYOUT", member_id: "${mid}", requested_redeem_points: 500 }
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSUFFICIENT_POINTS"

      - name: return_for_unordered_product_line_not_found
        claim_type: cross_entity_validation
        grounds: ["validations[priority=5]", "errors[ERR_LINE_NOT_FOUND]"]
        distinguishing_aspect: "A return whose (order_id, product_id) matches no line on the fulfilled order returns ERR_LINE_NOT_FOUND."
        test_recipe:
          setup: ["Order fulfilled with product A only; return references product B (exists, stocked, but not ordered)."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Store V7", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-V7A", name: "Bowl A", category: "KITCHEN", base_price_cents: 1000, clearance_floor_cents: 100, first_received_at: "2026-06-25T00:00:00Z" }
              as: MerchandisingManager
              captures: { pa: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-V7B", name: "Bowl B", category: "KITCHEN", base_price_cents: 1000, clearance_floor_cents: 100, first_received_at: "2026-06-25T00:00:00Z" }
              as: MerchandisingManager
              captures: { pb: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", product_id: "${pa}", allocated_qty: 5 }
              as: MerchandisingManager
              captures: { inva: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", product_id: "${pb}", allocated_qty: 5 }
              as: MerchandisingManager
              captures: { invb: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "CARRYOUT" }
              as: StoreAssociate
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pa}", qty: 1 }
              as: StoreAssociate
              captures: { la: $.data.id }
            - call: "POST /orders/${oid}/capture"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${oid}/ready"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${oid}/fulfill"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /returns"
              payload: { order_id: "${oid}", product_id: "${pb}", returned_qty: 1, variant: "RECEIPTED" }
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_LINE_NOT_FOUND"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: inventory_adjust_increases_allocation_and_on_hand
        claim_type: Computed read
        grounds: [entities.StoreInventory.fields.allocated_qty, entities.StoreInventory.fields.on_hand_qty]
        distinguishing_aspect: "POST /store-inventory/{id}/adjust delta 3 raises allocated_qty 5->8 and on_hand_qty 5->8."
        test_recipe:
          setup: ["StoreInventory allocated 5 (on_hand 5)."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Store EP1", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-EP1", name: "Stool", category: "FURNITURE", base_price_cents: 3000, clearance_floor_cents: 300, first_received_at: "2026-06-25T00:00:00Z" }
              as: MerchandisingManager
              captures: { pid: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", product_id: "${pid}", allocated_qty: 5 }
              as: MerchandisingManager
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /store-inventory/${inv_id}/adjust"
              payload: { delta_qty: 3 }
              as: MerchandisingManager
          assert:
            - "StoreInventory.${inv_id}.allocated_qty == 8"
            - "StoreInventory.${inv_id}.on_hand_qty == 8"

      - name: full_return_marks_order_payment_refunded
        claim_type: Side Effect Execution
        grounds: [state_machines.Return.REQUESTED_to_APPROVED, state_machines.Order.CAPTURED_to_REFUNDED, entities.OrderLine.fields.returned_qty]
        distinguishing_aspect: "Approving a full-quantity return restocks inventory, sets OrderLine.returned_qty, and flips Order.payment_status CAPTURED->REFUNDED."
        test_recipe:
          setup: ["Order fulfilled with one line qty 1; a RECEIPTED return for qty 1 is created."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: Admin
            - call: "POST /stores"
              payload: { name: "Store EP2", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-EP2", name: "Clock B", category: "DECOR", base_price_cents: 2000, clearance_floor_cents: 200, first_received_at: "2026-06-25T00:00:00Z" }
              as: MerchandisingManager
              captures: { pid: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", product_id: "${pid}", allocated_qty: 5 }
              as: MerchandisingManager
              captures: { inv_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", order_type: "CARRYOUT" }
              as: StoreAssociate
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/lines"
              payload: { product_id: "${pid}", qty: 1 }
              as: StoreAssociate
              captures: { lid: $.data.id }
            - call: "POST /orders/${oid}/capture"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${oid}/ready"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${oid}/fulfill"
              payload: {}
              as: StoreAssociate
            - call: "POST /returns"
              payload: { order_id: "${oid}", product_id: "${pid}", returned_qty: 1, variant: "RECEIPTED" }
              as: StoreAssociate
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /returns/${rid}/approve"
              payload: {}
              as: StoreAssociate
          assert:
            - "Return.${rid}.status == APPROVED"
            - "OrderLine.${lid}.returned_qty == 1"
            - "StoreInventory.${inv_id}.on_hand_qty == 5"
            - "StoreInventory.${inv_id}.sold_qty == 0"
            - "Order.${oid}.payment_status == REFUNDED"

      - name: list_registries_by_owner_reverse_reachability
        claim_type: Listing
        grounds: [entities.Registry.fields.owner_member_id]
        distinguishing_aspect: "GET /registries?owner_member_id returns the owner's registries as an array with pagination fields."
        test_recipe:
          setup: ["One registry owned by the member."]
          setup_api_calls:
            - call: "POST /loyalty-members"
              payload: { email: "ep3@x.com", full_name: "EP Three" }
              as: StoreAssociate
              captures: { mid: $.data.id }
            - call: "POST /registries"
              payload: { owner_member_id: "${mid}", title: "New Home", event_date: "2026-10-01" }
              as: Customer
              as_user_id: "${mid}"
              captures: { reg_id: $.data.id }
          trigger:
            - call: "GET /registries?owner_member_id=${mid}"
              payload: {}
              as: Customer
              as_user_id: "${mid}"
          assert:
            - "response data is an array with total_count >= 1 including Registry.${reg_id}"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: customer_cannot_create_product_unauthorized
        claim_type: exclusive_denied
        grounds: [roles.Customer, roles.MerchandisingManager, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "POST /products as Customer (not MerchandisingManager) returns ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Empty DB; acting as a Customer."]
          setup_api_calls:
            - call: "POST /loyalty-members"
              payload: { email: "rb1@x.com", full_name: "RB One" }
              as: StoreAssociate
              captures: { mid: $.data.id }
          trigger:
            - call: "POST /products"
              payload: { sku: "SKU-RB1", name: "Hijack", category: "DECOR", base_price_cents: 1000, clearance_floor_cents: 100, first_received_at: "2026-06-25T00:00:00Z" }
              as: Customer
              as_user_id: "${mid}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"

      - name: customer_cannot_close_another_members_registry
        claim_type: ownership_denied
        grounds: [roles.Customer, state_machines.Registry.ACTIVE_to_CLOSED, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Customer whose X-User-ID != Registry.owner_member_id cannot close it -> ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Registry owned by member A; member B attempts to close it."]
          setup_api_calls:
            - call: "POST /loyalty-members"
              payload: { email: "rb2a@x.com", full_name: "RB Two A" }
              as: StoreAssociate
              captures: { mid_a: $.data.id }
            - call: "POST /loyalty-members"
              payload: { email: "rb2b@x.com", full_name: "RB Two B" }
              as: StoreAssociate
              captures: { mid_b: $.data.id }
            - call: "POST /registries"
              payload: { owner_member_id: "${mid_a}", title: "A's Registry", event_date: "2026-10-01" }
              as: Customer
              as_user_id: "${mid_a}"
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /registries/${reg_id}/close"
              payload: {}
              as: Customer
              as_user_id: "${mid_b}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"

      - name: get_store_missing_headers_rejected
        claim_type: auth_required
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request with no X-User-ID / X-User-Role headers returns ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (the test omits both headers)."
        test_recipe:
          setup: ["One store exists; the trigger request is sent WITHOUT auth headers."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Store RB3", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
          trigger:
            - call: "GET /stores/${store_id}"
              payload: {}
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "With X-User-ID and X-User-Role omitted, response error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: special_order_requote_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[special-order-requote-supersede]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A re-quote carrying an expected_special_order_version that lags the current version returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["SpecialOrder created (version 1), quoted once (version advances to 2); a second quote still carries the stale version 1."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Store OCC1", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /loyalty-members"
              payload: { email: "occ1@x.com", full_name: "OCC One" }
              as: StoreAssociate
              captures: { mid: $.data.id }
            - call: "POST /special-orders"
              payload: { store_id: "${store_id}", member_id: "${mid}", description: "Custom hutch" }
              as: StoreAssociate
              captures: { so_id: $.data.id, so_v1: $.data.version }
            - call: "POST /special-orders/${so_id}/quote"
              payload: { quoted_price_cents: 30000, expected_special_order_version: "${so_v1}" }
              as: StoreAssociate
              captures: { so_v2: $.data.version }
          trigger:
            - call: "POST /special-orders/${so_id}/quote"
              payload: { quoted_price_cents: 31000, expected_special_order_version: "${so_v1}" }
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "SpecialOrder.${so_id}.quoted_price_cents == 30000"

      - name: requote_with_current_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[special-order-requote-supersede]", state_machines.SpecialOrder.QUOTED_to_QUOTED]
        distinguishing_aspect: "A re-quote carrying the current version supersedes the prior quote and bumps version."
        test_recipe:
          setup: ["SpecialOrder quoted once (version 2 captured from that response)."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Store OCC2", region_code: "CA", oversized_slots_per_day: 2 }
              as: Admin
              captures: { store_id: $.data.id }
            - call: "POST /loyalty-members"
              payload: { email: "occ2@x.com", full_name: "OCC Two" }
              as: StoreAssociate
              captures: { mid: $.data.id }
            - call: "POST /special-orders"
              payload: { store_id: "${store_id}", member_id: "${mid}", description: "Custom bench" }
              as: StoreAssociate
              captures: { so_id: $.data.id, so_v1: $.data.version }
            - call: "POST /special-orders/${so_id}/quote"
              payload: { quoted_price_cents: 20000, expected_special_order_version: "${so_v1}" }
              as: StoreAssociate
              captures: { so_v2: $.data.version }
          trigger:
            - call: "POST /special-orders/${so_id}/quote"
              payload: { quoted_price_cents: 22000, expected_special_order_version: "${so_v2}" }
              as: StoreAssociate
              captures: { so_v3: $.data.version }
          assert:
            - "SpecialOrder.${so_id}.quoted_price_cents == 22000"
            - "SpecialOrder.${so_id}.quote_revision == 2"

  # ---------------------------------------------------------------------------
  # excluded_because stubs — corners already exercised by §1.8
  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_delivery_day_full_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_DELIVERY_DAY_FULL]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / delivery_day_capacity_aggregate_count"
          rationale: "ERR_DELIVERY_DAY_FULL is asserted as the outcome of the day-capacity §1.8 instance."
      - name: error_assembly_crew_unavailable_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_ASSEMBLY_CREW_UNAVAILABLE]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / assembly_crew_halfopen_interval_overlap"
          rationale: "ERR_ASSEMBLY_CREW_UNAVAILABLE is asserted as the outcome of the crew-window §1.8 instance."
      - name: error_insufficient_inventory_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSUFFICIENT_INVENTORY]"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / inventory_reserve_at_zero_availability"
          rationale: "ERR_INSUFFICIENT_INVENTORY is asserted at the zero-availability boundary §1.8 instance."
      - name: error_product_discontinued_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_PRODUCT_DISCONTINUED]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / add_line_requires_product_active"
          rationale: "ERR_PRODUCT_DISCONTINUED is asserted by the Order->Product cross-entity §1.8 instance."
      - name: error_store_reset_locked_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_STORE_RESET_LOCKED]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / booking_confirm_requires_store_active"
          rationale: "ERR_STORE_RESET_LOCKED is asserted by the DeliveryBooking->Store cross-entity §1.8 instance."
      - name: error_order_not_fulfilled_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_ORDER_NOT_FULFILLED]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / order_not_fulfilled_beats_return_qty_exceeds"
          rationale: "ERR_ORDER_NOT_FULFILLED is asserted as the winning error of the priority-conflict §1.8 instance."
      - name: error_return_qty_exceeds_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_RETURN_QTY_EXCEEDS]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / order_not_fulfilled_beats_return_qty_exceeds"
          rationale: "ERR_RETURN_QTY_EXCEEDS is the suppressed lower-priority violation in that §1.8 instance."
