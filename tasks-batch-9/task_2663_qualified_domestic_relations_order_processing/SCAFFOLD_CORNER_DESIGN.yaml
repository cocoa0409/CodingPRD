# ===========================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
#   task 2663 - Qualified Domestic Relations Order Processing
#   Breadth probe: every testable claim §1.1-§1.7 declares that
#   SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) does not already assert.
#   Sections and claim_type values are taken verbatim from
#   references/claim-extraction-guide.md; nothing is invented.
#   All 47 §1.6 error ids are triggerable: each is either the subject of an
#   active instance below or carries an excluded_because stub naming the §1.8
#   instance that asserts it.
# ===========================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: plan_creation_returns_declared_defaults_inside_response_envelope
        claim_type: creation
        grounds:
          - response_envelope
          - entities.Plan
          - endpoints[POST /plans]
        distinguishing_aspect: |
          A create returns 201 with the whole entity nested under $.data, alongside a meta block carrying
          api_request_id and api_request_timestamp and response_type "object" — never the entity at the
          top level and never a bare id. The new Plan must come back with procedures_status DRAFT (not
          PUBLISHED), participant_count 0 and version 1.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /plans"
              payload: { plan_name: "Envelope Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT", "FLAT_DOLLAR", "COVERTURE_FRACTION"], allowed_approaches: ["SEPARATE_INTEREST", "SHARED_PAYMENT"], earnings_adjustment_method: "PERIOD_END" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id, status: $.data.procedures_status, count: $.data.participant_count, ver: $.data.version }
          assert:
            - "HTTP 201; the body has exactly the keys meta, response_type and data; response_type == \"object\"; meta.api_request_id and meta.api_request_timestamp are both present and non-null."
            - "${status} == \"DRAFT\", ${count} == 0, ${ver} == 1, and ${plan_id} is a non-empty string."
            - "$.data echoes plan_name \"Envelope Plan\", plan_type \"DEFINED_CONTRIBUTION\", model_language_version \"MLA-2026.1\", acceptable_formula_codes [\"PERCENTAGE_OF_ACCOUNT\", \"FLAT_DOLLAR\", \"COVERTURE_FRACTION\"] and allowed_approaches [\"SEPARATE_INTEREST\", \"SHARED_PAYMENT\"] in the submitted order."
            - "$.data.created_at and $.data.updated_at are present ISO-8601 UTC instants and are equal to each other on a freshly created row."
            - "GET /plans/${plan_id} returns the identical field set under $.data with response_type \"object\"."

      - name: omitted_optional_inputs_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Plan.fields.requires_model_language
          - entities.Plan.fields.review_period_days
          - entities.Plan.fields.segregation_period_days
          - entities.Plan.fields.resubmission_window_days
          - entities.Plan.fields.max_revisions
          - entities.Plan.fields.max_assignable_pct_bps
          - entities.Plan.fields.max_assignable_amount_cents
          - entities.Participant.fields.employment_status
          - entities.Participant.fields.benefit_commenced
          - entities.PlanAccount.fields.monthly_payment_cents
          - entities.MoneySource.fields.basis_cents
          - entities.MoneySource.fields.is_assignable
          - entities.QdroCase.fields.marital_period_end
          - entities.QdroCase.fields.alternate_payee_address_on_file
          - entities.DraftOrder.fields.provisions
        distinguishing_aspect: |
          Every optional input has a declared default that must be materialised on the row, not left null:
          requires_model_language true, permits_benefit_not_otherwise_available false, review_period_days
          45, segregation_period_days 548, resubmission_window_days 60, max_revisions 3,
          max_assignable_pct_bps 5000, max_assignable_amount_cents 100000000, employment_status ACTIVE,
          benefit_commenced false, monthly_payment_cents 0, basis_cents 0, is_assignable true, provisions
          []. The two nullable ones are different in kind — marital_period_end defaults to null (meaning
          unbounded-forward, NOT "today") and alternate_payee_address_on_file defaults to false, which is
          itself a deficiency trigger.
        test_recipe:
          setup:
            - "Empty database; every optional field is omitted from every call."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Default Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], earnings_adjustment_method: "PERIOD_END" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id, rml: $.data.requires_model_language, pbnoa: $.data.permits_benefit_not_otherwise_available, rpd: $.data.review_period_days, spd: $.data.segregation_period_days, rwd: $.data.resubmission_window_days, mr: $.data.max_revisions, mpct: $.data.max_assignable_pct_bps, mamt: $.data.max_assignable_amount_cents }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Dana Okonkwo", ssn_last4: "0404", date_of_birth: "1980-04-04", participation_start_date: "2010-01-01" }
              as: PlanAdministrator
              captures: { part_id: $.data.id, emp: $.data.employment_status, bc: $.data.benefit_commenced }
            - call: "POST /participants/${part_id}/plan-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { acct_id: $.data.id, mpc: $.data.monthly_payment_cents }
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000 }
              as: PlanAdministrator
              captures: { basis: $.data.basis_cents, assignable: $.data.is_assignable }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
              payload: { participant_id: "${part_id}", alternate_payee_name: "Chidi Okonkwo", valuation_date: "2026-06-30", marital_period_start: "2012-03-01" }
              as: QdroAnalyst
              captures: { case_id: $.data.id, case_v: $.data.version, mpe: $.data.marital_period_end, addr: $.data.alternate_payee_address_on_file }
          trigger:
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case_id}", expected_case_version: "${case_v}", document_reference: "DRO-2663-DEF", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000 }
              as: QdroAnalyst
              captures: { draft_id: $.data.id, provs: $.data.provisions, rev: $.data.revision_number, auth: $.data.attorney_authorization_id, reviewed_by: $.data.reviewed_by_user_id, denial: $.data.denial_reason }
          assert:
            - "${rml} == true, ${pbnoa} == false, ${rpd} == 45, ${spd} == 548, ${rwd} == 60, ${mr} == 3, ${mpct} == 5000, ${mamt} == 100000000."
            - "${emp} == \"ACTIVE\", ${bc} == false, ${mpc} == 0, ${basis} == 0, ${assignable} == true."
            - "${mpe} == null (unbounded-forward, not coerced to the valuation date or to the clock) and ${addr} == false."
            - "${provs} == [], ${rev} == 1, ${auth} == null, ${reviewed_by} == null, ${denial} == null."
            - "The defaults are load-bearing, not cosmetic: GET /segregation-holds with qdro_case_id=${case_id} reports expires_at \"2028-03-02T00:00:00Z\" (the defaulted 548 days from 2026-09-01) and hold_amount_cents 400000 (4000 bps of the 1000000 base, under the defaulted 5000 bps ceiling)."
            - "GET /draft-orders/${draft_id} reports deficiency_codes [\"AP_IDENTIFICATION_INCOMPLETE\"] — the defaulted alternate_payee_address_on_file false is itself a deficiency, so the default is observable through calculations.deficiency_evaluation."

      - name: unknown_path_and_body_ids_return_collection_specific_not_found
        claim_type: not_found
        grounds:
          - validations[priority=30]
          - validations[priority=32]
          - errors.ERR_PLAN_NOT_FOUND
          - errors.ERR_PARTICIPANT_NOT_FOUND
          - errors.ERR_PLAN_ACCOUNT_NOT_FOUND
          - errors.ERR_QDRO_CASE_NOT_FOUND
          - errors.ERR_DRAFT_ORDER_NOT_FOUND
          - errors.ERR_SEGREGATION_HOLD_NOT_FOUND
          - errors.ERR_AP_ACCOUNT_NOT_FOUND
          - errors.ERR_DISTRIBUTION_NOT_FOUND
          - errors.ERR_AUTHORIZATION_NOT_FOUND
          - errors.ERR_TAX_REPORT_NOT_FOUND
        distinguishing_aspect: |
          The 404 is chosen by the LEADING collection segment of the path, not by the last segment and not
          by a generic "resource not found": a bogus id under /plans is ERR_PLAN_NOT_FOUND even when the
          request is really about participants, and a bogus id under /draft-orders is
          ERR_DRAFT_ORDER_NOT_FOUND even for the /deficiency-notices sub-resource. Body foreign keys
          resolve to their own entity's 404 at priority 32, one rung later than the path check.
        test_recipe:
          setup:
            - "Empty database — every id below is a well-formed but unknown UUID."
          setup_api_calls: []
          trigger:
            - call: "GET /plans/{id}"
              payload: {}
              as: PlanAdministrator
              captures: { e_plan: $.data.error_id }
            - call: "GET /participants/{id}"
              payload: {}
              as: PlanAdministrator
              captures: { e_part: $.data.error_id }
            - call: "GET /plan-accounts/{id}"
              payload: {}
              as: PlanAdministrator
              captures: { e_acct: $.data.error_id }
            - call: "GET /qdro-cases/{id}"
              payload: {}
              as: PlanAdministrator
              captures: { e_case: $.data.error_id }
            - call: "GET /draft-orders/{id}/deficiency-notices"
              payload: {}
              as: PlanAdministrator
              captures: { e_draft: $.data.error_id }
            - call: "GET /segregation-holds/{id}"
              payload: {}
              as: PlanAdministrator
              captures: { e_hold: $.data.error_id }
            - call: "GET /alternate-payee-accounts/{id}"
              payload: {}
              as: PlanAdministrator
              captures: { e_ap: $.data.error_id }
            - call: "GET /distributions/{id}"
              payload: {}
              as: PlanAdministrator
              captures: { e_dist: $.data.error_id }
            - call: "POST /attorney-authorizations/{id}/revoke"
              payload: {}
              as: PlanAdministrator
              captures: { e_auth: $.data.error_id }
            - call: "GET /tax-reports/{id}"
              payload: {}
              as: PlanAdministrator
              captures: { e_tax: $.data.error_id }
            - call: "POST /participants"
              payload: { plan_id: "00000000-0000-4000-8000-000000000001", full_name: "Ghost Plan Member", ssn_last4: "9999", date_of_birth: "1980-01-01", participation_start_date: "2010-01-01" }
              as: PlanAdministrator
              captures: { e_body_plan: $.data.error_id }
            - call: "POST /qdro-cases"
              payload: { participant_id: "00000000-0000-4000-8000-000000000002", alternate_payee_name: "Ghost Spouse", valuation_date: "2026-06-30", marital_period_start: "2012-03-01" }
              as: QdroAnalyst
              captures: { e_body_part: $.data.error_id }
          assert:
            - "${e_plan} == \"ERR_PLAN_NOT_FOUND\", ${e_part} == \"ERR_PARTICIPANT_NOT_FOUND\", ${e_acct} == \"ERR_PLAN_ACCOUNT_NOT_FOUND\", ${e_case} == \"ERR_QDRO_CASE_NOT_FOUND\", ${e_hold} == \"ERR_SEGREGATION_HOLD_NOT_FOUND\", ${e_ap} == \"ERR_AP_ACCOUNT_NOT_FOUND\", ${e_dist} == \"ERR_DISTRIBUTION_NOT_FOUND\", ${e_auth} == \"ERR_AUTHORIZATION_NOT_FOUND\", ${e_tax} == \"ERR_TAX_REPORT_NOT_FOUND\" — every one with HTTP 404."
            - "${e_draft} == \"ERR_DRAFT_ORDER_NOT_FOUND\" — the leading segment is /draft-orders, so the sub-resource name deficiency-notices does not change the error id."
            - "${e_body_plan} == \"ERR_PLAN_NOT_FOUND\" and ${e_body_part} == \"ERR_PARTICIPANT_NOT_FOUND\" — body foreign keys resolve to their own entity's 404 at priority 32."
            - "Every response carries response_type \"error\" with $.data.error_id and $.data.message present, and no entity was created (a subsequent GET /plans/{id} for the same bogus id still 404s)."

      - name: missing_required_input_fields_are_rejected_before_any_lookup
        claim_type: required_fields
        grounds:
          - validations[priority=25]
          - errors.ERR_INVALID_REQUEST
          - endpoints[POST /plans]
          - endpoints[POST /qdro-cases]
          - endpoints[POST /draft-orders]
        distinguishing_aspect: |
          Priority 25 sits between the role check (20) and the path lookup (30), so a request that is BOTH
          malformed and aimed at a non-existent resource reports ERR_INVALID_REQUEST (400) rather than a
          404 — the shape is judged before existence. Every non-optional field in an endpoint's input list
          is genuinely required, including expected_case_version on POST /draft-orders, which is an OCC
          token and not an optional nicety.
        test_recipe:
          setup:
            - "One PUBLISHED plan, one participant, one plan account with an assignable PRE_TAX_DEFERRAL source of 1000000, and one case at clock 2026-09-01."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Shape Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], earnings_adjustment_method: "PERIOD_END" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Rhea Nakamura", ssn_last4: "1212", date_of_birth: "1981-01-01", participation_start_date: "2010-01-01" }
              as: PlanAdministrator
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/plan-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { acct_id: $.data.id }
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000 }
              as: PlanAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
              payload: { participant_id: "${part_id}", alternate_payee_name: "Kai Nakamura", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", alternate_payee_dob: "1983-03-03", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case_id: $.data.id, case_v: $.data.version }
          trigger:
            - call: "POST /plans"
              payload: { plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], earnings_adjustment_method: "PERIOD_END" }
              as: PlanAdministrator
              captures: { e_no_name: $.data.error_id }
            - call: "POST /qdro-cases"
              payload: { participant_id: "${part_id}", alternate_payee_name: "No Valuation", marital_period_start: "2012-03-01" }
              as: QdroAnalyst
              captures: { e_no_valuation: $.data.error_id }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case_id}", document_reference: "DRO-2663-NOVER", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000 }
              as: QdroAnalyst
              captures: { e_no_version: $.data.error_id }
            - call: "POST /draft-orders/{id}/deny"
              payload: {}
              as: PlanAdministrator
              captures: { e_shape_before_lookup: $.data.error_id }
            - call: "POST /plan-accounts/${acct_id}/valuation-snapshots"
              payload: { as_of_date: "2026-06-30", source: "TRUSTEE_STATEMENT" }
              as: PlanAdministrator
              captures: { e_no_balance: $.data.error_id }
          assert:
            - "${e_no_name} == \"ERR_INVALID_REQUEST\" with HTTP 400 and no Plan row created (a second GET /plans/${plan_id} still shows participant_count 1)."
            - "${e_no_valuation} == \"ERR_INVALID_REQUEST\" — valuation_date is not optional even though marital_period_end is."
            - "${e_no_version} == \"ERR_INVALID_REQUEST\" — the OCC token expected_case_version is a required input on POST /draft-orders; omitting it is a 400, NOT a 412."
            - "${e_shape_before_lookup} == \"ERR_INVALID_REQUEST\" with HTTP 400 — denial_reason is missing AND the draft order id is unknown, and priority 25 outranks the priority-30 lookup, so the answer is 400 and never ERR_DRAFT_ORDER_NOT_FOUND."
            - "${e_no_balance} == \"ERR_INVALID_REQUEST\" and GET /plan-accounts/${acct_id}/valuation-snapshots returns 0 rows."
            - "The case is untouched by all five refusals: GET /qdro-cases/${case_id} still reports review_status \"INTAKE\", segregation_status \"NONE\" and version ${case_v}."

      - name: enum_and_range_constraints_refuse_undeclared_literals
        claim_type: type_constraints
        grounds:
          - validations[priority=25]
          - entities.Plan.fields.plan_type
          - entities.Plan.fields.max_assignable_pct_bps
          - entities.Participant.fields.ssn_last4
          - entities.MoneySource.fields.basis_cents
          - entities.QdroCase.fields.marital_period_end
          - entities.AttorneyAuthorization.fields.expires_at
          - entities.DraftOrder.fields.proposed_percentage_bps
        distinguishing_aspect: |
          Type constraints are not only enum membership. The scaffold declares four different shapes of
          numeric/temporal constraint that must each be enforced: an undeclared enum literal, a *_bps
          value above 10000, a negative *_cents value, a cross-field ordering (marital_period_start
          strictly before marital_period_end, so equal dates are refused), a cross-field magnitude
          (basis_cents <= balance_cents) and a datetime strictly after a date (expires_at after
          effective_from 00:00:00Z). All of them land on the same ERR_INVALID_REQUEST at 400.
        test_recipe:
          setup:
            - "One PUBLISHED plan, one participant with a plan account and an assignable PRE_TAX_DEFERRAL source of 1000000, one case, all at clock 2026-09-01."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Constraint Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], earnings_adjustment_method: "PERIOD_END" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Yusuf Adeyemi", ssn_last4: "3434", date_of_birth: "1979-03-03", participation_start_date: "2010-01-01" }
              as: PlanAdministrator
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/plan-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { acct_id: $.data.id }
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000 }
              as: PlanAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
              payload: { participant_id: "${part_id}", alternate_payee_name: "Ade Adeyemi", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", alternate_payee_dob: "1982-02-02", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case_id: $.data.id, case_v: $.data.version }
          trigger:
            - call: "POST /plans"
              payload: { plan_name: "Bad Type", plan_type: "DEFINED_BENEFIT", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], earnings_adjustment_method: "PERIOD_END" }
              as: PlanAdministrator
              captures: { e_enum: $.data.error_id }
            - call: "POST /plans"
              payload: { plan_name: "Bad Bps", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], earnings_adjustment_method: "PERIOD_END", max_assignable_pct_bps: 10001 }
              as: PlanAdministrator
              captures: { e_bps: $.data.error_id }
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Bad SSN", ssn_last4: "12A4", date_of_birth: "1979-03-03", participation_start_date: "2010-01-01" }
              as: PlanAdministrator
              captures: { e_ssn: $.data.error_id }
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "ROTH", balance_cents: 50000, basis_cents: 60000 }
              as: PlanAdministrator
              captures: { e_basis: $.data.error_id }
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "ROTH", balance_cents: -1 }
              as: PlanAdministrator
              captures: { e_negative: $.data.error_id }
            - call: "POST /qdro-cases"
              payload: { participant_id: "${part_id}", alternate_payee_name: "Zero Length Marriage", valuation_date: "2026-06-30", marital_period_start: "2020-01-01", marital_period_end: "2020-01-01" }
              as: QdroAnalyst
              captures: { e_interval: $.data.error_id }
            - call: "POST /qdro-cases/${case_id}/attorney-authorizations"
              payload: { represents: "PARTICIPANT", attorney_name: "Backwards Window", attorney_bar_number: "BAR-1", attorney_email: "b@w.example", disclosure_scope: "FULL", effective_from: "2026-08-01", expires_at: "2026-08-01T00:00:00Z" }
              as: QdroAnalyst
              captures: { e_window: $.data.error_id }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case_id}", expected_case_version: "${case_v}", document_reference: "DRO-2663-OVER", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 10001 }
              as: QdroAnalyst
              captures: { e_pct: $.data.error_id }
          assert:
            - "All eight refusals are ERR_INVALID_REQUEST with HTTP 400: ${e_enum}, ${e_bps}, ${e_ssn}, ${e_basis}, ${e_negative}, ${e_interval}, ${e_window}, ${e_pct}."
            - "${e_interval} fires on EQUAL dates — marital_period_start must be STRICTLY before marital_period_end, so a zero-length marital period is not admissible."
            - "${e_window} fires on an expires_at equal to effective_from 00:00:00Z — the authorization window must be strictly positive."
            - "Nothing was persisted by any of them: GET /plan-accounts/${acct_id}/money-sources returns exactly 1 row (PRE_TAX_DEFERRAL 1000000), GET /participants/${part_id}/qdro-cases returns exactly 1 row, and GET /qdro-cases/${case_id}/attorney-authorizations returns 0 rows."
            - "GET /plan-accounts/${acct_id} reports vested_balance_cents 1000000 — the rejected ROTH rows never touched the aggregate."

      - name: computed_and_system_fields_are_server_owned
        claim_type: computed_fields
        grounds:
          - entities.PlanAccount.fields.vested_balance_cents
          - entities.PlanAccount.fields.assignable_base_cents
          - entities.PlanAccount.fields.after_tax_basis_cents
          - entities.DraftOrder.fields.deficiency_codes
          - entities.DraftOrder.fields.review_deadline_at
          - entities.Plan.fields.participant_count
          - calculations.plan_account_derived_balances
        distinguishing_aspect: |
          Every `source: computed` field is derived on read-back from the rows that feed it and is never
          taken from the request. A PlanAccount created before any MoneySource exists must report
          vested_balance_cents 0, assignable_base_cents 0, after_tax_basis_cents 0, held_amount_cents 0
          and available_balance_cents 0 — not null — and each subsequent money-source insert must move all
          five. Plan.participant_count is likewise a live count, and DraftOrder.deficiency_codes and
          review_deadline_at are stamped by calculations at receipt.
        test_recipe:
          setup:
