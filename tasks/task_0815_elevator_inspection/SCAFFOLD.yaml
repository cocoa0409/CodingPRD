# =============================================================================
# Elevator & Conveyance Inspection — seed tables (SCAFFOLD.yaml)
# Difficulty: Expert
# =============================================================================

scenario: "Elevator & Conveyance Inspection: device registration & category, annual/periodic inspection scheduling, licensed-inspector assignment, deficiency & citation, certificate issuance & posting, shutdown/out-of-service order, fee & renewal, accident investigation"

domain_name: elevator-conveyance-inspection
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
  entity_topology: flat
  # flat: peer entities linked by foreign keys; no entity nesting in URL paths.
  state_machine_shape: branching
  # Inspection (branching outcomes), Citation (cyclic contest loop),
  # Certificate (suspend/reinstate cycle), Device (out-of-service cycle),
  # AccidentReport (branching finding) — several non-linear machines.
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  # Independence rule: an inspector currently assigned to a device's routine
  # inspection may not lead that device's accident investigation.
  consistency_model: immediate

# =============================================================================
# Table 1.0 — Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1 — Entity-Relationship Table
# =============================================================================
entities:
  - name: Owner
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Building/property owner name" }
      - { name: contact_email, type: string, source: input, description: "Owner contact email" }

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Licensed inspector full name" }
      - { name: license_number, type: string, source: input, description: "State-issued inspector license number" }
      - { name: license_expiry_period, type: integer, source: input, description: "Period index (inclusive) after which the license is expired; a license is valid while current_period_index <= license_expiry_period" }
      - { name: certified_categories, type: array, source: input, description: "Device categories this inspector is licensed to inspect (subset of the category enum)" }
      - { name: active_assignment_count, type: integer, source: computed, default: 0, description: "Count of Inspection rows for this inspector whose status IN {ASSIGNED, IN_PROGRESS}; conserved-quantity anchor for the assign/cancel invariant" }

  - name: Device
    parent: null
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: input, description: "FK -> Owner.id" }
      - { name: category, type: enum, source: input, description: "PASSENGER_ELEVATOR | FREIGHT_ELEVATOR | ESCALATOR | MOVING_WALK | DUMBWAITER", constraints: "one of the five category enum values" }
      - { name: location_description, type: string, source: input, description: "Physical location of the conveyance" }
      - { name: install_period, type: integer, source: input, description: "Period index the device was installed" }
      - { name: risk_class, type: enum, source: computed, description: "HIGH | MEDIUM | LOW; derived from category via RISK_CLASS constant map" }
      - { name: status, type: enum, source: system, description: "REGISTERED | ACTIVE | OUT_OF_SERVICE | DECOMMISSIONED", constraints: "lifecycle per Device state machine" }
      - { name: next_inspection_due_period, type: integer, source: computed, default: null, description: "performed_period of the latest PASSED inspection + INTERVAL_MONTHS[category]; null until the first pass" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "Conserved fiscal quantity: sum over unpaid Citations of surcharged_amount_cents PLUS sum over unpaid FeeInvoices (status IN {PENDING, OVERDUE}) of amount_cents" }
      - { name: accident_risk_score, type: integer, source: computed, default: 0, description: "Latest final_risk_score written by a closed accident investigation (dual-variant calc accident_risk_score)" }
      - { name: current_certificate_id, type: string, source: computed, default: null, description: "id of the device's active (ISSUED or POSTED) certificate; null when none" }
      - { name: active_oos_count, type: integer, source: computed, default: 0, description: "Count of OutOfServiceOrder rows for this device whose status == ACTIVE" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: device_id, type: string, source: input, description: "FK -> Device.id" }
      - { name: assigned_inspector_id, type: string, source: system, default: null, description: "FK -> Inspector.id; set on assign, cleared to null on cancel-from-ASSIGNED" }
      - { name: type, type: enum, source: input, description: "ANNUAL | PERIODIC | REINSPECTION | ACCIDENT_FOLLOWUP" }
      - { name: scheduled_start_period, type: integer, source: input, description: "Half-open scheduling window start (inclusive)" }
      - { name: scheduled_end_period, type: integer, source: input, description: "Half-open scheduling window end (exclusive)" }
      - { name: performed_period, type: integer, source: system, default: null, description: "current_period_index at the time complete was called" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ASSIGNED | IN_PROGRESS | PASSED | FAILED | CONDITIONAL | CANCELLED", constraints: "branching completion per Inspection state machine" }

  - name: Deficiency
    parent: null
    common_fields: true
    fields:
      - { name: inspection_id, type: string, source: system, description: "FK -> Inspection.id (the inspection that recorded it)" }
      - { name: device_id, type: string, source: system, description: "FK -> Device.id (copied from the inspection)" }
      - { name: code, type: string, source: input, description: "Deficiency code recorded during inspection completion" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CRITICAL" }
      - { name: description, type: string, source: input, description: "Deficiency description" }
      - { name: resolution_due_period, type: integer, source: computed, description: "inspection.performed_period + RESOLUTION_GRACE_MONTHS[severity]" }
      - { name: status, type: enum, source: system, description: "OPEN | CITED | RESOLVED | WAIVED", constraints: "per Deficiency state machine" }

  - name: Citation
    parent: null
    common_fields: true
    fields:
      - { name: deficiency_id, type: string, source: input, description: "FK -> Deficiency.id" }
      - { name: device_id, type: string, source: system, description: "FK -> Device.id (copied from the deficiency)" }
      - { name: fine_amount_cents, type: integer, source: computed, description: "Combinatorial fine (calc citation_fine)" }
      - { name: surcharged_amount_cents, type: integer, source: computed, description: "round_half_up(fine_amount_cents * (1 + OUTSTANDING_INDEX_RATE)); the exact amount added to / removed from Device.outstanding_balance_cents" }
      - { name: issued_period, type: integer, source: system, description: "current_period_index at issuance" }
      - { name: due_period, type: integer, source: computed, description: "issued_period + CITATION_DUE_GRACE_MONTHS" }
      - { name: contest_count, type: integer, source: computed, default: 0, description: "Number of times the citation has entered CONTESTED" }
      - { name: status, type: enum, source: system, description: "ISSUED | CONTESTED | PAID | DISMISSED", constraints: "cyclic contest loop per Citation state machine" }

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - { name: device_id, type: string, source: input, description: "FK -> Device.id" }
      - { name: source_inspection_id, type: string, source: input, description: "FK -> Inspection.id (the PASSED inspection that grounds this certificate)" }
      - { name: certificate_number, type: string, source: system, description: "System-minted human-facing certificate number" }
      - { name: issue_period, type: integer, source: system, description: "current_period_index at issuance" }
      - { name: expiry_period, type: integer, source: computed, description: "issue_period + INTERVAL_MONTHS[device.category]" }
      - { name: posted_period, type: integer, source: system, default: null, description: "current_period_index when the certificate was posted, else null" }
      - { name: status, type: enum, source: system, description: "ISSUED | POSTED | SUSPENDED | REVOKED | SUPERSEDED | EXPIRED", constraints: "suspend/reinstate cycle per Certificate state machine" }

  - name: OutOfServiceOrder
    parent: null
    common_fields: true
    fields:
      - { name: device_id, type: string, source: input, description: "FK -> Device.id" }
      - { name: citation_id, type: string, source: input, default: null, description: "FK -> Citation.id; the citation that motivated the order, when applicable" }
      - { name: reason, type: enum, source: input, description: "CRITICAL_DEFICIENCY | ACCIDENT | NONPAYMENT | EXPIRED_CERTIFICATE" }
      - { name: effective_start_period, type: integer, source: input, description: "Closed-interval occupation start (inclusive)" }
      - { name: effective_end_period, type: integer, source: input, description: "Closed-interval occupation end (inclusive)" }
      - { name: lifted_period, type: integer, source: system, default: null, description: "current_period_index when lifted, else null" }
      - { name: status, type: enum, source: system, description: "ACTIVE | LIFTED", constraints: "per OutOfServiceOrder state machine" }

  - name: FeeInvoice
    parent: null
    common_fields: true
    fields:
      - { name: device_id, type: string, source: input, description: "FK -> Device.id" }
      - { name: type, type: enum, source: input, description: "REGISTRATION | ANNUAL_RENEWAL | REINSPECTION | LATE_PENALTY" }
      - { name: amount_cents, type: integer, source: computed, description: "Provisional at creation, recomputed to final (with late penalty) at pay — dual-variant calc fee_amount" }
      - { name: due_period, type: integer, source: input, description: "Period index the invoice is due" }
      - { name: paid_period, type: integer, source: system, default: null, description: "current_period_index when paid, else null" }
      - { name: status, type: enum, source: system, description: "PENDING | OVERDUE | PAID", constraints: "per FeeInvoice state machine" }

  - name: AccidentReport
    parent: null
    common_fields: true
    fields:
      - { name: device_id, type: string, source: input, description: "FK -> Device.id" }
      - { name: lead_investigator_id, type: string, source: system, default: null, description: "FK -> Inspector.id; set on open-investigation" }
      - { name: severity, type: enum, source: input, description: "MINOR | MODERATE | SEVERE | FATAL" }
      - { name: occurred_period, type: integer, source: input, description: "Period index the accident occurred" }
      - { name: description, type: string, source: input, description: "Accident narrative" }
      - { name: provisional_risk_score, type: integer, source: computed, description: "SEVERITY_WEIGHT[severity]; computed at report (dual-variant calc accident_risk_score, provisional)" }
      - { name: final_risk_score, type: integer, source: computed, default: null, description: "Computed at close from finding + device risk_class + open critical deficiencies (dual-variant calc accident_risk_score, final)" }
      - { name: status, type: enum, source: system, description: "REPORTED | UNDER_INVESTIGATION | SUBSTANTIATED | UNSUBSTANTIATED", constraints: "branching finding per AccidentReport state machine" }

# =============================================================================
# Table 1.2 — State Machine Table
# =============================================================================
state_machines:
  - entity: Device
    initial_state: REGISTERED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: REGISTERED
        to: ACTIVE
        trigger: "POST /devices/{id}/activate"
        actor: Registrar
        preconditions:
          - "Device is REGISTERED (ERR_DEVICE_NOT_REGISTERED)"
          - "The device's REGISTRATION FeeInvoice is PAID (ERR_REGISTRATION_FEE_UNPAID)"
        side_effects: []
      - from: ACTIVE
        to: OUT_OF_SERVICE
        trigger: "system — an OutOfServiceOrder becomes ACTIVE on this device"
        actor: system
        preconditions:
          - "Device status IN {REGISTERED, ACTIVE}"
        side_effects:
          - "active_oos_count += 1"
          - "The device's active certificate (ISSUED or POSTED) transitions to SUSPENDED"
        note: "Also fires from REGISTERED when an OOS order is created against a not-yet-activated device"
      - from: OUT_OF_SERVICE
        to: ACTIVE
        trigger: "system — the last ACTIVE OutOfServiceOrder on this device is LIFTED"
        actor: system
        preconditions:
          - "active_oos_count reaches 0 after the lift"
        side_effects:
          - "A SUSPENDED certificate for this device transitions back to POSTED (reinstated)"
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "POST /devices/{id}/decommission"
        actor: Registrar | SafetyAdministrator
        preconditions:
          - "Device status IN {REGISTERED, ACTIVE, OUT_OF_SERVICE} (ERR_DEVICE_ALREADY_DECOMMISSIONED)"
        side_effects:
          - "All SCHEDULED or ASSIGNED inspections for the device transition to CANCELLED (cascade); each cancel from ASSIGNED decrements the inspector's active_assignment_count"
      - from: REGISTERED
        to: DECOMMISSIONED
        trigger: "POST /devices/{id}/decommission"
        actor: Registrar | SafetyAdministrator
        preconditions:
          - "Device status IN {REGISTERED, ACTIVE, OUT_OF_SERVICE} (ERR_DEVICE_ALREADY_DECOMMISSIONED)"
        side_effects:
          - "All SCHEDULED or ASSIGNED inspections for the device transition to CANCELLED (cascade)"
      - from: OUT_OF_SERVICE
        to: DECOMMISSIONED
        trigger: "POST /devices/{id}/decommission"
        actor: Registrar | SafetyAdministrator
        preconditions:
          - "Device status IN {REGISTERED, ACTIVE, OUT_OF_SERVICE} (ERR_DEVICE_ALREADY_DECOMMISSIONED)"
        side_effects:
          - "All SCHEDULED or ASSIGNED inspections for the device transition to CANCELLED (cascade)"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, CONDITIONAL, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ASSIGNED
        trigger: "POST /inspections/{id}/assign"
        actor: Registrar
        preconditions:
          - "Inspection is SCHEDULED (ERR_INSPECTION_NOT_SCHEDULED)"
          - "Inspector is certified for device.category and current_period_index <= inspector.license_expiry_period (ERR_INSPECTOR_NOT_CERTIFIED)"
          - "The inspection's [scheduled_start_period, scheduled_end_period) window, expanded by INSPECTION_BUFFER_PERIODS on each side, does not overlap any other ASSIGNED/IN_PROGRESS inspection window of the same inspector (ERR_INSPECTOR_SCHEDULE_CONFLICT)"
        side_effects:
          - "assigned_inspector_id set"
          - "inspector.active_assignment_count += 1"
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /inspections/{id}/start"
        actor: LicensedInspector
        preconditions:
          - "Acting inspector is the assigned_inspector_id (ERR_NOT_RESOURCE_OWNER)"
          - "Inspection is ASSIGNED (ERR_INSPECTION_NOT_ASSIGNED)"
          - "Device.status NOT IN {OUT_OF_SERVICE, DECOMMISSIONED} (ERR_DEVICE_NOT_OPERABLE)"
        side_effects: []
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /inspections/{id}/complete (result=PASS)"
        actor: LicensedInspector
        preconditions:
          - "Acting inspector is the assigned_inspector_id (ERR_NOT_RESOURCE_OWNER)"
          - "Inspection is IN_PROGRESS (ERR_INSPECTION_NOT_IN_PROGRESS)"
          - "result=PASS carries an empty deficiencies list (ERR_PASS_WITH_DEFICIENCIES)"
        side_effects:
          - "performed_period = current_period_index"
          - "inspector.active_assignment_count -= 1"
          - "device.next_inspection_due_period = performed_period + INTERVAL_MONTHS[device.category]"
      - from: IN_PROGRESS
        to: CONDITIONAL
        trigger: "POST /inspections/{id}/complete (result=CONDITIONAL)"
        actor: LicensedInspector
        preconditions:
          - "Acting inspector is the assigned_inspector_id (ERR_NOT_RESOURCE_OWNER)"
          - "Inspection is IN_PROGRESS (ERR_INSPECTION_NOT_IN_PROGRESS)"
          - "deficiencies list is non-empty and contains no CRITICAL severity (ERR_INVALID_REQUEST)"
        side_effects:
          - "performed_period = current_period_index"
          - "inspector.active_assignment_count -= 1"
          - "One Deficiency (status OPEN) created per deficiencies[] entry; device stays operable"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /inspections/{id}/complete (result=FAIL)"
        actor: LicensedInspector
        preconditions:
          - "Acting inspector is the assigned_inspector_id (ERR_NOT_RESOURCE_OWNER)"
          - "Inspection is IN_PROGRESS (ERR_INSPECTION_NOT_IN_PROGRESS)"
          - "deficiencies list is non-empty (ERR_FAIL_WITHOUT_DEFICIENCIES)"
        side_effects:
          - "performed_period = current_period_index"
          - "inspector.active_assignment_count -= 1"
          - "One Deficiency (status OPEN) created per deficiencies[] entry"
          - "CASCADE (depth>=3): for each CRITICAL deficiency created, a Citation is auto-issued (deficiency -> CITED); that citation auto-creates an ACTIVE OutOfServiceOrder (reason CRITICAL_DEFICIENCY, effective_start_period=current_period_index, effective_end_period=current_period_index + INTERVAL_MONTHS[device.category]); that order drives device -> OUT_OF_SERVICE and the active certificate -> SUSPENDED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /inspections/{id}/cancel"
        actor: Registrar
        preconditions:
          - "Inspection status IN {SCHEDULED, ASSIGNED} (ERR_INSPECTION_NOT_CANCELLABLE)"
        side_effects: []
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /inspections/{id}/cancel"
        actor: Registrar
        preconditions:
          - "Inspection status IN {SCHEDULED, ASSIGNED} (ERR_INSPECTION_NOT_CANCELLABLE)"
        side_effects:
          - "inspector.active_assignment_count -= 1 (compensates the assign increment)"
          - "assigned_inspector_id cleared to null"

  - entity: Deficiency
    initial_state: OPEN
    terminal_states: [RESOLVED, WAIVED]
    transitions:
      - from: OPEN
        to: CITED
        trigger: "POST /citations (system side-effect of citation issuance)"
        actor: Registrar | SafetyAdministrator | system
        preconditions:
          - "Deficiency is OPEN (ERR_DEFICIENCY_NOT_OPEN)"
        side_effects:
          - "A Citation (status ISSUED) is created against this deficiency"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /deficiencies/{id}/resolve"
        actor: LicensedInspector
        preconditions:
          - "Deficiency status IN {OPEN, CITED} (ERR_DEFICIENCY_NOT_RESOLVABLE)"
        side_effects: []
      - from: CITED
        to: RESOLVED
        trigger: "POST /deficiencies/{id}/resolve"
        actor: LicensedInspector
        preconditions:
          - "Deficiency status IN {OPEN, CITED} (ERR_DEFICIENCY_NOT_RESOLVABLE)"
        side_effects: []
      - from: CITED
        to: WAIVED
        trigger: "system — the deficiency's citation is DISMISSED"
        actor: system
        preconditions:
          - "Deficiency is CITED"
        side_effects: []

  - entity: Citation
    initial_state: ISSUED
    terminal_states: [PAID, DISMISSED]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /citations/{id}/pay"
        actor: BuildingOwner
        preconditions:
          - "Acting owner owns the device (ERR_NOT_RESOURCE_OWNER)"
          - "Citation is ISSUED (ERR_CITATION_NOT_PAYABLE)"
        side_effects:
          - "device.outstanding_balance_cents -= surcharged_amount_cents"
      - from: ISSUED
        to: CONTESTED
        trigger: "POST /citations/{id}/contest"
        actor: BuildingOwner
        preconditions:
          - "Acting owner owns the device (ERR_NOT_RESOURCE_OWNER)"
          - "Citation is ISSUED (ERR_CITATION_NOT_CONTESTABLE)"
        side_effects:
          - "contest_count += 1"
      - from: CONTESTED
        to: ISSUED
        trigger: "POST /citations/{id}/resolve-contest (outcome=UPHELD)"
        actor: SafetyAdministrator
        preconditions:
          - "Citation is CONTESTED (ERR_CITATION_NOT_CONTESTED)"
        side_effects: []
        note: "Cyclic: an UPHELD contest returns the citation to ISSUED and it may be contested again"
      - from: CONTESTED
        to: DISMISSED
        trigger: "POST /citations/{id}/resolve-contest (outcome=DISMISSED)"
        actor: SafetyAdministrator
        preconditions:
          - "Citation is CONTESTED (ERR_CITATION_NOT_CONTESTED)"
        side_effects:
          - "device.outstanding_balance_cents -= surcharged_amount_cents (compensates the issuance debit exactly)"
          - "The linked deficiency transitions CITED -> WAIVED"

  - entity: Certificate
    initial_state: ISSUED
    terminal_states: [REVOKED, SUPERSEDED, EXPIRED]
    transitions:
      - from: ISSUED
        to: POSTED
        trigger: "POST /certificates/{id}/post"
        actor: BuildingOwner
        preconditions:
          - "Acting owner owns the device (ERR_NOT_RESOURCE_OWNER)"
          - "Certificate is ISSUED (ERR_CERTIFICATE_NOT_POSTABLE)"
        side_effects:
          - "posted_period = current_period_index"
      - from: ISSUED
        to: SUSPENDED
        trigger: "system — device goes OUT_OF_SERVICE"
        actor: system
        preconditions: ["Certificate is the device's active certificate"]
        side_effects: []
      - from: POSTED
        to: SUSPENDED
        trigger: "system — device goes OUT_OF_SERVICE"
        actor: system
        preconditions: ["Certificate is the device's active certificate"]
        side_effects: []
      - from: SUSPENDED
        to: POSTED
        trigger: "system — last ACTIVE OutOfServiceOrder lifted; device returns to ACTIVE"
        actor: system
        preconditions: ["Certificate was POSTED before suspension"]
        side_effects: []
        note: "Cyclic suspend/reinstate; a certificate suspended while merely ISSUED is REVOKED instead of reinstated"
      - from: SUSPENDED
        to: REVOKED
        trigger: "system — last ACTIVE OutOfServiceOrder lifted; certificate had not been POSTED"
        actor: system
        preconditions: ["Certificate was ISSUED (never POSTED) before suspension"]
        side_effects: []
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system — a newer Certificate is issued for the device"
        actor: system
        preconditions: ["Certificate is the device's active certificate"]
        side_effects: []
      - from: POSTED
        to: SUPERSEDED
        trigger: "system — a newer Certificate is issued for the device"
        actor: system
        preconditions: ["Certificate is the device's active certificate"]
        side_effects: []

  - entity: OutOfServiceOrder
    initial_state: ACTIVE
    terminal_states: [LIFTED]
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /out-of-service-orders/{id}/lift"
        actor: SafetyAdministrator
        preconditions:
          - "Order is ACTIVE (ERR_OOS_ORDER_NOT_ACTIVE)"
        side_effects:
          - "lifted_period = current_period_index"
          - "device.active_oos_count -= 1"
          - "If device.active_oos_count reaches 0: device -> ACTIVE and a SUSPENDED certificate is reinstated per the Certificate state machine"

  - entity: FeeInvoice
    initial_state: PENDING
    terminal_states: [PAID]
    transitions:
      - from: PENDING
        to: OVERDUE
        trigger: "system — invoice observed with current_period_index > due_period while still unpaid"
        actor: system
        preconditions: ["Invoice is PENDING"]
        side_effects: []
        note: "OVERDUE is a read-time reclassification; it does not change amount_cents until pay finalizes the calculation"
      - from: PENDING
        to: PAID
        trigger: "POST /fee-invoices/{id}/pay"
        actor: BuildingOwner
        preconditions:
          - "Acting owner owns the device (ERR_NOT_RESOURCE_OWNER)"
          - "Invoice status IN {PENDING, OVERDUE} (ERR_INVOICE_NOT_PAYABLE)"
        side_effects:
          - "amount_cents recomputed to final (adds late penalty when paid_period > due_period)"
          - "paid_period = current_period_index"
          - "device.outstanding_balance_cents adjusted by the final amount removed from the unpaid set"
      - from: OVERDUE
        to: PAID
        trigger: "POST /fee-invoices/{id}/pay"
        actor: BuildingOwner
        preconditions:
          - "Acting owner owns the device (ERR_NOT_RESOURCE_OWNER)"
          - "Invoice status IN {PENDING, OVERDUE} (ERR_INVOICE_NOT_PAYABLE)"
        side_effects:
          - "amount_cents recomputed to final (adds late penalty when paid_period > due_period)"
          - "paid_period = current_period_index"
          - "device.outstanding_balance_cents adjusted by the final amount removed from the unpaid set"

  - entity: AccidentReport
    initial_state: REPORTED
    terminal_states: [SUBSTANTIATED, UNSUBSTANTIATED]
    transitions:
      - from: REPORTED
        to: UNDER_INVESTIGATION
        trigger: "POST /accident-reports/{id}/open-investigation"
        actor: SafetyAdministrator
        preconditions:
          - "Report is REPORTED (ERR_ACCIDENT_NOT_REPORTED)"
          - "lead_investigator_id is a certified, unexpired Inspector (ERR_INSPECTOR_NOT_CERTIFIED)"
          - "SEGREGATION OF DUTIES: lead_investigator_id is NOT the assigned_inspector_id of any Inspection of this device whose status IN {ASSIGNED, IN_PROGRESS} (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "lead_investigator_id set"
          - "CASCADE (depth>=2): an ACTIVE OutOfServiceOrder (reason ACCIDENT, effective_start_period=current_period_index, effective_end_period=current_period_index + INTERVAL_MONTHS[device.category]) is created; that order drives device -> OUT_OF_SERVICE and the active certificate -> SUSPENDED"
      - from: UNDER_INVESTIGATION
        to: SUBSTANTIATED
        trigger: "POST /accident-reports/{id}/close (finding=SUBSTANTIATED)"
        actor: LicensedInspector
        preconditions:
          - "Acting inspector is the lead_investigator_id (ERR_NOT_RESOURCE_OWNER)"
          - "Report is UNDER_INVESTIGATION (ERR_ACCIDENT_NOT_UNDER_INVESTIGATION)"
        side_effects:
          - "final_risk_score = round_half_up(SEVERITY_WEIGHT[severity] * RISK_MULTIPLIER[device.risk_class]) + OPEN_CRITICAL_DEFICIENCY_BONUS * (count of device Deficiencies with severity CRITICAL and status IN {OPEN, CITED})"
          - "device.accident_risk_score = final_risk_score"
      - from: UNDER_INVESTIGATION
        to: UNSUBSTANTIATED
        trigger: "POST /accident-reports/{id}/close (finding=UNSUBSTANTIATED)"
        actor: LicensedInspector
        preconditions:
          - "Acting inspector is the lead_investigator_id (ERR_NOT_RESOURCE_OWNER)"
          - "Report is UNDER_INVESTIGATION (ERR_ACCIDENT_NOT_UNDER_INVESTIGATION)"
        side_effects:
          - "final_risk_score = round_half_up(SEVERITY_WEIGHT[severity] * UNSUBSTANTIATED_FACTOR)"
          - "device.accident_risk_score = final_risk_score"

# =============================================================================
# Table 1.2.1 — Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: certificate-issue-stale-device
    parent_entity: Device
    write_endpoint: "POST /certificates"
    occ_field: "expected_device_version"
    description: |
      Issuing a Certificate for a Device whose version has advanced since the
      client last observed it is rejected. Certificate issuance is a
      CREATE-with-supersede: the new certificate legitimately supersedes the
      device's prior active certificate and advances device.version. A request
      still carrying the pre-supersede version is therefore stale and rejected
      with a precondition failure.
    error_id: ERR_STALE_DEVICE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3 — Calculation Rules Table
# =============================================================================
calculations:
  - name: fee_amount
    trigger: "FeeInvoice creation (provisional) and POST /fee-invoices/{id}/pay (final)"
    algorithm: dual_variant_chronological
    formula: |
      base = BASE_RENEWAL_FEE_CENTS[device.category]   # REGISTRATION uses REGISTRATION_FEE_CENTS (flat)
      # provisional (at creation): assumes on-time payment
      provisional_amount = base
      # final (at pay): late penalty accrues only when strictly overdue
      months_overdue = max(0, paid_period - due_period)
      penalty = min(round_half_up(base * LATE_RATE_PER_MONTH * months_overdue),
                    round_half_up(base * LATE_CAP_RATIO))
      final_amount = base + penalty
    input_set: "A single FeeInvoice; paid_period is current_period_index at pay time."
    constants:
      REGISTRATION_FEE_CENTS: 10000
      LATE_RATE_PER_MONTH: 0.10
      LATE_CAP_RATIO: 1.0
      BASE_RENEWAL_FEE_CENTS: "{ PASSENGER_ELEVATOR: 30000, FREIGHT_ELEVATOR: 25000, ESCALATOR: 40000, MOVING_WALK: 35000, DUMBWAITER: 15000 }"
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "invoice creation"
        difference: "no penalty; equals base fee for the category/type"
      - name: final
        when: "at pay; paid_period strictly greater than due_period"
        difference: "adds penalty = min(base*0.10*months_overdue, base) accrued on months strictly past due_period"

  - name: accident_risk_score
    trigger: "AccidentReport creation (provisional) and POST /accident-reports/{id}/close (final)"
    algorithm: dual_variant_weighted_scoring
    formula: |
      provisional = SEVERITY_WEIGHT[severity]
      # final depends on the branching finding:
      if finding == SUBSTANTIATED:
        final = round_half_up(SEVERITY_WEIGHT[severity] * RISK_MULTIPLIER[device.risk_class])
                + OPEN_CRITICAL_DEFICIENCY_BONUS * (count of device Deficiencies with severity==CRITICAL and status IN {OPEN, CITED})
      else:  # UNSUBSTANTIATED
        final = round_half_up(SEVERITY_WEIGHT[severity] * UNSUBSTANTIATED_FACTOR)
    input_set: "One AccidentReport plus, for the substantiated branch, the device's OPEN/CITED CRITICAL deficiencies."
    constants:
      SEVERITY_WEIGHT: "{ MINOR: 10, MODERATE: 30, SEVERE: 60, FATAL: 100 }"
      RISK_MULTIPLIER: "{ HIGH: 1.5, MEDIUM: 1.2, LOW: 1.0 }"
      UNSUBSTANTIATED_FACTOR: 0.25
      OPEN_CRITICAL_DEFICIENCY_BONUS: 20
    precision: "integer points, round_half_up"
    variants:
      - name: provisional
        when: "at report"
        difference: "severity weight only; no device-risk multiplier, no deficiency bonus"
      - name: final
        when: "at close"
        difference: "substantiated multiplies by device risk_class and adds a per-open-critical-deficiency bonus; unsubstantiated discounts to 25% of the weight"

  - name: citation_fine
    trigger: "POST /citations (and the auto-issue cascade on inspection FAIL with CRITICAL)"
    algorithm: tiered_nonlinear
    formula: |
      base = BASE_FINE_CENTS[deficiency.severity]                 # input 1: severity tier
      risk_adjusted = round_half_up(base * RISK_MULTIPLIER[device.risk_class])   # input 2: device risk_class
      repeat_offense_count = count of Citations on the SAME device with status IN {ISSUED, CONTESTED, PAID} created before this one   # input 3
      repeat_surcharge = min(repeat_offense_count, REPEAT_SURCHARGE_CAP_COUNT) * REPEAT_SURCHARGE_CENTS
      fine_amount_cents = min(risk_adjusted + repeat_surcharge, FINE_CAP_CENTS)
      surcharged_amount_cents = round_half_up(fine_amount_cents * (1 + OUTSTANDING_INDEX_RATE))
    input_set: "One deficiency + its device + prior citations on that device (chronological count only, never id-based)."
    constants:
      BASE_FINE_CENTS: "{ MINOR: 5000, MAJOR: 20000, CRITICAL: 50000 }"
      RISK_MULTIPLIER: "{ HIGH: 1.5, MEDIUM: 1.2, LOW: 1.0 }"
      REPEAT_SURCHARGE_CENTS: 10000
      REPEAT_SURCHARGE_CAP_COUNT: 3
      FINE_CAP_CENTS: 100000
      OUTSTANDING_INDEX_RATE: 0.0725
    precision: "integer cents, round_half_up; nested min caps the total at FINE_CAP_CENTS"

  - name: device_outstanding_balance_cents
    trigger: "any Citation or FeeInvoice status change affecting the unpaid set"
    algorithm: aggregation_rounding_order
    formula: |
      # ROUNDING ORDER IS PINNED: round each citation's surcharge to whole cents
      # FIRST (surcharged_amount_cents is persisted per citation), THEN sum.
      # (sum-then-round is explicitly NOT used and yields a different total.)
      citations_part = sum over Citations with status IN {ISSUED, CONTESTED} of citation.surcharged_amount_cents
      fees_part      = sum over FeeInvoices with status IN {PENDING, OVERDUE} of invoice.amount_cents
      device.outstanding_balance_cents = citations_part + fees_part
    input_set: "Device's Citations in {ISSUED, CONTESTED} and FeeInvoices in {PENDING, OVERDUE}."
    constants:
      OUTSTANDING_INDEX_RATE: 0.0725
    precision: "integer cents; per-citation round_half_up performed before summation"

  - name: certificate_expiry_period
    trigger: "POST /certificates"
    algorithm: interval_selection
    formula: |
      expiry_period = issue_period + INTERVAL_MONTHS[device.category]
    input_set: "One certificate + its device category."
    constants:
      INTERVAL_MONTHS: "{ PASSENGER_ELEVATOR: 12, FREIGHT_ELEVATOR: 12, ESCALATOR: 6, MOVING_WALK: 6, DUMBWAITER: 24 }"
    precision: "integer period index"

  - name: next_inspection_due_period
    trigger: "inspection completion with result PASS"
    algorithm: interval_selection
    formula: |
      device.next_inspection_due_period = performed_period + INTERVAL_MONTHS[device.category]
    input_set: "The latest PASSED inspection for the device."
    constants:
      INTERVAL_MONTHS: "{ PASSENGER_ELEVATOR: 12, FREIGHT_ELEVATOR: 12, ESCALATOR: 6, MOVING_WALK: 6, DUMBWAITER: 24 }"
    precision: "integer period index"

  - name: device_risk_class
    trigger: "device registration (risk_class derivation)"
    algorithm: classification
    formula: |
      device.risk_class = RISK_CLASS[device.category]
    input_set: "One device's category enum value."
    constants:
      RISK_CLASS: "{ PASSENGER_ELEVATOR: HIGH, FREIGHT_ELEVATOR: MEDIUM, ESCALATOR: HIGH, MOVING_WALK: MEDIUM, DUMBWAITER: LOW }"
    precision: "enum HIGH | MEDIUM | LOW; feeds RISK_MULTIPLIER lookups in citation_fine and accident_risk_score"

  - name: deficiency_resolution_due_period
    trigger: "Deficiency creation during inspection completion"
    algorithm: interval_selection
    formula: |
      deficiency.resolution_due_period = inspection.performed_period + RESOLUTION_GRACE_MONTHS[deficiency.severity]
    input_set: "One deficiency + its parent inspection's performed_period."
    constants:
      RESOLUTION_GRACE_MONTHS: "{ MINOR: 6, MAJOR: 3, CRITICAL: 1 }"
    precision: "integer period index"

  - name: citation_due_period
    trigger: "POST /citations (citation issuance)"
    algorithm: interval_selection
    formula: |
      citation.due_period = citation.issued_period + CITATION_DUE_GRACE_MONTHS
    input_set: "One citation's issued_period."
    constants:
      CITATION_DUE_GRACE_MONTHS: 2
    precision: "integer period index"

  - name: inspector_schedule_conflict_window
    trigger: "POST /inspections/{id}/assign (inspector schedule-overlap precondition)"
    algorithm: interval_overlap
    formula: |
      # Half-open windows [scheduled_start_period, scheduled_end_period) expanded by
      # INSPECTION_BUFFER_PERIODS on each side. A new assignment conflicts with an existing
      # ASSIGNED/IN_PROGRESS inspection of the same inspector iff:
      #   new.scheduled_start_period < existing.scheduled_end_period + INSPECTION_BUFFER_PERIODS
      #   AND existing.scheduled_start_period < new.scheduled_end_period + INSPECTION_BUFFER_PERIODS
    input_set: "The candidate inspection window vs. the inspector's ASSIGNED/IN_PROGRESS windows."
    constants:
      INSPECTION_BUFFER_PERIODS: 1
    precision: "integer period index arithmetic; boundary is strict '<'"

# =============================================================================
# Table 1.4 — Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted for this operation per the RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "All resource ids in the path exist (validated left-to-right)"
    error_id: "ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: all resource endpoints
  - priority: 4
    category: business_referential
    check: "Referenced foreign-key ids in the body exist (owner_id, device_id, deficiency_id, source_inspection_id, assigned_inspector_id, lead_investigator_id, citation_id)"
    error_id: "ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: "all create/action endpoints carrying FK inputs"
  - priority: 5
    category: auth
    check: "For entity_backed actors, X-User-ID matches the resource's ownership field (BuildingOwner==device.owner_id; LicensedInspector==inspection.assigned_inspector_id or accident.lead_investigator_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "citation pay/contest, certificate post, fee pay, inspection start/complete, accident close"
  - priority: 6
    category: concurrency
    check: "expected_device_version equals the device's current version"
    error_id: ERR_STALE_DEVICE_VERSION
    http_status: 412
    applies_to: "POST /certificates"
  - priority: 7
    category: state
    check: "Target resource is in a state that permits the requested transition"
    error_id: "ERR_*_NOT_<STATE> (e.g. ERR_INSPECTION_NOT_SCHEDULED)"
    http_status: 409
    applies_to: "all action/transition endpoints"
  - priority: 8
    category: state
    check: "On POST /certificates the source inspection is PASSED (cross-entity state: Certificate depends on Inspection)"
    error_id: ERR_SOURCE_INSPECTION_NOT_PASSED
    http_status: 409
    applies_to: "POST /certificates"
  - priority: 9
    category: state
    check: "On POST /inspections/{id}/start the device is operable (NOT OUT_OF_SERVICE / DECOMMISSIONED) — cross-entity state: Inspection depends on Device"
    error_id: ERR_DEVICE_NOT_OPERABLE
    http_status: 409
    applies_to: "POST /inspections/{id}/start"
  - priority: 10
    category: business_safety
    check: "Assigned inspector is certified for device.category and license is unexpired"
    error_id: ERR_INSPECTOR_NOT_CERTIFIED
    http_status: 403
    applies_to: "POST /inspections/{id}/assign, POST /accident-reports/{id}/open-investigation"
  - priority: 11
    category: business_safety
    check: "Segregation of duties: accident lead is not a current routine inspector of the same device"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /accident-reports/{id}/open-investigation"
  - priority: 12
    category: business_safety
    check: "On POST /certificates the device has zero OPEN deficiencies (empty-set boundary)"
    error_id: ERR_OPEN_DEFICIENCIES_EXIST
    http_status: 409
    applies_to: "POST /certificates"
  - priority: 13
    category: business_temporal
    check: "OutOfServiceOrder effective window does not overlap (closed interval) any ACTIVE order on the same device"
    error_id: ERR_OOS_ORDER_OVERLAP
    http_status: 409
    applies_to: "POST /out-of-service-orders"
  - priority: 14
    category: business_temporal
    check: "Inspection window (half-open, +/- INSPECTION_BUFFER_PERIODS buffer) does not overlap the inspector's other ASSIGNED/IN_PROGRESS inspections"
    error_id: ERR_INSPECTOR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /inspections/{id}/assign"
  - priority: 15
    category: business_referential
    check: "On POST /certificates the source inspection's device_id equals the path/body device_id"
    error_id: ERR_INSPECTION_DEVICE_MISMATCH
    http_status: 409
    applies_to: "POST /certificates"
  - priority: 16
    category: business_fiscal
    check: "On POST /certificates the device.outstanding_balance_cents is 0"
    error_id: ERR_OUTSTANDING_BALANCE
    http_status: 402
    applies_to: "POST /certificates"
  - priority: 17
    category: business_fiscal
    check: "On POST /devices/{id}/activate the device's REGISTRATION FeeInvoice is PAID"
    error_id: ERR_REGISTRATION_FEE_UNPAID
    http_status: 402
    applies_to: "POST /devices/{id}/activate"

# =============================================================================
# Table 1.5 — API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving logical clock ----
  - method: POST
    path: "/_clock/set"
    description: "Set the logical clock's current_period_index to an absolute value. Server startup default is 0 (the fixed earliest instant); the clock never reads wall-clock time. Period indices are integer months."
    roles: [Registrar, SafetyAdministrator]
    code: 200
    input: ["to_period_index"]
    output: null
    side_effects: ["current_period_index = to_period_index"]

  # ---- Owners ----
  - method: POST
    path: "/owners"
    description: "Register a building/property owner"
    roles: [Registrar]
    code: 201
    input: ["name", "contact_email"]
    output: Owner
    side_effects: []
  - method: GET
    path: "/owners/{id}"
    description: "Get an owner"
    roles: [Registrar, SafetyAdministrator, LicensedInspector, BuildingOwner]
    code: 200
    input: []
    output: Owner
    side_effects: []

  # ---- Inspectors ----
  - method: POST
    path: "/inspectors"
    description: "Register a licensed inspector"
    roles: [Registrar]
    code: 201
    input: ["name", "license_number", "license_expiry_period", "certified_categories"]
    output: Inspector
    side_effects: ["active_assignment_count initialized to 0"]
  - method: GET
    path: "/inspectors/{id}"
    description: "Get an inspector"
    roles: [Registrar, SafetyAdministrator, LicensedInspector, BuildingOwner]
    code: 200
    input: []
    output: Inspector
    side_effects: []
  - method: GET
    path: "/inspectors"
    description: "List inspectors"
    roles: [Registrar, SafetyAdministrator]
    code: 200
    input: ["certified_category?", "limit?", "offset?"]
    output: "Inspector[]"
    side_effects: []

  # ---- Devices ----
  - method: POST
    path: "/devices"
    description: "Register a conveyance device with its category"
    roles: [Registrar]
    code: 201
    input: ["owner_id", "category", "location_description", "install_period"]
    output: Device
    side_effects:
      - "status = REGISTERED"
      - "risk_class computed from category"
      - "A REGISTRATION FeeInvoice (amount REGISTRATION_FEE_CENTS, PENDING, due_period = install_period) is auto-created; outstanding_balance_cents += that amount"
  - method: GET
    path: "/devices/{id}"
    description: "Get a device (includes computed balance, risk score, due period)"
    roles: [Registrar, SafetyAdministrator, LicensedInspector, BuildingOwner]
    code: 200
    input: []
    output: Device
    side_effects: []
  - method: GET
    path: "/devices"
    description: "List devices"
    roles: [Registrar, SafetyAdministrator, LicensedInspector, BuildingOwner]
    code: 200
    input: ["owner_id?", "status?", "category?", "limit?", "offset?"]
    output: "Device[]"
    side_effects: []
  - method: POST
    path: "/devices/{id}/activate"
    description: "Activate a registered device"
    roles: [Registrar]
    code: 200
    input: []
    output: Device
    side_effects: ["status REGISTERED -> ACTIVE"]
  - method: POST
    path: "/devices/{id}/decommission"
    description: "Permanently decommission a device"
    roles: [Registrar, SafetyAdministrator]
    code: 200
    input: []
    output: Device
    side_effects:
      - "status -> DECOMMISSIONED"
      - "cascade: SCHEDULED/ASSIGNED inspections -> CANCELLED; ASSIGNED cancels decrement inspector.active_assignment_count"

  # ---- Inspections ----
  - method: POST
    path: "/inspections"
    description: "Schedule an inspection for a device"
    roles: [Registrar]
    code: 201
    input: ["device_id", "type", "scheduled_start_period", "scheduled_end_period"]
    output: Inspection
    side_effects: ["status = SCHEDULED"]
  - method: GET
    path: "/inspections/{id}"
    description: "Get an inspection"
    roles: [Registrar, SafetyAdministrator, LicensedInspector, BuildingOwner]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: GET
    path: "/inspections"
    description: "List inspections (reverse-reachability for device_id and assigned_inspector_id FKs)"
    roles: [Registrar, SafetyAdministrator, LicensedInspector]
    code: 200
    input: ["device_id?", "assigned_inspector_id?", "status?", "limit?", "offset?"]
    output: "Inspection[]"
    side_effects: []
  - method: POST
    path: "/inspections/{id}/assign"
    description: "Assign a licensed inspector to a scheduled inspection"
    roles: [Registrar]
    code: 200
    input: ["assigned_inspector_id"]
    output: Inspection
    side_effects: ["status -> ASSIGNED", "inspector.active_assignment_count += 1"]
  - method: POST
    path: "/inspections/{id}/start"
    description: "Assigned inspector starts the inspection"
    roles: [LicensedInspector]
    code: 200
    input: []
    output: Inspection
    side_effects: ["status -> IN_PROGRESS"]
  - method: POST
    path: "/inspections/{id}/complete"
    description: "Complete an inspection with a branching result (PASS / FAIL / CONDITIONAL)"
    roles: [LicensedInspector]
    code: 200
    input: ["result", "deficiencies?"]
    output: Inspection
    side_effects:
      - "status -> PASSED | FAILED | CONDITIONAL"
      - "performed_period set; inspector.active_assignment_count -= 1"
      - "Deficiency rows created from deficiencies[] on FAIL/CONDITIONAL"
      - "PASS updates device.next_inspection_due_period"
      - "FAIL with CRITICAL deficiency triggers the depth>=3 citation/OOS cascade"
  - method: POST
    path: "/inspections/{id}/cancel"
    description: "Cancel a scheduled or assigned inspection"
    roles: [Registrar]
    code: 200
    input: []
    output: Inspection
    side_effects: ["status -> CANCELLED", "if was ASSIGNED: inspector.active_assignment_count -= 1 and assigned_inspector_id cleared"]

  # ---- Deficiencies ----
  - method: GET
    path: "/deficiencies/{id}"
    description: "Get a deficiency"
    roles: [Registrar, SafetyAdministrator, LicensedInspector, BuildingOwner]
    code: 200
    input: []
    output: Deficiency
    side_effects: []
  - method: GET
    path: "/deficiencies"
    description: "List deficiencies (reverse-reachability for inspection_id and device_id FKs)"
    roles: [Registrar, SafetyAdministrator, LicensedInspector, BuildingOwner]
    code: 200
    input: ["inspection_id?", "device_id?", "status?", "severity?", "limit?", "offset?"]
    output: "Deficiency[]"
    side_effects: []
  - method: POST
    path: "/deficiencies/{id}/resolve"
    description: "Mark a deficiency resolved"
    roles: [LicensedInspector]
    code: 200
    input: []
    output: Deficiency
    side_effects: ["status -> RESOLVED"]

  # ---- Citations ----
  - method: POST
    path: "/citations"
    description: "Issue a citation against an open deficiency"
    roles: [Registrar, SafetyAdministrator]
    code: 201
    input: ["deficiency_id"]
    output: Citation
    side_effects:
      - "status = ISSUED; deficiency -> CITED"
      - "fine_amount_cents and surcharged_amount_cents computed"
      - "device.outstanding_balance_cents += surcharged_amount_cents"
  - method: GET
    path: "/citations/{id}"
    description: "Get a citation"
    roles: [Registrar, SafetyAdministrator, LicensedInspector, BuildingOwner]
    code: 200
    input: []
    output: Citation
    side_effects: []
  - method: GET
    path: "/citations"
    description: "List citations (reverse-reachability for deficiency_id and device_id FKs)"
    roles: [Registrar, SafetyAdministrator, BuildingOwner]
    code: 200
    input: ["deficiency_id?", "device_id?", "status?", "limit?", "offset?"]
    output: "Citation[]"
    side_effects: []
  - method: POST
    path: "/citations/{id}/pay"
    description: "Owner pays a citation"
    roles: [BuildingOwner]
    code: 200
    input: []
    output: Citation
    side_effects: ["status -> PAID", "device.outstanding_balance_cents -= surcharged_amount_cents"]
  - method: POST
    path: "/citations/{id}/contest"
    description: "Owner contests a citation"
    roles: [BuildingOwner]
    code: 200
    input: []
    output: Citation
    side_effects: ["status -> CONTESTED", "contest_count += 1"]
  - method: POST
    path: "/citations/{id}/resolve-contest"
    description: "Safety administrator resolves a contested citation (UPHELD returns to ISSUED; DISMISSED voids it)"
    roles: [SafetyAdministrator]
    code: 200
    input: ["outcome"]
    output: Citation
    side_effects:
      - "UPHELD: status -> ISSUED"
      - "DISMISSED: status -> DISMISSED; device.outstanding_balance_cents -= surcharged_amount_cents; deficiency -> WAIVED"

  # ---- Certificates ----
  - method: POST
    path: "/certificates"
    description: "Issue an operating certificate from a passed inspection (supersedes the prior active certificate; OCC-guarded on device version)"
    roles: [Registrar]
    code: 201
    input: ["device_id", "source_inspection_id", "expected_device_version"]
    output: Certificate
    side_effects:
      - "prior active certificate -> SUPERSEDED"
      - "status = ISSUED; certificate_number minted; expiry_period computed"
      - "device.current_certificate_id set; if device REGISTERED -> ACTIVE"
      - "increments Device.version by 1"
  - method: GET
    path: "/certificates/{id}"
    description: "Get a certificate"
    roles: [Registrar, SafetyAdministrator, LicensedInspector, BuildingOwner]
    code: 200
    input: []
    output: Certificate
    side_effects: []
  - method: GET
    path: "/certificates"
    description: "List certificates (reverse-reachability for device_id and source_inspection_id FKs)"
    roles: [Registrar, SafetyAdministrator, LicensedInspector, BuildingOwner]
    code: 200
    input: ["device_id?", "source_inspection_id?", "status?", "limit?", "offset?"]
    output: "Certificate[]"
    side_effects: []
  - method: POST
    path: "/certificates/{id}/post"
    description: "Owner posts the certificate on the conveyance"
    roles: [BuildingOwner]
    code: 200
    input: []
    output: Certificate
    side_effects: ["status ISSUED -> POSTED", "posted_period set"]

  # ---- Out-of-service orders ----
  - method: POST
    path: "/out-of-service-orders"
    description: "Issue a shutdown / out-of-service order against a device"
    roles: [SafetyAdministrator]
    code: 201
    input: ["device_id", "reason", "effective_start_period", "effective_end_period", "citation_id?"]
    output: OutOfServiceOrder
    side_effects:
      - "status = ACTIVE; device.active_oos_count += 1"
      - "device -> OUT_OF_SERVICE; active certificate -> SUSPENDED"
  - method: GET
    path: "/out-of-service-orders/{id}"
    description: "Get an out-of-service order"
    roles: [Registrar, SafetyAdministrator, LicensedInspector, BuildingOwner]
    code: 200
    input: []
    output: OutOfServiceOrder
    side_effects: []
  - method: GET
    path: "/out-of-service-orders"
    description: "List out-of-service orders (reverse-reachability for device_id and citation_id FKs)"
    roles: [Registrar, SafetyAdministrator, LicensedInspector, BuildingOwner]
    code: 200
    input: ["device_id?", "citation_id?", "status?", "limit?", "offset?"]
    output: "OutOfServiceOrder[]"
    side_effects: []
  - method: POST
    path: "/out-of-service-orders/{id}/lift"
    description: "Lift an out-of-service order"
    roles: [SafetyAdministrator]
    code: 200
    input: []
    output: OutOfServiceOrder
    side_effects:
      - "status -> LIFTED; device.active_oos_count -= 1"
      - "if active_oos_count reaches 0: device -> ACTIVE and suspended certificate reinstated/revoked per rules"

  # ---- Fee invoices ----
  - method: POST
    path: "/fee-invoices"
    description: "Create a fee/renewal invoice for a device"
    roles: [Registrar]
    code: 201
    input: ["device_id", "type", "due_period"]
    output: FeeInvoice
    side_effects: ["status = PENDING; provisional amount_cents computed; device.outstanding_balance_cents += amount_cents"]
  - method: GET
    path: "/fee-invoices/{id}"
    description: "Get a fee invoice"
    roles: [Registrar, SafetyAdministrator, BuildingOwner]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: []
  - method: GET
    path: "/fee-invoices"
    description: "List fee invoices (reverse-reachability for device_id FK)"
    roles: [Registrar, SafetyAdministrator, BuildingOwner]
    code: 200
    input: ["device_id?", "status?", "type?", "limit?", "offset?"]
    output: "FeeInvoice[]"
    side_effects: []
  - method: POST
    path: "/fee-invoices/{id}/pay"
    description: "Owner pays a fee invoice (finalizes amount with any late penalty)"
    roles: [BuildingOwner]
    code: 200
    input: []
    output: FeeInvoice
    side_effects:
      - "amount_cents recomputed to final; paid_period set; status -> PAID"
      - "device.outstanding_balance_cents reduced by the final amount"

  # ---- Accident reports ----
  - method: POST
    path: "/accident-reports"
    description: "File an accident report for a device"
    roles: [SafetyAdministrator, BuildingOwner]
    code: 201
    input: ["device_id", "severity", "occurred_period", "description"]
    output: AccidentReport
    side_effects: ["status = REPORTED; provisional_risk_score computed"]
  - method: GET
    path: "/accident-reports/{id}"
    description: "Get an accident report"
    roles: [Registrar, SafetyAdministrator, LicensedInspector, BuildingOwner]
    code: 200
    input: []
    output: AccidentReport
    side_effects: []
  - method: GET
    path: "/accident-reports"
    description: "List accident reports (reverse-reachability for device_id and lead_investigator_id FKs)"
    roles: [Registrar, SafetyAdministrator, LicensedInspector, BuildingOwner]
    code: 200
    input: ["device_id?", "lead_investigator_id?", "status?", "limit?", "offset?"]
    output: "AccidentReport[]"
    side_effects: []
  - method: POST
    path: "/accident-reports/{id}/open-investigation"
    description: "Open an investigation and assign an independent lead investigator"
    roles: [SafetyAdministrator]
    code: 200
    input: ["lead_investigator_id"]
    output: AccidentReport
    side_effects:
      - "status -> UNDER_INVESTIGATION; lead_investigator_id set"
      - "cascade (depth>=2): auto-create ACTIVE OutOfServiceOrder (reason ACCIDENT) -> device OUT_OF_SERVICE -> active certificate SUSPENDED"
  - method: POST
    path: "/accident-reports/{id}/close"
    description: "Lead investigator closes the investigation with a branching finding"
    roles: [LicensedInspector]
    code: 200
    input: ["finding"]
    output: AccidentReport
    side_effects: ["status -> SUBSTANTIATED | UNSUBSTANTIATED", "final_risk_score computed; device.accident_risk_score updated"]

# =============================================================================
# Table 1.6 — Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role unknown" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "entity_backed actor's X-User-ID does not match the resource ownership field" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, bad enum, or type mismatch" }
  - { id: ERR_OWNER_NOT_FOUND, http: 404, condition: "owner_id does not exist" }
  - { id: ERR_INSPECTOR_NOT_FOUND, http: 404, condition: "inspector id does not exist" }
  - { id: ERR_DEVICE_NOT_FOUND, http: 404, condition: "device id does not exist" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "inspection id does not exist" }
  - { id: ERR_DEFICIENCY_NOT_FOUND, http: 404, condition: "deficiency id does not exist" }
  - { id: ERR_CITATION_NOT_FOUND, http: 404, condition: "citation id does not exist" }
  - { id: ERR_CERTIFICATE_NOT_FOUND, http: 404, condition: "certificate id does not exist" }
  - { id: ERR_OOS_ORDER_NOT_FOUND, http: 404, condition: "out-of-service order id does not exist" }
  - { id: ERR_FEE_INVOICE_NOT_FOUND, http: 404, condition: "fee invoice id does not exist" }
  - { id: ERR_ACCIDENT_NOT_FOUND, http: 404, condition: "accident report id does not exist" }
  - { id: ERR_STALE_DEVICE_VERSION, http: 412, condition: "expected_device_version does not match the device's current version" }
  - { id: ERR_DEVICE_NOT_REGISTERED, http: 409, condition: "activate called on a device not in REGISTERED" }
  - { id: ERR_DEVICE_ALREADY_DECOMMISSIONED, http: 409, condition: "decommission called on an already DECOMMISSIONED device" }
  - { id: ERR_DEVICE_NOT_OPERABLE, http: 409, condition: "inspection start requires device NOT in {OUT_OF_SERVICE, DECOMMISSIONED}" }
  - { id: ERR_INSPECTION_NOT_SCHEDULED, http: 409, condition: "assign requires inspection in SCHEDULED" }
  - { id: ERR_INSPECTION_NOT_ASSIGNED, http: 409, condition: "start requires inspection in ASSIGNED" }
  - { id: ERR_INSPECTION_NOT_IN_PROGRESS, http: 409, condition: "complete requires inspection in IN_PROGRESS" }
  - { id: ERR_INSPECTION_NOT_CANCELLABLE, http: 409, condition: "cancel requires inspection in {SCHEDULED, ASSIGNED}" }
  - { id: ERR_PASS_WITH_DEFICIENCIES, http: 409, condition: "result=PASS supplied with a non-empty deficiencies list" }
  - { id: ERR_FAIL_WITHOUT_DEFICIENCIES, http: 409, condition: "result=FAIL supplied with an empty deficiencies list" }
  - { id: ERR_INSPECTOR_NOT_CERTIFIED, http: 403, condition: "inspector not certified for device.category or license expired" }
  - { id: ERR_INSPECTOR_SCHEDULE_CONFLICT, http: 409, condition: "buffered half-open inspection window overlaps the inspector's other ASSIGNED/IN_PROGRESS windows" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "accident lead is a current routine inspector of the same device" }
  - { id: ERR_DEFICIENCY_NOT_OPEN, http: 409, condition: "citation issuance requires deficiency in OPEN" }
  - { id: ERR_DEFICIENCY_NOT_RESOLVABLE, http: 409, condition: "resolve requires deficiency in {OPEN, CITED}" }
  - { id: ERR_CITATION_NOT_PAYABLE, http: 409, condition: "pay requires citation in ISSUED" }
  - { id: ERR_CITATION_NOT_CONTESTABLE, http: 409, condition: "contest requires citation in ISSUED" }
  - { id: ERR_CITATION_NOT_CONTESTED, http: 409, condition: "resolve-contest requires citation in CONTESTED" }
  - { id: ERR_SOURCE_INSPECTION_NOT_PASSED, http: 409, condition: "certificate issuance requires the source inspection in PASSED" }
  - { id: ERR_INSPECTION_DEVICE_MISMATCH, http: 409, condition: "source inspection's device_id differs from the certificate's device_id" }
  - { id: ERR_OPEN_DEFICIENCIES_EXIST, http: 409, condition: "certificate issuance requires zero OPEN deficiencies on the device" }
  - { id: ERR_OUTSTANDING_BALANCE, http: 402, condition: "certificate issuance requires device.outstanding_balance_cents == 0" }
  - { id: ERR_REGISTRATION_FEE_UNPAID, http: 402, condition: "activate requires the REGISTRATION FeeInvoice to be PAID" }
  - { id: ERR_CERTIFICATE_NOT_POSTABLE, http: 409, condition: "post requires certificate in ISSUED" }
  - { id: ERR_OOS_ORDER_OVERLAP, http: 409, condition: "new order window overlaps (closed interval) an ACTIVE order on the same device" }
  - { id: ERR_OOS_ORDER_NOT_ACTIVE, http: 409, condition: "lift requires order in ACTIVE" }
  - { id: ERR_INVOICE_NOT_PAYABLE, http: 409, condition: "pay requires invoice in {PENDING, OVERDUE}" }
  - { id: ERR_ACCIDENT_NOT_REPORTED, http: 409, condition: "open-investigation requires report in REPORTED" }
  - { id: ERR_ACCIDENT_NOT_UNDER_INVESTIGATION, http: 409, condition: "close requires report in UNDER_INVESTIGATION" }
  - { id: ERR_INVALID_PAGINATION, http: 400, condition: "limit/offset out of allowed range" }

# =============================================================================
# Table 1.7 — RBAC Matrix
# =============================================================================
roles:
  - name: Registrar
    description: "Inspection-authority registrar: device registry & category, inspection scheduling & assignment, fee/renewal invoicing, certificate issuance."
    identity: opaque
    exclusive_operations:
      - "POST /owners"
      - "POST /inspectors"
      - "POST /devices"
      - "POST /devices/{id}/activate"
      - "POST /inspections"
      - "POST /inspections/{id}/assign"
      - "POST /inspections/{id}/cancel"
      - "POST /fee-invoices"
      - "POST /certificates"
    shared_operations:
      - "POST /_clock/set (with SafetyAdministrator)"
      - "POST /devices/{id}/decommission (with SafetyAdministrator)"
      - "POST /citations (with SafetyAdministrator)"
      - "GET reads across the registry"

  - name: LicensedInspector
    description: "Field inspector: performs inspections, records deficiencies, resolves them, leads accident investigations."
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /inspections/{id}/start"
      - "POST /inspections/{id}/complete"
      - "POST /deficiencies/{id}/resolve"
      - "POST /accident-reports/{id}/close"
    shared_operations:
      - "GET reads on inspections, deficiencies, devices, certificates, accident reports"

  - name: SafetyAdministrator
    description: "Safety oversight: shutdown/out-of-service orders, contest adjudication, accident investigation launch, overrides."
    identity: opaque
    exclusive_operations:
      - "POST /out-of-service-orders"
      - "POST /out-of-service-orders/{id}/lift"
      - "POST /citations/{id}/resolve-contest"
      - "POST /accident-reports/{id}/open-investigation"
    shared_operations:
      - "POST /_clock/set (with Registrar)"
      - "POST /devices/{id}/decommission (with Registrar)"
      - "POST /citations (with Registrar)"
      - "POST /accident-reports (with BuildingOwner)"
      - "GET reads across the registry"

  - name: BuildingOwner
    description: "Device owner: pays fees and citations, contests citations, posts certificates, files accident reports on owned devices."
    identity: "entity_backed:Owner"
    exclusive_operations:
      - "POST /citations/{id}/pay"
      - "POST /citations/{id}/contest"
      - "POST /certificates/{id}/post"
      - "POST /fee-invoices/{id}/pay"
    shared_operations:
      - "POST /accident-reports (with SafetyAdministrator)"
      - "GET reads on own devices, citations, fee invoices, certificates"


