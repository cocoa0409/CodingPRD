          - validations[priority=35]
          - state_machines.HopContract.ACTIVE_to_CARRY_FORWARD_PENDING
        distinguishing_aspect: "One error code covers three independent target defects — the source program itself, a program that skips a crop year, and the right crop year in the wrong status — and the successful roll proves the refusals were about the target rather than about the poundage, which is judged one priority later."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Five crop-year programs: 2026 and 2028 each HARVEST_REPORTED at 100.00 percent, 2027 and 2030 OPEN, 2029 SETTLED."
            - "One brewer holds contract A of 5000 lb in the 2026 program and contract B of 4000 lb in the 2028 program, both undrawn."
