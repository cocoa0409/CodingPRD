          Non-linear shape = a CYCLE on the OutcomeReport entity: SITE_VISIT_COMPLETED ->
          REVISION_REQUESTED -> SUBMITTED -> SITE_VISIT_SCHEDULED -> SITE_VISIT_COMPLETED loops
