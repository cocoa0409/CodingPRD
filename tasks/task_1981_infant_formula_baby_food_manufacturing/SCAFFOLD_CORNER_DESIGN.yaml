              as: SUPPLY_CHAIN_PLANNER
          trigger:
            - call: "POST /api/v1/allocation-entries/${entry_idem_id}/record-fulfillment"
              payload: { fulfilled_kg: 50.000 }
              as: SUPPLY_CHAIN_PLANNER
            - call: "POST /api/v1/allocation-entries/${entry_idem_id}/record-fulfillment"
              payload: { fulfilled_kg: 0.001 }
              as: SUPPLY_CHAIN_PLANNER
              captures: { err_idem: $.data.error_id }
          assert:
            - "First fulfillment succeeds"
            - "Second fulfillment returns error_id == ERR_FULFILLMENT_EXCEEDS_ALLOCATION (would exceed allocated_kg)"

  # =========================================================================
  # Section 3: Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: nutrient_compliance_standard_correct_result
        claim_type: correct_result
        grounds:
          - calculations.nutrient_compliance_check
        distinguishing_aspect: "A nutrient value exactly at the midpoint of the range passes under standard variant."
        test_recipe:
          setup:
            - "An APPROVED NutrientProfile with PROTEIN min=1.50, max=3.00, target=2.20."
          setup_api_calls:
            - call: "POST /api/v1/nutrient-profiles"
              payload:
                profile_code: "TODDLER-12-36M"
                nutrient_specs: [{nutrient_code: "PROTEIN", unit: "g", min_per_100kcal: 1.50, max_per_100kcal: 3.00, target_per_100kcal: 2.20}]
                regulation_ref: "21 CFR 107.100"
                effective_from: "2026-01-01T00:00:00Z"
              as: REGULATORY_AFFAIRS
              captures: { np_calc_id: $.data.id }
            - call: "POST /api/v1/nutrient-profiles/${np_calc_id}/submit"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/nutrient-profiles/${np_calc_id}/approve"
              payload: {}
              as: REGULATORY_AFFAIRS
          trigger:
            - call: "GET /api/v1/nutrient-profiles/${np_calc_id}"
              as: REGULATORY_AFFAIRS
              captures: { np_calc: $.data }
          assert:
            - "data.nutrient_specs[0].min_per_100kcal == 1.50"
            - "data.nutrient_specs[0].max_per_100kcal == 3.00"

      - name: audit_result_fail_on_critical_finding
        claim_type: correct_result
        grounds:
          - calculations.audit_result_determination
        distinguishing_aspect: "A CRITICAL finding overrides a high score to produce FAIL."
        test_recipe:
          setup:
            - "A PENDING_AUDIT Supplier exists."
          setup_api_calls:
            - call: "POST /api/v1/suppliers"
              payload:
                supplier_code: "SUP-CRIT"
                legal_name: "Critical Finding Supplier"
                ingredient_categories: ["DAIRY_BASE"]
                audit_frequency_days: 180
              as: QA_MANAGER
              captures: { sup_crit_id: $.data.id }
          trigger:
            - call: "POST /api/v1/suppliers/${sup_crit_id}/audits"
              payload:
                audit_type: "INITIAL"
                audit_date: "2026-07-01T00:00:00Z"
                auditor_name: "Critical Auditor"
                score: 95.00
                findings:
                  - finding_code: "F-001"
                    severity: "CRITICAL"
                    description: "Cronobacter detected in processing environment"
                    capa_required: true
              as: QUALITY_ANALYST
              captures: { audit_crit: $.data }
          assert:
            - "data.result == FAIL (CRITICAL finding overrides high score)"

      - name: supplier_risk_rating_low_for_high_recent_score
        claim_type: correct_result
        grounds:
          - calculations.supplier_risk_rating
        distinguishing_aspect: "A recent audit (30 days ago) with score 92 produces LOW risk rating."
        test_recipe:
          setup:
            - "A QUALIFIED Supplier exists with a recent audit."
            - "Clock is at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ADMIN
            - call: "POST /api/v1/suppliers"
              payload:
                supplier_code: "SUP-RISK"
                legal_name: "Risk Test Supplier"
                ingredient_categories: ["DAIRY_BASE"]
                audit_frequency_days: 180
              as: QA_MANAGER
              captures: { sup_risk_id: $.data.id }
          trigger:
            - call: "POST /api/v1/suppliers/${sup_risk_id}/audits"
              payload:
                audit_type: "INITIAL"
                audit_date: "2026-07-02T00:00:00Z"
                auditor_name: "Risk Auditor"
                score: 92.00
                findings: []
              as: QUALITY_ANALYST
            - call: "GET /api/v1/suppliers/${sup_risk_id}"
              as: QA_MANAGER
              captures: { sup_risk: $.data }
          assert:
            - "data.qualification_status == QUALIFIED"
            - "data.risk_rating == LOW (92 * recency_factor >= 80)"

      - name: batch_expiry_calculation_dry_blend_bonus
        claim_type: correct_result
        grounds:
          - calculations.batch_expiry_calculation
        distinguishing_aspect: "DRY_BLEND formula with INF-0-6M profile gets 24+3=27 months shelf life."
        test_recipe:
          setup:
            - "An APPROVED NutrientProfile INF-0-6M exists."
          setup_api_calls:
            - call: "POST /api/v1/nutrient-profiles"
              payload:
                profile_code: "INF-0-6M"
                nutrient_specs: [{nutrient_code: "P", unit: "g", min_per_100kcal: 1.80, max_per_100kcal: 3.50, target_per_100kcal: 2.50}]
                regulation_ref: "21 CFR 107.100"
                effective_from: "2026-01-01T00:00:00Z"
              as: REGULATORY_AFFAIRS
              captures: { np_exp_id: $.data.id }
            - call: "POST /api/v1/nutrient-profiles/${np_exp_id}/submit"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/nutrient-profiles/${np_exp_id}/approve"
              payload: {}
              as: REGULATORY_AFFAIRS
          trigger:
            - call: "GET /api/v1/nutrient-profiles/${np_exp_id}"
              as: REGULATORY_AFFAIRS
              captures: { np_exp: $.data }
          assert:
            - "data.profile_code == INF-0-6M (dry blend bonus +3 months applies)"

  # =========================================================================
  # Section 4: Validations
  # =========================================================================
  - section: validations
    instances:
      - name: unauthenticated_request_returns_401
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Missing X-User-Role header returns 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /api/v1/nutrient-profiles"
              as: ANONYMOUS_NO_HEADERS
              captures: { err_auth: $.data.error_id }
          assert:
            - "HTTP status == 401"
            - "error_id == ERR_UNAUTHENTICATED"

      - name: unauthorized_role_returns_403
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "COMPLAINT_HANDLER attempting to create a NutrientProfile returns 403 ERR_UNAUTHORIZED."
