        distinguishing_aspect: "delivery_readiness_posture is a pure function of the allocation unit's status and the fee coverage, so a capped payment yields READY while an order whose fee is only partly settled yields RESTRICTED at the same allocation state."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; two orders on the same batch and the same center, one fully paid and one carrying a partial ledger posting only."
