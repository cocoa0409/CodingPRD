# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1–§1.7. Every setup_api_calls chain is executable from
# empty-DB using only §1.5 (flat top-level) endpoints. All formula-derived
# asserts are literals computed against §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: trade_equity_applied_vs_dealer_book
        grounds:
          - calculations.net_trade_equity
          - entities.Deal.fields.net_trade_equity_cents
          - entities.Deal.fields.dealer_book_equity_cents
          - entities.Deal.fields.trade_recon_cost_cents
        distinguishing_aspect: |
          Same trade inputs feed two variants on the Deal domain: applied_equity_quote
          credits the buyer trade_allowance-trade_payoff (1500000), while dealer_book_equity
          subtracts recon (1200000); the two diverge by exactly trade_recon_cost_cents=300000.
        test_recipe:
          setup:
            - "Dealership doc 29900 tax 725bps; one customer; one stock unit list 8000000"
            - "A deal with a trade appraised: allowance 2000000, payoff 500000, recon 300000, quoted"
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Pioneer RV", state_code: "TX", doc_fee_cents: 29900, sales_tax_rate_bps: 725 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Ada Buyer", email: "ada@x.com", credit_tier: "STANDARD" }
              as: SalesAgent
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-SOLD-1", model_year: 2024, class_type: "CLASS_C", acquisition: "STOCK", list_price_cents: 8000000 }
              as: SalesAgent
              captures: { unit: $.data.id, unit_v: $.data.version }
            - call: "POST /deals"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", sale_price_cents: 8000000, expected_unit_version: "${unit_v}", down_payment_cents: 0 }
              as: SalesAgent
              captures: { deal: $.data.id }
            - call: "POST /deals/${deal}/appraise-trade"
              payload: { vin: "VIN-TRADE-1", model_year: 2018, class_type: "TRAVEL_TRAILER", list_price_cents: 2500000, trade_allowance_cents: 2000000, trade_payoff_cents: 500000, trade_recon_cost_cents: 300000 }
              as: SalesAgent
              captures: { trade_unit: $.data.id }
            - call: "POST /deals/${deal}/quote"
              payload: {}
              as: SalesAgent
          trigger:
            - call: "GET /deals/${deal}/equity-summary"
              payload: {}
              as: SalesAgent
              captures: { applied: $.data.net_trade_equity_cents, book: $.data.dealer_book_equity_cents }
          assert:
            - "Deal.${deal}.net_trade_equity_cents == 1500000"
            - "Deal.${deal}.dealer_book_equity_cents == 1200000"
            - "net_trade_equity_cents minus dealer_book_equity_cents == 300000 == trade_recon_cost_cents"

      - name: service_total_warranty_covered_vs_owed
        grounds:
          - calculations.service_order_total
          - calculations.net_trade_equity
          - entities.ServiceOrder.fields.total_cents
          - entities.ServiceOrder.fields.covered_cents
        distinguishing_aspect: |
          Dual-variant logic on two different entity domains: net_trade_equity is equity math
          on the Deal entity, whereas service_order_total is recon-cost accounting on the
          ServiceOrder entity, splitting the same gross into warranty-covered (300000) vs
          customer-owed (0) — not a repeat of the same provisional/final shape on one metric.
        test_recipe:
          setup:
            - "Dealership; customer; one unit; one EXTENDED warranty plan cap 300000 ded 0"
            - "A warranty service order labor 2.5h@12000 + part 1x270000, completed"
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Pioneer RV 2", state_code: "TX", doc_fee_cents: 29900, sales_tax_rate_bps: 725 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Ben Owner", email: "ben@x.com" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-SVC-1", model_year: 2024, class_type: "CLASS_A", acquisition: "STOCK", list_price_cents: 9000000 }
              as: SalesAgent
              captures: { unit: $.data.id }
            - call: "POST /warranty-plans"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", plan_kind: "EXTENDED", coverage_cap_cents: 300000, deductible_cents: 0 }
              as: SalesAgent
              captures: { plan: $.data.id }
            - call: "POST /part-items"
              payload: { dealership_id: "${did}", sku: "ALT-1", name: "Alternator", unit_price_cents: 270000, qty_on_hand: 5 }
              as: ServiceAdvisor
              captures: { part: $.data.id }
            - call: "POST /service-orders"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", labor_hours: 2.5, labor_rate_cents: 12000, is_warranty: true, warranty_plan_id: "${plan}" }
              as: ServiceAdvisor
              captures: { so: $.data.id }
            - call: "POST /service-orders/${so}/start"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /part-reservations"
              payload: { service_order_id: "${so}", part_item_id: "${part}", quantity: 1 }
              as: ServiceAdvisor
          trigger:
            - call: "POST /service-orders/${so}/complete"
              payload: {}
              as: ServiceAdvisor
              captures: { total: $.data.total_cents, covered: $.data.covered_cents }
          assert:
            - "ServiceOrder.${so}.covered_cents == 300000"
            - "ServiceOrder.${so}.total_cents == 0"
            - "WarrantyPlan.${plan}.status == EXHAUSTED (consumed 300000 == cap)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: amount_financed_pinned_evaluation_order
        grounds:
          - calculations.deal_amount_due
          - entities.Deal.fields.tax_cents
          - entities.Deal.fields.amount_financed_cents
          - entities.Deal.fields.net_trade_equity_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with a pinned evaluation order — tax_cents
          depends on taxable_base = sale_price - net_trade_equity, and amount_financed depends
          on both tax and equity; the scaffold pins steps 1..5 so taxable base (6500000), tax
          (471250), and financed (7001150) are well-defined.
        test_recipe:
          setup:
            - "Dealership doc 29900 tax 725bps; deal sale 8000000, trade applied equity 1500000, down 0, quoted"
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Combo RV", state_code: "TX", doc_fee_cents: 29900, sales_tax_rate_bps: 725 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Cara Buyer", email: "cara@x.com" }
              as: SalesAgent
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-COMBO-1", model_year: 2024, class_type: "CLASS_C", acquisition: "STOCK", list_price_cents: 8000000 }
              as: SalesAgent
              captures: { unit: $.data.id, unit_v: $.data.version }
            - call: "POST /deals"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", sale_price_cents: 8000000, expected_unit_version: "${unit_v}", down_payment_cents: 0 }
              as: SalesAgent
              captures: { deal: $.data.id }
            - call: "POST /deals/${deal}/appraise-trade"
              payload: { vin: "VIN-COMBO-T", model_year: 2017, class_type: "FIFTH_WHEEL", list_price_cents: 2000000, trade_allowance_cents: 2000000, trade_payoff_cents: 500000, trade_recon_cost_cents: 300000 }
              as: SalesAgent
          trigger:
            - call: "POST /deals/${deal}/quote"
              payload: {}
              as: SalesAgent
              captures: { tax: $.data.tax_cents, af: $.data.amount_financed_cents }
          assert:
            - "Deal.${deal}.net_trade_equity_cents == 1500000"
            - "Deal.${deal}.tax_cents == 471250 (725bps of taxable base 6500000)"
            - "Deal.${deal}.amount_financed_cents == 7001150"

      - name: service_order_total_round_then_sum_labor
        grounds:
          - calculations.service_order_total
          - entities.ServiceOrder.fields.total_cents
          - entities.ServiceOrder.fields.parts_subtotal_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — labor (round_half_up(2.345h*10000) =
          23450) is rounded BEFORE summing with exact-integer parts (90100); the scaffold pins
          round-then-sum so the total is 113550, not a sum-then-round variant.
        test_recipe:
          setup:
            - "Dealership tax 0; unit; part 45050 qty 5; non-warranty service order labor 2.345h@10000 + 2x part, completed"
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Round RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Dan Owner", email: "dan@x.com" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-RND-1", model_year: 2023, class_type: "CLASS_B", acquisition: "STOCK", list_price_cents: 5000000 }
              as: SalesAgent
              captures: { unit: $.data.id }
            - call: "POST /part-items"
              payload: { dealership_id: "${did}", sku: "FILT-1", name: "Filter", unit_price_cents: 45050, qty_on_hand: 5 }
              as: ServiceAdvisor
              captures: { part: $.data.id }
            - call: "POST /service-orders"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", labor_hours: 2.345, labor_rate_cents: 10000 }
              as: ServiceAdvisor
              captures: { so: $.data.id }
            - call: "POST /service-orders/${so}/start"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /part-reservations"
              payload: { service_order_id: "${so}", part_item_id: "${part}", quantity: 2 }
              as: ServiceAdvisor
          trigger:
            - call: "POST /service-orders/${so}/complete"
              payload: {}
              as: ServiceAdvisor
              captures: { total: $.data.total_cents }
          assert:
            - "ServiceOrder.${so}.parts_subtotal_cents == 90100"
            - "ServiceOrder.${so}.total_cents == 113550 (labor 23450 rounded first + parts 90100)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: deal_parallel_finance_and_sale_dimensions
        grounds:
          - state_machines.Deal.finance_status=REQUESTED_to_finance_status=DECLINED
          - state_machines.Deal.finance_status=DECLINED_to_finance_status=REQUESTED
          - state_machines.Deal.finance_status=REQUESTED_to_finance_status=APPROVED
          - entities.Deal.fields.finance_status
        distinguishing_aspect: |
          Deal carries two independent state axes: finance_status cycles
          REQUESTED->DECLINED->REQUESTED->APPROVED while sale_status stays QUOTED — a
          parallel-dimension non-linear machine on the Deal entity.
        test_recipe:
          setup:
            - "Quoted deal, finance requested with term 60, declined, resubmitted, approved"
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Cycle RV", state_code: "TX", doc_fee_cents: 29900, sales_tax_rate_bps: 725 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Eve Buyer", email: "eve@x.com", credit_tier: "PRIME" }
              as: SalesAgent
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-CYC-1", model_year: 2024, class_type: "CLASS_C", acquisition: "STOCK", list_price_cents: 6500000 }
              as: SalesAgent
              captures: { unit: $.data.id, unit_v: $.data.version }
            - call: "POST /deals"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", sale_price_cents: 6000000, expected_unit_version: "${unit_v}", down_payment_cents: 464900, term_months: 60 }
              as: SalesAgent
              captures: { deal: $.data.id }
            - call: "POST /deals/${deal}/quote"
              payload: {}
              as: SalesAgent
            - call: "POST /deals/${deal}/request-finance"
              payload: {}
              as: SalesAgent
            - call: "POST /deals/${deal}/finance-decision"
              payload: { decision: "DECLINE" }
              as: DealerManager
            - call: "POST /deals/${deal}/request-finance"
              payload: { term_months: 60 }
              as: SalesAgent
          trigger:
            - call: "POST /deals/${deal}/finance-decision"
              payload: { decision: "APPROVE" }
              as: DealerManager
              captures: { fs: $.data.finance_status, mp: $.data.monthly_payment_cents }
          assert:
            - "Deal.${deal}.finance_status == APPROVED"
            - "Deal.${deal}.sale_status == QUOTED (sale axis unchanged by the finance cycle)"
            - "Deal.${deal}.monthly_payment_cents == 115969 (PRIME 599bps, P=6000000, n=60)"

      - name: service_order_cyclic_awaiting_parts_loop
        grounds:
          - state_machines.ServiceOrder.IN_PROGRESS_to_AWAITING_PARTS
          - state_machines.ServiceOrder.AWAITING_PARTS_to_IN_PROGRESS
          - entities.ServiceOrder.fields.status
        distinguishing_aspect: |
          ServiceOrder is a cyclic machine on a different entity than Deal: it bounces
          IN_PROGRESS<->AWAITING_PARTS twice and is still resumable (A->B->A->B->A), proving
          the loop is re-enterable rather than a one-way pipeline.
        test_recipe:
          setup:
            - "An OPEN service order started, sent to AWAITING_PARTS and resumed twice"
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Loop RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Fay Owner", email: "fay@x.com" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-LOOP-1", model_year: 2022, class_type: "CLASS_C", acquisition: "STOCK", list_price_cents: 5000000 }
              as: SalesAgent
              captures: { unit: $.data.id }
            - call: "POST /service-orders"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", labor_hours: 1.0, labor_rate_cents: 10000 }
              as: ServiceAdvisor
              captures: { so: $.data.id }
            - call: "POST /service-orders/${so}/start"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /service-orders/${so}/await-parts"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /service-orders/${so}/resume"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /service-orders/${so}/await-parts"
              payload: {}
              as: ServiceAdvisor
          trigger:
            - call: "POST /service-orders/${so}/resume"
              payload: {}
              as: ServiceAdvisor
              captures: { st: $.data.status }
          assert:
            - "ServiceOrder.${so}.status == IN_PROGRESS after the second resume"
            - "ServiceOrder.${so}.version == 6 (1 create-baseline + 5 transitions: start, await, resume, await, resume)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: so_complete_warranty_exhaust_chain_depth3
        grounds:
          - state_machines.ServiceOrder.IN_PROGRESS_to_COMPLETED
          - calculations.service_order_total
          - entities.WarrantyPlan.fields.status
          - entities.WarrantyPlan.fields.consumed_cents
          - entities.PartItem.fields.qty_on_hand
        distinguishing_aspect: |
          Depth-3 chain triggered by ServiceOrder complete: complete -> PartReservation
          FULFILLED (mutates PartItem qty_on_hand/reserved) -> covered_cents settles ->
          WarrantyPlan.consumed_cents += covered -> plan crosses cap -> WarrantyPlan
          auto-transitions to EXHAUSTED. Each link is caused by the prior one.
        test_recipe:
          setup:
            - "Unit, EXTENDED plan cap 300000 ded 0, part 270000 qty 5, warranty SO labor 2.5h@12000 + 1 part, started, part reserved"
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Cascade RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Gil Owner", email: "gil@x.com" }
              as: SalesAgent
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-CAS-1", model_year: 2024, class_type: "CLASS_A", acquisition: "STOCK", list_price_cents: 9000000 }
              as: SalesAgent
              captures: { unit: $.data.id }
            - call: "POST /warranty-plans"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", plan_kind: "EXTENDED", coverage_cap_cents: 300000, deductible_cents: 0 }
              as: SalesAgent
              captures: { plan: $.data.id }
            - call: "POST /part-items"
              payload: { dealership_id: "${did}", sku: "ENG-1", name: "Engine Part", unit_price_cents: 270000, qty_on_hand: 5 }
              as: ServiceAdvisor
              captures: { part: $.data.id }
            - call: "POST /service-orders"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", labor_hours: 2.5, labor_rate_cents: 12000, is_warranty: true, warranty_plan_id: "${plan}" }
              as: ServiceAdvisor
              captures: { so: $.data.id }
            - call: "POST /service-orders/${so}/start"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /part-reservations"
              payload: { service_order_id: "${so}", part_item_id: "${part}", quantity: 1 }
              as: ServiceAdvisor
          trigger:
            - call: "POST /service-orders/${so}/complete"
              payload: {}
              as: ServiceAdvisor
          assert:
            - "PartItem.${part}.qty_on_hand == 4 and qty_reserved == 0 (reservation fulfilled)"
            - "WarrantyPlan.${plan}.consumed_cents == 300000"
            - "WarrantyPlan.${plan}.status == EXHAUSTED"

      - name: deal_cancel_releases_unit_hold_depth2
        grounds:
          - state_machines.Deal.sale_status IN {DRAFT,QUOTED,PDI_PENDING,WALKTHROUGH}_to_sale_status=CANCELLED
          - state_machines.Unit.HELD_to_AVAILABLE
          - entities.Unit.fields.status
          - entities.Unit.fields.active_hold_deal_id
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (Deal cancel, not ServiceOrder complete):
          cancel sets Deal.sale_status=CANCELLED -> that cancellation releases the Unit hold
          (HELD->AVAILABLE), clearing active_hold_deal_id and bumping Unit.version. The unit
          mutation is caused by the deal's cancellation link, not directly by the request.
        test_recipe:
          setup:
            - "A deal holding a unit (unit HELD), not yet delivered"
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Release RV", state_code: "TX", doc_fee_cents: 29900, sales_tax_rate_bps: 725 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Hal Buyer", email: "hal@x.com" }
              as: SalesAgent
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-REL-1", model_year: 2024, class_type: "CLASS_C", acquisition: "STOCK", list_price_cents: 7000000 }
              as: SalesAgent
              captures: { unit: $.data.id, unit_v: $.data.version }
            - call: "POST /deals"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", sale_price_cents: 7000000, expected_unit_version: "${unit_v}" }
              as: SalesAgent
              captures: { deal: $.data.id }
          trigger:
            - call: "POST /deals/${deal}/cancel"
              payload: {}
              as: SalesAgent
          assert:
            - "Deal.${deal}.sale_status == CANCELLED"
            - "Unit.${unit}.status == AVAILABLE"
            - "Unit.${unit}.active_hold_deal_id == null"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: stop_sale_recall_beats_state_on_deliver
        grounds:
          - validations[priority=7]
          - validations[priority=5]
          - errors[ERR_STOP_SALE_RECALL_OPEN]
          - errors[ERR_DEAL_BAD_SALE_STATE]
        distinguishing_aspect: |
          Pairs business_safety (priority 7, ERR_STOP_SALE_RECALL_OPEN) against state
          (priority 5, ERR_DEAL_BAD_SALE_STATE) on POST /deliver: a deal in WALKTHROUGH with
          pdi passed but under a STOP_SALE recall passes the state check and fails the safety
          check, so the safety error (higher business priority) surfaces.
        test_recipe:
          setup:
            - "Deal in WALKTHROUGH (pdi passed) whose unit becomes targeted by an OPEN STOP_SALE recall"
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Recall RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Ivy Buyer", email: "ivy@x.com" }
              as: SalesAgent
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-RC-1", model_year: 2024, class_type: "CLASS_C", acquisition: "STOCK", list_price_cents: 7000000 }
              as: SalesAgent
              captures: { unit: $.data.id, unit_v: $.data.version }
            - call: "POST /deals"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", sale_price_cents: 7000000, expected_unit_version: "${unit_v}" }
              as: SalesAgent
              captures: { deal: $.data.id }
            - call: "POST /deals/${deal}/quote"
              payload: {}
              as: SalesAgent
            - call: "POST /deals/${deal}/start-pdi"
              payload: {}
              as: SalesAgent
            - call: "POST /pdi-inspections"
              payload: { dealership_id: "${did}", deal_id: "${deal}", defects_found: 0 }
              as: ServiceAdvisor
            - call: "POST /recall-campaigns"
              payload: { dealership_id: "${did}", campaign_code: "RC-AX-1", target_class_type: "CLASS_C", target_model_year: 2024, severity: "STOP_SALE" }
              as: DealerManager
          trigger:
            - call: "POST /deals/${deal}/deliver"
              payload: {}
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STOP_SALE_RECALL_OPEN (409)"
            - "Deal.${deal}.sale_status == WALKTHROUGH (deliver rejected, unchanged)"

      - name: insufficient_parts_beats_invalid_request_on_reserve
        grounds:
          - validations[priority=10]
          - validations[priority=13]
          - errors[ERR_INSUFFICIENT_PARTS]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Pairs business_constraint capacity (priority 10, ERR_INSUFFICIENT_PARTS) against
          input validation (priority 13, ERR_INVALID_REQUEST) on POST /part-reservations — a
          different error-category pair than instance 1's safety-vs-state. With quantity
          exceeding qty_available but otherwise well-formed, the capacity error surfaces.
        test_recipe:
          setup:
            - "Part qty_on_hand 2; open service order started; reservation for quantity 5 requested"
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Parts RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
