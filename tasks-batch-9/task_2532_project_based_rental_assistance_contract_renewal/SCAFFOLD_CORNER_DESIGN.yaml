  - section: state_machines
    instances:
      - name: every_created_entity_opens_in_its_declared_initial_state
        claim_type: Initial State
        grounds:
          - state_machines.RenewalCase
          - state_machines.RentComparabilityStudy
          - state_machines.UtilityAllowanceAnalysis
          - state_machines.VoucherSubmission
          - state_machines.SpecialClaim
          - state_machines.TenantNotice
          - state_machines.TenantHousehold
        distinguishing_aspect: "Seven machines are asserted in one pass, including the two whose initial state is NOT a draft-like value: a TenantNotice is born ISSUED (there is no pre-issue state) and a TenantHousehold is born ACTIVE. The RenewalCase opens in two states at once, one per dimension, and both counters on the case (challenge/approver ids, candidate rents) open null."
        test_recipe:
          setup: ["Owner, property, contract; clock moved to 2026-12-01 so the case falls inside the renewal window."]
          setup_api_calls:
            - call: "POST /pbra/owners"
              payload: { legal_name: "Cedar Ridge Housing Partners LP", tin: "27-3310011", contact_email: "agent@cedarridge.example" }
              as: ContractAdministrator
              captures: { owner_id: $.data.id }
            - call: "POST /pbra/properties"
              payload: { owner_id: "${owner_id}", project_name: "Cedar Ridge Apartments", state_code: "IL", total_units: 24, assisted_unit_count: 20, published_fmr_cents: 126000, baseline_utility_allowance_cents: 11500, has_fha_insured_mortgage: false }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { property_id: $.data.id }
            - call: "POST /pbra/hap-contracts"
              payload: { property_id: "${property_id}", contract_type: "NEW_CONSTRUCTION", expiration_date: "2027-12-31", term_months: 12, contract_rent_per_unit_cents: 118000, monthly_debt_service_per_unit_cents: 32000, operating_expense_per_unit_cents: 61000, reserve_deposit_per_unit_cents: 4500, authorized_hap_budget_cents: 30000000 }
              as: ContractAdministrator
              captures: { contract_id: $.data.id, contract_version: $.data.version }
            - call: "POST /pbra/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: ContractAdministrator
          trigger:
            - call: "POST /pbra/renewal-cases"
              payload: { contract_id: "${contract_id}" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { case_id: $.data.id, rent_track: $.data.rent_track_status, notice_track: $.data.notice_track_status, opened: $.data.opened_on_date, days_to_exp: $.data.days_to_expiration_at_open, rcs_req: $.data.rcs_required, case_option: $.data.renewal_option, case_method: $.data.adjustment_method, case_approved: $.data.approved_rent_per_unit_cents }
            - call: "POST /pbra/renewal-cases/${case_id}/select-option"
              payload: { renewal_option: "OPTION_2_OCAF" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { rent_track_2: $.data.rent_track_status, rcs_req_2: $.data.rcs_required }
            - call: "POST /pbra/renewal-cases/${case_id}/elect-adjustment"
              payload: { adjustment_method: "OCAF" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { rent_track_3: $.data.rent_track_status, case_method_2: $.data.adjustment_method }
            - call: "POST /pbra/rent-comparability-studies"
              payload: { renewal_case_id: "${case_id}", appraiser_name: "Hollis Appraisal Group" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { study_state: $.data.state, study_round: $.data.challenge_round, study_accepted: $.data.accepted_comparable_count, study_market: $.data.estimated_market_rent_cents }
            - call: "POST /pbra/utility-allowance-analyses"
              payload: { property_id: "${property_id}", method: "FACTOR_BASED", effective_date: "2027-01-01", utility_rate_change_pct: 0.09 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { ua_state: $.data.state, ua_approver: $.data.approver_user_id, ua_applied: $.data.applied_on_date }
            - call: "POST /pbra/tenant-households"
              payload: { property_id: "${property_id}", unit_number: "101", household_name: "Alvarez", annual_adjusted_income_cents: 1800000, annual_gross_income_cents: 1920000, family_size: 3 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { hh_status: $.data.status }
            - call: "POST /pbra/voucher-submissions"
              payload: { contract_id: "${contract_id}", period_month: "2026-07", expected_contract_version: "${contract_version}" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { vs_state: $.data.state, vs_paid: $.data.paid_amount_cents }
            - call: "POST /pbra/special-claims"
              payload: { contract_id: "${contract_id}", claim_type: "UNPAID_RENT", unit_number: "101", claim_period_month: "2026-07", claimed_amount_cents: 90000, security_deposit_balance_cents: 20000 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { sc_state: $.data.state, sc_paid: $.data.paid_amount_cents }
            - call: "POST /pbra/tenant-notices"
              payload: { renewal_case_id: "${case_id}", notice_type: "RENEWAL_INTENT", effective_date: "2027-06-01" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { notice_status: $.data.status, notice_issued: $.data.issued_date, notice_lead: $.data.lead_days, notice_required: $.data.required_lead_days }
          assert:
            - "${rent_track} == TERMS_PENDING and ${notice_track} == NOTICES_PENDING"
            - "${opened} == 2026-12-01 and ${days_to_exp} == 395 and ${rcs_req} == false and ${case_option} == null and ${case_method} == null and ${case_approved} == null"
            - "${rent_track_2} == OPTION_SELECTED and ${rcs_req_2} == false (OPTION_2_OCAF with no BUDGET_BASED election)"
            - "${rent_track_3} == OPTION_SELECTED and ${case_method_2} == OCAF — elect-adjustment is a self-loop on the rent track, and a study may only be filed once the method is non-null"
            - "${study_state} == DRAFT and ${study_round} == 0 and ${study_accepted} == 0 and ${study_market} == null (no ACCEPTED comparable yet)"
            - "${ua_state} == DRAFT and ${ua_approver} == null and ${ua_applied} == null"
            - "${hh_status} == ACTIVE"
            - "${vs_state} == DRAFT and ${vs_paid} == null"
            - "${sc_state} == DRAFT and ${sc_paid} == null"
            - "${notice_status} == ISSUED and ${notice_issued} == 2026-12-01 and ${notice_lead} == 182 and ${notice_required} == 120"
            - "RestructuringDetermination.determination_state == DRAFT on creation is asserted by the §1.8 instance mutm_eligibility_requires_market_strictly_above_contract_rent and by the corner instance restructuring_eligibility_reports_the_reason_code_of_every_non_mutm_branch"
            - "HapContract.${contract_id}.lifecycle_status == RENEWAL_PENDING after the case opened"

      - name: triggers_not_declared_from_the_current_state_are_refused_without_side_effects
