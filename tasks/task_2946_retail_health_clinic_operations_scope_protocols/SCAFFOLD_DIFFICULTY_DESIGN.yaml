  - rule_id: boundary_precision_check
    instances:
      - name: visit_age_lower_bound_inclusive_at_exactly_24_months
        grounds:
          - calculations.patient_age_months_at_visit
          - calculations.visit_eligibility_screening
          - validations[priority=22]
          - errors[ERR_OUT_OF_PROTOCOL_SCOPE]
          - entities.StateRule.fields.min_independent_practice_age_months
        distinguishing_aspect: |
          Numeric-threshold metric on POST /visits: with the clock at 2026-08-01T00:00:00Z the
          effective floor is max(12, 24) = 24 whole months, so a patient born 2024-08-01 is exactly
          24 months and is admitted, while one born 2024-09-01 is 23 months and is rejected — the
          comparison is `>=`, not `>`.
        test_recipe:
          setup:
            - "CA StateRule with min_independent_practice_age_months 24 exists; SORE_THROAT protocol has min_age_months 12."
            - "Logical clock at the 2026-08-01T00:00:00Z startup default (never moved)."
            - "Patient EXACT (dob 2024-08-01) and patient UNDER (dob 2024-09-01) each have a CALLED walk-in entry at the OPEN CA clinic."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "CA", chart_review_sample_pct: 40, review_deadline_hours: 72, collaborating_physician_required: true, min_independent_practice_age_months: 24, controlled_rx_allowed: false, max_supervised_clinicians_per_physician: 3 }
