          assert:
            - "the analysis created in setup has verdict == PASS, so every rejection below is a state rejection and not a missing-analysis rejection"
            - "from DRAFT: seal returns HTTP 409 ERR_DESIGN_STATE_INVALID, request-revision returns 409 ERR_DESIGN_STATE_INVALID, revise returns 409 ERR_DESIGN_STATE_INVALID - DRAFT accepts only submit-review"
            - "submit-review from DRAFT returns HTTP 200 with status == UNDER_REVIEW and version == 2"
            - "from UNDER_REVIEW: revise returns 409 ERR_DESIGN_STATE_INVALID - UNDER_REVIEW accepts only request-revision and seal"
            - "request-revision from UNDER_REVIEW returns HTTP 200 with status == REVISION_REQUIRED and version == 3"
            - "from REVISION_REQUIRED: submit-review returns 409 ERR_DESIGN_STATE_INVALID, seal returns 409 ERR_DESIGN_STATE_INVALID, request-revision returns 409 ERR_DESIGN_STATE_INVALID - REVISION_REQUIRED accepts only revise"
            - "after all six rejections GET /bin-designs/${d1_id} still reports status == REVISION_REQUIRED, revision_round == 0 and version == 3 - a rejected trigger must not bump the version or the loop counter"

      - name: replaying_a_completed_transition_is_rejected_on_every_lifecycle
        claim_type: idempotency
        grounds:
          - errors[ERR_DESIGN_STATE_INVALID]
          - errors[ERR_ORDER_STATE_INVALID]
          - errors[ERR_DEPOSIT_ALREADY_PAID]
          - errors[ERR_RUN_STATE_INVALID]
