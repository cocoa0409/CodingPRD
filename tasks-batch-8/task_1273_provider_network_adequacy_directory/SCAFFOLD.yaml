scenario: |
  1273. Provider Network Adequacy & Directory Accuracy (health plan network management): network composition by specialty/geography vs standards, time/distance & appointment-availability testing, directory attestation cycle & provider outreach, ghost-network detection & removal, new provider load & effective-date management, regulatory filing & exception (access plan) request, member complaint linkage, directory error correction & penalty exposure

domain_name: provider-network-adequacy
api_prefix: /network

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_directive: |
    Beyond Expert: maximal coupling density — adequacy measurement, directory accuracy,
    attestation, ghost detection, regulatory exception, complaint linkage and penalty
    exposure all share the same listing/provider/region spine, so one mutation fans out
    through 3+ entities. No loosely-coupled filler tables.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ServiceRegion
    parent: null
    common_fields: true
    fields:
      - { name: county_fips, type: string, source: input, description: "County FIPS code; unique across regions" }
      - { name: name, type: string, source: input, description: "Region display name" }
      - { name: geo_class, type: enum, source: input, description: "URBAN | SUBURBAN | RURAL — selects which NetworkStandard row applies" }
      - { name: enrolled_member_count, type: integer, source: input, description: "Plan enrollment snapshot for this region (>= 0); numerator source for adequacy ratio" }

  - name: NetworkStandard
    parent: null
    common_fields: true
    fields:
      - { name: specialty, type: enum, source: input, description: "PRIMARY_CARE | CARDIOLOGY | DERMATOLOGY | BEHAVIORAL_HEALTH" }
      - { name: geo_class, type: enum, source: input, description: "URBAN | SUBURBAN | RURAL" }
      - { name: max_members_per_provider, type: integer, source: input, description: "Adequacy ratio ceiling: compliant iff enrolled_member_count <= max_members_per_provider * provider_count" }
      - { name: max_travel_minutes, type: integer, source: input, description: "Per-location time standard (inclusive <=)" }
      - { name: max_travel_miles, type: integer, source: input, description: "Per-location distance standard (inclusive <=)" }
      - { name: max_wait_days_routine, type: integer, source: input, description: "ROUTINE probe pass ceiling (inclusive <=)" }
      - { name: max_wait_days_urgent, type: integer, source: input, description: "URGENT probe pass ceiling (inclusive <=)" }
      # uniqueness: (specialty, geo_class) -> ERR_STANDARD_DUPLICATE

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: npi, type: string, source: input, description: "National Provider Identifier; unique -> ERR_NPI_DUPLICATE" }
      - { name: legal_name, type: string, source: input, description: "Provider legal name" }
      - { name: specialty, type: enum, source: input, description: "PRIMARY_CARE | CARDIOLOGY | DERMATOLOGY | BEHAVIORAL_HEALTH" }
      - { name: contract_effective_date, type: string, source: input, description: "ISO date; provider becomes EFFECTIVE only when logical clock >= this date" }
      - { name: status, type: enum, source: system, description: "PENDING_LOAD -> EFFECTIVE -> SUSPENDED <-> EFFECTIVE -> TERMINATED; EFFECTIVE set at create iff contract_effective_date <= clock, else PENDING_LOAD until clock sweep" }
      - { name: terminated_at, type: datetime, source: system, description: "Set on TERMINATED transition; null otherwise", default: null }

  - name: PracticeLocation
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id" }
      - { name: region_id, type: string, source: input, description: "FK -> ServiceRegion.id" }
      - { name: address_line, type: string, source: input, description: "Street address shown in directory" }
      - { name: panel_status, type: enum, source: input, description: "OPEN | CLOSED — whether accepting new patients", default: OPEN }
      - { name: avg_travel_minutes, type: integer, source: input, description: "Geo-analysis survey value: mean member travel time to this location" }
      - { name: avg_travel_miles, type: integer, source: input, description: "Geo-analysis survey value: mean member travel miles to this location" }

  - name: DirectoryListing
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id" }
      - { name: location_id, type: string, source: input, description: "FK -> PracticeLocation.id; location.provider_id must equal provider_id" }
      - { name: specialty, type: enum, source: input, description: "Listed specialty (independent of provider.specialty); publish requires a NetworkStandard for (specialty, location.region.geo_class)" }
      - { name: display_name, type: string, source: input, description: "Directory display name (correction-mutable)" }
      - { name: phone, type: string, source: input, description: "Directory phone (correction-mutable)" }
      - { name: accepts_new_patients, type: boolean, source: input, description: "Directory flag (correction-mutable)" }
      - { name: office_hours_note, type: string, source: input, required: false, description: "Free-text hours note (correction-mutable)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> LISTED -> UNDER_REVIEW -> LISTED | SUPPRESSED -> LISTED | REMOVED" }
      - { name: suppress_reason, type: enum, source: system, description: "NONE | MANUAL | ATTESTATION_FAILURE | GHOST_CONFIRMED | PROVIDER_SUSPENDED", default: NONE }
      - { name: ghost_strike_count, type: integer, source: computed, description: "Consecutive FAIL AvailabilityProbe results, chronological by recorded_at ASC (tie-break created_at ASC); reset to 0 by any PASS or by UNDER_REVIEW -> LISTED", default: 0 }
      - { name: has_confirmed_data_error, type: boolean, source: computed, description: "True while a linked MemberComplaint is CONFIRMED_ERROR and its correction is not yet VERIFIED", default: false }
      - { name: listed_at, type: datetime, source: system, description: "Timestamp of most recent DRAFT->LISTED publish", default: null }
      - { name: suppressed_at, type: datetime, source: system, description: "Timestamp of most recent transition into SUPPRESSED", default: null }

  - name: AttestationCycle
    parent: null
    common_fields: true
    fields:
      - { name: cycle_label, type: string, source: input, description: "Unique label, e.g. 2026-Q2" }
      - { name: open_date, type: string, source: input, description: "ISO date; advance SCHEDULED->OPEN requires clock >= open_date" }
      - { name: due_date, type: string, source: input, description: "ISO date; advance OPEN->OUTREACH requires clock >= due_date; must satisfy open_date < due_date < outreach_close_date" }
      - { name: outreach_close_date, type: string, source: input, description: "ISO date; advance OUTREACH->CLOSED requires clock >= outreach_close_date" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> OPEN -> OUTREACH -> CLOSED" }
      - { name: total_records, type: integer, source: computed, description: "AttestationRecords of this cycle with status != CANCELLED", default: 0 }
      - { name: pending_count, type: integer, source: computed, description: "Records in PENDING", default: 0 }
      - { name: responded_count, type: integer, source: computed, description: "Records in ATTESTED + CORRECTION_REQUESTED", default: 0 }
      - { name: non_responsive_count, type: integer, source: computed, description: "Records in NON_RESPONSIVE", default: 0 }

  - name: AttestationRecord
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> AttestationCycle.id" }
      - { name: listing_id, type: string, source: system, description: "FK -> DirectoryListing.id" }
      - { name: status, type: enum, source: system, description: "PENDING -> ATTESTED | CORRECTION_REQUESTED ; PENDING -> NON_RESPONSIVE (cycle close sweep) ; NON_RESPONSIVE -> ATTESTED | CORRECTION_REQUESTED (late response) ; PENDING -> CANCELLED (listing removed)" }
      - { name: outreach_attempts, type: integer, source: system, description: "Incremented by 1 when cycle advances OPEN->OUTREACH while record still PENDING", default: 0 }
      - { name: responded_at, type: datetime, source: system, description: "Set on ATTESTED / CORRECTION_REQUESTED", default: null }

  - name: AvailabilityProbe
    parent: null
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: input, description: "FK -> DirectoryListing.id; create requires listing status LISTED" }
      - { name: probe_type, type: enum, source: input, description: "ROUTINE | URGENT — selects max_wait_days_* from the applicable standard" }
      - { name: requested_date, type: string, source: input, description: "ISO date the appointment was requested; must be <= current clock date" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> RECORDED (terminal)" }
      - { name: outcome, type: enum, source: system, description: "KEPT | UNREACHABLE | NO_APPOINTMENT_OFFERED", default: null }
      - { name: offered_appointment_date, type: string, source: system, description: "ISO date offered; required iff outcome == KEPT; must be >= requested_date", default: null }
      - { name: days_to_appointment, type: integer, source: computed, description: "offered_appointment_date - requested_date in whole days; null unless KEPT", default: null }
      - { name: result, type: enum, source: computed, description: "PASS iff KEPT and days_to_appointment <= applicable max_wait_days_*; else FAIL", default: null }
      - { name: recorded_at, type: datetime, source: system, description: "Clock timestamp when result recorded", default: null }

  - name: AdequacyEvaluation
    parent: null
    common_fields: true
    fields:
      - { name: measurement_period, type: string, source: input, description: "Label, e.g. 2026-Q2" }
      - { name: period_start_date, type: string, source: input, description: "ISO date; inclusive period start" }
      - { name: period_end_date, type: string, source: input, description: "ISO date; inclusive period end; must be >= period_start_date" }
      - { name: status, type: enum, source: system, description: "OPEN -> FINALIZED" }
      - { name: total_penalty_cents, type: integer, source: computed, description: "Rollup: per-deficiency accruals rounded to integer cents (round_half_up) BEFORE summing, plus error and late-correction penalties; decremented when an access plan approval reverses an accrual", default: 0 }
      - { name: finalized_at, type: datetime, source: system, description: "Set on finalize", default: null }

  - name: RegionSpecialtyResult
    parent: null
    common_fields: false
    fields:
      - { name: evaluation_id, type: string, source: system, description: "FK -> AdequacyEvaluation.id" }
      - { name: region_id, type: string, source: system, description: "FK -> ServiceRegion.id" }
      - { name: specialty, type: enum, source: system, description: "Specialty of this (region, specialty) pair" }
      - { name: member_count, type: integer, source: system, description: "Snapshot of ServiceRegion.enrolled_member_count at finalize" }
      - { name: provider_count, type: integer, source: computed, description: "OFFICIAL variant: distinct EFFECTIVE providers with >=1 LISTED listing of this specialty whose location is in this region with panel_status OPEN" }
      - { name: listing_count, type: integer, source: computed, description: "VARIANT: count of such LISTED listings (multi-location providers counted once per listing)" }
      - { name: ratio_members_per_provider, type: number, source: computed, description: "member_count / provider_count, 2 decimals round_half_up; null when provider_count == 0" }
      - { name: ratio_ok, type: boolean, source: computed, description: "member_count <= max_members_per_provider * provider_count (integer comparison); false when provider_count == 0 and member_count > 0" }
      - { name: counted_location_count, type: integer, source: computed, description: "Locations hosting the counted LISTED listings" }
      - { name: compliant_location_count, type: integer, source: computed, description: "Counted locations with avg_travel_minutes <= max_travel_minutes AND avg_travel_miles <= max_travel_miles" }
      - { name: time_distance_compliant, type: boolean, source: computed, description: "10 * compliant_location_count >= 9 * counted_location_count (integer arithmetic, >= 90% boundary inclusive); false when counted_location_count == 0 and member_count > 0" }
      - { name: probed_listing_count, type: integer, source: computed, description: "RECORDED probes on counted listings with recorded_at date inside [period_start_date, period_end_date] and days_to_appointment non-null" }
      - { name: mean_wait_days, type: number, source: computed, description: "OFFICIAL variant: mean of days_to_appointment over probed set, 2 decimals round_half_up; null when empty" }
      - { name: p90_wait_days, type: number, source: computed, description: "VARIANT: days sorted ASC, value at 1-based index ceil(0.9 * N); null when empty" }
      - { name: wait_time_compliant, type: boolean, source: computed, description: "OFFICIAL: true when probed set empty, else mean_wait_days <= max_wait_days_routine (ROUTINE probes only) — p90 reported for filing but does not gate" }
      - { name: overall_status, type: enum, source: computed, description: "COMPLIANT iff member_count == 0 OR (ratio_ok AND time_distance_compliant AND wait_time_compliant); DEFICIENT otherwise; EXCUSED when deficient by measure but an APPROVED AccessPlanRequest for this pair has excuse_through_date >= period_end_date" }

  - name: DeficiencyRecord
    parent: null
    common_fields: true
    fields:
      - { name: evaluation_id, type: string, source: system, description: "FK -> AdequacyEvaluation.id of the evaluation that opened (or most recently reopened) this deficiency" }
      - { name: region_id, type: string, source: system, description: "FK -> ServiceRegion.id" }
      - { name: specialty, type: enum, source: system, description: "Specialty of the deficient pair" }
      - { name: status, type: enum, source: system, description: "OPEN -> EXCUSED (access plan approved) -> OPEN (excuse lapsed, still deficient) ; OPEN|EXCUSED -> CLOSED (pair compliant at a later finalize)" }
      - { name: opened_date, type: string, source: system, description: "period_start_date of the opening evaluation" }
      - { name: closed_date, type: string, source: system, description: "period_end_date of the closing evaluation; null while OPEN/EXCUSED", default: null }
      - { name: prior_closure_count, type: integer, source: system, description: "Count of CLOSED DeficiencyRecords for the same (region_id, specialty) at the moment this record is created; snapshot, drives repeat multiplier", default: 0 }
      - { name: accrual_window_start, type: string, source: system, description: "Start date of the most recent penalty accrual window" }
      - { name: accrual_window_end, type: string, source: system, description: "End date of the most recent penalty accrual window" }
      - { name: last_accrual_cents, type: integer, source: computed, description: "Most recent accrual event amount after per-event cap and round_half_up", default: 0 }
      - { name: accrued_penalty_cents, type: integer, source: computed, description: "Cumulative accrued penalty across all accrual events on this record", default: 0 }
      - { name: reversed_penalty_cents, type: integer, source: computed, description: "Cumulative penalty reversed by access plan approvals", default: 0 }
      - { name: outstanding_penalty_cents, type: integer, source: computed, description: "INVARIANT: outstanding_penalty_cents == accrued_penalty_cents - reversed_penalty_cents", default: 0 }

  - name: AccessPlanRequest
    parent: null
    common_fields: true
    fields:
      - { name: deficiency_id, type: string, source: system, description: "FK -> DeficiencyRecord.id (from path)" }
      - { name: remedy_summary, type: string, source: input, description: "How the plan will remediate access" }
      - { name: excuse_start_date, type: string, source: input, description: "ISO date; requested excuse window start" }
      - { name: excuse_through_date, type: string, source: input, description: "ISO date; requested excuse window end (closed interval); must be >= excuse_start_date" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> APPROVED | DENIED -> SUBMITTED (resubmit cycle) ; DRAFT -> SUPERSEDED when a newer request is created on the same deficiency" }
      - { name: submission_seq, type: integer, source: system, description: "1 + max(submission_seq) over requests of the same deficiency; deterministic ordering", default: 1 }
      - { name: decided_at, type: datetime, source: system, description: "Set on APPROVED / DENIED", default: null }
      - { name: decision_notes, type: string, source: system, description: "Regulator notes from decide call", default: null }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: region_id, type: string, source: input, description: "FK -> ServiceRegion.id" }
      - { name: member_ref, type: string, source: input, description: "External member number; unique -> ERR_MEMBER_REF_DUPLICATE" }
      - { name: full_name, type: string, source: input, description: "Member name" }
      - { name: enrolled_on, type: string, source: input, description: "ISO enrollment date" }
      - { name: status, type: enum, source: system, description: "ENROLLED -> DISENROLLED" }
      - { name: disenrolled_at, type: datetime, source: system, description: "Set on disenroll", default: null }

  - name: MemberComplaint
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; derived from X-User-ID of the Member role caller" }
      - { name: listing_id, type: string, source: input, description: "FK -> DirectoryListing.id; must not be REMOVED; its location region must equal the member's region" }
      - { name: error_type, type: enum, source: input, description: "WRONG_PHONE | WRONG_ADDRESS | NOT_ACCEPTING | NO_APPOINTMENT | OTHER" }
      - { name: error_observed_date, type: string, source: input, description: "ISO date the error was observed; filing must satisfy filed_date - error_observed_date <= 90 days and error_observed_date <= filed_date" }
      - { name: description, type: string, source: input, description: "Free-text complaint" }
      - { name: status, type: enum, source: system, description: "OPEN -> CONFIRMED_ERROR -> CLOSED (auto when linked correction VERIFIED) ; OPEN -> UNFOUNDED" }
      - { name: filed_at, type: datetime, source: system, description: "Clock timestamp at filing" }
      - { name: confirmed_at, type: datetime, source: system, description: "Set on CONFIRMED_ERROR", default: null }

  - name: DirectoryCorrection
    parent: null
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: input, description: "FK -> DirectoryListing.id" }
      - { name: complaint_id, type: string, source: input, required: false, description: "FK -> MemberComplaint.id; when present, complaint must be CONFIRMED_ERROR and complaint.listing_id == listing_id", default: null }
      - { name: changes, type: object, source: input, description: "Map of correction-mutable listing field -> new value; allowed keys: display_name, phone, accepts_new_patients, office_hours_note" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of submitter ('system:adjudication' when auto-spawned by complaint confirm; ProviderRep id when spawned by attestation response)" }
      - { name: sla_due_at, type: datetime, source: computed, description: "created_at + 72 hours (CORRECTION_SLA_HOURS)" }
      - { name: is_late, type: boolean, source: computed, description: "verified_at > sla_due_at; late VERIFIED corrections accrue LATE_CORRECTION_PENALTY_CENTS at the covering evaluation's finalize", default: false }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> VERIFIED | REJECTED" }
      - { name: verified_at, type: datetime, source: system, description: "Set on VERIFIED", default: null }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of verifying ComplianceOfficer; must differ from submitted_by_user_id", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Provider
    initial_state: PENDING_LOAD
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_LOAD
        to: EFFECTIVE
        trigger: "system sweep inside POST /_clock/set_current_utc when new clock >= contract_effective_date"
        actor: system
        preconditions:
          - "provider.status == PENDING_LOAD"
          - "new clock timestamp's date >= provider.contract_effective_date"
        side_effects:
          - "provider.status -> EFFECTIVE; provider.version += 1"
      - from: EFFECTIVE
        to: SUSPENDED
        trigger: "PATCH /network/providers/{id} with to_status=SUSPENDED"
        actor: NetworkManager
        preconditions:
          - "provider.status == EFFECTIVE (else ERR_PROVIDER_INVALID_TRANSITION)"
        side_effects:
          - "cascade: each DirectoryListing of this provider with status == LISTED -> SUPPRESSED, suppress_reason=PROVIDER_SUSPENDED, suppressed_at=now, version += 1 (listings already UNDER_REVIEW / SUPPRESSED / REMOVED / DRAFT are untouched)"
      - from: SUSPENDED
        to: EFFECTIVE
        trigger: "PATCH /network/providers/{id} with to_status=EFFECTIVE"
        actor: NetworkManager
        preconditions:
          - "provider.status == SUSPENDED (else ERR_PROVIDER_INVALID_TRANSITION)"
        side_effects:
          - "compensating cascade: each DirectoryListing of this provider with status == SUPPRESSED AND suppress_reason == PROVIDER_SUSPENDED -> LISTED, suppress_reason=NONE, version += 1 (restores exactly the set the suspend cascade suppressed)"
      - from: EFFECTIVE
        to: TERMINATED
        trigger: "PATCH /network/providers/{id} with to_status=TERMINATED"
        actor: NetworkManager
        preconditions:
          - "provider.status in {PENDING_LOAD, EFFECTIVE, SUSPENDED} (else ERR_PROVIDER_INVALID_TRANSITION)"
        side_effects:
          - "terminated_at = now"
          - "cascade link 1: every DirectoryListing of this provider with status in {DRAFT, LISTED, UNDER_REVIEW, SUPPRESSED} -> REMOVED, version += 1"
          - "cascade link 2 (from link 1): every AttestationRecord whose listing was just removed AND status == PENDING -> CANCELLED, version += 1"
          - "cascade link 3 (from link 2): owning AttestationCycle counters recompute (total_records/pending_count/responded_count/non_responsive_count over status != CANCELLED)"
      - from: PENDING_LOAD
        to: TERMINATED
        trigger: "PATCH /network/providers/{id} with to_status=TERMINATED"
        actor: NetworkManager
        preconditions:
          - "provider.status in {PENDING_LOAD, EFFECTIVE, SUSPENDED}"
        side_effects: ["terminated_at = now (no listings can exist in LISTED state; DRAFT listings -> REMOVED with the same 3-link cascade)"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "PATCH /network/providers/{id} with to_status=TERMINATED"
        actor: NetworkManager
        preconditions:
          - "provider.status in {PENDING_LOAD, EFFECTIVE, SUSPENDED}"
        side_effects: ["same 3-link terminate cascade as EFFECTIVE -> TERMINATED"]

  - entity: DirectoryListing
    initial_state: DRAFT
    terminal_states: [REMOVED]
    transitions:
      - from: DRAFT
        to: LISTED
        trigger: "POST /network/listings/{id}/publish"
        actor: NetworkManager
        preconditions:
          - "listing.status == DRAFT (else ERR_LISTING_INVALID_TRANSITION)"
          - "provider.status == EFFECTIVE (ERR_PROVIDER_NOT_EFFECTIVE) — checked before referential checks"
          - "location.provider_id == listing.provider_id (ERR_LOCATION_PROVIDER_MISMATCH)"
          - "a NetworkStandard exists for (listing.specialty, location.region.geo_class) (ERR_SPECIALTY_STANDARD_MISSING)"
          - "no other DirectoryListing with status == LISTED for the same (location_id, specialty) (ERR_LISTING_ALREADY_LISTED)"
        side_effects:
          - "listed_at = now; listing.version += 1"
      - from: LISTED
        to: UNDER_REVIEW
        trigger: "system — POST /network/probes/{probeId}/record computes the 3rd consecutive FAIL (ghost_strike_count >= 3)"
        actor: system
        preconditions:
          - "listing.status == LISTED"
          - "recomputed ghost_strike_count >= 3"
        side_effects:
          - "listing.status -> UNDER_REVIEW; version += 1 (listing leaves the LISTED counted set used by adequacy measurement)"
      - from: UNDER_REVIEW
        to: LISTED
        trigger: "PATCH /network/listings/{id} with to_status=LISTED"
        actor: NetworkManager
        preconditions:
          - "listing.status == UNDER_REVIEW (else ERR_LISTING_INVALID_TRANSITION)"
          - "provider.status == EFFECTIVE (ERR_PROVIDER_NOT_EFFECTIVE)"
        side_effects:
          - "ghost_strike_count reset to 0; version += 1"
      - from: UNDER_REVIEW
        to: SUPPRESSED
        trigger: "PATCH /network/listings/{id} with to_status=SUPPRESSED, suppress_reason=GHOST_CONFIRMED"
        actor: NetworkManager
        preconditions:
          - "listing.status == UNDER_REVIEW AND suppress_reason == GHOST_CONFIRMED in payload (else ERR_LISTING_INVALID_TRANSITION)"
        side_effects:
          - "suppress_reason = GHOST_CONFIRMED; suppressed_at = now; version += 1"
      - from: LISTED
        to: SUPPRESSED
        trigger: "PATCH /network/listings/{id} with to_status=SUPPRESSED, suppress_reason=MANUAL"
        actor: NetworkManager
        preconditions:
          - "listing.status == LISTED AND suppress_reason == MANUAL in payload (else ERR_LISTING_INVALID_TRANSITION)"
        side_effects:
          - "suppress_reason = MANUAL; suppressed_at = now; version += 1"
      - from: LISTED
        to: SUPPRESSED
        trigger: "system — attestation cycle close sweep (record NON_RESPONSIVE) or provider suspend cascade"
        actor: system
        preconditions:
          - "listing.status == LISTED (conditional cascade: listings already SUPPRESSED / UNDER_REVIEW / REMOVED are untouched)"
        side_effects:
          - "suppress_reason = ATTESTATION_FAILURE (cycle sweep) or PROVIDER_SUSPENDED (provider cascade); suppressed_at = now; version += 1"
      - from: SUPPRESSED
        to: LISTED
        trigger: "PATCH /network/listings/{id} with to_status=LISTED"
        actor: NetworkManager
        preconditions:
          - "listing.status == SUPPRESSED (else ERR_LISTING_INVALID_TRANSITION)"
          - "provider.status == EFFECTIVE (ERR_PROVIDER_NOT_EFFECTIVE)"
          - "suppress_reason == PROVIDER_SUSPENDED is NOT manually reinstatable (ERR_LISTING_INVALID_TRANSITION) — restoration happens only via provider reinstate cascade"
          - "if suppress_reason == ATTESTATION_FAILURE: an AttestationRecord for this listing with status in {ATTESTED, CORRECTION_REQUESTED} and responded_at > listing.suppressed_at must exist (ERR_LISTING_ATTESTATION_UNRESOLVED)"
          - "if suppress_reason == GHOST_CONFIRMED: an AvailabilityProbe for this listing with result == PASS and recorded_at > listing.suppressed_at must exist (ERR_LISTING_GHOST_UNRESOLVED)"
        side_effects:
          - "suppress_reason -> NONE; version += 1"
      - from: DRAFT
        to: REMOVED
        trigger: "PATCH /network/listings/{id} with to_status=REMOVED"
        actor: NetworkManager
        preconditions: ["listing.status in {DRAFT, LISTED, UNDER_REVIEW, SUPPRESSED}"]
        side_effects: ["cascade: PENDING AttestationRecords for this listing in non-CLOSED cycles -> CANCELLED; owning cycle counters recompute"]
      - from: LISTED
        to: REMOVED
        trigger: "PATCH /network/listings/{id} with to_status=REMOVED"
        actor: NetworkManager
        preconditions: ["listing.status in {DRAFT, LISTED, UNDER_REVIEW, SUPPRESSED}"]
        side_effects: ["same record-cancellation cascade as DRAFT -> REMOVED"]
      - from: UNDER_REVIEW
        to: REMOVED
        trigger: "PATCH /network/listings/{id} with to_status=REMOVED"
        actor: NetworkManager
        preconditions: ["listing.status in {DRAFT, LISTED, UNDER_REVIEW, SUPPRESSED}"]
        side_effects: ["same record-cancellation cascade as DRAFT -> REMOVED"]
      - from: SUPPRESSED
        to: REMOVED
        trigger: "PATCH /network/listings/{id} with to_status=REMOVED"
        actor: NetworkManager
        preconditions: ["listing.status in {DRAFT, LISTED, UNDER_REVIEW, SUPPRESSED}"]
        side_effects: ["same record-cancellation cascade as DRAFT -> REMOVED"]

  - entity: AttestationCycle
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /network/attestation-cycles/{id}/advance"
        actor: NetworkManager
        preconditions:
          - "cycle.status == SCHEDULED (else ERR_CYCLE_INVALID_STATE)"
          - "clock date >= open_date (ERR_CYCLE_NOT_YET_ADVANCEABLE) — temporal check precedes constraint check"
          - "no other cycle in OPEN or OUTREACH (ERR_CYCLE_ALREADY_ACTIVE)"
        side_effects:
          - "bulk cascade: for every DirectoryListing with status == LISTED at this instant, create AttestationRecord(status=PENDING, outreach_attempts=0); recompute cycle counters"
      - from: OPEN
        to: OUTREACH
        trigger: "POST /network/attestation-cycles/{id}/advance"
        actor: NetworkManager
        preconditions:
          - "cycle.status == OPEN (else ERR_CYCLE_INVALID_STATE)"
          - "clock date >= due_date (ERR_CYCLE_NOT_YET_ADVANCEABLE)"
        side_effects:
          - "outreach cascade: every record still PENDING gets outreach_attempts += 1, version += 1; recompute cycle counters"
      - from: OUTREACH
        to: CLOSED
        trigger: "POST /network/attestation-cycles/{id}/advance"
        actor: NetworkManager
        preconditions:
          - "cycle.status == OUTREACH (else ERR_CYCLE_INVALID_STATE)"
          - "clock date >= outreach_close_date (ERR_CYCLE_NOT_YET_ADVANCEABLE)"
        side_effects:
          - "cascade link 1: every record still PENDING -> NON_RESPONSIVE, version += 1"
          - "cascade link 2 (from link 1): each such record's listing, if still LISTED, -> SUPPRESSED with suppress_reason=ATTESTATION_FAILURE, suppressed_at=now, version += 1"
          - "cascade link 3: recompute cycle counters (pending_count -> 0, non_responsive_count rises)"

  - entity: AttestationRecord
    initial_state: PENDING
    terminal_states: [ATTESTED, CORRECTION_REQUESTED, CANCELLED]
    transitions:
      - from: PENDING
        to: ATTESTED
        trigger: "POST /network/attestation-records/{id}/respond with data_accurate=true"
        actor: ProviderRep
        preconditions:
          - "X-User-ID == record.listing.provider_id (ERR_NOT_RESOURCE_OWNER)"
          - "record.status == PENDING and cycle.status in {OPEN, OUTREACH} — or record.status == NON_RESPONSIVE and cycle.status == CLOSED (late response) — else ERR_RECORD_NOT_RESPONDABLE"
        side_effects:
          - "responded_at = now; cycle counters recompute"
      - from: NON_RESPONSIVE
        to: ATTESTED
        trigger: "POST /network/attestation-records/{id}/respond with data_accurate=true (late response after cycle close)"
        actor: ProviderRep
        preconditions:
          - "X-User-ID == record.listing.provider_id (ERR_NOT_RESOURCE_OWNER)"
          - "record.status == NON_RESPONSIVE and cycle.status == CLOSED"
        side_effects:
          - "responded_at = now; cycle counters recompute (non_responsive_count decreases, responded_count increases)"
      - from: PENDING
        to: CORRECTION_REQUESTED
        trigger: "POST /network/attestation-records/{id}/respond with data_accurate=false and corrected_payload"
        actor: ProviderRep
        preconditions:
          - "X-User-ID == record.listing.provider_id (ERR_NOT_RESOURCE_OWNER)"
          - "record.status == PENDING and cycle.status in {OPEN, OUTREACH} — or NON_RESPONSIVE with cycle CLOSED"
          - "corrected_payload present and non-empty (else ERR_INVALID_REQUEST)"
        side_effects:
          - "spawn DirectoryCorrection(listing_id=record.listing_id, complaint_id=null, changes=corrected_payload, submitted_by_user_id=X-User-ID, status=SUBMITTED, sla_due_at=now+72h)"
          - "responded_at = now; cycle counters recompute"
      - from: NON_RESPONSIVE
        to: CORRECTION_REQUESTED
        trigger: "POST /network/attestation-records/{id}/respond with data_accurate=false (late response)"
        actor: ProviderRep
        preconditions:
          - "X-User-ID == record.listing.provider_id (ERR_NOT_RESOURCE_OWNER)"
          - "record.status == NON_RESPONSIVE and cycle.status == CLOSED"
          - "corrected_payload present and non-empty (else ERR_INVALID_REQUEST)"
        side_effects: ["same DirectoryCorrection spawn as PENDING -> CORRECTION_REQUESTED"]
      - from: PENDING
        to: NON_RESPONSIVE
        trigger: "system — owning cycle advances OUTREACH -> CLOSED"
        actor: system
        preconditions: ["record.status == PENDING at sweep time"]
        side_effects: ["listing (if LISTED) -> SUPPRESSED with suppress_reason=ATTESTATION_FAILURE"]
      - from: PENDING
        to: CANCELLED
        trigger: "system — listing removed (PATCH to_status=REMOVED or provider terminate cascade)"
        actor: system
        preconditions: ["record.status == PENDING; owning cycle not CLOSED"]
        side_effects: ["cycle counters recompute"]

  - entity: AvailabilityProbe
    initial_state: SCHEDULED
    terminal_states: [RECORDED]
    transitions:
      - from: SCHEDULED
        to: RECORDED
        trigger: "POST /network/probes/{id}/record"
        actor: NetworkManager
        preconditions:
          - "probe.status == SCHEDULED (else ERR_PROBE_INVALID_STATE)"
          - "if outcome == KEPT: offered_appointment_date required and >= requested_date (ERR_PROBE_DATE_ORDER)"
        side_effects:
          - "link 1: compute days_to_appointment and result; recorded_at = now; recompute listing.ghost_strike_count (chronological consecutive FAILs)"
          - "link 2: if recomputed ghost_strike_count >= 3 and listing.status == LISTED: listing -> UNDER_REVIEW, version += 1"

  - entity: AdequacyEvaluation
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /network/evaluations/{id}/finalize"
        actor: NetworkManager
        preconditions:
          - "evaluation.status == OPEN (else ERR_EVALUATION_INVALID_STATE)"
          - "no AvailabilityProbe with status == SCHEDULED and requested_date inside [period_start_date, period_end_date] (ERR_UNRECORDED_PROBES_EXIST)"
        side_effects:
          - "link 1: create RegionSpecialtyResult for every ServiceRegion x specialty having a NetworkStandard for (specialty, region.geo_class), computing all per-pair measures"
          - "link 2 (from link 1): for each DEFICIENT pair — if no OPEN/EXCUSED DeficiencyRecord exists for (region_id, specialty), create one (OPEN, opened_date=period_start_date, prior_closure_count = count of CLOSED records for the pair); if an OPEN one exists, extend it; if an EXCUSED one exists whose excuse_through_date < period_end_date, reopen it (EXCUSED -> OPEN, accrual window = max(period_start_date, excuse_through_date) .. period_end_date)"
          - "link 3 (from link 2): each OPEN deficiency accrues penalty per calc deficiency_penalty_accrual; accrued_penalty_cents, last_accrual_cents, accrual_window_* updated, version += 1"
          - "link 4 (from link 3): evaluation.total_penalty_cents recomputed = sum of per-deficiency per-event accruals (each round_half_up to integer cents BEFORE summing) + PER_ERROR_PENALTY_CENTS per MemberComplaint with confirmed_at inside the period and status in {CONFIRMED_ERROR, CLOSED} (attributed via complaint.listing -> location.region_id) + LATE_CORRECTION_PENALTY_CENTS per DirectoryCorrection VERIFIED with is_late and verified_at inside the period"
          - "link 2b (from link 1): each COMPLIANT pair with an existing OPEN or EXCUSED deficiency -> deficiency CLOSED, closed_date = period_end_date, version += 1"
          - "finalized_at = now; evaluation.version += 1"

  - entity: DeficiencyRecord
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: EXCUSED
        trigger: "system — POST /network/access-plan-requests/{id}/decide with decision=APPROVED on a request of this deficiency"
        actor: system
        preconditions: ["deficiency.status == OPEN (ERR_DEFICIENCY_NOT_OPEN)"]
        side_effects:
          - "reversed_penalty_cents += accrued_penalty_cents - reversed_penalty_cents (i.e., outstanding -> 0); version += 1"
          - "owning evaluation.total_penalty_cents -= reversed amount"
      - from: EXCUSED
        to: OPEN
        trigger: "system — a later evaluation finalize finds the pair still DEFICIENT and excuse_through_date < period_end_date"
        actor: system
        preconditions: ["deficiency.status == EXCUSED; pair DEFICIENT; excuse lapsed before period end"]
        side_effects: ["new accrual window opens; penalty accrual for the uncovered tail"]
      - from: OPEN
        to: CLOSED
        trigger: "system — a later evaluation finalize finds the pair COMPLIANT"
        actor: system
        preconditions: ["deficiency.status in {OPEN, EXCUSED}; pair COMPLIANT"]
        side_effects: ["closed_date = period_end_date; version += 1"]
      - from: EXCUSED
        to: CLOSED
        trigger: "system — a later evaluation finalize finds the pair COMPLIANT"
        actor: system
        preconditions: ["deficiency.status in {OPEN, EXCUSED}; pair COMPLIANT"]
        side_effects: ["closed_date = period_end_date; version += 1"]

  - entity: AccessPlanRequest
    initial_state: DRAFT
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system — POST /network/deficiencies/{id}/access-plan-requests creates a newer request on the same deficiency"
        actor: system
        preconditions: ["an existing DRAFT request on the same deficiency"]
        side_effects: ["older DRAFT -> SUPERSEDED, version += 1; new request gets submission_seq = old max + 1"]
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /network/access-plan-requests/{id}/submit"
        actor: NetworkManager
        preconditions: ["request.status in {DRAFT, DENIED} (else ERR_REQUEST_NOT_SUBMITTABLE)"]
        side_effects: ["version += 1"]
      - from: DENIED
        to: SUBMITTED
        trigger: "POST /network/access-plan-requests/{id}/submit (resubmission cycle)"
        actor: NetworkManager
        preconditions: ["request.status in {DRAFT, DENIED}"]
        side_effects: ["version += 1; decided_at reset to null"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /network/access-plan-requests/{id}/decide with decision=APPROVED"
        actor: Regulator
        preconditions:
          - "request.status == SUBMITTED (else ERR_REQUEST_NOT_DECIDABLE)"
          - "deficiency.status == OPEN (ERR_DEFICIENCY_NOT_OPEN)"
          - "excuse window [excuse_start_date, excuse_through_date] (CLOSED interval — touching endpoints count as overlap) must not overlap any other APPROVED request for the same deficiency (ERR_EXCUSE_WINDOW_OVERLAP)"
        side_effects:
          - "decided_at = now; decision_notes recorded; version += 1"
          - "cascade: deficiency -> EXCUSED; its outstanding penalty reversed; evaluation rollup decremented"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /network/access-plan-requests/{id}/decide with decision=DENIED"
        actor: Regulator
        preconditions: ["request.status == SUBMITTED (else ERR_REQUEST_NOT_DECIDABLE)"]
        side_effects: ["decided_at = now; version += 1"]

  - entity: Member
    initial_state: ENROLLED
    terminal_states: [DISENROLLED]
    transitions:
      - from: ENROLLED
        to: DISENROLLED
        trigger: "POST /network/members/{id}/disenroll"
        actor: NetworkManager
        preconditions: ["member.status == ENROLLED (else ERR_MEMBER_NOT_ENROLLED)"]
        side_effects: ["disenrolled_at = now; version += 1 (enrolled_member_count is an input snapshot, NOT derived, so no region write occurs)"]

  - entity: MemberComplaint
    initial_state: OPEN
    terminal_states: [UNFOUNDED, CLOSED]
    transitions:
      - from: OPEN
        to: CONFIRMED_ERROR
        trigger: "POST /network/complaints/{id}/adjudicate with outcome=CONFIRMED_ERROR"
        actor: ComplianceOfficer
        preconditions:
          - "complaint.status == OPEN (else ERR_COMPLAINT_NOT_OPEN)"
          - "correction_changes present and non-empty when outcome == CONFIRMED_ERROR (else ERR_INVALID_REQUEST)"
        side_effects:
          - "confirmed_at = now; version += 1"
          - "spawn DirectoryCorrection(listing_id=complaint.listing_id, complaint_id=complaint.id, changes=correction_changes, submitted_by_user_id='system:adjudication', status=SUBMITTED, sla_due_at=now+72h)"
          - "listing.has_confirmed_data_error = true; listing.version += 1"
      - from: OPEN
        to: UNFOUNDED
        trigger: "POST /network/complaints/{id}/adjudicate with outcome=UNFOUNDED"
        actor: ComplianceOfficer
        preconditions: ["complaint.status == OPEN (else ERR_COMPLAINT_NOT_OPEN)"]
        side_effects: ["version += 1"]
      - from: CONFIRMED_ERROR
        to: CLOSED
        trigger: "system — the linked DirectoryCorrection transitions SUBMITTED -> VERIFIED"
        actor: system
        preconditions: ["complaint.status == CONFIRMED_ERROR; linked correction VERIFIED"]
        side_effects: ["complaint -> CLOSED, version += 1; listing.has_confirmed_data_error = false"]

  - entity: DirectoryCorrection
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /network/corrections/{id}/verify"
        actor: ComplianceOfficer
        preconditions:
          - "correction.status == SUBMITTED (else ERR_CORRECTION_NOT_VERIFIABLE)"
          - "X-User-ID != correction.submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "verified_at = now; verified_by_user_id = X-User-ID; is_late = (verified_at > sla_due_at)"
          - "apply changes to the listing's correction-mutable fields (display_name, phone, accepts_new_patients, office_hours_note); listing.version += 1"
          - "cascade: linked MemberComplaint (if any) with status CONFIRMED_ERROR -> CLOSED; listing.has_confirmed_data_error = false"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /network/corrections/{id}/verify with approve=false"
        actor: ComplianceOfficer
        preconditions:
          - "correction.status == SUBMITTED (else ERR_CORRECTION_NOT_VERIFIABLE)"
          - "X-User-ID != correction.submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects: ["version += 1 (linked complaint stays CONFIRMED_ERROR; a fresh correction may be submitted)"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: standard-update-stale-version
    parent_entity: NetworkStandard
    write_endpoint: "PUT /network/standards/{id}"
    occ_field: "expected_standard_version"
    description: |
      Updating a NetworkStandard whose version has advanced since the client
      last observed it is rejected. The writer's threshold view is stale, so
      the update must be re-based on the current row before it may succeed.
    error_id: ERR_STALE_STANDARD_VERSION
    http_status: 412
  - rule_id: location-update-stale-version
    parent_entity: PracticeLocation
    write_endpoint: "PATCH /network/locations/{id}"
    occ_field: "expected_location_version"
    description: |
      Patching a PracticeLocation (e.g., flipping panel_status) whose version
      has advanced since the client last observed it is rejected; the adequacy
      input the client saw is stale and the write must be re-based.
    error_id: ERR_STALE_LOCATION_VERSION
    http_status: 412
  - rule_id: listing-status-stale-version
    parent_entity: DirectoryListing
    write_endpoint: "PATCH /network/listings/{id}"
    occ_field: "expected_listing_version"
    description: |
      Patching a DirectoryListing's status whose version has advanced since the
      client last observed it (e.g., a correction verify or a probe-strike sweep
      mutated the listing in between) is rejected as stale.
    error_id: ERR_STALE_LISTING_VERSION
    http_status: 412
  - rule_id: access-plan-create-stale-deficiency
    parent_entity: DeficiencyRecord
    write_endpoint: "POST /network/deficiencies/{id}/access-plan-requests"
    occ_field: "expected_deficiency_version"
    description: |
      Creating an AccessPlanRequest against a DeficiencyRecord whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just created a request (which legitimately
      supersedes the prior DRAFT) and the current writer's view of the
      deficiency is therefore stale.
    error_id: ERR_STALE_DEFICIENCY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: network_ratio_headcount
    trigger: "evaluation finalize (per RegionSpecialtyResult row)"
    algorithm: aggregation
    formula: |
      counted_providers = distinct Provider p such that:
        p.status == EFFECTIVE AND
        exists DirectoryListing l: l.provider_id == p.id AND l.status == LISTED
          AND l.specialty == pair.specialty AND
          exists PracticeLocation loc: loc.id == l.location_id AND
            loc.region_id == pair.region_id AND loc.panel_status == OPEN
      provider_count = |counted_providers|
      ratio_ok = (member_count <= standard.max_members_per_provider * provider_count)
                 using integer comparison; provider_count == 0 AND member_count > 0 -> ratio_ok = false
      ratio_members_per_provider = round_half_up(member_count / provider_count, 2) when provider_count > 0 else null
    input_set: "Only LISTED listings on OPEN-panel locations of EFFECTIVE providers; DRAFT/UNDER_REVIEW/SUPPRESSED/REMOVED listings excluded"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: listing_count_variant
        when: "regulatory filing cross-check reported alongside the official headcount"
        difference: "counts LISTED listings instead of distinct providers (a provider listed at 2 locations counts twice) — same data, different provider base, can flip ratio_ok"

  - name: wait_time_compliance
    trigger: "evaluation finalize (per RegionSpecialtyResult row)"
    algorithm: aggregation
    formula: |
      probed = AvailabilityProbes with status == RECORDED, listing in counted set,
               probe_type == ROUTINE, recorded_at date within [period_start_date, period_end_date],
               days_to_appointment non-null
      days_list = [p.days_to_appointment for p in probed]
      mean_wait_days = round_half_up(sum(days_list) / N, 2) when N > 0 else null
      wait_time_compliant (OFFICIAL) = true when N == 0 else mean_wait_days <= standard.max_wait_days_routine
    input_set: "RECORDED ROUTINE probes on counted listings inside the measurement period; URGENT probes excluded from the official gate"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: p90_variant
        when: "regulator-facing filing statistic"
        difference: "p90_wait_days = days_list sorted ASC, value at 1-based index ceil(0.9 * N); a tail-heavy sample passes the official mean gate while failing the p90 reading"

  - name: deficiency_penalty_accrual
    trigger: "evaluation finalize, once per OPEN DeficiencyRecord (and per reopened EXCUSED record's uncovered tail)"
    algorithm: tiered_pricing
    formula: |
      tier_mult = 2.0 if region.enrolled_member_count >= TIER2_MEMBER_THRESHOLD
             else 1.5 if region.enrolled_member_count >= TIER1_MEMBER_THRESHOLD
             else 1.0
      repeat_mult = 1 + REPEAT_STEP * min(deficiency.prior_closure_count, REPEAT_CAP)
      days = (accrual_window_end - accrual_window_start) in whole calendar days
      raw_cents = BASE_DAILY_PENALTY_CENTS * days * tier_mult * repeat_mult
      accrual_cents = min(PENALTY_CAP_CENTS, round_half_up(raw_cents))
      deficiency.last_accrual_cents = accrual_cents
      deficiency.accrued_penalty_cents += accrual_cents
    input_set: "DeficiencyRecords in OPEN status touched by this finalize; EXCUSED records with excuse covering period_end_date accrue nothing"
    constants:
      BASE_DAILY_PENALTY_CENTS: 9999
      PENALTY_CAP_CENTS: 5000000
      TIER1_MEMBER_THRESHOLD: 10000
      TIER2_MEMBER_THRESHOLD: 50000
      REPEAT_STEP: 0.5
      REPEAT_CAP: 3
    precision: "integer cents, round_half_up per accrual event"
    variants:
      - name: provisional_projection
        when: "exposure estimate at finalize time for the measured period (what the plan books now)"
        difference: "accrues only whole days observed inside [accrual_window_start, accrual_window_end]; the FINAL variant — applied when the deficiency is CLOSED — never recomputes past windows, so provisional accruals stand as booked and the variant pair differs whenever excuse/closure timing differs from the projection horizon"

  - name: evaluation_penalty_rollup
    trigger: "evaluation finalize (after all per-deficiency accruals); also decremented on access plan approval"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER PINNED (mode-b): round each per-deficiency accrual to integer
      # cents with round_half_up FIRST, then sum. Summing raw fractional cents first
      # and rounding once yields a different total and is forbidden.
      deficiency_total = sum over this evaluation's accrual events of round_half_up(raw_cents)
      error_total = PER_ERROR_PENALTY_CENTS * |MemberComplaints with confirmed_at inside
                    [period_start_date 00:00, period_end_date 23:59:59.999] and status in
                    {CONFIRMED_ERROR, CLOSED} (ever-confirmed within the period)|
      late_total  = LATE_CORRECTION_PENALTY_CENTS * |DirectoryCorrections VERIFIED with is_late
                    and verified_at inside the period|
      evaluation.total_penalty_cents = deficiency_total + error_total + late_total
      On access plan APPROVE for a deficiency of this evaluation:
        total_penalty_cents -= reversed_amount (the deficiency's outstanding before reversal)
    input_set: "Accruals of this evaluation only (a deficiency opened by an earlier evaluation contributes to that earlier evaluation's rollup); complaints/corrections attributed via listing -> location -> region, then aggregated to the whole evaluation"
    constants:
      PER_ERROR_PENALTY_CENTS: 25000
      LATE_CORRECTION_PENALTY_CENTS: 50000
    precision: "integer cents"

  - name: ghost_strike_count
    trigger: "each probe record (POST /network/probes/{id}/record); reset on UNDER_REVIEW -> LISTED"
    algorithm: chronological
    formula: |
      Replay the listing's RECORDED probes ordered by recorded_at ASC, tie-break created_at ASC.
      Walk the replay: PASS -> running = 0 ; FAIL -> running += 1.
      ghost_strike_count = running after the newest probe.
      If ghost_strike_count >= GHOST_STRIKE_THRESHOLD and listing.status == LISTED:
        listing -> UNDER_REVIEW
    input_set: "Only RECORDED probes of this one listing"
    constants:
      GHOST_STRIKE_THRESHOLD: 3
    precision: "integer count; boundary is >= (the 3rd consecutive FAIL transitions)"

  - name: probe_wait_days
    trigger: "probe record"
    algorithm: threshold
    formula: |
      days_to_appointment = (offered_appointment_date - requested_date) in whole days (KEPT only)
      limit = standard.max_wait_days_routine if probe_type == ROUTINE else standard.max_wait_days_urgent
      result = PASS iff outcome == KEPT and days_to_appointment <= limit  (inclusive boundary)
    input_set: "the single probe; standard = NetworkStandard(listing.specialty, listing.location.region.geo_class)"
    precision: "whole days; <= is inclusive (days == limit passes)"

  - name: time_distance_compliance
    trigger: "evaluation finalize (per RegionSpecialtyResult row)"
    algorithm: threshold
    formula: |
      counted_locations = locations hosting counted LISTED listings (panel OPEN, provider EFFECTIVE)
      compliant_location = loc.avg_travel_minutes <= standard.max_travel_minutes
                       AND loc.avg_travel_miles <= standard.max_travel_miles
      # integer arithmetic — no float: 90% boundary expressed as 10*ok >= 9*total
      time_distance_compliant = (10 * compliant_location_count >= 9 * counted_location_count)
                                when counted_location_count > 0 else (member_count == 0)
    input_set: "counted locations of the (region, specialty) pair only"
    precision: "exact integer comparison; exactly 90% compliant locations passes (>=)"

  - name: attestation_response_rate
    trigger: "on read of AttestationCycle counters"
    algorithm: aggregation
    formula: |
      strict_rate  = |records ATTESTED| / total_records
      lenient_rate = (|ATTESTED| + |CORRECTION_REQUESTED|) / total_records
      total_records excludes CANCELLED records
    input_set: "AttestationRecords of the cycle with status != CANCELLED"
    precision: "4 decimal places, round_half_up; 0/0 defined as null"
    variants:
      - name: lenient_variant
        when: "outreach-effectiveness reporting"
        difference: "counts CORRECTION_REQUESTED as a response; strict_variant counts only clean ATTESTED — identical records, different numerator"

  - name: listed_count_invariant
    trigger: "asserted after every provider suspend/reinstate pair and listing suppress/reinstate pair"
    algorithm: aggregation
    formula: |
      listed_count(R, S) = |DirectoryListings l: l.status == LISTED AND l.specialty == S
                            AND l.location.region_id == R|
      INVARIANT: provider suspend followed by reinstate leaves listed_count(R, S) unchanged
      for every (R, S); manual suppress + reinstate of the same listing likewise nets zero.
    input_set: "all DirectoryListing rows"
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role recognized"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role is listed for the endpoint"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Entity-backed ownership: ProviderRep X-User-ID must equal the record's listing's provider_id; Member X-User-ID must be an existing Member id used as complaint.member_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /network/attestation-records/{id}/respond, POST /network/complaints"
  - priority: 3.5
    category: state
    check: "OCC version check per §1.2.1: expected_<parent>_version must equal the parent row's current version; performed BEFORE any business logic on the four OCC-guarded writes"
    error_id: "ERR_STALE_STANDARD_VERSION | ERR_STALE_LOCATION_VERSION | ERR_STALE_LISTING_VERSION | ERR_STALE_DEFICIENCY_VERSION"
    http_status: 412
    applies_to: "PUT /network/standards/{id}, PATCH /network/locations/{id}, PATCH /network/listings/{id}, POST /network/deficiencies/{id}/access-plan-requests"
  - priority: 4
    category: existence
    check: "Path ids and body-referenced ids exist, validated left-to-right"
    error_id: "ERR_REGION_NOT_FOUND | ERR_STANDARD_NOT_FOUND | ERR_PROVIDER_NOT_FOUND | ERR_LOCATION_NOT_FOUND | ERR_LISTING_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_CYCLE_NOT_FOUND | ERR_ATTESTATION_RECORD_NOT_FOUND | ERR_PROBE_NOT_FOUND | ERR_EVALUATION_NOT_FOUND | ERR_DEFICIENCY_NOT_FOUND | ERR_ACCESS_PLAN_REQUEST_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND | ERR_CORRECTION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with ids"
  - priority: 5
    category: state
    check: "State-machine precondition of the target entity (provider EFFECTIVE for publish; listing correct from-state; cycle advanceable state; record respondable; probe SCHEDULED; evaluation OPEN; deficiency OPEN for plan create/decide; request SUBMITTED for decide; complaint OPEN for adjudicate; correction SUBMITTED for verify; member ENROLLED for disenroll/complaint filing; listing not REMOVED for complaint/correction/probe-create)"
    error_id: "ERR_PROVIDER_INVALID_TRANSITION | ERR_PROVIDER_NOT_EFFECTIVE | ERR_LISTING_INVALID_TRANSITION | ERR_LISTING_NOT_LISTED | ERR_LISTING_REMOVED | ERR_CYCLE_INVALID_STATE | ERR_RECORD_NOT_RESPONDABLE | ERR_PROBE_INVALID_STATE | ERR_EVALUATION_INVALID_STATE | ERR_UNRECORDED_PROBES_EXIST | ERR_DEFICIENCY_NOT_OPEN | ERR_REQUEST_NOT_SUBMITTABLE | ERR_REQUEST_NOT_DECIDABLE | ERR_COMPLAINT_NOT_OPEN | ERR_CORRECTION_NOT_VERIFIABLE | ERR_MEMBER_NOT_ENROLLED"
    http_status: 409
    applies_to: "transition endpoints"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: correction verifier X-User-ID must differ from correction.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: "POST /network/corrections/{id}/verify"
  - priority: 7
    category: business_temporal
    check: "Clock/window guards: cycle advance date gates (open_date/due_date/outreach_close_date); complaint filing window (filed_date - error_observed_date <= 90 days, observed <= filed); probe offered >= requested and requested <= clock date; access-plan excuse_start >= clock date and excuse_through >= excuse_start"
    error_id: "ERR_CYCLE_NOT_YET_ADVANCEABLE | ERR_COMPLAINT_WINDOW_EXPIRED | ERR_PROBE_DATE_ORDER | ERR_EXCUSE_WINDOW_INVALID"
    http_status: 422
    applies_to: "cycle advance, POST /network/complaints, probe create/record, access-plan create"
  - priority: 8
    category: business_referential
    check: "Cross-entity coherence: listing.location.provider_id == listing.provider_id; complaint listing's location region == member's region; correction.complaint.listing_id == correction.listing_id; publish requires a NetworkStandard for (listing.specialty, region.geo_class)"
    error_id: "ERR_LOCATION_PROVIDER_MISMATCH | ERR_LISTING_NOT_IN_MEMBER_REGION | ERR_CORRECTION_LISTING_MISMATCH | ERR_SPECIALTY_STANDARD_MISSING"
    http_status: 422
    applies_to: "POST /network/listings, publish, POST /network/complaints, POST /network/corrections"
  - priority: 9
    category: business_constraint
    check: "Uniqueness & overlap & singletons: npi unique; county_fips unique; member_ref unique; (specialty, geo_class) standard unique; one LISTED listing per (location_id, specialty); cycle windows [open_date, outreach_close_date) half-open non-overlapping across ALL cycles; at most one cycle in OPEN|OUTREACH at open time; at most one OPEN evaluation; approved excuse windows (closed interval) non-overlapping per deficiency"
    error_id: "ERR_NPI_DUPLICATE | ERR_REGION_DUPLICATE | ERR_MEMBER_REF_DUPLICATE | ERR_STANDARD_DUPLICATE | ERR_LISTING_ALREADY_LISTED | ERR_CYCLE_WINDOW_OVERLAP | ERR_CYCLE_ALREADY_ACTIVE | ERR_EXCUSE_WINDOW_OVERLAP | ERR_EVALUATION_ALREADY_OPEN"
    http_status: 409
    applies_to: "create endpoints, cycle advance, access-plan decide"
  - priority: 10
    category: business_fiscal
    check: "No fiscal gate exists — penalty exposure is computed, never a precondition. Row kept to pin that fiscal checks would run LAST if added."
    error_id: "ERR_INVALID_REQUEST"
    http_status: 400
    applies_to: "none (documentation row); ERR_INVALID_REQUEST also covers malformed payloads / missing required fields / invalid enum values / bad date ordering at create time"

