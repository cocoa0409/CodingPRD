  # ==========================================================================
  # Rule 2 — combinatorial formulas across different modes
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: maintenance_requirement_mode_a_tiered_concentration_nesting
        grounds:
          - calculations.maintenance_requirement
        distinguishing_aspect: |
          Mode (a) nested min/max with state-keyed tier selection: a position
          whose share sits in the (6000, 7500] band yields house req
          600060*4000/10000=240024 for the line; crossing into the >7500 band
          lifts the add-on from 1000 to 2000 bps.
        test_recipe:
          setup:
            - "Account holds 100 ABC (only position); ABC house_maint_long_bps 3000, concentration_threshold_bps 6000; official and realtime marks 10000"
          setup_api_calls:
            - { call: "POST /margin/customers", payload: { legal_name: "Nia Long", email: "nia@example.com" }, as: MarginAnalyst, captures: { c_id: $.data.id } }
            - { call: "POST /margin/security-profiles", payload: { symbol: "ABC", marginable: true, house_maint_long_bps: 3000, house_maint_short_bps: 3500, liquidity_tier: 1, concentration_threshold_bps: 6000 }, as: MarginSupervisor, captures: { sec_abc: $.data.id } }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "REALTIME", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "OFFICIAL_CLOSE", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/account-applications", payload: { customer_id: "${c_id}", annual_income_cents: 15000000, liquid_net_worth_cents: 50000000, investment_experience_years: 5 }, as: Customer, as_user_id: "${c_id}", captures: { app_id: $.data.id } }
            - { call: "POST /margin/account-applications/${app_id}/review", payload: {}, as: MarginAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /margin/account-applications/${app_id}/approve", payload: {}, as: MarginSupervisor, as_user_id: "sup-1", captures: { acct_id: $.data.account_id } }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { acct_v0: $.data.version } }
            - { call: "POST /margin/accounts/${acct_id}/cash-movements", payload: { movement_type: "DEPOSIT", amount_cents: 1000000, expected_account_version: "${acct_v0}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/accounts/${acct_id}/orders", payload: { security_id: "${sec_abc}", side: "BUY", quantity: 100 }, as: Customer, as_user_id: "${c_id}" }
          trigger:
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { house_req_off: $.data.house_req_official_cents, reg_req_off: $.data.reg_req_official_cents } }
          assert:
            - "MarginAccount.${acct_id}.house_req_official_cents == 500000  # share 10000bps > 7500 -> house 3000+2000=5000bps on 1000000"
            - "MarginAccount.${acct_id}.reg_req_official_cents == 250000  # flat 2500bps, no concentration concept"

      - name: interest_accrual_mode_b_per_day_rounding_pinned
        grounds:
          - calculations.interest_accrual
        distinguishing_aspect: |
          Mode (b) nested rounding order: 5 days of accrual on a 12000001-cent
          debit at 950bps yields 5*3167 = 15835 under the pinned per-day-round-
          then-sum order; sum-then-round would give round(15833.3346) = 15833.
        test_recipe:
          setup:
            - "Account with debit exactly 12000001 cents held constant for 5 sweep days (cash -12000001 achieved by depositing 11999999 and buying 24000000 cents of XYZ)"
            - "Tier 3 rate 950bps effective"
          setup_api_calls:
            - { call: "POST /margin/customers", payload: { legal_name: "Omar Epps", email: "omar@example.com" }, as: MarginAnalyst, captures: { c_id: $.data.id } }
            - { call: "POST /margin/security-profiles", payload: { symbol: "XYZ", marginable: true, house_maint_long_bps: 3000, house_maint_short_bps: 3500, liquidity_tier: 1, concentration_threshold_bps: 9500 }, as: MarginSupervisor, captures: { sec_xyz: $.data.id } }
            - { call: "POST /margin/rate-tiers", payload: { tier_level: 3, min_balance_cents: 10000000, annual_rate_bps: 950, effective_from: "2026-01-01", effective_to: null }, as: MarginSupervisor }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_xyz}", mark_type: "REALTIME", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_xyz}", mark_type: "OFFICIAL_CLOSE", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/account-applications", payload: { customer_id: "${c_id}", annual_income_cents: 90000000, liquid_net_worth_cents: 90000000, investment_experience_years: 9 }, as: Customer, as_user_id: "${c_id}", captures: { app_id: $.data.id } }
            - { call: "POST /margin/account-applications/${app_id}/review", payload: {}, as: MarginAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /margin/account-applications/${app_id}/approve", payload: {}, as: MarginSupervisor, as_user_id: "sup-1", captures: { acct_id: $.data.account_id } }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { acct_v0: $.data.version } }
            - { call: "POST /margin/accounts/${acct_id}/cash-movements", payload: { movement_type: "DEPOSIT", amount_cents: 11999999, expected_account_version: "${acct_v0}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/accounts/${acct_id}/orders", payload: { security_id: "${sec_xyz}", side: "BUY", quantity: 2400 }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /_sweeps/daily", payload: {}, as: MarketDataOps }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T00:00:00Z" }, as: MarketDataOps }
            - { call: "POST /_sweeps/daily", payload: {}, as: MarketDataOps }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:00Z" }, as: MarketDataOps }
            - { call: "POST /_sweeps/daily", payload: {}, as: MarketDataOps }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T00:00:00Z" }, as: MarketDataOps }
            - { call: "POST /_sweeps/daily", payload: {}, as: MarketDataOps }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T00:00:00Z" }, as: MarketDataOps }
            - { call: "POST /_sweeps/daily", payload: {}, as: MarketDataOps }
          trigger:
            - { call: "GET /margin/accounts/${acct_id}/interest-summary", payload: {}, as: MarginSupervisor, captures: { mtd: $.data.month_to_date_accrued_cents } }
          assert:
            - "month_to_date_accrued_cents == 15835  # 5 * round_half_up(12000001*950/10000/360) = 5*3167; sum-then-round would be 15833"

  # ==========================================================================
  # Rule 3 — non-linear state machines on different entities
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: margin_call_dispute_cycle_open_disputed_open
        grounds:
          - state_machines.MarginCall.OPEN_to_DISPUTED
          - state_machines.MarginCall.DISPUTED_to_OPEN
        distinguishing_aspect: |
          MarginCall cycle: OPEN -> DISPUTED -> OPEN on dispute file then
          UPHELD decision, with due_at provably unchanged by the detour.
        test_recipe:
          setup:
            - "Account RESTRICTED with one OPEN HOUSE call of 300000 cents (200 ABC bought at 10000 with 1000000 deposit; official mark dropped to 7000)"
          setup_api_calls:
            - { call: "POST /margin/customers", payload: { legal_name: "Cy Curnin", email: "cy@example.com" }, as: MarginAnalyst, captures: { c_id: $.data.id } }
            - { call: "POST /margin/security-profiles", payload: { symbol: "ABC", marginable: true, house_maint_long_bps: 3000, house_maint_short_bps: 3500, liquidity_tier: 1, concentration_threshold_bps: 6000 }, as: MarginSupervisor, captures: { sec_abc: $.data.id } }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "REALTIME", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "OFFICIAL_CLOSE", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/account-applications", payload: { customer_id: "${c_id}", annual_income_cents: 15000000, liquid_net_worth_cents: 50000000, investment_experience_years: 5 }, as: Customer, as_user_id: "${c_id}", captures: { app_id: $.data.id } }
            - { call: "POST /margin/account-applications/${app_id}/review", payload: {}, as: MarginAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /margin/account-applications/${app_id}/approve", payload: {}, as: MarginSupervisor, as_user_id: "sup-1", captures: { acct_id: $.data.account_id } }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { acct_v0: $.data.version } }
            - { call: "POST /margin/accounts/${acct_id}/cash-movements", payload: { movement_type: "DEPOSIT", amount_cents: 1000000, expected_account_version: "${acct_v0}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/accounts/${acct_id}/orders", payload: { security_id: "${sec_abc}", side: "BUY", quantity: 200 }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "OFFICIAL_CLOSE", price_cents: 7000 }, as: MarketDataOps }
            - { call: "GET /margin/accounts/${acct_id}/margin-calls", payload: {}, as: MarginSupervisor, captures: { call_id: "$.data[0].id", due_at_0: "$.data[0].due_at" } }
          trigger:
            - { call: "POST /margin/disputes", payload: { call_id: "${call_id}", reason: "Mark was erroneous" }, as: Customer, as_user_id: "${c_id}", captures: { dsp_id: $.data.id } }
            - { call: "POST /margin/disputes/${dsp_id}/start-review", payload: {}, as: MarginAnalyst, as_user_id: "analyst-2" }
            - { call: "POST /margin/disputes/${dsp_id}/decide", payload: { decision: "UPHELD" }, as: MarginSupervisor, as_user_id: "sup-1" }
            - { call: "GET /margin/margin-calls/${call_id}", payload: {}, as: MarginSupervisor, captures: { due_at_1: $.data.due_at, st: $.data.call_status } }
          assert:
            - "MarginCall.${call_id}.call_status == OPEN  # cycle completed DISPUTED -> OPEN"
            - "MarginCall.${call_id}.due_at unchanged by the dispute detour"
            - "Dispute.${dsp_id}.dispute_status == CLOSED"
            - "Dispute.${dsp_id}.decision == UPHELD"

      - name: application_resubmit_cycle_rejected_to_submitted
        grounds:
          - state_machines.AccountApplication.REJECTED_to_SUBMITTED
        distinguishing_aspect: |
          AccountApplication cycle on a different entity than MarginCall:
          SUBMITTED -> COMPLIANCE_REVIEW -> REJECTED -> SUBMITTED ->
          COMPLIANCE_REVIEW -> APPROVED, with reviewer/decider reset on loop-back.
        test_recipe:
          setup:
            - "Customer with an application that gets rejected then resubmitted with improved financials"
          setup_api_calls:
            - { call: "POST /margin/customers", payload: { legal_name: "Rey Mysterio", email: "rey@example.com" }, as: MarginAnalyst, captures: { c_id: $.data.id } }
            - { call: "POST /margin/account-applications", payload: { customer_id: "${c_id}", annual_income_cents: 1000000, liquid_net_worth_cents: 100000, investment_experience_years: 0 }, as: Customer, as_user_id: "${c_id}", captures: { app_id: $.data.id } }
            - { call: "POST /margin/account-applications/${app_id}/review", payload: {}, as: MarginAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /margin/account-applications/${app_id}/reject", payload: { reason: "Insufficient experience" }, as: MarginSupervisor, as_user_id: "sup-1" }
          trigger:
            - { call: "POST /margin/account-applications/${app_id}/resubmit", payload: { liquid_net_worth_cents: 5000000, investment_experience_years: 2 }, as: Customer, as_user_id: "${c_id}", captures: { st: $.data.application_status, rev: $.data.reviewed_by_user_id } }
            - { call: "POST /margin/account-applications/${app_id}/review", payload: {}, as: MarginAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /margin/account-applications/${app_id}/approve", payload: {}, as: MarginSupervisor, as_user_id: "sup-1", captures: { acct_id: $.data.account_id } }
          assert:
            - "resubmit returns application_status == SUBMITTED with reviewed_by_user_id null"
            - "second cycle approve succeeds: AccountApplication.${app_id}.application_status == APPROVED"
            - "MarginAccount created for customer ${c_id} with account_status == ACTIVE"

  # ==========================================================================
  # Rule 4 — transitive cascades from different triggers
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: official_mark_drop_cascades_mark_to_position_to_equity_to_call_to_restriction
        grounds:
          - state_machines.MarginAccount.ACTIVE_to_RESTRICTED
          - state_machines.MarginCall.OPEN
          - calculations.call_amount
        distinguishing_aspect: |
          Depth-4 chain from POST /margin/market-marks: mark mutates
          Position.mv_official (1) -> account equity/requirements recompute (2)
          -> MarginCall HOUSE created for 300000 (3) -> account flips
          ACTIVE -> RESTRICTED (4). HOUSE (not MAINTENANCE) because reg excess
          is +50000 while house excess is -300000.
        test_recipe:
          setup:
            - "Account: deposit 1000000, buy 200 ABC at 10000 (cash -1000000, MV 2000000, equity 1000000); official mark 10000 already posted"
          setup_api_calls:
            - { call: "POST /margin/customers", payload: { legal_name: "Cas Cade", email: "cas@example.com" }, as: MarginAnalyst, captures: { c_id: $.data.id } }
            - { call: "POST /margin/security-profiles", payload: { symbol: "ABC", marginable: true, house_maint_long_bps: 3000, house_maint_short_bps: 3500, liquidity_tier: 1, concentration_threshold_bps: 6000 }, as: MarginSupervisor, captures: { sec_abc: $.data.id } }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "REALTIME", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "OFFICIAL_CLOSE", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/account-applications", payload: { customer_id: "${c_id}", annual_income_cents: 15000000, liquid_net_worth_cents: 50000000, investment_experience_years: 5 }, as: Customer, as_user_id: "${c_id}", captures: { app_id: $.data.id } }
            - { call: "POST /margin/account-applications/${app_id}/review", payload: {}, as: MarginAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /margin/account-applications/${app_id}/approve", payload: {}, as: MarginSupervisor, as_user_id: "sup-1", captures: { acct_id: $.data.account_id } }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { acct_v0: $.data.version } }
            - { call: "POST /margin/accounts/${acct_id}/cash-movements", payload: { movement_type: "DEPOSIT", amount_cents: 1000000, expected_account_version: "${acct_v0}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/accounts/${acct_id}/orders", payload: { security_id: "${sec_abc}", side: "BUY", quantity: 200 }, as: Customer, as_user_id: "${c_id}" }
          trigger:
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "OFFICIAL_CLOSE", price_cents: 7000 }, as: MarketDataOps }
            - { call: "GET /margin/accounts/${acct_id}/margin-calls", payload: {}, as: MarginSupervisor, captures: { call_id: "$.data[0].id", call_amt: "$.data[0].call_amount_cents", call_ty: "$.data[0].call_type" } }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { acct_st: $.data.account_status, eq_off: $.data.equity_official_cents } }
          assert:
            - "MarginCall.${call_id}.call_type == HOUSE"
            - "MarginCall.${call_id}.call_amount_cents == 300000  # house req 700000 - equity 400000"
            - "MarginAccount.${acct_id}.equity_official_cents == 400000"
            - "MarginAccount.${acct_id}.account_status == RESTRICTED  # hop 4 of the cascade"

      - name: liquidation_fill_cascades_fill_to_position_to_equity_to_cure_to_activation
        grounds:
          - state_machines.LiquidationOrder.PENDING_to_EXECUTED
          - state_machines.MarginCall.LIQUIDATION_IN_PROGRESS_to_CURED
          - state_machines.MarginAccount.RESTRICTED_to_ACTIVE
        distinguishing_aspect: |
          Depth-4 chain from a different trigger (POST /margin/liquidation-orders/{id}/fill):
          fill mutates Position quantity/cash (1) -> account equity/requirements
          recompute (2) -> call cure test passes, LIQUIDATION_IN_PROGRESS ->
          CURED with method LIQUIDATION (3) -> last non-terminal call gone so
          account RESTRICTED -> ACTIVE (4).
        test_recipe:
          setup:
            - "Account RESTRICTED with EXPIRED HOUSE call of 300000; 200 ABC position; official mark 7000; liquidation order for all 200 shares created by desk-1"
          setup_api_calls:
            - { call: "POST /margin/customers", payload: { legal_name: "Liq Widation", email: "liq@example.com" }, as: MarginAnalyst, captures: { c_id: $.data.id } }
            - { call: "POST /margin/security-profiles", payload: { symbol: "ABC", marginable: true, house_maint_long_bps: 3000, house_maint_short_bps: 3500, liquidity_tier: 1, concentration_threshold_bps: 6000 }, as: MarginSupervisor, captures: { sec_abc: $.data.id } }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "REALTIME", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "OFFICIAL_CLOSE", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/account-applications", payload: { customer_id: "${c_id}", annual_income_cents: 15000000, liquid_net_worth_cents: 50000000, investment_experience_years: 5 }, as: Customer, as_user_id: "${c_id}", captures: { app_id: $.data.id } }
            - { call: "POST /margin/account-applications/${app_id}/review", payload: {}, as: MarginAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /margin/account-applications/${app_id}/approve", payload: {}, as: MarginSupervisor, as_user_id: "sup-1", captures: { acct_id: $.data.account_id } }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { acct_v0: $.data.version } }
            - { call: "POST /margin/accounts/${acct_id}/cash-movements", payload: { movement_type: "DEPOSIT", amount_cents: 1000000, expected_account_version: "${acct_v0}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/accounts/${acct_id}/orders", payload: { security_id: "${sec_abc}", side: "BUY", quantity: 200 }, as: Customer, as_user_id: "${c_id}", captures: { pos_id: $.data.id } }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "OFFICIAL_CLOSE", price_cents: 7000 }, as: MarketDataOps }
            - { call: "GET /margin/accounts/${acct_id}/margin-calls", payload: {}, as: MarginSupervisor, captures: { call_id: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:01Z" }, as: MarketDataOps }
            - { call: "POST /_sweeps/daily", payload: {}, as: MarketDataOps }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { acct_v1: $.data.version } }
            - { call: "POST /margin/accounts/${acct_id}/liquidation-orders", payload: { call_id: "${call_id}", expected_account_version: "${acct_v1}" }, as: LiquidationDesk, as_user_id: "desk-1", captures: { lo_id: $.data.id, lo_qty: $.data.quantity } }
          trigger:
            - { call: "POST /margin/liquidation-orders/${lo_id}/fill", payload: { filled_quantity: 200, fill_price_cents: 7000 }, as: LiquidationDesk, as_user_id: "desk-2" }
            - { call: "GET /margin/margin-calls/${call_id}", payload: {}, as: MarginSupervisor, captures: { call_st: $.data.call_status, cure: $.data.cure_method } }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { acct_st: $.data.account_status, cash: $.data.cash_balance_cents } }
          assert:
            - "LiquidationOrder.${lo_id}.order_status == EXECUTED"
            - "MarginAccount.${acct_id}.cash_balance_cents == 400000  # -1000000 + 200*7000"
            - "MarginCall.${call_id}.call_status == CURED"
            - "MarginCall.${call_id}.cure_method == LIQUIDATION"
            - "MarginAccount.${acct_id}.account_status == ACTIVE  # hop 4"

  # ==========================================================================
  # Rule 5 — validation priority conflicts across different error-category pairs
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: withdrawal_state_beats_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=10]
        distinguishing_aspect: |
          state (priority 5) vs business_fiscal (priority 10): a WITHDRAWAL on
          a RESTRICTED account that ALSO exceeds cash returns
          ERR_ACCOUNT_RESTRICTED (409), never ERR_INSUFFICIENT_CASH.
        test_recipe:
          setup:
            - "Account RESTRICTED (OPEN HOUSE call) with cash -1000000; any withdrawal would also fail the cash check"
          setup_api_calls:
            - { call: "POST /margin/customers", payload: { legal_name: "Pri Ority", email: "pri@example.com" }, as: MarginAnalyst, captures: { c_id: $.data.id } }
            - { call: "POST /margin/security-profiles", payload: { symbol: "ABC", marginable: true, house_maint_long_bps: 3000, house_maint_short_bps: 3500, liquidity_tier: 1, concentration_threshold_bps: 6000 }, as: MarginSupervisor, captures: { sec_abc: $.data.id } }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "REALTIME", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "OFFICIAL_CLOSE", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/account-applications", payload: { customer_id: "${c_id}", annual_income_cents: 15000000, liquid_net_worth_cents: 50000000, investment_experience_years: 5 }, as: Customer, as_user_id: "${c_id}", captures: { app_id: $.data.id } }
            - { call: "POST /margin/account-applications/${app_id}/review", payload: {}, as: MarginAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /margin/account-applications/${app_id}/approve", payload: {}, as: MarginSupervisor, as_user_id: "sup-1", captures: { acct_id: $.data.account_id } }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { acct_v0: $.data.version } }
            - { call: "POST /margin/accounts/${acct_id}/cash-movements", payload: { movement_type: "DEPOSIT", amount_cents: 1000000, expected_account_version: "${acct_v0}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/accounts/${acct_id}/orders", payload: { security_id: "${sec_abc}", side: "BUY", quantity: 200 }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "OFFICIAL_CLOSE", price_cents: 7000 }, as: MarketDataOps }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { acct_v1: $.data.version } }
          trigger:
            - { call: "POST /margin/accounts/${acct_id}/cash-movements", payload: { movement_type: "WITHDRAWAL", amount_cents: 500000, expected_account_version: "${acct_v1}" }, as: Customer, as_user_id: "${c_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ACCOUNT_RESTRICTED  # state category outranks business_fiscal"
            - "http status == 409, not 402"

      - name: order_pdt_safety_beats_marginable_constraint
        grounds:
          - validations[priority=6]
          - validations[priority=8]
        distinguishing_aspect: |
          business_safety (priority 6) vs business_constraint (priority 8): a
          PDT-flagged account with equity 2499999 placing an opening BUY on a
          NON-marginable security gets ERR_PDT_MIN_EQUITY (403), never
          ERR_SECURITY_NOT_MARGINABLE.
        test_recipe:
          setup:
            - "PDT-flagged account (4 day-trade events among 8 fills today, swept) with equity_realtime exactly 2499999 after withdrawing 500001 from 3000000 cash; security NM exists with marginable=false and a realtime mark"
          setup_api_calls:
            - { call: "POST /margin/customers", payload: { legal_name: "Pat Tern", email: "pat@example.com" }, as: MarginAnalyst, captures: { c_id: $.data.id } }
            - { call: "POST /margin/security-profiles", payload: { symbol: "ABC", marginable: true, house_maint_long_bps: 3000, house_maint_short_bps: 3500, liquidity_tier: 1, concentration_threshold_bps: 9000 }, as: MarginSupervisor, captures: { sec_abc: $.data.id } }
            - { call: "POST /margin/security-profiles", payload: { symbol: "NM", marginable: false, house_maint_long_bps: 10000, house_maint_short_bps: 10000, liquidity_tier: 9, concentration_threshold_bps: 9000 }, as: MarginSupervisor, captures: { sec_nm: $.data.id } }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "REALTIME", price_cents: 1000 }, as: MarketDataOps }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "OFFICIAL_CLOSE", price_cents: 1000 }, as: MarketDataOps }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_nm}", mark_type: "REALTIME", price_cents: 500 }, as: MarketDataOps }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_nm}", mark_type: "OFFICIAL_CLOSE", price_cents: 500 }, as: MarketDataOps }
            - { call: "POST /margin/account-applications", payload: { customer_id: "${c_id}", annual_income_cents: 50000000, liquid_net_worth_cents: 90000000, investment_experience_years: 7 }, as: Customer, as_user_id: "${c_id}", captures: { app_id: $.data.id } }
            - { call: "POST /margin/account-applications/${app_id}/review", payload: {}, as: MarginAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /margin/account-applications/${app_id}/approve", payload: {}, as: MarginSupervisor, as_user_id: "sup-1", captures: { acct_id: $.data.account_id } }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { acct_v0: $.data.version } }
            - { call: "POST /margin/accounts/${acct_id}/cash-movements", payload: { movement_type: "DEPOSIT", amount_cents: 3000000, expected_account_version: "${acct_v0}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/accounts/${acct_id}/orders", payload: { security_id: "${sec_abc}", side: "BUY", quantity: 10 }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/accounts/${acct_id}/orders", payload: { security_id: "${sec_abc}", side: "SELL", quantity: 10 }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/accounts/${acct_id}/orders", payload: { security_id: "${sec_abc}", side: "BUY", quantity: 10 }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/accounts/${acct_id}/orders", payload: { security_id: "${sec_abc}", side: "SELL", quantity: 10 }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/accounts/${acct_id}/orders", payload: { security_id: "${sec_abc}", side: "BUY", quantity: 10 }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/accounts/${acct_id}/orders", payload: { security_id: "${sec_abc}", side: "SELL", quantity: 10 }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/accounts/${acct_id}/orders", payload: { security_id: "${sec_abc}", side: "BUY", quantity: 10 }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/accounts/${acct_id}/orders", payload: { security_id: "${sec_abc}", side: "SELL", quantity: 10 }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /_sweeps/daily", payload: {}, as: MarketDataOps }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { acct_v1: $.data.version, pdt: $.data.pdt_flag } }
            - { call: "POST /margin/accounts/${acct_id}/cash-movements", payload: { movement_type: "WITHDRAWAL", amount_cents: 500001, expected_account_version: "${acct_v1}" }, as: Customer, as_user_id: "${c_id}" }
          trigger:
            - { call: "POST /margin/accounts/${acct_id}/orders", payload: { security_id: "${sec_nm}", side: "BUY", quantity: 1 }, as: Customer, as_user_id: "${c_id}", captures: { err: $.data.error_id } }
          assert:
            - "pdt_flag == true after sweep (4 events, 8 fills; 4*100=400 > 6*8=48)"
            - "error_id == ERR_PDT_MIN_EQUITY  # safety outranks constraint"
            - "http status == 403, not 422"

  # ==========================================================================
  # Rule 6 — boundary precision on different metrics/endpoints
  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: pdt_equity_boundary_exact_2500000_opens_allowed
        grounds:
          - calculations.pdt_flag_evaluation
          - validations[priority=6]
        distinguishing_aspect: |
