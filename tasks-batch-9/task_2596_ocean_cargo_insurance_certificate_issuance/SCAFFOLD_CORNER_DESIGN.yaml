      - name: conveyance_and_annual_aggregate_limits_accumulate_across_certificates
        claim_type: aggregate_validation
        grounds:
          - validations.priority_21
          - validations.priority_24
          - errors.ERR_CONVEYANCE_LIMIT_EXCEEDED
          - errors.ERR_ANNUAL_AGGREGATE_EXCEEDED
          - calculations.accumulation_exposure_check
        distinguishing_aspect: |
          Every individual line is within every individual limit; only the
          collective breaches. Two 1600000.00 lines on the SAME vessel and SAME
          sailing date exceed the 3000000.00 conveyance limit, but the third line
          on a DIFFERENT sailing date is accepted because the conveyance bucket is
          keyed on (vessel_id, sailing_date) — and the fourth line, also on a
          fresh sailing date and well inside the conveyance limit, is refused by
          the 3600000.00 annual aggregate instead. The two errors are therefore
          distinguished by which bucket overflowed, not by the line size.
        test_recipe:
          setup:
            - "policy limits: per_certificate 2000000.00, conveyance 3000000.00, annual_aggregate 3600000.00"
            - "vessel limit 8000000.00 and port limit 8000000.00 so neither of those buckets can interfere"
            - "four DECLARED_VALUE certificates of 1600000.00 each on MV Kite: two sailing 2026-08-10, one 2026-08-20, one 2026-08-25"
