      - name: escalation_close_conserves_vessel_clearance
        grounds:
          - state_machines.NoncomplianceRecord.OPEN_to_ESCALATED
          - state_machines.EnforcementCase.ACTIVE_to_UNDER_REVIEW
          - state_machines.EnforcementCase.UNDER_REVIEW_to_CLOSED_PENALTY
          - entities.Vessel.fields.compliance_posture
        distinguishing_aspect: |
          Conserved quantity (3): vessel clearance — active_enforcement_case_id null-ness paired with
          compliance_posture. Forward action (clock-driven escalation) sets the case link and drives
          posture OPEN -> RESTRICTED; the compensating close-out (submit-response then close with
          penalty_assessed=true) restores both: active_enforcement_case_id == null and posture == OPEN
          (the MINOR record contributes neither p1_open nor critical_recent to the rollup).
        test_recipe:
          setup:
            - "Vessel with APPROVED plan; voyage V9103 departed, arrived_at input 2026-08-10 (report due 2026-08-09T00:00:00Z); report DRAFT"
            - "Clock to 2026-08-09T00:00:01Z (OVERDUE, MINOR record), then 2026-09-15T00:00:02Z (ESCALATED, case ACTIVE)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vessels"
              payload: { imo_number: "9000028", vessel_name: "MV Bufflehead", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 40000, keel_laid_date: "2010-10-01T00:00:00Z", ballast_capacity_m3: 30000 }
              as: ShoreComplianceOfficer
              captures: { v: $.data.id, v_ver: $.data.version, posture0: $.data.compliance_posture }
            - call: "POST /vessels/${v}/plans"
              payload: { plan_revision: 1, approval_authority: USCG, approved_at: "2025-02-01T00:00:00Z", exchange_distance_nm: 200, sediment_management_included: true, expected_vessel_version: "${v_ver}" }
              as: ShoreComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /vessels/${v}/plans/${p1}/submit"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/plans/${p1}/approve"
              as: FlagSurveyor
            - call: "POST /vessels/${v}/voyages"
              payload: { voyage_number: "V9103", departure_port: USNYC, arrival_port: USLAX, departed_at: "2026-07-28T00:00:00Z", arrived_at: "2026-08-10T00:00:00Z", crosses_captain_of_port_zones: true, enters_us_eez: true }
              as: VesselMaster
              captures: { vy: $.data.id }
            - call: "POST /vessels/${v}/voyages/${vy}/depart"
              as: VesselMaster
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T00:00:01Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:02Z" }
              as: PlatformAdmin
            - call: "GET /vessels/${v}"
              as: ShoreComplianceOfficer
              captures: { posture1: $.data.compliance_posture, case1: $.data.active_enforcement_case_id }
          trigger:
            - call: "POST /vessels/${v}/enforcement-cases/${case1}/submit-response"
              as: ShoreComplianceOfficer
            - call: "POST /vessels/${v}/enforcement-cases/${case1}/close"
              payload: { penalty_assessed: true }
              as: FlagSurveyor
              captures: { case_st: $.data.status, case_closed: $.data.closed_at }
            - call: "GET /vessels/${v}"
              as: ShoreComplianceOfficer
              captures: { posture2: $.data.compliance_posture, case2: $.data.active_enforcement_case_id }
          assert:
            - "${posture0} == OPEN (clearance baseline)"
            - "${posture1} == RESTRICTED AND ${case1} non-null (forward action disturbed clearance)"
            - "${case_st} == CLOSED_PENALTY AND ${case_closed} == 2026-09-15T00:00:02Z"
            - "${posture2} == OPEN AND ${case2} is null (compensating close-out conserved vessel clearance)"
