              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BIKE_ALREADY_SERVICING (whole servicing span excludes a new ticket)"
            - "HTTP status == 409"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_reservation_conserves_bike_pool_count
        grounds:
          - state_machines.RentalAgreement.RESERVED_to_CANCELLED
          - state_machines.Bike.AVAILABLE_to_RESERVED
          - entities.BikeModel.fields.available_count
          - entities.BikeModel.fields.total_bikes
        distinguishing_aspect: |
          Conserved quantity = bike pool count: reserve (AVAILABLE->RESERVED) then cancel
          (RESERVED->AVAILABLE) must leave BikeModel.available_count exactly equal to total_bikes,
          i.e. the invariant available_count + (#bikes not AVAILABLE) == total_bikes holds with zero drift.
        test_recipe:
          setup:
            - "STANDARD model with 3 bikes (available_count 3, total_bikes 3); reserve one then cancel it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /bike-models"
              payload: { name: "Std", model_class: "STANDARD", monthly_fee_cents: 8000, daily_rate_cents: 2000, purchase_price_cents: 90000, deposit_cents: 10000, fleet_size: 3 }
              as: OpsAdmin
              captures: { model_id: $.data.id }
            - call: "POST /bikes"
              payload: { model_id: "${model_id}", serial_number: "S-1" }
              as: OpsAdmin
            - call: "POST /bikes"
              payload: { model_id: "${model_id}", serial_number: "S-2" }
              as: OpsAdmin
            - call: "POST /bikes"
              payload: { model_id: "${model_id}", serial_number: "S-3" }
              as: OpsAdmin
            - call: "POST /accounts"
              payload: { account_type: "SUBSCRIBER", display_name: "Sam", email: "sam@x.com", rental_cap: 1 }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "GET /bike-models/${model_id}"
              payload: {}
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { mv0: $.data.version }
            - call: "POST /rentals"
              payload: { account_id: "${acct_id}", model_id: "${model_id}", rental_mode: "MONTHLY", return_due_clock: "2027-06-01T00:00:00Z", expected_model_version: "${mv0}" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { rent_id: $.data.id }
          trigger:
            - call: "POST /rentals/${rent_id}/cancel"
              payload: {}
              as: Subscriber
              as_user_id: "${acct_id}"
            - call: "GET /bike-models/${model_id}"
              payload: {}
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { ac: $.data.available_count, tb: $.data.total_bikes }
          assert:
            - "BikeModel.${model_id}.available_count == 3 after cancel (restored to total_bikes)"
            - "BikeModel.${model_id}.total_bikes == 3 (pool conserved, zero drift)"

      - name: cancel_reservation_conserves_deposit_money
        grounds:
          - state_machines.RentalAgreement.RESERVED_to_CANCELLED
          - calculations.return_settlement
          - entities.Account.fields.wallet_credit_cents
          - entities.RentalAgreement.fields.deposit_cents
        distinguishing_aspect: |
          Conserved quantity = deposit money (a different conserved quantity than bike count): holding
          a deposit then cancelling must return the full deposit to wallet so that
          wallet_credit_cents == deposit_cents and no cents are created or lost.
        test_recipe:
          setup:
            - "STANDARD model deposit 10000; account wallet starts at 0; reserve one rental (deposit held) then cancel."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /bike-models"
              payload: { name: "Std", model_class: "STANDARD", monthly_fee_cents: 8000, daily_rate_cents: 2000, purchase_price_cents: 90000, deposit_cents: 10000, fleet_size: 2 }
              as: OpsAdmin
              captures: { model_id: $.data.id }
