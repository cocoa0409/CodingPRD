# =============================================================================
# Scaffold: University Registrar & Course Registration (Expert)
# =============================================================================

scenario: |
  University Registrar & Course Registration: catalog/section/seat, enrollment
  appointment (priority/credit hours), prerequisite/corequisite enforcement,
  waitlist/swap, drop/add/withdraw deadline & refund, financial/advising hold,
  degree audit, transcript/GPA

domain_name: university-registrar
api_prefix: /

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: graph_constraint
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: graph
  # Peer entities linked by foreign keys; Course→CourseRequirement edges form a
  # prerequisite DAG; Enrollment is a junction between Student and Section.
  state_machine_shape: parallel
  # Enrollment carries two independent state axes (registration_status ×
  # grade_status); Section/Hold/SwapRequest are branching with reverts.
  relationship_patterns:
    - one_to_many        # Term→Section, Course→Section, Student→Enrollment
    - many_to_many       # Student↔Section via Enrollment; Course↔Course via CourseRequirement
    - self_referential   # CourseRequirement: a Course requires another Course
    - cross_aggregate    # Enrollment references Section, Student, Term across aggregates
  role_model: peer_roles
  # Student acts on own registrations; Advisor places/clears advising holds and
  # enters grades; Registrar owns catalog/term/section config; Bursar owns
  # financial holds and refunds.
  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Term
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Term name, e.g. Fall 2026" }
      - { name: registration_opens_at, type: datetime, source: input, description: "Earliest instant any appointment window may begin" }
      - { name: add_deadline, type: datetime, source: input, description: "Last instant a student may ENROLL/add a section with no transcript mark" }
      - { name: drop_deadline, type: datetime, source: input, description: "Last instant a drop leaves no transcript record (full refund tier ends here)" }
      - { name: withdraw_deadline, type: datetime, source: input, description: "Last instant a withdraw is permitted; produces a W mark, no refund" }
      - { name: refund_full_pct, type: number, source: input, description: "Refund fraction for drops at/before drop_deadline", default: 1.0 }
      - { name: refund_partial_pct, type: number, source: input, description: "Refund fraction for drops after drop_deadline but at/before withdraw_deadline", default: 0.5 }
      - { name: per_credit_cost_cents, type: integer, source: input, description: "Tuition charged per credit hour, in cents" }
      - { name: status, type: enum, source: system, description: "PLANNING | REGISTRATION_OPEN | IN_SESSION | CLOSED", default: "PLANNING", constraints: "PLANNING|REGISTRATION_OPEN|IN_SESSION|CLOSED" }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Student full name" }
      - { name: email, type: string, source: input, description: "Student email, unique" }
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; the degree program the student is enrolled in" }
      - { name: completed_credit_hours, type: integer, source: input, description: "Credit hours earned from transfer/prior terms at registration time", default: 0 }
      - { name: earned_credit_hours, type: integer, source: computed, description: "completed_credit_hours plus credits from this-system Enrollments with a passing final grade" }
      - { name: gpa, type: number, source: computed, description: "Cumulative GPA over graded Enrollments; 2 decimals, round_half_up" }
      - { name: academic_standing, type: enum, source: computed, description: "GOOD (gpa >= 2.00) | WARNING (1.00 <= gpa < 2.00) | PROBATION (gpa < 1.00); a student with zero graded credits is GOOD", constraints: "GOOD|WARNING|PROBATION" }
      - { name: tuition_owed_cents, type: integer, source: computed, description: "Sum of frozen tuition_charged_cents over the student's ENROLLED/WITHDRAWN/DROPPED Enrollments minus the sum of their RefundTransaction amounts", default: 0 }

  - name: Program
    parent: null
    common_fields: false
    fields:
      - { name: name, type: string, source: input, description: "Program name, e.g. BS Computer Science" }
      - { name: required_credit_hours, type: integer, source: input, description: "Total credit hours required to graduate" }
      - { name: min_gpa, type: number, source: input, description: "Minimum cumulative GPA required to satisfy the degree", default: 2.0 }

  - name: Course
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Catalog code, e.g. CS101; unique" }
      - { name: title, type: string, source: input, description: "Course title" }
      - { name: credit_hours, type: integer, source: input, description: "Credit hours awarded for the course", constraints: ">= 0" }
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; program that owns this course in its catalog" }
      - { name: is_active, type: boolean, source: system, description: "Whether the course is offerable; retired courses are is_active=false", default: true }

  - name: CourseRequirement
    parent: null
    common_fields: false
    fields:
      - { name: course_id, type: string, source: input, description: "FK -> Course.id; the course that carries this requirement" }
      - { name: required_course_id, type: string, source: input, description: "FK -> Course.id; the course that must be satisfied" }
      - { name: requirement_type, type: enum, source: input, description: "PREREQUISITE (completed before term) | COREQUISITE (enrolled same term)", constraints: "PREREQUISITE|COREQUISITE" }
      - { name: min_grade_points, type: number, source: input, description: "Minimum grade points (0.0-4.0) the required course grade must meet for a PREREQUISITE to count as satisfied", default: 1.0 }

  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Instructor full name" }
      - { name: email, type: string, source: input, description: "Instructor email, unique" }
      - { name: gap_minutes, type: integer, source: input, description: "Minimum required buffer (minutes) between two of this instructor's sections on a shared day; 0 means adjacency allowed", default: 0, constraints: ">= 0" }

  - name: Section
    parent: null
    common_fields: true
    fields:
      - { name: term_id, type: string, source: input, description: "FK -> Term.id; term this section is offered in" }
      - { name: course_id, type: string, source: input, description: "FK -> Course.id; course this section teaches" }
      - { name: instructor_id, type: string, source: input, description: "FK -> Instructor.id; instructor teaching this section" }
      - { name: section_code, type: string, source: input, description: "Section code, e.g. 001; unique within (term_id, course_id)" }
      - { name: seat_capacity, type: integer, source: input, description: "Maximum ENROLLED seats", constraints: ">= 1" }
      - { name: seats_taken, type: integer, source: computed, description: "Count of Enrollments with registration_status ENROLLED on this section" }
      - { name: waitlist_capacity, type: integer, source: input, description: "Maximum WAITLISTED entries", default: 0, constraints: ">= 0" }
      - { name: waitlist_count, type: integer, source: computed, description: "Count of Enrollments with registration_status WAITLISTED on this section" }
      - { name: meeting_days, type: string, source: input, description: "Days code, e.g. MWF or TR" }
      - { name: meeting_start_min, type: integer, source: input, description: "Meeting start as minutes-from-midnight, e.g. 540 for 09:00", constraints: "0-1439" }
      - { name: meeting_end_min, type: integer, source: input, description: "Meeting end as minutes-from-midnight; must exceed meeting_start_min", constraints: "1-1440" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | CANCELLED — gate for new enrollments", default: "OPEN", constraints: "OPEN|CLOSED|CANCELLED" }

  - name: EnrollmentAppointment
    parent: null
    common_fields: true
    fields:
      - { name: term_id, type: string, source: input, description: "FK -> Term.id; term this appointment grants registration in" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; student granted this appointment" }
      - { name: priority_tier, type: integer, source: input, description: "Lower number registers earlier; 1 is highest priority", constraints: ">= 1" }
      - { name: window_opens_at, type: datetime, source: input, description: "Instant at/after which the student may begin registering for the term" }
      - { name: max_credit_hours, type: integer, source: input, description: "Cap on total ENROLLED+WAITLISTED credit hours for the student in this term", constraints: ">= 1" }
      - { name: enrolled_credit_hours, type: integer, source: computed, description: "Sum of Course.credit_hours over the student's ENROLLED+WAITLISTED Enrollments in this term" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: term_id, type: string, source: input, description: "FK -> Term.id; term of this enrollment" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the enrolled student" }
      - { name: section_id, type: string, source: input, description: "FK -> Section.id; the section enrolled in" }
      - { name: registration_status, type: enum, source: system, description: "REQUESTED -> ENROLLED|WAITLISTED; ENROLLED|WAITLISTED -> DROPPED|WITHDRAWN; WAITLISTED -> ENROLLED (promotion)", default: "REQUESTED", constraints: "REQUESTED|ENROLLED|WAITLISTED|DROPPED|WITHDRAWN" }
      - { name: grade_status, type: enum, source: system, description: "Parallel axis: UNGRADED -> GRADED; independent of registration_status", default: "UNGRADED", constraints: "UNGRADED|GRADED" }
      - { name: letter_grade, type: enum, source: input, description: "Letter grade entered by Advisor on grade submission", constraints: "A|B|C|D|F|W" }
      - { name: grade_points, type: number, source: computed, description: "4.0 scale points mapped from letter_grade (A=4,B=3,C=2,D=1,F=0); null until GRADED" }
      - { name: tuition_charged_cents, type: integer, source: computed, description: "Course.credit_hours * Term.per_credit_cost_cents, fixed when registration_status first becomes ENROLLED" }
      - { name: refund_cents, type: integer, source: computed, description: "Refund credited on DROPPED/WITHDRAWN per Term refund schedule; 0 while ENROLLED/WAITLISTED" }
      - { name: waitlist_position, type: integer, source: computed, description: "1-based rank among WAITLISTED Enrollments on the same section ordered by created_at ASC; null when not WAITLISTED" }

  - name: Hold
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; student the hold is placed on" }
      - { name: hold_type, type: enum, source: input, description: "FINANCIAL (Bursar) | ADVISING (Advisor)", constraints: "FINANCIAL|ADVISING" }
      - { name: reason, type: string, source: input, description: "Free-text reason for the hold" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> CLEARED", default: "ACTIVE", constraints: "ACTIVE|CLEARED" }

  - name: SwapRequest
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; student performing the swap" }
      - { name: term_id, type: string, source: input, description: "FK -> Term.id; term the swap occurs in" }
      - { name: drop_enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; the Enrollment to drop if the add succeeds" }
      - { name: add_section_id, type: string, source: input, description: "FK -> Section.id; the section to enroll into" }
      - { name: status, type: enum, source: system, description: "PENDING -> COMMITTED|ABORTED; atomic add-then-drop outcome", default: "PENDING", constraints: "PENDING|COMMITTED|ABORTED" }
      - { name: added_enrollment_id, type: string, source: computed, description: "FK -> Enrollment.id; the Enrollment created by a COMMITTED swap; null while PENDING/ABORTED" }

  - name: RefundTransaction
    parent: null
    common_fields: false
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; the enrollment whose drop/withdraw produced this refund" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; student credited" }
      - { name: refund_tier, type: enum, source: system, description: "FULL | PARTIAL | NONE — which refund tier applied", constraints: "FULL|PARTIAL|NONE" }
      - { name: amount_cents, type: integer, source: system, description: "Refund amount credited, in cents" }
      - { name: triggered_by, type: enum, source: system, description: "DROP | WITHDRAW | SECTION_CANCEL — what produced the refund", constraints: "DROP|WITHDRAW|SECTION_CANCEL" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Term
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: REGISTRATION_OPEN
        trigger: "POST /terms/{id}/status"
        actor: Registrar
        preconditions:
          - "At least one Section exists for this term (ERR_TERM_HAS_NO_SECTIONS)"
        side_effects: []
      - from: REGISTRATION_OPEN
        to: IN_SESSION
        trigger: "POST /terms/{id}/status"
        actor: Registrar
        preconditions: []
        side_effects:
          - "No registration_status changes are cascaded; add/drop/withdraw deadlines now gate Enrollment transitions by clock"
      - from: IN_SESSION
        to: CLOSED
        trigger: "POST /terms/{id}/status"
        actor: Registrar
        preconditions: []
        side_effects:
          - "Each Enrollment still ENROLLED with grade_status UNGRADED remains ENROLLED awaiting grade entry"

  - entity: Section
    initial_state: OPEN
    terminal_states: [CANCELLED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /sections/{id}/status"
        actor: Registrar
        preconditions: []
        side_effects:
          - "New REQUESTED enrollments are rejected; existing ENROLLED/WAITLISTED unaffected"
      - from: CLOSED
        to: OPEN
        trigger: "POST /sections/{id}/status"
        actor: Registrar
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: "POST /sections/{id}/status"
        actor: Registrar
        preconditions: []
        side_effects:
          - "Cascade: every ENROLLED Enrollment on this section -> DROPPED with triggered_by SECTION_CANCEL; that DROPPED transition itself credits a FULL RefundTransaction (refund_full_pct regardless of clock) and decrements Section.seats_taken"
          - "Cascade: every WAITLISTED Enrollment on this section -> DROPPED (no refund; tuition was never charged)"
          - "Each cascaded DROP recomputes the owning Student.tuition_owed_cents and the student's EnrollmentAppointment.enrolled_credit_hours"
      - from: CLOSED
        to: CANCELLED
        trigger: "POST /sections/{id}/status"
        actor: Registrar
        preconditions: []
        side_effects:
          - "Same cancellation cascade as OPEN -> CANCELLED"

  - entity: Hold
    initial_state: ACTIVE
    terminal_states: [CLEARED]
    transitions:
      - from: ACTIVE
        to: CLEARED
        trigger: "POST /holds/{id}/clear"
        actor: "Bursar | Advisor"
        preconditions:
          - "FINANCIAL holds may be cleared only by Bursar; ADVISING holds only by Advisor (ERR_HOLD_WRONG_CLEARER)"
        side_effects:
          - "Student registration is unblocked once the student has zero ACTIVE holds"

  - entity: SwapRequest
    initial_state: PENDING
    terminal_states: [COMMITTED, ABORTED]
    transitions:
      - from: PENDING
        to: COMMITTED
        trigger: "POST /swap-requests (atomic evaluation within the create call)"
        actor: Student
        preconditions:
          - "Student has zero ACTIVE holds (ERR_REGISTRATION_HOLD)"
          - "Term.status == REGISTRATION_OPEN and now <= Term.add_deadline (ERR_ADD_WINDOW_CLOSED)"
          - "drop_enrollment_id is an ENROLLED Enrollment owned by the student in this term (ERR_INVALID_STATE)"
          - "add_section_id is an OPEN Section with seats_taken < seat_capacity (ERR_SECTION_FULL)"
          - "All prerequisites/corequisites for add_section_id's course are satisfied (ERR_PREREQUISITE_NOT_MET / ERR_COREQUISITE_NOT_MET)"
          - "No meeting-time conflict between add_section_id and the student's other ENROLLED sections after the drop is applied (ERR_TIME_CONFLICT)"
        side_effects:
          - "Cascade: create added Enrollment in REQUESTED then ENROLLED on add_section_id (sets added_enrollment_id, increments add_section.seats_taken, charges tuition); that successful add then drives drop_enrollment -> DROPPED which credits its refund and decrements the old section.seats_taken; the drop's seat release then promotes the head WAITLISTED Enrollment of the old section to ENROLLED"
      - from: PENDING
        to: ABORTED
        trigger: "POST /swap-requests (atomic evaluation within the create call)"
        actor: Student
        preconditions:
          - "Any COMMITTED precondition fails — the add cannot be performed"
        side_effects:
          - "drop_enrollment is left untouched (still ENROLLED); no seat changes; SwapRequest records the failing error_id is returned to the caller"

  - entity: Enrollment
    initial_state: REQUESTED
    terminal_states: [DROPPED, WITHDRAWN]
    transitions:
      - from: REQUESTED
        to: ENROLLED
        trigger: "POST /enrollments (seat available at evaluation)"
        actor: Student
        preconditions:
          - "Student has zero ACTIVE holds (ERR_REGISTRATION_HOLD)"
          - "Caller-supplied expected_section_version matches Section.version (ERR_STALE_VERSION)"
          - "Term.status == REGISTRATION_OPEN and now <= Term.add_deadline (ERR_ADD_WINDOW_CLOSED)"
          - "EnrollmentAppointment exists for (student, term) and now >= window_opens_at (ERR_APPOINTMENT_NOT_OPEN)"
          - "Section.status == OPEN (ERR_SECTION_NOT_OPEN)"
          - "No existing non-terminal Enrollment for (student, section) (ERR_DUPLICATE_ENROLLMENT)"
          - "All PREREQUISITE requirements satisfied by prior earned grades (ERR_PREREQUISITE_NOT_MET)"
          - "All COREQUISITE requirements satisfied by a same-term ENROLLED/REQUESTED enrollment (ERR_COREQUISITE_NOT_MET)"
          - "No meeting-time overlap with student's other ENROLLED sections (ERR_TIME_CONFLICT)"
          - "enrolled_credit_hours + Course.credit_hours <= EnrollmentAppointment.max_credit_hours (ERR_CREDIT_LIMIT_EXCEEDED)"
          - "Section.seats_taken < Section.seat_capacity (else routes to WAITLISTED)"
        side_effects:
          - "Increments Section.seats_taken by 1 and Section.version by 1"
          - "Sets tuition_charged_cents = Course.credit_hours * Term.per_credit_cost_cents"
          - "Recomputes Student.tuition_owed_cents and EnrollmentAppointment.enrolled_credit_hours"
      - from: REQUESTED
        to: WAITLISTED
        trigger: "POST /enrollments (section full at evaluation)"
        actor: Student
        preconditions:
          - "All REQUESTED->ENROLLED preconditions pass EXCEPT seat availability (Section.seats_taken == Section.seat_capacity)"
          - "Section.waitlist_count < Section.waitlist_capacity (ERR_WAITLIST_FULL)"
          - "Caller-supplied expected_section_version matches Section.version (ERR_STALE_VERSION)"
        side_effects:
          - "Increments Section.waitlist_count and Section.version by 1; assigns waitlist_position = waitlist_count after increment"
          - "Recomputes EnrollmentAppointment.enrolled_credit_hours (WAITLISTED credits count toward the cap)"
          - "No tuition charged while WAITLISTED (tuition_charged_cents stays 0)"
      - from: WAITLISTED
        to: ENROLLED
        trigger: "system: head-of-waitlist promotion when a seat is released"
        actor: system
        preconditions:
          - "This Enrollment is the WAITLISTED entry with the lowest waitlist_position (created_at ASC tie-break) on the section"
          - "Section.seats_taken < Section.seat_capacity after the releasing drop"
        side_effects:
          - "registration_status -> ENROLLED; increments Section.seats_taken by 1; decrements Section.waitlist_count by 1; increments Section.version by 1"
          - "Sets tuition_charged_cents = Course.credit_hours * Term.per_credit_cost_cents; recomputes Student.tuition_owed_cents"
          - "Renumbers waitlist_position for remaining WAITLISTED entries on the section"
      - from: ENROLLED
        to: DROPPED
        trigger: "POST /enrollments/{id}/drop OR section-cancel cascade OR swap commit"
        actor: "Student | system"
        preconditions:
          - "Term.status IN {REGISTRATION_OPEN, IN_SESSION} and now <= Term.drop_deadline (ERR_DROP_WINDOW_CLOSED) — bypassed for SECTION_CANCEL cascade"
        side_effects:
          - "Decrements Section.seats_taken by 1 and increments Section.version by 1"
          - "Credits a RefundTransaction (FULL if now <= drop_deadline, else PARTIAL; FULL unconditionally for SECTION_CANCEL); sets Enrollment.refund_cents"
          - "Recomputes Student.tuition_owed_cents and EnrollmentAppointment.enrolled_credit_hours"
          - "Cascade: the released seat promotes the head WAITLISTED Enrollment on the same section to ENROLLED (WAITLISTED->ENROLLED), which itself charges that promoted student's tuition and recomputes that student's tuition_owed_cents"
      - from: WAITLISTED
        to: DROPPED
        trigger: "POST /enrollments/{id}/drop OR section-cancel cascade"
        actor: "Student | system"
        preconditions: []
        side_effects:
          - "Decrements Section.waitlist_count by 1 and increments Section.version by 1; renumbers remaining waitlist_position values"
          - "Recomputes EnrollmentAppointment.enrolled_credit_hours; no refund (tuition was never charged)"
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/withdraw"
        actor: Student
        preconditions:
          - "now > Term.drop_deadline and now <= Term.withdraw_deadline (ERR_WITHDRAW_WINDOW_CLOSED)"
          - "Term.status IN {REGISTRATION_OPEN, IN_SESSION}"
        side_effects:
          - "Decrements Section.seats_taken by 1 and increments Section.version by 1"
          - "Credits a PARTIAL RefundTransaction (refund_partial_pct); sets Enrollment.refund_cents; records a transcript W (no grade points, excluded from GPA)"
          - "Recomputes Student.tuition_owed_cents and EnrollmentAppointment.enrolled_credit_hours"
          - "Cascade: released seat promotes head WAITLISTED Enrollment on the section to ENROLLED"
      - from: ENROLLED
        to: ENROLLED
        trigger: "POST /enrollments/{id}/grade (grade_status axis only)"
        actor: Advisor
        preconditions:
          - "Term.status == IN_SESSION or CLOSED"
          - "grade_status == UNGRADED (ERR_ALREADY_GRADED)"
          - "letter_grade IN {A,B,C,D,F} (W is set only by withdraw, not by grade entry) (ERR_INVALID_GRADE)"
        side_effects:
          - "grade_status -> GRADED; sets grade_points from letter_grade; recomputes Student.gpa, Student.earned_credit_hours, Student.academic_standing"
        note: "Parallel-axis transition: registration_status stays ENROLLED while the grade_status axis advances UNGRADED -> GRADED."

# =============================================================================
# Table 1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: seat-grab-stale-section
    parent_entity: Section
    write_endpoint: "POST /enrollments"
    occ_field: "expected_section_version"
    description: |
      Enrolling into a Section whose version has advanced since the client last
      observed it is rejected as stale. This captures the case where another
      writer has already taken the last seat (legitimately advancing the
      section's version), so the current writer's view of seat availability is
      out of date; the create is rejected rather than silently routed to a
      different outcome than the client expected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: enrollment_refund
    trigger: "Enrollment ENROLLED->DROPPED, ENROLLED->WITHDRAWN, or SECTION_CANCEL cascade"
    algorithm: threshold
    formula: |
      base = tuition_charged_cents   # fixed at the time the seat was taken
      if triggered_by == SECTION_CANCEL:
          tier = FULL;    pct = Term.refund_full_pct
      elif now <= Term.drop_deadline:           # DROP within full-refund window
          tier = FULL;    pct = Term.refund_full_pct
      elif now <= Term.withdraw_deadline:       # WITHDRAW / late DROP partial window
          tier = PARTIAL; pct = Term.refund_partial_pct
      else:
          tier = NONE;    pct = 0.0
      refund_cents = round_half_up(base * pct)   # integer cents
    input_set: "Single Enrollment; uses its fixed tuition_charged_cents, never recomputed from live per_credit_cost"
    constants:
      DROP_TIER_BOUNDARY: "now <= drop_deadline is FULL (inclusive boundary)"
    precision: "integer cents, round_half_up"
    variants:
      - name: drop_full_refund
        when: "now <= Term.drop_deadline (a DROP)"
        difference: "pct = refund_full_pct; transcript carries no mark"
      - name: withdraw_partial_refund
        when: "now > drop_deadline and now <= withdraw_deadline (a WITHDRAW)"
        difference: "pct = refund_partial_pct; transcript carries a W (no GPA effect)"
      - name: section_cancel_full_refund
        when: "triggered_by == SECTION_CANCEL, regardless of clock"
        difference: "always FULL even past every deadline; the institution caused the cancellation"

  - name: cumulative_gpa
    trigger: "Enrollment grade_status UNGRADED->GRADED; recomputed on Student read"
    algorithm: weighted_scoring
    formula: |
      # Quality-points weighted by credit hours, over GRADED enrollments only.
      considered = [e for e in student.enrollments
                    if e.grade_status == GRADED and e.letter_grade in {A,B,C,D,F}]
      # W marks (registration_status WITHDRAWN) are excluded entirely.
      total_quality = sum(e.grade_points * Course(e).credit_hours for e in considered)
      total_credits = sum(Course(e).credit_hours for e in considered)
      gpa = 0.00 if total_credits == 0 else round_half_up(total_quality / total_credits, 2)
    input_set: "GRADED enrollments with letter_grade in {A,B,C,D,F}; WITHDRAWN/W and UNGRADED excluded"
    constants:
      GRADE_POINTS: { A: 4.0, B: 3.0, C: 2.0, D: 1.0, F: 0.0 }
      STANDING_GOOD_MIN: 2.00
      STANDING_WARNING_MIN: 1.00
    precision: "2 decimals, round_half_up"
    variants:
      - name: term_gpa
        when: "GET /students/{id}/transcript?term_id=X — GPA scoped to one term"
        difference: "considered set filtered to enrollments whose term_id == X; same weighting formula"
      - name: cumulative_gpa
        when: "Student.gpa field — all terms"
        difference: "considered set spans every term; F counts as 0 quality points but its credits DO enter total_credits (failed-but-attempted), unlike W which enters neither"

  - name: enrolled_credit_hours
    trigger: "any Enrollment registration_status change for the (student, term)"
    algorithm: aggregation
    formula: |
      enrolled_credit_hours = sum(Course(e).credit_hours
                                  for e in enrollments
                                  if e.student_id == appt.student_id
                                  and e.term_id == appt.term_id
                                  and e.registration_status in {ENROLLED, WAITLISTED})
      # DROPPED, WITHDRAWN, REQUESTED-but-rejected are excluded.
    input_set: "Enrollments for (student, term) in registration_status IN {ENROLLED, WAITLISTED}"
    constants: {}
    precision: "integer credit hours"

  - name: prerequisite_satisfaction
    trigger: "Enrollment REQUESTED->ENROLLED/WAITLISTED precondition check; swap-request add evaluation"
    algorithm: topological
    formula: |
      for req in CourseRequirement where course_id == section.course_id:
        if req.requirement_type == PREREQUISITE:
          # student must hold a GRADED, non-W enrollment in required_course
          # with grade_points >= req.min_grade_points, OR completed externally.
          ok = exists graded enrollment g of student in any prior/closed term
               where Course(g).id == req.required_course_id
               and g.grade_status == GRADED and g.letter_grade != W
               and g.grade_points >= req.min_grade_points
          if not ok: reject ERR_PREREQUISITE_NOT_MET
        elif req.requirement_type == COREQUISITE:
          ok = exists enrollment c of student in THIS term
               where Course(c).id == req.required_course_id
               and c.registration_status in {ENROLLED, WAITLISTED, REQUESTED}
          if not ok: reject ERR_COREQUISITE_NOT_MET
    input_set: "CourseRequirement edges for the target course; student's graded history (prereq) and same-term enrollments (coreq)"
    constants:
      DEFAULT_MIN_GRADE_POINTS: 1.0
    precision: "exact boolean"

  - name: tuition_owed
    trigger: "any Enrollment ENROLLED/DROPPED/WITHDRAWN transition or RefundTransaction credit"
    algorithm: aggregation
    formula: |
      # Every enrollment that was ever charged (registration_status in
      # {ENROLLED, WITHDRAWN, DROPPED}) keeps its frozen tuition_charged_cents
      # in the charged sum; its RefundTransaction (if any) subtracts. A
      # WAITLISTED enrollment was never charged (tuition_charged_cents == 0).
      charged  = sum(e.tuition_charged_cents
                     for e in student.enrollments
                     if e.registration_status in {ENROLLED, WITHDRAWN, DROPPED})
      refunded = sum(rt.amount_cents for rt in RefundTransaction where rt.student_id == student.id)
      tuition_owed_cents = charged - refunded
    input_set: "Enrollments in {ENROLLED, WITHDRAWN, DROPPED} carry their frozen charge; refunds subtract. A full-refund DROP nets to 0; a partial WITHDRAW nets to charge - partial_refund; an ENROLLED with no refund owes its full charge."
    constants: {}
    precision: "integer cents"

  - name: section_meeting_overlap
    trigger: "Enrollment REQUESTED->ENROLLED (student conflict); Section create (instructor conflict)"
    algorithm: interval_merge
    formula: |
      # Two distinct interval-overlap rules with DIFFERENT geometry.
      #
      # (1) STUDENT conflict (resource: the student's ENROLLED schedule) — at
      #     ENROLL/add time. Half-open [start, end) overlap on a SHARED day.
      #     Adjacency is allowed: a.end == b.start does NOT conflict; no buffer.
      #     conflict_student(a, b) = share_day(a, b) and
      #         a.meeting_start_min < b.meeting_end_min and
      #         b.meeting_start_min < a.meeting_end_min
      #     -> ERR_TIME_CONFLICT
      #
      # (2) INSTRUCTOR double-booking (resource: the Instructor) — at SECTION
      #     CREATE time, against other non-CANCELLED sections of the same
      #     instructor in the same term. BUFFERED geometry: the two windows must
      #     be separated by at least Instructor.gap_minutes on a shared day, so
      #     even non-overlapping-but-too-close windows conflict.
      #     conflict_instructor(a, b) = share_day(a, b) and
      #         a.meeting_start_min < b.meeting_end_min + gap and
      #         b.meeting_start_min < a.meeting_end_min + gap
      #     -> ERR_INSTRUCTOR_DOUBLE_BOOKED
      share_day(a, b) = a.meeting_days and b.meeting_days share at least one day letter
    input_set: "Student conflict: the student's ENROLLED sections in the term. Instructor conflict: the instructor's non-CANCELLED sections in the same term."
    constants:
      ADJACENCY_ALLOWED_STUDENT: true
    precision: "exact boolean; minutes-from-midnight integers"

  - name: degree_audit
    trigger: "GET /students/{id}/degree-audit"
    algorithm: aggregation
    formula: |
      earned = Student.earned_credit_hours
      required = Program.required_credit_hours
      credits_remaining = max(0, required - earned)
      gpa_ok = Student.gpa >= Program.min_gpa
      # A course is satisfied iff a GRADED non-W enrollment exists with grade_points >= 1.0 (D or better).
      satisfied_course_ids = { Course(e).id for e in student GRADED enrollments
                               where e.letter_grade in {A,B,C,D} }
      is_complete = (credits_remaining == 0) and gpa_ok
    input_set: "Student GRADED enrollments (D or better passes), Program requirements"
    constants:
      PASSING_GRADE_POINTS: 1.0
    precision: "integer credit hours; boolean completion flag"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is one of Student|Advisor|Registrar|Bursar"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is permitted to perform this operation per the RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 2.5
    category: business_constraint
    check: "Request body is well-formed: required fields present with correct types; enum values are legal members"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 2.7
    category: business_constraint
    check: "Pagination limit in [1,100] and offset >= 0 on list endpoints"
    error_id: ERR_PAGINATION_INVALID
    http_status: 400
    applies_to: "all list endpoints"
  - priority: 3
    category: existence
    check: "All path/body referenced resources exist, validated left-to-right (Term, Student, Section, Course, Enrollment, Hold)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: business_referential
    check: "Acting Student owns the targeted Enrollment/SwapRequest (X-User-ID == resource.student_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /enrollments, /enrollments/{id}/drop, /enrollments/{id}/withdraw, /swap-requests"
  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_safety
    check: "Student has zero ACTIVE holds before any registration/add/swap"
    error_id: ERR_REGISTRATION_HOLD
    http_status: 403
    applies_to: "POST /enrollments, POST /swap-requests"
  - priority: 7
    category: business_temporal
    check: "Term.status == REGISTRATION_OPEN and now <= add_deadline for adds/enrolls"
    error_id: ERR_ADD_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /enrollments, POST /swap-requests"
  - priority: 8
    category: business_temporal
    check: "EnrollmentAppointment exists for (student, term) and now >= window_opens_at"
    error_id: ERR_APPOINTMENT_NOT_OPEN
    http_status: 409
    applies_to: "POST /enrollments, POST /swap-requests"
  - priority: 9
    category: business_constraint
    check: "Section.status == OPEN for new enrollments"
    error_id: ERR_SECTION_NOT_OPEN
    http_status: 409
    applies_to: "POST /enrollments"
  - priority: 10
    category: business_constraint
    check: "No existing non-terminal Enrollment for (student, section)"
    error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    applies_to: "POST /enrollments"
  - priority: 11
    category: business_constraint
    check: "All PREREQUISITE CourseRequirements satisfied by prior graded enrollments"
    error_id: ERR_PREREQUISITE_NOT_MET
    http_status: 422
    applies_to: "POST /enrollments, POST /swap-requests"
  - priority: 12
    category: business_constraint
    check: "All COREQUISITE CourseRequirements satisfied by a same-term enrollment"
    error_id: ERR_COREQUISITE_NOT_MET
    http_status: 422
    applies_to: "POST /enrollments, POST /swap-requests"
  - priority: 13
    category: business_temporal
    check: "Added section's meeting window does not overlap any of the student's other ENROLLED sections on shared days"
    error_id: ERR_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /enrollments, POST /swap-requests"
  - priority: 14
    category: business_fiscal
    check: "enrolled_credit_hours + course.credit_hours <= appointment.max_credit_hours"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /enrollments, POST /swap-requests"
  - priority: 15
    category: business_constraint
    check: "expected_section_version matches Section.version (OCC seat-grab guard)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /enrollments"
  - priority: 16
    category: business_fiscal
    check: "If section is full, waitlist_count < waitlist_capacity to accept a WAITLISTED entry"
    error_id: ERR_WAITLIST_FULL
    http_status: 409
    applies_to: "POST /enrollments"
  - priority: 17
    category: business_temporal
    check: "now <= drop_deadline for a drop"
    error_id: ERR_DROP_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /enrollments/{id}/drop"
  - priority: 18
    category: business_temporal
    check: "now > drop_deadline and now <= withdraw_deadline for a withdraw"
    error_id: ERR_WITHDRAW_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /enrollments/{id}/withdraw"
  - priority: 19
    category: business_constraint
    check: "Grade letter is one of A,B,C,D,F on grade entry; not already GRADED"
    error_id: ERR_INVALID_GRADE
    http_status: 422
    applies_to: "POST /enrollments/{id}/grade"
  - priority: 20
    category: business_constraint
    check: "FINANCIAL holds cleared only by Bursar, ADVISING only by Advisor"
    error_id: ERR_HOLD_WRONG_CLEARER
    http_status: 403
    applies_to: "POST /holds/{id}/clear"
  - priority: 21
    category: business_constraint
    check: "Term cannot open registration with no sections"
    error_id: ERR_TERM_HAS_NO_SECTIONS
    http_status: 409
    applies_to: "POST /terms/{id}/status"
  - priority: 22
    category: business_constraint
    check: "Section is OPEN and seats_taken < seat_capacity for the add leg of a swap"
    error_id: ERR_SECTION_FULL
    http_status: 409
    applies_to: "POST /swap-requests"
  - priority: 23
    category: business_temporal
    check: "New section's meeting window respects the instructor's gap_minutes buffer against the instructor's other non-CANCELLED sections in the term on shared days"
    error_id: ERR_INSTRUCTOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /sections"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Term ----
  - method: POST
    path: "/terms"
    description: "Create a term"
    roles: [Registrar]
    code: 201
    input: [name, registration_opens_at, add_deadline, drop_deadline, withdraw_deadline, per_credit_cost_cents, "refund_full_pct?", "refund_partial_pct?"]
    output: Term
    side_effects: ["status=PLANNING"]
  - method: GET
    path: "/terms/{id}"
    description: "Get a term"
    roles: [Registrar, Advisor, Student, Bursar]
    code: 200
    input: []
    output: Term
    side_effects: []
  - method: POST
    path: "/terms/{id}/status"
    description: "Advance term lifecycle (PLANNING->REGISTRATION_OPEN->IN_SESSION->CLOSED)"
    roles: [Registrar]
    code: 200
    input: [to_status]
    output: Term
    side_effects: ["Term state machine transition"]
  - method: GET
    path: "/terms/{id}/sections"
    description: "List sections offered in a term (reverse-reachability for Section.term_id)"
    roles: [Registrar, Advisor, Student, Bursar]
    code: 200
    input: ["course_id?", "status?", "limit?", "offset?"]
    output: Section[]
    side_effects: []
  - method: GET
    path: "/terms/{id}/enrollments"
    description: "List enrollments in a term (reverse-reachability for Enrollment.term_id)"
    roles: [Registrar, Advisor, Bursar]
    code: 200
    input: ["student_id?", "registration_status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  # ---- Program ----
  - method: POST
    path: "/programs"
    description: "Create a degree program"
    roles: [Registrar]
    code: 201
    input: [name, required_credit_hours, "min_gpa?"]
    output: Program
    side_effects: []
  - method: GET
    path: "/programs/{id}"
    description: "Get a program"
    roles: [Registrar, Advisor, Student, Bursar]
    code: 200
    input: []
    output: Program
    side_effects: []
  - method: GET
    path: "/programs/{id}/students"
    description: "List students enrolled in a program (reverse-reachability for Student.program_id)"
    roles: [Registrar, Advisor]
    code: 200
    input: ["limit?", "offset?"]
    output: Student[]
    side_effects: []

  # ---- Course & requirements ----
  - method: POST
    path: "/courses"
    description: "Create a catalog course"
    roles: [Registrar]
    code: 201
    input: [code, title, credit_hours, program_id]
    output: Course
    side_effects: ["is_active=true"]
  - method: GET
    path: "/courses/{id}"
    description: "Get a course"
    roles: [Registrar, Advisor, Student, Bursar]
    code: 200
    input: []
    output: Course
    side_effects: []
  - method: POST
    path: "/courses/{id}/requirements"
    description: "Add a prerequisite/corequisite edge to a course"
    roles: [Registrar]
    code: 201
    input: [required_course_id, requirement_type, "min_grade_points?"]
    output: CourseRequirement
    side_effects: []
  - method: GET
    path: "/courses/{id}/requirements"
    description: "List requirement edges for a course (reverse-reachability for CourseRequirement.course_id)"
    roles: [Registrar, Advisor, Student, Bursar]
    code: 200
    input: ["required_course_id?", "limit?", "offset?"]
    output: CourseRequirement[]
    side_effects: []
  - method: GET
    path: "/courses/{id}/sections"
    description: "List sections of a course (reverse-reachability for Section.course_id)"
    roles: [Registrar, Advisor, Student, Bursar]
    code: 200
    input: ["term_id?", "limit?", "offset?"]
    output: Section[]
    side_effects: []
  - method: GET
    path: "/programs/{id}/courses"
    description: "List courses owned by a program (reverse-reachability for Course.program_id)"
    roles: [Registrar, Advisor, Student, Bursar]
    code: 200
    input: ["limit?", "offset?"]
    output: Course[]
    side_effects: []

  # ---- Instructor ----
  - method: POST
    path: "/instructors"
    description: "Create an instructor"
    roles: [Registrar]
    code: 201
    input: [full_name, email, "gap_minutes?"]
    output: Instructor
    side_effects: []
  - method: GET
    path: "/instructors/{id}"
    description: "Get an instructor"
    roles: [Registrar, Advisor, Student, Bursar]
    code: 200
    input: []
    output: Instructor
    side_effects: []
  - method: GET
    path: "/instructors/{id}/sections"
    description: "List sections taught by an instructor (reverse-reachability for Section.instructor_id)"
    roles: [Registrar, Advisor, Student, Bursar]
    code: 200
    input: ["term_id?", "limit?", "offset?"]
    output: Section[]
    side_effects: []

  # ---- Section ----
  - method: POST
    path: "/sections"
    description: "Create a section offering; enforces instructor gap_minutes double-booking buffer"
    roles: [Registrar]
    code: 201
    input: [term_id, course_id, instructor_id, section_code, seat_capacity, "waitlist_capacity?", meeting_days, meeting_start_min, meeting_end_min]
    output: Section
    side_effects: ["status=OPEN, seats_taken=0, waitlist_count=0"]
  - method: GET
    path: "/sections/{id}"
    description: "Get a section (observe seats_taken, waitlist_count, version)"
    roles: [Registrar, Advisor, Student, Bursar]
    code: 200
    input: []
    output: Section
    side_effects: []
  - method: POST
    path: "/sections/{id}/status"
    description: "Transition section (OPEN/CLOSED/CANCELLED); CANCELLED triggers drop+refund cascade"
    roles: [Registrar]
    code: 200
    input: [to_status]
    output: Section
    side_effects: ["Section state machine; cancellation cascade with FULL refunds and waitlist clearing"]
  - method: GET
    path: "/sections/{id}/enrollments"
    description: "List enrollments on a section (reverse-reachability for Enrollment.section_id)"
    roles: [Registrar, Advisor, Student, Bursar]
    code: 200
    input: ["registration_status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  # ---- Student ----
  - method: POST
    path: "/students"
    description: "Create a student record"
    roles: [Registrar]
    code: 201
    input: [full_name, email, program_id, "completed_credit_hours?"]
    output: Student
    side_effects: ["gpa=0.00, academic_standing=GOOD, earned_credit_hours=completed_credit_hours"]
  - method: GET
    path: "/students/{id}"
    description: "Get a student (observe gpa, earned_credit_hours, tuition_owed_cents, academic_standing)"
    roles: [Registrar, Advisor, Student, Bursar]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: GET
    path: "/students/{id}/enrollments"
    description: "List a student's enrollments (reverse-reachability for Enrollment.student_id)"
    roles: [Registrar, Advisor, Student, Bursar]
    code: 200
    input: ["term_id?", "registration_status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []
  - method: GET
    path: "/students/{id}/holds"
    description: "List a student's holds (reverse-reachability for Hold.student_id)"
    roles: [Registrar, Advisor, Student, Bursar]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Hold[]
    side_effects: []
  - method: GET
    path: "/students/{id}/transcript"
    description: "Computed transcript: graded enrollments with per-term and cumulative GPA"
    roles: [Registrar, Advisor, Student, Bursar]
    code: 200
    input: ["term_id?"]
    output: { cumulative_gpa: number, term_gpa: number, earned_credit_hours: integer, lines: array }
    side_effects: []
  - method: GET
    path: "/students/{id}/degree-audit"
    description: "Computed degree audit against the student's program"
    roles: [Registrar, Advisor, Student]
    code: 200
    input: []
    output: { required_credit_hours: integer, earned_credit_hours: integer, credits_remaining: integer, gpa_ok: boolean, is_complete: boolean, satisfied_course_ids: array }
    side_effects: []
  - method: GET
    path: "/students/{id}/swap-requests"
    description: "List a student's swap requests (reverse-reachability for SwapRequest.student_id)"
    roles: [Registrar, Advisor, Student]
    code: 200
    input: ["term_id?", "status?", "limit?", "offset?"]
    output: SwapRequest[]
    side_effects: []

  # ---- Enrollment Appointment ----
  - method: POST
    path: "/appointments"
    description: "Grant a student an enrollment appointment for a term"
    roles: [Registrar, Advisor]
    code: 201
    input: [term_id, student_id, priority_tier, window_opens_at, max_credit_hours]
    output: EnrollmentAppointment
    side_effects: ["enrolled_credit_hours=0"]
  - method: GET
    path: "/appointments/{id}"
    description: "Get an appointment (observe enrolled_credit_hours)"
    roles: [Registrar, Advisor, Student]
    code: 200
    input: []
    output: EnrollmentAppointment
    side_effects: []
  - method: GET
    path: "/students/{id}/appointments"
    description: "List a student's appointments (reverse-reachability for EnrollmentAppointment.student_id)"
    roles: [Registrar, Advisor, Student]
    code: 200
    input: ["term_id?", "limit?", "offset?"]
    output: EnrollmentAppointment[]
    side_effects: []
  - method: GET
    path: "/terms/{id}/appointments"
    description: "List appointments in a term (reverse-reachability for EnrollmentAppointment.term_id)"
    roles: [Registrar, Advisor]
    code: 200
    input: ["limit?", "offset?"]
    output: EnrollmentAppointment[]
    side_effects: []

  # ---- Enrollment (registration) ----
  - method: POST
    path: "/enrollments"
    description: "Register for a section; routes to ENROLLED or WAITLISTED; OCC-guarded on section version"
    roles: [Student]
    code: 201
    input: [term_id, section_id, expected_section_version]
    output: Enrollment
    side_effects:
      - "REQUESTED->ENROLLED or REQUESTED->WAITLISTED; increments Section.seats_taken/waitlist_count; increments Section.version by 1"
      - "On ENROLLED: charges tuition_charged_cents, recomputes Student.tuition_owed_cents and appointment.enrolled_credit_hours"
  - method: GET
    path: "/enrollments/{id}"
    description: "Get an enrollment (observe registration_status, grade_status, waitlist_position, refund_cents)"
    roles: [Registrar, Advisor, Student, Bursar]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: POST
    path: "/enrollments/{id}/drop"
    description: "Drop an enrollment; credits a refund and promotes the head of the waitlist"
    roles: [Student]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "ENROLLED/WAITLISTED->DROPPED; on ENROLLED decrements seats_taken, credits RefundTransaction, increments Section.version"
      - "Cascade: promote head WAITLISTED enrollment on the section to ENROLLED"
  - method: POST
    path: "/enrollments/{id}/withdraw"
    description: "Withdraw from an enrollment after the drop deadline; PARTIAL refund and W transcript mark"
    roles: [Student]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "ENROLLED->WITHDRAWN; PARTIAL refund; decrements seats_taken; increments Section.version; promotes head of waitlist"
  - method: POST
    path: "/enrollments/{id}/grade"
    description: "Advisor enters a final letter grade (grade_status axis); recomputes GPA/standing"
    roles: [Advisor]
    code: 200
    input: [letter_grade]
    output: Enrollment
    side_effects:
      - "UNGRADED->GRADED on grade_status; sets grade_points; recomputes Student.gpa, earned_credit_hours, academic_standing"
  - method: GET
    path: "/enrollments/{id}/refunds"
    description: "List refund transactions for an enrollment (reverse-reachability for RefundTransaction.enrollment_id)"
    roles: [Registrar, Bursar, Student]
    code: 200
    input: ["limit?", "offset?"]
    output: RefundTransaction[]
    side_effects: []
  - method: GET
    path: "/students/{id}/refunds"
    description: "List refund transactions for a student (reverse-reachability for RefundTransaction.student_id)"
    roles: [Registrar, Bursar, Student]
    code: 200
    input: ["limit?", "offset?"]
    output: RefundTransaction[]
    side_effects: []

  # ---- Hold ----
  - method: POST
    path: "/holds"
    description: "Place a financial or advising hold on a student"
    roles: [Bursar, Advisor]
    code: 201
    input: [student_id, hold_type, reason]
    output: Hold
    side_effects: ["status=ACTIVE; blocks the student's future registration"]
  - method: POST
    path: "/holds/{id}/clear"
    description: "Clear a hold; FINANCIAL by Bursar, ADVISING by Advisor"
    roles: [Bursar, Advisor]
    code: 200
    input: []
    output: Hold
    side_effects: ["ACTIVE->CLEARED; unblocks registration when no ACTIVE holds remain"]

  # ---- Swap ----
  - method: POST
    path: "/swap-requests"
    description: "Atomic swap: add target section, and only if the add succeeds, drop the old enrollment"
    roles: [Student]
    code: 201
    input: [term_id, drop_enrollment_id, add_section_id, expected_section_version]
    output: SwapRequest
    side_effects:
      - "On success: COMMITTED — creates added Enrollment ENROLLED on add_section (sets added_enrollment_id), then drops drop_enrollment (refund + waitlist promotion on old section)"
      - "On any add-leg failure: ABORTED — drop_enrollment stays ENROLLED, no seat changes; the failing error_id is returned"
  - method: GET
    path: "/swap-requests"
    description: "List swap requests by filter (reverse-reachability for SwapRequest.term_id, drop_enrollment_id, add_section_id, added_enrollment_id)"
    roles: [Registrar, Advisor]
    code: 200
    input: ["term_id?", "drop_enrollment_id?", "add_section_id?", "added_enrollment_id?", "status?", "limit?", "offset?"]
    output: SwapRequest[]
    side_effects: []
  - method: GET
    path: "/swap-requests/{id}"
    description: "Get a swap request outcome"
    roles: [Registrar, Advisor, Student]
    code: 200
    input: []
    output: SwapRequest
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set"
    description: "Test-driving endpoint: set the server's current UTC instant for deadline evaluation"
    roles: [Registrar]
    code: 200
    input: [now_iso8601]
    output: { now_iso8601: string }
    side_effects: ["All subsequent deadline/window comparisons use this instant"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a known role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Acting Student is not the owner of the targeted enrollment/swap" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field or wrong type" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not defined from the resource's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_section_version does not match the section's current version" }
  - { id: ERR_REGISTRATION_HOLD, http: 403, condition: "Student has one or more ACTIVE holds blocking registration" }
  - { id: ERR_ADD_WINDOW_CLOSED, http: 409, condition: "Term not REGISTRATION_OPEN or now past add_deadline" }
  - { id: ERR_DROP_WINDOW_CLOSED, http: 409, condition: "now past drop_deadline for a drop" }
  - { id: ERR_WITHDRAW_WINDOW_CLOSED, http: 409, condition: "now not in (drop_deadline, withdraw_deadline] for a withdraw" }
  - { id: ERR_APPOINTMENT_NOT_OPEN, http: 409, condition: "No appointment for (student, term) or now before window_opens_at" }
  - { id: ERR_SECTION_NOT_OPEN, http: 409, condition: "Section status is not OPEN for a new enrollment" }
  - { id: ERR_SECTION_FULL, http: 409, condition: "Swap add leg targets a section with no open seats" }
  - { id: ERR_WAITLIST_FULL, http: 409, condition: "Section is full and its waitlist is at capacity" }
  - { id: ERR_DUPLICATE_ENROLLMENT, http: 409, condition: "Student already has a non-terminal enrollment in the section" }
  - { id: ERR_PREREQUISITE_NOT_MET, http: 422, condition: "A PREREQUISITE course requirement is unsatisfied" }
  - { id: ERR_COREQUISITE_NOT_MET, http: 422, condition: "A COREQUISITE course requirement is unsatisfied" }
  - { id: ERR_TIME_CONFLICT, http: 409, condition: "Section meeting window overlaps another ENROLLED section on a shared day (student schedule, adjacency allowed)" }
  - { id: ERR_INSTRUCTOR_DOUBLE_BOOKED, http: 409, condition: "New section violates the instructor's gap_minutes buffer against another of the instructor's sections in the term" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 409, condition: "Adding the section would exceed the appointment max_credit_hours" }
  - { id: ERR_INVALID_GRADE, http: 422, condition: "Grade letter not in {A,B,C,D,F} on grade entry" }
  - { id: ERR_ALREADY_GRADED, http: 409, condition: "Enrollment already has grade_status GRADED" }
  - { id: ERR_HOLD_WRONG_CLEARER, http: 403, condition: "Role attempting to clear a hold of the wrong type" }
  - { id: ERR_TERM_HAS_NO_SECTIONS, http: 409, condition: "Term cannot open registration without at least one section" }
  - { id: ERR_PAGINATION_INVALID, http: 400, condition: "limit/offset out of allowed range" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: Student
    description: "A registered student; acts on their own appointments, enrollments, swaps, and reads."
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /enrollments — register for a section (must be self)"
      - "POST /enrollments/{id}/drop — drop own enrollment"
      - "POST /enrollments/{id}/withdraw — withdraw from own enrollment"
      - "POST /swap-requests — atomic swap on own enrollments"
    shared_operations:
      - "GET reads of own student record, enrollments, holds, transcript, degree-audit, appointments, refunds, swap-requests"
      - "GET catalog reads: terms, courses, sections, requirements, programs"
  - name: Advisor
    description: "Academic advisor; grants appointments, enters grades, and places/clears ADVISING holds."
    identity: "opaque"
    exclusive_operations:
      - "POST /enrollments/{id}/grade — enter a final grade"
      - "POST /holds/{id}/clear (ADVISING) — clear advising holds"
    shared_operations:
      - "POST /appointments — grant an enrollment appointment (shared with Registrar)"
      - "POST /holds — place a hold (ADVISING type)"
      - "GET reads across students, sections, terms, courses, requirements, programs, appointments, swap-requests"
  - name: Registrar
    description: "Owns catalog, terms, programs, courses, sections, and term/section lifecycle."
    identity: "opaque"
    exclusive_operations:
      - "POST /terms, POST /terms/{id}/status — term lifecycle"
      - "POST /programs, POST /courses, POST /courses/{id}/requirements — catalog"
      - "POST /sections, POST /sections/{id}/status — section lifecycle and cancellation cascade"
      - "POST /students — create student records"
      - "POST /_clock/set — test-driving clock"
    shared_operations:
      - "POST /appointments — grant an enrollment appointment (shared with Advisor)"
      - "GET reads across all resources"
  - name: Bursar
    description: "Financial office; places and clears FINANCIAL holds and reads refunds."
    identity: "opaque"
    exclusive_operations:
      - "POST /holds/{id}/clear (FINANCIAL) — clear financial holds"
    shared_operations:
      - "POST /holds — place a hold (FINANCIAL type)"
      - "GET reads of students, holds, refunds, terms, sections, courses, programs"
