  # ==========================================================================
  # Rule 5 — priority_pair_validation_conflict: two dual-failure conflicts on
  # DIFFERENT error-category pairs.
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: quote_accept_expired_temporal_beats_hold_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_QUOTE_EXPIRED]
          - errors[ERR_CUSTOMER_ON_HOLD]
        distinguishing_aspect: |
          Category pair business_temporal (p6) vs business_fiscal (p7): an
          accept attempted on an expired quote by a HOLD customer must return
          ERR_QUOTE_EXPIRED, because the temporal check (priority 6) precedes
          the fiscal standing check (priority 7). Both failure conditions hold
          at once in this fixture.
        test_recipe:
          setup:
            - "W0 (1h STANDARD) released at default clock 2026-08-01 -> invoice I0 due 2026-08-31; never paid"
            - "W1 diagnosed and its quote Q sent at 2026-08-01; Q expires 2026-08-31"
            - "Clock advanced to 2026-10-02: I0 is 32 days overdue -> standing HOLD; Q is expired — both p6 and p7 conditions hold"
