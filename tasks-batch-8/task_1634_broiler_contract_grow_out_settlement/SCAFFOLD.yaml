scenario: "Broiler Contract Grow-Out & Settlement (Tyson/Perdue contract grower): house placement & chick delivery, feed delivery & conversion tracking, mortality reporting & condemnation, tournament/ranking-based settlement calculation, catch crew scheduling & final weight, biosecurity audit & downtime between flocks, capital upgrade requirement & grower loan, contract renewal & house count"
domain_name: broiler-growout-settlement
api_prefix: /api

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ----------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ----------------------------------------------------------------------
entities:
  - name: Grower
    parent: null
    common_fields: true
    fields:
      - { name: grower_code, type: string, source: input, description: "Unique integrator-issued grower code; unique across all growers", constraints: "unique; immutable after create" }
      - { name: full_name, type: string, source: input, description: "Grower legal name" }
      - { name: status, type: enum, source: system, description: "Grower lifecycle status", default: ACTIVE, constraints: "one of {ACTIVE, SUSPENDED, TERMINATED}" }
      - { name: performance_rating, type: number, source: computed, description: "Rolling average of performance_score across the grower's last 3 SETTLED flocks; null until the first settled flock", default: null }
      - { name: loan_outstanding_cents, type: integer, source: computed, description: "Sum of outstanding principal+accrued share across the grower's non-CLOSED GrowerLoan rows; maintained by loan issue and settlement repayment cascade", default: 0 }
      - { name: house_count, type: integer, source: computed, description: "Count of House rows belonging to this grower with house_status IN {ACTIVE, PLACED}", default: 0 }

  - name: GrowerContract
    parent: Grower
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: input, description: "FK -> Grower.id; the contracted grower" }
      - { name: contract_no, type: string, source: input, description: "Unique contract document number", constraints: "unique" }
      - { name: base_pay_cents_per_lb, type: integer, source: input, description: "Contracted base pay rate in cents per live pound, tier-adjusted at settlement by tournament rank; must be positive" }
      - { name: committed_house_count, type: integer, source: input, description: "Number of houses the contract commits the grower to keep eligible; renewal may raise or lower it" }
      - { name: term_start_date, type: string, source: input, description: "ISO date the contract term begins" }
      - { name: term_end_date, type: string, source: input, description: "ISO date the contract term ends; renewal extends it" }
      - { name: status, type: enum, source: system, description: "Contract lifecycle status", default: DRAFT, constraints: "one of {DRAFT, ACTIVE, RENEWAL_PENDING, RENEWED, EXPIRED, TERMINATED}" }
      - { name: upgrade_required, type: boolean, source: system, description: "True when the integrator has imposed a capital upgrade requirement; blocks renewal until a loan is issued or requirement waived", default: false }

  - name: House
    parent: Grower
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: input, description: "FK -> Grower.id; owner grower" }
      - { name: house_no, type: string, source: input, description: "Grower-scoped house identifier (e.g. H1)", constraints: "unique within (grower_id)" }
      - { name: capacity_birds, type: integer, source: input, description: "Maximum bird placement capacity; must be positive" }
      - { name: house_status, type: enum, source: system, description: "House operational status", default: ACTIVE, constraints: "one of {ACTIVE, PLACED, DOWNTIME, QUARANTINED, DECOMMISSIONED}" }
      - { name: downtime_until, type: string, source: computed, description: "ISO date until which the house is barred from placement; set by flock harvest completion and biosecurity quarantine", default: null }

  - name: Flock
    parent: House
    common_fields: true
    fields:
      - { name: house_id, type: string, source: input, description: "FK -> House.id; house raising this flock" }
      - { name: contract_id, type: string, source: input, description: "FK -> GrowerContract.id; contract the flock is grown under (cross-aggregate)" }
      - { name: settlement_group_id, type: string, source: input, description: "FK -> SettlementGroup.id; tournament group this flock competes in" }
      - { name: flock_no, type: string, source: input, description: "Integrator flock number; unique", constraints: "unique" }
      - { name: placed_head, type: integer, source: system, description: "Head count placed; copied from ChickPlacement on confirmation", default: 0 }
      - { name: placed_date, type: string, source: system, description: "ISO date chicks were placed; copied from ChickPlacement confirmation" }
      - { name: status, type: enum, source: system, description: "Flock lifecycle status", default: PLANNED, constraints: "one of {PLANNED, PLACED, GROWING, CATCH_SCHEDULED, HARVESTED, SETTLED, CONDEMNED_LOSS}" }
      - { name: feed_delivered_lbs, type: integer, source: computed, description: "Sum of FeedDelivery.feed_lbs for this flock (all statuses count once delivered)", default: 0 }
      - { name: mortality_head, type: integer, source: computed, description: "Sum of MortalityReport.dead_head for this flock", default: 0 }
      - { name: condemnation_head, type: integer, source: computed, description: "Sum of MortalityReport.condemned_head for this flock", default: 0 }
      - { name: live_weight_lbs, type: integer, source: computed, description: "Sum of WeightTicket.live_weight_lbs for this flock", default: 0 }
      - { name: adj_fcr, type: number, source: computed, description: "Adjusted feed conversion ratio per calculation adjusted_fcr; null until harvest", default: null }
      - { name: livability_pct, type: number, source: computed, description: "(placed_head - mortality_head) / placed_head; null until placement confirmed", default: null }
      - { name: condemnation_pct, type: number, source: computed, description: "condemnation_head / max(1, placed_head - mortality_head)", default: 0 }
      - { name: performance_score, type: number, source: computed, description: "Tournament performance score per calculation performance_score; null until SETTLED", default: null }
      - { name: version, type: integer, source: system, description: "OCC version; increments on every mutation" }

  - name: ChickPlacement
    parent: Flock
    common_fields: true
    fields:
      - { name: flock_id, type: string, source: input, description: "FK -> Flock.id" }
      - { name: scheduled_date, type: string, source: input, description: "ISO date the placement is scheduled" }
      - { name: head_count, type: integer, source: input, description: "Chicks to be delivered; must be > 0 and <= House.capacity_birds" }
      - { name: status, type: enum, source: system, description: "Placement lifecycle", default: SCHEDULED, constraints: "one of {SCHEDULED, CONFIRMED, CANCELLED}" }
      - { name: confirmed_date, type: string, source: system, description: "ISO date placement was confirmed", default: null }

  - name: FeedDelivery
    parent: Flock
    common_fields: true
    fields:
      - { name: flock_id, type: string, source: input, description: "FK -> Flock.id" }
      - { name: delivered_date, type: string, source: input, description: "ISO date of delivery" }
      - { name: feed_lbs, type: integer, source: input, description: "Pounds of feed delivered; must be > 0" }
      - { name: feed_type, type: enum, source: input, description: "Feed ration phase", constraints: "one of {STARTER, GROWER, FINISHER, WITHDRAWAL}" }
      - { name: ticket_no, type: string, source: input, description: "Feed mill ticket number; unique", constraints: "unique" }

  - name: MortalityReport
    parent: Flock
    common_fields: true
    fields:
      - { name: flock_id, type: string, source: input, description: "FK -> Flock.id" }
      - { name: report_date, type: string, source: input, description: "ISO date the report covers" }
      - { name: dead_head, type: integer, source: input, description: "Birds found dead; must be >= 0" }
      - { name: condemned_head, type: integer, source: input, description: "Birds condemned at plant or field condemnation; must be >= 0 and dead_head + condemned_head must not exceed remaining placed_head" }

  - name: CatchSchedule
    parent: Flock
    common_fields: true
    fields:
      - { name: flock_id, type: string, source: input, description: "FK -> Flock.id" }
      - { name: crew_id, type: string, source: input, description: "FK -> CatchCrew.id; crew assigned" }
      - { name: catch_date, type: string, source: input, description: "ISO date of the catch" }
      - { name: status, type: enum, source: system, description: "Catch schedule lifecycle", default: SCHEDULED, constraints: "one of {SCHEDULED, COMPLETED, CANCELLED}" }

  - name: CatchCrew
    parent: null
    common_fields: true
    fields:
      - { name: crew_code, type: string, source: input, description: "Unique crew identifier", constraints: "unique" }
      - { name: max_catches_per_day, type: integer, source: input, description: "Daily capacity; must be positive" }

  - name: WeightTicket
    parent: Flock
    common_fields: true
    fields:
      - { name: flock_id, type: string, source: input, description: "FK -> Flock.id" }
      - { name: ticket_no, type: string, source: input, description: "Scale ticket number; unique", constraints: "unique" }
      - { name: weighed_at, type: string, source: input, description: "ISO datetime of weighing" }
      - { name: live_weight_lbs, type: integer, source: input, description: "Net live weight; must be > 0" }

  - name: BiosecurityAudit
    parent: House
    common_fields: true
    fields:
      - { name: house_id, type: string, source: input, description: "FK -> House.id" }
      - { name: audit_date, type: string, source: input, description: "ISO date of audit" }
      - { name: result, type: enum, source: input, description: "Audit outcome", constraints: "one of {PASS, FAIL}" }
      - { name: quarantine_days, type: integer, source: input, description: "Quarantine days imposed when result=FAIL; must be >= 7 when FAIL, ignored when PASS", default: 0 }

  - name: SettlementGroup
    parent: null
    common_fields: true
    fields:
      - { name: group_code, type: string, source: input, description: "Unique tournament group code", constraints: "unique" }
      - { name: week_ending_date, type: string, source: input, description: "ISO date of the settlement week" }
      - { name: status, type: enum, source: system, description: "Group lifecycle", default: OPEN, constraints: "one of {OPEN, LOCKED, SETTLED}" }
      - { name: group_avg_fcr, type: number, source: computed, description: "Mean adj_fcr over member flocks with status IN {HARVESTED, SETTLED}; recomputed on each member harvest", default: null }
      - { name: group_avg_livability_pct, type: number, source: computed, description: "Mean livability_pct over member flocks with status IN {HARVESTED, SETTLED}", default: null }
      - { name: group_avg_condemnation_pct, type: number, source: computed, description: "Mean condemnation_pct over member flocks with status IN {HARVESTED, SETTLED}", default: null }

  - name: Settlement
    parent: Flock
    common_fields: true
    fields:
      - { name: flock_id, type: string, source: input, description: "FK -> Flock.id; one settlement per flock (unique)", constraints: "unique" }
      - { name: variant, type: enum, source: system, description: "PROVISIONAL until group LOCKED, then FINAL", default: PROVISIONAL, constraints: "one of {PROVISIONAL, FINAL}" }
      - { name: rank_position, type: integer, source: computed, description: "1 = best performance_score in group" }
      - { name: base_amount_cents, type: integer, source: computed, description: "Tiered base pay from tournament rank" }
      - { name: fcr_bonus_cents, type: integer, source: computed, description: "FCR performance bonus" }
      - { name: condemnation_deduction_cents, type: integer, source: computed, description: "Deduction for condemnation above allowance" }
      - { name: loan_repayment_cents, type: integer, source: computed, description: "Amount diverted to grower loan" }
      - { name: net_amount_cents, type: integer, source: computed, description: "base + bonus - deduction - repayment" }
      - { name: status, type: enum, source: system, description: "Settlement lifecycle", default: PENDING, constraints: "one of {PENDING, APPROVED, PAID, DISPUTED}" }

  - name: GrowerLoan
    parent: Grower
    common_fields: true
    fields:
      - { name: grower_id, type: string, source: input, description: "FK -> Grower.id" }
      - { name: principal_cents, type: integer, source: input, description: "Loan principal; must be positive" }
      - { name: recovery_pct, type: integer, source: input, description: "Percentage of each settlement's positive subtotal diverted to repayment; 1..50" }
      - { name: outstanding_cents, type: integer, source: computed, description: "Remaining balance; starts at principal", default: 0 }
      - { name: status, type: enum, source: system, description: "Loan lifecycle", default: ISSUED, constraints: "one of {ISSUED, REPAID, CLOSED}" }
      - { name: purpose, type: enum, source: input, description: "Loan purpose; CAPITAL_UPGRADE satisfies a contract upgrade requirement", constraints: "one of {CAPITAL_UPGRADE, OPERATING}" }

# ----------------------------------------------------------------------
# §1.2 State Machine Table
# ----------------------------------------------------------------------
state_machines:
  - entity: GrowerContract
    initial_state: DRAFT
    terminal_states: [RENEWED, EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/contracts/{id}/activate"
        actor: IntegratorAdmin
        preconditions:
          - "Grower.status == ACTIVE"
          - "grower's House rows with house_status IN {ACTIVE, PLACED, DOWNTIME} count >= committed_house_count"
        side_effects:
          - "contract.status := ACTIVE"
      - from: ACTIVE
        to: RENEWAL_PENDING
        trigger: "POST /api/contracts/{id}/request-renewal"
        actor: Grower
        preconditions:
          - "actor Grower.id == contract.grower_id"
          - "current logical date <= term_end_date"
        side_effects:
          - "contract.status := RENEWAL_PENDING"
      - from: RENEWAL_PENDING
        to: RENEWED
        trigger: "POST /api/contracts/{id}/renew"
        actor: IntegratorAdmin
        preconditions:
          - "contract.upgrade_required == false OR grower has a GrowerLoan with purpose=CAPITAL_UPGRADE and status IN {ISSUED, REPAID}"
          - "grower's House rows with house_status IN {ACTIVE, PLACED, DOWNTIME} count >= payload.new_committed_house_count"
        side_effects:
          - "contract.status := RENEWED; term_end_date := payload.new_term_end_date; committed_house_count := payload.new_committed_house_count"
          - "cascade: every House of the grower with house_status == QUARANTINED remains QUARANTINED (no change); house_count recomputed"
      - from: RENEWAL_PENDING
        to: ACTIVE
        trigger: "POST /api/contracts/{id}/reject-renewal"
        actor: IntegratorAdmin
        preconditions: []
        side_effects:
          - "contract.status := ACTIVE"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/contracts/{id}/terminate"
        actor: IntegratorAdmin
        preconditions:
          - "no Flock under this contract has status IN {PLANNED, PLACED, GROWING, CATCH_SCHEDULED, HARVESTED}"
        side_effects:
          - "contract.status := TERMINATED"

  - entity: House
    initial_state: ACTIVE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: ACTIVE
        to: PLACED
        trigger: "system, on ChickPlacement CONFIRMED"
        actor: system
        preconditions:
          - "house_status == ACTIVE"
          - "downtime_until is null OR scheduled placement date > downtime_until"
        side_effects:
          - "house_status := PLACED; Grower.house_count recomputed"
      - from: PLACED
        to: DOWNTIME
        trigger: "system, on CatchSchedule COMPLETED"
        actor: system
        preconditions: []
        side_effects:
          - "house_status := DOWNTIME; downtime_until := catch_date + DOWNTIME_DAYS(14); Grower.house_count recomputed"
      - from: DOWNTIME
        to: ACTIVE
        trigger: "POST /api/houses/{id}/release-downtime"
        actor: ServiceTech
        preconditions:
          - "current logical date > downtime_until"
          - "no BiosecurityAudit for this house with result=FAIL whose quarantine window (audit_date + quarantine_days) covers current logical date"
        side_effects:
          - "house_status := ACTIVE; downtime_until := null"
      - from: DOWNTIME
        to: QUARANTINED
        trigger: "system, on BiosecurityAudit created with result=FAIL"
        actor: system
        preconditions: []
        side_effects:
          - "house_status := QUARANTINED; downtime_until := max(downtime_until, audit_date + quarantine_days)"
      - from: ACTIVE
        to: QUARANTINED
        trigger: "system, on BiosecurityAudit created with result=FAIL"
        actor: system
        preconditions: []
        side_effects:
          - "house_status := QUARANTINED; downtime_until := audit_date + quarantine_days"
      - from: QUARANTINED
        to: ACTIVE
        trigger: "POST /api/houses/{id}/release-quarantine"
        actor: ServiceTech
        preconditions:
          - "a BiosecurityAudit for this house exists with result=PASS and audit_date >= the FAIL audit that triggered quarantine"
        side_effects:
          - "house_status := ACTIVE; downtime_until := null"

  - entity: Flock
    initial_state: PLANNED
    terminal_states: [SETTLED, CONDEMNED_LOSS]
    transitions:
      - from: PLANNED
        to: PLACED
        trigger: "system, on ChickPlacement CONFIRMED"
        actor: system
        preconditions: []
        side_effects:
          - "placed_head := placement.head_count; placed_date := placement.confirmed_date; livability_pct computed"
      - from: PLACED
        to: GROWING
        trigger: "system, on first FeedDelivery created for flock"
        actor: system
        preconditions: []
        side_effects:
          - "feed_delivered_lbs += delivery.feed_lbs"
      - from: GROWING
        to: CATCH_SCHEDULED
        trigger: "POST /api/flocks/{id}/catch-schedules"
        actor: LivehaulScheduler
        preconditions:
          - "flock.age_days (current logical date - placed_date) >= MIN_GROW_DAYS(35)"
        side_effects:
          - "CatchSchedule row created SCHEDULED"
      - from: CATCH_SCHEDULED
        to: HARVESTED
        trigger: "POST /api/catch-schedules/{id}/complete"
        actor: LivehaulScheduler
        preconditions:
          - "at least one WeightTicket exists for the flock"
        side_effects:
          - "Flock.status := HARVESTED; adj_fcr computed; livability_pct and condemnation_pct finalized"
          - "House transitions PLACED -> DOWNTIME with downtime_until := catch_date + 14"
          - "SettlementGroup group averages recomputed including this flock"
      - from: HARVESTED
        to: SETTLED
        trigger: "system, on Settlement APPROVED"
        actor: system
        preconditions:
          - "parent SettlementGroup.status == LOCKED"
        side_effects:
          - "performance_score computed; Grower.performance_rating recomputed"
      - from: GROWING
        to: CONDEMNED_LOSS
        trigger: "POST /api/flocks/{id}/declare-condemned-loss"
        actor: IntegratorAdmin
        preconditions:
          - "condemnation_pct > CONDEMNATION_LOSS_THRESHOLD(0.30)"
        side_effects:
          - "Flock.status := CONDEMNED_LOSS; no Settlement row is created; House transitions to DOWNTIME with downtime_until := current logical date + 21"

  - entity: Settlement
    initial_state: PENDING
    terminal_states: [PAID]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /api/settlements/{id}/approve"
        actor: SettlementAnalyst
        preconditions:
          - "SettlementGroup.status == LOCKED"
          - "settlement.variant == FINAL"
        side_effects:
          - "Flock.status := SETTLED"
          - "loan_repayment_cents applied: grower's GrowerLoan.outstanding_cents reduced via waterfall; Grower.loan_outstanding_cents recomputed; loan status becomes REPAID when outstanding_cents reaches 0"
          - "Grower.performance_rating recomputed from last 3 SETTLED flocks"
      - from: PENDING
        to: DISPUTED
        trigger: "POST /api/settlements/{id}/dispute"
        actor: Grower
        preconditions:
          - "actor Grower.id == flock.house.grower_id"
        side_effects: []
      - from: DISPUTED
        to: PENDING
        trigger: "POST /api/settlements/{id}/resolve-dispute"
        actor: SettlementAnalyst
        preconditions: []
        side_effects:
          - "amounts recomputed per calculation settlement_amounts (revision loop)"
      - from: APPROVED
        to: PAID
        trigger: "POST /api/settlements/{id}/pay"
        actor: SettlementAnalyst
        preconditions: []
        side_effects:
          - "settlement marked paid; net_amount_cents frozen"

# ----------------------------------------------------------------------
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# ----------------------------------------------------------------------
concurrency_rules:
  - rule_id: flock-settlement-recompute-stale-version
    parent_entity: Flock
    write_endpoint: "POST /api/flocks/{id}/recompute-settlement"
    occ_field: "expected_flock_version"
    description: |
      Recomputing a flock's settlement against a Flock whose version has
      advanced since the analyst last observed it (e.g. a WeightTicket was
      just posted, changing live_weight_lbs and adj_fcr) is rejected with
      ERR_STALE_FLOCK_VERSION. The client must re-read the Flock and retry
      with the fresh version.
    error_id: ERR_STALE_FLOCK_VERSION
    http_status: 412
  - rule_id: loan-adjust-stale-grower-version
    parent_entity: Grower
    write_endpoint: "POST /api/growers/{id}/loans"
    occ_field: "expected_grower_version"
    description: |
      Issuing a GrowerLoan against a Grower whose version has advanced since
      the client last read it (e.g. a settlement repayment cascade just
      reduced loan_outstanding_cents) is rejected with
      ERR_STALE_GROWER_VERSION. The client must re-read and retry.
    error_id: ERR_STALE_GROWER_VERSION
    http_status: 412

# ----------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ----------------------------------------------------------------------
calculations:
  - name: adjusted_fcr
    trigger: "on Flock transition CATCH_SCHEDULED -> HARVESTED"
    algorithm: aggregation
    formula: |
      raw_fcr = flock.feed_delivered_lbs / flock.live_weight_lbs
      adjusted = (flock.feed_delivered_lbs - FEED_WASTE_CREDIT_LBS) / flock.live_weight_lbs
      Both rounded to 4 decimal places, round_half_up.
    input_set: "All FeedDelivery rows of the flock (every feed_type); live_weight_lbs from all WeightTicket rows of the flock"
    constants:
      FEED_WASTE_CREDIT_LBS: 2000
    precision: "4 decimal places, round_half_up"
    variants:
      - name: raw_fcr
        when: "diagnostic reporting only"
        difference: "no waste credit subtracted; raw_fcr > adjusted whenever a delivery exists"

  - name: performance_score
    trigger: "on Flock transition HARVESTED -> SETTLED (and at PROVISIONAL settlement preview using current group averages)"
    algorithm: weighted_scoring
    formula: |
      performance_score = round_half_up(
          100
          + 50 * (group_avg_fcr - flock.adj_fcr) / group_avg_fcr
          + 20 * (flock.livability_pct - group_avg_livability_pct)
          - 100 * (flock.condemnation_pct - group_avg_condemnation_pct)
      , 4)
      Evaluation order pinned: adj_fcr and the three group averages are
      computed first from their source rows; only then is the score
      evaluated. The circular-looking dependency (score depends on group
      averages which include this flock) is resolved by computing group
      averages over HARVESTED+SETTLED members BEFORE scoring any member.
    input_set: "Flocks in the same SettlementGroup with status IN {HARVESTED, SETTLED}"
    constants:
      FCR_WEIGHT: 50
      LIVABILITY_WEIGHT: 20
      CONDEMNATION_WEIGHT: 100
    precision: "4 decimal places, round_half_up"
    variants:
      - name: provisional_score
        when: "settlement preview while SettlementGroup.status == OPEN"
        difference: "group averages computed over the current HARVESTED members only, so the provisional score differs from the final score once later members harvest"

  - name: settlement_amounts
    trigger: "on Settlement creation (PROVISIONAL), on recompute-settlement, on resolve-dispute, and finalized when group LOCKED"
    algorithm: tiered_pricing
    formula: |
      rank_position = rank of flock.performance_score DESC within group;
                      tie-break: higher live_weight_lbs wins; then earlier placed_date.
      rank_pct = (group_size - rank_position) / group_size       # group_size = member count
      base_rate = contract.base_pay_cents_per_lb
                  + (1.5 if rank_pct >= 0.75 else
                     0.8 if rank_pct >= 0.50 else
                     0.2 if rank_pct >= 0.25 else 0.0)           # tier uplift in cents/lb
      base_amount_cents       = round_half_up(flock.live_weight_lbs * base_rate, 0)
      fcr_bonus_cents         = round_half_up(flock.live_weight_lbs *
                                (0.5 if adj_fcr <= group_avg_fcr * 0.98 else
                                 0.25 if adj_fcr <= group_avg_fcr else 0.0), 0)
      condemnation_deduction_cents =
          round_half_up(flock.live_weight_lbs * CONDEMNATION_RATE_CENTS
                        * max(0, condemnation_pct - CONDEMNATION_ALLOWANCE), 0)
      positive_subtotal = base_amount_cents + fcr_bonus_cents - condemnation_deduction_cents
      loan_repayment_cents = 0 if positive_subtotal <= 0 else
          min( round_half_up(positive_subtotal * loan.recovery_pct / 100, 0),
               sum of outstanding_cents over grower's loans with status == ISSUED )
      # repayment waterfall: oldest loan (earliest created_at) first
      net_amount_cents = positive_subtotal - loan_repayment_cents
      Rounding order pinned: each line is rounded to whole cents
      round_half_up BEFORE summation (per-line then sum, NOT sum then round).
    input_set: "The flock, its contract, its SettlementGroup members, and the grower's ISSUED loans"
    constants:
      CONDEMNATION_ALLOWANCE: 0.005
      CONDEMNATION_RATE_CENTS: 40
    precision: "whole cents, round_half_up per line then sum"
    variants:
      - name: provisional_amounts
        when: "variant == PROVISIONAL (group OPEN)"
        difference: "rank computed over currently-HARVESTED members only; provisional and final amounts differ whenever another member harvests after the preview"

  - name: loan_outstanding_recompute
    trigger: "on GrowerLoan creation, on Settlement APPROVED cascade"
    algorithm: waterfall_allocation
    formula: |
      Grower.loan_outstanding_cents = sum(outstanding_cents) over GrowerLoan
      rows of the grower with status IN {ISSUED}.
      Settlement repayment applies to the oldest ISSUED loan first
      (created_at ASC); when a loan's outstanding_cents reaches 0 its status
      becomes REPAID and the remainder flows to the next oldest ISSUED loan.
    input_set: "GrowerLoan rows of the grower with status == ISSUED, ordered created_at ASC"
    constants: {}
    precision: "whole cents"

  - name: grower_performance_rating
    trigger: "on Flock transition HARVESTED -> SETTLED"
    algorithm: aggregation
    formula: |
      rating = mean(performance_score) over the grower's flocks with
      status == SETTLED, taking the 3 most recent by placed_date DESC
      (tie-break: later settled date, then created_at ASC). Null when the
      grower has zero SETTLED flocks.
    input_set: "Flocks of the grower with status == SETTLED, 3 most recent"
    constants:
      RATING_WINDOW: 3
    precision: "4 decimal places, round_half_up"

# ----------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ----------------------------------------------------------------------
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and in the declared role set; X-User-ID present", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted to invoke the endpoint per §1.5 roles", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path-template ids resolve left-to-right (grower, contract, house, flock, placement, schedule, settlement, loan, group, crew, audit)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: existence, check: "Body-referenced FK ids exist (contract_id, settlement_group_id, crew_id)", error_id: ERR_REFERENCE_NOT_FOUND, http_status: 404, applies_to: "POST endpoints with FK body fields" }
  - { priority: 5, category: state, check: "Entity in a from-state of the requested transition (per §1.2)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: state, check: "OCC: expected_*_version equals the parent entity's current version", error_id: ERR_STALE_FLOCK_VERSION, http_status: 412, applies_to: "POST /api/flocks/{id}/recompute-settlement" }
  - { priority: 6, category: state, check: "OCC: expected_grower_version equals Grower.version", error_id: ERR_STALE_GROWER_VERSION, http_status: 412, applies_to: "POST /api/growers/{id}/loans" }
  - { priority: 7, category: business_safety, check: "House not QUARANTINED and scheduled placement date > downtime_until when creating/confirming a ChickPlacement", error_id: ERR_HOUSE_IN_DOWNTIME, http_status: 409, applies_to: "POST /api/flocks/{id}/placements, POST /api/placements/{id}/confirm" }
  - { priority: 8, category: business_safety, check: "Flock condemned-loss declaration requires condemnation_pct > 0.30", error_id: ERR_CONDEMNATION_BELOW_THRESHOLD, http_status: 422, applies_to: "POST /api/flocks/{id}/declare-condemned-loss" }
  - { priority: 9, category: business_temporal, check: "Catch crew not already committed to max_catches_per_day COMPLETED-or-SCHEDULED catches on catch_date", error_id: ERR_CREW_OVERBOOKED, http_status: 409, applies_to: "POST /api/flocks/{id}/catch-schedules" }
  - { priority: 10, category: business_temporal, check: "Flock age >= 35 days at catch scheduling", error_id: ERR_FLOCK_TOO_YOUNG, http_status: 422, applies_to: "POST /api/flocks/{id}/catch-schedules" }
  - { priority: 11, category: business_constraint, check: "head_count <= House.capacity_birds and > 0; feed_lbs > 0; live_weight_lbs > 0; dead_head >= 0; condemned_head >= 0; cumulative mortality+condemnation <= placed_head", error_id: ERR_QUANTITY_INVALID, http_status: 422, applies_to: "POST /api/flocks/{id}/placements, POST /api/flocks/{id}/feed-deliveries, POST /api/flocks/{id}/weight-tickets, POST /api/flocks/{id}/mortality-reports" }
  - { priority: 12, category: business_constraint, check: "Uniqueness: grower_code, contract_no, ticket_no, house_no within grower, flock_no, group_code, crew_code, settlement.flock_id", error_id: ERR_DUPLICATE, http_status: 409, applies_to: "create endpoints" }
  - { priority: 13, category: business_referential, check: "Contract renewal precondition: upgrade requirement cleared by CAPITAL_UPGRADE loan and house eligibility count >= new committed_house_count", error_id: ERR_RENEWAL_BLOCKED, http_status: 422, applies_to: "POST /api/contracts/{id}/renew" }
  - { priority: 14, category: business_referential, check: "Contract termination blocked while any flock under it is non-terminal", error_id: ERR_FLOCKS_IN_FLIGHT, http_status: 409, applies_to: "POST /api/contracts/{id}/terminate" }
  - { priority: 15, category: business_fiscal, check: "Settlement approve requires SettlementGroup.status == LOCKED and settlement.variant == FINAL", error_id: ERR_GROUP_NOT_LOCKED, http_status: 409, applies_to: "POST /api/settlements/{id}/approve" }
  - { priority: 16, category: business_fiscal, check: "Loan recovery_pct within 1..50 and principal_cents > 0", error_id: ERR_LOAN_TERMS_INVALID, http_status: 422, applies_to: "POST /api/growers/{id}/loans" }

# ----------------------------------------------------------------------
# §1.5 API Endpoint Table
# ----------------------------------------------------------------------
endpoints:
  - { method: POST, path: "/api/growers", description: "Create grower", roles: [IntegratorAdmin], code: 201, input: [grower_code, full_name], output: Grower, side_effects: [] }
  - { method: GET, path: "/api/growers/{id}", description: "Get grower", roles: [IntegratorAdmin, Grower, SettlementAnalyst, ServiceTech, LivehaulScheduler], code: 200, input: [], output: Grower, side_effects: [] }
  - { method: GET, path: "/api/growers", description: "List growers", roles: [IntegratorAdmin, SettlementAnalyst], code: 200, input: ["status?", "limit?", "offset?"], output: "Grower[]", side_effects: [] }
  - { method: POST, path: "/api/growers/{id}/loans", description: "Issue grower loan (OCC on Grower.version)", roles: [IntegratorAdmin], code: 201, input: [principal_cents, recovery_pct, purpose, expected_grower_version], output: GrowerLoan, side_effects: ["Grower.loan_outstanding_cents recomputed", "increments Grower.version by 1", "loan.outstanding_cents := principal_cents"] }
  - { method: GET, path: "/api/growers/{id}/loans", description: "List a grower's loans", roles: [IntegratorAdmin, Grower, SettlementAnalyst], code: 200, input: ["limit?", "offset?"], output: "GrowerLoan[]", side_effects: [] }
  - { method: GET, path: "/api/growers/{id}/houses", description: "List a grower's houses", roles: [IntegratorAdmin, Grower, ServiceTech], code: 200, input: ["house_status?", "limit?", "offset?"], output: "House[]", side_effects: [] }
  - { method: GET, path: "/api/growers/{id}/contracts", description: "List a grower's contracts", roles: [IntegratorAdmin, Grower, SettlementAnalyst], code: 200, input: ["limit?", "offset?"], output: "GrowerContract[]", side_effects: [] }
  - { method: POST, path: "/api/growers/{id}/suspend", description: "Suspend grower", roles: [IntegratorAdmin], code: 200, input: [], output: Grower, side_effects: ["Grower.status := SUSPENDED", "increments Grower.version by 1"] }

  - { method: POST, path: "/api/contracts", description: "Create contract", roles: [IntegratorAdmin], code: 201, input: [grower_id, contract_no, base_pay_cents_per_lb, committed_house_count, term_start_date, term_end_date], output: GrowerContract, side_effects: [] }
  - { method: GET, path: "/api/contracts/{id}", description: "Get contract", roles: [IntegratorAdmin, Grower, SettlementAnalyst], code: 200, input: [], output: GrowerContract, side_effects: [] }
  - { method: POST, path: "/api/contracts/{id}/activate", description: "Activate contract", roles: [IntegratorAdmin], code: 200, input: [], output: GrowerContract, side_effects: ["DRAFT -> ACTIVE"] }
  - { method: POST, path: "/api/contracts/{id}/impose-upgrade", description: "Impose capital upgrade requirement", roles: [IntegratorAdmin], code: 200, input: [], output: GrowerContract, side_effects: ["contract.upgrade_required := true"] }
  - { method: POST, path: "/api/contracts/{id}/request-renewal", description: "Grower requests renewal", roles: [Grower], code: 200, input: [], output: GrowerContract, side_effects: ["ACTIVE -> RENEWAL_PENDING"] }
  - { method: POST, path: "/api/contracts/{id}/renew", description: "Renew contract (new term, new house count)", roles: [IntegratorAdmin], code: 200, input: [new_term_end_date, new_committed_house_count], output: GrowerContract, side_effects: ["RENEWAL_PENDING -> RENEWED; term_end_date and committed_house_count updated"] }
  - { method: POST, path: "/api/contracts/{id}/reject-renewal", description: "Reject renewal request", roles: [IntegratorAdmin], code: 200, input: [], output: GrowerContract, side_effects: ["RENEWAL_PENDING -> ACTIVE"] }
  - { method: POST, path: "/api/contracts/{id}/terminate", description: "Terminate contract", roles: [IntegratorAdmin], code: 200, input: [], output: GrowerContract, side_effects: ["ACTIVE -> TERMINATED"] }

  - { method: POST, path: "/api/houses", description: "Create house", roles: [IntegratorAdmin], code: 201, input: [grower_id, house_no, capacity_birds], output: House, side_effects: ["Grower.house_count recomputed"] }
  - { method: GET, path: "/api/houses/{id}", description: "Get house", roles: [IntegratorAdmin, Grower, ServiceTech, LivehaulScheduler], code: 200, input: [], output: House, side_effects: [] }
  - { method: POST, path: "/api/houses/{id}/release-downtime", description: "Release house from downtime", roles: [ServiceTech], code: 200, input: [], output: House, side_effects: ["DOWNTIME -> ACTIVE when eligible"] }
  - { method: POST, path: "/api/houses/{id}/release-quarantine", description: "Release house from quarantine after PASS audit", roles: [ServiceTech], code: 200, input: [], output: House, side_effects: ["QUARANTINED -> ACTIVE"] }
  - { method: POST, path: "/api/houses/{id}/audits", description: "Record biosecurity audit", roles: [ServiceTech], code: 201, input: [audit_date, result, "quarantine_days?"], output: BiosecurityAudit, side_effects: ["FAIL result cascades: house -> QUARANTINED, downtime_until := max(current downtime_until, audit_date + quarantine_days)"] }
  - { method: GET, path: "/api/houses/{id}/audits", description: "List audits for house", roles: [IntegratorAdmin, ServiceTech, Grower], code: 200, input: ["limit?", "offset?"], output: "BiosecurityAudit[]", side_effects: [] }
  - { method: GET, path: "/api/houses/{id}/flocks", description: "List flocks in house", roles: [IntegratorAdmin, Grower, ServiceTech, LivehaulScheduler, SettlementAnalyst], code: 200, input: ["status?", "limit?", "offset?"], output: "Flock[]", side_effects: [] }

  - { method: POST, path: "/api/flocks", description: "Plan flock", roles: [IntegratorAdmin], code: 201, input: [house_id, contract_id, settlement_group_id, flock_no], output: Flock, side_effects: [] }
  - { method: GET, path: "/api/flocks/{id}", description: "Get flock", roles: [IntegratorAdmin, Grower, ServiceTech, LivehaulScheduler, SettlementAnalyst], code: 200, input: [], output: Flock, side_effects: [] }
  - { method: GET, path: "/api/flocks", description: "List flocks with filters", roles: [IntegratorAdmin, SettlementAnalyst, LivehaulScheduler], code: 200, input: ["settlement_group_id?", "contract_id?", "status?", "limit?", "offset?"], output: "Flock[]", side_effects: [] }
  - { method: POST, path: "/api/flocks/{id}/placements", description: "Schedule chick placement", roles: [IntegratorAdmin], code: 201, input: [scheduled_date, head_count], output: ChickPlacement, side_effects: [] }
  - { method: GET, path: "/api/flocks/{id}/placements", description: "List placements for flock", roles: [IntegratorAdmin, Grower, ServiceTech], code: 200, input: ["limit?", "offset?"], output: "ChickPlacement[]", side_effects: [] }
  - { method: POST, path: "/api/flocks/{id}/feed-deliveries", description: "Record feed delivery", roles: [IntegratorAdmin], code: 201, input: [delivered_date, feed_lbs, feed_type, ticket_no], output: FeedDelivery, side_effects: ["flock.feed_delivered_lbs += feed_lbs", "first delivery flips flock PLACED -> GROWING"] }
  - { method: GET, path: "/api/flocks/{id}/feed-deliveries", description: "List feed deliveries", roles: [IntegratorAdmin, Grower, SettlementAnalyst], code: 200, input: ["limit?", "offset?"], output: "FeedDelivery[]", side_effects: [] }
  - { method: POST, path: "/api/flocks/{id}/mortality-reports", description: "Record mortality report", roles: [Grower], code: 201, input: [report_date, dead_head, condemned_head], output: MortalityReport, side_effects: ["flock.mortality_head += dead_head; flock.condemnation_head += condemned_head; livability_pct and condemnation_pct recomputed"] }
  - { method: GET, path: "/api/flocks/{id}/mortality-reports", description: "List mortality reports", roles: [IntegratorAdmin, Grower, SettlementAnalyst], code: 200, input: ["limit?", "offset?"], output: "MortalityReport[]", side_effects: [] }
  - { method: POST, path: "/api/flocks/{id}/weight-tickets", description: "Record weight ticket", roles: [LivehaulScheduler], code: 201, input: [ticket_no, weighed_at, live_weight_lbs], output: WeightTicket, side_effects: ["flock.live_weight_lbs += live_weight_lbs", "increments Flock.version by 1"] }
  - { method: GET, path: "/api/flocks/{id}/weight-tickets", description: "List weight tickets", roles: [IntegratorAdmin, Grower, LivehaulScheduler, SettlementAnalyst], code: 200, input: ["limit?", "offset?"], output: "WeightTicket[]", side_effects: [] }
  - { method: POST, path: "/api/flocks/{id}/catch-schedules", description: "Schedule catch crew", roles: [LivehaulScheduler], code: 201, input: [crew_id, catch_date], output: CatchSchedule, side_effects: ["flock GROWING -> CATCH_SCHEDULED"] }
  - { method: GET, path: "/api/flocks/{id}/catch-schedules", description: "List catch schedules for a flock", roles: [IntegratorAdmin, Grower, LivehaulScheduler], code: 200, input: ["limit?", "offset?"], output: "CatchSchedule[]", side_effects: [] }
  - { method: POST, path: "/api/flocks/{id}/declare-condemned-loss", description: "Declare whole-flock condemnation loss", roles: [IntegratorAdmin], code: 200, input: [], output: Flock, side_effects: ["flock GROWING -> CONDEMNED_LOSS; house -> DOWNTIME with 21-day downtime"] }

  - { method: POST, path: "/api/placements/{id}/confirm", description: "Confirm chick placement", roles: [IntegratorAdmin], code: 200, input: [], output: ChickPlacement, side_effects: ["placement SCHEDULED -> CONFIRMED; flock PLANNED -> PLACED (placed_head, placed_date set); house ACTIVE -> PLACED"] }
  - { method: POST, path: "/api/placements/{id}/cancel", description: "Cancel a scheduled placement", roles: [IntegratorAdmin], code: 200, input: [], output: ChickPlacement, side_effects: ["placement SCHEDULED -> CANCELLED"] }

  - { method: POST, path: "/api/catch-schedules/{id}/complete", description: "Complete catch (requires weight tickets)", roles: [LivehaulScheduler], code: 200, input: [], output: CatchSchedule, side_effects: ["schedule SCHEDULED -> COMPLETED; flock CATCH_SCHEDULED -> HARVESTED (adj_fcr computed); house PLACED -> DOWNTIME (14 days); SettlementGroup averages recomputed"] }
  - { method: POST, path: "/api/catch-schedules/{id}/cancel", description: "Cancel catch schedule", roles: [LivehaulScheduler], code: 200, input: [], output: CatchSchedule, side_effects: ["schedule SCHEDULED -> CANCELLED; flock CATCH_SCHEDULED -> GROWING"] }

  - { method: POST, path: "/api/settlement-groups", description: "Create settlement group", roles: [SettlementAnalyst], code: 201, input: [group_code, week_ending_date], output: SettlementGroup, side_effects: [] }
  - { method: GET, path: "/api/settlement-groups/{id}", description: "Get settlement group", roles: [IntegratorAdmin, SettlementAnalyst, Grower], code: 200, input: [], output: SettlementGroup, side_effects: [] }
  - { method: GET, path: "/api/settlement-groups/{id}/flocks", description: "List flocks in a settlement group", roles: [IntegratorAdmin, SettlementAnalyst, Grower], code: 200, input: ["limit?", "offset?"], output: "Flock[]", side_effects: [] }
  - { method: POST, path: "/api/settlement-groups/{id}/lock", description: "Lock group; finalize all PROVISIONAL settlements in group", roles: [SettlementAnalyst], code: 200, input: [], output: SettlementGroup, side_effects: ["group OPEN -> LOCKED; every PENDING settlement in the group recomputed per settlement_amounts and variant := FINAL"] }

  - { method: POST, path: "/api/flocks/{id}/recompute-settlement", description: "Create/recompute the flock's settlement (OCC on Flock.version)", roles: [SettlementAnalyst], code: 200, input: [expected_flock_version], output: Settlement, side_effects: ["creates Settlement PENDING with PROVISIONAL variant if none exists; otherwise recomputes amounts", "increments Flock.version by 1"] }
  - { method: GET, path: "/api/flocks/{id}/settlement", description: "Get the settlement for a flock (array of 0 or 1)", roles: [IntegratorAdmin, Grower, SettlementAnalyst], code: 200, input: [], output: "Settlement[]", side_effects: [] }
  - { method: POST, path: "/api/settlements/{id}/approve", description: "Approve settlement (requires group LOCKED, FINAL variant)", roles: [SettlementAnalyst], code: 200, input: [], output: Settlement, side_effects: ["PENDING -> APPROVED; flock -> SETTLED; loan repayment waterfall applied; grower rating recomputed"] }
  - { method: POST, path: "/api/settlements/{id}/dispute", description: "Grower disputes settlement", roles: [Grower], code: 200, input: [], output: Settlement, side_effects: ["PENDING -> DISPUTED"] }
  - { method: POST, path: "/api/settlements/{id}/resolve-dispute", description: "Resolve dispute; recompute amounts", roles: [SettlementAnalyst], code: 200, input: [], output: Settlement, side_effects: ["DISPUTED -> PENDING; amounts recomputed"] }
  - { method: POST, path: "/api/settlements/{id}/pay", description: "Pay approved settlement", roles: [SettlementAnalyst], code: 200, input: [], output: Settlement, side_effects: ["APPROVED -> PAID"] }

  - { method: POST, path: "/api/catch-crews", description: "Create catch crew", roles: [LivehaulScheduler], code: 201, input: [crew_code, max_catches_per_day], output: CatchCrew, side_effects: [] }
  - { method: GET, path: "/api/catch-crews/{id}", description: "Get catch crew", roles: [IntegratorAdmin, LivehaulScheduler], code: 200, input: [], output: CatchCrew, side_effects: [] }
  - { method: GET, path: "/api/catch-crews/{id}/schedules", description: "List schedules for a crew", roles: [IntegratorAdmin, LivehaulScheduler], code: 200, input: ["catch_date?", "limit?", "offset?"], output: "CatchSchedule[]", side_effects: [] }

  - { method: POST, path: "/api/_clock/set_current_utc", description: "Set the server logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; never falls back to wall-clock.", roles: [IntegratorAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: [] }

# ----------------------------------------------------------------------
# §1.6 Error Code Catalog
# ----------------------------------------------------------------------
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted to invoke the endpoint, or entity_backed ownership check fails (Grower acting on another grower's resource)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not resolve" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "Body FK (contract_id, settlement_group_id, crew_id, grower_id, house_id) does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a from-state of the requested transition" }
  - { id: ERR_STALE_FLOCK_VERSION, http: 412, condition: "expected_flock_version != Flock.version on recompute-settlement" }
  - { id: ERR_STALE_GROWER_VERSION, http: 412, condition: "expected_grower_version != Grower.version on loan issue" }
  - { id: ERR_HOUSE_IN_DOWNTIME, http: 409, condition: "Placement scheduled into house that is QUARANTINED or whose downtime_until covers the scheduled date" }
  - { id: ERR_CONDEMNATION_BELOW_THRESHOLD, http: 422, condition: "declare-condemned-loss with condemnation_pct <= 0.30" }
  - { id: ERR_CREW_OVERBOOKED, http: 409, condition: "Catch crew already at max_catches_per_day on the requested catch_date" }
  - { id: ERR_FLOCK_TOO_YOUNG, http: 422, condition: "Catch scheduled before flock reaches 35 days of age" }
  - { id: ERR_QUANTITY_INVALID, http: 422, condition: "Quantity constraint violated (head_count over capacity, non-positive lbs, negative mortality, cumulative mortality exceeds placed)" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Uniqueness constraint violated (grower_code, contract_no, ticket_no, flock_no, group_code, crew_code, house_no per grower, one settlement per flock)" }
  - { id: ERR_RENEWAL_BLOCKED, http: 422, condition: "Renewal blocked: unsatisfied upgrade requirement or insufficient eligible houses" }
  - { id: ERR_FLOCKS_IN_FLIGHT, http: 409, condition: "Terminate blocked by non-terminal flocks under the contract" }
  - { id: ERR_GROUP_NOT_LOCKED, http: 409, condition: "Approve attempted while group OPEN or settlement still PROVISIONAL" }
  - { id: ERR_LOAN_TERMS_INVALID, http: 422, condition: "principal_cents <= 0 or recovery_pct outside 1..50" }

# ----------------------------------------------------------------------
# §1.7 RBAC Matrix
# ----------------------------------------------------------------------
roles:
  - name: IntegratorAdmin
    description: "Integrator (Tyson/Perdue) operations administrator; manages growers, contracts, houses, flocks, placements, feed, loans, and condemned-loss declarations"
    identity: opaque
    exclusive_operations: [create grower, suspend grower, issue loan, create/activate/renew/reject/terminate contract, impose upgrade, create house, plan flock, schedule/confirm/cancel placement, record feed delivery, declare condemned loss]
    shared_operations: [read any entity, list flocks/houses/contracts/loans/audits]
  - name: Grower
    description: "Contract poultry grower acting on their own resources"
    identity: "entity_backed:Grower"
    exclusive_operations: [record mortality report, request contract renewal, dispute settlement]
    shared_operations: [read own grower record, houses, flocks, feed, mortality, weight tickets, settlement, audits]
  - name: ServiceTech
    description: "Integrator field service technician; biosecurity audits and house downtime/quarantine release"
    identity: opaque
    exclusive_operations: [record biosecurity audit, release downtime, release quarantine]
    shared_operations: [read houses, flocks, audits]
  - name: LivehaulScheduler
    description: "Live-haul coordinator; catch crews, catch scheduling, weight tickets"
    identity: opaque
    exclusive_operations: [create catch crew, schedule catch, complete catch, cancel catch, record weight ticket]
    shared_operations: [read flocks, houses, crews, schedules]
  - name: SettlementAnalyst
    description: "Complex settlement office analyst; settlement groups, recompute, approve, resolve disputes, pay"
    identity: opaque
    exclusive_operations: [create settlement group, lock group, recompute settlement, approve settlement, resolve dispute, pay settlement]
    shared_operations: [read growers, flocks, settlements, loans, groups]
