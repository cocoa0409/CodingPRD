              as: ShippingClerk
              captures: { reel_b_final: $.data.status, reel_b_cycles: $.data.cycle_count }
            - call: "GET /production-lots/${lot_b}"
              payload: {}
              as: ProcessEngineer
              captures: { lot_b_process_final: $.data.process_state }
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: BillingAnalyst
              captures: { deposit_balance_final: $.data.reel_deposit_balance_usd, exposure_final: $.data.credit_exposure_usd, cust_status_final: $.data.status }
          assert:
            - "the first shipment moved the order: ${ord_v2} == ${ord_v1} + 1, ${shipped_after_first} == 5.000 and ${fulfil_after_first} == \"PARTIALLY_SHIPPED\""
            - "dropping the limit puts the account on hold on nothing but deposits: ${exposure_held} == 450.00 (no invoice yet, so open_ar is 0.00) and ${cust_status_held} == \"CREDIT_HOLD\""
            - "with the stale version, the 2000 ft overrun and the CREDIT_HOLD all armed at once, only the earliest rung speaks: ${e_occ} == \"ERR_STALE_ORDER_VERSION\" with HTTP 412 (priority 35 beats 72 and 80)"
            - "the 412 ran no side effects at all: ${reel_b_status_after_412} == \"LOADED\", ${ord_v_after_412} == ${ord_v2}, ${shipped_after_412} == 5.000 and GET /shipments still returns 1 row with total_count == 1"
            - "repairing only the version exposes the next layer: ${e_quantity} == \"ERR_SHIPMENT_EXCEEDS_ORDER\" with HTTP 422 (5.000 + 2.000 > 6.000 ordered)"
            - "repairing the quantity exposes the fiscal layer: ${e_credit} == \"ERR_CREDIT_LIMIT_EXCEEDED\" with HTTP 402 - the account is CREDIT_HOLD, and even if it were ACTIVE 450.00 + 300.00 == 750.00 would exceed the 400.00 limit"
            - "${cust_status_active} == \"ACTIVE\": raising the limit back to 100000.00 recomputes the exposure and releases the hold in the PATCH response itself"
            - "only the final attempt executes the fan-out, all in one request: ${ship_b_deposit} == 300.00, ${reel_b_final} == \"SHIPPED\" with ${reel_b_cycles} == 1, ${lot_b_process_final} == \"SHIPPED\", ${shipped_final} == 6.000 with ${fulfil_final} == \"FULFILLED\" and ${ord_v3} == ${ord_v2} + 1"
            - "the deposit ledger accumulated exactly twice: ${deposit_balance_final} == 750.00, ${exposure_final} == 750.00 and ${cust_status_final} == \"ACTIVE\" under the restored limit"
            - "a partial draw is legal: LOT-B was packaged at 2000 ft and only 1000 ft shipped, yet the reel still closed out to SHIPPED - reel occupancy is per load, not per foot"

      - name: dual_variant_metal_pricing
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: metal_pass_through_lock_versus_float_invoice
          rationale: "The ORDER_DATE_LOCK versus SHIP_DATE_FLOAT split - two orders identical except for price_basis invoicing at different amounts off the same quote series, including the 5-day inclusive float window average - is computed to the cent by that §1.8 instance."

      - name: dual_variant_deposit_refund
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: reel_deposit_flat_step_versus_daily_decay_refund
          rationale: "The two reel-return refund variants (flat step by condition versus daily decay on days_out) are both computed, compared and reconciled against the deposit ledger by that §1.8 instance."

      - name: cascade_depth_from_inspection_to_lot
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: inspection_suspend_cascades_four_hops_to_queued_lot
          rationale: "The deepest cascade in the system (FAIL inspection -> certification SUSPENDED -> SKU suspended -> order pricing HELD -> queued lot QUARANTINED) is asserted hop by hop, in order, by that §1.8 instance."

      - name: cascade_depth_from_scrap_to_sibling_lot
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: lot_scrap_cascades_three_hops_through_metal_ledger_to_sibling_lot
          rationale: "The three-hop scrap cascade above the threshold (mass moves committed -> scrapped, rod lot QUARANTINED, sibling PENDING lots QUARANTINED in created_at order) is asserted by that §1.8 instance; the rate_threshold_triggers instance above deliberately probes the opposite side of the boundary instead, at exactly 10.00 percent."

  # ===========================================================================
  # Section 9 - Consistency model (1.0 consistency_model: immediate)
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: every_mutating_response_is_already_the_settled_state
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations[rod_mass_ledger]
          - calculations[customer_credit_exposure]
          - calculations[concentricity_pct]
        distinguishing_aspect: "consistency_model is immediate, so there is no queue, no poll and no convergence window: every computed field and every cross-aggregate cascade is final inside the response of the call that caused it, and an immediate re-read returns byte-identical values. The probe pairs each mutation with the very next call being a GET of the resource the mutation touched indirectly."
        test_recipe:
          setup:
            - "The canonical LV chain: THHN-12-CU on UL file E12345, customer ACME with a 100000.00 credit limit, order SO-1001 for 5.000 kft at ORDER_DATE_LOCK, rod lot H-77Q of 20000.00 lbs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /metal-price-quotes"
              payload: { metal: "COPPER", effective_date: "2026-07-30", settlement_price_usd_per_lb: 4.10, source: "COMEX" }
              as: ProcurementBuyer
            - call: "POST /compounds"
              payload: { compound_code: "PVC-90-INS", layer_role: "INSULATION", temp_rating_c: 90, flame_test: "VW_1", max_voltage_v: 600, wet_rated: true, filler_pct: 12.5 }
              as: ProcessEngineer
              captures: { ins_id: $.data.id }
            - call: "POST /compounds/${ins_id}/qualify"
              payload: {}
              as: ProcessEngineer
            - call: "POST /listing-certifications"
              payload: { agency: "UL", file_number: "E12345", product_family_code: "BLDG-WIRE", initial_listing_date: "2026-06-01", inspection_interval_days: 90 }
              as: CertificationOfficer
              captures: { cert_id: $.data.id }
            - call: "POST /listing-certifications/${cert_id}/inspections"
              payload: { inspection_date: "2026-06-05", inspector_code: "INS-7", findings_count: 0, outcome: "PASS" }
              as: CertificationOfficer
              captures: { insp_next_due_in_response: $.data.corrective_action_due_date }
            - call: "GET /listing-certifications/${cert_id}"
              payload: {}
              as: CertificationOfficer
              captures: { cert_next_due: $.data.next_inspection_due_date, cert_status: $.data.status }
            - call: "POST /catalog-products"
              payload: { product_code: "THHN-12-CU", awg_size: "12", conductor_metal: "COPPER", conductor_construction: "STRANDED_7", application_rating: "THHN", voltage_class: "LV_600", temp_rating_c: 90, insulation_thickness_mils: 28.0, conductor_lbs_per_kft: 19.8, insulation_compound_id: "${ins_id}", listing_certification_id: "${cert_id}", base_target_kft: 100.0 }
              as: ProcessEngineer
              captures: { prod_id: $.data.id, marking_in_create: $.data.required_marking_text }
            - call: "POST /catalog-products/${prod_id}/release"
              payload: {}
              as: ProcessEngineer
            - call: "POST /customers"
              payload: { account_code: "ACME", name: "Acme Electric Supply", market_region: "NORTHEAST", credit_limit_usd: 100000.00, pass_through_enabled: true, reel_program: "RETURNABLE" }
              as: BillingAnalyst
              captures: { cust_id: $.data.id }
            - call: "POST /customer-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", order_number: "SO-1001", ordered_kft: 5.000, price_basis: "ORDER_DATE_LOCK", conversion_price_usd_per_kft: 85.00, order_date: "2026-07-30" }
              as: BillingAnalyst
              captures: { ord_id: $.data.id, quoted_in_create: $.data.quoted_unit_price_usd_per_kft }
            - call: "POST /rod-purchase-lots"
              payload: { metal: "COPPER", supplier_code: "SUP-1", rod_diameter_mm: 8.0, heat_number: "H-77Q", purchase_weight_lbs: 20000.00, purchase_price_usd_per_lb: 4.05, pricing_basis: "SPOT", received_date: "2026-07-25" }
              as: ProcurementBuyer
              captures: { rod_id: $.data.id, rod_v1: $.data.version }
          trigger:
            - call: "POST /production-lots"
              payload: { product_id: "${prod_id}", rod_lot_id: "${rod_id}", order_id: "${ord_id}", lot_code: "LOT-A", planned_length_ft: 5000, line_code: "EXT-1", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z", expected_rod_lot_version: "${rod_v1}" }
              as: ProcessEngineer
              captures: { lot_id: $.data.id, consumed_in_create: $.data.consumed_rod_lbs, trace_in_create: $.data.traceability_code }
            - call: "GET /rod-purchase-lots/${rod_id}"
              payload: {}
              as: ProcurementBuyer
              captures: { rod_committed_now: $.data.committed_lbs, rod_remaining_now: $.data.remaining_lbs }
            - call: "POST /production-lots/${lot_id}/process-steps"
              payload: { step: "DRAWING" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_id}/process-steps"
              payload: { step: "STRANDING" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_id}/process-steps"
              payload: { step: "EXTRUSION", measured_min_wall_mils: 25.5, measured_max_wall_mils: 30.0, measured_avg_od_mm: 4.10, surface_marking_text: "UL E12345 12AWG THHN 90C 600V" }
              as: ProcessEngineer
              captures: { conc_in_response: $.data.concentricity_pct }
            - call: "GET /production-lots/${lot_id}"
              payload: {}
              as: ProcessEngineer
              captures: { conc_on_reread: $.data.concentricity_pct }
            - call: "POST /production-lots/${lot_id}/tests"
              payload: { test_type: "SPARK", duration_sec: 60, faults_detected: 0 }
              as: QualityEngineer
              as_user_id: "qe-001"
            - call: "POST /production-lots/${lot_id}/tests"
              payload: { test_type: "HIPOT", duration_sec: 300, test_voltage_kv: 2.5, breakdown_detected: false }
              as: QualityEngineer
              as_user_id: "qe-001"
              captures: { hipot_result: $.data.result }
            - call: "GET /production-lots/${lot_id}"
              payload: {}
              as: ProcessEngineer
              captures: { process_after_tests: $.data.process_state }
            - call: "POST /production-lots/${lot_id}/release"
              payload: { packaged_length_ft: 5000 }
              as: QualityEngineer
              as_user_id: "qe-002"
              captures: { quality_in_response: $.data.quality_state }
            - call: "POST /reels"
              payload: { reel_serial: "R-001", reel_type: "WOOD_RETURNABLE", deposit_usd: 450.00, capacity_ft: 6000 }
              as: ShippingClerk
              captures: { reel_id: $.data.id }
            - call: "POST /reels/${reel_id}/load"
              payload: { lot_id: "${lot_id}", load_length_ft: 5000, occupancy_start_at: "2026-08-01T00:00:00Z" }
              as: ShippingClerk
              captures: { reel_status_in_response: $.data.status, reel_loaded_in_response: $.data.loaded_length_ft }
            - call: "GET /production-lots/${lot_id}"
              payload: {}
              as: ProcessEngineer
              captures: { process_after_load: $.data.process_state }
            - call: "GET /customer-orders/${ord_id}"
              payload: {}
              as: ShippingClerk
              captures: { ord_v: $.data.version }
            - call: "POST /shipments"
              payload: { order_id: "${ord_id}", lot_id: "${lot_id}", reel_id: "${reel_id}", shipped_length_ft: 5000, ship_date: "2026-08-01", cuts_count: 0, expected_order_version: "${ord_v}" }
              as: ShippingClerk
              captures: { ship_id: $.data.id, deposit_in_response: $.data.deposit_charged_usd }
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: BillingAnalyst
              captures: { deposit_balance_after_ship: $.data.reel_deposit_balance_usd, exposure_after_ship: $.data.credit_exposure_usd, open_ar_after_ship: $.data.open_ar_usd }
            - call: "POST /shipments/${ship_id}/invoice"
              payload: {}
              as: BillingAnalyst
              captures: { invoice_in_response: $.data.invoice_amount_usd, surcharge_in_response: $.data.volatility_surcharge_usd }
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: BillingAnalyst
              captures: { open_ar_after_invoice: $.data.open_ar_usd, exposure_after_invoice: $.data.credit_exposure_usd }
            - call: "GET /customer-orders/${ord_id}"
              payload: {}
              as: BillingAnalyst
              captures: { pricing_after_invoice: $.data.pricing_status, fulfil_after_invoice: $.data.fulfillment_status }
            - call: "GET /reels/${reel_id}"
              payload: {}
              as: ShippingClerk
              captures: { reel_status_after_invoice: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /reels/${reel_id}/returns"
              payload: { shipment_id: "${ship_id}", returned_date: "2026-08-10", condition: "GOOD" }
              as: ShippingClerk
              captures: { ret_id: $.data.id, ret_days_out: $.data.days_out, ret_refund: $.data.refund_usd, ret_variant: $.data.refund_variant_applied }
            - call: "GET /reels/${reel_id}/returns"
              payload: {}
              as: ShippingClerk
              captures: { ret_refund_on_reread: "$.data[0].refund_usd", ret_days_on_reread: "$.data[0].days_out" }
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: BillingAnalyst
              captures: { deposit_balance_after_return: $.data.reel_deposit_balance_usd, memo_after_return: $.data.credit_memo_balance_usd }
            - call: "GET /reels/${reel_id}"
              payload: {}
              as: ShippingClerk
              captures: { reel_status_after_return: $.data.status, reel_cycles_after_return: $.data.cycle_count, reel_loaded_after_return: $.data.loaded_length_ft }
          assert:
            - "computed fields are present in the creating response, not filled in later: ${marking_in_create} == \"UL E12345 12AWG THHN 90C 600V\", ${quoted_in_create} == 106.7800, ${consumed_in_create} == 99.00 and ${trace_in_create} == \"H-77Q-LOT-A\""
            - "the inspection response already carries its own derived window (${insp_next_due_in_response} is null for a PASS) and the parent it advanced is already advanced: ${cert_next_due} == \"2026-09-03\" with ${cert_status} == \"ACTIVE\" on the very next call"
            - "the cross-aggregate ledger is settled before the lot create returns: ${rod_committed_now} == 99.00 and ${rod_remaining_now} == 19901.00 on the immediately following read"
            - "${conc_in_response} == 85.00 and ${conc_on_reread} == 85.00 - the mutating response and the immediate re-read are identical, so no client ever needs to re-fetch to see a computed value"
            - "${hipot_result} == \"PASS\" and ${process_after_tests} == \"TESTED\": the promotion caused by the test is visible on the parent lot in the very next call, even though the test response is a CableTest and cannot show it"
            - "${quality_in_response} == \"CONFORMING\", then ${reel_status_in_response} == \"LOADED\" with ${reel_loaded_in_response} == 5000, and ${process_after_load} == \"PACKAGED\" immediately - the load's effect on the lot needs no settling time"
            - "${deposit_in_response} == 450.00 and the customer ledger already reflects it: ${deposit_balance_after_ship} == 450.00, ${exposure_after_ship} == 450.00 with ${open_ar_after_ship} == 0.00 (a STAGED shipment is a deposit, not a receivable)"
            - "${invoice_in_response} == 544.58 with ${surcharge_in_response} == 10.68, and the receivable is already posted: ${open_ar_after_invoice} == 544.58 and ${exposure_after_invoice} == 994.58"
            - "the invoice's parallel effects are all readable at once: ${pricing_after_invoice} == \"INVOICED\", ${fulfil_after_invoice} == \"FULFILLED\" and ${reel_status_after_invoice} == \"RETURN_PENDING\""
            - "${ret_days_out} == 9 (2026-08-01 occupancy start to the 2026-08-10 return) and the child re-read agrees exactly: ${ret_days_on_reread} == ${ret_days_out} and ${ret_refund_on_reread} == ${ret_refund} with ${ret_variant} naming the applied variant"
            - "the return's ledger hops are also immediate: ${deposit_balance_after_return} == 0.00 and ${memo_after_return} == ${ret_refund} - the credit memo equals exactly the refund the ReelReturn response reported"
            - "${reel_status_after_return} == \"AVAILABLE\" with ${reel_cycles_after_return} == 1 and ${reel_loaded_after_return} == 0: one full reel cycle completed with every intermediate state observable at the instant it was caused"

      - name: list_projections_reflect_a_cascade_at_the_same_instant
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[GET /production-lots]
          - endpoints[GET /rod-purchase-lots]
          - endpoints[GET /customer-orders]
        distinguishing_aspect: "Immediacy has to hold for the derived read paths too, not just for GET-by-id: a single cancel moves the order, compensates the metal ledger and closes a lot that the caller never named, and all three are already visible through filtered list endpoints on the next call - with the list row byte-identical to the single-resource read."
        test_recipe:
          setup:
            - "Order SO-1001 with one QUEUED lot LOT-A (99.00 lbs committed) and no shipments, so the order is cancellable."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /metal-price-quotes"
              payload: { metal: "COPPER", effective_date: "2026-07-30", settlement_price_usd_per_lb: 4.10, source: "COMEX" }
              as: ProcurementBuyer
            - call: "POST /compounds"
              payload: { compound_code: "PVC-90-INS", layer_role: "INSULATION", temp_rating_c: 90, flame_test: "VW_1", max_voltage_v: 600, wet_rated: true, filler_pct: 12.5 }
              as: ProcessEngineer
              captures: { ins_id: $.data.id }
            - call: "POST /compounds/${ins_id}/qualify"
              payload: {}
              as: ProcessEngineer
            - call: "POST /listing-certifications"
              payload: { agency: "UL", file_number: "E12345", product_family_code: "BLDG-WIRE", initial_listing_date: "2026-06-01", inspection_interval_days: 90 }
              as: CertificationOfficer
              captures: { cert_id: $.data.id }
            - call: "POST /listing-certifications/${cert_id}/inspections"
              payload: { inspection_date: "2026-06-05", inspector_code: "INS-7", findings_count: 0, outcome: "PASS" }
              as: CertificationOfficer
            - call: "POST /catalog-products"
              payload: { product_code: "THHN-12-CU", awg_size: "12", conductor_metal: "COPPER", conductor_construction: "STRANDED_7", application_rating: "THHN", voltage_class: "LV_600", temp_rating_c: 90, insulation_thickness_mils: 28.0, conductor_lbs_per_kft: 19.8, insulation_compound_id: "${ins_id}", listing_certification_id: "${cert_id}", base_target_kft: 100.0 }
              as: ProcessEngineer
              captures: { prod_id: $.data.id }
            - call: "POST /catalog-products/${prod_id}/release"
              payload: {}
              as: ProcessEngineer
            - call: "POST /customers"
              payload: { account_code: "ACME", name: "Acme Electric Supply", market_region: "NORTHEAST", credit_limit_usd: 100000.00, pass_through_enabled: true, reel_program: "RETURNABLE" }
              as: BillingAnalyst
              captures: { cust_id: $.data.id }
            - call: "POST /customer-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", order_number: "SO-1001", ordered_kft: 5.000, price_basis: "ORDER_DATE_LOCK", conversion_price_usd_per_kft: 85.00, order_date: "2026-07-30" }
              as: BillingAnalyst
              captures: { ord_id: $.data.id }
            - call: "POST /rod-purchase-lots"
              payload: { metal: "COPPER", supplier_code: "SUP-1", rod_diameter_mm: 8.0, heat_number: "H-77Q", purchase_weight_lbs: 20000.00, purchase_price_usd_per_lb: 4.05, pricing_basis: "SPOT", received_date: "2026-07-25" }
              as: ProcurementBuyer
              captures: { rod_id: $.data.id, rod_v1: $.data.version }
            - call: "POST /production-lots"
              payload: { product_id: "${prod_id}", rod_lot_id: "${rod_id}", order_id: "${ord_id}", lot_code: "LOT-A", planned_length_ft: 5000, line_code: "EXT-1", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z", expected_rod_lot_version: "${rod_v1}" }
              as: ProcessEngineer
              captures: { lot_id: $.data.id }
          trigger:
            - call: "GET /production-lots"
              payload: { process_state: "QUEUED" }
              as: ProcessEngineer
              captures: { queued_before: "$.data[0].lot_code" }
            - call: "GET /rod-purchase-lots"
              payload: { status: "RECEIVED" }
              as: ProcurementBuyer
              captures: { rod_committed_in_list_before: "$.data[0].committed_lbs", rod_remaining_in_list_before: "$.data[0].remaining_lbs" }
            - call: "POST /customer-orders/${ord_id}/cancel"
              payload: { reason: "customer released the job to another mill" }
              as: BillingAnalyst
              captures: { cancel_fulfil: $.data.fulfillment_status, cancel_pricing: $.data.pricing_status }
            - call: "GET /customer-orders"
              payload: { fulfillment_status: "CANCELLED" }
              as: BillingAnalyst
              captures: { cancelled_number_in_list: "$.data[0].order_number" }
            - call: "GET /production-lots"
              payload: { process_state: "SCRAP_CLOSED" }
              as: ProcessEngineer
              captures: { closed_lot_code: "$.data[0].lot_code", closed_lot_quality: "$.data[0].quality_state" }
            - call: "GET /production-lots"
              payload: { process_state: "QUEUED" }
              as: ProcessEngineer
            - call: "GET /production-lots"
              payload: { quality_state: "PENDING", order_id: "${ord_id}" }
              as: ProcessEngineer
              captures: { pending_still_listed: "$.data[0].lot_code" }
            - call: "GET /rod-purchase-lots"
              payload: { status: "RECEIVED" }
              as: ProcurementBuyer
              captures: { rod_committed_in_list_after: "$.data[0].committed_lbs", rod_remaining_in_list_after: "$.data[0].remaining_lbs", rod_scrapped_in_list_after: "$.data[0].scrapped_lbs" }
            - call: "GET /production-lots/${lot_id}"
              payload: {}
              as: ProcessEngineer
              captures: { lot_process_direct: $.data.process_state, lot_quality_direct: $.data.quality_state }
          assert:
            - "before the cancel the filtered views agree with the ledger: ${queued_before} == \"LOT-A\" with total_count == 1, ${rod_committed_in_list_before} == 99.00 and ${rod_remaining_in_list_before} == 19901.00"
            - "the cancel response itself shows the parallel dimensions: ${cancel_fulfil} == \"CANCELLED\" while ${cancel_pricing} == \"QUOTED\" is deliberately left alone"
            - "the order is already reclassified for readers who filter: ${cancelled_number_in_list} == \"SO-1001\" with total_count == 1 on the next call"
            - "the lot the caller never named is already closed: ${closed_lot_code} == \"LOT-A\" with total_count == 1, and the QUEUED filter now returns 0 rows with total_count == 0 in the same instant"
            - "${closed_lot_quality} == \"PENDING\" and ${pending_still_listed} == \"LOT-A\": the compensating close touched only the process dimension, and both list filters see the split correctly"
            - "the compensated metal is back in the available bucket immediately, not after a reconciliation job: ${rod_committed_in_list_after} == 0.00, ${rod_remaining_in_list_after} == 20000.00 and ${rod_scrapped_in_list_after} == 0.00 (a QUEUED lot was never drawn, so nothing is scrap)"
            - "list rows and single reads never diverge: ${lot_process_direct} == \"SCRAP_CLOSED\" equals ${closed_lot_code}'s row state and ${lot_quality_direct} == \"PENDING\" equals ${closed_lot_quality}"
            - "the rod lot is still listed under status RECEIVED with total_count == 1 - the compensation restores mass without touching the rod lot's state machine"
