        grounds:
          - state_machines.ArtworkVersion.DRAFT_to_ELEMENTS_VERIFIED
          - state_machines.ArtworkVersion.ELEMENTS_VERIFIED_to_IN_REVIEW
          - validations[priority=24]
          - errors[ERR_VERSION_STATE_INVALID]
          - endpoints[POST /artwork-versions/{id}/revise]
          - endpoints[POST /artwork-versions/{id}/release-to-print]
          - endpoints[POST /printer-proofs]
          - endpoints[PATCH /artwork-versions/{id}]
        distinguishing_aspect: |
          Priority 24 is one validation covering eight different admissible-state sets,
          so it is only correct if it is keyed on (operation, state) rather than on
          state alone. The walk drives one version DRAFT -> ELEMENTS_VERIFIED ->
          IN_REVIEW and, at each stop, fires triggers the current row does not list:
          revise and release from DRAFT, revise and proof creation from
          ELEMENTS_VERIFIED, PATCH and a second submit from IN_REVIEW. An
          implementation with a single global allow-list either lets one of these
          through or blocks the two legitimate advances.
