          assert:
            - "HTTP 200, response_type == array, meta.total_count == 1"
            - "the element's participation_id == ${part_id} and check_kind == TIMING"

      # --- computed read: panelist health ---
      - name: panelist_health_read_returns_both_variants
        claim_type: Computed read
        grounds:
          - calculations.panel_health_score
          - endpoints
        distinguishing_aspect: "GET /panelists/{id}/health returns the inline schema { health_score, lifetime_health_score, status }; for a brand-new panelist with no participations both scores are 100 and status ACTIVE."
        test_recipe:
          setup: ["A freshly registered panelist with no participations."]
