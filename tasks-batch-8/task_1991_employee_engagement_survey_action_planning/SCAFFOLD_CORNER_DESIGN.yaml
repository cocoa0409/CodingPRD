scaffold_corner_design:
  # ==========================================================================
  # Section: entities
  # ==========================================================================
  - section: entities
    instances:
      - name: org_unit_creation_applies_threshold_defaults
        claim_type: defaults
        grounds: [entities.OrgUnit.fields.min_n_threshold, entities.OrgUnit.fields.verbatim_n_threshold]
        distinguishing_aspect: "Creating an OrgUnit without thresholds applies min_n_threshold=5 and verbatim_n_threshold=10 (defaults), and both are echoed in the response."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /engagement/org-units"
              payload: { name: "Defaults Unit", manager_user_id: "mgr-def" }
              as: HRAdmin
              captures: { du_id: $.data.id, du_minn: $.data.min_n_threshold, du_vn: $.data.verbatim_n_threshold }
          trigger:
            - call: "GET /engagement/org-units/${du_id}"
              payload: {}
              as: HRAdmin
              captures: { du_get_minn: $.data.min_n_threshold }
          assert:
            - "du_minn == 5 and du_vn == 10 (creation-time defaults)"
            - "du_get_minn == 5 (persisted)"
      - name: employee_missing_required_hired_at_rejected
        claim_type: required_fields
        grounds: [entities.Employee.fields.hired_at, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required hired_at on POST /employees yields ERR_VALIDATION 400; no row is created."
        test_recipe:
          setup: ["one OrgUnit exists"]
          setup_api_calls:
            - call: "POST /engagement/org-units"
              payload: { name: "ReqUnit", manager_user_id: "mgr-rq" }
              as: HRAdmin
              captures: { rq_unit: $.data.id }
          trigger:
            - call: "POST /engagement/employees"
              payload: { external_ref: "RQ01", unit_id: "${rq_unit}", employment_status: "ACTIVE" }
              as: HRAdmin
              captures: { rq_err: $.data.error_id }
          assert:
            - "rq_err == ERR_VALIDATION (missing required hired_at)"
      - name: survey_item_weight_out_of_range_rejected
        claim_type: type_constraints
        grounds: [entities.SurveyItem.fields.weight, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "weight=6.0 exceeds the 0.1..5.0 range -> ERR_VALIDATION; boundary weight=5.0 accepted."
        test_recipe:
          setup: ["a DRAFT ItemBank exists"]
          setup_api_calls:
            - call: "POST /engagement/item-banks"
              payload: { name: "Weight Bank", framework: "CUSTOM" }
              as: HRAdmin
              captures: { wb_id: $.data.id }
          trigger:
            - call: "POST /engagement/item-banks/${wb_id}/items"
              payload: { item_code: "W-BAD", dimension: "PURPOSE", weight: 6.0 }
              as: HRAdmin
              captures: { wb_err: $.data.error_id }
            - call: "POST /engagement/item-banks/${wb_id}/items"
              payload: { item_code: "W-MAX", dimension: "PURPOSE", weight: 5.0 }
              as: HRAdmin
              captures: { wb_ok: $.data.id }
          assert:
            - "wb_err == ERR_VALIDATION (6.0 > 5.0 upper bound)"
            - "wb_ok is non-null (5.0 accepted at the inclusive boundary)"
      - name: computed_cycle_counters_input_ignored
        claim_type: computed_fields
        grounds: [entities.SurveyCycle.fields.invited_count, entities.SurveyCycle.fields.response_rate]
        distinguishing_aspect: "Client-supplied invited_count/response_rate on cycle creation are ignored; server computes invited_count=0 and response_rate=null before open."
        test_recipe:
          setup: ["an ACTIVE bank with 3 items"]
          setup_api_calls:
            - call: "POST /engagement/item-banks"
              payload: { name: "Computed Bank", framework: "CUSTOM" }
              as: HRAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /engagement/item-banks/${cb_id}/items"
              payload: { item_code: "CB-1", dimension: "PURPOSE", weight: 1.0 }
              as: HRAdmin
            - call: "POST /engagement/item-banks/${cb_id}/items"
              payload: { item_code: "CB-2", dimension: "PURPOSE", weight: 1.0 }
              as: HRAdmin
            - call: "POST /engagement/item-banks/${cb_id}/items"
              payload: { item_code: "CB-3", dimension: "PURPOSE", weight: 1.0 }
              as: HRAdmin
            - call: "POST /engagement/item-banks/${cb_id}/activate"
              payload: {}
              as: HRAdmin
          trigger:
            - call: "POST /engagement/survey-cycles"
              payload: { label: "Computed Cycle", cycle_kind: "CENSUS", bank_id: "${cb_id}", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", invited_count: 999, response_rate: 0.99 }
              as: HRAdmin
              captures: { cc_id: $.data.id, cc_inv: $.data.invited_count, cc_rate: $.data.response_rate }
          assert:
            - "cc_inv == 0 (client-sent 999 ignored; derived field starts at 0)"
            - "cc_rate == null (client-sent 0.99 ignored; no invites yet)"
      - name: get_nonexistent_cycle_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but absent cycle id returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /engagement/survey-cycles/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: HRAdmin
              captures: { nf_err: $.data.error_id }
          assert:
            - "nf_err == ERR_NOT_FOUND"
      - name: system_fields_input_ignored_on_create
        claim_type: system_fields
        grounds: [entities.ItemBank.fields.name]
        distinguishing_aspect: "Client-sent id/created_at/version in the create body are ignored; server mints id (UUID), created_at (ISO8601 with 3 fractional digits), version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /engagement/item-banks"
              payload: { name: "SysFields", framework: "EWI", id: "client-forged", created_at: "1999-01-01T00:00:00Z", version: 42 }
              as: HRAdmin
              captures: { sf_id: $.data.id, sf_v: $.data.version }
          assert:
            - "sf_id != 'client-forged' (server mints UUID)"
            - "sf_v == 1 (initial version, client-sent 42 ignored)"
  # ==========================================================================
  # Section: state_machines
  # ==========================================================================
  - section: state_machines
    instances:
      - name: cycle_starts_in_draft_initial_state
        claim_type: initial_state
        grounds: [state_machines.SurveyCycle]
        distinguishing_aspect: "A newly created SurveyCycle has status DRAFT and version 1 before any transition."
        test_recipe:
          setup: ["ACTIVE bank with 3 items"]
          setup_api_calls:
            - call: "POST /engagement/item-banks"
              payload: { name: "Init Bank", framework: "EWI" }
              as: HRAdmin
              captures: { ib_id: $.data.id }
            - call: "POST /engagement/item-banks/${ib_id}/items"
              payload: { item_code: "IB-1", dimension: "PURPOSE", weight: 1.0 }
              as: HRAdmin
            - call: "POST /engagement/item-banks/${ib_id}/items"
              payload: { item_code: "IB-2", dimension: "PURPOSE", weight: 1.0 }
              as: HRAdmin
            - call: "POST /engagement/item-banks/${ib_id}/items"
              payload: { item_code: "IB-3", dimension: "PURPOSE", weight: 1.0 }
              as: HRAdmin
            - call: "POST /engagement/item-banks/${ib_id}/activate"
              payload: {}
              as: HRAdmin
          trigger:
            - call: "POST /engagement/survey-cycles"
              payload: { label: "Init Cycle", cycle_kind: "CENSUS", bank_id: "${ib_id}", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-15T00:00:00Z" }
              as: HRAdmin
              captures: { ic_status: $.data.status, ic_v: $.data.version }
          assert:
            - "ic_status == DRAFT"
            - "ic_v == 1"
      - name: archived_cycle_is_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.SurveyCycle, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From ARCHIVED, every further transition (configure, open, close, score, publish, archive) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "A census cycle driven DRAFT->CONFIGURED->OPEN->CLOSED->SCORING->REPORTED->ARCHIVED with 3 submitting employees"
          setup_api_calls:
            - call: "POST /engagement/item-banks"
              payload: { name: "Term Bank", framework: "CUSTOM" }
              as: HRAdmin
              captures: { tb_id: $.data.id }
            - call: "POST /engagement/item-banks/${tb_id}/items"
              payload: { item_code: "TB-1", dimension: "GROWTH", weight: 1.0 }
              as: HRAdmin
              captures: { tb_i1: $.data.id }
            - call: "POST /engagement/item-banks/${tb_id}/items"
              payload: { item_code: "TB-2", dimension: "GROWTH", weight: 1.0 }
              as: HRAdmin
              captures: { tb_i2: $.data.id }
            - call: "POST /engagement/item-banks/${tb_id}/items"
              payload: { item_code: "TB-3", dimension: "GROWTH", weight: 1.0 }
              as: HRAdmin
              captures: { tb_i3: $.data.id }
            - call: "POST /engagement/item-banks/${tb_id}/activate"
              payload: {}
              as: HRAdmin
            - call: "POST /engagement/org-units"
              payload: { name: "TermUnit", manager_user_id: "mgr-t", min_n_threshold: 3, verbatim_n_threshold: 5 }
              as: HRAdmin
              captures: { tb_unit: $.data.id }
            - call: "POST /engagement/employees"
              payload: { external_ref: "T001", unit_id: "${tb_unit}", employment_status: "ACTIVE", hired_at: "2026-01-01T00:00:00Z" }
              as: HRAdmin
            - call: "POST /engagement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HRAdmin
            - call: "POST /engagement/survey-cycles"
              payload: { label: "Term Cycle", cycle_kind: "CENSUS", bank_id: "${tb_id}", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", min_n_default: 3 }
              as: HRAdmin
              captures: { tb_cyc: $.data.id }
            - call: "POST /engagement/survey-cycles/${tb_cyc}/items"
              payload: { item_id: "${tb_i1}", pinned_weight: 1.0, display_order: 1 }
              as: HRAdmin
            - call: "POST /engagement/survey-cycles/${tb_cyc}/items"
              payload: { item_id: "${tb_i2}", pinned_weight: 1.0, display_order: 2 }
              as: HRAdmin
            - call: "POST /engagement/survey-cycles/${tb_cyc}/items"
              payload: { item_id: "${tb_i3}", pinned_weight: 1.0, display_order: 3 }
              as: HRAdmin
            - call: "GET /engagement/survey-cycles/${tb_cyc}"
              payload: {}
              as: HRAdmin
              captures: { tb_cyc_v: $.data.version }
            - call: "POST /engagement/survey-cycles/${tb_cyc}/configure"
              payload: { expected_cycle_version: "${tb_cyc_v}" }
              as: HRAdmin
            - call: "POST /engagement/survey-cycles/${tb_cyc}/open"
              payload: {}
              as: HRAdmin
            - call: "POST /engagement/survey-cycles/${tb_cyc}/close"
              payload: {}
              as: HRAdmin
            - call: "POST /engagement/survey-cycles/${tb_cyc}/score"
              payload: {}
              as: PeopleAnalyst
            - call: "POST /engagement/survey-cycles/${tb_cyc}/publish"
              payload: {}
              as: HRAdmin
            - call: "POST /engagement/survey-cycles/${tb_cyc}/archive"
              payload: {}
              as: HRAdmin
          trigger:
            - call: "POST /engagement/survey-cycles/${tb_cyc}/open"
              payload: {}
              as: HRAdmin
              captures: { tb_err_open: $.data.error_id }
            - call: "POST /engagement/survey-cycles/${tb_cyc}/archive"
              payload: {}
              as: HRAdmin
              captures: { tb_err_arch: $.data.error_id }
          assert:
            - "tb_err_open == ERR_INVALID_STATE (ARCHIVED is terminal)"
            - "tb_err_arch == ERR_INVALID_STATE (re-archive also rejected)"
      - name: submitted_invite_rejects_second_submit
        claim_type: invalid_transition
        grounds: [state_machines.SurveyInvite, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Submitting a second time on an already-SUBMITTED invite (terminal) returns ERR_INVALID_STATE; the response row is not replaced."
        test_recipe:
          setup: ["OPEN census cycle; Unit with 1 ACTIVE employee who has already submitted fully"]
          setup_api_calls:
            - call: "POST /engagement/item-banks"
              payload: { name: "Twice Bank", framework: "CUSTOM" }
              as: HRAdmin
              captures: { tw_bank: $.data.id }
            - call: "POST /engagement/item-banks/${tw_bank}/items"
              payload: { item_code: "TW-1", dimension: "PURPOSE", weight: 1.0 }
              as: HRAdmin
              captures: { tw_i1: $.data.id }
            - call: "POST /engagement/item-banks/${tw_bank}/items"
              payload: { item_code: "TW-2", dimension: "PURPOSE", weight: 1.0 }
              as: HRAdmin
              captures: { tw_i2: $.data.id }
            - call: "POST /engagement/item-banks/${tw_bank}/items"
              payload: { item_code: "TW-3", dimension: "PURPOSE", weight: 1.0 }
              as: HRAdmin
              captures: { tw_i3: $.data.id }
            - call: "POST /engagement/item-banks/${tw_bank}/activate"
              payload: {}
              as: HRAdmin
            - call: "POST /engagement/org-units"
              payload: { name: "TwiceUnit", manager_user_id: "mgr-tw" }
              as: HRAdmin
              captures: { tw_unit: $.data.id }
            - call: "POST /engagement/employees"
              payload: { external_ref: "TW01", unit_id: "${tw_unit}", employment_status: "ACTIVE", hired_at: "2026-01-01T00:00:00Z" }
              as: HRAdmin
              captures: { tw_e1: $.data.id }
            - call: "POST /engagement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HRAdmin
            - call: "POST /engagement/survey-cycles"
              payload: { label: "Twice Census", cycle_kind: "CENSUS", bank_id: "${tw_bank}", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-15T00:00:00Z" }
              as: HRAdmin
              captures: { tw_cyc: $.data.id }
            - call: "POST /engagement/survey-cycles/${tw_cyc}/items"
              payload: { item_id: "${tw_i1}", pinned_weight: 1.0, display_order: 1 }
              as: HRAdmin
            - call: "POST /engagement/survey-cycles/${tw_cyc}/items"
              payload: { item_id: "${tw_i2}", pinned_weight: 1.0, display_order: 2 }
              as: HRAdmin
            - call: "POST /engagement/survey-cycles/${tw_cyc}/items"
              payload: { item_id: "${tw_i3}", pinned_weight: 1.0, display_order: 3 }
              as: HRAdmin
            - call: "GET /engagement/survey-cycles/${tw_cyc}"
              payload: {}
              as: HRAdmin
              captures: { tw_cyc_v: $.data.version }
            - call: "POST /engagement/survey-cycles/${tw_cyc}/configure"
              payload: { expected_cycle_version: "${tw_cyc_v}" }
              as: HRAdmin
            - call: "POST /engagement/survey-cycles/${tw_cyc}/open"
              payload: {}
              as: HRAdmin
            - call: "GET /engagement/survey-invites"
              payload: { cycle_id: "${tw_cyc}", employee_id: "${tw_e1}" }
              as: PeopleAnalyst
              captures: { tw_inv: "$.data[0].id" }
            - call: "POST /engagement/survey-invites/${tw_inv}/submit"
              payload: { answers: [ { cycle_item_id: "${tw_i1}", score: 3 }, { cycle_item_id: "${tw_i2}", score: 3 }, { cycle_item_id: "${tw_i3}", score: 3 } ] }
              as: EmployeeRole
              as_user_id: "${tw_e1}"
          trigger:
            - call: "POST /engagement/survey-invites/${tw_inv}/submit"
              payload: { answers: [ { cycle_item_id: "${tw_i1}", score: 5 }, { cycle_item_id: "${tw_i2}", score: 5 }, { cycle_item_id: "${tw_i3}", score: 5 } ] }
              as: EmployeeRole
              as_user_id: "${tw_e1}"
              captures: { tw_err: $.data.error_id }
            - call: "GET /engagement/survey-invites/${tw_inv}/response"
              payload: {}
              as: EmployeeRole
              as_user_id: "${tw_e1}"
              captures: { tw_resp_answers: "$.data[0].answers" }
          assert:
            - "tw_err == ERR_INVALID_STATE (SUBMITTED is terminal for submit)"
            - "tw_resp_answers retain the ORIGINAL scores (3,3,3) — the rejected resubmission did not overwrite"
  # ==========================================================================
  # Section: calculations
  # ==========================================================================
  - section: calculations
    instances:
      - name: benchmark_percentile_with_ties
        claim_type: correct_result
        grounds: [calculations.benchmark_percentile]
        distinguishing_aspect: "Percentile uses (below + 0.5*ties)/N: a snapshot score equal to exactly one benchmark entry lands halfway for the tie; score 72.22 vs dist [55,60,62,65,68,70,72,75,78,80] has 7 below, 0 ties -> 70.00."
        test_recipe:
          setup:
            - "Census cycle; Unit with 3 ACTIVE employees all answering (5,4,3) on weights 1.5/1.0/2.0 -> overall 72.22"
            - "ACTIVE BenchmarkSet with dimension_scores [55,60,62,65,68,70,72,75,78,80]"
          setup_api_calls:
            - call: "POST /engagement/item-banks"
              payload: { name: "Pct Bank", framework: "EWI" }
              as: HRAdmin
              captures: { pc_bank: $.data.id }
            - call: "POST /engagement/item-banks/${pc_bank}/items"
              payload: { item_code: "PC-1", dimension: "PURPOSE", weight: 1.5 }
              as: HRAdmin
              captures: { pc_i1: $.data.id }
            - call: "POST /engagement/item-banks/${pc_bank}/items"
              payload: { item_code: "PC-2", dimension: "GROWTH", weight: 1.0 }
              as: HRAdmin
              captures: { pc_i2: $.data.id }
            - call: "POST /engagement/item-banks/${pc_bank}/items"
              payload: { item_code: "PC-3", dimension: "PURPOSE", weight: 2.0 }
              as: HRAdmin
              captures: { pc_i3: $.data.id }
            - call: "POST /engagement/item-banks/${pc_bank}/activate"
              payload: {}
              as: HRAdmin
            - call: "POST /engagement/benchmark-sets"
              payload: { name: "Tech 2026", dimension_scores: [55, 60, 62, 65, 68, 70, 72, 75, 78, 80] }
              as: PeopleAnalyst
              captures: { pc_bench: $.data.id }
            - call: "POST /engagement/org-units"
              payload: { name: "PctUnit", manager_user_id: "mgr-pc", min_n_threshold: 3, verbatim_n_threshold: 5 }
              as: HRAdmin
              captures: { pc_unit: $.data.id }
            - call: "POST /engagement/employees"
              payload: { external_ref: "PC01", unit_id: "${pc_unit}", employment_status: "ACTIVE", hired_at: "2026-01-01T00:00:00Z" }
              as: HRAdmin
              captures: { pc_e1: $.data.id }
            - call: "POST /engagement/employees"
              payload: { external_ref: "PC02", unit_id: "${pc_unit}", employment_status: "ACTIVE", hired_at: "2026-01-01T00:00:00Z" }
              as: HRAdmin
              captures: { pc_e2: $.data.id }
            - call: "POST /engagement/employees"
              payload: { external_ref: "PC03", unit_id: "${pc_unit}", employment_status: "ACTIVE", hired_at: "2026-01-01T00:00:00Z" }
              as: HRAdmin
              captures: { pc_e3: $.data.id }
            - call: "POST /engagement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HRAdmin
            - call: "POST /engagement/survey-cycles"
              payload: { label: "Pct Census", cycle_kind: "CENSUS", bank_id: "${pc_bank}", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", min_n_default: 3 }
              as: HRAdmin
              captures: { pc_cyc: $.data.id }
            - call: "POST /engagement/survey-cycles/${pc_cyc}/items"
              payload: { item_id: "${pc_i1}", pinned_weight: 1.5, display_order: 1 }
              as: HRAdmin
            - call: "POST /engagement/survey-cycles/${pc_cyc}/items"
              payload: { item_id: "${pc_i2}", pinned_weight: 1.0, display_order: 2 }
              as: HRAdmin
            - call: "POST /engagement/survey-cycles/${pc_cyc}/items"
              payload: { item_id: "${pc_i3}", pinned_weight: 2.0, display_order: 3 }
              as: HRAdmin
            - call: "GET /engagement/survey-cycles/${pc_cyc}"
              payload: {}
              as: HRAdmin
              captures: { pc_cyc_v: $.data.version }
            - call: "POST /engagement/survey-cycles/${pc_cyc}/configure"
              payload: { expected_cycle_version: "${pc_cyc_v}" }
              as: HRAdmin
            - call: "POST /engagement/survey-cycles/${pc_cyc}/open"
              payload: {}
              as: HRAdmin
            - call: "GET /engagement/survey-invites"
              payload: { cycle_id: "${pc_cyc}", employee_id: "${pc_e1}" }
              as: PeopleAnalyst
              captures: { pc_inv1: "$.data[0].id" }
            - call: "GET /engagement/survey-invites"
              payload: { cycle_id: "${pc_cyc}", employee_id: "${pc_e2}" }
              as: PeopleAnalyst
              captures: { pc_inv2: "$.data[0].id" }
            - call: "GET /engagement/survey-invites"
              payload: { cycle_id: "${pc_cyc}", employee_id: "${pc_e3}" }
              as: PeopleAnalyst
              captures: { pc_inv3: "$.data[0].id" }
            - call: "POST /engagement/survey-invites/${pc_inv1}/submit"
              payload: { answers: [ { cycle_item_id: "${pc_i1}", score: 5 }, { cycle_item_id: "${pc_i2}", score: 4 }, { cycle_item_id: "${pc_i3}", score: 3 } ] }
              as: EmployeeRole
              as_user_id: "${pc_e1}"
            - call: "POST /engagement/survey-invites/${pc_inv2}/submit"
              payload: { answers: [ { cycle_item_id: "${pc_i1}", score: 5 }, { cycle_item_id: "${pc_i2}", score: 4 }, { cycle_item_id: "${pc_i3}", score: 3 } ] }
              as: EmployeeRole
              as_user_id: "${pc_e2}"
            - call: "POST /engagement/survey-invites/${pc_inv3}/submit"
              payload: { answers: [ { cycle_item_id: "${pc_i1}", score: 5 }, { cycle_item_id: "${pc_i2}", score: 4 }, { cycle_item_id: "${pc_i3}", score: 3 } ] }
              as: EmployeeRole
              as_user_id: "${pc_e3}"
            - call: "POST /engagement/survey-cycles/${pc_cyc}/close"
              payload: {}
              as: HRAdmin
            - call: "POST /engagement/survey-cycles/${pc_cyc}/score"
              payload: {}
              as: PeopleAnalyst
          trigger:
            - call: "GET /engagement/report-snapshots"
              payload: { cycle_id: "${pc_cyc}", unit_id: "${pc_unit}", scope: "DIRECT" }
              as: PeopleAnalyst
              captures: { pc_overall: "$.data[0].overall_score", pc_pct: "$.data[0].benchmark_percentile" }
          assert:
            - "pc_overall == 72.22"
            - "pc_pct == 70.00 (7 entries strictly below 72.22, 0 ties: (7 + 0)/10 * 100)"
      - name: pulse_sampling_floor_truncates
        claim_type: correct_result
        grounds: [calculations.eligibility_sampling]
        distinguishing_aspect: "floor(9 eligible * 0.50) = 4 invites (not 5, not round-half); eligibility also excludes a TERMINATED employee and one hired within the 30-day tenure gate."
        test_recipe:
          setup:
