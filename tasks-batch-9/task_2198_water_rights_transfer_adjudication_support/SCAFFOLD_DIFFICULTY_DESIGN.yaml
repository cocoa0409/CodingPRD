              as: Claimant
              as_user_id: "${claimant_b_id}"
              captures: {protest_b_id: id}
            - call: POST /protests
              payload: {transfer_application_id: "${app_id}", protestant_claimant_id: "${claimant_c_id}", claimed_injury_af: 9.00, basis: PUBLIC_INTEREST}
              as: Claimant
              as_user_id: "${claimant_c_id}"
              captures: {protest_c_id: id}
            - call: POST /protests/${protest_b_id}/route
              payload: {track: NEGOTIATION}
              as: HearingOfficer
            - call: POST /protests/${protest_c_id}/route
              payload: {track: NEGOTIATION}
              as: HearingOfficer
            - call: POST /protests/${protest_b_id}/resolve
              payload: {outcome: STIPULATE, resolution_note: "B settles at 5 af", stipulated_offset_af: 5.00}
              as: HearingOfficer
              as_user_id: u-hearing-1
          trigger: >-
            POST /protests/${protest_c_id}/resolve as HearingOfficer with
            X-User-ID u-hearing-1 and {outcome: STIPULATE, resolution_note: "C
            settles at 7.50 af", stipulated_offset_af: 7.50}.
          assert: |
            Intermediate state after the FIRST resolution (no cascade yet):
              app.status == UNDER_PROTEST, unresolved_protest_count == 1
              analysis.status == DRAFT, offset_af == 5.00,
                gross_depletion_af == 46.80, net_injury_af == 41.80
              WaterRight.pending_review_count == 1
            After the trigger (200):
              link 1 — Protest C: status == RESOLVED_STIPULATED,
                       stipulated_offset_af == 7.50;
                       app.unresolved_protest_count == 0
              link 2 — app.status == READY_FOR_DECISION (fires even though the
                       logical clock 2026-03-05 is well before protest_deadline
                       2026-03-31)
              link 3 — analysis.status == FINALIZED with offset_af == 12.50
                       (5.00 + 7.50, both NEGOTIATION-track) and
                       net_injury_af == 34.30 (46.80 - 12.50)
              link 4 — WaterRight.pending_review_count == 0
            The right's ledger is unchanged by the cascade: encumbered_af
            60.00, transferred_away_af 0.00, transferable_af 135.00,
            status ENCUMBERED.
            Because u-hearing-1 resolved both protests, priority 23 now bars
            that user from deciding the application — the cascade also
            constrains who may act next.
  # ---------------------------------------------------------------------------
  # RULE 5 — priority_pair_validation_conflict  (three different category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: protest_deadline_beats_duplicate_protest
        grounds: validations[priority=32]
        distinguishing_aspect: >-
          A single POST /protests violates BOTH priority 32
          (business_temporal — the clock sits exactly ON protest_deadline, which
          is already late) and priority 39 (business_constraint — this
          protestant already has a protest on this application). The response
          must be 422 ERR_PROTEST_WINDOW_CLOSED, never 409 ERR_DUPLICATE_PROTEST,
          and the paired control call one second earlier returns exactly the
          other error, proving both rules are live and that only the ordering
          decides.
        test_recipe:
          setup: >-
            Pin the clock at 2026-03-01, build the BASE RIGHT for claimant A and
            a protestant claimant B, drive a 40.00 af CHANGE_OF_USE application
            to PROTEST_PERIOD (protest_deadline stamped
            2026-03-31T00:00:00Z), then at 2026-03-05 have B file its one
            allowed protest (the application moves to UNDER_PROTEST, which is
            still a legal from-state for POST /protests). Set the clock to
            2026-03-30T23:59:59Z for the control call, then to exactly
            2026-03-31T00:00:00Z for the trigger.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: {current_utc: "2026-03-01T00:00:00Z"}
              as: WaterRightsAnalyst
            - call: POST /claimants
              payload: {legal_name: "Alder Creek Ranch", contact_email: "a@example.test", entity_type: INDIVIDUAL}
