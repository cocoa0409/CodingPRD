# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Reverse Mortgage / HECM Servicing (HUD/FHA)
# 9 rule_ids x 2 instances = 18 instances. Every numeric assert is a literal
# pre-computed against §1.3 formulas + constants.
#
# Shared origination pattern referenced below ("LOC base loan"):
#   POST /lenders {name, hud_lending_limit_cents:80000000}              -> lender_id
#   POST /principal-limit-factors {lender_id, age:75, expected_rate_bps:500, factor_micros:523000}
#   POST /loans/_clock/set {lender_id, to_iso8601:"2024-01-01T00:00:00.000Z"}
#   POST /borrowers {lender_id, full_name, birthdate:"1948-06-01"}      -> borrower_id (age 75 at 2024-01-01)
#   POST /loans {lender_id, borrower_id, appraised_value_cents:30000000, expected_rate_bps:500,
#                draw_type:"LINE_OF_CREDIT", initial_financed_costs_cents:1000000} -> loan_id
#   POST /loans/{loan_id}/originate
#     => gross_principal_limit_cents=15690000, net_principal_limit_cents=14690000,
#        available_line_of_credit_cents=14690000, principal_balance_cents=1000000
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: balance_accrual_compound_vs_payoff_quote_projection
        grounds:
          - calculations.balance_accrual
          - calculations.balance_accrual.variants.payoff_quote_projection
          - entities.Loan.fields.principal_balance_cents
          - endpoints["POST /loans/{loanId}/post-accrual"]
          - endpoints["GET /loans/{loanId}/payoff-quote"]
        distinguishing_aspect: |
          Same Loan, same 36 months, same rates: round-per-month-per-component accrual posting
          yields principal_balance_cents=6118831 while the forward-looking single-compound payoff
          quote yields projected_balance_cents=6118828 — a 3-cent divergence on the Loan domain.
        test_recipe:
          setup:
            - "Lender + PLF(age75,500bps)=523000; clock 2024-01-01; borrower age 75."
            - "LINE_OF_CREDIT loan with initial_financed_costs_cents=5000000, expected_rate_bps=625, annual_mip_rate_bps=50; originated => principal_balance_cents=5000000."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Servicer One", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 625, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Ada Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 625, draw_type: "LINE_OF_CREDIT", annual_mip_rate_bps: 50, initial_financed_costs_cents: 5000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
          trigger:
            - call: "GET /loans/${loan_id}/payoff-quote"
              payload: { number_of_months: 36 }
              as: ServicerOps
              captures: { quote_balance: $.data.projected_balance_cents }
            - call: "POST /loans/${loan_id}/post-accrual"
              payload: { number_of_months: 36 }
              as: ServicerOps
              captures: { posted_balance: $.data.principal_balance_cents }
          assert:
            - "GET payoff-quote projected_balance_cents == 6118828"
            - "POST post-accrual Loan.principal_balance_cents == 6118831"
            - "Loan.principal_balance_cents (6118831) != quote projected_balance_cents (6118828)"
            - "Loan.months_elapsed == 36"

      - name: lesa_fully_funded_vs_partially_funded_sizing
        grounds:
          - calculations.lesa_sizing
          - calculations.lesa_sizing.variants.fully_funded
          - calculations.lesa_sizing.variants.partially_funded
          - entities.LesaSetAside.fields.initial_amount_cents
          - endpoints["POST /lesa-set-asides"]
          - endpoints["POST /loans/{loanId}/originate"]
        distinguishing_aspect: |
          Same annual_property_charge_cents=600000 and life_expectancy_years=10 on the LesaSetAside
          domain: FULLY_FUNDED sizes initial_amount_cents=6000000 whereas PARTIALLY_FUNDED sizes it
          to 3000000 (half-horizon semi-annual model) — divergent results on a different entity than
          the accrual dual-variant.
        test_recipe:
          setup:
            - "Two LINE_OF_CREDIT loans under one lender, each with a LESA before origination."
            - "Loan F gets FULLY_FUNDED LESA; loan P gets PARTIALLY_FUNDED LESA; identical charge inputs."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Servicer LESA", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Ben Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LINE_OF_CREDIT", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_f_id: $.data.id }
            - call: "POST /lesa-set-asides"
              payload: { loan_id: "${loan_f_id}", funding_mode: "FULLY_FUNDED", annual_property_charge_cents: 600000, life_expectancy_years: 10 }
              as: ServicerOps
              captures: { lesa_f_id: $.data.id }
            - call: "POST /loans/${loan_f_id}/originate"
              payload: {}
              as: ServicerOps
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LINE_OF_CREDIT", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_p_id: $.data.id }
            - call: "POST /lesa-set-asides"
              payload: { loan_id: "${loan_p_id}", funding_mode: "PARTIALLY_FUNDED", annual_property_charge_cents: 600000, life_expectancy_years: 10 }
              as: ServicerOps
              captures: { lesa_p_id: $.data.id }
            - call: "POST /loans/${loan_p_id}/originate"
              payload: {}
              as: ServicerOps
          trigger:
            - call: "GET /lesa-set-asides/${lesa_f_id}"
              payload: {}
              as: ServicerOps
              captures: { f_amount: $.data.initial_amount_cents }
            - call: "GET /lesa-set-asides/${lesa_p_id}"
              payload: {}
              as: ServicerOps
              captures: { p_amount: $.data.initial_amount_cents }
          assert:
            - "LesaSetAside.${lesa_f_id}.initial_amount_cents == 6000000"
            - "LesaSetAside.${lesa_p_id}.initial_amount_cents == 3000000"
            - "Loan.${loan_f_id}.lesa_set_aside_cents == 6000000"
            - "Loan.${loan_p_id}.lesa_set_aside_cents == 3000000"
            - "Loan.${loan_f_id}.net_principal_limit_cents == 8690000"
            - "Loan.${loan_p_id}.net_principal_limit_cents == 11690000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: principal_limit_nested_minmax_with_tiered_plf
        grounds:
          - calculations.principal_limit
          - entities.Loan.fields.max_claim_amount_cents
          - entities.Loan.fields.gross_principal_limit_cents
          - endpoints["POST /loans/{loanId}/originate"]
        distinguishing_aspect: |
          MODE (a): >=3 inputs with non-linear interaction — max_claim = min(appraised_value,
          hud_lending_limit) feeds a tiered PLF selection keyed on (age,expected_rate_bps); with
          appraised 30000000 < hud 80000000 and PLF 523000, gross = round_half_up(30000000*523000/1e6)
          = 15690000.
        test_recipe:
          setup:
            - "Lender hud_lending_limit_cents=80000000; PLF(age75,500bps)=523000; clock 2024-01-01; borrower age 75."
            - "LINE_OF_CREDIT loan appraised 30000000, expected_rate_bps 500, initial_financed_costs 1000000."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Servicer PL", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Cara Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LINE_OF_CREDIT", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
          trigger:
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
          assert:
            - "Loan.${loan_id}.max_claim_amount_cents == 30000000"
            - "Loan.${loan_id}.principal_limit_factor_micros == 523000"
            - "Loan.${loan_id}.gross_principal_limit_cents == 15690000"
            - "Loan.${loan_id}.net_principal_limit_cents == 14690000"

      - name: mip_interest_accrual_round_per_month_order_pinned
        grounds:
          - calculations.balance_accrual
          - entities.Loan.fields.principal_balance_cents
          - entities.LedgerEntry.fields.entry_type
          - endpoints["POST /loans/{loanId}/post-accrual"]
        distinguishing_aspect: |
          MODE (b): nested rounding where order matters — interest_component and mip_component are each
          round_half_up to whole cents PER MONTH before being added to principal_balance, and that
          rounded balance is the next month's base. Posting 12 months on a 5000000 balance at
          (500+50)bps yields exactly 5282040 (round-per-month), distinct from sum-then-round.
        test_recipe:
          setup:
            - "LINE_OF_CREDIT loan, initial_financed_costs 5000000, expected_rate_bps 500, annual_mip_rate_bps 50; originated => principal_balance_cents=5000000, months_elapsed=0."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Servicer MIP", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Dan Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LINE_OF_CREDIT", annual_mip_rate_bps: 50, initial_financed_costs_cents: 5000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
          trigger:
            - call: "POST /loans/${loan_id}/post-accrual"
              payload: { number_of_months: 12 }
              as: ServicerOps
          assert:
            - "Loan.${loan_id}.principal_balance_cents == 5282040"
            - "Loan.${loan_id}.months_elapsed == 12"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: loan_parallel_axes_servicing_vs_disposition_independent
        grounds:
          - state_machines.Loan
          - entities.Loan.fields.servicing_status
          - entities.Loan.fields.disposition_status
          - endpoints["POST /occupancy-certifications/{certId}/mark-delinquent"]
          - endpoints["POST /maturity-events"]
        distinguishing_aspect: |
          Loan carries two INDEPENDENT state axes on one row: marking the occupancy cert delinquent
          flips servicing_status to DELINQUENT_OCCUPANCY while disposition_status stays ACTIVE; a
          later maturity event flips disposition_status to DUE_AND_PAYABLE while servicing_status
          REMAINS DELINQUENT_OCCUPANCY — neither axis resets the other.
        test_recipe:
          setup:
            - "Originated LINE_OF_CREDIT loan (LOC base). One PENDING OccupancyCertification year 1, due 2025-01-01; clock advanced to 2025-02-01 so it is past due."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Servicer Par", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Eve Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LINE_OF_CREDIT", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
            - call: "POST /occupancy-certifications"
              payload: { loan_id: "${loan_id}", certification_year: 1 }
              as: ServicerOps
              captures: { cert_id: $.data.id }
          trigger:
            - call: "POST /occupancy-certifications/${cert_id}/mark-delinquent"
              payload: {}
              as: ServicerOps
            - call: "POST /maturity-events"
              payload: { loan_id: "${loan_id}", event_type: "PERMANENT_VACANCY", event_date: "2025-02-15" }
              as: ComplianceOfficer
          assert:
            - "After mark-delinquent: Loan.${loan_id}.servicing_status == DELINQUENT_OCCUPANCY"
            - "After mark-delinquent: Loan.${loan_id}.disposition_status == ACTIVE"
            - "After maturity event: Loan.${loan_id}.disposition_status == DUE_AND_PAYABLE"
            - "After maturity event: Loan.${loan_id}.servicing_status == DELINQUENT_OCCUPANCY (axis A unchanged by axis B transition)"

      - name: occupancy_cert_cyclic_pending_delinquent_certified
        grounds:
          - state_machines.OccupancyCertification
          - state_machines.OccupancyCertification.transitions.PENDING_to_DELINQUENT
          - state_machines.OccupancyCertification.transitions.DELINQUENT_to_CERTIFIED
          - endpoints["POST /occupancy-certifications/{certId}/mark-delinquent"]
          - endpoints["POST /occupancy-certifications/{certId}/certify"]
        distinguishing_aspect: |
          OccupancyCertification is cyclic on a different entity than Loan: PENDING -> DELINQUENT
          (mark-delinquent) -> CERTIFIED (certify) — a recovery loop back out of a non-initial state,
          not a one-way linear pipeline.
        test_recipe:
          setup:
            - "Originated LOC loan; PENDING cert year 1 due 2025-01-01; clock 2025-02-01 (past due); cert marked DELINQUENT."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Servicer Cyc", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Finn Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LINE_OF_CREDIT", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
            - call: "POST /occupancy-certifications"
              payload: { loan_id: "${loan_id}", certification_year: 1 }
              as: ServicerOps
              captures: { cert_id: $.data.id }
            - call: "POST /occupancy-certifications/${cert_id}/mark-delinquent"
              payload: {}
              as: ServicerOps
          trigger:
            - call: "POST /occupancy-certifications/${cert_id}/certify"
              payload: {}
              as: Borrower
              as_user_id: "${borrower_id}"
          assert:
            - "OccupancyCertification.${cert_id}.status == CERTIFIED"
            - "OccupancyCertification.${cert_id}.certified_at != null"
            - "Loan.${loan_id}.servicing_status == CURRENT (bubble-up recovery on certify)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: death_to_due_and_payable_to_deferral_to_void_draw_depth3
        grounds:
          - state_machines.Loan.transitions.ACTIVE_to_DUE_AND_PAYABLE
          - state_machines.Loan.transitions.DUE_AND_PAYABLE_to_DEFERRED
          - state_machines.Disbursement.transitions.REQUESTED_to_VOIDED
          - endpoints["POST /maturity-events"]
          - endpoints["POST /nbs-deferrals"]
        distinguishing_aspect: |
          Depth-3 chain from MaturityEvent(BORROWER_DEATH): creating the event mutates Loan
          (ACTIVE->DUE_AND_PAYABLE); that DUE_AND_PAYABLE state is itself the precondition that lets
          the NBS deferral mutate Loan (->DEFERRED); and the maturity event's own cascade voids the
          loan's still-REQUESTED Disbursement (->VOIDED). Each hop is caused by the prior hop.
        test_recipe:
          setup:
            - "Originated LINE_OF_CREDIT loan with a qualified NBS borrower attached and one REQUESTED line-draw disbursement still open."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Servicer Casc", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Gus Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Gail Spouse", birthdate: "1955-03-01", is_non_borrowing_spouse: true, nbs_qualifies: true }
              as: ServicerOps
              captures: { nbs_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", non_borrowing_spouse_id: "${nbs_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LINE_OF_CREDIT", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
            - call: "POST /disbursements"
              payload: { loan_id: "${loan_id}", kind: "LINE_DRAW", requested_amount_cents: 2000000 }
              as: Borrower
              as_user_id: "${borrower_id}"
              captures: { disb_id: $.data.id }
            - call: "POST /maturity-events"
              payload: { loan_id: "${loan_id}", event_type: "BORROWER_DEATH", event_date: "2025-01-10" }
              as: ComplianceOfficer
              captures: { event_id: $.data.id }
          trigger:
            - call: "POST /nbs-deferrals"
              payload: { loan_id: "${loan_id}", borrower_id: "${nbs_id}", maturity_event_id: "${event_id}" }
              as: ComplianceOfficer
              captures: { deferral_id: $.data.id }
          assert:
            - "Disbursement.${disb_id}.status == VOIDED (hop: maturity-event cascade voided the REQUESTED draw)"
            - "Loan.${loan_id}.available_line_of_credit_cents == 0 (line frozen at due-and-payable)"
            - "After deferral: Loan.${loan_id}.disposition_status == DEFERRED"
            - "NonBorrowingSpouseDeferral.${deferral_id}.status == ACTIVE"
            - "NonBorrowingSpouseDeferral.${deferral_id}.period_start == 2025-01-10"

      - name: cert_lapse_to_loan_servicing_delinquent_depth2
        grounds:
          - state_machines.OccupancyCertification.transitions.PENDING_to_DELINQUENT
          - state_machines.Loan.transitions.servicing_CURRENT_to_DELINQUENT_OCCUPANCY
          - endpoints["POST /loans/_clock/set"]
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (the clock-set sweep, not a maturity event): advancing
          the clock past a cert due_date mutates the OccupancyCertification (PENDING->DELINQUENT); that
          cert delinquency itself mutates the Loan (servicing_status CURRENT->DELINQUENT_OCCUPANCY).
        test_recipe:
          setup:
            - "Originated LOC loan; one PENDING OccupancyCertification year 1 due 2025-01-01; clock still at 2024-01-01."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Servicer Sweep", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Hal Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
