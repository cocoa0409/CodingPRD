      - name: failed_downstream_task_redispatch_gated_on_recipient_being_active
        grounds:
          - validations.priority_52.ERR_RECIPIENT_NOT_ACTIVE
          - validations.priority_22.ERR_TASK_INVALID_STATE
          - state_machines.PropagationTask.FAILED_to_DISPATCHED
          - state_machines.DownstreamRecipient.ACTIVE_to_SUSPENDED
          - calculations.recipient_reliability_score
        distinguishing_aspect: |
          The task itself is in FAILED, which priority 22 explicitly declares dispatchable, so
          the refusal can only come from the state of a different entity — the DownstreamRecipient
          it points at. One fail takes reliability to exactly 90.00 - 20.00 = 70.00, which is not
          strictly below RECIPIENT_SUSPEND_THRESHOLD, so the recipient must still be ACTIVE and
          the suspension has to be an explicit operator action; the redispatch then fails with
          ERR_RECIPIENT_NOT_ACTIVE and only succeeds after the recipient is restored.
