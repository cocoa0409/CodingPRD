# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Breadth Claim Index
# Task 2945 — Neighborhood Fiber Build & Preorder Campaign
#
# Sections and claim_type values are taken verbatim from
# skills/prd-bench-scaffold-generator/references/claim-extraction-guide.md.
# Every chain starts from an empty database and pins the logical clock explicitly at
# 2026-08-01T00:00:00Z. Instances whose corner is already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml
# carry an `excluded_because:` stub naming that instance and no test_recipe.
scaffold_corner_design:
  - section: entities
    instances:
      - name: campaign_creation_returns_201_with_every_declared_field
        claim_type: Creation
        grounds:
          - entities.Campaign
          - endpoints["POST /campaigns"]
        distinguishing_aspect: "A create with every input field supplied returns 201 and echoes each stored value, including the optional policy knobs, rather than silently dropping them."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
          trigger:
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000, max_deadline_extensions: 2, extension_grant_days: 30, claim_filing_window_days: 45, restoration_sla_days: 7, late_filing_factor: 0.60 }
              as: ProgramManager
              captures: { camp: $.data.id }
          assert:
            - "the response is HTTP 201 with response_type object"
            - "Campaign.${camp}.name == Fiberhood 2026"
            - "Campaign.${camp}.default_threshold_pct == 10.00"
            - "Campaign.${camp}.deposit_amount_cents == 1000"
            - "Campaign.${camp}.max_deadline_extensions == 2"
            - "Campaign.${camp}.late_filing_factor == 0.60"
            - "Campaign.${camp}.version == 1"

      - name: build_zone_retrieval_returns_the_stored_row
        claim_type: Retrieval
        grounds:
          - entities.BuildZone
          - endpoints["GET /build-zones/{id}"]
        distinguishing_aspect: "GET by id returns the same zone that POST created, with the system-derived prereg_deadline_at populated from the campaign window rather than echoed from input."
        test_recipe:
          setup:
            - "One campaign whose prereg window closes 2026-09-30T23:59:00Z and one zone in it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000 }
              as: ProgramManager
              captures: { camp: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Alpha", zone_code: "A1", household_count: 16, threshold_pct: 12.50, required_permit_types: ["ROW"] }
              as: ProgramManager
              captures: { z1: $.data.id }
          trigger:
            - call: "GET /build-zones/${z1}"
              payload: {}
              as: InstallCoordinator
          assert:
            - "the response is HTTP 200 with response_type object"
            - "BuildZone.${z1}.zone_code == A1"
            - "BuildZone.${z1}.household_count == 16"
            - "BuildZone.${z1}.threshold_pct == 12.50"
            - "BuildZone.${z1}.prereg_deadline_at == 2026-09-30T23:59:00Z"
            - "BuildZone.${z1}.campaign_status == PREREG_OPEN"
            - "BuildZone.${z1}.construction_status == NOT_STARTED"

      - name: service_address_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints["GET /service-addresses"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three addresses in the zone and limit 2, the list returns 2 rows while reporting total_count 3 and has_more true; the filter and the page window are applied together, not one instead of the other."
        test_recipe:
          setup:
            - "One campaign, one zone, three addresses in that zone, and one address in a second zone that the filter must exclude."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000 }
              as: ProgramManager
              captures: { camp: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Alpha", zone_code: "A1", household_count: 10 }
              as: ProgramManager
              captures: { z1: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Bravo", zone_code: "B1", household_count: 10 }
              as: ProgramManager
              captures: { z2: $.data.id }
            - call: "POST /service-addresses"
              payload: { build_zone_id: "${z1}", street_address: "1 Elm St", dwelling_type: "SINGLE_FAMILY", unit_count: 1, distance_to_node_m: 100 }
              as: ProgramManager
              captures: { a1: $.data.id }
            - call: "POST /service-addresses"
              payload: { build_zone_id: "${z1}", street_address: "2 Elm St", dwelling_type: "SINGLE_FAMILY", unit_count: 1, distance_to_node_m: 105 }
              as: ProgramManager
              captures: { a2: $.data.id }
            - call: "POST /service-addresses"
              payload: { build_zone_id: "${z1}", street_address: "3 Elm St", dwelling_type: "SINGLE_FAMILY", unit_count: 1, distance_to_node_m: 110 }
              as: ProgramManager
              captures: { a3: $.data.id }
            - call: "POST /service-addresses"
              payload: { build_zone_id: "${z2}", street_address: "10 Oak Ave", dwelling_type: "SINGLE_FAMILY", unit_count: 1, distance_to_node_m: 90 }
              as: ProgramManager
              captures: { a4: $.data.id }
          trigger:
            - call: "GET /service-addresses"
              payload: { build_zone_id: "${z1}", limit: 2, offset: 0 }
              as: ProgramManager
          assert:
            - "the response is HTTP 200 with response_type array and exactly 2 rows"
            - "the response reports total_count 3, limit 2, offset 0 and has_more true"
            - "the returned rows are ${a1} and ${a2} in created_at ASC order"
            - "${a4} does not appear because it belongs to ${z2}"
            - "GET /service-addresses?build_zone_id=${z1}&limit=2&offset=2 returns 1 row (${a3}) with has_more false"

      - name: get_build_zone_with_unknown_id_returns_build_zone_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_BUILD_ZONE_NOT_FOUND]
          - endpoints["GET /build-zones/{id}"]
        distinguishing_aspect: "A syntactically valid but unknown id yields ERR_BUILD_ZONE_NOT_FOUND with HTTP 404 in the error envelope, not an empty 200 object."
        test_recipe:
          setup:
            - "Empty database apart from the pinned clock, so no zone can match."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
          trigger:
            - call: "GET /build-zones/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ProgramManager
          assert:
            - "the response is HTTP 404 with response_type error and data.error_id == ERR_BUILD_ZONE_NOT_FOUND"
            - "the response carries meta.api_request_id and meta.api_request_timestamp like every other response"

      - name: preorder_create_missing_required_plan_tier_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority 7 ERR_INVALID_REQUEST]
          - endpoints["POST /preorders"]
        distinguishing_aspect: "plan_tier has source input with no default, so omitting it must fail with ERR_INVALID_REQUEST (422) before any deposit is held or demand counter moves."
        test_recipe:
          setup:
            - "One campaign, one zone, one SERVICEABLE address and one account, with the window open."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000 }
              as: ProgramManager
              captures: { camp: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Alpha", zone_code: "A1", household_count: 10 }
              as: ProgramManager
              captures: { z1: $.data.id }
            - call: "POST /service-addresses"
              payload: { build_zone_id: "${z1}", street_address: "1 Elm St", dwelling_type: "SINGLE_FAMILY", unit_count: 1, distance_to_node_m: 100 }
              as: ProgramManager
              captures: { a1: $.data.id }
            - call: "POST /service-addresses/${a1}/serviceability-determination"
              payload: { serviceability: "SERVICEABLE" }
              as: ProgramManager
            - call: "POST /accounts"
              payload: { full_name: "Ann Reyes", email: "ann@example.com", phone: "+13035550101", account_type: "RESIDENT" }
              as: ProgramManager
              captures: { acct1: $.data.id }
            - call: "GET /build-zones/${z1}"
              payload: {}
              as: ProgramManager
              captures: { zv1: $.data.version }
          trigger:
            - call: "POST /preorders"
              payload: { build_zone_id: "${z1}", service_address_id: "${a1}", account_id: "${acct1}", tendered_deposit_cents: 1000, expected_build_zone_version: "${zv1}" }
              as: Subscriber
              as_user_id: "${acct1}"
          assert:
            - "the response is HTTP 422 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /preorders?service_address_id=${a1} returns total_count 0"
            - "Account.${acct1}.deposit_held_cents == 0"
            - "BuildZone.${z1}.provisional_qualifying_count == 0"

      - name: build_zone_defaults_threshold_from_campaign_and_bury_cap_to_two
        claim_type: Defaults
        grounds:
          - entities.BuildZone.fields.threshold_pct
          - entities.BuildZone.fields.required_permit_types
          - entities.BuildZone.fields.max_concurrent_bury_ops
          - endpoints["POST /build-zones"]
        distinguishing_aspect: "Omitting threshold_pct inherits the campaign's default_threshold_pct 12.50 (not a hardcoded constant), while required_permit_types defaults to [ROW] and max_concurrent_bury_ops to 2."
        test_recipe:
          setup:
            - "One campaign whose default_threshold_pct is 12.50."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 12.50, deposit_amount_cents: 1000 }
              as: ProgramManager
              captures: { camp: $.data.id }
          trigger:
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Alpha", zone_code: "A1", household_count: 10 }
              as: ProgramManager
              captures: { z1: $.data.id }
          assert:
            - "BuildZone.${z1}.threshold_pct == 12.50"
            - "BuildZone.${z1}.required_permit_types == [ROW]"
            - "BuildZone.${z1}.max_concurrent_bury_ops == 2"
            - "BuildZone.${z1}.extension_count == 0"
            - "BuildZone.${z1}.cumulative_extension_days == 0"
            - "BuildZone.${z1}.make_ready_cost_cents == 0"

      - name: install_crew_defaults_buffer_thirty_and_capacity_four_eighty
        claim_type: Defaults
        grounds:
          - entities.InstallCrew.fields.travel_buffer_minutes
          - entities.InstallCrew.fields.daily_capacity_minutes
          - endpoints["POST /install-crews"]
        distinguishing_aspect: "A crew created without scheduling knobs takes travel_buffer_minutes 30 and daily_capacity_minutes 480, and starts with zeroed booked_minutes_total and scheduled_appointment_count."
        test_recipe:
          setup:
            - "Empty database apart from the pinned clock; crews are campaign-independent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
          trigger:
            - call: "POST /install-crews"
              payload: { name: "Bury Crew 1", crew_type: "BURY" }
              as: InstallCoordinator
              captures: { c1: $.data.id }
          assert:
            - "InstallCrew.${c1}.travel_buffer_minutes == 30"
            - "InstallCrew.${c1}.daily_capacity_minutes == 480"
            - "InstallCrew.${c1}.booked_minutes_total == 0"
            - "InstallCrew.${c1}.scheduled_appointment_count == 0"
            - "InstallCrew.${c1}.version == 1"

      - name: account_deposit_held_cents_is_computed_and_ignores_client_input
        claim_type: Computed Fields
        grounds:
          - entities.Account.fields.deposit_held_cents
          - endpoints["POST /accounts"]
        distinguishing_aspect: "deposit_held_cents is a computed ledger projection: a create that smuggles the field in the body still returns 0, and the value only moves when a LedgerEntry is appended."
        test_recipe:
          setup:
            - "Empty database apart from the pinned clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
          trigger:
            - call: "POST /accounts"
              payload: { full_name: "Ann Reyes", email: "ann@example.com", phone: "+13035550101", account_type: "RESIDENT" }
              as: ProgramManager
              captures: { acct1: $.data.id }
          assert:
            - "Account.${acct1}.deposit_held_cents == 0"
            - "Account.${acct1}.credit_balance_cents == 0"
            - "any deposit_held_cents value supplied in the request body is ignored, never persisted"
            - "GET /ledger-entries?account_id=${acct1} returns total_count 0"

      - name: campaign_system_fields_are_server_assigned_and_input_is_ignored
        claim_type: System Fields
        grounds:
          - entities.Campaign
          - endpoints["POST /campaigns"]
        distinguishing_aspect: "id, created_at, updated_at and version are system-sourced: a body that supplies them is accepted but the server's own values win, with created_at equal to the pinned logical clock."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
          trigger:
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000 }
              as: ProgramManager
              captures: { camp: $.data.id, created: $.data.created_at }
          assert:
            - "${created} == 2026-08-01T00:00:00Z"
            - "Campaign.${camp}.id is a server-generated identifier distinct from anything in the request body"
            - "Campaign.${camp}.updated_at == 2026-08-01T00:00:00Z"
            - "Campaign.${camp}.version == 1"

      - name: service_address_rejects_unknown_dwelling_type_enum_value
        claim_type: Type Constraints
        grounds:
          - entities.ServiceAddress.fields.dwelling_type
          - validations[priority 7 ERR_INVALID_REQUEST]
          - endpoints["POST /service-addresses"]
        distinguishing_aspect: "dwelling_type is closed over {SINGLE_FAMILY, MDU}; a plausible-looking DUPLEX is rejected with ERR_INVALID_REQUEST rather than stored as free text."
        test_recipe:
          setup:
            - "One campaign and one zone."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000 }
              as: ProgramManager
              captures: { camp: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Alpha", zone_code: "A1", household_count: 10 }
              as: ProgramManager
              captures: { z1: $.data.id }
          trigger:
            - call: "POST /service-addresses"
              payload: { build_zone_id: "${z1}", street_address: "4 Elm St", dwelling_type: "DUPLEX", unit_count: 2, distance_to_node_m: 100 }
              as: ProgramManager
          assert:
            - "the response is HTTP 422 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /service-addresses?build_zone_id=${z1} returns total_count 0"

      - name: ledger_entry_is_immutable_with_no_version_and_no_write_endpoint
        claim_type: Immutability
        grounds:
          - entities.LedgerEntry
          - endpoints["GET /ledger-entries/{id}"]
        distinguishing_aspect: "LedgerEntry declares common_fields false: it exposes no version field and §1.5 offers only reads, so movements are corrected by appending compensating rows rather than editing history."
        test_recipe:
          setup:
            - "One campaign, one zone, one SERVICEABLE address, one account and one preorder, so exactly one DEPOSIT_HELD entry exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000 }
              as: ProgramManager
              captures: { camp: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Alpha", zone_code: "A1", household_count: 10 }
              as: ProgramManager
              captures: { z1: $.data.id }
            - call: "POST /service-addresses"
              payload: { build_zone_id: "${z1}", street_address: "1 Elm St", dwelling_type: "SINGLE_FAMILY", unit_count: 1, distance_to_node_m: 100 }
              as: ProgramManager
              captures: { a1: $.data.id }
            - call: "POST /service-addresses/${a1}/serviceability-determination"
              payload: { serviceability: "SERVICEABLE" }
              as: ProgramManager
            - call: "POST /accounts"
              payload: { full_name: "Ann Reyes", email: "ann@example.com", phone: "+13035550101", account_type: "RESIDENT" }
              as: ProgramManager
              captures: { acct1: $.data.id }
            - call: "GET /build-zones/${z1}"
              payload: {}
              as: ProgramManager
              captures: { zv1: $.data.version }
            - call: "POST /preorders"
              payload: { build_zone_id: "${z1}", service_address_id: "${a1}", account_id: "${acct1}", plan_tier: "BASIC_300", tendered_deposit_cents: 1000, expected_build_zone_version: "${zv1}" }
              as: Subscriber
              as_user_id: "${acct1}"
              captures: { p1: $.data.id }
          trigger:
            - call: "GET /ledger-entries"
              payload: { preorder_id: "${p1}" }
              as: ProgramManager
              captures: { le1: "$.data[0].id" }
          assert:
            - "the listing returns total_count 1 and that entry has entry_type DEPOSIT_HELD with amount_cents 1000"
            - "LedgerEntry.${le1} exposes no version field and no updated_at-driven concurrency contract"
            - "§1.5 declares no PATCH, PUT or DELETE for /ledger-entries, so the row cannot be amended"
            - "GET /ledger-entries/${le1} returns the same immutable row"

      - name: preorder_with_address_from_another_zone_returns_linkage_mismatch
        claim_type: Parent Relationships
        grounds:
          - validations[priority 8 ERR_ADDRESS_LINKAGE_MISMATCH]
          - entities.Preorder.fields.service_address_id
          - endpoints["POST /preorders"]
        distinguishing_aspect: "Flat topology cross-reference integrity: both parents exist, so nothing is NOT_FOUND, yet the address belongs to a different zone than build_zone_id and the create must fail with ERR_ADDRESS_LINKAGE_MISMATCH."
        test_recipe:
          setup:
            - "One campaign with two zones; the SERVICEABLE address belongs to Zone Bravo while the preorder names Zone Alpha."
            - "One RESIDENT account and the window open."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000 }
              as: ProgramManager
              captures: { camp: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Alpha", zone_code: "A1", household_count: 10 }
              as: ProgramManager
              captures: { z1: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Bravo", zone_code: "B1", household_count: 10 }
              as: ProgramManager
              captures: { z2: $.data.id }
            - call: "POST /service-addresses"
              payload: { build_zone_id: "${z2}", street_address: "10 Oak Ave", dwelling_type: "SINGLE_FAMILY", unit_count: 1, distance_to_node_m: 90 }
              as: ProgramManager
              captures: { a1: $.data.id }
            - call: "POST /service-addresses/${a1}/serviceability-determination"
              payload: { serviceability: "SERVICEABLE" }
              as: ProgramManager
            - call: "POST /accounts"
              payload: { full_name: "Ann Reyes", email: "ann@example.com", phone: "+13035550101", account_type: "RESIDENT" }
              as: ProgramManager
              captures: { acct1: $.data.id }
            - call: "GET /build-zones/${z1}"
              payload: {}
              as: ProgramManager
              captures: { zv1: $.data.version }
          trigger:
            - call: "POST /preorders"
              payload: { build_zone_id: "${z1}", service_address_id: "${a1}", account_id: "${acct1}", plan_tier: "BASIC_300", tendered_deposit_cents: 1000, expected_build_zone_version: "${zv1}" }
              as: Subscriber
              as_user_id: "${acct1}"
          assert:
            - "the response is HTTP 409 with data.error_id == ERR_ADDRESS_LINKAGE_MISMATCH"
            - "BuildZone.${z1}.provisional_qualifying_count == 0"
            - "BuildZone.${z2}.provisional_qualifying_count == 0"
            - "Account.${acct1}.deposit_held_cents == 0"

      - name: build_zone_create_under_unknown_campaign_returns_campaign_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority 4 ERR_CAMPAIGN_NOT_FOUND]
          - endpoints["POST /build-zones"]
        distinguishing_aspect: "A referenced-parent miss is a 404 on the parent's own error id (ERR_CAMPAIGN_NOT_FOUND), distinct from the 422 shape errors, and no orphan zone row is created."
        test_recipe:
          setup:
            - "Empty database apart from the pinned clock, so the referenced campaign cannot exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
          trigger:
            - call: "POST /build-zones"
              payload: { campaign_id: "22222222-2222-4222-8222-222222222222", name: "Zone Ghost", zone_code: "G1", household_count: 10 }
              as: ProgramManager
          assert:
