            - { call: "POST /vault/boxes", payload: { branch_id: "${branch_id}", box_type_id: "${bt_id}", box_number: "FL-2" }, as: VaultAdmin, captures: { box2_id: "$.data.id" } }
            - { call: "POST /vault/renters", payload: { full_name: "Fil A", email: "fila@x.com", gov_id_ref: "G-42", date_of_birth: "1980-01-01" }, as: VaultAdmin, captures: { renterA_id: "$.data.id" } }
            - { call: "POST /vault/renters/${renterA_id}/verify-kyc", payload: {}, as: ComplianceOfficer }
            - { call: "POST /vault/rentals", payload: { box_id: "${box1_id}", renter_id: "${renterA_id}", plan_term_months: 12 }, as: VaultAdmin, captures: { rentalA_id: "$.data.id" } }
            - { call: "POST /vault/rentals/${rentalA_id}/activate", payload: {}, as: VaultAdmin }
            - { call: "POST /vault/renters", payload: { full_name: "Fil B", email: "filb@x.com", gov_id_ref: "G-43", date_of_birth: "1981-02-02" }, as: VaultAdmin, captures: { renterB_id: "$.data.id" } }
            - { call: "POST /vault/rentals", payload: { box_id: "${box2_id}", renter_id: "${renterB_id}", plan_term_months: 12 }, as: VaultAdmin, captures: { rentalB_id: "$.data.id" } }
