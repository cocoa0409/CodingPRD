  # ---- DistributorOrder ----
  - method: POST
    path: "/plant/distributor-orders"
    description: "Places a distributor order for a released platform into a region for a delivery month."
    roles: [DistributorRep]
    code: 201
    input: ["distributor_code", "platform_id", "region_code", "requested_units", "priority_score", "requested_delivery_month"]
    output: DistributorOrder
    side_effects: ["allocation_status = UNALLOCATED; fulfillment_status = PENDING; created_by_user_id = X-User-ID"]
  - method: GET
    path: "/plant/distributor-orders"
    description: "Lists distributor orders, filterable by platform, distributor, region, delivery month, and either state dimension."
    roles: [PlantAdmin, SupplyPlanner, ProductionPlanner, DistributorRep]
    code: 200
    input: ["platform_id?", "distributor_code?", "region_code?", "requested_delivery_month?", "allocation_status?", "fulfillment_status?", "limit?", "offset?"]
    output: DistributorOrder[]
    side_effects: []
  - method: GET
    path: "/plant/distributor-orders/{id}"
    description: "Reads one distributor order including allocated_units and both state dimensions."
    roles: [PlantAdmin, SupplyPlanner, ProductionPlanner, DistributorRep]
    code: 200
    input: []
    output: DistributorOrder
    side_effects: []
  - method: POST
    path: "/plant/distributor-orders/{id}/allocate"
    description: "Draws component kits for an order under the policy of its primary compressor supply row. Carries the supply version the planner last observed."
    roles: [SupplyPlanner]
    code: 200
    input: ["expected_component_supply_version"]
    output: DistributorOrder
    side_effects: ["calculations.allocation_fill_plan grants units and creates one AllocationLine per drawn supply row with status = RESERVED", "calculations.supply_effective_capacity recomputes reserved_units and available_units on every drawn supply, which may transition it ACTIVE -> EXHAUSTED", "allocation_status advances to PARTIALLY_ALLOCATED or FULLY_ALLOCATED while fulfillment_status is untouched", "increments ComponentSupply.version by 1 on every drawn row and DistributorOrder.version by 1"]
  - method: GET
    path: "/plant/distributor-orders/{id}/allocation-preview"
    description: "Computed read that prices the grant this order would receive under either allocation policy, without drawing anything."
    roles: [PlantAdmin, SupplyPlanner, DistributorRep]
    code: 200
    input: ["policy?"]
    output: { order_id: uuid, policy: string, compressor_pool: integer, board_pool: integer, kit_capacity: integer, remaining_need: integer, total_open_demand: integer, granted_units: integer }
    side_effects: ["calculations.allocation_fill_plan evaluated under the requested policy; no stored row changes and no version increments"]
  - method: POST
    path: "/plant/distributor-orders/{id}/stage"
    description: "Stages a fully allocated order for shipment."
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: DistributorOrder
    side_effects: ["state_machines.DistributorOrder.PENDING_to_STAGED; staged_at stamped; allocation_status untouched", "increments DistributorOrder.version by 1"]
  - method: POST
    path: "/plant/distributor-orders/{id}/ship"
    description: "Ships a staged order before the program's sell-through deadline, committing its reserved components."
    roles: [ProductionPlanner]
    code: 200
    input: ["shipped_units"]
    output: DistributorOrder
    side_effects: ["state_machines.DistributorOrder.STAGED_to_SHIPPED; RESERVED allocation lines become COMMITTED and each supply moves those units from reserved_units to committed_units", "ProductPlatform.units_shipped_total, rolling_claim_rate_pct, and warranty_posture recomputed", "increments DistributorOrder.version by 1, every touched ComponentSupply.version by 1, and ProductPlatform.version by 1"]
  - method: POST
    path: "/plant/distributor-orders/{id}/cancel"
    description: "Cancels a pending order, releasing every component it was holding. Only the rep who placed it may cancel it."
    roles: [DistributorRep]
    code: 200
    input: ["reason?"]
    output: DistributorOrder
    side_effects: ["state_machines.DistributorOrder.PENDING_to_CANCELLED; RESERVED allocation lines become RELEASED; calculations.supply_effective_capacity restores available_units on every touched supply and may transition it EXHAUSTED -> ACTIVE", "increments DistributorOrder.version by 1 and every touched ComponentSupply.version by 1"]
  - method: GET
    path: "/plant/distributor-orders/{id}/allocation-lines"
    description: "Lists the allocation lines held by this order."
    roles: [PlantAdmin, SupplyPlanner, ProductionPlanner, DistributorRep]
    code: 200
    input: ["status?"]
    output: AllocationLine[]
    side_effects: []

