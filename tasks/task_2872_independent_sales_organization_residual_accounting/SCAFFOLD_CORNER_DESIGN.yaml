              payload: { agent_id: "${a1}", period_month: "2026-07" }
              as: ResidualController
              captures: { st: "$.data[0].id", sv: "$.data[0].version" }
            - call: "POST /agent-statements/${st}/adjustments"
              payload: { kind: "DISPUTE_CREDIT", amount_cents: 500, reason: "Interchange re-rate credit", expected_statement_version: "${sv}" }
              as: ResidualAnalyst
              as_user_id: analyst-1
              captures: { adj: $.data.id }
          trigger:
            - call: "POST /statement-adjustments/${adj}/review"
              payload: {}
              as: ResidualController
              as_user_id: ctrl-2
            - call: "POST /statement-adjustments/${adj}/request-info"
              payload: { info_request_note: "Attach the processor dispute letter" }
              as: ResidualController
              as_user_id: ctrl-2
            - call: "POST /statement-adjustments/${adj}/resubmit"
              payload: { reason: "Dispute letter attached" }
              as: ResidualAnalyst
              as_user_id: analyst-1
            - call: "POST /statement-adjustments/${adj}/request-info"
              payload: { info_request_note: "Letter is unsigned — resend" }
              as: ResidualController
              as_user_id: ctrl-2
            - call: "POST /statement-adjustments/${adj}/resubmit"
              payload: { reason: "Signed letter attached" }
              as: ResidualAnalyst
              as_user_id: analyst-1
            - call: "POST /statement-adjustments/${adj}/approve"
              payload: {}
              as: ResidualController
              as_user_id: ctrl-2
          assert:
            - "the setup adjustment call carries the statement's current version and is accepted: the row lands in PROPOSED with created_by_user_id == analyst-1 and approved_by_user_id == null"
            - "the state sequence is PROPOSED -> UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW -> APPLIED"
            - "info_request_note == 'Attach the processor dispute letter' after the first request-info, null after the first resubmit, 'Letter is unsigned — resend' after the second, and null again after the second resubmit"
            - "StatementAdjustment.${adj}.version == 7 (one bump per hop, starting from 1 at creation) and approved_by_user_id == ctrl-2"
            - "AgentStatement.${st}.adjustment_cents == 0 at every intermediate hop and 500 only after the approval"
            - "AgentStatement.${st}.net_payable_cents == 6800 and gross_after_trueup_cents == 6300 after the approval — the adjustment enters at step 6, never the gross"
            - "Agent.${a1}.trailing_residual_cents == 6300 (it reads gross_after_trueup_cents, which the adjustment does not touch)"

      - name: rejected_adjustment_leaves_statement_amount_untouched
        claim_type: Side Effect Execution
        grounds:
          - state_machines.StatementAdjustment.UNDER_REVIEW_to_REJECTED
          - calculations.statement_net_payable (step 6 APPLIED filter)
        distinguishing_aspect: "REJECTED is terminal but NOT a deletion, and it must be excluded from the signed sum: a -800 rejected debit and a +200 approved credit coexist on the same statement, whose adjustment_cents must be exactly 200 rather than -600. The rejected row still records its adjudicator."
        test_recipe:
          setup: ["CORNER-BASE posted; A1's 2026-07 DRAFT statement (net 6300) carries two adjustments proposed by analyst-1: a -800 MANUAL_DEBIT and a +200 DISPUTE_CREDIT, both moved to UNDER_REVIEW by ctrl-2."]
