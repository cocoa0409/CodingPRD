              payload: { race_edition_id: "00000000-0000-4000-8000-000000000000", category: OVERALL, gender: MALE, place: 1, amount_cents: 1000000 }
              as: ElitesDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "trigger call 1 returns HTTP 404 with error_id == ERR_RACE_EDITION_NOT_FOUND"
            - "no PurseLine row is created"

      - name: corner_flat_topology_invitation_fk_integrity_across_three_parents
        claim_type: flat
        grounds:
          - complexity_profile.entity_topology
          - errors.ERR_REP_AGENT_NOT_FOUND
          - errors.ERR_ATHLETE_NOT_FOUND
          - errors.ERR_PERFORMANCE_RECORD_NOT_FOUND
        distinguishing_aspect: >-
          The topology is flat, so Invitation carries four body FKs that must each be validated
          independently — a bad agent_id, a bad athlete_id and a bad qualifying_performance_id each
          produce their OWN 404, not a shared generic one.
        test_recipe:
          setup:
            - "One FIELD_OPEN edition, one registered athlete with a VERIFIED performance and one ACTIVE agent."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
