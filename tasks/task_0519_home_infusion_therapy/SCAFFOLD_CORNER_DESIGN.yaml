# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 breadth probe.
# Walks references/claim-extraction-guide.md row-by-row against SCAFFOLD.yaml §1.1–§1.7.
# Every test_recipe call resolves to a declared §1.5 endpoint; every ${var} bound by an earlier captures:.
# excluded_because: stubs cite a §1.8 instance by name (must exist in SCAFFOLD_DIFFICULTY_DESIGN.yaml).

scaffold_corner_design:

  # =====================================================================
  - section: entities
    instances:
      - name: create_patient_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Patient, endpoints]
        distinguishing_aspect: "POST /patients with all required fields returns 201; response carries server-minted id, created_at, version=1, status defaulting to ACTIVE."
        test_recipe:
          setup: ["empty DB; one PayerPlan exists"]
          setup_api_calls:
            - call: "POST /payer-plans"
              payload: { plan_code: "PE1", per_diem_rate_cents: { ANTI_INFECTIVE: 12500 }, awp_discount_pct: 0.10, coinsurance_pct: 0.20, deductible_remaining_cents: 10000, oop_max_remaining_cents: 500000 }
              as: Biller
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Eve", service_state: "CA", payer_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
          assert:
            - "response code 201; Patient.${pat_id}.status == ACTIVE; Patient.${pat_id}.version == 1; created_at present (ISO 8601 UTC)"

      - name: get_patient_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Patient, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /patients/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /patients/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response code 404; data.error_id == ERR_NOT_FOUND"

      - name: create_order_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.InfusionOrder, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /infusion-orders omitting required daily_dose_mg returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["an ACCEPTED referral and a drug exist"]
          setup_api_calls:
            - call: "POST /drug-catalog"
              payload: { ndc_code: "NDC-RF", generic_name: "ceftriaxone", therapy_category: "ANTI_INFECTIVE", vial_size_mg: 1000, awp_per_vial_cents: 2000, is_specialty: false, requires_trough_lab: false, lot_total_vials: 100 }
              as: Pharmacist
              captures: { drug_id: $.data.id }
            - call: "POST /payer-plans"
              payload: { plan_code: "PRF", per_diem_rate_cents: { ANTI_INFECTIVE: 12500 }, awp_discount_pct: 0.10, coinsurance_pct: 0.20, deductible_remaining_cents: 10000, oop_max_remaining_cents: 500000 }
              as: Biller
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat RF", service_state: "CA", payer_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "1234567890", diagnosis_code: "A41.9" }
              as: IntakeCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/accept"
              payload: {}
              as: IntakeCoordinator
          trigger:
            - call: "POST /infusion-orders"
              payload: { referral_id: "${ref_id}", drug_id: "${drug_id}", route: "IV", frequency_per_day: 1, start_date: "2026-06-10T00:00:00Z", scheduled_days: 5 }
              as: Pharmacist
              captures: { err: $.data.error_id }
          assert:
            - "response code 422; data.error_id == ERR_INVALID_REQUEST (daily_dose_mg missing)"

      - name: create_drug_invalid_therapy_category_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.DrugCatalog.fields.therapy_category, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /drug-catalog with therapy_category not in the enum set returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /drug-catalog"
              payload: { ndc_code: "NDC-EN", generic_name: "x", therapy_category: "NOT_A_CATEGORY", vial_size_mg: 1000, awp_per_vial_cents: 2000, lot_total_vials: 100 }
              as: Pharmacist
              captures: { err: $.data.error_id }
          assert:
            - "response code 422; data.error_id == ERR_INVALID_REQUEST"

      - name: create_drug_default_flags_applied_when_omitted
        claim_type: Defaults
        grounds: [entities.DrugCatalog.fields.is_specialty, entities.DrugCatalog.fields.requires_trough_lab]
        distinguishing_aspect: "Omitting is_specialty and requires_trough_lab applies defaults false; on_hand_vials initializes to lot_total_vials."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /drug-catalog"
              payload: { ndc_code: "NDC-DF", generic_name: "ceftriaxone", therapy_category: "ANTI_INFECTIVE", vial_size_mg: 1000, awp_per_vial_cents: 2000, lot_total_vials: 100 }
              as: Pharmacist
              captures: { drug_id: $.data.id }
          assert:
            - "DrugCatalog.${drug_id}.is_specialty == false; requires_trough_lab == false; on_hand_vials == 100"

      - name: order_system_fields_input_ignored
        claim_type: System Fields
        grounds: [entities.InfusionOrder.fields.status, entities.InfusionOrder.fields.administered_days]
        distinguishing_aspect: "POST /infusion-orders ignores any client-supplied status/administered_days; status forced to DRAFT, administered_days to 0, patient_id copied from referral."
        test_recipe:
          setup: ["an ACCEPTED referral and a drug exist"]
          setup_api_calls:
            - call: "POST /drug-catalog"
              payload: { ndc_code: "NDC-SF", generic_name: "ceftriaxone", therapy_category: "ANTI_INFECTIVE", vial_size_mg: 1000, awp_per_vial_cents: 2000, is_specialty: false, requires_trough_lab: false, lot_total_vials: 100 }
              as: Pharmacist
              captures: { drug_id: $.data.id }
            - call: "POST /payer-plans"
              payload: { plan_code: "PSF", per_diem_rate_cents: { ANTI_INFECTIVE: 12500 }, awp_discount_pct: 0.10, coinsurance_pct: 0.20, deductible_remaining_cents: 10000, oop_max_remaining_cents: 500000 }
              as: Biller
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat SF", service_state: "CA", payer_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "1234567890", diagnosis_code: "A41.9" }
              as: IntakeCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/accept"
              payload: {}
              as: IntakeCoordinator
          trigger:
            - call: "POST /infusion-orders"
              payload: { referral_id: "${ref_id}", drug_id: "${drug_id}", route: "IV", daily_dose_mg: 1000, frequency_per_day: 1, start_date: "2026-06-10T00:00:00Z", scheduled_days: 5 }
              as: Pharmacist
              captures: { order_id: $.data.id }
          assert:
            - "InfusionOrder.${order_id}.status == DRAFT; administered_days == 0; patient_id == ${pat_id}"

      - name: list_drug_catalog_paginated_envelope
        claim_type: Listing
        grounds: [entities.DrugCatalog, endpoints]
        distinguishing_aspect: "GET /drug-catalog returns an array envelope with pagination fields total_count and has_more."
        test_recipe:
          setup: ["two drugs registered"]
          setup_api_calls:
            - call: "POST /drug-catalog"
              payload: { ndc_code: "NDC-L1", generic_name: "a", therapy_category: "ANTI_INFECTIVE", vial_size_mg: 1000, awp_per_vial_cents: 2000, lot_total_vials: 100 }
              as: Pharmacist
            - call: "POST /drug-catalog"
              payload: { ndc_code: "NDC-L2", generic_name: "b", therapy_category: "TPN", vial_size_mg: 1000, awp_per_vial_cents: 3000, lot_total_vials: 100 }
              as: Pharmacist
          trigger:
            - call: "GET /drug-catalog"
              payload: { limit: 1, offset: 0 }
              as: Pharmacist
          assert:
            - "response_type == array; data length == 1; meta/pagination total_count == 2 and has_more == true"

      - name: order_requires_accepted_referral_parent
        claim_type: Parent Relationships
        grounds: [entities.InfusionOrder.fields.referral_id, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Creating an infusion order against a RECEIVED (not ACCEPTED) referral is rejected; referral must be ACCEPTED first."
        test_recipe:
          setup: ["a RECEIVED referral (not accepted) and a drug exist"]
          setup_api_calls:
            - call: "POST /drug-catalog"
              payload: { ndc_code: "NDC-PR", generic_name: "ceftriaxone", therapy_category: "ANTI_INFECTIVE", vial_size_mg: 1000, awp_per_vial_cents: 2000, is_specialty: false, requires_trough_lab: false, lot_total_vials: 100 }
              as: Pharmacist
              captures: { drug_id: $.data.id }
            - call: "POST /payer-plans"
              payload: { plan_code: "PPR", per_diem_rate_cents: { ANTI_INFECTIVE: 12500 }, awp_discount_pct: 0.10, coinsurance_pct: 0.20, deductible_remaining_cents: 10000, oop_max_remaining_cents: 500000 }
              as: Biller
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat PR", service_state: "CA", payer_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "1234567890", diagnosis_code: "A41.9" }
              as: IntakeCoordinator
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /infusion-orders"
              payload: { referral_id: "${ref_id}", drug_id: "${drug_id}", route: "IV", daily_dose_mg: 1000, frequency_per_day: 1, start_date: "2026-06-10T00:00:00Z", scheduled_days: 5 }
              as: Pharmacist
              captures: { err: $.data.error_id }
          assert:
            - "response code 409; data.error_id == ERR_INVALID_STATE (referral not ACCEPTED)"

      - name: flat_topology_fk_integrity_payer_plan_must_exist
        claim_type: Foreign key references validated
        grounds: [entities.Patient.fields.payer_plan_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "flat topology: POST /patients with a non-existent payer_plan_id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Pat FK", service_state: "CA", payer_plan_id: "00000000-0000-0000-0000-000000000000" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response code 404; data.error_id == ERR_NOT_FOUND"

  # =====================================================================
  - section: state_machines
    instances:
      - name: reject_referral_from_received
        claim_type: Valid Transition
        grounds: [state_machines.Referral.RECEIVED_to_REJECTED]
        distinguishing_aspect: "POST /referrals/{id}/reject moves RECEIVED -> REJECTED; version increments to 2."
        test_recipe:
          setup: ["a RECEIVED referral"]
          setup_api_calls:
            - call: "POST /payer-plans"
              payload: { plan_code: "PRJ", per_diem_rate_cents: { ANTI_INFECTIVE: 12500 }, awp_discount_pct: 0.10, coinsurance_pct: 0.20, deductible_remaining_cents: 10000, oop_max_remaining_cents: 500000 }
              as: Biller
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat RJ", service_state: "CA", payer_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "1234567890", diagnosis_code: "A41.9" }
              as: IntakeCoordinator
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /referrals/${ref_id}/reject"
              payload: {}
              as: IntakeCoordinator
          assert:
            - "Referral.${ref_id}.status == REJECTED; version == 2"

      - name: accept_referral_twice_idempotency_error
        claim_type: Idempotency
        grounds: [state_machines.Referral.RECEIVED_to_ACCEPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second POST /referrals/{id}/accept on an already-ACCEPTED referral returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["a RECEIVED referral accepted once"]
          setup_api_calls:
            - call: "POST /payer-plans"
              payload: { plan_code: "PID", per_diem_rate_cents: { ANTI_INFECTIVE: 12500 }, awp_discount_pct: 0.10, coinsurance_pct: 0.20, deductible_remaining_cents: 10000, oop_max_remaining_cents: 500000 }
              as: Biller
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat ID", service_state: "CA", payer_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "1234567890", diagnosis_code: "A41.9" }
              as: IntakeCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/accept"
              payload: {}
              as: IntakeCoordinator
          trigger:
            - call: "POST /referrals/${ref_id}/accept"
              payload: {}
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response code 409; data.error_id == ERR_INVALID_STATE"

      - name: terminal_referral_rejected_cannot_accept
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Referral.RECEIVED_to_REJECTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From terminal REJECTED, accept is undefined and returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["a REJECTED referral"]
          setup_api_calls:
            - call: "POST /payer-plans"
              payload: { plan_code: "PTL", per_diem_rate_cents: { ANTI_INFECTIVE: 12500 }, awp_discount_pct: 0.10, coinsurance_pct: 0.20, deductible_remaining_cents: 10000, oop_max_remaining_cents: 500000 }
              as: Biller
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat TL", service_state: "CA", payer_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "1234567890", diagnosis_code: "A41.9" }
              as: IntakeCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/reject"
              payload: {}
              as: IntakeCoordinator
          trigger:
            - call: "POST /referrals/${ref_id}/accept"
              payload: {}
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response code 409; data.error_id == ERR_INVALID_STATE"

      - name: nonspecialty_submit_goes_straight_to_released
        claim_type: Valid Transition
        grounds: [state_machines.InfusionOrder.DRAFT_to_RELEASED]
        distinguishing_aspect: "A non-specialty order submits DRAFT -> RELEASED directly (no PENDING_AUTH), since is_specialty == false."
        test_recipe:
          setup: ["a non-specialty drug order in DRAFT"]
          setup_api_calls:
            - call: "POST /drug-catalog"
              payload: { ndc_code: "NDC-NS", generic_name: "ceftriaxone", therapy_category: "ANTI_INFECTIVE", vial_size_mg: 1000, awp_per_vial_cents: 2000, is_specialty: false, requires_trough_lab: false, lot_total_vials: 100 }
              as: Pharmacist
              captures: { drug_id: $.data.id }
            - call: "POST /payer-plans"
              payload: { plan_code: "PNS", per_diem_rate_cents: { ANTI_INFECTIVE: 12500 }, awp_discount_pct: 0.10, coinsurance_pct: 0.20, deductible_remaining_cents: 10000, oop_max_remaining_cents: 500000 }
              as: Biller
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat NS", service_state: "CA", payer_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "1234567890", diagnosis_code: "A41.9" }
              as: IntakeCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/accept"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /infusion-orders"
              payload: { referral_id: "${ref_id}", drug_id: "${drug_id}", route: "IV", daily_dose_mg: 1000, frequency_per_day: 1, start_date: "2026-06-10T00:00:00Z", scheduled_days: 5 }
              as: Pharmacist
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /infusion-orders/${order_id}/submit"
              payload: {}
              as: Pharmacist
          assert:
            - "InfusionOrder.${order_id}.status == RELEASED (skips PENDING_AUTH)"

      - name: first_visit_complete_activates_order
        claim_type: Side Effect Execution
        grounds: [state_machines.NursingVisit.SCHEDULED_to_COMPLETED, state_machines.InfusionOrder.RELEASED_to_ACTIVE, calculations.administered_days_count]
        distinguishing_aspect: "Completing the first visit moves the order RELEASED -> ACTIVE and sets administered_days to 1."
        test_recipe:
          setup: ["a RELEASED non-specialty order with one SCHEDULED visit"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: Pharmacist
            - call: "POST /drug-catalog"
              payload: { ndc_code: "NDC-FV", generic_name: "ceftriaxone", therapy_category: "ANTI_INFECTIVE", vial_size_mg: 1000, awp_per_vial_cents: 2000, is_specialty: false, requires_trough_lab: false, lot_total_vials: 100 }
              as: Pharmacist
              captures: { drug_id: $.data.id }
            - call: "POST /payer-plans"
              payload: { plan_code: "PFV", per_diem_rate_cents: { ANTI_INFECTIVE: 12500 }, awp_discount_pct: 0.10, coinsurance_pct: 0.20, deductible_remaining_cents: 10000, oop_max_remaining_cents: 500000 }
              as: Biller
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat FV", service_state: "CA", payer_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "Niko", license_state: "CA", status: "ACTIVE" }
              as: IntakeCoordinator
              captures: { nurse_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "1234567890", diagnosis_code: "A41.9" }
              as: IntakeCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/accept"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /infusion-orders"
              payload: { referral_id: "${ref_id}", drug_id: "${drug_id}", route: "IV", daily_dose_mg: 1000, frequency_per_day: 1, start_date: "2026-06-10T00:00:00Z", scheduled_days: 5 }
              as: Pharmacist
              captures: { order_id: $.data.id }
            - call: "POST /infusion-orders/${order_id}/submit"
              payload: {}
              as: Pharmacist
            - call: "POST /nursing-visits"
              payload: { order_id: "${order_id}", nurse_id: "${nurse_id}", visit_type: "ADMINISTER", start_at: "2026-06-10T09:00:00Z", duration_min: 120 }
              as: VisitingNurse
              as_user_id: "${nurse_id}"
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /nursing-visits/${v1}/complete"
              payload: {}
              as: VisitingNurse
              as_user_id: "${nurse_id}"
          assert:
            - "InfusionOrder.${order_id}.status == ACTIVE; administered_days == 1"

      - name: visit_miss_from_scheduled
        claim_type: Valid Transition
        grounds: [state_machines.NursingVisit.SCHEDULED_to_MISSED]
        distinguishing_aspect: "POST /nursing-visits/{id}/miss moves a SCHEDULED visit to MISSED; it does not count toward administered_days."
        test_recipe:
          setup: ["a RELEASED order with two SCHEDULED visits"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: Pharmacist
            - call: "POST /drug-catalog"
              payload: { ndc_code: "NDC-MS", generic_name: "ceftriaxone", therapy_category: "ANTI_INFECTIVE", vial_size_mg: 1000, awp_per_vial_cents: 2000, is_specialty: false, requires_trough_lab: false, lot_total_vials: 100 }
              as: Pharmacist
              captures: { drug_id: $.data.id }
            - call: "POST /payer-plans"
              payload: { plan_code: "PMS", per_diem_rate_cents: { ANTI_INFECTIVE: 12500 }, awp_discount_pct: 0.10, coinsurance_pct: 0.20, deductible_remaining_cents: 10000, oop_max_remaining_cents: 500000 }
              as: Biller
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat MS", service_state: "CA", payer_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "Nyla", license_state: "CA", status: "ACTIVE" }
              as: IntakeCoordinator
              captures: { nurse_id: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_provider_npi: "1234567890", diagnosis_code: "A41.9" }
              as: IntakeCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/accept"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /infusion-orders"
              payload: { referral_id: "${ref_id}", drug_id: "${drug_id}", route: "IV", daily_dose_mg: 1000, frequency_per_day: 1, start_date: "2026-06-10T00:00:00Z", scheduled_days: 5 }
              as: Pharmacist
              captures: { order_id: $.data.id }
            - call: "POST /infusion-orders/${order_id}/submit"
              payload: {}
              as: Pharmacist
            - call: "POST /nursing-visits"
              payload: { order_id: "${order_id}", nurse_id: "${nurse_id}", visit_type: "ADMINISTER", start_at: "2026-06-10T09:00:00Z", duration_min: 120 }
              as: VisitingNurse
              as_user_id: "${nurse_id}"
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /nursing-visits/${v1}/miss"
              payload: {}
              as: VisitingNurse
              as_user_id: "${nurse_id}"
          assert:
            - "NursingVisit.${v1}.status == MISSED; InfusionOrder.${order_id}.administered_days == 0"

