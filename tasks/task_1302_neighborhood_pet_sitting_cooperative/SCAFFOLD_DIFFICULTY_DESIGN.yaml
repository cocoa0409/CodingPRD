  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (4 instances, distinct entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: settle_blocked_by_open_incident
        grounds:
          - state_machines.SittingAssignment.transitions.COMPLETED_PENDING_REVIEW_to_SETTLED
          - validations[priority=18]
          - state_machines.Incident.transitions.FILED_or_UNDER_REVIEW_to_DISMISSED
        distinguishing_aspect: |
          Pair {SittingAssignment, Incident}: SETTLED is reachable only when no
          Incident on the assignment is in FILED or UNDER_REVIEW. A FILED incident
          blocks settle with 409 ERR_UNRESOLVED_INCIDENT; dismissing the incident
          (Incident state change, a different entity) unblocks the identical settle
          call, which then posts settled == 4.00.
        test_recipe:
          setup:
            - "Founders VETTED; F1 owns pet; canonical sit completed to COMPLETED_PENDING_REVIEW (full 4h)"
            - "Incident filed on the assignment (status FILED) by owner F1"
          setup_api_calls:
            - *mk_f1
            - *mk_f2
            - *mk_f3
            - *ref_f1f2
            - *ref_f1f3
            - *ref_f2f1
            - *ref_f2f3
            - *ref_f3f1
            - *ref_f3f2
            - *liab_f1
            - *liab_f2
            - *liab_f3
            - *sub_f1
            - *sub_f2
            - *sub_f3
            - *acc_f1f2
            - *acc_f1f3
            - *acc_f2f1
            - *acc_f2f3
            - *acc_f3f1
            - *acc_f3f2
            - *fin_f1
            - *fin_f2
            - *fin_f3
            - *pet_f1
            - *req_a
            - *claim_f2
            - *accept_a
            - *get_asg
            - *get_ho
            - *clock_0830
            - *confirm_ho
            - *clock_1000
            - *checkin_1000
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T14:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/sitting-assignments/${asg_id}/checkout"
              payload: {}
              as: Member
              as_user_id: "${f2_id}"
            - call: "POST /coop/sitting-assignments/${asg_id}/incidents"
              payload: { severity: "MINOR", description: "Food bowl left empty overnight.", vet_involved: false }
              as: Member
              as_user_id: "${f1_id}"
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /coop/sitting-assignments/${asg_id}/settle"
              payload: {}
              as: CoopAdmin
              captures: { err: $.data.error_id }
            - call: "POST /coop/incidents/${inc_id}/dismiss"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/sitting-assignments/${asg_id}/settle"
              payload: {}
              as: CoopAdmin
              captures: { settled_hours: $.data.credit_hours_settled }
          assert:
            - "First settle: 409 ERR_UNRESOLVED_INCIDENT while Incident.${inc_id}.status == FILED"
            - "After Incident -> DISMISSED: second settle returns 200, SittingAssignment.${asg_id}.status == SETTLED, credit_hours_settled == 4.00"
            - "Member.${f2_id}.credit_balance_hours == 14.00 and reliability_score == 52 (settle cascade fired only after the cross-entity gate cleared)"

      - name: checkin_blocked_until_handoff
        grounds:
          - state_machines.SittingAssignment.transitions.CONFIRMED_to_IN_PROGRESS
          - validations[priority=12]
          - state_machines.AccessHandoff.transitions.PENDING_to_HANDED_OFF
        distinguishing_aspect: |
          Pair {SittingAssignment, AccessHandoff}: the CONFIRMED->IN_PROGRESS
          transition (driven by the first CHECK_IN EntryLog) is gated on the
          AccessHandoff sub-entity being HANDED_OFF. Before confirm-handoff the
          CHECK_IN is rejected with 409 ERR_ACCESS_NOT_HANDED_OFF; after the owner
          confirms the handoff, the identical CHECK_IN succeeds and flips both the
          assignment and the request to IN_PROGRESS.
        test_recipe:
          setup:
            - "Founders VETTED; F1 owns pet; canonical sit accepted (assignment CONFIRMED, handoff PENDING)"
            - "Clock at 2026-09-10T10:00:00Z (within handoff-allowed window: now >= start-2h == 08:00)"
          setup_api_calls:
            - *mk_f1
            - *mk_f2
            - *mk_f3
            - *ref_f1f2
            - *ref_f1f3
            - *ref_f2f1
            - *ref_f2f3
            - *ref_f3f1
            - *ref_f3f2
            - *liab_f1
            - *liab_f2
            - *liab_f3
            - *sub_f1
            - *sub_f2
            - *sub_f3
            - *acc_f1f2
            - *acc_f1f3
            - *acc_f2f1
            - *acc_f2f3
            - *acc_f3f1
            - *acc_f3f2
            - *fin_f1
            - *fin_f2
            - *fin_f3
            - *pet_f1
            - *req_a
            - *claim_f2
            - *accept_a
            - *get_asg
            - *get_ho
            - *clock_1000
          trigger:
            - call: "POST /coop/sitting-assignments/${asg_id}/entry-logs"
              payload: { event_type: "CHECK_IN", occurred_at: "2026-09-10T10:00:00Z" }
              as: Member
              as_user_id: "${f2_id}"
              captures: { err: $.data.error_id }
            - call: "POST /coop/access-handoffs/${ho_id}/confirm-handoff"
              payload: {}
              as: Member
              as_user_id: "${f1_id}"
            - call: "POST /coop/sitting-assignments/${asg_id}/entry-logs"
              payload: { event_type: "CHECK_IN", occurred_at: "2026-09-10T10:00:00Z" }
              as: Member
              as_user_id: "${f2_id}"
              captures: { entry_id: $.data.id }
          assert:
            - "First CHECK_IN: 409 ERR_ACCESS_NOT_HANDED_OFF while AccessHandoff.${ho_id}.status == PENDING; no EntryLog persisted"
            - "After confirm-handoff (HANDED_OFF, handed_off_at set): identical CHECK_IN returns 201"
            - "SittingAssignment.${asg_id}.status == IN_PROGRESS with actual_start_at == 2026-09-10T10:00:00Z; SittingRequest.${req_id}.status == IN_PROGRESS"

      - name: finalize_blocked_until_reciprocal_accepted
        grounds:
          - state_machines.Member.transitions.REFERENCES_PENDING_to_VETTED
          - validations[priority=9]
          - state_machines.MemberReference.transitions.PENDING_to_ACCEPTED
          - entities.MemberReference.fields.reciprocal_reference_id
        distinguishing_aspect: |
          Pair {Member, MemberReference}: finalize-vetting is gated on the mutual
          reference requirement — with two ACCEPTED primary references but the
          reciprocal rows still PENDING, finalize fails with 409
          ERR_RECIPROCITY_NOT_MET; only after both reciprocal rows (X vouching back
          for F1 and F2) reach ACCEPTED does the identical finalize succeed and post
          the 10.00 JOINING_GRANT.
