        distinguishing_aspect: |
          Completion uses current_utc >= cure_window_end (inclusive): at exactly the HIGH_EARLY cure_window_end
          (2026-06-04T10:00:00Z) complete succeeds; one minute earlier (2026-06-04T09:59:00Z) it is rejected with
          ERR_CURE_WINDOW_NOT_ELAPSED. Metric: cure-window time boundary; reached via POST /projects/{id}/complete.
        test_recipe:
          setup:
