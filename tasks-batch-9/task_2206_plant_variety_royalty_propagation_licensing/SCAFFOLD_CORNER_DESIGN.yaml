# Scaffold Corner Design (SKILL.md §1.9) for
# task_2206_plant_variety_royalty_propagation_licensing.
# Breadth probe over the nine claim-extraction-guide sections. Corners already
# asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as `excluded_because:` stubs
# citing the covering instance by name. All numeric literals were computed by
# executing the referenced calculations[].formula in code.
# Logical clock startup default: 2026-08-01T00:00:00Z.

scaffold_corner_design:
  # =====================================================================
  - section: entities
    instances:
      - name: variety_create_returns_every_declared_field_with_defaults
        claim_type: creation
        grounds:
          - entities.Variety
          - endpoints[POST /varieties]
          - response_envelope.success
        distinguishing_aspect: "POST /varieties with the five required inputs returns 201 and a data object carrying denomination, species, breeder_code, lifecycle_state CANDIDATE, brand_status BRAND_NONE, protection_posture UNPROTECTED, protected_jurisdictions [], regional_performance_index 0.00, passed_trial_region_count 0, active_sublicense_count 0, plus id, created_at, updated_at and version 1."
        test_recipe:
          setup:
            - "Empty database. Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /varieties"
              payload: { denomination: "Aurora Bramble", species: "Rubus idaeus", breeder_code: "AB", royalty_basis_default: "PER_PLANT", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "response.response_type == \"object\" and response.meta carries api_request_id and api_request_timestamp"
            - "Variety.${v_id}.denomination == \"Aurora Bramble\", species == \"Rubus idaeus\", breeder_code == \"AB\""
            - "Variety.${v_id}.lifecycle_state == CANDIDATE and brand_status == BRAND_NONE"
            - "Variety.${v_id}.protection_posture == UNPROTECTED and protected_jurisdictions == []"
            - "Variety.${v_id}.regional_performance_index == 0.00, passed_trial_region_count == 0, active_sublicense_count == 0"
            - "Variety.${v_id}.brand_mark_text is null, brand_renewal_count == 0, released_at is null"
            - "Variety.${v_id}.version == 1 and created_at == 2026-08-01T00:00:00Z"

      - name: variety_get_by_id_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /varieties/{variety_id}]
          - entities.Variety
        distinguishing_aspect: "GET /varieties/{variety_id} returns exactly the row written by the create call, field for field, with no recomputation and no version bump."
        test_recipe:
          setup:
            - "One Variety created with denomination Aurora Bramble and base_royalty_cents_per_plant 35."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Aurora Bramble", species: "Rubus idaeus", breeder_code: "AB", royalty_basis_default: "PER_ACRE", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
          trigger:
            - call: "GET /varieties/${v_id}"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "auditor-1"
          assert:
            - "HTTP status is 200 and response.data.id == ${v_id}"
            - "response.data.royalty_basis_default == \"PER_ACRE\" and base_royalty_cents_per_acre == 1200"
            - "response.data.version == 1 (a read never bumps version)"

      - name: varieties_list_reports_total_count_and_has_more_under_paging
        claim_type: listing
        grounds:
          - endpoints[GET /varieties]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three Variety rows and limit 2 / offset 0, GET /varieties returns exactly 2 items with total_count 3 and has_more true; offset 2 returns 1 item with has_more false."
        test_recipe:
          setup:
            - "Three Variety rows created in a fixed order."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Alpha Bramble", species: "Rubus idaeus", breeder_code: "AA", royalty_basis_default: "PER_PLANT", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
            - call: "POST /varieties"
              payload: { denomination: "Beta Bramble", species: "Rubus idaeus", breeder_code: "BB", royalty_basis_default: "PER_PLANT", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
            - call: "POST /varieties"
              payload: { denomination: "Gamma Bramble", species: "Vitis vinifera", breeder_code: "GB", royalty_basis_default: "PER_PLANT", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
          trigger:
            - call: "GET /varieties"
              payload: { limit: 2, offset: 0 }
              as: TrialCoordinator
              as_user_id: "coord-1"
          assert:
            - "response.response_type == \"array\" and the data list has exactly 2 items"
            - "total_count == 3 and has_more == true"
            - "GET /varieties with limit 2 and offset 2 returns 1 item, total_count 3, has_more false"
            - "GET /varieties with species \"Vitis vinifera\" returns 1 item, total_count 1, has_more false"
            - "GET /varieties with no paging inputs applies the declared defaults limit 10 and offset 0"

      - name: protection_filing_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors.ERR_PROTECTION_FILING_NOT_FOUND
          - endpoints[GET /protection-filings/{filing_id}]
        distinguishing_aspect: "A syntactically valid but unknown filing_id yields 404 ERR_PROTECTION_FILING_NOT_FOUND - the entity-specific code, not a generic one."
        test_recipe:
          setup:
            - "One Variety exists so the database is not empty; no ProtectionFiling rows exist."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Ember Bramble", species: "Rubus idaeus", breeder_code: "EB", royalty_basis_default: "PER_PLANT", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
          trigger:
            - call: "GET /protection-filings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BreederAdmin
              as_user_id: "breeder-1"
          assert:
            - "HTTP status is 404 and data.error_id == ERR_PROTECTION_FILING_NOT_FOUND"
            - "response.response_type == \"error\""
            - "GET /variety-trials/00000000-0000-4000-8000-000000000000 returns ERR_VARIETY_TRIAL_NOT_FOUND, and GET /genetic-tests/00000000-0000-4000-8000-000000000000 returns ERR_GENETIC_TEST_NOT_FOUND"

      - name: variety_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
          - endpoints[POST /varieties]
        distinguishing_aspect: "Omitting base_royalty_cents_per_acre - an input field with no declared default - returns 400 ERR_INVALID_REQUEST and writes no Variety row."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /varieties"
              payload: { denomination: "Halcyon Bramble", species: "Rubus idaeus", breeder_code: "HB", base_royalty_cents_per_plant: 35 }
              as: BreederAdmin
              as_user_id: "breeder-1"
          assert:
            - "HTTP status is 400 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /varieties returns total_count == 0"
            - "The same omission of denomination, species, breeder_code or base_royalty_cents_per_plant also returns ERR_INVALID_REQUEST"

      - name: agreement_quota_and_filing_defaults_applied_when_optional_inputs_omitted
        claim_type: defaults
        grounds:
          - entities.PropagatorAgreement.fields.quality_tier
          - entities.ProductionQuota.fields.territory_class
          - entities.ProtectionFiling.fields.term_years
          - entities.ProtectionFiling.fields.annuity_grace_days
          - entities.SublicenseGrant.fields.exclusivity
        distinguishing_aspect: "Omitting quality_tier yields TIER_B, omitting territory_class yields DOMESTIC, omitting term_years yields 20, and annuity_grace_days is 90 before any annuity is scheduled - each the exact declared default."
        test_recipe:
          setup:
            - "One Variety, one Propagator. Every optional input is omitted from the agreement, quota and filing payloads."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Ivory Bramble", species: "Rubus idaeus", breeder_code: "IB", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
            - call: "POST /propagators"
              payload: { legal_name: "Ivory Lane Nursery", home_territory_code: "US-WA" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /propagator-agreements"
              payload: { propagator_id: "${p_id}", territory_codes: ["US-WA"], term_start: "2026-08-01T00:00:00Z", term_end: "2027-08-01T00:00:00Z" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { a_id: $.data.id }
            - call: "POST /propagator-agreements/${a_id}/countersign"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-1"
            - call: "POST /production-quotas"
              payload: { agreement_id: "${a_id}", variety_id: "${v_id}", season_code: "2026S1", basis: "PER_PLANT", territory_code: "US-WA", allocated_units: 5000 }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { q_id: $.data.id }
            - call: "POST /protection-filings"
              payload: { variety_id: "${v_id}", instrument_type: "PLANT_PATENT", jurisdiction_code: "US", annuity_base_cents: 200000 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { f_id: $.data.id }
          assert:
            - "PropagatorAgreement.${a_id}.quality_tier == TIER_B"
            - "ProductionQuota.${q_id}.territory_class == DOMESTIC"
            - "ProtectionFiling.${f_id}.term_years == 20 and annuity_grace_days == 90"
            - "ProtectionFiling.${f_id}.status == DRAFT and annuity_sequence_no == 0"
            - "Variety.${v_id}.royalty_basis_default == PER_PLANT (its own declared default)"

      - name: quota_derived_unit_fields_are_computed_and_extra_field_rejected
        claim_type: computed_fields
        grounds:
          - entities.ProductionQuota.fields.units_available
          - entities.ProductionQuota.fields.tags_committed_units
          - entities.ProductionQuota.fields.tags_activated_units
          - calculations.quota_tag_inventory
          - validations[priority=3]
        distinguishing_aspect: "units_available, tags_committed_units and tags_activated_units are source: computed - a payload attempting to set units_available is rejected as an unknown field with ERR_INVALID_REQUEST, and a clean create derives units_available == allocated_units."
        test_recipe:
          setup:
            - "One Variety, one Propagator, one countersigned agreement for US-WA."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Juniper Bramble", species: "Rubus idaeus", breeder_code: "JB", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
            - call: "POST /propagators"
              payload: { legal_name: "Juniper Fields", home_territory_code: "US-WA" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { p_id: $.data.id }
            - call: "POST /propagator-agreements"
              payload: { propagator_id: "${p_id}", quality_tier: "TIER_B", territory_codes: ["US-WA"], term_start: "2026-08-01T00:00:00Z", term_end: "2027-08-01T00:00:00Z" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { a_id: $.data.id }
            - call: "POST /propagator-agreements/${a_id}/countersign"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /production-quotas"
              payload: { agreement_id: "${a_id}", variety_id: "${v_id}", season_code: "2026S1", basis: "PER_PLANT", territory_code: "US-WA", territory_class: "DOMESTIC", allocated_units: 7000, units_available: 99999 }
              as: LicensingOfficer
              as_user_id: "officer-1"
          assert:
            - "The trigger returns 400 with data.error_id == ERR_INVALID_REQUEST because units_available is not a declared input"
            - "GET /production-quotas returns total_count == 0"
            - "Repeating the create WITHOUT units_available succeeds and yields allocated_units == 7000, tags_committed_units == 0, units_available == 7000, tags_activated_units == 0"

      - name: variety_system_fields_are_server_generated_and_extra_field_rejected
        claim_type: system_fields
        grounds:
          - entities.Variety.fields.lifecycle_state
          - entities.Variety.fields.brand_status
          - endpoints[POST /varieties]
          - validations[priority=3]
        distinguishing_aspect: "lifecycle_state, brand_status, id, created_at, updated_at and version are source: system - a payload naming lifecycle_state is rejected with ERR_INVALID_REQUEST rather than silently honoured, and a clean create stamps created_at from the logical clock."
        test_recipe:
          setup:
            - "Empty database. Logical clock advanced to 2026-08-10T00:00:00Z so the stamped created_at is distinguishable from the startup default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: BreederAdmin
              as_user_id: "breeder-1"
          trigger:
            - call: "POST /varieties"
              payload: { denomination: "Kestrel Bramble", species: "Rubus idaeus", breeder_code: "KB", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200, lifecycle_state: "RELEASED" }
              as: BreederAdmin
              as_user_id: "breeder-1"
          assert:
            - "The trigger returns 400 with data.error_id == ERR_INVALID_REQUEST"
            - "Repeating the create WITHOUT lifecycle_state succeeds with lifecycle_state == CANDIDATE, version == 1 and created_at == 2026-08-10T00:00:00Z"

      - name: protection_filing_instrument_type_rejects_undeclared_enum_member
        claim_type: type_constraints
        grounds:
          - entities.ProtectionFiling.fields.instrument_type
          - entities.ProtectionFiling.fields.annuity_base_cents
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "instrument_type accepts only PLANT_PATENT or PLANT_VARIETY_CERTIFICATE, and annuity_base_cents must be >= 1000; both violations return 400 ERR_INVALID_REQUEST before any existence lookup."
        test_recipe:
          setup:
            - "One Variety exists."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Larkspur Bramble", species: "Rubus idaeus", breeder_code: "LB", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /protection-filings"
              payload: { variety_id: "${v_id}", instrument_type: "UTILITY_PATENT", jurisdiction_code: "US", annuity_base_cents: 200000 }
              as: BreederAdmin
              as_user_id: "breeder-1"
          assert:
            - "HTTP status is 400 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /protection-filings returns total_count == 0"
            - "The same call with instrument_type PLANT_PATENT and annuity_base_cents 999 also returns ERR_INVALID_REQUEST"
            - "The same call with instrument_type PLANT_VARIETY_CERTIFICATE and annuity_base_cents 200000 succeeds with status DRAFT"

      - name: genetic_test_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.GeneticTest
          - endpoints[POST /surveillance-cases/{case_id}/genetic-tests]
          - endpoints[GET /genetic-tests/{test_id}]
        distinguishing_aspect: "GeneticTest is declared common_fields: false, so its rows expose id and created_at but no updated_at and no version, and §1.5 declares no endpoint that mutates or deletes one; a second test on the same case creates a NEW row rather than amending the first."
        test_recipe:
          setup:
            - "One Variety and one SurveillanceCase moved to SAMPLED with sampled_unit_count 40."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Marlow Bramble", species: "Rubus idaeus", breeder_code: "MB", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
            - call: "POST /surveillance-cases"
              payload: { variety_id: "${v_id}", market_survey_ref: "MS-2026-014" }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
              captures: { c_id: $.data.id }
            - call: "POST /surveillance-cases/${c_id}/sample"
              payload: { sampled_unit_count: 40 }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
          trigger:
            - call: "POST /surveillance-cases/${c_id}/genetic-tests"
              payload: { lab_code: "GENLAB", marker_panel: "SSR-16", match_confidence: 0.8100 }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
              captures: { g1_id: $.data.id }
            - call: "POST /surveillance-cases/${c_id}/genetic-tests"
              payload: { lab_code: "GENLAB", marker_panel: "SSR-16", match_confidence: 0.9300 }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
              captures: { g2_id: $.data.id }
          assert:
            - "GeneticTest.${g1_id} exposes id and created_at and exposes NO updated_at and NO version field"
            - "GeneticTest.${g1_id}.result == NO_MATCH (0.8100 < 0.9000) and GeneticTest.${g2_id}.result == MATCH (0.9300 >= 0.9000)"
            - "${g1_id} != ${g2_id}: the second call appends a row rather than amending the first"
            - "GeneticTest.${g1_id}.match_confidence is still 0.8100 after the second call"
            - "GET /genetic-tests?case_id=${c_id} returns total_count == 2"
            - "SurveillanceCase.${c_id}.status == TESTING and max_match_confidence == 0.9300"

      - name: variety_trial_create_rejects_unknown_trial_site_parent
        claim_type: parent_relationships
        grounds:
          - validations[priority=5]
          - errors.ERR_TRIAL_SITE_NOT_FOUND
          - errors.ERR_VARIETY_NOT_FOUND
          - endpoints[POST /variety-trials]
        distinguishing_aspect: "Body foreign keys are resolved in the order the endpoint's input declares them, so an unknown trial_site_id with a valid variety_id returns ERR_TRIAL_SITE_NOT_FOUND, while an unknown variety_id returns ERR_VARIETY_NOT_FOUND even when the site is unknown too."
        test_recipe:
          setup:
            - "One Variety and one TrialSite exist."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Norwood Bramble", species: "Rubus idaeus", breeder_code: "NB", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
            - call: "POST /trial-sites"
              payload: { site_name: "Norwood Station", region_code: "PNW", plot_capacity: 60 }
              as: TrialCoordinator
              as_user_id: "coord-1"
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /variety-trials"
              payload: { variety_id: "${v_id}", trial_site_id: "00000000-0000-4000-8000-000000000000", plot_count: 10, plant_date: "2026-08-05T00:00:00Z", harvest_date: "2026-09-20T00:00:00Z" }
              as: TrialCoordinator
              as_user_id: "coord-1"
          assert:
            - "HTTP status is 404 and data.error_id == ERR_TRIAL_SITE_NOT_FOUND"
            - "GET /variety-trials returns total_count == 0"
            - "The same call with variety_id 00000000-0000-4000-8000-000000000000 and trial_site_id also unknown returns ERR_VARIETY_NOT_FOUND, because variety_id is declared first in the endpoint's input"
            - "The same call with both real ids succeeds with status PLANNED and TrialSite.${s_id}.occupied_plot_count == 0 (occupancy is counted at plant time)"

      - name: royalty_line_item_is_the_report_quota_junction_and_duplicate_pair_rejected
        claim_type: entity_topology_graph
        grounds:
          - entities.RoyaltyLineItem.fields.report_id
          - entities.RoyaltyLineItem.fields.quota_id
          - validations[priority=26]
          - errors.ERR_DUPLICATE_LINE_ITEM_QUOTA
          - complexity_profile.entity_topology
        distinguishing_aspect: "RoyaltyLineItem is the many-to-many junction between RoyaltyReport and ProductionQuota: one report may carry lines for several quotas and one quota may appear on several reports, but the (report_id, quota_id) pair is unique, so the second line for the same pair returns 409 ERR_DUPLICATE_LINE_ITEM_QUOTA."
        test_recipe:
          setup:
            - "One Variety, one Propagator, one ACTIVE TIER_B agreement for US-WA, two ACTIVE quotas Q1 (season 2026S1) and Q2 (season 2026S2), and two DRAFT reports R1 (2026Q3) and R2 (2026Q4)."
            - "R1 already carries one line for Q1 and one line for Q2, and R2 already carries one line for Q1 - proving the junction is many-to-many in both directions."
          setup_api_calls:
            - call: "POST /varieties"
              payload: { denomination: "Oakhill Bramble", species: "Rubus idaeus", breeder_code: "OB", base_royalty_cents_per_plant: 35, base_royalty_cents_per_acre: 1200 }
              as: BreederAdmin
              as_user_id: "breeder-1"
              captures: { v_id: $.data.id }
            - call: "POST /propagators"
              payload: { legal_name: "Oakhill Growers", home_territory_code: "US-WA" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { p_id: $.data.id }
            - call: "POST /propagator-agreements"
              payload: { propagator_id: "${p_id}", quality_tier: "TIER_B", territory_codes: ["US-WA"], term_start: "2026-08-01T00:00:00Z", term_end: "2027-08-01T00:00:00Z" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { a_id: $.data.id }
            - call: "POST /propagator-agreements/${a_id}/countersign"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-1"
            - call: "POST /production-quotas"
              payload: { agreement_id: "${a_id}", variety_id: "${v_id}", season_code: "2026S1", basis: "PER_PLANT", territory_code: "US-WA", territory_class: "DOMESTIC", allocated_units: 5000 }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { q1_id: $.data.id }
            - call: "POST /production-quotas"
              payload: { agreement_id: "${a_id}", variety_id: "${v_id}", season_code: "2026S2", basis: "PER_PLANT", territory_code: "US-WA", territory_class: "DOMESTIC", allocated_units: 5000 }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { q2_id: $.data.id }
            - call: "POST /royalty-reports"
              payload: { agreement_id: "${a_id}", period_code: "2026Q3", period_start: "2026-08-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z", due_at: "2026-11-15T00:00:00Z" }
              as: Propagator
              as_user_id: "${p_id}"
              captures: { r1_id: $.data.id, r1_v1: $.data.version }
            - call: "POST /royalty-reports/${r1_id}/line-items"
              payload: { quota_id: "${q1_id}", reported_units: 100, expected_report_version: "${r1_v1}" }
              as: Propagator
              as_user_id: "${p_id}"
            - call: "GET /royalty-reports/${r1_id}"
