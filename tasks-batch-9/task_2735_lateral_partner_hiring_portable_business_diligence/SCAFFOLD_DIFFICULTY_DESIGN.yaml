      - name: concentration_top_share_exactly_thirty_percent_grades_high
        grounds:
          - calculations.client_concentration_analysis
          - calculations.portable_book_valuation
          - entities.PortabilityAssessment.fields.top_client_share
          - entities.PortabilityAssessment.fields.concentration_grade
          - entities.PortabilityAssessment.fields.concentration_haircut_pct
