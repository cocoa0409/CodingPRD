  - section: errors
    instances:
      - name: the_submitter_of_a_campaign_review_cannot_render_its_own_review_decision_forbidden
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - validations[priority=40]
          - entities.Campaign.fields.submitted_for_review_by_user_id
        distinguishing_aspect: "AccountManager u_am_1 is entitled to call review-decision by role, yet the request is refused with ERR_SEGREGATION_OF_DUTIES (403) purely because submitted_for_review_by_user_id already records u_am_1 — the same call from u_admin would have succeeded."
        test_recipe:
          setup:
            - "SELF_SERVE advertiser ACTIVE with an APPROVED 2026-Q3 plan; a campaign with one ELIGIBLE line item was submitted for review by AccountManager u_am_1 and sits in PENDING_REVIEW."
          setup_api_calls:
            - *c_adv
            - *c_adv_sub
            - *c_adv_kyc
            - *c_plan
            - *c_plan_sub
            - *c_plan_app
            - *c_slot
            - *c_camp
            - *c_prod
            - *c_li
            - *c_pa
            - *c_li_sub
            - *c_li_app
            - *c_camp_rev
          trigger:
            - call: "POST /rmn/campaigns/${camp_id}/review-decision"
              payload: { decision: "APPROVE", decision_note: "Self approval attempt" }
              as: AccountManager
              as_user_id: "u_am_1"
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP 403"
            - "error_id == ERR_SEGREGATION_OF_DUTIES"
            - "Campaign.${camp_id}.delivery_status == PENDING_REVIEW"
            - "Campaign.${camp_id}.submitted_for_review_by_user_id == u_am_1"
            - "Campaign.${camp_id}.review_decided_by_user_id == null"

      - name: onboarding_submission_with_a_single_kyc_document_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_KYC_DOCUMENTS_INSUFFICIENT]
          - validations[priority=42]
          - state_machines.Advertiser.DRAFT_to_SUBMITTED
        distinguishing_aspect: "First-submission threshold is exactly 2 documents, so kyc_document_count 1 is refused with ERR_KYC_DOCUMENTS_INSUFFICIENT (422) and the advertiser stays DRAFT with kyc_document_count unchanged at 0 — the count is not partially applied."
        test_recipe:
          setup:
            - "A newly created SELF_SERVE advertiser in DRAFT with kyc_document_count 0."
          setup_api_calls:
            - *c_adv
          trigger:
            - call: "POST /rmn/advertisers/${adv_id}/submit-onboarding"
              payload: { kyc_document_count: 1 }
              as: AccountManager
              as_user_id: "u_am_1"
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP 422"
            - "error_id == ERR_KYC_DOCUMENTS_INSUFFICIENT"
            - "Advertiser.${adv_id}.onboarding_status == DRAFT"
            - "Advertiser.${adv_id}.kyc_document_count == 0"
            - "Advertiser.${adv_id}.onboarding_submitted_by_user_id == null"

      - name: reusing_an_existing_catalog_sku_is_rejected_with_a_duplicate_resource_code
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUPLICATE_RESOURCE_CODE]
          - validations[priority=57]
          - entities.CatalogProduct.fields.sku
        distinguishing_aspect: "sku uniqueness is global and independent of category_code, title, price or margin, so a second product declaring SKU-RED-1 in a different category is still refused with ERR_DUPLICATE_RESOURCE_CODE (409)."
        test_recipe:
          setup:
            - "One ELIGIBLE catalog product exists with sku SKU-RED-1 in category FOOTWEAR."
          setup_api_calls:
            - *c_prod
          trigger:
            - call: "POST /rmn/catalog-products"
              payload: { sku: "SKU-RED-1", category_code: "APPAREL", title: "red jacket", price_cents: 9000, in_stock_units: 20, margin_pct: 0.3 }
              as: CatalogOps
              as_user_id: "u_cat_1"
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_DUPLICATE_RESOURCE_CODE"
            - "CatalogProduct.${prod_id}.sku == SKU-RED-1"
            - "CatalogProduct.${prod_id}.category_code == FOOTWEAR"
            - "CatalogProduct.${prod_id}.in_stock_units == 50"

      - name: deleting_the_last_hero_assignment_of_an_eligible_line_item_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_HERO_ASSIGNMENT_REQUIRED]
          - validations[priority=61]
          - endpoints[DELETE /rmn/product-assignments/{id}]
        distinguishing_aspect: "The delete would leave an ELIGIBLE line item with no ACTIVE hero assignment, so the second clause of priority 61 refuses it with ERR_HERO_ASSIGNMENT_REQUIRED (422); the assignment stays ACTIVE and eligible_product_count stays 1 rather than being decremented and rolled back."
        test_recipe:
          setup:
            - "SELF_SERVE advertiser ACTIVE with an APPROVED 2026-Q3 plan, a DRAFT campaign, and one ELIGIBLE line item whose only ProductAssignment is ACTIVE with is_hero true."
          setup_api_calls:
            - *c_adv
            - *c_adv_sub
            - *c_adv_kyc
            - *c_plan
            - *c_plan_sub
            - *c_plan_app
            - *c_slot
            - *c_camp
            - *c_prod
            - *c_li
            - *c_pa
            - *c_li_sub
            - *c_li_app
            - *c_pa_read
          trigger:
            - call: "DELETE /rmn/product-assignments/${pa_id}"
              payload: {}
              as: AccountManager
              as_user_id: "u_am_1"
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP 422"
            - "error_id == ERR_HERO_ASSIGNMENT_REQUIRED"
            - "ProductAssignment.${pa_id}.assignment_status == ACTIVE"
            - "ProductAssignment.${pa_id}.is_hero == true"
            - "ProductAssignment.${pa_id}.removed_at == null"
            - "LineItem.${li_id}.line_item_status == ELIGIBLE"
            - "LineItem.${li_id}.eligible_product_count == 1"

      - name: approving_a_campaign_review_for_a_suspended_advertiser_returns_409
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ADVERTISER_NOT_ACTIVE]
          - validations[priority=27]
          - state_machines.Advertiser.ACTIVE_to_SUSPENDED
        distinguishing_aspect: "The advertiser is SUSPENDED, not REJECTED or TERMINATED, so priority 25 passes and priority 27 is the rule that fires: review approval needs onboarding_status == ACTIVE, so the answer is ERR_ADVERTISER_NOT_ACTIVE (409) and the campaign holds at PENDING_REVIEW with no reservation taken."
        test_recipe:
          setup:
            - "SELF_SERVE advertiser with an APPROVED 2026-Q3 plan and a campaign in PENDING_REVIEW submitted by u_am_1."
            - "The advertiser was then suspended by CreditAnalyst u_ca_1, so onboarding_status is SUSPENDED."
          setup_api_calls:
            - *c_adv
            - *c_adv_sub
            - *c_adv_kyc
            - *c_plan
            - *c_plan_sub
            - *c_plan_app
            - *c_slot
            - *c_camp
            - *c_prod
            - *c_li
            - *c_pa
            - *c_li_sub
            - *c_li_app
            - *c_camp_rev
            - call: "POST /rmn/advertisers/${adv_id}/suspend"
              payload: { suspension_reason: "CREDIT_BREACH" }
              as: CreditAnalyst
              as_user_id: "u_ca_1"
          trigger:
            - call: "POST /rmn/campaigns/${camp_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: NetworkAdmin
              as_user_id: "u_admin"
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_ADVERTISER_NOT_ACTIVE"
            - "Advertiser.${adv_id}.onboarding_status == SUSPENDED"
            - "Advertiser.${adv_id}.suspension_reason == CREDIT_BREACH"
            - "Campaign.${camp_id}.delivery_status == PENDING_REVIEW"
            - "BudgetPlan.${plan_id}.available_cents == 2000000"

      - name: publishing_a_study_whose_significance_score_is_below_the_minimum_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STUDY_NOT_SIGNIFICANT]
          - validations[priority=44]
          - calculations.incremental_sales_lift
        distinguishing_aspect: "With exposed_conversions 1001 against control_conversions 1000 on 10000/10000 cohorts, significance_score is round_half_up(0.0001 * 100, 4) = 0.0100, far below SIGNIFICANCE_MIN 1.96, so publication is refused with ERR_STUDY_NOT_SIGNIFICANT (422) even though lift_pct 0.0010 and incremental_sales_cents 1998 are both positive."
        test_recipe:
          setup:
            - "Baseline SELF_SERVE chain with a DELIVERING campaign and one SERVING line item."
            - "A GEO_HOLDOUT study over [2026-08-01, 2026-08-08) was started with 10000/10000 cohorts, the clock advanced to 2026-08-08, and the study measured with barely different conversion counts so it sits in MEASURING with significance_flag false."
          setup_api_calls:
            - *c_adv
            - *c_adv_sub
            - *c_adv_kyc
            - *c_plan
            - *c_plan_sub
            - *c_plan_app
            - *c_slot
            - *c_camp
            - *c_prod
            - *c_li
            - *c_pa
            - *c_li_sub
            - *c_li_app
            - *c_camp_rev
            - *c_camp_app
            - *c_camp_act
            - *c_li_act
            - *c_camp_read
            - *s_study_geo
            - *s_study_start
            - *s_clock_0808
            - call: "POST /rmn/incrementality-studies/${study_id}/measure"
              payload: { exposed_conversions: 1001, control_conversions: 1000, exposed_sales_cents: 2000000, control_sales_cents: 1990000 }
              as: MeasurementAnalyst
              as_user_id: "u_meas_1"
          trigger:
            - call: "POST /rmn/incrementality-studies/${study_id}/publish"
              payload: { publication_note: "Attempted publication" }
              as: MeasurementAnalyst
              as_user_id: "u_meas_1"
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP 422"
            - "error_id == ERR_STUDY_NOT_SIGNIFICANT"
            - "IncrementalityStudy.${study_id}.study_status == MEASURING"
            - "IncrementalityStudy.${study_id}.significance_score == 0.0100"
            - "IncrementalityStudy.${study_id}.significance_flag == false"
            - "IncrementalityStudy.${study_id}.lift_pct == 0.0010"
            - "IncrementalityStudy.${study_id}.incremental_sales_cents == 1998"
            - "Campaign.${camp_id}.incremental_revenue_cents == 0"

      - name: a_trade_fund_accrual_below_the_minimum_amount_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_AMOUNT_BELOW_MINIMUM]
          - validations[priority=75]
          - endpoints[POST /rmn/trade-fund-accounts/{id}/accruals]
        distinguishing_aspect: "MIN_ACCRUAL_CENTS is 1000, so a 500-cent accrual is refused with ERR_AMOUNT_BELOW_MINIMUM (422) and accrued_cents stays 0 — the pool is not credited with the sub-minimum amount."
        test_recipe:
          setup:
            - "SELF_SERVE advertiser ACTIVE with an OPEN 2026-Q3 TradeFundAccount whose accrued_cents is 0."
          setup_api_calls:
            - *c_adv
            - *c_adv_sub
            - *c_adv_kyc
            - *b_tfa
          trigger:
            - call: "POST /rmn/trade-fund-accounts/${tfa_id}/accruals"
              payload: { accrual_amount_cents: 500, accrual_reference: "ACC-2026-Q3-TINY" }
              as: BillingOps
              as_user_id: "u_bo_1"
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP 422"
            - "error_id == ERR_AMOUNT_BELOW_MINIMUM"
            - "TradeFundAccount.${tfa_id}.accrued_cents == 0"
            - "TradeFundAccount.${tfa_id}.available_cents == 0"
            - "TradeFundAccount.${tfa_id}.account_status == OPEN"

      - name: a_manual_deduction_above_the_unreserved_pool_balance_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_TRADE_FUND_INSUFFICIENT]
          - validations[priority=74]
          - calculations.trade_fund_available
        distinguishing_aspect: "The pool holds accrued_cents 500000 but 200000 is already reserved by the approved plan, so available_cents is 300000 and a 400000-cent manual deduction is refused with ERR_TRADE_FUND_INSUFFICIENT (402) — the check is against available_cents, not accrued_cents."
        test_recipe:
          setup:
            - "SELF_SERVE advertiser ACTIVE, an OPEN 2026-Q3 TradeFundAccount accrued at 500000, and an APPROVED 2026-Q3 plan reserving trade_fund_share_cents 200000."
          setup_api_calls:
            - *c_adv
            - *c_adv_sub
            - *c_adv_kyc
            - *b_tfa
            - *b_accrual
            - *b_plan
            - *c_plan_sub
            - *c_plan_app
            - *b_tfa_read
          trigger:
            - call: "POST /rmn/trade-fund-accounts/${tfa_id}/deductions"
              payload: { deduction_amount_cents: 400000, deduction_reference: "MAN-DED-OVER", expected_trade_fund_account_version: "${tfa_v}" }
              as: BillingOps
              as_user_id: "u_bo_1"
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP 402"
            - "error_id == ERR_TRADE_FUND_INSUFFICIENT"
            - "TradeFundAccount.${tfa_id}.accrued_cents == 500000"
            - "TradeFundAccount.${tfa_id}.reserved_cents == 200000"
            - "TradeFundAccount.${tfa_id}.deducted_cents == 0"
            - "TradeFundAccount.${tfa_id}.available_cents == 300000"

  - section: rbac
    instances:
      - name: billing_ops_calling_the_catalog_eligibility_fork_is_forbidden
        claim_type: exclusive_operations
        grounds:
          - roles.CatalogOps.exclusive_operations
          - validations[priority=3]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "POST /rmn/line-items/{id}/eligibility-decision is exclusive to CatalogOps (with NetworkAdmin as the declared superuser), so BillingOps — which owns the money endpoints and is otherwise a heavy reader of line items — is refused with ERR_ROLE_NOT_PERMITTED (403) and the line item stays PENDING_ELIGIBILITY."
        test_recipe:
          setup:
            - "SELF_SERVE advertiser ACTIVE with an APPROVED 2026-Q3 plan, a DRAFT campaign, and one line item in PENDING_ELIGIBILITY with an ACTIVE hero assignment."
          setup_api_calls:
            - *c_adv
            - *c_adv_sub
            - *c_adv_kyc
            - *c_plan
            - *c_plan_sub
            - *c_plan_app
            - *c_slot
            - *c_camp
            - *c_prod
            - *c_li
            - *c_pa
            - *c_li_sub
          trigger:
            - call: "POST /rmn/line-items/${li_id}/eligibility-decision"
              payload: { decision: "APPROVE" }
              as: BillingOps
              as_user_id: "u_bo_1"
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP 403"
            - "error_id == ERR_ROLE_NOT_PERMITTED"
            - "LineItem.${li_id}.line_item_status == PENDING_ELIGIBILITY"
            - "LineItem.${li_id}.reserved_cents == 0"
            - "PlacementSlot.${slot_id}.occupancy_count == 0"

      - name: the_auction_service_cannot_post_attributed_sales_and_is_forbidden
        claim_type: exclusive_operations
        grounds:
          - roles.MeasurementAnalyst.exclusive_operations
          - roles.AuctionService.shared_operations
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "AuctionService may create the engagement events and even settle the auction, but POST /rmn/attributed-sales is exclusive to MeasurementAnalyst, so the machine identity is refused with ERR_ROLE_NOT_PERMITTED (403) and Campaign.attributed_revenue_cents stays 0 — closed-loop revenue cannot be written by the ad server."
        test_recipe:
          setup:
            - "Baseline SELF_SERVE chain with a SETTLED CPC auction worth 284 cents and three engagement events on line item A."
          setup_api_calls:
            - *c_adv
            - *c_adv_sub
            - *c_adv_kyc
            - *c_plan
            - *c_plan_sub
            - *c_plan_app
            - *c_slot
            - *c_camp
            - *c_prod
            - *c_li
            - *c_pa
            - *c_li_sub
            - *c_li_app
            - *c_camp_rev
            - *c_camp_app
            - *c_camp_act
            - *c_li_act
            - *c_prod2
            - *c_camp_read
            - *c_li2
            - *c_pa2
            - *c_li2_sub
            - *c_li2_app
            - *c_li2_act
            - *c_auc
            - *c_rank
            - *c_award
            - *c_ev_imp
            - *c_ev_clk1
            - *c_ev_clk2
            - *c_settle
          trigger:
            - call: "POST /rmn/attributed-sales"
              payload: { engagement_event_id: "${ev_clk1_id}", catalog_product_id: "${prod_id}", retail_order_ref: "RO-3001", sale_cents: 50000, units: 1, occurred_at: "2026-08-02T00:00:00Z", match_type: "CLICK_THROUGH" }
              as: AuctionService
              as_user_id: "u_auc_1"
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP 403"
            - "error_id == ERR_ROLE_NOT_PERMITTED"
            - "Campaign.${camp_id}.attributed_revenue_cents == 0"
            - "Campaign.${camp_id}.delivered_spend_cents == 284"
            - "AuctionEvent.${auc_id}.status == SETTLED"

      - name: credit_analyst_exercises_its_exclusive_suspension_authority
        claim_type: exclusive_operations
        grounds:
          - roles.CreditAnalyst.exclusive_operations
          - state_machines.Advertiser.ACTIVE_to_SUSPENDED
          - entities.Advertiser.fields.suspension_reason
        distinguishing_aspect: "Suspension is one of CreditAnalyst's five exclusive operations, so u_ca_1 succeeds where an AccountManager would be refused; the advertiser moves ACTIVE -> SUSPENDED with suspension_reason CREDIT_BREACH while its APPROVED plan and its 2000000-cent exposure are left untouched."
        test_recipe:
          setup:
            - "SELF_SERVE advertiser ACTIVE with an APPROVED 2026-Q3 plan committed at 2000000."
          setup_api_calls:
            - *c_adv
            - *c_adv_sub
            - *c_adv_kyc
            - *c_plan
            - *c_plan_sub
            - *c_plan_app
          trigger:
            - call: "POST /rmn/advertisers/${adv_id}/suspend"
              payload: { suspension_reason: "CREDIT_BREACH" }
              as: CreditAnalyst
              as_user_id: "u_ca_1"
          assert:
            - "HTTP 200"
            - "Advertiser.${adv_id}.onboarding_status == SUSPENDED"
            - "Advertiser.${adv_id}.suspension_reason == CREDIT_BREACH"
            - "Advertiser.${adv_id}.credit_exposure_cents == 2000000"
            - "BudgetPlan.${plan_id}.plan_status == APPROVED"
            - "BudgetPlan.${plan_id}.available_cents == 2000000"

      - name: a_network_admin_that_submitted_a_budget_plan_cannot_also_approve_it
        claim_type: segregation_of_duties
        grounds:
          - roles.NetworkAdmin.shared_operations
          - validations[priority=40]
          - entities.BudgetPlan.fields.submitted_by_user_id
        distinguishing_aspect: "NetworkAdmin appears in the roles list of both submit and approve, which is exactly why the segregation-of-duties rule must still bite: because submitted_by_user_id records u_admin, that same operator's approve is refused with ERR_SEGREGATION_OF_DUTIES (403) and the plan holds at PENDING_APPROVAL with zero exposure booked."
        test_recipe:
          setup:
            - "SELF_SERVE advertiser ACTIVE with a 2026-Q3 plan committed at 2000000 (trade_fund_share_cents 0) that was submitted for approval by NetworkAdmin u_admin, so plan_status is PENDING_APPROVAL."
          setup_api_calls:
            - *c_adv
            - *c_adv_sub
            - *c_adv_kyc
            - *c_plan
            - call: "POST /rmn/budget-plans/${plan_id}/submit"
              payload: { submission_note: "Submitted by the network admin" }
              as: NetworkAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /rmn/budget-plans/${plan_id}/approve"
              payload: { approval_note: "Self approval attempt" }
              as: NetworkAdmin
              as_user_id: "u_admin"
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP 403"
            - "error_id == ERR_SEGREGATION_OF_DUTIES"
            - "BudgetPlan.${plan_id}.plan_status == PENDING_APPROVAL"
            - "BudgetPlan.${plan_id}.submitted_by_user_id == u_admin"
            - "BudgetPlan.${plan_id}.approved_by_user_id == null"
            - "Advertiser.${adv_id}.credit_exposure_cents == 0"

      - name: billing_ops_may_settle_an_awarded_auction_as_a_shared_operation
        claim_type: shared_operations
        grounds:
          - roles.BillingOps.shared_operations
          - endpoints[POST /rmn/auction-events/{id}/settle]
          - calculations.auction_settlement_amount
        distinguishing_aspect: "Auction settlement is deliberately shared between AuctionService, BillingOps and NetworkAdmin, so BillingOps u_bo_1 can close the auction that AuctionService opened, ranked and awarded; the CPC settlement still bills only the two CLICK events at the 142-cent clearing price for 284 cents."
        test_recipe:
          setup:
            - "Baseline SELF_SERVE chain with an AWARDED auction on SRP-A1 (clearing_price_cents 142) and three engagement events: an IMPRESSION at 12:05 plus CLICKs at 12:10 and 12:20."
          setup_api_calls:
            - *c_adv
            - *c_adv_sub
            - *c_adv_kyc
            - *c_plan
            - *c_plan_sub
            - *c_plan_app
            - *c_slot
            - *c_camp
            - *c_prod
            - *c_li
            - *c_pa
            - *c_li_sub
            - *c_li_app
            - *c_camp_rev
            - *c_camp_app
            - *c_camp_act
            - *c_li_act
            - *c_prod2
            - *c_camp_read
            - *c_li2
            - *c_pa2
            - *c_li2_sub
            - *c_li2_app
            - *c_li2_act
            - *c_auc
            - *c_rank
            - *c_award
            - *c_ev_imp
            - *c_ev_clk1
            - *c_ev_clk2
          trigger:
            - call: "POST /rmn/auction-events/${auc_id}/settle"
              payload: {}
              as: BillingOps
              as_user_id: "u_bo_1"
          assert:
            - "HTTP 200"
            - "AuctionEvent.${auc_id}.status == SETTLED"
            - "AuctionEvent.${auc_id}.clearing_price_cents == 142"
            - "AuctionEvent.${auc_id}.settled_spend_cents == 284"
            - "LineItem.${li_id}.spend_cents == 284"
            - "Campaign.${camp_id}.delivered_spend_cents == 284"
            - "BudgetPlan.${plan_id}.available_cents == 999716"

      - name: an_advertiser_seat_reading_another_advertisers_campaign_is_not_the_resource_owner
        claim_type: peer_roles
        grounds:
          - roles.AdvertiserUser.identity
          - validations[priority=4]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "The AdvertiserUser seat is entity-backed, so X-User-ID is an Advertiser.id: seat THIN clears the priority-3 role check because AdvertiserUser is listed on GET /rmn/campaigns/{id}, and is then stopped at priority 4 with ERR_NOT_RESOURCE_OWNER (403) because that campaign resolves to advertiser NRDV."
        test_recipe:
          setup:
            - "Advertiser NRDV is ACTIVE with an APPROVED 2026-Q3 plan and one DRAFT campaign."
            - "A second, unrelated advertiser THIN is ACTIVE and owns no campaigns."
          setup_api_calls:
