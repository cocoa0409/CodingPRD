              as_user_id: "${ch_scl}"
              captures: { e_self_claim: $.data.error_id }
          assert:
            - "the response is 403 with error_id ERR_FORBIDDEN_ROLE"

      - name: reviewer_cannot_issue_a_community_strike
        claim_type: Role exclusivity
        grounds:
          - roles.Moderator
          - roles.PlatformAdmin
        distinguishing_aspect: "Strike issuance belongs to Moderator and PlatformAdmin; a MonetizationReviewer token is rejected with 403."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One channel exists."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels"
              payload: { channel_name: "Strike Authz Channel", country_code: "US", lifetime_watch_hours: 4000, subscriber_count: 1000 }
              as: Anonymous
              captures: { ch_sa: $.data.id }
          trigger:
            - call: "POST /api/channels/${ch_sa}/strikes"
              payload: { kind: "COMMUNITY", reason_code: "HATE_SPEECH" }
              as: MonetizationReviewer
              captures: { e_strike_authz: $.data.error_id }
          assert:
            - "the response is 403 with error_id ERR_FORBIDDEN_ROLE"
