# =============================================================================
# Specialty Coffee Shop & Multi-Roast Café — SCAFFOLD (§1.0–§1.7)
# Difficulty: Expert
# =============================================================================

scenario: |
  Specialty Coffee Shop & Multi-Roast Café: menu/recipe & modifier, bean/origin
  rotation & batch-brew par, mobile order & loyalty, subscription (bag) & retail,
  equipment/maintenance & calibration, waste/shrink, catering/event, daily
  reconciliation

domain_name: specialty-coffee-shop
api_prefix: ""

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Quota / allocation"
  complexity_layers:
    - "Dual-variant calculation"
    - "Cascading side effects"
    - "Derived field reconciliation"
    - "Optimistic concurrency"

  entity_topology: flat
  # peer entities linked by foreign keys; collections are top-level, no nested URL ownership.

  state_machine_shape: parallel
  # Order carries two independent dimensions (payment_status x fulfillment_status);
  # Equipment is cyclic (OPERATIONAL <-> NEEDS_CALIBRATION); others linear/compound.

  relationship_patterns:
    - one_to_many        # Member -> Order/Subscription/CateringEvent; Equipment -> MaintenanceWindow
    - cross_aggregate    # Order fulfillment reads Equipment + BeanLot state across aggregates
    - polymorphic        # MenuItem.bean_origin matches BeanLot.origin by value, not by id

  role_model: hierarchical_override
  # Customer (own resources) < Barista (floor ops) < Manager (superset admin).

  consistency_model: immediate

  # Approximate structural dimensions (Expert band)
  entity_count: 11
  state_machine_count: 6
  calculation_count: 8
  endpoint_count: 40
  error_code_count: 26
  role_count: 3

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: BeanLot
    parent: null
    common_fields: true
    fields:
      - { name: origin, type: string, source: input, description: "Origin/single-origin key, e.g. ETHIOPIA_YIRGACHEFFE; matched by value against MenuItem.bean_origin" }
      - { name: roast_level, type: enum, source: input, description: "LIGHT | MEDIUM | DARK" }
      - { name: received_grams, type: integer, source: input, description: "Green/roasted grams received into this lot", constraints: "> 0" }
      - { name: consumed_grams, type: integer, source: computed, description: "Cumulative grams drawn by order fulfillment from this lot; starts 0" }
      - { name: waste_grams_total, type: integer, source: computed, description: "Cumulative grams removed via log-waste on this lot; starts 0" }
      - { name: on_hand_grams, type: integer, source: computed, description: "received_grams - consumed_grams - waste_grams_total; never negative" }
      - { name: par_grams, type: integer, source: input, description: "Batch-brew par / reorder threshold in grams", constraints: ">= 0" }
      - { name: price_per_gram_cents, type: integer, source: input, description: "Cost basis per gram", constraints: "> 0" }
      - { name: rotation_status, type: enum, source: system, description: "RESERVE | ACTIVE | DEPLETED; at most one ACTIVE lot per origin at a time", default: RESERVE }
      - { name: reorder_needed, type: boolean, source: computed, description: "True iff on_hand_grams <= par_grams" }

  - name: Modifier
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Modifier display name, e.g. Extra Shot, Oat Milk" }
      - { name: modifier_group, type: enum, source: input, description: "MILK | SHOT | SYRUP" }
      - { name: surcharge_cents, type: integer, source: input, description: "Added to line price per unit of the item", constraints: ">= 0" }
      - { name: extra_bean_grams, type: integer, source: input, description: "Extra beans consumed per drink when applied (e.g. SHOT adds grams)", default: 0, constraints: ">= 0" }

  - name: MenuItem
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Menu item name" }
      - { name: category, type: enum, source: input, description: "BEVERAGE | FOOD | RETAIL_BAG" }
      - { name: base_price_cents, type: integer, source: input, description: "Base price before size multiplier and modifiers", constraints: "> 0" }
      - { name: size, type: enum, source: input, description: "SMALL | MEDIUM | LARGE", default: MEDIUM }
      - { name: required_equipment_type, type: enum, source: input, description: "ESPRESSO | BATCH_BREW | GRINDER | NONE; equipment class needed to make it" }
      - { name: bean_grams, type: integer, source: input, description: "Base beans consumed per unit (before modifiers)", default: 0, constraints: ">= 0" }
      - { name: origin_required, type: boolean, source: input, description: "If true, fulfillment must draw from an ACTIVE BeanLot of bean_origin", default: false }
      - { name: bean_origin, type: string, source: input, description: "Origin value this item draws from when origin_required; null otherwise", default: null }
      - { name: availability, type: enum, source: computed, description: "AVAILABLE | UNAVAILABLE; UNAVAILABLE when required_equipment_type has no OPERATIONAL Equipment, or origin_required and no ACTIVE BeanLot with on_hand_grams > 0 for bean_origin" }

  - name: Equipment
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Equipment label, e.g. La Marzocco #1" }
      - { name: equipment_type, type: enum, source: input, description: "ESPRESSO | BATCH_BREW | GRINDER" }
      - { name: status, type: enum, source: system, description: "OPERATIONAL | NEEDS_CALIBRATION | IN_MAINTENANCE", default: OPERATIONAL }
      - { name: shots_since_calibration, type: integer, source: computed, description: "Shots pulled on this machine since last calibration; incremented by order fulfillment; reset to 0 on calibrate" }
      - { name: calibration_drift_pct, type: number, source: computed, description: "shots_since_calibration * DRIFT_PER_SHOT_PCT" }
      - { name: needs_calibration, type: boolean, source: computed, description: "True iff shots_since_calibration >= CALIBRATION_SHOT_LIMIT" }
      - { name: last_calibrated_at, type: datetime, source: system, description: "Timestamp of last calibrate; null until first calibration" }

  - name: MaintenanceWindow
    parent: null
    common_fields: true
    fields:
      - { name: equipment_id, type: string, source: input, description: "FK -> Equipment.id; the machine taken offline" }
      - { name: start_at, type: datetime, source: input, description: "Window start (ISO 8601 UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Window end (ISO 8601 UTC)", constraints: "end_at > start_at" }
      - { name: kind, type: enum, source: input, description: "CALIBRATION | REPAIR | CLEANING" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED", default: SCHEDULED }

  - name: Barista
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Barista name" }
      - { name: station_role, type: enum, source: input, description: "ESPRESSO | BAR | CATERING" }
      - { name: status, type: enum, source: input, description: "ACTIVE | ON_LEAVE; set at creation, immutable", default: ACTIVE }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique member email" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: status, type: enum, source: input, description: "ACTIVE | SUSPENDED; set at creation, immutable", default: ACTIVE }
      - { name: points_balance, type: integer, source: computed, description: "Spendable points = finalized earned - redeemed; never negative" }
      - { name: lifetime_points, type: integer, source: computed, description: "Cumulative finalized earned points; never decreases; drives tier" }
      - { name: tier, type: enum, source: computed, description: "BRONZE | SILVER | GOLD, derived from lifetime_points" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; null for guest orders", default: null }
      - { name: channel, type: enum, source: input, description: "MOBILE_APP | IN_STORE", default: MOBILE_APP }
      - { name: lines, type: array, source: input, description: "Order lines [{menu_item_id, quantity, modifier_ids:[...] }]; each line gets computed line_price_cents and line_bean_grams" }
      - { name: points_redeemed, type: integer, source: input, description: "Loyalty points redeemed at creation; each point = CENTS_PER_POINT off; must be <= member.points_balance", default: 0, constraints: ">= 0" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PAID | REFUNDED (payment dimension)", default: UNPAID }
      - { name: fulfillment_status, type: enum, source: system, description: "PLACED | FULFILLED | VOIDED (fulfillment dimension)", default: PLACED }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line_price_cents across lines" }
      - { name: service_fee_cents, type: integer, source: computed, description: "SMALL_ORDER_FEE_CENTS unless subtotal_cents >= FEE_WAIVE_SUBTOTAL_CENTS (waived to 0)" }
      - { name: discount_cents, type: integer, source: computed, description: "tier_discount + redemption_discount; see order_totals calc" }
      - { name: total_cents, type: integer, source: computed, description: "max(subtotal - discount + service_fee, 0)" }
      - { name: points_earned_provisional, type: integer, source: computed, description: "Provisional earn at placement = floor(subtotal_cents / EARN_DIVISOR_CENTS)" }
      - { name: points_earned_final, type: integer, source: computed, description: "Final earn at fulfill = floor(total_cents / EARN_DIVISOR_CENTS); null until FULFILLED" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; owning member" }
      - { name: bean_origin, type: string, source: input, description: "Preferred origin shipped each cycle" }
      - { name: frequency, type: enum, source: input, description: "WEEKLY | BIWEEKLY | MONTHLY" }
      - { name: bags_per_cycle, type: integer, source: input, description: "Retail bags shipped per cycle", constraints: "> 0" }
      - { name: next_ship_at, type: datetime, source: input, description: "Next scheduled ship date (ISO 8601 UTC)" }
      - { name: price_per_cycle_cents, type: integer, source: computed, description: "bags_per_cycle * PRICE_PER_BAG_CENTS, less member tier discount rate" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED | CANCELLED", default: ACTIVE }

  - name: CateringEvent
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; null for non-member client", default: null }
      - { name: client_name, type: string, source: input, description: "Client/host name" }
      - { name: assigned_equipment_id, type: string, source: input, description: "FK -> Equipment.id; mobile cart/machine reserved for the event" }
      - { name: assigned_barista_id, type: string, source: input, description: "FK -> Barista.id; barista staffing the event window" }
      - { name: scheduled_start, type: datetime, source: input, description: "Event start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Event end (ISO 8601 UTC)", constraints: "scheduled_end > scheduled_start" }
      - { name: headcount, type: integer, source: input, description: "Expected attendees", constraints: "> 0" }
      - { name: travel_fee_cents, type: integer, source: input, description: "Flat travel/setup fee", default: 0, constraints: ">= 0" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "headcount * PER_HEAD_CENTS + travel_fee_cents" }
      - { name: deposit_cents, type: integer, source: computed, description: "round_half_up(quoted_total_cents * DEPOSIT_RATE)" }
      - { name: status, type: enum, source: system, description: "QUOTED | CONFIRMED | CANCELLED", default: QUOTED }

  - name: DailyReconciliation
    parent: null
    common_fields: true
    fields:
      - { name: business_date, type: string, source: input, description: "Business date label (YYYY-MM-DD); unique across reconciliations" }
      - { name: bean_lot_id, type: string, source: input, description: "FK -> BeanLot.id; the lot physically counted at close" }
      - { name: status, type: enum, source: system, description: "OPEN | COUNTING | CLOSED", default: OPEN }
      - { name: opening_bean_on_hand_grams, type: integer, source: system, description: "Snapshot of bean_lot.on_hand_grams taken at OPEN" }
      - { name: opening_waste_grams, type: integer, source: system, description: "Snapshot of bean_lot.waste_grams_total taken at OPEN" }
      - { name: counted_revenue_cents, type: integer, source: input, description: "Physically counted till revenue; set by submit-count", default: null }
      - { name: counted_bean_on_hand_grams, type: integer, source: input, description: "Physical bean count at close; set by submit-count", default: null }
      - { name: expected_revenue_cents, type: integer, source: computed, description: "Sum of total_cents over orders with payment_status=PAID and fulfillment_status=FULFILLED; computed at close" }
      - { name: revenue_variance_cents, type: integer, source: computed, description: "counted_revenue_cents - expected_revenue_cents; computed at close" }
      - { name: ledger_usage_grams, type: integer, source: computed, description: "opening_bean_on_hand_grams - bean_lot.on_hand_grams at close (sales + waste, chronological book)" }
      - { name: logged_waste_grams, type: integer, source: computed, description: "bean_lot.waste_grams_total - opening_waste_grams at close" }
      - { name: expected_usage_grams, type: integer, source: computed, description: "ledger_usage_grams - logged_waste_grams (recipe/sales-driven forward usage)" }
      - { name: shrink_grams, type: integer, source: computed, description: "bean_lot.on_hand_grams - counted_bean_on_hand_grams at close (unexplained physical loss)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: BeanLot
    field: rotation_status
    initial_state: RESERVE
    terminal_states: [DEPLETED]
    note: "At most one ACTIVE lot per origin. DEPLETED is terminal (a spent lot is never revived)."
    transitions:
      - from: RESERVE
        to: ACTIVE
        trigger: "POST /bean-lots/{id}/activate"
        actor: Manager
        preconditions:
          - "Lot on_hand_grams > 0"
        side_effects:
          - "If another lot of the same origin is currently ACTIVE, that lot transitions ACTIVE -> RESERVE (supersede)"
          - "This lot becomes the origin's ACTIVE draw target"

      - from: ACTIVE
        to: RESERVE
        trigger: "system (a different RESERVE lot of the same origin is activated)"
        actor: system
        preconditions: []
        side_effects:
          - "Stops being the origin's draw target"

      - from: ACTIVE
        to: DEPLETED
        trigger: "system (on_hand_grams reaches 0 via order fulfillment or log-waste)"
        actor: system
        preconditions:
          - "on_hand_grams == 0"
        side_effects:
          - "Cascade: the oldest RESERVE lot of the same origin (by created_at ASC) is auto-activated (RESERVE -> ACTIVE) if one exists"

  - entity: Equipment
    field: status
    initial_state: OPERATIONAL
    terminal_states: []
    note: "Cyclic: OPERATIONAL <-> NEEDS_CALIBRATION via drift + calibrate; OPERATIONAL <-> IN_MAINTENANCE via maintenance windows."
    transitions:
      - from: OPERATIONAL
        to: NEEDS_CALIBRATION
        trigger: "system (order fulfillment pushes shots_since_calibration >= CALIBRATION_SHOT_LIMIT)"
        actor: system
        preconditions:
          - "shots_since_calibration >= CALIBRATION_SHOT_LIMIT"
        side_effects:
          - "Equipment no longer OPERATIONAL; MenuItems requiring this equipment_type may become UNAVAILABLE if no other OPERATIONAL machine of the type exists"

      - from: NEEDS_CALIBRATION
        to: OPERATIONAL
        trigger: "POST /equipment/{id}/calibrate"
        actor: Barista
        preconditions: []
        side_effects:
          - "shots_since_calibration reset to 0; calibration_drift_pct reset to 0; last_calibrated_at stamped"

      - from: OPERATIONAL
        to: OPERATIONAL
        trigger: "POST /equipment/{id}/calibrate"
        actor: Barista
        preconditions: []
        note: "Calibrating an already-OPERATIONAL machine is allowed; resets shot counter/drift."
        side_effects:
          - "shots_since_calibration reset to 0; calibration_drift_pct reset to 0; last_calibrated_at stamped"

      - from: OPERATIONAL
        to: IN_MAINTENANCE
        trigger: "system (a MaintenanceWindow is created for this equipment)"
        actor: system
        preconditions: []
        side_effects:
          - "Equipment offline; Cascade: CONFIRMED CateringEvents on this equipment whose [scheduled_start, scheduled_end) overlaps the window transition CONFIRMED -> CANCELLED"

      - from: NEEDS_CALIBRATION
        to: IN_MAINTENANCE
        trigger: "system (a MaintenanceWindow is created for this equipment)"
        actor: system
        preconditions: []
        side_effects:
          - "Equipment offline; Cascade: CONFIRMED CateringEvents on this equipment overlapping the window transition CONFIRMED -> CANCELLED"

      - from: IN_MAINTENANCE
        to: OPERATIONAL
        trigger: "POST /maintenance-windows/{id}/complete or POST /maintenance-windows/{id}/cancel"
        actor: Barista
        preconditions: []
        side_effects:
          - "Equipment back online; if the completed window kind == CALIBRATION, shots_since_calibration reset to 0 and last_calibrated_at stamped"

  - entity: MaintenanceWindow
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /maintenance-windows/{id}/complete"
        actor: Barista
        preconditions:
          - "Equipment is IN_MAINTENANCE for this window"
        side_effects:
          - "Equipment IN_MAINTENANCE -> OPERATIONAL; if kind == CALIBRATION, reset shots_since_calibration and stamp last_calibrated_at"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /maintenance-windows/{id}/cancel"
        actor: Barista
        preconditions: []
        side_effects:
          - "Equipment IN_MAINTENANCE -> OPERATIONAL"

  - entity: Order
    field: fulfillment_status
    initial_state: PLACED
    terminal_states: [VOIDED]
    note: "Fulfillment dimension; evolves independently of payment_status."
    transitions:
      - from: PLACED
        to: FULFILLED
        trigger: "POST /orders/{id}/fulfill"
        actor: Barista
        preconditions:
          - "Every line's MenuItem.required_equipment_type has an OPERATIONAL Equipment (cross-entity: Order -> Equipment)"
          - "Every origin_required line has an ACTIVE BeanLot for its bean_origin with on_hand_grams >= line_bean_grams (cross-entity: Order -> BeanLot)"
        side_effects:
          - "For each line: draw line_bean_grams from the origin's ACTIVE BeanLot (consumed_grams += grams) [cascade hop 1]"
          - "If a drawn BeanLot reaches on_hand_grams == 0 it transitions ACTIVE -> DEPLETED [cascade hop 2], which auto-activates the oldest RESERVE lot of that origin [cascade hop 3]"
          - "Increment shots_since_calibration on the OPERATIONAL ESPRESSO Equipment by the number of espresso shots pulled (base + SHOT modifiers)"
          - "Compute points_earned_final = floor(total_cents / EARN_DIVISOR_CENTS); credit member.lifetime_points and member.points_balance by points_earned_final"

      - from: PLACED
        to: VOIDED
        trigger: "POST /orders/{id}/void"
        actor: Barista
        preconditions: []
        side_effects:
          - "Restore any redeemed points: member.points_balance += points_redeemed"
          - "If payment_status == PAID, payment_status -> REFUNDED"

      - from: FULFILLED
        to: VOIDED
        trigger: "POST /orders/{id}/void"
        actor: Barista
        preconditions: []
        side_effects:
          - "Compensation: for each line restore line_bean_grams to the BeanLot it was drawn from (consumed_grams -= grams) — invariant: BeanLot.on_hand_grams returns to its pre-fulfill value"
          - "Reverse loyalty: member.lifetime_points -= points_earned_final; member.points_balance -= points_earned_final; member.points_balance += points_redeemed"
          - "If payment_status == PAID, payment_status -> REFUNDED"

  - entity: Order
    field: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    note: "Payment dimension; parallel to fulfillment_status."
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /orders/{id}/pay"
        actor: Customer
        preconditions:
          - "fulfillment_status != VOIDED"
        side_effects:
          - "Records payment of total_cents"

      - from: PAID
        to: REFUNDED
        trigger: "system (order voided while PAID)"
        actor: system
        preconditions: []
        side_effects:
          - "Refund of total_cents recorded"

  - entity: Subscription
    field: status
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (a newer Subscription is created for the same member)"
        actor: system
        preconditions: []
        side_effects:
          - "Prior subscription stops billing; the new subscription is the member's ACTIVE one"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects: []

  - entity: CateringEvent
    field: status
    initial_state: QUOTED
    terminal_states: [CANCELLED]
    note: "CONFIRMED is the committed operational state; CANCELLED is terminal."
    transitions:
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /catering-events/{id}/confirm"
        actor: Barista
        preconditions:
          - "assigned_barista.status == ACTIVE (cross-entity: CateringEvent -> Barista)"
          - "assigned_equipment.status == OPERATIONAL (cross-entity: CateringEvent -> Equipment)"
          - "No other CONFIRMED CateringEvent on assigned_barista_id whose [scheduled_start, scheduled_end) overlaps this event (half-open; back-to-back allowed)"
        side_effects:
          - "Event committed; deposit_cents is due"

      - from: [QUOTED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /catering-events/{id}/cancel or system (assigned equipment enters IN_MAINTENANCE overlapping the event)"
        actor: "Barista or system"
        preconditions: []
        side_effects:
          - "Releases the barista's window and the equipment reservation"

  - entity: DailyReconciliation
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: COUNTING
        trigger: "POST /daily-reconciliations/{id}/submit-count"
        actor: Barista
        preconditions: []
        side_effects:
          - "Records counted_revenue_cents and counted_bean_on_hand_grams; increments version"

      - from: COUNTING
        to: COUNTING
        trigger: "POST /daily-reconciliations/{id}/submit-count (re-submit corrected counts, supersedes prior)"
        actor: Barista
        preconditions: []
        side_effects:
          - "Overwrites counted_revenue_cents and counted_bean_on_hand_grams; increments version"

      - from: COUNTING
        to: CLOSED
        trigger: "POST /daily-reconciliations/{id}/close"
        actor: Manager
        preconditions:
          - "counted_revenue_cents and counted_bean_on_hand_grams are set (a count was submitted)"
        side_effects:
          - "Compute expected_revenue_cents, revenue_variance_cents, ledger_usage_grams, logged_waste_grams, expected_usage_grams, shrink_grams; reconciliation is locked (immutable)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: subscription-create-stale-member
    parent_entity: Member
    write_endpoint: "POST /subscriptions"
    occ_field: "expected_member_version"
    description: |
      Creating a Subscription against a Member whose version has advanced since
      the client last observed it is rejected. A new subscription legitimately
      supersedes the member's prior ACTIVE subscription; a create carrying a
      stale member version reflects a view taken before another supersede and is
      refused as a precondition failure.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: reconciliation-submit-count-stale
    parent_entity: DailyReconciliation
    write_endpoint: "POST /daily-reconciliations/{id}/submit-count"
    occ_field: "expected_reconciliation_version"
    description: |
      Submitting counts against a DailyReconciliation whose version has advanced
      since the client last read it is rejected. Re-submitting counts while
      COUNTING legitimately supersedes the prior draft; a submission carrying a
      stale reconciliation version reflects an outdated draft and is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_line_price
    trigger: "order create (per line); recomputed never after (lines immutable)"
    algorithm: tiered_pricing
    formula: |
      size_multiplier = SIZE_MULT[menu_item.size]           # tiered-rate selection
      sized_base_cents = round_half_up(menu_item.base_price_cents * size_multiplier)
      modifier_sum_cents = sum(modifier.surcharge_cents for modifier_id in line.modifier_ids)
      line_price_cents = (sized_base_cents + modifier_sum_cents) * line.quantity
      line_bean_grams  = (menu_item.bean_grams + sum(modifier.extra_bean_grams for modifier_id in line.modifier_ids)) * line.quantity
    input_set: "The line's MenuItem and its referenced Modifiers only"
    constants:
      SIZE_MULT: { SMALL: 1.0, MEDIUM: 1.25, LARGE: 1.5 }
    precision: "integer cents; multiplication rounded round_half_up at the sized_base step, before adding modifiers"

  - name: order_totals
    trigger: "order create; recomputed on fulfill only for points (see order_points)"
    algorithm: constraint_propagation
    formula: |
      # Circular-looking: total depends on service_fee, service_fee depends on a spend tier,
      # and the spend tier could be read off the total. Evaluation order is PINNED to break it:
      #   (1) subtotal_cents = sum(line_price_cents)
      #   (2) spend_tier is keyed on subtotal_cents (NOT total_cents)
      #   (3) service_fee_cents = 0 if subtotal_cents >= FEE_WAIVE_SUBTOTAL_CENTS else SMALL_ORDER_FEE_CENTS
      #   (4) tier_discount_cents = round_half_up(subtotal_cents * TIER_DISCOUNT_RATE[member.tier])  (0 for guest)
      #   (5) redemption_discount_cents = min(points_redeemed * CENTS_PER_POINT, subtotal_cents)
      #   (6) discount_cents = tier_discount_cents + redemption_discount_cents
      #   (7) total_cents = max(subtotal_cents - discount_cents + service_fee_cents, 0)
      subtotal_cents = sum(line_price_cents)
      service_fee_cents = 0 if subtotal_cents >= FEE_WAIVE_SUBTOTAL_CENTS else SMALL_ORDER_FEE_CENTS
      tier_discount_cents = round_half_up(subtotal_cents * TIER_DISCOUNT_RATE[member.tier])
      redemption_discount_cents = min(points_redeemed * CENTS_PER_POINT, subtotal_cents)
      discount_cents = tier_discount_cents + redemption_discount_cents
      total_cents = max(subtotal_cents - discount_cents + service_fee_cents, 0)
    input_set: "The order's lines plus the owning member's tier (guest => BRONZE/no discount)"
    constants:
      FEE_WAIVE_SUBTOTAL_CENTS: 2000
      SMALL_ORDER_FEE_CENTS: 50
      CENTS_PER_POINT: 5
      TIER_DISCOUNT_RATE: { BRONZE: 0.0, SILVER: 0.05, GOLD: 0.10 }
    precision: "integer cents; each round_half_up applied to its own product; discounts summed then subtracted (both taken off the ORIGINAL subtotal, not sequentially)"

  - name: order_points
    trigger: "order create (provisional); POST /orders/{id}/fulfill (final)"
    algorithm: aggregation
    formula: |
      # Nested rounding order PINNED as sum-then-floor (NOT per-line-then-sum):
      points_earned_provisional = floor(subtotal_cents / EARN_DIVISOR_CENTS)   # at placement, off subtotal
      points_earned_final       = floor(total_cents    / EARN_DIVISOR_CENTS)   # at fulfill, off amount payable
    input_set: "Order subtotal_cents (provisional) and total_cents (final)"
    constants:
      EARN_DIVISOR_CENTS: 100
    precision: "floor division on the whole-order amount; per-line flooring is explicitly NOT used"
    variants:
      - name: provisional
        when: "computed at order placement, before loyalty discount/fee finalize"
        difference: "earns off subtotal_cents (pre-discount, pre-fee); does NOT touch member balances"
      - name: final
        when: "computed at fulfill"
        difference: "earns off total_cents (post-discount, post-fee); credits member.lifetime_points and points_balance"

  - name: bean_inventory_shrink
    trigger: "POST /daily-reconciliations/{id}/close"
    algorithm: chronological
    formula: |
      ledger_usage_grams  = opening_bean_on_hand_grams - bean_lot.on_hand_grams   # sales + waste (book)
      logged_waste_grams  = bean_lot.waste_grams_total - opening_waste_grams
      expected_usage_grams = ledger_usage_grams - logged_waste_grams              # sales-only (recipe-driven)
      shrink_grams        = bean_lot.on_hand_grams - counted_bean_on_hand_grams   # unexplained physical loss
    input_set: "The reconciliation's bean_lot, snapshots taken at OPEN, and the physical count at submit"
    precision: "integer grams; shrink may be negative (found stock) or positive (lost stock)"
    variants:
      - name: expected_usage
        when: "recipe/sales-driven forward estimate of grams consumed by drinks"
        difference: "excludes logged waste: expected_usage_grams = ledger_usage_grams - logged_waste_grams"
      - name: ledger_usage
        when: "chronological book value of all decrements since OPEN"
        difference: "includes both sales and waste: ledger_usage_grams = opening_on_hand - closing_book_on_hand"

  - name: reconciliation_revenue
    trigger: "POST /daily-reconciliations/{id}/close"
    algorithm: aggregation
    formula: |
      expected_revenue_cents = sum(order.total_cents
                                   for order where order.payment_status == PAID
                                                and order.fulfillment_status == FULFILLED)
      revenue_variance_cents = counted_revenue_cents - expected_revenue_cents
    input_set: "All orders in payment_status=PAID AND fulfillment_status=FULFILLED (VOIDED/REFUNDED excluded)"
    precision: "integer cents; variance may be negative (short) or positive (over)"

  - name: loyalty_tier
    trigger: "member read; recomputed whenever lifetime_points changes (order fulfill/void)"
    algorithm: threshold
    formula: |
      tier = GOLD   if lifetime_points >= GOLD_MIN
             SILVER if lifetime_points >= SILVER_MIN
             BRONZE otherwise
    input_set: "member.lifetime_points"
    constants:
      SILVER_MIN: 500
      GOLD_MIN: 1000
    precision: "boundary is inclusive: lifetime_points == GOLD_MIN yields GOLD (>=, not >)"

  - name: bean_reorder_status
    trigger: "bean-lot read; recomputed whenever on_hand_grams changes"
    algorithm: threshold
    formula: |
      reorder_needed = (on_hand_grams <= par_grams)
    input_set: "bean_lot.on_hand_grams and bean_lot.par_grams"
    precision: "boundary is inclusive: on_hand_grams == par_grams yields reorder_needed == true (<=, not <)"

  - name: espresso_shot_count
    trigger: "POST /orders/{id}/fulfill"
    algorithm: aggregation
    formula: |
      shots_pulled = sum over lines where menu_item.required_equipment_type == ESPRESSO of
                     (1 + count(SHOT-group modifiers on the line)) * line.quantity
      # On fulfill, add shots_pulled to the OPERATIONAL ESPRESSO Equipment's shots_since_calibration.
      # If shots_since_calibration >= CALIBRATION_SHOT_LIMIT afterwards, that Equipment auto-transitions
      # OPERATIONAL -> NEEDS_CALIBRATION.
    input_set: "The order's ESPRESSO lines and their SHOT modifiers"
    constants:
      CALIBRATION_SHOT_LIMIT: 4
      DRIFT_PER_SHOT_PCT: 0.1
    precision: "integer shot count; boundary inclusive (>= limit triggers NEEDS_CALIBRATION)"

  - name: catering_quote
    trigger: "catering-event create"
    algorithm: aggregation
    formula: |
      quoted_total_cents = headcount * PER_HEAD_CENTS + travel_fee_cents
      deposit_cents      = round_half_up(quoted_total_cents * DEPOSIT_RATE)
    input_set: "The event's headcount and travel_fee_cents"
    constants:
      PER_HEAD_CENTS: 1500
      DEPOSIT_RATE: 0.25
    precision: "integer cents; deposit rounded round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7; entity_backed roles may only act on resources they own"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path and body-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target resource is in a state permitting the requested transition (includes Member.status == ACTIVE for order placement, and OCC parent state)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints; order/subscription/catering create"

  - priority: 5
    category: business_referential
    check: "Cross-entity referenced resources are in the required status (assigned barista ACTIVE, assigned equipment OPERATIONAL, ACTIVE bean lot present for origin_required lines, required equipment type OPERATIONAL)"
    error_id: varies
    http_status: 409
    applies_to: "order fulfill, catering confirm"

  - priority: 6
    category: business_temporal
    check: "Requested interval does not overlap a conflicting existing interval on the same resource"
    error_id: varies
    http_status: 409
    applies_to: "maintenance-window create (buffered on Equipment), catering confirm (half-open on Barista)"

  - priority: 7
    category: business_constraint
    check: "Uniqueness and structural constraints (unique member email, unique reconciliation business_date, order has >= 1 line, end_at > start_at)"
    error_id: varies
    http_status: 422
    applies_to: "member/reconciliation/order/maintenance-window/catering create"

  - priority: 8
    category: business_fiscal
    check: "Fiscal capacity: points_redeemed <= member.points_balance; bean draw <= ACTIVE lot on_hand_grams"
    error_id: varies
    http_status: 422
    applies_to: "order create (redemption), order fulfill (bean capacity)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------------- BeanLot ----------------
  - method: POST
    path: "/bean-lots"
    description: "Create a bean lot (rotation_status=RESERVE)."
    roles: [Manager]
    code: 201
    input: [origin, roast_level, received_grams, par_grams, price_per_gram_cents]
    output: BeanLot
    side_effects: ["consumed_grams=0, waste_grams_total=0, on_hand_grams=received_grams, rotation_status=RESERVE"]

  - method: GET
    path: "/bean-lots/{id}"
    description: "Fetch a bean lot."
    roles: [Manager, Barista]
    code: 200
    input: []
    output: BeanLot
    side_effects: []

  - method: GET
    path: "/bean-lots"
    description: "List bean lots with optional filters."
    roles: [Manager, Barista]
    code: 200
    input: ["origin?", "rotation_status?", "limit?", "offset?"]
    output: BeanLot[]
    side_effects: []

  - method: POST
    path: "/bean-lots/{id}/activate"
    description: "Activate a RESERVE lot as the origin's ACTIVE draw target."
    roles: [Manager]
    code: 200
    input: []
    output: BeanLot
    side_effects: ["RESERVE -> ACTIVE; supersede prior ACTIVE lot of same origin -> RESERVE"]

  - method: POST
    path: "/bean-lots/{id}/log-waste"
    description: "Record waste/shrink against a lot (spoilage, calibration purge, spill)."
    roles: [Manager, Barista]
    code: 200
    input: [grams, reason]
    output: BeanLot
    side_effects:
      - "waste_grams_total += grams; on_hand_grams decreases"
      - "If ACTIVE lot reaches on_hand_grams == 0 -> DEPLETED, auto-activate oldest RESERVE lot of origin"

  # ---------------- Modifier ----------------
  - method: POST
    path: "/modifiers"
    description: "Create a menu modifier."
    roles: [Manager]
    code: 201
    input: [name, modifier_group, surcharge_cents, "extra_bean_grams?"]
    output: Modifier
    side_effects: []

  - method: GET
    path: "/modifiers"
    description: "List modifiers."
    roles: [Manager, Barista, Customer]
    code: 200
    input: ["modifier_group?", "limit?", "offset?"]
    output: Modifier[]
    side_effects: []

  # ---------------- MenuItem ----------------
  - method: POST
    path: "/menu-items"
    description: "Create a menu item / recipe."
    roles: [Manager]
    code: 201
    input: [name, category, base_price_cents, required_equipment_type, "size?", "bean_grams?", "origin_required?", "bean_origin?"]
    output: MenuItem
    side_effects: []

  - method: GET
    path: "/menu-items/{id}"
    description: "Fetch a menu item (availability computed live)."
    roles: [Manager, Barista, Customer]
    code: 200
    input: []
    output: MenuItem
    side_effects: []

  # ---------------- Equipment ----------------
  - method: POST
    path: "/equipment"
    description: "Register equipment (status=OPERATIONAL)."
    roles: [Manager]
    code: 201
    input: [name, equipment_type]
    output: Equipment
    side_effects: ["shots_since_calibration=0, status=OPERATIONAL"]

  - method: GET
    path: "/equipment/{id}"
    description: "Fetch equipment."
    roles: [Manager, Barista]
    code: 200
    input: []
    output: Equipment
    side_effects: []

  - method: POST
    path: "/equipment/{id}/calibrate"
    description: "Calibrate equipment; resets shot counter and drift."
    roles: [Manager, Barista]
    code: 200
    input: []
    output: Equipment
    side_effects: ["NEEDS_CALIBRATION/OPERATIONAL -> OPERATIONAL; shots_since_calibration=0; last_calibrated_at stamped"]

  # ---------------- MaintenanceWindow ----------------
  - method: POST
    path: "/maintenance-windows"
    description: "Schedule a maintenance window; takes the equipment IN_MAINTENANCE and cancels overlapping CONFIRMED catering."
    roles: [Manager, Barista]
    code: 201
    input: [equipment_id, start_at, end_at, kind]
    output: MaintenanceWindow
    side_effects:
      - "Equipment -> IN_MAINTENANCE"
      - "CONFIRMED CateringEvents on this equipment overlapping the window -> CANCELLED"

  - method: GET
    path: "/maintenance-windows/{id}"
    description: "Fetch a maintenance window."
    roles: [Manager, Barista]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: []

  - method: GET
    path: "/maintenance-windows"
    description: "List maintenance windows (filter by equipment)."
    roles: [Manager, Barista]
    code: 200
    input: ["equipment_id?", "status?", "limit?", "offset?"]
    output: MaintenanceWindow[]
    side_effects: []

  - method: POST
    path: "/maintenance-windows/{id}/complete"
    description: "Complete a maintenance window; returns equipment OPERATIONAL."
    roles: [Manager, Barista]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: ["SCHEDULED -> COMPLETED; Equipment -> OPERATIONAL; if kind==CALIBRATION reset shot counter"]

  - method: POST
    path: "/maintenance-windows/{id}/cancel"
    description: "Cancel a scheduled maintenance window."
    roles: [Manager, Barista]
    code: 200
    input: []
    output: MaintenanceWindow
    side_effects: ["SCHEDULED -> CANCELLED; Equipment -> OPERATIONAL"]

  # ---------------- Barista ----------------
  - method: POST
    path: "/baristas"
    description: "Create a barista staff record."
    roles: [Manager]
    code: 201
    input: [name, station_role, "status?"]
    output: Barista
    side_effects: []

  - method: GET
    path: "/baristas/{id}"
    description: "Fetch a barista."
    roles: [Manager, Barista]
    code: 200
    input: []
    output: Barista
    side_effects: []

  # ---------------- Member ----------------
  - method: POST
    path: "/members"
    description: "Register a loyalty member."
    roles: [Manager]
    code: 201
    input: [email, full_name, "status?"]
    output: Member
    side_effects: ["points_balance=0, lifetime_points=0, tier=BRONZE"]

  - method: GET
    path: "/members/{id}"
    description: "Fetch a member (tier computed live)."
    roles: [Manager, Barista, Customer]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: POST
    path: "/members/{id}/point-adjustments"
    description: "Manual loyalty adjustment (grant/deduct lifetime and/or spendable points); recomputes tier."
    roles: [Manager]
    code: 200
    input: ["lifetime_points_delta?", "points_balance_delta?"]
    output: Member
    side_effects: ["member.lifetime_points += lifetime_points_delta; member.points_balance += points_balance_delta; tier recomputed"]

  # ---------------- Order ----------------
  - method: POST
    path: "/orders"
    description: "Create a mobile/in-store order (fulfillment=PLACED, payment=UNPAID). Computes provisional totals and points, redeems points."
    roles: [Customer, Barista, Manager]
    code: 201
    input: ["member_id?", "channel?", lines, "points_redeemed?"]
    output: Order
    side_effects:
      - "Compute line prices/grams, subtotal, service_fee, discount, total, points_earned_provisional"
      - "If points_redeemed > 0: member.points_balance -= points_redeemed"

  - method: GET
    path: "/orders/{id}"
    description: "Fetch an order."
    roles: [Customer, Barista, Manager]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/orders"
    description: "List orders (filter by member/status)."
    roles: [Customer, Barista, Manager]
    code: 200
    input: ["member_id?", "fulfillment_status?", "payment_status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: POST
    path: "/orders/{id}/pay"
    description: "Mark an order paid (payment dimension)."
    roles: [Customer, Barista, Manager]
    code: 200
    input: []
    output: Order
    side_effects: ["payment_status UNPAID -> PAID"]

  - method: POST
    path: "/orders/{id}/fulfill"
    description: "Fulfill an order: draw beans, pull shots, finalize points."
    roles: [Barista, Manager]
    code: 200
    input: []
    output: Order
    side_effects:
      - "fulfillment_status PLACED -> FULFILLED"
      - "Draw beans from ACTIVE lots; deplete/promote cascade; increment espresso shot counters; credit final points"

  - method: POST
    path: "/orders/{id}/void"
    description: "Void an order: compensate beans/points, refund if paid."
    roles: [Barista, Manager]
    code: 200
    input: []
    output: Order
    side_effects:
      - "fulfillment_status -> VOIDED"
      - "Restore redeemed points; if FULFILLED restore beans and reverse earned points; if PAID -> REFUNDED"

  # ---------------- Subscription ----------------
  - method: POST
    path: "/subscriptions"
    description: "Create a bag subscription for a member (supersedes prior ACTIVE). OCC on member version."
    roles: [Customer, Manager]
    code: 201
    input: [member_id, bean_origin, frequency, bags_per_cycle, next_ship_at, expected_member_version]
    output: Subscription
    side_effects:
      - "Prior ACTIVE subscription of member -> SUPERSEDED"
      - "Compute price_per_cycle_cents from member tier"
      - "increments Member.version by 1"

  - method: GET
    path: "/subscriptions/{id}"
    description: "Fetch a subscription."
    roles: [Customer, Manager]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: GET
    path: "/subscriptions"
    description: "List subscriptions (filter by member)."
    roles: [Customer, Manager]
    code: 200
    input: ["member_id?", "status?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []

  - method: POST
    path: "/subscriptions/{id}/cancel"
    description: "Cancel an ACTIVE subscription."
    roles: [Customer, Manager]
    code: 200
    input: []
    output: Subscription
    side_effects: ["ACTIVE -> CANCELLED"]

  # ---------------- CateringEvent ----------------
  - method: POST
    path: "/catering-events"
    description: "Create a catering quote (status=QUOTED); computes quote and deposit."
    roles: [Customer, Barista, Manager]
    code: 201
    input: ["member_id?", client_name, assigned_equipment_id, assigned_barista_id, scheduled_start, scheduled_end, headcount, "travel_fee_cents?"]
    output: CateringEvent
    side_effects: ["Compute quoted_total_cents and deposit_cents"]

  - method: GET
    path: "/catering-events/{id}"
    description: "Fetch a catering event."
    roles: [Customer, Barista, Manager]
    code: 200
    input: []
    output: CateringEvent
    side_effects: []

  - method: GET
    path: "/catering-events"
    description: "List catering events (filter by member/equipment/barista)."
    roles: [Customer, Barista, Manager]
    code: 200
    input: ["member_id?", "assigned_equipment_id?", "assigned_barista_id?", "status?", "limit?", "offset?"]
    output: CateringEvent[]
    side_effects: []

  - method: POST
    path: "/catering-events/{id}/confirm"
    description: "Confirm a quoted event; checks barista/equipment status and barista overlap."
    roles: [Barista, Manager]
    code: 200
    input: []
    output: CateringEvent
    side_effects: ["QUOTED -> CONFIRMED"]

  - method: POST
    path: "/catering-events/{id}/cancel"
    description: "Cancel a catering event."
    roles: [Customer, Barista, Manager]
    code: 200
    input: []
    output: CateringEvent
    side_effects: ["QUOTED/CONFIRMED -> CANCELLED"]

  # ---------------- DailyReconciliation ----------------
  - method: POST
    path: "/daily-reconciliations"
    description: "Open a daily reconciliation for a business_date and bean lot; snapshots opening counts."
    roles: [Manager]
    code: 201
    input: [business_date, bean_lot_id]
    output: DailyReconciliation
    side_effects: ["status=OPEN; snapshot opening_bean_on_hand_grams and opening_waste_grams from bean_lot"]

  - method: GET
    path: "/daily-reconciliations/{id}"
    description: "Fetch a reconciliation."
    roles: [Manager, Barista]
    code: 200
    input: []
    output: DailyReconciliation
    side_effects: []

  - method: GET
    path: "/daily-reconciliations"
    description: "List reconciliations (filter by bean lot/status)."
    roles: [Manager, Barista]
    code: 200
    input: ["bean_lot_id?", "status?", "limit?", "offset?"]
    output: DailyReconciliation[]
    side_effects: []

  - method: POST
    path: "/daily-reconciliations/{id}/submit-count"
    description: "Submit / resubmit physical counts (OCC on reconciliation version)."
    roles: [Manager, Barista]
    code: 200
    input: [counted_revenue_cents, counted_bean_on_hand_grams, expected_reconciliation_version]
    output: DailyReconciliation
    side_effects:
      - "OPEN -> COUNTING (or COUNTING -> COUNTING); record counted_revenue_cents and counted_bean_on_hand_grams"
      - "increments DailyReconciliation.version by 1"

  - method: POST
    path: "/daily-reconciliations/{id}/close"
    description: "Close and lock a reconciliation; computes variance and shrink."
    roles: [Manager]
    code: 200
    input: []
    output: DailyReconciliation
    side_effects: ["COUNTING -> CLOSED; compute expected_revenue, revenue_variance, ledger_usage, logged_waste, expected_usage, shrink"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID header" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation, or entity_backed role acting on a resource it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource (path or body id) does not exist" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body, missing required field, or invalid enum/type" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_MEMBER_SUSPENDED, http: 409, condition: "Order placement attempted for a member whose status is SUSPENDED" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_EMPTY_ORDER, http: 422, condition: "Order created with zero lines" }
  - { id: ERR_INVALID_QUANTITY, http: 422, condition: "Order line quantity is not a positive integer" }
  - { id: ERR_DUPLICATE_EMAIL, http: 422, condition: "Member email already registered" }
  - { id: ERR_DUPLICATE_BUSINESS_DATE, http: 422, condition: "A reconciliation already exists for the business_date" }
  - { id: ERR_INVALID_INTERVAL, http: 422, condition: "end_at <= start_at (maintenance window or catering event)" }
  - { id: ERR_EQUIPMENT_UNAVAILABLE, http: 409, condition: "Required equipment type has no OPERATIONAL machine (order fulfill), or assigned equipment not OPERATIONAL (catering confirm)" }
  - { id: ERR_BEAN_LOT_UNAVAILABLE, http: 409, condition: "An origin_required line has no ACTIVE bean lot for its bean_origin" }
  - { id: ERR_BARISTA_UNAVAILABLE, http: 409, condition: "Assigned barista status is not ACTIVE at catering confirm" }
  - { id: ERR_MAINTENANCE_OVERLAP, http: 409, condition: "Maintenance window overlaps another SCHEDULED window on the same equipment within the buffer" }
  - { id: ERR_BARISTA_OVERLAP, http: 409, condition: "Catering confirm collides with another CONFIRMED event on the same barista (half-open overlap)" }
  - { id: ERR_INSUFFICIENT_POINTS, http: 422, condition: "points_redeemed exceeds member.points_balance" }
  - { id: ERR_INSUFFICIENT_BEANS, http: 422, condition: "Order fulfillment would draw more grams than the ACTIVE lot's on_hand_grams" }
  - { id: ERR_COUNT_NOT_SUBMITTED, http: 409, condition: "Reconciliation close attempted before a count was submitted" }
  - { id: ERR_ALREADY_ACTIVE, http: 409, condition: "Activating a bean lot that is already ACTIVE" }
  - { id: ERR_LOT_DEPLETED, http: 409, condition: "Operating on a DEPLETED bean lot (activate/log-waste)" }
  - { id: ERR_ROSTER_MISMATCH, http: 403, condition: "Barista X-User-ID does not match an existing Barista, or Customer X-User-ID does not match an existing Member" }
  - { id: ERR_NOT_OWNER, http: 403, condition: "Customer acting on an order/subscription/catering event whose member_id is not their own" }
  - { id: ERR_INVALID_REDEMPTION, http: 422, condition: "points_redeemed is negative" }
  - { id: ERR_INVALID_WASTE, http: 422, condition: "log-waste grams is not a positive integer or exceeds on_hand_grams" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Manager
    description: "Superset operator: configures menu/recipes/modifiers, beans, equipment, baristas, members, and runs reconciliation. Can perform every Barista and Customer operation (hierarchical override)."
    identity: "opaque"
    exclusive_operations:
      - "POST /bean-lots — create bean lot"
      - "POST /bean-lots/{id}/activate — activate lot"
      - "POST /modifiers — create modifier"
      - "POST /menu-items — create menu item"
      - "POST /equipment — register equipment"
      - "POST /baristas — create barista"
      - "POST /members — register member"
      - "POST /members/{id}/point-adjustments — manual loyalty adjustment"
      - "POST /daily-reconciliations — open reconciliation"
      - "POST /daily-reconciliations/{id}/close — close reconciliation"
    shared_operations:
      - "All GET endpoints"
      - "POST /bean-lots/{id}/log-waste (with Barista)"
      - "POST /equipment/{id}/calibrate (with Barista)"
      - "POST /maintenance-windows and /complete and /cancel (with Barista)"
      - "POST /orders, /pay, /fulfill, /void (with Customer/Barista)"
      - "POST /subscriptions, /cancel (with Customer)"
      - "POST /catering-events, /confirm, /cancel (with Customer/Barista)"
      - "POST /daily-reconciliations/{id}/submit-count (with Barista)"

  - name: Barista
    description: "Floor staff: operates orders, calibration/maintenance, waste logging, catering confirmation, and count submission. Cannot configure catalog/beans/members or close reconciliation."
    identity: "entity_backed:Barista"
    exclusive_operations:
      - "POST /orders/{id}/fulfill — fulfill order"
      - "POST /orders/{id}/void — void order"
      - "POST /catering-events/{id}/confirm — confirm event"
    shared_operations:
      - "GET bean-lots/equipment/maintenance-windows/baristas/members/orders/catering-events/reconciliations"
      - "POST /bean-lots/{id}/log-waste (with Manager)"
      - "POST /equipment/{id}/calibrate (with Manager)"
      - "POST /maintenance-windows, /complete, /cancel (with Manager)"
      - "POST /orders (with Customer/Manager)"
      - "POST /orders/{id}/pay (with Customer/Manager)"
      - "POST /catering-events, /cancel (with Customer/Manager)"
      - "POST /daily-reconciliations/{id}/submit-count (with Manager)"

  - name: Customer
    description: "Loyalty member acting on their own resources: places/pays orders, manages own subscription, requests catering. X-User-ID must equal the acting Member.id; may only touch resources whose member_id is their own."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /orders — create own order (member_id must equal X-User-ID)"
      - "POST /orders/{id}/pay — pay own order"
      - "POST /subscriptions — create own subscription"
      - "POST /subscriptions/{id}/cancel — cancel own subscription"
      - "POST /catering-events — request own catering quote"
      - "POST /catering-events/{id}/cancel — cancel own catering event"
      - "GET /members/{id}, /orders, /subscriptions, /catering-events, /menu-items/{id}, /modifiers — own/read"
