            - "$.data.error_id != ERR_CLAIM_NOT_SUBSTANTIATED"
            - "0 CaseLabel rows exist for SupplierLot.${lot_id}"
            - "SupplierLot.${lot_id}.intake_status == CASED"
            - "Counter.${counter_id}.posture == RESTRICTED"
            - "Counter.${counter_id}.open_excursion_count == 1"
            - "SustainabilityCertification.${cert_id}.status == REVOKED"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: ice_bed_reading_exactly_at_limit_is_compliant
        grounds:
          - calculations.cold_chain_exposure
          - entities.IceBedReading.fields.breach
          - state_machines.SupplierLot.intake_status.CASED_to_HELD
        distinguishing_aspect: |
          ICE_BED_LIMIT_C is compared with a STRICT greater-than: a reading of exactly 4.4 C
          sets breach false and opens no excursion, while the very next reading at 4.5 C sets
          breach true and holds the slot's lot, so an implementation using >= fails on the
          first call.
        test_recipe:
          setup:
            - "logical clock advanced to 2026-08-01T14:00:00Z"
            - "SupplierLot of Atlantic Cod, intake_status CASED in slot 1"
            - "no IceBedReading and no ColdChainExcursion yet exist for the counter"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id }
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Gulf Bay Dealers", permit_number: "PERMIT-8801" }
              as: ChainAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /seafood-ops/species"
