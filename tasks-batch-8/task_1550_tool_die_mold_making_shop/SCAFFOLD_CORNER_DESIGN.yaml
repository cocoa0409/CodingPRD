      - name: milestone_out_of_sequence_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.BuildMilestone.PENDING_to_EARNED, "errors[ERR_MILESTONE_SEQUENCE_BLOCKED]"]
        distinguishing_aspect: "Completing milestone seq 2 while seq 1 is PENDING fails ERR_MILESTONE_SEQUENCE_BLOCKED; after completing seq 1 the same call succeeds (seq order is a hard gate)."
        test_recipe:
          setup: ["CLASS_103 job BOOKED with its six milestones"]
          setup_api_calls:
