          assert:
            - "${c1} == 1, ${c2} == 2 and ${c3} == 3 — adjustment_note is optional and its absence still counts as an adjustment"
            - "After the three accepted calls DeviceDispense.${disp_id}.fit_status is still \"FITTED\" and billing_status is still \"INVOICED\""
            - "The fourth call returns HTTP 409 with error.id == \"ERR_ADJUSTMENT_LIMIT_REACHED\""
            - "DeviceDispense.${disp_id}.adjustment_count is still 3 — a rejected adjustment does not increment the counter"
