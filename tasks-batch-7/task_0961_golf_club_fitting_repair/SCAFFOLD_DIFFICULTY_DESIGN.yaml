  - rule_id: boundary_precision_check
    instances:
      - name: lesson_package_exactly_exhausted_blocks_booking
        grounds:
          - entities.LessonPackage.fields.credits_used
          - state_machines.LessonPackage.ACTIVE_to_EXHAUSTED
          - errors[ERR_NO_CREDITS_REMAINING]
        distinguishing_aspect: |
          Metric: credit COUNT at exact equality. Booking consumes the last
          credit (credits_used == total_credits flips the package EXHAUSTED);
          the very next booking on that package is rejected with
          ERR_NO_CREDITS_REMAINING. Endpoint: POST /golf-shop/fitting-sessions.
        test_recipe:
          setup:
            - "Customer C; specialist FS; two AVAILABLE bays; LessonPackage total_credits 1, expires 2027-01-01, status ACTIVE"
            - "One booked session already consumed the single credit"
