            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv2: $.data.version } }
            - { call: "POST /baselines/${bl}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv2}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /programs/${prog}/activate", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /risk-entries", payload: { program_id: "${prog}", title: "R1", category: "COST", probability_pct: 50, impact_cents: 400000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { r1: $.data.id } }
            - { call: "POST /risk-entries/${r1}/assess", payload: { probability_pct: 50, impact_cents: 400000 }, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /owner-reports", payload: { program_id: "${prog}", period: "2026-08" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { rep_aug: $.data.id, aug_eac: $.data.eac_commitment_based_cents } }
          trigger:
            - { call: "POST /risk-entries/${r1}/close", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { rst: $.data.status } }
            - { call: "POST /owner-reports", payload: { program_id: "${prog}", period: "2026-09" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { sep_eac: $.data.eac_commitment_based_cents } }
            - { call: "GET /owner-reports/${rep_aug}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { aug_eac2: $.data.eac_commitment_based_cents } }
          assert:
            - "aug_eac == 200000   # ASSESSED risk included"
            - "rst == CLOSED"
            - "sep_eac == 0   # CLOSED risk excluded from the input set"
            - "aug_eac2 == 200000   # DRAFT report not refreshed by a non-fiscal event"

  - section: validations
    instances:
      - name: auth_missing_x_user_id_header_returns_400
        claim_type: priority_ordering
        grounds:
          - "validations[priority=1]"
          - "validations[priority=2]"
        distinguishing_aspect: "Priority 1 beats priority 2: a request without X-User-ID fails ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) even when the role is valid and the payload is fine."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /programs", payload: { program_name: "P-AUTH", owner_organization: "O" }, as: OwnerRepPM, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: existence_beats_state_on_charter_decide
        claim_type: priority_ordering
        grounds:
          - "validations[priority=4]"
          - "validations[priority=5]"
          - "errors[ERR_CHARTER_NOT_FOUND]"
        distinguishing_aspect: "Priority 4 beats priority 5: decide against a non-existent charter id returns 404 ERR_CHARTER_NOT_FOUND, not a state or OCC error."
        test_recipe:
          setup: ["one program exists; its current version captured"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_name: "P-EXI", owner_organization: "O" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { prog: $.data.id } }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv: $.data.version } }
          trigger:
            - { call: "POST /charters/11111111-1111-4111-8111-111111111111/decide", payload: { decision: "APPROVE", expected_program_version: "${pv}" }, as: Owner, as_user_id: "owner-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_CHARTER_NOT_FOUND   # 404 beats any state/version check"

      - name: engagement_end_before_start_returns_400
        claim_type: violation_to_error
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Request-shape validation fires before any state or temporal check: scheduled_end <= scheduled_start is ERR_INVALID_REQUEST at priority 3."
        test_recipe:
          setup: ["Program ACTIVE (minimal); group G1"]
