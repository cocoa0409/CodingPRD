  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: zone_seat_conservation_issue_then_revoke
        grounds:
          - state_machines.Permit.DRAFT_to_ISSUED
          - state_machines.Permit.ACTIVE_to_REVOKED
          - entities.Zone.fields.active_permit_count
        distinguishing_aspect: |
          Conserved quantity = zone seat occupancy. Invariant: zone.active_permit_count == count of Permits in
          {ISSUED,ACTIVE,SUSPENDED} FK-linked to the zone. Issuing increments and revoking decrements so the count exactly tracks occupancy with zero drift.
        test_recipe:
          setup:
            - "Zone Z1 permit_cap 5. One permit issued then activated (active_permit_count=1)."
          setup_api_calls:
            - call: "POST /zones"
              payload: { zone_code: "Z1", str_eligible: true, whole_home_allowed: true, permit_cap: 5, lottery_enabled: false }
              as: CityRegistrar
              captures: { zone_id: $.data.id }
            - call: "POST /hosts"
              payload: { email: "z1@x.com", full_name: "Host Z1" }
              as: CityRegistrar
              captures: { host_id: $.data.id }
            - call: "POST /properties"
              payload: { host_id: "${host_id}", zone_id: "${zone_id}", street_address: "Z1 Elm St", bedroom_count: 3 }
              as: CityRegistrar
              captures: { prop_id: $.data.id }
            - call: "POST /hosts/${host_id}/attest-primary-residence"
              payload: { property_id: "${prop_id}" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /permits"
              payload: { property_id: "${prop_id}", permit_type: "PRIMARY_RESIDENCE", attested_occupancy: 5, safety_attested: true, nightly_base_rate_cents: 20000 }
              as: CityRegistrar
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/issue"
              payload: {}
              as: CityRegistrar
            - call: "POST /permits/${permit_id}/activate"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /complaints"
              payload: { permit_id: "${permit_id}", category: "UNPERMITTED" }
              as: CityRegistrar
              captures: { c1_id: $.data.id }
            - call: "POST /complaints/${c1_id}/uphold"
              payload: {}
              as: CityRegistrar
            - call: "POST /complaints"
              payload: { permit_id: "${permit_id}", category: "UNPERMITTED" }
              as: CityRegistrar
              captures: { c2_id: $.data.id }
          trigger:
            - call: "POST /complaints/${c2_id}/uphold"
              payload: {}
              as: CityRegistrar
            - call: "GET /zones/${zone_id}"
              payload: {}
              as: CityRegistrar
              captures: { apc: $.data.active_permit_count }
          assert:
            - "Permit.${permit_id}.status == REVOKED"
            - "Zone.${zone_id}.active_permit_count == 0"

      - name: filing_money_conservation_remit_covers_due_plus_penalty
        grounds:
          - state_machines.TaxFiling.FILED_to_DELINQUENT
          - state_machines.TaxFiling.DELINQUENT_to_REMITTED
          - entities.TaxFiling.fields.amount_remitted_cents
          - calculations.tax_penalty
        distinguishing_aspect: |
          Conserved quantity = money owed. Invariant: a DELINQUENT filing reaches REMITTED only when
          amount_remitted_cents >= tot_due_cents + penalty_cents; the paid total equals the obligation with no residual owed — a monetary conservation distinct from the seat-count conservation.
        test_recipe:
          setup:
            - "A DELINQUENT filing tot_due_cents=43000, penalty_cents=3575 (5 days late), amount_remitted 0."
          setup_api_calls:
            - call: "POST /zones"
              payload: { zone_code: "Z2", str_eligible: true, whole_home_allowed: true, permit_cap: 5, lottery_enabled: false }
              as: CityRegistrar
              captures: { zone_id: $.data.id }
            - call: "POST /hosts"
              payload: { email: "z2@x.com", full_name: "Host Z2" }
              as: CityRegistrar
              captures: { host_id: $.data.id }
            - call: "POST /properties"
              payload: { host_id: "${host_id}", zone_id: "${zone_id}", street_address: "Z2 Elm St", bedroom_count: 3 }
              as: CityRegistrar
              captures: { prop_id: $.data.id }
            - call: "POST /hosts/${host_id}/attest-primary-residence"
              payload: { property_id: "${prop_id}" }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /permits"
              payload: { property_id: "${prop_id}", permit_type: "PRIMARY_RESIDENCE", attested_occupancy: 5, safety_attested: true, nightly_base_rate_cents: 20000 }
              as: CityRegistrar
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/issue"
              payload: {}
              as: CityRegistrar
            - call: "POST /tax-filings"
              payload: { permit_id: "${permit_id}", period_year: 2026, period_month: 3, nights_booked: 10, gross_revenue_cents: 500000 }
              as: TaxOfficer
              captures: { filing_id: $.data.id }
            - call: "POST /tax-filings/${filing_id}/file"
              payload: {}
              as: TaxOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T00:00:00Z" }
              as: TaxOfficer
            - call: "GET /tax-filings/${filing_id}"
              payload: {}
              as: TaxOfficer
              captures: { pen: $.data.penalty_cents }
          trigger:
            - call: "POST /tax-filings/${filing_id}/remit"
              payload: { payment_cents: 46575 }
              as: Host
              as_user_id: "${host_id}"
              captures: { st: $.data.status, ar: $.data.amount_remitted_cents }
          assert:
            - "TaxFiling.${filing_id}.status == REMITTED"
            - "TaxFiling.${filing_id}.amount_remitted_cents == 46575"
