          - state_machines.LCA.CERTIFIED_to_WITHDRAWN
        distinguishing_aspect: |
          After LCA withdrawal denies a SUBMITTED petition, re-submitting fails both the
          state check (petition DENIED, priority 7) and the referential check (LCA WITHDRAWN,
          priority 8); ERR_INVALID_STATE wins. Pair = state vs business_referential.
        test_recipe:
          setup:
            - "A petition was SUBMITTED then DENIED via LCA withdrawal; the LCA is WITHDRAWN."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "101010101", legal_name: "Iota Co", employee_count: 11 }
