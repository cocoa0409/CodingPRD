      - name: account_migration_requires_billing_transition_done
        grounds:
          - state_machines.CustomerAccount.LEGACY_to_MIGRATED
          - validations[priority=12]
        distinguishing_aspect: |
          Entity pair CustomerAccount -> TransitionItem: migrating a LEGACY account while
          the target's BILLING_RECORDS TransitionItem is still PENDING is rejected with
          ERR_TRANSITION_PREREQ even though the target is in CLOSING — a different entity
          pair than RegulatoryApplication -> CouncilEvent.
        test_recipe:
          setup:
            - "Target T in CLOSING (regulatory application APPROVED); LEGACY customer account CA; BILLING_RECORDS transition item still PENDING"
          setup_api_calls:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T", municipality_name: "M", state_code: "PA", system_type: "WATER", customer_count: 10, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
              as: AcquisitionAnalyst
              captures: { t_id: $.data.id }
