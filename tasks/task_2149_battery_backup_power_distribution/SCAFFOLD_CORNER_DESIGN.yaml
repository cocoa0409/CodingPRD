        grounds:
          - validations[priority=4]
          - errors[ERR_BATTERY_MODEL_NOT_FOUND]
        distinguishing_aspect: "Each collection carries its own 404 code; a well-formed UUID that matches no row on this collection returns ERR_BATTERY_MODEL_NOT_FOUND and never a neighbouring collection's code."
