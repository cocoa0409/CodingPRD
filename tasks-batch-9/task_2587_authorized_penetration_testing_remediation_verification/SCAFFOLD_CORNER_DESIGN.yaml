            - call: "POST /pentest/engagements"
              payload: { test_plan_id: "${plan_id}", scope_item_id: "${si_a_id}", engagement_type: "APPLICATION_TEST", window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-30T23:59:59Z", hours_allocated: 80 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { eng_id: $.data.id, exec_state: $.data.execution_state, auth_state: $.data.authorization_state }
          assert:
            - "HTTP 409 and ${err_plan} == ERR_PLAN_NOT_ACTIVE while the plan is DRAFT, even though the candidate is only PROPOSED"
            - "${st} == ACTIVE with ${cov} == 100.00 — the tier-3 candidate never entered the coverage denominator"
            - "HTTP 409 and ${err_scope} == ERR_SCOPE_ITEM_NOT_APPROVED for the DEFERRED candidate on an ACTIVE plan"
