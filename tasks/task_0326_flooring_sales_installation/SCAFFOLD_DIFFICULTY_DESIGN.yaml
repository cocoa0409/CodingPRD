  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: slot_cancel_restores_crew_day_capacity
        grounds:
          - state_machines.InstallSlot.SCHEDULED_to_CANCELLED
          - calculations.crew_day_load
          - entities.InstallCrew.fields.daily_sqft_capacity
        distinguishing_aspect: "Conserved quantity #1 = crew free day capacity (daily_sqft_capacity - sum of SCHEDULED scheduled_sqft on that day). Scheduling a slot consumes 399; cancelling it (compensating action) restores the day load to 0, so a fresh 600-sqft slot then fits exactly: free capacity is unchanged across schedule+cancel."
        test_recipe:
          setup:
            - "Crew capacity 600; one ACCEPTED CARPET job measured 380 -> billable 399.0 scheduled then cancelled; a second ACCEPTED CARPET job measured 571.43 -> billable 600.0 then schedulable same day (would have failed if the 399 had not been released)."
