          setup: ["An ACCEPTED 10.00-ton MXP_54 lot at 3.00% contamination (grade nominal_yield_pct 48.00, max_contamination_pct 3.00) and a QUEUED batch on OCC_LINE charging all 10.000 tons toward TL_140."]
