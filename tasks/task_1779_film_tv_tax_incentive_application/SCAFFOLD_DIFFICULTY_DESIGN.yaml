            - { call: "POST /api/applications/${app_id}/issue-credit", payload: {}, as: FilmOfficeAdmin, captures: { cert_id: $.data.id } }
            - { call: "POST /api/clawback-cases", payload: { application_id: "${app_id}", trigger_reason: "MISREPRESENTATION", penalty_mode: "SIMPLE", shortfall_amount_cents: 1000000 }, as: FilmOfficeAdmin, captures: { case_id: $.data.id, case_status: $.data.status, case_cert: $.data.certificate_id } }
          assert:
            - "Pre-issuance create: error_id == ERR_INVALID_STATE_TRANSITION (http 409)"
            - "Post-issuance create: 201, status == OPENED, certificate_id == ${cert_id} (derived, not supplied)"
            - "GET /api/clawback-cases?application_id=${app_id} returns exactly 1 case"

  - rule_id: resource_temporal_overlap
    instances:
      - name: program_window_interval_overlap_half_open
        grounds:
          - errors[ERR_PROGRAM_WINDOW_OVERLAP]
          - state_machines.JurisdictionProgram.DRAFT_to_OPEN
          - entities.JurisdictionProgram.fields.window_opens_at
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN interval-vs-interval overlap on the
          jurisdiction_code calendar (resource: JurisdictionProgram). A second
          GA program whose window [2027-06-15, 2028-01-01) intersects the
          incumbent [2026-08-01, 2027-07-01) is rejected; one whose window
          starts EXACTLY at the incumbent's close (2027-07-01T00:00:00Z)
          touches without overlapping and is allowed.
        test_recipe:
          setup:
            - "GA program with window [2026-08-01T00:00:00Z, 2027-07-01T00:00:00Z) created (DRAFT counts for the overlap check — only CLOSED is excluded)"
          setup_api_calls:
            - { call: "POST /api/jurisdiction-programs", payload: { jurisdiction_code: "GA", program_name: "GA Film Credit FY27", fiscal_year: "FY2027", window_opens_at: "2026-08-01T00:00:00Z", window_closes_at: "2027-07-01T00:00:00Z", annual_cap_cents: 100000000, minimum_qualified_spend_cents: 10000000, base_rate_standard: 0.25, base_rate_elevated: 0.30, elevated_tier_threshold_cents: 200000000, atl_cap_pct: 0.40, resident_uplift_pct: 0.025, transfer_price_floor_pct: 0.90, vendor_verification_validity_days: 365, appeal_window_days: 30, daily_interest_rate: 0.0005, credit_validity_days: 1095, transfer_proposal_validity_days: 14 }, as: FilmOfficeAdmin, captures: { prog_a: $.data.id } }
          trigger:
            - { call: "POST /api/jurisdiction-programs", payload: { jurisdiction_code: "GA", program_name: "GA Film Credit FY28 Overlap", fiscal_year: "FY2028", window_opens_at: "2027-06-15T00:00:00Z", window_closes_at: "2028-01-01T00:00:00Z", annual_cap_cents: 100000000, minimum_qualified_spend_cents: 10000000, base_rate_standard: 0.25, base_rate_elevated: 0.30, elevated_tier_threshold_cents: 200000000, atl_cap_pct: 0.40, resident_uplift_pct: 0.025, transfer_price_floor_pct: 0.90, vendor_verification_validity_days: 365, appeal_window_days: 30, daily_interest_rate: 0.0005, credit_validity_days: 1095, transfer_proposal_validity_days: 14 }, as: FilmOfficeAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /api/jurisdiction-programs", payload: { jurisdiction_code: "GA", program_name: "GA Film Credit FY28 Adjacent", fiscal_year: "FY2028", window_opens_at: "2027-07-01T00:00:00Z", window_closes_at: "2028-07-01T00:00:00Z", annual_cap_cents: 100000000, minimum_qualified_spend_cents: 10000000, base_rate_standard: 0.25, base_rate_elevated: 0.30, elevated_tier_threshold_cents: 200000000, atl_cap_pct: 0.40, resident_uplift_pct: 0.025, transfer_price_floor_pct: 0.90, vendor_verification_validity_days: 365, appeal_window_days: 30, daily_interest_rate: 0.0005, credit_validity_days: 1095, transfer_proposal_validity_days: 14 }, as: FilmOfficeAdmin, captures: { prog_b: $.data.id, prog_b_status: $.data.status } }
            - { call: "POST /api/jurisdiction-programs", payload: { jurisdiction_code: "NM", program_name: "NM Film Credit FY27", fiscal_year: "FY2027", window_opens_at: "2026-10-01T00:00:00Z", window_closes_at: "2027-04-01T00:00:00Z", annual_cap_cents: 50000000, minimum_qualified_spend_cents: 5000000, base_rate_standard: 0.25, base_rate_elevated: 0.30, elevated_tier_threshold_cents: 100000000, atl_cap_pct: 0.40, resident_uplift_pct: 0.025, transfer_price_floor_pct: 0.90, vendor_verification_validity_days: 365, appeal_window_days: 30, daily_interest_rate: 0.0005, credit_validity_days: 1095, transfer_proposal_validity_days: 14 }, as: FilmOfficeAdmin, captures: { prog_c: $.data.id } }
          assert:
            - "Overlapping same-jurisdiction create: error_id == ERR_PROGRAM_WINDOW_OVERLAP (http 409)"
            - "Back-to-back create (opens == incumbent closes): HTTP 201, status DRAFT — half-open adjacency is NOT an overlap"
            - "Different jurisdiction_code (NM) with a fully overlapping window: HTTP 201 — the resource under contention is the jurisdiction calendar, not time itself"

      - name: vendor_verification_point_containment
        grounds:
          - state_machines.SpendEntry.PENDING_REVIEW_to_QUALIFIED
          - errors[ERR_VERIFICATION_WINDOW_EXPIRED]
          - entities.Vendor.fields.verified_at
        distinguishing_aspect: |
          Interval semantics: POINT-in-half-open-interval containment on the
          vendor verification timeline (resource: Vendor) — spend_date ==
          verified_at (window START) is INSIDE and qualifies; spend_date ==
          verified_at + 365 days (window END) is OUTSIDE (exclusive) and
          fails. Different interval geometry and different resource than the
          program-window overlap rule.
        test_recipe:
          setup:
            - "GA program OPEN; application APPROVED; vendor VERIFIED at the default clock 2026-08-01T00:00:00Z -> validity window [2026-08-01T00:00:00Z, 2027-08-01T00:00:00Z)"
            - "Entry X spend_date 2026-08-01T00:00:00Z (exact window start); entry Y spend_date 2027-08-01T00:00:00Z (exact window end)"
          setup_api_calls:
            - { call: "POST /api/jurisdiction-programs", payload: { jurisdiction_code: "GA", program_name: "GA Film Credit FY27", fiscal_year: "FY2027", window_opens_at: "2026-08-01T00:00:00Z", window_closes_at: "2027-07-01T00:00:00Z", annual_cap_cents: 100000000, minimum_qualified_spend_cents: 10000000, base_rate_standard: 0.25, base_rate_elevated: 0.30, elevated_tier_threshold_cents: 200000000, atl_cap_pct: 0.40, resident_uplift_pct: 0.025, transfer_price_floor_pct: 0.90, vendor_verification_validity_days: 365, appeal_window_days: 30, daily_interest_rate: 0.0005, credit_validity_days: 1095, transfer_proposal_validity_days: 14 }, as: FilmOfficeAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /api/jurisdiction-programs/${prog_id}/transition", payload: { to_state: "OPEN" }, as: FilmOfficeAdmin }
            - { call: "POST /api/production-companies", payload: { legal_name: "Peachtree Pictures LLC", fein: "58-1002003", contact_email: "ops@peachtree.example" }, as: Producer, captures: { co_id: $.data.id } }
