            - { call: "GET /volunteers/${v}", as: ShopCoordinator, captures: { es: $.data.engagement_status, ns: $.data.no_show_count } }
            - { call: "GET /shifts/${sh4}", as: ShopCoordinator, captures: { sh4_st: $.data.status } }
          assert:
            - "sweep.shifts_marked_no_show == 3"
            - "sweep.participants_expired == 0 and sweep.sessions_marked_no_show == 0 and sweep.memberships_expired == 0"
            - "VolunteerShift.${sh1}/${sh2}/${sh3}.status == NO_SHOW (verify each via GET)"
            - "Volunteer.${v}.no_show_count == 3  (link 1: per-shift strike accumulation)"
            - "Volunteer.${v}.engagement_status == SUSPENDED  (link 2: third strike crosses >= 3)"
            - "VolunteerShift.${sh4}.status == CANCELLED  (link 3: suspension cancels remaining SCHEDULED shifts)"

