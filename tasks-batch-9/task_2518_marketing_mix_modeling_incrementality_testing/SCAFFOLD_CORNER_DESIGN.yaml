          setup:
            - "Market US_CORE and one MediaChannel C_LAG with adstock_decay_rate 0.50 and adstock_max_lag_periods 4 (the other bounds are the A_SEARCH values)."
            - "Window W1 is WEEKLY [2026-08-03, 2026-08-31) so expected_period_count is 4, which is NOT strictly greater than the lag 4. It receives the four F1 sales rows and NO spend rows at all, then is sealed at clock 2026-08-31."
            - "Window W2 is WEEKLY [2026-09-01, 2026-09-29) so expected_period_count is also 4 (the same lag violation), but it receives four sales rows AND four C_LAG spend rows, then is sealed at clock 2026-09-29. W1 occupies the closed interval up to 2026-08-31 and W2 starts 2026-09-01, so priority 66 is not triggered."
