        payload: {}
        as: EditorInChief
        captures: {e1: $.data.error_id}
      - call: GET /comics/creative-assignments/00000000-0000-0000-0000-000000000002
        payload: {}
        as: ManagingEditor
        captures: {e2: $.data.error_id}
      - call: GET /comics/production-stages/00000000-0000-0000-0000-000000000003
        payload: {}
        as: ManagingEditor
        captures: {e3: $.data.error_id}
      - call: GET /comics/catalogs/00000000-0000-0000-0000-000000000004
        payload: {}
        as: SalesDirector
        captures: {e4: $.data.error_id}
      - call: GET /comics/retailers/00000000-0000-0000-0000-000000000005
        payload: {}
        as: SalesDirector
        captures: {e5: $.data.error_id}
      - call: GET /comics/retailer-orders/00000000-0000-0000-0000-000000000006
        payload: {}
        as: SalesDirector
        captures: {e6: $.data.error_id}
      - call: GET /comics/print-runs/00000000-0000-0000-0000-000000000007
        payload: {}
        as: ManagingEditor
        captures: {e7: $.data.error_id}
      - call: GET /comics/royalty-statements/00000000-0000-0000-0000-000000000008
        payload: {}
        as: RoyaltyAccountant
        as_user_id: acct-1
        captures: {e8: $.data.error_id}
      - call: POST /comics/titles/${t1}/creative-assignments
        payload: {creator_id: 00000000-0000-0000-0000-000000000009, craft: SCRIPT, page_rate_cents: 12000,
          royalty_share_bps: 5000, booking_start_date: '2026-08-01', booking_end_date: '2026-12-01', expected_title_version: '${tv1}'}
        as: EditorInChief
        captures: {e9: $.data.error_id}
      assert: ['the eight GETs return 404 with error_id ERR_CREATOR_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND,
          ERR_STAGE_NOT_FOUND, ERR_CATALOG_NOT_FOUND, ERR_RETAILER_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_PRINT_RUN_NOT_FOUND
          and ERR_STATEMENT_NOT_FOUND respectively', the ninth call returns 404 ERR_CREATOR_NOT_FOUND
          from priority 5 (body reference) even though the path title resolves and expected_title_version
          is correct, 'Title.${t1}.committed_share_bps == 0 and the title has no assignments']
