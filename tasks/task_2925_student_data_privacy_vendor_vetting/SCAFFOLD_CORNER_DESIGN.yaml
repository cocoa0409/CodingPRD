# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 breadth probe for
# task_2925_student_data_privacy_vendor_vetting
#
# Walked row-by-row against references/claim-extraction-guide.md's nine sections
# and this scaffold's own §1.1–§1.7. Corners already asserted by a named §1.8
# instance appear as excluded_because stubs (no test_recipe).
#
# Shared literals reused across recipes (pinned once here, byte-exact):
#   JUST_240  (240 chars, bonus 8)  = "Grade seven and eight students use this tool for weekly formative practice aligned to the district scope and sequence, and teachers review item-level results during common planning time to regroup learners and plan targeted reteaching block"
#   JUST_426  (426 chars, bonus 15) = the long justification used by request_priority_bonus_top_tier_at_four_hundred_chars
#   JUST_115  (115 chars, below the 120-char floor) = "Weekly practice tool for my two sections; results guide reteaching groups during common planning time each Tuesday."
#   PURPOSE_61 (61 chars, >= PURPOSE_MIN_CHARS 40) = "Roster identity matching for gradebook sync and report cards."
#   PURPOSE_35 (35 chars, below PURPOSE_MIN_CHARS) = "Roster sync for gradebook and cards"
#   Startup clock default is 2026-08-01T00:00:00Z; every recipe still pins it explicitly.

scaffold_corner_design:

  - section: entities
    instances:

      - name: vendor_creation_returns_full_envelope_with_computed_defaults
        claim_type: Creation
        grounds:
          - entities.Vendor
          - endpoints[POST /vendors]
          - response_envelope.success
        distinguishing_aspect: "A brand-new Vendor must come back inside the success envelope with every declared field present, version 1, status REGISTERED, risk_score 0.00 and privacy_posture CLEAR — the computed columns are populated at creation, not left null."
        test_recipe:
          setup:
            - "Empty database, clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
          trigger:
            - call: "POST /vendors"
              payload: { legal_name: "Brightpath Reading Co", hq_country_code: "US", breach_notification_hours: 48, data_deletion_days: 30, signed_state_addendum: true, subprocessor_disclosure_complete: true }
              as: PrivacyOfficeAdmin
              captures: { v_id: $.data.id }
          assert:
            - "status == 201"
            - "response.response_type == object and response.meta.api_request_id is present"
            - "Vendor.${v_id}.status == REGISTERED"
            - "Vendor.${v_id}.risk_score == 0.00"
            - "Vendor.${v_id}.privacy_posture == CLEAR"
            - "Vendor.${v_id}.open_incident_count == 0"
            - "Vendor.${v_id}.flagged_subprocessor_count == 0"
            - "Vendor.${v_id}.reauthorization_risk_score is null"
            - "Vendor.${v_id}.version == 1"
            - "Vendor.${v_id}.created_at == 2026-08-01T00:00:00.000Z"
            - "Vendor.${v_id}.id is a bare UUID with no type prefix"

      - name: vendor_retrieval_returns_the_stored_row
        claim_type: Retrieval
        grounds:
          - endpoints[GET /vendors/{vendorId}]
          - entities.Vendor
        distinguishing_aspect: "GET by id must echo exactly what POST persisted, including the two-decimal money-free score fields, with no version bump from the read."
        test_recipe:
          setup:
            - "One vendor created at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /vendors"
              payload: { legal_name: "Brightpath Reading Co", hq_country_code: "US", breach_notification_hours: 48, data_deletion_days: 30, signed_state_addendum: true, subprocessor_disclosure_complete: true }
              as: PrivacyOfficeAdmin
              captures: { v_id: $.data.id }
          trigger:
            - call: "GET /vendors/${v_id}"
              as: PrivacyOfficeAdmin
          assert:
            - "status == 200"
            - "Vendor.${v_id}.legal_name == Brightpath Reading Co"
            - "Vendor.${v_id}.breach_notification_hours == 48"
            - "Vendor.${v_id}.signed_state_addendum == true"
            - "Vendor.${v_id}.version == 1 (a read never bumps version)"

      - name: vendor_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /vendors]
          - response_envelope.pagination_fields
        distinguishing_aspect: "The list envelope must carry limit, offset, total_count and has_more, with total_count counting the whole matching set (3) rather than the returned page (2), and has_more flipping to false on the last page."
        test_recipe:
          setup:
            - "Three vendors created in a known order at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /vendors"
              payload: { legal_name: "Vendor Alpha", hq_country_code: "US", breach_notification_hours: 48, data_deletion_days: 30, signed_state_addendum: true, subprocessor_disclosure_complete: true }
              as: PrivacyOfficeAdmin
              captures: { va_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "Vendor Bravo", hq_country_code: "US", breach_notification_hours: 48, data_deletion_days: 30, signed_state_addendum: true, subprocessor_disclosure_complete: true }
              as: PrivacyOfficeAdmin
              captures: { vb_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "Vendor Charlie", hq_country_code: "US", breach_notification_hours: 48, data_deletion_days: 30, signed_state_addendum: true, subprocessor_disclosure_complete: true }
              as: PrivacyOfficeAdmin
              captures: { vc_id: $.data.id }
          trigger:
            - call: "GET /vendors"
              payload: { limit: 2, offset: 0 }
              as: PrivacyOfficeAdmin
            - call: "GET /vendors"
              payload: { limit: 2, offset: 2 }
              as: PrivacyOfficeAdmin
          assert:
            - "first trigger call: status == 200, response_type == array, 2 rows returned"
            - "first trigger call: total_count == 3 and has_more == true and limit == 2 and offset == 0"
            - "second trigger call: 1 row returned, total_count == 3, has_more == false"
            - "the union of both pages contains ${va_id}, ${vb_id} and ${vc_id} exactly once each"

      - name: application_not_found_for_unknown_uuid
        claim_type: Not Found
        grounds:
          - endpoints[GET /applications/{applicationId}]
          - errors[ERR_APPLICATION_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unknown UUID in the path must be a 404 ERR_APPLICATION_NOT_FOUND, not a 200 with a null body and not a 400."
        test_recipe:
          setup:
            - "Empty database apart from the clock call."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
          trigger:
            - call: "GET /applications/00000000-0000-4000-8000-000000000000"
              as: PrivacyOfficeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "status == 404 and ${err} == ERR_APPLICATION_NOT_FOUND"
            - "response.response_type == error and response.data.message is a non-empty string"

      - name: teacher_creation_missing_school_code_is_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Teacher.fields.school_code
          - endpoints[POST /teachers]
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "school_code has source input and no default, so omitting it must be a 400 ERR_INVALID_REQUEST from the shape gate at priority 3 — before any lookup or business rule runs."
        test_recipe:
          setup:
            - "Empty database apart from the clock call."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
          trigger:
            - call: "POST /teachers"
              payload: { full_name: "Ivy Chen", employee_number: "EMP-9001", grade_bands_taught: [3, 4, 5] }
              as: PrivacyOfficeAdmin
              captures: { err: $.data.error_id }
            - call: "POST /teachers"
              payload: { full_name: "Ivy Chen", employee_number: "EMP-9001", school_code: "ES-11", grade_bands_taught: [3, 4, 5] }
              as: PrivacyOfficeAdmin
              captures: { t_id: $.data.id }
          assert:
            - "first trigger call: status == 400 and ${err} == ERR_INVALID_REQUEST"
            - "second trigger call: status == 201 -- the same employee_number is still free, proving the rejected call persisted nothing (no ERR_DUPLICATE_EMPLOYEE_NUMBER)"
            - "Teacher.${t_id}.school_code == ES-11"

      - name: application_request_defaults_to_draft_with_null_scores
        claim_type: Defaults
        grounds:
          - entities.ApplicationRequest.fields.status
          - entities.ApplicationRequest.fields.revision_round
          - entities.ApplicationRequest.fields.priority_score
          - entities.Teacher.fields.open_request_count
        distinguishing_aspect: "A freshly created request must default to status DRAFT, revision_round 0, and NULL priority_score / priority_band / submitted_at — the score is only minted by submit, and a DRAFT row does not yet count toward Teacher.open_request_count."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one vendor, one application, one teacher."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /vendors"
              payload: { legal_name: "Meridian Practice Labs", hq_country_code: "US", breach_notification_hours: 48, data_deletion_days: 30, signed_state_addendum: true, subprocessor_disclosure_complete: true }
              as: PrivacyOfficeAdmin
              captures: { v_id: $.data.id }
            - call: "POST /applications"
              payload: { vendor_id: "${v_id}", name: "Meridian Practice", category: "ASSESSMENT", grade_band_low: 6, grade_band_high: 8, sso_protocol: "SAML2", accessibility_conformance_level: "WCAG21_AA", vpat_on_file: true }
              as: PrivacyOfficeAdmin
              captures: { app_id: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "Dana Reyes", employee_number: "EMP-9002", school_code: "MS-04", grade_bands_taught: [6, 7, 8] }
              as: PrivacyOfficeAdmin
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /application-requests"
              payload: { application_id: "${app_id}", requester_teacher_id: "${t_id}", instructional_justification: "Grade seven and eight students use this tool for weekly formative practice aligned to the district scope and sequence, and teachers review item-level results during common planning time to regroup learners and plan targeted reteaching block", requested_data_elements: ["STUDENT_NAME"], student_count_estimate: 700, grade_band_low: 7, grade_band_high: 8 }
              as: Teacher
              as_user_id: "${t_id}"
              captures: { req_id: $.data.id }
          assert:
            - "status == 201"
            - "ApplicationRequest.${req_id}.status == DRAFT"
            - "ApplicationRequest.${req_id}.revision_round == 0"
            - "ApplicationRequest.${req_id}.priority_score is null"
            - "ApplicationRequest.${req_id}.priority_band is null"
            - "ApplicationRequest.${req_id}.submitted_at is null"
            - "ApplicationRequest.${req_id}.triage_note is null"
            - "Teacher.${t_id}.open_request_count == 0"

      - name: application_computed_tier_and_visibility_are_server_derived
        claim_type: Computed Fields
        grounds:
          - calculations.application_max_permitted_tier
          - entities.Application.fields.max_permitted_tier
          - entities.Application.fields.catalog_visibility
          - entities.Application.fields.exposed_sensitivity_points
        distinguishing_aspect: "max_permitted_tier is not an input: it is looked up from category, so INSTRUCTIONAL_CONTENT lands on 2 and ADMINISTRATIVE on 4 in the very create response, while catalog_visibility starts HIDDEN and exposed_sensitivity_points starts 0.00."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one vendor."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /vendors"
              payload: { legal_name: "Cascadia Student Systems", hq_country_code: "US", breach_notification_hours: 48, data_deletion_days: 45, signed_state_addendum: true, subprocessor_disclosure_complete: true }
              as: PrivacyOfficeAdmin
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { vendor_id: "${v_id}", name: "Cascadia Reader", category: "INSTRUCTIONAL_CONTENT", grade_band_low: 3, grade_band_high: 5, sso_protocol: "LTI13", accessibility_conformance_level: "WCAG21_AA", vpat_on_file: true }
              as: PrivacyOfficeAdmin
              captures: { app1_id: $.data.id }
            - call: "POST /applications"
              payload: { vendor_id: "${v_id}", name: "Cascadia SIS Companion", category: "ADMINISTRATIVE", grade_band_low: 6, grade_band_high: 8, sso_protocol: "SAML2", accessibility_conformance_level: "WCAG21_AA", vpat_on_file: true }
              as: PrivacyOfficeAdmin
              captures: { app2_id: $.data.id }
            - call: "POST /applications"
              payload: { vendor_id: "${v_id}", name: "Cascadia Messages", category: "COMMUNICATION", grade_band_low: 6, grade_band_high: 8, sso_protocol: "OIDC", accessibility_conformance_level: "WCAG21_AA", vpat_on_file: true }
              as: PrivacyOfficeAdmin
              captures: { app3_id: $.data.id }
          assert:
            - "Application.${app1_id}.max_permitted_tier == 2"
            - "Application.${app2_id}.max_permitted_tier == 4"
            - "Application.${app3_id}.max_permitted_tier == 3"
            - "Application.${app1_id}.catalog_visibility == HIDDEN"
            - "Application.${app1_id}.exposed_sensitivity_points == 0.00"
            - "Application.${app1_id}.status == CANDIDATE"
            - "Application.${app1_id}.sso_verified == false"

      - name: application_enum_and_range_constraints_rejected_at_shape_gate
        claim_type: Type Constraints
        grounds:
          - entities.Application.fields.category
          - entities.Application.fields.grade_band_high
          - entities.Vendor.fields.breach_notification_hours
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Three distinct shape failures — an enum value outside the declared set, grade_band_high below grade_band_low, and breach_notification_hours above its 720 ceiling — must all surface as 400 ERR_INVALID_REQUEST from priority 3, never as 409 or 422."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one vendor."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /vendors"
              payload: { legal_name: "Brightpath Reading Co", hq_country_code: "US", breach_notification_hours: 48, data_deletion_days: 30, signed_state_addendum: true, subprocessor_disclosure_complete: true }
              as: PrivacyOfficeAdmin
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { vendor_id: "${v_id}", name: "Bad Category App", category: "GAMES", grade_band_low: 3, grade_band_high: 5, sso_protocol: "LTI13", accessibility_conformance_level: "WCAG21_AA", vpat_on_file: true }
              as: PrivacyOfficeAdmin
              captures: { err_enum: $.data.error_id }
            - call: "POST /applications"
              payload: { vendor_id: "${v_id}", name: "Inverted Band App", category: "ASSESSMENT", grade_band_low: 8, grade_band_high: 6, sso_protocol: "SAML2", accessibility_conformance_level: "WCAG21_AA", vpat_on_file: true }
              as: PrivacyOfficeAdmin
              captures: { err_band: $.data.error_id }
            - call: "POST /vendors"
              payload: { legal_name: "Out Of Range Vendor", hq_country_code: "US", breach_notification_hours: 721, data_deletion_days: 30, signed_state_addendum: true, subprocessor_disclosure_complete: true }
              as: PrivacyOfficeAdmin
              captures: { err_hours: $.data.error_id }
            - call: "GET /applications"
              payload: { vendor_id: "${v_id}" }
              as: PrivacyOfficeAdmin
          assert:
            - "first trigger call: status == 400 and ${err_enum} == ERR_INVALID_REQUEST"
            - "second trigger call: status == 400 and ${err_band} == ERR_INVALID_REQUEST"
            - "third trigger call: status == 400 and ${err_hours} == ERR_INVALID_REQUEST"
            - "fourth trigger call: status == 200 with total_count == 0 -- none of the three rejected writes persisted"

      - name: duplicate_employee_number_rejected_across_teachers
        claim_type: Type Constraints
        grounds:
          - entities.Teacher.fields.employee_number
          - errors[ERR_DUPLICATE_EMPLOYEE_NUMBER]
          - validations[priority=34]
        distinguishing_aspect: "employee_number is unique across all Teacher rows, so the second create with the same number is a 409 ERR_DUPLICATE_EMPLOYEE_NUMBER — a business-constraint conflict, not a 400 shape error."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one teacher already holding employee_number EMP-9003."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /teachers"
              payload: { full_name: "Dana Reyes", employee_number: "EMP-9003", school_code: "MS-04", grade_bands_taught: [6, 7, 8] }
              as: PrivacyOfficeAdmin
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /teachers"
              payload: { full_name: "Other Person", employee_number: "EMP-9003", school_code: "ES-11", grade_bands_taught: [3] }
              as: PrivacyOfficeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "status == 409 and ${err} == ERR_DUPLICATE_EMPLOYEE_NUMBER"
            - "Teacher.${t1_id}.full_name == Dana Reyes (the original row is untouched)"
            - "Teacher.${t1_id}.version == 1"

      - name: commitment_body_fk_to_unknown_review_is_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.DataElementCommitment.fields.review_id
          - validations[priority=5]
          - errors[ERR_REVIEW_NOT_FOUND]
        distinguishing_aspect: |
          review_id is a body FK, so an unknown id must resolve at priority 5 as a 404
          ERR_REVIEW_NOT_FOUND — ahead of the OCC check at 21. The payload deliberately
          carries a version token that is genuinely current for a DIFFERENT review, so an
          implementation that resolves the OCC token first (or that looks the parent up by
          version rather than by id) answers 412 instead of 404, and the same payload with
          the real review_id must then succeed.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; the canonical chain produces one real review REV in SCREENING."
            - "REV's current version is read immediately before the trigger, so the OCC token in the payload is valid — only the review_id is wrong."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /vendors"
              payload: { legal_name: "Brightpath Reading Co", hq_country_code: "US", breach_notification_hours: 48, data_deletion_days: 30, signed_state_addendum: true, subprocessor_disclosure_complete: true }
              as: PrivacyOfficeAdmin
              captures: { v_id: $.data.id }
            - call: "POST /applications"
              payload: { vendor_id: "${v_id}", name: "Brightpath Readers", category: "ASSESSMENT", grade_band_low: 6, grade_band_high: 8, sso_protocol: "LTI13", accessibility_conformance_level: "WCAG21_AA", vpat_on_file: true }
              as: PrivacyOfficeAdmin
              captures: { app_id: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "Ivy Chen", employee_number: "EMP-7125", school_code: "MS-04", grade_bands_taught: [6, 7, 8] }
              as: PrivacyOfficeAdmin
              captures: { t_id: $.data.id }
            - call: "POST /privacy-analysts"
              payload: { full_name: "Ana Lopez", credential_level: "SENIOR", review_capacity_minutes: 2400 }
              as: PrivacyOfficeAdmin
              captures: { an1_id: $.data.id }
            - call: "POST /application-requests"
              payload: { application_id: "${app_id}", requester_teacher_id: "${t_id}", instructional_justification: "Grade seven and eight students use this tool for weekly formative practice aligned to the district scope and sequence, and teachers review item-level results during common planning time to regroup learners and plan targeted reteaching block", requested_data_elements: ["STUDENT_NAME"], student_count_estimate: 300, grade_band_low: 6, grade_band_high: 8 }
              as: Teacher
              as_user_id: "${t_id}"
              captures: { req_id: $.data.id }
            - call: "POST /application-requests/${req_id}/submit"
              payload: {}
              as: Teacher
              as_user_id: "${t_id}"
            - call: "POST /application-requests/${req_id}/triage"
              payload: { disposition: "ACCEPT_FOR_REVIEW" }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
            - call: "POST /data-practice-reviews"
              payload: { source_request_id: "${req_id}", assigned_analyst_id: "${an1_id}", framework_set: ["FERPA", "COPPA", "PPRA", "STATE_ADDENDUM"], estimated_minutes: 180 }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { rev_id: $.data.id }
            - call: "GET /data-practice-reviews/${rev_id}"
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { rv1: $.data.version }
          trigger:
            - call: "POST /data-element-commitments"
              payload: { review_id: "00000000-0000-4000-8000-000000000000", element_code: "STUDENT_NAME", justified_purpose: "Roster identity matching for gradebook sync and report cards.", retention_days: 365, deletion_method: "ANONYMIZE", expected_review_version: "${rv1}" }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { err: $.data.error_id }
            - call: "POST /data-element-commitments"
              payload: { review_id: "${rev_id}", element_code: "STUDENT_NAME", justified_purpose: "Roster identity matching for gradebook sync and report cards.", retention_days: 365, deletion_method: "ANONYMIZE", expected_review_version: "${rv1}" }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { c1_id: $.data.id }
          assert:
            - "first trigger call: status == 404 and ${err} == ERR_REVIEW_NOT_FOUND (not 412)"
            - "after the first trigger call GET /data-element-commitments filtered by review_id ${rev_id} returns total_count 0"
            - "second trigger call: status == 201 and DataElementCommitment.${c1_id}.review_id == ${rev_id}"
            - "DataElementCommitment.${c1_id}.status == PROPOSED, sensitivity_tier == 1, element_points == 1.44, is_minimized == true"
            - "Application.${app_id}.exposed_sensitivity_points == 0.00 (a PROPOSED row is outside the input set)"

      - name: flat_topology_cross_reference_integrity_on_application_create
        claim_type: Foreign key references validated
        grounds:
          - complexity_profile.entity_topology
          - entities.Application.fields.vendor_id
          - validations[priority=5]
          - errors[ERR_VENDOR_NOT_FOUND]
        distinguishing_aspect: "The topology is flat, so every cross-reference is a body FK that must be validated on write: creating an Application under a non-existent vendor_id is 404 ERR_VENDOR_NOT_FOUND, and the same call succeeds verbatim once the vendor exists."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; no vendors yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
          trigger:
            - call: "POST /applications"
              payload: { vendor_id: "00000000-0000-4000-8000-000000000000", name: "Orphan App", category: "ASSESSMENT", grade_band_low: 6, grade_band_high: 8, sso_protocol: "SAML2", accessibility_conformance_level: "WCAG21_AA", vpat_on_file: true }
              as: PrivacyOfficeAdmin
              captures: { err: $.data.error_id }
            - call: "POST /vendors"
              payload: { legal_name: "Brightpath Reading Co", hq_country_code: "US", breach_notification_hours: 48, data_deletion_days: 30, signed_state_addendum: true, subprocessor_disclosure_complete: true }
              as: PrivacyOfficeAdmin
