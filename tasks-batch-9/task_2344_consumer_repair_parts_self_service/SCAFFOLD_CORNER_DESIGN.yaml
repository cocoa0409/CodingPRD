      - name: provider_onboarding_rejects_premature_authorization_and_cross_provider_writes
        claim_type: cross_entity
        grounds:
          - validations[priority=42]
          - validations[priority=63]
          - validations[priority=82]
          - validations[priority=128]
          - state_machines.RepairProvider.transitions[TRAINING_IN_PROGRESS -> AUTHORIZED]
        distinguishing_aspect: |
          Authorization depends on a derived count from a different entity
          (active_cert_count vs ceil(technician_count / 4)), a technician's write
          scope is resolved through his certification rather than his header, and
          the granted access tier gates which safety classes he may order.
        test_recipe:
          setup:
            - "Profile US-CA; provider P1 (technician_count 4 -> required_cert_count 1, requested_access_tier TIER_3_STANDARD) and provider P2 (technician_count 4, TIER_1_UNRESTRICTED); both moved to TRAINING_IN_PROGRESS with a grant of 4 credits."
            - "Model CRX-V12 (TIER_A) with PUBLISHED battery part SKU-V12-BAT (SAFETY_RESTRICTED_BATTERY), an in-window compatibility row and a PUBLISHED DISASSEMBLY_GUIDE covering it."
