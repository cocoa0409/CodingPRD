        distinguishing_aspect: "The store read reflects the derived engine mass immediately after each bin write, so two bins summing to 1100 g on a 2000 g wall report 1100 and keep the store TRADING."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0219 with element 5601 and one bin holding 600 g."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "LEGO-0219", display_name: "Brick Yard Nineteen", wall_bin_capacity_grams: 2000, event_capacity_units: 40, checklist_required: true }
              as: PlatformAdmin
              captures: { st219: $.data.id }
            - call: "POST /stores/elements"
              payload: { element_code: "5601", element_name: "Slope 30", theme: "Town", unit_mass_grams: 1.4, cost_basis_cents: 5, make_ready_lead_days: 5 }
              as: PlatformAdmin
              captures: { el5601: $.data.id }
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${st219}", element_id: "${el5601}", bin_label: "Q01", bin_capacity_grams: 1000, bin_mass_grams: 600 }
              as: StoreAssociate
              captures: { bin_q01: $.data.id }
          trigger:
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${st219}", element_id: "${el5601}", bin_label: "Q02", bin_capacity_grams: 1000, bin_mass_grams: 500 }
              as: StoreAssociate
              captures: { bin_q02: $.data.id }
            - call: "GET /stores/{id}"
              payload: {}
              as: StoreAssociate
              captures: { engine_mass: $.data.bin_engine_mass_grams, store_stage: $.data.stage }
          assert:
            - "the store read reports bin_engine_mass_grams 1100"
            - "the store read reports stage TRADING"
            - "GET /stores/wall-bins?store_id=${st219} returns 2 bins"

      - name: retiring_a_loaded_element_is_refused_until_its_bin_is_emptied
        claim_type: Conditional action
        grounds: ["state_machines.Element.ACTIVE_to_RETIRED_TO_ARCHIVE", "errors[ERR_ELEMENT_BIN_OCCUPIED]"]
        distinguishing_aspect: "The retire action is conditional on no bin still holding the element, so the same call is refused while a bin carries mass and succeeds once the bin is emptied."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Store LEGO-0220 with element 5701 loaded in one bin holding 600 g."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "LEGO-0220", display_name: "Brick Yard Twenty", wall_bin_capacity_grams: 1000, event_capacity_units: 40, checklist_required: true }
              as: PlatformAdmin
              captures: { st220: $.data.id }
            - call: "POST /stores/elements"
              payload: { element_code: "5701", element_name: "Brick 1x4", theme: "Town", unit_mass_grams: 0.9, cost_basis_cents: 4, make_ready_lead_days: 5 }
              as: PlatformAdmin
              captures: { el5701: $.data.id, el5701_v1: $.data.version }
            - call: "POST /stores/wall-bins"
              payload: { store_id: "${st220}", element_id: "${el5701}", bin_label: "R01", bin_capacity_grams: 1000, bin_mass_grams: 600 }
              as: StoreAssociate
              captures: { bin_r01: $.data.id }
          trigger:
            - call: "POST /stores/elements/{id}/retire"
