            - "the first trigger call returns status == 404"
            - "the first trigger call returns data.error_id == ERR_EMPLOYER_NOT_FOUND"
            - "the first trigger call does not return data.error_id == ERR_INVALID_REQUEST"
            - "the second trigger call returns status == 422 with data.error_id == ERR_INVALID_REQUEST"
