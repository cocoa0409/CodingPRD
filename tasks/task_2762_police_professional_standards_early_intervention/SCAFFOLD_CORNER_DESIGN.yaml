              as: SystemAdmin
              captures: { cmdr_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-101", full_name: "Investigator Ahn", rank: "SERGEANT", assignment_type: "INVESTIGATIVE", annual_salary_cents: 12800000, demographic_code: "DG_B", hire_date: "2011-03-01T00:00:00Z", is_investigator: true, certification_level: 3, max_case_load: 8 }
              as: SystemAdmin
              captures: { inv_a_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-010", full_name: "Sergeant Doyle", rank: "SERGEANT", assignment_type: "PATROL", annual_salary_cents: 10500000, demographic_code: "DG_A", hire_date: "2012-02-02T00:00:00Z" }
              as: SystemAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-501", full_name: "Officer Vance", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9100013, demographic_code: "DG_C", hire_date: "2019-06-01T00:00:00Z" }
              as: SystemAdmin
