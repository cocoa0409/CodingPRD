              captures: { pack_v3: $.data.version }
            - call: "POST /brand-ops/pack-formats/${pack_id}/price-lists"
              payload: { channel: "HARDWARE", list_price_cents: 520, map_price_cents: 300, effective_from: "2026-12-01T00:00:00Z", effective_to: "2027-04-01T00:00:00Z", expected_pack_format_version: "${pack_v3}" }
              as: PricingAnalyst
              captures: { pl2_id: $.data.id }
          trigger:
            - call: "GET /brand-ops/pack-formats/${pack_id}/effective-price"
              payload: { channel: "HARDWARE", at: "2026-11-30T23:59:59Z" }
              as: PricingAnalyst
              captures: { price_before: $.data.list_price_cents }
            - call: "GET /brand-ops/pack-formats/${pack_id}/effective-price"
              payload: { channel: "HARDWARE", at: "2026-12-01T00:00:00Z" }
              as: PricingAnalyst
              captures: { price_at: $.data.list_price_cents, which_list: $.data.price_list_id }
            - call: "GET /brand-ops/pack-formats/${pack_id}/effective-price"
              payload: { channel: "AUTOMOTIVE" }
              as: PricingAnalyst
              captures: { error_id: $.data.error_id }
          assert:
            - "one second before the boundary: list_price_cents == 499 (L1)"
            - "at exactly 2026-12-01T00:00:00Z: list_price_cents == 520 and price_list_id == ${pl2_id} (L2's from is inclusive, L1's to exclusive)"
            - "channel AUTOMOTIVE: 404 with error_id == ERR_NO_EFFECTIVE_PRICE"

