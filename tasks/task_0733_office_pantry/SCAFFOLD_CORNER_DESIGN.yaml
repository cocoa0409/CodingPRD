      - name: subscription_create_stale_client_version_412
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules.subscription-create-stale-client
          - errors[ERR_STALE_CLIENT_VERSION]
        distinguishing_aspect: "POST /clients/{id}/subscriptions with expected_client_version = current-1 returns ERR_STALE_CLIENT_VERSION (412). OCC on Client.version."
        test_recipe:
          setup:
            - "Client with a PATCH-bumped version (current version != initial)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { tier: "OCC", billing_type: "FLAT", flat_fee_cents: 1000, volume_discount_threshold_headcount: 10 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /clients"
              payload: { name: "OccCo", headcount: 5 }
              as: PlatformAdmin
              captures: { client_id: "$.data.id", client_v_initial: "$.data.version" }
            - call: "PATCH /clients/${client_id}/headcount"
              payload: { headcount: 7 }
