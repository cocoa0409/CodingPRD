            - "TestSite.${site_id}.oversight_posture == OPEN and TestSite.${site_id}.inspection_readiness_score == 100.00"

      - name: pt_investigation_reject_cycle_then_accept_clears_unsuccessful_count
        grounds:
          - state_machines.ProficiencyEvent.PENDING_to_INVESTIGATION_OPEN
          - state_machines.ProficiencyEvent.INVESTIGATION_SUBMITTED_to_INVESTIGATION_OPEN
          - state_machines.ProficiencyEvent.INVESTIGATION_SUBMITTED_to_INVESTIGATION_ACCEPTED
          - entities.ProficiencyEvent.fields.investigation_round
          - calculations.pt_event_outcome
        distinguishing_aspect: |
          A single failed shipment takes the INVESTIGATION_OPEN branch (one
          FAIL among the last three graded events, not the
          UNSUCCESSFUL_LOCKED branch), loops INVESTIGATION_SUBMITTED ->
          INVESTIGATION_OPEN once, and reaches INVESTIGATION_ACCEPTED with
          investigation_round == 2 while the enrollment never leaves ENROLLED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One WAIVED site with ACTIVE waiver coverage and one trained PHYSICIAN operator acting as LabDirector."
            - "One GLUCOSE PT enrollment for 2026 with a single shipment graded 60.00 (FAIL), so the event is INVESTIGATION_OPEN and site.pt_unsuccessful_count == 1."
            - "One investigation is submitted and rejected, then resubmitted, leaving the event INVESTIGATION_SUBMITTED with investigation_round == 2."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
