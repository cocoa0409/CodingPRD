  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: add_property_state_beats_referential
        grounds:
          - validations[priority=4]
          - validations[priority=11]
          - state_machines.Property.DORMANT_to_REPORTED
        distinguishing_aspect: >
          A single add-property request violates BOTH a state rule (property is ACTIVE, not a reportable
          DORMANT/DUE_DILIGENCE state; P4 ERR_INVALID_STATE) and a referential rule (escheat_state CA !=
          report_state NV; P11 ERR_ESCHEAT_STATE_MISMATCH). The lower-priority-number state error wins.
          Category pair: state vs business_referential.
        test_recipe:
          setup:
            - "A never-evaluated ACTIVE property with escheat_state CA, and a DRAFT report filed for NV."
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /property-types"
              payload: { code: "MO02", name: "Money Order", dormancy_period_years: 3, dormancy_basis: "ISSUANCE", interest_bearing: false, due_diligence_required: false, due_diligence_min_days: 0 }
              as: StateAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_id}", owner_name: "Jane Doe", owner_last_known_state: "CA", amount_cents: 50000, last_activity_date: "2020-01-01T00:00:00Z", issue_date: "2020-01-01T00:00:00Z" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /reports"
              payload: { holder_id: "${holder_id}", report_state: "NV", report_period_year: 2026 }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { report_id: $.data.id, rep_v: $.data.version }
          trigger:
            - call: "POST /reports/${report_id}/add-property"
              payload: { property_id: "${prop_id}", expected_report_version: "${rep_v}" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "HolderReport.${report_id}.property_count == 0"

      - name: report_submit_temporal_beats_fiscal
        grounds:
          - validations[priority=9]
          - validations[priority=18]
          - state_machines.HolderReport.DRAFT_to_SUBMITTED
        distinguishing_aspect: >
          A single submit violates BOTH a temporal rule (due_diligence_min_days 60 not yet elapsed since the
          notice; P9 ERR_DUE_DILIGENCE_INCOMPLETE) and a fiscal rule (declared_total_cents 999 != computed
          total_remitted_cents; P18 ERR_REMITTANCE_MISMATCH). The lower-priority-number temporal error wins.
          Category pair: business_temporal vs business_fiscal.
        test_recipe:
          setup:
            - "A DRAFT CA report with a due-diligence property attached only days after its notice (60-day window unmet)."
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /property-types"
              payload: { code: "AC01", name: "Savings", dormancy_period_years: 3, dormancy_basis: "LAST_ACTIVITY", interest_bearing: false, due_diligence_required: true, due_diligence_min_days: 60 }
              as: StateAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_id}", owner_name: "Jane Doe", owner_last_known_state: "CA", amount_cents: 50000, last_activity_date: "2020-01-01T00:00:00Z" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/evaluate-dormancy"
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /properties/${prop_id}/notices"
              payload: { method: "MAIL" }
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: StateAdmin
            - call: "POST /reports"
              payload: { holder_id: "${holder_id}", report_state: "CA", report_period_year: 2026 }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { report_id: $.data.id, rep_v: $.data.version }
            - call: "POST /reports/${report_id}/add-property"
              payload: { property_id: "${prop_id}", expected_report_version: "${rep_v}" }
              as: Holder
              as_user_id: "${holder_id}"
          trigger:
            - call: "POST /reports/${report_id}/submit"
              payload: { declared_total_cents: 999 }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_DUE_DILIGENCE_INCOMPLETE"
            - "HolderReport.${report_id}.status == DRAFT"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: dormancy_exact_date_boundary
        grounds:
          - validations[priority=5]
          - state_machines.Property.ACTIVE_to_DORMANT
          - calculations.dormancy_date
        distinguishing_aspect: >
          At exactly current_clock == dormancy_date (2023-01-01T00:00:00Z) the property becomes DORMANT
          (>= is inclusive). Metric is a date threshold reached via POST /properties/{id}/evaluate-dormancy.
        test_recipe:
          setup:
            - "An ACTIVE property whose dormancy_date is exactly 2023-01-01, clock set to that instant."
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /property-types"
              payload: { code: "AC01", name: "Savings", dormancy_period_years: 3, dormancy_basis: "LAST_ACTIVITY", interest_bearing: false, due_diligence_required: false, due_diligence_min_days: 0 }
              as: StateAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_id}", owner_name: "Jane Doe", owner_last_known_state: "CA", amount_cents: 50000, last_activity_date: "2020-01-01T00:00:00Z" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2023-01-01T00:00:00Z" }
              as: StateAdmin
          trigger:
            - call: "POST /properties/${prop_id}/evaluate-dormancy"
              as: Holder
              as_user_id: "${holder_id}"
              captures: { status_after: $.data.status }
          assert:
            - "Property.${prop_id}.status == DORMANT"

      - name: fee_cap_exact_boundary
        grounds:
          - validations[priority=17]
          - entities.Claim.contract_fee_pct
          - calculations.recovery_fee
        distinguishing_aspect: >
          contract_fee_pct exactly at the cap min(firm.max_fee_pct 0.10, STATE_MAX_FEE_PCT 0.10) == 0.10 is
          ACCEPTED (<= is inclusive). Metric is a percentage on POST /claims, a different metric and endpoint
          than the dormancy date boundary.
        test_recipe:
          setup:
            - "An escheated CA property and a firm whose max_fee_pct is exactly 0.10."
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /property-types"
              payload: { code: "MO02", name: "Money Order", dormancy_period_years: 3, dormancy_basis: "ISSUANCE", interest_bearing: false, due_diligence_required: false, due_diligence_min_days: 0 }
              as: StateAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /state-accounts"
              payload: { state_code: "CA" }
              as: StateAdmin
              captures: { sa_ca_id: $.data.id }
            - call: "POST /owners"
              payload: { full_name: "Jane Doe", ssn_last4: "1234", address_state: "CA", email: "jane@x.com" }
              as: StateAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /recovery-firms"
              payload: { legal_name: "FindIt LLC", registered_state: "CA", license_number: "L1", max_fee_pct: 0.10 }
              as: StateAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_id}", owner_name: "Jane Doe", owner_last_known_state: "CA", amount_cents: 200000, last_activity_date: "2020-01-01T00:00:00Z", issue_date: "2020-01-01T00:00:00Z" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/evaluate-dormancy"
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports"
              payload: { holder_id: "${holder_id}", report_state: "CA", report_period_year: 2026 }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { report_id: $.data.id, rep_v: $.data.version }
            - call: "POST /reports/${report_id}/add-property"
              payload: { property_id: "${prop_id}", expected_report_version: "${rep_v}" }
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports/${report_id}/submit"
              payload: { declared_total_cents: 200000 }
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports/${report_id}/begin-review"
              as: StateExaminer
              as_user_id: "exam-1"
            - call: "POST /reports/${report_id}/accept"
              as: StateExaminer
              as_user_id: "exam-1"
          trigger:
            - call: "POST /claims"
              payload: { property_id: "${prop_id}", claimant_owner_id: "${owner_id}", filed_by: "FIRM", recovery_firm_id: "${firm_id}", contract_fee_pct: 0.10 }
              as: RecoveryAgent
              as_user_id: "${firm_id}"
              captures: { claim_id: $.data.id, prov_fee: $.data.provisional_fee_cents }
          assert:
            - "Claim.${claim_id}.status == FILED"
            - "Claim.${claim_id}.provisional_fee_cents == 20000"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: claim_requires_property_escheated
        grounds:
          - validations[priority=6]
          - state_machines.Property.ESCHEATED_to_CLAIMED
          - entities.Property.status
        distinguishing_aspect: >
          Filing a Claim is gated on the referenced Property being in status ESCHEATED; against a DORMANT
          property the file is rejected ERR_PROPERTY_NOT_CLAIMABLE. Entity pair Claim->Property.
        test_recipe:
          setup:
            - "A DORMANT (not yet escheated) property, plus a registered owner."
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /property-types"
              payload: { code: "MO02", name: "Money Order", dormancy_period_years: 3, dormancy_basis: "ISSUANCE", interest_bearing: false, due_diligence_required: false, due_diligence_min_days: 0 }
              as: StateAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /owners"
              payload: { full_name: "Jane Doe", ssn_last4: "1234", address_state: "CA", email: "jane@x.com" }
              as: StateAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_id}", owner_name: "Jane Doe", owner_last_known_state: "CA", amount_cents: 50000, last_activity_date: "2020-01-01T00:00:00Z", issue_date: "2020-01-01T00:00:00Z" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/evaluate-dormancy"
              as: Holder
              as_user_id: "${holder_id}"
          trigger:
            - call: "POST /claims"
              payload: { property_id: "${prop_id}", claimant_owner_id: "${owner_id}", filed_by: "OWNER" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PROPERTY_NOT_CLAIMABLE"

      - name: report_submit_blocked_by_holder_audit
        grounds:
          - validations[priority=8]
          - state_machines.HolderReport.DRAFT_to_SUBMITTED
          - entities.Holder.audit_hold
        distinguishing_aspect: >
          A DRAFT report with a correctly reconciled total is still blocked from SUBMITTED when its Holder has
          an OPEN AuditCase (audit_hold == true), rejected ERR_HOLDER_UNDER_AUDIT. Entity pair HolderReport->Holder,
          distinct from the Claim->Property pair.
        test_recipe:
          setup:
            - "A DRAFT CA report with one no-DD property (50000) attached and an OPEN audit case on the holder."
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /property-types"
              payload: { code: "MO02", name: "Money Order", dormancy_period_years: 3, dormancy_basis: "ISSUANCE", interest_bearing: false, due_diligence_required: false, due_diligence_min_days: 0 }
              as: StateAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_id}", owner_name: "Jane Doe", owner_last_known_state: "CA", amount_cents: 50000, last_activity_date: "2020-01-01T00:00:00Z", issue_date: "2020-01-01T00:00:00Z" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/evaluate-dormancy"
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports"
              payload: { holder_id: "${holder_id}", report_state: "CA", report_period_year: 2026 }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { report_id: $.data.id, rep_v: $.data.version }
            - call: "POST /reports/${report_id}/add-property"
              payload: { property_id: "${prop_id}", expected_report_version: "${rep_v}" }
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /audit-cases"
              payload: { holder_id: "${holder_id}" }
              as: StateExaminer
              as_user_id: "exam-1"
              captures: { audit_id: $.data.id }
          trigger:
            - call: "POST /reports/${report_id}/submit"
              payload: { declared_total_cents: 50000 }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_HOLDER_UNDER_AUDIT"
            - "HolderReport.${report_id}.status == DRAFT"
            - "Holder.${holder_id}.audit_hold == true"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: report_period_calendar_overlap
        grounds:
          - validations[priority=14]
          - entities.HolderReport.report_period_year
          - entities.HolderReport.report_state
        distinguishing_aspect: >
          A holder may hold only one report per (holder, state, calendar year); a second report for the same
          (holder, CA, 2026) collides on whole-calendar-year identity and is rejected ERR_REPORT_PERIOD_OVERLAP.
          Interval semantics: discrete calendar-year equality on the Holder resource.
        test_recipe:
          setup:
            - "A holder with an existing DRAFT report for (CA, 2026)."
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /reports"
              payload: { holder_id: "${holder_id}", report_state: "CA", report_period_year: 2026 }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { report_id: $.data.id }
          trigger:
            - call: "POST /reports"
              payload: { holder_id: "${holder_id}", report_state: "CA", report_period_year: 2026 }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_REPORT_PERIOD_OVERLAP"

      - name: notice_buffer_window
        grounds:
          - validations[priority=10]
          - state_machines.Property.DUE_DILIGENCE_to_DUE_DILIGENCE
          - entities.DueDiligenceNotice.sent_at
        distinguishing_aspect: >
          A second due-diligence notice sent 19 days after the first (clock 2026-05-01 -> 2026-05-20) falls
          within the 30-day buffer and is rejected ERR_NOTICE_TOO_SOON. Interval semantics: point-in-time
          expanded by a +/- buffer on the Property resource, distinct from calendar-year equality.
        test_recipe:
          setup:
            - "A DORMANT property that received its first notice at clock 2026-05-01, clock advanced to 2026-05-20."
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /property-types"
              payload: { code: "AC01", name: "Savings", dormancy_period_years: 3, dormancy_basis: "LAST_ACTIVITY", interest_bearing: false, due_diligence_required: true, due_diligence_min_days: 60 }
              as: StateAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_id}", owner_name: "Jane Doe", owner_last_known_state: "CA", amount_cents: 50000, last_activity_date: "2020-01-01T00:00:00Z" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/evaluate-dormancy"
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /properties/${prop_id}/notices"
              payload: { method: "MAIL" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { notice1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: StateAdmin
          trigger:
            - call: "POST /properties/${prop_id}/notices"
              payload: { method: "EMAIL" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOTICE_TOO_SOON"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: custody_conservation_pay_void
        grounds:
          - state_machines.Claim.PAID_to_VOIDED
          - state_machines.Property.CLAIMED_to_ESCHEATED
          - calculations.custody_balance
          - entities.StateAccount.custody_balance_cents
        distinguishing_aspect: >
          Forward pay debits StateAccount custody by net+fee (106000 -> 500); the compensating void posts a
          CLAWBACK_IN of net+fee restoring custody to exactly 106000. Conserved quantity: the state fund
          custody_balance_cents.
        test_recipe:
          setup:
            - "A PAID FIRM claim on an escheated CA property (fee 10600, net 94900); custody currently 500."
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /property-types"
              payload: { code: "AC01", name: "Savings", dormancy_period_years: 3, dormancy_basis: "LAST_ACTIVITY", interest_bearing: true, due_diligence_required: false, due_diligence_min_days: 0 }
              as: StateAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /state-accounts"
              payload: { state_code: "CA" }
              as: StateAdmin
              captures: { sa_ca_id: $.data.id }
            - call: "POST /owners"
              payload: { full_name: "Jane Doe", ssn_last4: "1234", address_state: "CA", email: "jane@x.com" }
              as: StateAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /recovery-firms"
              payload: { legal_name: "FindIt LLC", registered_state: "CA", license_number: "L1", max_fee_pct: 0.10 }
              as: StateAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_id}", owner_name: "Jane Doe", owner_last_known_state: "CA", amount_cents: 100000, last_activity_date: "2020-01-01T00:00:00Z" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/evaluate-dormancy"
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: StateAdmin
            - call: "POST /reports"
              payload: { holder_id: "${holder_id}", report_state: "CA", report_period_year: 2026 }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { report_id: $.data.id, rep_v: $.data.version }
            - call: "POST /reports/${report_id}/add-property"
              payload: { property_id: "${prop_id}", expected_report_version: "${rep_v}" }
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports/${report_id}/submit"
              payload: { declared_total_cents: 106000 }
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports/${report_id}/begin-review"
              as: StateExaminer
              as_user_id: "exam-1"
            - call: "POST /reports/${report_id}/accept"
              as: StateExaminer
              as_user_id: "exam-1"
            - call: "POST /claims"
              payload: { property_id: "${prop_id}", claimant_owner_id: "${owner_id}", filed_by: "FIRM", recovery_firm_id: "${firm_id}", contract_fee_pct: 0.10 }
              as: RecoveryAgent
              as_user_id: "${firm_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/examine"
              as: StateExaminer
              as_user_id: "exam-1"
            - call: "POST /claims/${claim_id}/approve"
              as: StateApprover
              as_user_id: "appr-1"
            - call: "POST /claims/${claim_id}/pay"
              as: StateApprover
              as_user_id: "appr-1"
          trigger:
            - call: "POST /claims/${claim_id}/void"
              as: StateApprover
              as_user_id: "appr-1"
              captures: { status_after: $.data.status }
          assert:
            - "Claim.${claim_id}.status == VOIDED"
            - "Property.${prop_id}.status == ESCHEATED"
            - "StateAccount.${sa_ca_id}.custody_balance_cents == 106000"

      - name: claim_ledger_zero_sum_on_void
        grounds:
          - state_machines.Claim.PAID_to_VOIDED
          - entities.LedgerEntry.entry_type
          - entities.LedgerEntry.ref_claim_id
        distinguishing_aspect: >
          For a single claim, the signed sum of its LedgerEntry rows (PAYOUT_OUT 94900 and FEE_OUT 10600 as
          negatives, CLAWBACK_IN 105500 as positive) is exactly 0 after the compensating void. Conserved
          quantity: the per-claim net ledger movement scoped by ref_claim_id, distinct from the fund-level custody balance.
        test_recipe:
          setup:
