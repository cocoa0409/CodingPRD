            - "ClaimTicket.${claim2_id}.is_return_visit == true (link 2: /dispatch reads pinned CoveredItem field)"
            - "ClaimTicket.${claim2_id}.service_fee_charged_cents == 0 (link 3: side effect of /dispatch sets SF based on link 2)"
            - "ClaimTicket.${claim2_id}.final_copay_cents == 0 (link 4: /resolve reads pinned SF; R=18000 <= C=25000 so no co-pay above cap)"

      - name: claim_resolve_recomputes_contract_aggregates
        grounds:
          - calculations.contract_payout_aggregate
          - state_machines.ClaimTicket.DISPATCHED_to_RESOLVED
          - entities.Contract.fields.total_paid_out_cents
          - entities.Contract.fields.claims_in_period_count
        distinguishing_aspect: |
          Cascade depth 2 from a DIFFERENT trigger than instance A:
          /claims/{id}/resolve causes recompute of BOTH
          Contract.total_paid_out_cents AND Contract.claims_in_period_count
          (two derived fields on the parent Contract). Each is a single link
          (resolve → parent field), making the chain depth 2 from a different
