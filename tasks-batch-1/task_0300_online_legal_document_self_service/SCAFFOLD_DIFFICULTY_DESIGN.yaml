            - call: "POST /legal/attorney-reviews"
              payload: { document_project_id: "${proj}", attorney_id: "${att}", window_start: "2026-03-02T10:00:00.000Z", window_end: "2026-03-02T12:00:00.000Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { review: $.data.id }
            - call: "POST /legal/attorney-reviews/${review}/transition"
              payload: { to_status: "IN_REVIEW" }
              as: Attorney
              as_user_id: "${att}"
            - call: "POST /legal/attorney-reviews/${review}/transition"
              payload: { to_status: "APPROVED" }
              as: Attorney
              as_user_id: "${att}"
            - call: "GET /legal/document-projects/${proj}"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { proj_v: $.data.version }
            - call: "POST /legal/document-revisions"
