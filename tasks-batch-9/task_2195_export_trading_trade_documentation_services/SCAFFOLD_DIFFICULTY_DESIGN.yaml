            - "error_id != ERR_DOCUMENT_REVISION_SUPERSEDED and error_id != ERR_REQUIRED_DOCUMENT_MISSING (priorities 27 and 29 are never evaluated)"
            - "DocumentPresentation.${pres_id}.status == PRESENTED and DocumentPresentation.${pres_id}.examined_by_user_id is null"
            - "DocumentPresentation.${pres_id}.examination_risk_score == 0.00 and DocumentPresentation.${pres_id}.negotiable_amount_usd == 0.00"
            - "TradeDocument.${inv_doc_id}.status == SUPERSEDED and TradeDocument.${inv_rev2_id}.revision == 2 and TradeDocument.${inv_rev2_id}.status == DRAFT"
            - "ExportOrder.${order_id}.settlement_status == DOCS_PRESENTED (the rejected examination changes nothing)"

      - name: conflict_d_lc_expired_at_exact_expiry_masks_lc_amount_exceeded
        grounds:
          - validations[priority=19]
          - validations[priority=33]
          - calculations.lc_negotiable_amount
          - entities.LetterOfCredit.fields.expiry_date
        distinguishing_aspect: |
          Conflict D: one POST /document-presentations/{presentation_id}/examine happens with
          the clock set exactly to expiry_date 2026-08-20T00:00:00Z (so priority 19's
          "strictly before" fails while the sweep's "strictly after" does not fire and the
          credit stays ACCEPTED) AND with presented_amount_usd 25000.00 above
          max_drawable_usd 20000.00; the response must be ERR_LC_EXPIRED with HTTP 409, never
          ERR_LC_AMOUNT_EXCEEDED.
        test_recipe:
          setup:
            - "ForeignBuyer (JP, BBB, NONE, not restricted); ExportOrder FOB / ZONE_1 / USD with one line 100.000 @ 250.0000 so the ISSUED invoice's declared_total_usd is 25000.00."
            - "Screened NLR, LCL booking 1000.000 kg on a sailing with cutoff 2026-08-15, invoice and packing list ISSUED, booking CONFIRMED, BILL_OF_LADING ISSUED on_board_date 2026-08-01 -> SHIPPED."
            - "LetterOfCredit LC-2195-009 with amount_usd 20000.00 and tolerance_pct 0 (max_drawable_usd 20000.00, min_drawable_usd 20000.00), SIGHT, expiry_date 2026-08-20T00:00:00Z, latest_shipment_date 2026-08-20T00:00:00Z, presentation_period_days 21, required_document_types [COMMERCIAL_INVOICE, BILL_OF_LADING]; reviewed by rev_1 and ACCEPTED."
            - "DocumentPresentation created while the clock is still 2026-08-01 (priority 33 does not apply to creation, so the over-drawing invoice is tendered successfully with days_after_on_board 0)."
            - "POST /_clock/set_current_utc then sets the clock to exactly 2026-08-20T00:00:00Z: the sweep leaves the credit ACCEPTED because it only expires credits strictly after expiry_date, and it moves the sailing to DEPARTED, which is irrelevant to the examination."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              payload: { legal_name: "Niigata Pump Trading", country_code: "JP", credit_rating: "BBB", sanctions_tier: "NONE", restricted_party_flag: false }
              as: TradeComplianceOfficer
