              payload: { plan_id: "${plan_id}", name: "Lincoln", building_code: "LIN", hardship_factor: 1.0 }
              as: DistrictStaffingAdmin
              captures: { b1: $.data.id }
            - call: "POST /sped-staffing/plans/${plan_id}/activate"
              as: DistrictStaffingAdmin
            - call: "POST /sped-staffing/paraprofessionals"
              payload: { plan_id: "${plan_id}", home_building_id: "${b1}", full_name: "Pat Para", email: "p1@district.test", base_hourly_wage_cents: 2000, contracted_max_weekly_minutes: 2400, hire_date: "2025-08-15" }
              as: DistrictStaffingAdmin
              captures: { p1: $.data.id }
            - call: "POST /sped-staffing/evaluations"
              payload: { plan_id: "${plan_id}", para_id: "${p1}", period_start: "2026-03-01", period_end: "2026-04-30", professionalism_score: 4, instructional_support_score: 4, comments: "ok" }
              as: Teacher
              as_user_id: "teacher-1"
              captures: { ev1: $.data.id }
          trigger:
            - call: "POST /sped-staffing/evaluations/${ev1}/submit"
              as: Teacher
              as_user_id: "teacher-2"
