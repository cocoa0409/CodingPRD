# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Cutting Tool & Carbide Insert Manufacturing
# Sections and claim_types are taken verbatim from
# references/claim-extraction-guide.md; nothing is invented.
# Every error_id in §1.6 is triggered by at least one instance here or by a
# named §1.8 instance (see the `errors` section for the stub map).
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: grade_creation_returns_declared_defaults
        claim_type: creation
        grounds:
          - entities.CarbideGrade
          - endpoints[POST /tooling/carbide-grades]
          - response_envelope.success
        distinguishing_aspect: "A grade created with all six required inputs returns 201 with status DRAFT, revision 1, qualified_product_count 0, version 1, authored_by_user_id echoing the caller, and the success envelope's meta/response_type/data shape."
        test_recipe:
          setup:
            - "Empty database; no grades exist"
          setup_api_calls: []
          trigger:
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-P25", target_workpiece_group: "P", co_binder_pct: 6.0, wc_grain_um: 1.2, hardness_hv: 1600, trs_mpa: 2100 }
              as: MetallurgyEngineer
              as_user_id: "me-1"
              captures: { grade_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "response.response_type == object and response.meta.api_request_id is present"
            - "CarbideGrade.${grade_id}.status == DRAFT"
            - "CarbideGrade.${grade_id}.revision == 1"
            - "CarbideGrade.${grade_id}.qualified_product_count == 0"
            - "CarbideGrade.${grade_id}.version == 1"
            - "CarbideGrade.${grade_id}.authored_by_user_id == me-1"
            - "CarbideGrade.${grade_id}.co_binder_pct == 6.0 and hardness_hv == 1600 and trs_mpa == 2100"

      - name: grade_retrieval_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /tooling/carbide-grades/{gradeId}]
          - entities.CarbideGrade
        distinguishing_aspect: "GET by id returns exactly the stored row — same id, same business fields, version still 1 because a read is not a mutation."
        test_recipe:
          setup:
            - "One DRAFT grade WC-P25"
          setup_api_calls:
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-P25", target_workpiece_group: "P", co_binder_pct: 6.0, wc_grain_um: 1.2, hardness_hv: 1600, trs_mpa: 2100 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
          trigger:
            - call: "GET /tooling/carbide-grades/${grade_id}"
              as: ProductionPlanner
              captures: { read_ver: $.data.version }
          assert:
            - "HTTP status == 200"
            - "response.data.id == ${grade_id}"
            - "response.data.grade_code == WC-P25 and target_workpiece_group == P"
            - "${read_ver} == 1"

      - name: grade_listing_filters_by_status_and_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /tooling/carbide-grades]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three grades exist, two of them still DRAFT after one is piloted; the filtered, limit-2 page reports total_count 2 for the DRAFT filter and has_more false, proving filter is applied before pagination rather than after."
        test_recipe:
          setup:
            - "Grades WC-P25 (piloted via a PASSED batch), WC-M15 and WC-K10 (both DRAFT)"
          setup_api_calls:
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-P25", target_workpiece_group: "P", co_binder_pct: 6.0, wc_grain_um: 1.2, hardness_hv: 1600, trs_mpa: 2100 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/powder-blend-batches"
              payload: { grade_id: "${grade_id}", batch_code: "BLD-1", planned_mass_kg: 120.0 }
              as: MetallurgyEngineer
              captures: { batch_id: $.data.id }
            - call: "POST /tooling/powder-blend-batches/${batch_id}/press"
              payload: { pressed_units: 200 }
              as: MetallurgyEngineer
            - call: "POST /tooling/powder-blend-batches/${batch_id}/sinter"
              payload: { sintered_units: 180, scrap_units: 20, measured_density_gcc: 14.35, measured_hardness_hv: 1580 }
              as: MetallurgyEngineer
            - call: "POST /tooling/carbide-grades/${grade_id}/start-pilot"
              as: MetallurgyEngineer
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-M15", target_workpiece_group: "M", co_binder_pct: 10.0, wc_grain_um: 1.5, hardness_hv: 1450, trs_mpa: 2600 }
              as: MetallurgyEngineer
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-K10", target_workpiece_group: "K", co_binder_pct: 6.0, wc_grain_um: 0.8, hardness_hv: 1750, trs_mpa: 1900 }
              as: MetallurgyEngineer
          trigger:
            - call: "GET /tooling/carbide-grades"
              payload: { status: "DRAFT", limit: 2, offset: 0 }
              as: ProductionPlanner
            - call: "GET /tooling/carbide-grades"
              payload: { limit: 2, offset: 2 }
              as: ProductionPlanner
          assert:
            - "the DRAFT-filtered page returns response_type array with 2 rows, total_count == 2, has_more == false"
            - "the DRAFT-filtered page contains WC-M15 and WC-K10 and excludes the PILOT grade WC-P25"
            - "the unfiltered offset-2 page returns 1 row, total_count == 3, has_more == false"

      - name: path_entity_not_found_across_every_collection
        claim_type: not_found
        grounds:
          - validations[priority=7]
          - errors.ERR_GRADE_NOT_FOUND
          - errors.ERR_BATCH_NOT_FOUND
          - errors.ERR_GEOMETRY_NOT_FOUND
          - errors.ERR_RECIPE_NOT_FOUND
          - errors.ERR_COATING_RUN_NOT_FOUND
          - errors.ERR_WHEEL_NOT_FOUND
          - errors.ERR_GRINDING_RUN_NOT_FOUND
          - errors.ERR_PRODUCT_NOT_FOUND
          - errors.ERR_DOSSIER_NOT_FOUND
          - errors.ERR_TRIAL_NOT_FOUND
          - errors.ERR_CUSTOMER_NOT_FOUND
          - errors.ERR_ORDER_NOT_FOUND
          - errors.ERR_JOB_NOT_FOUND
        distinguishing_aspect: "Every single-resource GET resolves the path id before anything else and returns its own entity-specific 404 code, not a generic one — thirteen collections, thirteen distinct error_ids, all on a syntactically valid but unknown UUID."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /tooling/carbide-grades/11111111-1111-4111-8111-111111111111"
              as: ProductionPlanner
              captures: { err_grade: $.data.error_id }
            - call: "GET /tooling/powder-blend-batches/11111111-1111-4111-8111-111111111112"
              as: ProductionPlanner
              captures: { err_batch: $.data.error_id }
            - call: "GET /tooling/insert-geometries/11111111-1111-4111-8111-111111111113"
              as: ProductionPlanner
              captures: { err_geometry: $.data.error_id }
            - call: "GET /tooling/coating-recipes/11111111-1111-4111-8111-111111111114"
              as: ProductionPlanner
              captures: { err_recipe: $.data.error_id }
            - call: "GET /tooling/coating-runs/11111111-1111-4111-8111-111111111115"
              as: ProductionPlanner
              captures: { err_coating_run: $.data.error_id }
            - call: "GET /tooling/grinding-wheels/11111111-1111-4111-8111-111111111116"
              as: ProductionPlanner
              captures: { err_wheel: $.data.error_id }
            - call: "GET /tooling/grinding-runs/11111111-1111-4111-8111-111111111117"
              as: ProductionPlanner
              captures: { err_grinding_run: $.data.error_id }
            - call: "GET /tooling/tool-products/11111111-1111-4111-8111-111111111118"
              as: ProductionPlanner
              captures: { err_product: $.data.error_id }
            - call: "GET /tooling/qualification-dossiers/11111111-1111-4111-8111-111111111119"
              as: ProductionPlanner
              captures: { err_dossier: $.data.error_id }
            - call: "GET /tooling/machining-trials/11111111-1111-4111-8111-11111111111a"
              as: ApplicationEngineer
              captures: { err_trial: $.data.error_id }
            - call: "GET /tooling/customers/11111111-1111-4111-8111-11111111111b"
              as: ProductionPlanner
              captures: { err_customer: $.data.error_id }
            - call: "GET /tooling/tool-orders/11111111-1111-4111-8111-11111111111c"
              as: ProductionPlanner
              captures: { err_order: $.data.error_id }
            - call: "GET /tooling/recondition-jobs/11111111-1111-4111-8111-11111111111d"
              as: ProductionPlanner
              captures: { err_job: $.data.error_id }
          assert:
            - "${err_grade} == ERR_GRADE_NOT_FOUND and HTTP status == 404"
            - "${err_batch} == ERR_BATCH_NOT_FOUND"
            - "${err_geometry} == ERR_GEOMETRY_NOT_FOUND"
            - "${err_recipe} == ERR_RECIPE_NOT_FOUND"
            - "${err_coating_run} == ERR_COATING_RUN_NOT_FOUND"
            - "${err_wheel} == ERR_WHEEL_NOT_FOUND"
            - "${err_grinding_run} == ERR_GRINDING_RUN_NOT_FOUND"
            - "${err_product} == ERR_PRODUCT_NOT_FOUND"
            - "${err_dossier} == ERR_DOSSIER_NOT_FOUND"
            - "${err_trial} == ERR_TRIAL_NOT_FOUND"
            - "${err_customer} == ERR_CUSTOMER_NOT_FOUND"
            - "${err_order} == ERR_ORDER_NOT_FOUND"
            - "${err_job} == ERR_JOB_NOT_FOUND"
            - "every response body follows the error envelope: response_type == error with data.error_id and data.message"

      - name: batch_create_missing_required_planned_mass_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
          - endpoints[POST /tooling/powder-blend-batches]
        distinguishing_aspect: "planned_mass_kg has source input with no default, so omitting it fails schema validation at priority 3 with ERR_INVALID_REQUEST (400) before the grade reference at priority 8 is even resolved."
        test_recipe:
          setup:
            - "One DRAFT grade"
          setup_api_calls:
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-P25", target_workpiece_group: "P", co_binder_pct: 6.0, wc_grain_um: 1.2, hardness_hv: 1600, trs_mpa: 2100 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
          trigger:
            - call: "POST /tooling/powder-blend-batches"
              payload: { grade_id: "${grade_id}", batch_code: "BLD-1" }
              as: MetallurgyEngineer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status == 400"
            - "no PowderBlendBatch row is created"

      - name: customer_regrind_credit_defaults_to_zero
        claim_type: defaults
        grounds:
          - endpoints[POST /tooling/customers]
          - entities.Customer.fields.regrind_credit_cents
          - entities.Customer.fields.reserved_credit_cents
        distinguishing_aspect: "regrind_credit_cents is the only optional input on customer creation; omitting it yields 0 (not null), reserved_credit_cents 0 and account_status ACTIVE."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /tooling/customers"
              payload: { customer_code: "CU-2", name: "Beta Tool Room", tier: "STANDARD" }
              as: ProductionPlanner
              captures: { customer_id: $.data.id }
          assert:
            - "Customer.${customer_id}.regrind_credit_cents == 0"
            - "Customer.${customer_id}.reserved_credit_cents == 0"
            - "Customer.${customer_id}.account_status == ACTIVE"
            - "Customer.${customer_id}.version == 1"

      - name: recipe_total_thickness_is_computed_from_layers
        claim_type: computed_fields
        grounds:
          - entities.CoatingRecipe.fields.total_thickness_um
          - endpoints[POST /tooling/coating-recipes]
        distinguishing_aspect: "total_thickness_um is computed as the sum of the layer stack to 2 decimals (2.00 + 1.50 = 3.50) and is not a client input; the recipe also starts unvalidated with a null adhesion_class."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /tooling/coating-recipes"
              payload: { recipe_code: "PVD-DUO-35", deposition_type: "PVD", layers: [{ material: "TiN", thickness_um: 2.0 }, { material: "TiAlN", thickness_um: 1.5 }] }
              as: CoatingEngineer
              captures: { recipe_id: $.data.id }
          assert:
            - "CoatingRecipe.${recipe_id}.total_thickness_um == 3.50"
            - "CoatingRecipe.${recipe_id}.layer_count == 2"
            - "CoatingRecipe.${recipe_id}.revision == 1"
            - "CoatingRecipe.${recipe_id}.is_validated == false"
            - "CoatingRecipe.${recipe_id}.adhesion_class == null"

      - name: grade_client_supplied_system_fields_must_not_be_honored
        claim_type: system_fields
        grounds:
          - entities.CarbideGrade
          - endpoints[POST /tooling/carbide-grades]
        distinguishing_aspect: "id, created_at, version, status and revision are server-minted; a request that also carries them must ignore the client values — the returned id is a fresh server UUID with no type prefix and version is 1, never the supplied 99."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-P25", target_workpiece_group: "P", co_binder_pct: 6.0, wc_grain_um: 1.2, hardness_hv: 1600, trs_mpa: 2100, id: "deadbeef-0000-4000-8000-000000000000", version: 99, status: "QUALIFIED", revision: 7 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "${grade_id} != deadbeef-0000-4000-8000-000000000000"
            - "CarbideGrade.${grade_id}.version == 1"
            - "CarbideGrade.${grade_id}.status == DRAFT"
            - "CarbideGrade.${grade_id}.revision == 1"
            - "CarbideGrade.${grade_id}.created_at is a server ISO 8601 UTC timestamp with three fractional digits"

      - name: geometry_invalid_application_class_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=4]
          - errors.ERR_INVALID_REQUEST
          - entities.InsertGeometry.fields.application_class
        distinguishing_aspect: "application_class is a closed enum {ROUGHING, MEDIUM, FINISHING} and rake_angle_deg / nose_radius_mm carry numeric domains; an out-of-enum class and a negative nose radius both fail at priority 4 with ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "BAD-1", iso_designation: "CNMG120408", application_class: "EXTREME", chipbreaker_code: "MM", rake_angle_deg: 12.0, nose_radius_mm: 0.8, max_depth_of_cut_mm: 4.0, edge_prep: "HONED" }
              as: GeometryEngineer
              captures: { err_enum: $.data.error_id }
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "BAD-2", iso_designation: "CNMG120408", application_class: "MEDIUM", chipbreaker_code: "MM", rake_angle_deg: 12.0, nose_radius_mm: -0.8, max_depth_of_cut_mm: 4.0, edge_prep: "HONED" }
              as: GeometryEngineer
              captures: { err_range: $.data.error_id }
          assert:
            - "${err_enum} == ERR_INVALID_REQUEST and HTTP status == 400"
            - "${err_range} == ERR_INVALID_REQUEST"
            - "no InsertGeometry row exists with geometry_code BAD-1 or BAD-2"

      - name: batch_create_with_unknown_grade_rejected
        claim_type: parent_relationships
        grounds:
          - validations[priority=8]
          - errors.ERR_GRADE_NOT_FOUND
          - entities.PowderBlendBatch.parent
        distinguishing_aspect: "PowderBlendBatch declares CarbideGrade as its parent, so a body reference to a non-existent grade fails with the parent's own 404 code before any batch row is written."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /tooling/powder-blend-batches"
              payload: { grade_id: "22222222-2222-4222-8222-222222222222", batch_code: "BLD-ORPHAN", planned_mass_kg: 120.0 }
              as: MetallurgyEngineer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_GRADE_NOT_FOUND"
            - "HTTP status == 404"
            - "no PowderBlendBatch row exists with batch_code BLD-ORPHAN"

      - name: product_graph_references_are_validated_on_create
        claim_type: entity_topology_graph
        grounds:
          - complexity_profile.entity_topology
          - validations[priority=8]
          - entities.ToolProduct.fields.geometry_id
          - entities.ToolProduct.fields.base_catalog_product_id
        distinguishing_aspect: "ToolProduct sits at the junction of three independent parents plus a self-referential base_catalog_product_id; each unknown reference is rejected with that reference's own 404, and the self-reference is resolved like any other foreign key."
        test_recipe:
          setup:
            - "One DRAFT grade and one DRAFT geometry"
          setup_api_calls:
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-P25", target_workpiece_group: "P", co_binder_pct: 6.0, wc_grain_um: 1.2, hardness_hv: 1600, trs_mpa: 2100 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "CNMG-MM", iso_designation: "CNMG120408", application_class: "MEDIUM", chipbreaker_code: "MM", rake_angle_deg: 12.0, nose_radius_mm: 0.8, max_depth_of_cut_mm: 4.0, edge_prep: "HONED" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
          trigger:
            - call: "POST /tooling/tool-products"
              payload: { sku: "ORPHAN-GEO", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "33333333-3333-4333-8333-333333333333", tool_type: "INSERT", list_price_cents: 4550, min_order_qty: 25, nominal_length_mm: 12.7, min_regrind_length_mm: 12.7, regrind_step_mm: 0.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { err_geometry: $.data.error_id }
            - call: "POST /tooling/tool-products"
              payload: { sku: "ORPHAN-BASE", order_class: "SPECIAL", grade_id: "${grade_id}", geometry_id: "${geometry_id}", base_catalog_product_id: "44444444-4444-4444-8444-444444444444", tool_type: "INSERT", list_price_cents: 6100, min_order_qty: 5, nominal_length_mm: 12.7, min_regrind_length_mm: 12.7, regrind_step_mm: 0.5, grind_units_per_tool: 20 }
              as: ApplicationEngineer
              captures: { err_base: $.data.error_id }
          assert:
            - "${err_geometry} == ERR_GEOMETRY_NOT_FOUND and HTTP status == 404"
            - "${err_base} == ERR_PRODUCT_NOT_FOUND"
            - "no ToolProduct row exists with sku ORPHAN-GEO or ORPHAN-BASE"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: newly_created_entities_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.ToolProduct
          - state_machines.GrindingWheel
          - state_machines.GrindingRun
          - state_machines.PowderBlendBatch
        distinguishing_aspect: "Each entity's first observable state is exactly its declared initial_state, including ToolProduct's two parallel dimensions (release_status DEVELOPMENT and supply_status UNAVAILABLE) which start independently."
        test_recipe:
          setup:
            - "One DRAFT grade and one DRAFT geometry so a product and a grinding run can be created"
          setup_api_calls:
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-K10", target_workpiece_group: "K", co_binder_pct: 6.0, wc_grain_um: 0.8, hardness_hv: 1750, trs_mpa: 1900 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "EM-4F-30", iso_designation: "EM10-4F", application_class: "MEDIUM", chipbreaker_code: "NONE", rake_angle_deg: 10.0, nose_radius_mm: 0.5, max_depth_of_cut_mm: 10.0, edge_prep: "SHARP" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
          trigger:
            - call: "POST /tooling/tool-products"
              payload: { sku: "EM-10-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "SOLID_CARBIDE_ENDMILL", list_price_cents: 12000, min_order_qty: 1, nominal_length_mm: 100.0, min_regrind_length_mm: 70.0, regrind_step_mm: 2.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { product_id: $.data.id }
            - call: "POST /tooling/powder-blend-batches"
              payload: { grade_id: "${grade_id}", batch_code: "BLD-1", planned_mass_kg: 120.0 }
              as: MetallurgyEngineer
              captures: { batch_id: $.data.id }
            - call: "POST /tooling/grinding-wheels"
              payload: { wheel_code: "WH-1", spec_code: "D64-C100", initial_life_units: 100000 }
              as: ProductionPlanner
              captures: { wheel_id: $.data.id }
            - call: "POST /tooling/grinding-runs"
              payload: { wheel_id: "${wheel_id}", product_id: "${product_id}", cell_id: "CELL_A", window_start: "2026-08-12T06:00:00Z", window_end: "2026-08-12T10:00:00Z", planned_units: 5 }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
          assert:
            - "ToolProduct.${product_id}.release_status == DEVELOPMENT and supply_status == UNAVAILABLE"
            - "ToolProduct.${product_id}.tool_life_index == null and qualified_workpiece_groups == [] and open_order_units == 0"
            - "PowderBlendBatch.${batch_id}.stage == BLENDED and qc_status == PENDING"
            - "GrindingWheel.${wheel_id}.status == AVAILABLE, consumed_life_units == 0, remaining_life_units == 100000, dress_count == 0"
            - "GrindingRun.${run_id}.status == SCHEDULED, consumed_life_units == 0, tolerance_class == null"

      - name: geometry_release_then_revise_round_trip
        claim_type: valid_transition
        grounds:
          - state_machines.InsertGeometry.DRAFT_to_RELEASED
          - state_machines.InsertGeometry.RELEASED_to_DRAFT
          - endpoints[POST /tooling/insert-geometries/{geometryId}/revise]
        distinguishing_aspect: "Release moves DRAFT -> RELEASED without touching revision; a revise moves RELEASED -> DRAFT and increments revision to 2, so the geometry must be released again before any product can enter qualification against it."
        test_recipe:
          setup:
            - "One DRAFT geometry at revision 1"
          setup_api_calls:
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "CNMG-MM", iso_designation: "CNMG120408", application_class: "MEDIUM", chipbreaker_code: "MM", rake_angle_deg: 12.0, nose_radius_mm: 0.8, max_depth_of_cut_mm: 4.0, edge_prep: "HONED" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
          trigger:
            - call: "POST /tooling/insert-geometries/${geometry_id}/release"
              as: GeometryEngineer
            - call: "POST /tooling/insert-geometries/${geometry_id}/revise"
              payload: { chipbreaker_code: "MF", rake_angle_deg: 14.0, nose_radius_mm: 0.4, max_depth_of_cut_mm: 3.0, edge_prep: "SHARP", revision_note: "Finishing chip breaker variant" }
              as: GeometryEngineer
            - call: "POST /tooling/insert-geometries/${geometry_id}/release"
              as: GeometryEngineer
          assert:
            - "after the first release: InsertGeometry.${geometry_id}.status == RELEASED and revision == 1"
            - "after the revise: InsertGeometry.${geometry_id}.status == DRAFT and revision == 2"
            - "after the revise: InsertGeometry.${geometry_id}.nose_radius_mm == 0.4 and chipbreaker_code == MF"
            - "after the second release: InsertGeometry.${geometry_id}.status == RELEASED and revision == 2"

      - name: start_pilot_without_a_passed_batch_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CarbideGrade.DRAFT_to_PILOT
          - errors.ERR_NO_PASSED_BATCH
        distinguishing_aspect: "A grade whose only batch is merely PRESSED has no SINTERED + PASSED evidence on the current revision, so start-pilot fails with ERR_NO_PASSED_BATCH and the grade stays DRAFT."
        test_recipe:
          setup:
            - "Grade WC-P25 DRAFT with one batch at stage PRESSED and qc_status PENDING"
          setup_api_calls:
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-P25", target_workpiece_group: "P", co_binder_pct: 6.0, wc_grain_um: 1.2, hardness_hv: 1600, trs_mpa: 2100 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/powder-blend-batches"
              payload: { grade_id: "${grade_id}", batch_code: "BLD-1", planned_mass_kg: 120.0 }
              as: MetallurgyEngineer
              captures: { batch_id: $.data.id }
            - call: "POST /tooling/powder-blend-batches/${batch_id}/press"
              payload: { pressed_units: 200 }
              as: MetallurgyEngineer
          trigger:
            - call: "POST /tooling/carbide-grades/${grade_id}/start-pilot"
              as: MetallurgyEngineer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NO_PASSED_BATCH"
            - "HTTP status == 409"
            - "CarbideGrade.${grade_id}.status == DRAFT"
            - "PowderBlendBatch.${batch_id}.stage == PRESSED and qc_status == PENDING"

      - name: coating_run_completion_before_window_end_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CoatingRun.SCHEDULED_to_COMPLETED
          - validations[priority=30]
          - errors.ERR_WINDOW_NOT_ELAPSED
        distinguishing_aspect: "Completion is gated on the logical clock reaching window_end; at 11:59:59Z the run cannot be completed, and one second later it can — the same payload, two outcomes, decided only by the clock."
        test_recipe:
          setup:
            - "Recipe PVD-TIALN-3 with a SCHEDULED run in CH1 over [2026-08-10T06:00Z, 12:00Z)"
            - "Logical clock advanced to 2026-08-10T11:59:59Z"
          setup_api_calls:
            - call: "POST /tooling/coating-recipes"
              payload: { recipe_code: "PVD-TIALN-3", deposition_type: "PVD", layers: [{ material: "TiAlN", thickness_um: 3.0 }] }
              as: CoatingEngineer
              captures: { recipe_id: $.data.id }
            - call: "POST /tooling/coating-runs"
              payload: { recipe_id: "${recipe_id}", chamber_id: "CH1", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T12:00:00Z", loaded_area_cm2: 2500.00 }
              as: CoatingEngineer
              captures: { run_id: $.data.id }
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T11:59:59Z" }
              as: ProductionPlanner
          trigger:
            - call: "POST /tooling/coating-runs/${run_id}/complete"
              payload: { adhesion_hf_class: 2, measured_thickness_um: 3.10 }
              as: CoatingEngineer
              captures: { err: $.data.error_id }
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/coating-runs/${run_id}/complete"
              payload: { adhesion_hf_class: 2, measured_thickness_um: 3.10 }
              as: CoatingEngineer
          assert:
            - "${err} == ERR_WINDOW_NOT_ELAPSED and HTTP status == 409"
            - "at 11:59:59Z the run is still SCHEDULED and CoatingRecipe is_validated == false"
            - "at exactly window_end the run becomes COMPLETED"
            - "CoatingRecipe.${recipe_id}.is_validated == true and adhesion_class == 2"

      - name: repeated_actions_rejected_from_already_advanced_states
        claim_type: idempotency
        grounds:
          - validations[priority=12]
          - errors.ERR_INVALID_BATCH_STATE
          - errors.ERR_INVALID_GEOMETRY_STATE
          - errors.ERR_INVALID_GRADE_STATE
          - errors.ERR_INVALID_WHEEL_STATE
          - errors.ERR_INVALID_CUSTOMER_STATE
        distinguishing_aspect: "None of the action endpoints are idempotent: replaying press, release, start-pilot, dress and close from the state each one already produced yields that entity's own ERR_INVALID_*_STATE at priority 12, and no field changes a second time."
        test_recipe:
          setup:
            - "Grade WC-P25 in PILOT with batch BLD-1 at SINTERED/PASSED, geometry CNMG-MM RELEASED, wheel WH-1 AVAILABLE, customer CU-3 CLOSED"
          setup_api_calls:
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-P25", target_workpiece_group: "P", co_binder_pct: 6.0, wc_grain_um: 1.2, hardness_hv: 1600, trs_mpa: 2100 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/powder-blend-batches"
