            - call: "POST /service-floor/parties"
              payload: { venue_id: "${venue_id}", lead_guest_name: "Dana Whitfield", contact_phone: "212-555-0141", loyalty_tier: "GOLD" }
              as: Host
              captures: { party_x: $.data.id }
            - call: "POST /service-floor/reservations"
              payload: { venue_id: "${venue_id}", party_id: "${party_x}", tier_id: "${tier6_id}", party_size: 4, scheduled_time: "2026-09-03T19:00:00Z", payment_mode: "CARD_ONLY", celebration: "NONE" }
