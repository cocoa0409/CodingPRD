  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (two DIFFERENT category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: execute_verified_action_state_beats_fiscal
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_DISTRIBUTION_EXCEEDS_BALANCE]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: re-executing a VERIFIED
          corrective distribution violates both the state precondition
          (priority 4) and the fiscal balance check (priority 9 — its 9000c
          total exceeds the participant's post-execution 1000c balance); the
          state error ERR_INVALID_STATE_TRANSITION must win.
        test_recipe:
          setup:
            - "Engagement PY2025; participant with opening_balance 10000c"
            - "Manual MEDIUM finding, acknowledged; corrective distribution of 9000c approved, executed (balance now 1000c) and verified"
