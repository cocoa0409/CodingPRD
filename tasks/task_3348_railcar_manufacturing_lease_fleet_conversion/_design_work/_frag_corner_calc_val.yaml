        distinguishing_aspect: "A component with 25 on hand feeding a 4-per-car bill-of-material row for an order of 5 cars ends with on_hand_qty exactly 5 and reserved_qty exactly 20, and reserved_qty stays 0 until the order reaches RELEASED because the reservations term counts only RELEASED orders."
