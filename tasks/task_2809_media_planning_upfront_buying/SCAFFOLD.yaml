scenario: |
  2809. Media Planning & Upfront Buying (advertising media agency): brand objective translation
  into reach, frequency and target audience goals with budget allocation across channels,
  marketplace forecasting for inventory availability and pricing across the upfront and scatter
  markets, negotiation with sellers on cost per thousand, audience guarantees and make-good
  provisions, buy placement with unit mix across dayparts, programs and platforms, stewardship
  with post-buy analysis against guaranteed delivery and make-good scheduling, option and
  cancellation rights exercise at defined windows, cross-platform measurement reconciliation
  across linear and digital with duplication estimates, client billing, sequential liability and
  payment terms.

domain_name: media-planning-upfront-buying
api_prefix: /upfront

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Every entity is a peer addressed at `/upfront/<collection>/{id}` and linked by explicit
  # foreign-key body fields. There is no nested ownership path anywhere in §1.5.

  state_machine_shape: parallel
  # Buy carries three independent axes (buy_status x stewardship_status x settlement_status);
  # Campaign carries two (plan_status x funding_status); Invoice carries two
  # (client_status x seller_status). Negotiation, MakeGood, InventoryForecast and
  # Campaign.plan_status are additionally cyclic.

  relationship_patterns:
    - one_to_many          # Campaign -> ChannelAllocation, Buy -> BuyUnit, Buy -> DeliveryReport
    - cross_aggregate      # BuyUnit -> InventoryForecast (seller-owned inventory) from a Buy under a Campaign
    - polymorphic          # BuyUnit.make_good_id is null for ordered units and set for make-good units

  role_model: segregation_of_duties
  # The AgencyController who releases a seller remittance may not be the same X-User-ID that
  # placed the buy being remitted (§1.4 priority 36).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Advertiser
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: brand client legal name
        constraints: non-empty, max 120 chars
      - name: category_code
        type: enum
        source: input
        description: product category used for competitive-separation checks on a Seller
        constraints: one of BEVERAGE, AUTOMOTIVE, PHARMA, RETAIL, FINANCE, TELECOM, GROCERY, INSURANCE, TRAVEL, BEAUTY, FITNESS, TECHNOLOGY, HOME, ELECTRONICS
      - name: payment_terms_days
        type: integer
        source: input
        description: net days added to the logical clock at invoice issue to derive Invoice.due_date
        default: 30
        constraints: integer 0..120 inclusive
      - name: sequential_liability_enabled
        type: boolean
        source: input
        description: when true, seller remittance is capped by the pro-rata share of client cash received (§1.3 sequential_liability_release)
        default: true
      - name: credit_limit_cents
        type: integer
        source: input
        description: maximum outstanding client receivable permitted before plan approval is blocked
        constraints: integer >= 0
      - name: credit_status
        type: enum
        source: system
        description: credit posture derived from late-payment history
        default: ACTIVE
        constraints: one of ACTIVE, WATCH, HOLD
      - name: late_payment_count
        type: integer
        source: system
        description: number of Invoice client payments recorded after Invoice.due_date
        default: 0
      - name: outstanding_receivable_cents
        type: integer
        source: computed
        description: sum of (Invoice.net_payable_cents - Invoice.client_paid_cents) over Invoices whose client_status IN {ISSUED, PARTIALLY_PAID} for Buys whose Campaign.advertiser_id equals this Advertiser.id

  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - name: advertiser_id
        type: string
        source: input
        description: FK -> Advertiser.id; the brand client whose objective this campaign translates
      - name: name
        type: string
        source: input
        description: campaign name
        constraints: non-empty, max 160 chars
      - name: target_demo
        type: string
        source: input
        description: guaranteed target audience label, e.g. "A25-54"
        constraints: non-empty, max 16 chars
      - name: universe_thousands
        type: integer
        source: input
        description: size of the target demo universe expressed in thousands of people
        constraints: integer > 0
      - name: reach_goal_pct
        type: number
        source: input
        description: brand objective for percent of the target universe reached at least once
        constraints: number > 0 and <= 100, at most 2 decimals
      - name: frequency_goal
        type: number
        source: input
        description: brand objective for average exposures per reached person
        constraints: number > 0, at most 2 decimals
      - name: total_budget_cents
        type: integer
        source: input
        description: working media budget authorised by the client, gross of agency commission
        constraints: integer > 0
      - name: flight_start
        type: datetime
        source: input
        description: first instant of the campaign flight (ISO 8601 UTC)
      - name: flight_end
        type: datetime
        source: input
        description: last instant of the campaign flight (ISO 8601 UTC); must be after flight_start
      - name: fiscal_quarter
        type: string
        source: input
        description: upfront selling quarter label, e.g. "2026Q4"
        constraints: matches ^\d{4}Q[1-4]$
      - name: plan_status
        type: enum
        source: system
        description: planning axis; cycles back to PENDING_CLIENT_APPROVAL after a revision
        default: DRAFT
        constraints: one of DRAFT, PENDING_CLIENT_APPROVAL, APPROVED, REVISION_REQUIRED
      - name: funding_status
        type: enum
        source: system
        description: funding axis; evolves independently of plan_status
        default: UNFUNDED
        constraints: one of UNFUNDED, PARTIALLY_FUNDED, FUNDED
      - name: plan_posture
        type: enum
        source: computed
        description: REPLAN_REQUIRED when at least one ChannelAllocation of this campaign has posture OVERCOMMITTED, else WITHIN_PLAN
        default: WITHIN_PLAN
        constraints: one of WITHIN_PLAN, REPLAN_REQUIRED
      - name: funded_cents
        type: integer
        source: system
        description: cumulative client cash committed to this campaign via POST /upfront/campaigns/{campaignId}/fund
        default: 0
      - name: allocated_budget_cents
        type: integer
        source: computed
        description: sum of ChannelAllocation.allocated_cents over allocations of this campaign whose status IN {DRAFT, LOCKED}
      - name: unallocated_budget_cents
        type: integer
        source: computed
        description: total_budget_cents - allocated_budget_cents (rounding residue of the percent split)
      - name: committed_gross_cents
        type: integer
        source: computed
        description: sum of Buy.gross_cost_cents over Buys of this campaign whose buy_status IN {PLACED, IN_FLIGHT, COMPLETED, CLOSED}
      - name: uncommitted_budget_cents
        type: integer
        source: computed
        description: total_budget_cents - committed_gross_cents
      - name: planned_impressions_total
        type: integer
        source: computed
        description: sum of ChannelAllocation.planned_impressions over allocations of this campaign whose status IN {DRAFT, LOCKED}
      - name: planned_grp_total
        type: number
        source: computed
        description: sum of ChannelAllocation.planned_grp over allocations of this campaign whose status IN {DRAFT, LOCKED}, 2 decimals

  - name: ChannelAllocation
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: FK -> Campaign.id; the plan this channel line belongs to
      - name: channel
        type: enum
        source: input
        description: media channel receiving this share of the budget
        constraints: one of LINEAR_TV, CTV, DIGITAL_VIDEO, AUDIO
      - name: allocation_pct
        type: number
        source: input
        description: percent of Campaign.total_budget_cents assigned to this channel
        constraints: number > 0 and <= 100, at most 2 decimals
      - name: planned_cpm_cents
        type: integer
        source: input
        description: planning-stage cost per thousand impressions before market and daypart adjustment
        constraints: integer > 0
      - name: planned_market
        type: enum
        source: input
        description: marketplace this channel line is planned against
        constraints: one of UPFRONT, SCATTER
      - name: primary_daypart
        type: enum
        source: input
        description: daypart driving the planning index for this channel line
        constraints: one of PRIME, DAYTIME, LATE, DIGITAL_ANY
      - name: allocated_cents
        type: integer
        source: computed
        description: floor(Campaign.total_budget_cents * allocation_pct / 100)
      - name: effective_planned_cpm_cents
        type: integer
        source: computed
        description: market- and daypart-adjusted CPM clamped to the planning band (§1.3 planned_delivery_projection)
      - name: planned_impressions
        type: integer
        source: computed
        description: floor(allocated_cents * 1000 / effective_planned_cpm_cents)
      - name: planned_grp
        type: number
        source: computed
        description: gross rating points implied by planned_impressions against the campaign universe, 2 decimals
      - name: planned_frequency
        type: number
        source: computed
        description: planned_grp / Campaign.reach_goal_pct, 2 decimals
      - name: committed_cents
        type: integer
        source: computed
        description: sum of Buy.gross_cost_cents over Buys whose channel_allocation_id equals this allocation and whose buy_status IN {PLACED, IN_FLIGHT, COMPLETED, CLOSED}
      - name: posture
        type: enum
        source: computed
        description: OVERCOMMITTED when committed_cents > allocated_cents, else WITHIN_PLAN
        default: WITHIN_PLAN
        constraints: one of WITHIN_PLAN, OVERCOMMITTED
      - name: status
        type: enum
        source: system
        description: DRAFT while the plan is editable, LOCKED once the client approves the plan
        default: DRAFT
        constraints: one of DRAFT, LOCKED

  - name: Seller
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: media seller (network / platform group) name
        constraints: non-empty, max 120 chars
      - name: platform_types
        type: array
        source: input
        description: platforms this seller can deliver, array of LINEAR, CTV, DIGITAL, AUDIO
        constraints: non-empty array, values from {LINEAR, CTV, DIGITAL, AUDIO}, no duplicates
      - name: make_good_capacity_impressions
        type: integer
        source: input
        description: ceiling on impressions this seller may hold in SCHEDULED make-goods at any time
        constraints: integer >= 0
      - name: open_make_good_impressions
        type: integer
        source: computed
        description: sum of MakeGood.shortfall_impressions over MakeGoods whose Buy.seller_id equals this Seller.id and whose status IN {OPEN, OFFERED}
      - name: scheduled_make_good_impressions
        type: integer
        source: computed
        description: sum of MakeGood.offered_impressions over MakeGoods whose Buy.seller_id equals this Seller.id and whose status == SCHEDULED

  - name: InventoryForecast
    parent: null
    common_fields: true
    fields:
      - name: seller_id
        type: string
        source: input
        description: FK -> Seller.id; owner of the forecast inventory
      - name: market
        type: enum
        source: input
        description: marketplace the avail is offered in
        constraints: one of UPFRONT, SCATTER
      - name: fiscal_quarter
        type: string
        source: input
        description: selling quarter this avail belongs to
        constraints: matches ^\d{4}Q[1-4]$
      - name: daypart
        type: enum
        source: input
        description: daypart of the avail
        constraints: one of PRIME, DAYTIME, LATE, DIGITAL_ANY
      - name: program
        type: string
        source: input
        description: program or property name carrying the avail
        constraints: non-empty, max 120 chars
      - name: platform
        type: enum
        source: input
        description: delivery platform of the avail
        constraints: one of LINEAR, CTV, DIGITAL, AUDIO
      - name: window_start
        type: datetime
        source: input
        description: first instant the avail can air (ISO 8601 UTC)
      - name: window_end
        type: datetime
        source: input
        description: last instant the avail can air (ISO 8601 UTC); must be after window_start
      - name: total_impressions
        type: integer
        source: input
        description: forecast impressions available in this avail for the whole window
        constraints: integer > 0
      - name: available_impressions
        type: integer
        source: system
        description: total_impressions minus impressions held by BuyUnits with status IN {SCHEDULED, AIRED, MAKE_GOOD_SCHEDULED, MAKE_GOOD_AIRED}; initialised to total_impressions
      - name: forecast_cpm_cents
        type: integer
        source: input
        description: seller's asking cost per thousand impressions for this avail
        constraints: integer > 0
      - name: exclusivity_mode
        type: enum
        source: input
        description: EXCLUSIVE avails admit only one occupying BuyUnit per air window, SHARED avails admit many up to available_impressions
        default: SHARED
        constraints: one of SHARED, EXCLUSIVE
      - name: status
        type: enum
        source: system
        description: DRAFT until published, PUBLISHED while sellable, EXHAUSTED while available_impressions == 0
        default: DRAFT
        constraints: one of DRAFT, PUBLISHED, EXHAUSTED

  - name: Negotiation
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: FK -> Campaign.id; the plan being bought against
      - name: seller_id
        type: string
        source: input
        description: FK -> Seller.id; the counterparty
      - name: channel_allocation_id
        type: string
        source: input
        description: FK -> ChannelAllocation.id; the channel line this negotiation draws budget from
      - name: market
        type: enum
        source: input
        description: marketplace being negotiated in
        constraints: one of UPFRONT, SCATTER
      - name: channel
        type: enum
        source: input
        description: channel being negotiated; must equal ChannelAllocation.channel
        constraints: one of LINEAR_TV, CTV, DIGITAL_VIDEO, AUDIO
      - name: requested_impressions
        type: integer
        source: input
        description: audience impressions the agency opens for
        constraints: integer > 0
      - name: opening_cpm_cents
        type: integer
        source: input
        description: agency's opening cost per thousand impressions
        constraints: integer > 0
      - name: guarantee_pct
        type: number
        source: input
        description: share of impressions the seller guarantees on the target demo
        default: 100
        constraints: number > 0 and <= 100, at most 2 decimals
      - name: make_good_provision
        type: enum
        source: input
        description: remedy the parties agree for under-delivery
        default: MAKE_GOOD_UNITS
        constraints: one of MAKE_GOOD_UNITS, CASH_CREDIT, NONE
      - name: option_pct_ceiling
        type: number
        source: input
        description: maximum percent of guaranteed impressions the agency may add by exercising the option right
        default: 25
        constraints: number >= 0 and <= 100, at most 2 decimals
      - name: current_cpm_cents
        type: integer
        source: system
        description: cost per thousand of the offer or counter currently on the table
      - name: current_impressions
        type: integer
        source: system
        description: impressions of the offer or counter currently on the table
      - name: round_number
        type: integer
        source: system
        description: negotiation round counter; 1 at creation and incremented by every counter and every revision
        default: 1
      - name: last_offer_actor
        type: enum
        source: system
        description: which side put the current terms on the table
        default: AGENCY
        constraints: one of AGENCY, SELLER
      - name: status
        type: enum
        source: system
        description: cyclic negotiation state
        default: AGENCY_OFFER
        constraints: one of AGENCY_OFFER, SELLER_COUNTER, ACCEPTED, WITHDRAWN
      - name: accepted_cpm_cents
        type: integer
        source: system
        description: cost per thousand frozen at acceptance; null until ACCEPTED
      - name: accepted_impressions
        type: integer
        source: system
        description: guaranteed impressions frozen at acceptance; null until ACCEPTED

  - name: Buy
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: system
        description: FK -> Campaign.id; copied from the accepted Negotiation
      - name: seller_id
        type: string
        source: system
        description: FK -> Seller.id; copied from the accepted Negotiation
      - name: negotiation_id
        type: string
        source: system
        description: FK -> Negotiation.id; the negotiation whose acceptance created this buy
      - name: channel_allocation_id
        type: string
        source: system
        description: FK -> ChannelAllocation.id; the channel line this buy commits against
      - name: market
        type: enum
        source: system
        description: marketplace of the buy, copied from the negotiation
        constraints: one of UPFRONT, SCATTER
      - name: channel
        type: enum
        source: system
        description: channel of the buy, copied from the negotiation
        constraints: one of LINEAR_TV, CTV, DIGITAL_VIDEO, AUDIO
      - name: guaranteed_impressions
        type: integer
        source: system
        description: audience impressions guaranteed by the seller; mutated by exercised option and cancellation rights
      - name: agreed_cpm_cents
        type: integer
        source: system
        description: negotiated cost per thousand frozen at acceptance
      - name: net_media_cost_cents
        type: integer
        source: computed
        description: round_half_up(guaranteed_impressions / 1000 * agreed_cpm_cents)
      - name: commission_rate
        type: number
        source: computed
        description: agency commission rate selected from the net_media_cost_cents tier (§1.3 negotiated_buy_cost), 4 decimals
      - name: agency_commission_cents
        type: integer
        source: computed
        description: round_half_up(net_media_cost_cents * commission_rate)
      - name: gross_cost_cents
        type: integer
        source: computed
        description: net_media_cost_cents + agency_commission_cents
      - name: placed_impressions
        type: integer
        source: computed
        description: sum of BuyUnit.projected_impressions over units of this buy whose status IN {SCHEDULED, AIRED, MAKE_GOOD_SCHEDULED, MAKE_GOOD_AIRED}
      - name: credited_impressions_provisional
        type: integer
        source: computed
        description: PROVISIONAL variant credit - sum of DeliveryReport.delivered_impressions over reports of this buy whose status IN {SUBMITTED, ACCEPTED}
      - name: credited_impressions_final
        type: integer
        source: computed
        description: FINAL variant credit - sum of DeliveryReport.delivered_demo_impressions over reports of this buy whose status == ACCEPTED
      - name: provisional_delivery_index
        type: number
        source: computed
        description: round_half_up(credited_impressions_provisional / guaranteed_impressions, 4)
      - name: final_delivery_index
        type: number
        source: computed
        description: round_half_up(credited_impressions_final / guaranteed_impressions, 4)
      - name: open_shortfall_impressions
        type: integer
        source: computed
        description: max(0, guaranteed_impressions - credited_impressions_final - made_good_impressions - waived_impressions)
      - name: made_good_impressions
        type: integer
        source: system
        description: impressions covered by MakeGoods of this buy in status SCHEDULED
        default: 0
      - name: waived_impressions
        type: integer
        source: system
        description: impressions released by MakeGoods of this buy in status WAIVED
        default: 0
      - name: buy_status
        type: enum
        source: system
        description: placement axis
        default: PENDING_PLACEMENT
        constraints: one of PENDING_PLACEMENT, PLACED, IN_FLIGHT, COMPLETED, CLOSED, CANCELLED
      - name: stewardship_status
        type: enum
        source: system
        description: post-buy axis, independent of buy_status
        default: NOT_STARTED
        constraints: one of NOT_STARTED, ON_TRACK, AT_RISK, UNDER_DELIVERED, WITHIN_TOLERANCE, MADE_GOOD
      - name: settlement_status
        type: enum
        source: system
        description: billing axis, independent of buy_status and stewardship_status
        default: UNBILLED
        constraints: one of UNBILLED, INVOICED, CLIENT_PAID, REMITTED
      - name: flight_start
        type: datetime
        source: system
        description: copied from Campaign.flight_start at buy creation
      - name: flight_end
        type: datetime
        source: system
        description: copied from Campaign.flight_end at buy creation
      - name: option_window_close
        type: datetime
        source: system
        description: flight_start minus 45 days; last instant an OPTION_ROLL right may be exercised (inclusive)
      - name: cancel_window_1_close
        type: datetime
        source: system
        description: flight_start minus 60 days; while the clock is strictly before this instant the cancellation ceiling is 100 percent
      - name: cancel_window_2_close
        type: datetime
        source: system
        description: flight_start minus 30 days; from cancel_window_1_close inclusive up to this instant exclusive the cancellation ceiling is 25 percent; at or after it no cancellation right exists
      - name: option_pct_ceiling
        type: number
        source: system
        description: copied from Negotiation.option_pct_ceiling at buy creation
      - name: cancelled_pct_cumulative
        type: number
        source: system
        description: sum of requested_pct over RightsExercises of this buy with kind CANCELLATION
        default: 0
      - name: option_pct_cumulative
        type: number
        source: system
        description: sum of requested_pct over RightsExercises of this buy with kind OPTION_ROLL
        default: 0
      - name: make_good_provision
        type: enum
        source: system
        description: remedy copied from the accepted Negotiation
        constraints: one of MAKE_GOOD_UNITS, CASH_CREDIT, NONE
      - name: placed_by_user_id
        type: string
        source: system
        description: X-User-ID of the AgencyBuyer that placed this buy; compared against the remitting AgencyController for segregation of duties

  - name: BuyUnit
    parent: null
    common_fields: true
    fields:
      - name: buy_id
        type: string
        source: input
        description: FK -> Buy.id; the buy this unit belongs to
      - name: forecast_id
        type: string
        source: input
        description: FK -> InventoryForecast.id; the avail this unit occupies
      - name: make_good_id
        type: string
        source: system
        description: FK -> MakeGood.id; null for ordered units, set when the unit was created by a make-good acceptance
      - name: daypart
        type: enum
        source: input
        description: daypart of the placed unit; must equal InventoryForecast.daypart
        constraints: one of PRIME, DAYTIME, LATE, DIGITAL_ANY
      - name: program
        type: string
        source: input
        description: program of the placed unit; must equal InventoryForecast.program
        constraints: non-empty, max 120 chars
      - name: platform
        type: enum
        source: input
        description: platform of the placed unit; must equal InventoryForecast.platform
        constraints: one of LINEAR, CTV, DIGITAL, AUDIO
      - name: units
        type: integer
        source: input
        description: number of spots or impressions blocks purchased in this line
        constraints: integer > 0
      - name: unit_rate_cents
        type: integer
        source: input
        description: net media cost per unit, billed to the client through Invoice lines
        constraints: integer > 0
      - name: projected_impressions
        type: integer
        source: input
        description: audience impressions this line is projected to deliver; held against InventoryForecast.available_impressions
        constraints: integer > 0
      - name: actual_impressions
        type: integer
        source: system
        description: impressions reported at airing settlement; 0 until settled
        default: 0
      - name: air_window_start
        type: datetime
        source: input
        description: first instant of the unit's air window (ISO 8601 UTC)
      - name: air_window_end
        type: datetime
        source: input
        description: last instant of the unit's air window (ISO 8601 UTC); must be after air_window_start
      - name: exclusive
        type: boolean
        source: input
        description: when true the line claims the whole air window on an EXCLUSIVE avail
        default: false
      - name: line_net_cents
        type: integer
        source: computed
        description: round_half_up(units * unit_rate_cents)
      - name: line_commission_cents
        type: integer
        source: computed
        description: round_half_up(line_net_cents * Buy.commission_rate), rounded per line before summation
      - name: line_gross_cents
        type: integer
        source: computed
        description: line_net_cents + line_commission_cents
      - name: status
        type: enum
        source: system
        description: unit lifecycle; branches from SCHEDULED into AIRED, PREEMPTED or CANCELLED
        default: SCHEDULED
        constraints: one of SCHEDULED, AIRED, PREEMPTED, CANCELLED, MAKE_GOOD_SCHEDULED, MAKE_GOOD_AIRED

  - name: DeliveryReport
    parent: null
    common_fields: true
    fields:
      - name: buy_id
        type: string
        source: input
        description: FK -> Buy.id; the buy whose delivery is being reported
      - name: measurement_basis
        type: enum
        source: input
        description: measurement currency of this report; drives the cross-platform channel group in reconciliation
        constraints: one of LINEAR_C3, DIGITAL_VAST, CTV_SERVER
      - name: period_start
        type: datetime
        source: input
        description: first instant of the measured period (ISO 8601 UTC)
      - name: period_end
        type: datetime
        source: input
        description: last instant of the measured period (ISO 8601 UTC); must be after period_start and at or before the logical clock
      - name: delivered_impressions
        type: integer
        source: input
        description: gross impressions delivered in the period, all audiences
        constraints: integer >= 0
      - name: delivered_demo_impressions
        type: integer
        source: input
        description: impressions delivered against Campaign.target_demo; must be <= delivered_impressions
        constraints: integer >= 0
      - name: is_post_buy_final
        type: boolean
        source: computed
        description: true when period_end >= Buy.flight_end, which makes acceptance run the post-buy shortfall evaluation
      - name: dispute_reason
        type: string
        source: system
        description: reason recorded when the agency disputes the report; null otherwise
      - name: status
        type: enum
        source: system
        description: report lifecycle
        default: SUBMITTED
        constraints: one of SUBMITTED, ACCEPTED, DISPUTED

  - name: MakeGood
    parent: null
    common_fields: true
    fields:
      - name: buy_id
        type: string
        source: system
        description: FK -> Buy.id; the under-delivered buy this make-good remedies
      - name: offered_forecast_id
        type: string
        source: system
        description: FK -> InventoryForecast.id; avail the seller offers to run the make-good in, null until an offer is made
      - name: shortfall_impressions
        type: integer
        source: system
        description: impressions owed at creation, frozen from Buy.open_shortfall_impressions
      - name: shortfall_value_cents
        type: integer
        source: computed
        description: round_half_up(shortfall_impressions / 1000 * Buy.agreed_cpm_cents)
      - name: offered_impressions
        type: integer
        source: system
        description: impressions in the seller's current offer; 0 until an offer is made
        default: 0
      - name: offered_window_start
        type: datetime
        source: system
        description: first instant of the offered make-good window; null until an offer is made
      - name: offered_window_end
        type: datetime
        source: system
        description: last instant of the offered make-good window; null until an offer is made
      - name: offer_round
        type: integer
        source: system
        description: number of offers made on this make-good; incremented on every seller offer
        default: 0
      - name: rejection_reason
        type: string
        source: system
        description: reason recorded by the agency on the most recent rejection; null otherwise
      - name: waived_credit_cents
        type: integer
        source: system
        description: cash credit granted to the client when the make-good is waived; 0 otherwise
        default: 0
      - name: status
        type: enum
        source: system
        description: cyclic make-good state; OPEN and OFFERED alternate until acceptance or waiver
        default: OPEN
        constraints: one of OPEN, OFFERED, SCHEDULED, WAIVED

  - name: RightsExercise
    parent: null
    common_fields: false
    fields:
      - name: buy_id
        type: string
        source: input
        description: FK -> Buy.id; the buy whose option or cancellation right is exercised
      - name: kind
        type: enum
        source: input
        description: which contractual right is exercised
        constraints: one of OPTION_ROLL, CANCELLATION
      - name: requested_pct
        type: number
        source: input
        description: percent of the buy's guaranteed impressions the exercise applies to
        constraints: number > 0 and <= 100, at most 2 decimals
      - name: applied_ceiling_pct
        type: number
        source: computed
        description: ceiling in force at exercise time - Buy.option_pct_ceiling for OPTION_ROLL, or the clock-tier cancellation ceiling for CANCELLATION
      - name: delta_impressions
        type: integer
        source: computed
        description: signed change applied to Buy.guaranteed_impressions (positive for OPTION_ROLL, negative for CANCELLATION)
      - name: delta_gross_cents
        type: integer
        source: computed
        description: signed change applied to Buy.gross_cost_cents after the cost tier is re-selected
      - name: cancelled_unit_count
        type: integer
        source: computed
        description: number of BuyUnits moved to CANCELLED by this exercise; 0 for OPTION_ROLL
      - name: exercised_at
        type: datetime
        source: system
        description: logical clock instant at which the exercise was recorded
      - name: exercised_by_user_id
        type: string
        source: system
        description: X-User-ID of the AgencyBuyer that exercised the right

  - name: ReconciliationRun
    parent: null
    common_fields: false
    fields:
      - name: campaign_id
        type: string
        source: input
        description: FK -> Campaign.id; campaign whose cross-platform delivery is reconciled
      - name: dedup_method
        type: enum
        source: input
        description: which duplication algorithm to apply
        constraints: one of SEQUENTIAL_DEDUP, AGGREGATE_DEDUP
      - name: aggregate_duplication_pct
        type: number
        source: input
        description: single campaign-level duplication estimate, required for AGGREGATE_DEDUP
        constraints: number >= 0 and <= 100, at most 2 decimals
      - name: linear_ctv_duplication_pct
        type: number
        source: input
        description: pairwise duplication estimate between the LINEAR and CTV groups, used by SEQUENTIAL_DEDUP when both groups are present
        constraints: number >= 0 and <= 100, at most 2 decimals
      - name: ctv_digital_duplication_pct
        type: number
        source: input
        description: pairwise duplication estimate between the CTV and DIGITAL groups, used by SEQUENTIAL_DEDUP when both groups are present
        constraints: number >= 0 and <= 100, at most 2 decimals
      - name: linear_digital_duplication_pct
        type: number
        source: input
        description: pairwise duplication estimate between the LINEAR and DIGITAL groups, used by SEQUENTIAL_DEDUP when they are consecutive present groups
        constraints: number >= 0 and <= 100, at most 2 decimals
      - name: group_reach_pct
        type: object
        source: computed
        description: per-group reach percentages keyed LINEAR, CTV, DIGITAL; groups with no accepted report are omitted
      - name: gross_reach_pct_total
        type: number
        source: computed
        description: sum of the present group reach percentages, 4 decimals
      - name: unduplicated_reach_pct
        type: number
        source: computed
        description: deduplicated reach percentage produced by the selected dedup_method, 4 decimals, capped at 100.0000
      - name: implied_frequency
        type: number
        source: computed
        description: round_half_up(gross_reach_pct_total / unduplicated_reach_pct, 2); 0.00 when unduplicated_reach_pct is 0
      - name: included_report_count
        type: integer
        source: computed
        description: number of DeliveryReports with status ACCEPTED that entered the run
      - name: status
        type: enum
        source: computed
        description: COMPLETED_NO_DATA when included_report_count is 0, else COMPLETED
        constraints: one of COMPLETED, COMPLETED_NO_DATA
      - name: computed_at
        type: datetime
        source: system
        description: logical clock instant at which the run was computed

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: buy_id
        type: string
        source: input
        description: FK -> Buy.id; the buy being billed
      - name: billing_period_start
        type: datetime
        source: input
        description: first instant of the billing period (ISO 8601 UTC)
      - name: billing_period_end
        type: datetime
        source: input
        description: last instant of the billing period (ISO 8601 UTC); must be after billing_period_start
      - name: line_count
        type: integer
        source: computed
        description: number of BuyUnits of the buy with status IN {AIRED, MAKE_GOOD_AIRED} whose air_window_end falls inside [billing_period_start, billing_period_end]
      - name: gross_billable_cents
        type: integer
        source: computed
        description: sum of BuyUnit.line_gross_cents over the invoice lines, each line rounded before summation
      - name: agency_commission_cents
        type: integer
        source: computed
        description: sum of BuyUnit.line_commission_cents over the invoice lines
      - name: seller_payable_cents
        type: integer
        source: computed
        description: sum of BuyUnit.line_net_cents over the invoice lines - the net media owed to the seller
      - name: make_good_credit_cents
        type: integer
        source: computed
        description: sum of MakeGood.waived_credit_cents over MakeGoods of this buy whose status == WAIVED
      - name: net_payable_cents
        type: integer
        source: computed
        description: max(0, gross_billable_cents - make_good_credit_cents) - the amount billed to the client
      - name: max_remittable_cents
        type: integer
        source: computed
        description: sequential-liability release ceiling for the seller (§1.3 sequential_liability_release)
      - name: client_paid_cents
        type: integer
        source: system
        description: cumulative client cash received against this invoice
        default: 0
      - name: seller_remitted_cents
        type: integer
        source: system
        description: cumulative cash remitted to the seller against this invoice
        default: 0
      - name: due_date
        type: datetime
        source: system
        description: issued_at plus Advertiser.payment_terms_days; null until issued
      - name: issued_at
        type: datetime
        source: system
        description: logical clock instant at which the invoice was issued; null while DRAFT
      - name: late_payment_flag
        type: boolean
        source: system
        description: true when any client payment was recorded strictly after due_date
        default: false
      - name: approver_user_id
        type: string
        source: system
        description: X-User-ID of the AgencyController that released the most recent seller remittance
      - name: client_status
        type: enum
        source: system
        description: receivable axis
        default: DRAFT
        constraints: one of DRAFT, ISSUED, PARTIALLY_PAID, PAID
      - name: seller_status
        type: enum
        source: system
        description: payable axis, independent of client_status
        default: UNREMITTED
        constraints: one of UNREMITTED, PARTIALLY_REMITTED, REMITTED

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Campaign
    state_field: plan_status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: PENDING_CLIENT_APPROVAL
        trigger: "POST /upfront/campaigns/{campaignId}/submit-plan"
        actor: AgencyPlanner
        preconditions:
          - "at least one ChannelAllocation exists with campaign_id == this Campaign.id and status IN {DRAFT, LOCKED}"
          - "sum of ChannelAllocation.allocation_pct over those allocations == 100.00 exactly"
          - "Advertiser.credit_status of Campaign.advertiser_id != HOLD"
        side_effects:
          - "Campaign.allocated_budget_cents, unallocated_budget_cents, planned_impressions_total and planned_grp_total recomputed (§1.3 planned_delivery_projection)"
          - "Campaign.version incremented by 1"
      - from: REVISION_REQUIRED
        to: PENDING_CLIENT_APPROVAL
        trigger: "POST /upfront/campaigns/{campaignId}/submit-plan"
        actor: AgencyPlanner
        preconditions:
          - "sum of ChannelAllocation.allocation_pct over allocations with status IN {DRAFT, LOCKED} == 100.00 exactly"
          - "Campaign.plan_posture == WITHIN_PLAN (the overcommitment that forced the revision has been released or re-allocated)"
        side_effects:
          - "planning aggregates recomputed as above"
          - "Campaign.version incremented by 1"
        note: "closes the planning cycle APPROVED -> REVISION_REQUIRED -> PENDING_CLIENT_APPROVAL -> APPROVED"
      - from: PENDING_CLIENT_APPROVAL
        to: APPROVED
        trigger: "POST /upfront/campaigns/{campaignId}/approve-plan"
        actor: AdvertiserClient
        preconditions:
          - "X-User-ID == Campaign.advertiser_id"
          - "Advertiser.credit_status != HOLD"
          - "Advertiser.outstanding_receivable_cents <= Advertiser.credit_limit_cents"
        side_effects:
          - "every ChannelAllocation of this campaign with status DRAFT transitions to LOCKED"
          - "Campaign.version incremented by 1"
      - from: PENDING_CLIENT_APPROVAL
        to: DRAFT
        trigger: "POST /upfront/campaigns/{campaignId}/reject-plan"
        actor: AdvertiserClient
        preconditions:
          - "X-User-ID == Campaign.advertiser_id"
        side_effects:
          - "Campaign.revision cycle re-opened: every ChannelAllocation with status LOCKED returns to DRAFT (conditional cascade - DRAFT allocations are untouched)"
          - "Campaign.version incremented by 1"
      - from: APPROVED
        to: REVISION_REQUIRED
        trigger: "system: Campaign.plan_posture recomputed to REPLAN_REQUIRED (cascade link 4 of POST /upfront/buys/{buyId}/place)"
        actor: system
        preconditions:
          - "Campaign.plan_posture == REPLAN_REQUIRED"
        side_effects:
          - "every ChannelAllocation of this campaign with status LOCKED returns to DRAFT"
          - "further Negotiation acceptances against this campaign are rejected by §1.4 priority 9 until the plan is re-approved"
          - "Campaign.version incremented by 1"

  - entity: Campaign
    state_field: funding_status
    initial_state: UNFUNDED
    terminal_states: [FUNDED]
    transitions:
      - from: UNFUNDED
        to: PARTIALLY_FUNDED
        trigger: "POST /upfront/campaigns/{campaignId}/fund"
        actor: AdvertiserClient
        preconditions:
          - "X-User-ID == Campaign.advertiser_id"
          - "amount_cents > 0"
          - "Campaign.funded_cents + amount_cents < Campaign.total_budget_cents"
        side_effects:
          - "Campaign.funded_cents increased by amount_cents"
          - "Campaign.version incremented by 1"
        note: "the funding axis evolves independently of plan_status; funding an unapproved plan is permitted"
      - from: UNFUNDED
        to: FUNDED
        trigger: "POST /upfront/campaigns/{campaignId}/fund"
        actor: AdvertiserClient
        preconditions:
          - "X-User-ID == Campaign.advertiser_id"
          - "Campaign.funded_cents + amount_cents >= Campaign.total_budget_cents"
        side_effects:
          - "Campaign.funded_cents increased by amount_cents"
          - "Campaign.version incremented by 1"
      - from: PARTIALLY_FUNDED
        to: PARTIALLY_FUNDED
        trigger: "POST /upfront/campaigns/{campaignId}/fund"
        actor: AdvertiserClient
        preconditions:
          - "Campaign.funded_cents + amount_cents < Campaign.total_budget_cents"
        side_effects:
          - "Campaign.funded_cents increased by amount_cents"
          - "Campaign.version incremented by 1"
      - from: PARTIALLY_FUNDED
        to: FUNDED
        trigger: "POST /upfront/campaigns/{campaignId}/fund"
        actor: AdvertiserClient
        preconditions:
          - "Campaign.funded_cents + amount_cents >= Campaign.total_budget_cents"
        side_effects:
          - "Campaign.funded_cents increased by amount_cents"
          - "Campaign.version incremented by 1"

  - entity: ChannelAllocation
    state_field: status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "system: cascade of POST /upfront/campaigns/{campaignId}/approve-plan"
        actor: system
        preconditions:
          - "Campaign.plan_status transitions PENDING_CLIENT_APPROVAL -> APPROVED"
        side_effects:
          - "ChannelAllocation.version incremented by 1"
          - "further POST /upfront/channel-allocations for this campaign are rejected with ERR_ALLOCATION_LOCKED"
      - from: LOCKED
        to: DRAFT
        trigger: "system: cascade of POST /upfront/campaigns/{campaignId}/reject-plan or of the APPROVED -> REVISION_REQUIRED transition"
        actor: system
        preconditions:
          - "Campaign.plan_status leaves APPROVED or PENDING_CLIENT_APPROVAL toward DRAFT / REVISION_REQUIRED"
        side_effects:
          - "ChannelAllocation.version incremented by 1"

  - entity: InventoryForecast
    state_field: status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /upfront/inventory-forecasts/{forecastId}/publish"
        actor: SellerRep
        preconditions:
          - "X-User-ID == InventoryForecast.seller_id"
          - "InventoryForecast.available_impressions > 0"
        side_effects:
          - "the avail becomes eligible for BuyUnit placement and make-good offers"
          - "InventoryForecast.version incremented by 1"
      - from: PUBLISHED
        to: EXHAUSTED
        trigger: "system: InventoryForecast.available_impressions reaches 0 after a BuyUnit hold"
        actor: system
        preconditions:
          - "InventoryForecast.available_impressions == 0"
        side_effects:
          - "further BuyUnit placements against this avail are rejected with ERR_FORECAST_NOT_PUBLISHED"
          - "InventoryForecast.version incremented by 1"
      - from: EXHAUSTED
        to: PUBLISHED
        trigger: "system: InventoryForecast.available_impressions becomes > 0 after a BuyUnit hold is released (preemption or cancellation)"
        actor: system
        preconditions:
          - "InventoryForecast.available_impressions > 0"
        side_effects:
          - "InventoryForecast.version incremented by 1"
        note: "cyclic PUBLISHED <-> EXHAUSTED; the avail is sellable again as soon as inventory returns"

  - entity: Negotiation
    state_field: status
    initial_state: AGENCY_OFFER
    terminal_states: [ACCEPTED, WITHDRAWN]
    transitions:
      - from: AGENCY_OFFER
        to: SELLER_COUNTER
        trigger: "POST /upfront/negotiations/{negotiationId}/counter"
        actor: SellerRep
        preconditions:
          - "X-User-ID == Negotiation.seller_id"
          - "expected_negotiation_version == Negotiation.version"
          - "Negotiation.round_number + 1 <= MAX_NEGOTIATION_ROUNDS (6)"
        side_effects:
          - "Negotiation.current_cpm_cents := counter_cpm_cents, current_impressions := counter_impressions, last_offer_actor := SELLER"
          - "Negotiation.round_number incremented by 1"
          - "Negotiation.version incremented by 1"
      - from: SELLER_COUNTER
        to: AGENCY_OFFER
        trigger: "POST /upfront/negotiations/{negotiationId}/revise"
        actor: AgencyBuyer
        preconditions:
          - "Negotiation.round_number + 1 <= MAX_NEGOTIATION_ROUNDS (6)"
        side_effects:
          - "Negotiation.current_cpm_cents := offer_cpm_cents, current_impressions := offer_impressions, last_offer_actor := AGENCY"
          - "Negotiation.round_number incremented by 1"
          - "Negotiation.version incremented by 1"
        note: "cyclic AGENCY_OFFER <-> SELLER_COUNTER; rounds accumulate until acceptance, withdrawal or the round cap"
      - from: SELLER_COUNTER
        to: ACCEPTED
        trigger: "POST /upfront/negotiations/{negotiationId}/accept"
        actor: AgencyBuyer
        preconditions:
          - "Campaign.plan_status == APPROVED"
          - "Advertiser.credit_status of the campaign's advertiser != HOLD"
          - "ChannelAllocation.status == LOCKED for Negotiation.channel_allocation_id (an invariant implied by plan_status == APPROVED, not a separately reportable failure - see §1.4 priority 18)"
        side_effects:
          - "Negotiation.accepted_cpm_cents := current_cpm_cents, accepted_impressions := current_impressions"
          - "a Buy row is created with buy_status PENDING_PLACEMENT, stewardship_status NOT_STARTED, settlement_status UNBILLED, guaranteed_impressions := accepted_impressions, agreed_cpm_cents := accepted_cpm_cents, flight window and rights windows derived per §1.1"
          - "Buy cost fields computed per §1.3 negotiated_buy_cost"
          - "Negotiation.version incremented by 1"
        note: "no Campaign field changes here - budget is only committed at placement"
      - from: AGENCY_OFFER
        to: WITHDRAWN
        trigger: "POST /upfront/negotiations/{negotiationId}/withdraw"
        actor: AgencyBuyer
        preconditions: []
        side_effects:
          - "Negotiation.version incremented by 1"
      - from: SELLER_COUNTER
        to: WITHDRAWN
        trigger: "POST /upfront/negotiations/{negotiationId}/withdraw"
        actor: AgencyBuyer
        preconditions: []
        side_effects:
          - "Negotiation.version incremented by 1"

  - entity: Buy
    state_field: buy_status
    initial_state: PENDING_PLACEMENT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PENDING_PLACEMENT
        to: PLACED
        trigger: "POST /upfront/buys/{buyId}/place"
        actor: AgencyBuyer
        preconditions:
          - "expected_campaign_version == Campaign.version"
          - "Campaign.plan_status == APPROVED"
          - "sum of BuyUnit.projected_impressions over units of this buy with status == SCHEDULED >= Buy.guaranteed_impressions"
          - "Campaign.committed_gross_cents + Buy.gross_cost_cents <= Campaign.total_budget_cents"
          - "no other Buy on the same Seller for a DIFFERENT Advertiser of the same category_code sits inside the competitive-separation buffer (§1.4 priority 37); two buys of the same Advertiser never conflict with each other"
        side_effects:
          - "Buy.buy_status := PLACED and Buy.placed_by_user_id := X-User-ID"
          - "Campaign.version incremented by 1"
          - "cascade link 1 - because the buy now counts as committed, ChannelAllocation.committed_cents for Buy.channel_allocation_id is recomputed as the sum of Buy.gross_cost_cents over buys with buy_status IN {PLACED, IN_FLIGHT, COMPLETED, CLOSED}"
          - "cascade link 2 - because that recomputed committed_cents now exceeds ChannelAllocation.allocated_cents, ChannelAllocation.posture flips WITHIN_PLAN -> OVERCOMMITTED (no flip while committed_cents <= allocated_cents)"
          - "cascade link 3 - because that allocation is now OVERCOMMITTED, Campaign.plan_posture is recomputed to REPLAN_REQUIRED"
          - "cascade link 4 - because Campaign.plan_posture is now REPLAN_REQUIRED while plan_status was APPROVED, Campaign.plan_status transitions APPROVED -> REVISION_REQUIRED and every LOCKED ChannelAllocation of the campaign returns to DRAFT"
          - "Campaign.committed_gross_cents and uncommitted_budget_cents recomputed"
      - from: PLACED
        to: IN_FLIGHT
        trigger: "system: first DeliveryReport of this buy reaches ACCEPTED"
        actor: system
        preconditions:
          - "Buy.buy_status == PLACED"
        side_effects:
          - "Buy.version incremented by 1"
      - from: IN_FLIGHT
        to: COMPLETED
        trigger: "POST /upfront/buys/{buyId}/close"
        actor: AgencyController
        preconditions:
          - "Buy.stewardship_status IN {WITHIN_TOLERANCE, MADE_GOOD}"
          - "no DeliveryReport of this buy has status SUBMITTED"
        side_effects:
          - "Buy.version incremented by 1"
      - from: COMPLETED
        to: CLOSED
        trigger: "system: Buy.settlement_status reaches REMITTED"
        actor: system
        preconditions:
          - "Buy.buy_status == COMPLETED"
          - "Buy.settlement_status == REMITTED"
        side_effects:
          - "Buy.version incremented by 1"
        note: "the placement axis only couples to the billing axis at this final hop"
      - from: PLACED
        to: CANCELLED
        trigger: "system: a CANCELLATION RightsExercise brings Buy.cancelled_pct_cumulative to 100.00"
        actor: system
        preconditions:
          - "Buy.cancelled_pct_cumulative == 100.00"
        side_effects:
          - "Buy.guaranteed_impressions := 0 and all cost fields recomputed to 0"
          - "the buy leaves ChannelAllocation.committed_cents and Campaign.committed_gross_cents"
          - "Buy.version incremented by 1"

  - entity: Buy
    state_field: stewardship_status
    initial_state: NOT_STARTED
    terminal_states: []
    transitions:
      - from: NOT_STARTED
        to: ON_TRACK
        trigger: "system: acceptance of a DeliveryReport whose is_post_buy_final == false"
        actor: system
        preconditions:
          - "DeliveryReport.status transitions SUBMITTED -> ACCEPTED"
          - "DeliveryReport.is_post_buy_final == false"
        side_effects:
          - "Buy.credited_impressions_final and final_delivery_index recomputed"
      - from: ON_TRACK
        to: AT_RISK
        trigger: "system: a SCHEDULED BuyUnit of this buy is PREEMPTED"
        actor: system
        preconditions:
          - "Buy.placed_impressions < Buy.guaranteed_impressions after the preemption"
        side_effects:
          - "Buy.version incremented by 1"
      - from: NOT_STARTED
        to: AT_RISK
        trigger: "system: a SCHEDULED BuyUnit of this buy is PREEMPTED"
        actor: system
        preconditions:
          - "Buy.placed_impressions < Buy.guaranteed_impressions after the preemption"
        side_effects:
          - "Buy.version incremented by 1"
      - from: ON_TRACK
        to: UNDER_DELIVERED
        trigger: "system: acceptance of a DeliveryReport whose is_post_buy_final == true"
        actor: system
        preconditions:
          - "shortfall_pct computed by §1.3 post_buy_shortfall >= MAKE_GOOD_TOLERANCE_PCT"
        side_effects:
          - "a MakeGood row is created with status OPEN (see the POST /upfront/delivery-reports/{deliveryReportId}/accept cascade)"
      - from: NOT_STARTED
        to: UNDER_DELIVERED
        trigger: "system: acceptance of a DeliveryReport whose is_post_buy_final == true"
        actor: system
        preconditions:
          - "shortfall_pct >= MAKE_GOOD_TOLERANCE_PCT"
        side_effects:
          - "a MakeGood row is created with status OPEN"
      - from: AT_RISK
        to: UNDER_DELIVERED
        trigger: "system: acceptance of a DeliveryReport whose is_post_buy_final == true"
        actor: system
        preconditions:
          - "shortfall_pct >= MAKE_GOOD_TOLERANCE_PCT"
        side_effects:
          - "a MakeGood row is created with status OPEN"
      - from: NOT_STARTED
        to: WITHIN_TOLERANCE
        trigger: "system: acceptance of a DeliveryReport whose is_post_buy_final == true"
        actor: system
        preconditions:
          - "shortfall_pct < MAKE_GOOD_TOLERANCE_PCT"
        side_effects:
          - "no MakeGood is created"
      - from: ON_TRACK
        to: WITHIN_TOLERANCE
        trigger: "system: acceptance of a DeliveryReport whose is_post_buy_final == true"
        actor: system
        preconditions:
          - "shortfall_pct < MAKE_GOOD_TOLERANCE_PCT"
        side_effects:
          - "no MakeGood is created"
      - from: AT_RISK
        to: WITHIN_TOLERANCE
        trigger: "system: acceptance of a DeliveryReport whose is_post_buy_final == true"
        actor: system
        preconditions:
          - "shortfall_pct < MAKE_GOOD_TOLERANCE_PCT"
        side_effects:
          - "no MakeGood is created"
      - from: UNDER_DELIVERED
        to: MADE_GOOD
        trigger: "system: Buy.open_shortfall_impressions reaches 0 through a MakeGood reaching SCHEDULED or WAIVED"
        actor: system
        preconditions:
          - "Buy.open_shortfall_impressions == 0"
        side_effects:
          - "Buy.version incremented by 1"

  - entity: Buy
    state_field: settlement_status
    initial_state: UNBILLED
    terminal_states: [REMITTED]
    transitions:
      - from: UNBILLED
        to: INVOICED
        trigger: "system: cascade of POST /upfront/invoices/{invoiceId}/issue"
        actor: system
        preconditions:
          - "Invoice.client_status transitions DRAFT -> ISSUED"
        side_effects:
          - "Buy.version incremented by 1"
      - from: INVOICED
        to: CLIENT_PAID
        trigger: "system: Invoice.client_status reaches PAID"
        actor: system
        preconditions:
          - "Invoice.client_paid_cents >= Invoice.net_payable_cents"
        side_effects:
          - "Buy.version incremented by 1"
      - from: CLIENT_PAID
        to: REMITTED
        trigger: "system: Invoice.seller_status reaches REMITTED"
        actor: system
        preconditions:
          - "Invoice.seller_remitted_cents >= Invoice.seller_payable_cents"
        side_effects:
          - "cascade - because settlement reached REMITTED, a Buy whose buy_status is COMPLETED transitions to CLOSED"
          - "Buy.version incremented by 1"

  - entity: BuyUnit
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [AIRED, PREEMPTED, CANCELLED, MAKE_GOOD_AIRED]
    transitions:
      - from: SCHEDULED
        to: AIRED
        trigger: "POST /upfront/buy-units/{buyUnitId}/settle-airing with outcome AIRED"
        actor: SellerRep
        preconditions:
          - "X-User-ID == the Seller.id of the unit's InventoryForecast"
          - "logical clock >= BuyUnit.air_window_end"
        side_effects:
          - "BuyUnit.actual_impressions := actual_impressions from the request"
          - "the unit becomes an Invoice line candidate for billing periods containing air_window_end"
          - "BuyUnit.version incremented by 1"
      - from: SCHEDULED
        to: PREEMPTED
        trigger: "POST /upfront/buy-units/{buyUnitId}/settle-airing with outcome PREEMPTED"
        actor: SellerRep
        preconditions:
          - "logical clock >= BuyUnit.air_window_end"
        side_effects:
          - "cascade link 1 - because the unit no longer holds inventory, InventoryForecast.available_impressions increases by BuyUnit.projected_impressions"
          - "cascade link 2 - because availability returned, a forecast in EXHAUSTED transitions back to PUBLISHED"
          - "cascade link 3 - because Buy.placed_impressions dropped below Buy.guaranteed_impressions, Buy.stewardship_status moves to AT_RISK"
          - "BuyUnit.version incremented by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: cascade of a CANCELLATION RightsExercise"
        actor: system
        preconditions:
          - "the unit is selected by the cancellation sweep order (air_window_start ASC, created_at ASC)"
        side_effects:
          - "InventoryForecast.available_impressions increases by BuyUnit.projected_impressions"
          - "BuyUnit.version incremented by 1"
      - from: MAKE_GOOD_SCHEDULED
        to: MAKE_GOOD_AIRED
        trigger: "POST /upfront/buy-units/{buyUnitId}/settle-airing with outcome AIRED"
        actor: SellerRep
        preconditions:
          - "logical clock >= BuyUnit.air_window_end"
        side_effects:
          - "BuyUnit.actual_impressions := actual_impressions from the request"
          - "BuyUnit.version incremented by 1"
        note: "make-good units enter the machine at MAKE_GOOD_SCHEDULED rather than SCHEDULED"

  - entity: DeliveryReport
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, DISPUTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /upfront/delivery-reports/{deliveryReportId}/accept"
        actor: AgencyBuyer
        preconditions:
          - "Buy.buy_status IN {PLACED, IN_FLIGHT}"
        side_effects:
          - "DeliveryReport.status := ACCEPTED"
          - "cascade link 1 - because an ACCEPTED report entered the FINAL input set, Buy.credited_impressions_final and Buy.final_delivery_index are recomputed (§1.3 post_buy_delivery_index FINAL variant); the PROVISIONAL fields are refreshed from the same pass"
          - "a Buy with buy_status PLACED transitions to IN_FLIGHT"
          - "cascade link 2 - because the recomputed FINAL figures belong to a post-buy-final report (is_post_buy_final == true) whose shortfall_pct >= MAKE_GOOD_TOLERANCE_PCT, Buy.stewardship_status transitions to UNDER_DELIVERED; when shortfall_pct < the tolerance it transitions to WITHIN_TOLERANCE instead and the chain stops here"
          - "cascade link 3 - because Buy.stewardship_status is now UNDER_DELIVERED, a MakeGood row is created with status OPEN, shortfall_impressions frozen from Buy.open_shortfall_impressions and shortfall_value_cents computed"
          - "cascade link 4 - because that MakeGood is now OPEN, Seller.open_make_good_impressions is recomputed and grows by the frozen shortfall"
          - "Buy.version incremented by 1"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /upfront/delivery-reports/{deliveryReportId}/dispute"
        actor: AgencyBuyer
        preconditions:
          - "DeliveryReport.status == SUBMITTED"
        side_effects:
          - "DeliveryReport.dispute_reason := reason from the request"
          - "the report leaves the PROVISIONAL input set, so Buy.credited_impressions_provisional and provisional_delivery_index are recomputed downward"
          - "DeliveryReport.version incremented by 1"

  - entity: MakeGood
    state_field: status
    initial_state: OPEN
    terminal_states: [SCHEDULED, WAIVED]
    transitions:
      - from: OPEN
        to: OFFERED
        trigger: "POST /upfront/make-goods/{makeGoodId}/offer"
        actor: SellerRep
        preconditions:
          - "X-User-ID == Buy.seller_id of the make-good's buy"
          - "InventoryForecast.status == PUBLISHED for offered_forecast_id"
          - "InventoryForecast.seller_id == Buy.seller_id"
          - "MakeGood.offer_round + 1 <= MAX_MAKE_GOOD_OFFERS (3)"
          - "offered_impressions >= MakeGood.shortfall_impressions"
          - "offered window inside [InventoryForecast.window_start, InventoryForecast.window_end] and offered_window_start >= logical clock"
          - "offered_impressions <= Seller.make_good_capacity_impressions - Seller.scheduled_make_good_impressions"
        side_effects:
          - "MakeGood.offered_forecast_id, offered_impressions, offered_window_start, offered_window_end recorded"
          - "MakeGood.offer_round incremented by 1"
          - "MakeGood.version incremented by 1"
      - from: OFFERED
        to: OPEN
        trigger: "POST /upfront/make-goods/{makeGoodId}/reject"
        actor: AgencyBuyer
        preconditions: []
        side_effects:
          - "MakeGood.rejection_reason := reason from the request; offered_* fields retained for audit"
          - "MakeGood.version incremented by 1"
        note: "cyclic OPEN <-> OFFERED, bounded by MAX_MAKE_GOOD_OFFERS"
      - from: OFFERED
        to: SCHEDULED
        trigger: "POST /upfront/make-goods/{makeGoodId}/accept"
        actor: AgencyBuyer
        preconditions:
          - "InventoryForecast.status == PUBLISHED for MakeGood.offered_forecast_id"
          - "InventoryForecast.available_impressions >= MakeGood.offered_impressions"
        side_effects:
          - "a BuyUnit is created with status MAKE_GOOD_SCHEDULED, make_good_id := this MakeGood.id, forecast_id := offered_forecast_id, projected_impressions := offered_impressions, units := 1, unit_rate_cents := 0, air window := offered window, daypart/program/platform copied from the forecast"
          - "InventoryForecast.available_impressions decreases by offered_impressions and the forecast transitions to EXHAUSTED when it reaches 0"
          - "Buy.made_good_impressions increased by offered_impressions, so Buy.open_shortfall_impressions is recomputed"
          - "cascade - because open_shortfall_impressions reached 0, Buy.stewardship_status transitions UNDER_DELIVERED -> MADE_GOOD"
          - "MakeGood.version incremented by 1"
      - from: OPEN
        to: WAIVED
        trigger: "POST /upfront/make-goods/{makeGoodId}/waive"
        actor: AgencyController
        preconditions:
          - "Buy.make_good_provision IN {CASH_CREDIT, MAKE_GOOD_UNITS}"
        side_effects:
          - "MakeGood.waived_credit_cents := credit_cents from the request, defaulting to MakeGood.shortfall_value_cents when omitted"
          - "Buy.waived_impressions increased by MakeGood.shortfall_impressions, so Buy.open_shortfall_impressions is recomputed"
          - "cascade - because open_shortfall_impressions reached 0, Buy.stewardship_status transitions UNDER_DELIVERED -> MADE_GOOD"
          - "every DRAFT Invoice of the buy recomputes make_good_credit_cents and net_payable_cents"
          - "MakeGood.version incremented by 1"
      - from: OFFERED
        to: WAIVED
        trigger: "POST /upfront/make-goods/{makeGoodId}/waive"
        actor: AgencyController
        preconditions:
          - "Buy.make_good_provision IN {CASH_CREDIT, MAKE_GOOD_UNITS}"
        side_effects:
          - "same side effects as the OPEN -> WAIVED hop; the outstanding offer is abandoned"
          - "MakeGood.version incremented by 1"

  - entity: Invoice
    state_field: client_status
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /upfront/invoices/{invoiceId}/issue"
        actor: AgencyController
        preconditions:
          - "Invoice.line_count >= 1"
          - "Campaign.funded_cents >= Invoice.net_payable_cents + sum of net_payable_cents over other Invoices of the same campaign whose client_status IN {ISSUED, PARTIALLY_PAID, PAID}"
        side_effects:
          - "Invoice.issued_at := logical clock, due_date := issued_at + Advertiser.payment_terms_days days"
          - "cascade - Buy.settlement_status transitions UNBILLED -> INVOICED"
          - "Invoice.version incremented by 1"
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /upfront/invoices/{invoiceId}/record-client-payment"
        actor: AdvertiserClient
        preconditions:
          - "X-User-ID == Campaign.advertiser_id of the invoice's buy"
          - "Invoice.client_paid_cents + amount_cents < Invoice.net_payable_cents"
        side_effects:
          - "Invoice.client_paid_cents increased by amount_cents; max_remittable_cents recomputed (§1.3 sequential_liability_release)"
          - "when the logical clock > Invoice.due_date: late_payment_flag := true, Advertiser.late_payment_count incremented by 1, and Advertiser.credit_status moves ACTIVE -> WATCH or WATCH -> HOLD"
          - "Invoice.version incremented by 1"
      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /upfront/invoices/{invoiceId}/record-client-payment"
        actor: AdvertiserClient
        preconditions:
          - "Invoice.client_paid_cents + amount_cents < Invoice.net_payable_cents"
        side_effects:
          - "Invoice.client_paid_cents increased by amount_cents; max_remittable_cents recomputed"
          - "Invoice.version incremented by 1"
      - from: ISSUED
        to: PAID
        trigger: "POST /upfront/invoices/{invoiceId}/record-client-payment"
        actor: AdvertiserClient
        preconditions:
          - "Invoice.client_paid_cents + amount_cents >= Invoice.net_payable_cents"
        side_effects:
          - "Invoice.client_paid_cents increased by amount_cents; max_remittable_cents recomputed to Invoice.seller_payable_cents"
          - "cascade - Buy.settlement_status transitions INVOICED -> CLIENT_PAID"
          - "Invoice.version incremented by 1"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /upfront/invoices/{invoiceId}/record-client-payment"
        actor: AdvertiserClient
        preconditions:
          - "Invoice.client_paid_cents + amount_cents >= Invoice.net_payable_cents"
        side_effects:
          - "Invoice.client_paid_cents increased by amount_cents; max_remittable_cents recomputed to Invoice.seller_payable_cents"
          - "cascade - Buy.settlement_status transitions INVOICED -> CLIENT_PAID"
          - "Invoice.version incremented by 1"

  - entity: Invoice
    state_field: seller_status
    initial_state: UNREMITTED
    terminal_states: [REMITTED]
    transitions:
      - from: UNREMITTED
        to: PARTIALLY_REMITTED
        trigger: "POST /upfront/invoices/{invoiceId}/remit-seller"
        actor: AgencyController
        preconditions:
          - "X-User-ID != Buy.placed_by_user_id (segregation of duties, §1.4 priority 36)"
          - "Invoice.client_status IN {ISSUED, PARTIALLY_PAID, PAID}"
          - "Invoice.seller_remitted_cents + amount_cents <= Invoice.max_remittable_cents"
          - "Invoice.seller_remitted_cents + amount_cents < Invoice.seller_payable_cents"
        side_effects:
          - "Invoice.seller_remitted_cents increased by amount_cents; approver_user_id := X-User-ID"
          - "Invoice.version incremented by 1"
      - from: PARTIALLY_REMITTED
        to: PARTIALLY_REMITTED
        trigger: "POST /upfront/invoices/{invoiceId}/remit-seller"
        actor: AgencyController
        preconditions:
          - "Invoice.seller_remitted_cents + amount_cents <= Invoice.max_remittable_cents"
          - "Invoice.seller_remitted_cents + amount_cents < Invoice.seller_payable_cents"
        side_effects:
          - "Invoice.seller_remitted_cents increased by amount_cents"
          - "Invoice.version incremented by 1"
      - from: UNREMITTED
        to: REMITTED
        trigger: "POST /upfront/invoices/{invoiceId}/remit-seller"
        actor: AgencyController
        preconditions:
          - "Invoice.seller_remitted_cents + amount_cents >= Invoice.seller_payable_cents"
          - "Invoice.seller_remitted_cents + amount_cents <= Invoice.max_remittable_cents"
        side_effects:
          - "cascade - Buy.settlement_status transitions CLIENT_PAID -> REMITTED, which in turn moves a COMPLETED buy to CLOSED"
          - "Invoice.version incremented by 1"
      - from: PARTIALLY_REMITTED
        to: REMITTED
        trigger: "POST /upfront/invoices/{invoiceId}/remit-seller"
        actor: AgencyController
        preconditions:
          - "Invoice.seller_remitted_cents + amount_cents >= Invoice.seller_payable_cents"
          - "Invoice.seller_remitted_cents + amount_cents <= Invoice.max_remittable_cents"
        side_effects:
          - "cascade - Buy.settlement_status transitions CLIENT_PAID -> REMITTED, which in turn moves a COMPLETED buy to CLOSED"
          - "Invoice.version incremented by 1"

  - entity: Advertiser
    state_field: credit_status
    initial_state: ACTIVE
    terminal_states: [HOLD]
    transitions:
      - from: ACTIVE
        to: WATCH
        trigger: "system: a client payment is recorded after Invoice.due_date"
        actor: system
        preconditions:
          - "Advertiser.late_payment_count == 1 after the increment"
        side_effects:
          - "Advertiser.version incremented by 1"
      - from: WATCH
        to: HOLD
        trigger: "system: a further client payment is recorded after Invoice.due_date"
        actor: system
        preconditions:
          - "Advertiser.late_payment_count >= 2 after the increment"
        side_effects:
          - "plan submission, plan approval and negotiation acceptance for this advertiser are rejected with ERR_ADVERTISER_CREDIT_HOLD"
          - "Advertiser.version incremented by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on a parent entity's version - the only
# sanctioned write-write conflict mechanism). Every other contention in this
# domain reduces to a state precondition and lives in §1.2 / §1.4.
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: negotiation-counter-stale
    parent_entity: Negotiation
    write_endpoint: "POST /upfront/negotiations/{negotiationId}/counter"
    occ_field: "expected_negotiation_version"
    description: |
      A seller counter carrying an expected_negotiation_version that no longer
      equals Negotiation.version is rejected. A counter legitimately supersedes
      whatever offer was on the table, so a second sequential counter would
      otherwise succeed against a negotiation whose terms have already moved
      (the agency revised, or the seller's own earlier counter landed); the
      stale version is the only signal that the seller priced against terms
      that are no longer current.
    error_id: ERR_STALE_NEGOTIATION_VERSION
    http_status: 412
  - rule_id: buy-place-stale-campaign
    parent_entity: Campaign
    write_endpoint: "POST /upfront/buys/{buyId}/place"
    occ_field: "expected_campaign_version"
    description: |
      Placing a buy against a Campaign whose version has advanced since the
      buyer last read it is rejected. Placement legitimately supersedes the
      buyer's picture of remaining budget, so the request would otherwise
      succeed while consuming budget the buyer never saw committed - another
      placement, a funding event, or a plan re-approval has already moved
      Campaign.committed_gross_cents.
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules
# ---------------------------------------------------------------------------
calculations:
  - name: allocation_budget_split
    trigger: "on POST /upfront/channel-allocations and on every recomputation of Campaign planning aggregates (submit-plan, allocation create)"
    algorithm: aggregation
    formula: |
      allocated_cents = floor(Campaign.total_budget_cents * allocation_pct / 100)
      Campaign.allocated_budget_cents   = sum(allocated_cents of allocations with status IN {DRAFT, LOCKED})
      Campaign.unallocated_budget_cents = Campaign.total_budget_cents - Campaign.allocated_budget_cents
      Campaign.committed_gross_cents    = sum(Buy.gross_cost_cents of buys with buy_status IN {PLACED, IN_FLIGHT, COMPLETED, CLOSED})
      Campaign.uncommitted_budget_cents = Campaign.total_budget_cents - Campaign.committed_gross_cents
    input_set: "ChannelAllocations of the campaign with status IN {DRAFT, LOCKED}; Buys with buy_status IN {PLACED, IN_FLIGHT, COMPLETED, CLOSED} (PENDING_PLACEMENT and CANCELLED buys are excluded)"
    constants:
      ALLOCATION_PCT_TOTAL: 100.00
    precision: "allocated_cents floor to whole cents; allocation_pct carries 2 decimal places"

  - name: planned_delivery_projection
    trigger: "on POST /upfront/channel-allocations and on every Campaign planning recomputation"
    algorithm: forward_looking
    formula: |
      # composed multipliers, then a clamp band derived from the same input
      raw_cpm    = planned_cpm_cents * MARKET_MULTIPLIER[planned_market] * DAYPART_INDEX[primary_daypart]
      band_floor = max(CPM_ABS_FLOOR_CENTS, round_half_up(planned_cpm_cents * CPM_BAND_LOW))
      band_ceil  = min(CPM_ABS_CEIL_CENTS,  round_half_up(planned_cpm_cents * CPM_BAND_HIGH))
      effective_planned_cpm_cents = min(band_ceil, max(band_floor, round_half_up(raw_cpm)))
      planned_impressions = floor(allocated_cents / effective_planned_cpm_cents * 1000)
      planned_grp         = round_half_up(planned_impressions / (Campaign.universe_thousands * 1000) * 100, 2)
      planned_frequency   = round_half_up(planned_grp / Campaign.reach_goal_pct, 2)
      Campaign.planned_impressions_total = sum(planned_impressions of allocations with status IN {DRAFT, LOCKED})
      Campaign.planned_grp_total         = round_half_up(sum(planned_grp of those allocations), 2)
    input_set: "the allocation being written plus, for the campaign rollups, all allocations with status IN {DRAFT, LOCKED}"
    constants:
      MARKET_MULTIPLIER: { UPFRONT: 1.00, SCATTER: 1.35 }
      DAYPART_INDEX: { PRIME: 1.20, DAYTIME: 0.85, LATE: 0.70, DIGITAL_ANY: 1.00 }
      CPM_BAND_LOW: 0.60
      CPM_BAND_HIGH: 2.50
      CPM_ABS_FLOOR_CENTS: 200
      CPM_ABS_CEIL_CENTS: 12000
    precision: "CPM cents rounded half-up to whole cents; impressions floored to whole impressions; GRP and frequency 2 decimal places round_half_up"

  - name: negotiated_buy_cost
    trigger: "on POST /upfront/negotiations/{negotiationId}/accept (Buy creation) and on every recomputation of Buy.guaranteed_impressions caused by a RightsExercise"
    algorithm: tiered_pricing
    formula: |
      net_media_cost_cents = round_half_up(guaranteed_impressions * agreed_cpm_cents / 1000)
      # the tier is selected on the PRE-commission net, and the commission it
      # selects is what turns net into gross - the gross figure must never be
      # fed back into tier selection
      commission_rate = COMMISSION_TIER_SMALL_RATE  if net_media_cost_cents <  COMMISSION_TIER_MID_FLOOR_CENTS
                        COMMISSION_TIER_MID_RATE    if COMMISSION_TIER_MID_FLOOR_CENTS <= net_media_cost_cents < COMMISSION_TIER_LARGE_FLOOR_CENTS
                        COMMISSION_TIER_LARGE_RATE  if net_media_cost_cents >= COMMISSION_TIER_LARGE_FLOOR_CENTS
      agency_commission_cents = round_half_up(net_media_cost_cents * commission_rate)
      gross_cost_cents        = net_media_cost_cents + agency_commission_cents
    input_set: "the single Buy being priced; guaranteed_impressions and agreed_cpm_cents only"
    constants:
      COMMISSION_TIER_SMALL_RATE: 0.0700
      COMMISSION_TIER_MID_RATE: 0.0550
      COMMISSION_TIER_LARGE_RATE: 0.0400
      COMMISSION_TIER_MID_FLOOR_CENTS: 5000000
      COMMISSION_TIER_LARGE_FLOOR_CENTS: 25000000
    precision: "whole cents, round_half_up; tier floors are inclusive (>=)"

  - name: post_buy_delivery_index
    trigger: "on POST /upfront/delivery-reports/{deliveryReportId}/accept and on POST /upfront/delivery-reports/{deliveryReportId}/dispute"
    algorithm: aggregation
    formula: |
      credited = sum(<credited_field> over the variant's input set)
      index    = round_half_up(credited / Buy.guaranteed_impressions, 4)   # 0.0000 when guaranteed_impressions == 0
    input_set: "DeliveryReports of the buy; which statuses and which impression field are counted depends on the variant"
    constants:
      DELIVERY_INDEX_PRECISION: 4
    precision: "index 4 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "stewardship-in-flight view; written to Buy.credited_impressions_provisional and Buy.provisional_delivery_index on every report write"
        difference: "input set is DeliveryReports with status IN {SUBMITTED, ACCEPTED} and the credited field is delivered_impressions (gross, all-audience) - unvetted seller claims count"
      - name: FINAL
        when: "post-buy settlement view; written to Buy.credited_impressions_final and Buy.final_delivery_index, and the only variant that drives stewardship_status and make-good creation"
        difference: "input set is DeliveryReports with status == ACCEPTED only and the credited field is delivered_demo_impressions (target-demo only) - the same reports therefore yield a strictly lower index"

  - name: post_buy_shortfall
    trigger: "immediately after post_buy_delivery_index recomputes the FINAL variant during POST /upfront/delivery-reports/{deliveryReportId}/accept"
    algorithm: threshold
    formula: |
      shortfall_impressions = max(0, Buy.guaranteed_impressions - Buy.credited_impressions_final)
      shortfall_pct         = round_half_up(shortfall_impressions / Buy.guaranteed_impressions * 100, 4)
      shortfall_value_cents = round_half_up(shortfall_impressions * Buy.agreed_cpm_cents / 1000)
      make_good_required    = (accepted report has is_post_buy_final == true) AND (shortfall_pct >= MAKE_GOOD_TOLERANCE_PCT)
      Buy.open_shortfall_impressions = max(0, shortfall_impressions - Buy.made_good_impressions - Buy.waived_impressions)
    input_set: "the single Buy plus its ACCEPTED DeliveryReports (via credited_impressions_final)"
    constants:
      MAKE_GOOD_TOLERANCE_PCT: 2.0000
    precision: "shortfall_pct 4 decimal places round_half_up; the tolerance comparison is >= so a shortfall of exactly 2.0000 percent requires a make-good"

  - name: campaign_unduplicated_reach
    trigger: "on POST /upfront/reconciliation-runs"
    algorithm: constraint_propagation
    formula: |
      # platform grouping of the campaign's buys
      group_of(channel) = LINEAR for LINEAR_TV; CTV for CTV; DIGITAL for DIGITAL_VIDEO and AUDIO
      for each group g in GROUP_ORDER:
        imp_g   = sum(Buy.credited_impressions_final over buys of the campaign with group_of(Buy.channel) == g
                      and buy_status IN {PLACED, IN_FLIGHT, COMPLETED, CLOSED})
        grp_g   = imp_g / (Campaign.universe_thousands * 1000) * 100
        reach_g = round_half_up(grp_g / Campaign.frequency_goal, 4)      # group_reach_pct[g]
      gross_reach_pct_total = round_half_up(sum(reach_g), 4)
      present = [g in GROUP_ORDER where reach_g > 0]
      included_report_count = count(DeliveryReports with status == ACCEPTED belonging to those buys)
      if included_report_count == 0:
        status = COMPLETED_NO_DATA; every reach output = 0.0000; implied_frequency = 0.00
      else:
        status = COMPLETED
        unduplicated_reach_pct = <per variant>
        implied_frequency      = round_half_up(gross_reach_pct_total / unduplicated_reach_pct, 2)   # 0.00 when unduplicated is 0
    input_set: "Buys of the campaign with buy_status IN {PLACED, IN_FLIGHT, COMPLETED, CLOSED} and their DeliveryReports with status == ACCEPTED; PENDING_PLACEMENT and CANCELLED buys and SUBMITTED / DISPUTED reports are excluded"
    constants:
      GROUP_ORDER: [LINEAR, CTV, DIGITAL]
      REACH_PRECISION: 4
    precision: "reach percentages 4 decimal places round_half_up; implied_frequency 2 decimal places round_half_up"
    variants:
      - name: SEQUENTIAL_DEDUP
        when: "dedup_method == SEQUENTIAL_DEDUP - the pairwise ladder walked in GROUP_ORDER"
        difference: |
          unduplicated starts at the first present group's reach; each later present group g contributes
          reach_g * (1 - pair_duplication(prev_present_group, g) / 100), where pair_duplication reads
          linear_ctv_duplication_pct, ctv_digital_duplication_pct or linear_digital_duplication_pct
          according to the ordered pair; aggregate_duplication_pct is ignored entirely
      - name: AGGREGATE_DEDUP
        when: "dedup_method == AGGREGATE_DEDUP - one blanket overlap factor across all platforms"
        difference: |
          unduplicated_reach_pct = round_half_up(gross_reach_pct_total * (1 - aggregate_duplication_pct / 100), 4);
          the three pairwise duplication inputs are ignored entirely, so identical delivery data yields a
          different unduplicated reach and a different implied_frequency from SEQUENTIAL_DEDUP

  - name: invoice_net_payable
    trigger: "on POST /upfront/invoices and on any MakeGood reaching WAIVED while the invoice is still DRAFT"
    algorithm: aggregation
    formula: |
      # per-line rounding: the commission is rounded on EVERY line and the
      # rounded line figures are summed. Summing the raw line nets first and
      # rounding the commission once at the end is a DIFFERENT number.
      lines = BuyUnits of the buy with status IN {AIRED, MAKE_GOOD_AIRED}
              and billing_period_start <= air_window_end <= billing_period_end,
              ordered by air_window_start ASC, created_at ASC
      for each line:
        line_net_cents        = units * unit_rate_cents
        line_commission_cents = round_half_up(line_net_cents * Buy.commission_rate)
        line_gross_cents      = line_net_cents + line_commission_cents
      line_count              = count(lines)
      seller_payable_cents    = sum(line_net_cents)
      agency_commission_cents = sum(line_commission_cents)
      gross_billable_cents    = sum(line_gross_cents)
      make_good_credit_cents  = sum(MakeGood.waived_credit_cents over MakeGoods of the buy with status == WAIVED)
      net_payable_cents       = gross_billable_cents - make_good_credit_cents
    input_set: "AIRED and MAKE_GOOD_AIRED BuyUnits of the buy whose air_window_end falls inside the billing period (SCHEDULED, PREEMPTED, CANCELLED and MAKE_GOOD_SCHEDULED units are excluded); WAIVED MakeGoods of the buy"
    constants:
      LINE_ROUNDING: round_half_up_per_line
    precision: "whole cents; commission rounded half-up on each line before summation"

  - name: sequential_liability_release
    trigger: "on POST /upfront/invoices/{invoiceId}/record-client-payment and at invoice creation"
    algorithm: waterfall_allocation
    formula: |
      if Advertiser.sequential_liability_enabled:
        max_remittable_cents = min(Invoice.seller_payable_cents,
                                   floor(Invoice.client_paid_cents * Invoice.seller_payable_cents / Invoice.net_payable_cents))
      else:
        max_remittable_cents = Invoice.seller_payable_cents
      # remittance to the seller can never exceed what the client has actually funded, pro rata
    input_set: "the single Invoice plus the sequential_liability_enabled flag of the campaign's Advertiser"
    constants:
      SEQUENTIAL_LIABILITY_ROUNDING: floor
    precision: "whole cents, floored (the agency never advances a fraction of a cent of its own money); 0 when net_payable_cents == 0"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules, ordered by priority. Exactly one error_id is returned
# per rejected request: the lowest-priority-number rule that the request
# violates. Priorities are globally unique so every pair-conflict outcome is
# determinate.
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of AgencyPlanner, AgencyBuyer, AgencyController, SellerRep, AdvertiserClient, MeasurementProvider"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list per §1.7"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request body shape: every required input present, enums within their declared value sets, monetary and impression amounts integers > 0, percentages within [0.00, 100.00], window start strictly before window end, ISO-8601 UTC timestamps"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 4
    category: existence
    check: "every id in the path resolves to a stored row, validated left to right"
    error_id: "ERR_ADVERTISER_NOT_FOUND | ERR_CAMPAIGN_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_SELLER_NOT_FOUND | ERR_FORECAST_NOT_FOUND | ERR_NEGOTIATION_NOT_FOUND | ERR_BUY_NOT_FOUND | ERR_BUY_UNIT_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_MAKE_GOOD_NOT_FOUND | ERR_RIGHTS_EXERCISE_NOT_FOUND | ERR_RECONCILIATION_RUN_NOT_FOUND | ERR_INVOICE_NOT_FOUND (whichever path segment failed first)"
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 5
    category: existence
    check: "every foreign key supplied in the request body resolves to a stored row, validated in the field order declared by the endpoint's input list"
    error_id: "the same per-entity NOT_FOUND family as priority 4"
    http_status: 404
    applies_to: "all POST endpoints carrying FK inputs"
  - priority: 6
    category: auth
    check: "ownership: a SellerRep's X-User-ID equals the Seller.id owning the target forecast / negotiation / buy / unit / report / make-good; an AdvertiserClient's X-User-ID equals the Advertiser.id owning the target campaign or invoice"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /upfront/inventory-forecasts, POST /upfront/inventory-forecasts/{forecastId}/publish, POST /upfront/negotiations/{negotiationId}/counter, POST /upfront/buy-units/{buyUnitId}/settle-airing, POST /upfront/delivery-reports, POST /upfront/make-goods/{makeGoodId}/offer, POST /upfront/campaigns/{campaignId}/approve-plan, POST /upfront/campaigns/{campaignId}/reject-plan, POST /upfront/campaigns/{campaignId}/fund, POST /upfront/invoices/{invoiceId}/record-client-payment"
  - priority: 7
    category: state
    check: "the OCC field equals the parent's current version (§1.2.1)"
    error_id: "ERR_STALE_NEGOTIATION_VERSION | ERR_STALE_CAMPAIGN_VERSION"
    http_status: 412
    applies_to: "POST /upfront/negotiations/{negotiationId}/counter, POST /upfront/buys/{buyId}/place"
  - priority: 8
    category: state
    check: "the target resource is not already in a terminal state of the machine the request would advance. Scope: Negotiation.status IN {ACCEPTED, WITHDRAWN}, Buy.buy_status IN {CLOSED, CANCELLED}, MakeGood.status IN {SCHEDULED, WAIVED}, Invoice.client_status == PAID or Invoice.seller_status == REMITTED. The DeliveryReport, BuyUnit, Campaign.funding_status and Advertiser.credit_status machines are deliberately OUT of scope: their non-advanceable states are reported by their own rules at priorities 12, 13 and 44, and an Advertiser on HOLD must still be able to receive client payments"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "every action endpoint that drives a state machine"
  - priority: 9
    category: state
    check: "Campaign.plan_status / funding_status is a declared from-state for the requested transition"
    error_id: ERR_CAMPAIGN_PLAN_NOT_IN_EXPECTED_STATE
    http_status: 409
    applies_to: "POST /upfront/campaigns/{campaignId}/submit-plan, approve-plan, reject-plan, fund"
  - priority: 10
    category: state
    check: "Negotiation.status is a declared from-state for the requested transition (counter and accept require the correct side to be on the table)"
    error_id: ERR_NEGOTIATION_NOT_IN_EXPECTED_STATE
    http_status: 409
    applies_to: "POST /upfront/negotiations/{negotiationId}/counter, revise, accept, withdraw"
  - priority: 11
    category: state
    check: "Buy.buy_status is a declared from-state for the requested operation (place requires PENDING_PLACEMENT, unit creation requires PENDING_PLACEMENT, close requires IN_FLIGHT, rights exercise requires PENDING_PLACEMENT or PLACED); close additionally requires Buy.stewardship_status IN {WITHIN_TOLERANCE, MADE_GOOD} and no DeliveryReport of the buy in status SUBMITTED"
    error_id: ERR_BUY_NOT_IN_EXPECTED_STATE
    http_status: 409
    applies_to: "POST /upfront/buys/{buyId}/units, POST /upfront/buys/{buyId}/place, POST /upfront/buys/{buyId}/close, POST /upfront/rights-exercises"
  - priority: 12
    category: state
    check: "BuyUnit.status is SCHEDULED or MAKE_GOOD_SCHEDULED when settling an airing"
    error_id: ERR_UNIT_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /upfront/buy-units/{buyUnitId}/settle-airing"
  - priority: 13
    category: state
    check: "DeliveryReport.status is SUBMITTED when accepting or disputing"
    error_id: ERR_REPORT_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /upfront/delivery-reports/{deliveryReportId}/accept, dispute"
  - priority: 14
    category: state
    check: "MakeGood.status is a declared from-state (offer requires OPEN, accept and reject require OFFERED, waive requires OPEN or OFFERED)"
    error_id: ERR_MAKE_GOOD_NOT_IN_EXPECTED_STATE
    http_status: 409
    applies_to: "POST /upfront/make-goods/{makeGoodId}/offer, accept, reject, waive"
  - priority: 15
    category: state
    check: "Invoice.client_status / seller_status is a declared from-state (issue requires DRAFT, client payment requires ISSUED or PARTIALLY_PAID, remittance requires an issued invoice whose seller_status is not REMITTED)"
    error_id: ERR_INVOICE_NOT_IN_EXPECTED_STATE
    http_status: 409
    applies_to: "POST /upfront/invoices/{invoiceId}/issue, record-client-payment, remit-seller"
  - priority: 16
    category: state
    check: "no ChannelAllocation of the campaign is LOCKED when creating a new allocation"
    error_id: ERR_ALLOCATION_LOCKED
    http_status: 409
    applies_to: "POST /upfront/channel-allocations"
  - priority: 17
    category: state
    check: "cross-entity: the Campaign of the negotiation has plan_status == APPROVED when the agency accepts a counter"
    error_id: ERR_CAMPAIGN_PLAN_NOT_APPROVED
    http_status: 409
    applies_to: "POST /upfront/negotiations/{negotiationId}/accept"
  # priority 18 intentionally unused: "the negotiation's ChannelAllocation is LOCKED"
  # is not an independently checkable rule, because plan_status == APPROVED and
  # "every allocation of the campaign is LOCKED" are equivalent by construction
  # (approve-plan locks them, every exit from APPROVED unlocks them). The
  # condition is therefore enforced by priority 17 alone.
  - priority: 19
    category: state
    check: "cross-entity: the InventoryForecast has status == PUBLISHED when a BuyUnit is created against it, when it is offered as a make-good and when that offer is accepted; and, on POST /upfront/inventory-forecasts/{forecastId}/publish, the forecast is in its declared from-state DRAFT"
    error_id: "ERR_FORECAST_NOT_PUBLISHED | ERR_FORECAST_NOT_IN_EXPECTED_STATE"
    http_status: 409
    applies_to: "POST /upfront/buys/{buyId}/units, POST /upfront/make-goods/{makeGoodId}/offer, POST /upfront/make-goods/{makeGoodId}/accept, POST /upfront/inventory-forecasts/{forecastId}/publish"
  - priority: 20
    category: state
    check: "cross-entity: Campaign.plan_posture == WITHIN_PLAN when re-submitting a plan out of REVISION_REQUIRED"
    error_id: ERR_PLAN_POSTURE_REPLAN_REQUIRED
    http_status: 409
    applies_to: "POST /upfront/campaigns/{campaignId}/submit-plan"
  - priority: 21
    category: business_temporal
    check: "the rights window is open: an OPTION_ROLL requires logical clock < Buy.option_window_close; a CANCELLATION requires logical clock < Buy.cancel_window_2_close"
    error_id: ERR_RIGHTS_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /upfront/rights-exercises"
  - priority: 22
    category: business_temporal
    check: "logical clock >= BuyUnit.air_window_end when settling an airing"
    error_id: ERR_AIR_WINDOW_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /upfront/buy-units/{buyUnitId}/settle-airing"
  - priority: 23
    category: business_temporal
    check: "period_start <= period_end and the reported period lies inside [Buy.flight_start, Buy.flight_end]"
    error_id: ERR_REPORT_PERIOD_OUTSIDE_FLIGHT
    http_status: 422
    applies_to: "POST /upfront/delivery-reports"
  - priority: 24
    category: business_temporal
    check: "the offered make-good window lies inside [InventoryForecast.window_start, InventoryForecast.window_end] and offered_window_start >= logical clock"
    error_id: ERR_MAKE_GOOD_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /upfront/make-goods/{makeGoodId}/offer"
  - priority: 25
    category: business_temporal
    check: "the requested clock value is not earlier than the current logical clock"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"
  - priority: 26
    category: business_constraint
    check: "requested_pct + the matching cumulative already exercised <= the applied ceiling: OPTION_ROLL ceiling is Buy.option_pct_ceiling; CANCELLATION ceiling is CANCEL_CEILING_EARLY_PCT (100.00) while logical clock < Buy.cancel_window_1_close and CANCEL_CEILING_LATE_PCT (25.00) from cancel_window_1_close up to cancel_window_2_close"
    error_id: ERR_RIGHTS_PCT_ABOVE_CEILING
    http_status: 422
    applies_to: "POST /upfront/rights-exercises"
  - priority: 27
    category: business_constraint
    check: "at least one ChannelAllocation exists and the sum of allocation_pct over allocations with status IN {DRAFT, LOCKED} is exactly 100.00 at plan submission; a new allocation must not push that sum above 100.00"
    error_id: ERR_ALLOCATION_PCT_SUM_INVALID
    http_status: 422
    applies_to: "POST /upfront/campaigns/{campaignId}/submit-plan, POST /upfront/channel-allocations"
  - priority: 28
    category: business_constraint
    check: "Negotiation.round_number + 1 <= MAX_NEGOTIATION_ROUNDS (6)"
    error_id: ERR_NEGOTIATION_ROUND_CAP_REACHED
    http_status: 409
    applies_to: "POST /upfront/negotiations/{negotiationId}/counter, revise"
  - priority: 29
    category: business_constraint
    check: "MakeGood.offer_round + 1 <= MAX_MAKE_GOOD_OFFERS (3)"
    error_id: ERR_MAKE_GOOD_OFFER_CAP_REACHED
    http_status: 409
    applies_to: "POST /upfront/make-goods/{makeGoodId}/offer"
  - priority: 30
    category: business_constraint
    check: "offered_impressions >= MakeGood.shortfall_impressions"
    error_id: ERR_MAKE_GOOD_OFFER_INSUFFICIENT
    http_status: 422
    applies_to: "POST /upfront/make-goods/{makeGoodId}/offer"
  - priority: 31
    category: business_constraint
    check: "Buy.make_good_provision != NONE when offering or waiving a make-good"
    error_id: ERR_MAKE_GOOD_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /upfront/make-goods/{makeGoodId}/offer, POST /upfront/make-goods/{makeGoodId}/waive"
  - priority: 32
    category: business_referential
    check: "the InventoryForecast of a BuyUnit belongs to Buy.seller_id, its market equals Buy.market, its platform is compatible with Buy.channel, and its window lies inside [Buy.flight_start, Buy.flight_end]"
    error_id: ERR_UNIT_FORECAST_MISMATCH
    http_status: 422
    applies_to: "POST /upfront/buys/{buyId}/units"
  - priority: 33
    category: business_referential
    check: "the ChannelAllocation named by a negotiation belongs to the same Campaign and its channel equals the negotiation's channel"
    error_id: ERR_ALLOCATION_CAMPAIGN_MISMATCH
    http_status: 422
    applies_to: "POST /upfront/negotiations"
  - priority: 34
    category: business_referential
    check: "the invoice billing period contains at least one AIRED or MAKE_GOOD_AIRED BuyUnit of the buy"
    error_id: ERR_NO_BILLABLE_LINES
    http_status: 422
    applies_to: "POST /upfront/invoices"
  - priority: 35
    category: business_safety
    check: "the campaign's Advertiser has credit_status != HOLD"
    error_id: ERR_ADVERTISER_CREDIT_HOLD
    http_status: 403
    applies_to: "POST /upfront/campaigns/{campaignId}/submit-plan, POST /upfront/campaigns/{campaignId}/approve-plan, POST /upfront/negotiations/{negotiationId}/accept"
  - priority: 36
    category: business_safety
    check: "segregation of duties: the X-User-ID remitting to the seller differs from Buy.placed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /upfront/invoices/{invoiceId}/remit-seller"
  - priority: 37
    category: business_safety
    check: "competitive separation: for every already-placed Buy on the same Seller whose Campaign belongs to a DIFFERENT Advertiser carrying the same category_code, expand that buy's flight window by CATEGORY_SEPARATION_DAYS (7) at each end and reject when the buy being placed has a flight window that overlaps the expanded window; the intervals are CLOSED, so a flight starting exactly on the buffered end instant is a conflict. Buys of the same Advertiser never separate against each other, so one advertiser may place many overlapping buys on one seller"
    error_id: ERR_CATEGORY_SEPARATION_CONFLICT
    http_status: 409
    applies_to: "POST /upfront/buys/{buyId}/place"
  - priority: 38
    category: business_constraint
    check: "exclusivity: a BuyUnit against a forecast whose exclusivity_mode == EXCLUSIVE must not have an air window that overlaps the air window of an existing SCHEDULED, AIRED, MAKE_GOOD_SCHEDULED or MAKE_GOOD_AIRED unit on that same forecast for a different Buy; the interval is half-open [start, end), so a unit starting exactly at another's end is accepted"
    error_id: ERR_EXCLUSIVE_AVAIL_CONFLICT
    http_status: 409
    applies_to: "POST /upfront/buys/{buyId}/units"
  - priority: 39
    category: business_fiscal
    check: "projected_impressions <= InventoryForecast.available_impressions (unit creation) and MakeGood.offered_impressions <= InventoryForecast.available_impressions (make-good acceptance)"
    error_id: ERR_FORECAST_AVAIL_EXCEEDED
    http_status: 409
    applies_to: "POST /upfront/buys/{buyId}/units, POST /upfront/make-goods/{makeGoodId}/accept"
  - priority: 40
    category: business_fiscal
    check: "offered_impressions <= Seller.make_good_capacity_impressions - Seller.scheduled_make_good_impressions"
    error_id: ERR_MAKE_GOOD_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /upfront/make-goods/{makeGoodId}/offer"
  - priority: 41
    category: business_fiscal
    check: "the sum of projected_impressions over SCHEDULED units of the buy is >= Buy.guaranteed_impressions at placement"
    error_id: ERR_UNIT_COVERAGE_SHORT
    http_status: 409
    applies_to: "POST /upfront/buys/{buyId}/place"
  - priority: 42
    category: business_fiscal
    check: "Advertiser.outstanding_receivable_cents <= Advertiser.credit_limit_cents at plan approval"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /upfront/campaigns/{campaignId}/approve-plan"
  - priority: 43
    category: business_fiscal
    check: "Campaign.committed_gross_cents + Buy.gross_cost_cents <= Campaign.total_budget_cents at placement"
    error_id: ERR_CAMPAIGN_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /upfront/buys/{buyId}/place"
  - priority: 44
    category: business_fiscal
    check: "Campaign.funding_status != FUNDED when funding (a fully funded campaign takes no further deposits)"
    error_id: ERR_CAMPAIGN_ALREADY_FUNDED
    http_status: 409
    applies_to: "POST /upfront/campaigns/{campaignId}/fund"
  - priority: 45
    category: business_fiscal
    check: "Campaign.funded_cents covers this invoice's net_payable_cents plus the net_payable_cents of the campaign's other invoices whose client_status IN {ISSUED, PARTIALLY_PAID, PAID}"
    error_id: ERR_CAMPAIGN_FUNDING_INSUFFICIENT
    http_status: 409
    applies_to: "POST /upfront/invoices/{invoiceId}/issue"
  - priority: 46
    category: business_fiscal
    check: "Invoice.client_paid_cents + amount_cents <= Invoice.net_payable_cents"
    error_id: ERR_PAYMENT_EXCEEDS_INVOICE
    http_status: 422
    applies_to: "POST /upfront/invoices/{invoiceId}/record-client-payment"
  - priority: 47
    category: business_fiscal
    check: "Invoice.seller_remitted_cents + amount_cents <= Invoice.max_remittable_cents (sequential liability - the agency never advances funds the client has not paid) and <= Invoice.seller_payable_cents"
    error_id: ERR_SEQUENTIAL_LIABILITY_EXCEEDED
    http_status: 422
    applies_to: "POST /upfront/invoices/{invoiceId}/remit-seller"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table. Flat namespace under /upfront: every collection is
# addressable as /upfront/<collection>[/{id}[/action]], every FK is reverse
# reachable through a filtered list, and every state in §1.2 is reachable from
# an empty database by composing these calls.
# ---------------------------------------------------------------------------
endpoints:
  # --- Advertiser -----------------------------------------------------------
  - method: POST
    path: "/upfront/advertisers"
    description: "register an advertiser client with its credit and payment terms"
    roles: [AgencyController]
    code: 201
    input: [name, category_code, credit_limit_cents, "payment_terms_days?", "sequential_liability_enabled?"]
    output: Advertiser
    side_effects: ["credit_status initialised to ACTIVE", "late_payment_count initialised to 0", "outstanding_receivable_cents initialised to 0"]
  - method: GET
    path: "/upfront/advertisers/{advertiserId}"
    description: "read one advertiser including its computed outstanding receivable"
    roles: [AgencyPlanner, AgencyBuyer, AgencyController, SellerRep, AdvertiserClient, MeasurementProvider]
    code: 200
    input: []
    output: Advertiser
    side_effects: []
  - method: GET
    path: "/upfront/advertisers"
    description: "list advertisers with optional category and credit filters"
    roles: [AgencyPlanner, AgencyBuyer, AgencyController, SellerRep, AdvertiserClient, MeasurementProvider]
    code: 200
    input: ["category_code?", "credit_status?", "limit?", "offset?"]
    output: Advertiser[]
    side_effects: []

  # --- Campaign -------------------------------------------------------------
  - method: POST
    path: "/upfront/campaigns"
    description: "translate a brand objective into a campaign plan shell with reach, frequency and budget goals"
    roles: [AgencyPlanner]
    code: 201
    input: [advertiser_id, name, target_demo, universe_thousands, reach_goal_pct, frequency_goal, total_budget_cents, flight_start, flight_end, fiscal_quarter]
    output: Campaign
    side_effects: ["plan_status DRAFT, funding_status UNFUNDED, plan_posture WITHIN_PLAN", "unallocated_budget_cents and uncommitted_budget_cents initialised to total_budget_cents"]
  - method: GET
    path: "/upfront/campaigns/{campaignId}"
    description: "read one campaign with its planning, commitment and funding aggregates plus its current version for OCC"
    roles: [AgencyPlanner, AgencyBuyer, AgencyController, SellerRep, AdvertiserClient, MeasurementProvider]
    code: 200
    input: []
    output: Campaign
    side_effects: []
  - method: GET
    path: "/upfront/campaigns"
    description: "list campaigns, optionally filtered by advertiser, plan status or fiscal quarter"
    roles: [AgencyPlanner, AgencyBuyer, AgencyController, SellerRep, AdvertiserClient, MeasurementProvider]
    code: 200
    input: ["advertiser_id?", "plan_status?", "fiscal_quarter?", "limit?", "offset?"]
    output: Campaign[]
    side_effects: []
  - method: POST
    path: "/upfront/campaigns/{campaignId}/submit-plan"
    description: "submit the channel allocation plan for client approval"
    roles: [AgencyPlanner]
    code: 200
    input: []
    output: Campaign
    side_effects: ["plan_status DRAFT|REVISION_REQUIRED -> PENDING_CLIENT_APPROVAL", "recomputes allocated_budget_cents, unallocated_budget_cents, planned_impressions_total, planned_grp_total (§1.3 allocation_budget_split, planned_delivery_projection)", "increments Campaign.version by 1"]
  - method: POST
    path: "/upfront/campaigns/{campaignId}/approve-plan"
    description: "client approves the media plan, locking the channel allocations"
    roles: [AdvertiserClient]
    code: 200
    input: []
    output: Campaign
    side_effects: ["plan_status PENDING_CLIENT_APPROVAL -> APPROVED", "every DRAFT ChannelAllocation of the campaign -> LOCKED", "increments Campaign.version by 1"]
  - method: POST
    path: "/upfront/campaigns/{campaignId}/reject-plan"
    description: "client sends the plan back for revision"
    roles: [AdvertiserClient]
    code: 200
    input: [revision_note]
    output: Campaign
    side_effects: ["plan_status PENDING_CLIENT_APPROVAL -> DRAFT", "every LOCKED ChannelAllocation of the campaign -> DRAFT (conditional cascade)", "increments Campaign.version by 1"]
  - method: POST
    path: "/upfront/campaigns/{campaignId}/fund"
    description: "client deposits funds against the campaign budget"
    roles: [AdvertiserClient]
    code: 200
    input: [amount_cents]
    output: Campaign
    side_effects: ["funded_cents increased by amount_cents", "funding_status advances UNFUNDED -> PARTIALLY_FUNDED -> FUNDED independently of plan_status", "increments Campaign.version by 1"]

  # --- ChannelAllocation ----------------------------------------------------
  - method: POST
    path: "/upfront/channel-allocations"
    description: "allocate a share of the campaign budget to one channel, market and primary daypart"
    roles: [AgencyPlanner]
    code: 201
    input: [campaign_id, channel, allocation_pct, planned_cpm_cents, planned_market, primary_daypart]
    output: ChannelAllocation
    side_effects: ["computes allocated_cents, effective_planned_cpm_cents, planned_impressions, planned_grp, planned_frequency (§1.3)", "recomputes the campaign's planning aggregates", "status DRAFT, posture WITHIN_PLAN", "increments Campaign.version by 1"]
  - method: GET
    path: "/upfront/channel-allocations/{allocationId}"
    description: "read one channel allocation with its projection and commitment fields"
    roles: [AgencyPlanner, AgencyBuyer, AgencyController, SellerRep, AdvertiserClient, MeasurementProvider]
    code: 200
    input: []
    output: ChannelAllocation
    side_effects: []
  - method: GET
    path: "/upfront/channel-allocations"
    description: "list channel allocations, optionally filtered by campaign, channel or status"
    roles: [AgencyPlanner, AgencyBuyer, AgencyController, SellerRep, AdvertiserClient, MeasurementProvider]
    code: 200
    input: ["campaign_id?", "channel?", "status?", "limit?", "offset?"]
    output: ChannelAllocation[]
    side_effects: []

  # --- Seller ---------------------------------------------------------------
  - method: POST
    path: "/upfront/sellers"
    description: "register a media seller with its make-good capacity"
    roles: [AgencyController]
    code: 201
    input: [name, platform_types, make_good_capacity_impressions]
    output: Seller
    side_effects: ["open_make_good_impressions and scheduled_make_good_impressions initialised to 0"]
  - method: GET
    path: "/upfront/sellers/{sellerId}"
    description: "read one seller with its computed make-good exposure"
    roles: [AgencyPlanner, AgencyBuyer, AgencyController, SellerRep, AdvertiserClient, MeasurementProvider]
    code: 200
    input: []
    output: Seller
    side_effects: []
  - method: GET
    path: "/upfront/sellers"
    description: "list sellers"
    roles: [AgencyPlanner, AgencyBuyer, AgencyController, SellerRep, AdvertiserClient, MeasurementProvider]
    code: 200
    input: ["limit?", "offset?"]
    output: Seller[]
    side_effects: []

  # --- InventoryForecast ----------------------------------------------------
  - method: POST
    path: "/upfront/inventory-forecasts"
    description: "seller files a marketplace forecast (avail) for a quarter, daypart, program and platform"
    roles: [SellerRep]
    code: 201
    input: [seller_id, market, fiscal_quarter, daypart, program, platform, window_start, window_end, total_impressions, forecast_cpm_cents, "exclusivity_mode?"]
    output: InventoryForecast
    side_effects: ["available_impressions initialised to total_impressions", "status DRAFT"]
  - method: POST
    path: "/upfront/inventory-forecasts/{forecastId}/publish"
    description: "seller publishes the avail, making it buyable and offerable as a make-good"
    roles: [SellerRep]
    code: 200
    input: []
    output: InventoryForecast
    side_effects: ["status DRAFT -> PUBLISHED", "increments InventoryForecast.version by 1"]
  - method: GET
    path: "/upfront/inventory-forecasts/{forecastId}"
    description: "read one avail including remaining available_impressions"
    roles: [AgencyPlanner, AgencyBuyer, AgencyController, SellerRep, AdvertiserClient, MeasurementProvider]
    code: 200
    input: []
    output: InventoryForecast
    side_effects: []
  - method: GET
    path: "/upfront/inventory-forecasts"
    description: "marketplace search across avails by seller, market, quarter, platform and status"
    roles: [AgencyPlanner, AgencyBuyer, AgencyController, SellerRep, AdvertiserClient, MeasurementProvider]
    code: 200
    input: ["seller_id?", "market?", "fiscal_quarter?", "platform?", "status?", "limit?", "offset?"]
    output: InventoryForecast[]
    side_effects: []

  # --- Negotiation ----------------------------------------------------------
  - method: POST
    path: "/upfront/negotiations"
    description: "open a CPM negotiation with a seller against one channel allocation"
    roles: [AgencyBuyer]
    code: 201
    input: [campaign_id, seller_id, channel_allocation_id, market, channel, requested_impressions, opening_cpm_cents, "guarantee_pct?", "make_good_provision?", "option_pct_ceiling?"]
    output: Negotiation
    side_effects: ["status AGENCY_OFFER, round_number 1, last_offer_actor AGENCY", "current_cpm_cents := opening_cpm_cents, current_impressions := requested_impressions"]
  - method: POST
    path: "/upfront/negotiations/{negotiationId}/counter"
    description: "seller counters the CPM and impression volume on the table; requires the negotiation version the seller last observed"
    roles: [SellerRep]
    code: 200
    input: [expected_negotiation_version, counter_cpm_cents, counter_impressions]
    output: Negotiation
    side_effects: ["status AGENCY_OFFER -> SELLER_COUNTER", "current terms replaced, last_offer_actor := SELLER, round_number incremented by 1", "increments Negotiation.version by 1"]
  - method: POST
    path: "/upfront/negotiations/{negotiationId}/revise"
    description: "agency revises its offer after a seller counter"
    roles: [AgencyBuyer]
    code: 200
    input: [offer_cpm_cents, offer_impressions]
    output: Negotiation
    side_effects: ["status SELLER_COUNTER -> AGENCY_OFFER", "current terms replaced, last_offer_actor := AGENCY, round_number incremented by 1", "increments Negotiation.version by 1"]
  - method: POST
    path: "/upfront/negotiations/{negotiationId}/accept"
    description: "agency accepts the seller counter on the table, freezing terms and creating the buy; the buy inherits the campaign flight window"
    roles: [AgencyBuyer]
    code: 201
    input: []
    output: Buy
    side_effects: ["status SELLER_COUNTER -> ACCEPTED, accepted_cpm_cents and accepted_impressions frozen", "creates a Buy with buy_status PENDING_PLACEMENT, stewardship_status NOT_STARTED, settlement_status UNBILLED", "computes net_media_cost_cents, commission_rate, agency_commission_cents, gross_cost_cents (§1.3 negotiated_buy_cost)", "derives flight window from the campaign and the option / cancellation window closes from flight_start", "increments Negotiation.version by 1"]
  - method: POST
    path: "/upfront/negotiations/{negotiationId}/withdraw"
    description: "agency withdraws from the negotiation"
    roles: [AgencyBuyer]
    code: 200
    input: ["withdraw_reason?"]
    output: Negotiation
    side_effects: ["status -> WITHDRAWN (terminal)", "increments Negotiation.version by 1"]
  - method: GET
    path: "/upfront/negotiations/{negotiationId}"
    description: "read one negotiation with its current terms, round number and version"
    roles: [AgencyPlanner, AgencyBuyer, AgencyController, SellerRep, AdvertiserClient, MeasurementProvider]
    code: 200
    input: []
    output: Negotiation
    side_effects: []
  - method: GET
    path: "/upfront/negotiations"
    description: "list negotiations by campaign, seller, allocation or status"
    roles: [AgencyPlanner, AgencyBuyer, AgencyController, SellerRep, AdvertiserClient, MeasurementProvider]
    code: 200
    input: ["campaign_id?", "seller_id?", "channel_allocation_id?", "status?", "limit?", "offset?"]
    output: Negotiation[]
    side_effects: []

  # --- Buy and BuyUnit ------------------------------------------------------
  - method: POST
    path: "/upfront/buys/{buyId}/units"
    description: "add a unit line to the buy's mix across daypart, program and platform, holding inventory on a published avail"
    roles: [AgencyBuyer]
    code: 201
    input: [forecast_id, daypart, program, platform, units, unit_rate_cents, projected_impressions, air_window_start, air_window_end, "exclusive?"]
    output: BuyUnit
    side_effects: ["status SCHEDULED", "computes line_net_cents = units * unit_rate_cents, line_commission_cents and line_gross_cents at Buy.commission_rate", "InventoryForecast.available_impressions decreased by projected_impressions", "a forecast whose available_impressions reaches 0 transitions PUBLISHED -> EXHAUSTED", "recomputes Buy.placed_impressions", "increments InventoryForecast.version by 1"]
  - method: POST
    path: "/upfront/buys/{buyId}/place"
    description: "place the buy with the seller, committing budget; requires the campaign version the buyer last observed"
    roles: [AgencyBuyer]
    code: 200
    input: [expected_campaign_version]
    output: Buy
    side_effects: ["buy_status PENDING_PLACEMENT -> PLACED and placed_by_user_id := X-User-ID", "increments Campaign.version by 1", "cascade link 1: ChannelAllocation.committed_cents recomputed", "cascade link 2: allocation posture WITHIN_PLAN -> OVERCOMMITTED when committed_cents exceeds allocated_cents", "cascade link 3: Campaign.plan_posture -> REPLAN_REQUIRED", "cascade link 4: Campaign.plan_status APPROVED -> REVISION_REQUIRED and LOCKED allocations return to DRAFT", "recomputes Campaign.committed_gross_cents and uncommitted_budget_cents"]
  - method: POST
    path: "/upfront/buys/{buyId}/close"
    description: "close out stewardship on a buy whose delivery has settled"
    roles: [AgencyController]
    code: 200
    input: []
    output: Buy
    side_effects: ["buy_status IN_FLIGHT -> COMPLETED", "increments Buy.version by 1"]
  - method: GET
    path: "/upfront/buys/{buyId}"
    description: "read one buy with its cost, delivery-index, stewardship, rights and settlement fields"
    roles: [AgencyPlanner, AgencyBuyer, AgencyController, SellerRep, AdvertiserClient, MeasurementProvider]
    code: 200
    input: []
    output: Buy
    side_effects: []
  - method: GET
    path: "/upfront/buys"
    description: "list buys by campaign, seller, negotiation, allocation or status"
    roles: [AgencyPlanner, AgencyBuyer, AgencyController, SellerRep, AdvertiserClient, MeasurementProvider]
    code: 200
    input: ["campaign_id?", "seller_id?", "negotiation_id?", "channel_allocation_id?", "buy_status?", "limit?", "offset?"]
    output: Buy[]
    side_effects: []
  - method: POST
    path: "/upfront/buy-units/{buyUnitId}/settle-airing"
    description: "seller settles a unit after its air window: AIRED with actual impressions, or PREEMPTED which releases the inventory hold"
    roles: [SellerRep]
    code: 200
    input: [outcome, "actual_impressions?"]
    output: BuyUnit
    side_effects: ["outcome AIRED: status SCHEDULED -> AIRED or MAKE_GOOD_SCHEDULED -> MAKE_GOOD_AIRED and actual_impressions recorded", "outcome PREEMPTED: status SCHEDULED -> PREEMPTED, InventoryForecast.available_impressions increased by projected_impressions, an EXHAUSTED forecast returns to PUBLISHED, Buy.placed_impressions recomputed and Buy.stewardship_status -> AT_RISK", "increments BuyUnit.version by 1"]
  - method: GET
    path: "/upfront/buy-units/{buyUnitId}"
    description: "read one unit line with its projection, line money and airing outcome"
    roles: [AgencyPlanner, AgencyBuyer, AgencyController, SellerRep, AdvertiserClient, MeasurementProvider]
    code: 200
    input: []
    output: BuyUnit
    side_effects: []
  - method: GET
    path: "/upfront/buy-units"
    description: "list unit lines by buy, avail, originating make-good or status - the discovery channel for cascade-created make-good units"
    roles: [AgencyPlanner, AgencyBuyer, AgencyController, SellerRep, AdvertiserClient, MeasurementProvider]
    code: 200
    input: ["buy_id?", "forecast_id?", "make_good_id?", "status?", "limit?", "offset?"]
    output: BuyUnit[]
    side_effects: []

  # --- DeliveryReport -------------------------------------------------------
  - method: POST
    path: "/upfront/delivery-reports"
    description: "file measured delivery for a period of the buy, both gross and target-demo impressions"
    roles: [SellerRep, MeasurementProvider]
    code: 201
    input: [buy_id, measurement_basis, period_start, period_end, delivered_impressions, delivered_demo_impressions]
    output: DeliveryReport
    side_effects: ["status SUBMITTED", "is_post_buy_final computed as period_end >= Buy.flight_end", "recomputes Buy.credited_impressions_provisional and provisional_delivery_index (PROVISIONAL variant counts SUBMITTED reports)"]
  - method: POST
    path: "/upfront/delivery-reports/{deliveryReportId}/accept"
    description: "agency accepts the reported delivery, driving post-buy analysis against the audience guarantee"
    roles: [AgencyBuyer]
    code: 200
    input: []
    output: DeliveryReport
    side_effects: ["status SUBMITTED -> ACCEPTED", "cascade link 1: Buy.credited_impressions_final and final_delivery_index recomputed (FINAL variant)", "buy_status PLACED -> IN_FLIGHT on the first acceptance", "cascade link 2: stewardship_status -> UNDER_DELIVERED when a post-buy-final report leaves shortfall_pct >= 2.0000, else WITHIN_TOLERANCE", "cascade link 3: a MakeGood is created with status OPEN and the frozen shortfall", "cascade link 4: Seller.open_make_good_impressions recomputed", "increments Buy.version by 1"]
  - method: POST
    path: "/upfront/delivery-reports/{deliveryReportId}/dispute"
    description: "agency disputes the reported delivery, removing it from the provisional input set"
    roles: [AgencyBuyer]
    code: 200
    input: [dispute_reason]
    output: DeliveryReport
    side_effects: ["status SUBMITTED -> DISPUTED", "recomputes Buy.credited_impressions_provisional and provisional_delivery_index downward", "increments DeliveryReport.version by 1"]
  - method: GET
    path: "/upfront/delivery-reports/{deliveryReportId}"
    description: "read one delivery report including its computed is_post_buy_final flag"
    roles: [AgencyPlanner, AgencyBuyer, AgencyController, SellerRep, AdvertiserClient, MeasurementProvider]
    code: 200
    input: []
    output: DeliveryReport
    side_effects: []
  - method: GET
    path: "/upfront/delivery-reports"
    description: "list delivery reports by buy, status or measurement basis"
    roles: [AgencyPlanner, AgencyBuyer, AgencyController, SellerRep, AdvertiserClient, MeasurementProvider]
    code: 200
    input: ["buy_id?", "status?", "measurement_basis?", "limit?", "offset?"]
    output: DeliveryReport[]
    side_effects: []

  # --- MakeGood -------------------------------------------------------------
  - method: POST
    path: "/upfront/make-goods/{makeGoodId}/offer"
    description: "seller offers replacement inventory against an open make-good"
    roles: [SellerRep]
    code: 200
    input: [offered_forecast_id, offered_impressions, offered_window_start, offered_window_end]
    output: MakeGood
    side_effects: ["status OPEN -> OFFERED, offer_round incremented by 1", "offered terms recorded", "increments MakeGood.version by 1"]
  - method: POST
    path: "/upfront/make-goods/{makeGoodId}/accept"
    description: "agency accepts the make-good offer, scheduling replacement units"
    roles: [AgencyBuyer]
    code: 200
    input: []
    output: MakeGood
    side_effects: ["status OFFERED -> SCHEDULED", "creates a BuyUnit with status MAKE_GOOD_SCHEDULED holding offered_impressions on the offered avail", "InventoryForecast.available_impressions decreased, PUBLISHED -> EXHAUSTED at 0", "Buy.made_good_impressions increased and open_shortfall_impressions recomputed", "cascade: Buy.stewardship_status UNDER_DELIVERED -> MADE_GOOD when open_shortfall_impressions reaches 0", "Seller.open_make_good_impressions and scheduled_make_good_impressions recomputed", "increments MakeGood.version by 1"]
  - method: POST
    path: "/upfront/make-goods/{makeGoodId}/reject"
    description: "agency rejects the offered make-good, reopening it for another offer"
    roles: [AgencyBuyer]
    code: 200
    input: [rejection_reason]
    output: MakeGood
    side_effects: ["status OFFERED -> OPEN, offered terms retained for audit", "increments MakeGood.version by 1"]
  - method: POST
    path: "/upfront/make-goods/{makeGoodId}/waive"
    description: "agency controller waives the make-good in exchange for a cash credit on the client invoice"
    roles: [AgencyController]
    code: 200
    input: ["credit_cents?"]
    output: MakeGood
    side_effects: ["status OPEN|OFFERED -> WAIVED", "waived_credit_cents := credit_cents, defaulting to shortfall_value_cents", "Buy.waived_impressions increased and open_shortfall_impressions recomputed", "cascade: Buy.stewardship_status UNDER_DELIVERED -> MADE_GOOD", "every DRAFT Invoice of the buy recomputes make_good_credit_cents and net_payable_cents", "increments MakeGood.version by 1"]
  - method: GET
    path: "/upfront/make-goods/{makeGoodId}"
    description: "read one make-good with its frozen shortfall and offer state"
    roles: [AgencyPlanner, AgencyBuyer, AgencyController, SellerRep, AdvertiserClient, MeasurementProvider]
    code: 200
    input: []
    output: MakeGood
    side_effects: []
  - method: GET
    path: "/upfront/make-goods"
    description: "list make-goods by buy, offered avail or status - the discovery channel for make-goods created by the delivery-acceptance cascade"
    roles: [AgencyPlanner, AgencyBuyer, AgencyController, SellerRep, AdvertiserClient, MeasurementProvider]
    code: 200
    input: ["buy_id?", "offered_forecast_id?", "status?", "limit?", "offset?"]
    output: MakeGood[]
    side_effects: []

  # --- RightsExercise -------------------------------------------------------
  - method: POST
    path: "/upfront/rights-exercises"
    description: "exercise an option roll-up or a cancellation right against a buy inside the applicable window"
    roles: [AgencyBuyer]
    code: 201
    input: [buy_id, kind, requested_pct]
    output: RightsExercise
    side_effects: ["appends an immutable exercise record with applied_ceiling_pct, delta_impressions, delta_gross_cents, cancelled_unit_count and exercised_at", "Buy.guaranteed_impressions adjusted and all cost fields recomputed with the commission tier re-selected (§1.3 negotiated_buy_cost)", "CANCELLATION: SCHEDULED units cancelled in air_window_start ASC, created_at ASC order and their inventory holds released, EXHAUSTED avails returning to PUBLISHED", "ChannelAllocation.committed_cents, posture, Campaign.committed_gross_cents, uncommitted_budget_cents and plan_posture recomputed", "buy_status -> CANCELLED once cancelled_pct_cumulative reaches 100.00", "increments Buy.version by 1"]
  - method: GET
    path: "/upfront/rights-exercises/{rightsExerciseId}"
    description: "read one exercise record"
    roles: [AgencyPlanner, AgencyBuyer, AgencyController, SellerRep, AdvertiserClient, MeasurementProvider]
    code: 200
    input: []
    output: RightsExercise
    side_effects: []
  - method: GET
    path: "/upfront/rights-exercises"
    description: "list exercise records by buy and kind"
    roles: [AgencyPlanner, AgencyBuyer, AgencyController, SellerRep, AdvertiserClient, MeasurementProvider]
    code: 200
    input: ["buy_id?", "kind?", "limit?", "offset?"]
    output: RightsExercise[]
    side_effects: []

  # --- ReconciliationRun ----------------------------------------------------
  - method: POST
    path: "/upfront/reconciliation-runs"
    description: "reconcile cross-platform measurement for the campaign, deduplicating linear, CTV and digital reach"
    roles: [AgencyPlanner, AgencyController]
    code: 201
    input: [campaign_id, dedup_method, "aggregate_duplication_pct?", "linear_ctv_duplication_pct?", "ctv_digital_duplication_pct?", "linear_digital_duplication_pct?"]
    output: ReconciliationRun
    side_effects: ["appends an immutable run with group_reach_pct, gross_reach_pct_total, unduplicated_reach_pct, implied_frequency, included_report_count and computed_at (§1.3 campaign_unduplicated_reach)", "status COMPLETED, or COMPLETED_NO_DATA when no ACCEPTED delivery report is in scope"]
  - method: GET
    path: "/upfront/reconciliation-runs/{reconciliationRunId}"
    description: "read one reconciliation run"
    roles: [AgencyPlanner, AgencyBuyer, AgencyController, SellerRep, AdvertiserClient, MeasurementProvider]
    code: 200
    input: []
    output: ReconciliationRun
    side_effects: []
  - method: GET
    path: "/upfront/reconciliation-runs"
    description: "list reconciliation runs by campaign and dedup method"
    roles: [AgencyPlanner, AgencyBuyer, AgencyController, SellerRep, AdvertiserClient, MeasurementProvider]
    code: 200
    input: ["campaign_id?", "dedup_method?", "limit?", "offset?"]
    output: ReconciliationRun[]
    side_effects: []

  # --- Invoice --------------------------------------------------------------
  - method: POST
    path: "/upfront/invoices"
    description: "draft a client invoice for one billing period of the buy, billing the aired unit lines"
    roles: [AgencyController]
    code: 201
    input: [buy_id, billing_period_start, billing_period_end]
    output: Invoice
    side_effects: ["computes line_count, seller_payable_cents, agency_commission_cents, gross_billable_cents, make_good_credit_cents and net_payable_cents (§1.3 invoice_net_payable, per-line commission rounding)", "computes max_remittable_cents (§1.3 sequential_liability_release)", "client_status DRAFT, seller_status UNREMITTED"]
  - method: POST
    path: "/upfront/invoices/{invoiceId}/issue"
    description: "issue the invoice to the client, starting the payment-terms clock"
    roles: [AgencyController]
    code: 200
    input: []
    output: Invoice
    side_effects: ["client_status DRAFT -> ISSUED", "issued_at := logical clock and due_date := issued_at + Advertiser.payment_terms_days days", "cascade: Buy.settlement_status UNBILLED -> INVOICED", "Advertiser.outstanding_receivable_cents recomputed", "increments Invoice.version by 1"]
  - method: POST
    path: "/upfront/invoices/{invoiceId}/record-client-payment"
    description: "record a client payment against the issued invoice"
    roles: [AdvertiserClient]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: ["client_paid_cents increased and client_status advanced to PARTIALLY_PAID or PAID", "max_remittable_cents recomputed pro rata (§1.3 sequential_liability_release)", "late payment sets late_payment_flag, increments Advertiser.late_payment_count and moves Advertiser.credit_status ACTIVE -> WATCH -> HOLD", "cascade: Buy.settlement_status INVOICED -> CLIENT_PAID on full payment", "Advertiser.outstanding_receivable_cents recomputed", "increments Invoice.version by 1"]
  - method: POST
    path: "/upfront/invoices/{invoiceId}/remit-seller"
    description: "remit the seller payable, capped by sequential liability; the remitting controller must not be the buyer who placed the buy"
    roles: [AgencyController]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: ["seller_remitted_cents increased, approver_user_id := X-User-ID, seller_status advanced to PARTIALLY_REMITTED or REMITTED", "cascade: Buy.settlement_status CLIENT_PAID -> REMITTED, which moves a COMPLETED buy to CLOSED", "increments Invoice.version by 1"]
  - method: GET
    path: "/upfront/invoices/{invoiceId}"
    description: "read one invoice with its line rollups, credit, remittance cap and both settlement axes"
    roles: [AgencyPlanner, AgencyBuyer, AgencyController, SellerRep, AdvertiserClient, MeasurementProvider]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/upfront/invoices"
    description: "list invoices by buy and settlement status"
    roles: [AgencyPlanner, AgencyBuyer, AgencyController, SellerRep, AdvertiserClient, MeasurementProvider]
    code: 200
    input: ["buy_id?", "client_status?", "seller_status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  # --- test-driving endpoint -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server's logical clock, used to reach rights windows, air-window settlement and payment-terms deadlines deterministically. The startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads 2026-08-01T00:00:00Z and never falls back to real wall-clock time. The clock only moves forward."
    roles: [AgencyController]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["the logical clock used by every timestamp default, window check and deadline computation is set to current_utc"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # auth
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the six declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a SellerRep acts on another seller's forecast, negotiation, unit, report or make-good, or an AdvertiserClient acts on another advertiser's campaign or invoice"
  # request shape
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum value, non-positive amount, percentage outside [0.00, 100.00], or window start not before window end"
  # existence
  - id: ERR_ADVERTISER_NOT_FOUND
    http: 404
    condition: "advertiser id in the path or body does not resolve"
  - id: ERR_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "campaign id in the path or body does not resolve"
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "channel allocation id in the path or body does not resolve"
  - id: ERR_SELLER_NOT_FOUND
    http: 404
    condition: "seller id in the path or body does not resolve"
  - id: ERR_FORECAST_NOT_FOUND
    http: 404
    condition: "inventory forecast id in the path or body does not resolve"
  - id: ERR_NEGOTIATION_NOT_FOUND
    http: 404
    condition: "negotiation id in the path or body does not resolve"
  - id: ERR_BUY_NOT_FOUND
    http: 404
    condition: "buy id in the path or body does not resolve"
  - id: ERR_BUY_UNIT_NOT_FOUND
    http: 404
    condition: "buy unit id in the path does not resolve"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "delivery report id in the path does not resolve"
  - id: ERR_MAKE_GOOD_NOT_FOUND
    http: 404
    condition: "make-good id in the path does not resolve"
  - id: ERR_RIGHTS_EXERCISE_NOT_FOUND
    http: 404
    condition: "rights exercise id in the path does not resolve"
  - id: ERR_RECONCILIATION_RUN_NOT_FOUND
    http: 404
    condition: "reconciliation run id in the path does not resolve"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "invoice id in the path does not resolve"
  # optimistic concurrency
  - id: ERR_STALE_NEGOTIATION_VERSION
    http: 412
    condition: "expected_negotiation_version does not equal Negotiation.version on POST /upfront/negotiations/{negotiationId}/counter"
  - id: ERR_STALE_CAMPAIGN_VERSION
    http: 412
    condition: "expected_campaign_version does not equal Campaign.version on POST /upfront/buys/{buyId}/place"
  # state
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "the target resource is already in a terminal state of the machine the request would advance: WITHDRAWN or ACCEPTED negotiation, CLOSED or CANCELLED buy, SCHEDULED or WAIVED make-good, PAID client axis or REMITTED seller axis of an invoice. Settled units are reported with ERR_UNIT_NOT_SCHEDULED, non-SUBMITTED reports with ERR_REPORT_NOT_SUBMITTED and a fully funded campaign with ERR_CAMPAIGN_ALREADY_FUNDED"
  - id: ERR_CAMPAIGN_PLAN_NOT_IN_EXPECTED_STATE
    http: 409
    condition: "plan_status is not a declared from-state: submitting a plan that is already PENDING_CLIENT_APPROVAL or APPROVED, approving or rejecting a plan that is not PENDING_CLIENT_APPROVAL"
  - id: ERR_NEGOTIATION_NOT_IN_EXPECTED_STATE
    http: 409
    condition: "countering a negotiation that is not AGENCY_OFFER, revising or accepting one that is not SELLER_COUNTER"
  - id: ERR_BUY_NOT_IN_EXPECTED_STATE
    http: 409
    condition: "adding units to or placing a buy that is not PENDING_PLACEMENT, closing a buy that is not IN_FLIGHT or whose stewardship_status is not WITHIN_TOLERANCE or MADE_GOOD or that still has a SUBMITTED delivery report, or exercising rights on a buy that is neither PENDING_PLACEMENT nor PLACED"
  - id: ERR_UNIT_NOT_SCHEDULED
    http: 409
    condition: "settling an airing for a unit that is not SCHEDULED or MAKE_GOOD_SCHEDULED"
  - id: ERR_REPORT_NOT_SUBMITTED
    http: 409
    condition: "accepting or disputing a delivery report that is not SUBMITTED"
  - id: ERR_MAKE_GOOD_NOT_IN_EXPECTED_STATE
    http: 409
    condition: "offering against a make-good that is not OPEN, or accepting / rejecting one that is not OFFERED"
  - id: ERR_INVOICE_NOT_IN_EXPECTED_STATE
    http: 409
    condition: "issuing an invoice that is not DRAFT, recording a client payment on one that is neither ISSUED nor PARTIALLY_PAID, or remitting against one that has not been issued"
  - id: ERR_ALLOCATION_LOCKED
    http: 409
    condition: "creating a channel allocation for a campaign that already has a LOCKED allocation"
  - id: ERR_CAMPAIGN_PLAN_NOT_APPROVED
    http: 409
    condition: "accepting a seller counter while the campaign's plan_status is not APPROVED (including a plan pushed back to REVISION_REQUIRED by an overcommitment cascade)"
  - id: ERR_FORECAST_NOT_PUBLISHED
    http: 409
    condition: "buying, offering as a make-good, or accepting a make-good against an avail whose status is DRAFT or EXHAUSTED"
  - id: ERR_FORECAST_NOT_IN_EXPECTED_STATE
    http: 409
    condition: "publishing an avail whose status is not DRAFT (a second publish of the same forecast)"
  - id: ERR_PLAN_POSTURE_REPLAN_REQUIRED
    http: 409
    condition: "re-submitting a plan while Campaign.plan_posture is still REPLAN_REQUIRED"
  # temporal
  - id: ERR_RIGHTS_WINDOW_CLOSED
    http: 422
    condition: "an OPTION_ROLL at or after Buy.option_window_close, or a CANCELLATION at or after Buy.cancel_window_2_close"
  - id: ERR_AIR_WINDOW_NOT_ELAPSED
    http: 422
    condition: "settling an airing before the logical clock reaches BuyUnit.air_window_end"
  - id: ERR_REPORT_PERIOD_OUTSIDE_FLIGHT
    http: 422
    condition: "delivery report period_start after period_end, or a period falling outside the buy's flight window"
  - id: ERR_MAKE_GOOD_WINDOW_INVALID
    http: 422
    condition: "offered make-good window not contained in the offered avail's window, or starting before the logical clock"
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "setting the logical clock to an instant earlier than its current value"
  # constraints
  - id: ERR_RIGHTS_PCT_ABOVE_CEILING
    http: 422
    condition: "requested_pct plus the already-exercised cumulative exceeds the applicable ceiling: Buy.option_pct_ceiling for OPTION_ROLL, 100.00 before cancel_window_1_close and 25.00 from then until cancel_window_2_close for CANCELLATION"
  - id: ERR_ALLOCATION_PCT_SUM_INVALID
    http: 422
    condition: "plan submitted with no allocations or with an allocation_pct sum other than exactly 100.00, or a new allocation would push the sum above 100.00"
  - id: ERR_NEGOTIATION_ROUND_CAP_REACHED
    http: 409
    condition: "a counter or revision would take round_number above MAX_NEGOTIATION_ROUNDS (6)"
  - id: ERR_MAKE_GOOD_OFFER_CAP_REACHED
    http: 409
    condition: "a make-good offer would take offer_round above MAX_MAKE_GOOD_OFFERS (3)"
  - id: ERR_MAKE_GOOD_OFFER_INSUFFICIENT
    http: 422
    condition: "offered_impressions below the make-good's frozen shortfall_impressions"
  - id: ERR_MAKE_GOOD_NOT_PERMITTED
    http: 409
    condition: "offering or waiving a make-good on a buy whose make_good_provision is NONE"
  - id: ERR_EXCLUSIVE_AVAIL_CONFLICT
    http: 409
    condition: "a unit's air window overlaps another buy's unit on the same EXCLUSIVE avail; the interval is half-open so touching at a boundary is not a conflict"
  # referential
  - id: ERR_UNIT_FORECAST_MISMATCH
    http: 422
    condition: "the avail belongs to another seller, another market, an incompatible platform, or a window outside the buy's flight window"
  - id: ERR_ALLOCATION_CAMPAIGN_MISMATCH
    http: 422
    condition: "the channel allocation belongs to another campaign or carries a different channel than the negotiation"
  - id: ERR_NO_BILLABLE_LINES
    http: 422
    condition: "the invoice billing period contains no AIRED or MAKE_GOOD_AIRED unit of the buy"
  # safety
  - id: ERR_ADVERTISER_CREDIT_HOLD
    http: 403
    condition: "plan submission, plan approval or negotiation acceptance for an advertiser whose credit_status is HOLD"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the X-User-ID remitting to the seller equals Buy.placed_by_user_id"
  - id: ERR_CATEGORY_SEPARATION_CONFLICT
    http: 409
    condition: "placing a buy whose flight window touches or overlaps the 7-day-buffered flight window of an already-placed buy on the same seller belonging to a different advertiser with the same category_code"
  # fiscal
  - id: ERR_FORECAST_AVAIL_EXCEEDED
    http: 409
    condition: "requested impressions exceed the avail's remaining available_impressions"
  - id: ERR_MAKE_GOOD_CAPACITY_EXCEEDED
    http: 409
    condition: "offered_impressions exceed the seller's remaining make-good capacity"
  - id: ERR_UNIT_COVERAGE_SHORT
    http: 409
    condition: "scheduled unit projections do not cover the buy's guaranteed impressions at placement"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 409
    condition: "approving a plan while the advertiser's outstanding receivable exceeds its credit limit"
  - id: ERR_CAMPAIGN_BUDGET_EXCEEDED
    http: 409
    condition: "placement would push Campaign.committed_gross_cents above Campaign.total_budget_cents"
  - id: ERR_CAMPAIGN_ALREADY_FUNDED
    http: 409
    condition: "funding a campaign whose funding_status is already FUNDED"
  - id: ERR_CAMPAIGN_FUNDING_INSUFFICIENT
    http: 409
    condition: "issuing an invoice whose net payable is not covered by the campaign's funded amount net of already-issued invoices"
  - id: ERR_PAYMENT_EXCEEDS_INVOICE
    http: 422
    condition: "a client payment would take client_paid_cents above net_payable_cents"
  - id: ERR_SEQUENTIAL_LIABILITY_EXCEEDED
    http: 422
    condition: "a remittance would take seller_remitted_cents above max_remittable_cents or above seller_payable_cents"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix. Segregation of duties: the buyer who places a buy is an
# AgencyBuyer, while remittance is an AgencyController operation and the
# remitting X-User-ID must differ from Buy.placed_by_user_id.
# ---------------------------------------------------------------------------
roles:
  - name: AgencyPlanner
    description: "translates the brand objective into reach, frequency and budget allocation across channels"
    identity: opaque
    exclusive_operations:
      - "POST /upfront/campaigns"
      - "POST /upfront/channel-allocations"
      - "POST /upfront/campaigns/{campaignId}/submit-plan"
    shared_operations:
      - "POST /upfront/reconciliation-runs (with AgencyController)"
      - "every GET under /upfront"
  - name: AgencyBuyer
    description: "negotiates CPM, guarantees and make-good provisions, places buys and stewards delivery"
    identity: opaque
    exclusive_operations:
      - "POST /upfront/negotiations"
      - "POST /upfront/negotiations/{negotiationId}/revise"
      - "POST /upfront/negotiations/{negotiationId}/accept"
      - "POST /upfront/negotiations/{negotiationId}/withdraw"
      - "POST /upfront/buys/{buyId}/units"
      - "POST /upfront/buys/{buyId}/place"
      - "POST /upfront/delivery-reports/{deliveryReportId}/accept"
      - "POST /upfront/delivery-reports/{deliveryReportId}/dispute"
      - "POST /upfront/make-goods/{makeGoodId}/accept"
      - "POST /upfront/make-goods/{makeGoodId}/reject"
      - "POST /upfront/rights-exercises"
    shared_operations:
      - "every GET under /upfront"
  - name: AgencyController
    description: "agency finance and compliance: counterparty setup, buy closeout, make-good waivers, client billing and seller remittance"
    identity: opaque
    exclusive_operations:
      - "POST /upfront/advertisers"
      - "POST /upfront/sellers"
      - "POST /upfront/buys/{buyId}/close"
      - "POST /upfront/make-goods/{makeGoodId}/waive"
      - "POST /upfront/invoices"
      - "POST /upfront/invoices/{invoiceId}/issue"
      - "POST /upfront/invoices/{invoiceId}/remit-seller"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /upfront/reconciliation-runs (with AgencyPlanner)"
      - "every GET under /upfront"
  - name: SellerRep
    description: "seller-side representative: files and publishes avails, counters agency offers, settles airings, files delivery and offers make-goods"
    identity: "entity_backed:Seller"
    exclusive_operations:
      - "POST /upfront/inventory-forecasts"
      - "POST /upfront/inventory-forecasts/{forecastId}/publish"
      - "POST /upfront/negotiations/{negotiationId}/counter"
      - "POST /upfront/buy-units/{buyUnitId}/settle-airing"
      - "POST /upfront/make-goods/{makeGoodId}/offer"
    shared_operations:
      - "POST /upfront/delivery-reports (with MeasurementProvider)"
      - "every GET under /upfront"
  - name: AdvertiserClient
    description: "brand-side approver and payer: approves or rejects the plan, funds the campaign and pays invoices"
    identity: "entity_backed:Advertiser"
    exclusive_operations:
      - "POST /upfront/campaigns/{campaignId}/approve-plan"
      - "POST /upfront/campaigns/{campaignId}/reject-plan"
      - "POST /upfront/campaigns/{campaignId}/fund"
      - "POST /upfront/invoices/{invoiceId}/record-client-payment"
    shared_operations:
      - "every GET under /upfront"
  - name: MeasurementProvider
    description: "third-party cross-platform measurement vendor that files audited delivery for a buy; an operational identity, not a seller"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /upfront/delivery-reports (with SellerRep)"
      - "every GET under /upfront"
