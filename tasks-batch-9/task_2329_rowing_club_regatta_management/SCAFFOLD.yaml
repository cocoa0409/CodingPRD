    path: "/boathouse/trailer-loads/{id}/rack-assignments"
    description: "Claim a contiguous run of rack units for an entry's hull under optimistic concurrency on the load's version"
    roles: [EquipmentManager]
    code: 200
    input: [regatta_entry_id, expected_trailer_load_version]
    output: TrailerLoad
    side_effects: ["RegattaEntry.rack_tier, rack_position and trailer_load_id set by calculations.trailer_rack_allocation", "rack_units_used and rack_units_free recomputed", "increments TrailerLoad.version by 1"]
  - method: POST
    path: "/boathouse/trailer-loads/{id}/rack-releases"
    description: "Release an entry's rack units back to the trailer under optimistic concurrency on the load's version"
    roles: [EquipmentManager]
    code: 200
    input: [regatta_entry_id, expected_trailer_load_version]
    output: TrailerLoad
    side_effects: ["RegattaEntry.rack_tier, rack_position and trailer_load_id reset to null", "rack_units_used and rack_units_free recomputed", "increments TrailerLoad.version by 1"]
  - method: POST
    path: "/boathouse/trailer-loads/{id}/transitions"
    description: "Drive a trailer load through SEALED, OPEN (unseal), DEPARTED, ARRIVED and RETURNED"
    roles: [EquipmentManager]
    code: 200
    input: [to_status]
    output: TrailerLoad
    side_effects: ["SEALED freezes rack assignments and releases", "DEPARTED makes transport_levy_cents non-refundable on scratch", "RETURNED releases every rack unit"]

errors:
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID header absent, or X-User-Role is not a declared role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role is not listed in the called endpoint's roles, or an entity_backed role's X-User-ID does not resolve to a Member"
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "a member id in the path or body does not exist"
  - id: ERR_DUES_INVOICE_NOT_FOUND
    http: 404
    condition: "a dues invoice id in the path does not exist"
  - id: ERR_SHELL_NOT_FOUND
    http: 404
    condition: "a shell id in the path or body does not exist"
  - id: ERR_DAMAGE_REPORT_NOT_FOUND
    http: 404
    condition: "a damage report id in the path does not exist"
  - id: ERR_READING_NOT_FOUND
    http: 404
    condition: "a water condition reading id in the path or body does not exist"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "a water session id in the path does not exist"
  - id: ERR_REGATTA_NOT_FOUND
    http: 404
    condition: "a regatta id in the path or body does not exist"
  - id: ERR_ENTRY_NOT_FOUND
    http: 404
    condition: "a regatta entry id in the path or body does not exist"
  - id: ERR_SEAT_NOT_FOUND
    http: 404
    condition: "a lineup seat id in the path does not exist"
  - id: ERR_HEAT_NOT_FOUND
    http: 404
    condition: "a heat id in the path or body does not exist"
  - id: ERR_LANE_NOT_FOUND
    http: 404
