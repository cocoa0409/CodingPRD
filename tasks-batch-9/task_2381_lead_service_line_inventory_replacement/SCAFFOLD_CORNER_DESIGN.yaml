              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
            - call: "POST /lsl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
          assert:
            - "The first call returns HTTP 422 with ${err} == ERR_CLOCK_NOT_MONOTONIC"
            - "The second call returns HTTP 200 with data.current_utc == 2026-08-01T00:00:00Z and data.previous_utc == 2026-08-01T00:00:00Z"

