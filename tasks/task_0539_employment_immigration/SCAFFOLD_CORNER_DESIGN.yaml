              as_user_id: "${emp_id}"
              captures: { ben_id: $.data.id }
            - call: "POST /lcas"
              payload: { employer_id: "${emp_id}", soc_code: "15-1252", worksite_areas: ["AREA_A"], area_wage_map: { AREA_A: 10000000 }, offered_wage_cents: 12000000, prevailing_wage_cents: 10000000, validity_start: "2026-05-01T00:00:00Z", validity_end: "2030-05-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { lca_id: $.data.id }
            - call: "POST /lcas/${lca_id}/transitions"
              payload: { to_status: "CERTIFIED" }
              as: DOLAnalyst
            - call: "POST /cap-programs"
              payload: { fiscal_year: 2027, selection_quota: 5 }
              as: USCISOfficer
              captures: { cap_id: $.data.id }
            - call: "POST /h1b-registrations"
              payload: { employer_id: "${emp_id}", beneficiary_id: "${ben_id}", fiscal_year: 2027 }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /cap-programs/${cap_id}/run-lottery"
              as: USCISOfficer
            - call: "POST /h1b-petitions"
              payload: { employer_id: "${emp_id}", lca_id: "${lca_id}", beneficiary_id: "${ben_id}", registration_id: "${reg_id}", worksite_area: "AREA_A", employment_start: "2026-10-01T00:00:00Z", employment_end: "2029-10-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /h1b-petitions/${pet_id}/transitions"
              payload: { to_status: "SUBMITTED" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
            - call: "POST /h1b-petitions/${pet_id}/transitions"
              payload: { to_status: "RFE_ISSUED" }
              as: USCISOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-27T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /h1b-petitions/${pet_id}/transitions"
              payload: { to_status: "SUBMITTED" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { st: $.data.status, rfe: $.data.rfe_status }
          assert:
            - "H1BPetition.${pet_id}.status == SUBMITTED"
            - "H1BPetition.${pet_id}.rfe_status == RESPONDED"

