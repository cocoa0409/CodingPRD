  - rule_id: boundary_precision_check
    instances:

      - name: catchweight_tolerance_upper_bound_inclusive
        grounds:
          - calculations.order_line_catchweight_price
          - validations[priority=16]
          - errors.ERR_WEIGHT_OUT_OF_TOLERANCE
          - entities.InventorySku.fields.weight_tolerance_pct
        distinguishing_aspect: |
          Two picks straddle the tolerance bound by exactly one gram against a 1000 g nominal total
          and a 0.05 tolerance: 1050 g is a deviation ratio of exactly 0.05 and is ACCEPTED (final
          price 1313 from round_half_up(1250 * 1050 / 1000) = round_half_up(1312.5)), while 1051 g
          is 0.051 and is REJECTED with ERR_WEIGHT_OUT_OF_TOLERANCE. An implementation using `>=`
          instead of `>` rejects the 1050 g pick; one that pre-rounds the ratio accepts the 1051 g pick.
        test_recipe:
