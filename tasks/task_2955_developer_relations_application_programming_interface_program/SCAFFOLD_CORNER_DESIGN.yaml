          A product can have sustained capacity left while its monthly call pool is spent, and
          the provisioning formula reaches the two checks at different steps — so the second
          developer must be refused with ERR_MONTHLY_POOL_EXHAUSTED even though the sustained
          clamp would have succeeded, and the whole call must roll back rather than leave the
          sustained deduction behind. Once the monthly pool is topped up, the same developer is
          provisioned at the CLAMPED 750 rpm, which drains the sustained pool and makes the
          third developer fail earlier, at priority 55.
