      - name: obligation_windows_treat_the_deadline_day_as_inside_the_interval
        claim_type: interval_merge
        grounds:
          - calculations.lease_obligation_deadlines
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: boundary_precision_check / primary_term_expiry_is_inclusive_on_the_deadline_day
          rationale: |
            The interval_merge edge for lease_obligation_deadlines is entirely about whether the
            computed primary_term_end_date / shut_in_next_due_date / continuous_dev_deadline_date
            endpoints are inside or outside their window. The §1.8 boundary_precision_check instance
            already drives the obligation run at clock == deadline (lease stays ACTIVE) and at
            deadline + 1 day (lease flips EXPIRED), which is the only observable behaviour this row
            would restate.

      - name: the_committed_acre_running_total_survives_an_allocation_withdrawal
        claim_type: aggregation
        grounds:
          - calculations.unit_allocation_factor
          - entities.Well.fields.allocation_factor_total
        excluded_because:
          difficulty_instance: transitive_cascade / lease_expiry_cascades_four_hops_into_suspended_disbursements
          rationale: |
            "Correct after reversal" for the aggregation algorithm means the factors and
            allocation_factor_total re-normalise when a committed allocation leaves the pool. The
            §1.8 transitive_cascade instance withdraws an allocation as hop 2 of the expiry cascade
            and asserts the surviving allocation's factor returns to 1.000000 with
            allocation_factor_total 1.000000, which is exactly the reversal assertion.

      - name: the_overhead_rate_class_picks_the_tier_and_the_clamps_bound_it
        claim_type: tiered_pricing
        grounds:
          - calculations.overhead_charge
          - entities.JibStatement.fields.overhead_rate_class
        excluded_because:
          difficulty_instance: combinatorial_formula / overhead_branch_selection_with_cap_and_floor_clamps
          rationale: |
            The tier boundaries of overhead_charge are the PERCENTAGE_BASIS cap and floor and the
            FIXED_RATE per-month rate. The §1.8 combinatorial_formula instance walks the
            rate-class x activity-class matrix and lands one statement on the cap and one on the
            floor, so every tier boundary is already exercised there.

      - name: the_consent_tally_threshold_decides_whether_the_afe_can_close
        claim_type: threshold
        grounds:
          - calculations.afe_consent_tally
          - entities.Afe.fields.minimum_consent_pct
        excluded_because:
          difficulty_instance: boundary_precision_check / minimum_consent_threshold_is_inclusive_at_closure
          rationale: |
            afe_consent_tally is the scaffold's threshold calculation, and the threshold-1 /
            threshold / threshold+1 sweep is the entire content of the §1.8
            boundary_precision_check instance, which closes an AFE at consent exactly equal to
            minimum_consent_pct and rejects the same closure one basis point below.

      - name: cutting_a_non_consenting_holder_propagates_through_the_interest_chain
        claim_type: constraint_propagation
        grounds:
          - calculations.non_consent_reallocation
          - entities.WellInterest.fields.non_consent_recoverable_balance_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / non_consent_reallocation_pinned_dependency_cut
          rationale: |
            Propagation-through-the-chain and reaching a fixed point are the declared subject of the
            §1.8 combinatorial_formula instance, which pins one non-consenting holder, recomputes
            the consenting holders' billing shares from the reduced denominator and shows the second
            pass changes nothing further.

      - name: each_owner_bucket_fills_in_a_fixed_order_before_the_remainder_moves
        claim_type: waterfall_allocation
        grounds:
          - calculations.jib_owner_share_rounding
          - calculations.revenue_distribution_waterfall
        excluded_because:
          difficulty_instance: combinatorial_formula / owner_share_rounding_signed_residual_per_bucket_in_fixed_order
          rationale: |
            Both waterfall_allocation calculations share one observable rule: buckets are filled in
            interest-descending, created_at-ascending order and the signed remainder lands on the
            first bucket. The §1.8 combinatorial_formula instance asserts the per-bucket cents and
            the residual placement for both a positive and a negative remainder, so a separate
            corner instance would repeat those exact numbers.

      - name: late_interest_accrues_from_the_correct_anchor_date
        claim_type: decay_function
        grounds:
          - calculations.statutory_late_interest
          - entities.ProductionRevenue.fields.statutory_due_date
        excluded_because:
          difficulty_instance: dual_variant_calc / statutory_interest_from_due_date_versus_from_proceeds_receipt
          rationale: |
            The decay curve here is simple daily interest whose only interesting behaviour is where
            the curve starts. The §1.8 dual_variant_calc instance pays the same disbursement late
            under both anchors and asserts the two interest amounts and their delta, covering the
            "applied at correct intervals" and "reset restarts the curve" claims.

      - name: identical_cost_history_bills_differently_under_the_two_cost_bases
        claim_type: variant_divergence
        grounds:
          - calculations.jib_direct_cost_pool
          - entities.JibStatement.fields.cost_basis
        excluded_because:
          difficulty_instance: dual_variant_calc / jib_cost_basis_accrual_versus_cash_on_identical_cost_history
          rationale: |
            This row asks for two statements over one cost history with cost_basis ACCRUAL vs CASH
            and a verified delta. The §1.8 dual_variant_calc instance is that test verbatim,
            including the direct_cost_cents, overhead_cents and total_billed_cents of both variants
            and the cents delta between them.

      - name: the_disbursement_context_selects_the_interest_variant
        claim_type: variant_selection
        grounds:
          - calculations.statutory_late_interest
          - entities.OwnerDisbursement.fields.interest_basis
        excluded_because:
          difficulty_instance: dual_variant_calc / statutory_interest_from_due_date_versus_from_proceeds_receipt
          rationale: |
            Variant selection for statutory_late_interest is driven by the disbursement's suspense
            history (a row ever suspended for MISSING_TAX_ID accrues FROM_PROCEEDS_RECEIPT) unless the
            payment call passes interest_basis explicitly. The §1.8 instance pays one disbursement in
            each configuration and asserts the interest_basis each one recorded, so the selection claim
            is already pinned.

      - name: switching_a_statement_to_its_revision_reconciles_the_ledger_delta
        claim_type: reconciliation
        grounds:
          - calculations.jib_direct_cost_pool
          - entities.Well.fields.billed_to_date_cents
        excluded_because:
          difficulty_instance: compensating_invariant / statement_revision_reverses_the_billed_ledger_without_drift
          rationale: |
            Reconciliation on a variant switch is observable here only as the well's
            billed_to_date_cents moving by exactly the difference between the superseded and the
            superseding statement. The §1.8 compensating_invariant instance asserts that delta and
            that the ledger returns to its pre-revision value when the revision is voided.

  # ============================================================================
  # Section 4 - Validations (claim-extraction-guide "From Table 4")
  # ============================================================================
  - section: validations
    instances:
      - name: net_revenue_interest_above_working_interest_is_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=70, error_id=ERR_NRI_EXCEEDS_WI]"
          - errors.ERR_NRI_EXCEEDS_WI
          - entities.WellInterest.fields.net_revenue_interest_pct
        distinguishing_aspect: |
          The single-row sanity rule fires on its own: a working interest of 0.300000 carrying a net
          revenue interest of 0.400000 returns ERR_NRI_EXCEEDS_WI (422) even though the working
          interest total would still be far below 1.000000, and no WellInterest row is written.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z"
            - "Well Sandstone 1H, OIL, 9500 ft, with no interests yet"
            - "Interest owner Delta Partners LP"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/wells"
              payload: { well_name: "Sandstone 1H", api_number: "42-123-45678", product_type: "OIL", total_depth_ft: 9500 }
              as: LandAdministrator
              captures: { well_id: $.data.id }
            - call: "POST /land-admin/interest-owners"
              payload: { owner_name: "Delta Partners LP", owner_type: "WORKING_INTEREST_PARTNER", contact_email: "delta@example.com", tax_id_on_file: true, bond_posted_cents: 10000000 }
              as: LandAdministrator
              captures: { oa_id: $.data.id }
            - call: "GET /land-admin/wells/${well_id}"
              payload: {}
              as: LandAdministrator
              captures: { wv1: $.data.version }
          trigger:
            - call: "POST /land-admin/wells/${well_id}/interests"
              payload: { owner_id: "${oa_id}", working_interest_pct: 0.300000, net_revenue_interest_pct: 0.400000, effective_from: "2026-01-01", expected_well_version: "${wv1}" }
              as: LandAdministrator
          assert:
            - "HTTP 422 with error_id ERR_NRI_EXCEEDS_WI"
            - "GET /land-admin/wells/${well_id}/interests returns total_count == 0"
            - "Well.${well_id}.version == ${wv1} - the rejected write did not bump the OCC parent"
            - "InterestOwner.${oa_id}.required_bond_cents == 0"

      - name: an_interest_row_completing_exactly_one_hundred_percent_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - "validations[priority=70, error_id=ERR_WI_SUM_EXCEEDED]"
          - entities.Well.fields.consent_working_interest_pct
          - endpoints.POST_/land-admin/wells/{well_id}/interests
        distinguishing_aspect: |
          The aggregate rule bounds the ACTIVE working-interest total at 1.000000 inclusive, so the
          third interest that brings 0.800000 to exactly 1.000000 is accepted (201) and
          consent_working_interest_pct becomes 1.000000 - the rule only rejects a total strictly
          greater than one.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z"
            - "Well Sandstone 1H, OIL, 9500 ft"
            - "Owners OP (operator), OA and OB created in that order"
            - "OP holds working interest 0.500000 / NRI 0.412500 and OA holds 0.300000 / 0.240000, both ACTIVE from 2026-01-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/wells"
              payload: { well_name: "Sandstone 1H", api_number: "42-123-45678", product_type: "OIL", total_depth_ft: 9500 }
              as: LandAdministrator
              captures: { well_id: $.data.id }
            - call: "POST /land-admin/interest-owners"
              payload: { owner_name: "Operator Energy LLC", owner_type: "WORKING_INTEREST_PARTNER", contact_email: "op@example.com", tax_id_on_file: true, bond_posted_cents: 50000000 }
              as: LandAdministrator
              captures: { op_id: $.data.id }
            - call: "POST /land-admin/interest-owners"
              payload: { owner_name: "Delta Partners LP", owner_type: "WORKING_INTEREST_PARTNER", contact_email: "delta@example.com", tax_id_on_file: true, bond_posted_cents: 10000000 }
              as: LandAdministrator
              captures: { oa_id: $.data.id }
            - call: "POST /land-admin/interest-owners"
              payload: { owner_name: "Epsilon Resources Inc", owner_type: "WORKING_INTEREST_PARTNER", contact_email: "epsilon@example.com", tax_id_on_file: true, bond_posted_cents: 0 }
              as: LandAdministrator
              captures: { ob_id: $.data.id }
            - call: "GET /land-admin/wells/${well_id}"
              payload: {}
              as: LandAdministrator
              captures: { wv1: $.data.version }
            - call: "POST /land-admin/wells/${well_id}/interests"
              payload: { owner_id: "${op_id}", working_interest_pct: 0.500000, net_revenue_interest_pct: 0.412500, effective_from: "2026-01-01", expected_well_version: "${wv1}", is_operator: true, preferential_right: true }
              as: LandAdministrator
            - call: "GET /land-admin/wells/${well_id}"
              payload: {}
              as: LandAdministrator
              captures: { wv2: $.data.version }
            - call: "POST /land-admin/wells/${well_id}/interests"
              payload: { owner_id: "${oa_id}", working_interest_pct: 0.300000, net_revenue_interest_pct: 0.240000, effective_from: "2026-01-01", expected_well_version: "${wv2}", is_operator: false, preferential_right: true }
              as: LandAdministrator
            - call: "GET /land-admin/wells/${well_id}"
              payload: {}
              as: LandAdministrator
              captures: { wv3: $.data.version }
          trigger:
            - call: "POST /land-admin/wells/${well_id}/interests"
              payload: { owner_id: "${ob_id}", working_interest_pct: 0.200000, net_revenue_interest_pct: 0.150000, effective_from: "2026-01-01", expected_well_version: "${wv3}", is_operator: false, preferential_right: false }
              as: LandAdministrator
              captures: { wi_ob_id: $.data.id }
          assert:
            - "HTTP 201"
            - "WellInterest.${wi_ob_id}.interest_status == ACTIVE and non_consent_flag == false"
            - "Well.${well_id}.consent_working_interest_pct == 1.000000"
            - "GET /land-admin/wells/${well_id}/interests returns total_count == 3"

      - name: an_allocation_exceeding_the_leases_remaining_acres_is_rejected
        claim_type: aggregate
        grounds:
          - "validations[priority=70, error_id=ERR_ALLOCATION_EXCEEDS_LEASE]"
          - errors.ERR_ALLOCATION_EXCEEDS_LEASE
          - entities.Lease.fields.committed_acres_total
        distinguishing_aspect: |
          Each commitment is individually legal against the 640.00-acre lease - 480.00 on the first
          well and 200.00 on the second - but their sum 680.00 exceeds the lease, so the second one
          returns ERR_ALLOCATION_EXCEEDS_LEASE (422) and committed_acres_total stays 480.00.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z"
            - "Lease L-001, 640.00 gross acres, PRIMARY_TERM until 2026-09-30"
            - "Wells Sandstone 1H and Sandstone 2H, both PROPOSED"
            - "480.00 acres of L-001 already committed to Sandstone 1H"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-001", lessor_name: "Alpha Minerals", gross_acres: 640.00, royalty_rate: 0.187500, primary_term_end_date: "2026-09-30" }
              as: LandAdministrator
              captures: { lease1_id: $.data.id }
            - call: "POST /land-admin/wells"
              payload: { well_name: "Sandstone 1H", api_number: "42-123-45678", product_type: "OIL", total_depth_ft: 9500 }
              as: LandAdministrator
              captures: { well1_id: $.data.id }
            - call: "POST /land-admin/wells"
              payload: { well_name: "Sandstone 2H", api_number: "42-123-45679", product_type: "OIL", total_depth_ft: 9000 }
              as: LandAdministrator
              captures: { well2_id: $.data.id }
            - call: "POST /land-admin/wells/${well1_id}/lease-allocations"
              payload: { lease_id: "${lease1_id}", committed_acres: 480.00 }
              as: LandAdministrator
              captures: { alloc1_id: $.data.id }
          trigger:
            - call: "POST /land-admin/wells/${well2_id}/lease-allocations"
              payload: { lease_id: "${lease1_id}", committed_acres: 200.00 }
              as: LandAdministrator
          assert:
            - "HTTP 422 with error_id ERR_ALLOCATION_EXCEEDS_LEASE"
            - "Lease.${lease1_id}.committed_acres_total == 480.00 and held_acres == 480.00"
            - "Well.${well2_id}.allocation_factor_total == 0.000000"
            - "A retry with committed_acres 160.00 succeeds and takes committed_acres_total to 640.00"

      - name: body_lease_existence_is_checked_before_the_acreage_aggregate
        claim_type: cascading
        grounds:
          - "validations[priority=35, error_id=ERR_LEASE_NOT_FOUND]"
          - "validations[priority=70, error_id=ERR_ALLOCATION_EXCEEDS_LEASE]"
          - errors.ERR_LEASE_NOT_FOUND
        distinguishing_aspect: |
          The acreage aggregate cannot be evaluated without a lease to aggregate over, so an unknown
          body lease_id combined with an absurd 9999.00 committed_acres returns ERR_LEASE_NOT_FOUND
          (404) from priority 35 rather than ERR_ALLOCATION_EXCEEDS_LEASE from priority 70.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z"
            - "Well Sandstone 1H, PROPOSED, with no allocations"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/wells"
              payload: { well_name: "Sandstone 1H", api_number: "42-123-45678", product_type: "OIL", total_depth_ft: 9500 }
              as: LandAdministrator
              captures: { well_id: $.data.id }
          trigger:
            - call: "POST /land-admin/wells/${well_id}/lease-allocations"
              payload: { lease_id: "00000000-0000-0000-0000-0000000000ff", committed_acres: 9999.00 }
              as: LandAdministrator
          assert:
            - "HTTP 404 with error_id ERR_LEASE_NOT_FOUND"
            - "the response error_id is not ERR_ALLOCATION_EXCEEDS_LEASE"
            - "Well.${well_id}.allocation_factor_total == 0.000000"

      - name: an_election_filed_after_the_deadline_day_is_rejected
        claim_type: temporal
        grounds:
          - "validations[priority=60, error_id=ERR_ELECTION_DEADLINE_PASSED]"
          - errors.ERR_ELECTION_DEADLINE_PASSED
          - entities.Afe.fields.election_deadline_date
        distinguishing_aspect: |
          The AFE is still ELECTIONS_OPEN and the electing owner still holds an ACTIVE interest, so
          the only failing condition is the calendar: with the logical clock advanced to 2026-08-01
          and election_deadline_date 2026-07-31 the election returns ERR_ELECTION_DEADLINE_PASSED
          (422) instead of the priority-50 ERR_AFE_ELECTIONS_CLOSED.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z, later advanced to 2026-08-01T00:00:00Z"
            - "Leases L-001 (640.00 gross acres, royalty 0.187500, primary term ending 2026-09-30) and L-002 (320.00 gross acres, royalty 0.250000, primary term ending 2027-12-31)"
            - "Well Sandstone 1H, OIL, 9500 ft, with 480.00 acres committed from L-001 and 160.00 from L-002 (allocation factors 0.750000 / 0.250000), well_status PRODUCING, pooling_status POOLED_EFFECTIVE"
            - "Four interest owners: OP (operator, WI 0.500000, NRI 0.412500, preferential_right true, bond 50000000), OA (WI 0.300000, NRI 0.240000, preferential_right true, bond 10000000), OB (WI 0.200000, NRI 0.150000, preferential_right false, bond 0), OC (Gamma Operating LP, bond 20000000, holds no interest in this well)"
            - "AFE AFE-001 on the well, cost_class CAPITAL, election_deadline_date 2026-07-31, still ELECTIONS_OPEN with no elections filed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-001", lessor_name: "Alpha Minerals", gross_acres: 640.00, royalty_rate: 0.187500, primary_term_end_date: "2026-09-30", extension_option_months: 24, extension_bonus_per_acre_cents: 15000, shut_in_royalty_per_acre_cents: 500, continuous_dev_window_days: 180 }
              as: LandAdministrator
              captures: { lease1_id: $.data.id }
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-002", lessor_name: "Beta Royalties", gross_acres: 320.00, royalty_rate: 0.250000, primary_term_end_date: "2027-12-31", extension_option_months: 12, extension_bonus_per_acre_cents: 12000, shut_in_royalty_per_acre_cents: 400, continuous_dev_window_days: 180 }
              as: LandAdministrator
              captures: { lease2_id: $.data.id }
            - call: "POST /land-admin/wells"
              payload: { well_name: "Sandstone 1H", api_number: "42-123-45678", product_type: "OIL", total_depth_ft: 9500, spud_date: "2026-02-10" }
              as: LandAdministrator
              captures: { well_id: $.data.id }
            - call: "POST /land-admin/wells/${well_id}/lease-allocations"
              payload: { lease_id: "${lease1_id}", committed_acres: 480.00 }
              as: LandAdministrator
              captures: { alloc1_id: $.data.id }
            - call: "POST /land-admin/wells/${well_id}/lease-allocations"
              payload: { lease_id: "${lease2_id}", committed_acres: 160.00 }
              as: LandAdministrator
              captures: { alloc2_id: $.data.id }
            - call: "POST /land-admin/interest-owners"
              payload: { owner_name: "Operator Energy LLC", owner_type: "WORKING_INTEREST_PARTNER", contact_email: "op@example.com", tax_id_on_file: true, bond_posted_cents: 50000000 }
              as: LandAdministrator
              captures: { op_id: $.data.id }
            - call: "POST /land-admin/interest-owners"
              payload: { owner_name: "Delta Partners LP", owner_type: "WORKING_INTEREST_PARTNER", contact_email: "delta@example.com", tax_id_on_file: true, bond_posted_cents: 10000000 }
              as: LandAdministrator
              captures: { oa_id: $.data.id }
            - call: "POST /land-admin/interest-owners"
              payload: { owner_name: "Epsilon Resources Inc", owner_type: "WORKING_INTEREST_PARTNER", contact_email: "epsilon@example.com", tax_id_on_file: true, bond_posted_cents: 0 }
              as: LandAdministrator
              captures: { ob_id: $.data.id }
            - call: "POST /land-admin/interest-owners"
              payload: { owner_name: "Gamma Operating LP", owner_type: "WORKING_INTEREST_PARTNER", contact_email: "gamma@example.com", tax_id_on_file: true, bond_posted_cents: 20000000 }
              as: LandAdministrator
              captures: { oc_id: $.data.id }
            - call: "GET /land-admin/wells/${well_id}"
              payload: {}
              as: LandAdministrator
              captures: { wv1: $.data.version }
            - call: "POST /land-admin/wells/${well_id}/interests"
              payload: { owner_id: "${op_id}", working_interest_pct: 0.500000, net_revenue_interest_pct: 0.412500, effective_from: "2026-01-01", expected_well_version: "${wv1}", is_operator: true, preferential_right: true }
              as: LandAdministrator
              captures: { wi_op_id: $.data.id }
            - call: "GET /land-admin/wells/${well_id}"
              payload: {}
              as: LandAdministrator
              captures: { wv2: $.data.version }
            - call: "POST /land-admin/wells/${well_id}/interests"
              payload: { owner_id: "${oa_id}", working_interest_pct: 0.300000, net_revenue_interest_pct: 0.240000, effective_from: "2026-01-01", expected_well_version: "${wv2}", is_operator: false, preferential_right: true }
              as: LandAdministrator
              captures: { wi_oa_id: $.data.id }
            - call: "GET /land-admin/wells/${well_id}"
              payload: {}
              as: LandAdministrator
              captures: { wv3: $.data.version }
            - call: "POST /land-admin/wells/${well_id}/interests"
              payload: { owner_id: "${ob_id}", working_interest_pct: 0.200000, net_revenue_interest_pct: 0.150000, effective_from: "2026-01-01", expected_well_version: "${wv3}", is_operator: false, preferential_right: false }
              as: LandAdministrator
              captures: { wi_ob_id: $.data.id }
            - call: "POST /land-admin/wells/${well_id}/pooling-effectuation"
              payload: { effective_date: "2026-04-01" }
              as: LandAdministrator
            - call: "POST /land-admin/wells/${well_id}/status-changes"
              payload: { to_status: "DRILLING", effective_date: "2026-02-10" }
              as: LandAdministrator
            - call: "POST /land-admin/wells/${well_id}/status-changes"
              payload: { to_status: "PRODUCING", effective_date: "2026-04-01" }
              as: LandAdministrator
            - call: "POST /land-admin/wells/${well_id}/afes"
              payload: { afe_number: "AFE-001", operation_type: "COMPLETION", estimated_cost_cents: 2000000, cost_class: "CAPITAL", election_deadline_date: "2026-07-31", non_consent_penalty_multiple: 3.0, minimum_consent_pct: 0.500000 }
              as: LandAdministrator
              captures: { afe_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LandAdministrator
          trigger:
            - call: "POST /land-admin/afes/${afe_id}/elections"
              payload: { owner_id: "${oa_id}", election_type: "CONSENT" }
              as: LandAdministrator
          assert:
            - "HTTP 422 with error_id ERR_ELECTION_DEADLINE_PASSED"
            - "Afe.${afe_id}.afe_status == ELECTIONS_OPEN - the deadline does not close the AFE by itself"
            - "GET /land-admin/afes/${afe_id}/elections returns total_count == 0"
            - "a POST /land-admin/afes/${afe_id}/election-closures now succeeds, because the passed deadline satisfies the closure precondition"

      - name: extending_a_lease_configured_without_an_option_is_rejected
        claim_type: conditional
        grounds:
          - "validations[priority=50, error_id=ERR_EXTENSION_NOT_AVAILABLE]"
          - entities.Lease.fields.extension_option_months
          - state_machines.Lease.PRIMARY_TERM_to_PRIMARY_TERM
        distinguishing_aspect: |
          The extension rule is conditional on configuration: the same call that succeeds on L-001
          (extension_option_months 24) returns ERR_EXTENSION_NOT_AVAILABLE (409) on L-003, which
          took the declared default extension_option_months 0, and the bonus-mismatch rule at
          priority 75 never gets a chance to run.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z"
            - "Lease L-001, 640.00 acres, extension_option_months 24, extension_bonus_per_acre_cents 15000, PRIMARY_TERM until 2026-09-30, already extended to 2028-09-30 for 9600000 cents"
            - "Lease L-003, 160.00 acres, no extension option fields supplied, PRIMARY_TERM until 2028-06-30"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-001", lessor_name: "Alpha Minerals", gross_acres: 640.00, royalty_rate: 0.187500, primary_term_end_date: "2026-09-30", extension_option_months: 24, extension_bonus_per_acre_cents: 15000 }
              as: LandAdministrator
              captures: { lease1_id: $.data.id }
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-003", lessor_name: "Gamma Minerals", gross_acres: 160.00, royalty_rate: 0.200000, primary_term_end_date: "2028-06-30" }
              as: LandAdministrator
              captures: { lease3_id: $.data.id }
            - call: "POST /land-admin/leases/${lease1_id}/extension"
              payload: { bonus_paid_cents: 9600000 }
              as: LandAdministrator
          trigger:
            - call: "POST /land-admin/leases/${lease3_id}/extension"
              payload: { bonus_paid_cents: 0 }
              as: LandAdministrator
          assert:
            - "HTTP 409 with error_id ERR_EXTENSION_NOT_AVAILABLE"
            - "the response error_id is not ERR_EXTENSION_BONUS_MISMATCH"
            - "Lease.${lease3_id}.tenure_status == PRIMARY_TERM and primary_term_end_date == 2028-06-30 and extension_exercised == false"
            - "Lease.${lease1_id}.tenure_status == PRIMARY_TERM, extension_exercised == true and primary_term_end_date == 2028-09-30, showing the configured lease takes the same call successfully"

      - name: the_higher_priority_state_check_wins_over_the_expired_window
        claim_type: priority_ordering
        grounds:
          - "validations[priority=50, error_id=ERR_TRANSFER_NOT_PENDING]"
          - "validations[priority=60, error_id=ERR_PPR_WINDOW_EXPIRED]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / transfer_state_check_beats_expired_ppr_window
          rationale: |
            This row asks for one call that violates a low-priority and a high-priority rule at once
            and asserts the high-priority error_id. The §1.8 priority_pair_validation_conflict
            instance is exactly that call - a preferential-right election on a CLOSED transfer after
            ppr_deadline_date - and it also asserts the single-violation control cases, so a corner
            duplicate would add no new coverage.

      - name: statement_issuance_reads_the_state_of_a_different_entity
        claim_type: cross_entity
        grounds:
          - "validations[priority=55, error_id=ERR_WELL_NOT_POOLED]"
          - entities.Well.fields.pooling_status
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / statement_issuance_depends_on_the_wells_pooling_status
          rationale: |
            The cross-entity validation pattern needs both the invalid and the valid configuration of
            the other entity. The §1.8 cross_entity_state_dependency instance issues the identical
            statement twice - once with pooling_status POOLED_FORMING (rejected with
            ERR_WELL_NOT_POOLED) and once after effectuation (accepted) - covering both halves.

  # ============================================================================
  # Section 5 - Endpoints (claim-extraction-guide "From Table 5")
  # ============================================================================
  - section: endpoints
    instances:
      - name: a_compliance_update_patches_only_the_supplied_owner_fields
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/land-admin/interest-owners/{owner_id}/compliance-updates
          - entities.InterestOwner.fields.bond_posted_cents
          - roles.ComplianceOfficer
        distinguishing_aspect: |
          All three inputs of the compliance update are optional, so a body carrying only
          bond_posted_cents moves that field to 25000000 while tax_id_on_file stays false and
          audit_window_days stays at its declared default 730 - the endpoint patches, it does not
          replace.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z"
            - "Interest owner Epsilon Resources Inc created with bond_posted_cents 0, tax_id_on_file false and no audit_window_days supplied"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/interest-owners"
              payload: { owner_name: "Epsilon Resources Inc", owner_type: "WORKING_INTEREST_PARTNER", contact_email: "epsilon@example.com", tax_id_on_file: false, bond_posted_cents: 0 }
              as: LandAdministrator
              captures: { ob_id: $.data.id }
          trigger:
            - call: "POST /land-admin/interest-owners/${ob_id}/compliance-updates"
              payload: { bond_posted_cents: 25000000 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
          assert:
            - "HTTP 200"
            - "InterestOwner.${ob_id}.bond_posted_cents == 25000000"
            - "InterestOwner.${ob_id}.tax_id_on_file == false"
            - "InterestOwner.${ob_id}.audit_window_days == 730"
            - "InterestOwner.${ob_id}.version == 2"

      - name: cost_entry_payment_moves_the_entry_from_accrued_to_paid
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/land-admin/cost-entries/{cost_entry_id}/payment
          - entities.CostEntry.fields.cost_status
          - entities.CostEntry.fields.paid_date
        distinguishing_aspect: |
          The action endpoint is the only way an ACCRUED entry becomes PAID: after the call
          cost_status is PAID and paid_date is the supplied 2026-06-20, and the same entry is now
          selectable by a CASH-basis statement covering June while it was invisible to one before.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z"
            - "Well Sandstone 1H, OIL, 9500 ft"
            - "One cost entry on the well: LEASE_OPERATING / OPERATING 300000 incurred 2026-06-09 with no paid_date, so cost_status is ACCRUED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/wells"
