# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1841: Surgical Loaner Tray & Vendor Instrument Management
# 9 rules x 2 instances = 18 instances. All times UTC. Clock default
# 2026-08-01T00:00:00Z. Standard fixture (per instance, from empty DB):
#   vendor ACME (grace 15, rate 5000/hr, cap 20000, surcharge 250/min),
#   rep credentialed to 2026-08-10, room OR-1 (buffer 30), sterilizer ST-1
#   (2 slots, 60 cycle, 30 cooldown), case 2026-08-03 09:00-12:00,
#   URGENT request -> required_delivery_by 2026-08-02T09:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: liability_provisional_vs_final_on_identical_claim
        grounds:
          - calculations.calc_liability_apportionment
          - entities.DamageLossClaim.fields.provisional_vendor_share_cents
          - entities.DamageLossClaim.fields.final_vendor_share_cents
          - state_machines.DamageLossClaim.FILED_to_APPORTIONED
        distinguishing_aspect: |
          DamageLossClaim domain: identical claim data (claimed 18000, type LOSS) yields
          provisional_vendor_share_cents == 18000 (presumptive 100% for LOSS) but
          final_vendor_share_cents == 10800 after adjudicated apportion at 60% — two valid
          algorithms, different cents, on the same row.
        test_recipe:
          setup:
            - "Full lifecycle: tray delivered on time (50/50), sterilized, staged, case run, pickup returns 47/50, reconciled -> auto LOSS claim of 18000 (round_half_up(300000*3/50))"
          setup_api_calls:
            - { call: "POST /vendor-office/vendors", payload: { vendor_name: "Acme Surgical", vendor_code: "ACME", late_grace_minutes: 15, late_rate_per_hour_cents: 5000, late_penalty_cap_cents: 20000, delay_surcharge_per_minute_cents: 250 }, as: VendorCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /vendor-office/vendors/${v_id}/reps", payload: { full_name: "Rita Rep", rep_email: "r@acme.com", credential_doc_ref: "DOC-1" }, as: VendorCoordinator, captures: { rep_id: $.data.id } }
            - { call: "POST /vendor-office/reps/${rep_id}/approve-credential", payload: { credential_expires_at: "2026-08-10T00:00:00Z", or_access_level: "OBSERVER" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/or-rooms", payload: { room_name: "OR-1", turnover_buffer_minutes: 30 }, as: ORScheduler, captures: { room_id: $.data.id } }
            - { call: "POST /vendor-office/sterilizer-units", payload: { unit_name: "ST-1", slot_capacity: 2, cycle_minutes: 60, cooldown_minutes: 30 }, as: SterileProcessingTech, captures: { st_id: $.data.id } }
            - { call: "POST /vendor-office/cases", payload: { case_number: "C-1001", or_room_id: "${room_id}", procedure_type: "TOTAL_KNEE", surgeon_name: "Dr. A", scheduled_start_at: "2026-08-03T09:00:00Z", scheduled_end_at: "2026-08-03T12:00:00Z" }, as: ORScheduler, captures: { case_id: $.data.id } }
            - { call: "POST /vendor-office/requests", payload: { case_id: "${case_id}", vendor_id: "${v_id}", priority_class: "URGENT" }, as: ORScheduler, captures: { rq_id: $.data.id } }
            - { call: "POST /vendor-office/requests/${rq_id}/trays", payload: { tray_code: "TK-1", declared_instrument_count: 50, replacement_value_cents: 300000 }, as: ORScheduler, captures: { t1_id: $.data.id } }
            - { call: "POST /vendor-office/requests/${rq_id}/submit", as: ORScheduler }
            - { call: "POST /vendor-office/requests/${rq_id}/decide", payload: { decision: "APPROVE" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/requests/${rq_id}/check-ins", payload: { lines: [{ tray_id: "${t1_id}", instrument_count_delivered: 50 }], ifu_provided: true, loaner_agreement_ref: "LA-1" }, as: VendorRep, as_user_id: "${rep_id}", captures: { ci_id: $.data.id } }
            - { call: "POST /vendor-office/check-ins/${ci_id}/verify", payload: { line_dispositions: [{ tray_id: "${t1_id}", disposition: "ACCEPT" }] }, as: VendorCoordinator, as_user_id: "coord-1" }
            - { call: "POST /vendor-office/trays/${t1_id}/turns", as: SterileProcessingTech, captures: { turn_id: $.data.id } }
            - { call: "POST /vendor-office/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:35:00Z" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/turns/${turn_id}/start-cycle", payload: { sterilizer_unit_id: "${st_id}" }, as: SterileProcessingTech }
            - { call: "POST /vendor-office/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:10:00Z" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/turns/${turn_id}/release", as: SterileProcessingTech }
            - { call: "POST /vendor-office/trays/${t1_id}/stage", as: ORCirculatorNurse }
            - { call: "POST /vendor-office/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/cases/${case_id}/start", as: ORScheduler }
            - { call: "POST /vendor-office/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:30:00Z" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/cases/${case_id}/complete", as: ORScheduler }
            - { call: "POST /vendor-office/requests/${rq_id}/pickups", payload: { lines: [{ tray_id: "${t1_id}", instrument_count_returned: 47, condition: "OK" }] }, as: VendorRep, as_user_id: "${rep_id}", captures: { pk_id: $.data.id } }
            - { call: "POST /vendor-office/pickups/${pk_id}/reconcile", as: VendorCoordinator, as_user_id: "coord-2" }
            - { call: "GET /vendor-office/claims?request_id=${rq_id}", as: VendorCoordinator, captures: { cl_id: "$.data[0].id", cl_v: "$.data[0].version" } }
          trigger:
            - { call: "POST /vendor-office/claims/${cl_id}/apportion", payload: { vendor_share_percent: 60, expected_claim_version: "${cl_v}" }, as: VendorCoordinator, as_user_id: "coord-1" }
          assert:
            - "Before trigger: GET /vendor-office/claims/${cl_id} -> claimed_amount_cents == 18000 and provisional_vendor_share_cents == 18000 (LOSS presumptive 100%)"
            - "After trigger: claim.final_vendor_share_cents == 10800 and final_hospital_share_cents == 7200 (60% adjudicated, round_half_up, hospital remainder)"
            - "claim.provisional_vendor_share_cents == 18000 remains stored (variant divergence 18000 != 10800 on identical claim data)"
            - "claim.status == APPORTIONED; GET /vendor-office/vendors/${v_id} -> outstanding_liability_cents == 10800"

      - name: case_delay_provisional_vs_final_attribution
        grounds:
          - calculations.calc_case_delay_attribution
          - entities.SurgicalCase.fields.vendor_delay_minutes_provisional
          - entities.SurgicalCase.fields.vendor_delay_minutes_final
          - state_machines.SurgicalCase.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          SurgicalCase domain (different entity than DamageLossClaim): identical case data yields
          vendor_delay_minutes_provisional == 50 (all-or-nothing override rule) at start but
          vendor_delay_minutes_final == 30 after delay-event adjudication at completion.
        test_recipe:
          setup:
            - "Tray delivered 2026-08-03T08:45 (very late), still PROCESSING at case time; case start 09:50 with override; delay events STERILIZATION_TURNAROUND 30 + PATIENT 20 recorded"
          setup_api_calls:
            - { call: "POST /vendor-office/vendors", payload: { vendor_name: "Acme Surgical", vendor_code: "ACME", late_grace_minutes: 15, late_rate_per_hour_cents: 5000, late_penalty_cap_cents: 20000, delay_surcharge_per_minute_cents: 250 }, as: VendorCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /vendor-office/vendors/${v_id}/reps", payload: { full_name: "Rita Rep", rep_email: "r@acme.com", credential_doc_ref: "DOC-1" }, as: VendorCoordinator, captures: { rep_id: $.data.id } }
            - { call: "POST /vendor-office/reps/${rep_id}/approve-credential", payload: { credential_expires_at: "2026-08-10T00:00:00Z", or_access_level: "OBSERVER" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/or-rooms", payload: { room_name: "OR-1", turnover_buffer_minutes: 30 }, as: ORScheduler, captures: { room_id: $.data.id } }
            - { call: "POST /vendor-office/sterilizer-units", payload: { unit_name: "ST-1", slot_capacity: 2, cycle_minutes: 60, cooldown_minutes: 30 }, as: SterileProcessingTech, captures: { st_id: $.data.id } }
            - { call: "POST /vendor-office/cases", payload: { case_number: "C-1001", or_room_id: "${room_id}", procedure_type: "TOTAL_KNEE", surgeon_name: "Dr. A", scheduled_start_at: "2026-08-03T09:00:00Z", scheduled_end_at: "2026-08-03T12:00:00Z" }, as: ORScheduler, captures: { case_id: $.data.id } }
            - { call: "POST /vendor-office/requests", payload: { case_id: "${case_id}", vendor_id: "${v_id}", priority_class: "URGENT" }, as: ORScheduler, captures: { rq_id: $.data.id } }
            - { call: "POST /vendor-office/requests/${rq_id}/trays", payload: { tray_code: "TK-1", declared_instrument_count: 50, replacement_value_cents: 300000 }, as: ORScheduler, captures: { t1_id: $.data.id } }
            - { call: "POST /vendor-office/requests/${rq_id}/submit", as: ORScheduler }
            - { call: "POST /vendor-office/requests/${rq_id}/decide", payload: { decision: "APPROVE" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:45:00Z" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/requests/${rq_id}/check-ins", payload: { lines: [{ tray_id: "${t1_id}", instrument_count_delivered: 50 }], ifu_provided: true, loaner_agreement_ref: "LA-1" }, as: VendorRep, as_user_id: "${rep_id}", captures: { ci_id: $.data.id } }
            - { call: "POST /vendor-office/check-ins/${ci_id}/verify", payload: { line_dispositions: [{ tray_id: "${t1_id}", disposition: "ACCEPT" }] }, as: VendorCoordinator, as_user_id: "coord-1" }
            - { call: "POST /vendor-office/trays/${t1_id}/turns", as: SterileProcessingTech, captures: { turn_id: $.data.id } }
            - { call: "POST /vendor-office/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:15:00Z" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/turns/${turn_id}/start-cycle", payload: { sterilizer_unit_id: "${st_id}" }, as: SterileProcessingTech }
            - { call: "POST /vendor-office/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:50:00Z" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/cases/${case_id}/start", payload: { override_readiness: true, override_reason: "surgeon proceeds without tray" }, as: ORScheduler }
          trigger:
            - { call: "POST /vendor-office/cases/${case_id}/delay-events", payload: { cause: "STERILIZATION_TURNAROUND", minutes: 30, attributable_request_id: "${rq_id}" }, as: ORScheduler }
            - { call: "POST /vendor-office/cases/${case_id}/delay-events", payload: { cause: "PATIENT", minutes: 20 }, as: ORCirculatorNurse }
            - { call: "POST /vendor-office/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:30:00Z" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/cases/${case_id}/complete", as: ORScheduler, captures: { final_vendor_delay: $.data.vendor_delay_minutes_final } }
          assert:
            - "After start (pre-trigger): case.delay_minutes_provisional == 50 and case.vendor_delay_minutes_provisional == 50 (override used)"
            - "After complete: case.vendor_delay_minutes_final == 30 (vendor-cause event sum 30, capped at delay 50; PATIENT 20 excluded)"
            - "case.vendor_delay_minutes_final != case.vendor_delay_minutes_provisional (30 != 50 — variant divergence on identical case data)"
            - "case.status == COMPLETED"

  - rule_id: combinatorial_formula
    instances:
      - name: late_delivery_penalty_grace_ceil_cap_surcharge
        grounds:
          - calculations.calc_late_delivery_penalty
          - entities.PenaltyAssessment.fields.time_charge_cents
          - entities.PenaltyAssessment.fields.delay_surcharge_cents
        distinguishing_aspect: |
          Mode (a) combinatorial: 5 inputs (late_minutes, grace, hourly rate, per-assessment cap,
          surcharge-per-minute x delay) with nested min/max and ceil-hour tiering — late 1425 min
          yields billable 1410 -> ceil 24 h -> 120000 -> capped to 20000; surcharge min(20000,
          50*250) = 12500; assessed 32500.
        test_recipe:
          setup:
            - "URGENT request (deadline 2026-08-02T09:00) delivered 2026-08-03T08:45 (1425 min late); case started 09:50 with readiness override (vendor-attributable delay 50, finalized by completion with no delay events)"
          setup_api_calls:
            - { call: "POST /vendor-office/vendors", payload: { vendor_name: "Acme Surgical", vendor_code: "ACME", late_grace_minutes: 15, late_rate_per_hour_cents: 5000, late_penalty_cap_cents: 20000, delay_surcharge_per_minute_cents: 250 }, as: VendorCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /vendor-office/vendors/${v_id}/reps", payload: { full_name: "Rita Rep", rep_email: "r@acme.com", credential_doc_ref: "DOC-1" }, as: VendorCoordinator, captures: { rep_id: $.data.id } }
            - { call: "POST /vendor-office/reps/${rep_id}/approve-credential", payload: { credential_expires_at: "2026-08-10T00:00:00Z", or_access_level: "OBSERVER" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/or-rooms", payload: { room_name: "OR-1", turnover_buffer_minutes: 30 }, as: ORScheduler, captures: { room_id: $.data.id } }
            - { call: "POST /vendor-office/sterilizer-units", payload: { unit_name: "ST-1", slot_capacity: 2, cycle_minutes: 60, cooldown_minutes: 30 }, as: SterileProcessingTech, captures: { st_id: $.data.id } }
            - { call: "POST /vendor-office/cases", payload: { case_number: "C-1001", or_room_id: "${room_id}", procedure_type: "TOTAL_KNEE", surgeon_name: "Dr. A", scheduled_start_at: "2026-08-03T09:00:00Z", scheduled_end_at: "2026-08-03T12:00:00Z" }, as: ORScheduler, captures: { case_id: $.data.id } }
            - { call: "POST /vendor-office/requests", payload: { case_id: "${case_id}", vendor_id: "${v_id}", priority_class: "URGENT" }, as: ORScheduler, captures: { rq_id: $.data.id } }
            - { call: "POST /vendor-office/requests/${rq_id}/trays", payload: { tray_code: "TK-1", declared_instrument_count: 50, replacement_value_cents: 300000 }, as: ORScheduler, captures: { t1_id: $.data.id } }
            - { call: "POST /vendor-office/requests/${rq_id}/submit", as: ORScheduler }
            - { call: "POST /vendor-office/requests/${rq_id}/decide", payload: { decision: "APPROVE" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:45:00Z" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/requests/${rq_id}/check-ins", payload: { lines: [{ tray_id: "${t1_id}", instrument_count_delivered: 50 }], ifu_provided: true, loaner_agreement_ref: "LA-1" }, as: VendorRep, as_user_id: "${rep_id}", captures: { ci_id: $.data.id } }
            - { call: "POST /vendor-office/check-ins/${ci_id}/verify", payload: { line_dispositions: [{ tray_id: "${t1_id}", disposition: "ACCEPT" }] }, as: VendorCoordinator, as_user_id: "coord-1" }
            - { call: "POST /vendor-office/trays/${t1_id}/turns", as: SterileProcessingTech, captures: { turn_id: $.data.id } }
            - { call: "POST /vendor-office/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:15:00Z" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/turns/${turn_id}/start-cycle", payload: { sterilizer_unit_id: "${st_id}" }, as: SterileProcessingTech }
            - { call: "POST /vendor-office/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:50:00Z" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/cases/${case_id}/start", payload: { override_readiness: true, override_reason: "surgeon proceeds without tray" }, as: ORScheduler }
            - { call: "POST /vendor-office/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:50:00Z" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/turns/${turn_id}/release", as: SterileProcessingTech }
            - { call: "POST /vendor-office/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:30:00Z" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/cases/${case_id}/complete", as: ORScheduler }
            - { call: "GET /vendor-office/penalties?request_id=${rq_id}", as: VendorCoordinator, captures: { pen_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /vendor-office/penalties/${pen_id}/assess", as: VendorCoordinator, as_user_id: "coord-1" }
          assert:
            - "penalty.late_minutes == 1425 and penalty.billable_minutes == 1410 (grace 15 subtracted)"
            - "penalty.time_charge_cents == 20000 (24 billable hours x 5000 = 120000, capped at late_penalty_cap_cents 20000)"
            - "penalty.delay_surcharge_cents == 12500 (min(20000, 50 x 250))"
            - "penalty.assessed_cents == 32500 and penalty.outstanding_cents == 32500; status ASSESSED"
            - "GET /vendor-office/requests/${rq_id} -> penalty_exposure_cents == 32500; GET /vendor-office/vendors/${v_id} -> outstanding_penalty_cents == 32500"

      - name: reconciliation_shortage_per_line_rounding
        grounds:
          - calculations.calc_reconciliation_shortage_claims
          - entities.DamageLossClaim.fields.claimed_amount_cents
          - state_machines.LoanerTray.PICKED_UP_to_RECONCILED
        distinguishing_aspect: |
          Mode (b) nested rounding (different mode than the penalty instance): the scaffold pins
          round-half-up PER LINE then sum. Two shortage lines (100*3/8 = 37.5 and 100*5/8 = 62.5)
          yield 38 + 63 = 101 cents of claims, whereas rounding once after summing exact values
          (100.0) would yield 100 — the pinned order produces observably different cents.
        test_recipe:
          setup:
            - "Two trays (declared 8 each, value 100 each) delivered complete; case run; pickup returns t1 5/8 and t2 3/8"
          setup_api_calls:
            - { call: "POST /vendor-office/vendors", payload: { vendor_name: "Acme Surgical", vendor_code: "ACME", late_grace_minutes: 15, late_rate_per_hour_cents: 5000, late_penalty_cap_cents: 20000, delay_surcharge_per_minute_cents: 250 }, as: VendorCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /vendor-office/vendors/${v_id}/reps", payload: { full_name: "Rita Rep", rep_email: "r@acme.com", credential_doc_ref: "DOC-1" }, as: VendorCoordinator, captures: { rep_id: $.data.id } }
            - { call: "POST /vendor-office/reps/${rep_id}/approve-credential", payload: { credential_expires_at: "2026-08-10T00:00:00Z", or_access_level: "OBSERVER" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/or-rooms", payload: { room_name: "OR-1", turnover_buffer_minutes: 30 }, as: ORScheduler, captures: { room_id: $.data.id } }
            - { call: "POST /vendor-office/sterilizer-units", payload: { unit_name: "ST-1", slot_capacity: 2, cycle_minutes: 60, cooldown_minutes: 30 }, as: SterileProcessingTech, captures: { st_id: $.data.id } }
