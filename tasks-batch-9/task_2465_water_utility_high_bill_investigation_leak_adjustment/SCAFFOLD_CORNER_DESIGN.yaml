            - "Bill.${b_tie_id}.water_charge_cents is NOT 37618 — that is what round-half-even or truncation would produce"
            - "Bill.${b_tie_id}.sewer_charge_cents == 7320 and total_charge_cents == 44939, not 44938"
            - "Bill.${b_plain_id}.consumption_gallons == 40204"
            - "Bill.${b_plain_id}.water_charge_cents == 36804 == 1200 + 1050 + 3640 + 30914, where the tier-3 line is 30913.794 and every rounding rule agrees"
            - "Bill.${b_plain_id}.total_charge_cents == 44124"
            - "Each tier line is rounded to whole cents before summation: lines 1050 and 3640 are already exact, so the two bills differ only in the tier-3 line"

      - name: corner_calc_forward_looking_preview_prices_both_variants_and_persists_nothing
        claim_type: forward_looking
        grounds:
          - calculations.adjustment_preview
          - endpoints[GET /bills/{id}/adjustment-preview]
        distinguishing_aspect: |
          The preview is a pure read that runs the credit engine twice per call and is recomputed
          from scratch on each call: with assumed_leak_type SERVICE_LINE it returns 26779 / 26963 /
          delta 184 and recommends BASELINE_REBILL, while a second call with TOILET on the SAME bill
          returns 21899 / 26963 / delta 5064 and recommends EXCESS_REPRICE, because TOILET is
          excluded from sewer relief. Neither call may create a LeakAdjustment, write a ledger entry
          or touch the bill.
        test_recipe:
          setup:
            - "RS-STD-2026 and four SUMMER periods 2025-06, 2025-07, 2025-08 and 2026-07 exist; the clock is 2026-08-01T00:00:00Z."
            - "ServiceAccount ACC-1001 has master meter MTR-A-1 with reads 100000 / 104000 / 108000 / 112000 / 153000, so the three 2025 bills are 4000 gallons at 5210 cents and the 2026-07 bill is 41000 gallons at 44939 cents with seasonal_baseline_gallons 4000."
            - "All four bills are ISSUED and balance_cents is 60569; no investigation and no adjustment exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RS-STD-2026", base_charge_cents: 1200, tier1_limit_gallons: 3000, tier1_rate_cents_per_kgal: 350, tier2_limit_gallons: 10000, tier2_rate_cents_per_kgal: 520, tier3_rate_cents_per_kgal: 890, summer_surcharge_bp: 1500, sewer_rate_cents_per_kgal: 610, sewer_cap_gallons: 12000, submeter_sewer_credit_cap_gallons: 8000, admin_fee_cents: 1500, admin_fee_waiver_threshold_cents: 10000 }
              as: SystemAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-06", start_date: "2025-06-01", end_date: "2025-06-30", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-07", start_date: "2025-07-01", end_date: "2025-07-31", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-08", start_date: "2025-08-01", end_date: "2025-08-31", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p3_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2026-07", start_date: "2026-07-01", end_date: "2026-07-31", season: "SUMMER", rebilling_deadline_date: "2027-01-31" }
              as: SystemAdmin
              captures: { p4_id: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-1001", customer_name: "Alma Reyes", service_address: "12 Cedar St", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", meter_serial: "MTR-A-1", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 100000 }
              as: MeterTechnician
              captures: { meter_id: $.data.id }
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-05-31", read_type: "ACTUAL", reading_value: 100000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-06-30", read_type: "ACTUAL", reading_value: 104000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-07-31", read_type: "ACTUAL", reading_value: 108000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-08-31", read_type: "ACTUAL", reading_value: 112000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2026-07-31", read_type: "ACTUAL", reading_value: 153000 }
              as: MeterTechnician
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_id: "${p1_id}", meter_id: "${meter_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { b1_id: $.data.id }
            - call: "POST /bills/${b1_id}/issue"
              as: BillingSupervisor
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_id: "${p2_id}", meter_id: "${meter_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { b2_id: $.data.id }
            - call: "POST /bills/${b2_id}/issue"
              as: BillingSupervisor
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_id: "${p3_id}", meter_id: "${meter_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { b3_id: $.data.id }
            - call: "POST /bills/${b3_id}/issue"
              as: BillingSupervisor
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_id: "${p4_id}", meter_id: "${meter_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { b4_id: $.data.id }
            - call: "POST /bills/${b4_id}/issue"
              as: BillingSupervisor
          trigger:
            - call: "GET /bills/${b4_id}/adjustment-preview"
              payload: { assumed_leak_type: "SERVICE_LINE" }
              as: CustomerServiceRep
            - call: "GET /bills/${b4_id}/adjustment-preview"
              payload: { assumed_leak_type: "TOILET" }
              as: BillingSupervisor
          assert:
            - "SERVICE_LINE PREVIEW: excess_reprice_net_cents == 26779, baseline_rebill_net_cents == 26963, variant_delta_cents == 184, recommended_variant == BASELINE_REBILL"
            - "TOILET PREVIEW on the same bill: excess_reprice_net_cents == 21899 (no sewer relief, since TOILET is not in SEWER_RELIEF_LEAK_TYPES), baseline_rebill_net_cents == 26963, variant_delta_cents == 5064, recommended_variant == EXCESS_REPRICE"
            - "The two calls return different numbers for the same bill, proving the preview is recomputed per call rather than cached"
            - "GET /leak-adjustments?bill_id=${b4_id} returns total_count 0 — no adjustment row was created"
            - "GET /service-accounts/${acct_id}/ledger-entries returns total_count 4 and ServiceAccount.${acct_id}.balance_cents == 60569 — unchanged"
            - "Bill.${b4_id}.billing_status == ISSUED with total_charge_cents 44939 and adjusted_total_cents 44939 — the preview is a pure read"

      - name: corner_calc_tiered_pricing_boundaries_and_nested_clamps
        claim_type: tiered_pricing
        grounds:
          - calculations.tiered_water_charge
        excluded_because:
          difficulty_instance: combinatorial_mode_a_tiered_water_charge_nested_clamp_seasonal_branch
          rationale: |
            That difficulty instance walks the nested tier clamps across every tier boundary and
            both seasonal branches on the same volumes, covering the marginal-versus-average and
            cross-tier straddling claims for this algorithm type.

      - name: corner_calc_waterfall_allocation_pinned_bucket_order
        claim_type: waterfall_allocation
        grounds:
          - calculations.sewer_charge_with_submeter_credit
          - calculations.payment_arrangement_schedule
        excluded_because:
          difficulty_instance: combinatorial_mode_b_installment_floor_then_remainder_to_final
          rationale: |
            That difficulty instance pins the instalment waterfall — floor once, then push the whole
            remainder into the final bucket — and asserts the exact per-bucket amounts and their sum,
            which is the first-bucket-fills-before-second and remainder-allocation claim.

      - name: corner_calc_threshold_boundary_triples
        claim_type: threshold
        grounds:
          - calculations.anomaly_screen
        excluded_because:
          difficulty_instance: boundary_anomaly_ratio_inclusive_at_two_point_zero_three_decimals
          rationale: |
            That difficulty instance tests the anomaly ratio at threshold-minus, exactly at 2.000 and
            above, with the comparison run on the 3-decimal rounded ratio, which is the
            at/below/above triple this row asks for.

      - name: corner_calc_weighted_scoring_weights_and_drift
        claim_type: weighted_scoring
        grounds:
          - calculations.bench_test_accuracy
        excluded_because:
          difficulty_instance: dual_variant_bench_accuracy_awwa_weighted_vs_simple_mean
          rationale: |
            That difficulty instance computes the same three flow points under the AWWA 0.15/0.70/0.15
            weighting and under the simple mean, asserting both composites and the resulting
            correction factors, which covers weights-sum and rounding-drift for this algorithm.

      - name: corner_calc_aggregation_running_total_after_add_and_reversal
        claim_type: aggregation
        grounds:
          - calculations.account_balance
        excluded_because:
          difficulty_instance: compensating_invariant_receivable_balance_restored_after_adjustment_reversal
          rationale: |
            That difficulty instance verifies the running receivable total after a credit is added and
            again after it is reversed, returning to the exact pre-credit figure, which is the
            correct-after-add and correct-after-reversal claim for this aggregation.

      - name: corner_calc_projection_replay_after_a_late_corrected_read
        claim_type: projection
        grounds:
          - calculations.read_correction_reallocation
        excluded_because:
          difficulty_instance: compensating_invariant_metered_gallons_conserved_across_correction_and_rebill
          rationale: |
            That difficulty instance lands a CORRECTED read behind an already-billed period and
            replays consumption across every affected bill, asserting that the gallon total still
            equals the register travel, which is the event-replay and late-event claim.

      - name: corner_calc_variant_divergence_same_bill_two_credit_engines
        claim_type: variant_divergence
        grounds:
          - calculations.leak_adjustment_credit
        excluded_because:
          difficulty_instance: dual_variant_leak_credit_excess_reprice_vs_baseline_rebill
          rationale: |
            That difficulty instance runs both credit variants against the same bill and the same
            leak_type and asserts both nets plus the 184-cent delta, which is exactly the
            variant-divergence claim.

      - name: corner_calc_variant_selection_by_meter_size
        claim_type: variant_selection
        grounds:
          - calculations.bench_test_accuracy
        excluded_because:
          difficulty_instance: dual_variant_bench_accuracy_awwa_weighted_vs_simple_mean
          rationale: |
            That difficulty instance shows the selector firing in context: a 1.0-inch meter takes
            AWWA_WEIGHTED and a 3.0-inch meter takes SIMPLE_MEAN from identical flow readings, which
            is the correct-variant-in-correct-context claim.

      - name: corner_calc_reconciliation_board_ordered_variant_switch_delta_to_the_ledger
        claim_type: reconciliation
        grounds:
          - calculations.leak_adjustment_credit
          - state_machines.BoardAppeal
        excluded_because:
          difficulty_instance: compensating_invariant_receivable_balance_restored_after_adjustment_reversal
          rationale: |
            The only variant switch this domain supports is a board-ordered adjustment forcing
            BASELINE_REBILL over a superseded one, and that difficulty instance already asserts the
            ledger delta of undoing the first adjustment before the replacement is priced, so the
            switch delta is covered there.

  # ===========================================================================
  # Guide section 4 — Validations
  # ===========================================================================
  - section: validations
    instances:

      - name: corner_validation_violation_to_error_rebill_after_the_period_deadline_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[ERR_REBILL_WINDOW_EXPIRED]
          - state_machines.Bill
        distinguishing_aspect: |
          The rebilling window is a per-period date, not a global setting: with
          rebilling_deadline_date 2026-06-30 and the clock at 2026-08-01, a bill that is legitimately
          sitting in REBILL_PENDING after a CORRECTED read cannot be rebilled and the call returns
          422 ERR_REBILL_WINDOW_EXPIRED. The refusal must leave the bill in REBILL_PENDING with its
          recomputed charges intact and must not write the reversal or the replacement charge.
        test_recipe:
          setup:
            - "RS-STD-2026 exists and BillingPeriod 2025-06 (SUMMER) carries rebilling_deadline_date 2026-06-30; the clock is 2026-08-01T00:00:00Z, which is past that deadline."
            - "ServiceAccount ACC-4001 has a master meter with reads 100000 at 2025-05-31 and 104000 at 2025-06-30, and its 4000-gallon bill is ISSUED for 5210 cents."
            - "A CORRECTED read of 103000 then supersedes the period-end read, dropping consumption to 3000 gallons and pushing the bill into REBILL_PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RS-STD-2026", base_charge_cents: 1200, tier1_limit_gallons: 3000, tier1_rate_cents_per_kgal: 350, tier2_limit_gallons: 10000, tier2_rate_cents_per_kgal: 520, tier3_rate_cents_per_kgal: 890, summer_surcharge_bp: 1500, sewer_rate_cents_per_kgal: 610, sewer_cap_gallons: 12000, submeter_sewer_credit_cap_gallons: 8000, admin_fee_cents: 1500, admin_fee_waiver_threshold_cents: 10000 }
              as: SystemAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-06", start_date: "2025-06-01", end_date: "2025-06-30", season: "SUMMER", rebilling_deadline_date: "2026-06-30" }
              as: SystemAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-4001", customer_name: "Bela Toth", service_address: "14 Ash Court", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", meter_serial: "MTR-X-1", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 100000 }
              as: MeterTechnician
              captures: { meter_id: $.data.id }
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-05-31", read_type: "ACTUAL", reading_value: 100000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-06-30", read_type: "ACTUAL", reading_value: 104000 }
              as: MeterTechnician
              captures: { read_end_id: $.data.id }
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_id: "${p1_id}", meter_id: "${meter_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { bill_id: $.data.id }
            - call: "POST /bills/${bill_id}/issue"
              as: BillingSupervisor
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-06-30", read_type: "CORRECTED", reading_value: 103000, corrects_reading_id: "${read_end_id}" }
              as: MeterTechnician
          trigger:
            - call: "POST /bills/${bill_id}/rebill"
              as: BillingSupervisor
          assert:
            - "HTTP 422 with error_id ERR_REBILL_WINDOW_EXPIRED because date(2026-08-01) is after rebilling_deadline_date 2026-06-30"
            - "Bill.${bill_id}.billing_status is still REBILL_PENDING with consumption_gallons 3000, water_charge_cents 2250, sewer_billable_gallons 3000, sewer_charge_cents 1830 and total_charge_cents 4080"
            - "No AccountLedgerEntry with source_kind REBILL_REVERSAL or REBILL_CHARGE exists"
            - "GET /service-accounts/${acct_id}/ledger-entries returns total_count 1 and balance_cents == 5210 — the customer still owes the original charge"
            - "No replacement bill exists: GET /bills?account_id=${acct_id} returns total_count 1"
            - "ServiceAccount.${acct_id}.open_rebill_count == 1 — the hold raised by the correction is still outstanding"

      - name: corner_validation_satisfaction_to_pass_rebill_inside_the_window_replaces_the_bill
        claim_type: satisfaction_to_pass
        grounds:
          - validations[ERR_REBILL_WINDOW_EXPIRED]
          - state_machines.Bill
          - endpoints[POST /bills/{id}/rebill]
        distinguishing_aspect: |
          The same operation on the same data succeeds when the only thing that changes is the
          period's rebilling_deadline_date, proving the rule gates on that field rather than on the
          bill's state: the superseded bill becomes REBILLED, a replacement is created and
          auto-issued, and the ledger records -5210 then +4080 so the balance settles at 4080 with
          credit_status back to CURRENT and open_rebill_count back to 0.
        test_recipe:
          setup:
            - "Identical to the refused case except that BillingPeriod 2025-06 carries rebilling_deadline_date 2026-12-31, which is still ahead of the 2026-08-01 clock."
            - "ServiceAccount ACC-4002 has a master meter with reads 100000 and 104000, its 4000-gallon bill is ISSUED for 5210 cents, and a CORRECTED read of 103000 has pushed it into REBILL_PENDING at 3000 gallons."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RS-STD-2026", base_charge_cents: 1200, tier1_limit_gallons: 3000, tier1_rate_cents_per_kgal: 350, tier2_limit_gallons: 10000, tier2_rate_cents_per_kgal: 520, tier3_rate_cents_per_kgal: 890, summer_surcharge_bp: 1500, sewer_rate_cents_per_kgal: 610, sewer_cap_gallons: 12000, submeter_sewer_credit_cap_gallons: 8000, admin_fee_cents: 1500, admin_fee_waiver_threshold_cents: 10000 }
              as: SystemAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-06", start_date: "2025-06-01", end_date: "2025-06-30", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-4002", customer_name: "Owen Marsh", service_address: "7 Birch Terrace", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", meter_serial: "MTR-X-2", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 100000 }
              as: MeterTechnician
              captures: { meter_id: $.data.id }
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-05-31", read_type: "ACTUAL", reading_value: 100000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-06-30", read_type: "ACTUAL", reading_value: 104000 }
              as: MeterTechnician
              captures: { read_end_id: $.data.id }
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_id: "${p1_id}", meter_id: "${meter_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { bill_id: $.data.id }
            - call: "POST /bills/${bill_id}/issue"
              as: BillingSupervisor
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_id}", read_date: "2025-06-30", read_type: "CORRECTED", reading_value: 103000, corrects_reading_id: "${read_end_id}" }
              as: MeterTechnician
          trigger:
            - call: "POST /bills/${bill_id}/rebill"
              as: BillingSupervisor
          assert:
            - "HTTP 200 — the deadline check passes because date(2026-08-01) <= 2026-12-31"
            - "Bill.${bill_id}.billing_status == REBILLED"
            - "GET /bills?account_id=${acct_id} returns total_count 2, and the replacement bill has rebill_of_bill_id == ${bill_id}, billing_status ISSUED, consumption_gallons 3000 and total_charge_cents 4080"
            - "The ledger holds three rows in order: BILL_CHARGE +5210, REBILL_REVERSAL -5210 and REBILL_CHARGE +4080"
            - "ServiceAccount.${acct_id}.balance_cents == 4080 == 5210 - 5210 + 4080"
            - "ServiceAccount.${acct_id}.credit_status == CURRENT because 4080 is not greater than PAST_DUE_THRESHOLD_CENTS 5000"
            - "ServiceAccount.${acct_id}.open_rebill_count == 0 — the rebill cleared the hold it had raised"

      - name: corner_validation_temporal_appeal_filing_window_is_thirty_inclusive_days
        claim_type: temporal_validation
        grounds:
          - validations[ERR_APPEAL_UNTIMELY]
          - state_machines.HighBillInvestigation
        distinguishing_aspect: |
          The filing window is anchored on the investigation's settlement instant and is inclusive at
          its far edge: with the investigation closed on 2026-08-01, a filing attempt at 2026-09-01
          (day 31) is refused with ERR_APPEAL_UNTIMELY, while the same call at 2026-08-31 (day 30)
          succeeds. Because the refusal is evaluated against the logical clock and not against
          real elapsed time, an implementation that reads the host clock, or that treats day 30 as
          late, diverges on exactly one of the two calls.
        test_recipe:
          setup:
            - "RS-STD-2026 and four SUMMER periods 2025-06, 2025-07, 2025-08 and 2026-07 exist; the clock is 2026-08-01T00:00:00Z."
            - "ServiceAccount ACC-1001 has master meter MTR-A-1 with reads 100000 / 104000 / 108000 / 112000 / 153000, so the 2026-07 bill of 41000 gallons carries seasonal_baseline_gallons 4000 and all four bills are ISSUED."
            - "An investigation on the 2026-07 bill is opened and immediately closed with close-no-adjustment at 2026-08-01, so its settlement instant is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
