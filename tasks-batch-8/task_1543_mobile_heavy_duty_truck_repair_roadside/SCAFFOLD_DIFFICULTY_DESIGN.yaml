        distinguishing_aspect: |
          Cyclic shape on ServiceCall: CLOSED -> REOPENED -> CLOSED, driven by a confirmed
          comeback (distinct from linear pipelines). The NO_CHARGE policy (17 days, 300 miles)
          zeroes the comeback invoice, and zero-total issue auto-settles: payment_status PAID
          without any Payment row.
