              as: BallotCoordinator
              captures: { ct_a: $.data.id }
            - call: "POST /elections/${el}/contests"
              payload: { title: "County Sheriff", contest_type: "CANDIDATE", district_code: "D-12", seats_open: 1, rotation_required: false }
              as: BallotCoordinator
              captures: { ct_b: $.data.id }
            - call: "POST /elections/${el}/contests"
              payload: { title: "Bond Measure A", contest_type: "MEASURE", district_code: "D-07", seats_open: 1, rotation_required: false }
              as: BallotCoordinator
              captures: { ct_c: $.data.id }
          trigger:
            - call: "GET /elections/${el}/contests?limit=2&offset=0"
              payload: {}
              as: PublicObserver
            - call: "GET /elections/${el}/contests?limit=2&offset=2"
              payload: {}
              as: PublicObserver
            - call: "GET /elections/${el}/contests"
              payload: {}
              as: PublicObserver
            - call: "GET /elections/${el}/contests"
              payload: { status: "CERTIFIED" }
              as: PublicObserver
          assert:
            - "First page: data has 2 rows, limit == 2, offset == 0, total_count == 3, has_more == true."
            - "Second page: data has 1 row, limit == 2, offset == 2, total_count == 3, has_more == false."
            - "The union of the ids across the two pages is exactly {${ct_a}, ${ct_b}, ${ct_c}} with no id appearing on both pages."
            - "Unparameterised list: limit == 10 and offset == 0 (pagination_defaults), data has all 3 rows, has_more == false."
            - "status=CERTIFIED filter: data == [], total_count == 0, has_more == false - all three contests are still DRAFT."

      - name: en_child_creation_under_unknown_election_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Contest.parent
          - entities.Precinct.parent
          - entities.BallotStyle.parent
          - entities.TabulatorUnit.parent
          - errors.ERR_ELECTION_NOT_FOUND
        distinguishing_aspect: "All four Election-parented collections refuse to create an orphan: the unknown {id} path segment is resolved before any body validation, so every call returns 404 ERR_ELECTION_NOT_FOUND rather than 400, and no row is created."
        test_recipe:
          setup:
            - "Logical clock pinned; no election with id 00000000-0000-0000-0000-0000000000ff exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ElectionsDirector
          trigger:
