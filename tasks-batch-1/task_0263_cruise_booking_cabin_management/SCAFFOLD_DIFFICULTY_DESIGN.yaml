            - call: "GET /folios?booking_id=${b_id}"
              payload: {}
              as: PortAgent
          trigger:
            - call: "POST /folios/00000000-0000-4000-8000-000000000000/charges"
              payload: { description: "Spa", amount_cents: 5000 }
              as: PortAgent
              captures: { err: $.data.error_id }
          assert:
