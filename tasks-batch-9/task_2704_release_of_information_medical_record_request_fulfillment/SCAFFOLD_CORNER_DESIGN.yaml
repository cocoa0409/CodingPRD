      - name: facility_penalty_exposure_aggregates_and_honours_the_per_request_cap
        claim_type: correct_result
        grounds:
          - entities.Facility.penalty_exposure_cents
          - calculations.turnaround_penalty
          - endpoints.POST_/roi/compliance-sweeps
        distinguishing_aspect: >
          The facility roll-up is a SUM of already-capped per-request figures, not a
          capped sum: two requests on one facility breach at different times, and at
          the second sweep the older request is pinned at its own 25000 cap while the
