            - "The foreign-evidence appeal returns HTTP 422 with error_id ERR_CERTIFICATION_OWNER_MISMATCH and leaves DisapprovalNotice.${notice_id}.status == ISSUED at version 1"
            - "The evidence-free appeal returns HTTP 201 with Appeal.${appeal_id}.status == SUBMITTED and evidence_certification_id null"
            - "DisapprovalNotice.${notice_id}.status == APPEALED at version 2"
            - "Certification.${cert_b}.status is still ACTIVE and version 1 — the rejected reference did not touch advertiser B's row"

      - name: error_catalog_the_logical_clock_accepts_the_same_instant_but_never_an_earlier_one
        claim_type: Error triggerability
        grounds:
          - validations[priority=79].ERR_CLOCK_REWIND
          - endpoints.POST_/ad-policy/_clock/set_current_utc
        distinguishing_aspect: |
          The rewind guard is "not earlier", so re-setting the clock to the instant it already
          holds is a legal no-op that returns previous_utc equal to current_utc, while one
          second earlier is 409. A malformed instant lands on the same error id rather than
          400, and neither refusal is allowed to move the clock.
        test_recipe:
          setup:
            - "No entities are needed; the logical clock starts at exactly 2026-08-01T00:00:00Z before any call."
          setup_api_calls:
            - call: "POST /ad-policy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: PolicyAdmin
          trigger:
            - call: "POST /ad-policy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: PolicyAdmin
            - call: "POST /ad-policy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T23:59:59Z" }
              as: PolicyAdmin
              captures: { err_back: "$.data.error_id" }
            - call: "POST /ad-policy/_clock/set_current_utc"
              payload: { to_iso8601: "the sixth of August" }
              as: PolicyAdmin
              captures: { err_shape: "$.data.error_id" }
            - call: "POST /ad-policy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T00:00:00Z" }
              as: PolicyAdmin
          assert:
            - "The setup call returns current_utc 2026-08-06T00:00:00Z with previous_utc 2026-08-01T00:00:00Z, proving the clock did not start from wall-clock time"
            - "Re-setting the same instant returns HTTP 200 with current_utc == previous_utc == 2026-08-06T00:00:00Z"
            - "The one-second rewind returns HTTP 409 with error_id ERR_CLOCK_REWIND"
            - "The malformed instant also returns HTTP 409 with error_id ERR_CLOCK_REWIND (priority 79 owns both halves of the check)"
            - "The final forward move returns previous_utc 2026-08-06T00:00:00Z — neither refusal moved the clock"

      - name: error_catalog_destination_checks_reject_unknown_categories_and_non_reviewable_creatives
        claim_type: Error triggerability
        grounds:
          - validations[priority=84].ERR_UNKNOWN_POLICY_CATEGORY
          - validations[priority=40].ERR_INVALID_CREATIVE_STATE
          - calculations.destination_check_result
        distinguishing_aspect: |
          fetched_content_category is a policy-catalogue reference, not free text: a plausible
          string that is not a PolicyRule.code is 422, while GENERAL is always admissible. The
          state guard is separate and bites at both ends of the creative's life — DRAFT before
          submission and WITHDRAWN after it.
        test_recipe:
          setup:
            - "Rule FIN_CREDIT (REGULATED, weight 4.00) exists; no rule named ADULT_CONTENT exists."
            - "One verified advertiser with one DRAFT creative whose display_url host is www.beaconlending.example."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "FIN_CREDIT", title: "Consumer credit offers", category_class: "REGULATED", base_severity_weight: 4.00 }
              as: PolicyAdmin
              captures: { fin_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Beacon Lending Co", country_code: "US", industry_code: "CONSUMER_FINANCE" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Single offer", body_text: "One offer used to probe the destination check guards.", declared_category_codes: ["FIN_CREDIT"], target_country_codes: ["US"], landing_page_url: "https://www.beaconlending.example/one", display_url: "https://www.beaconlending.example/one" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_id: "$.data.id" }
          trigger:
            - call: "POST /ad-policy/ad-creatives/${cr_id}/destination-checks"
              payload: { check_type: "INITIAL", user_agent_variant: "CRAWLER", fetched_final_url: "https://www.beaconlending.example/one", fetched_content_category: "GENERAL", http_status: 200 }
              as: IntegrityAnalyst
              captures: { err_draft: "$.data.error_id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
            - call: "POST /ad-policy/ad-creatives/${cr_id}/destination-checks"
              payload: { check_type: "INITIAL", user_agent_variant: "CRAWLER", fetched_final_url: "https://www.beaconlending.example/one", fetched_content_category: "ADULT_CONTENT", http_status: 200 }
              as: IntegrityAnalyst
              captures: { err_category: "$.data.error_id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/destination-checks"
              payload: { check_type: "INITIAL", user_agent_variant: "CRAWLER", fetched_final_url: "https://www.beaconlending.example/one", fetched_content_category: "GENERAL", http_status: 200 }
              as: IntegrityAnalyst
              captures: { chk_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/withdraw"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
            - call: "POST /ad-policy/ad-creatives/${cr_id}/destination-checks"
              payload: { check_type: "RECHECK", user_agent_variant: "CRAWLER", fetched_final_url: "https://www.beaconlending.example/one", fetched_content_category: "GENERAL", http_status: 200 }
              as: IntegrityAnalyst
              captures: { err_withdrawn: "$.data.error_id" }
            - call: "GET /ad-policy/ad-creatives/${cr_id}/destination-checks"
              payload: {}
              as: PolicyAdmin
          assert:
            - "The DRAFT-stage check returns HTTP 409 with error_id ERR_INVALID_CREATIVE_STATE (the destination axis is NOT_CHECKED and only submission opens it)"
            - "The ADULT_CONTENT check returns HTTP 422 with error_id ERR_UNKNOWN_POLICY_CATEGORY — a string that merely looks like a category is not one"
            - "The GENERAL check returns HTTP 201 with DestinationCheck.${chk_id}.result == CLEARED, mismatch_detail null, and AdCreative destination_status DESTINATION_CLEARED"
            - "The post-withdrawal check returns HTTP 409 with error_id ERR_INVALID_CREATIVE_STATE"
            - "GET the creative's destination checks reports total_count == 1: neither refusal persisted a row"

      - name: error_catalog_certification_missing_blocks_a_limited_approval
        claim_type: Error triggerability
        grounds:
          - validations[priority=70].ERR_CERTIFICATION_MISSING
        excluded_because:
          difficulty_instance: boundary_precision_check / certification_coverage_empty_at_exact_valid_until_instant_blocks_limited_approval
          rationale: "That instance drives APPROVE_WITH_LIMITS at the exact valid_until instant, where the half-open candidate set is empty, and pins the 422."

      - name: error_catalog_certification_intervals_may_not_overlap
        claim_type: Error triggerability
        grounds:
          - validations[priority=76].ERR_CERTIFICATION_INTERVAL_OVERLAP
        excluded_because:
          difficulty_instance: resource_temporal_overlap / certification_half_open_intervals_reject_overlap_but_accept_both_adjacencies
          rationale: "That instance rejects an intersecting interval and accepts both adjacent ones on the same (advertiser, rule, country) triple."

      - name: error_catalog_an_appeal_filed_after_the_deadline_is_refused
        claim_type: Error triggerability
        grounds:
          - validations[priority=74].ERR_APPEAL_WINDOW_CLOSED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / appeal_window_closed_error_outranks_certification_owner_mismatch
          rationale: "That instance files an appeal at and past the deadline instant and pins the 409 to priority 74."

      - name: error_catalog_manual_enforcement_inside_a_cooldown_window_is_refused
        claim_type: Error triggerability
        grounds:
          - validations[priority=78].ERR_ENFORCEMENT_COOLDOWN_CONFLICT
        excluded_because:
          difficulty_instance: resource_temporal_overlap / enforcement_cooldown_closed_blackout_window_rejects_action_at_its_final_instant
          rationale: "That instance mints a second manual action at the last instant of the extended blackout window and one second after it."

      - name: error_catalog_revoking_a_revoked_certification_is_refused
        claim_type: Error triggerability
        grounds:
          - validations[priority=40].ERR_INVALID_CERTIFICATION_STATE
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / limited_approval_depends_on_certification_row_state_and_collapses_on_revocation
          rationale: "That instance revokes an ACTIVE certification and then repeats the revoke, which returns 409 ERR_INVALID_CERTIFICATION_STATE."

  # ===========================================================================
  - section: "From Table 7 (RBAC)"
    instances:

      - name: rbac_advertiser_exclusive_creative_operations_are_refused_to_the_other_three_roles
        claim_type: Per-role permission
        grounds:
          - roles.Advertiser.exclusive_operations
          - validations[priority=12].ERR_FORBIDDEN_ROLE
        distinguishing_aspect: |
          Authoring is the advertiser's alone: the platform's own operators cannot create,
          revise, submit or withdraw a creative even though PolicyAdmin drives screening and
          the sweep. Every refusal is 403 ERR_FORBIDDEN_ROLE at priority 12, ahead of any
          state or ownership reasoning, and none of them mutates the creative.
        test_recipe:
          setup:
