          assert:
            - "after rework-run create: Lot.${lot_src}.qty_on_hand == 600 and qty_reserved_rework == 400 (sum 1000)"
            - "after cancel: Lot.${lot_src}.qty_on_hand == 1000 and qty_reserved_rework == 0 (sum 1000)"
            - "invariant qty_on_hand + qty_reserved_rework == 1000 holds across the earmark/release pair"
