            - { call: "POST /api/enrollments", payload: { member_id: "${m_id}", plan_id: "${plan_id}" }, as: BenefitsAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /api/claims", payload: { enrollment_id: "${enr_id}", claim_type: "REIMBURSEMENT", service_date: "2026-05-02T10:00:00Z", receipt_ref: "R-C", line_items: [ { description: "gym", unit_amount_cents: 1000, quantity: 1, tax_pct: 0.0 } ] }, as: Member, as_user_id: "${m_id}", captures: { c_id: $.data.id } }
          trigger:
