    excluded_because:
      difficulty_instance: compensating_invariant / rescind_restores_package_schedule_days_and_estimate_exactly
      rationale: The §1.8 instance asserts the exact restoration of estimated_cost, fabrication_duration_days and the recomputed release date after a rescind.
- section: errors
  instances:
  - name: errors_triggerable_an_unknown_quote_id_is_a_404_from_the_path_and_from_the_body
    claim_type: errors_triggerable
    grounds:
    - errors[ERR_QUOTE_NOT_FOUND]
    - validations[priority=30]
    - validations[priority=35]
    distinguishing_aspect: 'ERR_QUOTE_NOT_FOUND is reachable from both existence rules: the path id at priority 30 (GET) and a body reference at priority 35 (the clause create''s quote_id), and the body case beats the priority-65 index-code check that the same request also violates.'
    test_recipe:
      setup:
      - A steel package whose commodity_index_code is PPI_STEEL_MILL and one registered supplier
      - No quote has ever been created
      - Clock at its 2026-08-01T00:00:00Z startup default
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-01, description: Structural steel frame package, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg_id: $.data.id}
      - call: POST /procurement/suppliers
        payload: {legal_name: Ironworks Fabricators LLC, country_of_origin: US, declared_tariff_rate_pct: '0.00'}
        as: BuyoutManager
        captures: {sup_id: $.data.id}
      trigger:
      - call: GET /procurement/quotes/00000000-0000-4000-8000-000000000999
        payload: {}
        as: BuyoutManager
        captures: {err: $.data.error_id}
      - call: POST /procurement/escalation-agreements
        payload: {quote_id: 00000000-0000-4000-8000-000000000999, index_code: PPI_COPPER_WIRE, baseline_index_period: 2026-07, cap_pct: '8.0', contractor_share_pct: '40.0', price_hold_through: '2026-09-15T00:00:00.000Z'}
