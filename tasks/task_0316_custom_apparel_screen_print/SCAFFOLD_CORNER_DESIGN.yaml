              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", requested_ship_date: "2026-06-20T00:00:00.000Z" }
              as: ShopManager
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /orders/${order_id}/art-proofs"
              payload: { title: "A", art_hash: "h1" }
              as: ArtStaff
              captures: { proof_a: $.data.id }
            - call: "POST /orders/${order_id}/art-proofs/${proof_a}/submit"
              payload: {}
              as: ArtStaff
            - call: "POST /orders/${order_id}/art-proofs"
              payload: { title: "B", art_hash: "h1b" }
              as: ArtStaff
              captures: { proof_b: $.data.id }
            - call: "POST /orders/${order_id}/art-proofs/${proof_b}/submit"
              payload: {}
              as: ArtStaff
            - call: "POST /orders/${order_id}/art-proofs/${proof_a}/approve"
              payload: { expected_order_version: "${order_v}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/art-proofs/${proof_b}/approve"
              payload: { expected_order_version: "${order_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412; error_id == ERR_STALE_ORDER_VERSION (order.version advanced to 2 after approving proof A)"

