      - '${e1} == ERR_EMPTY_BATCH                 # seal with item_count == 0'
      - '${e2} == ERR_SALVAGE_ITEM_ALREADY_BATCHED  # it1 already sits in B1 (B2 is ACCUMULATING so the item gate surfaces)'
      - 'SalvageBatch.${b1}: MANIFESTED with settlement_value_cents == 0   # 20.0 lb COBRA_HEAD = 1700; 1700 - 4500 transport -> max(0, ...) floor at 0'
      - SalvageBatch.${b1} SETTLED after settle; program budget credited exactly 0 (floor case)
      - '${e3} == ERR_BATCH_NOT_REJECTABLE       # SETTLED is terminal for reject'
      - '${e4} == ERR_BATCH_NOT_ACCUMULATING    # add after settle'
      - '${e6} == ERR_BATCH_NOT_MANIFESTED      # settle requires MANIFESTED (B2 was only SEALED)'
      - '${e5} == ERR_UNWEIGHED_ITEMS           # it2 added without weight (weight_lbs 0)'
