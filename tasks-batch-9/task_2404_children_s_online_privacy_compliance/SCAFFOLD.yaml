# =============================================================================
# task_2404 — Children's Online Privacy Compliance
# Seed tables §1.0–§1.7. Difficulty design → SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# corner design → SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2404. Children's Online Privacy Compliance (child-directed online service operator): child-directed
  determination through audience composition, subject matter and design analysis, age screening
  implementation in a neutral manner without encouraging misstatement, parental notice content and
  direct notice delivery before collection with verifiable consent methods, consent method selection by
  intended data use with higher standards for disclosure to third parties, data minimization limiting
  collection to what is reasonably necessary for participation, parental rights implementation across
  review, deletion and refusal of further collection with verification, third-party integration audit
  including advertising and analytics services operating in child-directed areas, retention and deletion
  policy with defined purposes and secure disposal, safe harbor program participation and annual
  assessment

domain_name: childrens-online-privacy-compliance

# Flat topology: every resource is its own top-level collection. `api_prefix: "/"`
# means paths carry no shared business prefix; parent→child discovery is by
# sub-resource GET under /online-services/{id}/... or by FK-filtered list.
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: access_control_matrix
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # flat: 12 peer collections linked by FK fields in request bodies; no business
  # resource is nested inside another resource's URL path. The only nested paths
  # are read-only reverse-lookup sub-resources under /online-services/{id}/.

  state_machine_shape: parallel
  # OnlineService carries two INDEPENDENT state axes on the same row
  # (determination_status × compliance_posture). Supporting machines add cycles:
  # AgeScreen (IN_REVIEW→REJECTED→DRAFT), ParentalRightsRequest
  # (VERIFYING→VERIFICATION_FAILED→SUBMITTED), SafeHarborAssessment
  # (SUBMITTED→REMEDIATION_REQUIRED→SUBMITTED), and ThirdPartyIntegration
  # (APPROVED→AUDIT_PENDING→APPROVED).

  relationship_patterns:
    - one_to_many          # OnlineService → evidence, screens, notices, consents, records
    - cross_aggregate      # ChildDataRecord references ConsentRequest and ActivityDefinition
    - polymorphic          # DeterminationEvidence.evidence_kind discriminates two field sets

  role_model: segregation_of_duties
  # PrivacyEngineer builds/submits an AgeScreen but cannot activate it;
  # ComplianceOfficer activates it but cannot collect child data;
  # SafeHarborAssessor prepares an assessment but the certifier must be a
  # different X-User-ID (ERR_SEGREGATION_OF_DUTIES).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: OnlineService
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Public name of the online service or property" }
      - { name: operator_organization, type: string, source: input, description: "Legal operator name shown in parental notices" }
      - { name: service_category, type: enum, source: input, description: "GAME | VIDEO_PLATFORM | EDUCATION_APP | SOCIAL_NETWORK | GENERAL_INTEREST_PORTAL", constraints: "one of the five listed values" }
      - { name: subject_matter_code, type: enum, source: input, description: "CHILD_ENTERTAINMENT | CHILD_EDUCATION | FAMILY_MIXED | TEEN_LIFESTYLE | ADULT_GENERAL" }
      - { name: determination_status, type: enum, source: system, description: "Axis 1 of 2. NOT_ASSESSED | GENERAL_AUDIENCE | MIXED_AUDIENCE | CHILD_DIRECTED_PRIMARY — written only by POST /online-services/{id}/determination", default: NOT_ASSESSED }
      - { name: determination_variant_applied, type: enum, source: computed, description: "AUDIENCE_FIRST | DESIGN_FIRST | null — which variant of calculations.child_directed_determination produced determination_status", default: null }
      - { name: design_score, type: number, source: computed, description: "Output of calculations.design_factor_weighted_score, 2 decimals; 0.00 when no DESIGN_FACTOR evidence exists", default: 0.00 }
      - { name: audience_child_share, type: number, source: computed, description: "Output of calculations.audience_child_share, 4 decimals; null when the service has no DeterminationEvidence row with evidence_kind=AUDIENCE_SAMPLE, measurement_method=PANEL and sample_verified=true", default: null }
      - { name: determination_evaluated_at, type: datetime, source: system, description: "Logical-clock instant of the most recent determination run; null before the first run", default: null }
      - { name: compliance_posture, type: enum, source: computed, description: "Axis 2 of 2. OPEN | RESTRICTED | FROZEN — output of calculations.compliance_posture; evolves independently of determination_status", default: OPEN }
      - { name: posture_override, type: enum, source: input, description: "OPEN | RESTRICTED | FROZEN | null — manual regulator lock set by POST /online-services/{id}/posture; when non-null it wins over the computed posture", default: null }
      - { name: active_consent_count, type: integer, source: computed, description: "count(ConsentRequest where service_id=this.id AND status = GRANTED)", default: 0 }
      - { name: granted_disclosure_consent_count, type: integer, source: computed, description: "count(ConsentRequest where service_id=this.id AND status = GRANTED AND intended_uses ∩ {PERSONALIZED_ADVERTISING, THIRD_PARTY_DISCLOSURE, PUBLIC_POSTING} ≠ ∅)", default: 0 }
      - { name: live_child_data_element_count, type: integer, source: computed, description: "count(ChildDataRecord where service_id=this.id AND status IN {COLLECTED, SCHEDULED_FOR_DISPOSAL}) — conserved quantity of compensating_invariant/data_element_conservation", default: 0 }
      - { name: lifetime_collected_element_count, type: integer, source: computed, description: "count(ChildDataRecord where service_id=this.id) over every status including DISPOSED; monotonically non-decreasing", default: 0 }
      - { name: third_party_exposure_points, type: integer, source: computed, description: "Output of calculations.third_party_exposure_points — conserved quantity of compensating_invariant/exposure_point_conservation", default: 0 }
      - { name: open_audit_count, type: integer, source: computed, description: "count(ThirdPartyIntegration where service_id=this.id AND status = AUDIT_PENDING)", default: 0 }
      - { name: audit_decision_count, type: integer, source: computed, description: "Monotonic count of accepted POST /third-party-integrations/{id}/status calls whose to_status ∈ {APPROVED, BLOCKED} for this service", default: 0 }
      - { name: safe_harbor_status, type: enum, source: computed, description: "NOT_ENROLLED | CERTIFIED | ASSESSMENT_DUE | LAPSED — output of calculations.safe_harbor_status", default: NOT_ENROLLED }
      - { name: safe_harbor_expires_at, type: datetime, source: computed, description: "expires_at of the SafeHarborAssessment with status=CERTIFIED and the greatest assessment_year for this service; null when none", default: null }
      - { name: evidence_sequence_counter, type: integer, source: system, description: "Monotonic per-service counter; POST /determination-evidence increments it and stamps DeterminationEvidence.evidence_sequence", default: 0 }
      - { name: compliance_run_sequence, type: integer, source: system, description: "Monotonic per-service counter; POST /compliance-runs increments it before executing its phases", default: 0 }

  - name: DeterminationEvidence
    parent: null
    common_fields: false
    fields:
      - { name: service_id, type: string, source: input, description: "FK -> OnlineService.id; the service this evidence row supports" }
      - { name: evidence_kind, type: enum, source: input, description: "AUDIENCE_SAMPLE | DESIGN_FACTOR — discriminates which field group is required" }
      - { name: evidence_sequence, type: integer, source: system, description: "Per-service monotonic sequence starting at 1; the ONLY ordering key used to pick the latest evidence row (never id, never created_at)" }
      - { name: measurement_method, type: enum, source: input, description: "PANEL | AGE_SCREEN_LOG | SELF_REPORTED — required when evidence_kind=AUDIENCE_SAMPLE, must be absent otherwise", default: null }
      - { name: period_start, type: datetime, source: input, description: "Inclusive start of the measured window; required when evidence_kind=AUDIENCE_SAMPLE", default: null }
      - { name: period_end, type: datetime, source: input, description: "EXCLUSIVE end of the measured window (half-open [period_start, period_end)); required when evidence_kind=AUDIENCE_SAMPLE", default: null }
      - { name: total_users, type: integer, source: input, description: "Measured users in the window; required when evidence_kind=AUDIENCE_SAMPLE; must be >= 1", default: null }
      - { name: users_under_13, type: integer, source: input, description: "Measured users under 13 in the window; required when evidence_kind=AUDIENCE_SAMPLE; must be >= 0 and <= total_users", default: null }
      - { name: sample_verified, type: boolean, source: input, description: "True when the sample was independently verified; only verified PANEL samples feed audience_child_share", default: false }
      - { name: factor_code, type: enum, source: input, description: "SUBJECT_MATTER | VISUAL_CONTENT | CHILD_CELEBRITIES | LANGUAGE | MUSIC_AUDIO | ADVERTISING_PLACEMENT | INTERACTIVE_DESIGN — required when evidence_kind=DESIGN_FACTOR, must be absent otherwise", default: null }
      - { name: rating, type: enum, source: input, description: "ABSENT | INCIDENTAL | MODERATE | STRONG — required when evidence_kind=DESIGN_FACTOR, must be absent otherwise", default: null }
      - { name: evidence_note, type: string, source: input, description: "Free-text provenance note", default: null }

  - name: AgeScreen
    parent: null
    common_fields: true
    fields:
      - { name: service_id, type: string, source: input, description: "FK -> OnlineService.id; the service this screen gates" }
      - { name: mechanism, type: enum, source: input, description: "NEUTRAL_DOB_ENTRY | AGE_RANGE_SELECT | ACCOUNT_AGE_INHERIT" }
      - { name: default_prefilled_age, type: integer, source: input, description: "Age value pre-filled in the form; MUST be null to be neutral", default: null }
      - { name: retry_allowed_on_fail, type: boolean, source: input, description: "Whether a user screened as under 13 may re-answer; true encourages misstatement", default: false }
      - { name: outcome_session_persisted, type: boolean, source: input, description: "Whether the screen outcome is persisted for the session; false lets a user re-answer freely", default: true }
      - { name: inherited_from_verified_account, type: boolean, source: input, description: "Only meaningful for mechanism=ACCOUNT_AGE_INHERIT: the source account was itself age-verified", default: false }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_REVIEW | ACTIVE | REJECTED | RETIRED", default: DRAFT }
      - { name: neutrality_violation_codes, type: array, source: computed, description: "Output of calculations.age_screen_neutrality; subset of {PREFILLED_AGE, RETRY_ALLOWED, OUTCOME_NOT_PERSISTED, UNVERIFIED_INHERIT}", default: "[]" }
      - { name: revision_round, type: integer, source: system, description: "Increments by 1 on each REJECTED -> DRAFT transition", default: 0 }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock instant of the IN_REVIEW -> ACTIVE transition", default: null }

  - name: ParentalNotice
    parent: null
    common_fields: true
    fields:
      - { name: service_id, type: string, source: input, description: "FK -> OnlineService.id; the service this direct notice belongs to" }
      - { name: notice_label, type: string, source: input, description: "Operator-facing label for this notice revision" }
      - { name: delivery_channel, type: enum, source: input, description: "EMAIL | IN_APP_MODAL | POSTAL | SCHOOL_INTERMEDIARY" }
      - { name: content_keys, type: array, source: input, description: "Subset of the 7 required content keys actually present in the notice body" }
      - { name: disclosed_integration_vendors, type: array, source: input, description: "Vendor names named in the notice's third-party disclosure section", default: "[]" }
      - { name: missing_content_keys, type: array, source: computed, description: "REQUIRED_NOTICE_CONTENT_KEYS minus content_keys, ordered as listed in calculations.notice_content_completeness", default: "[]" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | SUPERSEDED", default: DRAFT }
      - { name: published_at, type: datetime, source: system, description: "Logical-clock instant of publication", default: null }

  - name: ActivityDefinition
    parent: null
    common_fields: true
    fields:
      - { name: service_id, type: string, source: input, description: "FK -> OnlineService.id; the service offering this activity" }
      - { name: activity_code, type: string, source: input, description: "Operator activity identifier, unique per service" }
      - { name: participation_required_elements, type: array, source: input, description: "Data element codes reasonably necessary for a child to participate in this activity; the whitelist enforced for purpose_code=PARTICIPATION_CORE" }

  - name: ConsentRequest
    parent: null
    common_fields: true
    fields:
      - { name: service_id, type: string, source: input, description: "FK -> OnlineService.id; the service seeking consent" }
      - { name: notice_id, type: string, source: input, description: "FK -> ParentalNotice.id; the direct-notice revision that will be delivered to the parent" }
      - { name: parent_email, type: string, source: input, description: "Parent contact used for direct notice delivery" }
      - { name: child_pseudonym, type: string, source: input, description: "Operator-side pseudonym for the child; the identity key used by CHILD_IDENTITY_SCOPE deletions" }
      - { name: intended_uses, type: array, source: input, description: "Non-empty subset of {PARTICIPATION_CORE, INTERNAL_OPERATIONS, CONTESTS_PRIZES, PERSONALIZED_ADVERTISING, THIRD_PARTY_DISCLOSURE, PUBLIC_POSTING}" }
      - { name: consent_method, type: enum, source: input, description: "EMAIL_PLUS | SCHOOL_AUTHORIZATION | KNOWLEDGE_BASED_AUTH | SIGNED_FORM_RETURN | PHONE_CALL_TRAINED_PERSONNEL | CREDIT_CARD_TRANSACTION | GOVT_ID_MATCH | VIDEO_CONFERENCE_REVIEW" }
      - { name: method_assurance_tier, type: integer, source: computed, description: "METHOD_ASSURANCE_TIER[consent_method] per calculations.required_consent_tier" }
      - { name: required_tier_at_creation, type: integer, source: computed, description: "Output of calculations.required_consent_tier PINNED at creation; never re-derived at grant time" }
      - { name: status, type: enum, source: system, description: "INITIATED | NOTICE_DELIVERED | PENDING_VERIFICATION | GRANTED | DENIED | EXPIRED | REVOKED | SUPERSEDED", default: INITIATED }
      - { name: notice_delivered_at, type: datetime, source: system, description: "Logical-clock instant of INITIATED -> NOTICE_DELIVERED", default: null }
      - { name: verification_deadline_at, type: datetime, source: computed, description: "notice_delivered_at + CONSENT_VERIFICATION_WINDOW_DAYS days; null before delivery", default: null }
      - { name: secondary_confirmation_received, type: boolean, source: system, description: "Set true when a secondary_confirmation_code is supplied on the PENDING_VERIFICATION -> GRANTED call; required for consent_method=EMAIL_PLUS", default: false }
      - { name: verification_evidence_code, type: string, source: system, description: "Evidence handle recorded at grant; parental-rights verification is compared against consent_method's tier, not against this string", default: null }
      - { name: granted_at, type: datetime, source: system, description: "Logical-clock instant of GRANTED", default: null }
      - { name: revoked_at, type: datetime, source: system, description: "Logical-clock instant of REVOKED", default: null }
      - { name: revocation_reason, type: enum, source: system, description: "PARENT_REFUSAL | DELETION_FULFILLED | SUPERSEDED_BY_NEW_CONSENT | null", default: null }

  - name: ChildDataRecord
    parent: null
    common_fields: true
    fields:
      - { name: service_id, type: string, source: input, description: "FK -> OnlineService.id; the collecting service" }
      - { name: consent_request_id, type: string, source: input, description: "FK -> ConsentRequest.id; the consent this collection relies on" }
      - { name: activity_id, type: string, source: input, description: "FK -> ActivityDefinition.id; the participation activity the element was collected for" }
      - { name: child_pseudonym, type: string, source: system, description: "Copied from the referenced ConsentRequest.child_pseudonym at creation" }
      - { name: data_element_code, type: enum, source: input, description: "PERSISTENT_IDENTIFIER | GEOLOCATION_PRECISE | PHOTO_VIDEO_AUDIO | VOICE_RECORDING | FULL_NAME | EMAIL | SCREEN_NAME | PHONE | POSTAL_ADDRESS | SCHOOL_NAME" }
      - { name: purpose_code, type: enum, source: input, description: "PARTICIPATION_CORE | INTERNAL_OPERATIONS | PERSONALIZED_ADS | CONTESTS | SUPPORT" }
      - { name: age_screen_outcome, type: enum, source: input, description: "UNDER_13 | THIRTEEN_PLUS — the screen result the collecting surface observed" }
      - { name: collected_at, type: datetime, source: system, description: "Logical-clock instant at creation" }
      - { name: retention_days_applied, type: integer, source: system, description: "RetentionSchedule.retention_days copied (version-pinned) from the effective schedule at creation" }
      - { name: disposal_method_applied, type: enum, source: system, description: "RetentionSchedule.disposal_method copied (version-pinned) from the effective schedule at creation" }
      - { name: disposal_due_at, type: datetime, source: computed, description: "collected_at + retention_days_applied days; the record is due when current_utc >= disposal_due_at" }
      - { name: scheduled_run_sequence, type: integer, source: system, description: "OnlineService.compliance_run_sequence of the run that moved this record to SCHEDULED_FOR_DISPOSAL; null while COLLECTED", default: null }
      - { name: disposed_at, type: datetime, source: system, description: "Logical-clock instant of DISPOSED", default: null }
      - { name: status, type: enum, source: system, description: "COLLECTED | SCHEDULED_FOR_DISPOSAL | DISPOSED", default: COLLECTED }

  - name: ParentalRightsRequest
    parent: null
    common_fields: true
    fields:
      - { name: service_id, type: string, source: input, description: "FK -> OnlineService.id; the service the right is exercised against" }
      - { name: consent_request_id, type: string, source: input, description: "FK -> ConsentRequest.id; the consent record the requesting parent holds; for role Parent this MUST equal X-User-ID" }
      - { name: right_type, type: enum, source: input, description: "REVIEW | DELETE | REFUSE_FURTHER_COLLECTION" }
      - { name: requester_email, type: string, source: input, description: "Email asserted by the requester; must equal the consent's parent_email" }
      - { name: verification_method, type: enum, source: system, description: "Same enum as ConsentRequest.consent_method; recorded on SUBMITTED -> VERIFYING", default: null }
      - { name: verification_attempt_count, type: integer, source: system, description: "Increments by 1 on each VERIFYING -> VERIFICATION_FAILED transition; MAX_VERIFICATION_ATTEMPTS caps re-submission", default: 0 }
      - { name: scope_mode, type: enum, source: system, description: "PARENT_CONSENT_SCOPE | CHILD_IDENTITY_SCOPE — recorded from the VERIFIED -> FULFILLED call; selects the variant of calculations.rights_request_scope_resolution", default: null }
      - { name: in_scope_record_count, type: integer, source: computed, description: "Cardinality of the record set that calculations.rights_request_scope_resolution selected at fulfilment", default: null }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VERIFYING | VERIFIED | VERIFICATION_FAILED | FULFILLED | REJECTED", default: SUBMITTED }
      - { name: fulfilled_at, type: datetime, source: system, description: "Logical-clock instant of FULFILLED", default: null }

  - name: ThirdPartyIntegration
    parent: null
    common_fields: true
    fields:
      - { name: service_id, type: string, source: input, description: "FK -> OnlineService.id; the service embedding this vendor" }
      - { name: vendor_name, type: string, source: input, description: "Vendor name; matched against the PUBLISHED notice's disclosed_integration_vendors" }
      - { name: integration_type, type: enum, source: input, description: "BEHAVIORAL_AD_NETWORK | CONTEXTUAL_AD_NETWORK | ANALYTICS | SOCIAL_PLUGIN | CDN" }
      - { name: collects_persistent_identifier, type: boolean, source: input, description: "Whether the SDK collects a persistent identifier" }
      - { name: placement_area, type: enum, source: input, description: "CHILD_DIRECTED_AREA | GENERAL_AREA" }
      - { name: status, type: enum, source: system, description: "DECLARED | AUDIT_PENDING | APPROVED | BLOCKED", default: DECLARED }
      - { name: exposure_points, type: integer, source: computed, description: "INTEGRATION_TYPE_POINTS[integration_type] * (2 if collects_persistent_identifier else 1); counted into OnlineService.third_party_exposure_points only while status = APPROVED" }
      - { name: disclosed_in_notice, type: boolean, source: computed, description: "True when the service has a ParentalNotice with status=PUBLISHED whose disclosed_integration_vendors contains vendor_name", default: false }
      - { name: last_audit_decision_at, type: datetime, source: system, description: "Logical-clock instant of the most recent APPROVED or BLOCKED decision", default: null }
      - { name: audit_note, type: string, source: system, description: "Note recorded with the most recent status call", default: null }

  - name: RetentionSchedule
    parent: null
    common_fields: true
    fields:
      - { name: service_id, type: string, source: input, description: "FK -> OnlineService.id; the service this schedule governs" }
      - { name: data_element_code, type: enum, source: input, description: "Same enum as ChildDataRecord.data_element_code" }
      - { name: purpose_code, type: enum, source: input, description: "Same enum as ChildDataRecord.purpose_code" }
      - { name: retention_days, type: integer, source: input, description: "Days from collected_at until disposal is due; must be >= 1" }
      - { name: disposal_method, type: enum, source: input, description: "CRYPTO_ERASE | OVERWRITE | PHYSICAL_DESTRUCTION | ANONYMIZE; must be listed in ALLOWED_DISPOSAL_METHODS[data_element_code]" }
      - { name: effective_from, type: datetime, source: input, description: "INCLUSIVE start of the schedule's effective range" }
      - { name: effective_to, type: datetime, source: input, description: "INCLUSIVE end of the schedule's effective range; must be > effective_from" }
      - { name: defined_purpose_statement, type: string, source: input, description: "Written purpose the retention period serves; non-empty" }

  - name: SafeHarborProgram
    parent: null
    common_fields: true
    fields:
      - { name: program_name, type: string, source: input, description: "Name of the safe harbor program" }
      - { name: regulator_approved, type: boolean, source: input, description: "Whether the program itself is regulator-approved; certification is refused when false" }
      - { name: annual_assessment_required, type: boolean, source: input, description: "Whether members owe a yearly assessment", default: true }
      - { name: assessment_validity_days, type: integer, source: input, description: "Days a certification remains valid", default: 365 }
      - { name: assessment_grace_days, type: integer, source: input, description: "Days after expiry before the member is treated as LAPSED", default: 30 }

  - name: SafeHarborAssessment
    parent: null
    common_fields: true
    fields:
      - { name: service_id, type: string, source: input, description: "FK -> OnlineService.id; the assessed service" }
      - { name: program_id, type: string, source: input, description: "FK -> SafeHarborProgram.id; the program running the assessment" }
      - { name: assessment_year, type: integer, source: input, description: "Calendar year of the assessment; unique per (service_id, program_id)" }
      - { name: preparer_user_id, type: string, source: system, description: "X-User-ID of the SafeHarborAssessor that created the assessment" }
      - { name: certifier_user_id, type: string, source: system, description: "X-User-ID of the SafeHarborCertifier that certified it; MUST differ from preparer_user_id", default: null }
      - { name: findings_open_count, type: integer, source: system, description: "Open findings recorded on the DRAFT -> SUBMITTED or REMEDIATION_REQUIRED -> SUBMITTED call", default: 0 }
      - { name: remediation_round, type: integer, source: system, description: "Increments by 1 on each SUBMITTED -> REMEDIATION_REQUIRED transition; MAX_REMEDIATION_ROUNDS forces FAILED", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | REMEDIATION_REQUIRED | CERTIFIED | FAILED", default: DRAFT }
      - { name: certified_at, type: datetime, source: system, description: "Logical-clock instant of certification", default: null }
      - { name: expires_at, type: datetime, source: computed, description: "certified_at + SafeHarborProgram.assessment_validity_days days; null until certified", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  # OnlineService — PARALLEL dimensions: determination_status × compliance_posture
  # ---------------------------------------------------------------------------
  - entity: OnlineService
    initial_state: "determination_status=NOT_ASSESSED × compliance_posture=OPEN"
    terminal_states: []
    note: |
      Two independent axes on the same row. Axis A (determination_status) is written ONLY by
      POST /online-services/{id}/determination and may move between any pair of its values on
      re-determination. Axis B (compliance_posture) is written ONLY by recomputation of
      calculations.compliance_posture (triggered by posture_override changes, integration status
      changes, and safe-harbor clock movement) and never by axis A alone except through the
      cascade documented on the determination transitions.
    transitions:
      - from: "determination_status=NOT_ASSESSED"
        to: "determination_status=GENERAL_AUDIENCE | MIXED_AUDIENCE | CHILD_DIRECTED_PRIMARY"
        trigger: "POST /online-services/{id}/determination"
        actor: ComplianceOfficer
        preconditions:
          - "At least one DeterminationEvidence row for this service with evidence_kind=DESIGN_FACTOR, OR at least one row with evidence_kind=AUDIENCE_SAMPLE, measurement_method=PANEL and sample_verified=true; otherwise ERR_INSUFFICIENT_EVIDENCE"
        side_effects:
          - "design_score := calculations.design_factor_weighted_score"
          - "audience_child_share := calculations.audience_child_share"
          - "determination_variant_applied := AUDIENCE_FIRST when a verified PANEL sample exists, else DESIGN_FIRST"
          - "determination_status := calculations.child_directed_determination"
          - "determination_evaluated_at := current_utc"
          - "OnlineService.version += 1 (exactly one increment per request, applied after all cascades settle)"
      - from: "determination_status IN {GENERAL_AUDIENCE, MIXED_AUDIENCE, CHILD_DIRECTED_PRIMARY}"
        to: "determination_status = CHILD_DIRECTED_PRIMARY"
        trigger: "POST /online-services/{id}/determination (re-determination on new evidence)"
        actor: ComplianceOfficer
        preconditions:
          - "Same evidence precondition as the first determination"
        side_effects:
          - "CASCADE transitive_cascade/determination_escalation_cascade LINK 1: determination_status := CHILD_DIRECTED_PRIMARY"
          - "LINK 2 (caused by LINK 1): every ThirdPartyIntegration of this service with status=APPROVED AND placement_area=CHILD_DIRECTED_AREA transitions APPROVED -> AUDIT_PENDING with audit_note='re-audit forced by child-directed determination'"
          - "LINK 3 (caused by LINK 2): because those integrations left APPROVED, third_party_exposure_points is recomputed (their points drop out) and open_audit_count is recomputed; open_audit_count >= 1 then forces compliance_posture := RESTRICTED via calculations.compliance_posture"
          - "OnlineService.version += 1"
      - from: "determination_status IN {GENERAL_AUDIENCE, MIXED_AUDIENCE, CHILD_DIRECTED_PRIMARY}"
        to: "determination_status IN {GENERAL_AUDIENCE, MIXED_AUDIENCE}"
        trigger: "POST /online-services/{id}/determination (re-determination on new evidence)"
        actor: ComplianceOfficer
        preconditions:
          - "Same evidence precondition as the first determination"
        side_effects:
          - "design_score, audience_child_share, determination_variant_applied, determination_evaluated_at refreshed"
          - "No integration re-audit cascade (only an escalation to CHILD_DIRECTED_PRIMARY forces re-audit)"
          - "OnlineService.version += 1"
      - from: "compliance_posture = ANY"
        to: "compliance_posture = value of calculations.compliance_posture"
        trigger: "POST /online-services/{id}/posture"
        actor: ComplianceOfficer
        preconditions:
          - "When posture_override = OPEN: open_audit_count == 0, otherwise ERR_OPEN_AUDITS_PRESENT"
        side_effects:
          - "posture_override := request value (may be null to hand control back to the computed posture)"
          - "compliance_posture := calculations.compliance_posture"
          - "OnlineService.version += 1"
      - from: "compliance_posture = ANY"
        to: "compliance_posture = value of calculations.compliance_posture"
        trigger: "system recomputation after any ThirdPartyIntegration status change, SafeHarborAssessment certification, ConsentRequest revocation, ChildDataRecord creation/disposal, or POST /compliance-runs"
        actor: system
        preconditions: []
        side_effects:
          - "All computed counters of §1.1 refreshed, then compliance_posture := calculations.compliance_posture"
          - "OnlineService.version += 1"

  # ---------------------------------------------------------------------------
  # AgeScreen — cyclic (IN_REVIEW -> REJECTED -> DRAFT)
  # ---------------------------------------------------------------------------
  - entity: AgeScreen
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /age-screens/{id}/status with to_status=IN_REVIEW"
        actor: PrivacyEngineer
        preconditions:
          - "Only role PrivacyEngineer may make this transition, otherwise ERR_TRANSITION_ROLE_NOT_PERMITTED"
        side_effects:
          - "neutrality_violation_codes := calculations.age_screen_neutrality (recomputed from current field values)"
      - from: IN_REVIEW
        to: ACTIVE
        trigger: "POST /age-screens/{id}/status with to_status=ACTIVE"
        actor: ComplianceOfficer
        preconditions:
          - "Only role ComplianceOfficer may make this transition, otherwise ERR_TRANSITION_ROLE_NOT_PERMITTED"
          - "neutrality_violation_codes == [] , otherwise ERR_AGE_SCREEN_NOT_NEUTRAL"
        side_effects:
          - "activated_at := current_utc"
          - "Any other AgeScreen of the same service with status=ACTIVE transitions ACTIVE -> RETIRED (at most one ACTIVE screen per service)"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /age-screens/{id}/status with to_status=REJECTED"
        actor: ComplianceOfficer
        preconditions:
          - "Only role ComplianceOfficer may make this transition, otherwise ERR_TRANSITION_ROLE_NOT_PERMITTED"
        side_effects: []
      - from: REJECTED
        to: DRAFT
        trigger: "POST /age-screens/{id}/status with to_status=DRAFT (revision loop)"
        actor: PrivacyEngineer
        preconditions:
          - "revision_round < MAX_SCREEN_REVISION_ROUNDS, otherwise ERR_SCREEN_REVISIONS_EXHAUSTED"
        side_effects:
          - "revision_round += 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /age-screens/{id}/status with to_status=RETIRED, or system retirement when a sibling screen is activated"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

  # ---------------------------------------------------------------------------
  # ParentalNotice — linear with supersede
  # ---------------------------------------------------------------------------
  - entity: ParentalNotice
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /parental-notices/{id}/publish"
        actor: ComplianceOfficer
        preconditions:
          - "missing_content_keys == [] , otherwise ERR_NOTICE_CONTENT_INCOMPLETE"
        side_effects:
          - "published_at := current_utc"
          - "Any other ParentalNotice of the same service with status=PUBLISHED transitions PUBLISHED -> SUPERSEDED (at most one PUBLISHED notice per service)"
          - "Every ThirdPartyIntegration of the same service recomputes disclosed_in_notice against this notice's disclosed_integration_vendors"
          - "OnlineService.version += 1"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system, when a newer notice of the same service is published"
        actor: system
        preconditions: []
        side_effects:
          - "ConsentRequest rows already referencing this notice keep their notice_id (the delivered revision is historical fact)"

  # ---------------------------------------------------------------------------
  # ConsentRequest — branching + revoke/supersede
  # ---------------------------------------------------------------------------
  - entity: ConsentRequest
    initial_state: INITIATED
    terminal_states: [DENIED, EXPIRED, REVOKED, SUPERSEDED]
    transitions:
      - from: INITIATED
        to: NOTICE_DELIVERED
        trigger: "POST /consent-requests/{id}/status with to_status=NOTICE_DELIVERED"
        actor: ComplianceOfficer
        preconditions:
          - "The referenced ParentalNotice has status=PUBLISHED, otherwise ERR_NOTICE_NOT_PUBLISHED (cross-entity: ConsentRequest depends on ParentalNotice)"
          - "When consent_method=SCHOOL_AUTHORIZATION the notice's delivery_channel must be SCHOOL_INTERMEDIARY, otherwise ERR_NOTICE_CHANNEL_INCOMPATIBLE"
        side_effects:
          - "notice_delivered_at := current_utc"
          - "verification_deadline_at := notice_delivered_at + CONSENT_VERIFICATION_WINDOW_DAYS days"
      - from: NOTICE_DELIVERED
        to: PENDING_VERIFICATION
        trigger: "POST /consent-requests/{id}/status with to_status=PENDING_VERIFICATION"
        actor: ComplianceOfficer
        preconditions:
          - "current_utc < verification_deadline_at, otherwise ERR_CONSENT_WINDOW_EXPIRED"
        side_effects: []
      - from: PENDING_VERIFICATION
        to: GRANTED
        trigger: "POST /consent-requests/{id}/status with to_status=GRANTED"
        actor: ComplianceOfficer
        preconditions:
          - "method_assurance_tier >= required_tier_at_creation, otherwise ERR_CONSENT_METHOD_TIER_INSUFFICIENT"
          - "current_utc < verification_deadline_at, otherwise ERR_CONSENT_WINDOW_EXPIRED"
          - "When consent_method=EMAIL_PLUS a secondary_confirmation_code must be present in the request body, otherwise ERR_EMAIL_PLUS_CONFIRMATION_MISSING"
          - "verification_evidence_code must be present in the request body, otherwise ERR_INVALID_REQUEST"
        side_effects:
          - "granted_at := current_utc; verification_evidence_code stored; secondary_confirmation_received := true when a code was supplied"
          - "Any other ConsentRequest of the same (service_id, parent_email, child_pseudonym) with status=GRANTED transitions GRANTED -> SUPERSEDED with revocation_reason=SUPERSEDED_BY_NEW_CONSENT"
          - "OnlineService.active_consent_count and granted_disclosure_consent_count recomputed; OnlineService.version += 1"
      - from: PENDING_VERIFICATION
        to: DENIED
        trigger: "POST /consent-requests/{id}/status with to_status=DENIED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "denial_reason stored in audit fields; no counters change"
      - from: "NOTICE_DELIVERED | PENDING_VERIFICATION"
        to: EXPIRED
        trigger: "POST /compliance-runs (phase 1)"
        actor: system
        preconditions:
          - "current_utc >= verification_deadline_at"
        side_effects:
          - "No counter changes (the consent was never GRANTED)"
      - from: GRANTED
        to: REVOKED
        trigger: "POST /consent-requests/{id}/status with to_status=REVOKED, or cascade from ParentalRightsRequest fulfilment"
        actor: "ComplianceOfficer | system"
        preconditions: []
        side_effects:
          - "revoked_at := current_utc; revocation_reason := PARENT_REFUSAL for the direct call, DELETION_FULFILLED for the cascade"
          - "CASCADE transitive_cascade/deletion_revocation_cascade LINK 4/5 boundary: active_consent_count and granted_disclosure_consent_count recomputed"
          - "LINK 5 (caused by the recomputation): when granted_disclosure_consent_count reaches 0, every ThirdPartyIntegration of this service with status=APPROVED AND placement_area=CHILD_DIRECTED_AREA AND collects_persistent_identifier=true transitions APPROVED -> AUDIT_PENDING"
          - "LINK 6 (caused by LINK 5): third_party_exposure_points and open_audit_count recomputed, then compliance_posture := calculations.compliance_posture"
          - "OnlineService.version += 1"
      - from: "INITIATED | NOTICE_DELIVERED | PENDING_VERIFICATION"
        to: SUPERSEDED
        trigger: "POST /consent-requests (creating a newer request for the same service_id + parent_email + child_pseudonym)"
        actor: system
        preconditions: []
        side_effects:
          - "revocation_reason := SUPERSEDED_BY_NEW_CONSENT"

  # ---------------------------------------------------------------------------
  # ChildDataRecord — two-phase secure disposal
  # ---------------------------------------------------------------------------
  - entity: ChildDataRecord
    initial_state: COLLECTED
    terminal_states: [DISPOSED]
    transitions:
      - from: COLLECTED
        to: SCHEDULED_FOR_DISPOSAL
        trigger: "POST /compliance-runs (phase 2)"
        actor: system
        preconditions:
          - "current_utc >= disposal_due_at (inclusive boundary)"
        side_effects:
          - "scheduled_run_sequence := OnlineService.compliance_run_sequence of this run"
          - "live_child_data_element_count unchanged (SCHEDULED_FOR_DISPOSAL still counts as live)"
      - from: SCHEDULED_FOR_DISPOSAL
        to: DISPOSED
        trigger: "POST /compliance-runs (phase 3)"
        actor: system
        preconditions:
          - "scheduled_run_sequence < OnlineService.compliance_run_sequence of the current run (a record scheduled by THIS run is never disposed by the same run)"
        side_effects:
          - "disposed_at := current_utc; the pinned disposal_method_applied is the method of record"
          - "OnlineService.live_child_data_element_count recomputed (decreases); lifetime_collected_element_count unchanged"
          - "OnlineService.version += 1"
      - from: "COLLECTED | SCHEDULED_FOR_DISPOSAL"
        to: DISPOSED
        trigger: "cascade from ParentalRightsRequest VERIFIED -> FULFILLED with right_type=DELETE"
        actor: system
        preconditions:
          - "The record is in the set selected by calculations.rights_request_scope_resolution"
        side_effects:
          - "disposed_at := current_utc using the pinned disposal_method_applied"
          - "OnlineService.live_child_data_element_count recomputed"

  # ---------------------------------------------------------------------------
  # ParentalRightsRequest — cyclic verification loop
  # ---------------------------------------------------------------------------
  - entity: ParentalRightsRequest
    initial_state: SUBMITTED
    terminal_states: [FULFILLED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VERIFYING
        trigger: "POST /parental-rights-requests/{id}/status with to_status=VERIFYING"
        actor: ComplianceOfficer
        preconditions:
          - "verification_method present in the request body, otherwise ERR_INVALID_REQUEST"
          - "Only role ComplianceOfficer may make this transition, otherwise ERR_TRANSITION_ROLE_NOT_PERMITTED"
        side_effects:
          - "verification_method stored"
      - from: VERIFYING
        to: VERIFIED
        trigger: "POST /parental-rights-requests/{id}/status with to_status=VERIFIED"
        actor: ComplianceOfficer
        preconditions:
          - "ConsentRequest.notice_delivered_at is non-null, otherwise ERR_DIRECT_NOTICE_NOT_DELIVERED (a parent who has not yet been given the direct notice has no consent record to review, delete or refuse)"
          - "METHOD_ASSURANCE_TIER[verification_method] >= METHOD_ASSURANCE_TIER[ConsentRequest.consent_method], otherwise ERR_RIGHTS_VERIFICATION_TIER_INSUFFICIENT (cross-entity: ParentalRightsRequest depends on ConsentRequest)"
          - "requester_email == ConsentRequest.parent_email, otherwise ERR_REQUESTER_EMAIL_MISMATCH"
        side_effects: []
      - from: VERIFYING
        to: VERIFICATION_FAILED
        trigger: "POST /parental-rights-requests/{id}/status with to_status=VERIFICATION_FAILED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "verification_attempt_count += 1"
      - from: VERIFICATION_FAILED
        to: SUBMITTED
        trigger: "POST /parental-rights-requests/{id}/status with to_status=SUBMITTED (parent re-submits)"
        actor: Parent
        preconditions:
          - "verification_attempt_count < MAX_VERIFICATION_ATTEMPTS, otherwise ERR_VERIFICATION_ATTEMPTS_EXHAUSTED"
          - "Only role Parent may make this transition, otherwise ERR_TRANSITION_ROLE_NOT_PERMITTED"
        side_effects:
          - "verification_method := null (a fresh method must be recorded on the next VERIFYING)"
      - from: VERIFICATION_FAILED
        to: REJECTED
        trigger: "POST /parental-rights-requests/{id}/status with to_status=REJECTED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: VERIFIED
        to: FULFILLED
        trigger: "POST /parental-rights-requests/{id}/status with to_status=FULFILLED"
        actor: ComplianceOfficer
        preconditions:
          - "scope_mode present in the request body, otherwise ERR_INVALID_REQUEST"
          - "OnlineService.compliance_posture != FROZEN is NOT required — parental rights are honoured under every posture"
        side_effects:
          - "scope_mode stored; in_scope_record_count := |calculations.rights_request_scope_resolution|"
          - "right_type=REVIEW: no record mutation; the count is the deliverable"
          - "right_type=REFUSE_FURTHER_COLLECTION: the referenced ConsentRequest transitions GRANTED -> REVOKED with revocation_reason=PARENT_REFUSAL; no record is disposed"
          - "right_type=DELETE — CASCADE transitive_cascade/deletion_revocation_cascade: LINK 1 status := FULFILLED"
          - "LINK 2 (caused by LINK 1): every ChildDataRecord in the resolved scope with status IN {COLLECTED, SCHEDULED_FOR_DISPOSAL} transitions to DISPOSED"
          - "LINK 3 (caused by LINK 2): OnlineService.live_child_data_element_count is recomputed from the surviving records"
          - "LINK 4 (caused by LINK 3): when every ChildDataRecord whose consent_request_id equals this request's consent_request_id now has status=DISPOSED, that ConsentRequest transitions GRANTED -> REVOKED with revocation_reason=DELETION_FULFILLED"
          - "LINK 5 (caused by LINK 4): granted_disclosure_consent_count is recomputed; when it reaches 0, every ThirdPartyIntegration of the service with status=APPROVED AND placement_area=CHILD_DIRECTED_AREA AND collects_persistent_identifier=true transitions APPROVED -> AUDIT_PENDING"
          - "LINK 6 (caused by LINK 5): third_party_exposure_points and open_audit_count are recomputed and compliance_posture := calculations.compliance_posture"
          - "fulfilled_at := current_utc; OnlineService.version += 1"

  # ---------------------------------------------------------------------------
  # ThirdPartyIntegration — cyclic re-audit
  # ---------------------------------------------------------------------------
  - entity: ThirdPartyIntegration
    initial_state: DECLARED
    terminal_states: []
    transitions:
      - from: "DECLARED | APPROVED"
        to: AUDIT_PENDING
        trigger: "POST /third-party-integrations/{id}/status with to_status=AUDIT_PENDING, or cascade from determination escalation / disclosure-consent loss"
        actor: "ComplianceOfficer | system"
        preconditions: []
        side_effects:
          - "OnlineService.open_audit_count and third_party_exposure_points recomputed; compliance_posture := calculations.compliance_posture"
          - "OnlineService.version += 1"
      - from: AUDIT_PENDING
        to: APPROVED
        trigger: "POST /third-party-integrations/{id}/status with to_status=APPROVED"
        actor: ComplianceOfficer
        preconditions:
          - "disclosed_in_notice == true, otherwise ERR_INTEGRATION_NOT_DISCLOSED"
          - "When integration_type IN {BEHAVIORAL_AD_NETWORK, SOCIAL_PLUGIN} AND placement_area = CHILD_DIRECTED_AREA AND OnlineService.determination_status IN {MIXED_AUDIENCE, CHILD_DIRECTED_PRIMARY}: OnlineService.granted_disclosure_consent_count >= 1, otherwise ERR_BEHAVIORAL_AD_TIER_UNMET (cross-entity: ThirdPartyIntegration depends on OnlineService)"
          - "OnlineService.compliance_posture != FROZEN, otherwise ERR_POSTURE_FROZEN"
        side_effects:
          - "last_audit_decision_at := current_utc; audit_decision_count += 1"
          - "third_party_exposure_points += this integration's exposure_points; open_audit_count recomputed; compliance_posture := calculations.compliance_posture"
          - "OnlineService.version += 1"
      - from: "AUDIT_PENDING | APPROVED | DECLARED"
        to: BLOCKED
        trigger: "POST /third-party-integrations/{id}/status with to_status=BLOCKED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "last_audit_decision_at := current_utc; audit_decision_count += 1"
          - "third_party_exposure_points recomputed (this integration's points drop out when it was APPROVED); open_audit_count recomputed; compliance_posture := calculations.compliance_posture"
          - "OnlineService.version += 1"

  # ---------------------------------------------------------------------------
  # SafeHarborAssessment — cyclic remediation rounds
  # ---------------------------------------------------------------------------
  - entity: SafeHarborAssessment
    initial_state: DRAFT
    terminal_states: [CERTIFIED, FAILED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /safe-harbor-assessments/{id}/status with to_status=SUBMITTED"
        actor: SafeHarborAssessor
        preconditions:
          - "findings_open_count present in the request body, otherwise ERR_INVALID_REQUEST"
          - "SafeHarborProgram.annual_assessment_required == true, otherwise ERR_ASSESSMENT_NOT_REQUIRED"
          - "Only role SafeHarborAssessor may make this transition, otherwise ERR_TRANSITION_ROLE_NOT_PERMITTED"
        side_effects:
          - "findings_open_count stored"
      - from: SUBMITTED
        to: REMEDIATION_REQUIRED
        trigger: "POST /safe-harbor-assessments/{id}/status with to_status=REMEDIATION_REQUIRED"
        actor: SafeHarborCertifier
        preconditions:
          - "remediation_round < MAX_REMEDIATION_ROUNDS, otherwise ERR_REMEDIATION_ROUNDS_EXHAUSTED"
          - "Only role SafeHarborCertifier may make this transition, otherwise ERR_TRANSITION_ROLE_NOT_PERMITTED"
        side_effects:
          - "remediation_round += 1"
      - from: REMEDIATION_REQUIRED
        to: SUBMITTED
        trigger: "POST /safe-harbor-assessments/{id}/status with to_status=SUBMITTED (next round)"
        actor: SafeHarborAssessor
        preconditions:
          - "findings_open_count present in the request body, otherwise ERR_INVALID_REQUEST"
        side_effects:
          - "findings_open_count overwritten with the new value"
      - from: REMEDIATION_REQUIRED
        to: FAILED
        trigger: "POST /safe-harbor-assessments/{id}/status with to_status=FAILED"
        actor: SafeHarborCertifier
        preconditions:
          - "remediation_round >= MAX_REMEDIATION_ROUNDS"
        side_effects:
          - "OnlineService.safe_harbor_status recomputed; compliance_posture := calculations.compliance_posture"
          - "OnlineService.version += 1"
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /safe-harbor-assessments/{id}/certify"
        actor: SafeHarborCertifier
        preconditions:
          # Clause order below is normative and matches §1.4: priority 116 (findings,
          # then regulator approval) is evaluated BEFORE priority 118 (segregation of
          # duties), so a certification attempt that violates both reports
          # ERR_OPEN_FINDINGS_PRESENT (409), never ERR_SEGREGATION_OF_DUTIES (403).
          - "findings_open_count == 0, otherwise ERR_OPEN_FINDINGS_PRESENT"
          - "SafeHarborProgram.regulator_approved == true, otherwise ERR_PROGRAM_NOT_REGULATOR_APPROVED (cross-entity: SafeHarborAssessment depends on SafeHarborProgram)"
          - "X-User-ID != preparer_user_id, otherwise ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "certifier_user_id := X-User-ID; certified_at := current_utc; expires_at := certified_at + SafeHarborProgram.assessment_validity_days days"
          - "OnlineService.safe_harbor_status and safe_harbor_expires_at recomputed; compliance_posture := calculations.compliance_posture"
          - "OnlineService.version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on OnlineService.version only
# =============================================================================
concurrency_rules:
  - rule_id: notice-create-stale-service
    parent_entity: OnlineService
    write_endpoint: "POST /parental-notices"
    occ_field: "expected_service_version"
    description: |
      Creating a ParentalNotice against an OnlineService whose version has advanced since the
      client last observed it is rejected. This captures the case where another writer has already
      created and published a newer notice revision — which legitimately supersedes the prior
      PUBLISHED notice per the ParentalNotice state machine — so the current writer's view of the
      service (its published notice, its disclosed vendor list) is stale.
    error_id: ERR_STALE_SERVICE_VERSION
    http_status: 412

  - rule_id: consent-create-stale-service
    parent_entity: OnlineService
    write_endpoint: "POST /consent-requests"
    occ_field: "expected_service_version"
    description: |
      Creating a ConsentRequest against an OnlineService whose version has advanced since the
      client last observed it is rejected. A new request for the same
      (service_id, parent_email, child_pseudonym) legitimately supersedes the prior non-terminal
      request and, once granted, the prior GRANTED one; and required_tier_at_creation is pinned
      from the service's approved-integration snapshot. A stale version therefore means the tier
      the client believes it is consenting to no longer matches the service.
    error_id: ERR_STALE_SERVICE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: design_factor_weighted_score
    trigger: "POST /determination-evidence (recompute of OnlineService.design_score) and POST /online-services/{id}/determination"
    algorithm: weighted_scoring
    formula: |
      # Only the LATEST evidence row per factor_code participates. "Latest" is
      # max(evidence_sequence) among rows with evidence_kind=DESIGN_FACTOR for this
      # service. evidence_sequence is a per-service monotonic integer, so no tie is
      # possible; id is NEVER used for ordering.
      present = { factor_code -> rating of the row with max(evidence_sequence) }
      if present is empty: design_score = 0.00
      present_points = sum(FACTOR_POINTS[f] for f in present.keys())
      # ROUNDING ORDER IS PINNED: round EACH factor contribution to 2 decimals
      # (ROUND_HALF_UP) FIRST, then sum, then round the sum to 2 decimals.
      # The alternative order (sum the unrounded contributions, then round once)
      # is explicitly REJECTED and yields different scores.
      for f, r in present:
        contribution[f] = round_half_up( (FACTOR_POINTS[f] / present_points) * RATING_VALUE[r], 2 )
      design_score = round_half_up( sum(contribution.values()), 2 )
    input_set: "DeterminationEvidence rows with evidence_kind=DESIGN_FACTOR for this service_id; exactly one row per factor_code (the max evidence_sequence); rows for other services excluded; rating=ABSENT contributes 0.00 but still counts its points into present_points"
    constants:
      FACTOR_POINTS: { SUBJECT_MATTER: 30, VISUAL_CONTENT: 20, CHILD_CELEBRITIES: 15, LANGUAGE: 10, MUSIC_AUDIO: 10, ADVERTISING_PLACEMENT: 10, INTERACTIVE_DESIGN: 5 }
      RATING_VALUE: { ABSENT: 0.00, INCIDENTAL: 0.25, MODERATE: 0.60, STRONG: 1.00 }
    precision: "contributions and score both 2 decimal places, ROUND_HALF_UP; contributions rounded BEFORE summation"

  - name: audience_child_share
    trigger: "POST /determination-evidence and POST /online-services/{id}/determination"
    algorithm: aggregation
    formula: |
      panel = DeterminationEvidence rows where service_id = S
              AND evidence_kind = AUDIENCE_SAMPLE
              AND measurement_method = PANEL
              AND sample_verified = true
      if panel is empty: audience_child_share = null
      else:
        audience_child_share = round_half_up( sum(r.users_under_13 for r in panel)
                                            / sum(r.total_users   for r in panel), 4 )
    input_set: "Verified PANEL samples only. measurement_method IN {AGE_SCREEN_LOG, SELF_REPORTED} and sample_verified=false rows are stored as evidence but NEVER enter this aggregate, because an age-screen log is only as reliable as the screen that produced it."
    constants: {}
    precision: "4 decimal places, ROUND_HALF_UP; the ratio is computed once over summed numerators and denominators (never averaged per sample)"

  - name: child_directed_determination
    trigger: "POST /online-services/{id}/determination"
    algorithm: threshold
    formula: |
      # Variant selection is decided by evidence availability, and the two variants
      # produce DIFFERENT determination_status values for identical design evidence.
      if audience_child_share is not null:            # variant AUDIENCE_FIRST
        if audience_child_share >= PRIMARY_SHARE_THRESHOLD:  status = CHILD_DIRECTED_PRIMARY
        elif audience_child_share >= MIXED_SHARE_THRESHOLD:  status = MIXED_AUDIENCE
        elif design_score >= DESIGN_ESCALATION_THRESHOLD:    status = MIXED_AUDIENCE
        else:                                                status = GENERAL_AUDIENCE
      elif at least one DESIGN_FACTOR evidence row exists:   # variant DESIGN_FIRST
        if design_score >= DESIGN_PRIMARY_THRESHOLD:         status = CHILD_DIRECTED_PRIMARY
        elif design_score >= DESIGN_MIXED_THRESHOLD:         status = MIXED_AUDIENCE
        else:                                                status = GENERAL_AUDIENCE
      else:
        reject with ERR_INSUFFICIENT_EVIDENCE
    input_set: "design_score and audience_child_share as computed above for this service only"
    constants:
      PRIMARY_SHARE_THRESHOLD: 0.4000
      MIXED_SHARE_THRESHOLD: 0.2000
      DESIGN_ESCALATION_THRESHOLD: 0.65
      DESIGN_PRIMARY_THRESHOLD: 0.75
      DESIGN_MIXED_THRESHOLD: 0.45
    precision: "all comparisons use >= (a share of exactly 0.4000 IS primary; a design_score of exactly 0.45 IS mixed)"
    variants:
      - name: AUDIENCE_FIRST
        when: "the service has >= 1 DeterminationEvidence row with evidence_kind=AUDIENCE_SAMPLE, measurement_method=PANEL and sample_verified=true"
        difference: "measured composition leads; design evidence can only escalate GENERAL_AUDIENCE to MIXED_AUDIENCE and can NEVER reach CHILD_DIRECTED_PRIMARY"
      - name: DESIGN_FIRST
        when: "the service has no verified PANEL sample but >= 1 DESIGN_FACTOR row"
        difference: "design evidence alone decides and CAN reach CHILD_DIRECTED_PRIMARY at design_score >= 0.75"

  - name: age_screen_neutrality
    trigger: "POST /age-screens and POST /age-screens/{id}/status with to_status=IN_REVIEW"
    algorithm: constraint_propagation
    formula: |
      codes = []
      if default_prefilled_age is not null:          codes += [PREFILLED_AGE]
      if retry_allowed_on_fail == true:              codes += [RETRY_ALLOWED]
      if outcome_session_persisted == false:         codes += [OUTCOME_NOT_PERSISTED]
      if mechanism == ACCOUNT_AGE_INHERIT
         and inherited_from_verified_account == false: codes += [UNVERIFIED_INHERIT]
      neutrality_violation_codes = codes ordered as
        [PREFILLED_AGE, RETRY_ALLOWED, OUTCOME_NOT_PERSISTED, UNVERIFIED_INHERIT]
    input_set: "the AgeScreen row's own field values at the moment of the call"
    constants: {}
    precision: "exact boolean/null comparisons; the order of codes is fixed as listed"

  - name: notice_content_completeness
    trigger: "POST /parental-notices and POST /parental-notices/{id}/publish"
    algorithm: aggregation
    formula: |
      missing_content_keys = [k for k in REQUIRED_NOTICE_CONTENT_KEYS if k not in content_keys]
      # order follows REQUIRED_NOTICE_CONTENT_KEYS as declared, never input order
    input_set: "the ParentalNotice row's content_keys array only"
    constants:
      REQUIRED_NOTICE_CONTENT_KEYS: [OPERATOR_IDENTITY_CONTACT, ELEMENTS_COLLECTED, USE_PURPOSES, THIRD_PARTY_DISCLOSURE, PARENTAL_RIGHTS, NO_CONDITIONING_OF_PARTICIPATION, RETENTION_AND_DISPOSAL]
    precision: "exact set difference; duplicates in content_keys are ignored"

  - name: required_consent_tier
    trigger: "POST /consent-requests (pins ConsentRequest.required_tier_at_creation and method_assurance_tier)"
    algorithm: threshold
    formula: |
      base_tier = max( USE_TIER[u] for u in intended_uses )
      # Circular-looking dependency, EVALUATION ORDER PINNED:
      #   base_tier -> +1 bump from currently APPROVED integrations -> capped at 3
      # and the snapshot of APPROVED integrations is taken at THIS request's
      # creation instant and then FROZEN on the row. It is never re-derived at
      # grant time, even though approving an integration later would raise the
      # bump, and even though approving that integration itself depends on
      # granted_disclosure_consent_count (which depends on granted consents).
      # The reciprocal half of the cycle is pinned in the integration audit gate:
      # that gate evaluates the APPROVED set EXCLUDING the integration under audit.
      bump = 1 if exists ThirdPartyIntegration i where i.service_id = S
                    AND i.status = APPROVED
                    AND i.collects_persistent_identifier = true
                    AND i.integration_type IN {BEHAVIORAL_AD_NETWORK, ANALYTICS, SOCIAL_PLUGIN}
             else 0
      required_tier_at_creation = min(base_tier + bump, MAX_TIER)
      method_assurance_tier     = METHOD_ASSURANCE_TIER[consent_method]
    input_set: "intended_uses of the request being created, plus ThirdPartyIntegration rows of the same service with status=APPROVED at the creation instant; integrations approved after creation are excluded by the pin"
    constants:
      USE_TIER: { PARTICIPATION_CORE: 1, INTERNAL_OPERATIONS: 1, CONTESTS_PRIZES: 2, PERSONALIZED_ADVERTISING: 3, THIRD_PARTY_DISCLOSURE: 3, PUBLIC_POSTING: 3 }
      METHOD_ASSURANCE_TIER: { EMAIL_PLUS: 1, SCHOOL_AUTHORIZATION: 1, KNOWLEDGE_BASED_AUTH: 2, SIGNED_FORM_RETURN: 2, PHONE_CALL_TRAINED_PERSONNEL: 2, CREDIT_CARD_TRANSACTION: 3, GOVT_ID_MATCH: 3, VIDEO_CONFERENCE_REVIEW: 3 }
      MAX_TIER: 3
    precision: "integer arithmetic; the grant gate compares method_assurance_tier >= required_tier_at_creation"

  - name: third_party_exposure_points
    trigger: "any ThirdPartyIntegration status change, and POST /third-party-integrations"
    algorithm: aggregation
    formula: |
      integration.exposure_points = INTEGRATION_TYPE_POINTS[integration_type]
                                    * (2 if collects_persistent_identifier else 1)
      OnlineService.third_party_exposure_points =
          sum( i.exposure_points for i in ThirdPartyIntegration
               where i.service_id = S AND i.status = APPROVED )
      # DECLARED, AUDIT_PENDING and BLOCKED integrations contribute 0.
    input_set: "ThirdPartyIntegration rows of this service with status=APPROVED only"
    constants:
      INTEGRATION_TYPE_POINTS: { BEHAVIORAL_AD_NETWORK: 40, SOCIAL_PLUGIN: 25, ANALYTICS: 15, CONTEXTUAL_AD_NETWORK: 5, CDN: 0 }
      POSTURE_RESTRICT_POINTS: 40
      POSTURE_FREEZE_POINTS: 80
    precision: "integer arithmetic; thresholds compare with >= (exactly 40 restricts, exactly 80 freezes)"

  - name: compliance_posture
    trigger: "posture_override change, any ThirdPartyIntegration status change, ConsentRequest grant/revoke, ChildDataRecord creation/disposal, SafeHarborAssessment certification/failure, POST /compliance-runs"
    algorithm: constraint_propagation
    formula: |
      # STRICTLY ORDERED; the first matching clause wins.
      1. if posture_override is not null:                       return posture_override
      2. if third_party_exposure_points >= 80:                   return FROZEN
      3. if open_audit_count >= 1:                               return RESTRICTED
      4. if third_party_exposure_points >= 40:                   return RESTRICTED
      5. if safe_harbor_status == LAPSED:                        return RESTRICTED
      6. return OPEN
    input_set: "the OnlineService row's own recomputed counters (already refreshed before this calculation runs in the same request)"
    constants: {}
    precision: "clause order is normative; >= boundaries at 40 and 80"

  - name: rights_request_scope_resolution
    trigger: "POST /parental-rights-requests/{id}/status with to_status=FULFILLED"
    algorithm: aggregation
    formula: |
      C = the ConsentRequest referenced by request.consent_request_id
      if scope_mode == PARENT_CONSENT_SCOPE:
        scope = ChildDataRecord rows where consent_request_id = C.id
                                    AND status IN {COLLECTED, SCHEDULED_FOR_DISPOSAL}
      if scope_mode == CHILD_IDENTITY_SCOPE:
        scope = ChildDataRecord rows where service_id = C.service_id
                                    AND child_pseudonym = C.child_pseudonym
                                    AND status IN {COLLECTED, SCHEDULED_FOR_DISPOSAL}
      in_scope_record_count = |scope|
      # Records already DISPOSED are excluded from both variants.
      # Disposal order within the scope is by (collected_at ASC, created_at ASC);
      # id is never used for ordering. The order does not change the resulting set.
    input_set: "ChildDataRecord rows as filtered above; DISPOSED rows always excluded"
    constants: {}
    precision: "set cardinality, exact"
    variants:
      - name: PARENT_CONSENT_SCOPE
        when: "the fulfilment call supplies scope_mode=PARENT_CONSENT_SCOPE"
        difference: "only records collected under the single consent the requesting parent holds; records for the same child gathered under a superseded or school-authorization consent survive"
      - name: CHILD_IDENTITY_SCOPE
        when: "the fulfilment call supplies scope_mode=CHILD_IDENTITY_SCOPE"
        difference: "every record for that child_pseudonym on the service, across all consent records — a strictly larger set whenever the child has more than one consent record"

  - name: record_disposal_schedule
    trigger: "POST /child-data-records (pins the schedule) and POST /compliance-runs (phases 2 and 3)"
    algorithm: chronological
    formula: |
      # At collection:
      effective = the RetentionSchedule row where service_id = S
                    AND data_element_code = record.data_element_code
                    AND purpose_code = record.purpose_code
                    AND effective_from <= current_utc <= effective_to     (CLOSED range)
      if no such row: reject with ERR_NO_RETENTION_SCHEDULE
      retention_days_applied  = effective.retention_days      # version-pinned copy
      disposal_method_applied = effective.disposal_method      # version-pinned copy
      disposal_due_at         = collected_at + retention_days_applied days
      # In a compliance run with run_sequence = R (processing records of one service
      # in (collected_at ASC, created_at ASC) order):
      phase 2: COLLECTED rows with current_utc >= disposal_due_at
                 -> SCHEDULED_FOR_DISPOSAL, scheduled_run_sequence = R
      phase 3: SCHEDULED_FOR_DISPOSAL rows with scheduled_run_sequence < R
                 -> DISPOSED, disposed_at = current_utc
      # Consequence: a record first becomes due in run R and is only destroyed in
      # run R+1 — secure disposal always takes two runs.
    input_set: "ChildDataRecord rows of the run's service_id with status IN {COLLECTED, SCHEDULED_FOR_DISPOSAL}; DISPOSED rows are skipped"
    constants: {}
    precision: "due comparison is INCLUSIVE (>=): a record whose disposal_due_at equals current_utc to the millisecond IS due"

  - name: safe_harbor_status
    trigger: "SafeHarborAssessment certification or failure, POST /_clock/set_current_utc, POST /compliance-runs"
    algorithm: threshold
    formula: |
      A = the SafeHarborAssessment row for this service with status=CERTIFIED and the greatest
          assessment_year; if two rows share the greatest assessment_year, the one with the
          later certified_at wins (certified_at is unique per service-year in practice; id is
          never used as a tie-break)
      if the service has no SafeHarborAssessment row at all:      NOT_ENROLLED
      elif A does not exist (no CERTIFIED row):                    ASSESSMENT_DUE
      elif current_utc < A.expires_at:                             CERTIFIED
      elif current_utc < A.expires_at + program.assessment_grace_days days: ASSESSMENT_DUE
      else:                                                        LAPSED
      safe_harbor_expires_at = A.expires_at if A exists else null
    input_set: "SafeHarborAssessment rows of this service in any status, plus the referenced SafeHarborProgram's assessment_grace_days"
    constants: {}
    precision: "both clock comparisons are strict `<`; at exactly expires_at the service is ASSESSMENT_DUE, at exactly expires_at + grace it is LAPSED"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "The acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 30
    category: auth
    check: "Role Parent may only read or act on a ConsentRequest whose id equals X-User-ID, and on a ParentalRightsRequest whose consent_request_id equals X-User-ID"
    error_id: ERR_NOT_CONSENT_HOLDER
    http_status: 403
    applies_to: "GET /consent-requests/{id}, GET /parental-rights-requests/{id}, POST /parental-rights-requests, POST /parental-rights-requests/{id}/status"

  - priority: 40
    category: existence
    check: "Path ids resolve, left to right"
    error_id: "ERR_SERVICE_NOT_FOUND / ERR_AGE_SCREEN_NOT_FOUND / ERR_NOTICE_NOT_FOUND / ERR_CONSENT_NOT_FOUND / ERR_RECORD_NOT_FOUND / ERR_RIGHTS_REQUEST_NOT_FOUND / ERR_INTEGRATION_NOT_FOUND / ERR_ASSESSMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 50
    category: existence
    check: "Body foreign keys resolve, in declaration order: service_id, then notice_id, then consent_request_id, then activity_id, then program_id"
    error_id: "ERR_SERVICE_NOT_FOUND / ERR_NOTICE_NOT_FOUND / ERR_CONSENT_NOT_FOUND / ERR_ACTIVITY_NOT_FOUND / ERR_PROGRAM_NOT_FOUND"
    http_status: 404
    applies_to: "POST /determination-evidence, POST /age-screens, POST /parental-notices, POST /activities, POST /consent-requests, POST /child-data-records, POST /parental-rights-requests, POST /third-party-integrations, POST /retention-schedules, POST /safe-harbor-assessments, POST /compliance-runs"

  - priority: 55
    category: business_referential
    check: "Cross-parent coherence: a referenced ConsentRequest and ActivityDefinition must belong to the service_id given in the body"
    error_id: ERR_SERVICE_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /child-data-records, POST /parental-rights-requests, POST /consent-requests"

  - priority: 60
    category: state
    check: "expected_service_version equals the current OnlineService.version"
    error_id: ERR_STALE_SERVICE_VERSION
    http_status: 412
    applies_to: "POST /parental-notices, POST /consent-requests"

  - priority: 65
    category: business_constraint
    check: "Required body fields present and well-typed for the endpoint, including polymorphic field groups: evidence_kind=AUDIENCE_SAMPLE requires measurement_method, period_start, period_end, total_users, users_under_13 and forbids factor_code/rating; evidence_kind=DESIGN_FACTOR requires factor_code and rating and forbids the sample fields"
    error_id: "ERR_INVALID_REQUEST / ERR_EVIDENCE_FIELDS_MISMATCH"
    http_status: 422
    applies_to: "all POST endpoints; ERR_EVIDENCE_FIELDS_MISMATCH only POST /determination-evidence"

  - priority: 70
    category: state
    check: "The target entity's current status permits the requested transition per §1.2"
    error_id: "ERR_INVALID_STATE / ERR_NOTICE_NOT_PUBLISHED / ERR_CONSENT_NOT_GRANTED / ERR_CONSENT_REVOKED / ERR_RIGHTS_REQUEST_NOT_VERIFIED"
    http_status: 409
    applies_to: "all POST .../status, POST /parental-notices/{id}/publish, POST /safe-harbor-assessments/{id}/certify, POST /child-data-records"

  - priority: 72
    category: state
    check: "Per-transition role restriction: the acting role must be the actor declared for that specific from->to transition in §1.2"
    error_id: ERR_TRANSITION_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "POST /age-screens/{id}/status, POST /parental-rights-requests/{id}/status, POST /safe-harbor-assessments/{id}/status"

  - priority: 75
    category: state
    check: "Posture gate: when OnlineService.compliance_posture = FROZEN, POST /child-data-records, POST /consent-requests and integration approval are refused; when RESTRICTED, POST /child-data-records is refused unless purpose_code = PARTICIPATION_CORE"
    error_id: "ERR_POSTURE_FROZEN / ERR_POSTURE_RESTRICTED"
    http_status: 409
    applies_to: "POST /child-data-records, POST /consent-requests, POST /third-party-integrations/{id}/status"

  - priority: 80
    category: business_safety
    check: "Determination gate on collection: determination_status=NOT_ASSESSED is refused; determination_status=GENERAL_AUDIENCE is refused"
    error_id: "ERR_DETERMINATION_NOT_MADE / ERR_SERVICE_NOT_CHILD_DIRECTED"
    http_status: 409
    applies_to: "POST /child-data-records"

  - priority: 85
    category: business_safety
    check: "Age screening gate on collection: when determination_status=MIXED_AUDIENCE the service must have an AgeScreen with status=ACTIVE and age_screen_outcome must be UNDER_13; when determination_status=CHILD_DIRECTED_PRIMARY every visitor is treated as a child, so age_screen_outcome=THIRTEEN_PLUS is refused outright"
    error_id: "ERR_AGE_SCREEN_NOT_ACTIVE / ERR_NOT_CHILD_SUBJECT / ERR_AGE_SCREEN_NOT_PERMITTED"
    http_status: 422
    applies_to: "POST /child-data-records"

  - priority: 88
    category: business_safety
    check: "Age screen neutrality: a screen may not be activated while neutrality_violation_codes is non-empty"
    error_id: ERR_AGE_SCREEN_NOT_NEUTRAL
    http_status: 422
    applies_to: "POST /age-screens/{id}/status with to_status=ACTIVE"

  - priority: 90
    category: business_safety
    check: "Direct-notice-before-collection and consent-quality gates, evaluated in this clause order: (1) the referenced ConsentRequest.notice_delivered_at must be non-null — enforced both on collection and on parental-rights VERIFYING -> VERIFIED, since a parent who has not yet received the direct notice has no consent record to review, delete or refuse; (2) the consent method's assurance tier must reach required_tier_at_creation; (3) EMAIL_PLUS needs its secondary confirmation; (4) parental-rights verification must reach the consent method's tier; (5) requester_email must match. (Collection against a REVOKED consent is caught earlier, at priority 70, with ERR_CONSENT_REVOKED / 409.)"
    error_id: "ERR_DIRECT_NOTICE_NOT_DELIVERED / ERR_CONSENT_METHOD_TIER_INSUFFICIENT / ERR_EMAIL_PLUS_CONFIRMATION_MISSING / ERR_RIGHTS_VERIFICATION_TIER_INSUFFICIENT / ERR_REQUESTER_EMAIL_MISMATCH"
    http_status: 422
    applies_to: "POST /child-data-records, POST /consent-requests/{id}/status, POST /parental-rights-requests/{id}/status"

  - priority: 95
    category: business_safety
    check: "Third-party integration audit gate: approving a BEHAVIORAL_AD_NETWORK or SOCIAL_PLUGIN placed in a CHILD_DIRECTED_AREA on a MIXED_AUDIENCE or CHILD_DIRECTED_PRIMARY service requires granted_disclosure_consent_count >= 1, evaluated over the APPROVED set EXCLUDING the integration under audit"
    error_id: ERR_BEHAVIORAL_AD_TIER_UNMET
    http_status: 422
    applies_to: "POST /third-party-integrations/{id}/status with to_status=APPROVED"

  - priority: 100
    category: business_temporal
    check: "Half-open interval overlap on audience samples: a new AUDIENCE_SAMPLE row is refused when, for the same (service_id, measurement_method), an existing row satisfies new.period_start < existing.period_end AND existing.period_start < new.period_end. Touching endpoints (new.period_start == existing.period_end) are ALLOWED. period_end must be > period_start."
    error_id: "ERR_SAMPLE_PERIOD_OVERLAP / ERR_INVALID_PERIOD"
    http_status: "409 for ERR_SAMPLE_PERIOD_OVERLAP, 422 for ERR_INVALID_PERIOD"
    applies_to: "POST /determination-evidence"

  - priority: 102
    category: business_temporal
    check: "Closed interval + 1-day handover buffer on retention schedules: a new row is refused when, for the same (service_id, data_element_code, purpose_code), an existing row does NOT satisfy (new.effective_from >= existing.effective_to + 1 day OR new.effective_to + 1 day <= existing.effective_from). Both ends are inclusive and same-day adjacency is a CONFLICT."
    error_id: ERR_RETENTION_SCHEDULE_OVERLAP
    http_status: 409
    applies_to: "POST /retention-schedules"

  - priority: 104
    category: business_temporal
    check: "Consent verification window: the notice-delivery deadline must not have passed"
    error_id: ERR_CONSENT_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /consent-requests/{id}/status with to_status IN {PENDING_VERIFICATION, GRANTED}"

  - priority: 105
    category: business_referential
    check: "The integration's vendor_name must appear in the disclosed_integration_vendors of the service's PUBLISHED ParentalNotice (disclosed_in_notice == true) before approval"
    error_id: ERR_INTEGRATION_NOT_DISCLOSED
    http_status: 422
    applies_to: "POST /third-party-integrations/{id}/status with to_status=APPROVED"

  - priority: 106
    category: business_temporal
    check: "At most one SafeHarborAssessment per (service_id, program_id, assessment_year)"
    error_id: ERR_ASSESSMENT_YEAR_DUPLICATE
    http_status: 409
    applies_to: "POST /safe-harbor-assessments"

  - priority: 110
    category: business_constraint
    check: "Data minimization: for purpose_code=PARTICIPATION_CORE the data_element_code must be listed in the ActivityDefinition's participation_required_elements; for every other purpose_code the consent's intended_uses must include PURPOSE_USE_MAP[purpose_code]"
    error_id: "ERR_ELEMENT_NOT_REASONABLY_NECESSARY / ERR_PURPOSE_NOT_CONSENTED"
    http_status: 422
    applies_to: "POST /child-data-records"

  - priority: 112
    category: business_constraint
    check: "Notice content completeness on publish, and disposal-method admissibility on schedule creation (disposal_method must be listed in ALLOWED_DISPOSAL_METHODS[data_element_code]); retention_days >= 1; effective_to > effective_from"
    error_id: "ERR_NOTICE_CONTENT_INCOMPLETE / ERR_DISPOSAL_METHOD_NOT_PERMITTED / ERR_INVALID_PERIOD"
    http_status: 422
    applies_to: "POST /parental-notices/{id}/publish, POST /retention-schedules"

  - priority: 114
    category: business_constraint
    check: "Loop bounds: MAX_VERIFICATION_ATTEMPTS on parental-rights re-submission, MAX_REMEDIATION_ROUNDS on assessment remediation, MAX_SCREEN_REVISION_ROUNDS on age-screen revision"
    error_id: "ERR_VERIFICATION_ATTEMPTS_EXHAUSTED / ERR_REMEDIATION_ROUNDS_EXHAUSTED / ERR_SCREEN_REVISIONS_EXHAUSTED"
    http_status: 409
    applies_to: "POST /parental-rights-requests/{id}/status, POST /safe-harbor-assessments/{id}/status, POST /age-screens/{id}/status"

  - priority: 116
    category: business_constraint
    check: "Safe harbor gates: posture_override=OPEN requires open_audit_count == 0; certification requires findings_open_count == 0 and a regulator-approved program; submission requires annual_assessment_required == true"
    error_id: "ERR_OPEN_AUDITS_PRESENT / ERR_OPEN_FINDINGS_PRESENT / ERR_PROGRAM_NOT_REGULATOR_APPROVED / ERR_ASSESSMENT_NOT_REQUIRED"
    http_status: 409
    applies_to: "POST /online-services/{id}/posture, POST /safe-harbor-assessments/{id}/certify, POST /safe-harbor-assessments/{id}/status"

  - priority: 118
    category: business_constraint
    check: "Segregation of duties: the certifying X-User-ID must differ from SafeHarborAssessment.preparer_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /safe-harbor-assessments/{id}/certify"

  - priority: 120
    category: business_constraint
    check: "A RetentionSchedule effective at the collection instant must exist for the (data_element_code, purpose_code) pair"
    error_id: ERR_NO_RETENTION_SCHEDULE
    http_status: 409
    applies_to: "POST /child-data-records"

  - priority: 130
    category: business_constraint
    check: "Determination requires evidence: at least one DESIGN_FACTOR row or one verified PANEL sample"
    error_id: ERR_INSUFFICIENT_EVIDENCE
    http_status: 422
    applies_to: "POST /online-services/{id}/determination"

# =============================================================================
# §1.5 API Endpoint Table  (flat collections; sub-resource GETs are read-only)
# =============================================================================
endpoints:
  # --- OnlineService -------------------------------------------------------
  - method: POST
    path: "/online-services"
    description: "Register an online service under compliance management"
    roles: [ComplianceOfficer]
    code: 201
    input: [name, operator_organization, service_category, subject_matter_code]
    output: OnlineService
    side_effects:
      - "determination_status=NOT_ASSESSED, compliance_posture=OPEN, posture_override=null"
      - "all counters 0, design_score=0.00, audience_child_share=null, safe_harbor_status=NOT_ENROLLED, version=1"

  - method: GET
    path: "/online-services"
    description: "List services with filtering and pagination"
    roles: [ComplianceOfficer, PrivacyEngineer, SafeHarborAssessor, SafeHarborCertifier]
    code: 200
    input: ["determination_status?", "compliance_posture?", "safe_harbor_status?", "limit?", "offset?"]
    output: OnlineService[]
    side_effects: []

  - method: GET
    path: "/online-services/{id}"
    description: "Read one service including every computed counter and both state axes"
    roles: [ComplianceOfficer, PrivacyEngineer, SafeHarborAssessor, SafeHarborCertifier]
    code: 200
    input: []
    output: OnlineService
    side_effects: []

  - method: POST
    path: "/online-services/{id}/determination"
    description: "Run the child-directed determination from the service's current evidence; writes only the determination axis"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: OnlineService
    side_effects:
      - "design_score, audience_child_share, determination_variant_applied, determination_status, determination_evaluated_at refreshed"
      - "On escalation to CHILD_DIRECTED_PRIMARY: APPROVED integrations in CHILD_DIRECTED_AREA -> AUDIT_PENDING, then exposure/open-audit recompute, then posture recompute"
      - "increments OnlineService.version by 1"

  - method: POST
    path: "/online-services/{id}/posture"
    description: "Set or clear the manual posture override; writes only the posture axis"
    roles: [ComplianceOfficer]
    code: 200
    input: [posture_override]
    output: OnlineService
    side_effects:
      - "posture_override stored (null clears it), then compliance_posture recomputed"
      - "increments OnlineService.version by 1"

  - method: GET
    path: "/online-services/{id}/determination-evidence"
    description: "Reverse lookup: evidence rows of this service, ordered by evidence_sequence ASC"
    roles: [ComplianceOfficer, PrivacyEngineer]
    code: 200
    input: ["evidence_kind?", "measurement_method?", "limit?", "offset?"]
    output: DeterminationEvidence[]
    side_effects: []

  - method: GET
    path: "/online-services/{id}/age-screens"
    description: "Reverse lookup: age screens of this service"
    roles: [ComplianceOfficer, PrivacyEngineer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AgeScreen[]
    side_effects: []

  - method: GET
    path: "/online-services/{id}/parental-notices"
    description: "Reverse lookup: parental notice revisions of this service"
    roles: [ComplianceOfficer, PrivacyEngineer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ParentalNotice[]
    side_effects: []

  - method: GET
    path: "/online-services/{id}/activities"
    description: "Reverse lookup: activity definitions of this service"
    roles: [ComplianceOfficer, PrivacyEngineer]
    code: 200
    input: ["limit?", "offset?"]
    output: ActivityDefinition[]
    side_effects: []

  - method: GET
    path: "/online-services/{id}/retention-schedules"
    description: "Reverse lookup: retention schedules of this service"
    roles: [ComplianceOfficer, PrivacyEngineer]
    code: 200
    input: ["data_element_code?", "purpose_code?", "limit?", "offset?"]
    output: RetentionSchedule[]
    side_effects: []

  - method: GET
    path: "/online-services/{id}/third-party-integrations"
    description: "Reverse lookup: declared third-party integrations of this service"
    roles: [ComplianceOfficer, PrivacyEngineer]
    code: 200
    input: ["status?", "integration_type?", "placement_area?", "limit?", "offset?"]
    output: ThirdPartyIntegration[]
    side_effects: []

  # --- DeterminationEvidence ----------------------------------------------
  - method: POST
    path: "/determination-evidence"
    description: "Append one evidence row (audience sample or design factor); append-only, never updated"
    roles: [ComplianceOfficer]
    code: 201
    input: [service_id, evidence_kind, "measurement_method?", "period_start?", "period_end?", "total_users?", "users_under_13?", "sample_verified?", "factor_code?", "rating?", "evidence_note?"]
    output: DeterminationEvidence
    side_effects:
      - "OnlineService.evidence_sequence_counter += 1 and is stamped onto evidence_sequence"
      - "OnlineService.design_score and audience_child_share recomputed; determination_status is NOT changed"
      - "increments OnlineService.version by 1"

  # --- AgeScreen -----------------------------------------------------------
  - method: POST
    path: "/age-screens"
    description: "Declare an age screening implementation in DRAFT"
    roles: [PrivacyEngineer]
    code: 201
    input: [service_id, mechanism, "default_prefilled_age?", "retry_allowed_on_fail?", "outcome_session_persisted?", "inherited_from_verified_account?"]
    output: AgeScreen
    side_effects:
      - "status=DRAFT, revision_round=0, neutrality_violation_codes computed"

  - method: POST
    path: "/age-screens/{id}/status"
    description: "Advance the age screen lifecycle (DRAFT -> IN_REVIEW -> ACTIVE | REJECTED -> DRAFT -> ... , ACTIVE -> RETIRED)"
    roles: [PrivacyEngineer, ComplianceOfficer]
    code: 200
    input: [to_status, "review_note?"]
    output: AgeScreen
    side_effects:
      - "Transition per the AgeScreen state machine; activation retires the previously ACTIVE screen; REJECTED -> DRAFT increments revision_round"

  # --- ParentalNotice -----------------------------------------------------
  - method: POST
    path: "/parental-notices"
    description: "Draft a parental notice revision (OCC-guarded: a newer revision supersedes the published one)"
    roles: [ComplianceOfficer]
    code: 201
    input: [service_id, notice_label, delivery_channel, content_keys, "disclosed_integration_vendors?", expected_service_version]
    output: ParentalNotice
    side_effects:
      - "status=DRAFT, missing_content_keys computed"
      - "increments OnlineService.version by 1"

  - method: POST
    path: "/parental-notices/{id}/publish"
    description: "Publish the notice revision; supersedes the prior published revision"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ParentalNotice
    side_effects:
      - "status=PUBLISHED, published_at set; prior PUBLISHED notice of the service -> SUPERSEDED"
      - "every ThirdPartyIntegration of the service recomputes disclosed_in_notice"
      - "increments OnlineService.version by 1"

  # --- ActivityDefinition -------------------------------------------------
  - method: POST
    path: "/activities"
    description: "Define a participation activity and the element whitelist that is reasonably necessary for it"
    roles: [ComplianceOfficer]
    code: 201
    input: [service_id, activity_code, participation_required_elements]
    output: ActivityDefinition
    side_effects: []

  # --- ConsentRequest -----------------------------------------------------
  - method: POST
    path: "/consent-requests"
    description: "Open a verifiable-consent request (OCC-guarded; pins required_tier_at_creation and supersedes the parent's prior non-terminal request)"
    roles: [ComplianceOfficer]
    code: 201
    input: [service_id, notice_id, parent_email, child_pseudonym, intended_uses, consent_method, expected_service_version]
    output: ConsentRequest
    side_effects:
      - "status=INITIATED; method_assurance_tier and required_tier_at_creation pinned"
      - "prior ConsentRequest of the same (service_id, parent_email, child_pseudonym) in INITIATED/NOTICE_DELIVERED/PENDING_VERIFICATION -> SUPERSEDED"
      - "increments OnlineService.version by 1"

  - method: GET
    path: "/consent-requests"
    description: "FK-filtered list of consent requests"
    roles: [ComplianceOfficer, PrivacyEngineer, SafeHarborAssessor]
    code: 200
    input: ["service_id?", "notice_id?", "parent_email?", "child_pseudonym?", "status?", "limit?", "offset?"]
    output: ConsentRequest[]
    side_effects: []

  - method: GET
    path: "/consent-requests/{id}"
    description: "Read one consent request; role Parent may read only its own (id == X-User-ID)"
    roles: [ComplianceOfficer, PrivacyEngineer, Parent]
    code: 200
    input: []
    output: ConsentRequest
    side_effects: []

  - method: POST
    path: "/consent-requests/{id}/status"
    description: "Advance the consent lifecycle (deliver direct notice, open verification, grant, deny, revoke)"
    roles: [ComplianceOfficer]
    code: 200
    input: [to_status, "secondary_confirmation_code?", "verification_evidence_code?", "denial_reason?", "revocation_reason?"]
    output: ConsentRequest
    side_effects:
      - "Transition per the ConsentRequest state machine, including grant-time supersede and revocation cascade"
      - "increments OnlineService.version by 1 on transitions that change its counters"

  # --- ChildDataRecord ----------------------------------------------------
  - method: POST
    path: "/child-data-records"
    description: "Record one collected data element about a child; enforces notice, consent, screening, minimization, posture and retention gates"
    roles: [PrivacyEngineer]
    code: 201
    input: [service_id, consent_request_id, activity_id, data_element_code, purpose_code, age_screen_outcome]
    output: ChildDataRecord
    side_effects:
      - "child_pseudonym copied from the consent; collected_at=current_utc"
      - "retention_days_applied and disposal_method_applied pinned from the effective RetentionSchedule; disposal_due_at computed"
      - "OnlineService.live_child_data_element_count and lifetime_collected_element_count recomputed; posture recomputed"
      - "increments OnlineService.version by 1"

  - method: GET
    path: "/child-data-records"
    description: "FK-filtered list of collected records"
    roles: [ComplianceOfficer, PrivacyEngineer]
    code: 200
    input: ["service_id?", "consent_request_id?", "activity_id?", "child_pseudonym?", "status?", "limit?", "offset?"]
    output: ChildDataRecord[]
    side_effects: []

  - method: GET
    path: "/child-data-records/{id}"
    description: "Read one collected record including its pinned retention terms"
    roles: [ComplianceOfficer, PrivacyEngineer]
    code: 200
    input: []
    output: ChildDataRecord
    side_effects: []

  # --- ParentalRightsRequest ---------------------------------------------
  - method: POST
    path: "/parental-rights-requests"
    description: "Parent exercises review, deletion or refusal of further collection"
    roles: [Parent]
    code: 201
    input: [service_id, consent_request_id, right_type, requester_email]
    output: ParentalRightsRequest
    side_effects:
      - "status=SUBMITTED, verification_attempt_count=0"

  - method: GET
    path: "/parental-rights-requests"
    description: "FK-filtered list of parental rights requests"
    roles: [ComplianceOfficer, PrivacyEngineer]
    code: 200
    input: ["service_id?", "consent_request_id?", "right_type?", "status?", "limit?", "offset?"]
    output: ParentalRightsRequest[]
    side_effects: []

  - method: GET
    path: "/parental-rights-requests/{id}"
    description: "Read one parental rights request; role Parent may read only requests tied to its own consent"
    roles: [ComplianceOfficer, Parent]
    code: 200
    input: []
    output: ParentalRightsRequest
    side_effects: []

  - method: POST
    path: "/parental-rights-requests/{id}/status"
    description: "Drive verification and fulfilment of a parental rights request (cyclic verification loop)"
    roles: [ComplianceOfficer, Parent]
    code: 200
    input: [to_status, "verification_method?", "scope_mode?", "rejection_reason?"]
    output: ParentalRightsRequest
    side_effects:
      - "Transition per the ParentalRightsRequest state machine"
      - "FULFILLED with right_type=DELETE runs the six-link deletion cascade"
      - "increments OnlineService.version by 1 on fulfilment"

  # --- ThirdPartyIntegration --------------------------------------------
  - method: POST
    path: "/third-party-integrations"
    description: "Declare an advertising, analytics or other third-party integration operating on the service"
    roles: [ComplianceOfficer]
    code: 201
    input: [service_id, vendor_name, integration_type, collects_persistent_identifier, placement_area]
    output: ThirdPartyIntegration
    side_effects:
      - "status=DECLARED; exposure_points and disclosed_in_notice computed; the service's exposure total is unchanged while not APPROVED"
      - "increments OnlineService.version by 1"

  - method: POST
    path: "/third-party-integrations/{id}/status"
    description: "Record an audit decision or force re-audit (DECLARED/APPROVED -> AUDIT_PENDING -> APPROVED | BLOCKED)"
    roles: [ComplianceOfficer]
    code: 200
    input: [to_status, "audit_note?"]
    output: ThirdPartyIntegration
    side_effects:
      - "Transition per the ThirdPartyIntegration state machine; APPROVED/BLOCKED bump audit_decision_count"
      - "third_party_exposure_points, open_audit_count and compliance_posture recomputed"
      - "increments OnlineService.version by 1"

  # --- RetentionSchedule -------------------------------------------------
  - method: POST
    path: "/retention-schedules"
    description: "Publish a retention and secure-disposal schedule for one (element, purpose) pair over a closed effective range"
    roles: [ComplianceOfficer]
    code: 201
    input: [service_id, data_element_code, purpose_code, retention_days, disposal_method, effective_from, effective_to, defined_purpose_statement]
    output: RetentionSchedule
    side_effects: []

  # --- compliance run (ops-run checkpoint) ------------------------------
  - method: POST
    path: "/compliance-runs"
    description: "Advance the service's compliance epoch: phase 1 expire stale consents, phase 2 schedule due records, phase 3 dispose records scheduled by an EARLIER run, phase 4 recompute counters and posture"
    roles: [ComplianceOfficer, PrivacyEngineer]
    code: 200
    input: [service_id]
    output: "{ service_id: string, run_sequence: integer, expired_consent_count: integer, scheduled_count: integer, disposed_count: integer, live_child_data_element_count_after: integer, compliance_posture_after: string }"
    side_effects:
      - "OnlineService.compliance_run_sequence += 1 before the phases execute"
      - "ConsentRequest NOTICE_DELIVERED/PENDING_VERIFICATION past deadline -> EXPIRED"
      - "ChildDataRecord COLLECTED and due -> SCHEDULED_FOR_DISPOSAL; SCHEDULED_FOR_DISPOSAL from an earlier run -> DISPOSED"
      - "increments OnlineService.version by 1"

  # --- Safe harbor -------------------------------------------------------
  - method: POST
    path: "/safe-harbor-programs"
    description: "Register a safe harbor program the operator can participate in"
    roles: [ComplianceOfficer]
    code: 201
    input: [program_name, regulator_approved, "annual_assessment_required?", "assessment_validity_days?", "assessment_grace_days?"]
    output: SafeHarborProgram
    side_effects: []

  - method: POST
    path: "/safe-harbor-assessments"
    description: "Open an annual assessment in DRAFT; the acting assessor becomes preparer_user_id"
    roles: [SafeHarborAssessor]
    code: 201
    input: [service_id, program_id, assessment_year]
    output: SafeHarborAssessment
    side_effects:
      - "status=DRAFT, preparer_user_id=X-User-ID, remediation_round=0, findings_open_count=0"
      - "OnlineService.safe_harbor_status recomputed (NOT_ENROLLED -> ASSESSMENT_DUE); increments OnlineService.version by 1"

  - method: GET
    path: "/safe-harbor-assessments"
    description: "FK-filtered list of assessments"
    roles: [ComplianceOfficer, SafeHarborAssessor, SafeHarborCertifier]
    code: 200
    input: ["service_id?", "program_id?", "assessment_year?", "status?", "limit?", "offset?"]
    output: SafeHarborAssessment[]
    side_effects: []

  - method: GET
    path: "/safe-harbor-assessments/{id}"
    description: "Read one assessment including preparer, certifier and expiry"
    roles: [ComplianceOfficer, SafeHarborAssessor, SafeHarborCertifier]
    code: 200
    input: []
    output: SafeHarborAssessment
    side_effects: []

  - method: POST
    path: "/safe-harbor-assessments/{id}/status"
    description: "Submit an assessment, send it back for remediation, resubmit the next round, or fail it"
    roles: [SafeHarborAssessor, SafeHarborCertifier]
    code: 200
    input: [to_status, "findings_open_count?", "remediation_note?"]
    output: SafeHarborAssessment
    side_effects:
      - "Transition per the SafeHarborAssessment state machine; REMEDIATION_REQUIRED increments remediation_round"

  - method: POST
    path: "/safe-harbor-assessments/{id}/certify"
    description: "Certify a submitted assessment; the certifier must not be the preparer"
    roles: [SafeHarborCertifier]
    code: 200
    input: []
    output: SafeHarborAssessment
    side_effects:
      - "status=CERTIFIED, certifier_user_id=X-User-ID, certified_at=current_utc, expires_at=certified_at + program.assessment_validity_days days"
      - "OnlineService.safe_harbor_status, safe_harbor_expires_at and compliance_posture recomputed; increments OnlineService.version by 1"

  # --- test-driving endpoint --------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock's startup default is EXACTLY 2026-08-01T00:00:00Z; before any call to this endpoint every timestamp, deadline and expiry comparison uses that default and NEVER real wall-clock time. Moving the clock recomputes safe_harbor_status and compliance_posture for every service."
    roles: [ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "logical clock set; safe_harbor_status and compliance_posture recomputed for every OnlineService"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or the role is not one of the five declared roles" }
  - { id: ERR_ROLE_NOT_PERMITTED, http: 403, condition: "The acting role is not listed for the endpoint in §1.5" }
  - { id: ERR_NOT_CONSENT_HOLDER, http: 403, condition: "Role Parent addressed a ConsentRequest or ParentalRightsRequest that is not tied to its own X-User-ID" }
  - { id: ERR_TRANSITION_ROLE_NOT_PERMITTED, http: 403, condition: "The acting role is allowed on the endpoint but not for this specific from->to transition" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The certifying X-User-ID equals SafeHarborAssessment.preparer_user_id" }
  - { id: ERR_SERVICE_NOT_FOUND, http: 404, condition: "service_id in the path or body does not resolve" }
  - { id: ERR_AGE_SCREEN_NOT_FOUND, http: 404, condition: "age screen id in the path does not resolve" }
  - { id: ERR_NOTICE_NOT_FOUND, http: 404, condition: "notice id in the path or body does not resolve" }
  - { id: ERR_ACTIVITY_NOT_FOUND, http: 404, condition: "activity_id in the body does not resolve" }
  - { id: ERR_CONSENT_NOT_FOUND, http: 404, condition: "consent request id in the path or body does not resolve" }
  - { id: ERR_RECORD_NOT_FOUND, http: 404, condition: "child data record id in the path does not resolve" }
  - { id: ERR_RIGHTS_REQUEST_NOT_FOUND, http: 404, condition: "parental rights request id in the path does not resolve" }
  - { id: ERR_INTEGRATION_NOT_FOUND, http: 404, condition: "third-party integration id in the path does not resolve" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "program_id in the body does not resolve" }
  - { id: ERR_ASSESSMENT_NOT_FOUND, http: 404, condition: "assessment id in the path does not resolve" }
  - { id: ERR_STALE_SERVICE_VERSION, http: 412, condition: "expected_service_version does not equal the current OnlineService.version" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "A required body field is absent, of the wrong type, or carries a value outside its declared enum" }
  - { id: ERR_EVIDENCE_FIELDS_MISMATCH, http: 422, condition: "The evidence payload does not match its evidence_kind field group (missing required fields, or fields belonging to the other kind)" }
  - { id: ERR_SERVICE_SCOPE_MISMATCH, http: 422, condition: "A referenced ConsentRequest or ActivityDefinition belongs to a different service than the body's service_id" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "The requested transition is not declared from the entity's current status" }
  - { id: ERR_NOTICE_NOT_PUBLISHED, http: 409, condition: "Direct notice delivery attempted while the referenced ParentalNotice is not PUBLISHED" }
  - { id: ERR_NOTICE_CHANNEL_INCOMPATIBLE, http: 422, condition: "consent_method=SCHOOL_AUTHORIZATION with a notice whose delivery_channel is not SCHOOL_INTERMEDIARY" }
  - { id: ERR_CONSENT_NOT_GRANTED, http: 409, condition: "Collection attempted against a consent whose status is not GRANTED and not REVOKED" }
  - { id: ERR_CONSENT_REVOKED, http: 409, condition: "Collection attempted against a consent whose status is REVOKED" }
  - { id: ERR_RIGHTS_REQUEST_NOT_VERIFIED, http: 409, condition: "Fulfilment attempted from a status other than VERIFIED" }
  - { id: ERR_POSTURE_FROZEN, http: 409, condition: "Operation refused because OnlineService.compliance_posture is FROZEN" }
  - { id: ERR_POSTURE_RESTRICTED, http: 409, condition: "Collection with purpose_code other than PARTICIPATION_CORE refused because compliance_posture is RESTRICTED" }
  - { id: ERR_DETERMINATION_NOT_MADE, http: 409, condition: "Collection attempted while determination_status is NOT_ASSESSED" }
  - { id: ERR_SERVICE_NOT_CHILD_DIRECTED, http: 409, condition: "Collection attempted while determination_status is GENERAL_AUDIENCE" }
  - { id: ERR_AGE_SCREEN_NOT_ACTIVE, http: 422, condition: "A MIXED_AUDIENCE service has no AgeScreen with status=ACTIVE at collection time" }
  - { id: ERR_AGE_SCREEN_NOT_PERMITTED, http: 422, condition: "age_screen_outcome=THIRTEEN_PLUS supplied on a CHILD_DIRECTED_PRIMARY service, where every visitor must be treated as a child" }
  - { id: ERR_NOT_CHILD_SUBJECT, http: 422, condition: "age_screen_outcome=THIRTEEN_PLUS supplied on a MIXED_AUDIENCE service, so the subject is outside the child-data surface" }
  - { id: ERR_AGE_SCREEN_NOT_NEUTRAL, http: 422, condition: "Activation attempted while neutrality_violation_codes is non-empty" }
  - { id: ERR_DIRECT_NOTICE_NOT_DELIVERED, http: 422, condition: "Collection, or parental-rights VERIFYING -> VERIFIED, attempted against a consent whose notice_delivered_at is null" }
  - { id: ERR_CONSENT_METHOD_TIER_INSUFFICIENT, http: 422, condition: "method_assurance_tier < required_tier_at_creation at grant time" }
  - { id: ERR_EMAIL_PLUS_CONFIRMATION_MISSING, http: 422, condition: "Grant of an EMAIL_PLUS consent without secondary_confirmation_code" }
  - { id: ERR_RIGHTS_VERIFICATION_TIER_INSUFFICIENT, http: 422, condition: "The parental-rights verification_method's tier is below the tier of the consent's own consent_method" }
  - { id: ERR_REQUESTER_EMAIL_MISMATCH, http: 422, condition: "requester_email does not equal the consent's parent_email" }
  - { id: ERR_BEHAVIORAL_AD_TIER_UNMET, http: 422, condition: "Approving a BEHAVIORAL_AD_NETWORK or SOCIAL_PLUGIN in a CHILD_DIRECTED_AREA of a child-directed service while granted_disclosure_consent_count is 0" }
  - { id: ERR_INTEGRATION_NOT_DISCLOSED, http: 422, condition: "Approving an integration whose vendor_name is absent from the PUBLISHED notice's disclosed_integration_vendors" }
  - { id: ERR_SAMPLE_PERIOD_OVERLAP, http: 409, condition: "A new AUDIENCE_SAMPLE half-open period overlaps an existing period for the same (service_id, measurement_method)" }
  - { id: ERR_RETENTION_SCHEDULE_OVERLAP, http: 409, condition: "A new retention schedule's closed effective range is not separated by at least one day from an existing range for the same (service_id, data_element_code, purpose_code)" }
  - { id: ERR_INVALID_PERIOD, http: 422, condition: "period_end <= period_start, effective_to <= effective_from, or retention_days < 1" }
  - { id: ERR_CONSENT_WINDOW_EXPIRED, http: 409, condition: "current_utc >= verification_deadline_at on a PENDING_VERIFICATION or GRANTED transition" }
  - { id: ERR_ASSESSMENT_YEAR_DUPLICATE, http: 409, condition: "An assessment already exists for this (service_id, program_id, assessment_year)" }
  - { id: ERR_ELEMENT_NOT_REASONABLY_NECESSARY, http: 422, condition: "purpose_code=PARTICIPATION_CORE with a data_element_code outside the activity's participation_required_elements" }
  - { id: ERR_PURPOSE_NOT_CONSENTED, http: 422, condition: "A non-participation purpose_code whose mapped use is absent from the consent's intended_uses" }
  - { id: ERR_NOTICE_CONTENT_INCOMPLETE, http: 422, condition: "Publish attempted while missing_content_keys is non-empty" }
  - { id: ERR_DISPOSAL_METHOD_NOT_PERMITTED, http: 422, condition: "disposal_method is not listed in ALLOWED_DISPOSAL_METHODS for the data_element_code" }
  - { id: ERR_NO_RETENTION_SCHEDULE, http: 409, condition: "No retention schedule is effective at the collection instant for the (element, purpose) pair" }
  - { id: ERR_VERIFICATION_ATTEMPTS_EXHAUSTED, http: 409, condition: "Re-submission attempted with verification_attempt_count >= MAX_VERIFICATION_ATTEMPTS" }
  - { id: ERR_REMEDIATION_ROUNDS_EXHAUSTED, http: 409, condition: "Remediation attempted with remediation_round >= MAX_REMEDIATION_ROUNDS" }
  - { id: ERR_SCREEN_REVISIONS_EXHAUSTED, http: 409, condition: "REJECTED -> DRAFT attempted with revision_round >= MAX_SCREEN_REVISION_ROUNDS" }
  - { id: ERR_OPEN_AUDITS_PRESENT, http: 409, condition: "posture_override=OPEN attempted while open_audit_count >= 1" }
  - { id: ERR_OPEN_FINDINGS_PRESENT, http: 409, condition: "Certification attempted with findings_open_count > 0" }
  - { id: ERR_PROGRAM_NOT_REGULATOR_APPROVED, http: 409, condition: "Certification attempted under a program whose regulator_approved is false" }
  - { id: ERR_ASSESSMENT_NOT_REQUIRED, http: 409, condition: "Submission attempted under a program whose annual_assessment_required is false" }
  - { id: ERR_INSUFFICIENT_EVIDENCE, http: 422, condition: "Determination attempted with no DESIGN_FACTOR row and no verified PANEL sample" }

# Domain constants referenced by §1.2 preconditions and §1.4 checks.
domain_constants:
  CONSENT_VERIFICATION_WINDOW_DAYS: 14
  MAX_VERIFICATION_ATTEMPTS: 3
  MAX_REMEDIATION_ROUNDS: 2
  MAX_SCREEN_REVISION_ROUNDS: 2
  PURPOSE_USE_MAP:
    PARTICIPATION_CORE: PARTICIPATION_CORE
    INTERNAL_OPERATIONS: INTERNAL_OPERATIONS
    SUPPORT: INTERNAL_OPERATIONS
    CONTESTS: CONTESTS_PRIZES
    PERSONALIZED_ADS: PERSONALIZED_ADVERTISING
  ALLOWED_DISPOSAL_METHODS:
    PERSISTENT_IDENTIFIER: [CRYPTO_ERASE, OVERWRITE, ANONYMIZE]
    GEOLOCATION_PRECISE: [CRYPTO_ERASE, OVERWRITE]
    PHOTO_VIDEO_AUDIO: [CRYPTO_ERASE, PHYSICAL_DESTRUCTION]
    VOICE_RECORDING: [CRYPTO_ERASE, PHYSICAL_DESTRUCTION]
    FULL_NAME: [CRYPTO_ERASE, OVERWRITE]
    EMAIL: [CRYPTO_ERASE, OVERWRITE]
    SCREEN_NAME: [CRYPTO_ERASE, OVERWRITE, ANONYMIZE]
    PHONE: [CRYPTO_ERASE, OVERWRITE]
    POSTAL_ADDRESS: [CRYPTO_ERASE, OVERWRITE, PHYSICAL_DESTRUCTION]
    SCHOOL_NAME: [CRYPTO_ERASE, OVERWRITE, ANONYMIZE]

# =============================================================================
# §1.7 RBAC Matrix — segregation of duties
# =============================================================================
roles:
  - name: ComplianceOfficer
    description: "Owns determination, notices, activities, consent lifecycle, integration audits, retention schedules, posture and compliance runs. Cannot collect child data and cannot build an age screen."
    identity: opaque
    exclusive_operations:
      - "POST /online-services — register a service"
      - "POST /online-services/{id}/determination — run the child-directed determination"
      - "POST /online-services/{id}/posture — set or clear the posture override"
      - "POST /determination-evidence — append determination evidence"
      - "POST /parental-notices, POST /parental-notices/{id}/publish — notice authoring and publication"
      - "POST /activities — define participation activities"
      - "POST /consent-requests, POST /consent-requests/{id}/status — consent lifecycle"
      - "POST /third-party-integrations, POST /third-party-integrations/{id}/status — integration declaration and audit decisions"
      - "POST /retention-schedules — retention and disposal policy"
      - "POST /safe-harbor-programs — register a safe harbor program"
      - "POST /_clock/set_current_utc — logical clock control"
      - "POST /age-screens/{id}/status with to_status IN {ACTIVE, REJECTED, RETIRED} — screen approval authority"
      - "POST /parental-rights-requests/{id}/status with to_status IN {VERIFYING, VERIFIED, VERIFICATION_FAILED, FULFILLED, REJECTED}"
    shared_operations:
      - "POST /compliance-runs — shared with PrivacyEngineer"
      - "All GET endpoints except that Parent-scoped reads are restricted by ERR_NOT_CONSENT_HOLDER"

  - name: PrivacyEngineer
    description: "Implements the age screen and performs the actual data collection. Cannot approve its own screen and cannot touch consent, notices or audits."
    identity: opaque
    exclusive_operations:
      - "POST /age-screens — declare an age screening implementation"
      - "POST /age-screens/{id}/status with to_status IN {IN_REVIEW, DRAFT} — submit for review and revise after rejection"
      - "POST /child-data-records — record a collected data element"
    shared_operations:
      - "POST /compliance-runs — shared with ComplianceOfficer"
      - "GET /online-services, GET /online-services/{id} and all reverse-lookup GETs, GET /consent-requests, GET /consent-requests/{id}, GET /child-data-records, GET /child-data-records/{id}, GET /parental-rights-requests"

  - name: Parent
    description: "The verified parent. X-User-ID is the id of the ConsentRequest the parent holds, so ownership checks compare X-User-ID against ConsentRequest.id and ParentalRightsRequest.consent_request_id."
    identity: "entity_backed:ConsentRequest"
    exclusive_operations:
      - "POST /parental-rights-requests — exercise review, deletion or refusal of further collection"
      - "POST /parental-rights-requests/{id}/status with to_status=SUBMITTED — re-submit after a failed verification"
    shared_operations:
      - "GET /consent-requests/{id} — own consent only"
      - "GET /parental-rights-requests/{id} — own requests only"

  - name: SafeHarborAssessor
    description: "Prepares the annual safe harbor assessment. Becomes preparer_user_id and is therefore barred from certifying it."
    identity: opaque
    exclusive_operations:
      - "POST /safe-harbor-assessments — open an assessment"
      - "POST /safe-harbor-assessments/{id}/status with to_status=SUBMITTED — submit or resubmit"
    shared_operations:
      - "GET /safe-harbor-assessments, GET /safe-harbor-assessments/{id}, GET /online-services, GET /online-services/{id}, GET /consent-requests"

  - name: SafeHarborCertifier
    description: "Reviews and certifies assessments. Must be a different X-User-ID from the preparer (ERR_SEGREGATION_OF_DUTIES)."
    identity: opaque
    exclusive_operations:
      - "POST /safe-harbor-assessments/{id}/certify — certify a submitted assessment"
      - "POST /safe-harbor-assessments/{id}/status with to_status IN {REMEDIATION_REQUIRED, FAILED}"
    shared_operations:
      - "GET /safe-harbor-assessments, GET /safe-harbor-assessments/{id}, GET /online-services, GET /online-services/{id}"
