# =============================================================================
# PRD Benchmark Scaffold — task_3143
# Hospital Safety Grade Survey Submission & Public Rating Methodology
# =============================================================================

scenario: |
  Hospital Safety Grade Survey Submission & Public Rating Methodology (Leapfrog
  Group): voluntary hospital survey submission with sections on computerized
  order entry, staffing, infection prevention and surgical volume, survey
  response verification with source documentation and reanalysis requests,
  measure sourcing from public reporting programs when a hospital does not
  submit, scoring methodology with measure weighting and standardization across
  a peer distribution, letter grade assignment with periodic release cycles and
  embargo handling, hospital review of preliminary results with correction
  windows before publication, methodology change management and its effect on
  year-over-year comparability, employer and purchaser use of grades in network
  and benefit design

domain_name: hospital-safety-grade-survey
api_prefix: /hospital-safety-rating

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - version_pinning_on_approval
    - scheduled_deferred_actions
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities with foreign key references; no nesting in URL paths.
  state_machine_shape: compound
  # ReleaseCycle.state is derived from the aggregate states of its child Grade
  # and HospitalReview rows; Survey carries parallel state dimensions.
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
    # MethodologyVersion.previous_version_id references MethodologyVersion.id,
    # while PendingMethodologyChange also references an earlier
    # HospitalMethodologyVersion — two independent year-over-year reference
    # paths, so comparability is computed against whichever version is pinned.
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Hospital
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Hospital legal name, 2..120 characters" }
      - { name: ccn, type: string, source: input, description: "Six-character CMS Certification Number; unique across all hospitals" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code, uppercase" }
      - { name: bed_count, type: integer, source: input, description: "Licensed bed count, >= 1" }
      - { name: teaching_status, type: enum, source: input, description: "TEACHING | NON_TEACHING; drives the peer group used for standardization" }
      - { name: annual_discharges, type: integer, source: input, description: "Annual inpatient discharges, >= 1; the denominator of the survey sample rate" }
      - { name: survey_contact_email, type: string, source: input, description: "Verified contact email for the survey respondent" }
      - { name: active_methodology_version_id, type: string, source: system, default: null, description: "Id of the MethodologyVersion currently pinned to this hospital; null until a pin is created" }
      - { name: worst_grade_ever, type: enum, source: computed, default: null, description: "Lowest published effective grade letter ever recorded for this hospital: A | B | C | D | F | null" }
      - { name: disclosure_status, type: enum, source: computed, default: NEVER_SUBMITTED, description: "NEVER_SUBMITTED | SUBMITTED | UNVERIFIED; recomputed on every survey submission, on every refuted reanalysis request, and on every verification that opens a discrepancy" }
      - { name: submitted_source_document_count, type: integer, source: computed, default: 0, description: "Count of SurveyMeasure rows carrying a non-null source_program_id, plus the adopted ReanalysisRequest supporting_documents entries" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; only ACTIVE hospitals accept submissions" }

  - name: MethodologyVersion
    parent: null
    common_fields: true
    fields:
      - { name: label, type: string, source: input, description: "Human label, e.g. \"Spring 2026 Methodology\"" }
      - { name: previous_version_id, type: string, source: input, description: "Self-reference to the prior version in the same lineage; null for the first version. Not a cross-entity foreign key." }
      - { name: measure_definitions, type: array, source: input, description: "Ordered array of { measure_code, domain, scale_factor, weight, peer_mean, peer_sd, higher_is_better, derivation_rule }. Domain is one of PATIENT_SAFETY | INFECTION_PREVENTION | CPOE | STAFFING | SURGICAL_VOLUME. derivation_rule is one of NONE | RATE_TO_COUNT_FLOOR | INVERSE_BOUNDED | PER_100_BEDS_FLOOR. Array order is the evaluation order for §1.3 domain_measure_rollup." }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED; a version is authored in DRAFT and published by its publish action" }
      - { name: publication_date, type: datetime, source: input, description: "Scheduled public release instant; the embargo is lifted exactly at this instant" }
      - { name: comparability_index, type: computed, default: null, description: "methodology_comparability_index against previous_version_id; null while DRAFT" }

  - name: HospitalMethodologyVersion
    parent: null
    common_fields: true
    fields:
      - { name: hospital_id, type: string, source: system, description: "FK -> Hospital.id; the hospital this methodology pin belongs to" }
      - { name: methodology_version_id, type: string, source: system, description: "FK -> MethodologyVersion.id; the pinned version" }
      - { name: pinned_at, type: datetime, source: system, description: "Instant the version was pinned; server-stamped" }
      - { name: is_current, type: boolean, source: computed, default: true, description: "True for exactly one row per hospital; flipping a new pin sets the prior row to false" }

  - name: PendingMethodologyChange
    parent: null
    common_fields: true
    fields:
      - { name: hospital_id, type: string, source: system, description: "FK -> Hospital.id; the hospital whose pinned version is being advanced" }
      - { name: to_methodology_version_id, type: string, source: input, description: "FK -> MethodologyVersion.id; the version the hospital wants to adopt" }
      - { name: from_hospital_methodology_version_id, type: string, source: system, description: "FK -> HospitalMethodologyVersion.id; the currently pinned hospital-level version the change departs from" }
      - { name: comparability_index, type: computed, default: null, description: "methodology_comparability_index between the pinned version and the requested version; null until review" }
      - { name: status, type: enum, source: system, description: "PENDING | APPLIED | REJECTED_NOT_COMPARABLE | WITHDRAWN" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the reviewer who decided the change; null while PENDING" }

  - name: Survey
    parent: null
    common_fields: true
    fields:
      - { name: hospital_id, type: string, source: system, description: "FK -> Hospital.id; the submitting hospital" }
      - { name: methodology_version_id, type: string, source: system, description: "FK -> MethodologyVersion.id; pinned at creation from Hospital.active_methodology_version_id" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the respondent who created the survey; the segregation-of-duties check compares against verification" }
      - { name: started_survey_count, type: integer, source: input, description: "Number of survey responses started; >= 0" }
      - { name: completed_survey_count, type: integer, source: input, description: "Number of survey responses completed; <= started_survey_count" }
      - { name: entity_annual_discharges, type: integer, source: input, description: "Discharges the respondent claims as the sample denominator; >= 1" }
      - { name: validation_method, type: enum, source: input, description: "ATTESTATION | SOURCE_DOCUMENT if the respondent declared verification method; null when the key is omitted (JSON null), NOT the string \"NONE\"" }
      - { name: verification_response, type: enum, source: system, default: null, description: "ACCEPT | DISCREPANCY_REQUEST while verification is open; null before the first verification" }
      - { name: verification_cycle, type: integer, source: system, default: 0, description: "Number of verification rounds completed; increments on every DISCREPANCY_REQUEST" }
      - { name: reanalysis_request_count, type: integer, source: computed, default: 0, description: "Count of ReanalysisRequest rows raised against this survey" }
      - { name: reliability_weight, type: computed, default: null, description: "survey_certification_reliability output, 4 decimal places; null before first verification" }
      - { name: sample_rate, type: computed, default: null, description: "completed_survey_count / entity_annual_discharges, 4 decimal places" }
      - { name: af_status, type: enum, source: system, description: "Parallel dimension A: AWAITING_SUBMISSION | SUBMITTED | VERIFIED | DISCREPANCY_OPEN | DISCREPANCY_RESOLVED" }
      - { name: af_certification_level, type: enum, source: system, description: "Parallel dimension B: UNCERTIFIED | CERTIFIED | CERTIFICATION_WITHDRAWN" }

  - name: SurveyMeasure
    parent: null
    common_fields: true
    fields:
      - { name: hospital_id, type: string, source: system, description: "FK -> Hospital.id; the reporting hospital" }
      - { name: survey_id, type: string, source: system, description: "FK -> Survey.id; the survey this measure was reported on" }
      - { name: measure_code, type: string, source: input, description: "Measure code, unique per (hospital_id, measure_code); must exist in the pinned MethodologyVersion.measure_definitions. A later submission or substitution REPLACES the existing row rather than adding a second one." }
      - { name: raw_value, type: number, source: input, description: "Raw reported value; >= 0" }
      - { name: source_program_id, type: string, source: input, description: "Public reporting program the value was sourced from; 1..64 chars. Null means the hospital submitted the value directly." }
      - { name: derived_value, type: computed, default: null, description: "derived_measure_value output, or null when the measure was not submitted and a derived value could not be computed" }
      - { name: measure_status, type: enum, source: system, description: "REPORTED | UNREPORTED_EXCLUDED | PUBLIC_SOURCE_SUBSTITUTED" }
      - { name: flag_hold, type: boolean, source: computed, default: false, description: "True when the source program's own measure value disagrees with the submitted raw value under the pinned derivation rule" }

  - name: ReanalysisRequest
    parent: null
    common_fields: true
    fields:
      - { name: hospital_id, type: string, source: system, description: "FK -> Hospital.id; the hospital requesting reanalysis" }
      - { name: survey_id, type: string, source: system, description: "FK -> Survey.id; the survey the request targets" }
      - { name: subset_selector, type: array, source: input, description: 'Array of selectors, each one of { measure_code: "<code>" } or { domain: "<DOMAIN>" } or { source_program_id: "<program>" }. Order is the evaluation order. Minimum 1, maximum 20 selectors.' }
      - { name: supporting_documents, type: array, source: input, description: "Array of { document_code, issued_on } pairs supplied as source documentation; document_code is one of the ten codes handled by safe_practice_credit" }
      - { name: requested_delta, type: number, source: input, default: null, description: "Signed points the hospital asks to be applied to the composite score; null when the request supplies only selectors and no explicit delta" }
      - { name: adjusted_delta, type: number, source: computed, default: null, description: "Signed points actually applied on GRANTED; zero on every other decision" }
      - { name: non_regression_confirmed, type: boolean, source: system, default: false, description: "Set true by the GRANT decision; the regression guard reads it" }
      - { name: reference_stale, type: boolean, source: computed, default: false, description: "True when the survey's pinned methodology version differs from the hospital's current pinned version at decision time" }
      - { name: documents_sufficient, type: boolean, source: computed, default: false, description: "True when supporting_documents covers at least the six distinct document codes required by safe_practice_credit" }
      - { name: status, type: enum, source: system, description: "PENDING | UNDER_REVIEW | GRANTED | REFUTED | WITHDRAWN" }

  - name: HospitalMeasureSet
    parent: null
    common_fields: true
    fields:
      - { name: hospital_id, type: string, source: system, description: "FK -> Hospital.id; the hospital this measure set belongs to" }
      - { name: methodology_version_id, type: string, source: system, description: "FK -> MethodologyVersion.id; the version whose measure_definitions are in scope" }
      - { name: source_snapshot_at, type: datetime, source: system, description: "Logical-clock instant the set was last materialised; refresh is rejected while the instant is unchanged" }
      - { name: measures, type: array, source: computed, description: "Array of { measure_code, domain, derived_value, measure_status } in the order the pinned measure_definitions declare; PUBLIC_SOURCE_SUBSTITUTED entries carry the source program's value, UNREPORTED_EXCLUDED entries carry derived_value null" }
      - { name: substituted_measure_count, type: integer, source: computed, default: 0, description: "Count of measures whose measure_status is PUBLIC_SOURCE_SUBSTITUTED" }
      - { name: readiness_state, type: enum, source: computed, default: INCOMPLETE, description: "INCOMPLETE | OMITTED_FROM_CYCLE | READY; OMITTED_FROM_CYCLE when substituted_measure_count >= 4" }

  - name: ScoreRun
    parent: null
    common_fields: true
    fields:
      - { name: hospital_id, type: string, source: system, description: "FK -> Hospital.id; the scored hospital" }
      - { name: methodology_version_id, type: string, source: system, description: "FK -> MethodologyVersion.id; the pinned version used by this run" }
      - { name: measure_set_id, type: string, source: system, description: "FK -> HospitalMeasureSet.id; the measure set this run scored" }
      - { name: reliability_weight, type: number, source: computed, default: null, description: "Reliability weight read from the survey at run time; null when the hospital has no verified survey" }
      - { name: domain_scores, type: array, source: computed, description: "Array of { domain, domain_score } in the pinned measure_definitions domain order; domain_score is the domain_measure_rollup output rounded once to 2 decimal places" }
      - { name: composite_score, type: number, source: computed, description: "composite_score output rounded once to 2 decimal places" }
      - { name: base_grade_letter, type: enum, source: computed, description: "A | B | C | D | F from grade_assignment before any reliability or reanalysis adjustment" }
      - { name: letter_grade, type: enum, source: computed, description: "A | B | C | D | F after grade_assignment and composite_adjusted_for_reanalysis are applied" }
      - { name: score_state, type: enum, source: system, description: "RUNNING | SCORED | CHAR_EXEMPT | REANALYSIS_PENDING" }

  - name: ReleaseCycle
    parent: null
    common_fields: true
    fields:
      - { name: label, type: string, source: input, description: "Cycle label, e.g. \"Spring 2026 Grades\"" }
      - { name: methodology_version_id, type: string, source: input, description: "FK -> MethodologyVersion.id; the version every grade in this cycle is scored under" }
      - { name: preliminary_release_date, type: datetime, source: input, description: "Instant preliminary results become visible to hospitals" }
      - { name: correction_window_ends_at, type: datetime, source: input, description: "Instant the hospital correction window closes; evaluated with a strict > comparison" }
      - { name: publication_date, type: datetime, source: input, description: "Instant the cycle publishes; the embargo is lifted exactly at this instant" }
      - { name: embargo_lifted, type: boolean, source: computed, default: false, description: "False until the publish action is executed at or after publication_date" }
      - { name: state, type: enum, source: computed, description: "DRAFT | OPEN_REVIEW | CORRECTION_CLOSED | EMBARGOED | PUBLISHED; derived from the aggregate state of the cycle's Grade and HospitalReview children" }
      - { name: grade_count, type: integer, source: computed, default: 0, description: "Count of Grade rows in the cycle" }
      - { name: correction_request_count, type: integer, source: computed, default: 0, description: "Count of CorrectionRequest rows whose HospitalReview belongs to this cycle and whose status is still PENDING or ACCEPTED" }

  - name: Grade
    parent: ReleaseCycle
    common_fields: true
    fields:
      - { name: hospital_id, type: string, source: system, description: "FK -> Hospital.id; the graded hospital" }
      - { name: release_cycle_id, type: string, source: system, description: "FK -> ReleaseCycle.id; the cycle this grade belongs to" }
      - { name: score_run_id, type: string, source: system, description: "FK -> ScoreRun.id; the score run this grade was cut from" }
      - { name: composite_score, type: number, source: computed, description: "Copied from the score run at generation and re-derived on every reanalysis application" }
      - { name: letter_grade, type: enum, source: computed, description: "A | B | C | D | F after reliability and reanalysis adjustments" }
      - { name: grade_cap_applied, type: boolean, source: computed, default: false, description: "True when survey_certification_reliability forced a one-letter downgrade" }
      - { name: status, type: enum, source: system, description: "SCORED | CHAR_EXEMPT | CORRECTED | WITHHELD" }

  - name: HospitalReview
    parent: null
    common_fields: true
    fields:
      - { name: hospital_id, type: string, source: system, description: "FK -> Hospital.id; the hospital reviewing its preliminary result" }
      - { name: grade_id, type: string, source: system, description: "FK -> Grade.id; the grade shown to the hospital" }
      - { name: release_cycle_id, type: string, source: system, description: "FK -> ReleaseCycle.id; the cycle the reviewed grade belongs to" }
      - { name: preliminary_composite_score, type: number, source: computed, description: "Frozen copy of the grade's composite score at the moment the review was opened" }
      - { name: preliminary_letter_grade, type: enum, source: computed, description: "Frozen copy of the grade's letter at the moment the review was opened" }
      - { name: challenged_measure_codes, type: array, source: input, description: "Array of measure codes the hospital challenges; each must exist in the pinned methodology version" }
      - { name: accepted_at, type: datetime, source: system, default: null, description: "Logical-clock instant the hospital accepted the preliminary result" }
      - { name: status, type: enum, source: system, description: "PENDING | ACCEPTED | CORRECTION_REQUESTED" }

  - name: CorrectionRequest
    parent: HospitalReview
    common_fields: true
    fields:
      - { name: hospital_id, type: string, source: system, description: "FK -> Hospital.id; the hospital filing the correction" }
      - { name: hospital_review_id, type: string, source: system, description: "FK -> HospitalReview.id; the review this correction belongs to" }
      - { name: correction_type, type: enum, source: input, description: "MEASURE_VALUE_ERROR | MEASURE_OMISSION | SOURCE_PROGRAM_MISMATCH" }
      - { name: corrected_measure_codes, type: array, source: input, description: "Array of measure codes whose values the hospital asserts are wrong; each must appear in the parent review's challenged_measure_codes" }
      - { name: supporting_reference, type: string, source: input, description: "Free-text citation of the source documentation; 10..512 characters" }
      - { name: delta_points, type: number, source: computed, default: 0, description: "Signed points this correction would apply to the composite score; negative reduces the score" }
      - { name: status, type: enum, source: system, description: "PENDING | ACCEPTED | REJECTED | EXPIRED" }

  - name: Employer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Purchaser legal name" }
      - { name: purchaser_type, type: enum, source: input, description: "SELF_INSURED_EMPLOYER | COALITION | HEALTH_PLAN" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE; the only employer state, re-evaluated on every network-listing call" }
      - { name: network_hospital_ids, type: array, source: input, description: "Array of hospital ids in the network; each id must resolve to an existing Hospital; duplicate entries collapse to the first occurrence, so the effective network is order-insensitive" }
      - { name: benefit_window_from, type: datetime, source: input, description: "Inclusive start of the benefit-design window this network applies to" }
      - { name: benefit_window_to, type: datetime, source: input, description: "Exclusive end of the benefit-design window; must be strictly greater than benefit_window_from" }
      - { name: network_hospital_count, type: integer, source: computed, default: 0, description: "Count of DISTINCT hospital ids in network_hospital_ids after duplicate collapse" }
      - { name: minimum_acceptable_letter, type: enum, source: input, description: "Lowest letter the purchaser will keep in network: A | B | C | D" }
      - { name: eligible_hospital_count, type: integer, source: computed, default: 0, description: "Count of distinct network hospitals with a Grade whose letter_grade ranks at or above minimum_acceptable_letter" }
      - { name: utilization_index, type: number, source: computed, default: null, description: "employer_utilization_index output, 4 decimal places" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Survey
    initial_state: AWAITING_SUBMISSION
    terminal_states: [VERIFIED, DISCREPANCY_RESOLVED]
    note: >
      Parallel state dimensions. dimension A is af_status; dimension B is
      af_certification_level. A transition on one dimension never moves the
      other dimension's value. af_certification_level may be withdrawn and
      re-earned without af_status regressing below SUBMITTED.
    transitions:
      - from: AWAITING_SUBMISSION
        to: SUBMITTED
        trigger: "POST /hospital-safety-rating/surveys/{surveyId}/submit"
        actor: HospitalRespondent
        preconditions:
          - "survey.af_status == AWAITING_SUBMISSION (ERR_SURVEY_ALREADY_SUBMITTED)"
          - "survey.started_survey_count >= 1 and survey.completed_survey_count <= survey.started_survey_count (ERR_SURVEY_RESPONSE_COUNT_INCONSISTENT)"
          - "survey.entity_annual_discharges >= 1 (ERR_SURVEY_SAMPLE_DENOMINATOR_INVALID)"
          - "the hospital has at least one SurveyMeasure row (ERR_SURVEY_HAS_NO_MEASURES)"
        side_effects:
          - "af_status → SUBMITTED"
          - "recompute survey.sample_rate = round_half_up(completed_survey_count / entity_annual_discharges, 4)"
          - "hospital.disclosure_status → SUBMITTED"
          - "hospital.updated_at refreshed"
          - "increments Hospital.version by 1"
          - "recompute HospitalMeasureSet for the hospital: measures materialised in pinned measure_definitions order, readiness_state derived"

      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /hospital-safety-rating/surveys/{surveyId}/verify"
        actor: VerificationAnalyst
        preconditions:
          - "survey.af_status == SUBMITTED and survey.verification_response is null (ERR_SURVEY_VERIFICATION_ALREADY_OPEN)"
          - "the acting X-User-ID differs from survey.submitted_by_user_id (ERR_SELF_VERIFICATION_FORBIDDEN)"
          - "every SurveyMeasure row for the survey has a non-null source_program_id, or the survey carries at least one supporting_documents entry via an adopted ReanalysisRequest (ERR_SOURCE_DOCUMENTATION_REQUIRED)"
        side_effects:
          - "af_status → VERIFIED"
          - "af_certification_level → CERTIFIED"
          - "verification_response → ACCEPT"
          - "recompute survey.reliability_weight = survey_certification_reliability(survey, hospital)"
          - "if survey.reliability_weight < 0.60: every Grade in the hospital's OPEN_REVIEW cycle gets grade_cap_applied = true and letter_grade downgraded one letter via the DOWNGRADE map"
          - "increments Hospital.version by 1"

      - from: SUBMITTED
        to: DISCREPANCY_OPEN
        trigger: "POST /hospital-safety-rating/surveys/{surveyId}/verify"
        actor: VerificationAnalyst
        preconditions:
          - "survey.af_status == SUBMITTED and survey.verification_response is null (ERR_SURVEY_VERIFICATION_ALREADY_OPEN)"
          - "the acting X-User-ID differs from survey.submitted_by_user_id (ERR_SELF_VERIFICATION_FORBIDDEN)"
        side_effects:
          - "af_status → DISCREPANCY_OPEN"
          - "verification_response → DISCREPANCY_REQUEST"
          - "survey.verification_cycle += 1"
          - "af_certification_level → UNCERTIFIED"
          - "cascade hop 1: orders a source-documentation demand against every SurveyMeasure row of this survey with a null source_program_id"
          - "cascade hop 2: that SurveyMeasure mutation sets measure_status back to REPORTED for rows whose value had been sourced, and recomputes derived_value"
          - "cascade hop 3: the SurveyMeasure change marks the hospital's HospitalMeasureSet stale, flipping readiness_state to INCOMPLETE"
          - "cascade hop 4: the INCOMPLETE measure set sets hospital.disclosure_status to UNVERIFIED on the next read"
          - "increments Hospital.version by 1"

      - from: DISCREPANCY_OPEN
        to: DISCREPANCY_RESOLVED
        trigger: "POST /hospital-safety-rating/surveys/{surveyId}/resolve"
        actor: HospitalRespondent
        preconditions:
          - "survey.af_status == DISCREPANCY_OPEN (ERR_SURVEY_NOT_IN_DISCREPANCY)"
          - "the acting X-User-ID equals survey.submitted_by_user_id (ERR_SURVEY_OWNER_MISMATCH)"
          - "every SurveyMeasure row for the survey now carries a non-null source_program_id (ERR_SOURCE_DOCUMENTATION_REQUIRED)"
        side_effects:
          - "af_status → DISCREPANCY_RESOLVED"
          - "the survey's af_certification_level is set to CERTIFIED only after a subsequent verify call returns ACCEPT"
          - "hospital.disclosure_status → SUBMITTED"
          - "increments Hospital.version by 1"

      - from: DISCREPANCY_RESOLVED
        to: VERIFIED
        trigger: "POST /hospital-safety-rating/surveys/{surveyId}/verify"
        actor: VerificationAnalyst
        preconditions:
          - "survey.af_status == DISCREPANCY_RESOLVED and survey.verification_response == DISCREPANCY_REQUEST (ERR_SURVEY_VERIFICATION_ALREADY_OPEN)"
          - "the acting X-User-ID differs from survey.submitted_by_user_id (ERR_SELF_VERIFICATION_FORBIDDEN)"
        side_effects:
          - "af_status → VERIFIED"
          - "verification_response → ACCEPT"
          - "af_certification_level → CERTIFIED"
          - "recompute survey.reliability_weight = survey_certification_reliability(survey, hospital)"
          - "increments Hospital.version by 1"

      - from: VERIFIED
        to: SUBMITTED
        trigger: "POST /hospital-safety-rating/reanalysis-requests/{requestId}/decide with decision=GRANT"
        actor: VerificationAnalyst
        note: >
          Cycle back into the verification pipeline. dimension A rewinds to
          SUBMITTED; af_certification_level is independently set to
          CERTIFICATION_WITHDRAWN so the two dimensions are observably out of
          step until the next ACCEPT re-earns CERTIFIED.
        preconditions:
          - "the target ReanalysisRequest is in UNDER_REVIEW (ERR_REANALYSIS_NOT_UNDER_REVIEW)"
          - "the target ReanalysisRequest references this survey (ERR_REANALYSIS_SURVEY_MISMATCH)"
          - "the request's reference_stale is false (ERR_REANALYSIS_REFERENCE_STALE)"
        side_effects:
          - "af_status → SUBMITTED"
          - "af_certification_level → CERTIFICATION_WITHDRAWN"
          - "reanalysis_request_count += 1"
          - "survey.reliability_weight recomputed; it falls below the 0.60 cap threshold whenever verification_cycle >= 2"
          - "af_status is frozen at SUBMITTED until the next verify call; no further measurement edits are accepted"
          - "increments Hospital.version by 1"

  - entity: ReanalysisRequest
    initial_state: PENDING
    terminal_states: [GRANTED, REFUTED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /hospital-safety-rating/hospitals/{hospitalId}/reanalysis-requests/{requestId}/decide with decision=WITHDRAW"
        actor: HospitalRespondent
        preconditions:
          - "the acting X-User-ID matches the hospital named in the request path (ERR_HOSPITAL_OWNER_MISMATCH)"
        side_effects:
          - "adjusted_delta → 0"
          - "increments Hospital.version by 1"

      - from: PENDING
        to: UNDER_REVIEW
        trigger: "POST /hospital-safety-rating/hospitals/{hospitalId}/reanalysis-requests/{requestId}/decide with decision=START_REVIEW"
        actor: VerificationAnalyst
        preconditions:
          - "request.subset_selector has at least 1 and at most 20 entries (ERR_REANALYSIS_SELECTOR_ARITY)"
          - "every selector's measure_code or domain resolves inside the survey's pinned methodology version (ERR_REANALYSIS_SELECTOR_UNRESOLVED)"
        side_effects:
          - "status → UNDER_REVIEW"
          - "recompute reference_stale = (survey.methodology_version_id != hospital.active_methodology_version_id)"
          - "increments Hospital.version by 1"

      - from: UNDER_REVIEW
        to: GRANTED
        trigger: "POST /hospital-safety-rating/hospitals/{hospitalId}/reanalysis-requests/{requestId}/decide with decision=GRANT"
        actor: VerificationAnalyst
        preconditions:
          - "request.documents_sufficient is true; at least six distinct document codes across supporting_documents (ERR_REANALYSIS_DOCUMENTS_INSUFFICIENT)"
          - "request.adjusted_delta > -0.01; a grant may never reduce the composite (ERR_REANALYSIS_REGRESSION_FORBIDDEN)"
        side_effects:
          - "status → GRANTED"
          - "non_regression_confirmed → true"
          - "adjusted_delta set from requested_delta, or recomputed from the selected measures when requested_delta is null"
          - "HospitalMeasureSet for the hospital is rematerialised; each selected measure's measure_status becomes PUBLIC_SOURCE_SUBSTITUTED"
          - "substituted_measure_count recomputed; readiness_state → OMITTED_FROM_CYCLE when it reaches 4"
          - "cascade hop 1: each selected measure's SurveyMeasure.measure_status becomes PUBLIC_SOURCE_SUBSTITUTED"
          - "cascade hop 2: the SurveyMeasure change flips the hospital's HospitalMeasureSet.readiness_state to INCOMPLETE and bumps substituted_measure_count"
          - "cascade hop 3: the measure-set change drives the next refresh-and-score pair, which re-derives the Grade composite through composite_adjusted_for_reanalysis (60.38 → 65.12) and its letter (C → C after the mandatory downgrade)"
          - "cascade hop 4: the Grade change re-derives the parent ReleaseCycle.state from its children, moving DRAFT → OPEN_REVIEW when every grade is resolved"
          - "increments Hospital.version by 1"

      - from: UNDER_REVIEW
        to: REFUTED
        trigger: "POST /hospital-safety-rating/hospitals/{hospitalId}/reanalysis-requests/{requestId}/decide with decision=REFUTE"
        actor: VerificationAnalyst
        preconditions:
        side_effects:
          - "status → REFUTED"
          - "adjusted_delta → 0"
          - "hospital.submitted_source_document_count recomputed from the rejected documents"
          - "cascades: when every survey of the hospital is now unverified, Hospital.disclosure_status → UNVERIFIED, which fans out to the hospital's SurveyMeasure rows, flipping each to measure_status REPORTED with derived_value null — see SurveyMeasure.REPORTED_to_REPORTED"
          - "increments Hospital.version by 1"

  - entity: SurveyMeasure
    initial_state: REPORTED
    terminal_states: [UNREPORTED_EXCLUDED]
    transitions:
      - from: REPORTED
        to: PUBLIC_SOURCE_SUBSTITUTED
        trigger: "POST /hospital-safety-rating/hospitals/{hospitalId}/public-source-measures"
        actor: RatingAdmin
        preconditions:
          - "the acting role holds the public-source ingestion operation (ERR_INSUFFICIENT_PERMISSIONS)"
        side_effects:
          - "measure_status → PUBLIC_SOURCE_SUBSTITUTED"
          - "derived_value = derived_measure_value on the source value under the pinned derivation rule"
          - "the parent Survey's reanalysis_request_count is untouched"
          - "increments Hospital.version by 1"

      - from: REPORTED
        to: REPORTED
        trigger: "POST /hospital-safety-rating/surveys/{surveyId}/verify with verification_response=DISCREPANCY_REQUEST"
        actor: system
        note: "System-driven remeasurement demand: the row is re-flagged in place."
        preconditions: []
        side_effects:
          - "flag_hold → true when source_program_id is null"
          - "derived_value recomputed from the current raw_value"
          - "HospitalMeasureSet.readiness_state → INCOMPLETE"

      - from: PUBLIC_SOURCE_SUBSTITUTED
        to: REPORTED
        trigger: "POST /hospital-safety-rating/hospitals/{hospitalId}/refresh-measures"
        actor: RatingEngine
        preconditions:
          - "a direct SurveyMeasure submission now exists for the same measure_code"
        side_effects:
          - "measure_status → REPORTED"
          - "derived_value recomputed from the submitted raw_value"

  - entity: HospitalMeasureSet
    initial_state: INCOMPLETE
    terminal_states: [OMITTED_FROM_CYCLE, READY]
    transitions:
      - from: INCOMPLETE
        to: READY
        trigger: "POST /hospital-safety-rating/hospitals/{hospitalId}/refresh-measures"
        actor: RatingEngine
        preconditions:
          - "the logical clock instant differs from measure_set.source_snapshot_at (ERR_SNAPSHOT_ALREADY_CURRENT)"
          - "the hospital has a pinned methodology version (ERR_METHODOLOGY_VERSION_REQUIRED)"
          - "substituted_measure_count <= 3 (ERR_MEASURE_SET_OMITTED)"
        side_effects:
          - "readiness_state → READY"
          - "source_snapshot_at → current logical clock instant"
          - "measures materialised in pinned measure_definitions order"
          - "increments Hospital.version by 1"

      - from: INCOMPLETE
        to: OMITTED_FROM_CYCLE
        trigger: "POST /hospital-safety-rating/hospitals/{hospitalId}/refresh-measures"
        actor: RatingEngine
        preconditions:
          - "substituted_measure_count >= 4 (ERR_MEASURE_SET_OMITTED is NOT raised; the state is reached instead)"
        side_effects:
          - "readiness_state → OMITTED_FROM_CYCLE"
          - "source_snapshot_at → current logical clock instant"
          - "cascades to the cycle: the refreshed hospital contributes no usable derived values, so every Grade of the hospital in an OPEN_REVIEW cycle is moved to WITHHELD by the next score run — see Grade.SCORED_to_WITHHELD"
          - "increments Hospital.version by 1"

      - from: READY
        to: INCOMPLETE
        trigger: "POST /hospital-safety-rating/hospitals/{hospitalId}/public-source-measures"
        actor: RatingAdmin
        note: "A newly sourced public value invalidates the materialised set until it is refreshed."
        preconditions:
          - "the measure_code belongs to the pinned methodology version (ERR_MEASURE_CODE_NOT_IN_METHODOLOGY)"
        side_effects:
          - "readiness_state → INCOMPLETE"
          - "increments Hospital.version by 1"

      - from: READY
        to: INCOMPLETE
        trigger: "POST /hospital-safety-rating/hospitals/{hospitalId}/reanalysis-requests/{requestId}/decide with decision=START_REVIEW"
        actor: VerificationAnalyst
        note: "A reanalysis under review invalidates the materialised set until it is refuted or granted."
        preconditions:
          - "the reanalysis request targets this hospital (ERR_REANALYSIS_SURVEY_MISMATCH)"
        side_effects:
          - "readiness_state → INCOMPLETE"
          - "increments Hospital.version by 1"

      - from: READY
        to: READY
        trigger: "POST /hospital-safety-rating/hospitals/{hospitalId}/refresh-measures"
        actor: RatingEngine
        note: >
          Rematerialisation without leaving READY. Every refresh clears
          reanalysis_adjustment_delta on the derived values back to the
          submitted values, so the hospital's composite returns to the
          pre-reanalysis baseline.
        preconditions:
          - "substituted_measure_count <= 3 (ERR_MEASURE_SET_OMITTED)"
          - "the logical clock instant differs from measure_set.source_snapshot_at (ERR_SNAPSHOT_ALREADY_CURRENT)"
        side_effects:
          - "readiness_state stays READY"
          - "source_snapshot_at → current logical clock instant"
          - "increments Hospital.version by 1"

  - entity: ScoreRun
    initial_state: RUNNING
    terminal_states: [SCORED, CHAR_EXEMPT]
    transitions:
      - from: RUNNING
        to: SCORED
        trigger: "POST /hospital-safety-rating/hospitals/{hospitalId}/score-runs"
        actor: RatingEngine
        preconditions:
          - "the hospital's HospitalMeasureSet.readiness_state == READY (ERR_MEASURE_SET_NOT_READY)"
          - "the pinned methodology version's measure_definitions cover all five domains with positive weights (ERR_METHODOLOGY_INCOMPLETE)"
        side_effects:
          - "score_state → SCORED"
          - "domain_scores computed by domain_measure_rollup and rounded once to 2 decimal places"
          - "composite_score computed by composite_score and rounded once to 2 decimal places"
          - "base_grade_letter and letter_grade set by grade_assignment"
          - "reliability_weight read from the hospital's most recently VERIFIED survey"
          - "increments Hospital.version by 1"

      - from: RUNNING
        to: CHAR_EXEMPT
        trigger: "POST /hospital-safety-rating/hospitals/{hospitalId}/score-runs"
        actor: RatingEngine
        preconditions:
          - "the hospital has no VERIFIED survey and no PUBLIC_SOURCE_SUBSTITUTED measure (ERR_CHAR_EXEMPTION_UNSUPPORTED)"
          - "at least one measure in the pinned methodology version is UNREPORTED_EXCLUDED (ERR_CHAR_EXEMPTION_UNSUPPORTED)"
        side_effects:
          - "score_state → CHAR_EXEMPT"
          - "letter_grade → null; domain_scores computed only over the measures that were available"
          - "increments Hospital.version by 1"

      - from: SCORED
        to: REANALYSIS_PENDING
        trigger: "POST /hospital-safety-rating/hospitals/{hospitalId}/reanalysis-requests/{requestId}/decide with decision=GRANT"
        actor: VerificationAnalyst
        preconditions:
          - "the granted reanalysis request targets this hospital (ERR_REANALYSIS_SURVEY_MISMATCH)"
        side_effects:
          - "score_state → REANALYSIS_PENDING"
          - "increments Hospital.version by 1"

      - from: REANALYSIS_PENDING
        to: SCORED
        trigger: "POST /hospital-safety-rating/release-cycles/{releaseCycleId}/open-review"
        actor: RatingEngine
        note: "Re-derivation is executed when the cycle opens review; the run returns to SCORED with the adjustment applied."
        preconditions:
          - "the release cycle's state is DRAFT (ERR_CYCLE_NOT_DRAFT)"
        side_effects:
          - "score_state → SCORED"
          - "composite_score recomputed through composite_adjusted_for_reanalysis"
          - "letter_grade recomputed through grade_assignment's downgrade_on_cap variant"

  - entity: Grade
    initial_state: SCORED
    terminal_states: [WITHHELD]
    transitions:
      - from: SCORED
        to: CORRECTED
        trigger: "POST /hospital-safety-rating/hospitals/{hospitalId}/preliminary-results/{reviewId}/corrections accepted within the correction window"
        actor: RatingEngine
        preconditions:
          - "the parent release cycle's state is OPEN_REVIEW (ERR_CYCLE_NOT_OPEN_FOR_CORRECTIONS)"
          - "the logical clock instant is strictly before release_cycle.correction_window_ends_at (ERR_CORRECTION_WINDOW_CLOSED)"
          - "the correction request is in PENDING (ERR_CORRECTION_NOT_PENDING)"
        side_effects:
          - "grade.status → CORRECTED"
          - "grade.composite_score recomputed as the preliminary score plus every ACCEPTED correction's delta_points, rounded once to 2 decimal places"
          - "grade.letter_grade recomputed through grade_assignment's downgrade_on_cap variant"
          - "the parent HospitalReview.status → CORRECTION_REQUESTED"
          - "increments Hospital.version by 1"

      - from: SCORED
        to: WITHHELD
        trigger: "POST /hospital-safety-rating/hospitals/{hospitalId}/score-runs when the hospital's measure set became OMITTED_FROM_CYCLE, or POST /hospital-safety-rating/hospitals/{hospitalId}/refresh-measures on an already-scored hospital"
        actor: RatingEngine
        preconditions:
          - "the hospital's HospitalMeasureSet.readiness_state == OMITTED_FROM_CYCLE (ERR_MEASURE_SET_NOT_READY)"
          - "the cycle is not yet PUBLISHED (ERR_CYCLE_ALREADY_PUBLISHED)"
        side_effects:
          - "grade.status → WITHHELD"
          - "grade.letter_grade → null"
          - "release_cycle.grade_count recomputed"
          - "ReleaseCycle.state re-derived from its children"

      - from: SCORED
        to: SCORED
        trigger: "POST /hospital-safety-rating/release-cycles/{releaseCycleId}/open-review"
        actor: RatingEngine
        note: "Re-derivation inside OPEN_REVIEW after a granted reanalysis rematerialised the measure set."
        preconditions:
          - "the release cycle's state is DRAFT (ERR_CYCLE_NOT_DRAFT)"
          - "the hospital's HospitalMeasureSet.readiness_state is READY (ERR_MEASURE_SET_NOT_READY)"
        side_effects:
          - "grade.composite_score recomputed through composite_adjusted_for_reanalysis, rounded once to 2 decimal places"
          - "grade.letter_grade recomputed through grade_assignment's downgrade_on_cap variant"
          - "release_cycle.grade_count recomputed"
          - "ReleaseCycle.state re-derived from its children"

      - from: CORRECTED
        to: SCORED
        trigger: "POST /hospital-safety-rating/hospitals/{hospitalId}/preliminary-results/{reviewId}/corrections/{correctionId}/decide with decision=REJECT on the last open correction of the review"
        actor: RatingEngine
        note: "Revision loop: rejecting the final outstanding correction returns the grade to its uncorrected SCORED state."
        preconditions:
          - "no remaining CorrectionRequest on the parent HospitalReview is in PENDING (ERR_CORRECTIONS_PENDING)"
          - "the grade is in CORRECTED (ERR_CORRECTION_NOT_PENDING)"
        side_effects:
          - "grade.status → SCORED"
          - "grade.composite_score recomputed from the frozen preliminary score plus the remaining ACCEPTED corrections"
          - "grade.letter_grade recomputed through grade_assignment's downgrade_on_cap variant"
          - "HospitalReview.status → CORRECTION_REQUESTED"

      - from: CORRECTED
        to: CORRECTED
        trigger: "POST /hospital-safety-rating/release-cycles/{releaseCycleId}/open-review"
        actor: RatingEngine
        note: >
          Re-derivation from an applied adjustment. Dropping an effective
          domain inserts the §1.3 final_renormalized variant, which carries a
          one-letter downgrade, so the corrected letter may fall even though
          the corrected composite rose.
        preconditions:
          - "the release cycle's state is DRAFT (ERR_CYCLE_NOT_DRAFT)"
          - "the cycle's methodology version differs from the version the grade was originally scored under (ERR_METHODOLOGY_UNCHANGED)"
        side_effects:
          - "grade.composite_score recomputed through composite_score's final_renormalized variant, rounded once to 2 decimal places"
          - "grade.letter_grade recomputed through grade_assignment's downgrade_on_cap variant"
          - "release_cycle.grade_count recomputed"
          - "ReleaseCycle.state re-derived from its children"

  - entity: ReleaseCycle
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    note: >
      compound — ReleaseCycle.state is a function of its Grade and
      HospitalReview children, never set directly by a client.
    transitions:
      - from: DRAFT
        to: OPEN_REVIEW
        trigger: "POST /hospital-safety-rating/release-cycles/{releaseCycleId}/open-review"
        actor: RatingEngine
        preconditions:
          - "the cycle has at least one Grade (ERR_CYCLE_HAS_NO_GRADES)"
          - "every Grade in the cycle is in SCORED, CORRECTED or CHAR_EXEMPT (ERR_CYCLE_GRADES_UNRESOLVED)"
          - "every score run feeding the cycle returned SCORED or CHAR_EXEMPT (ERR_SCORE_RUN_UNRESOLVED)"
          - "the logical clock instant is at or after preliminary_release_date (ERR_PRELIMINARY_WINDOW_NOT_OPEN)"
        side_effects:
          - "state → OPEN_REVIEW"
          - "one HospitalReview row is created per Grade in the cycle, freezing preliminary_composite_score and preliminary_letter_grade"
          - "grade_count recomputed"
          - "Hospital.version is NOT incremented — this is a cycle-level operation"

      - from: OPEN_REVIEW
        to: CORRECTION_CLOSED
        trigger: "system (derived when the logical clock instant is strictly after correction_window_ends_at)"
        actor: system
        preconditions:
          - "the logical clock instant is strictly greater than correction_window_ends_at"
          - "no CorrectionRequest in the cycle is left in PENDING (ERR_CORRECTIONS_PENDING)"
          - "no HospitalReview in the cycle is left in PENDING (ERR_REVIEWS_PENDING)"
        side_effects:
          - "state → CORRECTION_CLOSED"
          - "every HospitalReview in the cycle still PENDING is moved to ACCEPTED with accepted_at set to the window close instant"
          - "every CorrectionRequest still PENDING is moved to EXPIRED"
          - "correction_request_count recomputed"

      - from: CORRECTION_CLOSED
        to: EMBARGOED
        trigger: "system (derived when every review in the cycle is ACCEPTED or CORRECTION_REQUESTED)"
        actor: system
        preconditions:
          - "every HospitalReview in the cycle is ACCEPTED or CORRECTION_REQUESTED (ERR_REVIEWS_PENDING)"
        side_effects:
          - "state → EMBARGOED"
          - "every Grade in the cycle reverts to its frozen preliminary values unless it is CORRECTED"

      - from: EMBARGOED
        to: PUBLISHED
        trigger: "POST /hospital-safety-rating/release-cycles/{releaseCycleId}/publish"
        actor: RatingEngine
        preconditions:
          - "the logical clock instant is at or after publication_date (ERR_EMBARGO_ACTIVE)"
          - "no Grade in the cycle is WITHHELD without a recorded reason (ERR_CYCLE_GRADES_UNRESOLVED)"
        side_effects:
          - "state → PUBLISHED"
          - "embargo_lifted → true"
          - "each Grade's hospital.worst_grade_ever is recomputed against its published letter_grade"
          - "each Grade is frozen; later reanalysis against a published cycle raises ERR_CYCLE_ALREADY_PUBLISHED"

  - entity: HospitalReview
    initial_state: PENDING
    terminal_states: [ACCEPTED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /hospital-safety-rating/hospitals/{hospitalId}/preliminary-results/{reviewId}/accept"
        actor: HospitalRespondent
        preconditions:
          - "the review's parent release cycle is still OPEN_REVIEW (ERR_CYCLE_NOT_OPEN_FOR_CORRECTIONS)"
          - "expected_hospital_version equals hospital.version (ERR_STALE_VERSION)"
        side_effects:
          - "status → ACCEPTED"
          - "accepted_at = current logical clock instant"
          - "ReleaseCycle.state re-derived from its children"
          - "increments Hospital.version by 1"

      - from: PENDING
        to: ACCEPTED
        trigger: "system (the cycle's correction window closing while the review is still PENDING)"
        actor: system
        note: "The forced acceptance on window close, which is the only state-preserving path."
        preconditions:
          - "the logical clock instant is strictly after the cycle's correction_window_ends_at"
        side_effects:
          - "status → ACCEPTED with accepted_at set to the window close instant"
          - "the cycle advances to CORRECTION_CLOSED"

      - from: PENDING
        to: CORRECTION_REQUESTED
        trigger: "POST /hospital-safety-rating/hospitals/{hospitalId}/preliminary-results/{reviewId}/corrections"
        actor: HospitalRespondent
        preconditions:
          - "corrected_measure_codes is a subset of challenged_measure_codes (ERR_CORRECTION_MEASURE_NOT_CHALLENGED)"
          - "the logical clock instant is strictly before the cycle's correction_window_ends_at (ERR_CORRECTION_WINDOW_CLOSED)"
          - "the review is in PENDING (ERR_CORRECTION_NOT_PENDING)"
        side_effects:
          - "status → CORRECTION_REQUESTED"
          - "a CorrectionRequest row is created in PENDING"
          - "increments Hospital.version by 1"

      - from: CORRECTION_REQUESTED
        to: ACCEPTED
        trigger: "POST /hospital-safety-rating/hospitals/{hospitalId}/preliminary-results/{reviewId}/accept"
        actor: HospitalRespondent
        note: "Acceptance remains available to a hospital that has already filed a correction."
        preconditions:
          - "expected_hospital_version equals hospital.version (ERR_STALE_VERSION)"
        side_effects:
          - "status → ACCEPTED"
          - "accepted_at = current logical clock instant"
          - "increments Hospital.version by 1"

  - entity: CorrectionRequest
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED, EXPIRED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /hospital-safety-rating/hospitals/{hospitalId}/preliminary-results/{reviewId}/corrections/{correctionId}/decide with decision=ACCEPT"
        actor: RatingEngine
        preconditions:
          - "the parent release cycle is still OPEN_REVIEW (ERR_CYCLE_NOT_OPEN_FOR_CORRECTIONS)"
          - "the logical clock instant is strictly before the cycle's correction_window_ends_at (ERR_CORRECTION_WINDOW_CLOSED)"
          - "the request is in PENDING (ERR_CORRECTION_NOT_PENDING)"
        side_effects:
          - "status → ACCEPTED"
          - "Grade.composite_score recomputed as the preliminary score plus every ACCEPTED correction delta, rounded once to 2 decimal places"
          - "Grade.letter_grade recomputed through grade_assignment's downgrade_on_cap variant"
          - "increments Hospital.version by 1"

      - from: PENDING
        to: REJECTED
        trigger: "POST /hospital-safety-rating/hospitals/{hospitalId}/preliminary-results/{reviewId}/corrections/{correctionId}/decide with decision=REJECT"
        actor: RatingEngine
        preconditions:
          - "the request is in PENDING (ERR_CORRECTION_NOT_PENDING)"
        side_effects:
          - "status → REJECTED"
          - "delta_points → 0"
          - "increments Hospital.version by 1"

      - from: PENDING
        to: EXPIRED
        trigger: "system (the cycle's correction window closing while the request is still PENDING)"
        actor: system
        note: "The compensating expiry that stops a late correction from ever applying."
        preconditions:
          - "the logical clock instant is strictly after the cycle's correction_window_ends_at"
        side_effects:
          - "status → EXPIRED"
          - "delta_points → 0"
          - "the cycle advances to CORRECTION_CLOSED"

  - entity: Employer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /hospital-safety-rating/employers/{employerId}/network-listings"
        actor: PurchaserAdmin
        note: >
          Re-evaluation without a state change: each call re-derives the
          eligibility filter against the currently published grades.
        preconditions:
          - "every entry of network_hospital_ids resolves to an existing Hospital (ERR_HOSPITAL_NOT_FOUND)"
          - "minimum_acceptable_letter is one of A | B | C | D (ERR_INVALID_MINIMUM_LETTER)"
        side_effects:
          - "eligible_hospital_count recomputed"
          - "utilization_index recomputed by employer_utilization_index and rounded once to 4 decimal places"

# =============================================================================
# §1.2.1 Concurrency Rules (range-free, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: measure-set-refresh-vs-reanalysis
    parent_entity: Hospital
    write_endpoint: "POST /hospital-safety-rating/hospitals/{hospitalId}/refresh-measures"
    occ_field: "expected_hospital_version"
    description: |
      Refreshing a hospital's measure set against a Hospital whose version has
      advanced since the client last observed it is rejected. A reanalysis
      GRANT already supersedes the materialised measure set under §1.2, so the
      stale writer's view of the hospital is the loser.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: preliminary-results-accept-vs-reanalysis
    parent_entity: Hospital
    write_endpoint: "POST /hospital-safety-rating/hospitals/{hospitalId}/preliminary-results/{reviewId}/accept"
    occ_field: "expected_hospital_version"
    description: |
      Accepting a preliminary result against a Hospital whose version has
      advanced since the client last observed it is rejected. A granted
      reanalysis legitimately supersedes the preliminary score, so the
      client holding the pre-grant version must re-read before accepting.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: domain_measure_rollup
    trigger: "ScoreRun creation for a hospital whose measure set is READY"
    algorithm: aggregation
    input_set: >
      Every measure in the hospital's REMATERIALISED HospitalMeasureSet whose
      measure_status is REPORTED or PUBLIC_SOURCE_SUBSTITUTED. Measures whose
      measure_status is UNREPORTED_EXCLUDED contribute nothing and are not
      averaged. Domain membership comes from the pinned
      MethodologyVersion.measure_definitions entry for the measure_code.
    formula: |
      for each measure defined in the pinned MethodologyVersion.measure_definitions, in array order:
        converted = derived_value * scale_factor
        if the measure was not submitted and no public-source value exists:
            the measure is UNREPORTED_EXCLUDED and is skipped entirely
        else:
            converted_rounded = round_half_up(converted, 1)      # ONE rounding per measure
        append converted_rounded to the bucket named by that measure's domain

      for each of the five domains:
        domain_score = round_half_up(sum(bucket) / len(bucket), 2)   # ONE rounding per domain

      PINNED ROUNDING ORDER: a measure is rounded to 1 decimal place BEFORE
      it enters its domain bucket, and each domain mean is rounded to 2
      decimal places AFTER the bucket mean is taken. No other rounding is
      performed anywhere in the pipeline.
    constants:
      MEASURE_ROUND_DP: 1
      DOMAIN_ROUND_DP: 2
      DOMAINS: [PATIENT_SAFETY, INFECTION_PREVENTION, CPOE, STAFFING, SURGICAL_VOLUME]
    precision: "per-measure 1 decimal place; per-domain 2 decimal places; round_half_up"
    variants:
      - name: no_intermediate_rounding
        when: "A reader applies only the final domain rounding and averages unconverted precision internally."
        difference: >
          Averages the unconverted values and rounds once at the domain level.
          For the controlled fixture this yields INFECTION_PREVENTION = 83.15
          against the pinned 83.13 — the two domain scores differ in the
          second decimal place, and the divergence propagates into the
          composite.

  - name: composite_score
    trigger: "ScoreRun creation; ReleaseCycle.open-review re-derivation"
    algorithm: weighted_scoring
    input_set: >
      The five domain scores of the current run, the pinned
      MethodologyVersion's per-domain weight and multiplier, and that
      version's per-domain peer_mean / peer_sd.
    formula: |
      A domain is RETAINED only when at least one measure in it has
      measure_status REPORTED or PUBLIC_SOURCE_SUBSTITUTED. A domain whose
      measures are all UNREPORTED_EXCLUDED is DROPPED: it contributes neither a
      numerator term nor a denominator weight.

      for each RETAINED domain d in the pinned measure_definitions domain order:
        standardized = clamp(50.00 + 15.00 * (domain_score[d] - peer_mean[d]) / peer_sd[d], 0.00, 100.00)
        term[d] = standardized * domain_weight[d] * domain_multiplier[d]
        effective_weight[d] = domain_weight[d] * domain_multiplier[d]

      composite = sum(term[d] for retained d) / sum(effective_weight[d] for retained d)
      composite = round_half_up(composite, 2)      # exactly ONE rounding, at the very end

      PINNED EVALUATION ORDER: the division happens last, over the retained
      domain set, and no intermediate standardized value or term is rounded.
    constants:
      STANDARDIZATION_MIDPOINT: 50.00
      STANDARDIZATION_SPAN: 15.00
      SCORE_FLOOR: 0.00
      SCORE_CEILING: 100.00
      COMPOSITE_ROUND_DP: 2
      MAX_RENORMALIZATION_PASSES: 1
    precision: "2 decimal places, round_half_up, applied once to the final quotient"
    variants:
      - name: final_renormalized
        when: "A domain is dropped from the cycle (readiness_state OMITTED_FROM_CYCLE, or a GRANTED reanalysis makes the official cycle final)."
        difference: >
          The dropped domain disappears from BOTH the numerator and the
          denominator, so the score is renormalised over the retained
          effective weights, and grade_assignment's downgrade map applies one
          letter down whenever the run's reliability_weight is below 0.60.
          Because the dropped domain removes its weight from the DENOMINATOR
          as well as its term from the numerator, dropping a domain that
          standardized BELOW the retained average RAISES the score. On the
          controlled fixture the provisional composite is 60.38 over an
          effective-weight sum of 1.01 and letter C; dropping SURGICAL_VOLUME
          (standardized 1.25) gives 65.12 over 0.935 — a rise of 4.74 that
          crosses the 62.50 cut-off and yields letter B when reliability is
          0.6220, or letter B downgraded to C when reliability is below 0.60.
      - name: final_renormalized_iteration_bound
        when: "The retained-domain set would itself be chosen from the resulting letter band."
        difference: >
          The apparent circularity is broken by pinning a hard iteration
          bound rather than iterating to a fixed point. Pass 1 computes the
          letter from the fully populated composite and FIXES the dropped
          domain set from that band. Pass 2 renormalizes over the frozen set
          and recomputes the letter. The algorithm then STOPS after exactly
          MAX_RENORMALIZATION_PASSES renormalization passes and never
          re-selects the dropped set, so the reported value does not depend on
          further iteration.

  - name: grade_assignment
    trigger: "Every ScoreRun completion; every Grade re-derivation"
    algorithm: threshold
    input_set: "The run's composite_score and the run's reliability_weight"
    formula: |
      base_letter = A if composite >= 85.00
                    B if composite >= 62.50
                    C if composite >= 45.00
                    D if composite >= 30.00
                    F otherwise

      if reliability_weight >= 0.60:
          letter_grade = base_letter
          grade_cap_applied = false
      else:
          letter_grade = DOWNGRADE[base_letter]
          grade_cap_applied = true

      DOWNGRADE = { A: B, B: C, C: D, D: F, F: F }
    constants:
      CUT_A: 85.00
      CUT_B: 62.50
      CUT_C: 45.00
      CUT_D: 30.00
      RELIABILITY_CAP_THRESHOLD: 0.60
    precision: "cut-offs compared against composite_score already rounded to 2 decimal places"
    variants:
      - name: downgrade_on_cap
        when: "reliability_weight < 0.60, i.e. a thin or disputed survey"
        difference: >
          Applies exactly one DOWNGRADE step (never two, never zero) and sets
          grade_cap_applied true. A hospital sitting exactly on a cut-off is
          compared with >= and then downgraded, so a composite of exactly
          85.00 with a capped survey reports B, not A.

  - name: survey_certification_reliability
    trigger: "Survey verification returning ACCEPT; Survey resolution followed by ACCEPT; ReanalysisRequest GRANT"
    algorithm: threshold
    input_set: >
      The survey's started_survey_count, completed_survey_count and
      entity_annual_discharges, plus its verification_cycle.
    formula: |
      sample_rate = round_half_up(completed_survey_count / entity_annual_discharges, 4)

      base = 1.00 if sample_rate >= 0.50
             0.60 if sample_rate >= 0.25
             0.00 otherwise

      coverage = 0.50 + 0.50 * min(started_survey_count, 500) / 500
      reliability_weight = round_half_up(base * coverage, 4)

      grade_cap_applied = reliability_weight < 0.60
      verification_complete = sample_rate >= 0.10
    constants:
      SAMPLE_RATE_FULL: 0.50
      SAMPLE_RATE_PARTIAL: 0.25
      BASE_FULL: 1.00
      BASE_PARTIAL: 0.60
      BASE_NONE: 0.00
      RESPONDENT_SCALE_CAP: 500
      COVERAGE_FLOOR: 0.50
      GRADE_CAP_THRESHOLD: 0.60
      VERIFICATION_FLOOR: 0.10
    precision: "sample_rate 4 decimal places; reliability_weight 4 decimal places; round_half_up"
    variants:
      - name: reliability_floor_only
        when: "A reader caps the grade strictly on the sample_rate band and ignores the respondent-coverage multiplier."
        difference: >
          Uses base alone as the reliability weight. For a survey with
          sample_rate 0.30 and started_survey_count 40, the pinned weight is
          0.60 * (0.50 + 0.50 * 40 / 500) = 0.3240 — below the 0.60 cap — while
          the floor-only reader reports 0.60 and no cap. The letters differ.

  - name: composite_adjusted_for_reanalysis
    trigger: "ReleaseCycle.open-review re-derivation; Grade.CORRECTED re-derivation"
    algorithm: projection
    input_set: >
      The Grade's frozen preliminary composite, every GRANTED
      ReanalysisRequest against the hospital for the cycle's methodology
      version, and every ACCEPTED CorrectionRequest whose HospitalReview
      belongs to the cycle.
    formula: |
      adjusted = preliminary_composite
                 + sum(adjustment_delta for GRANTED reanalysis requests whose survey is pinned to the cycle's methodology version)
                 - 4.00 * count(distinct measures fully dropped from the pinned measure set)
                 + sum(delta_points for ACCEPTED correction requests in this cycle)
      adjusted = round_half_up(adjusted, 2)
      letter_grade = grade_assignment's downgrade_on_cap variant applied to adjusted

      Notational note: adjustment_delta carries a SIGN. It is negative when a
      reanalysis replaces a high submitted value with a lower public-source
      value, and positive when it replaces a low value with a higher one. The
      signed sum above is ADDED, never taken as a magnitude.
    constants:
      DROPPED_MEASURE_POINT_PENALTY: 4.00
      ADJUSTED_ROUND_DP: 2
    precision: "2 decimal places, round_half_up"
    variants:
      - name: magnitude_penalty
        when: "A reader treats every granted reanalysis as a penalty and ignores the sign of adjustment_delta."
        difference: >
          Treats every adjustment as a penalty and SUBTRACTS its magnitude
          instead of adding its signed value, so an adjustment that RAISES the
          hospital's value lowers the composite. On the controlled fixture the
          pinned rule turns a preliminary 60.38 plus a +6.00 adjustment into
          66.38 and a B, while this variant yields 54.38 and a C.

  - name: derived_measure_value
    trigger: "HospitalMeasureSet rematerialisation for a measure with no direct submission"
    algorithm: threshold
    input_set: "Every SurveyMeasure row of the hospital, and the source program's published value for the same measure_code"
    formula: |
      NONE                : derived_value = raw_value
      RATE_TO_COUNT_FLOOR : derived_value = floor(raw_value)
      INVERSE_BOUNDED     : derived_value = 1.00 - raw_value
      PER_100_BEDS_FLOOR  : derived_value = floor(raw_value / 100)

      measure_status = REPORTED                    when a direct submission exists
                       PUBLIC_SOURCE_SUBSTITUTED   when the value came from the source program
                       UNREPORTED_EXCLUDED         when neither exists
    constants:
      INVERSE_BOUND: 1.00
      BED_DIVISOR: 100
    precision: "floored to an integer for RATE_TO_COUNT_FLOOR and PER_100_BEDS_FLOOR; 4 decimal places for INVERSE_BOUNDED"
    variants:
      - name: submitted_raw
        when: "A reader scores the hospital's submitted values and never substitutes the source program's number."
        difference: >
          Skips the conversion entirely and scores raw_value on the domain
          scale. A hospital that never submitted PSI90 and reports 1.0200 from
          the source program yields derived_value 1 for the pinned variant
          (RATE_TO_COUNT_FLOOR -> floor(1.0200) = 1) against 1.0200 for this
          variant, which on a scale_factor of 100 is a 2.00-point swing on the
          domain scale.

  - name: methodology_comparability_index
    trigger: "MethodologyVersion publication; PendingMethodologyChange review"
    algorithm: threshold
    input_set: >
      The measure_definitions array of the later version and the
      measure_definitions array of the version named by its
      previous_version_id.
    formula: |
      matched = count of measure_codes whose name appears in BOTH versions'
                       measure_definitions with an identical derivation_rule
      total   = count of measure_codes in the EARLIER version's measure_definitions
      comparability_index = round_half_up(matched / total, 4)

      comparable = comparability_index >= 0.80

      PINNED: the denominator is the EARLIER version's measure-tree size, so a
      pure addition lowers the index and a pure deletion does not raise it. A
      measure whose derivation_rule changed counts as unmatched even though
      the code is still present.
    constants:
      COMPARABILITY_FLOOR: 0.80
      INDEX_ROUND_DP: 4
    precision: "4 decimal places, round_half_up"
    variants:
      - name: symmetric_denominator
        when: "A reader divides by the LATER version's measure-tree size."
        difference: >
          Awards credit for newly added measures, so an additive change scores
          higher than the pinned denominator allows and can clear 0.80 that
          the pinned rule rejects.

  - name: employer_utilization_index
    trigger: "network-listings re-evaluation; employer summary read"
    algorithm: aggregation
    input_set: >
      The employer's network_hospital_ids and every Grade row with
      status in {SCORED, CORRECTED, CHAR_EXEMPT} whose composite_score is
      non-null, de-duplicated by hospital_id keeping the lowest created_at.
    formula: |
      ranked = { A: 4, B: 3, C: 2, D: 1, F: 0, null: 0 }
      floor_rank = ranked[minimum_acceptable_letter]

      eligible_hospital_count = count of distinct hospitals in network_hospital_ids
                                with a Grade whose ranked[letter_grade] >= floor_rank

      utilization_index = round_half_up(eligible_hospital_count / count(distinct network hospitals with any Grade row), 4)

      propensity_adjusted_indicator = round_half_up(34.00 + 0.60 * (composite_score - 50.00), 4)
    constants:
      LETTER_RANKS: { A: 4, B: 3, C: 2, D: 1, F: 0 }
      PROPENSITY_BASE: 34.00
      PROPENSITY_SLOPE: 0.60
      PROPENSITY_MIDPOINT: 50.00
    precision: "4 decimal places, round_half_up"
    variants:
      - name: listed_denominator
        when: "A reader divides by the full network_hospital_ids list including hospitals with no grade."
        difference: >
          Uses the whole listed network as the denominator instead of only the
          graded hospitals. For the reference employer with six listed
          hospitals of which three are graded and eligible, the pinned index
          is 1.0000 while the listed-denominator variant reports 0.5000.

  - name: safe_practice_credit
    trigger: "ReanalysisRequest decision; Grade status change to WITHHELD"
    algorithm: aggregation
    input_set: >
      The eight required trade-off credits for the hospital: HAND_HYGIENE,
      ICU_STAFFING, BARCODE_MED_ADMIN, SAFE_SURGERY_CHECKLIST, CAUTI_BUNDLE,
      CLABSI_BUNDLE, VTE_PROPHYLAXIS, MRSA_SCREENING.
    formula: |
      safe_practice_credit = round_half_up(earned_count / 8, 4)
      verification_completeness = round_half_up(distinct_document_codes_supplied / 10, 4)
    constants:
      REQUIRED_CREDIT_COUNT: 8
      REQUIRED_DOCUMENT_CODE_COUNT: 10
      CREDIT_ROUND_DP: 4
    precision: "4 decimal places, round_half_up"
    variants:
      - name: missing_credit_zero_fill
        when: "A reader zero-fills any credit the hospital never answered."
        difference: >
          Divides by the answered credits rather than the required eight, so
          six of eight earned reports 1.0000 instead of the pinned 0.7500.

  - name: embargo_release_readiness
    trigger: "ReleaseCycle state derivation; publish attempt"
    algorithm: threshold
    input_set: "The cycle's Grade rows, HospitalReview rows, CorrectionRequest rows, and the logical clock instant"
    formula: |
      publishable = (every Grade.status in {SCORED, CORRECTED, CHAR_EXEMPT})
                    AND (no HospitalReview.status == PENDING)
                    AND (no CorrectionRequest.status in {PENDING, ACCEPTED})
                    AND (logical_clock_instant >= publication_date)
      embargo_lifted = publishable AND (the publish action has been executed)
    constants:
      PUBLICATION_COMPARISON: ">="
    precision: "instant comparison at whole-second resolution"
    variants:
      - name: strict_publication_comparison
        when: "A reader uses a strict > against publication_date."
        difference: >
          Rejects a publish attempted at exactly publication_date, while the
          pinned >= accepts it. The boundary is observable.

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints except POST /_clock/set_current_utc

  - priority: 2
    category: auth
    check: "The role in X-User-Role holds the operation; every non-listed role is refused"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: state
    check: "Hospital.status must be ACTIVE before any budget-shaped business check"
    error_id: ERR_HOSPITAL_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /hospitals/{hospitalId}/surveys, POST /hospitals/{hospitalId}/score-runs, POST /hospitals/{hospitalId}/refresh-measures"

  - priority: 4
    category: existence
    check: "Every path-parameter id resolves to a persisted resource, validated left to right along the path"
    error_id: "ERR_HOSPITAL_NOT_FOUND | ERR_SURVEY_NOT_FOUND | ERR_SURVEY_MEASURE_NOT_FOUND | ERR_METHODOLOGY_VERSION_NOT_FOUND | ERR_HOSPITAL_METHODOLOGY_VERSION_NOT_FOUND | ERR_PENDING_METHODOLOGY_CHANGE_NOT_FOUND | ERR_MEASURE_SET_NOT_FOUND | ERR_SCORE_RUN_NOT_FOUND | ERR_RELEASE_CYCLE_NOT_FOUND | ERR_GRADE_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_CORRECTION_NOT_FOUND | ERR_REANALYSIS_REQUEST_NOT_FOUND | ERR_EMPLOYER_NOT_FOUND"
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4.5
    category: state
    check: "A survey may record only one verification decision per state: af_status must be SUBMITTED or DISCREPANCY_RESOLVED and verification_response must still be null or DISCREPANCY_REQUEST"
    error_id: ERR_SURVEY_VERIFICATION_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /surveys/{surveyId}/verify"

  - priority: 5
    category: business_safety
    check: "survey.submitted_by_user_id must differ from the verifying X-User-ID"
    error_id: ERR_SELF_VERIFICATION_FORBIDDEN
    http_status: 403
    applies_to: "POST /surveys/{surveyId}/verify"

  - priority: 6
    category: business_safety
    check: "A reanalysis GRANT whose adjusted_delta would lower the composite is refused"
    error_id: ERR_REANALYSIS_REGRESSION_FORBIDDEN
    http_status: 403
    applies_to: "POST /hospitals/{hospitalId}/reanalysis-requests/{requestId}/decide with decision=GRANT"

  - priority: 7
    category: business_referential
    check: "Every measure_code in a payload resolves inside the pinned methodology version, and every network_hospital_ids entry resolves to a Hospital"
    error_id: "ERR_MEASURE_CODE_NOT_IN_METHODOLOGY | ERR_HOSPITAL_NOT_FOUND"
    http_status: 409
    applies_to: "POST /hospitals/{hospitalId}/survey-measures, POST /hospitals/{hospitalId}/preliminary-results, POST /hospitals/{hospitalId}/preliminary-results/{reviewId}/corrections, POST /employers/{employerId}/network-listings"

  - priority: 8
    category: business_referential
    check: "Every correction's corrected_measure_codes must be a subset of the parent review's challenged_measure_codes"
    error_id: ERR_CORRECTION_MEASURE_NOT_CHALLENGED
    http_status: 409
    applies_to: "POST /hospitals/{hospitalId}/preliminary-results/{reviewId}/corrections"

  - priority: 9
    category: business_temporal
    check: "The logical clock instant must be strictly before the cycle's correction_window_ends_at"
    error_id: ERR_CORRECTION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /hospitals/{hospitalId}/preliminary-results/{reviewId}/corrections"

  - priority: 9.5
    category: business_temporal
    check: "A benefit-design window that strictly CONTAINS another Employer's window in the same (purchaser_type, minimum_acceptable_letter) scope is rejected; windows that merely touch (one's benefit_window_to equals the other's benefit_window_from) are accepted"
    error_id: ERR_BENEFIT_WINDOW_CONTAINMENT_CONFLICT
    http_status: 409
    applies_to: "POST /employers, POST /employers/{employerId}/network-listings"

  - priority: 9.7
    category: business_temporal
    check: "Two ReleaseCycles bound to DIFFERENT methodology versions must not carry publication_date values less than 30 days apart; publication_dates exactly 30 days apart are accepted (half-open buffer)"
    error_id: ERR_CYCLE_PUBLICATION_WINDOW_TOO_CLOSE
    http_status: 409
    applies_to: "POST /release-cycles"

  - priority: 10
    category: business_temporal
    check: "The logical clock instant must be at or after the cycle's publication_date before publishing"
    error_id: ERR_EMBARGO_ACTIVE
    http_status: 409
    applies_to: "POST /release-cycles/{releaseCycleId}/publish"

  - priority: 11
    category: business_constraint
    check: "Methodology comparability between the pinned version and the requested version must be at or above 0.80"
    error_id: ERR_METHODOLOGY_NOT_COMPARABLE
    http_status: 409
    applies_to: "POST /hospitals/{hospitalId}/methodology-versions, POST /pending-methodology-changes/{changeId}/review"

  - priority: 12
    category: business_constraint
    check: "A granted reanalysis must be supported by at least six distinct document codes"
    error_id: ERR_REANALYSIS_DOCUMENTS_INSUFFICIENT
    http_status: 409
    applies_to: "POST /hospitals/{hospitalId}/reanalysis-requests/{requestId}/decide with decision=GRANT"

  - priority: 13
    category: business_constraint
    check: "A reanalysis selector list must carry between 1 and 20 entries and every entry must resolve"
    error_id: "ERR_REANALYSIS_SELECTOR_ARITY | ERR_REANALYSIS_SELECTOR_UNRESOLVED"
    http_status: 400
    applies_to: "POST /hospitals/{hospitalId}/reanalysis-requests, POST /hospitals/{hospitalId}/reanalysis-requests/{requestId}/decide with decision=START_REVIEW"

  - priority: 14
    category: business_constraint
    check: "A measure set whose substituted_measure_count reaches 4 is omitted from the cycle rather than scored"
    error_id: ERR_MEASURE_SET_OMITTED
    http_status: 409
    applies_to: "POST /hospitals/{hospitalId}/score-runs"

  - priority: 14.5
    category: business_constraint
    check: "The release cycle named by a score run must declare the same methodology_version_id as the run"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /hospitals/{hospitalId}/score-runs"

  - priority: 15
    category: business_constraint
    check: "A cycle cannot publish while any Grade is WITHHELD without a recorded reason"
    error_id: ERR_CYCLE_GRADES_UNRESOLVED
    http_status: 409
    applies_to: "POST /release-cycles/{releaseCycleId}/publish"

  - priority: 15.5
    category: business_constraint
    check: "A new correction may be filed or decided only while the parent release cycle is still OPEN_REVIEW"
    error_id: ERR_CYCLE_NOT_OPEN_FOR_CORRECTIONS
    http_status: 409
    applies_to: "POST /hospitals/{hospitalId}/preliminary-results/{reviewId}/corrections, POST /hospitals/{hospitalId}/preliminary-results/{reviewId}/corrections/{correctionId}/decide"

  - priority: 16
    category: business_constraint
    check: "A cycle cycle-level operation requires the cycle to be in the state its action names"
    error_id: ERR_CYCLE_ALREADY_PUBLISHED
    http_status: 409
    applies_to: "POST /hospitals/{hospitalId}/score-runs, POST /hospitals/{hospitalId}/preliminary-results/{reviewId}/corrections, POST /release-cycles/{releaseCycleId}/publish"

  - priority: 17
    category: business_fiscal
    check: "expected_hospital_version must equal the parent Hospital's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /hospitals/{hospitalId}/refresh-measures, POST /hospitals/{hospitalId}/preliminary-results/{reviewId}/accept"

  - priority: 18
    category: existence
    check: "A required input field is absent or carries a value outside its declared type or range; a field declared foreign-key-checked and named earlier is checked before a later one"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all endpoints

  - priority: 18.1
    category: existence
    check: "ccn must be unique across all hospitals"
    error_id: ERR_DUPLICATE_CCN
    http_status: 409
    applies_to: "POST /hospitals/{hospitalId}"

  - priority: 18.2
    category: existence
    check: "teaching_status must be TEACHING or NON_TEACHING"
    error_id: ERR_INVALID_TEACHING_STATUS
    http_status: 400
    applies_to: "POST /hospitals, PUT /hospitals/{hospitalId}"

  - priority: 18.3
    category: existence
    check: "correction_type must be one of MEASURE_VALUE_ERROR | MEASURE_OMISSION | SOURCE_PROGRAM_MISMATCH"
    error_id: ERR_INVALID_CORRECTION_TYPE
    http_status: 400
    applies_to: "POST /hospitals/{hospitalId}/preliminary-results/{reviewId}/corrections"

  - priority: 18.4
    category: existence
    check: "benefit_window_to must be strictly greater than benefit_window_from"
    error_id: ERR_BENEFIT_WINDOW_INVALID
    http_status: 400
    applies_to: "POST /employers, POST /employers/{employerId}/network-listings"
# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Hospitals -------------------------------------------------------------
  - method: POST
    path: "/hospital-safety-rating/hospitals"
    description: "Register a hospital. ccn is unique across all hospitals."
    roles: [RatingAdmin]
    code: 201
    input: [name, ccn, state_code, bed_count, teaching_status, annual_discharges, survey_contact_email]
    output: Hospital
    side_effects:
      - "status = ACTIVE; disclosure_status = NEVER_SUBMITTED; worst_grade_ever = null"
      - "active_methodology_version_id = null until a methodology version is pinned"

  - method: GET
    path: "/hospital-safety-rating/hospitals"
    description: "List hospitals, optionally filtered by state_code, teaching_status or status."
    roles: [AnyAuthenticated]
    code: 200
    input: ["state_code?", "teaching_status?", "status?", "limit?", "offset?"]
    output: "Hospital[]"
    side_effects: []

  - method: GET
    path: "/hospital-safety-rating/hospitals/{id}"
    description: "Read one hospital with its computed disclosure and grade fields."
    roles: [AnyAuthenticated]
    code: 200
    input: []
    output: Hospital
    side_effects: []

  - method: PUT
    path: "/hospital-safety-rating/hospitals/{id}"
    description: "Update mutable hospital attributes; ccn is immutable."
    roles: [RatingAdmin]
    code: 200
    input: ["name?", "state_code?", "bed_count?", "teaching_status?", "annual_discharges?", "survey_contact_email?", "status?"]
    output: Hospital
    side_effects:
      - "increments Hospital.version by 1"
      - "recompute HospitalMeasureSet readiness when annual_discharges or bed_count changed"

  - method: GET
    path: "/hospital-safety-rating/hospitals/{id}/surveys"
    description: "List the surveys belonging to a hospital."
    roles: [AnyAuthenticated]
    code: 200
    input: ["af_status?", "methodology_version_id?", "limit?", "offset?"]
    output: "Survey[]"
    side_effects: []

  - method: GET
    path: "/hospital-safety-rating/hospitals/{id}/grades"
    description: "List every grade cut for a hospital, newest cycle first."
    roles: [AnyAuthenticated]
    code: 200
    input: ["status?", "release_cycle_id?", "limit?", "offset?"]
    output: "Grade[]"
    side_effects: []

  - method: GET
    path: "/hospital-safety-rating/hospitals/{id}/reviews"
    description: "List the preliminary-result reviews opened for a hospital."
    roles: [AnyAuthenticated]
    code: 200
    input: ["status?", "release_cycle_id?", "limit?", "offset?"]
    output: "HospitalReview[]"
    side_effects: []

  - method: GET
    path: "/hospital-safety-rating/hospitals/{id}/reanalysis-requests"
    description: "List the reanalysis requests raised against a hospital."
    roles: [AnyAuthenticated]
    code: 200
    input: ["status?", "survey_id?", "limit?", "offset?"]
    output: "ReanalysisRequest[]"
    side_effects: []

  # --- Methodology versions --------------------------------------------------
  - method: POST
    path: "/hospital-safety-rating/methodology-versions"
    description: "Create a methodology version in DRAFT with its measure definitions."
    roles: [RatingAdmin]
    code: 201
    input: [label, measure_definitions, publication_date, "previous_version_id?"]
    output: MethodologyVersion
    side_effects:
      - "status = DRAFT; comparability_index left null until publication"

  - method: GET
    path: "/hospital-safety-rating/methodology-versions"
    description: "List methodology versions."
    roles: [AnyAuthenticated]
    code: 200
    input: ["status?", "previous_version_id?", "limit?", "offset?"]
    output: "MethodologyVersion[]"
    side_effects: []

  - method: GET
    path: "/hospital-safety-rating/methodology-versions/{id}"
    description: "Read one methodology version including its comparability_index."
    roles: [AnyAuthenticated]
    code: 200
    input: []
    output: MethodologyVersion
    side_effects: []

  - method: POST
    path: "/hospital-safety-rating/methodology-versions/{id}/publish"
    description: "Publish a DRAFT methodology version and compute its comparability index against previous_version_id."
    roles: [RatingAdmin]
    code: 200
    input: []
    output: MethodologyVersion
    side_effects:
      - "status → PUBLISHED"
      - "comparability_index = methodology_comparability_index against previous_version_id, 4 decimal places"

  - method: POST
    path: "/hospital-safety-rating/hospitals/{id}/methodology-versions"
    description: "Pin a published methodology version to a hospital, rejecting a non-comparable change."
    roles: [RatingAdmin]
    code: 201
    input: [methodology_version_id]
    output: HospitalMethodologyVersion
    side_effects:
      - "prior HospitalMethodologyVersion for this hospital gets is_current = false"
      - "hospital.active_methodology_version_id = methodology_version_id"
      - "increments Hospital.version by 1"

  - method: POST
    path: "/hospital-safety-rating/hospitals/{id}/pending-methodology-changes"
    description: "Raise a pending methodology change from the hospital's current pin to another published version."
    roles: [RatingAdmin, HospitalRespondent]
    code: 201
    input: [to_methodology_version_id]
    output: PendingMethodologyChange
    side_effects:
      - "status = PENDING"
      - "from_hospital_methodology_version_id = the currently pinned row"
      - "increments Hospital.version by 1"

  - method: POST
    path: "/hospital-safety-rating/pending-methodology-changes/{id}/review"
    description: "Review a pending change: apply it when comparable, else reject or withdraw."
    roles: [VerificationAnalyst]
    code: 200
    input: ["decision"]
    output: PendingMethodologyChange
    side_effects:
      - "decided_by_user_id set from X-User-ID"
      - "APPLY creates a new HospitalMethodologyVersion and flips the prior row's is_current"
      - "REJECT_NOT_COMPARABLE sets status = REJECTED_NOT_COMPARABLE"
      - "increments Hospital.version by 1"

  # --- Surveys ---------------------------------------------------------------
  - method: POST
    path: "/hospital-safety-rating/hospitals/{id}/surveys"
    description: "Open a survey submission. The hospital's pinned methodology version is captured at creation."
    roles: [HospitalRespondent]
    code: 201
    input: ["started_survey_count?", "completed_survey_count?", "entity_annual_discharges?", "validation_method?"]
    output: Survey
    side_effects:
      - "af_status = AWAITING_SUBMISSION; af_certification_level = UNCERTIFIED"
      - "methodology_version_id copied from hospital.active_methodology_version_id (ERR_METHODOLOGY_VERSION_REQUIRED when null)"
      - "submitted_by_user_id = X-User-ID"
      - "increments Hospital.version by 1"

  - method: GET
    path: "/hospital-safety-rating/surveys/{id}"
    description: "Read one survey with its parallel state dimensions."
    roles: [AnyAuthenticated]
    code: 200
    input: []
    output: Survey
    side_effects: []

  - method: PUT
    path: "/hospital-safety-rating/surveys/{id}"
    description: "Correct respondent-supplied counts before submission."
    roles: [HospitalRespondent]
    code: 200
    input: ["started_survey_count?", "completed_survey_count?", "entity_annual_discharges?", "validation_method?"]
    output: Survey
    side_effects:
      - "recompute survey.sample_rate"
      - "increments Hospital.version by 1"

  - method: POST
    path: "/hospital-safety-rating/hospitals/{id}/survey-measures"
    description: "Record a reported measure for a hospital; source_program_id may be null."
    roles: [HospitalRespondent]
    code: 201
    input: [survey_id, measure_code, raw_value, "source_program_id?"]
    output: SurveyMeasure
    side_effects:
      - "creates or replaces the SurveyMeasure for the hospital and measure_code with measure_status = REPORTED"
      - "derived_value = derived_measure_value under the pinned version's derivation rule"
      - "the hospital's HospitalMeasureSet.readiness_state → INCOMPLETE"
      - "increments Hospital.version by 1"

  - method: POST
    path: "/hospital-safety-rating/surveys/{id}/submit"
    description: "Submit a survey for verification."
    roles: [HospitalRespondent]
    code: 200
    input: []
    output: Survey
    side_effects:
      - "af_status → SUBMITTED per §1.2"
      - "recompute sample_rate and Hospital.disclosure_status"
      - "increments Hospital.version by 1"

  - method: POST
    path: "/hospital-safety-rating/surveys/{id}/verify"
    description: "Verify a submitted survey, either ACCEPT or DISCREPANCY_REQUEST."
    roles: [VerificationAnalyst]
    code: 200
    input: ["verification_response"]
    output: Survey
    side_effects:
      - "af_status → VERIFIED or DISCREPANCY_OPEN per §1.2"
      - "on ACCEPT: reliability_weight recomputed and the one-letter cap cascaded to the hospital's open-review grades"
      - "increments Hospital.version by 1"

  - method: POST
    path: "/hospital-safety-rating/surveys/{id}/resolve"
    description: "Hospital responds to an open discrepancy with the demanded source documentation."
    roles: [HospitalRespondent]
    code: 200
    input: []
    output: Survey
    side_effects:
      - "af_status → DISCREPANCY_RESOLVED when every measure now carries source_program_id"
      - "increments Hospital.version by 1"

  - method: POST
    path: "/hospital-safety-rating/hospitals/{id}/public-source-measures"
    description: "Record a measure value sourced from a public reporting program for a hospital that did not submit it."
    roles: [RatingAdmin]
    code: 201
    input: [measure_code, source_program_id, source_value]
    output: SurveyMeasure
    side_effects:
      - "creates or replaces the SurveyMeasure for the measure with measure_status = PUBLIC_SOURCE_SUBSTITUTED"
      - "derived_value = derived_measure_value under the pinned version's derivation rule"
      - "the hospital's HospitalMeasureSet.readiness_state → INCOMPLETE"
      - "substituted_measure_count recomputed on the next refresh"
      - "increments Hospital.version by 1"

  # --- Measure sets and score runs -------------------------------------------
  - method: POST
    path: "/hospital-safety-rating/hospitals/{id}/refresh-measures"
    description: "Rematerialise the hospital's measure set from its surveys and the pinned methodology version."
    roles: [RatingEngine]
    code: 200
    input: [expected_hospital_version]
    output: HospitalMeasureSet
    side_effects:
      - "measures materialised in pinned measure_definitions order with derived_value and measure_status"
      - "substituted_measure_count recomputed; readiness_state derived"
      - "source_snapshot_at = current logical clock instant"
      - "reanalysis_adjustment_delta cleared on the derived values"
      - "increments Hospital.version by 1"

  - method: POST
    path: "/hospital-safety-rating/hospitals/{id}/score-runs"
    description: "Score a hospital under its pinned methodology version and cut a grade in the named cycle."
    roles: [RatingEngine]
    code: 201
    input: [methodology_version_id, release_cycle_id, expected_hospital_version]
    output: ScoreRun
    side_effects:
      - "score_state → SCORED or CHAR_EXEMPT per §1.2"
      - "domain_scores computed by domain_measure_rollup and rounded once to 2 decimal places"
      - "composite_score computed by composite_score and rounded once to 2 decimal places"
      - "base_grade_letter and letter_grade set by grade_assignment"
      - "reliability_weight read from the hospital's most recently VERIFIED survey"
      - "creates or replaces the Grade row for this hospital in the named release cycle, copying composite_score and letter_grade and setting status SCORED"
      - "release_cycle.grade_count recomputed"
      - "increments Hospital.version by 1"

  - method: GET
    path: "/hospital-safety-rating/hospitals/{id}/composite-preview"
    description: "Computed read: what the hospital's composite and letter would be right now, without persisting a run."
    roles: [AnyAuthenticated]
    code: 200
    input: ["methodology_version_id?"]
    output: "{ hospital_id: string, methodology_version_id: string, domain_scores: array, composite_score: number, submitted_raw_composite_score: number, base_grade_letter: string, letter_grade: string, reliability_weight: number, grade_cap_applied: boolean, substituted_measure_count: integer }"
    side_effects: []

  - method: GET
    path: "/hospital-safety-rating/hospitals/{id}/scorecard"
    description: "Computed read: the hospital's current-grade scorecard with its peer-standardized terms per domain."
    roles: [AnyAuthenticated]
    code: 200
    input: ["release_cycle_id?"]
    output: "{ hospital_id: string, release_cycle_id: string, domain_scores: array, composite_score: number, letter_grade: string, grade_cap_applied: boolean, method_source: string, employer_eligible: boolean }"
    side_effects: []

  # --- Preliminary results, reviews and corrections --------------------------
  - method: POST
    path: "/hospital-safety-rating/hospitals/{id}/preliminary-results"
    description: "Open a preliminary-result review for a hospital record, optionally challenging measure codes."
    roles: [VerificationAnalyst]
    code: 201
    input: ["grade_id", "challenged_measure_codes?"]
    output: HospitalReview
    side_effects:
      - "status = PENDING"
      - "preliminary_composite_score and preliminary_letter_grade frozen from the Grade"
      - "increments Hospital.version by 1"

  - method: POST
    path: "/hospital-safety-rating/hospitals/{id}/preliminary-results/{reviewId}/accept"
    description: "Hospital accepts its preliminary result, closing the review without a correction."
    roles: [HospitalRespondent]
    code: 200
    input: [expected_hospital_version]
    output: HospitalReview
    side_effects:
      - "status → ACCEPTED; accepted_at = current logical clock instant"
      - "ReleaseCycle.state re-derived from its children"
      - "increments Hospital.version by 1"

  - method: POST
    path: "/hospital-safety-rating/hospitals/{id}/preliminary-results/{reviewId}/corrections"
    description: "File a correction against an open review, inside the correction window."
    roles: [HospitalRespondent]
    code: 201
    input: [correction_type, corrected_measure_codes, supporting_reference]
    output: CorrectionRequest
    side_effects:
      - "status = PENDING"
      - "HospitalReview.status → CORRECTION_REQUESTED"
      - "increments Hospital.version by 1"

  - method: POST
    path: "/hospital-safety-rating/hospitals/{id}/preliminary-results/{reviewId}/corrections/{correctionId}/decide"
    description: "Accept or reject a filed correction; acceptance re-derives the grade inside the window."
    roles: [RatingEngine]
    code: 200
    input: ["decision"]
    output: CorrectionRequest
    side_effects:
      - "status → ACCEPTED or REJECTED"
      - "on ACCEPT: Grade.composite_score and Grade.letter_grade re-derived per §1.2 Grade.SCORED_to_CORRECTED"
      - "increments Hospital.version by 1"

  - method: GET
    path: "/hospital-safety-rating/hospitals/{id}/review-summary"
    description: "Computed read: how many of the hospital's challenged measures are still unresolved in the open cycle."
    roles: [AnyAuthenticated]
    code: 200
    input: ["release_cycle_id?"]
    output: "{ hospital_id: string, release_cycle_id: string, review_status: string, challenged_count: integer, unresolved_challenged_count: integer, reported_composite_score: number, base_grade_letter: string, letter_grade: string }"
    side_effects: []

  # --- Reanalysis requests ---------------------------------------------------
  - method: POST
    path: "/hospital-safety-rating/hospitals/{id}/reanalysis-requests"
    description: "Raise a reanalysis request naming a subset of measures or domains and any documents supplied."
    roles: [HospitalRespondent]
    code: 201
    input: [survey_id, subset_selector, "supporting_documents?", "requested_delta?"]
    output: ReanalysisRequest
    side_effects:
      - "status = PENDING; adjusted_delta = 0"
      - "documents_sufficient derived from the distinct document codes supplied"
      - "increments Hospital.version by 1"

  - method: POST
    path: "/hospital-safety-rating/hospitals/{id}/reanalysis-requests/{requestId}/decide"
    description: "Review or decide a reanalysis request: START_REVIEW, GRANT, REFUTE or WITHDRAW."
    roles: [VerificationAnalyst, HospitalRespondent]
    code: 200
    input: ["decision"]
    output: ReanalysisRequest
    side_effects:
      - "status transitions per §1.2 ReanalysisRequest"
      - "on GRANT: measure set rematerialised, adjusted_delta applied, cascade into Grade and Survey"
      - "on REFUTE: disclosure_status and dependent measure statuses recomputed"
      - "increments Hospital.version by 1"

