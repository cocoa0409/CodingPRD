        claim_type: violation_to_error
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_FORBIDDEN_OWNERSHIP]"
        distinguishing_aspect: "Entity-backed ownership: FILMMAKER B cannot read A's submission (403 ERR_FORBIDDEN_OWNERSHIP); PROGRAMMER p2 cannot score p1's assignment."
        test_recipe:
          setup: ["Edition SCREENING; film by A IN_SCREENING; assignment a1 to p1; submitter B exists"]
