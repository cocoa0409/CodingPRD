  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: offer_validity_half_open_overlap
        grounds:
          - state_machines.LoanOffer.DRAFT_to_OFFERED
          - errors[ERR_OFFER_OVERLAP_ACTIVE]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN validity window [issued_at, expires_at)
          on the LoanOffer resource. A second offer cannot be issued while the
          first is OFFERED; at exactly expires_at the window is closed, so a
          new issue at that instant succeeds (adjacent allowed).
        test_recipe:
          setup:
            - "Flat merchant (TX) ELIGIBLE; offer O1 issued at 2026-09-01 (window [2026-09-01, 2026-10-01)); offer O2 generated but not issued"
          setup_api_calls:
            - call: "POST /lending/merchants"
              payload: { legal_name: "Flat Co", state_code: "TX", owner_name: "Flat Line", processing_started_at: "2023-01-01T00:00:00Z" }
