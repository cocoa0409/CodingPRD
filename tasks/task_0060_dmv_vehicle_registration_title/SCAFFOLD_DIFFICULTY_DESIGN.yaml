            - call: "POST /fee-assessments"
              payload: { registration_id: "${reg_id}" }
              as: ClerkAgent
              captures: { fa_id: $.data.id }
            - call: "POST /fee-assessments/${fa_id}/pay"
              payload: {}
              as: ClerkAgent
            - call: "POST /registrations/${reg_id}/activate"
              payload: {}
              as: ClerkAgent
            - call: "POST /license-plates"
              payload: { registration_id: "${reg_id}", plate_number: "ELEC-0101", plate_type: "ELECTRONIC", expected_registration_version: "${reg_v0}" }
              as: ClerkAgent
              captures: { plate_id: $.data.id }
            - call: "POST /license-plates/${plate_id}/activate"
              payload: {}
              as: ClerkAgent
            - call: "POST /registrations/${reg_id}/suspend"
              payload: {}
              as: DmvAdmin
            - call: "GET /registrations/${reg_id}"
              payload: {}
              as: DmvAdmin
              captures: { reg_v_susp: $.data.version }
          trigger:
            - call: "POST /registrations/${reg_id}/reinstate"
              payload: { expected_registration_version: "${reg_v_susp}" }
              as: DmvAdmin
          assert:
            - "Registration.${reg_id}.status == ACTIVE"
            - "LicensePlate.${plate_id}.status == ACTIVE"
