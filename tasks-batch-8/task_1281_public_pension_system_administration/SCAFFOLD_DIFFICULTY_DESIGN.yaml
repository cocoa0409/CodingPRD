      - name: accept_expired_quote_with_overlapping_period_temporal_wins
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_QUOTE_EXPIRED]
          - errors[ERR_PURCHASE_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Error-category pair business_temporal(7) vs business_constraint(8):
          the quote is past quote_expires_at (temporal) AND the purchase period
          overlaps an already-credited fiscal year (constraint) — the temporal
          error ERR_QUOTE_EXPIRED must win. Companion instance
          approve_cancelled_application_with_outstanding_balance_state_wins uses
          the state vs fiscal pair.
        test_recipe:
          setup:
            - "Member with ACCEPTED FY2023 line (credited 2023-01-01..2023-12-31); purchase created with overlapping period 2023-06-01..2024-05-31? No — overlap is checked at purchase CREATE, so the purchase could not exist. Instead the conflict is engineered: purchase period 2023-12-31..2024-12-30 would fail creation. Use a purchase created BEFORE the FY2023 line was accepted (overlap evaluated against ACCEPTED lines at creation time): purchase created when only FY2022 accepted (period 2023-06-01..2024-05-31 OK), then FY2023 line accepted afterwards (crediting 2023), then quote, then clock advanced past quote_expires_at (90 days) so accept violates temporal AND would violate constraint if temporal passed."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: FundAdmin }
            - call: "POST /pension-funds"
              payload: { fund_name: "State Retirement", cola_rate_pct: 0.025, earnings_limit_annual_cents: 3000000 }
              as: FundAdmin
            - call: "POST /employers"
              payload: { name: "Airport Auth", employer_code: "AIR" }
              as: FundAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /members"
              payload: { employer_id: "${emp_id}", full_name: "Temporal Tessa", date_of_birth: "1966-01-01", hire_date: "2016-01-01" }
              as: MemberServicesAnalyst
              captures: { mem_id: $.data.id }
            # first report: FY2022 only, accepted (member has salary -> quote possible)
            - call: "POST /employers/${emp_id}/contribution-reports"
              payload: { period_start: "2022-01-01", period_end: "2023-01-01", declared_total_cents: 440000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { rep_a: $.data.id }
            - call: "POST /contribution-reports/${rep_a}/lines"
              payload: { member_id: "${mem_id}", fiscal_year: 2022, period_salary_cents: 5500000, contribution_amount_cents: 440000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { l22: $.data.id }
            - { call: "POST /contribution-reports/${rep_a}/submit", payload: {}, as: EmployerClerk, as_user_id: "${emp_id}" }
            - { call: "POST /contribution-reports/${rep_a}/lines/${l22}/review", payload: { decision: "ACCEPT" }, as: MemberServicesAnalyst }
            - { call: "POST /contribution-reports/${rep_a}/finalize", payload: {}, as: MemberServicesAnalyst }
            # purchase created while FY2023 not yet credited -> no overlap at creation
            - call: "POST /members/${mem_id}/service-purchases"
              payload: { purchase_type: "PRIOR_SERVICE", service_period_start: "2023-06-01", service_period_end: "2024-05-31", years_purchased: 1.0 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { pur_id: $.data.id }
            - { call: "POST /service-purchases/${pur_id}/quote", payload: {}, as: MemberServicesAnalyst, captures: { quo_exp: $.data.quote_expires_at } }
            # now FY2023 gets credited (would overlap the purchase period if accept re-checked constraint)
            - call: "POST /employers/${emp_id}/contribution-reports"
              payload: { period_start: "2023-01-01", period_end: "2024-01-01", declared_total_cents: 480000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { rep_b: $.data.id }
            - call: "POST /contribution-reports/${rep_b}/lines"
              payload: { member_id: "${mem_id}", fiscal_year: 2023, period_salary_cents: 6000000, contribution_amount_cents: 480000 }
              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { l23: $.data.id }
            - { call: "POST /contribution-reports/${rep_b}/submit", payload: {}, as: EmployerClerk, as_user_id: "${emp_id}" }
            - { call: "POST /contribution-reports/${rep_b}/lines/${l23}/review", payload: { decision: "ACCEPT" }, as: MemberServicesAnalyst }
            - { call: "POST /contribution-reports/${rep_b}/finalize", payload: {}, as: MemberServicesAnalyst }
            # advance clock past quote expiry (2026-01-01 + 90 days = 2026-04-01; move to 2026-04-02)
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-02T00:00:00Z" }, as: FundAdmin }
          trigger:
            - call: "POST /service-purchases/${pur_id}/accept"
              payload: { installment_count: 6 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_QUOTE_EXPIRED (temporal priority 7 beats constraint priority 8)"
            - "error is NOT ERR_PURCHASE_PERIOD_OVERLAP even though the purchase period 2023-06-01..2024-05-31 shares days with credited FY2023"
            - "ServicePurchase.${pur_id}.status == EXPIRED after the failed accept (lazy expiry side effect)"

