      - name: business_safety_vs_business_constraint_scope_decide_conflict
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_REVIEWER_CONFLICT]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Category pair (business_safety vs business_constraint): a
          review-window creation whose reviewer_id equals the owning developer id
          (segregation-of-duties violation, priority 6) AND whose interval is
          structurally inverted (ends_at <= starts_at, priority 7) MUST surface
          ERR_REVIEWER_CONFLICT — the safety check outranks the constraint check.
        test_recipe:
          setup:
            - "App a10 IN_REVIEW with version v10 IN_REVIEW owned by developer d10"
          setup_api_calls:
            - call: "POST /developers"
