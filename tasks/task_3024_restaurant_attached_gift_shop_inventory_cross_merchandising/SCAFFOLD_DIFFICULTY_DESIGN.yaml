              as: RetailLead
              captures: { r_a_id: $.data.id }
            - call: "POST /retail-ops/receipts/${r_a_id}/reconcile"
              payload: {}
              as: RetailLead
              captures: { a_recognized: $.data.recognized_retail_cents }
            - call: "POST /retail-ops/receipts"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", receipt_number: "R-1042-0019", lines: [{ item_id: "${item_book_id}", quantity: 1, unit_price_cents: 3200, discount_pct: 0.0, line_kind: "RETAIL" }], restaurant_share_cents: 0, restaurant_share_basis: "CHECK_TOTAL", payment_method: "CARD" }
              as: RetailLead
