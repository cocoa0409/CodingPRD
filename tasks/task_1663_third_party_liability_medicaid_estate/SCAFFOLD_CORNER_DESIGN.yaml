          assert:
            - "v1 == 1, v2 == 2, v3 == 3 (expense-claim side effect bumps the parent case version)"

      - name: derived_total_recovered_reconciles_after_reverse
        claim_type: derived_field_reconciliation
        grounds: [entities.TplCase.fields.total_recovered_cents, state_machines.RecoveryPosting.POSTED_to_REVERSED]
        distinguishing_aspect: "total_recovered_cents tracks the POSTED posting set: 0 -> 200000 on post -> 0 on reverse, with no drift after the compensating action."
