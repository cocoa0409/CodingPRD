              payload: { iata_code: "PHX", name: "Phoenix Sky Harbor", city: "Phoenix", state_code: "AZ" }
              as: OpsAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /partner-agreements"
              payload: { airport_id: "${ap_id}", rev_share_rate: 0.10, subscription_share_rate: 0.02, monthly_minimum_cents: 10000, federal_integration: false, staffing_footprint_seats: 4, term_months: 12, effective_from: "2026-09-01T00:00:00Z" }
              as: PartnerManager
              captures: { agr_id: $.data.id }
