# =============================================================================
# §1.8 Scaffold Difficulty Design — task_2472_employer_tuition_benefit_administration
# Nine §0.5 difficulty rules x 2 instances each = 18 instances.
# Every instance starts from an empty database; YAML anchors below are shared
# setup fragments only (no state leaks between instances).
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: reserve_versus_settled_award_divergence_on_same_enrollment
        grounds: >-
          §1.4 benefit_award_computation declares three variants; provisional_reserve fires at
          POST /enrollments while reimbursement_outcome_conditioned_final fires at
          POST /reimbursement-claims/{id}/decide. Both read the same Enrollment.gross_tuition_cents
          and the same BenefitPolicy.reimbursement_pct, yet the final variant adds
          GRADE_BONUS_PCT (0.10) once AcademicOutcome.grade_points >= GRADE_BONUS_MIN_POINTS (3.50),
          so the settled amount must exceed the reserved amount by a pinned delta and
          §1.4 annual_cap_ledger must move the delta from reserved to disbursed.
        distinguishing_aspect: >-
          Operates on the Enrollment/ReimbursementClaim award domain (money awarded for one
          enrollment). The paired instance operates on the TaxLedgerEntry domain (§127 exclusion
          split across a tax year), a different entity domain entirely.
        test_recipe:
          setup: >-
            Northwind Retail Group with an ACTIVE REIMBURSEMENT policy (pct 0.60, cap 600000),
            an eligible employee (tenure 18 months, 32 weekly hours, RETAIL_FRONTLINE), an ACTIVE
            partner agreement at 0.25 discount over a 41002-cent-per-credit bachelor program,
            and a curated catalog listing at 30752 cents per credit.
          setup_api_calls:
            - &a_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - &a_employer
              call: "POST /employers"
              payload:
                legal_name: "Northwind Retail Group"
                benefit_admin_contact_email: "benefits@northwind-retail.example"
                fiscal_year_start_month: 7
              as: PlatformAdmin
              captures: { employer_id: "$.data.id" }
            - &a_policy
              call: "POST /employers/${employer_id}/benefit-policies"
              payload:
                effective_from: "2026-07-01"
                effective_to: "2027-07-01"
                min_tenure_months: 6
                min_weekly_hours: 20
                eligible_job_families: ["RETAIL_FRONTLINE", "OPERATIONS"]
                annual_cap_cents: 600000
                funding_model: "REIMBURSEMENT"
                reimbursement_pct: 0.60
                max_concurrent_credits: 9
                drop_window_days: 14
                service_commitment_months: 12
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { policy_id: "$.data.id" }
            - &a_activate_policy
              call: "POST /benefit-policies/${policy_id}/activate"
              payload: {}
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
            - &a_employee
              call: "POST /employers/${employer_id}/employees"
              payload:
                full_name: "Dana Okafor"
                work_email: "dana.okafor@northwind-retail.example"
                hire_date: "2025-01-15"
                weekly_hours: 32
                job_family: "RETAIL_FRONTLINE"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { employee_id: "$.data.id" }
            - &a_school
              call: "POST /schools"
              payload:
                legal_name: "Cascade State University"
                state_code: "WA"
                contact_email: "partners@cascade-state.example"
              as: PlatformAdmin
              captures: { school_id: "$.data.id" }
            - &a_program
              call: "POST /schools/${school_id}/programs"
              payload:
                name: "BS Supply Chain Management"
                credential_type: "BACHELOR"
                skill_track: "SUPPLY_CHAIN"
                list_tuition_per_credit_cents: 41002
                total_credits: 120
                term_length_weeks: 15
              as: SchoolPartner
              as_user_id: "${school_id}"
              captures: { program_id: "$.data.id" }
            - &a_agreement
              call: "POST /partner-agreements"
              payload:
                school_id: "${school_id}"
                employer_id: "${employer_id}"
                negotiated_discount_pct: 0.25
                direct_bill_enabled: true
                effective_from: "2026-07-01"
                effective_to: "2027-06-30"
              as: PlatformAdmin
              captures: { agreement_id: "$.data.id" }
            - &a_activate_agreement
              call: "POST /partner-agreements/${agreement_id}/activate"
              payload: {}
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { agreement_version: "$.data.version" }
            - &a_listing
              call: "POST /catalog-listings"
              payload:
                employer_id: "${employer_id}"
                program_id: "${program_id}"
                agreement_id: "${agreement_id}"
                expected_agreement_version: "${agreement_version}"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { listing_id: "$.data.id" }
            - &a_read_employee
              call: "GET /employees/${employee_id}"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { employee_version: "$.data.version" }
            - &a_enroll3
              call: "POST /enrollments"
              payload:
                employee_id: "${employee_id}"
                catalog_listing_id: "${listing_id}"
                term_code: "2026-FA"
                term_start_date: "2026-09-01"
                term_end_date: "2026-12-15"
                credits: 3
                expected_employee_version: "${employee_version}"
              as: Employee
              as_user_id: "${employee_id}"
              captures: { enrollment_id: "$.data.id", reserved_cents: "$.data.employer_reserved_cents" }
            - &a_confirm3
              call: "POST /enrollments/${enrollment_id}/confirm-registration"
              payload: {}
              as: SchoolPartner
              as_user_id: "${school_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /enrollments/${enrollment_id}/academic-outcomes"
              payload:
                term_code: "2026-FA"
                completion_status: "PASSED"
                credits_earned: 3
                grade_points: 3.70
              as: SchoolPartner
              as_user_id: "${school_id}"
            - call: "POST /enrollments/${enrollment_id}/reimbursement-claims"
              payload:
                amount_requested_cents: 92256
                receipt_reference: "CSU-2026FA-DOKAFOR-01"
              as: Employee
              as_user_id: "${employee_id}"
              captures: { claim_id: "$.data.id" }
          trigger: "POST /reimbursement-claims/${claim_id}/decide with decision APPROVE"
          assert: >-
            The provisional variant produced gross_tuition_cents 92256 (round_half_up(41002 * 0.75)
            = 30752 per credit, times 3) and employer_reserved_cents 55354
            (round_half_up(92256 * 0.60) = 55353.6 -> 55354), leaving cap_available_cents 544646.
            The final variant applies effective_pct = 0.60 + 0.10 = 0.70 because grade_points 3.70
            >= 3.50, so the decide response has approved_amount_cents 64579
            (round_half_up(92256 * 0.70) = 64579.2 -> 64579) and platform_admin_fee_cents 3229
            (round_half_up(64579 * 0.05) = 3228.95 -> 3229; Employer.total_disbursed_cents was 0
            before this settlement, so the tier-1 rate applies). The divergence delta is
            64579 - 55354 = 9225. GET /enrollments/${enrollment_id} then shows funding_status
            SETTLED, employer_settled_cents 64579, employer_disbursed_cents 64579, and
            employee_share_cents 27677 (92256 - 64579), and GET /employees/${employee_id} shows
            cap_reserved_cents 0, cap_disbursed_cents 64579, cap_available_cents 535421.

      - name: chronological_versus_annual_true_up_tax_exclusion_divergence
        grounds: >-
          §1.4 tax_exclusion_split declares variants per_event_chronological (runs on each
          disbursement, consuming TAX_EXCLUSION_LIMIT_CENTS 525000 in posting order) and
          annual_true_up_aggregate (runs on POST /_ops/term-close with run_annual_true_up,
          recomputing the exclusion against the year's NET benefit after reversals). A reversal
          posted after the limit was already consumed makes the two variants disagree: the
          chronological view leaves 52500 cents of imputed income standing, while the annual
          aggregate view frees that room and must post a compensating TRUE_UP entry.
        distinguishing_aspect: >-
          Operates on the TaxLedgerEntry / Employee tax-year domain and diverges over posting
          order versus year-end aggregate, whereas the paired instance operates on the
          Enrollment/ReimbursementClaim award domain and diverges over provisional versus
          outcome-conditioned percentage.
        test_recipe:
          setup: >-
            A DIRECT_BILL employer with cap 1000000 and one eligible employee; a certificate
            program listed at 52500 cents per credit. Enrollment E1 (10 credits, 525000 cents) is
            billed and paid, exactly consuming the 525000 §127 limit; enrollment E2 (1 credit,
            52500 cents) is billed and paid, producing 52500 of imputed income; then E1 receives a
            FAILED outcome, which reverses its 525000 of excluded benefit.
          setup_api_calls:
            - &b_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - &b_employer
              call: "POST /employers"
              payload:
                legal_name: "Beacon Analytics Holdings"
                benefit_admin_contact_email: "benefits@beacon-analytics.example"
                fiscal_year_start_month: 1
              as: PlatformAdmin
              captures: { employer_id: "$.data.id" }
            - &b_policy
              call: "POST /employers/${employer_id}/benefit-policies"
              payload:
                effective_from: "2026-01-01"
                effective_to: "2027-01-01"
                min_tenure_months: 3
                min_weekly_hours: 20
                eligible_job_families: ["CORPORATE"]
                annual_cap_cents: 1000000
                funding_model: "DIRECT_BILL"
                reimbursement_pct: 1.00
                max_concurrent_credits: 12
                drop_window_days: 7
                service_commitment_months: 12
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { policy_id: "$.data.id" }
            - &b_activate_policy
              call: "POST /benefit-policies/${policy_id}/activate"
              payload: {}
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
            - &b_employee
              call: "POST /employers/${employer_id}/employees"
              payload:
                full_name: "Priya Raman"
                work_email: "priya.raman@beacon-analytics.example"
                hire_date: "2024-06-01"
                weekly_hours: 40
                job_family: "CORPORATE"
              as: BenefitAdministrator
              as_user_id: "${employer_id}"
              captures: { employee_id: "$.data.id" }
            - &b_school
              call: "POST /schools"
              payload:
                legal_name: "Riverbend Technical Institute"
                state_code: "OR"
                contact_email: "partners@riverbend-tech.example"
              as: PlatformAdmin
              captures: { school_id: "$.data.id" }
            - &b_program
              call: "POST /schools/${school_id}/programs"
              payload:
                name: "Certificate in Data Analytics"
                credential_type: "CERTIFICATE"
                skill_track: "DATA_ANALYTICS"
                list_tuition_per_credit_cents: 70000
                total_credits: 24
                term_length_weeks: 12
              as: SchoolPartner
              as_user_id: "${school_id}"
              captures: { program_id: "$.data.id" }
            - &b_agreement
              call: "POST /partner-agreements"
              payload:
                school_id: "${school_id}"
                employer_id: "${employer_id}"
                negotiated_discount_pct: 0.25
                direct_bill_enabled: true
                effective_from: "2026-01-01"
