            - call: "POST /api/record-books/${rb_id}/submit"
              payload: { expected_record_book_version: "${rb_v_stale}", completeness: 70, accuracy: 70, financial: 70, reflection: 70 }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /api/record-books/${rb_id}/begin-review"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/record-books/${rb_id}/return"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
          trigger:
            - call: "POST /api/record-books/${rb_id}/submit"
              payload: { expected_record_book_version: "${rb_v_stale}", completeness: 90, accuracy: 90, financial: 90, reflection: 90 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION  # captured version is now stale after prior mutations"
