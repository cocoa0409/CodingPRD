          One deliver call reconciles the ancestor ledger and the order's invoice at once:
          fulfilled_tons 0 -> 500.00, take_pct 0 -> 50.00, open_committed_tons 1000 -> 500.00, while
          the invoice freezes product 500 * 80.00 = 40000.00, freight at the SOURCE lot's depot rate
          500 * 12.500 = 6250.00, no storm surcharge and no guarantee credit (market 82.00 is under
