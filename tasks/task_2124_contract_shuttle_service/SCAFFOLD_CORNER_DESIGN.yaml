        distinguishing_aspect: "Once the maintenance cascade has pushed the route to DEGRADED, an explicit match against one of its trips returns 409 ERR_ROUTE_NOT_PUBLISHED, and the request stays PENDING rather than becoming DENIED."
        test_recipe:
