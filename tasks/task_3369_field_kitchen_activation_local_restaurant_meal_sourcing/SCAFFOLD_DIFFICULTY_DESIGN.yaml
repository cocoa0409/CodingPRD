  - rule_id: resource_temporal_overlap
    instances:
      - name: partner_kitchen_production_windows_are_half_open_with_adjacency_allowed
        grounds:
          - validations[priority=24]
          - entities.MealOrder.fields.scheduled_start
          - entities.MealOrder.fields.production_hours
          - errors[ERR_KITCHEN_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Production windows on a PartnerKitchen are half-open [scheduled_start, scheduled_start +
