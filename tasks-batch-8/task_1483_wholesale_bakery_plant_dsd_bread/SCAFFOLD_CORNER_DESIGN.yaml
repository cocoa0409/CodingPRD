  - section: endpoints
    instances:
      - name: store_list_pagination_envelope
        claim_type: standard_crud
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "GET /bakery/stores?plant_id=..&limit=2 over 3 stores returns total_count 3, has_more true; offset 2 returns the 1 remaining row with has_more false."
        test_recipe:
          setup: ["Plant with 3 stores"]
          setup_api_calls:
            - { call: "POST /bakery/plants", payload: { name: "Plant P", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id } }
            - { call: "POST /bakery/stores", payload: { plant_id: "${p}", name: "S1", lead_time_hours: 48, min_remaining_life_hours_on_delivery: 12, shelf_capacity_units: 100 }, as: PlantAdmin }
            - { call: "POST /bakery/stores", payload: { plant_id: "${p}", name: "S2", lead_time_hours: 48, min_remaining_life_hours_on_delivery: 12, shelf_capacity_units: 100 }, as: PlantAdmin }
            - { call: "POST /bakery/stores", payload: { plant_id: "${p}", name: "S3", lead_time_hours: 48, min_remaining_life_hours_on_delivery: 12, shelf_capacity_units: 100 }, as: PlantAdmin }
          trigger:
            - call: "GET /bakery/stores?plant_id=${p}&limit=2"
              as: Any
            - call: "GET /bakery/stores?plant_id=${p}&limit=2&offset=2"
              as: Any
          assert:
            - "First page: total_count == 3, has_more == true, 2 items"
            - "Second page: total_count == 3, has_more == false, 1 item"
            - "Error responses carry data.error_id and data.message per the fixed envelope"

