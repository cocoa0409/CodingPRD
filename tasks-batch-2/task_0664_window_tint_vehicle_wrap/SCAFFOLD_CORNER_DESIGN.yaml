# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Window-Tint & Vehicle-Wrap Shop — Expert
# Breadth probe: every testable §1.1–§1.7 claim not already covered by §1.8.
# Sections/claim_types come verbatim from references/claim-extraction-guide.md.
# All chains are empty-DB executable against §1.5; numeric asserts are literals.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_vehicle_profile_computes_size_surcharge
        claim_type: Computed Fields
        grounds: [entities.VehicleProfile.fields.size_surcharge_cents]
        distinguishing_aspect: "Creating a SUV VehicleProfile sets size_surcharge_cents to 15000 (server-computed from size_class; client-supplied surcharge is ignored)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /vehicle-profiles"
              payload: { customer_user_id: "c-su", vin: "VIN-SUV", size_class: "SUV" }
              as: ShopManager
              captures: { veh: $.data.id }
          trigger:
            - call: "GET /vehicle-profiles/${veh}"
              payload: {}
              as: ShopManager
              captures: { surcharge: $.data.size_surcharge_cents }
          assert:
            - "VehicleProfile.${veh}.size_surcharge_cents == 15000"
            - "VehicleProfile.${veh}.size_class == SUV"

      - name: get_vehicle_profile_not_found
        claim_type: Not Found
        grounds:
          - entities.VehicleProfile
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /vehicle-profiles/{nonexistent-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /vehicle-profiles/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND, HTTP 404"

      - name: create_service_package_missing_required_field
        claim_type: Required Fields
        grounds:
          - entities.ServicePackage.fields.base_rate_cents
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /service-packages omitting required base_rate_cents returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /service-packages"
              payload: { name: "No Rate", service_type: "TINT", duration_minutes: 120, cure_buffer_minutes: 0, warranty_days: 365, requires_proof: false }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST, HTTP 400"

      - name: create_vehicle_invalid_enum_size_rejected
        claim_type: Type Constraints
        grounds:
          - entities.VehicleProfile.fields.size_class
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /vehicle-profiles with size_class 'VAN' (not in {SEDAN,SUV,TRUCK}) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /vehicle-profiles"
              payload: { customer_user_id: "c-bad", vin: "VIN-BAD", size_class: "VAN" }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST, HTTP 400"

      - name: quote_line_defaults_applied
        claim_type: Defaults
        grounds: [entities.QuoteLine.fields.requested_vlt_pct, entities.QuoteLine.fields.strip_depth_inches, entities.QuoteLine.fields.status]
        distinguishing_aspect: "Adding a QuoteLine without requested_vlt_pct/strip_depth_inches applies defaults 100 and 0, and status INCLUDED."
        test_recipe:
          setup: ["A DRAFT quote; a TINT package + TINT material exist."]
          setup_api_calls:
            - call: "POST /shop-locations"
              payload: { name: "S", state_code: "CA" }
              as: ShopManager
              captures: { shop: $.data.id }
            - call: "POST /state-tint-regulations"
              payload: { state_code: "CA", front_side_min_vlt_pct: 35, windshield_strip_max_inches: 5, medical_exemption_allowed: true }
              as: ComplianceOfficer
            - call: "POST /service-packages"
              payload: { name: "Tint", service_type: "TINT", base_rate_cents: 28000, duration_minutes: 120, cure_buffer_minutes: 0, warranty_days: 365, requires_proof: false }
              as: ShopManager
              captures: { pkg: $.data.id }
            - call: "POST /film-materials"
              payload: { sku: "M-DEF", category: "TINT_FILM", cure_hours: 24, price_multiplier_bps: 10000 }
              as: ShopManager
              captures: { mat: $.data.id }
            - call: "POST /vehicle-profiles"
              payload: { customer_user_id: "c-def", vin: "VIN-DEF", size_class: "SEDAN" }
              as: ShopManager
              captures: { veh: $.data.id }
            - call: "POST /quotes"
              payload: { vehicle_profile_id: "${veh}", shop_location_id: "${shop}" }
              as: ShopManager
              captures: { q: $.data.id, qv0: $.data.version }
          trigger:
            - call: "POST /quotes/${q}/lines"
              payload: { service_package_id: "${pkg}", film_material_id: "${mat}", coverage: "FULL", window_position: "REAR_WINDOW", expected_quote_version: "${qv0}" }
              as: ShopManager
              captures: { vlt: $.data.requested_vlt_pct, strip: $.data.strip_depth_inches, st: $.data.status }
          assert:
            - "the new QuoteLine.requested_vlt_pct == 100 (default)"
            - "the new QuoteLine.strip_depth_inches == 0 (default)"
            - "the new QuoteLine.status == INCLUDED (default)"

      - name: duplicate_vin_rejected
        claim_type: Type Constraints
        grounds:
          - entities.VehicleProfile.fields.vin
          - "errors[ERR_DUPLICATE_VIN]"
        distinguishing_aspect: "A second VehicleProfile with an already-used vin returns ERR_DUPLICATE_VIN (409)."
        test_recipe:
          setup: ["One VehicleProfile with vin VIN-DUP already exists."]
          setup_api_calls:
            - call: "POST /vehicle-profiles"
              payload: { customer_user_id: "c-d1", vin: "VIN-DUP", size_class: "SEDAN" }
              as: ShopManager
          trigger:
            - call: "POST /vehicle-profiles"
              payload: { customer_user_id: "c-d2", vin: "VIN-DUP", size_class: "TRUCK" }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_VIN, HTTP 409"

      - name: duplicate_state_regulation_rejected
        claim_type: Type Constraints
        grounds:
          - entities.StateTintRegulation.fields.state_code
          - "errors[ERR_DUPLICATE_STATE_REGULATION]"
        distinguishing_aspect: "A second StateTintRegulation for an already-registered state_code returns ERR_DUPLICATE_STATE_REGULATION (409)."
        test_recipe:
          setup: ["CA regulation already registered."]
          setup_api_calls:
            - call: "POST /state-tint-regulations"
              payload: { state_code: "CA", front_side_min_vlt_pct: 35, windshield_strip_max_inches: 5, medical_exemption_allowed: true }
              as: ComplianceOfficer
          trigger:
            - call: "POST /state-tint-regulations"
              payload: { state_code: "CA", front_side_min_vlt_pct: 40, windshield_strip_max_inches: 4, medical_exemption_allowed: false }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_STATE_REGULATION, HTTP 409"

      - name: immutable_state_regulation_has_no_version
        claim_type: Immutability
        grounds: [entities.StateTintRegulation]
        distinguishing_aspect: "StateTintRegulation has common_fields:false — its GET response carries id and created_at but no version field."
        test_recipe:
          setup: ["One StateTintRegulation registered."]
          setup_api_calls:
            - call: "POST /state-tint-regulations"
              payload: { state_code: "NV", front_side_min_vlt_pct: 35, windshield_strip_max_inches: 5, medical_exemption_allowed: false }
              as: ComplianceOfficer
              captures: { reg: $.data.id }
          trigger:
            - call: "GET /state-tint-regulations/${reg}"
              payload: {}
              as: ComplianceOfficer
              captures: { sc: $.data.state_code }
          assert:
            - "StateTintRegulation.${reg}.state_code == NV"
            - "the response data has no 'version' field (immutable config entity)"

      - name: list_vehicle_quotes_pagination_envelope
        claim_type: Listing
        grounds: [entities.Quote, response_envelope.pagination_fields]
        distinguishing_aspect: "GET /quotes?limit=1 returns a paginated array envelope with total_count 2 and has_more true for a vehicle with two quotes."
        test_recipe:
          setup: ["Two quotes for the same vehicle exist."]
          setup_api_calls:
            - call: "POST /shop-locations"
              payload: { name: "S", state_code: "OR" }
              as: ShopManager
              captures: { shop: $.data.id }
            - call: "POST /vehicle-profiles"
              payload: { customer_user_id: "c-pg", vin: "VIN-PG", size_class: "SEDAN" }
              as: ShopManager
              captures: { veh: $.data.id }
            - call: "POST /quotes"
              payload: { vehicle_profile_id: "${veh}", shop_location_id: "${shop}" }
              as: ShopManager
            - call: "POST /quotes"
              payload: { vehicle_profile_id: "${veh}", shop_location_id: "${shop}" }
              as: ShopManager
          trigger:
            - call: "GET /quotes?vehicle_profile_id=${veh}&limit=1&offset=0"
              payload: {}
              as: ShopManager
          assert:
            - "response_type == array; data has length 1"
            - "meta/pagination total_count == 2 and has_more == true"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: approve_already_approved_proof_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.WrapProof.PROOF_SUBMITTED_to_APPROVED]
        distinguishing_aspect: "Approving a WrapProof that is already APPROVED returns ERR_INVALID_STATE (409); approve is not idempotent from a terminal state."
        test_recipe:
          setup: ["A WrapProof on a WRAP work order already APPROVED."]
          setup_api_calls:
            - call: "POST /state-tint-regulations"
              payload: { state_code: "AZ", front_side_min_vlt_pct: 35, windshield_strip_max_inches: 5, medical_exemption_allowed: false }
              as: ComplianceOfficer
            - call: "POST /shop-locations"
              payload: { name: "S", state_code: "AZ" }
              as: ShopManager
              captures: { shop: $.data.id }
            - call: "POST /service-packages"
              payload: { name: "Wrap", service_type: "WRAP", base_rate_cents: 120000, duration_minutes: 240, cure_buffer_minutes: 60, warranty_days: 730, requires_proof: true }
              as: ShopManager
              captures: { pkg: $.data.id }
            - call: "POST /film-materials"
              payload: { sku: "V-AP", category: "WRAP_VINYL", cure_hours: 12, price_multiplier_bps: 12000 }
              as: ShopManager
              captures: { mat: $.data.id }
            - call: "POST /vehicle-profiles"
              payload: { customer_user_id: "c-ap", vin: "VIN-AP", size_class: "SEDAN" }
              as: ShopManager
              captures: { veh: $.data.id }
            - call: "POST /bays"
              payload: { shop_location_id: "${shop}", label: "B1" }
              as: ShopManager
              captures: { bay: $.data.id }
            - call: "POST /installers"
              payload: { shop_location_id: "${shop}", installer_user_id: "i-ap", full_name: "A", certified_service_types: ["WRAP"] }
              as: ShopManager
              captures: { inst: $.data.id }
            - call: "POST /quotes"
              payload: { vehicle_profile_id: "${veh}", shop_location_id: "${shop}" }
              as: ShopManager
              captures: { q: $.data.id, qv0: $.data.version }
            - call: "POST /quotes/${q}/lines"
              payload: { service_package_id: "${pkg}", film_material_id: "${mat}", coverage: "FULL", window_position: "BODY_PANEL", expected_quote_version: "${qv0}" }
              as: ShopManager
              captures: { qv1: $.data.version }
            - call: "POST /quotes/${q}/price"
              payload: { expected_quote_version: "${qv1}" }
              as: ShopManager
              captures: { qv2: $.data.version }
            - call: "POST /quotes/${q}/accept"
              payload: { expected_quote_version: "${qv2}" }
              as: Customer
              as_user_id: "c-ap"
              captures: { qv3: $.data.version }
            - call: "POST /work-orders"
              payload: { quote_id: "${q}", bay_id: "${bay}", installer_id: "${inst}", scheduled_start: "2026-06-02T09:00:00Z", expected_quote_version: "${qv3}" }
              as: ShopManager
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/proofs"
              payload: { design_ref: "d1" }
              as: Installer
              as_user_id: "i-ap"
              captures: { proof: $.data.id }
            - call: "POST /wrap-proofs/${proof}/approve"
              payload: {}
              as: Customer
              as_user_id: "c-ap"
          trigger:
            - call: "POST /wrap-proofs/${proof}/approve"
              payload: {}
              as: Customer
              as_user_id: "c-ap"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE, HTTP 409"

      - name: release_before_cure_complete_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.WorkOrder.CURING_to_COMPLETED
          - "validations[priority=20]"
        distinguishing_aspect: "Releasing a CURING WorkOrder while clock < cure_complete_at is rejected (the CURING->COMPLETED precondition clock >= cure_complete_at fails) with ERR_INVALID_STATE."
        test_recipe:
          setup: ["A TINT order completed-install at 09:00 (ceramic cure 24h, cure_complete_at 2026-06-03T09:00); clock still 2026-06-02T10:00 (< cure_complete_at)."]
          setup_api_calls:
            - call: "POST /state-tint-regulations"
              payload: { state_code: "TX", front_side_min_vlt_pct: 25, windshield_strip_max_inches: 5, medical_exemption_allowed: false }
              as: ComplianceOfficer
            - call: "POST /shop-locations"
              payload: { name: "S", state_code: "TX" }
              as: ShopManager
              captures: { shop: $.data.id }
            - call: "POST /service-packages"
              payload: { name: "Tint", service_type: "TINT", base_rate_cents: 28000, duration_minutes: 120, cure_buffer_minutes: 0, warranty_days: 365, requires_proof: false }
              as: ShopManager
              captures: { pkg: $.data.id }
            - call: "POST /film-materials"
              payload: { sku: "M-CUR", category: "TINT_FILM", cure_hours: 24, price_multiplier_bps: 10000 }
              as: ShopManager
              captures: { mat: $.data.id }
            - call: "POST /vehicle-profiles"
              payload: { customer_user_id: "c-cur", vin: "VIN-CUR", size_class: "SEDAN" }
              as: ShopManager
              captures: { veh: $.data.id }
            - call: "POST /bays"
              payload: { shop_location_id: "${shop}", label: "B1" }
              as: ShopManager
              captures: { bay: $.data.id }
            - call: "POST /installers"
              payload: { shop_location_id: "${shop}", installer_user_id: "i-cur", full_name: "C", certified_service_types: ["TINT"] }
              as: ShopManager
              captures: { inst: $.data.id }
            - call: "POST /quotes"
              payload: { vehicle_profile_id: "${veh}", shop_location_id: "${shop}" }
              as: ShopManager
              captures: { q: $.data.id, qv0: $.data.version }
            - call: "POST /quotes/${q}/lines"
              payload: { service_package_id: "${pkg}", film_material_id: "${mat}", coverage: "FULL", window_position: "REAR_SIDE", requested_vlt_pct: 50, expected_quote_version: "${qv0}" }
              as: ShopManager
              captures: { qv1: $.data.version }
            - call: "POST /quotes/${q}/price"
              payload: { expected_quote_version: "${qv1}" }
              as: ShopManager
              captures: { qv2: $.data.version }
            - call: "POST /quotes/${q}/accept"
              payload: { expected_quote_version: "${qv2}" }
              as: Customer
              as_user_id: "c-cur"
              captures: { qv3: $.data.version }
            - call: "POST /work-orders"
              payload: { quote_id: "${q}", bay_id: "${bay}", installer_id: "${inst}", scheduled_start: "2026-06-02T09:00:00Z", expected_quote_version: "${qv3}" }
              as: ShopManager
              captures: { wo: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T09:00:00Z" }
              as: ShopManager
            - call: "POST /work-orders/${wo}/start"
              payload: {}
              as: Installer
              as_user_id: "i-cur"
            - call: "POST /work-orders/${wo}/complete-install"
              payload: {}
              as: Installer
              as_user_id: "i-cur"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T10:00:00Z" }
              as: ShopManager
          trigger:
            - call: "POST /work-orders/${wo}/release"
              payload: {}
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE, HTTP 409 (clock 2026-06-02T10:00 < cure_complete_at 2026-06-03T09:00)"
            - "WorkOrder.${wo}.install_status remains CURING"

      - name: start_before_scheduled_start_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.WorkOrder.SCHEDULED_to_IN_PROGRESS]
        distinguishing_aspect: "Starting a SCHEDULED WorkOrder while clock < scheduled_start fails the precondition with ERR_INVALID_STATE."
        test_recipe:
          setup: ["A TINT work order scheduled at 2026-06-02T09:00; default clock 2026-04-01T00:00 (< scheduled_start)."]
          setup_api_calls:
            - call: "POST /state-tint-regulations"
              payload: { state_code: "NM", front_side_min_vlt_pct: 20, windshield_strip_max_inches: 5, medical_exemption_allowed: false }
              as: ComplianceOfficer
            - call: "POST /shop-locations"
              payload: { name: "S", state_code: "NM" }
              as: ShopManager
              captures: { shop: $.data.id }
            - call: "POST /service-packages"
              payload: { name: "Tint", service_type: "TINT", base_rate_cents: 28000, duration_minutes: 120, cure_buffer_minutes: 0, warranty_days: 365, requires_proof: false }
              as: ShopManager
              captures: { pkg: $.data.id }
            - call: "POST /film-materials"
              payload: { sku: "M-EAR", category: "TINT_FILM", cure_hours: 24, price_multiplier_bps: 10000 }
              as: ShopManager
              captures: { mat: $.data.id }
            - call: "POST /vehicle-profiles"
              payload: { customer_user_id: "c-ear", vin: "VIN-EAR", size_class: "SEDAN" }
              as: ShopManager
              captures: { veh: $.data.id }
            - call: "POST /bays"
              payload: { shop_location_id: "${shop}", label: "B1" }
              as: ShopManager
              captures: { bay: $.data.id }
            - call: "POST /installers"
              payload: { shop_location_id: "${shop}", installer_user_id: "i-ear", full_name: "E", certified_service_types: ["TINT"] }
              as: ShopManager
              captures: { inst: $.data.id }
            - call: "POST /quotes"
              payload: { vehicle_profile_id: "${veh}", shop_location_id: "${shop}" }
              as: ShopManager
              captures: { q: $.data.id, qv0: $.data.version }
            - call: "POST /quotes/${q}/lines"
              payload: { service_package_id: "${pkg}", film_material_id: "${mat}", coverage: "FULL", window_position: "REAR_SIDE", requested_vlt_pct: 50, expected_quote_version: "${qv0}" }
              as: ShopManager
              captures: { qv1: $.data.version }
            - call: "POST /quotes/${q}/price"
              payload: { expected_quote_version: "${qv1}" }
              as: ShopManager
              captures: { qv2: $.data.version }
            - call: "POST /quotes/${q}/accept"
              payload: { expected_quote_version: "${qv2}" }
              as: Customer
              as_user_id: "c-ear"
              captures: { qv3: $.data.version }
            - call: "POST /work-orders"
              payload: { quote_id: "${q}", bay_id: "${bay}", installer_id: "${inst}", scheduled_start: "2026-06-02T09:00:00Z", expected_quote_version: "${qv3}" }
              as: ShopManager
              captures: { wo: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo}/start"
              payload: {}
              as: Installer
              as_user_id: "i-ear"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE, HTTP 409 (default clock 2026-04-01T00:00 < scheduled_start)"

      - name: cancel_terminal_workorder_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.WorkOrder.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "Cancelling an already-CANCELLED WorkOrder returns ERR_INVALID_STATE; no further transitions exit a terminal state."
        test_recipe:
          setup: ["A scheduled TINT work order then CANCELLED."]
          setup_api_calls:
            - call: "POST /state-tint-regulations"
              payload: { state_code: "CO", front_side_min_vlt_pct: 27, windshield_strip_max_inches: 4, medical_exemption_allowed: false }
              as: ComplianceOfficer
            - call: "POST /shop-locations"
              payload: { name: "S", state_code: "CO" }
              as: ShopManager
              captures: { shop: $.data.id }
            - call: "POST /service-packages"
              payload: { name: "Tint", service_type: "TINT", base_rate_cents: 28000, duration_minutes: 120, cure_buffer_minutes: 0, warranty_days: 365, requires_proof: false }
              as: ShopManager
              captures: { pkg: $.data.id }
            - call: "POST /film-materials"
              payload: { sku: "M-CAN", category: "TINT_FILM", cure_hours: 24, price_multiplier_bps: 10000 }
              as: ShopManager
              captures: { mat: $.data.id }
            - call: "POST /vehicle-profiles"
              payload: { customer_user_id: "c-can", vin: "VIN-CAN", size_class: "SEDAN" }
              as: ShopManager
              captures: { veh: $.data.id }
            - call: "POST /bays"
              payload: { shop_location_id: "${shop}", label: "B1" }
              as: ShopManager
              captures: { bay: $.data.id }
            - call: "POST /installers"
              payload: { shop_location_id: "${shop}", installer_user_id: "i-can", full_name: "C", certified_service_types: ["TINT"] }
              as: ShopManager
              captures: { inst: $.data.id }
            - call: "POST /quotes"
              payload: { vehicle_profile_id: "${veh}", shop_location_id: "${shop}" }
              as: ShopManager
              captures: { q: $.data.id, qv0: $.data.version }
            - call: "POST /quotes/${q}/lines"
              payload: { service_package_id: "${pkg}", film_material_id: "${mat}", coverage: "FULL", window_position: "REAR_SIDE", requested_vlt_pct: 50, expected_quote_version: "${qv0}" }
              as: ShopManager
              captures: { qv1: $.data.version }
            - call: "POST /quotes/${q}/price"
              payload: { expected_quote_version: "${qv1}" }
              as: ShopManager
              captures: { qv2: $.data.version }
            - call: "POST /quotes/${q}/accept"
              payload: { expected_quote_version: "${qv2}" }
              as: Customer
              as_user_id: "c-can"
              captures: { qv3: $.data.version }
            - call: "POST /work-orders"
              payload: { quote_id: "${q}", bay_id: "${bay}", installer_id: "${inst}", scheduled_start: "2026-06-02T09:00:00Z", expected_quote_version: "${qv3}" }
              as: ShopManager
              captures: { wo: $.data.id, wov0: $.data.version }
            - call: "POST /work-orders/${wo}/cancel"
              payload: { expected_work_order_version: "${wov0}" }
              as: ShopManager
              captures: { wov1: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo}/cancel"
              payload: { expected_work_order_version: "${wov1}" }
              as: ShopManager
              captures: { err: $.data.error_id }
