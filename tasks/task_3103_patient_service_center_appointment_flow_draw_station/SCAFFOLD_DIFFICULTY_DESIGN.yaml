      - name: estimate_dual_variant_on_test_order
        grounds:
          - calculations.patient_service_estimate
          - calculations.weighted_blend_cents
          - entities.ResponsibilityEstimate.fields.net_patient_cents
          - endpoints.POST_/psc/test-orders/{testOrderId}/estimates
        distinguishing_aspect: "patient_service_estimate runs on the TestOrder domain and its two variants diverge for the SAME ELIGIBLE order: ATTENDED_COLLECTED grooms a 5000 gross down to a 4000 net while SELF_PAY_LIST would publish the full 5000 — and weighted_blend_cents, the published comparison reference, sums to exactly 10000 rather than any residue-bearing figure."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z. One center, the reference plan seeded, and one ELIGIBLE order with list_price_cents 5000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T13:00:00Z" }
              as: CenterSupervisor
            - call: "POST /psc/service-centers"
              payload: { name: "Aurora Draw Station", state_code: "TX", timezone_offset_minutes: -300, station_count: 2, open_local_minutes: 480, close_local_minutes: 1020 }
              as: CenterSupervisor
              captures: { c1: $.data.id }
            - call: "POST /_scenarios/seed-reference"
              payload: {}
              as: CenterSupervisor
              captures: { plan_id: $.data.insurance_plan_id }
            - call: "POST /psc/patients"
              payload: { full_name: "Ada Nguyen", birth_date: "1990-04-02T00:00:00Z", mrn: "MRN-3103-E1" }
              as: IntakeCoordinator
              captures: { p1: $.data.id }
            - call: "POST /psc/test-orders"
              payload: { service_center_id: "${c1}", patient_id: "${p1}", ordering_provider_npi: "1700111222", test_panel: "CMP", collection_mode: "STANDARD", list_price_cents: 5000, is_fasting_required: false, fasting_hours_required: 0, patient_last_food_utc: "2026-09-01T12:00:00Z", icd10_codes: [], insurance_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { o1: $.data.id, v0: $.data.version }
            - call: "POST /psc/test-orders/${o1}/insurance-resolve"
              payload: {}
              as: IntakeCoordinator
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /psc/test-orders/${o1}/estimates"
              payload: { variant: "ATTENDED_COLLECTED", supersedes_estimate_id: null, expected_test_order_version: "${v1}" }
              as: IntakeCoordinator
              captures: { e1: $.data.id, net_attended: $.data.net_patient_cents, gross_attended: $.data.gross_cents, disc_attended: $.data.discount_cents }
            - call: "GET /psc/responsibility-estimates/${e1}"
              payload: {}
              as: IntakeCoordinator
          assert:
            - "${gross_attended} == 5000 and ${disc_attended} == 1000 and ${net_attended} == 4000"
            - "ResponsibilityEstimate.${e1}.copay_component_cents == 2500 and coinsurance_component_cents == 2500 and deductible_component_cents == 0"
            - "weighted_blend_cents for this order == 10000, i.e. 2500 + 2500 + 0 + 5000 with no rounding residue"
            - "SELF_PAY_LIST gross for the same order would be 5000, so ${net_attended} != that figure"

  # ===========================================================================
  # Rule 2 — combinatorial formulas in DIFFERENT modes (b) and (c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: estimate_nested_rounding_order_pins_one_cent
        grounds:
          - calculations.patient_service_estimate
          - entities.InsurancePlan.fields.prior_paid_pct
          - validations[priority=6]
        distinguishing_aspect: "Mode (b) nested rounding: patient_service_estimate rounds EACH of the three patient-share components before summing, so with prior_paid_pct 0.125 the coinsurance term 2187.5 and the deductible term 6562.5 each round up and gross is 11251 — whereas sum-then-round produces 11250, a one-cent divergence for identical inputs."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z. A payer plan whose costs split a half cent in two places: copay 2500, coinsurance_pct 0.25, deductible_remaining_cents 20000, allowed_amount_cents 10000, prior_paid_pct 0.125."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T13:00:00Z" }
              as: CenterSupervisor
            - call: "POST /psc/service-centers"
              payload: { name: "Aurora Draw Station", state_code: "TX", timezone_offset_minutes: -300, station_count: 2, open_local_minutes: 480, close_local_minutes: 1020 }
              as: CenterSupervisor
              captures: { c1: $.data.id }
            - call: "POST /psc/insurance-plans"
              payload: { payer_name: "HALF CENT HMO", plan_type: "HMO", copay_cents: 2500, coinsurance_pct: 0.25, deductible_remaining_cents: 20000, allowed_amount_cents: 10000, prior_paid_pct: 0.125 }
              as: IntakeCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /psc/patients"
              payload: { full_name: "Ada Nguyen", birth_date: "1990-04-02T00:00:00Z", mrn: "MRN-3103-E2" }
              as: IntakeCoordinator
              captures: { p1: $.data.id }
            - call: "POST /psc/test-orders"
              payload: { service_center_id: "${c1}", patient_id: "${p1}", ordering_provider_npi: "1700111222", test_panel: "CMP", collection_mode: "STANDARD", list_price_cents: 5000, is_fasting_required: false, fasting_hours_required: 0, patient_last_food_utc: "2026-09-01T12:00:00Z", icd10_codes: [], insurance_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { o1: $.data.id }
            - call: "POST /psc/test-orders/${o1}/insurance-resolve"
              payload: {}
              as: IntakeCoordinator
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /psc/test-orders/${o1}/estimates"
              payload: { variant: "ATTENDED_COLLECTED", supersedes_estimate_id: null, expected_test_order_version: "${v1}" }
              as: IntakeCoordinator
              captures: { e1: $.data.id, gross: $.data.gross_cents, coins: $.data.coinsurance_component_cents, ded: $.data.deductible_component_cents, copay_comp: $.data.copay_component_cents }
          assert:
            - "${copay_comp} == 2500 and ${coins} == 2188 and ${ded} == 6563"
            - "${gross} == 11251"
            - "${gross} != 11250 (the sum-then-round reading)"
            - "ResponsibilityEstimate.${e1}.net_patient_cents == 11251 - 2251 == 9000"

      - name: capacity_gate_evaluates_before_discount_keyed_on_result
        grounds:
          - calculations.specimen_stability_deadline
          - calculations.courier_load_posture
          - entities.CourierRun.fields.committed_specimen_count
          - endpoints.POST_/psc/specimens/{specimenId}/assign-courier
        distinguishing_aspect: "Mode (c) circular-looking dependency: the assign-courier capacity gate reads the POST-decrement committed_specimen_count (a put-back at exactly max_specimens_per_run frees ONE slot, not two), while the read-time courier_load_posture derives its band from the PRE-decrement count — the scaffold pins which value each side reads."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z. One center, six orders on tubes whose stability_minutes is 240, each collected and registered so six specimens sit UNASSIGNED, and one OUTBOUND courier run planned at 2026-09-01T16:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T13:00:00Z" }
              as: CenterSupervisor
            - call: "POST /psc/service-centers"
              payload: { name: "Aurora Draw Station", state_code: "TX", timezone_offset_minutes: -300, station_count: 2, open_local_minutes: 480, close_local_minutes: 1020 }
              as: CenterSupervisor
              captures: { c1: $.data.id }
            - call: "POST /_scenarios/seed-reference"
              payload: {}
              as: CenterSupervisor
              captures: { plan_id: $.data.insurance_plan_id }
            - call: "POST /psc/courier-runs"
              payload: { service_center_id: "${c1}", direction: "OUTBOUND", dispatch_utc: "2026-09-01T16:00:00Z" }
              as: LabLiaison
              captures: { r1: $.data.id, r1_cutoff: $.data.cutoff_utc }
            - call: "POST /psc/patients"
              payload: { full_name: "Cy Ortiz", birth_date: "1985-07-19T00:00:00Z", mrn: "MRN-3103-P1" }
              as: IntakeCoordinator
              captures: { p1: $.data.id }
            - call: "POST /psc/test-orders"
              payload: { service_center_id: "${c1}", patient_id: "${p1}", ordering_provider_npi: "1700111224", test_panel: "CMP", collection_mode: "STANDARD", list_price_cents: 5000, is_fasting_required: false, fasting_hours_required: 0, patient_last_food_utc: "2026-09-01T12:00:00Z", icd10_codes: [], insurance_plan_id: "${plan_id}" }
              as: IntakeCoordinator
              captures: { o1: $.data.id }
            - call: "POST /psc/specimens"
              payload: { test_order_id: "${o1}", tube_code: "EDTA_LAVENDER", volume_ml: 4.0, order_of_draw: 1, special_handling_codes: [] }
              as: Phlebotomist
              captures: { s1: $.data.id }
            - call: "POST /psc/specimens/${s1}/assign-courier"
              payload: { courier_run_id: "${r1}" }
              as: LabLiaison
          trigger:
            - call: "GET /psc/courier-runs/${r1}"
              payload: {}
              as: LabLiaison
              captures: { committed_now: $.data.committed_specimen_count }
            - call: "POST /psc/specimens/${s1}/compromise"
              payload: { compromise_reason: "HEMOLYZED" }
              as: LabLiaison
            - call: "GET /psc/courier-runs/${r1}"
              payload: {}
              as: LabLiaison
              captures: { committed_after: $.data.committed_specimen_count }
          assert:
            - "${committed_now} == 1"
            - "${committed_after} == 0"
            - "the put-back decremented committed_specimen_count by exactly 1, so a re-assign finds exactly one free slot"
            - "Specimen.${s1}.status == COMPROMISED and its courier_run_id still names ${r1}"

  # ===========================================================================
  # Rule 3 — non-linear state machines on DIFFERENT entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: order_rejects_and_reverts_making_status_cyclic
        grounds:
          - state_machines.TestOrder.transitions.COLLECTED_to_SCHEDULED
          - state_machines.TestOrder.transitions.SCHEDULED_to_IN_PROGRESS
          - state_machines.TestOrder.transitions.IN_PROGRESS_to_COLLECTED
          - state_machines.TestOrder.transitions.RECEIVED_to_SCHEDULED
          - state_machines.Specimen.transitions.COMPROMISED_to_REJECTED
          - calculations.patient_fasting_gate
        distinguishing_aspect: "TestOrder.status is CYCLIC rather than a forward-only pipeline: COLLECTED -> SCHEDULED -> IN_PROGRESS -> COLLECTED can be traversed repeatedly, because a Specimen rejection re-opens a completed order and pins fasting_compliant_at_utc on the way."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T13:00:00Z. One center, one ELIGIBLE fasting order on EDTA_LAVENDER with patient_last_food_utc 2026-09-01T04:00:00Z and fasting_hours_required 8, a booked appointment checked in and drawn, and the specimen left ASSIGNED to a courier run."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T13:00:00Z" }
              as: CenterSupervisor
            - call: "POST /psc/service-centers"
