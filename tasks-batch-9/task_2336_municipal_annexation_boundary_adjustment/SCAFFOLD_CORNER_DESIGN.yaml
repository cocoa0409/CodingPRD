              captures: { prov_ms: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Ann Reyes", contact_email: "ann@example.test" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { ow_ms: $.data.id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_ms}", method: "INVOLUNTARY_ORDINANCE", shared_boundary_feet: 20000, total_lot_count: 4, developed_lot_count: 4, dwelling_units: 8 }
              as: MunicipalPlanner
              as_user_id: "${muni_ms}"
              captures: { case_ms: $.data.id }
            - call: "POST /annexation-cases/${case_ms}/parcels"
