  - rule_id: transitive_cascade
    instances:
      - name: design_supersession_cascade_depth_five_package_permit_posture_module_ledger
        grounds:
          - state_machines[DesignPackage.freeze_state]
          - state_machines[PermitRecord.status]
          - state_machines[ModuleUnit.production_status]
          - calculations.permit_posture_derivation
          - entities.Factory.fields.committed_line_minutes
          - endpoints[POST /modular/design-packages/{packageId}/review-decision]
        cascade_depth: 5
        distinguishing_aspect: |
          Trigger: freezing a SUCCESSOR design revision. The chain runs
          successor FROZEN (1) -> predecessor SUPERSEDED (2) -> the permit that pinned the
          predecessor drops APPROVED -> CONDITIONS_ISSUED (3) -> project.permit_posture re-derived
          to DUAL_BLOCKED (4) -> every SLOTTED module of the project reverts to PLANNED and the
          factory's committed-minutes ledger is given back (5). The distinguishing feature is that
          it flows design -> permit -> project -> module -> factory, i.e. across five entities in
          one write, and the last two links are only reachable through the permit link.
        test_recipe:
          setup:
            - "clock at 2026-09-01T08:00:00Z; Factory PMP1 and Project Rainier Flats"
            - "design revision R1 FROZEN, pinned by an APPROVED STATE_MODULAR_PROGRAM / PLAN_REVIEW permit"
