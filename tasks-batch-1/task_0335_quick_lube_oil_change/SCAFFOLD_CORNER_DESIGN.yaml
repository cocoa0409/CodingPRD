              payload: { inspection_item_id: "${item_b}", expected_work_order_version: "${wo_v_pre}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412 with error_id == ERR_STALE_WORK_ORDER_VERSION (the first add bumped the version; ${wo_v_pre} is now stale)"

