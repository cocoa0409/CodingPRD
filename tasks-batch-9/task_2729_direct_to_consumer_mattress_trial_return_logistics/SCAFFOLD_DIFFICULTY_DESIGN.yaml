  - rule_id: resource_temporal_overlap
    instances:
      - name: pickup_slot_point_adjacency_collides_until_the_30_minute_buffer_clears
        grounds:
          - validations[priority=33]
          - entities.PickupRoute.fields.buffer_minutes
          - entities.PickupAppointment.fields.slot_start_at
          - entities.PickupAppointment.fields.slot_end_at
          - errors.ERR_SLOT_OVERLAP
        distinguishing_aspect: |
          Interval semantics A - point adjacency on a continuous timeline, with a non-zero buffer.
          The truck resource is one PickupRoute; a slot starting at exactly the previous slot's
          slot_end_at (11:00 after 09:00-11:00) still collides because the comparison is
          slot_start_at >= a.slot_end_at + buffer_minutes, while 11:30-12:30 - a gap of exactly the
          30-minute buffer - is accepted. Half-open interval logic without the buffer would wrongly
          accept the 11:00 slot.
        test_recipe:
          setup:
            - "One QUEEN MEDIUM MattressModel priced 120000 cents, break_in_nights 21, trial_nights 100."
            - "Two customers in different households, each with a DTC TrialOrder delivered 2026-08-01 and a ReturnCase opened 2026-09-10."
            - "One PUBLISHED PickupRoute in CA on 2026-09-15, window 08:00-18:00, capacity_units 6, buffer_minutes left at its default of 30."
            - "The first ReturnCase already holds a BOOKED slot at 09:00-11:00 (2 units), leaving available_units 4 so capacity never masks the overlap check."
