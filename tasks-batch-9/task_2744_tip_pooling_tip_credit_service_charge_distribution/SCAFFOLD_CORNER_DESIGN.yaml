# ===========================================================================
# §1.9 Scaffold Corner Design — Breadth Coverage Index
# Task 2744: Tip Pooling, Tip Credit & Service Charge Distribution
#
# The nine `section:` values are exactly the nine sections of
# references/claim-extraction-guide.md, and every `claim_type:` is a row of
# that section's table. §1.8 is the depth probe (9 rules x 2 instances);
# this file is the breadth probe over §1.1-§1.7.
#
# Conventions shared with SCAFFOLD_DIFFICULTY_DESIGN.yaml:
#   * The logical clock starts at 2026-08-01T00:00:00Z. Unless an instance is
#     deliberately probing that default, its first setup call moves the clock
#     to 2026-08-10T12:00:00Z so the canonical pay period
#     2026-08-03 .. 2026-08-09 is entirely in the past.
#   * Opaque-operator identities are literal strings ("op_prep_1",
#     "op_comp_1", ...); entity-backed identities are "${emp_*_id}".
#   * Every literal in an `assert:` was produced by executing the matching
#     §1.3 formula in Python over the fixture values pinned in
#     `setup_api_calls:`; no assert holds a symbolic expression.
#   * `excluded_because:` stubs cite a §1.8 instance by rule_id / name and
#     carry no test_recipe.
#
# Coverage claim: every one of the 62 §1.6 error ids is triggered by at least
# one instance across §1.8 + §1.9.
# ===========================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_location_derives_wage_ceilings_and_starts_at_version_one
        claim_type: creation
        grounds:
          - entities.Location
          - entities.Location.fields.applicable_min_wage_cents
          - entities.Location.fields.max_tip_credit_per_hour_cents
          - entities.Location.fields.pending_pool_cents
          - endpoints.POST_/locations
        distinguishing_aspect: >-
          The creation corner for the root configuration entity: a single POST returns 201 with
          both computed wage ceilings already derived (725 and 512 for the Texas fixture), the
          ledger rollup seeded at 0, cc_fee_cap_bps left null under ACTUAL_ONLY, and version 1 —
          none of which the caller supplied.
        test_recipe:
          setup:
            - "Empty database; the logical clock is moved to 2026-08-10T12:00:00Z so created_at is predictable."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
          trigger:
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id }
          assert:
            - "HTTP 201 and response_type == object"
            - "data.name == Dallas Unit, data.state_code == TX, data.state_min_wage_cents == 725, data.cash_wage_cents == 213, data.tip_credit_enabled == true, data.cc_fee_policy == ACTUAL_ONLY, data.service_charge_treatment == WAGES"
            - "data.applicable_min_wage_cents == 725"
            - "data.max_tip_credit_per_hour_cents == 512"
            - "data.pending_pool_cents == 0"
            - "data.cc_fee_cap_bps == null"
            - "data.version == 1 and data.created_at == 2026-08-10T12:00:00.000Z and data.updated_at == 2026-08-10T12:00:00.000Z"
            - "data.id is a bare UUID with no type prefix"

      - name: location_applicable_min_wage_takes_the_federal_floor
        claim_type: computed_fields
        grounds:
          - entities.Location.fields.applicable_min_wage_cents
          - entities.Location.fields.max_tip_credit_per_hour_cents
          - entities.Location.fields.tip_credit_enabled
        distinguishing_aspect: >-
          Three units in one instance separate the two computed wage fields from their inputs:
          a state wage of 700 is overridden by the 725 federal floor, a 1500 state wage wins on
          its own, and a unit that claims no tip credit gets max_tip_credit_per_hour_cents 0 even
          though applicable_min_wage_cents minus cash_wage_cents would be 0 anyway — the flag,
          not the arithmetic, is what zeroes it.
        test_recipe:
          setup:
            - "Empty database; clock moved to 2026-08-10T12:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
          trigger:
            - call: "POST /locations"
              payload: { name: "Below Floor Unit", state_code: "TX", state_min_wage_cents: 700, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_low_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Manhattan Unit", state_code: "NY", state_min_wage_cents: 1500, cash_wage_cents: 1000, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_ny_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Oakland Unit", state_code: "CA", state_min_wage_cents: 1650, cash_wage_cents: 1650, tip_credit_enabled: false, cc_fee_policy: "PROHIBITED", service_charge_treatment: "TIPS" }
              as: PayrollAdmin
              captures: { loc_ca_id: $.data.id }
          assert:
            - "the first unit has applicable_min_wage_cents == 725 (the federal floor, not the 700 it supplied) and max_tip_credit_per_hour_cents == 512"
            - "the second unit has applicable_min_wage_cents == 1500 and max_tip_credit_per_hour_cents == 500"
            - "the third unit has applicable_min_wage_cents == 1650 and max_tip_credit_per_hour_cents == 0"
            - "all three responses are 201 and every one carries pending_pool_cents == 0 and version == 1"

      - name: create_job_role_and_employee_omitted_flags_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.JobRole.fields.is_management
          - entities.JobRole.fields.pool_contribution_pct_bps
          - entities.JobRole.fields.pool_share_points
          - entities.JobRole.fields.side_work_eligible
          - entities.Employee.fields.monthly_tip_baseline_cents
          - entities.Employee.fields.separation_date
          - entities.Employee.fields.trailing_pool_receipts_cents
        distinguishing_aspect: >-
          Every optional input on the two configuration entities is omitted at once, so the
          response has to prove each declared default independently: false / 0 / 0 / false on the
          job role and 0 / null / 0 on the employee. A role created this way is a non-management,
          non-contributing, non-sharing, side-work-ineligible row — the most restrictive shape in
          the domain.
        test_recipe:
          setup:
            - "Clock moved to 2026-08-10T12:00:00Z; one Texas unit exists to parent the employee."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id }
          trigger:
            - call: "POST /job-roles"
              payload: { code: "DISHWASHER", title: "Dishwasher", tip_status: "NON_TIPPED" }
              as: PayrollAdmin
              captures: { role_dish_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Sam Ortiz", external_payroll_ref: "E-DISH-1" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
          assert:
            - "the job role response is 201 with is_management == false, pool_contribution_pct_bps == 0, pool_share_points == 0, side_work_eligible == false"
            - "the employee response is 201 with monthly_tip_baseline_cents == 0, separation_date == null, trailing_pool_receipts_cents == 0"
            - "both rows carry version == 1"

      - name: create_employee_with_injected_system_fields_returns_invalid_request
        claim_type: system_fields
        grounds:
          - entities.Employee.fields.trailing_pool_receipts_cents
          - errors[ERR_INVALID_REQUEST]
          - validations.priority_3
          - endpoints.POST_/employees
        distinguishing_aspect: >-
          System and computed fields are not merely ignored on input — §1.4 priority 3 rejects any
          unknown key outright, so an attempt to seed id, created_at, version or
          trailing_pool_receipts_cents is a 400 rather than a silently-dropped field. The follow-up
          call proves the same body minus the injected keys succeeds and that the server mints all
          four common fields itself, stamping created_at from the logical clock.
        test_recipe:
          setup:
            - "Clock moved to 2026-08-10T12:00:00Z; one Texas unit exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id }
          trigger:
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Ana Reyes", external_payroll_ref: "E1", id: "11111111-2222-3333-4444-555555555555", created_at: "2020-01-01T00:00:00Z", version: 9, trailing_pool_receipts_cents: 5000 }
              as: PayrollAdmin
              captures: { err_id: $.data.error_id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Ana Reyes", external_payroll_ref: "E1" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
          assert:
            - "the first trigger call returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST and response_type == error"
            - "no Employee row is created by the first call: GET /employees?location_id=${loc_id} reports total_count == 1 after the second call"
            - "the second call returns 201 with data.id != 11111111-2222-3333-4444-555555555555, data.created_at == 2026-08-10T12:00:00.000Z, data.version == 1, data.trailing_pool_receipts_cents == 0"

      - name: get_pay_period_returns_stored_rollups_unchanged
        claim_type: retrieval
        grounds:
          - entities.PayPeriod
          - endpoints.GET_/pay-periods/{pay_period_id}
          - entities.PayPeriod.fields.status
          - entities.PayPeriod.fields.compute_variant
        distinguishing_aspect: >-
          The retrieval corner: a freshly created period read back through its own GET must show
          every one of the eight rollups still at 0, compute_variant and both operator ids null,
          status OPEN, and the two dates exactly as supplied — no rollup is populated
          speculatively before a compute.
        test_recipe:
          setup:
            - "Clock moved to 2026-08-10T12:00:00Z; one Texas unit; one OPEN period 2026-08-03..2026-08-09."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-09T00:00:00Z" }
              as: PayrollPreparer
              captures: { period_id: $.data.id }
          trigger:
            - call: "GET /pay-periods/${period_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "HTTP 200 and data.id == ${period_id}"
            - "data.status == OPEN, data.compute_variant == null, data.computed_by_user_id == null, data.approved_by_user_id == null"
            - "data.start_date == 2026-08-03T00:00:00.000Z and data.end_date == 2026-08-09T00:00:00.000Z"
            - "data.total_credited_minutes == 0, data.total_tip_credit_cents == 0, data.total_topup_cents == 0, data.total_correction_cents == 0, data.gross_receipts_cents == 0, data.reported_tips_cents == 0, data.allocation_shortfall_cents == 0"
            - "data.version == 1"

      - name: list_shifts_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/shifts
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: >-
          Pagination is exercised against a three-shift period: limit 2 offset 0 returns two rows
          with total_count 3 and has_more true, limit 2 offset 2 returns the last row with
          has_more false, and limit 0 is outside the declared [1,100] band so it is a 400 rather
          than a silently clamped default.
        test_recipe:
          setup:
            - "Clock moved to 2026-08-10T12:00:00Z; one Texas unit; one SERVER employee with a notice acknowledged 2026-07-01."
            - "Three OPEN shifts of that employee on 2026-08-04, 2026-08-05 and 2026-08-06 inside the OPEN period 2026-08-03..2026-08-09."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /job-roles"
              payload: { code: "SERVER", title: "Server", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1500, pool_share_points: 10, side_work_eligible: true }
              as: PayrollAdmin
              captures: { role_server_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Ana Reyes", external_payroll_ref: "E1", monthly_tip_baseline_cents: 0 }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_id}", job_role_id: "${role_server_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-09T00:00:00Z" }
              as: PayrollPreparer
              captures: { period_id: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z" }
              as: PayrollPreparer
              captures: { shift_a_id: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_id}", business_date: "2026-08-05T00:00:00Z", start_at: "2026-08-05T16:00:00Z", end_at: "2026-08-06T00:00:00Z" }
              as: PayrollPreparer
              captures: { shift_b_id: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_id}", business_date: "2026-08-06T00:00:00Z", start_at: "2026-08-06T16:00:00Z", end_at: "2026-08-07T00:00:00Z" }
              as: PayrollPreparer
              captures: { shift_c_id: $.data.id }
          trigger:
            - call: "GET /shifts?pay_period_id=${period_id}&limit=2&offset=0"
              payload: {}
              as: PayrollAdmin
            - call: "GET /shifts?pay_period_id=${period_id}&limit=2&offset=2"
              payload: {}
              as: PayrollAdmin
            - call: "GET /shifts?pay_period_id=${period_id}&limit=0"
              payload: {}
              as: PayrollAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the first call returns HTTP 200, response_type == array, exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "the second call returns exactly 1 row, total_count == 3, has_more == false, offset == 2"
            - "the three shift ids across the first two pages are exactly {${shift_a_id}, ${shift_b_id}, ${shift_c_id}} with no duplicate"
            - "the third call returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"

      - name: get_shift_with_unknown_id_returns_shift_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_SHIFT_NOT_FOUND]
          - validations.priority_4
          - endpoints.GET_/shifts/{shift_id}
        distinguishing_aspect: >-
          The path-id existence corner for the entity with the largest read surface: a
          well-formed UUID that names no stored Shift is a typed 404 (ERR_SHIFT_NOT_FOUND), not a
          generic ERR_RECORD_NOT_FOUND and not an empty 200 envelope.
        test_recipe:
          setup:
            - "Clock moved to 2026-08-10T12:00:00Z; database holds no Shift rows at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
          trigger:
            - call: "GET /shifts/3f2504e0-4f89-41d3-9a0c-0305e82c3301"
              payload: {}
              as: PayrollPreparer
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404, response_type == error, data.error_id == ERR_SHIFT_NOT_FOUND"
            - "data.message is a non-empty string"

      - name: create_shift_missing_required_pay_period_id_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints.POST_/shifts
          - errors[ERR_INVALID_REQUEST]
          - validations.priority_3
        distinguishing_aspect: >-
          pay_period_id is a required input with no default, so omitting it is a structural 400 at
          priority 3 — ahead of every existence, state and business check, even though the body is
          otherwise a perfectly valid shift for an employee who does hold an active assignment.
        test_recipe:
          setup:
            - "Clock moved to 2026-08-10T12:00:00Z; one Texas unit, one SERVER role, one employee with an active assignment, one OPEN period."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /job-roles"
              payload: { code: "SERVER", title: "Server", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1500, pool_share_points: 10, side_work_eligible: true }
              as: PayrollAdmin
              captures: { role_server_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Ana Reyes", external_payroll_ref: "E1", monthly_tip_baseline_cents: 0 }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_id}", job_role_id: "${role_server_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-09T00:00:00Z" }
              as: PayrollPreparer
              captures: { period_id: $.data.id }
          trigger:
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${role_server_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z" }
              as: PayrollPreparer
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /shifts?pay_period_id=${period_id} reports total_count == 0, so the rejected call created nothing"
            - "GET /pay-periods/${period_id} still reports total_credited_minutes == 0 and version == 1"

      - name: create_location_with_out_of_domain_state_code_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Location.fields.state_code
          - entities.Location.fields.cc_fee_policy
          - errors[ERR_INVALID_REQUEST]
          - validations.priority_3
        distinguishing_aspect: >-
          Two separate type constraints in one instance: an enum outside its declared domain
          ({CA, NY, TX, MA}) and a negative money value on a *_cents field. Both are priority-3
          rejections, and both must fail before the priority-28 cash-wage rule gets a chance to
          fire on the same body.
        test_recipe:
          setup:
            - "Clock moved to 2026-08-10T12:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
          trigger:
            - call: "POST /locations"
              payload: { name: "Nowhere Unit", state_code: "ZZ", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { err_enum: $.data.error_id }
            - call: "POST /locations"
              payload: { name: "Negative Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: -50, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { err_neg: $.data.error_id }
          assert:
            - "the first call returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "the second call returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST and NOT ERR_CASH_WAGE_BELOW_FLOOR, because priority 3 precedes priority 28"
            - "GET /locations reports total_count == 0"

      - name: create_employee_under_unknown_location_returns_location_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Employee.parent
          - entities.Employee.fields.location_id
          - errors[ERR_LOCATION_NOT_FOUND]
          - validations.priority_5
        distinguishing_aspect: >-
          The body-FK existence corner: Employee is parented on Location, so a syntactically valid
          location_id that names nothing is a typed 404 at priority 5 — after the structural
          priority-3 pass but before every business rule.
        test_recipe:
          setup:
            - "Clock moved to 2026-08-10T12:00:00Z; no Location rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
          trigger:
            - call: "POST /employees"
              payload: { location_id: "3f2504e0-4f89-41d3-9a0c-0305e82c3302", full_name: "Ghost Worker", external_payroll_ref: "E-GHOST" }
              as: PayrollAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 with data.error_id == ERR_LOCATION_NOT_FOUND"
            - "GET /employees reports total_count == 0"

      - name: create_shift_for_an_employee_of_another_unit_returns_location_mismatch
        claim_type: parent_relationships
        grounds:
          - errors[ERR_EMPLOYEE_LOCATION_MISMATCH]
          - validations.priority_32
