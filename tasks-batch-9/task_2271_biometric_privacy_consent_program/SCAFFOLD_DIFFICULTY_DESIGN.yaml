  - rule_id: resource_temporal_overlap
    instances:
      - name: notice_windows_are_half_open_so_abutting_packets_are_allowed
        grounds:
          - validations[priority=11].ERR_NOTICE_WINDOW_OVERLAP
          - entities.NoticePacket.fields.effective_from
          - entities.NoticePacket.fields.effective_to
          - state_machines.NoticePacket.DRAFT_to_PUBLISHED
        distinguishing_aspect: |
          Resource: the publication slot for a (jurisdiction_id, audience) pair. Interval semantics:
          HALF-OPEN [effective_from, effective_to) with null meaning +infinity, so a packet starting
          exactly when the incumbent ends does NOT collide. This is the permissive end of the
          spectrum and is deliberately the opposite of the accommodation instance below.
        test_recipe:
          setup:
            - "One ComplianceProgram with Jurisdiction IL and a PUBLISHED policy v1.0 scoped to IL."
            - "PUBLISHED NoticePacket NP1 for (IL, EMPLOYEE) with effective_from 2026-08-01T00:00:00Z and effective_to 2026-09-01T00:00:00Z."
            - "Two further DRAFT packets for the same (IL, EMPLOYEE) slot: NP2 spanning 2026-08-15 to 2026-09-15 (straddles NP1) and NP3 starting exactly at 2026-09-01 with an open end."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
