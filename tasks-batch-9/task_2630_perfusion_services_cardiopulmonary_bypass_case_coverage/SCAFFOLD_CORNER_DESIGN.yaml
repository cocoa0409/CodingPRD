  - section: cross_cutting_complexity_layers
    instances:
      - name: both_occ_rules_reject_a_stale_parent_version_and_accept_the_current_one
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[case-staffing-supersede]
          - concurrency_rules[contract-rate-update-stale]
          - validations[priority=24]
          - validations[priority=25]
          - errors.ERR_STALE_CASE_VERSION
          - errors.ERR_STALE_CONTRACT_VERSION
        distinguishing_aspect: |
          Each declared concurrency rule is probed on its own write endpoint with the version the client
          last observed, which the first successful write has already advanced: the reassignment quoting
          the creation-time case version answers 412 ERR_STALE_CASE_VERSION and the rate update quoting one
          less than the current contract version answers 412 ERR_STALE_CONTRACT_VERSION, while re-reading
          and re-quoting makes both succeed.
        test_recipe:
          setup:
            - "LEAN BASE chain through case creation, capturing case1's creation version, then one successful assignment of p1 which advances both BypassCase.version and HospitalContract.version."
