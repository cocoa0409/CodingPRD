    error_id: ERR_ESCROW_BELOW_MINIMUM
    http_status: 409
    applies_to: "POST /de-novo/capital-raises/{raise_id}/lock-escrow"

  - priority: 78
    category: business_fiscal
    check: "Every StressScenario of the plan has governing_min_leverage_ratio_bps >= DE_NOVO_FLOOR_LEVERAGE_BPS (800). Exactly 800 passes; 799 fails."
    error_id: ERR_STRESS_CAPITAL_SHORTFALL
    http_status: 409
    applies_to: "POST /de-novo/business-plans/{plan_id}/submit"

  - priority: 79
    category: business_fiscal
    check: "capital_adequacy_verdict evaluates to ADEQUATE, i.e. plan.worst_governing_min_leverage_ratio_bps >= the charter-type- and risk-adjusted required_leverage_bps"
    error_id: ERR_CAPITAL_INADEQUATE
    http_status: 409
    applies_to: "POST /de-novo/business-plans/{plan_id}/submit"

  - priority: 80
    category: business_fiscal
    check: "raise.projected_net_release_cents >= the opening_tier1_capital_cents of the BusinessPlan pinned by the group's CHARTERING_AUTHORITY filing"
    error_id: ERR_NET_RELEASE_BELOW_PLAN_CAPITAL
    http_status: 409
    applies_to: "POST /de-novo/capital-raises/{raise_id}/release-escrow"
    note: >
      Deliberately BELOW ERR_ESCROW_NOT_LOCKED at priority 16. A release attempt on a raise that is
      still OPEN and whose net release would also be short must report ERR_ESCROW_NOT_LOCKED - the
      state error, not the money error. This is the second declared priority pair.

  - priority: 81
    category: business_fiscal
    check: "A refund or a screening rejection is refused once raise.status == RELEASED - released escrow cannot be clawed back through this surface"
    error_id: ERR_ESCROW_ALREADY_RELEASED
    http_status: 409
    applies_to: "POST /de-novo/subscriptions/{subscription_id}/funding with funding_event=REFUND, POST /de-novo/subscriptions/{subscription_id}/screening-result with outcome=REJECTED"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
# All 13 entities expose BOTH a single-resource GET (`/de-novo/<collection>/{x_id}`) and a
# filtered list GET (`/de-novo/<collection>` with every inbound FK field as an optional filter),
# which is how every FK in §1.1 gets its reverse-reachability channel. Creation stays nested
# where the child is meaningless without its parent (organizers, stress scenarios, approval
# conditions, readiness exams) and flat where the child carries several FKs.
# Every list endpoint's filters are optional, so a bare GET with no query string is always legal.
endpoints:
  # ---------------------------------------------------------------- reads: single resource
  - method: GET
    path: "/de-novo/organizing-groups/{group_id}"
    description: "Read one organizing group with its derived composition and supervision fields."
    roles: [CharterCounsel, LeadOrganizer, IndependentDirector, CharteringExaminer, InsuranceExaminer, EscrowAgent, PlatformAdmin]
    code: 200
    input: []
    output: OrganizingGroup
    side_effects: ["recomputes heightened_supervision_window against the current logical clock before responding"]

  - method: GET
    path: "/de-novo/organizers/{organizer_id}"
    description: "Read one organizer with both background dimensions and the derived qualification fields."
    roles: [CharterCounsel, LeadOrganizer, IndependentDirector, CharteringExaminer, InsuranceExaminer, EscrowAgent, PlatformAdmin]
    code: 200
    input: []
    output: Organizer
    side_effects: []

  - method: GET
    path: "/de-novo/business-plans/{plan_id}"
    description: "Read one business plan with its three-year projections and stress aggregates."
    roles: [CharterCounsel, LeadOrganizer, IndependentDirector, CharteringExaminer, InsuranceExaminer, EscrowAgent, PlatformAdmin]
    code: 200
    input: []
    output: BusinessPlan
    side_effects: []

  - method: GET
    path: "/de-novo/stress-scenarios/{scenario_id}"
    description: "Read one stress scenario with BOTH variant result pairs and the governing selection."
    roles: [CharterCounsel, LeadOrganizer, IndependentDirector, CharteringExaminer, InsuranceExaminer, EscrowAgent, PlatformAdmin]
    code: 200
    input: []
    output: StressScenario
    side_effects: []

  - method: GET
    path: "/de-novo/capital-raises/{raise_id}"
    description: "Read one capital raise with both escrow bases and the projected waterfall split."
    roles: [CharterCounsel, LeadOrganizer, IndependentDirector, CharteringExaminer, InsuranceExaminer, EscrowAgent, PlatformAdmin]
    code: 200
    input: []
    output: CapitalRaise
    side_effects: []

  - method: GET
    path: "/de-novo/subscriptions/{subscription_id}"
    description: "Read one subscription with its funding and clearance dimensions."
    roles: [CharterCounsel, LeadOrganizer, IndependentDirector, CharteringExaminer, InsuranceExaminer, EscrowAgent, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: GET
    path: "/de-novo/regulatory-filings/{filing_id}"
    description: "Read one regulatory filing with its info-request round counter and condition aggregates."
    roles: [CharterCounsel, LeadOrganizer, IndependentDirector, CharteringExaminer, InsuranceExaminer, EscrowAgent, PlatformAdmin]
    code: 200
    input: []
    output: RegulatoryFiling
    side_effects: []

  - method: GET
    path: "/de-novo/approval-conditions/{condition_id}"
    description: "Read one approval condition with its adjudication counter."
    roles: [CharterCounsel, LeadOrganizer, IndependentDirector, CharteringExaminer, InsuranceExaminer, EscrowAgent, PlatformAdmin]
    code: 200
    input: []
    output: ApprovalCondition
    side_effects: []

  - method: GET
    path: "/de-novo/policy-documents/{policy_id}"
    description: "Read one policy document with drafter, adopter and examiner finding."
    roles: [CharterCounsel, LeadOrganizer, IndependentDirector, CharteringExaminer, InsuranceExaminer, EscrowAgent, PlatformAdmin]
    code: 200
    input: []
    output: PolicyDocument
    side_effects: []

  - method: GET
    path: "/de-novo/vendor-contracts/{contract_id}"
    description: "Read one vendor contract with its live conversion-window count."
    roles: [CharterCounsel, LeadOrganizer, IndependentDirector, CharteringExaminer, InsuranceExaminer, EscrowAgent, PlatformAdmin]
    code: 200
    input: []
    output: VendorContract
    side_effects: []

  - method: GET
    path: "/de-novo/conversion-windows/{window_id}"
    description: "Read one core-conversion window with its computed duration."
    roles: [CharterCounsel, LeadOrganizer, IndependentDirector, CharteringExaminer, InsuranceExaminer, EscrowAgent, PlatformAdmin]
    code: 200
    input: []
    output: ConversionWindow
    side_effects: []

  - method: GET
    path: "/de-novo/readiness-exams/{exam_id}"
    description: "Read one pre-opening readiness exam with its computed buffer end."
    roles: [CharterCounsel, LeadOrganizer, IndependentDirector, CharteringExaminer, InsuranceExaminer, EscrowAgent, PlatformAdmin]
    code: 200
    input: []
    output: ReadinessExam
    side_effects: []

  - method: GET
    path: "/de-novo/deviation-requests/{deviation_id}"
    description: "Read one business-plan deviation request with its computed magnitude."
    roles: [CharterCounsel, LeadOrganizer, IndependentDirector, CharteringExaminer, InsuranceExaminer, EscrowAgent, PlatformAdmin]
    code: 200
    input: []
    output: DeviationRequest
    side_effects: []

  # ---------------------------------------------------------------- reads: filtered lists
  - method: GET
    path: "/de-novo/organizers"
    description: "List organizers, optionally narrowed to one group. Reverse-reachability for Organizer.group_id."
    roles: [CharterCounsel, LeadOrganizer, IndependentDirector, CharteringExaminer, InsuranceExaminer, EscrowAgent, PlatformAdmin]
    code: 200
    input: ["group_id?", "role_on_board?", "qualification_status?", "is_independent?", "limit?", "offset?"]
    output: Organizer[]
    side_effects: []

  - method: GET
    path: "/de-novo/business-plans"
    description: "List business plans. Reverse-reachability for BusinessPlan.group_id and the self-referential BusinessPlan.supersedes_plan_id."
    roles: [CharterCounsel, LeadOrganizer, IndependentDirector, CharteringExaminer, InsuranceExaminer, EscrowAgent, PlatformAdmin]
    code: 200
    input: ["group_id?", "supersedes_plan_id?", "status?", "limit?", "offset?"]
    output: BusinessPlan[]
    side_effects: []

  - method: GET
    path: "/de-novo/stress-scenarios"
    description: "List stress scenarios. Reverse-reachability for StressScenario.business_plan_id."
    roles: [CharterCounsel, LeadOrganizer, IndependentDirector, CharteringExaminer, InsuranceExaminer, EscrowAgent, PlatformAdmin]
    code: 200
    input: ["business_plan_id?", "scenario_code?", "governing_variant?", "limit?", "offset?"]
    output: StressScenario[]
    side_effects: []

  - method: GET
    path: "/de-novo/capital-raises"
    description: "List capital raises. Reverse-reachability for CapitalRaise.group_id."
    roles: [CharterCounsel, LeadOrganizer, IndependentDirector, CharteringExaminer, InsuranceExaminer, EscrowAgent, PlatformAdmin]
    code: 200
    input: ["group_id?", "status?", "limit?", "offset?"]
    output: CapitalRaise[]
    side_effects: []

  - method: GET
    path: "/de-novo/subscriptions"
    description: "List subscriptions. Reverse-reachability for Subscription.capital_raise_id and Subscription.organizer_id."
    roles: [CharterCounsel, LeadOrganizer, IndependentDirector, CharteringExaminer, InsuranceExaminer, EscrowAgent, PlatformAdmin]
    code: 200
    input: ["capital_raise_id?", "organizer_id?", "funding_state?", "clearance_state?", "counts_toward_escrow?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []

  - method: GET
    path: "/de-novo/regulatory-filings"
    description: "List regulatory filings. Reverse-reachability for RegulatoryFiling.group_id and RegulatoryFiling.pinned_business_plan_id."
    roles: [CharterCounsel, LeadOrganizer, IndependentDirector, CharteringExaminer, InsuranceExaminer, EscrowAgent, PlatformAdmin]
    code: 200
    input: ["group_id?", "pinned_business_plan_id?", "authority?", "status?", "limit?", "offset?"]
    output: RegulatoryFiling[]
    side_effects: []

  - method: GET
    path: "/de-novo/approval-conditions"
    description: "List approval conditions. Reverse-reachability for ApprovalCondition.filing_id."
    roles: [CharterCounsel, LeadOrganizer, IndependentDirector, CharteringExaminer, InsuranceExaminer, EscrowAgent, PlatformAdmin]
    code: 200
    input: ["filing_id?", "category?", "status?", "is_pre_opening_blocking?", "limit?", "offset?"]
    output: ApprovalCondition[]
    side_effects: []

  - method: GET
    path: "/de-novo/policy-documents"
    description: "List policy documents. Reverse-reachability for PolicyDocument.group_id, .drafted_by_organizer_id and .adopted_by_organizer_id."
    roles: [CharterCounsel, LeadOrganizer, IndependentDirector, CharteringExaminer, InsuranceExaminer, EscrowAgent, PlatformAdmin]
    code: 200
    input: ["group_id?", "drafted_by_organizer_id?", "adopted_by_organizer_id?", "domain?", "status?", "limit?", "offset?"]
    output: PolicyDocument[]
    side_effects: []

  - method: GET
    path: "/de-novo/vendor-contracts"
    description: "List vendor contracts. Reverse-reachability for VendorContract.group_id."
    roles: [CharterCounsel, LeadOrganizer, IndependentDirector, CharteringExaminer, InsuranceExaminer, EscrowAgent, PlatformAdmin]
    code: 200
    input: ["group_id?", "service_domain?", "criticality?", "status?", "limit?", "offset?"]
    output: VendorContract[]
    side_effects: []

  - method: GET
    path: "/de-novo/conversion-windows"
    description: "List conversion windows. Reverse-reachability for ConversionWindow.vendor_contract_id."
    roles: [CharterCounsel, LeadOrganizer, IndependentDirector, CharteringExaminer, InsuranceExaminer, EscrowAgent, PlatformAdmin]
    code: 200
    input: ["vendor_contract_id?", "status?", "limit?", "offset?"]
    output: ConversionWindow[]
    side_effects: []

  - method: GET
    path: "/de-novo/readiness-exams"
    description: "List readiness exams. Reverse-reachability for ReadinessExam.group_id."
    roles: [CharterCounsel, LeadOrganizer, IndependentDirector, CharteringExaminer, InsuranceExaminer, EscrowAgent, PlatformAdmin]
    code: 200
    input: ["group_id?", "exam_scope?", "status?", "limit?", "offset?"]
    output: ReadinessExam[]
    side_effects: []

  - method: GET
    path: "/de-novo/deviation-requests"
    description: "List deviation requests. Reverse-reachability for DeviationRequest.group_id and DeviationRequest.baseline_plan_id."
    roles: [CharterCounsel, LeadOrganizer, IndependentDirector, CharteringExaminer, InsuranceExaminer, EscrowAgent, PlatformAdmin]
    code: 200
    input: ["group_id?", "baseline_plan_id?", "metric?", "status?", "requires_regulator_approval?", "limit?", "offset?"]
    output: DeviationRequest[]
    side_effects: []

  # ---------------------------------------------------------------- computed read
  - method: GET
    path: "/de-novo/organizing-groups/{group_id}/capital-adequacy"
    description: >
      Computed read: runs capital_adequacy_verdict against the group's governing business plan (the
      one pinned by its CHARTERING_AUTHORITY filing, or the group's newest SUBMITTED plan when no
      filing has pinned one yet) and returns the full derivation so tests can see each term.
    roles: [CharterCounsel, LeadOrganizer, IndependentDirector, CharteringExaminer, InsuranceExaminer, EscrowAgent, PlatformAdmin]
    code: 200
    input: ["business_plan_id?"]
    output: { business_plan_id: string, charter_type: string, base_required_bps: integer, concentration_bps: integer, concentration_add_on_bps: integer, breach_scenario_count: integer, risk_add_on_bps: integer, required_leverage_bps: integer, worst_governing_min_leverage_ratio_bps: integer, verdict: string }
    side_effects: []

  # ---------------------------------------------------------------- creates
  - method: POST
    path: "/de-novo/organizing-groups"
    description: "Open a new bank organizing file. Starts at stage ORGANIZING with composition_status FORMING."
    roles: [CharterCounsel]
    code: 201
    input: [proposed_bank_name, home_state_code, charter_type, target_opening_date]
    output: OrganizingGroup
    side_effects:
      - "stage = ORGANIZING, composition_status = FORMING, all derived counts = 0, management_composite_score = 0.00, opening_blocked_reason = NONE, supervision_started_at = null, supervision_year_index = 0"
      - "version = 1"

  - method: POST
    path: "/de-novo/organizing-groups/{group_id}/organizers"
    description: "Add an organizer/proposed officer to the group. Both background dimensions start PENDING."
    roles: [CharterCounsel]
    code: 201
    input: [full_name, role_on_board, is_independent, affiliation_code, banking_years, regulatory_experience_score]
    output: Organizer
    side_effects:
      - "fingerprint_state = PENDING, credit_state = PENDING, adverse_finding_type = NONE, waiver_granted = false"
      - "runs organizer_qualification_subscore then organizer_qualification_status on the new row"
      - "runs management_composite_score and group_composition_assessment on the parent group"
      - "increments OrganizingGroup.version by 1"

  - method: POST
    path: "/de-novo/business-plans"
    description: "Create a three-year business plan for the group. Optimistically concurrent on the group's version."
    roles: [CharterCounsel]
    code: 201
    input: [group_id, expected_group_version, opening_tier1_capital_cents, projected_assets_y1_cents, projected_assets_y2_cents, projected_assets_y3_cents, projected_loans_y1_cents, projected_loans_y2_cents, projected_loans_y3_cents, projected_deposits_y1_cents, projected_deposits_y2_cents, projected_deposits_y3_cents, projected_net_income_y1_cents, projected_net_income_y2_cents, projected_net_income_y3_cents, projected_branch_count, "supersedes_plan_id?"]
    output: BusinessPlan
    side_effects:
      - "status = DRAFT; stress_scenario_count = 0; breach_scenario_count = 0; worst_governing_min_leverage_ratio_bps = 0"
      - "plan_revision_index = 1 when supersedes_plan_id is omitted, else the superseded plan's plan_revision_index + 1"
      - "when supersedes_plan_id is supplied, that BusinessPlan transitions DRAFT -> SUPERSEDED and its version increments by 1"
      - "increments OrganizingGroup.version by 1"

  - method: POST
    path: "/de-novo/business-plans/{plan_id}/stress-scenarios"
    description: "Attach a stress scenario to a DRAFT plan. Computes BOTH the static and the dynamic leverage path."
    roles: [CharterCounsel]
    code: 201
    input: [scenario_code, credit_loss_rate_bps, nim_compression_bps, expense_overrun_cents]
    output: StressScenario
    side_effects:
      - "runs stress_leverage_path twice, storing static_min_leverage_ratio_bps / static_breach_year_index and dynamic_min_leverage_ratio_bps / dynamic_breach_year_index"
      - "sets governing_variant from scenario_code and copies the matching pair into governing_min_leverage_ratio_bps / governing_breach_year_index"
      - "recomputes the parent plan's stress_scenario_count, breach_scenario_count and worst_governing_min_leverage_ratio_bps"
      - "increments BusinessPlan.version by 1"

  - method: POST
    path: "/de-novo/capital-raises"
    description: "Structure the capital raise for the group. Starts at STRUCTURING with an empty escrow."
    roles: [CharterCounsel]
    code: 201
    input: [group_id, target_gross_cents, minimum_gross_cents, offering_price_cents_per_share, max_shares, organizational_expense_claim_cents]
    output: CapitalRaise
    side_effects:
      - "status = STRUCTURING; every escrow aggregate = 0; released_net_cents = 0"
      - "runs escrow_release_allocation against an empty escrow, so projected_reimbursement_cents = 0 and projected_net_release_cents = 0"
      - "increments OrganizingGroup.version by 1"

  - method: POST
    path: "/de-novo/subscriptions"
    description: "Record a share subscription against an OPEN raise. amount_cents is derived from the raise's offering price."
    roles: [EscrowAgent]
    code: 201
    input: [capital_raise_id, subscriber_name, shares, "organizer_id?"]
    output: Subscription
    side_effects:
      - "runs subscription_amount to derive amount_cents; any client-supplied amount is ignored"
      - "funding_state = PLEDGED, clearance_state = UNSCREENED, counts_toward_escrow = false"
      - "runs escrow_position on the parent raise (subscribed_shares and pledged_gross_cents move; cleared_escrow_cents does not)"
      - "runs escrow_release_allocation on the parent raise"
      - "increments CapitalRaise.version by 1"

  - method: POST
    path: "/de-novo/regulatory-filings"
    description: "Prepare a charter application or a deposit-insurance application, pinning the business plan it is judged against."
    roles: [CharterCounsel]
    code: 201
    input: [group_id, authority, pinned_business_plan_id]
    output: RegulatoryFiling
    side_effects:
      - "status = DRAFT, info_request_round = 0, filed_at = null, decision_at = null"
      - "runs filing_condition_posture against an empty condition set, so all three counts are 0 and pre_opening_clearance = false"
      - "increments OrganizingGroup.version by 1"

  - method: POST
    path: "/de-novo/regulatory-filings/{filing_id}/conditions"
    description: "Attach a condition of approval to a CONDITIONALLY_APPROVED filing."
    roles: [CharteringExaminer, InsuranceExaminer]
    code: 201
    input: [condition_code, category, is_pre_opening_blocking, deadline_utc]
    output: ApprovalCondition
    side_effects:
      - "status = OPEN, evidence_reference = null, adjudication_count = 0"
      - "recomputes the parent filing's condition_total_count, open_blocking_condition_count, settled_condition_count and pre_opening_clearance"
      - "increments RegulatoryFiling.version by 1"

  - method: POST
    path: "/de-novo/policy-documents"
    description: "Draft a board policy for one of the four required domains."
    roles: [LeadOrganizer, IndependentDirector]
    code: 201
    input: [group_id, domain, drafted_by_organizer_id, document_title]
    output: PolicyDocument
    side_effects:
      - "status = DRAFT, adopted_by_organizer_id = null, adopted_at = null, finding_note = null"
      - "increments OrganizingGroup.version by 1"

  - method: POST
    path: "/de-novo/vendor-contracts"
    description: "Register a candidate vendor for one service domain (core system, item processing, etc.)."
    roles: [CharterCounsel]
    code: 201
    input: [group_id, service_domain, vendor_name, annual_cost_cents, contract_term_months, due_diligence_score, criticality]
    output: VendorContract
    side_effects:
      - "status = EVALUATING, active_window_count = 0"
      - "increments OrganizingGroup.version by 1"

  - method: POST
    path: "/de-novo/conversion-windows"
    description: "Reserve a core-conversion window on a SELECTED or SIGNED vendor contract. Optimistically concurrent on the contract's version."
    roles: [CharterCounsel]
    code: 201
    input: [vendor_contract_id, expected_vendor_contract_version, window_start_utc, window_end_utc]
    output: ConversionWindow
    side_effects:
      - "status = RESERVED; runs conversion_capacity_occupation to derive duration_hours and to enforce the capacity ceiling"
      - "recomputes the parent contract's active_window_count"
      - "increments VendorContract.version by 1"

  - method: POST
    path: "/de-novo/organizing-groups/{group_id}/readiness-exams"
    description: "Schedule a pre-opening operational readiness examination. The window is buffer-extended before the conflict test."
    roles: [CharteringExaminer]
    code: 201
    input: [window_start_utc, window_end_utc, exam_scope]
    output: ReadinessExam
    side_effects:
      - "status = SCHEDULED, finding_count = 0; runs exam_buffer_occupation to derive buffer_end_utc and to enforce the no-overlap rule"
      - "increments OrganizingGroup.version by 1"

  - method: POST
    path: "/de-novo/deviation-requests"
    description: >
      Submit a business-plan deviation notice during the three-year heightened supervision window.
      Sub-threshold deviations self-clear to AUTO_ACCEPTED in this very response.
    roles: [LeadOrganizer]
    code: 201
    input: [group_id, baseline_plan_id, metric, actual_value, narrative]
    output: DeviationRequest
    side_effects:
      - "runs heightened_supervision_window, then deviation_magnitude to derive supervision_year_index_at_request, baseline_value, deviation_bps and requires_regulator_approval"
      - "status = AUTO_ACCEPTED when requires_regulator_approval is false, otherwise SUBMITTED"
      - "increments OrganizingGroup.version by 1"

  # ---------------------------------------------------------------- actions
  - method: POST
    path: "/de-novo/organizers/{organizer_id}/background-result"
    description: "Record the outcome of one background dimension (fingerprint or credit) for an organizer."
    roles: [CharteringExaminer]
    code: 200
    input: [dimension, outcome, "adverse_finding_type?"]
    output: Organizer
    side_effects:
      - "sets fingerprint_state (dimension=FINGERPRINT) or credit_state (dimension=CREDIT) to the supplied outcome"
      - "sets adverse_finding_type when the outcome is FLAGGED or ADVERSE"
      - "re-runs organizer_qualification_subscore and organizer_qualification_status"
      - "re-runs management_composite_score and group_composition_assessment on the parent group"
      - "increments Organizer.version by 1 and OrganizingGroup.version by 1"

  - method: POST
    path: "/de-novo/organizers/{organizer_id}/qualification-waiver"
    description: "Grant a management-qualification waiver to a DISQUALIFIED organizer, subject to the non-waivable-finding bar."
    roles: [CharteringExaminer]
    code: 200
    input: [waiver_rationale]
    output: Organizer
    side_effects:
      - "waiver_granted = true, waiver_rationale stored, qualification_status = WAIVER_GRANTED"
      - "re-runs management_composite_score and group_composition_assessment on the parent group"
      - "increments Organizer.version by 1 and OrganizingGroup.version by 1"

  - method: POST
    path: "/de-novo/business-plans/{plan_id}/submit"
    description: "Submit a DRAFT plan for regulatory review. This is where the stress floor and the capital-adequacy verdict are enforced."
    roles: [LeadOrganizer]
    code: 200
    input: []
    output: BusinessPlan
    side_effects:
      - "evaluates capital_adequacy_verdict as a gate; a DEFICIENT verdict rejects the request and changes nothing"
      - "status DRAFT -> SUBMITTED"
      - "increments BusinessPlan.version by 1"

  - method: POST
    path: "/de-novo/organizing-groups/{group_id}/advance"
    description: "Move the organizing group to the requested stage. Every stage gate in §1.4 is evaluated here."
    roles: [CharterCounsel]
    code: 200
    input: [target_stage]
    output: OrganizingGroup
    side_effects:
      - "stage = target_stage when every gate for that target passes"
      - "target_stage=FILING_READY, CONDITIONALLY_APPROVED or PRE_OPENING also resets opening_blocked_reason to NONE"
      - "target_stage=OPEN also sets supervision_started_at = the current logical clock and runs heightened_supervision_window (supervision_year_index becomes 1)"
      - "leaving PRE_OPENING for any target cancels every SCHEDULED ReadinessExam of the group and bumps each exam's version by 1"
      - "target_stage=ABANDONED also transitions the group's OPEN CapitalRaise to REFUNDED and bumps its version by 1"
      - "increments OrganizingGroup.version by 1"

  - method: POST
    path: "/de-novo/regulatory-filings/{filing_id}/file"
    description: "File (or re-file after an information request) a charter or deposit-insurance application."
    roles: [CharterCounsel]
    code: 200
    input: []
    output: RegulatoryFiling
    side_effects:
      - "status DRAFT|ADDITIONAL_INFO_REQUESTED -> FILED and filed_at = the current logical clock"
      - "when this is the first filing of the group to reach FILED, group.stage FILING_READY -> UNDER_REVIEW and OrganizingGroup.version increments by 1"
      - "increments RegulatoryFiling.version by 1"

  - method: POST
    path: "/de-novo/regulatory-filings/{filing_id}/decision"
    description: >
      Record the chartering authority's or the insurer's decision. ADDITIONAL_INFO_REQUESTED cycles
      the filing back for re-filing until MAX_INFO_ROUNDS is exhausted, at which point the same
      request lands on DENIED instead.
    roles: [CharteringExaminer, InsuranceExaminer]
    code: 200
    input: [decision, "decision_note?"]
    output: RegulatoryFiling
    side_effects:
      - "decision=ADDITIONAL_INFO_REQUESTED with info_request_round < MAX_INFO_ROUNDS (3): status -> ADDITIONAL_INFO_REQUESTED and info_request_round += 1"
      - "decision=ADDITIONAL_INFO_REQUESTED with info_request_round == MAX_INFO_ROUNDS: status -> DENIED and decision_at set"
      - "decision=CONDITIONALLY_APPROVED: status -> CONDITIONALLY_APPROVED, decision_at set; when the filing's authority is CHARTERING_AUTHORITY its pinned BusinessPlan transitions SUBMITTED -> PINNED and that plan's version increments by 1; when both filings of the group are now CONDITIONALLY_APPROVED, group.stage UNDER_REVIEW -> CONDITIONALLY_APPROVED"
      - "decision=DENIED: status -> DENIED, decision_at set, group.stage UNDER_REVIEW -> ORGANIZING, and a PINNED plan of a CHARTERING_AUTHORITY filing reverts PINNED -> SUBMITTED with a version bump"
      - "decision=FINAL_APPROVED: status -> FINAL_APPROVED"
      - "recomputes filing_condition_posture"
      - "increments RegulatoryFiling.version by 1, and OrganizingGroup.version by 1 whenever the group's stage moved"

  - method: POST
    path: "/de-novo/capital-raises/{raise_id}/open"
    description: "Open the offering for subscriptions."
    roles: [CharterCounsel]
    code: 200
    input: []
    output: CapitalRaise
    side_effects:
      - "status STRUCTURING -> OPEN"
      - "increments CapitalRaise.version by 1"

  - method: POST
    path: "/de-novo/capital-raises/{raise_id}/lock-escrow"
    description: "Lock subscription proceeds in escrow pending charter approval. Tests the CLEARED basis against the minimum."
    roles: [EscrowAgent]
    code: 200
    input: []
    output: CapitalRaise
    side_effects:
      - "status OPEN -> ESCROW_LOCKED"
      - "re-runs escrow_position and escrow_release_allocation so projected_reimbursement_cents and projected_net_release_cents are current"
      - "increments CapitalRaise.version by 1"

  - method: POST
    path: "/de-novo/capital-raises/{raise_id}/release-escrow"
    description: "Release escrow at charter approval, paying the capped organizational-expense reimbursement first."
    roles: [EscrowAgent]
    code: 200
    input: []
    output: CapitalRaise
    side_effects:
      - "runs escrow_release_allocation one final time and copies projected_net_release_cents into released_net_cents"
      - "status ESCROW_LOCKED -> RELEASED"
      - "increments CapitalRaise.version by 1"

  - method: POST
    path: "/de-novo/subscriptions/{subscription_id}/funding"
    description: "Move money for one subscription: FUND wires it into escrow, REFUND sends it back."
    roles: [EscrowAgent]
    code: 200
    input: [funding_event]
    output: Subscription
    side_effects:
      - "funding_event=FUND: funding_state PLEDGED -> FUNDED"
      - "funding_event=REFUND: funding_state FUNDED -> REFUNDED"
      - "re-runs escrow_position on the parent raise (counts_toward_escrow, cleared_escrow_cents, funded_gross_cents, pledged_gross_cents, refunded_gross_cents) and escrow_release_allocation"
      - "when the refund drops cleared_escrow_cents below minimum_gross_cents and the raise is ESCROW_LOCKED, the raise reverts ESCROW_LOCKED -> OPEN"
      - "increments Subscription.version by 1 and CapitalRaise.version by 1"

  - method: POST
    path: "/de-novo/subscriptions/{subscription_id}/screening-result"
    description: "Record the investor-screening outcome for one subscription. A rejection unwinds the escrow chain."
    roles: [EscrowAgent]
    code: 200
    input: [outcome]
    output: Subscription
    side_effects:
      - "clearance_state moves to the supplied outcome per the Subscription state machine"
      - "outcome=REJECTED on a FUNDED subscription also sets funding_state FUNDED -> REFUNDED"
      - "re-runs escrow_position and escrow_release_allocation on the parent raise"
      - "when cleared_escrow_cents falls below minimum_gross_cents and the raise is ESCROW_LOCKED, the raise reverts ESCROW_LOCKED -> OPEN"
      - "when the raise reverts to OPEN, every ApprovalCondition with category == CAPITAL and status == SATISFIED on the group's filings returns to OPEN with adjudication_count += 1, and each affected filing's condition posture is recomputed"
      - "increments Subscription.version by 1 and CapitalRaise.version by 1"

  - method: POST
    path: "/de-novo/approval-conditions/{condition_id}/evidence"
    description: "Submit remediation evidence for an OPEN condition of approval, before its deadline."
    roles: [CharterCounsel, LeadOrganizer]
    code: 200
    input: [evidence_reference]
    output: ApprovalCondition
    side_effects:
      - "status OPEN -> EVIDENCE_SUBMITTED, evidence_reference stored"
      - "recomputes the parent filing's condition posture"
      - "increments ApprovalCondition.version by 1 and RegulatoryFiling.version by 1"

  - method: POST
    path: "/de-novo/approval-conditions/{condition_id}/adjudicate"
    description: "Dispose of a condition: SATISFIED, FAILED, WAIVED, or REOPENED to pull a settled condition back open."
    roles: [CharteringExaminer, InsuranceExaminer]
    code: 200
    input: [disposition]
    output: ApprovalCondition
    side_effects:
      - "status moves per the ApprovalCondition state machine and adjudication_count += 1"
      - "recomputes the parent filing's condition_total_count, open_blocking_condition_count, settled_condition_count and pre_opening_clearance"
      - "when open_blocking_condition_count rises from 0 while the filing is CONDITIONALLY_APPROVED, the filing transitions CONDITIONALLY_APPROVED -> ADDITIONAL_INFO_REQUESTED with info_request_round += 1, which in turn pulls group.stage PRE_OPENING -> CONDITIONALLY_APPROVED and cancels the group's SCHEDULED exams"
      - "increments ApprovalCondition.version by 1 and RegulatoryFiling.version by 1"

  - method: POST
    path: "/de-novo/policy-documents/{policy_id}/adopt"
    description: "Board-adopt a DRAFT policy. The adopting organizer must be qualified and must not be the drafter."
    roles: [LeadOrganizer, IndependentDirector]
    code: 200
    input: []
    output: PolicyDocument
    side_effects:
      - "status DRAFT -> BOARD_ADOPTED, adopted_by_organizer_id = X-User-ID, adopted_at = the current logical clock"
      - "increments PolicyDocument.version by 1"

  - method: POST
    path: "/de-novo/policy-documents/{policy_id}/examiner-review"
    description: "Examiner acceptance or rejection of an adopted policy. A rejection starts the five-link cascade."
    roles: [CharteringExaminer]
    code: 200
    input: [outcome, "finding_note?"]
    output: PolicyDocument
    side_effects:
      - "outcome=ACCEPTED: status BOARD_ADOPTED -> EXAMINER_ACCEPTED, finding_note stored"
      - "outcome=REJECTED: status -> REJECTED, finding_note stored, and the full five-link cascade declared on the PolicyDocument state machine runs (POLICY conditions -> filing counts and state -> group stage -> scheduled exams)"
      - "increments PolicyDocument.version by 1"

  - method: POST
    path: "/de-novo/vendor-contracts/{contract_id}/advance"
    description: "Move a vendor contract to SELECTED, SIGNED or TERMINATED."
    roles: [CharterCounsel]
    code: 200
    input: [target_status]
    output: VendorContract
    side_effects:
      - "status = target_status when the transition and its gates permit it"
      - "target_status=TERMINATED cancels every RESERVED or CONFIRMED ConversionWindow of the contract, bumps each window's version by 1, and recomputes active_window_count to 0"
      - "increments VendorContract.version by 1"

  - method: POST
    path: "/de-novo/conversion-windows/{window_id}/confirm"
    description: "Confirm a reserved conversion window. Only a SIGNED contract may have a confirmed window."
    roles: [CharterCounsel]
    code: 200
    input: []
    output: ConversionWindow
    side_effects:
      - "status RESERVED -> CONFIRMED"
      - "increments ConversionWindow.version by 1"

  - method: POST
    path: "/de-novo/readiness-exams/{exam_id}/result"
    description: "Record the pre-opening field visit result. DEFICIENT knocks the group back out of PRE_OPENING."
    roles: [CharteringExaminer]
    code: 200
    input: [outcome, finding_count]
    output: ReadinessExam
    side_effects:
      - "status SCHEDULED -> PASSED or SCHEDULED -> DEFICIENT, finding_count stored"
      - "outcome=DEFICIENT also pulls group.stage PRE_OPENING -> CONDITIONALLY_APPROVED with opening_blocked_reason = EXAM_DEFICIENT, cancels every other SCHEDULED exam of the group, and bumps OrganizingGroup.version by 1"
      - "increments ReadinessExam.version by 1"

  - method: POST
    path: "/de-novo/deviation-requests/{deviation_id}/decision"
    description: "Supervisory decision on a business-plan deviation that exceeded the approval threshold."
    roles: [CharteringExaminer]
    code: 200
    input: [decision, "decision_note?"]
    output: DeviationRequest
    side_effects:
      - "status SUBMITTED -> APPROVED | DENIED | ESCALATED, decision_note stored"
      - "increments DeviationRequest.version by 1"

  # ---------------------------------------------------------------- test-driving endpoint
  - method: POST
    path: "/de-novo/_clock/set_current_utc"
    description: >
      Test-driving endpoint: set the server's logical clock. The clock's startup default is exactly
      2026-08-01T00:00:00Z and it MUST NOT fall back to wall-clock time; every deadline, exam
      window, conversion window and supervision-year computation reads this clock. The clock only
      moves forward.
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "the logical clock becomes to_iso8601"
      - "no entity row is modified; derived supervision_year_index values are recomputed lazily on the next read of the owning group"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the seven declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The supplied X-User-Role is not in the called endpoint's roles list"
  - id: ERR_ORGANIZER_IDENTITY_MISMATCH
    http: 403
    condition: "X-User-Role is LeadOrganizer or IndependentDirector but X-User-ID is not the id of an Organizer belonging to the group in scope"
  - id: ERR_EXAMINER_AUTHORITY_MISMATCH
    http: 403
    condition: "CharteringExaminer tried to decide a DEPOSIT_INSURER filing, or InsuranceExaminer tried to decide a CHARTERING_AUTHORITY filing"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "A required input field is missing, an enum value is not a declared member, or a numeric/string field is outside its declared range or length"
  - id: ERR_GROUP_NOT_FOUND
    http: 404
    condition: "group_id in the path or body names no OrganizingGroup"
  - id: ERR_ORGANIZER_NOT_FOUND
    http: 404
    condition: "organizer_id, drafted_by_organizer_id or the subscription's organizer_id names no Organizer"
  - id: ERR_BUSINESS_PLAN_NOT_FOUND
    http: 404
    condition: "plan_id, supersedes_plan_id, pinned_business_plan_id, baseline_plan_id or business_plan_id names no BusinessPlan"
  - id: ERR_STRESS_SCENARIO_NOT_FOUND
    http: 404
    condition: "scenario_id names no StressScenario"
  - id: ERR_CAPITAL_RAISE_NOT_FOUND
    http: 404
    condition: "raise_id or capital_raise_id names no CapitalRaise"
  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "subscription_id names no Subscription"
  - id: ERR_FILING_NOT_FOUND
    http: 404
    condition: "filing_id names no RegulatoryFiling"
  - id: ERR_CONDITION_NOT_FOUND
    http: 404
    condition: "condition_id names no ApprovalCondition"
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "policy_id names no PolicyDocument"
  - id: ERR_VENDOR_CONTRACT_NOT_FOUND
    http: 404
    condition: "contract_id or vendor_contract_id names no VendorContract"
  - id: ERR_CONVERSION_WINDOW_NOT_FOUND
    http: 404
    condition: "window_id names no ConversionWindow"
  - id: ERR_EXAM_NOT_FOUND
    http: 404
    condition: "exam_id names no ReadinessExam"
  - id: ERR_DEVIATION_NOT_FOUND
    http: 404
    condition: "deviation_id names no DeviationRequest"
  - id: ERR_STALE_GROUP_VERSION
    http: 412
    condition: "expected_group_version does not equal the current OrganizingGroup.version on POST /de-novo/business-plans"
  - id: ERR_STALE_VENDOR_CONTRACT_VERSION
    http: 412
    condition: "expected_vendor_contract_version does not equal the current VendorContract.version on POST /de-novo/conversion-windows"
  - id: ERR_STAGE_TRANSITION_NOT_ALLOWED
    http: 409
    condition: "The requested target_stage is not reachable from the group's current stage per the OrganizingGroup state machine"
  - id: ERR_GROUP_STAGE_LOCKED
    http: 409
    condition: "The group's stage forbids the requested child creation (organizer, business plan, capital raise, policy document or vendor contract)"
  - id: ERR_BACKGROUND_ALREADY_RESOLVED
    http: 409
    condition: "The addressed background dimension has already left PENDING"
  - id: ERR_WAIVER_NOT_APPLICABLE
    http: 409
    condition: "The organizer is not DISQUALIFIED, or a waiver has already been granted"
  - id: ERR_PLAN_NOT_EDITABLE
    http: 409
    condition: "The BusinessPlan is not in DRAFT, so a stress scenario cannot be attached and the plan cannot be submitted"
  - id: ERR_FILING_NOT_FILEABLE
    http: 409
    condition: "The filing is not in DRAFT or ADDITIONAL_INFO_REQUESTED"
  - id: ERR_FILING_DECISION_NOT_ALLOWED
    http: 409
    condition: "The filing's current status does not permit the supplied decision per the RegulatoryFiling state machine"
  - id: ERR_CONDITIONS_NOT_ATTACHABLE
    http: 409
    condition: "The filing is not in CONDITIONALLY_APPROVED, so no condition of approval may be attached"
  - id: ERR_CONDITION_NOT_OPEN
    http: 409
    condition: "Evidence was submitted for a condition whose status is neither OPEN nor FAILED"
  - id: ERR_CONDITION_DISPOSITION_NOT_ALLOWED
    http: 409
    condition: "The condition's current status does not permit the supplied disposition (SATISFIED and FAILED need EVIDENCE_SUBMITTED; REOPENED needs SATISFIED; WAIVED needs OPEN, EVIDENCE_SUBMITTED or FAILED)"
  - id: ERR_RAISE_NOT_OPENABLE
    http: 409
    condition: "The capital raise is not in STRUCTURING"
  - id: ERR_RAISE_NOT_LOCKABLE
    http: 409
    condition: "The capital raise is not in OPEN, so escrow cannot be locked"
  - id: ERR_ESCROW_NOT_LOCKED
    http: 409
    condition: "The capital raise is not in ESCROW_LOCKED - escrow cannot be released, and the group cannot advance to PRE_OPENING"
  - id: ERR_FUNDING_TRANSITION_NOT_ALLOWED
    http: 409
    condition: "funding_event=FUND on a subscription that is not PLEDGED, or funding_event=REFUND on one that is not FUNDED"
  - id: ERR_SCREENING_TRANSITION_NOT_ALLOWED
    http: 409
    condition: "The subscription's clearance_state does not permit the supplied screening outcome"
  - id: ERR_POLICY_NOT_ADOPTABLE
    http: 409
    condition: "The policy document is not in DRAFT"
  - id: ERR_POLICY_NOT_REVIEWABLE
    http: 409
    condition: "The policy document is not in BOARD_ADOPTED or EXAMINER_ACCEPTED"
  - id: ERR_VENDOR_STATUS_TRANSITION_NOT_ALLOWED
    http: 409
    condition: "The requested target_status is not reachable from the contract's current status"
  - id: ERR_VENDOR_NOT_CONVERTIBLE
    http: 409
    condition: "A conversion window was requested on a contract that is not SELECTED or SIGNED"
  - id: ERR_WINDOW_NOT_CONFIRMABLE
    http: 409
    condition: "The conversion window is not in RESERVED"
  - id: ERR_EXAM_NOT_RESOLVABLE
    http: 409
    condition: "The readiness exam is not in SCHEDULED"
  - id: ERR_DEVIATION_NOT_DECIDABLE
    http: 409
    condition: "The deviation request is not in SUBMITTED (an AUTO_ACCEPTED request has already self-cleared)"
  - id: ERR_RAISE_NOT_OPEN
    http: 409
    condition: "The parent CapitalRaise is not in OPEN, so a subscription cannot be created or funded"
  - id: ERR_VENDOR_CONTRACT_NOT_SIGNED
    http: 409
    condition: "The parent VendorContract is not SIGNED, so its reserved window cannot be confirmed"
  - id: ERR_GROUP_NOT_EXAM_READY
    http: 409
    condition: "The group's stage is not CONDITIONALLY_APPROVED or PRE_OPENING, so no readiness exam may be scheduled"
  - id: ERR_GROUP_NOT_IN_PRE_OPENING
    http: 409
    condition: "The group's stage is not PRE_OPENING, so an exam result cannot be recorded"
  - id: ERR_FILINGS_NOT_CONDITIONALLY_APPROVED
    http: 409
    condition: "Both the CHARTERING_AUTHORITY and the DEPOSIT_INSURER filing must be in CONDITIONALLY_APPROVED for this operation"
  - id: ERR_GROUP_NOT_OPEN
    http: 409
    condition: "The group's stage is not OPEN, so a deviation request cannot be submitted"
  - id: ERR_WAIVER_BARRED_BY_FINDING
    http: 409
    condition: "A waiver was requested for an organizer whose adverse_finding_type is FINANCIAL_CRIME"
  - id: ERR_ORGANIZER_NOT_QUALIFIED
    http: 409
    condition: "The adopting organizer's qualification_status is neither QUALIFIED nor WAIVER_GRANTED"
  - id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http: 409
    condition: "The organizer adopting the policy is the same organizer who drafted it"
  - id: ERR_GROUP_COMPOSITION_INCOMPLETE
    http: 409
    condition: "group.composition_status is not COMPOSITION_MET"
  - id: ERR_MANAGEMENT_SCORE_BELOW_MINIMUM
    http: 409
    condition: "group.management_composite_score is below MIN_MANAGEMENT_COMPOSITE_SCORE (70.00)"
  - id: ERR_BLOCKING_CONDITION_NOT_WAIVABLE
    http: 409
    condition: "disposition=WAIVED was requested for a condition with is_pre_opening_blocking == true"
  - id: ERR_PRE_OPENING_CONDITIONS_OPEN
    http: 409
    condition: "A filing still has open_blocking_condition_count > 0, so it cannot reach FINAL_APPROVED and the group cannot open"
  - id: ERR_DUE_DILIGENCE_INSUFFICIENT
    http: 409
    condition: "A CRITICAL vendor contract with due_diligence_score < 70 was advanced to SELECTED"
  - id: ERR_POLICY_COVERAGE_INCOMPLETE
    http: 409
    condition: "At least one of the four required policy domains (LENDING, COMPLIANCE_BSA_AML, INFORMATION_SECURITY, RISK_MANAGEMENT) has no EXAMINER_ACCEPTED document"
  - id: ERR_READINESS_EXAM_NOT_PASSED
    http: 409
    condition: "The group cannot open: no ReadinessExam is PASSED, a filing is not FINAL_APPROVED, escrow is not RELEASED, or opening_blocked_reason is not NONE"
  - id: ERR_FINDINGS_EXCEED_PASS_LIMIT
    http: 409
    condition: "outcome=PASSED was recorded with finding_count above MAX_PASSING_FINDINGS (3)"
  - id: ERR_VENDOR_TERMINATION_BLOCKED_AFTER_OPENING
    http: 409
    condition: "target_status=TERMINATED was requested while the group's stage is OPEN"
  - id: ERR_ADVERSE_FINDING_TYPE_REQUIRED
    http: 422
    condition: "outcome=FLAGGED or outcome=ADVERSE was recorded without a non-NONE adverse_finding_type"
  - id: ERR_SUPERSEDE_TARGET_NOT_ELIGIBLE
    http: 409
    condition: "supersedes_plan_id names a plan of another group or a plan that is not in DRAFT"
  - id: ERR_PINNED_PLAN_NOT_SUBMITTED
    http: 409
    condition: "pinned_business_plan_id names a plan of another group or a plan whose status is neither SUBMITTED nor PINNED"
  - id: ERR_SUBSCRIBER_ORGANIZER_MISMATCH
    http: 409
    condition: "organizer_id names an Organizer of a different group than the raise"
  - id: ERR_DRAFTER_NOT_IN_GROUP
    http: 409
    condition: "drafted_by_organizer_id names an Organizer of a different group than the policy"
  - id: ERR_STRESS_SCENARIO_REQUIRED
    http: 409
    condition: "The plan being submitted has stress_scenario_count == 0"
  - id: ERR_NO_SUBMITTED_BUSINESS_PLAN
    http: 409
    condition: "The group has no BusinessPlan in status SUBMITTED, so it cannot advance to FILING_READY"
  - id: ERR_CRITICAL_VENDOR_NOT_SIGNED
    http: 409
    condition: "A VendorContract of the group with criticality == CRITICAL is not in status SIGNED, or no CRITICAL contract covers CORE_PROCESSING"
  - id: ERR_NO_DEFICIENT_EXAM
    http: 409
    condition: "exam_scope=TARGETED_FOLLOW_UP was requested with no prior DEFICIENT exam on the group"
  - id: ERR_BASELINE_PLAN_NOT_PINNED
    http: 409
    condition: "baseline_plan_id names a plan of another group or a plan whose status is not PINNED"
  - id: ERR_FILING_ALREADY_FINAL
    http: 409
    condition: "disposition=REOPENED was requested on a condition whose filing is FINAL_APPROVED"
  - id: ERR_OFFICER_ROLE_ALREADY_FILLED
    http: 409
    condition: "Another organizer of the group already holds the requested key officer role"
  - id: ERR_SCENARIO_CODE_DUPLICATE
    http: 409
    condition: "The plan already has a stress scenario with that scenario_code"
  - id: ERR_FILING_AUTHORITY_DUPLICATE
    http: 409
    condition: "The group already has a filing with that authority"
  - id: ERR_CONDITION_CODE_DUPLICATE
    http: 409
    condition: "The filing already has a condition with that condition_code"
  - id: ERR_ACTIVE_CAPITAL_RAISE_EXISTS
    http: 409
    condition: "The group already has a CapitalRaise in STRUCTURING, OPEN or ESCROW_LOCKED"
  - id: ERR_POLICY_DOMAIN_ALREADY_ADOPTED
    http: 409
    condition: "Another policy document of the same group and domain is already BOARD_ADOPTED or EXAMINER_ACCEPTED"
  - id: ERR_VENDOR_DOMAIN_ALREADY_SELECTED
    http: 409
    condition: "Another vendor contract of the same group and service_domain is already SELECTED or SIGNED"
  - id: ERR_FULL_SCOPE_EXAM_EXISTS
    http: 409
    condition: "The group already has a FULL_SCOPE readiness exam in SCHEDULED or PASSED"
  - id: ERR_DEVIATION_ALREADY_PENDING
    http: 409
    condition: "Another SUBMITTED deviation request exists for the same group, metric and supervision year"
  - id: ERR_MINIMUM_EXCEEDS_TARGET
    http: 422
    condition: "minimum_gross_cents is greater than target_gross_cents"
  - id: ERR_PROJECTION_NOT_MONOTONIC
    http: 422
    condition: "Projected assets or deposits decrease across the three plan years"
  - id: ERR_LOANS_EXCEED_ASSETS
    http: 422
    condition: "projected_loans_yn_cents exceeds projected_assets_yn_cents for some year n"
  - id: ERR_WINDOW_TOO_LONG
    http: 422
    condition: "The conversion window's duration_hours exceeds MAX_CONVERSION_WINDOW_HOURS (72.00)"
  - id: ERR_CONVERSION_CAPACITY_EXCEEDED
    http: 409
    condition: "Two RESERVED-or-CONFIRMED windows of the same vendor contract already overlap the requested interval (MAX_CONCURRENT_CONVERSIONS = 2)"
  - id: ERR_ESCALATION_THRESHOLD_NOT_MET
    http: 409
    condition: "decision=ESCALATED was requested for a deviation below DEVIATION_ESCALATION_THRESHOLD_BPS (2500)"
  - id: ERR_TARGET_OPENING_DATE_IN_PAST
    http: 422
    condition: "target_opening_date is at or before the current logical clock"
  - id: ERR_CONDITION_DEADLINE_IN_PAST
    http: 422
    condition: "deadline_utc is at or before the current logical clock"
  - id: ERR_CONDITION_DEADLINE_PASSED
    http: 409
    condition: "Evidence was submitted at or after the condition's deadline_utc"
  - id: ERR_WINDOW_END_NOT_AFTER_START
    http: 422
    condition: "window_end_utc is at or before window_start_utc"
  - id: ERR_WINDOW_START_IN_PAST
    http: 422
    condition: "window_start_utc is before the current logical clock"
  - id: ERR_EXAM_WINDOW_CONFLICT
    http: 409
    condition: "The requested exam window overlaps the buffer-extended interval of another non-cancelled exam of the same group"
  - id: ERR_EXAM_WINDOW_NOT_STARTED
    http: 409
    condition: "An exam result was recorded before the exam's window_start_utc"
  - id: ERR_SUPERVISION_WINDOW_EXPIRED
    http: 409
    condition: "group.supervision_year_index is 0 - the bank has not opened, or the three-year heightened supervision window has ended"
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "to_iso8601 is before the current logical clock"
  - id: ERR_OPENING_CAPITAL_BELOW_MINIMUM
    http: 422
    condition: "opening_tier1_capital_cents is below MIN_OPENING_CAPITAL_CENTS (2,000,000,000)"
  - id: ERR_OFFERING_CAPACITY_BELOW_TARGET
    http: 422
    condition: "max_shares * offering_price_cents_per_share is below target_gross_cents"
  - id: ERR_OFFERING_OVERSUBSCRIBED
    http: 409
    condition: "raise.subscribed_shares plus the requested shares would exceed raise.max_shares"
  - id: ERR_NO_CLEARED_SUBSCRIPTIONS
    http: 409
    condition: "No subscription of the raise has counts_toward_escrow == true, so the cleared escrow set is empty"
  - id: ERR_ESCROW_BELOW_MINIMUM
    http: 409
    condition: "raise.cleared_escrow_cents is below raise.minimum_gross_cents"
  - id: ERR_STRESS_CAPITAL_SHORTFALL
    http: 409
    condition: "Some stress scenario of the plan has governing_min_leverage_ratio_bps below DE_NOVO_FLOOR_LEVERAGE_BPS (800)"
  - id: ERR_CAPITAL_INADEQUATE
    http: 409
    condition: "capital_adequacy_verdict evaluated to DEFICIENT for the plan being submitted"
  - id: ERR_NET_RELEASE_BELOW_PLAN_CAPITAL
    http: 409
    condition: "raise.projected_net_release_cents is below the pinned plan's opening_tier1_capital_cents"
  - id: ERR_ESCROW_ALREADY_RELEASED
    http: 409
    condition: "A refund or a screening rejection was attempted after the raise reached RELEASED"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
# role_model: segregation_of_duties. The organizing side (CharterCounsel, LeadOrganizer,
# IndependentDirector) builds the application; the supervisory side (CharteringExaminer,
# InsuranceExaminer) judges it; the EscrowAgent alone touches money. No role is a superset of
# another: PlatformAdmin can read everything and move the logical clock but cannot perform a single
# business write. The sharpest duty split is inside the organizing side - the organizer who drafts
# a policy may not be the organizer who adopts it, enforced by comparing X-User-ID to
# PolicyDocument.drafted_by_organizer_id.
roles:
  - name: CharterCounsel
    description: >
      Outside counsel / project manager for the organizing group. Assembles the application: opens
      the group file, seats organizers, drafts business plans and stress scenarios, structures the
      capital raise, prepares and files both applications, manages vendor selection and core
      conversion scheduling, and drives every stage advance.
    identity: opaque
    exclusive_operations:
      - "POST /de-novo/organizing-groups"
      - "POST /de-novo/organizing-groups/{group_id}/organizers"
      - "POST /de-novo/business-plans"
      - "POST /de-novo/business-plans/{plan_id}/stress-scenarios"
      - "POST /de-novo/capital-raises"
      - "POST /de-novo/capital-raises/{raise_id}/open"
      - "POST /de-novo/regulatory-filings"
      - "POST /de-novo/regulatory-filings/{filing_id}/file"
      - "POST /de-novo/organizing-groups/{group_id}/advance"
      - "POST /de-novo/vendor-contracts"
      - "POST /de-novo/vendor-contracts/{contract_id}/advance"
      - "POST /de-novo/conversion-windows"
      - "POST /de-novo/conversion-windows/{window_id}/confirm"
    shared_operations:
      - "POST /de-novo/approval-conditions/{condition_id}/evidence (shared with LeadOrganizer)"
      - "every GET endpoint"

  - name: LeadOrganizer
    description: >
      An organizer of the group acting in a board-officer capacity. Submits the business plan for
      review, drafts and adopts board policies, submits remediation evidence, and files
      business-plan deviation notices during heightened supervision. X-User-ID must be the id of an
      Organizer row belonging to the group in scope.
    identity: "entity_backed:Organizer"
    exclusive_operations:
      - "POST /de-novo/business-plans/{plan_id}/submit"
      - "POST /de-novo/deviation-requests"
    shared_operations:
      - "POST /de-novo/policy-documents (shared with IndependentDirector)"
      - "POST /de-novo/policy-documents/{policy_id}/adopt (shared with IndependentDirector)"
      - "POST /de-novo/approval-conditions/{condition_id}/evidence (shared with CharterCounsel)"
      - "every GET endpoint"

  - name: IndependentDirector
    description: >
      An independent (non-affiliated) organizer seated on the proposed board. Exists as a distinct
      role so that policy adoption can be performed by someone other than the drafter without
      granting the wider LeadOrganizer surface. X-User-ID must be the id of an Organizer row
      belonging to the group in scope.
    identity: "entity_backed:Organizer"
    exclusive_operations: []
    shared_operations:
      - "POST /de-novo/policy-documents (shared with LeadOrganizer)"
      - "POST /de-novo/policy-documents/{policy_id}/adopt (shared with LeadOrganizer)"
      - "every GET endpoint"
    note: >
      Deliberately has no exclusive operations - it is a strict subset of LeadOrganizer's write
      surface. The role still matters because the adopt endpoint's segregation-of-duties check is on
      X-User-ID, not on the role name, so an IndependentDirector who happens to be the drafter is
      rejected exactly like a LeadOrganizer would be.

  - name: CharteringExaminer
    description: >
      The chartering authority's examination staff. Runs background checks, grants qualification
      waivers, decides the CHARTERING_AUTHORITY filing, attaches and adjudicates conditions of
      approval, reviews adopted policies, schedules and resolves the pre-opening readiness
      examination, and decides business-plan deviations during heightened supervision.
    identity: opaque
    exclusive_operations:
      - "POST /de-novo/organizers/{organizer_id}/background-result"
      - "POST /de-novo/organizers/{organizer_id}/qualification-waiver"
      - "POST /de-novo/policy-documents/{policy_id}/examiner-review"
      - "POST /de-novo/organizing-groups/{group_id}/readiness-exams"
      - "POST /de-novo/readiness-exams/{exam_id}/result"
      - "POST /de-novo/deviation-requests/{deviation_id}/decision"
      - "POST /de-novo/regulatory-filings/{filing_id}/decision on a filing whose authority == CHARTERING_AUTHORITY"
    shared_operations:
      - "POST /de-novo/regulatory-filings/{filing_id}/conditions (shared with InsuranceExaminer)"
      - "POST /de-novo/approval-conditions/{condition_id}/adjudicate (shared with InsuranceExaminer)"
      - "every GET endpoint"

  - name: InsuranceExaminer
    description: >
      The deposit-insurance authority's examination staff. Decides only the DEPOSIT_INSURER
      filing and works its conditions. Has no reach into the charter decision, the readiness
      examination or the deviation regime.
    identity: opaque
    exclusive_operations:
      - "POST /de-novo/regulatory-filings/{filing_id}/decision on a filing whose authority == DEPOSIT_INSURER"
    shared_operations:
      - "POST /de-novo/regulatory-filings/{filing_id}/conditions (shared with CharteringExaminer)"
      - "POST /de-novo/approval-conditions/{condition_id}/adjudicate (shared with CharteringExaminer)"
      - "every GET endpoint"
    note: >
      CharteringExaminer and InsuranceExaminer are peer roles on the same two endpoints, split by
      the addressed filing's authority rather than by the endpoint. A cross-authority decision
      attempt is ERR_EXAMINER_AUTHORITY_MISMATCH (403), not ERR_ROLE_NOT_PERMITTED, because the
      role IS in the endpoint's roles list.

  - name: EscrowAgent
    description: >
      The independent escrow agent holding subscription proceeds. The ONLY role that may record
      subscriptions, move subscription money, record investor screening outcomes, or lock and
      release escrow. Neither the organizing side nor the supervisory side can touch escrow.
    identity: opaque
    exclusive_operations:
      - "POST /de-novo/subscriptions"
      - "POST /de-novo/subscriptions/{subscription_id}/funding"
      - "POST /de-novo/subscriptions/{subscription_id}/screening-result"
      - "POST /de-novo/capital-raises/{raise_id}/lock-escrow"
      - "POST /de-novo/capital-raises/{raise_id}/release-escrow"
    shared_operations:
      - "every GET endpoint"

  - name: PlatformAdmin
    description: >
      Operational identity for the hosting platform. Reads everything and owns the logical clock;
      performs no business write of any kind.
    identity: opaque
    exclusive_operations:
      - "POST /de-novo/_clock/set_current_utc"
    shared_operations:
      - "every GET endpoint"
