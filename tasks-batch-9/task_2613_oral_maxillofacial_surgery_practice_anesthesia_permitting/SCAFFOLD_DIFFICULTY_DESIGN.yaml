              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON", acls_expires_on: "2027-06-30T00:00:00Z" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Sizing", date_of_birth: "1980-03-15T00:00:00Z", asa_class: 2, airway_class: 2, weight_kg: 80, dental_plan_active: true }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_id}", primary_surgeon_id: "${surg_id}", planned_anesthesia_level: "LOCAL_ONLY", procedure_category: "IMPLANT", planned_start: "2026-09-14T13:00:00Z", planned_end: "2026-09-14T14:00:00Z", total_charge_cents: 150000 }
              as: SchedulingCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /implant-lots"
              payload: { practice_id: "${prac_id}", manufacturer_code: "NOBEL", catalog_reference: "NB-4812", diameter_mm: 4.8, length_mm: 12.0, unit_cost_cents: 20000, quantity_on_hand: 3, expiry_date: "2027-06-30T00:00:00Z", is_consignment: false }
              as: InventoryManager
              captures: { lotA_id: $.data.id }
            - call: "POST /implant-lots"
              payload: { practice_id: "${prac_id}", manufacturer_code: "NOBEL", catalog_reference: "NB-4910", diameter_mm: 4.9, length_mm: 10.0, unit_cost_cents: 20000, quantity_on_hand: 3, expiry_date: "2027-06-30T00:00:00Z", is_consignment: false }
              as: InventoryManager
