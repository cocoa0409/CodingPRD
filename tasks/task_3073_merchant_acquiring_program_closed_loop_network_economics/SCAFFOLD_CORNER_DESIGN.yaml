              as: NetworkAcquirer
              captures: { m_rb1: $.data.id }
          trigger:
            - call: "POST /network/merchants/${m_rb1}/suppress"
              payload: {}
              as: NetworkSettlementOps
              captures: { rb1_err: $.data.error_id }
          assert:
            - "the response status is 403 and the error_id is ERR_FORBIDDEN"
            - "GET /network/merchants/${m_rb1} still shows acceptance_status == PROSPECT"

      - name: merchant_cannot_read_another_merchants_settlement
        claim_type: RBAC Denial
        grounds:
          - roles.Merchant.shared_operations
          - endpoints.GET_/network/settlements/{settlement_id}
        distinguishing_aspect: "A Merchant acting as merchant 2 reads a settlement owned by merchant 1: the entity-backed ownership check denies with ERR_FORBIDDEN rather than returning the row."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two ACTIVE merchants; a settlement captured for merchant 1."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "MEDIUM", base_discount_rate_bps: 250, high_risk_flag: false }
              as: NetworkAcquirer
              captures: { ic_rb2: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_rb2}", merchant_name: "RBAC Merchant 2", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_rb2a: $.data.id, m_rb2a_v: $.data.version }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_rb2}", merchant_name: "RBAC Merchant 3", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_rb2b: $.data.id }
            - call: "POST /network/merchants/${m_rb2a}/accept"
              payload: { expected_merchant_version: "${m_rb2a_v}" }
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_rb2a}/activate"
              payload: {}
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_rb2a}/settlements"
              payload: { settlement_cycle: 1, gross_volume_cents: 500000, refund_volume_cents: 0 }
              as: NetworkSettlementOps
              captures: { s_rb2: $.data.id }
          trigger:
            - call: "GET /network/settlements/${s_rb2}"
              payload: {}
              as: Merchant
              as_user_id: "${m_rb2b}"
              captures: { rb2_err: $.data.error_id }
          assert:
            - "the response status is 403 and the error_id is ERR_FORBIDDEN"
            - "no settlement fields are present in the error body"

      - name: dispute_operator_cannot_respond_as_a_merchant
        claim_type: RBAC Denial
        grounds:
          - roles.Merchant.exclusive_operations
          - endpoints.POST_/network/disputes/{dispute_id}/respond
        distinguishing_aspect: "Responding to a dispute is exclusive to the Merchant role; a NetworkDisputeOps operator is denied, so the operator who adjudicates cannot also be the responder."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE merchant, an active member, and an OPEN dispute of 100000 cents."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "MEDIUM", base_discount_rate_bps: 250, high_risk_flag: false }
              as: NetworkAcquirer
              captures: { ic_rb3: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_rb3}", merchant_name: "RBAC Merchant 4", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_rb3: $.data.id, m_rb3_v: $.data.version }
            - call: "POST /network/merchants/${m_rb3}/accept"
              payload: { expected_merchant_version: "${m_rb3_v}" }
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_rb3}/activate"
              payload: {}
              as: NetworkAcquirer
            - call: "POST /network/cardmembers"
              payload: { member_name: "Member RBAC", card_product: "PLATINUM" }
              as: NetworkIssuer
              captures: { cm_rb3: $.data.id }
            - call: "POST /network/cardmembers/${cm_rb3}/activate"
              payload: {}
              as: NetworkIssuer
            - call: "POST /network/disputes"
              payload: { cardmember_id: "${cm_rb3}", original_merchant_id: "${m_rb3}", final_merchant_id: "${m_rb3}", amount_cents: 100000 }
              as: CardMember
              as_user_id: "${cm_rb3}"
              captures: { d_rb3: $.data.id }
          trigger:
            - call: "POST /network/disputes/${d_rb3}/respond"
              payload: {}
              as: NetworkDisputeOps
              captures: { rb3_err: $.data.error_id }
          assert:
            - "the response status is 403 and the error_id is ERR_FORBIDDEN"
            - "Dispute.${d_rb3}.dispute_status == OPEN"

  # ===========================================================================
  - section: complexity_layers
    instances:

      - name: occ_stale_merchant_version_on_reactivation_round
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reaccept-from-dormant-stale-merchant]
          - state_machines.Merchant.DORMANT_to_PROSPECT
        distinguishing_aspect: "A merchant re-entering PROSPECT from DORMANT carries a version the client observed before the cycle closed; accepting with that stale version is rejected with 412 ERR_STALE_VERSION even though the target state (PROSPECT) is valid."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A MEDIUM USD category, a DIRECT merchant accepted, activated and marked DORMANT; an open acceptance-gap window and matching sweep generation close the cycle back to PROSPECT."
            - "The merchant version was observed while it was DORMANT, before the cycle closed."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "MEDIUM", base_discount_rate_bps: 250, high_risk_flag: false }
              as: NetworkAcquirer
              captures: { ic_oc1: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_oc1}", merchant_name: "OCC Cycle Merchant", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_oc1: $.data.id, m_oc1_v: $.data.version }
            - call: "POST /network/merchants/${m_oc1}/accept"
              payload: { expected_merchant_version: "${m_oc1_v}" }
              as: NetworkAcquirer
              captures: { m_oc1_v2: $.data.version }
            - call: "POST /network/merchants/${m_oc1}/activate"
              payload: {}
              as: NetworkAcquirer
              captures: { m_oc1_v3: $.data.version }
            - call: "POST /network/merchants/${m_oc1}/mark-dormant"
              payload: {}
              as: NetworkAcquirer
              captures: { m_oc1_stale: $.data.version, m_oc1_sv: $.data.status_version }
            - call: "POST /network/acceptance-gaps/rollup"
              payload: { region_code: "US-NE", industry_category_id: "${ic_oc1}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-31T00:00:00Z", window_days: 30 }
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_oc1}/declined-attempts"
              payload: { card_product: "PLATINUM", attempted_amount_cents: 100000, decline_reason: "MERCHANT_NOT_ACCEPTED", occurred_at: "2026-08-10T00:00:00Z" }
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_oc1}/declined-attempts"
              payload: { card_product: "PLATINUM", attempted_amount_cents: 100000, decline_reason: "MERCHANT_NOT_ACCEPTED", occurred_at: "2026-08-11T00:00:00Z" }
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_oc1}/declined-attempts"
              payload: { card_product: "PLATINUM", attempted_amount_cents: 100000, decline_reason: "MERCHANT_NOT_ACCEPTED", occurred_at: "2026-08-12T00:00:00Z" }
              as: NetworkAcquirer
            - call: "POST /network/_sweep-index/stamp"
              payload: { sweep_index: "${m_oc1_sv}", rolled_at: "2026-09-01T00:00:00Z" }
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_oc1}/declined-attempts"
              payload: { card_product: "PLATINUM", attempted_amount_cents: 100000, decline_reason: "MERCHANT_NOT_ACCEPTED", occurred_at: "2026-08-13T00:00:00Z" }
              as: NetworkAcquirer
          trigger:
            - call: "POST /network/merchants/${m_oc1}/accept"
              payload: { expected_merchant_version: "${m_oc1_stale}" }
              as: NetworkAcquirer
              captures: { oc1_err: $.data.error_id }
          assert:
            - "the response status is 412 and the error_id is ERR_STALE_VERSION"
            - "GET /network/merchants/${m_oc1} still shows acceptance_status == PROSPECT"

      - name: occ_current_version_on_first_acceptance_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reaccept-from-dormant-stale-merchant]
          - endpoints.POST_/network/merchants/{merchant_id}/accept
        distinguishing_aspect: "The positive twin: accepting with the version the client just observed succeeds, confirming the 412 rule rejects only stale versions rather than every accept."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A MEDIUM USD category and a PROSPECT DIRECT merchant whose current version has been read."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "MEDIUM", base_discount_rate_bps: 250, high_risk_flag: false }
              as: NetworkAcquirer
              captures: { ic_oc2: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_oc2}", merchant_name: "OCC Merchant 2", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_oc2: $.data.id }
            - call: "GET /network/merchants/${m_oc2}"
              payload: {}
              as: NetworkAcquirer
              captures: { m_oc2_v: $.data.version }
          trigger:
            - call: "POST /network/merchants/${m_oc2}/accept"
              payload: { expected_merchant_version: "${m_oc2_v}" }
              as: NetworkAcquirer
              captures: { m_oc2_new: $.data.version }
          assert:
            - "the response status is 200 and acceptance_status == ACCEPTED"
            - "the returned version is exactly one greater than the observed version"

      - name: merchant_version_increments_on_each_mutation
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Merchant
          - entities.Merchant.fields.status_version
        distinguishing_aspect: "version advances by exactly one on every merchant mutation while status_version advances only on the two acceptance-status activations; the two counters are reconciled separately."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A MEDIUM USD category and a PROSPECT DIRECT merchant."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "MEDIUM", base_discount_rate_bps: 250, high_risk_flag: false }
              as: NetworkAcquirer
              captures: { ic_oc3: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_oc3}", merchant_name: "OCC Merchant 3", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_oc3: $.data.id, m_oc3_v: $.data.version }
            - call: "POST /network/merchants/${m_oc3}/accept"
              payload: { expected_merchant_version: "${m_oc3_v}" }
              as: NetworkAcquirer
              captures: { m_oc3_v2: $.data.version }
            - call: "POST /network/merchants/${m_oc3}/activate"
              payload: {}
              as: NetworkAcquirer
              captures: { m_oc3_v3: $.data.version }
            - call: "POST /network/merchants/${m_oc3}/mark-dormant"
              payload: {}
              as: NetworkAcquirer
          trigger:
            - call: "GET /network/merchants/${m_oc3}"
              payload: {}
              as: NetworkAcquirer
          assert:
            - "Merchant.${m_oc3}.version == 4 after create, accept, activate and mark-dormant (one per mutation)"
            - "Merchant.${m_oc3}.status_version == 2 (one per acceptance-status activation: accept and activate, not mark-dormant)"
            - "Merchant.${m_oc3}.acceptance_status == DORMANT"

      - name: cascading_suppression_side_effects_replay_forward
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Merchant.ACTIVE_to_SUPPRESSED
        excluded_because:
          difficulty_instance: payment_reversal_cascade_depth2
          rationale: "The forward replay of the suppression side effects onto offers and settlements is asserted as the named §1.8 cascade instance."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: settlement_finalize_reports_the_updated_merchant_in_the_same_response
        claim_type: immediate
        grounds:
          - endpoints.POST_/network/merchants/{merchant_id}/funding/batches/{batch_seq}/finalize
          - entities.Merchant.fields.billed_volume_mtd_cents
        distinguishing_aspect: "The finalize response returns the merchant with the batch's derived fields already reconciled (immediate consistency): billed_volume_mtd_cents and last_batch_discount_fee_cents reflect the batch with no follow-up read."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A HIGH-risk USD category (250 bps) and an ACTIVE DIRECT merchant with two captured settlements of 400000 cents each in batches 1 and 2."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "HIGH", base_discount_rate_bps: 250, high_risk_flag: true }
              as: NetworkAcquirer
              captures: { ic_cm: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_cm}", merchant_name: "Consistency Merchant", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_cm: $.data.id, m_cm_v: $.data.version }
            - call: "POST /network/merchants/${m_cm}/accept"
              payload: { expected_merchant_version: "${m_cm_v}" }
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_cm}/activate"
              payload: {}
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_cm}/settlements"
              payload: { settlement_cycle: 1, gross_volume_cents: 400000, refund_volume_cents: 0 }
              as: NetworkSettlementOps
            - call: "POST /network/merchants/${m_cm}/settlements"
              payload: { settlement_cycle: 2, gross_volume_cents: 400000, refund_volume_cents: 0 }
              as: NetworkSettlementOps
          trigger:
            - call: "POST /network/merchants/${m_cm}/funding/batches/2/finalize"
              payload: {}
              as: NetworkSettlementOps
              captures: { cm_after: $.data.billed_volume_mtd_cents, cm_disc: $.data.last_batch_discount_fee_cents }
          assert:
            - "the finalize response is 200 and returns Merchant data in the same payload"
            - "the returned last_batch_discount_fee_cents == 10000 (sum-then-round over the batch gross of 400000 at 250 bps)"
            - "the returned billed_volume_mtd_cents == 400000 (settlement 1 promoted to SETTLED by the later batch 2 finalize)"
            - "no follow-up GET is needed to observe either field"