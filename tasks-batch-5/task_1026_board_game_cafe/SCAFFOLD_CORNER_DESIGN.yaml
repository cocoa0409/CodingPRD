          setup: ["No preconditions."]
          setup_api_calls: []
          trigger:
            - call: "POST /tables"
              payload: { label: "X", seats: 4, half_hour_rate_cents: 0, day_pass_cents: 0, cover_fee_cents: 0, min_spend_cents: 0 }
              as: Staff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED and http_status == 403"

      - name: rbac_member_cannot_create_tournament_returns_unauthorized
        claim_type: Cannot Perform Others Exclusive
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "POST /tournaments as Member returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A member exists to act as."]
          setup_api_calls:
            - call: "POST /memberships"
