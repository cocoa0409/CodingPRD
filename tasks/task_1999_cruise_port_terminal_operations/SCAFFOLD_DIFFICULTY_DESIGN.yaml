            - "err1 == ERR_INVALID_STATE (entry SCREENED, not EMBARKED)"
            - "After board: st == LOADED and PortCall.${pc}.bags_aboard == 1"

  # ---------------------------------------------------------------- rule 8 ---
  - rule_id: resource_temporal_overlap
    instances:
      - name: berth_buffered_halfopen_pairwise
        grounds:
          - calculations.berth_window_conflict
        distinguishing_aspect: |
          Resource: Berth. Interval semantics: pairwise half-open windows with a
          mandatory 120-minute buffer on BOTH sides. An interior-overlapping
          candidate is rejected even though its own schedule is feasible, while
          a candidate ending exactly buffer-minutes before the incumbent start
          is accepted. Different resource and semantics than the apron's
          aggregate concurrency cap.
        test_recipe:
          setup:
            - "Call A CONFIRMED [2026-08-10T06:00, 2026-08-10T22:00] on B1"
            - "Call D TENTATIVE [2026-08-09T10:00, 2026-08-10T04:00] (ends exactly 120 min before A starts)"
            - "Call B TENTATIVE [2026-08-10T10:00, 2026-08-10T20:00] (interior overlap with A)"
            - "TENTATIVE creation performs no overlap check: both coexist pre-confirm"
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${term}", berth_code: "B1", length_ft: 1200, max_draft_ft: 40.0 }, as: PortAuthorityAdmin, captures: { b1: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV R", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "VA", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 10, booked_debark_pax: 10 }, as: VesselAgent, as_user_id: "${ves}", captures: { pca: $.data.id, pca_v: $.data.version } }
            - { call: "POST /port-ops/port-calls/${pca}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T22:00:00Z", expected_port_call_version: "${pca_v}" }, as: Harbormaster, captures: { baa: $.data.id } }
            - { call: "POST /port-ops/berth-assignments/${baa}/confirm", as: Harbormaster }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "VD", scheduled_eta: "2026-08-09T12:00:00Z", scheduled_etd: "2026-08-10T02:00:00Z", booked_embark_pax: 10, booked_debark_pax: 10 }, as: VesselAgent, as_user_id: "${ves}", captures: { pcd: $.data.id, pcd_v: $.data.version } }
            - { call: "POST /port-ops/port-calls/${pcd}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-09T10:00:00Z", window_end: "2026-08-10T04:00:00Z", expected_port_call_version: "${pcd_v}" }, as: Harbormaster, captures: { bad: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "VB", scheduled_eta: "2026-08-10T10:30:00Z", scheduled_etd: "2026-08-10T19:30:00Z", booked_embark_pax: 10, booked_debark_pax: 10 }, as: VesselAgent, as_user_id: "${ves}", captures: { pcb: $.data.id, pcb_v: $.data.version } }
            - { call: "POST /port-ops/port-calls/${pcb}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-10T10:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_port_call_version: "${pcb_v}" }, as: Harbormaster, captures: { bab: $.data.id } }
          trigger:
            - { call: "POST /port-ops/berth-assignments/${bad}/confirm", as: Harbormaster, captures: { std: $.data.status } }
            - { call: "POST /port-ops/berth-assignments/${bab}/confirm", as: Harbormaster, captures: { err: $.data.error_id } }
          assert:
            - "Call D (ends 04:00, incumbent starts 06:00, gap == 120 exactly): std == CONFIRMED"
            - "Call B (interior overlap 10:00-20:00 inside 06:00-22:00): err == ERR_BERTH_WINDOW_CONFLICT"
            - "BerthAssignment.${bab}.status remains TENTATIVE; ${bad} unaffected"
      - name: apron_aggregate_concurrency_cap
        grounds:
          - calculations.apron_capacity_window
          - validations[priority=19]
        distinguishing_aspect: |
          Resource: Terminal apron. Interval semantics: AGGREGATE CONCURRENCY —
          any IN_PROGRESS order anywhere on the terminal consumes one of
          max_apron_slots regardless of its window times; no pairwise interval
          arithmetic is involved. in_progress == max_apron_slots - 1 passes,
          == max_apron_slots rejects with ERR_APRON_CAPACITY. Different resource
          and semantics than the berth's buffered pairwise windows.
        test_recipe:
          setup:
            - "Terminal max_apron_slots=2; berths B1+B2; two calls each ARRIVED with ACTIVE assignment"
            - "SO1 (call 1, PROVISIONING), SO2 (call 2, PROVISIONING), SO3 (call 1, WASTE_OFFLOAD) all APPROVED while posture OPERATIONAL"
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 2, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
