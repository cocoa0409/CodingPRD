              as: MaintenanceCoordinator
              captures: { trc_503_id: $.data.id }
            - call: "POST /fleet/trailers"
              payload: { trailer_code: "VAN-903", domicile_id: "${dom_stl_id}", trailer_type: "DRY_VAN", capacity_cases: 1500, inspection_due_at: "2026-12-01T00:00:00Z" }
              as: MaintenanceCoordinator
              captures: { trl_903_id: $.data.id }
            - call: "POST /fleet/replenishment-orders"
              payload: { store_id: "${store_s3_id}", cases: 900, weight_lbs: 20000, requested_window_start: "2026-08-04T07:00:00Z", requested_window_end: "2026-08-04T11:00:00Z", temperature_mode: "DRY", priority: 3 }
              as: FleetPlanner
              captures: { ord_3a_id: $.data.id }
            - call: "POST /fleet/replenishment-orders"
