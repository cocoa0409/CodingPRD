          Cycle on OfferLetter: SENT -> COUNTERED -> REVISED -> COUNTERED -> REVISED ->
          COUNTERED traverses the same two states repeatedly, and only the REVISED edge moves
          current_amount while only the COUNTERED edge moves last_counter_amount and
          counter_round_count. The loop terminates at MAX_COUNTER_ROUNDS 3, so a fourth
          counter from a valid REVISED state fails with ERR_COUNTER_ROUNDS_EXHAUSTED rather
          than with a state error.
