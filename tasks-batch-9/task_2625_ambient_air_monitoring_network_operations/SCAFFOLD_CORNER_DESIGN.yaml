              as: NetworkAdmin
          assert:
            - "before the trigger at clock 2026-01-05: Monitor.${mon_id}.qc_posture == QC_CURRENT and qc_posture_in_service == QC_CURRENT because elapsed_days == 14 <= 14"
            - "before the trigger: MonitoringNetwork.${net_id}.delinquent_monitor_count == 0"
