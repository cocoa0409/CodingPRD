      - "completing with gratuity_cents 9001 returns 422 ERR_GRATUITY_LIMIT_EXCEEDED, because round_half_up(18000 * GRATUITY_CAP_BP / 10000) == 9000 — the rung is a fiscal shape rejection (422), not a state conflict (409)"
      - "the intervening GET shows schedule_status still IN_SERVICE, gratuity_cents 0 and realized_price_cents null: the refused completion had no partial effect"
      - "completing with gratuity_cents exactly 9000 returns 200 with schedule_status COMPLETED and gratuity_cents 9000, proving the ceiling is inclusive"
      - "GET /appointments/${appt}/retail-attachments returns exactly one row (${att}) still RECOMMENDED — completion does not resolve recommendations — inside the standard pagination envelope with total_count 1 and has_more false"

  - name: segregation_of_duties_blocks_self_review_and_self_override
    claim_type: Violation → Error
    grounds:
    - validations.p11_ERR_SEGREGATION_OF_DUTIES.check
    - state_machines.TherapistLicense.transitions.PENDING_REVIEW_to_VERIFIED.preconditions
    - state_machines.IntakeForm.transitions.SCREENED_FLAGGED_to_OVERRIDDEN.preconditions
    distinguishing_aspect: "Both refusals depend only on X-User-ID equality against a stored counterparty field (submitted_by_user_id, screened_by_user_id) while the caller's role is fully permitted, so an implementation that authorises on role alone accepts both calls; the licence probe also proves rung 11 fires ahead of the CE rungs."
    test_recipe:
      setup: One therapist with a PENDING_REVIEW licence submitted by co-1 and requiring 0 CE hours, and one guest whose intake form was screened by co-3 and came back SCREENED_FLAGGED on ACUTE_HYPERTENSION.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
