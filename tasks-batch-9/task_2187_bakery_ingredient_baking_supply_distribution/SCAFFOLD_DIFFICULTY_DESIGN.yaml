              payload: { product_id: "${flour_id}", quantity_lb: 20000 }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /bakery-distribution/orders/${order_id}/submit"
              payload: {}
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { tot: $.data.total_cents }
            - call: "POST /bakery-distribution/orders/${order_id}/allocate"
              payload: {}
              as: WarehouseOperator
              as_user_id: "wo-1"
            - call: "POST /bakery-distribution/routes"
              payload: { route_code: "R-FULL-01", service_on: "2026-09-15T00:00:00Z", vehicle_capacity_lb: 20000, service_buffer_minutes: 30 }
              as: LogisticsPlanner
              as_user_id: "lp-1"
              captures: { route_id: $.data.id, route_v1: $.data.version }
            - call: "POST /bakery-distribution/routes/${route_id}/stops"
              payload: { order_id: "${order_id}", window_start_at: "2026-09-15T08:00:00Z", window_end_at: "2026-09-15T10:00:00Z", expected_route_version: "${route_v1}" }
              as: LogisticsPlanner
              as_user_id: "lp-1"
              captures: { stop_id: $.data.id }
            - call: "GET /bakery-distribution/routes/${route_id}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "lp-1"
              captures: { util_before: $.data.utilization_pct, load_before: $.data.planned_load_lb }
          trigger:
            - call: "POST /bakery-distribution/routes/${route_id}/seal"
