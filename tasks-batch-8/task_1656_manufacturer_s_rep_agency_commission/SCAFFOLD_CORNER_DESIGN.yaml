              as: AgencyAdmin
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R3", territory_codes: ["WA"] }
              as: AgencyAdmin
          trigger:
            - call: "GET /rep-agency/reps"
              as: Auditor
          assert:
            - "response_type == \"array\"; total_count == 3; limit == 10; offset == 0; has_more == false"
            - "data contains exactly the 3 created reps"

