  - section: Endpoints
    instances:
      - name: endpoint_payoff_adjustment_removes_the_draw_from_the_conserved_sum
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /dealers/{id}/floor-plan-adjustments]
          - calculations.floor_plan_conservation
          - entities.DealerOrder.fields.floor_plan_status
        distinguishing_aspect: |
          PAYOFF is the only path that turns a DRAWN order into REPAID, and it operates on the CHILD order
          while returning the parent Dealer. The order's own status stays ALLOCATED and floor_plan_draw_cents
          is retained on the row for audit - only floor_plan_status decides membership in the conserved sum,
          which is what distinguishes a payoff from a cancellation.
        test_recipe:
          setup:
            - "Dealer DLR-001 with limit 200000000; order PO-10001 ALLOCATED with a 521460 draw outstanding."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
