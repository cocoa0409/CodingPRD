            - "RegulatorRequest.${rr_id}.status == CLOSED and regulator_round == 0"
            - "PlanYear.${py_id}.status == CLOSED"
            - "the follow-up POST /parity/nqtl-items -> 409 ERR_PLAN_YEAR_CLOSED"
            - "POST /parity/regulator-requests/${rr_id}/respond -> 409 ERR_REGULATOR_REQUEST_NOT_OPEN and a second adjudicate -> 409 ERR_REGULATOR_REQUEST_NOT_RESPONDED"
            - "PlanYear.${py_id}.compliance_posture == AT_RISK (the ladder keeps recomputing; only status is frozen)"

      - name: adjudicating_insufficient_reopens_the_regulator_request_for_a_second_round
        claim_type: Valid Transition
        grounds:
