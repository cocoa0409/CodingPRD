            - { call: "POST /vendor-office/requests/${rq_id}/check-ins", payload: { lines: [{ tray_id: "${t1_id}", instrument_count_delivered: 10 }, { tray_id: "${t2_id}", instrument_count_delivered: 10 }, { tray_id: "${t3_id}", instrument_count_delivered: 10 }], ifu_provided: true, loaner_agreement_ref: "LA-1" }, as: VendorRep, as_user_id: "${rep_id}", captures: { ci_id: $.data.id } }
            - { call: "POST /vendor-office/check-ins/${ci_id}/verify", payload: { line_dispositions: [{ tray_id: "${t1_id}", disposition: "ACCEPT" }, { tray_id: "${t2_id}", disposition: "ACCEPT" }, { tray_id: "${t3_id}", disposition: "ACCEPT" }] }, as: VendorCoordinator, as_user_id: "coord-1" }
            - { call: "POST /vendor-office/trays/${t1_id}/turns", as: SterileProcessingTech, captures: { turn1_id: $.data.id } }
            - { call: "POST /vendor-office/trays/${t2_id}/turns", as: SterileProcessingTech, captures: { turn2_id: $.data.id } }
            - { call: "POST /vendor-office/trays/${t3_id}/turns", as: SterileProcessingTech, captures: { turn3_id: $.data.id } }
