  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: transfer_pricing_tiered_markup_floor_nested_min_max
        grounds:
          - calculations.transfer_pricing
          - entities.DoughType.fields.flat_transfer_price
          - entities.Cafe.fields.ownership_type
        distinguishing_aspect: |
          Mode (a): a >=3-input formula (flat_transfer_price, ownership_type,
          price floor by category) with a conditional branch on ownership_type
          AND a nested max() against the floor — the artisan-COMPANY arm must be
          clamped by max(5.90, 4.00) while the conventional arm needs no clamp.
        test_recipe:
          setup:
            - "F1, CXL (conv $4.00), BMT (artisan $5.00) exist"
            - "C1 FRANCHISE, C3 COMPANY both locked+planned+released+delivered: C1 180 CXL, C3 50 BMT"
          setup_api_calls:
            - call: "POST /dough-ops/facilities"
              payload: { name: "F1", effective_capacity_units: 2000 }
              as: FacilityPlanner
              captures: { f1_id: $.data.id }
            - call: "POST /dough-ops/dough-types"
              payload: { code: "CXL", category: "CONVENTIONAL", shelf_life_hours: 36, order_cutoff_local: "13:00", substitution_allowed: false, flat_transfer_price: 4.00 }
