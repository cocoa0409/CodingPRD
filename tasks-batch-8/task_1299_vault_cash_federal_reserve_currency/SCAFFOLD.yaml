# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: CashOperationsAdmin
    description: "Bank cash-operations administrator; configures sites/carriers/staff/windows/ATMs, approves escalated variances, drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /vault-cash/_clock/set_current_utc"
      - "POST/PATCH /vault-cash/vault-sites"
      - "POST /vault-cash/staff-members"
      - "POST/PATCH /vault-cash/carriers"
      - "POST /vault-cash/atm-machines"
      - "POST /vault-cash/seasonal-windows"
      - "POST /vault-cash/reconciliations/{id}/approve"
    shared_operations: ["all GET endpoints", "POST /vault-cash/cash-ledger-entries", "POST /vault-cash/reconciliations/{id}/lock", "POST /vault-cash/atm-machines/{id}/set-service-status"]
  - name: VaultCustodian
    description: "Site-scoped vault custodian; fitness sorting, physical counts, ledger adjustments, counterfeit seizure"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /vault-cash/fitness-batches + sort-results/settle/reopen (own site)"
      - "POST /vault-cash/reconciliations + count + escalate (own site)"
      - "POST /vault-cash/counterfeit-cases/{id}/seize (own site)"
    shared_operations: ["all GET endpoints (own site rows)", "POST /vault-cash/counterfeit-cases", "POST /vault-cash/cash-ledger-entries (own site)", "POST /vault-cash/reconciliations/{id}/lock (SoD)"]
  - name: FedCoordinator
    description: "Site-scoped Federal Reserve ordering desk; order lifecycle, advices, shipment scheduling/loading"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /vault-cash/fed-orders + lines + submit/recall/acknowledge/cancel/record-fed-advice (own site)"
      - "POST /vault-cash/cash-shipments + load + cancel (own site)"
    shared_operations: ["all GET endpoints (own site rows)"]
  - name: CarrierDispatcher
    description: "Armored carrier dispatcher; departs and verifies own carrier's shipments"
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /vault-cash/cash-shipments/{id}/depart (own carrier)"
      - "POST /vault-cash/cash-shipments/{id}/verify (own carrier)"
    shared_operations: ["GET shipment/site reads"]
  - name: AtmAnalyst
    description: "Site-scoped ATM cash analyst; forecasting, loads, settlement, service toggles"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /vault-cash/atm-forecasts + publish/load/settle (own site)"
    shared_operations: ["all GET endpoints (own site rows)", "POST /vault-cash/atm-machines/{id}/set-service-status (own site)"]
  - name: ComplianceOfficer
    description: "Site-scoped compliance; counterfeit reporting/release/settlement with segregation from the seizer"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /vault-cash/counterfeit-cases/{id}/report (own site, != seizer)"
      - "POST /vault-cash/counterfeit-cases/{id}/release (own site, != seizer)"
      - "POST /vault-cash/counterfeit-cases/{id}/settle (own site)"
    shared_operations: ["all GET endpoints (own site rows)", "POST /vault-cash/counterfeit-cases"]
