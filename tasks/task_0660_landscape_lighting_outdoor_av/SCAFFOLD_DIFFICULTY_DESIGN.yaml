              payload: { project_id: "${proj_x7a}", model_code: "PATH-3W", category: "PATH", wattage_w: 3, purchase_price_cents: 4000 }
              as: LightingDesigner
              captures: { fx_x7a: $.data.id }
            - call: "POST /fixtures/${fx_x7a}/assign-zone"
