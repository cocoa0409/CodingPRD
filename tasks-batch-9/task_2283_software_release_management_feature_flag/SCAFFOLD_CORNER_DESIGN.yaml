          assert:
            - "HTTP 200 with evaluated_count == 4, warning_count == 1, overdue_count == 1, enforced_count == 1"
            - "paused_flag_count == 0, voided_step_count == 0 and aborted_step_count == 0 because no flag was rolling out"
            - "FeatureFlag.${f_enf}.stale_debt_points == 60 and cleanup_state == ENFORCED"
            - "FeatureFlag.${f_ovd}.stale_debt_points == 30 and cleanup_state == OVERDUE"
            - "FeatureFlag.${f_wrn}.stale_debt_points == 27 and cleanup_state == WARNING"
            - "FeatureFlag.${f_perm}.stale_debt_points == 0 and cleanup_state == COMPLIANT"
            - "All four flags report last_sweep_at == 2026-08-01T00:00:00Z"
            - "All four flags remain in state DRAFT"

