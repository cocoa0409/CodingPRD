              payload: { quote_id: "${qp}", expected_cycle_version: "${cy_v}" }
              as: ProcurementOfficer
              captures: { err_paid: $.data.error_id }
            - call: "GET /adoption-cycles/${cy_id}"
              as: ProcurementOfficer
              captures: { cy_v2: $.data.version }
            - call: "POST /adoption-cycles/${cy_id}/award"
              payload: { quote_id: "${qf1}", expected_cycle_version: "${cy_v2}" }
              as: ProcurementOfficer
          assert:
            - "awarding PAID fails: error_id == ERR_QUOTE_NOT_AWARD_WINNER (min_total == 0 branch flattens all price_scores to 100, so 67.50 < 100.00)"
            - "awarding FREE1 succeeds; Quote.${qf1}.best_value_score == 100.00, Quote.${qp}.best_value_score == 67.50, Quote.${qf2}.best_value_score == 50.00"
            - "Quote.${qf1}.status == SELECTED; Quote.${qf2}.status == REJECTED; Quote.${qp}.status == REJECTED"

      - name: forecast_contingency_tier_order
        grounds:
          - calculations.budget_forecast
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the contingency tier is keyed on the total being
          computed; the scaffold pins the evaluation order (round base -> select tier by rounded
          base -> multiply and round). Enrollment 4000 yields base 480000.00 in the 0.08 tier and
          forecast_total 518400.00; an empty-history STRAIGHT_LINE read yields 0.00 in the 0.05 tier.
          Distinct mode from quote_line_rounding_order (b) and best_value_zero_min_pool (a).
        test_recipe:
          setup:
            - "Fresh cycle with district_enrollment 4000 and no other cycles in ACTIVE/SUNSET (empty forecast history)"
          setup_api_calls:
            - call: "POST /frameworks"
              payload: { code: "FW-MATH-K5", subject_area: MATHEMATICS, grade_band: K_5, standards_required_count: 1, effective_year: 2026 }
              as: DistrictAdmin
              captures: { fw_id: $.data.id }
