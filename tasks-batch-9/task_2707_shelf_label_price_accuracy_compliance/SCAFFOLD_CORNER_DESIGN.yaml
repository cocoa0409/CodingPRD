              captures: { claim_c: $.data.id, amt_c: $.data.claimed_amount_cents, pol_c: $.data.policy_applied }
            - call: "PATCH /price-integrity/jurisdictions/${jur_a}"
              payload: { refund_cap_cents: 6000 }
              as: PricingAdmin
            - call: "POST /price-integrity/refund-claims"
              payload: { scan_line_id: "${sl_d}", customer_ref: "CUST-D", expected_scanner_audit_version: "${audit_v}" }
              as: CustomerServiceDesk
              captures: { claim_d: $.data.id, amt_d: $.data.claimed_amount_cents, pol_d: $.data.policy_applied }
          assert:
            - "REFUND_DIFFERENCE_ONLY: ${amt_a} == 199 (1199 - 1000) and ${pol_a} == REFUND_DIFFERENCE_ONLY — the 500c bonus is configured but unused"
            - "REFUND_DIFFERENCE_PLUS_FIXED: ${amt_b} == 699 (199 + 500) and ${pol_b} == REFUND_DIFFERENCE_PLUS_FIXED"
            - "ITEM_FREE_UP_TO_CAP under a 5000 cap: ${amt_c} == 5000, not 6000 and not the 2000 variance, and ${pol_c} == ITEM_FREE_UP_TO_CAP"
            - "ITEM_FREE_UP_TO_CAP under a 6000 cap: ${amt_d} == 6000 — gross exactly equal to the cap is paid in full (min is inclusive)"
            - "ScannerAudit.${audit_1}.version is still ${audit_v} after all four claims — claim creation does not advance the audit, which is why one captured version served every call"
            - "RefundClaim.${claim_a}.claimed_amount_cents is still 199 after the two PATCHes — the policy is frozen at creation, not re-derived on read"
            - "Store.${store_a}.refund_liability_outstanding_cents == 0 while all four claims are PENDING (liability accrues on APPROVED, not on PENDING)"

      - name: corner_waiving_a_finding_shrinks_the_considered_set_and_drops_the_tier
        claim_type: input_set_filtering
        grounds:
          - calculations.penalty_exposure
          - state_machines.InspectionFinding.OPEN_to_WAIVED
          - entities.InspectionFinding.fields.penalty_component_cents
        distinguishing_aspect: "penalty_exposure re-runs on every OPEN -> WAIVED transition over `considered` = findings with status != WAIVED, so waiving the cheapest finding cuts the count from 3 to 2 and drops tier_multiplier from 125 to 100 — the exposure falls by far more than the waived finding's own component."
        test_recipe:
          setup:
            - "A CLOSED PASS audit (one MATCH scan line) so no FAIL aggravator is in play; jurisdiction penalty_per_violation_cents 5000, penalty_max_cents 2000000."
            - "An inspection with three findings: MAJOR/4 items, MAJOR/4 items, MINOR/1 item."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California", scanner_error_rate_threshold_pct: 2.0, penalty_per_violation_cents: 5000, penalty_max_cents: 2000000 }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/aisles"
              payload: { aisle_code: "A01", category_code: "DAIRY" }
              as: PricingAdmin
              captures: { aisle_a1: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-PA1", full_name: "Pat Auditor", role_code: "PRICE_AUDITOR" }
              as: PricingAdmin
              captures: { pa1: $.data.id }
            - call: "POST /price-integrity/associates/${pa1}/training-completions"
              payload: { module_code: "AUDIT_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/scanner-audits"
              payload: { store_id: "${store_a}", aisle_id: "${aisle_a1}", auditor_associate_id: "${pa1}", audit_type: "COMPLAINT", scan_window_start: "2026-08-01T09:00:00Z", scan_window_end: "2026-08-01T10:00:00Z" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { audit_1: $.data.id }
            - call: "POST /price-integrity/scanner-audits/${audit_1}/scan-lines"
              payload: { item_upc: "00000000002001", shelf_price_cents: 500, register_price_cents: 500 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_1}/close"
              payload: { rate_variant: "GROSS_MISMATCH" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { audit_out: $.data.outcome }
            - call: "POST /price-integrity/regulatory-inspections"
              payload: { store_id: "${store_a}", scanner_audit_id: "${audit_1}", inspector_ref: "INS-88", inspection_date: "2026-08-01T16:00:00Z" }
              as: ComplianceOfficer
              captures: { insp_1: $.data.id }
          trigger:
            - call: "POST /price-integrity/regulatory-inspections/${insp_1}/issue-findings"
              payload: { findings: [{ finding_code: "SHELF_TAG_MISMATCH", severity: "MAJOR", affected_item_count: 4 }, { finding_code: "SCANNER_ERROR_RATE", severity: "MAJOR", affected_item_count: 4 }, { finding_code: "UNIT_PRICE_FORMAT", severity: "MINOR", affected_item_count: 1 }] }
              as: ComplianceOfficer
              captures: { pen_3: $.data.penalty_exposure_cents, fc: $.data.finding_count }
            - call: "GET /price-integrity/regulatory-inspections/${insp_1}/findings"
              as: ComplianceOfficer
              captures: { f1: "$.data[0].id", f2: "$.data[1].id", f3: "$.data[2].id", f3_comp: "$.data[2].penalty_component_cents" }
            - call: "POST /price-integrity/inspection-findings/${f3}/transition"
              payload: { target_status: "WAIVED", waiver_reason: "Formatting fixed while the inspector watched" }
              as: ComplianceOfficer
            - call: "GET /price-integrity/regulatory-inspections/${insp_1}"
              as: ComplianceOfficer
              captures: { pen_2: $.data.penalty_exposure_cents }
            - call: "GET /price-integrity/inspection-findings/${f3}"
              as: ComplianceOfficer
              captures: { f3_comp_after: $.data.penalty_component_cents, f3_status: $.data.status }
          assert:
            - "${audit_out} == PASS (0.00 < 2.0), so audit_aggravator == 0 throughout and the tier is the only moving part"
            - "${fc} == 3 and ${pen_3} == 156250 == FLOOR((3*5000*4 + 3*5000*4 + 1*5000*1) * 125 / 100) — n == 3 selects tier_multiplier 125"
            - "${f3_comp} == 5000 before the waiver (1 * 5000 * min(1, 10))"
            - "${pen_2} == 120000 == FLOOR((60000 + 60000) * 100 / 100) — n drops to 2, so the tier drops to 100 and the exposure falls by 36250, not by the waived 5000"
            - "${f3_status} == WAIVED and ${f3_comp_after} == 0 — the waived finding's component is zeroed, not merely excluded from the sum"
            - "InspectionFinding.${f1}.penalty_component_cents == 60000 and InspectionFinding.${f2}.penalty_component_cents == 60000 — surviving components are untouched by the tier change"

