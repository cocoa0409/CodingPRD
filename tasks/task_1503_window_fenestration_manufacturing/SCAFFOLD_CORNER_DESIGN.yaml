      - name: plant_manager_superset_runs_wave_and_catalog_ops
        claim_type: satisfaction_pass
        grounds:
          - roles.PlantManager
        distinguishing_aspect: "Hierarchical override: PlantManager performs PlantEngineer's catalog create and ProductionLead's wave create+open without denial."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /fenestration/catalog-series", payload: { series_code: "V200", frame_material: "VINYL", base_rate_cents_per_ui: 1500, min_billable_sqft: 3.0, max_united_inches: 120, special_shape_upcharge_pct: 40, lead_time_standard_days: 10, lead_time_special_shape_days: 25, frame_warranty_years: 20 }, as: PlantManager, captures: { s: $.data.id } }
            - { call: "POST /fenestration/production-waves", payload: { wave_date: "2026-09-01T00:00:00Z", capacity_units: 10, capacity_glass_sqft: 500 }, as: PlantManager, captures: { w: $.data.id } }
            - { call: "POST /fenestration/production-waves/${w}/open", as: PlantManager, captures: { st: $.data.status } }
          assert: ["All three calls succeed (201/200); wave status OPEN"]

  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_wave_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[wave-assignment-stale-wave]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC loser: two confirmed orders, one OPEN wave. Assign A with version N succeeds (bumps to N+1); assign B still carrying expected_wave_version N -> 412 ERR_STALE_VERSION even though capacity remains."
        test_recipe:
          setup: ["MN rule, V200, GP1, dealer; confirmed orders A qty1 and B qty1; wave cap 10 OPEN"]
          setup_api_calls:
            - { call: "POST /fenestration/energy-code-rules", payload: { state_code: "MN", max_u_factor: 0.30, max_shgc: 0.55, effective_from: "2025-01-01T00:00:00Z" }, as: PlantEngineer }
            - { call: "POST /fenestration/catalog-series", payload: { series_code: "V200", frame_material: "VINYL", base_rate_cents_per_ui: 1500, min_billable_sqft: 3.0, max_united_inches: 120, special_shape_upcharge_pct: 40, lead_time_standard_days: 10, lead_time_special_shape_days: 25, frame_warranty_years: 20 }, as: PlantEngineer, captures: { v200: $.data.id } }
            - { call: "POST /fenestration/glass-packages", payload: { code: "LP2-ARG", pane_count: 2, spacer_type: "ALUMINUM", argon_target_pct: 95, argon_min_pct: 90, catalog_u_factor: 0.28, catalog_shgc: 0.40, price_per_sqft_cents: 900, ig_warranty_years: 20 }, as: PlantEngineer, captures: { gp1: $.data.id } }
            - { call: "POST /fenestration/dealers", payload: { name: "NorthStar", ship_to_state_code: "MN" }, as: PlantManager, captures: { dealer: $.data.id } }
            - { call: "POST /fenestration/orders", payload: { dealer_id: "${dealer}", order_date: "2026-08-02T00:00:00Z" }, as: PlantManager, captures: { ordA: $.data.id } }
            - { call: "POST /fenestration/orders/${ordA}/lines", payload: { series_id: "${v200}", glass_package_id: "${gp1}", shape: "RECTANGLE", width_in: 40, height_in: 60, quantity: 1, grid_style: "NONE", hardware_finish: "STANDARD" }, as: PlantManager }
            - { call: "POST /fenestration/orders/${ordA}/confirm", as: PlantManager }
            - { call: "POST /fenestration/orders", payload: { dealer_id: "${dealer}", order_date: "2026-08-02T00:00:00Z" }, as: PlantManager, captures: { ordB: $.data.id } }
            - { call: "POST /fenestration/orders/${ordB}/lines", payload: { series_id: "${v200}", glass_package_id: "${gp1}", shape: "RECTANGLE", width_in: 40, height_in: 60, quantity: 1, grid_style: "NONE", hardware_finish: "STANDARD" }, as: PlantManager }
            - { call: "POST /fenestration/orders/${ordB}/confirm", as: PlantManager }
            - { call: "POST /fenestration/production-waves", payload: { wave_date: "2026-09-01T00:00:00Z", capacity_units: 10, capacity_glass_sqft: 500 }, as: ProductionLead, captures: { wave: $.data.id } }
            - { call: "POST /fenestration/production-waves/${wave}/open", as: ProductionLead }
            - { call: "GET /fenestration/production-waves/${wave}", as: ProductionLead, captures: { wv: $.data.version } }
            - { call: "POST /fenestration/production-waves/${wave}/assignments", payload: { order_id: "${ordA}", expected_wave_version: "${wv}" }, as: ProductionLead, captures: { vAfter: $.data.version } }
          trigger:
            - { call: "POST /fenestration/production-waves/${wave}/assignments", payload: { order_id: "${ordB}", expected_wave_version: "${wv}" }, as: ProductionLead, captures: { err: $.data.error_id } }
          assert:
            - "Assign A bumped wave version (${vAfter} == ${wv} + 1)"
            - "Assign B with the stale ${wv}: http 412 error_id == ERR_STALE_VERSION"
            - "Order B stays CONFIRMED; wave.allocated_units == 1"

      - name: stale_order_version_on_patch_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[order-line-edit-stale-order]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on WindowOrder.version for line edits: first PATCH with version N succeeds (bumps order to N+1 and reprices); second PATCH replaying version N -> 412 even though the line is still legitimately editable (order still DRAFT)."
        test_recipe:
          setup: ["MN rule, V200, GP1, dealer; DRAFT order with one line"]
          setup_api_calls:
            - { call: "POST /fenestration/energy-code-rules", payload: { state_code: "MN", max_u_factor: 0.30, max_shgc: 0.55, effective_from: "2025-01-01T00:00:00Z" }, as: PlantEngineer }
            - { call: "POST /fenestration/catalog-series", payload: { series_code: "V200", frame_material: "VINYL", base_rate_cents_per_ui: 1500, min_billable_sqft: 3.0, max_united_inches: 120, special_shape_upcharge_pct: 40, lead_time_standard_days: 10, lead_time_special_shape_days: 25, frame_warranty_years: 20 }, as: PlantEngineer, captures: { v200: $.data.id } }
            - { call: "POST /fenestration/glass-packages", payload: { code: "LP2-ARG", pane_count: 2, spacer_type: "ALUMINUM", argon_target_pct: 95, argon_min_pct: 90, catalog_u_factor: 0.28, catalog_shgc: 0.40, price_per_sqft_cents: 900, ig_warranty_years: 20 }, as: PlantEngineer, captures: { gp1: $.data.id } }
            - { call: "POST /fenestration/dealers", payload: { name: "NorthStar", ship_to_state_code: "MN" }, as: PlantManager, captures: { dealer: $.data.id } }
            - { call: "POST /fenestration/orders", payload: { dealer_id: "${dealer}", order_date: "2026-08-02T00:00:00Z" }, as: PlantManager, captures: { ord: $.data.id } }
            - { call: "POST /fenestration/orders/${ord}/lines", payload: { series_id: "${v200}", glass_package_id: "${gp1}", shape: "RECTANGLE", width_in: 40, height_in: 60, quantity: 1, grid_style: "NONE", hardware_finish: "STANDARD" }, as: PlantManager, captures: { line: $.data.id } }
            - { call: "GET /fenestration/orders/${ord}", as: PlantManager, captures: { ov: $.data.version } }
          trigger:
            - { call: "PATCH /fenestration/orders/${ord}/lines/${line}", payload: { expected_order_version: "${ov}", quantity: 2 }, as: PlantManager, captures: { t: $.data.line_total_cents } }
            - { call: "PATCH /fenestration/orders/${ord}/lines/${line}", payload: { expected_order_version: "${ov}", quantity: 3 }, as: PlantManager, captures: { err: $.data.error_id } }
            - { call: "GET /fenestration/orders/${ord}", as: PlantManager, captures: { ov2: $.data.version } }
          assert:
            - "First PATCH succeeds: line_total_cents == 330006 (repriced 165003 x 2)"
            - "Second PATCH with the same (now stale) version: http 412 error_id == ERR_STALE_VERSION"
            - "Order version advanced exactly once (${ov2} == ${ov} + 1)"

      - name: cascading_side_effects_layer
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        distinguishing_aspect: "N-level cascade coverage."
        excluded_because:
          difficulty_instance: breakage_cascade_depth3_unlocks_wave
          rationale: "Depth-3 breakage cascade (unit -> line -> wave allocation -> wave auto-unlock) asserted end-to-end there."

      - name: dual_variant_layer
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        distinguishing_aspect: "Dual-variant layer coverage."
        excluded_because:
          difficulty_instance: warranty_component_vs_whole_unit_coverage_divergence
          rationale: "Both variants computed and asserted (100 vs 40) there; NFRC variant pair asserted in nfrc_provisional_vs_certified_rating_divergence."

      - name: rate_threshold_layer
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
        distinguishing_aspect: "Threshold trigger layer coverage."
        excluded_because:
          difficulty_instance: argon_min_boundary_90_passes_89_breaks
          rationale: "Inclusive QC threshold exercised at 90 (pass) and 89 (break + remake cascade) there."

  - section: consistency_model
    instances:
      - name: computed_fields_immediate_in_create_response
        claim_type: immediate
        grounds:
          - consistency_model
          - entities.ProductionWave.fields.allocated_units
        distinguishing_aspect: "Immediate consistency: the wave create response itself carries computed fields (allocated_units 0, allocated_glass_sqft 0.0, status PLANNED, version 1) — no re-read needed."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /fenestration/production-waves", payload: { wave_date: "2026-09-01T00:00:00Z", capacity_units: 10, capacity_glass_sqft: 500 }, as: ProductionLead, captures: { au: $.data.allocated_units, ag: $.data.allocated_glass_sqft, st: $.data.status, v: $.data.version } }
          assert:
            - "Create response includes allocated_units == 0, allocated_glass_sqft == 0.0, status == PLANNED, version == 1"

      - name: confirm_response_contains_frozen_totals
        claim_type: immediate
        grounds:
          - consistency_model
          - entities.WindowOrder.fields.total_price_cents
        distinguishing_aspect: "Frozen totals visible in the confirm response itself."
        excluded_because:
          difficulty_instance: volume_discount_tier_keyed_on_prediscount_subtotal
          rationale: "That instance captures subtotal/discount/total directly from the confirm response body — proving same-request visibility."
