              payload: { reason: "no such fine" }
              as: Resident
              as_user_id: "00000000-0000-4000-8000-000000000910"
          assert:
            - "HTTP 404 with error_id == 'ERR_FINE_NOT_FOUND'"

      - name: accept_of_an_unknown_route_returns_route_not_found
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_ROUTE_NOT_FOUND]
        distinguishing_aspect: "A Valet accepting a nonexistent route id gets HTTP 404 ERR_ROUTE_NOT_FOUND, not the ownership 403 that a real route belonging to another valet would produce."
        test_recipe:
          setup:
            - "An empty database apart from the logical clock"
