  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: deposit_submission_gated_on_payroll_run_settlement
        grounds:
          - state_machines.TaxDeposit.SCHEDULED_to_SUBMITTED
          - state_machines.PayrollRun.IMPOUNDED_to_SETTLED
          - errors.ERR_FUNDS_NOT_SETTLED
        distinguishing_aspect: |
          Entity pair TaxDeposit -> PayrollRun: the deposit's SCHEDULED ->
          SUBMITTED transition is legal only while the backing run is
          SETTLED. While the run is IMPOUNDED (impound PENDING), submission
          fails with ERR_FUNDS_NOT_SETTLED; after the impound settles, the
          same call succeeds with no change to the deposit row itself.
        test_recipe:
          setup:
            - "Clock at default. FED-941 SEMIWEEKLY. Client ACTIVE, VERIFIED registration."
            - "Run IMPOUNDED (impound PENDING); deposit of 150000 SCHEDULED against the run."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "FED-941", name: "IRS Form 941", deposit_frequency: "SEMIWEEKLY", penalty_tier1_rate: 0.02, penalty_tier2_rate: 0.05, penalty_tier3_rate: 0.10, underpayment_threshold_cents: 250000 }
              as: BureauCompliance
              captures: { j_fed: $.data.id }
