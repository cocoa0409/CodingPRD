# =============================================================================
# task_2293 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7. Sections and claim_type values are taken from
# references/claim-extraction-guide.md; corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted as excluded_because stubs.
# Logical clock is pinned to 2026-08-01T00:00:00Z in every chain.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: audit_project_creation_returns_declared_defaults_and_version_one
        claim_type: creation
        grounds: [entities.AuditProject, "endpoints[POST /audit-projects]", response_envelope]
        distinguishing_aspect: "A freshly created engagement must expose every computed roll-up already initialized (posture OPEN, all four ledgers 0) and version 1 inside the success envelope; a partial response or a null ledger fails."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
          trigger:
            - call: "POST /audit-projects"
              payload: { name: "FY26 Classification Audit", fiscal_year: 2026, lookback_policy: "STANDARD_2Y" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { proj_id: $.data.id }
          assert:
            - "response status is 201 and the body carries the success envelope with a data object"
            - "AuditProject.${proj_id}.status == PLANNING"
            - "AuditProject.${proj_id}.remediation_posture == OPEN"
            - "AuditProject.${proj_id}.open_misclassified_headcount == 0"
            - "AuditProject.${proj_id}.total_back_wage_exposure_cents == 0"
            - "AuditProject.${proj_id}.converted_annual_payroll_delta_cents == 0"
            - "AuditProject.${proj_id}.committed_correction_cents == 0"
            - "AuditProject.${proj_id}.version == 1"
            - "AuditProject.${proj_id}.id is a bare UUID with no type prefix, and created_at and updated_at are ISO 8601 UTC with three fractional digits"

      - name: audit_project_retrieval_returns_the_stored_row_unchanged
        claim_type: retrieval
        grounds: ["endpoints[GET /audit-projects/{id}]", entities.AuditProject.fields.lookback_policy]
        distinguishing_aspect: "A read must not mutate: version stays 1 and updated_at is unchanged after two consecutive GETs, and the enum lookback_policy round-trips as WILLFUL_3Y rather than being normalized to the default."
        test_recipe:
          setup:
            - "One AuditProject created with lookback_policy WILLFUL_3Y at clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /audit-projects"
              payload: { name: "FY26 Classification Audit", fiscal_year: 2026, lookback_policy: "WILLFUL_3Y" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { proj_id: $.data.id }
          trigger:
            - call: "GET /audit-projects/${proj_id}"
              payload: {}
              as: Auditor
              as_user_id: "aud-1"
          assert:
            - "response status is 200"
            - "AuditProject.${proj_id}.name == FY26 Classification Audit"
            - "AuditProject.${proj_id}.fiscal_year == 2026"
            - "AuditProject.${proj_id}.lookback_policy == WILLFUL_3Y"
            - "AuditProject.${proj_id}.status == PLANNING"
            - "AuditProject.${proj_id}.version == 1 after the read"

      - name: positions_listing_under_a_family_reports_total_count_and_has_more
        claim_type: listing
        grounds: ["endpoints[GET /job-families/{id}/positions]", response_envelope]
        distinguishing_aspect: "Pagination metadata must describe the whole collection, not the page: with three Positions and limit 2 the first page carries total_count 3 and has_more true, and offset 2 carries the remaining single row with has_more false."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; StateRule CA registered; one AuditProject in PLANNING with one JobFamily holding three Positions created in job_code order SS-301, SS-302, SS-303."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /state-rules"
              payload: { state_code: "CA", min_weekly_salary_cents: 132000, duties_test_variant: "QUANTITATIVE_50PCT", ic_test: "ABC", hce_shortcut_recognized: false, reclass_notice_days: 7 }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /audit-projects"
              payload: { name: "FY26 Classification Audit", fiscal_year: 2026, lookback_policy: "STANDARD_2Y" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { proj_id: $.data.id }
            - call: "POST /job-families"
              payload: { audit_project_id: "${proj_id}", name: "Operations Leadership", code: "OPS-LEAD" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { fam_id: $.data.id }
            - call: "POST /positions"
              payload: { job_family_id: "${fam_id}", title: "Supervisor One", job_code: "SS-301", current_fls_status: "EXEMPT", claimed_exemption_test: "EXECUTIVE", annual_salary_cents: 5500000, salary_basis: "SALARY", work_state_code: "CA", incumbent_count: 1, avg_weekly_hours: 42 }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /positions"
              payload: { job_family_id: "${fam_id}", title: "Supervisor Two", job_code: "SS-302", current_fls_status: "EXEMPT", claimed_exemption_test: "EXECUTIVE", annual_salary_cents: 5500000, salary_basis: "SALARY", work_state_code: "CA", incumbent_count: 1, avg_weekly_hours: 42 }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /positions"
              payload: { job_family_id: "${fam_id}", title: "Supervisor Three", job_code: "SS-303", current_fls_status: "EXEMPT", claimed_exemption_test: "EXECUTIVE", annual_salary_cents: 5500000, salary_basis: "SALARY", work_state_code: "CA", incumbent_count: 1, avg_weekly_hours: 42 }
              as: ProgramAdmin
              as_user_id: "pa-1"
          trigger:
            - call: "GET /job-families/${fam_id}/positions"
              payload: { limit: 2, offset: 0 }
              as: Auditor
              as_user_id: "aud-1"
            - call: "GET /job-families/${fam_id}/positions"
              payload: { limit: 2, offset: 2 }
              as: Auditor
              as_user_id: "aud-1"
          assert:
            - "the first page returns 200 with exactly 2 items, total_count 3 and has_more true"
            - "the second page returns 200 with exactly 1 item, total_count 3 and has_more false"
            - "the two pages together contain each of SS-301, SS-302 and SS-303 exactly once"
            - "ordering is by created_at ASC, so the first page holds SS-301 then SS-302"

      - name: position_get_with_unknown_id_returns_position_not_found
        claim_type: not_found
        grounds: ["errors[ERR_POSITION_NOT_FOUND]", "endpoints[GET /positions/{id}]"]
        distinguishing_aspect: "A syntactically valid but unknown UUID must produce the entity-specific 404 ERR_POSITION_NOT_FOUND, not a generic 400 or an empty 200 envelope."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; no Position rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
          trigger:
            - call: "GET /positions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "ca-1"
          assert:
            - "response status is 404 with error_id ERR_POSITION_NOT_FOUND"
            - "the body carries the error envelope and no data object"

      - name: position_create_missing_required_annual_salary_is_rejected
        claim_type: required_fields
        grounds: ["errors[ERR_INVALID_REQUEST]", "endpoints[POST /positions]", entities.Position.fields.annual_salary_cents]
        distinguishing_aspect: "annual_salary_cents has source input with no default, so omitting it must fail schema validation at priority 4 before any FK or business check runs; no Position row may be created."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; StateRule CA registered; one AuditProject with one JobFamily."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /state-rules"
              payload: { state_code: "CA", min_weekly_salary_cents: 132000, duties_test_variant: "QUANTITATIVE_50PCT", ic_test: "ABC", hce_shortcut_recognized: false, reclass_notice_days: 7 }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /audit-projects"
              payload: { name: "FY26 Classification Audit", fiscal_year: 2026, lookback_policy: "STANDARD_2Y" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { proj_id: $.data.id }
            - call: "POST /job-families"
              payload: { audit_project_id: "${proj_id}", name: "Operations Leadership", code: "OPS-LEAD" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { fam_id: $.data.id }
          trigger:
            - call: "POST /positions"
              payload: { job_family_id: "${fam_id}", title: "Shift Supervisor", job_code: "SS-100", current_fls_status: "EXEMPT", claimed_exemption_test: "EXECUTIVE", salary_basis: "SALARY", work_state_code: "CA", incumbent_count: 2, avg_weekly_hours: 47 }
              as: ProgramAdmin
              as_user_id: "pa-1"
          assert:
            - "response status is 400 with error_id ERR_INVALID_REQUEST"
            - "no Position row exists under JobFamily ${fam_id}"
            - "JobFamily.${fam_id}.family_headcount == 0 and risk_score == 0"

      - name: position_create_omitting_optional_flags_defaults_them_to_false
        claim_type: defaults
        grounds: [entities.Position.fields.requires_advanced_degree, entities.Position.fields.works_primarily_offsite, "endpoints[POST /positions]"]
        distinguishing_aspect: "Both booleans are optional inputs whose declared default is false; omitting them must materialize false rather than null, because exemption_test_evaluation branches on them and a null would silently pass the PROFESSIONAL duties gate."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; StateRule CA registered; one AuditProject with one JobFamily."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /state-rules"
              payload: { state_code: "CA", min_weekly_salary_cents: 132000, duties_test_variant: "QUANTITATIVE_50PCT", ic_test: "ABC", hce_shortcut_recognized: false, reclass_notice_days: 7 }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /audit-projects"
              payload: { name: "FY26 Classification Audit", fiscal_year: 2026, lookback_policy: "STANDARD_2Y" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { proj_id: $.data.id }
            - call: "POST /job-families"
              payload: { audit_project_id: "${proj_id}", name: "Operations Leadership", code: "OPS-LEAD" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { fam_id: $.data.id }
          trigger:
            - call: "POST /positions"
              payload: { job_family_id: "${fam_id}", title: "Shift Supervisor", job_code: "SS-100", current_fls_status: "EXEMPT", claimed_exemption_test: "EXECUTIVE", annual_salary_cents: 5500000, salary_basis: "SALARY", work_state_code: "CA", incumbent_count: 2, avg_weekly_hours: 47 }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { pos_id: $.data.id }
          assert:
            - "response status is 201"
            - "Position.${pos_id}.requires_advanced_degree == false"
            - "Position.${pos_id}.works_primarily_offsite == false"
            - "Position.${pos_id}.duties_validation_status == PENDING"
            - "Position.${pos_id}.classification_status == UNREVIEWED"
            - "Position.${pos_id}.overtime_eligible == false"
            - "Position.${pos_id}.self_reported_exempt_pct_override == null"

      - name: position_weekly_salary_is_recomputed_and_client_supplied_value_input_ignored
        claim_type: computed_fields
        grounds: [entities.Position.fields.weekly_salary_cents, calculations.exemption_test_evaluation]
        distinguishing_aspect: "weekly_salary_cents has source computed: a client-sent value of 999999 must be discarded and the field recomputed as floor(5500000 / 52) = 105769, which is also what the risk and exemption formulas must consume."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; StateRule CA registered; one AuditProject with one JobFamily."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /state-rules"
              payload: { state_code: "CA", min_weekly_salary_cents: 132000, duties_test_variant: "QUANTITATIVE_50PCT", ic_test: "ABC", hce_shortcut_recognized: false, reclass_notice_days: 7 }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /audit-projects"
              payload: { name: "FY26 Classification Audit", fiscal_year: 2026, lookback_policy: "STANDARD_2Y" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { proj_id: $.data.id }
            - call: "POST /job-families"
              payload: { audit_project_id: "${proj_id}", name: "Operations Leadership", code: "OPS-LEAD" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { fam_id: $.data.id }
          trigger:
            - call: "POST /positions"
              payload: { job_family_id: "${fam_id}", title: "Shift Supervisor", job_code: "SS-100", current_fls_status: "EXEMPT", claimed_exemption_test: "EXECUTIVE", annual_salary_cents: 5500000, salary_basis: "SALARY", work_state_code: "CA", incumbent_count: 2, avg_weekly_hours: 47, weekly_salary_cents: 999999, primary_duty_pct: 95.0, classification_status: "RECLASSIFIED" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { pos_id: $.data.id }
          assert:
            - "Position.${pos_id}.weekly_salary_cents == 105769 (floor division, not 105769.23 and not the supplied 999999)"
            - "Position.${pos_id}.primary_duty_pct == 0.0 (no DutyStatements, no attested interviews)"
            - "Position.${pos_id}.classification_status == UNREVIEWED (the supplied RECLASSIFIED is ignored)"
            - "Position.${pos_id}.validated_weekly_hours == 47"

      - name: audit_project_system_fields_are_server_minted_and_input_ignored
        claim_type: system_fields
        grounds: [entities.AuditProject.fields.status, entities.AuditProject, response_envelope]
        distinguishing_aspect: "id, created_at, updated_at, version and the system-sourced status must all be server-minted: supplying an id and status CLOSED in the body must not be honoured, and the project must still start at PLANNING with version 1."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
          trigger:
            - call: "POST /audit-projects"
              payload: { name: "FY26 Classification Audit", fiscal_year: 2026, lookback_policy: "STANDARD_2Y", id: "11111111-1111-4111-8111-111111111111", status: "CLOSED", version: 99 }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { proj_id: $.data.id }
          assert:
            - "AuditProject.${proj_id}.id != 11111111-1111-4111-8111-111111111111"
            - "AuditProject.${proj_id}.status == PLANNING"
            - "AuditProject.${proj_id}.version == 1"
            - "created_at and updated_at are equal on creation and were not taken from the request"

      - name: position_create_with_unknown_salary_basis_enum_is_rejected
        claim_type: type_constraints
        grounds: ["errors[ERR_INVALID_REQUEST]", entities.Position.fields.salary_basis]
        distinguishing_aspect: "salary_basis is a closed enum consumed by the salary leg of exemption_test_evaluation; an out-of-set value such as PIECE_RATE must be refused at priority 4 rather than stored and treated as the non-HOURLY branch."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; StateRule CA registered; one AuditProject with one JobFamily."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /state-rules"
              payload: { state_code: "CA", min_weekly_salary_cents: 132000, duties_test_variant: "QUANTITATIVE_50PCT", ic_test: "ABC", hce_shortcut_recognized: false, reclass_notice_days: 7 }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /audit-projects"
              payload: { name: "FY26 Classification Audit", fiscal_year: 2026, lookback_policy: "STANDARD_2Y" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { proj_id: $.data.id }
            - call: "POST /job-families"
              payload: { audit_project_id: "${proj_id}", name: "Operations Leadership", code: "OPS-LEAD" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { fam_id: $.data.id }
          trigger:
            - call: "POST /positions"
              payload: { job_family_id: "${fam_id}", title: "Shift Supervisor", job_code: "SS-100", current_fls_status: "EXEMPT", claimed_exemption_test: "EXECUTIVE", annual_salary_cents: 5500000, salary_basis: "PIECE_RATE", work_state_code: "CA", incumbent_count: 2, avg_weekly_hours: 47 }
              as: ProgramAdmin
              as_user_id: "pa-1"
          assert:
            - "response status is 400 with error_id ERR_INVALID_REQUEST"
            - "no Position row exists under JobFamily ${fam_id}"

      - name: reclassification_case_with_end_date_before_start_date_is_rejected
        claim_type: type_constraints
        grounds: ["errors[ERR_INVALID_REQUEST]", entities.ReclassificationCase.fields.effective_date, entities.ReclassificationCase.fields.effective_end_date]
        distinguishing_aspect: "A different constraint kind from the enum case: an ordering constraint between two input dates. effective_end_date 2026-09-30 before effective_date 2026-10-01 would make the closed window empty and break the separation and wave-capacity comparisons, so it must be refused at priority 4."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; StateRule CA registered; one AuditProject in PLANNING with one JobFamily and one Position."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /state-rules"
              payload: { state_code: "CA", min_weekly_salary_cents: 132000, duties_test_variant: "QUANTITATIVE_50PCT", ic_test: "ABC", hce_shortcut_recognized: false, reclass_notice_days: 7 }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /audit-projects"
              payload: { name: "FY26 Classification Audit", fiscal_year: 2026, lookback_policy: "STANDARD_2Y" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { proj_id: $.data.id }
            - call: "POST /job-families"
              payload: { audit_project_id: "${proj_id}", name: "Operations Leadership", code: "OPS-LEAD" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { fam_id: $.data.id }
            - call: "POST /positions"
              payload: { job_family_id: "${fam_id}", title: "Shift Supervisor", job_code: "SS-100", current_fls_status: "EXEMPT", claimed_exemption_test: "EXECUTIVE", annual_salary_cents: 5500000, salary_basis: "SALARY", work_state_code: "CA", incumbent_count: 2, avg_weekly_hours: 47 }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { pos_id: $.data.id }
          trigger:
            - call: "POST /reclassification-cases"
              payload: { position_id: "${pos_id}", effective_date: "2026-10-01", effective_end_date: "2026-09-30", conversion_method: "SALARY_DIV_2080" }
              as: CompensationManager
              as_user_id: "cm-1"
          assert:
            - "response status is 400 with error_id ERR_INVALID_REQUEST"
            - "no ReclassificationCase row exists for Position ${pos_id}"
            - "error_id is NOT ERR_RECLASS_WINDOW_CONFLICT: schema validation precedes the temporal rules"

      - name: state_rule_is_immutable_with_no_version_field_and_no_update_endpoint
        claim_type: immutability
        grounds: [entities.StateRule, "endpoints[POST /state-rules]", "endpoints[GET /state-rules]"]
        distinguishing_aspect: "StateRule declares common_fields false, so it carries only id and created_at: no version, no updated_at, and §1.5 exposes no PATCH, PUT or DELETE for it. Jurisdiction rules are corrected by registering a new state_code, never by editing a row, which is why POST /state-rules declares no cascade onto existing analyses."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
          trigger:
            - call: "POST /state-rules"
              payload: { state_code: "NY", min_weekly_salary_cents: 124000, duties_test_variant: "STRICT_ENUM", ic_test: "COMMON_LAW", computer_exemption_recognized: false, hce_shortcut_recognized: false, liquidated_damages_multiplier: 2.0, reclass_notice_days: 21, back_wage_lookback_weeks_override: 312 }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { sr_id: $.data.id }
            - call: "GET /state-rules"
              payload: {}
              as: Auditor
              as_user_id: "aud-1"
          assert:
            - "response status is 201 and StateRule.${sr_id} exposes id and created_at but no version and no updated_at field"
            - "StateRule.${sr_id}.hce_annual_cents == 0 (declared default applied)"
            - "StateRule.${sr_id}.outside_sales_recognized == true (declared default applied)"
            - "StateRule.${sr_id}.computer_exemption_recognized == false"
            - "StateRule.${sr_id}.liquidated_damages_multiplier == 2.0 and back_wage_lookback_weeks_override == 312"
            - "the GET list returns exactly one row and §1.5 declares no PATCH, PUT or DELETE on /state-rules/{id}"

      - name: job_change_trigger_rows_are_append_only_audit_records
        claim_type: immutability
        grounds: [entities.JobChangeTrigger, "endpoints[POST /job-change-triggers]", "endpoints[GET /positions/{id}/job-change-triggers]"]
        distinguishing_aspect: "A second common_fields-false entity with a different reason: JobChangeTrigger is an append-only trigger log, so two triggers of the same type on the same Position both persist as separate rows rather than the second overwriting the first, and neither row carries version."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; StateRule CA registered; one AuditProject in PLANNING with one JobFamily and one Position whose annual_salary_cents is 5500000 (weekly 105769, below the CA floor 132000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
