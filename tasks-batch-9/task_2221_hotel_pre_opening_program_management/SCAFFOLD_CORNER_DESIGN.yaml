            - "pre_opening_days for every hire == 30 (2026-09-15 .. 2026-10-15 half-open)"
            - "trigger response status is 200"
            - "data.payroll_accrual_cents == 600000 (only the ACCEPTED hire: round_half_up(2500 * 8 * 30) = 600000)"
            - "the OFFERED hire contributes 0 even though 3000 * 8 * 30 = 720000"
            - "the WITHDRAWN hire contributes 0 even though 4000 * 8 * 30 = 960000"
            - "GET /pre-opening/hires/${hire_accepted} returns accrual_cents == 600000"
            - "GET /pre-opening/hires/${hire_offered} returns accrual_cents == 0"
            - "GET /pre-opening/hires/${hire_withdrawn} returns accrual_cents == 0"

      - name: test_run_below_fifty_percent_floor_drives_system_to_failed
        claim_type: constants_applied
        grounds:
          - "§1.3 system_test_aggregation declares FAILED_PASS_RATE_CEILING 0.50 and §1.2 PLANNED -> TESTING carries 'if latest_pass_rate < 0.50 then state -> FAILED instead of TESTING'; the FAILED -> TESTING recovery requires the new run's pass rate >= 0.50, so exactly 0.50 recovers."
        distinguishing_aspect: "A 16/40 run sits below FAILED_PASS_RATE_CEILING 0.5 and drives the system to FAILED, and the next 20/40 run at exactly 0.5 pulls it back to TESTING — the two constants 0.5 and 0.95 are read from different sides of the same latest run."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' (120 rooms, construction_start_date 2026-09-01, target_opening_date 2027-05-01, storage_capacity_pallets 40, room_night_ceiling 200, contingency_liability_cap_cents 50000000) in schedule_state PLANNING, commercial_state BOOKING_CLOSED, version 1."
            - "One required PMS SystemImplementation in state PLANNED with no test runs, latest_pass_rate null."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Cobalt Bay Hotel", brand_code: "CBH", room_count: 120, construction_start_date: "2026-09-01", target_opening_date: "2027-05-01", storage_capacity_pallets: 40, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 200, contingency_liability_cap_cents: 50000000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /pre-opening/system-implementations"
              payload: { program_id: "${prog_id}", system_type: "PMS", is_required: true }
              as: SystemsIntegrator
              as_user_id: "si-1"
              captures: { sys_pms: "$.data.id" }
          trigger:
            - call: "POST /pre-opening/system-implementations/${sys_pms}/test-runs"
              payload: { executed_at: "2026-09-01T09:00:00Z", cases_total: 10, cases_passed: 4, blocker_count: 0 }
              as: SystemsIntegrator
              as_user_id: "si-runner-1"
              captures: { run_low: "$.data.id" }
            - call: "POST /pre-opening/system-implementations/${sys_pms}/certify"
              payload: {}
              as: SystemsIntegrator
              as_user_id: "si-certifier-2"
              captures: { err_sys_state: "$.data.error_id" }
            - call: "POST /pre-opening/system-implementations/${sys_pms}/test-runs"
              payload: { executed_at: "2026-09-01T11:00:00Z", cases_total: 10, cases_passed: 5, blocker_count: 0 }
              as: SystemsIntegrator
              as_user_id: "si-runner-1"
              captures: { run_edge: "$.data.id" }
          assert:
            - "first trigger response status is 201"
            - "first trigger response data.pass_rate == 0.4"
            - "first trigger response data.result == 'FAILED'"
            - "GET /pre-opening/system-implementations/${sys_pms} after the first run returns state == 'FAILED' and latest_pass_rate == 0.4"
            - "second trigger response status is 409"
            - "second trigger response data.error_id == 'ERR_INVALID_SYSTEM_STATE'"
            - "third trigger response status is 201"
            - "third trigger response data.pass_rate == 0.5"
            - "GET /pre-opening/system-implementations/${sys_pms} after the third call returns state == 'TESTING' (0.50 is not below the 0.50 ceiling)"
            - "that same read returns latest_pass_rate == 0.5 and cumulative_pass_rate == 0.45 (9 / 20)"

      - name: readiness_score_rounded_half_up_to_four_decimals
        claim_type: precision
        grounds:
          - "§1.3 readiness_posture rounds the weighted sum with round_half_up to 4 decimal places and defines schedule_term = max(0.0, 1.0 - schedule_slip_days / 30.0); a 7-day slip yields 0.20 * (23/30) = 0.15333333..., which is not representable at 4 places without rounding."
        distinguishing_aspect: "target_opening_date 2026-10-08 against a 2026-10-15 projection gives schedule_slip_days 7 and a schedule_term of 0.7667 after half-up rounding to four places, so the weighted score is exactly 0.1533 and not 0.1532 or 0.1534."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' created with target_opening_date 2026-10-08 (all other inputs as declared defaults), still in PLANNING with no milestone, permit, system or plan."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Cobalt Bay Hotel", brand_code: "CBH", room_count: 120, construction_start_date: "2026-09-01", target_opening_date: "2026-10-08", storage_capacity_pallets: 40, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 200, contingency_liability_cap_cents: 50000000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: "$.data.id" }
          trigger:
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_id}", code: "CONSTRUCTION_COMPLETE", name: "Construction complete", duration_days: 30, planned_start_date: "2026-09-01" }
              as: ConstructionManager
              as_user_id: "cm-1"
              captures: { ms_cc: "$.data.id" }
            - call: "POST /pre-opening/programs/${prog_id}/baseline-schedule"
              payload: {}
              as: ProgramDirector
              as_user_id: "pd-baseline-1"
          assert:
            - "second trigger response status is 200"
            - "data.projected_opening_date_committed == '2026-10-15'"
            - "data.schedule_slip_days == 7 (2026-10-15 minus target_opening_date 2026-10-08)"
            - "data.readiness_score == 0.1533 (0.30*0.0 + 0.25*0.0 + 0.25*0.0 + 0.20*(1 - 7/30) = 0.15333333 rounded half up at 4 places)"
            - "data.readiness_posture == 'MOBILIZING' (slip 7 does not exceed slip_tolerance_days 10 and the score is below 0.85)"
            - "GET /pre-opening/programs/${prog_id}/readiness returns schedule_term == 0.7667 and readiness_score == 0.1533"

      - name: latest_run_selected_by_executed_at_not_insertion_order
        claim_type: chronological
        grounds:
          - "§1.3 system_test_aggregation orders runs by executed_at DESC then created_at DESC and states that id is never consulted, so a later-inserted run bearing an earlier executed_at must not become latest_run; cumulative_pass_rate still pools every run."
        distinguishing_aspect: "The 30/40 run is inserted last but carries the earlier executed_at, so latest_pass_rate must read 1.0 from the 2026-09-03 run while the cumulative figure stays 0.875 — insertion order and created_at must not decide the selection."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' (120 rooms, construction_start_date 2026-09-01, target_opening_date 2027-05-01, storage_capacity_pallets 40, room_night_ceiling 200, contingency_liability_cap_cents 50000000) in schedule_state PLANNING, commercial_state BOOKING_CLOSED, version 1."
            - "One required POS SystemImplementation with two runs: 40/40 executed_at 2026-09-03T09:00:00Z inserted first, then 30/40 executed_at 2026-09-01T09:00:00Z inserted second, both with blocker_count 0."
