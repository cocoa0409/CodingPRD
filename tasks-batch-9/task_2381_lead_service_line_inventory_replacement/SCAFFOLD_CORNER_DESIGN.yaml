      - name: rejected_batch_reopen_clears_every_persisted_statistic
        claim_type: cyclic
        grounds:
          - state_machines.SamplingBatch.OPEN_to_REJECTED
          - state_machines.SamplingBatch.REJECTED_to_OPEN
          - calculations.sampling_statistical_validation
        distinguishing_aspect: "Five samples 1.0/2.0/3.0/20.0/30.0 give rank ceil(0.90*5) = 5 -> percentile_90_ppb 30.0, exceedance_count 2, classification_confidence 0.6000 < 0.8000 -> REJECTED with rejection_reason CONFIDENCE_BELOW_FLOOR; the REJECTED branch carries no corrosion-control side effect, so cct_optimization_status stays NOT_REQUIRED; reopen then nulls percentile_90_ppb and classification_confidence, zeroes exceedance_count, sets reopen_count 1 and keeps all five samples."
