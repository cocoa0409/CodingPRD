          trigger:
            - call: "POST /land-origination/site-access-bookings"
              payload: { parcel_id: "${p_id}", purpose: "TITLE_SURVEY", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-10T00:00:00Z", crew_count: 1 }
