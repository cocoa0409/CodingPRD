            - "WeatherEvent.${wx_frost1_id}.status == CLEARED and WeatherEvent.${wx_rain_id}.status == CLEARED"

      - name: plan_commitment_matches_the_hand_computed_formula
        claim_type: correct_result
        grounds:
          - calculations.plan_nitrogen_commitment_lb
        excluded_because:
          difficulty_instance: combinatorial_formula / plan_ledger_rounds_per_task_then_sums_mode_b
          rationale: "That §1.8 instance computes the ledger from three fertility tasks by hand and asserts the round-per-task-then-sum value against the sum-then-round alternative."

      - name: water_posture_threshold_boundary
        claim_type: threshold
        grounds:
          - calculations.course_water_posture
        excluded_because:
          difficulty_instance: boundary_precision_check / water_posture_flips_at_exactly_eighty_percent_of_allocation
          rationale: "That §1.8 instance sits one gallon below, exactly on and one gallon above the 80 percent restricted threshold."

      - name: readiness_index_weights_and_rounding
        claim_type: weighted_scoring
        grounds:
          - calculations.tournament_readiness_index
        excluded_because:
          difficulty_instance: boundary_precision_check / certification_requires_the_third_measured_green_exactly
          rationale: "That §1.8 instance computes the per-green scores, the mean and the CERT_THRESHOLD comparison by hand for exactly three measured greens."

      - name: allotment_binding_constraint_selection
        claim_type: constraint_propagation
        grounds:
          - calculations.irrigation_run_allotment
        excluded_because:
          difficulty_instance: combinatorial_formula / irrigation_allotment_nested_min_switches_binding_constraint_mode_a
          rationale: "That §1.8 instance moves the binding term between demand, posture factor and pump headroom and asserts the allotment each time."

      - name: turf_load_aggregates_across_rows_and_reversals
        claim_type: aggregation
        grounds:
          - calculations.turf_nitrogen_load
        excluded_because:
          difficulty_instance: compensating_invariant / water_ledger_and_posture_unwind_exactly_on_run_reversal
          rationale: "That §1.8 instance is the aggregation-after-reversal claim for the ledger family: it asserts the running total returns to its pre-run value."

      - name: replacement_score_variants_diverge
        claim_type: variant_divergence
        grounds:
          - calculations.equipment_replacement_score
        excluded_because:
          difficulty_instance: dual_variant_calc / equipment_replacement_score_now_vs_fiscal_year_projection
          rationale: "That §1.8 instance asserts both variants and their delta from one set of engine hours."

      - name: applied_versus_projected_variant_selection
        claim_type: variant_selection
        grounds:
          - calculations.turf_nitrogen_load
        excluded_because:
          difficulty_instance: dual_variant_calc / turf_nitrogen_applied_actual_vs_planned_commitment
          rationale: "That §1.8 instance shows which variant each field selects: applied counts recorded rows only, projected adds the planned and scheduled fertility tasks."

