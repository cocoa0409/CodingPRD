    side_effects: []

  # ---------------- reads: policy ------------------------------------------
  - method: GET
    path: "/epli/policies/{policy_id}"
    description: "Fetch one policy by id, including both state axes (status, limit_posture), the sublimits and the current version used by the OCC field expected_policy_version."
    roles: [PlatformAdmin, Underwriter, UnderwritingManager, ClaimsAdjuster, ClaimsManager, PolicyholderContact]
    code: 200
    input: []
    output: Policy
    side_effects: []

  - method: GET
    path: "/epli/policies"
    description: "Paginated list of policies, ordered by effective_from ASC then created_at ASC. Filtered-list reverse-reachability channel for Policy.applicant_id and Policy.exposure_assessment_id."
    roles: [PlatformAdmin, Underwriter, UnderwritingManager, ClaimsAdjuster, ClaimsManager, PolicyholderContact]
    code: 200
    input: ["applicant_id?", "exposure_assessment_id?", "status?", "limit_posture?", "limit?", "offset?"]
    output: Policy[]
    side_effects: []

  - method: GET
    path: "/epli/policies/{policy_id}/limit-ledger"
    description: "Computed read: the policy's limit ledger in one object, reconciling the aggregate limit against indemnity and defense spend and reporting both sublimit remainders."
    roles: [PlatformAdmin, Underwriter, UnderwritingManager, ClaimsAdjuster, ClaimsManager]
    code: 200
    input: []
    output: "{ policy_id: string, aggregate_limit_cents: integer, indemnity_paid_cents: integer, defense_spend_cents: integer, aggregate_limit_remaining_cents: integer, wage_hour_sublimit_cents: integer, wage_hour_sublimit_remaining_cents: integer, third_party_sublimit_cents: integer, third_party_sublimit_remaining_cents: integer, limit_posture: string }"
    side_effects: []

  # ---------------- reads: claims ------------------------------------------
  - method: GET
    path: "/epli/claims/{claim_id}"
    description: "Fetch one claim by id, including coverage_bucket, retention_basis, per_claim_retention_cents, applied_retention_cents and the three ledger fields."
    roles: [PlatformAdmin, Underwriter, UnderwritingManager, ClaimsAdjuster, ClaimsManager, PanelCounsel]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/epli/claims"
    description: "Paginated list of claims, ordered by first_notice_at ASC then created_at ASC. Filtered-list reverse-reachability channel for Claim.policy_id, Claim.related_to_claim_id and Claim.related_claim_group_id."
    roles: [PlatformAdmin, Underwriter, UnderwritingManager, ClaimsAdjuster, ClaimsManager]
    code: 200
    input: ["policy_id?", "related_to_claim_id?", "related_claim_group_id?", "status?", "claim_type?", "coverage_bucket?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: GET
    path: "/epli/related-claim-groups/{group_id}"
    description: "Fetch one related-claim group by id, including member_count, shared_retention_cents, retention_basis_claim_id, retention_paid_cents and the version used by expected_related_claim_group_version."
    roles: [PlatformAdmin, Underwriter, UnderwritingManager, ClaimsAdjuster, ClaimsManager]
    code: 200
    input: []
    output: RelatedClaimGroup
    side_effects: []

  - method: GET
    path: "/epli/related-claim-groups"
    description: "Paginated list of related-claim groups, ordered by created_at ASC. Filtered-list reverse-reachability channel for RelatedClaimGroup.policy_id, lead_claim_id and retention_basis_claim_id."
    roles: [PlatformAdmin, Underwriter, UnderwritingManager, ClaimsAdjuster, ClaimsManager]
    code: 200
    input: ["policy_id?", "lead_claim_id?", "retention_basis_claim_id?", "status?", "aggregation_basis?", "limit?", "offset?"]
    output: RelatedClaimGroup[]
    side_effects: []

  - method: GET
    path: "/epli/pre-suit-resolutions/{resolution_id}"
    description: "Fetch one pre-suit resolution offer by id."
    roles: [PlatformAdmin, ClaimsAdjuster, ClaimsManager]
    code: 200
    input: []
    output: PreSuitResolution
    side_effects: []

  - method: GET
    path: "/epli/pre-suit-resolutions"
    description: "Paginated list of pre-suit resolution offers, ordered by created_at ASC. Filtered-list reverse-reachability channel for PreSuitResolution.claim_id."
    roles: [PlatformAdmin, ClaimsAdjuster, ClaimsManager]
    code: 200
    input: ["claim_id?", "status?", "limit?", "offset?"]
    output: PreSuitResolution[]
    side_effects: []

  - method: GET
    path: "/epli/indemnity-payments/{payment_id}"
    description: "Fetch one indemnity payment by id, including the frozen retention_portion_cents / insurer_portion_cents split and sublimit_bucket."
    roles: [PlatformAdmin, ClaimsAdjuster, ClaimsManager, UnderwritingManager]
    code: 200
    input: []
    output: IndemnityPayment
    side_effects: []

  - method: GET
    path: "/epli/indemnity-payments"
    description: "Paginated list of indemnity payments, ordered by created_at ASC. Filtered-list reverse-reachability channel for IndemnityPayment.claim_id."
    roles: [PlatformAdmin, ClaimsAdjuster, ClaimsManager, UnderwritingManager]
    code: 200
    input: ["claim_id?", "status?", "sublimit_bucket?", "limit?", "offset?"]
    output: IndemnityPayment[]
    side_effects: []

  # ---------------- reads: defense ----------------------------------------
  - method: GET
    path: "/epli/defense-assignments/{assignment_id}"
    description: "Fetch one defense assignment by id, including the snapshot rate schedule, budget_spent_cents / budget_remaining_cents and selection_reason."
    roles: [PlatformAdmin, ClaimsAdjuster, ClaimsManager, PanelCounsel]
    code: 200
    input: []
    output: DefenseAssignment
    side_effects: []

  - method: GET
    path: "/epli/defense-assignments"
    description: "Paginated list of defense assignments, ordered by engagement_from ASC then created_at ASC. Filtered-list reverse-reachability channel for DefenseAssignment.claim_id and DefenseAssignment.panel_firm_id."
    roles: [PlatformAdmin, ClaimsAdjuster, ClaimsManager, PanelCounsel]
    code: 200
    input: ["claim_id?", "panel_firm_id?", "status?", "limit?", "offset?"]
    output: DefenseAssignment[]
    side_effects: []

  - method: GET
    path: "/epli/defense-invoices/{invoice_id}"
    description: "Fetch one defense invoice by id, including every audit output field."
    roles: [PlatformAdmin, ClaimsAdjuster, ClaimsManager, PanelCounsel]
    code: 200
    input: []
    output: DefenseInvoice
    side_effects: []

  - method: GET
    path: "/epli/defense-invoices"
    description: "Paginated list of defense invoices, ordered by period_start ASC then created_at ASC. Filtered-list reverse-reachability channel for DefenseInvoice.defense_assignment_id."
    roles: [PlatformAdmin, ClaimsAdjuster, ClaimsManager, PanelCounsel]
    code: 200
    input: ["defense_assignment_id?", "status?", "limit?", "offset?"]
    output: DefenseInvoice[]
    side_effects: []

  # ---------------- writes: reference data & clock -------------------------
  - method: POST
    path: "/epli/jurisdictions"
    description: "Register a jurisdiction. `code` is globally unique."
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, hazard_tier, admin_agency_name, pre_suit_window_days, wage_hour_multiplier, class_action_propensity_pct, "pre_suit_mediation_required?"]
    output: Jurisdiction
    side_effects: []

  - method: POST
    path: "/epli/rate-plans"
    description: "Create a rate plan in DRAFT. `name` is globally unique."
    roles: [PlatformAdmin]
    code: 201
    input: [name, base_rate_per_employee_cents, min_premium_cents, wage_hour_sublimit_pct, third_party_sublimit_pct]
    output: RatePlan
    side_effects: []

  - method: POST
    path: "/epli/rate-plans/{rate_plan_id}/activate"
    description: "Transition a rate plan DRAFT -> ACTIVE, making it referenceable by new exposure assessments."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RatePlan
    side_effects: ["RatePlan.status becomes ACTIVE", "increments RatePlan.version by 1"]

  - method: POST
    path: "/epli/defense-panel-firms"
    description: "Add a firm to the defense panel in PANEL_ACTIVE. `name` is globally unique."
    roles: [PlatformAdmin]
    code: 201
    input: [name, tier, jurisdiction_codes, partner_rate_cents_per_hour, associate_rate_cents_per_hour, paralegal_rate_cents_per_hour, capacity_open_matters]
    output: DefensePanelFirm
    side_effects: ["computes DefensePanelFirm.blended_rate_cents via calculations.blended_rate", "open_matter_count starts at 0"]

  - method: POST
    path: "/epli/defense-panel-firms/{panel_firm_id}/suspend"
    description: "Transition a panel firm PANEL_ACTIVE -> PANEL_SUSPENDED. Existing assignments are untouched; the firm simply drops out of future eligibility pools."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: DefensePanelFirm
    side_effects: ["DefensePanelFirm.status becomes PANEL_SUSPENDED", "increments DefensePanelFirm.version by 1"]

  - method: POST
    path: "/epli/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. The logical clock defaults to 2026-08-01T00:00:00Z at server startup and MUST NOT fall back to wall-clock time. `to_iso8601` must be >= the current logical clock. Setting the clock evaluates every time-gated system transition: Policy BOUND -> ACTIVE, Policy {BOUND, ACTIVE, SUSPENDED} -> EXPIRED, RiskManagementService ACTIVE -> LAPSED and PreSuitResolution OFFERED -> LAPSED."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, activated_policy_ids: string[], expired_policy_ids: string[], lapsed_service_ids: string[], lapsed_resolution_ids: string[] }"
    side_effects:
      - "fires Policy BOUND -> ACTIVE for every policy whose effective_from <= new clock < effective_to"
      - "fires Policy -> EXPIRED for every non-EXPIRED policy whose effective_to <= new clock"
      - "fires RiskManagementService ACTIVE -> LAPSED for every service whose effective_to <= new clock, recomputing Applicant.risk_credit_pct / exposure_score and staling the applicant's PRICED assessments"
      - "fires PreSuitResolution OFFERED -> LAPSED for every offer whose offer_expires_at < new clock"

  # ---------------- writes: underwriting ----------------------------------
  - method: POST
    path: "/epli/applicants"
    description: "Register a prospective insured. The jurisdiction_headcounts allocation must sum to total_headcount and primary_jurisdiction_code must appear in it."
    roles: [Underwriter]
    code: 201
    input: [legal_name, total_headcount, prior_year_separations, jurisdiction_headcounts, primary_jurisdiction_code, "separations_since_assessment?"]
    output: Applicant
    side_effects: ["computes Applicant.turnover_pct, hazard_load_pct, risk_credit_pct (0.00 with no services) and exposure_score"]

  - method: PATCH
    path: "/epli/applicants/{applicant_id}"
    description: "Revise applicant exposure data. Supplying total_headcount, prior_year_separations, jurisdiction_headcounts or primary_jurisdiction_code stales the applicant's PRICED assessments; supplying ONLY separations_since_assessment does not."
    roles: [Underwriter]
    code: 200
    input: ["total_headcount?", "prior_year_separations?", "separations_since_assessment?", "jurisdiction_headcounts?", "primary_jurisdiction_code?"]
    output: Applicant
    side_effects:
      - "recomputes Applicant.turnover_pct, hazard_load_pct and exposure_score"
      - "increments Applicant.version by 1"
      - "when an assessment-relevant field changed, fires ExposureAssessment PRICED -> REFERRED with credit_basis_stale = true for every PRICED assessment of this applicant"

  - method: POST
    path: "/epli/applicants/{applicant_id}/risk-management-services"
    description: "Purchase a risk-management service (hotline subscription, handbook review or manager training) for the applicant. Created in PENDING; window conflicts with a non-REVOKED service of the same type are refused."
    roles: [Underwriter]
    code: 201
    input: [service_type, credit_pct, effective_from, effective_to]
    output: RiskManagementService
    side_effects: []

  - method: POST
    path: "/epli/risk-management-services/{service_id}/complete"
    description: "Transition a service PENDING -> ACTIVE, earning its premium credit and its exposure-score credit. The logical clock must be inside [effective_from, effective_to)."
    roles: [Underwriter]
    code: 200
    input: []
    output: RiskManagementService
    side_effects:
      - "sets completed_at to the logical clock instant"
      - "recomputes Applicant.risk_credit_pct and Applicant.exposure_score and increments Applicant.version by 1"
      - "fires ExposureAssessment PRICED -> REFERRED with credit_basis_stale = true for every PRICED assessment of this applicant"

  - method: POST
    path: "/epli/risk-management-services/{service_id}/revoke"
    description: "Transition a service PENDING|ACTIVE -> REVOKED, withdrawing its credits. Root of the depth-2 service -> applicant -> assessment cascade."
    roles: [Underwriter]
    code: 200
    input: [revocation_reason]
    output: RiskManagementService
    side_effects:
      - "recomputes Applicant.risk_credit_pct and Applicant.exposure_score and increments Applicant.version by 1"
      - "fires ExposureAssessment PRICED -> REFERRED with credit_basis_stale = true for every PRICED assessment of this applicant"

  - method: POST
    path: "/epli/exposure-assessments"
    description: "Open a DRAFT exposure assessment. OCC-guarded on the applicant: expected_applicant_version must equal Applicant.version. The referenced rate plan must be ACTIVE. Creating a new assessment supersedes the applicant's PRICED, REFERRED and APPROVED assessments."
    roles: [Underwriter]
    code: 201
    input: [applicant_id, rate_plan_id, requested_aggregate_limit_cents, requested_retention_cents, expected_applicant_version, "third_party_coverage_requested?"]
    output: ExposureAssessment
    side_effects:
      - "increments Applicant.version by 1"
      - "fires ExposureAssessment {PRICED, REFERRED, APPROVED} -> SUPERSEDED for every earlier assessment of this applicant"

  - method: POST
    path: "/epli/exposure-assessments/{assessment_id}/price"
    description: "Price the assessment with the QUOTE variant of calculations.indicated_premium. Lands on REFERRED when exposure_score_snapshot >= 72.00, on PRICED otherwise. Callable from DRAFT and from REFERRED (the revision loop)."
    roles: [Underwriter]
    code: 200
    input: []
    output: ExposureAssessment
    side_effects:
      - "sets exposure_score_snapshot, turnover_pct_snapshot and all six premium component fields plus indicated_premium_cents"
      - "sets priced_by_user_id = X-User-ID and credit_basis_stale = false"
      - "increments ExposureAssessment.version by 1"

  - method: POST
    path: "/epli/exposure-assessments/{assessment_id}/approve"
    description: "Release a PRICED or REFERRED assessment for binding. Four-eyes gate: X-User-ID must differ from priced_by_user_id. Refused while credit_basis_stale == true."
    roles: [UnderwritingManager]
    code: 200
    input: []
    output: ExposureAssessment
    side_effects: ["sets approved_by_user_id = X-User-ID", "status becomes APPROVED", "increments ExposureAssessment.version by 1"]

  - method: POST
    path: "/epli/exposure-assessments/{assessment_id}/reject"
    description: "Decline a PRICED or REFERRED assessment. Terminal."
    roles: [UnderwritingManager]
    code: 200
    input: [rejection_reason]
    output: ExposureAssessment
    side_effects: ["status becomes REJECTED", "increments ExposureAssessment.version by 1"]

  - method: POST
    path: "/epli/policies"
    description: "Bind an APPROVED assessment into a policy. Runs the BOUND_AUDIT variant of calculations.indicated_premium and records the variance against the quoted premium. Policy periods for one applicant may not overlap across non-EXPIRED policies."
    roles: [Underwriter]
    code: 201
    input: [exposure_assessment_id, effective_from, effective_to]
    output: Policy
    side_effects:
      - "copies applicant_id, aggregate_limit_cents, per_claim_retention_cents and third_party_coverage_elected from the assessment"
      - "computes wage_hour_sublimit_cents and third_party_sublimit_cents from the bound assessment's RatePlan percentages"
      - "computes bound_premium_cents (BOUND_AUDIT variant) and premium_variance_cents"
      - "fires ExposureAssessment APPROVED -> BOUND"
      - "immediately evaluates Policy BOUND -> ACTIVE against the logical clock"

  - method: POST
    path: "/epli/policies/{policy_id}/suspend"
    description: "Suspend an ACTIVE policy. Root of the depth-3 policy -> claim -> assignment -> invoice cascade."
    roles: [UnderwritingManager]
    code: 200
    input: [suspension_reason]
    output: Policy
    side_effects:
      - "status becomes SUSPENDED and suspended_at is set to the logical clock instant"
      - "sets coverage_gated = true on every claim of this policy in UNDER_REVIEW, COVERAGE_ACCEPTED or DEFENSE_OPEN"
      - "fires DefenseAssignment ACTIVE -> SUSPENDED_FUNDING with hold_reason = POLICY_SUSPENDED on those claims' assignments"
      - "sets hold_reason = POLICY_SUSPENDED on those assignments' SUBMITTED, UNDER_AUDIT and ADJUSTED invoices"
      - "increments Policy.version by 1"

  - method: POST
    path: "/epli/policies/{policy_id}/reinstate"
    description: "Return a SUSPENDED policy to ACTIVE, reversing every hop of the suspend cascade."
    roles: [UnderwritingManager]
    code: 200
    input: []
    output: Policy
    side_effects:
      - "status becomes ACTIVE; suspension_reason and suspended_at are cleared to null"
      - "clears coverage_gated on this policy's claims"
      - "fires DefenseAssignment SUSPENDED_FUNDING -> ACTIVE and clears hold_reason where hold_reason == POLICY_SUSPENDED"
      - "clears hold_reason == POLICY_SUSPENDED on the affected invoices"
      - "increments Policy.version by 1"

  # ---------------- writes: claims ----------------------------------------
  - method: POST
    path: "/epli/policies/{policy_id}/claims"
    description: "Report a claim against a policy. first_notice_at must fall in [effective_from, effective_to). A THIRD_PARTY-bucketed claim requires third_party_coverage_elected == true."
    roles: [ClaimsAdjuster]
    code: 201
    input: [claim_type, claimant_class, notice_type, first_notice_at, alleged_damages_cents, "claimant_count?", "related_to_claim_id?"]
    output: Claim
    side_effects: ["computes Claim.coverage_bucket via calculations.coverage_bucket", "retention_basis starts at PER_CLAIM"]

  - method: POST
    path: "/epli/claims/{claim_id}/start-review"
    description: "Transition a claim REPORTED -> UNDER_REVIEW. Requires the owning policy to be BOUND or ACTIVE and the claim not coverage_gated."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["increments Claim.version by 1"]

  - method: POST
    path: "/epli/claims/{claim_id}/coverage-decision"
    description: "Accept or deny coverage on an UNDER_REVIEW claim. `decision` is one of ACCEPT, DENY; denial_reason is required when decision == DENY and forbidden otherwise."
    roles: [ClaimsAdjuster]
    code: 200
    input: [decision, "denial_reason?"]
    output: Claim
    side_effects:
      - "on ACCEPT: status becomes COVERAGE_ACCEPTED and per_claim_retention_cents / applied_retention_cents are computed via calculations.claim_retention"
      - "on DENY: status becomes COVERAGE_DENIED, denial_reason is recorded and NO retention is computed"
      - "increments Claim.version by 1"

  - method: POST
    path: "/epli/claims/{claim_id}/close"
    description: "Close a COVERAGE_DENIED or RESOLVED claim, closing its open defense assignments."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "fires DefenseAssignment {ACTIVE, SUSPENDED_FUNDING} -> CLOSED on this claim"
      - "recomputes DefensePanelFirm.open_matter_count for each affected firm"
      - "increments Claim.version by 1"

  - method: POST
    path: "/epli/claims/{claim_id}/reopen"
    description: "Reopen a CLOSED claim back to UNDER_REVIEW. Permitted at most REOPEN_LIMIT = 1 time per claim."
    roles: [ClaimsManager]
    code: 200
    input: []
    output: Claim
    side_effects: ["increments Claim.reopen_count by 1", "increments Claim.version by 1"]

  - method: POST
    path: "/epli/related-claim-groups"
    description: "Open a related-claim group and attach its lead claim, aggregating retention across future members. The lead claim must belong to policy_id and must not already be grouped."
    roles: [ClaimsManager]
    code: 201
    input: [policy_id, lead_claim_id, aggregation_basis]
    output: RelatedClaimGroup
    side_effects:
      - "sets lead Claim.related_claim_group_id and flips lead Claim.retention_basis to GROUP_AGGREGATED with applied_retention_cents = 0"
      - "computes member_count, shared_retention_cents and retention_basis_claim_id"
      - "increments Claim.version by 1 for the lead claim"

  - method: POST
    path: "/epli/related-claim-groups/{group_id}/claims"
    description: "Attach another claim to the group. OCC-guarded on the group: expected_related_claim_group_version must equal RelatedClaimGroup.version. Refused when the claim already belongs to a group or its coverage_bucket violates the group's aggregation_basis."
    roles: [ClaimsManager]
    code: 200
    input: [claim_id, expected_related_claim_group_version]
    output: RelatedClaimGroup
    side_effects:
      - "sets the claim's related_claim_group_id, flips retention_basis to GROUP_AGGREGATED and sets applied_retention_cents = 0"
      - "re-derives member_count, shared_retention_cents and retention_basis_claim_id"
      - "increments RelatedClaimGroup.version by 1"
      - "increments Claim.version by 1 for the attached claim"

  - method: POST
    path: "/epli/claims/{claim_id}/pre-suit-resolutions"
    description: "Extend a pre-suit resolution offer on an administrative-charge claim. mediation_offered_at is the logical clock instant; offer_expires_at must be strictly later."
    roles: [ClaimsAdjuster]
    code: 201
    input: [offer_expires_at, settlement_offer_cents]
    output: PreSuitResolution
    side_effects: []

  - method: POST
    path: "/epli/pre-suit-resolutions/{resolution_id}/accept"
    description: "Accept a pre-suit resolution offer, earning the incentive credit against the claim's retention. Requires the claim's jurisdiction pre-suit window still open."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: PreSuitResolution
    side_effects:
      - "sets elapsed_days_at_accept and incentive_credit_cents via calculations.pre_suit_incentive_credit"
      - "adds incentive_credit_cents to Claim.pre_suit_credit_cents and recomputes Claim.applied_retention_cents"
      - "fires Claim {COVERAGE_ACCEPTED, DEFENSE_OPEN} -> RESOLVED"
      - "increments PreSuitResolution.version by 1"

  - method: POST
    path: "/epli/claims/{claim_id}/indemnity-payments"
    description: "Record a settlement or judgment payment on a claim in PENDING_APPROVAL. OCC-guarded on the policy: expected_policy_version must equal Policy.version. The retention / insurer split is computed and frozen here; limits are checked at approval."
    roles: [ClaimsAdjuster]
    code: 201
    input: [amount_cents, payment_basis, expected_policy_version]
    output: IndemnityPayment
    side_effects:
      - "computes retention_portion_cents and insurer_portion_cents via calculations.indemnity_waterfall"
      - "copies Claim.coverage_bucket into sublimit_bucket and sets created_by_user_id = X-User-ID"
      - "increments Policy.version by 1"

  - method: POST
    path: "/epli/indemnity-payments/{payment_id}/approve"
    description: "Approve a payment, debiting the retention, the applicable sublimit and the policy aggregate. Four-eyes gate: X-User-ID must differ from created_by_user_id. Root of the depth-4 payment -> claim -> policy -> assignment -> invoice cascade."
    roles: [ClaimsManager]
    code: 200
    input: []
    output: IndemnityPayment
    side_effects:
      - "sets approved_by_user_id = X-User-ID and status APPROVED"
      - "recomputes Claim.retention_satisfied_cents and Claim.indemnity_paid_cents and fires Claim -> RESOLVED"
      - "recomputes RelatedClaimGroup.retention_paid_cents and fires RelatedClaimGroup OPEN -> LOCKED when the shared retention is satisfied"
      - "recomputes Policy.indemnity_paid_cents, the applicable sublimit remaining and aggregate_limit_remaining_cents and advances Policy.limit_posture"
      - "on EXHAUSTED: closes every open DefenseAssignment on the policy with funding_ceased_at set, and rejects their SUBMITTED / UNDER_AUDIT / ADJUSTED invoices with hold_reason = LIMIT_EXHAUSTED"
      - "increments IndemnityPayment.version by 1"

  - method: POST
    path: "/epli/indemnity-payments/{payment_id}/void"
    description: "Void a PENDING_APPROVAL or APPROVED payment. Voiding an APPROVED payment restores exactly what it debited; the claim is NOT rolled back out of RESOLVED and cascade-closed assignments are NOT resurrected."
    roles: [ClaimsManager]
    code: 200
    input: [void_reason]
    output: IndemnityPayment
    side_effects:
      - "status becomes VOIDED and void_reason is recorded"
      - "restores Claim.retention_satisfied_cents by retention_portion_cents and Claim.indemnity_paid_cents by insurer_portion_cents"
      - "restores RelatedClaimGroup.retention_paid_cents and may fire LOCKED -> OPEN"
      - "restores Policy.indemnity_paid_cents, the applicable sublimit remaining and aggregate_limit_remaining_cents and may regress limit_posture"
      - "increments IndemnityPayment.version by 1"

  # ---------------- writes: defense ---------------------------------------
  - method: POST
    path: "/epli/claims/{claim_id}/defense-assignments"
    description: "Engage defense counsel on a COVERAGE_ACCEPTED or DEFENSE_OPEN claim. Omit panel_firm_id to run calculations.panel_firm_selection (selection_reason AUTO_SELECTED); supply it to direct the choice (CLIENT_DIRECTED), which is still subject to the eligibility filter. excluded_panel_firm_ids removes firms from the candidate pool."
    roles: [ClaimsAdjuster]
    code: 201
    input: [engagement_from, engagement_to, budget_cap_cents, "litigation_guideline_version?", "panel_firm_id?", "excluded_panel_firm_ids?"]
    output: DefenseAssignment
    side_effects:
      - "snapshots the firm's three hourly rates onto the assignment"
      - "sets selection_reason and increments DefensePanelFirm.open_matter_count by 1"
      - "fires Claim COVERAGE_ACCEPTED -> DEFENSE_OPEN on the first assignment"

  - method: POST
    path: "/epli/defense-assignments/{assignment_id}/close"
    description: "Close a defense assignment, freeing the firm's capacity."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: DefenseAssignment
    side_effects:
      - "status becomes CLOSED"
      - "recomputes DefensePanelFirm.open_matter_count for the assigned firm and increments DefensePanelFirm.version by 1"
      - "increments DefenseAssignment.version by 1"

  - method: POST
    path: "/epli/defense-assignments/{assignment_id}/invoices"
    description: "Panel counsel submits a billing invoice in SUBMITTED. Only the assigned firm's PanelCounsel principal may submit (else ERR_NOT_ASSIGNED_COUNSEL). The billing period must sit inside the engagement window and must not collide with an existing live invoice on the same assignment."
    roles: [PanelCounsel]
    code: 201
    input: [period_start, period_end, "partner_hours?", "associate_hours?", "paralegal_hours?", "block_billed_hours?", "expenses_cents?"]
    output: DefenseInvoice
    side_effects: []

  - method: POST
    path: "/epli/defense-invoices/{invoice_id}/audit"
    description: "Audit an invoice against the litigation guidelines, running calculations.defense_invoice_audit. Callable from SUBMITTED and from ADJUSTED (the re-audit leg of the dispute cycle)."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: DefenseInvoice
    side_effects:
      - "computes billed_fees_cents, rate_cap_excess_cents, block_reduction_cents, expense_disallowance_cents, guideline_reduction_cents, allowed_amount_cents and disallowed_amount_cents"
      - "sets audited_by_user_id = X-User-ID and status UNDER_AUDIT"
      - "increments DefenseInvoice.version by 1"

  - method: POST
    path: "/epli/defense-invoices/{invoice_id}/dispute"
    description: "Panel counsel disputes an UNDER_AUDIT reduction and resubmits revised hours and expenses, moving the invoice to ADJUSTED. Only the assigned firm's PanelCounsel principal may dispute."
    roles: [PanelCounsel]
    code: 200
    input: [dispute_note, "partner_hours?", "associate_hours?", "paralegal_hours?", "block_billed_hours?", "expenses_cents?"]
    output: DefenseInvoice
    side_effects:
      - "overwrites the supplied hour and expense fields and records dispute_note"
      - "re-runs calculations.defense_invoice_audit on the revised inputs"
      - "clears audited_by_user_id to null and sets status ADJUSTED"
      - "increments DefenseInvoice.version by 1"

  - method: POST
    path: "/epli/defense-invoices/{invoice_id}/approve"
    description: "Approve an UNDER_AUDIT invoice, debiting the matter budget and the policy aggregate. Four-eyes gate: X-User-ID must differ from audited_by_user_id. Refused until the claim's retention is satisfied (or its group is LOCKED)."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: DefenseInvoice
    side_effects:
      - "status becomes APPROVED"
      - "recomputes DefenseAssignment.budget_spent_cents and budget_remaining_cents"
      - "recomputes Claim.defense_paid_cents, Policy.defense_spend_cents and Policy.aggregate_limit_remaining_cents and may advance Policy.limit_posture"
      - "increments DefenseInvoice.version by 1"

  - method: POST
    path: "/epli/defense-invoices/{invoice_id}/void"
    description: "Void an APPROVED invoice, restoring exactly the matter budget and policy aggregate it consumed."
    roles: [ClaimsManager]
    code: 200
    input: [void_reason]
    output: DefenseInvoice
    side_effects:
      - "status becomes VOIDED and void_reason is recorded"
      - "restores DefenseAssignment.budget_spent_cents / budget_remaining_cents by exactly allowed_amount_cents"
      - "restores Claim.defense_paid_cents, Policy.defense_spend_cents and Policy.aggregate_limit_remaining_cents by exactly allowed_amount_cents and may regress limit_posture"
      - "increments DefenseInvoice.version by 1"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:

  # ---- auth / authorization ----------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID header absent or empty on any /epli endpoint"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the caller's role is not listed in the endpoint's roles"

  # ---- request shape ------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required body field, unknown body field, wrong type, invalid enum value, out-of-range number, too many decimal places, malformed ISO-8601 instant, effective_to <= effective_from, engagement_to <= engagement_from, period_end < period_start, block_billed_hours > total billed hours, denial_reason supplied when decision == ACCEPT, or pagination limit outside [1,100]"

  # ---- existence ----------------------------------------------------------
  - id: ERR_JURISDICTION_NOT_FOUND
    http: 404
    condition: "jurisdiction_id path parameter, or a jurisdiction code in primary_jurisdiction_code / jurisdiction_headcounts[].code / jurisdiction_codes[], does not resolve"
  - id: ERR_RATE_PLAN_NOT_FOUND
    http: 404
    condition: "rate_plan_id in the path or body does not resolve"
  - id: ERR_APPLICANT_NOT_FOUND
    http: 404
    condition: "applicant_id in the path or body does not resolve"
  - id: ERR_SERVICE_NOT_FOUND
    http: 404
    condition: "service_id path parameter does not resolve to a RiskManagementService"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "assessment_id in the path, or exposure_assessment_id in the body, does not resolve"
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "policy_id in the path or body does not resolve"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "claim_id in the path, or lead_claim_id / related_to_claim_id / claim_id in a body, does not resolve"
  - id: ERR_GROUP_NOT_FOUND
    http: 404
    condition: "group_id path parameter does not resolve to a RelatedClaimGroup"
  - id: ERR_PANEL_FIRM_NOT_FOUND
    http: 404
    condition: "panel_firm_id in the path or body, or an entry of excluded_panel_firm_ids, does not resolve"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "assignment_id path parameter does not resolve to a DefenseAssignment"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "invoice_id path parameter does not resolve to a DefenseInvoice"
  - id: ERR_PAYMENT_NOT_FOUND
    http: 404
    condition: "payment_id path parameter does not resolve to an IndemnityPayment"
  - id: ERR_RESOLUTION_NOT_FOUND
    http: 404
    condition: "resolution_id path parameter does not resolve to a PreSuitResolution"

  # ---- ownership ----------------------------------------------------------
  - id: ERR_OWNERSHIP_MISMATCH
    http: 403
    condition: "cross-aggregate mismatch: related_to_claim_id belongs to a different policy, a group member's policy_id differs from the group's policy_id, or a PolicyholderContact reads a row belonging to another Applicant"
  - id: ERR_NOT_ASSIGNED_COUNSEL
    http: 403
    condition: "a PanelCounsel principal submits or disputes an invoice on a DefenseAssignment whose panel_firm_id is not the caller's own firm id"

  # ---- optimistic concurrency --------------------------------------------
  - id: ERR_STALE_APPLICANT_VERSION
    http: 412
    condition: "expected_applicant_version != Applicant.version on POST /epli/exposure-assessments"
  - id: ERR_STALE_POLICY_VERSION
    http: 412
    condition: "expected_policy_version != Policy.version on POST /epli/claims/{claim_id}/indemnity-payments"
  - id: ERR_STALE_GROUP_VERSION
    http: 412
    condition: "expected_related_claim_group_version != RelatedClaimGroup.version on POST /epli/related-claim-groups/{group_id}/claims"

  # ---- own-state preconditions -------------------------------------------
  - id: ERR_RATE_PLAN_NOT_ACTIVATABLE
    http: 409
    condition: "activate called on a RatePlan whose status is not DRAFT"
  - id: ERR_SERVICE_NOT_COMPLETABLE
    http: 409
    condition: "complete called on a RiskManagementService whose status is not PENDING, or the logical clock is outside [effective_from, effective_to)"
  - id: ERR_SERVICE_NOT_REVOCABLE
    http: 409
    condition: "revoke called on a RiskManagementService whose status is LAPSED or REVOKED"
  - id: ERR_ASSESSMENT_NOT_PRICEABLE
    http: 409
    condition: "price called on an ExposureAssessment whose status is not DRAFT or REFERRED"
  - id: ERR_ASSESSMENT_NOT_DECIDABLE
    http: 409
    condition: "approve or reject called on an ExposureAssessment whose status is not PRICED or REFERRED"
  - id: ERR_POLICY_NOT_SUSPENDABLE
    http: 409
    condition: "suspend called on a Policy whose status is not ACTIVE"
  - id: ERR_POLICY_NOT_REINSTATABLE
    http: 409
    condition: "reinstate called on a Policy whose status is not SUSPENDED, or the logical clock is already >= effective_to"
  - id: ERR_CLAIM_NOT_REVIEWABLE
    http: 409
    condition: "start-review called on a Claim whose status is not REPORTED"
  - id: ERR_COVERAGE_ALREADY_DECIDED
    http: 409
    condition: "coverage-decision called on a Claim whose status is not UNDER_REVIEW"
  - id: ERR_CLAIM_NOT_CLOSABLE
    http: 409
    condition: "close called on a Claim whose status is not COVERAGE_DENIED or RESOLVED"
  - id: ERR_CLAIM_NOT_REOPENABLE
    http: 409
    condition: "reopen called on a Claim whose status is not CLOSED"
  - id: ERR_ASSIGNMENT_NOT_CLOSABLE
    http: 409
    condition: "close called on a DefenseAssignment already in CLOSED"
  - id: ERR_INVOICE_NOT_AUDITABLE
    http: 409
    condition: "audit called on a DefenseInvoice whose status is not SUBMITTED or ADJUSTED"
  - id: ERR_INVOICE_NOT_DISPUTABLE
    http: 409
    condition: "dispute called on a DefenseInvoice whose status is not UNDER_AUDIT"
  - id: ERR_INVOICE_NOT_APPROVABLE
    http: 409
    condition: "approve called on a DefenseInvoice whose status is not UNDER_AUDIT"
  - id: ERR_INVOICE_NOT_VOIDABLE
    http: 409
    condition: "void called on a DefenseInvoice whose status is not APPROVED"
  - id: ERR_PAYMENT_NOT_APPROVABLE
    http: 409
    condition: "approve called on an IndemnityPayment whose status is not PENDING_APPROVAL"
  - id: ERR_PAYMENT_NOT_VOIDABLE
    http: 409
    condition: "void called on an IndemnityPayment already in VOIDED"
  - id: ERR_RESOLUTION_NOT_ACCEPTABLE
    http: 409
    condition: "accept called on a PreSuitResolution whose status is not OFFERED"
  - id: ERR_PANEL_FIRM_NOT_SUSPENDABLE
    http: 409
    condition: "suspend called on a DefensePanelFirm already in PANEL_SUSPENDED"

  # ---- cross-entity state ------------------------------------------------
  - id: ERR_POLICY_NOT_IN_FORCE
    http: 409
    condition: "the owning Policy.status is SUSPENDED or EXPIRED, or the Claim is coverage_gated, when claim or payment work is attempted"
  - id: ERR_RATE_PLAN_NOT_ACTIVE
    http: 409
    condition: "POST /epli/exposure-assessments references a RatePlan whose status is DRAFT, or price is called while the assessment's rate plan is not ACTIVE"
  - id: ERR_PANEL_FIRM_NOT_ACTIVE
    http: 409
    condition: "a client-directed panel_firm_id names a DefensePanelFirm whose status is PANEL_SUSPENDED"
  - id: ERR_GROUP_LOCKED
    http: 409
    condition: "attaching a claim to, or approving a payment on a member of, a RelatedClaimGroup whose status is LOCKED"
  - id: ERR_ASSIGNMENT_CLOSED
    http: 409
    condition: "an invoice is submitted on a DefenseAssignment whose status is CLOSED"

  # ---- business rules ----------------------------------------------------
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "X-User-ID equals ExposureAssessment.priced_by_user_id on assessment approve, DefenseInvoice.audited_by_user_id on invoice approve, or IndemnityPayment.created_by_user_id on payment approve"
  - id: ERR_CREDIT_BASIS_STALE
    http: 409
    condition: "approve called on an ExposureAssessment whose credit_basis_stale == true"
  - id: ERR_THIRD_PARTY_COVERAGE_NOT_ELECTED
    http: 422
    condition: "a claim whose coverage_bucket resolves to THIRD_PARTY is reported on a Policy with third_party_coverage_elected == false"
  - id: ERR_CLAIM_OUTSIDE_POLICY_PERIOD
    http: 422
    condition: "Claim.first_notice_at is before Policy.effective_from or at/after Policy.effective_to"
  - id: ERR_PRE_SUIT_NOT_ELIGIBLE
    http: 422
    condition: "a pre-suit resolution is offered or accepted on a Claim whose notice_type is not ADMIN_CHARGE"
  - id: ERR_PRE_SUIT_WINDOW_CLOSED
    http: 422
    condition: "on accept, elapsed_days_at_accept exceeds the Jurisdiction.pre_suit_window_days of the applicant's primary jurisdiction, or the logical clock is past offer_expires_at"
  - id: ERR_INVOICE_OUTSIDE_ENGAGEMENT
    http: 422
    condition: "invoice period_start < DefenseAssignment.engagement_from or period_end >= DefenseAssignment.engagement_to"
  - id: ERR_INVOICE_PERIOD_OVERLAP
    http: 409
    condition: "the new invoice's CLOSED billing period touches or overlaps a live (non-VOIDED, non-REJECTED) invoice period on the same assignment"
  - id: ERR_SERVICE_WINDOW_CONFLICT
    http: 409
    condition: "a new RiskManagementService of the same service_type overlaps a non-REVOKED service window on the same Applicant, after that window is extended by SERVICE_GAP_BUFFER_DAYS = 30 on its high side"
  - id: ERR_POLICY_PERIOD_OVERLAP
    http: 409
    condition: "the new policy period overlaps a non-EXPIRED policy period for the same Applicant under the half-open rule"
  - id: ERR_PANEL_CAPACITY_EXCEEDED
    http: 409
    condition: "a client-directed panel_firm_id already holds capacity_open_matters window-overlapping assignments in ACTIVE or SUSPENDED_FUNDING"
  - id: ERR_NO_ELIGIBLE_PANEL_FIRM
    http: 422
    condition: "the panel_firm_selection candidate pool is empty, or a client-directed firm does not cover the applicant's primary_jurisdiction_code or appears in excluded_panel_firm_ids"
  - id: ERR_CLAIM_ALREADY_GROUPED
    http: 409
    condition: "the claim being attached (or nominated as lead) already has a non-null related_claim_group_id"
  - id: ERR_GROUP_BASIS_MISMATCH
    http: 422
    condition: "a claim attached to a CLASS_ACTION_MEMBER or MASS_CLAIM_WAVE group has a different coverage_bucket than the group's lead claim"
  - id: ERR_CLAIM_REOPEN_LIMIT
    http: 409
    condition: "reopen attempted on a Claim whose reopen_count is already REOPEN_LIMIT (1)"
  - id: ERR_RETENTION_NOT_SATISFIED
    http: 409
    condition: "invoice approve attempted while Claim.retention_satisfied_cents < Claim.applied_retention_cents and the claim's group (if any) is not LOCKED"
  - id: ERR_BUDGET_CAP_EXCEEDED
    http: 409
    condition: "DefenseAssignment.budget_spent_cents + invoice.allowed_amount_cents > DefenseAssignment.budget_cap_cents"
  - id: ERR_WAGE_HOUR_SUBLIMIT_EXHAUSTED
    http: 409
    condition: "insurer_portion_cents > Policy.wage_hour_sublimit_remaining_cents on approval of a WAGE_HOUR-bucketed payment"
  - id: ERR_THIRD_PARTY_SUBLIMIT_EXHAUSTED
    http: 409
    condition: "insurer_portion_cents > Policy.third_party_sublimit_remaining_cents on approval of a THIRD_PARTY-bucketed payment"
  - id: ERR_AGGREGATE_LIMIT_EXHAUSTED
    http: 409
    condition: "the debiting amount exceeds Policy.aggregate_limit_remaining_cents on payment approval or invoice approval"
  - id: ERR_HEADCOUNT_ALLOCATION_MISMATCH
    http: 422
    condition: "sum(jurisdiction_headcounts[].headcount) != total_headcount, or primary_jurisdiction_code is absent from jurisdiction_headcounts[].code"
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "to_iso8601 is earlier than the current logical clock"
  - id: ERR_DUPLICATE_JURISDICTION_CODE
    http: 409
    condition: "a Jurisdiction with the same code already exists"
  - id: ERR_DUPLICATE_RATE_PLAN_NAME
    http: 409
    condition: "a RatePlan with the same name already exists"
  - id: ERR_DUPLICATE_PANEL_FIRM_NAME
    http: 409
    condition: "a DefensePanelFirm with the same name already exists"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:

  - name: PlatformAdmin
    description: "Carrier operations: reference data (jurisdictions, rate plans, defense panel) and the logical clock. Never touches an individual risk or claim decision."
    identity: "opaque"
    exclusive_operations:
      - "POST /epli/jurisdictions"
      - "POST /epli/rate-plans"
      - "POST /epli/rate-plans/{rate_plan_id}/activate"
      - "POST /epli/defense-panel-firms"
      - "POST /epli/defense-panel-firms/{panel_firm_id}/suspend"
      - "POST /epli/_clock/set_current_utc"
    shared_operations:
      - "every GET endpoint under /epli"

  - name: Underwriter
    description: "Prices risks: applicants, risk-management services, exposure assessments and policy binding. Cannot release its own work."
    identity: "opaque"
    exclusive_operations:
      - "POST /epli/applicants"
      - "PATCH /epli/applicants/{applicant_id}"
      - "POST /epli/applicants/{applicant_id}/risk-management-services"
      - "POST /epli/risk-management-services/{service_id}/complete"
      - "POST /epli/risk-management-services/{service_id}/revoke"
      - "POST /epli/exposure-assessments"
      - "POST /epli/exposure-assessments/{assessment_id}/price"
      - "POST /epli/policies"
    shared_operations:
      - "GET /epli/jurisdictions, /epli/jurisdictions/{jurisdiction_id}, /epli/rate-plans, /epli/rate-plans/{rate_plan_id}"
      - "GET /epli/applicants/{applicant_id}, /epli/risk-management-services, /epli/risk-management-services/{service_id}"
      - "GET /epli/exposure-assessments, /epli/exposure-assessments/{assessment_id}"
      - "GET /epli/policies, /epli/policies/{policy_id}, /epli/policies/{policy_id}/limit-ledger"
      - "GET /epli/claims, /epli/claims/{claim_id}, /epli/related-claim-groups, /epli/related-claim-groups/{group_id}"

  - name: UnderwritingManager
    description: "Second pair of eyes on pricing, and the only role that can suspend or reinstate coverage."
    identity: "opaque"
    exclusive_operations:
      - "POST /epli/exposure-assessments/{assessment_id}/approve"
      - "POST /epli/exposure-assessments/{assessment_id}/reject"
      - "POST /epli/policies/{policy_id}/suspend"
      - "POST /epli/policies/{policy_id}/reinstate"
    shared_operations:
      - "the same GET surface as Underwriter, plus GET /epli/indemnity-payments and /epli/indemnity-payments/{payment_id}"

  - name: ClaimsAdjuster
    description: "Handles claims day to day: intake, coverage decisions, pre-suit resolution, defense engagement, invoice audits and payment creation."
    identity: "opaque"
    exclusive_operations:
      - "POST /epli/policies/{policy_id}/claims"
      - "POST /epli/claims/{claim_id}/start-review"
      - "POST /epli/claims/{claim_id}/coverage-decision"
      - "POST /epli/claims/{claim_id}/close"
      - "POST /epli/claims/{claim_id}/pre-suit-resolutions"
      - "POST /epli/pre-suit-resolutions/{resolution_id}/accept"
      - "POST /epli/claims/{claim_id}/defense-assignments"
      - "POST /epli/defense-assignments/{assignment_id}/close"
      - "POST /epli/defense-invoices/{invoice_id}/audit"
      - "POST /epli/defense-invoices/{invoice_id}/approve"
      - "POST /epli/claims/{claim_id}/indemnity-payments"
    shared_operations:
      - "GET /epli/jurisdictions, /epli/jurisdictions/{jurisdiction_id}, /epli/defense-panel-firms, /epli/defense-panel-firms/{panel_firm_id}"
      - "GET /epli/policies, /epli/policies/{policy_id}, /epli/policies/{policy_id}/limit-ledger"
      - "GET /epli/claims, /epli/claims/{claim_id}, /epli/related-claim-groups, /epli/related-claim-groups/{group_id}"
      - "GET /epli/pre-suit-resolutions, /epli/pre-suit-resolutions/{resolution_id}"
      - "GET /epli/indemnity-payments, /epli/indemnity-payments/{payment_id}"
      - "GET /epli/defense-assignments, /epli/defense-assignments/{assignment_id}, /epli/defense-invoices, /epli/defense-invoices/{invoice_id}"

  - name: ClaimsManager
    description: "Claims authority: approves and voids money, reopens claims, and owns related-claim aggregation."
    identity: "opaque"
    exclusive_operations:
      - "POST /epli/claims/{claim_id}/reopen"
      - "POST /epli/related-claim-groups"
      - "POST /epli/related-claim-groups/{group_id}/claims"
      - "POST /epli/indemnity-payments/{payment_id}/approve"
      - "POST /epli/indemnity-payments/{payment_id}/void"
      - "POST /epli/defense-invoices/{invoice_id}/void"
    shared_operations:
      - "the same GET surface as ClaimsAdjuster"

  - name: PanelCounsel
    description: "Outside defense counsel. X-User-ID is the firm's own DefensePanelFirm.id, so a firm can only bill on its own assignments."
    identity: "entity_backed:DefensePanelFirm"
    exclusive_operations:
      - "POST /epli/defense-assignments/{assignment_id}/invoices"
      - "POST /epli/defense-invoices/{invoice_id}/dispute"
    shared_operations:
      - "GET /epli/defense-assignments, /epli/defense-assignments/{assignment_id}"
      - "GET /epli/defense-invoices, /epli/defense-invoices/{invoice_id}"
      - "GET /epli/defense-panel-firms, /epli/defense-panel-firms/{panel_firm_id}"
      - "GET /epli/claims/{claim_id}"

  - name: PolicyholderContact
    description: "Insured-side read-only contact. X-User-ID is the insured's own Applicant.id; every read is scoped to that applicant's own rows and a cross-applicant read is ERR_OWNERSHIP_MISMATCH."
    identity: "entity_backed:Applicant"
    exclusive_operations: []
    shared_operations:
      - "GET /epli/applicants/{applicant_id} (own row only)"
      - "GET /epli/risk-management-services, /epli/risk-management-services/{service_id} (own rows only)"
      - "GET /epli/exposure-assessments, /epli/exposure-assessments/{assessment_id} (own rows only)"
      - "GET /epli/policies, /epli/policies/{policy_id} (own rows only)"

rbac_notes:
  role_model: segregation_of_duties
  pinned_user_ids:
    PlatformAdmin: ["admin-001"]
    Underwriter: ["uw-001", "uw-002"]
    UnderwritingManager: ["uwm-001", "uwm-002"]
    ClaimsAdjuster: ["adj-001", "adj-002"]
    ClaimsManager: ["clm-001", "clm-002"]
  four_eyes_gates:
    - "assessment approve: X-User-ID != ExposureAssessment.priced_by_user_id -- note the gate is on the USER, not the role, so uwm-001 approving what uw-001 priced is fine, and a UnderwritingManager who also priced (possible because priced_by_user_id stores a raw X-User-ID) is blocked"
    - "invoice approve: X-User-ID != DefenseInvoice.audited_by_user_id, so adj-001 audits and adj-002 approves"
    - "payment approve: X-User-ID != IndemnityPayment.created_by_user_id; because creation is ClaimsAdjuster-only and approval is ClaimsManager-only, this gate can only fire if the same principal id is used for both, which the tests do deliberately"
