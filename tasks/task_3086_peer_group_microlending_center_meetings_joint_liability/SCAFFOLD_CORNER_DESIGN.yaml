        distinguishing_aspect: "A 6000c collection on a fresh loan splits 200 savings + 4600 installment + 1200 prepayment remainder; the prepayment retires outstanding without incrementing installments_on_time beyond the single current installment."
        test_recipe:
          setup: ["Applicant A with an ACTIVE cycle-1 loan; meeting OPEN, all present; logical clock 2026-09-01 (before first due 2026-09-08)."]
          setup_api_calls:
