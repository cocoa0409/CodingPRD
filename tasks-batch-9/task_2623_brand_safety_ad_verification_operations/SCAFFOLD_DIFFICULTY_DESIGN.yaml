              as: ClassificationAnalyst
              as_user_id: "analyst-2"
              captures: { cls_clear_id: $.data.id }
          assert:
            - "PageClassification.${cls_flag_id}.mfa_score == 70.0 and mfa_flag == true"
            - "PageClassification.${cls_clear_id}.mfa_score == 69.85 and mfa_flag == false"
            - "Both classifications have base_risk_points == 0.0; the flagged one has adjusted_risk_points == 0.0 and assigned_tier SAFE, because the 1.5 multiplier applied to a zero base is still zero"
            - "Page.${page_flag_id}.mfa_flag == true and Page.${page_clear_id}.mfa_flag == false"
            - "Publisher.${pub_id}.mfa_page_count == 1 (only the page at exactly the threshold counted)"

