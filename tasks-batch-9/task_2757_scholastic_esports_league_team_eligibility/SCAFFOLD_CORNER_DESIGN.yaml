              as: Coach
              as_user_id: "${c_a_id}"
              captures: { rs_p_id: $.data.id }
            - call: "POST /roster-slots"
              payload: { team_id: "${tm_id}", student_id: "${st_u_id}", slot_role: "SUB" }
