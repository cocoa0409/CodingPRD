      - name: unauthenticated_request_without_role_header
        claim_type: "Violation to Error"
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
        distinguishing_aspect: "The authentication check runs before the role check, so a request with no X-User-Role reports 401 ERR_UNAUTHENTICATED rather than 403 ERR_FORBIDDEN_ROLE, and the resource is not touched."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha" }
