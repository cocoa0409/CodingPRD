              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { visit_e_id: "$.data.id" }
            - call: "GET /accreditation/cycles/${cyc_w_id}"
              payload: {}
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { cyc_w_v: "$.data.version" }
            - call: "POST /accreditation/visits"
              payload: { cycle_id: "${cyc_w_id}", window_start_date: "2026-09-05", window_end_date: "2026-09-14", expected_cycle_version: "${cyc_w_v}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { visit_w_id: "$.data.id" }
            - call: "POST /accreditation/visitors"
              payload: { full_name: "Rover Visitor", home_state_code: "NY", trained_through_year: 2026, certifications: [] }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { v_id: "$.data.id" }
            - call: "POST /accreditation/visit-assignments"
              payload: { visit_id: "${visit_e_id}", visitor_id: "${v_id}", team_role: "MEMBER", travel_block_start_date: "2026-09-01", travel_block_end_date: "2026-09-03" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { asg_first_id: "$.data.id" }
          trigger:
            - call: "POST /accreditation/visit-assignments"
              payload: { visit_id: "${visit_w_id}", visitor_id: "${v_id}", team_role: "MEMBER", travel_block_start_date: "2026-09-05", travel_block_end_date: "2026-09-07" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/visit-assignments"
              payload: { visit_id: "${visit_w_id}", visitor_id: "${v_id}", team_role: "MEMBER", travel_block_start_date: "2026-09-06", travel_block_end_date: "2026-09-08" }
              as: AccreditationOfficer
