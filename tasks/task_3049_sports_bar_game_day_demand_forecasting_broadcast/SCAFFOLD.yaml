    code: 200
    input: [expected_fantasy_contest_version]
    output: FantasyContest
    side_effects:
      - "status -> SETTLED"
      - "prize_cents allocated per fantasy_payout"
      - "increments contest.version"

  - method: POST
    path: "/api/fantasy-contests/{contest_id}/cancel"
    description: "Cancel contest"
    roles: [VenueManager]
    code: 200
    input: []
