            - "pagination block: limit == 10, offset == 0, total_count == 1, has_more == false"

      - name: pagination_limit_offset_and_bounds
        claim_type: listing
        grounds: [response_envelope, "errors[ERR_VALIDATION_FAILED]"]
        distinguishing_aspect: "limit/offset interact with ordering (created_at ASC): three applications paginate 2+1 with has_more flipping; limit=0 violates the minimum (400)."
        test_recipe:
          setup: ["three applications filed in order A, B, C"]
          setup_api_calls:
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Page A", date_of_birth: "1990-01-01", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: [] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { appA: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Page B", date_of_birth: "1990-01-02", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: [] }, as: MembershipOfficer, as_user_id: "officer-1" }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Page C", date_of_birth: "1990-01-03", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: [] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { appC: "$.data.id" } }
          trigger:
            - { call: "GET /credit-union/membership-applications?limit=2&offset=0", as: MembershipOfficer, captures: { first: "$.data[0].id" } }
            - { call: "GET /credit-union/membership-applications?limit=2&offset=2", as: MembershipOfficer, captures: { third: "$.data[0].id" } }
            - { call: "GET /credit-union/membership-applications?limit=0", as: MembershipOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "page 1: total_count == 3, has_more == true, first == ${appA}"
            - "page 2: has_more == false, third == ${appC}"
            - "err == ERR_VALIDATION_FAILED (400) for limit=0 (below minimum 1)"

      - name: filtered_list_scoping
        claim_type: listing
        grounds: [endpoints, entities.Member.fields.status]
        distinguishing_aspect: "status filter on GET /members returns only matching members: one GRACE_PERIOD member appears under the filter and not under status=ACTIVE."
        test_recipe:
          setup: ["m1 ACTIVE; m2 confirmed ineligible on 2026-08-01 -> GRACE_PERIOD"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Active Al", date_of_birth: "1990-01-01", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app1: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m1: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Grace Gina", date_of_birth: "1990-02-02", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app2: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app2}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m2: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/members/${m2}/eligibility-reviews", payload: { reason: "MANUAL_FLAG" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { rev2: "$.data.id" } }
            - { call: "POST /credit-union/eligibility-reviews/${rev2}/confirm-ineligible", as: ComplianceOfficer, as_user_id: "co-2" }
          trigger:
            - { call: "GET /credit-union/members?status=GRACE_PERIOD", as: ComplianceOfficer, captures: { g0: "$.data[0].id" } }
            - { call: "GET /credit-union/members?status=ACTIVE", as: ComplianceOfficer, captures: { a0: "$.data[0].id" } }
          assert:
            - "GRACE_PERIOD list: total_count == 1 and g0 == ${m2}"
            - "ACTIVE list: total_count == 1 and a0 == ${m1}"

