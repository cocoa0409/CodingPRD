          assert:
            - "PickupTicket.${pt}.commodity_price_cents_per_gal == -20"
            - "PickupTicket.${pt}.gross_amount_cents == 2000  (20 * 100)"
            - "PickupTicket.${pt}.surcharge_cents == 1750     (tier-3: 1500 + 250*(5-4))"
            - "PickupTicket.${pt}.density_fee_cents == 500   ((150-100) * 10)"
            - "PickupTicket.${pt}.net_amount_cents == -4250  (-(2000+1750+500))"
            - "PickupTicket.${pt}.settlement_direction == CHARGE_CUSTOMER"

      - name: spill_liability_shared_party_rounding
        grounds:
          - calculations.spill_liability
        distinguishing_aspect: |
          Mode (c) — evaluation-order-pinning formula where liability_cents
          depends on base_cents * multiplier (rounded), then the RQ flat fee
          is added AFTER rounding, then customer_share is derived by a
          separate rounding pass on the already-rounded liability_cents.
          Order of operations changes the result.
        test_recipe:
          setup:
            - "Customer-owned tank at a site"
            - "Driver on a dispatched route at that site"
            - "Spill reported with cause_code=UNKNOWN (forces SHARED), gallons_spilled=7"
          setup_api_calls:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "Spill Cust", epa_generator_id: "EPAGEN000020", market_zone: "NORTH", credit_terms: "NET30" }, as: RoutePlanner, captures: { cust_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tank-sites", payload: { customer_id: "${cust_id}", site_address: "1 Spill Way", density_zone: "URBAN" }, as: RoutePlanner, captures: { site_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks", payload: { tank_site_id: "${site_id}", tank_kind: "USED_OIL", capacity_gallons: 500, ownership: "CUSTOMER_OWNED" }, as: TankInstaller, captures: { tank_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks/${tank_id}/register-existing", payload: {}, as: TankInstaller }
            - { call: "POST /recycle-routes/customers/${cust_id}/activate", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/drivers", payload: { driver_name: "Slick", cdl_class: "B", hazmat_endorsement: true }, as: RoutePlanner, captures: { drv_id: "$.data.id" } }
            - { call: "POST /recycle-routes/routes", payload: { route_code: "SPILL-R", scheduled_date: "2026-08-05", driver_id: "${drv_id}", vehicle_capacity_gallons: 500, density_zone: "URBAN" }, as: RoutePlanner, captures: { r_id: "$.data.id" } }
            - { call: "POST /recycle-routes/spill-incidents", payload: { route_id: "${r_id}", tank_site_id: "${site_id}", gallons_spilled: 7, cause_code: "UNKNOWN" }, as: Driver, as_user_id: "${drv_id}", captures: { spill_id: "$.data.id" } }
            - { call: "POST /recycle-routes/spill-incidents/${spill_id}/begin-investigation", payload: {}, as: EHSOfficer }
          trigger:
            - { call: "POST /recycle-routes/spill-incidents/${spill_id}/remediate", payload: {}, as: EHSOfficer, captures: { liab: "$.data.liability_cents", party: "$.data.responsible_party" } }
            - { call: "POST /recycle-routes/spill-incidents/${spill_id}/close", payload: {}, as: EHSOfficer }
          assert:
            - "base_cents = 850 * 7 = 5950"
            - "multiplier UNKNOWN = 1.0 → raw_liability = 5950"
            - "responsible_party == SHARED"
            - "customer_share_cents = round_half_up(5950/2) = 2975"
            - "reportable_quantity_exceeded == false (7 < 25); no RQ fee added"
            - "SpillIncident.${spill_id}.liability_cents == 5950"
            - "After close: Customer.${cust_id}.outstanding_charge_cents == 2975"

  # ==========================================================================
  # RULE 3 — non_linear_state_machine (different entities)
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: manifest_amendment_cycle
        grounds:
          - state_machines.Manifest
          - state_machines.Manifest.transitions.AMENDED_to_SUBMITTED
        distinguishing_aspect: |
          Manifest has a CYCLIC shape: DELIVERED -> AMENDMENT_PENDING -> AMENDED
          -> SUBMITTED -> IN_TRANSIT -> DELIVERED -> ... The loop can repeat.
        test_recipe:
          setup:
            - "Route COMPLETE with one COMPLETED stop of 100 gal"
            - "DisposalFacility accepts USED_OIL, capacity 10000/day"
            - "Manifest created DRAFT for the route"
            - "Manifest has been submitted, departed, delivered"
          setup_api_calls:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "Cycle Cust", epa_generator_id: "EPAGEN000030", market_zone: "NORTH", credit_terms: "NET30" }, as: RoutePlanner, captures: { cust_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tank-sites", payload: { customer_id: "${cust_id}", site_address: "2 Loop Ln", density_zone: "URBAN", route_eligibility_override: true }, as: RoutePlanner, captures: { site_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks", payload: { tank_site_id: "${site_id}", tank_kind: "USED_OIL", capacity_gallons: 500, ownership: "CUSTOMER_OWNED" }, as: TankInstaller, captures: { tank_id: "$.data.id" } }
            - { call: "POST /recycle-routes/tanks/${tank_id}/register-existing", payload: {}, as: TankInstaller }
            - { call: "POST /recycle-routes/tanks/${tank_id}/record-intake", payload: { gallons: 200 }, as: RoutePlanner }
            - { call: "POST /recycle-routes/customers/${cust_id}/activate", payload: {}, as: RoutePlanner }
            - { call: "POST /recycle-routes/drivers", payload: { driver_name: "Loopy", cdl_class: "A", hazmat_endorsement: true }, as: RoutePlanner, captures: { drv_id: "$.data.id" } }
            - { call: "POST /recycle-routes/market-prices", payload: { market_zone: "NORTH", tank_kind: "USED_OIL", effective_date: "2026-08-01", price_cents_per_gal: 50 }, as: Regulator }
            - { call: "POST /recycle-routes/disposal-facilities", payload: { facility_name: "TSDF-1", epa_id: "EPAID001", accepted_streams: ["USED_OIL"], daily_capacity_gallons: 10000 }, as: Regulator, captures: { fac_id: "$.data.id" } }
