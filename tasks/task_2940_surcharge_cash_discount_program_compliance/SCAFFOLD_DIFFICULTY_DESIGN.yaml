            - "Jurisdiction.${jur_az_id}.law_change_count == 2"
            - "SurchargeProgram.${prog_id}.activated_at == 2026-08-31T00:00:00.000Z (the RESUME hops re-enter ACTIVE at the same clock position)"

      - name: complaint_case_parallel_dimensions_advance_independently
        grounds:
          - state_machines.ComplaintCase.OPEN_to_UNDER_REVIEW
          - state_machines.ComplaintCase.UNDER_REVIEW_to_SUBSTANTIATED
          - state_machines.ComplaintCase.PLAN_REQUIRED_to_PLAN_SUBMITTED
          - state_machines.ComplaintCase.PLAN_SUBMITTED_to_PLAN_ACCEPTED
          - entities.ComplaintCase.fields.investigation_state
          - entities.ComplaintCase.fields.remediation_state
        distinguishing_aspect: |
          The non-linearity here is PARALLEL DIMENSIONS on a different entity: one ComplaintCase row carries
          investigation_state and remediation_state independently, so REVIEW moves only the investigation
          dimension (remediation stays NONE), SUBSTANTIATE is the single event that couples them once
          (remediation NONE -> PLAN_REQUIRED), and SUBMIT_PLAN / ACCEPT_PLAN then move only the remediation
          dimension while investigation_state stays SUBSTANTIATED.
        test_recipe:
          setup:
            - "Jurisdiction AZ, one merchant with docA and one DRAFT SURCHARGE program (no activation: the case must not trip the ACTIVE -> REMEDIATION cascade so the two dimensions can be observed in isolation)."
            - "One NETWORK complaint case on that program, freshly filed at clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /jurisdictions"
              payload: { state_code: "AZ", surcharge_permitted: true, surcharge_cap_pct: 4.0, cash_discount_permitted: true, price_posting_required: false, disclosure_signage_required: false, receipt_line_item_required: false, ag_enforcement_posture: "PERMISSIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { jur_az_id: $.data.id }
            - call: "POST /merchants"
              payload: { jurisdiction_id: "${jur_az_id}", legal_name: "Sonoran Supply Co", mcc: "5734" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { merch_id: $.data.id, merch_v0: $.data.version }
            - call: "POST /merchants/${merch_id}/cost-documentations"
              payload: { base_mdr_pct: 1.85, assessment_pct: 0.14, per_item_fee_cents: 10, evidence_uri: "s3://acq/az/2026-07.pdf", expected_merchant_version: "${merch_v0}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { doc_a_id: $.data.id }
            - call: "POST /surcharge-programs"
              payload: { merchant_id: "${merch_id}", jurisdiction_id: "${jur_az_id}", cost_documentation_id: "${doc_a_id}", program_type: "SURCHARGE", consistency_scope: "BRAND_LEVEL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { prog_id: $.data.id }
            - call: "POST /complaint-cases"
              payload: { program_id: "${prog_id}", source: "NETWORK", allegation_type: "MISSING_RECEIPT_LINE", narrative: "Receipt did not itemise the surcharge." }
              as: NetworkAuditor
              as_user_id: "auditor-1"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /complaint-cases/${case_id}/investigation-actions"
              payload: { action: "REVIEW", note: "assigned to officer-1" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /complaint-cases/${case_id}/investigation-actions"
              payload: { action: "SUBSTANTIATE", note: "allegation upheld" }
              as: NetworkAuditor
              as_user_id: "auditor-1"
            - call: "POST /complaint-cases/${case_id}/remediation-actions"
              payload: { action: "SUBMIT_PLAN", plan_summary: "Reprint receipt templates and retrain staff." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /complaint-cases/${case_id}/remediation-actions"
              payload: { action: "ACCEPT_PLAN" }
              as: NetworkAuditor
              as_user_id: "auditor-1"
          assert:
            - "At filing time: ComplaintCase.${case_id}.investigation_state == OPEN and remediation_state == NONE"
            - "After trigger step 1 (REVIEW): investigation_state == UNDER_REVIEW and remediation_state is STILL NONE and reviewed_by_user_id == officer-1"
            - "After trigger step 2 (SUBSTANTIATE): investigation_state == SUBSTANTIATED and remediation_state == PLAN_REQUIRED"
            - "After trigger step 3 (SUBMIT_PLAN): investigation_state is STILL SUBSTANTIATED and remediation_state == PLAN_SUBMITTED and plan_summary == 'Reprint receipt templates and retrain staff.'"
            - "After trigger step 4 (ACCEPT_PLAN): investigation_state is STILL SUBSTANTIATED and remediation_state == PLAN_ACCEPTED"
            - "ComplaintCase.${case_id}.response_due_at == 2026-08-11T00:00:00.000Z (RESPONSE_WINDOW_DAYS[NETWORK] == 10)"
            - "SurchargeProgram.${prog_id}.status == DRAFT throughout (the REMEDIATION cascade requires status ACTIVE)"
            - "SurchargeProgram.${prog_id}.network_exposure_score == 30.00 after trigger step 2"

