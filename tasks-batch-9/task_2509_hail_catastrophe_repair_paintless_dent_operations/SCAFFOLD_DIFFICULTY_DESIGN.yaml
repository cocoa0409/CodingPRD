      - name: carrier_direct_bill_flag_decides_authorization_and_repair_start
        grounds:
          - validations[priority=29]
          - validations[priority=16]
          - entities.Insurer.fields.direct_bill_enabled
          - errors[ERR_DIRECT_BILL_NOT_ENABLED]
          - errors[ERR_INVALID_VEHICLE_BILLING_STATE]
