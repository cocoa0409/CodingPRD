              as: LogisticsCoordinator
              captures: { fl_status1: $.data.status }
            - call: "GET /dealers/${dlr_a_id}"
              payload: {}
              as: LogisticsCoordinator
              captures: { committed1: $.data.credit_committed_cents, avail1: $.data.credit_available_cents, staged1: $.data.staged_kit_count }
            - call: "POST /freight-loads/${fl_id}/dispatch"
              payload: {}
              as: LogisticsCoordinator
              captures: { e_dispatch_twice: $.data.error_id }
            - call: "POST /freight-loads/${fl_id}/assign-order"
              payload: { dealer_order_id: "${o1_id}" }
              as: LogisticsCoordinator
              captures: { e_assign_dispatched: $.data.error_id }
            - call: "POST /freight-loads/${fl_id}/cancel"
              payload: {}
              as: LogisticsCoordinator
              captures: { e_cancel_dispatched: $.data.error_id }
            - call: "POST /freight-loads/${fl_id}/deliver"
              payload: {}
              as: LogisticsCoordinator
              captures: { fl_status2: $.data.status }
            - call: "GET /dealer-orders/${o1_id}"
              payload: {}
              as: LogisticsCoordinator
              captures: { o1_prod2: $.data.production_status, o1_fin2: $.data.financial_status, o1_hold2: $.data.credit_hold_cents, o1_frt: $.data.allocated_freight_cents }
            - call: "GET /dealers/${dlr_a_id}"
              payload: {}
              as: LogisticsCoordinator
              captures: { committed2: $.data.credit_committed_cents, avail2: $.data.credit_available_cents }
            - call: "POST /freight-loads/${fl_id}/deliver"
              payload: {}
              as: LogisticsCoordinator
              captures: { e_deliver_twice: $.data.error_id }
          assert:
            - "the empty PLANNED load reports linehaul_cost_cents 0, order_count 0 and cube_utilization_pct 0 - a trailer carrying nothing is not charged its base linehaul"
            - "delivering a PLANNED load returns HTTP 409 with error_id ERR_LOAD_STATE_INVALID, since deliver admits only DISPATCHED"
            - "the assignment returns HTTP 200 with order_count 1, cube_utilization_pct 29.76, linehaul_cost_cents 164231 == 145000 + round(6410.4 * 3), and DealerOrder allocated_freight_cents 164231"
            - "the dispatch returns HTTP 200 with status DISPATCHED, and the dealer's staged_kit_count is back to 0 because the load has left the PLANNED set"
            - "immediately after dispatch the dealer still reports credit_committed_cents 1999734 and credit_available_cents 898000266 - dispatch ships steel, it does not release credit"
            - "dispatching the DISPATCHED load again returns HTTP 409 ERR_LOAD_STATE_INVALID"
            - "assign-order on the DISPATCHED load returns HTTP 409 ERR_LOAD_STATE_INVALID - NOT HTTP 409 ERR_ORDER_ALREADY_ON_LOAD - because priority 7 outranks priority 28 even though the order is genuinely already attached"
            - "cancelling the DISPATCHED load returns HTTP 409 ERR_LOAD_STATE_INVALID, so a dispatched load can never be cancelled"
            - "the delivery returns HTTP 200 with status DELIVERED; O1 is production_status SHIPPED, financial_status RELEASED and credit_hold_cents 0, while allocated_freight_cents stays 164231"
            - "after delivery the dealer reports credit_committed_cents 0 and credit_available_cents 900000000 - the full limit is restored exactly once"
            - "delivering the DELIVERED load again returns HTTP 409 ERR_LOAD_STATE_INVALID, since DELIVERED is terminal"

      - name: resetting_the_credit_limit_drives_the_hold_cascade_in_both_directions_from_one_endpoint
        claim_type: conditional_action
        grounds:
          - endpoints.POST /dealers/{id}/credit-limit
          - calculations.dealer_credit_ledger
          - state_machines.Dealer
          - state_machines.DealerOrder
        distinguishing_aspect: "The limit endpoint never touches an order directly, yet it moves two orders in both directions, and the sign test is on credit_available_cents rather than on the limit: 3999467 against a committed 3999468 gives -1 and holds the dealer, while raising the limit to exactly 3999468 gives available 0 and reactivates, so the ACTIVE test is >= 0 and not > 0. A second lowering while already CREDIT_HOLD must not re-cascade orders that are already HOLD_CREDIT, and a re-set to the value already in force must still increment Dealer.version while leaving both statuses alone - this endpoint is not idempotent in version terms. Throughout, credit_committed_cents stays 3999468 because HOLD_CREDIT orders remain in the committed set; only the available figure and the statuses move."
