              captures: { claim_status: $.data.status, claim_refund: $.data.refund_amount_cents, claim_claw: $.data.clawback_cents, claim_abs: $.data.treasury_absorbed_cents }
            - call: "GET /creditor-agencies/${cred_fed}"
              payload: {}
              as: Auditor
            - call: "GET /offsets"
              payload: { payment_id: "${pay_1}" }
              as: Auditor
            - call: "GET /debts/${debt_1}"
              payload: {}
