      - name: refrigerant_heel_shortfall_exact_boundary
        claim_type: boundary_edge
        grounds: [calculations.refrigerant_net_balance]
        distinguishing_aspect: "Heel threshold uses strict <: returned weight exactly 45.00 (== 90% of 50.00 full) is NOT a shortfall; 44.99 IS — one shortfall flips compliance_standing to WATCH."
        test_recipe:
          setup: ["contractor C-R; cylinder CYL-R full 50.00 tare 20.00 issued to C-R"]
          setup_api_calls:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Heel Co", license_number: "LIC-C302" }
