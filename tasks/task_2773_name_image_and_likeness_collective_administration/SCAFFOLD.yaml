  - { error_id: ERR_NO_ELIGIBLE_ATHLETES,       http_status: 422, message: "No eligible athlete matches this allocation batch.", raised_by: "validation priority 27" }

  # --- business_temporal ---
  - { error_id: ERR_EXCLUSIVITY_WINDOW_CONFLICT, http_status: 409, message: "Another contract for this athlete already claims this exclusivity category over an overlapping window.", raised_by: "validation priority 28" }
  - { error_id: ERR_DUE_OUTSIDE_CONTRACT_WINDOW, http_status: 422, message: "due_at must fall inside the contract's effective window.", raised_by: "validation priority 29" }
  - { error_id: ERR_REVERSAL_ACROSS_TAX_YEARS,  http_status: 422, message: "A release from a previous tax year cannot be reversed.", raised_by: "validation priority 30" }
  - { error_id: ERR_BATCH_OVERLAP_CAPACITY_EXCEEDED, http_status: 409, message: "Too many roster allocation batches already overlap this window for this sport.", raised_by: "validation priority 46" }

  # --- business_constraint ---
