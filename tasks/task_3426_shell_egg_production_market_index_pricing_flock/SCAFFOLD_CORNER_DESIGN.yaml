  # ===========================================================================
  - section: validations
    instances:

      - name: missing_auth_headers_returns_401
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers fails authentication before any role or existence check, returning 401 ERR_UNAUTHENTICATED in the standard error envelope."
        test_recipe:
          setup: ["One complex exists."]
          setup_api_calls:
            - *c_clock0901
            - *c_cx
          trigger:
            - call: "GET /api/complexes/${cx_id}"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 401 and error_id == ERR_UNAUTHENTICATED"

      - name: unknown_role_returns_401
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "An X-User-Role value that names no declared role ('Warehouseman') is an authentication failure, not a 403."
        test_recipe:
          setup: ["One complex exists."]
          setup_api_calls:
            - *c_clock0901
            - *c_cx
          trigger:
            - call: "GET /api/complexes/${cx_id}"
              payload: {}
              as: Warehouseman
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 401 and error_id == ERR_UNAUTHENTICATED"

      - name: contract_flock_without_grower_returns_grower_required
        claim_type: conditional_validation
        grounds:
          - validations[priority=6]
          - errors.ERR_GROWER_REQUIRED
        distinguishing_aspect: "grower_name is required exactly when ownership == CONTRACT: the CONTRACT flock without it fails 400 ERR_GROWER_REQUIRED, while an OWNED flock with no grower_name is accepted."
        test_recipe:
          setup: ["Complex with house H1."]
          setup_api_calls:
            - *c_clock0901
            - *c_cx
            - call: "POST /api/complexes/${cx_id}/houses"
              payload: { house_code: "H1", housing_style: "CONVENTIONAL", capacity_hens: 200000 }
              as: PlatformAdmin
              captures: { h1_id: $.data.id }
          trigger:
            - call: "POST /api/houses/${h1_id}/flocks"
              payload: { flock_code: "FC", program: "CONVENTIONAL", ownership: "CONTRACT", placement_date: "2026-12-01T00:00:00Z", placed_hen_count: 40000 }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
            - call: "POST /api/houses/${h1_id}/flocks"
              payload: { flock_code: "FO", program: "CONVENTIONAL", ownership: "OWNED", placement_date: "2026-12-01T00:00:00Z", placed_hen_count: 40000 }
              as: ProductionPlanner
              captures: { fo_id: $.data.id }
          assert:
            - "the CONTRACT flock without grower_name returns 400 ERR_GROWER_REQUIRED"
            - "the OWNED flock without grower_name is created 201 (Flock.${fo_id})"

      - name: program_housing_mismatch_rejected_at_create
        claim_type: violation_to_error
        grounds:
          - validations[priority=20]
          - errors.ERR_PROGRAM_HOUSING_MISMATCH
        distinguishing_aspect: "A CAGE_FREE flock planned into a CONVENTIONAL house fails at creation with 422 ERR_PROGRAM_HOUSING_MISMATCH — the program/housing equality rule is enforced before the flock ever exists."
        test_recipe:
          setup: ["Complex with house H1 CONVENTIONAL."]
          setup_api_calls:
            - *c_clock0901
            - *c_cx
            - call: "POST /api/complexes/${cx_id}/houses"
              payload: { house_code: "H1", housing_style: "CONVENTIONAL", capacity_hens: 80000 }
              as: PlatformAdmin
              captures: { h1_id: $.data.id }
          trigger:
            - call: "POST /api/houses/${h1_id}/flocks"
              payload: { flock_code: "F2", program: "CAGE_FREE", ownership: "OWNED", placement_date: "2026-12-01T00:00:00Z", placed_hen_count: 60000 }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_PROGRAM_HOUSING_MISMATCH"
            - "GET /api/houses/${h1_id}/flocks returns 0 rows"

      - name: ship_week_not_monday_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=12]
          - errors.ERR_SHIP_WEEK_NOT_MONDAY
        distinguishing_aspect: "2026-09-08T00:00:00Z is a Tuesday: rejected with 422 ERR_SHIP_WEEK_NOT_MONDAY before the commitment-window check runs (the date is inside the window)."
        test_recipe:
          setup: ["Customer with ACTIVE commitment (window [2026-09-01, 2027-03-01])."]
          setup_api_calls:
            - *c_clock0901
            - call: "POST /api/customers"
              payload: { name: "Sunrise Grocers", segment: "RETAIL", credit_limit_cents: 500000000 }
              as: PlatformAdmin
              captures: { cu_id: $.data.id }
            - call: "POST /api/customers/${cu_id}/commitments"
              payload: { program: "CONVENTIONAL", region_code: "MIDWEST", weekly_dozen_committed: 100000, price_adjustment_cents_per_dozen: 0, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-03-01T00:00:00Z" }
              as: SalesManager
              captures: { cm_id: $.data.id }
            - call: "POST /api/commitments/${cm_id}/activate"
              payload: {}
              as: SalesManager
            - call: "GET /api/commitments/${cm_id}"
              payload: {}
              as: SalesManager
              captures: { cm_v: $.data.version }
          trigger:
            - call: "POST /api/commitments/${cm_id}/orders"
              payload: { ship_week_start: "2026-09-08T00:00:00Z", dozen_ordered: 1000, size_class: "LARGE", expected_commitment_version: "${cm_v}" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_SHIP_WEEK_NOT_MONDAY"
            - "error_id != ERR_ORDER_OUTSIDE_COMMITMENT_WINDOW (the week lies inside the window; only the Monday rule fails)"

      - name: weekly_volume_exact_fill_then_one_dozen_overflow
        claim_type: aggregate_validation
        grounds:
          - validations[priority=31]
          - errors.ERR_COMMITMENT_WEEKLY_VOLUME_EXCEEDED
        distinguishing_aspect: "Orders of 6000 then 4000 dozen exactly fill the 10000-dozen week (<=, so both pass); a further 1-dozen order exceeds the aggregate and is rejected — individually valid, collectively over."
        test_recipe:
          setup: ["Customer with ACTIVE commitment (weekly 10000, window [2026-09-01, 2027-03-01])."]
          setup_api_calls:
            - *c_clock0901
            - call: "POST /api/customers"
              payload: { name: "Sunrise Grocers", segment: "RETAIL", credit_limit_cents: 500000000 }
              as: PlatformAdmin
              captures: { cu_id: $.data.id }
            - call: "POST /api/customers/${cu_id}/commitments"
              payload: { program: "CONVENTIONAL", region_code: "MIDWEST", weekly_dozen_committed: 10000, price_adjustment_cents_per_dozen: 0, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-03-01T00:00:00Z" }
              as: SalesManager
              captures: { cm_id: $.data.id }
            - call: "POST /api/commitments/${cm_id}/activate"
              payload: {}
              as: SalesManager
          trigger:
            - call: "GET /api/commitments/${cm_id}"
              payload: {}
              as: SalesManager
              captures: { cm_v1: $.data.version }
            - call: "POST /api/commitments/${cm_id}/orders"
              payload: { ship_week_start: "2026-09-07T00:00:00Z", dozen_ordered: 6000, size_class: "LARGE", expected_commitment_version: "${cm_v1}" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { o1: $.data.id }
            - call: "GET /api/commitments/${cm_id}"
              payload: {}
              as: SalesManager
              captures: { cm_v2: $.data.version }
            - call: "POST /api/commitments/${cm_id}/orders"
              payload: { ship_week_start: "2026-09-07T00:00:00Z", dozen_ordered: 4000, size_class: "LARGE", expected_commitment_version: "${cm_v2}" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { o2: $.data.id }
            - call: "GET /api/commitments/${cm_id}"
              payload: {}
              as: SalesManager
              captures: { cm_v3: $.data.version }
            - call: "POST /api/commitments/${cm_id}/orders"
              payload: { ship_week_start: "2026-09-07T00:00:00Z", dozen_ordered: 1, size_class: "LARGE", expected_commitment_version: "${cm_v3}" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { err: $.data.error_id }
          assert:
            - "6000 then 4000 are both created 201 (4000 == 10000 - 6000 exactly fills the week)"
