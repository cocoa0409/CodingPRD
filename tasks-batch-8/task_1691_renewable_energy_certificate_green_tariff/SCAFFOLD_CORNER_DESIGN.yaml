              payload: {}
              as: GeneratorOperator
              as_user_id: "${g}"
            - call: "POST /greenpower/generators/${g}/verify"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-07-10T00:00:00Z", period_end: "2026-07-01T00:00:00Z", metered_kwh: 100 }
              as: GeneratorOperator
              as_user_id: "${g}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PERIOD_INVERTED and HTTP status == 400"

      - name: reading_future_period_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=20]", "errors[ERR_FUTURE_PERIOD]"]
        distinguishing_aspect: "period_end after the logical clock (default 2026-08-01T00:00:00Z) fails ERR_FUTURE_PERIOD; period_end exactly equal to the clock succeeds (inclusive boundary)."
        test_recipe:
          setup: ["Generator ACTIVE; clock at its 2026-08-01T00:00:00Z default"]
          setup_api_calls:
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g: $.data.id }
            - call: "POST /greenpower/generators/${g}/submit-verification"
              payload: {}
              as: GeneratorOperator
              as_user_id: "${g}"
            - call: "POST /greenpower/generators/${g}/verify"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-02T00:00:00Z", metered_kwh: 100 }
              as: GeneratorOperator
              as_user_id: "${g}"
              captures: { err: $.data.error_id }
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-07-31T00:00:00Z", period_end: "2026-08-01T00:00:00Z", metered_kwh: 100 }
              as: GeneratorOperator
