            - "GET /inventory-runouts?artwork_asset_id=${asset_id}&disposition=RUNOUT then returns total_count == 1 with units_scrapped == 0 and units_reworked == 0, so none of the three 400s left a partial write behind on the filterable projection"

  # ==========================================================================
  # §1.9 breadth walk, section 8 of 9: rbac over the seven §1.7 roles under
  # role_model segregation_of_duties. Covered: the shared read surface for all
  # seven roles (role_allow); eight exclusive-write crossings including four that
  # prove PlatformAdmin is not a hierarchical override (role_deny); the
  # discipline binding on the shared decision endpoint, contrasted against the
  # stage gate (role_deny); the entity_backed PrinterRep identity in both
  # mismatch directions (role_deny); both limbs of segregation of duties - the
  # version author and the repeat decider; and the priority-1 authentication
  # faults that outrank every existence check.
  # ==========================================================================
  - section: rbac
    instances:

      - name: every_one_of_the_seven_roles_reads_the_shared_get_surface_and_sees_the_same_row
        claim_type: role_allow
        grounds:
          - roles[PackagingCoordinator]
          - roles[BrandReviewer]
          - roles[LegalReviewer]
          - roles[RegulatoryReviewer]
          - roles[QualityReviewer]
          - roles[PrinterRep]
          - roles[PlatformAdmin]
          - endpoints[GET /briefs/{id}]
          - endpoints[GET /printers]
          - endpoints[GET /artwork-assets]
          - complexity_profile.role_model
        distinguishing_aspect: |
          §1.7 gives every one of the seven roles the same shared_operations line -
          every GET endpoint - so the read surface must be role-blind: seven
          identical requests differing only in X-User-Role must all return 200 with
          the same sku_code, status and asset_count. The interesting one is
          PrinterRep, whose identity is entity_backed on Printer: an implementation
          that generalises the printer identity check from POST /printer-proofs onto
          the read endpoints answers 403 here, and one that scopes reads to a vendor's
          own rows returns an empty artwork-asset list instead of the brief's assets.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One APPROVED brief SKU-1001 with no assets yet, so asset_count is 0."
            - "One printer Cascade Print Co, whose row id is the X-User-ID the PrinterRep requests carry (identity entity_backed:Printer)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /briefs"
              payload:
                sku_code: "SKU-1001"
                product_name: "Northgate Cocoa Carton 340g"
                regulatory_scheme: "FDA_FOOD"
                market_codes: ["US"]
                language_codes: ["en"]
                required_element_codes: ["NET_CONTENTS", "INGREDIENT_STATEMENT", "ALLERGEN_STATEMENT", "DATE_CODE_ZONE", "BARCODE", "RECYCLING_MARK", "ADDRESS_BLOCK"]
                structural_spec: { component_type: "CARTON", dimensions_mm: { l: 120, w: 60, h: 200 }, substrate_class: "COATED_PAPER", print_process: "OFFSET_LITHO" }
                net_contents_declaration: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { brief_id: "$.data.id" }
            - call: "POST /briefs/${brief_id}/decision"
              payload: {decision: "APPROVED", review_note: "Scheme and net contents confirmed."}
              as: RegulatoryReviewer
              as_user_id: "u_reg"
            - call: "POST /printers"
              payload:
                name: "Cascade Print Co"
                color_standard: "G7_MASTER"
                certified_substrates: ["COATED_PAPER", "FILM"]
                recovery_liability_cap_cents: 5000000
              as: PlatformAdmin
              as_user_id: "u_admin"
              captures: { printer_id: "$.data.id" }
          trigger:
            - call: "GET /briefs/${brief_id}"
              payload: {}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "GET /briefs/${brief_id}"
              payload: {}
              as: BrandReviewer
              as_user_id: "u_brand"
            - call: "GET /briefs/${brief_id}"
              payload: {}
              as: LegalReviewer
              as_user_id: "u_legal"
            - call: "GET /briefs/${brief_id}"
              payload: {}
              as: RegulatoryReviewer
              as_user_id: "u_reg"
            - call: "GET /briefs/${brief_id}"
              payload: {}
              as: QualityReviewer
              as_user_id: "u_qa"
            - call: "GET /briefs/${brief_id}"
              payload: {}
              as: PrinterRep
              as_user_id: "${printer_id}"
            - call: "GET /briefs/${brief_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "GET /printers"
              payload: {certification_status: "CERTIFIED"}
              as: PrinterRep
              as_user_id: "${printer_id}"
            - call: "GET /artwork-assets"
              payload: {brief_id: "${brief_id}"}
              as: PrinterRep
              as_user_id: "${printer_id}"
          assert:
            - "all seven GET /briefs/${brief_id} calls return 200 - PackagingCoordinator, BrandReviewer, LegalReviewer, RegulatoryReviewer, QualityReviewer, PrinterRep and PlatformAdmin alike"
            - "all seven responses report the same sku_code == SKU-1001, status == APPROVED, asset_count == 0 and version == 2 - the read is role-blind"
            - "GET /printers?certification_status=CERTIFIED as PrinterRep returns 200 with exactly 1 entry, the printer Cascade Print Co with performance_score 100.0"
            - "GET /artwork-assets?brief_id=${brief_id} as PrinterRep returns 200 with data == [] and total_count == 0 - an empty result because no assets exist, not because the vendor is scoped out"
            - "no response carries a 403 or an ERR_UNAUTHORIZED body"

      - name: roles_cannot_reach_each_others_exclusive_writes_and_platform_admin_is_no_override
        claim_type: role_deny
        grounds:
          - roles[PackagingCoordinator]
          - roles[RegulatoryReviewer]
          - roles[LegalReviewer]
          - roles[QualityReviewer]
          - roles[PlatformAdmin]
          - errors[ERR_UNAUTHORIZED]
          - validations[priority=2]
          - endpoints[POST /briefs]
          - endpoints[POST /briefs/{id}/decision]
          - endpoints[POST /printers]
          - endpoints[POST /marketing-claims/{id}/clearance]
          - endpoints[POST /element-checks/{id}/waiver]
          - endpoints[POST /artwork-versions/{id}/verify-elements]
        distinguishing_aspect: |
          Eight crossings of the §1.7 exclusivity lines, each answered with 403
          ERR_UNAUTHORIZED at priority 2 - i.e. BEFORE any state or payload check, so
          the DRAFT brief, the FAIL element check and the DRAFT claim in the fixture
          are all in states where the operation would otherwise succeed for the right
          role. Three of the eight are PlatformAdmin attempts, because §1.7's note
          says explicitly that PlatformAdmin is NOT a hierarchical override: an
          implementation that treats the admin role as a superuser answers 200 or 201
          to those three. The closing POST /printers as PlatformAdmin proves the same
          role is not blanket-denied either.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
