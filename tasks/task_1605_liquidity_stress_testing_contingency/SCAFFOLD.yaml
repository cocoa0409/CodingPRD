  - method: GET
    path: "/liquidity/collateral-pledges/{id}"
    description: "Get a pledge"
    roles: [TreasuryAnalyst, RiskOfficer, TreasuryOps, LiquidityCommittee]
    code: 200
    input: []
    output: CollateralPledge
    side_effects: []

  - method: POST
    path: "/liquidity/collateral-pledges/{id}/release"
    description: "Release an ACTIVE pledge; may cascade into line suspension"
    roles: [TreasuryOps]
    code: 200
    input: []
