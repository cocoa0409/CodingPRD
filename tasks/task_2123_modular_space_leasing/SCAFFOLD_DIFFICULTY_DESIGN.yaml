            - "DamageAssessment.${da1_id}.condition_grade_before == \"A\" and DamageAssessment.${da1_id}.condition_grade_after == \"C\""

  - rule_id: combinatorial_formula
    instances:

      - name: monthly_rate_rounds_each_line_before_summing
        grounds:
          - calculations.lease_monthly_rate
          - calculations.floorplan_config_surcharge
          - entities.Lease.fields.monthly_base_rate_cents
          - entities.FloorplanConfiguration.fields.config_surcharge_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where the ORDER changes the cents. The spec line
          raws to 114508.5 and the amortized configuration line raws to 12555.5555...;
          rounding each line half-up first and then adding yields 127065, whereas summing
          the raws (127064.0555...) and rounding once yields 127064. The scaffold pins
          round-per-line-then-sum, so 127065 is the only correct answer.
        test_recipe:
          setup:
            - "One branch, one permit-free jurisdiction TX-RUR (wind zone 1, GROUND_ANCHOR, no ADA)."
            - "A 20x48 single-section spec with base_monthly_rate_cents 118050 (floor_area_sqft 960)."
            - "A PUBLISHED configuration with 2 offices, 1 restroom, 22 linear ft of partition and 2.0 HVAC tons (config_surcharge_cents == 452000)."
            - "One GOLD customer (tier factor 0.97) and one IN_FLEET unit."
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Dallas Yard", region_code: "TX-N", yard_capacity_units: 25, daily_dispatch_capacity: 2, labor_rate_cents_per_hour: 9200 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { b1_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "TX-RUR", name: "Rural County", permit_required: false, permit_lead_days: 0, anchoring_standard: "GROUND_ANCHOR", wind_zone: 1, permit_fee_cents: 0, ada_ramp_required: false, min_ramp_run_ratio: 12.0 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { j2_id: $.data.id }
            - call: "POST /building-specs"
              payload: { model_code: "MOB-2048", width_ft: 20, length_ft: 48, sections: 1, floor_height_in: 24, base_monthly_rate_cents: 118050, delivery_base_cents: 165000, install_base_cents: 120000, replacement_value_cents: 6200000, max_occupancy: 12 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { s2_id: $.data.id }
            - call: "POST /floorplan-configurations"
              payload: { building_spec_id: "${s2_id}", name: "Open Plan", private_offices: 2, restrooms: 1, partition_linear_ft: 22, hvac_tons: 2.0 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { c2_id: $.data.id, c2_surcharge: $.data.config_surcharge_cents }
            - call: "POST /floorplan-configurations/${c2_id}/publish"
              payload: {}
              as: FleetAdmin
              as_user_id: "admin-ops-1"
            - call: "POST /units"
              payload: { serial_number: "MSU-2001", building_spec_id: "${s2_id}", current_branch_id: "${b1_id}", condition_grade: "A" }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { u2_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Basin Drilling", billing_email: "ap@basin.test", credit_tier: "GOLD", credit_limit_cents: 5000000 }
              as: LeasingAgent
              as_user_id: "agent-77"
              captures: { cu2_id: $.data.id }
          trigger:
            - call: "POST /leases"
              payload: { customer_id: "${cu2_id}", unit_id: "${u2_id}", jurisdiction_id: "${j2_id}", floorplan_configuration_id: "${c2_id}", site_address: "9 County Road 12, Rural TX", start_date: "2026-10-01", term_months: 12 }
              as: LeasingAgent
              as_user_id: "agent-77"
              captures: { l2_id: $.data.id }
          assert:
            - "FloorplanConfiguration.${c2_id}.config_surcharge_cents == 452000"
            - "Lease.${l2_id}.monthly_base_rate_cents == 127065"
            - "Lease.${l2_id}.monthly_base_rate_cents != 127064"
            - "Lease.${l2_id}.end_date == \"2027-09-25\""
            - "Lease.${l2_id}.pinned_credit_tier == \"GOLD\""

      - name: mobilization_discount_tier_keyed_on_presale_subtotal
        grounds:
          - calculations.lease_mobilization_fee
          - calculations.lease_charge_total
          - entities.Lease.fields.mobilization_fee_cents
          - entities.Lease.fields.quoted_total_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with a pinned evaluation order. The
          discount tier is selected from transport_subtotal_cents (370000 -> 5%), producing
          mobilization_fee_cents 351500 and quoted_total_cents 1876280. Keying the same tier
          off the grand total (1876280 >= 800000 -> 9%) would produce 336700 / 1861480, so
          the two orderings are separable by a single assertion.
        test_recipe:
          setup:
            - "Identical catalog to monthly_rate_rounds_each_line_before_summing: TX-RUR jurisdiction with GROUND_ANCHOR anchoring, a spec whose delivery+install list is 165000+120000."
            - "One GOLD customer and one IN_FLEET unit, no accessory package yet."
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Dallas Yard", region_code: "TX-N", yard_capacity_units: 25, daily_dispatch_capacity: 2, labor_rate_cents_per_hour: 9200 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { b1_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "TX-RUR", name: "Rural County", permit_required: false, permit_lead_days: 0, anchoring_standard: "GROUND_ANCHOR", wind_zone: 1, permit_fee_cents: 0, ada_ramp_required: false, min_ramp_run_ratio: 12.0 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { j2_id: $.data.id }
            - call: "POST /building-specs"
              payload: { model_code: "MOB-2048", width_ft: 20, length_ft: 48, sections: 1, floor_height_in: 24, base_monthly_rate_cents: 118050, delivery_base_cents: 165000, install_base_cents: 120000, replacement_value_cents: 6200000, max_occupancy: 12 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
