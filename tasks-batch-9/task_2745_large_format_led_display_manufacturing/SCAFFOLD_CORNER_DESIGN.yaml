      - name: drive_level_is_capped_by_the_lower_of_two_certifications
        claim_type: violation_to_error
        grounds:
          - validations[priority=31]
          - errors.ERR_DRIVE_LEVEL_UNSAFE
        distinguishing_aspect: |
          The ceiling is min(DisplayModel.max_drive_pct, chamber.certified_max_drive_pct)
          and the two limits are deliberately unequal on both sides of the pair: in
          the generous chamber (95) the model's 90 binds, and in the conservative
          chamber (80) the chamber binds at a level the model would allow. An
          implementation that checks only one of the two operands passes one of
          these triggers and fails the other, and exactly 90 in the generous
          chamber must still be accepted.
        test_recipe:
          setup:
            - "An FP10-IN project (max_drive_pct 90) with cabinet ${cab} POPULATED; chambers ${ch_hi} (certified 95) and ${ch_lo} (certified 80)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP10-IN", pixel_pitch_mm: 10.0, rated_brightness_nits: 5000, environmental_rating: "IP43_INDOOR", module_width_mm: 320, module_height_mm: 320, module_pixel_cols: 32, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 1, cabinet_weight_kg: 10.24, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 976.56, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
            - call: "POST /burn-in-chambers"
              payload: { name: "CH-HIGH", slot_capacity: 4, turnaround_minutes: 60, certified_max_drive_pct: 95 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { ch_hi: $.data.id }
            - call: "POST /burn-in-chambers"
              payload: { name: "CH-LOW", slot_capacity: 4, turnaround_minutes: 60, certified_max_drive_pct: 80 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { ch_lo: $.data.id }
            - call: "POST /projects"
              payload: { customer_name: "Drive Ceiling Wall", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 10.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { pj: $.data.id }
            - call: "POST /drawing-revisions"
              payload: { project_id: "${pj}", structural_load_kg_per_sqm: 100.00, wind_load_kph: 100, mounting_type: "WALL", service_access_side: "FRONT" }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { rev: $.data.id }
            - call: "POST /drawing-revisions/${rev}/review"
              payload: { decision: "APPROVE" }
              as: StructuralReviewer
              as_user_id: "rev-1"
            - call: "POST /cabinets"
              payload: { project_id: "${pj}", grid_row: 1, grid_col: 1 }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { cab: $.data.id }
            - call: "POST /modules"
              payload: { display_model_id: "${dm}", serial_no: "M-1" }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { m1: $.data.id }
            - call: "POST /modules/${m1}/pixel-test"
              payload: { dead_pixel_count: 0, max_cluster_size: 0 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules/${m1}/calibrate"
              payload: { measured_brightness_nits: 4900, measured_color_x: 0.3130, measured_color_y: 0.3290 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "GET /cabinets/${cab}"
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { cabv: $.data.version }
            - call: "POST /cabinets/${cab}/modules"
              payload: { module_id: "${m1}", slot_index: 1, expected_cabinet_version: "${cabv}" }
              as: ProductionOperator
              as_user_id: "op-1"
          trigger:
            - call: "POST /burn-in-runs"
              payload: { cabinet_id: "${cab}", burn_in_chamber_id: "${ch_hi}", window_start: "2026-08-02T00:00:00.000Z", window_end: "2026-08-03T00:00:00.000Z", slots_required: 1, drive_pct: 91, ambient_c: 45.0 }
              as: QAEngineer
              as_user_id: "qa-1"
