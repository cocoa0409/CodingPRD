  - rule_id: non_linear_state_machine
    instances:

      - name: piece_production_and_qc_dimensions_advance_independently
        grounds:
          - state_machines.Piece.production_status.STRIPPED_to_YARDED
          - state_machines.Piece.qc_status.CLEARED_to_NONCONFORMING
          - entities.Piece.fields.production_status
          - entities.Piece.fields.qc_status
          - entities.Piece.fields.qc_hold_reason
          - concurrency_rules[ncr-create-stale-piece]
        distinguishing_aspect: |
          Piece is the parallel-dimension machine: production_status and qc_status live on the same
          row and advance on unrelated triggers. Opening an NCR moves qc_status CLEARED ->
          NONCONFORMING while leaving production_status at YARDED and leaving the yard placement
          and slot occupancy completely untouched.
        test_recipe:
          setup:
            - "Piece DT-101 has been cast on run R1, cleared by release strength, stripped and placed in yard slot S1."
            - "Piece DT-101 therefore carries production_status YARDED on one dimension and qc_status CLEARED on the other."
