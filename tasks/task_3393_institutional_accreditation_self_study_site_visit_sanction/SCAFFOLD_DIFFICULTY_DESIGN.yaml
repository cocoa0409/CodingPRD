          Buffered half-open interval semantics on the REVIEWER resource:
          reviewer R's ON_SITE visit 2027-03-10T09:00 -> 2027-03-12T17:00 is
          buffered one day each side to [03-09T09:00, 03-13T17:00); a VIRTUAL
