      - name: endpoint_census_run_monthly_postings_are_idempotent_per_month
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_svh__ops_census_run
          - calculations.trust_fund_running_balance
        distinguishing_aspect: |
          The checkpoint has two different idempotency clocks and they must not be confused: CensusDay
          generation is per DAY (a re-run for the same through_date generates nothing, a run one day
          later generates exactly one row), while the PNA credit is per calendar MONTH (a second run
          in August credits nothing, the first run in September credits again). An implementation that
          posts the PNA on every run reaches 27000 instead of 18000 after four runs; one that keys the
          PNA off census generation never credits September at all.
        test_recipe:
          setup:
            - "One Resident admitted 2026-08-01 into a CERTIFIED NURSING unit of a RECOGNIZED home whose personal_needs_allowance_monthly_cents is the 9000 default."
            - "The resident has no IncomeRecord and no CostShareDetermination, so the governing monthly_cost_share_cents is 0 and no COST_SHARE_DEBIT is ever due."
            - "The logical clock stands at 2026-08-01T00:00:00Z."
