  # =========================================================================
  # Rule 8 - resource_temporal_overlap (aggregate capacity vs exclusive half-open)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: storage_reservation_per_day_aggregate_capacity
        grounds:
          - calculations.storage_overlap_capacity
          - errors[ERR_STORAGE_CAPACITY_EXCEEDED]
          - entities.StorageFacility.fields.capacity_tons
        distinguishing_aspect: |
          Interval semantics = per-day AGGREGATE capacity on StorageFacility: overlaps are
          allowed until the sum of tons covering any single day would exceed capacity_tons
          (equality allowed). R3 at 101 t pushes 2026-08-07 to 1001 > 1000 and is rejected;
          R4 at 100 t lands exactly on 1000 and succeeds; R5 starting on R2's exclusive end date
          overlaps nothing (adjacency).
        test_recipe:
          setup:
            - "Facility cap 1000 accepting FLY_ASH; one stream; R1 600 t [2026-08-01, 2026-08-10) and R2 300 t [2026-08-05, 2026-08-15) already RESERVED (peak day total 900); clock default 2026-08-01"
          setup_api_calls:
            - { call: "POST /api/generators", payload: { legal_name: "GenCo", hq_state_code: "OH", contact_email: "g@x.com" }, as: BrokerOps, captures: { g_id: $.data.id } }
            - { call: "POST /api/streams", payload: { generator_id: "${g_id}", material_type: "FLY_ASH", declared_moisture_pct: 9.0, expected_tons_per_month: 500 }, as: Generator, as_user_id: "${g_id}", captures: { s_id: $.data.id } }
            - { call: "POST /api/storage-facilities", payload: { state_code: "OH", material_types_allowed: ["FLY_ASH"], capacity_tons: 1000 }, as: BrokerOps, captures: { f_id: $.data.id } }
            - { call: "POST /api/storage-reservations", payload: { facility_id: "${f_id}", stream_id: "${s_id}", start_date: "2026-08-01", end_date: "2026-08-10", tons: 600 }, as: BrokerOps, captures: { r1_id: $.data.id } }
            - { call: "POST /api/storage-reservations", payload: { facility_id: "${f_id}", stream_id: "${s_id}", start_date: "2026-08-05", end_date: "2026-08-15", tons: 300 }, as: BrokerOps, captures: { r2_id: $.data.id } }
          trigger:
            - { call: "POST /api/storage-reservations", payload: { facility_id: "${f_id}", stream_id: "${s_id}", start_date: "2026-08-07", end_date: "2026-08-08", tons: 101 }, as: BrokerOps, captures: { err: $.data.error_id } }
            - { call: "POST /api/storage-reservations", payload: { facility_id: "${f_id}", stream_id: "${s_id}", start_date: "2026-08-07", end_date: "2026-08-08", tons: 100 }, as: BrokerOps, captures: { r4_id: $.data.id } }
            - { call: "POST /api/storage-reservations", payload: { facility_id: "${f_id}", stream_id: "${s_id}", start_date: "2026-08-15", end_date: "2026-08-20", tons: 1000 }, as: BrokerOps, captures: { r5_id: $.data.id } }
          assert:
            - "err == ERR_STORAGE_CAPACITY_EXCEEDED with HTTP 422 (1001 > 1000 on 2026-08-07)"
            - "StorageReservation.${r4_id}.status == RESERVED (day total exactly 1000 <= 1000)"
            - "StorageReservation.${r5_id}.status == RESERVED (start on R2's exclusive end date = adjacency, no overlap)"

      - name: eligibility_window_half_open_exclusivity
        grounds:
          - validations[priority=10]
          - errors[ERR_ELIGIBILITY_WINDOW_OVERLAP]
          - entities.ReuseEligibility.fields.valid_until
        distinguishing_aspect: |
          Interval semantics = EXCLUSIVE half-open windows on the (stream, state) determination
          set - a different resource and different semantics than the storage aggregate-capacity
          rule: any non-zero overlap is forbidden, but back-to-back windows
          (valid_from == prior valid_until) are allowed. D2 [2026-07-01, ...) adjacent to D1
          [..., 2026-07-01) submits cleanly; D3 starting 2026-06-30 overlaps D1 and is rejected.
        test_recipe:
          setup:
            - "GYPSUM stream with VERIFIED characterization; D1 APPROVED for OH with window [2026-01-01, 2026-07-01); D2 and D3 filed as DRAFTs for OH; clock default 2026-08-01"
          setup_api_calls:
            - { call: "POST /api/generators", payload: { legal_name: "GenCo", hq_state_code: "OH", contact_email: "g@x.com" }, as: BrokerOps, captures: { g_id: $.data.id } }
            - { call: "POST /api/streams", payload: { generator_id: "${g_id}", material_type: "GYPSUM", declared_moisture_pct: 6.0, expected_tons_per_month: 200 }, as: Generator, as_user_id: "${g_id}", captures: { s_id: $.data.id } }
            - { call: "POST /api/streams/${s_id}/characterizations", payload: { lab_name: "LabCo", sampled_on: "2026-07-01", ph: 7.0, arsenic_ppm: 1.0, lead_ppm: 1.0, moisture_pct_measured: 6.5 }, as: Generator, as_user_id: "${g_id}", captures: { c_id: $.data.id } }
            - { call: "POST /api/characterizations/${c_id}/verify", payload: {}, as: BrokerOps }
            - { call: "POST /api/streams/${s_id}/eligibility-determinations", payload: { state_code: "OH", use_case: "SOIL_AMENDMENT", valid_from: "2026-01-01", valid_until: "2026-07-01" }, as: ComplianceOfficer, as_user_id: "co_file", captures: { d1_id: $.data.id } }
            - { call: "POST /api/eligibility-determinations/${d1_id}/submit", payload: {}, as: ComplianceOfficer, as_user_id: "co_file" }
            - { call: "POST /api/eligibility-determinations/${d1_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co_appr" }
            - { call: "POST /api/streams/${s_id}/eligibility-determinations", payload: { state_code: "OH", use_case: "SOIL_AMENDMENT", valid_from: "2026-07-01", valid_until: "2027-01-01" }, as: ComplianceOfficer, as_user_id: "co_file", captures: { d2_id: $.data.id } }
            - { call: "POST /api/streams/${s_id}/eligibility-determinations", payload: { state_code: "OH", use_case: "ROAD_BASE", valid_from: "2026-06-30", valid_until: "2026-12-01" }, as: ComplianceOfficer, as_user_id: "co_file", captures: { d3_id: $.data.id } }
          trigger:
            - { call: "POST /api/eligibility-determinations/${d2_id}/submit", payload: {}, as: ComplianceOfficer, as_user_id: "co_file" }
            - { call: "POST /api/eligibility-determinations/${d3_id}/submit", payload: {}, as: ComplianceOfficer, as_user_id: "co_file", captures: { err: $.data.error_id } }
          assert:
            - "ReuseEligibility.${d2_id}.status == SUBMITTED (adjacent to APPROVED D1: valid_from == D1.valid_until, half-open, no overlap)"
            - "err == ERR_ELIGIBILITY_WINDOW_OVERLAP with HTTP 409 for D3 (2026-06-30 < 2026-07-01 overlaps D1)"
            - "ReuseEligibility.${d1_id}.status remains APPROVED"

  # =========================================================================
  # Rule 9 - compensating_invariant (inventory tons vs credit balance)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: storage_check_in_release_conserves_inventory_tons
        grounds:
          - state_machines.StorageReservation.RESERVED_to_CHECKED_IN
          - state_machines.StorageReservation.CHECKED_IN_to_RELEASED
          - entities.StorageFacility.fields.current_inventory_tons
        distinguishing_aspect: |
          Conserved quantity = stored tonnage: current_inventory_tons is pinned as
          sum(reservation.tons where status == CHECKED_IN). A 400 t check-in followed by its
          release returns the facility to exactly its pre-reservation inventory (0).
        test_recipe:
          setup:
            - "Facility cap 1000 accepting FLY_ASH with current_inventory_tons == 0; one stream; a 400 t reservation [2026-08-01, 2026-08-10) RESERVED; clock default 2026-08-01 (inside the half-open window)"
          setup_api_calls:
            - { call: "POST /api/generators", payload: { legal_name: "GenCo", hq_state_code: "OH", contact_email: "g@x.com" }, as: BrokerOps, captures: { g_id: $.data.id } }
            - { call: "POST /api/streams", payload: { generator_id: "${g_id}", material_type: "FLY_ASH", declared_moisture_pct: 9.0, expected_tons_per_month: 500 }, as: Generator, as_user_id: "${g_id}", captures: { s_id: $.data.id } }
            - { call: "POST /api/storage-facilities", payload: { state_code: "OH", material_types_allowed: ["FLY_ASH"], capacity_tons: 1000 }, as: BrokerOps, captures: { f_id: $.data.id } }
            - { call: "POST /api/storage-reservations", payload: { facility_id: "${f_id}", stream_id: "${s_id}", start_date: "2026-08-01", end_date: "2026-08-10", tons: 400 }, as: BrokerOps, captures: { r_id: $.data.id } }
          trigger:
            - { call: "POST /api/storage-reservations/${r_id}/check-in", payload: {}, as: BrokerOps }
            - { call: "GET /api/storage-facilities/${f_id}", payload: {}, as: BrokerOps }
            - { call: "POST /api/storage-reservations/${r_id}/release", payload: {}, as: BrokerOps }
            - { call: "GET /api/storage-facilities/${f_id}", payload: {}, as: BrokerOps }
          assert:
            - "after check-in: StorageFacility.${f_id}.current_inventory_tons == 400"
            - "after release: StorageFacility.${f_id}.current_inventory_tons == 0 (equals the pre-reservation value; no drift)"
            - "StorageReservation.${r_id}.status == RELEASED"
            - "invariant holds: current_inventory_tons == sum of tons over CHECKED_IN reservations at every step"

      - name: accrual_void_reversal_conserves_credit_balance
        grounds:
          - state_machines.Shipment.ACCEPTED_to_VOIDED
          - calculations.sustainability_credit_accrual
          - entities.Generator.fields.total_credits
        distinguishing_aspect: |
          Conserved quantity = credit balance (different quantity than storage tonnage):
          total_credits is pinned as sum(ACCRUAL.credits) - sum(REVERSAL.credits). Voiding the
          45 t accepted shipment posts a REVERSAL of exactly 45.00, returning total_credits to
          60.0 - its value before that acceptance - and dropping the tier back to STANDARD.
        test_recipe:
          setup:
            - "Dispatch-ready PA chain; agreement and commitment committed 500; index 300; S1 (60 t) and S2 (45 t) both ACCEPTED (total_credits 105.0, tier SILVER); clock default 2026-08-01"
          setup_api_calls:
            - { call: "POST /api/generators", payload: { legal_name: "GenCo", hq_state_code: "OH", contact_email: "g@x.com" }, as: BrokerOps, captures: { g_id: $.data.id } }
            - { call: "POST /api/offtakers", payload: { legal_name: "OffCo", hq_state_code: "PA", receiving_state_codes: ["PA", "WV"] }, as: BrokerOps, captures: { o_id: $.data.id } }
            - { call: "POST /api/streams", payload: { generator_id: "${g_id}", material_type: "FLY_ASH", declared_moisture_pct: 9.0, expected_tons_per_month: 500 }, as: Generator, as_user_id: "${g_id}", captures: { s_id: $.data.id } }
            - { call: "POST /api/streams/${s_id}/characterizations", payload: { lab_name: "LabCo", sampled_on: "2026-07-01", ph: 7.2, arsenic_ppm: 3.0, lead_ppm: 2.0, moisture_pct_measured: 9.5 }, as: Generator, as_user_id: "${g_id}", captures: { c_id: $.data.id } }
            - { call: "POST /api/characterizations/${c_id}/verify", payload: {}, as: BrokerOps }
            - { call: "POST /api/streams/${s_id}/eligibility-determinations", payload: { state_code: "PA", use_case: "CEMENT_ADDITIVE", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: ComplianceOfficer, as_user_id: "co_file", captures: { d_id: $.data.id } }
            - { call: "POST /api/eligibility-determinations/${d_id}/submit", payload: {}, as: ComplianceOfficer, as_user_id: "co_file" }
            - { call: "POST /api/eligibility-determinations/${d_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co_appr" }
            - { call: "POST /api/state-permits", payload: { state_code: "PA", material_type: "FLY_ASH", regime: "PERMIT", permit_number: "PA-001", issued_on: "2026-01-01", expires_on: "2026-12-31" }, as: ComplianceOfficer, as_user_id: "co_file", captures: { p_id: $.data.id } }
            - { call: "POST /api/state-permits/${p_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_file" }
            - { call: "POST /api/supply-agreements", payload: { generator_id: "${g_id}", stream_id: "${s_id}", committed_monthly_tons: 500, revenue_share_pct_to_generator: 0.6, freight_share_pct_to_generator: 0.25, term_start: "2026-01-01", term_end: "2026-12-31" }, as: Generator, as_user_id: "${g_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/supply-agreements/${a_id}/activate", payload: {}, as: BrokerOps }
            - { call: "GET /api/supply-agreements/${a_id}", payload: {}, as: BrokerOps, captures: { a_v1: $.data.version } }
            - { call: "POST /api/offtake-commitments", payload: { offtaker_id: "${o_id}", stream_id: "${s_id}", destination_state_code: "PA", committed_monthly_tons: 500, max_moisture_pct: 10.0, max_arsenic_ppm: 5.0 }, as: Offtaker, as_user_id: "${o_id}", captures: { k_id: $.data.id } }
            - { call: "POST /api/offtake-commitments/${k_id}/activate", payload: {}, as: BrokerOps }
            - { call: "POST /api/price-index-entries", payload: { material_type: "FLY_ASH", region_code: "PA", effective_from: "2026-01-01", price_cents_per_ton: 300 }, as: BrokerOps }
