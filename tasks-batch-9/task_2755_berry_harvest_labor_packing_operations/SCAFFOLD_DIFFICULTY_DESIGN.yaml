            - "level 4: Picker.${pk1}.total_clamshells_lifetime == 0 and Picker.${pk1}.total_hours_lifetime == 0.00 and Picker.${pk1}.avg_lbs_per_hour == 0.00"
            - "HarvestWindow.${win}.harvested_clamshells == 0"
            - "FruitLot.${lot}.food_safety_hold == true and FruitLot.${lot}.disposition_status == UNCOMMITTED"
            - "PickSession.${ses1}.net_cents == 4950 (pay figures retained for audit even though the accrual was reversed)"

      - name: lot_rejection_cascades_three_levels_to_buyer_commitment_exposure
        grounds:
          - state_machines.FruitLot.RESERVED_to_REJECTED
          - state_machines.LotAllocation.RESERVED_to_RELEASED
          - calculations.commitment_settlement
          - entities.BuyerCommitment.fields.committed_lbs
          - entities.LotAllocation.fields.release_reason_code
        distinguishing_aspect: |
          A different cascade root and a different chain than the quarantine
          instance: rejecting one FruitLot propagates through THREE levels —
          FruitLot REJECTED -> LotAllocation RELEASED with release_reason_code
          LOT_REJECTED -> BuyerCommitment.committed_lbs back to 0.00 with
          open_lbs restored to 100.00 — and the commercial ledger, not the wage
          ledger, is the terminal level.
        test_recipe:
          setup:
            - "One STRAWBERRY block, one crew, one PLANNED window spanning 2026-08-03, one tunnel with slot_capacity 4."
            - "One grade-A lot of 100 clamshells at 1.00 lb, cooled to COOLED."
            - "One OPEN buyer commitment for 100.00 lbs of STRAWBERRY at 400 cents/lb, delivery window 2026-08-01..2026-08-10."
            - "One RESERVED allocation line of 60.00 lbs against that lot and commitment."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-TC2", variety: "STRAWBERRY", acres: 5.00, planting_year: 2023, irrigation_source_code: "WELL-9" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-TC2", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-03T05:00:00Z", end_at: "2026-08-03T17:00:00Z", forecast_brix: 8.5, planned_volume_lbs: 150.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win: $.data.id }
            - call: "POST /berry-ops/cooling-tunnels"
              payload: { name: "TUN-TC2", slot_capacity: 4, target_pulp_temp_f: 34.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
              captures: { tun: $.data.id, tun_v1: $.data.version }
            - call: "POST /berry-ops/fruit-lots"
              payload: { harvest_window_id: "${win}", block_id: "${blk}", pick_date: "2026-08-03", variety: "STRAWBERRY", grade: "A", clamshell_count: 100, clamshell_net_weight_lbs: 1.00, pack_completed_at: "2026-08-03T06:00:00Z", field_pulp_temp_f: 65.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
              captures: { lot: $.data.id }
            - call: "POST /berry-ops/fruit-lots/${lot}/start-cooling"
              payload: { cooling_tunnel_id: "${tun}", cool_start_at: "2026-08-03T08:00:00Z", planned_cool_end_at: "2026-08-03T12:00:00Z", entry_pulp_temp_f: 58.0, pallet_slots: 1, expected_cooling_tunnel_version: "${tun_v1}" }
              as: PackhouseOperator
              as_user_id: "pack-1"
            - call: "POST /berry-ops/fruit-lots/${lot}/complete-cooling"
              payload: { cool_complete_at: "2026-08-03T12:00:00Z", exit_pulp_temp_f: 34.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
            - call: "POST /berry-ops/buyer-commitments"
              payload: { buyer_name: "GreenGrocer", buyer_user_id: "buyer-3", variety: "STRAWBERRY", volume_commitment_lbs: 100.00, price_cents_per_lb: 400, shelf_life_guarantee_days: 5, window_start_date: "2026-08-01", window_end_date: "2026-08-10" }
              as: SalesManager
              as_user_id: "sales-1"
              captures: { com: $.data.id, com_v1: $.data.version }
            - call: "POST /berry-ops/lot-allocations"
              payload: { fruit_lot_id: "${lot}", buyer_commitment_id: "${com}", allocated_lbs: 60.00, expected_buyer_commitment_version: "${com_v1}" }
              as: SalesManager
              as_user_id: "sales-1"
              captures: { alloc: $.data.id }
          trigger:
            - call: "POST /berry-ops/fruit-lots/${lot}/reject"
              payload: { reject_reason_code: "SOFT_FRUIT_BREAKDOWN" }
              as: PackhouseOperator
              as_user_id: "pack-1"
          assert:
            - "level 1: FruitLot.${lot}.disposition_status == REJECTED and FruitLot.${lot}.food_safety_hold == true and FruitLot.${lot}.available_lbs == 0.00 and FruitLot.${lot}.reject_reason_code == SOFT_FRUIT_BREAKDOWN"
            - "level 2: LotAllocation.${alloc}.status == RELEASED and LotAllocation.${alloc}.release_reason_code == LOT_REJECTED"
            - "level 3: BuyerCommitment.${com}.committed_lbs == 0.00 and BuyerCommitment.${com}.open_lbs == 100.00 and BuyerCommitment.${com}.shipped_lbs == 0.00"
            - "BuyerCommitment.${com}.status == OPEN and BuyerCommitment.${com}.fill_status == PENDING"
            - "FruitLot.${lot}.cold_chain_status == COOLED (the cold-chain dimension is untouched by the rejection)"

  - rule_id: priority_pair_validation_conflict
    instances:

      - name: suspended_window_state_error_precedes_block_quarantine_safety_error
        grounds:
          - validations[priority=28]
          - validations[priority=38]
          - state_machines.HarvestWindow.CONFIRMED_to_SUSPENDED
          - errors[ERR_INVALID_WINDOW_STATE]
          - errors[ERR_BLOCK_QUARANTINED]
        distinguishing_aspect: |
          A single open call violates a TIER-8 STATE rule (window is SUSPENDED,
          not CONFIRMED) and a TIER-9 BUSINESS_SAFETY rule (the block is
          QUARANTINED) at once; the response must be ERR_INVALID_WINDOW_STATE
          (409), never ERR_BLOCK_QUARANTINED, and the window must stay SUSPENDED.
        test_recipe:
          setup:
            - "One STRAWBERRY block with a passing water sample so posture starts CLEARED."
            - "One DOMESTIC crew with one picker, support plan complete, CERTIFIED."
            - "One harvest window on 2026-08-03, CONFIRMED but not yet opened."
            - "The block then quarantined, which suspends the CONFIRMED window — so both the state rule and the safety rule are now violated by an open call."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-PP1", variety: "STRAWBERRY", acres: 4.00, planting_year: 2023, irrigation_source_code: "WELL-10" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-20", generic_ecoli_mpn: 40 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-PP1", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/pickers"
              payload: { crew_id: "${crew}", full_name: "Picker PP", hygiene_training_on: "2026-06-01" }
              as: CrewSupervisor
              as_user_id: "sup-1"
              captures: { pk1: $.data.id }
            - call: "POST /berry-ops/crews/${crew}/support-plan"
              payload: { housing_unit_code: "H-4", beds_confirmed: 1, transport_route_code: "R-4", vehicle_seats: 1 }
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/crews/${crew}/certify"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-03T06:00:00Z", end_at: "2026-08-03T14:00:00Z", forecast_brix: 8.5, planned_volume_lbs: 150.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win: $.data.id }
            - call: "POST /berry-ops/harvest-windows/${win}/confirm"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/blocks/${blk}/quarantine"
              payload: { quarantine_reason_code: "IRRIGATION_LINE_CONTAMINATION" }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
          trigger:
            - call: "POST /berry-ops/harvest-windows/${win}/open"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status is 409 and $.data.error_id == ERR_INVALID_WINDOW_STATE"
            - "$.data.error_id != ERR_BLOCK_QUARANTINED"
            - "HarvestWindow.${win}.status == SUSPENDED and HarvestWindow.${win}.suspended_reason_code == BLOCK_QUARANTINE"
            - "Crew.${crew}.status == CERTIFIED (the refused open did not activate the crew)"

      - name: lot_block_mismatch_referential_error_precedes_pick_date_temporal_error
        grounds:
          - validations[priority=52]
          - validations[priority=55]
          - errors[ERR_LOT_BLOCK_MISMATCH]
          - errors[ERR_PICK_DATE_OUTSIDE_WINDOW]
        distinguishing_aspect: |
          A different error-category pair from the state/safety instance: this
          single fruit-lot create violates a TIER-11 BUSINESS_REFERENTIAL rule
          (block_id is a second block, not the window's block) and a TIER-12
          BUSINESS_TEMPORAL rule (pick_date 2026-08-09 is outside the window's
          2026-08-03 span), and must answer ERR_LOT_BLOCK_MISMATCH (422), never
          ERR_PICK_DATE_OUTSIDE_WINDOW, with no FruitLot row created.
        test_recipe:
          setup:
            - "Two STRAWBERRY blocks, neither quarantined."
            - "One crew and one PLANNED harvest window on the FIRST block spanning only 2026-08-03."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-PP2-A", variety: "STRAWBERRY", acres: 4.00, planting_year: 2023, irrigation_source_code: "WELL-11" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk_a: $.data.id }
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-PP2-B", variety: "STRAWBERRY", acres: 4.00, planting_year: 2023, irrigation_source_code: "WELL-12" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk_b: $.data.id }
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-PP2", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk_a}", crew_id: "${crew}", start_at: "2026-08-03T05:00:00Z", end_at: "2026-08-03T17:00:00Z", forecast_brix: 8.5, planned_volume_lbs: 150.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win: $.data.id }
          trigger:
            - call: "POST /berry-ops/fruit-lots"
              payload: { harvest_window_id: "${win}", block_id: "${blk_b}", pick_date: "2026-08-09", variety: "STRAWBERRY", grade: "A", clamshell_count: 40, clamshell_net_weight_lbs: 1.00, pack_completed_at: "2026-08-09T06:00:00Z", field_pulp_temp_f: 64.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status is 422 and $.data.error_id == ERR_LOT_BLOCK_MISMATCH"
            - "$.data.error_id != ERR_PICK_DATE_OUTSIDE_WINDOW"
            - "GET /berry-ops/fruit-lots?harvest_window_id=${win} returns an empty list"
            - "HarvestWindow.${win}.packed_lbs == 0.00"

  - rule_id: boundary_precision_check
    instances:

      - name: water_geometric_mean_exactly_at_limit_is_compliant
        grounds:
          - calculations.water_quality_status
          - entities.Block.fields.water_geomean_mpn
          - entities.Block.fields.water_status
          - validations[priority=41]
        distinguishing_aspect: |
          The geometric-mean criterion is INCLUSIVE at exactly 126: a block whose
          three samples are 63, 126 and 252 MPN has water_geomean_mpn 126.0 and
          water_status COMPLIANT, while a block whose third sample is 253 instead
          of 252 has water_geomean_mpn 126.2 and water_status NON_COMPLIANT — a
          one-unit input change straddling the boundary.
        test_recipe:
          setup:
            - "Two STRAWBERRY blocks with no samples yet (water_status NO_SAMPLES, posture RESTRICTED)."
            - "Block A receives 63 MPN on 2026-07-20 and 126 MPN on 2026-07-24; block B receives the identical first two samples."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-BP1-A", variety: "STRAWBERRY", acres: 3.00, planting_year: 2023, irrigation_source_code: "CANAL-1" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk_a: $.data.id }
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-BP1-B", variety: "STRAWBERRY", acres: 3.00, planting_year: 2023, irrigation_source_code: "CANAL-2" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk_b: $.data.id }
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk_a}", sample_date: "2026-07-20", generic_ecoli_mpn: 63 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk_a}", sample_date: "2026-07-24", generic_ecoli_mpn: 126 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk_b}", sample_date: "2026-07-20", generic_ecoli_mpn: 63 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk_b}", sample_date: "2026-07-24", generic_ecoli_mpn: 126 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
          trigger:
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk_a}", sample_date: "2026-07-28", generic_ecoli_mpn: 252 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
              captures: { wt_a: $.data.id, wt_a_status: $.data.resulting_water_status }
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk_b}", sample_date: "2026-07-28", generic_ecoli_mpn: 253 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
              captures: { wt_b: $.data.id, wt_b_status: $.data.resulting_water_status }
          assert:
            - "before the trigger both blocks had water_sample_count 2 and water_status PROVISIONAL"
            - "Block.${blk_a}.water_sample_count == 3 and Block.${blk_a}.water_geomean_mpn == 126.0"
            - "Block.${blk_a}.water_status == COMPLIANT and Block.${blk_a}.food_safety_posture == CLEARED"
            - "Block.${blk_b}.water_sample_count == 3 and Block.${blk_b}.water_geomean_mpn == 126.2"
            - "Block.${blk_b}.water_status == NON_COMPLIANT and Block.${blk_b}.food_safety_posture == RESTRICTED"
            - "WaterTest.${wt_a}.single_sample_exceedance == false and WaterTest.${wt_a}.resulting_water_status == COMPLIANT"
            - "WaterTest.${wt_b}.single_sample_exceedance == false and WaterTest.${wt_b}.resulting_water_status == NON_COMPLIANT"
            - "neither block is quarantined: Block.${blk_a}.manual_quarantine_active == false and Block.${blk_b}.manual_quarantine_active == false"

      - name: payroll_settle_with_empty_bound_session_set_succeeds_with_zero_totals
        grounds:
          - calculations.payroll_period_averaged_settlement
          - state_machines.PayrollRun.DRAFT_to_LOCKED
          - state_machines.PayrollRun.LOCKED_to_SETTLED
          - entities.PayrollRun.fields.bound_session_count
        distinguishing_aspect: |
          The EMPTY input-set boundary of the aggregation: a run whose bound
          session set is the empty set must lock and settle successfully with
          period_hours 0.00, period_floor_cents 0, settled_net_cents 0 and
          reconciliation_delta_cents 0 — max(0, 0 - 0) must not become an error,
          a null, or a division by the zero session count.
        test_recipe:
          setup:
            - "One DOMESTIC crew with one picker (no sessions ever created)."
            - "One DRAFT payroll run over 2026-08-03..2026-08-09 for that crew."
          setup_api_calls:
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-BP2", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/pickers"
              payload: { crew_id: "${crew}", full_name: "Picker Idle", hygiene_training_on: "2026-06-01" }
              as: CrewSupervisor
              as_user_id: "sup-1"
              captures: { pk1: $.data.id }
            - call: "POST /berry-ops/payroll-runs"
              payload: { crew_id: "${crew}", period_start_date: "2026-08-03", period_end_date: "2026-08-09" }
              as: PayrollClerk
              as_user_id: "clerk-1"
              captures: { run: $.data.id }
          trigger:
            - call: "POST /berry-ops/payroll-runs/${run}/lock"
              payload: {}
              as: PayrollClerk
              as_user_id: "clerk-1"
            - call: "POST /berry-ops/payroll-runs/${run}/settle"
              payload: {}
              as: PayrollClerk
              as_user_id: "clerk-2"
          assert:
            - "both trigger calls return 200"
            - "PayrollRun.${run}.status == SETTLED and PayrollRun.${run}.bound_session_count == 0"
            - "PayrollRun.${run}.period_hours == 0.00 and PayrollRun.${run}.period_piece_cents == 0"
            - "PayrollRun.${run}.period_floor_cents == 0 and PayrollRun.${run}.period_makeup_cents == 0"
            - "PayrollRun.${run}.period_deduction_cents == 0 and PayrollRun.${run}.settled_gross_cents == 0 and PayrollRun.${run}.settled_net_cents == 0"
            - "PayrollRun.${run}.accrued_gross_cents == 0 and PayrollRun.${run}.reconciliation_delta_cents == 0"
            - "Crew.${crew}.accrued_wage_cents == 0 and Crew.${crew}.settled_wage_cents == 0 and Crew.${crew}.reconciliation_delta_cents == 0"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: window_open_requires_block_food_safety_posture_cleared
        grounds:
          - state_machines.HarvestWindow.CONFIRMED_to_OPEN
          - calculations.block_food_safety_posture
          - validations[priority=39]
          - errors[ERR_BLOCK_NOT_CLEARED]
        distinguishing_aspect: |
          The HarvestWindow transition CONFIRMED -> OPEN is gated on a field of a
          DIFFERENT entity (Block.food_safety_posture): with zero water samples
          the block is RESTRICTED and the open is refused with
          ERR_BLOCK_NOT_CLEARED (409), and the identical call succeeds after a
          single passing water sample flips the block to CLEARED — the window's
          own fields are unchanged between the two attempts.
        test_recipe:
          setup:
            - "One STRAWBERRY block with NO water samples: water_status NO_SAMPLES, food_safety_posture RESTRICTED, manual_quarantine_active false."
