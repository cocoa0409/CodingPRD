              captures: { cnt: $.data.cumulative_txn_count, st: $.data.nexus_status }
          assert:
            - "NexusProfile.${np_id}.cumulative_txn_count == 3"
            - "NexusProfile.${np_id}.nexus_status == THRESHOLD_MET"
            - "NexusProfile.${np_id}.cumulative_taxable_sales == 30.00"

  # =========================================================================
