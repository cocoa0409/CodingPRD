        claim_type: Standard CRUD
        grounds: ["response_envelope", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Envelope contract both ways: a success carries meta.api_request_id + meta.api_request_timestamp + response_type object, and a failure carries response_type error with data.error_id and data.message."
        test_recipe:
          setup: ["One coordinator volunteer exists."]
          setup_api_calls:
            - { call: "POST /volunteers", payload: { volunteer_name: "Cara Coordinator", chapter_code: "CH1", roles: ["COORDINATOR"] }, as: LeagueAdmin, captures: { coord_id: "$.data.id" } }
          trigger:
            - { call: "POST /election-cycles", payload: { cycle_name: "2026 General", election_date: "2026-11-03" }, as: LeagueAdmin, captures: { cyc_id: "$.data.id" } }
            - { call: "GET /contests/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: ChapterCoordinator, as_user_id: "${coord_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "Success: response_type == object, meta.api_request_id non-empty, meta.api_request_timestamp present, data.id == ${cyc_id}"
            - "Failure: HTTP 404, response_type == error, data.error_id == ERR_NOT_FOUND, data.message non-empty string, meta block still present"

