      - name: exclude_verified_account_five_hop_reprice_cascade
        grounds:
          - "state_machines.ServiceAccount.VERIFIED_to_EXCLUDED"
          - "endpoints[POST /service-accounts/{id}/exclude]"
          - "calculations.route_valuation"
          - "calculations.reprice_trigger_test"
          - "entities.RouteListing.fields.verified_recurring_mrr_cents"
          - "entities.RouteValuation.fields.is_superseded"
          - "entities.Deal.fields.repricing_reason_code"
          - "entities.EscrowAccount.fields.deposits_blocked"
        distinguishing_aspect: "Depth 5, and every hop crosses into a different entity: ServiceAccount -> RouteListing rollups -> RouteValuation (supersede + recompute) -> Deal (REPRICE_REQUIRED) -> EscrowAccount (target zeroed, deposits blocked). Hops 4 and 5 are conditional on the recomputed number, so the same exclude call on a cheaper deal would stop at hop 3."
