                rush_flat_cents: 1500
                rush_multiplier_bp: 15000
                volume_tiers: []
                effective_from: "2026-08-01T00:00:00Z"
                active: true
              as: RegistrarAdmin
            - call: "POST /registrar/students"
              payload:
                student_number: "S6000002"
                full_name: "Karl Mo"
                date_of_birth: "1999-09-09"
                email: "karl@example.edu"
              as: RegistrarAdmin
              captures: { student_id: $.data.id }
            - call: "POST /registrar/recipients"
              payload:
                kind: "EMAIL_PDF"
                display_name: "Self"
                email_address: "karl@example.edu"
              as: RegistrarAdmin
              captures: { recip_id: $.data.id }
            - call: "POST /registrar/orders"
              payload:
                student_id: "${student_id}"
                order_kind: "OFFICIAL"
                rush_requested: false
              as: Student
              as_user_id: "${student_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
            - call: "POST /registrar/orders/${order_id}/line-items"
              payload:
                recipient_id: "${recip_id}"
                delivery_kind: "EMAIL_PDF"
                quantity: 1
                expected_order_version: "${order_v0}"
              as: Student
              as_user_id: "${student_id}"
              captures: { order_v1: $.data.version, line_id: $.data.id }
            - call: "POST /registrar/identity-verifications"
              payload:
                student_id: "${student_id}"
                order_id: "${order_id}"
                method: "SSN_DOB"
              as: Student
              as_user_id: "${student_id}"
              captures: { idv_id: $.data.id, idv_token: $.data.verification_token }
            - call: "POST /registrar/identity-verifications/${idv_id}/confirm"
              payload: { verification_token: "${idv_token}" }
              as: Student
              as_user_id: "${student_id}"
            - call: "POST /registrar/orders/${order_id}/submit"
              payload: { expected_order_version: "${order_v1}" }
              as: Student
              as_user_id: "${student_id}"
            - call: "POST /registrar/payments"
              payload:
                order_id: "${order_id}"
                idempotency_key: "pay-prio-002"
              as: Student
              as_user_id: "${student_id}"
              captures: { payment_id: $.data.id }
            - call: "POST /registrar/payments/${payment_id}/capture"
              payload: {}
              as: RegistrarOperator
            - call: "POST /registrar/line-items/${line_id}/dispatch"
              payload: {}
              as: RegistrarOperator
            - call: "POST /registrar/line-items/${line_id}/mark-delivered"
              payload: {}
              as: RegistrarOperator
            - call: "POST /registrar/orders/${order_id}/reissue-requests"
              payload: { reason: "NAME_CORRECTION", fee_waived: true }
              as: Student
              as_user_id: "${student_id}"
              captures: { reissue_id: $.data.id }
          trigger:
            # Reviewer X-User-ID equals the student_id (SoD violation), even though
            # the request is otherwise valid. SoD (priority 8) beats referential
            # (priority 16) — but here the request IS referentially valid, so this
            # test isolates the SoD branch. To make the priority conflict visible,
            # we trigger SoD and confirm the error is ERR_SEGREGATION_OF_DUTIES,
            # not a downstream referential error.
            - call: "POST /registrar/reissue-requests/${reissue_id}/approve"
              payload: {}
              as: RegistrarReviewer
              as_user_id: "${student_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES"
            - "ReissueRequest.${reissue_id}.status == REQUESTED (no side effect ran)"

  # =========================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: rush_cutoff_at_exactly_1400_local_not_qualified
        grounds:
          - calculations.rush_qualification
          - entities.TranscriptOrder.fields.rush_qualified
        distinguishing_aspect: |
          Metric: TIME (rush cutoff). Endpoint: POST /orders/{id}/submit.
          Boundary semantics: strict less-than (`< cutoff`), so a submission
          at exactly 14:00:00 local is NOT rush-qualified; one second earlier
          (13:59:59) IS. Numeric boundary precision on a time metric.
        test_recipe:
          setup:
            - "Order A submitted at 2026-08-10T13:59:59Z (just before cutoff — assume local == UTC for test)"
            - "Order B submitted at 2026-08-10T14:00:00Z (exactly at cutoff)"
            - "Both rush_requested=true, ELECTRONIC_NETWORK delivery"
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/fee-schedules"
              payload:
                code: "FS-BND1"
                official_base_cents: 1000
                unofficial_base_cents: 500
                paper_surcharge_cents: 200
                pickup_surcharge_cents: 100
                rush_flat_cents: 1500
                rush_multiplier_bp: 15000
                volume_tiers: []
                effective_from: "2026-08-01T00:00:00Z"
                active: true
              as: RegistrarAdmin
            - call: "POST /registrar/students"
              payload:
                student_number: "S7000001"
                full_name: "Lisa Xu"
                date_of_birth: "2001-05-05"
                email: "lisa@example.edu"
              as: RegistrarAdmin
              captures: { student_id: $.data.id }
            - call: "POST /registrar/recipients"
              payload:
                kind: "ELECTRONIC_NETWORK"
                display_name: "State U"
                network_code: "NET-STATE-U"
              as: RegistrarAdmin
              captures: { recip_id: $.data.id }
            # Order A — submitted at 13:59:59
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T13:59:59Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/orders"
              payload:
                student_id: "${student_id}"
                order_kind: "OFFICIAL"
                rush_requested: true
              as: Student
              as_user_id: "${student_id}"
              captures: { order_a: $.data.id, order_a_v0: $.data.version }
            - call: "POST /registrar/orders/${order_a}/line-items"
              payload:
                recipient_id: "${recip_id}"
                delivery_kind: "ELECTRONIC_NETWORK"
                quantity: 1
                expected_order_version: "${order_a_v0}"
              as: Student
              as_user_id: "${student_id}"
              captures: { order_a_v1: $.data.version }
            - call: "POST /registrar/identity-verifications"
              payload:
                student_id: "${student_id}"
                order_id: "${order_a}"
                method: "SSN_DOB"
              as: Student
              as_user_id: "${student_id}"
              captures: { idv_a: $.data.id, idv_a_token: $.data.verification_token }
            - call: "POST /registrar/identity-verifications/${idv_a}/confirm"
              payload: { verification_token: "${idv_a_token}" }
              as: Student
              as_user_id: "${student_id}"
            - call: "POST /registrar/orders/${order_a}/submit"
              payload: { expected_order_version: "${order_a_v1}" }
              as: Student
              as_user_id: "${student_id}"
              captures: { rush_a: $.data.rush_qualified, fee_a: $.data.quoted_fee_cents }
            # Order B — submitted at exactly 14:00:00
            - call: "POST /registrar/_clock/set_current_utc"
