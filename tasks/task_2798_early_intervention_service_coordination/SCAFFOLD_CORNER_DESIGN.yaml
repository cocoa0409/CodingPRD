      - name: coordinator_auto_selection_ranks_on_projected_utilization_not_points
        claim_type: correct_result
        grounds:
          - calculations.coordinator_auto_selection
          - calculations.coordinator_caseload_aggregates
          - endpoints[POST /ei/referrals/{referralId}/assign-coordinator]
        distinguishing_aspect: |
          The two candidates have different ceilings, so ranking on raw points and ranking on
          projected utilization disagree: a 4.00-point coordinator already carrying 1.50 projects to
          0.7500 while an empty 12.00-point coordinator projects to 0.1250, and the selector must pick
          the latter. Both are eligible, so this is a ranking claim rather than a filter claim.
        test_recipe:
          setup:
            - "Coordinator ALPHA in CNT_A with max_weighted_caseload_points 4.00, already assigned one pre-plan referral (1.50 points)."
            - "Coordinator BRAVO in CNT_A with max_weighted_caseload_points 12.00 and no assignments."
            - "A second INTAKE referral in CNT_A with interpreter_required false, so projected weight is 1.50."
            - "Logical clock parked at 2026-03-02T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/service-coordinators"
              payload: { full_name: "Alpha Osei", county_code: "CNT_A", language_codes: ["EN"], max_weighted_caseload_points: 4.00 }
              as: ProgramAdmin
              captures: { alpha_id: $.data.id }
            - call: "POST /ei/service-coordinators"
              payload: { full_name: "Bravo Lindqvist", county_code: "CNT_A", language_codes: ["EN"], max_weighted_caseload_points: 12.00 }
              as: ProgramAdmin
              captures: { bravo_id: $.data.id }
            - call: "POST /ei/children"
              payload: { first_name: "Ada", last_name: "Nolan", date_of_birth: "2024-06-15", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child1_id: $.data.id }
            - call: "POST /ei/children"
              payload: { first_name: "Beau", last_name: "Ferris", date_of_birth: "2024-08-02", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child2_id: $.data.id }
            - call: "POST /ei/referrals"
              payload: { child_id: "${child1_id}", primary_referral_source: "PHYSICIAN", referral_received_date: "2026-03-02", county_code: "CNT_A", presenting_concern: "Expressive language delay noted at the 20-month well-child visit", interpreter_required: false }
              as: IntakeSpecialist
              captures: { ref1_id: $.data.id }
            - call: "POST /ei/referrals/${ref1_id}/assign-coordinator"
              payload: { coordinator_id: "${alpha_id}" }
