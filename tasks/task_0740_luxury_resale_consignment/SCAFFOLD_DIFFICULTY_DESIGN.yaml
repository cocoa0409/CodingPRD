# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x >=2 instances = 18 instances. All grounds resolve into SCAFFOLD.yaml.
# All formula-derived asserts are pre-computed literals (round_half_up whole cents).
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: payout_provisional_vs_final_diverge_on_accepted_offer
        grounds:
          - calculations.seller_payout
          - entities.Listing.fields.provisional_payout_cents
          - entities.Sale.fields.seller_net_payout_cents
          - state_machines.Offer.PENDING_to_ACCEPTED
        distinguishing_aspect: "provisional_payout_cents on the Listing (net of list_price 200000 -> 160000) and seller_net_payout_cents on the Sale (net of the lower accepted-offer 180000 -> 144000) are computed on DIFFERENT entities and diverge; this is the seller-payout domain."
        test_recipe:
          setup:
            - "STANDARD seller, HANDBAGS policy (base_commission 0.20), item AUTHENTIC grade A, listing published at 200000 (provisional 160000), buyer offer 180000 pending."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /consignment/category-policies", payload: { category: "HANDBAGS", base_commission_pct: 0.20, buyer_fee_pct: 0.10, buyer_fee_flat_cents: 500, return_window_days: 14, min_offer_pct: 0.70, listable_min_condition_grade: "C", pickup_insurance_cap_cents: 5000000 }, as: OpsAdmin }
            - { call: "POST /consignment/sellers", payload: { display_name: "S1", email: "s1@x.com" }, as: OpsAdmin, captures: { seller_id: "$.data.id" } }
            - { call: "POST /consignment/buyers", payload: { display_name: "B1", email: "b1@x.com" }, as: OpsAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /consignment/items", payload: { seller_id: "${seller_id}", category: "HANDBAGS", brand: "Hermes", title: "Kelly", declared_value_cents: 200000, intake_channel: "DROP_OFF" }, as: Seller, as_user_id: "${seller_id}", captures: { item_id: "$.data.id" } }
            - { call: "POST /consignment/items/${item_id}/authenticate", payload: { verdict: "AUTHENTIC", condition_grade: "A" }, as: Authenticator }
            - { call: "POST /consignment/listings", payload: { item_id: "${item_id}", list_price_cents: 200000 }, as: Seller, as_user_id: "${seller_id}", captures: { listing_id: "$.data.id" } }
            - { call: "POST /consignment/listings/${listing_id}/publish", payload: {}, as: Seller, as_user_id: "${seller_id}", captures: { lv: "$.data.version" } }
            - { call: "POST /consignment/offers", payload: { listing_id: "${listing_id}", buyer_id: "${buyer_id}", amount_cents: 180000, expected_listing_version: "${lv}" }, as: Buyer, as_user_id: "${buyer_id}", captures: { offer_id: "$.data.id" } }
          trigger:
            - { call: "POST /consignment/offers/${offer_id}/accept", payload: {}, as: Seller, as_user_id: "${seller_id}" }
            - { call: "GET /consignment/sales?listing_id=${listing_id}", payload: {}, as: OpsAdmin, captures: { sale_id: "$.data[0].id" } }
          assert:
            - "Listing.${listing_id}.provisional_payout_cents == 160000"
            - "Sale.${sale_id}.sale_price_cents == 180000"
            - "Sale.${sale_id}.commission_cents == 36000"
            - "Sale.${sale_id}.seller_net_payout_cents == 144000"
            - "Listing.${listing_id}.provisional_payout_cents != Sale.${sale_id}.seller_net_payout_cents"

      - name: refund_authenticity_full_vs_change_of_mind_restocking
        grounds:
          - calculations.buyer_refund
          - entities.Dispute.fields.refund_amount_cents
          - entities.Dispute.fields.restocking_fee_cents
          - state_machines.Dispute.FILED_to_RESOLVED_BUYER
        distinguishing_aspect: "Two identical delivered sales (order_total 214380 each): an AUTHENTICITY dispute refunds the full 214380 (restocking 0) while a CHANGE_OF_MIND dispute refunds 177880 (restocking 18000, buyer_fee retained); buyer-refund domain, distinct from the seller-payout dual variant."
        test_recipe:
          setup:
            - "Two HANDBAGS direct-buy sales at list 180000, both delivered at default clock; dispute_a=AUTHENTICITY, dispute_b=CHANGE_OF_MIND, both FILED."
          setup_api_calls:
            - { call: "POST /consignment/category-policies", payload: { category: "HANDBAGS", base_commission_pct: 0.20, buyer_fee_pct: 0.10, buyer_fee_flat_cents: 500, return_window_days: 14, min_offer_pct: 0.70, listable_min_condition_grade: "C", pickup_insurance_cap_cents: 5000000 }, as: OpsAdmin }
            - { call: "POST /consignment/sellers", payload: { display_name: "S1", email: "s1@x.com" }, as: OpsAdmin, captures: { seller_id: "$.data.id" } }
            - { call: "POST /consignment/buyers", payload: { display_name: "B1", email: "b1@x.com" }, as: OpsAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /consignment/items", payload: { seller_id: "${seller_id}", category: "HANDBAGS", brand: "Chanel", title: "Flap A", declared_value_cents: 180000, intake_channel: "DROP_OFF" }, as: Seller, as_user_id: "${seller_id}", captures: { item_a: "$.data.id" } }
            - { call: "POST /consignment/items/${item_a}/authenticate", payload: { verdict: "AUTHENTIC", condition_grade: "A" }, as: Authenticator }
            - { call: "POST /consignment/listings", payload: { item_id: "${item_a}", list_price_cents: 180000 }, as: Seller, as_user_id: "${seller_id}", captures: { listing_a: "$.data.id" } }
            - { call: "POST /consignment/listings/${listing_a}/publish", payload: {}, as: Seller, as_user_id: "${seller_id}" }
            - { call: "POST /consignment/sales", payload: { listing_id: "${listing_a}", buyer_id: "${buyer_id}" }, as: Buyer, as_user_id: "${buyer_id}", captures: { sale_a: "$.data.id" } }
            - { call: "POST /consignment/sales/${sale_a}/capture-payment", payload: {}, as: Buyer, as_user_id: "${buyer_id}" }
            - { call: "POST /consignment/sales/${sale_a}/ship", payload: {}, as: Seller, as_user_id: "${seller_id}" }
            - { call: "POST /consignment/sales/${sale_a}/confirm-delivery", payload: {}, as: Buyer, as_user_id: "${buyer_id}" }
            - { call: "POST /consignment/disputes", payload: { sale_id: "${sale_a}", type: "AUTHENTICITY", reason: "fake stitching" }, as: Buyer, as_user_id: "${buyer_id}", captures: { dispute_a: "$.data.id" } }
            - { call: "POST /consignment/items", payload: { seller_id: "${seller_id}", category: "HANDBAGS", brand: "Chanel", title: "Flap B", declared_value_cents: 180000, intake_channel: "DROP_OFF" }, as: Seller, as_user_id: "${seller_id}", captures: { item_b: "$.data.id" } }
            - { call: "POST /consignment/items/${item_b}/authenticate", payload: { verdict: "AUTHENTIC", condition_grade: "A" }, as: Authenticator }
            - { call: "POST /consignment/listings", payload: { item_id: "${item_b}", list_price_cents: 180000 }, as: Seller, as_user_id: "${seller_id}", captures: { listing_b: "$.data.id" } }
            - { call: "POST /consignment/listings/${listing_b}/publish", payload: {}, as: Seller, as_user_id: "${seller_id}" }
            - { call: "POST /consignment/sales", payload: { listing_id: "${listing_b}", buyer_id: "${buyer_id}" }, as: Buyer, as_user_id: "${buyer_id}", captures: { sale_b: "$.data.id" } }
            - { call: "POST /consignment/sales/${sale_b}/capture-payment", payload: {}, as: Buyer, as_user_id: "${buyer_id}" }
            - { call: "POST /consignment/sales/${sale_b}/ship", payload: {}, as: Seller, as_user_id: "${seller_id}" }
            - { call: "POST /consignment/sales/${sale_b}/confirm-delivery", payload: {}, as: Buyer, as_user_id: "${buyer_id}" }
            - { call: "POST /consignment/disputes", payload: { sale_id: "${sale_b}", type: "CHANGE_OF_MIND", reason: "did not fit" }, as: Buyer, as_user_id: "${buyer_id}", captures: { dispute_b: "$.data.id" } }
          trigger:
            - { call: "POST /consignment/disputes/${dispute_a}/resolve", payload: { outcome: "BUYER" }, as: OpsAdmin }
            - { call: "POST /consignment/disputes/${dispute_b}/resolve", payload: { outcome: "BUYER" }, as: OpsAdmin }
          assert:
            - "Dispute.${dispute_a}.refund_amount_cents == 214380"
            - "Dispute.${dispute_a}.restocking_fee_cents == 0"
            - "Dispute.${dispute_b}.refund_amount_cents == 177880"
            - "Dispute.${dispute_b}.restocking_fee_cents == 18000"
            - "Dispute.${dispute_a}.refund_amount_cents != Dispute.${dispute_b}.refund_amount_cents"

  - rule_id: combinatorial_formula
    instances:
      - name: commission_tiered_rate_max_floor_binds
        grounds:
          - calculations.commission_rate_locked
          - calculations.seller_payout
          - entities.Sale.fields.commission_rate_pct
          - entities.Sale.fields.commission_cents
        distinguishing_aspect: "mode (a) non-linear: commission_rate = max(base 0.04 - tier_discount 0.0, MIN 0.05) selected across >=3 inputs (sale_price, base_commission_pct, tier_discount); the max() floor lifts 0.04 to 0.05 so commission on 300000 is 15000, not the 12000 that base 0.04 would give."
        test_recipe:
          setup:
            - "SHOES policy base_commission 0.04, STANDARD seller, item AUTHENTIC grade A, listing published at 300000, direct-bought."
          setup_api_calls:
            - { call: "POST /consignment/category-policies", payload: { category: "SHOES", base_commission_pct: 0.04, buyer_fee_pct: 0.10, buyer_fee_flat_cents: 500, return_window_days: 14, min_offer_pct: 0.70, listable_min_condition_grade: "C", pickup_insurance_cap_cents: 5000000 }, as: OpsAdmin }
            - { call: "POST /consignment/sellers", payload: { display_name: "S1", email: "s1@x.com" }, as: OpsAdmin, captures: { seller_id: "$.data.id" } }
            - { call: "POST /consignment/buyers", payload: { display_name: "B1", email: "b1@x.com" }, as: OpsAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /consignment/items", payload: { seller_id: "${seller_id}", category: "SHOES", brand: "Louboutin", title: "Heels", declared_value_cents: 300000, intake_channel: "DROP_OFF" }, as: Seller, as_user_id: "${seller_id}", captures: { item_id: "$.data.id" } }
            - { call: "POST /consignment/items/${item_id}/authenticate", payload: { verdict: "AUTHENTIC", condition_grade: "A" }, as: Authenticator }
            - { call: "POST /consignment/listings", payload: { item_id: "${item_id}", list_price_cents: 300000 }, as: Seller, as_user_id: "${seller_id}", captures: { listing_id: "$.data.id" } }
            - { call: "POST /consignment/listings/${listing_id}/publish", payload: {}, as: Seller, as_user_id: "${seller_id}" }
          trigger:
            - { call: "POST /consignment/sales", payload: { listing_id: "${listing_id}", buyer_id: "${buyer_id}" }, as: Buyer, as_user_id: "${buyer_id}", captures: { sale_id: "$.data.id" } }
          assert:
            - "Sale.${sale_id}.commission_rate_pct == 0.05"
            - "Sale.${sale_id}.commission_cents == 15000"
            - "Sale.${sale_id}.seller_net_payout_cents == 285000"

      - name: buyer_order_total_pinned_rounding_order
        grounds:
          - calculations.buyer_order_total
          - entities.Sale.fields.buyer_fee_cents
          - entities.Sale.fields.tax_cents
          - entities.Sale.fields.order_total_cents
        distinguishing_aspect: "mode (b) pinned rounding order at sale_price 123455: buyer_fee = 500 + round_half_up(12345.5)=12846 first, THEN tax = round_half_up(136301*0.08)=10904 on price-plus-rounded-fee, THEN sum = 147205; rounding the raw components together (146665) or taxing price-only would give different totals."
        test_recipe:
          setup:
            - "HANDBAGS policy, STANDARD seller, item AUTHENTIC grade A, listing published at 123455, direct-bought."
          setup_api_calls:
            - { call: "POST /consignment/category-policies", payload: { category: "HANDBAGS", base_commission_pct: 0.20, buyer_fee_pct: 0.10, buyer_fee_flat_cents: 500, return_window_days: 14, min_offer_pct: 0.70, listable_min_condition_grade: "C", pickup_insurance_cap_cents: 5000000 }, as: OpsAdmin }
            - { call: "POST /consignment/sellers", payload: { display_name: "S1", email: "s1@x.com" }, as: OpsAdmin, captures: { seller_id: "$.data.id" } }
            - { call: "POST /consignment/buyers", payload: { display_name: "B1", email: "b1@x.com" }, as: OpsAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /consignment/items", payload: { seller_id: "${seller_id}", category: "HANDBAGS", brand: "Gucci", title: "Tote", declared_value_cents: 123455, intake_channel: "DROP_OFF" }, as: Seller, as_user_id: "${seller_id}", captures: { item_id: "$.data.id" } }
            - { call: "POST /consignment/items/${item_id}/authenticate", payload: { verdict: "AUTHENTIC", condition_grade: "A" }, as: Authenticator }
            - { call: "POST /consignment/listings", payload: { item_id: "${item_id}", list_price_cents: 123455 }, as: Seller, as_user_id: "${seller_id}", captures: { listing_id: "$.data.id" } }
            - { call: "POST /consignment/listings/${listing_id}/publish", payload: {}, as: Seller, as_user_id: "${seller_id}" }
          trigger:
            - { call: "POST /consignment/sales", payload: { listing_id: "${listing_id}", buyer_id: "${buyer_id}" }, as: Buyer, as_user_id: "${buyer_id}", captures: { sale_id: "$.data.id" } }
          assert:
            - "Sale.${sale_id}.sale_price_cents == 123455"
            - "Sale.${sale_id}.buyer_fee_cents == 12846"
            - "Sale.${sale_id}.tax_cents == 10904"
            - "Sale.${sale_id}.order_total_cents == 147205"

  - rule_id: non_linear_state_machine
    instances:
      - name: offer_cyclic_negotiation_rounds
        grounds:
          - state_machines.Offer.PENDING_to_COUNTERED
          - state_machines.Offer.COUNTERED_to_PENDING
          - entities.Offer.fields.round_number
        distinguishing_aspect: "The Offer cycles PENDING->COUNTERED (seller counter 175000) ->PENDING (buyer counter-back 160000); round_number increments to 2 and amount_cents becomes 160000 — a cycle, not a linear pipeline; distinct entity from the Sale parallel machine."
        test_recipe:
          setup:
            - "HANDBAGS listing published at 200000 (min_offer 140000), buyer offer 150000 pending."
          setup_api_calls:
            - { call: "POST /consignment/category-policies", payload: { category: "HANDBAGS", base_commission_pct: 0.20, buyer_fee_pct: 0.10, buyer_fee_flat_cents: 500, return_window_days: 14, min_offer_pct: 0.70, listable_min_condition_grade: "C", pickup_insurance_cap_cents: 5000000 }, as: OpsAdmin }
            - { call: "POST /consignment/sellers", payload: { display_name: "S1", email: "s1@x.com" }, as: OpsAdmin, captures: { seller_id: "$.data.id" } }
            - { call: "POST /consignment/buyers", payload: { display_name: "B1", email: "b1@x.com" }, as: OpsAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /consignment/items", payload: { seller_id: "${seller_id}", category: "HANDBAGS", brand: "Dior", title: "Saddle", declared_value_cents: 200000, intake_channel: "DROP_OFF" }, as: Seller, as_user_id: "${seller_id}", captures: { item_id: "$.data.id" } }
            - { call: "POST /consignment/items/${item_id}/authenticate", payload: { verdict: "AUTHENTIC", condition_grade: "A" }, as: Authenticator }
            - { call: "POST /consignment/listings", payload: { item_id: "${item_id}", list_price_cents: 200000 }, as: Seller, as_user_id: "${seller_id}", captures: { listing_id: "$.data.id" } }
            - { call: "POST /consignment/listings/${listing_id}/publish", payload: {}, as: Seller, as_user_id: "${seller_id}", captures: { lv: "$.data.version" } }
            - { call: "POST /consignment/offers", payload: { listing_id: "${listing_id}", buyer_id: "${buyer_id}", amount_cents: 150000, expected_listing_version: "${lv}" }, as: Buyer, as_user_id: "${buyer_id}", captures: { offer_id: "$.data.id" } }
          trigger:
            - { call: "POST /consignment/offers/${offer_id}/counter", payload: { counter_amount_cents: 175000 }, as: Seller, as_user_id: "${seller_id}" }
            - { call: "POST /consignment/offers/${offer_id}/counter", payload: { counter_amount_cents: 160000 }, as: Buyer, as_user_id: "${buyer_id}" }
          assert:
            - "Offer.${offer_id}.status == PENDING"
            - "Offer.${offer_id}.round_number == 2"
            - "Offer.${offer_id}.amount_cents == 160000"

      - name: sale_parallel_payment_and_fulfillment_axes
        grounds:
          - state_machines.Sale.PENDING_to_CAPTURED
          - state_machines.Sale.AWAITING_SHIPMENT_to_SHIPPED
          - entities.Sale.fields.payment_status
          - entities.Sale.fields.fulfillment_status
        distinguishing_aspect: "Sale advances payment_status (PENDING->CAPTURED) and fulfillment_status (AWAITING_SHIPMENT->SHIPPED) on independent axes; after capture+ship the row reads (CAPTURED, SHIPPED) — parallel dimensions on one entity, distinct from the Offer cycle."
        test_recipe:
          setup:
            - "HANDBAGS direct-buy sale created at list 180000 (payment PENDING, fulfillment AWAITING_SHIPMENT)."
          setup_api_calls:
            - { call: "POST /consignment/category-policies", payload: { category: "HANDBAGS", base_commission_pct: 0.20, buyer_fee_pct: 0.10, buyer_fee_flat_cents: 500, return_window_days: 14, min_offer_pct: 0.70, listable_min_condition_grade: "C", pickup_insurance_cap_cents: 5000000 }, as: OpsAdmin }
            - { call: "POST /consignment/sellers", payload: { display_name: "S1", email: "s1@x.com" }, as: OpsAdmin, captures: { seller_id: "$.data.id" } }
            - { call: "POST /consignment/buyers", payload: { display_name: "B1", email: "b1@x.com" }, as: OpsAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /consignment/items", payload: { seller_id: "${seller_id}", category: "HANDBAGS", brand: "Prada", title: "Hobo", declared_value_cents: 180000, intake_channel: "DROP_OFF" }, as: Seller, as_user_id: "${seller_id}", captures: { item_id: "$.data.id" } }
            - { call: "POST /consignment/items/${item_id}/authenticate", payload: { verdict: "AUTHENTIC", condition_grade: "A" }, as: Authenticator }
            - { call: "POST /consignment/listings", payload: { item_id: "${item_id}", list_price_cents: 180000 }, as: Seller, as_user_id: "${seller_id}", captures: { listing_id: "$.data.id" } }
            - { call: "POST /consignment/listings/${listing_id}/publish", payload: {}, as: Seller, as_user_id: "${seller_id}" }
            - { call: "POST /consignment/sales", payload: { listing_id: "${listing_id}", buyer_id: "${buyer_id}" }, as: Buyer, as_user_id: "${buyer_id}", captures: { sale_id: "$.data.id" } }
          trigger:
            - { call: "POST /consignment/sales/${sale_id}/capture-payment", payload: {}, as: Buyer, as_user_id: "${buyer_id}" }
            - { call: "POST /consignment/sales/${sale_id}/ship", payload: {}, as: Seller, as_user_id: "${seller_id}" }
          assert:
            - "Sale.${sale_id}.payment_status == CAPTURED"
            - "Sale.${sale_id}.fulfillment_status == SHIPPED"

  - rule_id: transitive_cascade
    instances:
      - name: accept_offer_cascade_offer_sale_listing_item
        grounds:
          - state_machines.Offer.PENDING_to_ACCEPTED
          - state_machines.Listing.ACTIVE_to_SOLD
          - state_machines.ConsignmentItem.LISTED_to_SOLD
        distinguishing_aspect: "One trigger (accept offer_a) chains link-by-link: Offer->ACCEPTED creates the Sale (link1) -> Listing ACTIVE->SOLD (link2) -> ConsignmentItem LISTED->SOLD (link3) and sibling offer_b -> DECLINED; depth-3, each link caused by the previous, originating from the accept transition."
        test_recipe:
          setup:
            - "HANDBAGS listing published at 200000; buyer_a offer 180000 (pending) and buyer_b sibling offer 150000 (pending)."
          setup_api_calls:
            - { call: "POST /consignment/category-policies", payload: { category: "HANDBAGS", base_commission_pct: 0.20, buyer_fee_pct: 0.10, buyer_fee_flat_cents: 500, return_window_days: 14, min_offer_pct: 0.70, listable_min_condition_grade: "C", pickup_insurance_cap_cents: 5000000 }, as: OpsAdmin }
            - { call: "POST /consignment/sellers", payload: { display_name: "S1", email: "s1@x.com" }, as: OpsAdmin, captures: { seller_id: "$.data.id" } }
            - { call: "POST /consignment/buyers", payload: { display_name: "BA", email: "ba@x.com" }, as: OpsAdmin, captures: { buyer_a: "$.data.id" } }
            - { call: "POST /consignment/buyers", payload: { display_name: "BB", email: "bb@x.com" }, as: OpsAdmin, captures: { buyer_b: "$.data.id" } }
            - { call: "POST /consignment/items", payload: { seller_id: "${seller_id}", category: "HANDBAGS", brand: "LV", title: "Speedy", declared_value_cents: 200000, intake_channel: "DROP_OFF" }, as: Seller, as_user_id: "${seller_id}", captures: { item_id: "$.data.id" } }
            - { call: "POST /consignment/items/${item_id}/authenticate", payload: { verdict: "AUTHENTIC", condition_grade: "A" }, as: Authenticator }
            - { call: "POST /consignment/listings", payload: { item_id: "${item_id}", list_price_cents: 200000 }, as: Seller, as_user_id: "${seller_id}", captures: { listing_id: "$.data.id" } }
            - { call: "POST /consignment/listings/${listing_id}/publish", payload: {}, as: Seller, as_user_id: "${seller_id}", captures: { lv: "$.data.version" } }
            - { call: "POST /consignment/offers", payload: { listing_id: "${listing_id}", buyer_id: "${buyer_a}", amount_cents: 180000, expected_listing_version: "${lv}" }, as: Buyer, as_user_id: "${buyer_a}", captures: { offer_a: "$.data.id" } }
            - { call: "GET /consignment/listings/${listing_id}", payload: {}, as: OpsAdmin, captures: { lv2: "$.data.version" } }
            - { call: "POST /consignment/offers", payload: { listing_id: "${listing_id}", buyer_id: "${buyer_b}", amount_cents: 150000, expected_listing_version: "${lv2}" }, as: Buyer, as_user_id: "${buyer_b}", captures: { offer_b: "$.data.id" } }
          trigger:
            - { call: "POST /consignment/offers/${offer_a}/accept", payload: {}, as: Seller, as_user_id: "${seller_id}" }
            - { call: "GET /consignment/sales?listing_id=${listing_id}", payload: {}, as: OpsAdmin, captures: { sale_id: "$.data[0].id" } }
          assert:
            - "Offer.${offer_a}.status == ACCEPTED"
            - "Sale.${sale_id}.sale_channel == OFFER"
            - "Sale.${sale_id}.sale_price_cents == 180000"
            - "Listing.${listing_id}.status == SOLD"
            - "ConsignmentItem.${item_id}.status == SOLD"
            - "Offer.${offer_b}.status == DECLINED"

      - name: buyer_dispute_cascade_sale_payout_seller
        grounds:
          - state_machines.Dispute.FILED_to_RESOLVED_BUYER
          - state_machines.Sale.DELIVERED_to_RETURNED
          - state_machines.Payout.SCHEDULED_to_REVERSED
          - entities.Seller.fields.pending_payout_cents
        distinguishing_aspect: "Distinct trigger (resolve dispute BUYER): Dispute->RESOLVED_BUYER drives Sale DELIVERED->RETURNED (link1), which drives Payout->REVERSED and Seller.pending_payout_cents 144000->0 (link2); depth-2 cascade from a different origin than the accept-offer cascade."
        test_recipe:
          setup:
            - "HANDBAGS direct-buy sale at list 180000 (net 144000), delivered at default clock, AUTHENTICITY dispute FILED (payout HELD, pending 144000)."
          setup_api_calls:
            - { call: "POST /consignment/category-policies", payload: { category: "HANDBAGS", base_commission_pct: 0.20, buyer_fee_pct: 0.10, buyer_fee_flat_cents: 500, return_window_days: 14, min_offer_pct: 0.70, listable_min_condition_grade: "C", pickup_insurance_cap_cents: 5000000 }, as: OpsAdmin }
            - { call: "POST /consignment/sellers", payload: { display_name: "S1", email: "s1@x.com" }, as: OpsAdmin, captures: { seller_id: "$.data.id" } }
            - { call: "POST /consignment/buyers", payload: { display_name: "B1", email: "b1@x.com" }, as: OpsAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /consignment/items", payload: { seller_id: "${seller_id}", category: "HANDBAGS", brand: "Fendi", title: "Baguette", declared_value_cents: 180000, intake_channel: "DROP_OFF" }, as: Seller, as_user_id: "${seller_id}", captures: { item_id: "$.data.id" } }
            - { call: "POST /consignment/items/${item_id}/authenticate", payload: { verdict: "AUTHENTIC", condition_grade: "A" }, as: Authenticator }
            - { call: "POST /consignment/listings", payload: { item_id: "${item_id}", list_price_cents: 180000 }, as: Seller, as_user_id: "${seller_id}", captures: { listing_id: "$.data.id" } }
            - { call: "POST /consignment/listings/${listing_id}/publish", payload: {}, as: Seller, as_user_id: "${seller_id}" }
            - { call: "POST /consignment/sales", payload: { listing_id: "${listing_id}", buyer_id: "${buyer_id}" }, as: Buyer, as_user_id: "${buyer_id}", captures: { sale_id: "$.data.id" } }
            - { call: "POST /consignment/sales/${sale_id}/capture-payment", payload: {}, as: Buyer, as_user_id: "${buyer_id}" }
            - { call: "POST /consignment/sales/${sale_id}/ship", payload: {}, as: Seller, as_user_id: "${seller_id}" }
            - { call: "POST /consignment/sales/${sale_id}/confirm-delivery", payload: {}, as: Buyer, as_user_id: "${buyer_id}" }
            - { call: "POST /consignment/disputes", payload: { sale_id: "${sale_id}", type: "AUTHENTICITY", reason: "counterfeit" }, as: Buyer, as_user_id: "${buyer_id}", captures: { dispute_id: "$.data.id" } }
          trigger:
            - { call: "POST /consignment/disputes/${dispute_id}/resolve", payload: { outcome: "BUYER" }, as: OpsAdmin }
            - { call: "GET /consignment/sales/${sale_id}/payouts", payload: {}, as: OpsAdmin, captures: { payout_id: "$.data[0].id" } }
          assert:
            - "Sale.${sale_id}.payment_status == REFUNDED"
            - "Sale.${sale_id}.fulfillment_status == RETURNED"
            - "Payout.${payout_id}.status == REVERSED"
            - "Seller.${seller_id}.pending_payout_cents == 0"
            - "Seller.${seller_id}.reversed_payout_cents == 144000"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: dispute_state_beats_temporal
        grounds:
          - validations[priority=5]
          - validations[priority=12]
          - errors[ERR_SALE_NOT_DISPUTABLE]
          - errors[ERR_DISPUTE_WINDOW_EXPIRED]
        distinguishing_aspect: "A file-dispute request violating BOTH state (sale already RETURNED, priority 5) and business_temporal (clock past return_window_ends_at, priority 12) returns ERR_SALE_NOT_DISPUTABLE — state outranks temporal (pair: state vs business_temporal)."
        test_recipe:
          setup:
            - "HANDBAGS sale delivered 2026-03-01; a CHANGE_OF_MIND dispute is resolved BUYER so the sale is RETURNED; clock advanced to 2026-04-01 (past window end 2026-03-15)."
