  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_version_load_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[load-piece-stale-batch]", "state_machines.BisquePiece.PAINTED_to_LOADED", "entities.KilnBatch.fields.version"]
        distinguishing_aspect: "Loading with expected_kiln_batch_version equal to the batch's current version (1) succeeds and bumps version to 2."
        test_recipe:
          setup: ["An OPEN visit with a PAINTED CONE_06 piece; a fresh LOADING CONE_06 batch (version 1)."]
          setup_api_calls:
            - call: "POST /studio-visits"
              payload: { party_size: 1, visit_type: "WALK_IN" }
              as: StudioStaff
              captures: { visit_id: $.data.id }
            - call: "POST /studio-visits/${visit_id}/pieces"
              payload: { sku: "MUG-12OZ", name: "Mug", bisque_price_cents: 3000, firing_temp: "CONE_06" }
              as: StudioStaff
              captures: { piece_id: $.data.id }
            - call: "POST /kiln-batches"
              payload: { kiln_name: "K9", firing_temp: "CONE_06", capacity_slots: 4, turnaround_hours: 48 }
              as: StudioStaff
              captures: { batch_id: $.data.id, bv: $.data.version }
          trigger:
            - call: "POST /kiln-batches/${batch_id}/load"
              payload: { bisque_piece_id: "${piece_id}", expected_kiln_batch_version: "${bv}" }
              as: StudioStaff
          assert:
            - "BisquePiece.${piece_id}.status == LOADED"
            - "KilnBatch.${batch_id}.occupied_slots == 1 and version == 2"

      - name: occ_stale_version_load_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[load-piece-stale-batch]", "errors[ERR_STALE_BATCH_VERSION]", "entities.KilnBatch.fields.version"]
        distinguishing_aspect: "A second load carrying the pre-first-load version (bv0, now stale because the first load bumped version) -> ERR_STALE_BATCH_VERSION (412)."
        test_recipe:
          setup: ["A LOADING CONE_06 batch cap 4; two PAINTED CONE_06 pieces; piece1 already loaded (version advanced past bv0)."]
          setup_api_calls:
            - call: "POST /studio-visits"
              payload: { party_size: 1, visit_type: "WALK_IN" }
              as: StudioStaff
              captures: { visit_id: $.data.id }
            - call: "POST /studio-visits/${visit_id}/pieces"
              payload: { sku: "S1", name: "S1", bisque_price_cents: 2000, firing_temp: "CONE_06" }
              as: StudioStaff
              captures: { p1: $.data.id }
            - call: "POST /studio-visits/${visit_id}/pieces"
              payload: { sku: "S2", name: "S2", bisque_price_cents: 2000, firing_temp: "CONE_06" }
              as: StudioStaff
              captures: { p2: $.data.id }
            - call: "POST /kiln-batches"
              payload: { kiln_name: "K10", firing_temp: "CONE_06", capacity_slots: 4, turnaround_hours: 48 }
              as: StudioStaff
              captures: { batch_id: $.data.id, bv0: $.data.version }
            - call: "POST /kiln-batches/${batch_id}/load"
              payload: { bisque_piece_id: "${p1}", expected_kiln_batch_version: "${bv0}" }
              as: StudioStaff
          trigger:
            - call: "POST /kiln-batches/${batch_id}/load"
              payload: { bisque_piece_id: "${p2}", expected_kiln_batch_version: "${bv0}" }
              as: StudioStaff
          assert:
            - "Response error_id == ERR_STALE_BATCH_VERSION (HTTP 412)"
            - "KilnBatch.${batch_id}.occupied_slots == 1 (p2 not loaded)"

      - name: enrollment_withdraw_reconciles_member_balance
        claim_type: derived_field_reconciliation
        grounds: ["state_machines.Enrollment.ENROLLED_to_WITHDRAWN", "entities.LoyaltyMember.fields.point_balance"]
        distinguishing_aspect: "Withdrawing an enrollment reverses its EARN: member.point_balance and lifetime_points_earned drop by the enrollment's points_earned (120), reconciled to 0."
        test_recipe:
          setup: ["A member with one ENROLLED row in a 12000/4 OPEN series (balance 120)."]
          setup_api_calls:
            - call: "POST /loyalty-members"
              payload: { email: "wd1@x.com", full_name: "WD One", phone: "555-1017" }
              as: StudioManager
              captures: { mem_id: $.data.id }
            - call: "POST /class-series"
              payload: { title: "WD4", session_count: 4, seat_capacity: 5, price_cents: 12000, starts_at: "2026-07-01T18:00:00Z" }
              as: StudioManager
              captures: { series_id: $.data.id }
            - call: "POST /class-series/${series_id}/enroll"
              payload: { member_id: "${mem_id}" }
              as: StudioStaff
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_id}/withdraw"
              as: StudioStaff
          assert:
            - "Enrollment.${enr_id}.status == WITHDRAWN"
            - "LoyaltyMember.${mem_id}.point_balance == 0 and lifetime_points_earned == 0"
            - "ClassSeries.${series_id}.enrolled_count == 0"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: checkout_all_effects_visible_same_response
        claim_type: immediate
        grounds: ["state_machines.StudioVisit.OPEN_to_SETTLED", "entities.StudioVisit.fields.settled_total_cents", "entities.LoyaltyMember.fields.point_balance"]
        distinguishing_aspect: "Checkout response immediately reflects settled_total_cents, points_earned, and the member's updated point_balance in the same request (immediate consistency)."
        test_recipe:
          setup: ["A BRONZE member; OPEN WALK_IN visit party 1, one piece 4000 fired & ready; redeem 0; settled = 5000, earn 50."]
          setup_api_calls:
            - call: "POST /loyalty-members"
              payload: { email: "cons1@x.com", full_name: "Cons One", phone: "555-1018" }
              as: StudioManager
              captures: { mem_id: $.data.id }
            - call: "POST /studio-visits"
              payload: { member_id: "${mem_id}", party_size: 1, visit_type: "WALK_IN" }
              as: StudioStaff
              captures: { visit_id: $.data.id }
            - call: "POST /studio-visits/${visit_id}/pieces"
              payload: { sku: "MUG-12OZ", name: "Mug", bisque_price_cents: 4000, firing_temp: "CONE_06" }
              as: StudioStaff
              captures: { piece_id: $.data.id }
            - call: "POST /kiln-batches"
              payload: { kiln_name: "K11", firing_temp: "CONE_06", capacity_slots: 4, turnaround_hours: 48 }
              as: StudioStaff
              captures: { batch_id: $.data.id, bv: $.data.version }
            - call: "POST /kiln-batches/${batch_id}/load"
              payload: { bisque_piece_id: "${piece_id}", expected_kiln_batch_version: "${bv}" }
              as: StudioStaff
            - call: "POST /kiln-batches/${batch_id}/start-firing"
              as: StudioStaff
            - call: "POST /kiln-batches/${batch_id}/complete-firing"
              as: StudioStaff
          trigger:
            - call: "POST /studio-visits/${visit_id}/checkout"
              payload: { points_redeemed: 0 }
              as: StudioStaff
          assert:
            - "Checkout response: StudioVisit.${visit_id}.settled_total_cents == 5000, points_earned == 50, status == SETTLED"
            - "GET /loyalty-members/${mem_id} immediately shows point_balance == 50 and lifetime_points_earned == 50"
