  - method: GET
    path: "/fulfillment-network/carrier-pickups/{pickup_id}"
    description: "Read one pickup."
    roles: [NetworkPlanner, StoreAssociate, CarrierCoordinator, CustomerCare]
    code: 200
    input: []
    output: CarrierPickup
    side_effects: []

  - method: POST
    path: "/fulfillment-network/carrier-pickups/{pickup_id}/close"
    description: "Stop accepting parcels for a pickup window."
    roles: [CarrierCoordinator]
    code: 200
    input: []
    output: CarrierPickup
    side_effects:
      - "status = CLOSED; increments CarrierPickup.version by 1"

  - method: POST
    path: "/fulfillment-network/carrier-pickups/{pickup_id}/depart"
    description: "Record the carrier's departure."
    roles: [CarrierCoordinator]
    code: 200
    input: []
    output: CarrierPickup
    side_effects:
