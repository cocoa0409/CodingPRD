            - call: "POST /liner-qa-packages"
              payload: { cell_id: "${c2_id}", seam_length_ft: 4000, destructive_test_count: 20, passing_test_count: 20, panel_count: 40, defect_count: 2 }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { qa2_id: $.data.id }
            - call: "POST /liner-qa-packages/${qa2_id}/begin-review"
