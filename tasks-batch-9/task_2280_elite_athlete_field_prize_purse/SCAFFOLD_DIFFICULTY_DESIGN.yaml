            - "trigger call 4 returns HTTP 400 with error_id == ERR_INVALID_REQUEST — positions 39..41 exceed MAX_TABLE_POSITION 40, which §1.4 priority 4 catches as a schema violation before any occupancy check runs"
            - "trigger call 5 releases athlete A's slot as a side effect of the withdrawal"
            - "trigger call 6 returns 201 — positions 3..4 became reusable once the RELEASED slot stopped occupying them, and [3,4] versus the surviving [6,7] leaves position 5 free"
            - "trigger call 7 returns total_count == 1 with data[0].status == RELEASED"

      - name: overlap_pacer_half_open_km_range_with_legal_adjacency
        grounds:
          - calculations.pacing_range_occupancy
          - errors.ERR_PACING_RANGE_CONFLICT
          - errors.ERR_PACING_BEYOND_LIMIT
          - entities.PacerAssignment.fields.pacer_license_code
        distinguishing_aspect: >-
          A DIFFERENT resource entity (PacerAssignment) with the OPPOSITE interval semantics to the
          fluid table: pacing ranges are HALF-OPEN [start_km, end_km), so adjacency is LEGAL and
          [21.0, 32.0) may begin exactly where [0.0, 21.0) ends, while [20.9, 32.0) overlaps by 0.1 km;
          the MAX_PACING_KM 32.0 ceiling is also checked BEFORE overlap, so a beyond-limit range reports
          the limit error even when it would also conflict. Falsifiable in one sentence: an
          implementation reusing the closed-interval rule from the fluid table rejects the legal
          [21.0, 32.0) adjacency, and one checking overlap first reports ERR_PACING_RANGE_CONFLICT for
          the [32.0, 33.0) request.
        test_recipe:
          setup: >-
            Edition FIELD_OPEN. Pacer licence "PC-1" already paces [0.0, 21.0) for this edition; licence
            "PC-2" has no assignments.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /race-editions
