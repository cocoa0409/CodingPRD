  - section: endpoints
    instances:
      - name: list_pagination_envelope_fields
        claim_type: listing
        grounds: ["response_envelope", "endpoints.GET /lab/catalog-items"]
        distinguishing_aspect: "List pagination honors limit/offset with the envelope's total_count and has_more: 3 items at limit 2 page into 2 + 1, with has_more true then false."
        test_recipe:
          setup: ["Exactly three catalog items PG-1, PG-2, PG-3 exist."]
          setup_api_calls:
            - call: "POST /lab/catalog-items"
              payload: { sku: "PG-1", name: "P1", item_class: "STANDARD", allocation_group: "GROUP_B", base_price_cents: 100, stock_on_hand: 5 }
              as: SupplyOps
            - call: "POST /lab/catalog-items"
              payload: { sku: "PG-2", name: "P2", item_class: "STANDARD", allocation_group: "GROUP_B", base_price_cents: 100, stock_on_hand: 5 }
              as: SupplyOps
            - call: "POST /lab/catalog-items"
              payload: { sku: "PG-3", name: "P3", item_class: "STANDARD", allocation_group: "GROUP_B", base_price_cents: 100, stock_on_hand: 5 }
              as: SupplyOps
          trigger:
            - call: "GET /lab/catalog-items?limit=2"
              as: SupplyOps
            - call: "GET /lab/catalog-items?limit=2&offset=2"
              as: SupplyOps
          assert:
            - "page 1: data has 2 items, meta/envelope reports total_count == 3 and has_more == true"
            - "page 2 (offset 2): data has 1 item and has_more == false"
            - "success envelope carries meta.api_request_id and meta.api_request_timestamp and response_type == array"

      - name: not_found_errors_across_entities
        claim_type: not_found
        grounds: ["errors[ERR_AGREEMENT_NOT_FOUND]", "errors[ERR_CONTRACT_NOT_FOUND]", "errors[ERR_SERVICE_REQUEST_NOT_FOUND]", "errors[ERR_ORDER_NOT_FOUND]", "errors[ERR_SURGE_EVENT_NOT_FOUND]", "errors[ERR_INSTRUMENT_NOT_FOUND]"]
        distinguishing_aspect: "Every path-id or body-FK lookup maps to its domain-specific 404: agreement, contract, service request, order, surge event, and instrument (via request creation) each return their own error_id rather than a generic 404."
        test_recipe:
          setup: ["A single account exists; its version is captured only to satisfy the renew endpoint's required OCC field (existence is checked before OCC, so the value is irrelevant)."]
          setup_api_calls:
            - call: "POST /lab/accounts"
              payload: { name: "Probe Lab", segment: "ACADEMIC", priority_class: "STANDARD", territory_code: "CA-NORTH" }
              as: AccountManager
              captures: { dv: $.data.version }
          trigger:
            - call: "GET /lab/enterprise-agreements/00000000-0000-4000-8000-000000000000"
              as: AccountManager
              captures: { e1: $.data.error_id }
            - call: "POST /lab/service-contracts/00000000-0000-4000-8000-000000000000/renew"
              payload: { expected_contract_version: "${dv}" }
              as: AccountManager
              captures: { e2: $.data.error_id }
            - call: "GET /lab/service-requests/00000000-0000-4000-8000-000000000000"
              as: ServiceDispatcher
              captures: { e3: $.data.error_id }
            - call: "GET /lab/orders/00000000-0000-4000-8000-000000000000"
              as: SupplyOps
              captures: { e4: $.data.error_id }
            - call: "POST /lab/surge-events/00000000-0000-4000-8000-000000000000/resolve"
              payload: {}
              as: SupplyOps
              captures: { e5: $.data.error_id }
            - call: "POST /lab/service-requests"
              payload: { instrument_id: "00000000-0000-4000-8000-000000000000", request_type: "BREAK_FIX", severity: "LOW" }
              as: AccountManager
              captures: { e6: $.data.error_id }
          assert:
            - "GET missing agreement -> ERR_AGREEMENT_NOT_FOUND; renew missing contract -> ERR_CONTRACT_NOT_FOUND"
            - "GET missing service request -> ERR_SERVICE_REQUEST_NOT_FOUND; GET missing order -> ERR_ORDER_NOT_FOUND"
            - "resolve missing surge -> ERR_SURGE_EVENT_NOT_FOUND; request create with missing instrument_id -> ERR_INSTRUMENT_NOT_FOUND"
            - "all six carry HTTP 404 and the standard error envelope"

  - section: rbac
    instances:
