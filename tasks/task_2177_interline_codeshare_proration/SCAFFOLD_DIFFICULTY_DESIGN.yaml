              captures: { bb: $.data.id }
            - call: "POST /interline/tickets"
              payload: { ticket_number: "0025000000001", validating_carrier_id: "${aa}", sale_currency: "USD", total_fare_minor: 100000, issue_date: "2026-08-10T00:00:00Z" }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { t1: $.data.id }
            - call: "POST /interline/tickets/${t1}/coupons"
              payload: { coupon_number: 1, origin: "JFK", destination: "LHR", operating_carrier_id: "${bb}", class_of_service: "FIRST", tpm_miles: 5000 }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { cx: $.data.id }
            - call: "POST /interline/tickets/${t1}/coupons"
              payload: { coupon_number: 2, origin: "LHR", destination: "JFK", operating_carrier_id: "${bb}", class_of_service: "FIRST", tpm_miles: 5000 }
              as: RevenueAccountant
              as_user_id: "${aa}"
              captures: { cy: $.data.id }
            - call: "POST /interline/coupons/${cx}/fly"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
          trigger:
            - call: "POST /interline/coupons/${cy}/fly"
              payload: {}
              as: RevenueAccountant
              as_user_id: "${aa}"
          assert:
            - "Immediately before the trigger, Carrier.${bb}.period_accrued_miles == 10000"
            - "Coupon.${cy}.ffp_miles_awarded == 10000 and Coupon.${cy}.ffp_tier == TIER_B"
            - "Coupon.${cy}.ffp_accrual_cost_minor == 11500 (not 14000)"
            - "Coupon.${cx}.ffp_tier == TIER_A and Coupon.${cx}.ffp_accrual_cost_minor == 14000 — unchanged"
            - "Carrier.${bb}.period_accrued_miles == 20000 and Carrier.${bb}.period_ffp_cost_estimate_minor == 25500"

