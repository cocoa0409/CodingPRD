          setup:
            - "Clock 2026-01-15; plan APPROVED; engagement in REPORTING with two SIGNED_OFF workpapers (10h and 12h) and no SUBMITTED ones"
            - "AuditReport for the engagement in PENDING_APPROVAL; DRAFT CommitteePack exists for the plan; QA review begun by unassigned assessor qa1"
