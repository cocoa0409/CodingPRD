            - "PAIR 1, APPROVE vs VERIFY — ${sd_i1_status_v} == VERIFIED with ${sd_i1_verby} == u_sd_ta1; u_sd_ta1's own approval returns ${sd_err_1} == ERR_SEGREGATION_OF_DUTIES with HTTP 403, and u_sd_ta2's approval then gives ${sd_i1_status_a} == APPROVED with ${sd_i1_apprby} == u_sd_ta2"
