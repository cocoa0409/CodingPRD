            - call: "POST /fee-invoices"
              payload: { device_id: "${dev_id}", type: "ANNUAL_RENEWAL", due_period: 12 }
              as: Registrar
              captures: { inv_id: "$.data.id" }
            - call: "POST /_clock/set"
              payload: { to_period_index: 12 }
              as: Registrar
          trigger:
