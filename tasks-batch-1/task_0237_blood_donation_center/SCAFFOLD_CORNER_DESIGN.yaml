        distinguishing_aspect: "An AVAILABLE RBC unit whose expires_at has passed cannot be reserved -> ERR_UNIT_EXPIRED (409)."
        test_recipe:
          setup: ["An AVAILABLE RBC unit collected 2025-01-01 (expires 2025-02-12); clock advanced to 2025-03-01 so it is past expiry."]
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Metro Blood", region_code: "US-CA" }
