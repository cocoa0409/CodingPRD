        claim_type: exclusive_operation_denied
        grounds: ["roles[ProgramAdmin]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "Program lifecycle is ProgramAdmin-exclusive; Teller gets 403 ERR_FORBIDDEN_FOR_ROLE (role check precedes existence/state)."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-R1", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
          trigger:
            - { call: "POST /v1/programs/${prog}/suspend", payload: {}, as: Teller, captures: { err: "$.data.error_id" } }
            - { call: "GET /v1/programs/${prog}", as: ProgramAdmin, captures: { p_status: "$.data.status" } }
          assert:
            - "err == ERR_FORBIDDEN_FOR_ROLE AND p_status == ACTIVE"

      - name: accountholder_cannot_seal_batch_returns_forbidden
        claim_type: exclusive_operation_denied
        grounds: ["roles[OperationsClerk]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "Batch lifecycle is OperationsClerk-exclusive; even the account holder affected by the batch cannot seal it."
        test_recipe:
          setup: ["Program; account; batch 2026-08-03 OPEN"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-R2", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H R2" }, as: Teller, captures: { acct: "$.data.id" } }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { b1: "$.data.id" } }
          trigger:
            - { call: "POST /v1/batches/${b1}/seal", payload: {}, as: AccountHolder, as_user_id: "${acct}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_FORBIDDEN_FOR_ROLE"

      - name: teller_cannot_activate_notice_returns_forbidden
        claim_type: exclusive_operation_denied
        grounds: ["roles[ComplianceOfficer]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "Notice activation is ComplianceOfficer-exclusive (segregation: ProgramAdmin issues, ComplianceOfficer activates)."
        test_recipe:
          setup: ["Program; notice created and issued at clock 2026-08-03T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-R3", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id", pv1: "$.data.version" } }
            - { call: "POST /v1/notices", payload: { program_id: "${prog}", parameter: DAILY_CAP_CENTS, new_value: "11000", expected_program_version: "${pv1}" }, as: ProgramAdmin, captures: { n1: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/notices/${n1}/issue", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /v1/notices/${n1}/activate", payload: {}, as: Teller, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_FORBIDDEN_FOR_ROLE"

      - name: accountholder_cannot_approve_waiver_returns_forbidden
        claim_type: exclusive_operation_denied
        grounds: ["roles[AccountHolder]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "Approval is restricted to Supervisor/Manager/ComplianceOfficer; the AccountHolder who owns the fee cannot approve their own request (403, role check before any SoD check)."
        test_recipe:
          setup: ["Program; opted-in account; batch 2026-08-03 debit 2000 sealed+settled -> fee 3500 POSTED; FULL waiver by AccountHolder -> PENDING_SUPERVISOR"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-R4", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H R4" }, as: Teller, captures: { acct: "$.data.id" } }
            - { call: "POST /v1/accounts/${acct}/opt-in-election", payload: { channel: BRANCH, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { b1: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 2000 }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches/${b1}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${b1}/settle", payload: {}, as: OperationsClerk }
            - { call: "GET /v1/fees?account_id=${acct}", as: ProgramAdmin, captures: { f1: "$.data[0].id" } }
            - { call: "POST /v1/fee-waiver-requests", payload: { account_id: "${acct}", fee_ids: ["${f1}"], kind: FULL, reason_code: FIRST_TIME }, as: AccountHolder, as_user_id: "${acct}", captures: { wr: "$.data.id" } }
          trigger:
            - { call: "POST /v1/fee-waiver-requests/${wr}/approve", payload: {}, as: AccountHolder, as_user_id: "${acct}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_FORBIDDEN_FOR_ROLE"

      - name: accountholder_cannot_transact_for_other_account
        claim_type: ownership_scope_enforced
        grounds: ["validations[priority=5]", "errors[ERR_ACCOUNT_OWNERSHIP_MISMATCH]", "roles[AccountHolder]"]
        distinguishing_aspect: "AccountHolder is entity_backed by DepositAccount: X-User-ID acct2 acting on account_id acct1 yields 403 ERR_ACCOUNT_OWNERSHIP_MISMATCH (after existence, before state checks)."
        test_recipe:
          setup: ["Program; two accounts acct1 and acct2"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-R5", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H One" }, as: Teller, captures: { acct1: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H Two" }, as: Teller, captures: { acct2: "$.data.id" } }
          trigger:
            - { call: "POST /v1/transactions", payload: { account_id: "${acct1}", type: DEBIT_ONE_TIME, amount_cents: 100 }, as: AccountHolder, as_user_id: "${acct2}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_ACCOUNT_OWNERSHIP_MISMATCH"

  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: fees_list_pagination_limit_offset
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "Pagination defaults and windowing: limit=2 returns 2 rows with has_more true and total_count 3; offset=2 returns the final row with has_more false."
        test_recipe:
          setup: ["Program (de_minimis 100); opted-in account; batch 2026-08-03 with three debits 1000 each (09:00..09:02) sealed -> 3 ASSESSED fees"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-EP1", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 100, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H EP1" }, as: Teller, captures: { acct: "$.data.id" } }
            - { call: "POST /v1/accounts/${acct}/opt-in-election", payload: { channel: BRANCH, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { b1: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 1000 }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:01:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 1000 }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:02:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 1000 }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches/${b1}/seal", payload: {}, as: OperationsClerk }
          trigger:
            - { call: "GET /v1/fees?account_id=${acct}&limit=2&offset=0", as: ProgramAdmin }
            - { call: "GET /v1/fees?account_id=${acct}&limit=2&offset=2", as: ProgramAdmin }
          assert:
            - "First page: 2 items, total_count 3, has_more true"
            - "Second page (offset 2): 1 item, total_count 3, has_more false"

      - name: fees_list_filter_by_status
        claim_type: listing
        grounds: [endpoints, entities.OverdraftFee.fields.status]
        distinguishing_aspect: "The status filter partitions the same fees: before settle status=ASSESSED returns 1 row and POSTED returns 0; after settle the counts swap."
        test_recipe:
          setup: ["Program; opted-in account; batch 2026-08-03 debit 2000 sealed -> 1 ASSESSED fee"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-EP2", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H EP2" }, as: Teller, captures: { acct: "$.data.id" } }
            - { call: "POST /v1/accounts/${acct}/opt-in-election", payload: { channel: BRANCH, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { b1: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 2000 }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches/${b1}/seal", payload: {}, as: OperationsClerk }
          trigger:
            - { call: "GET /v1/fees?account_id=${acct}&status=ASSESSED", as: ProgramAdmin }
            - { call: "GET /v1/fees?account_id=${acct}&status=POSTED", as: ProgramAdmin }
            - { call: "POST /v1/batches/${b1}/settle", payload: {}, as: OperationsClerk }
            - { call: "GET /v1/fees?account_id=${acct}&status=ASSESSED", as: ProgramAdmin }
            - { call: "GET /v1/fees?account_id=${acct}&status=POSTED", as: ProgramAdmin }
          assert:
            - "Pre-settle: ASSESSED list has 1 row, POSTED list is empty"
            - "Post-settle: ASSESSED list is empty, POSTED list has 1 row"

      - name: seal_empty_batch_zero_counters
        claim_type: boundary_edge
        grounds: [entities.PostingBatch.fields.items_posted_count, calculations.posting_order_and_fee_assessment]
        distinguishing_aspect: "Empty input set: sealing a batch with no matching AUTHORIZED items succeeds with all counters 0; settle succeeds and touches no account."
        test_recipe:
          setup: ["Program; account with no transactions; batch 2026-08-03 OPEN"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-EP3", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H EP3" }, as: Teller, captures: { acct: "$.data.id" } }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { b1: "$.data.id" } }
          trigger:
            - { call: "POST /v1/batches/${b1}/seal", payload: {}, as: OperationsClerk, captures: { posted: "$.data.items_posted_count", returned: "$.data.items_returned_count", fcount: "$.data.fees_assessed_count", fcents: "$.data.fees_assessed_cents", bstatus: "$.data.status" } }
            - { call: "POST /v1/batches/${b1}/settle", payload: {}, as: OperationsClerk, captures: { sstatus: "$.data.status" } }
            - { call: "GET /v1/accounts/${acct}", as: ProgramAdmin, captures: { ledger: "$.data.ledger_balance_cents", days: "$.data.consecutive_negative_business_days" } }
          assert:
            - "posted == 0 AND returned == 0 AND fcount == 0 AND fcents == 0 AND bstatus == SEALED"
            - "sstatus == SETTLED AND ledger == 0 AND days == 0  (non-negative account: counter resets/stays 0)"

  # ===========================================================================
  # Section: cross_cutting_complexity_layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_notice_create_stale_program_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[notice-create-stale-program]", "errors[ERR_STALE_PROGRAM_VERSION]"]
        distinguishing_aspect: "Notice creation with a stale expected_program_version (observed before another notice create bumped it) is rejected 412; with the fresh version it succeeds and supersedes the prior DRAFT."
        test_recipe:
          setup: ["Program created (version 1 captured); notice N1 created with expected_program_version 1 (program now version 2)"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-OCC1", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id", pv1: "$.data.version" } }
            - { call: "POST /v1/notices", payload: { program_id: "${prog}", parameter: FEE_AMOUNT, new_value: "3600", expected_program_version: "${pv1}" }, as: ProgramAdmin, captures: { n1: "$.data.id" } }
          trigger:
            - { call: "POST /v1/notices", payload: { program_id: "${prog}", parameter: FEE_AMOUNT, new_value: "3700", expected_program_version: "${pv1}" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
            - { call: "GET /v1/programs/${prog}", as: ProgramAdmin, captures: { pv2: "$.data.version" } }
            - { call: "POST /v1/notices", payload: { program_id: "${prog}", parameter: FEE_AMOUNT, new_value: "3700", expected_program_version: "${pv2}" }, as: ProgramAdmin, captures: { n2: "$.data.id", n2_status: "$.data.status" } }
            - { call: "GET /v1/notices/${n1}", as: ProgramAdmin, captures: { n1_status: "$.data.status" } }
          assert:
            - "err == ERR_STALE_PROGRAM_VERSION  (412; N1's creation bumped program version 1 -> 2)"
            - "pv2 == 2"
            - "n2_status == DRAFT AND n1_status == SUPERSEDED  (fresh-version create supersedes the older DRAFT on the same parameter)"

      - name: occ_offer_create_stale_account_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[offer-create-stale-account]", "errors[ERR_STALE_ACCOUNT_VERSION]"]
        distinguishing_aspect: "Education-offer creation with a stale expected_account_version is rejected 412; with the fresh version it succeeds and the previous OFFERED offer becomes SUPERSEDED."
        test_recipe:
          setup: ["Program; account (version 1 captured); manual offer O1 created with expected_account_version 1 (account now version 2)"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-OCC2", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H OCC2" }, as: Teller, captures: { acct: "$.data.id", av1: "$.data.version" } }
            - { call: "POST /v1/education-offers", payload: { account_id: "${acct}", offer_type: LINKED_SAVINGS, expected_account_version: "${av1}" }, as: Teller, captures: { o1: "$.data.id", o1_status: "$.data.status" } }
          trigger:
            - { call: "POST /v1/education-offers", payload: { account_id: "${acct}", offer_type: COUNSELING, expected_account_version: "${av1}" }, as: Teller, captures: { err: "$.data.error_id" } }
            - { call: "GET /v1/accounts/${acct}", as: ProgramAdmin, captures: { av2: "$.data.version" } }
            - { call: "POST /v1/education-offers", payload: { account_id: "${acct}", offer_type: COUNSELING, expected_account_version: "${av2}" }, as: Teller, captures: { o3: "$.data.id", o3_status: "$.data.status", o3_reason: "$.data.trigger_reason" } }
            - { call: "GET /v1/education-offers/${o1}", as: ProgramAdmin, captures: { o1_after: "$.data.status" } }
          assert:
            - "o1_status == OFFERED"
            - "err == ERR_STALE_ACCOUNT_VERSION  (412; O1's creation bumped account version 1 -> 2)"
            - "av2 == 2 AND o3_status == OFFERED AND o3_reason == MANUAL"
            - "o1_after == SUPERSEDED"

      - name: chargeoff_cascade_denies_pending_waiver_and_expires_offer
        claim_type: cascading_side_effects
        grounds: [state_machines.DepositAccount.RESTRICTED_to_CLOSED_CHARGEOFF, state_machines.FeeWaiverRequest, state_machines.EducationOffer.OFFERED_to_EXPIRED]
        distinguishing_aspect: "The charge-off transition cascades beyond the account row: a PENDING_SUPERVISOR waiver request is force-closed DENIED_FINAL and the OFFERED steering offer becomes EXPIRED."
        test_recipe:
          setup:
            - "Program (sustained threshold 1, grace 2, sustained fee 3000, steering 99); opted-in account"
            - "Batch 2026-08-03: debit 5000 sealed+settled -> OVERDRAFT fee 3500 POSTED, RESTRICTED, SUSTAINED fee 3000 POSTED, ledger -11500, SUSTAINED_OD offer OFFERED"
            - "FULL waiver on both fees (6500) created by the AccountHolder -> PENDING_SUPERVISOR"
            - "Batches 2026-08-04 and 2026-08-05 empty, sealed+settled -> restricted_business_days reaches 2"
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-CAS1", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 1, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 2, notice_window_days: 30, steering_fee_count_threshold: 99, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H CAS1" }, as: Teller, captures: { acct: "$.data.id" } }
            - { call: "POST /v1/accounts/${acct}/opt-in-election", payload: { channel: BRANCH, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { b1: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 5000 }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches/${b1}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${b1}/settle", payload: {}, as: OperationsClerk }
            - { call: "GET /v1/fees?account_id=${acct}&fee_type=OVERDRAFT", as: ProgramAdmin, captures: { f_od: "$.data[0].id" } }
            - { call: "GET /v1/fees?account_id=${acct}&fee_type=SUSTAINED", as: ProgramAdmin, captures: { f_sus: "$.data[0].id" } }
            - { call: "POST /v1/fee-waiver-requests", payload: { account_id: "${acct}", fee_ids: ["${f_od}", "${f_sus}"], kind: FULL, reason_code: HARDSHIP }, as: AccountHolder, as_user_id: "${acct}", captures: { wr: "$.data.id", wr_status: "$.data.status" } }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-04" }, as: OperationsClerk, captures: { b2: "$.data.id" } }
            - { call: "POST /v1/batches/${b2}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${b2}/settle", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-05" }, as: OperationsClerk, captures: { b3: "$.data.id" } }
            - { call: "POST /v1/batches/${b3}/seal", payload: {}, as: OperationsClerk }
          trigger:
            - { call: "POST /v1/batches/${b3}/settle", payload: {}, as: OperationsClerk }
            - { call: "GET /v1/accounts/${acct}", as: ProgramAdmin, captures: { a_status: "$.data.status", a_co: "$.data.charged_off_cents" } }
            - { call: "GET /v1/fee-waiver-requests/${wr}", as: ProgramAdmin, captures: { wr_after: "$.data.status" } }
            - { call: "GET /v1/education-offers?account_id=${acct}", as: ProgramAdmin, captures: { off_after: "$.data[0].status" } }
          assert:
            - "wr_status == PENDING_SUPERVISOR  (AccountHolder-created, 6500 in supervisor band)"
            - "a_status == CLOSED_CHARGEOFF AND a_co == 11500"
            - "wr_after == DENIED_FINAL  (cascade force-closes pending requests)"
            - "off_after == EXPIRED  (cascade retires open offers)"

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_mutation_visible_in_response
        claim_type: immediate_consistency
        grounds: [response_envelope]
        distinguishing_aspect: "Mutations return the post-mutation resource in the same response: revoke shows REVOKED without a re-read, and seal returns its computed counters inline."
        test_recipe:
          setup: ["Program; account; election OPTED_IN; batch 2026-08-03 with one authorized credit 700"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-CON1", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H CON1" }, as: Teller, captures: { acct: "$.data.id" } }
            - { call: "POST /v1/accounts/${acct}/opt-in-election", payload: { channel: BRANCH, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acct}", captures: { el: "$.data.id" } }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { b1: "$.data.id" } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: CREDIT_DEPOSIT, amount_cents: 700 }, as: AccountHolder, as_user_id: "${acct}" }
          trigger:
            - { call: "POST /v1/opt-in-elections/${el}/revoke", payload: {}, as: AccountHolder, as_user_id: "${acct}", captures: { rev_status: "$.data.status", rev_ver: "$.data.version" } }
            - { call: "POST /v1/batches/${b1}/seal", payload: {}, as: OperationsClerk, captures: { seal_posted: "$.data.items_posted_count", seal_status: "$.data.status" } }
          assert:
            - "rev_status == REVOKED AND rev_ver == 2  (no re-read needed)"
            - "seal_posted == 1 AND seal_status == SEALED"

  # ===========================================================================
  # Section: excluded stubs — corners already exercised by §1.8 instances
  # ===========================================================================
  - section: calculations
    instances:
      - name: corner_posting_order_variant_divergence_covered
        claim_type: variant_divergence
        grounds: [calculations.posting_order_and_fee_assessment]
        excluded_because:
          difficulty_instance: posting_order_high_to_low_vs_chronological_fee_count
          rationale: "Variant divergence (2 vs 1 fees on identical inputs) asserted there."
      - name: corner_waiver_rounding_order_covered
        claim_type: precision
        grounds: [calculations.waiver_allocation]
        excluded_because:
          difficulty_instance: waiver_percent_rounding_per_item_then_sum
          rationale: "Per-item-then-sum rounding pinned against the sum-then-round alternative (3039 vs 3038)."
      - name: corner_working_balance_ordering_covered
        claim_type: correct_result
        grounds: [calculations.working_vs_ledger_balance_ordering]
        excluded_because:
          difficulty_instance: same_batch_fees_never_enter_working_balance
          rationale: "Intermediate ledger (-700 vs -7700) proves fees stay out of same-batch working balance."
      - name: corner_report_basis_divergence_covered
        claim_type: variant_selection
        grounds: [calculations.report_revenue_metrics]
        excluded_because:
          difficulty_instance: report_revenue_provisional_vs_final_basis
          rationale: "Provisional 7000 vs final 3500 on identical period data asserted there."
      - name: corner_cap_exact_fit_covered
        claim_type: boundary_edge
        grounds: [calculations.posting_order_and_fee_assessment]
        excluded_because:
          difficulty_instance: fee_assessment_cap_de_minimis_interplay
          rationale: "Exact-fit <= cap admission and cap block asserted there."
      - name: corner_sustained_threshold_covered
        claim_type: boundary_edge
        grounds: [calculations.sustained_overdraft_day_count]
        excluded_because:
          difficulty_instance: sustained_day_count_exact_threshold_boundary
          rationale: "Count 2 vs 3 at threshold 3 asserted there."
      - name: corner_de_minimis_boundary_covered
        claim_type: boundary_edge
        grounds: [calculations.posting_order_and_fee_assessment]
        excluded_because:
          difficulty_instance: de_minimis_exact_threshold_boundary
          rationale: "Magnitude == 500 (no fee) vs 501 (fee) asserted there."
  - section: state_machines
    instances:
      - name: corner_optin_cycle_covered
        claim_type: valid_transition
        grounds: [state_machines.OptInElection]
        excluded_because:
          difficulty_instance: opt_in_election_revoke_reinstate_cycle
          rationale: "Full OPTED_IN->REVOKED->OPTED_IN->REVOKED cycle with versions asserted there."
      - name: corner_waiver_appeal_cycle_covered
        claim_type: valid_transition
        grounds: [state_machines.FeeWaiverRequest]
        excluded_because:
          difficulty_instance: waiver_request_deny_appeal_cycle
          rationale: "Deny->appeal->higher-band cycle through compliance approval asserted there."
      - name: corner_close_blocked_pending_waiver_covered
        claim_type: precondition_enforcement
        grounds: [state_machines.DepositAccount.ACTIVE_to_CLOSED_VOLUNTARY]
        excluded_because:
          difficulty_instance: account_close_blocked_by_pending_waiver
          rationale: "ERR_OPEN_ITEMS_BLOCK_CLOSE then successful close after denial asserted there."
      - name: corner_settle_cascade_covered
        claim_type: side_effect_execution
        grounds: [state_machines.PostingBatch.SEALED_to_SETTLED]
        excluded_because:
          difficulty_instance: settle_cascade_restrict_to_offer
          rationale: "Depth-4 settle cascade (fees->ledger->count->restrict->offer) asserted there."
      - name: corner_reversal_cascade_covered
        claim_type: compensation
        grounds: [state_machines.AccountTransaction.POSTED_to_REVERSED]
        excluded_because:
          difficulty_instance: reversal_cascade_voids_fee_restores_ledger
          rationale: "Reverse->ledger restore->fee VOID->aggregates asserted there."
  - section: validations
    instances:
      - name: corner_priority_state_fiscal_covered
        claim_type: priority_ordering
        grounds: ["validations[priority=7]", "validations[priority=12]"]
        excluded_because:
          difficulty_instance: waiver_create_state_error_beats_fiscal_error
          rationale: "Dual violation returns ERR_FEE_NOT_WAIVABLE (state) over ERR_WAIVER_AMOUNT_INVALID (fiscal)."
      - name: corner_priority_safety_temporal_covered
        claim_type: priority_ordering
        grounds: ["validations[priority=8]", "validations[priority=9]"]
        excluded_because:
          difficulty_instance: notice_activate_suspended_program_beats_window_error
          rationale: "Dual violation returns ERR_PROGRAM_SUSPENDED (safety) over ERR_NOTICE_WINDOW_NOT_ELAPSED (temporal)."
  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_notice_window_overlap_covered
        claim_type: rate_threshold_triggers
        grounds: ["errors[ERR_NOTICE_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: notice_windows_half_open_adjacency
          rationale: "Overlap at -1s rejected and exact-adjacency issue allowed, asserted there."
      - name: corner_report_tiling_covered
        claim_type: rate_threshold_triggers
        grounds: ["errors[ERR_REPORT_PERIOD_OVERLAP]", "errors[ERR_REPORT_PERIOD_GAP]"]
        excluded_because:
          difficulty_instance: report_periods_closed_interval_tiling
          rationale: "Overlap, gap, and exact-tiling acceptance asserted there."
      - name: corner_fee_pair_invariant_covered
        claim_type: derived_field_reconciliation
        grounds: [entities.DepositAccount.fields.lifetime_fees_assessed_cents]
        excluded_because:
          difficulty_instance: fee_assess_then_waive_conserves_net_position
          rationale: "ledger + assessed - waived invariant pinned at -1000 across assess and waive."
      - name: corner_chargeoff_invariant_covered
        claim_type: derived_field_reconciliation
        grounds: [entities.DepositAccount.fields.charge_off_original_cents]
        excluded_because:
          difficulty_instance: chargeoff_recovery_conserves_principal
          rationale: "charged_off + recovered == original (11500) asserted across two recoveries."
      - name: corner_optin_gating_covered
        claim_type: conditional_validation
        grounds: [state_machines.AccountTransaction.AUTHORIZED_to_RETURNED_NSF]
        excluded_because:
          difficulty_instance: onetime_debit_outcome_depends_on_election_state
          rationale: "RETURNED_NSF vs POSTED+fee on identical debits across election states asserted there."

  # ===========================================================================
  # Section: endpoints (addendum — remaining action endpoints)
  # ===========================================================================
  - section: endpoints
    instances:
      - name: escalate_moves_request_up_one_band
        claim_type: action_endpoint
        grounds: [state_machines.FeeWaiverRequest.PENDING_SUPERVISOR_to_PENDING_MANAGER]
        distinguishing_aspect: "Escalate moves PENDING_SUPERVISOR to PENDING_MANAGER without touching fees; the request then requires Manager-band approval."
        test_recipe:
          setup: ["Program with fee 7000 (caps 1000000/10); opted-in account; batch 2026-08-03 debit 1000 sealed+settled -> fee 7000 POSTED; FULL waiver by Teller t-1 -> PENDING_SUPERVISOR"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-EP4", fee_amount_cents: 7000, daily_fee_cap_cents: 1000000, max_daily_fees_count: 10, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /v1/accounts", payload: { program_id: "${prog}", holder_name: "H EP4" }, as: Teller, captures: { acct: $.data.id } }
            - { call: "POST /v1/accounts/${acct}/opt-in-election", payload: { channel: BRANCH, disclosure_version: "D1" }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { b1: $.data.id } }
            - { call: "POST /v1/transactions", payload: { account_id: "${acct}", type: DEBIT_ONE_TIME, amount_cents: 1000 }, as: AccountHolder, as_user_id: "${acct}" }
            - { call: "POST /v1/batches/${b1}/seal", payload: {}, as: OperationsClerk }
            - { call: "POST /v1/batches/${b1}/settle", payload: {}, as: OperationsClerk }
            - { call: "GET /v1/fees?account_id=${acct}", as: ProgramAdmin, captures: { f1: "$.data[0].id" } }
            - { call: "POST /v1/fee-waiver-requests", payload: { account_id: "${acct}", fee_ids: ["${f1}"], kind: FULL, reason_code: HARDSHIP }, as: Teller, as_user_id: "teller-1", captures: { wr: $.data.id, wr_status: $.data.status } }
          trigger:
            - { call: "POST /v1/fee-waiver-requests/${wr}/escalate", payload: {}, as: Supervisor, as_user_id: "sup-1", captures: { esc_status: $.data.status } }
            - { call: "POST /v1/fee-waiver-requests/${wr}/approve", payload: {}, as: Supervisor, as_user_id: "sup-2", captures: { err: $.data.error_id } }
            - { call: "POST /v1/fee-waiver-requests/${wr}/approve", payload: {}, as: Manager, as_user_id: "mgr-1", captures: { fin_status: $.data.status } }
          assert:
            - "wr_status == PENDING_SUPERVISOR AND esc_status == PENDING_MANAGER"
            - "err == ERR_WAIVER_EXCEEDS_AUTHORITY  (Supervisor band no longer covers the escalated request)"
            - "fin_status == APPLIED"

      - name: cancel_open_batch_frees_date
        claim_type: action_endpoint
        grounds: [state_machines.PostingBatch.OPEN_to_CANCELLED, "errors[ERR_BATCH_ALREADY_EXISTS]"]
        distinguishing_aspect: "An OPEN batch can be cancelled; the date is then free for a fresh batch, and settling the CANCELLED one fails."
        test_recipe:
          setup: ["Program; batch 2026-08-03 OPEN"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { name: "OD-EP5", fee_amount_cents: 3500, daily_fee_cap_cents: 10500, max_daily_fees_count: 3, de_minimis_threshold_cents: 500, sustained_overdraft_days_threshold: 5, sustained_overdraft_fee_cents: 3000, charge_off_grace_business_days: 10, notice_window_days: 30, steering_fee_count_threshold: 6, steering_window_days: 90, offer_expiry_days: 30, posting_order_policy: CHRONOLOGICAL, current_disclosure_version: "D1" }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { b1: $.data.id } }
          trigger:
            - { call: "POST /v1/batches/${b1}/cancel", payload: {}, as: OperationsClerk, captures: { c_status: $.data.status } }
            - { call: "POST /v1/batches", payload: { program_id: "${prog}", business_date: "2026-08-03" }, as: OperationsClerk, captures: { b2_status: $.data.status } }
            - { call: "POST /v1/batches/${b1}/settle", payload: {}, as: OperationsClerk, captures: { err: $.data.error_id } }
          assert:
            - "c_status == CANCELLED AND b2_status == OPEN  (CANCELLED frees the business date)"
            - "err == ERR_INVALID_STATE_TRANSITION  (CANCELLED is terminal for settle)"
