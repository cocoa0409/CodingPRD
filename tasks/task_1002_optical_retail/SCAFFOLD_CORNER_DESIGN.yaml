  # ===========================================================================
  # RBAC
  # ===========================================================================
  - section: rbac
    instances:

      - name: customer_cannot_verify_a_prescription
        claim_type: Role Denial
        grounds: [roles.Customer, roles.OpticianVerifier, "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "POST /optical/prescriptions/{id}/verify is an OpticianVerifier exclusive_operation; a Customer calling it — even on their own prescription — gets ERR_UNAUTHORIZED (403) and the Rx stays SUBMITTED."
        test_recipe:
          setup: ["A customer with their own SUBMITTED prescription."]
          setup_api_calls:
            - call: "POST /optical/customers"
              payload: { full_name: "Self Verify", email: "self@x.com", dob: "1992-03-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/prescriptions"
              payload: { customer_id: "${cust_id}", od_sphere: -1.00, od_cylinder: 0.00, os_sphere: -1.00, os_cylinder: 0.00, pd_mm: 62.0, issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rx_id: $.data.id }
          trigger:
            - call: "POST /optical/prescriptions/${rx_id}/verify"
              payload: { decision: "VERIFIED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${err} == ERR_UNAUTHORIZED"
            - "Prescription.${rx_id}.status == SUBMITTED"

      - name: lab_technician_cannot_deliver_a_lab_order
        claim_type: Role Denial
        grounds: [roles.LabTechnician, roles.StoreAssociate, "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Peer-role separation: POST /optical/lab-orders/{id}/deliver is a StoreAssociate exclusive_operation, so the LabTechnician who shipped the very same lab order is refused with ERR_UNAUTHORIZED (403) and it stays SHIPPED."
        test_recipe:
          setup: ["A self-pay order whose LabOrder is SHIPPED."]
          setup_api_calls:
            - call: "POST /optical/frames"
              payload: { sku: "FRM-C29", name: "Reilly", brand: "WP", price_cents: 9500, tryon_stock: 1, min_pd_mm: 54.0, max_pd_mm: 70.0 }
              as: PlatformAdmin
              captures: { frame_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "M150", category: "MATERIAL", base_price_cents: 0, material_index: 1.50 }
              as: PlatformAdmin
              captures: { m150_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Peer Role", email: "peer@x.com", dob: "1992-04-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/prescriptions"
              payload: { customer_id: "${cust_id}", od_sphere: -1.00, od_cylinder: 0.00, os_sphere: -1.00, os_cylinder: 0.00, pd_mm: 62.0, issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /optical/prescriptions/${rx_id}/verify"
              payload: { decision: "VERIFIED" }
              as: OpticianVerifier
            - call: "POST /optical/orders"
              payload: { customer_id: "${cust_id}", prescription_id: "${rx_id}", frame_id: "${frame_id}", material_option_id: "${m150_id}", delivery_method: "SHIP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /optical/orders/${ord_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /optical/lab-orders?order_id=${ord_id}"
              as: LabTechnician
              captures: { lab_id: "$.data[0].id" }
            - call: "POST /optical/lab-orders/${lab_id}/start"
              payload: {}
              as: LabTechnician
            - call: "POST /optical/lab-orders/${lab_id}/qc"
              payload: { result: "PASS" }
              as: LabTechnician
            - call: "POST /optical/lab-orders/${lab_id}/ship"
              payload: {}
              as: LabTechnician
          trigger:
            - call: "POST /optical/lab-orders/${lab_id}/deliver"
              payload: {}
              as: LabTechnician
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${err} == ERR_UNAUTHORIZED"
            - "LabOrder.${lab_id}.status == SHIPPED"
            - "LabOrder.${lab_id}.delivered_at == null"

      - name: customer_cannot_read_another_customers_order
        claim_type: Ownership Denial
        grounds: ["validations[priority=6]", "errors[ERR_UNAUTHORIZED]", roles.Customer]
        distinguishing_aspect: "The Customer role is entity_backed:Customer, so X-User-ID must equal the resource's customer_id: customer B reading customer A's order gets ERR_UNAUTHORIZED (403), not 404."
        test_recipe:
          setup: ["Customer A owns a DRAFT order; customer B owns nothing."]
          setup_api_calls:
            - call: "POST /optical/frames"
              payload: { sku: "FRM-C30", name: "Durand", brand: "WP", price_cents: 9500, tryon_stock: 1, min_pd_mm: 54.0, max_pd_mm: 70.0 }
              as: PlatformAdmin
              captures: { frame_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "M150", category: "MATERIAL", base_price_cents: 0, material_index: 1.50 }
              as: PlatformAdmin
              captures: { m150_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Own Er", email: "owner@x.com", dob: "1992-05-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_a: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Snoop Er", email: "snoop@x.com", dob: "1992-06-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_b: $.data.id }
            - call: "POST /optical/prescriptions"
              payload: { customer_id: "${cust_a}", od_sphere: -1.00, od_cylinder: 0.00, os_sphere: -1.00, os_cylinder: 0.00, pd_mm: 62.0, issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_a}"
              captures: { rx_a: $.data.id }
            - call: "POST /optical/prescriptions/${rx_a}/verify"
              payload: { decision: "VERIFIED" }
              as: OpticianVerifier
            - call: "POST /optical/orders"
              payload: { customer_id: "${cust_a}", prescription_id: "${rx_a}", frame_id: "${frame_id}", material_option_id: "${m150_id}", delivery_method: "SHIP" }
              as: Customer
              as_user_id: "${cust_a}"
              captures: { ord_a: $.data.id }
          trigger:
            - call: "GET /optical/orders/${ord_a}"
              as: Customer
              as_user_id: "${cust_b}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${err} == ERR_UNAUTHORIZED"

      - name: get_order_missing_auth_headers_returns_unauthenticated
        claim_type: Role Denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "The request is sent with NO X-User-Role and NO X-User-ID headers: priority 1 fires with ERR_UNAUTHENTICATED (401) before the priority-4 existence check, so an unknown order id still yields 401 rather than 404."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /optical/orders/33333333-3333-4333-8333-333333333333"
              as: Customer
              captures: { err: $.data.error_id }
          assert:
            - "The request omits both the X-User-Role and X-User-ID headers"
            - "HTTP status == 401"
            - "${err} == ERR_UNAUTHENTICATED"

      - name: benefits_admin_cannot_create_a_frame
        claim_type: Role Denial
        grounds: [roles.BenefitsAdmin, roles.PlatformAdmin, "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Catalog writes are a PlatformAdmin exclusive_operation; BenefitsAdmin — despite being an operator role — is refused with ERR_UNAUTHORIZED (403) and no Frame is persisted."
        test_recipe:
          setup: ["Empty catalog."]
          setup_api_calls: []
          trigger:
            - call: "POST /optical/frames"
              payload: { sku: "FRM-NO", name: "Nope", brand: "WP", price_cents: 9500, tryon_stock: 1, min_pd_mm: 54.0, max_pd_mm: 70.0 }
              as: BenefitsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${err} == ERR_UNAUTHORIZED"

