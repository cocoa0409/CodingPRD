            - "both rejections leave Referral.${refb_id}.status == TRIAGED with its version unchanged, so the same expected_referral_version ${refb_v} still works for the accepted third attempt"
            - "exactly three Procedure rows exist for room ANGIO-14 on 2026-08-01 and Referral.${refb_id}.status ends SCHEDULED"
            - "no ERR_SEDATION_CAPACITY_EXCEEDED or ERR_RECOVERY_BAY_UNAVAILABLE is ever raised: sedation_level NONE skips the rn and bay headrooms entirely, and no sedation_rn_id was supplied"

      - name: sedation_rn_ceiling_is_an_aggregate_of_two_not_a_pairwise_exclusion
        grounds:
          - validations.priority_20_ERR_SEDATION_CAPACITY_EXCEEDED
          - calculations.sedation_staffing_capacity
          - entities.Clinician.fields.max_concurrent_sedation_cases
        distinguishing_aspect: |
          The RN rule is a cardinality ceiling, not mutual exclusion: with
          max_concurrent_sedation_cases 2 the SECOND overlapping case is legal and only the third
          is refused, so an implementation that treats any RN overlap as a conflict fails on the
          second booking rather than the third. The intervals are unbuffered and half-open, which
          the fourth call exploits - a case starting exactly when one incumbent ends overlaps only
          the other, drops the count to 1, and is accepted. Three separate rooms with
          turnover_buffer_min 0 and recovery_bay_count 3 keep the room and bay headrooms out of the
          way so only the RN dimension can decide.
        test_recipe:
          setup:
            - "one sedation RN with moderate_sedation_credentialed true and max_concurrent_sedation_cases 2"
            - "three rooms ANGIO-15A/15B/15C, each turnover_buffer_min 0, daily_case_cap 6, recovery_bay_count 3"
            - "one patient with an IN_USE AVG access, one benign reading, three TRIAGED ROUTINE referrals"
            - "case 1 booked into room A 13:00-14:00 MODERATE, case 2 booked into room B 13:30-14:30 MODERATE"
