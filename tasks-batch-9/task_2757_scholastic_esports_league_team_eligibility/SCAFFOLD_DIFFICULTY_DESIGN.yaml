  - rule_id: cross_entity_state_dependency
    instances:

      - name: team_registration_blocked_by_revoked_district_title_approval
        entity_pair: "(Team, TitleApproval)"
        grounds:
          - validations[priority=35]
          - errors[ERR_TITLE_NOT_DISTRICT_APPROVED]
          - state_machines.TitleApproval.APPROVED_to_REVOKED
          - state_machines.Team.DRAFT_to_REGISTERED
        distinguishing_aspect: |
          The gating state lives on a TitleApproval that the Team does not reference by any
          foreign key — it is found by matching (School(Team.school_id).district_id,
          Team.title_id). Nothing about the Team changes when the district revokes the title, so
          the guard can only be satisfied by re-reading the approval at registration time. The
          instance also pins the asymmetry: a revocation blocks new registrations but leaves the
          already-REGISTERED team alone.
        test_recipe:
          setup:
            - "One district, one school, two CERTIFIED coaches, one title, one TitleApproval that the district APPROVES"
            - "Season in REGISTRATION_OPEN; team Alpha holds one ACTIVE STARTER slot and registers successfully while the approval is APPROVED"
            - "Team Bravo is created but never given a roster slot — the approval guard at priority 35 runs before the roster minimum at priority 58"
            - "The district then REVOKES the approval"
            - "Logical clock left at the 2026-08-01T00:00:00.000Z startup default"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "Metro District", state_code: "CA" }
              as: LeagueAdmin
