      - name: wheelchair_layout_floors_effective_capacity_at_fifty_one_of_sixty_one_seats
        claim_type: precision
        grounds:
          - calculations.room_effective_capacity
          - calculations.room_effective_capacity.constants.WHEELCHAIR_LAYOUT_SEAT_LOSS_RATE
