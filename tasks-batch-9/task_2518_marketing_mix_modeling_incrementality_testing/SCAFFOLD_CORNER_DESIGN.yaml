      - name: experiment_temporal_gates_and_conversion_ceiling_rejected
        claim_type: violation_to_error
        grounds:
          - "errors ERR_EXPERIMENT_NOT_STARTED (409) - validations priority 67, check current_utc >= start_date"
          - "errors ERR_EXPERIMENT_NOT_ELAPSED (409) - validations priority 67, check current_utc >= end_date"
          - "errors ERR_CONVERSIONS_EXCEED_POPULATION (422) - validations priority 61, check treatment_conversions <= treatment_population and control_conversions <= control_population and the same for the two pre-period counts"
          - "endpoints POST /mmm/experiments/{id}/read-out input [treatment_conversions, control_conversions, pre_treatment_conversions, pre_control_conversions]"
        distinguishing_aspect: |
          One experiment walks the whole temporal ladder: DESIGN_LOCKED cannot start before its start_date,
          RUNNING cannot read out before its end_date, and once the clock has passed the end date the
          numeric ceiling applies to all FOUR counts - a pre-period count above the arm population is
          rejected exactly like a post-period one, which is the half of the rule an implementation that
          only checks the two post counts silently drops.
          
        test_recipe:
          setup:
            - "Market US_CORE with channel A_SEARCH. Experiment E1 is AUDIENCE_SPLIT / DIFF_IN_DIFF over [2026-09-07, 2026-10-05) with arms 245000/245000, and is DESIGN_LOCKED."
            - "The clock is set forward to 2026-08-01T00:00:00Z, before the start date."
            - "245000 is the realised population of each arm, so 300000 and 250000 are both above the ceiling while 5145/4900/4655/4900 are all below it."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { mkt: "$.data.id" }
            - call: "POST /mmm/media-channels"
              payload: { market_id: "${mkt}", channel_code: "A_SEARCH", channel_type: "SEARCH", adstock_decay_rate: 0.50, adstock_max_lag_periods: 2, saturation_half_point_cents: 200000, response_ceiling_units: 1200, min_spend_cents: 200000, max_spend_cents: 3000000, status: "ACTIVE" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { cha: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /mmm/experiments"
              payload: { market_id: "${mkt}", channel_id: "${cha}", design_type: "AUDIENCE_SPLIT", readout_method: "DIFF_IN_DIFF", start_date: "2026-09-07T00:00:00Z", end_date: "2026-10-05T00:00:00Z", washout_days: 7, minimum_detectable_effect_pct: 5.0, baseline_conversion_rate: 0.0200, planned_treatment_population: 245000, planned_control_population: 245000 }
              as: ExperimentDesigner
              as_user_id: "ed-1"
              captures: { exp1: "$.data.id" }
            - call: "POST /mmm/experiments/${exp1}/lock-design"
              as: ExperimentDesigner
              as_user_id: "ed-1"
          trigger:
            - call: "POST /mmm/experiments/${exp1}/start"
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-08T00:00:00Z" }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /mmm/experiments/${exp1}/start"
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /mmm/experiments/${exp1}/read-out"
              payload: { treatment_conversions: 5145, control_conversions: 4900, pre_treatment_conversions: 4655, pre_control_conversions: 4900 }
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-05T00:00:00Z" }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /mmm/experiments/${exp1}/read-out"
              payload: { treatment_conversions: 300000, control_conversions: 4900, pre_treatment_conversions: 4655, pre_control_conversions: 4900 }
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /mmm/experiments/${exp1}/read-out"
              payload: { treatment_conversions: 5145, control_conversions: 4900, pre_treatment_conversions: 250000, pre_control_conversions: 4900 }
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /mmm/experiments/${exp1}/read-out"
              payload: { treatment_conversions: 5145, control_conversions: 4900, pre_treatment_conversions: 4655, pre_control_conversions: 4900 }
              as: ExperimentDesigner
              as_user_id: "ed-1"
          assert:
            - "Call 1 returns 409 with data.error_id == ERR_EXPERIMENT_NOT_STARTED, and GET /mmm/experiments/${exp1} still shows status == DESIGN_LOCKED."
            - "Call 3 returns 200 with data.status == RUNNING, data.treatment_population == 245000 and data.control_population == 245000."
            - "Call 4 returns 409 with data.error_id == ERR_EXPERIMENT_NOT_ELAPSED - the clock is at 2026-09-08, inside the window."
            - "Call 6 returns 422 with data.error_id == ERR_CONVERSIONS_EXCEED_POPULATION for treatment_conversions 300000 > 245000."
            - "Call 7 returns 422 with the same error_id for pre_treatment_conversions 250000 > 245000, with all other counts legal - the two pre-period counts are checked too."
            - "After calls 4, 6 and 7 the experiment is still RUNNING with measured_lift_pct == null and treatment_conversions == null."
            - "Call 8 returns 200 with data.status == READ_OUT and data.measured_lift_pct == 10.00 - current_utc 2026-10-05 == end_date is the inclusive boundary of priority 67."
      - name: assign_cells_with_foreign_market_cell_rejected
        claim_type: violation_to_error
        grounds:
          - "errors ERR_GEO_CELL_NOT_IN_MARKET (422) - validations priority 55, check every listed GeoCell's market_id equals the experiment's market_id"
          - "entities.GeoCell.cell_code constraints - unique per (market_id, cell_code), so the same code may exist in two markets"
          - "complexity_profile entity_topology flat - foreign keys are validated for cross-reference integrity, not just for existence"
        distinguishing_aspect: |
          The cell exists, so the priority-20 existence check passes and a 404 would be wrong: the failure
          is a cross-market referential one at priority 55, and it rejects the whole list, leaving the
          same-market cell in the request UNASSIGNED and both markets' held_out_population at 0.
          
        test_recipe:
          setup:
            - "Market US_CORE (M1) with channel A_SEARCH and geo cells GC01 and GC02 of population 100000 each."
            - "A second market EU_CORE (M2) with its own geo cell GC01 of population 100000 - the same cell_code is legal because uniqueness is scoped per market."
            - "Experiment E1 is GEO_HOLDOUT on A_SEARCH in M1 and is DESIGN_LOCKED."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
