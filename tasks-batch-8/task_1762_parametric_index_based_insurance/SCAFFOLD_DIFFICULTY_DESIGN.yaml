              payload: { station_id: "${st_id}", window_end_date: "2026-06-30", measured_value: 30 }
              as: DataOperations
            - call: "GET /programs/${prog_id}/trigger-events"
              payload: { index_definition_id: "${idx_id}" }
              as: ClaimsAdjuster
              captures: { ev_id: "$.data[0].id" }
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/trigger-events/${ev_id}/open-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /programs/${prog_id}/index-definitions/${idx_id}/trigger-events/${ev_id}/verify"
              payload: {}
              as: ClaimsAdjuster
              captures: { tier_hit: $.data.max_tier_breached, blend: $.data.blended_index_value }
            - call: "GET /programs/${prog_id}/claims"
              payload: { policy_id: "${pol_id}" }
              as: ClaimsAdjuster
              captures: { claim_prov: "$.data[0].provisional_payout_cents" }
          assert:
            - "blended_index_value (${blend}) == 30 (exact threshold value)"
            - "max_tier_breached (${tier_hit}) == 2 — inclusive <= boundary: exactly 30 breaches the 30mm tier"
            - "claim provisional (${claim_prov}) == 1000000 (tier-2 fraction 0.50 on si 2,000,000), not 500000"

      - name: treaty_exhaustion_exact_limit_boundary
        grounds:
          - calculations.cession_allocation
          - state_machines.ReinsuranceTreaty.ACTIVE_to_EXHAUSTED
        distinguishing_aspect: |
          Zero-remaining-capacity boundary on a different metric (treaty
          recovered_to_date_cents) via a different endpoint (release-payment):
          a treaty with limit exactly equal to its computed cession
          (limit 270,000; cession rhu(900,000*0.30) = 270,000) must flip to
          EXHAUSTED on equality (recovered == limit), and the NEXT claim must
          cede 0 to that treaty — testing >= vs > at the exact boundary.
