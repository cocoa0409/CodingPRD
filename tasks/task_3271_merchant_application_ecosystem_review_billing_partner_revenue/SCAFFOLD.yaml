scenario: "Merchant Application Ecosystem Review, Billing & Partner Revenue Share (Shopify): application submission with functionality review, security requirements and data access scope justification, listing approval, categorization and search ranking in the app marketplace, billing through the platform with recurring, usage-based and one-time charges appearing on the merchant's platform invoice, revenue share tiers with thresholds where the platform takes a reduced or zero share, application permission scopes with merchant consent and post-install access review, uninstall handling with mandatory data deletion and webhook compliance, application performance requirements affecting storefront speed with delisting risk, developer support obligations and dispute handling with merchants"
domain_name: "app-ecosystem-review-billing"
api_prefix: "/"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers: [cascading_side_effects, dual_variant_calculation, rate_threshold_triggers, optimistic_concurrency]
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, many_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: DeveloperAccount
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Legal company name of the developer organization" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email; unique across developer accounts", constraints: "unique" }
      - { name: payout_currency, type: enum, source: input, description: "Settlement currency for revenue-share payouts", constraints: "enum {USD, EUR, GBP}" }
      - { name: status, type: enum, source: system, description: "Lifecycle of the developer account", default: ACTIVE, constraints: "enum {ACTIVE, SUSPENDED, CLOSED}" }
      - { name: lifetime_gross_cents, type: integer, source: computed, description: "Sum of AppBillingCharge.final_amount_cents for charges with status INVOICED or SETTLED across all apps owned by this developer; drives revenue_share_tier (calculation revenue_share_tier_assignment)", default: 0 }

  - name: App
    parent: DeveloperAccount
    common_fields: true
    fields:
      - { name: developer_id, type: string, source: input, description: "FK -> DeveloperAccount.id; owning developer" }
      - { name: name, type: string, source: input, description: "Public app name; unique per developer account", constraints: "unique within developer_id" }
      - { name: status, type: enum, source: system, description: "Marketplace lifecycle of the app", default: DRAFT, constraints: "enum {DRAFT, IN_REVIEW, CHANGES_REQUESTED, APPROVED, LISTED, SUSPENDED, DELISTED}" }
      - { name: listing_status, type: enum, source: system, description: "Marketplace visibility dimension, independent of the review status axis", default: UNLISTED, constraints: "enum {UNLISTED, LISTED, DELISTED}" }
      - { name: category, type: enum, source: input, description: "Primary marketplace category chosen at submission", constraints: "enum {PRODUCTIVITY, MARKETING, FULFILLMENT, ANALYTICS, FINANCE}" }
      - { name: submitted_at, type: datetime, source: system, description: "Timestamp of the most recent DRAFT|CHANGES_REQUESTED -> IN_REVIEW transition; null before first submission", default: null }
      - { name: revenue_share_tier, type: enum, source: computed, description: "Derived from owning DeveloperAccount.lifetime_gross_cents by calculation revenue_share_tier_assignment", constraints: "enum {T0, T1, T2}" }
      - { name: performance_state, type: enum, source: system, description: "Storefront performance compliance dimension", default: COMPLIANT, constraints: "enum {COMPLIANT, DEGRADED, DELISTED_PERFORMANCE}" }

  - name: AppVersion
    parent: App
    common_fields: true
    fields:
      - { name: app_id, type: string, source: input, description: "FK -> App.id; parent app" }
      - { name: semver, type: string, source: input, description: "Semantic version string; unique within app_id" }
      - { name: status, type: enum, source: system, description: "Review lifecycle of this version", default: SUBMITTED, constraints: "enum {SUBMITTED, IN_REVIEW, CHANGES_REQUESTED, APPROVED, REJECTED, PUBLISHED, SUPERSEDED}" }
      - { name: review_round, type: integer, source: system, description: "Number of completed review rounds for this version; increments on every CHANGES_REQUESTED -> IN_REVIEW resubmission", default: 0 }

  - name: PermissionScope
    parent: null
    common_fields: false
    fields:
      - { name: code, type: string, source: input, description: "Scope code, e.g. read_products; unique system-wide", constraints: "unique" }
      - { name: risk_level, type: enum, source: input, description: "Platform-assigned data sensitivity of the scope", constraints: "enum {LOW, MEDIUM, HIGH}" }

  - name: ScopeRequest
    parent: AppVersion
    common_fields: true
    fields:
      - { name: app_version_id, type: string, source: input, description: "FK -> AppVersion.id; version requesting the scope" }
      - { name: scope_code, type: string, source: input, description: "FK -> PermissionScope.code; requested scope" }
      - { name: justification, type: string, source: input, description: "Free-text data-access justification; required for HIGH risk scopes, min length 20 chars" }
      - { name: status, type: enum, source: system, description: "Reviewer disposition of this scope request", default: PENDING, constraints: "enum {PENDING, APPROVED, DENIED}" }
      - { name: denied_reason, type: string, source: system, description: "Reason recorded when status transitions to DENIED; null otherwise", default: null }

  - name: ReviewWindow
    parent: AppVersion
    common_fields: true
    fields:
      - { name: app_version_id, type: string, source: input, description: "FK -> AppVersion.id; version under review" }
      - { name: reviewer_id, type: string, source: input, description: "Opaque id of the assigned Reviewer; segregation of duties: reviewer_id MUST NOT equal app.developer_id of the version's app (enforced by validations priority 6, ERR_REVIEWER_CONFLICT)" }
      - { name: starts_at, type: datetime, source: input, description: "Window start (inclusive lower bound of the half-open interval [starts_at, ends_at))" }
      - { name: ends_at, type: datetime, source: input, description: "Window end (exclusive upper bound); must be strictly after starts_at" }
      - { name: status, type: enum, source: system, description: "Window lifecycle", default: SCHEDULED, constraints: "enum {SCHEDULED, CANCELLED, COMPLETED}" }

  - name: MerchantAccount
    parent: null
    common_fields: true
    fields:
      - { name: shop_domain, type: string, source: input, description: "Unique storefront domain", constraints: "unique" }
      - { name: plan_tier, type: enum, source: input, description: "Merchant platform plan", constraints: "enum {BASIC, GROWTH, ENTERPRISE}" }

  - name: Installation
    parent: App
    common_fields: true
    fields:
      - { name: app_id, type: string, source: input, description: "FK -> App.id; installed app" }
      - { name: merchant_id, type: string, source: input, description: "FK -> MerchantAccount.id; installing merchant" }
      - { name: status, type: enum, source: system, description: "Install lifecycle with reconsent loop", default: PENDING_CONSENT, constraints: "enum {PENDING_CONSENT, ACTIVE, RECONSENT_REQUIRED, SUSPENDED, UNINSTALLING, UNINSTALLED}" }
      - { name: installed_at, type: datetime, source: system, description: "Timestamp of the most recent transition into ACTIVE; null until first activation", default: null }
      - { name: uninstalled_at, type: datetime, source: system, description: "Timestamp of transition into UNINSTALLING; null while installed", default: null }
      - { name: data_deletion_deadline, type: datetime, source: system, description: "uninstalled_at + 30 days; mandatory data-deletion deadline", default: null }
      - { name: data_deletion_confirmed_at, type: datetime, source: system, description: "Timestamp the developer confirmed data deletion; null until confirmation", default: null }

  - name: ConsentRecord
    parent: Installation
    common_fields: true
    fields:
      - { name: installation_id, type: string, source: input, description: "FK -> Installation.id; consent context" }
      - { name: scope_code, type: string, source: input, description: "FK -> PermissionScope.code; scope consented or revoked" }
      - { name: status, type: enum, source: system, description: "Consent lifecycle; REVOKED is terminal for the record while the installation may remain ACTIVE", default: GRANTED, constraints: "enum {GRANTED, REVOKED}" }
      - { name: granted_at, type: datetime, source: system, description: "Grant timestamp" }
      - { name: revoked_at, type: datetime, source: system, description: "Revocation timestamp; null while GRANTED", default: null }

  - name: WebhookSubscription
    parent: Installation
    common_fields: true
    fields:
      - { name: installation_id, type: string, source: input, description: "FK -> Installation.id; owning installation" }
      - { name: topic, type: string, source: input, description: "Webhook topic, e.g. app/uninstalled, customers/data_request" }
      - { name: endpoint_url, type: string, source: input, description: "Delivery URL registered by the developer" }
      - { name: status, type: enum, source: system, description: "Delivery health dimension", default: ACTIVE, constraints: "enum {ACTIVE, FAILING, DISABLED}" }

  - name: AppBillingCharge
    parent: Installation
    common_fields: true
    fields:
      - { name: installation_id, type: string, source: input, description: "FK -> Installation.id; billed installation" }
      - { name: billing_cycle, type: string, source: system, description: "Owning MonthlyInvoice.cycle (YYYY-MM); server-minted at creation from the logical clock", constraints: "format YYYY-MM" }
      - { name: charge_type, type: enum, source: input, description: "Billing model of the charge", constraints: "enum {RECURRING, USAGE, ONE_TIME}" }
      - { name: status, type: enum, source: system, description: "Charge lifecycle; PENDING charges mutate, APPROVED+ are frozen", default: PENDING, constraints: "enum {PENDING, APPROVED, DECLINED, INVOICED, REVERSED, SETTLED}" }
      - { name: base_amount_cents, type: integer, source: input, description: "Pre-discount amount; > 0" }
      - { name: discount_code, type: string, source: input, description: "Optional coupon code; ONE_TIME charges only", default: null }
      - { name: discount_amount_cents, type: integer, source: computed, description: "Computed by calculation charge_net_computation at creation; 0 when no coupon", default: 0 }
      - { name: final_amount_cents, type: integer, source: computed, description: "base_amount_cents - discount_amount_cents, rounded per calculation charge_net_computation" }
      - { name: platform_share_cents, type: integer, source: computed, description: "Platform revenue share per calculation charge_net_computation, using the app's revenue_share_tier at INVOICED time" }
      - { name: developer_net_cents, type: integer, source: computed, description: "final_amount_cents - platform_share_cents" }
      - { name: description, type: string, source: input, description: "Line-item description shown on the merchant invoice" }
      - { name: capped_at, type: datetime, source: system, description: "USAGE only: end of the 30-day proration window applied at creation; null for other types", default: null }

  - name: MonthlyInvoice
    parent: MerchantAccount
    common_fields: true
    fields:
      - { name: merchant_id, type: string, source: input, description: "FK -> MerchantAccount.id; invoiced merchant" }
      - { name: cycle, type: string, source: input, description: "Billing cycle key YYYY-MM; unique per merchant", constraints: "unique within merchant_id" }
      - { name: status, type: enum, source: system, description: "Invoice lifecycle", default: OPEN, constraints: "enum {OPEN, ISSUED, PAID, VOID}" }
      - { name: total_cents, type: integer, source: computed, description: "Sum of final_amount_cents over AppBillingCharge rows with billing_cycle == cycle, installation.merchant_id == merchant_id, status INVOICED; refreshed by the charge ledger sync", default: 0 }
      - { name: issued_at, type: datetime, source: system, description: "Timestamp of OPEN -> ISSUED; null while OPEN", default: null }

  - name: RevenueShareLedgerEntry
    parent: DeveloperAccount
    common_fields: true
    fields:
      - { name: developer_id, type: string, source: input, description: "FK -> DeveloperAccount.id; ledger owner" }
      - { name: charge_id, type: string, source: input, description: "FK -> AppBillingCharge.id; originating charge" }
      - { name: entry_type, type: enum, source: input, description: "Ledger movement kind", constraints: "enum {ACCRUAL, REVERSAL, ADJUSTMENT}" }
      - { name: amount_cents, type: integer, source: input, description: "Signed movement applied to DeveloperAccount.lifetime_gross_cents" }
      - { name: entry_variant, type: enum, source: system, description: "Which variant of calculation developer_accrual produced this entry", constraints: "enum {PROVISIONAL, FINAL}" }
      - { name: cycle, type: string, source: system, description: "Billing cycle YYYY-MM this entry accrues to" }

  - name: PerformanceSample
    parent: Installation
    common_fields: true
    fields:
      - { name: installation_id, type: string, source: input, description: "FK -> Installation.id; sampled installation" }
      - { name: storefront_load_ms, type: integer, source: input, description: "Observed storefront render time in milliseconds; > 0" }
      - { name: sampled_at, type: datetime, source: input, description: "Observation timestamp used by the 7-day rolling window" }

  - name: GovernanceStrike
    parent: App
    common_fields: true
    fields:
      - { name: app_id, type: string, source: input, description: "FK -> App.id; penalized app" }
      - { name: reason, type: enum, source: input, description: "Violation category", constraints: "enum {DATA_DELETION_OVERDUE, WEBHOOK_NONCOMPLIANCE, PERFORMANCE_BREACH, SUPPORT_BREACH}" }
      - { name: status, type: enum, source: system, description: "Strike lifecycle", default: ACTIVE, constraints: "enum {ACTIVE, EXPIRED, CLEARED}" }
      - { name: strike_start, type: datetime, source: system, description: "Logical-clock timestamp when the strike was opened" }
      - { name: strike_ends_at, type: datetime, source: system, description: "strike_start + 30 days; a strike counts toward delisting only while status == ACTIVE and strike_ends_at > current logical time" }

  - name: SupportTicket
    parent: App
    common_fields: true
    fields:
      - { name: app_id, type: string, source: input, description: "FK -> App.id; ticket subject" }
      - { name: merchant_id, type: string, source: input, description: "FK -> MerchantAccount.id; merchant who opened the ticket" }
      - { name: severity, type: enum, source: input, description: "Ticket severity", constraints: "enum {LOW, MEDIUM, HIGH}" }
      - { name: sla_hours, type: integer, source: computed, description: "First-response SLA in hours per calculation support_sla: 72/48/24 for LOW/MEDIUM/HIGH" }
      - { name: status, type: enum, source: system, description: "Ticket lifecycle", default: OPEN, constraints: "enum {OPEN, ANSWERED, ESCALATED, RESOLVED, DISPUTED}" }
      - { name: opened_at, type: datetime, source: system, description: "Logical-clock open timestamp" }
      - { name: first_response_at, type: datetime, source: system, description: "Timestamp of the first developer response; null until answered", default: null }
      - { name: sla_breached, type: boolean, source: computed, description: "Set true by calculation support_sla at resolve/escalate time when (resolution time - opened_at) > sla_hours and first_response_at is null or late", default: false }

state_machines:
  - entity: App
    initial_state: DRAFT
    terminal_states: [DELISTED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /apps/{id}/submit"
        actor: Developer
        preconditions: ["app.status == DRAFT", "app has at least one AppVersion with status SUBMITTED", "developer.status == ACTIVE"]
        side_effects: ["app.submitted_at = now", "the referenced AppVersion transitions SUBMITTED -> IN_REVIEW", "app.version += 1"]
      - from: IN_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /app-versions/{id}/request-changes"
        actor: Reviewer
        preconditions: ["app.status == IN_REVIEW", "version.status == IN_REVIEW", "reviewer_id != app.developer_id (segregation of duties)"]
        side_effects: ["version.status -> CHANGES_REQUESTED", "every ScopeRequest of this version with status PENDING stays PENDING", "app.version += 1"]
      - from: CHANGES_REQUESTED
        to: IN_REVIEW
        trigger: "POST /apps/{id}/submit"
        actor: Developer
        preconditions: ["app.status == CHANGES_REQUESTED", "version.status == CHANGES_REQUESTED"]
        side_effects: ["version.review_round += 1", "version.status -> IN_REVIEW", "app.submitted_at = now", "app.version += 1"]
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /app-versions/{id}/approve"
        actor: Reviewer
        preconditions: ["app.status == IN_REVIEW", "version.status == IN_REVIEW", "every ScopeRequest of this version has status IN {APPROVED, DENIED} (none PENDING)", "reviewer_id != app.developer_id"]
        side_effects: ["version.status -> APPROVED", "app.version += 1"]
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /app-versions/{id}/reject"
        actor: Reviewer
        preconditions: ["app.status == IN_REVIEW", "version.status == IN_REVIEW", "reviewer_id != app.developer_id"]
        side_effects: ["version.status -> REJECTED", "every ScopeRequest of this version transitions PENDING -> DENIED with denied_reason 'VERSION_REJECTED'", "app.version += 1"]
      - from: APPROVED
        to: LISTED
        trigger: "POST /apps/{id}/publish"
        actor: Developer
        preconditions: ["app.status == APPROVED", "exactly one AppVersion of this app has status APPROVED"]
        side_effects: ["the APPROVED version transitions APPROVED -> PUBLISHED", "every other version with status PUBLISHED transitions PUBLISHED -> SUPERSEDED", "app.listing_status -> LISTED", "app.version += 1"]
      - from: LISTED
        to: SUSPENDED
        trigger: "POST /apps/{id}/suspend"
        actor: PlatformAdmin
        preconditions: ["app.status == LISTED"]
        side_effects: ["app.listing_status -> DELISTED", "every Installation of this app with status ACTIVE transitions ACTIVE -> SUSPENDED", "app.version += 1"]
      - from: SUSPENDED
        to: LISTED
        trigger: "POST /apps/{id}/reinstate"
        actor: PlatformAdmin
        preconditions: ["app.status == SUSPENDED", "no GovernanceStrike of this app has status ACTIVE with reason IN {DATA_DELETION_OVERDUE, WEBHOOK_NONCOMPLIANCE}"]
        side_effects: ["app.listing_status -> LISTED", "every Installation with status SUSPENDED transitions SUSPENDED -> ACTIVE", "app.version += 1"]
      - from: SUSPENDED
        to: DELISTED
        trigger: "POST /apps/{id}/delist"
        actor: PlatformAdmin
        preconditions: ["app.status == SUSPENDED", "at least 5 GovernanceStrike rows of this app have status ACTIVE and strike_ends_at > now"]
        side_effects: ["app.listing_status -> DELISTED", "every Installation with status IN {ACTIVE, SUSPENDED, RECONSENT_REQUIRED} transitions to UNINSTALLING with uninstalled_at = now and data_deletion_deadline = now + 30 days", "app.version += 1"]
      - from: LISTED
        to: DELISTED
        trigger: "system: performance delisting (calculation storefront_performance_score sets performance_state DELISTED_PERFORMANCE)"
        actor: system
        preconditions: ["performance_state transitioned to DELISTED_PERFORMANCE"]
        side_effects: ["app.listing_status -> DELISTED", "a GovernanceStrike with reason PERFORMANCE_BREACH is opened", "app.version += 1"]

  - entity: AppVersion
    initial_state: SUBMITTED
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "POST /apps/{id}/submit"
        actor: Developer
        preconditions: ["parent app transitions into IN_REVIEW"]
        side_effects: ["review_round unchanged"]
      - from: IN_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /app-versions/{id}/request-changes"
        actor: Reviewer
        preconditions: ["version.status == IN_REVIEW"]
        side_effects: []
      - from: CHANGES_REQUESTED
        to: IN_REVIEW
        trigger: "POST /apps/{id}/submit (resubmission)"
        actor: Developer
        preconditions: ["version.status == CHANGES_REQUESTED"]
        side_effects: ["review_round += 1"]
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /app-versions/{id}/approve"
        actor: Reviewer
        preconditions: ["all ScopeRequests resolved"]
        side_effects: []
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /app-versions/{id}/reject"
        actor: Reviewer
        preconditions: ["version.status == IN_REVIEW"]
        side_effects: ["version is terminal"]
      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /apps/{id}/publish"
        actor: Developer
        preconditions: ["app.status == APPROVED"]
        side_effects: []
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system: a newer version of the same app is published"
        actor: system
        preconditions: ["another AppVersion of the same app transitions APPROVED -> PUBLISHED"]
        side_effects: []

  - entity: Installation
    initial_state: PENDING_CONSENT
    terminal_states: [UNINSTALLED]
    transitions:
      - from: PENDING_CONSENT
        to: ACTIVE
        trigger: "POST /installations/{id}/consent"
        actor: Merchant
        preconditions: ["installation.status == PENDING_CONSENT", "every requested scope of the app's PUBLISHED version has a ScopeRequest with status APPROVED", "merchant_id == acting merchant"]
        side_effects: ["a ConsentRecord with status GRANTED is created per approved scope", "installed_at = now", "installation.version += 1"]
      - from: ACTIVE
        to: RECONSENT_REQUIRED
        trigger: "POST /installations/{id}/request-reconsent"
        actor: PlatformAdmin
        preconditions: ["installation.status == ACTIVE", "a post-install access review flagged a scope delta"]
        side_effects: ["installation.version += 1"]
      - from: RECONSENT_REQUIRED
        to: ACTIVE
        trigger: "POST /installations/{id}/consent (re-consent)"
        actor: Merchant
        preconditions: ["installation.status == RECONSENT_REQUIRED"]
        side_effects: ["new ConsentRecord rows with status GRANTED for the delta scopes", "installation.version += 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: parent app suspended"
        actor: system
        preconditions: ["app.status transitioned LISTED -> SUSPENDED"]
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: parent app reinstated"
        actor: system
        preconditions: ["app.status transitioned SUSPENDED -> LISTED"]
        side_effects: []
      - from: ACTIVE
        to: UNINSTALLING
        trigger: "POST /installations/{id}/uninstall"
        actor: Merchant
        preconditions: ["installation.status IN {ACTIVE, RECONSENT_REQUIRED, SUSPENDED}", "merchant_id == acting merchant"]
        side_effects: ["uninstalled_at = now", "data_deletion_deadline = now + 30 days", "every AppBillingCharge of this installation with status PENDING transitions PENDING -> REVERSED", "every WebhookSubscription of this installation with status ACTIVE receives an app/uninstalled delivery attempt", "installation.version += 1"]
      - from: RECONSENT_REQUIRED
        to: UNINSTALLING
        trigger: "POST /installations/{id}/uninstall"
        actor: Merchant
        preconditions: ["merchant_id == acting merchant"]
        side_effects: ["same as ACTIVE -> UNINSTALLING"]
      - from: SUSPENDED
        to: UNINSTALLING
        trigger: "POST /installations/{id}/uninstall"
        actor: Merchant
        preconditions: ["merchant_id == acting merchant"]
        side_effects: ["same as ACTIVE -> UNINSTALLING"]
      - from: UNINSTALLING
        to: UNINSTALLED
        trigger: "POST /installations/{id}/confirm-data-deletion"
        actor: Developer
        preconditions: ["installation.status == UNINSTALLING", "now <= data_deletion_deadline", "developer_id == app.developer_id"]
        side_effects: ["data_deletion_confirmed_at = now", "every WebhookSubscription of this installation transitions to DISABLED", "installation.version += 1"]
      - from: UNINSTALLING
        to: UNINSTALLED
        trigger: "system: data_deletion_deadline passes without confirmation (calculation uninstall_deadline_enforcement)"
        actor: system
        preconditions: ["now > data_deletion_deadline", "data_deletion_confirmed_at is null"]
        side_effects: ["a GovernanceStrike with reason DATA_DELETION_OVERDUE is opened against the app", "every WebhookSubscription transitions to DISABLED", "installation.version += 1"]

  - entity: ConsentRecord
    initial_state: GRANTED
    terminal_states: [REVOKED]
    transitions:
      - from: GRANTED
        to: REVOKED
        trigger: "POST /installations/{id}/consent-records/{record_id}/revoke"
        actor: Merchant
        preconditions: ["record.status == GRANTED", "installation.status == ACTIVE", "scope.risk_level != HIGH OR every AppBillingCharge of the installation with status PENDING is first voided"]
        side_effects: ["revoked_at = now", "the installation transitions ACTIVE -> RECONSENT_REQUIRED", "installation.version += 1"]

  - entity: AppBillingCharge
    initial_state: PENDING
    terminal_states: [DECLINED, REVERSED, SETTLED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /billing-charges/{id}/approve"
        actor: Merchant
        preconditions: ["charge.status == PENDING", "installation.status IN {ACTIVE, RECONSENT_REQUIRED}", "merchant_id == installation.merchant_id"]
        side_effects: ["charge.version += 1"]
      - from: PENDING
        to: DECLINED
        trigger: "POST /billing-charges/{id}/decline"
        actor: Merchant
        preconditions: ["charge.status == PENDING", "merchant_id == installation.merchant_id"]
        side_effects: ["charge.version += 1"]
      - from: APPROVED
        to: INVOICED
        trigger: "POST /invoices/{id}/issue"
        actor: PlatformAdmin
        preconditions: ["invoice.status == OPEN", "charge.status == APPROVED", "charge.billing_cycle == invoice.cycle"]
        side_effects: ["charge.platform_share_cents and developer_net_cents finalized via calculation charge_net_computation using app.revenue_share_tier at invoice time", "charge.version += 1"]
      - from: PENDING
        to: REVERSED
        trigger: "system: installation uninstalled (PENDING charges void) OR POST /billing-charges/{id}/reverse by PlatformAdmin"
        actor: system
        preconditions: ["charge.status == PENDING"]
        side_effects: ["charge.version += 1"]
      - from: INVOICED
        to: REVERSED
        trigger: "POST /billing-charges/{id}/reverse"
        actor: PlatformAdmin
        preconditions: ["charge.status == INVOICED", "the owning MonthlyInvoice.status == ISSUED (not yet PAID)"]
        side_effects: ["a RevenueShareLedgerEntry with entry_type REVERSAL and amount_cents == -(charge.final_amount_cents) is appended", "calculation developer_accrual FINAL variant reruns for the developer", "invoice.total_cents is recomputed", "charge.version += 1"]
      - from: INVOICED
        to: SETTLED
        trigger: "POST /invoices/{id}/mark-paid"
        actor: PlatformAdmin
        preconditions: ["invoice.status == ISSUED", "charge.status == INVOICED"]
        side_effects: ["charge.version += 1"]

  - entity: MonthlyInvoice
    initial_state: OPEN
    terminal_states: [PAID, VOID]
    transitions:
      - from: OPEN
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: PlatformAdmin
        preconditions: ["invoice.status == OPEN", "at least one AppBillingCharge with billing_cycle == invoice.cycle and installation.merchant_id == invoice.merchant_id has status APPROVED"]
        side_effects: ["every matching APPROVED charge transitions APPROVED -> INVOICED", "issued_at = now", "invoice.total_cents recomputed per calculation invoice_total", "a PROVISIONAL RevenueShareLedgerEntry per calculation developer_accrual is appended for each newly INVOICED charge", "invoice.version += 1"]
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/mark-paid"
        actor: PlatformAdmin
        preconditions: ["invoice.status == ISSUED"]
        side_effects: ["every INVOICED charge of the cycle transitions INVOICED -> SETTLED", "calculation developer_accrual FINAL variant runs: PROVISIONAL entries for the cycle are superseded by FINAL entries and DeveloperAccount.lifetime_gross_cents is recomputed from SETTLED + INVOICED charges", "invoice.version += 1"]
      - from: OPEN
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: PlatformAdmin
        preconditions: ["invoice.status == OPEN", "no charge of the cycle has status INVOICED"]
        side_effects: ["invoice.version += 1"]

  - entity: SupportTicket
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: ANSWERED
        trigger: "POST /support-tickets/{id}/respond"
        actor: Developer
        preconditions: ["ticket.status == OPEN", "developer_id == app.developer_id"]
        side_effects: ["first_response_at = now", "ticket.version += 1"]
      - from: OPEN
        to: ESCALATED
        trigger: "POST /support-tickets/{id}/escalate"
        actor: Merchant
        preconditions: ["ticket.status == OPEN", "merchant_id == ticket.merchant_id"]
        side_effects: ["calculation support_sla evaluates sla_breached", "ticket.version += 1"]
      - from: ANSWERED
        to: RESOLVED
        trigger: "POST /support-tickets/{id}/resolve"
        actor: Developer
        preconditions: ["ticket.status IN {ANSWERED, ESCALATED, DISPUTED}", "developer_id == app.developer_id"]
        side_effects: ["calculation support_sla evaluates sla_breached", "ticket.version += 1"]
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /support-tickets/{id}/resolve"
        actor: Developer
        preconditions: ["developer_id == app.developer_id"]
        side_effects: ["calculation support_sla evaluates sla_breached; when sla_breached becomes true a GovernanceStrike with reason SUPPORT_BREACH is opened", "ticket.version += 1"]
      - from: RESOLVED
        to: DISPUTED
        trigger: "POST /support-tickets/{id}/dispute"
        actor: Merchant
        preconditions: ["ticket.status == RESOLVED", "merchant_id == ticket.merchant_id", "now - resolved_at <= 14 days"]
        side_effects: ["ticket.version += 1"]
      - from: DISPUTED
        to: RESOLVED
        trigger: "POST /support-tickets/{id}/resolve"
        actor: Developer
        preconditions: ["developer_id == app.developer_id"]
        side_effects: ["ticket.version += 1"]

concurrency_rules:
  - rule_id: app-update-stale-version
    parent_entity: App
    write_endpoint: "PATCH /apps/{id}"
    occ_field: "expected_app_version"
    description: |
      Updating an App whose version has advanced since the client last observed
      it is rejected. This captures the case where a reviewer action (e.g.
      request-changes) or a system cascade (performance delisting) has mutated
      the app after the developer loaded it, so the developer's edit is based
      on a stale snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: invoice-issue-stale-version
    parent_entity: MonthlyInvoice
    write_endpoint: "POST /invoices/{id}/issue"
    occ_field: "expected_invoice_version"
    description: |
      Issuing a MonthlyInvoice whose version has advanced since the client last
      observed it is rejected. This captures the case where a prior issue call
      already flipped the invoice (and recomputed total_cents) after the
      operator loaded it, so a second issue carrying the old version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: revenue_share_tier_assignment
    trigger: "on every DeveloperAccount.lifetime_gross_cents mutation (charge INVOICED, charge REVERSED, invoice PAID) and on read of App.revenue_share_tier"
    algorithm: threshold
    formula: |
      g = developer.lifetime_gross_cents
      if g <= 100000000: tier = T0      # exactly 1000000.00 still qualifies for zero share
      elif g <= 1000000000: tier = T1
      else: tier = T2
      Boundaries are inclusive-down: 100000000 -> T0, 100000001 -> T1.
    input_set: "the owning DeveloperAccount of the App"
    constants:
      T0_MAX_CENTS: 100000000
      T1_MAX_CENTS: 1000000000
    precision: "integer cents; tier is a pure function of lifetime_gross_cents"

  - name: charge_net_computation
    trigger: "at AppBillingCharge creation (discount + provisional share) and at APPROVED -> INVOICED (share finalized with the tier in force at invoice time)"
    algorithm: tiered_pricing
    formula: |
      # pinned evaluation order: discount first, then share, then net.
      # (1) discount: only ONE_TIME charges honor discount_code.
      if charge_type == ONE_TIME and discount_code == "LAUNCH10":
          discount_amount_cents = round(base_amount_cents * 0.10)   # round_half_up to integer cents
      else:
          discount_amount_cents = 0
      final_amount_cents = base_amount_cents - discount_amount_cents
      # (2) share: rate selected by app.revenue_share_tier at the moment of invoicing
      rate = {T0: 0.00, T1: 0.15, T2: 0.20}[app.revenue_share_tier]
      platform_share_cents = round(final_amount_cents * rate)       # round_half_up
      # (3) net
      developer_net_cents = final_amount_cents - platform_share_cents
    input_set: "the charge being computed; app.revenue_share_tier of the installation's app"
    constants:
      LAUNCH10_RATE: 0.10
      T1_SHARE_RATE: 0.15
      T2_SHARE_RATE: 0.20
    precision: "integer cents, round_half_up; discount rounds before the share is computed"

  - name: developer_accrual
    trigger: "on MonthlyInvoice OPEN -> ISSUED (PROVISIONAL) and on MonthlyInvoice ISSUED -> PAID or charge INVOICED -> REVERSED (FINAL)"
    algorithm: aggregation
    formula: |
      # Dual variant over the SAME inputs:
      # PROVISIONAL: accrue every charge of the developer with status INVOICED
      #   whose billing_cycle == invoice.cycle, including cycles whose invoice is
      #   still ISSUED-but-unpaid. Optimistic: assumes all invoiced charges collect.
      # FINAL: accrue only charges with status SETTLED, plus INVOICED charges whose
      #   invoice is already PAID. Pessimistic: reversed and unpaid charges excluded.
      # Both variants write RevenueShareLedgerEntry rows; FINAL supersedes
      # PROVISIONAL for the same cycle (entry_variant markers), and
      # DeveloperAccount.lifetime_gross_cents is recomputed as
      #   sum(final_amount_cents of charges with status INVOICED or SETTLED).
    input_set: "AppBillingCharge rows for installations of apps owned by the developer; status filter differs per variant (INVOICED vs SETTLED-or-paid)"
    constants: {}
    precision: "integer cents"
    variants:
      - name: PROVISIONAL
        when: "invoice issue time"
        difference: "includes INVOICED charges regardless of invoice payment state"
      - name: FINAL
        when: "invoice paid or charge reversed"
        difference: "excludes REVERSED charges and charges on still-unpaid invoices; supersedes the PROVISIONAL entry for the cycle"

  - name: usage_charge_proration
    trigger: "at creation of an AppBillingCharge with charge_type USAGE"
    algorithm: threshold
    formula: |
      # A USAGE charge created fewer than 30 days after installation.installed_at
      # is capped to a prorated share of the declared base_amount_cents:
      days_elapsed = floor((now - installed_at) / 86400s)
      capped_amount = round(base_amount_cents * min(days_elapsed, 30) / 30)   # round_half_up
      effective base = min(base_amount_cents, capped_amount)
      capped_at = installed_at + 30 days
    input_set: "the installation and the new charge"
    constants:
      PRORATION_WINDOW_DAYS: 30
    precision: "integer cents, round_half_up"

  - name: storefront_performance_score
    trigger: "on POST /installations/{id}/performance-samples"
    algorithm: aggregation
    formula: |
      # Rolling 7-day window ending at the new sample's sampled_at, inclusive of
      # the window end and exclusive of the window start: [sampled_at - 7d, sampled_at].
      samples = PerformanceSample rows of the installation with sampled_at in the window
      avg_load_ms = mean(storefront_load_ms)   # arithmetic mean, 2 decimals, round_half_up
      budget_ms = 200
      impact = round(2 * avg_load_ms)          # integer ms
      if impact <= budget_ms: performance_state stays/becomes COMPLIANT   # boundary is INCLUSIVE
      else: app.performance_state -> DEGRADED and a GovernanceStrike with reason PERFORMANCE_BREACH opens
      # 3 consecutive windows (distinct sampled_at days) in breach -> DELISTED_PERFORMANCE
    input_set: "PerformanceSample rows of one installation within the rolling window"
    constants:
      BUDGET_MS: 200
      IMPACT_MULTIPLIER: 2
      BREACH_STRIKES_TO_DELIST: 3
    precision: "mean at 2 decimals round_half_up; impact integer ms"

  - name: search_ranking_score
    trigger: "on GET /apps?search=... for LISTED apps"
    algorithm: weighted_scoring
    formula: |
      # score = w1 * quality_score + w2 * install_velocity + w3 * recency_score
      # quality_score: 10 - count(ACTIVE GovernanceStrikes), floor 0
      # install_velocity: count of Installations of the app with installed_at within the last 30 days, capped at 10
      # recency_score: 5 if a version was PUBLISHED within the last 30 days, else 0
      # Weights are per-category: PRODUCTIVITY (1,2,3), MARKETING (2,2,1),
      # FULFILLMENT (3,1,1), ANALYTICS (2,1,2), FINANCE (2,3,0).
      # Ranking: score DESC, tie-break app.created_at ASC. id is never consulted.
    input_set: "apps with listing_status == LISTED"
    constants:
      W_PRODUCTIVITY: [1, 2, 3]
      W_MARKETING: [2, 2, 1]
      W_FULFILLMENT: [3, 1, 1]
      W_ANALYTICS: [2, 1, 2]
      W_FINANCE: [2, 3, 0]
    precision: "integer score"

  - name: support_sla
    trigger: "on SupportTicket creation (assign sla_hours) and on resolve/escalate (evaluate sla_breached)"
    algorithm: threshold
    formula: |
      sla_hours = {LOW: 72, MEDIUM: 48, HIGH: 24}[severity]
      sla_breached = (first_response_at is null and (now - opened_at) > sla_hours)
                  or (first_response_at - opened_at) > sla_hours
      Boundary: exactly sla_hours is NOT a breach (strictly greater required).
    input_set: "the ticket"
    constants:
      SLA_LOW_HOURS: 72
      SLA_MEDIUM_HOURS: 48
      SLA_HIGH_HOURS: 24
    precision: "integer hours"

  - name: uninstall_deadline_enforcement
    trigger: "on POST /installations/{id}/confirm-data-deletion and on logical-clock advance"
    algorithm: chronological
    formula: |
      data_deletion_deadline = uninstalled_at + 30 days (exact second precision)
      confirm at now <= deadline: on time; confirm at now > deadline: rejected with ERR_DELETION_OVERDUE
      when now passes deadline with data_deletion_confirmed_at null:
        installation transitions UNINSTALLING -> UNINSTALLED (system),
        GovernanceStrike(DATA_DELETION_OVERDUE) opens
    input_set: "the installation"
    constants:
      DELETION_WINDOW_DAYS: 30
    precision: "second-precision datetimes"

  - name: invoice_total
    trigger: "on MonthlyInvoice OPEN -> ISSUED and on any charge INVOICED -> REVERSED within an ISSUED invoice"
    algorithm: aggregation
    formula: |
      total_cents = sum(final_amount_cents) over AppBillingCharge rows where
        billing_cycle == invoice.cycle
        and installation.merchant_id == invoice.merchant_id
        and status == INVOICED
      Recomputed eagerly; never incremental-cached across reversal.
    input_set: "charges of the merchant+cycle with status INVOICED"
    constants: {}
    precision: "integer cents"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role permitted for the endpoint per §1.5 roles list; ownership checks where declared (merchant acts on own installation/charge/ticket, developer on own app)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every id in path and body references an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "target resource in a state from which the requested transition is defined per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version matches the parent entity's current version on endpoints declared in §1.2.1"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /apps/{id}; POST /invoices/{id}/issue"
  - priority: 6
    category: business_safety
    check: "segregation of duties: Reviewer.reviewer_id MUST NOT equal the owning DeveloperAccount.id of the app under review; HIGH-risk scope revocation requires pending charges voided"
    error_id: ERR_REVIEWER_CONFLICT
    http_status: 422
    applies_to: "POST /app-versions/{id}/approve; POST /app-versions/{id}/request-changes; POST /app-versions/{id}/reject; POST /installations/{id}/consent-records/{record_id}/revoke"
  - priority: 7
    category: business_constraint
    check: "structural input constraints: required fields present, enum members valid, justification length >= 20 for HIGH scopes, semver unique per app, ends_at > starts_at"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/update endpoints"
  - priority: 8
    category: business_constraint
    check: "review-window half-open overlap: a new ReviewWindow [s,e) for the same AppVersion conflicts with an existing SCHEDULED window [s2,e2) iff s < e2 and s2 < e; adjacency (s == e2 or e == s2) is NOT a conflict"
    error_id: ERR_REVIEW_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /app-versions/{id}/review-windows"
  - priority: 9
    category: business_referential
    check: "consent precondition: installation activation requires every scope of the app's PUBLISHED version to have a ScopeRequest with status APPROVED"
    error_id: ERR_SCOPE_NOT_APPROVED
    http_status: 422
    applies_to: "POST /installations/{id}/consent"
  - priority: 10
    category: business_constraint
    check: "discount_code is only honored on ONE_TIME charges; a discount_code on RECURRING or USAGE charges is rejected"
    error_id: ERR_DISCOUNT_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /installations/{id}/billing-charges"
  - priority: 11
    category: business_temporal
    check: "data deletion confirmation must occur at now <= data_deletion_deadline"
    error_id: ERR_DELETION_OVERDUE
    http_status: 422
    applies_to: "POST /installations/{id}/confirm-data-deletion"
  - priority: 12
    category: business_fiscal
    check: "charge amounts must be > 0; USAGE proration cap must not make the effective amount negative; invoice issue requires at least one APPROVED charge for the cycle"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: "POST /installations/{id}/billing-charges; POST /invoices/{id}/issue"
  - priority: 13
    category: business_fiscal
    check: "revenue-share boundary: developer.lifetime_gross_cents tier assignment uses inclusive-down thresholds (100000000 -> T0, 100000001 -> T1)"
    error_id: ERR_TIER_BOUNDARY
    http_status: 422
    applies_to: "internal consistency guard on tier recomputation"
  - priority: 14
    category: business_referential
    check: "uniqueness: developer contact_email unique; app name unique per developer; invoice cycle unique per merchant; webhook topic unique per installation"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /developers; POST /apps; POST /merchants/{id}/invoices; POST /installations/{id}/webhook-subscriptions"
  - priority: 15
    category: state
    check: "delisting gate: POST /apps/{id}/delist requires >= 5 ACTIVE unexpired GovernanceStrikes; reinstate requires zero ACTIVE strikes with reason IN {DATA_DELETION_OVERDUE, WEBHOOK_NONCOMPLIANCE}"
    error_id: ERR_STRIKE_THRESHOLD
    http_status: 422
    applies_to: "POST /apps/{id}/delist; POST /apps/{id}/reinstate"

endpoints:
  - method: POST
    path: "/developers"
    description: "Register a developer account"
    roles: [PlatformAdmin]
    code: 201
    input: [company_name, contact_email, payout_currency]
    output: DeveloperAccount
    side_effects: []
  - method: GET
    path: "/developers/{id}"
    description: "Fetch a developer account including computed lifetime_gross_cents"
    roles: [PlatformAdmin, Developer]
    code: 200
    input: []
    output: DeveloperAccount
    side_effects: []
  - method: GET
    path: "/developers/{id}/ledger-entries"
    description: "List revenue-share ledger entries of a developer"
    roles: [PlatformAdmin, Developer]
    code: 200
    input: ["limit?", "offset?"]
    output: RevenueShareLedgerEntry[]
    side_effects: []
  - method: POST
    path: "/apps"
    description: "Create an app in DRAFT under a developer"
    roles: [Developer]
    code: 201
    input: [developer_id, name, category]
    output: App
    side_effects: []
  - method: GET
    path: "/apps"
    description: "Search/list apps; supports search ranking calculation for LISTED apps"
    roles: [PlatformAdmin, Developer, Reviewer, Merchant]
    code: 200
    input: ["developer_id?", "search?", "category?", "listing_status?", "limit?", "offset?"]
    output: App[]
    side_effects: ["calculation search_ranking_score orders results when search is present"]
  - method: GET
    path: "/apps/{id}"
    description: "Fetch an app"
    roles: [PlatformAdmin, Developer, Reviewer, Merchant]
    code: 200
    input: []
    output: App
    side_effects: []
  - method: PATCH
    path: "/apps/{id}"
    description: "Update mutable app fields (name, category); OCC-guarded"
    roles: [Developer]
    code: 200
    input: ["name?", "category?", expected_app_version]
    output: App
    side_effects: ["increments App.version by 1"]
  - method: POST
    path: "/apps/{id}/submit"
    description: "Submit the app (and its current version) for review; also used for resubmission after CHANGES_REQUESTED"
    roles: [Developer]
    code: 200
    input: []
    output: App
    side_effects: ["App DRAFT|CHANGES_REQUESTED -> IN_REVIEW; AppVersion SUBMITTED|CHANGES_REQUESTED -> IN_REVIEW; review_round increments on resubmission"]
  - method: POST
    path: "/apps/{id}/publish"
    description: "Publish an approved app to the marketplace"
    roles: [Developer]
    code: 200
    input: []
    output: App
    side_effects: ["App APPROVED -> LISTED; version APPROVED -> PUBLISHED; prior PUBLISHED versions -> SUPERSEDED"]
  - method: POST
    path: "/apps/{id}/suspend"
    description: "Suspend a listed app"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: App
    side_effects: ["App LISTED -> SUSPENDED; ACTIVE installations -> SUSPENDED"]
  - method: POST
    path: "/apps/{id}/reinstate"
    description: "Reinstate a suspended app when compliance strikes allow"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: App
    side_effects: ["App SUSPENDED -> LISTED; SUSPENDED installations -> ACTIVE"]
  - method: POST
    path: "/apps/{id}/delist"
    description: "Permanently delist a suspended app at the strike threshold"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: App
    side_effects: ["App SUSPENDED -> DELISTED; installations -> UNINSTALLING with deletion deadlines"]
  - method: GET
    path: "/apps/{id}/strikes"
    description: "List governance strikes of an app"
    roles: [PlatformAdmin, Developer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: GovernanceStrike[]
    side_effects: []
  - method: GET
    path: "/apps/{id}/versions"
    description: "List versions of an app"
    roles: [PlatformAdmin, Developer, Reviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: AppVersion[]
    side_effects: []
  - method: GET
    path: "/apps/{id}/installations"
    description: "List installations of an app"
    roles: [PlatformAdmin, Developer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Installation[]
    side_effects: []
  - method: GET
    path: "/apps/{id}/support-tickets"
    description: "List support tickets of an app"
    roles: [PlatformAdmin, Developer, Merchant]
    code: 200
    input: ["status?", "merchant_id?", "limit?", "offset?"]
    output: SupportTicket[]
    side_effects: []
  - method: POST
    path: "/apps/{id}/versions"
    description: "Create a new version for an app in DRAFT or CHANGES_REQUESTED"
    roles: [Developer]
    code: 201
    input: [semver]
    output: AppVersion
    side_effects: []
  - method: GET
    path: "/app-versions/{id}"
    description: "Fetch a version"
    roles: [PlatformAdmin, Developer, Reviewer]
    code: 200
    input: []
    output: AppVersion
    side_effects: []
  - method: GET
    path: "/app-versions"
    description: "Filtered list of app versions"
    roles: [PlatformAdmin, Developer, Reviewer]
    code: 200
    input: ["app_id?", "status?", "limit?", "offset?"]
    output: AppVersion[]
    side_effects: []
  - method: POST
    path: "/app-versions/{id}/scope-requests"
    description: "Request a permission scope for this version"
    roles: [Developer]
    code: 201
    input: [scope_code, "justification?"]
    output: ScopeRequest
    side_effects: []
  - method: GET
    path: "/app-versions/{id}/scope-requests"
    description: "List scope requests of a version"
    roles: [PlatformAdmin, Developer, Reviewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ScopeRequest[]
    side_effects: []
  - method: POST
    path: "/app-versions/{id}/review-windows"
    description: "Schedule a review window for the version (half-open interval, overlap-checked)"
    roles: [Reviewer]
    code: 201
    input: [reviewer_id, starts_at, ends_at]
    output: ReviewWindow
    side_effects: []
  - method: GET
    path: "/app-versions/{id}/review-windows"
    description: "List review windows of a version"
    roles: [PlatformAdmin, Developer, Reviewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ReviewWindow[]
    side_effects: []
  - method: POST
    path: "/app-versions/{id}/approve"
    description: "Approve a version under review; all scope requests must be resolved"
    roles: [Reviewer]
    code: 200
    input: [reviewer_id]
    output: AppVersion
    side_effects: ["AppVersion IN_REVIEW -> APPROVED; App IN_REVIEW -> APPROVED"]
  - method: POST
    path: "/app-versions/{id}/request-changes"
    description: "Request changes on a version under review"
    roles: [Reviewer]
    code: 200
    input: [reviewer_id, "note?"]
    output: AppVersion
    side_effects: ["AppVersion IN_REVIEW -> CHANGES_REQUESTED; App IN_REVIEW -> CHANGES_REQUESTED"]
  - method: POST
    path: "/app-versions/{id}/reject"
    description: "Reject a version under review; pending scope requests are denied"
    roles: [Reviewer]
    code: 200
    input: [reviewer_id, reason]
    output: AppVersion
    side_effects: ["AppVersion IN_REVIEW -> REJECTED; App IN_REVIEW -> DRAFT; ScopeRequests PENDING -> DENIED"]
  - method: POST
    path: "/scope-requests/{id}/decide"
    description: "Approve or deny a single scope request"
    roles: [Reviewer]
    code: 200
    input: [decision, "denied_reason?"]
    output: ScopeRequest
    side_effects: ["ScopeRequest PENDING -> APPROVED|DENIED"]
  - method: GET
    path: "/scope-requests/{id}"
    description: "Fetch a scope request"
    roles: [PlatformAdmin, Developer, Reviewer]
    code: 200
    input: []
    output: ScopeRequest
    side_effects: []
  - method: GET
    path: "/review-windows/{id}"
    description: "Fetch a review window"
    roles: [PlatformAdmin, Developer, Reviewer]
    code: 200
    input: []
    output: ReviewWindow
    side_effects: []
  - method: GET
    path: "/ledger-entries"
    description: "Filtered list of revenue-share ledger entries"
    roles: [PlatformAdmin, Developer]
    code: 200
    input: ["developer_id?", "charge_id?", "entry_variant?", "cycle?", "limit?", "offset?"]
    output: RevenueShareLedgerEntry[]
    side_effects: []
  - method: GET
    path: "/permission-scopes"
    description: "List the platform permission scope catalog"
    roles: [PlatformAdmin, Developer, Reviewer, Merchant]
    code: 200
    input: ["risk_level?", "limit?", "offset?"]
    output: PermissionScope[]
    side_effects: []
  - method: POST
    path: "/permission-scopes"
    description: "Register a permission scope in the catalog"
    roles: [PlatformAdmin]
    code: 201
    input: [code, risk_level]
    output: PermissionScope
    side_effects: []
  - method: POST
    path: "/merchants"
    description: "Register a merchant account"
    roles: [PlatformAdmin]
    code: 201
    input: [shop_domain, plan_tier]
    output: MerchantAccount
    side_effects: []
  - method: GET
    path: "/merchants/{id}"
    description: "Fetch a merchant"
    roles: [PlatformAdmin, Merchant]
    code: 200
    input: []
    output: MerchantAccount
    side_effects: []
  - method: GET
    path: "/merchants/{id}/invoices"
    description: "List a merchant's monthly invoices"
    roles: [PlatformAdmin, Merchant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MonthlyInvoice[]
    side_effects: []
  - method: POST
    path: "/merchants/{id}/invoices"
    description: "Open a monthly invoice for a cycle"
    roles: [PlatformAdmin]
    code: 201
    input: [cycle]
    output: MonthlyInvoice
    side_effects: []
  - method: GET
    path: "/merchants/{id}/installations"
    description: "List installations of a merchant"
    roles: [PlatformAdmin, Merchant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Installation[]
    side_effects: []
  - method: POST
    path: "/installations"
    description: "Begin installing a LISTED app for a merchant (PENDING_CONSENT)"
    roles: [Merchant]
    code: 201
    input: [app_id, merchant_id]
    output: Installation
    side_effects: []
  - method: GET
    path: "/installations/{id}"
    description: "Fetch an installation"
    roles: [PlatformAdmin, Developer, Merchant]
    code: 200
    input: []
    output: Installation
    side_effects: []
  - method: POST
    path: "/installations/{id}/consent"
    description: "Merchant grants consent to the approved scopes; activates or re-activates the installation"
    roles: [Merchant]
    code: 200
    input: []
    output: Installation
    side_effects: ["Installation PENDING_CONSENT|RECONSENT_REQUIRED -> ACTIVE; ConsentRecords created"]
  - method: GET
    path: "/installations/{id}/consent-records"
    description: "List consent records of an installation"
    roles: [PlatformAdmin, Developer, Merchant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ConsentRecord[]
    side_effects: []
  - method: GET
    path: "/consent-records/{id}"
    description: "Fetch a consent record"
    roles: [PlatformAdmin, Developer, Merchant]
    code: 200
    input: []
    output: ConsentRecord
    side_effects: []
  - method: GET
    path: "/webhook-subscriptions/{id}"
    description: "Fetch a webhook subscription"
    roles: [PlatformAdmin, Developer, Merchant]
    code: 200
    input: []
    output: WebhookSubscription
    side_effects: []
  - method: POST
    path: "/installations/{id}/consent-records/{record_id}/revoke"
    description: "Merchant revokes a granted scope; installation flips to RECONSENT_REQUIRED"
    roles: [Merchant]
    code: 200
    input: []
    output: ConsentRecord
    side_effects: ["ConsentRecord GRANTED -> REVOKED; Installation ACTIVE -> RECONSENT_REQUIRED"]
  - method: POST
    path: "/installations/{id}/request-reconsent"
    description: "Post-install access review flags a scope delta"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Installation
    side_effects: ["Installation ACTIVE -> RECONSENT_REQUIRED"]
  - method: POST
    path: "/installations/{id}/uninstall"
    description: "Merchant uninstalls the app; starts the 30-day data deletion clock"
    roles: [Merchant]
    code: 200
    input: []
    output: Installation
    side_effects: ["Installation -> UNINSTALLING; PENDING charges -> REVERSED; app/uninstalled webhook delivery"]
  - method: POST
    path: "/installations/{id}/confirm-data-deletion"
    description: "Developer confirms mandatory data deletion before the deadline"
    roles: [Developer]
    code: 200
    input: []
    output: Installation
    side_effects: ["Installation UNINSTALLING -> UNINSTALLED; webhook subscriptions DISABLED"]
  - method: POST
    path: "/installations/{id}/webhook-subscriptions"
    description: "Register a webhook subscription for the installation"
    roles: [Developer]
    code: 201
    input: [topic, endpoint_url]
    output: WebhookSubscription
    side_effects: []
  - method: GET
    path: "/installations/{id}/webhook-subscriptions"
    description: "List webhook subscriptions of an installation"
    roles: [PlatformAdmin, Developer, Merchant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: WebhookSubscription[]
    side_effects: []
  - method: POST
    path: "/installations/{id}/billing-charges"
    description: "Create a recurring, usage-based or one-time charge on the installation"
    roles: [Developer]
    code: 201
    input: [charge_type, base_amount_cents, description, "discount_code?"]
    output: AppBillingCharge
    side_effects: ["calculation usage_charge_proration for USAGE; calculation charge_net_computation computes discount and provisional share"]
  - method: GET
    path: "/installations/{id}/billing-charges"
    description: "List charges of an installation"
    roles: [PlatformAdmin, Developer, Merchant]
    code: 200
    input: ["status?", "charge_type?", "billing_cycle?", "limit?", "offset?"]
    output: AppBillingCharge[]
    side_effects: []
  - method: GET
    path: "/billing-charges/{id}"
    description: "Fetch a charge"
    roles: [PlatformAdmin, Developer, Merchant]
    code: 200
    input: []
    output: AppBillingCharge
    side_effects: []
  - method: POST
    path: "/billing-charges/{id}/approve"
    description: "Merchant approves a pending charge"
    roles: [Merchant]
    code: 200
    input: []
    output: AppBillingCharge
    side_effects: ["charge PENDING -> APPROVED"]
  - method: POST
    path: "/billing-charges/{id}/decline"
    description: "Merchant declines a pending charge"
    roles: [Merchant]
    code: 200
    input: []
    output: AppBillingCharge
    side_effects: ["charge PENDING -> DECLINED"]
  - method: POST
    path: "/billing-charges/{id}/reverse"
    description: "Platform reverses a PENDING or INVOICED charge; INVOICED reversal writes a REVERSAL ledger entry and recomputes the invoice total"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: AppBillingCharge
    side_effects: ["charge -> REVERSED; ledger REVERSAL entry; developer_accrual FINAL rerun; invoice_total recompute"]
  - method: GET
    path: "/invoices/{id}"
    description: "Fetch an invoice"
    roles: [PlatformAdmin, Merchant]
    code: 200
    input: []
    output: MonthlyInvoice
    side_effects: []
  - method: POST
    path: "/invoices/{id}/issue"
    description: "Issue an open invoice; flips APPROVED charges of the cycle to INVOICED; OCC-guarded"
    roles: [PlatformAdmin]
    code: 200
    input: [expected_invoice_version]
    output: MonthlyInvoice
    side_effects: ["invoice OPEN -> ISSUED; charges APPROVED -> INVOICED; PROVISIONAL ledger entries; invoice_total computed; increments MonthlyInvoice.version by 1"]
  - method: POST
    path: "/invoices/{id}/mark-paid"
    description: "Mark an issued invoice paid; settles charges and finalizes revenue share accrual"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: MonthlyInvoice
    side_effects: ["invoice ISSUED -> PAID; charges INVOICED -> SETTLED; developer_accrual FINAL supersedes PROVISIONAL"]
  - method: POST
    path: "/invoices/{id}/void"
    description: "Void an open invoice with no invoiced charges"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: MonthlyInvoice
    side_effects: ["invoice OPEN -> VOID"]
  - method: GET
    path: "/billing-charges/{id}/ledger-entries"
    description: "List revenue-share ledger entries originating from a charge"
    roles: [PlatformAdmin, Developer]
    code: 200
    input: ["limit?", "offset?"]
    output: RevenueShareLedgerEntry[]
    side_effects: []
  - method: GET
    path: "/merchants/{id}/support-tickets"
    description: "List support tickets opened by a merchant"
    roles: [PlatformAdmin, Merchant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SupportTicket[]
    side_effects: []
  - method: POST
    path: "/installations/{id}/performance-samples"
    description: "Submit a storefront performance sample; may flip app performance_state and open strikes"
    roles: [Developer, PlatformAdmin]
    code: 201
    input: [storefront_load_ms, sampled_at]
    output: PerformanceSample
    side_effects: ["calculation storefront_performance_score; possible DEGRADED transition and PERFORMANCE_BREACH strike; possible DELISTED_PERFORMANCE delisting"]
  - method: GET
    path: "/installations/{id}/performance-samples"
    description: "List performance samples of an installation"
    roles: [PlatformAdmin, Developer]
    code: 200
    input: ["limit?", "offset?"]
    output: PerformanceSample[]
    side_effects: []
  - method: GET
    path: "/performance-samples/{id}"
    description: "Fetch a performance sample"
    roles: [PlatformAdmin, Developer]
    code: 200
    input: []
    output: PerformanceSample
    side_effects: []
  - method: GET
    path: "/strikes/{id}"
    description: "Fetch a governance strike"
    roles: [PlatformAdmin, Developer]
    code: 200
    input: []
    output: GovernanceStrike
    side_effects: []
  - method: POST
    path: "/apps/{id}/support-tickets"
    description: "Merchant opens a support ticket against an app"
    roles: [Merchant]
    code: 201
    input: [merchant_id, severity]
    output: SupportTicket
    side_effects: ["calculation support_sla assigns sla_hours"]
  - method: GET
    path: "/support-tickets/{id}"
    description: "Fetch a support ticket"
    roles: [PlatformAdmin, Developer, Merchant]
    code: 200
    input: []
    output: SupportTicket
    side_effects: []
  - method: POST
    path: "/support-tickets/{id}/respond"
    description: "Developer posts the first response"
    roles: [Developer]
    code: 200
    input: []
    output: SupportTicket
    side_effects: ["ticket OPEN -> ANSWERED; first_response_at set"]
  - method: POST
    path: "/support-tickets/{id}/escalate"
    description: "Merchant escalates an open ticket"
    roles: [Merchant]
    code: 200
    input: []
    output: SupportTicket
    side_effects: ["ticket OPEN -> ESCALATED; sla_breached evaluated"]
  - method: POST
    path: "/support-tickets/{id}/resolve"
    description: "Developer resolves an answered/escalated/disputed ticket"
    roles: [Developer]
    code: 200
    input: []
    output: SupportTicket
    side_effects: ["ticket -> RESOLVED; sla_breached evaluated; SUPPORT_BREACH strike when breached from ESCALATED"]
  - method: POST
    path: "/support-tickets/{id}/dispute"
    description: "Merchant disputes a resolution within 14 days"
    roles: [Merchant]
    code: 200
    input: []
    output: SupportTicket
    side_effects: ["ticket RESOLVED -> DISPUTED"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced; time-based cascades (strike expiry, deletion deadline enforcement, FINAL accrual) re-evaluate"]

errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing or invalid auth headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "role not permitted for the endpoint, or ownership check failed" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "malformed input: missing required field, bad enum, bad semver uniqueness, ends_at <= starts_at, justification too short for HIGH scope" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "transition not defined from the resource's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version" }
  - { id: ERR_DUPLICATE, http: 409, condition: "uniqueness violation (contact_email, app name per developer, invoice cycle per merchant, webhook topic per installation)" }
  - { id: ERR_REVIEWER_CONFLICT, http: 422, condition: "segregation of duties violated: reviewer id equals owning developer id, or HIGH-risk scope revocation attempted with pending charges" }
  - { id: ERR_REVIEW_WINDOW_OVERLAP, http: 409, condition: "new review window half-open interval overlaps an existing SCHEDULED window for the same version" }
  - { id: ERR_SCOPE_NOT_APPROVED, http: 422, condition: "installation consent attempted while a scope of the PUBLISHED version lacks an APPROVED scope request" }
  - { id: ERR_SCOPE_JUSTIFICATION_REQUIRED, http: 422, condition: "HIGH-risk scope request missing justification >= 20 chars" }
  - { id: ERR_DISCOUNT_NOT_APPLICABLE, http: 422, condition: "discount_code supplied on a RECURRING or USAGE charge" }
  - { id: ERR_INVALID_AMOUNT, http: 422, condition: "charge amount <= 0 or prorated amount invalid; or invoice issue attempted with no APPROVED charges" }
  - { id: ERR_DELETION_OVERDUE, http: 422, condition: "data deletion confirmation attempted after data_deletion_deadline" }
  - { id: ERR_UNINSTALL_IN_PROGRESS, http: 409, condition: "operation requires an installed installation but status is UNINSTALLING or UNINSTALLED" }
  - { id: ERR_CHARGE_NOT_PENDING, http: 409, condition: "approve/decline attempted on a charge not in PENDING" }
  - { id: ERR_INVOICE_NOT_ISSUABLE, http: 409, condition: "invoice issue attempted from a non-OPEN invoice" }
  - { id: ERR_INVOICE_NOT_VOIDABLE, http: 409, condition: "void attempted on an invoice that is not OPEN or already has INVOICED charges" }
  - { id: ERR_STRIKE_THRESHOLD, http: 422, condition: "delist attempted with fewer than 5 active unexpired strikes, or reinstate attempted with active compliance strikes" }
  - { id: ERR_TIER_BOUNDARY, http: 422, condition: "internal guard: tier recomputation attempted against inconsistent lifetime_gross_cents" }
  - { id: ERR_VERSION_NOT_REVIEWABLE, http: 409, condition: "reviewer action attempted on a version not IN_REVIEW" }
  - { id: ERR_APP_NOT_LISTED, http: 409, condition: "installation attempted against an app whose listing_status is not LISTED" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "mutation attempted on a terminal resource (REJECTED/SUPERSEDED version, UNINSTALLED installation, PAID/VOID invoice)" }

roles:
  - name: PlatformAdmin
    description: "Marketplace operator; manages developers, merchants, invoices, governance"
    identity: opaque
    exclusive_operations: ["create developers and merchants", "open/issue/void/mark-paid invoices", "suspend/reinstate/delist apps", "reverse charges", "request reconsent", "register permission scopes", "set the logical clock"]
    shared_operations: ["read any resource", "list endpoints"]
  - name: Developer
    description: "App developer acting as its DeveloperAccount"
    identity: "entity_backed:DeveloperAccount"
    exclusive_operations: ["create and update own apps and versions", "submit/publish apps", "request scopes", "create billing charges", "confirm data deletion", "respond to and resolve support tickets", "register webhook subscriptions"]
    shared_operations: ["read own apps, installations, charges, tickets", "list marketplace apps"]
  - name: Reviewer
    description: "Marketplace app reviewer; segregated from the owning developer"
    identity: opaque
    exclusive_operations: ["approve/request-changes/reject versions", "decide scope requests", "schedule review windows"]
    shared_operations: ["read apps, versions, scope requests"]
  - name: Merchant
    description: "Shop owner acting as its MerchantAccount"
    identity: "entity_backed:MerchantAccount"
    exclusive_operations: ["install apps", "grant/revoke consent", "uninstall", "approve/decline charges", "open/escalate/dispute support tickets"]
    shared_operations: ["read own installations, invoices, charges, tickets", "list marketplace apps"]
