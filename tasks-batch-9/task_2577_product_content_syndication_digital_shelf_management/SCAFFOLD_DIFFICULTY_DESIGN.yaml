# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN — task 2577 Product Content Syndication & Digital
# Shelf Management. Test-targeting index for §1.8: nine Difficulty Rules, two
# instances each (18 instances). Every instance grounds in SCAFFOLD.yaml §1.1–§1.7
# and adds no new behavior.
#
# Every numeric literal in an `assert:` line below was produced by executing the
# grounded `calculations[].formula` with its `constants:` in Python (decimal,
# ROUND_HALF_UP) against the pinned setup — not estimated.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: completeness_declared_vs_certified_diverge_on_same_listing
        grounds:
          - calculations.listing_completeness_score
          - entities.RetailerListing.fields.completeness_score_declared
          - entities.RetailerListing.fields.completeness_score_certified
          - entities.RetailerRequirement.fields.max_chars_override
          - entities.ContentVersion.fields.image_count
          - entities.MediaAsset.fields.approval_state
        distinguishing_aspect: |
          One listing, one requirement set, two variants of the SAME formula disagree by 25.92 points
          (declared 92.59 vs certified 66.67) because DECLARED reads the highest-revision_no revision
          with presence-only credit and the claimed ContentVersion.image_count, while CERTIFIED reads
          only the pinned revision, applies RetailerRequirement.max_chars_override, and counts APPROVED
          MediaAsset rows instead of the claimed image_count.
        test_recipe:
          setup:
            - "Retailer MEGA is ACTIVE with min_image_count 3 and five requirement rows: title REQUIRED (80-char override, weight 30), description REQUIRED (100-char override, weight 20), bullet_1 RECOMMENDED (weight 10), brand REQUIRED (weight 10), color OPTIONAL (excluded from numerator and denominator) — denominator D = 70 + IMAGE_WEIGHT 20 = 90"
            - "product SKU-A-1 has revision 1 PINNED on the MEGA listing (title 28 chars, description 120 chars, brand 10 chars, no bullet_1, image_count 3) and revision 2 still DRAFT (title, description, bullet_1, brand, color all present, image_count 2)"
            - "three MediaAsset rows of the product are APPROVED by MEGA (two SECONDARY_IMAGE, one HERO_IMAGE)"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "title", data_type: "STRING", taxonomy_group: "CORE", max_chars: 200, base_weight: 40.00, is_global_required: true }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "description", data_type: "STRING", taxonomy_group: "MARKETING", max_chars: 500, base_weight: 30.00, is_global_required: false }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "bullet_1", data_type: "STRING", taxonomy_group: "MARKETING", max_chars: 400, base_weight: 10.00, is_global_required: false }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "brand", data_type: "STRING", taxonomy_group: "CORE", max_chars: 60, base_weight: 10.00, is_global_required: true }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "color", data_type: "STRING", taxonomy_group: "VARIANT", max_chars: 40, base_weight: 5.00, is_global_required: false }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers"
              payload: { name: "MegaMart", retailer_code: "MEGA", status: "ACTIVE", min_image_count: 3, feed_slot_capacity: 10, max_concurrent_feed_windows: 2, enhanced_content_requires_approval: true }
              as: ShelfAdmin
              captures: { ra_id: $.data.id }
            - call: "POST /digital-shelf/retailers/${ra_id}/requirements"
              payload: { attribute_key: "title", requirement_level: "REQUIRED", max_chars_override: 80, weight_override: 30.00 }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers/${ra_id}/requirements"
              payload: { attribute_key: "description", requirement_level: "REQUIRED", max_chars_override: 100, weight_override: 20.00 }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers/${ra_id}/requirements"
              payload: { attribute_key: "bullet_1", requirement_level: "RECOMMENDED" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers/${ra_id}/requirements"
              payload: { attribute_key: "brand", requirement_level: "REQUIRED" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers/${ra_id}/requirements"
              payload: { attribute_key: "color", requirement_level: "OPTIONAL" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/products"
              payload: { sku: "SKU-A-1", gtin: "00012345678905", category_code: "SMALL_APPLIANCE", brand_code: "BRHM" }
              as: ContentAuthor
              captures: { pa_id: $.data.id }
            - call: "POST /digital-shelf/retailer-listings"
              payload: { product_id: "${pa_id}", retailer_id: "${ra_id}", account_team_user_id: "acct_mega_1" }
              as: ContentAuthor
              captures: { la_id: $.data.id }
            - call: "POST /digital-shelf/media-assets"
              payload: { product_id: "${pa_id}", asset_role: "HERO_IMAGE", source_uri: "s3://brand/a/hero.jpg" }
              as: ContentAuthor
              captures: { ma1_id: $.data.id }
            - call: "POST /digital-shelf/media-assets"
              payload: { product_id: "${pa_id}", asset_role: "SECONDARY_IMAGE", source_uri: "s3://brand/a/sec1.jpg" }
              as: ContentAuthor
              captures: { ma2_id: $.data.id }
            - call: "POST /digital-shelf/media-assets"
              payload: { product_id: "${pa_id}", asset_role: "SECONDARY_IMAGE", source_uri: "s3://brand/a/sec2.jpg" }
              as: ContentAuthor
              captures: { ma3_id: $.data.id }
            - call: "POST /digital-shelf/media-assets/${ma1_id}/retailer-decision"
              payload: { decision: "APPROVE" }
              as: RetailerIntegration
              as_user_id: "${ra_id}"
            - call: "POST /digital-shelf/media-assets/${ma2_id}/retailer-decision"
              payload: { decision: "APPROVE" }
              as: RetailerIntegration
              as_user_id: "${ra_id}"
            - call: "POST /digital-shelf/media-assets/${ma3_id}/retailer-decision"
              payload: { decision: "APPROVE" }
              as: RetailerIntegration
              as_user_id: "${ra_id}"
            - call: "POST /digital-shelf/content-versions"
              payload: { product_id: "${pa_id}", image_count: 3 }
              as: ContentAuthor
              captures: { va1_id: $.data.id }
            - call: "POST /digital-shelf/content-versions/${va1_id}/attribute-values"
              payload: { attribute_key: "title", value: "Compact 900W Kitchen Blender" }
              as: ContentAuthor
            - call: "POST /digital-shelf/content-versions/${va1_id}/attribute-values"
              payload: { attribute_key: "description", value: "A compact 900 watt kitchen blender with six speeds, a pulse mode, a 1.5 litre glass jar and a two year limited warranty." }
              as: ContentAuthor
            - call: "POST /digital-shelf/content-versions/${va1_id}/attribute-values"
              payload: { attribute_key: "brand", value: "BrightHome" }
              as: ContentAuthor
            - call: "POST /digital-shelf/change-requests"
              payload: { product_id: "${pa_id}", retailer_id: "${ra_id}", target_content_version_id: "${va1_id}", rationale: "launch revision 1 on MegaMart" }
              as: ContentAuthor
              as_user_id: "author_1"
              captures: { cra1_id: $.data.id }
            - call: "POST /digital-shelf/change-requests/${cra1_id}/submit"
              payload: {}
              as: ContentAuthor
              as_user_id: "author_1"
            - call: "GET /digital-shelf/products/${pa_id}"
              payload: {}
              as: ShelfAdmin
              captures: { pa_v1: $.data.version }
            - call: "POST /digital-shelf/change-requests/${cra1_id}/reviews"
              payload: { track: "LEGAL", decision: "APPROVED", expected_product_version: "${pa_v1}" }
              as: LegalReviewer
              as_user_id: "legal_1"
            - call: "GET /digital-shelf/products/${pa_id}"
              payload: {}
              as: ShelfAdmin
              captures: { pa_v2: $.data.version }
            - call: "POST /digital-shelf/change-requests/${cra1_id}/reviews"
              payload: { track: "BRAND", decision: "APPROVED", expected_product_version: "${pa_v2}" }
              as: BrandGovernanceApprover
              as_user_id: "brand_1"
            - call: "POST /digital-shelf/content-versions"
              payload: { product_id: "${pa_id}", supersedes_content_version_id: "${va1_id}", image_count: 2 }
              as: ContentAuthor
              captures: { va2_id: $.data.id }
            - call: "POST /digital-shelf/content-versions/${va2_id}/attribute-values"
              payload: { attribute_key: "title", value: "Compact 900W Kitchen Blender 2026 Edition" }
              as: ContentAuthor
            - call: "POST /digital-shelf/content-versions/${va2_id}/attribute-values"
              payload: { attribute_key: "description", value: "A compact 900 watt kitchen blender with six speeds, a pulse mode, a 1.5 litre glass jar and a two year limited warranty." }
              as: ContentAuthor
            - call: "POST /digital-shelf/content-versions/${va2_id}/attribute-values"
              payload: { attribute_key: "bullet_1", value: "Six speeds plus pulse mode" }
              as: ContentAuthor
            - call: "POST /digital-shelf/content-versions/${va2_id}/attribute-values"
              payload: { attribute_key: "brand", value: "BrightHome" }
              as: ContentAuthor
            - call: "POST /digital-shelf/content-versions/${va2_id}/attribute-values"
              payload: { attribute_key: "color", value: "Black" }
              as: ContentAuthor
          trigger:
            - call: "GET /digital-shelf/retailer-listings/${la_id}/completeness"
              payload: {}
              as: ContentAuthor
              captures: { decl: $.data.declared_score, cert: $.data.certified_score }
          assert:
            - "declared_score == 92.59"
            - "certified_score == 66.67"
            - "declared_score - certified_score == 25.92"
            - "declared_source_content_version_id == ${va2_id}"
            - "certified_source_content_version_id == ${va1_id}"
            - "over_limit_keys == [\"description\"]"
            - "missing_required_keys == []"
            - "RetailerListing.${la_id}.completeness_score_declared == 92.59"
            - "RetailerListing.${la_id}.completeness_score_certified == 66.67"

      - name: conversion_lift_post_pin_window_vs_quality_split_regroup
        grounds:
          - calculations.content_conversion_lift
          - entities.Product.fields.conversion_lift_pct
          - entities.Product.fields.last_pinned_at
          - entities.ShelfObservation.fields.content_accuracy_pct
          - entities.ShelfObservation.fields.conversion_rate_pct
        distinguishing_aspect: |
          The identical four observation rows are partitioned by two different keys — post_pin_window
          splits on observed_at against Product.last_pinned_at, quality_split splits on
          content_accuracy_pct against QUALITY_SPLIT_ACCURACY_THRESHOLD 90.00 — so O2 moves from BASE
          to HIGH and O4 from HIGH to BASE and the same rows yield 68.75 vs 38.89.
        test_recipe:
          setup:
            - "Retailer SHOP is ACTIVE with a single REQUIRED title requirement and min_image_count 1"
            - "product SKU-F-1 has revision 1 PINNED on the SHOP listing, so Product.last_pinned_at == 2026-08-05T00:00:00Z (the clock position at the approval join)"
            - "the logical clock is then moved to 2026-08-09T00:00:00Z and four observations are ingested in chronological order: 08-03 (accuracy 82.00, conversion 1.20), 08-04 (91.00, 2.00), 08-07 (92.00, 3.00), 08-08 (86.00, 2.40)"
            - "the listing is still NOT_SYNDICATED, so it never enters the shelf_health_index input set"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "title", data_type: "STRING", taxonomy_group: "CORE", max_chars: 200, base_weight: 40.00, is_global_required: true }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers"
              payload: { name: "ShopRight", retailer_code: "SHOP", status: "ACTIVE", min_image_count: 1, feed_slot_capacity: 10, max_concurrent_feed_windows: 2, enhanced_content_requires_approval: true }
              as: ShelfAdmin
              captures: { rf_id: $.data.id }
            - call: "POST /digital-shelf/retailers/${rf_id}/requirements"
              payload: { attribute_key: "title", requirement_level: "REQUIRED" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/products"
              payload: { sku: "SKU-F-1", gtin: "00012345678912", category_code: "SMALL_APPLIANCE", brand_code: "BRHM" }
              as: ContentAuthor
              captures: { pf_id: $.data.id }
            - call: "POST /digital-shelf/retailer-listings"
              payload: { product_id: "${pf_id}", retailer_id: "${rf_id}", account_team_user_id: "acct_shop_1" }
              as: ContentAuthor
              captures: { lf_id: $.data.id }
            - call: "POST /digital-shelf/content-versions"
              payload: { product_id: "${pf_id}", image_count: 1 }
              as: ContentAuthor
              captures: { vf_id: $.data.id }
            - call: "POST /digital-shelf/content-versions/${vf_id}/attribute-values"
              payload: { attribute_key: "title", value: "Compact 900W Kitchen Blender" }
              as: ContentAuthor
            - call: "POST /digital-shelf/change-requests"
              payload: { product_id: "${pf_id}", retailer_id: "${rf_id}", target_content_version_id: "${vf_id}", rationale: "launch revision 1 on ShopRight" }
              as: ContentAuthor
              as_user_id: "author_1"
              captures: { crf_id: $.data.id }
            - call: "POST /digital-shelf/change-requests/${crf_id}/submit"
              payload: {}
              as: ContentAuthor
              as_user_id: "author_1"
            - call: "GET /digital-shelf/products/${pf_id}"
              payload: {}
              as: ShelfAdmin
              captures: { pf_v1: $.data.version }
            - call: "POST /digital-shelf/change-requests/${crf_id}/reviews"
              payload: { track: "LEGAL", decision: "APPROVED", expected_product_version: "${pf_v1}" }
              as: LegalReviewer
              as_user_id: "legal_1"
            - call: "GET /digital-shelf/products/${pf_id}"
              payload: {}
              as: ShelfAdmin
              captures: { pf_v2: $.data.version }
            - call: "POST /digital-shelf/change-requests/${crf_id}/reviews"
              payload: { track: "BRAND", decision: "APPROVED", expected_product_version: "${pf_v2}" }
              as: BrandGovernanceApprover
              as_user_id: "brand_1"
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T00:00:00Z" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailer-listings/${lf_id}/observations"
              payload: { observed_at: "2026-08-03T00:00:00Z", in_stock: true, content_accuracy_pct: 82.00, rating_avg: 4.10, rating_count: 40, unauthorized_seller_count: 0, conversion_rate_pct: 1.20, units_sold: 30, search_rank: 9 }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailer-listings/${lf_id}/observations"
              payload: { observed_at: "2026-08-04T00:00:00Z", in_stock: true, content_accuracy_pct: 91.00, rating_avg: 4.20, rating_count: 45, unauthorized_seller_count: 0, conversion_rate_pct: 2.00, units_sold: 44, search_rank: 8 }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailer-listings/${lf_id}/observations"
              payload: { observed_at: "2026-08-07T00:00:00Z", in_stock: true, content_accuracy_pct: 92.00, rating_avg: 4.30, rating_count: 52, unauthorized_seller_count: 0, conversion_rate_pct: 3.00, units_sold: 61, search_rank: 4 }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailer-listings/${lf_id}/observations"
              payload: { observed_at: "2026-08-08T00:00:00Z", in_stock: true, content_accuracy_pct: 86.00, rating_avg: 4.35, rating_count: 55, unauthorized_seller_count: 0, conversion_rate_pct: 2.40, units_sold: 50, search_rank: 3 }
              as: ShelfAdmin
          trigger:
            - call: "GET /digital-shelf/products/${pf_id}/shelf-summary"
              payload: {}
              as: ShelfAdmin
              captures: { lift_default: $.data.conversion_lift_pct }
            - call: "GET /digital-shelf/products/${pf_id}/shelf-summary"
              payload: { lift_variant: "quality_split" }
              as: ShelfAdmin
              captures: { lift_quality: $.data.conversion_lift_pct }
          assert:
            - "first response conversion_lift_pct == 68.75 with lift_variant == \"post_pin_window\", high_group_size == 2, base_group_size == 2"
            - "second response conversion_lift_pct == 38.89 with lift_variant == \"quality_split\", high_group_size == 2, base_group_size == 2"
            - "Product.${pf_id}.conversion_lift_pct == 68.75 (only the post_pin_window variant is persisted)"
            - "both responses report shelf_health_index == 0.00 and qualifying_listing_count == 0 because the listing is NOT_SYNDICATED"
            - "Product.${pf_id}.open_alert_count == 1 and governance_flag == \"CONTENT_AT_RISK\" (the 82.00 observation raised one CONTENT_DRIFT alert; no HEALTH_DEGRADED alert exists)"

  - rule_id: combinatorial_formula
    instances:
      - name: service_fee_rush_tier_keyed_on_discounted_not_on_total
        grounds:
          - calculations.content_service_fee
          - entities.SyndicationJob.fields.service_fee_cents
          - entities.SyndicationJob.fields.slot_count
          - entities.SyndicationJob.fields.window_start
          - validations[priority=45]
        distinguishing_aspect: |
          Two independent tier selections compose in a pinned order: the volume tier is keyed on
          subtotal_cents (25000 -> 0.15) and the rush tier is keyed on discounted_cents (21250 >= 20000
          -> 0.12). Keying the rush tier on the final total instead would pick 0.20 and return 25500,
          so the assert 23800 falsifies the circular evaluation order.
        test_recipe:
          setup:
            - "Retailer BigBox is ACTIVE with min_image_count 4, feed_slot_capacity 10, max_concurrent_feed_windows 2 and three REQUIRED requirement rows (title weight 40, description weight 30, brand weight 10), so the completeness denominator D == 80 + IMAGE_WEIGHT 20 == 100"
            - "product SKU-B-1 has revision 1 PINNED on the BigBox listing with title and description present, brand ABSENT and image_count 4, and exactly three APPROVED image assets against min_image_count 4"
            - "therefore RetailerListing.completeness_score_certified == 85.00, completeness_score_declared == 90.00, readiness_score == 51.00, syndication_state == NOT_SYNDICATED, shelf_state == OK"
            - "Retailer.feed_slots_reserved == 0, Retailer.version == 1 and the logical clock stands at 2026-08-10T00:00:00Z"
            - "the syndication operator queues 10 feed slots for a window starting 12 hours after the clock, so rush is true and the volume subtotal lands in the top tier"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "title", data_type: "STRING", taxonomy_group: "CORE", max_chars: 200, base_weight: 40.00, is_global_required: true }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "description", data_type: "STRING", taxonomy_group: "MARKETING", max_chars: 500, base_weight: 30.00, is_global_required: false }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "brand", data_type: "STRING", taxonomy_group: "CORE", max_chars: 60, base_weight: 10.00, is_global_required: true }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers"
              payload: { name: "BigBox", retailer_code: "RETB", status: "ACTIVE", min_image_count: 4, feed_slot_capacity: 10, max_concurrent_feed_windows: 2, enhanced_content_requires_approval: true }
              as: ShelfAdmin
              captures: { rb_id: $.data.id }
            - call: "POST /digital-shelf/retailers/${rb_id}/requirements"
              payload: { attribute_key: "title", requirement_level: "REQUIRED" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers/${rb_id}/requirements"
              payload: { attribute_key: "description", requirement_level: "REQUIRED" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers/${rb_id}/requirements"
              payload: { attribute_key: "brand", requirement_level: "REQUIRED" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/products"
              payload: { sku: "SKU-B-1", gtin: "00012345678929", category_code: "SMALL_APPLIANCE", brand_code: "BRHM" }
              as: ContentAuthor
              captures: { pb_id: $.data.id }
            - call: "POST /digital-shelf/retailer-listings"
              payload: { product_id: "${pb_id}", retailer_id: "${rb_id}", account_team_user_id: "acct_bigbox_1" }
              as: ContentAuthor
              captures: { lb_id: $.data.id }
            - call: "POST /digital-shelf/media-assets"
              payload: { product_id: "${pb_id}", asset_role: "HERO_IMAGE", source_uri: "s3://brand/b/hero.jpg" }
              as: ContentAuthor
              captures: { mb1_id: $.data.id }
            - call: "POST /digital-shelf/media-assets"
              payload: { product_id: "${pb_id}", asset_role: "SECONDARY_IMAGE", source_uri: "s3://brand/b/sec1.jpg" }
              as: ContentAuthor
              captures: { mb2_id: $.data.id }
            - call: "POST /digital-shelf/media-assets"
              payload: { product_id: "${pb_id}", asset_role: "SECONDARY_IMAGE", source_uri: "s3://brand/b/sec2.jpg" }
              as: ContentAuthor
              captures: { mb3_id: $.data.id }
            - call: "POST /digital-shelf/media-assets/${mb1_id}/retailer-decision"
              payload: { decision: "APPROVE" }
              as: RetailerIntegration
              as_user_id: "${rb_id}"
            - call: "POST /digital-shelf/media-assets/${mb2_id}/retailer-decision"
              payload: { decision: "APPROVE" }
              as: RetailerIntegration
              as_user_id: "${rb_id}"
            - call: "POST /digital-shelf/media-assets/${mb3_id}/retailer-decision"
              payload: { decision: "APPROVE" }
              as: RetailerIntegration
              as_user_id: "${rb_id}"
            - call: "POST /digital-shelf/content-versions"
              payload: { product_id: "${pb_id}", image_count: 4 }
              as: ContentAuthor
              captures: { vb1_id: $.data.id }
            - call: "POST /digital-shelf/content-versions/${vb1_id}/attribute-values"
              payload: { attribute_key: "title", value: "Bright Kitchen Blender 900W" }
              as: ContentAuthor
            - call: "POST /digital-shelf/content-versions/${vb1_id}/attribute-values"
              payload: { attribute_key: "description", value: "A 900 watt blender with six speeds and a glass jar." }
              as: ContentAuthor
            - call: "POST /digital-shelf/change-requests"
              payload: { product_id: "${pb_id}", retailer_id: "${rb_id}", target_content_version_id: "${vb1_id}", rationale: "launch revision 1 on BigBox" }
              as: ContentAuthor
              as_user_id: "author_1"
              captures: { crb_id: $.data.id }
            - call: "POST /digital-shelf/change-requests/${crb_id}/submit"
              payload: {}
              as: ContentAuthor
              as_user_id: "author_1"
            - call: "GET /digital-shelf/products/${pb_id}"
              payload: {}
              as: ShelfAdmin
              captures: { pb_v1: $.data.version }
            - call: "POST /digital-shelf/change-requests/${crb_id}/reviews"
              payload: { track: "LEGAL", decision: "APPROVED", expected_product_version: "${pb_v1}" }
              as: LegalReviewer
              as_user_id: "legal_1"
            - call: "GET /digital-shelf/products/${pb_id}"
