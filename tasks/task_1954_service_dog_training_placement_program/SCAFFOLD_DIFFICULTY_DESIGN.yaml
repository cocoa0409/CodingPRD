            - { call: "POST /api/contributions/${c2_id}/receive", as: IntakeCoordinator, as_user_id: "coord-b" }
          assert:
            - "precondition: WaitlistEntry.${entry_id}.raised_cents == 764900 and status == PENDING (764900 < 765000)"
            - "after receiving 100: WaitlistEntry.${entry_id}.raised_cents == 765000"
            - "WaitlistEntry.${entry_id}.status == ELIGIBLE (765000 >= 765000 — inclusive boundary)"
            - "Applicant.${a_id}.application_status == MATCH_ELIGIBLE"

