# =============================================================================
# 1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Breadth probe over SCAFFOLD.yaml sections 1.1-1.7. Sections and claim_type
# values follow references/claim-extraction-guide.md. Instances already covered
# by a section 1.8 difficulty instance are emitted as excluded_because stubs.
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: project_creation_applies_defaults
        claim_type: creation
        grounds:
          - entities.Project
          - state_machines.Project
        distinguishing_aspect: "POST /api/projects with only `name` returns 201 with system defaults: current_phase SCHEMATIC_DESIGN, coordination_posture NORMAL, coordination_readiness_index 100, all counters 0, version 1, server-minted id and created_at."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P0" }, as: VDCManager, captures: { pid: $.data.id, ph: $.data.current_phase, po: $.data.coordination_posture, cri: $.data.coordination_readiness_index, ver: $.data.version, oi: $.data.ops_sweep_index } }
          trigger: []
          assert:
            - "Project.${pid}.current_phase == SCHEMATIC_DESIGN"
            - "Project.${pid}.coordination_posture == NORMAL and coordination_readiness_index == 100"
            - "Project.${pid}.version == 1 and ops_sweep_index == 0"
            - "open_critical_count == 0, open_major_count == 0, unassigned_minor_count == 0, overdue_commitment_count == 0"

      - name: project_create_missing_name_rejected
        claim_type: required_fields
        grounds:
          - entities.Project.fields.name
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required input field `name` is rejected with ERR_INVALID_REQUEST (400); no project is persisted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/projects", payload: {}, as: VDCManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"

      - name: trade_model_invalid_file_format_rejected
        claim_type: type_constraints
        grounds:
          - entities.TradeModel.fields.file_format
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "file_format outside {RVT, IFC, NWC, DWG} is rejected with ERR_INVALID_REQUEST at creation."
        test_recipe:
          setup: ["project with one partner P1"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "E3" }, as: VDCManager, captures: { pid: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "StructCo", discipline: STRUCTURAL, hourly_rate_cents: 12000, coordination_budget_hours: 100.0, software_platform: REVIT }, as: VDCManager, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: "PDF", declared_lod: 300, life_safety_elements: 1, life_safety_compliant: 1, envelope_elements: 0, envelope_compliant: 0, finish_elements: 0, finish_compliant: 0 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"

      - name: trade_model_zero_total_elements_rejected
        claim_type: type_constraints
        grounds:
          - entities.TradeModel.fields.life_safety_elements
          - calculations.model_submission_score
        distinguishing_aspect: "All six element counters zero makes total_elements == 0, violating the >= 1 aggregate constraint -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["project with partner P1"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "E4" }, as: VDCManager, captures: { pid: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "StructCo", discipline: STRUCTURAL, hourly_rate_cents: 12000, coordination_budget_hours: 100.0, software_platform: REVIT }, as: VDCManager, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: RVT, declared_lod: 300, life_safety_elements: 0, life_safety_compliant: 0, envelope_elements: 0, envelope_compliant: 0, finish_elements: 0, finish_compliant: 0 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"

      - name: trade_model_revision_numbers_are_per_discipline
        claim_type: system_fields
        grounds:
          - entities.TradeModel.fields.revision_number
          - entities.TradeModel.fields.discipline
        distinguishing_aspect: "revision_number is monotonic per (project, discipline): two STRUCTURAL models get 1 then 2, while the first MECHANICAL model gets 1; discipline is copied from the partner (input discipline is not accepted)."
        test_recipe:
          setup: ["project with partners P1 (STRUCTURAL) and P2 (MECHANICAL)"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "E5" }, as: VDCManager, captures: { pid: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "StructCo", discipline: STRUCTURAL, hourly_rate_cents: 12000, coordination_budget_hours: 100.0, software_platform: REVIT }, as: VDCManager, captures: { p1: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "MechCo", discipline: MECHANICAL, hourly_rate_cents: 10000, coordination_budget_hours: 50.0, software_platform: TEKLA }, as: VDCManager, captures: { p2: $.data.id } }
          trigger:
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: RVT, declared_lod: 300, life_safety_elements: 1, life_safety_compliant: 1, envelope_elements: 0, envelope_compliant: 0, finish_elements: 0, finish_compliant: 0 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { s1: $.data.revision_number, d1: $.data.discipline } }
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: RVT, declared_lod: 350, life_safety_elements: 1, life_safety_compliant: 1, envelope_elements: 0, envelope_compliant: 0, finish_elements: 0, finish_compliant: 0 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { s2: $.data.revision_number } }
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p2}", file_format: IFC, declared_lod: 300, life_safety_elements: 1, life_safety_compliant: 1, envelope_elements: 0, envelope_compliant: 0, finish_elements: 0, finish_compliant: 0 }, as: TradeModelAuthor, as_user_id: "${p2}", captures: { m1rev: $.data.revision_number, d3: $.data.discipline } }
          assert:
            - "first STRUCTURAL revision_number == 1, second == 2"
            - "first MECHANICAL revision_number == 1 (counter is per discipline)"
            - "discipline on the third model == MECHANICAL (copied from TradePartner, not client input)"

      - name: interop_status_computed_from_platform_format_matrix
        claim_type: computed_fields
        grounds:
          - entities.TradeModel.fields.interop_status
          - calculations.interop_classification
        distinguishing_aspect: "interop_status is computed at creation from the interop matrix: REVIT+RVT -> NATIVE, REVIT+IFC -> CONVERTIBLE, IFC_ONLY+RVT -> INCOMPATIBLE; client cannot set it."
        test_recipe:
          setup: ["project with partners P1 (REVIT) and P3 (IFC_ONLY)"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "E6" }, as: VDCManager, captures: { pid: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "StructCo", discipline: STRUCTURAL, hourly_rate_cents: 12000, coordination_budget_hours: 100.0, software_platform: REVIT }, as: VDCManager, captures: { p1: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "IfcCo", discipline: ELECTRICAL, hourly_rate_cents: 9000, coordination_budget_hours: 40.0, software_platform: IFC_ONLY }, as: VDCManager, captures: { p3: $.data.id } }
          trigger:
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: RVT, declared_lod: 300, life_safety_elements: 1, life_safety_compliant: 1, envelope_elements: 0, envelope_compliant: 0, finish_elements: 0, finish_compliant: 0 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { io1: $.data.interop_status } }
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: IFC, declared_lod: 300, life_safety_elements: 1, life_safety_compliant: 1, envelope_elements: 0, envelope_compliant: 0, finish_elements: 0, finish_compliant: 0 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { io2: $.data.interop_status } }
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p3}", file_format: RVT, declared_lod: 300, life_safety_elements: 1, life_safety_compliant: 1, envelope_elements: 0, envelope_compliant: 0, finish_elements: 0, finish_compliant: 0 }, as: TradeModelAuthor, as_user_id: "${p3}", captures: { io3: $.data.interop_status } }
          assert:
            - "REVIT + RVT -> interop_status NATIVE"
            - "REVIT + IFC -> interop_status CONVERTIBLE"
            - "IFC_ONLY + RVT -> interop_status INCOMPATIBLE"

      - name: meeting_list_pagination_defaults
        claim_type: listing
        grounds:
          - response_envelope
          - endpoints['GET /api/coordination-meetings']
        distinguishing_aspect: "With 11 meetings and no explicit params, the list returns limit 10 / offset 0 / total_count 11 / has_more true; offset 10 returns 1 item with has_more false. Envelope carries meta.api_request_id and response_type array."
        test_recipe:
          setup: ["project P"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "E7" }, as: VDCManager, captures: { pid: $.data.id } }
            - { call: "POST /api/projects/${pid}/coordination-meetings", payload: { room_id: "R01", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T10:00:00Z" }, as: BIMCoordinator }
            - { call: "POST /api/projects/${pid}/coordination-meetings", payload: { room_id: "R02", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T10:00:00Z" }, as: BIMCoordinator }
            - { call: "POST /api/projects/${pid}/coordination-meetings", payload: { room_id: "R03", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T10:00:00Z" }, as: BIMCoordinator }
            - { call: "POST /api/projects/${pid}/coordination-meetings", payload: { room_id: "R04", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T10:00:00Z" }, as: BIMCoordinator }
            - { call: "POST /api/projects/${pid}/coordination-meetings", payload: { room_id: "R05", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T10:00:00Z" }, as: BIMCoordinator }
            - { call: "POST /api/projects/${pid}/coordination-meetings", payload: { room_id: "R06", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T10:00:00Z" }, as: BIMCoordinator }
            - { call: "POST /api/projects/${pid}/coordination-meetings", payload: { room_id: "R07", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T10:00:00Z" }, as: BIMCoordinator }
            - { call: "POST /api/projects/${pid}/coordination-meetings", payload: { room_id: "R08", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T10:00:00Z" }, as: BIMCoordinator }
            - { call: "POST /api/projects/${pid}/coordination-meetings", payload: { room_id: "R09", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T10:00:00Z" }, as: BIMCoordinator }
            - { call: "POST /api/projects/${pid}/coordination-meetings", payload: { room_id: "R10", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T10:00:00Z" }, as: BIMCoordinator }
            - { call: "POST /api/projects/${pid}/coordination-meetings", payload: { room_id: "R11", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T10:00:00Z" }, as: BIMCoordinator }
          trigger:
            - { call: "GET /api/coordination-meetings", payload: { project_id: "${pid}" }, as: VDCManager }
          assert:
            - "page 1: exactly 10 items, total_count == 11, has_more == true (defaults limit 10, offset 0)"
            - "offset 10 page: exactly 1 item, has_more == false"

      - name: not_found_errors_on_unknown_ids
        claim_type: not_found
        grounds:
          - errors[ERR_PROJECT_NOT_FOUND]
          - errors[ERR_TRADE_MODEL_NOT_FOUND]
          - errors[ERR_SIGNOFF_NOT_FOUND]
          - errors[ERR_HANDOVER_NOT_FOUND]
        distinguishing_aspect: "Unknown UUIDs yield the entity-specific 404: project, trade model, sign-off, handover package (path resources validated left-to-right)."
        test_recipe:
          setup: ["one project exists"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "E8" }, as: VDCManager, captures: { pid: $.data.id } }
          trigger:
            - { call: "GET /api/projects/00000000-0000-0000-0000-000000000000", payload: {}, as: VDCManager, captures: { e1: $.data.error_id } }
            - { call: "GET /api/trade-models/00000000-0000-0000-0000-000000000000", payload: {}, as: VDCManager, captures: { e2: $.data.error_id } }
            - { call: "POST /api/signoffs/00000000-0000-0000-0000-000000000000/sign", payload: {}, as: LeadEngineer, as_user_id: "eng-1", captures: { e3: $.data.error_id } }
            - { call: "POST /api/handover-packages/00000000-0000-0000-0000-000000000000/transmit", payload: {}, as: BIMCoordinator, captures: { e4: $.data.error_id } }
            - { call: "POST /api/projects/00000000-0000-0000-0000-000000000000/trade-partners", payload: { company_name: "X", discipline: STRUCTURAL, hourly_rate_cents: 1, coordination_budget_hours: 1.0, software_platform: REVIT }, as: VDCManager, captures: { e5: $.data.error_id } }
          assert:
            - "ERR_PROJECT_NOT_FOUND (404) for unknown project on GET and on nested create"
            - "ERR_TRADE_MODEL_NOT_FOUND (404)"
            - "ERR_SIGNOFF_NOT_FOUND (404)"
            - "ERR_HANDOVER_NOT_FOUND (404)"

      - name: not_found_errors_on_action_paths
        claim_type: not_found
        grounds:
          - errors[ERR_CLASH_RUN_NOT_FOUND]
          - errors[ERR_CLASH_ISSUE_NOT_FOUND]
          - errors[ERR_MEETING_NOT_FOUND]
          - errors[ERR_COMMITMENT_NOT_FOUND]
          - errors[ERR_PACKAGE_NOT_FOUND]
          - errors[ERR_AS_BUILT_NOT_FOUND]
          - errors[ERR_TAKEOFF_NOT_FOUND]
          - errors[ERR_FEDERATED_MODEL_NOT_FOUND]
          - errors[ERR_TRADE_PARTNER_NOT_FOUND]
        distinguishing_aspect: "Remaining entity-specific 404s are each triggerable on their action paths: run start, clash assign, meeting start, commitment waive, package release, as-built verify, takeoff approve, federated freeze; assign with an unknown partner id yields ERR_TRADE_PARTNER_NOT_FOUND."
        test_recipe:
          setup: ["one project exists"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "E9" }, as: VDCManager, captures: { pid: $.data.id } }
          trigger:
            - { call: "POST /api/clash-runs/00000000-0000-0000-0000-000000000000/start", payload: {}, as: BIMCoordinator, captures: { e1: $.data.error_id } }
            - { call: "POST /api/clash-issues/00000000-0000-0000-0000-000000000000/assign", payload: { trade_partner_id: "00000000-0000-0000-0000-000000000000" }, as: BIMCoordinator, captures: { e2: $.data.error_id } }
            - { call: "POST /api/coordination-meetings/00000000-0000-0000-0000-000000000000/start", payload: {}, as: BIMCoordinator, captures: { e3: $.data.error_id } }
            - { call: "POST /api/commitments/00000000-0000-0000-0000-000000000000/waive", payload: {}, as: BIMCoordinator, captures: { e4: $.data.error_id } }
            - { call: "POST /api/fabrication-packages/00000000-0000-0000-0000-000000000000/release", payload: {}, as: FabricationLead, as_user_id: "00000000-0000-0000-0000-000000000000", captures: { e5: $.data.error_id } }
            - { call: "POST /api/as-built-models/00000000-0000-0000-0000-000000000000/verify", payload: { verification_deviation_mm: 1.0 }, as: VDCManager, captures: { e6: $.data.error_id } }
            - { call: "POST /api/quantity-takeoffs/00000000-0000-0000-0000-000000000000/approve", payload: {}, as: VDCManager, captures: { e7: $.data.error_id } }
            - { call: "POST /api/federated-models/00000000-0000-0000-0000-000000000000/freeze", payload: {}, as: VDCManager, captures: { e8: $.data.error_id } }
          assert:
            - "ERR_CLASH_RUN_NOT_FOUND / ERR_CLASH_ISSUE_NOT_FOUND / ERR_MEETING_NOT_FOUND / ERR_COMMITMENT_NOT_FOUND / ERR_PACKAGE_NOT_FOUND / ERR_AS_BUILT_NOT_FOUND / ERR_TAKEOFF_NOT_FOUND / ERR_FEDERATED_MODEL_NOT_FOUND (all 404)"
            - "clash assign validates the clash path id before the body partner id (ERR_CLASH_ISSUE_NOT_FOUND wins, left-to-right path-first)"

      - name: fk_reverse_reachability_lists
        claim_type: parent_relationships
        grounds:
          - entities.FederatedModelMember.fields.trade_model_id
          - entities.ClashIssue.fields.assigned_trade_partner_id
          - endpoints['GET /api/federated-models/{id}/members']
          - endpoints['GET /api/trade-models']
        distinguishing_aspect: "Children are discoverable from their parents: members via /api/federated-models/{id}/members; the superseding model via /api/trade-models?supersedes_model_id=...; assigned clashes via /api/clash-issues?assigned_trade_partner_id=..."
        test_recipe:
          setup:
            - "project with partner P1; M1 ACCEPTED; F1 [M1] ASSEMBLED"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "E10" }, as: VDCManager, captures: { pid: $.data.id, pv: $.data.version } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "StructCo", discipline: STRUCTURAL, hourly_rate_cents: 12000, coordination_budget_hours: 100.0, software_platform: REVIT }, as: VDCManager, captures: { p1: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: RVT, declared_lod: 300, life_safety_elements: 10, life_safety_compliant: 10, envelope_elements: 10, envelope_compliant: 10, finish_elements: 10, finish_compliant: 10 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { m1: $.data.id } }
            - { call: "POST /api/trade-models/${m1}/submit", payload: {}, as: TradeModelAuthor, as_user_id: "${p1}" }
            - { call: "POST /api/trade-models/${m1}/accept", payload: {}, as: BIMCoordinator }
            - { call: "POST /api/projects/${pid}/federated-models", payload: { label: "F1", target_format: IFC, member_trade_model_ids: ["${m1}"], expected_project_version: "${pv}" }, as: VDCManager, captures: { f1: $.data.id } }
          trigger:
            - { call: "GET /api/federated-models/${f1}/members", payload: {}, as: VDCManager, captures: { mm: "$.data[0].trade_model_id" } }
            - { call: "GET /api/trade-models", payload: { project_id: "${pid}", status: ACCEPTED }, as: VDCManager }
          assert:
            - "GET /api/federated-models/${f1}/members returns 1 member with trade_model_id == ${m1}"
            - "GET /api/trade-models?project_id&status=ACCEPTED returns exactly M1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: initial_states_observed_at_creation
        claim_type: initial_state
        grounds:
          - state_machines.TradeModel
          - state_machines.FederatedModel
          - state_machines.ClashDetectionRun
          - state_machines.ClashIssue
          - state_machines.CoordinationMeeting
          - state_machines.FabricationPackage
        distinguishing_aspect: "Newly created entities start in their declared initial states: TradeModel DRAFT, FederatedModel DRAFT when any member is not yet ACCEPTED, ClashDetectionRun QUEUED, ClashIssue NEW, CoordinationMeeting SCHEDULED, FabricationPackage DRAFT."
        test_recipe:
          setup: ["project P; partner P1; model M1 in DRAFT (never submitted); federated model F0 assembled over the DRAFT M1"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "SM1" }, as: VDCManager, captures: { pid: $.data.id, pv: $.data.version } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "StructCo", discipline: STRUCTURAL, hourly_rate_cents: 12000, coordination_budget_hours: 100.0, software_platform: REVIT }, as: VDCManager, captures: { p1: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: RVT, declared_lod: 300, life_safety_elements: 10, life_safety_compliant: 10, envelope_elements: 10, envelope_compliant: 10, finish_elements: 10, finish_compliant: 10 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { m1: $.data.id, m1_st: $.data.status } }
            - { call: "POST /api/projects/${pid}/federated-models", payload: { label: "F0", target_format: IFC, member_trade_model_ids: ["${m1}"], expected_project_version: "${pv}" }, as: VDCManager, captures: { f0: $.data.id, f0_st: $.data.status } }
            - { call: "POST /api/projects/${pid}/coordination-meetings", payload: { room_id: "RM-1", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T10:00:00Z" }, as: BIMCoordinator, captures: { mtg: $.data.id, mtg_st: $.data.status } }
          trigger: []
          assert:
            - "TradeModel.${m1}.status == DRAFT at creation"
            - "FederatedModel.${f0}.status == DRAFT (member M1 not ACCEPTED -> compound initial state)"
            - "CoordinationMeeting.${mtg}.status == SCHEDULED"

      - name: federated_auto_assemble_bubble_up
        claim_type: valid_transition
        grounds:
          - state_machines.FederatedModel.DRAFT_to_ASSEMBLED
          - state_machines.TradeModel.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: "Compound/bubble-up: a federated model created over a not-yet-accepted member sits in DRAFT and auto-transitions to ASSEMBLED the moment its last member is accepted — no direct API call targets the federated model."
        test_recipe:
          setup: ["F0 in DRAFT over SUBMITTED M1 (from initial_states chain), then M1 accepted"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "SM2" }, as: VDCManager, captures: { pid: $.data.id, pv: $.data.version } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "StructCo", discipline: STRUCTURAL, hourly_rate_cents: 12000, coordination_budget_hours: 100.0, software_platform: REVIT }, as: VDCManager, captures: { p1: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: RVT, declared_lod: 300, life_safety_elements: 10, life_safety_compliant: 10, envelope_elements: 10, envelope_compliant: 10, finish_elements: 10, finish_compliant: 10 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { m1: $.data.id } }
            - { call: "POST /api/projects/${pid}/federated-models", payload: { label: "F0", target_format: IFC, member_trade_model_ids: ["${m1}"], expected_project_version: "${pv}" }, as: VDCManager, captures: { f0: $.data.id, f0_st: $.data.status } }
            - { call: "POST /api/trade-models/${m1}/submit", payload: {}, as: TradeModelAuthor, as_user_id: "${p1}" }
          trigger:
            - { call: "POST /api/trade-models/${m1}/accept", payload: {}, as: BIMCoordinator }
