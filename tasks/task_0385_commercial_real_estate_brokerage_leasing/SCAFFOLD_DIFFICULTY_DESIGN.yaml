              as: BrokerageAdmin
              captures: { lb_id: $.data.id }
            - call: "POST /brokers"
              payload: { brokerage_id: "${bkrg_b_id}", full_name: "TB CI2", license_no: "T-2002", role: "TENANT_BROKER" }
              as: BrokerageAdmin
              captures: { tb_id: $.data.id }
            - call: "POST /properties"
              payload: { listing_broker_id: "${lb_id}", name: "CI2 Bldg", market: "WEST-SEA", asset_class: "OFFICE", total_sf: 5000 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /spaces"
              payload: { property_id: "${prop_id}", suite_no: "1", rentable_sf: 5000, asking_rent_psf_yr: 50 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { space_id: $.data.id }
            - call: "POST /spaces/${space_id}/publish"
              payload: {}
              as: ListingBroker
              as_user_id: "${lb_id}"
            - call: "POST /listings"
              payload: { space_id: "${space_id}", listing_broker_id: "${lb_id}", term_months: 60 }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/activate"
              payload: {}
              as: ListingBroker
              as_user_id: "${lb_id}"
            - call: "POST /requirements"
              payload: { tenant_broker_id: "${tb_id}", tenant_name: "CI2 Tenant", market: "WEST-SEA", asset_class: "OFFICE", min_sf: 1000, max_sf: 9000, max_rent_psf_yr: 70 }
              as: TenantBroker
              as_user_id: "${tb_id}"
              captures: { req_id: $.data.id }
            - call: "POST /deals"
              payload: { listing_id: "${listing_id}", requirement_id: "${req_id}" }
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { deal_id: $.data.id, dv0: $.data.version }
            - call: "POST /deals/${deal_id}/proposals"
              payload: { from_side: "LISTING", base_rent_psf_yr: 50, term_months: 60, expected_deal_version: "${dv0}" }
              as: ListingBroker
              as_user_id: "${lb_id}"
            - call: "GET /deals/${deal_id}"
              payload: {}
              as: ListingBroker
              as_user_id: "${lb_id}"
              captures: { dv1: $.data.version }
            - call: "POST /deals/${deal_id}/accept"
