# =============================================================================
# §1.8 Scaffold Difficulty Design — task 2241 Traveling Carnival Route & Contract
# Management. Every instance grounds only in SCAFFOLD.yaml §1.1-§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: settlement_provisional_vs_final_diverge_on_guarantee_basis_and_ride_count
        grounds:
          - calculations.stop_settlement
          - calculations.weather_abatement_hours
          - calculations.makegood_amount
          - entities.Settlement.fields.guarantee_effective_cents
          - entities.Settlement.fields.shortfall_penalty_cents
          - entities.Settlement.fields.makegood_deduction_cents
          - entities.Settlement.fields.settlement_due_cents
          - state_machines.Settlement.PROVISIONAL_to_FINAL
          - state_machines.RideAllocation.OPERATING_to_RELEASED
        distinguishing_aspect: |
          This instance's variant split lives in the REVENUE domain: with byte-identical TicketSale rows the
          PROVISIONAL variant pro-rates the guarantee by elapsed operating days (600000) and counts the
          mid-run-pulled ride toward the ride minimum, while the FINAL variant abates the guarantee by
          adjudicated closure hours (712500), counts only OPERATING/STRUCK rides so the pulled ride drops out
          and a 25000 shortfall penalty appears, and deducts the ACCEPTED CASH_REFUND make-good (270000) —
          settlement_due_cents moves 1913759 -> 1618759 on the same Settlement row.
        test_recipe:
          setup:
            - "Jurisdiction OH: amusement_tax_pct 6.5, permit_lead_days 10, requires_state_ride_inspection false, max_consecutive_work_days 6."
            - "Venue V1 in OH: lot_area_sqft 100000, power_amps_available 1200, expected_attendance 20001, housing_pads_available 4."
            - "Route R1 SEQUENCED then COMMITTED with a single stop A (load-in 2026-09-01T06:00Z, open 2026-09-04T12:00Z, close 2026-09-07T12:00Z, teardown 2026-09-08T12:00Z) so operating_days = 3 and scheduled_operating_hours = 24."
            - "Contract C1 EXECUTED on stop A: revenue_split_pct_operator 65, guarantee_cents 900000, ride_minimum_count 4, settlement_basis GREATER_OF."
            - "Four RideAllocations (wheel MAJOR, tilt FLAT, kiddie KIDDIE, swings FLAT) COMMITTED then OPERATING; TRANSPORT and EVENT permits APPROVED; four SCHEDULED RIDE_OPERATOR shifts so compliance_posture is CLEAR at gate time."
            - "Stop A is OPEN with TicketSale rows WRISTBAND 300x4167, SINGLE 700x1043, PRESALE 501x2100 and COMP 40x0."
            - "One WIND WeatherClosure 2026-09-05T14:00Z..19:00Z is ADJUDICATED to 5.00 abated hours; one ACCEPTED CASH_REFUND make-good of 270000 exists; the swings allocation is pulled off the lot mid-run."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, requires_state_ride_inspection: false, inspection_slot_capacity_per_day: 2, amusement_tax_pct: 6.5, max_consecutive_work_days: 6, housing_permit_required: false, permit_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { jur_oh: $.data.id }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_oh}", name: "Franklin County Fairgrounds", city: "Columbus", lot_area_sqft: 100000, power_amps_available: 1200, expected_attendance: 20001, housing_pads_available: 4, lot_surface: "GRAVEL" }
              as: PlatformAdmin
              captures: { venue_v1: $.data.id }
            - call: "POST /rides"
              payload: { name: "Giant Wheel", ride_class: "MAJOR", footprint_sqft: 4010, power_amps: 300, crew_size_setup: 6, setup_hours: 8, axle_count: 4, requires_state_inspection: false }
              as: PlatformAdmin
              captures: { ride_wheel: $.data.id }
            - call: "POST /rides"
              payload: { name: "Tilt-A-Whirl", ride_class: "FLAT", footprint_sqft: 2003, power_amps: 120, crew_size_setup: 4, setup_hours: 5, axle_count: 2, requires_state_inspection: false }
              as: PlatformAdmin
              captures: { ride_tilt: $.data.id }
            - call: "POST /rides"
              payload: { name: "Kiddie Coaster", ride_class: "KIDDIE", footprint_sqft: 905, power_amps: 60, crew_size_setup: 2, setup_hours: 3, axle_count: 1, requires_state_inspection: false }
              as: PlatformAdmin
              captures: { ride_kiddie: $.data.id }
            - call: "POST /rides"
              payload: { name: "Chair Swings", ride_class: "FLAT", footprint_sqft: 1603, power_amps: 90, crew_size_setup: 3, setup_hours: 4, axle_count: 2, requires_state_inspection: false }
              as: PlatformAdmin
              captures: { ride_swings: $.data.id }
            - call: "POST /workers"
              payload: { full_name: "Op One", employment_type: "PERMANENT", hourly_rate_cents: 1600, certified_ride_classes: ["FLAT"], housing_required: false }
              as: PlatformAdmin
              captures: { op_1: $.data.id }
            - call: "POST /workers"
              payload: { full_name: "Op Two", employment_type: "PERMANENT", hourly_rate_cents: 1600, certified_ride_classes: ["FLAT"], housing_required: false }
              as: PlatformAdmin
              captures: { op_2: $.data.id }
            - call: "POST /workers"
              payload: { full_name: "Op Three", employment_type: "PERMANENT", hourly_rate_cents: 1600, certified_ride_classes: ["FLAT"], housing_required: false }
              as: PlatformAdmin
              captures: { op_3: $.data.id }
            - call: "POST /workers"
              payload: { full_name: "Op Four", employment_type: "PERMANENT", hourly_rate_cents: 1600, certified_ride_classes: ["FLAT"], housing_required: false }
              as: PlatformAdmin
              captures: { op_4: $.data.id }
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_1: $.data.id }
            - call: "POST /route-stops"
              payload: { route_id: "${route_1}", venue_id: "${venue_v1}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z", haul_miles_from_previous: 0 }
              as: RouteManager
              captures: { stop_a: $.data.id }
            - call: "POST /permit-applications"
              payload: { route_stop_id: "${stop_a}", permit_type: "TRANSPORT", valid_from: "2026-09-01T00:00:00Z", valid_until: "2026-09-09T00:00:00Z", axles_declared: 4 }
              as: ComplianceClerk
              captures: { permit_transport: $.data.id }
            - call: "POST /permit-applications/${permit_transport}/submit"
              payload: {}
              as: ComplianceClerk
            - call: "POST /permit-applications/${permit_transport}/decision"
              payload: { decision: "APPROVE" }
              as: JurisdictionOfficer
            - call: "POST /permit-applications"
              payload: { route_stop_id: "${stop_a}", permit_type: "EVENT", valid_from: "2026-09-04T00:00:00Z", valid_until: "2026-09-08T00:00:00Z" }
              as: ComplianceClerk
              captures: { permit_event: $.data.id }
            - call: "POST /permit-applications/${permit_event}/submit"
              payload: {}
              as: ComplianceClerk
            - call: "POST /permit-applications/${permit_event}/decision"
              payload: { decision: "APPROVE" }
              as: JurisdictionOfficer
            - call: "GET /route-stops/${stop_a}"
              payload: {}
              as: LotBoss
              captures: { sv_1: $.data.version }
            - call: "POST /ride-allocations"
              payload: { ride_id: "${ride_wheel}", route_stop_id: "${stop_a}", expected_route_stop_version: "${sv_1}" }
              as: LotBoss
              captures: { alloc_wheel: $.data.id }
            - call: "GET /route-stops/${stop_a}"
              payload: {}
              as: LotBoss
              captures: { sv_2: $.data.version }
            - call: "POST /ride-allocations"
              payload: { ride_id: "${ride_tilt}", route_stop_id: "${stop_a}", expected_route_stop_version: "${sv_2}" }
              as: LotBoss
              captures: { alloc_tilt: $.data.id }
            - call: "GET /route-stops/${stop_a}"
              payload: {}
              as: LotBoss
              captures: { sv_3: $.data.version }
            - call: "POST /ride-allocations"
              payload: { ride_id: "${ride_kiddie}", route_stop_id: "${stop_a}", expected_route_stop_version: "${sv_3}" }
              as: LotBoss
              captures: { alloc_kiddie: $.data.id }
            - call: "GET /route-stops/${stop_a}"
              payload: {}
              as: LotBoss
              captures: { sv_4: $.data.version }
            - call: "POST /ride-allocations"
              payload: { ride_id: "${ride_swings}", route_stop_id: "${stop_a}", expected_route_stop_version: "${sv_4}" }
              as: LotBoss
              captures: { alloc_swings: $.data.id }
            - call: "POST /routes/${route_1}/sequence"
              payload: {}
              as: RouteManager
            - call: "POST /contracts"
              payload: { route_stop_id: "${stop_a}", counterparty_name: "Franklin County Agricultural Society", sponsor_name: "Buckeye Beverage", revenue_split_pct_operator: 65, guarantee_cents: 900000, ride_minimum_count: 4, exclusivity: "RIDES", settlement_basis: "GREATER_OF" }
              as: ContractNegotiator
              captures: { contract_1: $.data.id }
            - call: "POST /contracts/${contract_1}/send"
              payload: {}
              as: ContractNegotiator
              as_user_id: "user-negotiator-1"
            - call: "POST /routes/${route_1}/commit"
              payload: {}
              as: RouteManager
            - call: "POST /contracts/${contract_1}/execute"
              payload: {}
              as: GeneralManager
              as_user_id: "user-gm-1"
            - call: "POST /crew-assignments"
              payload: { route_stop_id: "${stop_a}", worker_id: "${op_1}", crew_role: "RIDE_OPERATOR", shift_start: "2026-09-04T12:00:00Z", shift_end: "2026-09-04T20:00:00Z" }
              as: LotBoss
            - call: "POST /crew-assignments"
              payload: { route_stop_id: "${stop_a}", worker_id: "${op_2}", crew_role: "RIDE_OPERATOR", shift_start: "2026-09-04T12:00:00Z", shift_end: "2026-09-04T20:00:00Z" }
              as: LotBoss
            - call: "POST /crew-assignments"
              payload: { route_stop_id: "${stop_a}", worker_id: "${op_3}", crew_role: "RIDE_OPERATOR", shift_start: "2026-09-04T12:00:00Z", shift_end: "2026-09-04T20:00:00Z" }
              as: LotBoss
            - call: "POST /crew-assignments"
              payload: { route_stop_id: "${stop_a}", worker_id: "${op_4}", crew_role: "RIDE_OPERATOR", shift_start: "2026-09-04T12:00:00Z", shift_end: "2026-09-04T20:00:00Z" }
              as: LotBoss
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /route-stops/${stop_a}/begin-setup"
              payload: {}
              as: LotBoss
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /route-stops/${stop_a}/open-gates"
              payload: {}
              as: LotBoss
            - call: "POST /route-stops/${stop_a}/ticket-sales"
              payload: { channel: "WRISTBAND", units: 300, unit_price_cents: 4167, business_date: "2026-09-04T18:00:00Z" }
              as: TicketingAuditor
            - call: "POST /route-stops/${stop_a}/ticket-sales"
              payload: { channel: "SINGLE", units: 700, unit_price_cents: 1043, business_date: "2026-09-04T19:00:00Z" }
              as: TicketingAuditor
            - call: "POST /route-stops/${stop_a}/ticket-sales"
              payload: { channel: "PRESALE", units: 501, unit_price_cents: 2100, business_date: "2026-09-04T19:30:00Z" }
              as: TicketingAuditor
            - call: "POST /route-stops/${stop_a}/ticket-sales"
              payload: { channel: "COMP", units: 40, unit_price_cents: 0, business_date: "2026-09-04T19:45:00Z" }
              as: TicketingAuditor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T18:00:00Z" }
              as: PlatformAdmin
            - call: "POST /route-stops/${stop_a}/weather-closures"
              payload: { cause: "WIND", closed_from: "2026-09-05T14:00:00Z", closed_to: "2026-09-05T19:00:00Z" }
              as: LotBoss
              captures: { closure_1: $.data.id }
            - call: "GET /contracts/${contract_1}"
              payload: {}
              as: TicketingAuditor
              captures: { cv_1: $.data.version }
            - call: "POST /settlements"
              payload: { contract_id: "${contract_1}", expected_contract_version: "${cv_1}" }
              as: TicketingAuditor
              captures: { settle_1: $.data.id }
            - call: "POST /weather-closures/${closure_1}/adjudicate"
              payload: {}
              as: GeneralManager
            - call: "POST /make-goods"
              payload: { weather_closure_id: "${closure_1}", contract_id: "${contract_1}", kind: "CASH_REFUND" }
              as: GeneralManager
              captures: { makegood_1: $.data.id }
            - call: "POST /make-goods/${makegood_1}/respond"
              payload: { response: "ACCEPT" }
              as: ContractNegotiator
            - call: "POST /ride-allocations/${alloc_swings}/release"
              payload: {}
              as: LotBoss
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /route-stops/${stop_a}/teardown"
              payload: {}
              as: RouteManager
          trigger:
            - call: "POST /settlements/${settle_1}/finalize"
              payload: {}
              as: GeneralManager
          assert:
            - "Before the trigger, Settlement.${settle_1}.variant == PROVISIONAL and Settlement.${settle_1}.guarantee_effective_cents == 600000"
            - "Before the trigger, Settlement.${settle_1}.shortfall_penalty_cents == 0 and Settlement.${settle_1}.makegood_deduction_cents == 0"
            - "Before the trigger, Settlement.${settle_1}.settlement_due_cents == 1913759"
            - "After the trigger, Settlement.${settle_1}.variant == FINAL and Settlement.${settle_1}.status == FINAL"
            - "Settlement.${settle_1}.gross_cents == 3032300 (unchanged by the variant switch)"
            - "Settlement.${settle_1}.tax_cents == 197101 and Settlement.${settle_1}.taxable_net_cents == 2835199"
            - "Settlement.${settle_1}.effective_operator_pct == 67.5 and Settlement.${settle_1}.split_share_cents == 1913759"
            - "Settlement.${settle_1}.guarantee_effective_cents == 712500"
            - "Settlement.${settle_1}.shortfall_penalty_cents == 25000"
            - "Settlement.${settle_1}.makegood_deduction_cents == 270000"
            - "Settlement.${settle_1}.settlement_due_cents == 1618759"
            - "RouteStop.${stop_a}.closure_hours_adjudicated == 5.0 and WeatherClosure.${closure_1}.abated_hours == 5.0"
            - "MakeGoodArrangement.${makegood_1}.amount_cents == 270000"

      - name: worker_duty_exposure_scheduled_basis_gate_versus_worked_basis_counter
        grounds:
          - calculations.worker_duty_exposure
          - entities.Worker.fields.scheduled_hours_total
          - entities.Worker.fields.worked_days_count
          - state_machines.CrewAssignment.SCHEDULED_to_RELEASED
          - validations[priority=63]
          - errors[ERR_CONSECUTIVE_DAYS_EXCEEDED]
        distinguishing_aspect: |
          This instance's variant split lives in the LABOR domain and switches on BASIS_STATUS_SET, not on money:
          SCHEDULED_BASIS counts {SCHEDULED, COMPLETED} so a merely booked shift consumes a consecutive day and
          blocks a third one (ERR_CONSECUTIVE_DAYS_EXCEEDED), and releasing that booked shift immediately reopens
          the run; WORKED_BASIS counts {COMPLETED} only, so with the identical two rows Worker.scheduled_hours_total
          reads 16.0 while Worker.worked_days_count still reads 0.
        test_recipe:
          setup:
            - "Jurisdiction KY with max_consecutive_work_days 2, permit_lead_days 0, amusement_tax_pct 0."
            - "Venue V3 in KY and Route R2 with one PLANNED stop B (load-in 2026-09-01T06:00Z, teardown 2026-09-08T12:00Z)."
            - "Worker RIG-1: PERMANENT, hourly_rate_cents 2000, housing_required false."
            - "Two SETUP shifts on 2026-09-01 and 2026-09-02 are already SCHEDULED for RIG-1 on stop B."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "KY", name: "Kentucky", permit_lead_days: 0, requires_state_ride_inspection: false, inspection_slot_capacity_per_day: 2, amusement_tax_pct: 0, max_consecutive_work_days: 2, housing_permit_required: false, permit_fee_cents: 0 }
              as: PlatformAdmin
              captures: { jur_ky: $.data.id }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_ky}", name: "Bluegrass Fairground", city: "Lexington", lot_area_sqft: 80000, power_amps_available: 900, expected_attendance: 9001, housing_pads_available: 2, lot_surface: "GRASS" }
              as: PlatformAdmin
              captures: { venue_v3: $.data.id }
            - call: "POST /workers"
              payload: { full_name: "Rigger One", employment_type: "PERMANENT", hourly_rate_cents: 2000, certified_ride_classes: [], housing_required: false }
              as: PlatformAdmin
              captures: { rig_1: $.data.id }
            - call: "POST /routes"
              payload: { name: "2026 Bluegrass Loop", season_year: 2026, home_base_state: "KY" }
              as: RouteManager
              captures: { route_2: $.data.id }
            - call: "POST /route-stops"
              payload: { route_id: "${route_2}", venue_id: "${venue_v3}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z", haul_miles_from_previous: 0 }
              as: RouteManager
              captures: { stop_b: $.data.id }
            - call: "POST /crew-assignments"
              payload: { route_stop_id: "${stop_b}", worker_id: "${rig_1}", crew_role: "SETUP", shift_start: "2026-09-01T08:00:00Z", shift_end: "2026-09-01T16:00:00Z" }
              as: LotBoss
              captures: { shift_day1: $.data.id }
            - call: "POST /crew-assignments"
              payload: { route_stop_id: "${stop_b}", worker_id: "${rig_1}", crew_role: "SETUP", shift_start: "2026-09-02T08:00:00Z", shift_end: "2026-09-02T16:00:00Z" }
              as: LotBoss
              captures: { shift_day2: $.data.id }
          trigger:
            - call: "POST /crew-assignments"
              payload: { route_stop_id: "${stop_b}", worker_id: "${rig_1}", crew_role: "SETUP", shift_start: "2026-09-03T08:00:00Z", shift_end: "2026-09-03T16:00:00Z" }
              as: LotBoss
              captures: { blocked_error: $.data.error_id }
            - call: "POST /crew-assignments/${shift_day1}/cancel"
              payload: {}
              as: LotBoss
            - call: "POST /crew-assignments"
              payload: { route_stop_id: "${stop_b}", worker_id: "${rig_1}", crew_role: "SETUP", shift_start: "2026-09-03T08:00:00Z", shift_end: "2026-09-03T16:00:00Z" }
              as: LotBoss
              captures: { shift_day3: $.data.id }
          assert:
            - "The first trigger call returns HTTP 422 with error_id == ERR_CONSECUTIVE_DAYS_EXCEEDED (SCHEDULED_BASIS run over 2026-09-01..2026-09-03 would be 3 > max_consecutive_work_days 2)"
            - "CrewAssignment.${shift_day1}.status == RELEASED after the cancel"
            - "The third trigger call returns HTTP 201 because the SCHEDULED_BASIS run is now 2026-09-02..2026-09-03 == 2"
            - "CrewAssignment.${shift_day2}.cost_cents == 17600 and CrewAssignment.${shift_day3}.cost_cents == 17600"
            - "Worker.${rig_1}.scheduled_hours_total == 16.0 (SCHEDULED_BASIS: two SCHEDULED shifts of 8.0 h; the RELEASED shift is excluded)"
            - "Worker.${rig_1}.worked_days_count == 0 (WORKED_BASIS admits COMPLETED only, so the same two rows contribute nothing)"
            - "RouteStop.${stop_b}.labor_cost_provisional_cents == 35200"

  # ===========================================================================
  # RULE 2 — combinatorial_formula
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: lot_capacity_charge_combines_class_spacing_surge_and_lot_reserve_constants
        grounds:
          - calculations.lot_capacity_charge
          - entities.RideAllocation.fields.footprint_charged_sqft
          - entities.RideAllocation.fields.power_charged_amps
          - entities.RouteStop.fields.allocated_sqft_used
          - entities.RouteStop.fields.power_amps_used
          - concurrency_rules[allocation-create-stale-stop]
        distinguishing_aspect: |
          MODE (a) — multi-constant combination: one charge combines two per-ride-class lookup tables
          (SPACING_MULTIPLIER, STARTUP_SURGE_PCT) with three lot-level constants (USABLE_LOT_PCT,
          CIRCULATION_SQFT_PER_ATTENDEE, POWER_HEADROOM_PCT) under two different rounding modes in the same
          formula (ceil for footprint, round_half_up to 1 decimal for amperage, floor+ceil for the lot budget),
          so no single constant can be dropped without changing 5414/2404/996 and 375.0/138.0/60.0.
        test_recipe:
          setup:
            - "Jurisdiction OH and Venue V1 (lot_area_sqft 100000, expected_attendance 20001, power_amps_available 1200): usable area is floor(100000*80/100) - ceil(20001*0.5) = 69999 sqft and the amperage ceiling is 1080.0."
            - "Three rides of three different classes: MAJOR footprint 4010 / 300 A, FLAT footprint 2003 / 120 A, KIDDIE footprint 905 / 60 A."
            - "Route R1 DRAFT with one PLANNED stop A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, requires_state_ride_inspection: false, inspection_slot_capacity_per_day: 2, amusement_tax_pct: 6.5, max_consecutive_work_days: 6, housing_permit_required: false, permit_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { jur_oh_c: $.data.id }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_oh_c}", name: "Franklin County Fairgrounds", city: "Columbus", lot_area_sqft: 100000, power_amps_available: 1200, expected_attendance: 20001, housing_pads_available: 4, lot_surface: "GRAVEL" }
              as: PlatformAdmin
              captures: { venue_v1_c: $.data.id }
            - call: "POST /rides"
              payload: { name: "Giant Wheel", ride_class: "MAJOR", footprint_sqft: 4010, power_amps: 300, crew_size_setup: 6, setup_hours: 8, axle_count: 4, requires_state_inspection: false }
              as: PlatformAdmin
              captures: { ride_wheel_c: $.data.id }
            - call: "POST /rides"
              payload: { name: "Tilt-A-Whirl", ride_class: "FLAT", footprint_sqft: 2003, power_amps: 120, crew_size_setup: 4, setup_hours: 5, axle_count: 2, requires_state_inspection: false }
              as: PlatformAdmin
              captures: { ride_tilt_c: $.data.id }
            - call: "POST /rides"
