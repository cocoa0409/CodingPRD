            - call: "POST /franchise/promotions/${promoA_id}/review"
              payload: { decision: "APPROVE" }
              as: BrandAdministrator
              as_user_id: "brand-reviewer-1"
          trigger:
            - call: "POST /franchise/promotions"
              payload: { franchisee_id: "${f1_id}", plan_template_id: "${pt1_id}", code: "LATE6", discount_pct: 0.10, starts_on: "2026-08-06", ends_on: "2026-08-31" }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
            - call: "POST /franchise/promotions"
