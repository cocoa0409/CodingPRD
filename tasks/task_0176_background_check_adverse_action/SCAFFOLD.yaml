scenario: "Background Check & Adverse Action (FCRA): consumer consent, criminal/MVR/education verification, Pre-Adverse Action notice, Final Adverse Action, Ban-the-Box compliance, Salary History ban."
domain_name: "fcra-background-check"
api_prefix: "/fcra"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - scheduled_deferred_actions      # FCRA mandates a 5-business-day cooling-off window between Pre-Adverse and Final Adverse
    - dual_variant_calculation        # strict (federal) vs jurisdictional (state) adjudication score on the same record
    - cascading_side_effects          # Final Adverse Action cascades to lock candidate, freeze order, mint AuditEvent chain
    - derived_field_reconciliation    # Order.composite_decision and Candidate.eligibility_posture must stay consistent
  entity_topology: hybrid
  state_machine_shape: branching     # rework cycles on VerificationItem and AdverseActionFlow + compound aggregate on Order
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential                # AuditEvent links to prior AuditEvent (tamper-evident chain)
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================
entities:
  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Candidate's full legal name."
      - name: email
        type: string
        source: input
        description: "Contact email; must be unique across non-archived candidates."
        constraints: "unique among candidates where archived_at IS NULL"
      - name: residence_jurisdiction
        type: enum
        source: input
        description: "Two-letter state code that selects the JurisdictionPolicy."
        constraints: "Values: CA, NY, IL, TX, FL, MA, WA — each MUST have a JurisdictionPolicy row."
      - name: date_of_birth
        type: string
        source: input
        description: "ISO date YYYY-MM-DD; used for criminal record age cutoff."
      - name: eligibility_posture
        type: enum
        source: computed
        description: "Derived posture controlling whether a new BackgroundCheckOrder may be opened. Values: ELIGIBLE, UNDER_REVIEW, ADVERSE, LOCKED."
        constraints: "ELIGIBLE = no open order; UNDER_REVIEW = at least one order in non-terminal state; ADVERSE = a Final Adverse Action exists within the last 365 days; LOCKED = ADVERSE plus all open orders TERMINATED_ADVERSE."
      - name: salary_history_disclosed
        type: boolean
        source: computed
        description: "TRUE if a salary_history value was ever recorded on this candidate. Once TRUE, all future endpoints that accept salary_history MUST reject with ERR_SALARY_HISTORY_BAN."
        default: false
      - name: archived_at
        type: datetime
        source: computed
        description: "Set when candidate record is archived (soft delete); NULL otherwise."

  - name: ConsentDisclosure
    parent: Candidate
    common_fields: true
    fields:
      - name: candidate_id
        type: string
        source: input
        description: "FK to Candidate."
      - name: disclosure_text_hash
        type: string
        source: input
        description: "SHA-256 of the standalone disclosure document presented to the candidate."
      - name: consent_signature
        type: string
        source: input
        description: "Free-text signature captured at consent time."
      - name: consent_timestamp
        type: datetime
        source: input
        description: "When the candidate signed; MUST be <= server now() and MUST be on or after disclosure_presented_at."
      - name: disclosure_presented_at
        type: datetime
        source: input
        description: "When the standalone disclosure was shown to the candidate."
      - name: revoked_at
        type: datetime
        source: computed
        description: "Set when candidate revokes consent; once set, no new BackgroundCheckOrder may be created."
      - name: status
        type: enum
        source: computed
        description: "ACTIVE, REVOKED, SUPERSEDED."
        default: ACTIVE
        constraints: "Values: ACTIVE, REVOKED, SUPERSEDED. SUPERSEDED is set when a newer ACTIVE ConsentDisclosure is created for the same candidate."

  - name: JurisdictionPolicy
    parent: null
    common_fields: false
    fields:
      - name: jurisdiction_code
        type: enum
        source: input
        description: "Two-letter state code; primary natural key. Values: CA, NY, IL, TX, FL, MA, WA."
        constraints: "unique"
      - name: criminal_lookback_years
        type: integer
        source: input
        description: "Max age in years for misdemeanor convictions that may be reported (FCRA + state rules)."
      - name: salary_history_ban
        type: boolean
        source: input
        description: "If TRUE, asking for prior salary on any endpoint scoped to this jurisdiction is forbidden."
      - name: ban_the_box_stage
        type: enum
        source: input
        description: "Earliest stage at which the order may be opened: POST_OFFER (criminal screen only after conditional offer), POST_INTERVIEW (after first live interview), or PRE_OFFER (no restriction)."
        constraints: "Values: POST_OFFER, POST_INTERVIEW, PRE_OFFER"
      - name: adverse_action_waiting_business_days
        type: integer
        source: input
        description: "Minimum business days that must elapse from Pre-Adverse notice delivery to Final Adverse Action. Federal floor is 5; some states override higher."
        constraints: ">= 5"

  - name: BackgroundCheckOrder
    parent: Candidate
    common_fields: true
    fields:
      - name: candidate_id
        type: string
        source: input
        description: "FK to Candidate."
      - name: consent_disclosure_id
        type: string
        source: input
        description: "FK to ConsentDisclosure; MUST be ACTIVE at order creation; the order pins this id even if a newer consent is recorded later."
      - name: stage_at_order
        type: enum
        source: input
        description: "Employer's hiring stage when the order is opened. Values: PRE_OFFER, POST_INTERVIEW, POST_OFFER. MUST satisfy the candidate's jurisdiction's Ban-the-Box gate."
      - name: requested_packages
        type: array
        source: input
        description: "Subset of {CRIMINAL, MVR, EDUCATION}. Each entry spawns one VerificationItem."
        constraints: "non-empty, no duplicates"
      - name: status
        type: enum
        source: computed
        description: "INTAKE, IN_VERIFICATION, AWAITING_ADJUDICATION, PRE_ADVERSE_ISSUED, AWAITING_FINAL, REWORK, COMPLETED_CLEAR, TERMINATED_ADVERSE, CANCELLED."
        default: INTAKE
      - name: composite_decision
        type: enum
        source: computed
        description: "Derived from VerificationItem results once all items are TERMINAL. Values: PENDING, CLEAR, CONSIDER, INELIGIBLE. PENDING until all items terminal; CLEAR if no item is FAILED; CONSIDER if any item FAILED but adjudication_score below jurisdiction threshold; INELIGIBLE if score at or above threshold."
      - name: opened_by_role
        type: string
        source: system
        description: "Role of the user who opened the order (Recruiter)."
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Adjudicator who made the CONSIDER/INELIGIBLE call; MUST be different from opened_by_user_id (segregation of duties)."

  - name: VerificationItem
    parent: BackgroundCheckOrder
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK to BackgroundCheckOrder."
      - name: kind
        type: enum
        source: input
        description: "CRIMINAL, MVR, EDUCATION."
      - name: status
        type: enum
        source: computed
        description: "QUEUED, IN_PROGRESS, RETURNED, DISPUTED, REWORK_REQUIRED, PASSED, FAILED."
        default: QUEUED
      - name: raw_finding
        type: object
        source: input
        description: "Vendor response payload. For CRIMINAL: {conviction_date, severity in {INFRACTION, MISDEMEANOR, FELONY}}. For MVR: {violations_3yr count, license_status}. For EDUCATION: {institution, claim_verified bool}."
      - name: severity_score
        type: integer
        source: computed
        description: "Integer 0..100 derived from raw_finding per the severity_score calculation; recomputed any time raw_finding changes."
      - name: rework_count
        type: integer
        source: computed
        description: "Number of times this item has cycled through REWORK_REQUIRED. Capped at 2 — a third rework rejection forces the order to TERMINATED_ADVERSE."
        default: 0
      - name: dispute_id
        type: string
        source: computed
        description: "Set when an active Dispute exists for this item; cleared when the dispute resolves."

  - name: Dispute
    parent: VerificationItem
    common_fields: true
    fields:
      - name: verification_item_id
        type: string
        source: input
        description: "FK to VerificationItem; MUST be in RETURNED, REWORK_REQUIRED, or FAILED state."
      - name: candidate_id
        type: string
        source: system
        description: "Denormalized from VerificationItem.order.candidate_id for ownership checks."
      - name: reason_text
        type: string
        source: input
        description: "Free text describing the disputed fact (1..1000 chars)."
      - name: status
        type: enum
        source: computed
        description: "OPEN, UPHELD, OVERTURNED. Initial state OPEN."
        default: OPEN
      - name: resolution_note
        type: string
        source: input
        description: "Adjudicator's note recorded on resolution."

  - name: AdverseActionFlow
    parent: BackgroundCheckOrder
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK to BackgroundCheckOrder; one flow per order; MUST not duplicate."
        constraints: "unique"
      - name: pre_adverse_notice_sent_at
        type: datetime
        source: system
        description: "Server-stamped when the Pre-Adverse notice is delivered."
      - name: waiting_period_business_days
        type: integer
        source: system
        description: "Snapshot of JurisdictionPolicy.adverse_action_waiting_business_days at the moment Pre-Adverse was sent; the flow is pinned to this number even if the policy changes later."
      - name: earliest_final_eligible_at
        type: datetime
        source: computed
        description: "Computed by the cooling_off_period calculation; final action is forbidden before this timestamp."
      - name: final_adverse_action_at
        type: datetime
        source: system
        description: "Server-stamped when Final Adverse Action is issued; MUST be >= earliest_final_eligible_at."
      - name: notification_status
        type: enum
        source: computed
        description: "Parallel dimension to procedural_status. Values: PENDING_DELIVERY, PRE_DELIVERED, FINAL_DELIVERED."
        default: PENDING_DELIVERY
      - name: procedural_status
        type: enum
        source: computed
        description: "Parallel dimension. Values: PRE_AWAITING_DISPUTE_WINDOW, DISPUTE_PAUSED, READY_FOR_FINAL, FINALIZED, ABANDONED. Evolves independently of notification_status until both reach a terminal pair."
        default: PRE_AWAITING_DISPUTE_WINDOW

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - name: event_type
        type: enum
        source: system
        description: "CONSENT_RECORDED, CONSENT_REVOKED, ORDER_OPENED, ITEM_RETURNED, ITEM_FAILED, DISPUTE_OPENED, DISPUTE_RESOLVED, PRE_ADVERSE_SENT, FINAL_ADVERSE_ISSUED, ORDER_CANCELLED, REWORK_REQUESTED."
      - name: subject_entity
        type: enum
        source: system
        description: "Candidate, BackgroundCheckOrder, VerificationItem, Dispute, AdverseActionFlow, ConsentDisclosure."
      - name: subject_id
        type: string
        source: system
        description: "id of the entity above."
      - name: actor_role
        type: string
        source: system
        description: "Acting role (Recruiter, Adjudicator, Candidate, system)."
      - name: actor_user_id
        type: string
        source: system
        description: "X-User-ID at the time of the event."
      - name: previous_event_id
        type: string
        source: system
        description: "Self-referential FK to the prior AuditEvent for the same subject_id, forming a tamper-evident chain. NULL only for the first event on a subject."
      - name: payload_hash
        type: string
        source: system
        description: "SHA-256 over (subject_id, event_type, actor_user_id, created_at, previous_event_id)."

# ============================================================================
# §1.2 State Machine Table
# ============================================================================
state_machines:
  - entity: BackgroundCheckOrder
    initial_state: INTAKE
    terminal_states: [COMPLETED_CLEAR, TERMINATED_ADVERSE, CANCELLED]
    transitions:
      - from: INTAKE
        to: IN_VERIFICATION
        trigger: "POST /fcra/orders/{id}/start-verification"
        actor: Recruiter
        preconditions:
          - "ConsentDisclosure.status == ACTIVE and Candidate.eligibility_posture != LOCKED"
          - "All requested_packages spawned VerificationItems with status=QUEUED"
        side_effects:
          - "Each VerificationItem.status: QUEUED -> IN_PROGRESS"
          - "Candidate.eligibility_posture recomputed to UNDER_REVIEW"
          - "AuditEvent(ORDER_OPENED) appended (chained to ConsentDisclosure's last event)"

      - from: IN_VERIFICATION
        to: AWAITING_ADJUDICATION
        trigger: "system: every VerificationItem reached RETURNED"
        actor: system
        preconditions:
          - "ALL VerificationItem(order_id=this).status IN {RETURNED, PASSED, FAILED}"
        side_effects:
          - "composite_decision recomputed via adjudication_composite_decision"
          - "If composite_decision == CLEAR -> auto-transition to COMPLETED_CLEAR (chain link, see below)"

      - from: AWAITING_ADJUDICATION
        to: COMPLETED_CLEAR
        trigger: "system: composite_decision == CLEAR"
        actor: system
        preconditions:
          - "composite_decision == CLEAR"
        side_effects:
          - "Candidate.eligibility_posture recomputed to ELIGIBLE"
          - "AuditEvent(ORDER_OPENED?->cleared) appended; no AdverseActionFlow created"

      - from: AWAITING_ADJUDICATION
        to: PRE_ADVERSE_ISSUED
        trigger: "POST /fcra/orders/{id}/pre-adverse"
        actor: Adjudicator
        preconditions:
          - "composite_decision IN {CONSIDER, INELIGIBLE}"
          - "actor.user_id != BackgroundCheckOrder.opened_by_user_id (segregation of duties)"
          - "No AdverseActionFlow exists for this order"
        side_effects:
          - "AdverseActionFlow created with pre_adverse_notice_sent_at = now(), notification_status=PRE_DELIVERED, procedural_status=PRE_AWAITING_DISPUTE_WINDOW"
          - "earliest_final_eligible_at computed via cooling_off_period"
          - "BackgroundCheckOrder.adjudicated_by_user_id = X-User-ID"
          - "AuditEvent(PRE_ADVERSE_SENT) appended chained to ITEM_FAILED or ITEM_RETURNED events"

      - from: PRE_ADVERSE_ISSUED
        to: AWAITING_FINAL
        trigger: "system: now() >= earliest_final_eligible_at AND no OPEN Dispute on any order item"
        actor: system
        preconditions:
          - "AdverseActionFlow.procedural_status == READY_FOR_FINAL after sweep"
        side_effects:
          - "no field changes other than status; ready for the Adjudicator to issue Final"

      - from: PRE_ADVERSE_ISSUED
        to: REWORK
        trigger: "POST /fcra/orders/{id}/request-rework"
        actor: Adjudicator
        preconditions:
          - "Adjudicator decides candidate's dispute or new evidence warrants re-verification"
          - "At least one VerificationItem has rework_count < 2"
        side_effects:
          - "Each eligible VerificationItem.status -> REWORK_REQUIRED and rework_count += 1"
          - "AdverseActionFlow.procedural_status -> DISPUTE_PAUSED"
          - "AuditEvent(REWORK_REQUESTED) appended"

      - from: REWORK
        to: IN_VERIFICATION
        trigger: "POST /fcra/orders/{id}/resume-verification"
        actor: Adjudicator
        preconditions:
          - "All REWORK_REQUIRED items have refreshed raw_finding"
        side_effects:
          - "Each REWORK_REQUIRED -> IN_PROGRESS"
          - "AdverseActionFlow.procedural_status remains DISPUTE_PAUSED until items return"

      - from: AWAITING_FINAL
        to: TERMINATED_ADVERSE
        trigger: "POST /fcra/orders/{id}/final-adverse"
        actor: Adjudicator
        preconditions:
          - "now() >= AdverseActionFlow.earliest_final_eligible_at"
          - "No OPEN Dispute exists on any VerificationItem(order_id=this)"
          - "actor.user_id == BackgroundCheckOrder.adjudicated_by_user_id (same Adjudicator who issued Pre-Adverse)"
        side_effects:
          - "AdverseActionFlow.final_adverse_action_at = now(), notification_status=FINAL_DELIVERED, procedural_status=FINALIZED"
          - "Candidate.eligibility_posture recomputed to ADVERSE then to LOCKED if all sibling orders are terminal"
          - "AuditEvent(FINAL_ADVERSE_ISSUED) appended"
          - "All non-terminal sibling orders for this candidate -> CANCELLED (cascade)"

      - from: INTAKE
        to: CANCELLED
        trigger: "POST /fcra/orders/{id}/cancel"
        actor: Recruiter
        preconditions:
          - "ConsentDisclosure not yet exercised in verification"
        side_effects:
          - "VerificationItems(QUEUED) -> archived (status remains but order_id detaches via cancelled marker)"
          - "AuditEvent(ORDER_CANCELLED) appended"

      - from: IN_VERIFICATION
        to: CANCELLED
        trigger: "POST /fcra/orders/{id}/cancel"
        actor: Recruiter
        preconditions:
          - "Candidate revokes consent (ConsentDisclosure.status=REVOKED) OR no items have been adjudicated"
        side_effects:
          - "VerificationItems(IN_PROGRESS) -> CANCELLED via marker; severity_score frozen"
          - "Candidate.eligibility_posture recomputed (back to ELIGIBLE if no other open orders)"
          - "AuditEvent(ORDER_CANCELLED) appended"

  - entity: VerificationItem
    initial_state: QUEUED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: QUEUED
        to: IN_PROGRESS
        trigger: "system: parent order transitions INTAKE -> IN_VERIFICATION"
        actor: system
        preconditions: ["parent order.status == IN_VERIFICATION"]
        side_effects: []

      - from: IN_PROGRESS
        to: RETURNED
        trigger: "POST /fcra/verification-items/{id}/return"
        actor: Verifier
        preconditions:
          - "raw_finding payload present and well-formed for the item.kind"
        side_effects:
          - "severity_score recomputed via verification_severity_score"
          - "AuditEvent(ITEM_RETURNED) appended"
          - "If all sibling items have status IN {RETURNED, PASSED, FAILED}, trigger parent IN_VERIFICATION -> AWAITING_ADJUDICATION (cascade hop 1)"

      - from: RETURNED
        to: PASSED
        trigger: "system: severity_score < jurisdiction_consider_floor (=15) on adjudication"
        actor: system
        preconditions: ["parent.status == AWAITING_ADJUDICATION"]
        side_effects: ["no field changes beyond status"]

      - from: RETURNED
        to: FAILED
        trigger: "system: severity_score >= jurisdiction_consider_floor (=15) at adjudication"
        actor: system
        preconditions: ["parent.status == AWAITING_ADJUDICATION"]
        side_effects:
          - "AuditEvent(ITEM_FAILED) appended"

      - from: RETURNED
        to: DISPUTED
        trigger: "POST /fcra/disputes (candidate opens dispute)"
        actor: Candidate
        preconditions: ["item.status IN {RETURNED, FAILED, REWORK_REQUIRED}"]
        side_effects:
          - "Dispute(status=OPEN) created"
          - "AdverseActionFlow.procedural_status -> DISPUTE_PAUSED (if flow exists)"

      - from: DISPUTED
        to: REWORK_REQUIRED
        trigger: "POST /fcra/disputes/{id}/resolve with status=OVERTURNED"
        actor: Adjudicator
        preconditions:
          - "item.rework_count < 2"
        side_effects:
          - "Dispute.status -> OVERTURNED"
          - "VerificationItem.rework_count += 1"
          - "If rework_count would exceed 2, do not transition; instead force parent order to TERMINATED_ADVERSE via separate trigger"

      - from: DISPUTED
        to: FAILED
        trigger: "POST /fcra/disputes/{id}/resolve with status=UPHELD"
        actor: Adjudicator
        preconditions: []
        side_effects:
          - "Dispute.status -> UPHELD"
          - "If AdverseActionFlow exists and no other OPEN Dispute remains, procedural_status -> PRE_AWAITING_DISPUTE_WINDOW (so the cooling-off clock can be re-evaluated)"

      - from: REWORK_REQUIRED
        to: IN_PROGRESS
        trigger: "POST /fcra/orders/{id}/resume-verification (cascade from parent)"
        actor: Adjudicator
        preconditions: []
        side_effects: ["clear dispute_id"]

  - entity: AdverseActionFlow
    initial_state: PRE_AWAITING_DISPUTE_WINDOW
    terminal_states: [FINALIZED, ABANDONED]
    transitions:
      - from: PRE_AWAITING_DISPUTE_WINDOW
        to: DISPUTE_PAUSED
        trigger: "system: a Dispute is OPENED on a VerificationItem of this order"
        actor: system
        preconditions: []
        side_effects:
          - "Cooling-off clock pauses; earliest_final_eligible_at recomputed when dispute resolves"

      - from: DISPUTE_PAUSED
        to: PRE_AWAITING_DISPUTE_WINDOW
        trigger: "system: last OPEN Dispute resolves"
        actor: system
        preconditions: ["No OPEN Dispute on any VerificationItem of this order"]
        side_effects:
          - "earliest_final_eligible_at recomputed via cooling_off_period using elapsed_business_days at the time of pause"

      - from: PRE_AWAITING_DISPUTE_WINDOW
        to: READY_FOR_FINAL
        trigger: "POST /fcra/_clock/advance until now() >= earliest_final_eligible_at; then POST /fcra/_sweep/run"
        actor: system
        preconditions:
          - "now() >= earliest_final_eligible_at"
          - "No OPEN Dispute"
        side_effects:
          - "parent BackgroundCheckOrder.status PRE_ADVERSE_ISSUED -> AWAITING_FINAL (cascade hop 1)"

      - from: READY_FOR_FINAL
        to: FINALIZED
        trigger: "POST /fcra/orders/{id}/final-adverse"
        actor: Adjudicator
        preconditions: []
        side_effects:
          - "see BackgroundCheckOrder AWAITING_FINAL -> TERMINATED_ADVERSE for the full side-effect chain"

      - from: PRE_AWAITING_DISPUTE_WINDOW
        to: ABANDONED
        trigger: "POST /fcra/orders/{id}/cancel by Recruiter while in PRE_ADVERSE_ISSUED"
        actor: Recruiter
        preconditions: ["order is in PRE_ADVERSE_ISSUED with no OPEN Dispute"]
        side_effects:
          - "parent order -> CANCELLED"

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [UPHELD, OVERTURNED]
    transitions:
      - from: OPEN
        to: UPHELD
        trigger: "POST /fcra/disputes/{id}/resolve {status: UPHELD}"
        actor: Adjudicator
        preconditions:
          - "resolver.user_id != VerificationItem.order.opened_by_user_id (segregation of duties)"
        side_effects:
          - "VerificationItem -> FAILED"
          - "see VerificationItem DISPUTED -> FAILED"

      - from: OPEN
        to: OVERTURNED
        trigger: "POST /fcra/disputes/{id}/resolve {status: OVERTURNED}"
        actor: Adjudicator
        preconditions: []
        side_effects:
          - "VerificationItem -> REWORK_REQUIRED (or, if rework_count already at cap, parent order -> TERMINATED_ADVERSE)"

# ============================================================================
# §1.2.1 Concurrency Rules
# ============================================================================
concurrency_rules:
  - scenario: "Two Adjudicators issue Pre-Adverse on the same order simultaneously"
    guarantee: "Exactly one AdverseActionFlow per order; the second pre-adverse call loses"
    error_id: ERR_ADVERSE_FLOW_ALREADY_EXISTS
    http_status: 409
    serialization: "First-writer-wins on AdverseActionFlow.order_id uniqueness"

  - scenario: "Adjudicator issues Final Adverse while Candidate opens a Dispute on the same order"
    guarantee: "If Dispute is created first (status=OPEN), Final Adverse Action is rejected; if Final Adverse is committed first, the late Dispute is rejected"
    error_id: ERR_OPEN_DISPUTE_BLOCKS_FINAL
    http_status: 409
    serialization: "First-writer-wins on (order_id, decision boundary)"

  - scenario: "Adjudicator issues Final Adverse while Candidate opens a Dispute on the same order, but order has already advanced"
    guarantee: "If Final Adverse committed first, the late Dispute is rejected because parent order is terminal"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on order.status"

  - scenario: "Recruiter cancels order while system auto-transitions to AWAITING_ADJUDICATION"
    guarantee: "Whichever commits first wins; the loser sees ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on order.status field"

  - scenario: "Two Candidates with the same email register concurrently"
    guarantee: "Candidate.email uniqueness enforced; the loser is rejected"
    error_id: ERR_CANDIDATE_EMAIL_TAKEN
    http_status: 409
    serialization: "First-writer-wins on email index"

  - scenario: "OCC: two PATCHes on the same Candidate with stale version"
    guarantee: "Stale version is rejected"
    error_id: ERR_STALE_VERSION
    http_status: 409
    serialization: "Version-based optimistic concurrency control"

# ============================================================================
# §1.3 Calculation Rules Table
# ============================================================================
calculations:
  - name: verification_severity_score
    trigger: "VerificationItem state IN_PROGRESS -> RETURNED, or any update to raw_finding while item is RETURNED"
    algorithm: weighted_scoring
    formula: |
      # Per item.kind, compute integer score in 0..100. Each branch is order-pinned.

      if item.kind == CRIMINAL:
          age_years = floor( (now() - raw_finding.conviction_date) / 365 )
          if age_years > jurisdiction.criminal_lookback_years:
              base = 0    # outside lookback window — DO NOT report
          else:
              base = { INFRACTION: 5, MISDEMEANOR: 25, FELONY: 70 }[raw_finding.severity]
          score = min(base, 100)

      elif item.kind == MVR:
          v = raw_finding.violations_3yr   # integer
          # Tiered: 0 -> 0, 1 -> 10, 2 -> 25, 3+ -> 50; +20 if license_status == SUSPENDED.
          tier = 0 if v == 0 else (10 if v == 1 else (25 if v == 2 else 50))
          suspended_bonus = 20 if raw_finding.license_status == "SUSPENDED" else 0
          score = min(tier + suspended_bonus, 100)

      elif item.kind == EDUCATION:
          score = 0 if raw_finding.claim_verified else 40
    input_set: "Single VerificationItem.raw_finding plus its candidate's JurisdictionPolicy.criminal_lookback_years (for CRIMINAL kind only)."
    constants:
      INFRACTION_SCORE: 5
      MISDEMEANOR_SCORE: 25
      FELONY_SCORE: 70
      MVR_TIER_BREAKPOINTS: [0, 1, 2, 3]
      MVR_TIER_SCORES: [0, 10, 25, 50]
      LICENSE_SUSPENDED_BONUS: 20
      EDUCATION_UNVERIFIED_PENALTY: 40
    precision: "Integer; intermediate min/max evaluated left-to-right"

  - name: adjudication_composite_decision
    trigger: "BackgroundCheckOrder transitions IN_VERIFICATION -> AWAITING_ADJUDICATION; also recomputed on REWORK -> IN_VERIFICATION -> AWAITING_ADJUDICATION cycle"
    algorithm: tiered_pricing
    formula: |
      # Two variants share the same input set but produce different composite_decision.
      items = VerificationItem WHERE order_id = this.id AND status IN {RETURNED, PASSED, FAILED}
      total_score = sum(item.severity_score for item in items)

      # Variant FEDERAL (strict): the per-item CONSIDER threshold is fixed at 15; failure tally is the metric.
      # Variant JURISDICTIONAL: per-state threshold; aggregate score determines decision; passed items still contribute.
      ...
    input_set: "All VerificationItems on this order with status IN {RETURNED, PASSED, FAILED}. Items in QUEUED/IN_PROGRESS/DISPUTED are excluded."
    constants:
      FEDERAL_CONSIDER_THRESHOLD: 15
      FEDERAL_INELIGIBLE_FAIL_COUNT: 2
      JURISDICTIONAL_AGGREGATE_CONSIDER: 30
      JURISDICTIONAL_AGGREGATE_INELIGIBLE_BY_STATE:
        CA: 80
        NY: 75
        IL: 70
        TX: 60
        FL: 55
        MA: 80
        WA: 70
    precision: "Integer aggregate; comparison uses >= for INELIGIBLE threshold and > for CONSIDER threshold (boundary semantics)"
    variants:
      - name: federal_strict
        when: "stage_at_order == PRE_OFFER (Ban-the-Box does not apply); regulator audit context"
        difference: |
          per_item_consider = item.severity_score >= FEDERAL_CONSIDER_THRESHOLD
          fail_count = count(items where per_item_consider)
          if fail_count == 0:                      composite_decision = CLEAR
          elif fail_count < FEDERAL_INELIGIBLE_FAIL_COUNT:  composite_decision = CONSIDER
          else:                                    composite_decision = INELIGIBLE
      - name: jurisdictional_aggregate
        when: "default — applied unless an audit explicitly switches to federal_strict"
        difference: |
          aggregate = total_score
          ineligible_cut = JURISDICTIONAL_AGGREGATE_INELIGIBLE_BY_STATE[candidate.residence_jurisdiction]
          if aggregate <= JURISDICTIONAL_AGGREGATE_CONSIDER:                       composite_decision = CLEAR
          elif aggregate < ineligible_cut:                                         composite_decision = CONSIDER
          else:                                                                    composite_decision = INELIGIBLE
        # Same items, two different decisions are possible (e.g., a CRIMINAL=25 + MVR=10 case is CLEAR under
        # jurisdictional_aggregate (total=35 -- wait, 35 > 30, so CONSIDER), but CONSIDER under federal_strict
        # (one item >= 15). Documented as the canonical dual-variant divergence.

  - name: cooling_off_period
    trigger: "AdverseActionFlow created (PRE_AWAITING_DISPUTE_WINDOW) or DISPUTE_PAUSED -> PRE_AWAITING_DISPUTE_WINDOW (clock resumes)"
    algorithm: chronological
    formula: |
      # The scaffold pins the JURISDICTIONAL variant as the canonical computation used by the engine.
      # The FEDERAL_STRICT variant is exposed for audit reconstruction; it produces different earliest_final_eligible_at.
      required_business_days = max(5, jurisdiction.adverse_action_waiting_business_days)

      elapsed_business_days = count of business days between pre_adverse_notice_sent_at (exclusive)
                              and (the moment we last entered DISPUTE_PAUSED, or now() if never paused)

      remaining = required_business_days - elapsed_business_days
      earliest_final_eligible_at = add_business_days(now(), remaining)   # business days, exclusive of start day
    input_set: "AdverseActionFlow.pre_adverse_notice_sent_at, AdverseActionFlow.waiting_period_business_days (snapshot), elapsed_business_days computed from pause/resume events on this flow."
    constants:
      FEDERAL_MIN_BUSINESS_DAYS: 5
      BUSINESS_DAYS_PER_WEEK: 5     # Mon-Fri; weekends never count
    precision: "Business-day arithmetic excludes Saturdays and Sundays; pre_adverse_notice_sent_at counts as day 0 (exclusive); the candidate has full business days to dispute. Variant divergence: a CA candidate (waiting=8) at the same send time produces a 3-business-day-later earliest_final_eligible_at than the federal_strict variant on identical inputs."
    variants:
      - name: federal_strict
        when: "Used for federal-only audit reconstruction; ignores state override even if higher."
        difference: |
          required_business_days = FEDERAL_MIN_BUSINESS_DAYS   # always 5, regardless of jurisdiction
          # Same elapsed/remaining/add_business_days arithmetic; result is earlier than jurisdictional whenever
          # jurisdiction.adverse_action_waiting_business_days > 5.
      - name: jurisdictional
        when: "Default — used by the engine for actual gating of POST /fcra/orders/{id}/final-adverse."
        difference: |
          required_business_days = max(5, jurisdiction.adverse_action_waiting_business_days)
          # When jurisdiction.adverse_action_waiting_business_days > 5, this variant yields a later
          # earliest_final_eligible_at than federal_strict. For CA (waiting=8), the gap is 3 business days.

  - name: criminal_record_age_cutoff
    trigger: "VerificationItem.kind == CRIMINAL receives raw_finding"
    algorithm: threshold
    formula: |
      # Determines whether the conviction is even reportable. Two boundary points are pinned.
      age_years_exact = (now() - raw_finding.conviction_date) / 365.25
      # Inclusive at the lookback boundary: age <= criminal_lookback_years is reportable; age > is not.
      reportable = age_years_exact <= jurisdiction.criminal_lookback_years
    input_set: "Single conviction_date + jurisdiction.criminal_lookback_years."
    constants:
      DAYS_PER_YEAR: 365.25
    precision: "Floating age in years (365.25 days/year); comparison <=; ties go to reportable. If reportable == False, severity_score for CRIMINAL forces to 0 regardless of severity."

  - name: eligibility_posture_recompute
    trigger: "Any change to a Candidate's child BackgroundCheckOrder.status or AdverseActionFlow.final_adverse_action_at"
    algorithm: aggregation
    formula: |
      open_orders = count(orders where candidate_id = this.id AND status NOT IN {COMPLETED_CLEAR, TERMINATED_ADVERSE, CANCELLED})
      recent_adverse = exists(orders where candidate_id = this.id AND status = TERMINATED_ADVERSE
                              AND (now() - adverse_flow.final_adverse_action_at) <= 365 days)

      if open_orders > 0:
          posture = UNDER_REVIEW
      elif recent_adverse:
          posture = LOCKED        # final adverse within last year locks new orders
      elif any TERMINATED_ADVERSE order exists ever:
          posture = ADVERSE       # historical adverse but outside 365-day window
      else:
          posture = ELIGIBLE
    input_set: "All BackgroundCheckOrder rows for this candidate plus their linked AdverseActionFlow."
    constants:
      ADVERSE_LOCK_WINDOW_DAYS: 365
    precision: "Day-resolution arithmetic; 366th day no longer locks"

# ============================================================================
# §1.4 Validation Rules Table (Ordered)
# ============================================================================
validations:
  # 1. Authentication
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: all

  # 2. Authorization
  - priority: 2
    category: auth
    check: "Role permitted for endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  # 3. Existence (left-to-right path)
  - priority: 3
    category: existence
    check: "Referenced Candidate exists and archived_at IS NULL"
    error_id: ERR_CANDIDATE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with {candidateId}"

  - priority: 4
    category: existence
    check: "Referenced BackgroundCheckOrder exists"
    error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with {orderId}"

  - priority: 5
    category: existence
    check: "Referenced VerificationItem / Dispute / ConsentDisclosure exists"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with {itemId|disputeId|consentId}"

  # 6. State preconditions
  - priority: 6
    category: state
    check: "Target resource is in a state where this operation is legal per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  # 7. Business — safety/compliance FIRST (FCRA + state law)
  - priority: 7
    category: business_safety
    check: "Ban-the-Box: stage_at_order MUST satisfy jurisdiction.ban_the_box_stage gate (PRE_OFFER < POST_INTERVIEW < POST_OFFER ordering)"
    error_id: ERR_BAN_THE_BOX_VIOLATION
    http_status: 422
    applies_to: "POST /fcra/orders"

  - priority: 8
    category: business_safety
    check: "Salary History Ban: if jurisdiction.salary_history_ban == TRUE, no request body may contain a salary_history field, AND Candidate.salary_history_disclosed must remain false"
    error_id: ERR_SALARY_HISTORY_BAN
    http_status: 422
    applies_to: "POST /fcra/candidates, POST /fcra/orders, PATCH /fcra/candidates/{id}"

  - priority: 9
    category: business_safety
    check: "Consent: ConsentDisclosure for this candidate exists with status=ACTIVE; consent_signature non-empty; disclosure_presented_at <= consent_timestamp <= now()"
    error_id: ERR_CONSENT_INVALID
    http_status: 422
    applies_to: "POST /fcra/orders"

  - priority: 10
    category: business_safety
    check: "Segregation of Duties: Adjudicator user_id MUST differ from BackgroundCheckOrder.opened_by_user_id"
    error_id: ERR_SOD_VIOLATION
    http_status: 422
    applies_to: "POST /fcra/orders/{id}/pre-adverse, POST /fcra/orders/{id}/final-adverse, POST /fcra/disputes/{id}/resolve"

  - priority: 11
    category: business_safety
    check: "Cooling-Off: now() >= AdverseActionFlow.earliest_final_eligible_at"
    error_id: ERR_COOLING_OFF_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /fcra/orders/{id}/final-adverse"

  - priority: 12
    category: business_safety
    check: "Open Dispute Blocks Final: no Dispute(status=OPEN) on any VerificationItem of this order"
    error_id: ERR_OPEN_DISPUTE_BLOCKS_FINAL
    http_status: 422
    applies_to: "POST /fcra/orders/{id}/final-adverse"

  # 13. Business — referential
  - priority: 13
    category: business_referential
    check: "consent_disclosure_id MUST reference a ConsentDisclosure whose candidate_id matches the order's candidate_id"
    error_id: ERR_CONSENT_CANDIDATE_MISMATCH
    http_status: 422
    applies_to: "POST /fcra/orders"

  - priority: 14
    category: business_referential
    check: "Dispute.verification_item_id MUST reference an item belonging to an order owned by the disputing Candidate"
    error_id: ERR_DISPUTE_NOT_OWNED
    http_status: 403
    applies_to: "POST /fcra/disputes"

  # 15. Business — constraint
  - priority: 15
    category: business_constraint
    check: "requested_packages: non-empty, no duplicates, subset of {CRIMINAL, MVR, EDUCATION}"
    error_id: ERR_PACKAGE_SET_INVALID
    http_status: 422
    applies_to: "POST /fcra/orders"

  - priority: 16
    category: business_constraint
    check: "Candidate.eligibility_posture MUST be ELIGIBLE at order creation (not LOCKED, not UNDER_REVIEW)"
    error_id: ERR_CANDIDATE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /fcra/orders"

  - priority: 17
    category: business_constraint
    check: "Rework cap: VerificationItem.rework_count MUST NOT exceed 2"
    error_id: ERR_REWORK_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /fcra/orders/{id}/request-rework"

  # 18. Business — temporal
  - priority: 18
    category: business_temporal
    check: "consent_timestamp <= now() AND disclosure_presented_at <= consent_timestamp"
    error_id: ERR_CONSENT_TIMESTAMP_INVALID
    http_status: 422
    applies_to: "POST /fcra/candidates/{id}/consent"

  # 19. Business — fiscal/quota analogue (audit chain integrity)
  - priority: 19
    category: business_constraint
    check: "AuditEvent.previous_event_id MUST equal the id of the most recent AuditEvent for the same subject_id, or NULL if first"
    error_id: ERR_AUDIT_CHAIN_BROKEN
    http_status: 422
    applies_to: "internal — all AuditEvent inserts"

  # 20. OCC
  - priority: 20
    category: state
    check: "If version supplied, MUST match current row version"
    error_id: ERR_STALE_VERSION
    http_status: 409
    applies_to: "all PATCH endpoints"

# ============================================================================
# §1.5 API Endpoint Table
# ============================================================================
endpoints:
  # ---- Candidates ----
  - method: POST
    path: "/fcra/candidates"
    description: "Register a new candidate. Forbids salary_history in body if jurisdiction has ban."
    roles: [Recruiter]
    code: 201
    input: ["full_name", "email", "residence_jurisdiction", "date_of_birth", "salary_history?"]
    output: Candidate
    side_effects: ["Candidate.eligibility_posture = ELIGIBLE; AuditEvent(CONSENT_RECORDED) NOT yet (consent is separate)."]

  - method: GET
    path: "/fcra/candidates/{candidateId}"
    description: "Read a candidate."
    roles: [Recruiter, Adjudicator, Candidate]
    code: 200
    input: []
    output: Candidate
    side_effects: []

  - method: PATCH
    path: "/fcra/candidates/{candidateId}"
    description: "Update mutable fields; salary_history field is forbidden if jurisdiction has ban."
    roles: [Recruiter]
    code: 200
    input: ["full_name?", "email?", "version?"]
    output: Candidate
    side_effects: []

  - method: GET
    path: "/fcra/candidates"
    description: "List candidates with pagination + filter by eligibility_posture."
    roles: [Recruiter, Adjudicator]
    code: 200
    input: ["limit?", "offset?", "eligibility_posture?"]
    output: Candidate[]
    side_effects: []

  # ---- Consent ----
  - method: POST
    path: "/fcra/candidates/{candidateId}/consent"
    description: "Record a ConsentDisclosure. Supersedes any existing ACTIVE consent."
    roles: [Recruiter, Candidate]
    code: 201
    input: [disclosure_text_hash, consent_signature, consent_timestamp, disclosure_presented_at]
    output: ConsentDisclosure
    side_effects: ["Previous ACTIVE consent (if any) -> SUPERSEDED; AuditEvent(CONSENT_RECORDED) appended"]

  - method: POST
    path: "/fcra/candidates/{candidateId}/consent/revoke"
    description: "Candidate revokes consent. ACTIVE consent -> REVOKED."
    roles: [Candidate]
    code: 200
    input: []
    output: ConsentDisclosure
    side_effects: ["ConsentDisclosure.status -> REVOKED; revoked_at = now(); AuditEvent(CONSENT_REVOKED) appended"]

  # ---- Jurisdiction Policies (config) ----
  - method: GET
    path: "/fcra/jurisdiction-policies"
    description: "List all configured jurisdiction policies."
    roles: [Recruiter, Adjudicator]
    code: 200
    input: []
    output: JurisdictionPolicy[]
    side_effects: []

  - method: PUT
    path: "/fcra/jurisdiction-policies/{code}"
    description: "Upsert a jurisdiction policy (admin-only test seed)."
    roles: [PlatformAdmin]
    code: 200
    input: [criminal_lookback_years, salary_history_ban, ban_the_box_stage, adverse_action_waiting_business_days]
    output: JurisdictionPolicy
    side_effects: []

  # ---- Background Check Orders ----
  - method: POST
    path: "/fcra/orders"
    description: "Open a new BackgroundCheckOrder. Validates Ban-the-Box, consent, eligibility, salary-history."
    roles: [Recruiter]
    code: 201
    input: [candidate_id, consent_disclosure_id, stage_at_order, requested_packages]
    output: BackgroundCheckOrder
    side_effects: ["Spawns one VerificationItem per requested package (QUEUED); Candidate.eligibility_posture -> UNDER_REVIEW; AuditEvent(ORDER_OPENED) appended"]

  - method: GET
    path: "/fcra/orders/{orderId}"
    description: "Read an order including computed composite_decision."
    roles: [Recruiter, Adjudicator, Candidate]
    code: 200
    input: []
    output: BackgroundCheckOrder
    side_effects: []

  - method: GET
    path: "/fcra/orders"
    description: "List orders with pagination + filter by status or candidate_id."
    roles: [Recruiter, Adjudicator]
    code: 200
    input: ["limit?", "offset?", "status?", "candidate_id?"]
    output: BackgroundCheckOrder[]
    side_effects: []

  - method: POST
    path: "/fcra/orders/{orderId}/start-verification"
    description: "Move INTAKE -> IN_VERIFICATION; items go QUEUED -> IN_PROGRESS."
    roles: [Recruiter]
    code: 200
    input: []
    output: BackgroundCheckOrder
    side_effects: ["see §1.2 BackgroundCheckOrder INTAKE -> IN_VERIFICATION"]

  - method: POST
    path: "/fcra/orders/{orderId}/cancel"
    description: "Cancel an order in INTAKE, IN_VERIFICATION, or PRE_ADVERSE_ISSUED."
    roles: [Recruiter]
    code: 200
    input: []
    output: BackgroundCheckOrder
    side_effects: ["see §1.2"]

  - method: POST
    path: "/fcra/orders/{orderId}/pre-adverse"
    description: "Adjudicator issues Pre-Adverse Action notice. SoD: must differ from order opener."
    roles: [Adjudicator]
    code: 200
    input: []
    output: AdverseActionFlow
    side_effects: ["see §1.2; AdverseActionFlow created"]

  - method: POST
    path: "/fcra/orders/{orderId}/final-adverse"
    description: "Adjudicator issues Final Adverse Action. Requires cooling-off elapsed AND no open dispute."
    roles: [Adjudicator]
    code: 200
    input: []
    output: BackgroundCheckOrder
    side_effects: ["AdverseActionFlow.final_adverse_action_at = now(); cascade cancels other open orders; AuditEvent(FINAL_ADVERSE_ISSUED) appended"]

  - method: POST
    path: "/fcra/orders/{orderId}/request-rework"
    description: "Adjudicator sends the order back for re-verification; bumps rework_count."
    roles: [Adjudicator]
    code: 200
    input: [target_item_ids]
    output: BackgroundCheckOrder
    side_effects: ["see §1.2"]

  - method: POST
    path: "/fcra/orders/{orderId}/resume-verification"
    description: "After rework, items go REWORK_REQUIRED -> IN_PROGRESS."
    roles: [Adjudicator]
    code: 200
    input: []
    output: BackgroundCheckOrder
    side_effects: []

  - method: GET
    path: "/fcra/orders/{orderId}/audit-trail"
    description: "Return the AuditEvent chain for this order (FCRA evidence)."
    roles: [Recruiter, Adjudicator]
    code: 200
    input: []
    output: AuditEvent[]
    side_effects: []

  # ---- VerificationItems ----
  - method: GET
    path: "/fcra/verification-items/{itemId}"
    description: "Read a verification item."
    roles: [Recruiter, Adjudicator, Candidate]
    code: 200
    input: []
    output: VerificationItem
    side_effects: []

  - method: POST
    path: "/fcra/verification-items/{itemId}/return"
    description: "Vendor returns the verification payload."
    roles: [Verifier]
    code: 200
    input: [raw_finding]
    output: VerificationItem
    side_effects: ["see §1.2 VerificationItem IN_PROGRESS -> RETURNED; severity_score recomputed; may cascade parent to AWAITING_ADJUDICATION"]

  # ---- Disputes ----
  - method: POST
    path: "/fcra/disputes"
    description: "Candidate opens a dispute on a verification item."
    roles: [Candidate]
    code: 201
    input: [verification_item_id, reason_text]
    output: Dispute
    side_effects: ["item.dispute_id set; if AdverseActionFlow exists, procedural_status -> DISPUTE_PAUSED"]

  - method: GET
    path: "/fcra/disputes/{disputeId}"
    description: "Read a dispute."
    roles: [Candidate, Adjudicator]
    code: 200
    input: []
    output: Dispute
    side_effects: []

  - method: POST
    path: "/fcra/disputes/{disputeId}/resolve"
    description: "Adjudicator resolves dispute as UPHELD (denies dispute -> FAILED) or OVERTURNED (grants -> REWORK_REQUIRED)."
    roles: [Adjudicator]
    code: 200
    input: [status, resolution_note]
    output: Dispute
    side_effects: ["see §1.2 Dispute transitions"]

  # ---- Test-driving endpoints ----
  - method: POST
    path: "/fcra/_clock/advance"
    description: "Test-only: advance the server clock forward by N seconds (business-day arithmetic uses this clock)."
    roles: [PlatformAdmin]
    code: 200
    input: [seconds]
    output: null
    side_effects: ["Server now() advances; no automatic state transitions until /_sweep/run is called"]

  - method: POST
    path: "/fcra/_sweep/run"
    description: "Test-only: run the periodic sweep. Promotes orders whose cooling-off has elapsed (PRE_ADVERSE_ISSUED -> AWAITING_FINAL via AdverseActionFlow PRE_AWAITING_DISPUTE_WINDOW -> READY_FOR_FINAL). Recomputes eligibility_posture for any candidate whose 365-day LOCKED window has expired."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: null
    side_effects: ["see §1.2 system transitions"]

# ============================================================================
# §1.6 Error Code Catalog
# ============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "Missing or empty X-User-Role / X-User-ID headers"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this endpoint per RBAC matrix"

  - id: ERR_CANDIDATE_NOT_FOUND
    http: 404
    condition: "Candidate id does not exist or is archived"

  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "BackgroundCheckOrder id does not exist"

  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Generic 404 for VerificationItem, Dispute, ConsentDisclosure, JurisdictionPolicy"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state where this transition is legal"

  - id: ERR_BAN_THE_BOX_VIOLATION
    http: 422
    condition: "Order opened at a stage earlier than jurisdiction's ban_the_box_stage gate"

  - id: ERR_SALARY_HISTORY_BAN
    http: 422
    condition: "Request body contains salary_history for a candidate whose jurisdiction has salary_history_ban=true, OR candidate.salary_history_disclosed already true"

  - id: ERR_CONSENT_INVALID
    http: 422
    condition: "ConsentDisclosure is missing, not ACTIVE, lacks signature, or has timestamp inconsistencies"

  - id: ERR_CONSENT_TIMESTAMP_INVALID
    http: 422
    condition: "consent_timestamp > now() OR disclosure_presented_at > consent_timestamp"

  - id: ERR_CONSENT_CANDIDATE_MISMATCH
    http: 422
    condition: "consent_disclosure_id refers to a different candidate than candidate_id"

  - id: ERR_SOD_VIOLATION
    http: 422
    condition: "Adjudicator's X-User-ID equals the order's opened_by_user_id (segregation of duties)"

  - id: ERR_COOLING_OFF_NOT_ELAPSED
    http: 422
    condition: "now() < AdverseActionFlow.earliest_final_eligible_at"

  - id: ERR_OPEN_DISPUTE_BLOCKS_FINAL
    http: 422
    condition: "At least one Dispute(status=OPEN) exists for items of the order at the time of final-adverse"

  - id: ERR_PACKAGE_SET_INVALID
    http: 422
    condition: "requested_packages is empty, has duplicates, or contains an unknown package code"

  - id: ERR_CANDIDATE_NOT_ELIGIBLE
    http: 422
    condition: "Candidate.eligibility_posture is not ELIGIBLE at order creation"

  - id: ERR_DISPUTE_NOT_OWNED
    http: 403
    condition: "Dispute creator is not the Candidate owning the order"

  - id: ERR_REWORK_CAP_EXCEEDED
    http: 422
    condition: "VerificationItem.rework_count would exceed 2"

  - id: ERR_AUDIT_CHAIN_BROKEN
    http: 422
    condition: "previous_event_id does not match the latest AuditEvent for the subject"

  - id: ERR_CANDIDATE_EMAIL_TAKEN
    http: 409
    condition: "Email uniqueness collision among non-archived candidates"

  - id: ERR_ADVERSE_FLOW_ALREADY_EXISTS
    http: 409
    condition: "AdverseActionFlow already exists for this order"

  - id: ERR_STALE_VERSION
    http: 409
    condition: "Provided version does not match current row version (OCC)"

  - id: ERR_VALIDATION_FAILED
    http: 400
    condition: "Required field missing, malformed JSON, type mismatch"

# ============================================================================
# §1.7 RBAC Matrix
# ============================================================================
roles:
  - name: Recruiter
    description: "Initiates background-check orders; cannot adjudicate."
    identity: "opaque"
    exclusive_operations:
      - "POST /fcra/candidates"
      - "POST /fcra/orders"
      - "POST /fcra/orders/{id}/start-verification"
      - "POST /fcra/orders/{id}/cancel"
      - "PATCH /fcra/candidates/{id}"
    shared_operations:
      - "GET on candidates, orders, items, disputes, jurisdiction-policies"

  - name: Adjudicator
    description: "Reviews returned verifications, issues Pre-Adverse and Final-Adverse actions, resolves disputes. Segregation-of-duties: cannot adjudicate an order they opened."
    identity: "opaque"
    exclusive_operations:
      - "POST /fcra/orders/{id}/pre-adverse"
      - "POST /fcra/orders/{id}/final-adverse"
      - "POST /fcra/orders/{id}/request-rework"
      - "POST /fcra/orders/{id}/resume-verification"
      - "POST /fcra/disputes/{id}/resolve"
    shared_operations:
      - "GET on candidates, orders, items, disputes, audit-trail"

  - name: Verifier
    description: "External verification vendor: returns raw_finding payloads on assigned items."
    identity: "opaque"
    exclusive_operations:
      - "POST /fcra/verification-items/{id}/return"
    shared_operations:
      - "GET on verification-items"

  - name: Candidate
    description: "The subject of the background check. Owns own consent and disputes."
    identity: "entity_backed:Candidate"
    exclusive_operations:
      - "POST /fcra/candidates/{id}/consent/revoke (must equal own candidate id)"
      - "POST /fcra/disputes (must be on own item)"
    shared_operations:
      - "POST /fcra/candidates/{id}/consent (Candidate may record own consent)"
      - "GET on own candidate, own orders, own items, own disputes"

  - name: PlatformAdmin
    description: "Operational role for jurisdiction-policy upserts and test-only clock/sweep endpoints."
    identity: "opaque"
    exclusive_operations:
      - "PUT /fcra/jurisdiction-policies/{code}"
      - "POST /fcra/_clock/advance"
      - "POST /fcra/_sweep/run"
    shared_operations:
      - "GET on all read endpoints"
