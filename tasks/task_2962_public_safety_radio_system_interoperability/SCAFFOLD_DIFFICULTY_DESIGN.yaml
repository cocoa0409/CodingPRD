              captures: { tp_h1: "$.data.id" }
            - call: "POST /radio-system/talkpath-requests"
              payload: { site_id: "${site_out_id}", talkgroup_id: "${tg_hotel_id}", unit_id: "${unit_h2}", request_kind: "NORMAL", site_event_id: "${event_out_id}" }
              as: Dispatcher
              as_user_id: "${agency_h_id}"
              captures: { tp_h2: "$.data.id" }
            - call: "POST /radio-system/talkpath-requests"
              payload: { site_id: "${site_out_id}", talkgroup_id: "${tg_hotel_id}", unit_id: "${unit_h3}", request_kind: "NORMAL", site_event_id: "${event_out_id}" }
              as: Dispatcher
              as_user_id: "${agency_h_id}"
              captures: { tp_h3: "$.data.id" }
            - call: "POST /radio-system/talkpath-requests"
              payload: { site_id: "${site_out_id}", talkgroup_id: "${tg_hotel_id}", unit_id: "${unit_h4}", request_kind: "NORMAL", site_event_id: "${event_out_id}" }
              as: Dispatcher
              as_user_id: "${agency_h_id}"
              captures: { tp_h4: "$.data.id" }
            - call: "POST /radio-system/talkpath-requests"
              payload: { site_id: "${site_out_id}", talkgroup_id: "${tg_hotel_id}", unit_id: "${unit_h1}", request_kind: "NORMAL", site_event_id: "${event_out_id}" }
              as: Dispatcher
              as_user_id: "${agency_h_id}"
              captures: { tp_h5: "$.data.id" }
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T03:31:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /radio-system/site-events/${event_out_id}/advance"
              payload: { action: "ESCALATE" }
              as: RFEngineer
              as_user_id: "rf-1"
          assert:
            - "Pre-trigger baseline: Site.${site_out_id}.busy_talkpaths == 4, peak_talkpaths == 4, granted_request_count == 4, busied_request_count == 1, grade_of_service_pct == 80.0"
            - "Pre-trigger baseline: TalkpathRequest.${tp_h5}.outcome == BUSIED and available_talkpaths_at_decision == 0 and reserve_talkpaths_at_decision == 0"
            - "Link 1: SiteEvent.${event_out_id}.status == ESCALATED and escalation_tier == 3 and backup_minutes_remaining == 29"
            - "Link 2: Site.${site_out_id}.capacity_mode == EMERGENCY_ONLY and Site.${site_out_id}.status == DEGRADED"
            - "Link 3: TalkpathRequest.${tp_h1}.outcome == PREEMPTED and released_at == 2026-08-01T03:31:00.000Z"
            - "Link 3: TalkpathRequest.${tp_h2}.outcome == PREEMPTED and TalkpathRequest.${tp_h3}.outcome == PREEMPTED and TalkpathRequest.${tp_h4}.outcome == PREEMPTED"
            - "Link 3: SiteEvent.${event_out_id}.preempted_talkpath_count == 4"
            - "Link 4: Site.${site_out_id}.busy_talkpaths == 0 and Site.${site_out_id}.peak_talkpaths == 4"
            - "Link 4: Site.${site_out_id}.granted_request_count == 4 and busied_request_count == 1 and grade_of_service_pct == 80.0"
            - "TalkpathRequest.${tp_h1}.priority_class_at_grant == 7 and TalkpathRequest.${tp_h4}.priority_class_at_grant == 2"
            - "TalkpathRequest.${tp_h5}.released_at == null (a BUSIED row is never preempted)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: fee_assessment_stale_version_outranks_invalid_fee_period
        grounds:
          - validations[priority=8]
          - validations[priority=39]
          - concurrency_rules[agency-fee-reassessment-stale]
          - errors.ERR_STALE_VERSION
          - errors.ERR_FEE_PERIOD_INVALID
        distinguishing_aspect: |
          Error-category pair is state (priority 8, ERR_STALE_VERSION, HTTP 412)
          versus business_fiscal (priority 39, ERR_FEE_PERIOD_INVALID, HTTP 422)
          on POST /radio-system/agencies/{agency_id}/fee-assessments. One request
          violates BOTH — a stale expected_agency_version AND a period_end after
          the logical clock — and only the OCC error may surface.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "MemberAgency I: agency_type PUBLIC_WORKS, fee_basis SNAPSHOT, recorder_retention_days 30; its version is captured as 1 immediately after creation."
            - "A PATCH console-config write then bumps MemberAgency.version to 2, so the captured value is stale."
            - "The agency has never been assessed: lifetime_assessed_cents 0, fee_balance_cents 0, billing_status CURRENT."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/agencies"
              payload: { name: "India Water District", agency_code: "PWKI1", agency_type: "PUBLIC_WORKS", fee_basis: "SNAPSHOT", interop_privilege: "MONITOR", recorder_retention_days: 30, console_position_count: 2 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_i_id: "$.data.id", agency_i_v_stale: "$.data.version" }
            - call: "PATCH /radio-system/agencies/${agency_i_id}/console-config"
              payload: { console_position_count: 6 }
              as: AgencyRadioManager
              as_user_id: "${agency_i_id}"
              captures: { agency_i_v_current: "$.data.version" }
          trigger:
            - call: "POST /radio-system/agencies/${agency_i_id}/fee-assessments"
              payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", expected_agency_version: "${agency_i_v_stale}" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { conflict_error_id: "$.data.error_id" }
          assert:
            - "Baseline: agency_i_v_stale == 1 and agency_i_v_current == 2 (the console-config write incremented version)"
            - "trigger[0] returns HTTP 412 with data.error_id == ERR_STALE_VERSION"
            - "trigger[0] does NOT return ERR_FEE_PERIOD_INVALID even though period_end 2026-09-01T00:00:00Z is after the logical clock"
            - "MemberAgency.${agency_i_id}.version == 2 (the rejected assessment wrote nothing)"
            - "MemberAgency.${agency_i_id}.lifetime_assessed_cents == 0 and last_assessed_fee_cents == null and fee_balance_cents == 0"
            - "MemberAgency.${agency_i_id}.payment_due_at == null and billing_status == CURRENT"
            - "Retrying with expected_agency_version 2 and period_end 2026-09-01T00:00:00Z now surfaces HTTP 422 ERR_FEE_PERIOD_INVALID, proving the second violation was real and merely outranked"

      - name: patch_coverage_safety_outranks_encryption_mode_mismatch
        grounds:
          - validations[priority=20]
          - validations[priority=29]
          - calculations.site_coverage_reliability
          - errors.ERR_COVERAGE_CLASS_INSUFFICIENT
          - errors.ERR_ENCRYPTION_MODE_MISMATCH
        distinguishing_aspect: |
          A different error-category pair on a different endpoint: business_safety
          (priority 20, ERR_COVERAGE_CLASS_INSUFFICIENT) versus
          business_referential (priority 29, ERR_ENCRYPTION_MODE_MISMATCH) on
          POST /radio-system/interop-patches. Neither category appears in the
          stale-version/fee-period pair above.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Site GEN-1 surveyed at 940/1000 with GENERATOR backup: raw_pct 94.0 selects derate tier B, so coverage_reliability_pct is 92.5 and coverage_class is GENERAL — not MISSION_CRITICAL."
            - "MemberAgency K: agency_type LAW, interop_privilege PATCH_AUTHORITY, recorder_retention_days 180, billing_status CURRENT."
            - "K owns both talkgroups, both homed on GEN-1: CLR1 with encryption_mode CLEAR and SEC1 with encryption_mode ENCRYPTED."
            - "No patch has ever been requested, so no window overlap and no privilege or ownership defect exists."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/sites"
              payload: { site_code: "GEN-1", name: "General Grade One", channel_capacity: 10, backup_power_type: "GENERATOR", generator_fuel_hours: 24 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { site_gen_id: "$.data.id", site_gen_v: "$.data.version" }
            - call: "PATCH /radio-system/sites/${site_gen_id}/coverage"
              payload: { covered_test_points: 940, total_test_points: 1000, expected_site_version: "${site_gen_v}" }
              as: RFEngineer
              as_user_id: "rf-1"
            - call: "POST /radio-system/agencies"
              payload: { name: "Kilo City Police", agency_code: "LAWK1", agency_type: "LAW", interop_privilege: "PATCH_AUTHORITY", recorder_retention_days: 180 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_k_id: "$.data.id" }
            - call: "POST /radio-system/talkgroups"
              payload: { owner_agency_id: "${agency_k_id}", home_site_id: "${site_gen_id}", alias: "CLR1", tg_decimal_id: 301, kind: "DISPATCH", encryption_mode: "CLEAR" }
              as: AgencyRadioManager
              as_user_id: "${agency_k_id}"
              captures: { tg_clear_id: "$.data.id" }
            - call: "POST /radio-system/talkgroups"
              payload: { owner_agency_id: "${agency_k_id}", home_site_id: "${site_gen_id}", alias: "SEC1", tg_decimal_id: 302, kind: "TACTICAL", encryption_mode: "ENCRYPTED" }
              as: AgencyRadioManager
              as_user_id: "${agency_k_id}"
              captures: { tg_enc_id: "$.data.id" }
          trigger:
            - call: "POST /radio-system/interop-patches"
              payload: { source_talkgroup_id: "${tg_clear_id}", target_talkgroup_id: "${tg_enc_id}", requesting_agency_id: "${agency_k_id}", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T06:00:00Z" }
              as: Dispatcher
              as_user_id: "${agency_k_id}"
              captures: { patch_conflict_error_id: "$.data.error_id" }
          assert:
            - "Baseline: Site.${site_gen_id}.coverage_reliability_pct == 92.5 and coverage_derate_tier == B and coverage_class == GENERAL"
            - "trigger[0] returns HTTP 422 with data.error_id == ERR_COVERAGE_CLASS_INSUFFICIENT"
            - "trigger[0] does NOT return ERR_ENCRYPTION_MODE_MISMATCH even though a CLEAR talkgroup was patched to an ENCRYPTED one"
            - "No InteropPatch row was created: Talkgroup.${tg_clear_id}.active_patch_count == 0 and Talkgroup.${tg_enc_id}.active_patch_count == 0"
            - "MemberAgency.${agency_k_id}.active_patch_request_count == 0"
            - "Re-surveying GEN-1 to 985/1000 (coverage_class MISSION_CRITICAL) and repeating the identical request now surfaces HTTP 422 ERR_ENCRYPTION_MODE_MISMATCH, proving the referential violation was real and merely outranked"

  - rule_id: boundary_precision_check
    instances:
      - name: normal_talkpath_busied_at_exact_zero_surge_headroom
        grounds:
          - calculations.talkpath_grant_decision
          - calculations.site_grade_of_service
          - entities.TalkpathRequest.fields.available_talkpaths_at_decision
          - entities.TalkpathRequest.fields.reserve_talkpaths_at_decision
          - state_machines.SiteEvent.OPEN_to_SURGE_ACTIVE
        distinguishing_aspect: |
          Metric is the integer surge headroom (available - reserve) on
          POST /radio-system/talkpath-requests, and the tested endpoint of its
          range is EXACTLY ZERO: the comparison is `> 0`, never `>= 0`, so a
          NORMAL request at headroom 0 is BUSIED while a PRIORITY request with
          the same available == 1 is GRANTED because PRIORITY may consume the
          reserve.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Site SUR-1: channel_capacity 5, so usable == 4 after CONTROL_CHANNELS_RESERVED = 1; GENERATOR backup."
            - "MemberAgency L (FIRE, recorder_retention_days 90) owns one CLEAR DISPATCH talkgroup homed on SUR-1 and four ASSIGNED units: j1..j3 with priority_class 7 and j4 with priority_class 2."
            - "Three NORMAL talkpath requests are GRANTED, leaving busy_talkpaths 3 and available 1."
            - "A MAJOR_INCIDENT SiteEvent is then advanced with DECLARE_SURGE, so Site.capacity_mode becomes PRIORITY_ONLY and reserve becomes min(floor(4 * 25 / 100), 4) == 1."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/sites"
              payload: { site_code: "SUR-1", name: "Surge One", channel_capacity: 5, backup_power_type: "GENERATOR", generator_fuel_hours: 24 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { site_sur_id: "$.data.id" }
            - call: "POST /radio-system/agencies"
              payload: { name: "Lima Fire Rescue", agency_code: "FIRL1", agency_type: "FIRE", recorder_retention_days: 90 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_l_id: "$.data.id" }
            - call: "POST /radio-system/templates"
              payload: { template_name: "LIMA-BASE-1", target_standard: "P25_PHASE1", talkgroup_slot_count: 4 }
              as: FleetEngineer
              as_user_id: "fe-1"
              captures: { tpl_lima_id: "$.data.id" }
            - call: "POST /radio-system/templates/${tpl_lima_id}/publish"
              payload: {}
              as: FleetEngineer
              as_user_id: "fe-1"
            - call: "POST /radio-system/talkgroups"
              payload: { owner_agency_id: "${agency_l_id}", home_site_id: "${site_sur_id}", alias: "LFD-DISP", tg_decimal_id: 401, kind: "DISPATCH", encryption_mode: "CLEAR" }
              as: AgencyRadioManager
              as_user_id: "${agency_l_id}"
              captures: { tg_lima_id: "$.data.id" }
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_l_id}", serial_number: "SNL001", radio_id: 8001, model: "PORTABLE", priority_class: 7 }
              as: AgencyRadioManager
              as_user_id: "${agency_l_id}"
              captures: { unit_l1: "$.data.id" }
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_l_id}", serial_number: "SNL002", radio_id: 8002, model: "PORTABLE", priority_class: 7 }
              as: AgencyRadioManager
              as_user_id: "${agency_l_id}"
              captures: { unit_l2: "$.data.id" }
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_l_id}", serial_number: "SNL003", radio_id: 8003, model: "MOBILE", priority_class: 7 }
              as: AgencyRadioManager
              as_user_id: "${agency_l_id}"
              captures: { unit_l3: "$.data.id" }
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_l_id}", serial_number: "SNL004", radio_id: 8004, model: "MOBILE", priority_class: 2 }
              as: AgencyRadioManager
              as_user_id: "${agency_l_id}"
              captures: { unit_l4: "$.data.id" }
            - call: "POST /radio-system/units/${unit_l1}/lifecycle"
              payload: { action: "ASSIGN", template_id: "${tpl_lima_id}" }
              as: AgencyRadioManager
              as_user_id: "${agency_l_id}"
            - call: "POST /radio-system/units/${unit_l2}/lifecycle"
              payload: { action: "ASSIGN", template_id: "${tpl_lima_id}" }
              as: AgencyRadioManager
              as_user_id: "${agency_l_id}"
            - call: "POST /radio-system/units/${unit_l3}/lifecycle"
              payload: { action: "ASSIGN", template_id: "${tpl_lima_id}" }
              as: AgencyRadioManager
              as_user_id: "${agency_l_id}"
            - call: "POST /radio-system/units/${unit_l4}/lifecycle"
              payload: { action: "ASSIGN", template_id: "${tpl_lima_id}" }
              as: AgencyRadioManager
              as_user_id: "${agency_l_id}"
            - call: "POST /radio-system/talkpath-requests"
              payload: { site_id: "${site_sur_id}", talkgroup_id: "${tg_lima_id}", unit_id: "${unit_l1}", request_kind: "NORMAL" }
              as: Dispatcher
              as_user_id: "${agency_l_id}"
              captures: { tp_l1: "$.data.id" }
            - call: "POST /radio-system/talkpath-requests"
              payload: { site_id: "${site_sur_id}", talkgroup_id: "${tg_lima_id}", unit_id: "${unit_l2}", request_kind: "NORMAL" }
              as: Dispatcher
              as_user_id: "${agency_l_id}"
              captures: { tp_l2: "$.data.id" }
            - call: "POST /radio-system/talkpath-requests"
              payload: { site_id: "${site_sur_id}", talkgroup_id: "${tg_lima_id}", unit_id: "${unit_l3}", request_kind: "NORMAL" }
              as: Dispatcher
              as_user_id: "${agency_l_id}"
              captures: { tp_l3: "$.data.id" }
            - call: "POST /radio-system/site-events"
              payload: { site_id: "${site_sur_id}", event_class: "MAJOR_INCIDENT", cause: "INCIDENT_SURGE" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { event_sur_id: "$.data.id" }
            - call: "POST /radio-system/site-events/${event_sur_id}/advance"
              payload: { action: "DECLARE_SURGE" }
              as: SystemAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /radio-system/talkpath-requests"
              payload: { site_id: "${site_sur_id}", talkgroup_id: "${tg_lima_id}", unit_id: "${unit_l1}", request_kind: "NORMAL", site_event_id: "${event_sur_id}" }
              as: Dispatcher
              as_user_id: "${agency_l_id}"
              captures: { tp_l_normal_busied: "$.data.id" }
            - call: "POST /radio-system/talkpath-requests"
              payload: { site_id: "${site_sur_id}", talkgroup_id: "${tg_lima_id}", unit_id: "${unit_l4}", request_kind: "PRIORITY", site_event_id: "${event_sur_id}" }
              as: Dispatcher
              as_user_id: "${agency_l_id}"
              captures: { tp_l_priority_granted: "$.data.id" }
          assert:
            - "Baseline after the three grants: Site.${site_sur_id}.busy_talkpaths == 3 and grade_of_service_pct == 100.0"
            - "Baseline after DECLARE_SURGE: SiteEvent.${event_sur_id}.status == SURGE_ACTIVE and Site.${site_sur_id}.capacity_mode == PRIORITY_ONLY and Site.${site_sur_id}.status == IN_SERVICE"
            - "trigger[0] returns HTTP 201 and TalkpathRequest.${tp_l_normal_busied}.outcome == BUSIED (headroom available - reserve == 1 - 1 == 0, and the comparison is strictly > 0)"
            - "TalkpathRequest.${tp_l_normal_busied}.available_talkpaths_at_decision == 1 and reserve_talkpaths_at_decision == 1 and granted_at == null"
            - "trigger[1] returns HTTP 201 and TalkpathRequest.${tp_l_priority_granted}.outcome == GRANTED with available_talkpaths_at_decision == 1 and reserve_talkpaths_at_decision == 1"
            - "TalkpathRequest.${tp_l_priority_granted}.priority_class_at_grant == 2 and preempted_request_id == null"
            - "Final: Site.${site_sur_id}.busy_talkpaths == 4 and peak_talkpaths == 4"
            - "Final: Site.${site_sur_id}.granted_request_count == 4 and busied_request_count == 1 and grade_of_service_pct == 80.0"

      - name: backup_power_tier_one_inclusive_at_exactly_120_minutes
        grounds:
          - calculations.backup_power_runtime
          - state_machines.SiteEvent.ON_BACKUP_POWER_to_ESCALATED
          - entities.SiteEvent.fields.backup_minutes_remaining
          - entities.SiteEvent.fields.escalation_tier
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: |
          A different metric (backup_minutes_remaining, a decay-function output in
          whole minutes) on a different endpoint
          (POST /radio-system/site-events/{event_id}/advance), and a different
          endpoint of the range: the TIER_1_MINUTES = 120 threshold is INCLUSIVE
          on the low side, so 121 minutes remaining refuses to escalate and
          exactly 120 escalates to tier 1.
        test_recipe:
          setup:
            - "Site BAT-1: BATTERY_ONLY with battery_runtime_minutes 240 and generator_fuel_hours 0, so capacity_minutes is exactly 240 (the generator contribution is dropped for BATTERY_ONLY)."
            - "Logical clock at 2026-08-01T00:00:00Z when the UNPLANNED_OUTAGE SiteEvent is created, fixing detected_at at that instant."
            - "The clock is advanced to 2026-08-01T01:59:00Z and the event is advanced to ON_BACKUP_POWER, giving elapsed 119 and backup_minutes_remaining 121 at escalation_tier 0."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/sites"
              payload: { site_code: "BAT-1", name: "Battery One", channel_capacity: 8, backup_power_type: "BATTERY_ONLY", battery_runtime_minutes: 240, generator_fuel_hours: 0 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { site_bat_id: "$.data.id" }
            - call: "POST /radio-system/site-events"
              payload: { site_id: "${site_bat_id}", event_class: "UNPLANNED_OUTAGE", cause: "COMMERCIAL_POWER_LOSS" }
              as: RFEngineer
              as_user_id: "rf-1"
              captures: { event_bat_id: "$.data.id" }
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T01:59:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/site-events/${event_bat_id}/advance"
              payload: { action: "BACKUP_ENGAGED" }
              as: RFEngineer
              as_user_id: "rf-1"
          trigger:
            - call: "POST /radio-system/site-events/${event_bat_id}/advance"
              payload: { action: "ESCALATE" }
              as: RFEngineer
              as_user_id: "rf-1"
              captures: { escalate_too_early_error_id: "$.data.error_id" }
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T02:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/site-events/${event_bat_id}/advance"
              payload: { action: "ESCALATE" }
              as: RFEngineer
              as_user_id: "rf-1"
          assert:
            - "Baseline after BACKUP_ENGAGED: SiteEvent.${event_bat_id}.status == ON_BACKUP_POWER and detected_at == 2026-08-01T00:00:00.000Z"
            - "Baseline after BACKUP_ENGAGED: SiteEvent.${event_bat_id}.backup_minutes_remaining == 121 and escalation_tier == 0 and Site.${site_bat_id}.status == DEGRADED"
            - "trigger[0] returns HTTP 409 with data.error_id == ERR_INVALID_STATE_TRANSITION (121 > 120 selects tier 0, which is not greater than the current tier 0)"
            - "After trigger[0]: SiteEvent.${event_bat_id}.status == ON_BACKUP_POWER and escalation_tier == 0 and backup_minutes_remaining == 121 (unchanged)"
            - "trigger[2] returns HTTP 200 and SiteEvent.${event_bat_id}.status == ESCALATED"
            - "After trigger[2]: SiteEvent.${event_bat_id}.backup_minutes_remaining == 120 and escalation_tier == 1"
            - "After trigger[2]: Site.${site_bat_id}.capacity_mode == NORMAL (only tier 3 forces EMERGENCY_ONLY) and Site.${site_bat_id}.status == DEGRADED"
            - "SiteEvent.${event_bat_id}.restored_at == null and preempted_talkpath_count == 0"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: unit_assignment_requires_published_template
        grounds:
          - state_machines.SubscriberUnit.INVENTORY_to_ASSIGNED
          - validations[priority=15]
          - state_machines.RadioTemplate.DRAFT_to_PUBLISHED
          - errors.ERR_TEMPLATE_NOT_PUBLISHED
          - calculations.governance_vote_weight
        distinguishing_aspect: |
          Entity pair is SubscriberUnit -> RadioTemplate: the unit's own
          provision_status is a perfectly legal INVENTORY, and the ONLY reason
          ASSIGN is refused is that the referenced RadioTemplate sits in DRAFT.
          Publishing the template — touching nothing on the unit — makes the
          identical request succeed.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "MemberAgency O: agency_type EMS, recorder_retention_days 90, no talkgroups."
            - "RadioTemplate OSCAR-DRAFT-1 created and left in status DRAFT (never published), talkgroup_slot_count 6."
            - "One SubscriberUnit of O in provision_status INVENTORY, key_status KEYLESS, billable false."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/agencies"
              payload: { name: "Oscar County EMS", agency_code: "EMSO1", agency_type: "EMS", recorder_retention_days: 90 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_o_id: "$.data.id" }
            - call: "POST /radio-system/templates"
              payload: { template_name: "OSCAR-DRAFT-1", target_standard: "P25_PHASE2", talkgroup_slot_count: 6, encryption_required: false }
              as: FleetEngineer
              as_user_id: "fe-1"
              captures: { tpl_oscar_id: "$.data.id" }
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_o_id}", serial_number: "SNO001", radio_id: 9001, model: "PORTABLE", priority_class: 4 }
              as: AgencyRadioManager
              as_user_id: "${agency_o_id}"
              captures: { unit_o1: "$.data.id" }
          trigger:
            - call: "POST /radio-system/units/${unit_o1}/lifecycle"
              payload: { action: "ASSIGN", template_id: "${tpl_oscar_id}" }
              as: AgencyRadioManager
              as_user_id: "${agency_o_id}"
              captures: { unpublished_error_id: "$.data.error_id" }
            - call: "POST /radio-system/templates/${tpl_oscar_id}/publish"
              payload: {}
              as: FleetEngineer
              as_user_id: "fe-1"
            - call: "POST /radio-system/units/${unit_o1}/lifecycle"
              payload: { action: "ASSIGN", template_id: "${tpl_oscar_id}" }
              as: AgencyRadioManager
              as_user_id: "${agency_o_id}"
          assert:
            - "Baseline: RadioTemplate.${tpl_oscar_id}.status == DRAFT and deployed_unit_count == 0"
            - "trigger[0] returns HTTP 409 with data.error_id == ERR_TEMPLATE_NOT_PUBLISHED"
            - "After trigger[0]: SubscriberUnit.${unit_o1}.provision_status == INVENTORY and template_id == null and assigned_at == null and billable == false"
            - "After trigger[0]: MemberAgency.${agency_o_id}.billable_subscriber_count == 0"
            - "After trigger[1]: RadioTemplate.${tpl_oscar_id}.status == PUBLISHED and RadioTemplate.${tpl_oscar_id}.template_version == 1"
            - "trigger[2] returns HTTP 200 and SubscriberUnit.${unit_o1}.provision_status == ASSIGNED with template_id == ${tpl_oscar_id}"
            - "After trigger[2]: SubscriberUnit.${unit_o1}.assigned_at == 2026-08-01T00:00:00.000Z, billable == true and key_status == KEYLESS (unchanged by ASSIGN)"
            - "After trigger[2]: MemberAgency.${agency_o_id}.billable_subscriber_count == 1 and governance_vote_weight == 1 and voting_eligible == true"
            - "After trigger[2]: RadioTemplate.${tpl_oscar_id}.deployed_unit_count == 1"

      - name: otar_campaign_creation_requires_active_keyset
        grounds:
          - validations[priority=14]
          - state_machines.Keyset.PENDING_APPROVAL_to_ACTIVE
          - errors.ERR_KEYSET_NOT_ACTIVE
          - entities.OtarCampaign.fields.status
        distinguishing_aspect: |
          A different entity pair — OtarCampaign -> Keyset — where the blocking
          state lives on the crypto material rather than on a codeplug template,
          and the unblocking act is a segregation-of-duties approval by a second
          user rather than a publish. Nothing about the campaign payload changes
          between the refused and the accepted attempt.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "MemberAgency P (EMS, recorder_retention_days 90) exists with no units at all."
            - "Keyset KS-PEND-1 created by kc-1 with crypto period 2026-08-01T00:00:00Z..2026-12-01T00:00:00Z and left in status PENDING_APPROVAL."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/agencies"
              payload: { name: "Papa Valley EMS", agency_code: "EMSP1", agency_type: "EMS", recorder_retention_days: 90 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_p_id: "$.data.id" }
            - call: "POST /radio-system/keysets"
              payload: { keyset_name: "KS-PEND-1", algorithm: "AES256", crypto_period_start: "2026-08-01T00:00:00Z", crypto_period_end: "2026-12-01T00:00:00Z" }
              as: KeyCustodian
              as_user_id: "kc-1"
              captures: { keyset_p_id: "$.data.id" }
          trigger:
            - call: "POST /radio-system/otar-campaigns"
              payload: { keyset_id: "${keyset_p_id}", agency_id: "${agency_p_id}", window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-03T00:00:00Z" }
              as: KeyCustodian
              as_user_id: "kc-1"
              captures: { inactive_keyset_error_id: "$.data.error_id" }
            - call: "POST /radio-system/keysets/${keyset_p_id}/approval"
              payload: { decision: "APPROVE" }
              as: SecurityOfficer
              as_user_id: "so-1"
            - call: "POST /radio-system/otar-campaigns"
              payload: { keyset_id: "${keyset_p_id}", agency_id: "${agency_p_id}", window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-03T00:00:00Z" }
              as: KeyCustodian
              as_user_id: "kc-1"
              captures: { campaign_p_id: "$.data.id" }
          assert:
            - "Baseline: Keyset.${keyset_p_id}.status == PENDING_APPROVAL and created_by_user_id == \"kc-1\" and approved_by_user_id == null"
            - "trigger[0] returns HTTP 409 with data.error_id == ERR_KEYSET_NOT_ACTIVE"
            - "After trigger[0]: GET /radio-system/otar-campaigns?keyset_id=${keyset_p_id} returns total_count == 0 (no campaign row was persisted)"
            - "After trigger[1]: Keyset.${keyset_p_id}.status == ACTIVE and approved_by_user_id == \"so-1\" and loaded_unit_count == 0"
            - "trigger[2] returns HTTP 201 and OtarCampaign.${campaign_p_id}.status == SCHEDULED"
            - "OtarCampaign.${campaign_p_id}.target_unit_count == 0 and rekeyed_unit_count == 0 and failed_unit_count == 0 and executed_at == null"
            - "GET /radio-system/otar-campaigns?keyset_id=${keyset_p_id} now returns total_count == 1"

  - rule_id: resource_temporal_overlap
    instances:
      - name: otar_window_half_open_adjacency_accepted_overlap_rejected
        grounds:
          - validations[priority=24]
          - validations[priority=33]
          - errors.ERR_OTAR_WINDOW_OVERLAP
          - entities.OtarCampaign.fields.window_start
          - entities.OtarCampaign.fields.window_end
        distinguishing_aspect: |
          Interval semantics are HALF-OPEN [window_start, window_end) and the
          contended resource is the Keyset-plus-agency rekey channel: a campaign
          starting exactly at another's end is accepted because the endpoint is
          exclusive, while a start one minute earlier collides.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "MemberAgency Q (FIRE, recorder_retention_days 90) exists."
            - "Keyset KS-WIN-1 is ACTIVE (created by kc-1, approved by so-1) with crypto period 2026-08-01T00:00:00Z..2026-12-01T00:00:00Z, so every window below is fully inside the crypto period."
            - "One SCHEDULED campaign C1 already covers [2026-08-05T00:00:00Z, 2026-08-05T04:00:00Z)."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/agencies"
              payload: { name: "Quebec Fire District", agency_code: "FIRQ1", agency_type: "FIRE", recorder_retention_days: 90 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_q_id: "$.data.id" }
            - call: "POST /radio-system/keysets"
              payload: { keyset_name: "KS-WIN-1", algorithm: "AES256", crypto_period_start: "2026-08-01T00:00:00Z", crypto_period_end: "2026-12-01T00:00:00Z" }
              as: KeyCustodian
              as_user_id: "kc-1"
              captures: { keyset_q_id: "$.data.id" }
            - call: "POST /radio-system/keysets/${keyset_q_id}/approval"
              payload: { decision: "APPROVE" }
              as: SecurityOfficer
              as_user_id: "so-1"
            - call: "POST /radio-system/otar-campaigns"
              payload: { keyset_id: "${keyset_q_id}", agency_id: "${agency_q_id}", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-05T04:00:00Z" }
              as: KeyCustodian
              as_user_id: "kc-1"
              captures: { campaign_q1: "$.data.id" }
          trigger:
            - call: "POST /radio-system/otar-campaigns"
              payload: { keyset_id: "${keyset_q_id}", agency_id: "${agency_q_id}", window_start: "2026-08-05T04:00:00Z", window_end: "2026-08-05T08:00:00Z" }
              as: KeyCustodian
              as_user_id: "kc-1"
              captures: { campaign_q2: "$.data.id" }
            - call: "POST /radio-system/otar-campaigns"
              payload: { keyset_id: "${keyset_q_id}", agency_id: "${agency_q_id}", window_start: "2026-08-05T03:59:00Z", window_end: "2026-08-05T06:00:00Z" }
              as: KeyCustodian
              as_user_id: "kc-1"
              captures: { otar_overlap_error_id: "$.data.error_id" }
          assert:
            - "Baseline: OtarCampaign.${campaign_q1}.status == SCHEDULED with window_start 2026-08-05T00:00:00.000Z and window_end 2026-08-05T04:00:00.000Z"
            - "trigger[0] returns HTTP 201 and OtarCampaign.${campaign_q2}.status == SCHEDULED (start == C1.window_end is adjacency, not overlap, because the interval is half-open)"
            - "trigger[1] returns HTTP 409 with data.error_id == ERR_OTAR_WINDOW_OVERLAP (03:59 precedes C1's exclusive end and 06:00 follows C2's start)"
            - "trigger[1] does NOT return ERR_OTAR_WINDOW_OUTSIDE_CRYPTO_PERIOD: the rejected window is entirely inside the crypto period"
            - "GET /radio-system/otar-campaigns?keyset_id=${keyset_q_id}&status=SCHEDULED returns total_count == 2"
            - "No third campaign row exists: GET /radio-system/otar-campaigns?keyset_id=${keyset_q_id} returns total_count == 2"

      - name: maintenance_window_closed_interval_forty_five_minute_buffer
        grounds:
          - validations[priority=26]
          - validations[priority=27]
          - errors.ERR_MAINTENANCE_BUFFER_VIOLATION
          - entities.SiteEvent.fields.window_start
          - entities.SiteEvent.fields.window_end
        distinguishing_aspect: |
          Different interval semantics on a different resource entity: the
          contended resource is a Site's maintenance calendar, and the intervals
          are CLOSED [window_start, window_end] widened by
          MAINTENANCE_BUFFER_MINUTES = 45 on both sides. A gap of exactly 45
          minutes is REJECTED (the comparison is <=), whereas the OTAR case
          accepted a gap of exactly zero.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z (all windows are in the future; nothing is started)."
            - "Site MNT-1 with GENERATOR backup; it is the only site in the region holding maintenance windows, so the two-site concurrency cap can never fire."
            - "One OPEN PLANNED_MAINTENANCE SiteEvent E1 covers [2026-08-10T02:00:00Z, 2026-08-10T04:00:00Z]."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/sites"
              payload: { site_code: "MNT-1", name: "Maintenance One", channel_capacity: 12, backup_power_type: "GENERATOR", generator_fuel_hours: 24 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { site_mnt_id: "$.data.id" }
            - call: "POST /radio-system/site-events"
              payload: { site_id: "${site_mnt_id}", event_class: "PLANNED_MAINTENANCE", cause: "SCHEDULED_WORK", window_start: "2026-08-10T02:00:00Z", window_end: "2026-08-10T04:00:00Z" }
              as: RFEngineer
              as_user_id: "rf-1"
              captures: { event_mnt1: "$.data.id" }
          trigger:
            - call: "POST /radio-system/site-events"
              payload: { site_id: "${site_mnt_id}", event_class: "PLANNED_MAINTENANCE", cause: "SCHEDULED_WORK", window_start: "2026-08-10T04:45:00Z", window_end: "2026-08-10T06:00:00Z" }
              as: RFEngineer
              as_user_id: "rf-1"
              captures: { buffer_error_id: "$.data.error_id" }
            - call: "POST /radio-system/site-events"
              payload: { site_id: "${site_mnt_id}", event_class: "PLANNED_MAINTENANCE", cause: "SCHEDULED_WORK", window_start: "2026-08-10T04:46:00Z", window_end: "2026-08-10T06:00:00Z" }
              as: RFEngineer
              as_user_id: "rf-1"
              captures: { event_mnt2: "$.data.id" }
          assert:
            - "Baseline: SiteEvent.${event_mnt1}.status == OPEN and event_class == PLANNED_MAINTENANCE and Site.${site_mnt_id}.status == IN_SERVICE"
            - "trigger[0] returns HTTP 409 with data.error_id == ERR_MAINTENANCE_BUFFER_VIOLATION (04:45 is exactly E1.window_end + 45 minutes and the comparison is <=)"
            - "trigger[0] does NOT return ERR_MAINTENANCE_CONCURRENCY_CAP: only one site holds maintenance windows"
            - "After trigger[0]: GET /radio-system/site-events?site_id=${site_mnt_id} returns total_count == 1"
            - "trigger[1] returns HTTP 201 and SiteEvent.${event_mnt2}.status == OPEN (a 46-minute gap clears the buffer)"
            - "SiteEvent.${event_mnt2}.window_start == 2026-08-10T04:46:00.000Z and window_end == 2026-08-10T06:00:00.000Z"
            - "GET /radio-system/site-events?site_id=${site_mnt_id}&event_class=PLANNED_MAINTENANCE returns total_count == 2"
            - "Site.${site_mnt_id}.status == IN_SERVICE (an OPEN maintenance window does not itself change site status; only START does)"

  - rule_id: compensating_invariant
    instances:
      - name: talkpath_grant_then_release_conserves_site_occupancy
        grounds:
          - calculations.site_grade_of_service
          - entities.Site.fields.busy_talkpaths
          - entities.Site.fields.peak_talkpaths
          - entities.TalkpathRequest.fields.hold_seconds
          - endpoints[POST /radio-system/talkpath-requests/{request_id}/release]
        distinguishing_aspect: |
          Conserved quantity is CHANNEL OCCUPANCY: Site.busy_talkpaths must equal
          the number of GRANTED requests with released_at IS NULL after every
          write, so releasing one of three grants returns occupancy to exactly 2
          — while peak_talkpaths is deliberately NOT conserved (it is a monotonic
          high-water mark that stays 3) and granted_request_count still counts
          the released grant.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z while the grants are taken, then advanced to 2026-08-01T00:01:30Z."
            - "Site OCC-1: channel_capacity 8 (usable 7), GENERATOR backup, capacity_mode NORMAL so the surge reserve is 0."
            - "MemberAgency R (PUBLIC_WORKS, recorder_retention_days 30) owns one CLEAR DISPATCH talkgroup homed on OCC-1 and three ASSIGNED units."
            - "Three NORMAL talkpath requests are GRANTED in sequence, so busy_talkpaths and peak_talkpaths both reach 3."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/sites"
              payload: { site_code: "OCC-1", name: "Occupancy One", channel_capacity: 8, backup_power_type: "GENERATOR", generator_fuel_hours: 12 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { site_occ_id: "$.data.id" }
            - call: "POST /radio-system/agencies"
              payload: { name: "Romeo Public Works", agency_code: "PWKR1", agency_type: "PUBLIC_WORKS", recorder_retention_days: 30 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_r_id: "$.data.id" }
            - call: "POST /radio-system/templates"
              payload: { template_name: "ROMEO-BASE-1", target_standard: "P25_PHASE1", talkgroup_slot_count: 4 }
              as: FleetEngineer
              as_user_id: "fe-1"
              captures: { tpl_romeo_id: "$.data.id" }
            - call: "POST /radio-system/templates/${tpl_romeo_id}/publish"
              payload: {}
              as: FleetEngineer
              as_user_id: "fe-1"
            - call: "POST /radio-system/talkgroups"
              payload: { owner_agency_id: "${agency_r_id}", home_site_id: "${site_occ_id}", alias: "PW-DISP", tg_decimal_id: 501, kind: "DISPATCH", encryption_mode: "CLEAR" }
              as: AgencyRadioManager
              as_user_id: "${agency_r_id}"
              captures: { tg_romeo_id: "$.data.id" }
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_r_id}", serial_number: "SNR001", radio_id: 10001, model: "MOBILE", priority_class: 6 }
              as: AgencyRadioManager
              as_user_id: "${agency_r_id}"
              captures: { unit_r1: "$.data.id" }
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_r_id}", serial_number: "SNR002", radio_id: 10002, model: "MOBILE", priority_class: 6 }
              as: AgencyRadioManager
              as_user_id: "${agency_r_id}"
              captures: { unit_r2: "$.data.id" }
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_r_id}", serial_number: "SNR003", radio_id: 10003, model: "PORTABLE", priority_class: 6 }
              as: AgencyRadioManager
              as_user_id: "${agency_r_id}"
              captures: { unit_r3: "$.data.id" }
            - call: "POST /radio-system/units/${unit_r1}/lifecycle"
              payload: { action: "ASSIGN", template_id: "${tpl_romeo_id}" }
              as: AgencyRadioManager
              as_user_id: "${agency_r_id}"
            - call: "POST /radio-system/units/${unit_r2}/lifecycle"
              payload: { action: "ASSIGN", template_id: "${tpl_romeo_id}" }
              as: AgencyRadioManager
              as_user_id: "${agency_r_id}"
            - call: "POST /radio-system/units/${unit_r3}/lifecycle"
              payload: { action: "ASSIGN", template_id: "${tpl_romeo_id}" }
              as: AgencyRadioManager
              as_user_id: "${agency_r_id}"
            - call: "POST /radio-system/talkpath-requests"
              payload: { site_id: "${site_occ_id}", talkgroup_id: "${tg_romeo_id}", unit_id: "${unit_r1}", request_kind: "NORMAL" }
              as: Dispatcher
              as_user_id: "${agency_r_id}"
              captures: { tp_r1: "$.data.id" }
            - call: "POST /radio-system/talkpath-requests"
              payload: { site_id: "${site_occ_id}", talkgroup_id: "${tg_romeo_id}", unit_id: "${unit_r2}", request_kind: "NORMAL" }
              as: Dispatcher
              as_user_id: "${agency_r_id}"
              captures: { tp_r2: "$.data.id" }
            - call: "POST /radio-system/talkpath-requests"
              payload: { site_id: "${site_occ_id}", talkgroup_id: "${tg_romeo_id}", unit_id: "${unit_r3}", request_kind: "NORMAL" }
              as: Dispatcher
              as_user_id: "${agency_r_id}"
              captures: { tp_r3: "$.data.id" }
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:01:30Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /radio-system/talkpath-requests/${tp_r3}/release"
              payload: {}
              as: Dispatcher
              as_user_id: "${agency_r_id}"
          assert:
            - "Invariant pre-trigger: Site.${site_occ_id}.busy_talkpaths == 3 == the count of TalkpathRequest rows for OCC-1 with outcome GRANTED and released_at IS NULL"
            - "Pre-trigger: Site.${site_occ_id}.peak_talkpaths == 3, granted_request_count == 3, busied_request_count == 0, grade_of_service_pct == 100.0"
            - "trigger[0] returns HTTP 200 and TalkpathRequest.${tp_r3}.outcome == RELEASED with released_at == 2026-08-01T00:01:30.000Z"
            - "TalkpathRequest.${tp_r3}.hold_seconds == 90 (granted_at 2026-08-01T00:00:00.000Z to released_at 2026-08-01T00:01:30.000Z)"
            - "Invariant post-trigger: Site.${site_occ_id}.busy_talkpaths == 2 == the count of TalkpathRequest rows for OCC-1 with outcome GRANTED and released_at IS NULL"
            - "Non-conserved by design: Site.${site_occ_id}.peak_talkpaths == 3 (never lowered)"
            - "Site.${site_occ_id}.granted_request_count == 3 and busied_request_count == 0 and grade_of_service_pct == 100.0 (a RELEASED row still counts as a delivered grant)"
            - "TalkpathRequest.${tp_r1}.released_at == null and TalkpathRequest.${tp_r2}.released_at == null and both hold_seconds == null"

      - name: fee_assessment_then_full_payment_conserves_agency_ledger
        grounds:
          - calculations.agency_fee_assessment
          - calculations.agency_billing_status_recompute
          - validations[priority=40]
          - entities.MemberAgency.fields.fee_balance_cents
          - entities.MemberAgency.fields.lifetime_paid_cents
        distinguishing_aspect: |
          A different conserved quantity — the money ledger identity
          fee_balance_cents == lifetime_assessed_cents - lifetime_paid_cents —
          which must hold after the assessment, after each partial payment and
          after the balance reaches zero, with the over-payment attempt refused
          rather than driving the balance negative.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-07-01T00:00:00Z while the fleet is built, then advanced to 2026-08-01T00:00:00Z."
            - "MemberAgency S: agency_type LAW, fee_basis SNAPSHOT, interop_privilege MONITOR (so no patch-authority surcharge applies), recorder_retention_days 180."
            - "Two SubscriberUnits of S are ASSIGNED with assigned_at 2026-07-01T00:00:00Z; both are billable."
            - "The agency has never been assessed or paid: lifetime_assessed_cents 0, lifetime_paid_cents 0, fee_balance_cents 0, billing_status CURRENT."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/agencies"
              payload: { name: "Sierra County Sheriff", agency_code: "LAWS1", agency_type: "LAW", fee_basis: "SNAPSHOT", interop_privilege: "MONITOR", recorder_retention_days: 180 }
              as: SystemAdmin
