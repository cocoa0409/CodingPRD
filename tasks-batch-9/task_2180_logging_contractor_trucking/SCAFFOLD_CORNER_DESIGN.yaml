            - "SettlementStatement.${s1_id}.compiled_by_user_id == acct-1"
            - "SettlementStatement.${s1_id}.approved_by_user_id == acct-2"
            - "SettlementStatement.${s1_id}.status == APPROVED"

      - name: a_scaler_cannot_close_a_different_mills_yard
        claim_type: role_cannot_perform
        grounds:
          - roles.MillScaler
          - errors[ERR_SCALER_MILL_MISMATCH]
          - validations[priority=50]
          - endpoints[PATCH /mills/{id}]
        distinguishing_aspect: |
          MillScaler is entity_backed on Mill, so X-User-ID must equal the Mill id in the
          path. Mill B's scaler holds a permitted role for PATCH /mills/{id} yet must be
          refused with ERR_SCALER_MILL_MISMATCH when it targets Mill A.
        test_recipe:
          setup:
            - "Mill A and Mill B both exist with receiving_status OPEN"
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Cascade Mill A", state_code: "OR", receiving_status: "OPEN" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { mill_a_id: $.data.id }
            - call: "POST /mills"
              payload: { name: "Coast Mill B", state_code: "OR", receiving_status: "OPEN" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { mill_b_id: $.data.id }
          trigger:
            - call: "PATCH /mills/${mill_a_id}"
              payload: { receiving_status: "CLOSED" }
              as: MillScaler
              as_user_id: "${mill_b_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_SCALER_MILL_MISMATCH"
            - "Mill.${mill_a_id}.receiving_status == OPEN"
            - "Mill.${mill_a_id}.version == 1"

  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_expected_tract_version_on_plan_create_returns_precondition_failed
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[plan-create-stale-tract]
          - errors[ERR_STALE_TRACT_VERSION]
          - validations[priority=55]
          - endpoints[POST /tracts/{id}/production-plans]
        distinguishing_aspect: |
          The OCC guard is on Tract.version. The first plan create consumes version 1 and
          advances the tract to version 2; a strictly later create still carrying
          expected_tract_version 1 is refused with 412 ERR_STALE_TRACT_VERSION and the first
          plan stays DRAFT rather than being superseded.
        test_recipe:
          setup:
            - "An empty database and one PLANNED tract created at version 1"
            - "One production plan has already been compiled against expected_tract_version 1, which advanced Tract.version to 2"
            - "The second create is sent strictly after the first completes and reuses the same captured version value"
          setup_api_calls:
            - call: "POST /tracts"
              payload: { name: "Section 14 NE", legal_description: "T3S R5W Sec 14 NE1/4", gross_acres: 120, planned_volume_tons: 4000, access_class: "ALL_SEASON" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { tract_id: $.data.id, tract_v: $.data.version }
            - call: "POST /tracts/${tract_id}/production-plans"
              payload: { target_tons_per_week: 600, plan_horizon_weeks: 8, expected_tract_version: "${tract_v}" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { plan1_id: $.data.id }
          trigger:
            - call: "POST /tracts/${tract_id}/production-plans"
              payload: { target_tons_per_week: 450, plan_horizon_weeks: 10, expected_tract_version: "${tract_v}" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_TRACT_VERSION"
            - "ProductionPlan.${plan1_id}.status == DRAFT"
            - "Tract.${tract_id}.version == 2"
            - "only one ProductionPlan exists for tract ${tract_id}"

      - name: fresh_tract_version_lets_a_new_plan_supersede_the_prior_one
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[plan-create-stale-tract]
          - endpoints[POST /tracts/{id}/production-plans]
          - entities.ProductionPlan.fields.status
          - entities.Tract.fields.version
        distinguishing_aspect: |
          The same endpoint with a freshly re-read version must succeed and exercise the
          supersede semantics the OCC guard exists to protect: plan 1 moves DRAFT ->
          SUPERSEDED, plan 2 is created DRAFT, and Tract.version advances to 3.
        test_recipe:
          setup:
            - "A PLANNED tract at version 1 with one DRAFT production plan compiled against version 1, leaving the tract at version 2"
            - "The client re-reads the tract before the second create, capturing version 2"
          setup_api_calls:
            - call: "POST /tracts"
              payload: { name: "Section 14 NE", legal_description: "T3S R5W Sec 14 NE1/4", gross_acres: 120, planned_volume_tons: 4000, access_class: "ALL_SEASON" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { tract_id: $.data.id, tract_v: $.data.version }
            - call: "POST /tracts/${tract_id}/production-plans"
              payload: { target_tons_per_week: 600, plan_horizon_weeks: 8, expected_tract_version: "${tract_v}" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { plan1_id: $.data.id }
            - call: "GET /tracts/${tract_id}"
              payload: {}
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { tract_v2: $.data.version }
          trigger:
            - call: "POST /tracts/${tract_id}/production-plans"
              payload: { target_tons_per_week: 450, plan_horizon_weeks: 10, expected_tract_version: "${tract_v2}" }
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { plan2_id: $.data.id }
          assert:
            - "response.status == 201"
            - "${tract_v2} == 2"
            - "ProductionPlan.${plan1_id}.status == SUPERSEDED"
            - "ProductionPlan.${plan2_id}.status == DRAFT"
            - "ProductionPlan.${plan2_id}.planned_volume_tons == 4500.00"
            - "Tract.${tract_id}.version == 3"

      - name: stale_expected_haul_contractor_version_on_statement_compile_returns_precondition_failed
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[statement-compile-stale-contractor]
          - errors[ERR_STALE_HAUL_CONTRACTOR_VERSION]
          - validations[priority=55]
          - endpoints[POST /settlement-statements]
        distinguishing_aspect: |
          The second OCC guard is on HaulContractor.version, a different parent entity from
          the tract guard. Compiling statement 1 advances the carrier's version, so a strictly
          later compile for a non-overlapping period that still carries the old value is
          refused with 412 before the priority-75 period-overlap rule is ever consulted.
        test_recipe:
          setup:
            - "Carrier Ridgeline Hauling with all three coverages ACTIVE; its version has been read once after the certificates were filed"
            - "Statement 1 for 2026-08-01..2026-08-31 has been compiled with that version, advancing the carrier's version by one"
            - "The second compile targets 2026-09-01..2026-09-30, which does not overlap, so only the stale version can fail it"
          setup_api_calls:
            - call: "POST /haul-contractors"
              payload: { name: "Ridgeline Hauling", dot_number: "DOT-771204", base_state_code: "OR" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { hc_id: $.data.id }
            - call: "POST /haul-contractors/${hc_id}/insurance-certificates"
              payload: { coverage_type: "GENERAL_LIABILITY", effective_on: "2026-01-01", expires_on: "2027-01-01", limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /haul-contractors/${hc_id}/insurance-certificates"
              payload: { coverage_type: "AUTO_LIABILITY", effective_on: "2026-01-01", expires_on: "2027-01-01", limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /haul-contractors/${hc_id}/insurance-certificates"
              payload: { coverage_type: "WORKERS_COMP", effective_on: "2026-01-01", expires_on: "2027-01-01", limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "GET /haul-contractors/${hc_id}"
              payload: {}
              as: SettlementAccountant
              as_user_id: "acct-1"
              captures: { hc_v: $.data.version }
            - call: "POST /settlement-statements"
              payload: { haul_contractor_id: "${hc_id}", period_start: "2026-08-01", period_end: "2026-08-31", expected_haul_contractor_version: "${hc_v}" }
              as: SettlementAccountant
              as_user_id: "acct-1"
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /settlement-statements"
              payload: { haul_contractor_id: "${hc_id}", period_start: "2026-09-01", period_end: "2026-09-30", expected_haul_contractor_version: "${hc_v}" }
              as: SettlementAccountant
              as_user_id: "acct-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_HAUL_CONTRACTOR_VERSION"
            - "SettlementStatement.${s1_id}.status == DRAFT"
            - "only one SettlementStatement exists for carrier ${hc_id}"

      - name: a_new_overlapping_statement_voids_the_prior_draft
        claim_type: optimistic_concurrency
        grounds:
          - endpoints[POST /settlement-statements]
          - state_machines.SettlementStatement.DRAFT_to_VOID
          - validations[priority=75]
          - entities.SettlementStatement.fields.status
        distinguishing_aspect: |
          This is the supersede semantics the carrier OCC guard protects: a DRAFT statement
          whose period intersects a newly compiled one is VOIDed rather than rejected, its lines
          cleared and its money reset to 0, while a non-DRAFT statement in the same position
          would instead raise ERR_PERIOD_OVERLAP.
        test_recipe:
          setup:
            - "Carrier Ridgeline Hauling with all three coverages ACTIVE and no loads"
            - "A DRAFT statement S1 covering 2026-08-01..2026-08-31 already exists"
            - "The carrier's version is re-read after the first compile so the second compile carries a fresh OCC value"
          setup_api_calls:
            - call: "POST /haul-contractors"
              payload: { name: "Ridgeline Hauling", dot_number: "DOT-771204", base_state_code: "OR" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { hc_id: $.data.id }
            - call: "POST /haul-contractors/${hc_id}/insurance-certificates"
              payload: { coverage_type: "GENERAL_LIABILITY", effective_on: "2026-01-01", expires_on: "2027-01-01", limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /haul-contractors/${hc_id}/insurance-certificates"
              payload: { coverage_type: "AUTO_LIABILITY", effective_on: "2026-01-01", expires_on: "2027-01-01", limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /haul-contractors/${hc_id}/insurance-certificates"
              payload: { coverage_type: "WORKERS_COMP", effective_on: "2026-01-01", expires_on: "2027-01-01", limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "GET /haul-contractors/${hc_id}"
              payload: {}
              as: SettlementAccountant
              as_user_id: "acct-1"
              captures: { hc_v1: $.data.version }
            - call: "POST /settlement-statements"
              payload: { haul_contractor_id: "${hc_id}", period_start: "2026-08-01", period_end: "2026-08-31", expected_haul_contractor_version: "${hc_v1}" }
              as: SettlementAccountant
              as_user_id: "acct-1"
