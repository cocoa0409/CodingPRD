            - "p1_posture2 == \"EXHAUSTED\" after reaching exactly 20480 MB"
            - "the final ingest returns 409 and error_id == ERR_MACHINE_POSTURE_BLOCKED (EXHAUSTED blocks the next batch)"

      - name: warranty_coverage_at_exactly_ninety_percent
        grounds:
          - calculations.warranty_data_coverage
          - endpoints.POST_/agdata/warranty-claims/{id}/submit
