            - call: "GET /signal-ops/retiming-projects/${p1_id}/travel-time-runs"
              payload: { study_role: "BEFORE", direction: "NB" }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { nb_run_a_started: "$.data[0].started_at", nb_run_b_started: "$.data[1].started_at" }
          assert:
            - "${run1_recorded} == 2026-08-01T00:00:00Z (recorded_at is the logical clock, NOT started_at)"
            - "PROPER OVERLAP: HTTP 409 with ${err_overlap} == ERR_RUN_SPACING_VIOLATION (09:03:00 falls inside [09:00:00, 09:05:20])"
            - "TOUCHING ENDPOINTS ARE REJECTED (gap 0, closed intervals): HTTP 409 with ${err_touching} == ERR_RUN_SPACING_VIOLATION — the exact opposite of the adjacency rule for timing-plan windows"
            - "ONE SECOND INSIDE THE BUFFER: HTTP 409 with ${err_gap_119} == ERR_RUN_SPACING_VIOLATION (gap 09:07:19 - 09:05:20 == 119 s < 120 s)"
            - "THE BUFFER APPLIES ON THE EARLIER SIDE TOO: HTTP 409 with ${err_before_side} == ERR_RUN_SPACING_VIOLATION (that run ends 08:59:20, only 40 s before the stored run starts)"
            - "RESOURCE KEY INCLUDES direction: the SB run at 09:03:00 is ACCEPTED with ${sb_direction} == SB and ${sb_started} == 2026-07-15T09:03:00Z despite overlapping the NB interval outright"
            - "EXACTLY AT THE BUFFER, ACCEPTED: the run at ${gap_120_started} == 2026-07-15T09:07:20Z is created (gap == 120 s satisfies >= 120)"
            - "the filtered NB/BEFORE list holds exactly 2 rows — ${nb_run_a_started} and ${nb_run_b_started} are 2026-07-15T09:00:00Z and 2026-07-15T09:07:20Z in some order — so all four refusals wrote nothing"

  # =============================================================================================
  # RULE 9 — compensating_invariant
  # =============================================================================================
  - rule_id: compensating_invariant
    instances:
      - name: plan_return_conserves_split_seconds_against_the_drafted_total
        grounds:
          - state_machines.TimingPlan.SUBMITTED_to_DRAFT
          - calculations.timing_plan_split_rescale
          - entities.TimingPlan.fields.drafted_split_total_sec
          - entities.TimingPlan.fields.effective_split_total_sec
          - entities.TimingPlan.fields.drafted_cycle_length_sec
          - entities.TimingPlan.fields.return_count
        distinguishing_aspect: |
          CONSERVED QUANTITY 1 — SPLIT SECONDS, i.e. a continuous per-phase allocation whose sum must
          equal a cycle length exactly, with no drift. The forward action (the coordinate pipeline)
          overwrites the cycle 90 -> 105, rescales every phase 21/21/22/22 -> 26/25/27/27, assigns an
          offset and mints pedestrian checks; the compensating action (return) must undo ALL of it, so
          that afterwards effective_split_total_sec == drafted_split_total_sec == 86 == the sum of the
          untouched split_sec values, cycle_length_sec == drafted_cycle_length_sec == 90, offset 0 and
          zero pedestrian-check rows. The trap is the rescale residual: the -1 second that step 4
          applied to phase 2 is invisible in any total, so an implementation that restores three of the
          four phases still balances the sum-of-effective check unless the per-phase values are
          compared individually — which is why both the totals AND all four per-phase values are pinned.
          The invariant is then re-verified by re-running the pipeline: the second coordinate produces
          exactly the same numbers as the first, proving the restore left no hidden residue.
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Project p1 on corridor c1 (single READY member i1) reaches PLAN_DEVELOPMENT; plan pl1 is drafted at cycle 90 with splits {1:21, 2:21, 4:22, 6:22} (drafted total 86) and min_green {1:10, 2:15, 4:12, 6:10}."
            - "Phase 4 is a pedestrian phase with crosswalk_length_ft 62.0, walk_sec 4.0 and ped_clear_sec 17.8, so the coordinate pipeline mints exactly one PASS check."
            - "The coordinate pipeline runs (cycle -> 105, effective splits -> {1:26, 2:25, 4:27, 6:27}, offset 0, one PASS check, ped_compliance_state COMPLIANT) and the plan is SUBMITTED."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET", detection_status: "FULL", comm_status: "ONLINE", aps_installed: false, walking_speed_standard: "STD_3_5_FPS", max_cycle_length_sec: 150 }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/screen"
              payload: {}
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/selection-decision"
              payload: { decision: "SELECT", rationale: "Oldest arterial timing plans in the program" }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/retiming-projects"
              payload: { corridor_id: "${c1_id}", study_window_start_at: "2026-07-01T00:00:00Z", study_window_days: 180, lead_engineer_user_id: "eng-1" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_id: $.data.id }
            - call: "POST /signal-ops/intersections/${i1_id}/turning-movement-counts"
              payload: { project_id: "${p1_id}", study_role: "BEFORE", count_date: "2026-07-15T00:00:00Z", period: "AM_PEAK", phase_volumes: { "1": 350, "2": 500, "4": 250, "6": 180 } }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/travel-time-runs"
              payload: { study_role: "BEFORE", direction: "NB", started_at: "2026-07-15T09:00:00Z", duration_sec: 320, stops_count: 5, arrivals_on_green_count: 4, total_arrivals: 12 }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/advance"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_v_adv: $.data.version }
            - call: "POST /signal-ops/timing-plans"
              payload: { project_id: "${p1_id}", intersection_id: "${i1_id}", tod_period: "AM_PEAK", tod_start_min: 360, tod_end_min: 540, coordination_ref: "MASTER", cycle_length_sec: 90, expected_project_version: "${p1_v_adv}" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { pl1_id: $.data.id, pl1_drafted_cycle: $.data.drafted_cycle_length_sec, pl1_returns_initial: $.data.return_count }
            - call: "POST /signal-ops/timing-plans/${pl1_id}/phase-splits"
              payload: { phase_number: 1, split_sec: 21, min_green_sec: 10, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${pl1_id}/phase-splits"
              payload: { phase_number: 2, split_sec: 21, min_green_sec: 15, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${pl1_id}/phase-splits"
              payload: { phase_number: 4, split_sec: 22, min_green_sec: 12, yellow_sec: 3.0, red_clearance_sec: 1.0, is_pedestrian_phase: true, walk_sec: 4.0, ped_clear_sec: 17.8, crosswalk_length_ft: 62.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${pl1_id}/phase-splits"
              payload: { phase_number: 6, split_sec: 22, min_green_sec: 10, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/coordinate"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "GET /signal-ops/timing-plans/${pl1_id}/phase-splits"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { fwd_p1: "$.data[0].effective_split_sec", fwd_p2: "$.data[1].effective_split_sec", fwd_p4: "$.data[2].effective_split_sec", fwd_p6: "$.data[3].effective_split_sec" }
            - call: "POST /signal-ops/timing-plans/${pl1_id}/submit"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { pl1_cycle_fwd: $.data.cycle_length_sec, pl1_eff_total_fwd: $.data.effective_split_total_sec, pl1_drafted_total: $.data.drafted_split_total_sec }
          trigger:
            - call: "POST /signal-ops/timing-plans/${pl1_id}/return"
              payload: { reason: "Offset needs re-checking against the master clock" }
              as: CertifyingEngineer
              as_user_id: "cert-1"
              captures: { pl1_status_back: $.data.status, pl1_cycle_back: $.data.cycle_length_sec, pl1_offset_back: $.data.offset_sec, pl1_ped_back: $.data.ped_compliance_state, pl1_eff_total_back: $.data.effective_split_total_sec, pl1_drafted_total_back: $.data.drafted_split_total_sec, pl1_returns: $.data.return_count }
            - call: "GET /signal-ops/timing-plans/${pl1_id}/phase-splits"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { back_p1: "$.data[0].effective_split_sec", back_p2: "$.data[1].effective_split_sec", back_p4: "$.data[2].effective_split_sec", back_p6: "$.data[3].effective_split_sec", split_p1: "$.data[0].split_sec", split_p2: "$.data[1].split_sec", split_p4: "$.data[2].split_sec", split_p6: "$.data[3].split_sec" }
            - call: "POST /signal-ops/retiming-projects/${p1_id}/coordinate"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "GET /signal-ops/timing-plans/${pl1_id}/phase-splits"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { redo_p1: "$.data[0].effective_split_sec", redo_p2: "$.data[1].effective_split_sec", redo_p4: "$.data[2].effective_split_sec", redo_p6: "$.data[3].effective_split_sec" }
          assert:
            - "${pl1_drafted_cycle} == 90 and ${pl1_returns_initial} == 0"
            - "FORWARD: ${pl1_cycle_fwd} == 105, ${fwd_p1} == 26, ${fwd_p2} == 25, ${fwd_p4} == 27, ${fwd_p6} == 27, ${pl1_eff_total_fwd} == 105"
            - "FORWARD: ${pl1_drafted_total} == 86 (the drafted total is never rewritten by the pipeline)"
            - "COMPENSATED: ${pl1_status_back} == DRAFT and ${pl1_returns} == 1"
            - "COMPENSATED: ${pl1_cycle_back} == 90 == drafted_cycle_length_sec"
            - "COMPENSATED: ${pl1_offset_back} == 0 and ${pl1_ped_back} == PENDING"
            - "INVARIANT: ${pl1_eff_total_back} == 86 and ${pl1_drafted_total_back} == 86, i.e. effective_split_total_sec == drafted_split_total_sec exactly"
            - "PER-PHASE, NOT JUST THE TOTAL: ${back_p1} == 21, ${back_p2} == 21, ${back_p4} == 22, ${back_p6} == 22"
            - "PER-PHASE: each restored effective_split_sec equals its own split_sec — ${back_p1} == ${split_p1}, ${back_p2} == ${split_p2}, ${back_p4} == ${split_p4}, ${back_p6} == ${split_p6}"
            - "${back_p1} + ${back_p2} + ${back_p4} + ${back_p6} == 86 (no drift: the -1 rescale residual on phase 2 is gone, not parked somewhere else)"
            - "GET /signal-ops/timing-plans/${pl1_id}/pedestrian-checks returns 0 rows"
            - "REPLAYABLE: re-running the pipeline reproduces the forward state byte for byte — ${redo_p1} == 26, ${redo_p2} == 25, ${redo_p4} == 27, ${redo_p6} == 27"
            - "TimingPlan.${pl1_id}.cycle_length_sec == 105 and TimingPlan.${pl1_id}.effective_split_total_sec == 105 after the replay, with drafted_cycle_length_sec still 90 and drafted_split_total_sec still 86"

      - name: project_abandonment_conserves_the_corridor_complaint_partition
        grounds:
          - state_machines.CitizenComplaint.LINKED_to_OPEN
          - state_machines.RetimingProject.PLAN_DEVELOPMENT_to_ABANDONED
          - entities.Corridor.fields.complaint_open_count
          - entities.Corridor.fields.complaint_linked_count
          - entities.Corridor.fields.complaint_terminal_count
          - entities.Corridor.fields.complaint_total_count
          - entities.Requester.fields.open_complaint_count
        distinguishing_aspect: |
          CONSERVED QUANTITY 2 — a COUNT PARTITION, a discrete quantity of a completely different kind
          from instance 1's continuous seconds: three disjoint buckets on the Corridor whose sum must
          always equal complaint_total_count, plus a second independent counter on the Requester that
          must NOT move at all (LINKED already counts as open for the requester, so the compensation is
          a no-op there — the classic double-decrement bug). The forward action moves one unit
          open -> linked; the compensating action (abandoning the project) must move exactly that unit
          back, leaving reopen_count as the only lasting trace. A second complaint that was closed
          NO_ACTION sits in the terminal bucket throughout and must be untouched by either action, so
          the sum is checked at three distinct moments rather than only at the end.
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Corridor c1 (ARTERIAL, annual_volume_change_pct 20.0) is SELECTED with a single READY member i1, and project p1 is created and advanced to PLAN_DEVELOPMENT."
            - "Requester r1 files two complaints on c1: x1 (COORDINATION) is TRIAGED, x2 (DETECTION) is closed with NO_ACTION."
