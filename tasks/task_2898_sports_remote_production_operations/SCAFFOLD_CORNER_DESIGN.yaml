            - call: "POST /broadcast-ops/path-bookings/${booking_id}/schedule-test"
              payload: { test_window_start_utc: "2026-08-15T12:00:00Z", test_window_end_utc: "2026-08-15T13:00:00Z" }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T12:30:00Z" }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/path-bookings/${booking_id}/test-result"
              payload: { outcome: "PASS" }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/system-preps"
              payload: { production_id: "${prod_id}", data_feed_id: "${feed_id}", system_kind: "GRAPHICS" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { prep_id: $.data.id }
            - call: "POST /broadcast-ops/system-preps/${prep_id}/validate-feed"
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "GET /broadcast-ops/productions/${prod_id}"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { pv_c: $.data.version }
            - call: "POST /broadcast-ops/crew-calls"
              payload: { production_id: "${prod_id}", crew_member_id: "${cm1_id}", call_time_utc: "2026-08-15T14:00:00Z", scheduled_release_utc: "2026-08-16T00:00:00Z", expected_production_version: "${pv_c}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { call1_id: $.data.id }
            - call: "GET /broadcast-ops/productions/${prod_id}"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { pv_d: $.data.version }
            - call: "POST /broadcast-ops/crew-calls"
              payload: { production_id: "${prod_id}", crew_member_id: "${cm2_id}", call_time_utc: "2026-08-15T14:00:00Z", scheduled_release_utc: "2026-08-16T00:00:00Z", expected_production_version: "${pv_d}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { call2_id: $.data.id }
            - call: "POST /broadcast-ops/crew-calls/${call1_id}/respond"
              payload: { decision: "ACCEPT" }
              as: CrewMember
              as_user_id: "${cm1_id}"
            - call: "POST /broadcast-ops/crew-calls/${call2_id}/respond"
              payload: { decision: "ACCEPT" }
              as: CrewMember
              as_user_id: "${cm2_id}"
            - call: "POST /broadcast-ops/rehearsals"
              payload: { production_id: "${prod_id}", scheduled_start_utc: "2026-08-15T16:00:00Z" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { reh_id: $.data.id }
            - call: "POST /broadcast-ops/rehearsals/${reh_id}/outcome"
              payload: { outcome: "COMPLETED", camera_blocking_positions_cleared: 2, venue_signoff: true, league_ops_signoff: true }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/show-executions"
              payload: { production_id: "${prod_id}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { show_id: $.data.id }
            - call: "POST /broadcast-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T18:00:00Z" }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/show-executions/${show_id}/air-status"
              payload: { target_air_status: "ON_AIR" }
              as: TechnicalDirector
              as_user_id: "td-001"

          trigger:
            - call: "POST /broadcast-ops/show-executions/${show_id}/incidents"
              payload: { kind: "WEATHER_HOLD", started_at_utc: "2026-08-15T18:05:00Z", duration_minutes: 5, severity: "MINOR" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { inc1: $.data.id }
            - call: "POST /broadcast-ops/show-executions/${show_id}/incidents"
              payload: { kind: "TECHNICAL_FAILURE", started_at_utc: "2026-08-15T18:30:00Z", duration_minutes: 12, severity: "MAJOR" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { inc2: $.data.id }
            - call: "POST /broadcast-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T20:00:00Z" }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/show-executions/${show_id}/incidents"
              payload: { kind: "TECHNICAL_FAILURE", started_at_utc: "2026-08-15T19:50:00Z", duration_minutes: 8, severity: "CRITICAL" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { inc3: $.data.id }
            - call: "POST /broadcast-ops/show-executions/${show_id}/air-status"
              payload: { target_air_status: "ON_AIR" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { err: $.data.error_id }
            - call: "POST /broadcast-ops/show-executions/${show_id}/incidents"
              payload: { kind: "TECHNICAL_FAILURE", started_at_utc: "2026-08-15T20:05:00Z", duration_minutes: 1, severity: "MINOR" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { err2: $.data.error_id }
          assert:
            - "After the WEATHER_HOLD: weather_hold_minutes == 5, technical_downtime_minutes == 0, extended_play_minutes == 0, air_status still ON_AIR"
            - "After the 12-minute failure: technical_downtime_minutes == 12 (below the 20 threshold) and air_status still ON_AIR with off_air_at_utc == null"
            - "After the 8-minute failure: technical_downtime_minutes == 20 - equality trips the threshold - so air_status == OFF_AIR"
            - "off_air_at_utc == 2026-08-15T20:00:00.000Z (the logical clock, not the incident's 19:50 start) and air_minutes_total == 120 (18:00 -> 20:00)"
            - "Production.${prod_id}.status is still ON_AIR (the forced off-air does not wrap the production)"
            - "Re-arming the show: HTTP 409 with error_id == ERR_SHOW_STATE_INVALID - OFF_AIR is terminal for the air dimension, so the accumulator never resets"
            - "A further TECHNICAL_FAILURE incident on the OFF_AIR show: HTTP 409 with error_id == ERR_SHOW_STATE_INVALID, and technical_downtime_minutes is still 20"
            - "All three incidents are listed by GET /broadcast-ops/show-executions/${show_id}/incidents with total_count == 3, and the kind filter returns 2 for TECHNICAL_FAILURE"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: gating_writes_expose_their_cascade_in_the_same_response_cycle
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /broadcast-ops/venue-surveys/{id}/review].side_effects
        distinguishing_aspect: |
          The model is immediate, so a single review call must leave nothing to settle later: the
          survey row it returns is already APPROVED, and the very next read of the production - with no
          intervening write, no polling and no delay - already shows SURVEYED with both readiness
          variants at 40.00. An implementation that recomputes readiness lazily on the next mutation
          instead of inside the transaction fails on the first read, not on a later one.
        test_recipe:
          setup:
            - "A TIER_3 production with a two-position SUBMITTED survey (submitted by td-001)."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id, pv1: $.data.version }
            - call: "POST /broadcast-ops/venue-surveys"
              payload: { production_id: "${prod_id}", surveyor_name: "R. Ito", fiber_drops_required: 2 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { survey_id: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/camera-positions"
              payload: { label: "CAM-1", position_type: "HARD", cable_run_feet: 150, power_draw_amps: 30 }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/camera-positions"
              payload: { label: "CAM-2", position_type: "HANDHELD", cable_run_feet: 600, power_draw_amps: 30 }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/submit"
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { sstat: $.data.status }
          trigger:
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/review"
              payload: { decision: "APPROVE" }
              as: LeagueOperations
              as_user_id: "lo-001"
              captures: { approved_status: $.data.status }
            - call: "GET /broadcast-ops/productions/${prod_id}"
              as: LeagueOperations
              as_user_id: "lo-001"
              captures: { pstat: $.data.status, pre: $.data.readiness_score_preflight, cert: $.data.readiness_score_certified }
          assert:
            - "The review response itself already carries status == APPROVED and reviewed_by_user_id == lo-001 - no second call is needed to observe the transition"
            - "The immediately following read shows Production.${prod_id}.status == SURVEYED, readiness_score_preflight == 40.00 and readiness_score_certified == 40.00 (survey component only)"
            - "Production.${prod_id}.version > ${pv1}: the cascade that changed the production was committed with the review, not deferred"
            - "GET /broadcast-ops/productions/${prod_id}/venue-surveys shows the same survey as APPROVED in the same cycle, with camera_position_count == 2 and total_signal_loss_db == 10.13"
