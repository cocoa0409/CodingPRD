              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
            - call: "POST /cosmetology/establishments/${est_id}/workstations"
              payload: { station_number: 1, station_type: "STYLING_CHAIR" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { ws_id: $.data.id, ws_v1: $.data.version }
            - call: "POST /cosmetology/booth-rentals"
              payload: { workstation_id: "${ws_id}", practitioner_id: "${prac_id}", rental_type: "BOOTH_RENTER_INDEPENDENT_CONTRACTOR", term_start_at: "2026-08-10T00:00:00Z", term_end_at: "2026-09-10T00:00:00Z", monthly_rent_cents: 70000, expected_workstation_version: "${ws_v1}" }
