    side_effects: ["status OPEN->CLOSED", "increments ReportingPeriod.version by 1"]

  # ---- Report ----
  - method: POST
    path: "/disclosure/committees/{id}/reports"
    description: "Create/refresh a DRAFT report for a (committee, period) with provisional totals; supersedes any prior DRAFT for that period. OCC-guarded on the committee."
    roles: [Treasurer]
    code: 201
    input: [period_id, expected_committee_version]
    output: Report
    side_effects:
      - "any prior DRAFT report for the same (committee, period) -> SUPERSEDED"
      - "new Report created DRAFT with PROVISIONAL total_receipts_cents / total_disbursements_cents / matching_funds_cents"
      - "increments Committee.version by 1"
  - method: GET
    path: "/disclosure/committees/{id}/reports"
    description: "List a committee's reports (reverse of Report.committee_id)."
    roles: [Treasurer, RegulatorAuditor, LobbyRegistrant, PublicViewer]
    code: 200
    input: ["status?", "period_id?", "limit?", "offset?"]
    output: Report[]
    side_effects: []
  - method: GET
    path: "/disclosure/reporting-periods/{id}/reports"
    description: "List reports covering a period (reverse of Report.period_id)."
    roles: [Treasurer, RegulatorAuditor, LobbyRegistrant, PublicViewer]
    code: 200
    input: ["committee_id?", "limit?", "offset?"]
    output: Report[]
    side_effects: []
  - method: GET
    path: "/disclosure/reports/{id}"
    description: "Fetch a report."
    roles: [Treasurer, RegulatorAuditor, LobbyRegistrant, PublicViewer]
    code: 200
    input: []
    output: Report
    side_effects: []
  - method: GET
    path: "/disclosure/reports/{id}/revisions"
