# =============================================================================
# §1.9: Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# waste-diversion-zero-waste
# Sections follow references/claim-extraction-guide.md. Instances already
# exercised by §1.8 are emitted as excluded_because stubs without test_recipe.
# =============================================================================

scaffold_corner_design:

  # ============================================================== Entities
  - section: entities
    instances:
      - name: site_create_applies_computed_defaults
        claim_type: creation_and_defaults
        grounds: [entities.Site.fields.certification_tier, entities.Site.fields.program_standing]
        distinguishing_aspect: "A newly created site carries computed defaults: certification_tier NONE, program_standing GOOD_STANDING, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site DEF", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id, tier: $.data.certification_tier, standing: $.data.program_standing, ver: $.data.version }
          trigger: []
          assert:
            - "tier == NONE"
            - "standing == GOOD_STANDING"
            - "ver == 1"

      - name: site_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND"]
        distinguishing_aspect: "GET with a well-formed but non-existent site id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /sites/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CertificationOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"
            - "http status == 404"

      - name: ticket_create_computes_net_weight
        claim_type: computed_fields
        grounds: [entities.WeightTicket.fields.net_weight_lbs]
        distinguishing_aspect: "net_weight_lbs is server-computed as gross - tare: gross 4200, tare 1200 -> 3000."
        test_recipe:
          setup:
            - "Site; vendor ACTIVE; contract ACTIVE"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site NW", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "HaulerCo", vendor_type: "HAULER" }
              as: CertificationOfficer
              captures: { vendor_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", material_stream: "MIXED_RECYCLABLES", rebate_per_ton_cents: 10000, contamination_penalty_per_ton_cents: 2000, window_start: "2026-01-01", window_end: "2026-12-31" }
              as: SustainabilityManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: SustainabilityManager
          trigger:
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "RECYCLING", gross_weight_lbs: 4200, tare_weight_lbs: 1200, ticket_date: "2026-08-05", external_ticket_ref: "NW-T1" }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { net: $.data.net_weight_lbs, st: $.data.validation_status }
          assert:
            - "net == 3000"
            - "st == PENDING"

      - name: ticket_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST"]
        distinguishing_aspect: "Omitting required external_ticket_ref yields ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Site; vendor; contract ACTIVE"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site MR", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "HaulerCo", vendor_type: "HAULER" }
              as: CertificationOfficer
              captures: { vendor_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", material_stream: "MIXED_RECYCLABLES", rebate_per_ton_cents: 10000, contamination_penalty_per_ton_cents: 2000, window_start: "2026-01-01", window_end: "2026-12-31" }
              as: SustainabilityManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: SustainabilityManager
          trigger:
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "RECYCLING", gross_weight_lbs: 4200, tare_weight_lbs: 1200, ticket_date: "2026-08-05" }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: ticket_create_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: ["validations[priority=3]", entities.WeightTicket.fields.disposal_route]
        distinguishing_aspect: "disposal_route 'COMPOST' is not in the declared enum set -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Site; vendor; contract ACTIVE"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site IE", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "HaulerCo", vendor_type: "HAULER" }
              as: CertificationOfficer
              captures: { vendor_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", material_stream: "MIXED_RECYCLABLES", rebate_per_ton_cents: 10000, contamination_penalty_per_ton_cents: 2000, window_start: "2026-01-01", window_end: "2026-12-31" }
              as: SustainabilityManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: SustainabilityManager
          trigger:
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "COMPOST", gross_weight_lbs: 4200, tare_weight_lbs: 1200, ticket_date: "2026-08-05", external_ticket_ref: "IE-T1" }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: audit_immutable_common_fields_false
        claim_type: immutability
        grounds: [entities.WasteAudit]
        distinguishing_aspect: "WasteAudit declares common_fields: false — its response carries id and created_at but no version/updated_at, and no update or transition endpoint exists for it."
        test_recipe:
          setup: ["Site"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site AU", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /audits"
              payload: { site_id: "${site_id}", audit_date: "2026-08-06", auditor_name: "Aud A", stream_findings: [ { material_stream: "CARDBOARD", sampled_weight_lbs: 300, contamination_pct: 4 } ] }
              as: WasteAuditor
              captures: { audit_id: $.data.id }
          assert:
            - "response data has key 'id' and key 'created_at'"
            - "response data has NO key 'version' and NO key 'updated_at'"
            - "no PUT/PATCH/DELETE endpoint exists for /audits in §1.5"

      - name: provisional_vs_certified_rate_corner
        claim_type: computed_fields
        grounds: [entities.ScorecardPeriod.fields.diversion_rate_provisional_pct]
        excluded_because:
          difficulty_instance: diversion_rate_provisional_vs_certified
          rationale: "Both rate variants asserted with literal values in the named §1.8 instance."

      - name: audit_adjusted_settlement_corner
        claim_type: computed_fields
        grounds: [entities.ScorecardPeriod.fields.rebate_settled_cents]
        excluded_because:
          difficulty_instance: rebate_estimate_vs_audit_settlement
          rationale: "Estimate vs audit-adjusted settlement divergence asserted in the named §1.8 instance."

  # ============================================================== State Machines
  - section: state_machines
    instances:
      - name: initial_states_on_create
        claim_type: initial_state
        grounds: [state_machines.WeightTicket, state_machines.VendorContract, state_machines.SiteGoal, state_machines.ScorecardPeriod, state_machines.CertificationApplication]
        distinguishing_aspect: "Every stateful entity starts in its declared initial_state: contract DRAFT, ticket PENDING, goal ACTIVE, period OPEN, application DRAFT."
        test_recipe:
          setup: ["Site; vendor ACTIVE"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site IN", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id, site_v: $.data.version }
            - call: "POST /vendors"
              payload: { name: "HaulerCo", vendor_type: "HAULER" }
              as: CertificationOfficer
              captures: { vendor_id: $.data.id, vendor_st: $.data.status }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", material_stream: "MIXED_RECYCLABLES", rebate_per_ton_cents: 10000, contamination_penalty_per_ton_cents: 2000, window_start: "2026-01-01", window_end: "2026-12-31" }
              as: SustainabilityManager
              captures: { contract_id: $.data.id, contract_st: $.data.status }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: SustainabilityManager
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "RECYCLING", gross_weight_lbs: 2000, tare_weight_lbs: 1000, ticket_date: "2026-08-05", external_ticket_ref: "IN-T1" }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { ticket_st: $.data.validation_status }
            - call: "POST /goals"
              payload: { site_id: "${site_id}", metric: "DIVERSION_RATE", target_value: 80, window_start: "2026-08-01", window_end: "2026-09-01" }
              as: SustainabilityManager
              captures: { goal_st: $.data.status }
            - call: "POST /scorecard_periods"
              payload: { site_id: "${site_id}", period_start: "2026-08-01", period_end: "2026-09-01" }
              as: CertificationOfficer
              captures: { period_id: $.data.id, period_st: $.data.status }
            - call: "POST /certification_applications"
              payload: { site_id: "${site_id}", level_requested: "BRONZE", reporting_period_id: "${period_id}", expected_site_version: "${site_v}" }
              as: SustainabilityManager
              captures: { app_st: $.data.status }
          trigger: []
          assert:
            - "vendor_st == ACTIVE"
            - "contract_st == DRAFT"
            - "ticket_st == PENDING"
            - "goal_st == ACTIVE"
            - "period_st == OPEN"
            - "app_st == DRAFT"

      - name: validate_already_validated_ticket_rejected
        claim_type: invalid_transition
        grounds: [state_machines.WeightTicket.PENDING_to_VALIDATED, "errors[ERR_TICKET_NOT_PENDING"]
        distinguishing_aspect: "A second validate on an already-VALIDATED ticket fails with ERR_TICKET_NOT_PENDING; no double accrual of totals or rebate."
        test_recipe:
          setup:
            - "Clock 2026-08-10; site; vendor; contract ACTIVE; period OPEN; T1 RECYCLING net 2000 VALIDATED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /sites"
              payload: { name: "Site VV", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "HaulerCo", vendor_type: "HAULER" }
              as: CertificationOfficer
              captures: { vendor_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", material_stream: "MIXED_RECYCLABLES", rebate_per_ton_cents: 10000, contamination_penalty_per_ton_cents: 2000, window_start: "2026-01-01", window_end: "2026-12-31" }
              as: SustainabilityManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: SustainabilityManager
            - call: "POST /scorecard_periods"
              payload: { site_id: "${site_id}", period_start: "2026-08-01", period_end: "2026-09-01" }
              as: CertificationOfficer
              captures: { period_id: $.data.id }
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "RECYCLING", gross_weight_lbs: 3000, tare_weight_lbs: 1000, ticket_date: "2026-08-05", external_ticket_ref: "VV-T1" }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /tickets/${t1_id}/validate"
              payload: {}
              as: DataSteward
          trigger:
            - call: "POST /tickets/${t1_id}/validate"
              payload: {}
              as: DataSteward
              captures: { err: $.data.error_id }
            - call: "GET /scorecard_periods/${period_id}"
              payload: {}
              as: CertificationOfficer
              captures: { total: $.data.total_waste_lbs_validated }
          assert:
            - "err == ERR_TICKET_NOT_PENDING"
            - "total == 2000  (no double accrual from the rejected second validate)"

      - name: voided_ticket_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.WeightTicket, "errors[ERR_TICKET_NOT_PENDING"]
        distinguishing_aspect: "VOIDED is terminal: validate on a VOIDED ticket fails and the ticket stays VOIDED."
        test_recipe:
          setup:
            - "Clock 2026-08-10; site; vendor; contract ACTIVE; period OPEN; T1 VALIDATED then VOIDED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /sites"
              payload: { name: "Site VT", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "HaulerCo", vendor_type: "HAULER" }
              as: CertificationOfficer
              captures: { vendor_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", material_stream: "MIXED_RECYCLABLES", rebate_per_ton_cents: 10000, contamination_penalty_per_ton_cents: 2000, window_start: "2026-01-01", window_end: "2026-12-31" }
              as: SustainabilityManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: SustainabilityManager
            - call: "POST /scorecard_periods"
              payload: { site_id: "${site_id}", period_start: "2026-08-01", period_end: "2026-09-01" }
              as: CertificationOfficer
              captures: { period_id: $.data.id }
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "RECYCLING", gross_weight_lbs: 3000, tare_weight_lbs: 1000, ticket_date: "2026-08-05", external_ticket_ref: "VT-T1" }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /tickets/${t1_id}/validate"
              payload: {}
              as: DataSteward
            - call: "POST /tickets/${t1_id}/void"
              payload: { reason: "entered twice" }
              as: DataSteward
          trigger:
            - call: "POST /tickets/${t1_id}/validate"
              payload: {}
              as: DataSteward
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_TICKET_NOT_PENDING"
            - "WeightTicket.${t1_id}.validation_status == VOIDED"

      - name: decide_approved_application_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CertificationApplication, "errors[ERR_APPLICATION_NOT_IN_REVIEW"]
        distinguishing_aspect: "APPROVED is decided-terminal for the decide endpoint: a second decide fails with ERR_APPLICATION_NOT_IN_REVIEW."
        test_recipe:
          setup:
            - "Clock 2026-08-10; full approval flow: ticket RECYCLING net 1000 VALIDATED; period CLOSED (rate 100.00); BRONZE application APPROVED by officer-1, submitted by mgr-1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /sites"
              payload: { name: "Site DA", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id, site_v: $.data.version }
            - call: "POST /vendors"
              payload: { name: "HaulerCo", vendor_type: "HAULER" }
              as: CertificationOfficer
              captures: { vendor_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", material_stream: "MIXED_RECYCLABLES", rebate_per_ton_cents: 10000, contamination_penalty_per_ton_cents: 2000, window_start: "2026-01-01", window_end: "2026-12-31" }
              as: SustainabilityManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: SustainabilityManager
            - call: "POST /scorecard_periods"
              payload: { site_id: "${site_id}", period_start: "2026-08-01", period_end: "2026-09-01" }
              as: CertificationOfficer
              captures: { period_id: $.data.id }
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "RECYCLING", gross_weight_lbs: 2000, tare_weight_lbs: 1000, ticket_date: "2026-08-05", external_ticket_ref: "DA-T1" }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /tickets/${t1_id}/validate"
              payload: {}
              as: DataSteward
            - call: "POST /scorecard_periods/${period_id}/close"
              payload: {}
              as: CertificationOfficer
            - call: "POST /certification_applications"
              payload: { site_id: "${site_id}", level_requested: "BRONZE", reporting_period_id: "${period_id}", expected_site_version: "${site_v}" }
              as: SustainabilityManager
              captures: { app_id: $.data.id }
            - call: "POST /certification_applications/${app_id}/submit"
              payload: {}
              as: SustainabilityManager
              as_user_id: "mgr-1"
            - call: "POST /certification_applications/${app_id}/start_review"
              payload: {}
              as: CertificationOfficer
            - call: "POST /certification_applications/${app_id}/decide"
              payload: { outcome: "APPROVED" }
              as: CertificationOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /certification_applications/${app_id}/decide"
              payload: { outcome: "REJECTED" }
              as: CertificationOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_APPLICATION_NOT_IN_REVIEW"
            - "CertificationApplication.${app_id}.status == APPROVED  (unchanged)"

      - name: cancel_achieved_goal_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.SiteGoal, "errors[ERR_INVALID_STATE"]
        distinguishing_aspect: "ACHIEVED is terminal: cancel on an ACHIEVED goal fails with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Clock 2026-08-10; site; vendor; contract ACTIVE; period OPEN; goal DIVERSION_RATE target 50 window [2026-08-01,2026-09-01); T1 RECYCLING net 1000 VALIDATED -> rate 100.00; close -> goal ACHIEVED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /sites"
              payload: { name: "Site GA", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "HaulerCo", vendor_type: "HAULER" }
              as: CertificationOfficer
              captures: { vendor_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", material_stream: "MIXED_RECYCLABLES", rebate_per_ton_cents: 10000, contamination_penalty_per_ton_cents: 2000, window_start: "2026-01-01", window_end: "2026-12-31" }
              as: SustainabilityManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: SustainabilityManager
            - call: "POST /scorecard_periods"
              payload: { site_id: "${site_id}", period_start: "2026-08-01", period_end: "2026-09-01" }
              as: CertificationOfficer
              captures: { period_id: $.data.id }
            - call: "POST /goals"
              payload: { site_id: "${site_id}", metric: "DIVERSION_RATE", target_value: 50, window_start: "2026-08-01", window_end: "2026-09-01" }
              as: SustainabilityManager
              captures: { goal_id: $.data.id }
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "RECYCLING", gross_weight_lbs: 2000, tare_weight_lbs: 1000, ticket_date: "2026-08-05", external_ticket_ref: "GA-T1" }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /tickets/${t1_id}/validate"
              payload: {}
              as: DataSteward
            - call: "POST /scorecard_periods/${period_id}/close"
              payload: {}
              as: CertificationOfficer
          trigger:
            - call: "POST /goals/${goal_id}/cancel"
              payload: {}
              as: SustainabilityManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "SiteGoal.${goal_id}.status == ACHIEVED  (unchanged)"

      - name: application_revise_rejected_returns_to_draft
        claim_type: valid_transition
        grounds: [state_machines.CertificationApplication.REJECTED_to_DRAFT]
        distinguishing_aspect: "REJECTED -> DRAFT -> SUBMITTED revision loop: revise clears submitted_by/decided_by and allows a fresh submit."
        test_recipe:
          setup:
