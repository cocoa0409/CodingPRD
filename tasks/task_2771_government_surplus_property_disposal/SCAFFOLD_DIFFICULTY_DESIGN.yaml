          assert:
            - "hop 1: TransferOrder.${to_p}.status == VOIDED with void_reason recorded; ACKNOWLEDGED is a legal void source, not only ISSUED"
            - "hop 2 (caused by hop 1): ScreeningRequest.${r_a}.status == DENIED with denial_reason == TRANSFER_VOIDED"
            - "hop 3 (caused by hop 2): ScreeningCycle.${cyc_p}.status == OPEN with awarded_at == null and awarded_by_user_id == null"
            - "hop 3 detail: ScreeningCycle.${cyc_p}.current_tier == ELIGIBLE_NONPROFIT and tier_advance_count == 2 — the tier is preserved, the cycle does not rewind to STATE_AGENCY"
            - "hop 3 detail: ScreeningCycle.${cyc_p}.tier_opened_at == 2026-08-03T00:00:00Z and tier_deadline_at == 2026-08-08T00:00:00Z"
            - "hop 4 (caused by hop 3): SurplusAsset.${asset_p}.disposition_status == SCREENING"
            - "one call, four rows written: TransferOrder.${to_p}.version == 3, ScreeningRequest.${r_a}.version == 3, ScreeningCycle.${cyc_p}.version == 5, SurplusAsset.${asset_p}.version == 5"
            - "scoping: ScreeningRequest.${r_b}.status == DENIED with denial_reason == LOST_AWARD and version == 2 — the already-denied sibling is not rewritten by the cascade"
            - "scoping: ScreeningCycle.${cyc_q}.status == OPEN, current_tier == LOCAL_GOVERNMENT, tier_advance_count == 1, version == 2 — the control cycle on the same turn-in is untouched"
            - "scoping: SurplusAsset.${asset_q}.disposition_status == SCREENING and version == 3"
            - "scoping: TurnIn.${ti1}.status == ACCEPTED — no bubble-up fires because no asset became terminal"

      - name: tc_bidder_debarment_five_hop_unwind
        grounds:
          - endpoints[POST /bidders/{id}/status]
          - state_machines.Bidder.REGISTERED_to_DEBARRED
          - state_machines.Bid.WINNING_to_RETRACTED
          - state_machines.AuctionLot.CLOSED_MET_to_CLOSED_NO_SALE
          - state_machines.SaleInvoice.PARTIALLY_PAID_to_VOIDED
          - state_machines.SurplusAsset.SOLD_to_AUCTION_ELIGIBLE
          - entities.Bidder.fields.deposit_held_cents
        distinguishing_aspect: |
          Debarment unwinds a completed sale five hops deep — Bidder -> Bid -> AuctionLot -> SaleInvoice
          -> SurplusAsset — and the fifth hop is a money movement rather than a state change: the
          deposit that had been applied to the voided invoice returns to deposit_held_cents. Unlike the
          transfer-order cascade, this chain runs backwards along the auction pipeline and restores a
          non-terminal disposition (SOLD -> AUCTION_ELIGIBLE) so the asset can be relisted.
        test_recipe:
          setup:
            - "logical clock advanced 2026-08-01 -> 2026-09-01 -> 2026-09-05T00:00:00Z"
            - "one STATE_AGENCY organization DOT-01 with an ACCEPTED turn-in holding one rack server (fair_market_value_cents 985946)"
