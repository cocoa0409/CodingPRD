    input: []
    output: ProductionLot
    side_effects:
      - "status IN_PROCESS -> RELEASED; moves units_wip into units_released and sets released_at = logical clock"
      - "recomputes the product's dhf_retention_until / retention_anchor_source (LOT_RELEASE candidate)"
    errors: [ERR_PRODUCTION_LOT_NOT_FOUND, ERR_LOT_STATE_INVALID, ERR_NO_JOINT_SAMPLES, ERR_JOINT_SAMPLE_COUNT_SHORT, ERR_JOINT_INTEGRITY_FAILURE, ERR_CONFORMANCE_BELOW_MINIMUM]

  - method: POST
    path: /ladder-ops/production-lots/{id}/quarantine
    roles: [ProductionSupervisor, ComplianceOfficer, SafetyDirector]
    input: [reason_code]
    output: ProductionLot
    side_effects:
      - "status IN_PROCESS or RELEASED -> QUARANTINED; moves units_wip / units_released into units_quarantined and sets quarantine_reason_code"
      - "cascade depth 5: ConsumerRegistrations of the lot get hold_flag = true and product.held_registration_count is recomputed; a RETAIL_RELEASED product moves to STOP_SHIP (LOT_QUARANTINE); LISTED listings move to SUSPENDED (STOP_SHIP_CASCADE); PLANNED campaigns move to CANCELLED; their HELD reservations move to CANCELLED with bench minutes released"
    errors: [ERR_PRODUCTION_LOT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_LOT_STATE_INVALID]

  - method: POST
    path: /ladder-ops/production-lots/{id}/disposition
    roles: [ProductionSupervisor, SafetyDirector]
    input: [disposition]
    output: ProductionLot
    side_effects:
      - "disposition RELEASE: status QUARANTINED -> RELEASED; units_quarantined moves back into units_released; hold_flag cleared on the lot's registrations and product.held_registration_count recomputed"
      - "disposition SCRAP: status QUARANTINED -> SCRAPPED; units_quarantined moves into units_scrapped; the lot leaves every recall exposure basis"
    errors: [ERR_PRODUCTION_LOT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_LOT_STATE_INVALID, ERR_SCRAP_REQUIRES_SAFETY_DIRECTOR, ERR_JOINT_INTEGRITY_FAILURE, ERR_CONFORMANCE_BELOW_MINIMUM]

