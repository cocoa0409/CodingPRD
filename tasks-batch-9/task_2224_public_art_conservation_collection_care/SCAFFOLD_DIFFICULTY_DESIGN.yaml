      - name: quorum_of_all_abstain_ballots_leaves_an_empty_decision_denominator
        grounds:
          - state_machines.DeaccessionCase.BOARD_REVIEW_to_DENIED
          - entities.DeaccessionCase.fields.decision_ratio
          - entities.DeaccessionCase.fields.abstain_count
          - endpoints["POST /public-art/deaccession-cases/{id}/votes"]
        distinguishing_aspect: |
          Empty-collection boundary on a different endpoint (POST .../votes): five ABSTAIN ballots meet
          QUORUM_MIN_VOTES 5, yet the set of decisive ballots is empty so approve_count + deny_count
          is zero. decision_ratio is defined as exactly 0 and the case must auto-tally to DENIED rather
          than divide by zero, stay in BOARD_REVIEW, or fall through to APPROVED.
        test_recipe:
          setup:
            - "artist with moral_rights_waiver_on_file true and one BRONZE artwork at an URBAN site"
            - "a DeaccessionCase with disposition TRANSFER and a disposition_target_ref, advanced to BOARD_REVIEW after the comment period closed on 2026-09-15"
            - "four ABSTAIN ballots already cast by acm-1..acm-4, so the case is one ballot short of quorum"
            - "logical clock standing at 2026-09-15T00:00:00Z"
          setup_api_calls:
            - call: "POST /public-art/artists"
              payload: { full_name: "Ada Vance", is_living: true, contact_email: "ada@example.gov", moral_rights_waiver_on_file: true }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artist_id: $.data.id }
            - call: "POST /public-art/sites"
              payload: { site_code: "PLZ-1", name: "Civic Plaza", address_ref: "1 Civic Center", exposure_class: "URBAN", capacity_units: 20, concurrent_work_capacity: 1 }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { site_id: $.data.id }
            - call: "POST /public-art/artworks"
              payload: { accession_number: "2024.001", title: "Standing Figure", artist_id: "${artist_id}", site_id: "${site_id}", material_class: "BRONZE", significance_tier: "LANDMARK", footprint_units: 6, insured_value_cents: 12000000, acquisition_date: "2014-06-01", acquisition_document_ref: "DEED-2014-001", recognized_stature: false }
              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artwork_id: $.data.id }
            - call: "POST /public-art/deaccession-cases"
              payload: { artwork_id: "${artwork_id}", criteria: ["LACK_OF_RELEVANCE"], disposition: "TRANSFER", disposition_target_ref: "County Historical Society", comment_days: 45 }
              as: PublicArtManager
              as_user_id: "mgr-1"
              captures: { case_id: $.data.id }
            - call: "POST /public-art/deaccession-cases/${case_id}/advance"
              payload: { advance_note: "open public comment" }
              as: PublicArtManager
              as_user_id: "mgr-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PublicArtManager
              as_user_id: "mgr-1"
            - call: "POST /public-art/deaccession-cases/${case_id}/advance"
              payload: { advance_note: "comment period closed" }
              as: PublicArtManager
              as_user_id: "mgr-1"
            - call: "POST /public-art/deaccession-cases/${case_id}/votes"
              payload: { ballot: "ABSTAIN", ballot_note: "no position" }
              as: ArtCommissionMember
              as_user_id: "acm-1"
            - call: "POST /public-art/deaccession-cases/${case_id}/votes"
              payload: { ballot: "ABSTAIN" }
              as: ArtCommissionMember
              as_user_id: "acm-2"
            - call: "POST /public-art/deaccession-cases/${case_id}/votes"
              payload: { ballot: "ABSTAIN" }
              as: ArtCommissionMember
              as_user_id: "acm-3"
            - call: "POST /public-art/deaccession-cases/${case_id}/votes"
              payload: { ballot: "ABSTAIN" }
              as: ArtCommissionMember
              as_user_id: "acm-4"
          trigger:
            - call: "POST /public-art/deaccession-cases/${case_id}/votes"
              payload: { ballot: "ABSTAIN" }
              as: ArtCommissionMember
              as_user_id: "acm-5"
          assert:
            - "before the trigger DeaccessionCase.${case_id}.status == BOARD_REVIEW and decision_ratio is null"
            - "after the trigger DeaccessionCase.${case_id}.abstain_count == 5 with approve_count == 0 and deny_count == 0"
            - "DeaccessionCase.${case_id}.decision_ratio == 0"
            - "DeaccessionCase.${case_id}.status == DENIED"
            - "no server error is raised for the zero denominator and Artwork.${artwork_id}.custody_status == ON_VIEW"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: proposal_approval_depends_on_artist_consultation_state
        grounds:
          - state_machines.TreatmentProposal.SUBMITTED_to_APPROVED
          - state_machines.ArtistConsultation.PENDING_to_OBJECTED
          - validations[priority=17]
          - errors[ERR_ARTIST_OBJECTION_UNRESOLVED]
        distinguishing_aspect: |
          Entity pair TreatmentProposal x ArtistConsultation: approving a proposal that alters the work's
          appearance is legal only while the linked consultation sits in {CONCURRED, LAPSED}. Nothing
          about the proposal itself changes when the artist objects, yet the transition must be refused,
          and the reserved funding must remain untouched so the blocker is unambiguously the other entity.
        test_recipe:
          setup:
            - "logical clock at its default 2026-08-01T00:00:00Z"
            - "living artist with no waiver, so Artwork.moral_rights_status is ACTIVE"
            - "a SUBMITTED TreatmentProposal with alters_appearance true, estimate 683269, fully funded by a RESERVED 700000 allocation, on an eligible BRONZE conservator"
            - "an ArtistConsultation linked to that proposal that the artist answered with OBJECT, so its status is OBJECTED"
