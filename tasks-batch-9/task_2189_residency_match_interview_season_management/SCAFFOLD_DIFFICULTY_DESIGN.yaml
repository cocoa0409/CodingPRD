  # ===========================================================================
  # Rule 8 — Resource temporal overlap under DIFFERENT interval semantics
  #   instance 1 → half-open [start, end), NO buffer: exact adjacency ALLOWED
  #   instance 2 → closed [start, end], 48-hour buffer: exact adjacency REJECTED
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: interviewer_half_open_adjacency_allowed_but_one_hour_overlap_rejected
        grounds:
          - validations.priority_9.ERR_INTERVIEWER_DOUBLE_BOOKED
          - endpoints.POST_/interview-assignments
          - calculations.interviewer_load_index
        interval_semantics: "half-open [start_at, end_at), no buffer; touching endpoints do not intersect"
        distinguishing_aspect: |
          The same faculty member is offered two further slots against a held 13:00-16:00 seat. The
          16:00-18:00 slot touches the held seat exactly at 16:00 and MUST be accepted, because the
          interval is half-open and carries no buffer; the 15:00-17:00 slot overlaps by one hour and
          MUST be rejected. An implementation using closed intervals rejects the adjacency, and one
          that adds any buffer rejects it too — either way the first outcome flips.
        test_recipe:
          setup:
            - "one Program in INTERVIEWS_OPEN with one PLANNED wave"
            - "three slots: slot1 13:00-16:00, slot2 16:00-18:00 (adjacent), slot3 15:00-17:00 (overlapping)"
            - "faculty f1 holds an ASSIGNED LEAD seat on slot1 and no other assignment"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
            - call: "POST /programs"
              payload: { name: "Metro Internal Medicine", nrmp_program_code: "1140140M0", specialty_code: "IM", quota_positions: 2, visa_sponsorship_allowed: true, soap_participating: true, min_step2_score: 220, img_accepted: true }
              as: NrmpAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /faculty-members"
              payload: { program_id: "${prog_id}", full_name: "Alan Reyes", is_program_director: false, is_committee_member: true, conflict_applicant_ids: [] }
              as: ProgramCoordinator
              captures: { f1_id: $.data.id }
            - call: "POST /programs/${prog_id}/advance-phase"
              payload: { to_phase: "REVIEW_OPEN" }
              as: ProgramCoordinator
            - call: "POST /programs/${prog_id}/advance-phase"
              payload: { to_phase: "INTERVIEWS_OPEN" }
              as: ProgramCoordinator
            - call: "POST /interview-waves"
              payload: { program_id: "${prog_id}", wave_index: 1, invite_release_at: "2026-10-01T12:00:00Z", response_deadline_at: "2026-10-08T12:00:00Z", seat_capacity: 4 }
              as: ProgramCoordinator
              captures: { wave1_id: $.data.id }
            - call: "POST /interview-slots"
              payload: { wave_id: "${wave1_id}", start_at: "2026-10-05T13:00:00Z", end_at: "2026-10-05T16:00:00Z", room_label: "A-1", applicant_capacity: 4 }
              as: ProgramCoordinator
              captures: { slot1_id: $.data.id }
            - call: "POST /interview-slots"
              payload: { wave_id: "${wave1_id}", start_at: "2026-10-05T16:00:00Z", end_at: "2026-10-05T18:00:00Z", room_label: "A-2", applicant_capacity: 4 }
              as: ProgramCoordinator
              captures: { slot2_id: $.data.id }
            - call: "POST /interview-slots"
              payload: { wave_id: "${wave1_id}", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T17:00:00Z", room_label: "A-3", applicant_capacity: 4 }
              as: ProgramCoordinator
              captures: { slot3_id: $.data.id }
            - call: "POST /interview-assignments"
              payload: { slot_id: "${slot1_id}", faculty_member_id: "${f1_id}", panel_role: "LEAD" }
              as: ProgramCoordinator
              captures: { asg1_id: $.data.id }
          trigger:
            - call: "POST /interview-assignments"
              payload: { slot_id: "${slot2_id}", faculty_member_id: "${f1_id}", panel_role: "LEAD" }
              as: ProgramCoordinator
            - call: "POST /interview-assignments"
              payload: { slot_id: "${slot3_id}", faculty_member_id: "${f1_id}", panel_role: "LEAD" }
              as: ProgramCoordinator
          assert:
            - "before the trigger, FacultyMember.${f1_id}.scheduled_load == 4.50"
            - "the first trigger call (16:00 touches 16:00) returns HTTP 201 and creates an assignment in status ASSIGNED"
            - "after the first trigger call, FacultyMember.${f1_id}.scheduled_load == 7.50, i.e. 3h*1.5 plus 2h*1.5"
            - "the second trigger call (15:00-17:00 overlaps 13:00-16:00) returns HTTP 409 with error.error_id == ERR_INTERVIEWER_DOUBLE_BOOKED"
            - "after the second trigger call, GET /interview-assignments?faculty_member_id=${f1_id} returns exactly 2 rows"
            - "after the second trigger call, FacultyMember.${f1_id}.scheduled_load == 7.50, unchanged by the rejected call"

      - name: wave_closed_interval_requires_forty_eight_hour_buffer_both_directions
        grounds:
          - validations.priority_9.ERR_WAVE_WINDOW_CONFLICT
          - endpoints.POST_/interview-waves
          - global_constants.WAVE_MIN_GAP_HOURS
        interval_semantics: "closed [invite_release_at, response_deadline_at] with a mandatory WAVE_MIN_GAP_HOURS (48h) buffer on both sides; touching endpoints are REJECTED"
        distinguishing_aspect: |
          Deliberately the opposite semantics from the interviewer rule in the same scaffold. Against
          an existing wave window of [2026-10-01T12:00Z, 2026-10-08T12:00Z]: a new window starting
          exactly at the old deadline is REJECTED (0h gap), a 47-hour gap is REJECTED, a gap of
          exactly 48 hours is ACCEPTED because the comparison is >=, and the mirrored earlier-side
          case whose deadline plus 48h lands exactly on the old release instant is ACCEPTED too. An
          implementation that reuses the half-open interviewer predicate here accepts the 0h case.
        test_recipe:
          setup:
            - "one Program in INTERVIEWS_OPEN with exactly one existing wave, wave_index 1, window [2026-10-01T12:00:00Z, 2026-10-08T12:00:00Z]"
            - "no other wave exists, so every trigger call is evaluated against wave 1 alone"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
            - call: "POST /programs"
              payload: { name: "Metro Internal Medicine", nrmp_program_code: "1140140M0", specialty_code: "IM", quota_positions: 2, visa_sponsorship_allowed: true, soap_participating: true, min_step2_score: 220, img_accepted: true }
              as: NrmpAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/advance-phase"
              payload: { to_phase: "REVIEW_OPEN" }
              as: ProgramCoordinator
            - call: "POST /programs/${prog_id}/advance-phase"
              payload: { to_phase: "INTERVIEWS_OPEN" }
              as: ProgramCoordinator
            - call: "POST /interview-waves"
              payload: { program_id: "${prog_id}", wave_index: 1, invite_release_at: "2026-10-01T12:00:00Z", response_deadline_at: "2026-10-08T12:00:00Z", seat_capacity: 4 }
              as: ProgramCoordinator
              captures: { wave1_id: $.data.id }
          trigger:
            - call: "POST /interview-waves"
              payload: { program_id: "${prog_id}", wave_index: 2, invite_release_at: "2026-10-08T12:00:00Z", response_deadline_at: "2026-10-14T12:00:00Z", seat_capacity: 4 }
              as: ProgramCoordinator
            - call: "POST /interview-waves"
              payload: { program_id: "${prog_id}", wave_index: 2, invite_release_at: "2026-10-10T11:00:00Z", response_deadline_at: "2026-10-15T12:00:00Z", seat_capacity: 4 }
              as: ProgramCoordinator
            - call: "POST /interview-waves"
              payload: { program_id: "${prog_id}", wave_index: 2, invite_release_at: "2026-10-10T12:00:00Z", response_deadline_at: "2026-10-15T12:00:00Z", seat_capacity: 4 }
              as: ProgramCoordinator
            - call: "POST /interview-waves"
              payload: { program_id: "${prog_id}", wave_index: 3, invite_release_at: "2026-09-20T12:00:00Z", response_deadline_at: "2026-09-29T12:00:00Z", seat_capacity: 4 }
              as: ProgramCoordinator
          assert:
            - "the first trigger call (0h gap, exact adjacency at 2026-10-08T12:00:00Z) returns HTTP 409 with error.error_id == ERR_WAVE_WINDOW_CONFLICT"
            - "the second trigger call (47h gap) returns HTTP 409 with error.error_id == ERR_WAVE_WINDOW_CONFLICT"
            - "the third trigger call (exactly 48h gap: 2026-10-08T12:00:00Z + 48h == 2026-10-10T12:00:00Z) returns HTTP 201 with status PLANNED and issued_count 0"
            - "the fourth trigger call (earlier side, 2026-09-29T12:00:00Z + 48h == 2026-10-01T12:00:00Z) returns HTTP 201"
            - "after all four trigger calls, GET /interview-waves?program_id=${prog_id} returns exactly 3 waves, with wave_index 1, 2 and 3"

  # ===========================================================================
  # Rule 9 — Compensating invariants over DIFFERENT conserved quantities
  #   instance 1 → Program.invited_count, restored by closing the wave
  #   instance 2 → total booked seats, restored by rescheduling
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: invited_count_conserved_across_invitation_issue_and_wave_close
        grounds:
          - entities.Program.fields.invited_count
          - endpoints.POST_/interview-waves/{id}/invitations
          - endpoints.POST_/interview-waves/{id}/close
          - state_machines.InterviewInvitation.ISSUED_to_EXPIRED
          - state_machines.Application.INVITED_to_NOT_INVITED
        invariant: |
          Program.invited_count == count(Application rows of this program whose
          interview_status != NOT_INVITED), and InterviewWave.issued_count ==
          count(InterviewInvitation rows of the wave whose status == ISSUED or beyond.
          Both must hold before the forward action, after it, and after the compensating action.
        forward_action: "POST /interview-waves/{id}/invitations twice — invited_count 0 -> 2, issued_count 0 -> 2"
        compensating_action: "POST /interview-waves/{id}/close — every ISSUED invitation expires, both counters return to 0"
        distinguishing_aspect: |
          The compensating action reaches through the invitation rows to the applications and back to
          the Program counter, so an implementation that expires the invitations but forgets to
          revert Application.interview_status leaves invited_count stuck at 2 while zero
          applications are actually invited — the invariant is then violated even though the wave
          looks correctly closed.
