            - "error_id == ERR_STALE_VERSION"

      - name: pagination_defaults_applied_to_agents_list
        claim_type: pagination_with_filtering
        grounds: [response_envelope.pagination_defaults, "endpoints[GET /maa/airports/{aid}/agents]"]
        distinguishing_aspect: "Default limit=10, offset=0 applied; response carries total_count and has_more."
        test_recipe:
          setup:
            - "Airport with 12 agents created"
          setup_api_calls:
            - call: "POST /maa/airports"
              payload: { iata_code: "ELP", tz_offset_minutes: -360, meet_buffer_minutes: 15 }
              as: PlatformAdmin
              captures: { ap_id: $.data.id }
            # 12 agent creations — for brevity, the test loops 12 times; we model a single representative call here.
            - call: "POST /maa/airports/${ap_id}/agents"
              payload: { display_name: "Agent seed", tsa_cleared_until: "2027-01-01T00:00:00Z", ummr_certified: false, senior_trained: false, wc_certified: false, shift_start_utc: "2026-06-16T08:00:00Z", shift_end_utc: "2026-06-16T20:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /maa/airports/${ap_id}/agents"
              as: Dispatcher
          assert:
            - "response.meta contains total_count"
            - "response.meta contains has_more"
            - "when 12 agents exist, total_count == 12 AND has_more == true AND len(data) == 10 (default limit)"

