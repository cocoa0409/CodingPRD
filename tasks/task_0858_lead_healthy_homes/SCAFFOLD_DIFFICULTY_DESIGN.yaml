scaffold_difficulty_design:
  # =========================================================================
  # RULE 1 — dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_confirmed_reference_bll
        grounds:
          - calculations.case_reference_bll
          - calculations.case_priority_classification
          - entities.Case.fields.reference_basis
          - entities.Case.fields.priority_class
        distinguishing_aspect: |
          On the Case domain: the PROVISIONAL variant takes the capillary
          qualifying screen verbatim (46.0 -> CLASS_I) while the CONFIRMED
          variant takes the maximum VENOUS diagnostic (30.0 -> CLASS_II); the
          two variants yield a different reference_bll_ug_dl AND a different
          priority_class from the same child's tests.
        test_recipe:
          setup:
            - "A child with a pre-1978 dwelling; a capillary SCREENING test of 46.0 ug/dL opened a case (PROVISIONAL reference 46.0, priority CLASS_I)."
          setup_api_calls:
            - call: "POST /api/v1/dwellings"
              payload: { street_address: "12 Elm St", year_built: 1950, owner_name: "Acme LLC", jurisdiction: "COUNTY_A" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/v1/children"
              payload: { full_name: "Ada Child", date_of_birth: "2022-03-01", guardian_name: "G Ada", primary_dwelling_id: "${d_id}", income_tier: "VERY_LOW" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { ch_id: $.data.id }
            - call: "POST /api/v1/blood-lead-tests"
              payload: { child_id: "${ch_id}", bll_ug_dl: 46.0, specimen_type: "CAPILLARY", test_kind: "SCREENING", collected_at: "2026-05-02T10:00:00Z" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { t1_id: $.data.id }
            - call: "POST /api/v1/cases"
              payload: { child_id: "${ch_id}", dwelling_id: "${d_id}", qualifying_test_id: "${t1_id}" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /api/v1/blood-lead-tests"
              payload: { child_id: "${ch_id}", bll_ug_dl: 30.0, specimen_type: "VENOUS", test_kind: "DIAGNOSTIC", collected_at: "2026-05-04T10:00:00Z" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
          assert:
            - "At end of setup (PROVISIONAL): Case.${case_id}.reference_basis == PROVISIONAL AND reference_bll_ug_dl == 46.0 AND priority_class == CLASS_I"
            - "After the venous trigger (CONFIRMED): Case.${case_id}.reference_basis == CONFIRMED"
            - "Case.${case_id}.reference_bll_ug_dl == 30.0"
            - "Case.${case_id}.priority_class == CLASS_II"

      - name: estimated_vs_final_remediation_cost
        grounds:
          - calculations.remediation_cost_reconciliation
          - calculations.grant_subsidy
          - entities.RemediationProject.fields.estimated_cost_cents
          - entities.RemediationProject.fields.final_cost_cents
          - entities.GrantFund.fields.spent_cents
        distinguishing_aspect: |
          On the RemediationProject domain: ESTIMATED (income-tiered subsidy,
          625000) is reserved at APPROVE while FINAL (sum of actual line_items,
          400000) is booked at COMPLETE; the grant outlay is min(625000,400000)
          = 400000, so estimated and final diverge and available_cents recovers 225000.
        test_recipe:
          setup:
            - "A case with a 2-hazard ISSUED order; contractor ACTIVE; grant fund total 5000000; project APPROVED (estimated 625000 reserved) then STARTED and CLEARED."
          setup_api_calls:
            - call: "POST /api/v1/dwellings"
              payload: { street_address: "12 Elm St", year_built: 1950, owner_name: "Acme LLC", jurisdiction: "COUNTY_A" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/v1/children"
              payload: { full_name: "Ada Child", date_of_birth: "2022-03-01", guardian_name: "G Ada", primary_dwelling_id: "${d_id}", income_tier: "VERY_LOW" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { ch_id: $.data.id }
            - call: "POST /api/v1/blood-lead-tests"
              payload: { child_id: "${ch_id}", bll_ug_dl: 22.0, specimen_type: "VENOUS", test_kind: "DIAGNOSTIC", collected_at: "2026-05-02T10:00:00Z" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { t1_id: $.data.id }
            - call: "POST /api/v1/cases"
              payload: { child_id: "${ch_id}", dwelling_id: "${d_id}", qualifying_test_id: "${t1_id}" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { case_id: $.data.id }
            - call: "POST /api/v1/inspectors"
              payload: { full_name: "Ivy Inspector", certification_id_number: "RA-001" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { insp_id: $.data.id }
            - call: "POST /api/v1/investigations"
              payload: { case_id: "${case_id}", dwelling_id: "${d_id}", inspector_id: "${insp_id}", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T12:00:00Z" }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { inv_id: $.data.id }
            - call: "POST /api/v1/investigations/${inv_id}/findings"
              payload: { hazard_type: "PAINT", location: "north window", measurement_value: 120.0, severity: "HIGH" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /api/v1/investigations/${inv_id}/findings"
              payload: { hazard_type: "DUST", location: "living floor", measurement_value: 80.0, severity: "MODERATE" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /api/v1/investigations/${inv_id}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /api/v1/hazard-control-orders"
              payload: { case_id: "${case_id}" }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { order_id: "$.data[0].id" }
            - call: "POST /api/v1/contractors"
              payload: { business_name: "LeadAway Inc", rrp_certification_number: "RRP-77" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { con_id: $.data.id }
            - call: "POST /api/v1/contractors/${con_id}/certification"
              payload: { action: "ACTIVATE", expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /api/v1/grant-funds"
              payload: { fund_name: "HUD LHC 2026", fiscal_year: 2026, total_budget_cents: 5000000 }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { gf_id: $.data.id, gf_v: $.data.version }
            - call: "POST /api/v1/remediation-projects"
              payload: { order_id: "${order_id}", contractor_id: "${con_id}", grant_fund_id: "${gf_id}" }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { proj_id: $.data.id }
            - call: "POST /api/v1/remediation-projects/${proj_id}/approve"
              payload: { expected_grant_fund_version: "${gf_v}" }
              as: CaseManager
              as_user_id: "cm-1"
            - call: "POST /api/v1/remediation-projects/${proj_id}/start"
              payload: {}
              as: Contractor
              as_user_id: "${con_id}"
            - call: "POST /api/v1/hazard-control-orders/${order_id}/request-clearance"
              payload: {}
              as: Contractor
              as_user_id: "${con_id}"
            - call: "POST /api/v1/inspectors"
              payload: { full_name: "Cade Clearer", certification_id_number: "RA-002" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { insp2_id: $.data.id }
            - call: "POST /api/v1/clearance-tests"
              payload: { order_id: "${order_id}", floor_result_ug_ft2: 5.0, sill_result_ug_ft2: 40.0, trough_result_ug_ft2: 100.0 }
              as: Inspector
              as_user_id: "${insp2_id}"
          trigger:
            - call: "POST /api/v1/remediation-projects/${proj_id}/complete"
              payload: { line_items: [ { description: "paint abatement", amount_cents: 400000 } ] }
              as: Contractor
              as_user_id: "${con_id}"
          assert:
            - "RemediationProject.${proj_id}.estimated_cost_cents == 625000"
            - "RemediationProject.${proj_id}.final_cost_cents == 400000"
            - "RemediationProject.${proj_id}.status == COMPLETED"
            - "GrantFund.${gf_id}.spent_cents == 400000"
            - "GrantFund.${gf_id}.reserved_cents == 0"
            - "GrantFund.${gf_id}.available_cents == 4600000"

  # =========================================================================
  # RULE 2 — combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: grant_subsidy_tiered_min_cap
        grounds:
          - calculations.grant_subsidy
          - entities.RemediationProject.fields.estimated_cost_cents
          - entities.Case.fields.income_tier
        distinguishing_aspect: |
          MODE (a): non-linear formula over >=3 inputs — base rate x hazard_count
          x income-tier multiplier, then a min() cap. hazard_count=5 with
          EXTREMELY_LOW (1.5) gives raw 1875000 but the SUBSIDY_CAP_CENTS min
          floors estimated_cost_cents at 1500000 (cap binds).
        test_recipe:
          setup:
            - "A case whose income_tier snapshot is EXTREMELY_LOW with a 5-hazard ISSUED order; contractor ACTIVE; grant total 5000000."
          setup_api_calls:
            - call: "POST /api/v1/dwellings"
              payload: { street_address: "5 Oak Ave", year_built: 1940, owner_name: "Oak LLC", jurisdiction: "COUNTY_A" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/v1/children"
              payload: { full_name: "Bee Child", date_of_birth: "2021-01-01", guardian_name: "G Bee", primary_dwelling_id: "${d_id}", income_tier: "EXTREMELY_LOW" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { ch_id: $.data.id }
            - call: "POST /api/v1/blood-lead-tests"
              payload: { child_id: "${ch_id}", bll_ug_dl: 50.0, specimen_type: "VENOUS", test_kind: "DIAGNOSTIC", collected_at: "2026-05-02T10:00:00Z" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { t1_id: $.data.id }
            - call: "POST /api/v1/cases"
              payload: { child_id: "${ch_id}", dwelling_id: "${d_id}", qualifying_test_id: "${t1_id}" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { case_id: $.data.id }
            - call: "POST /api/v1/inspectors"
              payload: { full_name: "Ivy Inspector", certification_id_number: "RA-001" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { insp_id: $.data.id }
            - call: "POST /api/v1/investigations"
              payload: { case_id: "${case_id}", dwelling_id: "${d_id}", inspector_id: "${insp_id}", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T12:00:00Z" }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { inv_id: $.data.id }
            - call: "POST /api/v1/investigations/${inv_id}/findings"
              payload: { hazard_type: "PAINT", location: "window A", measurement_value: 100.0, severity: "HIGH" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /api/v1/investigations/${inv_id}/findings"
              payload: { hazard_type: "PAINT", location: "window B", measurement_value: 100.0, severity: "HIGH" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /api/v1/investigations/${inv_id}/findings"
              payload: { hazard_type: "DUST", location: "floor", measurement_value: 90.0, severity: "MODERATE" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /api/v1/investigations/${inv_id}/findings"
              payload: { hazard_type: "SOIL", location: "yard", measurement_value: 500.0, severity: "MODERATE" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /api/v1/investigations/${inv_id}/findings"
              payload: { hazard_type: "WATER", location: "kitchen tap", measurement_value: 20.0, severity: "LOW" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /api/v1/investigations/${inv_id}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /api/v1/hazard-control-orders"
              payload: { case_id: "${case_id}" }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { order_id: "$.data[0].id" }
            - call: "POST /api/v1/contractors"
              payload: { business_name: "LeadAway Inc", rrp_certification_number: "RRP-77" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { con_id: $.data.id }
            - call: "POST /api/v1/contractors/${con_id}/certification"
              payload: { action: "ACTIVATE", expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /api/v1/grant-funds"
              payload: { fund_name: "HUD LHC 2026", fiscal_year: 2026, total_budget_cents: 5000000 }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { gf_id: $.data.id, gf_v: $.data.version }
            - call: "POST /api/v1/remediation-projects"
              payload: { order_id: "${order_id}", contractor_id: "${con_id}", grant_fund_id: "${gf_id}" }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /api/v1/remediation-projects/${proj_id}/approve"
              payload: { expected_grant_fund_version: "${gf_v}" }
              as: CaseManager
              as_user_id: "cm-1"
          assert:
            - "HazardControlOrder.${order_id}.hazard_count == 5"
            - "RemediationProject.${proj_id}.estimated_cost_cents == 1500000"
            - "GrantFund.${gf_id}.reserved_cents == 1500000"
            - "GrantFund.${gf_id}.available_cents == 3500000"

      - name: relocation_reimbursement_round_per_day_then_sum
        grounds:
          - calculations.relocation_reimbursement
          - entities.RelocationPlacement.fields.reimbursement_cents
        distinguishing_aspect: |
          MODE (b): nested rounding order is pinned — round_half_up the per-day
          amount THEN multiply by nights. occupant_count=3 over 5 nights gives
          per_day = round_half_up(24187.5) = 24188, so 24188 * 5 = 120940;
          the wrong sum-then-round order gives round_half_up(24187.5 * 5) =
          120938. The scaffold requires 120940.
        test_recipe:
          setup:
            - "An OPEN case; an AVAILABLE relocation unit; an ACTIVE placement for 3 occupants from 2026-06-01."
          setup_api_calls:
            - call: "POST /api/v1/dwellings"
              payload: { street_address: "9 Pine Rd", year_built: 1960, owner_name: "Pine LLC", jurisdiction: "COUNTY_A" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/v1/children"
              payload: { full_name: "Cy Child", date_of_birth: "2020-06-01", guardian_name: "G Cy", primary_dwelling_id: "${d_id}", income_tier: "LOW" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { ch_id: $.data.id }
            - call: "POST /api/v1/blood-lead-tests"
              payload: { child_id: "${ch_id}", bll_ug_dl: 25.0, specimen_type: "VENOUS", test_kind: "DIAGNOSTIC", collected_at: "2026-05-02T10:00:00Z" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { t1_id: $.data.id }
            - call: "POST /api/v1/cases"
              payload: { child_id: "${ch_id}", dwelling_id: "${d_id}", qualifying_test_id: "${t1_id}" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { case_id: $.data.id }
            - call: "POST /api/v1/relocation-units"
              payload: { address: "200 Motel Way", bedroom_count: 2 }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { u_id: $.data.id }
            - call: "POST /api/v1/relocation-placements"
              payload: { case_id: "${case_id}", relocation_unit_id: "${u_id}", start_date: "2026-06-01", end_date: "2026-06-30", occupant_count: 3 }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { plc_id: $.data.id }
          trigger:
            - call: "POST /api/v1/relocation-placements/${plc_id}/end"
              payload: { actual_end_date: "2026-06-06" }
              as: CaseManager
              as_user_id: "cm-1"
          assert:
            - "RelocationPlacement.${plc_id}.status == ENDED"
            - "RelocationPlacement.${plc_id}.actual_end_date == 2026-06-06"
            - "RelocationPlacement.${plc_id}.reimbursement_cents == 120940"

  # =========================================================================
  # RULE 3 — non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: case_parallel_axes_independent
        grounds:
          - state_machines.Case.ELEVATED_to_MONITORING
          - state_machines.Case.MONITORING_to_RESOLVED
          - state_machines.Case.OPEN_to_INVESTIGATION
          - entities.Case.fields.case_status
          - entities.Case.fields.medical_status
        distinguishing_aspect: |
          PARALLEL dimensions on one Case row: case_status advances OPEN ->
          INVESTIGATION on the environmental track while medical_status advances
          ELEVATED -> MONITORING -> RESOLVED on the health track; each follow-up
          test moves ONLY medical_status and leaves case_status == INVESTIGATION.
        test_recipe:
          setup:
            - "An OPEN case (medical ELEVATED); an investigation scheduled so case_status == INVESTIGATION."
          setup_api_calls:
            - call: "POST /api/v1/dwellings"
              payload: { street_address: "3 Birch Ln", year_built: 1955, owner_name: "Birch LLC", jurisdiction: "COUNTY_A" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/v1/children"
              payload: { full_name: "Di Child", date_of_birth: "2021-09-01", guardian_name: "G Di", primary_dwelling_id: "${d_id}", income_tier: "LOW" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { ch_id: $.data.id }
            - call: "POST /api/v1/blood-lead-tests"
              payload: { child_id: "${ch_id}", bll_ug_dl: 22.0, specimen_type: "VENOUS", test_kind: "DIAGNOSTIC", collected_at: "2026-05-02T10:00:00Z" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { t1_id: $.data.id }
            - call: "POST /api/v1/cases"
              payload: { child_id: "${ch_id}", dwelling_id: "${d_id}", qualifying_test_id: "${t1_id}" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { case_id: $.data.id }
            - call: "POST /api/v1/inspectors"
              payload: { full_name: "Ivy Inspector", certification_id_number: "RA-001" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { insp_id: $.data.id }
            - call: "POST /api/v1/investigations"
              payload: { case_id: "${case_id}", dwelling_id: "${d_id}", inspector_id: "${insp_id}", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T12:00:00Z" }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /api/v1/blood-lead-tests"
              payload: { child_id: "${ch_id}", bll_ug_dl: 2.0, specimen_type: "VENOUS", test_kind: "FOLLOWUP", collected_at: "2026-06-01T10:00:00Z" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
            - call: "POST /api/v1/blood-lead-tests"
              payload: { child_id: "${ch_id}", bll_ug_dl: 1.5, specimen_type: "VENOUS", test_kind: "FOLLOWUP", collected_at: "2026-07-01T10:00:00Z" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
          assert:
            - "After first follow-up: Case.${case_id}.medical_status == MONITORING AND Case.${case_id}.case_status == INVESTIGATION"
            - "After second follow-up: Case.${case_id}.medical_status == RESOLVED"
            - "Case.${case_id}.case_status == INVESTIGATION (unchanged by the health-track transitions)"

      - name: order_clearance_pending_remediation_cycle
        grounds:
          - state_machines.HazardControlOrder.CLEARANCE_PENDING_to_IN_REMEDIATION
          - state_machines.HazardControlOrder.IN_REMEDIATION_to_CLEARANCE_PENDING
          - state_machines.HazardControlOrder.CLEARANCE_PENDING_to_CLEARED
          - calculations.clearance_evaluation
        distinguishing_aspect: |
          CYCLIC on HazardControlOrder: a FAIL clearance sends CLEARANCE_PENDING
          back to IN_REMEDIATION (the back edge), a re-request returns it to
          CLEARANCE_PENDING, and a PASS finally reaches CLEARED — a genuine
          A->B->A->B cycle, not a linear pipeline.
        test_recipe:
          setup:
            - "A 1-hazard order STARTED (IN_REMEDIATION) with an ACTIVE contractor; a second inspector for independent clearance; request-clearance already moved it to CLEARANCE_PENDING."
          setup_api_calls:
            - call: "POST /api/v1/dwellings"
              payload: { street_address: "7 Cedar Ct", year_built: 1935, owner_name: "Cedar LLC", jurisdiction: "COUNTY_A" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/v1/children"
              payload: { full_name: "Eli Child", date_of_birth: "2019-02-01", guardian_name: "G Eli", primary_dwelling_id: "${d_id}", income_tier: "VERY_LOW" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { ch_id: $.data.id }
            - call: "POST /api/v1/blood-lead-tests"
              payload: { child_id: "${ch_id}", bll_ug_dl: 30.0, specimen_type: "VENOUS", test_kind: "DIAGNOSTIC", collected_at: "2026-05-02T10:00:00Z" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { t1_id: $.data.id }
            - call: "POST /api/v1/cases"
              payload: { child_id: "${ch_id}", dwelling_id: "${d_id}", qualifying_test_id: "${t1_id}" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { case_id: $.data.id }
            - call: "POST /api/v1/inspectors"
              payload: { full_name: "Ivy Inspector", certification_id_number: "RA-001" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { insp_id: $.data.id }
            - call: "POST /api/v1/inspectors"
              payload: { full_name: "Cade Clearer", certification_id_number: "RA-002" }
