            - call: "GET /inspections"
              payload: { policy_id: "${pol_id}" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { by_policy: "$.data[0].id" }
            - call: "GET /inspections"
              payload: { inspector_id: "${insp_id}" }
              as: LossControlSpecialist
              as_user_id: "${insp_id}"
