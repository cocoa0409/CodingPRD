  # ===========================================================================
  # Rule 9 - compensating invariants over different conserved quantities
  #   instance 1: BUYER_NET_OUTLAY (money) restored by a claim reversal
  #   instance 2: DECLARED_UNIT_TOTAL (units) restored by voiding a manifest line
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: buyer_net_outlay_restored_by_claim_reversal
        grounds:
          - state_machines.Claim.DECIDED_to_REVERSED
          - state_machines.SaleOrder.REFUND_ISSUED_to_PAID
          - state_machines.SellerAccount.MANIFEST_PROBATION_to_ACTIVE
          - calculations.claim_refund
          - calculations.order_settlement
          - entities.BuyerAccount.fields.wallet_credit_cents
          - endpoints[POST /liquidation/claims/{id}/reversals]
        distinguishing_aspect: |
          The conserved quantity is money: BUYER_NET_OUTLAY = SaleOrder.amount_paid_cents -
          BuyerAccount.wallet_credit_cents. Approving the claim drops it 2987000 -> 2036600 by
          crediting the wallet rather than by touching amount_paid_cents, and the reversal must undo
          every single side effect - wallet back to 0, claim_credit_cents back to 0, payment_status
          back to PAID, total_due back to 2987000, lot score back to 1.000, seller back to ACTIVE /
          TIER_PREFERRED - so the invariant returns to exactly 2987000 with zero drift. A
          reversal that refunds through amount_paid_cents, or that forgets the seller-side hops,
          leaves the invariant off by 950400 or the seller stranded on probation.
        test_recipe:
          setup:
            - "Seller, 1-door warehouse, carrier, one QUALIFIED buyer with a 10,000,000-cent limit."
            - "Lot S1 is CUSTOMER_RETURNS with lines 100 x 40000 (line 1) and 300 x 20000: 400 units / 10000000 retail."
            - "S1 sells at auction for 2700000; the buyer pays 2987000 in full and pickup completes at 2026-08-18T14:00:00Z with actual_freight_cents 17000, so the FINAL total is also 2987000 and balance_due_cents is 0."
            - "At 2026-08-19T00:00:00Z the buyer files a UNIT_SHORTAGE claim on line 1 for 80 units with two evidence URLs; MarketplaceOps user ops-claims-9 approves it for refund_cents 950400, which credits the wallet, flips the order to REFUND_ISSUED, scores the lot 0.830 and puts the seller on MANIFEST_PROBATION."
