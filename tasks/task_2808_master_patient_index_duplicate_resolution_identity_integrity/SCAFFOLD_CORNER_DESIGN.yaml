          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z and no DownstreamSystem, so both merges are COMPLETED in their own request with completed_at 2026-08-01T00:00:00Z and reversal_deadline_at 2026-10-30T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-VI and one MatchRuleSet RS-BASE."
            - "Four PatientRecord rows forming two independent duplicate couples: VI-1000 with VI-2000 (couple A) and VI-3000 with VI-4000 (couple B). Within a couple the seven scored attributes are identical (AUTO_LINK at 100.00) and the two couples share no attribute values, so no cross pair is ever proposed."
            - "Both couples are paired and merged, giving MergeOperation A and MergeOperation B."
