      - name: trip_plan_totals_mode_b_per_stop_ceiling_before_aggregation
        grounds:
          - calculations.trip_plan_totals
          - entities.TripStop.fields.service_minutes
          - entities.Trip.fields.planned_service_minutes
          - entities.Store.fields.cases_per_hour_unload_rate
        distinguishing_aspect: |
          MODE (b) - PER-UNIT ROUNDING BEFORE AGGREGATION. Two DELIVERY stops
          at a 700-case/hour store carry 900 and 500 cases, i.e. 77.142857 and
          42.857143 exact unload minutes. Ceiling each stop and then summing
          gives 78 + 43 = 121 unload minutes and planned_service_minutes 151;
          summing the exact fractions first and ceiling once gives 120 and
          planned_service_minutes 150. The two readings differ by exactly one
          minute, which also shifts planned_duty_minutes from 256 to 255. No
          other instance depends on where the rounding boundary sits.
        test_recipe:
          setup:
            - "Store S-1003 unloads 700 cases/hour with 2 doors and 24-hour dock availability (dock_open_minute 0, dock_close_minute 1439)."
            - "Two ReplenishmentOrders at that store: 900 cases and 500 cases, both DRY."
            - "Trailer VAN-903 has capacity_cases 1500, so peak_case_load 1400 clears the inclusive gate."
            - "TRIP-R1 carries only those two DELIVERY stops; the second stop is a second door at the same store, so its drive_minutes_from_prev and miles_from_prev are 0."
            - "Expected: stop 1 service_minutes ceil(900*60/700) + 15 = 78 + 15 = 93; stop 2 ceil(500*60/700) + 15 = 43 + 15 = 58; planned_service_minutes 151; planned_drive_minutes 105; planned_break_minutes 0; planned_duty_minutes 256."
