          trigger:
            - { call: "POST /api/drought-assessments", payload: { ranch_id: "${ranch_id}", assessment_date: "2026-08-01", pasture_measurements: [ { pasture_id: "${p1}", production_pct_of_normal: 80 } ] }, as: RangeManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/drought-assessments", payload: { ranch_id: "${ranch_id}", assessment_date: "2026-08-01", pasture_measurements: [ { pasture_id: "${p1}", production_pct_of_normal: 80 }, { pasture_id: "${p2}", production_pct_of_normal: 80 } ] }, as: RangeManager, captures: { a: $.data.id } }
          assert:
            - "${err} == ERR_ASSESSMENT_MEASUREMENT_INCOMPLETE"
            - "Complete measurement set creates DRAFT: DroughtAssessment.${a}.ranch_production_pct == 80.0 and resulting_posture == WATCH"

