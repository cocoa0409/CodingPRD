      - name: safe_harbor_certification_expires_then_lapses_after_the_grace_period
        claim_type: precision
        grounds:
          - calculations.safe_harbor_status
          - calculations.compliance_posture
          - entities.SafeHarborProgram.fields.assessment_grace_days
          - endpoints["POST /_clock/set_current_utc"]
        distinguishing_aspect: "Both clock comparisons in safe_harbor_status are strict `<`: at exactly expires_at (2027-08-01) the service is already ASSESSMENT_DUE rather than CERTIFIED, it stays ASSESSMENT_DUE through the last grace instant (2027-08-30), and only at exactly expires_at + 30 days (2027-08-31) does it become LAPSED — which is the sole trigger of posture clause 5, so the posture flips to RESTRICTED with zero exposure points and zero open audits."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one service with no integrations and no collected records."
            - "Program with regulator_approved true, validity 365 days, grace 30 days; assessment for 2026 certified on 2026-08-01, so expires_at is 2027-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Lapse Boundary Kids", operator_organization: "Lapse Media", service_category: "GAME", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
            - call: "POST /safe-harbor-programs"
              payload: { program_name: "Grace Window Seal", regulator_approved: true, annual_assessment_required: true, assessment_validity_days: 365, assessment_grace_days: 30 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /safe-harbor-assessments"
              payload: { service_id: "${svc_id}", program_id: "${prog_id}", assessment_year: 2026 }
              as: SafeHarborAssessor
              as_user_id: "assessor-3"
              captures: { asmt_id: $.data.id }
            - call: "POST /safe-harbor-assessments/${asmt_id}/status"
              payload: { to_status: "SUBMITTED", findings_open_count: 0 }
              as: SafeHarborAssessor
              as_user_id: "assessor-3"
            - call: "POST /safe-harbor-assessments/${asmt_id}/certify"
              payload: {}
              as: SafeHarborCertifier
              as_user_id: "certifier-4"
              captures: { certified_at: $.data.certified_at, expires_at: $.data.expires_at }
          trigger:
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sh_0: $.data.safe_harbor_status, posture_0: $.data.compliance_posture, expiry_0: $.data.safe_harbor_expires_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-31T23:59:59.999Z" }
              as: ComplianceOfficer
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sh_1: $.data.safe_harbor_status, posture_1: $.data.compliance_posture }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sh_2: $.data.safe_harbor_status, posture_2: $.data.compliance_posture }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-30T23:59:59.999Z" }
              as: ComplianceOfficer
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sh_3: $.data.safe_harbor_status, posture_3: $.data.compliance_posture }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-31T00:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sh_4: $.data.safe_harbor_status, posture_4: $.data.compliance_posture, exposure_4: $.data.third_party_exposure_points, open_4: $.data.open_audit_count }
          assert:
            - "${certified_at} == 2026-08-01T00:00:00Z and ${expires_at} == 2027-08-01T00:00:00Z (365 days added to a non-leap span)"
            - "${sh_0} == CERTIFIED, ${expiry_0} == 2027-08-01T00:00:00Z, ${posture_0} == OPEN"
            - "${sh_1} == CERTIFIED and ${posture_1} == OPEN (one millisecond before expiry)"
            - "${sh_2} == ASSESSMENT_DUE and ${posture_2} == OPEN (strict `<` means exactly expires_at is already due, but due is not restricting)"
            - "${sh_3} == ASSESSMENT_DUE and ${posture_3} == OPEN (last instant inside the 30-day grace)"
            - "${sh_4} == LAPSED and ${posture_4} == RESTRICTED with ${exposure_4} == 0 and ${open_4} == 0 — clause 5 of the posture ladder is the only clause that can fire here"
            - "SafeHarborAssessment.${asmt_id}.status remains CERTIFIED throughout; lapse is a clock-derived read, not a state transition"

