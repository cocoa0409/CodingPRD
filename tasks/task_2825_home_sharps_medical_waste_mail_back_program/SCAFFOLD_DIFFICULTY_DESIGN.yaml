          - state_machines.Patient
          - state_machines.Enrollment
          - state_machines.Kit
          - entities.SponsorshipProgram.fields.reserved_cents
          - entities.SponsorLedgerEntry
          - calculations.patient_risk_score
        distinguishing_aspect: |
          A four-hop RISK cascade fired by a single screening call and travelling ACROSS entity types:
          Shipment conformance -> NonConformanceEvent -> Patient.screening_risk_score crossing 60 ->
          Patient SUSPENDED -> Enrollment PAUSED (due date cleared) -> the untouched ISSUED kit VOIDED
          -> RESERVATION_RELEASE ledger append -> program reserved_cents down and status EXHAUSTED
          back to ACTIVE. The money hop is the LAST link of the chain, three entities away from the
          call, and the program is deliberately parked at available_cents == 0 so the un-exhaust is visible.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Baseline CA state rule, PS-A spec, CA-TF-0001 facility (1000-unit capacity)."
            - "NovaPen MANUFACTURER program NPD-TIGHT: funding_ceiling_cents exactly 4395 (three ONE_QUART kits at 1465 each) and per_kit_allowance_cents 6000."
            - "Dana Reyes ENROLLED with a 30-day / 5-kit ACTIVE enrollment."
            - "Kit 1 issued, filled at 69 units / 1400 g, shipped, DELIVERED, screened NON_CONFORMING with reason UNAPPROVED_WASTE_TYPE (weight 40): screening_risk_score 40, still under the threshold, patient stays ENROLLED."
            - "Kit 2 issued afterwards (kit 1 is RECEIVED, so nothing is superseded), filled at 69 units / 1400 g, shipped and DELIVERED but NOT yet screened."
            - "Kit 3 issued last and left in ISSUED (kit 2 is RECEIVED, so again nothing is superseded)."
            - "Three live reservations of 1465 bring reserved_cents to 4395 and available_cents to 0, so the program is EXHAUSTED immediately before the trigger."
