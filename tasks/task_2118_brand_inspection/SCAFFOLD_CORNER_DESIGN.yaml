        test_recipe:
          setup: ["Owner A has exactly one completed lot-free order in district T-OVER assessed 2500 and a SUBMITTED remittance of 2501 covering it."]
          setup_api_calls:
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Overpay Ranch", mailing_state: "MT", contact_email: "over@example.test" }
              as: BoardAdmin
              captures: { own_a: "$.data.id" }
