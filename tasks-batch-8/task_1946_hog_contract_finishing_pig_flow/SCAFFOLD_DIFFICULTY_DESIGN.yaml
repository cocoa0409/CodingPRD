            - { call: "POST /pig-groups/${group_b}/confirm-placement", payload: {}, as: FieldTech, captures: { gb_status: $.data.group_status } }
          assert:
            - "Confirm while barn OCCUPIED -> 409 ERR_BARN_NOT_PLACEABLE (${err1})"
            - "Confirm while barn WASH_REQUIRED (after close-out of GA) -> 409 ERR_BARN_NOT_PLACEABLE (${err2})"
            - "Confirm while barn DOWNTIME (wash verified, 72h not elapsed) -> 409 ERR_BARN_NOT_PLACEABLE (${err3})"
            - "After release at 2026-07-17 (>= downtime_until 2026-07-16T10:00:00Z): GB.group_status == PLACED (${gb_status}) and barn current_group_id == ${group_b}"
            - "GA close-out set head_unaccounted == 500 and created a FINALIZED settlement with bonus_cents == 0 (incomplete-marketing gate)"

      - name: dispatch_requires_verified_truck_wash
        grounds:
          - state_machines.MarketLoad
          - state_machines.TruckWash
          - errors[ERR_WASH_NOT_VERIFIED]
        distinguishing_aspect: |
          Entity pair MarketLoad -> TruckWash: dispatch is gated on the WASH's state.
          RECORDED wash -> dispatch rejected; the same wash VERIFIED -> dispatch succeeds.
          The group/slot side is unchanged; only the wash's state flips the outcome.
        test_recipe:
          setup:
            - "Contract A ACTIVE; group 500 head PLACED; slot 2026-07-13 (cap 500, window 240-320); load 100 head SCHEDULED; wash RECORDED at 2026-07-12T08:00:00Z"
          setup_api_calls:
