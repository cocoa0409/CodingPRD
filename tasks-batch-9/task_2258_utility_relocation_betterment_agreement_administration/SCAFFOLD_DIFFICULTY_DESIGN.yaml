      - name: issuing_prior_rights_cascades_conflict_share_to_project_liability_to_funding_block
        grounds:
          - state_machines.PriorRightsDetermination.UNDER_REVIEW_to_ISSUED
          - state_machines.UtilityConflict.RESOLUTION_SELECTED_to_RESPONSIBILITY_SET
          - calculations.project_state_liability_estimate
          - calculations.project_clearance_posture
          - entities.Project.fields.clearance_posture
        distinguishing_aspect: |
          Depth 3 from a different trigger, POST /uro/prior-rights/{id}/issue: determination ->
          UtilityConflict.state_share_pct 0 -> 100 (link 1) -> Project.estimated_state_liability_cents
          0 -> 25600000 (link 2) -> Project.clearance_posture CLEARANCE_PENDING -> FUNDING_BLOCKED
          (link 3). This chain is causally downstream of the previous instance's world in the sense
          that a FUNDING_BLOCKED project can no longer execute the agreements whose hold cascade the
          previous instance exercises; here the plan must already exist at issue time, because the
          liability estimate reads the governing plan.
        test_recipe:
          setup:
            - "A project whose reimbursement_authority_cents is only 1000000, far below the participating cost of a single relocation."
            - "Private ELECTRIC owner, PRIVATE_EASEMENT facility installed 1968 (before the 1975 acquisition), so RECORD_BASIS gives share 100."
            - "Conflict in RESOLUTION_SELECTED with a plan already created (40000000 / 32000000 / 1.25, betterment_amount 14400000, participating 25600000) and a determination in UNDER_REVIEW."
            - "Because state_share_pct is still 0 before issue, the liability estimate is 0 and the posture is CLEARANCE_PENDING."
          setup_api_calls:
            - { call: "POST /uro/projects", payload: { name: "SR-14 Spot Improvement", route_designation: "SR-14", letting_date: "2027-01-15T00:00:00Z", construction_start_date: "2027-03-01T00:00:00Z", construction_end_date: "2028-06-30T00:00:00Z", row_acquisition_year: 1975, reimbursement_authority_cents: 1000000, contract_daily_overhead_cents: 250000 }, as: ProgramAdmin, captures: { p1: $.data.id, p1_posture_initial: $.data.clearance_posture } }
            - { call: "POST /uro/utility-owners", payload: { legal_name: "Cascade Electric Cooperative", utility_type: "ELECTRIC", is_public_agency: false, indirect_cost_rate_pct: 12.5 }, as: ProgramAdmin, captures: { o1: $.data.id } }
            - { call: "POST /uro/facilities", payload: { owner_id: "${o1}", facility_type: "BURIED_ELECTRIC", station_begin: 100.0, station_end: 140.0, offset_ft: 12.5, depth_in: 48, material: "PVC duct bank", installed_year: 1968, occupancy_basis: "PRIVATE_EASEMENT", record_source: "AS_BUILT" }, as: UtilityCoordinator, captures: { f1: $.data.id } }
            - { call: "POST /uro/conflicts", payload: { project_id: "${p1}", facility_id: "${f1}", conflict_station: 120.0, clearance_deficiency_in: 18 }, as: UtilityCoordinator, captures: { c1: $.data.id, c1_share_initial: $.data.state_share_pct } }
            - { call: "POST /uro/conflicts/${c1}/set-resolution", payload: { resolution_type: "RELOCATE" }, as: UtilityCoordinator, captures: { c1v: $.data.version } }
            - { call: "POST /uro/relocation-plans", payload: { conflict_id: "${c1}", expected_conflict_version: "${c1v}", estimated_cost_cents: 40000000, replacement_in_kind_cost_cents: 32000000, proposed_capacity_ratio: 1.25, work_days: 11 }, as: UtilityOwnerRep, as_user_id: "${o1}", captures: { pl1: $.data.id, pl1_betterment: $.data.betterment_amount_cents } }
            - { call: "GET /uro/projects/${p1}", payload: {}, as: ProgramAdmin, captures: { liability_before: $.data.estimated_state_liability_cents, posture_before: $.data.clearance_posture } }
            - { call: "POST /uro/prior-rights", payload: { conflict_id: "${c1}", claimed_basis: "PRIVATE_EASEMENT", narrative: "Recorded private easement predating right-of-way acquisition." }, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1", captures: { d1: $.data.id } }
            - { call: "POST /uro/prior-rights/${d1}/submit-for-review", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1" }
          trigger:
            - { call: "POST /uro/prior-rights/${d1}/issue", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1", captures: { d1_final: $.data.final_state_share_pct } }
          assert:
            - "Before the trigger: Project.${p1}.estimated_state_liability_cents == 0 and Project.${p1}.clearance_posture == CLEARANCE_PENDING"
            - "PriorRightsDetermination.${d1}.status == ISSUED and final_state_share_pct == 100"
            - "Link 1: UtilityConflict.${c1}.state_share_pct == 100 and UtilityConflict.${c1}.status == RESPONSIBILITY_SET"
            - "Link 2: Project.${p1}.estimated_state_liability_cents == 25600000"
            - "Link 3: Project.${p1}.clearance_posture == FUNDING_BLOCKED"
            - "RelocationPlan.${pl1}.betterment_amount_cents == 14400000"
            - "Project.${p1}.total_committed_reimbursement_cents == 0 (the block comes from the forward estimate, not from the ledger)"
            - "Project.${p1}.status == CLEARANCE_ACTIVE"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_priority_nine_beats_fiscal_priority_twentynine_on_agreement_execute
        grounds:
          - validations[priority=9]
          - validations[priority=29]
          - calculations.project_committed_reimbursement_ledger
          - state_machines.ReimbursementAgreement.DRAFT_to_PENDING_OWNER_SIGNATURE
        distinguishing_aspect: |
          A single execute call violates the state rule at priority 9 (execution_status is DRAFT, not
          PENDING_OWNER_SIGNATURE) and the fiscal rule at priority 29 (state_share_cents 29070000
          would push the ledger past the 26000000 authority) at the same time; the ordered evaluation
          must surface ERR_AGREEMENT_NOT_EXECUTABLE. Circulating the agreement removes only the
          priority-9 violation, and the very same call then surfaces ERR_AUTHORITY_EXCEEDED, proving
          the second violation was present all along. Category pair: state versus business_fiscal.
        test_recipe:
          setup:
            - "Project with reimbursement_authority_cents 26000000: high enough that the 25600000 liability estimate keeps clearance_posture out of FUNDING_BLOCKED (so the priority-14 rule cannot interfere), low enough that a 29070000 state share breaches it."
            - "Base chain to an APPROVED plan 40000000 / 32000000 / 1.25 for a private ELECTRIC owner at 12.5 percent indirect, conflict share 100."
            - "Agreement created at not_to_exceed_cents 45000000 and deliberately left in execution_status DRAFT."
          setup_api_calls:
            - { call: "POST /uro/projects", payload: { name: "SR-14 Constrained Authority", route_designation: "SR-14", letting_date: "2027-01-15T00:00:00Z", construction_start_date: "2027-03-01T00:00:00Z", construction_end_date: "2028-06-30T00:00:00Z", row_acquisition_year: 1975, reimbursement_authority_cents: 26000000, contract_daily_overhead_cents: 250000 }, as: ProgramAdmin, captures: { p1: $.data.id } }
            - { call: "POST /uro/utility-owners", payload: { legal_name: "Cascade Electric Cooperative", utility_type: "ELECTRIC", is_public_agency: false, indirect_cost_rate_pct: 12.5 }, as: ProgramAdmin, captures: { o1: $.data.id } }
            - { call: "POST /uro/facilities", payload: { owner_id: "${o1}", facility_type: "BURIED_ELECTRIC", station_begin: 100.0, station_end: 140.0, offset_ft: 12.5, depth_in: 48, material: "PVC duct bank", installed_year: 1968, occupancy_basis: "PRIVATE_EASEMENT", record_source: "AS_BUILT" }, as: UtilityCoordinator, captures: { f1: $.data.id } }
            - { call: "POST /uro/conflicts", payload: { project_id: "${p1}", facility_id: "${f1}", conflict_station: 120.0, clearance_deficiency_in: 18 }, as: UtilityCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /uro/conflicts/${c1}/set-resolution", payload: { resolution_type: "RELOCATE" }, as: UtilityCoordinator }
            - { call: "POST /uro/prior-rights", payload: { conflict_id: "${c1}", claimed_basis: "PRIVATE_EASEMENT", narrative: "Recorded private easement predating right-of-way acquisition." }, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1", captures: { d1: $.data.id } }
            - { call: "POST /uro/prior-rights/${d1}/submit-for-review", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1" }
            - { call: "POST /uro/prior-rights/${d1}/issue", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1" }
            - { call: "GET /uro/conflicts/${c1}", payload: {}, as: UtilityCoordinator, captures: { c1v: $.data.version } }
            - { call: "POST /uro/relocation-plans", payload: { conflict_id: "${c1}", expected_conflict_version: "${c1v}", estimated_cost_cents: 40000000, replacement_in_kind_cost_cents: 32000000, proposed_capacity_ratio: 1.25, work_days: 11 }, as: UtilityOwnerRep, as_user_id: "${o1}", captures: { pl1: $.data.id } }
            - { call: "POST /uro/permits", payload: { conflict_id: "${c1}", permit_type: "ENCROACHMENT_PERMIT", expires_on: "2028-12-31T00:00:00Z" }, as: UtilityCoordinator, captures: { pm1: $.data.id } }
            - { call: "POST /uro/permits/${pm1}/decide", payload: { decision: "GRANT" }, as: UtilityCoordinator }
            - { call: "POST /uro/relocation-plans/${pl1}/start-review", payload: {}, as: UtilityCoordinator }
            - { call: "POST /uro/relocation-plans/${pl1}/approve", payload: {}, as: UtilityCoordinator }
            - { call: "GET /uro/relocation-plans/${pl1}", payload: {}, as: AgreementOfficer, captures: { pl1v: $.data.version } }
            - { call: "POST /uro/agreements", payload: { plan_id: "${pl1}", expected_plan_version: "${pl1v}", not_to_exceed_cents: 45000000 }, as: AgreementOfficer, as_user_id: "officer-1", captures: { a1: $.data.id, a1_share: $.data.state_share_cents, a1_exec: $.data.execution_status } }
            - { call: "GET /uro/projects/${p1}", payload: {}, as: ProgramAdmin, captures: { posture_before: $.data.clearance_posture, liability_before: $.data.estimated_state_liability_cents } }
          trigger:
            - { call: "POST /uro/agreements/${a1}/execute", payload: {}, as: AgreementOfficer, as_user_id: "officer-1" }
            - { call: "POST /uro/agreements/${a1}/circulate", payload: {}, as: AgreementOfficer, as_user_id: "officer-1" }
            - { call: "POST /uro/agreements/${a1}/execute", payload: {}, as: AgreementOfficer, as_user_id: "officer-1" }
          assert:
            - "Project.${p1}.estimated_state_liability_cents == 25600000 and Project.${p1}.clearance_posture != FUNDING_BLOCKED before the trigger"
            - "ReimbursementAgreement.${a1}.state_share_cents == 29070000"
            - "The first trigger call returns 409 with error_id ERR_AGREEMENT_NOT_EXECUTABLE (priority 9 wins, not ERR_AUTHORITY_EXCEEDED)"
            - "The second trigger call returns 200 and ReimbursementAgreement.${a1}.execution_status == PENDING_OWNER_SIGNATURE"
            - "The third trigger call returns 409 with error_id ERR_AUTHORITY_EXCEEDED (priority 29, now that the priority-9 violation is gone)"
            - "ReimbursementAgreement.${a1}.execution_status == PENDING_OWNER_SIGNATURE (never EXECUTED)"
            - "Project.${p1}.total_committed_reimbursement_cents == 0"

      - name: temporal_priority_twentytwo_beats_constraint_priority_twentyfive_on_commitment_create
        grounds:
          - validations[priority=22]
          - validations[priority=25]
          - entities.JointTrenchSlot.fields.occupant_count
          - entities.JointTrenchSlot.fields.status
        distinguishing_aspect: |
          A different category pair on a different endpoint: one POST /uro/commitments body violates
          the business_temporal rule at priority 22 (window 2028-07-05 to 2028-07-20 sits past the
          2028-06-30 construction end) and the business_constraint rule at priority 25 (the named
          slot is already FULL at max_occupants 1). ERR_WINDOW_OUTSIDE_CONSTRUCTION must win; moving
