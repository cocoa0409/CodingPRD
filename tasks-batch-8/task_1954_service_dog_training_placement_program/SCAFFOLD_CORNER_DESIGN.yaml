          setup: ["class ENROLLING with zero enrollments; clock advanced to starts_on"]
          setup_api_calls:
            - { call: "POST /api/trainers", payload: { full_name: "Trainer Small", pat_certified: false }, as: ProgramAdmin, captures: { t_id: $.data.id } }
