      - name: discipline_allocations_are_capped_by_the_budget_minus_reserve
        claim_type: aggregate_validation
        grounds:
          - validations[error_id=ERR_ALLOCATION_EXCEEDS_BUDGET]
          - calculations.cycle_reserve_and_available
        distinguishing_aspect: |
          On a 6_000_000 budget the reserve is 300_000, so the allocation ceiling
          is 5_700_000: 5_000_000 alone passes, a second category of 800_000
          (sum 5_800_000) is refused, and 700_000 (sum exactly 5_700_000) is
          accepted. An implementation that compares against total_budget_cents
          accepts the 800_000 category, and one using a strict < at the ceiling
          rejects the 700_000 one.
        test_recipe:
