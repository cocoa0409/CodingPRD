              captures: { r2: $.data.id }
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${e3}", method_id: "${m1}", item_count: 2 }
              as: CaseManager
              captures: { r3: $.data.id }
          trigger:
            - call: "POST /lab/examination-requests/${r1}/vendor-engagements"
              payload: { vendor_id: "${v1}", window_start_utc: "2026-08-10T00:00:00Z", window_end_utc: "2026-08-20T00:00:00Z", rush_flag: false }
              as: CaseManager
