          trigger:
            - call: "POST /exemption-analyses"
              payload: { position_id: "${pos_id}", applied_test: "EXECUTIVE", expected_position_version: "${pos_v1}" }
              as: ComplianceAnalyst
              as_user_id: "ca-1"
            - call: "GET /positions/${pos_id}"
              payload: {}
              as: ComplianceAnalyst
