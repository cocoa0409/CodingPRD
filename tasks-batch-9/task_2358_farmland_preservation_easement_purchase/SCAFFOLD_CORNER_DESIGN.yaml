            - *k_lo_a
            - *k_clk_0810
          trigger:
            - *k_parcel_a
            - call: "POST /parcels"
              payload: { landowner_id: "${lo_a_id}", county: "Lancaster", acres: 160.00, prime_soil_acres: 120.00, statewide_important_soil_acres: 0.00, contiguous_preserved_acres: 80.00, road_frontage_feet: 640, sewer_available: true, zoning_min_lot_acres: 2.0, baseline_dwelling_rights: 4, unrestricted_value_cents: 288000000, restricted_value_cents: 112450000 }
              as: Landowner
