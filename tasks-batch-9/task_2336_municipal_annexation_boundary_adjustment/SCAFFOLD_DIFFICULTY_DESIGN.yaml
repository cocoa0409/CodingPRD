            - call: "POST /service-commitments"
              payload: { plan_of_services_id: "${plan_ef}", service_provider_id: "${prov_ut}", service_type: "SEWER", window_start_date: "2026-08-01", window_end_date: "2026-12-31", cost_cents: 700000, committed_account_count: 1, expected_plan_of_services_version: "${plan_ef_v3}" }
              as: MunicipalPlanner
