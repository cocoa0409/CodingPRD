      - name: family_conference_hold_with_empty_active_surrogate_pool
        grounds:
          - calculations.surrogate_authority_selection
          - validations[priority=16]
          - errors[ERR_SURROGATE_HIERARCHY_EMPTY]
          - state_machines.SurrogateDesignation.PROPOSED_to_ACTIVE
          - endpoints["POST /palliative/conferences/{id}/hold"]
        distinguishing_aspect: |
          Empty-collection boundary on a different metric and a different
          endpoint from the documented-minutes threshold: the candidate pool for
          the decision-maker selector is empty because the only designation is
          PROPOSED rather than ACTIVE, so the hold fails with
          ERR_SURROGATE_HIERARCHY_EMPTY, and activating that same designation
          makes the identical call succeed with decision_maker_kind SURROGATE.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One Patient in program_status ACTIVE whose capacity_status has been determined LACKS_CAPACITY."
            - "Exactly one SurrogateDesignation for that patient, relationship SPOUSE, left in status PROPOSED."
            - "One CareConference of conference_type FAMILY in status SCHEDULED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
