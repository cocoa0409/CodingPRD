          - errors.ERR_PREQUAL_NOT_ACTIVE
        distinguishing_aspect: |
          A THREE-way conflict on one request where the winner is the state-category rule at
          priority 12 and the two losers sit at 16 and 18 in a different category. All three
          violations are produced by a single fatality report plus a stale training record, so an
          implementation that evaluates business_safety checks before state checks, or that
