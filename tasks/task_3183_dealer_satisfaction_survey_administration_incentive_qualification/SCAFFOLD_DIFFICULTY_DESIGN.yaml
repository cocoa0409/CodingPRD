              as: PlatformAdmin
              captures: { dealer_id: $.data.id }
            - call: "POST /survey/departments"
              payload: { dealer_id: "${dealer_id}", kind: "SALES", name: "Sales" }
              as: PlatformAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /survey/customers"
              payload: { full_name: "C17", email: "c17@x.com", phone: "5551717171" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /survey/question-sets"
              payload: { code: "QS-Q", questions: [{question_code: "q1", prompt: "A", weight: 1}], comparability_factor: 1.0 }
              as: PlatformAdmin
              captures: { qs_id: $.data.id }
            - call: "POST /survey/question-sets/${qs_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /survey/waves"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", question_set_id: "${qs_id}" }
              as: PlatformAdmin
              captures: { wave_id: $.data.id }
            - call: "POST /survey/transactions"
              payload: { dealer_id: "${dealer_id}", department_id: "${dept_id}", customer_id: "${cust_id}", kind: "SALE", completed_at: "2026-09-05T00:00:00Z", margin_cents: 100000 }
              as: PlatformAdmin
            - call: "POST /survey/waves/${wave_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "GET /survey/waves/${wave_id}/invitations"
              payload: {}
              as: PlatformAdmin
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /survey/invitations/${inv_id}/send"
              payload: {}
              as: SurveyVendor
            - call: "POST /survey/invitations/${inv_id}/responses"
              payload: { answers: [{question_code: "q1", score: 9}] }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /survey/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /survey/waves/${wave_id}/close"
              payload: {}
              as: PlatformAdmin
            - call: "GET /survey/waves/${wave_id}"
              payload: {}
              as: PlatformAdmin
              captures: { wave_v1: $.data.version }
          trigger:
            - call: "POST /survey/statements"
              payload: { dealer_id: "${dealer_id}", wave_id: "${wave_id}", expected_wave_version: "${wave_v1}" }
              as: PlatformAdmin
              captures: { st1: $.data.id }
            - call: "GET /survey/waves/${wave_id}"
              payload: {}
              as: PlatformAdmin
              captures: { wave_v2: $.data.version }
            - call: "POST /survey/statements"
              payload: { dealer_id: "${dealer_id}", wave_id: "${wave_id}", expected_wave_version: "${wave_v2}" }
              as: PlatformAdmin
              captures: { st2: $.data.id }
            - call: "GET /survey/statements/${st1}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /survey/statements/${st2}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "IncentiveStatement.${st1}.status == SUPERSEDED"
            - "IncentiveStatement.${st2}.status == PROVISIONAL"
            - "IncentiveStatement.${st2}.supersedes_id == ${st1}"
            - "count of PROVISIONAL statements for (dealer, wave) remains exactly 1 across the supersede"
