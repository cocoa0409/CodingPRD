  - rule_id: cross_entity_state_dependency
    instances:
      - name: burn_in_scheduling_requires_cabinet_populated
        grounds:
          - state_machines.Cabinet.POPULATED_to_BURN_IN
          - validations.priority_20
          - errors.ERR_INVALID_CABINET_STATE
          - entities.Cabinet.fields.installed_module_count
        distinguishing_aspect: |
          Entity pair (BurnInRun, Cabinet): a BurnInRun may only be created when
          the referenced Cabinet has reached POPULATED, which on FP16-STD needs
          BOTH module slots filled. A half-built cabinet (1 of 2 modules,
          cabinet_state IN_ASSEMBLY) must be refused, and the identical request
          must succeed the moment the second module lands.
        test_recipe:
          setup:
            - "FP16-STD display model (modules_per_cabinet 2, required_load_kg_per_sqm 150.00, burn_in_hours_required 24)."
            - "A 1x1 RETAIL project, engineering APPROVED."
            - "Its cabinet has ONE installed module (M-1) so cabinet_state is IN_ASSEMBLY, and a second CALIBRATED module M-2 is waiting."
            - "Chamber CH-1 exists (slot_capacity 4, turnaround_minutes 60, certified_max_drive_pct 90)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
