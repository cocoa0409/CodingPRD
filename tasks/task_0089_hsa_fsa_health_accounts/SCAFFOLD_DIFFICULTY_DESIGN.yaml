            - call: "POST /reimbursement-batches"
              payload: { participant_id: "${p_id}", claim_ids: ["${c2_id}"] }
              as: FundDisburser
              as_user_id: "disb-1"
              captures: { b2_id: $.data.id }
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: FundDisburser
              captures: { acc_v2: $.data.version }
          trigger:
            - call: "POST /reimbursement-batches/${b2_id}/disburse"
              payload: { expected_account_version: "${acc_v2}" }
              as: FundDisburser
              as_user_id: "disb-1"
          assert:
            - "POST /reimbursement-batches/${b2_id}/disburse returns 409 ERR_ACCOUNT_ON_HOLD (hold p8 beats insufficient-funds p15)"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: hsa_cap_exact_boundary_on_contributions_endpoint
        grounds:
          - calculations.HSA-Contribution-Cap
          - validations[priority=12]
        distinguishing_aspect: |
          Numeric >= vs > boundary on the HSA cap metric, reached via POST /accounts/{id}/contributions:
          a contribution bringing prospective to exactly 437500 (== allowed) succeeds; one cent more
          (437501) is rejected.
        test_recipe:
          setup:
            - "Participant (age 40, self-only HSA) has contributed_cents=400000; cap is 437500 (no catchup)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plan-years"
              payload: { label: "PY2026", coverage_start: "2026-01-01", coverage_end: "2026-12-31", run_out_end: "2027-03-31", hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, health_fsa_cap_cents: 335000, dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000 }
              as: PlanAdmin
