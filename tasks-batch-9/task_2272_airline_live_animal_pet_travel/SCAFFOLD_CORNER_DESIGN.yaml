            - { call: "POST /animal-records/${an1}/screen", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
            - { call: "PUT /stations/${st_hkg}/status", payload: { status: "SUSPENDED" }, as: ProgramAdmin, as_user_id: "admin-01" }
            - { call: "GET /stations/${st_hkg}", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01", captures: { st_hkg_v: $.data.version } }
