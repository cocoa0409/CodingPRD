            - "Invoice.${inv_id}.status == PAID and paid_date == 2026-06-01 after the pay call"
            - "Membership.${mem_id}.status == ACTIVE after the invoice is paid, with no call made against the membership itself"
            - "the second consult-booking response HTTP status == 201 and ConsultBooking.${b1_id}.status == SCHEDULED"
            - "Physician.${doc_id}.weighted_occupancy == 2.0 both before and after activation, because PENDING_ACTIVATION already occupies the slot"

