    instances:
      - name: ingestion_safe_harbor_gate_precedes_enrollment_referential_check
        grounds:
          - validations.priority_9_ERR_SAFE_HARBOR_NOT_ELIGIBLE
          - validations.priority_14_ERR_RIGHTS_HOLDER_NOT_ENROLLED
          - validations.priority_14_ERR_PROGRAM_TIER_INSUFFICIENT
          - endpoints.POST_/dmca/ingestion-batches
        distinguishing_aspect: |
          Three rules are violated by one call — the safe-harbor gate at priority 9,
          the enrollment check at priority 14 and the tier check at priority 14 —
          and the response must be the priority-9 ERR_SAFE_HARBOR_NOT_ELIGIBLE with
