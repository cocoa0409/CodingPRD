            - "PreOrder.${po1_id}.status == CANCELLED with deposit_refund_cents == 2687, deposit_forfeited_cents == 0, deposit_applied_cents == 0"
            - "PreOrder.${po2_id}.status == CANCELLED with deposit_refund_cents == 1075 and deposit_forfeited_cents == 1074"
            - "For both orders deposit_cents == deposit_applied_cents + deposit_refund_cents + deposit_forfeited_cents"

      - name: shrink_reconciliation_scope_excludes_draft_plans
        claim_type: input_set_filtering
        grounds:
