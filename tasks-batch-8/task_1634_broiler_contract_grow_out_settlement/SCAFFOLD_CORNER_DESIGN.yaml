          trigger:
            - { call: "POST /api/flocks", payload: { house_id: "${h}", contract_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", settlement_group_id: "${grp}", flock_no: "F-V5" }, as: IntegratorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_REFERENCE_NOT_FOUND with http 404"

