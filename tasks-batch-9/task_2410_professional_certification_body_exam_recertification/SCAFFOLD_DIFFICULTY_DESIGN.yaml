              captures: { candB_id: $.data.id }
            - call: "POST /applications"
              payload: { candidate_id: "${candB_id}", program_id: "${progB_id}", education_credential: "BACHELOR", education_completion_year: 2020, experience_months: 36, attestation_signed: true }
              as: EligibilityReviewer
              as_user_id: "elr-1"
              captures: { appB_id: $.data.id }
            - call: "POST /applications/${appB_id}/verify"
              payload: { dimension: "EDUCATION", outcome: "PASS" }
              as: EligibilityReviewer
