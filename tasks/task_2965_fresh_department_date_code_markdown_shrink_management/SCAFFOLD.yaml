scenario: |
  2965. Fresh Department Date-Code, Markdown & Shrink Management (Kroger fresh operations): item-level sell-by tracking with department-specific shelf-life rules, automated markdown ladder by days remaining and expected sell-through, markdown label printing and scan-price enforcement, donation eligibility cutoffs and food-bank pickup scheduling, shrink recording by cause code (spoilage, damage, sampling, theft), forecast and order quantity feedback from shrink history, gross-margin impact reporting by department and store, compliance audit of past-date product on shelf
domain_name: fresh-date-code-markdown-shrink
api_prefix: /fresh

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; no entity is nested under
  # another in any URL path. Every collection sits directly under /fresh.

  state_machine_shape: cyclic
  # DateCodeLot cycles FRESH -> MARKED_DOWN -> FRESH (markdown void) and
  # self-loops MARKED_DOWN -> MARKED_DOWN (re-ladder); ShrinkEvent cycles
  # RECORDED -> VERIFIED -> DISPUTED -> RECORDED; DonationPickup carries two
  # independent state dimensions (logistics_status x manifest_status).

  relationship_patterns:
    - one_to_many          # Department -> Item -> DateCodeLot; ComplianceAudit -> AuditFinding
    - many_to_many         # DonationLotAssignment joins DonationPickup and DateCodeLot
    - self_referential     # MarkdownLabel.supersedes_label_id, OrderRecommendation.supersedes_recommendation_id
    - cross_aggregate      # AuditFinding.lot_id crosses the audit aggregate into the lot aggregate

  role_model: segregation_of_duties
  # The clerk who records a ShrinkEvent may not verify it; the manager who
  # requests an approval-gated markdown may not be its own approver.

  consistency_model: immediate

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Store
    parent: null
    common_fields: true
    fields:
      - name: store_number
        type: string
        source: input
        description: "Four-digit Kroger store number; globally unique"
        constraints: "exactly 4 digits [0-9]{4}; unique across all Store rows -> ERR_STORE_NUMBER_DUPLICATE"
      - name: name
        type: string
        source: input
        description: "Store display name"
        constraints: "1..120 chars"
      - name: region_code
        type: string
        source: input
        description: "Kroger division/region code used to match food-bank partners"
        constraints: "1..24 chars, uppercase letters, digits and hyphen"
      - name: dock_door_codes
        type: array
        source: input
        description: "Receiving dock door codes available for donation pickups; array of strings"
        default: ["D1", "D2", "D3"]
        constraints: "1..8 entries, each 1..8 chars; a DonationPickup.dock_door_code not in this array -> ERR_DOCK_DOOR_UNKNOWN"
      - name: donation_program_enabled
        type: boolean
        source: input
        description: "Whether this store may schedule food-bank donation pickups"
        default: true
      - name: status
        type: enum
        source: input
        description: "Store operating status"
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"

  - name: FoodBankPartner
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Food-bank organisation name"
        constraints: "1..120 chars"
      - name: contact_email
        type: string
        source: input
        description: "Pickup coordinator email"
        constraints: "must contain exactly one '@'"
      - name: service_region_code
        type: string
        source: input
        description: "Region the partner serves; must equal Store.region_code of any pickup it is booked on -> ERR_PARTNER_REGION_MISMATCH"
        constraints: "1..24 chars"
      - name: accepted_department_codes
        type: array
        source: input
        description: "Department codes this partner accepts product from; array of enum values"
        constraints: "1..6 entries, each one of {MEAT, DELI, BAKERY, PRODUCE, SEAFOOD, DAIRY}, no duplicates"
      - name: cold_chain_certified
        type: boolean
        source: input
        description: "Partner holds refrigerated-transport certification; required for MEAT and SEAFOOD lots"
        default: false
      - name: status
        type: enum
        source: input
        description: "Partner eligibility status"
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: pickups_completed_count
        type: integer
        source: computed
        description: "Count of DonationPickup rows for this partner whose logistics_status == COMPLETED"
        default: 0
      - name: units_received_total
        type: integer
        source: computed
        description: "Sum of DonationLotAssignment.quantity_units with status == PICKED_UP across this partner's pickups"
        default: 0

  - name: MarkdownLadder
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Ladder name, e.g. MEAT-STD-2026"
        constraints: "1..60 chars; unique across all MarkdownLadder rows -> ERR_LADDER_NAME_DUPLICATE"
      - name: department_code
        type: enum
        source: input
        description: "Department code this ladder may be attached to; a Department whose code differs -> ERR_LADDER_DEPARTMENT_MISMATCH"
        constraints: "one of {MEAT, DELI, BAKERY, PRODUCE, SEAFOOD, DAIRY}"
      - name: rungs
        type: array
        source: input
        description: "Ordered markdown rungs; array of objects { days_remaining_max: integer, discount_pct: number, requires_manager_approval: boolean }. The rung index IS the 0-based array position."
        constraints: "2..6 entries; days_remaining_max strictly decreasing across the array; discount_pct strictly increasing across the array; each discount_pct in (0, 100); violation -> ERR_INVALID_REQUEST"
      - name: sell_through_floor_pct
        type: number
        source: input
        description: "Expected-sell-through floor below which the SELL_THROUGH pricing variant deepens the rung"
        default: 60
        constraints: "0 < value <= 100, 2 decimal places"
      - name: max_total_discount_pct
        type: number
        source: input
        description: "Cap on DateCodeLot.total_discount_pct any markdown may produce"
        default: 75
        constraints: "0 < value <= 95, 2 decimal places"
      - name: status
        type: enum
        source: system
        description: "Ladder lifecycle status; only ACTIVE ladders may price a markdown"
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, RETIRED}"
      - name: activated_at
        type: datetime
        source: system
        description: "Logical-clock instant the ladder was activated; null while DRAFT"
        default: null

  - name: Department
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the store this fresh department belongs to"
      - name: markdown_ladder_id
        type: string
        source: input
        description: "FK -> MarkdownLadder.id; ladder used to price every markdown on this department's lots"
      - name: code
        type: enum
        source: input
        description: "Fresh department code"
        constraints: "one of {MEAT, DELI, BAKERY, PRODUCE, SEAFOOD, DAIRY}; (store_id, code) unique -> ERR_DEPARTMENT_CODE_DUPLICATE"
      - name: shelf_life_days_default
        type: integer
        source: input
        description: "Department shelf-life used when Item.shelf_life_days is null"
        constraints: "1..60"
      - name: past_date_tolerance_hours
        type: integer
        source: input
        description: "Hours past sell_by_at inside which a compliance finding scores at severity_multiplier 1"
        default: 4
        constraints: "0..72"
      - name: shrink_budget_pct
        type: number
        source: input
        description: "Shrink budget; shrink_cost_ratio_pct strictly above this pushes compliance_status to WATCH"
        default: 2.5
        constraints: "0 < value <= 100, 2 decimal places"
      - name: markdown_policy_profile
        type: enum
        source: input
        description: "Selects the sell-through velocity multiplier: STANDARD=1.00, AGGRESSIVE=1.25, CONSERVATIVE=0.80"
        default: STANDARD
        constraints: "one of {STANDARD, AGGRESSIVE, CONSERVATIVE}"
      - name: compliance_status
        type: enum
        source: computed
        description: "Derived posture gating child write operations; recomputed by calculations.department_compliance_posture"
        default: COMPLIANT
        constraints: "one of {COMPLIANT, WATCH, BLOCKED}; BLOCKED rejects every markdown, sale and donation assignment on this department's lots -> ERR_DEPARTMENT_COMPLIANCE_BLOCKED"
      - name: markdown_liability_cents
        type: integer
        source: computed
        description: "Open markdown giveback exposure; recomputed by calculations.markdown_liability"
        default: 0
      - name: shrink_cost_ratio_pct
        type: number
        source: computed
        description: "Rolling shrink cost ratio over the trailing SHRINK_LOOKBACK_DAYS window; recomputed by calculations.shrink_cost_ratio"
        default: 0
      - name: sweep_epoch
        type: integer
        source: system
        description: "Incremented by one on every successful run-date-code-sweep ops run"
        default: 0
      - name: open_finding_count
        type: integer
        source: computed
        description: "Count of AuditFinding rows with status == OPEN across this department's ComplianceAudit rows"
        default: 0

  - name: Item
    parent: null
    common_fields: true
    fields:
      - name: department_id
        type: string
        source: input
        description: "FK -> Department.id; owning fresh department"
      - name: upc
        type: string
        source: input
        description: "12-digit UPC"
        constraints: "exactly 12 digits [0-9]{12}; unique within department_id -> ERR_ITEM_UPC_DUPLICATE"
      - name: description
        type: string
        source: input
        description: "Item description printed on markdown labels"
        constraints: "1..120 chars"
      - name: base_retail_cents
        type: integer
        source: input
        description: "Undiscounted shelf price in cents"
        constraints: "> 0"
      - name: unit_cost_cents
        type: integer
        source: input
        description: "Landed unit cost in cents; drives the cost floor and every shrink/COGS valuation"
        constraints: "> 0 and < base_retail_cents -> otherwise ERR_INVALID_REQUEST"
      - name: shelf_life_days
        type: integer
        source: input
        description: "Item-specific shelf life in days; null falls back to Department.shelf_life_days_default"
        default: null
        constraints: "null or 1..60"
      - name: donation_eligible
        type: boolean
        source: input
        description: "Whether this item may be assigned to a food-bank pickup at all"
        default: true
      - name: sampling_allowed
        type: boolean
        source: input
        description: "Whether a ShrinkEvent with cause_code SAMPLING may be recorded against this item's lots"
        default: false
      - name: daily_forecast_units
        type: number
        source: input
        description: "Baseline forecast velocity in units/day; feeds expected sell-through and order recommendations"
        constraints: "> 0, 2 decimal places"
      - name: status
        type: enum
        source: input
        description: "Item catalogue status; DISCONTINUED items reject new lots -> ERR_ITEM_DISCONTINUED"
        default: ACTIVE
        constraints: "one of {ACTIVE, DISCONTINUED}"

  - name: DateCodeLot
    parent: null
    common_fields: true
    fields:
      - name: item_id
        type: string
        source: input
        description: "FK -> Item.id; the item this date-coded lot instantiates"
      - name: production_date
        type: string
        source: input
        description: "Production/pack date, calendar date only"
        constraints: "YYYY-MM-DD"
      - name: production_batch_code
        type: string
        source: input
        description: "Optional plant batch code printed on the case label"
        default: null
        constraints: "null or 1..24 chars"
      - name: sell_by_at
        type: datetime
        source: computed
        description: "Sell-by instant; computed by calculations.sell_by_instant"
      - name: quantity_original
        type: integer
        source: input
        description: "Units received on this lot; the conserved total of calculations.lot_unit_conservation"
        constraints: "> 0"
      - name: quantity_on_hand
        type: integer
        source: computed
        description: "Units still on the shelf; initialised to quantity_original"
      - name: units_sold
        type: integer
        source: computed
        description: "Cumulative units sold through the register feed"
        default: 0
      - name: units_shrunk
        type: integer
        source: computed
        description: "Cumulative units removed by ShrinkEvent rows in status VERIFIED or POSTED"
        default: 0
      - name: units_donated
        type: integer
        source: computed
        description: "Cumulative units removed by DonationLotAssignment rows in status PICKED_UP"
        default: 0
      - name: revenue_cents
        type: integer
        source: computed
        description: "Cumulative sales revenue; each sale adds units_sold_in_call * current_price_cents at call time"
        default: 0
      - name: markdown_giveback_cents
        type: integer
        source: computed
        description: "Cumulative giveback; each sale adds units_sold_in_call * (Item.base_retail_cents - current_price_cents) at call time"
        default: 0
      - name: current_price_cents
        type: integer
        source: computed
        description: "Live shelf price; initialised to Item.base_retail_cents and rewritten by calculations.markdown_price"
      - name: current_rung_index
        type: integer
        source: computed
        description: "0-based index into MarkdownLadder.rungs currently in force; -1 means unmarked"
        default: -1
      - name: total_discount_pct
        type: number
        source: computed
        description: "round_half_up((base_retail_cents - current_price_cents) / base_retail_cents * 100, 2)"
        default: 0
      - name: expected_sell_through_pct
        type: number
        source: computed
        description: "Latest value of calculations.expected_sell_through recomputed on every markdown, sale, shrink verification and ops-run sweep"
        default: 0
      - name: past_date_flag
        type: boolean
        source: computed
        description: "Set true by the ops-run sweep when the logical clock has reached sell_by_at while quantity_on_hand > 0"
        default: false
      - name: status
        type: enum
        source: system
        description: "Lot lifecycle state"
        default: FRESH
        constraints: "one of {FRESH, MARKED_DOWN, DONATION_PENDING, DONATED, WITHDRAWN, DEPLETED}"

  - name: MarkdownLabel
    parent: null
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> DateCodeLot.id; lot this price tag belongs to"
      - name: supersedes_label_id
        type: string
        source: system
        description: "FK -> MarkdownLabel.id; the label this one replaces on a re-ladder, null for the first label on a lot"
        default: null
      - name: rung_index
        type: integer
        source: system
        description: "Ladder rung index this label prices, or -1 for a MANUAL_OVERRIDE label"
      - name: reason
        type: enum
        source: system
        description: "Why the label was cut"
        constraints: "one of {LADDER_AUTO, SELL_THROUGH, MANUAL_OVERRIDE, RE_LADDER}"
      - name: from_price_cents
        type: integer
        source: system
        description: "DateCodeLot.current_price_cents immediately before this markdown"
      - name: to_price_cents
        type: integer
        source: system
        description: "New shelf price this label carries"
      - name: discount_pct
        type: number
        source: system
        description: "round_half_up((Item.base_retail_cents - to_price_cents) / Item.base_retail_cents * 100, 2)"
      - name: barcode
        type: string
        source: system
        description: "Scannable markdown barcode, formatted MD-<Item.upc>-<to_price_cents zero-padded to 5 digits>"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the approving DepartmentManager for approval-gated rungs and overrides; null otherwise"
        default: null
      - name: status
        type: enum
        source: system
        description: "Physical tag lifecycle"
        default: QUEUED
        constraints: "one of {QUEUED, PRINTED, APPLIED, VOIDED}"
      - name: printed_at
        type: datetime
        source: system
        description: "Logical-clock instant the label printed; null until then"
        default: null
      - name: applied_at
        type: datetime
        source: system
        description: "Logical-clock instant the label was applied to product; null until then"
        default: null

  - name: ScanPriceCheck
    parent: null
    common_fields: false
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> DateCodeLot.id; lot whose tag was scanned"
      - name: register_lane_code
        type: string
        source: input
        description: "Register lane or handheld that performed the price check"
        constraints: "1..12 chars"
      - name: scanned_price_cents
        type: integer
        source: input
        description: "Price the register rang up"
        constraints: ">= 0"
      - name: expected_price_cents
        type: integer
        source: computed
        description: "DateCodeLot.current_price_cents at check time"
      - name: variance_cents
        type: integer
        source: computed
        description: "scanned_price_cents - expected_price_cents (signed)"
      - name: outcome
        type: enum
        source: computed
        description: "Sign classification of variance_cents"
        constraints: "one of {MATCH, OVERCHARGE, UNDERCHARGE}"
      - name: enforcement_action
        type: enum
        source: computed
        description: "Enforcement applied by calculations.scan_price_enforcement"
        constraints: "one of {NONE, PRICE_CORRECTION, LOT_WITHDRAWN}"
      - name: label_barcode_snapshot
        type: string
        source: computed
        description: "barcode of the lot's APPLIED MarkdownLabel at check time, else null"
        default: null

  - name: DonationPickup
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; store whose dock the truck backs into"
      - name: partner_id
        type: string
        source: input
        description: "FK -> FoodBankPartner.id; food bank collecting the manifest"
      - name: dock_door_code
        type: string
        source: input
        description: "Dock door reserved for the window; must appear in Store.dock_door_codes"
        constraints: "1..8 chars"
      - name: scheduled_window_start
        type: datetime
        source: input
        description: "Inclusive start of the reserved dock window (ISO 8601 UTC, three fractional digits)"
      - name: scheduled_window_end
        type: datetime
        source: input
        description: "Inclusive end of the reserved dock window; must be strictly after scheduled_window_start"
      - name: logistics_status
        type: enum
        source: system
        description: "Truck/dock dimension of the pickup, independent of manifest_status"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, CONFIRMED, COMPLETED, CANCELLED, MISSED}"
      - name: manifest_status
        type: enum
        source: system
        description: "Paperwork dimension of the pickup, independent of logistics_status"
        default: DRAFT
        constraints: "one of {DRAFT, SEALED, RECONCILED}"
      - name: assignment_count
        type: integer
        source: computed
        description: "Count of DonationLotAssignment rows on this pickup with status in {ASSIGNED, PICKED_UP}"
        default: 0
      - name: provisional_value_cents
        type: integer
        source: computed
        description: "Step 1 of calculations.donation_manifest_valuation: retail value of the manifest at 100 percent"
        default: 0
      - name: credit_rate_pct
        type: number
        source: computed
        description: "Step 2 of calculations.donation_manifest_valuation: tier rate selected from provisional_value_cents"
        default: 0
      - name: manifest_credit_cents
        type: integer
        source: computed
        description: "Step 4 of calculations.donation_manifest_valuation: sum of per-line credits, each already rounded"
        default: 0
      - name: units_picked_up_total
        type: integer
        source: computed
        description: "Sum of DonationLotAssignment.quantity_units on this pickup with status == PICKED_UP"
        default: 0
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock instant logistics_status became COMPLETED; null otherwise"
        default: null

  - name: DonationLotAssignment
    parent: null
    common_fields: true
    fields:
      - name: pickup_id
        type: string
        source: input
        description: "FK -> DonationPickup.id; manifest line owner"
      - name: lot_id
        type: string
        source: input
        description: "FK -> DateCodeLot.id; donated lot"
      - name: quantity_units
        type: integer
        source: input
        description: "Units pledged from the lot"
        constraints: "> 0 and <= DateCodeLot.quantity_on_hand at assignment time -> otherwise ERR_INSUFFICIENT_UNITS"
      - name: unit_price_cents_snapshot
        type: integer
        source: computed
        description: "DateCodeLot.current_price_cents captured at assignment time; the manifest values on this snapshot, not on later prices"
      - name: line_value_cents
        type: integer
        source: computed
        description: "quantity_units * unit_price_cents_snapshot"
      - name: line_credit_cents
        type: integer
        source: computed
        description: "Step 3 of calculations.donation_manifest_valuation; 0 until the manifest is sealed"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Manifest line state"
        default: ASSIGNED
        constraints: "one of {ASSIGNED, PICKED_UP, REJECTED}"

  - name: ShrinkEvent
    parent: null
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> DateCodeLot.id; lot the units left"
      - name: cause_code
        type: enum
        source: input
        description: "Shrink cause code driving reporting and forecast feedback"
        constraints: "one of {SPOILAGE, DAMAGE, SAMPLING, THEFT}; SAMPLING requires Item.sampling_allowed == true -> ERR_SAMPLING_NOT_ALLOWED"
      - name: quantity_units
        type: integer
        source: input
        description: "Units written off"
        constraints: "> 0 and <= DateCodeLot.quantity_on_hand at record/resubmit time -> otherwise ERR_INSUFFICIENT_UNITS"
      - name: note
        type: string
        source: input
        description: "Free-text note from the recorder"
        default: null
        constraints: "null or 1..240 chars"
      - name: unit_cost_cents_snapshot
        type: integer
        source: computed
        description: "Item.unit_cost_cents captured when the event was first recorded"
      - name: cost_value_cents
        type: integer
        source: computed
        description: "round_half_up(quantity_units * unit_cost_cents_snapshot * (1 + WASTE_HANDLING_PCT / 100))"
      - name: retail_value_cents
        type: integer
        source: computed
        description: "quantity_units * DateCodeLot.current_price_cents at record/resubmit time"
      - name: recorded_by_user_id
        type: string
        source: system
        description: "X-User-ID that recorded (or most recently resubmitted) the event"
      - name: verified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the verifying DepartmentManager; must differ from recorded_by_user_id -> ERR_SHRINK_SELF_VERIFICATION"
        default: null
      - name: origin
        type: enum
        source: system
        description: "MANUAL for clerk/manager entry; WITHDRAWAL_AUTO for events synthesised by a lot withdrawal"
        default: MANUAL
        constraints: "one of {MANUAL, WITHDRAWAL_AUTO}"
      - name: status
        type: enum
        source: system
        description: "Shrink review state; only VERIFIED and POSTED move units and enter cost reporting"
        default: RECORDED
        constraints: "one of {RECORDED, VERIFIED, DISPUTED, POSTED, VOIDED}"
      - name: verified_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent verification; cleared to null on dispute"
        default: null
      - name: posted_at
        type: datetime
        source: system
        description: "Logical-clock instant the ops-run sweep posted the event; null until then"
        default: null

  - name: ComplianceAudit
    parent: null
    common_fields: true
    fields:
      - name: department_id
        type: string
        source: input
        description: "FK -> Department.id; department being audited for past-date product on shelf"
      - name: window_start_at
        type: datetime
        source: input
        description: "Inclusive start of the audit window; windows on one department are compared half-open [start, end)"
      - name: window_end_at
        type: datetime
        source: input
        description: "Exclusive end of the audit window; must be strictly after window_start_at"
      - name: sweep_status
        type: enum
        source: system
        description: "Shelf-walk dimension, independent of disposition_status"
        default: NOT_STARTED
        constraints: "one of {NOT_STARTED, SWEPT}"
      - name: disposition_status
        type: enum
        source: system
        description: "Follow-up dimension, independent of sweep_status"
        default: PENDING
        constraints: "one of {PENDING, REMEDIATED, ESCALATED}"
      - name: past_date_lot_count
        type: integer
        source: computed
        description: "Number of AuditFinding rows created by the sweep"
        default: 0
      - name: past_date_units_total
        type: integer
        source: computed
        description: "Sum of AuditFinding.units_on_shelf across this audit's findings"
        default: 0
      - name: severity_points_total
        type: integer
        source: computed
        description: "Sum of AuditFinding.severity_points across this audit's findings"
        default: 0
      - name: severity
        type: enum
        source: computed
        description: "Banded from severity_points_total by calculations.compliance_severity"
        default: NONE
        constraints: "one of {NONE, MINOR, MAJOR, CRITICAL}"
      - name: opened_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceAuditor that opened the audit"
      - name: swept_at
        type: datetime
        source: system
        description: "Logical-clock instant of the shelf walk; null until swept"
        default: null

  - name: AuditFinding
    parent: null
    common_fields: true
    fields:
      - name: audit_id
        type: string
        source: system
        description: "FK -> ComplianceAudit.id; audit that produced this finding. Findings are never created by a client request; the sweep step of POST /fresh/compliance-audits/{auditId}/sweep writes this FK."
      - name: lot_id
        type: string
        source: system
        description: "FK -> DateCodeLot.id; past-date lot found on shelf, written by the sweep"
      - name: hours_past_date
        type: integer
        source: computed
        description: "floor((sweep instant - DateCodeLot.sell_by_at) / 3600 seconds) at sweep time"
      - name: units_on_shelf
        type: integer
        source: computed
        description: "DateCodeLot.quantity_on_hand at sweep time"
      - name: severity_multiplier
        type: number
        source: computed
        description: "1, 3 or 6 per calculations.compliance_severity banding on hours_past_date"
      - name: severity_points
        type: integer
        source: computed
        description: "round_half_up(units_on_shelf * severity_multiplier)"
      - name: remediation
        type: enum
        source: system
        description: "Remediation recorded when the finding is closed"
        default: NONE
        constraints: "one of {NONE, WITHDRAWN}"
      - name: status
        type: enum
        source: system
        description: "Finding disposition state"
        default: OPEN
        constraints: "one of {OPEN, RESOLVED, WAIVED}"
      - name: resolved_by_user_id
        type: string
        source: system
        description: "X-User-ID that remediated or waived the finding; null while OPEN"
        default: null

  - name: OrderRecommendation
    parent: null
    common_fields: true
    fields:
      - name: item_id
        type: string
        source: input
        description: "FK -> Item.id; item the order quantity is recommended for"
      - name: supersedes_recommendation_id
        type: string
        source: system
        description: "FK -> OrderRecommendation.id; the ISSUED recommendation this one supersedes for the same item and window, null when there was none"
        default: null
      - name: window_start_date
        type: string
        source: input
        description: "Inclusive first calendar date of the shrink-history window"
        constraints: "YYYY-MM-DD"
      - name: window_end_date
        type: string
        source: input
        description: "Inclusive last calendar date of the shrink-history window; must be >= window_start_date -> ERR_RECOMMENDATION_WINDOW_INVALID"
        constraints: "YYYY-MM-DD"
      - name: method
        type: enum
        source: input
        description: "Which variant of calculations.shrink_history_order_feedback to evaluate"
        default: CHRONOLOGICAL_ACTUAL
        constraints: "one of {CHRONOLOGICAL_ACTUAL, FORWARD_LOOKING_PROJECTED}"
      - name: received_units
        type: integer
        source: computed
        description: "Sum of DateCodeLot.quantity_original for the item's lots created inside the window"
      - name: shrink_units
        type: integer
        source: computed
        description: "Shrink units the selected method counts inside the window"
      - name: shrink_rate_pct
        type: number
        source: computed
        description: "round_half_up(shrink_units / received_units * 100, 2)"
      - name: open_units
        type: integer
        source: computed
        description: "Sum of quantity_on_hand over the item's lots with status in {FRESH, MARKED_DOWN}"
      - name: recommended_order_units
        type: integer
        source: computed
        description: "Final output of calculations.shrink_history_order_feedback"
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID of the DepartmentManager that issued the recommendation; null while DRAFT"
        default: null
      - name: status
        type: enum
        source: system
        description: "Recommendation lifecycle"
        default: DRAFT
        constraints: "one of {DRAFT, ISSUED, SUPERSEDED}"

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: MarkdownLadder
    dimension: status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /fresh/markdown-ladders/{ladderId}/activate"
        actor: StoreOperationsAdmin
        preconditions:
          - "ladder.status == DRAFT"
          - "ladder.rungs has >= 2 entries with strictly decreasing days_remaining_max and strictly increasing discount_pct"
        side_effects:
          - "sets ladder.activated_at = current logical clock"
          - "increments MarkdownLadder.version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /fresh/markdown-ladders/{ladderId}/retire"
        actor: StoreOperationsAdmin
        preconditions:
          - "ladder.status == ACTIVE"
        side_effects:
          - "increments MarkdownLadder.version by 1"
          - "every Department whose markdown_ladder_id == ladder.id keeps its existing lot prices, but any later POST /fresh/lots/{lotId}/markdowns on those departments' lots is rejected with ERR_LADDER_NOT_ACTIVE"
        note: "Retirement never rewrites already-priced lots; it only closes the pricing gate."

  - entity: DateCodeLot
    dimension: status
    initial_state: FRESH
    terminal_states: [DONATED, WITHDRAWN, DEPLETED]
    transitions:
      - from: FRESH
        to: MARKED_DOWN
        trigger: "POST /fresh/lots/{lotId}/markdowns"
        actor: FreshClerk | DepartmentManager
        preconditions:
          - "lot.status == FRESH"
          - "lot.quantity_on_hand > 0"
          - "Department.compliance_status != BLOCKED"
          - "MarkdownLadder.status == ACTIVE"
          - "resolved rung index >= 0 (days_remaining <= rungs[0].days_remaining_max) unless override_price_cents is supplied"
          - "resulting total_discount_pct <= MarkdownLadder.max_total_discount_pct"
          - "resulting price >= cost floor round_half_up(Item.unit_cost_cents * COST_FLOOR_PCT / 100)"
          - "payload expected_lot_version == lot.version"
        side_effects:
          - "creates MarkdownLabel(status=QUEUED, rung_index, reason, from_price_cents=lot.current_price_cents, to_price_cents, discount_pct, barcode, supersedes_label_id=null)"
          - "sets lot.current_price_cents = label.to_price_cents and lot.current_rung_index = label.rung_index"
          - "recomputes lot.total_discount_pct and lot.expected_sell_through_pct"
          - "recomputes Department.markdown_liability_cents"
          - "increments DateCodeLot.version by 1"
      - from: MARKED_DOWN
        to: MARKED_DOWN
        trigger: "POST /fresh/lots/{lotId}/markdowns (re-ladder to a strictly deeper rung)"
        actor: FreshClerk | DepartmentManager
        preconditions:
          - "lot.status == MARKED_DOWN"
          - "lot.quantity_on_hand > 0"
          - "Department.compliance_status != BLOCKED"
          - "MarkdownLadder.status == ACTIVE"
          - "resolved rung index > lot.current_rung_index, else ERR_RUNG_NOT_DEEPER (an override_price_cents below lot.current_price_cents satisfies this as rung_index -1)"
          - "resulting total_discount_pct <= MarkdownLadder.max_total_discount_pct"
          - "payload expected_lot_version == lot.version"
        side_effects:
          - "creates MarkdownLabel(reason=RE_LADDER when a rung deepens, supersedes_label_id = id of the lot's newest label in status QUEUED, PRINTED or APPLIED, else null)"
          - "transitions that superseded label to VOIDED"
          - "sets lot.current_price_cents / current_rung_index / total_discount_pct from the new label"
          - "recomputes Department.markdown_liability_cents"
          - "increments DateCodeLot.version by 1"
        note: "Self-loop: the lot stays MARKED_DOWN while the ladder walks deeper."
      - from: MARKED_DOWN
        to: FRESH
        trigger: "POST /fresh/lots/{lotId}/markdown-void"
        actor: DepartmentManager
        preconditions:
          - "lot.status == MARKED_DOWN"
          - "Department.compliance_status != BLOCKED"
        side_effects:
          - "every MarkdownLabel on the lot in status QUEUED, PRINTED or APPLIED transitions to VOIDED"
          - "restores lot.current_price_cents = Item.base_retail_cents, lot.current_rung_index = -1, lot.total_discount_pct = 0"
          - "recomputes Department.markdown_liability_cents, which returns to the value it held before the first markdown on this lot (calculations.markdown_liability invariant)"
          - "increments DateCodeLot.version by 1"
        note: "Compensating action for the FRESH -> MARKED_DOWN transition; closes the FRESH -> MARKED_DOWN -> FRESH cycle."
      - from: FRESH
        to: DONATION_PENDING
        trigger: "POST /fresh/donation-pickups/{pickupId}/assignments"
        actor: DepartmentManager | FreshClerk
        preconditions:
          - "lot.status in {FRESH, MARKED_DOWN}"
          - "lot donation eligibility per calculations.donation_eligibility holds"
          - "pickup.logistics_status == SCHEDULED and pickup.manifest_status == DRAFT"
        side_effects:
          - "creates DonationLotAssignment(status=ASSIGNED, unit_price_cents_snapshot = lot.current_price_cents, line_value_cents)"
          - "increments DonationPickup.assignment_count and recomputes DonationPickup.provisional_value_cents"
          - "increments DateCodeLot.version by 1"
      - from: MARKED_DOWN
        to: DONATION_PENDING
        trigger: "POST /fresh/donation-pickups/{pickupId}/assignments"
        actor: DepartmentManager | FreshClerk
        preconditions:
          - "same preconditions as FRESH -> DONATION_PENDING"
        side_effects:
          - "same side effects as FRESH -> DONATION_PENDING; the lot's price snapshot is the marked-down price, not base retail"
      - from: DONATION_PENDING
        to: DONATED
        trigger: "POST /fresh/donation-pickups/{pickupId}/complete"
        actor: DonationPartner
        preconditions:
          - "pickup.logistics_status == CONFIRMED and pickup.manifest_status == SEALED"
          - "the lot's assignment on this pickup has status == ASSIGNED"
          - "assignment.quantity_units == lot.quantity_on_hand (the manifest takes the whole remaining balance)"
        side_effects:
          - "assignment.status = PICKED_UP; lot.units_donated += assignment.quantity_units; lot.quantity_on_hand -= assignment.quantity_units"
          - "because quantity_on_hand reached 0 the lot becomes DONATED and every label in QUEUED, PRINTED or APPLIED becomes VOIDED"
          - "recomputes Department.markdown_liability_cents"
          - "increments DateCodeLot.version by 1"
      - from: DONATION_PENDING
        to: MARKED_DOWN
        trigger: "POST /fresh/donation-pickups/{pickupId}/complete (partial manifest line) or /cancel, or the ops-run sweep marking the pickup MISSED"
        actor: DonationPartner | DepartmentManager | system
        preconditions:
          - "the lot has no other assignment in status ASSIGNED on any pickup whose logistics_status is in {SCHEDULED, CONFIRMED}"
          - "lot.current_rung_index >= 0"
        side_effects:
          - "assignment.status = PICKED_UP (partial) or REJECTED (cancel/miss)"
          - "lot.status returns to MARKED_DOWN because current_rung_index >= 0"
          - "increments DateCodeLot.version by 1"
        note: "Deterministic unwind target: MARKED_DOWN when current_rung_index >= 0, otherwise FRESH."
      - from: DONATION_PENDING
        to: FRESH
        trigger: "POST /fresh/donation-pickups/{pickupId}/cancel, or the ops-run sweep marking the pickup MISSED"
        actor: DonationPartner | DepartmentManager | system
        preconditions:
          - "the lot has no other assignment in status ASSIGNED on any pickup whose logistics_status is in {SCHEDULED, CONFIRMED}"
          - "lot.current_rung_index == -1"
        side_effects:
          - "assignment.status = REJECTED"
          - "lot.status returns to FRESH because current_rung_index == -1"
          - "increments DateCodeLot.version by 1"
      - from: FRESH
        to: WITHDRAWN
        trigger: "POST /fresh/lots/{lotId}/withdraw, POST /fresh/audit-findings/{findingId}/remediate with remediation=WITHDRAWN, or scan-price enforcement action LOT_WITHDRAWN"
        actor: FreshClerk | DepartmentManager | ComplianceAuditor | system
        preconditions:
          - "lot.status in {FRESH, MARKED_DOWN, DONATION_PENDING}"
          - "lot.quantity_on_hand > 0"
        side_effects:
          - "creates ShrinkEvent(cause_code=SPOILAGE, origin=WITHDRAWAL_AUTO, quantity_units = lot.quantity_on_hand, status=VERIFIED, recorded_by_user_id = acting X-User-ID, verified_by_user_id = 'system')"
          - "because that ShrinkEvent is VERIFIED, lot.units_shrunk += quantity_units and lot.quantity_on_hand becomes 0"
          - "because the lot now holds zero units its labels in QUEUED, PRINTED or APPLIED become VOIDED and Department.markdown_liability_cents is recomputed"
          - "because Department shrink cost moved, Department.shrink_cost_ratio_pct and Department.compliance_status are recomputed"
          - "any DonationLotAssignment on the lot with status ASSIGNED becomes REJECTED"
          - "increments DateCodeLot.version by 1"
        note: "WITHDRAWN outranks DEPLETED: a lot zeroed by a withdrawal is WITHDRAWN, never DEPLETED."
      - from: MARKED_DOWN
        to: WITHDRAWN
        trigger: "POST /fresh/lots/{lotId}/withdraw, remediation=WITHDRAWN, or scan-price enforcement LOT_WITHDRAWN"
        actor: FreshClerk | DepartmentManager | ComplianceAuditor | system
        preconditions:
          - "same as FRESH -> WITHDRAWN"
        side_effects:
          - "same as FRESH -> WITHDRAWN"
      - from: DONATION_PENDING
        to: WITHDRAWN
        trigger: "POST /fresh/lots/{lotId}/withdraw"
        actor: DepartmentManager | ComplianceAuditor
        preconditions:
          - "same as FRESH -> WITHDRAWN"
        side_effects:
          - "same as FRESH -> WITHDRAWN, plus the lot's ASSIGNED manifest lines become REJECTED and DonationPickup.provisional_value_cents is recomputed"
      - from: FRESH
        to: DEPLETED
        trigger: "POST /fresh/lots/{lotId}/sales or POST /fresh/shrink-events/{shrinkEventId}/verify draining the last unit"
        actor: FreshClerk | DepartmentManager | system
        preconditions:
          - "lot.quantity_on_hand reaches exactly 0 as a consequence of the call"
          - "the call is not a withdrawal"
        side_effects:
          - "labels in QUEUED, PRINTED or APPLIED become VOIDED"
          - "recomputes Department.markdown_liability_cents"
          - "increments DateCodeLot.version by 1"
      - from: MARKED_DOWN
        to: DEPLETED
        trigger: "POST /fresh/lots/{lotId}/sales or POST /fresh/shrink-events/{shrinkEventId}/verify draining the last unit"
        actor: FreshClerk | DepartmentManager | system
        preconditions:
          - "same as FRESH -> DEPLETED"
        side_effects:
          - "same as FRESH -> DEPLETED"
      - from: DEPLETED
        to: MARKED_DOWN
        trigger: "POST /fresh/shrink-events/{shrinkEventId}/dispute against a VERIFIED event that had drained the lot"
        actor: DepartmentManager
        preconditions:
          - "shrink_event.status == VERIFIED and shrink_event.origin == MANUAL"
          - "lot.status == DEPLETED and lot.current_rung_index >= 0"
        side_effects:
          - "lot.units_shrunk -= shrink_event.quantity_units and lot.quantity_on_hand += shrink_event.quantity_units"
          - "lot returns to MARKED_DOWN because current_rung_index >= 0"
          - "recomputes Department.markdown_liability_cents, Department.shrink_cost_ratio_pct and Department.compliance_status"
          - "increments DateCodeLot.version by 1"
        note: "Compensating action that keeps calculations.lot_unit_conservation exact; WITHDRAWN lots are never reopened this way because their event has origin WITHDRAWAL_AUTO."
      - from: DEPLETED
        to: FRESH
        trigger: "POST /fresh/shrink-events/{shrinkEventId}/dispute against a VERIFIED event that had drained the lot"
        actor: DepartmentManager
        preconditions:
          - "shrink_event.status == VERIFIED and shrink_event.origin == MANUAL"
          - "lot.status == DEPLETED and lot.current_rung_index == -1"
        side_effects:
          - "same as DEPLETED -> MARKED_DOWN, with the lot returning to FRESH because current_rung_index == -1"

  - entity: MarkdownLabel
    dimension: status
    initial_state: QUEUED
    terminal_states: [VOIDED]
    transitions:
      - from: QUEUED
        to: PRINTED
        trigger: "POST /fresh/markdown-labels/{labelId}/print"
        actor: FreshClerk
        preconditions:
          - "label.status == QUEUED"
          - "label.to_price_cents == DateCodeLot.current_price_cents (a stale queued label whose lot has since re-laddered is already VOIDED)"
        side_effects:
          - "sets label.printed_at = current logical clock"
          - "increments MarkdownLabel.version by 1"
      - from: PRINTED
        to: APPLIED
        trigger: "POST /fresh/markdown-labels/{labelId}/apply"
        actor: FreshClerk
        preconditions:
          - "label.status == PRINTED, else ERR_LABEL_NOT_PRINTED"
          - "DateCodeLot.status in {FRESH, MARKED_DOWN, DONATION_PENDING}"
        side_effects:
          - "sets label.applied_at = current logical clock"
          - "recomputes DateCodeLot.expected_sell_through_pct, which now includes the promo lift term of calculations.expected_sell_through"
          - "increments MarkdownLabel.version by 1"
      - from: QUEUED
        to: VOIDED
        trigger: "POST /fresh/markdown-labels/{labelId}/void, a deeper re-ladder superseding this label, markdown-void, withdrawal, donation completion or lot depletion"
        actor: FreshClerk | DepartmentManager | system
        preconditions:
          - "label.status != VOIDED, else ERR_LABEL_ALREADY_VOIDED"
        side_effects:
          - "increments MarkdownLabel.version by 1"
      - from: PRINTED
        to: VOIDED
        trigger: "POST /fresh/markdown-labels/{labelId}/void or any of the system voids listed on QUEUED -> VOIDED"
        actor: FreshClerk | DepartmentManager | system
        preconditions:
          - "label.status != VOIDED"
        side_effects:
          - "increments MarkdownLabel.version by 1"
      - from: APPLIED
        to: VOIDED
        trigger: "POST /fresh/markdown-labels/{labelId}/void or any of the system voids listed on QUEUED -> VOIDED"
        actor: FreshClerk | DepartmentManager | system
        preconditions:
          - "label.status != VOIDED"
        side_effects:
          - "recomputes DateCodeLot.expected_sell_through_pct, dropping the promo lift term"
          - "increments MarkdownLabel.version by 1"

  - entity: ShrinkEvent
    dimension: status
    initial_state: RECORDED
    terminal_states: [POSTED, VOIDED]
    transitions:
      - from: RECORDED
        to: VERIFIED
        trigger: "POST /fresh/shrink-events/{shrinkEventId}/verify"
        actor: DepartmentManager
        preconditions:
          - "event.status == RECORDED, else ERR_SHRINK_NOT_VERIFIABLE"
          - "X-User-ID != event.recorded_by_user_id, else ERR_SHRINK_SELF_VERIFICATION"
          - "event.quantity_units <= DateCodeLot.quantity_on_hand, else ERR_INSUFFICIENT_UNITS"
        side_effects:
          - "sets verified_by_user_id and verified_at; recomputes cost_value_cents"
          - "hop 1: lot.units_shrunk += quantity_units and lot.quantity_on_hand -= quantity_units"
          - "hop 2: because quantity_on_hand reached 0, lot.status becomes DEPLETED (or stays WITHDRAWN when origin == WITHDRAWAL_AUTO)"
          - "hop 3: because the lot is no longer sellable, its labels in QUEUED, PRINTED or APPLIED become VOIDED and Department.markdown_liability_cents is recomputed"
          - "hop 4: because department shrink cost moved, Department.shrink_cost_ratio_pct is recomputed and Department.compliance_status becomes WATCH when the ratio exceeds shrink_budget_pct"
          - "increments ShrinkEvent.version and DateCodeLot.version by 1"
        note: "Depth-4 transitive cascade; each hop is caused by the previous hop, not by the verify call itself."
      - from: RECORDED
        to: DISPUTED
        trigger: "POST /fresh/shrink-events/{shrinkEventId}/dispute"
        actor: DepartmentManager
        preconditions:
          - "event.status == RECORDED"
        side_effects:
          - "sets verified_by_user_id = null and verified_at = null"
          - "no unit movement at all: lot.quantity_on_hand, units_shrunk, Department.markdown_liability_cents and Department.compliance_status are untouched"
          - "increments ShrinkEvent.version by 1"
        note: "Branch sibling of RECORDED -> VERIFIED with a deliberately disjoint side-effect set."
      - from: VERIFIED
        to: DISPUTED
        trigger: "POST /fresh/shrink-events/{shrinkEventId}/dispute"
        actor: DepartmentManager
        preconditions:
          - "event.status == VERIFIED and event.origin == MANUAL"
        side_effects:
          - "lot.units_shrunk -= quantity_units and lot.quantity_on_hand += quantity_units, restoring calculations.lot_unit_conservation"
          - "if the lot was DEPLETED it returns to MARKED_DOWN (current_rung_index >= 0) or FRESH (current_rung_index == -1)"
          - "recomputes Department.markdown_liability_cents, Department.shrink_cost_ratio_pct and Department.compliance_status"
          - "clears verified_by_user_id and verified_at"
          - "increments ShrinkEvent.version and DateCodeLot.version by 1"
      - from: DISPUTED
        to: RECORDED
        trigger: "POST /fresh/shrink-events/{shrinkEventId}/resubmit"
        actor: FreshClerk
        preconditions:
          - "event.status == DISPUTED, else ERR_SHRINK_NOT_DISPUTED"
          - "payload quantity_units > 0 and <= DateCodeLot.quantity_on_hand"
        side_effects:
          - "overwrites quantity_units, note, recorded_by_user_id (the resubmitting clerk) and retail_value_cents; unit_cost_cents_snapshot is preserved from the original record"
          - "recomputes cost_value_cents"
          - "increments ShrinkEvent.version by 1"
        note: "Closes the RECORDED -> VERIFIED -> DISPUTED -> RECORDED cycle."
      - from: DISPUTED
        to: VOIDED
        trigger: "POST /fresh/shrink-events/{shrinkEventId}/void"
        actor: DepartmentManager
        preconditions:
          - "event.status == DISPUTED"
        side_effects:
          - "increments ShrinkEvent.version by 1"
      - from: VERIFIED
        to: POSTED
        trigger: "POST /fresh/departments/{departmentId}/run-date-code-sweep (system posting step)"
        actor: system
        preconditions:
          - "event.status == VERIFIED"
          - "current logical clock >= event.verified_at + POSTING_LAG_HOURS hours"
        side_effects:
          - "sets posted_at = current logical clock"
          - "the event becomes immutable: dispute is no longer accepted (ERR_SHRINK_NOT_VERIFIABLE)"
          - "increments ShrinkEvent.version by 1"

  - entity: DonationPickup
    dimension: logistics_status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, MISSED]
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /fresh/donation-pickups/{pickupId}/confirm"
        actor: DonationPartner
        preconditions:
          - "pickup.logistics_status == SCHEDULED, else ERR_PICKUP_NOT_CONFIRMABLE"
          - "X-User-ID == pickup.partner_id"
          - "FoodBankPartner.status == ACTIVE, else ERR_PARTNER_NOT_ACTIVE"
        side_effects:
          - "increments DonationPickup.version by 1"
        note: "manifest_status is untouched: a pickup may be confirmed while its manifest is still DRAFT."
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /fresh/donation-pickups/{pickupId}/complete"
        actor: DonationPartner
        preconditions:
          - "pickup.logistics_status == CONFIRMED, else ERR_PICKUP_NOT_COMPLETABLE"
          - "pickup.manifest_status == SEALED, else ERR_MANIFEST_NOT_SEALED"
          - "X-User-ID == pickup.partner_id"
        side_effects:
          - "every assignment in status ASSIGNED becomes PICKED_UP; each lot's units_donated grows and quantity_on_hand shrinks by quantity_units"
          - "each fully drained lot becomes DONATED; each partially drained lot returns to MARKED_DOWN or FRESH by its current_rung_index"
          - "sets completed_at, units_picked_up_total; increments FoodBankPartner.pickups_completed_count and units_received_total"
          - "recomputes Department.markdown_liability_cents for every affected department"
          - "increments DonationPickup.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /fresh/donation-pickups/{pickupId}/cancel"
        actor: DepartmentManager | DonationPartner
        preconditions:
          - "pickup.logistics_status in {SCHEDULED, CONFIRMED}"
          - "when acting as DonationPartner, X-User-ID == pickup.partner_id"
        side_effects:
          - "every assignment in status ASSIGNED becomes REJECTED and each lot leaves DONATION_PENDING for MARKED_DOWN or FRESH by its current_rung_index"
          - "the dock window is released, so a later pickup may occupy the overlapping interval"
          - "increments DonationPickup.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /fresh/donation-pickups/{pickupId}/cancel"
        actor: DepartmentManager | DonationPartner
        preconditions:
          - "same as SCHEDULED -> CANCELLED"
        side_effects:
          - "same as SCHEDULED -> CANCELLED"
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /fresh/departments/{departmentId}/run-date-code-sweep (system miss step)"
        actor: system
        preconditions:
          - "pickup.store_id == Department.store_id"
          - "current logical clock > pickup.scheduled_window_end"
        side_effects:
          - "every assignment in status ASSIGNED becomes REJECTED and each lot leaves DONATION_PENDING for MARKED_DOWN or FRESH by its current_rung_index"
          - "increments DonationPickup.version by 1"
      - from: CONFIRMED
        to: MISSED
        trigger: "POST /fresh/departments/{departmentId}/run-date-code-sweep (system miss step)"
        actor: system
        preconditions:
          - "same as SCHEDULED -> MISSED"
        side_effects:
          - "same as SCHEDULED -> MISSED"

  - entity: DonationPickup
    dimension: manifest_status
    initial_state: DRAFT
    terminal_states: [RECONCILED]
    transitions:
      - from: DRAFT
        to: SEALED
        trigger: "POST /fresh/donation-pickups/{pickupId}/seal"
        actor: DepartmentManager
        preconditions:
          - "pickup.manifest_status == DRAFT"
          - "pickup.logistics_status in {SCHEDULED, CONFIRMED}"
          - "pickup.assignment_count >= 1, else ERR_EMPTY_MANIFEST"
        side_effects:
          - "runs calculations.donation_manifest_valuation and writes provisional_value_cents, credit_rate_pct, manifest_credit_cents and every assignment's line_credit_cents"
          - "further assignments are rejected with ERR_MANIFEST_SEALED"
          - "increments DonationPickup.version by 1"
        note: "logistics_status is untouched: sealing does not confirm the truck."
      - from: SEALED
        to: RECONCILED
        trigger: "POST /fresh/donation-pickups/{pickupId}/reconcile"
        actor: DepartmentManager
        preconditions:
          - "pickup.manifest_status == SEALED"
          - "pickup.logistics_status in {COMPLETED, CANCELLED, MISSED}, else ERR_PICKUP_NOT_RECONCILABLE"
        side_effects:
          - "recomputes manifest_credit_cents over the assignments in status PICKED_UP only, so rejected lines drop out of the credit"
          - "increments DonationPickup.version by 1"

  - entity: ComplianceAudit
    dimension: sweep_status
    initial_state: NOT_STARTED
    terminal_states: [SWEPT]
    transitions:
      - from: NOT_STARTED
        to: SWEPT
        trigger: "POST /fresh/compliance-audits/{auditId}/sweep"
        actor: ComplianceAuditor
        preconditions:
          - "audit.sweep_status == NOT_STARTED, else ERR_AUDIT_ALREADY_SWEPT"
          - "current logical clock >= audit.window_start_at, else ERR_AUDIT_WINDOW_NOT_OPEN"
        side_effects:
          - "creates one AuditFinding per past-date lot in the department per calculations.compliance_severity input set, processed in DateCodeLot.created_at ASC order"
          - "writes past_date_lot_count, past_date_units_total, severity_points_total and severity"
          - "sets swept_at; recomputes Department.open_finding_count and Department.compliance_status"
          - "increments ComplianceAudit.version by 1"
        note: "disposition_status stays PENDING: the shelf walk and the follow-up are independent dimensions."

  - entity: ComplianceAudit
    dimension: disposition_status
    initial_state: PENDING
    terminal_states: [REMEDIATED, ESCALATED]
    transitions:
      - from: PENDING
        to: REMEDIATED
        trigger: "POST /fresh/audit-findings/{findingId}/remediate closing the audit's last OPEN finding (system bubble-up)"
        actor: system
        preconditions:
          - "audit.sweep_status == SWEPT"
          - "every AuditFinding on the audit has status in {RESOLVED, WAIVED}"
        side_effects:
          - "recomputes Department.open_finding_count and Department.compliance_status; the audit no longer contributes a WATCH or BLOCKED reason"
          - "increments ComplianceAudit.version by 1"
        note: "Bubble-up: parent disposition is derived from the aggregate state of its findings."
      - from: PENDING
        to: ESCALATED
        trigger: "POST /fresh/compliance-audits/{auditId}/escalate"
        actor: ComplianceAuditor
        preconditions:
          - "audit.sweep_status == SWEPT"
          - "audit.severity == CRITICAL, else ERR_ESCALATION_NOT_WARRANTED"
          - "at least one AuditFinding on the audit is still OPEN"
        side_effects:
          - "sets Department.compliance_status = BLOCKED, which rejects every later markdown, sale and donation assignment on that department's lots"
          - "increments ComplianceAudit.version by 1"
      - from: ESCALATED
        to: REMEDIATED
        trigger: "POST /fresh/audit-findings/{findingId}/remediate closing the audit's last OPEN finding (system bubble-up)"
        actor: system
        preconditions:
          - "every AuditFinding on the audit has status in {RESOLVED, WAIVED}"
        side_effects:
          - "clears the BLOCKED reason and recomputes Department.compliance_status per calculations.department_compliance_posture"
          - "increments ComplianceAudit.version by 1"

  - entity: AuditFinding
    dimension: status
    initial_state: OPEN
    terminal_states: [RESOLVED, WAIVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /fresh/audit-findings/{findingId}/remediate with remediation=WITHDRAWN"
        actor: DepartmentManager | ComplianceAuditor
        preconditions:
          - "finding.status == OPEN, else ERR_FINDING_ALREADY_RESOLVED"
          - "DateCodeLot.quantity_on_hand > 0, else ERR_REMEDIATION_NOT_PERMITTED"
        side_effects:
          - "hop 1: sets remediation=WITHDRAWN, resolved_by_user_id and status=RESOLVED"
          - "hop 2: because the finding resolved with WITHDRAWN, the lot transitions to WITHDRAWN and a ShrinkEvent(cause_code=SPOILAGE, origin=WITHDRAWAL_AUTO, status=VERIFIED) is created for its remaining units"
          - "hop 3: because that ShrinkEvent is VERIFIED, lot.units_shrunk grows, quantity_on_hand becomes 0, its labels void and Department.markdown_liability_cents plus shrink_cost_ratio_pct are recomputed"
          - "hop 4: because the audit's last OPEN finding closed, ComplianceAudit.disposition_status becomes REMEDIATED and Department.compliance_status is recomputed"
          - "increments AuditFinding.version by 1"
      - from: OPEN
        to: WAIVED
        trigger: "POST /fresh/audit-findings/{findingId}/remediate with waive=true"
        actor: ComplianceAuditor
        preconditions:
          - "finding.status == OPEN"
          - "finding.severity_multiplier == 1 (inside Department.past_date_tolerance_hours), else ERR_WAIVER_NOT_PERMITTED"
        side_effects:
          - "sets status=WAIVED, remediation=NONE, resolved_by_user_id; the lot is left on the shelf untouched"
          - "recomputes Department.open_finding_count; may bubble the audit to REMEDIATED"
          - "increments AuditFinding.version by 1"

  - entity: OrderRecommendation
    dimension: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /fresh/order-recommendations/{recommendationId}/issue"
        actor: DepartmentManager
        preconditions:
          - "recommendation.status == DRAFT, else ERR_RECOMMENDATION_NOT_ISSUABLE"
          - "recommendation.received_units > 0"
        side_effects:
          - "sets issued_by_user_id"
          - "increments OrderRecommendation.version by 1"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "POST /fresh/order-recommendations (a new recommendation for the same item_id, window_start_date and window_end_date)"
        actor: StoreOperationsAdmin | DepartmentManager
        preconditions:
          - "the prior recommendation.status == ISSUED"
          - "the new request carries expected_item_version == Item.version"
        side_effects:
          - "the new recommendation's supersedes_recommendation_id is set to the prior recommendation's id"
          - "increments OrderRecommendation.version by 1 on the superseded row"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent's version, per SKILL.md filter)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: markdown-create-stale-lot
    parent_entity: DateCodeLot
    write_endpoint: "POST /fresh/lots/{lotId}/markdowns"
    occ_field: "expected_lot_version"
    description: |
      A markdown request whose expected_lot_version is behind DateCodeLot.version
      is rejected with ERR_STALE_LOT_VERSION. The rule exists because a second
      markdown on an already MARKED_DOWN lot is legitimate product behaviour (the
      ladder walks deeper and the new label supersedes the old one), so nothing in
      the state machine would reject a writer whose view of the lot predates the
      first markdown, the last sale, or a verified shrink. OCC turns that into a
      deterministic stale-version check on the parent lot.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412
  - rule_id: recommendation-create-stale-item
    parent_entity: Item
    write_endpoint: "POST /fresh/order-recommendations"
    occ_field: "expected_item_version"
    description: |
      Creating an OrderRecommendation against an Item whose version has advanced
      since the client last observed it is rejected with ERR_STALE_ITEM_VERSION.
      A new recommendation legitimately supersedes the prior ISSUED recommendation
      for the same item and window, so a writer holding a stale view of the item
      (its forecast velocity, cost, or a recommendation another writer already
      issued) would otherwise silently overwrite a newer basis.
    error_id: ERR_STALE_ITEM_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: sell_by_instant
    trigger: "POST /fresh/lots (lot creation); the value is immutable afterwards"
    algorithm: threshold
    formula: |
      effective_shelf_life_days = Item.shelf_life_days if Item.shelf_life_days is not null
                                  else Department.shelf_life_days_default
      sell_by_at = midnight_utc(DateCodeLot.production_date) + effective_shelf_life_days * 86400 seconds
    input_set: "One lot; Item and Department are read at creation time and never re-read"
    constants: {}
    precision: "ISO 8601 UTC with exactly three fractional digits, e.g. 2026-08-12T00:00:00.000Z"

  - name: days_remaining
    trigger: "Every markdown quote, markdown, ops-run sweep and donation eligibility check"
    algorithm: threshold
    formula: |
      days_remaining = floor((DateCodeLot.sell_by_at - current_logical_clock) / 86400 seconds)
      # integer floor toward negative infinity: 1.99 days -> 1, -0.25 days -> -1
    input_set: "One lot against the logical clock; never the host wall clock"
    constants: {}
    precision: "integer, may be negative"

  - name: ladder_rung_selection
    trigger: "Every POST /fresh/lots/{lotId}/markdowns without override_price_cents, GET /fresh/lots/{lotId}/markdown-quote, and the ops-run auto-markdown step"
    algorithm: threshold
    formula: |
      candidates = [ i for i, rung in enumerate(MarkdownLadder.rungs)
                     if days_remaining <= rung.days_remaining_max ]      # inclusive <=
      base_rung_index = max(candidates) if candidates else -1            # deepest satisfied rung
      if base_rung_index == -1: reject with ERR_RUNG_NOT_REACHED
    input_set: "The ladder attached to the lot's Department; rungs are indexed by array position and ordered days_remaining_max DESC"
    constants: {}
    precision: "integer index; the boundary is inclusive, so days_remaining == rung.days_remaining_max selects that rung"

  - name: expected_sell_through
    trigger: "Lot creation, every markdown, every sale, every shrink verification or dispute, every label apply or void, and every ops-run sweep"
    algorithm: weighted_scoring
    formula: |
      profile_multiplier = 1.00 if Department.markdown_policy_profile == STANDARD
                           else 1.25 if AGGRESSIVE
                           else 0.80                                     # CONSERVATIVE
      promo_lift_units = quantity_on_hand * PROMO_LIFT_PCT / 100
                         if the lot has >= 1 MarkdownLabel with status == APPLIED
                         else 0
      projected_units = Item.daily_forecast_units * profile_multiplier * max(days_remaining, 0)
                        + promo_lift_units
      expected_sell_through_pct = min(100, round_half_up(projected_units / quantity_on_hand * 100, 2))
                                  if quantity_on_hand > 0 else 0
    input_set: |
      One lot. Three numeric inputs (Item.daily_forecast_units, days_remaining, quantity_on_hand)
      interact with a conditional branch on Department.markdown_policy_profile and a second
      conditional branch on the existence of an APPLIED child label, then pass through min().
      A label created by a markdown request is QUEUED, so a markdown never lifts its own
      sell-through; POST /fresh/markdown-labels/{labelId}/apply is the single call that flips a
      label to APPLIED and therefore the first recomputation that includes PROMO_LIFT_PCT.
    constants:
      PROMO_LIFT_PCT: 10
    precision: "2 decimal places, round_half_up, then clamped by min(100, .)"

  - name: markdown_price
    trigger: "POST /fresh/lots/{lotId}/markdowns, GET /fresh/lots/{lotId}/markdown-quote, and the ops-run auto-markdown step"
    algorithm: tiered_pricing
    formula: |
      cost_floor_price_cents = round_half_up(Item.unit_cost_cents * COST_FLOOR_PCT / 100)
      discount_pct  = MarkdownLadder.rungs[effective_rung_index].discount_pct
      raw_price     = Item.base_retail_cents * (1 - discount_pct / 100)
      to_price_cents = max(cost_floor_price_cents, round_half_up(raw_price))
      total_discount_pct = round_half_up((Item.base_retail_cents - to_price_cents)
                                         / Item.base_retail_cents * 100, 2)
      reject with ERR_MAX_DISCOUNT_EXCEEDED when total_discount_pct > MarkdownLadder.max_total_discount_pct
      reject with ERR_PRICE_BELOW_COST_FLOOR when an explicit override_price_cents < cost_floor_price_cents
    input_set: "One lot, its Item, its Department and that Department's ACTIVE ladder"
    constants:
      COST_FLOOR_PCT: 40
      SELL_THROUGH_STEP_PCT: 20
    precision: "integer cents; round_half_up before the max() clamp; total_discount_pct to 2 decimals, round_half_up"
    variants:
      - name: LADDER_DAYS
        when: "pricing_variant omitted (default) or LADDER_DAYS; also the variant the ops-run auto-markdown step uses"
        difference: "effective_rung_index = ladder_rung_selection.base_rung_index — days remaining alone decide the rung; expected sell-through is recorded but never priced in"
      - name: SELL_THROUGH
        when: "pricing_variant == SELL_THROUGH on the markdown request, and always reported alongside LADDER_DAYS by the markdown-quote endpoint"
        difference: |
          shortfall_steps = 0 if expected_sell_through_pct >= MarkdownLadder.sell_through_floor_pct
                            else ceil((MarkdownLadder.sell_through_floor_pct - expected_sell_through_pct)
                                      / SELL_THROUGH_STEP_PCT)
          effective_rung_index = min(len(rungs) - 1, base_rung_index + shortfall_steps)
          Slow-moving lots are therefore priced one or more rungs deeper than the
          calendar alone would allow, producing a strictly lower to_price_cents for
          identical lot data whenever shortfall_steps > 0.
      - name: MANUAL_OVERRIDE
        when: "override_price_cents supplied; requires DepartmentManager plus a distinct approval_manager_user_id"
        difference: "to_price_cents = override_price_cents, rung_index recorded as -1, reason MANUAL_OVERRIDE; the max-discount and cost-floor guards still apply"

  - name: lot_unit_conservation
    trigger: "Asserted after every unit-moving call: sales, shrink verification, shrink dispute, donation completion, withdrawal"
    algorithm: aggregation
    formula: |
      DateCodeLot.quantity_original == DateCodeLot.quantity_on_hand
                                     + DateCodeLot.units_sold
                                     + DateCodeLot.units_shrunk
                                     + DateCodeLot.units_donated
    input_set: |
      One lot. units_shrunk counts only ShrinkEvent rows in status VERIFIED or POSTED;
      RECORDED, DISPUTED and VOIDED events contribute nothing. units_donated counts only
      DonationLotAssignment rows in status PICKED_UP.
    constants: {}
    precision: "exact integers; the invariant must hold after a forward action and again after its compensating action"

  - name: markdown_liability
    trigger: "Every markdown, markdown void, sale, shrink verification or dispute, withdrawal, donation completion and ops-run sweep"
    algorithm: aggregation
    formula: |
      Department.markdown_liability_cents =
        sum over lots L where Item(L).department_id == Department.id
                          and L.status in {FRESH, MARKED_DOWN, DONATION_PENDING}
        of ( L.quantity_on_hand * (Item(L).base_retail_cents - L.current_price_cents) )
    input_set: |
      (a) source entity: DateCodeLot filtered to status in {FRESH, MARKED_DOWN, DONATION_PENDING};
      DONATED, WITHDRAWN and DEPLETED lots are excluded. (b) window: current state only, no time
      filter. (c) order-insensitive: integer addition, no rounding, so no tie-break is required.
    constants: {}
    precision: "exact integer cents; full recompute from lot state on every trigger, never an incremental delta"

  - name: scan_price_enforcement
    trigger: "POST /fresh/lots/{lotId}/scan-price-checks"
    algorithm: threshold
    formula: |
      expected_price_cents = DateCodeLot.current_price_cents
      variance_cents = scanned_price_cents - expected_price_cents
      outcome = MATCH if variance_cents == 0
                else OVERCHARGE if variance_cents > 0
                else UNDERCHARGE
      if outcome == OVERCHARGE and variance_cents >= OVERCHARGE_ENFORCEMENT_CENTS:
          enforcement_action = LOT_WITHDRAWN     # the lot is pulled from the shelf
      elif outcome == MATCH:
          enforcement_action = NONE
      else:
          enforcement_action = PRICE_CORRECTION  # any other non-zero variance only flags
      # when enforcement_action == LOT_WITHDRAWN the check also drives the lot's
      # FRESH|MARKED_DOWN|DONATION_PENDING -> WITHDRAWN transition and its cascade
    input_set: "One lot and its APPLIED label, if any; the check itself is append-only"
    constants:
      OVERCHARGE_ENFORCEMENT_CENTS: 25
    precision: "integer cents; the enforcement boundary is inclusive (variance_cents == 25 withdraws the lot, 24 only flags a correction)"

  - name: donation_eligibility
    trigger: "POST /fresh/donation-pickups/{pickupId}/assignments"
    algorithm: interval_merge
    formula: |
      window_open_at = DateCodeLot.sell_by_at - DONATION_WINDOW_HOURS * 3600 seconds
      eligible iff Item.donation_eligible == true
              and DateCodeLot.status in {FRESH, MARKED_DOWN}
              and DateCodeLot.quantity_on_hand > 0
              and current_logical_clock <  DateCodeLot.sell_by_at     # else ERR_PAST_DATE_NOT_DONATABLE
              and current_logical_clock >= window_open_at             # else ERR_DONATION_WINDOW_CLOSED
              and Department.code in FoodBankPartner.accepted_department_codes
              and (Department.code not in {MEAT, SEAFOOD} or FoodBankPartner.cold_chain_certified == true)
    input_set: "One lot, its Item, its Department, and the pickup's FoodBankPartner"
    constants:
      DONATION_WINDOW_HOURS: 48
    precision: "half-open interval [sell_by_at - 48h, sell_by_at); the instant exactly 48h before sell-by is eligible, the sell-by instant itself is not"

  - name: dock_window_conflict
    trigger: "POST /fresh/donation-pickups"
    algorithm: interval_merge
    formula: |
      conflict iff there exists an existing pickup P with
          P.store_id == new.store_id
          and P.dock_door_code == new.dock_door_code
          and P.logistics_status in {SCHEDULED, CONFIRMED}
          and new.scheduled_window_start <= P.scheduled_window_end   + DOCK_BUFFER_MINUTES * 60
          and P.scheduled_window_start   <= new.scheduled_window_end + DOCK_BUFFER_MINUTES * 60
      -> ERR_DOCK_WINDOW_OVERLAP
    input_set: |
      (a) source entity: DonationPickup filtered to logistics_status in {SCHEDULED, CONFIRMED};
      COMPLETED, CANCELLED and MISSED windows are released and never conflict. (b) window: the
      candidate interval widened by a 30-minute turnaround buffer on both sides. (c) the check is
      a pure existence test, so no ordering or tie-break applies.
    constants:
      DOCK_BUFFER_MINUTES: 30
    precision: |
      Fully CLOSED interval arithmetic with a buffer: a new window whose start equals an existing
      window's end plus exactly 30 minutes still conflicts; one second later does not. Contrast
      with audit_window_conflict, which uses half-open arithmetic and no buffer.

  - name: audit_window_conflict
    trigger: "POST /fresh/compliance-audits"
    algorithm: interval_merge
    formula: |
      conflict iff there exists an existing audit A with
          A.department_id == new.department_id
          and A.disposition_status in {PENDING, ESCALATED}
          and new.window_start_at < A.window_end_at
          and A.window_start_at   < new.window_end_at
      -> ERR_AUDIT_WINDOW_OVERLAP
    input_set: |
      (a) source entity: ComplianceAudit filtered to disposition_status in {PENDING, ESCALATED};
      REMEDIATED audits are closed out and never conflict. (b) window: half-open [start, end) on
      both sides, no buffer. (c) pure existence test, no ordering or tie-break.
    constants: {}
    precision: |
      HALF-OPEN interval arithmetic: an audit starting exactly at another audit's window_end_at is
      accepted (windows may abut), while one second of true overlap is rejected.

  - name: donation_manifest_valuation
    trigger: "POST /fresh/donation-pickups/{pickupId}/seal, and again on reconcile over PICKED_UP lines only"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is pinned; the tier is keyed on the PROVISIONAL total, never on the
      # credited total, so the two readings of this rule cannot be confused.
      step 1: provisional_value_cents = sum over assignments A on the pickup with
              A.status == ASSIGNED of (A.quantity_units * A.unit_price_cents_snapshot)
      step 2: credit_rate_pct = CREDIT_RATE_TIER_1_PCT if provisional_value_cents <  TIER_2_FLOOR_CENTS
                                else CREDIT_RATE_TIER_2_PCT if provisional_value_cents < TIER_3_FLOOR_CENTS
                                else CREDIT_RATE_TIER_3_PCT
      step 3: for each assignment, in DonationLotAssignment.created_at ASC order:
                  A.line_credit_cents = round_half_up(A.quantity_units
                                                      * A.unit_price_cents_snapshot
                                                      * credit_rate_pct / 100)
      step 4: manifest_credit_cents = sum of the already rounded A.line_credit_cents
      # Re-keying the tier from manifest_credit_cents (a lower number that can fall into a lower
      # tier) is wrong and is exactly the ambiguity this order removes.
    input_set: |
      (a) source entity: DonationLotAssignment filtered to status == ASSIGNED at seal time, or
      status == PICKED_UP at reconcile time. (b) window: current manifest only. (c) order: lines
      are credited in created_at ASC order; rounding is per line before summation.
    constants:
      CREDIT_RATE_TIER_1_PCT: 62.5
      CREDIT_RATE_TIER_2_PCT: 72.5
      CREDIT_RATE_TIER_3_PCT: 80
      TIER_2_FLOOR_CENTS: 50000
      TIER_3_FLOOR_CENTS: 200000
    precision: "integer cents; round_half_up per line in step 3, then exact integer summation in step 4"

  - name: gross_margin_impact
    trigger: "GET /fresh/departments/{departmentId}/margin-report"
    algorithm: aggregation
    formula: |
      # Rounding order is pinned: round EVERY per-lot line to whole cents FIRST, then sum the
      # rounded lines. Summing the unrounded products and rounding once at the end is wrong.
      for each lot L in the input set, in DateCodeLot.created_at ASC order:
          revenue_line          = L.revenue_cents                                  # already integral
          giveback_line         = L.markdown_giveback_cents                        # already integral
          cogs_line             = round_half_up(L.units_sold    * Item(L).unit_cost_cents * (1 + WASTE_HANDLING_PCT / 100))
          shrink_cost_line      = round_half_up(L.units_shrunk  * Item(L).unit_cost_cents * (1 + WASTE_HANDLING_PCT / 100))
          donation_cost_line    = round_half_up(L.units_donated * Item(L).unit_cost_cents * (1 + WASTE_HANDLING_PCT / 100))
      revenue_cents          = sum(revenue_line)
      markdown_giveback_cents = sum(giveback_line)
      cogs_cents             = sum(cogs_line)
      shrink_cost_cents      = sum(shrink_cost_line)
      donation_cost_cents    = sum(donation_cost_line)
      gross_margin_cents     = revenue_cents - cogs_cents - shrink_cost_cents - donation_cost_cents
      gross_margin_pct       = round_half_up(gross_margin_cents / revenue_cents * 100, 2) if revenue_cents > 0 else 0
      shrink_cost_ratio_pct  = round_half_up(shrink_cost_cents
                               / (cogs_cents + shrink_cost_cents + donation_cost_cents) * 100, 2)
                               if (cogs_cents + shrink_cost_cents + donation_cost_cents) > 0 else 0
    input_set: |
      (a) source entity: DateCodeLot whose Item.department_id == the path department, in every
      status including DONATED, WITHDRAWN and DEPLETED. units_shrunk already excludes RECORDED,
      DISPUTED and VOIDED shrink, so only VERIFIED and POSTED shrink reaches the report.
      (b) window: lots whose created_at calendar date is within [window_start_date, window_end_date],
      both bounds INCLUSIVE, evaluated in UTC. (c) order: created_at ASC; because every line is
      rounded before summation the result is order-insensitive, and no tie-break is needed.
    constants:
      WASTE_HANDLING_PCT: 3.5
    precision: "integer cents per line (round_half_up) then exact summation; both percentages to 2 decimals, round_half_up on the magnitude with the sign preserved"

  - name: shrink_cost_ratio
    trigger: "Every shrink verification, dispute, withdrawal, donation completion and ops-run sweep"
    algorithm: aggregation
    formula: |
      window = [current_logical_clock - SHRINK_LOOKBACK_DAYS * 86400, current_logical_clock]
      over lots L of the department whose L.created_at is inside window, using the same per-line
      rounding as gross_margin_impact:
          Department.shrink_cost_ratio_pct = round_half_up(shrink_cost_cents
              / (cogs_cents + shrink_cost_cents + donation_cost_cents) * 100, 2)
              if the denominator > 0 else 0
    input_set: |
      (a) source entity: DateCodeLot of the department with created_at inside the trailing window;
      shrink counted through L.units_shrunk (VERIFIED and POSTED only). (b) window: closed on both
      ends, anchored to the logical clock. (c) per-line rounding then summation, order-insensitive.
    constants:
      SHRINK_LOOKBACK_DAYS: 7
      WASTE_HANDLING_PCT: 3.5
    precision: "2 decimal places, round_half_up; exactly 0 when the denominator is 0"

  - name: compliance_severity
    trigger: "POST /fresh/compliance-audits/{auditId}/sweep"
    algorithm: weighted_scoring
    formula: |
      input set: lots L with Item(L).department_id == audit.department_id
                 and L.status in {FRESH, MARKED_DOWN, DONATION_PENDING}
                 and L.quantity_on_hand > 0
                 and current_logical_clock >= L.sell_by_at
                 processed in L.created_at ASC order
      per finding:
          hours_past_date     = floor((current_logical_clock - L.sell_by_at) / 3600)
          units_on_shelf      = L.quantity_on_hand
          severity_multiplier = 1 if hours_past_date <= Department.past_date_tolerance_hours
                                else 3 if hours_past_date <= SEVERITY_TIER_2_HOURS
                                else 6
          severity_points     = round_half_up(units_on_shelf * severity_multiplier)
      audit rollup:
          severity_points_total = sum of severity_points
          severity = NONE     if severity_points_total == 0
                     MINOR    if 1  <= severity_points_total <= 9
                     MAJOR    if 10 <= severity_points_total <= 29
                     CRITICAL if severity_points_total >= 30
    input_set: "Past-date lots on shelf in the audited department, evaluated against the logical clock at sweep time"
    constants:
      SEVERITY_TIER_2_HOURS: 48
    precision: "integer points; the CRITICAL boundary is inclusive at 30 points, so 29 points is MAJOR and 30 is CRITICAL"

  - name: department_compliance_posture
    trigger: "Every audit sweep, escalation, finding remediation or waiver, shrink verification or dispute, withdrawal, donation completion and ops-run sweep"
    algorithm: constraint_propagation
    formula: |
      # First matching clause wins; the order is pinned.
      Department.compliance_status =
        BLOCKED   if any ComplianceAudit of the department has disposition_status == ESCALATED
        WATCH     elif any ComplianceAudit of the department has severity in {MAJOR, CRITICAL}
                       and disposition_status != REMEDIATED
        WATCH     elif Department.shrink_cost_ratio_pct > Department.shrink_budget_pct
        COMPLIANT otherwise
    input_set: "All ComplianceAudit rows of the department plus its recomputed shrink_cost_ratio_pct"
    constants: {}
    precision: "exact enum; BLOCKED outranks WATCH, WATCH outranks COMPLIANT"

  - name: shrink_history_order_feedback
    trigger: "POST /fresh/order-recommendations"
    algorithm: forward_looking
    formula: |
      window = [window_start_date 00:00:00.000Z, window_end_date 23:59:59.999Z]
      received_units = sum of L.quantity_original over the item's lots with created_at in window
      if received_units == 0: reject with ERR_INSUFFICIENT_SHRINK_HISTORY
      shrink_units   = per variant (below)
      shrink_rate_pct = round_half_up(shrink_units / received_units * 100, 2)
      open_units      = sum of L.quantity_on_hand over the item's lots with status in {FRESH, MARKED_DOWN}
      recommended_order_units = max(0, round_half_up(Item.daily_forecast_units * ORDER_HORIZON_DAYS
                                                    * (1 - shrink_rate_pct / 100)
                                                    - open_units))
      # the already-rounded 2-decimal shrink_rate_pct is what feeds the dampener, not the raw ratio
    input_set: |
      (a) source entity: the item's DateCodeLot rows created inside the window, and the ShrinkEvent
      rows on those lots with cause_code in {SPOILAGE, DAMAGE, THEFT} — SAMPLING shrink is
      deliberately excluded because sampling is a merchandising cost, not a forecast error.
      (b) window: inclusive calendar dates converted to UTC instants. (c) lots are walked in
      created_at ASC order; both variants are order-insensitive because they only sum.
    constants:
      ORDER_HORIZON_DAYS: 3
    precision: "shrink_rate_pct to 2 decimals round_half_up; recommended_order_units integer, round_half_up then clamped at 0"
    variants:
      - name: CHRONOLOGICAL_ACTUAL
        when: "method omitted (default) or CHRONOLOGICAL_ACTUAL"
        difference: "shrink_units counts only ShrinkEvent rows in status VERIFIED or POSTED — money already recognised. Nothing projected, nothing unverified."
      - name: FORWARD_LOOKING_PROJECTED
        when: "method == FORWARD_LOOKING_PROJECTED"
        difference: |
          shrink_units = (VERIFIED and POSTED events, as above)
                       + (RECORDED events, still awaiting a manager's verification)
                       + for each still-open lot L with status in {FRESH, MARKED_DOWN}:
                             max(0, L.quantity_on_hand
                                    - round_half_up(Item.daily_forecast_units * max(days_remaining(L), 0)))
          The projection therefore reports a higher shrink_rate_pct and a strictly lower
          recommended_order_units than CHRONOLOGICAL_ACTUAL whenever unverified or projected
          shrink exists.

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#     the first violated rule decides the response)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty strings"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the five declared roles and that role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "Request body/query shape: required fields present, JSON types correct, enum members declared, integers within their documented ranges, dates YYYY-MM-DD, instants ISO 8601 UTC, pagination limit in 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints that take input"
  - priority: 4
    category: existence
    check: "Every id in the URL path exists, validated left to right"
    error_id: ERR_STORE_NOT_FOUND | ERR_PARTNER_NOT_FOUND | ERR_LADDER_NOT_FOUND | ERR_DEPARTMENT_NOT_FOUND | ERR_ITEM_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_LABEL_NOT_FOUND | ERR_CHECK_NOT_FOUND | ERR_PICKUP_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_SHRINK_EVENT_NOT_FOUND | ERR_AUDIT_NOT_FOUND | ERR_FINDING_NOT_FOUND | ERR_RECOMMENDATION_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body exists (store_id, partner_id, markdown_ladder_id, department_id, item_id, lot_id)"
    error_id: ERR_STORE_NOT_FOUND | ERR_PARTNER_NOT_FOUND | ERR_LADDER_NOT_FOUND | ERR_DEPARTMENT_NOT_FOUND | ERR_ITEM_NOT_FOUND | ERR_LOT_NOT_FOUND
    http_status: 404
    applies_to: "POST /fresh/departments, POST /fresh/items, POST /fresh/lots, POST /fresh/donation-pickups, POST /fresh/donation-pickups/{pickupId}/assignments, POST /fresh/shrink-events, POST /fresh/compliance-audits, POST /fresh/order-recommendations"
  - priority: 6
    category: auth
    check: "Resource ownership for entity-backed roles: when X-User-Role is DonationPartner, X-User-ID must equal DonationPickup.partner_id"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST /fresh/donation-pickups/{pickupId}/confirm, POST /fresh/donation-pickups/{pickupId}/complete, POST /fresh/donation-pickups/{pickupId}/cancel, GET /fresh/donation-pickups/{pickupId}"
  - priority: 7
    category: state
    check: "Optimistic concurrency: expected_lot_version equals DateCodeLot.version; expected_item_version equals Item.version"
    error_id: ERR_STALE_LOT_VERSION | ERR_STALE_ITEM_VERSION
    http_status: 412
    applies_to: "POST /fresh/lots/{lotId}/markdowns, POST /fresh/order-recommendations"
  - priority: 8
    category: state
    check: "The lot is in a priceable state for this operation: markdown requires status FRESH or MARKED_DOWN with quantity_on_hand > 0; sales require status FRESH or MARKED_DOWN; markdown-void requires MARKED_DOWN; withdraw requires FRESH, MARKED_DOWN or DONATION_PENDING; assignment requires FRESH or MARKED_DOWN"
    error_id: ERR_LOT_NOT_PRICEABLE
    http_status: 409
    applies_to: "POST /fresh/lots/{lotId}/markdowns, POST /fresh/lots/{lotId}/markdown-void, POST /fresh/lots/{lotId}/withdraw, POST /fresh/lots/{lotId}/sales, POST /fresh/donation-pickups/{pickupId}/assignments"
  - priority: 9
    category: state
    check: "Label lifecycle: print requires QUEUED, apply requires PRINTED, void requires a status other than VOIDED"
    error_id: ERR_LABEL_NOT_PRINTED | ERR_LABEL_ALREADY_VOIDED
    http_status: 409
    applies_to: "POST /fresh/markdown-labels/{labelId}/print, POST /fresh/markdown-labels/{labelId}/apply, POST /fresh/markdown-labels/{labelId}/void"
  - priority: 10
    category: state
    check: "Shrink lifecycle: verify requires RECORDED, dispute requires RECORDED or VERIFIED with origin MANUAL, resubmit requires DISPUTED, void requires DISPUTED"
    error_id: ERR_SHRINK_NOT_VERIFIABLE | ERR_SHRINK_NOT_DISPUTED
    http_status: 409
    applies_to: "POST /fresh/shrink-events/{shrinkEventId}/verify, POST /fresh/shrink-events/{shrinkEventId}/dispute, POST /fresh/shrink-events/{shrinkEventId}/resubmit, POST /fresh/shrink-events/{shrinkEventId}/void"
  - priority: 11
    category: state
    check: "Pickup dimensions: confirm requires logistics SCHEDULED; complete requires logistics CONFIRMED and manifest SEALED; seal requires manifest DRAFT and logistics in {SCHEDULED, CONFIRMED}; assignments require manifest DRAFT; reconcile requires manifest SEALED and logistics in {COMPLETED, CANCELLED, MISSED}"
    error_id: ERR_PICKUP_NOT_CONFIRMABLE | ERR_PICKUP_NOT_COMPLETABLE | ERR_MANIFEST_NOT_SEALED | ERR_MANIFEST_SEALED | ERR_PICKUP_NOT_RECONCILABLE
    http_status: 409
    applies_to: "POST /fresh/donation-pickups/{pickupId}/confirm, POST /fresh/donation-pickups/{pickupId}/complete, POST /fresh/donation-pickups/{pickupId}/seal, POST /fresh/donation-pickups/{pickupId}/reconcile, POST /fresh/donation-pickups/{pickupId}/cancel, POST /fresh/donation-pickups/{pickupId}/assignments"
  - priority: 12
    category: state
    check: "Audit, finding, ladder and recommendation lifecycle: sweep requires NOT_STARTED and an open window; remediate/waive require finding OPEN; escalate requires SWEPT with at least one OPEN finding; issue requires DRAFT; activate requires DRAFT; retire requires ACTIVE"
    error_id: ERR_AUDIT_ALREADY_SWEPT | ERR_AUDIT_WINDOW_NOT_OPEN | ERR_FINDING_ALREADY_RESOLVED | ERR_RECOMMENDATION_NOT_ISSUABLE | ERR_LADDER_NOT_DRAFT | ERR_LADDER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /fresh/compliance-audits/{auditId}/sweep, POST /fresh/audit-findings/{findingId}/remediate, POST /fresh/compliance-audits/{auditId}/escalate, POST /fresh/order-recommendations/{recommendationId}/issue, POST /fresh/markdown-ladders/{ladderId}/activate, POST /fresh/markdown-ladders/{ladderId}/retire"
  - priority: 13
    category: business_safety
    check: "The lot's Department.compliance_status is not BLOCKED"
    error_id: ERR_DEPARTMENT_COMPLIANCE_BLOCKED
    http_status: 409
    applies_to: "POST /fresh/lots/{lotId}/markdowns, POST /fresh/lots/{lotId}/markdown-void, POST /fresh/lots/{lotId}/sales, POST /fresh/donation-pickups/{pickupId}/assignments"
  - priority: 14
    category: business_safety
    check: "Donated product is still inside its date code: the logical clock is strictly before DateCodeLot.sell_by_at"
    error_id: ERR_PAST_DATE_NOT_DONATABLE
    http_status: 422
    applies_to: "POST /fresh/donation-pickups/{pickupId}/assignments"
  - priority: 15
    category: business_safety
    check: "Cold chain: MEAT and SEAFOOD lots require FoodBankPartner.cold_chain_certified == true"
    error_id: ERR_COLD_CHAIN_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /fresh/donation-pickups/{pickupId}/assignments"
  - priority: 16
    category: business_safety
    check: "Segregation of duties on shrink: the verifying X-User-ID differs from ShrinkEvent.recorded_by_user_id"
    error_id: ERR_SHRINK_SELF_VERIFICATION
    http_status: 403
    applies_to: "POST /fresh/shrink-events/{shrinkEventId}/verify"
  - priority: 17
    category: business_safety
    check: "Segregation of duties on markdown approval: approval_manager_user_id differs from the requesting X-User-ID"
    error_id: ERR_MARKDOWN_SELF_APPROVAL
    http_status: 403
    applies_to: "POST /fresh/lots/{lotId}/markdowns"
  - priority: 18
    category: business_safety
    check: "cause_code SAMPLING is only accepted when Item.sampling_allowed == true"
    error_id: ERR_SAMPLING_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /fresh/shrink-events"
  - priority: 19
    category: business_safety
    check: "A finding may only be waived when its severity_multiplier == 1, i.e. hours_past_date <= Department.past_date_tolerance_hours"
    error_id: ERR_WAIVER_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /fresh/audit-findings/{findingId}/remediate"
  - priority: 20
    category: business_referential
    check: "The lot's Department.code appears in FoodBankPartner.accepted_department_codes"
    error_id: ERR_PARTNER_DEPARTMENT_NOT_ACCEPTED
    http_status: 422
    applies_to: "POST /fresh/donation-pickups/{pickupId}/assignments"
  - priority: 21
    category: business_referential
    check: "FoodBankPartner.status == ACTIVE"
    error_id: ERR_PARTNER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /fresh/donation-pickups, POST /fresh/donation-pickups/{pickupId}/confirm"
  - priority: 22
    category: business_referential
    check: "FoodBankPartner.service_region_code equals Store.region_code"
    error_id: ERR_PARTNER_REGION_MISMATCH
    http_status: 422
    applies_to: "POST /fresh/donation-pickups"
  - priority: 23
    category: business_referential
    check: "The department's MarkdownLadder.status == ACTIVE at pricing time"
    error_id: ERR_LADDER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /fresh/lots/{lotId}/markdowns"
  - priority: 24
    category: business_referential
    check: "MarkdownLadder.department_code equals the Department.code it is attached to"
    error_id: ERR_LADDER_DEPARTMENT_MISMATCH
    http_status: 422
    applies_to: "POST /fresh/departments, PATCH /fresh/departments/{departmentId}"
  - priority: 25
    category: business_referential
    check: "Item.status == ACTIVE when creating a lot; Store.status == ACTIVE and Store.donation_program_enabled == true when scheduling a pickup"
    error_id: ERR_ITEM_DISCONTINUED | ERR_DONATION_PROGRAM_DISABLED
    http_status: 409
    applies_to: "POST /fresh/lots, POST /fresh/donation-pickups"
  - priority: 26
    category: business_referential
    check: "dock_door_code appears in Store.dock_door_codes"
    error_id: ERR_DOCK_DOOR_UNKNOWN
    http_status: 422
    applies_to: "POST /fresh/donation-pickups"
  - priority: 27
    category: business_temporal
    check: "The logical clock is at or after DateCodeLot.sell_by_at - 48h (the donation window has opened)"
    error_id: ERR_DONATION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /fresh/donation-pickups/{pickupId}/assignments"
  - priority: 28
    category: business_temporal
    check: "No SCHEDULED or CONFIRMED pickup already occupies the requested dock window per calculations.dock_window_conflict (closed intervals, 30-minute buffer)"
    error_id: ERR_DOCK_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /fresh/donation-pickups"
  - priority: 29
    category: business_temporal
    check: "No PENDING or ESCALATED audit on the department overlaps the requested window per calculations.audit_window_conflict (half-open intervals, no buffer)"
    error_id: ERR_AUDIT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /fresh/compliance-audits"
  - priority: 30
    category: business_temporal
    check: "window_end_date >= window_start_date and the window is at most 31 days long"
    error_id: ERR_RECOMMENDATION_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /fresh/order-recommendations, GET /fresh/departments/{departmentId}/margin-report"
  - priority: 31
    category: business_constraint
    check: "A ladder rung is reachable: days_remaining <= rungs[0].days_remaining_max (skipped when override_price_cents is supplied)"
    error_id: ERR_RUNG_NOT_REACHED
    http_status: 422
    applies_to: "POST /fresh/lots/{lotId}/markdowns, GET /fresh/lots/{lotId}/markdown-quote"
  - priority: 32
    category: business_constraint
    check: "A re-ladder strictly deepens: effective_rung_index > DateCodeLot.current_rung_index, or an override price strictly below current_price_cents"
    error_id: ERR_RUNG_NOT_DEEPER
    http_status: 409
    applies_to: "POST /fresh/lots/{lotId}/markdowns"
  - priority: 33
    category: business_constraint
    check: "Approval-gated pricing: rungs[effective_rung_index].requires_manager_approval == true or an override_price_cents requires X-User-Role DepartmentManager and a non-null approval_manager_user_id"
    error_id: ERR_MANAGER_APPROVAL_REQUIRED
    http_status: 422
    applies_to: "POST /fresh/lots/{lotId}/markdowns"
  - priority: 34
    category: business_constraint
    check: "Requested units do not exceed DateCodeLot.quantity_on_hand (sales, shrink record, shrink resubmit, shrink verify, donation assignment)"
    error_id: ERR_INSUFFICIENT_UNITS
    http_status: 422
    applies_to: "POST /fresh/lots/{lotId}/sales, POST /fresh/shrink-events, POST /fresh/shrink-events/{shrinkEventId}/resubmit, POST /fresh/shrink-events/{shrinkEventId}/verify, POST /fresh/donation-pickups/{pickupId}/assignments"
  - priority: 35
    category: business_constraint
    check: "A manifest may only be sealed with assignment_count >= 1"
    error_id: ERR_EMPTY_MANIFEST
    http_status: 422
    applies_to: "POST /fresh/donation-pickups/{pickupId}/seal"
  - priority: 36
    category: business_constraint
    check: "A lot appears at most once per pickup manifest in status ASSIGNED or PICKED_UP"
    error_id: ERR_DUPLICATE_LOT_ASSIGNMENT
    http_status: 409
    applies_to: "POST /fresh/donation-pickups/{pickupId}/assignments"
  - priority: 37
    category: business_constraint
    check: "remediation=WITHDRAWN requires the finding's lot to still hold units (quantity_on_hand > 0)"
    error_id: ERR_REMEDIATION_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /fresh/audit-findings/{findingId}/remediate"
  - priority: 38
    category: business_constraint
    check: "Escalation requires ComplianceAudit.severity == CRITICAL"
    error_id: ERR_ESCALATION_NOT_WARRANTED
    http_status: 422
    applies_to: "POST /fresh/compliance-audits/{auditId}/escalate"
  - priority: 39
    category: business_constraint
    check: "received_units > 0 inside the recommendation window"
    error_id: ERR_INSUFFICIENT_SHRINK_HISTORY
    http_status: 422
    applies_to: "POST /fresh/order-recommendations"
  - priority: 40
    category: business_constraint
    check: "Uniqueness: Store.store_number globally, MarkdownLadder.name globally, (store_id, code) on Department, (department_id, upc) on Item"
    error_id: ERR_STORE_NUMBER_DUPLICATE | ERR_LADDER_NAME_DUPLICATE | ERR_DEPARTMENT_CODE_DUPLICATE | ERR_ITEM_UPC_DUPLICATE
    http_status: 409
    applies_to: "POST /fresh/stores, POST /fresh/markdown-ladders, POST /fresh/departments, POST /fresh/items"
  - priority: 41
    category: business_fiscal
    check: "The resulting DateCodeLot.total_discount_pct does not exceed MarkdownLadder.max_total_discount_pct"
    error_id: ERR_MAX_DISCOUNT_EXCEEDED
    http_status: 422
    applies_to: "POST /fresh/lots/{lotId}/markdowns"
  - priority: 42
    category: business_fiscal
    check: "An explicit override_price_cents is at or above the cost floor round_half_up(Item.unit_cost_cents * 40 / 100)"
    error_id: ERR_PRICE_BELOW_COST_FLOOR
    http_status: 422
    applies_to: "POST /fresh/lots/{lotId}/markdowns"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- single-resource reads (also fix each entity's collection segment) ----
  - method: GET
    path: "/fresh/stores/{storeId}"
    description: "Read one store"
    roles: [StoreOperationsAdmin, DepartmentManager, FreshClerk, ComplianceAuditor]
    code: 200
    input: []
    output: Store
    side_effects: []
  - method: GET
    path: "/fresh/food-bank-partners/{partnerId}"
    description: "Read one food-bank partner including its rolled-up pickup counters"
    roles: [StoreOperationsAdmin, DepartmentManager, ComplianceAuditor, DonationPartner]
    code: 200
    input: []
    output: FoodBankPartner
    side_effects: []
  - method: GET
    path: "/fresh/markdown-ladders/{ladderId}"
    description: "Read one markdown ladder with its ordered rungs"
    roles: [StoreOperationsAdmin, DepartmentManager, FreshClerk, ComplianceAuditor]
    code: 200
    input: []
    output: MarkdownLadder
    side_effects: []
  - method: GET
    path: "/fresh/departments/{departmentId}"
    description: "Read one fresh department including compliance_status, markdown_liability_cents and shrink_cost_ratio_pct"
    roles: [StoreOperationsAdmin, DepartmentManager, FreshClerk, ComplianceAuditor]
    code: 200
    input: []
    output: Department
    side_effects: []
  - method: GET
    path: "/fresh/items/{itemId}"
    description: "Read one item"
    roles: [StoreOperationsAdmin, DepartmentManager, FreshClerk, ComplianceAuditor]
    code: 200
    input: []
    output: Item
    side_effects: []
  - method: GET
    path: "/fresh/lots/{lotId}"
    description: "Read one date-code lot including sell_by_at, unit counters, current price and version"
    roles: [StoreOperationsAdmin, DepartmentManager, FreshClerk, ComplianceAuditor]
    code: 200
    input: []
    output: DateCodeLot
    side_effects: []
  - method: GET
    path: "/fresh/markdown-labels/{labelId}"
    description: "Read one markdown label"
    roles: [StoreOperationsAdmin, DepartmentManager, FreshClerk, ComplianceAuditor]
    code: 200
    input: []
    output: MarkdownLabel
    side_effects: []
  - method: GET
    path: "/fresh/scan-price-checks/{checkId}"
    description: "Read one scan-price check; the entity is immutable and has no update endpoint"
    roles: [StoreOperationsAdmin, DepartmentManager, FreshClerk, ComplianceAuditor]
    code: 200
    input: []
    output: ScanPriceCheck
    side_effects: []
  - method: GET
    path: "/fresh/donation-pickups/{pickupId}"
    description: "Read one donation pickup; a DonationPartner may only read pickups whose partner_id equals its own X-User-ID"
    roles: [StoreOperationsAdmin, DepartmentManager, FreshClerk, ComplianceAuditor, DonationPartner]
    code: 200
    input: []
    output: DonationPickup
    side_effects: []
  - method: GET
    path: "/fresh/donation-assignments/{assignmentId}"
    description: "Read one donation manifest line"
    roles: [StoreOperationsAdmin, DepartmentManager, FreshClerk, ComplianceAuditor, DonationPartner]
    code: 200
    input: []
    output: DonationLotAssignment
    side_effects: []
  - method: GET
    path: "/fresh/shrink-events/{shrinkEventId}"
    description: "Read one shrink event"
    roles: [StoreOperationsAdmin, DepartmentManager, FreshClerk, ComplianceAuditor]
    code: 200
    input: []
    output: ShrinkEvent
    side_effects: []
  - method: GET
    path: "/fresh/compliance-audits/{auditId}"
    description: "Read one compliance audit with both status dimensions and its severity rollup"
    roles: [StoreOperationsAdmin, DepartmentManager, ComplianceAuditor]
    code: 200
    input: []
