scaffold_corner_design:
  # =========================================================================
  - section: entities
    instances:
      - name: create_site_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Site, endpoints]
        distinguishing_aspect: "POST /workplace/sites with {name} returns 201, data.id is a prefix-free UUID, status defaults to ACTIVE, version==1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /workplace/sites"
              payload: { name: "HQ", timezone: "America/New_York" }
              as: FacilityManager
              captures: { sid: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "response status == 201"
            - "data.status == ACTIVE"
            - "data.version == 1"
            - "data.timezone == America/New_York"

      - name: get_site_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.Site", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /workplace/sites/{random-uuid} for a non-existent id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /workplace/sites/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FacilityManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_reservation_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Reservation", "errors[ERR_INVALID_REQUEST]", "validations[priority=4]"]
        distinguishing_aspect: "POST /workplace/reservations omitting booking_date returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["floor, neighborhood, seat, employee, capacity policy exist; clock set"]
          setup_api_calls:
            - call: "POST /workplace/sites"
              payload: { name: "HQc1" }
              as: FacilityManager
              captures: { site_id: $.data.id }
            - call: "POST /workplace/sites/${site_id}/floors"
              payload: { level: 1 }
              as: FacilityManager
              captures: { floor_id: $.data.id }
            - call: "POST /workplace/floors/${floor_id}/capacity-policy"
              payload: { enforce_team_zoning: false }
              as: FacilityManager
            - call: "POST /workplace/floors/${floor_id}/neighborhoods"
              payload: { name: "N1" }
              as: FacilityManager
              captures: { nb_id: $.data.id }
            - call: "POST /workplace/neighborhoods/${nb_id}/seats"
              payload: { label: "S1" }
              as: FacilityManager
              captures: { seat_id: $.data.id, seat_v: $.data.version }
            - call: "POST /workplace/employees"
              payload: { email: "c1@x.com", full_name: "C1", team_code: "ENG" }
              as: FacilityManager
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /workplace/reservations"
              payload: { employee_id: "${emp_id}", resource_type: "SEAT", seat_id: "${seat_id}", start_minute: 600, end_minute: 660, expected_seat_version: "${seat_v}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: floor_default_workday_window_applied
        claim_type: Defaults
        grounds: [entities.Floor.fields.workday_start_minute, entities.Floor.fields.workday_end_minute]
        distinguishing_aspect: "Creating a floor without workday minutes applies defaults 540/1080 and computes capacity_minutes=540."
        test_recipe:
          setup: ["a site exists"]
          setup_api_calls:
            - call: "POST /workplace/sites"
              payload: { name: "HQc2" }
              as: FacilityManager
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /workplace/sites/${site_id}/floors"
              payload: { level: 2 }
              as: FacilityManager
              captures: { ws: $.data.workday_start_minute, we: $.data.workday_end_minute, cap: $.data.capacity_minutes }
          assert:
            - "data.workday_start_minute == 540"
            - "data.workday_end_minute == 1080"
            - "data.capacity_minutes == 540"

      - name: neighborhood_effective_cap_seats_computed_from_seat_count
        claim_type: Computed Fields
        grounds: [entities.Neighborhood.fields.seat_count, entities.Neighborhood.fields.effective_cap_seats]
        distinguishing_aspect: "Adding 3 seats to a cap_pct=60 neighborhood yields seat_count==3 and effective_cap_seats==ceil(3*60/100)==2."
        test_recipe:
          setup: ["a floor with a neighborhood (cap_pct=60) exists"]
          setup_api_calls:
            - call: "POST /workplace/sites"
              payload: { name: "HQc3" }
              as: FacilityManager
              captures: { site_id: $.data.id }
            - call: "POST /workplace/sites/${site_id}/floors"
              payload: { level: 3 }
              as: FacilityManager
              captures: { floor_id: $.data.id }
            - call: "POST /workplace/floors/${floor_id}/neighborhoods"
              payload: { name: "N60", capacity_cap_pct: 60 }
              as: FacilityManager
              captures: { nb_id: $.data.id }
            - call: "POST /workplace/neighborhoods/${nb_id}/seats"
              payload: { label: "A" }
              as: FacilityManager
            - call: "POST /workplace/neighborhoods/${nb_id}/seats"
              payload: { label: "B" }
              as: FacilityManager
          trigger:
            - call: "POST /workplace/neighborhoods/${nb_id}/seats"
              payload: { label: "C" }
              as: FacilityManager
            - call: "GET /workplace/neighborhoods/${nb_id}"
              payload: {}
              as: FacilityManager
              captures: { sc: $.data.seat_count, cap: $.data.effective_cap_seats }
          assert:
            - "data.seat_count == 3"
            - "data.effective_cap_seats == 2"

      - name: reservation_system_fields_ignored_on_input
        claim_type: System Fields
        grounds: [entities.Reservation.fields.occupancy_status, entities.Reservation.fields.billing_status]
        distinguishing_aspect: "occupancy_status and billing_status are system-managed: a new reservation always starts BOOKED/NONE regardless of input."
        test_recipe:
          setup: ["floor, neighborhood, seat, employee, policy; clock set"]
          setup_api_calls:
            - call: "POST /workplace/sites"
              payload: { name: "HQc4" }
              as: FacilityManager
              captures: { site_id: $.data.id }
            - call: "POST /workplace/sites/${site_id}/floors"
              payload: { level: 4 }
              as: FacilityManager
              captures: { floor_id: $.data.id }
            - call: "POST /workplace/floors/${floor_id}/capacity-policy"
              payload: { enforce_team_zoning: false }
              as: FacilityManager
            - call: "POST /workplace/floors/${floor_id}/neighborhoods"
              payload: { name: "N1" }
              as: FacilityManager
              captures: { nb_id: $.data.id }
            - call: "POST /workplace/neighborhoods/${nb_id}/seats"
              payload: { label: "S1" }
              as: FacilityManager
              captures: { seat_id: $.data.id, seat_v: $.data.version }
            - call: "POST /workplace/employees"
              payload: { email: "c4@x.com", full_name: "C4", team_code: "ENG" }
              as: FacilityManager
              captures: { emp_id: $.data.id }
            - call: "POST /workplace/_clock/set"
              payload: { current_date: "2026-08-01", current_minute: 500 }
              as: FacilityManager
          trigger:
            - call: "POST /workplace/reservations"
              payload: { employee_id: "${emp_id}", resource_type: "SEAT", seat_id: "${seat_id}", booking_date: "2026-08-01", start_minute: 600, end_minute: 660, expected_seat_version: "${seat_v}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { occ: $.data.occupancy_status, bill: $.data.billing_status }
          assert:
            - "data.occupancy_status == BOOKED"
            - "data.billing_status == NONE"

      - name: duplicate_employee_email_returns_duplicate
        claim_type: Type Constraints
        grounds: ["entities.Employee.fields.email", "errors[ERR_DUPLICATE]", "validations[priority=16]"]
        distinguishing_aspect: "Creating a second Employee with an email already in use returns ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["one employee with email dup@x.com exists"]
          setup_api_calls:
            - call: "POST /workplace/employees"
              payload: { email: "dup@x.com", full_name: "First", team_code: "ENG" }
              as: FacilityManager
          trigger:
            - call: "POST /workplace/employees"
              payload: { email: "dup@x.com", full_name: "Second", team_code: "SALES" }
              as: FacilityManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_DUPLICATE"

      - name: checkin_immutable_entity_has_no_version
        claim_type: Immutability
        grounds: [entities.CheckIn, endpoints]
        distinguishing_aspect: "CheckIn (common_fields:false) is append-only: created by check-in, reachable only via GET reservation check-ins, carries no version field."
        test_recipe:
          setup: ["a CHECKED_IN reservation exists on 2026-08-02"]
          setup_api_calls:
            - call: "POST /workplace/sites"
              payload: { name: "HQc5" }
              as: FacilityManager
              captures: { site_id: $.data.id }
            - call: "POST /workplace/sites/${site_id}/floors"
              payload: { level: 5 }
              as: FacilityManager
              captures: { floor_id: $.data.id }
            - call: "POST /workplace/floors/${floor_id}/capacity-policy"
              payload: { enforce_team_zoning: false }
              as: FacilityManager
            - call: "POST /workplace/floors/${floor_id}/neighborhoods"
              payload: { name: "N1" }
              as: FacilityManager
              captures: { nb_id: $.data.id }
            - call: "POST /workplace/neighborhoods/${nb_id}/seats"
              payload: { label: "S1" }
              as: FacilityManager
              captures: { seat_id: $.data.id, seat_v: $.data.version }
            - call: "POST /workplace/employees"
              payload: { email: "c5@x.com", full_name: "C5", team_code: "ENG" }
              as: FacilityManager
              captures: { emp_id: $.data.id }
            - call: "POST /workplace/_clock/set"
              payload: { current_date: "2026-08-02", current_minute: 545 }
              as: FacilityManager
            - call: "POST /workplace/reservations"
              payload: { employee_id: "${emp_id}", resource_type: "SEAT", seat_id: "${seat_id}", booking_date: "2026-08-02", start_minute: 540, end_minute: 600, expected_seat_version: "${seat_v}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { resv_id: $.data.id }
            - call: "POST /workplace/reservations/${resv_id}/check-in"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
          trigger:
            - call: "GET /workplace/reservations/${resv_id}/check-ins"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
              captures: { first_minute: $.data.0.checked_in_at_minute }
          assert:
            - "response status == 200"
            - "exactly one CheckIn returned with within_grace == true"
            - "data[0].checked_in_at_minute == 545"

  # =========================================================================
  - section: state_machines
    instances:
      - name: checkin_from_already_checked_in_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Reservation.BOOKED_to_CHECKED_IN", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second check-in on an already CHECKED_IN reservation returns ERR_INVALID_STATE (409); no extra CheckIn or NoShowEvent created."
        test_recipe:
          setup: ["a CHECKED_IN reservation exists on 2026-08-03"]
          setup_api_calls:
            - call: "POST /workplace/sites"
              payload: { name: "HQc6" }
              as: FacilityManager
              captures: { site_id: $.data.id }
            - call: "POST /workplace/sites/${site_id}/floors"
              payload: { level: 6 }
              as: FacilityManager
              captures: { floor_id: $.data.id }
            - call: "POST /workplace/floors/${floor_id}/capacity-policy"
              payload: { enforce_team_zoning: false }
              as: FacilityManager
            - call: "POST /workplace/floors/${floor_id}/neighborhoods"
              payload: { name: "N1" }
              as: FacilityManager
              captures: { nb_id: $.data.id }
            - call: "POST /workplace/neighborhoods/${nb_id}/seats"
              payload: { label: "S1" }
              as: FacilityManager
              captures: { seat_id: $.data.id, seat_v: $.data.version }
            - call: "POST /workplace/employees"
              payload: { email: "c6@x.com", full_name: "C6", team_code: "ENG" }
              as: FacilityManager
              captures: { emp_id: $.data.id }
            - call: "POST /workplace/_clock/set"
              payload: { current_date: "2026-08-03", current_minute: 545 }
              as: FacilityManager
            - call: "POST /workplace/reservations"
              payload: { employee_id: "${emp_id}", resource_type: "SEAT", seat_id: "${seat_id}", booking_date: "2026-08-03", start_minute: 540, end_minute: 600, expected_seat_version: "${seat_v}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { resv_id: $.data.id }
            - call: "POST /workplace/reservations/${resv_id}/check-in"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /workplace/reservations/${resv_id}/check-in"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: checkin_after_grace_expired_rejected
        claim_type: precondition
        grounds: [state_machines.Reservation.BOOKED_to_CHECKED_IN, entities.Reservation.fields.checkin_deadline_minute]
        distinguishing_aspect: "Checking in after the clock passes checkin_deadline_minute (start 540 + grace 30 = 570; clock 580) is rejected with ERR_INVALID_STATE (grace expired)."
        test_recipe:
          setup: ["BOOKED reservation 540..600 on 2026-08-04, grace 30; clock advanced to 580 (past deadline 570)"]
          setup_api_calls:
            - call: "POST /workplace/sites"
              payload: { name: "HQc7" }
              as: FacilityManager
              captures: { site_id: $.data.id }
            - call: "POST /workplace/sites/${site_id}/floors"
              payload: { level: 7 }
              as: FacilityManager
              captures: { floor_id: $.data.id }
            - call: "POST /workplace/floors/${floor_id}/capacity-policy"
              payload: { grace_minutes: 30, enforce_team_zoning: false }
              as: FacilityManager
            - call: "POST /workplace/floors/${floor_id}/neighborhoods"
              payload: { name: "N1" }
              as: FacilityManager
              captures: { nb_id: $.data.id }
            - call: "POST /workplace/neighborhoods/${nb_id}/seats"
              payload: { label: "S1" }
              as: FacilityManager
              captures: { seat_id: $.data.id, seat_v: $.data.version }
            - call: "POST /workplace/employees"
              payload: { email: "c7@x.com", full_name: "C7", team_code: "ENG" }
              as: FacilityManager
              captures: { emp_id: $.data.id }
            - call: "POST /workplace/_clock/set"
              payload: { current_date: "2026-08-04", current_minute: 545 }
              as: FacilityManager
            - call: "POST /workplace/reservations"
              payload: { employee_id: "${emp_id}", resource_type: "SEAT", seat_id: "${seat_id}", booking_date: "2026-08-04", start_minute: 540, end_minute: 600, expected_seat_version: "${seat_v}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { resv_id: $.data.id }
            - call: "POST /workplace/_clock/set"
              payload: { current_date: "2026-08-04", current_minute: 580 }
              as: FacilityManager
          trigger:
            - call: "POST /workplace/reservations/${resv_id}/check-in"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: reservation_initial_state_is_booked
        claim_type: initial_state
        grounds: [state_machines.Reservation, entities.Reservation.fields.occupancy_status]
        excluded_because:
          difficulty_instance: non_linear_state_machine / reservation_parallel_occupancy_and_billing_dimensions
          rationale: "The parallel-dimension instance already asserts a freshly-created reservation begins BOOKED/NONE before any transition."

      - name: terminal_cancelled_reservation_rejects_checkin
        claim_type: terminal_lockdown
        grounds: ["state_machines.Reservation.BOOKED_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "After cancel (terminal CANCELLED), a check-in attempt returns ERR_INVALID_STATE; no transition out of a terminal state."
        test_recipe:
          setup: ["a CANCELLED reservation exists on 2026-08-05"]
          setup_api_calls:
            - call: "POST /workplace/sites"
              payload: { name: "HQc8" }
              as: FacilityManager
              captures: { site_id: $.data.id }
            - call: "POST /workplace/sites/${site_id}/floors"
              payload: { level: 8 }
              as: FacilityManager
              captures: { floor_id: $.data.id }
            - call: "POST /workplace/floors/${floor_id}/capacity-policy"
              payload: { enforce_team_zoning: false }
              as: FacilityManager
            - call: "POST /workplace/floors/${floor_id}/neighborhoods"
              payload: { name: "N1" }
              as: FacilityManager
              captures: { nb_id: $.data.id }
            - call: "POST /workplace/neighborhoods/${nb_id}/seats"
              payload: { label: "S1" }
              as: FacilityManager
              captures: { seat_id: $.data.id, seat_v: $.data.version }
            - call: "POST /workplace/employees"
              payload: { email: "c8@x.com", full_name: "C8", team_code: "ENG" }
              as: FacilityManager
              captures: { emp_id: $.data.id }
            - call: "POST /workplace/_clock/set"
              payload: { current_date: "2026-08-05", current_minute: 500 }
              as: FacilityManager
            - call: "POST /workplace/reservations"
              payload: { employee_id: "${emp_id}", resource_type: "SEAT", seat_id: "${seat_id}", booking_date: "2026-08-05", start_minute: 600, end_minute: 660, expected_seat_version: "${seat_v}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { resv_id: $.data.id }
            - call: "POST /workplace/reservations/${resv_id}/cancel"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /workplace/reservations/${resv_id}/check-in"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: visitor_pass_complete_frees_seat_window
        claim_type: side_effect
        grounds: [state_machines.VisitorPass.CHECKED_IN_to_COMPLETED, state_machines.VisitorPass.APPROVED_to_CHECKED_IN]
        distinguishing_aspect: "Completing a visitor pass frees the seat window so a later reservation on the same seat/date/window succeeds (201)."
        test_recipe:
          setup: ["APPROVED then CHECKED_IN visitor pass on seat for 2026-08-06 600..720; an employee available to book"]
          setup_api_calls:
            - call: "POST /workplace/sites"
              payload: { name: "HQc9" }
              as: FacilityManager
              captures: { site_id: $.data.id }
            - call: "POST /workplace/sites/${site_id}/floors"
              payload: { level: 9 }
              as: FacilityManager
              captures: { floor_id: $.data.id }
            - call: "POST /workplace/floors/${floor_id}/capacity-policy"
              payload: { enforce_team_zoning: false }
              as: FacilityManager
            - call: "POST /workplace/floors/${floor_id}/neighborhoods"
              payload: { name: "N1" }
              as: FacilityManager
              captures: { nb_id: $.data.id }
            - call: "POST /workplace/neighborhoods/${nb_id}/seats"
              payload: { label: "V1" }
              as: FacilityManager
              captures: { seat_id: $.data.id }
            - call: "POST /workplace/employees"
              payload: { email: "host9@x.com", full_name: "Host9", team_code: "ENG" }
              as: FacilityManager
              captures: { host_id: $.data.id }
            - call: "POST /workplace/_clock/set"
              payload: { current_date: "2026-08-06", current_minute: 500 }
              as: FacilityManager
            - call: "POST /workplace/visitor-passes"
              payload: { host_employee_id: "${host_id}", seat_id: "${seat_id}", visitor_name: "G", booking_date: "2026-08-06", start_minute: 600, end_minute: 720 }
              as: Receptionist
              captures: { vp_id: $.data.id }
            - call: "POST /workplace/visitor-passes/${vp_id}/approve"
              payload: {}
              as: Employee
              as_user_id: "${host_id}"
            - call: "POST /workplace/visitor-passes/${vp_id}/check-in"
              payload: {}
              as: Receptionist
            - call: "POST /workplace/visitor-passes/${vp_id}/complete"
              payload: {}
              as: Receptionist
            - call: "GET /workplace/seats/${seat_id}"
              payload: {}
              as: FacilityManager
              captures: { seat_v: $.data.version }
          trigger:
            - call: "POST /workplace/reservations"
              payload: { employee_id: "${host_id}", resource_type: "SEAT", seat_id: "${seat_id}", booking_date: "2026-08-06", start_minute: 600, end_minute: 720, expected_seat_version: "${seat_v}" }
              as: Employee
              as_user_id: "${host_id}"
              captures: { occ: $.data.occupancy_status }
          assert:
            - "response status == 201"
            - "data.occupancy_status == BOOKED"

      - name: seat_retire_blocked_when_active_reservation_exists
        claim_type: precondition
        grounds: ["state_machines.Seat.AVAILABLE_to_RETIRED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Retiring a seat with a live BOOKED reservation is rejected with ERR_INVALID_STATE (precondition: no BOOKED/CHECKED_IN reservations)."
        test_recipe:
          setup: ["seat with a live BOOKED reservation on 2026-08-07"]
          setup_api_calls:
            - call: "POST /workplace/sites"
              payload: { name: "HQc10" }
              as: FacilityManager
              captures: { site_id: $.data.id }
            - call: "POST /workplace/sites/${site_id}/floors"
              payload: { level: 10 }
              as: FacilityManager
              captures: { floor_id: $.data.id }
            - call: "POST /workplace/floors/${floor_id}/capacity-policy"
              payload: { enforce_team_zoning: false }
              as: FacilityManager
            - call: "POST /workplace/floors/${floor_id}/neighborhoods"
              payload: { name: "N1" }
              as: FacilityManager
              captures: { nb_id: $.data.id }
            - call: "POST /workplace/neighborhoods/${nb_id}/seats"
              payload: { label: "S1" }
              as: FacilityManager
              captures: { seat_id: $.data.id, seat_v: $.data.version }
            - call: "POST /workplace/employees"
              payload: { email: "c10@x.com", full_name: "C10", team_code: "ENG" }
              as: FacilityManager
              captures: { emp_id: $.data.id }
            - call: "POST /workplace/_clock/set"
              payload: { current_date: "2026-08-07", current_minute: 500 }
              as: FacilityManager
            - call: "POST /workplace/reservations"
              payload: { employee_id: "${emp_id}", resource_type: "SEAT", seat_id: "${seat_id}", booking_date: "2026-08-07", start_minute: 600, end_minute: 660, expected_seat_version: "${seat_v}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { resv_id: $.data.id }
          trigger:
            - call: "POST /workplace/seats/${seat_id}/retire"
              payload: {}
              as: FacilityManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

