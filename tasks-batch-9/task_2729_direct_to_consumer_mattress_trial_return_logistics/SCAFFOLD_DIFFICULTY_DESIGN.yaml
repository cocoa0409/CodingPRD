              payload: { return_case_id: "${rc_id}", expected_return_case_version: "${rc_v}" }
              as: FinanceController
              as_user_id: "fin-authorizer-4"
              captures: { refund_id: $.data.id }
            - call: "GET /trial-orders/${order_id}"
              payload: {}
              as: FinanceController
          trigger:
            - call: "POST /refund-authorizations/${refund_id}/release"
              payload: {}
              as: FinanceController
              as_user_id: "fin-releaser-4"
            - call: "GET /trial-orders/${order_id}"
              payload: {}
              as: FinanceController
            - call: "POST /refund-authorizations/${refund_id}/void"
              payload: { void_reason: "customer disputed the proration and the release was reversed" }
              as: FinanceController
              as_user_id: "fin-releaser-4"
            - call: "GET /trial-orders/${order_id}"
              payload: {}
              as: FinanceController
          assert:
            - "before trigger call 1: TrialOrder.${order_id}.refunded_total_cents == 0, outstanding_refundable_cents == 120000, retained_amount_cents == 0 (sum 120000 == paid_amount_cents)"
            - "trigger call 1 -> 200 (fin-releaser-4 differs from fin-authorizer-4, so validations[priority=16] passes)"
            - "after trigger call 1: RefundAuthorization.${refund_id}.status == RELEASED and released_at == 2026-09-15T00:00:00Z"
            - "after trigger call 1: TrialOrder.${order_id}.refunded_total_cents == 114000, outstanding_refundable_cents == 0, retained_amount_cents == 6000 (sum 120000 == paid_amount_cents)"
            - "after trigger call 1: ReturnCase.${rc_id}.financial_status == RELEASED"
            - "after trigger call 3: RefundAuthorization.${refund_id}.status == VOIDED, net_refund_cents still 114000, voided_at == 2026-09-15T00:00:00Z (the row is compensated, never deleted)"
            - "after trigger call 3: TrialOrder.${order_id}.refunded_total_cents == 0, outstanding_refundable_cents == 120000, retained_amount_cents == 0 (sum 120000 == paid_amount_cents, exactly the pre-release triple)"
            - "after trigger call 3: ReturnCase.${rc_id}.financial_status == VOID, while logistics_status is still DISPOSITIONED and final_refund_cents is still 114000"
            - "GET /refund-authorizations?return_case_id=${rc_id} still returns exactly 1 row"

      - name: appointment_cancel_and_missed_conserve_route_capacity_units
        grounds:
          - state_machines.PickupAppointment.status.BOOKED_to_CANCELLED
          - state_machines.PickupAppointment.status.BOOKED_to_MISSED
          - calculations.pickup_units
          - entities.PickupRoute.fields.booked_units
          - entities.PickupRoute.fields.available_units
          - state_machines.ReturnCase.logistics_status.PICKUP_SCHEDULED_to_REQUESTED
        distinguishing_aspect: |
          Discrete-capacity conservation rather than money, and it is exercised through two
          different compensating triggers on the same route: an explicit cancel and an
          outcome == MISSED closure both return their units, so
          capacity_units == booked_units + available_units holds at all five observable instants
          (6 = 0+6, 2+4, 3+3, 1+5, 0+6) while a COMPLETED slot deliberately does NOT return units.
          Both ReturnCases revert to REQUESTED and the freed units are provably re-bookable.
        test_recipe:
          setup:
            - "A QUEEN MattressModel at 120000 cents (2 units) and a TWIN MattressModel at 70000 cents (1 unit), both break_in_nights 21 / trial_nights 100."
            - "Two customers in different households: one QUEEN DTC order and one TWIN DTC order, both delivered 2026-08-01."
            - "Two ReturnCases opened 2026-09-10."
            - "One PUBLISHED PickupRoute in CA on 2026-09-15, window 08:00-18:00, capacity_units 6, default buffer 30, no appointments yet."
          setup_api_calls:
            - call: "POST /mattress-models"
              payload: { sku: "MDL-Q-C2", name: "Comfort Q", firmness: "MEDIUM", size: "QUEEN", list_price_cents: 120000, break_in_nights: 21, trial_nights: 100 }
              as: PlatformAdmin
              captures: { model_q_id: $.data.id }
            - call: "POST /mattress-models"
              payload: { sku: "MDL-T-C2", name: "Comfort T", firmness: "MEDIUM", size: "TWIN", list_price_cents: 70000, break_in_nights: 21, trial_nights: 100 }
              as: PlatformAdmin
              captures: { model_t_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "ci2a@example.com", full_name: "Cap Conserve", household_hash: "HH-CI2A" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /customers"
              payload: { email: "ci2b@example.com", full_name: "Tina Conserve", household_hash: "HH-CI2B" }
              as: PlatformAdmin
              captures: { c2: $.data.id }
            - call: "POST /trial-orders"
              payload: { customer_id: "${c1}", model_id: "${model_q_id}", channel: "DTC", gross_price_cents: 120000 }
              as: TrialSupportAgent
              captures: { o1: $.data.id }
            - call: "POST /trial-orders"
              payload: { customer_id: "${c2}", model_id: "${model_t_id}", channel: "DTC", gross_price_cents: 70000 }
              as: TrialSupportAgent
              captures: { o2: $.data.id }
            - call: "POST /trial-orders/${o1}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /trial-orders/${o1}/deliver"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /trial-orders/${o2}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /trial-orders/${o2}/deliver"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /return-cases"
              payload: { order_id: "${o1}", reason_code: "COMFORT" }
              as: Customer
              as_user_id: "${c1}"
              captures: { rc1: $.data.id }
            - call: "POST /return-cases"
              payload: { order_id: "${o2}", reason_code: "COMFORT" }
              as: Customer
              as_user_id: "${c2}"
              captures: { rc2: $.data.id }
            - call: "POST /pickup-routes"
              payload: { region_code: "CA", route_date: "2026-09-15", window_start_at: "2026-09-15T08:00:00Z", window_end_at: "2026-09-15T18:00:00Z", capacity_units: 6 }
              as: LogisticsCoordinator
              captures: { route_id: $.data.id }
            - call: "POST /pickup-routes/${route_id}/publish"
              payload: {}
              as: LogisticsCoordinator
              captures: { route_v1: $.data.version }
          trigger:
            - call: "POST /pickup-appointments"
              payload: { route_id: "${route_id}", return_case_id: "${rc1}", slot_start_at: "2026-09-15T09:00:00Z", slot_end_at: "2026-09-15T10:00:00Z", expected_pickup_route_version: "${route_v1}" }
              as: LogisticsCoordinator
              captures: { appt1: $.data.id }
            - call: "GET /pickup-routes/${route_id}"
              payload: {}
              as: LogisticsCoordinator
              captures: { route_v2: $.data.version }
            - call: "POST /pickup-appointments"
              payload: { route_id: "${route_id}", return_case_id: "${rc2}", slot_start_at: "2026-09-15T11:00:00Z", slot_end_at: "2026-09-15T12:00:00Z", expected_pickup_route_version: "${route_v2}" }
              as: LogisticsCoordinator
              captures: { appt2: $.data.id }
            - call: "POST /pickup-appointments/${appt1}/cancel"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:30:00Z" }
              as: PlatformAdmin
            - call: "POST /pickup-appointments/${appt2}/complete"
              payload: { outcome: "MISSED" }
              as: LogisticsCoordinator
            - call: "GET /pickup-routes/${route_id}"
              payload: {}
              as: LogisticsCoordinator
              captures: { route_v3: $.data.version }
            - call: "POST /pickup-appointments"
              payload: { route_id: "${route_id}", return_case_id: "${rc1}", slot_start_at: "2026-09-15T09:00:00Z", slot_end_at: "2026-09-15T10:00:00Z", expected_pickup_route_version: "${route_v3}" }
              as: LogisticsCoordinator
              captures: { appt3: $.data.id }
          assert:
            - "after trigger call 1: PickupAppointment.${appt1}.units == 2, PickupRoute.${route_id}.booked_units == 2 and available_units == 4 (sum 6 == capacity_units)"
            - "after trigger call 3: PickupAppointment.${appt2}.units == 1, PickupRoute.${route_id}.booked_units == 3 and available_units == 3 (sum 6 == capacity_units)"
            - "after trigger call 4: PickupAppointment.${appt1}.status == CANCELLED, PickupRoute.${route_id}.booked_units == 1 and available_units == 5 (sum 6 == capacity_units)"
            - "after trigger call 4: ReturnCase.${rc1}.logistics_status == REQUESTED and picked_up_at == null"
            - "after trigger call 6: PickupAppointment.${appt2}.status == MISSED and closed_at == 2026-09-15T12:30:00Z"
            - "after trigger call 6: PickupRoute.${route_id}.booked_units == 0 and available_units == 6 (sum 6 == capacity_units, both compensations conserved units)"
            - "after trigger call 6: ReturnCase.${rc2}.logistics_status == REQUESTED, nights_used == null, and TrialOrder.${o2}.trial_status == RETURN_REQUESTED (only the pickup was undone)"
            - "trigger call 8 -> 201: the cancelled 09:00-10:00 slot is re-bookable, PickupAppointment.${appt3}.status == BOOKED and units == 2"
            - "after trigger call 8: PickupRoute.${route_id}.booked_units == 2 and available_units == 4, and ReturnCase.${rc1}.logistics_status == PICKUP_SCHEDULED"
            - "no MISSED or CANCELLED appointment is counted by calculations.pickup_units at any point"
