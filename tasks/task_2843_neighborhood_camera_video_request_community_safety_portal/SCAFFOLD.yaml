# =============================================================================
# SCAFFOLD.yaml — §1.0 – §1.7
# task_2843 Neighborhood Camera Video Request & Community Safety Portal
# =============================================================================

scenario: |
  2843. Neighborhood Camera Video Request & Community Safety Portal (Ring Neighbors): geographic request area definition and minimum-device threshold before a request is sent, voluntary device-owner consent and share-or-decline handling, law-enforcement agency onboarding and request justification logging, video retention windows and post-share deletion policy, resident post moderation for accuracy and discrimination, alert radius configuration and notification fatigue controls, transparency reporting on request volume and share rates, opt-out and account-level data controls

domain_name: neighborhood-safety-portal
api_prefix: /neighborhood-safety

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: graph
  # Devices and VideoRequests are joined many-to-many through ConsentSolicitation;
  # ResidentPost is self-referential through parent_post_id; SharedClip closes a
  # second edge back onto Device and ConsentSolicitation. No URL nesting is used
  # for ownership — every resource is addressed at a flat collection under
  # /neighborhood-safety and every relationship is expressed as an explicit FK.

  state_machine_shape: parallel
  # VideoRequest carries two independent dimensions on the same row:
  # `lifecycle_state` (solicitation progress) x `compliance_state` (justification
  # and audit posture). ResidentPost adds a revision cycle
  # (PUBLISHED -> FLAGGED -> UNDER_REVIEW -> REVISION_REQUESTED -> PUBLISHED),
  # Agency adds a suspension cycle (ONBOARDED -> SUSPENDED -> ONBOARDED), and
  # ConsentSolicitation adds a fork (SOLICITED -> {SHARED, DECLINED, EXPIRED})
  # with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The Officer who submits a VideoRequest may never be the Officer who clears or
  # escalates its audit, and the Moderator who opens a ModerationCase may never be
  # the Moderator who decides it. Both are enforced on X-User-ID, not on role name.

  consistency_model: immediate

  difficulty_level: above_expert
  # 13 entities / 50 endpoints / 54 error codes / 9 calculations (2 carrying
  # explicit variants) / 9 state machines over 8 entities (VideoRequest carries
  # two independent dimensions) / 39 transitions / 45 ordered validation rows /
  # 3 OCC rules. 22 of the 50 endpoints are read endpoints mandated by §1.5's
  # FK reverse-reachability rule (21 declared foreign keys); the remaining 28
  # carry all mutation surface.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================

entities:

  # ---------------------------------------------------------------------------
  - name: Agency
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal name of the law-enforcement agency.
        constraints: "1..160 chars, required"
      - name: jurisdiction_code
        type: string
        source: input
        description: Jurisdiction identifier used on transparency filings.
        constraints: "1..32 chars, required"
      - name: status
        type: enum
        source: system
        description: Onboarding / enforcement posture of the agency.
        default: PENDING_REVIEW
        constraints: "status IN {PENDING_REVIEW, ONBOARDED, REJECTED, SUSPENDED, REVOKED}"
      - name: onboarding_agreement_version
        type: string
        source: input
        description: Version string of the signed data-sharing MOU; set by the onboarding review.
        default: null
      - name: reviewer_note
        type: string
        source: input
        description: Free-text note recorded by the PlatformAdmin at onboarding review.
        default: null
      - name: status_reason
        type: string
        source: input
        description: Reason recorded on the most recent suspend / reinstate / revoke action.
        default: null
      - name: min_device_threshold
        type: integer
        source: input
        description: Agency-configured base minimum number of eligible devices required before a RequestArea may be locked.
        default: 5
        constraints: ">= 1 and <= 50"
      - name: max_open_requests
        type: integer
        source: input
        description: Maximum number of this agency's VideoRequests allowed in lifecycle_state SOLICITING at one time.
        default: 3
        constraints: ">= 1 and <= 25"
      - name: period_request_quota
        type: integer
        source: input
        description: Maximum number of VideoRequests this agency may submit in total (portal lifetime quota, counted by requests_submitted_count).
        default: 20
        constraints: ">= 1 and <= 500"
      - name: post_share_retention_days
        type: integer
        source: input
        description: Agency-side retention window in days applied to every SharedClip from the moment of sharing.
        default: 30
        constraints: ">= 1 and <= 365"
      - name: justification_min_chars
        type: integer
        source: input
        description: Minimum character length the agency's officers must supply in justification_text.
        default: 80
        constraints: ">= 20 and <= 2000"
      - name: open_request_count
        type: integer
        source: computed
        description: "Count of VideoRequest rows where agency_id == this Agency.id AND lifecycle_state == SOLICITING. Recomputed on every VideoRequest lifecycle transition."
        default: 0
      - name: requests_submitted_count
        type: integer
        source: computed
        description: "Monotonic count of VideoRequest rows for this agency that have ever entered lifecycle_state SOLICITING. Never decremented."
        default: 0
      - name: latest_report_id
        type: string
        source: system
        description: "Id of the most recently created TransparencyReport for this agency (identity only; never used in any ranking, tie-break or selector decision)."
        default: null

  # ---------------------------------------------------------------------------
  - name: Officer
    parent: null
    common_fields: true
    fields:
      - name: agency_id
        type: string
        source: input
        description: "FK -> Agency.id; the agency that employs this officer."
        constraints: required
      - name: badge_number
        type: string
        source: input
        description: Agency-scoped badge identifier.
        constraints: "1..32 chars, unique within agency_id"
      - name: full_name
        type: string
        source: input
        description: Officer display name shown to residents on solicitations.
        constraints: "1..120 chars, required"
      - name: duty_role
        type: enum
        source: input
        description: Segregation-of-duties capability of this officer within the agency.
        default: REQUESTER
        constraints: "duty_role IN {REQUESTER, AUDITOR, DUAL_ROLE}"
      - name: requests_submitted_count
        type: integer
        source: computed
        description: "Count of VideoRequest rows where submitting_officer_id == this Officer.id AND lifecycle_state has ever been SOLICITING."
        default: 0
      - name: audits_completed_count
        type: integer
        source: computed
        description: "Count of VideoRequest rows where auditor_officer_id == this Officer.id AND compliance_state IN {AUDIT_CLEARED, AUDIT_ESCALATED}."
        default: 0

  # ---------------------------------------------------------------------------
  - name: Resident
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: Neighborhood display name.
        constraints: "1..80 chars, required"
      - name: email
        type: string
        source: input
        description: Contact address; portal-wide unique.
        constraints: "required, unique across all Resident rows"
      - name: home_x_m
        type: integer
        source: input
        description: Resident home position on the municipal planning grid, easting in whole metres.
        constraints: "-1000000 .. 1000000, required"
      - name: home_y_m
        type: integer
        source: input
        description: Resident home position on the municipal planning grid, northing in whole metres.
        constraints: "-1000000 .. 1000000, required"
      - name: status
        type: enum
        source: system
        description: Account posture.
        default: ACTIVE
        constraints: "status IN {ACTIVE, DEACTIVATED}"
      - name: data_sharing_opt_out
        type: boolean
        source: system
        description: True when the resident has opted out of receiving video requests; set only by POST /residents/{id}/data-controls.
        default: false
      - name: alert_radius_m
        type: integer
        source: input
        description: Radius in metres around home_x_m/home_y_m within which this resident wishes to receive neighborhood post alerts. 0 means the resident wants no proximity post alerts at all.
        default: 800
        constraints: ">= 0 and <= 5000"
      - name: notification_budget_per_day
        type: integer
        source: input
        description: Base number of notifications the resident is willing to receive per UTC calendar day. 0 means every dispatch is suppressed for budget.
        default: 6
        constraints: ">= 0 and <= 100"
      - name: notification_mute_enabled
        type: boolean
        source: input
        description: When true, every NotificationDispatch to this resident is suppressed with suppression_reason RESIDENT_MUTED.
        default: false
      - name: notifications_sent_today
        type: integer
        source: computed
        description: "Count of NotificationDispatch rows for this resident with suppressed == false whose dispatched_at falls on the current logical-clock UTC calendar date. Reset to 0 by POST /_clock/set_current_utc when the UTC date changes."
        default: 0
      - name: fatigue_state
        type: enum
        source: computed
        description: "Derived notification posture; recomputed after every dispatch batch and after every clock date change per calculations.notification_fatigue_budget."
        default: NORMAL
        constraints: "fatigue_state IN {NORMAL, STRAINED, THROTTLED, MUTED}"
      - name: accuracy_strike_count
        type: integer
        source: computed
        description: "Count of this resident's ResidentPost rows removed by a ModerationCase decision of REMOVE_INACCURATE."
        default: 0
      - name: discrimination_strike_count
        type: integer
        source: computed
        description: "Count of this resident's ResidentPost rows removed by a ModerationCase decision of REMOVE_DISCRIMINATORY."
        default: 0
      - name: total_strike_score
        type: integer
        source: computed
        description: "accuracy_strike_count + 2 * discrimination_strike_count."
        default: 0
      - name: post_privilege_state
        type: enum
        source: computed
        description: "Posting posture derived from total_strike_score per calculations.strike_privilege_ladder."
        default: UNRESTRICTED
        constraints: "post_privilege_state IN {UNRESTRICTED, REVIEW_REQUIRED, POSTING_SUSPENDED}"
      - name: lifetime_shared_footage_seconds
        type: integer
        source: computed
        description: "Monotonic sum of duration_seconds over every SharedClip ever created from a device owned by this resident. Never decremented."
        default: 0
      - name: retained_footage_seconds
        type: integer
        source: computed
        description: "Sum of duration_seconds over SharedClip rows owned by this resident whose status IN {RETAINED, PURGE_PENDING, LEGAL_HOLD}."
        default: 0
      - name: purged_footage_seconds
        type: integer
        source: computed
        description: "Sum of duration_seconds over SharedClip rows owned by this resident whose status == PURGED."
        default: 0

  # ---------------------------------------------------------------------------
  - name: Device
    parent: null
    common_fields: true
    fields:
      - name: owner_resident_id
        type: string
        source: input
        description: "FK -> Resident.id; the resident who owns this camera."
        constraints: required
      - name: label
        type: string
        source: input
        description: Owner-supplied camera label.
        constraints: "1..80 chars, required"
      - name: grid_x_m
        type: integer
        source: input
        description: Camera position on the municipal planning grid, easting in whole metres.
        constraints: "-1000000 .. 1000000, required"
      - name: grid_y_m
        type: integer
        source: input
        description: Camera position on the municipal planning grid, northing in whole metres.
        constraints: "-1000000 .. 1000000, required"
      - name: retention_window_days
        type: integer
        source: input
        description: How many days of footage this camera keeps on device; bounds both eligibility and post-share retention.
        default: 30
        constraints: ">= 1 and <= 180"
      - name: status
        type: enum
        source: system
        description: Device operational posture; only ACTIVE devices are eligible for solicitation or sharing.
        default: ACTIVE
        constraints: "status IN {ACTIVE, OFFLINE, DECOMMISSIONED}"
      - name: auto_decline_requests
        type: boolean
        source: input
        description: When true this device is excluded from every eligible-device set.
        default: false
      - name: auto_decline_source
        type: enum
        source: system
        description: Records what set auto_decline_requests, so an OPT_IN_TO_REQUESTS action reverts only the flags the opt-out itself set.
        default: NONE
        constraints: "auto_decline_source IN {NONE, OWNER_MANUAL, OPT_OUT}"
      - name: solicitations_received_count
        type: integer
        source: computed
        description: "Monotonic count of ConsentSolicitation rows where device_id == this Device.id."
        default: 0
      - name: pending_solicitation_count
        type: integer
        source: computed
        description: "Count of ConsentSolicitation rows where device_id == this Device.id AND status == SOLICITED."
        default: 0

  # ---------------------------------------------------------------------------
  - name: RequestArea
    parent: null
    common_fields: true
    fields:
      - name: agency_id
        type: string
        source: input
        description: "FK -> Agency.id; the agency canvassing this area."
        constraints: required
      - name: created_by_officer_id
        type: string
        source: system
        description: "FK -> Officer.id; taken from X-User-ID of the Officer who created the area."
        constraints: required
      - name: area_label
        type: string
        source: input
        description: Human label for the canvass area.
        default: null
      - name: center_x_m
        type: integer
        source: input
        description: Area centre on the municipal planning grid, easting in whole metres.
        constraints: "-1000000 .. 1000000, required"
      - name: center_y_m
        type: integer
        source: input
        description: Area centre on the municipal planning grid, northing in whole metres.
        constraints: "-1000000 .. 1000000, required"
      - name: radius_m
        type: integer
        source: input
        description: Canvass radius in whole metres; the eligible-device disc is closed (distance <= radius_m).
        constraints: ">= 50 and <= 1500 (AREA_MAX_RADIUS_M)"
      - name: window_start_utc
        type: datetime
        source: input
        description: Inclusive start of the footage window being requested (ISO 8601 UTC, three fractional digits).
        constraints: "required; strictly before window_end_utc"
      - name: window_end_utc
        type: datetime
        source: input
        description: Inclusive end of the footage window being requested (ISO 8601 UTC, three fractional digits).
        constraints: "required; strictly after window_start_utc; must be <= the logical clock at lock time"
      - name: status
        type: enum
        source: system
        description: Area lifecycle posture.
        default: DRAFT
        constraints: "status IN {DRAFT, LOCKED, INVALIDATED}"
      - name: locked_at
        type: datetime
        source: system
        description: Logical-clock instant at which the area was locked.
        default: null
      - name: effective_min_devices
        type: integer
        source: computed
        description: "Threshold computed at lock time by calculations.effective_min_device_threshold; frozen on the row thereafter."
        default: null
      - name: eligible_device_count
        type: integer
        source: computed
        description: "Size of the eligible-device set computed by calculations.eligible_device_set; recomputed whenever a member device or its owner changes eligibility."
        default: 0
      - name: derived_request_count
        type: integer
        source: computed
        description: "Count of VideoRequest rows where request_area_id == this RequestArea.id."
        default: 0
      - name: invalidated_reason
        type: enum
        source: system
        description: Why the area dropped out of LOCKED.
        default: null
        constraints: "invalidated_reason IN {null, ELIGIBILITY_BELOW_THRESHOLD, AGENCY_SUSPENDED}"

  # ---------------------------------------------------------------------------
  - name: VideoRequest
    parent: null
    common_fields: true
    fields:
      - name: request_area_id
        type: string
        source: input
        description: "FK -> RequestArea.id; the locked area whose eligible-device set this request canvasses."
        constraints: required
      - name: agency_id
        type: string
        source: system
        description: "FK -> Agency.id; copied from the RequestArea at creation."
        constraints: required
      - name: submitting_officer_id
        type: string
        source: system
        description: "FK -> Officer.id; taken from X-User-ID of the Officer who created the request."
        constraints: required
      - name: auditor_officer_id
        type: string
        source: system
        description: "FK -> Officer.id; the Officer who cleared or escalated the audit; null until audit-review runs."
        default: null
      - name: case_number
        type: string
        source: input
        description: Agency case reference logged with the request.
        constraints: "1..64 chars, required"
      - name: lifecycle_state
        type: enum
        source: system
        description: Solicitation-progress dimension; evolves independently of compliance_state.
        default: DRAFT
        constraints: "lifecycle_state IN {DRAFT, SOLICITING, FULFILLED, EXHAUSTED, WITHDRAWN}"
      - name: compliance_state
        type: enum
        source: system
        description: Justification / audit dimension; evolves independently of lifecycle_state.
        default: JUSTIFICATION_PENDING
        constraints: "compliance_state IN {JUSTIFICATION_PENDING, JUSTIFICATION_LOGGED, AUDIT_FLAGGED, AUDIT_CLEARED, AUDIT_ESCALATED}"
      - name: justification_text
        type: string
        source: input
        description: Written justification logged before the request may be submitted.
        default: null
      - name: statutory_basis
        type: string
        source: input
        description: Statute or ordinance cited as the legal basis for the request.
        default: null
      - name: justification_logged_at
        type: datetime
        source: system
        description: Logical-clock instant at which the justification was accepted.
        default: null
      - name: audit_note
        type: string
        source: input
        description: Note recorded by the auditing Officer.
        default: null
      - name: withdraw_reason
        type: enum
        source: system
        description: Why the request left SOLICITING without resolving.
        default: null
        constraints: "withdraw_reason IN {null, OFFICER_WITHDRAWAL, AGENCY_SUSPENDED}"
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant at which the request entered SOLICITING.
        default: null
      - name: expires_at
        type: datetime
        source: computed
        description: "submitted_at + SOLICITATION_RESPONSE_HOURS (72h); also the respond_deadline_utc stamped on every ConsentSolicitation of this request."
        default: null
      - name: solicitation_count
        type: integer
        source: computed
        description: "Monotonic total number of ConsentSolicitation rows created for this request. Never decremented."
        default: 0
      - name: pending_count
        type: integer
        source: computed
        description: "Count of this request's ConsentSolicitation rows with status == SOLICITED."
        default: 0
      - name: shared_count
        type: integer
        source: computed
        description: "Count of this request's ConsentSolicitation rows with status == SHARED."
        default: 0
      - name: declined_count
        type: integer
        source: computed
        description: "Count of this request's ConsentSolicitation rows with status == DECLINED."
        default: 0
      - name: expired_count
        type: integer
        source: computed
        description: "Count of this request's ConsentSolicitation rows with status == EXPIRED."
        default: 0
      - name: withdrawn_count
        type: integer
        source: computed
        description: "Count of this request's ConsentSolicitation rows with status == WITHDRAWN."
        default: 0
      - name: shared_clip_count
        type: integer
        source: computed
        description: "Count of SharedClip rows where video_request_id == this VideoRequest.id, irrespective of clip status."
        default: 0
      - name: provisional_share_rate_bps
        type: integer
        source: computed
        description: "PROVISIONAL variant of calculations.share_rate_bps evaluated over this request's own solicitations."
        default: 0

  # ---------------------------------------------------------------------------
  - name: ConsentSolicitation
    parent: null
    common_fields: true
    fields:
      - name: video_request_id
        type: string
        source: system
        description: "FK -> VideoRequest.id; the request that solicited this device."
        constraints: required
      - name: device_id
        type: string
        source: system
        description: "FK -> Device.id; the solicited camera."
        constraints: required
      - name: resident_id
        type: string
        source: system
        description: "FK -> Resident.id; owner of device_id at solicitation time."
        constraints: required
      - name: status
        type: enum
        source: system
        description: Consent posture for this (request, device) pair.
        default: SOLICITED
        constraints: "status IN {SOLICITED, SHARED, DECLINED, EXPIRED, WITHDRAWN}"
      - name: distance_sq_m2
        type: integer
        source: computed
        description: "(device.grid_x_m - area.center_x_m)^2 + (device.grid_y_m - area.center_y_m)^2, in whole square metres; the dispatch sort key."
      - name: dispatch_rank
        type: integer
        source: computed
        description: "1-based position of this solicitation within its request's dispatch batch, ordered by distance_sq_m2 ASC then Device.created_at ASC."
      - name: respond_deadline_utc
        type: datetime
        source: computed
        description: "Copied from VideoRequest.expires_at at dispatch time."
      - name: notification_suppressed
        type: boolean
        source: computed
        description: True when the accompanying NotificationDispatch was suppressed; the solicitation itself still exists and may still be answered in-app.
        default: false
      - name: suppression_reason
        type: enum
        source: computed
        description: Why the accompanying notification was suppressed.
        default: null
        constraints: "suppression_reason IN {null, FATIGUE_BUDGET_EXHAUSTED, RESIDENT_MUTED}"
      - name: responded_at
        type: datetime
        source: system
        description: Logical-clock instant of the first resolving action (share, decline, expiry or withdrawal).
        default: null
      - name: decline_reason
        type: enum
        source: system
        description: Why the solicitation was declined.
        default: null
        constraints: "decline_reason IN {null, OWNER_DECLINE, OWNER_OPT_OUT, ACCOUNT_DEACTIVATED}"
      - name: clip_count
        type: integer
        source: computed
        description: "Count of SharedClip rows where consent_solicitation_id == this ConsentSolicitation.id, irrespective of clip status."
        default: 0

  # ---------------------------------------------------------------------------
  - name: SharedClip
    parent: null
    common_fields: true
    fields:
      - name: consent_solicitation_id
        type: string
        source: system
        description: "FK -> ConsentSolicitation.id; the consent under which this clip was shared."
        constraints: required
      - name: video_request_id
        type: string
        source: system
        description: "FK -> VideoRequest.id; copied from the solicitation."
        constraints: required
      - name: device_id
        type: string
        source: system
        description: "FK -> Device.id; the camera the footage came from."
        constraints: required
      - name: owner_resident_id
        type: string
        source: system
        description: "FK -> Resident.id; owner of device_id at share time; anchors the footage-seconds conservation invariant."
        constraints: required
      - name: recorded_start_utc
        type: datetime
        source: input
        description: Inclusive start instant of the footage segment.
        constraints: required
      - name: duration_seconds
        type: integer
        source: input
        description: Length of the footage segment in whole seconds; the clip occupies the half-open interval [recorded_start_utc, recorded_start_utc + duration_seconds).
        constraints: ">= 1 and <= 3600"
      - name: shared_at
        type: datetime
        source: system
        description: Logical-clock instant at which the clip was shared.
      - name: retention_variant
        type: enum
        source: computed
        description: Which branch of calculations.clip_retention_expiry produced retention_expires_at.
        constraints: "retention_variant IN {DEVICE_ANCHORED, CASE_ANCHORED}"
      - name: retention_expires_at
        type: datetime
        source: computed
        description: "Instant at or after which the retention sweep is entitled to purge this clip; produced by calculations.clip_retention_expiry."
      - name: status
        type: enum
        source: system
        description: Retention posture of the clip.
        default: RETAINED
        constraints: "status IN {RETAINED, LEGAL_HOLD, PURGE_PENDING, PURGED}"
      - name: purged_at
        type: datetime
        source: system
        description: Logical-clock instant at which the clip was purged.
        default: null
      - name: purge_reason
        type: enum
        source: input
        description: Why the clip was purged.
        default: null
        constraints: "purge_reason IN {null, OWNER_REVOCATION, RETENTION_EXPIRED, ACCOUNT_DEACTIVATED, LEGAL_RELEASE}"

  # ---------------------------------------------------------------------------
  - name: ResidentPost
    parent: null
    common_fields: true
    fields:
      - name: author_resident_id
        type: string
        source: input
        description: "FK -> Resident.id; the author. Must equal X-User-ID."
        constraints: required
      - name: parent_post_id
        type: string
        source: input
        description: "FK -> ResidentPost.id; the post this one replies to, or null for a top-level post (self-referential)."
        default: null
      - name: body
        type: string
        source: input
        description: Post text.
        constraints: "1..2000 chars, required"
      - name: category
        type: enum
        source: input
        description: Feed category.
        constraints: "category IN {SAFETY_REPORT, LOST_PET, SUSPICIOUS_ACTIVITY, GENERAL}, required"
      - name: post_x_m
        type: integer
        source: input
        description: Incident position on the municipal planning grid, easting in whole metres.
        constraints: "-1000000 .. 1000000, required"
      - name: post_y_m
        type: integer
        source: input
        description: Incident position on the municipal planning grid, northing in whole metres.
        constraints: "-1000000 .. 1000000, required"
      - name: alert_fanout_cap
        type: integer
        source: input
        description: Maximum number of residents this post may alert; caps the ranked candidate list.
        default: 50
        constraints: ">= 0 and <= 500"
      - name: protected_class_term_count
        type: integer
        source: input
        description: Classifier signal — number of protected-class descriptors detected in body.
        default: 0
        constraints: ">= 0 and <= 50"
      - name: unverified_assertion_count
        type: integer
        source: input
        description: Classifier signal — number of unverified factual assertions detected in body.
        default: 0
        constraints: ">= 0 and <= 50"
      - name: location_profiling_count
        type: integer
        source: input
        description: Classifier signal — number of location-profiling phrases detected in body.
        default: 0
        constraints: ">= 0 and <= 50"
      - name: hostile_tone_count
        type: integer
        source: input
        description: Classifier signal — number of hostile-tone markers detected in body.
        default: 0
        constraints: ">= 0 and <= 50"
      - name: discrimination_score
        type: number
        source: computed
        description: "Two-decimal score produced by calculations.post_discrimination_score from the four classifier signals; recomputed on every revise."
        default: 0.00
      - name: state
        type: enum
        source: system
        description: Moderation lifecycle state; cycles through revision rounds.
        default: PUBLISHED
        constraints: "state IN {PUBLISHED, FLAGGED, UNDER_REVIEW, REVISION_REQUESTED, REMOVED}"
      - name: flag_count
        type: integer
        source: computed
        description: "Monotonic count of distinct residents who have flagged this post. Never decremented, including across revision cycles."
        default: 0
      - name: flagged_by_resident_ids
        type: array
        source: system
        description: "Resident ids that have already flagged this post; used only to reject a duplicate flag from the same resident. Identity membership only — never a ranking or ordering input."
        default: []
      - name: revision_count
        type: integer
        source: computed
        description: "Number of completed revise operations on this post; capped by MAX_REVISION_CYCLES."
        default: 0
      - name: alert_candidate_count
        type: integer
        source: computed
        description: "Size of the eligible recipient set produced by calculations.post_alert_fanout before the alert_fanout_cap is applied."
        default: 0
      - name: alert_fanout_count
        type: integer
        source: computed
        description: "Number of NotificationDispatch rows for this post with suppressed == false."
        default: 0
      - name: alert_suppressed_count
        type: integer
        source: computed
        description: "Number of NotificationDispatch rows for this post with suppressed == true."
        default: 0
      - name: auto_flag_reason
        type: enum
        source: system
        description: Why the post did not land in PUBLISHED at creation.
        default: null
        constraints: "auto_flag_reason IN {null, DISCRIMINATION_SCORE, AUTHOR_UNDER_REVIEW, RESIDENT_FLAG_THRESHOLD}"

  # ---------------------------------------------------------------------------
  - name: ModerationCase
    parent: null
    common_fields: true
    fields:
      - name: resident_post_id
        type: string
        source: input
        description: "FK -> ResidentPost.id; the post under review."
        constraints: required
      - name: opened_reason
        type: enum
        source: input
        description: Why the case was opened. AUTHOR_SUSPENDED is reserved for system-opened cases.
        constraints: "opened_reason IN {RESIDENT_FLAGS, AUTO_SCORE, AUTHOR_SUSPENDED}, required"
      - name: opened_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the Moderator who opened the case, or the literal string \"system\" for cases opened by the author-suspension cascade. NOT an entity id and never dereferenced."
        constraints: required
      - name: decided_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the Moderator who decided the case. NOT an entity id and never dereferenced."
        default: null
      - name: state
        type: enum
        source: system
        description: Case lifecycle.
        default: OPEN
        constraints: "state IN {OPEN, DECIDED, SUPERSEDED}"
      - name: decision
        type: enum
        source: input
        description: Moderator outcome.
        default: NONE
        constraints: "decision IN {NONE, UPHELD_PUBLISH, REQUEST_REVISION, REMOVE_INACCURATE, REMOVE_DISCRIMINATORY}"
      - name: decision_note
        type: string
        source: input
        description: Rationale recorded with the decision.
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the decision.
        default: null
      - name: superseded_by_case_created_at
        type: datetime
        source: system
        description: "created_at of the ModerationCase that superseded this one; null unless state == SUPERSEDED."
        default: null
      - name: post_discrimination_score_at_open
        type: number
        source: system
        description: Snapshot of ResidentPost.discrimination_score at the moment the case was opened.

  # ---------------------------------------------------------------------------
  - name: NotificationDispatch
    parent: null
    common_fields: false
    fields:
      - name: resident_id
        type: string
        source: system
        description: "FK -> Resident.id; the intended recipient."
        constraints: required
      - name: kind
        type: enum
        source: system
        description: What produced the dispatch.
        constraints: "kind IN {CONSENT_SOLICITATION, POST_ALERT}"
      - name: source_ref_id
        type: string
        source: system
        description: "Polymorphic reference: the ConsentSolicitation.id when kind == CONSENT_SOLICITATION, the ResidentPost.id when kind == POST_ALERT. Identity only; deliberately NOT a declared foreign key because its target entity varies."
      - name: batch_sequence_no
        type: integer
        source: computed
        description: "1-based position of this dispatch inside its emitting batch, in the batch's pinned dispatch order."
      - name: suppressed
        type: boolean
        source: computed
        description: True when notification fatigue controls blocked delivery.
        default: false
      - name: suppression_reason
        type: enum
        source: computed
        description: Why delivery was blocked.
        default: null
        constraints: "suppression_reason IN {null, FATIGUE_BUDGET_EXHAUSTED, RESIDENT_MUTED}"
      - name: recipient_budget_snapshot
        type: integer
        source: computed
        description: "The recipient's notifications_sent_today value read at the start of the emitting batch; pinned input of calculations.notification_fatigue_budget."
      - name: recipient_effective_budget
        type: integer
        source: computed
        description: "The effective_budget the batch computed for this recipient; identical across every dispatch of one batch to the same recipient."
      - name: dispatched_at
        type: datetime
        source: system
        description: Logical-clock instant of the dispatch attempt.

  # ---------------------------------------------------------------------------
  - name: TransparencyReport
    parent: null
    common_fields: true
    fields:
      - name: agency_id
        type: string
        source: input
        description: "FK -> Agency.id; the agency the report covers."
        constraints: required
      - name: period_start_utc
        type: datetime
        source: input
        description: Inclusive lower bound of the reporting window.
        constraints: "required; strictly before period_end_utc"
      - name: period_end_utc
        type: datetime
        source: input
        description: Exclusive upper bound of the reporting window.
        constraints: "required"
      - name: variant
        type: enum
        source: system
        description: Which share-rate algorithm is authoritative for this report.
        default: PROVISIONAL
        constraints: "variant IN {PROVISIONAL, CERTIFIED}"
      - name: compiled_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the PlatformAdmin who compiled the report. NOT an entity id. The certifying admin must be a different X-User-ID (validations[priority=7])."
      - name: requests_submitted_count
        type: integer
        source: computed
        description: "Count of VideoRequest rows for agency_id whose submitted_at falls in [period_start_utc, period_end_utc)."
      - name: solicitations_dispatched_count
        type: integer
        source: computed
        description: "Count of ConsentSolicitation rows belonging to the in-window requests, irrespective of status."
      - name: suppressed_dispatch_count
        type: integer
        source: computed
        description: "Count of those solicitations with notification_suppressed == true."
      - name: shared_count
        type: integer
        source: computed
        description: "Count of those solicitations with status == SHARED."
      - name: declined_count
        type: integer
        source: computed
        description: "Count of those solicitations with status == DECLINED."
      - name: expired_count
        type: integer
        source: computed
        description: "Count of those solicitations with status == EXPIRED."
      - name: withdrawn_count
        type: integer
        source: computed
        description: "Count of those solicitations with status == WITHDRAWN."
      - name: pending_count
        type: integer
        source: computed
        description: "Count of those solicitations with status == SOLICITED."
      - name: opt_out_excluded_count
        type: integer
        source: computed
        description: "Count of those solicitations whose resident_id currently has data_sharing_opt_out == true."
      - name: purged_clip_count
        type: integer
        source: computed
        description: "Count of SharedClip rows belonging to the in-window requests with status == PURGED."
      - name: provisional_share_rate_bps
        type: integer
        source: computed
        description: "PROVISIONAL branch of calculations.share_rate_bps."
      - name: certified_share_rate_bps
        type: integer
        source: computed
        description: "CERTIFIED branch of calculations.share_rate_bps."
      - name: published_share_rate_bps
        type: integer
        source: computed
        description: "provisional_share_rate_bps when variant == PROVISIONAL, certified_share_rate_bps when variant == CERTIFIED."
      - name: certification_note
        type: string
        source: input
        description: Note recorded at certification.
        default: null
      - name: certified_at
        type: datetime
        source: system
        description: Logical-clock instant of certification.
        default: null
      - name: certified_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the PlatformAdmin who certified the report. NOT an entity id."
        default: null

  # ---------------------------------------------------------------------------
  - name: DataControlAction
    parent: null
    common_fields: false
    fields:
      - name: resident_id
        type: string
        source: system
        description: "FK -> Resident.id; the account the control was applied to."
        constraints: required
      - name: action_type
        type: enum
        source: input
        description: Which account-level data control was exercised.
        constraints: "action_type IN {OPT_OUT_OF_REQUESTS, OPT_IN_TO_REQUESTS, DEACTIVATE_ACCOUNT, PURGE_HISTORY}, required"
      - name: reason
        type: string
        source: input
        description: Optional free-text reason supplied by the resident.
        default: null
      - name: affected_device_count
        type: integer
        source: computed
        description: "Number of Device rows this action mutated."
        default: 0
      - name: affected_solicitation_count
        type: integer
        source: computed
        description: "Number of ConsentSolicitation rows this action mutated."
        default: 0
      - name: affected_clip_count
        type: integer
        source: computed
        description: "Number of SharedClip rows this action mutated."
        default: 0
      - name: affected_request_count
        type: integer
        source: computed
        description: "Number of VideoRequest rows whose lifecycle_state changed as a downstream consequence of this action."
        default: 0
      - name: applied_at
        type: datetime
        source: system
        description: Logical-clock instant at which the control took effect.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================

state_machines:

  # ---------------------------------------------------------------------------
  # Agency — cyclic (ONBOARDED -> SUSPENDED -> ONBOARDED)
  - entity: Agency
    dimension: status
    initial_state: PENDING_REVIEW
    terminal_states: [REJECTED, REVOKED]
    transitions:
      - from: PENDING_REVIEW
        to: ONBOARDED
        trigger: "POST /neighborhood-safety/agencies/{id}/onboarding-review with decision APPROVE"
        actor: PlatformAdmin
        preconditions:
          - "Agency.status == PENDING_REVIEW"
          - "onboarding_agreement_version is a non-empty string"
        side_effects:
          - "sets Agency.onboarding_agreement_version, Agency.reviewer_note"
          - "increments Agency.version by 1 and refreshes Agency.updated_at"
        note: "Officers may only be created once the agency is ONBOARDED."

      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /neighborhood-safety/agencies/{id}/onboarding-review with decision REJECT"
        actor: PlatformAdmin
        preconditions:
          - "Agency.status == PENDING_REVIEW"
        side_effects:
          - "sets Agency.reviewer_note"
          - "increments Agency.version by 1"
        note: "Terminal. No officers, areas or requests may ever be created for a REJECTED agency."

      - from: ONBOARDED
        to: SUSPENDED
        trigger: "POST /neighborhood-safety/agencies/{id}/status-change with target_status SUSPENDED"
        actor: PlatformAdmin
        preconditions:
          - "Agency.status == ONBOARDED"
          - "reason is a non-empty string"
        side_effects:
          - "sets Agency.status_reason = reason"
          - "CASCADE L1: every VideoRequest of this agency with lifecycle_state == SOLICITING transitions SOLICITING -> WITHDRAWN with withdraw_reason AGENCY_SUSPENDED, processed in ascending VideoRequest.created_at"
          - "CASCADE L2 (caused by L1): for each of those requests, every ConsentSolicitation with status == SOLICITED transitions SOLICITED -> WITHDRAWN, responded_at = clock_now, in ascending ConsentSolicitation.dispatch_rank; the owning Device.pending_solicitation_count decrements by 1 for each"
          - "CASCADE L3 (caused by L2): each affected VideoRequest recomputes pending_count, withdrawn_count and provisional_share_rate_bps; the ledger invariant solicitation_count == pending_count + shared_count + declined_count + expired_count + withdrawn_count is re-satisfied"
          - "CASCADE L4 (caused by L1): Agency.open_request_count recomputed to 0"
          - "increments Agency.version by 1"

      - from: SUSPENDED
        to: ONBOARDED
        trigger: "POST /neighborhood-safety/agencies/{id}/status-change with target_status ONBOARDED"
        actor: PlatformAdmin
        preconditions:
          - "Agency.status == SUSPENDED"
          - "reason is a non-empty string"
        side_effects:
          - "sets Agency.status_reason = reason"
          - "increments Agency.version by 1"
        note: "Closes the suspension cycle. Requests withdrawn during suspension are NOT restored — WITHDRAWN is terminal on the lifecycle dimension."

      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /neighborhood-safety/agencies/{id}/status-change with target_status REVOKED"
        actor: PlatformAdmin
        preconditions:
          - "Agency.status == SUSPENDED"
          - "reason is a non-empty string"
        side_effects:
          - "sets Agency.status_reason = reason"
          - "CASCADE L1: every RequestArea of this agency with status == LOCKED transitions LOCKED -> INVALIDATED with invalidated_reason AGENCY_SUSPENDED, in ascending RequestArea.created_at"
          - "increments Agency.version by 1"
        note: "Terminal."

  # ---------------------------------------------------------------------------
  # RequestArea — linear with a cross-entity invalidation edge
  - entity: RequestArea
    dimension: status
    initial_state: DRAFT
    terminal_states: [INVALIDATED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "POST /neighborhood-safety/request-areas/{id}/lock"
        actor: Officer
        preconditions:
          - "RequestArea.status == DRAFT"
          - "Agency.status == ONBOARDED for RequestArea.agency_id"
          - "acting Officer.id == RequestArea.created_by_officer_id"
          - "acting Officer.duty_role IN {REQUESTER, DUAL_ROLE}"
        side_effects:
          - "runs calculations.effective_min_device_threshold and freezes RequestArea.effective_min_devices"
          - "runs calculations.eligible_device_set and writes RequestArea.eligible_device_count"
          - "sets RequestArea.locked_at = clock_now"
          - "increments RequestArea.version by 1"

      - from: LOCKED
        to: INVALIDATED
        trigger: "system event: a member device or its owner loses eligibility (device status change, owner opt-out, owner deactivation) and the recomputed eligible_device_count drops below RequestArea.effective_min_devices"
        actor: system
        preconditions:
          - "RequestArea.status == LOCKED"
          - "recomputed eligible_device_count < RequestArea.effective_min_devices"
        side_effects:
          - "sets RequestArea.invalidated_reason = ELIGIBILITY_BELOW_THRESHOLD"
          - "increments RequestArea.version by 1"
        note: "Already-SOLICITING VideoRequests on the area continue unaffected; only not-yet-submitted DRAFT requests become unsubmittable. The lock froze the roster ORDER, not the eligibility of its members: losing a member is re-checked against effective_min_devices, and while the count still clears the threshold the area stays LOCKED and the ineligible camera stays on the roster (it is still solicited, and the share is refused later by validations[priority=19])."

      - from: LOCKED
        to: INVALIDATED
        trigger: "system event: the owning Agency transitions ONBOARDED -> SUSPENDED (or SUSPENDED -> REVOKED)"
        actor: system
        preconditions:
          - "RequestArea.status == LOCKED"
          - "Agency.status has just become SUSPENDED or REVOKED"
        side_effects:
          - "sets RequestArea.invalidated_reason = AGENCY_SUSPENDED"
          - "increments RequestArea.version by 1"
        note: "Divergent from the eligibility branch: enforcement invalidation ignores eligible_device_count entirely and does cascade onward, withdrawing the area's DRAFT and SOLICITING VideoRequests (Agency status-change CASCADE L2)."

  # ---------------------------------------------------------------------------
  # VideoRequest dimension 1 of 2 — lifecycle_state (solicitation progress)
  - entity: VideoRequest
    dimension: lifecycle_state
    initial_state: DRAFT
    terminal_states: [FULFILLED, EXHAUSTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SOLICITING
        trigger: "POST /neighborhood-safety/video-requests/{id}/submit"
        actor: Officer
        preconditions:
          - "VideoRequest.lifecycle_state == DRAFT"
          - "VideoRequest.compliance_state == JUSTIFICATION_LOGGED (cross-dimension guard on the same row)"
          - "acting Officer.id == VideoRequest.submitting_officer_id"
          - "Agency.status == ONBOARDED for VideoRequest.agency_id"
          - "RequestArea.status == LOCKED (not INVALIDATED) for VideoRequest.request_area_id"
          - "Agency.open_request_count < Agency.max_open_requests"
          - "Agency.requests_submitted_count < Agency.period_request_quota"
        side_effects:
          - "sets VideoRequest.submitted_at = clock_now and VideoRequest.expires_at = clock_now + 72h (SOLICITATION_RESPONSE_HOURS)"
          - "re-runs calculations.eligible_device_set against the area and creates one ConsentSolicitation per eligible device in status SOLICITED, in the pinned dispatch order (distance_sq_m2 ASC, then Device.created_at ASC), stamping dispatch_rank 1..N and respond_deadline_utc = VideoRequest.expires_at"
          - "increments Device.solicitations_received_count and Device.pending_solicitation_count by 1 for each solicited device"
          - "emits one NotificationDispatch per solicitation subject to calculations.notification_fatigue_budget; suppressed dispatches set ConsentSolicitation.notification_suppressed = true and the matching suppression_reason"
          - "sets VideoRequest.solicitation_count and pending_count to N; provisional_share_rate_bps = 0"
          - "increments Agency.open_request_count by 1, Agency.requests_submitted_count by 1, Officer.requests_submitted_count by 1"
          - "runs the audit trigger on the compliance dimension (see the JUSTIFICATION_LOGGED -> AUDIT_FLAGGED transition)"
          - "increments VideoRequest.version by 1"

      - from: SOLICITING
        to: FULFILLED
        trigger: "system event: the last SOLICITED solicitation of the request resolves (share, decline, expiry or withdrawal) leaving pending_count == 0, with shared_count >= 1"
        actor: system
        preconditions:
          - "VideoRequest.lifecycle_state == SOLICITING"
          - "VideoRequest.pending_count == 0"
          - "VideoRequest.shared_count >= 1"
        side_effects:
          - "decrements Agency.open_request_count by 1"
          - "recomputes VideoRequest.provisional_share_rate_bps"
          - "increments VideoRequest.version by 1"

      - from: SOLICITING
        to: EXHAUSTED
        trigger: "system event: the last SOLICITED solicitation of the request resolves leaving pending_count == 0 and shared_count == 0"
        actor: system
        preconditions:
          - "VideoRequest.lifecycle_state == SOLICITING"
          - "VideoRequest.pending_count == 0"
          - "VideoRequest.shared_count == 0"
        side_effects:
          - "decrements Agency.open_request_count by 1"
          - "sets VideoRequest.provisional_share_rate_bps = 0"
          - "increments VideoRequest.version by 1"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /neighborhood-safety/video-requests/{id}/withdraw"
        actor: Officer
        preconditions:
          - "VideoRequest.lifecycle_state == DRAFT"
          - "acting Officer.id == VideoRequest.submitting_officer_id"
        side_effects:
          - "sets VideoRequest.withdraw_reason = OFFICER_WITHDRAWAL"
          - "increments VideoRequest.version by 1"
        note: "No solicitations exist yet, so nothing cascades."

      - from: SOLICITING
        to: WITHDRAWN
        trigger: "POST /neighborhood-safety/video-requests/{id}/withdraw, or the Agency ONBOARDED -> SUSPENDED cascade"
        actor: Officer | system
        preconditions:
          - "VideoRequest.lifecycle_state == SOLICITING"
          - "when actor is Officer: acting Officer.id == VideoRequest.submitting_officer_id"
        side_effects:
          - "sets VideoRequest.withdraw_reason = OFFICER_WITHDRAWAL (officer trigger) or AGENCY_SUSPENDED (cascade trigger)"
          - "CASCADE L1: every ConsentSolicitation of this request with status == SOLICITED transitions SOLICITED -> WITHDRAWN in ascending dispatch_rank; responded_at = clock_now"
          - "CASCADE L2 (caused by L1): each affected Device.pending_solicitation_count decrements by 1"
          - "recomputes pending_count and withdrawn_count so solicitation_count == pending_count + shared_count + declined_count + expired_count + withdrawn_count still holds"
          - "decrements Agency.open_request_count by 1"
          - "increments VideoRequest.version by 1"
        note: "Already-SHARED solicitations and their SharedClips are untouched — withdrawal ends canvassing, it does not revoke consent already given."

  # ---------------------------------------------------------------------------
  # VideoRequest dimension 2 of 2 — compliance_state (justification / audit)
  - entity: VideoRequest
    dimension: compliance_state
    initial_state: JUSTIFICATION_PENDING
    terminal_states: [AUDIT_CLEARED, AUDIT_ESCALATED]
    transitions:
      - from: JUSTIFICATION_PENDING
        to: JUSTIFICATION_LOGGED
        trigger: "POST /neighborhood-safety/video-requests/{id}/justification"
        actor: Officer
        preconditions:
          - "VideoRequest.compliance_state == JUSTIFICATION_PENDING"
          - "VideoRequest.lifecycle_state == DRAFT"
          - "acting Officer.id == VideoRequest.submitting_officer_id"
          - "len(justification_text) >= Agency.justification_min_chars"
          - "statutory_basis is a non-empty string"
        side_effects:
          - "sets VideoRequest.justification_text, statutory_basis and justification_logged_at = clock_now"
          - "increments VideoRequest.version by 1"
        note: "This dimension advances while lifecycle_state stays DRAFT — the two dimensions are independent."

      - from: JUSTIFICATION_LOGGED
        to: AUDIT_FLAGGED
        trigger: "system event during POST /neighborhood-safety/video-requests/{id}/submit when the area is wide or dense"
        actor: system
        preconditions:
          - "VideoRequest.compliance_state == JUSTIFICATION_LOGGED"
          - "the DRAFT -> SOLICITING lifecycle transition has just succeeded"
          - "RequestArea.radius_m > 1000 (AUDIT_RADIUS_TRIGGER_M) OR RequestArea.eligible_device_count >= 4 (AUDIT_DEVICE_TRIGGER)"
        side_effects:
          - "increments VideoRequest.version by 1"
        note: "When neither trigger fires the compliance dimension stays at JUSTIFICATION_LOGGED and no audit is required."

      - from: AUDIT_FLAGGED
        to: AUDIT_CLEARED
        trigger: "POST /neighborhood-safety/video-requests/{id}/audit-review with decision CLEAR"
        actor: Officer
        preconditions:
          - "VideoRequest.compliance_state == AUDIT_FLAGGED"
          - "acting Officer.duty_role IN {AUDITOR, DUAL_ROLE}"
          - "acting Officer.agency_id == VideoRequest.agency_id"
          - "acting Officer.id != VideoRequest.submitting_officer_id (segregation of duties)"
        side_effects:
          - "sets VideoRequest.auditor_officer_id = acting officer id and VideoRequest.audit_note"
          - "increments Officer.audits_completed_count by 1"
          - "increments VideoRequest.version by 1"

      - from: AUDIT_FLAGGED
        to: AUDIT_ESCALATED
        trigger: "POST /neighborhood-safety/video-requests/{id}/audit-review with decision ESCALATE"
        actor: Officer
        preconditions:
          - "VideoRequest.compliance_state == AUDIT_FLAGGED"
          - "acting Officer.duty_role IN {AUDITOR, DUAL_ROLE}"
          - "acting Officer.agency_id == VideoRequest.agency_id"
          - "acting Officer.id != VideoRequest.submitting_officer_id (segregation of duties)"
        side_effects:
          - "sets VideoRequest.auditor_officer_id = acting officer id and VideoRequest.audit_note"
          - "increments Officer.audits_completed_count by 1"
          - "increments VideoRequest.version by 1"
        note: "Escalation changes which branch of calculations.clip_retention_expiry applies to clips shared afterwards — the compliance dimension reaches across into the retention policy of the lifecycle dimension's artifacts."

  # ---------------------------------------------------------------------------
  # ConsentSolicitation — branching fork with divergent side-effect sets per branch
  - entity: ConsentSolicitation
    dimension: status
    initial_state: SOLICITED
    terminal_states: [DECLINED, EXPIRED, WITHDRAWN]
    transitions:
      - from: SOLICITED
        to: SHARED
        trigger: "POST /neighborhood-safety/consent-solicitations/{id}/share"
        actor: Resident
        preconditions:
          - "ConsentSolicitation.status == SOLICITED"
          - "acting Resident.id == ConsentSolicitation.resident_id"
          - "Resident.status == ACTIVE"
          - "Resident.data_sharing_opt_out == false"
          - "Device.status == ACTIVE for ConsentSolicitation.device_id"
          - "logical clock now < ConsentSolicitation.respond_deadline_utc"
          - "[recorded_start_utc, recorded_start_utc + duration_seconds) is contained in [RequestArea.window_start_utc, RequestArea.window_end_utc]"
          - "the clip interval does not overlap any non-PURGED SharedClip interval already recorded on the same Device per validations[priority=40]"
        side_effects:
          - "creates a SharedClip; runs calculations.clip_retention_expiry to set retention_variant, retention_expires_at and initial status (RETAINED, or LEGAL_HOLD on the CASE_ANCHORED branch)"
          - "sets ConsentSolicitation.responded_at = clock_now and clip_count = 1"
          - "increments VideoRequest.shared_count by 1, decrements pending_count by 1, increments shared_clip_count by 1, recomputes provisional_share_rate_bps"
          - "decrements Device.pending_solicitation_count by 1"
          - "increments Resident.lifetime_shared_footage_seconds and Resident.retained_footage_seconds by duration_seconds, preserving lifetime_shared_footage_seconds == retained_footage_seconds + purged_footage_seconds"
          - "if VideoRequest.pending_count becomes 0, the lifecycle dimension auto-transitions SOLICITING -> FULFILLED"
          - "increments ConsentSolicitation.version by 1"

      - from: SHARED
        to: SHARED
        trigger: "POST /neighborhood-safety/consent-solicitations/{id}/share on an already-SHARED solicitation (additional footage segment)"
        actor: Resident
        preconditions:
          - "ConsentSolicitation.status == SHARED"
          - "same preconditions as the SOLICITED -> SHARED transition, except the status check"
        side_effects:
          - "creates an additional SharedClip and increments ConsentSolicitation.clip_count and VideoRequest.shared_clip_count by 1"
          - "increments Resident.lifetime_shared_footage_seconds and Resident.retained_footage_seconds by duration_seconds"
          - "does NOT change VideoRequest.shared_count / pending_count — the consent decision was already counted"
          - "increments ConsentSolicitation.version by 1"
        note: "Self-loop: one consent may cover several non-overlapping segments from the same camera."

      - from: SOLICITED
        to: DECLINED
        trigger: "POST /neighborhood-safety/consent-solicitations/{id}/decline, or the resident opt-out / account-deactivation cascade"
        actor: Resident | system
        preconditions:
          - "ConsentSolicitation.status == SOLICITED"
          - "when actor is Resident: acting Resident.id == ConsentSolicitation.resident_id and logical clock now < respond_deadline_utc"
        side_effects:
          - "sets decline_reason = OWNER_DECLINE (resident trigger), OWNER_OPT_OUT (opt-out cascade) or ACCOUNT_DEACTIVATED (deactivation cascade); responded_at = clock_now"
          - "increments VideoRequest.declined_count by 1, decrements pending_count by 1, recomputes provisional_share_rate_bps"
          - "decrements Device.pending_solicitation_count by 1"
          - "if VideoRequest.pending_count becomes 0, the lifecycle dimension auto-transitions to FULFILLED (shared_count >= 1) or EXHAUSTED (shared_count == 0)"
          - "increments ConsentSolicitation.version by 1"
        note: "Divergent from the SHARED branch: no SharedClip is created and no footage-seconds counters move."

      - from: SOLICITED
        to: EXPIRED
        trigger: "POST /neighborhood-safety/retention-sweeps — solicitation whose respond_deadline_utc <= clock_now"
        actor: system
        preconditions:
          - "ConsentSolicitation.status == SOLICITED"
          - "ConsentSolicitation.respond_deadline_utc <= logical clock now"
        side_effects:
          - "sets responded_at = clock_now; decline_reason stays null"
          - "increments VideoRequest.expired_count by 1, decrements pending_count by 1, recomputes provisional_share_rate_bps"
          - "decrements Device.pending_solicitation_count by 1"
          - "if VideoRequest.pending_count becomes 0, the lifecycle dimension auto-transitions to FULFILLED or EXHAUSTED"
          - "increments ConsentSolicitation.version by 1"
        note: "Divergent from DECLINED: expiry is silence, so decline_reason is left null and the resident takes no strike of any kind."

      - from: SOLICITED
        to: WITHDRAWN
        trigger: "system event: the owning VideoRequest leaves SOLICITING via withdrawal (officer or agency-suspension cascade)"
        actor: system
        preconditions:
          - "ConsentSolicitation.status == SOLICITED"
          - "owning VideoRequest.lifecycle_state transitions SOLICITING -> WITHDRAWN"
        side_effects:
          - "sets responded_at = clock_now"
          - "increments VideoRequest.withdrawn_count by 1, decrements pending_count by 1"
          - "decrements Device.pending_solicitation_count by 1"
          - "increments ConsentSolicitation.version by 1"

      - from: SHARED
        to: WITHDRAWN
        trigger: "system event: the resident purges the last non-PURGED SharedClip of this solicitation with purge_reason OWNER_REVOCATION or via a PURGE_HISTORY data control"
        actor: system
        preconditions:
          - "ConsentSolicitation.status == SHARED"
          - "every SharedClip with consent_solicitation_id == this id has status == PURGED after the purge just applied"
          - "the purge that triggered this was owner-initiated (purge_reason IN {OWNER_REVOCATION, ACCOUNT_DEACTIVATED}); a RETENTION_EXPIRED sweep purge does NOT withdraw consent"
        side_effects:
          - "sets responded_at = clock_now"
          - "decrements VideoRequest.shared_count by 1 and increments VideoRequest.withdrawn_count by 1, leaving solicitation_count unchanged so solicitation_count == pending_count + shared_count + declined_count + expired_count + withdrawn_count still holds"
          - "recomputes VideoRequest.provisional_share_rate_bps"
          - "increments ConsentSolicitation.version by 1"
        note: "Compensating action for the SOLICITED -> SHARED transition; it conserves solicitation_count exactly."

  # ---------------------------------------------------------------------------
  # SharedClip — branching retention posture
  - entity: SharedClip
    dimension: status
    initial_state: RETAINED
    terminal_states: [PURGED]
    transitions:
      - from: RETAINED
        to: PURGED
        trigger: "POST /neighborhood-safety/shared-clips/{id}/purge, or POST /neighborhood-safety/retention-sweeps when retention_expires_at <= clock_now"
        actor: Resident | PlatformAdmin | system
        preconditions:
          - "SharedClip.status == RETAINED"
          - "when actor is Resident: acting Resident.id == SharedClip.owner_resident_id"
          - "purge_reason IN {OWNER_REVOCATION, RETENTION_EXPIRED, LEGAL_RELEASE}"
        side_effects:
          - "sets purged_at = clock_now and purge_reason"
          - "decrements Resident.retained_footage_seconds by duration_seconds and increments Resident.purged_footage_seconds by the same duration_seconds, leaving Resident.lifetime_shared_footage_seconds unchanged"
          - "when purge_reason == OWNER_REVOCATION and this was the last non-PURGED clip of the solicitation: cascades ConsentSolicitation SHARED -> WITHDRAWN"
          - "when purge_reason == RETENTION_EXPIRED: the ConsentSolicitation stays SHARED and no VideoRequest count changes"
          - "increments SharedClip.version by 1"

      - from: LEGAL_HOLD
        to: PURGED
        trigger: "POST /neighborhood-safety/shared-clips/{id}/purge with purge_reason LEGAL_RELEASE"
        actor: PlatformAdmin
        preconditions:
          - "SharedClip.status == LEGAL_HOLD"
          - "purge_reason == LEGAL_RELEASE"
        side_effects:
          - "sets purged_at = clock_now and purge_reason = LEGAL_RELEASE"
          - "moves duration_seconds from Resident.retained_footage_seconds to Resident.purged_footage_seconds"
          - "the ConsentSolicitation stays SHARED"
          - "increments SharedClip.version by 1"
        note: "A LEGAL_HOLD clip is never purged by the retention sweep, however far past retention_expires_at the clock has moved; only an explicit LEGAL_RELEASE ends the hold."

      - from: RETAINED
        to: PURGE_PENDING
        trigger: "system event: the owner exercises a DEACTIVATE_ACCOUNT data control"
        actor: system
        preconditions:
          - "SharedClip.status == RETAINED"
          - "owning Resident transitions ACTIVE -> DEACTIVATED"
        side_effects:
          - "footage-seconds counters are unchanged (PURGE_PENDING still counts as retained exposure)"
          - "increments SharedClip.version by 1"

      - from: PURGE_PENDING
        to: PURGED
        trigger: "POST /neighborhood-safety/retention-sweeps, or POST /neighborhood-safety/shared-clips/{id}/purge with purge_reason ACCOUNT_DEACTIVATED"
        actor: system | PlatformAdmin
        preconditions:
          - "SharedClip.status == PURGE_PENDING"
        side_effects:
          - "sets purged_at = clock_now and purge_reason = ACCOUNT_DEACTIVATED"
          - "moves duration_seconds from Resident.retained_footage_seconds to Resident.purged_footage_seconds"
          - "cascades ConsentSolicitation SHARED -> WITHDRAWN when this was the last non-PURGED clip of the solicitation"
          - "increments SharedClip.version by 1"
        note: "PURGE_PENDING clips are swept regardless of retention_expires_at — deactivation overrides the retention window."

  # ---------------------------------------------------------------------------
  # ResidentPost — cyclic (PUBLISHED -> FLAGGED -> UNDER_REVIEW -> REVISION_REQUESTED -> PUBLISHED)
  - entity: ResidentPost
    dimension: state
    initial_state: PUBLISHED
    terminal_states: [REMOVED]
    transitions:
      - from: PUBLISHED
        to: FLAGGED
        trigger: "POST /neighborhood-safety/resident-posts/{id}/flag pushing flag_count to >= 2 (RESIDENT_FLAG_THRESHOLD)"
        actor: Resident
        preconditions:
          - "ResidentPost.state == PUBLISHED"
          - "acting Resident.id != ResidentPost.author_resident_id"
          - "acting Resident.id not already in ResidentPost.flagged_by_resident_ids"
          - "flag_count after this flag >= 2"
        side_effects:
          - "increments flag_count by 1 and appends the flagger id to flagged_by_resident_ids"
          - "sets auto_flag_reason = RESIDENT_FLAG_THRESHOLD"
          - "increments ResidentPost.version by 1"
        note: "A first flag increments flag_count and bumps version but leaves the post PUBLISHED."

      - from: FLAGGED
        to: UNDER_REVIEW
        trigger: "POST /neighborhood-safety/moderation-cases"
        actor: Moderator
        preconditions:
          - "ResidentPost.state == FLAGGED"
          - "expected_resident_post_version == ResidentPost.version"
        side_effects:
          - "creates a ModerationCase in state OPEN with post_discrimination_score_at_open snapshotted"
          - "increments ResidentPost.version by 1"

      - from: UNDER_REVIEW
        to: UNDER_REVIEW
        trigger: "POST /neighborhood-safety/moderation-cases against a post already under review (re-triage supersedes the open case)"
        actor: Moderator
        preconditions:
          - "ResidentPost.state == UNDER_REVIEW"
          - "expected_resident_post_version == ResidentPost.version"
        side_effects:
          - "the existing OPEN ModerationCase transitions OPEN -> SUPERSEDED with superseded_by_case_created_at set to the new case's created_at"
          - "creates a new ModerationCase in state OPEN"
          - "increments ResidentPost.version by 1"

      - from: UNDER_REVIEW
        to: PUBLISHED
        trigger: "POST /neighborhood-safety/moderation-cases/{id}/decide with decision UPHELD_PUBLISH"
        actor: Moderator
        preconditions:
          - "ResidentPost.state == UNDER_REVIEW"
          - "ModerationCase.state == OPEN"
          - "acting X-User-ID != ModerationCase.opened_by_user_id (segregation of duties)"
        side_effects:
          - "clears auto_flag_reason"
          - "runs calculations.post_alert_fanout now (deferred fan-out: a post that never reached PUBLISHED at creation alerts nobody until it is upheld) and writes alert_candidate_count, alert_fanout_count, alert_suppressed_count"
          - "increments ResidentPost.version by 1"

      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /neighborhood-safety/moderation-cases/{id}/decide with decision REQUEST_REVISION and ResidentPost.revision_count < 2 (MAX_REVISION_CYCLES)"
        actor: Moderator
        preconditions:
          - "ResidentPost.state == UNDER_REVIEW"
          - "ModerationCase.state == OPEN"
          - "acting X-User-ID != ModerationCase.opened_by_user_id"
          - "ResidentPost.revision_count < 2"
        side_effects:
          - "increments ResidentPost.version by 1"
        note: "revision_count is incremented by the revise action, not by this decision."

      - from: REVISION_REQUESTED
        to: PUBLISHED
        trigger: "POST /neighborhood-safety/resident-posts/{id}/revise producing discrimination_score < 0.49"
        actor: Resident
        preconditions:
          - "ResidentPost.state == REVISION_REQUESTED"
          - "acting Resident.id == ResidentPost.author_resident_id"
          - "Resident.post_privilege_state != POSTING_SUSPENDED"
          - "ResidentPost.revision_count < 2 (MAX_REVISION_CYCLES)"
          - "recomputed discrimination_score < 0.49 (DISCRIMINATION_FLAG_THRESHOLD)"
        side_effects:
          - "replaces body and the four classifier signals; re-runs calculations.post_discrimination_score"
          - "increments revision_count by 1; clears auto_flag_reason"
          - "runs calculations.post_alert_fanout and rewrites alert_candidate_count, alert_fanout_count, alert_suppressed_count"
          - "increments ResidentPost.version by 1"
        note: "Closes the revision cycle back to PUBLISHED."

      - from: REVISION_REQUESTED
        to: FLAGGED
        trigger: "POST /neighborhood-safety/resident-posts/{id}/revise producing discrimination_score >= 0.49"
        actor: Resident
        preconditions:
          - "ResidentPost.state == REVISION_REQUESTED"
          - "acting Resident.id == ResidentPost.author_resident_id"
          - "ResidentPost.revision_count < 2"
          - "recomputed discrimination_score >= 0.49"
        side_effects:
          - "replaces body and the four classifier signals; re-runs calculations.post_discrimination_score"
          - "increments revision_count by 1; sets auto_flag_reason = DISCRIMINATION_SCORE"
          - "no alert fan-out occurs (the post is not PUBLISHED)"
          - "increments ResidentPost.version by 1"
        note: "Second lap of the cycle — a revision that is still discriminatory returns to FLAGGED, not PUBLISHED."

      - from: UNDER_REVIEW
        to: REMOVED
        trigger: "POST /neighborhood-safety/moderation-cases/{id}/decide with decision REMOVE_INACCURATE or REMOVE_DISCRIMINATORY, or with REQUEST_REVISION when ResidentPost.revision_count >= 2"
        actor: Moderator
        preconditions:
          - "ResidentPost.state == UNDER_REVIEW"
          - "ModerationCase.state == OPEN"
          - "acting X-User-ID != ModerationCase.opened_by_user_id"
        side_effects:
          - "CASCADE L1: increments author Resident.accuracy_strike_count (REMOVE_INACCURATE, and REQUEST_REVISION exhausted past MAX_REVISION_CYCLES) or Resident.discrimination_strike_count (REMOVE_DISCRIMINATORY) by 1"
          - "CASCADE L2 (caused by L1): recomputes Resident.total_strike_score = accuracy_strike_count + 2 * discrimination_strike_count"
          - "CASCADE L3 (caused by L2): re-derives Resident.post_privilege_state per calculations.strike_privilege_ladder"
          - "CASCADE L4 (caused by L3 only when post_privilege_state becomes POSTING_SUSPENDED): every other ResidentPost of that author with state == PUBLISHED and created_at >= clock_now - 30 days (RECENT_POST_LOOKBACK_DAYS) transitions PUBLISHED -> UNDER_REVIEW in ascending created_at"
          - "CASCADE L5 (caused by L4): one ModerationCase is auto-created per swept post, in state OPEN, opened_reason AUTHOR_SUSPENDED, opened_by_user_id = \"system\""
          - "increments ResidentPost.version by 1"

      - from: PUBLISHED
        to: UNDER_REVIEW
        trigger: "system event: the author's post_privilege_state becomes POSTING_SUSPENDED (cascade L4 above)"
        actor: system
        preconditions:
          - "ResidentPost.state == PUBLISHED"
          - "ResidentPost.created_at >= clock_now - 30 days"
          - "author Resident.post_privilege_state has just become POSTING_SUSPENDED"
        side_effects:
          - "sets auto_flag_reason = AUTHOR_UNDER_REVIEW"
          - "increments ResidentPost.version by 1"

  # ---------------------------------------------------------------------------
  # ModerationCase — fork with a supersede edge
  - entity: ModerationCase
    dimension: state
    initial_state: OPEN
    terminal_states: [DECIDED, SUPERSEDED]
    transitions:
      - from: OPEN
        to: DECIDED
        trigger: "POST /neighborhood-safety/moderation-cases/{id}/decide"
        actor: Moderator
        preconditions:
          - "ModerationCase.state == OPEN"
          - "ResidentPost.state == UNDER_REVIEW for ModerationCase.resident_post_id"
          - "acting X-User-ID != ModerationCase.opened_by_user_id (segregation of duties)"
          - "decision IN {UPHELD_PUBLISH, REQUEST_REVISION, REMOVE_INACCURATE, REMOVE_DISCRIMINATORY}"
        side_effects:
          - "sets decision, decision_note, decided_by_user_id = acting X-User-ID, decided_at = clock_now"
          - "drives the matching ResidentPost transition out of UNDER_REVIEW"
          - "increments ModerationCase.version by 1"

      - from: OPEN
        to: SUPERSEDED
        trigger: "system event: a newer ModerationCase is opened on the same ResidentPost"
        actor: system
        preconditions:
          - "ModerationCase.state == OPEN"
          - "a new ModerationCase for the same resident_post_id has just been created"
        side_effects:
          - "sets superseded_by_case_created_at = the new case's created_at; decision stays NONE"
          - "increments ModerationCase.version by 1"

  # ---------------------------------------------------------------------------
  # TransparencyReport — linear, one-way certification
  - entity: TransparencyReport
    dimension: variant
    initial_state: PROVISIONAL
    terminal_states: [CERTIFIED]
    transitions:
      - from: PROVISIONAL
        to: CERTIFIED
        trigger: "POST /neighborhood-safety/transparency-reports/{id}/certify"
        actor: PlatformAdmin
        preconditions:
          - "TransparencyReport.variant == PROVISIONAL"
          - "certification_note is a non-empty string"
        side_effects:
          - "recomputes both branches of calculations.share_rate_bps over the same window and repoints published_share_rate_bps at certified_share_rate_bps"
          - "sets certified_at = clock_now and certified_by_user_id = acting X-User-ID"
          - "increments TransparencyReport.version by 1"

# =============================================================================
# 1.2.1 CONCURRENCY RULES
# Every entry below is a CREATE-with-supersede write whose parent version the
# writer must have observed. Each passes the serial-observability filter: a
# second strictly-sequential request that carries the CURRENT parent version
# would legitimately succeed under the product semantics, so the rejection can
# only come from the stale-version check itself, never from a state
# precondition.
# =============================================================================
concurrency_rules:
  - rule_id: video-request-create-stale-area
    parent_entity: RequestArea
    write_endpoint: "POST /neighborhood-safety/video-requests"
    occ_field: "expected_request_area_version"
    description: |
      Creating a VideoRequest against a RequestArea whose version has advanced
      since the officer last read it is rejected. A locked RequestArea may back
      any number of VideoRequests, and each creation bumps
      RequestArea.derived_request_count (and therefore its version), so a
      second creation carrying the current version legitimately succeeds; only
      a request still carrying the previously observed version is stale and
      rejected, because its author's view of the canvass area — device roster,
      request count, lock posture — predates a change another writer made.
    error_id: ERR_STALE_AREA_VERSION
    http_status: 412

  - rule_id: moderation-case-open-stale-post
    parent_entity: ResidentPost
    write_endpoint: "POST /neighborhood-safety/moderation-cases"
    occ_field: "expected_resident_post_version"
    description: |
      Opening a ModerationCase against a ResidentPost whose version has advanced
      since the moderator last read it is rejected. A new case legitimately
      supersedes any OPEN case on the same post (§1.2 ModerationCase
      OPEN -> SUPERSEDED), so a second case creation carrying the current post
      version succeeds and the earlier case is superseded; a creation still
      carrying the previously observed version is rejected because the
      moderator's triage judgement rests on post content, flag counts and a
      discrimination score that have since changed.
    error_id: ERR_STALE_POST_VERSION
    http_status: 412

  - rule_id: transparency-report-create-stale-agency
    parent_entity: Agency
    write_endpoint: "POST /neighborhood-safety/transparency-reports"
    occ_field: "expected_agency_version"
    description: |
      Creating a TransparencyReport against an Agency whose version has advanced
      since the administrator last read it is rejected. An agency may publish
      many overlapping reporting periods and each creation repoints
      Agency.latest_report_id (bumping the agency version), so a second report
      creation carrying the current version legitimately succeeds; a creation
      still carrying the previously observed version is rejected because the
      request-volume and share-rate figures it is about to publish were derived
      from an agency snapshot that is no longer current.
    error_id: ERR_STALE_AGENCY_VERSION
    http_status: 412

# =============================================================================
# 1.3 CALCULATION RULES
# All arithmetic is exact decimal arithmetic (Python's decimal.Decimal or an
# equivalent), NEVER IEEE-754 binary floating point. Rationale: several weights
# below (0.115, 0.085) are not exactly representable in binary, so
# 0.115 * 3 evaluates to 0.34499999999999997 under float and rounds DOWN under
# round_half_up, producing a wrong score. Implementations MUST construct every
# operand from its decimal string literal.
# =============================================================================
calculations:
  # ---------------------------------------------------------------------------
  - name: eligible_device_set
    trigger: "POST /neighborhood-safety/request-areas/{id}/lock — evaluated once, at lock time, over the whole Device table; the resulting roster is frozen onto the RequestArea and is NOT re-evaluated when the request is later submitted."
    algorithm: aggregation
    formula: |
      # Geometric eligibility on the municipal planning grid. All coordinates are
      # whole metres, so distance_sq is an exact integer and no square root is
      # ever taken (a float sqrt would make the boundary case ambiguous).
      candidates = []
      for d in all Devices:
          if d.status != ACTIVE:              continue   # OFFLINE / DECOMMISSIONED excluded
          if d.auto_decline_requests == true: continue   # owner blanket refusal
          owner = Resident[d.owner_resident_id]
          if owner.status != ACTIVE:           continue   # DEACTIVATED accounts excluded
          if owner.data_sharing_opt_out == true: continue # account-level opt-out excluded

          distance_sq = (d.grid_x_m - area.center_x_m)^2 + (d.grid_y_m - area.center_y_m)^2
          if distance_sq > area.radius_m^2:    continue   # CLOSED disc: <= is eligible

          # The camera must be able to still hold footage from the requested
          # window: retention is measured back from the lock instant.
          if d.retention_window_days * 86400 < (area.locked_at - area.window_start_utc) in seconds:
              continue

          candidates.append((distance_sq, d.created_at, d))

      # Deterministic ordering: nearest first, then oldest registration first.
      # Device.id is NEVER consulted — random ids must not decide dispatch order.
      candidates.sort(key = (distance_sq ASC, Device.created_at ASC))

      area.eligible_device_count = len(candidates)
      # dispatch_rank is the 1-based index in this ordering and is written onto
      # each ConsentSolicitation at submit time.
    input_set: "Every Device row with status == ACTIVE and auto_decline_requests == false whose owner Resident has status == ACTIVE and data_sharing_opt_out == false, and whose squared grid distance to the area centre is <= radius_m^2, and whose retention_window_days covers the gap between window_start_utc and locked_at."
    constants:
      GRID_UNIT_METRES: 1
      SECONDS_PER_DAY: 86400
    precision: "distance_sq_m2 and radius_m^2 are exact integers; the disc boundary is inclusive (distance_sq <= radius_m^2). No floating-point distance is computed anywhere."

  # ---------------------------------------------------------------------------
  - name: effective_min_device_threshold
    trigger: "POST /neighborhood-safety/request-areas/{id}/lock — written to RequestArea.effective_min_devices; re-read (never recomputed) by POST /neighborhood-safety/video-requests/{id}/submit."
    algorithm: threshold
    formula: |
      # A wider disc or a longer footage window means a broader intrusion, so the
      # portal demands proportionally more voluntary participants before any
      # request may leave DRAFT. Three independent terms compose additively.

      base = Agency[area.agency_id].min_device_threshold

      # Term 1 — radius bump (step function over metres)
      if   area.radius_m <= 500:   radius_bump = 0
      elif area.radius_m <= 1000:  radius_bump = 2
      else:                        radius_bump = 5

      # Term 2 — window bump (ceiling over 12-hour blocks, capped at 3)
      window_hours = (area.window_end_utc - area.window_start_utc) in whole hours, rounded UP
      window_bump  = min(3, ceil(window_hours / 12) - 1)

      # Term 3 — global floor, applied AFTER the sum, never before
      effective_min_devices = max(GLOBAL_MIN_DEVICE_FLOOR, base + radius_bump + window_bump)
    input_set: "The owning Agency's min_device_threshold plus the RequestArea's own radius_m and [window_start_utc, window_end_utc] span. No Device rows participate."
    constants:
      GLOBAL_MIN_DEVICE_FLOOR: 3
      RADIUS_BUMP_TIER_1_MAX_M: 500
      RADIUS_BUMP_TIER_2_MAX_M: 1000
      RADIUS_BUMP_TIER_1: 0
      RADIUS_BUMP_TIER_2: 2
      RADIUS_BUMP_TIER_3: 5
      WINDOW_BLOCK_HOURS: 12
      WINDOW_BUMP_CAP: 3
    precision: "Integer arithmetic throughout. window_hours is rounded UP to a whole hour before the division, and the division result is then ceilinged: a 6-hour window gives ceil(6/12) - 1 = 1 - 1 = 0; a 30-hour window gives ceil(30/12) - 1 = 3 - 1 = 2. The three bumps are summed FIRST and the floor is applied to the sum — flooring each term separately would give a different answer."

  # ---------------------------------------------------------------------------
  - name: share_rate_bps
    trigger: "Recomputed on VideoRequest.provisional_share_rate_bps after every ConsentSolicitation status change; both variants are computed by POST /neighborhood-safety/transparency-reports and recomputed by POST /neighborhood-safety/transparency-reports/{id}/certify."
    algorithm: aggregation
    formula: |
      # Share rate in basis points. Numerator and denominator are BOTH drawn
      # from the same per-variant inclusion set, so the ratio can never exceed
      # 1. The variants differ ONLY in which solicitations enter that set, which
      # is what makes them diverge on identical data.
      if variant == PROVISIONAL:
          included = all solicitations in scope
      if variant == CERTIFIED:
          included = solicitations in scope where
                       status IN {SHARED, DECLINED, EXPIRED}
                       AND notification_suppressed == false

      numerator   = count(included where status == SHARED)
      denominator = count(included)

      if denominator == 0:
          share_rate_bps = 0          # documented, not an error
      else:
          share_rate_bps = round_half_up(numerator * BPS_SCALE / denominator)
    input_set: "For VideoRequest.provisional_share_rate_bps: that request's own ConsentSolicitation rows. For a TransparencyReport: every ConsentSolicitation row belonging to a VideoRequest whose agency_id matches and whose submitted_at falls in [period_start_utc, period_end_utc)."
    constants:
      BPS_SCALE: 10000
    precision: "Exact integer/decimal division scaled to basis points, then round_half_up to a whole integer. 1/3 -> 3333, 2/3 -> 6667, 2/5 -> 4000, 1/4 -> 2500."
    variants:
      - name: PROVISIONAL
        when: "Live on VideoRequest.provisional_share_rate_bps at all times, and on TransparencyReport while variant == PROVISIONAL."
        difference: "The inclusion set is EVERY solicitation in scope — including rows still SOLICITED, rows WITHDRAWN, and rows whose notification was suppressed by fatigue controls. Unresolved and undelivered solicitations dilute the denominator while contributing nothing to the numerator."
      - name: CERTIFIED
        when: "Computed at TransparencyReport creation and recomputed at POST /neighborhood-safety/transparency-reports/{id}/certify, which repoints published_share_rate_bps at it."
        difference: "The inclusion set is only solicitations that actually reached a resident AND actually resolved — status IN {SHARED, DECLINED, EXPIRED} and notification_suppressed == false. Suppressed dispatches never gave the owner a chance to answer and SOLICITED / WITHDRAWN rows never got an answer, so both drop out of the denominator; crucially a SHARED row whose notification was suppressed also drops out of the NUMERATOR, so the certified rate is not merely the provisional rate with a smaller denominator and may land either side of it."

  # ---------------------------------------------------------------------------
  - name: clip_retention_expiry
    trigger: "POST /neighborhood-safety/consent-solicitations/{id}/share — evaluated once per SharedClip at creation; writes retention_variant, retention_expires_at and the clip's initial status. Never recomputed afterwards, even if the agency later changes post_share_retention_days."
    algorithm: interval_merge
    formula: |
      # Three independent retention deadlines bound the same clip. Which of them
      # is authoritative depends on the compliance posture of the request at the
      # moment of sharing — that is the variant switch.
      agency = Agency[solicitation.video_request.agency_id]
      device = Device[solicitation.device_id]
      req    = VideoRequest[solicitation.video_request_id]

      cand_agency = clip.shared_at        + agency.post_share_retention_days days
      cand_device = clip.recorded_start_utc + device.retention_window_days   days
      cand_portal = req.expires_at        + PORTAL_GRACE_DAYS days

      if req.compliance_state == AUDIT_ESCALATED at share time:
          retention_variant     = CASE_ANCHORED
          retention_expires_at  = max(cand_agency, cand_portal)   # cand_device is IGNORED
          status                = LEGAL_HOLD
      else:
          retention_variant     = DEVICE_ANCHORED
          retention_expires_at  = min(cand_agency, cand_device, cand_portal)
          status                = RETAINED
    input_set: "Exactly three candidate instants derived from the owning Agency's post_share_retention_days, the source Device's retention_window_days, and the owning VideoRequest's expires_at. The variant is selected by VideoRequest.compliance_state as read at share time."
    constants:
      PORTAL_GRACE_DAYS: 45
    precision: "Whole-day offsets added to ISO 8601 UTC instants; the resulting instant keeps the time-of-day of its base instant to the second. Ties between candidates are harmless because min and max of equal instants are equal."
    variants:
      - name: DEVICE_ANCHORED
        when: "VideoRequest.compliance_state is anything other than AUDIT_ESCALATED at the moment the clip is shared (JUSTIFICATION_PENDING, JUSTIFICATION_LOGGED, AUDIT_FLAGGED or AUDIT_CLEARED)."
        difference: "Takes the MINIMUM of all three candidates and includes the device candidate, so the shortest of the resident's own camera retention, the agency window and the portal grace period wins. Clip status starts at RETAINED and the retention sweep will purge it once the clock reaches retention_expires_at."
      - name: CASE_ANCHORED
        when: "VideoRequest.compliance_state == AUDIT_ESCALATED at the moment the clip is shared."
        difference: "Takes the MAXIMUM of the agency and portal candidates and DROPS the device candidate entirely, so evidence under audit escalation outlives the owner's own camera retention setting. Clip status starts at LEGAL_HOLD, which makes the retention sweep skip it forever; only an explicit LEGAL_RELEASE purge ends the hold. On identical input data the two variants therefore differ both in retention_expires_at and in whether the sweep may act at all."

  # ---------------------------------------------------------------------------
  - name: notification_fatigue_budget
    trigger: "Every batch that emits NotificationDispatch rows: POST /neighborhood-safety/video-requests/{id}/submit (one dispatch per solicited device), POST /neighborhood-safety/resident-posts, and the deferred fan-out on POST /neighborhood-safety/moderation-cases/{id}/decide with UPHELD_PUBLISH or POST /neighborhood-safety/resident-posts/{id}/revise."
    algorithm: decay_function
    formula: |
      # SNAPSHOT SEMANTICS (this is the whole difficulty of the rule):
      # the fatigue tier is computed ONCE per recipient, from the recipient's
      # notifications_sent_today as read at the START of the batch. Dispatches
      # emitted inside this batch decrement the remaining allowance but they do
      # NOT re-tier the recipient mid-batch. Re-deriving the tier per dispatch
      # would yield a strictly smaller allowance and is WRONG.

      for each recipient in the batch (processed in ascending batch_sequence_no):
          snapshot = recipient.notifications_sent_today          # read once, at batch start
          budget   = recipient.notification_budget_per_day

          if   snapshot <  FATIGUE_TIER_1_MAX:  tier_penalty = 0        # 0..4  -> RESTED
          elif snapshot <  FATIGUE_TIER_2_MAX:  tier_penalty = 1        # 5..9  -> NORMAL
          elif snapshot <  FATIGUE_TIER_3_MAX:  tier_penalty = 3        # 10..19 -> STRAINED
          else:                                 tier_penalty = budget   # 20+   -> full budget burned

          effective_budget = max(0, budget - tier_penalty)
          allowed_in_batch = max(0, effective_budget - snapshot)

      # Per-dispatch decision, in batch order:
      delivered_so_far = 0
      for dispatch in batch order:
          dispatch.recipient_budget_snapshot  = snapshot
          dispatch.recipient_effective_budget = effective_budget
          if recipient.notification_mute_enabled:
              dispatch.suppressed = true;  dispatch.suppression_reason = MUTED
          elif delivered_so_far >= allowed_in_batch:
              dispatch.suppressed = true;  dispatch.suppression_reason = FATIGUE_BUDGET
          else:
              dispatch.suppressed = false; dispatch.suppression_reason = null
              delivered_so_far += 1
              recipient.notifications_sent_today += 1

      # fatigue_state is re-derived from the POST-batch counter, so it can move
      # even in a batch where every dispatch was suppressed.
      if   recipient.notification_mute_enabled:                                            fatigue_state = MUTED
      elif recipient.notifications_sent_today >= effective_budget and effective_budget > 0: fatigue_state = THROTTLED
      elif effective_budget == 0:                                                           fatigue_state = THROTTLED
      elif recipient.notifications_sent_today >= FATIGUE_TIER_2_MAX:                        fatigue_state = STRAINED
      else:                                                                                fatigue_state = NORMAL
    input_set: "One recipient Resident per NotificationDispatch in the batch; the tier input is that resident's notifications_sent_today as of batch start, which POST /_clock/set_current_utc resets to 0 whenever the UTC calendar date advances."
    constants:
      FATIGUE_TIER_1_MAX: 5
      FATIGUE_TIER_2_MAX: 10
      FATIGUE_TIER_3_MAX: 20
      TIER_1_PENALTY: 0
      TIER_2_PENALTY: 1
      TIER_3_PENALTY: 3
    precision: "Integer arithmetic; every max(0, ...) clamp is mandatory so a penalty larger than the budget yields 0 rather than a negative allowance."

  # ---------------------------------------------------------------------------
  - name: post_discrimination_score
    trigger: "POST /neighborhood-safety/resident-posts and POST /neighborhood-safety/resident-posts/{id}/revise — decides whether the post lands in PUBLISHED or is auto-flagged."
    algorithm: weighted_scoring
    formula: |
      # PER-TERM ROUNDING (mandatory): each weighted term is rounded to two
      # decimals on its own, and the rounded terms are then summed and the sum is
      # rounded again. Summing the raw products and rounding once at the end
      # produces a DIFFERENT score for some inputs and is WRONG.
      t1 = round_half_up(W_PROTECTED_CLASS     * post.protected_class_term_count, 2)
      t2 = round_half_up(W_UNVERIFIED          * post.unverified_assertion_count, 2)
      t3 = round_half_up(W_LOCATION_PROFILING  * post.location_profiling_count,   2)
      t4 = round_half_up(W_HOSTILE_TONE        * post.hostile_tone_count,         2)

      discrimination_score = round_half_up(t1 + t2 + t3 + t4, 2)

      if discrimination_score >= DISCRIMINATION_FLAG_THRESHOLD:
          state = FLAGGED ; auto_flag_reason = DISCRIMINATION_SCORE
      else:
          state = PUBLISHED ; auto_flag_reason = null
    input_set: "The four integer classifier signals on the ResidentPost itself. No other entity participates; the score is a pure function of the post's own signal counts."
    constants:
      W_PROTECTED_CLASS: 0.34
      W_UNVERIFIED: 0.17
      W_LOCATION_PROFILING: 0.115
      W_HOSTILE_TONE: 0.085
      DISCRIMINATION_FLAG_THRESHOLD: 0.49
    precision: "Two decimal places, round_half_up, applied per term AND to the final sum. Operands MUST be exact decimals: with location_profiling_count == 3 and hostile_tone_count == 3, per-term rounding gives round(0.345)=0.35 and round(0.255)=0.26 for a total of 0.61, whereas rounding only the raw sum (0.6) gives 0.60. Under IEEE-754 binary floats 0.115 * 3 is 0.34499999999999997 and would round DOWN to 0.34, giving 0.60 — the wrong answer."

  # ---------------------------------------------------------------------------
  - name: post_alert_fanout
    trigger: "Whenever a ResidentPost enters or re-enters PUBLISHED: POST /neighborhood-safety/resident-posts (score below threshold), POST /neighborhood-safety/moderation-cases/{id}/decide with UPHELD_PUBLISH, and POST /neighborhood-safety/resident-posts/{id}/revise that lands below threshold."
    algorithm: aggregation
    formula: |
      # Selector policy: which neighbours hear about this post. Empty pools are
      # legal and produce counts of zero -- they are NEVER an error.
      candidates = []
      for r in all Residents:
          if r.id == post.author_resident_id:  continue   # never alert the author
          if r.status != ACTIVE:               continue
          distance_sq = (post.post_x_m - r.home_x_m)^2 + (post.post_y_m - r.home_y_m)^2
          if distance_sq > r.alert_radius_m^2: continue    # CLOSED disc, per-recipient radius
          candidates.append((distance_sq, r.created_at, r))

      # Deterministic ordering: nearest home first, then earliest account.
      # Resident.id is NEVER a tie-break input.
      candidates.sort(key = (distance_sq ASC, Resident.created_at ASC))

      post.alert_candidate_count = len(candidates)
      selected = candidates[0 : post.alert_fanout_cap]     # cap truncates the TAIL

      # Each selected candidate gets one NotificationDispatch, whose delivered /
      # suppressed outcome is decided by calculations.notification_fatigue_budget
      # with batch_sequence_no assigned in the ordering above.
      post.alert_fanout_count     = count(selected dispatches with suppressed == false)
      post.alert_suppressed_count = count(selected dispatches with suppressed == true)

      # Note the invariant: alert_fanout_count + alert_suppressed_count ==
      # min(alert_candidate_count, alert_fanout_cap), NOT alert_candidate_count.
    input_set: "Every Resident with status == ACTIVE other than the author, whose OWN alert_radius_m disc contains the post's grid position. The radius belongs to the recipient, not the post, so the candidate set is asymmetric: A may be alerted by a post at B's house without B being alerted by a post at A's."
    constants:
      MIN_FANOUT_CAP: 0
    precision: "Exact integer squared distances; the disc boundary is inclusive (distance_sq <= alert_radius_m^2). When candidates is empty, alert_candidate_count, alert_fanout_count and alert_suppressed_count are all 0, no NotificationDispatch rows are created, and the post is still created with HTTP 201."

  # ---------------------------------------------------------------------------
  - name: strike_privilege_ladder
    trigger: "Recomputed on Resident.post_privilege_state after every ModerationCase decision that removes one of that resident's posts."
    algorithm: threshold
    formula: |
      total_strike_score = accuracy_strike_count + DISCRIMINATION_STRIKE_WEIGHT * discrimination_strike_count

      if   total_strike_score >= STRIKE_SUSPEND_THRESHOLD: post_privilege_state = POSTING_SUSPENDED
      elif total_strike_score >= STRIKE_REVIEW_THRESHOLD:  post_privilege_state = REVIEW_REQUIRED
      else:                                               post_privilege_state = UNRESTRICTED
    input_set: "The resident's own accuracy_strike_count and discrimination_strike_count. A single REMOVE_DISCRIMINATORY decision therefore lands the resident straight in REVIEW_REQUIRED (score 2), and a second lands them in POSTING_SUSPENDED (score 4), while two REMOVE_INACCURATE decisions are needed to reach REVIEW_REQUIRED (score 2)."
    constants:
      DISCRIMINATION_STRIKE_WEIGHT: 2
      STRIKE_REVIEW_THRESHOLD: 2
      STRIKE_SUSPEND_THRESHOLD: 3
    precision: "Integer arithmetic; both comparisons are inclusive (>=). Score 2 is REVIEW_REQUIRED, score 3 is POSTING_SUSPENDED — score 3 is reachable only by mixing one discrimination strike with one accuracy strike."

  # ---------------------------------------------------------------------------
  - name: agency_open_request_quota
    trigger: "POST /neighborhood-safety/video-requests/{id}/submit — evaluated after every state precondition and after every other business rule; it is the LAST gate before the request enters SOLICITING."
    algorithm: threshold
    formula: |
      agency = Agency[request.agency_id]

      # Gate 1 — concurrent load (open requests only; resolved requests free a slot)
      if agency.open_request_count >= agency.max_open_requests:
          reject ERR_AGENCY_OPEN_REQUEST_QUOTA_EXCEEDED

      # Gate 2 — lifetime portal allotment (monotonic; never freed)
      if agency.requests_submitted_count >= agency.period_request_quota:
          reject ERR_AGENCY_PERIOD_QUOTA_EXCEEDED

      # On success both counters move, but only one of them can ever come back down.
      agency.open_request_count      += 1     # decremented when the request resolves
      agency.requests_submitted_count += 1    # monotonic
    input_set: "The submitting request's own Agency row. open_request_count counts VideoRequest rows for that agency in lifecycle_state == SOLICITING; requests_submitted_count counts every VideoRequest that has ever entered SOLICITING."
    constants:
      DEFAULT_MAX_OPEN_REQUESTS: 3
      DEFAULT_PERIOD_REQUEST_QUOTA: 20
    precision: "Integer arithmetic; both comparisons are inclusive (>=), so an agency configured with max_open_requests == 1 is blocked while exactly one request is SOLICITING and is unblocked the instant that request resolves."

# =============================================================================
# 1.4 VALIDATION RULES (evaluated strictly in ascending priority; the FIRST
# violated rule decides the response, and no later rule is evaluated)
#
# Domain ordering rationale: this is a civil-liberties surface, so
#   auth -> existence -> state -> safety/consent -> constraint -> fiscal quota.
# Resident consent and account-level opt-out (business_safety) always outrank
# scheduling conflicts (business_constraint), which in turn outrank the agency's
# request quotas (business_fiscal) — a resident's refusal must never be reported
# to an officer as "you are out of quota", and a quota breach must never mask a
# consent breach.
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-Role header present and one of PlatformAdmin, AgencyAdmin, Officer, Resident, Moderator, Anonymous; X-User-ID header present and non-empty for every role other than Anonymous."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /neighborhood-safety/residents"

  - priority: 2
    category: auth
    check: "The X-Role value appears in the endpoint's roles list in §1.5."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every {id} path segment resolves to an existing row, validated left-to-right; the entity type of the collection segment decides which not-found error is raised."
    error_id: "ERR_AGENCY_NOT_FOUND | ERR_OFFICER_NOT_FOUND | ERR_RESIDENT_NOT_FOUND | ERR_DEVICE_NOT_FOUND | ERR_REQUEST_AREA_NOT_FOUND | ERR_VIDEO_REQUEST_NOT_FOUND | ERR_SOLICITATION_NOT_FOUND | ERR_SHARED_CLIP_NOT_FOUND | ERR_POST_NOT_FOUND | ERR_MODERATION_CASE_NOT_FOUND | ERR_TRANSPARENCY_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with an {id} path segment"

  - priority: 4
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row: agency_id, owner_resident_id, author_resident_id, parent_post_id, request_area_id, resident_post_id."
    error_id: "ERR_AGENCY_NOT_FOUND | ERR_RESIDENT_NOT_FOUND | ERR_POST_NOT_FOUND | ERR_REQUEST_AREA_NOT_FOUND"
    http_status: 404
    applies_to: "POST /neighborhood-safety/officers, POST /neighborhood-safety/devices, POST /neighborhood-safety/request-areas, POST /neighborhood-safety/video-requests, POST /neighborhood-safety/resident-posts, POST /neighborhood-safety/moderation-cases, POST /neighborhood-safety/transparency-reports"

  - priority: 5
    category: existence
    check: "Request body is well formed: every required field present and non-null, every enum value in range, every integer within its declared bounds (radius_m >= 1, duration_seconds >= 1, alert_radius_m >= 0, alert_fanout_cap >= 0, all four classifier signal counts >= 0, notification_budget_per_day >= 0, retention_window_days >= 1), every datetime a valid ISO 8601 UTC instant, and email portal-wide unique."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 6
    category: auth
    check: "For entity-backed roles the acting identity matches the resource being acted on: X-User-ID equals Resident.id for resident-scoped writes (alert settings, data controls, device writes on an owned device, share/decline on an owned solicitation, purge of an owned clip, post authorship and revision), equals Officer.id for officer-scoped writes, and the acting Officer's or AgencyAdmin's agency_id matches the agency of the resource."
    error_id: ERR_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "PATCH /neighborhood-safety/residents/{id}/alert-settings, POST /neighborhood-safety/residents/{id}/data-controls, PATCH /neighborhood-safety/devices/{id}, POST /neighborhood-safety/devices, POST /neighborhood-safety/consent-solicitations/{id}/share, POST /neighborhood-safety/consent-solicitations/{id}/decline, POST /neighborhood-safety/shared-clips/{id}/purge, POST /neighborhood-safety/resident-posts, POST /neighborhood-safety/resident-posts/{id}/revise, POST /neighborhood-safety/request-areas, POST /neighborhood-safety/request-areas/{id}/lock, POST /neighborhood-safety/video-requests, POST /neighborhood-safety/officers"

  - priority: 7
    category: auth
    check: "Segregation of duties: the officer auditing a VideoRequest must not be its submitting_officer_id and must have duty_role == AUDITOR; the moderator deciding a ModerationCase must not be its opened_by_user_id; the PlatformAdmin certifying a TransparencyReport must not be the X-User-ID that created it."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /neighborhood-safety/video-requests/{id}/audit-review, POST /neighborhood-safety/moderation-cases/{id}/decide, POST /neighborhood-safety/transparency-reports/{id}/certify"

  - priority: 8
    category: state
    check: "The acting Resident's status is ACTIVE (a DEACTIVATED account may read its own data but may not write)."
    error_id: ERR_RESIDENT_DEACTIVATED
    http_status: 409
    applies_to: "all Resident-role write endpoints"

  - priority: 9
    category: state
    check: "The Agency owning the resource has status == ONBOARDED."
    error_id: ERR_AGENCY_NOT_ONBOARDED
    http_status: 409
    applies_to: "POST /neighborhood-safety/officers, POST /neighborhood-safety/request-areas, POST /neighborhood-safety/request-areas/{id}/lock, POST /neighborhood-safety/video-requests, POST /neighborhood-safety/video-requests/{id}/justification, POST /neighborhood-safety/video-requests/{id}/submit, POST /neighborhood-safety/transparency-reports"

  - priority: 10
    category: state
    check: "The Agency is in status PENDING_REVIEW when an onboarding review is submitted, and is in a status from which the requested status-change target is legal per §1.2: ONBOARDED -> SUSPENDED, SUSPENDED -> ONBOARDED, SUSPENDED -> REVOKED. REJECTED and REVOKED are terminal, and an ONBOARDED agency must be suspended before it can be revoked."
    error_id: ERR_AGENCY_STATUS_TRANSITION_INVALID
    http_status: 409
    applies_to: "POST /neighborhood-safety/agencies/{id}/onboarding-review, POST /neighborhood-safety/agencies/{id}/status-change"

  - priority: 11
    category: state
    check: "The RequestArea is in status DRAFT when it is locked."
    error_id: ERR_AREA_ALREADY_LOCKED
    http_status: 409
    applies_to: "POST /neighborhood-safety/request-areas/{id}/lock"

  - priority: 12
    category: state
    check: "The RequestArea has status == LOCKED when a VideoRequest is created against it (a DRAFT area has no frozen device roster and no effective_min_devices)."
    error_id: ERR_AREA_NOT_LOCKED
    http_status: 409
    applies_to: "POST /neighborhood-safety/video-requests"

  - priority: 13
    category: state
    check: "The RequestArea backing the VideoRequest has status == LOCKED at submit time — an area that has since been INVALIDATED (agency suspended, footage window elapsed past the canvass horizon, or explicitly abandoned) can no longer authorise a canvass."
    error_id: ERR_AREA_INVALIDATED
    http_status: 409
    applies_to: "POST /neighborhood-safety/video-requests/{id}/submit"

  - priority: 14
    category: state
    check: "The VideoRequest is in lifecycle_state == DRAFT."
    error_id: ERR_REQUEST_NOT_IN_DRAFT
    http_status: 409
    applies_to: "POST /neighborhood-safety/video-requests/{id}/justification, POST /neighborhood-safety/video-requests/{id}/submit"

  - priority: 15
    category: state
    check: "The VideoRequest is in lifecycle_state == SOLICITING."
    error_id: ERR_REQUEST_NOT_SOLICITING
    http_status: 409
    applies_to: "POST /neighborhood-safety/video-requests/{id}/withdraw, POST /neighborhood-safety/consent-solicitations/{id}/share, POST /neighborhood-safety/consent-solicitations/{id}/decline"

  - priority: 16
    category: state
    check: "The VideoRequest has compliance_state != JUSTIFICATION_PENDING at submit time — the written justification and statutory basis must already be logged."
    error_id: ERR_JUSTIFICATION_NOT_LOGGED
    http_status: 409
    applies_to: "POST /neighborhood-safety/video-requests/{id}/submit"

  - priority: 17
    category: state
    check: "The VideoRequest has compliance_state == AUDIT_FLAGGED when an audit review is recorded."
    error_id: ERR_AUDIT_NOT_PENDING
    http_status: 409
    applies_to: "POST /neighborhood-safety/video-requests/{id}/audit-review"

  - priority: 18
    category: state
    check: "The ConsentSolicitation has status IN {SOLICITED, SHARED} for a share, and status == SOLICITED for a decline — a DECLINED, EXPIRED or WITHDRAWN solicitation is closed to both."
    error_id: ERR_SOLICITATION_ALREADY_RESOLVED
    http_status: 409
    applies_to: "POST /neighborhood-safety/consent-solicitations/{id}/share, POST /neighborhood-safety/consent-solicitations/{id}/decline"

  - priority: 19
    category: state
    check: "The Device named by the solicitation has status == ACTIVE at share time. A camera the owner has since decommissioned cannot produce footage, even though the solicitation itself is still open."
    error_id: ERR_DEVICE_DECOMMISSIONED
    http_status: 409
    applies_to: "POST /neighborhood-safety/consent-solicitations/{id}/share"

  - priority: 20
    category: state
    check: "The SharedClip has status != PURGED."
    error_id: ERR_CLIP_ALREADY_PURGED
    http_status: 409
    applies_to: "POST /neighborhood-safety/shared-clips/{id}/purge"

  - priority: 21
    category: state
    check: "A SharedClip in status LEGAL_HOLD may only be purged with purge_reason == LEGAL_RELEASE by a PlatformAdmin; the owner's OWNER_REVOCATION and the sweep's RETENTION_EXPIRED are both refused."
    error_id: ERR_CLIP_UNDER_LEGAL_HOLD
    http_status: 409
    applies_to: "POST /neighborhood-safety/shared-clips/{id}/purge"

  - priority: 22
    category: state
    check: "The ResidentPost has state == PUBLISHED when it is flagged."
    error_id: ERR_POST_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /neighborhood-safety/resident-posts/{id}/flag"

  - priority: 23
    category: state
    check: "The ResidentPost has state IN {FLAGGED, UNDER_REVIEW} when a ModerationCase is opened against it."
    error_id: ERR_POST_NOT_FLAGGED
    http_status: 409
    applies_to: "POST /neighborhood-safety/moderation-cases"

  - priority: 24
    category: state
    check: "The ModerationCase has state == OPEN (a DECIDED or SUPERSEDED case is terminal)."
    error_id: ERR_CASE_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /neighborhood-safety/moderation-cases/{id}/decide"

  - priority: 25
    category: state
    check: "The ResidentPost has state == REVISION_REQUESTED when it is revised."
    error_id: ERR_POST_NOT_REVISABLE
    http_status: 409
    applies_to: "POST /neighborhood-safety/resident-posts/{id}/revise"

  - priority: 26
    category: state
    check: "The TransparencyReport has variant == PROVISIONAL when it is certified."
    error_id: ERR_REPORT_ALREADY_CERTIFIED
    http_status: 409
    applies_to: "POST /neighborhood-safety/transparency-reports/{id}/certify"

  - priority: 27
    category: state
    check: "expected_request_area_version equals the current RequestArea.version (concurrency_rules[video-request-create-stale-area])."
    error_id: ERR_STALE_AREA_VERSION
    http_status: 412
    applies_to: "POST /neighborhood-safety/video-requests"

  - priority: 28
    category: state
    check: "expected_resident_post_version equals the current ResidentPost.version (concurrency_rules[moderation-case-open-stale-post])."
    error_id: ERR_STALE_POST_VERSION
    http_status: 412
    applies_to: "POST /neighborhood-safety/moderation-cases"

  - priority: 29
    category: state
    check: "expected_agency_version equals the current Agency.version (concurrency_rules[transparency-report-create-stale-agency])."
    error_id: ERR_STALE_AGENCY_VERSION
    http_status: 412
    applies_to: "POST /neighborhood-safety/transparency-reports"

  # --- business rules: (a) safety / consent / compliance -----------------------
  - priority: 30
    category: business_safety
    check: "The resident acting on a solicitation has data_sharing_opt_out == false. An account-level opt-out is an absolute refusal to participate in video requests and is checked before any scheduling, window or quota consideration."
    error_id: ERR_RESIDENT_OPTED_OUT
    http_status: 409
    applies_to: "POST /neighborhood-safety/consent-solicitations/{id}/share"

  - priority: 31
    category: business_safety
    check: "The acting Resident has post_privilege_state != POSTING_SUSPENDED when creating or revising a post."
    error_id: ERR_POSTING_SUSPENDED
    http_status: 409
    applies_to: "POST /neighborhood-safety/resident-posts, POST /neighborhood-safety/resident-posts/{id}/revise"

  - priority: 32
    category: business_safety
    check: "justification_text is at least Agency.justification_min_chars characters long after trimming surrounding whitespace, and statutory_basis is a non-empty string. A request may not be logged with a token justification."
    error_id: ERR_JUSTIFICATION_TOO_SHORT
    http_status: 422
    applies_to: "POST /neighborhood-safety/video-requests/{id}/justification"

  - priority: 33
    category: business_safety
    check: "A DEACTIVATE_ACCOUNT or PURGE_HISTORY data control is refused while the resident owns at least one SharedClip in status LEGAL_HOLD — evidence under audit escalation cannot be erased by an account-level control."
    error_id: ERR_DATA_CONTROL_BLOCKED_BY_HOLD
    http_status: 409
    applies_to: "POST /neighborhood-safety/residents/{id}/data-controls"

  # --- business rules: (b) temporal validity ----------------------------------
  - priority: 34
    category: business_temporal
    check: "window_start_utc < window_end_utc for a RequestArea, and additionally RequestArea.window_end_utc must be at or before the current logical clock instant (no canvass for footage that has not been recorded yet) and the area window may not exceed AREA_MAX_WINDOW_HOURS (168). For a TransparencyReport, period_start_utc < period_end_utc; a reporting period has no length cap and may lie wholly in the past or straddle the clock."
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /neighborhood-safety/request-areas, POST /neighborhood-safety/transparency-reports"

  - priority: 35
    category: business_temporal
    check: "The logical clock is strictly before ConsentSolicitation.respond_deadline_utc. Once the 72-hour response window has elapsed the owner may no longer answer, even if the retention sweep has not yet marked the solicitation EXPIRED."
    error_id: ERR_SOLICITATION_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /neighborhood-safety/consent-solicitations/{id}/share, POST /neighborhood-safety/consent-solicitations/{id}/decline"

  - priority: 36
    category: business_temporal
    check: "The shared clip interval [recorded_start_utc, recorded_start_utc + duration_seconds) is fully contained in the RequestArea's CLOSED footage window [window_start_utc, window_end_utc] — an officer may only receive footage from the window they justified."
    error_id: ERR_CLIP_OUTSIDE_REQUEST_WINDOW
    http_status: 422
    applies_to: "POST /neighborhood-safety/consent-solicitations/{id}/share"

  - priority: 37
    category: business_constraint
    check: "RequestArea.radius_m is at most AREA_MAX_RADIUS_M (1500 m). A wider disc would sweep in whole districts rather than a neighbourhood, so it is refused outright regardless of how many devices it would find."
    error_id: ERR_AREA_RADIUS_EXCEEDS_LIMIT
    http_status: 422
    applies_to: "POST /neighborhood-safety/request-areas"

  # --- business rules: (c) constraint satisfaction ----------------------------
  - priority: 38
    category: business_constraint
    check: "The new RequestArea does not repeat-canvass a neighbourhood: it is rejected when another non-INVALIDATED RequestArea of the SAME agency has a centre within AREA_PROXIMITY_M (300 m, closed disc on squared distance) AND its footage window, extended by an ASYMMETRIC buffer of 0 hours before window_start_utc and AREA_CANVASS_BUFFER_HOURS (24) after window_end_utc, has a CLOSED-interval intersection with the new area's own window."
    error_id: ERR_AREA_CANVASS_OVERLAP
    http_status: 409
    applies_to: "POST /neighborhood-safety/request-areas"

  - priority: 39
    category: business_constraint
    check: "RequestArea.eligible_device_count >= RequestArea.effective_min_devices at submit time. Below the minimum-device threshold the canvass would identify individual households rather than survey a neighbourhood, so no solicitation is dispatched at all."
    error_id: ERR_MIN_DEVICE_THRESHOLD_NOT_MET
    http_status: 409
    applies_to: "POST /neighborhood-safety/video-requests/{id}/submit"

  - priority: 40
    category: business_constraint
    check: "The proposed clip interval, treated as HALF-OPEN [recorded_start_utc, recorded_start_utc + duration_seconds), does not intersect the half-open interval of any existing SharedClip on the same Device whose status != PURGED. Adjacent intervals that merely touch at an endpoint do NOT conflict; one second of true overlap does."
    error_id: ERR_DEVICE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /neighborhood-safety/consent-solicitations/{id}/share"

  - priority: 41
    category: business_constraint
    check: "The acting Resident is not the post's author_resident_id when flagging."
    error_id: ERR_SELF_FLAG_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /neighborhood-safety/resident-posts/{id}/flag"

  - priority: 42
    category: business_constraint
    check: "The acting Resident's id does not already appear in ResidentPost.flagged_by_resident_ids — one resident, one flag."
    error_id: ERR_DUPLICATE_FLAG
    http_status: 409
    applies_to: "POST /neighborhood-safety/resident-posts/{id}/flag"

  - priority: 43
    category: business_referential
    check: "No other Device owned by the same Resident with status != DECOMMISSIONED already sits at exactly (grid_x_m, grid_y_m) — duplicate co-located cameras would double-count a single household toward the minimum-device threshold."
    error_id: ERR_DUPLICATE_DEVICE_LOCATION
    http_status: 409
    applies_to: "POST /neighborhood-safety/devices"

  # --- business rules: (d) fiscal / quota — always LAST ------------------------
  - priority: 44
    category: business_fiscal
    check: "Agency.open_request_count < Agency.max_open_requests at submit time (calculations.agency_open_request_quota gate 1)."
    error_id: ERR_AGENCY_OPEN_REQUEST_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /neighborhood-safety/video-requests/{id}/submit"

  - priority: 45
    category: business_fiscal
    check: "Agency.requests_submitted_count < Agency.period_request_quota at submit time (calculations.agency_open_request_quota gate 2)."
    error_id: ERR_AGENCY_PERIOD_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /neighborhood-safety/video-requests/{id}/submit"

# =============================================================================
# 1.5 API ENDPOINTS
# Path convention: the primary identifier segment is spelled `{id}` on EVERY
# path, including sub-resource reads, so that reverse-reachability GETs sit
# directly under their parent's single-resource path.
# Every list endpoint's filter and pagination inputs are OPTIONAL; a bare GET
# with no query string is always legal and returns the first page.
# =============================================================================
endpoints:
  # --- reads: Agency / Officer ------------------------------------------------
  - method: GET
    path: "/neighborhood-safety/agencies/{id}"
    description: "Read one law-enforcement agency, including its onboarding posture, configured thresholds and derived request counters."
    roles: [PlatformAdmin, AgencyAdmin, Officer, Moderator]
    code: 200
    input: []
    output: Agency
    side_effects: []

  - method: GET
    path: "/neighborhood-safety/officers/{id}"
    description: "Read one officer, including duty_role and the segregation-of-duties counters."
    roles: [PlatformAdmin, AgencyAdmin, Officer]
    code: 200
    input: []
    output: Officer
    side_effects: []

  - method: GET
    path: "/neighborhood-safety/officers"
    description: "List officers. Reverse-reachability for Officer.agency_id."
    roles: [PlatformAdmin, AgencyAdmin, Officer]
    code: 200
    input: ["agency_id?", "duty_role?", "limit?", "offset?"]
    output: Officer[]
    side_effects: []

  # --- reads: Resident / Device -----------------------------------------------
  - method: GET
    path: "/neighborhood-safety/residents/{id}"
    description: "Read one resident account, including alert configuration, fatigue posture, strike ladder and the three footage-seconds counters."
    roles: [PlatformAdmin, Moderator, Resident]
    code: 200
    input: []
    output: Resident
    side_effects: []

  - method: GET
    path: "/neighborhood-safety/residents/{id}/notification-dispatches"
    description: "List every notification dispatch aimed at this resident, delivered or suppressed, in ascending dispatched_at then batch_sequence_no. Reverse-reachability for NotificationDispatch.resident_id — dispatches are only ever created as a cascade side effect, so this is their sole discovery channel."
    roles: [PlatformAdmin, Resident]
    code: 200
    input: ["kind?", "suppressed?", "limit?", "offset?"]
    output: NotificationDispatch[]
    side_effects: []

  - method: GET
    path: "/neighborhood-safety/residents/{id}/data-control-actions"
    description: "List the account-level data controls this resident has exercised, newest last. Reverse-reachability for DataControlAction.resident_id."
    roles: [PlatformAdmin, Resident]
    code: 200
    input: ["action_type?", "limit?", "offset?"]
    output: DataControlAction[]
    side_effects: []

  - method: GET
    path: "/neighborhood-safety/devices/{id}"
    description: "Read one camera, including its grid position, retention window and auto-decline posture."
    roles: [PlatformAdmin, Officer, Resident]
    code: 200
    input: []
    output: Device
    side_effects: []

  - method: GET
    path: "/neighborhood-safety/devices"
    description: "List cameras. Reverse-reachability for Device.owner_resident_id."
    roles: [PlatformAdmin, Officer, Resident]
    code: 200
    input: ["owner_resident_id?", "status?", "auto_decline_requests?", "limit?", "offset?"]
    output: Device[]
    side_effects: []

  # --- reads: RequestArea / VideoRequest --------------------------------------
  - method: GET
    path: "/neighborhood-safety/request-areas/{id}"
    description: "Read one canvass area, including the frozen eligible_device_count, the computed effective_min_devices and the current version for optimistic concurrency."
    roles: [PlatformAdmin, AgencyAdmin, Officer]
    code: 200
    input: []
    output: RequestArea
    side_effects: []

  - method: GET
    path: "/neighborhood-safety/request-areas"
    description: "List canvass areas. Reverse-reachability for RequestArea.agency_id and RequestArea.created_by_officer_id."
    roles: [PlatformAdmin, AgencyAdmin, Officer]
    code: 200
    input: ["agency_id?", "created_by_officer_id?", "status?", "limit?", "offset?"]
    output: RequestArea[]
    side_effects: []

  - method: GET
    path: "/neighborhood-safety/video-requests/{id}"
    description: "Read one video request, including both independent state dimensions and every solicitation counter."
    roles: [PlatformAdmin, AgencyAdmin, Officer, Resident]
    code: 200
    input: []
    output: VideoRequest
    side_effects: []

  - method: GET
    path: "/neighborhood-safety/video-requests"
    description: "List video requests. Reverse-reachability for VideoRequest.request_area_id, VideoRequest.agency_id, VideoRequest.submitting_officer_id and VideoRequest.auditor_officer_id."
    roles: [PlatformAdmin, AgencyAdmin, Officer]
    code: 200
    input: ["agency_id?", "request_area_id?", "submitting_officer_id?", "auditor_officer_id?", "lifecycle_state?", "compliance_state?", "limit?", "offset?"]
    output: VideoRequest[]
    side_effects: []

  # --- reads: ConsentSolicitation / SharedClip ---------------------------------
  - method: GET
    path: "/neighborhood-safety/consent-solicitations/{id}"
    description: "Read one consent solicitation, including its dispatch_rank, distance_sq_m2, respond_deadline_utc and notification suppression flags."
    roles: [PlatformAdmin, AgencyAdmin, Officer, Resident]
    code: 200
    input: []
    output: ConsentSolicitation
    side_effects: []

  - method: GET
    path: "/neighborhood-safety/consent-solicitations"
    description: "List consent solicitations in ascending dispatch_rank within a request. Reverse-reachability for ConsentSolicitation.video_request_id, ConsentSolicitation.device_id and ConsentSolicitation.resident_id — solicitations are only ever created as a submit-time cascade, so this is their sole discovery channel."
    roles: [PlatformAdmin, AgencyAdmin, Officer, Resident]
    code: 200
    input: ["video_request_id?", "device_id?", "resident_id?", "status?", "notification_suppressed?", "limit?", "offset?"]
    output: ConsentSolicitation[]
    side_effects: []

  - method: GET
    path: "/neighborhood-safety/shared-clips/{id}"
    description: "Read one shared clip, including which retention_variant produced its retention_expires_at."
    roles: [PlatformAdmin, AgencyAdmin, Officer, Resident]
    code: 200
    input: []
    output: SharedClip
    side_effects: []

  - method: GET
    path: "/neighborhood-safety/shared-clips"
    description: "List shared clips. Reverse-reachability for SharedClip.consent_solicitation_id, SharedClip.video_request_id, SharedClip.device_id and SharedClip.owner_resident_id."
    roles: [PlatformAdmin, AgencyAdmin, Officer, Resident]
    code: 200
    input: ["consent_solicitation_id?", "video_request_id?", "device_id?", "owner_resident_id?", "status?", "retention_variant?", "limit?", "offset?"]
    output: SharedClip[]
    side_effects: []

  # --- reads: ResidentPost / ModerationCase / TransparencyReport ---------------
  - method: GET
    path: "/neighborhood-safety/resident-posts/{id}"
    description: "Read one neighborhood post, including its discrimination_score, moderation state, revision_count and the three alert fan-out counters."
    roles: [PlatformAdmin, Moderator, Resident, Officer]
    code: 200
    input: []
    output: ResidentPost
    side_effects: []

  - method: GET
    path: "/neighborhood-safety/resident-posts"
    description: "List neighborhood posts. Reverse-reachability for ResidentPost.author_resident_id and the self-referential ResidentPost.parent_post_id."
    roles: [PlatformAdmin, Moderator, Resident, Officer]
    code: 200
    input: ["author_resident_id?", "parent_post_id?", "state?", "category?", "limit?", "offset?"]
    output: ResidentPost[]
    side_effects: []

  - method: GET
    path: "/neighborhood-safety/moderation-cases/{id}"
    description: "Read one moderation case, including the discrimination score snapshotted at open time and the segregation-of-duties user ids."
    roles: [PlatformAdmin, Moderator]
    code: 200
    input: []
    output: ModerationCase
    side_effects: []

  - method: GET
    path: "/neighborhood-safety/moderation-cases"
    description: "List moderation cases in ascending created_at. Reverse-reachability for ModerationCase.resident_post_id — cases auto-opened by the author-suspension cascade appear only here."
    roles: [PlatformAdmin, Moderator]
    code: 200
    input: ["resident_post_id?", "state?", "decision?", "opened_reason?", "limit?", "offset?"]
    output: ModerationCase[]
    side_effects: []

  - method: GET
    path: "/neighborhood-safety/transparency-reports/{id}"
    description: "Read one transparency report, including both share-rate branches and the published figure."
    roles: [PlatformAdmin, AgencyAdmin, Officer, Moderator, Resident]
    code: 200
    input: []
    output: TransparencyReport
    side_effects: []

  - method: GET
    path: "/neighborhood-safety/transparency-reports"
    description: "List transparency reports. Reverse-reachability for TransparencyReport.agency_id."
    roles: [PlatformAdmin, AgencyAdmin, Officer, Moderator, Resident]
    code: 200
    input: ["agency_id?", "variant?", "limit?", "offset?"]
    output: TransparencyReport[]
    side_effects: []

  # --- writes: Agency onboarding / enforcement ---------------------------------
  - method: POST
    path: "/neighborhood-safety/agencies"
    description: "Register a law-enforcement agency applicant. Lands in status PENDING_REVIEW; no officer may be attached and no area canvassed until onboarding review approves it."
    roles: [PlatformAdmin]
    code: 201
    input: [name, jurisdiction_code, "min_device_threshold?", "max_open_requests?", "period_request_quota?", "post_share_retention_days?", "justification_min_chars?"]
    output: Agency
    side_effects:
      - "creates the Agency with status = PENDING_REVIEW, version = 1, open_request_count = 0, requests_submitted_count = 0, latest_report_id = null"

  - method: POST
    path: "/neighborhood-safety/agencies/{id}/onboarding-review"
    description: "Record the platform's onboarding decision on a PENDING_REVIEW agency. APPROVE requires a signed onboarding_agreement_version and moves the agency to ONBOARDED; REJECT moves it to the terminal REJECTED status."
    roles: [PlatformAdmin]
    code: 200
    input: [decision, reviewer_note, "onboarding_agreement_version?"]
    output: Agency
    side_effects:
      - "sets Agency.status to ONBOARDED (decision == APPROVE) or REJECTED (decision == REJECT), stores reviewer_note and onboarding_agreement_version"
      - "increments Agency.version by 1"

  - method: POST
    path: "/neighborhood-safety/agencies/{id}/status-change"
    description: "Suspend, reinstate or revoke an onboarded agency. Suspension drives the four-level enforcement cascade over the agency's areas, requests, solicitations and dispatches; reinstatement re-opens the agency for new canvasses without resurrecting anything the suspension closed."
    roles: [PlatformAdmin]
    code: 200
    input: [target_status, reason]
    output: Agency
    side_effects:
      - "sets Agency.status = target_status and status_reason = reason"
      - "on target_status SUSPENDED (and, transitively, on the SUSPENDED -> REVOKED step, which has nothing left to cascade): CASCADE L1 every LOCKED RequestArea of this agency -> INVALIDATED with invalidated_reason = AGENCY_SUSPENDED; CASCADE L2 every VideoRequest in lifecycle_state SOLICITING or DRAFT on those areas -> WITHDRAWN with withdraw_reason = AGENCY_SUSPENDED; CASCADE L3 every SOLICITED ConsentSolicitation of those requests -> WITHDRAWN and Device.pending_solicitation_count decremented; CASCADE L4 Agency.open_request_count recomputed to 0"
      - "increments Agency.version by 1"

  - method: POST
    path: "/neighborhood-safety/officers"
    description: "Attach an officer to an ONBOARDED agency. duty_role fixes the segregation-of-duties capability: a REQUESTER may create and submit requests, an AUDITOR may clear or escalate them, and a DUAL_ROLE officer may do both but still never audits a request they submitted themselves."
    roles: [AgencyAdmin, PlatformAdmin]
    code: 201
    input: [agency_id, badge_number, full_name, "duty_role?"]
    output: Officer
    side_effects:
      - "creates the Officer with requests_submitted_count = 0 and audits_completed_count = 0"

  # --- writes: Resident account and data controls --------------------------------
  - method: POST
    path: "/neighborhood-safety/residents"
    description: "Self-register a resident account. Open to Anonymous because the account does not yet exist to authenticate against; the returned id is the X-User-ID for every later Resident-role call."
    roles: [Anonymous, PlatformAdmin]
    code: 201
    input: [display_name, email, home_x_m, home_y_m, "alert_radius_m?", "notification_budget_per_day?", "notification_mute_enabled?"]
    output: Resident
    side_effects:
      - "creates the Resident with status = ACTIVE, data_sharing_opt_out = false, fatigue_state = NORMAL, post_privilege_state = UNRESTRICTED and every counter at 0"

  - method: PATCH
    path: "/neighborhood-safety/residents/{id}/alert-settings"
    description: "Reconfigure alert radius and notification fatigue controls. Changing alert_radius_m changes which future posts may reach this resident but never rewrites the fan-out of posts already published."
    roles: [Resident]
    code: 200
    input: ["alert_radius_m?", "notification_budget_per_day?", "notification_mute_enabled?"]
    output: Resident
    side_effects:
      - "updates the supplied fields; omitted fields are left untouched"
      - "re-derives Resident.fatigue_state against the new notification_budget_per_day per calculations.notification_fatigue_budget"
      - "increments Resident.version by 1"

  - method: POST
    path: "/neighborhood-safety/residents/{id}/data-controls"
    description: "Exercise an account-level data control: OPT_OUT_OF_REQUESTS, OPT_IN_TO_REQUESTS, PURGE_HISTORY or DEACTIVATE_ACCOUNT. Each returns an immutable DataControlAction receipt carrying the exact number of rows it touched at every cascade level."
    roles: [Resident]
    code: 201
    input: [action_type, "reason?"]
    output: DataControlAction
    side_effects:
      - "OPT_OUT_OF_REQUESTS: CASCADE L1 sets Resident.data_sharing_opt_out = true; CASCADE L2 sets auto_decline_requests = true and auto_decline_source = OPT_OUT on every non-DECOMMISSIONED Device of this resident; CASCADE L3 transitions every SOLICITED ConsentSolicitation on those devices to DECLINED with decline_reason = OWNER_OPT_OUT in ascending created_at; CASCADE L4 recomputes each affected VideoRequest's counters and auto-transitions SOLICITING -> EXHAUSTED or FULFILLED when pending_count reaches 0; CASCADE L5 decrements Agency.open_request_count for every request that resolved"
      - "OPT_IN_TO_REQUESTS: sets data_sharing_opt_out = false and clears auto_decline_requests only on Devices whose auto_decline_source == OPT_OUT, leaving owner-set OWNER_MANUAL declines alone; resets auto_decline_source to NONE on exactly those devices"
      - "PURGE_HISTORY: transitions every RETAINED SharedClip of this resident to PURGED with purge_reason = OWNER_REVOCATION and cascades ConsentSolicitation SHARED -> WITHDRAWN where that was the solicitation's last non-PURGED clip"
      - "DEACTIVATE_ACCOUNT: sets Resident.status = DEACTIVATED, sets data_sharing_opt_out = true, DECOMMISSIONs every Device of this resident, transitions every SOLICITED solicitation to DECLINED with decline_reason = ACCOUNT_DEACTIVATED, and transitions every RETAINED SharedClip to PURGE_PENDING"
      - "writes affected_device_count, affected_solicitation_count, affected_clip_count and affected_request_count onto the receipt"
      - "increments Resident.version by 1"

  # --- writes: Device -----------------------------------------------------------
  - method: POST
    path: "/neighborhood-safety/devices"
    description: "Register a camera at a grid position. The camera becomes eligible for solicitation immediately unless the owner has opted out at the account level, in which case it is created already auto-declining."
    roles: [Resident]
    code: 201
    input: [owner_resident_id, label, grid_x_m, grid_y_m, "retention_window_days?", "auto_decline_requests?"]
    output: Device
    side_effects:
      - "creates the Device with status = ACTIVE and both solicitation counters at 0"
      - "when the owner has data_sharing_opt_out == true: forces auto_decline_requests = true and auto_decline_source = OPT_OUT regardless of the submitted value"
      - "when auto_decline_requests is submitted as true by an owner who has NOT opted out: sets auto_decline_source = OWNER_MANUAL"

  - method: PATCH
    path: "/neighborhood-safety/devices/{id}"
    description: "Update a camera's label, retention window, auto-decline posture or operational status. Decommissioning a camera deliberately does NOT resolve its open solicitations — they stay SOLICITED, refuse any share attempt, and are expired by the retention sweep at their deadline."
    roles: [Resident]
    code: 200
    input: ["label?", "retention_window_days?", "auto_decline_requests?", "status?"]
    output: Device
    side_effects:
      - "updates the supplied fields; omitted fields are left untouched"
      - "setting auto_decline_requests = true sets auto_decline_source = OWNER_MANUAL and excludes the device from FUTURE eligible-device sets only; already-dispatched solicitations are untouched"
      - "setting status = DECOMMISSIONED leaves every SOLICITED ConsentSolicitation on this device in place and leaves Device.pending_solicitation_count unchanged"
      - "increments Device.version by 1"

  # --- writes: RequestArea -------------------------------------------------------
  - method: POST
    path: "/neighborhood-safety/request-areas"
    description: "Define a geographic canvass area and the footage window being sought. Rejected when it repeat-canvasses a neighbourhood the same agency has already covered, using a 300 m proximity disc and a footage window extended by 24 hours AFTER its end but not before its start."
    roles: [Officer]
    code: 201
    input: [agency_id, center_x_m, center_y_m, radius_m, window_start_utc, window_end_utc, "area_label?"]
    output: RequestArea
    side_effects:
      - "creates the RequestArea with status = DRAFT, version = 1, eligible_device_count = 0, effective_min_devices = null, derived_request_count = 0"
      - "stamps created_by_officer_id from the acting X-User-ID"
      - "rejects with ERR_AREA_CANVASS_OVERLAP per validations[priority=38] when an asymmetrically buffered same-agency canvass already covers this ground and window"
      - "rejects with ERR_AREA_RADIUS_EXCEEDS_LIMIT when radius_m > AREA_MAX_RADIUS_M (1500)"

  - method: POST
    path: "/neighborhood-safety/request-areas/{id}/lock"
    description: "Freeze the area's eligible-device roster and minimum-device threshold. Locking is the only moment the roster is BUILT: a camera registered afterwards is never solicited, and a camera that later loses eligibility stays on the roster as long as the recomputed eligible count still clears effective_min_devices. Locking does not check the minimum-device threshold — that gate lives at submit time, so an area may legitimately lock with fewer devices than it will ever be allowed to canvass with."
    roles: [Officer]
    code: 200
    input: []
    output: RequestArea
    side_effects:
      - "runs calculations.eligible_device_set and writes eligible_device_count"
      - "runs calculations.effective_min_device_threshold and writes effective_min_devices"
      - "sets status = LOCKED and locked_at = the logical clock instant"
      - "increments RequestArea.version by 1"

  # --- writes: VideoRequest ------------------------------------------------------
  - method: POST
    path: "/neighborhood-safety/video-requests"
    description: "Create a draft video request against a LOCKED canvass area. Guarded by optimistic concurrency on the area's version (concurrency_rules[video-request-create-stale-area]) because each creation advances the area's derived_request_count."
    roles: [Officer]
    code: 201
    input: [request_area_id, case_number, expected_request_area_version]
    output: VideoRequest
    side_effects:
      - "creates the VideoRequest with lifecycle_state = DRAFT and compliance_state = JUSTIFICATION_PENDING, every solicitation counter at 0 and provisional_share_rate_bps = 0"
      - "copies agency_id from the RequestArea and stamps submitting_officer_id from the acting X-User-ID"
      - "increments RequestArea.derived_request_count by 1"
      - "increments RequestArea.version by 1"
      - "rejects with ERR_STALE_AREA_VERSION (412) when expected_request_area_version does not equal the current RequestArea.version"

  - method: POST
    path: "/neighborhood-safety/video-requests/{id}/justification"
    description: "Log the written justification and statutory basis for a draft request. Required before submission; the text must meet the agency's own justification_min_chars floor. A radius above 1000 m or a roster above 4 devices additionally flags the request for independent audit."
    roles: [Officer]
    code: 200
    input: [justification_text, statutory_basis]
    output: VideoRequest
    side_effects:
      - "stores justification_text and statutory_basis, sets justification_logged_at = the logical clock instant"
      - "moves compliance_state JUSTIFICATION_PENDING -> JUSTIFICATION_LOGGED, then immediately -> AUDIT_FLAGGED when RequestArea.radius_m > AUDIT_RADIUS_TRIGGER_M (1000) or RequestArea.eligible_device_count > AUDIT_DEVICE_TRIGGER (4)"
      - "leaves lifecycle_state untouched at DRAFT — the two dimensions advance independently"
      - "increments VideoRequest.version by 1"

  - method: POST
    path: "/neighborhood-safety/video-requests/{id}/submit"
    description: "Send the request to the area's device owners. This is the fan-out point: one ConsentSolicitation and one NotificationDispatch per eligible device, in the frozen roster order. Every business gate is checked here, in the validation priority order of §1.4 — area validity first, then the minimum-device threshold, then the agency's quotas last."
    roles: [Officer]
    code: 200
    input: []
    output: VideoRequest
    side_effects:
      - "runs calculations.agency_open_request_quota as the LAST gate; a quota breach never masks an earlier state or constraint failure"
      - "sets lifecycle_state = SOLICITING, submitted_at = the logical clock instant and expires_at = submitted_at + SOLICITATION_RESPONSE_HOURS (72h)"
      - "creates one ConsentSolicitation per device on the frozen roster, in ascending distance_sq then Device.created_at, writing dispatch_rank 1..N, distance_sq_m2 and respond_deadline_utc = expires_at"
      - "sets solicitation_count = pending_count = N and increments Device.solicitations_received_count and Device.pending_solicitation_count for each solicited device"
      - "creates one NotificationDispatch per solicitation with kind = CONSENT_REQUEST, batch_sequence_no in dispatch_rank order, and applies calculations.notification_fatigue_budget to decide suppression; a suppressed dispatch sets ConsentSolicitation.notification_suppressed = true and suppression_reason"
      - "increments Agency.open_request_count and Agency.requests_submitted_count by 1, and Officer.requests_submitted_count by 1"
      - "increments VideoRequest.version by 1"

  - method: POST
    path: "/neighborhood-safety/video-requests/{id}/withdraw"
    description: "Withdraw a soliciting request. Every unanswered solicitation is closed as WITHDRAWN rather than DECLINED, so a resident's silence is never recorded as a refusal, and clips already shared are retained under the retention window they were given at share time."
    roles: [Officer, AgencyAdmin]
    code: 200
    input: [reason]
    output: VideoRequest
    side_effects:
      - "sets lifecycle_state = WITHDRAWN and withdraw_reason = OFFICER_WITHDRAWAL"
      - "transitions every SOLICITED ConsentSolicitation of this request to WITHDRAWN in ascending dispatch_rank, moving pending_count into withdrawn_count and decrementing Device.pending_solicitation_count"
      - "decrements Agency.open_request_count by 1"
      - "recomputes provisional_share_rate_bps"
      - "increments VideoRequest.version by 1"

  - method: POST
    path: "/neighborhood-safety/video-requests/{id}/audit-review"
    description: "Record an independent officer's audit decision on a flagged request. CLEAR returns the request to ordinary handling; ESCALATE puts every clip shared from that point forward under legal hold with the CASE_ANCHORED retention branch. The auditing officer may never be the submitting officer."
    roles: [Officer]
    code: 200
    input: [decision, audit_note]
    output: VideoRequest
    side_effects:
      - "sets compliance_state = AUDIT_CLEARED (decision == CLEAR) or AUDIT_ESCALATED (decision == ESCALATE), stores audit_note and stamps auditor_officer_id from the acting X-User-ID"
      - "increments Officer.audits_completed_count by 1 for the auditing officer"
      - "leaves lifecycle_state untouched — a request may be audited while it is still soliciting"
      - "increments VideoRequest.version by 1"

  # --- writes: consent responses -------------------------------------------------
  - method: POST
    path: "/neighborhood-safety/consent-solicitations/{id}/share"
    description: "Voluntarily share a footage segment in response to a solicitation. Consent is per-camera and per-segment: one solicitation may cover several non-overlapping segments, and the resident's account-level opt-out outranks every scheduling or window consideration."
    roles: [Resident]
    code: 201
    input: [recorded_start_utc, duration_seconds]
    output: SharedClip
    side_effects:
      - "creates a SharedClip and runs calculations.clip_retention_expiry to set retention_variant, retention_expires_at and the clip's initial status (RETAINED, or LEGAL_HOLD on the CASE_ANCHORED branch)"
      - "on the first share for this solicitation: sets ConsentSolicitation.status = SHARED and responded_at, moves the solicitation from pending_count into shared_count on the VideoRequest, and decrements Device.pending_solicitation_count"
      - "on a subsequent share for an already-SHARED solicitation: leaves every consent counter alone and only increments clip counts"
      - "increments ConsentSolicitation.clip_count and VideoRequest.shared_clip_count by 1"
      - "increments Resident.lifetime_shared_footage_seconds and Resident.retained_footage_seconds by duration_seconds"
      - "recomputes VideoRequest.provisional_share_rate_bps; when pending_count reaches 0 the lifecycle dimension auto-transitions SOLICITING -> FULFILLED and Agency.open_request_count is decremented"
      - "increments ConsentSolicitation.version by 1"

  - method: POST
    path: "/neighborhood-safety/consent-solicitations/{id}/decline"
    description: "Decline a solicitation. A decline is a recorded answer and counts in the certified share-rate denominator, unlike silence that lapses into expiry."
    roles: [Resident]
    code: 200
    input: [decline_reason]
    output: ConsentSolicitation
    side_effects:
      - "sets status = DECLINED, decline_reason = OWNER_DECLINE and responded_at = the logical clock instant"
      - "moves the solicitation from pending_count into declined_count on the VideoRequest and decrements Device.pending_solicitation_count"
      - "recomputes VideoRequest.provisional_share_rate_bps; when pending_count reaches 0 the lifecycle dimension auto-transitions to FULFILLED (shared_count >= 1) or EXHAUSTED (shared_count == 0) and Agency.open_request_count is decremented"
      - "increments ConsentSolicitation.version by 1"

  # --- writes: retention ----------------------------------------------------------
  - method: POST
    path: "/neighborhood-safety/shared-clips/{id}/purge"
    description: "Delete a shared clip. The owner may revoke a RETAINED clip at any time; a LEGAL_HOLD clip can only be released by the platform with purge_reason LEGAL_RELEASE. Owner-initiated revocation of the last remaining clip also withdraws the underlying consent, while a retention-expiry purge does not."
    roles: [Resident, PlatformAdmin]
    code: 200
    input: [purge_reason]
    output: SharedClip
    side_effects:
      - "sets status = PURGED, purged_at = the logical clock instant and purge_reason"
      - "moves duration_seconds from Resident.retained_footage_seconds into Resident.purged_footage_seconds, leaving lifetime_shared_footage_seconds unchanged"
      - "when purge_reason IN {OWNER_REVOCATION, ACCOUNT_DEACTIVATED} and no non-PURGED clip remains for the solicitation: cascades ConsentSolicitation SHARED -> WITHDRAWN, moving one unit from VideoRequest.shared_count into withdrawn_count and recomputing provisional_share_rate_bps"
      - "increments SharedClip.version by 1"

  # --- writes: community feed and moderation ---------------------------------------
  - method: POST
    path: "/neighborhood-safety/resident-posts"
    description: "Publish a neighborhood safety post. The four classifier signals are scored on the spot: a post at or above the discrimination threshold never reaches the feed and never alerts anyone, it lands in FLAGGED awaiting moderation. A post below the threshold is published and fanned out to neighbours whose own alert radius covers the incident position."
    roles: [Resident]
    code: 201
    input: [author_resident_id, body, category, post_x_m, post_y_m, "parent_post_id?", "alert_fanout_cap?", "protected_class_term_count?", "unverified_assertion_count?", "location_profiling_count?", "hostile_tone_count?"]
    output: ResidentPost
    side_effects:
      - "runs calculations.post_discrimination_score and writes discrimination_score"
      - "sets state = PUBLISHED when the score is below DISCRIMINATION_FLAG_THRESHOLD, otherwise state = FLAGGED with auto_flag_reason = DISCRIMINATION_SCORE"
      - "only when the post lands in PUBLISHED: runs calculations.post_alert_fanout, writes alert_candidate_count / alert_fanout_count / alert_suppressed_count, and creates one NotificationDispatch per selected recipient with kind = POST_ALERT and batch_sequence_no in ranking order, applying calculations.notification_fatigue_budget for suppression"
      - "when the candidate pool is empty the post is still created with all three alert counters at 0 and no NotificationDispatch rows"
      - "creates the post with flag_count = 0, revision_count = 0 and flagged_by_resident_ids = []"

  - method: POST
    path: "/neighborhood-safety/resident-posts/{id}/flag"
    description: "Flag a published post as inaccurate or discriminatory. One resident may flag a given post once and may never flag their own post. The post only leaves PUBLISHED once the flag count reaches the resident-flag threshold."
    roles: [Resident]
    code: 200
    input: [flag_reason]
    output: ResidentPost
    side_effects:
      - "increments flag_count by 1 and appends the acting X-User-ID to flagged_by_resident_ids"
      - "transitions PUBLISHED -> FLAGGED with auto_flag_reason = RESIDENT_FLAG_THRESHOLD once flag_count reaches RESIDENT_FLAG_THRESHOLD (2); a first flag leaves the post PUBLISHED"
      - "increments ResidentPost.version by 1"

  - method: POST
    path: "/neighborhood-safety/resident-posts/{id}/revise"
    description: "Rewrite a post a moderator sent back for revision. The rewritten signals are re-scored: a clean rewrite returns to PUBLISHED and fans out afresh, a still-discriminatory rewrite drops back to FLAGGED for another moderation lap. Only MAX_REVISION_CYCLES laps are allowed."
    roles: [Resident]
    code: 200
    input: [body, "protected_class_term_count?", "unverified_assertion_count?", "location_profiling_count?", "hostile_tone_count?"]
    output: ResidentPost
    side_effects:
      - "replaces body and the four classifier signals, then re-runs calculations.post_discrimination_score"
      - "increments revision_count by 1"
      - "transitions REVISION_REQUESTED -> PUBLISHED (score below threshold, auto_flag_reason cleared) or REVISION_REQUESTED -> FLAGGED (score at or above threshold, auto_flag_reason = DISCRIMINATION_SCORE)"
      - "only on the PUBLISHED outcome: re-runs calculations.post_alert_fanout and rewrites the three alert counters, creating a fresh NotificationDispatch batch"
      - "increments ResidentPost.version by 1"

  - method: POST
    path: "/neighborhood-safety/moderation-cases"
    description: "Open a moderation case on a flagged or already-under-review post. A new case legitimately supersedes any open case on the same post, which is exactly why the write is guarded by optimistic concurrency on the post's version (concurrency_rules[moderation-case-open-stale-post])."
    roles: [Moderator]
    code: 201
    input: [resident_post_id, opened_reason, expected_resident_post_version]
    output: ModerationCase
    side_effects:
      - "creates the ModerationCase with state = OPEN, decision = NONE, opened_by_user_id = the acting X-User-ID, and post_discrimination_score_at_open snapshotted from the post"
      - "transitions any existing OPEN ModerationCase on the same post to SUPERSEDED, setting its superseded_by_case_created_at to the new case's created_at"
      - "transitions the ResidentPost FLAGGED -> UNDER_REVIEW, or leaves it in UNDER_REVIEW when it was already there"
      - "increments ResidentPost.version by 1"
      - "rejects with ERR_STALE_POST_VERSION (412) when expected_resident_post_version does not equal the current ResidentPost.version"

  - method: POST
    path: "/neighborhood-safety/moderation-cases/{id}/decide"
    description: "Decide a moderation case. A removal decision drives the five-level author-accountability cascade: strike, weighted score, privilege ladder, re-review of the author's other recent posts, and a system-opened case per swept post. The deciding moderator may never be the moderator who opened the case."
    roles: [Moderator]
    code: 200
    input: [decision, decision_note]
    output: ModerationCase
    side_effects:
      - "sets state = DECIDED, decision, decision_note, decided_by_user_id = the acting X-User-ID and decided_at = the logical clock instant"
      - "UPHELD_PUBLISH: transitions the post UNDER_REVIEW -> PUBLISHED, clears auto_flag_reason and runs the deferred calculations.post_alert_fanout"
      - "REQUEST_REVISION with revision_count < MAX_REVISION_CYCLES: transitions the post UNDER_REVIEW -> REVISION_REQUESTED"
      - "REQUEST_REVISION with revision_count >= MAX_REVISION_CYCLES, REMOVE_INACCURATE or REMOVE_DISCRIMINATORY: transitions the post UNDER_REVIEW -> REMOVED and runs the five-level author cascade — CASCADE L1 the matching strike counter on the author (REMOVE_DISCRIMINATORY increments discrimination_strike_count; REMOVE_INACCURATE and the over-limit REQUEST_REVISION both increment accuracy_strike_count), CASCADE L2 total_strike_score = accuracy_strike_count + 2 * discrimination_strike_count, CASCADE L3 post_privilege_state re-derived per calculations.strike_privilege_ladder, CASCADE L4 on reaching POSTING_SUSPENDED every other PUBLISHED post of that author created within RECENT_POST_LOOKBACK_DAYS (30) transitions to UNDER_REVIEW in ascending created_at with auto_flag_reason = AUTHOR_UNDER_REVIEW, CASCADE L5 one ModerationCase per swept post is auto-created in state OPEN with opened_reason = AUTHOR_SUSPENDED and opened_by_user_id = \"system\""
      - "increments ModerationCase.version by 1 and ResidentPost.version by 1"

  # --- writes: transparency reporting -----------------------------------------------
  - method: POST
    path: "/neighborhood-safety/transparency-reports"
    description: "Compile a request-volume and share-rate report over a reporting window. Both share-rate branches are computed at creation so the divergence between them is visible before certification; the provisional branch is the published figure until the report is certified. Guarded by optimistic concurrency on the agency's version (concurrency_rules[transparency-report-create-stale-agency])."
    roles: [PlatformAdmin]
    code: 201
    input: [agency_id, period_start_utc, period_end_utc, expected_agency_version]
    output: TransparencyReport
    side_effects:
      - "computes requests_submitted_count, solicitations_dispatched_count, suppressed_dispatch_count, shared_count, declined_count, expired_count, withdrawn_count, pending_count, opt_out_excluded_count and purged_clip_count over the window [period_start_utc, period_end_utc)"
      - "runs both branches of calculations.share_rate_bps into provisional_share_rate_bps and certified_share_rate_bps"
      - "sets variant = PROVISIONAL and published_share_rate_bps = provisional_share_rate_bps"
      - "stamps compiled_by_user_id from the acting X-User-ID"
      - "sets Agency.latest_report_id to the new report id and increments Agency.version by 1"
      - "rejects with ERR_STALE_AGENCY_VERSION (412) when expected_agency_version does not equal the current Agency.version"

  - method: POST
    path: "/neighborhood-safety/transparency-reports/{id}/certify"
    description: "Certify a provisional transparency report. Certification recomputes both branches over the same window and repoints the published figure at the certified branch, which excludes unresolved and undelivered solicitations from the denominator."
    roles: [PlatformAdmin]
    code: 200
    input: [certification_note]
    output: TransparencyReport
    side_effects:
      - "recomputes both branches of calculations.share_rate_bps"
      - "sets variant = CERTIFIED, published_share_rate_bps = certified_share_rate_bps, certification_note, certified_at = the logical clock instant and certified_by_user_id = the acting X-User-ID"
      - "increments TransparencyReport.version by 1"

  # --- writes: system / test-driving ------------------------------------------------
  - method: POST
    path: "/neighborhood-safety/retention-sweeps"
    description: "Run the retention sweep at the current logical clock instant. The sweep expires lapsed solicitations, purges clips whose retention window has closed, skips clips under legal hold however far past their nominal expiry, and auto-closes requests whose last solicitation has resolved. It is idempotent at a fixed clock: a second run at the same instant reports zeroes."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ run_at_utc: string, solicitations_expired_count: integer, clips_purged_count: integer, clips_held_count: integer, requests_auto_closed_count: integer }"
    side_effects:
      - "transitions every SOLICITED ConsentSolicitation whose respond_deadline_utc <= the logical clock instant to EXPIRED, in ascending respond_deadline_utc then created_at, moving pending_count into expired_count and decrementing Device.pending_solicitation_count"
      - "transitions every RETAINED SharedClip whose retention_expires_at <= the logical clock instant to PURGED with purge_reason = RETENTION_EXPIRED, moving duration_seconds from Resident.retained_footage_seconds into purged_footage_seconds and leaving the ConsentSolicitation in SHARED"
      - "transitions every PURGE_PENDING SharedClip to PURGED with purge_reason = ACCOUNT_DEACTIVATED regardless of retention_expires_at"
      - "counts every LEGAL_HOLD clip past its retention_expires_at into clips_held_count without touching it"
      - "auto-transitions every VideoRequest whose pending_count has reached 0 out of SOLICITING into FULFILLED (shared_count >= 1) or EXHAUSTED (shared_count == 0), decrementing Agency.open_request_count for each"
      - "increments the version of every entity it mutates by 1"

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every deadline, retention window and daily notification counter in this domain is measured against. The clock NEVER reads real wall-clock time: before the first call it reads exactly 2026-08-01T00:00:00Z, which sits at or before every default fixture instant. Advancing the clock across a UTC calendar-date boundary resets every Resident.notifications_sent_today to 0 and re-derives fatigue_state."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, residents_daily_counter_reset_count: integer }"
    side_effects:
      - "sets the logical clock to to_iso8601 (an ISO 8601 UTC instant); moving the clock backwards is permitted and performs no resets"
      - "when the UTC calendar date advances: sets Resident.notifications_sent_today = 0 for every resident with a non-zero counter, re-derives fatigue_state per calculations.notification_fatigue_budget, and reports how many residents were reset"
      - "performs no sweeping of its own — expiry and purging happen only when POST /neighborhood-safety/retention-sweeps is called"

# =============================================================================
# 1.6 ERROR CODE CATALOG
# Every code below is triggerable by at least one endpoint in §1.5.
# =============================================================================
errors:
  # --- auth ---------------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-Role header missing or not a recognised role, or X-User-ID missing/empty for a role other than Anonymous."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting X-Role is not listed in the endpoint's roles."
  - id: ERR_IDENTITY_MISMATCH
    http: 403
    condition: "An entity-backed role acts on a resource that is not its own — a resident touching another resident's device, solicitation, clip, post or settings, or an officer acting for another agency."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The same identity attempts both halves of a separated duty: auditing a request they submitted, deciding a moderation case they opened, or certifying a transparency report they created; or an officer without duty_role AUDITOR or DUAL_ROLE attempts an audit review."

  # --- existence ----------------------------------------------------------------
  - id: ERR_AGENCY_NOT_FOUND
    http: 404
    condition: "No Agency exists for the supplied path id or body agency_id."
  - id: ERR_OFFICER_NOT_FOUND
    http: 404
    condition: "No Officer exists for the supplied path id."
  - id: ERR_RESIDENT_NOT_FOUND
    http: 404
    condition: "No Resident exists for the supplied path id, owner_resident_id or author_resident_id."
  - id: ERR_DEVICE_NOT_FOUND
    http: 404
    condition: "No Device exists for the supplied path id."
  - id: ERR_REQUEST_AREA_NOT_FOUND
    http: 404
    condition: "No RequestArea exists for the supplied path id or body request_area_id."
  - id: ERR_VIDEO_REQUEST_NOT_FOUND
    http: 404
    condition: "No VideoRequest exists for the supplied path id."
  - id: ERR_SOLICITATION_NOT_FOUND
    http: 404
    condition: "No ConsentSolicitation exists for the supplied path id."
  - id: ERR_SHARED_CLIP_NOT_FOUND
    http: 404
    condition: "No SharedClip exists for the supplied path id."
  - id: ERR_POST_NOT_FOUND
    http: 404
    condition: "No ResidentPost exists for the supplied path id, body resident_post_id or body parent_post_id."
  - id: ERR_MODERATION_CASE_NOT_FOUND
    http: 404
    condition: "No ModerationCase exists for the supplied path id."
  - id: ERR_TRANSPARENCY_REPORT_NOT_FOUND
    http: 404
    condition: "No TransparencyReport exists for the supplied path id."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: required field missing or null, enum value out of range, integer outside its declared bounds, datetime not a valid ISO 8601 UTC instant, or duplicate resident email."

  # --- state --------------------------------------------------------------------
  - id: ERR_RESIDENT_DEACTIVATED
    http: 409
    condition: "The acting Resident has status DEACTIVATED and attempts any write."
  - id: ERR_AGENCY_NOT_ONBOARDED
    http: 409
    condition: "The Agency owning the resource is PENDING_REVIEW, SUSPENDED or REVOKED when an officer, area, request or report operation requires an ONBOARDED agency."
  - id: ERR_AGENCY_STATUS_TRANSITION_INVALID
    http: 409
    condition: "An onboarding review is submitted for an agency that is not PENDING_REVIEW, or a status-change target is not reachable from the agency's current status."
  - id: ERR_AREA_ALREADY_LOCKED
    http: 409
    condition: "A lock is attempted on a RequestArea whose status is not DRAFT."
  - id: ERR_AREA_NOT_LOCKED
    http: 409
    condition: "A VideoRequest is created against a RequestArea still in DRAFT, which has no frozen device roster and no effective_min_devices."
  - id: ERR_AREA_INVALIDATED
    http: 409
    condition: "A VideoRequest is submitted against a RequestArea that has since become INVALIDATED."
  - id: ERR_REQUEST_NOT_IN_DRAFT
    http: 409
    condition: "A justification or submit is attempted on a VideoRequest whose lifecycle_state is not DRAFT."
  - id: ERR_REQUEST_NOT_SOLICITING
    http: 409
    condition: "A withdrawal, share or decline is attempted while the owning VideoRequest is not in lifecycle_state SOLICITING."
  - id: ERR_JUSTIFICATION_NOT_LOGGED
    http: 409
    condition: "A submit is attempted while the VideoRequest's compliance_state is still JUSTIFICATION_PENDING."
  - id: ERR_AUDIT_NOT_PENDING
    http: 409
    condition: "An audit review is recorded on a VideoRequest whose compliance_state is not AUDIT_FLAGGED."
  - id: ERR_SOLICITATION_ALREADY_RESOLVED
    http: 409
    condition: "A share is attempted on a solicitation that is DECLINED, EXPIRED or WITHDRAWN, or a decline is attempted on a solicitation that is not SOLICITED."
  - id: ERR_DEVICE_DECOMMISSIONED
    http: 409
    condition: "A share is attempted from a Device whose status is no longer ACTIVE, even though the solicitation itself is still open."
  - id: ERR_CLIP_ALREADY_PURGED
    http: 409
    condition: "A purge is attempted on a SharedClip already in status PURGED."
  - id: ERR_CLIP_UNDER_LEGAL_HOLD
    http: 409
    condition: "A purge of a LEGAL_HOLD clip is attempted with a purge_reason other than LEGAL_RELEASE, or by a role other than PlatformAdmin."
  - id: ERR_POST_NOT_PUBLISHED
    http: 409
    condition: "A flag is attempted on a ResidentPost whose state is not PUBLISHED."
  - id: ERR_POST_NOT_FLAGGED
    http: 409
    condition: "A ModerationCase is opened on a ResidentPost whose state is neither FLAGGED nor UNDER_REVIEW."
  - id: ERR_CASE_ALREADY_DECIDED
    http: 409
    condition: "A decision is recorded on a ModerationCase whose state is DECIDED or SUPERSEDED."
  - id: ERR_POST_NOT_REVISABLE
    http: 409
    condition: "A revise is attempted on a ResidentPost whose state is not REVISION_REQUESTED."
  - id: ERR_REPORT_ALREADY_CERTIFIED
    http: 409
    condition: "A certification is attempted on a TransparencyReport whose variant is already CERTIFIED."
  - id: ERR_STALE_AREA_VERSION
    http: 412
    condition: "expected_request_area_version does not equal the current RequestArea.version at VideoRequest creation (concurrency_rules[video-request-create-stale-area])."
  - id: ERR_STALE_POST_VERSION
    http: 412
    condition: "expected_resident_post_version does not equal the current ResidentPost.version at ModerationCase creation (concurrency_rules[moderation-case-open-stale-post])."
  - id: ERR_STALE_AGENCY_VERSION
    http: 412
    condition: "expected_agency_version does not equal the current Agency.version at TransparencyReport creation (concurrency_rules[transparency-report-create-stale-agency])."

  # --- business: safety / consent ------------------------------------------------
  - id: ERR_RESIDENT_OPTED_OUT
    http: 409
    condition: "A share is attempted by a resident whose data_sharing_opt_out is true; the account-level refusal outranks every scheduling, window and quota consideration."
  - id: ERR_POSTING_SUSPENDED
    http: 409
    condition: "A post creation or revision is attempted by a resident whose post_privilege_state is POSTING_SUSPENDED."
  - id: ERR_JUSTIFICATION_TOO_SHORT
    http: 422
    condition: "justification_text is shorter than the agency's justification_min_chars after trimming, or statutory_basis is empty."
  - id: ERR_DATA_CONTROL_BLOCKED_BY_HOLD
    http: 409
    condition: "A PURGE_HISTORY or DEACTIVATE_ACCOUNT data control is attempted while the resident owns at least one SharedClip in status LEGAL_HOLD."

  # --- business: temporal ---------------------------------------------------------
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "window_start_utc >= window_end_utc, a RequestArea window_end_utc after the current logical clock instant, a RequestArea window longer than AREA_MAX_WINDOW_HOURS (168), or period_start_utc >= period_end_utc."
  - id: ERR_SOLICITATION_DEADLINE_PASSED
    http: 409
    condition: "A share or decline is attempted at or after ConsentSolicitation.respond_deadline_utc, even before the sweep has marked the solicitation EXPIRED."
  - id: ERR_CLIP_OUTSIDE_REQUEST_WINDOW
    http: 422
    condition: "The half-open clip interval is not fully contained in the RequestArea's closed footage window."

  # --- business: constraint -------------------------------------------------------
  - id: ERR_AREA_RADIUS_EXCEEDS_LIMIT
    http: 422
    condition: "radius_m exceeds AREA_MAX_RADIUS_M (1500)."
  - id: ERR_AREA_CANVASS_OVERLAP
    http: 409
    condition: "Another non-INVALIDATED RequestArea of the same agency sits within AREA_PROXIMITY_M (300 m) and its footage window, extended by 24 hours after its end only, intersects the new area's window."
  - id: ERR_MIN_DEVICE_THRESHOLD_NOT_MET
    http: 409
    condition: "RequestArea.eligible_device_count is below RequestArea.effective_min_devices at submit time."
  - id: ERR_DEVICE_WINDOW_CONFLICT
    http: 409
    condition: "The proposed half-open clip interval intersects the half-open interval of an existing non-PURGED SharedClip on the same Device; intervals that merely touch at an endpoint do not conflict."
  - id: ERR_SELF_FLAG_NOT_ALLOWED
    http: 409
    condition: "A resident flags their own post."
  - id: ERR_DUPLICATE_FLAG
    http: 409
    condition: "A resident flags a post they have already flagged."
  - id: ERR_DUPLICATE_DEVICE_LOCATION
    http: 409
    condition: "The same resident already owns a non-DECOMMISSIONED Device at exactly the submitted (grid_x_m, grid_y_m)."

  # --- business: fiscal / quota ----------------------------------------------------
  - id: ERR_AGENCY_OPEN_REQUEST_QUOTA_EXCEEDED
    http: 409
    condition: "Agency.open_request_count has reached Agency.max_open_requests at submit time."
  - id: ERR_AGENCY_PERIOD_QUOTA_EXCEEDED
    http: 409
    condition: "Agency.requests_submitted_count has reached Agency.period_request_quota at submit time."

# =============================================================================
# 1.7 RBAC MATRIX — segregation_of_duties role model
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operates the portal: onboards and disciplines agencies, certifies transparency reports, releases legal holds, and runs the retention sweep and logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /neighborhood-safety/agencies"
      - "POST /neighborhood-safety/agencies/{id}/onboarding-review"
      - "POST /neighborhood-safety/agencies/{id}/status-change"
      - "POST /neighborhood-safety/transparency-reports"
      - "POST /neighborhood-safety/transparency-reports/{id}/certify"
      - "POST /neighborhood-safety/retention-sweeps"
      - "POST /_clock/set_current_utc"
      - "purging a SharedClip in status LEGAL_HOLD with purge_reason LEGAL_RELEASE"
    shared_operations:
      - "POST /neighborhood-safety/officers (shared with AgencyAdmin)"
      - "POST /neighborhood-safety/residents (shared with Anonymous)"
      - "POST /neighborhood-safety/shared-clips/{id}/purge (shared with Resident, who may only purge RETAINED clips they own)"
      - "every GET endpoint"
    notes: "The PlatformAdmin that certifies a report may not be the X-User-ID that created it — certification is a separated duty even inside a single role."

  - name: AgencyAdmin
    description: "Administers one law-enforcement agency: attaches officers and withdraws requests on their behalf."
    identity: "entity_backed:Agency"
    exclusive_operations: []
    shared_operations:
      - "POST /neighborhood-safety/officers (shared with PlatformAdmin)"
      - "POST /neighborhood-safety/video-requests/{id}/withdraw (shared with Officer)"
      - "GET endpoints scoped to its own agency"
    notes: "X-User-ID is the Agency.id. An AgencyAdmin may never create a RequestArea, log a justification, submit a request or audit one — those are officer duties."

  - name: Officer
    description: "Sworn officer of an onboarded agency. duty_role splits the request duty from the audit duty."
    identity: "entity_backed:Officer"
    exclusive_operations:
      - "POST /neighborhood-safety/request-areas"
      - "POST /neighborhood-safety/request-areas/{id}/lock"
      - "POST /neighborhood-safety/video-requests"
      - "POST /neighborhood-safety/video-requests/{id}/justification"
      - "POST /neighborhood-safety/video-requests/{id}/submit"
      - "POST /neighborhood-safety/video-requests/{id}/audit-review"
    shared_operations:
      - "POST /neighborhood-safety/video-requests/{id}/withdraw (shared with AgencyAdmin)"
      - "read access to areas, requests, solicitations and shared clips of its own agency"
    notes: "X-User-ID is the Officer.id. duty_role REQUESTER may create/justify/submit but not audit; AUDITOR may audit but not submit; DUAL_ROLE may do both but never audits a request whose submitting_officer_id is itself."

  - name: Resident
    description: "Neighborhood resident and camera owner. Holds every consent, retention and account-level data control."
    identity: "entity_backed:Resident"
    exclusive_operations:
      - "PATCH /neighborhood-safety/residents/{id}/alert-settings"
      - "POST /neighborhood-safety/residents/{id}/data-controls"
      - "POST /neighborhood-safety/devices"
      - "PATCH /neighborhood-safety/devices/{id}"
      - "POST /neighborhood-safety/consent-solicitations/{id}/share"
      - "POST /neighborhood-safety/consent-solicitations/{id}/decline"
      - "POST /neighborhood-safety/resident-posts"
      - "POST /neighborhood-safety/resident-posts/{id}/flag"
      - "POST /neighborhood-safety/resident-posts/{id}/revise"
    shared_operations:
      - "POST /neighborhood-safety/shared-clips/{id}/purge (shared with PlatformAdmin)"
      - "read access to its own account, devices, solicitations, clips, dispatches and data-control receipts"
    notes: "X-User-ID is the Resident.id and must match the owner of every resource acted on. A DEACTIVATED resident may still read but may not write."

  - name: Moderator
    description: "Community moderator. Opens and decides moderation cases on flagged posts for accuracy and discrimination."
    identity: "opaque"
    exclusive_operations:
      - "POST /neighborhood-safety/moderation-cases"
      - "POST /neighborhood-safety/moderation-cases/{id}/decide"
    shared_operations:
      - "read access to residents, posts and moderation cases"
    notes: "X-User-ID is an opaque moderator identity, NOT an entity id. The moderator who opens a case may never decide it."

  - name: Anonymous
    description: "Unauthenticated caller. May only self-register a resident account."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /neighborhood-safety/residents (shared with PlatformAdmin)"
    notes: "The only endpoint exempt from the X-User-ID requirement, because the account being created is the identity."
