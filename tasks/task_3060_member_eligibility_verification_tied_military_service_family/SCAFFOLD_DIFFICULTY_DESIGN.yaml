              payload: { branch: "ARMY", component: "ACTIVE_DUTY", rank_grade: "E-5", service_start_date: "2009-01-01", service_end_date: "2015-01-01", discharge_characterization: "HONORABLE" }
              as: EligibilityApplicant
              captures: { sr_r: $.data.id }
            - call: "POST /membership/eligibility-cases/${case_r}/evidence"
              payload: { doc_type: "DD214", issuing_authority: "NPRC", issued_on: "2015-02-01", covers_service_record_id: "${sr_r}", content_hash: "z25" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${case_r}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${case_r}/record-reconstruction"
              payload: { decision: "APPROVE", decision_note: "verified" }
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/eligibility-cases/${case_r}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { mr: $.data.member_id }
            - call: "POST /membership/members/${mr}/addresses"
              payload: { addr_type: "DOMESTIC_RESIDENCE", line1: "1 First St", city: "Killeen", region_code: "TX", postal_code: "76541", country_code: "US", effective_from: "2026-01-01", effective_to: "2026-06-01" }
              as: Member
              as_user_id: "${mr}"
          trigger:
            - call: "POST /membership/members/${mr}/addresses"
              payload: { addr_type: "DOMESTIC_RESIDENCE", line1: "2 Second St", city: "Austin", region_code: "TX", postal_code: "78701", country_code: "US", effective_from: "2026-06-01" }
              as: Member
              as_user_id: "${mr}"
              captures: { addr2: $.data.id }
            - call: "POST /membership/members/${mr}/addresses"
              payload: { addr_type: "DOMESTIC_RESIDENCE", line1: "3 Third St", city: "Dallas", region_code: "TX", postal_code: "75201", country_code: "US", effective_from: "2026-05-31" }
              as: Member
              as_user_id: "${mr}"
              captures: { err_ovl: $.data.error_id }
          assert:
            - "Touching interval (effective_from == prior effective_to) accepted: AddressAssignment.${addr2} created with 201 (half-open boundary is exclusive)"
            - "One-day-overlapping interval rejected: error_id == ERR_ADDRESS_OVERLAP"

      - name: deployment_overlap_inclusive_adjacent_days_conflict
        grounds:
          - validations[priority=10]
          - entities.DeploymentOrder
        distinguishing_aspect: |
          DeploymentOrder resource with INCLUSIVE interval semantics — the
          opposite geometric treatment from addresses on a different resource
          entity: an order [2026-09-01, 2026-12-01] and a second order whose
          start_date == 2026-12-01 (the first order's end_date) CONFLICT
