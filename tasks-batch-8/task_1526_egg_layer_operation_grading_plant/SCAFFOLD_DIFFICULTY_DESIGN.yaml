# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Egg Layer Operation & Grading Plant. 9 rules x >=2 instances (19 total).
# All numeric literals pre-computed by executing the §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_pricing_market_index_vs_cost_plus
        grounds:
          - calculations.settlement_pricing
          - entities.RetailerContract.fields.pricing_model
          - entities.Settlement.fields.total_cents
        distinguishing_aspect: |
          Entity domain = Settlement/RetailerContract pricing. Two farms with byte-identical
          production economics (1000 hens, 240 eggs on 2026-07-20, 118 kg feed @ 50c/kg,
          12000c/day overhead, 420000c pullet cost) and identical lots (LARGE grade A, 20 dozen)
          differ ONLY in contract.pricing_model: MARKET_INDEX (index 140 + spread 5) prices the
          line at 145c/dozen -> total 2900c; COST_PLUS (margin 0.20 over ACTUAL_FIFO cpd 4845.00c)
          prices it at 5814c/dozen -> subtotal 116280c, 2% rebate 2326c, total 113954c.
        test_recipe:
          setup:
            - "Farm MI + Farm CP, each: one house, one LAYING flock (placed 2026-01-05, 1000 hens), one feed delivery (5000 kg @ 50c/kg on 2026-07-01), one production day 2026-07-20 (240 eggs, 0 rejects, 118 kg feed, 0 mortality), one confirmed grading run of 240 LARGE grade-A eggs -> one lot of 20 dozen"
            - "Each farm has one ACTIVE contract; the lot is RELEASED, ALLOCATED, and SHIPPED at clock 2026-07-24"
            - "MI contract: MARKET_INDEX spread 5, margin 0; CP contract: COST_PLUS margin 0.20, spread 0; both claim_required NONE, window [2026-01-01, 2026-12-31), max_open_dozen 1000"
          setup_api_calls:
            - call: "POST /api/farms"
              payload: { name: "MI Farm", certification_program: "CONVENTIONAL", daily_overhead_cents: 12000 }
              as: PlatformAdmin
              captures: { farm_mi: $.data.id }
            - call: "POST /api/farms"
              payload: { name: "CP Farm", certification_program: "CONVENTIONAL", daily_overhead_cents: 12000 }
              as: PlatformAdmin
              captures: { farm_cp: $.data.id }
            - call: "POST /api/houses"
              payload: { farm_id: "${farm_mi}", house_code: "H1", environment_type: "CAGED", capacity_hens: 2000 }
              as: FarmManager
              captures: { house_mi: $.data.id }
            - call: "POST /api/houses"
              payload: { farm_id: "${farm_cp}", house_code: "H1", environment_type: "CAGED", capacity_hens: 2000 }
              as: FarmManager
              captures: { house_cp: $.data.id }
            - call: "POST /api/flocks"
              payload: { house_id: "${house_mi}", breed_code: "HYLINE_BROWN", breed_peak_rate_pct: 95.0, placement_date: "2026-01-05", initial_hen_count: 1000, pullet_cost_cents: 420000 }
              as: FarmManager
              captures: { flock_mi: $.data.id }
            - call: "POST /api/flocks"
              payload: { house_id: "${house_cp}", breed_code: "HYLINE_BROWN", breed_peak_rate_pct: 95.0, placement_date: "2026-01-05", initial_hen_count: 1000, pullet_cost_cents: 420000 }
              as: FarmManager
              captures: { flock_cp: $.data.id }
            - call: "POST /api/ops/run-daily"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/feed-deliveries"
              payload: { farm_id: "${farm_mi}", delivered_at: "2026-07-01", quantity_kg: 5000, cost_per_kg_cents: 50 }
              as: FarmManager
            - call: "POST /api/feed-deliveries"
              payload: { farm_id: "${farm_cp}", delivered_at: "2026-07-01", quantity_kg: 5000, cost_per_kg_cents: 50 }
              as: FarmManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-24T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/production-days"
              payload: { flock_id: "${flock_mi}", lay_date: "2026-07-20", eggs_collected: 240, rejected_eggs: 0, feed_issued_kg: 118, mortality_count: 0 }
              as: FarmManager
            - call: "POST /api/production-days"
              payload: { flock_id: "${flock_cp}", lay_date: "2026-07-20", eggs_collected: 240, rejected_eggs: 0, feed_issued_kg: 118, mortality_count: 0 }
              as: FarmManager
            - call: "POST /api/grading-runs"
              payload: { flock_id: "${flock_mi}", grade: "A", eggs_to_grade: 240 }
              as: QualityGrader
              as_user_id: "grader-1"
              captures: { run_mi: $.data.id }
            - call: "POST /api/grading-runs"
              payload: { flock_id: "${flock_cp}", grade: "A", eggs_to_grade: 240 }
              as: QualityGrader
              as_user_id: "grader-1"
              captures: { run_cp: $.data.id }
            - call: "POST /api/grading-runs/${run_mi}/submit"
              payload: { peewee_count: 0, small_count: 0, medium_count: 0, large_count: 240, xlarge_count: 0, jumbo_count: 0, cracked_count: 0, dirty_count: 0, blood_spot_count: 0 }
              as: QualityGrader
              as_user_id: "grader-1"
            - call: "POST /api/grading-runs/${run_cp}/submit"
              payload: { peewee_count: 0, small_count: 0, medium_count: 0, large_count: 240, xlarge_count: 0, jumbo_count: 0, cracked_count: 0, dirty_count: 0, blood_spot_count: 0 }
              as: QualityGrader
              as_user_id: "grader-1"
            - call: "POST /api/grading-runs/${run_mi}/confirm"
              payload: {}
              as: QAManager
              as_user_id: "qa-1"
            - call: "POST /api/grading-runs/${run_cp}/confirm"
              payload: {}
              as: QAManager
              as_user_id: "qa-1"
            - call: "GET /api/lots?grading_run_id=${run_mi}"
              payload: {}
              as: QAManager
              captures: { lot_mi: "$.data[0].id" }
            - call: "GET /api/lots?grading_run_id=${run_cp}"
              payload: {}
              as: QAManager
              captures: { lot_cp: "$.data[0].id" }
            - call: "POST /api/contracts"
              payload: { farm_id: "${farm_mi}", retailer_name: "RetailCo", pricing_model: "MARKET_INDEX", spread_cents: 5, margin_pct: 0, claim_premium_pct: 0, claim_required: "NONE", effective_start: "2026-01-01", effective_end: "2026-12-31", weekly_min_dozen: 10, max_open_dozen: 1000 }
              as: ContractManager
              captures: { contract_mi: $.data.id }
            - call: "POST /api/contracts"
              payload: { farm_id: "${farm_cp}", retailer_name: "RetailCo", pricing_model: "COST_PLUS", spread_cents: 0, margin_pct: 0.20, claim_premium_pct: 0, claim_required: "NONE", effective_start: "2026-01-01", effective_end: "2026-12-31", weekly_min_dozen: 10, max_open_dozen: 1000 }
              as: ContractManager
              captures: { contract_cp: $.data.id }
            - call: "POST /api/contracts/${contract_mi}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /api/contracts/${contract_cp}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /api/lots/${lot_mi}/release"
              payload: {}
              as: QAManager
            - call: "POST /api/lots/${lot_cp}/release"
              payload: {}
              as: QAManager
            - call: "POST /api/lots/${lot_mi}/allocate"
              payload: { contract_id: "${contract_mi}" }
              as: ContractManager
            - call: "POST /api/lots/${lot_cp}/allocate"
              payload: { contract_id: "${contract_cp}" }
              as: ContractManager
            - call: "POST /api/lots/${lot_mi}/ship"
              payload: {}
              as: ContractManager
            - call: "POST /api/lots/${lot_cp}/ship"
              payload: {}
              as: ContractManager
            - call: "GET /api/contracts/${contract_mi}"
              payload: {}
              as: ContractManager
              captures: { cv_mi: $.data.version }
            - call: "GET /api/contracts/${contract_cp}"
              payload: {}
              as: ContractManager
              captures: { cv_cp: $.data.version }
            - call: "POST /api/settlements"
              payload: { contract_id: "${contract_mi}", period_start: "2026-07-20", period_end: "2026-07-26", market_index_cents: 140, expected_contract_version: "${cv_mi}" }
              as: ContractManager
              captures: { setl_mi: $.data.id }
            - call: "POST /api/settlements"
              payload: { contract_id: "${contract_cp}", period_start: "2026-07-20", period_end: "2026-07-26", expected_contract_version: "${cv_cp}" }
              as: ContractManager
              captures: { setl_cp: $.data.id }
          trigger:
            - call: "POST /api/settlements/${setl_mi}/finalize"
              payload: {}
              as: ContractManager
            - call: "POST /api/settlements/${setl_cp}/finalize"
              payload: {}
              as: ContractManager
          assert:
            - "Settlement.${setl_mi}.pricing_model_used == MARKET_INDEX; lines[0].price_cents_per_dozen == 145; lines[0].line_amount_cents == 2900; subtotal_cents == 2900; rebate_pct == 0; total_cents == 2900"
            - "Settlement.${setl_cp}.pricing_model_used == COST_PLUS; cost_per_dozen_cents == 4845.00; lines[0].price_cents_per_dozen == 5814; lines[0].line_amount_cents == 116280; subtotal_cents == 116280; rebate_pct == 0.02; rebate_cents == 2326; total_cents == 113954"
            - "Settlement.${setl_mi}.total_cents != Settlement.${setl_cp}.total_cents (identical lot shape and economics, variant-driven divergence)"

      - name: cost_per_dozen_actual_fifo_vs_projected_standard
        grounds:
          - calculations.cost_per_dozen
          - calculations.feed_fifo_costing
          - calculations.lay_curve_projection
        distinguishing_aspect: |
          Entity domain = Flock production economics (distinct from Settlement pricing in the
          sibling instance). Over the identical 7-day window 2026-06-22..2026-06-28, the
          ACTUAL_FIFO variant consumes recorded FIFO feed layers (826 kg all from the 50c/kg
          layer = 41300c) and actual eggs (6281) yielding 252.76c/dozen, while
          PROJECTED_STANDARD prices standard intake (997 hens x 115 g x 7 = 802.585 kg) at the
          LATEST delivery price (60c/kg -> 48155c) over lay-curve-projected eggs
          (997 x 95.00% x 7 = 6630) yielding 251.86c/dozen.
        test_recipe:
          setup:
            - "Farm (CONVENTIONAL, overhead 12000c/day); house; flock placed 2026-01-05 with 1000 hens, peak 95.0, pullet cost 420000c; clock advanced to 2026-06-28 and ops run done (flock LAYING, age 24 weeks)"
            - "Feed deliveries: D1 2026-06-01 5000 kg @ 50c/kg; D2 2026-06-20 4000 kg @ 60c/kg"
            - "Seven production days 2026-06-22..2026-06-28: eggs 890/895/892/900/898/901/905, rejects 10/8/9/10/7/8/9, feed 118 kg each, mortality 1/0/1/0/0/1/0 (total mortality 3 -> current_hen_count 997)"
          setup_api_calls:
            - call: "POST /api/farms"
              payload: { name: "Econ Farm", certification_program: "CONVENTIONAL", daily_overhead_cents: 12000 }
              as: PlatformAdmin
              captures: { farm_id: $.data.id }
            - call: "POST /api/houses"
              payload: { farm_id: "${farm_id}", house_code: "H1", environment_type: "CAGED", capacity_hens: 2000 }
              as: FarmManager
              captures: { house_id: $.data.id }
            - call: "POST /api/flocks"
              payload: { house_id: "${house_id}", breed_code: "HYLINE_BROWN", breed_peak_rate_pct: 95.0, placement_date: "2026-01-05", initial_hen_count: 1000, pullet_cost_cents: 420000 }
              as: FarmManager
              captures: { flock_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-28T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/ops/run-daily"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/feed-deliveries"
              payload: { farm_id: "${farm_id}", delivered_at: "2026-06-01", quantity_kg: 5000, cost_per_kg_cents: 50 }
              as: FarmManager
            - call: "POST /api/feed-deliveries"
              payload: { farm_id: "${farm_id}", delivered_at: "2026-06-20", quantity_kg: 4000, cost_per_kg_cents: 60 }
              as: FarmManager
            - call: "POST /api/production-days"
              payload: { flock_id: "${flock_id}", lay_date: "2026-06-22", eggs_collected: 890, rejected_eggs: 10, feed_issued_kg: 118, mortality_count: 1 }
              as: FarmManager
            - call: "POST /api/production-days"
              payload: { flock_id: "${flock_id}", lay_date: "2026-06-23", eggs_collected: 895, rejected_eggs: 8, feed_issued_kg: 118, mortality_count: 0 }
              as: FarmManager
            - call: "POST /api/production-days"
              payload: { flock_id: "${flock_id}", lay_date: "2026-06-24", eggs_collected: 892, rejected_eggs: 9, feed_issued_kg: 118, mortality_count: 1 }
              as: FarmManager
            - call: "POST /api/production-days"
              payload: { flock_id: "${flock_id}", lay_date: "2026-06-25", eggs_collected: 900, rejected_eggs: 10, feed_issued_kg: 118, mortality_count: 0 }
              as: FarmManager
            - call: "POST /api/production-days"
              payload: { flock_id: "${flock_id}", lay_date: "2026-06-26", eggs_collected: 898, rejected_eggs: 7, feed_issued_kg: 118, mortality_count: 0 }
              as: FarmManager
            - call: "POST /api/production-days"
              payload: { flock_id: "${flock_id}", lay_date: "2026-06-27", eggs_collected: 901, rejected_eggs: 8, feed_issued_kg: 118, mortality_count: 1 }
              as: FarmManager
            - call: "POST /api/production-days"
              payload: { flock_id: "${flock_id}", lay_date: "2026-06-28", eggs_collected: 905, rejected_eggs: 9, feed_issued_kg: 118, mortality_count: 0 }
              as: FarmManager
          trigger:
            - call: "GET /api/flocks/${flock_id}/economics?period_start=2026-06-22&period_end=2026-06-28&variant=ACTUAL_FIFO"
              payload: {}
              as: FarmManager
            - call: "GET /api/flocks/${flock_id}/economics?period_start=2026-06-22&period_end=2026-06-28&variant=PROJECTED_STANDARD"
              payload: {}
              as: FarmManager
          assert:
            - "ACTUAL_FIFO: cost_per_dozen_cents == 252.76; feed_cost_cents == 41300; overhead_cents == 84000; amortization_cents == 7000; spent_hen_credit_cents == 0; total_eggs == 6281; feed_conversion_ratio == 2.192"
            - "PROJECTED_STANDARD: cost_per_dozen_cents == 251.86; feed_cost_cents == 48155; total_eggs == 6630"
            - "252.76 != 251.86 — same flock, same window, two valid variants diverge"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: lay_curve_piecewise_age_cycle_state
        grounds:
          - calculations.lay_curve_projection
          - entities.Flock.fields.current_lay_rate_pct
          - state_machines.Flock.LAYING_to_MOLT_REST
          - state_machines.Flock.MOLT_REST_to_LAYING
        distinguishing_aspect: |
          Mode (a) — >= 3 inputs with non-linear interaction and a state branch: rate depends on
          age_weeks (piecewise ramp/plateau/decline-with-floor), lay_cycle (SECOND applies the
          0.85 post-molt factor), breed_peak_rate_pct, AND status (MOLT_REST forces 0.00).
          At age 60 FIRST cycle the rate is 52.25; during MOLT_REST it is 0.00; after resume at
          age 62 SECOND cycle it is 41.99 (95 x 0.52 x 0.85), not 49.40.
        test_recipe:
          setup:
            - "Farm; house; flock placed 2026-01-05 (peak 95.0); clock moved to 2027-03-01 (age exactly 60 weeks) and ops run done -> LAYING"
          setup_api_calls:
            - call: "POST /api/farms"
              payload: { name: "Curve Farm", certification_program: "CONVENTIONAL", daily_overhead_cents: 12000 }
              as: PlatformAdmin
              captures: { farm_id: $.data.id }
            - call: "POST /api/houses"
              payload: { farm_id: "${farm_id}", house_code: "H1", environment_type: "AVIARY", capacity_hens: 2000 }
              as: FarmManager
              captures: { house_id: $.data.id }
            - call: "POST /api/flocks"
              payload: { house_id: "${house_id}", breed_code: "HYLINE_BROWN", breed_peak_rate_pct: 95.0, placement_date: "2026-01-05", initial_hen_count: 800, pullet_cost_cents: 336000 }
              as: FarmManager
              captures: { flock_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/ops/run-daily"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "GET /api/flocks/${flock_id}"
              payload: {}
              as: FarmManager
            - call: "POST /api/flocks/${flock_id}/induce-molt"
              payload: {}
              as: FarmManager
            - call: "GET /api/flocks/${flock_id}"
              payload: {}
              as: FarmManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/flocks/${flock_id}/resume-lay"
              payload: {}
              as: FarmManager
            - call: "GET /api/flocks/${flock_id}"
              payload: {}
              as: FarmManager
          assert:
            - "At age_weeks == 60, status LAYING, lay_cycle FIRST: current_lay_rate_pct == 52.25"
            - "After induce-molt (status MOLT_REST): current_lay_rate_pct == 0.00 (state branch dominates)"
            - "After resume-lay at age_weeks == 62: lay_cycle == SECOND, molt_count == 1, current_lay_rate_pct == 41.99 (NOT the FIRST-cycle value 49.40)"

      - name: settlement_per_line_rounding_order
        grounds:
          - calculations.settlement_pricing
          - entities.Settlement.fields.lines
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: the scaffold pins round-per-line-FIRST
          (price_cents_per_dozen rounded to integer cents, then multiplied by dozen_count).
          A MEDIUM grade-A line: exact price 145 x (1 - 0.05 + 0.00) = 137.75c; round-first gives
          138c x 24 dozen = 3312c, while multiply-then-round gives round(137.75 x 24) = 3306c.
          The finalized settlement must show 3312c, not 3306c.
        test_recipe:
          setup:
            - "Farm (CONVENTIONAL); house; LAYING flock (placed 2026-01-05); production day 2026-07-20 with 288 eggs; confirmed run -> one MEDIUM grade-A lot of 24 dozen; ACTIVE MARKET_INDEX contract (index will be 140, spread 5); lot shipped at clock 2026-07-24"
          setup_api_calls:
            - call: "POST /api/farms"
              payload: { name: "Round Farm", certification_program: "CONVENTIONAL", daily_overhead_cents: 12000 }
              as: PlatformAdmin
              captures: { farm_id: $.data.id }
            - call: "POST /api/houses"
              payload: { farm_id: "${farm_id}", house_code: "H1", environment_type: "CAGED", capacity_hens: 2000 }
              as: FarmManager
              captures: { house_id: $.data.id }
            - call: "POST /api/flocks"
              payload: { house_id: "${house_id}", breed_code: "HYLINE_BROWN", breed_peak_rate_pct: 95.0, placement_date: "2026-01-05", initial_hen_count: 1000, pullet_cost_cents: 420000 }
              as: FarmManager
              captures: { flock_id: $.data.id }
            - call: "POST /api/ops/run-daily"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-24T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/production-days"
              payload: { flock_id: "${flock_id}", lay_date: "2026-07-20", eggs_collected: 288, rejected_eggs: 0, feed_issued_kg: 0, mortality_count: 0 }
              as: FarmManager
            - call: "POST /api/grading-runs"
              payload: { flock_id: "${flock_id}", grade: "A", eggs_to_grade: 288 }
              as: QualityGrader
              as_user_id: "grader-1"
              captures: { run_id: $.data.id }
            - call: "POST /api/grading-runs/${run_id}/submit"
              payload: { peewee_count: 0, small_count: 0, medium_count: 288, large_count: 0, xlarge_count: 0, jumbo_count: 0, cracked_count: 0, dirty_count: 0, blood_spot_count: 0 }
              as: QualityGrader
              as_user_id: "grader-1"
            - call: "POST /api/grading-runs/${run_id}/confirm"
              payload: {}
              as: QAManager
              as_user_id: "qa-1"
            - call: "GET /api/lots"
              payload: {}
              as: QAManager
              captures: { lot_id: "$.data[0].id" }
            - call: "POST /api/contracts"
              payload: { farm_id: "${farm_id}", retailer_name: "RetailCo", pricing_model: "MARKET_INDEX", spread_cents: 5, margin_pct: 0, claim_premium_pct: 0, claim_required: "NONE", effective_start: "2026-01-01", effective_end: "2026-12-31", weekly_min_dozen: 10, max_open_dozen: 1000 }
              as: ContractManager
              captures: { contract_id: $.data.id }
            - call: "POST /api/contracts/${contract_id}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /api/lots/${lot_id}/release"
              payload: {}
              as: QAManager
            - call: "POST /api/lots/${lot_id}/allocate"
              payload: { contract_id: "${contract_id}" }
              as: ContractManager
            - call: "POST /api/lots/${lot_id}/ship"
              payload: {}
              as: ContractManager
            - call: "GET /api/contracts/${contract_id}"
              payload: {}
              as: ContractManager
              captures: { cv: $.data.version }
            - call: "POST /api/settlements"
              payload: { contract_id: "${contract_id}", period_start: "2026-07-20", period_end: "2026-07-26", market_index_cents: 140, expected_contract_version: "${cv}" }
              as: ContractManager
              captures: { setl_id: $.data.id }
          trigger:
            - call: "POST /api/settlements/${setl_id}/finalize"
              payload: {}
              as: ContractManager
          assert:
            - "Settlement.${setl_id}.lines[0].price_cents_per_dozen == 138 (round_half_up(137.75) applied BEFORE multiplying)"
            - "Settlement.${setl_id}.lines[0].line_amount_cents == 3312 (NOT 3306, the multiply-then-round result)"
            - "Settlement.${setl_id}.subtotal_cents == 3312 and total_cents == 3312 (below rebate tiers)"

      - name: settlement_rebate_tier_keyed_on_pre_rebate_subtotal
        grounds:
          - calculations.settlement_pricing
          - entities.Settlement.fields.rebate_pct
          - entities.Settlement.fields.rebate_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order: the rebate tier is
          selected on the PRE-rebate subtotal, never on total_cents. Fixture subtotal is
          100920c (600 dozen LARGE A @145 = 87000; 80 dozen JUMBO A @174 = 13920): pre-rebate it
          clears the 100000c tier -> 2% -> rebate 2018c -> total 98902c. An implementation keying
          the tier on the post-rebate total (98902 < 100000) would wrongly apply 0%.
        test_recipe:
          setup:
            - "Farm (CONVENTIONAL); house; LAYING flock; production day 2026-07-20 with 8160 eggs; confirmed run (7200 LARGE + 960 JUMBO, grade A) -> JUMBO lot 80 dozen + LARGE lot 600 dozen; both lots shipped at clock 2026-07-24 to an ACTIVE MARKET_INDEX contract (max_open_dozen 1000)"
          setup_api_calls:
            - call: "POST /api/farms"
              payload: { name: "Rebate Farm", certification_program: "CONVENTIONAL", daily_overhead_cents: 12000 }
              as: PlatformAdmin
              captures: { farm_id: $.data.id }
            - call: "POST /api/houses"
              payload: { farm_id: "${farm_id}", house_code: "H1", environment_type: "CAGED", capacity_hens: 2000 }
              as: FarmManager
              captures: { house_id: $.data.id }
