        distinguishing_aspect: "The model is immediate, so there is no read-after-write lag anywhere in the booking cascade: the response to the second booking already carries its own slot_index 1, and the very next read of the earlier-created appointment shows its index re-derived to 2 - a reindex of a row the caller never named, visible with no intervening call."
