      - name: new_plan_supersedes_the_prior_plan_for_the_same_project
        claim_type: cascading_side_effects
        grounds:
          - state_machines.CxPlan.APPROVED_to_SUPERSEDED
          - endpoints[POST /cx-plans]
          - entities.CxPlan.fields.status
        distinguishing_aspect: "Creating a second plan flips every prior plan of the project to SUPERSEDED in the same request, so the project ends with exactly one non-superseded plan and the newest one is DRAFT."
