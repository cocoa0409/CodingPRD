            - "Enrollment.${enrollment_5_id}.final_commission_cents == 300.00, the single as-earned month billed to a rapid-disenrolled row"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: non_linear_complaint_appeal_cycle_round_trip
        grounds:
          - state_machines.Complaint.transitions.APPEALED_to_UNDER_REVIEW
          - state_machines.Complaint.transitions.SUBSTANTIATED_to_APPEALED
          - state_machines.Complaint.transitions.APPEALED_to_DISMISSED
          - entities.Agent.fields.substantiated_complaint_count
        distinguishing_aspect: "The Complaint machine is cyclic, not a pipeline: SUBSTANTIATED to APPEALED to UNDER_REVIEW to SUBSTANTIATED is a full reachable round trip, so one complaint raises Agent.substantiated_complaint_count from 1 to 2 and the separate APPEALED to DISMISSED edge lowers it back, which no single acyclic ordering of this machine's states can express."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the shared anchor chain through &d_complete so the agency has one COMPLETED call in its denominator, plus one MISREPRESENTATION complaint filed by the compliance officer three days before."
          setup_api_calls:
            - *d_clock
            - *d_agency
            - *d_carrier_a
            - *d_plan_a
            - *d_drug_a
            - *d_prov_a
            - *d_agent
            - *d_lic
            - *d_cert
            - *d_appt
            - *d_member
            - *d_member_two
            - *d_soa
            - *d_call
            - *d_connect
            - *d_complete
            - &c_complaint
              call: "POST /complaints"
              payload: { agent_id: "${agent_id}", complaint_type: "MISREPRESENTATION", source: "BENEFICIARY", severity: "HIGH", filed_on: "2026-09-28T00:00:00Z" }
              as: ComplianceOfficer
              captures: { complaint_id: $.data.id }
            - call: "POST /complaints/${complaint_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /complaints/${complaint_id}/substantiate"
              payload: {}
              as: ComplianceOfficer
              captures: { coaching_first: $.data.finding_code }
          trigger:
            - call: "POST /complaints/${complaint_id}/appeal"
              payload: { appeal_note: "Agent asserts the plan type was inside the captured scope" }
              as: CarrierIntegration
            - call: "POST /complaints/${complaint_id}/remand"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /complaints/${complaint_id}/substantiate"
              payload: {}
              as: ComplianceOfficer
              captures: { finding_second: $.data.finding_code }
          assert:
            - "after the first substantiation Agent.${agent_id}.substantiated_complaint_count == 1 and the first finding_code == MARKETING_VIOLATION"
            - "POST /complaints/${complaint_id}/appeal returns 200 and Complaint.${complaint_id}.status == APPEALED"
            - "POST /complaints/${complaint_id}/remand returns 200 and Complaint.${complaint_id}.status == UNDER_REVIEW"
            - "the second substantiation returns 200 — the cycle is a genuine round trip — and Agent.${agent_id}.substantiated_complaint_count == 2"
            - "GET /agents/${agent_id}/coaching-assignments returns exactly 2 rows and Agent.${agent_id}.open_coaching_count == 2"
            - "POST /complaints/${complaint_id}/appeal again returns 200 and then POST /complaints/${complaint_id}/dismiss returns 200 with Agent.${agent_id}.substantiated_complaint_count == 1"

      - name: non_linear_enrollment_parallel_state_dimensions
        grounds:
          - state_machines.Enrollment.transitions.SUBMITTED_to_WITHDRAWN
          - state_machines.Enrollment.transitions.ENROLLED_to_RAPID_DISENROLLED
          - entities.Enrollment.fields.submission_status
          - entities.Enrollment.fields.disenrollment_status
        distinguishing_aspect: "The Enrollment carries two independent state dimensions on one row: submission_status walks SUBMITTED to ACKNOWLEDGED to EFFECTUATED while disenrollment_status walks NOT_APPLICABLE to ENROLLED to RAPID_DISENROLLED, so the pair (EFFECTUATED, RAPID_DISENROLLED) is reachable while (WITHDRAWN, ENROLLED) is not — no single linear enumeration of the row's twelve states can express the reachable set."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the shared anchor chain through &d_enroll, then acknowledged and effectuated so the row holds the pair (EFFECTUATED, ENROLLED)."
          setup_api_calls:
            - *d_clock
            - *d_agency
            - *d_carrier_a
            - *d_plan_a
            - *d_drug_a
            - *d_prov_a
            - *d_agent
            - *d_lic
            - *d_cert
            - *d_appt
            - *d_member
            - *d_member_two
            - *d_soa
            - *d_call
            - *d_connect
            - *d_complete
            - *d_enroll
            - call: "POST /enrollments/${enrollment_id}/acknowledge"
              payload: { carrier_id: "${carrier_a_id}" }
              as: CarrierIntegration
            - call: "POST /enrollments/${enrollment_id}/effectuate"
              payload: {}
              as: CarrierIntegration
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /enrollments/${enrollment_id}/disenroll"
              payload: { disenrollment_date: "2026-11-16T00:00:00Z", disenrollment_reason: "MOVED_OUT_OF_SERVICE_AREA" }
              as: CarrierIntegration
            - call: "POST /enrollments/${enrollment_id}/withdraw"
              payload: { reason: "BENEFICIARY_CHANGED_MIND" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { withdraw_error: $.data.error_id }
          assert:
            - "GET /enrollments/${enrollment_id} reports submission_status == EFFECTUATED and disenrollment_status == RAPID_DISENROLLED on the same row"
            - "Enrollment.${enrollment_id}.disenrolled_day_number == 15 and is_rapid_disenrollment == true"
            - "the withdrawal returns 409 with withdraw_error == ERR_ENROLLMENT_NOT_WITHDRAWABLE, because the withdrawal edge exists only from SUBMITTED, ACKNOWLEDGED and REJECTED"
            - "Plan.${plan_a_id}.enrolled_member_count == 0 and Agent.${agent_id}.active_enrollment_count == 0, so the disenrollment dimension moved the counts while submission_status stayed EFFECTUATED"
            - "the pair (WITHDRAWN, ENROLLED) is unreachable: no declared transition writes submission_status back from EFFECTUATED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: cascade_overdue_coaching_restricts_agency_and_drops_live_call
        grounds:
          - state_machines.CoachingAssignment.transitions.ASSIGNED_to_OVERDUE
          - state_machines.Agency.transitions.OPEN_to_RESTRICTED
          - state_machines.Agent.transitions.ACTIVE_to_SUSPENDED
          - state_machines.CallSession.transitions.IN_PROGRESS_to_DROPPED
        distinguishing_aspect: "A depth-4 chain from one trigger: the posture recompute reads the coaching assignment as overdue, which mutates that assignment to OVERDUE, which itself forces the agency posture recomputation to RESTRICTED, which itself suspends the agent, which itself drops that agent's live call — each hop caused by the previous one, not by the original request."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the shared anchor chain plus a manual SOA_RETRAINING coaching assignment created 2026-10-01, so due_on is 2026-10-15. No complaint exists, so the agency posture is OPEN and the agent is ACTIVE."
            - "A live call session of that agent is connected and left IN_PROGRESS."
          setup_api_calls:
            - *d_clock
            - *d_agency
            - *d_carrier_a
            - *d_plan_a
            - *d_drug_a
            - *d_prov_a
            - *d_agent
            - *d_lic
            - *d_cert
            - *d_appt
            - *d_member
            - *d_member_two
            - &c_coaching
              call: "POST /coaching-assignments"
              payload: { agent_id: "${agent_id}", coaching_type: "SOA_RETRAINING" }
              as: Coach
              captures: { coaching_id: $.data.id }
            - *d_soa_two
            - &c_call_two
              call: "POST /call-sessions"
              payload: { agent_id: "${agent_id}", member_id: "${member_two_id}", scope_of_appointment_id: "${soa_two_id}", started_at: "2026-10-01T10:00:00Z", scheduled_end_at: "2026-10-01T10:30:00Z", recording_id: "REC-1002", disclaimer_script_code: "CMS-DISC-2026", disclaimer_delivered: true, marketing_rule_set_version: "MKT-2026-V3" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { call_two_id: $.data.id }
            - call: "POST /call-sessions/${call_two_id}/connect"
              payload: { disclaimer_delivered: true, plan_type_discussed: "MAPD", recording_id: "REC-1002", disclaimer_script_code: "CMS-DISC-2026", marketing_rule_set_version: "MKT-2026-V3" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_maintenance/recompute-compliance-posture"
              payload: { agency_id: "${agency_id}" }
              as: PlatformAdmin
              captures: { posture_after: $.data.compliance_posture }
          assert:
            - "before the trigger GET /agencies/${agency_id} reports compliance_posture == OPEN and GET /agents/${agent_id} reports status == ACTIVE"
            - "hop 1: GET /coaching-assignments/${coaching_id} reports status == OVERDUE with overdue_days == 1, because due_on was 2026-10-15 and the clock now reads 2026-10-16"
            - "hop 2: the recompute returns 200 and Agency.${agency_id}.compliance_posture == RESTRICTED — the overdue coaching alone crosses the posture branch with substantiated_complaint_rate 0.000000"
            - "hop 3: GET /agents/${agent_id} reports status == SUSPENDED and live_call_count == 0"
            - "hop 4: GET /call-sessions/${call_two_id} reports status == DROPPED with actual_end_at == 2026-10-16T00:00:00Z"
            - "the hops are ordered and not a fan-out: the RESTRICTED branch is only reachable because hop 1 produced overdue_days >= 1, and the call drop is produced by hop 3's suspension, not by the clock move or the recompute call itself"

      - name: cascade_withdrawal_reversal_moves_reconciliation_variance
        grounds:
          - state_machines.Enrollment.transitions.SUBMITTED_to_WITHDRAWN
          - calculations.commission_ledger_entry
          - calculations.carrier_reconciliation_variance
          - state_machines.CarrierReconciliation.transitions.OPEN_to_DISPUTED
        distinguishing_aspect: "A depth-2 money cascade on a different triggering transition: withdrawing the enrollment posts a REVERSAL ledger entry, and that posting itself recomputes the carrier's reconciliation internal_total_cents and variance_cents, moving the variance from 1400.00 to 5000.00 so the OPEN period's dispute edge becomes reachable — the reconciliation was never touched by the withdraw request."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the shared anchor chain through &d_enroll, then a reconciliation period opened for carrier Meridian at 2026-10 with a carrier-reported total of 5000, so internal_total_cents is 3600.00 and variance_cents is 1400.00."
          setup_api_calls:
            - *d_clock
            - *d_agency
            - *d_carrier_a
            - *d_plan_a
            - *d_drug_a
            - *d_prov_a
            - *d_agent
            - *d_lic
            - *d_cert
            - *d_appt
            - *d_member
            - *d_member_two
            - *d_soa
            - *d_call
            - *d_connect
            - *d_complete
            - *d_enroll
            - &c_recon
              call: "POST /carrier-reconciliations"
              payload: { carrier_id: "${carrier_a_id}", period_month: "2026-10", carrier_reported_total_cents: 5000, internal_total_variant: "PROVISIONAL" }
              as: DirectorOfSales
              captures: { recon_id: $.data.id, recon_variance_before: $.data.variance_cents }
          trigger:
            - call: "POST /enrollments/${enrollment_id}/withdraw"
              payload: { reason: "BENEFICIARY_CHANGED_MIND" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
          assert:
            - "before the trigger GET /carrier-reconciliations/${recon_id} reports internal_total_cents == 3600.00 and variance_cents == 1400.00 under the PROVISIONAL variant"
            - "hop 1: the withdraw returns 200 and Enrollment.${enrollment_id}.submission_status == WITHDRAWN, with a REVERSAL entry of amount_cents == -3600.00 in GET /commission-ledger-entries?enrollment_id=${enrollment_id}"
            - "hop 2: GET /carrier-reconciliations/${recon_id} now reports internal_total_cents == 0.00 — the INITIAL 3600.00 and its REVERSAL -3600.00 net out"
            - "hop 2: variance_cents == 5000.00, changed from the 1400.00 captured before the withdrawal, so the reversal posting itself recomputed the period"
            - "POST /carrier-reconciliations/${recon_id}/dispute now returns 200 and sets status == DISPUTED, because the recomputed variance is no longer zero"
            - "Agent.${agent_id}.chargeback_tier == 1 — the withdrawal, not a disenrollment, drove the tier"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: priority_conflict_scope_safety_beats_agent_appointment_safety
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors.ERR_SCOPE_OF_APPOINTMENT_MISSING
          - errors.ERR_AGENT_NOT_APPOINTED
        distinguishing_aspect: "The business_safety versus business_safety pair: with the scope voided AND the agent never appointed, the submission answers ERR_SCOPE_OF_APPOINTMENT_MISSING at 422 rather than ERR_AGENT_NOT_APPOINTED at 422, because priority 6 is evaluated before priority 11."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Agency, carrier, plan, member and agent exist; the agent holds a TX license and a MAPD certification but has NO carrier appointment, so Agent.status is CERTIFIED."
            - "A call session was created and completed while the scope was usable, and the compliance officer then voided that scope."
          setup_api_calls:
            - *d_clock
            - *d_agency
            - *d_carrier_a
            - *d_plan_a
            - *d_drug_a
            - *d_prov_a
            - *d_agent
            - *d_lic
            - *d_cert
            - *d_member
            - *d_member_two
            - *d_soa
            - *d_call
            - *d_connect
            - *d_complete
            - call: "POST /scope-of-appointments/${soa_id}/void"
              payload: { reason: "Beneficiary revoked the scope before election" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /enrollments"
              payload: { call_session_id: "${call_id}", member_id: "${member_id}", plan_id: "${plan_a_id}", agent_id: "${agent_id}", scope_of_appointment_id: "${soa_id}", effective_date: "2026-11-01T00:00:00Z", plan_type_discussed: "MAPD", expected_call_session_version: "${call_v1}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the request returns 422 and error_id == ERR_SCOPE_OF_APPOINTMENT_MISSING"
            - "error_id != ERR_AGENT_NOT_APPOINTED even though Agent.${agent_id}.status is CERTIFIED and appointed_carrier_count == 0"
            - "GET /enrollments?agent_id=${agent_id}&call_session_id=${call_id} returns 0 rows"
            - "GET /agents/${agent_id}/appointments returns 0 rows, confirming the second violation was really present"

      - name: priority_conflict_scope_safety_beats_call_state
        grounds:
          - validations[priority=6]
          - validations[priority=16]
          - errors.ERR_SCOPE_OF_APPOINTMENT_MISSING
          - errors.ERR_CALL_NOT_IN_PROGRESS
        distinguishing_aspect: "The business_safety versus state pair, deliberately a different category pair from the first instance and landing on a different HTTP status: connecting a DROPPED call whose scope was voided answers ERR_SCOPE_OF_APPOINTMENT_MISSING at 422, never ERR_CALL_NOT_IN_PROGRESS at 409."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the shared anchor chain with one completed call and a second call that was connected and then dropped, so that second call sits in DROPPED."
            - "The compliance officer then voids the scope the second call is attached to."
          setup_api_calls:
            - *d_clock
            - *d_agency
            - *d_carrier_a
            - *d_plan_a
            - *d_drug_a
            - *d_prov_a
            - *d_agent
            - *d_lic
            - *d_cert
            - *d_appt
            - *d_member
            - *d_member_two
            - *d_soa
            - *d_call
            - *d_connect
            - *d_complete
            - &f_call_two
              call: "POST /call-sessions"
              payload: { agent_id: "${agent_id}", member_id: "${member_id}", scope_of_appointment_id: "${soa_id}", started_at: "2026-10-01T10:00:00Z", scheduled_end_at: "2026-10-01T10:30:00Z", recording_id: "REC-1005", disclaimer_script_code: "CMS-DISC-2026", disclaimer_delivered: true, marketing_rule_set_version: "MKT-2026-V3" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { call_two_id: $.data.id }
            - call: "POST /call-sessions/${call_two_id}/connect"
              payload: { disclaimer_delivered: true, plan_type_discussed: "MAPD", recording_id: "REC-1005", disclaimer_script_code: "CMS-DISC-2026", marketing_rule_set_version: "MKT-2026-V3" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
            - call: "POST /call-sessions/${call_two_id}/drop"
              payload: { reason: "CALLER_HUNG_UP" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
            - call: "POST /scope-of-appointments/${soa_id}/void"
              payload: { reason: "Beneficiary revoked the scope before election" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /call-sessions/${call_two_id}/connect"
              payload: { disclaimer_delivered: true, plan_type_discussed: "MAPD", recording_id: "REC-1005", disclaimer_script_code: "CMS-DISC-2026", marketing_rule_set_version: "MKT-2026-V3" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the connect returns 422 and error_id == ERR_SCOPE_OF_APPOINTMENT_MISSING"
            - "error_id != ERR_CALL_NOT_IN_PROGRESS even though GET /call-sessions/${call_two_id} reports status == DROPPED"
            - "the 422 rather than 409 status is observable: the higher-priority business_safety row owns the response code"
            - "GET /call-sessions/${call_two_id} still reports status == DROPPED with actual_end_at unchanged and version unchanged"

