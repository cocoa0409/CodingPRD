  - section: errors
    instances:
      - name: error_provenance_not_documented_on_list
        claim_type: violation_to_error
        grounds: ["errors[ERR_PROVENANCE_NOT_DOCUMENTED]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / list_referential_beats_temporal"
          rationale: "The referential provenance failure is asserted as the winning error of that §1.8 priority-pair instance."
      - name: error_locker_capacity_exceeded_on_bottle_create
        claim_type: violation_to_error
        grounds: ["errors[ERR_LOCKER_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / locker_capacity_exact_boundary"
          rationale: "Capacity-exceeded at the free_bottles==0 boundary is asserted by that §1.8 instance."
      - name: error_courier_slot_conflict_on_delivery
        claim_type: violation_to_error
        grounds: ["errors[ERR_COURIER_SLOT_CONFLICT]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / courier_slot_half_open_overlap"
          rationale: "The half-open courier overlap rejection is asserted by that §1.8 instance."
      - name: error_maintenance_window_conflict_on_schedule
        claim_type: violation_to_error
        grounds: ["errors[ERR_MAINTENANCE_WINDOW_CONFLICT]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / maintenance_window_closed_buffer_overlap"
          rationale: "The closed-interval-plus-buffer maintenance overlap rejection is asserted by that §1.8 instance."
      - name: error_bottle_not_stored_on_list
        claim_type: violation_to_error
        grounds: ["errors[ERR_BOTTLE_NOT_STORED]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / list_requires_bottle_stored"
          rationale: "Listing a non-STORED (CONSIGNED) bottle failing is asserted by that §1.8 instance."
      - name: error_member_not_active_on_assign
        claim_type: violation_to_error
        grounds: ["errors[ERR_MEMBER_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / assign_requires_member_active"
          rationale: "Assigning a locker to a non-ACTIVE member failing is asserted by that §1.8 instance."

