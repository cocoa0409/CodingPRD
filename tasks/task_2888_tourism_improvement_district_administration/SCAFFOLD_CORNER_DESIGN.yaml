            - "AssessmentPeriod.${ap_id}.status is still CLOSED after the refusal"
            - "AssessmentStatement.${st1_id}.payment_status is still UNPAID and penalty_cents == 0 and interest_cents == 0"
            - "District.${d_id}.delinquent_charges_cents == 0 after the refusal"
            - "LodgingBusiness.${b1_id}.delinquency_strike_count == 0 and compliance_standing == GOOD after the refusal"
            - "the sweep at 2026-11-26T00:00:00Z returns 200 and AssessmentPeriod.${ap_id}.status == DELINQUENCY_SWEPT"
            - "AssessmentStatement.${st1_id}.interest_cents == 412, the one-day figure"
            - "AssessmentStatement.${st1_id}.penalty_cents == 82450 and payment_status == DELINQUENT and delinquency_stage == NOTICE"
            - "LodgingBusiness.${b1_id}.delinquency_strike_count == 1 and compliance_standing == WATCH"
            - "PetitionSignature.${sig_b1_id}.status is still VALID, because hop 4 fires only at SUSPENDED"

      - name: audited_downward_revision_migrates_the_overpaid_principal_into_credit
        claim_type: reconciliation
        grounds:
          - calculations.assessment_amount.variants.FINAL
          - calculations.payment_status_derivation.reallocation_step
          - state_machines.AssessmentStatement.PAID_IN_FULL_to_REFUND_DUE
          - state_machines.AssessmentStatement.FILED_to_AUDITED
        distinguishing_aspect: |
          A statement already settled at 824500 is audited down to 742050 on audited revenue
          37102500, and the 82450 of principal that is now excess must migrate into
          credit_balance_cents rather than disappear: principal_paid_cents falls to exactly the new
          assessment, total_due_cents becomes 0, the row flips PAID_IN_FULL -> REFUND_DUE, and
          District.collected_to_date_cents is unchanged at 824500 because no cash left the district.
        test_recipe:
          setup:
            - "canonical district, st1 filed at 824500 and paid in full in one remittance"
            - "period CLOSED at clock 2026-11-16 so an audit is admissible, no sweep"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st1
            - *c_file_st1
            - &c_pay_st1_full
              call: "POST /assessment-statements/${st1_id}/remittances"
              payload: { amount_cents: 824500, received_on: "2026-08-01T00:00:00Z", method: "WIRE" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
              captures: { rem_st1_id: "$.data.id" }
            - *c_clock_period_end
            - *c_close_q1
          trigger:
            - call: "POST /assessment-statements/${st1_id}/audit-certification"
              payload: { action: "AUDIT", audited_gross_room_revenue_cents: 37102500, audit_note: "resort fees removed from the revenue basis" }
              as: IndependentAuditor
              as_user_id: "auditor-01"
          assert:
            - "before the audit AssessmentStatement.${st1_id}.payment_status == PAID_IN_FULL with principal_paid_cents == 824500 and credit_balance_cents == 0"
            - "the audit returns 200 and AssessmentStatement.${st1_id}.filing_status == AUDITED"
            - "AssessmentStatement.${st1_id}.final_assessment_cents == 742050"
            - "AssessmentStatement.${st1_id}.effective_assessment_cents == 742050"
            - "AssessmentStatement.${st1_id}.audited_gross_room_revenue_cents == 37102500 and audited_room_nights == null, so the floor basis stays the reported 2000 nights and 300000 does not bind"
            - "AssessmentStatement.${st1_id}.principal_paid_cents == 742050"
            - "AssessmentStatement.${st1_id}.credit_balance_cents == 82450"
            - "AssessmentStatement.${st1_id}.total_due_cents == 0 and payment_status == REFUND_DUE"
            - "AssessmentStatement.${st1_id}.audited_by_user_id == auditor-01"
            - "District.${d_id}.collected_to_date_cents is still 824500, equal to 742050 principal + 82450 credit"

      - name: program_cost_tier_is_selected_on_gross_cost_and_never_reselected
        claim_type: tiered_pricing
        grounds:
          - calculations.program_performance.pass_1
          - calculations.program_performance.constants.DMO_SHARE_PCT
        excluded_because:
          difficulty_instance: combinatorial_formula / program_performance_efficiency_tier_fixed_on_gross_cost_before_dmo_share
          rationale: "That §1.8 instance pins the tier on gross cost per room night, then the share, then the net figure, and asserts the naive re-tiered answer is wrong."

      - name: weighted_support_is_one_division_rounded_once_to_four_places
        claim_type: weighted_scoring
        grounds:
