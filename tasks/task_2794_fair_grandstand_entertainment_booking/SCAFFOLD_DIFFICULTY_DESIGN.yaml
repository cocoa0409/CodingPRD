              payload: {}
              as: TalentBuyer
              as_user_id: "buyer-01"
          assert:
            - "Settlement.${se1}.adjusted_gross_cents == 10679468"
            - "Settlement.${se2}.adjusted_gross_cents == 10679468"
            - "Settlement.${se1}.provisional_net_pool_cents == 8179468"
            - "Settlement.${se2}.provisional_net_pool_cents == 8179468"
            - "Settlement.${se1}.artist_payout_cents == 12500000"
            - "Settlement.${se2}.artist_payout_cents == 14352548"
            - "Settlement.${se2}.artist_payout_cents - Settlement.${se1}.artist_payout_cents == 1852548"
            - "Settlement.${se1}.production_surcharge_cents == 437500"
            - "Settlement.${se2}.production_surcharge_cents == 502339"
            - "Settlement.${se1}.net_pool_cents == 7741968"
            - "Settlement.${se2}.net_pool_cents == 7677129"
            - "Settlement.${se1}.total_artist_settlement_cents == 13220000"
            - "Settlement.${se2}.total_artist_settlement_cents == 15072548"

      - name: artist_draw_score_attendance_vs_revenue_weighted
