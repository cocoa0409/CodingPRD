            - call: "POST /settlement-batches"
              payload: { site_id: "${p2_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59.999Z", expected_site_version: "${sv2b}" }
              as: SettlementClerk
              as_user_id: "${p2_id}"
              captures: { sb3_id: $.data.id }
            - call: "POST /settlement-batches/${sb3_id}/submit"
