# =============================================================================
# 1.8 Scaffold Difficulty Design — Test Targeting Index
# Domain: payroll-tax-amendment-correction (task 2692)
# 9 rule_ids, 24 instances. Every numeric literal in an `assert:` line was
# produced by executing the corresponding §1.3 formula against the pinned
# fixture inputs with Decimal arithmetic and ROUND_HALF_UP.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: interest_statutory_daily_variant_on_federal_amendment
        grounds:
          - calculations.amendment_interest_accrual
          - entities.TaxAgency.fields.interest_method
          - entities.AmendedReturn.fields.interest_variant
          - state_machines.AmendedReturn.DRAFT_to_PREPARED
        distinguishing_aspect: |
          The STATUTORY_DAILY variant accrues one simple-interest charge on the whole
          tax_delta_cents from FiledReturn.original_due_date, so the agency's own deposit
          obligations are irrelevant and the result is exactly tax_delta * rate * days/365 —
          20000 cents for a 250000-cent delta at 800 bps over 365 days.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-30T00:00:00Z."
            - "Employer Acme with authorization_limit_cents 5000000 and SEMIWEEKLY deposits."
            - "Federal agency FED-941 with interest_method STATUTORY_DAILY at 800 bps, penalty_multiplier_bps 10000, requires_registration false."
            - "2025 Q1 register totals 5000000 taxable wage / 750000 withheld across two employees, both in jurisdiction US."
            - "The filed 941 for 2025 Q1 reports 4750000 wage / 500000 withheld, original_due_date derived as 2025-04-30."
            - "One cleared deposit of 500000 against a 750000 obligation due 2025-02-19."
            - "Reconciliation has emitted three discrepancies (TAXABLE_WAGE 250000, WITHHOLDING 250000, DEPOSIT_SHORTFALL 250000), all categorised."
            - "A DRAFT amended return exists on the case with accrual_through_date 2026-04-30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "SEMIWEEKLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /tax-agencies"
              payload: { agency_code: "FED-941", level: "FEDERAL", jurisdiction_code: "US", interest_rate_bps_annual: 800, interest_method: "STATUTORY_DAILY", penalty_multiplier_bps: 10000, min_days_between_amendments: 30, amendment_window_days: 1095, requires_registration: false }
              as: PlatformAdmin
              captures: { fed_id: "$.data.id" }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "Dana Reed", national_id_last4: "4821", mailing_state_code: "NY" }
              as: PayrollAnalyst
              captures: { e1_id: "$.data.id" }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "Lee Park", national_id_last4: "7130", mailing_state_code: "NY" }
              as: PayrollAnalyst
              captures: { e2_id: "$.data.id" }
            - call: "POST /payroll-register-lines"
              payload: { employer_id: "${emp_id}", employee_id: "${e1_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, taxable_wage_cents: 3000000, withheld_cents: 450000, work_jurisdiction_code: "US" }
              as: PayrollAnalyst
            - call: "POST /payroll-register-lines"
              payload: { employer_id: "${emp_id}", employee_id: "${e2_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, taxable_wage_cents: 2000000, withheld_cents: 300000, work_jurisdiction_code: "US" }
              as: PayrollAnalyst
            - call: "POST /filed-returns"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, form_code: "941X", filed_at: "2025-04-30T00:00:00Z", reported_taxable_wage_cents: 4750000, reported_withheld_cents: 500000 }
              as: TaxPreparer
              captures: { fr_id: "$.data.id" }
            - call: "POST /deposit-records"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, deposit_due_date: "2025-02-19", deposit_date: "2025-02-19", amount_cents: 500000, obligation_amount_cents: 750000, clearing_status: "CLEARED" }
              as: PayrollAnalyst
            - call: "POST /correction-cases"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1 }
              as: PayrollAnalyst
              captures: { case_id: "$.data.id" }
            - call: "POST /correction-cases/${case_id}/reconcile"
              payload: {}
              as: PayrollAnalyst
            - call: "GET /discrepancies"
              payload: { correction_case_id: "${case_id}", category: "TAXABLE_WAGE" }
              as: PayrollAnalyst
              captures: { d_wage_id: "$.data[0].id" }
            - call: "GET /discrepancies"
              payload: { correction_case_id: "${case_id}", category: "WITHHOLDING" }
              as: PayrollAnalyst
              captures: { d_wh_id: "$.data[0].id" }
            - call: "GET /discrepancies"
              payload: { correction_case_id: "${case_id}", category: "DEPOSIT_SHORTFALL" }
              as: PayrollAnalyst
              captures: { d_dep_id: "$.data[0].id" }
            - call: "POST /discrepancies/${d_wage_id}/categorize"
              payload: { category: "TAXABLE_WAGE", root_cause_code: "RATE_TABLE_STALE" }
              as: PayrollAnalyst
            - call: "POST /discrepancies/${d_wh_id}/categorize"
              payload: { category: "WITHHOLDING", root_cause_code: "RATE_TABLE_STALE" }
              as: PayrollAnalyst
            - call: "POST /discrepancies/${d_dep_id}/categorize"
              payload: { category: "DEPOSIT_SHORTFALL", root_cause_code: "DEPOSIT_SCHEDULING_ERROR" }
              as: PayrollAnalyst
            - call: "GET /correction-cases/${case_id}"
              payload: {}
              as: TaxPreparer
              captures: { case_ver: "$.data.version" }
            - call: "POST /amended-returns"
              payload: { correction_case_id: "${case_id}", form_code: "941X", accrual_through_date: "2026-04-30", expected_correction_case_version: "${case_ver}" }
              as: TaxPreparer
              captures: { ar_id: "$.data.id" }
          trigger:
            - call: "POST /amended-returns/${ar_id}/prepare"
              payload: {}
              as: TaxPreparer
              as_user_id: "u_prep_alex"
          assert:
            - "AmendedReturn.${ar_id}.interest_variant == STATUTORY_DAILY"
            - "AmendedReturn.${ar_id}.tax_delta_cents == 250000"
            - "AmendedReturn.${ar_id}.wage_delta_cents == 250000"
            - "AmendedReturn.${ar_id}.deposit_shortfall_cents == 250000"
            - "AmendedReturn.${ar_id}.days_late == 365"
            - "AmendedReturn.${ar_id}.interest_cents == 20000"
            - "AmendedReturn.${ar_id}.penalty_cents == 65625"
            - "AmendedReturn.${ar_id}.voluntary_reduction_applied == true"
            - "AmendedReturn.${ar_id}.status == PREPARED"
            - "CorrectionCase.${case_id}.total_exposure_cents == 335625"

      - name: interest_deposit_weighted_variant_diverges_on_state_amendment
        grounds:
          - calculations.amendment_interest_accrual
          - entities.TaxAgency.fields.interest_method
          - entities.DepositRecord.fields.deposit_due_date
          - state_machines.AmendedReturn.DRAFT_to_PREPARED
        distinguishing_aspect: |
          The DEPOSIT_WEIGHTED variant splits the identical 250000-cent tax_delta across the
          quarter's two deposit obligations (150000 due 2025-02-19, 100000 due 2025-03-19) and
          accrues each tranche from its own earlier due date, producing 34833 cents where
          STATUTORY_DAILY on byte-identical inputs would produce exactly 30000 cents.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-30T00:00:00Z."
            - "Employer Acme with authorization_limit_cents 5000000."
            - "State agency NY-45 with interest_method DEPOSIT_WEIGHTED at 1200 bps, penalty_multiplier_bps 5000, min_days_between_amendments 45, requires_registration true."
            - "An ACTIVE agency account covering 2025 Q1 onward."
            - "2025 Q1 register totals 5000000 taxable wage / 750000 withheld, all in jurisdiction NY, so no jurisdiction variance can arise."
            - "The filed return reports the wage correctly (5000000) but only 500000 withheld, so WITHHOLDING is the only variance."
            - "Two cleared deposits fully satisfying obligations of 150000 (due 2025-02-19) and 100000 (due 2025-03-19), so deposit shortfall is zero."
            - "A DRAFT amended return with accrual_through_date 2026-04-30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "SEMIWEEKLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /tax-agencies"
              payload: { agency_code: "NY-45", level: "STATE", jurisdiction_code: "NY", interest_rate_bps_annual: 1200, interest_method: "DEPOSIT_WEIGHTED", penalty_multiplier_bps: 5000, min_days_between_amendments: 45, amendment_window_days: 1095, requires_registration: true }
              as: PlatformAdmin
              captures: { ny_id: "$.data.id" }
            - call: "POST /agency-accounts"
              payload: { employer_id: "${emp_id}", agency_id: "${ny_id}", account_number: "NY-ACCT-0001", effective_from_tax_year: 2025, effective_from_quarter: 1 }
              as: PayrollAnalyst
              captures: { acct_id: "$.data.id" }
            - call: "POST /agency-accounts/${acct_id}/activate"
              payload: { account_number: "NY-ACCT-0001" }
              as: PayrollAnalyst
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "Dana Reed", national_id_last4: "4821", mailing_state_code: "NY" }
              as: PayrollAnalyst
              captures: { e1_id: "$.data.id" }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "Lee Park", national_id_last4: "7130", mailing_state_code: "NY" }
              as: PayrollAnalyst
              captures: { e2_id: "$.data.id" }
            - call: "POST /payroll-register-lines"
              payload: { employer_id: "${emp_id}", employee_id: "${e1_id}", agency_id: "${ny_id}", tax_year: 2025, quarter: 1, taxable_wage_cents: 3000000, withheld_cents: 450000, work_jurisdiction_code: "NY" }
              as: PayrollAnalyst
            - call: "POST /payroll-register-lines"
              payload: { employer_id: "${emp_id}", employee_id: "${e2_id}", agency_id: "${ny_id}", tax_year: 2025, quarter: 1, taxable_wage_cents: 2000000, withheld_cents: 300000, work_jurisdiction_code: "NY" }
              as: PayrollAnalyst
            - call: "POST /filed-returns"
              payload: { employer_id: "${emp_id}", agency_id: "${ny_id}", tax_year: 2025, quarter: 1, form_code: "NYS-45X", filed_at: "2025-04-30T00:00:00Z", reported_taxable_wage_cents: 5000000, reported_withheld_cents: 500000 }
              as: TaxPreparer
              captures: { fr_id: "$.data.id" }
            - call: "POST /deposit-records"
              payload: { employer_id: "${emp_id}", agency_id: "${ny_id}", tax_year: 2025, quarter: 1, deposit_due_date: "2025-02-19", deposit_date: "2025-02-19", amount_cents: 150000, obligation_amount_cents: 150000, clearing_status: "CLEARED" }
              as: PayrollAnalyst
            - call: "POST /deposit-records"
              payload: { employer_id: "${emp_id}", agency_id: "${ny_id}", tax_year: 2025, quarter: 1, deposit_due_date: "2025-03-19", deposit_date: "2025-03-19", amount_cents: 100000, obligation_amount_cents: 100000, clearing_status: "CLEARED" }
              as: PayrollAnalyst
            - call: "POST /correction-cases"
              payload: { employer_id: "${emp_id}", agency_id: "${ny_id}", tax_year: 2025, quarter: 1 }
              as: PayrollAnalyst
              captures: { case_id: "$.data.id" }
            - call: "POST /correction-cases/${case_id}/reconcile"
              payload: {}
              as: PayrollAnalyst
            - call: "GET /discrepancies"
              payload: { correction_case_id: "${case_id}", category: "WITHHOLDING" }
              as: PayrollAnalyst
              captures: { d_wh_id: "$.data[0].id" }
            - call: "POST /discrepancies/${d_wh_id}/categorize"
              payload: { category: "WITHHOLDING", root_cause_code: "THIRD_PARTY_FEED_ERROR" }
              as: PayrollAnalyst
            - call: "GET /correction-cases/${case_id}"
              payload: {}
              as: TaxPreparer
              captures: { case_ver: "$.data.version" }
            - call: "POST /amended-returns"
              payload: { correction_case_id: "${case_id}", form_code: "NYS-45X", accrual_through_date: "2026-04-30", expected_correction_case_version: "${case_ver}" }
              as: TaxPreparer
              captures: { ar_id: "$.data.id" }
          trigger:
            - call: "POST /amended-returns/${ar_id}/prepare"
              payload: {}
              as: TaxPreparer
              as_user_id: "u_prep_alex"
          assert:
            - "AmendedReturn.${ar_id}.interest_variant == DEPOSIT_WEIGHTED"
            - "AmendedReturn.${ar_id}.tax_delta_cents == 250000"
            - "AmendedReturn.${ar_id}.deposit_shortfall_cents == 0"
            - "AmendedReturn.${ar_id}.days_late == 365"
            - "AmendedReturn.${ar_id}.interest_cents == 34833"
            - "AmendedReturn.${ar_id}.interest_cents != 30000 (30000 is the value the STATUTORY_DAILY variant produces from the identical tax_delta_cents, rate and accrual window, so the 4833-cent delta proves the tranche-level accrual ran)"
            - "AmendedReturn.${ar_id}.penalty_cents == 23438"
            - "CorrectionCase.${case_id}.total_exposure_cents == 308271"

      - name: repayment_same_year_net_versus_prior_year_gross_recovery
        grounds:
          - calculations.repayment_recovery_basis
          - entities.WageRepayment.fields.recovery_basis
          - entities.WageRepayment.fields.employee_due_cents
          - entities.WageRepayment.fields.agency_recoverable_cents
        distinguishing_aspect: |
          This variant pair keys on tax-year identity rather than on an agency configuration
          flag and governs money owed BY the employee (not owed to an agency): from identical
          inputs 400000/60000/30600, SAME_YEAR_NET yields employee_due_cents 309400 with
          90600 recoverable, while PRIOR_YEAR_GROSS yields 400000 due with only 30600
          recoverable because prior-year income tax withholding can no longer be reclaimed.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-30T00:00:00Z."
            - "Employer Acme with two employees Dana Reed and Lee Park."
            - "Federal agency FED-941 with jurisdiction_code US, requires_registration false."
            - "A 2025 Q1 register line for Dana in jurisdiction NJ at workday_ratio_bps 4000, so reconciliation emits one JURISDICTION_ASSIGNMENT discrepancy; the filed return matches the register totals otherwise."
            - "An open correction case for 2025 Q1 whose single discrepancy has been categorised."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "SEMIWEEKLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /tax-agencies"
              payload: { agency_code: "FED-941", level: "FEDERAL", jurisdiction_code: "US", interest_rate_bps_annual: 800, interest_method: "STATUTORY_DAILY", penalty_multiplier_bps: 10000, min_days_between_amendments: 30, amendment_window_days: 1095, requires_registration: false }
              as: PlatformAdmin
              captures: { fed_id: "$.data.id" }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "Dana Reed", national_id_last4: "4821", mailing_state_code: "NJ" }
              as: PayrollAnalyst
              captures: { e1_id: "$.data.id" }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "Lee Park", national_id_last4: "7130", mailing_state_code: "NJ" }
              as: PayrollAnalyst
              captures: { e2_id: "$.data.id" }
            - call: "POST /payroll-register-lines"
              payload: { employer_id: "${emp_id}", employee_id: "${e1_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, taxable_wage_cents: 1000000, withheld_cents: 150000, work_jurisdiction_code: "NJ", workday_ratio_bps: 4000 }
              as: PayrollAnalyst
            - call: "POST /filed-returns"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, form_code: "941X", filed_at: "2025-04-30T00:00:00Z", reported_taxable_wage_cents: 1000000, reported_withheld_cents: 150000 }
              as: TaxPreparer
              captures: { fr_id: "$.data.id" }
            - call: "POST /correction-cases"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1 }
              as: PayrollAnalyst
              captures: { case_id: "$.data.id" }
            - call: "POST /correction-cases/${case_id}/reconcile"
              payload: {}
              as: PayrollAnalyst
            - call: "GET /discrepancies"
              payload: { correction_case_id: "${case_id}", category: "JURISDICTION_ASSIGNMENT" }
              as: PayrollAnalyst
              captures: { d_jur_id: "$.data[0].id" }
            - call: "POST /discrepancies/${d_jur_id}/categorize"
              payload: { category: "JURISDICTION_ASSIGNMENT", root_cause_code: "JURISDICTION_MAPPING_ERROR" }
              as: PayrollAnalyst
          trigger:
            - call: "POST /wage-repayments"
              payload: { correction_case_id: "${case_id}", employee_id: "${e1_id}", overpaid_gross_cents: 400000, overpaid_income_tax_withheld_cents: 60000, overpaid_fica_withheld_cents: 30600, overpayment_tax_year: 2025, recovery_tax_year: 2025, installment_count: 1 }
              as: PayrollAnalyst
              captures: { rp_same_id: "$.data.id" }
            - call: "POST /wage-repayments"
              payload: { correction_case_id: "${case_id}", employee_id: "${e2_id}", overpaid_gross_cents: 400000, overpaid_income_tax_withheld_cents: 60000, overpaid_fica_withheld_cents: 30600, overpayment_tax_year: 2025, recovery_tax_year: 2026, installment_count: 1 }
              as: PayrollAnalyst
              captures: { rp_prior_id: "$.data.id" }
          assert:
            - "WageRepayment.${rp_same_id}.recovery_basis == SAME_YEAR_NET"
            - "WageRepayment.${rp_same_id}.employee_due_cents == 309400"
            - "WageRepayment.${rp_same_id}.agency_recoverable_cents == 90600"
            - "WageRepayment.${rp_prior_id}.recovery_basis == PRIOR_YEAR_GROSS"
            - "WageRepayment.${rp_prior_id}.employee_due_cents == 400000"
            - "WageRepayment.${rp_prior_id}.agency_recoverable_cents == 30600"
            - "WageRepayment.${rp_same_id}.employee_due_cents + WageRepayment.${rp_same_id}.agency_recoverable_cents == 400000"
            - "WageRepayment.${rp_prior_id}.employee_due_cents + WageRepayment.${rp_prior_id}.agency_recoverable_cents == 430600"

  - rule_id: combinatorial_formula
    instances:

      - name: apportionment_rounds_per_line_before_summation
        grounds:
          - calculations.jurisdiction_wage_apportionment
          - calculations.amended_return_delta_rollup
          - entities.PayrollRegisterLine.fields.workday_ratio_bps
          - entities.AmendedReturn.fields.wage_delta_cents
        distinguishing_aspect: |
          This instance pins ROUNDING ORDER (mode b): three register lines of 100001 cents at
          5000 bps each land exactly on a half-cent, so rounding per line and then summing gives
          150003 while summing and then rounding gives 150002 — the amended return's
          wage_delta_cents must be exactly -150003.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-30T00:00:00Z."
            - "Employer Acme; local agency PHL-LST with jurisdiction_code PHL and requires_registration false."
            - "Three employees each with one 2025 Q1 register line of taxable_wage_cents 100001, withheld_cents 0, work_jurisdiction_code PA and workday_ratio_bps 5000."
            - "The filed return reports 300003 wage and 0 withheld, so wage and withholding both reconcile exactly and only jurisdiction variances remain."
            - "No deposit records exist, so total obligation is zero and no deposit shortfall can be emitted."
            - "All three JURISDICTION_ASSIGNMENT discrepancies are categorised; a DRAFT amended return exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /tax-agencies"
              payload: { agency_code: "PHL-LST", level: "LOCAL", jurisdiction_code: "PHL", interest_rate_bps_annual: 600, interest_method: "STATUTORY_DAILY", penalty_multiplier_bps: 10000, min_days_between_amendments: 15, amendment_window_days: 730, requires_registration: false }
              as: PlatformAdmin
              captures: { phl_id: "$.data.id" }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "Dana Reed", national_id_last4: "4821", mailing_state_code: "PA" }
              as: PayrollAnalyst
              captures: { e1_id: "$.data.id" }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "Lee Park", national_id_last4: "7130", mailing_state_code: "PA" }
              as: PayrollAnalyst
              captures: { e2_id: "$.data.id" }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "Ana Ruiz", national_id_last4: "9052", mailing_state_code: "PA" }
              as: PayrollAnalyst
              captures: { e3_id: "$.data.id" }
            - call: "POST /payroll-register-lines"
              payload: { employer_id: "${emp_id}", employee_id: "${e1_id}", agency_id: "${phl_id}", tax_year: 2025, quarter: 1, taxable_wage_cents: 100001, withheld_cents: 0, work_jurisdiction_code: "PA", workday_ratio_bps: 5000 }
              as: PayrollAnalyst
            - call: "POST /payroll-register-lines"
              payload: { employer_id: "${emp_id}", employee_id: "${e2_id}", agency_id: "${phl_id}", tax_year: 2025, quarter: 1, taxable_wage_cents: 100001, withheld_cents: 0, work_jurisdiction_code: "PA", workday_ratio_bps: 5000 }
              as: PayrollAnalyst
            - call: "POST /payroll-register-lines"
              payload: { employer_id: "${emp_id}", employee_id: "${e3_id}", agency_id: "${phl_id}", tax_year: 2025, quarter: 1, taxable_wage_cents: 100001, withheld_cents: 0, work_jurisdiction_code: "PA", workday_ratio_bps: 5000 }
              as: PayrollAnalyst
            - call: "POST /filed-returns"
              payload: { employer_id: "${emp_id}", agency_id: "${phl_id}", tax_year: 2025, quarter: 1, form_code: "PHL-LSTX", filed_at: "2025-04-30T00:00:00Z", reported_taxable_wage_cents: 300003, reported_withheld_cents: 0 }
              as: TaxPreparer
              captures: { fr_id: "$.data.id" }
            - call: "POST /correction-cases"
              payload: { employer_id: "${emp_id}", agency_id: "${phl_id}", tax_year: 2025, quarter: 1 }
              as: PayrollAnalyst
              captures: { case_id: "$.data.id" }
            - call: "POST /correction-cases/${case_id}/reconcile"
              payload: {}
              as: PayrollAnalyst
            - call: "GET /discrepancies"
              payload: { correction_case_id: "${case_id}", category: "JURISDICTION_ASSIGNMENT" }
