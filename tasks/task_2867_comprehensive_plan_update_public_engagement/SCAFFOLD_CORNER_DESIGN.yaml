          assert:
            - "the second LAND_USE element on plan 1 returns HTTP 409 with error_id == \"ERR_DUPLICATE_ELEMENT_TYPE\""
            - "the LAND_USE element on plan 2 is created with HTTP 201 - uniqueness is per plan, not global"
            - "the second VERY_LOW allocation on plan 1 returns HTTP 409 with error_id == \"ERR_DUPLICATE_ALLOCATION_TIER\", even though assigned_units differs"
            - "the VERY_LOW allocation on plan 2 is created with HTTP 201"
            - "re-recording respondent_ref \"resident-77\" on the SAME activity returns HTTP 409 with error_id == \"ERR_DUPLICATE_PARTICIPATION\", even though demographic_group differs"
            - "recording \"resident-77\" on the OTHER activity of the same plan is created with HTTP 201 - the key is (activity_id, respondent_ref), not (plan_update_id, respondent_ref)"
            - "plan 1 still has exactly one LAND_USE element (total_count == 1) and the workshop still has record_count == 1 with total_weighted_count == 1.0"
            - "the refused duplicate never bumped any counter: the workshop's participation-records list returns total_count == 1"

      - name: cross_aggregate_ownership_and_horizon_agreement
        claim_type: violation_to_error
        grounds:
          - validations.priority_70_cross_aggregate_ownership
          - errors.ERR_CROSS_PLAN_LINK
          - errors.ERR_CROSS_PLAN_ACTION
          - errors.ERR_INVENTORY_TYPE_MISMATCH
          - errors.ERR_HORIZON_YEAR_MISMATCH
        distinguishing_aspect: |
          Every body-level foreign key in this API resolves globally, so an id borrowed from a
          second plan passes the priority-40 existence check and is only caught by the
          priority-70 ownership check. This instance is the tenancy audit: it stands up two plans
          with parallel fixtures and then crosses one reference at a time. The subtle part is that
          the four crossings do NOT share an error id - a cross-plan consistency link is
          ERR_CROSS_PLAN_LINK, a cross-plan implementation action is ERR_CROSS_PLAN_ACTION, and a
          cross-plan LAND_USE inventory pinned by a growth scenario surfaces as
          ERR_INVENTORY_TYPE_MISMATCH because the scenario precondition requires "an
          InventoryDataset of the same plan with inventory_type == LAND_USE" as one conjunction.
          An implementation that funnels all ownership failures into a single generic id fails
          three of the four. The instance closes with the neighbouring scalar agreement rule -
          a scenario whose horizon_year disagrees with its own plan's horizon_year is
          ERR_HORIZON_YEAR_MISMATCH - to show that ownership and field agreement are separate
          checks evaluated on the same call.
        test_recipe:
          setup:
            - "Two plans with different horizon years (2045 and 2050), each with its own certified LAND_USE inventory and its own LAND_USE element."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045 General Plan", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu1: $.data.id }
            - call: "POST /planning/plan-updates"
              payload: { title: "Riverside 2050 General Plan", jurisdiction_code: "CA-0452", base_year: 2025, horizon_year: 2050 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu2: $.data.id }
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu1}", inventory_type: "LAND_USE", vintage_year: 2025, vacant_acres: 400, underutilized_acres: 250, infrastructure_constrained_acres: 100, allowed_density_units_per_acre: 18 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { lu1: $.data.id }
            - call: "POST /planning/inventory-datasets/${lu1}/certify"
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { lu1_v: $.data.version }
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu2}", inventory_type: "LAND_USE", vintage_year: 2025, vacant_acres: 300, underutilized_acres: 100, infrastructure_constrained_acres: 50, allowed_density_units_per_acre: 12 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { lu2: $.data.id }
            - call: "POST /planning/inventory-datasets/${lu2}/certify"
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { lu2_v: $.data.version }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu1}", element_type: "LAND_USE", title: "Land Use Element", draft_body: "Centers and corridors.", policy_count: 4 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { el1: $.data.id }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu2}", element_type: "LAND_USE", title: "Riverside Land Use Element", draft_body: "Rural buffer.", policy_count: 4 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { el2: $.data.id }
          trigger:
            - call: "POST /planning/consistency-links"
              payload: { source_element_id: "${el1}", target_element_id: "${el2}", dependency_type: "POLICY_ALIGNMENT" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e_link: $.data.error_id }
            - call: "POST /planning/implementation-actions"
              payload: { plan_update_id: "${pu1}", source_element_id: "${el2}", action_type: "ZONING_CODE_UPDATE", title: "Rezone the eastside corridor", indicator_name: "acres_rezoned", indicator_direction: "INCREASE", baseline_value: 0, target_value: 120 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e_act: $.data.error_id }
            - call: "POST /planning/growth-scenarios"
              payload: { plan_update_id: "${pu1}", land_use_inventory_id: "${lu2}", expected_inventory_version: "${lu2_v}", label: "Borrowed inventory", method: "TREND", horizon_year: 2045, base_households: 20000, annual_household_growth_rate: 0.012, job_growth_total: 15000, demolition_replacement_units: 500 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e_inv: $.data.error_id }
            - call: "POST /planning/growth-scenarios"
              payload: { plan_update_id: "${pu1}", land_use_inventory_id: "${lu1}", expected_inventory_version: "${lu1_v}", label: "Wrong horizon", method: "TREND", horizon_year: 2050, base_households: 20000, annual_household_growth_rate: 0.012, job_growth_total: 15000, demolition_replacement_units: 500 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e_hor: $.data.error_id }
            - call: "POST /planning/growth-scenarios"
              payload: { plan_update_id: "${pu1}", land_use_inventory_id: "${lu1}", expected_inventory_version: "${lu1_v}", label: "Own inventory, own horizon", method: "TREND", horizon_year: 2045, base_households: 20000, annual_household_growth_rate: 0.012, job_growth_total: 15000, demolition_replacement_units: 500 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { sc_ok: $.data.id, sc_ok_cap: $.data.land_capacity_units }
            - call: "GET /planning/inventory-datasets/${lu2}"
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "GET /planning/growth-scenarios?plan_update_id=${pu1}"
              as: PlanningStaff
              as_user_id: "staff-1"
          assert:
            - "the link whose target element lives in plan 2 returns HTTP 409 with error_id == \"ERR_CROSS_PLAN_LINK\" - the target id exists, so this is priority 70 and not a 404"
            - "the implementation action on plan 1 sourced from plan 2's element returns HTTP 409 with error_id == \"ERR_CROSS_PLAN_ACTION\""
            - "the scenario on plan 1 pinning plan 2's LAND_USE inventory returns HTTP 409 with error_id == \"ERR_INVENTORY_TYPE_MISMATCH\" - the dataset IS of type LAND_USE and IS certified, but it belongs to the wrong plan, and the same-plan and same-type requirements are one conjunction"
            - "the scenario pinning its own inventory but declaring horizon_year 2050 against a plan whose horizon_year is 2045 returns HTTP 409 with error_id == \"ERR_HORIZON_YEAR_MISMATCH\""
            - "the fully consistent scenario is created with HTTP 201 and land_capacity_units == 11700"
            - "plan 2's inventory reports referencing_scenario_count == 0 and its version is unchanged from the certify call - a refused scenario must not increment the borrowed dataset's counters"
            - "plan 1 has exactly one growth scenario (total_count == 1); none of the three refused scenario bodies was persisted"

  - section: endpoints
    instances:
      - name: compliance_summary_computed_read_reports_all_twelve_fields
        claim_type: computed_read
        grounds:
          - endpoints.GET_planning_plan_updates_id_compliance_summary
          - calculations.compliance_posture
          - calculations.indicator_on_track
        distinguishing_aspect: |
          The compliance summary is the only read in the API that is a *projection* rather than a
          row: twelve fields drawn from four different aggregates (elements, links, allocations,
          scenario, activities, actions). Because it has no request body and no side effects, the
          only way it can be wrong is by disagreeing with the entities it summarises, so this
          instance reads it three times against the same plan - empty, capacity-loaded and
          consistency-loaded - and cross-checks every field against the underlying row that
          produced it. Two things are pinned that no per-entity test can reach. First, the posture
          precedence is observed with THREE holds true at once: at the last read the plan has an
          OPEN consistency link, a 2300-unit housing shortfall and an equity share of 0.0, and the
          contract demands exactly "CONSISTENCY_HOLD" - an implementation that evaluates the
          cheapest condition first, or that returns a list of holds, is caught here. Second,
          monitoring_on_track_count is proven to be a filtered count and not a reading count: two
          implementation actions each receive one reading, one meeting its target and one missing
          it, and the field must be 1 while reading_count is 1 on both rows. The empty read also
          pins that a plan with no adopted scenario reports land_capacity_units, projected_demand_units
          and capacity_gap_units as 0 rather than null, and required_elements_complete_count as 0 with
          all five types listed in missing_element_types.
        test_recipe:
          setup:
            - "The logical clock stays at 2026-08-01T00:00:00Z."
            - "One plan (base_year 2025, horizon_year 2045) with all four inventory types certified; the LAND_USE row has vacant_acres 400, underutilized_acres 250, infrastructure_constrained_acres 100 and allowed_density_units_per_acre 18."
