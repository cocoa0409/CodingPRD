  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: refund_conserves_instructor_lifetime_earned
        grounds:
          - state_machines.Enrollment.ACTIVE_to_REFUNDED
          - calculations.instructor_balances
          - entities.Instructor.fields.lifetime_earned_cents
        distinguishing_aspect: |
          Conserved quantity = Instructor.lifetime_earned_cents. The SALE credit
          (+instructor_share) followed by its compensating REFUND clawback leaves
          lifetime_earned_cents at its pre-sale value (0): SALE +2000 then CLAWED_BACK
          excluded + REFUND -2000 nets to 0, pinned as
          lifetime_earned == sum(SALE+REFUND where status != CLAWED_BACK).
        test_recipe:
          setup:
            - "Instructor revenue_share_pct=0.50, lifetime_earned 0; PUBLISHED course list 4000c; learner enrolls (SALE +2000 PENDING) at clock 2026-06-01 within refund window."
