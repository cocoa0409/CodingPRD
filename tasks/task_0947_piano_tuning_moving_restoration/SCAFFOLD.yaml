        description: Allocation lifecycle; CONSUMED and RELEASED are terminal.

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; whose balance this entry moves."
      - name: service_order_id
        type: string
        source: computed
        default: null
        description: "FK -> ServiceOrder.id; populated for deposit, milestone and refund entries."
      - name: warranty_claim_id
        type: string
        source: computed
        default: null
        description: "FK -> WarrantyClaim.id; populated for warranty credit entries."
      - name: consignment_agreement_id
        type: string
        source: computed
        default: null
        description: "FK -> ConsignmentAgreement.id; populated for consignment proceeds entries."
      - name: reverses_entry_id
        type: string
        source: computed
        default: null
        description: "FK -> LedgerEntry.id; populated on REVERSAL entries."
      - name: entry_type
        type: enum
        source: computed
        constraints: "one of DEPOSIT_CHARGE, MILESTONE_CHARGE, WARRANTY_CREDIT, CONSIGNMENT_PROCEEDS, DEPOSIT_REFUND, CANCELLATION_FEE, MANUAL_ADJUSTMENT, REVERSAL"
        description: Kind of movement; selects which optional FK is populated.
      - name: amount_cents
        type: integer
        source: input
        description: Signed cents; charges and fees are negative, credits and refunds positive.
      - name: memo
        type: string
        source: input
        default: null
        description: Optional free-text note.
      - name: posted_at_utc
        type: datetime
        source: system
        description: Logical-clock instant of posting.

# ---------------------------------------------------------------------------
# 1.2 STATE MACHINE TABLE  (16 axes; 12 non-linear)
# ---------------------------------------------------------------------------
state_machines:

  - entity: Instrument
    axis: condition_status
    shape: cyclic
    initial_state: NEEDS_ASSESSMENT
    terminal_states: []
    note: "Parallel axis #1 on Instrument. RESTORED re-enters NEEDS_REGULATION, so the machine has no terminal state."
    transitions:
      - from: NEEDS_ASSESSMENT
        to: SERVICEABLE
        trigger: "POST /instruments/{id}/condition-transitions with to_condition_status=SERVICEABLE"
        actor: Technician
        preconditions:
          - "Instrument.custody_status IN {AT_CLIENT_SITE, IN_SHOP, SHOWROOM_FLOOR}"
          - "Instrument.pitch_deviation_cents IS NOT NULL (a pitch assessment has been recorded)"
        side_effects:
          - "Instrument.updated_at refreshed and Instrument.version incremented by 1"
      - from: NEEDS_ASSESSMENT
        to: NEEDS_REGULATION
        trigger: "POST /instruments/{id}/condition-transitions with to_condition_status=NEEDS_REGULATION"
        actor: Technician
        preconditions:
          - "Instrument.custody_status IN {AT_CLIENT_SITE, IN_SHOP, SHOWROOM_FLOOR}"
        side_effects:
          - "Instrument.version incremented by 1"
      - from: NEEDS_ASSESSMENT
        to: REBUILD_REQUIRED
        trigger: "POST /instruments/{id}/condition-transitions with to_condition_status=REBUILD_REQUIRED"
        actor: Technician
        preconditions:
          - "Instrument.custody_status IN {AT_CLIENT_SITE, IN_SHOP, SHOWROOM_FLOOR}"
        side_effects:
          - "Instrument.version incremented by 1"
      - from: SERVICEABLE
        to: NEEDS_REGULATION
        trigger: "POST /instruments/{id}/condition-transitions with to_condition_status=NEEDS_REGULATION"
        actor: Technician
        preconditions:
          - "Instrument.custody_status IN {AT_CLIENT_SITE, IN_SHOP, SHOWROOM_FLOOR}"
        side_effects:
          - "Instrument.version incremented by 1"
      - from: NEEDS_REGULATION
        to: NEEDS_VOICING
        trigger: "system: POST /service-orders/{id}/complete on a REGULATE order"
        actor: system
        preconditions:
          - "ServiceOrder.service_type == REGULATE"
          - "ServiceOrder.status == IN_PROGRESS"
        side_effects:
          - "Instrument.version incremented by 1"
        note: "Regulating an action leaves the instrument eligible to be voiced; this is the only producer of NEEDS_VOICING from NEEDS_REGULATION."
      - from: NEEDS_VOICING
        to: SERVICEABLE
        trigger: "system: POST /service-orders/{id}/complete on a VOICE order"
        actor: system
        preconditions:
          - "ServiceOrder.service_type == VOICE"
          - "ServiceOrder.status == IN_PROGRESS"
        side_effects:
          - "Instrument.version incremented by 1"
      - from: SERVICEABLE
        to: REBUILD_REQUIRED
        trigger: "system: POST /quotes/{id}/approve on a REBUILD quote (cascade B hop 1 fan-out)"
        actor: system
        preconditions:
          - "Quote.service_type == REBUILD"
        side_effects:
          - "Instrument.version incremented by 1"
      - from: NEEDS_REGULATION
        to: REBUILD_REQUIRED
        trigger: "system: POST /quotes/{id}/approve on a REBUILD quote (cascade B hop 1 fan-out)"
        actor: system
        preconditions:
          - "Quote.service_type == REBUILD"
        side_effects:
          - "Instrument.version incremented by 1"
      - from: REBUILD_REQUIRED
        to: RESTORED
        trigger: "system: POST /service-orders/{id}/complete on a REBUILD order"
        actor: system
        preconditions:
          - "ServiceOrder.service_type == REBUILD"
          - "Instrument.custody_status == IN_SHOP"
        side_effects:
          - "every PartsAllocation of the order with status IN {RESERVED, PARTIAL} moves to CONSUMED (see PartsAllocation machine)"
          - "Instrument.version incremented by 1"
      - from: RESTORED
        to: NEEDS_REGULATION
        trigger: "POST /instruments/{id}/condition-transitions with to_condition_status=NEEDS_REGULATION"
        actor: Technician
        preconditions:
          - "Instrument.custody_status IN {AT_CLIENT_SITE, IN_SHOP, SHOWROOM_FLOOR}"
        side_effects:
          - "Instrument.version incremented by 1"
        note: "The re-entry edge that makes this axis cyclic - a restored instrument drifts back out of regulation."

  - entity: Instrument
    axis: custody_status
    shape: cyclic
    initial_state: AT_CLIENT_SITE
    terminal_states: [SOLD]
    note: "Parallel axis #2 on Instrument, advancing independently of condition_status while constraining it."
    transitions:
      - from: AT_CLIENT_SITE
        to: IN_TRANSIT
        trigger: "POST /instruments/{id}/custody-transitions with to_custody_status=IN_TRANSIT"
        actor: MoveCoordinator
        preconditions:
          - "no other Instrument custody transition is required; authorizing_move_job_id, when supplied, must name a MoveJob for this instrument whose status is DISPATCHED"
        side_effects:
          - "when authorizing_move_job_id is null: Instrument.unauthorized_move_flag set to true, then CASCADE A fires (see cascades block)"
          - "when authorizing_move_job_id is supplied: MoveJob.status DISPATCHED -> IN_TRANSIT"
          - "Instrument.version incremented by 1"
      - from: IN_TRANSIT
        to: IN_SHOP
        trigger: "POST /instruments/{id}/custody-transitions with to_custody_status=IN_SHOP"
        actor: MoveCoordinator
        preconditions:
          - "Instrument.custody_status == IN_TRANSIT"
        side_effects:
          - "when authorizing_move_job_id is supplied: MoveJob.status IN_TRANSIT -> DELIVERED and Instrument.current_location_id set to MoveJob.destination_location_id"
          - "Instrument.version incremented by 1"
      - from: IN_SHOP
        to: IN_TRANSIT
        trigger: "POST /instruments/{id}/custody-transitions with to_custody_status=IN_TRANSIT"
        actor: MoveCoordinator
        preconditions:
          - "no ServiceOrder for this instrument has status IN_PROGRESS"
        side_effects:
          - "when authorizing_move_job_id is null: Instrument.unauthorized_move_flag set to true, then CASCADE A fires"
          - "Instrument.version incremented by 1"
        note: "The return leg that makes custody cyclic."
      - from: IN_TRANSIT
        to: AT_CLIENT_SITE
        trigger: "POST /instruments/{id}/custody-transitions with to_custody_status=AT_CLIENT_SITE"
        actor: MoveCoordinator
        preconditions:
          - "Instrument.custody_status == IN_TRANSIT"
        side_effects:
          - "when authorizing_move_job_id is supplied: MoveJob.status IN_TRANSIT -> DELIVERED and Instrument.current_location_id set to MoveJob.destination_location_id"
          - "Instrument.version incremented by 1"
      - from: IN_SHOP
        to: SHOWROOM_FLOOR
        trigger: "system: POST /consignment-agreements/{id}/list-showroom"
        actor: system
        preconditions:
          - "ConsignmentAgreement.status == ACTIVE"
          - "ConsignmentAgreement.instrument_id == Instrument.id"
        side_effects:
          - "Instrument.consignment_agreement_id set to the agreement id"
          - "Instrument.version incremented by 1"
      - from: SHOWROOM_FLOOR
        to: AT_CLIENT_SITE
        trigger: "system: POST /_ops/daily-sweep expiring the agreement, or POST /consignment-agreements/{id}/withdraw"
        actor: system
        preconditions:
          - "ConsignmentAgreement.status transitions to EXPIRED or WITHDRAWN"
        side_effects:
          - "Instrument.consignment_agreement_id cleared to null"
          - "Instrument.version incremented by 1"
      - from: SHOWROOM_FLOOR
        to: SOLD
        trigger: "system: POST /consignment-agreements/{id}/record-sale"
        actor: system
        preconditions:
          - "ConsignmentAgreement.status == LISTED"
        side_effects:
          - "Instrument.client_id re-pointed to the buyer"
          - "CASCADE C fires: warranty transfer and service-order re-ownership (see cascades block)"
          - "Instrument.version incremented by 1"

  - entity: Client
    axis: status
    shape: cyclic
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /clients/{id} with status=SUSPENDED"
        actor: ShopManager
        preconditions:
          - "Client.status == ACTIVE"
        side_effects:
          - "Client.version incremented by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /clients/{id} with status=ACTIVE"
        actor: ShopManager
        preconditions:
          - "Client.status == SUSPENDED"
        side_effects:
          - "Client.version incremented by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "PATCH /clients/{id} with status=CLOSED"
        actor: ShopManager
        preconditions:
          - "no ServiceOrder of this client has status IN {PENDING, IN_PROGRESS, ON_HOLD}"
        side_effects:
          - "Client.version incremented by 1"

  - entity: TuningRecall
    axis: status
    shape: cyclic
    initial_state: PENDING
    terminal_states: [FULFILLED, LAPSED]
    transitions:
      - from: PENDING
        to: NOTIFIED
        trigger: "POST /tuning-recalls/{id}/notify"
        actor: ShopManager
        preconditions:
          - "TuningRecall.status == PENDING"
          - "Client.status == ACTIVE for the instrument's owner"
        side_effects:
          - "TuningRecall.notified_at set to the logical clock"
          - "TuningRecall.version incremented by 1"
      - from: NOTIFIED
        to: SCHEDULED
        trigger: "system: POST /appointments carrying tuning_recall_id"
        actor: system
        preconditions:
          - "TuningRecall.status == NOTIFIED"
        side_effects:
          - "TuningRecall.version incremented by 1"
      - from: SCHEDULED
        to: NOTIFIED
        trigger: "system: POST /appointments/{id}/cancel on the linked appointment"
        actor: system
        preconditions:
          - "Appointment.tuning_recall_id == TuningRecall.id"
        side_effects:
          - "TuningRecall.version incremented by 1"
        note: "The fall-back edge that makes the recall axis cyclic."
      - from: SCHEDULED
        to: FULFILLED
        trigger: "system: POST /appointments/{id}/complete on the linked appointment"
        actor: system
        preconditions:
          - "Appointment.fulfillment_status == IN_PROGRESS"
        side_effects:
          - "Instrument.last_tuning_date set to the completion date"
          - "TuningRecall.version incremented by 1"
      - from: PENDING
        to: LAPSED
        trigger: "system: POST /_ops/daily-sweep when days_overdue >= LAPSE_MIN_DAYS (91)"
        actor: system
        preconditions:
          - "TuningRecall.days_overdue >= 91"
        side_effects:
          - "TuningRecall.overdue_tier set to LAPSED_TIER"
          - "every Warranty on this instrument with status ACTIVE moves to VOIDED with void_reason TUNING_CYCLE_LAPSED"
          - "TuningRecall.version incremented by 1"
      - from: NOTIFIED
        to: LAPSED
        trigger: "system: POST /_ops/daily-sweep when days_overdue >= LAPSE_MIN_DAYS (91)"
        actor: system
        preconditions:
          - "TuningRecall.days_overdue >= 91"
        side_effects:
          - "TuningRecall.overdue_tier set to LAPSED_TIER"
          - "every Warranty on this instrument with status ACTIVE moves to VOIDED with void_reason TUNING_CYCLE_LAPSED"
          - "TuningRecall.version incremented by 1"

  - entity: RouteDay
    axis: status
    shape: cyclic
    initial_state: OPEN
    terminal_states: [DISPATCHED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /route-days/{id}/status-transitions with to_status=LOCKED"
        actor: ShopManager
        preconditions:
          - "RouteDay.status == OPEN"
          - "the logical clock is within ROUTE_DAY_LOCK_LEAD_HOURS (12) of 00:00Z on RouteDay.service_date, i.e. clock >= service_date 00:00Z minus 12 hours"
        side_effects:
          - "RouteDay.version incremented by 1"
      - from: LOCKED
        to: OPEN
        trigger: "POST /route-days/{id}/status-transitions with to_status=OPEN"
        actor: ShopManager
        preconditions:
          - "RouteDay.status == LOCKED"
        side_effects:
          - "RouteDay.version incremented by 1"
        note: "The unlock edge that makes the route-day axis cyclic."
      - from: LOCKED
        to: DISPATCHED
        trigger: "POST /route-days/{id}/status-transitions with to_status=DISPATCHED"
        actor: ShopManager
        preconditions:
          - "RouteDay.status == LOCKED"
          - "RouteDay.stop_count >= 1"
        side_effects:
          - "every Appointment on this route day with scheduling_status IN {SCHEDULED, CONFIRMED} and fulfillment_status PENDING moves to EN_ROUTE, processed in Appointment.created_at ASC order"
          - "RouteDay.version incremented by 1"
        note: "MUTATE-THEN-REJECT: see validations priority 52."

  - entity: Appointment
    axis: scheduling_status
    shape: cyclic
    initial_state: REQUESTED
    terminal_states: [CANCELLED]
    note: "Parallel axis #1 on Appointment."
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "system: completion of POST /appointments (the create call books the stop in the same request)"
        actor: system
        preconditions:
          - "RouteDay.status == OPEN"
          - "RouteDay.committed_minutes + Appointment.total_block_minutes <= RouteDay.capacity_minutes"
        side_effects:
          - "RouteDay.committed_minutes and RouteDay.stop_count recomputed from scratch; RouteDay.version incremented by 1"
          - "when tuning_recall_id is supplied: TuningRecall NOTIFIED -> SCHEDULED"
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /appointments/{id}/confirm"
        actor: Client
        preconditions:
          - "Appointment.scheduling_status == SCHEDULED"
          - "Appointment.fulfillment_status == PENDING"
        side_effects:
          - "Appointment.version incremented by 1"
      - from: SCHEDULED
        to: RESCHEDULED
        trigger: "POST /appointments/{id}/reschedule"
        actor: Client
        preconditions:
          - "Appointment.reschedule_count < RESCHEDULE_LIMIT (2)"
          - "Appointment.fulfillment_status == PENDING"
          - "the target RouteDay.status == OPEN"
        side_effects:
          - "Appointment.reschedule_count incremented by 1"
          - "the vacated RouteDay's committed_minutes and stop_count recomputed; its version incremented by 1"
          - "the target RouteDay's committed_minutes and stop_count recomputed; its version incremented by 1"
          - "Appointment immediately re-enters SCHEDULED within the same request (RESCHEDULED is an intra-request waypoint that is never persisted as the final value)"
          - "Appointment.version incremented by 1"
      - from: CONFIRMED
        to: RESCHEDULED
        trigger: "POST /appointments/{id}/reschedule"
        actor: Client
        preconditions:
          - "Appointment.reschedule_count < RESCHEDULE_LIMIT (2)"
          - "Appointment.fulfillment_status == PENDING"
          - "the target RouteDay.status == OPEN"
        side_effects:
          - "same as the SCHEDULED -> RESCHEDULED edge; the appointment lands back in SCHEDULED, losing its confirmation"
      - from: RESCHEDULED
        to: SCHEDULED
        trigger: "system: same request as the reschedule"
        actor: system
        preconditions:
          - "the new route day accepted the block"
        side_effects: []
        note: "Closes the reschedule loop, making this axis cyclic."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: Client
        preconditions:
          - "Appointment.fulfillment_status IN {PENDING, EN_ROUTE, IN_PROGRESS}"
        side_effects:
          - "Appointment.cancellation_fee_cents set from calculation cancellation_fee"
          - "Appointment.fulfillment_status moves to ABORTED"
          - "RouteDay.committed_minutes and stop_count recomputed; RouteDay.version incremented by 1"
          - "when the fee is greater than 0 a CANCELLATION_FEE LedgerEntry is appended for the negated fee and Client.account_credit_cents recomputed"
          - "when tuning_recall_id is supplied: TuningRecall SCHEDULED -> NOTIFIED"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: Client
        preconditions:
          - "Appointment.fulfillment_status IN {PENDING, EN_ROUTE, IN_PROGRESS}"
        side_effects:
          - "identical to the SCHEDULED -> CANCELLED edge"

  - entity: Appointment
    axis: fulfillment_status
    shape: branching
    initial_state: PENDING
    terminal_states: [COMPLETED, NO_SHOW, ABORTED]
    note: "Parallel axis #2 on Appointment; gated by the scheduling axis but advancing on its own triggers."
    transitions:
      - from: PENDING
        to: EN_ROUTE
        trigger: "system: POST /route-days/{id}/status-transitions with to_status=DISPATCHED"
        actor: system
        preconditions:
          - "Appointment.scheduling_status IN {SCHEDULED, CONFIRMED}"
        side_effects:
          - "Appointment.version incremented by 1"
      - from: EN_ROUTE
        to: IN_PROGRESS
        trigger: "POST /appointments/{id}/start"
        actor: Technician
        preconditions:
          - "Appointment.fulfillment_status == EN_ROUTE"
          - "the acting Technician's id equals RouteDay.technician_id"
        side_effects:
          - "when service_order_id is supplied and that order is PENDING, the order moves to IN_PROGRESS and all of its milestones move PENDING -> READY"
          - "Appointment.version incremented by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /appointments/{id}/complete"
        actor: Technician
        preconditions:
          - "Appointment.fulfillment_status == IN_PROGRESS"
        side_effects:
          - "when tuning_recall_id is supplied: TuningRecall SCHEDULED -> FULFILLED and Instrument.last_tuning_date set to the clock date"
          - "Appointment.version incremented by 1"
      - from: EN_ROUTE
        to: NO_SHOW
        trigger: "POST /appointments/{id}/no-show"
        actor: Technician
        preconditions:
          - "Appointment.fulfillment_status == EN_ROUTE"
        side_effects:
          - "Appointment.scheduling_status moves to CANCELLED"
          - "Appointment.cancellation_fee_cents set from the DISPATCHED_TIER variant of calculation cancellation_fee"
          - "a CANCELLATION_FEE LedgerEntry is appended for the negated fee; Client.account_credit_cents recomputed"
          - "RouteDay.committed_minutes and stop_count recomputed; RouteDay.version incremented by 1"
      - from: PENDING
        to: ABORTED
        trigger: "system: POST /appointments/{id}/cancel"
        actor: system
        preconditions:
          - "Appointment.scheduling_status moves to CANCELLED in the same request"
        side_effects: []
      - from: EN_ROUTE
        to: ABORTED
        trigger: "system: POST /appointments/{id}/cancel"
        actor: system
        preconditions:
          - "Appointment.scheduling_status moves to CANCELLED in the same request"
        side_effects: []
      - from: IN_PROGRESS
        to: ABORTED
        trigger: "system: POST /appointments/{id}/cancel"
        actor: system
        preconditions:
          - "Appointment.scheduling_status moves to CANCELLED in the same request"
        side_effects: []

  - entity: Quote
    axis: status
    shape: branching
    initial_state: DRAFT
    terminal_states: [APPROVED, DECLINED, EXPIRED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /quotes/{id}/issue"
        actor: ShopManager
        preconditions:
          - "Quote.status == DRAFT"
          - "no other Quote for the same instrument_id and service_type has status ISSUED"
        side_effects:
          - "Quote.issued_at set to the logical clock and Quote.expires_at set to issued_at plus QUOTE_VALID_DAYS (30)"
          - "Quote.version incremented by 1"
      - from: ISSUED
        to: APPROVED
        trigger: "POST /quotes/{id}/approve"
        actor: Client
        preconditions:
          - "Quote.status == ISSUED"
          - "the logical clock is strictly before Quote.expires_at"
          - "Client.status == ACTIVE"
        side_effects:
          - "when Quote.service_type == REBUILD: CASCADE B fires (see cascades block)"
          - "when Quote.service_type == REBUILD: Instrument.condition_status moves to REBUILD_REQUIRED"
          - "Quote.version incremented by 1"
      - from: ISSUED
        to: DECLINED
        trigger: "POST /quotes/{id}/decline"
        actor: Client
        preconditions:
          - "Quote.status == ISSUED"
        side_effects:
          - "Quote.version incremented by 1"
      - from: ISSUED
        to: EXPIRED
        trigger: "system: POST /_ops/daily-sweep when the logical clock is at or after Quote.expires_at"
        actor: system
        preconditions:
          - "Quote.status == ISSUED"
          - "logical clock >= Quote.expires_at"
        side_effects:
          - "Quote.version incremented by 1"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system: POST /quotes/{id}/reissue"
        actor: system
        preconditions:
          - "Quote.status IN {ISSUED, EXPIRED}"
        side_effects:
          - "a NEW Quote row is minted with version_number = old.version_number + 1, supersedes_quote_id = old.id, status DRAFT, and freshly recomputed prices"
          - "Quote.version incremented by 1 on the superseded row"
      - from: EXPIRED
        to: SUPERSEDED
        trigger: "system: POST /quotes/{id}/reissue"
        actor: system
        preconditions:
          - "Quote.status == EXPIRED"
        side_effects:
          - "identical to the ISSUED -> SUPERSEDED edge; the expired quote itself is never mutated back to ISSUED"

  - entity: ServiceOrder
    axis: status
    shape: cyclic
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED, VOIDED_BY_REBUILD]
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "POST /service-orders/{id}/start"
        actor: Technician
        preconditions:
          - "ServiceOrder.status == PENDING"
          - "ServiceOrder.assigned_technician_id IS NOT NULL"
          - "when service_type == REBUILD: Instrument.custody_status == IN_SHOP"
        side_effects:
          - "ServiceOrder.started_at set to the logical clock"
          - "EVERY Milestone of this order moves PENDING -> READY, in sequence_index ASC order"
          - "ServiceOrder.version incremented by 1"
      - from: IN_PROGRESS
        to: ON_HOLD
        trigger: "system: a linked Appointment reaches NO_SHOW (the only producer of ON_HOLD)"
        actor: system
        preconditions:
          - "ServiceOrder.status == IN_PROGRESS"
        side_effects:
          - "ServiceOrder.version incremented by 1"
      - from: ON_HOLD
        to: IN_PROGRESS
        trigger: "POST /service-orders/{id}/resume"
        actor: ShopManager
        preconditions:
          - "ServiceOrder.status == ON_HOLD"
          - "Client.status == ACTIVE"
        side_effects:
          - "ServiceOrder.version incremented by 1"
        note: "The resume edge that makes this axis cyclic."
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /service-orders/{id}/complete"
        actor: Technician
        preconditions:
          - "ServiceOrder.status == IN_PROGRESS"
          - "every Milestone of this order has status ACCEPTED"
        side_effects:
          - "ServiceOrder.completed_at set to the logical clock"
          - "a Warranty row is minted with term_days from WARRANTY_TERM_DAYS_*, start_date = the completion date, covered_price_cents = contract_total_cents, status ACTIVE"
          - "Instrument.condition_status advances per the Instrument condition machine (REGULATE -> NEEDS_VOICING, VOICE -> SERVICEABLE, REBUILD -> RESTORED)"
          - "when service_type IN {TUNE, PITCH_RAISE}: Instrument.last_tuning_date set to the completion date"
          - "every PartsAllocation of this order with status IN {RESERVED, PARTIAL} moves to CONSUMED"
          - "ServiceOrder.version incremented by 1"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /service-orders/{id}/cancel"
        actor: ShopManager
        preconditions:
          - "ServiceOrder.status IN {PENDING, ON_HOLD}"
        side_effects:
          - "every Milestone with status IN {PENDING, READY, RELEASED} moves to CANCELLED"
          - "every PartsAllocation with status IN {RESERVED, PARTIAL} moves to RELEASED"
          - "the unapplied deposit is refunded: deposit_refunded_cents = deposit_held_cents - deposit_applied_cents; a DEPOSIT_REFUND LedgerEntry is appended and Client.account_credit_cents recomputed"
          - "ServiceOrder.version incremented by 1"
      - from: ON_HOLD
        to: CANCELLED
        trigger: "POST /service-orders/{id}/cancel"
        actor: ShopManager
        preconditions:
          - "ServiceOrder.status IN {PENDING, ON_HOLD}"
        side_effects:
          - "identical to the PENDING -> CANCELLED edge"
      - from: PENDING
        to: VOIDED_BY_REBUILD
        trigger: "system: CASCADE B hop 2, fired by POST /quotes/{id}/approve on a REBUILD quote for the same instrument"
        actor: system
        preconditions:
          - "ServiceOrder.service_type IN {TUNE, PITCH_RAISE, REGULATE, VOICE}"
          - "ServiceOrder.status IN {PENDING, IN_PROGRESS, ON_HOLD}"
        side_effects:
          - "CASCADE B hop 3: every Milestone with status IN {PENDING, READY, RELEASED} moves to CANCELLED"
          - "every PartsAllocation with status IN {RESERVED, PARTIAL} moves to RELEASED"
          - "ServiceOrder.version incremented by 1"
      - from: IN_PROGRESS
        to: VOIDED_BY_REBUILD
        trigger: "system: CASCADE B hop 2"
        actor: system
        preconditions:
          - "ServiceOrder.service_type IN {TUNE, PITCH_RAISE, REGULATE, VOICE}"
          - "ServiceOrder.status IN {PENDING, IN_PROGRESS, ON_HOLD}"
        side_effects:
          - "identical to the PENDING -> VOIDED_BY_REBUILD edge"
      - from: ON_HOLD
        to: VOIDED_BY_REBUILD
        trigger: "system: CASCADE B hop 2"
        actor: system
        preconditions:
          - "ServiceOrder.service_type IN {TUNE, PITCH_RAISE, REGULATE, VOICE}"
          - "ServiceOrder.status IN {PENDING, IN_PROGRESS, ON_HOLD}"
        side_effects:
          - "identical to the PENDING -> VOIDED_BY_REBUILD edge"

  - entity: Milestone
    axis: status
    shape: cyclic
    initial_state: PENDING
    terminal_states: [ACCEPTED, CANCELLED]
    note: "Capped-retry loop: RELEASED -> REJECTED -> READY, at most MILESTONE_REJECTION_RETRY_LIMIT (2) times."
    transitions:
      - from: PENDING
        to: READY
        trigger: "system: POST /service-orders/{id}/start - EVERY milestone of the order is readied in one step"
        actor: system
        preconditions:
          - "ServiceOrder.status becomes IN_PROGRESS in the same request"
        side_effects:
          - "Milestone.version incremented by 1"
        note: "All milestones of the order become READY together, in sequence_index ASC order. Release ORDERING is enforced separately at validations priority 54, which is what makes ERR_MILESTONE_SEQUENCE reachable from a READY milestone."
      - from: READY
        to: RELEASED
        trigger: "POST /milestones/{id}/release"
        actor: ShopManager
        preconditions:
          - "Milestone.status == READY"
          - "ServiceOrder.status == IN_PROGRESS"
          - "for sequence_index 1: ServiceOrder.deposit_held_cents > 0 is satisfied, or the order's deposit_required was 0"
        side_effects:
          - "Milestone.released_by_user_id set to the acting X-User-ID and Milestone.released_at set to the logical clock"
          - "Milestone.version incremented by 1"
      - from: RELEASED
        to: ACCEPTED
        trigger: "POST /milestones/{id}/accept"
        actor: Client
        preconditions:
          - "Milestone.status == RELEASED"
          - "Client.account_credit_cents + ServiceOrder.deposit_held_cents - ServiceOrder.deposit_applied_cents >= Milestone.amount_cents"
        side_effects:
          - "ServiceOrder.billed_cents increased by amount_cents and unbilled_cents decreased by the same"
          - "the deposit is applied first: deposit_applied_cents increased by min(amount_cents, deposit_held_cents - deposit_applied_cents)"
          - "a MILESTONE_CHARGE LedgerEntry is appended for the negated residual (amount_cents minus the deposit portion applied); Client.account_credit_cents recomputed"
          - "Milestone.version incremented by 1"
      - from: RELEASED
        to: REJECTED
        trigger: "POST /milestones/{id}/reject"
        actor: Client
        preconditions:
          - "Milestone.status == RELEASED"
          - "Milestone.rejection_count < MILESTONE_REJECTION_RETRY_LIMIT (2)"
        side_effects:
          - "Milestone.rejection_count incremented by 1"
          - "Milestone.released_by_user_id and released_at cleared to null"
          - "Milestone.version incremented by 1"
      - from: REJECTED
        to: READY
        trigger: "system: same request as the rejection"
        actor: system
        preconditions:
          - "Milestone.rejection_count <= MILESTONE_REJECTION_RETRY_LIMIT (2)"
        side_effects: []
        note: "Closes the retry loop; REJECTED is an intra-request waypoint and the persisted value is READY."
      - from: READY
        to: CANCELLED
        trigger: "system: ServiceOrder cancellation or CASCADE B hop 3"
        actor: system
        preconditions:
          - "ServiceOrder.status moves to CANCELLED or VOIDED_BY_REBUILD in the same request"
        side_effects:
          - "when this was the last non-terminal Milestone of the order, CASCADE B hop 4 fires: a DEPOSIT_REFUND LedgerEntry is appended for deposit_held_cents minus deposit_applied_cents"
      - from: PENDING
        to: CANCELLED
        trigger: "system: ServiceOrder cancellation or CASCADE B hop 3"
        actor: system
        preconditions:
          - "ServiceOrder.status moves to CANCELLED or VOIDED_BY_REBUILD in the same request"
        side_effects:
          - "identical to the READY -> CANCELLED edge"
      - from: RELEASED
        to: CANCELLED
        trigger: "system: ServiceOrder cancellation or CASCADE B hop 3"
        actor: system
        preconditions:
          - "ServiceOrder.status moves to CANCELLED or VOIDED_BY_REBUILD in the same request"
        side_effects:
          - "identical to the READY -> CANCELLED edge"

  - entity: MoveJob
    axis: status
    shape: branching
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /move-jobs/{id}/status-transitions with to_status=SCHEDULED"
        actor: MoveCoordinator
        preconditions:
          - "MoveJob.status == DRAFT"
          - "MoveJob.move_technician_id IS NOT NULL"
          - "when Instrument.instrument_class == CONCERT_GRAND or crane_required is true: the crew lead's move_certified is true"
        side_effects:
          - "MoveJob.version incremented by 1"
      - from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /move-jobs/{id}/status-transitions with to_status=DISPATCHED"
        actor: MoveCoordinator
        preconditions:
          - "MoveJob.status == SCHEDULED"
          - "Instrument.custody_status IN {AT_CLIENT_SITE, IN_SHOP, SHOWROOM_FLOOR}"
        side_effects:
          - "MoveJob.version incremented by 1"
      - from: DISPATCHED
        to: IN_TRANSIT
        trigger: "system: POST /instruments/{id}/custody-transitions to IN_TRANSIT quoting this job as authorizing_move_job_id"
        actor: system
        preconditions:
          - "MoveJob.status == DISPATCHED"
        side_effects:
          - "MoveJob.version incremented by 1"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "system: POST /instruments/{id}/custody-transitions to IN_SHOP or AT_CLIENT_SITE quoting this job"
        actor: system
        preconditions:
          - "MoveJob.status == IN_TRANSIT"
        side_effects:
          - "Instrument.current_location_id set to MoveJob.destination_location_id"
          - "MoveJob.version incremented by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /move-jobs/{id}/status-transitions with to_status=CANCELLED"
        actor: MoveCoordinator
        preconditions:
          - "MoveJob.status IN {DRAFT, SCHEDULED}"
        side_effects:
          - "MoveJob.version incremented by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /move-jobs/{id}/status-transitions with to_status=CANCELLED"
        actor: MoveCoordinator
        preconditions:
          - "MoveJob.status IN {DRAFT, SCHEDULED}"
        side_effects:
          - "MoveJob.version incremented by 1"

  - entity: Warranty
    axis: status
    shape: branching
    initial_state: ACTIVE
    terminal_states: [VOIDED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /warranties/{id}/void, or CASCADE A hop 2, or the TuningRecall LAPSED sweep, or the climate check at validations priority 44"
        actor: ShopManager
        preconditions:
          - "Warranty.status == ACTIVE"
        side_effects:
          - "Warranty.void_reason set to the supplied or system-derived reason"
          - "CASCADE A hop 3: every WarrantyClaim of this warranty with status IN {SUBMITTED, UNDER_REVIEW} moves to DENIED, processed in WarrantyClaim.created_at ASC order"
          - "Warranty.version incremented by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /_ops/daily-sweep when the logical clock date is strictly after Warranty.end_date"
        actor: system
        preconditions:
          - "Warranty.status == ACTIVE"
        side_effects:
          - "Warranty.version incremented by 1"
      - from: ACTIVE
        to: TRANSFERRED
        trigger: "system: CASCADE C, fired by POST /consignment-agreements/{id}/record-sale"
        actor: system
        preconditions:
          - "Warranty.instrument_id == the sold instrument"
          - "Warranty.status == ACTIVE"
        side_effects:
          - "Warranty.client_id re-pointed to the buyer and transferred_from_client_id set to the consignor"
          - "Warranty.term_days replaced by the prorated remaining term per calculation warranty_transfer_term"
          - "Warranty.end_date recomputed from the sale date plus the prorated term"
          - "Warranty.version incremented by 1"
      - from: TRANSFERRED
        to: VOIDED
        trigger: "POST /warranties/{id}/void"
        actor: ShopManager
        preconditions:
          - "Warranty.status == TRANSFERRED"
        side_effects:
          - "identical to the ACTIVE -> VOIDED edge"
      - from: TRANSFERRED
        to: EXPIRED
        trigger: "system: POST /_ops/daily-sweep when the logical clock date is strictly after Warranty.end_date"
        actor: system
        preconditions:
          - "Warranty.status == TRANSFERRED"
        side_effects:
          - "Warranty.version incremented by 1"

  - entity: WarrantyClaim
    axis: status
    shape: branching
    initial_state: SUBMITTED
    terminal_states: [APPROVED_RESERVICE, APPROVED_CREDIT, DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /warranty-claims/{id}/review"
        actor: ShopManager
        preconditions:
          - "WarrantyClaim.status == SUBMITTED"
        side_effects:
          - "WarrantyClaim.version incremented by 1"
      - from: UNDER_REVIEW
        to: APPROVED_RESERVICE
        trigger: "POST /warranty-claims/{id}/adjudicate with decision=APPROVE"
        actor: ShopManager
        preconditions:
          - "WarrantyClaim.status == UNDER_REVIEW"
          - "WarrantyClaim.resolution_variant == FREE_RESERVICE"
          - "the acting X-User-ID differs from every released_by_user_id on the covered order's milestones"
        side_effects:
          - "WarrantyClaim.adjudicated_by_user_id set to the acting X-User-ID"
          - "WarrantyClaim.version incremented by 1"
      - from: UNDER_REVIEW
        to: APPROVED_CREDIT
        trigger: "POST /warranty-claims/{id}/adjudicate with decision=APPROVE"
        actor: ShopManager
        preconditions:
          - "WarrantyClaim.status == UNDER_REVIEW"
          - "WarrantyClaim.resolution_variant == PRORATED_CREDIT"
          - "the acting X-User-ID differs from every released_by_user_id on the covered order's milestones"
        side_effects:
          - "the provisional WARRANTY_CREDIT LedgerEntry stands; no reversal is appended"
          - "WarrantyClaim.adjudicated_by_user_id set to the acting X-User-ID"
          - "WarrantyClaim.version incremented by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /warranty-claims/{id}/adjudicate with decision=DENY"
        actor: ShopManager
        preconditions:
          - "WarrantyClaim.status == UNDER_REVIEW"
        side_effects:
          - "CASCADE A hop 4: a REVERSAL LedgerEntry is appended carrying the negation of the provisional WARRANTY_CREDIT row's amount_cents, with reverses_entry_id set to that row and warranty_claim_id set to this claim; the original row is left untouched"
          - "CASCADE A hop 5: Client.account_credit_cents recomputed as the plain sum over all of the client's entries; Client.version incremented by 1"
          - "WarrantyClaim.version incremented by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "system: CASCADE A hop 3, fired when the parent Warranty moves to VOIDED"
        actor: system
        preconditions:
          - "Warranty.status moves to VOIDED in the same request"
        side_effects:
          - "identical to the UNDER_REVIEW -> DENIED edge (hops 4 and 5 fire)"

  - entity: ConsignmentAgreement
    axis: status
    shape: branching
    initial_state: DRAFT
    terminal_states: [SOLD, EXPIRED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /consignment-agreements/{id}/activate"
        actor: ShowroomAgent
        preconditions:
          - "ConsignmentAgreement.status == DRAFT"
          - "Instrument.custody_status == IN_SHOP"
        side_effects:
          - "start_date set to the logical clock date and expires_at set to the clock plus CONSIGNMENT_TERM_DAYS (180)"
          - "advanced_restoration_cents set to the sum of contract_total_cents over this instrument's COMPLETED ServiceOrders whose service_type is REBUILD"
          - "ConsignmentAgreement.version incremented by 1"
      - from: ACTIVE
        to: LISTED
        trigger: "POST /consignment-agreements/{id}/list-showroom"
        actor: ShowroomAgent
        preconditions:
          - "ConsignmentAgreement.status == ACTIVE"
          - "the logical clock is strictly before expires_at"
        side_effects:
          - "Instrument.custody_status IN_SHOP -> SHOWROOM_FLOOR and Instrument.consignment_agreement_id set"
          - "ConsignmentAgreement.version incremented by 1"
      - from: LISTED
        to: SOLD
        trigger: "POST /consignment-agreements/{id}/record-sale"
        actor: ShowroomAgent
        preconditions:
          - "ConsignmentAgreement.status == LISTED"
          - "the logical clock is strictly before expires_at"
          - "sale_price_cents >= round_half_up(reserve_price_cents * CONSIGNMENT_SALE_FLOOR_PCT)"
          - "the acting X-User-ID differs from ConsignmentAgreement.created_by_user_id"
        side_effects:
          - "the proceeds split is computed and stored; a CONSIGNMENT_PROCEEDS LedgerEntry for consignor_payout_cents is appended to the consignor"
          - "Instrument.custody_status SHOWROOM_FLOOR -> SOLD and Instrument.client_id re-pointed to the buyer"
          - "CASCADE C: every ACTIVE Warranty on the instrument moves to TRANSFERRED with a prorated term; every ServiceOrder of the instrument with status IN {PENDING, IN_PROGRESS, ON_HOLD} has client_id re-pointed to the buyer"
          - "ConsignmentAgreement.version incremented by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /_ops/daily-sweep when the logical clock is at or after expires_at"
        actor: system
        preconditions:
          - "ConsignmentAgreement.status IN {ACTIVE, LISTED}"
        side_effects:
          - "Instrument.consignment_agreement_id cleared; when custody_status is SHOWROOM_FLOOR it returns to AT_CLIENT_SITE"
          - "ConsignmentAgreement.version incremented by 1"
      - from: LISTED
        to: EXPIRED
        trigger: "system: POST /_ops/daily-sweep when the logical clock is at or after expires_at"
        actor: system
        preconditions:
          - "ConsignmentAgreement.status IN {ACTIVE, LISTED}"
        side_effects:
          - "identical to the ACTIVE -> EXPIRED edge"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /consignment-agreements/{id}/withdraw"
        actor: ShowroomAgent
        preconditions:
          - "ConsignmentAgreement.status IN {ACTIVE, LISTED}"
        side_effects:
          - "Instrument.consignment_agreement_id cleared; when custody_status is SHOWROOM_FLOOR it returns to AT_CLIENT_SITE"
          - "ConsignmentAgreement.version incremented by 1"
      - from: LISTED
        to: WITHDRAWN
        trigger: "POST /consignment-agreements/{id}/withdraw"
        actor: ShowroomAgent
        preconditions:
          - "ConsignmentAgreement.status IN {ACTIVE, LISTED}"
        side_effects:
          - "identical to the ACTIVE -> WITHDRAWN edge"

  - entity: PartsLot
    axis: status
    shape: cyclic
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: DEPLETED
        trigger: "system: any allocation or consumption that drives on_hand_qty to 0"
        actor: system
        preconditions:
          - "PartsLot.on_hand_qty == 0 after the movement"
        side_effects:
          - "PartsLot.version incremented by 1"
      - from: DEPLETED
        to: OPEN
        trigger: "system: POST /parts-allocations/{id}/release restoring stock"
        actor: system
        preconditions:
          - "PartsLot.on_hand_qty > 0 after the release"
        side_effects:
          - "PartsLot.version incremented by 1"
        note: "The restock edge that makes this axis cyclic."

  - entity: PartsAllocation
    axis: status
    shape: branching
    initial_state: RESERVED
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: RESERVED
        to: CONSUMED
        trigger: "POST /parts-allocations/{id}/consume, or the ServiceOrder completion cascade"
        actor: Technician
        preconditions:
          - "PartsAllocation.status IN {RESERVED, PARTIAL}"
          - "ServiceOrder.status IN {IN_PROGRESS, COMPLETED}"
        side_effects:
          - "PartsLot.allocated_qty decreased by allocated_qty and PartsLot.consumed_qty increased by the same; on_hand_qty unchanged"
          - "PartsLot.version incremented by 1"
      - from: PARTIAL
        to: CONSUMED
        trigger: "POST /parts-allocations/{id}/consume"
        actor: Technician
        preconditions:
          - "PartsAllocation.status IN {RESERVED, PARTIAL}"
          - "ServiceOrder.status IN {IN_PROGRESS, COMPLETED}"
        side_effects:
          - "identical to the RESERVED -> CONSUMED edge"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /parts-allocations/{id}/release, or the ServiceOrder cancellation cascade"
        actor: ShopManager
        preconditions:
          - "PartsAllocation.status IN {RESERVED, PARTIAL}"
        side_effects:
          - "PartsLot.allocated_qty decreased by allocated_qty and PartsLot.on_hand_qty increased by the same; consumed_qty unchanged"
          - "PartsLot.status DEPLETED -> OPEN when on_hand_qty becomes greater than 0"
          - "PartsLot.version incremented by 1"
      - from: PARTIAL
        to: RELEASED
        trigger: "POST /parts-allocations/{id}/release"
        actor: ShopManager
        preconditions:
          - "PartsAllocation.status IN {RESERVED, PARTIAL}"
        side_effects:
          - "identical to the RESERVED -> RELEASED edge"

# ---------------------------------------------------------------------------
# CASCADE CHAINS (Difficulty Rule 4) - each hop is caused by the hop before it
# ---------------------------------------------------------------------------
cascades:
  - id: cascade-a-unauthorized-move
    depth: 5
    trigger: "POST /instruments/{id}/custody-transitions with to_custody_status=IN_TRANSIT and authorizing_move_job_id omitted"
    hops:
      - "hop 1 (Instrument): custody_status -> IN_TRANSIT and unauthorized_move_flag -> true"
      - "hop 2 (Warranty): BECAUSE unauthorized_move_flag became true, every Warranty of this instrument with status IN {ACTIVE, TRANSFERRED} moves to VOIDED with void_reason UNAUTHORIZED_MOVE, in Warranty.created_at ASC order"
      - "hop 3 (WarrantyClaim): BECAUSE a warranty moved to VOIDED, every WarrantyClaim of that warranty with status IN {SUBMITTED, UNDER_REVIEW} moves to DENIED, in WarrantyClaim.created_at ASC order"
      - "hop 4 (LedgerEntry): BECAUSE a claim moved to DENIED, a REVERSAL LedgerEntry carrying the negation of that claim's provisional WARRANTY_CREDIT amount_cents is appended, with reverses_entry_id pointing at the original row (which is never mutated)"
      - "hop 5 (Client): BECAUSE the ledger changed, Client.account_credit_cents is recomputed as the plain sum of amount_cents over all of that client's entries, and Client.version is incremented by 1"

  - id: cascade-b-rebuild-supersedes
    depth: 5
    trigger: "POST /quotes/{id}/approve where Quote.service_type == REBUILD"
    hops:
      - "hop 1 (Quote): status ISSUED -> APPROVED"
      - "hop 2 (ServiceOrder): BECAUSE a REBUILD quote for this instrument was approved, every ServiceOrder of the same instrument whose service_type is in {TUNE, PITCH_RAISE, REGULATE, VOICE} and whose status is in {PENDING, IN_PROGRESS, ON_HOLD} moves to VOIDED_BY_REBUILD, in ServiceOrder.created_at ASC order"
      - "hop 3 (Milestone): BECAUSE an order moved to VOIDED_BY_REBUILD, every Milestone of that order with status IN {PENDING, READY, RELEASED} moves to CANCELLED, in Milestone.sequence_index ASC order"
      - "hop 4 (LedgerEntry): BECAUSE the last non-terminal Milestone of the order reached CANCELLED, a DEPOSIT_REFUND LedgerEntry is appended for deposit_held_cents minus deposit_applied_cents, and ServiceOrder.deposit_refunded_cents is set to that amount"
      - "hop 5 (Client): BECAUSE the ledger changed, Client.account_credit_cents is recomputed and Client.version incremented by 1"

  - id: cascade-c-consignment-sale
    depth: 4
    trigger: "POST /consignment-agreements/{id}/record-sale"
    hops:
      - "hop 1 (ConsignmentAgreement): status LISTED -> SOLD with the proceeds split stored"
      - "hop 2 (Instrument): BECAUSE the agreement sold, custody_status SHOWROOM_FLOOR -> SOLD and client_id re-pointed to the buyer"
      - "hop 3 (Warranty): BECAUSE the instrument changed owner, every Warranty on it with status ACTIVE moves to TRANSFERRED with a prorated term"
      - "hop 4 (ServiceOrder): BECAUSE the warranty's beneficiary changed, every ServiceOrder of that instrument with status IN {PENDING, IN_PROGRESS, ON_HOLD} has client_id re-pointed to the buyer"

# ---------------------------------------------------------------------------
# 1.2.1 CONCURRENCY RULES (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: quote-create-stale-instrument
    parent_entity: Instrument
    write_endpoint: "POST /quotes"
    occ_field: "expected_instrument_version"
    description: |
      Creating a Quote against an Instrument whose version has advanced since
      the writer last read it is rejected. A quote's prices are derived from
      the instrument's class, location zone and effective pitch tier, so a
      writer holding a stale view would mint a quote priced from facts the
      instrument no longer has - and a newly minted quote legitimately
      supersedes the writer's intent for the same instrument.
    error_id: ERR_STALE_INSTRUMENT_VERSION
    http_status: 412

  - rule_id: consignment-create-stale-instrument
    parent_entity: Instrument
    write_endpoint: "POST /consignment-agreements"
    occ_field: "expected_instrument_version"
    description: |
      Creating a ConsignmentAgreement against an Instrument whose version has
      advanced is rejected. A new agreement legitimately supersedes a prior
      withdrawn or expired one, so the second writer's create would otherwise
      succeed on identical state; the stale version is what distinguishes an
      informed re-consignment from a blind one.
    error_id: ERR_STALE_INSTRUMENT_VERSION
    http_status: 412

  - rule_id: appointment-create-stale-route-day
    parent_entity: RouteDay
    write_endpoint: "POST /appointments"
    occ_field: "expected_route_day_version"
    description: |
      Booking an Appointment onto a RouteDay whose version has advanced since
      the writer read its remaining capacity is rejected. The writer's
      capacity arithmetic was performed against committed_minutes that the
      day no longer reports.
    error_id: ERR_STALE_ROUTE_DAY_VERSION
    http_status: 412

  - rule_id: parts-allocation-create-stale-lot
    parent_entity: PartsLot
    write_endpoint: "POST /service-orders/{id}/parts-allocations"
    occ_field: "expected_parts_lot_version"
    description: |
      Reserving units from a PartsLot whose version has advanced since the
      writer read on_hand_qty is rejected. A partial allocation is a legitimate
      outcome, so the second writer's request would otherwise succeed with a
      silently smaller allocated_qty than it believed it was asking for.
    error_id: ERR_STALE_PARTS_LOT_VERSION
    http_status: 412

  - rule_id: warranty-claim-create-stale-warranty
    parent_entity: Warranty
    write_endpoint: "POST /warranty-claims"
    occ_field: "expected_warranty_version"
    description: |
      Filing a WarrantyClaim against a Warranty whose version has advanced is
      rejected. A second claim is legitimate up to WARRANTY_CLAIM_LIMIT, and
      the provisional credit is computed from term_days and start_date, both of
      which a transfer or a prior claim can have moved under the writer.
    error_id: ERR_STALE_WARRANTY_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 CALCULATION RULES TABLE  (29 rules; 11 carry two or more variants)
# All money is integer cents. Every rounding point is ROUND_HALF_UP to whole
# cents unless the rule says otherwise. Division of days is integer division.
# ---------------------------------------------------------------------------
calculations:

  - name: pitch_tier_classification
    trigger: "POST /instruments/{id}/pitch-assessments"
    algorithm: threshold
    formula: |
      d = abs(measured_deviation_cents)
      if d <= PITCH_TIER_0_MAX_CENTS:        raw = TIER_0    # 0.0 <= d <= 5.0
      elif d <= PITCH_TIER_1_MAX_CENTS:      raw = TIER_1    # 5.0 <  d <= 15.0
      elif d <= PITCH_TIER_2_MAX_CENTS:      raw = TIER_2    # 15.0 <  d <= 35.0
      else:                                  raw = TIER_3    # d > 35.0
      raw_index = index of raw in [TIER_0, TIER_1, TIER_2, TIER_3]
      recall = governing recall (see input_set)
      bump = PITCH_TIER_OVERDUE_BUMP if recall exists and recall.overdue_tier in
             {OVERDUE_T2, LAPSED_TIER} else 0
      effective_index = min(3, raw_index + bump)
      Instrument.raw_pitch_tier      = TIER_<raw_index>
      Instrument.pitch_raise_tier    = TIER_<effective_index>
      Instrument.planned_visit_count = PITCH_TIER_VISIT_COUNT_TIER_<effective_index>
      Instrument.pitch_deviation_cents = measured_deviation_cents (signed, as supplied)
    input_set: |
      Governing recall selector - eligibility: TuningRecall rows with
      instrument_id == this instrument and status IN {PENDING, NOTIFIED, SCHEDULED}.
      Ranking: created_at DESC. Tie-break: due_date DESC. Second tie-break:
      days_overdue DESC. If candidates still tie they are interchangeable because
      overdue_tier - the only field the bump reads - is equal on both.
      Empty candidate set: bump is 0.
    constants:
      PITCH_TIER_0_MAX_CENTS: 5.0
      PITCH_TIER_1_MAX_CENTS: 15.0
      PITCH_TIER_2_MAX_CENTS: 35.0
      PITCH_TIER_OVERDUE_BUMP: 1
      PITCH_TIER_VISIT_COUNT_TIER_0: 1
      PITCH_TIER_VISIT_COUNT_TIER_1: 1
      PITCH_TIER_VISIT_COUNT_TIER_2: 1
      PITCH_TIER_VISIT_COUNT_TIER_3: 2
    precision: "cents deviation kept to 1 decimal place as supplied; tiers are enum values"
    variants:
      - name: RAW_BAND
        when: "no governing recall exists, or its overdue_tier is ON_TIME or OVERDUE_T1"
        difference: "pitch_raise_tier equals raw_pitch_tier; no bump is applied"
      - name: OVERDUE_BUMPED
        when: "the governing recall's overdue_tier is OVERDUE_T2 or LAPSED_TIER"
        difference: "pitch_raise_tier is one band above raw_pitch_tier, capped at TIER_3; the same measured deviation therefore produces a different service composition, duration and quote line count"

  - name: tuning_cycle_interval
    trigger: "POST /tuning-recalls (writes Instrument.tuning_cycle_interval_days and TuningRecall.interval_days)"
    algorithm: constraint_propagation
    formula: |
      base = CYCLE_BASE_DAYS_<Instrument.usage_tier>
      mult = CLIMATE_CONTROLLED_MULTIPLIER   if Location(Instrument.current_location_id).climate_controlled
             else CLIMATE_UNCONTROLLED_MULTIPLIER
      adj  = CLASS_CYCLE_ADJUST_DAYS_<Instrument.instrument_class>
      interval_days = max(MIN_CYCLE_INTERVAL_DAYS, floor(base * mult) + adj)
    input_set: "The instrument's usage_tier, its CURRENT location's climate_controlled flag, and its instrument_class. Three inputs interacting non-linearly through a floor and an outer max."
    constants:
      CYCLE_BASE_DAYS_HOME: 182
      CYCLE_BASE_DAYS_STUDIO: 120
      CYCLE_BASE_DAYS_INSTITUTIONAL: 91
      CYCLE_BASE_DAYS_PERFORMANCE: 45
      CLIMATE_CONTROLLED_MULTIPLIER: 1.00
      CLIMATE_UNCONTROLLED_MULTIPLIER: 0.75
      CLASS_CYCLE_ADJUST_DAYS_UPRIGHT: 0
      CLASS_CYCLE_ADJUST_DAYS_CONSOLE: 0
      CLASS_CYCLE_ADJUST_DAYS_BABY_GRAND: -7
      CLASS_CYCLE_ADJUST_DAYS_GRAND: -14
      CLASS_CYCLE_ADJUST_DAYS_CONCERT_GRAND: -21
      MIN_CYCLE_INTERVAL_DAYS: 30
    precision: "whole days; floor is applied to the product BEFORE the class adjustment is added, and the max floor is applied last"

  - name: recall_due_date
    trigger: "POST /tuning-recalls"
    algorithm: projection
    formula: |
      due_date = cycle_start_date + interval_days calendar days
    input_set: "cycle_start_date as supplied and interval_days from tuning_cycle_interval. Calendar arithmetic honours month lengths and leap days."
    constants: {}
    precision: "ISO date, no time component"

  - name: recall_overdue_tier
    trigger: "POST /_ops/daily-sweep"
    algorithm: threshold
    formula: |
      days_overdue = max(0, logical_clock_date - due_date) in whole days
      if days_overdue == 0:                    overdue_tier = ON_TIME
      elif days_overdue <= OVERDUE_T1_MAX_DAYS: overdue_tier = OVERDUE_T1   # 1..30
      elif days_overdue <= OVERDUE_T2_MAX_DAYS: overdue_tier = OVERDUE_T2   # 31..90
      else:                                     overdue_tier = LAPSED_TIER  # >= 91
    input_set: "TuningRecall rows with status IN {PENDING, NOTIFIED, SCHEDULED}, processed in created_at ASC order."
    constants:
      OVERDUE_T1_MIN_DAYS: 1
      OVERDUE_T1_MAX_DAYS: 30
      OVERDUE_T2_MIN_DAYS: 31
      OVERDUE_T2_MAX_DAYS: 90
      LAPSE_MIN_DAYS: 91
    precision: "whole days"

  - name: quote_line_composition
    trigger: "POST /quotes and POST /quotes/{id}/reissue"
    algorithm: aggregation
    formula: |
      lines = [ Quote.service_type ]
      if Quote.service_type == TUNE and Instrument.pitch_raise_tier in {TIER_1, TIER_2, TIER_3}:
          lines = [ TUNE, PITCH_RAISE ]
      Quote.line_count = len(lines)
    input_set: "The quote's own service_type plus the instrument's EFFECTIVE pitch_raise_tier (post-bump), never raw_pitch_tier."
    constants: {}
    precision: "integer count"

  - name: quote_pricing
    trigger: "POST /quotes and POST /quotes/{id}/reissue"
    algorithm: tiered_pricing
    formula: |
      # STEP 1 - per-line undiscounted base
      for each line L in quote_line_composition:
          line_base[L] = round_half_up(SERVICE_BASE_PRICE_CENTS_<L> * CLASS_PRICE_MULTIPLIER_<class>)
      base_price_cents = sum(line_base)

      # STEP 2 - discount pct from the client type (pricing_variant)
      if Client.client_type == DEALER:        pricing_variant = DEALER_NET;    pct = DEALER_NET_DISCOUNT_PCT
      elif Client.client_type == INSTITUTION: pricing_variant = INSTITUTIONAL; pct = INSTITUTIONAL_DISCOUNT_PCT
      else:                                   pricing_variant = RETAIL;        pct = RETAIL_DISCOUNT_PCT

      # STEP 3 - ROUNDING ORDER IS PINNED: round EACH LINE after its own
      # discount, THEN sum. Summing first and rounding once is WRONG and can
      # differ by a cent.
      for each line L: line_net[L] = round_half_up(line_base[L] * (1 - pct))
      net_sum = sum(line_net)
      line_discount_cents = base_price_cents - net_sum

      # STEP 4 - zone surcharge from the instrument's CURRENT location
      zone_surcharge_cents = ZONE_SURCHARGE_CENTS_<Location.zone_code>

      # STEP 5
      subtotal_cents = net_sum + zone_surcharge_cents

      # STEP 6 - loyalty discount, keyed on subtotal_cents (see loyalty_discount)
      loyalty_discount_cents = loyalty_discount(subtotal_cents)

      # STEP 7
      total_cents = subtotal_cents - loyalty_discount_cents
    input_set: "One or two service lines from quote_line_composition, the owning Client's client_type, and the zone_code of Location(Instrument.current_location_id)."
    constants:
      SERVICE_BASE_PRICE_CENTS_TUNE: 19500
      SERVICE_BASE_PRICE_CENTS_PITCH_RAISE: 9500
      SERVICE_BASE_PRICE_CENTS_REGULATE: 85000
      SERVICE_BASE_PRICE_CENTS_VOICE: 42000
      SERVICE_BASE_PRICE_CENTS_REBUILD: 1450000
      CLASS_PRICE_MULTIPLIER_UPRIGHT: 1.00
      CLASS_PRICE_MULTIPLIER_CONSOLE: 1.05
      CLASS_PRICE_MULTIPLIER_BABY_GRAND: 1.20
      CLASS_PRICE_MULTIPLIER_GRAND: 1.35
      CLASS_PRICE_MULTIPLIER_CONCERT_GRAND: 1.75
      DEALER_NET_DISCOUNT_PCT: 0.18
      INSTITUTIONAL_DISCOUNT_PCT: 0.08
      RETAIL_DISCOUNT_PCT: 0.00
      ZONE_SURCHARGE_CENTS_ZONE_A: 0
      ZONE_SURCHARGE_CENTS_ZONE_B: 4500
      ZONE_SURCHARGE_CENTS_ZONE_C: 11000
    precision: "whole cents, ROUND_HALF_UP, applied once per line at STEP 3 and once at STEP 6"
    variants:
      - name: RETAIL
        when: "Client.client_type == INDIVIDUAL"
        difference: "pct is 0.00, so line_net equals line_base and line_discount_cents is 0"
      - name: DEALER_NET
        when: "Client.client_type == DEALER"
        difference: "pct is 0.18 applied per line before rounding"
      - name: INSTITUTIONAL
        when: "Client.client_type == INSTITUTION"
        difference: "pct is 0.08 applied per line before rounding, and the deposit switches to the NET_TERMS branch"

  - name: loyalty_discount
    trigger: "STEP 6 of quote_pricing"
    algorithm: threshold
    formula: |
      # The tier is keyed on subtotal_cents, NEVER on total_cents. Keying it on
      # total_cents would be circular (total depends on the discount), so the
      # evaluation order is pinned here: subtotal is fully formed at STEP 5,
      # the tier is read off subtotal, and total is STEP 7.
      if subtotal_cents >= LOYALTY_TIER_2_MIN_CENTS:      pct = LOYALTY_TIER_2_PCT
      elif subtotal_cents >= LOYALTY_TIER_1_MIN_CENTS:    pct = LOYALTY_TIER_1_PCT
      else:                                               pct = 0.00
      loyalty_discount_cents = round_half_up(subtotal_cents * pct)
    input_set: "subtotal_cents only."
    constants:
      LOYALTY_TIER_1_MIN_CENTS: 119250
      LOYALTY_TIER_2_MIN_CENTS: 1450000
      LOYALTY_TIER_1_PCT: 0.03
      LOYALTY_TIER_2_PCT: 0.06
    precision: "whole cents, ROUND_HALF_UP"

  - name: deposit_required
    trigger: "POST /quotes and POST /quotes/{id}/reissue, after quote_pricing"
    algorithm: threshold
    formula: |
      pct = DEPOSIT_PCT_<Quote.service_type>
      if pct == 0.00:
          deposit_variant = PERCENT_OF_CONTRACT
          deposit_required_cents = 0
      elif Client.client_type == INSTITUTION:
          deposit_variant = NET_TERMS
          deposit_required_cents = round_half_up(total_cents * DEPOSIT_NET_TERMS_PCT)
      else:
          raw = round_half_up(total_cents * pct)
          if raw >= DEPOSIT_FLAT_MINIMUM_CENTS:
              deposit_variant = PERCENT_OF_CONTRACT
              deposit_required_cents = raw
          else:
              deposit_variant = FLAT_MINIMUM
              deposit_required_cents = DEPOSIT_FLAT_MINIMUM_CENTS
    input_set: "Quote.total_cents, Quote.service_type, Client.client_type."
    constants:
      DEPOSIT_PCT_TUNE: 0.00
      DEPOSIT_PCT_PITCH_RAISE: 0.00
      DEPOSIT_PCT_REGULATE: 0.25
      DEPOSIT_PCT_VOICE: 0.25
      DEPOSIT_PCT_REBUILD: 0.40
      DEPOSIT_FLAT_MINIMUM_CENTS: 25000
      DEPOSIT_NET_TERMS_PCT: 0.10
    precision: "whole cents, ROUND_HALF_UP"
    variants:
      - name: PERCENT_OF_CONTRACT
        when: "the service class carries a zero deposit pct, or the percentage result reaches the flat minimum"
        difference: "deposit is the percentage of total_cents (or exactly 0 for TUNE and PITCH_RAISE)"
      - name: FLAT_MINIMUM
        when: "a non-INSTITUTION client and round_half_up(total_cents * pct) < 25000"
        difference: "deposit is pinned at 25000 regardless of the contract size, so a smaller contract can owe a LARGER deposit than the percentage suggests"
      - name: NET_TERMS
        when: "Client.client_type == INSTITUTION and the service class carries a non-zero deposit pct"
        difference: "deposit is 10% of total_cents with no flat floor, so an institution can owe less than the 25000 a private client would owe on the same contract"

  - name: milestone_waterfall
    trigger: "POST /service-orders"
    algorithm: waterfall_allocation
    formula: |
      n = MILESTONE_COUNT_<ServiceOrder.service_type>
      share = floor(contract_total_cents / n)
      for i in 1..n-1: Milestone[i].amount_cents = share
      Milestone[n].amount_cents = contract_total_cents - share * (n - 1)
      labels:
        REBUILD  -> ["DISASSEMBLY", "STRINGING", "ACTION_REGULATION", "FINAL_VOICING"]
        REGULATE -> ["ACTION_PREP", "FINAL_REGULATION"]
        VOICE    -> ["HAMMER_PREP", "FINAL_VOICING"]
        TUNE     -> ["COMPLETION"]
        PITCH_RAISE -> ["COMPLETION"]
    input_set: "ServiceOrder.contract_total_cents and service_type. The remainder always lands on the HIGHEST sequence_index."
    constants:
      MILESTONE_COUNT_TUNE: 1
      MILESTONE_COUNT_PITCH_RAISE: 1
      MILESTONE_COUNT_REGULATE: 2
      MILESTONE_COUNT_VOICE: 2
      MILESTONE_COUNT_REBUILD: 4
    precision: "whole cents; sum over milestones equals contract_total_cents exactly (conservation invariant service-order-billing-conservation)"

  - name: service_order_duration
    trigger: "POST /service-orders"
    algorithm: threshold
    formula: |
      base = round_half_up(SERVICE_BASE_MINUTES_<service_type> * CLASS_MINUTE_MULTIPLIER_<class>)
      if service_type == TUNE and Instrument.pitch_raise_tier in {TIER_1, TIER_2, TIER_3}:
          base = base + PITCH_RAISE_PASS_MINUTES
      if base > SPLIT_VISIT_THRESHOLD_MINUTES:
          visit_plan_variant = SPLIT_VISIT
          estimated_minutes  = base + PITCH_RAISE_PASS_MINUTES   # re-setup on the second visit
      else:
          visit_plan_variant = SINGLE_VISIT
          estimated_minutes  = base
    input_set: "The order's service_type, the instrument's class and its effective pitch_raise_tier."
    constants:
      SERVICE_BASE_MINUTES_TUNE: 60
      SERVICE_BASE_MINUTES_PITCH_RAISE: 35
      SERVICE_BASE_MINUTES_REGULATE: 240
      SERVICE_BASE_MINUTES_VOICE: 150
      SERVICE_BASE_MINUTES_REBUILD: 2400
      CLASS_MINUTE_MULTIPLIER_UPRIGHT: 1.00
      CLASS_MINUTE_MULTIPLIER_CONSOLE: 1.00
      CLASS_MINUTE_MULTIPLIER_BABY_GRAND: 1.15
      CLASS_MINUTE_MULTIPLIER_GRAND: 1.30
      CLASS_MINUTE_MULTIPLIER_CONCERT_GRAND: 1.60
      SPLIT_VISIT_THRESHOLD_MINUTES: 300
      PITCH_RAISE_PASS_MINUTES: 35
    precision: "whole minutes, ROUND_HALF_UP on the multiplier product"
    variants:
      - name: SINGLE_VISIT
        when: "base minutes <= 300"
        difference: "estimated_minutes equals base"
      - name: SPLIT_VISIT
        when: "base minutes > 300 (strictly greater)"
        difference: "estimated_minutes equals base + 35, because a second visit repeats the setup pass"

  - name: appointment_service_minutes
    trigger: "POST /appointments and POST /appointments/{id}/reschedule"
    algorithm: threshold
    formula: |
      service_minutes = round_half_up(SERVICE_BASE_MINUTES_<Appointment.service_type> *
                                      CLASS_MINUTE_MULTIPLIER_<Instrument.instrument_class>)
      if Appointment.service_type == TUNE and Instrument.pitch_raise_tier in {TIER_1, TIER_2, TIER_3}:
          service_minutes = service_minutes + PITCH_RAISE_PASS_MINUTES
    input_set: "One appointment stop; the split-visit adjustment of service_order_duration does NOT apply to a single stop."
    constants:
      PITCH_RAISE_PASS_MINUTES: 35
    precision: "whole minutes"

  - name: appointment_travel_buffer
    trigger: "POST /appointments and POST /appointments/{id}/reschedule"
    algorithm: interval_merge
    formula: |
      same_address_chained = EXISTS Appointment A2 such that
          A2.route_day_id == this.route_day_id
          AND A2.scheduling_status IN {SCHEDULED, CONFIRMED}
          AND A2.created_at < this.created_at
          AND Location(A2.location_id).address_key == Location(this.location_id).address_key
      if same_address_chained:                                   buffer = SAME_ADDRESS_CHAIN_BUFFER_MINUTES
      elif Location.zone_code IN Technician.zone_codes:           buffer = TRAVEL_BUFFER_SAME_ZONE_MINUTES
      else:                                                       buffer = TRAVEL_BUFFER_CROSS_ZONE_MINUTES
      total_block_minutes = service_minutes + buffer
    input_set: "Appointments already on the target route day whose scheduling_status is SCHEDULED or CONFIRMED, compared on Location.address_key by exact string equality."
    constants:
      SAME_ADDRESS_CHAIN_BUFFER_MINUTES: 5
      TRAVEL_BUFFER_SAME_ZONE_MINUTES: 25
      TRAVEL_BUFFER_CROSS_ZONE_MINUTES: 55
    precision: "whole minutes"
    variants:
      - name: SAME_ADDRESS_CHAINED
        when: "an earlier SCHEDULED or CONFIRMED stop on the same route day shares the address_key"
        difference: "buffer collapses to 5 minutes AND the stop earns the same-address price discount"
      - name: DISTINCT_ADDRESS
        when: "no earlier stop on the day shares the address_key"
        difference: "buffer is 25 minutes in-zone or 55 minutes for an out-of-zone location served for an in-zone client, and no discount applies"

  - name: appointment_estimated_price
    trigger: "POST /appointments and POST /appointments/{id}/reschedule"
    algorithm: tiered_pricing
    formula: |
      list_price = round_half_up(SERVICE_BASE_PRICE_CENTS_<service_type> * CLASS_PRICE_MULTIPLIER_<class>)
      if service_type == TUNE and Instrument.pitch_raise_tier in {TIER_1, TIER_2, TIER_3}:
          list_price = list_price + round_half_up(SERVICE_BASE_PRICE_CENTS_PITCH_RAISE *
                                                  CLASS_PRICE_MULTIPLIER_<class>)
      if same_address_chained:
          estimated_price_cents = list_price - round_half_up(list_price * SAME_ADDRESS_DISCOUNT_PCT)
      else:
          estimated_price_cents = list_price
    input_set: "List pricing only - client_type discounts and zone surcharges belong to the Quote, not to an appointment estimate."
    constants:
      SAME_ADDRESS_DISCOUNT_PCT: 0.20
    precision: "whole cents, ROUND_HALF_UP"

  - name: route_day_committed_minutes
    trigger: "any endpoint that creates, reschedules, cancels or cascade-cancels an Appointment"
    algorithm: aggregation
    formula: |
      RouteDay.committed_minutes = sum(A.total_block_minutes for A where
          A.route_day_id == RouteDay.id AND A.scheduling_status IN {SCHEDULED, CONFIRMED})
      RouteDay.stop_count = count of the same set
    input_set: "Appointments filtered on scheduling_status IN {SCHEDULED, CONFIRMED}; REQUESTED, RESCHEDULED and CANCELLED rows are excluded. Recomputed from scratch, never patched incrementally."
    constants: {}
    precision: "whole minutes; the sum is order-independent"

  - name: move_stair_component
    trigger: "POST /move-jobs"
    algorithm: threshold
    formula: |
      eff(loc) = 0 if loc.has_service_elevator else loc.stair_flights
      stair_flights_total = eff(origin) + eff(destination)
      if stair_flights_total >= MOVE_STAIR_BUNDLE_THRESHOLD_FLIGHTS:
          stair_cents = MOVE_STAIR_BUNDLE_FLAT_CENTS
      else:
          stair_cents = stair_flights_total * MOVE_STAIR_PER_FLIGHT_CENTS
    input_set: "Both locations' stair_flights and has_service_elevator."
    constants:
      MOVE_STAIR_PER_FLIGHT_CENTS: 9000
      MOVE_STAIR_BUNDLE_THRESHOLD_FLIGHTS: 4
      MOVE_STAIR_BUNDLE_FLAT_CENTS: 25000
    precision: "whole cents"
    variants:
      - name: PER_FLIGHT
        when: "stair_flights_total <= 3"
        difference: "9000 cents per flight; 3 flights cost 27000"
      - name: BUNDLE_FLAT
        when: "stair_flights_total >= 4"
        difference: "flat 25000 regardless of flight count - so 4 flights (25000) cost LESS than 3 flights (27000); the price is NOT monotone in stair_flights_total"

  - name: move_distance_component
    trigger: "POST /move-jobs"
    algorithm: tiered_pricing
    formula: |
      if distance_miles <= MOVE_LOCAL_MAX_MILES:
          distance_band = LOCAL;      distance_variant = FLAT_LOCAL
          distance_cents = MOVE_LOCAL_FLAT_CENTS
      elif distance_miles <= MOVE_REGIONAL_MAX_MILES:
          distance_band = REGIONAL;   distance_variant = PER_MILE
          distance_cents = round_half_up(distance_miles * MOVE_PER_MILE_CENTS)
      else:
          distance_band = LONG_HAUL;  distance_variant = LONG_HAUL_FLAT
          distance_cents = MOVE_LONG_HAUL_FLAT_CENTS
    input_set: "MoveJob.distance_miles only."
    constants:
      MOVE_LOCAL_MAX_MILES: 25.0
      MOVE_REGIONAL_MAX_MILES: 150.0
      MOVE_LOCAL_FLAT_CENTS: 6000
      MOVE_PER_MILE_CENTS: 420
      MOVE_LONG_HAUL_FLAT_CENTS: 52000
    precision: "whole cents, ROUND_HALF_UP on the per-mile product"
    variants:
      - name: PER_MILE
        when: "25.0 < distance_miles <= 150.0"
        difference: "420 cents per mile; at exactly 150.0 miles this is 63000"
      - name: LONG_HAUL_FLAT
        when: "distance_miles > 150.0"
        difference: "flat 52000 - so a 151-mile move is CHEAPER than a 150-mile move; the price is NOT monotone in distance_miles"

  - name: move_pricing
    trigger: "POST /move-jobs"
    algorithm: tiered_pricing
    formula: |
      base_cents    = MOVE_BASE_CENTS_<Instrument.instrument_class>
      stair_cents   = move_stair_component
      crane_cents   = MOVE_CRANE_CENTS if crane_required else 0
      distance_cents = move_distance_component
      climate_cents = MOVE_CLIMATE_TRANSPORT_CENTS if climate_controlled_transport else 0
      total_cents   = base_cents + stair_cents + crane_cents + distance_cents + climate_cents
    input_set: "Five independent components; there is no discount and no rounding after the sum."
    constants:
      MOVE_BASE_CENTS_UPRIGHT: 28000
      MOVE_BASE_CENTS_CONSOLE: 32000
      MOVE_BASE_CENTS_BABY_GRAND: 52000
      MOVE_BASE_CENTS_GRAND: 68000
      MOVE_BASE_CENTS_CONCERT_GRAND: 145000
      MOVE_CRANE_CENTS: 185000
      MOVE_CLIMATE_TRANSPORT_CENTS: 38000
    precision: "whole cents"

  - name: cancellation_fee
    trigger: "POST /appointments/{id}/cancel and POST /appointments/{id}/no-show"
    algorithm: threshold
    formula: |
      lead_hours = (Appointment.scheduled_start_utc - logical_clock) in hours as a real number
      if Appointment.fulfillment_status in {EN_ROUTE, IN_PROGRESS}:
          variant = DISPATCHED_TIER
          fee = max(round_half_up(estimated_price_cents * CANCEL_DISPATCHED_PCT),
                    CANCEL_DISPATCHED_MIN_CENTS)
      else:
          variant = LEAD_TIME_TIER
          if lead_hours >= CANCEL_TIER_A_MIN_HOURS:   fee = 0
          elif lead_hours >= CANCEL_TIER_B_MIN_HOURS: fee = round_half_up(estimated_price_cents * CANCEL_TIER_B_PCT)
          else:                                       fee = round_half_up(estimated_price_cents * CANCEL_TIER_C_PCT)
      # deposit interaction: when the appointment carries a service_order_id whose
      # order still holds a deposit, the fee is charged against the deposit first:
      #   forfeit = min(fee, deposit_held_cents - deposit_applied_cents - deposit_refunded_cents)
      #   ServiceOrder.deposit_forfeited_cents += forfeit
      #   residual = fee - forfeit
      #   when residual > 0 a CANCELLATION_FEE LedgerEntry for -residual is appended
      # when there is no linked order the whole fee posts as a CANCELLATION_FEE entry.
    input_set: "The appointment's own estimated_price_cents and fulfillment_status, plus the linked order's deposit fields."
    constants:
      CANCEL_TIER_A_MIN_HOURS: 72.0
      CANCEL_TIER_B_MIN_HOURS: 24.0
      CANCEL_TIER_B_PCT: 0.15
      CANCEL_TIER_C_PCT: 0.35
      CANCEL_DISPATCHED_PCT: 0.60
      CANCEL_DISPATCHED_MIN_CENTS: 15000
    precision: "whole cents, ROUND_HALF_UP; lead_hours compared with >= at both boundaries"
    variants:
      - name: LEAD_TIME_TIER
        when: "fulfillment_status is PENDING"
        difference: "three lead-time bands, 0 / 15% / 35%, with no floor"
      - name: DISPATCHED_TIER
        when: "fulfillment_status is EN_ROUTE or IN_PROGRESS"
        difference: "flat 60% with a 15000 floor and NO lead-time consideration - a cancellation 10 days out but after dispatch costs more than one an hour out before dispatch"

  - name: reschedule_fee
    trigger: "POST /appointments/{id}/reschedule"
    algorithm: threshold
    formula: |
      lead_hours = (Appointment.scheduled_start_utc - logical_clock) in hours as a real number
      if Appointment.fulfillment_status in {EN_ROUTE, IN_PROGRESS}: fee = RESCHEDULE_DISPATCHED_FEE_CENTS
      elif lead_hours >= RESCHEDULE_FREE_HOURS:                     fee = 0
      else:                                                          fee = RESCHEDULE_FEE_CENTS
      when fee > 0 a CANCELLATION_FEE LedgerEntry for -fee is appended and
      Client.account_credit_cents is recomputed.
    input_set: "The appointment being rescheduled."
    constants:
      RESCHEDULE_FREE_HOURS: 48
      RESCHEDULE_FEE_CENTS: 7500
      RESCHEDULE_DISPATCHED_FEE_CENTS: 20000
    precision: "whole cents"

  - name: climate_out_of_band_evaluation
    trigger: "POST /climate-readings and POST /_clock/set_current_utc (recomputed for every Location that has at least one reading)"
    algorithm: aggregation
    formula: |
      window_start = logical_clock - CLIMATE_LOOKBACK_WINDOW_DAYS days
      in_window = ClimateReading rows for this location with
                  window_start <= recorded_at_utc <= logical_clock   (BOTH bounds inclusive)
      readings_in_window = count(in_window)
      out_of_band_count  = count of in_window where relative_humidity_pct < CLIMATE_RH_BAND_MIN_PCT
                                                 or relative_humidity_pct > CLIMATE_RH_BAND_MAX_PCT
      if readings_in_window < CLIMATE_MIN_READINGS_FOR_EVALUATION:
          out_of_band_flag = false
      else:
          out_of_band_flag = (out_of_band_count / readings_in_window) > CLIMATE_OUT_OF_BAND_RATIO_THRESHOLD
      ClimateReading.in_band = (CLIMATE_RH_BAND_MIN_PCT <= relative_humidity_pct <= CLIMATE_RH_BAND_MAX_PCT)
    input_set: "All ClimateReading rows for the location inside the closed lookback window; readings outside it are ignored entirely."
    constants:
      CLIMATE_LOOKBACK_WINDOW_DAYS: 180
      CLIMATE_RH_BAND_MIN_PCT: 35.0
      CLIMATE_RH_BAND_MAX_PCT: 55.0
      CLIMATE_OUT_OF_BAND_RATIO_THRESHOLD: 0.25
      CLIMATE_MIN_READINGS_FOR_EVALUATION: 4
    precision: "ratio compared with STRICT greater-than; exactly 0.25 does NOT trip the flag"

  - name: warranty_term
    trigger: "POST /service-orders/{id}/complete"
    algorithm: projection
    formula: |
      term_days = WARRANTY_TERM_DAYS_<ServiceOrder.service_type>
      start_date = logical clock date at completion
      end_date   = start_date + term_days calendar days
      covered_price_cents = ServiceOrder.contract_total_cents
    input_set: "The completing order only."
    constants:
      WARRANTY_TERM_DAYS_TUNE: 90
      WARRANTY_TERM_DAYS_PITCH_RAISE: 45
      WARRANTY_TERM_DAYS_REGULATE: 365
      WARRANTY_TERM_DAYS_VOICE: 180
      WARRANTY_TERM_DAYS_REBUILD: 1095
    precision: "whole days, calendar arithmetic"

  - name: warranty_claim_resolution
    trigger: "POST /warranty-claims"
    algorithm: decay_function
    formula: |
      days_elapsed = (logical clock date - Warranty.start_date) in whole days
      elapsed_fraction = round(min(1.0, max(0.0, days_elapsed / Warranty.term_days)), 4)
      if elapsed_fraction < WARRANTY_PRORATION_THRESHOLD:
          resolution_variant = FREE_RESERVICE
          credit_cents = 0
          # no LedgerEntry is appended
      else:
          resolution_variant = PRORATED_CREDIT
          credit_cents = round_half_up(Warranty.covered_price_cents * (1 - elapsed_fraction))
          # a provisional WARRANTY_CREDIT LedgerEntry for +credit_cents is appended
          # immediately at submission and reversed if the claim is later denied
    input_set: "The named warranty only; other claims on the same warranty do not change the fraction."
    constants:
      WARRANTY_PRORATION_THRESHOLD: 0.50
    precision: "elapsed_fraction rounded HALF_UP to 4 decimals BEFORE the comparison and before the credit multiplication; credit rounded HALF_UP to whole cents"
    variants:
      - name: FREE_RESERVICE
        when: "elapsed_fraction < 0.50 (strictly less)"
        difference: "no money moves; the client is entitled to a re-service and credit_cents is 0"
      - name: PRORATED_CREDIT
        when: "elapsed_fraction >= 0.50"
        difference: "a money credit of covered_price_cents * (1 - elapsed_fraction) is posted provisionally at submission"

  - name: warranty_transfer_term
    trigger: "CASCADE C, fired by POST /consignment-agreements/{id}/record-sale"
    algorithm: decay_function
    formula: |
      days_elapsed = (sale date - Warranty.start_date) in whole days
      remaining    = Warranty.term_days - days_elapsed
      new_term_days = max(WARRANTY_TRANSFER_PRORATION_FLOOR_DAYS, remaining)
      Warranty.start_date = sale date
      Warranty.term_days  = new_term_days
      Warranty.end_date   = sale date + new_term_days calendar days
    input_set: "Every Warranty on the sold instrument whose status is ACTIVE, processed in created_at ASC order."
    constants:
      WARRANTY_TRANSFER_PRORATION_FLOOR_DAYS: 30
    precision: "whole days; the floor means a nearly-exhausted warranty still transfers with 30 days of cover"

  - name: consignment_proceeds_split
    trigger: "POST /consignment-agreements/{id}/record-sale"
    algorithm: waterfall_allocation
    formula: |
      advance_recovered_cents = min(advanced_restoration_cents, sale_price_cents)
      residual = sale_price_cents - advance_recovered_cents
      if sale_price_cents <= reserve_price_cents:
          split_variant = AT_OR_BELOW_RESERVE
          commission = round_half_up(residual * CONSIGNMENT_BASE_COMMISSION_PCT)
      else:
          split_variant = ABOVE_RESERVE
          excess         = sale_price_cents - reserve_price_cents
          reserve_part   = max(0, residual - excess)
          excess_part    = residual - reserve_part
          commission = round_half_up(reserve_part * CONSIGNMENT_ABOVE_RESERVE_COMMISSION_PCT)
                     + round_half_up(excess_part  * CONSIGNMENT_ABOVE_RESERVE_BONUS_PCT)
      consignor_payout_cents = residual - commission
      shop_commission_cents  = sale_price_cents - advance_recovered_cents - consignor_payout_cents
    input_set: "The agreement's own advanced_restoration_cents, reserve_price_cents and the supplied sale_price_cents. The shop's commission is computed LAST as the residual so any rounding remainder lands on the shop and the proceeds conserve exactly."
    constants:
      CONSIGNMENT_BASE_COMMISSION_PCT: 0.25
      CONSIGNMENT_ABOVE_RESERVE_COMMISSION_PCT: 0.15
      CONSIGNMENT_ABOVE_RESERVE_BONUS_PCT: 0.50
    precision: "whole cents, ROUND_HALF_UP on each of the two commission legs independently, then the payout as an exact subtraction"
    variants:
      - name: AT_OR_BELOW_RESERVE
        when: "sale_price_cents <= reserve_price_cents"
        difference: "a single 25% commission on the whole residual"
      - name: ABOVE_RESERVE
        when: "sale_price_cents > reserve_price_cents"
        difference: "15% on the reserve portion plus a 50% bonus on the excess, so the marginal commission rate JUMPS above reserve while the average rate can fall below 25%"

  - name: consignment_sale_floor
    trigger: "POST /consignment-agreements/{id}/record-sale"
    algorithm: threshold
    formula: |
      floor_cents = round_half_up(reserve_price_cents * CONSIGNMENT_SALE_FLOOR_PCT)
      accept when sale_price_cents >= floor_cents, otherwise ERR_SALE_BELOW_FLOOR
    input_set: "The agreement's reserve_price_cents."
    constants:
      CONSIGNMENT_SALE_FLOOR_PCT: 0.80
    precision: "whole cents; the comparison is >= so a sale exactly at the floor is accepted"

  - name: parts_requirement_qty
    trigger: "informational, surfaced when a REBUILD ServiceOrder is created"
    algorithm: aggregation
    formula: |
      required = {
        HAMMER_SET:   PARTS_REQ_QTY_HAMMER_SET,
        STRING_SET:   PARTS_REQ_QTY_STRING_SET,
        ACTION_PARTS: PARTS_REQ_QTY_ACTION_PARTS_<Instrument.instrument_class>
      }
    input_set: "Instrument class of the rebuilt instrument."
    constants:
      PARTS_REQ_QTY_HAMMER_SET: 1
      PARTS_REQ_QTY_STRING_SET: 1
      PARTS_REQ_QTY_ACTION_PARTS_UPRIGHT: 2
      PARTS_REQ_QTY_ACTION_PARTS_CONSOLE: 2
      PARTS_REQ_QTY_ACTION_PARTS_BABY_GRAND: 3
      PARTS_REQ_QTY_ACTION_PARTS_GRAND: 4
      PARTS_REQ_QTY_ACTION_PARTS_CONCERT_GRAND: 6
    precision: "whole units"

  - name: parts_allocation_resolution
    trigger: "POST /service-orders/{id}/parts-allocations"
    algorithm: waterfall_allocation
    formula: |
      available = PartsLot.on_hand_qty
      min_partial = ceil(requested_qty * PARTIAL_ALLOCATION_MIN_PCT)
      if available >= requested_qty:
          status = RESERVED;  allocated_qty = requested_qty
      elif available >= min_partial:
          status = PARTIAL;   allocated_qty = available
      else:
          reject with ERR_PARTS_INSUFFICIENT
      PartsLot.on_hand_qty   -= allocated_qty
      PartsLot.allocated_qty += allocated_qty
      PartsLot.status = DEPLETED when on_hand_qty == 0
    input_set: "One lot's on_hand_qty at the instant of the call."
    constants:
      PARTIAL_ALLOCATION_MIN_PCT: 0.50
    precision: "whole units; ceil is applied to the partial floor so requesting 5 with 2 on hand (min_partial 3) is REJECTED while requesting 4 with 2 on hand (min_partial 2) is PARTIAL"
    variants:
      - name: FULL_RESERVE
        when: "on_hand_qty >= requested_qty"
        difference: "allocated_qty equals requested_qty and status is RESERVED"
      - name: PARTIAL_RESERVE
        when: "ceil(requested_qty * 0.50) <= on_hand_qty < requested_qty"
        difference: "allocated_qty equals whatever remains on hand and status is PARTIAL; the shortfall is silently absorbed rather than erroring"

  - name: technician_certification_gate
    trigger: "POST /service-orders, POST /appointments, POST /route-days/{id}/status-transitions to DISPATCHED"
    algorithm: threshold
    formula: |
      rank(level) = TECH_CERT_RANK_<level>
      required    = SERVICE_MIN_CERT_RANK_<service_type>
      pass when rank(Technician.certification_level) >= required, else ERR_TECH_CERT_INSUFFICIENT
    input_set: "The technician attached to the order, appointment or route day."
    constants:
      TECH_CERT_RANK_APPRENTICE: 1
      TECH_CERT_RANK_JOURNEYMAN: 2
      TECH_CERT_RANK_MASTER: 3
      SERVICE_MIN_CERT_RANK_TUNE: 1
      SERVICE_MIN_CERT_RANK_PITCH_RAISE: 2
      SERVICE_MIN_CERT_RANK_REGULATE: 2
      SERVICE_MIN_CERT_RANK_VOICE: 2
      SERVICE_MIN_CERT_RANK_REBUILD: 3
    precision: "integer rank comparison with >="

  - name: milestone_settlement
    trigger: "POST /milestones/{id}/accept"
    algorithm: waterfall_allocation
    formula: |
      available_deposit = ServiceOrder.deposit_held_cents
                        - ServiceOrder.deposit_applied_cents
                        - ServiceOrder.deposit_refunded_cents
                        - ServiceOrder.deposit_forfeited_cents
      applied  = min(Milestone.amount_cents, available_deposit)
      residual = Milestone.amount_cents - applied
      ServiceOrder.deposit_applied_cents += applied
      ServiceOrder.billed_cents          += Milestone.amount_cents
      ServiceOrder.unbilled_cents         = contract_total_cents - billed_cents
      when residual > 0: append a MILESTONE_CHARGE LedgerEntry with amount_cents = -residual
    input_set: "The accepting milestone and its order; the deposit is always drawn down BEFORE the client's ledger balance."
    constants: {}
    precision: "whole cents"

  - name: client_balance
    trigger: "any endpoint that appends or reverses a LedgerEntry"
    algorithm: aggregation
    formula: |
      Client.account_credit_cents = sum(LedgerEntry.amount_cents for EVERY entry
          with client_id == Client.id)
    input_set: "Every ledger row of the client, with no status filter: rows are append-only and immutable, and a reversal is itself a row carrying the negation."
    constants: {}
    precision: "whole cents; recomputed from scratch, never patched incrementally"

  - name: ledger_posting_order
    trigger: "any request that appends more than one LedgerEntry"
    algorithm: chronological
    formula: |
      Within one request the entries are appended in this fixed precedence,
      each with a strictly increasing created_at and an identical posted_at_utc:
        1. REVERSAL
        2. WARRANTY_CREDIT
        3. CONSIGNMENT_PROCEEDS
        4. DEPOSIT_REFUND
        5. CANCELLATION_FEE
        6. MILESTONE_CHARGE
        7. DEPOSIT_CHARGE
        8. MANUAL_ADJUSTMENT
    input_set: "The set of entries a single request produces."
    constants: {}
    precision: "ordering only; the balance sum is order-independent, but the created_at sequence is observable through GET /ledger-entries"

# ---------------------------------------------------------------------------
# 1.4 VALIDATION RULES TABLE (ordered by priority; 58 numbered rungs)
#
# ERROR-PRECEDENCE CONTRACT: the server evaluates rungs in ascending priority
# order and returns the FIRST error it reaches. No state change is committed
# before the ladder completes, EXCEPT at the three rungs explicitly marked
# `mutate_then_reject: true` (priorities 46, 44 and 52). Each of those states
# what was already committed and confirms it is NOT rolled back.
# ---------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "X-User-Role header is present and non-empty; X-User-ID header is present for the entity-backed roles Technician and Client, AND for ANY role on the four segregation-of-duties endpoints POST /milestones/{id}/release, POST /warranty-claims/{id}/adjudicate, POST /consignment-agreements (create) and POST /consignment-agreements/{id}/record-sale"
    error_id: ERR_MISSING_AUTH_HEADER
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role names a role declared in the RBAC matrix"
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "the role is listed in the endpoint's roles[]"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: "an entity-backed actor may only touch its own rows: a Client's X-User-ID must equal the resource's client_id (or consignor_client_id / buyer_client_id); a Technician's X-User-ID must equal RouteDay.technician_id or ServiceOrder.assigned_technician_id"
    error_id: ERR_ACTOR_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all endpoints whose roles[] include Client or Technician"

  - priority: 5
    category: business_constraint
    check: "request body parses as a JSON object and every required input field of the endpoint is present and non-null"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST, PUT and PATCH endpoints"

  - priority: 6
    category: business_constraint
    check: "every enum-typed input field carries a declared member of that enum; this list is exhaustive and closed - client_type, home_zone_code, zone_code, instrument_class, usage_tier, service_type, to_condition_status, to_custody_status, to_status, certification_level, part_type, decision, void_reason, status filters and overdue_tier filters route here, and NO other field does"
    error_id: ERR_INVALID_ENUM
    http_status: 400
    applies_to: "all endpoints accepting an enum field in body or query"

  - priority: 7
    category: business_constraint
    check: "numeric inputs sit inside their declared ranges: stair_flights 0..8, relative_humidity_pct 0.0..100.0, temperature_f -20.0..140.0, measured_deviation_cents -200.0..200.0, reference_pitch_hz 415.0..445.0, target_pitch_hz 415.0..445.0, distance_miles > 0, requested_qty 1..50, initial_qty 1..1000, capacity_minutes 60..960, daily_capacity_minutes 60..960, reserve_price_cents >= 50000, sale_price_cents > 0, scheduled_window_end_utc strictly after scheduled_window_start_utc"
    error_id: ERR_VALUE_OUT_OF_RANGE
    http_status: 400
    applies_to: "all endpoints accepting the named fields"

  - priority: 8
    category: business_constraint
    check: "pagination parameters are integers with limit in 1..100 and offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 9
    category: existence
    check: "every path-templated id resolves, validated left to right; Client ids resolve here"
    error_id: ERR_CLIENT_NOT_FOUND
    http_status: 404
    applies_to: "/clients/{id} and any endpoint carrying client_id, consignor_client_id or buyer_client_id in the body"

  - priority: 10
    category: existence
    check: "Location ids in path or body resolve"
    error_id: ERR_LOCATION_NOT_FOUND
    http_status: 404
    applies_to: "/locations/{id} and any endpoint carrying location_id, origin_location_id, destination_location_id or current_location_id"

  - priority: 11
    category: existence
    check: "Instrument ids in path or body resolve"
    error_id: ERR_INSTRUMENT_NOT_FOUND
    http_status: 404
    applies_to: "/instruments/{id} and any endpoint carrying instrument_id"

  - priority: 12
    category: existence
    check: "Quote ids in path or body resolve"
    error_id: ERR_QUOTE_NOT_FOUND
    http_status: 404
    applies_to: "/quotes/{id} and POST /service-orders"

  - priority: 13
    category: existence
    check: "ServiceOrder ids in path or body resolve"
    error_id: ERR_SERVICE_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "/service-orders/{id} and any endpoint carrying service_order_id"

  - priority: 14
    category: existence
    check: "every other referenced id resolves: Technician, RouteDay, Appointment, TuningRecall, Milestone, MoveJob, Warranty, WarrantyClaim, ConsignmentAgreement, PartsLot, PartsAllocation, LedgerEntry"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying any of those ids in path or body"

  - priority: 15
    category: business_referential
    check: "Instrument.serial_number is unique across all instruments"
    error_id: ERR_DUPLICATE_SERIAL_NUMBER
    http_status: 409
    applies_to: "POST /instruments"

  - priority: 16
    category: business_referential
    check: "PartsLot.lot_code is unique across all lots"
    error_id: ERR_DUPLICATE_LOT_CODE
    http_status: 409
    applies_to: "POST /parts-lots"

  - priority: 17
    category: business_referential
    check: "Location(location_id).client_id equals Instrument(instrument_id).client_id on every endpoint that pairs a location with an instrument, and Appointment.location_id equals Instrument.current_location_id"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 409
    applies_to: "POST /instruments, POST /appointments, POST /appointments/{id}/reschedule, POST /move-jobs"

  - priority: 18
    category: business_referential
    check: "ConsignmentAgreement.consignor_client_id equals Instrument.client_id at agreement creation, and buyer_client_id differs from consignor_client_id at sale"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 409
    applies_to: "POST /consignment-agreements, POST /consignment-agreements/{id}/record-sale"

  - priority: 19
    category: state
    check: "the acting or owning Client has status ACTIVE"
    error_id: ERR_CLIENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /quotes, POST /quotes/{id}/issue, POST /quotes/{id}/approve, POST /appointments, POST /service-orders, POST /service-orders/{id}/resume, POST /warranty-claims, POST /tuning-recalls/{id}/notify"

  - priority: 20
    category: state
    check: "Technician.status is ACTIVE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /route-days, POST /appointments, POST /service-orders"

  - priority: 21
    category: state
    check: "the target resource is not already in a terminal state of its own machine"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "every action endpoint that drives a state machine"

  - priority: 22
    category: state
    check: "Instrument.custody_status satisfies the transition's precondition: IN_SHOP is required to activate a consignment and to list to the showroom; IN_TRANSIT is required to reach IN_SHOP or AT_CLIENT_SITE; SOLD accepts no further custody transition. The REBUILD-start custody gate is NOT checked here - it is priority 37."
    error_id: ERR_INVALID_CUSTODY_STATE
    http_status: 409
    applies_to: "POST /instruments/{id}/custody-transitions, POST /instruments/{id}/condition-transitions, POST /consignment-agreements/{id}/activate, POST /consignment-agreements/{id}/list-showroom"

  - priority: 23
    category: state
    check: "the requested transition exists as an edge from the resource's current state in its own machine"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint that drives a state machine"

  - priority: 24
    category: state
    check: "cross-entity gate: a Milestone may only be released while its ServiceOrder.status is IN_PROGRESS, and a PartsAllocation may only be consumed while its ServiceOrder.status is IN_PROGRESS or COMPLETED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /milestones/{id}/release, POST /parts-allocations/{id}/consume"

  - priority: 25
    category: state
    check: "cross-entity gate: an Appointment may only be CONFIRMED while its RouteDay.status is OPEN or LOCKED (a dispatched day no longer accepts confirmations), and a Milestone may only be ACCEPTED while its ServiceOrder.status is IN_PROGRESS"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /appointments/{id}/confirm, POST /milestones/{id}/accept"

  - priority: 26
    category: state
    check: "a ServiceOrder may only be completed when every one of its Milestones has status ACCEPTED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /service-orders/{id}/complete"

  - priority: 27
    category: state
    check: "a Quote may only realise a ServiceOrder while its status is APPROVED, and at most one ServiceOrder may exist per Quote"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /service-orders"

  - priority: 28
    category: business_constraint
    check: "expected_instrument_version equals the Instrument's current version"
    error_id: ERR_STALE_INSTRUMENT_VERSION
    http_status: 412
    applies_to: "POST /quotes, POST /quotes/{id}/reissue, POST /consignment-agreements"

  - priority: 29
    category: business_constraint
    check: "expected_route_day_version equals the RouteDay's current version"
    error_id: ERR_STALE_ROUTE_DAY_VERSION
    http_status: 412
    applies_to: "POST /appointments, POST /appointments/{id}/reschedule"

  - priority: 30
    category: business_constraint
    check: "expected_parts_lot_version equals the PartsLot's current version"
    error_id: ERR_STALE_PARTS_LOT_VERSION
    http_status: 412
    applies_to: "POST /service-orders/{id}/parts-allocations"

  - priority: 31
    category: business_constraint
    check: "expected_warranty_version equals the Warranty's current version"
    error_id: ERR_STALE_WARRANTY_VERSION
    http_status: 412
    applies_to: "POST /warranty-claims"

  - priority: 32
    category: business_safety
    check: "reference_pitch_hz equals the instrument's target_pitch_hz exactly"
    error_id: ERR_PITCH_REFERENCE_MISMATCH
    http_status: 422
    applies_to: "POST /instruments/{id}/pitch-assessments"

  - priority: 33
    category: business_safety
    check: "service ladder prerequisite: a VOICE quote requires Instrument.condition_status IN {SERVICEABLE, NEEDS_VOICING, RESTORED}; a REGULATE quote requires condition_status IN {SERVICEABLE, NEEDS_REGULATION, NEEDS_VOICING, RESTORED}; a TUNE or PITCH_RAISE quote requires condition_status != REBUILD_REQUIRED; a REBUILD quote is allowed from any condition_status"
    error_id: ERR_SERVICE_PREREQUISITE_NOT_MET
    http_status: 422
    applies_to: "POST /quotes, POST /quotes/{id}/reissue"

  - priority: 34
    category: business_safety
    check: "the technician's certification rank meets the service type's minimum rank per calculation technician_certification_gate"
    error_id: ERR_TECH_CERT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /service-orders, POST /appointments, POST /route-days/{id}/status-transitions"

  - priority: 35
    category: business_safety
    check: "a move of a CONCERT_GRAND, or any move with crane_required true, requires the crew lead's move_certified to be true"
    error_id: ERR_MOVE_CREW_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /move-jobs/{id}/status-transitions"

  - priority: 36
    category: business_safety
    check: "a CONCERT_GRAND move whose stair_flights_total is at least MOVE_CRANE_REQUIRED_MIN_FLIGHTS_CONCERT_GRAND (2) must set crane_required true"
    error_id: ERR_CRANE_REQUIRED
    http_status: 422
    applies_to: "POST /move-jobs"

  - priority: 37
    category: business_safety
    check: "a REBUILD ServiceOrder may only be started while its instrument's custody_status is IN_SHOP"
    error_id: ERR_INVALID_CUSTODY_STATE
    http_status: 409
    applies_to: "POST /service-orders/{id}/start"

  - priority: 38
    category: business_safety
    check: "segregation of duties: the X-User-ID adjudicating a WarrantyClaim must differ from every released_by_user_id recorded on the covered ServiceOrder's milestones"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /warranty-claims/{id}/adjudicate"

  - priority: 39
    category: business_safety
    check: "segregation of duties: the X-User-ID recording a consignment sale must differ from ConsignmentAgreement.created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /consignment-agreements/{id}/record-sale"

  - priority: 40
    category: business_referential
    check: "when authorizing_move_job_id is supplied it must name a MoveJob for the same instrument whose status is DISPATCHED (for IN_TRANSIT) or IN_TRANSIT (for IN_SHOP / AT_CLIENT_SITE)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /instruments/{id}/custody-transitions"

  - priority: 41
    category: business_temporal
    check: "the logical clock is strictly before Quote.expires_at"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    applies_to: "POST /quotes/{id}/approve, POST /service-orders"

  - priority: 42
    category: business_temporal
    check: "the logical clock is strictly before ConsignmentAgreement.expires_at"
    error_id: ERR_CONSIGNMENT_EXPIRED
    http_status: 409
    applies_to: "POST /consignment-agreements/{id}/list-showroom, POST /consignment-agreements/{id}/record-sale"

  - priority: 43
    category: business_temporal
    check: "scheduled_start_utc is at least APPOINTMENT_MIN_LEAD_MINUTES (120) after the logical clock"
    error_id: ERR_APPOINTMENT_LEAD_TIME
    http_status: 422
    applies_to: "POST /appointments, POST /appointments/{id}/reschedule"

  - priority: 44
    category: business_safety
    check: "the instrument's CURRENT location must not have out_of_band_flag true when a warranty claim is filed"
    error_id: ERR_CLIMATE_OUT_OF_BAND
    http_status: 422
    applies_to: "POST /warranty-claims"
    mutate_then_reject: true
    committed_before_check: "the parent Warranty has ALREADY been moved ACTIVE -> VOIDED with void_reason CLIMATE_OUT_OF_BAND, its version incremented by 1, and CASCADE A hops 3-5 have already run against that warranty's earlier claims"
    precedence_resolution: "ERR_CLIMATE_OUT_OF_BAND (422) is returned and the WarrantyClaim row is NOT created. The warranty void and its cascade are NOT rolled back: a subsequent GET /warranties/{id} observes status VOIDED, void_reason CLIMATE_OUT_OF_BAND and a version one higher than before the rejected call."

  - priority: 45
    category: business_temporal
    check: "the date part of scheduled_start_utc equals RouteDay.service_date"
    error_id: ERR_APPOINTMENT_DATE_MISMATCH
    http_status: 422
    applies_to: "POST /appointments, POST /appointments/{id}/reschedule"

  - priority: 46
    category: business_constraint
    check: "a pitch assessment must not change the effective pitch tier of an instrument that already has a ServiceOrder with service_type TUNE and status IN_PROGRESS"
    error_id: ERR_PITCH_TIER_CONFLICT
    http_status: 409
    applies_to: "POST /instruments/{id}/pitch-assessments"
    mutate_then_reject: true
    committed_before_check: "Instrument.pitch_deviation_cents, raw_pitch_tier, pitch_raise_tier, planned_visit_count, updated_at and version have ALREADY been written from calculation pitch_tier_classification"
    precedence_resolution: "ERR_PITCH_TIER_CONFLICT (409) is returned and the already-written pitch fields are NOT rolled back. A subsequent GET /instruments/{id} observes the new pitch_raise_tier and a version one higher than before the rejected call. The measurement is a fact of record; the conflict only blocks the acknowledgement, not the reading."

  - priority: 47
    category: business_temporal
    check: "a RouteDay may only be locked once the logical clock has reached ROUTE_DAY_LOCK_LEAD_HOURS (12) before 00:00Z on its service_date"
    error_id: ERR_ROUTE_DAY_LOCK_LEAD
    http_status: 409
    applies_to: "POST /route-days/{id}/status-transitions"

  - priority: 48
    category: business_constraint
    check: "the appointment's Location.zone_code is in the technician's zone_codes, OR the owning Client's home_zone_code is in the technician's zone_codes (an out-of-zone visit for an in-zone client)"
    error_id: ERR_TECHNICIAN_ZONE_MISMATCH
    http_status: 422
    applies_to: "POST /appointments, POST /appointments/{id}/reschedule"

  - priority: 49
    category: business_constraint
    check: "HALF-OPEN INTERVAL semantics on a technician's day: the new stop occupies [scheduled_start_utc, scheduled_start_utc + total_block_minutes) and must not intersect any existing SCHEDULED or CONFIRMED stop's half-open interval on the SAME RouteDay. Touching endpoints (one interval ending exactly where the next begins) are ALLOWED."
    error_id: ERR_APPOINTMENT_OVERLAP
    http_status: 409
    applies_to: "POST /appointments, POST /appointments/{id}/reschedule"

  - priority: 50
    category: business_constraint
    check: "WHOLE-DAY GRANULARITY on an instrument: an instrument may hold at most one SCHEDULED or CONFIRMED appointment per RouteDay.service_date across ALL technicians. Two stops on the same calendar date collide even when their minute intervals are disjoint."
    error_id: ERR_INSTRUMENT_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /appointments, POST /appointments/{id}/reschedule"

  - priority: 51
    category: business_constraint
    check: "BUFFERED CLOSED INTERVAL on an instrument's moves: a new MoveJob window [scheduled_window_start_utc, scheduled_window_end_utc] widened by MOVE_WINDOW_BUFFER_MINUTES (90) on BOTH sides must not intersect the unwidened window of any MoveJob for the same instrument whose status is in {DRAFT, SCHEDULED, DISPATCHED, IN_TRANSIT}. Touching endpoints DO collide because the interval is closed."
    error_id: ERR_MOVE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /move-jobs"

  - priority: 52
    category: business_safety
    check: "on dispatch, every appointment being flipped to EN_ROUTE must pass technician_certification_gate for its own service_type"
    error_id: ERR_TECH_CERT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /route-days/{id}/status-transitions with to_status=DISPATCHED"
    mutate_then_reject: true
    committed_before_check: "appointments are flipped PENDING -> EN_ROUTE in Appointment.created_at ASC order; every appointment ordered before the offending one has ALREADY been flipped and had its version incremented"
    precedence_resolution: "ERR_TECH_CERT_INSUFFICIENT (422) is returned at the first failing appointment. The earlier flips are NOT rolled back (partial dispatch) and RouteDay.status remains LOCKED with its version unchanged. Re-issuing the dispatch after fixing the certification flips only the appointments still in PENDING."

  - priority: 53
    category: business_constraint
    check: "at most one Quote per (instrument_id, service_type) may hold status ISSUED"
    error_id: ERR_DUPLICATE_ACTIVE_QUOTE
    http_status: 409
    applies_to: "POST /quotes/{id}/issue"

  - priority: 54
    category: business_constraint
    check: "a Milestone may only be released when every Milestone of the same order with a lower sequence_index has status ACCEPTED"
    error_id: ERR_MILESTONE_SEQUENCE
    http_status: 409
    applies_to: "POST /milestones/{id}/release"

  - priority: 55
    category: business_constraint
    check: "capped-retry gates: Appointment.reschedule_count < RESCHEDULE_LIMIT (2); Milestone.rejection_count < MILESTONE_REJECTION_RETRY_LIMIT (2); Warranty.claim_count < WARRANTY_CLAIM_LIMIT (2)"
    error_id: ERR_ATTEMPT_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /appointments/{id}/reschedule, POST /milestones/{id}/reject, POST /warranty-claims"

  - priority: 56
    category: business_constraint
    check: "PartsLot.on_hand_qty is at least ceil(requested_qty * PARTIAL_ALLOCATION_MIN_PCT); below that the request is refused rather than partially filled"
    error_id: ERR_PARTS_INSUFFICIENT
    http_status: 409
    applies_to: "POST /service-orders/{id}/parts-allocations"

  - priority: 57
    category: business_constraint
    check: "RouteDay.committed_minutes + the new stop's total_block_minutes must be <= RouteDay.capacity_minutes"
    error_id: ERR_ROUTE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /appointments, POST /appointments/{id}/reschedule"

  - priority: 58
    category: business_fiscal
    check: "sale_price_cents >= round_half_up(reserve_price_cents * CONSIGNMENT_SALE_FLOOR_PCT)"
    error_id: ERR_SALE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /consignment-agreements/{id}/record-sale"

  - priority: 59
    category: business_fiscal
    check: "releasing the milestone with sequence_index 1 requires the order's deposit to be settled, i.e. Client.account_credit_cents >= 0"
    error_id: ERR_DEPOSIT_NOT_SETTLED
    http_status: 402
    applies_to: "POST /milestones/{id}/release"

  - priority: 60
    category: business_fiscal
    check: "accepting a milestone requires Client.account_credit_cents + (ServiceOrder.deposit_held_cents - deposit_applied_cents - deposit_refunded_cents - deposit_forfeited_cents) >= Milestone.amount_cents"
    error_id: ERR_INSUFFICIENT_CREDIT
    http_status: 402
    applies_to: "POST /milestones/{id}/accept"

# ---------------------------------------------------------------------------
# 1.5 API ENDPOINT TABLE (85 endpoints)
# ---------------------------------------------------------------------------
endpoints:

  # ---- logical clock and ops-run checkpoint --------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before the first call the clock reads exactly 2026-05-01T00:00:00Z (CLOCK_DEFAULT_UTC) and NEVER falls back to real wall-clock time. Recomputes every Location's out_of_band_flag."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, locations_reevaluated: integer }
    side_effects:
      - "logical clock set"
      - "climate_out_of_band_evaluation re-run for every Location with at least one ClimateReading"

  - method: POST
    path: "/_ops/daily-sweep"
    description: "Ops-run checkpoint. Advances recall overdue tiers, lapses overdue recalls, expires quotes, consignments and warranties, in that fixed order."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: { evaluated_recall_count: integer, lapsed_recall_count: integer, expired_quote_count: integer, expired_consignment_count: integer, expired_warranty_count: integer, voided_warranty_count: integer }
    side_effects:
      - "step 1: TuningRecall rows with status IN {PENDING, NOTIFIED, SCHEDULED} processed in created_at ASC - days_overdue and overdue_tier recomputed; rows at 91+ days move to LAPSED and void every ACTIVE warranty on their instrument"
      - "step 2: ISSUED quotes at or past expires_at move to EXPIRED"
      - "step 3: ACTIVE or LISTED consignments at or past expires_at move to EXPIRED, returning the instrument from SHOWROOM_FLOOR to AT_CLIENT_SITE"
      - "step 4: ACTIVE or TRANSFERRED warranties past end_date move to EXPIRED"

  # ---- clients -------------------------------------------------------------
  - method: POST
    path: "/clients"
    description: "Registers a client."
    roles: [PlatformAdmin, ShopManager]
    code: 201
    input: ["display_name", "email", "phone", "home_zone_code", "client_type?"]
    output: Client
    side_effects: ["Client created with status ACTIVE and account_credit_cents 0"]

  - method: GET
    path: "/clients"
    description: "Lists clients."
    roles: [PlatformAdmin, ShopManager]
    code: 200
    input: ["client_type?", "status?", "limit?", "offset?"]
    output: Client[]
    side_effects: []

  - method: GET
    path: "/clients/{id}"
    description: "Reads one client including the recomputed account_credit_cents."
    roles: [PlatformAdmin, ShopManager, Client]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: PATCH
    path: "/clients/{id}"
    description: "Updates client profile fields or drives the client status axis."
    roles: [PlatformAdmin, ShopManager]
    code: 200
    input: ["display_name?", "email?", "phone?", "home_zone_code?", "client_type?", "status?"]
    output: Client
    side_effects: ["Client.version incremented by 1"]

  - method: POST
    path: "/clients/{id}/credit-adjustments"
    description: "Posts a MANUAL_ADJUSTMENT LedgerEntry (signed) against the client - the operator surface used to fund or debit an account."
    roles: [PlatformAdmin, ShopManager]
    code: 201
    input: ["amount_cents", "memo?"]
    output: LedgerEntry
    side_effects:
      - "LedgerEntry appended with entry_type MANUAL_ADJUSTMENT"
      - "Client.account_credit_cents recomputed; Client.version incremented by 1"

  # ---- locations -----------------------------------------------------------
  - method: POST
    path: "/locations"
    description: "Creates a service address for a client."
    roles: [PlatformAdmin, ShopManager, MoveCoordinator]
    code: 201
    input: ["client_id", "label", "zone_code", "address_key", "distance_miles_from_shop", "stair_flights?", "has_service_elevator?", "climate_controlled?"]
    output: Location
    side_effects: ["Location created with out_of_band_flag false"]

  - method: GET
    path: "/locations"
    description: "Lists locations, filterable by owning client."
    roles: [PlatformAdmin, ShopManager, MoveCoordinator, Client]
    code: 200
    input: ["client_id?", "zone_code?", "limit?", "offset?"]
    output: Location[]
    side_effects: []

  - method: GET
    path: "/locations/{id}"
    description: "Reads one location including the climate evaluation fields."
    roles: [PlatformAdmin, ShopManager, MoveCoordinator, Client, Technician]
    code: 200
    input: []
    output: Location
    side_effects: []

  - method: PATCH
    path: "/locations/{id}"
    description: "Updates address attributes that drive move pricing and the tuning cycle."
    roles: [PlatformAdmin, ShopManager, MoveCoordinator]
    code: 200
    input: ["label?", "zone_code?", "stair_flights?", "has_service_elevator?", "climate_controlled?", "distance_miles_from_shop?"]
    output: Location
    side_effects: ["Location.version incremented by 1"]

  # ---- climate readings ----------------------------------------------------
  - method: POST
    path: "/climate-readings"
    description: "Appends a humidity/temperature reading for a location and re-runs the out-of-band evaluation."
    roles: [PlatformAdmin, ShopManager, Technician]
    code: 201
    input: [location_id, recorded_at_utc, relative_humidity_pct, temperature_f]
    output: ClimateReading
    side_effects:
      - "ClimateReading appended with in_band computed"
      - "Location.out_of_band_flag, readings_in_window and out_of_band_count recomputed; Location.version incremented by 1"

  - method: GET
    path: "/locations/{id}/climate-readings"
    description: "Lists the readings recorded against a location."
    roles: [PlatformAdmin, ShopManager, Technician]
    code: 200
    input: ["limit?", "offset?"]
    output: ClimateReading[]
    side_effects: []

  # ---- instruments ---------------------------------------------------------
  - method: POST
    path: "/instruments"
    description: "Registers an instrument at a location owned by the same client."
    roles: [PlatformAdmin, ShopManager]
    code: 201
    input: ["client_id", "current_location_id", "make", "model", "serial_number", "instrument_class", "usage_tier", "target_pitch_hz?", "last_tuning_date?"]
    output: Instrument
    side_effects: ["Instrument created with condition_status NEEDS_ASSESSMENT and custody_status AT_CLIENT_SITE"]

  - method: GET
    path: "/instruments"
    description: "Lists instruments with FK filters."
    roles: [PlatformAdmin, ShopManager, Technician, Client, MoveCoordinator, ShowroomAgent]
    code: 200
    input: ["client_id?", "current_location_id?", "consignment_agreement_id?", "custody_status?", "condition_status?", "limit?", "offset?"]
    output: Instrument[]
    side_effects: []

  - method: GET
    path: "/instruments/{id}"
    description: "Reads one instrument, both status axes and the pitch fields."
    roles: [PlatformAdmin, ShopManager, Technician, Client, MoveCoordinator, ShowroomAgent]
    code: 200
    input: []
    output: Instrument
    side_effects: []

  - method: PATCH
    path: "/instruments/{id}"
    description: "Updates instrument profile fields."
    roles: [PlatformAdmin, ShopManager]
    code: 200
    input: ["make?", "model?", "usage_tier?", "target_pitch_hz?", "current_location_id?", "last_tuning_date?"]
    output: Instrument
    side_effects: ["Instrument.version incremented by 1"]

  - method: POST
    path: "/instruments/{id}/pitch-assessments"
    description: "Records a measured cents deviation against the instrument's target pitch and reclassifies its pitch tier."
    roles: [Technician, ShopManager, PlatformAdmin]
    code: 200
    input: [reference_pitch_hz, measured_deviation_cents]
    output: Instrument
    side_effects:
      - "pitch_deviation_cents, raw_pitch_tier, pitch_raise_tier and planned_visit_count written per calculation pitch_tier_classification"
      - "Instrument.version incremented by 1"
      - "MUTATE-THEN-REJECT at validations priority 46"

  - method: POST
    path: "/instruments/{id}/custody-transitions"
    description: "Drives the custody axis. Omitting authorizing_move_job_id on a move into IN_TRANSIT marks the move unauthorized and fires CASCADE A."
    roles: [MoveCoordinator, ShopManager, PlatformAdmin]
    code: 200
    input: ["to_custody_status", "authorizing_move_job_id?"]
    output: Instrument
    side_effects:
      - "custody_status advanced; unauthorized_move_flag set when no authorizing job is quoted"
      - "CASCADE A hops 2-5 when the flag is set"
      - "linked MoveJob advanced DISPATCHED -> IN_TRANSIT -> DELIVERED when a job is quoted"
      - "Instrument.version incremented by 1"

  - method: POST
    path: "/instruments/{id}/condition-transitions"
    description: "Drives the mechanical-condition axis."
    roles: [Technician, ShopManager, PlatformAdmin]
    code: 200
    input: ["to_condition_status", "note?"]
    output: Instrument
    side_effects: ["condition_status advanced; Instrument.version incremented by 1"]

  # ---- tuning recalls ------------------------------------------------------
  - method: POST
    path: "/tuning-recalls"
    description: "Opens a tuning-cycle recall, computing the interval and due date from the instrument and its current location."
    roles: [PlatformAdmin, ShopManager]
    code: 201
    input: [instrument_id, cycle_start_date]
    output: TuningRecall
    side_effects:
      - "interval_days and due_date computed"
      - "Instrument.tuning_cycle_interval_days written; Instrument.version incremented by 1"

  - method: GET
    path: "/instruments/{id}/tuning-recalls"
    description: "Lists the recalls opened for an instrument."
    roles: [PlatformAdmin, ShopManager, Technician, Client]
    code: 200
    input: ["status?", "overdue_tier?", "limit?", "offset?"]
    output: TuningRecall[]
    side_effects: []

  - method: POST
    path: "/tuning-recalls/{id}/notify"
    description: "Marks the client notified of an outstanding recall."
    roles: [PlatformAdmin, ShopManager]
    code: 200
    input: []
    output: TuningRecall
    side_effects: ["status PENDING -> NOTIFIED; notified_at stamped; TuningRecall.version incremented by 1"]

  # ---- technicians ---------------------------------------------------------
  - method: POST
    path: "/technicians"
    description: "Registers a technician with a certification level and zone list."
    roles: [PlatformAdmin]
    code: 201
    input: ["display_name", "certification_level", "zone_codes", "move_certified?", "daily_capacity_minutes?"]
    output: Technician
    side_effects: ["Technician created with status ACTIVE"]

  - method: GET
    path: "/technicians"
    description: "Lists technicians."
    roles: [PlatformAdmin, ShopManager]
    code: 200
    input: ["certification_level?", "status?", "limit?", "offset?"]
    output: Technician[]
    side_effects: []

  - method: PATCH
    path: "/technicians/{id}"
    description: "Updates certification, zones, capacity or activation."
    roles: [PlatformAdmin]
    code: 200
    input: ["certification_level?", "move_certified?", "zone_codes?", "daily_capacity_minutes?", "status?"]
    output: Technician
    side_effects: ["Technician.version incremented by 1"]

  # ---- route days ----------------------------------------------------------
  - method: POST
    path: "/route-days"
    description: "Opens a technician-day; capacity defaults from the technician."
    roles: [PlatformAdmin, ShopManager]
    code: 201
    input: ["technician_id", "service_date", "capacity_minutes?"]
    output: RouteDay
    side_effects: ["RouteDay created OPEN with committed_minutes 0"]

  - method: GET
    path: "/route-days"
    description: "Lists route days with FK filters."
    roles: [PlatformAdmin, ShopManager, Technician]
    code: 200
    input: ["technician_id?", "service_date?", "status?", "limit?", "offset?"]
    output: RouteDay[]
    side_effects: []

  - method: GET
    path: "/route-days/{id}"
    description: "Reads one route day including committed_minutes and stop_count."
    roles: [PlatformAdmin, ShopManager, Technician]
    code: 200
    input: []
    output: RouteDay
    side_effects: []

  - method: POST
    path: "/route-days/{id}/status-transitions"
    description: "Drives the route-day axis: OPEN -> LOCKED, LOCKED -> OPEN, LOCKED -> DISPATCHED."
    roles: [PlatformAdmin, ShopManager]
    code: 200
    input: [to_status]
    output: RouteDay
    side_effects:
      - "on DISPATCHED: every SCHEDULED or CONFIRMED appointment on the day flips PENDING -> EN_ROUTE in created_at ASC order"
      - "RouteDay.version incremented by 1"
      - "MUTATE-THEN-REJECT at validations priority 52"

  # ---- appointments --------------------------------------------------------
  - method: POST
    path: "/appointments"
    description: "Books a stop on a route day. Computes service minutes, travel buffer, same-address chaining, estimated price and route capacity."
    roles: [PlatformAdmin, ShopManager, Client]
    code: 201
    input: ["instrument_id", "route_day_id", "location_id", "scheduled_start_utc", "service_type", "expected_route_day_version", "service_order_id?", "tuning_recall_id?"]
    output: Appointment
    side_effects:
      - "scheduling_status REQUESTED -> SCHEDULED in the same request"
      - "RouteDay.committed_minutes and stop_count recomputed; increments RouteDay.version by 1"
      - "TuningRecall NOTIFIED -> SCHEDULED when tuning_recall_id is supplied"

  - method: GET
    path: "/appointments"
    description: "Lists appointments with FK and status filters."
    roles: [PlatformAdmin, ShopManager, Technician, Client]
    code: 200
    input: ["instrument_id?", "route_day_id?", "location_id?", "service_order_id?", "tuning_recall_id?", "scheduling_status?", "fulfillment_status?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []

  - method: GET
    path: "/appointments/{id}"
    description: "Reads one appointment with both status axes."
    roles: [PlatformAdmin, ShopManager, Technician, Client]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: POST
    path: "/appointments/{id}/confirm"
    description: "Client confirms a scheduled stop."
    roles: [PlatformAdmin, ShopManager, Client]
    code: 200
    input: []
    output: Appointment
    side_effects: ["scheduling_status SCHEDULED -> CONFIRMED; Appointment.version incremented by 1"]

  - method: POST
    path: "/appointments/{id}/reschedule"
    description: "Moves a stop to another route day and start time, charging the reschedule fee tier."
    roles: [PlatformAdmin, ShopManager, Client]
    code: 200
    input: [route_day_id, scheduled_start_utc, expected_route_day_version]
    output: Appointment
    side_effects:
      - "reschedule_count incremented; buffers, price and capacity recomputed on both days"
      - "increments RouteDay.version by 1 on the target day and on the vacated day"
      - "reschedule fee posted as a CANCELLATION_FEE LedgerEntry when non-zero"

  - method: POST
    path: "/appointments/{id}/cancel"
    description: "Cancels a stop, computing the tiered cancellation fee and settling it against any held deposit."
    roles: [PlatformAdmin, ShopManager, Client]
    code: 200
    input: ["reason?"]
    output: Appointment
    side_effects:
      - "scheduling_status -> CANCELLED and fulfillment_status -> ABORTED"
      - "cancellation_fee_cents computed; deposit forfeiture and/or CANCELLATION_FEE LedgerEntry posted"
      - "RouteDay.committed_minutes and stop_count recomputed; RouteDay.version incremented by 1"
      - "TuningRecall SCHEDULED -> NOTIFIED when linked"

  - method: POST
    path: "/appointments/{id}/start"
    description: "Technician starts the stop."
    roles: [Technician, ShopManager, PlatformAdmin]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "fulfillment_status EN_ROUTE -> IN_PROGRESS"
      - "linked PENDING ServiceOrder moves to IN_PROGRESS and ALL of its Milestones to READY"

  - method: POST
    path: "/appointments/{id}/complete"
    description: "Technician completes the stop."
    roles: [Technician, ShopManager, PlatformAdmin]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "fulfillment_status IN_PROGRESS -> COMPLETED"
      - "linked TuningRecall SCHEDULED -> FULFILLED and Instrument.last_tuning_date stamped"

  - method: POST
    path: "/appointments/{id}/no-show"
    description: "Technician records a no-show at the door."
    roles: [Technician, ShopManager, PlatformAdmin]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "fulfillment_status EN_ROUTE -> NO_SHOW and scheduling_status -> CANCELLED"
      - "DISPATCHED_TIER cancellation fee assessed and posted"
      - "linked IN_PROGRESS ServiceOrder moves to ON_HOLD"

  # ---- quotes --------------------------------------------------------------
  - method: POST
    path: "/quotes"
    description: "Drafts a quote, pricing it from the instrument, its location zone, its effective pitch tier and the client type."
    roles: [PlatformAdmin, ShopManager]
    code: 201
    input: [instrument_id, service_type, expected_instrument_version]
    output: Quote
    side_effects:
      - "quote_line_composition, quote_pricing, loyalty_discount and deposit_required evaluated"
      - "increments Instrument.version by 1"

  - method: GET
    path: "/quotes"
    description: "Lists quotes with FK and status filters."
    roles: [PlatformAdmin, ShopManager, Client]
    code: 200
    input: ["instrument_id?", "client_id?", "supersedes_quote_id?", "status?", "service_type?", "limit?", "offset?"]
    output: Quote[]
    side_effects: []

  - method: GET
    path: "/quotes/{id}"
    description: "Reads one quote with its full price breakdown."
    roles: [PlatformAdmin, ShopManager, Client]
    code: 200
    input: []
    output: Quote
    side_effects: []

  - method: POST
    path: "/quotes/{id}/issue"
    description: "Issues a draft quote, stamping issued_at and expires_at."
    roles: [PlatformAdmin, ShopManager]
    code: 200
    input: []
    output: Quote
    side_effects: ["status DRAFT -> ISSUED; expires_at set to issued_at plus 30 days; Quote.version incremented by 1"]

  - method: POST
    path: "/quotes/{id}/approve"
    description: "Client approves an issued quote. A REBUILD approval fires CASCADE B."
    roles: [Client, PlatformAdmin]
    code: 200
    input: []
    output: Quote
    side_effects:
      - "status ISSUED -> APPROVED"
      - "on REBUILD: Instrument.condition_status -> REBUILD_REQUIRED and CASCADE B hops 2-5"

  - method: POST
    path: "/quotes/{id}/decline"
    description: "Client declines an issued quote."
    roles: [Client, PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: Quote
    side_effects: ["status ISSUED -> DECLINED; Quote.version incremented by 1"]

  - method: POST
    path: "/quotes/{id}/reissue"
    description: "Mints a NEW quote row superseding this one, with freshly recomputed prices. The original is never mutated back into ISSUED."
    roles: [PlatformAdmin, ShopManager]
    code: 201
    input: [expected_instrument_version]
    output: Quote
    side_effects:
      - "the named quote moves ISSUED or EXPIRED -> SUPERSEDED"
      - "a new DRAFT Quote is created with version_number + 1 and supersedes_quote_id set"
      - "increments Instrument.version by 1"

  # ---- service orders ------------------------------------------------------
  - method: POST
    path: "/service-orders"
    description: "Realises an APPROVED quote as a service order and mints its milestone schedule."
    roles: [PlatformAdmin, ShopManager]
    code: 201
    input: ["quote_id", "assigned_technician_id?"]
    output: ServiceOrder
    side_effects:
      - "contract_total_cents and deposit_held_cents copied from the quote; estimated_minutes and visit_plan_variant computed"
      - "milestones minted per milestone_waterfall"
      - "a DEPOSIT_CHARGE LedgerEntry for the negated deposit is appended when deposit_held_cents > 0; Client.account_credit_cents recomputed"

  - method: GET
    path: "/service-orders"
    description: "Lists service orders with FK and status filters."
    roles: [PlatformAdmin, ShopManager, Technician, Client]
    code: 200
    input: ["quote_id?", "instrument_id?", "client_id?", "assigned_technician_id?", "status?", "limit?", "offset?"]
    output: ServiceOrder[]
    side_effects: []

  - method: GET
    path: "/service-orders/{id}"
    description: "Reads one service order with its billing and deposit fields."
    roles: [PlatformAdmin, ShopManager, Technician, Client]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: []

  - method: POST
    path: "/service-orders/{id}/start"
    description: "Starts the work; readies the first milestone."
    roles: [Technician, ShopManager, PlatformAdmin]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: ["status PENDING -> IN_PROGRESS; EVERY milestone PENDING -> READY; ServiceOrder.version incremented by 1"]

  - method: POST
    path: "/service-orders/{id}/resume"
    description: "Returns a held order to work."
    roles: [ShopManager, PlatformAdmin]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: ["status ON_HOLD -> IN_PROGRESS; ServiceOrder.version incremented by 1"]

  - method: POST
    path: "/service-orders/{id}/complete"
    description: "Completes the work, mints the warranty and advances the instrument's condition axis."
    roles: [Technician, ShopManager, PlatformAdmin]
    code: 200
    input: []
    output: ServiceOrder
    side_effects:
      - "status IN_PROGRESS -> COMPLETED; completed_at stamped"
      - "a Warranty row is minted per calculation warranty_term"
      - "Instrument.condition_status advanced; last_tuning_date stamped for TUNE and PITCH_RAISE"
      - "open PartsAllocations move to CONSUMED"

  - method: POST
    path: "/service-orders/{id}/cancel"
    description: "Cancels a pending or held order, cancelling milestones, releasing parts and refunding the unapplied deposit."
    roles: [ShopManager, PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: ServiceOrder
    side_effects:
      - "status -> CANCELLED; milestones -> CANCELLED; PartsAllocations -> RELEASED"
      - "DEPOSIT_REFUND LedgerEntry appended; Client.account_credit_cents recomputed"

  - method: GET
    path: "/service-orders/{id}/milestones"
    description: "Lists the milestone schedule of an order in sequence_index order."
    roles: [PlatformAdmin, ShopManager, Technician, Client]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Milestone[]
    side_effects: []

  - method: POST
    path: "/service-orders/{id}/parts-allocations"
    description: "Reserves units from a parts lot against a rebuild, fully or partially."
    roles: [ShopManager, PlatformAdmin]
    code: 201
    input: [parts_lot_id, requested_qty, expected_parts_lot_version]
    output: PartsAllocation
    side_effects:
      - "allocated_qty and status resolved per calculation parts_allocation_resolution"
      - "increments PartsLot.version by 1; on_hand_qty and allocated_qty moved"

  # ---- milestones ----------------------------------------------------------
  - method: POST
    path: "/milestones/{id}/release"
    description: "Shop releases a ready milestone for client acceptance."
    roles: [ShopManager, PlatformAdmin]
    code: 200
    input: []
    output: Milestone
    side_effects: ["status READY -> RELEASED; released_by_user_id and released_at stamped; Milestone.version incremented by 1"]

  - method: POST
    path: "/milestones/{id}/accept"
    description: "Client accepts a released milestone, settling it against the deposit then the ledger."
    roles: [Client, PlatformAdmin]
    code: 200
    input: []
    output: Milestone
    side_effects:
      - "status RELEASED -> ACCEPTED; billed_cents and deposit_applied_cents moved per calculation milestone_settlement"
      - "MILESTONE_CHARGE LedgerEntry appended for any residual; Client.account_credit_cents recomputed"

  - method: POST
    path: "/milestones/{id}/reject"
    description: "Client rejects a released milestone; it returns to READY up to the retry cap."
    roles: [Client, PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: Milestone
    side_effects: ["rejection_count incremented; released_by_user_id cleared; status lands back on READY"]

  # ---- move jobs -----------------------------------------------------------
  - method: POST
    path: "/move-jobs"
    description: "Creates a specialized move and prices it from class, stairs, crane, distance band and climate transport."
    roles: [MoveCoordinator, ShopManager, PlatformAdmin]
    code: 201
    input: ["instrument_id", "origin_location_id", "destination_location_id", "distance_miles", "scheduled_window_start_utc", "scheduled_window_end_utc", "crane_required?", "climate_controlled_transport?", "move_technician_id?"]
    output: MoveJob
    side_effects: ["move_stair_component, move_distance_component and move_pricing evaluated"]

  - method: GET
    path: "/move-jobs"
    description: "Lists move jobs with FK and status filters."
    roles: [MoveCoordinator, ShopManager, PlatformAdmin, Client]
    code: 200
    input: ["instrument_id?", "client_id?", "origin_location_id?", "destination_location_id?", "move_technician_id?", "status?", "limit?", "offset?"]
    output: MoveJob[]
    side_effects: []

  - method: GET
    path: "/move-jobs/{id}"
    description: "Reads one move job with its price components."
    roles: [MoveCoordinator, ShopManager, PlatformAdmin, Client]
    code: 200
    input: []
    output: MoveJob
    side_effects: []

  - method: POST
    path: "/move-jobs/{id}/status-transitions"
    description: "Drives the move axis: DRAFT -> SCHEDULED, SCHEDULED -> DISPATCHED, DRAFT or SCHEDULED -> CANCELLED."
    roles: [MoveCoordinator, ShopManager, PlatformAdmin]
    code: 200
    input: ["to_status", "reason?"]
    output: MoveJob
    side_effects: ["MoveJob.version incremented by 1"]

  # ---- warranties ----------------------------------------------------------
  - method: GET
    path: "/warranties"
    description: "Lists warranties with FK and status filters."
    roles: [PlatformAdmin, ShopManager, Technician, Client]
    code: 200
    input: ["instrument_id?", "service_order_id?", "client_id?", "status?", "limit?", "offset?"]
    output: Warranty[]
    side_effects: []

  - method: GET
    path: "/warranties/{id}"
    description: "Reads one warranty including term, dates and claim_count."
    roles: [PlatformAdmin, ShopManager, Technician, Client]
    code: 200
    input: []
    output: Warranty
    side_effects: []

  - method: POST
    path: "/warranties/{id}/void"
    description: "Voids a warranty, denying its open claims and reversing their provisional credits."
    roles: [ShopManager, PlatformAdmin]
    code: 200
    input: [void_reason]
    output: Warranty
    side_effects:
      - "status -> VOIDED with void_reason recorded"
      - "CASCADE A hops 3-5: open claims DENIED, provisional credits negated by REVERSAL rows, client balance recomputed"

  - method: POST
    path: "/warranty-claims"
    description: "Files a claim against a warranty, computing the elapsed fraction and the resolution variant."
    roles: [Client, ShopManager, PlatformAdmin]
    code: 201
    input: [warranty_id, reported_issue, expected_warranty_version]
    output: WarrantyClaim
    side_effects:
      - "elapsed_fraction, resolution_variant and credit_cents computed"
      - "a provisional WARRANTY_CREDIT LedgerEntry is appended under the PRORATED_CREDIT variant"
      - "increments Warranty.version by 1 and Warranty.claim_count by 1"
      - "MUTATE-THEN-REJECT at validations priority 44"

  - method: GET
    path: "/warranty-claims"
    description: "Lists claims with FK and status filters."
    roles: [PlatformAdmin, ShopManager, Client]
    code: 200
    input: ["warranty_id?", "service_order_id?", "status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []

  - method: GET
    path: "/warranty-claims/{id}"
    description: "Reads one claim."
    roles: [PlatformAdmin, ShopManager, Client]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: POST
    path: "/warranty-claims/{id}/review"
    description: "Takes a submitted claim under review."
    roles: [ShopManager, PlatformAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status SUBMITTED -> UNDER_REVIEW; WarrantyClaim.version incremented by 1"]

  - method: POST
    path: "/warranty-claims/{id}/adjudicate"
    description: "Approves or denies a claim under review; approval routes by resolution_variant."
    roles: [ShopManager, PlatformAdmin]
    code: 200
    input: [decision]
    output: WarrantyClaim
    side_effects:
      - "APPROVE routes to APPROVED_RESERVICE or APPROVED_CREDIT by resolution_variant"
      - "DENY reverses the provisional credit and recomputes the client balance"

  # ---- consignment ---------------------------------------------------------
  - method: POST
    path: "/consignment-agreements"
    description: "Drafts a consignment agreement for an instrument held in the shop."
    roles: [ShowroomAgent, ShopManager, PlatformAdmin]
    code: 201
    input: [instrument_id, consignor_client_id, reserve_price_cents, expected_instrument_version]
    output: ConsignmentAgreement
    side_effects:
      - "created_by_user_id stamped from X-User-ID"
      - "increments Instrument.version by 1"

  - method: GET
    path: "/consignment-agreements"
    description: "Lists agreements with FK and status filters."
    roles: [ShowroomAgent, ShopManager, PlatformAdmin, Client]
    code: 200
    input: ["instrument_id?", "consignor_client_id?", "buyer_client_id?", "status?", "limit?", "offset?"]
    output: ConsignmentAgreement[]
    side_effects: []

  - method: GET
    path: "/consignment-agreements/{id}"
    description: "Reads one agreement including the proceeds split."
    roles: [ShowroomAgent, ShopManager, PlatformAdmin, Client]
    code: 200
    input: []
    output: ConsignmentAgreement
    side_effects: []

  - method: POST
    path: "/consignment-agreements/{id}/activate"
    description: "Activates a draft agreement, stamping the term and the recoverable restoration advance."
    roles: [ShowroomAgent, ShopManager, PlatformAdmin]
    code: 200
    input: []
    output: ConsignmentAgreement
    side_effects:
      - "status DRAFT -> ACTIVE; start_date and expires_at stamped"
      - "advanced_restoration_cents summed from the instrument's COMPLETED REBUILD orders"

  - method: POST
    path: "/consignment-agreements/{id}/list-showroom"
    description: "Puts the instrument on the showroom floor."
    roles: [ShowroomAgent, ShopManager, PlatformAdmin]
    code: 200
    input: []
    output: ConsignmentAgreement
    side_effects: ["status ACTIVE -> LISTED; Instrument.custody_status IN_SHOP -> SHOWROOM_FLOOR"]

  - method: POST
    path: "/consignment-agreements/{id}/record-sale"
    description: "Records the sale, splits the proceeds and fires CASCADE C."
    roles: [ShowroomAgent, ShopManager, PlatformAdmin]
    code: 200
    input: [buyer_client_id, sale_price_cents]
    output: ConsignmentAgreement
    side_effects:
      - "consignment_proceeds_split evaluated; CONSIGNMENT_PROCEEDS LedgerEntry posted to the consignor"
      - "CASCADE C: instrument SOLD and re-owned, warranties TRANSFERRED with prorated terms, in-flight orders re-owned"

  - method: POST
    path: "/consignment-agreements/{id}/withdraw"
    description: "Withdraws the instrument from consignment and returns it to the client."
    roles: [ShowroomAgent, ShopManager, PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: ConsignmentAgreement
    side_effects: ["status -> WITHDRAWN; instrument returned from SHOWROOM_FLOOR to AT_CLIENT_SITE"]

  # ---- parts ---------------------------------------------------------------
  - method: POST
    path: "/parts-lots"
    description: "Receives a lot of parts into stock."
    roles: [ShopManager, PlatformAdmin]
    code: 201
    input: [part_type, lot_code, initial_qty]
    output: PartsLot
    side_effects: ["on_hand_qty set to initial_qty; allocated_qty and consumed_qty 0"]

  - method: GET
    path: "/parts-lots/{id}"
    description: "Reads one lot; the three quantity fields plus initial_qty expose the conservation invariant."
    roles: [ShopManager, PlatformAdmin, Technician]
    code: 200
    input: []
    output: PartsLot
    side_effects: []

  - method: GET
    path: "/parts-allocations"
    description: "Lists allocations with FK and status filters."
    roles: [ShopManager, PlatformAdmin, Technician]
    code: 200
    input: ["parts_lot_id?", "service_order_id?", "status?", "limit?", "offset?"]
    output: PartsAllocation[]
    side_effects: []

  - method: GET
    path: "/parts-allocations/{id}"
    description: "Reads one allocation."
    roles: [ShopManager, PlatformAdmin, Technician]
    code: 200
    input: []
    output: PartsAllocation
    side_effects: []

  - method: POST
    path: "/parts-allocations/{id}/consume"
    description: "Consumes reserved units permanently."
    roles: [Technician, ShopManager, PlatformAdmin]
    code: 200
    input: []
    output: PartsAllocation
    side_effects: ["status -> CONSUMED; PartsLot.allocated_qty down, consumed_qty up; PartsLot.version incremented by 1"]

  - method: POST
    path: "/parts-allocations/{id}/release"
    description: "Returns reserved units to stock."
    roles: [ShopManager, PlatformAdmin]
    code: 200
    input: []
    output: PartsAllocation
    side_effects: ["status -> RELEASED; PartsLot.allocated_qty down, on_hand_qty up; DEPLETED -> OPEN when stock returns; PartsLot.version incremented by 1"]

  # ---- ledger --------------------------------------------------------------
  - method: GET
    path: "/ledger-entries"
    description: "Lists ledger entries with FK, type and status filters, ordered by created_at ASC."
    roles: [PlatformAdmin, ShopManager, Client]
    code: 200
    input: ["client_id?", "service_order_id?", "warranty_claim_id?", "consignment_agreement_id?", "reverses_entry_id?", "entry_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  - method: GET
    path: "/ledger-entries/{id}"
    description: "Reads one ledger entry."
    roles: [PlatformAdmin, ShopManager, Client]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []

# ---------------------------------------------------------------------------
# 1.6 ERROR CODE CATALOG (50 codes)
# ---------------------------------------------------------------------------
errors:
  - id: ERR_MISSING_AUTH_HEADER
    http: 401
    condition: "X-User-Role absent or empty, or X-User-ID absent for an entity-backed role (Technician, Client)"
  - id: ERR_INVALID_ROLE
    http: 401
    condition: "X-User-Role is not one of PlatformAdmin, ShopManager, Technician, Client, MoveCoordinator, ShowroomAgent"
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "the authenticated role is not listed in the endpoint's roles[]"
  - id: ERR_ACTOR_SCOPE_VIOLATION
    http: 403
    condition: "an entity-backed actor addressed a row it does not own - a Client whose X-User-ID differs from the resource's client_id, or a Technician whose X-User-ID differs from RouteDay.technician_id or ServiceOrder.assigned_technician_id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID also performed the conflicting earlier step - releasing a milestone of the order now being adjudicated, or creating the consignment agreement whose sale is being recorded"
  - id: ERR_VALIDATION
    http: 400
    condition: "malformed body or a required input field missing or null"
  - id: ERR_INVALID_ENUM
    http: 400
    condition: "an enum-typed field carries a value outside its declared member list"
  - id: ERR_VALUE_OUT_OF_RANGE
    http: 400
    condition: "a numeric or datetime input falls outside its declared range, or scheduled_window_end_utc is not strictly after scheduled_window_start_utc"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset negative or non-integer"
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "a client_id, consignor_client_id or buyer_client_id does not resolve"
  - id: ERR_LOCATION_NOT_FOUND
    http: 404
    condition: "a location_id, origin_location_id, destination_location_id or current_location_id does not resolve"
  - id: ERR_INSTRUMENT_NOT_FOUND
    http: 404
    condition: "an instrument_id does not resolve"
  - id: ERR_QUOTE_NOT_FOUND
    http: 404
    condition: "a quote_id does not resolve"
  - id: ERR_SERVICE_ORDER_NOT_FOUND
    http: 404
    condition: "a service_order_id does not resolve"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "any other referenced id does not resolve - Technician, RouteDay, Appointment, TuningRecall, Milestone, MoveJob, Warranty, WarrantyClaim, ConsignmentAgreement, PartsLot, PartsAllocation, LedgerEntry"
  - id: ERR_DUPLICATE_SERIAL_NUMBER
    http: 409
    condition: "an instrument with the same serial_number already exists"
  - id: ERR_DUPLICATE_LOT_CODE
    http: 409
    condition: "a parts lot with the same lot_code already exists"
  - id: ERR_OWNERSHIP_MISMATCH
    http: 409
    condition: "a location and an instrument belong to different clients, an appointment location differs from the instrument's current location, a consignor is not the instrument's owner, or a buyer equals the consignor"
  - id: ERR_CLIENT_NOT_ACTIVE
    http: 409
    condition: "the owning client's status is SUSPENDED or CLOSED"
  - id: ERR_INVALID_CUSTODY_STATE
    http: 409
    condition: "the instrument's custody_status does not permit the requested operation - for example starting a REBUILD while it is not IN_SHOP, or listing to the showroom while it is not IN_SHOP"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested transition is not an edge from the resource's current state, or a cross-entity state gate fails (route day not DISPATCHED, order not IN_PROGRESS, milestones not all ACCEPTED, quote not APPROVED, technician INACTIVE, authorizing move job in the wrong status)"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "the target resource already sits in a terminal state of its own machine"
  - id: ERR_STALE_INSTRUMENT_VERSION
    http: 412
    condition: "expected_instrument_version does not equal the instrument's current version"
  - id: ERR_STALE_ROUTE_DAY_VERSION
    http: 412
    condition: "expected_route_day_version does not equal the route day's current version"
  - id: ERR_STALE_PARTS_LOT_VERSION
    http: 412
    condition: "expected_parts_lot_version does not equal the lot's current version"
  - id: ERR_STALE_WARRANTY_VERSION
    http: 412
    condition: "expected_warranty_version does not equal the warranty's current version"
  - id: ERR_PITCH_REFERENCE_MISMATCH
    http: 422
    condition: "reference_pitch_hz differs from the instrument's target_pitch_hz"
  - id: ERR_PITCH_TIER_CONFLICT
    http: 409
    condition: "a pitch assessment changed the effective tier of an instrument that already has an IN_PROGRESS TUNE service order; the pitch fields are committed anyway (see validations priority 46)"
  - id: ERR_SERVICE_PREREQUISITE_NOT_MET
    http: 422
    condition: "the service ladder is violated - voicing an unregulated action, regulating an unassessed instrument, or tuning one already marked REBUILD_REQUIRED"
  - id: ERR_TECH_CERT_INSUFFICIENT
    http: 422
    condition: "the technician's certification rank is below the service type's minimum rank"
  - id: ERR_MOVE_CREW_NOT_CERTIFIED
    http: 422
    condition: "a concert-grand or crane move was scheduled with a crew lead whose move_certified is false"
  - id: ERR_CRANE_REQUIRED
    http: 422
    condition: "a concert-grand move over 2 or more total stair flights was created without crane_required"
  - id: ERR_CLIMATE_OUT_OF_BAND
    http: 422
    condition: "a warranty claim was filed while the instrument's current location carries out_of_band_flag true; the warranty is voided anyway (see validations priority 44)"
  - id: ERR_QUOTE_EXPIRED
    http: 409
    condition: "the logical clock is at or after the quote's expires_at"
  - id: ERR_CONSIGNMENT_EXPIRED
    http: 409
    condition: "the logical clock is at or after the agreement's expires_at"
  - id: ERR_APPOINTMENT_LEAD_TIME
    http: 422
    condition: "scheduled_start_utc is less than 120 minutes after the logical clock"
  - id: ERR_APPOINTMENT_DATE_MISMATCH
    http: 422
    condition: "the date part of scheduled_start_utc differs from the route day's service_date"
  - id: ERR_ROUTE_DAY_LOCK_LEAD
    http: 409
    condition: "a lock was attempted more than 12 hours before 00:00Z on the route day's service_date"
  - id: ERR_TECHNICIAN_ZONE_MISMATCH
    http: 422
    condition: "neither the location's zone_code nor the owning client's home_zone_code is in the technician's zone_codes"
  - id: ERR_APPOINTMENT_OVERLAP
    http: 409
    condition: "the new stop's half-open minute interval intersects another SCHEDULED or CONFIRMED stop on the same route day"
  - id: ERR_INSTRUMENT_DOUBLE_BOOKED
    http: 409
    condition: "the instrument already holds a SCHEDULED or CONFIRMED appointment on the same calendar service_date, on any technician"
  - id: ERR_MOVE_WINDOW_CONFLICT
    http: 409
    condition: "the new move window widened by 90 minutes on both sides intersects an existing non-terminal move window for the same instrument"
  - id: ERR_DUPLICATE_ACTIVE_QUOTE
    http: 409
    condition: "another quote for the same instrument and service_type already holds status ISSUED"
  - id: ERR_MILESTONE_SEQUENCE
    http: 409
    condition: "a milestone was released while a lower sequence_index is not yet ACCEPTED"
  - id: ERR_ATTEMPT_LIMIT_EXCEEDED
    http: 409
    condition: "a capped-retry ceiling was reached - reschedule_count 2, rejection_count 2 or claim_count 2"
  - id: ERR_PARTS_INSUFFICIENT
    http: 409
    condition: "the lot's on_hand_qty is below ceil(requested_qty * 0.50), so not even a partial reserve is possible"
  - id: ERR_ROUTE_CAPACITY_EXCEEDED
    http: 409
    condition: "committed_minutes plus the new stop's total_block_minutes would exceed the route day's capacity_minutes"
  - id: ERR_SALE_BELOW_FLOOR
    http: 422
    condition: "sale_price_cents is below 80% of reserve_price_cents"
  - id: ERR_DEPOSIT_NOT_SETTLED
    http: 402
    condition: "the first milestone was released while the client's account_credit_cents is negative"
  - id: ERR_INSUFFICIENT_CREDIT
    http: 402
    condition: "the client's balance plus the unapplied deposit cannot cover the milestone amount"

# ---------------------------------------------------------------------------
# 1.7 RBAC MATRIX
# ---------------------------------------------------------------------------
roles:
  - name: PlatformAdmin
    description: "Operator with the full surface, plus the logical clock and the ops-run sweep."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /_ops/daily-sweep"
    shared_operations:
      - "every other endpoint in the table"

  - name: ShopManager
    description: "Runs the shop: quotes, service orders, milestone releases, warranties, parts stock, route days."
    identity: opaque
    exclusive_operations:
      - "POST /quotes/{id}/issue"
      - "POST /quotes/{id}/reissue"
      - "POST /milestones/{id}/release"
      - "POST /warranties/{id}/void"
      - "POST /warranty-claims/{id}/review"
      - "POST /warranty-claims/{id}/adjudicate"
      - "POST /service-orders/{id}/resume"
      - "POST /service-orders/{id}/cancel"
      - "POST /parts-lots"
      - "POST /parts-allocations/{id}/release"
      - "POST /clients"
      - "POST /clients/{id}/credit-adjustments"
      - "PATCH /clients/{id}"
    shared_operations:
      - "POST /instruments and its assessment and transition endpoints"
      - "POST /locations, POST /climate-readings, POST /tuning-recalls"
      - "POST /route-days and its status transitions"
      - "POST /appointments and its lifecycle endpoints"
      - "POST /service-orders and its parts allocations"
      - "POST /move-jobs and its status transitions"
      - "consignment endpoints"
      - "all GET endpoints except the technician-scoped ones"

  - name: Technician
    description: "Performs the work: pitch assessments, condition transitions, appointment execution, parts consumption."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /appointments/{id}/start"
      - "POST /appointments/{id}/complete"
      - "POST /appointments/{id}/no-show"
      - "POST /parts-allocations/{id}/consume"
    shared_operations:
      - "POST /instruments/{id}/pitch-assessments"
      - "POST /instruments/{id}/condition-transitions"
      - "POST /service-orders/{id}/start"
      - "POST /service-orders/{id}/complete"
      - "POST /climate-readings"
      - "read endpoints for instruments, locations, route days, appointments, service orders, milestones, warranties, parts"

  - name: Client
    description: "The instrument owner: approves quotes, books and cancels appointments, accepts or rejects milestones, files warranty claims."
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /quotes/{id}/approve"
      - "POST /quotes/{id}/decline"
      - "POST /milestones/{id}/accept"
