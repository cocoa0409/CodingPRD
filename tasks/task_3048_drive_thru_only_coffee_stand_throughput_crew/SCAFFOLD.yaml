    side_effects: ["status -> OPEN", "consecutive_breach_windows reset to 0"]

  - method: POST
    path: "/stands/{standId}/throttle"
    description: "Throttle an OPEN stand (window orders only; app orders rejected)"
    roles: [ShiftLead]
    code: 200
    input: []
    output: Stand
    side_effects: ["status OPEN -> THROTTLED"]

  - method: POST
    path: "/stands/{standId}/resume"
    description: "Resume a THROTTLED stand to OPEN"
    roles: [ShiftLead]
    code: 200
    input: []
    output: Stand
    side_effects: ["status THROTTLED -> OPEN"]

  - method: POST
    path: "/stands/{standId}/close"
    description: "Permanently close a stand with a fully drained queue"
    roles: [StandOperator]
    code: 200
    input: []
    output: Stand
    side_effects: ["status -> CLOSED (terminal)"]

  - method: GET
    path: "/stands/{standId}/royalty-statement"
    description: "Computed monthly royalty statement for the stand (royalty_statement calculation)"
    roles: [PlatformAdmin, RegionalManager, StandOperator]
    code: 200
    input: [month]
    output: { month: string, gross_cents: integer, brand_fund_cents: integer, net_cents: integer, royalty_rate: number, royalty_cents: integer }
    side_effects: []

  # --- CrewMember ---
  - method: POST
    path: "/crew-members"
