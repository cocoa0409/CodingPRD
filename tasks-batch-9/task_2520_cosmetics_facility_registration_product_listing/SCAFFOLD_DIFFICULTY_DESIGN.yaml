  - rule_id: boundary_precision_check
    instances:
      - name: serious_event_points_inclusive_at_restricted_threshold_across_two_facilities
        grounds:
          - calculations.facility_compliance_posture
          - calculations.facility_serious_event_points
          - calculations.serious_event_report_deadline
          - entities.Facility.fields.serious_event_points
        distinguishing_aspect: |
          Boundary on the METRIC serious_event_points at the ">= POSTURE_RESTRICTED_POINTS (10.00)"
          endpoint, exercised on both sides with one clock. Two facilities each carry a single serious
          event whose deadlines differ by one day, so at clock 2026-08-29T12:00:00Z one report is 9
          days late (factor 1.9 -> 9.50 points -> posture stays OPEN, just below) and the other is 10
          days late (factor exactly at LATENESS_FACTOR_CAP 2.0 -> 10.00 points -> posture RESTRICTED,
          inclusive at the threshold). 9.50 and 10.00 straddle the endpoint by one lateness step.
        test_recipe:
          setup:
            - "two REGISTERED facilities F_low and F_high, both approved at clock 2026-08-01T00:00:00Z, and one shared ResponsiblePerson holding one DRAFT listing per facility"
            - "logical clock advanced to 2026-08-06T00:00:00Z, then one SERIOUS event per facility: F_low's received 2026-08-05T10:00:00Z (deadline 2026-08-20T23:59:59.999Z) and F_high's received 2026-08-04T10:00:00Z (deadline 2026-08-19T23:59:59.999Z)"
            - "logical clock advanced to 2026-08-29T12:00:00Z, which is 8d12h past F_low's deadline (ceil -> 9) and 9d12h past F_high's (ceil -> 10)"
            - "no sweep is run, so both events are still REPORT_DUE with base 5"
