          setup:
            - "Clock at 2026-08-01T14:30:00Z — a Saturday — with weekend_is_after_hours true, so the call is after-hours."
            - "One DRAFT coverage window spanning 2026-08-01T00:00:00Z to 2026-08-08T00:00:00Z that is deliberately left unactivated."
