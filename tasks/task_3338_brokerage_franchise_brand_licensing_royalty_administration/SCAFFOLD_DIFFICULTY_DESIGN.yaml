  - rule_id: resource_temporal_overlap
    instances:
      - name: brand_market_regrant_blocked_until_deidentified
        grounds:
          - calculations.brand_market_conflict
          - validations[priority=8]
        distinguishing_aspect: |
          Status-window semantics: the territory resource (brand, market) is
          occupied while the prior agreement is ACTIVE | SUSPENDED |
          TERMINATED | DEIDENTIFYING and frees only when the prior agreement
          reaches CLOSED or EXPIRED — re-grant in between is rejected.
        test_recipe:
          setup:
            - "Agreement A15 for (B15, M15) terminated and in DEIDENTIFYING; a new DRAFT agreement A15b for a different brokerage on the same (B15, M15) with a ready plan"
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { brand_code: "B15", display_name: "Brand Fifteen" }
