          trigger:
            - {call: "POST /program-cycles", as: ProgramManager, as_user_id: "pm-1", payload: {cycle_code: "2026-Q4", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-07-01T00:00:00Z", capacity_slot_total: 4}, captures: {err: "$.data.error_id"}}
          assert:
