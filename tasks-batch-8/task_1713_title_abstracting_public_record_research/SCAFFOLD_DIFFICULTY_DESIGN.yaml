      - name: scope_window_inclusive_start_date
        grounds:
          - calculations.document_scope
          - entities.RecordDocument.fields.in_scope
        distinguishing_aspect: |
          Date-window metric on POST /api/record-documents: the scope lower bound is
          INCLUSIVE — recording_date == scope_start_date is in scope, one calendar day
          earlier is out. Distinct metric and endpoint from the SLA timestamp boundary.
        test_recipe:
          setup:
            - "Order with search_period_years 30 and effective_date 2026-01-15 (scope_start_date = 1996-01-15); one IN_PROGRESS assignment"
          setup_api_calls:
