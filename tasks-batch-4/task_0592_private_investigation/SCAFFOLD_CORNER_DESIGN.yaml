  # =========================================================================
  # RBAC
  # =========================================================================
  - section: rbac
    instances:

      - name: investigator_cannot_run_conflict_check_forbidden_role
        claim_type: Role Denial
        grounds:
          - roles.ComplianceOfficer.exclusive_operations
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Conflict check is exclusive to ComplianceOfficer: an Investigator calling POST /cases/{id}/conflict-check gets 403 ERR_FORBIDDEN_ROLE and the case stays INTAKE."
        test_recipe:
          setup: ["One INTAKE case and one investigator."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Ada Law LLP", contact_email: "ada@law.test" }
              as: CaseManager
              captures: { cl_id: $.data.id }
            - call: "POST /investigators"
              payload: { full_name: "Ivy Nguyen", seniority: "JUNIOR", hourly_rate_cents: 8333 }
              as: PlatformAdmin
              captures: { inv1_id: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${cl_id}", case_type: "SKIP_TRACE", jurisdiction_state: "CA", subject_name: "Sam Subject" }
              as: CaseManager
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/conflict-check"
              payload: { decision: "CLEAR" }
              as: Investigator
              as_user_id: "${inv1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${err} == ERR_FORBIDDEN_ROLE"
            - "Case.${case_id}.status == INTAKE"

      - name: client_contact_cannot_read_another_clients_case
        claim_type: Ownership Denial
        grounds:
          - roles.ClientContact.shared_operations
          - validations[priority=4]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "ClientContact is entity_backed:Client — acting as client B's contact on a case owned by client A returns 403 ERR_NOT_RESOURCE_OWNER, while the same read as client A's contact returns 200."
        test_recipe:
          setup: ["Two Clients A and B; one INTAKE case belonging to client A."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Ada Law LLP", contact_email: "ada@law.test" }
              as: CaseManager
              captures: { cl_a: $.data.id }
            - call: "POST /clients"
              payload: { legal_name: "Bell & Co", contact_email: "bell@law.test" }
              as: CaseManager
              captures: { cl_b: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${cl_a}", case_type: "SKIP_TRACE", jurisdiction_state: "CA", subject_name: "Sam Subject" }
              as: CaseManager
              captures: { case_id: $.data.id }
          trigger:
            - call: "GET /cases/${case_id}"
              payload: {}
              as: ClientContact
              as_user_id: "${cl_b}"
              captures: { err: $.data.error_id }
            - call: "GET /cases/${case_id}"
              payload: {}
              as: ClientContact
              as_user_id: "${cl_a}"
              captures: { own_case_status: $.data.status }
          assert:
            - "the client-B read returns HTTP 403 and ${err} == ERR_NOT_RESOURCE_OWNER"
            - "the client-A read returns HTTP 200 and ${own_case_status} == INTAKE"

      - name: author_cannot_peer_review_own_report_segregation_of_duties
        claim_type: Segregation of duties
        grounds:
          - validations[priority=11]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.InvestigationReport.PEER_REVIEW_to_REDACTION_REVIEW
        distinguishing_aspect: "The report's author (X-User-ID == author_investigator_id) calling POST /reports/{id}/peer-review gets 403 ERR_SEGREGATION_OF_DUTIES; the report stays PEER_REVIEW and reviewer_investigator_id stays null."
        test_recipe:
