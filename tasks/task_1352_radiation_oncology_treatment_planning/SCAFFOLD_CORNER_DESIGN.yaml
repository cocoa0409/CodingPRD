            - "err == ERR_DOSE_CONSTRAINT_VIOLATION (422)"

      - name: no_dose_constraints_blocks_submit
        claim_type: violation_to_error
        grounds: ["validations[priority=9]"]
        distinguishing_aspect: "Submit-for-check requires at least one dose constraint at all: a plan with zero constraints fails with ERR_NO_DOSE_CONSTRAINTS."
        test_recipe:
