              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_a: $.data.id }
            - { call: "POST /pre-award/proposals/${prop_a}/budget-lines", payload: { category: "PERSONNEL", description: "s", fiscal_year: 2026, amount_cents: 1000000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_a}", payload: {}, as: OSPDirector, captures: { pv_a: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_a}/budget-finalizations", payload: { expected_proposal_version: "${pv_a}" }, as: PreAwardAnalyst }
            - { call: "POST /pre-award/proposals/${prop_a}/route", payload: {}, as: PreAwardAnalyst, as_user_id: "analyst-1", captures: { a_status: $.data.status } }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "B", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-06-01", project_end_on: "2027-05-31", pi_effort_pct: 40.00, fa_base_type: "TDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_b: $.data.id }
            - { call: "POST /pre-award/proposals/${prop_b}/budget-lines", payload: { category: "PERSONNEL", description: "s", fiscal_year: 2027, amount_cents: 1000000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_b}", payload: {}, as: OSPDirector, captures: { pv_b: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_b}/budget-finalizations", payload: { expected_proposal_version: "${pv_b}" }, as: PreAwardAnalyst }
          trigger:
            - { call: "POST /pre-award/proposals/${prop_b}/route", payload: {}, as: PreAwardAnalyst, as_user_id: "analyst-1", captures: { b_status: $.data.status } }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "C", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-07-01", project_end_on: "2027-06-30", pi_effort_pct: 0.01, fa_base_type: "TDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_c: $.data.id }
            - { call: "POST /pre-award/proposals/${prop_c}/budget-lines", payload: { category: "PERSONNEL", description: "s", fiscal_year: 2027, amount_cents: 1000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_c}", payload: {}, as: OSPDirector, captures: { pv_c: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_c}/budget-finalizations", payload: { expected_proposal_version: "${pv_c}" }, as: PreAwardAnalyst }
            - call: "POST /pre-award/proposals/${prop_c}/route"
              payload: {}
              as: PreAwardAnalyst
              captures: { c_err: $.data.error_id }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "E", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-12-31", project_end_on: "2027-06-01", pi_effort_pct: 60.00, fa_base_type: "TDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_e: $.data.id }
            - { call: "POST /pre-award/proposals/${prop_e}/budget-lines", payload: { category: "PERSONNEL", description: "s", fiscal_year: 2027, amount_cents: 1000000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_e}", payload: {}, as: OSPDirector, captures: { pv_e: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_e}/budget-finalizations", payload: { expected_proposal_version: "${pv_e}" }, as: PreAwardAnalyst }
            - { call: "POST /pre-award/proposals/${prop_e}/route", payload: {}, as: PreAwardAnalyst, as_user_id: "analyst-1", captures: { e_status: $.data.status } }
            - { call: "GET /pre-award/principal-investigators/${pi_id}", payload: {}, as: OSPDirector, captures: { pi_load: $.data.committed_effort_pct } }
          assert:
            - "a_status == ROUTED and b_status == ROUTED (60 + 40 == 100.00 passes exactly)"
            - "c_err == ERR_PI_EFFORT_EXCEEDED (60 + 40 + 0.01 == 100.01 > 100)"
            - "e_status == ROUTED (A's window ends 2026-12-31 == E's start: half-open adjacency excludes A; contributors are B alone: 40 + 60 == 100.00)"
            - "pi_load == 160.0 (read model sums contributor-state proposals A 60 + B 40 + E 60 regardless of window)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: cost_share_approve_release_conservation
        grounds:
          - state_machines.CostShareCommitment.PLEDGED_to_APPROVED
          - state_machines.CostShareCommitment.APPROVED_to_RELEASED
          - entities.Proposal.fields.total_approved_cost_share_cents
        distinguishing_aspect: |
          Conserved quantity: proposal approved cost-share cents. Approve(1000000)
          then release() is a compensating pair: total_approved_cost_share_cents
          goes 0 -> 1000000 -> 0 and total_request_cents stays 15400000
          throughout (budget totals untouched by the pair).
        test_recipe:
          setup:
            - "Opportunity (no cost-share requirement), eligible PI, 54% rate; proposal BUDGET_LOCKED with one PERSONNEL line 10000000 (total_request 15400000)"
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O1", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5, requires_cost_share: false, min_cost_share_pct_of_request: 0 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P Twenty", department_code: "BIO", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - { call: "POST /pre-award/fa-rate-agreements", payload: { rate_type: "ON_CAMPUS_RESEARCH", rate_pct: 54.00, effective_start_on: "2026-01-01", effective_end_on: "2029-01-01" }, as: OSPDirector }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "Inv1", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 20.00, fa_base_type: "TDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_id: $.data.id }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-lines", payload: { category: "PERSONNEL", description: "s", fiscal_year: 2027, amount_cents: 10000000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-finalizations", payload: { expected_proposal_version: "${pv}" }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { approved_0: $.data.total_approved_cost_share_cents, request_0: $.data.total_request_cents } }
            - call: "POST /pre-award/proposals/${prop_id}/cost-share-commitments"
              payload: { source_type: "DEPARTMENT", amount_cents: 1000000 }
              as: PreAwardAnalyst
              as_user_id: "analyst-1"
              captures: { cs_id: $.data.id }
          trigger:
            - { call: "POST /pre-award/cost-share-commitments/${cs_id}/approve", payload: {}, as: DepartmentChair, as_user_id: "chair-1" }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { approved_1: $.data.total_approved_cost_share_cents, effective_1: $.data.total_effective_cost_share_cents, request_1: $.data.total_request_cents } }
            - { call: "POST /pre-award/cost-share-commitments/${cs_id}/release", payload: {}, as: DepartmentChair, as_user_id: "chair-1" }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { approved_2: $.data.total_approved_cost_share_cents, effective_2: $.data.total_effective_cost_share_cents, request_2: $.data.total_request_cents } }
          assert:
            - "approved_0 == 0 and request_0 == 15400000"
            - "approved_1 == 1000000 and effective_1 == 1000000 and request_1 == 15400000"
            - "approved_2 == 0 and effective_2 == 0 and request_2 == 15400000 (compensating pair leaves both quantities unchanged)"

      - name: pi_effort_withdraw_conservation
        grounds:
          - calculations.pi_effort_capacity
          - state_machines.Proposal.ANY_NON_TERMINAL_to_WITHDRAWN
          - entities.PrincipalInvestigator.fields.committed_effort_pct
        distinguishing_aspect: |
          Conserved quantity: PI committed effort percent (a different quantity
          than cost-share cents). Route at 45% lifts committed_effort_pct from 0
          to 45; withdraw (the compensating action) returns it to exactly 0.
        test_recipe:
          setup:
            - "Opportunity (no cost-share), fresh PI (load 0), 54% rate; proposal effort 45 ROUTED"
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O1", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5, requires_cost_share: false, min_cost_share_pct_of_request: 0 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P TwentyOne", department_code: "ENG", rank: "ASSOCIATE", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - { call: "POST /pre-award/fa-rate-agreements", payload: { rate_type: "ON_CAMPUS_RESEARCH", rate_pct: 54.00, effective_start_on: "2026-01-01", effective_end_on: "2029-01-01" }, as: OSPDirector }
            - { call: "GET /pre-award/principal-investigators/${pi_id}", payload: {}, as: OSPDirector, captures: { load_0: $.data.committed_effort_pct } }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "Inv2", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 45.00, fa_base_type: "TDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_id: $.data.id }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-lines", payload: { category: "PERSONNEL", description: "s", fiscal_year: 2027, amount_cents: 1000000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-finalizations", payload: { expected_proposal_version: "${pv}" }, as: PreAwardAnalyst }
          trigger:
            - { call: "POST /pre-award/proposals/${prop_id}/route", payload: {}, as: PreAwardAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /pre-award/principal-investigators/${pi_id}", payload: {}, as: OSPDirector, captures: { load_1: $.data.committed_effort_pct } }
            - { call: "POST /pre-award/proposals/${prop_id}/withdraw", payload: {}, as: PI, as_user_id: "${pi_id}", captures: { w_status: $.data.status } }
            - { call: "GET /pre-award/principal-investigators/${pi_id}", payload: {}, as: OSPDirector, captures: { load_2: $.data.committed_effort_pct } }
          assert:
            - "load_0 == 0"
            - "load_1 == 45 (route commits effort)"
            - "w_status == WITHDRAWN and load_2 == 0 (withdrawal compensates exactly)"

      - name: budget_line_add_delete_conservation
        grounds:
          - state_machines.Proposal.BUDGET_LOCKED_to_DRAFT
          - entities.BudgetSnapshot.fields.status
          - calculations.indirect_cost
        distinguishing_aspect: |
          Conserved quantity: budget totals in cents (a different quantity than
          cost-share and effort). Adding then deleting a TRAVEL line around a
          re-finalization reproduces the original snapshot totals exactly
          (request 15400000), while the supersede machinery marks the first
          snapshot SUPERSEDED and the second CURRENT.
        test_recipe:
          setup:
            - "Opportunity (no cost-share), eligible PI, 54% rate; proposal with one PERSONNEL line 10000000, finalized (snapshot S1: request 15400000)"
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O1", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5, requires_cost_share: false, min_cost_share_pct_of_request: 0 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P TwentyTwo", department_code: "BIO", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - { call: "POST /pre-award/fa-rate-agreements", payload: { rate_type: "ON_CAMPUS_RESEARCH", rate_pct: 54.00, effective_start_on: "2026-01-01", effective_end_on: "2029-01-01" }, as: OSPDirector }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "Inv3", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 20.00, fa_base_type: "TDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_id: $.data.id }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-lines", payload: { category: "PERSONNEL", description: "s", fiscal_year: 2027, amount_cents: 10000000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv1: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-finalizations", payload: { expected_proposal_version: "${pv1}" }, as: PreAwardAnalyst, captures: { s1_request: $.data.total_request_cents, s1_indirect: $.data.total_indirect_cents } }
          trigger:
            - { call: "POST /pre-award/proposals/${prop_id}/budget-lines", payload: { category: "TRAVEL", description: "t", fiscal_year: 2027, amount_cents: 500000, is_cost_share: false }, as: PreAwardAnalyst, captures: { line_t: $.data.id } }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { p_status_mid: $.data.status } }
            - { call: "GET /pre-award/proposals/${prop_id}/budget-snapshots", payload: {}, as: OSPDirector, captures: { s1_status_mid: "$.data[0].status" } }
            - { call: "DELETE /pre-award/budget-lines/${line_t}", payload: {}, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv2: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-finalizations", payload: { expected_proposal_version: "${pv2}" }, as: PreAwardAnalyst, captures: { s2_request: $.data.total_request_cents, s2_indirect: $.data.total_indirect_cents, s2_status: $.data.status, s2_index: $.data.snapshot_index } }
          assert:
            - "p_status_mid == DRAFT (line add on BUDGET_LOCKED auto-supersedes and drops to DRAFT)"
            - "s1_status_mid == SUPERSEDED"
            - "s2_status == CURRENT and s2_index == 2"
            - "s2_request == 15400000 and s2_indirect == 5400000 (identical to s1_request/s1_indirect: the add+delete pair conserves totals)"
