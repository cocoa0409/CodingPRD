          - errors[ERR_PHOTOGRAPHER_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Interval semantics #1: buffer-expanded open intervals — booking A occupies
          [14:00, 15:00) with a 45-minute buffer, so the exclusion zone is
