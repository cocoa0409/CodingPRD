              captures: { st: $.data.status, tcs: $.data.total_completed_and_stored_cents }
          assert:
            - "PayApplication.${app1}.status == SUBMITTED  (600000 == 600000 is allowed at the <= boundary)"
            - "PayApplication.${app1}.total_completed_and_stored_cents == 600000"

      - name: retention_release_boundary_equal_held_ok
        grounds:
          - validations[priority=13]
          - entities.Project.fields.retainage_held_cents
          - state_machines.RetentionRelease.REQUESTED_to_APPROVED
        distinguishing_aspect: >
          A different metric (retainage_held_cents) on a different endpoint
          (POST /retention-releases/{id}/approve): amount == held (45000 ==
          45000) approves and zeroes held; amount == held + 1 (45001) would
          return ERR_RELEASE_EXCEEDS_HELD. This instance asserts the == boundary
          succeeds.
        test_recipe:
          setup:
            - "Project P created, PayApplication 1 certified (held 45000, project version 2)."
            - "RetentionRelease requested for amount 45000 (ev 2)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "RelBndP", owner_user_id: "owner-1", original_contract_sum_cents: 1000000, default_retainage_pct: 0.10 }
              as: Owner
              as_user_id: "owner-1"
              captures: { proj: $.data.id, pv1: $.data.version }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "001", description: "Foundation", scheduled_value_cents: 600000 }
              as: Contractor
