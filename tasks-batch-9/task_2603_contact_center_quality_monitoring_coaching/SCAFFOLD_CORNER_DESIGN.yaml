          rationale: "The named §1.8 instance walks review_status and feedback_status through four independent combinations on one Evaluation, including the single coupling point at acknowledge."
      - name: sm_cyclic_dispute_loop_terminates
        claim_type: shape_cyclic
        grounds:
          - state_machines.Dispute
          - errors[ERR_DISPUTE_ROUND_LIMIT]
        excluded_because:
          difficulty_instance: non_linear_state_machine / cyclic_dispute_needs_more_info_round_limit
          rationale: "The named §1.8 instance drives NEEDS_MORE_INFO twice around the loop and asserts the MAX_DISPUTE_ROUNDS cut-off, which is exactly the cyclic-shape claim."
      - name: sm_cascade_down_plan_close_only_touches_non_terminal_children
        claim_type: cascade_down
        grounds:
          - state_machines.SamplePlan[OPEN->CLOSED].side_effects
          - state_machines.SampleSelection
        excluded_because:
          difficulty_instance: compensating_invariant / invariant_evaluator_load_ledger_reconciles_after_plan_close_sweep
          rationale: "The named §1.8 instance closes a plan holding SELECTED, ASSIGNED and EVALUATED children and asserts that only the two non-terminal ones are swept, in created_at ASC order."
      - name: sm_ledger_sync_plan_counters_track_child_state
        claim_type: ledger_sync
        grounds:
          - calculations.sample_quota_attainment
          - entities.SamplePlan.fields.selections_count
        excluded_because:
          difficulty_instance: compensating_invariant / invariant_sampling_slots_conserved_across_create_then_exclude
          rationale: "The named §1.8 instance reconciles consumed + remaining against the ancestor plan's counters before and after an exclusion, which is the ledger-sync claim."
      - name: sm_conditional_cascade_reserve_only_when_coaching_state_flips
        claim_type: conditional_cascade
        grounds:
          - state_machines.Evaluation[DRAFT->SUBMITTED].side_effects
          - entities.SamplePlan.fields.targeted_reserve_by_agent
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_submit_autofail_reserves_targeted_sampling_slot
          rationale: "The named §1.8 instance asserts hop 3 fires only because Agent.coaching_state actually flipped into REQUIRED, and not a second time when it was already REQUIRED."
      - name: sm_cross_entity_upheld_dispute_adjusts_three_other_entities
        claim_type: cross_entity
        grounds:
          - state_machines.Dispute[UNDER_REVIEW->UPHELD].side_effects
          - entities.CoachingPlan
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_dispute_upheld_unwinds_finding_and_voids_coaching_plan
          rationale: "The named §1.8 instance follows the four-hop reversal from Dispute through Evaluation, Interaction, Agent and CoachingPlan and asserts each entity's post-state."
      - name: sm_guarded_transition_requires_evaluator_standing
        claim_type: guarded_transitions
        grounds:
          - state_machines.Evaluation[DRAFT->SUBMITTED].preconditions
          - errors[ERR_EVALUATOR_NOT_CALIBRATED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / cross_entity_submit_blocked_by_suspended_evaluator
          rationale: "The named §1.8 instance holds the Evaluation identical and flips only the Evaluator's calibration_status, which is precisely the cross-entity guard claim."

  # =========================================================================
  # 3. From Table 3 (Calculations)
  # =========================================================================
  - section: calculations
    instances:
      - name: calc_analytics_priority_score_known_inputs
        claim_type: correct_result
        grounds:
          - calculations.analytics_priority_score
          - endpoints[POST /analytics-scans]
          - entities.AnalyticsScan.fields.risk_score
        distinguishing_aspect: "One scan exercises every term of the formula at once: silence 30.00 x 0.45 = 13.50, sentiment -0.40 -> 0.40 x 100 x 0.35 = 14.00, NO_DISCLOSURE = 30 give base 57.50; the VOICE multiplier 1.20 gives 69.00 and the disclosure-gap bonus (+15, because RECORDING is required but captured_disclosures is still empty) lands on exactly 84.00 / P1. Multiplying AFTER the bonus, or applying the bonus to base, gives a different number."
        test_recipe:
          setup:
            - "clock 2026-08-05T09:00:00Z; agent A-1001; one VOICE interaction requiring RECORDING with consent still PENDING and captured_disclosures []"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: QualityManager
            - call: "POST /agents"
              payload: { external_ref: "A-1001", full_name: "Ada Agent", team_code: "TEAM-A", hire_date: "2025-03-01T00:00:00Z" }
              as: QualityManager
              captures: { ag1: $.data.id }
            - call: "POST /interactions"
              payload: { agent_id: "${ag1}", channel: "VOICE", started_at: "2026-08-03T10:00:00Z", ended_at: "2026-08-03T10:10:00Z", required_disclosures: ["RECORDING"], customer_flagged: false, csat_score: 4, repeat_contact_within_72h: false }
              as: QualityManager
              captures: { i1: $.data.id, iv1: $.data.version }
          trigger:
            - call: "POST /analytics-scans"
              payload: { interaction_id: "${i1}", silence_pct: 30.00, sentiment_delta: -0.40, expected_interaction_version: "${iv1}", flagged_categories: ["NO_DISCLOSURE"] }
              as: QualityManager
              captures: { sc1: $.data.id }
          assert:
            - "HTTP 201; AnalyticsScan.${sc1}.risk_score == 84.00 and priority_tier == P1"
            - "AnalyticsScan.${sc1}.status == CURRENT, interaction_id == ${i1}, flagged_categories == [NO_DISCLOSURE]"
            - "the stored silence_pct == 30.00 and sentiment_delta == -0.40 are echoed unrounded"
            - "Interaction.${i1}.recording_consent_status is still PENDING -- a scan does not review consent"
      - name: calc_constants_channel_multiplier_and_hundred_cap
        claim_type: constants_applied
        grounds:
          - calculations.analytics_priority_score.constants
          - entities.AnalyticsScan.fields.priority_tier
        distinguishing_aspect: "The same metric payload on a CHAT and on an EMAIL interaction must diverge by exactly the declared CHANNEL_MULTIPLIER (51.50 vs 41.20), and a payload whose raw category points reach 110 must be clamped TWICE -- base capped at 100 before the multiplier, and the post-multiplier + bonus value capped at 100.00 -- landing on 100.00 rather than 135.00."
        test_recipe:
          setup:
            - "clock 2026-08-05T09:00:00Z; agent A-1001; three interactions: CHAT i1, EMAIL i2 (both with no required disclosures) and VOICE i3 requiring RECORDING with nothing captured"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: QualityManager
            - call: "POST /agents"
              payload: { external_ref: "A-1001", full_name: "Ada Agent", team_code: "TEAM-A", hire_date: "2025-03-01T00:00:00Z" }
              as: QualityManager
              captures: { ag1: $.data.id }
            - call: "POST /interactions"
              payload: { agent_id: "${ag1}", channel: "CHAT", started_at: "2026-08-03T10:00:00Z", ended_at: "2026-08-03T10:10:00Z", customer_flagged: false, csat_score: 3, repeat_contact_within_72h: false }
              as: QualityManager
              captures: { i1: $.data.id, iv1: $.data.version }
            - call: "POST /interactions"
              payload: { agent_id: "${ag1}", channel: "EMAIL", started_at: "2026-08-03T11:00:00Z", ended_at: "2026-08-03T11:10:00Z", customer_flagged: false, csat_score: 3, repeat_contact_within_72h: false }
              as: QualityManager
              captures: { i2: $.data.id, iv2: $.data.version }
            - call: "POST /interactions"
              payload: { agent_id: "${ag1}", channel: "VOICE", started_at: "2026-08-03T12:00:00Z", ended_at: "2026-08-03T12:30:00Z", required_disclosures: ["RECORDING"], customer_flagged: true, csat_score: 1, repeat_contact_within_72h: true }
              as: QualityManager
              captures: { i3: $.data.id, iv3: $.data.version }
          trigger:
            - call: "POST /analytics-scans"
              payload: { interaction_id: "${i1}", silence_pct: 20.00, sentiment_delta: -0.50, expected_interaction_version: "${iv1}", flagged_categories: ["PROFANITY"] }
              as: QualityManager
              captures: { sc1: $.data.id }
            - call: "POST /analytics-scans"
              payload: { interaction_id: "${i2}", silence_pct: 20.00, sentiment_delta: -0.50, expected_interaction_version: "${iv2}", flagged_categories: ["PROFANITY"] }
              as: QualityManager
              captures: { sc2: $.data.id }
            - call: "POST /analytics-scans"
              payload: { interaction_id: "${i3}", silence_pct: 100.00, sentiment_delta: -1.00, expected_interaction_version: "${iv3}", flagged_categories: ["PROFANITY", "NO_DISCLOSURE", "ESCALATION_REQUEST", "CONSENT_OBJECTION"] }
              as: QualityManager
              captures: { sc3: $.data.id }
          assert:
            - "CHAT scan -- AnalyticsScan.${sc1}.risk_score == 51.50 (base 9.00 + 17.50 + 25 = 51.50, multiplier 1.00, no disclosure gap because required_disclosures is empty) and priority_tier == P2"
            - "EMAIL scan -- AnalyticsScan.${sc2}.risk_score == 41.20 (the identical base 51.50 x 0.80) and priority_tier == P2; the two rows differ ONLY by the channel multiplier"
            - "VOICE scan -- raw terms are 45.00 + 35.00 + 110 = 190.00, so base clamps to 100; 100 x 1.20 + 15 = 135.00 clamps again to AnalyticsScan.${sc3}.risk_score == 100.00 with priority_tier == P1"
            - "all three rows have status == CURRENT -- they belong to three different interactions, so none supersedes another"
            - "41.20 < 51.50 < 100.00 and no row exceeds 100.00"
      - name: calc_index_input_set_excludes_draft_evaluations
        claim_type: input_set_filtering
        grounds:
          - calculations.agent_quality_index.input_set
          - calculations.agent_quality_correlation.input_set
          - endpoints[GET /agents/{id}/quality-summary]
        distinguishing_aspect: "A DRAFT evaluation exists on the same agent with a fully populated interaction, yet neither quality_index_rolling nor evaluations_considered may see it -- only review_status IN {SUBMITTED, FINALIZED, REOPENED} with a non-null weighted_score counts. An implementation that averages every Evaluation row reads a different number."
        test_recipe:
          setup:
            - "clock 2026-08-05T09:00:00Z; ACTIVE form F1; agent A-1001; evaluator Eve; two consent-VERIFIED 600-second interactions; OPEN plan (target 4, mix 100/0/0)"
            - "selection sel1 evaluated and SUBMITTED at 82.00; selection sel2 assigned with its evaluation e2 left in DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: QualityManager
            - call: "POST /evaluation-forms"
              payload: { name: "Care Quality", version_label: "2026.08", auto_fail_policy: "COMPLIANCE_SECTION_ZERO", min_compliance_item_score: 3, behaviors: [ { code: "DISCLOSE", label: "Disclosures", weight_pct: 30.00, compliance_critical: true, auto_fail_on_violation: true, max_points: 5, allows_not_applicable: false, guidance_text: "State the recording disclosure." }, { code: "GREET", label: "Greeting", weight_pct: 20.00, compliance_critical: false, auto_fail_on_violation: false, max_points: 5, allows_not_applicable: false, guidance_text: "Use the branded greeting." }, { code: "RESOLVE", label: "Resolution", weight_pct: 35.00, compliance_critical: false, auto_fail_on_violation: false, max_points: 5, allows_not_applicable: false, guidance_text: "Resolve or set a next step." }, { code: "SURVEY", label: "Survey", weight_pct: 15.00, compliance_critical: false, auto_fail_on_violation: false, max_points: 5, allows_not_applicable: true, guidance_text: "Invite to the survey." } ] }
              as: QualityManager
              captures: { f1: $.data.id }
            - call: "POST /evaluation-forms/${f1}/activate"
              payload: {}
              as: QualityManager
            - call: "POST /agents"
              payload: { external_ref: "A-1001", full_name: "Ada Agent", team_code: "TEAM-A", hire_date: "2025-03-01T00:00:00Z" }
              as: QualityManager
              captures: { ag1: $.data.id }
            - call: "POST /evaluators"
              payload: { full_name: "Eve Evaluator", max_open_assignments: 3 }
              as: QualityManager
              captures: { ev1: $.data.id }
            - call: "POST /interactions"
              payload: { agent_id: "${ag1}", channel: "VOICE", started_at: "2026-08-03T10:00:00Z", ended_at: "2026-08-03T10:10:00Z", required_disclosures: ["RECORDING"], customer_flagged: false, csat_score: 4, repeat_contact_within_72h: false }
              as: QualityManager
              captures: { i1: $.data.id }
            - call: "POST /interactions/${i1}/consent-review"
              payload: { consent_outcome: "VERIFIED", captured_disclosures: ["RECORDING"] }
              as: ComplianceAuditor
            - call: "POST /interactions"
              payload: { agent_id: "${ag1}", channel: "VOICE", started_at: "2026-08-04T10:00:00Z", ended_at: "2026-08-04T10:10:00Z", required_disclosures: ["RECORDING"], customer_flagged: false, csat_score: 1, repeat_contact_within_72h: true }
              as: QualityManager
              captures: { i2: $.data.id }
            - call: "POST /interactions/${i2}/consent-review"
              payload: { consent_outcome: "VERIFIED", captured_disclosures: ["RECORDING"] }
              as: ComplianceAuditor
            - call: "POST /sample-plans"
              payload: { form_id: "${f1}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z", per_agent_target_volume: 4, source_mix: { random_pct: 100, targeted_pct: 0, customer_flagged_pct: 0 } }
              as: QualityManager
              captures: { pl1: $.data.id }
            - call: "POST /sample-plans/${pl1}/open"
              payload: {}
              as: QualityManager
            - call: "POST /sample-selections"
              payload: { plan_id: "${pl1}", interaction_id: "${i1}", source: "RANDOM" }
              as: QualityManager
              captures: { sel1: $.data.id }
            - call: "POST /sample-selections/${sel1}/assign"
              payload: { assigned_evaluator_id: "${ev1}", review_window_start: "2026-08-05T09:00:00Z", review_window_end: "2026-08-05T11:00:00Z" }
              as: QualityManager
            - call: "POST /evaluations"
              payload: { selection_id: "${sel1}" }
              as: QualityEvaluator
              as_user_id: "${ev1}"
              captures: { e1: $.data.id }
            - call: "POST /evaluations/${e1}/submit"
              payload: { item_scores: { DISCLOSE: 5, GREET: 4, RESOLVE: 3, SURVEY: 5 } }
              as: QualityEvaluator
              as_user_id: "${ev1}"
            - call: "POST /sample-selections"
              payload: { plan_id: "${pl1}", interaction_id: "${i2}", source: "RANDOM" }
              as: QualityManager
              captures: { sel2: $.data.id }
            - call: "POST /sample-selections/${sel2}/assign"
              payload: { assigned_evaluator_id: "${ev1}", review_window_start: "2026-08-05T11:00:00Z", review_window_end: "2026-08-05T13:00:00Z" }
              as: QualityManager
            - call: "POST /evaluations"
              payload: { selection_id: "${sel2}" }
              as: QualityEvaluator
              as_user_id: "${ev1}"
              captures: { e2: $.data.id }
          trigger:
            - call: "GET /agents/${ag1}/quality-summary"
              payload: {}
              as: QualityManager
            - call: "GET /agents/${ag1}"
              payload: {}
              as: QualityManager
          assert:
            - "quality-summary -- evaluations_considered == 1 and paired_sample_size == 1; the DRAFT evaluation ${e2} is invisible to the calculation"
            - "quality-summary -- quality_index_rolling == 82.00 and quality_index_period == 82.00 (one 600-second contact inside the open plan period)"
            - "quality-summary -- repeat_contact_rate == 0.00; interaction ${i2} carries repeat_contact_within_72h true but its evaluation is DRAFT, so it never enters the denominator"
            - "quality-summary -- csat_gap_paired == null and csat_gap_all == null (the single scored row is below HIGH_SCORE_FLOOR 85.00, so the high partition is empty)"
            - "GET /agents/${ag1} -- Agent.${ag1}.quality_index_rolling == 82.00, consecutive_passing_evaluations == 1"
            - "Evaluation.${e2}.review_status == DRAFT with weighted_score == null -- unchanged by the read"
      - name: calc_weighted_scoring_weights_must_total_one_hundred
