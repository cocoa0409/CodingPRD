              payload: { decision: "EXTEND_HOLD", extend_until: "2026-05-04T00:00:00Z" }
              as: AdjustmentAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_INVALID_REQUEST'"
      - name: active_freeze_window_blocks_deposit
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_ACCOUNT_FROZEN]", entities.AccountFreeze]
        distinguishing_aspect: "A deposit attempted while the logical clock sits inside an ACTIVE freeze window [2026-05-01, 2026-05-10] is rejected with ERR_ACCOUNT_FROZEN even though the account status is ACTIVE."
        test_recipe:
          setup: ["account with freeze [2026-05-04T00:00:00Z, 2026-05-10T00:00:00Z]; clock advanced to 2026-05-06"]
          setup_api_calls:
