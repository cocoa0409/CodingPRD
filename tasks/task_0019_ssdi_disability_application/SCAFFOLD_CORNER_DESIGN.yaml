  # =========================================================================
  # Section: errors — every error catalog entry must be triggerable
  # =========================================================================
  - section: errors
    instances:

      - name: error_unauthenticated_missing_headers
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
        distinguishing_aspect: "Request without X-User-ID and X-User-Role headers → 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: SSAAdmin
          trigger:
            - call: "GET /ssdi/claimants"
              payload: {}
              as: Anonymous
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status_code == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

      - name: error_forbidden_role_not_permitted
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FORBIDDEN]
          - validations[priority=2]
        distinguishing_aspect: "Claimant attempting POST /work-credits (SSAAdmin-only) → 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["Claimant exists."]
          setup_api_calls:
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: SSAAdmin
            - call: "POST /ssdi/claimants"
              payload: { ssn_last4: "5001", full_name: "Forbid", date_of_birth: "1980-01-01T00:00:00Z", filing_state: "TX" }
              as: SSAAdmin
              captures: { fb_id: "$.data.id" }
          trigger:
            - call: "POST /ssdi/work-credits"
              payload: { claimant_id: "${fb_id}", year: 2020, credits_earned: 4, earnings_cents: 4800000 }
              as: Claimant
              as_user_id: "${fb_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status_code == 403"
            - "response.data.error_id == ERR_FORBIDDEN"

      - name: error_ssi_not_requested_excluded
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SSI_NOT_REQUESTED]
        excluded_because:
          difficulty_instance: ssi_supplement_eligible_vs_resource_ineligible_variants_on_supplement_entity
          rationale: "SSI supplement only fires when claim_type=CONCURRENT_SSDI_SSI; this gate is examined in the §1.8 dual-variant calc instance (positive path uses CONCURRENT, negative path implicit by claim_type SSDI_ONLY producing no SSISupplement row)."

      - name: error_stale_award_version_excluded
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STALE_AWARD_VERSION]
          - concurrency_rules[child_auxiliary_create_stale_award]
        excluded_because:
          difficulty_instance: state_vs_business_safety_medical_decision_on_draft_with_bad_eod
          rationale: "Stale award version OCC is structurally identical to stale application version OCC tested elsewhere; both are concurrency_rules entries with the same response shape and HTTP status."

