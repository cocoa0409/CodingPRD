      - name: build_status_rejects_out_of_order_and_post_cancel_transitions
        claim_type: Invalid Transitions
        grounds:
          - state_machines.UnitOrder.build_status.transitions
          - validations[priority=12]
          - errors.ERR_INVALID_BUILD_STATE
          - state_machines.UnitOrder.build_status.terminal_states
        distinguishing_aspect: |
          From SPEC_LOCKED the only legal moves are the PRE_CONSTRUCTION trip hold
          and cancel: final-inspection, deliver and start-production are each 409
          ERR_INVALID_BUILD_STATE — and start-production returns the build-state
          error rather than ERR_CHASSIS_NOT_CONFIRMED because priority 12 precedes
          priority 22 — while a CANCELLED unit rejects cancel a second time.
        test_recipe:
          setup:
            - "ApparatusProgram ACTIVE with one RELEASED specification and one UnitOrder in build_status SPEC_LOCKED, no chassis reservation"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Build order program", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /specifications"
              payload: { program_id: "${prog_id}", title: "Pumper spec rev A" }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { spec_id: $.data.id }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "C1", category: "PUMP", requirement_text: "1500 gpm single stage pump", mandatory: true, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c1_id: $.data.id }
            - call: "POST /compliance-entries"
              payload: { specification_id: "${spec_id}", clause_id: "${c1_id}", response: "COMPLY" }
              as: BodyEngineer
              as_user_id: "eng-1"
            - call: "POST /specifications/${spec_id}/submit-review"
              as: PurchasingOfficer
              as_user_id: "po-author"
            - call: "POST /specifications/${spec_id}/release"
              as: PurchasingOfficer
              as_user_id: "po-releaser"
            - call: "POST /unit-orders"
              payload: { program_id: "${prog_id}", specification_id: "${spec_id}", unit_type: "PUMPER", award_year: 2026, gvwr_kg: 17000, front_axle_rating_kg: 6800, rear_axle_rating_kg: 10110, base_curb_front_kg: 5200, base_curb_rear_kg: 7000, crew_seat_count: 4, weight_calc_engineer_user_id: "eng-1" }
              as: PurchasingOfficer
              as_user_id: "po-releaser"
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /unit-orders/${unit_id}/final-inspection"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { e_final: $.data.error_id }
            - call: "POST /unit-orders/${unit_id}/deliver"
              payload: { delivery_date: "2026-10-15T00:00:00Z", training_hours: 16.0, warranty_months: 24 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { e_deliver: $.data.error_id }
            - call: "POST /unit-orders/${unit_id}/start-production"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { e_start: $.data.error_id }
            - call: "POST /unit-orders/${unit_id}/cancel"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /unit-orders/${unit_id}/cancel"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { e_cancel2: $.data.error_id }
          assert:
            - "${e_final} == ERR_INVALID_BUILD_STATE with HTTP 409 (final-inspection needs MID_CON_HELD)"
            - "${e_deliver} == ERR_INVALID_BUILD_STATE with HTTP 409 (deliver needs FINAL_INSPECTED) and no WarrantyStartup row exists: GET /warranty-startups?unit_order_id=${unit_id} returns total_count == 0"
            - "${e_start} == ERR_INVALID_BUILD_STATE with HTTP 409, NOT ERR_CHASSIS_NOT_CONFIRMED — priority 12 runs before priority 22"
            - "the first cancel returns 200 with UnitOrder.${unit_id}.build_status == \"CANCELLED\" and ApparatusProgram.${prog_id}.committed_cents back to 0"
            - "${e_cancel2} == ERR_INVALID_BUILD_STATE with HTTP 409 — CANCELLED is terminal"
            - "UnitOrder.${unit_id}.certification_status is still \"NOT_SUBMITTED\" and long_lead_status is still \"NOT_RESERVED\" throughout"

      - name: reservation_confirm_requires_named_unit_then_locks_out_repeats
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ChassisReservation.RESERVED_to_CONFIRMED
          - validations[priority=17]
          - validations[priority=16]
          - errors.ERR_RESERVATION_UNASSIGNED
          - errors.ERR_INVALID_RESERVATION_STATE
          - calculations.slot_line_utilization
        distinguishing_aspect: |
          confirm demands a non-null unit_order_id (409 ERR_RESERVATION_UNASSIGNED
          on an unassigned hold) and is single-shot (409
          ERR_INVALID_RESERVATION_STATE on the second call), while the slot counts
          are untouched by confirmation because RESERVED and CONFIRMED both occupy a
          slot — reserved_slot_count stays 2 of 2.
        test_recipe:
          setup:
