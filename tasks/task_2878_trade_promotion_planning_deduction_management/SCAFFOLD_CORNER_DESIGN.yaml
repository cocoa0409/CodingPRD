      - name: dispute_negotiation_loop_returns_to_open_without_resetting_the_counter
        claim_type: cyclic
        grounds:
          - state_machines.Dispute.OPEN_to_AWAITING_RETAILER
          - state_machines.Dispute.AWAITING_RETAILER_to_OPEN
          - entities.Dispute.fields.round_count
        distinguishing_aspect: |
          The dispute returns to OPEN after the retailer answers, but round_count is NOT
          reset by the return leg: it reads 1 after the first send, still 1 after the
          response, and 2 after the second send — the loop is bounded because the counter
          survives the cycle.
        test_recipe:
          setup:
            - "A RECEIVED deduction of 400.00 disputed for 400.00, dispute OPEN with round_count 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeductionSpecialist
              as_user_id: "ded-1"
            - call: "POST /trade-marketing/programs"
              payload: { fiscal_year: 2026, name: "FY2026 National Trade Fund", total_budget_amount: 500000.00, accrual_method_default: "CONSUMPTION" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { prog_id: $.data.id }
            - call: "POST /trade-marketing/customers"
              payload: { program_id: "${prog_id}", name: "MegaMart", channel: "GROCERY", deduction_validation_policy: "EVIDENCE_BASED" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { cust_id: $.data.id }
            - call: "POST /trade-marketing/deductions"
              payload: { customer_id: "${cust_id}", claim_reference: "MM-CLAIM-0002", claimed_amount: 400.00, deduction_date: "2026-08-01" }
              as: DeductionSpecialist
              as_user_id: "ded-1"
              captures: { ded_id: $.data.id }
            - call: "POST /trade-marketing/deductions/${ded_id}/dispute"
              payload: { reason_code: "NO_AGREEMENT", disputed_amount: 400.00 }
              as: DeductionSpecialist
              as_user_id: "ded-1"
              captures: { disp_id: $.data.id, rounds_at_open: $.data.round_count }
          trigger:
            - call: "POST /trade-marketing/disputes/${disp_id}/send-to-retailer"
              payload: { packet_notes: "First packet: no signed agreement on file." }
              as: DeductionSpecialist
              as_user_id: "ded-1"
              captures: { rounds_after_send_1: $.data.round_count, status_after_send_1: $.data.status }
            - call: "POST /trade-marketing/disputes/${disp_id}/retailer-respond"
              payload: { retailer_response: "PROVIDE_EVIDENCE" }
              as: CustomerPortalUser
              as_user_id: "${cust_id}"
              captures: { rounds_after_respond_1: $.data.round_count, status_after_respond_1: $.data.status }
            - call: "POST /trade-marketing/disputes/${disp_id}/send-to-retailer"
              payload: { packet_notes: "Second packet: buyer email is not a commitment document." }
              as: DeductionSpecialist
              as_user_id: "ded-1"
              captures: { rounds_after_send_2: $.data.round_count }
          assert:
            - "${rounds_at_open} == 0 and Dispute.${disp_id}.status was OPEN at creation"
            - "${status_after_send_1} == AWAITING_RETAILER and ${rounds_after_send_1} == 1"
            - "${status_after_respond_1} == OPEN and ${rounds_after_respond_1} == 1 — the return leg does not reset the counter"
            - "${rounds_after_send_2} == 2 and Dispute.${disp_id}.status == AWAITING_RETAILER"
            - "Dispute.${disp_id}.retailer_response == PROVIDE_EVIDENCE (the enum value, not free text)"
            - "Deduction.${ded_id}.status == DISPUTED throughout — the loop is on the dispute, not on the claim"

