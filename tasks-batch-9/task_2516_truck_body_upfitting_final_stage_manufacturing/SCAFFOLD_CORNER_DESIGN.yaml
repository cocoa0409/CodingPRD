            - call: "POST /upfit/customers"
              payload: { name: "Valley Aggregates", account_code: "VAG-002", fleet_contact_email: "shop@valley.example" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { cust: "$.data.id" }
            - call: "POST /upfit/build-configurations"
              payload: { config_code: "CFG-DUMP-B", chassis_model_id: "${cm_b}", body_spec_id: "${bs_dump}", standardization_tier: "CUSTOM" }
              as: UpfitEngineer
              as_user_id: "eng-1"
