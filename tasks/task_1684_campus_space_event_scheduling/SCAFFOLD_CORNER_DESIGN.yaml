      - name: service_window_outside_event_pad_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_SERVICE_WINDOW_OUT_OF_RANGE]"]
        distinguishing_aspect: "Service windows may extend at most 2h beyond the event (inclusive edge): an 11:59 start for a 14:00 event is rejected, a 12:00 start is accepted."
        test_recipe:
          setup: ["INTERNAL org; APPROVED event 2026-09-16 14:00-15:00"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept V", org_type: "INTERNAL_DEPARTMENT", contact_email: "v@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
