          difficulty_instance: penalty_multiplier_excludes_the_escalating_action_itself
          rationale: "That §1.8 instance pins the 1.00, 1.50 and 2.25 tiers on one subject and proves the row excludes its own penalty from prior_assessed_total_cents."

      - name: pollutant_load_per_sample_precision_and_the_attainment_equality
        claim_type: precision
        grounds:
          - calculations.outfall_annual_pollutant_load.precision
        excluded_because:
          difficulty_instance: pollutant_load_holds_four_decimals_per_sample_and_treats_equality_as_attaining
          rationale: "That §1.8 instance pins a 4 decimal per-sample load, the 2 decimal gross, and a net load exactly equal to the waste load allocation that must read ATTAINING under the strict comparison."

      - name: provisional_load_variant_values_the_samples_still_owed
        claim_type: variant_selection
        grounds:
          - calculations.outfall_annual_pollutant_load.variants
        excluded_because:
          difficulty_instance: pollutant_load_provisional_projects_owed_samples_final_does_not
          rationale: "That §1.8 instance calls both variants against the same outfall and shows the projected sample count and the non-persistence of the PROVISIONAL result."

      - name: compliance_posture_is_a_census_of_behind_measures_and_exceeding_outfalls
        claim_type: correct_result
        grounds:
          - calculations.permit_term_compliance_posture
        excluded_because:
          difficulty_instance: report_certification_blocked_by_permit_term_posture
          rationale: "That §1.8 instance drives two measures BEHIND to reach NON_COMPLIANT and then shows the posture blocking certification at priority 86."

  - section: validations
