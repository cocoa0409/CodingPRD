            - "Project B (R-2, 20 units, dev-2) IN_LIEU_FEE with a FULL assessment for all 20000 bps: base 48000000, surcharge 1680000, pre-discount 49680000, 150 bps tier, discount 745200, assessed 48934800, due_date 2026-09-15, left entirely unpaid."
            - "Project C (R-2, 20 units, dev-2) ONSITE with OWNERSHIP 2br unit CS-201 restricted at 32500000, household H2 certified into it at rent 0, and a resale priced 32000000 approved on 2026-08-01 so its rofr_deadline is 2026-08-31T00:00:00Z."
