              call: "POST /cost-cap-policies"
              payload:
                remedial_action_plan_id: "${plan_id}"
                insurer_party_id: "${insurer_id}"
                policy_reference: "CCP-2743-C1"
                term_years: 5
                expected_remedial_action_plan_version: "${plan_v_sub}"
              as: Insurer
              as_user_id: "${insurer_id}"
              captures: { pol_sub_id: $.data.id }
          trigger:
            - &c_plantech_rev
              call: "POST /remedial-action-plans/${plan_id}/technical-review"
              payload: { decision: REQUEST_REVISION, review_comment: "Groundwater capture zone under-designed." }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
          assert:
            - "HTTP 200; RemedialActionPlan.${plan_id}.status == 'REVISION_REQUESTED' and revision_round == 1"
            - "RemedialActionPlan.${plan_id}.public_comment_state == 'NOT_STARTED' and public_comment_count == 0"
            - "RemedialActionPlan.${plan_id}.pinned_cleanup_goal_versions == [] (cleared)"
            - "RemedialActionPlan.${plan_id}.technical_review_state == 'NOT_STARTED' (never advanced to PASSED)"
            - "CostCapPolicy.${pol_sub_id}.status == 'CANCELLED' with its version incremented by 1"
            - "CostCapPolicy.${pol_sub_id}.underwriting_estimate_cents == 139803445 is preserved as history on the cancelled quote"
            - "SiteControl.${ctl_id}.status == 'PROPOSED' — the control is not touched by a revision request"

      - name: withdraw_enrollment_with_approved_plan_rejected
        claim_type: precondition_enforcement
        grounds:
