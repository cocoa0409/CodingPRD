              captures: { fac_id: $.data.id }
            - call: "POST /gfco/suppliers"
              payload: { name: "Prairie Mills", country_code: "CA", gluten_handling_disclosed: false }
              as: ProgramAdministrator
              captures: { sup_id: $.data.id }
            - call: "POST /gfco/ingredients"
              payload: { applicant_id: "${app_id}", supplier_id: "${sup_id}", name: "Brown Rice Flour", risk_class: "INHERENTLY_GF" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { ing_id: $.data.id }
            - call: "POST /gfco/products"
              payload: { applicant_id: "${app_id}", facility_id: "${fac_id}", name: "Rice Sandwich Loaf", sku: "RSL-001" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /gfco/product-ingredients"
              payload: { product_id: "${prod_id}", ingredient_id: "${ing_id}", inclusion_pct: 100 }
              as: ApplicantContact
              as_user_id: "${app_id}"
            - call: "POST /gfco/products/${prod_id}/formula-review"
              payload: { decision: "REJECT", rejection_reason: "Sub-component disclosure incomplete" }
              as: CertificationReviewer
              as_user_id: "rev-1"
              captures: { prod_v: $.data.version, prod_formula: $.data.formula_status }
          trigger:
            - call: "POST /gfco/products/${prod_id}/testing-plan"
