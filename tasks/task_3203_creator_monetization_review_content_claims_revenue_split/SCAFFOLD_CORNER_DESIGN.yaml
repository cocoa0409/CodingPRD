            - call: "GET /api/content-items/${i_hc}"
              payload: {}
              as: Any
              captures: { i_hcv: $.data.version }
          trigger:
            - call: "POST /api/revenue-routings"
              payload: { content_item_id: "${i_hc}", stream_type: "AD", gross_revenue_cents: 1001, expected_content_item_version: "${i_hcv}" }
