            - call: "POST /critical-findings/00000000-0000-0000-0000-0000000000ff/impose-restriction"
              payload: { action: "CLOSE", authorized_by_id: "00000000-0000-0000-0000-0000000000ff" }
              as: PermitOfficer
              captures: { err_district_op: $.data.error_id }
            - call: "POST /permit-applications/00000000-0000-0000-0000-0000000000ff/analyze"
              payload: {}
              as: ProgramAdmin
              captures: { err_permit_op: $.data.error_id }
            - call: "POST /federal-submissions/00000000-0000-0000-0000-0000000000ff/review"
              payload: { decision: "ACCEPT" }
              as: ProgramAdmin
