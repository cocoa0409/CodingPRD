# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2819 — Office Coffee Service & Equipment Program
# Nine §0.5 rule_ids, 22 instances. Every numeric assert below was computed by
# executing the referenced §1.3 formula and its constants in code.
#
# Shared fixture conventions used by every instance (each instance still rebuilds
# the whole chain from an empty DB):
#   clock anchor 2026-08-03T08:00:00Z (a Monday), route service_day MON,
#   Route.capacity_minutes 480, Route.travel_buffer_minutes 30,
#   EquipmentModel URN-30 (30 cph, headcount band 1..250, monthly_rent_cents 4500,
#   descale_interval_days 90, list_value_cents 120000),
#   catalog prices in micro-dollars (1 cent == 10000 micros):
#     COFFEE 4500000 (green-linked), CREAMER 1250000, TEA 2000000, WATER 8750000,
#     PANTRY stirrers 25000, PANTRY cups 15000,
#   canonical site: headcount 40, days_per_week 5, brew_style DRIP
#     -> forecast_cups_per_week 360, required_peak_cups_per_hour 26,
#        par/reorder COFFEE 65/26, CREAMER 360/144, TEA 36/15, WATER 8/4, PANTRY 288/116.

scaffold_difficulty_design:

  # =====================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: site_par_sizing_headcount_model_vs_trailing_usage_divergence
        grounds:
          - calculations.site_consumption_forecast
          - entities.Site.fields.consumption_model
          - entities.ParLevel.fields.par_units
          - entities.ParLevel.fields.reorder_point_units
          - validations[priority=38]
        distinguishing_aspect: |
          Variant divergence on the SITE/PAR-LEVEL demand domain: two sites with byte-identical
          headcount (40), days_per_week (5) and brew_style (DRIP) produce COFFEE par_units 65 under
          HEADCOUNT_MODEL and 11 under TRAILING_USAGE, because the trailing variant reads 20
          actually-delivered units over the 28-day window instead of projected cups.
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z; one MON route with 480 capacity minutes and a 30-minute travel buffer"
            - "catalog: model URN-30 and a single green-linked COFFEE product at 4500000 micros per unit"
            - "one CONSOLIDATED account with two sites, both headcount 40 / days_per_week 5 / HEADCOUNT_MODEL, both planned with brew_style DRIP"
            - "site B has one COMPLETED visit on 2026-08-03 that delivered 20 COFFEE units, and is then switched to consumption_model TRAILING_USAGE"
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/routes"
              payload: { name: "Metro MON", service_day: "MON", capacity_minutes: 480, travel_buffer_minutes: 30 }
              as: ProgramAdmin
              captures: { route_id: "$.data.id" }
            - call: "POST /ocs/equipment-models"
              payload: { model_code: "URN-30", brewer_class: "THERMAL", cups_per_hour_capacity: 30, min_headcount: 1, max_headcount: 250, monthly_rent_cents: 4500, descale_interval_days: 90, list_value_cents: 120000 }
              as: ProgramAdmin
              captures: { model_id: "$.data.id" }
            - call: "POST /ocs/product-items"
              payload: { sku: "COF-HOUSE-12OZ", category: "COFFEE", base_unit_price_micros: 4500000, pack_units: 6, green_coffee_linked: true }
              as: ProgramAdmin
              captures: { p_cof_id: "$.data.id" }
            - call: "POST /ocs/accounts"
              payload: { legal_name: "Northgate Holdings LLC", billing_mode: "CONSOLIDATED", green_index_baseline_micros: 2000000, price_protection_days: 90 }
              as: AccountManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /ocs/sites"
              payload: { account_id: "${acct_id}", route_id: "${route_id}", site_name: "HQ Floor 3", headcount: 40, days_per_week: 5, consumption_model: "HEADCOUNT_MODEL", service_minutes_estimate: 45 }
              as: AccountManager
              captures: { site_a_id: "$.data.id" }
            - call: "POST /ocs/sites"
              payload: { account_id: "${acct_id}", route_id: "${route_id}", site_name: "HQ Floor 4", headcount: 40, days_per_week: 5, consumption_model: "HEADCOUNT_MODEL", service_minutes_estimate: 45 }
              as: AccountManager
              captures: { site_b_id: "$.data.id" }
            - call: "POST /ocs/sites/${site_a_id}/size-and-plan"
              payload: { brew_style: "DRIP" }
              as: AccountManager
            - call: "POST /ocs/sites/${site_b_id}/size-and-plan"
              payload: { brew_style: "DRIP" }
              as: AccountManager
            - call: "GET /ocs/par-levels"
              payload: { site_id: "${site_a_id}", product_id: "${p_cof_id}" }
              as: AccountManager
              captures: { par_a_cof_id: "$.data[0].id" }
            - call: "GET /ocs/par-levels"
              payload: { site_id: "${site_b_id}", product_id: "${p_cof_id}" }
              as: AccountManager
              captures: { par_b_cof_id: "$.data[0].id" }
            - call: "POST /ocs/service-visits"
              payload: { site_id: "${site_b_id}", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T09:45:00Z", planned_minutes: 45 }
              as: AccountManager
              captures: { visit_b1_id: "$.data.id" }
            - call: "POST /ocs/service-visits/${visit_b1_id}/lines"
              payload: { product_id: "${p_cof_id}", requested_units: 20 }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/service-visits/${visit_b1_id}/complete"
              payload: { delivered_lines: [{ product_id: "${p_cof_id}", delivered_units: 20 }] }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "PATCH /ocs/sites/${site_b_id}"
              payload: { consumption_model: "TRAILING_USAGE" }
              as: AccountManager
          trigger:
            - call: "POST /ocs/sites/${site_b_id}/size-and-plan"
              payload: { brew_style: "DRIP" }
              as: AccountManager
          assert:
            - "ParLevel.${par_a_cof_id}.par_units == 65 and ParLevel.${par_a_cof_id}.reorder_point_units == 26"
            - "ParLevel.${par_b_cof_id}.par_units == 11 and ParLevel.${par_b_cof_id}.reorder_point_units == 5"
            - "ParLevel.${par_a_cof_id}.par_units != ParLevel.${par_b_cof_id}.par_units"
            - "Site.${site_a_id}.forecast_cups_per_week == 360 and Site.${site_b_id}.forecast_cups_per_week == 360"
            - "Site.${site_b_id}.required_peak_cups_per_hour == 26"
            - "ParLevel.${par_b_cof_id}.on_hand_units == 20 and ParLevel.${par_b_cof_id}.cumulative_delivered_units == 20"
            - "ParLevel.${par_b_cof_id}.stock_status == IN_STOCK"
            - "Site.${site_b_id}.consumption_model == TRAILING_USAGE and Site.${site_b_id}.recommended_model_id == ${model_id}"

      - name: equipment_program_charge_loan_recovery_vs_rental_surcharge_divergence
        grounds:
          - calculations.equipment_program_charge
          - entities.EquipmentPlacement.fields.terms_type
          - entities.EquipmentPlacement.fields.shortfall_fee_cents
          - state_machines.EquipmentPlacement.SHORTFALL_WARNED_to_SHORTFALL_BILLED
          - validations[priority=43]
        distinguishing_aspect: |
          Variant divergence on the EQUIPMENT-PLACEMENT money domain (a different entity and a
          different metric than instance 1): with identical minimum_purchase_cents 100000 and
          trailing_purchase_cents 0, LOAN bills 35% of the unmet commitment (35000 cents) while
          RENTAL bills a 25% surcharge on the full monthly rent (1125 cents).
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z; one MON route; model URN-30 with monthly_rent_cents 4500"
            - "one account with two planned sites, each carrying one PLACEMENT asset"
            - "site A placement is LOAN with minimum_purchase_cents 100000; site B placement is RENTAL with the same 100000"
            - "neither site has any COMPLETED visit, so trailing_purchase_rollup returns 0 for both"
            - "both placements have already been evaluated once, so both sit in compliance_status SHORTFALL_WARNED"
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/routes"
              payload: { name: "Metro MON", service_day: "MON", capacity_minutes: 480, travel_buffer_minutes: 30 }
              as: ProgramAdmin
              captures: { route_id: "$.data.id" }
            - call: "POST /ocs/equipment-models"
              payload: { model_code: "URN-30", brewer_class: "THERMAL", cups_per_hour_capacity: 30, min_headcount: 1, max_headcount: 250, monthly_rent_cents: 4500, descale_interval_days: 90, list_value_cents: 120000 }
              as: ProgramAdmin
              captures: { model_id: "$.data.id" }
            - call: "POST /ocs/equipment-assets"
              payload: { model_id: "${model_id}", serial_number: "URN30-0001", asset_role: "PLACEMENT" }
              as: ProgramAdmin
              captures: { asset_a_id: "$.data.id" }
            - call: "POST /ocs/equipment-assets"
              payload: { model_id: "${model_id}", serial_number: "URN30-0002", asset_role: "PLACEMENT" }
              as: ProgramAdmin
              captures: { asset_b_id: "$.data.id" }
            - call: "POST /ocs/accounts"
              payload: { legal_name: "Northgate Holdings LLC", billing_mode: "CONSOLIDATED", green_index_baseline_micros: 2000000, price_protection_days: 90 }
              as: AccountManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /ocs/sites"
              payload: { account_id: "${acct_id}", route_id: "${route_id}", site_name: "HQ Floor 3", headcount: 40, days_per_week: 5, consumption_model: "HEADCOUNT_MODEL", service_minutes_estimate: 45 }
              as: AccountManager
              captures: { site_a_id: "$.data.id" }
            - call: "POST /ocs/sites"
              payload: { account_id: "${acct_id}", route_id: "${route_id}", site_name: "HQ Floor 4", headcount: 40, days_per_week: 5, consumption_model: "HEADCOUNT_MODEL", service_minutes_estimate: 45 }
              as: AccountManager
              captures: { site_b_id: "$.data.id" }
            - call: "POST /ocs/sites/${site_a_id}/size-and-plan"
              payload: { brew_style: "DRIP" }
              as: AccountManager
              captures: { site_a_v: "$.data.version" }
            - call: "POST /ocs/sites/${site_b_id}/size-and-plan"
              payload: { brew_style: "DRIP" }
              as: AccountManager
              captures: { site_b_v: "$.data.version" }
            - call: "POST /ocs/equipment-placements"
              payload: { site_id: "${site_a_id}", asset_id: "${asset_a_id}", terms_type: "LOAN", minimum_purchase_cents: 100000, min_term_months: 12, expected_site_version: "${site_a_v}" }
              as: AccountManager
              captures: { pl_a_id: "$.data.id" }
            - call: "POST /ocs/equipment-placements"
              payload: { site_id: "${site_b_id}", asset_id: "${asset_b_id}", terms_type: "RENTAL", minimum_purchase_cents: 100000, min_term_months: 12, expected_site_version: "${site_b_v}" }
              as: AccountManager
              captures: { pl_b_id: "$.data.id" }
            - call: "POST /ocs/equipment-placements/${pl_a_id}/evaluate-compliance"
              payload: {}
              as: BillingSpecialist
            - call: "POST /ocs/equipment-placements/${pl_b_id}/evaluate-compliance"
              payload: {}
              as: BillingSpecialist
          trigger:
            - call: "POST /ocs/equipment-placements/${pl_a_id}/evaluate-compliance"
              payload: {}
              as: BillingSpecialist
            - call: "POST /ocs/equipment-placements/${pl_b_id}/evaluate-compliance"
              payload: {}
              as: BillingSpecialist
          assert:
            - "EquipmentPlacement.${pl_a_id}.compliance_status == SHORTFALL_BILLED and EquipmentPlacement.${pl_b_id}.compliance_status == SHORTFALL_BILLED"
            - "EquipmentPlacement.${pl_a_id}.trailing_purchase_cents == 0 and EquipmentPlacement.${pl_b_id}.trailing_purchase_cents == 0"
            - "EquipmentPlacement.${pl_a_id}.shortfall_fee_cents == 35000"
            - "EquipmentPlacement.${pl_b_id}.shortfall_fee_cents == 1125"
            - "EquipmentPlacement.${pl_a_id}.rent_charge_cents == 0 and EquipmentPlacement.${pl_b_id}.rent_charge_cents == 0"
            - "EquipmentPlacement.${pl_a_id}.minimum_purchase_cents == EquipmentPlacement.${pl_b_id}.minimum_purchase_cents == 100000"

  # =====================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: green_index_cap_binds_when_pass_through_exceeds_1500_bps
        grounds:
          - calculations.green_index_adjustment
          - entities.PriceAdjustment.fields.movement_bps
          - entities.PriceAdjustment.fields.adjustment_pct_bps
          - entities.Account.fields.green_price_factor_bps
          - state_machines.PriceAdjustment.PROPOSED_to_ACCEPTED
        distinguishing_aspect: |
          MODE (a) — four inputs (Account.green_index_baseline_micros, the market index,
          PASS_THROUGH_BPS 6000, ADJUSTMENT_CAP_BPS 1500) interacting non-linearly through
          max(-1500, min(1500, raw)): a +5000 bps index move yields raw 3000 bps but the stored
          adjustment_pct_bps is 1500, and acceptance therefore lands green_price_factor_bps on
          11500 rather than 13000.
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z"
            - "one account with green_index_baseline_micros 2000000 and price_protection_days 90, never price-protected"
            - "the market green index has been moved to 3000000 micros, a +5000 bps move"
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/accounts"
              payload: { legal_name: "Northgate Holdings LLC", billing_mode: "CONSOLIDATED", green_index_baseline_micros: 2000000, price_protection_days: 90 }
              as: AccountManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /ocs/_market/set_green_index"
              payload: { index_micros: 3000000 }
              as: ProgramAdmin
          trigger:
            - call: "POST /ocs/price-adjustments"
              payload: { account_id: "${acct_id}", effective_at: "2026-09-01T00:00:00Z" }
              as: BillingSpecialist
              captures: { adj_id: "$.data.id" }
            - call: "POST /ocs/price-adjustments/${adj_id}/respond"
              payload: { disposition: "ACCEPT" }
              as: CustomerContact
              as_user_id: "${acct_id}"
          assert:
            - "PriceAdjustment.${adj_id}.index_baseline_micros == 2000000 and PriceAdjustment.${adj_id}.index_current_micros == 3000000"
            - "PriceAdjustment.${adj_id}.movement_bps == 5000"
            - "PriceAdjustment.${adj_id}.adjustment_pct_bps == 1500"
            - "PriceAdjustment.${adj_id}.adjustment_pct_bps != 3000"
            - "PriceAdjustment.${adj_id}.adj_status == ACCEPTED and PriceAdjustment.${adj_id}.revision_count == 0"
            - "Account.${acct_id}.green_price_factor_bps == 11500"
            - "Account.${acct_id}.green_index_baseline_micros == 3000000"
            - "Account.${acct_id}.price_protection_until == 2026-11-01T08:00:00Z"

      - name: invoice_line_rounding_per_line_beats_sum_then_round
        grounds:
          - calculations.invoice_line_rounding
          - calculations.invoice_assembly_order
          - entities.InvoiceLine.fields.amount_cents
          - entities.ConsolidatedInvoice.fields.pre_freight_total_cents
          - entities.ConsolidatedInvoice.fields.total_cents
        distinguishing_aspect: |
          MODE (b) — nested rounding order pinned: two sub-cent PANTRY lines per site (3 stirrers at
          25000 micros = 7.5c and 3 cups at 15000 micros = 4.5c) round to 8 and 5 per line, so the
          two-site invoice totals 32826 cents; the forbidden sum-then-round order yields 32824, a
          2-cent difference the assertion pins.
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z; one MON route, 480 capacity minutes, 30-minute buffer"
            - "catalog: COFFEE 4500000, CREAMER 1250000, TEA 2000000, WATER 8750000, PANTRY stirrer 25000, PANTRY cup 15000 micros"
            - "one CONSOLIDATED account with two planned sites, each carrying a RENTAL placement created on 2026-08-03 on model URN-30 (monthly_rent_cents 4500)"
            - "site 1 COMPLETED a visit delivering COFFEE 20, CREAMER 4, TEA 2, stirrers 3, cups 3; site 2 COMPLETED a visit delivering COFFEE 15, WATER 6, stirrers 3, cups 3"
            - "clock moved to 2026-09-01T00:00:00Z so the August period is closed"
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/routes"
              payload: { name: "Metro MON", service_day: "MON", capacity_minutes: 480, travel_buffer_minutes: 30 }
              as: ProgramAdmin
              captures: { route_id: "$.data.id" }
            - call: "POST /ocs/equipment-models"
              payload: { model_code: "URN-30", brewer_class: "THERMAL", cups_per_hour_capacity: 30, min_headcount: 1, max_headcount: 250, monthly_rent_cents: 4500, descale_interval_days: 90, list_value_cents: 120000 }
              as: ProgramAdmin
              captures: { model_id: "$.data.id" }
            - call: "POST /ocs/equipment-assets"
              payload: { model_id: "${model_id}", serial_number: "URN30-0001", asset_role: "PLACEMENT" }
              as: ProgramAdmin
              captures: { asset_1_id: "$.data.id" }
            - call: "POST /ocs/equipment-assets"
              payload: { model_id: "${model_id}", serial_number: "URN30-0002", asset_role: "PLACEMENT" }
              as: ProgramAdmin
              captures: { asset_2_id: "$.data.id" }
            - call: "POST /ocs/product-items"
              payload: { sku: "COF-HOUSE-12OZ", category: "COFFEE", base_unit_price_micros: 4500000, pack_units: 6, green_coffee_linked: true }
              as: ProgramAdmin
              captures: { p_cof_id: "$.data.id" }
            - call: "POST /ocs/product-items"
              payload: { sku: "CRM-LIQ-QT", category: "CREAMER", base_unit_price_micros: 1250000, pack_units: 12, green_coffee_linked: false }
              as: ProgramAdmin
              captures: { p_crm_id: "$.data.id" }
            - call: "POST /ocs/product-items"
              payload: { sku: "TEA-ASSORT-25", category: "TEA", base_unit_price_micros: 2000000, pack_units: 10, green_coffee_linked: false }
              as: ProgramAdmin
              captures: { p_tea_id: "$.data.id" }
            - call: "POST /ocs/product-items"
              payload: { sku: "WTR-5GAL", category: "WATER", base_unit_price_micros: 8750000, pack_units: 1, green_coffee_linked: false }
              as: ProgramAdmin
              captures: { p_wtr_id: "$.data.id" }
            - call: "POST /ocs/product-items"
              payload: { sku: "PAN-STIR-1000", category: "PANTRY", base_unit_price_micros: 25000, pack_units: 1000, green_coffee_linked: false }
              as: ProgramAdmin
              captures: { p_stir_id: "$.data.id" }
            - call: "POST /ocs/product-items"
              payload: { sku: "PAN-CUP-8OZ", category: "PANTRY", base_unit_price_micros: 15000, pack_units: 1000, green_coffee_linked: false }
              as: ProgramAdmin
              captures: { p_cup_id: "$.data.id" }
            - call: "POST /ocs/accounts"
              payload: { legal_name: "Northgate Holdings LLC", billing_mode: "CONSOLIDATED", green_index_baseline_micros: 2000000, price_protection_days: 90 }
              as: AccountManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /ocs/sites"
              payload: { account_id: "${acct_id}", route_id: "${route_id}", site_name: "HQ Floor 3", headcount: 40, days_per_week: 5, consumption_model: "HEADCOUNT_MODEL", service_minutes_estimate: 45 }
              as: AccountManager
              captures: { site_1_id: "$.data.id" }
            - call: "POST /ocs/sites"
              payload: { account_id: "${acct_id}", route_id: "${route_id}", site_name: "HQ Floor 4", headcount: 40, days_per_week: 5, consumption_model: "HEADCOUNT_MODEL", service_minutes_estimate: 45 }
              as: AccountManager
              captures: { site_2_id: "$.data.id" }
            - call: "POST /ocs/sites/${site_1_id}/size-and-plan"
              payload: { brew_style: "DRIP" }
              as: AccountManager
              captures: { site_1_v: "$.data.version" }
            - call: "POST /ocs/sites/${site_2_id}/size-and-plan"
              payload: { brew_style: "DRIP" }
              as: AccountManager
              captures: { site_2_v: "$.data.version" }
            - call: "POST /ocs/equipment-placements"
              payload: { site_id: "${site_1_id}", asset_id: "${asset_1_id}", terms_type: "RENTAL", minimum_purchase_cents: 60000, min_term_months: 12, expected_site_version: "${site_1_v}" }
              as: AccountManager
              captures: { pl_1_id: "$.data.id" }
            - call: "POST /ocs/equipment-placements"
              payload: { site_id: "${site_2_id}", asset_id: "${asset_2_id}", terms_type: "RENTAL", minimum_purchase_cents: 60000, min_term_months: 12, expected_site_version: "${site_2_v}" }
              as: AccountManager
              captures: { pl_2_id: "$.data.id" }
            - call: "POST /ocs/service-visits"
              payload: { site_id: "${site_1_id}", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T09:45:00Z", planned_minutes: 45 }
              as: AccountManager
              captures: { visit_1_id: "$.data.id" }
            - call: "POST /ocs/service-visits"
              payload: { site_id: "${site_2_id}", window_start: "2026-08-03T10:30:00Z", window_end: "2026-08-03T11:15:00Z", planned_minutes: 45 }
              as: AccountManager
              captures: { visit_2_id: "$.data.id" }
            - call: "POST /ocs/service-visits/${visit_1_id}/lines"
              payload: { product_id: "${p_cof_id}", requested_units: 20 }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/service-visits/${visit_1_id}/lines"
              payload: { product_id: "${p_crm_id}", requested_units: 4 }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/service-visits/${visit_1_id}/lines"
              payload: { product_id: "${p_tea_id}", requested_units: 2 }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/service-visits/${visit_1_id}/lines"
              payload: { product_id: "${p_stir_id}", requested_units: 3 }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/service-visits/${visit_1_id}/lines"
              payload: { product_id: "${p_cup_id}", requested_units: 3 }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/service-visits/${visit_2_id}/lines"
              payload: { product_id: "${p_cof_id}", requested_units: 15 }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/service-visits/${visit_2_id}/lines"
              payload: { product_id: "${p_wtr_id}", requested_units: 6 }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/service-visits/${visit_2_id}/lines"
              payload: { product_id: "${p_stir_id}", requested_units: 3 }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/service-visits/${visit_2_id}/lines"
              payload: { product_id: "${p_cup_id}", requested_units: 3 }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/_clock/set_current_utc"
