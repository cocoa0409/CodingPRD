            - { call: "POST /photos", payload: { visit_id: "${vP}", phase: "AFTER", image_uri: "s3://proof/vP-after-2.jpg" }, as: CrewLead, captures: { pB: $.data.id } }
            - { call: "POST /photos", payload: { visit_id: "${vP}", phase: "AFTER", image_uri: "s3://proof/vP-after-3.jpg" }, as: CrewLead, captures: { pC: $.data.id } }
            - { call: "POST /photos/${pA}/accept", as: OpsDispatcher }
