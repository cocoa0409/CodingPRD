# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN — §1.8 Test Targeting Index
# Task: task_3005_small_format_rural_store_rollout_real_estate
# Nine Difficulty Rules (§0.5) × 2 instances each = 18 instances.
# All numeric asserts are literal values computed from the §1.3 formulas.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: trade_area_score_adjusted_by_nearby_overlap
        grounds:
          - calculations.trade_area_score
          - entities.TradeArea.fields.trade_area_score
        distinguishing_aspect: |
          Same market data, two variants of trade_area_score: with one
          same-program EXISTING store whose trade area is 10 drive-minutes away
          with grocery_gap_pct 24, the cannibalization_adjusted variant yields
          44.65 (overlap_pct 12.0) while the standard variant would yield
          47.50 — different results for identical screening inputs.
        test_recipe:
          setup:
            - "ACTIVE program P with default cannibalization_coefficient 0.40"
            - "EXISTING store X in trade area T0 (drive_time 10, gap 24)"
            - "Screened trade area A (drive_time 15, households 2000, income 4500000, gap 20) with no open/existing store overlap at first screen"
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "T0", drive_time_minutes: 10, household_count: 1000, median_household_income_cents: 4000000, grocery_gap_pct: 24 }
              as: PROGRAM_ADMIN
              captures: { t0: $.data.id }
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${t0}", name: "Legacy X", is_existing: true, format_type: "TRADITIONAL", open_year_sales_cents: 50000000 }
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "A", drive_time_minutes: 15, household_count: 2000, median_household_income_cents: 4500000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
              captures: { taid: $.data.id, ta_v0: $.data.version }
          trigger:
            - call: "POST /rollouts/trade-areas/${taid}/screen"
              payload: { rollout_program_id: "${rid}", expected_trade_area_version: "${ta_v0}" }
              as: PROGRAM_ADMIN
          assert:
            - "TradeArea.${taid}.status == QUALIFIED"
            - "TradeArea.${taid}.trade_area_score == 44.65"
            - "standard-variant raw score 47.50 differs from the stored adjusted score 44.65 (divergence observable: 47.50 != 44.65)"
            - "TradeArea.${taid}.screening_count == 1"

      - name: stem_cost_low_volume_uplift
        grounds:
          - calculations.stem_cost
          - entities.DCAssignment.fields.stem_cost_cents_per_week
        distinguishing_aspect: |
          Entity domain differs from the trade-area instance: this variant is
          freight costing on a Store. Same assignment (stem 120 mi, 2
          deliveries/week): weekly case volume 810 (volume_index 0.9) triggers
          the low_volume variant (1710.00 dollars/week) while the standard
          variant would be 1368.00 — identical assignment inputs, different
          dollars.
        test_recipe:
          setup:
            - "ACTIVE program; QUALIFIED trade area C (drive 20, hh 1000, income 4500000, gap 20); store S created, volume_index set to 0.9, format selected (TRADITIONAL, weekly_case_volume_base 900)"
            - "DistributionCenter D (capacity 2)"
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "C", drive_time_minutes: 20, household_count: 1000, median_household_income_cents: 4500000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
              captures: { taid: $.data.id, ta_v0: $.data.version }
            - call: "POST /rollouts/trade-areas/${taid}/screen"
              payload: { rollout_program_id: "${rid}", expected_trade_area_version: "${ta_v0}" }
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${taid}", name: "S" }
              as: PROGRAM_ADMIN
              captures: { sid: $.data.id }
            - call: "PATCH /rollouts/stores/${sid}"
              payload: { rollout_program_id: "${rid}", rollout_program_id: "${rid}", volume_index: 0.9 }
              as: NETWORK_PLANNER
              captures: { s_v1: $.data.version }
            - call: "POST /rollouts/stores/${sid}/select-format"
              payload: { rollout_program_id: "${rid}", expected_store_version: "${s_v1}" }
              as: REAL_ESTATE_MANAGER
            - call: "POST /rollouts/distribution-centers"
              payload: { rollout_program_id: "${rid}", name: "D", store_capacity: 2 }
              as: NETWORK_PLANNER
              captures: { dcid: $.data.id }
          trigger:
            - call: "POST /rollouts/dc-assignments"
              payload: { store_id: "${sid}", rollout_program_id: "${rid}", distribution_center_id: "${dcid}", stem_miles: 120, deliveries_per_week: 2 }
              as: NETWORK_PLANNER
              captures: { asg: $.data.id }
          assert:
            - "DCAssignment.${asg}.stem_cost_cents_per_week == 171000"
            - "standard-variant cost would be 136800 (136800 != 171000 — variant divergence)"
            - "Store.${sid}.stem_miles == 120"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: route_planning_nested_ceil_fill_surcharge
        grounds:
          - calculations.route_planning
          - entities.RoutePlan.fields.truck_fill_pct
        distinguishing_aspect: |
          Mode (a): route_planning has >= 3 inputs (weekly_case_volume_base,
          volume_index, stem_miles) with non-linear interaction — nested
          ceil()/max(), a conditional surcharge branch on truck_fill_pct < 55,
          and per-delivery cost tiering. TRADITIONAL base 900 at volume_index
          2.1 with stem 90 yields deliveries_per_week 2, cases_per_truck 945,
          truck_fill_pct 52.50, and the 15000-cent surcharge fires (52.5 < 55).
        test_recipe:
          setup:
            - "ACTIVE program; QUALIFIED trade area C (drive 20, hh 1000, income 4500000, gap 20); store S with volume_index 2.1, format TRADITIONAL; ACTIVE DCAssignment (stem 90, 1 delivery/wk)"
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "C", drive_time_minutes: 20, household_count: 1000, median_household_income_cents: 4500000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
              captures: { taid: $.data.id, ta_v0: $.data.version }
            - call: "POST /rollouts/trade-areas/${taid}/screen"
              payload: { rollout_program_id: "${rid}", expected_trade_area_version: "${ta_v0}" }
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${taid}", name: "S" }
              as: PROGRAM_ADMIN
              captures: { sid: $.data.id }
            - call: "PATCH /rollouts/stores/${sid}"
              payload: { rollout_program_id: "${rid}", rollout_program_id: "${rid}", volume_index: 2.1 }
              as: NETWORK_PLANNER
              captures: { s_v1: $.data.version }
            - call: "POST /rollouts/stores/${sid}/select-format"
              payload: { rollout_program_id: "${rid}", expected_store_version: "${s_v1}" }
              as: REAL_ESTATE_MANAGER
            - call: "POST /rollouts/distribution-centers"
              payload: { rollout_program_id: "${rid}", name: "D", store_capacity: 2 }
              as: NETWORK_PLANNER
              captures: { dcid: $.data.id }
            - call: "POST /rollouts/dc-assignments"
              payload: { store_id: "${sid}", rollout_program_id: "${rid}", distribution_center_id: "${dcid}", stem_miles: 90, deliveries_per_week: 1 }
              as: NETWORK_PLANNER
          trigger:
            - call: "POST /rollouts/route-plans"
              payload: { rollout_program_id: "${rid}", store_id: "${sid}" }
              as: NETWORK_PLANNER
              captures: { rpid: $.data.id }
          assert:
            - "RoutePlan.${rpid}.deliveries_per_week == 2"
            - "RoutePlan.${rpid}.cases_per_truck == 945"
            - "RoutePlan.${rpid}.truck_fill_pct == 52.5"
            - "RoutePlan.${rpid}.weekly_cost_cents == 202600"

      - name: cannibalization_per_line_rounding_order
        grounds:
          - calculations.cannibalization_transfer
          - entities.CannibalizationStudy.fields.transfer_pct
        distinguishing_aspect: |
          Mode (b): nested rounding order — the scaffold pins round-per-entry
          THEN sum. With sales 150,000,000 and 90,000,001 cents at weights
          0.15/0.15 and coefficient 0.40, per-entry rounding gives
          9,000,000 + 5,400,000 = 14,400,000; sum-then-round would give
          14,400,001 — the pinned order produces exactly 9.89% transfer.
        test_recipe:
          setup:
            - "ACTIVE program; two EXISTING stores X (sales 150000000) and Y (sales 90000001) in trade area T0"
            - "QUALIFIED trade area F (hh 2000, gap 30); store S format-selected to DG_FRESH with projected_revenue_cents 145600000"
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "T0", drive_time_minutes: 12, household_count: 1000, median_household_income_cents: 4000000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
              captures: { t0: $.data.id }
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${t0}", name: "X", is_existing: true, format_type: "TRADITIONAL", open_year_sales_cents: 150000000 }
              as: PROGRAM_ADMIN
              captures: { ex: $.data.id }
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${t0}", name: "Y", is_existing: true, format_type: "TRADITIONAL", open_year_sales_cents: 90000001 }
              as: PROGRAM_ADMIN
              captures: { ey: $.data.id }
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "F", drive_time_minutes: 18, household_count: 2000, median_household_income_cents: 4500000, grocery_gap_pct: 30 }
              as: PROGRAM_ADMIN
              captures: { taf: $.data.id, taf_v0: $.data.version }
            - call: "POST /rollouts/trade-areas/${taf}/screen"
              payload: { rollout_program_id: "${rid}", expected_trade_area_version: "${taf_v0}" }
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${taf}", name: "S" }
              as: PROGRAM_ADMIN
              captures: { sid: $.data.id, s_v0: $.data.version }
            - call: "POST /rollouts/stores/${sid}/select-format"
              payload: { rollout_program_id: "${rid}", expected_store_version: "${s_v0}" }
              as: REAL_ESTATE_MANAGER
          trigger:
            - call: "POST /rollouts/cannibalization-studies"
              payload: { rollout_program_id: "${rid}", store_id: "${sid}", overlap_entries: [ { existing_store_id: "${ex}", overlap_weight: 0.15 }, { existing_store_id: "${ey}", overlap_weight: 0.15 } ] }
              as: FINANCE_ANALYST
              captures: { csid: $.data.id }
          assert:
            - "CannibalizationStudy.${csid}.transfer_pct == 9.89"
            - "per-entry transferred amounts are 9000000 and 5400000 cents (sum 14400000; sum-then-round would yield 14400001 and transfer_pct 9.90)"
            - "CannibalizationStudy.${csid}.recommendation == MITIGATE"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: opening_plan_lock_unlock_relock_cycle
        grounds:
          - state_machines.OpeningPlan.LOCKED_to_PLANNED
          - state_machines.OpeningPlan.PLANNED_to_LOCKED
        distinguishing_aspect: |
          Cyclic machine on OpeningPlan: PLANNED -> LOCKED -> PLANNED -> LOCKED
          loop is legal while the store is SITE_CONTROL; each transition is
          independently gated (fixture lead time re-checked at every lock).
        test_recipe:
          setup:
            - "ACTIVE program; store S: trade area C qualified, format TRADITIONAL selected; agreement AG (delivery 2026-11-01) EXECUTED -> store SITE_CONTROL; opening plan OP (opening 2026-12-05, off-peak) created (PLANNED)"
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "C", drive_time_minutes: 20, household_count: 1000, median_household_income_cents: 4500000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
              captures: { taid: $.data.id, ta_v0: $.data.version }
            - call: "POST /rollouts/trade-areas/${taid}/screen"
              payload: { rollout_program_id: "${rid}", expected_trade_area_version: "${ta_v0}" }
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${taid}", name: "S" }
              as: PROGRAM_ADMIN
              captures: { sid: $.data.id, s_v0: $.data.version }
            - call: "POST /rollouts/stores/${sid}/select-format"
              payload: { rollout_program_id: "${rid}", expected_store_version: "${s_v0}" }
              as: REAL_ESTATE_MANAGER
            - call: "POST /rollouts/developers"
              payload: { rollout_program_id: "${rid}", name: "DevCo" }
              as: PROGRAM_ADMIN
              captures: { dev: $.data.id }
            - call: "POST /rollouts/site-agreements"
              payload: { store_id: "${sid}", rollout_program_id: "${rid}", developer_id: "${dev}", committed_delivery_date: "2026-11-01T00:00:00Z", base_price_cents: 24000000, earnest_money_cents: 2400000 }
              as: REAL_ESTATE_MANAGER
              captures: { agid: $.data.id }
            - call: "POST /rollouts/site-agreements/${agid}/execute"
              payload: { rollout_program_id: "${rid}" }
              as: REAL_ESTATE_MANAGER
            - call: "POST /rollouts/opening-plans"
              payload: { store_id: "${sid}", rollout_program_id: "${rid}", opening_date: "2026-12-05T00:00:00Z", peak_season: false }
              as: OPERATIONS_LEAD
              captures: { opid: $.data.id }
          trigger:
            - call: "POST /rollouts/opening-plans/${opid}/lock"
              payload: { rollout_program_id: "${rid}" }
              as: OPERATIONS_LEAD
            - call: "POST /rollouts/opening-plans/${opid}/unlock"
              payload: { rollout_program_id: "${rid}" }
              as: OPERATIONS_LEAD
            - call: "POST /rollouts/opening-plans/${opid}/lock"
              payload: { rollout_program_id: "${rid}" }
              as: OPERATIONS_LEAD
          assert:
            - "OpeningPlan.${opid}.status == LOCKED after the full lock-unlock-lock cycle"
            - "Store.${sid}.status == SITE_CONTROL throughout the cycle"
            - "OpeningPlan.${opid}.labor_hours == 220 (cycle does not recompute labor)"

      - name: trade_area_reject_rescreen_qualify_cycle
        grounds:
          - state_machines.TradeArea.REJECTED_to_QUALIFIED
          - state_machines.TradeArea.SCREENING_to_REJECTED
        distinguishing_aspect: |
          Different entity than the OpeningPlan cycle: TradeArea loops
          SCREENING -> REJECTED -> QUALIFIED via market-data refresh + rescreen,
          with screening_count accumulating across loop iterations.
        test_recipe:
          setup:
            - "ACTIVE program; trade area A initially failing (hh 800 < ... gap 15 >= 12 passes but score 34.68 < 40) then refreshed to passing data"
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "A", drive_time_minutes: 25, household_count: 800, median_household_income_cents: 4500000, grocery_gap_pct: 15 }
              as: PROGRAM_ADMIN
              captures: { taid: $.data.id, ta_v0: $.data.version }
          trigger:
            - call: "POST /rollouts/trade-areas/${taid}/screen"
              payload: { rollout_program_id: "${rid}", expected_trade_area_version: "${ta_v0}" }
              as: PROGRAM_ADMIN
              captures: { ta_v1: $.data.version }
            - call: "PATCH /rollouts/trade-area-updates"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${taid}", household_count: 2000, grocery_gap_pct: 20, drive_time_minutes: 15 }
              as: PROGRAM_ADMIN
              captures: { ta_v2: $.data.version }
            - call: "POST /rollouts/trade-areas/${taid}/screen"
              payload: { rollout_program_id: "${rid}", expected_trade_area_version: "${ta_v2}" }
              as: PROGRAM_ADMIN
          assert:
            - "first screen: status REJECTED with trade_area_score 34.68"
            - "second screen: TradeArea.${taid}.status == QUALIFIED"
            - "TradeArea.${taid}.trade_area_score == 47.5"
            - "TradeArea.${taid}.screening_count == 2"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: late_delivery_cascade_cancels_opening_plan
        grounds:
          - state_machines.SiteControlAgreement.ACTIVE_to_DELIVERED
          - state_machines.Store.UNDER_CONSTRUCTION_to_DELIVERED
          - state_machines.OpeningPlan
        distinguishing_aspect: |
          Depth-3 chain from the deliveries trigger: record delivery (late 40
          days) -> agreement DELIVERED + store DELIVERED -> because
          late_days >= 30 the store's LOCKED OpeningPlan is CANCELLED ->
          program penalty ledger gains the capped accrual (41250000 for 75
          days in the second scenario; here 40 days -> 20000000).
        test_recipe:
          setup:
            - "ACTIVE program; store S UNDER_CONSTRUCTION (agreement AG ACTIVE, delivery committed 2026-11-01); opening plan OP LOCKED (opening 2026-12-05)"
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "C", drive_time_minutes: 20, household_count: 1000, median_household_income_cents: 4500000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
              captures: { taid: $.data.id, ta_v0: $.data.version }
            - call: "POST /rollouts/trade-areas/${taid}/screen"
              payload: { rollout_program_id: "${rid}", expected_trade_area_version: "${ta_v0}" }
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${taid}", name: "S" }
              as: PROGRAM_ADMIN
              captures: { sid: $.data.id, s_v0: $.data.version }
            - call: "POST /rollouts/stores/${sid}/select-format"
              payload: { rollout_program_id: "${rid}", expected_store_version: "${s_v0}" }
              as: REAL_ESTATE_MANAGER
            - call: "POST /rollouts/developers"
              payload: { rollout_program_id: "${rid}", name: "DevCo" }
              as: PROGRAM_ADMIN
              captures: { dev: $.data.id }
            - call: "POST /rollouts/site-agreements"
              payload: { store_id: "${sid}", rollout_program_id: "${rid}", developer_id: "${dev}", committed_delivery_date: "2026-11-01T00:00:00Z", base_price_cents: 24000000, earnest_money_cents: 2400000 }
              as: REAL_ESTATE_MANAGER
              captures: { agid: $.data.id }
            - call: "POST /rollouts/site-agreements/${agid}/execute"
              payload: { rollout_program_id: "${rid}" }
              as: REAL_ESTATE_MANAGER
            - call: "POST /rollouts/site-agreements/${agid}/activate"
              payload: { rollout_program_id: "${rid}" }
              as: REAL_ESTATE_MANAGER
            - call: "POST /rollouts/opening-plans"
              payload: { store_id: "${sid}", rollout_program_id: "${rid}", opening_date: "2026-12-05T00:00:00Z", peak_season: false }
              as: OPERATIONS_LEAD
              captures: { opid: $.data.id }
            - call: "POST /rollouts/opening-plans/${opid}/lock"
              payload: { rollout_program_id: "${rid}" }
              as: OPERATIONS_LEAD
          trigger:
            - call: "POST /rollouts/site-agreements/${agid}/deliveries"
              payload: { rollout_program_id: "${rid}", actual_delivery_date: "2026-12-11T00:00:00Z" }
              as: REAL_ESTATE_MANAGER
              captures: { ag2: $.data.id }
          assert:
            - "SiteControlAgreement.${agid}.status == DELIVERED"
            - "SiteControlAgreement.${agid}.late_days == 40"
            - "SiteControlAgreement.${agid}.penalty_cents == 20000000"
            - "Store.${sid}.status == DELIVERED"
            - "OpeningPlan.${opid}.status == CANCELLED (cascade: late_days 40 >= 30)"
            - "Developer.active_agreement_count == 0"

      - name: store_kill_releases_assignment_routes_and_capital
        grounds:
          - state_machines.Store.UNDER_CONSTRUCTION_to_KILLED
          - state_machines.DCAssignment.ACTIVE_to_SUPERSEDED
          - calculations.capital_commitment_reconciliation
        distinguishing_aspect: |
          Depth-2+ chain from a different trigger (kill, not delivery): kill an
          UNDER_CONSTRUCTION store -> ACTIVE DCAssignment SUPERSEDED (DC
          assigned_store_count decremented) + ACTIVE RoutePlan SUPERSEDED ->
          program committed capital released by exactly build_cost_cents.
        test_recipe:
          setup:
            - "ACTIVE program; store S UNDER_CONSTRUCTION (TRADITIONAL, build 350000000 committed); ACTIVE DCAssignment on DC D (assigned_store_count 1); ACTIVE RoutePlan"
            - "agreement AG terminated first (kill precondition: no open agreement)"
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 1000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "C", drive_time_minutes: 20, household_count: 1000, median_household_income_cents: 4500000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
              captures: { taid: $.data.id, ta_v0: $.data.version }
            - call: "POST /rollouts/trade-areas/${taid}/screen"
              payload: { rollout_program_id: "${rid}", expected_trade_area_version: "${ta_v0}" }
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${taid}", name: "S" }
              as: PROGRAM_ADMIN
              captures: { sid: $.data.id, s_v0: $.data.version }
            - call: "POST /rollouts/stores/${sid}/select-format"
