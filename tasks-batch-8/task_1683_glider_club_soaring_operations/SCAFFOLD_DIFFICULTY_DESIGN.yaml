              as: Member
              as_user_id: "${db_id}"
            - call: "POST /soaring/duty-roster/${s1_id}/propose-swap"
              payload: { swap_with_slot_id: "${s2_id}" }
              as: Member
              as_user_id: "${da_id}"
            - call: "POST /soaring/duty-roster/${s1_id}/accept-swap"
              payload: {}
              as: Member
              as_user_id: "${db_id}"
            - call: "POST /soaring/duty-roster/${s1_id}/confirm"
