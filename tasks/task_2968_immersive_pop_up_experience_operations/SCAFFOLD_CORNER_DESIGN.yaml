        claim_type: ledger_sync
        grounds:
          - entities.ExperienceRun.fields.royalty_statement_count
          - endpoints[POST /royalty-statements]
          - state_machines[RoyaltyStatement].transitions[DRAFT -> SUPERSEDED]
        distinguishing_aspect: |
          run.royalty_statement_count is a denormalised counter that must equal the number of
          RoyaltyStatement rows on the run, and the supersede path is where the two drift: the
          superseding create makes a NEW row while retiring an old one, so the counter must go up by
          one, not stay level (the old row still exists as SUPERSEDED) and not jump by two. The
          same call must also pass the OCC check on the run, so the counter and the version move
          together on exactly the accepted creates.
