            - "DrugLot.${lot_ref_id}.vials_reserved == 2 and DrugLot.${lot_ref_id}.vials_on_hand == 3"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: plan_resume_gated_on_the_adverse_event_state_of_another_aggregate
        grounds:
          - state_machines.TreatmentPlan.SUSPENDED_to_MAINTENANCE
          - state_machines.AdverseEvent.REPORTED_to_UNDER_INVESTIGATION
          - state_machines.AdverseEvent.UNDER_INVESTIGATION_to_ADJUDICATED_UNRELATED
          - validations.priority_44
        distinguishing_aspect: |
          The TreatmentPlan transition is legal on the plan's own state (SUSPENDED) and
          on its own fields, yet it is refused twice because a row in a different
          aggregate — an AdverseEvent hanging off one of the plan's encounters — sits in
          REPORTED and then in UNDER_INVESTIGATION. Nothing about the plan changes
          between the second refusal and the success; only the AdverseEvent moves.
        test_recipe:
          setup:
            - "the reference-data prologue with ENC1 documented on 2026-08-01T09:00:00Z by CL1"
            - "an ENDOPHTHALMITIS AdverseEvent on ENC1 (onset 2026-08-01T18:00:00Z, MODERATE, culture PENDING) sits in REPORTED"
            - "PLAN1 is then suspended by hand with suspension_reason PATIENT_REQUEST"
            - "logical clock stays at 2026-08-01T00:00:00Z throughout"
          setup_api_calls:
            - *c_clk
            - *c_pay_comm
            - *c_pay_np
            - *c_pay_mcr
            - *c_drug_ref
            - *c_drug_bio
            - *c_drug_cmp
            - *c_pol_comm_ref
            - *c_pol_np_ref
            - *c_pol_mcr_ref
            - *c_pol_mcr_bio
            - *c_pt1
            - *c_pt2
            - *c_pt3
            - *c_pt4
            - *c_cl1
            - *c_cl2
            - *c_cl3
            - *c_lot_ref
            - *c_img1
            - *c_plan1
            - *c_plan1_act
            - *c_pa1
            - *c_pa1_sub
            - *c_pa1_dec
            - *c_plan1_get
            - *c_enc1
            - *c_enc1_doc
            - call: "POST /adverse-events"
              payload: { injection_encounter_id: "${enc1_id}", event_type: "ENDOPHTHALMITIS", onset_datetime: "2026-08-01T18:00:00Z", severity: "MODERATE", culture_result: "PENDING" }
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { ae2_id: $.data.id, ae2_reportable: $.data.reportable }
            - call: "POST /treatment-plans/${plan1_id}/suspend"
              payload: { suspension_reason: "PATIENT_REQUEST" }
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
          trigger:
            - call: "POST /treatment-plans/${plan1_id}/resume"
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { resume_err_reported: $.data.error_id }
            - call: "POST /adverse-events/${ae2_id}/start-investigation"
              as: ComplianceOfficer
            - call: "POST /treatment-plans/${plan1_id}/resume"
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { resume_err_investigating: $.data.error_id }
            - call: "POST /adverse-events/${ae2_id}/adjudicate"
              payload: { outcome: "UNRELATED", adjudication_note: "Sterile inflammation resolved on topical steroid; not attributable to the injection" }
              as: RetinaSpecialist
              as_user_id: "${cl2_id}"
            - call: "POST /treatment-plans/${plan1_id}/resume"
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { plan1_status_after_resume: $.data.status, plan1_next_due: $.data.next_due_date }
          assert:
            - "${ae2_reportable} == true and AdverseEvent.${ae2_id}.days_post_injection == 0"
            - "AdverseEvent.${ae2_id}.fda_report_due_date == \"2026-08-31T18:00:00Z\""
            - "${resume_err_reported} == \"ERR_OPEN_ADVERSE_EVENT\" with HTTP 409"
            - "${resume_err_investigating} == \"ERR_OPEN_ADVERSE_EVENT\" with HTTP 409"
            - "AdverseEvent.${ae2_id}.status == ADJUDICATED_UNRELATED and adjudicated_by_clinician_id == ${cl2_id}"
            - "${plan1_status_after_resume} == MAINTENANCE (a resumed plan always re-enters MAINTENANCE, never LOADING)"
            - "TreatmentPlan.${plan1_id}.suspension_reason == null"
            - "${plan1_next_due} == \"2026-08-29T00:00:00Z\" (clock 2026-08-01 + current_interval_days 28)"
            - "TreatmentPlan.${plan1_id}.injections_administered == 1 (the UNRELATED branch fired no cascade)"
            - "DrugLot.${lot_ref_id}.vials_administered == 1 and DrugLot.${lot_ref_id}.vials_on_hand == 4"

      - name: vial_eligibility_keyed_on_parent_lot_expiry_while_the_vial_stays_in_stock
        grounds:
          - calculations.vial_selection
          - state_machines.Vial.IN_STOCK_to_RESERVED
          - state_machines.DrugLot.AVAILABLE_to_EXPIRED
          - validations.priority_26
        distinguishing_aspect: |
          Every candidate vial is still IN_STOCK and its DrugLot is still AVAILABLE, so
          nothing in either row's own status disqualifies it — the pool is empty purely
          because the parent lot's expiration_date is no longer strictly after the
          logical clock. The exclusion is observable BEFORE the expiration sweep has run
          and flipped any status, which is what separates the cross-entity temporal gate
          from the sweep's own state change.
        test_recipe:
          setup:
            - "the reference-data prologue's payers, drugs, policies, patients and clinicians (lot RX-2201 is deliberately NOT created)"
            - "one AVAILABLE lot RX-2205 of Drug REF, 5 vials, unit_acquisition_cost_cents 132000, received 2026-07-01, expiring 2026-08-15T00:00:00Z"
            - "patient P3 on the no-PA payer with an ACTIVE plan on Drug REF"
            - "an encounter on 2026-08-01T09:00:00Z proves the lot is eligible, then it is voided so all 5 vials are IN_STOCK again"
            - "logical clock advanced to exactly 2026-08-15T00:00:00Z — the lot's expiration_date — with a fresh ACTIVE study for P3"
          setup_api_calls:
            - *c_clk
            - *c_pay_comm
            - *c_pay_np
            - *c_pay_mcr
            - *c_drug_ref
            - *c_drug_bio
            - *c_drug_cmp
            - *c_pol_comm_ref
            - *c_pol_np_ref
            - *c_pol_mcr_ref
            - *c_pol_mcr_bio
            - *c_pt1
            - *c_pt2
            - *c_pt3
            - *c_pt4
            - *c_cl1
            - *c_cl2
            - *c_cl3
            - call: "POST /drug-lots"
              payload: { drug_id: "${drug_ref_id}", lot_number: "RX-2205", expiration_date: "2026-08-15T00:00:00Z", received_date: "2026-07-01T00:00:00Z", unit_acquisition_cost_cents: 132000, vials_received: 5 }
              as: PharmacyTech
              captures: { lot_exp_id: $.data.id }
            - *c_img_p3_0801
            - *c_plan_p3
            - *c_plan_p3_act
            - call: "POST /injection-encounters"
              payload: { treatment_plan_id: "${plan_p3_id}", imaging_study_id: "${img_p3b_id}", encounter_datetime: "2026-08-01T09:00:00Z", expected_treatment_plan_version: "${plan_p3_v}" }
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { enc_pre_id: $.data.id, enc_pre_vial: $.data.vial_id }
            - call: "POST /injection-encounters/${enc_pre_id}/void"
              payload: { void_reason: "Patient rescheduled before the injection" }
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /imaging-studies"
              payload: { patient_id: "${pt3_id}", eye: "OD", study_datetime: "2026-08-15T00:00:00Z", central_subfield_thickness_um: 396, intraretinal_fluid: true, subretinal_fluid: false, new_hemorrhage: false, va_letter_score: 62 }
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { img_p3c_id: $.data.id }
            - call: "GET /treatment-plans/${plan_p3_id}"
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { plan_p3_v2: $.data.version }
          trigger:
            - call: "GET /vials"
              payload: { drug_lot_id: "${lot_exp_id}", status: "IN_STOCK" }
              as: PharmacyTech
              captures: { pre_sweep_vial_status: "$.data[0].status" }
            - call: "POST /injection-encounters"
              payload: { treatment_plan_id: "${plan_p3_id}", imaging_study_id: "${img_p3c_id}", encounter_datetime: "2026-08-15T09:00:00Z", expected_treatment_plan_version: "${plan_p3_v2}" }
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { expiry_pool_error: $.data.error_id }
            - call: "GET /drug-lots/${lot_exp_id}/exposure"
              payload: { basis: "CARRYING" }
              as: PharmacyTech
              captures: { exp_days_held: $.data.days_held, exp_carry_cents: $.data.exposure_cents }
            - call: "POST /inventory/expiration-sweep"
              as: PharmacyTech
              captures: { sweep_lots_expired: $.data.lots_expired, sweep_vials_expired: $.data.vials_expired }
          assert:
            - "${pre_sweep_vial_status} == IN_STOCK (the vials' own status never disqualified them)"
            - "DrugLot.${lot_exp_id}.status == AVAILABLE at the moment of the rejection"
            - "${expiry_pool_error} == \"ERR_NO_ELIGIBLE_VIAL\" with HTTP 409"
            - "Vial.${enc_pre_vial}.status == IN_STOCK and reserved_for_encounter_id == null"
            - "${exp_days_held} == 45"
            - "${exp_carry_cents} == 16274"
            - "${sweep_lots_expired} == 1 and ${sweep_vials_expired} == 5"
            - "DrugLot.${lot_exp_id}.status == EXPIRED, vials_expired == 5, vials_on_hand == 0 after the sweep"
            - "DrugLot.${lot_exp_id}.last_swept_at == \"2026-08-15T00:00:00Z\""
            - "InjectionEncounter.${enc_pre_id}.status == VOIDED"

  - rule_id: resource_temporal_overlap
    instances:

      - name: authorization_windows_with_touching_endpoints_count_as_an_overlap
        grounds:
          - validations.priority_33
          - entities.PriorAuthorization.fields.effective_date
          - entities.PriorAuthorization.fields.expiration_date
          - entities.PayerDrugPolicy.fields.pa_validity_days
        distinguishing_aspect: |
          The two authorization windows on one plan are compared as CLOSED intervals, so
          a new window whose effective_date equals the incumbent's last covered day
          (2027-01-28) is an overlap, while starting one day later (2027-01-29) is not.
          A half-open reading of the same 180-day validity accepts the first date.
        test_recipe:
          setup:
            - "the reference-data prologue through PLAN1's first APPROVED authorization, effective 2026-08-01, validity 180 days, so its window closes 2027-01-28"
            - "a second DRAFT authorization PA2 is created on the same plan and submitted"
            - "logical clock stays at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - *c_clk
            - *c_pay_comm
            - *c_pay_np
            - *c_pay_mcr
            - *c_drug_ref
            - *c_drug_bio
            - *c_drug_cmp
            - *c_pol_comm_ref
            - *c_pol_np_ref
            - *c_pol_mcr_ref
            - *c_pol_mcr_bio
            - *c_pt1
            - *c_pt2
            - *c_pt3
            - *c_pt4
            - *c_cl1
            - *c_cl2
            - *c_cl3
            - *c_lot_ref
            - *c_img1
            - *c_plan1
            - *c_plan1_act
            - *c_pa1
            - *c_pa1_sub
            - *c_pa1_dec
            - *c_plan1_get
            - call: "POST /prior-authorizations"
              payload: { treatment_plan_id: "${plan1_id}", expected_treatment_plan_version: "${plan1_v_pa}" }
              as: BillingSpecialist
              captures: { pa2_id: $.data.id }
            - call: "POST /prior-authorizations/${pa2_id}/submit"
              payload: { clinical_justification: "Renewal for the maintenance course beginning early 2027" }
              as: BillingSpecialist
          trigger:
            - call: "POST /prior-authorizations/${pa2_id}/decision"
              payload: { decision: "APPROVED", auth_number: "AUTH-1001", approved_injections: 3, effective_date: "2027-01-28T00:00:00Z" }
              as: BillingSpecialist
              captures: { overlap_error: $.data.error_id }
            - call: "POST /prior-authorizations/${pa2_id}/decision"
              payload: { decision: "APPROVED", auth_number: "AUTH-1002", approved_injections: 3, effective_date: "2027-01-29T00:00:00Z" }
              as: BillingSpecialist
              captures: { pa2_expiry: $.data.expiration_date }
          assert:
            - "PriorAuthorization.${pa1_id}.expiration_date == \"2027-01-28T00:00:00Z\""
            - "${overlap_error} == \"ERR_AUTHORIZATION_WINDOW_OVERLAP\" with HTTP 409"
            - "PriorAuthorization.${pa2_id}.status == APPROVED after the second decision"
            - "PriorAuthorization.${pa2_id}.effective_date == \"2027-01-29T00:00:00Z\""
            - "${pa2_expiry} == \"2027-07-28T00:00:00Z\""
            - "PriorAuthorization.${pa2_id}.auth_number == \"AUTH-1002\""
            - "PriorAuthorization.${pa2_id}.injections_used == 0"
            - "PriorAuthorization.${pa1_id}.status == APPROVED (the incumbent is untouched)"

      - name: one_vial_cannot_back_two_overlapping_draft_reservations
        grounds:
          - calculations.vial_selection
          - state_machines.Vial.IN_STOCK_to_RESERVED
          - state_machines.Vial.RESERVED_to_IN_STOCK
          - validations.priority_26
        distinguishing_aspect: |
          A vial is an exclusive resource for the whole lifetime of a DRAFT encounter,
          not just at the instant of documentation: while encounter A holds the only
          compounded-drug vial, encounter B on a different patient's plan cannot be
          created at all. Voiding A returns the identical vial to stock and B then
          receives that same vial_id, so the reservation is a true interval hold rather
          than a counter.
        test_recipe:
          setup:
            - "the reference-data prologue's payers, drugs, patients and clinicians"
            - "a PREFERRED no-PA policy for the compounded Drug CMP on the open-access payer"
            - "one AVAILABLE lot CMP-3301 of Drug CMP with vials_received 1, unit_acquisition_cost_cents 24000, expiring 2027-03-31"
            - "patients P3 and P4 each hold an ACTIVE plan on Drug CMP with a fresh ACTIVE study"
            - "encounter A for P3 at 2026-08-01T09:00:00Z holds the single vial in RESERVED"
          setup_api_calls:
            - *c_clk
            - *c_pay_comm
            - *c_pay_np
            - *c_pay_mcr
            - *c_drug_ref
            - *c_drug_bio
            - *c_drug_cmp
            - *c_pol_comm_ref
            - *c_pol_np_ref
            - *c_pol_mcr_ref
            - *c_pol_mcr_bio
            - *c_pt1
            - *c_pt2
            - *c_pt3
            - *c_pt4
            - *c_cl1
            - *c_cl2
            - *c_cl3
            - call: "POST /payer-drug-policies"
              payload: { payer_id: "${payer_np_id}", drug_id: "${drug_cmp_id}", coverage_tier: "PREFERRED", drug_allowed_cents_per_billing_unit: 1400, admin_allowed_cents: 10000, wastage_reimbursed: false, pa_required: false, pa_validity_days: 180, pa_max_injections: 3, required_prior_failures: 0 }
              as: PracticeAdmin
              captures: { pol_np_cmp_id: $.data.id }
            - call: "POST /drug-lots"
              payload: { drug_id: "${drug_cmp_id}", lot_number: "CMP-3301", expiration_date: "2027-03-31T00:00:00Z", received_date: "2026-07-20T00:00:00Z", unit_acquisition_cost_cents: 24000, vials_received: 1 }
              as: PharmacyTech
              captures: { lot_cmp_id: $.data.id }
            - call: "POST /imaging-studies"
              payload: { patient_id: "${pt3_id}", eye: "OS", study_datetime: "2026-08-01T00:00:00Z", central_subfield_thickness_um: 380, intraretinal_fluid: true, subretinal_fluid: false, new_hemorrhage: false, va_letter_score: 64 }
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { img_a_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt3_id}", drug_id: "${drug_cmp_id}", eye: "OS", loading_doses_required: 3 }
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { plan_a_id: $.data.id }
            - call: "POST /treatment-plans/${plan_a_id}/activate"
              payload: { baseline_imaging_study_id: "${img_a_id}" }
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { plan_a_v: $.data.version }
            - call: "POST /imaging-studies"
              payload: { patient_id: "${pt4_id}", eye: "OS", study_datetime: "2026-08-01T00:00:00Z", central_subfield_thickness_um: 372, intraretinal_fluid: true, subretinal_fluid: false, new_hemorrhage: false, va_letter_score: 66 }
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { img_b_id: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt4_id}", drug_id: "${drug_cmp_id}", eye: "OS", loading_doses_required: 3 }
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { plan_b_id: $.data.id }
            - call: "POST /treatment-plans/${plan_b_id}/activate"
              payload: { baseline_imaging_study_id: "${img_b_id}" }
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { plan_b_v: $.data.version }
            - call: "POST /injection-encounters"
              payload: { treatment_plan_id: "${plan_a_id}", imaging_study_id: "${img_a_id}", encounter_datetime: "2026-08-01T09:00:00Z", expected_treatment_plan_version: "${plan_a_v}" }
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { enc_a_id: $.data.id, enc_a_vial: $.data.vial_id }
          trigger:
            - call: "POST /injection-encounters"
              payload: { treatment_plan_id: "${plan_b_id}", imaging_study_id: "${img_b_id}", encounter_datetime: "2026-08-01T10:00:00Z", expected_treatment_plan_version: "${plan_b_v}" }
              as: RetinaSpecialist
              as_user_id: "${cl2_id}"
              captures: { hold_conflict_error: $.data.error_id }
            - call: "POST /injection-encounters/${enc_a_id}/void"
              payload: { void_reason: "Patient deferred treatment at the chair" }
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
            - call: "POST /injection-encounters"
              payload: { treatment_plan_id: "${plan_b_id}", imaging_study_id: "${img_b_id}", encounter_datetime: "2026-08-01T10:00:00Z", expected_treatment_plan_version: "${plan_b_v}" }
              as: RetinaSpecialist
              as_user_id: "${cl2_id}"
              captures: { enc_b_id: $.data.id, enc_b_vial: $.data.vial_id }
          assert:
            - "${hold_conflict_error} == \"ERR_NO_ELIGIBLE_VIAL\" with HTTP 409"
            - "DrugLot.${lot_cmp_id}.vials_reserved == 1 and vials_on_hand == 0 while encounter A held the vial"
            - "InjectionEncounter.${enc_a_id}.status == VOIDED with void_reason \"Patient deferred treatment at the chair\""
            - "${enc_b_vial} == ${enc_a_vial} (the identical physical vial is re-issued)"
            - "Vial.${enc_b_vial}.status == RESERVED and reserved_for_encounter_id == ${enc_b_id}"
            - "DrugLot.${lot_cmp_id}.vials_reserved == 1, vials_on_hand == 0, vials_received == 1 (conserved)"
            - "TreatmentPlan.${plan_a_id}.injections_administered == 0"
            - "TreatmentPlan.${plan_b_id}.version == ${plan_b_v} (encounter creation on B's plan increments it exactly once, on the successful call)"

  - rule_id: compensating_invariant
    instances:

      - name: voiding_a_documented_encounter_conserves_the_lot_vial_count_without_resurrecting_stock
        grounds:
          - state_machines.InjectionEncounter.DOCUMENTED_to_VOIDED
          - state_machines.Vial.ADMINISTERED_to_QUARANTINED
          - calculations.treat_and_extend_interval
          - entities.DrugLot.fields.vials_received
        distinguishing_aspect: |
          The undo is deliberately asymmetric: the schedule-side effects are fully
          reversed (injections_administered back to 0, last_encounter_id back to null,
          next_due_date cleared, authorization capacity returned) while the physical
          vial is NOT resurrected as sellable stock — it moves ADMINISTERED ->
          QUARANTINED so that
          vials_on_hand + vials_reserved + vials_administered + vials_quarantined +
          vials_returned + vials_expired stays exactly equal to vials_received (5) with
          no drift in either direction.
        test_recipe:
          setup:
            - "the reference-data prologue with ENC1 documented at 2026-08-01T09:00:00Z"
            - "before the void: plan injections_administered 1, current_interval_days 28, next_due_date 2026-08-29T09:00:00Z, last_encounter_id ENC1"
            - "before the void: lot RX-2201 vials_on_hand 4, vials_reserved 0, vials_administered 1, vials_quarantined 0"
            - "before the void: authorization PA1 injections_used 1 of 3"
            - "no Claim exists for ENC1, so the DOCUMENTED -> VOIDED edge is open"
          setup_api_calls:
            - *c_clk
            - *c_pay_comm
            - *c_pay_np
            - *c_pay_mcr
            - *c_drug_ref
            - *c_drug_bio
            - *c_drug_cmp
            - *c_pol_comm_ref
            - *c_pol_np_ref
            - *c_pol_mcr_ref
            - *c_pol_mcr_bio
            - *c_pt1
            - *c_pt2
            - *c_pt3
            - *c_pt4
            - *c_cl1
            - *c_cl2
            - *c_cl3
            - *c_lot_ref
            - *c_img1
            - *c_plan1
            - *c_plan1_act
            - *c_pa1
            - *c_pa1_sub
            - *c_pa1_dec
            - *c_plan1_get
            - *c_enc1
            - *c_enc1_doc
          trigger:
            - call: "POST /injection-encounters/${enc1_id}/void"
              payload: { void_reason: "Documented against the wrong eye" }
              as: RetinaSpecialist
              as_user_id: "${cl1_id}"
              captures: { void_status: $.data.status }
          assert:
            - "${void_status} == VOIDED"
            - "Vial.${enc1_vial_id}.status == QUARANTINED (NOT IN_STOCK — an injected vial never returns to stock)"
            - "Vial.${enc1_vial_id}.administered_at == \"2026-08-01T09:00:00Z\" (the historical stamp is preserved)"
            - "DrugLot.${lot_ref_id}.vials_on_hand == 4"
            - "DrugLot.${lot_ref_id}.vials_reserved == 0"
            - "DrugLot.${lot_ref_id}.vials_administered == 0"
            - "DrugLot.${lot_ref_id}.vials_quarantined == 1"
            - "DrugLot.${lot_ref_id}.vials_returned == 0 and vials_expired == 0"
            - "conservation: 4 + 0 + 0 + 1 + 0 + 0 == DrugLot.${lot_ref_id}.vials_received == 5"
            - "TreatmentPlan.${plan1_id}.injections_administered == 0"
            - "TreatmentPlan.${plan1_id}.last_encounter_id == null"
            - "TreatmentPlan.${plan1_id}.next_due_date == null"
            - "TreatmentPlan.${plan1_id}.current_interval_days == 28"
            - "TreatmentPlan.${plan1_id}.consecutive_quiescent_visits == 0"
            - "TreatmentPlan.${plan1_id}.status == LOADING"
            - "PriorAuthorization.${pa1_id}.injections_used == 0 and status == APPROVED"

      - name: recall_return_and_credit_reconciliation_close_the_vial_and_money_ledgers_with_no_drift
        grounds:
          - state_machines.LotRecall.PATIENTS_NOTIFIED_to_RETURN_SHIPPED
          - state_machines.LotRecall.RETURN_SHIPPED_to_CREDIT_RECONCILED
          - state_machines.Vial.QUARANTINED_to_RETURNED
          - validations.priority_42
          - entities.LotRecall.fields.credit_expected_cents
        distinguishing_aspect: |
          The recall is the compensating path for an acquisition that can no longer be
          injected, and it must close two ledgers at once with no drift: every vial the
          practice still physically holds ends in RETURNED (4) while the one already
          injected stays counted (1), so vials_received 5 is still conserved; and the
          expected credit is frozen at return time as 4 x 132000 = 528000, so a posted
          credit of 528001 is refused while 528000 settles the account exactly.
        test_recipe:
          setup:
            - "the reference-data prologue with ENC1 documented at 2026-08-01T09:00:00Z, leaving lot RX-2201 with 4 IN_STOCK and 1 ADMINISTERED vial"
            - "logical clock 2026-08-01T00:00:00Z; patient P1's notification_channel is EMAIL"
            - "no recall exists on the lot yet"
          setup_api_calls:
            - *c_clk
            - *c_pay_comm
            - *c_pay_np
            - *c_pay_mcr
            - *c_drug_ref
            - *c_drug_bio
            - *c_drug_cmp
            - *c_pol_comm_ref
            - *c_pol_np_ref
            - *c_pol_mcr_ref
            - *c_pol_mcr_bio
            - *c_pt1
            - *c_pt2
            - *c_pt3
            - *c_pt4
            - *c_cl1
            - *c_cl2
            - *c_cl3
            - *c_lot_ref
            - *c_img1
            - *c_plan1
            - *c_plan1_act
            - *c_pa1
            - *c_pa1_sub
            - *c_pa1_dec
            - *c_plan1_get
            - *c_enc1
            - *c_enc1_doc
            - call: "POST /lot-recalls"
              payload: { drug_lot_id: "${lot_ref_id}", recall_class: "CLASS_II", reason: "Sterility failure reported by the manufacturer" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { recall2_id: $.data.id, recall2_required: $.data.notifications_required }
            - call: "POST /lot-recalls/${recall2_id}/send-notifications"
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { recall2_status_sent: $.data.status }
            - call: "GET /recall-notifications"
              payload: { lot_recall_id: "${recall2_id}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { notif2_id: "$.data[0].id", notif2_channel: "$.data[0].channel" }
          trigger:
            - call: "POST /lot-recalls/${recall2_id}/ship-return"
              payload: { carrier_reference: "UPS-1Z-99120" }
              as: PharmacyTech
              captures: { recall2_returned: $.data.vials_returned_count, recall2_expected: $.data.credit_expected_cents }
            - call: "POST /lot-recalls/${recall2_id}/reconcile-credit"
              payload: { credit_received_cents: 528001 }
              as: BillingSpecialist
              captures: { credit_overpost_error: $.data.error_id }
            - call: "POST /lot-recalls/${recall2_id}/reconcile-credit"
              payload: { credit_received_cents: 528000 }
              as: BillingSpecialist
              captures: { recall2_received: $.data.credit_received_cents }
            - call: "POST /recall-notifications/${notif2_id}/acknowledge"
              as: Patient
              as_user_id: "${pt1_id}"
            - call: "POST /lot-recalls/${recall2_id}/close"
              payload: { closure_note: "All held vials returned, credit posted in full, patient notified and acknowledged" }
              as: ComplianceOfficer
              as_user_id: "co-2"
              captures: { recall2_final: $.data.status }
          assert:
            - "${recall2_required} == 1 and ${notif2_channel} == EMAIL"
            - "${recall2_status_sent} == PATIENTS_NOTIFIED and RecallNotification.${notif2_id}.sent_at == \"2026-08-01T00:00:00Z\""
            - "${recall2_returned} == 4"
            - "${recall2_expected} == 528000"
            - "${credit_overpost_error} == \"ERR_CREDIT_EXCEEDS_EXPECTED\" with HTTP 422"
            - "${recall2_received} == 528000 and LotRecall.${recall2_id}.status == CREDIT_RECONCILED after the second post"
            - "RecallNotification.${notif2_id}.status == ACKNOWLEDGED with acknowledged_at == \"2026-08-01T00:00:00Z\""
            - "LotRecall.${recall2_id}.notifications_acknowledged == 1 and notifications_unreachable == 0"
            - "${recall2_final} == CLOSED and LotRecall.${recall2_id}.closed_by_user_id == \"co-2\""
            - "DrugLot.${lot_ref_id}.vials_returned == 4, vials_administered == 1, vials_quarantined == 0, vials_on_hand == 0, vials_reserved == 0, vials_expired == 0"
            - "conservation: 4 + 1 == DrugLot.${lot_ref_id}.vials_received == 5"
            - "DrugLot.${lot_ref_id}.status == RECALLED"
            - "InjectionEncounter.${enc1_id}.status == DOCUMENTED and TreatmentPlan.${plan1_id}.injections_administered == 1"
