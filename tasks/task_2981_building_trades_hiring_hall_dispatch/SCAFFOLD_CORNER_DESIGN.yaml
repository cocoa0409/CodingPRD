              captures: { list_total_after: $.meta.total_count }
          assert:
            - "${c1_name} == Aldridge Mechanical, ${c1_status} == SIGNATORY and ${c1_v} == 1"
            - "${read_name} == Aldridge Mechanical, ${read_expires} == 2027-06-30T00:00:00.000Z and ${read_status} == SIGNATORY"
            - "${list_total} == 1 with ${list_first} == ${c1_id} — the DELINQUENT_TRUST_FUNDS row is filtered out"
            - "${patched_status} == TERMINATED with ${patched_name} unchanged and ${patched_v} == 2"
            - "${list_total_after} == 0 and §1.5 declares no DELETE for Contractor — records are only ever re-statused"
      - name: renew_action_moves_the_deadline_without_disturbing_list_order
        claim_type: action_endpoint
        grounds:
          - endpoints["POST /hiring-hall/registrations/{id}/renew"]
          - state_machines.Registration.REGISTERED_to_REGISTERED
          - validations[priority=30]
          - calculations.registration_timing_windows
        distinguishing_aspect: "Renewal is a self-loop that touches only the timing fields: last_renewed_at becomes the clock (2026-09-15T00:00:00.000Z), renewal_due_at becomes 2026-10-15T00:00:00.000Z, while registered_at, position_number and demotion_count are untouched — and the same call on a REMOVED registration is refused."
