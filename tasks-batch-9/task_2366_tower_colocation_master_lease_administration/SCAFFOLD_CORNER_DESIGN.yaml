# =============================================================================
# 1.9 Scaffold Corner Design — task 2366 Tower Colocation & Master Lease Administration
#
# Breadth probe over the §1.1–§1.7 surface of SCAFFOLD.yaml. Sections and
# claim_type values are taken verbatim from
# skills/prd-bench-scaffold-generator/references/claim-extraction-guide.md.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an
# `excluded_because:` stub and no test_recipe.
#
# Logical clock default: 2026-08-01T00:00:00Z (every instance starts there).
# =============================================================================

scaffold_corner_design:

  - section: entities
    instances:
      - name: tower_creation_returns_201_with_derived_capacity_fields
        claim_type: creation
        grounds:
          - endpoints.POST /tower-colo/towers
          - entities.Tower.fields.reserved_load_units
          - calculations.tower_capacity_reconciliation
          - calculations.tower_capacity_posture
        distinguishing_aspect: |
          A tower created with baseline_reserved_load_units 2000 against a rated capacity of
          10000 must come back with reserved_load_units 2000, reserved_load_pct exactly 20.0,
          available_ground_space_sqft 20000, capacity_posture OPEN, open_review_count 0 and an
          empty occupied_elevation_bands array — the derived block is populated at creation, not
          left null until the first amendment.
        test_recipe:
          setup:
            - "Empty database, logical clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Corner Ridge", structure_type: "MONOPOLE", rated_capacity_load_units: 10000, min_colocation_elevation_ft: 50, max_elevation_ft: 300, ground_space_total_sqft: 20000, baseline_reserved_load_units: 2000, baseline_reserved_ground_sqft: 0 }
              as: PortfolioAdmin
          assert:
            - "response.status == 201"
            - "response.data.site_name == Corner Ridge"
            - "response.data.reserved_load_units == 2000.0"
            - "response.data.reserved_load_pct == 20.0"
            - "response.data.reserved_ground_space_sqft == 0"
            - "response.data.available_ground_space_sqft == 20000"
            - "response.data.capacity_posture == OPEN"
            - "response.data.open_review_count == 0"
            - "response.data.occupied_elevation_bands == []"
            - "response.data.version == 1"
            - "response.data.id is a non-empty string and created_at == 2026-08-01T00:00:00Z"

      - name: tower_retrieval_returns_stored_record
        claim_type: retrieval
        grounds:
          - endpoints.GET /tower-colo/towers/{id}
        distinguishing_aspect: |
          GET /towers/{id} returns the same rated_capacity_load_units 7200 and
          min_colocation_elevation_ft 60 that were stored, inside a response_type "object"
          envelope — no field renaming and no re-derivation drift between write and read.
        test_recipe:
          setup:
            - "One tower exists with rated capacity 7200 and usable elevation 60..250."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Read Back Hill", structure_type: "GUYED", rated_capacity_load_units: 7200, min_colocation_elevation_ft: 60, max_elevation_ft: 250, ground_space_total_sqft: 8000, baseline_reserved_load_units: 3000 }
              as: PortfolioAdmin
              captures: { rb_id: $.data.id }
          trigger:
            - call: "GET /tower-colo/towers/${rb_id}"
              payload: {}
              as: ComplianceAuditor
          assert:
            - "response.status == 200"
            - "response.response_type == object"
            - "response.data.id == ${rb_id}"
            - "response.data.structure_type == GUYED"
            - "response.data.rated_capacity_load_units == 7200"
            - "response.data.min_colocation_elevation_ft == 60"
            - "response.data.reserved_load_units == 3000.0"
            - "response.data.reserved_load_pct == 41.667"

      - name: tower_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET /tower-colo/towers
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          With three towers stored and limit 2 / offset 0, the list returns exactly 2 rows,
          total_count 3 and has_more true; with offset 2 it returns 1 row and has_more false —
          total_count counts the filtered set, not the returned page.
        test_recipe:
          setup:
            - "Three towers exist: two MONOPOLE and one LATTICE-free GUYED structure."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Page One", structure_type: "MONOPOLE", rated_capacity_load_units: 5000, min_colocation_elevation_ft: 50, max_elevation_ft: 200, ground_space_total_sqft: 5000 }
              as: PortfolioAdmin
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Page Two", structure_type: "MONOPOLE", rated_capacity_load_units: 5000, min_colocation_elevation_ft: 50, max_elevation_ft: 200, ground_space_total_sqft: 5000 }
              as: PortfolioAdmin
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Page Three", structure_type: "GUYED", rated_capacity_load_units: 5000, min_colocation_elevation_ft: 50, max_elevation_ft: 200, ground_space_total_sqft: 5000 }
              as: PortfolioAdmin
          trigger:
            - call: "GET /tower-colo/towers"
              payload: { limit: 2, offset: 0 }
              as: PortfolioAdmin
            - call: "GET /tower-colo/towers"
              payload: { limit: 2, offset: 2 }
              as: PortfolioAdmin
            - call: "GET /tower-colo/towers"
              payload: { structure_type: "GUYED", limit: 10, offset: 0 }
              as: PortfolioAdmin
          assert:
            - "trigger call 1 returns status 200, response_type array, len(data) == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "trigger call 2 returns len(data) == 1, total_count == 3, has_more == false"
            - "trigger call 3 returns len(data) == 1, total_count == 1, has_more == false and data[0].site_name == Page Three"

      - name: tower_get_unknown_id_returns_tower_not_found
        claim_type: not_found
        grounds:
          - validations.priority_5
          - errors.ERR_TOWER_NOT_FOUND
        distinguishing_aspect: |
          GET /towers/{id} with a syntactically valid but unknown id returns 404 with
          error_id ERR_TOWER_NOT_FOUND inside the response_type "error" envelope — not 200 with
          a null body and not a generic 400.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /tower-colo/towers/9f1b7c2e-0000-4000-8000-000000000000"
              payload: {}
              as: PortfolioAdmin
          assert:
            - "response.status == 404"
            - "response.response_type == error"
            - "response.data.error_id == ERR_TOWER_NOT_FOUND"

      - name: colocation_application_missing_required_ground_space_rejected
        claim_type: required_fields
        grounds:
          - validations.priority_3
          - endpoints.POST /tower-colo/colocation-applications
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          requested_ground_space_sqft has source input and no default, so omitting it returns
          400 ERR_INVALID_REQUEST and no ColocationApplication row is created — it is not
          silently defaulted to 0.
        test_recipe:
          setup:
            - "One tower and one ACTIVE master lease for tenant CRN exist."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Required Field Ridge", structure_type: "MONOPOLE", rated_capacity_load_units: 9000, min_colocation_elevation_ft: 50, max_elevation_ft: 300, ground_space_total_sqft: 9000 }
              as: PortfolioAdmin
              captures: { rf_t_id: $.data.id }
            - call: "POST /tower-colo/tenants"
              payload: { legal_name: "Corner Radio Networks", carrier_code: "CRN" }
              as: PortfolioAdmin
              captures: { rf_ten_id: $.data.id }
            - call: "POST /tower-colo/master-lease-agreements"
              payload: { tenant_id: "${rf_ten_id}", base_monthly_rent_cents: 200000, escalator_pct: 3.0, initial_term_years: 10, renewal_terms_count: 1, expires_on: "2036-07-31" }
              as: PortfolioAdmin
              captures: { rf_mla_id: $.data.id }
            - call: "POST /tower-colo/master-lease-agreements/${rf_mla_id}/activate"
              payload: {}
              as: PortfolioAdmin
          trigger:
            - call: "POST /tower-colo/colocation-applications"
              payload: { tower_id: "${rf_t_id}", master_lease_agreement_id: "${rf_mla_id}", requested_elevation_bottom_ft: 100, requested_elevation_top_ft: 140 }
              as: Tenant
              as_user_id: "${rf_ten_id}"
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "GET /tower-colo/colocation-applications with tower_id ${rf_t_id} returns total_count == 0"

      - name: tower_baseline_reservations_default_to_zero_when_omitted
        claim_type: defaults
        grounds:
          - entities.Tower.fields.baseline_reserved_load_units
          - entities.Tower.fields.baseline_reserved_ground_sqft
        distinguishing_aspect: |
          Omitting both baseline_reserved_* inputs yields 0 / 0, hence reserved_load_units 0.0,
          reserved_load_pct 0.0 and available_ground_space_sqft equal to the full
          ground_space_total_sqft of 4000 — the defaults are applied, not left null.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Default Flats", structure_type: "SELF_SUPPORT", rated_capacity_load_units: 4000, min_colocation_elevation_ft: 40, max_elevation_ft: 180, ground_space_total_sqft: 4000 }
              as: PortfolioAdmin
          assert:
            - "response.status == 201"
            - "response.data.baseline_reserved_load_units == 0"
            - "response.data.baseline_reserved_ground_sqft == 0"
            - "response.data.reserved_load_units == 0.0"
            - "response.data.reserved_load_pct == 0.0"
            - "response.data.available_ground_space_sqft == 4000"
            - "response.data.capacity_posture == OPEN"

      - name: landlord_w9_on_file_defaults_to_false_and_blocks_payment
        claim_type: defaults
        grounds:
          - entities.Landlord.fields.w9_on_file
          - validations.priority_33
          - errors.ERR_LANDLORD_W9_MISSING
        distinguishing_aspect: |
          Creating a landlord without w9_on_file stores false (not null, not true), and that
          default is load-bearing: the first landlord payment against its lease is rejected with
          422 ERR_LANDLORD_W9_MISSING while GroundLease.paid_through_date stays null.
        test_recipe:
          setup:
            - "One tower with an ACTIVE ground lease whose landlord was created without the w9_on_file flag."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "W9 Mesa", structure_type: "MONOPOLE", rated_capacity_load_units: 6000, min_colocation_elevation_ft: 50, max_elevation_ft: 250, ground_space_total_sqft: 6000 }
              as: PortfolioAdmin
              captures: { w9_t_id: $.data.id }
            - call: "POST /tower-colo/landlords"
              payload: { legal_name: "Mesa Land Trust", remit_contact_email: "ap@mesa.example" }
              as: PortfolioAdmin
              captures: { w9_ll_id: $.data.id }
            - call: "POST /tower-colo/ground-leases"
              payload: { tower_id: "${w9_t_id}", landlord_id: "${w9_ll_id}", base_monthly_rent_cents: 400000, escalator_pct: 2.5, commencement_date: "2020-06-01", term_end_date: "2031-05-31", renewal_option_count: 1, renewal_term_years: 5, buyout_price_cents: 1000000 }
              as: PortfolioAdmin
              captures: { w9_gl_id: $.data.id }
          trigger:
            - call: "POST /tower-colo/landlord-payments"
              payload: { ground_lease_id: "${w9_gl_id}", period_start_date: "2026-08-01", period_end_date: "2026-08-31" }
              as: PortfolioAdmin
          assert:
            - "Landlord.${w9_ll_id}.w9_on_file == false"
            - "response.status == 422"
            - "response.data.error_id == ERR_LANDLORD_W9_MISSING"
            - "GroundLease.${w9_gl_id}.paid_through_date == null"
            - "GET /tower-colo/ground-leases/${w9_gl_id}/landlord-payments returns total_count == 0"

      - name: equipment_line_load_units_computed_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.EquipmentLine.fields.load_units
          - calculations.equipment_line_load_units
        distinguishing_aspect: |
          A client-supplied load_units of 1 is ignored: the line's load_units is computed as
          (140 + 30*1.5) * 2 * 1.25 = 462.5 and ColocationApplication.total_load_units becomes
          462.5, proving the field is derived from the specification, never accepted from input.
        test_recipe:
          setup:
            - "Tower, tenant DCF and an ACTIVE master lease exist; one DRAFT application on the tower."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Computed Crag", structure_type: "MONOPOLE", rated_capacity_load_units: 9000, min_colocation_elevation_ft: 50, max_elevation_ft: 300, ground_space_total_sqft: 9000 }
              as: PortfolioAdmin
              captures: { cc_t_id: $.data.id }
            - call: "POST /tower-colo/tenants"
              payload: { legal_name: "Derived Cell Fields", carrier_code: "DCF" }
              as: PortfolioAdmin
              captures: { cc_ten_id: $.data.id }
            - call: "POST /tower-colo/master-lease-agreements"
              payload: { tenant_id: "${cc_ten_id}", base_monthly_rent_cents: 200000, escalator_pct: 3.0, initial_term_years: 10, renewal_terms_count: 1, expires_on: "2036-07-31" }
              as: PortfolioAdmin
              captures: { cc_mla_id: $.data.id }
            - call: "POST /tower-colo/master-lease-agreements/${cc_mla_id}/activate"
              payload: {}
              as: PortfolioAdmin
            - call: "POST /tower-colo/colocation-applications"
              payload: { tower_id: "${cc_t_id}", master_lease_agreement_id: "${cc_mla_id}", requested_elevation_bottom_ft: 100, requested_elevation_top_ft: 160, requested_ground_space_sqft: 200 }
              as: Tenant
              as_user_id: "${cc_ten_id}"
              captures: { cc_app_id: $.data.id }
          trigger:
            - call: "POST /tower-colo/colocation-applications/${cc_app_id}/equipment-lines"
              payload: { equipment_type: "DISH", model_code: "MW-140", quantity: 2, unit_weight_lbs: 140, wind_area_sqft: 1.5, mount_elevation_ft: 150, load_units: 1 }
              as: Tenant
              as_user_id: "${cc_ten_id}"
          assert:
            - "response.status == 201"
            - "response.data.load_units == 462.5"
            - "ColocationApplication.${cc_app_id}.total_load_units == 462.5"
            - "EquipmentLine.${cc_app_id} line count == 1"

      - name: colocation_application_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.ColocationApplication.fields.status
          - entities.ColocationApplication.fields.submitted_at
          - entities.ColocationApplication.fields.revision_count
        distinguishing_aspect: |
          A create request that smuggles status APPROVED, submitted_at and revision_count 7 is
          stored as status DRAFT, submitted_at null and revision_count 0 — system-sourced fields
          are minted by the server, and the client values are dropped rather than rejected.
        test_recipe:
          setup:
            - "Tower, tenant SYS and an ACTIVE master lease exist."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "System Field Summit", structure_type: "MONOPOLE", rated_capacity_load_units: 9000, min_colocation_elevation_ft: 50, max_elevation_ft: 300, ground_space_total_sqft: 9000 }
              as: PortfolioAdmin
              captures: { sf_t_id: $.data.id }
            - call: "POST /tower-colo/tenants"
              payload: { legal_name: "System Fields Wireless", carrier_code: "SYS" }
              as: PortfolioAdmin
              captures: { sf_ten_id: $.data.id }
            - call: "POST /tower-colo/master-lease-agreements"
              payload: { tenant_id: "${sf_ten_id}", base_monthly_rent_cents: 200000, escalator_pct: 3.0, initial_term_years: 10, renewal_terms_count: 1, expires_on: "2036-07-31" }
              as: PortfolioAdmin
              captures: { sf_mla_id: $.data.id }
            - call: "POST /tower-colo/master-lease-agreements/${sf_mla_id}/activate"
              payload: {}
              as: PortfolioAdmin
          trigger:
            - call: "POST /tower-colo/colocation-applications"
              payload: { tower_id: "${sf_t_id}", master_lease_agreement_id: "${sf_mla_id}", requested_elevation_bottom_ft: 100, requested_elevation_top_ft: 140, requested_ground_space_sqft: 200, status: "APPROVED", submitted_at: "2020-01-01T00:00:00Z", revision_count: 7 }
              as: Tenant
              as_user_id: "${sf_ten_id}"
          assert:
            - "response.status == 201"
            - "response.data.status == DRAFT"
            - "response.data.submitted_at == null"
            - "response.data.revision_count == 0"
            - "response.data.sla_breached == false"
            - "response.data.total_load_units == 0"
            - "response.data.review_deadline_at == null"

      - name: landlord_payment_is_immutable_with_no_version_or_update_surface
        claim_type: immutability
        grounds:
          - entities.LandlordPayment.common_fields
          - endpoints.GET /tower-colo/ground-leases/{id}/landlord-payments
        distinguishing_aspect: |
          LandlordPayment is declared common_fields false, so §1.5 exposes exactly one write
          (POST /landlord-payments) and one read (the lease sub-resource) and no update or delete
          path; a posted payment for 2026-08-01..2026-08-31 lands with months_covered 1 and
          amount_cents 460000 and can only be superseded by appending the next period.
        test_recipe:
          setup:
            - "One tower with an ACTIVE ground lease (base 400000 cents, 2.5% simple escalator, commencement 2020-06-01) under a W-9-bearing landlord; the 2026 monthly rent is therefore 460000 cents."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Immutable Bench", structure_type: "MONOPOLE", rated_capacity_load_units: 6000, min_colocation_elevation_ft: 50, max_elevation_ft: 250, ground_space_total_sqft: 6000 }
              as: PortfolioAdmin
              captures: { im_t_id: $.data.id }
            - call: "POST /tower-colo/landlords"
              payload: { legal_name: "Bench Land Co", remit_contact_email: "ap@bench.example", w9_on_file: true }
              as: PortfolioAdmin
              captures: { im_ll_id: $.data.id }
            - call: "POST /tower-colo/ground-leases"
              payload: { tower_id: "${im_t_id}", landlord_id: "${im_ll_id}", base_monthly_rent_cents: 400000, escalator_pct: 2.5, commencement_date: "2020-06-01", term_end_date: "2031-05-31", renewal_option_count: 1, renewal_term_years: 5, buyout_price_cents: 1000000 }
              as: PortfolioAdmin
              captures: { im_gl_id: $.data.id }
          trigger:
            - call: "POST /tower-colo/landlord-payments"
              payload: { ground_lease_id: "${im_gl_id}", period_start_date: "2026-08-01", period_end_date: "2026-08-31" }
              as: PortfolioAdmin
            - call: "GET /tower-colo/ground-leases/${im_gl_id}/landlord-payments"
              payload: { limit: 10, offset: 0 }
              as: Landlord
              as_user_id: "${im_ll_id}"
          assert:
            - "trigger call 1 returns status 201 with months_covered == 1 and amount_cents == 460000"
            - "trigger call 1 response body carries no version field"
            - "trigger call 2 returns total_count == 1 with data[0].amount_cents == 460000 and data[0].period_end_date == 2026-08-31"
            - "GroundLease.${im_gl_id}.paid_through_date == 2026-08-31"
            - "§1.5 declares no PATCH/PUT/DELETE endpoint for LandlordPayment"

      - name: equipment_line_creation_under_unknown_application_not_found
        claim_type: parent_relationships
        grounds:
          - entities.EquipmentLine.parent
          - validations.priority_5
          - errors.ERR_APPLICATION_NOT_FOUND
        distinguishing_aspect: |
          EquipmentLine is a child of ColocationApplication, so a POST to
          /colocation-applications/{unknown}/equipment-lines returns 404
          ERR_APPLICATION_NOT_FOUND from the path-existence rung — the child is never created
          orphaned and the tenant-scope rung is never reached.
        test_recipe:
          setup:
            - "Tenant PAR exists so that the acting identity resolves."
          setup_api_calls:
            - call: "POST /tower-colo/tenants"
              payload: { legal_name: "Parent Relations Radio", carrier_code: "PAR" }
              as: PortfolioAdmin
              captures: { par_ten_id: $.data.id }
          trigger:
            - call: "POST /tower-colo/colocation-applications/3c2b1a09-0000-4000-8000-000000000000/equipment-lines"
              payload: { equipment_type: "ANTENNA", model_code: "OR-90", quantity: 1, unit_weight_lbs: 90, wind_area_sqft: 0, mount_elevation_ft: 80 }
              as: Tenant
              as_user_id: "${par_ten_id}"
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_APPLICATION_NOT_FOUND"
            - "GET /tower-colo/equipment-lines returns total_count == 0"

      - name: tower_invalid_structure_type_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Tower.fields.structure_type
          - validations.priority_3
        distinguishing_aspect: |
          structure_type is constrained to {MONOPOLE, SELF_SUPPORT, GUYED}; the value LATTICE is
          not a member, so the create returns 400 ERR_INVALID_REQUEST and no tower row exists.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Bad Enum Butte", structure_type: "LATTICE", rated_capacity_load_units: 5000, min_colocation_elevation_ft: 50, max_elevation_ft: 200, ground_space_total_sqft: 5000 }
              as: PortfolioAdmin
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "GET /tower-colo/towers returns total_count == 0"

      - name: application_elevation_top_not_above_bottom_rejected
        claim_type: type_constraints
        grounds:
          - entities.ColocationApplication.fields.requested_elevation_top_ft
          - validations.priority_3
        distinguishing_aspect: |
          requested_elevation_top_ft must be strictly greater than requested_elevation_bottom_ft,
          so the degenerate band 140..140 is a 400 ERR_INVALID_REQUEST at the field-constraint
          rung — before any tower elevation-range check (priority 19, which fires only on submit).
        test_recipe:
          setup:
            - "Tower, tenant TYP and an ACTIVE master lease exist."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Degenerate Band Butte", structure_type: "MONOPOLE", rated_capacity_load_units: 9000, min_colocation_elevation_ft: 50, max_elevation_ft: 300, ground_space_total_sqft: 9000 }
              as: PortfolioAdmin
              captures: { ty_t_id: $.data.id }
            - call: "POST /tower-colo/tenants"
              payload: { legal_name: "Type Constraint Telecom", carrier_code: "TYP" }
              as: PortfolioAdmin
              captures: { ty_ten_id: $.data.id }
            - call: "POST /tower-colo/master-lease-agreements"
              payload: { tenant_id: "${ty_ten_id}", base_monthly_rent_cents: 200000, escalator_pct: 3.0, initial_term_years: 10, renewal_terms_count: 1, expires_on: "2036-07-31" }
              as: PortfolioAdmin
              captures: { ty_mla_id: $.data.id }
            - call: "POST /tower-colo/master-lease-agreements/${ty_mla_id}/activate"
              payload: {}
              as: PortfolioAdmin
          trigger:
            - call: "POST /tower-colo/colocation-applications"
              payload: { tower_id: "${ty_t_id}", master_lease_agreement_id: "${ty_mla_id}", requested_elevation_bottom_ft: 140, requested_elevation_top_ft: 140, requested_ground_space_sqft: 200 }
              as: Tenant
              as_user_id: "${ty_ten_id}"
          assert:
            - "response.status == 400"
