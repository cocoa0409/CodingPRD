          assert:
            - "${rep_variant0} == PROVISIONAL and ${rep_by} == admin-1 and ${rep_v0} == 1"
            - "${rep_prov} == 0 and ${rep_cert} == 0 and ${rep_pub0} == 0 — an empty window is 0 bps, not an error"
            - "the first certify returns 200 with ${rep_variant1} == CERTIFIED"
            - "${rep_pub1} == 0 and ${rep_at} == 2026-08-12T00:00:00Z and ${rep_cert_by} == admin-2"
            - "${rep_v1} == 2"
            - "the second certify returns 409 with ${err_id} == ERR_REPORT_ALREADY_CERTIFIED"
            - "${rep_variant2} == CERTIFIED and ${rep_v2} == 2"
