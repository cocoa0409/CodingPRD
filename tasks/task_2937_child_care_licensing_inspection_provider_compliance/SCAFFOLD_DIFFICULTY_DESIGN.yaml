              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/enforcement-actions"
              payload: { provider_id: "${prov}", requested_action_type: "PROBATION", source_inspection_id: "${insp_ann}", rationale: "Forty-eight open points across six ratio findings." }
              as: LicensingSupervisor
              captures: { act_prob: $.data.id }
            - call: "POST /licensing/enforcement-actions/${act_prob}/issue"
              payload: {}
              as: LicensingSupervisor
              as_user_id: "sup-1"
            - call: "POST /licensing/enforcement-actions/${act_prob}/effectuate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /licensing/enforcement-actions"
              payload: { provider_id: "${prov}", requested_action_type: "SUSPENSION", source_inspection_id: "${insp_ann}", rationale: "No corrections filed; suspension proposed." }
              as: LicensingSupervisor
              captures: { act_susp: $.data.id, fine_susp: $.data.fine_amount_cents }
            - call: "POST /licensing/enforcement-actions/${act_susp}/issue"
              payload: {}
              as: LicensingSupervisor
              as_user_id: "sup-1"
            - call: "POST /licensing/enforcement-actions/${act_susp}/effectuate"
              payload: {}
              as: AgencyAdmin
              captures: { held: $.data.capacity_held_slots }
            - call: "GET /licensing/providers/${prov}/risk-assessment"
              payload: { variant: "ENFORCEMENT_REVIEW" }
              as: AgencyAdmin
              captures: { risk_suspended: $.data.risk_score }
            - call: "POST /licensing/enforcement-actions/${act_susp}/appeal"
              payload: { appeal_note: "The six findings describe one staffing event and are duplicative." }
              as: Applicant
              as_user_id: "${prov}"
            - call: "POST /licensing/enforcement-actions/${act_susp}/appeal-decision"
              payload: { appeal_decision: "VACATED" }
              as: AgencyAdmin
              as_user_id: "admin-2"
          assert:
            - "after license-decision ISSUE Provider.${prov}.licensed_capacity == 60, suspended_capacity == 0, license_status == \"PROVISIONAL\", and total_authorized_slots == 60"
            - "after the ANNUAL finalize open_violation_points == 48 (six SERIOUS citations at 8 points each), critical_open_count == 0, and Inspection.${insp_ann}.final_compliance_score == 52.00 (six lines of 8.00)"
            - "EnforcementAction.${act_prob} is created with basis_points == 48, ladder_step == 2 and fine_amount_cents == 177650 (gross 50000 + 48 * 2500 = 170000 -> tier T2 -> surcharge 17000 -> net 187000 -> credit 9350)"
            - "the PROBATION effectuate sets license_status \"PROBATION\", current_ladder_step 2 and probation_cycle_count 1, and leaves licensed_capacity 60 / suspended_capacity 0 — a probation moves no slots"
            - "${fine_susp} == 282150 (gross 150000 + 120000 = 270000 -> tier T2 -> surcharge 27000 -> net 297000 -> credit 14850) and EnforcementAction.${act_susp}.ladder_step == 3"
            - "the SUSPENSION effectuate sets ${held} == 60, Provider.licensed_capacity == 0, suspended_capacity == 60, license_status \"SUSPENDED\", current_ladder_step 3 — licensed + suspended is STILL 60"
            - "${risk_suspended} == 63.00 with risk_tier \"HIGH\" (48 points + PROBATION_STATE_BONUS 15; no CRITICAL bonus because every citation is SERIOUS)"
            - "filing the appeal returns 200 with status \"APPEALED\" and changes NO provider field: licensed_capacity stays 0, suspended_capacity stays 60, license_status stays \"SUSPENDED\", total still 60"
            - "the appeal is inside the window: appeal_deadline_at == \"2026-09-04T00:00:00Z\" (issued_at 2026-08-20T00:00:00Z + 15 days) and the filing instant is 2026-08-20T00:00:00Z"
            - "the VACATED decision is made by \"admin-2\", which differs from EnforcementAction.${act_susp}.issued_by_user_id \"sup-1\", so ERR_SEGREGATION_OF_DUTIES does not fire"
            - "after VACATED: Provider.licensed_capacity == 60, suspended_capacity == 0, EnforcementAction.${act_susp}.capacity_held_slots == 0 — every slot returned to the field it came from and total_authorized_slots is 60 at every one of the four checkpoints"
            - "the compensation is deliberately PARTIAL: license_status is \"PROBATION\" and NOT \"PROVISIONAL\", current_ladder_step is 2 and not 3, probation_cycle_count is still 1 (never decremented), open_violation_points is still 48, and ${fine_susp} is still 282150 — vacating an action refunds capacity, not money or history"
            - "EnforcementAction.${act_prob} is still \"EFFECTIVE\" — vacating the suspension does not disturb the earlier action in the ladder"
