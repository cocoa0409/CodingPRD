          assert:
            - "ReleaseNoteDocument.${cust_note}.entry_count == 1"
            - "ReleaseNoteDocument.${cust_note}.included_change_ids == [${cr_a}]"
            - "ReleaseNoteDocument.${cust_note}.excluded_change_count == 2"
            - "ReleaseNoteDocument.${int_note}.entry_count == 3"
            - "ReleaseNoteDocument.${int_note}.included_change_ids == [${cr_a}, ${cr_b}, ${cr_c}] in merged_at then created_at ascending order"
            - "ReleaseNoteDocument.${int_note}.excluded_change_count == 0"
            - "Both documents report generated_at == 2026-08-08T00:00:00Z and state == DRAFT"

      - name: release_notes_candidate_set_excludes_deferred_and_unmerged_changes
        claim_type: input_set_filtering
        grounds:
          - calculations.release_note_generation
          - state_machines.Release.OPEN_to_CUT
          - entities.ChangeRequest.fields.state
        distinguishing_aspect: "Only changes in MERGED or DEPLOYED are candidates: the MEDIUM change that the cut auto-deferred contributes neither an entry nor an excluded_change_count unit, so entry_count is 1 and excluded_change_count is 0 rather than 1."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Release 2026.08.1 with cut_at 2026-08-10T00:00:00Z."
