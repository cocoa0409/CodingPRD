scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: style_unit_economics_realized_vs_projected_diverge
        grounds:
          - "1.3 calculation unit_economics with variants REALIZED and PROJECTED and its response-field block"
          - "1.5 GET /styles/{style_id}/unit-economics with input variant"
          - "1.1 Style.acquisition_cost_cents, expected_rental_turns_per_unit, planned_eol_value_cents"
          - "1.1 RentalUnit.realized_revenue_cents, cumulative_servicing_cost_cents, turns_completed"
          - "1.3 constants REFERENCE_REVENUE_PER_TURN_CENTS and PROJECTED_SERVICING_PER_TURN_CENTS"
        distinguishing_aspect: >-
          Both variants read exactly the same Style row and the same three RentalUnit rows, yet REALIZED reports
          avg_margin_per_turn_cents -20556 while PROJECTED reports 200. REALIZED divides each unit's own margin by
          that unit's own turns_completed (with the 0-turn units falling back to a single turn) and averages the per-
          unit results, so it is dominated by the unamortised acquisition cost of units that have not yet rented;
          PROJECTED ignores the persisted rows entirely and amortises acquisition over the full
          expected_rental_turns_per_unit of 12 at the reference revenue and servicing rates. An implementation that
          computes one variant and reuses it for the other, or that reads RentalUnit rows in the PROJECTED branch,
          cannot produce both numbers from one fixture.
        test_recipe:
          setup:
            - "logical clock is parked at 2026-08-03T09:00:00Z"
            - "membership plan SIG4 (item_slots 3, monthly_fee_cents 10000, monthly_swaps_allowed 2, shipping_cadence_days 7)"
            - "two ACTIVE technicians, both repair_certified and photography_certified, so the reconditioning sign-offs satisfy segregation of duties"
            - "style AUR-GOWN-01: retail_price_cents 48000, acquisition_cost_cents 21000, expected_rental_turns_per_unit 12, planned_eol_value_cents 9000, forecast_monthly_requests 8, avg_rental_days 6"
            - "three grade-A size-M units of that style, each acquisition_cost_cents 21000"
            - "member on SIG4 completes exactly one clean turn on unit 001: LIGHT soil, NONE damage, so the job charges CLEANING_COST_CENTS[LIGHT] 1200 plus PHOTOGRAPHY_COST_CENTS 800 and the closed reservation attributes 3333 cents of the 10000-cent monthly fee across item_slots 3"
            - "units 002 and 003 stay IN_STOCK with turns_completed 0, realized_revenue_cents 0 and cumulative_servicing_cost_cents 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /membership-plans"
              payload: { code: "SIG4", name: "Signature 4", item_slots: 3, monthly_fee_cents: 10000, monthly_swaps_allowed: 2, shipping_cadence_days: 7, waiver_monthly_fee_cents: 1800, waiver_coverage_cents: 10000 }
              as: PlatformAdmin
              captures: { plan_sig4_id: "$.data.id" }
            - call: "POST /technicians"
              payload: { employee_code: "T-INSP-1", full_name: "Ivo Sandoval", repair_certified: true, photography_certified: true, status: "ACTIVE" }
              as: PlatformAdmin
              captures: { tech_insp_id: "$.data.id" }
            - call: "POST /technicians"
              payload: { employee_code: "T-REP-2", full_name: "Marta Lindqvist", repair_certified: true, photography_certified: true, status: "ACTIVE" }
              as: PlatformAdmin
              captures: { tech_rep_id: "$.data.id" }
            - call: "POST /styles"
              payload: { style_code: "AUR-GOWN-01", brand: "Aurelia", category: "GOWN", retail_price_cents: 48000, acquisition_cost_cents: 21000, size_run: ["S", "M", "L"], expected_rental_turns_per_unit: 12, planned_eol_value_cents: 9000, forecast_monthly_requests: 8, avg_rental_days: 6, planned_depth_units: 3 }
              as: InventoryPlanner
              captures: { style_gown_id: "$.data.id" }
            - call: "POST /styles/${style_gown_id}/rental-units"
              payload: { unit_code: "AUR-GOWN-01-M-001", size: "M", acquisition_cost_cents: 21000, condition_grade: "A" }
              as: InventoryPlanner
              captures: { unit1_id: "$.data.id" }
            - call: "POST /styles/${style_gown_id}/rental-units"
              payload: { unit_code: "AUR-GOWN-01-M-002", size: "M", acquisition_cost_cents: 21000, condition_grade: "A" }
              as: InventoryPlanner
              captures: { unit2_id: "$.data.id" }
            - call: "POST /styles/${style_gown_id}/rental-units"
              payload: { unit_code: "AUR-GOWN-01-M-003", size: "M", acquisition_cost_cents: 21000, condition_grade: "A" }
              as: InventoryPlanner
              captures: { unit3_id: "$.data.id" }
            - call: "POST /members"
              payload: { membership_plan_id: "${plan_sig4_id}", email: "nora@example.com", full_name: "Nora Ellery", waiver_active: false, preferred_categories: ["GOWN", "DRESS"], size_profile: "M" }
              as: PlatformAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /reservations"
              payload: { style_id: "${style_gown_id}", requested_size: "M", requested_start_date: "2026-08-10", requested_end_date: "2026-08-16" }
              as: Member
              as_user_id: "${member_id}"
