              as: BrokerAdmin
            - call: "POST /items"
              payload: { principal_id: "${p1}", upc: "011111000001", description: "Mini Tacos 12ct", case_pack_units: 12, list_price_cents: 2010, unit_cost_cents: 1200 }
              as: BrokerAccountManager
              captures: { i1: $.data.id }
            - call: "POST /items"
              payload: { principal_id: "${p2}", upc: "022222000002", description: "Frozen Empanadas 10ct", case_pack_units: 10, list_price_cents: 2000, unit_cost_cents: 1150 }
