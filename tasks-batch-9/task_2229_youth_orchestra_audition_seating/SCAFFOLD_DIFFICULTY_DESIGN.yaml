      - name: slot_window_band_beats_room_overlap_band
        grounds:
          - validations[priority=56]
          - validations[priority=70]
          - calculations.room_slot_overlap
          - entities.Season.fields.audition_window_end
          - errors.ERR_SLOT_OUTSIDE_AUDITION_WINDOW
          - errors.ERR_ROOM_DOUBLE_BOOKED
        distinguishing_aspect: |
          A THIRD category pair - business_temporal(56) vs business_constraint(70)
          - on POST /audition-slots. The offending slot runs past
          audition_window_end 2026-08-20T18:00:00Z AND buffer-collides with an
          existing slot in room R1; the temporal band outranks the interval band,
          so the 422 window error must surface instead of the 409 room error. The
          two controls separate the causes by moving one axis at a time (same
          room / legal window, then illegal window / empty room).
        test_recipe:
          setup:
            - "One season with audition_window 2026-08-10T09:00:00Z .. 2026-08-20T18:00:00Z advanced to AUDITIONS_OPEN."
            - "Six available VIOLIN panelists, so the panelist-availability rule at priority 72 never becomes the binding constraint."
            - "One existing slot S1 in room R1 from 17:00 to 17:30 on 2026-08-20, staffed by p1-p3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: ArtisticDirector
            - call: "POST /seasons"
              payload: { name: "2026-2027 Season", year_label: "2026-27", audition_window_start: "2026-08-10T09:00:00Z", audition_window_end: "2026-08-20T18:00:00Z", tuition_base_cents: 123223, tuition_due_at: "2026-12-01T00:00:00Z", aid_budget_cents: 100000 }
