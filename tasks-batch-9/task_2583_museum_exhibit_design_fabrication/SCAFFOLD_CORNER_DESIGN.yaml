            - "${del} == 109250 == round_half_up(10.0 * 9500 * 1.15), ${dem} == 57000 == round_half_up(1.0 * 47500 * 1.20), ${def} == 0 == round_half_up(57000 * 0.0) and ${det} == 166250 - the three line items are rounded individually and then summed"
