            - "no Shipment row was created by the refused request and shipment_sequence_counter is still 1"
            - "the 2026-10-19 request succeeds with HTTP 201: exact adjacency (a zero-day gap) is legal because there is NO buffer on this resource"
            - "Shipment.${ship2_id}.status == SCHEDULED, sequence_number == 2, quantity == 2, sku_id == ${sku_m8_id}"
            - "Subscription.${sub_a_id}.next_ship_date is recomputed from the accepted shipment set"

  - rule_id: compensating_invariant
    instances:

      - name: claim_payout_and_reversal_restore_property_ledger_net_exactly
        grounds:
          - calculations.property_ledger_rollup
          - state_machines.Claim.APPROVED_to_PAID
          - state_machines.Claim.PAID_to_PAYMENT_REVERSED
          - entities.LedgerEntry.fields.amount_cents
          - entities.Property.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Conserved quantity = MONEY (Property.outstanding_balance_cents). The compensation is
          an explicit paired ledger insert: CLAIM_PAYOUT of -30000 followed by
          CLAIM_PAYOUT_REVERSAL of +30000, with approved_amount_cents deliberately left
          unchanged so the two legs sum to exactly zero and the balance returns to its
          pre-payment value of 5588 with no drift.
        test_recipe:
          setup:
            - "Fixture A: ACTIVE PM_BILLED PLUS property 'Cedar Ridge' with credit_limit_cents 5000000, TWO_STAGE unit A-101, MERV 8 SKU at 680 cents, resident household_size 3."
            - "Subscription is ACTIVE (activated 2026-08-05) with monthly_fee_cents 3546; Property.outstanding_balance_cents is 5588 (ENROLLMENT_FEE 2500 + first_month_fee 3088) and exactly two LedgerEntry rows exist."
            - "installation_posture is UNVERIFIED, so the final_at_decision variant applies no haircut."
            - "A DAMAGE_WAIVER Claim for requested_amount_cents 40000 with incident_date 2026-08-05 was triaged by adj-001 and APPROVED by adj-002 for base min(40000 - 5000, 30000) = 30000."
            - "Logical clock stands at 2026-08-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /filter-skus"
              payload: { sku_code: "SKU-16251-M8", size_code: "16x25x1", thickness_inches: 1, merv_rating: 8, unit_cost_cents: 680, ship_weight_oz: 14, pack_quantity: 1 }
              as: ProgramOperator
              captures: { sku_m8_id: "$.data.id" }
            - call: "POST /properties"
              payload: { name: "Cedar Ridge", state_code: "TX", billing_mode: "PM_BILLED", benefit_tier: "PLUS", damage_waiver_enabled: true, aqg_enabled: true, credit_limit_cents: 5000000 }
              as: ProgramOperator
              captures: { prop_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/units"
              payload: { unit_label: "A-101", hvac_system_type: "TWO_STAGE", filter_slot_count: 2, return_grille_count: 1, nominal_size_code: "16x25x1" }
              as: ProgramOperator
              captures: { unit_a_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /residents"
              payload: { full_name: "Ada Reyes", email: "ada.reyes@example.com", household_size: 3, has_pets: false, smoker: false, allergy_flag: false }
              as: ProgramOperator
              captures: { res_a_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /subscriptions"
              payload: { resident_id: "${res_a_id}", unit_id: "${unit_a_id}", billing_party: "PROPERTY_MANAGER", enrollment_channel: "MOVE_IN_PACKET", lease_start_date: "2026-08-01", lease_end_date: "2027-07-31" }
              as: ProgramOperator
              captures: { sub_a_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_a_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /claims"
              payload: { subscription_id: "${sub_a_id}", claim_type: "DAMAGE_WAIVER", incident_date: "2026-08-05", requested_amount_cents: 40000, description: "Return grille torn during filter change" }
              as: PropertyManager
              as_user_id: "${prop_id}"
              captures: { claim_id: "$.data.id" }
            - call: "POST /claims/${claim_id}/triage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
            - call: "POST /claims/${claim_id}/decide"
              payload: { decision: "APPROVE", decision_note: "Waiver applies, no non-install suspicion on file" }
              as: ClaimsAdjuster
              as_user_id: "adj-002"
          trigger:
            - call: "POST /claims/${claim_id}/pay"
              payload: {}
              as: ProgramOperator
            - call: "POST /claims/${claim_id}/reverse-payment"
              payload: { reversal_reason: "Vendor invoice withdrawn by the property manager" }
              as: ProgramOperator
          assert:
            - "before the pay: Property.${prop_id}.outstanding_balance_cents == 5588 with exactly 2 LedgerEntry rows"
            - "Claim.${claim_id}.approved_amount_cents == 30000 (no haircut: installation_posture is UNVERIFIED)"
            - "after the pay: Claim.${claim_id}.status == PAID and a CLAIM_PAYOUT LedgerEntry with amount_cents == -30000 and billed_party PROPERTY_MANAGER exists"
            - "after the pay: Property.${prop_id}.outstanding_balance_cents == -24412 (5588 - 30000), so the intermediate state is genuinely different"
            - "after the reverse-payment: Claim.${claim_id}.status == PAYMENT_REVERSED and a CLAIM_PAYOUT_REVERSAL LedgerEntry with amount_cents == +30000 exists"
            - "after the reverse-payment: Property.${prop_id}.outstanding_balance_cents == 5588 — byte-identical to the pre-payment value, no drift of even one cent"
            - "Claim.${claim_id}.approved_amount_cents is STILL 30000 after the reversal, which is what makes the two legs sum to zero"
            - "exactly 4 LedgerEntry rows now exist for subscription ${sub_a_id} and the append-only log was never mutated or deleted"
            - "the reversal LedgerEntry carries the same billed_party as the CLAIM_PAYOUT row it compensates"

      - name: property_suspend_reactivate_pair_restores_active_entitlement_set
        grounds:
          - calculations.entitlement_active_census
          - state_machines.BenefitEntitlement.ACTIVE_to_SUSPENDED
          - state_machines.BenefitEntitlement.SUSPENDED_to_ACTIVE
          - entities.BenefitEntitlement.fields.suspended_by_property_event
          - state_machines.Property.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Conserved quantity = an ENTITLEMENT SET, not money, and the compensation is driven by
          the suspended_by_property_event flag rather than by a paired ledger insert. The
          fixture is pre-loaded with two already-FORFEITED rows so the invariant also proves a
          negative: the reactivate cascade must restore exactly the flagged rows and must NOT
          resurrect terminal ones.
        test_recipe:
          setup:
            - "Fixture A: ACTIVE PM_BILLED PLUS property 'Cedar Ridge', TWO_STAGE unit A-101, MERV 8 SKU at 680 cents, resident household_size 3, subscription ACTIVE from 2026-08-05."
            - "All four BenefitEntitlement rows started ACTIVE: CREDIT_REPORTING, RENTERS_INSURANCE, DAMAGE_WAIVER, AIR_QUALITY_GUARANTEE."
            - "Shipment #1 is DELIVERED with delivered_at 2026-08-06T00:00:00Z and two readings over 2026-08-07 -> 2026-08-09 (runtime_minutes 168, pressure 100 -> 120) score 62."
            - "A RUNTIME_ANALYTICS evaluation, a send-notice and a confirm at clock 2026-09-11T00:00:00Z have run cascade A, so DAMAGE_WAIVER and AIR_QUALITY_GUARANTEE are FORFEITED and monthly_fee_cents is 2546."
            - "The pre-suspend census is therefore entitlement_active_census == 2 with the ACTIVE set exactly [CREDIT_REPORTING, RENTERS_INSURANCE] and entitlement_total_census == 4."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /filter-skus"
              payload: { sku_code: "SKU-16251-M8", size_code: "16x25x1", thickness_inches: 1, merv_rating: 8, unit_cost_cents: 680, ship_weight_oz: 14, pack_quantity: 1 }
              as: ProgramOperator
              captures: { sku_m8_id: "$.data.id" }
            - call: "POST /properties"
              payload: { name: "Cedar Ridge", state_code: "TX", billing_mode: "PM_BILLED", benefit_tier: "PLUS", damage_waiver_enabled: true, aqg_enabled: true, credit_limit_cents: 5000000 }
              as: ProgramOperator
              captures: { prop_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/units"
              payload: { unit_label: "A-101", hvac_system_type: "TWO_STAGE", filter_slot_count: 2, return_grille_count: 1, nominal_size_code: "16x25x1" }
              as: ProgramOperator
              captures: { unit_a_id: "$.data.id" }
            - call: "POST /properties/${prop_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /residents"
              payload: { full_name: "Ada Reyes", email: "ada.reyes@example.com", household_size: 3, has_pets: false, smoker: false, allergy_flag: false }
              as: ProgramOperator
              captures: { res_a_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /subscriptions"
              payload: { resident_id: "${res_a_id}", unit_id: "${unit_a_id}", billing_party: "PROPERTY_MANAGER", enrollment_channel: "MOVE_IN_PACKET", lease_start_date: "2026-08-01", lease_end_date: "2027-07-31" }
              as: ProgramOperator
              captures: { sub_a_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_a_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "GET /shipments"
              payload: { subscription_id: "${sub_a_id}" }
              as: ProgramOperator
              captures: { ship1_id: "$.data[0].id" }
            - call: "POST /shipments/${ship1_id}/ship"
              payload: { tracking_code: "TRK-A-0001" }
              as: ProgramOperator
            - call: "POST /shipments/${ship1_id}/deliver"
              payload: { delivered_at: "2026-08-06T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /units/${unit_a_id}/runtime-readings"
              payload: { window_start: "2026-08-07T00:00:00Z", window_end: "2026-08-08T00:00:00Z", runtime_minutes: 168, static_pressure_delta_pa: 100, source: "PRESSURE_SENSOR" }
              as: ProgramOperator
            - call: "POST /units/${unit_a_id}/runtime-readings"
              payload: { window_start: "2026-08-08T00:00:00Z", window_end: "2026-08-09T00:00:00Z", runtime_minutes: 168, static_pressure_delta_pa: 120, source: "PRESSURE_SENSOR" }
              as: ProgramOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /subscriptions/${sub_a_id}/non-install-evaluations"
              payload: { detection_method: "RUNTIME_ANALYTICS", evaluated_through_date: "2026-08-09" }
              as: ProgramOperator
              captures: { case_id: "$.data.id" }
            - call: "POST /non-install-cases/${case_id}/send-notice"
              payload: {}
              as: ProgramOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /non-install-cases/${case_id}/confirm"
              payload: {}
              as: ProgramOperator
            - call: "GET /subscriptions/${sub_a_id}/benefit-entitlements"
              payload: {}
              as: ProgramOperator
          trigger:
            - call: "POST /properties/${prop_id}/suspend"
              payload: { suspend_reason: "PM_PAYMENT_DELINQUENT" }
              as: ProgramOperator
            - call: "POST /properties/${prop_id}/reactivate"
              payload: {}
              as: ProgramOperator
          assert:
            - "pre-suspend: entitlement_active_census == 2 and the sorted ACTIVE benefit_code set is exactly [CREDIT_REPORTING, RENTERS_INSURANCE]"
            - "pre-suspend: entitlement_total_census == 4 and the DAMAGE_WAIVER and AIR_QUALITY_GUARANTEE rows are FORFEITED with forfeit_reason NON_INSTALL_CONFIRMED"
            - "after the suspend: entitlement_active_census == 1 with the ACTIVE set exactly [CREDIT_REPORTING], proving the intermediate state really differs"
            - "after the suspend: the RENTERS_INSURANCE row is SUSPENDED with suspended_by_property_event == true"
            - "after the suspend: the AIR_QUALITY_GUARANTEE row stays FORFEITED and its suspended_by_property_event is false — a terminal row is never re-suspended"
            - "after the reactivate: entitlement_active_census == 2 and the sorted ACTIVE benefit_code set is exactly [CREDIT_REPORTING, RENTERS_INSURANCE], identical to the pre-suspend set"
            - "after the reactivate: the RENTERS_INSURANCE row is ACTIVE again with suspended_by_property_event reset to false"
            - "after the reactivate: DAMAGE_WAIVER and AIR_QUALITY_GUARANTEE are STILL FORFEITED — the restore must not resurrect terminal rows"
            - "entitlement_total_census is 4 at every observation and the partition identity PENDING + ACTIVE + SUSPENDED + FORFEITED + EXPIRED == 4 holds throughout"
            - "Subscription.${sub_a_id}.monthly_fee_cents is 2546 before the suspend and 2546 after the reactivate — the pair does not re-price the subscription"
            - "Subscription.${sub_a_id}.status is ACTIVE again after the reactivate and installation_posture is still NON_INSTALL_CONFIRMED"
