              as: CampDirector
              as_user_id: "camp-unknown"
          assert:
            - "first call: 404 ERR_CAMP_NOT_FOUND - priority 4 beats the priority-19 stale-version check even though expected_camp_version is also garbage"
            - "second call: 404 ERR_VISIT_NOT_FOUND - priority 11 beats the priority-10 visitor check because visit_id is validated first in input order"
            - "third call: 404 ERR_ANNUAL_REPORT_NOT_FOUND"
            - "no AccreditationCycle, VisitAssignment or IncidentDisclosure row is created"

      - name: medication_record_creation_stamps_compliance_flag_from_class_and_signature
        claim_type: Computed Fields
        grounds:
          - entities.MedicationAdministrationRecord.fields.compliance_flag
          - endpoints[POST /accreditation/medication-records]
        distinguishing_aspect: "compliance_flag is DOCUMENTATION_INCOMPLETE only for an unwitnessed PRESCRIPTION dose; an unwitnessed OTC dose is COMPLIANT, and an unwitnessed CONTROLLED dose never reaches the flag because priority 37 rejects it first."
        test_recipe:
          setup:
            - "one RESIDENT camp staffed RN_ONSITE so both OTC and PRESCRIPTION classes clear priority 32"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
