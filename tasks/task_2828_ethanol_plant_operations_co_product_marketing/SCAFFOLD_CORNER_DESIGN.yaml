              captures: { eff: $.data.effective_yield_gal_per_bushel }
            - call: "POST /ethanol-ops/fermentation-batches/${fb1_id}/complete"
              payload: {}
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { gal: $.data.ethanol_gallons_produced, ddgs: $.data.ddgs_tons_produced, oil: $.data.corn_oil_lbs_produced }
            - call: "GET /ethanol-ops/rin-batches"
              payload: {}
