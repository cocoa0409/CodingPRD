- rule_id: resource_temporal_overlap
  instances:
  - name: delivery_window_half_open_adjacency
    grounds:
    - validations[priority=6.4]
    - errors[ERR_DELIVERY_WINDOW_OVERLAP]
    - entities.Order.fields.delivery_window_start
    distinguishing_aspect: "Resource: the clinic's delivery calendar; semantics: HALF-OPEN\n[start, end) \u2014 an intersecting window (14:00-16:00 vs 13:00-15:00)\nconflicts, while a touching window (15:00-17:00)\
      \ is ACCEPTED because\nend == start is not an intersection.\n"
    test_recipe:
      setup:
      - ACTIVE clinic C (frequency 5); product in stock; order O1 SUBMITTED holding window 2026-08-10T13:00-15:00Z
      setup_api_calls:
      - call: POST /vet/clinics
        payload:
          clinic_name: Clinic W
          license_number: LIC-W1
          ship_to_address: 17 Tack Trl
          credit_limit_cents: 5000000
          minimum_order_value_cents: 5000
          delivery_frequency_per_week: 5
          free_freight_threshold_cents: 100000
        as: AccountManager
        captures:
          c_id: $.data.id
      - call: POST /vet/clinics/${c_id}/activate
        as: AccountManager
      - call: POST /vet/products
        payload:
          sku: CONS-W1
          product_name: Gauze Roll
          manufacturer_code: GEN
          product_type: CONSUMABLE
          unit_price_cents: 10000
        as: SupplyChainPlanner
        captures:
          p_id: $.data.id
      - call: POST /vet/inventory-lots
        payload:
          product_id: ${p_id}
          lot_number: LOT-W1
          expiry_date: '2027-06-30'
          qty_on_hand: 20
        as: SupplyChainPlanner
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 17 Tack Trl
          delivery_window_start: '2026-08-10T13:00:00Z'
          delivery_window_end: '2026-08-10T15:00:00Z'
          lines:
          - product_id: ${p_id}
            qty_requested: 1
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o1_id: $.data.id
      - call: POST /vet/orders/${o1_id}/submit
        as: ClinicBuyer
        as_user_id: ${c_id}
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 17 Tack Trl
          delivery_window_start: '2026-08-10T14:00:00Z'
          delivery_window_end: '2026-08-10T16:00:00Z'
          lines:
          - product_id: ${p_id}
            qty_requested: 1
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o2_id: $.data.id
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 17 Tack Trl
          delivery_window_start: '2026-08-10T15:00:00Z'
          delivery_window_end: '2026-08-10T17:00:00Z'
          lines:
          - product_id: ${p_id}
            qty_requested: 1
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o3_id: $.data.id
      trigger:
      - call: POST /vet/orders/${o2_id}/submit
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          err: $.data.error_id
      - call: POST /vet/orders/${o3_id}/submit
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o3_status: $.data.status
      assert:
      - O2 submit -> error_id == ERR_DELIVERY_WINDOW_OVERLAP, http 409 (14:00 < 15:00 intersects O1)
      - O2.status remains DRAFT
      - O3 submit -> 200, status SUBMITTED (start 15:00 == O1.end 15:00 is adjacency, allowed under half-open semantics)
  - name: authorization_window_closed_overlap
    grounds:
    - validations[priority=6.3]
    - errors[ERR_AUTHORIZATION_WINDOW_OVERLAP]
    - entities.ManufacturerAuthorization.fields.valid_until
    distinguishing_aspect: "Resource: the (clinic, manufacturer) authorization channel;\nsemantics: CLOSED date intervals [valid_from, valid_until] \u2014 sharing\na single boundary date (2026-06-30) IS\
      \ a conflict, the opposite\nadjacency rule from the half-open delivery calendar; a strictly\ndisjoint successor (2026-07-01) is accepted.\n"
    test_recipe:
      setup:
      - ACTIVE clinic C; authorization A1 (ZOETIS, 2026-01-01..2026-06-30) exists in PENDING
      setup_api_calls:
      - call: POST /vet/clinics
        payload:
          clinic_name: Clinic AW
          license_number: LIC-AW1
          ship_to_address: 18 Groom Gln
