            - { call: "POST /sar-reports/${sar1}/qa-review", payload: { outcome: "PASS" }, as: QAReviewer, as_user_id: "${qa1}" }
            - { call: "POST /sar-reports/${sar1}/approve", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /sar-reports/${sar1}/file", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "GET /sar-reports/${sar1}/continuing-reviews", as: BSAAnalyst, as_user_id: "${an1}", captures: { rev1: "$.data[0].id", rev1_due: "$.data[0].due_at" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /ops/jobs/daily-compliance-sweep", as: ComplianceAdmin, captures: { od_boundary: $.data.reviews_marked_overdue } }
            - { call: "GET /continuing-reviews/${rev1}", as: BSAAnalyst, as_user_id: "${an1}", captures: { rev1_mid: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:01Z" }, as: ComplianceAdmin }
            - { call: "POST /ops/jobs/daily-compliance-sweep", as: ComplianceAdmin, captures: { od_after: $.data.reviews_marked_overdue } }
            - { call: "GET /continuing-reviews/${rev1}", as: BSAAnalyst, as_user_id: "${an1}", captures: { rev1_end: $.data.status } }
          assert:
            - "due_at == 2026-08-03T00:00:00Z (filed 2026-05-05 + 90d)"
            - "At now == due_at exactly: reviews_marked_overdue == 0 and status stays SCHEDULED"
            - "At now == due_at + 1s: reviews_marked_overdue == 1 and status == OVERDUE"

      - name: backlog_bucket_edge_age_16
        claim_type: correct_result
