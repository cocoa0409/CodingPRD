              captures: { eng_id: $.data.id }
            - call: "POST /pentest/rules-of-engagement"
              payload: { engagement_id: "${eng_id}", exclusions: ["prod-db-01"], allowed_techniques: ["SQLI", "XSS"], emergency_stop_procedure: "Halt traffic and call the escalation contact", escalation_contact: "soc@example.com" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { roe_id: $.data.id }
            - call: "POST /pentest/authorized-targets"
              payload: { roe_id: "${roe_id}", asset_id: "${asset_a_id}", window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-30T23:59:59Z", technique_allowlist: ["SQLI"] }
