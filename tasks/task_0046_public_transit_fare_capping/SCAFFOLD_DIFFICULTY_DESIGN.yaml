              captures: { t2: $.data.id }
          trigger:
            - call: "POST /taps/${t2}/settle"
              payload: {}
              as: PaymentGateway
              captures: { td2: $.data.transfer_discount_cents }
          assert:
            - "Tap.${t2}.transfer_discount_cents == 300 (inside the 120-min buffer measured from T1)"

      - name: fareweek_closed_calendar_containment_rejects_out_of_range_tap
        grounds:
          - validations[priority=8]
          - entities.FareWeek.fields.week_start_date
          - entities.Tap.fields.tapped_at
          - errors[ERR_TAP_WEEK_MISMATCH]
        distinguishing_aspect: |
          Interval semantics #2 (different geometry, different resource FareWeek) — a CLOSED 7-day calendar
          containment interval [week_start_date, week_start_date+6]: a tap whose fare day lies OUTSIDE the
          week's fixed bounds is rejected with ERR_TAP_WEEK_MISMATCH. This is fixed inclusive-both-ends
          containment, not a sliding buffer.
        test_recipe:
          setup:
            - "Clock 2026-06-08T12:00:00Z."
            - "FareProduct ZONE_X."
            - "Rider R15; FundingSource F15 loaded 100000."
            - "OPEN FareWeek W1 week_start 2026-06-01 (covers 2026-06-01..2026-06-07)."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_X", base_fare_cents: 300, daily_cap_cents: 500, weekly_cap_cents: 2500 }
              as: FareAdmin
              captures: { prod_x: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T12:00:00Z" }
              as: FareAdmin
            - call: "POST /riders"
              payload: { email: "r15@x.com", full_name: "R Fifteen", home_zone_code: "ZONE_X" }
              as: Anonymous
              captures: { r15: $.data.id }
            - call: "POST /funding-sources"
              payload: { rider_id: "${r15}", source_type: "APPLE_PAY" }
              as: Rider
              as_user_id: "${r15}"
              captures: { f15: $.data.id }
            - call: "POST /funding-sources/${f15}/load"
              payload: { amount_cents: 100000 }
              as: Rider
              as_user_id: "${r15}"
            - call: "POST /fare-weeks"
              payload: { rider_id: "${r15}", week_start_date: "2026-06-01", zone_code: "ZONE_X" }
              as: Rider
              as_user_id: "${r15}"
              captures: { w1: $.data.id }
          trigger:
            - call: "POST /taps"
              payload: { rider_id: "${r15}", fare_week_id: "${w1}", funding_source_id: "${f15}", tapped_at: "2026-06-08T09:00:00Z" }
              as: Rider
              as_user_id: "${r15}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TAP_WEEK_MISMATCH (422) — 2026-06-08 is outside [2026-06-01, 2026-06-07]"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reverse_conserves_rider_out_of_pocket_equals_week_charged_total
        grounds:
          - state_machines.Tap.CAPTURED_to_REVERSED
          - entities.FundingSource.fields.prepaid_balance_cents
          - entities.FareWeek.fields.charged_total_cents
        distinguishing_aspect: |
          Conserved quantity #1 — rider out-of-pocket, pinned as
          (initial_balance - current_balance) == FareWeek.charged_total_cents. Settle then reverse a tap and
          both sides return to 0: balance back to 100000, charged_total back to 0; no drift.
        test_recipe:
          setup:
            - "Clock 2026-06-01T12:00:00Z."
            - "FareProduct ZONE_X base 300, daily 500, weekly 2500."
            - "Rider R16; FundingSource F16 loaded 100000; OPEN FareWeek W1; CAPTURED tap T1 charged 300 (balance 99700, charged_total 300)."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_X", base_fare_cents: 300, daily_cap_cents: 500, weekly_cap_cents: 2500 }
              as: FareAdmin
              captures: { prod_x: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: FareAdmin
            - call: "POST /riders"
              payload: { email: "r16@x.com", full_name: "R Sixteen", home_zone_code: "ZONE_X" }
              as: Anonymous
              captures: { r16: $.data.id }
            - call: "POST /funding-sources"
              payload: { rider_id: "${r16}", source_type: "APPLE_PAY" }
              as: Rider
              as_user_id: "${r16}"
              captures: { f16: $.data.id }
            - call: "POST /funding-sources/${f16}/load"
              payload: { amount_cents: 100000 }
              as: Rider
              as_user_id: "${r16}"
            - call: "POST /fare-weeks"
              payload: { rider_id: "${r16}", week_start_date: "2026-06-01", zone_code: "ZONE_X" }
              as: Rider
              as_user_id: "${r16}"
              captures: { w1: $.data.id }
            - call: "POST /taps"
              payload: { rider_id: "${r16}", fare_week_id: "${w1}", funding_source_id: "${f16}", tapped_at: "2026-06-01T09:00:00Z" }
              as: Rider
              as_user_id: "${r16}"
              captures: { t1: $.data.id }
            - call: "POST /taps/${t1}/settle"
              payload: {}
              as: PaymentGateway
          trigger:
            - call: "POST /taps/${t1}/reverse"
              payload: {}
              as: FareAdmin
              captures: { st1: $.data.status }
          assert:
            - "FundingSource.${f16}.prepaid_balance_cents == 100000"
            - "FareWeek.${w1}.charged_total_cents == 0"
            - "Invariant holds: (100000 - prepaid_balance_cents) == charged_total_cents == 0 after compensation"

      - name: reverse_conserves_benefit_consumed_quantity
        grounds:
          - state_machines.Tap.CAPTURED_to_REVERSED
          - state_machines.BenefitAllocation.EXHAUSTED_to_ACTIVE
          - entities.BenefitAllocation.fields.consumed_cents
        distinguishing_aspect: |
          Conserved quantity #2 (different type — FSA benefit consumed cents, not rider cash) — pinned as
          BenefitAllocation.consumed_cents == sum(Tap.benefit_applied_cents over CAPTURED taps citing it).
          Reversing the only tap that consumed the allocation returns consumed_cents to 0 and restores status
          EXHAUSTED -> ACTIVE; no drift in the consumed quantity.
        test_recipe:
          setup:
            - "Clock 2026-06-01T12:00:00Z."
            - "FareProduct ZONE_X base 300, daily 5000, weekly 5000, transfer_discount_pct 0."
            - "Rider R17; FundingSource F17 loaded 100000; ACTIVE BenefitAllocation A17 period 2026-06 allocated 300."
            - "OPEN FareWeek W1; CAPTURED tap T1 09:00 consumed all 300 benefit -> A17 EXHAUSTED, consumed 300."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_X", base_fare_cents: 300, daily_cap_cents: 5000, weekly_cap_cents: 5000, transfer_discount_pct: 0 }
              as: FareAdmin
              captures: { prod_x: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: FareAdmin
            - call: "POST /riders"
              payload: { email: "r17@x.com", full_name: "R Seventeen", home_zone_code: "ZONE_X" }
              as: Anonymous
              captures: { r17: $.data.id, r17v: $.data.version }
            - call: "POST /funding-sources"
              payload: { rider_id: "${r17}", source_type: "APPLE_PAY" }
              as: Rider
              as_user_id: "${r17}"
              captures: { f17: $.data.id }
            - call: "POST /funding-sources/${f17}/load"
              payload: { amount_cents: 100000 }
              as: Rider
              as_user_id: "${r17}"
            - call: "POST /benefit-allocations"
              payload: { rider_id: "${r17}", employer_ref: "EMP17", period_month: "2026-06", allocated_cents: 300, expected_rider_version: "${r17v}" }
              as: EmployerAdmin
              captures: { a17: $.data.id }
            - call: "POST /fare-weeks"
              payload: { rider_id: "${r17}", week_start_date: "2026-06-01", zone_code: "ZONE_X" }
              as: Rider
              as_user_id: "${r17}"
              captures: { w1: $.data.id }
            - call: "POST /taps"
              payload: { rider_id: "${r17}", fare_week_id: "${w1}", funding_source_id: "${f17}", tapped_at: "2026-06-01T09:00:00Z" }
              as: Rider
              as_user_id: "${r17}"
              captures: { t1: $.data.id }
            - call: "POST /taps/${t1}/settle"
              payload: {}
              as: PaymentGateway
          trigger:
            - call: "POST /taps/${t1}/reverse"
              payload: {}
              as: FareAdmin
              captures: { st1: $.data.status }
          assert:
            - "BenefitAllocation.${a17}.consumed_cents == 0"
            - "BenefitAllocation.${a17}.status == ACTIVE (restored from EXHAUSTED)"
            - "Invariant holds: consumed_cents == sum of benefit_applied_cents over CAPTURED taps == 0"
