              payload: { code: "SM_HOME", name: "SM Home", fmr_year: 2026 }
              as: ProgramAdmin
              captures: { home: $.data.id }
            - call: "POST /regions"
              payload: { code: "SM_OPP", name: "SM Opp", fmr_year: 2026, is_special_mobility_area: true }
              as: ProgramAdmin
