            - { call: "POST /vendors", payload: { name: "ChandlerCo", categories: ["PROVISIONS"], contact_email: "sales@chandler.example" }, as: AgencyAdmin, captures: { v_id: "$.data.id" } }
          trigger:
            - { call: "POST /purchase-orders", payload: { port_call_id: "${pc_id}", vendor_id: "${v_id}", category: "PROVISIONS", estimated_cents: 20000, needed_by: "2026-06-01T09:00:00Z" }, as: AgencyOps, captures: { po_id: "$.data.id" } }
            - { call: "GET /disbursement-accounts/${da_id}/lines", as: AgencyOps, captures: { mirror: "$.data[1].id" } }
            - { call: "POST /purchase-orders/${po_id}/cancel", as: AgencyOps }
          assert:
            - "after create: DisbursementAccount.${da_id}.total_estimated_cents == 25625 and advance_required_cents == 20500 (lines 5000 + 20000, fee 125 + 500)"
            - "after cancel: total_estimated_cents == 5125 (exact baseline) and advance_required_cents == 4100"
            - "DALine.${mirror}.estimated_cents == 0 (reversal, retained row) and PurchaseOrder.${po_id}.status == CANCELLED"
