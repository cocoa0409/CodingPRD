# §1.9 Scaffold Corner Design — breadth probe for
# task_2624 Used Furniture Consignment Gallery & White-Glove Pickup.
#
# Walked row-by-row against references/claim-extraction-guide.md's nine sections
# and this scaffold's §1.1-§1.7. Corners already asserted by a
# SCAFFOLD_DIFFICULTY_DESIGN.yaml instance appear as `excluded_because:` stubs.
#
# Logical clock: every chain starts at 2026-08-01T00:00:00Z (the scaffold's
# declared default) and only ever moves forward via POST /_clock/set_current_utc.
#
# Standard prelude used by most chains (empty DB -> a piece on the floor):
#   POST /price-schedules -> 4x POST /price-schedule-steps -> POST /consignors
#   -> POST /consignment-agreements -> .../activate -> POST /consignment-items
#   -> .../screen -> POST /trucks -> POST /pickup-jobs -> .../complete
#   -> .../receive -> POST /floor-zones -> .../place
#
# Pinned opaque X-User-IDs: mgr-1, mgr-2 (GalleryManager); appraiser-1
# (IntakeAppraiser); floor-1, floor-2 (FloorOperator); logi-1, logi-2
# (LogisticsCoordinator); sysop-1 (SystemOperator); staff-7, staff-9 (one human
# acting under two roles, for the segregation-of-duties corners).
#
# §1.5 audit outcome of writing this file: three ambiguities in §1.2 were closed
# rather than papered over — the grade-distance rank ladder (A=4..REJECTED=0) on
# both POST /consignment-items/{id}/receive transitions, the explicit statement
# that a received REJECTED grade leaves list_price_cents null and is refused
# later at placement, and the priority 38/39 swap that made
# ERR_INSUFFICIENT_BALANCE reachable at all. No new endpoint was needed: every
# precondition below is reachable by composing the 67 endpoints §1.5 already
# declares (ladder rung 1).

scaffold_corner_design:
  # ==========================================================================
  # 1. ENTITIES
  # ==========================================================================
  - section: entities
    instances:
      - name: consignor_creation_returns_201_with_system_defaults
        claim_type: creation
        grounds:
          - entities.Consignor
          - endpoints[POST /consignors]
        distinguishing_aspect: "POST /consignors with the six declared input fields returns 201 and the response body carries status ACTIVE, escheat_state NONE, unclaimed_balance_cents 0, lifetime_credits_cents 0, last_activity_at equal to the logical clock 2026-08-01T00:00:00Z and version 1 — none of which the client supplied."
        test_recipe:
          setup:
            - "empty database; the logical clock is at its declared default 2026-08-01T00:00:00Z and is never moved"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop-1"
          trigger:
            - call: "POST /consignors"
              payload: { display_name: "Dana Reeve", email: "dana@example.com", address_line: "14 Mill St", floor_number: 3, has_elevator: false, payout_method: "CHECK" }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { cons_id: $.data.id }
          assert:
            - "HTTP 201"
            - "data.display_name == \"Dana Reeve\" and data.email == \"dana@example.com\" and data.address_line == \"14 Mill St\" and data.floor_number == 3 and data.has_elevator == false and data.payout_method == \"CHECK\""
            - "data.status == \"ACTIVE\" and data.escheat_state == \"NONE\""
            - "data.unclaimed_balance_cents == 0 and data.lifetime_credits_cents == 0"
            - "data.last_activity_at == \"2026-08-01T00:00:00Z\""
            - "data.version == 1 and data.id is a UUID with no type prefix"
            - "meta.api_request_id and meta.api_request_timestamp are present and response_type == \"object\""

      - name: consignor_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.Consignor
          - endpoints[GET /consignors/{id}]
        distinguishing_aspect: "GET /consignors/{id} returns exactly the row POST /consignors minted — same id, same version 1, same zero balances — with no mutation of updated_at."
        test_recipe:
          setup:
            - "one consignor Dana Reeve created at the default clock and never touched again"
          setup_api_calls:
            - call: "POST /consignors"
              payload: { display_name: "Dana Reeve", email: "dana@example.com", address_line: "14 Mill St", floor_number: 3, has_elevator: false }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { cons_id: $.data.id, cons_created: $.data.created_at }
          trigger:
            - call: "GET /consignors/${cons_id}"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-1"
          assert:
            - "HTTP 200"
            - "data.id == ${cons_id} and data.created_at == ${cons_created}"
            - "data.version == 1 and data.status == \"ACTIVE\" and data.unclaimed_balance_cents == 0"
            - "data.payout_method == \"ACH\" because the create call omitted it"

      - name: consignor_listing_is_paginated_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /consignors]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three consignors stored, GET /consignors?limit=2&offset=0 returns exactly 2 rows with total_count 3 and has_more true; the same call at offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "three consignors created in order: Alpha, Bravo, Charlie"
          setup_api_calls:
            - call: "POST /consignors"
              payload: { display_name: "Alpha", email: "alpha@example.com", address_line: "1 A St", floor_number: 1, has_elevator: false }
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /consignors"
              payload: { display_name: "Bravo", email: "bravo@example.com", address_line: "2 B St", floor_number: 1, has_elevator: false }
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /consignors"
              payload: { display_name: "Charlie", email: "charlie@example.com", address_line: "3 C St", floor_number: 1, has_elevator: false }
              as: GalleryManager
              as_user_id: "mgr-1"
          trigger:
            - call: "GET /consignors"
              payload: { limit: 2, offset: 0 }
              as: GalleryManager
              as_user_id: "mgr-1"
          assert:
            - "HTTP 200 and response_type == \"array\""
            - "data contains exactly 2 Consignor rows"
            - "total_count == 3 and has_more == true and limit == 2 and offset == 0"
            - "a follow-up GET /consignors with limit 2 and offset 2 returns 1 row with total_count == 3 and has_more == false"

      - name: reading_an_unknown_item_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_ITEM_NOT_FOUND]
          - validations[priority 4]
          - endpoints[GET /consignment-items/{id}]
        distinguishing_aspect: "A syntactically valid UUID that no ConsignmentItem row carries answers ERR_ITEM_NOT_FOUND with HTTP 404, not an empty 200 body and not ERR_VALIDATION."
        test_recipe:
          setup:
            - "one consignor exists so the database is not trivially empty, but no ConsignmentItem row has ever been created"
          setup_api_calls:
            - call: "POST /consignors"
              payload: { display_name: "Alpha", email: "alpha@example.com", address_line: "1 A St", floor_number: 1, has_elevator: false }
              as: GalleryManager
              as_user_id: "mgr-1"
          trigger:
            - call: "GET /consignment-items/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-1"
          assert:
            - "HTTP 404 and data.error_id == \"ERR_ITEM_NOT_FOUND\""
            - "response_type == \"error\""

      - name: item_creation_without_declared_value_cents_is_rejected
        claim_type: required_fields
        grounds:
          - entities.ConsignmentItem.declared_value_cents
          - validations[priority 6]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "declared_value_cents has source input and no default, so omitting it from POST /consignment-items answers ERR_VALIDATION with HTTP 400 and mints no ConsignmentItem row — the agreement's item_count stays 0."
        test_recipe:
          setup:
            - "a STD-2026 schedule with one step, consignor Alpha, and an ACTIVE agreement over it"
          setup_api_calls:
            - call: "POST /price-schedules"
              payload: { name: "STD-2026", unsold_trigger_day: 120, election_window_days: 14 }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { sched_id: $.data.id }
            - call: "POST /price-schedule-steps"
              payload: { schedule_id: "${sched_id}", sequence: 1, start_day_offset: 0, markdown_pct: 0.00, min_price_cents: 0 }
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /consignors"
              payload: { display_name: "Alpha", email: "alpha@example.com", address_line: "1 A St", floor_number: 1, has_elevator: false }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { cons_id: $.data.id }
            - call: "POST /consignment-agreements"
              payload: { consignor_id: "${cons_id}", price_schedule_id: "${sched_id}", term_days: 365 }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { agr_id: $.data.id }
            - call: "POST /consignment-agreements/${agr_id}/activate"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /consignment-items"
              payload: { agreement_id: "${agr_id}", title: "Walnut credenza", category: "CASEGOOD", photo_count: 4, volume_cuft: 12, footprint_sqft: 20 }
              as: IntakeAppraiser
              as_user_id: "appraiser-1"
          assert:
            - "HTTP 400 and data.error_id == \"ERR_VALIDATION\""
            - "GET /consignment-agreements/${agr_id} still reports item_count == 0"
            - "GET /consignment-items with agreement_id ${agr_id} returns total_count == 0"

      - name: omitting_payout_method_applies_the_ach_default
        claim_type: defaults
        grounds:
          - entities.Consignor.payout_method
          - endpoints[POST /consignors]
        distinguishing_aspect: "payout_method is the only §1.1 input field carrying a declared default, so omitting it yields ACH — and the ACH branch of calculations.payout_disbursement charges a 0-cent processing fee rather than CHECK's 250."
        test_recipe:
          setup:
            - "empty database at the default clock"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop-1"
          trigger:
            - call: "POST /consignors"
              payload: { display_name: "Alpha", email: "alpha@example.com", address_line: "1 A St", floor_number: 1, has_elevator: false }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { cons_id: $.data.id }
          assert:
            - "HTTP 201 and data.payout_method == \"ACH\""
            - "GET /consignors/${cons_id} also reports payout_method == \"ACH\""

      - name: pickup_job_item_count_and_volume_are_derived_from_the_attached_items
        claim_type: computed_fields
        grounds:
          - entities.PickupJob.item_count
          - entities.PickupJob.total_volume_cuft
          - entities.PickupJob.declared_stair_flights
          - entities.PickupJob.declared_elevator
          - endpoints[POST /pickup-jobs]
        distinguishing_aspect: "POST /pickup-jobs accepts neither item_count nor total_volume_cuft nor the access facts in its input; with two attached pieces of 20 and 13 cubic feet the response reports item_count 2, total_volume_cuft 33, declared_stair_flights 0 and declared_elevator false, all read off the ConsignmentItem and Consignor rows."
        test_recipe:
          setup:
            - "consignor Alpha at floor 1 without an elevator, so declared_stair_flights resolves to max(1-1,0) == 0"
            - "two screened CASEGOOD pieces under one ACTIVE agreement: Q1 declared 55001 at 20 cuft, Q2 declared 20004 at 13 cuft"
            - "truck BOX-1 with capacity 100 cuft"
          setup_api_calls:
            - call: "POST /price-schedules"
              payload: { name: "STD-2026", unsold_trigger_day: 120, election_window_days: 14 }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { sched_id: $.data.id }
            - call: "POST /price-schedule-steps"
              payload: { schedule_id: "${sched_id}", sequence: 1, start_day_offset: 0, markdown_pct: 0.00, min_price_cents: 0 }
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /consignors"
              payload: { display_name: "Alpha", email: "alpha@example.com", address_line: "1 A St", floor_number: 1, has_elevator: false }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { cons_id: $.data.id }
            - call: "POST /consignment-agreements"
              payload: { consignor_id: "${cons_id}", price_schedule_id: "${sched_id}", term_days: 365 }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { agr_id: $.data.id }
            - call: "POST /consignment-agreements/${agr_id}/activate"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /consignment-items"
              payload: { agreement_id: "${agr_id}", title: "Walnut credenza", category: "CASEGOOD", declared_value_cents: 55001, photo_count: 4, volume_cuft: 20, footprint_sqft: 18 }
              as: IntakeAppraiser
              as_user_id: "appraiser-1"
              captures: { q1_id: $.data.id }
            - call: "POST /consignment-items/${q1_id}/screen"
              payload: { decision: "ACCEPT", photo_surface_score: 8.0, photo_structure_score: 9.0, photo_completeness_score: 9.0 }
              as: IntakeAppraiser
              as_user_id: "appraiser-1"
            - call: "POST /consignment-items"
              payload: { agreement_id: "${agr_id}", title: "Oak nightstand", category: "CASEGOOD", declared_value_cents: 20004, photo_count: 4, volume_cuft: 13, footprint_sqft: 12 }
              as: IntakeAppraiser
              as_user_id: "appraiser-1"
              captures: { q2_id: $.data.id }
            - call: "POST /consignment-items/${q2_id}/screen"
              payload: { decision: "ACCEPT", photo_surface_score: 8.0, photo_structure_score: 9.0, photo_completeness_score: 9.0 }
              as: IntakeAppraiser
              as_user_id: "appraiser-1"
            - call: "POST /trucks"
              payload: { name: "BOX-1", capacity_volume_cuft: 100 }
              as: LogisticsCoordinator
              as_user_id: "logi-1"
              captures: { truck_id: $.data.id }
          trigger:
            - call: "POST /pickup-jobs"
              payload: { consignor_id: "${cons_id}", truck_id: "${truck_id}", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T12:00:00Z", crew_size: 2, item_ids: ["${q1_id}", "${q2_id}"] }
              as: LogisticsCoordinator
              as_user_id: "logi-1"
              captures: { job_id: $.data.id }
          assert:
            - "HTTP 201"
            - "data.item_count == 2 and data.total_volume_cuft == 33"
            - "data.declared_stair_flights == 0 and data.declared_elevator == false"
            - "data.quoted_surcharge_cents == 22000, i.e. 12000 + ceil(33/10)*2500 + 0 + 0 with the crew-2 multiplier 1.00, under the cap 26252"
            - "data.final_surcharge_cents is null and data.surcharge_variance_cents is null"
            - "data.status == \"SCHEDULED\" and data.scheduled_by_user_id == \"logi-1\""
            - "ConsignmentItem.${q1_id}.lifecycle_state == SCHEDULED_PICKUP and ConsignmentItem.${q1_id}.pickup_job_id == ${job_id}"

      - name: agreement_activation_stamps_only_server_minted_fields
        claim_type: system_fields
        grounds:
          - entities.ConsignmentAgreement.effective_at
          - entities.ConsignmentAgreement.expires_at
          - entities.ConsignmentAgreement.approved_by_user_id
          - endpoints[POST /consignment-agreements/{id}/activate]
        distinguishing_aspect: "POST /consignment-agreements/{id}/activate takes an empty body, yet effective_at becomes exactly the logical clock 2026-08-01T00:00:00Z, expires_at becomes effective_at + 365*86400 == 2027-08-01T00:00:00Z, and approved_by_user_id becomes the X-User-ID header value mgr-2 rather than the mgr-1 that drafted the agreement."
        test_recipe:
          setup:
            - "a STD-2026 schedule with one step, consignor Alpha, and a DRAFT agreement of term_days 365 drafted by mgr-1"
            - "the logical clock is left at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /price-schedules"
              payload: { name: "STD-2026", unsold_trigger_day: 120, election_window_days: 14 }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { sched_id: $.data.id }
            - call: "POST /price-schedule-steps"
              payload: { schedule_id: "${sched_id}", sequence: 1, start_day_offset: 0, markdown_pct: 0.00, min_price_cents: 0 }
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /consignors"
              payload: { display_name: "Alpha", email: "alpha@example.com", address_line: "1 A St", floor_number: 1, has_elevator: false }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { cons_id: $.data.id }
            - call: "POST /consignment-agreements"
              payload: { consignor_id: "${cons_id}", price_schedule_id: "${sched_id}", term_days: 365 }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { agr_id: $.data.id }
          trigger:
            - call: "POST /consignment-agreements/${agr_id}/activate"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-2"
          assert:
            - "HTTP 200 and data.status == \"ACTIVE\""
            - "data.effective_at == \"2026-08-01T00:00:00Z\""
            - "data.expires_at == \"2027-08-01T00:00:00Z\""
            - "data.approved_by_user_id == \"mgr-2\""
            - "data.version == 2 because activation is the agreement's first mutation after creation"
            - "data.id and data.created_at are unchanged from the create response"

      - name: item_category_outside_the_declared_enum_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.ConsignmentItem.category
          - validations[priority 6]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "category is constrained to {SOFA, DINING, CASEGOOD, RUG, ART, OUTDOOR}; the value ANTIQUE answers ERR_VALIDATION with HTTP 400 and no ConsignmentItem row is minted."
        test_recipe:
          setup:
            - "a STD-2026 schedule with one step, consignor Alpha, and an ACTIVE agreement"
          setup_api_calls:
            - call: "POST /price-schedules"
              payload: { name: "STD-2026", unsold_trigger_day: 120, election_window_days: 14 }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { sched_id: $.data.id }
            - call: "POST /price-schedule-steps"
              payload: { schedule_id: "${sched_id}", sequence: 1, start_day_offset: 0, markdown_pct: 0.00, min_price_cents: 0 }
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /consignors"
              payload: { display_name: "Alpha", email: "alpha@example.com", address_line: "1 A St", floor_number: 1, has_elevator: false }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { cons_id: $.data.id }
            - call: "POST /consignment-agreements"
              payload: { consignor_id: "${cons_id}", price_schedule_id: "${sched_id}", term_days: 365 }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { agr_id: $.data.id }
            - call: "POST /consignment-agreements/${agr_id}/activate"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /consignment-items"
              payload: { agreement_id: "${agr_id}", title: "Victorian sideboard", category: "ANTIQUE", declared_value_cents: 60000, photo_count: 4, volume_cuft: 12, footprint_sqft: 20 }
              as: IntakeAppraiser
              as_user_id: "appraiser-1"
          assert:
            - "HTTP 400 and data.error_id == \"ERR_VALIDATION\""
            - "GET /consignment-agreements/${agr_id} still reports item_count == 0"

      - name: crew_size_above_the_declared_ceiling_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.PickupJob.crew_size
          - validations[priority 6]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "crew_size is bounded 2 <= crew_size <= 6, so 7 answers ERR_VALIDATION with HTTP 400 before any surcharge is quoted and no PickupJob row is minted."
        test_recipe:
          setup:
            - "consignor Alpha at floor 1 without an elevator, one screened CASEGOOD piece of 12 cuft, and truck BOX-1 of capacity 100"
          setup_api_calls:
            - call: "POST /price-schedules"
              payload: { name: "STD-2026", unsold_trigger_day: 120, election_window_days: 14 }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { sched_id: $.data.id }
            - call: "POST /price-schedule-steps"
              payload: { schedule_id: "${sched_id}", sequence: 1, start_day_offset: 0, markdown_pct: 0.00, min_price_cents: 0 }
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /consignors"
              payload: { display_name: "Alpha", email: "alpha@example.com", address_line: "1 A St", floor_number: 1, has_elevator: false }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { cons_id: $.data.id }
            - call: "POST /consignment-agreements"
              payload: { consignor_id: "${cons_id}", price_schedule_id: "${sched_id}", term_days: 365 }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { agr_id: $.data.id }
            - call: "POST /consignment-agreements/${agr_id}/activate"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /consignment-items"
              payload: { agreement_id: "${agr_id}", title: "Walnut credenza", category: "CASEGOOD", declared_value_cents: 60000, photo_count: 4, volume_cuft: 12, footprint_sqft: 20 }
              as: IntakeAppraiser
              as_user_id: "appraiser-1"
              captures: { item_id: $.data.id }
            - call: "POST /consignment-items/${item_id}/screen"
              payload: { decision: "ACCEPT", photo_surface_score: 8.0, photo_structure_score: 9.0, photo_completeness_score: 9.0 }
              as: IntakeAppraiser
              as_user_id: "appraiser-1"
            - call: "POST /trucks"
              payload: { name: "BOX-1", capacity_volume_cuft: 100 }
              as: LogisticsCoordinator
              as_user_id: "logi-1"
              captures: { truck_id: $.data.id }
          trigger:
            - call: "POST /pickup-jobs"
              payload: { consignor_id: "${cons_id}", truck_id: "${truck_id}", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T12:00:00Z", crew_size: 7, item_ids: ["${item_id}"] }
              as: LogisticsCoordinator
              as_user_id: "logi-1"
          assert:
            - "HTTP 400 and data.error_id == \"ERR_VALIDATION\""
            - "GET /pickup-jobs with consignor_id ${cons_id} returns total_count == 0"
            - "ConsignmentItem.${item_id}.lifecycle_state is still SCREEN_ACCEPTED and pickup_job_id is still null"

      - name: payout_ledger_entries_carry_no_version_and_no_updated_at
        claim_type: immutability
        grounds:
          - entities.PayoutLedgerEntry
          - endpoints[GET /consignors/{id}/ledger-entries]
        distinguishing_aspect: "PayoutLedgerEntry declares common_fields false, so every row exposes only id and created_at from the common set — a version or updated_at key in the response would contradict §1.1, and §1.5 declares no PATCH or DELETE on any ledger path."
        test_recipe:
          setup:
            - "consignor Alpha at floor 1 without an elevator with one screened CASEGOOD piece of 12 cuft (declared 60000) collected on a completed 2-mover job, which mints exactly one PICKUP_SURCHARGE_DEBIT of -17000 (12000 + ceil(12/10)*2500 + 0, cap 21000 not binding)"
