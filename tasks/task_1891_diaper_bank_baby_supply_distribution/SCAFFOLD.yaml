# =============================================================================
# Task 1891 — Diaper Bank & Baby Supply Distribution (National Diaper Bank member)
# Scaffold seed tables (§1.0–§1.7). Difficulty design and corner design live in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml respectively.
# =============================================================================

scenario: |
  1891. Diaper Bank & Baby Supply Distribution (National Diaper Bank member): partner agency network & allocation formula, inventory intake (donation/purchase) & count by size, distribution event scheduling & client eligibility, size-mix forecasting vs donation mix, storage/warehouse volunteer shifts, wholesale purchasing & grant funding, client dignity & privacy policy, impact reporting to funders

domain_name: diaper-bank-distribution
api_prefix: /

complexity_profile:
  primary_archetype: quota_allocation        # finite per-size diaper pools reserved via monthly allocation runs, consumed at distribution events, released on suspend/finalize
  secondary_archetype: compliance_audit      # grant-restricted funds, segregation of duties on purchasing, client dignity/privacy gating, funder impact reporting
  complexity_layers:
    - optimistic_concurrency                 # OCC on Inventory.version for count adjustments
    - cascading_side_effects                 # event completion -> issuance -> inventory/allocation line -> run auto-finalize
    - derived_field_reconciliation           # per-size on_hand/reserved/available kept in lockstep with batches, issuances, adjustments
    - ops_run_checkpoint                     # monthly AllocationRun compute -> publish -> finalize advances the allocation epoch
  entity_topology: flat                      # peer entities joined by foreign keys; no nested URL ownership
  state_machine_shape: cyclic                # headline machines loop (intake recount cycle, household eligibility re-determination); event/run machines branch with revert
  relationship_patterns:
    - one_to_many                            # run -> lines, event -> issuances, grant -> purchase orders
    - cross_aggregate                        # issuance -> household, line -> agency, event -> agency
  role_model: segregation_of_duties          # PO creator (WarehouseManager) may not be PO submitter (FinanceManager); client data walled off to PrivacyOfficer
  consistency_model: immediate               # every mutation is atomically visible in its response
  difficulty_note: >
    Endpoint count exceeds the Expert guideline deliberately: the scenario names eight
    operational pillars (agency network, intake, events, forecasting, volunteer shifts,
    purchasing/grants, privacy, reporting) and each is load-bearing for at least one
    Difficulty Rule. Difficulty comes from coupling (allocation reservation vs fulfillment
    vs release sharing one per-size pool), not from CRUD volume.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
# Diaper size enum used across entities:
#   SIZE_CODE ∈ { NEWBORN, SIZE_1, SIZE_2, SIZE_3, SIZE_4, SIZE_5, SIZE_6, TRAINING_PANTS }
entities:
  - name: PartnerAgency
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Agency display name" }
      - { name: agency_code, type: string, source: input, description: "Unique short code; duplicates rejected with ERR_DUPLICATE_CODE" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: children_served_monthly, type: integer, source: input, description: "Children served per month; allocation weight input (>= 0)" }
      - { name: storage_capacity_units, type: integer, source: input, description: "Total on-site storage in diaper units; allocation cap input (>= 0)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE }
      - { name: active_allocated_units, type: integer, source: computed, description: "Sum of (allocated_units - fulfilled_units) over this agency's AllocationLines with status IN {ALLOCATED, PARTIALLY_FULFILLED}" }

  - name: Grant
    parent: null
    common_fields: true
    fields:
      - { name: funder_name, type: string, source: input, description: "Funder display name" }
      - { name: grant_code, type: string, source: input, description: "Unique grant code; duplicates rejected with ERR_DUPLICATE_CODE" }
      - { name: total_amount_cents, type: integer, source: input, description: "Awarded amount in cents (> 0)" }
      - { name: restriction, type: enum, source: input, description: "UNRESTRICTED | PRODUCT_PURCHASE_ONLY | OPERATIONS_ONLY", default: UNRESTRICTED }
      - { name: start_date, type: datetime, source: input, description: "Grant window start (UTC)" }
      - { name: end_date, type: datetime, source: input, description: "Grant window end (UTC)" }
      - { name: committed_cents, type: integer, source: computed, description: "Sum of total_cost_cents over PurchaseOrders with status SUBMITTED referencing this grant" }
      - { name: spent_cents, type: integer, source: computed, description: "Sum of total_cost_cents over PurchaseOrders with status RECEIVED referencing this grant" }
      - { name: available_cents, type: integer, source: computed, description: "total_amount_cents - committed_cents - spent_cents" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSED | EXHAUSTED (auto when spent_cents >= total_amount_cents on receive)" }

  - name: Inventory
    parent: null
    common_fields: true
    fields:
      - { name: sizes, type: object, source: computed, description: "Map of every SIZE_CODE to { on_hand_units, reserved_units, reorder_threshold_units, available_units, restock_needed }; available_units = on_hand_units - reserved_units; restock_needed = on_hand_units <= reorder_threshold_units" }
      - { name: initialized, type: boolean, source: system, description: "True after POST /inventory/initialize; singleton created exactly once" }
      - { name: total_on_hand_units, type: integer, source: computed, description: "Sum of on_hand_units across all sizes" }

  - name: IntakeBatch
    parent: null
    common_fields: true
    fields:
      - { name: source_type, type: enum, source: system, description: "DONATION (via POST /intake-batches) | PURCHASE (created by PO receive)" }
      - { name: donor_name, type: string, source: input, description: "Donor display name; required for DONATION batches, null for PURCHASE" }
      - { name: purchase_order_id, type: string, source: system, description: "FK -> PurchaseOrder.id; set only for PURCHASE batches, null otherwise; nullable" }
      - { name: lines, type: array, source: input, description: "Array of { size_code, quantity }; quantity integer >= 1; for PURCHASE batches set from PO receive received_lines" }
      - { name: total_units, type: integer, source: computed, description: "Sum of quantity over lines" }
      - { name: valued_total_cents, type: integer, source: computed, description: "Valuation per intake_valuation calculation: DONATION uses FAIR_MARKET_CENTS per size, PURCHASE uses the PO line unit_cost_cents" }
      - { name: status, type: enum, source: system, description: "COUNTED | POSTED | VOIDED" }
      - { name: posted_at, type: datetime, source: system, description: "Logical-clock timestamp of most recent COUNTED -> POSTED transition; null until first post" }

  - name: PurchaseOrder
    parent: null
    common_fields: true
    fields:
      - { name: grant_id, type: string, source: input, description: "FK -> Grant.id; funding source for this purchase" }
      - { name: vendor_name, type: string, source: input, description: "Wholesale vendor name" }
      - { name: lines, type: array, source: input, description: "Array of { size_code, quantity, unit_cost_cents }; quantity >= 1, unit_cost_cents >= 0" }
      - { name: discount_pct, type: number, source: input, description: "Vendor nonprofit discount fraction applied per line (0 <= x < 1)", default: 0 }
      - { name: total_cost_cents, type: integer, source: computed, description: "purchase_order_total: per-line round_half_up(quantity * unit_cost_cents * (1 - discount_pct)) then summed" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | RECEIVED | CANCELLED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creating WarehouseManager (segregation-of-duties reference)" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the submitting FinanceManager; null until submitted" }
      - { name: received_intake_batch_id, type: string, source: system, description: "FK -> IntakeBatch.id of the POSTED batch created on receive; null until received; nullable" }

  - name: AllocationRun
    parent: null
    common_fields: true
    fields:
      - { name: period, type: string, source: input, description: "Calendar month 'YYYY-MM'; unique across all runs (ERR_DUPLICATE_PERIOD); must be >= the logical clock's current month (ERR_PERIOD_IN_PAST)" }
      - { name: formula_variant, type: enum, source: input, description: "NEED_WEIGHTED | EQUAL_SPLIT; selects monthly_allocation_formula variant", default: NEED_WEIGHTED }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | FINALIZED" }
      - { name: computed_at, type: datetime, source: system, description: "Logical-clock timestamp of last compute; null until first compute (publish requires non-null -> ERR_RUN_NOT_COMPUTED)" }
      - { name: total_allocated_units, type: integer, source: computed, description: "Sum of allocated_units over all lines" }
      - { name: published_at, type: datetime, source: system, description: "Logical-clock timestamp of DRAFT -> PUBLISHED; null until published" }

  - name: AllocationLine
    parent: null
    common_fields: true
    fields:
      - { name: allocation_run_id, type: string, source: system, description: "FK -> AllocationRun.id; owning run" }
      - { name: agency_id, type: string, source: computed, description: "FK -> PartnerAgency.id; line recipient (eligible agencies at compute time)" }
      - { name: size_code, type: enum, source: computed, description: "SIZE_CODE this line allocates" }
      - { name: allocated_units, type: integer, source: computed, description: "Units granted by monthly_allocation_formula at compute time" }
      - { name: fulfilled_units, type: integer, source: computed, description: "Units consumed by FULFILLED issuances at events hosted by this agency in the run's period", default: 0 }
      - { name: released_units, type: integer, source: computed, description: "allocated_units - fulfilled_units at the moment of RELEASED transition; 0 otherwise", default: 0 }
      - { name: status, type: enum, source: system, description: "PROJECTED | ALLOCATED | PARTIALLY_FULFILLED | FULFILLED | RELEASED" }

  - name: DistributionEvent
    parent: null
    common_fields: true
    fields:
      - { name: host_agency_id, type: string, source: input, description: "FK -> PartnerAgency.id; hosting agency" }
      - { name: site_name, type: string, source: input, description: "Distribution site; half-open interval overlap scope" }
      - { name: starts_at, type: datetime, source: input, description: "Event window start (UTC); must be < ends_at" }
      - { name: ends_at, type: datetime, source: input, description: "Event window end (UTC)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | LOCKED | COMPLETED | CANCELLED" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp of completion; null until COMPLETED" }
      - { name: issued_total_units, type: integer, source: computed, description: "Sum of total_units over this event's issuances with status FULFILLED", default: 0 }

  - name: Issuance
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> DistributionEvent.id; event at which supplies were recorded" }
      - { name: household_id, type: string, source: input, description: "FK -> ClientHousehold.id; recipient household (pseudonymous)" }
      - { name: lines, type: array, source: input, description: "Array of { size_code, quantity }; quantity integer >= 1" }
      - { name: total_units, type: integer, source: computed, description: "Sum of quantity over lines" }
      - { name: status, type: enum, source: system, description: "RECORDED | FULFILLED | VOIDED" }
      - { name: fulfilled_at, type: datetime, source: system, description: "Logical-clock timestamp of RECORDED -> FULFILLED (event completion); null until fulfilled" }
      - { name: recorded_by_role, type: string, source: system, description: "X-User-Role that recorded the issuance (privacy audit trail)" }

  - name: ClientHousehold
    parent: null
    common_fields: true
    fields:
      - { name: household_code, type: string, source: input, description: "Pseudonymous unique code (dignity policy: NO names/addresses stored); duplicates rejected with ERR_DUPLICATE_CODE" }
      - { name: children_sizes, type: array, source: input, description: "One SIZE_CODE per child in diapers; 1..8 entries; drives monthly allotment" }
      - { name: consent_on_file, type: boolean, source: input, description: "Signed service consent on file; required for ELIGIBLE", default: false }
      - { name: privacy_restricted, type: boolean, source: input, description: "Dignity flag: when true only PrivacyOfficer may record issuances for this household", default: false }
      - { name: eligibility_status, type: enum, source: system, description: "PENDING_REVIEW | ELIGIBLE | INELIGIBLE" }
      - { name: eligibility_reason, type: string, source: input, description: "Free-text reason recorded with latest eligibility decision; nullable", default: null }
      - { name: monthly_allotment_units, type: integer, source: computed, description: "UNITS_PER_CHILD_PER_MONTH (50) * len(children_sizes)" }
      - { name: consumed_this_month_units, type: integer, source: computed, description: "Per household_monthly_allotment: fulfilled-this-month + recorded-open quantities" }

  - name: VolunteerShift
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Shift label (e.g. 'Warehouse sorting')" }
      - { name: starts_at, type: datetime, source: input, description: "Shift start (UTC); must be < ends_at" }
      - { name: ends_at, type: datetime, source: input, description: "Shift end (UTC)" }
      - { name: capacity, type: integer, source: input, description: "Max volunteers (>= 1)" }
      - { name: signups, type: array, source: system, description: "Array of { volunteer_email, volunteer_name, signed_up_at }; append on signup, remove on withdraw" }
      - { name: signup_count, type: integer, source: computed, description: "len(signups)" }
      - { name: status, type: enum, source: computed, description: "OPEN | FULL — FULL exactly when signup_count == capacity; auto-derived on every signup/withdraw" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PartnerAgency
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /partner-agencies/{id}/suspend"
        actor: BankAdmin
        preconditions:
          - "agency.status == ACTIVE"
        side_effects:
          - "Every AllocationLine with agency_id == this agency AND status IN {ALLOCATED, PARTIALLY_FULFILLED} transitions to RELEASED with released_units = allocated_units - fulfilled_units"
          - "For each released line: Inventory.sizes[line.size_code].reserved_units -= line.released_units (stock returns to the available pool)"
          - "Recompute agency.active_allocated_units (becomes 0)"
          - "Increments PartnerAgency.version by 1"

  - entity: Grant
    initial_state: ACTIVE
    terminal_states: [CLOSED, EXHAUSTED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /grants/{id}/close"
        actor: FinanceManager
        preconditions:
          - "grant.status == ACTIVE"
          - "No PurchaseOrder with grant_id == this grant has status SUBMITTED (else ERR_GRANT_HAS_OPEN_POS)"
        side_effects:
          - "Increments Grant.version by 1"
        note: "DRAFT PurchaseOrders referencing the grant are left in place; they can never submit afterwards (ERR_GRANT_NOT_ACTIVE)."
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system: automatic on PurchaseOrder receive when grant.spent_cents >= grant.total_amount_cents after crediting"
        actor: system
        preconditions:
          - "grant.status == ACTIVE"
          - "spent_cents (after adding the received PO total) >= total_amount_cents"
        side_effects:
          - "Increments Grant.version by 1"

  - entity: Inventory
    initial_state: initialized
    terminal_states: []
    transitions: []
    note: "Inventory is a singleton with no lifecycle states; all mutation happens via intake post/void/recount, adjustments, allocation publish/retract/finalize, and issuance fulfillment. Every such mutation increments Inventory.version by 1."

  - entity: IntakeBatch
    initial_state: COUNTED
    terminal_states: [VOIDED]
    transitions:
      - from: COUNTED
        to: POSTED
        trigger: "POST /intake-batches/{id}/post"
        actor: WarehouseManager
        preconditions:
          - "batch.status == COUNTED (else ERR_INVALID_BATCH_STATE)"
        side_effects:
          - "For each line: Inventory.sizes[line.size_code].on_hand_units += line.quantity"
          - "batch.posted_at = current logical clock"
          - "Increments IntakeBatch.version by 1 and Inventory.version by 1"
      - from: POSTED
        to: COUNTED
        trigger: "POST /intake-batches/{id}/recount"
        actor: WarehouseManager
        preconditions:
          - "batch.status == POSTED (else ERR_INVALID_BATCH_STATE)"
          - "For each current line: Inventory.sizes[size].on_hand_units - line.quantity >= 0 (else ERR_INSUFFICIENT_STOCK)"
        side_effects:
          - "For each current (old) line: Inventory.sizes[size].on_hand_units -= line.quantity (batch contribution withdrawn pending recount)"
          - "batch.lines replaced by request lines; total_units and valued_total_cents recomputed"
          - "Increments IntakeBatch.version by 1 and Inventory.version by 1"
        note: "Cycle COUNTED -> POSTED -> COUNTED -> POSTED; the recount-then-repost round trip is a compensating pair for on_hand."
      - from: COUNTED
        to: VOIDED
        trigger: "POST /intake-batches/{id}/void"
        actor: WarehouseManager
        preconditions:
          - "batch.status == COUNTED (else ERR_INVALID_BATCH_STATE)"
        side_effects:
          - "No inventory effect (batch was never posted)"
          - "Increments IntakeBatch.version by 1"
      - from: POSTED
        to: VOIDED
        trigger: "POST /intake-batches/{id}/void"
        actor: WarehouseManager
        preconditions:
          - "batch.status == POSTED (else ERR_INVALID_BATCH_STATE)"
          - "For each line: Inventory.sizes[size].on_hand_units - line.quantity >= 0 (else ERR_INSUFFICIENT_STOCK)"
        side_effects:
          - "For each line: Inventory.sizes[size].on_hand_units -= line.quantity (exact reversal of the post transition)"
          - "Increments IntakeBatch.version by 1 and Inventory.version by 1"

  - entity: PurchaseOrder
    initial_state: DRAFT
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /purchase-orders/{id}/submit"
        actor: FinanceManager
        preconditions:
          - "po.status == DRAFT (else ERR_PO_NOT_SUBMITTABLE)"
          - "X-User-ID != po.created_by_user_id (segregation of duties, else ERR_SOD_VIOLATION)"
          - "grant.status == ACTIVE (else ERR_GRANT_NOT_ACTIVE)"
          - "grant.restriction != OPERATIONS_ONLY (else ERR_GRANT_RESTRICTION_VIOLATION)"
          - "po.total_cost_cents <= grant.available_cents (else ERR_GRANT_BUDGET_EXCEEDED)"
        side_effects:
          - "grant.committed_cents += po.total_cost_cents; grant.available_cents recomputed"
          - "po.submitted_by_user_id = X-User-ID"
          - "Increments PurchaseOrder.version by 1 and Grant.version by 1"
      - from: SUBMITTED
        to: RECEIVED
        trigger: "POST /purchase-orders/{id}/receive"
        actor: WarehouseManager
        preconditions:
          - "po.status == SUBMITTED (else ERR_PO_NOT_RECEIVABLE)"
          - "grant.status == ACTIVE (else ERR_GRANT_NOT_ACTIVE)"
          - "received_lines sizes are exactly the set of sizes in po.lines (else ERR_VALIDATION)"
        side_effects:
          - "grant.committed_cents -= po.total_cost_cents; grant.spent_cents += po.total_cost_cents; available_cents recomputed"
          - "Create IntakeBatch(source_type=PURCHASE, purchase_order_id=po.id, lines=received_lines) directly in POSTED status; for each received line Inventory.sizes[size].on_hand_units += quantity"
          - "po.received_intake_batch_id = new batch id"
          - "If grant.spent_cents >= grant.total_amount_cents: grant auto-transitions ACTIVE -> EXHAUSTED"
          - "Increments PurchaseOrder.version by 1, Grant.version by 1, Inventory.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /purchase-orders/{id}/cancel"
        actor: WarehouseManager
        preconditions:
          - "po.status == DRAFT (WarehouseManager may only cancel DRAFT; else ERR_PO_NOT_SUBMITTABLE for role WarehouseManager)"
        side_effects:
          - "No fund movement (nothing committed)"
          - "Increments PurchaseOrder.version by 1"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /purchase-orders/{id}/cancel"
        actor: FinanceManager
        preconditions:
          - "po.status == SUBMITTED (else ERR_PO_NOT_SUBMITTABLE)"
        side_effects:
          - "grant.committed_cents -= po.total_cost_cents (exact reversal of submit); available_cents recomputed"
          - "Increments PurchaseOrder.version by 1 and Grant.version by 1"

  - entity: AllocationRun
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /allocation-runs/{id}/publish"
        actor: BankAdmin
        preconditions:
          - "run.status == DRAFT (else ERR_RUN_NOT_DRAFT)"
          - "run.computed_at != null (else ERR_RUN_NOT_COMPUTED)"
          - "For each size: sum of allocated_units over this run's lines for the size <= Inventory.sizes[size].on_hand_units (else ERR_INSUFFICIENT_STOCK)"
        side_effects:
          - "Every PROJECTED line transitions to ALLOCATED"
          - "For each size: Inventory.sizes[size].reserved_units += sum of the run's allocated_units for that size"
          - "run.published_at = current logical clock"
          - "Increments AllocationRun.version by 1 and Inventory.version by 1"
      - from: PUBLISHED
        to: DRAFT
        trigger: "POST /allocation-runs/{id}/retract"
        actor: BankAdmin
        preconditions:
          - "run.status == PUBLISHED (else ERR_RUN_NOT_PUBLISHED)"
          - "No line has fulfilled_units > 0 (else ERR_RUN_NOT_PUBLISHED — a run with consumption cannot be retracted)"
        side_effects:
          - "Every ALLOCATED line transitions back to PROJECTED"
          - "For each size: Inventory.sizes[size].reserved_units -= sum of the run's allocated_units for that size (exact reversal of publish)"
          - "run.published_at = null"
          - "Increments AllocationRun.version by 1 and Inventory.version by 1"
      - from: PUBLISHED
        to: FINALIZED
        trigger: "POST /allocation-runs/{id}/finalize"
        actor: BankAdmin
        preconditions:
          - "run.status == PUBLISHED (else ERR_RUN_NOT_PUBLISHED)"
        side_effects:
          - "Every line with status IN {ALLOCATED, PARTIALLY_FULFILLED} transitions to RELEASED with released_units = allocated_units - fulfilled_units"
          - "For each released line: Inventory.sizes[line.size_code].reserved_units -= line.released_units"
          - "Lines with status FULFILLED are unchanged"
          - "Increments AllocationRun.version by 1 and Inventory.version by 1"
      - from: PUBLISHED
        to: FINALIZED
        trigger: "system: automatic when every line of the run reaches status FULFILLED"
        actor: system
        preconditions:
          - "run.status == PUBLISHED"
          - "All lines have status FULFILLED"
        side_effects:
          - "No reservation release (all reserved units were consumed by fulfillment)"
          - "Increments AllocationRun.version by 1"
        note: "Terminal hop of the event-completion cascade: event complete -> issuance FULFILLED -> line status recompute -> run auto-finalize."

  - entity: AllocationLine
    initial_state: PROJECTED
    terminal_states: [FULFILLED, RELEASED]
    transitions:
      - from: PROJECTED
        to: ALLOCATED
        trigger: "system: owning run publish"
        actor: system
        preconditions: ["run transitions DRAFT -> PUBLISHED"]
        side_effects: ["Reservation applied at run level (see AllocationRun publish)"]
      - from: ALLOCATED
        to: PARTIALLY_FULFILLED
        trigger: "system: issuance fulfillment at a hosted distribution event"
        actor: system
        preconditions:
          - "0 < fulfilled_units < allocated_units after crediting a fulfilled issuance"
        side_effects: ["Increments AllocationLine.version by 1"]
      - from: PARTIALLY_FULFILLED
        to: FULFILLED
        trigger: "system: issuance fulfillment"
        actor: system
        preconditions:
          - "fulfilled_units == allocated_units after crediting (boundary: equality flips to FULFILLED)"
        side_effects:
          - "If all sibling lines of the run are now FULFILLED: run auto-transitions PUBLISHED -> FINALIZED"
          - "Increments AllocationLine.version by 1"
      - from: ALLOCATED
        to: FULFILLED
        trigger: "system: issuance fulfillment"
        actor: system
        preconditions:
          - "fulfilled_units jumps from 0 to allocated_units in one crediting"
        side_effects:
          - "If all sibling lines of the run are now FULFILLED: run auto-transitions PUBLISHED -> FINALIZED"
          - "Increments AllocationLine.version by 1"
      - from: ALLOCATED
        to: RELEASED
        trigger: "system: agency suspension, run finalize, or run retract"
        actor: system
        preconditions: ["line has unfulfilled remainder (allocated_units - fulfilled_units >= 0)"]
        side_effects: ["released_units = allocated_units - fulfilled_units; reserved_units decremented at Inventory"]
      - from: PARTIALLY_FULFILLED
        to: RELEASED
        trigger: "system: agency suspension or run finalize"
        actor: system
        preconditions: ["allocated_units - fulfilled_units > 0"]
        side_effects: ["released_units = allocated_units - fulfilled_units; reserved_units decremented at Inventory"]
      - from: ALLOCATED
        to: PROJECTED
        trigger: "system: run retract"
        actor: system
        preconditions: ["fulfilled_units == 0"]
        side_effects: ["Reservation released at run level"]

  - entity: DistributionEvent
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /distribution-events/{id}/open"
        actor: BankAdmin | AgencyCoordinator (own agency only)
        preconditions:
          - "event.status == SCHEDULED (else ERR_INVALID_EVENT_STATE)"
          - "host agency.status == ACTIVE (else ERR_AGENCY_NOT_ACTIVE)"
          - "current logical clock < event.ends_at (else ERR_EVENT_ALREADY_ENDED)"
        side_effects: ["Increments DistributionEvent.version by 1"]
      - from: OPEN
        to: LOCKED
        trigger: "POST /distribution-events/{id}/lock"
        actor: BankAdmin | AgencyCoordinator (own agency only)
        preconditions: ["event.status == OPEN (else ERR_INVALID_EVENT_STATE)"]
        side_effects: ["Increments DistributionEvent.version by 1"]
      - from: LOCKED
        to: OPEN
        trigger: "POST /distribution-events/{id}/unlock"
        actor: BankAdmin | AgencyCoordinator (own agency only)
        preconditions: ["event.status == LOCKED (else ERR_INVALID_EVENT_STATE)"]
        side_effects: ["Increments DistributionEvent.version by 1"]
        note: "Revert branch: OPEN -> LOCKED -> OPEN is legal; issuances may be recorded only while OPEN."
      - from: LOCKED
        to: COMPLETED
        trigger: "POST /distribution-events/{id}/complete"
        actor: BankAdmin | AgencyCoordinator (own agency only)
        preconditions: ["event.status == LOCKED (else ERR_INVALID_EVENT_STATE)"]
        side_effects:
          - "Every RECORDED issuance of this event transitions to FULFILLED with fulfilled_at = current logical clock (hop 1)"
          - "Per fulfilled issuance line: Inventory.sizes[size].on_hand_units -= quantity AND Inventory.sizes[size].reserved_units -= quantity (hop 2a — reservation consumed, so available_units is unchanged by fulfillment)"
          - "Per fulfilled issuance line: the AllocationLine selected by (run.period == calendar month of logical clock, run.status == PUBLISHED, agency_id == event.host_agency_id, size_code == line size) has fulfilled_units += quantity and its status recomputed (hop 2b)"
          - "A line reaching fulfilled_units == allocated_units flips to FULFILLED; when all lines of the run are FULFILLED the run auto-transitions PUBLISHED -> FINALIZED (hop 3)"
          - "event.completed_at = current logical clock; event.issued_total_units recomputed"
          - "Increments DistributionEvent.version by 1, Inventory.version by 1, and each touched AllocationLine.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /distribution-events/{id}/cancel"
        actor: BankAdmin | AgencyCoordinator (own agency only)
        preconditions: ["event.status == SCHEDULED (else ERR_INVALID_EVENT_STATE)"]
        side_effects: ["Increments DistributionEvent.version by 1"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /distribution-events/{id}/cancel"
        actor: BankAdmin | AgencyCoordinator (own agency only)
        preconditions: ["event.status == OPEN (else ERR_INVALID_EVENT_STATE)"]
        side_effects:
          - "Every RECORDED issuance of this event transitions to VOIDED (no inventory effect — stock moves only on fulfillment)"
          - "Increments DistributionEvent.version by 1"
        note: "LOCKED events cannot be cancelled directly; unlock first."

  - entity: Issuance
    initial_state: RECORDED
    terminal_states: [FULFILLED, VOIDED]
    transitions:
      - from: RECORDED
        to: FULFILLED
        trigger: "system: owning event completion"
        actor: system
        preconditions: ["event transitions LOCKED -> COMPLETED"]
        side_effects: ["See DistributionEvent complete cascade (inventory debit, allocation line credit)"]
      - from: RECORDED
        to: VOIDED
        trigger: "POST /issuances/{id}/void or system: owning event cancellation"
        actor: AgencyCoordinator (own event) | PrivacyOfficer | system
        preconditions:
          - "issuance.status == RECORDED (else ERR_INVALID_STATE)"
          - "For manual void: owning event.status IN {OPEN, LOCKED} (else ERR_INVALID_EVENT_STATE)"
        side_effects: ["Increments Issuance.version by 1; household consumed_this_month_units recomputed"]

  - entity: ClientHousehold
    initial_state: PENDING_REVIEW
    terminal_states: []
    transitions:
      - from: PENDING_REVIEW
        to: ELIGIBLE
        trigger: "PATCH /households/{id} with eligibility_status=ELIGIBLE"
        actor: PrivacyOfficer
        preconditions:
          - "eligibility_status == PENDING_REVIEW or INELIGIBLE (else ERR_INVALID_HOUSEHOLD_STATE)"
          - "consent_on_file == true (else ERR_CONSENT_REQUIRED)"
        side_effects: ["eligibility_reason stored from request; Increments ClientHousehold.version by 1"]
      - from: PENDING_REVIEW
        to: INELIGIBLE
        trigger: "PATCH /households/{id} with eligibility_status=INELIGIBLE"
        actor: PrivacyOfficer
        preconditions: ["eligibility_status == PENDING_REVIEW or ELIGIBLE (else ERR_INVALID_HOUSEHOLD_STATE)"]
        side_effects: ["eligibility_reason stored; Increments ClientHousehold.version by 1"]
      - from: ELIGIBLE
        to: INELIGIBLE
        trigger: "PATCH /households/{id} with eligibility_status=INELIGIBLE"
        actor: PrivacyOfficer
        preconditions: ["eligibility_status == ELIGIBLE (else ERR_INVALID_HOUSEHOLD_STATE)"]
        side_effects: ["Increments ClientHousehold.version by 1"]
      - from: INELIGIBLE
        to: ELIGIBLE
        trigger: "PATCH /households/{id} with eligibility_status=ELIGIBLE"
        actor: PrivacyOfficer
        preconditions:
          - "eligibility_status == INELIGIBLE (else ERR_INVALID_HOUSEHOLD_STATE)"
          - "consent_on_file == true (else ERR_CONSENT_REQUIRED)"
        side_effects: ["Increments ClientHousehold.version by 1"]
        note: "Cyclic re-determination: ELIGIBLE <-> INELIGIBLE loops are legal."

  - entity: VolunteerShift
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system: automatic on signup when signup_count reaches capacity (boundary: equality fills)"
        actor: system
        preconditions: ["signup_count == capacity after append"]
        side_effects: ["Increments VolunteerShift.version by 1"]
      - from: FULL
        to: OPEN
        trigger: "system: automatic on withdraw when signup_count drops below capacity"
        actor: system
        preconditions: ["signup_count == capacity - 1 after removal"]
        side_effects: ["Increments VolunteerShift.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: inventory-adjustment-stale-version
    parent_entity: Inventory
    write_endpoint: "POST /inventory/adjustments"
    occ_field: "expected_inventory_version"
    description: |
      Recording a physical count correction against an Inventory whose version has
      advanced since the client last observed it is rejected. The adjustment carries
      an absolute new_on_hand_units computed from the client's last observed stock
      state; when another write (post, void, recount, fulfillment, publish) has moved
      the inventory since, that absolute value is stale and must be recomputed from a
      fresh read. Stated in OCC terms: expected_inventory_version must equal the
      current Inventory.version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: monthly_allocation_formula
    trigger: "POST /allocation-runs/{id}/compute"
    algorithm: waterfall_allocation
    formula: |
      eligible = [agencies with status == ACTIVE], sorted by
                 children_served_monthly DESC, tie-break created_at ASC
      for each size_code present in Inventory.sizes:
        pool = Inventory.sizes[size_code].available_units   # on_hand - reserved, at compute time
        total_children = sum(children_served_monthly over eligible)
        remaining = pool
        for agency in eligible (sorted order):
          if variant == NEED_WEIGHTED:
            raw = 0 if total_children == 0 else floor(pool * agency.children_served_monthly / total_children)
          if variant == EQUAL_SPLIT:
            raw = 0 if len(eligible) == 0 else floor(pool / len(eligible))
          if agency.children_served_monthly > 0 and raw < BASE_FLOOR_UNITS and remaining >= BASE_FLOOR_UNITS:
            raw = BASE_FLOOR_UNITS                          # dignity floor
          cap = floor(agency.storage_capacity_units * CAPACITY_CAP_FRACTION)
          grant = min(raw, cap, remaining)
          if grant > 0:
            upsert AllocationLine(run, agency, size_code, allocated_units = grant, status = PROJECTED)
          remaining -= grant
      Zero-grant (agency, size) pairs produce NO line. Lines from any previous
      compute of this run are replaced wholesale (recompute is idempotent and
      never duplicates lines).
    input_set: "PartnerAgency rows with status == ACTIVE only; Inventory available_units at compute time; lines with any prior status in this run are discarded and recomputed"
    constants:
      BASE_FLOOR_UNITS: 100
      CAPACITY_CAP_FRACTION: 0.5
    precision: "integer units; floor for division"
    variants:
      - name: NEED_WEIGHTED
        when: "run.formula_variant == NEED_WEIGHTED (default)"
        difference: "raw share proportional to children_served_monthly"
      - name: EQUAL_SPLIT
        when: "run.formula_variant == EQUAL_SPLIT"
        difference: "raw share is pool / eligible-count; same floor, cap, and waterfall order — different allocated_units for identical inputs"

  - name: size_mix_forecast
    trigger: "GET /inventory/forecast"
    algorithm: forward_looking
    formula: |
      variant TRAILING_ACTUAL (default):
        window = [now - 28 days, now], inclusive both ends, over Issuance.fulfilled_at
        weekly_rate(size) = (sum of quantities of FULFILLED issuance lines for size in window) / 4
        forecast_4wk_units(size) = round_half_up(weekly_rate(size) * 4)
      variant BOOKED_PIPELINE:
        forecast_4wk_units(size) =
            sum(allocated_units - fulfilled_units over AllocationLines for size
                whose run.status == PUBLISHED)
          + sum(quantity over RECORDED issuance lines for size
                whose event.status IN {OPEN, LOCKED})
      common outputs per size:
        weeks_of_supply = null when variant rate basis is 0 (TRAILING_ACTUAL weekly_rate == 0),
                          else round_half_up(on_hand_units / weekly_rate, 2)   # TRAILING_ACTUAL only; BOOKED_PIPELINE reports null
        need_share(size) = forecast_4wk_units(size) / sum(forecast_4wk_units over sizes);
                           when the denominator is 0, need_share = 0 for every size
      donation window for mix: [now - 90 days, now], inclusive, over IntakeBatch.posted_at
        donation_share(size) = posted DONATION units(size) / total posted DONATION units in window;
                               0 when the window contains no posted donations
        mix_gap(size) = round_half_up(need_share(size) - donation_share(size), 4)
    input_set: "Issuances: status FULFILLED only (TRAILING_ACTUAL); status RECORDED at OPEN/LOCKED events only (BOOKED_PIPELINE); AllocationLines: runs with status PUBLISHED only; IntakeBatches: source_type DONATION and status POSTED only"
    constants:
      TRAILING_WINDOW_DAYS: 28
      DONATION_WINDOW_DAYS: 90
      WEEKS_IN_WINDOW: 4
    precision: "rates 2 decimals round_half_up; forecast units integer round_half_up; shares 4 decimals round_half_up"
    variants:
      - name: TRAILING_ACTUAL
        when: "variant query param absent or TRAILING_ACTUAL"
        difference: "backward-looking consumption rate; weeks_of_supply populated"
      - name: BOOKED_PIPELINE
        when: "variant=BOOKED_PIPELINE"
        difference: "forward-looking committed demand; weeks_of_supply is null — different numbers for identical inventory/history"

  - name: purchase_order_total
    trigger: "POST /purchase-orders (computed at creation; fixed thereafter)"
    algorithm: tiered_pricing
    formula: |
      for each line: line_total_cents = round_half_up(quantity * unit_cost_cents * (1 - discount_pct))
      total_cost_cents = sum(line_total_cents)
      PINNED ROUNDING ORDER: round per line first, then sum.
      (Sum-then-round would give a different cent total and is rejected.)
    input_set: "po.lines as submitted"
    constants: {}
    precision: "integer cents; per-line round_half_up to whole cents before summation"

  - name: intake_valuation
    trigger: "IntakeBatch creation and recount (lines change)"
    algorithm: weighted_scoring
    formula: |
      DONATION batch: valued_total_cents = sum over lines(quantity * FAIR_MARKET_CENTS[size_code])
      PURCHASE batch: valued_total_cents = sum over lines(quantity * unit_cost_cents of the matching
                      PurchaseOrder line for that size)
    input_set: "batch.lines; FAIR_MARKET_CENTS table for donations; owning PO lines for purchases"
    constants:
      FAIR_MARKET_CENTS: { NEWBORN: 35, SIZE_1: 32, SIZE_2: 30, SIZE_3: 28, SIZE_4: 26, SIZE_5: 24, SIZE_6: 22, TRAINING_PANTS: 40 }
    precision: "integer cents"
    variants:
      - name: donation_fair_market
        when: "source_type == DONATION"
        difference: "values at published fair-market-per-size table"
      - name: purchase_actual_cost
        when: "source_type == PURCHASE"
        difference: "values at actual invoiced unit costs — identical quantities yield a different valuation"

  - name: household_monthly_allotment
    trigger: "POST /distribution-events/{id}/issuances (check) and ClientHousehold read (consumed_this_month_units)"
    algorithm: threshold
    formula: |
      allotment = UNITS_PER_CHILD_PER_MONTH * len(children_sizes)
      month = calendar month (UTC) of the current logical clock
      consumed = sum(total_units over issuances of this household with status FULFILLED
                     and fulfilled_at within month)
               + sum(total_units over issuances of this household with status RECORDED
                     and created_at within month)
      remaining = allotment - consumed
      Issuance check: requested_total = sum(quantity over request lines);
      allowed iff requested_total <= remaining (equality allowed; remaining + 1 rejected).
    input_set: "issuances of this household: FULFILLED by fulfilled_at in month; RECORDED by created_at in month; VOIDED excluded entirely"
    constants:
      UNITS_PER_CHILD_PER_MONTH: 50
    precision: "integer units"

  - name: grant_funds
    trigger: "PO submit/receive/cancel; Grant read"
    algorithm: aggregation
    formula: |
      committed_cents = sum(total_cost_cents over PurchaseOrders with grant_id == grant AND status == SUBMITTED)
      spent_cents     = sum(total_cost_cents over PurchaseOrders with grant_id == grant AND status == RECEIVED)
      available_cents = total_amount_cents - committed_cents - spent_cents
      submit gate: po.total_cost_cents <= available_cents (equality allowed — exact-fit submit succeeds)
      exhaustion: on receive, if spent_cents >= total_amount_cents then status -> EXHAUSTED (boundary: equality exhausts)
    input_set: "PurchaseOrders by exact status; DRAFT and CANCELLED excluded from both sums"
    constants: {}
    precision: "integer cents"

  - name: impact_report
    trigger: "GET /grants/{id}/impact-report"
    algorithm: aggregation
    formula: |
      period = query param 'period' (YYYY-MM), default = calendar month of logical clock
      window = [first instant of period, first instant of next period), half-open
      purchased_units = sum of received IntakeBatch.total_units for batches whose
                        purchase_order.grant_id == grant and posted_at in window
      diapers_distributed_units = sum(total_units over FULFILLED issuances with fulfilled_at in window)
      households_served = count(distinct household_id over those issuances)
      agencies_served = count(distinct event.host_agency_id over those issuances)
      spent_cents / remaining_cents mirror grant_funds
    input_set: "PURCHASE batches POSTED in window for this grant; FULFILLED issuances in window (all grants — distribution is not grant-attributed)"
    constants: {}
    precision: "integer units/cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is listed for the endpoint; AgencyCoordinator may only touch resources whose host_agency_id / agency_id == X-User-ID; client-data endpoints are PrivacyOfficer-only (BankAdmin included in the denial)", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path-template ids resolve to existing resources, validated left to right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 4, category: state, check: "Issuance target event is OPEN", error_id: ERR_EVENT_NOT_OPEN, http_status: 409, applies_to: "POST /distribution-events/{id}/issuances" }
  - { priority: 4, category: state, check: "Event action valid from current status (open/lock/unlock/complete/cancel)", error_id: ERR_INVALID_EVENT_STATE, http_status: 409, applies_to: "POST /distribution-events/{id}/open|lock|unlock|complete|cancel" }
  - { priority: 4, category: state, check: "Host agency is ACTIVE when opening an event", error_id: ERR_AGENCY_NOT_ACTIVE, http_status: 409, applies_to: "POST /distribution-events/{id}/open" }
  - { priority: 4, category: state, check: "IntakeBatch action valid from current status (post/recount/void)", error_id: ERR_INVALID_BATCH_STATE, http_status: 409, applies_to: "POST /intake-batches/{id}/post|recount|void" }
  - { priority: 4, category: state, check: "PO submit requires DRAFT; cancel requires DRAFT (WarehouseManager) or SUBMITTED (FinanceManager)", error_id: ERR_PO_NOT_SUBMITTABLE, http_status: 409, applies_to: "POST /purchase-orders/{id}/submit, POST /purchase-orders/{id}/cancel" }
  - { priority: 4, category: state, check: "PO receive requires SUBMITTED", error_id: ERR_PO_NOT_RECEIVABLE, http_status: 409, applies_to: "POST /purchase-orders/{id}/receive" }
  - { priority: 4, category: state, check: "Run publish/compute require DRAFT", error_id: ERR_RUN_NOT_DRAFT, http_status: 409, applies_to: "POST /allocation-runs/{id}/compute, POST /allocation-runs/{id}/publish" }
  - { priority: 4, category: state, check: "Publish requires a prior compute (computed_at non-null)", error_id: ERR_RUN_NOT_COMPUTED, http_status: 409, applies_to: "POST /allocation-runs/{id}/publish" }
  - { priority: 4, category: state, check: "Finalize/retract require PUBLISHED; retract additionally requires all lines fulfilled_units == 0", error_id: ERR_RUN_NOT_PUBLISHED, http_status: 409, applies_to: "POST /allocation-runs/{id}/finalize, POST /allocation-runs/{id}/retract" }
  - { priority: 4, category: state, check: "Grant is ACTIVE for submit/receive", error_id: ERR_GRANT_NOT_ACTIVE, http_status: 409, applies_to: "POST /purchase-orders/{id}/submit, POST /purchase-orders/{id}/receive" }
  - { priority: 4, category: state, check: "Household eligibility transition is one of the declared cyclic edges", error_id: ERR_INVALID_HOUSEHOLD_STATE, http_status: 409, applies_to: "PATCH /households/{id}" }
  - { priority: 4, category: state, check: "Inventory adjustment expected_inventory_version equals current version (OCC)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /inventory/adjustments" }
  - { priority: 5, category: business_safety, check: "Issuance for a privacy_restricted household may only be recorded by PrivacyOfficer", error_id: ERR_PRIVACY_RESTRICTED, http_status: 403, applies_to: "POST /distribution-events/{id}/issuances" }
  - { priority: 5, category: business_safety, check: "Eligibility -> ELIGIBLE requires consent_on_file == true", error_id: ERR_CONSENT_REQUIRED, http_status: 422, applies_to: "PATCH /households/{id}" }
  - { priority: 5, category: business_safety, check: "Issuance household eligibility_status == ELIGIBLE", error_id: ERR_HOUSEHOLD_NOT_ELIGIBLE, http_status: 422, applies_to: "POST /distribution-events/{id}/issuances" }
  - { priority: 5, category: business_safety, check: "PO submitter X-User-ID != po.created_by_user_id (segregation of duties)", error_id: ERR_SOD_VIOLATION, http_status: 403, applies_to: "POST /purchase-orders/{id}/submit" }
  - { priority: 6, category: business_constraint, check: "New event's half-open [starts_at, ends_at) must not intersect any same-site event with status IN {SCHEDULED, OPEN, LOCKED}; adjacency (ends_at == starts_at) is allowed", error_id: ERR_SITE_SCHEDULE_CONFLICT, http_status: 409, applies_to: "POST /distribution-events" }
  - { priority: 6, category: business_constraint, check: "Volunteer signup rejected when the same volunteer_email holds a signup on another shift whose window expanded by 30 minutes on both sides intersects the target shift (exactly-30-minute gap allowed)", error_id: ERR_SHIFT_OVERLAP, http_status: 409, applies_to: "POST /volunteer-shifts/{id}/signups" }
  - { priority: 6, category: business_constraint, check: "Signup rejected when shift.status == FULL (signup_count == capacity)", error_id: ERR_SHIFT_FULL, http_status: 409, applies_to: "POST /volunteer-shifts/{id}/signups" }
  - { priority: 6, category: business_constraint, check: "One issuance per household per event", error_id: ERR_DUPLICATE_HOUSEHOLD_ISSUANCE, http_status: 409, applies_to: "POST /distribution-events/{id}/issuances" }
  - { priority: 6, category: business_constraint, check: "AllocationRun period unique across all runs", error_id: ERR_DUPLICATE_PERIOD, http_status: 409, applies_to: "POST /allocation-runs" }
  - { priority: 6, category: business_constraint, check: "Volunteer email may appear at most once per shift", error_id: ERR_DUPLICATE_SIGNUP, http_status: 409, applies_to: "POST /volunteer-shifts/{id}/signups" }
  - { priority: 6, category: business_constraint, check: "agency_code / grant_code / household_code unique", error_id: ERR_DUPLICATE_CODE, http_status: 409, applies_to: "POST /partner-agencies, POST /grants, POST /households" }
  - { priority: 7, category: business_temporal, check: "Event may not be opened at or after ends_at", error_id: ERR_EVENT_ALREADY_ENDED, http_status: 422, applies_to: "POST /distribution-events/{id}/open" }
  - { priority: 7, category: business_temporal, check: "AllocationRun period >= calendar month of logical clock", error_id: ERR_PERIOD_IN_PAST, http_status: 422, applies_to: "POST /allocation-runs" }
  - { priority: 8, category: business_referential, check: "Grant close requires zero SUBMITTED purchase orders", error_id: ERR_GRANT_HAS_OPEN_POS, http_status: 409, applies_to: "POST /grants/{id}/close" }
  - { priority: 9, category: business_fiscal, check: "PO against an OPERATIONS_ONLY grant is forbidden (product purchase)", error_id: ERR_GRANT_RESTRICTION_VIOLATION, http_status: 422, applies_to: "POST /purchase-orders/{id}/submit" }
  - { priority: 9, category: business_fiscal, check: "po.total_cost_cents <= grant.available_cents at submit (equality allowed)", error_id: ERR_GRANT_BUDGET_EXCEEDED, http_status: 422, applies_to: "POST /purchase-orders/{id}/submit" }
  - { priority: 9, category: business_fiscal, check: "Issuance line must resolve to a PUBLISHED AllocationLine for (current month, host agency, size)", error_id: ERR_NO_PUBLISHED_ALLOCATION, http_status: 422, applies_to: "POST /distribution-events/{id}/issuances" }
  - { priority: 9, category: business_fiscal, check: "Issuance quantity per size <= line.allocated_units - line.fulfilled_units", error_id: ERR_ALLOCATION_EXCEEDED, http_status: 422, applies_to: "POST /distribution-events/{id}/issuances" }
  - { priority: 9, category: business_fiscal, check: "Issuance quantity per size <= Inventory on_hand_units for the size", error_id: ERR_INSUFFICIENT_STOCK, http_status: 422, applies_to: "POST /distribution-events/{id}/issuances, POST /intake-batches/{id}/void, POST /intake-batches/{id}/recount, POST /allocation-runs/{id}/publish" }
  - { priority: 9, category: business_fiscal, check: "Issuance total <= household remaining monthly allotment (checked last within fiscal)", error_id: ERR_ALLOTMENT_EXCEEDED, http_status: 422, applies_to: "POST /distribution-events/{id}/issuances" }
  - { priority: 10, category: existence, check: "Request-body foreign references resolve (household_id on issuance, grant_id on PO, host_agency_id on event); malformed fields, bad enums, ends_at <= starts_at, empty lines, quantity < 1", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
# Note: within priority 9 the declared evaluation order is:
#   restriction -> budget -> no-allocation -> allocation-exceeded -> insufficient-stock -> allotment.

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock (test-driving endpoint). Server startup default is exactly 2026-08-01T00:00:00Z; the logical clock never falls back to wall-clock time.", roles: [BankAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: [rebase all clock-derived windows] }

  - { method: POST, path: "/partner-agencies", description: "Create a partner agency (initial status ACTIVE)", roles: [BankAdmin], code: 201, input: [name, agency_code, contact_email, children_served_monthly, storage_capacity_units], output: PartnerAgency, side_effects: [] }
  - { method: GET, path: "/partner-agencies", description: "List agencies", roles: [BankAdmin, FinanceManager, WarehouseManager, AgencyCoordinator, PrivacyOfficer, VolunteerCoordinator], code: 200, input: ["status?", "limit?", "offset?"], output: "PartnerAgency[]", side_effects: [] }
  - { method: GET, path: "/partner-agencies/{id}", description: "Read one agency; AgencyCoordinator restricted to own id", roles: [BankAdmin, FinanceManager, WarehouseManager, AgencyCoordinator], code: 200, input: [], output: PartnerAgency, side_effects: [] }
  - { method: PATCH, path: "/partner-agencies/{id}", description: "Update allocation weight inputs", roles: [BankAdmin], code: 200, input: ["children_served_monthly?", "storage_capacity_units?", "contact_email?"], output: PartnerAgency, side_effects: ["Increments PartnerAgency.version by 1"] }
  - { method: POST, path: "/partner-agencies/{id}/suspend", description: "ACTIVE -> SUSPENDED; releases all unfulfilled allocation lines back to inventory", roles: [BankAdmin], code: 200, input: [], output: PartnerAgency, side_effects: ["AllocationLines ALLOCATED|PARTIALLY_FULFILLED -> RELEASED", "Inventory.reserved_units decremented per released line"] }
  - { method: GET, path: "/partner-agencies/{id}/allocation-lines", description: "Allocation lines for this agency across all runs (AllocationLine.agency_id reverse lookup)", roles: [BankAdmin, AgencyCoordinator], code: 200, input: ["status?", "limit?", "offset?"], output: "AllocationLine[]", side_effects: [] }

  - { method: POST, path: "/grants", description: "Create a grant (initial status ACTIVE)", roles: [FinanceManager], code: 201, input: [funder_name, grant_code, total_amount_cents, start_date, end_date, "restriction?"], output: Grant, side_effects: [] }
  - { method: GET, path: "/grants/{id}", description: "Read one grant incl. committed/spent/available", roles: [FinanceManager, BankAdmin, WarehouseManager], code: 200, input: [], output: Grant, side_effects: [] }
  - { method: POST, path: "/grants/{id}/close", description: "ACTIVE -> CLOSED; requires no SUBMITTED POs", roles: [FinanceManager], code: 200, input: [], output: Grant, side_effects: [] }
  - { method: GET, path: "/grants/{id}/impact-report", description: "Funder impact metrics for a period (impact_report calculation)", roles: [FinanceManager, BankAdmin], code: 200, input: ["period?"], output: "{ period: string, purchased_units: integer, diapers_distributed_units: integer, households_served: integer, agencies_served: integer, spent_cents: integer, remaining_cents: integer }", side_effects: [] }

  - { method: POST, path: "/inventory/initialize", description: "Create the Inventory singleton with per-size reorder thresholds (omitted sizes default 0). Second call -> ERR_INVALID_BATCH_STATE is NOT used; returns ERR_VALIDATION.", roles: [WarehouseManager], code: 201, input: ["thresholds?"], output: Inventory, side_effects: ["All 8 SIZE_CODE entries created with on_hand 0, reserved 0"] }
  - { method: GET, path: "/inventory", description: "Read the inventory singleton (per-size on_hand/reserved/available/restock flag)", roles: [WarehouseManager, BankAdmin, FinanceManager], code: 200, input: [], output: Inventory, side_effects: [] }
  - { method: POST, path: "/inventory/adjustments", description: "Absolute physical-count correction for one size (OCC-guarded)", roles: [WarehouseManager], code: 200, input: [size_code, new_on_hand_units, reason, expected_inventory_version], output: Inventory, side_effects: ["Inventory.sizes[size_code].on_hand_units = new_on_hand_units", "Increments Inventory.version by 1"] }
  - { method: GET, path: "/inventory/forecast", description: "Per-size 4-week forecast, weeks of supply, donation-mix gap (size_mix_forecast calculation)", roles: [WarehouseManager, BankAdmin], code: 200, input: ["variant?"], output: "{ variant: string, generated_at: string, sizes: array }", side_effects: [] }

  - { method: POST, path: "/intake-batches", description: "Create a DONATION intake batch with counted lines (initial status COUNTED)", roles: [WarehouseManager], code: 201, input: [donor_name, lines], output: IntakeBatch, side_effects: ["valued_total_cents computed via intake_valuation (donation_fair_market variant)"] }
  - { method: GET, path: "/intake-batches", description: "List intake batches (IntakeBatch.purchase_order_id reverse lookup via filter)", roles: [WarehouseManager, BankAdmin, FinanceManager], code: 200, input: ["source_type?", "status?", "purchase_order_id?", "limit?", "offset?"], output: "IntakeBatch[]", side_effects: [] }
  - { method: GET, path: "/intake-batches/{id}", description: "Read one batch", roles: [WarehouseManager, BankAdmin, FinanceManager], code: 200, input: [], output: IntakeBatch, side_effects: [] }
  - { method: POST, path: "/intake-batches/{id}/post", description: "COUNTED -> POSTED; adds lines to inventory on_hand", roles: [WarehouseManager], code: 200, input: [], output: IntakeBatch, side_effects: ["Inventory.on_hand_units += per line", "posted_at = logical clock", "Increments Inventory.version by 1"] }
  - { method: POST, path: "/intake-batches/{id}/recount", description: "POSTED -> COUNTED with replacement lines; withdraws old lines from on_hand", roles: [WarehouseManager], code: 200, input: [lines], output: IntakeBatch, side_effects: ["Inventory.on_hand_units -= per old line", "lines replaced; totals recomputed", "Increments Inventory.version by 1"] }
  - { method: POST, path: "/intake-batches/{id}/void", description: "COUNTED|POSTED -> VOIDED; POSTED void exactly reverses its stock contribution", roles: [WarehouseManager], code: 200, input: ["reason?"], output: IntakeBatch, side_effects: ["POSTED: Inventory.on_hand_units -= per line", "Increments Inventory.version by 1 when posted"] }

  - { method: POST, path: "/purchase-orders", description: "Create a wholesale PO in DRAFT against a grant", roles: [WarehouseManager], code: 201, input: [grant_id, vendor_name, lines, "discount_pct?"], output: PurchaseOrder, side_effects: ["total_cost_cents computed via purchase_order_total (per-line rounding then sum)", "created_by_user_id = X-User-ID"] }
  - { method: GET, path: "/purchase-orders", description: "List POs (PurchaseOrder.grant_id and PurchaseOrder.received_intake_batch_id reverse lookups via filters)", roles: [WarehouseManager, FinanceManager, BankAdmin], code: 200, input: ["grant_id?", "status?", "received_intake_batch_id?", "limit?", "offset?"], output: "PurchaseOrder[]", side_effects: [] }
  - { method: GET, path: "/purchase-orders/{id}", description: "Read one PO", roles: [WarehouseManager, FinanceManager, BankAdmin], code: 200, input: [], output: PurchaseOrder, side_effects: [] }
  - { method: POST, path: "/purchase-orders/{id}/submit", description: "DRAFT -> SUBMITTED; commits grant funds; SoD enforced", roles: [FinanceManager], code: 200, input: [], output: PurchaseOrder, side_effects: ["grant.committed_cents += total_cost_cents", "Increments Grant.version by 1"] }
  - { method: POST, path: "/purchase-orders/{id}/receive", description: "SUBMITTED -> RECEIVED; moves committed -> spent; creates POSTED PURCHASE IntakeBatch; may auto-exhaust grant", roles: [WarehouseManager], code: 200, input: [received_lines], output: PurchaseOrder, side_effects: ["grant committed->spent", "IntakeBatch created POSTED; on_hand increased", "grant EXHAUSTED when spent >= total"] }
  - { method: POST, path: "/purchase-orders/{id}/cancel", description: "DRAFT (WarehouseManager) or SUBMITTED (FinanceManager) -> CANCELLED; SUBMITTED cancel releases committed funds", roles: [WarehouseManager, FinanceManager], code: 200, input: [], output: PurchaseOrder, side_effects: ["SUBMITTED: grant.committed_cents -= total_cost_cents"] }

  - { method: POST, path: "/allocation-runs", description: "Create a monthly allocation run in DRAFT", roles: [BankAdmin], code: 201, input: [period, "formula_variant?"], output: AllocationRun, side_effects: [] }
  - { method: GET, path: "/allocation-runs/{id}", description: "Read one run", roles: [BankAdmin, AgencyCoordinator], code: 200, input: [], output: AllocationRun, side_effects: [] }
  - { method: GET, path: "/allocation-runs/{id}/lines", description: "Lines of a run, sorted by size_code ASC, then agency children_served_monthly DESC, then agency created_at ASC (AllocationLine.allocation_run_id reverse lookup)", roles: [BankAdmin, AgencyCoordinator], code: 200, input: ["limit?", "offset?"], output: "AllocationLine[]", side_effects: [] }
  - { method: POST, path: "/allocation-runs/{id}/compute", description: "Run monthly_allocation_formula; replaces all PROJECTED lines (recompute-safe)", roles: [BankAdmin], code: 200, input: [], output: AllocationRun, side_effects: ["AllocationLines upserted as PROJECTED", "computed_at = logical clock", "total_allocated_units recomputed"] }
  - { method: POST, path: "/allocation-runs/{id}/publish", description: "DRAFT -> PUBLISHED; lines -> ALLOCATED; reserves stock", roles: [BankAdmin], code: 200, input: [], output: AllocationRun, side_effects: ["lines PROJECTED -> ALLOCATED", "Inventory.reserved_units += allocated per size", "published_at = logical clock"] }
  - { method: POST, path: "/allocation-runs/{id}/finalize", description: "PUBLISHED -> FINALIZED; releases unfulfilled remainders", roles: [BankAdmin], code: 200, input: [], output: AllocationRun, side_effects: ["lines ALLOCATED|PARTIALLY_FULFILLED -> RELEASED", "Inventory.reserved_units -= released per line"] }
  - { method: POST, path: "/allocation-runs/{id}/retract", description: "PUBLISHED -> DRAFT when nothing consumed; un-reserves stock", roles: [BankAdmin], code: 200, input: [], output: AllocationRun, side_effects: ["lines ALLOCATED -> PROJECTED", "Inventory.reserved_units -= allocated per size"] }

  - { method: POST, path: "/distribution-events", description: "Schedule a distribution event (half-open site-overlap check)", roles: [BankAdmin, AgencyCoordinator], code: 201, input: [host_agency_id, site_name, starts_at, ends_at], output: DistributionEvent, side_effects: [] }
  - { method: GET, path: "/distribution-events", description: "List events (DistributionEvent.host_agency_id reverse lookup via filter)", roles: [BankAdmin, AgencyCoordinator, WarehouseManager], code: 200, input: ["host_agency_id?", "site_name?", "status?", "limit?", "offset?"], output: "DistributionEvent[]", side_effects: [] }
  - { method: GET, path: "/distribution-events/{id}", description: "Read one event", roles: [BankAdmin, AgencyCoordinator, WarehouseManager], code: 200, input: [], output: DistributionEvent, side_effects: [] }
  - { method: POST, path: "/distribution-events/{id}/open", description: "SCHEDULED -> OPEN; requires ACTIVE host agency and clock < ends_at", roles: [BankAdmin, AgencyCoordinator], code: 200, input: [], output: DistributionEvent, side_effects: [] }
  - { method: POST, path: "/distribution-events/{id}/lock", description: "OPEN -> LOCKED (freezes issuance recording ahead of completion)", roles: [BankAdmin, AgencyCoordinator], code: 200, input: [], output: DistributionEvent, side_effects: [] }
  - { method: POST, path: "/distribution-events/{id}/unlock", description: "LOCKED -> OPEN (revert branch)", roles: [BankAdmin, AgencyCoordinator], code: 200, input: [], output: DistributionEvent, side_effects: [] }
  - { method: POST, path: "/distribution-events/{id}/complete", description: "LOCKED -> COMPLETED; fulfills all RECORDED issuances (cascade: inventory debit, line credit, run auto-finalize)", roles: [BankAdmin, AgencyCoordinator], code: 200, input: [], output: DistributionEvent, side_effects: ["issuances RECORDED -> FULFILLED", "Inventory on_hand/reserved -= per fulfilled line", "AllocationLine fulfilled/status updated", "run auto-FINALIZED when all lines FULFILLED"] }
  - { method: POST, path: "/distribution-events/{id}/cancel", description: "SCHEDULED|OPEN -> CANCELLED; auto-voids RECORDED issuances", roles: [BankAdmin, AgencyCoordinator], code: 200, input: [], output: DistributionEvent, side_effects: ["RECORDED issuances -> VOIDED"] }
  - { method: POST, path: "/distribution-events/{id}/issuances", description: "Record supplies given to a household at an OPEN event (eligibility, privacy, allocation, stock, allotment gates)", roles: [AgencyCoordinator, PrivacyOfficer], code: 201, input: [household_id, lines], output: Issuance, side_effects: ["household consumed_this_month_units recomputed"] }
  - { method: GET, path: "/distribution-events/{id}/issuances", description: "Issuances recorded at this event (Issuance.event_id reverse lookup)", roles: [BankAdmin, AgencyCoordinator, PrivacyOfficer], code: 200, input: ["limit?", "offset?"], output: "Issuance[]", side_effects: [] }

  - { method: POST, path: "/issuances/{id}/void", description: "RECORDED -> VOIDED while owning event is OPEN or LOCKED", roles: [AgencyCoordinator, PrivacyOfficer], code: 200, input: ["reason?"], output: Issuance, side_effects: ["household consumed_this_month_units recomputed"] }

  - { method: POST, path: "/households", description: "Register a pseudonymous client household (dignity policy: no PII fields exist)", roles: [PrivacyOfficer], code: 201, input: [household_code, children_sizes, "consent_on_file?", "privacy_restricted?"], output: ClientHousehold, side_effects: [] }
  - { method: GET, path: "/households/{id}", description: "Read one household (PrivacyOfficer-only; BankAdmin is denied)", roles: [PrivacyOfficer], code: 200, input: [], output: ClientHousehold, side_effects: [] }
  - { method: PATCH, path: "/households/{id}", description: "Update children_sizes / consent / privacy flag; drive eligibility state machine", roles: [PrivacyOfficer], code: 200, input: ["children_sizes?", "consent_on_file?", "privacy_restricted?", "eligibility_status?", "eligibility_reason?"], output: ClientHousehold, side_effects: ["monthly_allotment_units recomputed when children_sizes changes", "eligibility transitions per state machine"] }
  - { method: GET, path: "/households/{id}/issuances", description: "Issuance history of a household (Issuance.household_id reverse lookup)", roles: [PrivacyOfficer], code: 200, input: ["status?", "limit?", "offset?"], output: "Issuance[]", side_effects: [] }

  - { method: POST, path: "/volunteer-shifts", description: "Create a warehouse volunteer shift", roles: [VolunteerCoordinator], code: 201, input: [title, starts_at, ends_at, capacity], output: VolunteerShift, side_effects: [] }
  - { method: POST, path: "/volunteer-shifts/{id}/signups", description: "Sign a volunteer up; capacity + 30-minute-buffer overlap + duplicate rules", roles: [Volunteer, VolunteerCoordinator], code: 201, input: [volunteer_email, volunteer_name], output: VolunteerShift, side_effects: ["signups appended", "status auto OPEN -> FULL at capacity"] }
  - { method: POST, path: "/volunteer-shifts/{id}/withdraw", description: "Withdraw a volunteer signup", roles: [Volunteer, VolunteerCoordinator], code: 200, input: [volunteer_email], output: VolunteerShift, side_effects: ["signup removed", "status auto FULL -> OPEN below capacity"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not allowed for endpoint, or AgencyCoordinator acting on another agency's resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not resolve (checked left to right)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad enum, unknown size_code, ends_at <= starts_at, empty lines, quantity < 1, unresolvable body FK, second inventory initialize" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_inventory_version != current Inventory.version on adjustment" }
  - { id: ERR_AGENCY_NOT_ACTIVE, http: 409, condition: "Opening an event whose host agency is SUSPENDED" }
  - { id: ERR_INVALID_BATCH_STATE, http: 409, condition: "post/recount/void from a batch status without that edge" }
  - { id: ERR_PO_NOT_SUBMITTABLE, http: 409, condition: "PO submit/cancel from a status without that edge (incl. WarehouseManager cancelling non-DRAFT)" }
  - { id: ERR_PO_NOT_RECEIVABLE, http: 409, condition: "PO receive from a status other than SUBMITTED" }
  - { id: ERR_INVALID_EVENT_STATE, http: 409, condition: "Event action from a status without that edge (incl. cancel from LOCKED, complete from OPEN, any action on COMPLETED/CANCELLED)" }
  - { id: ERR_EVENT_NOT_OPEN, http: 409, condition: "Issuance recorded while event is not OPEN" }
  - { id: ERR_RUN_NOT_DRAFT, http: 409, condition: "compute/publish on a run not in DRAFT" }
  - { id: ERR_RUN_NOT_COMPUTED, http: 409, condition: "publish before any compute" }
  - { id: ERR_RUN_NOT_PUBLISHED, http: 409, condition: "finalize/retract on a run not in PUBLISHED, or retract with consumption" }
  - { id: ERR_GRANT_NOT_ACTIVE, http: 409, condition: "PO submit/receive against a CLOSED or EXHAUSTED grant" }
  - { id: ERR_INVALID_HOUSEHOLD_STATE, http: 409, condition: "Eligibility transition not in the household state machine" }
  - { id: ERR_PRIVACY_RESTRICTED, http: 403, condition: "Non-PrivacyOfficer recording an issuance for a privacy_restricted household" }
  - { id: ERR_CONSENT_REQUIRED, http: 422, condition: "Eligibility -> ELIGIBLE without consent_on_file" }
  - { id: ERR_HOUSEHOLD_NOT_ELIGIBLE, http: 422, condition: "Issuance for a household not currently ELIGIBLE" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "PO submitter X-User-ID equals the PO creator's" }
  - { id: ERR_SITE_SCHEDULE_CONFLICT, http: 409, condition: "Half-open interval intersection with an existing same-site non-terminal event" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "Volunteer already signed to a shift within the 30-minute buffer window" }
  - { id: ERR_SHIFT_FULL, http: 409, condition: "Signup when signup_count == capacity" }
  - { id: ERR_DUPLICATE_CODE, http: 409, condition: "agency_code / grant_code / household_code already in use" }
  - { id: ERR_DUPLICATE_PERIOD, http: 409, condition: "AllocationRun period already exists" }
  - { id: ERR_DUPLICATE_HOUSEHOLD_ISSUANCE, http: 409, condition: "Second issuance for the same household at the same event" }
  - { id: ERR_DUPLICATE_SIGNUP, http: 409, condition: "Volunteer email already signed up for this shift" }
  - { id: ERR_EVENT_ALREADY_ENDED, http: 422, condition: "Open attempted at or after event.ends_at" }
  - { id: ERR_PERIOD_IN_PAST, http: 422, condition: "AllocationRun period earlier than the logical clock's month" }
  - { id: ERR_GRANT_HAS_OPEN_POS, http: 409, condition: "Grant close attempted with SUBMITTED purchase orders outstanding" }
  - { id: ERR_GRANT_RESTRICTION_VIOLATION, http: 422, condition: "Product PO submitted against an OPERATIONS_ONLY grant" }
  - { id: ERR_GRANT_BUDGET_EXCEEDED, http: 422, condition: "po.total_cost_cents > grant.available_cents at submit" }
  - { id: ERR_NO_PUBLISHED_ALLOCATION, http: 422, condition: "No PUBLISHED allocation line for (current month, host agency, size)" }
  - { id: ERR_ALLOCATION_EXCEEDED, http: 422, condition: "Issuance quantity exceeds the line's unfulfilled remainder" }
  - { id: ERR_ALLOTMENT_EXCEEDED, http: 422, condition: "Issuance total exceeds the household's remaining monthly allotment" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 422, condition: "Operation would drive a size's on_hand negative (issuance, batch void/recount) or allocated total exceeds on_hand at publish" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BankAdmin
    description: "Diaper bank operations administrator: agency network, allocation runs, distribution events, logical clock. Deliberately denied access to client household records (dignity policy)."
    identity: opaque
    exclusive_operations: [create/suspend/patch partner agencies, create/compute/publish/finalize/retract allocation runs, set logical clock]
    shared_operations: [distribution events (all), read inventory/grants/POs/intake, impact reports]
  - name: WarehouseManager
    description: "Warehouse operator: inventory initialize/adjust, donation intake lifecycle, wholesale PO creation/receipt."
    identity: opaque
    exclusive_operations: [initialize/adjust inventory, intake batch post/recount/void, create purchase orders, receive purchase orders]
    shared_operations: [read grants/POs/events/agencies, cancel own DRAFT purchase orders]
  - name: FinanceManager
    description: "Grant and funding steward: grant lifecycle, PO submission (segregated from PO creation), funder impact reports."
    identity: opaque
    exclusive_operations: [create/close grants, submit purchase orders, cancel SUBMITTED purchase orders]
    shared_operations: [read inventory/POs/agencies, impact reports]
  - name: AgencyCoordinator
    description: "Staff of a partner agency; X-User-ID is the PartnerAgency id. Manages own distribution events and records issuances for non-restricted households."
    identity: "entity_backed:PartnerAgency"
    exclusive_operations: [record/void issuances at own events]
    shared_operations: [create/manage own distribution events, read own agency and allocation lines]
  - name: PrivacyOfficer
    description: "Client-data steward (dignity & privacy policy): sole role that creates/reads/patches households; may record issuances for any household incl. privacy_restricted."
    identity: opaque
    exclusive_operations: [create/read/patch households, eligibility decisions, household issuance history]
    shared_operations: [record/void issuances at any event, read event issuances]
  - name: VolunteerCoordinator
    description: "Warehouse volunteer scheduler."
    identity: opaque
    exclusive_operations: [create volunteer shifts]
    shared_operations: [sign up / withdraw volunteers]
  - name: Volunteer
    description: "Unpersisted volunteer identity; self signup/withdraw by email."
    identity: opaque
    exclusive_operations: []
    shared_operations: [sign up / withdraw volunteers]
