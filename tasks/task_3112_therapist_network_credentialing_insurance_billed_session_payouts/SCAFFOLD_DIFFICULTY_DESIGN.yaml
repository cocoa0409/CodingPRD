            - "One clinician Zara Whitfield (LCSW, CA, caseload 8, availability Tuesday and Wednesday 08:00-18:00 UTC) with cash_basis_opt_in false, BILLABLE posture, one EFFECTIVE enrollment with payer PAX, and one rate row of 15000 cents for (PAX, LCSW, CA, 90837) effective 2026-01-01T00:00:00Z with no end."
            - "Patients Priya Anand and Marcus Cole, both payer PAX, state CA, each with a VERIFIED benefit snapshot."
            - "Four COMPLETED sessions, each with a SIGNED 60-minute note: s_a on 2026-06-02T14:00:00Z for Priya at rate 15000, s_b on 2026-06-03T14:00:00Z for Marcus at rate 15000, s_c on 2026-06-16T14:00:00Z for Priya at rate 15000, s_d on 2026-06-17T14:00:00Z for Marcus at rate 15000."
            - "Claims for s_a and s_c adjudicated PAID; claims for s_b and s_d adjudicated DENIED with denial_code NOT_COVERED."
            - "No payout line has ever existed for this clinician, so all four claims are unassigned."
            - "Batch B1 covers 2026-06-01T00:00:00Z to 2026-06-08T00:00:00Z with schedule WEEKLY; batch B2 covers 2026-06-15T00:00:00Z to 2026-06-22T00:00:00Z with schedule SEMICONTHLY."
