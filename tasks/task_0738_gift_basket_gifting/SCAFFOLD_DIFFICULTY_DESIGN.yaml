  # ===========================================================================
  # Rule 9 — compensating_invariant (>= 2 instances, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: order_cancel_releases_reservation_restoring_available_inventory_units
        grounds:
          - state_machines.InventoryReservation.RESERVED_to_ALLOCATED
          - calculations.component_available_qty
        distinguishing_aspect: |
          Conserved quantity: ComponentSKU available inventory units. The forward action (importing a
          recipient, which reserves 5 of 5 on-hand units) paired with its compensating action
          (cancelling the order, which releases the reservation) must leave the SKU's available-unit
          count exactly where it started — observed behaviorally: a probe import needing all 5 units
          is REJECTED while the reservation is active, and ACCEPTED again once released.
        test_recipe:
          setup:
            - "ComponentSKU on_hand_qty=5 (non-perishable, to isolate the compensation from Rule 1's dual-variant projection nuance). Order_A reserves all 5 units for 1 recipient (quantity=5), then is submitted and approved (production_status=ASSEMBLING, InventoryReservation ALLOCATED)."
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { name: "Sigma Corp", billing_email: "ap@sigma.example", monthly_budget_cents: 1000000, approval_threshold_cents: 1000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /component-skus"
              payload: { name: "Wine Glass Set", unit_cost_cents: 1200, is_perishable: false, on_hand_qty: 5 }
