  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: occ_stale_season_version_on_lot_accept
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[lot-accept-stale-season]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "Two sequential accepts against the same captured season version: the first commits and bumps season.version, the second — carrying the now-stale expected_season_version — is deterministically rejected with 412."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 OPEN (version 1 after open). Vendor STANDARD. Two IMMEDIATE lots both EVALUATED at asking."
          setup_api_calls:
            - *k_clock
            - *k_season
            - call: "POST /merchandise-seasons/${k_season_id}/open"
              payload: {}
              as: PlanningLead
            - *k_zone_mt
            - *k_vendor
            - call: "POST /lots"
              payload: { lot_code: "OA1", vendor_id: "${k_vendor_id}", season_id: "${k_season_id}", lot_type: "CLOSEOUT", disposition: "IMMEDIATE", asking_price_cents: 100000, unit_count: 10, expected_sell_through_pct: 0.9, estimated_unit_retail_cents: 5000, offer_expires_at: "2026-12-01T00:00:00Z" }
              as: Buyer
              captures: { lot_oa1_id: $.data.id }
            - call: "POST /lots/${lot_oa1_id}/evaluate"
              payload: {}
              as: Buyer
            - call: "POST /lots"
              payload: { lot_code: "OA2", vendor_id: "${k_vendor_id}", season_id: "${k_season_id}", lot_type: "CLOSEOUT", disposition: "IMMEDIATE", asking_price_cents: 100000, unit_count: 10, expected_sell_through_pct: 0.9, estimated_unit_retail_cents: 5000, offer_expires_at: "2026-12-01T00:00:00Z" }
              as: Buyer
              captures: { lot_oa2_id: $.data.id }
            - call: "POST /lots/${lot_oa2_id}/evaluate"
              payload: {}
              as: Buyer
          trigger:
            - call: "POST /lots/${lot_oa1_id}/accept"
              payload: { expected_season_version: "${k_season_v}" }
              as: Buyer
            - call: "POST /lots/${lot_oa2_id}/accept"
              payload: { expected_season_version: "${k_season_v}" }
              as: Buyer
              captures: { err_oa: $.data.error_id }
          assert:
            - "the first accept succeeds and MerchandiseSeason.${k_season_id}.version advances to 2"
            - "the second accept fails with 412 ERR_STALE_VERSION (stale expected_season_version 1)"
            - "retrying the second accept with expected_season_version 2 succeeds and committed_forward_cents == 500000 (250000 landed per lot)"

      - name: occ_stale_hold_version_on_release
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[hold-release-stale-hold]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "An aging review between the client's read and its release bumps hold.version; the release carrying the pre-review version is 412 ERR_STALE_VERSION while the window and season gates all pass."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Seasons SS2027 / FW2027 handled so FW2027 is OPEN at release time: SS2027 closed before hold creation (lot accepted, no holds yet), FW2027 opened."
            - "PACKAWAY lot accepted; hold entered 2026-09-01 with window [2026-12-01, 2027-01-31] (before the 90-day review age); version captured at creation."
          setup_api_calls:
            - *k_clock
            - *k_season
            - *k_season_fw
            - *k_zone_mt
            - *k_vendor
            - call: "POST /lots"
              payload: { lot_code: "OH1", vendor_id: "${k_vendor_id}", season_id: "${k_season_id}", lot_type: "PACKAWAY", disposition: "PACKAWAY", asking_price_cents: 500000, unit_count: 50, expected_sell_through_pct: 0.9, estimated_unit_retail_cents: 5000, offer_expires_at: "2026-12-01T00:00:00Z", target_season_id: "${k_fw_id}" }
              as: Buyer
              captures: { lot_oh_id: $.data.id }
            - call: "POST /lots/${lot_oh_id}/evaluate"
              payload: {}
              as: Buyer
            - call: "POST /lots/${lot_oh_id}/accept"
              payload: { expected_season_version: "${k_season_v}" }
              as: Buyer
            - call: "POST /merchandise-seasons/${k_season_id}/close"
              payload: {}
              as: PlanningLead
            - call: "POST /merchandise-seasons/${k_fw_id}/open"
              payload: {}
              as: PlanningLead
            - call: "POST /warehouses"
              payload: { warehouse_code: "W-OH", pallet_capacity: 100, zone_code: "MT", monthly_holding_rate_per_pallet_cents: 5000 }
              as: InventoryPlanner
              captures: { wh_oh_id: $.data.id }
            - call: "POST /packaway-holds"
              payload: { lot_id: "${lot_oh_id}", warehouse_id: "${wh_oh_id}", pallet_count: 2, release_window_start: "2026-12-01T00:00:00Z", release_window_end: "2027-01-31T00:00:00Z" }
              as: InventoryPlanner
              captures: { hold_oh_id: $.data.id, hold_oh_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T00:00:00Z" }
              as: PlanningLead
            - call: "POST /packaway-holds/${hold_oh_id}/aging-review"
              payload: { trigger_reason: "AGING_THRESHOLD" }
              as: InventoryPlanner
            - call: "POST /packaway-holds/${hold_oh_id}/aging-review"
              payload: { trigger_reason: "DECISION_KEEP" }
              as: InventoryPlanner
          trigger:
            - call: "POST /packaway-holds/${hold_oh_id}/release"
              payload: { expected_hold_version: "${hold_oh_v}" }
              as: InventoryPlanner
              captures: { err_oh: $.data.error_id }
            - call: "GET /packaway-holds/${hold_oh_id}"
              payload: {}
              as: InventoryPlanner
              captures: { hold_oh_vnow: $.data.version }
            - call: "POST /packaway-holds/${hold_oh_id}/release"
              payload: { expected_hold_version: "${hold_oh_vnow}" }
              as: InventoryPlanner
          assert:
            - "the release with the pre-review version fails with 412 ERR_STALE_VERSION (FW2027 is OPEN and 2026-12-15 is inside the window — only OCC blocks)"
            - "the retry with the current version succeeds: status RELEASED, release_date == 2026-12-15"
            - "accrued_holding_cost_cents == 70000 (105 days: 3 full months * 2 * 5000 + floor(10000*15/30) = 60000 + 5000)"

      - name: markdown_sweep_ops_checkpoint_on_clock_advance
        claim_type: ops_run_checkpoint
        grounds:
          - calculations.markdown_cadence_step
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "The clock-set endpoint IS the ops-run checkpoint: advancing it re-derives weeks_on_floor for every live StoreSku and applies at most one cadence step per SKU per sweep, no matter how many boundaries were crossed."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 OPEN. Vendor STANDARD zone MT. Lot accepted; ticket; store; StoreSku at 9999 placed 2026-09-01."
            - "Clock jumps 9 weeks ahead in a single set (crossing two cadence boundaries at weeks 4 and 8)."
          setup_api_calls:
            - *k_clock
            - *k_season
            - call: "POST /merchandise-seasons/${k_season_id}/open"
              payload: {}
              as: PlanningLead
            - *k_zone_mt
            - *k_vendor
            - call: "POST /lots"
              payload: { lot_code: "SW1", vendor_id: "${k_vendor_id}", season_id: "${k_season_id}", lot_type: "CLOSEOUT", disposition: "IMMEDIATE", asking_price_cents: 1000000, unit_count: 100, expected_sell_through_pct: 0.9, estimated_unit_retail_cents: 5000, offer_expires_at: "2026-12-01T00:00:00Z" }
              as: Buyer
              captures: { lot_sw_id: $.data.id }
            - call: "POST /lots/${lot_sw_id}/lot-lines"
              payload: { style_code: "SW-1", department: "APPAREL", quantity: 100, unit_cost_cents: 11500, compare_at_claim_cents: 15000, target_retail_cents: 10000 }
              as: Buyer
              captures: { line_sw_id: $.data.id }
            - call: "POST /lots/${lot_sw_id}/evaluate"
              payload: {}
              as: Buyer
            - call: "POST /lots/${lot_sw_id}/accept"
              payload: { expected_season_version: "${k_season_v}" }
              as: Buyer
            - call: "POST /tickets"
              payload: { lot_line_id: "${line_sw_id}", zone_code: "MT" }
              as: PricingAnalyst
              captures: { ticket_sw_id: $.data.id }
            - call: "POST /stores"
              payload: { store_code: "ST-SW", cluster_code: "SUBURBAN_FAMILY", zone_code: "MT", storage_capacity_units: 500 }
              as: AllocationManager
              captures: { store_sw_id: $.data.id }
            - call: "POST /store-skus"
              payload: { store_id: "${store_sw_id}", lot_line_id: "${line_sw_id}", ticket_id: "${ticket_sw_id}", season_id: "${k_season_id}", units_on_hand: 10 }
              as: StoreOpsLead
              captures: { ss_sw_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-03T00:00:00Z" }
              as: PlanningLead
            - call: "GET /store-skus/${ss_sw_id}"
              payload: {}
              as: StoreOpsLead
          assert:
            - "StoreSku.${ss_sw_id}.weeks_on_floor == 9 but markdown_step == 1 (single step per sweep even though two boundaries crossed)"
            - "StoreSku.${ss_sw_id}.current_price_cents == 7909 (exactly one 0.8 step from 9999)"
            - "exactly 1 MarkdownEvent exists for the SKU"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_consistency_of_cascade_writes_in_same_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Receipt.OPEN_to_RECEIVED
        distinguishing_aspect: "All cascade writes are visible in the very next read: after receipt completion, the season's spent_forward_cents, the line's variance_value_cents, and the auto-created ShrinkCase are all observable with no delay or reconciliation lag."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 OPEN. Vendor STANDARD zone MT. IMMEDIATE lot accepted (landed 6150000, unit_count 40, one line qty 40). Receipt opened, received 30, completed."
          setup_api_calls:
            - *k_clock
            - *k_season
            - call: "POST /merchandise-seasons/${k_season_id}/open"
              payload: {}
              as: PlanningLead
            - *k_zone_mt
            - *k_vendor
            - call: "POST /lots"
              payload: { lot_code: "IC1", vendor_id: "${k_vendor_id}", season_id: "${k_season_id}", lot_type: "CLOSEOUT", disposition: "IMMEDIATE", asking_price_cents: 6000000, unit_count: 40, expected_sell_through_pct: 0.8, estimated_unit_retail_cents: 20000, offer_expires_at: "2026-12-01T00:00:00Z" }
              as: Buyer
              captures: { lot_ic_id: $.data.id }
            - call: "POST /lots/${lot_ic_id}/lot-lines"
              payload: { style_code: "IC-1", department: "APPAREL", quantity: 40, unit_cost_cents: 150000, compare_at_claim_cents: 40000, target_retail_cents: 20000 }
              as: Buyer
            - call: "POST /lots/${lot_ic_id}/evaluate"
              payload: { negotiated_price_cents: 6000000 }
              as: Buyer
            - call: "POST /lots/${lot_ic_id}/accept"
              payload: { expected_season_version: "${k_season_v}" }
              as: Buyer
            - call: "POST /warehouses"
              payload: { warehouse_code: "W-IC", pallet_capacity: 100, zone_code: "MT", monthly_holding_rate_per_pallet_cents: 5000 }
              as: InventoryPlanner
              captures: { wh_ic_id: $.data.id }
            - call: "POST /receipts"
              payload: { lot_id: "${lot_ic_id}", warehouse_id: "${wh_ic_id}" }
              as: WarehouseClerk
              captures: { receipt_ic_id: $.data.id }
            - call: "GET /receipts/${receipt_ic_id}/receipt-lines"
              payload: {}
              as: WarehouseClerk
              captures: { rl_ic_id: "$.data[0].id" }
            - call: "PATCH /receipts/${receipt_ic_id}/lines/${rl_ic_id}"
              payload: { received_qty: 30 }
              as: WarehouseClerk
          trigger:
            - call: "POST /receipts/${receipt_ic_id}/complete"
              payload: {}
              as: WarehouseClerk
            - call: "GET /merchandise-seasons/${k_season_id}"
              payload: {}
              as: PlanningLead
            - call: "GET /lots/${lot_ic_id}/shrink-cases"
              payload: {}
              as: ShrinkAuditor
          assert:
            - "the completion response itself carries status RECEIVED"
            - "the immediately-following season read shows spent_forward_cents == 4612500 (no reconciliation lag)"
            - "the immediately-following shrink-case list shows 1 OPEN case with units_untraceable == 10"
            - "Receipt.${receipt_ic_id}.version == 2 (mutation bumped the receipt's own version)"
