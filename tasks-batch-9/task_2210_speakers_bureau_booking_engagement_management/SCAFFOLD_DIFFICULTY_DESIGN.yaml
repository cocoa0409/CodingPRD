              as: BookingAgent
              as_user_id: "agent-01"
              captures: { ct_b: $.data.id }
            - call: "POST /contracts/${ct_b}/send"
              payload: {}
              as: BookingAgent
              as_user_id: "agent-01"
            - call: "POST /contracts/${ct_b}/sign"
              payload: { signature_name: "Dana Reyes" }
              as: Speaker
              as_user_id: "${sp}"
            - call: "POST /contracts/${ct_b}/sign"
