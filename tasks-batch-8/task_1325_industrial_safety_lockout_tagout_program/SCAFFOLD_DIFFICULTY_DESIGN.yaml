      - name: auditor_double_booking_closed_interval
        grounds:
          - validations[priority=16]
          - errors[ERR_AUDITOR_DOUBLE_BOOKED]
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource (Employee
          auditor, not Machine): audit windows are CLOSED intervals, so a
          second SCHEDULED audit starting exactly when the first ends
          (12:00:00Z touching 12:00:00Z) conflicts, while starting one second
          later (12:00:01Z) is accepted — opposite adjacency treatment from
          the machine-session rule.
        test_recipe:
          setup:
            - "Machine M with ACTIVE procedure P; qualified auditor W2 (AUTHORIZED + current training, not a period applier)"
          setup_api_calls:
            - call: "POST /employees"
              payload: { employee_no: "E-MGR-DB", full_name: "Mgr DB", qualification: "AUTHORIZED" }
              as: EHSManager
