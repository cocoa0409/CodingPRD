          assert:
            - "both calls return 201 with data.verification_status == PENDING, verified_by_user_id null and version 1"
            - "InsuranceCertificate.${cert_now_id}.lifecycle_status == CURRENT (2026-07-01 <= clock < 2027-07-01, and 334 days to expiry exceeds EXPIRING_SOON_DAYS 30)"
            - "InsuranceCertificate.${cert_future_id}.lifecycle_status == NOT_YET_EFFECTIVE (clock < 2026-10-01)"
            - "InsuranceCertificate.${cert_now_id}.available_aggregate == 2000000 (aggregate_limit minus 250000 * 0 open severe incidents)"
            - "data.additional_insured == false and data.waiver_of_subrogation == false on both rows (declared defaults)"
            - "Contractor.${con_id}.verified_coverage_types == [] - PENDING rows never count as coverage"

      - name: rejected_safety_statistic_cannot_be_verified_again
