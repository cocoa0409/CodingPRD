      - a re-read of the order yields a version that lets the 2-lite draw through, ending at available_stock_lites 2
  - name: derived_counters_reconcile_after_each_contributing_write
    claim_type: derived_field_reconciliation
    grounds:
    - entities.FabricationRelease.fields.lot_count
    - entities.GlassOrder.fields.allocated_lites
    - calculations.glass_lite_ledger
    - calculations.zone_crew_hour_ledger
