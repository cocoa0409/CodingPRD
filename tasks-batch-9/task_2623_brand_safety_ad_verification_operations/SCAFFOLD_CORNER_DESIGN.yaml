      - name: methodology_lapse_is_keyed_on_window_start_and_flips_the_version
        claim_type: temporal_validation
        grounds:
          - validations.priority_13
          - state_machines.MethodologyVersion.PROVISIONAL_to_LAPSED
          - errors[ERR_METHODOLOGY_LAPSED]
        distinguishing_aspect: |
          Two different temporal facts are pinned at once and they must not be
          confused. (a) Validation 13 asks whether the batch's WINDOW_START
          falls inside the pinned version's half-open window - so a batch whose
          window STRADDLES effective_to (start 2026-08-04T23:30:00Z, end
          2026-08-05T00:30:00Z) is perfectly scorable while the clock is still
          before effective_to. (b) The system PROVISIONAL -> LAPSED transition
          fires off the LOGICAL CLOCK reaching effective_to, as the first step
          of the scoring request, and then rejects that same request. An
          implementation keying (a) off window_end, or keying (b) off
          window_start, gets one of the two calls wrong.
