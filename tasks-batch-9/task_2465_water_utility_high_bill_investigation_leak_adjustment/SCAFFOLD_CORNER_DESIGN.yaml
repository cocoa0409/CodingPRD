            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_y_id}", read_date: "2025-06-30", read_type: "CORRECTED", reading_value: 102000, corrects_reading_id: "${read_y_end_id}" }
              as: MeterTechnician
