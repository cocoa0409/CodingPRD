    side_effects: ["status = OPEN, opened_at stamped, blocks_acceptance derived, retainage_hold_cents frozen", "CxProject.retainage_withheld_cents grows", "recomputes issue_severity_index and readiness_posture", "a blocking issue demotes its equipment and stales EQUIPMENT_VERIFICATION evidence", "increments CxProject.version by 1"]

  - method: GET
    path: "/issues"
    description: "Read the issue log; filter by project, equipment, closing retest, status, severity or origin"
    roles: [PlatformAdmin, CxAuthority, Contractor, DesignTeam, OwnerRepresentative]
    code: 200
    input: ["project_id?", "equipment_id?", "closure_retest_id?", "status?", "severity?", "origin?", "limit?", "offset?"]
    output: "Issue[]"
    side_effects: []

  - method: GET
    path: "/issues/{id}"
    description: "Read one issue"
    roles: [PlatformAdmin, CxAuthority, Contractor, DesignTeam, OwnerRepresentative]
    code: 200
    input: []
    output: Issue
    side_effects: []

  - method: POST
    path: "/issues/{id}/propose-resolution"
    description: "Contractor proposes a corrective action, moving the issue to IN_REVIEW"
    roles: [Contractor]
    code: 200
    input: [proposed_resolution]
