      - name: sell_empty_lot_zero_head_count
        grounds:
          - errors[ERR_EMPTY_LOT]
          - state_machines.SaleLot.OPEN_to_SOLD
          - entities.SaleLot.fields.head_count
        distinguishing_aspect: "Empty-collection boundary on a different metric/endpoint: selling a lot whose head_count == 0 (zero attached tickets) is rejected with ERR_EMPTY_LOT — an empty-set edge distinct from the numeric capacity threshold above."
