            - "the 2-unit confirm returns HTTP 200: CustomCakeOrder.${cake_small_id}.order_status == CONFIRMED (8 + 2 == 10, equality passes)"
            - "PickupSlot.${slot_id}.reserved_decoration_units == 10 — only CONFIRMED orders are summed, the INTAKE order contributes nothing"
            - "CustomCakeOrder.${cake_big_id}.decoration_units == 8, ${cake_mid_id}.decoration_units == 4, ${cake_small_id}.decoration_units == 2"

      - name: thaw_and_serve_labor_applies_the_quarter_method_factor_to_two_decimals
        claim_type: weighted_scoring
        grounds:
          - calculations.run_labor_minutes
          - entities.ProductionRun.fields.planned_labor_minutes
