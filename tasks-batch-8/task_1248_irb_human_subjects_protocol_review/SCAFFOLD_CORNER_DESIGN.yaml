# =============================================================================
# Task 1248: IRB Human Subjects Protocol Review — §1.9 Scaffold Corner Design
# Breadth coverage of every testable claim in SCAFFOLD.yaml §1.1–§1.7 that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) does not already cover.
# Sections/claim_types follow references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: protocol_create_applies_defaults_and_system_fields
        claim_type: defaults
        grounds: [entities.Protocol.fields.involves_prisoners, entities.Protocol.fields.is_industry_sponsored, entities.Protocol.fields.status]
        distinguishing_aspect: "Omitting optional booleans yields false/false; system fields are server-minted with version == 1 and initial status == DRAFT."
        test_recipe:
          setup: ["One investigator with training valid past the default clock"]
          setup_api_calls:
            - call: "POST /irb/investigators"
              payload: { full_name: "Dr Default", email: "default@univ.edu", department: "Math", training_expires_at: "2027-01-01T00:00:00Z" }
              as: IrbAdmin
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /irb/protocols"
              payload: { title: "Defaults Study", claimed_review_level: "EXEMPT", risk_level: "MINIMAL" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { proto_id: $.data.id, proto_v: $.data.version }
          assert:
            - "Protocol.${proto_id}.involves_prisoners == false"
            - "Protocol.${proto_id}.is_industry_sponsored == false"
            - "Protocol.${proto_id}.status == DRAFT"
            - "Protocol.${proto_id}.version == 1 and id is a server-minted UUID"
            - "Protocol.${proto_id}.pi_id == ${inv_id}"

      - name: protocol_create_missing_title_returns_400
        claim_type: required_fields
        grounds: [entities.Protocol.fields.title, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting the required input field title is rejected with ERR_VALIDATION (400); no row is persisted."
        test_recipe:
          setup: ["One investigator exists"]
          setup_api_calls:
            - call: "POST /irb/investigators"
              payload: { full_name: "Dr Req", email: "req@univ.edu", department: "Math", training_expires_at: "2027-01-01T00:00:00Z" }
              as: IrbAdmin
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /irb/protocols"
              payload: { claimed_review_level: "EXEMPT", risk_level: "MINIMAL" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Rejected with error_id ERR_VALIDATION (http 400)"
            - "GET /irb/protocols?pi_id=${inv_id} returns an empty list"

      - name: protocol_create_invalid_review_level_rejected
        claim_type: type_constraints
        grounds: [entities.Protocol.fields.claimed_review_level, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "An enum value outside {EXEMPT, EXPEDITED, FULL_BOARD} is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["One investigator exists"]
          setup_api_calls:
            - call: "POST /irb/investigators"
              payload: { full_name: "Dr Enum", email: "enum@univ.edu", department: "Math", training_expires_at: "2027-01-01T00:00:00Z" }
              as: IrbAdmin
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /irb/protocols"
              payload: { title: "Bad Enum", claimed_review_level: "LIGHTSPEED", risk_level: "MINIMAL" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Rejected with error_id ERR_VALIDATION (http 400)"

      - name: consent_document_version_seq_increments_per_protocol
        claim_type: computed_fields
        grounds: [entities.ConsentDocument.fields.version_seq]
        distinguishing_aspect: "version_seq is system-assigned as 1 + max(existing): two uploads to the same protocol yield 1 then 2 regardless of the file_ref supplied."
        test_recipe:
          setup: ["One investigator and one DRAFT protocol"]
          setup_api_calls:
            - call: "POST /irb/investigators"
              payload: { full_name: "Dr Seq", email: "seq@univ.edu", department: "Math", training_expires_at: "2027-01-01T00:00:00Z" }
              as: IrbAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /irb/protocols"
              payload: { title: "Seq Study", claimed_review_level: "EXPEDITED", risk_level: "MINIMAL" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { proto_id: $.data.id }
          trigger:
            - call: "POST /irb/protocols/${proto_id}/consent-documents"
              payload: { file_ref: "s3://consent/a.pdf" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { cd1: $.data.id }
            - call: "POST /irb/protocols/${proto_id}/consent-documents"
              payload: { file_ref: "s3://consent/b.pdf" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { cd2: $.data.id }
          assert:
            - "ConsentDocument.${cd1}.version_seq == 1"
            - "ConsentDocument.${cd2}.version_seq == 2"
            - "Both documents have status == SUBMITTED (initial state)"

      - name: list_protocols_filtered_by_pi_with_pagination_envelope
        claim_type: listing
        grounds: ["endpoints[GET /irb/protocols]", response_envelope]
        distinguishing_aspect: "Filtered list returns only the caller's protocols and honors limit/offset with total_count and has_more per the fixed envelope."
        test_recipe:
          setup: ["Two investigators; PI-A owns two protocols, PI-B owns one"]
          setup_api_calls:
            - call: "POST /irb/investigators"
              payload: { full_name: "Dr Page A", email: "pagea@univ.edu", department: "Math", training_expires_at: "2027-01-01T00:00:00Z" }
              as: IrbAdmin
              captures: { inv_a: $.data.id }
            - call: "POST /irb/investigators"
              payload: { full_name: "Dr Page B", email: "pageb@univ.edu", department: "Math", training_expires_at: "2027-01-01T00:00:00Z" }
              as: IrbAdmin
              captures: { inv_b: $.data.id }
            - call: "POST /irb/protocols"
              payload: { title: "A1", claimed_review_level: "EXEMPT", risk_level: "MINIMAL" }
              as: PrincipalInvestigator
              as_user_id: "${inv_a}"
            - call: "POST /irb/protocols"
              payload: { title: "A2", claimed_review_level: "EXEMPT", risk_level: "MINIMAL" }
              as: PrincipalInvestigator
              as_user_id: "${inv_a}"
            - call: "POST /irb/protocols"
              payload: { title: "B1", claimed_review_level: "EXEMPT", risk_level: "MINIMAL" }
              as: PrincipalInvestigator
              as_user_id: "${inv_b}"
          trigger:
            - call: "GET /irb/protocols?pi_id=${inv_a}&limit=1&offset=0"
              as: IrbCoordinator
          assert:
            - "Response data has exactly 1 row (limit honored) with total_count == 2 and has_more == true"
            - "Second page GET /irb/protocols?pi_id=${inv_a}&limit=1&offset=1 returns the other row with has_more == false"
            - "No row with pi_id == ${inv_b} appears in either page"

      - name: get_missing_top_level_entities_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_INVESTIGATOR_NOT_FOUND]", "errors[ERR_MEMBER_NOT_FOUND]", "errors[ERR_PROTOCOL_NOT_FOUND]", "errors[ERR_CONSENT_DOC_NOT_FOUND]", "errors[ERR_MEETING_NOT_FOUND]", "errors[ERR_RELIANCE_NOT_FOUND]"]
        distinguishing_aspect: "Each single-resource GET with a well-formed but absent UUID returns the resource-specific 404 error, not a generic 404."
        test_recipe:
          setup: ["Empty DB aside from one anchor investigator"]
          setup_api_calls:
            - call: "POST /irb/investigators"
              payload: { full_name: "Dr Anchor", email: "anchor@univ.edu", department: "Math", training_expires_at: "2027-01-01T00:00:00Z" }
              as: IrbAdmin
          trigger:
            - call: "GET /irb/investigators/00000000-0000-0000-0000-000000000000"
              as: IrbAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /irb/irb-members/00000000-0000-0000-0000-000000000000"
              as: IrbAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /irb/protocols/00000000-0000-0000-0000-000000000000"
              as: IrbAdmin
              captures: { e3: $.data.error_id }
            - call: "GET /irb/consent-documents/00000000-0000-0000-0000-000000000000"
              as: IrbAdmin
              captures: { e4: $.data.error_id }
            - call: "GET /irb/board-meetings/00000000-0000-0000-0000-000000000000"
              as: IrbAdmin
              captures: { e5: $.data.error_id }
            - call: "GET /irb/reliance-agreements/00000000-0000-0000-0000-000000000000"
              as: IrbAdmin
              captures: { e6: $.data.error_id }
          assert:
            - "e1 == ERR_INVESTIGATOR_NOT_FOUND, e2 == ERR_MEMBER_NOT_FOUND, e3 == ERR_PROTOCOL_NOT_FOUND (all http 404)"
            - "e4 == ERR_CONSENT_DOC_NOT_FOUND, e5 == ERR_MEETING_NOT_FOUND, e6 == ERR_RELIANCE_NOT_FOUND (all http 404)"

      - name: get_missing_review_workflow_entities_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_ASSIGNMENT_NOT_FOUND]", "errors[ERR_DECLARATION_NOT_FOUND]", "errors[ERR_AGENDA_ITEM_NOT_FOUND]", "errors[ERR_MODIFICATION_NOT_FOUND]", "errors[ERR_CR_NOT_FOUND]", "errors[ERR_AE_NOT_FOUND]", "errors[ERR_CASE_NOT_FOUND]"]
        distinguishing_aspect: "Workflow child entities also surface resource-specific 404 errors on single GET."
        test_recipe:
          setup: ["Empty DB aside from one anchor investigator"]
          setup_api_calls:
            - call: "POST /irb/investigators"
              payload: { full_name: "Dr Anchor2", email: "anchor2@univ.edu", department: "Math", training_expires_at: "2027-01-01T00:00:00Z" }
              as: IrbAdmin
          trigger:
            - call: "GET /irb/review-assignments/00000000-0000-0000-0000-000000000000"
              as: IrbAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /irb/conflict-declarations/00000000-0000-0000-0000-000000000000"
              as: IrbAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /irb/agenda-items/00000000-0000-0000-0000-000000000000"
              as: IrbAdmin
              captures: { e3: $.data.error_id }
            - call: "GET /irb/modifications/00000000-0000-0000-0000-000000000000"
              as: IrbAdmin
              captures: { e4: $.data.error_id }
            - call: "GET /irb/continuing-reviews/00000000-0000-0000-0000-000000000000"
              as: IrbAdmin
              captures: { e5: $.data.error_id }
            - call: "GET /irb/adverse-events/00000000-0000-0000-0000-000000000000"
              as: IrbAdmin
              captures: { e6: $.data.error_id }
            - call: "GET /irb/non-compliance-cases/00000000-0000-0000-0000-000000000000"
              as: IrbAdmin
              captures: { e7: $.data.error_id }
          assert:
            - "e1 == ERR_ASSIGNMENT_NOT_FOUND, e2 == ERR_DECLARATION_NOT_FOUND, e3 == ERR_AGENDA_ITEM_NOT_FOUND"
            - "e4 == ERR_MODIFICATION_NOT_FOUND, e5 == ERR_CR_NOT_FOUND, e6 == ERR_AE_NOT_FOUND, e7 == ERR_CASE_NOT_FOUND (all http 404)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: withdraw_from_approved_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Protocol.APPROVED_to_SUSPENDED, state_machines.Protocol.DRAFT_to_WITHDRAWN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "WITHDRAWN is reachable only from {DRAFT, SUBMITTED, RETURNED}; withdrawing an APPROVED protocol fails with ERR_INVALID_STATE and leaves the protocol untouched."
        test_recipe:
          setup: ["Protocol P APPROVED via the expedited track"]
          setup_api_calls:
            - call: "POST /irb/investigators"
              payload: { full_name: "Dr WD", email: "wd@univ.edu", department: "Math", training_expires_at: "2027-01-01T00:00:00Z" }
              as: IrbAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Chair WD", email: "chairwd@univ.edu", member_category: "SCIENTIST", is_chair: true }
              as: IrbAdmin
              captures: { chair_id: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Rev W1", email: "revw1@univ.edu", member_category: "SCIENTIST" }
              as: IrbAdmin
              captures: { r1: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Rev W2", email: "revw2@univ.edu", member_category: "NON_SCIENTIST" }
              as: IrbAdmin
              captures: { r2: $.data.id }
            - call: "POST /irb/protocols"
              payload: { title: "WD Study", claimed_review_level: "EXPEDITED", risk_level: "MINIMAL" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { p: $.data.id }
            - call: "POST /irb/protocols/${p}/consent-documents"
              payload: { file_ref: "s3://consent/wd.pdf" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { cd: $.data.id }
            - call: "POST /irb/consent-documents/${cd}/review"
              payload: { outcome: "APPROVE" }
              as: IrbChair
              as_user_id: "${chair_id}"
            - call: "POST /irb/protocols/${p}/submit"
              payload: {}
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
            - call: "POST /irb/protocols/${p}/determinations"
              payload: { determined_review_level: "EXPEDITED" }
              as: IrbCoordinator
            - call: "POST /irb/protocols/${p}/review-assignments"
              payload: { reviewer_id: "${r1}", reviewer_role: "PRIMARY" }
              as: IrbCoordinator
              captures: { a1: $.data.id }
            - call: "POST /irb/protocols/${p}/review-assignments"
              payload: { reviewer_id: "${r2}", reviewer_role: "SECONDARY" }
              as: IrbCoordinator
              captures: { a2: $.data.id }
            - call: "POST /irb/review-assignments/${a1}/respond"
              payload: { response: "ACCEPT" }
              as: Reviewer
              as_user_id: "${r1}"
            - call: "POST /irb/review-assignments/${a2}/respond"
              payload: { response: "ACCEPT" }
              as: Reviewer
              as_user_id: "${r2}"
            - call: "POST /irb/review-assignments/${a1}/recommendations"
              payload: { recommendation: "APPROVE" }
              as: Reviewer
              as_user_id: "${r1}"
            - call: "POST /irb/review-assignments/${a2}/recommendations"
              payload: { recommendation: "APPROVE" }
              as: Reviewer
              as_user_id: "${r2}"
            - call: "POST /irb/protocols/${p}/expedited-determination"
              payload: { outcome: "APPROVE" }
              as: IrbChair
              as_user_id: "${chair_id}"
          trigger:
            - call: "POST /irb/protocols/${p}/withdraw"
              payload: {}
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Rejected with error_id ERR_INVALID_STATE (http 409)"
            - "Protocol.${p}.status == APPROVED"

      - name: disapproved_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Protocol.AWAITING_FULL_BOARD_to_DISAPPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From terminal DISAPPROVED no transition exists: a subsequent submit and a subsequent determination both fail with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "5 ACTIVE members (threshold 3); protocol P AWAITING_FULL_BOARD and LISTED on meeting M"
            - "M convened with attendees {chair, nonsci, unaff} (eligible_voter_count 3)"
          setup_api_calls:
            - call: "POST /irb/investigators"
              payload: { full_name: "Dr Term", email: "term@univ.edu", department: "Math", training_expires_at: "2027-01-01T00:00:00Z" }
              as: IrbAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Chair T", email: "chairt@univ.edu", member_category: "SCIENTIST", is_chair: true }
              as: IrbAdmin
              captures: { chair_id: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Sci T", email: "scit@univ.edu", member_category: "SCIENTIST" }
              as: IrbAdmin
              captures: { sci: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "NS T", email: "nst@univ.edu", member_category: "NON_SCIENTIST" }
              as: IrbAdmin
              captures: { nonsci: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "UN T", email: "unt@univ.edu", member_category: "UNAFFILIATED" }
              as: IrbAdmin
              captures: { unaff: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "PR T", email: "prt@univ.edu", member_category: "PRISONER_REPRESENTATIVE" }
              as: IrbAdmin
              captures: { pris: $.data.id }
            - call: "POST /irb/protocols"
              payload: { title: "Terminal Study", claimed_review_level: "FULL_BOARD", risk_level: "GREATER_THAN_MINIMAL" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { p: $.data.id }
            - call: "POST /irb/protocols/${p}/consent-documents"
              payload: { file_ref: "s3://consent/term.pdf" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { cd: $.data.id }
            - call: "POST /irb/consent-documents/${cd}/review"
              payload: { outcome: "APPROVE" }
              as: IrbChair
              as_user_id: "${chair_id}"
            - call: "POST /irb/protocols/${p}/submit"
              payload: {}
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
            - call: "POST /irb/protocols/${p}/determinations"
              payload: { determined_review_level: "FULL_BOARD" }
              as: IrbCoordinator
            - call: "POST /irb/board-meetings"
              payload: { room_id: "R-TERM", scheduled_at: "2026-06-01T10:00:00Z", duration_minutes: 120 }
              as: IrbCoordinator
              captures: { mtg: $.data.id, mtg_v: $.data.version }
            - call: "POST /irb/board-meetings/${mtg}/agenda-items"
              payload: { protocol_id: "${p}", expected_meeting_version: "${mtg_v}" }
              as: IrbCoordinator
              captures: { item: $.data.id }
            - call: "POST /irb/board-meetings/${mtg}/convene"
              payload: { attendee_member_ids: ["${chair_id}", "${nonsci}", "${unaff}"] }
              as: IrbChair
              as_user_id: "${chair_id}"
          trigger:
            - call: "POST /irb/agenda-items/${item}/vote"
              payload: { motion: "APPROVE", votes_for: 1, votes_against: 2, votes_abstain: 0 }
              as: IrbChair
              as_user_id: "${chair_id}"
            - call: "POST /irb/protocols/${p}/submit"
              payload: {}
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /irb/protocols/${p}/determinations"
              payload: { determined_review_level: "EXPEDITED" }
              as: IrbCoordinator
              captures: { err2: $.data.error_id }
          assert:
            - "Vote applies: 1*2 <= 3 so the APPROVE motion fails; Protocol.${p}.status == DISAPPROVED and AgendaItem.${item}.outcome == DISAPPROVE"
            - "err1 == ERR_INVALID_STATE (submit from terminal)"
            - "err2 == ERR_INVALID_STATE (determination from terminal)"

      - name: assignment_offer_expires_via_clock_sweep
        claim_type: system_transition
        grounds: [state_machines.ReviewAssignment.OFFERED_to_EXPIRED, entities.ReviewAssignment.fields.response_deadline_at, entities.IrbMember.fields.active_assignment_count]
        distinguishing_aspect: "An OFFERED assignment created at 2026-05-01 has response_deadline_at 2026-05-08T00:00:00Z; after the clock passes the deadline the sweep moves it to EXPIRED and decrements active_assignment_count."
        test_recipe:
          setup: ["Protocol P UNDER_EXPEDITED_REVIEW; one assignment OFFERED to reviewer r1 at the default clock"]
          setup_api_calls:
            - call: "POST /irb/investigators"
              payload: { full_name: "Dr Exp", email: "exp@univ.edu", department: "Math", training_expires_at: "2027-01-01T00:00:00Z" }
              as: IrbAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Rev X1", email: "revx1@univ.edu", member_category: "SCIENTIST" }
              as: IrbAdmin
              captures: { r1: $.data.id }
            - call: "POST /irb/protocols"
              payload: { title: "Exp Study", claimed_review_level: "EXPEDITED", risk_level: "MINIMAL" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { p: $.data.id }
            - call: "POST /irb/protocols/${p}/consent-documents"
              payload: { file_ref: "s3://consent/exp.pdf" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
            - call: "POST /irb/protocols/${p}/submit"
              payload: {}
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
            - call: "POST /irb/protocols/${p}/determinations"
              payload: { determined_review_level: "EXPEDITED" }
              as: IrbCoordinator
            - call: "POST /irb/protocols/${p}/review-assignments"
              payload: { reviewer_id: "${r1}", reviewer_role: "PRIMARY" }
              as: IrbCoordinator
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-09T00:00:00Z" }
              as: IrbAdmin
          assert:
            - "ReviewAssignment.${a1}.status == EXPIRED"
            - "ReviewAssignment.${a1}.response_deadline_at == 2026-05-08T00:00:00Z"
            - "IrbMember.${r1}.active_assignment_count == 0"

      - name: expedited_disapprove_forces_full_board_referral
        claim_type: precondition_enforcement
        grounds: [state_machines.Protocol.UNDER_EXPEDITED_REVIEW_to_AWAITING_FULL_BOARD, "errors[ERR_EXPEDITED_DISAPPROVE_REQUIRES_BOARD]", "validations[priority=10]"]
        distinguishing_aspect: "With a non-voided DISAPPROVE recommendation on file, expedited APPROVE is rejected (only a convened board may disapprove); the chair's escape hatch is REFER_TO_FULL_BOARD."
        test_recipe:
          setup: ["Protocol P UNDER_EXPEDITED_REVIEW; two SUBMITTED recommendations, one of them DISAPPROVE"]
          setup_api_calls:
            - call: "POST /irb/investigators"
              payload: { full_name: "Dr Disp", email: "disp@univ.edu", department: "Math", training_expires_at: "2027-01-01T00:00:00Z" }
              as: IrbAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Chair DI", email: "chairdi@univ.edu", member_category: "SCIENTIST", is_chair: true }
              as: IrbAdmin
              captures: { chair_id: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Rev D1", email: "revd1@univ.edu", member_category: "SCIENTIST" }
              as: IrbAdmin
              captures: { r1: $.data.id }
            - call: "POST /irb/irb-members"
