          rationale: >-
            That transitive_cascade instance already verifies the four-level chain from an upheld
            case through standing, assignment suspension, pool release and directory delisting,
            including its ordering sensitivity.

      - name: trust_score_variants_diverge_on_the_same_row
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: trust_score_snapshot_vs_audited_diverge_on_pending_case
          rationale: >-
            That dual_variant_calc instance pins both variants and the delta on the same stored
            developer, including the pending-exposure and throttle terms.

      - name: consumption_thresholds_fire_at_their_boundaries
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: consumption_ratio_exactly_eighty_percent_soft_throttles
          rationale: >-
            That boundary_precision_check instance probes the soft threshold at just below,
            exactly at and just above 80 percent, and the monthly reset that clears it.

  - section: consistency_model
    instances:
      - name: derived_state_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.quota_provisioning
          - calculations.feedback_roadmap_prioritisation
        distinguishing_aspect: >-
          Nothing in this API is allowed to lag: the provisioning response already carries the
          clamped sustained rate and the burst credit derived from it, and the product read that
          follows already shows the deducted pools. The triage response is the sharper case — its
          own priority_score is computed against a demand_index that includes the very
          raw_impact this call just added, so a deferred or cached denominator would show up as
          a lower score.
