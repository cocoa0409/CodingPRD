        claim_type: violation_to_error
        grounds: ["errors[ERR_DEVICE_NOT_FOUND]", "errors[ERR_ORDER_NOT_FOUND]", "errors[ERR_ALERT_NOT_FOUND]", "errors[ERR_PATIENT_NOT_FOUND]"]
