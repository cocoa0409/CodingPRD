  - section: validations
    instances:
      - name: c_val_missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Requests without X-User-Role are rejected 401 before any role/existence logic."
        test_recipe:
          setup: ["program exists"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 50000 }, as: ProgramAdmin, captures: { prog: $.data.id } }
          trigger:
            - { call: "GET /programs/${prog}", payload: {}, captures: { err: $.data.error_id } }
          assert:
            - "no X-User-Role header -> error_id == ERR_UNAUTHENTICATED (401)"

      - name: c_val_post_missing_required_idempotency_key_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_MISSING_IDEMPOTENCY_KEY]"]
        distinguishing_aspect: "Every POST requires an Idempotency-Key header; missing key -> 400 before any business logic runs."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 50000 }, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "POST without Idempotency-Key header -> error_id == ERR_MISSING_IDEMPOTENCY_KEY (400)"

      - name: c_val_idempotent_replay_same_body_returns_original
        claim_type: satisfaction_pass
        grounds: ["validations[priority=4]"]
        distinguishing_aspect: "Same Idempotency-Key + byte-identical body replays the ORIGINAL response: same program id, no second row, no second version bump."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 50000 }, as: ProgramAdmin, captures: { id1: $.data.id } }
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 50000 }, as: ProgramAdmin, captures: { id2: $.data.id } }
            - { call: "GET /programs/${id1}/markets", payload: {}, as: ProgramAdmin }
          assert:
            - "both calls use Idempotency-Key: K-1; second response id == first response id (replay, not re-execution)"
            - "exactly one Program exists (list endpoints show total_count 1)"

      - name: c_val_idempotency_key_reuse_different_body_conflicts
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_IDEMPOTENCY_CONFLICT]"]
        distinguishing_aspect: "Same key + DIFFERENT body is a 409 conflict, protecting the booth from double-charging under retried-but-edited requests."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 50000 }, as: ProgramAdmin }
            - { call: "POST /programs", payload: { name: "P-CHANGED", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 50000 }, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "both calls use Idempotency-Key: K-2; second (different name) -> error_id == ERR_IDEMPOTENCY_CONFLICT (409)"

