      - errors[ERR_EVENT_STATE_INVALID]
      - endpoints[POST /sourcing/events/{event_id}/shortlist-entries]
      - state_machines.MeetingEvent.DRAFT_to_REQUIREMENTS_LOCKED
      distinguishing_aspect: 'The entry''s own CANDIDATE creation is guarded by a different entity''s state: while the parent MeetingEvent is still DRAFT the venue cannot be shortlisted at all (HTTP 409 ERR_EVENT_STATE_INVALID, nothing written), and the byte-identical request succeeds immediately after lock-requirements moves the event to REQUIREMENTS_LOCKED.'
      test_recipe:
        setup:
        - Logical clock at 2026-08-05T09:00:00.000Z throughout.
        - RateBenchmark (TIER_1, USER_CONFERENCE) at 260.00 ADR.
