            - { call: "POST /api/projects", payload: { property_id: "${prop1}", survey_id: "${surv1}", project_type: "NEW_INSTALLATION" }, as: ProjectCoordinator, captures: { proj1: $.data.id, proj1_v: $.data.version } }
            - { call: "PATCH /api/projects/${proj1}", payload: { product_model_id: "${mdl}", lead_installer_technician_id: "${t_inst}", expected_project_version: "${proj1_v}" }, as: ProjectCoordinator }
