          assert:
            - "trigger call 1 returns 409 with error.code == ERR_PERFORMANCE_WINDOW_BUFFER_VIOLATION - the window is CLOSED, so starting at the sibling's performance_end instant is zero clear hours, not 72"
            - "trigger call 2 returns 409 ERR_PERFORMANCE_WINDOW_BUFFER_VIOLATION - 2026-12-01T00:00:00Z to 2026-12-03T23:59:59Z is 71 hours 59 minutes 59 seconds of clear time, one second short of MOBILIZATION_BUFFER_HOURS"
            - "trigger call 3 returns 201 - 2026-12-01T00:00:00Z to 2026-12-04T00:00:00Z is exactly 72 clear hours, so the boundary is inclusive - and Subcontract.${sub2}.contract_status == ACTIVE"
            - "trigger calls 1 and 2 wrote nothing, so trigger call 3 still satisfies the optimistic-concurrency rule with the same ${wpv2}"
            - "trigger call 5 returns 200 with Subcontract.${sub1}.contract_status == TERMINATED_FOR_DEFAULT, unpaid_committed_amount == 500000.00 and replacement_cost_amount == 575000.00"
            - "trigger call 7 returns 201 even though [2026-09-15T00:00:00Z, 2026-10-15T00:00:00Z] sits entirely inside the terminated ${sub1} window, because TERMINATED_FOR_DEFAULT siblings are outside the blocking set"
            - "Subcontract.${sub3}.contract_status == ACTIVE and its window clears ${sub2} by far more than 72 hours"
            - "GET /subcontracts?work_package_id=${wp} returns exactly 3 rows and GET /subcontracts?work_package_id=${wp}&contract_status=ACTIVE returns exactly 2"
            - "CmarProject.${proj}.construction_contingency_remaining == 165000.00 (the 75000.00 replacement premium from the ${sub1} termination) and contingency_drawn_to_cost_total == 75000.00"
            - "CmarProject.${proj}.contingency_posture == OPEN because 165000.00 / 240000.00 == 0.6875 is not <= 0.10"

  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: contingency_draw_post_then_void_restores_the_seven_term_gmp_identity
        grounds:
          - calculations.gmp_price_conservation
          - state_machines.ContingencyDraw.POSTED_to_VOIDED
          - entities.CmarProject.fields.contingency_drawn_to_cost_total
          - entities.CmarProject.fields.construction_contingency_remaining
          - calculations.contingency_posture_derivation
        distinguishing_aspect: |
          Posting a draw moves two of the seven conserved terms in opposite directions and
          voiding it must move both back exactly, leaving all seven byte-identical to their
          pre-post values with no residue - the drawn-to-cost total must return to 0.00 rather
          than keeping the spend, and gmp_amount must never have moved at all. The instance
          checks the identity at three points (before, between, after), so an implementation
          that voids by subtracting from the pot without also unwinding the drawn total keeps
          the sum balanced only by accident and fails the middle check.
        test_recipe:
          setup:
            - "one CmarProject 'Riverside Regional Hospital Tower' with gmp_status EXECUTED at gmp_amount 46105590.83, cost_of_work_budget_total 40000000.00, general_conditions_total 2500000.00, insurance_amount 551171.88, cm_fee_amount 1614418.95, owner_contingency_remaining 1200000.00, construction_contingency_remaining 240000.00, contingency_drawn_to_cost_total 0.00"
            - "one REQUESTED CONSTRUCTION ContingencyDraw of 50000.00 with requires_owner_approval false"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Riverside Regional Hospital Tower", owner_org: "Riverside Health District", cm_fee_pct: 0.0375, insurance_rate: 0.0125, precon_fee_amount: 250000.00 }
              as: ProgramAdmin
              captures: { proj: $.data.id, projv1: $.data.version }
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "CD_100", submitted_cost_of_work: 40000000.00, expected_project_version: "${projv1}" }
              as: ConstructionManager
              captures: { est: $.data.id }
            - call: "POST /estimates/${est}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /estimates/${est}/reconcile"
              payload: { decision: "ACCEPT" }
              as: OwnerRepresentative
            - call: "GET /projects/${proj}"
              payload: {}
              as: ConstructionManager
              captures: { projv2: $.data.version }
            - call: "POST /gmp-proposals"
              payload: { project_id: "${proj}", based_on_estimate_id: "${est}", cost_of_work_total: 40000000.00, general_conditions_total: 2500000.00, owner_contingency_amount: 1200000.00, construction_contingency_amount: 240000.00, expected_project_version: "${projv2}" }
              as: ConstructionManager
              captures: { prop: $.data.id }
            - call: "POST /gmp-proposals/${prop}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /gmp-proposals/${prop}/decide"
              payload: { decision: "EXECUTE" }
              as: OwnerRepresentative
            - call: "POST /change-events"
              payload: { project_id: "${proj}", description: "winter protection for the podium slab pours", estimated_amount: 50000.00, origin: "FIELD_CONDITION" }
              as: ConstructionManager
              as_user_id: "cm-pm-1"
              captures: { ce: $.data.id }
            - call: "POST /change-events/${ce}/submit"
              payload: {}
              as: ConstructionManager
              as_user_id: "cm-pm-1"
            - call: "POST /change-events/${ce}/review"
              payload: { action: "BEGIN_REVIEW" }
              as: OwnerRepresentative
              as_user_id: "owner-rep-1"
            - call: "POST /change-events/${ce}/classify"
              payload: { classification: "CONTINGENCY_USE_CONSTRUCTION", classification_note: "CM means and methods risk" }
              as: OwnerRepresentative
              as_user_id: "owner-rep-1"
            - call: "GET /contingency-draws"
              payload: { project_id: "${proj}", change_event_id: "${ce}" }
              as: ConstructionManager
              captures: { draw: "$.data[0].id", draw_amount: "$.data[0].amount" }
          trigger:
            - call: "POST /contingency-draws/${draw}/post"
              payload: {}
              as: ConstructionManager
            - call: "GET /projects/${proj}"
              payload: {}
              as: OwnerRepresentative
              captures: { mid_cc: $.data.construction_contingency_remaining, mid_drawn: $.data.contingency_drawn_to_cost_total, mid_gmp: $.data.gmp_amount }
            - call: "POST /contingency-draws/${draw}/void"
              payload: { void_reason: "the winter protection was absorbed by the trade contractor" }
              as: OwnerRepresentative
          assert:
            - "${draw_amount} == 50000.00"
            - "before the post the identity holds: 40000000.00 + 2500000.00 + 551171.88 + 1614418.95 + 1200000.00 + 240000.00 + 0.00 == 46105590.83"
            - "${mid_cc} == 190000.00 and ${mid_drawn} == 50000.00 and ${mid_gmp} == 46105590.83"
            - "between the post and the void the identity still holds: 40000000.00 + 2500000.00 + 551171.88 + 1614418.95 + 1200000.00 + 190000.00 + 50000.00 == 46105590.83"
            - "ContingencyDraw.${draw}.status == VOIDED, voided_at == 2026-08-01T00:00:00Z and void_reason is the supplied string"
            - "after the void CmarProject.${proj}.construction_contingency_remaining == 240000.00 and contingency_drawn_to_cost_total == 0.00 - exactly the pre-post values, with no residue"
            - "after the void CmarProject.${proj}.owner_contingency_remaining == 1200000.00, insurance_amount == 551171.88, cm_fee_amount == 1614418.95, cost_of_work_budget_total == 40000000.00 and general_conditions_total == 2500000.00 are all unchanged"
            - "CmarProject.${proj}.gmp_amount == 46105590.83 at all three observation points"
            - "CmarProject.${proj}.contingency_posture == OPEN"
            - "ChangeEvent.${ce}.status == CLASSIFIED and classification == CONTINGENCY_USE_CONSTRUCTION (voiding the draw does not un-classify the event)"
            - "a second POST /contingency-draws/${draw}/void returns 409 ERR_DRAW_STATE_INVALID, so the compensation is not repeatable and cannot double-refill the pot"

      - name: allowance_reconcile_then_reverse_restores_the_unit_ledger_but_not_the_sequence
        grounds:
          - calculations.allowance_unit_conservation
          - state_machines.QualificationItem.PARTIALLY_RECONCILED_to_OPEN
          - validations.priority_113_ERR_ALLOWANCE_REVERSAL_INVALID
          - entities.QualificationItem.fields.reconciliation_seq
          - entities.QualificationItem.fields.last_action
        distinguishing_aspect: |
          The compensating REVERSE restores four ledger fields exactly - remaining_units,
          reconciled_units, reconciled_amount and variance_amount - and re-derives status back
          to OPEN, yet reconciliation_seq deliberately does NOT rewind because it counts
          RECONCILE actions ever posted. So the invariant allocated_units == remaining_units +
          reconciled_units is restored while the audit counter is monotonic, and a second
          REVERSE is refused because last_action is no longer RECONCILE. The units here are
          discrete quantities, not currency, which is what separates this instance from the
          money-conservation one.
        test_recipe:
          setup:
            - "one CmarProject 'Harborview Clinic' with gmp_status EXECUTED"
            - "one ALLOWANCE QualificationItem on the executed proposal with allowance_amount 60000.00 over allocated_units 1200 SF, so allowance_unit_rate is 50.0000"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01, precon_fee_amount: 25000.00 }
              as: ProgramAdmin
              captures: { proj: $.data.id, projv1: $.data.version }
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "CD_100", submitted_cost_of_work: 1000000.00, expected_project_version: "${projv1}" }
              as: ConstructionManager
              captures: { est: $.data.id }
            - call: "POST /estimates/${est}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /estimates/${est}/reconcile"
              payload: { decision: "ACCEPT" }
              as: OwnerRepresentative
            - call: "GET /projects/${proj}"
              payload: {}
              as: ConstructionManager
              captures: { projv2: $.data.version }
            - call: "POST /gmp-proposals"
              payload: { project_id: "${proj}", based_on_estimate_id: "${est}", cost_of_work_total: 1000000.00, general_conditions_total: 100000.00, owner_contingency_amount: 50000.00, construction_contingency_amount: 40000.00, expected_project_version: "${projv2}" }
              as: ConstructionManager
              captures: { prop: $.data.id }
            - call: "POST /qualification-items"
              payload: { gmp_proposal_id: "${prop}", item_type: "ALLOWANCE", text: "decorative terrazzo flooring at the lobby", allowance_amount: 60000.00, allocated_units: 1200, unit_of_measure: "SF" }
              as: ConstructionManager
              captures: { item: $.data.id, unit_rate: $.data.allowance_unit_rate }
            - call: "POST /gmp-proposals/${prop}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /gmp-proposals/${prop}/decide"
              payload: { decision: "EXECUTE" }
              as: OwnerRepresentative
          trigger:
            - call: "POST /qualification-items/${item}/allowance-reconciliation"
              payload: { action: "RECONCILE", units: 500, actual_unit_cost: 58.00, overrun_authorized: true }
              as: ConstructionManager
              captures: { booked_amount: $.data.reconciled_amount, booked_variance: $.data.variance_amount, booked_status: $.data.status, booked_seq: $.data.reconciliation_seq }
            - call: "POST /qualification-items/${item}/allowance-reconciliation"
              payload: { action: "REVERSE" }
              as: ConstructionManager
            - call: "POST /qualification-items/${item}/allowance-reconciliation"
              payload: { action: "REVERSE" }
              as: ConstructionManager
          assert:
            - "${unit_rate} == 50.0000 (60000.00 / 1200 quantised to four places)"
            - "${booked_amount} == 29000.00 (round_half_up(500 * 58.00, 2))"
            - "${booked_variance} == 4000.00 (29000.00 - round_half_up(500 * 50.0000, 2) == 29000.00 - 25000.00)"
            - "${booked_status} == PARTIALLY_RECONCILED and ${booked_seq} == 1"
            - "after trigger call 1 the invariant holds: 1200 == 700 + 500"
            - "trigger call 2 returns 200 with QualificationItem.${item}.remaining_units == 1200, reconciled_units == 0, reconciled_amount == 0.00 and variance_amount == 0.00 - the four ledger fields are back to their pre-RECONCILE values"
            - "after trigger call 2 the invariant holds again: 1200 == 1200 + 0"
            - "QualificationItem.${item}.status == OPEN (re-derived from reconciled_units == 0, not stored blindly)"
            - "QualificationItem.${item}.reconciliation_seq == 1, NOT 0 - the counter is monotonic in RECONCILE actions ever posted"
            - "QualificationItem.${item}.last_action == REVERSE"
            - "trigger call 3 returns 422 with error.code == ERR_ALLOWANCE_REVERSAL_INVALID because last_action is REVERSE, so the compensation cannot be applied twice and the units cannot exceed allocated_units"
            - "QualificationItem.${item}.allowance_amount == 60000.00 and allocated_units == 1200 are untouched throughout"
