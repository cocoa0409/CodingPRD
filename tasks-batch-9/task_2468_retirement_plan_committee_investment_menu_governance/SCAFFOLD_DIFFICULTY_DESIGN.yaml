              as_user_id: "${chair_id}"
            - call: "POST /governance/motions/${mo1_id}/votes"
              payload: { member_id: "${mem2_id}", vote: "FOR" }
              as: CommitteeMember
              as_user_id: "${mem2_id}"
            - call: "POST /governance/motions/${mo1_id}/close"
              payload: {}
              as: CommitteeChair
              as_user_id: "${chair_id}"
            - call: "POST /governance/committee-meetings/${m1_id}/adjourn"
