            - { call: "GET /analytics/success-rates", payload: { payer_id: "${p1}", from: "2026-08-01T00:00:00Z", to: "2026-09-01T00:00:00Z", variant: "SIMPLE" }, as: Any, captures: { rows_a: $.data.rows } }
            - { call: "GET /analytics/success-rates", payload: { payer_id: "${p1}", from: "2026-08-01T00:00:00Z", to: "2026-09-01T00:00:01Z", variant: "SIMPLE" }, as: Any, captures: { rows_b: $.data.rows } }
          assert:
            - "ap2_dec == \"2026-09-01T00:00:00Z\""
            - "rows_a[0].decided_count == 1 (decision at exactly `to` excluded)"
            - "rows_b[0].decided_count == 2 (widened `to` includes it)"

      - name: exposure_late_submission_counts_under_audit_billed
        claim_type: correct_result
        grounds: ["calculations.dollars_at_risk"]
        distinguishing_aspect: "The late-submission penalty mode: after a missed deadline + late records submission, lines sit UNDER_AUDIT with late_submission true, so GROSS counts their full billed amounts (300000) even though nothing is denied yet."
        test_recipe:
          setup: ["case misses its records deadline (two lines billed 100000/200000), then submits records late"]
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-1", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-03T00:00:00Z", billed_amount_cents: 100000 }, as: HIMCoordinator }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-2", patient_account_number: "PA-2", service_start_date: "2026-01-04T00:00:00Z", service_end_date: "2026-01-06T00:00:00Z", billed_amount_cents: 200000 }, as: HIMCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RevenueCycleAdmin }
            - { call: "GET /audit-cases/${c1}", payload: {}, as: Any, captures: { c1v: $.data.version } }
            - { call: "POST /audit-cases/${c1}/records-submissions", payload: { manifest_ref: "M-late", expected_audit_case_version: "${c1v}" }, as: HIMCoordinator }
          trigger:
            - { call: "GET /audit-cases/${c1}/exposure", payload: {}, as: Any, captures: { gross: $.data.gross_dollars_at_risk_cents, net: $.data.net_exposure_cents, late: $.data.late_submission } }
          assert:
            - "late == true"
            - "gross == 300000 (UNDER_AUDIT lines counted at billed in late mode)"
            - "net == 150000 (default 5000bp snapshot: 2 x round_half_up(billed * 0.5))"

  # ===================================================================
  # Section: validations
  # ===================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers is rejected 400 before any role or existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == \"ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER\" (the test harness omits both headers for this call)"

      - name: forbidden_role_create_payer
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "HIMCoordinator is not in POST /payers roles -> 403 ERR_FORBIDDEN_FOR_ROLE even with a well-formed body."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: HIMCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == \"ERR_FORBIDDEN_FOR_ROLE\" with http 403"

      - name: case_create_missing_required_payer_id
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field payer_id -> 400 ERR_INVALID_REQUEST before any existence check runs."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /audit-cases", payload: { audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == \"ERR_INVALID_REQUEST\""

      - name: case_create_unknown_payer_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A well-formed body referencing a nonexistent payer_id fails existence -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /audit-cases", payload: { payer_id: "00000000-0000-0000-0000-000000000000", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == \"ERR_NOT_FOUND\""

      - name: analytics_window_inverted_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=3.5]", "errors[ERR_ANALYTICS_WINDOW_INVALID]"]
        distinguishing_aspect: "from >= to -> 422 ERR_ANALYTICS_WINDOW_INVALID."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /analytics/success-rates", payload: { from: "2026-09-01T00:00:00Z", to: "2026-08-01T00:00:00Z" }, as: Any, captures: { err: $.data.error_id } }
          assert:
            - "err == \"ERR_ANALYTICS_WINDOW_INVALID\" with http 422"

      - name: determination_incomplete_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DETERMINATION_INCOMPLETE]"]
        distinguishing_aspect: "The case has two UNDER_AUDIT lines but outcomes cover only one -> 422 ERR_DETERMINATION_INCOMPLETE."
