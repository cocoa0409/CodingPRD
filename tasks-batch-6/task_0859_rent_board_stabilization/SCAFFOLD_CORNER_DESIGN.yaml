              payload: { effective_date: "2026-06-01", proposed_new_rent_cents: 306000, apply_banked: false, expected_unit_version: "${u_v1}" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_v2: $.data.version }
          assert:
            - "Unit.${u_id}.version == 2 (was 1 at creation)"
            - "Unit.${u_id}.current_lawful_rent_cents == 306000"

  # ---------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: cascade_visible_in_same_request_immediate
        claim_type: immediate
        grounds: [entities.Tenancy.fields.monthly_rent_cents]
        excluded_because:
          difficulty_instance: hearing_grant_cascade_depth3
          rationale: "The depth-3 §1.8 cascade already asserts the cascaded tenancy rent is visible immediately after the grant (immediate consistency)."

  # ---------------------------------------------------------------
  - section: errors
    instances:
      - name: error_unit_not_stabilized_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNIT_NOT_STABILIZED]"]
        excluded_because:
          difficulty_instance: tenancy_requires_unit_stabilized
          rationale: "ERR_UNIT_NOT_STABILIZED is triggered by the named §1.8 cross-entity dependency instance."
      - name: error_officer_unavailable_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_OFFICER_UNAVAILABLE]"]
        excluded_because:
          difficulty_instance: hearing_officer_buffered_overlap
          rationale: "ERR_OFFICER_UNAVAILABLE is the failure path of the named §1.8 temporal-overlap instance."
      - name: error_disclosure_required_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_DISCLOSURE_REQUIRED]"]
        excluded_because:
          difficulty_instance: disclosure_safety_outranks_relocation_fiscal
          rationale: "ERR_DISCLOSURE_REQUIRED is the winning error of the named §1.8 priority-conflict instance."
      - name: error_increase_exceeds_allowable_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_INCREASE_EXCEEDS_ALLOWABLE]"]
        excluded_because:
          difficulty_instance: increase_cap_exact_boundary
          rationale: "The +1 boundary case of the named §1.8 instance triggers ERR_INCREASE_EXCEEDS_ALLOWABLE."
      - name: error_petition_not_under_review_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_PETITION_NOT_UNDER_REVIEW]"]
        excluded_because:
          difficulty_instance: hearing_requires_petition_under_review
          rationale: "ERR_PETITION_NOT_UNDER_REVIEW is triggered by the named §1.8 instance."
      - name: error_cooling_off_expired_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_COOLING_OFF_EXPIRED]"]
        excluded_because:
          difficulty_instance: rescind_deadline_inclusive_boundary
          rationale: "The one-second-past-deadline case of the named §1.8 boundary instance triggers ERR_COOLING_OFF_EXPIRED."
      - name: error_unit_occupied_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNIT_OCCUPIED]"]
        excluded_because:
          difficulty_instance: tenancy_unit_adjacency_allowed
          rationale: "The overlapping-start counterpart of the named §1.8 adjacency instance triggers ERR_UNIT_OCCUPIED."
