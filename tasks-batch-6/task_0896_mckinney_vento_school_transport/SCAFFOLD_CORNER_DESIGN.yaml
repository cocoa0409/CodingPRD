        distinguishing_aspect: "A plan at route_miles=20 computes estimated_daily_cost_cents=3600 and estimated_monthly_cost_cents=72000 at creation."
        test_recipe:
          setup: ["A student and district exist."]
          setup_api_calls:
            - call: "POST /mv/districts"
              payload: { name: "D1", nces_code: "0601", transport_budget_cents: 100000000 }
              as: StateCoordinator
              captures: { d1: $.data.id }
            - call: "POST /mv/students"
              payload: { first_name: "Comp", last_name: "Ute", birthdate: "2012-01-01", enrolled_district_id: "${d1}", origin_district_id: "${d1}", living_situation: "SHELTER" }
              as: StateCoordinator
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /mv/transportation-plans"
              payload: { student_id: "${s1}", origin_district_id: "${d1}", serving_district_id: "${d1}", route_miles: 20 }
              as: StateCoordinator
