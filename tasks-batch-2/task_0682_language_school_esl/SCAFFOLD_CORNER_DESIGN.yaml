          setup_api_calls:
            - call: "POST /cohorts"
              payload: { name: "RB", level: "B1", track: "GENERAL", capacity: 5, weekly_hours: 18, term_start: "2026-05-04T00:00:00Z", term_end: "2026-08-01T00:00:00Z", total_sessions: 40, base_tuition_cents: 100000, schedule_block: "MORNING" }
              as: Registrar
              captures: { cid: $.data.id, cv: $.data.version }
            - call: "POST /students"
              payload: { full_name: "RB S", email: "rb@x.com", track: "GENERAL" }
              as: Registrar
              captures: { sid: $.data.id }
            - call: "POST /placement-tests"
              payload: { student_id: "${sid}" }
              as: Registrar
              captures: { ptid: $.data.id }
            - call: "POST /placement-tests/${ptid}/score"
              payload: { raw_score: 50 }
              as: Instructor
            - call: "POST /enrollments"
              payload: { student_id: "${sid}", cohort_id: "${cid}" }
              as: Registrar
              captures: { enr: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr}/confirm"
              payload: { expected_cohort_version: "${cv}", require_seat: true }
              as: Instructor
              captures: { eid: $.data.error_id }
          assert:
            - "error.error_id == ERR_FORBIDDEN"

      - name: student_cannot_cancel_other_students_addon_forbidden
        claim_type: ownership_denied
        grounds:
          - roles.Student
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Student B calling POST /add-ons/{id}/cancel on Student A's add-on (X-User-ID != owning student_id) returns ERR_FORBIDDEN 403 (entity_backed ownership)."
        test_recipe:
          setup: ["Student A owns an ACTIVE add-on; Student B attempts to cancel it."]
          setup_api_calls:
            - call: "POST /cohorts"
              payload: { name: "OwnC", level: "B1", track: "GENERAL", capacity: 5, weekly_hours: 18, term_start: "2026-05-04T00:00:00Z", term_end: "2026-08-01T00:00:00Z", total_sessions: 40, base_tuition_cents: 100000, schedule_block: "MORNING" }
              as: Registrar
              captures: { cid: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Own A", email: "owna@x.com", track: "GENERAL" }
              as: Registrar
              captures: { sa: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Own B", email: "ownb@x.com", track: "GENERAL" }
              as: Registrar
              captures: { sb: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${sa}", cohort_id: "${cid}" }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /add-ons"
              payload: { student_id: "${sa}", enrollment_id: "${enr}", add_on_type: "CONVERSATION_CLUB", units: 4 }
              as: Student
              as_user_id: "${sa}"
              captures: { aoid: $.data.id }
          trigger:
            - call: "POST /add-ons/${aoid}/cancel"
              payload: {}
              as: Student
              as_user_id: "${sb}"
              captures: { eid: $.data.error_id }
          assert:
            - "error.error_id == ERR_FORBIDDEN"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Calling POST /cohorts with no X-User-Role / X-User-ID headers returns ERR_UNAUTHENTICATED 401."
        test_recipe:
          setup: ["Empty DB; request sent without auth headers."]
          setup_api_calls: []
          trigger:
            - call: "POST /cohorts"
              payload: { name: "NoAuth", level: "B1", track: "GENERAL", capacity: 5, weekly_hours: 18, term_start: "2026-05-04T00:00:00Z", term_end: "2026-08-01T00:00:00Z", total_sessions: 40, base_tuition_cents: 100000, schedule_block: "MORNING" }
              as: Anonymous
              captures: { eid: $.data.error_id }
          assert:
            - "error.error_id == ERR_UNAUTHENTICATED"

  # =================================================================
  # Cross-Cutting Complexity Layers
  # =================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: contract_close_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[contract-close-stale-version]
          - state_machines.CorporateContract.ACTIVE_to_CLOSED
        distinguishing_aspect: "POST /corporate-contracts/{id}/close with expected_contract_version matching the live version succeeds (status CLOSED) and bumps version by 1."
        test_recipe:
          setup: ["An ACTIVE contract with no sponsored enrollments."]
          setup_api_calls:
            - call: "POST /corporate-contracts"
              payload: { company_name: "ClO", contracted_seats: 2, discount_tier: "BRONZE" }
              as: Registrar
              captures: { ctr: $.data.id, cver: $.data.version }
          trigger:
            - call: "POST /corporate-contracts/${ctr}/close"
              payload: { expected_contract_version: "${cver}" }
              as: Registrar
              captures: { st: $.data.status, nv: $.data.version }
          assert:
            - "CorporateContract.${ctr}.status == CLOSED"
            - "CorporateContract.${ctr}.version == 2"

      - name: confirm_stale_cohort_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[enroll-confirm-stale-cohort]
          - errors[ERR_STALE_COHORT_VERSION]
        distinguishing_aspect: "A confirm carrying expected_cohort_version one less than the live version (stale after a prior confirm bumped it) returns ERR_STALE_COHORT_VERSION 412."
        test_recipe:
          setup: ["A capacity-2 cohort; one student already ENROLLED (cohort version bumped); a second pending enrollment is confirmed with the stale pre-bump version."]
          setup_api_calls:
            - call: "POST /cohorts"
              payload: { name: "Stale", level: "B1", track: "GENERAL", capacity: 2, weekly_hours: 18, term_start: "2026-05-04T00:00:00Z", term_end: "2026-08-01T00:00:00Z", total_sessions: 40, base_tuition_cents: 100000, schedule_block: "MORNING" }
              as: Registrar
              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /students"
              payload: { full_name: "St A", email: "sta@x.com", track: "GENERAL" }
              as: Registrar
              captures: { sa: $.data.id }
            - call: "POST /placement-tests"
              payload: { student_id: "${sa}" }
              as: Registrar
              captures: { pta: $.data.id }
            - call: "POST /placement-tests/${pta}/score"
              payload: { raw_score: 50 }
              as: Instructor
            - call: "POST /enrollments"
              payload: { student_id: "${sa}", cohort_id: "${cid}" }
              as: Registrar
              captures: { enrA: $.data.id }
            - call: "POST /enrollments/${enrA}/confirm"
              payload: { expected_cohort_version: "${cv0}", require_seat: true }
              as: Registrar
            - call: "POST /students"
              payload: { full_name: "St B", email: "stb@x.com", track: "GENERAL" }
              as: Registrar
              captures: { sb: $.data.id }
            - call: "POST /placement-tests"
              payload: { student_id: "${sb}" }
              as: Registrar
              captures: { ptb: $.data.id }
            - call: "POST /placement-tests/${ptb}/score"
              payload: { raw_score: 50 }
              as: Instructor
            - call: "POST /enrollments"
              payload: { student_id: "${sb}", cohort_id: "${cid}" }
              as: Registrar
              captures: { enrB: $.data.id }
          trigger:
            - call: "POST /enrollments/${enrB}/confirm"
              payload: { expected_cohort_version: "${cv0}", require_seat: true }
              as: Registrar
              captures: { eid: $.data.error_id }
          assert:
            - "error.error_id == ERR_STALE_COHORT_VERSION"
            - "Enrollment.${enrB}.status == PLACEMENT_PENDING"

      - name: version_increments_on_each_cohort_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Cohort.fields.capacity, state_machines.Enrollment.PLACEMENT_PENDING_to_ENROLLED]
        distinguishing_aspect: "Cohort.version starts at 1 on create and increments to 2 after the first confirm that touches it (side effect 'increments Cohort.version by 1')."
        test_recipe:
          setup: ["A cohort with one student confirmed ENROLLED."]
          setup_api_calls:
            - call: "POST /cohorts"
              payload: { name: "Vinc", level: "B1", track: "GENERAL", capacity: 5, weekly_hours: 18, term_start: "2026-05-04T00:00:00Z", term_end: "2026-08-01T00:00:00Z", total_sessions: 40, base_tuition_cents: 100000, schedule_block: "MORNING" }
              as: Registrar
              captures: { cid: $.data.id, cv0: $.data.version }
            - call: "POST /students"
              payload: { full_name: "Vi S", email: "vi@x.com", track: "GENERAL" }
              as: Registrar
              captures: { sid: $.data.id }
            - call: "POST /placement-tests"
              payload: { student_id: "${sid}" }
              as: Registrar
              captures: { ptid: $.data.id }
            - call: "POST /placement-tests/${ptid}/score"
              payload: { raw_score: 50 }
              as: Instructor
            - call: "POST /enrollments"
              payload: { student_id: "${sid}", cohort_id: "${cid}" }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /enrollments/${enr}/confirm"
              payload: { expected_cohort_version: "${cv0}", require_seat: true }
              as: Registrar
          trigger:
            - call: "GET /cohorts/${cid}"
              payload: {}
              as: Registrar
              captures: { nv: $.data.version }
          assert:
            - "Cohort.${cid}.version == 2   # 1 at create, +1 on confirm"

      - name: withdraw_releases_seat_derived_field_reconciles
        claim_type: derived_field_reconciliation
        grounds: [entities.Cohort.fields.seats_taken, state_machines.Enrollment.ENROLLED_to_WITHDRAWN]
        distinguishing_aspect: "Cohort.seats_taken (derived) is 1 after a confirm and reconciles back to 0 after the source enrollment withdraws."
        test_recipe:
          setup: ["A cohort with one ENROLLED student about to withdraw."]
          setup_api_calls:
            - call: "POST /cohorts"
              payload: { name: "Drec", level: "B1", track: "GENERAL", capacity: 5, weekly_hours: 18, term_start: "2026-05-04T00:00:00Z", term_end: "2026-08-01T00:00:00Z", total_sessions: 40, base_tuition_cents: 100000, schedule_block: "MORNING" }
              as: Registrar
              captures: { cid: $.data.id, cv: $.data.version }
            - call: "POST /students"
              payload: { full_name: "Dr S", email: "dr@x.com", track: "GENERAL" }
              as: Registrar
              captures: { sid: $.data.id }
            - call: "POST /placement-tests"
              payload: { student_id: "${sid}" }
              as: Registrar
              captures: { ptid: $.data.id }
            - call: "POST /placement-tests/${ptid}/score"
              payload: { raw_score: 50 }
              as: Instructor
            - call: "POST /enrollments"
              payload: { student_id: "${sid}", cohort_id: "${cid}" }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /enrollments/${enr}/confirm"
              payload: { expected_cohort_version: "${cv}", require_seat: true }
              as: Registrar
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-07T00:00:00Z" }
              as: Registrar
          trigger:
            - call: "POST /enrollments/${enr}/withdraw"
              payload: {}
              as: Registrar
            - call: "GET /cohorts/${cid}"
              payload: {}
              as: Registrar
              captures: { seats: $.data.seats_taken, st: $.data.status }
          assert:
            - "Cohort.${cid}.seats_taken == 0"
            - "Cohort.${cid}.status == OPEN"

      - name: withdraw_last_enrollment_triggers_visa_probation_cascade
        claim_type: cascading_side_effects
        grounds: [state_machines.Enrollment.ENROLLED_to_WITHDRAWN, state_machines.Student.ACTIVE_to_PROBATION, entities.Student.fields.visa_status]
        distinguishing_aspect: "Withdrawing the last ENROLLED enrollment of an ACTIVE international student cascades to Student.visa_status=PROBATION and appends a PROBATION_PLACED ComplianceEvent."
        test_recipe:
          setup: ["International ACTIVE student (full course met via single 18h cohort), then withdraws that only enrollment."]
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Casc V", email: "cascv@x.com", track: "GENERAL", is_international: true }
              as: Registrar
              captures: { sid: $.data.id }
            - call: "POST /placement-tests"
              payload: { student_id: "${sid}" }
              as: Registrar
              captures: { ptid: $.data.id }
            - call: "POST /placement-tests/${ptid}/score"
              payload: { raw_score: 50 }
              as: Instructor
            - call: "POST /students/${sid}/issue-i20"
              payload: {}
              as: DSO
            - call: "POST /cohorts"
              payload: { name: "Casc18", level: "B1", track: "GENERAL", capacity: 5, weekly_hours: 18, term_start: "2026-05-04T00:00:00Z", term_end: "2026-08-01T00:00:00Z", total_sessions: 40, base_tuition_cents: 100000, schedule_block: "MORNING" }
              as: Registrar
              captures: { cid: $.data.id, cv: $.data.version }
            - call: "POST /enrollments"
              payload: { student_id: "${sid}", cohort_id: "${cid}" }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /enrollments/${enr}/confirm"
              payload: { expected_cohort_version: "${cv}", require_seat: true }
              as: Registrar
            - call: "POST /students/${sid}/activate-status"
              payload: {}
              as: DSO
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-07T00:00:00Z" }
              as: Registrar
          trigger:
            - call: "POST /enrollments/${enr}/withdraw"
              payload: {}
              as: Registrar
            - call: "GET /students/${sid}"
              payload: {}
              as: Registrar
              captures: { vs: $.data.visa_status }
          assert:
            - "Student.${sid}.visa_status == PROBATION"

  # =================================================================
  # Consistency Model
  # =================================================================
  - section: consistency_model
    instances:
      - name: confirm_response_reflects_tuition_immediately
        claim_type: immediate
        grounds: [calculations.tuition_invoice, state_machines.Enrollment.PLACEMENT_PENDING_to_ENROLLED]
        distinguishing_aspect: "The confirm response itself (same request) carries the computed tuition_invoice_cents 300000 and status ENROLLED — all changes visible immediately, no re-read needed."
        test_recipe:
          setup: ["Self-pay student into base 300000 cohort, no add-ons."]
          setup_api_calls:
            - call: "POST /cohorts"
              payload: { name: "Imm", level: "B1", track: "GENERAL", capacity: 5, weekly_hours: 18, term_start: "2026-05-04T00:00:00Z", term_end: "2026-08-01T00:00:00Z", total_sessions: 40, base_tuition_cents: 300000, schedule_block: "MORNING" }
              as: Registrar
              captures: { cid: $.data.id, cv: $.data.version }
            - call: "POST /students"
              payload: { full_name: "Imm S", email: "imms@x.com", track: "GENERAL" }
              as: Registrar
              captures: { sid: $.data.id }
            - call: "POST /placement-tests"
              payload: { student_id: "${sid}" }
              as: Registrar
              captures: { ptid: $.data.id }
            - call: "POST /placement-tests/${ptid}/score"
              payload: { raw_score: 50 }
              as: Instructor
            - call: "POST /enrollments"
              payload: { student_id: "${sid}", cohort_id: "${cid}" }
              as: Registrar
              captures: { enr: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr}/confirm"
              payload: { expected_cohort_version: "${cv}", require_seat: true }
              as: Registrar
              captures: { inv: $.data.tuition_invoice_cents, st: $.data.status }
          assert:
            - "Enrollment.${enr}.tuition_invoice_cents == 300000"
            - "Enrollment.${enr}.status == ENROLLED"

  # =================================================================
  # Stubs — corners already covered by §1.8 difficulty instances
  # =================================================================
  - section: state_machines
    instances:
      - name: enrollment_confirm_fork_waitlist_branch_stub
        claim_type: Valid Transition
        grounds: [state_machines.Enrollment.PLACEMENT_PENDING_to_WAITLISTED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / enrollment_confirm_forks_enrolled_vs_waitlisted
          rationale: "The ENROLLED-vs-WAITLISTED fork (both branches and their divergent side effects) is asserted directly by the named §1.8 instance."

  - section: calculations
    instances:
      - name: withdrawal_refund_chronological_variant_stub
        claim_type: Variant Divergence
        grounds: [calculations.withdrawal_refund]
        excluded_because:
          difficulty_instance: dual_variant_calc / refund_chronological_schedule_differs_from_prorata_on_enrollment
          rationale: "The chronological-vs-prorata refund divergence (refund 135000 != prorata 216000) is asserted by the named §1.8 instance."

  - section: cross_cutting_complexity_layers
    instances:
      - name: contract_close_cascade_terminate_stub
        claim_type: cascading_side_effects
        grounds: [state_machines.CorporateContract.ACTIVE_to_CLOSED, state_machines.Enrollment.ENROLLED_to_TERMINATED]
        excluded_because:
          difficulty_instance: transitive_cascade / contract_close_cascade_depth3_terminate_release_void
          rationale: "The depth-3 close -> terminate -> seat-release/draw-down cascade is asserted by the named §1.8 instance."
