  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: case_close_blocked_by_required_registry_submission
        grounds:
          - calculations.case_close_readiness
          - validations[priority=25]
          - errors[ERR_REGISTRY_OUTSTANDING]
          - state_machines.RegistrySubmission.REQUIRED_to_SUBMITTED
          - entities.SurgicalCase.fields.readiness_status
        distinguishing_aspect: |
          The dependency crosses the SurgicalCase -> RegistrySubmission pair:
          the case's own status is IN_PROGRESS and every implant record is
          VERIFIED, yet close is rejected with ERR_REGISTRY_OUTSTANDING purely
          because a child RegistrySubmission is still in REQUIRED.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "A registry_required HIGH_COST_IMPLANT catalog item and patient consent GRANTED."
            - "One released lot with one owned unit, implanted into an IN_PROGRESS case and VERIFIED, which auto-creates a RegistrySubmission in REQUIRED."
            - "No ChargeCaptures exist, so the only blocker is the registry."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/vendors"
              payload: { name: "Ortholux Medical", vendor_code: "ORTHO-1" }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { vendor_id: "$.data.id" }
            - call: "POST /udi/catalog-items"
              payload: { vendor_id: "${vendor_id}", device_identifier: "00812345678950", description: "Hip Cup", category: "HIGH_COST_IMPLANT", list_charge_cents: 900000, charge_code: "CDM-77190", shelf_life_days: 1095, registry_required: true }
              as: InventoryLead
              as_user_id: "il-01"
              captures: { cat_id: "$.data.id" }
            - call: "POST /udi/lots"
              payload: { catalog_item_id: "${cat_id}", lot_number: "L-7701", expiration_date: "2027-06-30" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { lot_id: "$.data.id", lot_v: "$.data.version" }
            - call: "POST /udi/lots/${lot_id}/device-units"
              payload: { udi_serial: "SN-9001", acquisition_cost_cents: 500000, expected_lot_version: "${lot_v}" }
              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { u1_id: "$.data.id" }
            - call: "POST /udi/lots/${lot_id}/release"
              payload: {}
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/patients"
              payload: { mrn: "MRN-4004", display_name: "Pat Four", registry_consent: "GRANTED" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { pat_id: "$.data.id" }
            - call: "POST /udi/surgical-cases"
              payload: { patient_id: "${pat_id}", case_number: "CASE-4", or_room_code: "OR-7", scheduled_start_utc: "2026-09-13T08:00:00Z", scheduled_end_utc: "2026-09-13T10:00:00Z", surgeon_code: "SURG-1" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { case_id: "$.data.id" }
            - call: "POST /udi/surgical-cases/${case_id}/start"
              payload: {}
              as: CircClinician
              as_user_id: "cc-01"
              captures: { case_v: "$.data.version" }
            - call: "POST /udi/surgical-cases/${case_id}/implant-records"
              payload: { device_unit_id: "${u1_id}", udi_di: "00812345678950", udi_pi_serial: "SN-9001", anatomic_site: "ACETABULUM", laterality: "LEFT", expected_case_version: "${case_v}" }
              as: CircClinician
              as_user_id: "cc-01"
              captures: { ir1_id: "$.data.id" }
            - call: "POST /udi/implant-records/${ir1_id}/verify"
              payload: {}
              as: CircClinician
              as_user_id: "cc-02"
          trigger:
            - call: "POST /udi/surgical-cases/${case_id}/close"
              payload: {}
              as: CircClinician
              as_user_id: "cc-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_REGISTRY_OUTSTANDING"
            - "SurgicalCase.${case_id}.status == IN_PROGRESS"
            - "SurgicalCase.${case_id}.readiness_status == BLOCKED_REGISTRY"
            - "GET /udi/registry-submissions?implant_record_id=${ir1_id} returns total_count == 1 with status == REQUIRED"
            - "ImplantRecord.${ir1_id}.status == VERIFIED"

      - name: invoice_create_blocked_by_draft_agreement
        grounds:
          - validations[priority=17]
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
          - entities.ConsignmentAgreement.fields.status
          - state_machines.DeviceUnit.billing_state.NOT_BILLABLE_to_BILLABLE
        distinguishing_aspect: |
          A different entity pair from
          case_close_blocked_by_required_registry_submission: the dependency
          here is VendorInvoice -> ConsignmentAgreement. The unit is BILLABLE
          and un-invoiced, the vendor is ACTIVE and the OCC version is correct,
