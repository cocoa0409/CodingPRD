              as_user_id: "op-t"
            - call: "POST /shops/${shop_id}/work-orders/${wvi}/diagnose"
              payload: { failure_diagnosis: "x", rewind_hours: 5, materials_cents: 10000, replacement_cost_cents: 999999 }
              as: Technician
            - call: "GET /shops/${shop_id}/work-orders/${wvi}"
