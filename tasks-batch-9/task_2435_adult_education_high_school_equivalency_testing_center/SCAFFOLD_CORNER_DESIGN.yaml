        distinguishing_aspect: |
          The band test is inclusive at both ends: a learner placed at EFL 4 is refused by a 5..6
          section but accepted by a 4..4 section whose min and max are both exactly 4 - the degenerate
          single-level band that an exclusive comparison would reject.
