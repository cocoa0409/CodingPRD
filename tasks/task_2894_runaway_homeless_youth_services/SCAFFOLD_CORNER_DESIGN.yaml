              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { imd_youth_id: $.data.id }
            - call: "POST /ryhs/youths/${imd_youth_id}/safety-screenings"
              payload: { indicator_codes: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { imd_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${imd_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${imd_youth_id}", program_id: "${imd_program_id}", planned_discharge_at: "2026-08-15T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { imd_adm_id: $.data.id }
            - call: "GET /ryhs/admissions/${imd_adm_id}/guardian-notifications"
              payload: {}
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { imd_gn_id: "$.data[0].id" }
            - call: "POST /ryhs/guardian-notifications/${imd_gn_id}/attempt"
              payload: { attempt_channel: "PHONE" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
            - call: "POST /ryhs/guardian-notifications/${imd_gn_id}/resolve"
              payload: { outcome: "CONTACTED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /ryhs/admissions/${imd_adm_id}/discharge"
              payload: { exit_destination: "FAMILY_REUNIFIED" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
            - call: "GET /ryhs/admissions/${imd_adm_id}"
              payload: {}
              as: ShelterCaseManager
              as_user_id: "cm-1"
            - call: "GET /ryhs/shelter-programs/${imd_program_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "the discharge response body itself reports status DISCHARGED, discharged_at 2026-08-05T00:00:00Z, final_billable_nights 4 and outcome_positive true"
            - "the follow-up GET of the admission returns exactly the same status, discharged_at, final_billable_nights and outcome_positive"
            - "the follow-up GET of the program returns occupied_beds 0, utilization_bp 0 and posture OPEN"
            - "Youth.${imd_youth_id}.cumulative_shelter_nights == 4"
            - "Youth.${imd_youth_id}.status == REUNIFIED"

      - name: a_savings_entry_and_a_later_read_agree_on_the_balance
        claim_type: consistency_model
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_tlp_placements_savings_entries.side_effects
          - calculations.savings_match_award
        distinguishing_aspect: "The ledger entry stamps balance_after_cents in its own 201 response while simultaneously updating the placement and the youth, so a subsequent read of the placement and of the youth reconciles exactly against that stamped value - there is no lag window in which the entry exists but the aggregates disagree."
        test_recipe:
          setup:
            - "an EMERGENCY_SHELTER program plus a TRANSITIONAL_LIVING program with savings_match_rate_bp 2500"
            - "youth Gala Ibarra (dob 2010-03-15, age 16) taken to SHELTERED with risk_posture OPEN via a CLEARED screening, an ACTIVE admission and a GuardianNotification attempted by PHONE then resolved CONTACTED, then placed with documented_monthly_income_cents 90000"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { rcn_shelter_id: $.data.id }
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Northside Transitional Living", program_type: "TRANSITIONAL_LIVING", licensed_bed_capacity: 3, min_age_years: 16, max_age_years: 20, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { rcn_tlp_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Gala", legal_last_name: "Ibarra", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { rcn_youth_id: $.data.id }
            - call: "POST /ryhs/youths/${rcn_youth_id}/safety-screenings"
              payload: { indicator_codes: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { rcn_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${rcn_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${rcn_youth_id}", program_id: "${rcn_shelter_id}", planned_discharge_at: "2026-08-15T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { rcn_adm_id: $.data.id }
            - call: "GET /ryhs/admissions/${rcn_adm_id}/guardian-notifications"
              payload: {}
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { rcn_gn_id: "$.data[0].id" }
            - call: "POST /ryhs/guardian-notifications/${rcn_gn_id}/attempt"
              payload: { attempt_channel: "PHONE" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
            - call: "POST /ryhs/guardian-notifications/${rcn_gn_id}/resolve"
              payload: { outcome: "CONTACTED" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
            - call: "POST /ryhs/tlp-placements"
              payload: { youth_id: "${rcn_youth_id}", program_id: "${rcn_tlp_id}", documented_monthly_income_cents: 90000 }
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { rcn_plc_id: $.data.id, rcn_plc_v: $.data.version }
          trigger:
            - call: "POST /ryhs/tlp-placements/${rcn_plc_id}/savings-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 3011, expected_placement_version: "${rcn_plc_v}", source_note: "first paycheque" }
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { rcn_entry_id: $.data.id }
            - call: "GET /ryhs/tlp-placements/${rcn_plc_id}"
              payload: {}
              as: TlpCoordinator
              as_user_id: "tlp-1"
            - call: "GET /ryhs/youths/${rcn_youth_id}"
              payload: {}
              as: TlpCoordinator
              as_user_id: "tlp-1"
          assert:
            - "the entry response reports signed_amount_cents 3011, match_component_cents 753 and balance_after_cents 3764, since 3011 x 2500 bp is 752.75 rounded half up to 753"
            - "the follow-up GET of the placement reports savings_balance_cents 3764 and match_awarded_cents 753, reconciling exactly with the entry"
            - "the follow-up GET of the youth reports lifetime_savings_deposited_cents 3011"
            - "TlpPlacement.${rcn_plc_id}.version is exactly one greater than ${rcn_plc_v}"
