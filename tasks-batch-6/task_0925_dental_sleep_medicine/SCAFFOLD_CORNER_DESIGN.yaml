        distinguishing_aspect: |
          Rung 15 covers two distinct defects with one error id: a DENTAL_LAB in the treating_dentist
          slot, and a correctly typed but SUSPENDED dentist. Both are 422 ERR_PROVIDER_TYPE_MISMATCH,
          and both name a provider row different from the referring physician, so rung 14 does not
          pre-empt them.
