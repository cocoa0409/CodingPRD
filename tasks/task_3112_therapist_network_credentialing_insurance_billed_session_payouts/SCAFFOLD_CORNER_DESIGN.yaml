      - name: clinician_cannot_verify_a_license_because_compliance_officer_owns_it
        claim_type: Cannot perform other roles' exclusive operations
        grounds:
          - roles.ComplianceOfficer.exclusive_operations
          - errors.ERR_UNAUTHORIZED
          - endpoints.POST_/network/clinicians/{clinician_id}/licenses/{id}/verify
        distinguishing_aspect: "Verification is ComplianceOfficer-exclusive, so the owning clinician calling it on their own license is refused 403 ERR_UNAUTHORIZED and the license stays UNVERIFIED."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z; one clinician with an unverified license."
          setup_api_calls:
            - *c_clock
            - *c_clinician
            - *c_license
          trigger:
            - call: "POST /network/clinicians/${clinician_id}/licenses/${license_id}/verify"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_UNAUTHORIZED"
            - "License.${license_id}.verification_status == UNVERIFIED and verification_attempts == 0"
            - "Clinician.${clinician_id}.billing_posture == GATED"
            - "the same call as ComplianceOfficer succeeds, so the refusal is role-driven rather than state-driven"

      - name: ops_admin_cannot_verify_a_license_even_though_it_administers_credentialing
        claim_type: Cannot perform other roles' exclusive operations
        grounds:
          - roles.OpsAdmin.exclusive_operations
          - roles.ComplianceOfficer.exclusive_operations
          - errors.ERR_UNAUTHORIZED
          - endpoints.POST_/network/clinicians/{id}/submit-credentials
        distinguishing_aspect: "Credentialing review is segregated from network administration, so OpsAdmin can submit credentials but cannot verify the license, isolating the reviewer role."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z; one clinician with a license and a policy on file, already moved to CREDENTIALING."
          setup_api_calls:
            - *c_clock
            - *c_clinician
            - *c_license
            - call: "POST /network/clinicians/${clinician_id}/malpractice-policies"
              payload: { carrier_name: "TherapyGuard Mutual", coverage_cents: 500000000, effective_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z", tail_coverage: false }
              as: OpsAdmin
            - call: "POST /network/clinicians/${clinician_id}/submit-credentials"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /network/clinicians/${clinician_id}/licenses/${license_id}/verify"
              payload: {}
              as: OpsAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the verify returns status 403 and error_id == ERR_UNAUTHORIZED"
            - "Clinician.${clinician_id}.status == CREDENTIALING, so the earlier OpsAdmin-permitted action stands"
            - "License.${license_id}.verification_status == UNVERIFIED after the refusal"
            - "clinician onboarding, policy recording and enrollment submission all remain OpsAdmin operations, so the segregation is limited to the review step"

      - name: patient_may_read_its_own_sessions_but_not_any_clinicians_payout_lines
        claim_type: Cannot perform other roles' exclusive operations
        grounds:
          - roles.Patient.shared_operations
          - errors.ERR_UNAUTHORIZED
          - endpoints.GET_/network/clinicians/{id}/payout-lines
          - endpoints.GET_/network/sessions
        distinguishing_aspect: "The patient role is entity-backed and read-only, so the shared session read succeeds while the payout-line read is refused 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z; one clinician and one patient with a requested session between them."
          setup_api_calls:
            - *c_clock
            - *c_payer
            - *c_rate
            - *c_clinician
            - *c_license
            - call: "POST /network/clinicians/${clinician_id}/licenses/${license_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /network/clinicians/${clinician_id}/malpractice-policies"
              payload: { carrier_name: "TherapyGuard Mutual", coverage_cents: 500000000, effective_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z", tail_coverage: false }
              as: OpsAdmin
            - *c_enroll
            - call: "POST /network/payer-enrollments/${enrollment_id}/activate"
              payload: {}
              as: OpsAdmin
            - *c_patient
            - *c_verification
            - *c_session
          trigger:
            - call: "GET /network/sessions"
              payload: { patient_id: "${patient_id}", limit: 10, offset: 0 }
              as: Patient
              as_user_id: "${patient_id}"
              captures: { visible_sessions: $.data.0.id }
            - call: "GET /network/clinicians/${clinician_id}/payout-lines"
              payload: { limit: 10, offset: 0 }
