  - rule_id: transitive_cascade
    instances:
      - name: jurisdiction_criteria_revision_cascade_depth_five
        grounds:
          - endpoints[POST /jurisdictions/{id}/loading-criteria].side_effects
          - state_machines.BuildingConfiguration.LOCKED_to_CRITERIA_STALE
          - state_machines.EngineeringDesign.APPROVED_to_VOIDED
          - state_machines.DrawingPackage.SEALED_to_VOIDED
          - state_machines.Order.ENG_SEALED_to_ENG_REWORK
          - state_machines.ProductionLot.SCHEDULED_to_CANCELLED
          - calculations.order_production_status_rollup
        distinguishing_aspect: |
          Trigger: a jurisdiction code update. The chain is five hops deep and each hop is caused only
          by the hop before it — the configuration goes stale because criteria_revision rose, the design
          voids because its configuration went stale, the package voids because its design voided, the
          order gains permit_hold and ENG_REWORK because its package voided, and the lot cancels because
          its order went on hold. Nothing in the request body names a configuration, design, package,
          order or lot.
