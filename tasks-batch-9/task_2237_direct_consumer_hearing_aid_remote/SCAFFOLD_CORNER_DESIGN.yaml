            - "GET /device-orders/${ord_pc} returns data.fulfillment_status == \"PENDING_FIT_CONFIRM\" and data.version == 1"

      - name: sm_order_ship_second_call_is_invalid_state
        claim_type: idempotency
        grounds: [state_machines.DeviceOrder.fulfillment_status.transitions.READY_TO_SHIP_to_SHIPPED, errors.ERR_INVALID_STATE]
        distinguishing_aspect: "The second ship call must be rejected with ERR_INVALID_STATE (409) rather than being silently absorbed, and it must not double-capture: captured_cents stays 215995 and dispatched_units stays 1."
