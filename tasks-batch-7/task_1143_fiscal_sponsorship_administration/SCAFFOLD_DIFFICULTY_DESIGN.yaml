            - { call: "POST /fsa/applications/${app_i}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "COMPREHENSIVE" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p_i: $.data.project_id, ag_i: $.data.agreement_id } }
            - { call: "POST /fsa/agreements/${ag_i}/countersign", payload: {}, as: Applicant, as_user_id: user_app_i }
