            - call: "POST /studio/photographers"
              payload: { email: "pe7@x.com", full_name: "PE Seven", skills: ["PHOTO"], hourly_rate_cents: 7000 }
              as: StudioAdmin
              captures: { pe7: $.data.id }
            - call: "POST /studio/session-packages"
              payload: { name: "PB E7", session_type: "PORTRAIT", tier: "BASIC", base_fee_cents: 100000, included_shoot_hours: 2, overage_hourly_rate_cents: 12000, included_edited_images: 30, deposit_pct: 0.30, active: true }
              as: StudioAdmin
              captures: { pke7: $.data.id }
            - call: "POST /studio/bookings"
              payload: { client_id: "${ce7}", package_id: "${pke7}", lead_photographer_id: "${pe7}", requested_shoot_hours: 2 }
              as: Client
              as_user_id: "${ce7}"
              captures: { bk7: $.data.id }
            - call: "POST /studio/contracts"
              payload: { booking_id: "${bk7}" }
              as: StudioAdmin
              captures: { ct7: $.data.id }
            - call: "POST /studio/contracts/${ct7}/send"
              payload: {}
              as: StudioAdmin
            - call: "POST /studio/contracts/${ct7}/sign"
              payload: {}
              as: Client
              as_user_id: "${ce7}"
            - call: "POST /studio/shoot-schedules"
              payload: { booking_id: "${bk7}", start_utc: "2026-07-01T10:00:00Z", end_utc: "2026-07-01T12:00:00Z" }
              as: StudioAdmin
              captures: { sc7: $.data.id }
            - call: "POST /studio/bookings/${bk7}/confirm"
              payload: {}
              as: Client
              as_user_id: "${ce7}"
            - call: "POST /studio/payments"
              payload: { booking_id: "${bk7}", kind: "DEPOSIT", amount_cents: 30000 }
              as: StudioAdmin
              captures: { p7: $.data.id }
            - call: "POST /studio/payments/${p7}/settle"
              payload: {}
              as: StudioAdmin
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T12:30:00Z" }
              as: StudioAdmin
            - call: "POST /studio/shoot-schedules/${sc7}/complete"
              payload: {}
