          assert:
            - "the plant-filtered list returns total_count == 1 holding only ${line_id}"
            - "the detail read returns BoardLine.${line_id}.designation == 'LINE-1', max_speed_fpm == 500, web_width_in == 54.0, status == AVAILABLE, version == 1"
            - "the sub-collection read returns the same single row as the plant-filtered list"
            - "the status-filtered list returns total_count == 2 (${line_id} and ${line2_id})"

      - name: ship_is_a_conditional_action_on_run_quality
        claim_type: conditional_action
        grounds:
          - endpoints[POST /plant-ops/load-orders/{loadOrderId}/ship]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / load_ship_blocked_until_run_quality_released
          rationale: "That instance shows ship refused while the run is HELD and accepted once the run reaches DOWNGRADED, with no change to the load order itself."

  - section: errors
    instances:

      # Coverage note: the codes not carrying their own instance below are triggered elsewhere in this
      # file — 404 family and ERR_INVALID_REQUEST in `entities`, ERR_PLANT_SCOPE_MISMATCH in `entities`,
      # ERR_INVALID_STATE / ERR_LOT_NOT_APPROVED / ERR_RUN_WINDOW_NOT_STARTED in `state_machines`,
      # ERR_CALCINER_CAPACITY_EXCEEDED in `calculations`, ERR_LINE_SPEED_EXCEEDS_SPEC /
      # ERR_PAPER_TENSION_OUT_OF_RANGE / ERR_KILN_PROFILE_INFEASIBLE /
      # ERR_WINDOW_TOO_SHORT_FOR_CHANGEOVER / ERR_BUNDLE_CONFIG_INVALID / ERR_INVALID_WINDOW /
      # ERR_RETEST_REQUIRED / ERR_RUN_MSF_INSUFFICIENT in `validations`, ERR_REFERENCE_NOT_FOUND /
      # ERR_OUTAGE_WINDOW_NOT_STARTED in `endpoints`, ERR_UNAUTHORIZED / ERR_SEGREGATION_OF_DUTIES in
      # `rbac`, and ERR_STALE_PLANT_VERSION / ERR_STALE_LOT_VERSION in
      # `cross_cutting_complexity_layers`.

      - name: missing_or_unknown_role_header_returns_unauthenticated
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority 1]
        distinguishing_aspect: |
          Authentication is header-shaped: omitting X-User-Role and sending a role name that is not one of
          the seven declared roles both return ERR_UNAUTHENTICATED (401), and neither reaches the
          authorization check that would have returned 403.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /plant-ops/plants"
