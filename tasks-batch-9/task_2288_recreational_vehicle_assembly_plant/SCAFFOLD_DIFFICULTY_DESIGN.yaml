  - rule_id: resource_temporal_overlap
    instances:

      - name: booth_turnaround_buffer_makes_a_one_minute_early_window_conflict
        grounds:
          - calculations.booth_window_conflict
          - entities.TestBooth.fields.turnaround_minutes
          - entities.TestBooth.fields.bay_count
          - endpoints["POST /quality-inspections"]
          - errors.ERR_BOOTH_WINDOW_CONFLICT
        distinguishing_aspect: |
          The contended resource is a TestBooth and the interval semantics are
          instant-level half-open windows whose trailing edge is extended by a
          turnaround buffer, so a 09:00-10:00 test occupies the booth until 10:30
          and adjacency at exactly 10:30 is legal while 10:29 is not. Capacity is
          per bay, so the same rejected window is admitted by a two-bay booth.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "BOOTH-1: WATER_TEST, bay_count 1, turnaround_minutes 30. BOOTH-2: WATER_TEST, bay_count 2, turnaround_minutes 30."
            - "One delivered unit injected for Dealer D-BIG so inspections have a build to hang from."
            - "A SCHEDULED WATER_TEST window 2026-08-05T09:00:00Z to 10:00:00Z on BOOTH-1 and an identical window on BOOTH-2, each with an effective footprint ending at 10:30:00Z."
          setup_api_calls:
            - call: "POST /floor-plans"
              payload: { model_code: "FP-3410", chassis_class: "CLASS_A", length_ft: 34, base_msrp_cents: 18500000, base_station_hours: 46.00, base_dry_weight_lbs: 22400, gvwr_lbs: 26000, required_wheelbase_in: 242, electrical_service_amps: 50, fresh_water_capacity_gal: 90 }
              as: PlantAdmin
              captures: { fp_a_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-BIG", region: "WEST", allocation_share_bp: 1500, floor_plan_credit_limit_cents: 100000000, goodwill_budget_cents: 500000 }
              as: PlantAdmin
              captures: { dlr_id: $.data.id }
            - call: "POST /test-booths"
              payload: { booth_code: "BOOTH-1", booth_type: "WATER_TEST", bay_count: 1, turnaround_minutes: 30 }
              as: PlantAdmin
              captures: { booth1_id: $.data.id }
            - call: "POST /test-booths"
              payload: { booth_code: "BOOTH-2", booth_type: "WATER_TEST", bay_count: 2, turnaround_minutes: 30 }
              as: PlantAdmin
              captures: { booth2_id: $.data.id }
            - call: "POST /_inject/delivered-unit"
              payload: { dealer_id: "${dlr_id}", floor_plan_id: "${fp_a_id}" }
              as: PlantAdmin
              captures: { build_id: $.data.id }
