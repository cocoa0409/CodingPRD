        grounds: ["roles[Operator]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "POST /animals is exclusive to Operator; a Customer caller gets 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["one registered customer"]
