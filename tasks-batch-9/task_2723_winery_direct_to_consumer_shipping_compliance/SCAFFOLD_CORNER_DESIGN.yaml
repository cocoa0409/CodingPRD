      - name: shipping_pool_is_floor_allocated_then_the_remainder_walks_by_liters
        claim_type: precision
        grounds:
          - calculations.order_sales_tax_cents
          - calculations.order_charge_evaluation_chain
          - entities.OrderLine.fields.allocated_shipping_cents
          - entities.OrderLine.fields.line_sales_tax_cents
        distinguishing_aspect: |
          Three unequal bottle sizes make the shipping pool indivisible, so all three precision rules fire
          at once: shipping_gross lands on an exact half (1912.5 -> 1913), each line's pro-rata share is FLOORED
          (382.6 -> 382, 510.133 -> 510, 1020.266 -> 1020) leaving a remainder of exactly 1 cent, and that cent
          goes to the largest-liters line by the declared line_liters DESC, line_index ASC walk — never to
