  - method: GET
    path: "/estimates/{id}"
    description: "Fetch an Estimate with computed subtotal/tax/total."
    roles: [ProjectManager, FinanceOfficer, Estimator, HomeownerClient]
    code: 200
    input: []
    output: Estimate
    side_effects: []
  - method: GET
    path: "/estimates"
    description: "List estimates. Reverse-reachability for Estimate.project_id and Estimate.measurement_id."
    roles: [ProjectManager, FinanceOfficer, Estimator]
    code: 200
    input: ["project_id?", "measurement_id?", "limit?", "offset?"]
    output: Estimate[]
    side_effects: []
  - method: POST
