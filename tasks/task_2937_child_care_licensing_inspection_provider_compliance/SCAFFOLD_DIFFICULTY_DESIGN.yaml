              captures: { p3: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "P4 Center", county_code: "CTY-01", site_address: "14 Fourth St", program_type: "CENTER", requested_capacity: 20 }
              as: Applicant
              captures: { p4: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "P5 Center", county_code: "CTY-01", site_address: "15 Fifth St", program_type: "CENTER", requested_capacity: 20 }
              as: Applicant
              captures: { p5: $.data.id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${p1}", inspector_id: "${insp_c}", inspection_type: "ANNUAL", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["PRESCHOOL"], duration_minutes: 120 }
              as: LicensingSupervisor
              captures: { v1: $.data.id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${p2}", inspector_id: "${insp_c}", inspection_type: "ANNUAL", scheduled_for: "2026-08-05T11:00:00Z", target_age_groups: ["PRESCHOOL"], duration_minutes: 120 }
              as: LicensingSupervisor
              captures: { v2: $.data.id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${p3}", inspector_id: "${insp_c}", inspection_type: "ANNUAL", scheduled_for: "2026-08-05T13:00:00Z", target_age_groups: ["PRESCHOOL"], duration_minutes: 120 }
              as: LicensingSupervisor
              captures: { v3: $.data.id }
          trigger:
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${p4}", inspector_id: "${insp_c}", inspection_type: "ANNUAL", scheduled_for: "2026-08-05T15:00:00Z", target_age_groups: ["PRESCHOOL"], duration_minutes: 120 }
              as: LicensingSupervisor
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${p4}", inspector_id: "${insp_c}", inspection_type: "ANNUAL", scheduled_for: "2026-08-06T09:00:00Z", target_age_groups: ["PRESCHOOL"], duration_minutes: 120 }
              as: LicensingSupervisor
              captures: { v_next_day: $.data.id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${p5}", inspector_id: "${insp_c}", inspection_type: "ANNUAL", scheduled_for: "2026-08-06T23:00:00Z", target_age_groups: ["PRESCHOOL"], duration_minutes: 120 }
              as: LicensingSupervisor
              captures: { v_midnight: $.data.id }
            - call: "POST /licensing/inspections/${v1}/void"
              payload: {}
              as: LicensingSupervisor
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${p4}", inspector_id: "${insp_c}", inspection_type: "ANNUAL", scheduled_for: "2026-08-05T15:00:00Z", target_age_groups: ["PRESCHOOL"], duration_minutes: 120 }
              as: LicensingSupervisor
              captures: { v4: $.data.id }
          assert:
            - "after setup Cara holds exactly 3 SCHEDULED visits on 2026-08-05 and Inspector.${insp_c}.scheduled_visit_count == 3"
            - "the 2026-08-05T15:00:00Z request returns ERR_INSPECTOR_DAILY_LIMIT_REACHED (409) even though its window [15:00:00Z, 17:00:00Z) only TOUCHES ${v3}'s window at 15:00:00Z and its provider P4 has no other visit — same_day_count 3 >= max_daily_visits 3"
            - "the refusal creates no row and leaves scheduled_visit_count at 3"
            - "the 2026-08-06T09:00:00Z request returns 201 — the bucket is per UTC calendar date, so a new date starts the count at 0"
            - "the 2026-08-06T23:00:00Z request returns 201 with visit_window_end == \"2026-08-07T01:00:00Z\": the visit is charged to the 2026-08-06 bucket (now 2 of 3) by date_utc(scheduled_for) alone, and the 2026-08-07 bucket remains empty even though the window runs into that date"
            - "voiding ${v1} drops the 2026-08-05 bucket to 2 because VOIDED rows leave the active set"
            - "the identical 2026-08-05T15:00:00Z request then returns 201 (Inspection.${v4}) — the quota is recomputed from live rows, not from a monotonic counter; note that Inspector.${insp_c}.scheduled_visit_count is a lifetime tally (now 6) and is deliberately NOT the value the limit reads"

      - name: overlap_clearance_validity_window_upper_edge_exclusive
        grounds:
          - calculations.provider_clearance_completeness
          - entities.BackgroundCheck.fields.expires_at
          - entities.StaffMember.fields.clearance_status
          - validations.priority_55_ERR_CLEARANCE_INCOMPLETE
          - global_constants.CLEARANCE_VALIDITY_MONTHS
          - endpoints.POST_licensing_providers_license_decision
        distinguishing_aspect: |
          Resource: one StaffMember's clearance coverage. Semantics: a VALIDITY
          interval [decided_at, expires_at) whose upper edge is exclusive — the
          operation must land strictly inside it. Nothing is booked and nothing
          is refused for contention; the provider loses clearance purely because
          the logical clock reached expires_at, one second after the same chain
          of checks was still sufficient.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z for the clearances, so both checks get expires_at 2031-08-01T00:00:00Z (CLEARANCE_VALIDITY_MONTHS 60)."
            - "One Inspector certified for PRESCHOOL, one CENTER provider with requested_capacity 20 and a single PRESCHOOL roster of 20 (so the capacity rules at priorities 90 and 92 are satisfied)."
            - "One DIRECTOR with both REQUIRED_CHECK_TYPES CLEARED; the application is submitted and clear-checks succeeds while the clearances are fresh."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/inspectors"
