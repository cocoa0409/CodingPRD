              payload: { milestone_id: "${m1_id}", build_number: 1, feature_completeness_pct: 75.00, crash_free_sessions_pct: 96.00, content_completeness_pct: 60.00, known_blocker_count: 5, release_notes: "Build from the party studio" }
              as: Developer
