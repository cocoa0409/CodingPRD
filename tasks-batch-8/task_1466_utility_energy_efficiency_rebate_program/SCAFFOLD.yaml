# =============================================================================
# PRD Benchmark Scaffold — Utility Energy-Efficiency Rebate Program Administration
# =============================================================================

scenario: |
  Utility Energy-Efficiency Rebate Program Administration (utility DSM program): measure catalog & incentive levels, application intake with invoice/spec validation, pre/post inspection sampling & verification, trade-ally network enrollment & performance, savings claim (deemed vs measured) & evaluation adjustment, budget pacing & program cap, duplicate/fraud detection, regulatory savings-goal reporting

domain_name: utility-ee-rebate
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - derived_field_reconciliation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; FK via request body fields)
# =============================================================================
entities:
  - name: ProgramYear
    parent: null
    common_fields: true
    fields:
      - { name: program_code, type: string, source: input, description: "Unique program identifier code (e.g., 'RES-HVAC-2026')" }
      - { name: program_year_label, type: string, source: input, description: "Human label, e.g. 'PY2026'" }
      - { name: budget_cap_cents, type: integer, source: input, description: "Annual program budget cap in cents (positive integer)" }
      - { name: savings_goal_kwh, type: integer, source: input, description: "Regulatory annual savings goal in kWh (positive integer)" }
      - { name: committed_cents, type: integer, source: computed, default: 0, description: "Sum of incentive_total_cents over applications in SUBMITTED, PRE_INSPECTION, POST_INSPECTION, VERIFIED, APPROVED states; decremented when an application transitions to REJECTED, WITHDRAWN, or PAID" }
      - { name: paid_cents, type: integer, source: computed, default: 0, description: "Sum of incentive_total_cents over applications in PAID state" }
      - { name: reported_kwh, type: integer, source: computed, default: 0, description: "Sum of final_kwh across VERIFIED, APPROVED, PAID applications; deemed or measured per line" }
      - { name: adjusted_kwh, type: integer, source: computed, default: 0, description: "floor(reported_kwh * latest_eval_adjustment.realization_rate_pct / 100) if an adjustment exists; else equals reported_kwh" }
      - { name: goal_attainment_pct, type: integer, source: computed, default: 0, description: "round_half_up(100 * adjusted_kwh / savings_goal_kwh), integer percent" }
      - { name: status, type: enum, source: system, description: "DRAFT → OPEN → CLOSED → REPORTED" }
      - { name: opened_at, type: datetime, source: system, description: "ISO8601 timestamp of DRAFT → OPEN transition; anchors invoice_date window" }

  - name: Measure
    parent: null
    common_fields: true
    fields:
      - { name: program_year_id, type: string, source: input, description: "FK -> ProgramYear.id; owning program year" }
      - { name: measure_code, type: string, source: input, description: "Unique-per-program code (e.g., 'HVAC-18SEER')" }
      - { name: measure_name, type: string, source: input, description: "Display name" }
      - { name: base_rate_cents, type: integer, source: input, description: "Base incentive rate in cents per unit installed" }
      - { name: deemed_kwh_per_unit, type: integer, source: input, description: "Deemed annual kWh savings per unit (used by deemed savings variant)" }
      - { name: requires_post_inspection, type: boolean, source: input, default: false, description: "If true, applications with this measure require POST-kind inspection before VERIFIED" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Whether the measure can be used on new applications" }

  - name: TradeAlly
    parent: null
    common_fields: true
    fields:
      - { name: ally_name, type: string, source: input, description: "Business name of trade ally (contractor)" }
      - { name: license_number, type: string, source: input, description: "State contractor license number (unique)" }
      - { name: performance_score, type: integer, source: computed, default: 100, description: "round_half_up(100 * passed_inspections / completed_inspections) over the ally's applications; 100 when no completed inspections" }
      - { name: standing_tier, type: enum, source: computed, default: "STANDARD", description: "PREFERRED | STANDARD | PROBATION — derived from performance_score; thresholds: >=90 PREFERRED, >=70 STANDARD, <70 PROBATION" }
      - { name: enroll_status, type: enum, source: system, description: "PENDING → ACTIVE → SUSPENDED | TERMINATED" }

  - name: RebateApplication
    parent: null
    common_fields: true
    fields:
      - { name: program_year_id, type: string, source: input, description: "FK -> ProgramYear.id; owning program year" }
      - { name: trade_ally_id, type: string, source: input, description: "FK -> TradeAlly.id; installing contractor" }
      - { name: customer_account_number, type: string, source: input, description: "Utility customer account number" }
      - { name: service_address, type: string, source: input, description: "Installation service address (free-form string; used for duplicate detection)" }
      - { name: invoice_number, type: string, source: input, description: "Contractor invoice number" }
      - { name: invoice_date, type: string, source: input, description: "ISO8601 date (YYYY-MM-DD) of install invoice" }
      - { name: incentive_total_cents, type: integer, source: computed, default: 0, description: "Sum of line-item incentive_cents; computed at submission, locked thereafter" }
      - { name: claimed_kwh, type: integer, source: computed, default: 0, description: "Sum of line-item claimed_kwh (deemed at submission)" }
      - { name: final_kwh, type: integer, source: computed, default: 0, description: "Sum of line-item final_kwh after verification (measured where claim_method=MEASURED; deemed otherwise); locked at VERIFIED" }
      - { name: inspection_required, type: boolean, source: computed, default: false, description: "True iff application is selected by sampling rule at submission (every SAMPLE_EVERY_N-th application per program-year by created_at OR claimed_kwh >= LARGE_CLAIM_KWH_THRESHOLD)" }
      - { name: risk_score, type: integer, source: computed, default: 0, description: "Fraud-risk score computed at submission; sum of triggered flag weights" }
      - { name: auto_flag_status, type: enum, source: computed, default: "CLEAR", description: "CLEAR | SUSPECT — SUSPECT when risk_score >= SUSPECT_THRESHOLD (50)" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → PRE_INSPECTION → POST_INSPECTION → VERIFIED → APPROVED → PAID; or REJECTED / WITHDRAWN from most states" }
      - { name: submitted_at, type: datetime, source: system, description: "ISO8601 timestamp of DRAFT → SUBMITTED transition" }
      - { name: verified_by, type: string, source: system, description: "X-User-ID of the VerificationInspector who performed verify (used for segregation-of-duties check)" }

  - name: ApplicationLineItem
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> RebateApplication.id; owning application" }
      - { name: measure_id, type: string, source: input, description: "FK -> Measure.id; measure installed" }
      - { name: quantity, type: integer, source: input, description: "Units installed (positive integer)" }
      - { name: pacing_tier_at_submit, type: enum, source: computed, description: "STANDARD_TIER | MID_TIER | HIGH_TIER — snapshot of program committed_pct band at submission time" }
      - { name: incentive_cents, type: integer, source: computed, description: "round_half_up(base_rate_cents * quantity * tier_factor, 0); pinned at submission" }
      - { name: claimed_kwh, type: integer, source: computed, description: "deemed_kwh_per_unit * quantity; pinned at submission" }
      - { name: measured_kwh, type: integer, source: computed, description: "Set at verification when claim_method=MEASURED: pre_annual_kwh - post_annual_kwh; null otherwise" }
      - { name: final_kwh, type: integer, source: computed, description: "Equal to measured_kwh when claim_method=MEASURED; else claimed_kwh (deemed). Set at verification." }

  - name: SavingsClaim
    parent: null
    common_fields: false
    fields:
      - { name: line_item_id, type: string, source: input, description: "FK -> ApplicationLineItem.id; owning line item (1:1)" }
      - { name: claim_method, type: enum, source: input, description: "DEEMED | MEASURED — which savings algorithm governs this line at verification" }
      - { name: pre_annual_kwh, type: integer, source: input, description: "Pre-retrofit metered annual kWh; required iff claim_method=MEASURED" }
      - { name: post_annual_kwh, type: integer, source: input, description: "Post-retrofit metered annual kWh; required iff claim_method=MEASURED" }
      - { name: computed_kwh, type: integer, source: computed, description: "For DEEMED: equals line.claimed_kwh at verification time. For MEASURED: pre_annual_kwh - post_annual_kwh" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> RebateApplication.id; owning application" }
      - { name: inspection_kind, type: enum, source: input, description: "PRE | POST" }
      - { name: scheduled_on, type: string, source: input, description: "ISO8601 date the inspection is scheduled" }
      - { name: completed_on, type: string, source: system, description: "ISO8601 date the inspection was completed; set by /complete" }
      - { name: outcome, type: enum, source: system, description: "PENDING → PASSED | FAILED" }
      - { name: fail_reason, type: string, source: input, description: "Required when outcome=FAILED; null otherwise" }

  - name: EvaluationAdjustment
    parent: null
    common_fields: true
    fields:
      - { name: program_year_id, type: string, source: input, description: "FK -> ProgramYear.id; owning program year" }
      - { name: realization_rate_pct, type: integer, source: input, description: "Evaluation realization rate 0–100; applied to reported_kwh" }
      - { name: effective_on, type: string, source: input, description: "ISO8601 date from which this adjustment applies" }
      - { name: notes, type: string, source: input, description: "Free-text evaluation notes" }

  - name: FraudFlag
    parent: null
    common_fields: false
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> RebateApplication.id; owning application" }
      - { name: flag_kind, type: enum, source: system, description: "SAME_SERVICE_ADDRESS | ALLY_BURST | INVOICE_GAP_SMALL" }
      - { name: weight, type: integer, source: system, description: "Contribution to risk_score (40, 25, or 15 respectively)" }
      - { name: detail, type: string, source: system, description: "Human-readable explanation" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ProgramYear
    initial_state: DRAFT
    terminal_states: [REPORTED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /program-years/{id}/open"
        actor: ProgramAdministrator
        preconditions:
          - "ProgramYear.status == DRAFT (ERR_INVALID_STATE)"
          - "At least one Measure with program_year_id == this.id AND is_active == true (ERR_NO_ACTIVE_MEASURES)"
        side_effects:
          - "opened_at = current logical clock timestamp"
          - "ProgramYear.version incremented by 1"

      - from: OPEN
        to: CLOSED
        trigger: "POST /program-years/{id}/close"
        actor: ProgramAdministrator
        preconditions:
          - "ProgramYear.status == OPEN (ERR_INVALID_STATE)"
          - "No RebateApplication with program_year_id == this.id AND status IN {SUBMITTED, PRE_INSPECTION, POST_INSPECTION, VERIFIED} (ERR_OPEN_APPLICATIONS_REMAIN)"
        side_effects:
          - "For each APPROVED RebateApplication with program_year_id == this.id (ordered by created_at ASC): transition to PAID; committed_cents decremented by incentive_total_cents; paid_cents incremented by incentive_total_cents"
          - "ProgramYear.version incremented by 1"

      - from: CLOSED
        to: REPORTED
        trigger: "POST /program-years/{id}/report"
        actor: RegulatorAnalyst
        preconditions:
          - "ProgramYear.status == CLOSED (ERR_INVALID_STATE)"
          - "At least one EvaluationAdjustment with program_year_id == this.id (ERR_NO_EVALUATION_ADJUSTMENT)"
        side_effects:
          - "Recompute adjusted_kwh = floor(reported_kwh * latest_adjustment.realization_rate_pct / 100) where latest_adjustment is the EvaluationAdjustment with max effective_on (ties broken by created_at ASC, earliest created wins)"
          - "Recompute goal_attainment_pct"
          - "ProgramYear.version incremented by 1"

  - entity: TradeAlly
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /trade-allies/{id}/activate"
        actor: ProgramAdministrator
        preconditions:
          - "TradeAlly.enroll_status == PENDING (ERR_INVALID_STATE)"
        side_effects: ["TradeAlly.version incremented by 1"]

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /trade-allies/{id}/suspend"
        actor: ProgramAdministrator
        preconditions:
          - "TradeAlly.enroll_status == ACTIVE (ERR_INVALID_STATE)"
        side_effects: ["TradeAlly.version incremented by 1"]

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /trade-allies/{id}/reinstate"
        actor: ProgramAdministrator
        preconditions:
          - "TradeAlly.enroll_status == SUSPENDED (ERR_INVALID_STATE)"
        side_effects: ["TradeAlly.version incremented by 1"]

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /trade-allies/{id}/terminate"
        actor: ProgramAdministrator
        preconditions:
          - "TradeAlly.enroll_status == ACTIVE (ERR_INVALID_STATE)"
          - "No RebateApplication with trade_ally_id == this.id AND status IN {DRAFT, SUBMITTED, PRE_INSPECTION, POST_INSPECTION, VERIFIED} (ERR_ALLY_HAS_OPEN_APPLICATIONS)"
        side_effects: ["TradeAlly.version incremented by 1"]

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /trade-allies/{id}/terminate"
        actor: ProgramAdministrator
        preconditions:
          - "TradeAlly.enroll_status == SUSPENDED (ERR_INVALID_STATE)"
        side_effects: ["TradeAlly.version incremented by 1"]

  - entity: RebateApplication
    initial_state: DRAFT
    terminal_states: [PAID, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: TradeAlly
        preconditions:
          - "RebateApplication.status == DRAFT (ERR_INVALID_STATE)"
          - "ProgramYear.status == OPEN where ProgramYear.id == application.program_year_id (ERR_PROGRAM_NOT_OPEN)"
          - "TradeAlly.enroll_status == ACTIVE where TradeAlly.id == application.trade_ally_id (ERR_ALLY_NOT_ACTIVE)"
          - "Every ApplicationLineItem with application_id == this.id references a Measure with is_active == true (ERR_MEASURE_INACTIVE)"
          - "At least one ApplicationLineItem with application_id == this.id (ERR_NO_LINE_ITEMS)"
          - "invoice_date IN [ProgramYear.opened_at date - 90 days, current logical clock date], inclusive (ERR_INVOICE_DATE_OUT_OF_RANGE)"
          - "Sum of per-line incentive_cents (computed at current pacing tier) <= ProgramYear.budget_cap_cents - ProgramYear.committed_cents (ERR_PROGRAM_CAP_EXCEEDED)"
          - "Acting TradeAlly's X-User-ID == application.trade_ally_id (ERR_FORBIDDEN)"
        side_effects:
          - "For each line item: compute and pin pacing_tier_at_submit, incentive_cents, claimed_kwh"
          - "Compute application incentive_total_cents = sum(line.incentive_cents); claimed_kwh = sum(line.claimed_kwh)"
          - "Compute inspection_required via inspection_sampling_decision"
          - "Compute risk_score and auto_flag_status via fraud_risk_score; persist one FraudFlag row per triggered rule"
          - "submitted_at = current logical clock timestamp"
          - "ProgramYear.committed_cents += incentive_total_cents; ProgramYear.version += 1"
          - "RebateApplication.version incremented by 1"

      - from: SUBMITTED
        to: PRE_INSPECTION
        trigger: "POST /applications/{id}/schedule-pre-inspection"
        actor: ProgramAdministrator
        preconditions:
          - "RebateApplication.status == SUBMITTED (ERR_INVALID_STATE)"
          - "RebateApplication.inspection_required == true (ERR_INSPECTION_NOT_REQUIRED)"
        side_effects:
          - "Create Inspection row with application_id=this.id, inspection_kind=PRE, outcome=PENDING, scheduled_on=input"
          - "RebateApplication.version incremented by 1"

      - from: PRE_INSPECTION
        to: POST_INSPECTION
        trigger: "POST /inspections/{id}/complete where inspection_kind=PRE and outcome=PASSED (cascade from Inspection state change)"
        actor: VerificationInspector
        preconditions:
          - "RebateApplication.status == PRE_INSPECTION (set by Inspection cascade)"
        side_effects:
          - "RebateApplication.version incremented by 1"

      - from: PRE_INSPECTION
        to: REJECTED
        trigger: "POST /inspections/{id}/complete where inspection_kind=PRE and outcome=FAILED (cascade from Inspection state change)"
        actor: VerificationInspector
        preconditions:
          - "RebateApplication.status == PRE_INSPECTION (set by Inspection cascade)"
        side_effects:
          - "ProgramYear.committed_cents -= application.incentive_total_cents; ProgramYear.version += 1"
          - "RebateApplication.version incremented by 1"

      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /applications/{id}/verify (when inspection_required == false)"
        actor: VerificationInspector
        preconditions:
          - "RebateApplication.status == SUBMITTED (ERR_INVALID_STATE)"
          - "RebateApplication.inspection_required == false (ERR_INSPECTION_REQUIRED_OUTSTANDING)"
          - "For every ApplicationLineItem with a SavingsClaim where claim_method == MEASURED: pre_annual_kwh AND post_annual_kwh present AND post_annual_kwh < pre_annual_kwh (ERR_INVALID_MEASURED_INPUT)"
        side_effects:
          - "For each line item with SavingsClaim: compute final_kwh per claim_method (DEEMED → line.claimed_kwh; MEASURED → SavingsClaim.pre_annual_kwh - SavingsClaim.post_annual_kwh); set line.measured_kwh when MEASURED; persist final_kwh"
          - "For each line item WITHOUT a SavingsClaim: treated as DEEMED; final_kwh = line.claimed_kwh"
          - "application.final_kwh = sum(line.final_kwh)"
          - "application.verified_by = acting VerificationInspector X-User-ID"
          - "ProgramYear.reported_kwh += application.final_kwh"
          - "ProgramYear.adjusted_kwh recomputed using latest EvaluationAdjustment (if any)"
          - "ProgramYear.goal_attainment_pct recomputed"
          - "ProgramYear.version += 1"
          - "RebateApplication.version incremented by 1"

      - from: POST_INSPECTION
        to: VERIFIED
        trigger: "POST /applications/{id}/verify (when inspection_required == true and POST-kind Inspection PASSED)"
        actor: VerificationInspector
        preconditions:
          - "RebateApplication.status == POST_INSPECTION (ERR_INVALID_STATE)"
          - "An Inspection row exists with application_id == this.id AND inspection_kind == POST AND outcome == PASSED (ERR_POST_INSPECTION_NOT_PASSED)"
          - "For every ApplicationLineItem with a SavingsClaim where claim_method == MEASURED: pre_annual_kwh AND post_annual_kwh present AND post_annual_kwh < pre_annual_kwh (ERR_INVALID_MEASURED_INPUT)"
        side_effects:
          - "Same finalization side effects as SUBMITTED → VERIFIED"

      - from: VERIFIED
        to: APPROVED
        trigger: "POST /applications/{id}/approve"
        actor: ProgramAdministrator
        preconditions:
          - "RebateApplication.status == VERIFIED (ERR_INVALID_STATE)"
          - "RebateApplication.auto_flag_status != SUSPECT (ERR_FRAUD_SUSPECT_HOLD)"
          - "Acting ProgramAdministrator's X-User-ID != application.verified_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "RebateApplication.version incremented by 1"

      - from: APPROVED
        to: PAID
        trigger: "POST /applications/{id}/pay OR cascade from ProgramYear OPEN→CLOSED"
        actor: PaymentProcessor
        preconditions:
          - "RebateApplication.status == APPROVED (ERR_INVALID_STATE)"
        side_effects:
          - "ProgramYear.committed_cents -= incentive_total_cents"
          - "ProgramYear.paid_cents += incentive_total_cents"
          - "ProgramYear.version += 1"
          - "RebateApplication.version incremented by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /applications/{id}/reject"
        actor: ProgramAdministrator
        preconditions:
          - "RebateApplication.status IN {SUBMITTED, VERIFIED} (ERR_INVALID_STATE)"
        side_effects:
          - "ProgramYear.committed_cents -= incentive_total_cents; ProgramYear.version += 1"
          - "RebateApplication.version incremented by 1"

      - from: VERIFIED
        to: REJECTED
        trigger: "POST /applications/{id}/reject"
        actor: ProgramAdministrator
        preconditions:
          - "RebateApplication.status IN {SUBMITTED, VERIFIED} (ERR_INVALID_STATE)"
        side_effects:
          - "ProgramYear.committed_cents -= incentive_total_cents"
          - "ProgramYear.reported_kwh -= application.final_kwh"
          - "ProgramYear.adjusted_kwh recomputed using latest EvaluationAdjustment (if any)"
          - "ProgramYear.goal_attainment_pct recomputed"
          - "ProgramYear.version += 1"
          - "RebateApplication.version incremented by 1"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: TradeAlly
        preconditions:
          - "RebateApplication.status == DRAFT (ERR_INVALID_STATE)"
          - "Acting TradeAlly's X-User-ID == application.trade_ally_id (ERR_FORBIDDEN)"
        side_effects:
          - "RebateApplication.version incremented by 1"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: TradeAlly
        preconditions:
          - "RebateApplication.status == SUBMITTED (ERR_INVALID_STATE)"
          - "Acting TradeAlly's X-User-ID == application.trade_ally_id (ERR_FORBIDDEN)"
        side_effects:
          - "ProgramYear.committed_cents -= incentive_total_cents; ProgramYear.version += 1"
          - "RebateApplication.version incremented by 1"

  - entity: Inspection
    initial_state: PENDING
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /inspections/{id}/complete with outcome=PASSED"
        actor: VerificationInspector
        preconditions:
          - "Inspection.outcome == PENDING (ERR_INSPECTION_ALREADY_COMPLETED)"
          - "Parent RebateApplication.status must allow this completion: if inspection_kind == PRE then status == PRE_INSPECTION; if inspection_kind == POST then status == POST_INSPECTION (ERR_INVALID_STATE)"
        side_effects:
          - "completed_on = current logical clock date"
          - "If inspection_kind == PRE: parent RebateApplication.status PRE_INSPECTION → POST_INSPECTION"
          - "If inspection_kind == POST: parent RebateApplication.status remains POST_INSPECTION"
          - "TradeAlly (id == parent.trade_ally_id): performance_score and standing_tier recomputed using trade_ally_performance_score"
          - "Inspection.version incremented by 1"

      - from: PENDING
        to: FAILED
        trigger: "POST /inspections/{id}/complete with outcome=FAILED"
        actor: VerificationInspector
        preconditions:
          - "Inspection.outcome == PENDING (ERR_INSPECTION_ALREADY_COMPLETED)"
          - "fail_reason present (ERR_FAIL_REASON_REQUIRED)"
          - "Parent RebateApplication.status must allow: if PRE then PRE_INSPECTION; if POST then POST_INSPECTION (ERR_INVALID_STATE)"
        side_effects:
          - "completed_on = current logical clock date"
          - "Parent RebateApplication.status → REJECTED (from PRE_INSPECTION or POST_INSPECTION)"
          - "ProgramYear.committed_cents -= parent.incentive_total_cents; ProgramYear.version += 1"
          - "TradeAlly: performance_score and standing_tier recomputed"
          - "Inspection.version incremented by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: program-year-config-edit-stale
    parent_entity: ProgramYear
    write_endpoint: "PUT /program-years/{id}"
    occ_field: "expected_program_year_version"
    description: |
      Updating ProgramYear mutable config (budget_cap_cents, savings_goal_kwh)
      requires the client to present the ProgramYear.version it last observed.
      If the server-side ProgramYear.version has advanced (because a prior
      update or any cascade on a child application has incremented it), the
      update is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: pacing_tier_selection
    trigger: "RebateApplication DRAFT → SUBMITTED transition (per line item)"
    algorithm: tiered_pricing
    formula: |
      Let committed_pct = floor(100 * ProgramYear.committed_cents / ProgramYear.budget_cap_cents)
      computed at the moment of submission (BEFORE this application's incentive
      is added to committed_cents).

      Tier assignment (pinned per line as line.pacing_tier_at_submit):
        if committed_pct <  50:                   tier = STANDARD_TIER, tier_factor = 1.00
        if 50 <= committed_pct <  80:             tier = MID_TIER,      tier_factor = 0.80
        if committed_pct >= 80:                   tier = HIGH_TIER,     tier_factor = 0.50

      The boundary is inclusive on the lower edge: committed_pct == 50 selects
      MID_TIER; committed_pct == 80 selects HIGH_TIER.
    input_set: "ProgramYear.committed_cents and ProgramYear.budget_cap_cents at the moment of submission"
    constants:
      MID_TIER_FLOOR_PCT: 50
      HIGH_TIER_FLOOR_PCT: 80
      MID_TIER_FACTOR: 0.80
      HIGH_TIER_FACTOR: 0.50
    precision: "integer percent computed via floor; tier factor exact decimal"
    variants:
      - name: standard_tier
        when: "committed_pct < 50"
        difference: "tier_factor = 1.00 (full base rate)"
      - name: mid_tier
        when: "50 <= committed_pct < 80"
        difference: "tier_factor = 0.80 (20% reduction)"
      - name: high_tier
        when: "committed_pct >= 80"
        difference: "tier_factor = 0.50 (50% reduction)"

  - name: application_incentive_total
    trigger: "RebateApplication DRAFT → SUBMITTED transition"
    algorithm: aggregation
    formula: |
      For each ApplicationLineItem line of the submitting application:
        line.incentive_cents = round_half_up(Measure.base_rate_cents * line.quantity * tier_factor, 0)
        where tier_factor comes from line.pacing_tier_at_submit via pacing_tier_selection.
        line.claimed_kwh = Measure.deemed_kwh_per_unit * line.quantity

      Pinned rounding order (mandatory): round each line to integer cents FIRST,
      then sum the per-line integers. Do NOT sum raw floats and round once at the
      end — the two orders can disagree by a cent on fractional inputs.

      application.incentive_total_cents = sum over lines of line.incentive_cents
      application.claimed_kwh          = sum over lines of line.claimed_kwh
    input_set: "ApplicationLineItem rows of the application; Measure base rates and deemed kwh"
    precision: "integer cents per line; application total is sum of integer line values"
    variants: []

  - name: savings_claim_kwh
    trigger: "RebateApplication verification (SUBMITTED/POST_INSPECTION → VERIFIED), per line item"
    algorithm: dual_variant
    formula: |
      For each ApplicationLineItem, look up its SavingsClaim (1:1) by line_item_id.

      If no SavingsClaim exists for the line OR claim_method == DEEMED:
        line.final_kwh = line.claimed_kwh   (deemed value pinned at submission)
      If claim_method == MEASURED:
        line.measured_kwh = SavingsClaim.pre_annual_kwh - SavingsClaim.post_annual_kwh
        line.final_kwh    = line.measured_kwh
        (pre-validated: post_annual_kwh < pre_annual_kwh)

      SavingsClaim.computed_kwh = line.final_kwh (persisted)

      application.final_kwh = sum over lines of line.final_kwh
    input_set: "ApplicationLineItem rows of the verifying application plus their SavingsClaim rows"
    precision: "integer kWh (no rounding)"
    variants:
      - name: deemed
        when: "no SavingsClaim OR claim_method == DEEMED"
        difference: "Uses catalog-deemed per-unit savings pinned at submission"
      - name: measured
        when: "claim_method == MEASURED"
        difference: "Uses metered pre/post annual kWh delta; overrides deemed value entirely"

  - name: fraud_risk_score
    trigger: "RebateApplication DRAFT → SUBMITTED transition"
    algorithm: aggregation
    formula: |
      risk_score = 0
      triggered_flags = []

      Rule A — SAME_SERVICE_ADDRESS (half-open trailing window, invoice-anchored):
        Let W_A = [this_application.invoice_date - 30 days, this_application.invoice_date)
        — half-open: includes the left endpoint, EXCLUDES the right endpoint
        (the current application's own invoice_date is NOT in the window).
        If there EXISTS another RebateApplication other than this one
        with program_year_id == this.program_year_id,
          service_address == this.service_address,
          status IN {SUBMITTED, PRE_INSPECTION, POST_INSPECTION, VERIFIED, APPROVED, PAID},
          AND invoice_date IN W_A:
          risk_score += 40
          triggered_flags.append({flag_kind: SAME_SERVICE_ADDRESS, weight: 40})

      Rule B — ALLY_BURST (closed trailing window, clock-anchored, count threshold):
        Let today = current logical clock date.
        Let W_B = [today - 7 days, today]  — CLOSED interval (both endpoints inclusive).
        Let burst_count = count of RebateApplication rows
        with trade_ally_id == this.trade_ally_id,
          program_year_id == this.program_year_id,
          status IN {SUBMITTED, PRE_INSPECTION, POST_INSPECTION, VERIFIED, APPROVED, PAID},
          submitted_at date-component IN W_B,
          INCLUDING the current application.
        If burst_count >= ALLY_BURST_COUNT:
          risk_score += 25
          triggered_flags.append({flag_kind: ALLY_BURST, weight: 25})

      Rule C — INVOICE_GAP_SMALL (closed trailing window, clock-anchored):
        Let today = current logical clock date.
        If (today - this_application.invoice_date) <= INVOICE_GAP_WINDOW_DAYS days
        (i.e., invoice_date >= today - 7 days; equivalently invoice_date IN
        [today - 7 days, today], inclusive both ends):
          risk_score += 15
          triggered_flags.append({flag_kind: INVOICE_GAP_SMALL, weight: 15})

      auto_flag_status = (risk_score >= SUSPECT_THRESHOLD) ? SUSPECT : CLEAR

      Persist one FraudFlag row per triggered flag (common_fields: false, immutable).
    input_set: "Other RebateApplication rows in the same ProgramYear (same service_address with invoice_date in trailing half-open 30d window, or same trade_ally_id with submitted_at in trailing closed 7d window), plus current application fields"
    constants:
      SAME_SERVICE_ADDRESS_WEIGHT: 40
      SAME_SERVICE_ADDRESS_WINDOW_DAYS: 30
      ALLY_BURST_WEIGHT: 25
      ALLY_BURST_COUNT: 5
      ALLY_BURST_WINDOW_DAYS: 7
      INVOICE_GAP_WEIGHT: 15
      INVOICE_GAP_WINDOW_DAYS: 7
      SUSPECT_THRESHOLD: 50
    precision: "integer score"

  - name: trade_ally_performance_score
    trigger: "Inspection PENDING → PASSED or PENDING → FAILED"
    algorithm: aggregation
    formula: |
      Let ally_id = parent RebateApplication.trade_ally_id of the just-completed Inspection.
      Let passed = count of Inspection rows whose parent RebateApplication has
        trade_ally_id == ally_id AND outcome == PASSED.
      Let completed = count of Inspection rows whose parent RebateApplication has
        trade_ally_id == ally_id AND outcome IN {PASSED, FAILED}.

      if completed == 0:
        performance_score = 100
      else:
        performance_score = round_half_up(100 * passed / completed, 0)

      standing_tier derivation:
        if performance_score >= 90: standing_tier = PREFERRED
        elif performance_score >= 70: standing_tier = STANDARD
        else: standing_tier = PROBATION
    input_set: "All Inspection rows whose parent RebateApplication.trade_ally_id == ally.id (any ProgramYear)"
    constants:
      PREFERRED_FLOOR: 90
      STANDARD_FLOOR: 70
    precision: "integer score; round_half_up to 0 decimals"

  - name: evaluation_adjusted_kwh
    trigger: "EvaluationAdjustment creation on a CLOSED or REPORTED ProgramYear; also at ProgramYear CLOSED → REPORTED transition"
    algorithm: threshold
    formula: |
      Let adj = the EvaluationAdjustment row for this ProgramYear with the
      maximum effective_on date; ties on effective_on broken by created_at ASC
      (the earliest-created row wins among same-date ties).

      if no EvaluationAdjustment exists:
        adjusted_kwh = reported_kwh
      else:
        adjusted_kwh = floor(reported_kwh * adj.realization_rate_pct / 100)

      goal_attainment_pct = round_half_up(100 * adjusted_kwh / savings_goal_kwh, 0)
    input_set: "ProgramYear.reported_kwh; EvaluationAdjustment rows for this ProgramYear"
    precision: "integer kWh and percent; floor for kwh; round_half_up for percent"

  - name: inspection_sampling_decision
    trigger: "RebateApplication DRAFT → SUBMITTED transition"
    algorithm: threshold
    formula: |
      inspection_required = false

      Rule 1 — Index-based sampling:
        Let n = count of RebateApplication rows in the same ProgramYear that
        have already transitioned into SUBMITTED (or beyond) BEFORE this one —
        i.e., whose submitted_at is strictly earlier than this application's
        submitted_at. Ties on submitted_at broken by created_at ASC.

        if (n + 1) % SAMPLE_EVERY_N == 0:  # every Nth submission
          inspection_required = true

      Rule 2 — Large claim override:
        if application.claimed_kwh >= LARGE_CLAIM_KWH_THRESHOLD:
          inspection_required = true

      The two rules OR together.
    input_set: "This application's claimed_kwh; count of prior SUBMITTED+ applications in this ProgramYear"
    constants:
      SAMPLE_EVERY_N: 5
      LARGE_CLAIM_KWH_THRESHOLD: 10000
    precision: "boolean outcome"

  - name: invoice_date_window
    trigger: "RebateApplication DRAFT → SUBMITTED validation"
    algorithm: threshold
    formula: |
      Let program_open_date = the ISO8601 date component of ProgramYear.opened_at.
      Let today = current logical clock date (ISO8601 date component).
      Let earliest_allowed = program_open_date - 90 days.

      Accept iff earliest_allowed <= invoice_date <= today.
      Reject otherwise with ERR_INVOICE_DATE_OUT_OF_RANGE.
    input_set: "RebateApplication.invoice_date; ProgramYear.opened_at; logical clock date"
    constants:
      INVOICE_LOOKBACK_DAYS: 90
    precision: "inclusive on both ends (>= and <=)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role must be authorized for the endpoint per §1.5 roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path parameter {id} must resolve to an existing resource of the endpoint's type"
    error_id: "ERR_PROGRAM_YEAR_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_ALLY_NOT_FOUND | ERR_MEASURE_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_LINE_ITEM_NOT_FOUND | ERR_ADJUSTMENT_NOT_FOUND | ERR_SAVINGS_CLAIM_NOT_FOUND (by resource)"
    http_status: 404
    applies_to: "all endpoints with {id} path parameter"

  - priority: 4
    category: existence
    check: "Body-supplied foreign keys (program_year_id, trade_ally_id, measure_id, application_id, line_item_id) must reference existing resources"
    error_id: "ERR_PROGRAM_YEAR_NOT_FOUND | ERR_ALLY_NOT_FOUND | ERR_MEASURE_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_LINE_ITEM_NOT_FOUND (by field)"
    http_status: 404
    applies_to: "endpoints that accept FK ids in the request body"

  - priority: 5
    category: state
    check: "ProgramYear.status must be OPEN for operations that create or mutate applications or their children (create application, create line-item, create savings-claim, submit, schedule-pre-inspection, complete inspection, verify, approve, reject, pay, withdraw)"
    error_id: ERR_PROGRAM_NOT_OPEN
    http_status: 409
    applies_to: "POST /applications, POST /line-items, POST /savings-claims, POST /applications/{id}/submit, POST /applications/{id}/schedule-pre-inspection, POST /inspections/{id}/complete, POST /applications/{id}/verify, POST /applications/{id}/approve, POST /applications/{id}/reject, POST /applications/{id}/pay, POST /applications/{id}/withdraw"

  - priority: 6
    category: state
    check: "Entity-specific current state must match the transition's from-state"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_referential
    check: "TradeAlly.enroll_status must be ACTIVE at application submission"
    error_id: ERR_ALLY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /applications/{id}/submit"

  - priority: 8
    category: business_referential
    check: "Measure.is_active must be true for every line item's measure_id at application submission"
    error_id: ERR_MEASURE_INACTIVE
    http_status: 409
    applies_to: "POST /applications/{id}/submit"

  - priority: 9
    category: business_constraint
    check: "Application must contain at least one ApplicationLineItem before submit"
    error_id: ERR_NO_LINE_ITEMS
    http_status: 422
    applies_to: "POST /applications/{id}/submit"

  - priority: 10
    category: business_temporal
    check: "invoice_date must lie within [ProgramYear.opened_at date - 90 days, current logical clock date], inclusive both ends"
    error_id: ERR_INVOICE_DATE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /applications/{id}/submit"

  - priority: 11
    category: business_fiscal
    check: "At submission, sum of per-line incentive_cents (computed at current pacing tier) must be <= ProgramYear.budget_cap_cents - ProgramYear.committed_cents"
    error_id: ERR_PROGRAM_CAP_EXCEEDED
    http_status: 402
    applies_to: "POST /applications/{id}/submit"

  - priority: 12
    category: business_safety
    check: "When claim_method=MEASURED on any line's SavingsClaim, both pre_annual_kwh and post_annual_kwh must be present AND post_annual_kwh < pre_annual_kwh"
    error_id: ERR_INVALID_MEASURED_INPUT
    http_status: 422
    applies_to: "POST /applications/{id}/verify"

  - priority: 13
    category: business_safety
    check: "Application must not have auto_flag_status == SUSPECT at approve time"
    error_id: ERR_FRAUD_SUSPECT_HOLD
    http_status: 409
    applies_to: "POST /applications/{id}/approve"

  - priority: 14
    category: business_safety
    check: "Segregation of duties: approver's X-User-ID must differ from application.verified_by"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /applications/{id}/approve"

  - priority: 15
    category: business_referential
    check: "TradeAlly termination blocked when the ally has any application in {DRAFT, SUBMITTED, PRE_INSPECTION, POST_INSPECTION, VERIFIED}"
    error_id: ERR_ALLY_HAS_OPEN_APPLICATIONS
    http_status: 409
    applies_to: "POST /trade-allies/{id}/terminate"

  - priority: 16
    category: business_constraint
    check: "ProgramYear cannot close while any of its applications is in {SUBMITTED, PRE_INSPECTION, POST_INSPECTION, VERIFIED}"
    error_id: ERR_OPEN_APPLICATIONS_REMAIN
    http_status: 409
    applies_to: "POST /program-years/{id}/close"

  - priority: 17
    category: business_constraint
    check: "ProgramYear REPORTED transition requires at least one EvaluationAdjustment row"
    error_id: ERR_NO_EVALUATION_ADJUSTMENT
    http_status: 422
    applies_to: "POST /program-years/{id}/report"

  - priority: 18
    category: business_constraint
    check: "ProgramYear OPEN transition requires at least one Measure with program_year_id == this.id AND is_active == true"
    error_id: ERR_NO_ACTIVE_MEASURES
    http_status: 422
    applies_to: "POST /program-years/{id}/open"

  - priority: 19
    category: business_constraint
    check: "Inspection completion with outcome=FAILED requires a non-empty fail_reason"
    error_id: ERR_FAIL_REASON_REQUIRED
    http_status: 422
    applies_to: "POST /inspections/{id}/complete"

  - priority: 20
    category: state
    check: "Inspection must be in outcome=PENDING to complete"
    error_id: ERR_INSPECTION_ALREADY_COMPLETED
    http_status: 409
    applies_to: "POST /inspections/{id}/complete"

  - priority: 21
    category: business_temporal
    check: "Inspection scheduling requires application.inspection_required == true"
    error_id: ERR_INSPECTION_NOT_REQUIRED
    http_status: 409
    applies_to: "POST /applications/{id}/schedule-pre-inspection"

  - priority: 22
    category: business_temporal
    check: "Verification requires any inspection obligation to be satisfied: either inspection_required == false (direct verify), or POST-kind inspection exists with outcome == PASSED"
    error_id: ERR_INSPECTION_REQUIRED_OUTSTANDING
    http_status: 409
    applies_to: "POST /applications/{id}/verify"

  - priority: 23
    category: business_temporal
    check: "Verify from POST_INSPECTION additionally requires POST-kind Inspection outcome == PASSED"
    error_id: ERR_POST_INSPECTION_NOT_PASSED
    http_status: 409
    applies_to: "POST /applications/{id}/verify"

  - priority: 24
    category: auth
    check: "Ownership: acting TradeAlly's X-User-ID must equal the target application's trade_ally_id (for TradeAlly-initiated transitions on applications)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "POST /applications (trade_ally_id must match X-User-ID), POST /applications/{id}/submit, POST /applications/{id}/withdraw, POST /line-items, POST /savings-claims"

  - priority: 25
    category: business_constraint
    check: "OCC: PUT /program-years/{id} requires expected_program_year_version matching current ProgramYear.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PUT /program-years/{id}"

  - priority: 26
    category: business_constraint
    check: "Uniqueness: ProgramYear.program_code unique across all ProgramYears; TradeAlly.license_number unique; Measure.measure_code unique within its program_year_id"
    error_id: ERR_DUPLICATE_UNIQUE_FIELD
    http_status: 409
    applies_to: "POST /program-years, POST /trade-allies, POST /measures"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to an ISO8601 timestamp. Before any call to this endpoint, the logical clock reads exactly 2026-08-01T00:00:00Z (the fixed startup default) and MUST NOT fall back to wall-clock time."
    roles: [ProgramAdministrator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["server logical clock updated"]

  # --- ProgramYear ---
  - method: POST
    path: "/program-years"
    description: "Create a new ProgramYear"
    roles: [ProgramAdministrator]
    code: 201
    input: [program_code, program_year_label, budget_cap_cents, savings_goal_kwh]
    output: ProgramYear
    side_effects: ["status=DRAFT", "committed_cents=0", "paid_cents=0", "reported_kwh=0", "adjusted_kwh=0", "goal_attainment_pct=0", "version=1"]

  - method: GET
    path: "/program-years"
    description: "List ProgramYears"
    roles: [ProgramAdministrator, RegulatorAnalyst, VerificationInspector, PaymentProcessor, TradeAlly]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "ProgramYear[]"
    side_effects: []

  - method: GET
    path: "/program-years/{id}"
    description: "Get a single ProgramYear"
    roles: [ProgramAdministrator, RegulatorAnalyst, VerificationInspector, PaymentProcessor, TradeAlly]
    code: 200
    input: []
    output: ProgramYear
    side_effects: []

  - method: PUT
    path: "/program-years/{id}"
    description: "Update ProgramYear mutable config (budget_cap_cents, savings_goal_kwh). Guarded by OCC on ProgramYear.version."
    roles: [ProgramAdministrator]
    code: 200
    input: [expected_program_year_version, "budget_cap_cents?", "savings_goal_kwh?"]
    output: ProgramYear
    side_effects: ["ProgramYear.version incremented by 1", "updated_at refreshed"]

  - method: POST
    path: "/program-years/{id}/open"
    description: "Open a DRAFT ProgramYear"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: ProgramYear
    side_effects: ["status=OPEN", "opened_at set", "ProgramYear.version incremented"]

  - method: POST
    path: "/program-years/{id}/close"
    description: "Close an OPEN ProgramYear; auto-pays all APPROVED applications"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: ProgramYear
    side_effects: ["status=CLOSED", "APPROVED applications → PAID with committed_cents/paid_cents updates", "ProgramYear.version incremented"]

  - method: POST
    path: "/program-years/{id}/report"
    description: "Move CLOSED ProgramYear to REPORTED; final evaluation adjustment applied"
    roles: [RegulatorAnalyst]
    code: 200
    input: []
    output: ProgramYear
    side_effects: ["status=REPORTED", "adjusted_kwh and goal_attainment_pct recomputed from latest EvaluationAdjustment", "ProgramYear.version incremented"]

  # --- Measure ---
  - method: POST
    path: "/measures"
    description: "Create a Measure in a ProgramYear catalog"
    roles: [ProgramAdministrator]
    code: 201
    input: [program_year_id, measure_code, measure_name, base_rate_cents, deemed_kwh_per_unit, "requires_post_inspection?", "is_active?"]
    output: Measure
    side_effects: []

  - method: GET
    path: "/measures"
    description: "List Measures (filterable by program_year_id, is_active)"
    roles: [ProgramAdministrator, RegulatorAnalyst, VerificationInspector, PaymentProcessor, TradeAlly]
    code: 200
    input: ["limit?", "offset?", "program_year_id?", "is_active?"]
    output: "Measure[]"
    side_effects: []

  - method: GET
    path: "/measures/{id}"
    description: "Get a single Measure"
    roles: [ProgramAdministrator, RegulatorAnalyst, VerificationInspector, PaymentProcessor, TradeAlly]
    code: 200
    input: []
    output: Measure
    side_effects: []

  # --- TradeAlly ---
  - method: POST
    path: "/trade-allies"
    description: "Enroll a TradeAlly (starts in PENDING)"
    roles: [ProgramAdministrator]
    code: 201
    input: [ally_name, license_number]
    output: TradeAlly
    side_effects: ["enroll_status=PENDING", "performance_score=100", "standing_tier=STANDARD", "version=1"]

  - method: GET
    path: "/trade-allies"
    description: "List TradeAllies"
    roles: [ProgramAdministrator, RegulatorAnalyst, VerificationInspector, PaymentProcessor, TradeAlly]
    code: 200
    input: ["limit?", "offset?", "enroll_status?", "standing_tier?"]
    output: "TradeAlly[]"
    side_effects: []

  - method: GET
    path: "/trade-allies/{id}"
    description: "Get a TradeAlly"
    roles: [ProgramAdministrator, RegulatorAnalyst, VerificationInspector, PaymentProcessor, TradeAlly]
    code: 200
    input: []
    output: TradeAlly
    side_effects: []

  - method: POST
    path: "/trade-allies/{id}/activate"
    description: "Activate a PENDING TradeAlly"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: TradeAlly
    side_effects: ["enroll_status=ACTIVE", "TradeAlly.version incremented"]

  - method: POST
    path: "/trade-allies/{id}/suspend"
    description: "Suspend an ACTIVE TradeAlly"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: TradeAlly
    side_effects: ["enroll_status=SUSPENDED", "TradeAlly.version incremented"]

  - method: POST
    path: "/trade-allies/{id}/reinstate"
    description: "Reinstate a SUSPENDED TradeAlly to ACTIVE"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: TradeAlly
    side_effects: ["enroll_status=ACTIVE", "TradeAlly.version incremented"]

  - method: POST
    path: "/trade-allies/{id}/terminate"
    description: "Terminate a TradeAlly (ACTIVE or SUSPENDED); blocked if ally has open applications"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: TradeAlly
    side_effects: ["enroll_status=TERMINATED", "TradeAlly.version incremented"]

  # --- RebateApplication ---
  - method: POST
    path: "/applications"
    description: "Create a DRAFT RebateApplication (acting TradeAlly's X-User-ID must equal trade_ally_id in body)"
    roles: [TradeAlly]
    code: 201
    input: [program_year_id, trade_ally_id, customer_account_number, service_address, invoice_number, invoice_date]
    output: RebateApplication
    side_effects: ["status=DRAFT", "incentive_total_cents=0", "claimed_kwh=0", "final_kwh=0", "inspection_required=false", "risk_score=0", "auto_flag_status=CLEAR", "version=1"]

  - method: GET
    path: "/applications"
    description: "List applications (filterable by program_year_id, trade_ally_id, status, auto_flag_status)"
    roles: [ProgramAdministrator, RegulatorAnalyst, VerificationInspector, PaymentProcessor, TradeAlly]
    code: 200
    input: ["limit?", "offset?", "program_year_id?", "trade_ally_id?", "status?", "auto_flag_status?"]
    output: "RebateApplication[]"
    side_effects: []

  - method: GET
    path: "/applications/{id}"
    description: "Get a single application"
    roles: [ProgramAdministrator, RegulatorAnalyst, VerificationInspector, PaymentProcessor, TradeAlly]
    code: 200
    input: []
    output: RebateApplication
    side_effects: []

  - method: POST
    path: "/applications/{id}/submit"
    description: "Submit a DRAFT application; computes incentives, claimed kwh, fraud score, sampling flag"
    roles: [TradeAlly]
    code: 200
    input: []
    output: RebateApplication
    side_effects: ["per-line incentive_cents + claimed_kwh computed and pinned", "application incentive_total_cents + claimed_kwh computed", "inspection_required computed", "risk_score + auto_flag_status computed; FraudFlag rows persisted", "submitted_at set", "ProgramYear.committed_cents incremented", "ProgramYear.version incremented", "RebateApplication.version incremented"]

  - method: POST
    path: "/applications/{id}/schedule-pre-inspection"
    description: "Schedule PRE-kind inspection for an application flagged inspection_required"
    roles: [ProgramAdministrator]
    code: 201
    input: [scheduled_on]
    output: Inspection
    side_effects: ["application status SUBMITTED → PRE_INSPECTION", "Inspection row created with inspection_kind=PRE, outcome=PENDING", "RebateApplication.version incremented"]

  - method: POST
    path: "/applications/{id}/schedule-post-inspection"
    description: "Schedule POST-kind inspection for an application in POST_INSPECTION status"
    roles: [ProgramAdministrator]
    code: 201
    input: [scheduled_on]
    output: Inspection
    side_effects: ["Inspection row created with inspection_kind=POST, outcome=PENDING (application status unchanged)"]

  - method: POST
    path: "/applications/{id}/verify"
    description: "Verify an application; computes final_kwh per line item"
    roles: [VerificationInspector]
    code: 200
    input: []
    output: RebateApplication
    side_effects: ["line final_kwh computed per claim_method", "application final_kwh = sum(line final_kwh)", "verified_by set", "ProgramYear.reported_kwh incremented", "ProgramYear.adjusted_kwh and goal_attainment_pct recomputed", "ProgramYear.version incremented", "RebateApplication.version incremented"]

  - method: POST
    path: "/applications/{id}/approve"
    description: "Approve a VERIFIED application; enforces fraud-hold and segregation-of-duties"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: RebateApplication
    side_effects: ["application status VERIFIED → APPROVED", "RebateApplication.version incremented"]

  - method: POST
    path: "/applications/{id}/pay"
    description: "Pay an APPROVED application; moves incentive from committed to paid"
    roles: [PaymentProcessor]
    code: 200
    input: []
    output: RebateApplication
    side_effects: ["application status APPROVED → PAID", "ProgramYear.committed_cents -= incentive_total_cents", "ProgramYear.paid_cents += incentive_total_cents", "ProgramYear.version incremented", "RebateApplication.version incremented"]

  - method: POST
    path: "/applications/{id}/reject"
    description: "Reject an application (from SUBMITTED or VERIFIED)"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: RebateApplication
    side_effects: ["application status → REJECTED", "ProgramYear.committed_cents -= incentive_total_cents", "if previously VERIFIED: reported_kwh decremented and adjusted_kwh recomputed", "ProgramYear.version incremented", "RebateApplication.version incremented"]

  - method: POST
    path: "/applications/{id}/withdraw"
    description: "Withdraw a DRAFT or SUBMITTED application (acting TradeAlly must own it)"
    roles: [TradeAlly]
    code: 200
    input: []
    output: RebateApplication
    side_effects: ["application status → WITHDRAWN", "if was SUBMITTED: ProgramYear.committed_cents -= incentive_total_cents; ProgramYear.version incremented", "RebateApplication.version incremented"]

  # --- ApplicationLineItem ---
  - method: POST
    path: "/line-items"
    description: "Add a line item to a DRAFT application (acting TradeAlly must own the parent application)"
    roles: [TradeAlly]
    code: 201
    input: [application_id, measure_id, quantity]
    output: ApplicationLineItem
    side_effects: ["RebateApplication.version NOT incremented (line items are independent)"]

  - method: GET
    path: "/line-items"
    description: "List line items (filterable by application_id, measure_id)"
    roles: [ProgramAdministrator, RegulatorAnalyst, VerificationInspector, PaymentProcessor, TradeAlly]
    code: 200
    input: ["limit?", "offset?", "application_id?", "measure_id?"]
    output: "ApplicationLineItem[]"
    side_effects: []

  - method: GET
    path: "/line-items/{id}"
    description: "Get a single line item"
    roles: [ProgramAdministrator, RegulatorAnalyst, VerificationInspector, PaymentProcessor, TradeAlly]
    code: 200
    input: []
    output: ApplicationLineItem
    side_effects: []

  # --- SavingsClaim ---
  - method: POST
    path: "/savings-claims"
    description: "Attach a SavingsClaim to a line item (1:1; must be done before verification)"
    roles: [TradeAlly]
    code: 201
    input: [line_item_id, claim_method, "pre_annual_kwh?", "post_annual_kwh?"]
    output: SavingsClaim
    side_effects: ["computed_kwh populated based on claim_method (DEEMED → line.claimed_kwh; MEASURED → pre - post at verify time)"]

  - method: GET
    path: "/savings-claims"
    description: "List SavingsClaims (filterable by line_item_id, claim_method)"
    roles: [ProgramAdministrator, RegulatorAnalyst, VerificationInspector, PaymentProcessor, TradeAlly]
    code: 200
    input: ["limit?", "offset?", "line_item_id?", "claim_method?"]
    output: "SavingsClaim[]"
    side_effects: []

  - method: GET
    path: "/savings-claims/{id}"
    description: "Get a SavingsClaim"
    roles: [ProgramAdministrator, RegulatorAnalyst, VerificationInspector, PaymentProcessor, TradeAlly]
    code: 200
    input: []
    output: SavingsClaim
    side_effects: []

  # --- Inspection ---
  - method: GET
    path: "/inspections"
    description: "List Inspections (filterable by application_id, inspection_kind, outcome)"
    roles: [ProgramAdministrator, RegulatorAnalyst, VerificationInspector, PaymentProcessor, TradeAlly]
    code: 200
    input: ["limit?", "offset?", "application_id?", "inspection_kind?", "outcome?"]
    output: "Inspection[]"
    side_effects: []

  - method: GET
    path: "/inspections/{id}"
    description: "Get an Inspection"
    roles: [ProgramAdministrator, RegulatorAnalyst, VerificationInspector, PaymentProcessor, TradeAlly]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: POST
    path: "/inspections/{id}/complete"
    description: "Complete a PENDING inspection with outcome PASSED or FAILED"
    roles: [VerificationInspector]
    code: 200
    input: [outcome, "fail_reason?"]
    output: Inspection
    side_effects: ["Inspection outcome recorded; completed_on set", "if PRE+PASSED: application → POST_INSPECTION", "if PRE+FAILED: application → REJECTED and ProgramYear.committed_cents decremented", "if POST+FAILED: application → REJECTED and ProgramYear.committed_cents decremented", "TradeAlly performance_score and standing_tier recomputed", "Inspection.version incremented"]

  # --- FraudFlag ---
  - method: GET
    path: "/fraud-flags"
    description: "List FraudFlags (filterable by application_id, flag_kind)"
    roles: [ProgramAdministrator, RegulatorAnalyst, VerificationInspector, PaymentProcessor, TradeAlly]
    code: 200
    input: ["limit?", "offset?", "application_id?", "flag_kind?"]
    output: "FraudFlag[]"
    side_effects: []

  - method: GET
    path: "/fraud-flags/{id}"
    description: "Get a FraudFlag"
    roles: [ProgramAdministrator, RegulatorAnalyst, VerificationInspector, PaymentProcessor, TradeAlly]
    code: 200
    input: []
    output: FraudFlag
    side_effects: []

  # --- EvaluationAdjustment ---
  - method: POST
    path: "/evaluation-adjustments"
    description: "Create an EvaluationAdjustment on a CLOSED or REPORTED ProgramYear"
    roles: [RegulatorAnalyst]
    code: 201
    input: [program_year_id, realization_rate_pct, effective_on, "notes?"]
    output: EvaluationAdjustment
    side_effects: ["ProgramYear.adjusted_kwh and goal_attainment_pct recomputed using latest adjustment (this row becomes latest iff its effective_on is the max; ties broken by created_at ASC)"]

  - method: GET
    path: "/evaluation-adjustments"
    description: "List EvaluationAdjustments (filterable by program_year_id)"
    roles: [ProgramAdministrator, RegulatorAnalyst, VerificationInspector, PaymentProcessor, TradeAlly]
    code: 200
    input: ["limit?", "offset?", "program_year_id?"]
    output: "EvaluationAdjustment[]"
    side_effects: []

  - method: GET
    path: "/evaluation-adjustments/{id}"
    description: "Get an EvaluationAdjustment"
    roles: [ProgramAdministrator, RegulatorAnalyst, VerificationInspector, PaymentProcessor, TradeAlly]
    code: 200
    input: []
    output: EvaluationAdjustment
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-ID / X-User-Role headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Authenticated role lacks permission for the endpoint" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Entity-backed role attempted to act on a resource it does not own (e.g., TradeAlly creating/submitting/withdrawing on behalf of another ally)" }
  - { id: ERR_PROGRAM_YEAR_NOT_FOUND, http: 404, condition: "program_year_id path or body reference does not resolve" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "application_id path or body reference does not resolve" }
  - { id: ERR_ALLY_NOT_FOUND, http: 404, condition: "trade_ally_id path or body reference does not resolve" }
  - { id: ERR_MEASURE_NOT_FOUND, http: 404, condition: "measure_id path or body reference does not resolve" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "inspection_id path reference does not resolve" }
  - { id: ERR_LINE_ITEM_NOT_FOUND, http: 404, condition: "line_item_id path or body reference does not resolve" }
  - { id: ERR_SAVINGS_CLAIM_NOT_FOUND, http: 404, condition: "savings_claim_id path reference does not resolve" }
  - { id: ERR_ADJUSTMENT_NOT_FOUND, http: 404, condition: "adjustment_id path reference does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity's current status does not match the transition's required from-state" }
  - { id: ERR_PROGRAM_NOT_OPEN, http: 409, condition: "ProgramYear.status != OPEN for application create/mutate operations" }
  - { id: ERR_ALLY_NOT_ACTIVE, http: 409, condition: "TradeAlly.enroll_status != ACTIVE when an application is submitted under it" }
  - { id: ERR_MEASURE_INACTIVE, http: 409, condition: "Measure.is_active == false referenced by a line item at submit time" }
  - { id: ERR_NO_LINE_ITEMS, http: 422, condition: "Submit attempted with zero ApplicationLineItem rows" }
  - { id: ERR_INVOICE_DATE_OUT_OF_RANGE, http: 422, condition: "invoice_date outside [ProgramYear.opened_at - 90 days, today]" }
  - { id: ERR_PROGRAM_CAP_EXCEEDED, http: 402, condition: "Submission would push ProgramYear.committed_cents above budget_cap_cents" }
  - { id: ERR_INVALID_MEASURED_INPUT, http: 422, condition: "claim_method=MEASURED with missing pre/post_annual_kwh or post >= pre" }
  - { id: ERR_FRAUD_SUSPECT_HOLD, http: 409, condition: "Approve attempted on application with auto_flag_status == SUSPECT" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Approver X-User-ID equals application.verified_by" }
  - { id: ERR_ALLY_HAS_OPEN_APPLICATIONS, http: 409, condition: "TradeAlly terminate blocked by open applications in {DRAFT, SUBMITTED, PRE_INSPECTION, POST_INSPECTION, VERIFIED}" }
  - { id: ERR_OPEN_APPLICATIONS_REMAIN, http: 409, condition: "ProgramYear close attempted while applications remain in {SUBMITTED, PRE_INSPECTION, POST_INSPECTION, VERIFIED}" }
  - { id: ERR_NO_EVALUATION_ADJUSTMENT, http: 422, condition: "REPORTED transition attempted without any EvaluationAdjustment" }
  - { id: ERR_NO_ACTIVE_MEASURES, http: 422, condition: "OPEN transition attempted with zero active measures in catalog" }
  - { id: ERR_FAIL_REASON_REQUIRED, http: 422, condition: "Inspection completion with outcome=FAILED missing fail_reason" }
  - { id: ERR_INSPECTION_ALREADY_COMPLETED, http: 409, condition: "Complete attempted on inspection already in PASSED or FAILED" }
  - { id: ERR_INSPECTION_NOT_REQUIRED, http: 409, condition: "Schedule-pre-inspection attempted when application.inspection_required == false" }
  - { id: ERR_INSPECTION_REQUIRED_OUTSTANDING, http: 409, condition: "Verify attempted while inspection_required == true and application still in SUBMITTED (no PRE inspection scheduled/passed)" }
  - { id: ERR_POST_INSPECTION_NOT_PASSED, http: 409, condition: "Verify from POST_INSPECTION without a POST-kind Inspection with outcome == PASSED" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_program_year_version does not match server-side ProgramYear.version" }
  - { id: ERR_DUPLICATE_UNIQUE_FIELD, http: 409, condition: "Uniqueness violation on program_code, license_number, or (program_year_id, measure_code)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Generic malformed request: missing required field, wrong type, or out-of-range scalar" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdministrator
    description: "Utility DSM program staff; manages catalog, opens/closes program year, schedules inspections, approves applications"
    identity: opaque
    exclusive_operations:
      - "POST /program-years"
      - "PUT /program-years/{id}"
      - "POST /program-years/{id}/open"
      - "POST /program-years/{id}/close"
      - "POST /measures"
      - "POST /trade-allies"
      - "POST /trade-allies/{id}/activate"
      - "POST /trade-allies/{id}/suspend"
      - "POST /trade-allies/{id}/reinstate"
      - "POST /trade-allies/{id}/terminate"
      - "POST /applications/{id}/schedule-pre-inspection"
      - "POST /applications/{id}/schedule-post-inspection"
      - "POST /applications/{id}/approve"
      - "POST /applications/{id}/reject"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across all resources"

  - name: TradeAlly
    description: "Enrolled contractor; creates and submits applications for customers, owns line items and savings claims, can withdraw own drafts/submissions"
    identity: "entity_backed:TradeAlly"
    exclusive_operations:
      - "POST /applications"
      - "POST /line-items"
      - "POST /savings-claims"
      - "POST /applications/{id}/submit"
      - "POST /applications/{id}/withdraw"
    shared_operations:
      - "GET reads across all resources"

  - name: VerificationInspector
    description: "Third-party verification staff; completes inspections and verifies applications"
    identity: opaque
    exclusive_operations:
      - "POST /inspections/{id}/complete"
      - "POST /applications/{id}/verify"
    shared_operations:
      - "GET reads across all resources"

  - name: PaymentProcessor
    description: "Finance operations role; issues payment on approved applications"
    identity: opaque
    exclusive_operations:
      - "POST /applications/{id}/pay"
    shared_operations:
      - "GET reads across all resources"

  - name: RegulatorAnalyst
    description: "External regulator / EM&V analyst; manages evaluation adjustments, closes out reporting"
    identity: opaque
    exclusive_operations:
      - "POST /evaluation-adjustments"
      - "POST /program-years/{id}/report"
    shared_operations:
      - "GET reads across all resources"
