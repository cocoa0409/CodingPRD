        - Logical clock at 2026-08-05T09:00:00.000Z throughout.
        - RateBenchmark (TIER_1, USER_CONFERENCE) at 260.00 ADR, 24% service charge, 15.6% tax.
        - 'Two PREFERRED TIER_1 venues: ''Harborline Grand'' and ''Cascade Bay Resort''.'
        - MeetingEvent EVT-2822-A 2027-03-15..2027-03-18, budget ceiling 500000.00, requirements locked.
