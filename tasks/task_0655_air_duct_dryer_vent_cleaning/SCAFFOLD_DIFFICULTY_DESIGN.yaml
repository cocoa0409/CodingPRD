  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: overlap_buffer_extended_slot_collision_on_route
        grounds:
          - validations[priority=11]
          - calculations.route_slot_overlap
          - state_machines.WorkOrder.QUOTED_to_SCHEDULED
          - entities.WorkOrder.fields.scheduled_start_minute
          - entities.WorkOrder.fields.duration_minutes
        distinguishing_aspect: |
          Buffer-extended interval semantics on RoutePlan: an existing committed slot
          [540,575) plus BUFFER_MINUTES=15 reserves [525,590); a second commit at start
          585 (slot [585,620)) collides within the buffer and is rejected ERR_SLOT_OVERLAP.
        test_recipe:
          setup:
            - "Route Z1 OPEN with WorkOrder1 (DUCT, 1 system, duration 35) committed at minute 540 (slot 540..575)."
            - "WorkOrder2 (DUCT, 1 system, duration 35) QUOTED in same zone awaiting commit."
          setup_api_calls:
            - call: "POST /pricing-configs"
              payload: { duct_base_cents: 12000, duct_per_system_cents: 4000, dryer_vent_flat_cents: 9000, sanitize_per_system_cents: 5000, addon_sanitizer_cents: 3000, addon_uv_cents: 7000, addon_coil_cents: 2500, multi_system_discount_pct: 0.10, plan_member_discount_pct: 0.15, tax_pct: 0.08 }
              as: PlanAdmin
              captures: { cfg_id: $.data.id }
            - call: "POST /pricing-configs/${cfg_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Ned Owner", email: "ned@x.com", phone: "555-0113" }
              as: PlanAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${owner_id}", address_line: "15 Vent Rd", zone_code: "Z1", square_footage: 1500 }
              as: PlanAdmin
              captures: { home_id: $.data.id }
            - call: "POST /homes/${home_id}/systems"
              payload: { label: "Sys A", register_count: 5 }
              as: PlanAdmin
              captures: { sys_a: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Tech 11", home_zone_code: "Z1" }
              as: Dispatcher
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { home_id: "${home_id}", service_lines: [ { service_type: "DUCT", system_id: "${sys_a}" } ], requested_start_minute: 540 }
              as: Dispatcher
              captures: { wo1: $.data.id }
            - call: "POST /work-orders/${wo1}/inspect"
              payload: { before_photo_count: 1, dust_severity: 3 }
              as: Technician
              as_user_id: "${crew_id}"
            - call: "POST /work-orders/${wo1}/quote"
              payload: {}
              as: Technician
              as_user_id: "${crew_id}"
            - call: "POST /work-orders"
              payload: { home_id: "${home_id}", service_lines: [ { service_type: "DUCT", system_id: "${sys_a}" } ], requested_start_minute: 585 }
              as: Dispatcher
              captures: { wo2: $.data.id }
            - call: "POST /work-orders/${wo2}/inspect"
              payload: { before_photo_count: 1, dust_severity: 3 }
              as: Technician
              as_user_id: "${crew_id}"
            - call: "POST /work-orders/${wo2}/quote"
              payload: {}
              as: Technician
              as_user_id: "${crew_id}"
            - call: "POST /route-plans"
              payload: { crew_member_id: "${crew_id}", zone_code: "Z1", service_date: "2026-04-19", shift_start_minute: 480, shift_end_minute: 1020 }
              as: Dispatcher
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /route-plans/${route_id}/commit"
              payload: { work_order_id: "${wo1}", scheduled_start_minute: 540, expected_route_plan_version: "${route_v}" }
              as: Dispatcher
              captures: { route_v2: $.data.version }
          trigger:
            - call: "POST /route-plans/${route_id}/commit"
              payload: { work_order_id: "${wo2}", scheduled_start_minute: 585, expected_route_plan_version: "${route_v2}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409 and data.error_id == ERR_SLOT_OVERLAP"

      - name: overlap_crew_double_booked_across_routes_same_date
        grounds:
          - validations[priority=11b]
          - entities.RoutePlan.fields.crew_member_id
          - entities.RoutePlan.fields.shift_start_minute
          - entities.RoutePlan.fields.shift_end_minute
        distinguishing_aspect: |
          Different RESOURCE entity (CrewMember, not RoutePlan) and different interval
          semantics (whole-shift CLOSED-interval overlap with NO buffer, vs the buffered
          half-open slot collision): a second RoutePlan for the same crew on 2026-05-05
          with window [600,720] overlapping the first route's [480,660] is rejected
          ERR_CREW_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "One crew member with an existing OPEN RoutePlan on 2026-05-05, window [480,660], zone Z1."
          setup_api_calls:
            - call: "POST /crew-members"
              payload: { full_name: "Tech 12", home_zone_code: "Z1" }
              as: Dispatcher
              captures: { crew_id: $.data.id }
            - call: "POST /route-plans"
              payload: { crew_member_id: "${crew_id}", zone_code: "Z1", service_date: "2026-05-05", shift_start_minute: 480, shift_end_minute: 660 }
              as: Dispatcher
              captures: { route1_id: $.data.id }
          trigger:
            - call: "POST /route-plans"
              payload: { crew_member_id: "${crew_id}", zone_code: "Z1", service_date: "2026-05-05", shift_start_minute: 600, shift_end_minute: 720 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409 and data.error_id == ERR_CREW_DOUBLE_BOOKED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: compensating_route_committed_minutes_restored_on_cancel
        grounds:
          - calculations.route_committed_minutes
          - state_machines.WorkOrder.QUOTED_to_SCHEDULED
          - state_machines.WorkOrder.SCHEDULED_to_CANCELLED
          - entities.RoutePlan.fields.committed_minutes
        distinguishing_aspect: |
          Conserved quantity = RoutePlan.committed_minutes. Commit (+35) then cancel (-35)
          leaves committed_minutes exactly at its pre-commit value 0; no drift.
        test_recipe:
          setup:
            - "Route Z1 OPEN, committed_minutes 0; one QUOTED DUCT WorkOrder (duration 35) in zone Z1."
          setup_api_calls:
            - call: "POST /pricing-configs"
              payload: { duct_base_cents: 12000, duct_per_system_cents: 4000, dryer_vent_flat_cents: 9000, sanitize_per_system_cents: 5000, addon_sanitizer_cents: 3000, addon_uv_cents: 7000, addon_coil_cents: 2500, multi_system_discount_pct: 0.10, plan_member_discount_pct: 0.15, tax_pct: 0.08 }
              as: PlanAdmin
              captures: { cfg_id: $.data.id }
            - call: "POST /pricing-configs/${cfg_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Pam Owner", email: "pam@x.com", phone: "555-0115" }
              as: PlanAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${owner_id}", address_line: "17 Vent Rd", zone_code: "Z1", square_footage: 1500 }
              as: PlanAdmin
              captures: { home_id: $.data.id }
            - call: "POST /homes/${home_id}/systems"
              payload: { label: "Sys A", register_count: 5 }
              as: PlanAdmin
              captures: { sys_a: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Tech 13", home_zone_code: "Z1" }
              as: Dispatcher
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { home_id: "${home_id}", service_lines: [ { service_type: "DUCT", system_id: "${sys_a}" } ], requested_start_minute: 540 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/inspect"
              payload: { before_photo_count: 1, dust_severity: 3 }
              as: Technician
              as_user_id: "${crew_id}"
            - call: "POST /work-orders/${wo_id}/quote"
              payload: {}
              as: Technician
              as_user_id: "${crew_id}"
            - call: "POST /route-plans"
              payload: { crew_member_id: "${crew_id}", zone_code: "Z1", service_date: "2026-04-21", shift_start_minute: 480, shift_end_minute: 1020 }
              as: Dispatcher
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /route-plans/${route_id}/commit"
              payload: { work_order_id: "${wo_id}", scheduled_start_minute: 540, expected_route_plan_version: "${route_v}" }
              as: Dispatcher
            - call: "GET /route-plans/${route_id}"
              payload: {}
              as: Dispatcher
              captures: { cm_after_commit: $.data.committed_minutes }
          trigger:
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: {}
              as: Dispatcher
            - call: "GET /route-plans/${route_id}"
              payload: {}
              as: Dispatcher
              captures: { cm_after_cancel: $.data.committed_minutes }
          assert:
            - "After commit RoutePlan.${route_id}.committed_minutes == 35"
            - "After cancel RoutePlan.${route_id}.committed_minutes == 0"

      - name: compensating_pricing_config_active_count_invariant
        grounds:
          - state_machines.RecurringPlan.lifecycle_ACTIVE_to_PAUSED
          - state_machines.RecurringPlan.lifecycle_PAUSED_to_ACTIVE
          - entities.Home.fields.has_active_plan
        distinguishing_aspect: |
          Conserved quantity = the home's plan-membership flag (different from minutes):
          pause then resume leaves Home.has_active_plan exactly true again, with the
          plan's lifecycle_status back to ACTIVE — no drift across the compensating pair.
        test_recipe:
          setup:
            - "Home Z1 with 1 ACTIVE system and one ACTIVE RecurringPlan; has_active_plan true."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Quy Owner", email: "quy@x.com", phone: "555-0116" }
              as: PlanAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${owner_id}", address_line: "18 Vent Rd", zone_code: "Z1", square_footage: 1500 }
              as: PlanAdmin
              captures: { home_id: $.data.id }
            - call: "POST /homes/${home_id}/systems"
              payload: { label: "Sys A", register_count: 5 }
              as: PlanAdmin
              captures: { sys_a: $.data.id }
            - call: "GET /homes/${home_id}"
              payload: {}
              as: PlanAdmin
              captures: { home_v: $.data.version }
            - call: "POST /homes/${home_id}/recurring-plans"
              payload: { cadence_months: 12, expected_home_version: "${home_v}" }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /recurring-plans/${plan_id}/pause"
              payload: {}
              as: PlanAdmin
            - call: "GET /homes/${home_id}"
              payload: {}
              as: PlanAdmin
              captures: { has_plan_paused: $.data.has_active_plan }
          trigger:
            - call: "POST /recurring-plans/${plan_id}/resume"
              payload: {}
              as: PlanAdmin
              captures: { lifecycle_after: $.data.lifecycle_status }
            - call: "GET /homes/${home_id}"
              payload: {}
              as: PlanAdmin
              captures: { has_plan_resumed: $.data.has_active_plan }
          assert:
            - "After pause GET /homes/${home_id} has_active_plan == false"
            - "After resume RecurringPlan.${plan_id}.lifecycle_status == ACTIVE"
            - "After resume GET /homes/${home_id} has_active_plan == true"
