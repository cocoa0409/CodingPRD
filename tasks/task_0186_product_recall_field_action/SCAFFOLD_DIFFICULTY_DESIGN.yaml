  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      # --- state (INVALID_STATE, p6) vs business_safety (SEGREGATION, p7) ----
      - name: invalid_state_beats_segregation_on_double_announce
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: >
          A recall already ANNOUNCED, re-announced by the SAME user who classified
          it, violates both p6 state (already ANNOUNCED) and p7 segregation; p6 wins
          so ERR_INVALID_STATE is returned — a state vs business_safety pair.
        test_recipe:
          setup:
            - "Recall classified by U1, announced by U2 (already ANNOUNCED). Now U1 re-announces (would breach segregation if state allowed)."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-PV1", name: "Lamp", regulator: "FDA", unit_list_price_cents: 6000 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod}", lot_code: "LV1", serial_start: 1, serial_end: 100 }
              as: RecallCoordinator
              captures: { lot: $.data.id }
            - call: "POST /recalls"
              payload: { product_id: "${prod}", reason: "shock", hazard_severity: "SERIOUS", injury_reported: false }
              as: RecallCoordinator
              captures: { rc: $.data.id, rc_v0: $.data.version }
            - call: "POST /recalls/${rc}/affected-lots"
              payload: { lot_id: "${lot}", expected_recall_version: "${rc_v0}" }
              as: RecallCoordinator
            - call: "POST /recalls/${rc}/classify"
              payload: {}
              as: RecallCoordinator
              as_user_id: "user-u1"
            - call: "POST /regulatory-reports"
              payload: { recall_id: "${rc}", report_kind: "INITIAL" }
              as: RecallCoordinator
              captures: { rep: $.data.id }
            - call: "POST /regulatory-reports/${rep}/submit"
              payload: {}
              as: QualityOfficer
            - call: "POST /recalls/${rc}/announce"
              payload: {}
              as: QualityOfficer
              as_user_id: "user-u2"
          trigger:
            - call: "POST /recalls/${rc}/announce"
              payload: {}
              as: QualityOfficer
              as_user_id: "user-u1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      # --- business_safety (SEGREGATION, p7) vs business_safety (INITIAL_REPORT, p8) ---
      - name: segregation_beats_missing_initial_report_on_announce
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_INITIAL_REPORT_REQUIRED]
        distinguishing_aspect: >
          An announce by the classifying user on a recall that ALSO lacks an INITIAL
          report violates p7 segregation and p8 initial-report; p7 (lower number)
          wins so ERR_SEGREGATION_OF_DUTIES is returned — a business_safety vs
          business_safety ordering, a different category pair than the state-vs-safety
          conflict above.
        test_recipe:
          setup:
            - "Recall classified by U1, no INITIAL report submitted. U1 attempts to announce."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-PV2", name: "Stove", regulator: "FDA", unit_list_price_cents: 6000 }
              as: PlatformAdmin
              captures: { prod: $.data.id }
            - call: "POST /lots"
              payload: { product_id: "${prod}", lot_code: "LV2", serial_start: 1, serial_end: 100 }
              as: RecallCoordinator
              captures: { lot: $.data.id }
            - call: "POST /recalls"
              payload: { product_id: "${prod}", reason: "gas", hazard_severity: "SERIOUS", injury_reported: false }
              as: RecallCoordinator
              captures: { rc: $.data.id, rc_v0: $.data.version }
            - call: "POST /recalls/${rc}/affected-lots"
              payload: { lot_id: "${lot}", expected_recall_version: "${rc_v0}" }
              as: RecallCoordinator
            - call: "POST /recalls/${rc}/classify"
              payload: {}
              as: RecallCoordinator
              as_user_id: "user-u1"
          trigger:
            - call: "POST /recalls/${rc}/announce"
              payload: {}
              as: QualityOfficer
              as_user_id: "user-u1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_SEGREGATION_OF_DUTIES"

