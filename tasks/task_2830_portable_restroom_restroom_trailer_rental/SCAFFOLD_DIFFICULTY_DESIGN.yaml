            - call: "POST /placement-permits/${permit_id}/submit"
              payload: { submission_note: "round 1" }
              as: PermitCoordinator
              captures: { round_1: $.data.revision_round }
            - call: "POST /placement-permits/${permit_id}/reject"
              payload: { authority_decision_ref: "AD-6001", rejection_reason: "site plan missing ADA path" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /placement-permits/${permit_id}/submit"
              payload: { submission_note: "round 2" }
              as: PermitCoordinator
              captures: { round_2: $.data.revision_round, status_2: $.data.status }
            - call: "POST /placement-permits/${permit_id}/reject"
              payload: { authority_decision_ref: "AD-6002", rejection_reason: "encroachment into travel lane" }
              as: ComplianceOfficer
            - call: "POST /placement-permits/${permit_id}/submit"
              payload: { submission_note: "round 3" }
