  - section: state_machines
    instances:

      - name: fee_program_starts_in_draft_with_null_attestation_fields
        claim_type: initial_state
        grounds:
          - state_machines.FeeProgram
          - entities.FeeProgram.status
        distinguishing_aspect: "status is source: system with default DRAFT; the creating RevenueManager is recorded in authored_by_user_id at once, while every attestation field stays null until publication."
        test_recipe:
          setup:
            - "One ACTIVE property, clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /jurisdictions"
              payload: { code: "US-NV-CLARK", name: "Clark County NV", occupancy_tax_rate_bps: 1338, first_quote_total_required: true, itemization_required_on_folio: true, mandatory_fee_ban: false, opt_out_mandate: true }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { j_nv: $.data.id }
            - call: "POST /properties"
              payload: { jurisdiction_id: "${j_nv}", name: "Mirage Sands Resort", brand_code: "MSR", base_room_rate_cents: 29900, status: "ACTIVE" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p1: $.data.id, p1_v: $.data.version }
          trigger:
            - call: "POST /fee-programs"
              payload: { property_id: "${p1}", version_label: "FY26-Q4", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z", expected_property_version: "${p1_v}" }
              as: RevenueManager
              as_user_id: "u-rev-1"
          assert:
            - "HTTP 201 with data.status == DRAFT — the declared initial_state, and not settable from the request"
            - "data.authored_by_user_id == u-rev-1, captured from X-User-ID at creation"
            - "data.attested_by_user_id == null, data.attestation_note == null, data.published_at == null, data.supersedes_program_id == null"
            - "Property.${p1}.published_fee_program_count is still 0 — a DRAFT program does not count"

      - name: fee_program_submit_review_moves_draft_to_under_review
        claim_type: valid_transition
        grounds:
          - state_machines.FeeProgram.DRAFT_to_UNDER_REVIEW
          - endpoints[POST /fee-programs/{id}/submit-review]
        distinguishing_aspect: "The transition needs at least one Fee and nothing else; it changes status only, leaving the publication-time rollups at 0 and the attestation fields null."
