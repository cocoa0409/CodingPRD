        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[coverage-assignment-create-stale-distributor]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "After a successful proposal bumps the distributor version 2 -> 3, a second create replaying the observed version 2 is rejected 412 ERR_STALE_VERSION; refetching the version lets a corrected retry through."
        test_recipe:
          setup:
