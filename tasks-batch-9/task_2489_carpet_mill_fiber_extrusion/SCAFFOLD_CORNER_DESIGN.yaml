      - name: dealer_buyer_reading_another_account_returns_account_scope_violation
        claim_type: violation_to_error
        grounds:
          - validations[priority 3]
          - errors[ERR_ACCOUNT_SCOPE_VIOLATION]
          - roles.DealerBuyer
        distinguishing_aspect: |
          The DealerBuyer role is entity-backed: the same GET that succeeds when X-User-ID equals the
          path account_id is refused with 403 when it names the neighbouring account, even though the
          role itself is on the endpoint's allow-list — this is scoping, not RBAC.
        test_recipe:
          setup:
            - "Two accounts AC-01 and AC-02, each with a 5000000-cent limit."
          setup_api_calls:
            - call: "POST /mill/accounts"
              payload: { account_code: "AC-01", account_type: "DEALER", credit_limit_cents: 5000000 }
              as: MillPlanner
              captures: { a1: $.data.id }
            - call: "POST /mill/accounts"
              payload: { account_code: "AC-02", account_type: "BUILDER", credit_limit_cents: 5000000 }
              as: MillPlanner
              captures: { a2: $.data.id }
          trigger:
            - call: "GET /mill/accounts/${a2}"
              payload: {}
              as: DealerBuyer
              as_user_id: "${a1}"
            - call: "GET /mill/accounts/${a1}"
              payload: {}
              as: DealerBuyer
              as_user_id: "${a1}"
          assert:
            - "the cross-account GET returns HTTP 403 with error.error_id == ERR_ACCOUNT_SCOPE_VIOLATION"
            - "the self GET returns HTTP 200 with data.id == ${a1} and data.account_code == AC-01"

      - name: a_runout_style_still_takes_running_line_but_refuses_custom
        claim_type: conditional_validation
        grounds:
          - validations[priority 25]
          - errors[ERR_STYLE_RUNOUT_NO_CUSTOM]
          - state_machines.CarpetStyle.ACTIVE_to_RUNOUT
        distinguishing_aspect: |
          RUNOUT is a partially orderable state: the identical payload differing only in order_type
          is accepted for RUNNING_LINE and refused for CUSTOM, so the rule keys on the order's type
          rather than on the style's line_type or status alone.
        test_recipe:
          setup:
            - "ACTIVE style ST-SD-01 at 4275 cents/yard with no orders, then discontinued to RUNOUT."
            - "Account AC-01 with a 100000000-cent limit."
          setup_api_calls:
            - call: "POST /mill/styles"
              payload: { style_code: "ST-SD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id }
            - call: "POST /mill/styles/${st}/activate"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/accounts"
              payload: { account_code: "AC-01", account_type: "DEALER", credit_limit_cents: 100000000 }
              as: MillPlanner
              captures: { acct: $.data.id }
            - call: "POST /mill/styles/${st}/discontinue"
              payload: { reason: "collection retired" }
              as: MillPlanner
          trigger:
