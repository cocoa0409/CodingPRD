  - name: per_participant_cap_allows_exact_equality_and_refuses_one_cent_more
    grounds:
    - validations[priority=13,rule_id=per-participant-cap]
    - calculations.support_request_award
    - calculations.support_request_settlement
    - entities.FunderGrant.fields.per_participant_cap_cents
    - errors[ERR_PARTICIPANT_CAP_EXCEEDED]
    distinguishing_aspect: 'Metric: total_charge_cents against per_participant_cap_cents on POST /support-requests
      — 60000 == the cap is accepted and 60001 is refused, pinning the STRICTLY GREATER comparison at a one-cent step
      produced by two chained ROUND_HALF_UP stages.'
    test_recipe:
      setup:
      - Logical clock at 2026-08-01T08:00:00.000Z.
      - Participants p1 and p2 registered, each with their own per-participant cap budget.
      - 'FunderGrant g1: authorized_cents 5000000, per_participant_cap_cents 60000, TOOLS allowed (COVERAGE_RATE 0.85).'
      - p1's line is 67227 x 1 -> requested 57143, fee 2857 (tier T3), total 60000 == the cap.
      - p2's line is 67228 x 1 -> requested 57144, fee 2857, total 60001 == cap + 1.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00.000Z'
        as: CaseManager
        as_user_id: cm-1
