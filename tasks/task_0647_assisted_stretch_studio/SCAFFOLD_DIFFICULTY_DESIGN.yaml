            - call: "POST /credit-packs"
              payload: { member_id: "${mem}", location_id: "${loc}", pack_credits: 10, base_unit_price_cents: 100, expires_utc: "2027-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { pack: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${mem}", location_id: "${loc}", service_id: "${svc_intro}", flexologist_id: "${flex}", table_id: "${tbl2}", session_start_utc: "2026-04-11T08:00:00Z", funding_source: "CREDIT_PACK", funding_id: "${pack}" }
              as: FrontDesk
              captures: { b_intro: $.data.id }
