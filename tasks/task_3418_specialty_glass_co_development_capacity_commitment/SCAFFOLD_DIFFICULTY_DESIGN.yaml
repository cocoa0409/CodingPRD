          campaign adjacency at the same instant is allowed.
        test_recipe:
          setup:
            - "Program DESIGN_FROZEN with composition QUALIFIED then LOCKED; license L1 for maker in AUTOMOTIVE (secondary market) ACTIVE over [2027-01-01, 2028-12-31]"
