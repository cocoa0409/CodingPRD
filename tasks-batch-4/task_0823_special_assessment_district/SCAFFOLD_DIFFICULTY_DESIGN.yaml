scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: apportionment_benefit_units_vs_land_area
        grounds:
          - calculations.apportionment
          - entities.Parcel.fields.assessed_principal_cents
          - state_machines.AssessmentRoll.DRAFT_to_CONFIRMED
        distinguishing_aspect: "Same two parcels apportioned by BENEFIT_UNITS give P1=6000000 but by LAND_AREA give P1=4000000 — the dual variant lives on the Parcel/AssessmentRoll apportionment domain (distinct from the PayoffQuote domain of the other instance)."
        test_recipe:
          setup:
            - "District DBU (BENEFIT_UNITS) FORMED with P1(bu60,area4000) and P2(bu40,area6000), roll confirmed by benefit units."
            - "District DLA (LAND_AREA) FORMED with the same parcels, roll confirmed by land area."
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "DBU", formation_method: "BENEFIT_UNITS", total_project_cost_cents: 10000000 }
              as: DistrictAdministrator
              captures: { dbu: "$.data.id" }
            - call: "POST /districts/${dbu}/parcels"
              payload: { apn: "A-1", owner_name: "O1", benefit_units: 60, land_area_sqft: 4000, front_footage_ft: 60 }
              as: DistrictAdministrator
              captures: { p1bu: "$.data.id" }
            - call: "POST /districts/${dbu}/parcels"
              payload: { apn: "A-2", owner_name: "O2", benefit_units: 40, land_area_sqft: 6000, front_footage_ft: 40 }
              as: DistrictAdministrator
            - call: "POST /districts/${dbu}/open-protest"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${dbu}/close-hearing"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${dbu}/rolls"
              payload: { method: "BENEFIT_UNITS" }
              as: DistrictAdministrator
              captures: { rbu: "$.data.id" }
            - call: "POST /rolls/${rbu}/confirm"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts"
              payload: { name: "DLA", formation_method: "LAND_AREA", total_project_cost_cents: 10000000 }
              as: DistrictAdministrator
              captures: { dla: "$.data.id" }
            - call: "POST /districts/${dla}/parcels"
              payload: { apn: "A-1", owner_name: "O1", benefit_units: 60, land_area_sqft: 4000, front_footage_ft: 60 }
              as: DistrictAdministrator
              captures: { p1la: "$.data.id" }
            - call: "POST /districts/${dla}/parcels"
              payload: { apn: "A-2", owner_name: "O2", benefit_units: 40, land_area_sqft: 6000, front_footage_ft: 40 }
              as: DistrictAdministrator
            - call: "POST /districts/${dla}/open-protest"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${dla}/close-hearing"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${dla}/rolls"
              payload: { method: "LAND_AREA" }
              as: DistrictAdministrator
              captures: { rla: "$.data.id" }
          trigger:
            - call: "POST /rolls/${rla}/confirm"
              payload: {}
              as: DistrictAdministrator
          assert:
            - "Parcel.${p1bu}.assessed_principal_cents == 6000000"
            - "Parcel.${p1la}.assessed_principal_cents == 4000000"
            - "Parcel.${p1bu}.assessed_principal_cents != Parcel.${p1la}.assessed_principal_cents"

      - name: payoff_immediate_vs_next_call_date
        grounds:
          - calculations.payoff_quote
          - entities.PayoffQuote.fields.total_payoff_cents
          - entities.PayoffQuote.fields.accrued_interest_cents
        distinguishing_aspect: "For P1 (remaining 6000000) an IMMEDIATE quote at +90 days totals 5655000 while a NEXT_CALL_DATE quote totals 5880000 — the dual variant lives on the PayoffQuote domain, a different entity than apportionment's Parcel."
        test_recipe:
          setup:
            - "District DP FORMED, roll confirmed (P1=6000000), bond issued at 2026-07-01, rate 500 bps, reserve 0.10."
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "DP", formation_method: "BENEFIT_UNITS", total_project_cost_cents: 10000000 }
              as: DistrictAdministrator
              captures: { dp: "$.data.id" }
            - call: "POST /districts/${dp}/parcels"
              payload: { apn: "A-1", owner_name: "O1", benefit_units: 60 }
              as: DistrictAdministrator
              captures: { p1: "$.data.id" }
            - call: "POST /districts/${dp}/parcels"
              payload: { apn: "A-2", owner_name: "O2", benefit_units: 40 }
              as: DistrictAdministrator
            - call: "POST /districts/${dp}/open-protest"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${dp}/close-hearing"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${dp}/rolls"
              payload: { method: "BENEFIT_UNITS" }
              as: DistrictAdministrator
              captures: { rp: "$.data.id" }
            - call: "POST /rolls/${rp}/confirm"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${dp}/bonds"
              payload: { issuance_date: "2026-07-01T00:00:00Z", coupon_rate_bps: 500, term_years: 10, reserve_fund_pct: 0.10 }
              as: DistrictAdministrator
              captures: { bp: "$.data.id" }
            - call: "POST /bonds/${bp}/issue"
              payload: {}
              as: DistrictAdministrator
            - call: "GET /parcels/${p1}"
              payload: {}
              as: CountyTreasurer
              captures: { pv0: "$.data.version" }
            - call: "POST /parcels/${p1}/payoff-quotes"
              payload: { quote_mode: "IMMEDIATE", quote_date: "2026-10-01T00:00:00Z", expected_parcel_version: "${pv0}" }
              as: CountyTreasurer
              captures: { q_imm: "$.data.id" }
            - call: "GET /parcels/${p1}"
              payload: {}
              as: CountyTreasurer
              captures: { pv1: "$.data.version" }
          trigger:
            - call: "POST /parcels/${p1}/payoff-quotes"
              payload: { quote_mode: "NEXT_CALL_DATE", quote_date: "2026-10-01T00:00:00Z", expected_parcel_version: "${pv1}" }
              as: CountyTreasurer
              captures: { q_next: "$.data.id" }
          assert:
            - "PayoffQuote.${q_imm}.total_payoff_cents == 5655000"
            - "PayoffQuote.${q_imm}.accrued_interest_cents == 75000"
            - "PayoffQuote.${q_next}.total_payoff_cents == 5880000"
            - "PayoffQuote.${q_next}.accrued_interest_cents == 300000"

  # =========================================================================
  # Rule 2 — combinatorial formulas across different modes {a,b,c}
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: bond_level_debt_service_nonlinear_mode_a
        grounds:
          - calculations.amortization_schedule
          - entities.Installment.fields.amount_due_cents
          - state_machines.ImprovementBond.AUTHORIZED_to_ISSUED
        distinguishing_aspect: "Mode (a): level debt service = round_half_up(6000000*0.05/(1-1.05^-10)) = 777027 with year-1 interest 300000 and principal 477027 — a >=3-input non-linear amortization formula, a different combinatorial mode than the floor-then-distribute rounding of the other instance."
        test_recipe:
          setup:
            - "District DA FORMED, roll confirmed (P1=6000000), bond authorized rate 500 bps term 10."
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "DA", formation_method: "BENEFIT_UNITS", total_project_cost_cents: 10000000 }
              as: DistrictAdministrator
              captures: { da: "$.data.id" }
            - call: "POST /districts/${da}/parcels"
              payload: { apn: "A-1", owner_name: "O1", benefit_units: 60 }
              as: DistrictAdministrator
              captures: { p1: "$.data.id" }
            - call: "POST /districts/${da}/parcels"
              payload: { apn: "A-2", owner_name: "O2", benefit_units: 40 }
              as: DistrictAdministrator
            - call: "POST /districts/${da}/open-protest"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${da}/close-hearing"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${da}/rolls"
              payload: { method: "BENEFIT_UNITS" }
              as: DistrictAdministrator
              captures: { ra: "$.data.id" }
            - call: "POST /rolls/${ra}/confirm"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${da}/bonds"
              payload: { issuance_date: "2026-07-01T00:00:00Z", coupon_rate_bps: 500, term_years: 10, reserve_fund_pct: 0.10 }
              as: DistrictAdministrator
              captures: { ba: "$.data.id" }
          trigger:
            - call: "POST /bonds/${ba}/issue"
              payload: {}
              as: DistrictAdministrator
            - call: "GET /installments"
              payload: {}
              as: Auditor
              captures: { inst_y1: "$.data[0].id" }
          assert:
            - "For Parcel ${p1} installment_year 1: Installment.interest_cents == 300000"
            - "For Parcel ${p1} installment_year 1: Installment.principal_cents == 477027"
            - "For Parcel ${p1} installment_year 1: Installment.amount_due_cents == 777027"

      - name: apportionment_floor_then_distribute_remainder_mode_b
        grounds:
          - calculations.apportionment
          - entities.Parcel.fields.assessed_principal_cents
        distinguishing_aspect: "Mode (b) pinned rounding order: assessable 10000001 over three equal-weight parcels floors to 3333333 each (sum 9999999); the 2 leftover cents go to the two earliest-created parcels, giving 3333334/3333334/3333333 — a different combinatorial mode than the amortization non-linearity."
        test_recipe:
          setup:
            - "District DR (BENEFIT_UNITS, cost 10000001) FORMED with three parcels PA,PB,PC each benefit_units 1, created in that order."
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "DR", formation_method: "BENEFIT_UNITS", total_project_cost_cents: 10000001 }
              as: DistrictAdministrator
              captures: { dr: "$.data.id" }
            - call: "POST /districts/${dr}/parcels"
              payload: { apn: "R-A", owner_name: "OA", benefit_units: 1 }
              as: DistrictAdministrator
              captures: { pa: "$.data.id" }
            - call: "POST /districts/${dr}/parcels"
              payload: { apn: "R-B", owner_name: "OB", benefit_units: 1 }
              as: DistrictAdministrator
              captures: { pb: "$.data.id" }
            - call: "POST /districts/${dr}/parcels"
              payload: { apn: "R-C", owner_name: "OC", benefit_units: 1 }
              as: DistrictAdministrator
              captures: { pc: "$.data.id" }
            - call: "POST /districts/${dr}/open-protest"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${dr}/close-hearing"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${dr}/rolls"
              payload: { method: "BENEFIT_UNITS" }
              as: DistrictAdministrator
              captures: { rr: "$.data.id" }
          trigger:
            - call: "POST /rolls/${rr}/confirm"
              payload: {}
              as: DistrictAdministrator
          assert:
            - "Parcel.${pa}.assessed_principal_cents == 3333334"
            - "Parcel.${pb}.assessed_principal_cents == 3333334"
            - "Parcel.${pc}.assessed_principal_cents == 3333333"
            - "Parcel.${pa}.assessed_principal_cents + Parcel.${pb}.assessed_principal_cents + Parcel.${pc}.assessed_principal_cents == 10000001"

  # =========================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: parcel_active_foreclosure_active_cycle
        grounds:
          - state_machines.Parcel.ACTIVE_to_IN_FORECLOSURE
          - state_machines.Parcel.IN_FORECLOSURE_to_ACTIVE
          - state_machines.ForeclosureAction.JUDGMENT_to_REDEEMED
        distinguishing_aspect: "Parcel cycles ACTIVE -> IN_FORECLOSURE -> ACTIVE via redemption, a genuine cycle on the Parcel entity (distinct from the ForeclosureAction fork of the other instance)."
        test_recipe:
          setup:
            - "District DF FORMED, single parcel PF (bu100) roll confirmed, bond issued term 3 at 2026-07-01; clock at 2029-09-01 with all 3 installments marked DELINQUENT; foreclosure INITIATED then advanced to JUDGMENT."
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "DF", formation_method: "BENEFIT_UNITS", total_project_cost_cents: 300000 }
              as: DistrictAdministrator
              captures: { df: "$.data.id" }
            - call: "POST /districts/${df}/parcels"
              payload: { apn: "F-1", owner_name: "OF", benefit_units: 100 }
              as: DistrictAdministrator
              captures: { pf: "$.data.id" }
            - call: "POST /districts/${df}/open-protest"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${df}/close-hearing"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${df}/rolls"
              payload: { method: "BENEFIT_UNITS" }
              as: DistrictAdministrator
              captures: { rf: "$.data.id" }
            - call: "POST /rolls/${rf}/confirm"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${df}/bonds"
              payload: { issuance_date: "2026-07-01T00:00:00Z", coupon_rate_bps: 500, term_years: 3, reserve_fund_pct: 0.10 }
              as: DistrictAdministrator
              captures: { bf: "$.data.id" }
            - call: "POST /bonds/${bf}/issue"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-09-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "GET /installments"
              payload: {}
              as: Auditor
              captures: { i1: "$.data[0].id" }
            - call: "GET /installments"
              payload: {}
              as: Auditor
              captures: { i2: "$.data[1].id" }
            - call: "GET /installments"
              payload: {}
              as: Auditor
              captures: { i3: "$.data[2].id" }
            - call: "POST /installments/${i1}/mark-delinquent"
              payload: {}
              as: CountyTreasurer
            - call: "POST /installments/${i2}/mark-delinquent"
              payload: {}
              as: CountyTreasurer
            - call: "POST /installments/${i3}/mark-delinquent"
              payload: {}
              as: CountyTreasurer
            - call: "POST /parcels/${pf}/foreclosures"
              payload: {}
              as: DistrictAdministrator
              captures: { ff: "$.data.id" }
            - call: "POST /foreclosures/${ff}/advance"
              payload: { to_status: "NOTICED" }
              as: DistrictAdministrator
            - call: "POST /foreclosures/${ff}/advance"
              payload: { to_status: "JUDGMENT" }
              as: DistrictAdministrator
          trigger:
            - call: "POST /foreclosures/${ff}/advance"
              payload: { to_status: "REDEEMED" }
              as: CountyTreasurer
          assert:
            - "ForeclosureAction.${ff}.status == REDEEMED"
            - "Parcel.${pf}.status == ACTIVE"

      - name: foreclosure_judgment_fork_to_sale
        grounds:
          - state_machines.ForeclosureAction.JUDGMENT_to_SALE
          - state_machines.ForeclosureAction.JUDGMENT_to_REDEEMED
          - state_machines.ImprovementBond.ISSUED_to_DEFAULTED
        distinguishing_aspect: "ForeclosureAction forks JUDGMENT -> {SALE, REDEEMED} with divergent side-effect sets; the SALE branch defaults installments+liens+bond, a branching shape on ForeclosureAction (a different entity than the Parcel cycle)."
        test_recipe:
          setup:
            - "District DS FORMED, single parcel PS (bu100), bond issued term 3, all 3 installments DELINQUENT, foreclosure advanced to JUDGMENT."
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "DS", formation_method: "BENEFIT_UNITS", total_project_cost_cents: 300000 }
              as: DistrictAdministrator
              captures: { ds: "$.data.id" }
            - call: "POST /districts/${ds}/parcels"
              payload: { apn: "S-1", owner_name: "OS", benefit_units: 100 }
              as: DistrictAdministrator
              captures: { ps: "$.data.id" }
            - call: "POST /districts/${ds}/open-protest"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${ds}/close-hearing"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${ds}/rolls"
              payload: { method: "BENEFIT_UNITS" }
              as: DistrictAdministrator
              captures: { rs: "$.data.id" }
            - call: "POST /rolls/${rs}/confirm"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${ds}/bonds"
              payload: { issuance_date: "2026-07-01T00:00:00Z", coupon_rate_bps: 500, term_years: 3, reserve_fund_pct: 0.10 }
              as: DistrictAdministrator
              captures: { bs: "$.data.id" }
            - call: "POST /bonds/${bs}/issue"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-09-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "GET /installments"
              payload: {}
              as: Auditor
              captures: { j1: "$.data[0].id" }
            - call: "GET /installments"
              payload: {}
              as: Auditor
              captures: { j2: "$.data[1].id" }
            - call: "GET /installments"
              payload: {}
              as: Auditor
              captures: { j3: "$.data[2].id" }
            - call: "POST /installments/${j1}/mark-delinquent"
              payload: {}
              as: CountyTreasurer
            - call: "POST /installments/${j2}/mark-delinquent"
              payload: {}
              as: CountyTreasurer
            - call: "POST /installments/${j3}/mark-delinquent"
              payload: {}
              as: CountyTreasurer
            - call: "POST /parcels/${ps}/foreclosures"
              payload: {}
              as: DistrictAdministrator
              captures: { fs: "$.data.id" }
            - call: "POST /foreclosures/${fs}/advance"
              payload: { to_status: "NOTICED" }
              as: DistrictAdministrator
            - call: "POST /foreclosures/${fs}/advance"
              payload: { to_status: "JUDGMENT" }
              as: DistrictAdministrator
          trigger:
            - call: "POST /foreclosures/${fs}/advance"
              payload: { to_status: "SALE" }
              as: CountyTreasurer
          assert:
            - "ForeclosureAction.${fs}.status == SALE"
            - "ImprovementBond.${bs}.status == DEFAULTED"
            - "Parcel.${ps}.status == IN_FORECLOSURE"

  # =========================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: payment_payoff_paidoff_lien_release_depth3
        grounds:
          - state_machines.Installment.DUE_to_PAID
          - state_machines.Parcel.ACTIVE_to_PAID_OFF
          - state_machines.Lien.RECORDED_to_RELEASED
        distinguishing_aspect: "Recording the final payment chains Payment -> Installment(PAID) -> Parcel(remaining 0 -> PAID_OFF) -> Lien(RELEASED): each hop is caused by the previous hop, a depth-3 cascade triggered by POST payment."
        test_recipe:
          setup:
            - "District DC FORMED, single parcel PC (bu100, assessed 1000000), bond term 1 issued at 2026-07-01, clock at 2027-07-01 so the sole installment is DUE with amount_due 1050000, and an ASSESSMENT lien RECORDED."
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "DC", formation_method: "BENEFIT_UNITS", total_project_cost_cents: 1000000 }
              as: DistrictAdministrator
              captures: { dc: "$.data.id" }
            - call: "POST /districts/${dc}/parcels"
              payload: { apn: "C-1", owner_name: "OC", benefit_units: 100 }
              as: DistrictAdministrator
              captures: { pc: "$.data.id" }
            - call: "POST /districts/${dc}/open-protest"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${dc}/close-hearing"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${dc}/rolls"
              payload: { method: "BENEFIT_UNITS" }
              as: DistrictAdministrator
              captures: { rc: "$.data.id" }
            - call: "POST /rolls/${rc}/confirm"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${dc}/bonds"
              payload: { issuance_date: "2026-07-01T00:00:00Z", coupon_rate_bps: 500, term_years: 1, reserve_fund_pct: 0.10 }
              as: DistrictAdministrator
              captures: { bc: "$.data.id" }
            - call: "POST /bonds/${bc}/issue"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "GET /installments"
              payload: { parcel_id: "${pc}", installment_year: 1 }
              as: Auditor
              captures: { inst_c: "$.data[0].id" }
          trigger:
            - call: "POST /installments/${inst_c}/payments"
              payload: { amount_cents: 1050000, payment_date: "2027-07-01T00:00:00Z", paid_by: "OC" }
              as: CountyTreasurer
          assert:
            - "Installment.${inst_c}.status == PAID"
            - "Parcel.${pc}.remaining_principal_cents == 0"
            - "Parcel.${pc}.status == PAID_OFF"
            - "Every Lien of Parcel ${pc} has status == RELEASED"

      - name: reassessment_reallocate_reamortize_cascade
        grounds:
          - state_machines.AssessmentRoll.DRAFT_to_CONFIRMED
          - calculations.apportionment
          - calculations.amortization_schedule
        distinguishing_aspect: "Confirming a reassessment roll chains Roll(CONFIRMED) -> Parcel(assessed 5000000 -> 8000000) -> SCHEDULED Installment(re-amortized to interest 400000): a depth-3 cascade from a DIFFERENT trigger (roll confirm) than the payment cascade."
        test_recipe:
          setup:
            - "District DRE FORMED with PA(bu50,area8000) and PB(bu50,area2000); roll1 (BENEFIT_UNITS) confirmed giving each 5000000; bond term 2 issued at 2026-07-01 (installments SCHEDULED, clock at default 2026-03-01); roll2 (LAND_AREA) drafted."
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "DRE", formation_method: "BENEFIT_UNITS", total_project_cost_cents: 10000000 }
              as: DistrictAdministrator
              captures: { dre: "$.data.id" }
            - call: "POST /districts/${dre}/parcels"
              payload: { apn: "E-A", owner_name: "OA", benefit_units: 50, land_area_sqft: 8000 }
              as: DistrictAdministrator
              captures: { pea: "$.data.id" }
            - call: "POST /districts/${dre}/parcels"
              payload: { apn: "E-B", owner_name: "OB", benefit_units: 50, land_area_sqft: 2000 }
              as: DistrictAdministrator
            - call: "POST /districts/${dre}/open-protest"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${dre}/close-hearing"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${dre}/rolls"
              payload: { method: "BENEFIT_UNITS" }
              as: DistrictAdministrator
              captures: { re1: "$.data.id" }
            - call: "POST /rolls/${re1}/confirm"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${dre}/bonds"
              payload: { issuance_date: "2026-07-01T00:00:00Z", coupon_rate_bps: 500, term_years: 2, reserve_fund_pct: 0.10 }
              as: DistrictAdministrator
              captures: { bre: "$.data.id" }
            - call: "POST /bonds/${bre}/issue"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${dre}/rolls"
              payload: { method: "LAND_AREA" }
              as: DistrictAdministrator
              captures: { re2: "$.data.id" }
          trigger:
            - call: "POST /rolls/${re2}/confirm"
              payload: {}
              as: DistrictAdministrator
          assert:
            - "AssessmentRoll.${re1}.status == SUPERSEDED"
