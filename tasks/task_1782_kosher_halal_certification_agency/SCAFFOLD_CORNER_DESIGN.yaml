            - { call: "POST /api/products/${p7}/certify-eligible", as: CertificationReviewer }
            - { call: "POST /api/certificates", payload: { client_id: "${c7}", scheme: "KOSHER", term_type: "ANNUAL", facility_ids: ["${f7}"], product_ids: ["${p7}"] }, as: CertificateOfficer, captures: { cert7: $.data.id } }
            - { call: "POST /api/certificates/${cert7}/issue", as: CertificateOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /api/certificates/${cert7}/issue", as: CertificateOfficer, as_user_id: "co-1", captures: { err: $.data.error_id } }
          assert: ["err == ERR_CERTIFICATE_INVALID_STATE (409)"]

      - name: client_withdraw_twice_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.AgencyClient]
        distinguishing_aspect: "WITHDRAWN is terminal: a second withdraw -> ERR_CLIENT_INVALID_STATE."
        test_recipe:
          setup: ["client WITHDRAWN"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { legal_name: "SM8 Co", certification_scheme: "KOSHER", contact_email: "sm8@x.com" }, as: AccountManager, captures: { c8: $.data.id } }
