  - rule_id: priority_pair_validation_conflict
    instances:

      - name: invalid_state_precedes_budget_exceeded_on_billing_submit
        grounds:
          - validations[priority=10]
          - validations[priority=60]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Category pair {state, business_fiscal}: one request violates the priority-10 from-state
          rule (the line is DISPUTED, and submit is only declared from DRAFT) and the priority-60
          budget rule (re-including its 820800 cents would push committed_cents to 1641600 against a
          900000 budget); the response must be ERR_INVALID_STATE (409), never ERR_BUDGET_EXCEEDED.
        test_recipe:
