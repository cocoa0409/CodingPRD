              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { oa_id: $.data.id }
            - call: "POST /customer-orders"
              payload: { distributor_id: "${dist_id}", design_id: "${d1_id}", order_type: "MADE_TO_ORDER", quantity: 200, requested_ship_date: "2026-12-01", jurisdiction: "EU" }
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { ob_id: $.data.id }
            - call: "POST /customer-orders"
              payload: { distributor_id: "${dist_id}", design_id: "${d1_id}", order_type: "MADE_TO_ORDER", quantity: 300, requested_ship_date: "2026-12-01", jurisdiction: "EU" }
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { oc_id: $.data.id }
            - call: "POST /customer-orders"
              payload: { distributor_id: "${dist_id}", design_id: "${d1_id}", order_type: "MADE_TO_ORDER", quantity: 1, requested_ship_date: "2026-12-01", jurisdiction: "EU" }
              as: ProductionPlanner
              as_user_id: "u_plan_1"
              captures: { od_id: $.data.id }
          trigger:
