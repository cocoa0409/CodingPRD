          assert:
            - "captured err == ERR_UNAUTHORIZED"

      - name: action_level_rbac_on_dispute_resolve_and_reopen
        claim_type: rbac_deny
        grounds: ["roles[PropertyManager]", "roles[Tenant]", "endpoints['POST /api/disputes/{id}/transition']"]
        distinguishing_aspect: "The same endpoint enforces per-action roles: Tenant attempting RESOLVE and PropertyManager attempting REOPEN both get ERR_UNAUTHORIZED, while the correct actor for each succeeds; a non-owner tenant is also denied REOPEN."
        test_recipe:
          setup: ["property PA, ACTIVE lease (primary tenant t1; second tenant t2 exists), DAMAGE_FEE 50000, dispute OPEN"]
          setup_api_calls:
            - { call: "POST /api/properties", payload: { name: "Maple Court", state_code: "CA", posting_priority_policy: "FEES_FIRST", late_fee_cap_cents: 5000, nsf_fee_cap_cents: 3500, monthly_waiver_cap_cents: 20000, min_partial_payment_percent: 25, collections_threshold_cents: 10000, notice_cure_period_days: 10, plan_cooling_off_days: 30, plan_setup_fee_cents: 2500, plan_setup_fee_threshold_cents: 20000 }, as: PropertyManager, captures: { prop: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Terry Tenant", email: "terry@example.com" }, as: LeasingAgent, captures: { t1: $.data.id } }
            - { call: "POST /api/tenants", payload: { full_name: "Other Tenant", email: "other@example.com" }, as: LeasingAgent, captures: { t2: $.data.id } }
            - { call: "POST /api/leases", payload: { property_id: "${prop}", primary_tenant_id: "${t1}", unit_label: "101", monthly_rent_cents: 200000, due_day: 1, grace_period_days: 5, late_fee_type: "FLAT", late_fee_flat_cents: 4000, term_start_date: "2026-08-01", term_end_date: "2027-07-31" }, as: PropertyManager, captures: { lease: $.data.id } }
            - { call: "POST /api/leases/${lease}/charges", payload: { kind: "DAMAGE_FEE", period_start_date: "2026-08-01", period_end_date: "2026-08-31", due_date: "2026-08-01", amount_cents: 50000 }, as: LeasingAgent, captures: { dc: $.data.id } }
            - { call: "POST /api/leases/${lease}/transition", payload: { action: "ACTIVATE" }, as: PropertyManager }
            - { call: "POST /api/disputes", payload: { lease_id: "${lease}", charge_id: "${dc}", tenant_id: "${t1}", reason: "contested" }, as: Tenant, as_user_id: "${t1}", captures: { disp: $.data.id } }
          trigger:
            - { call: "POST /api/disputes/${disp}/transition", payload: { action: "RESOLVE", outcome: "UPHELD" }, as: Tenant, as_user_id: "${t1}", captures: { e1: $.data.error_id } }
            - { call: "POST /api/disputes/${disp}/transition", payload: { action: "RESOLVE", outcome: "UPHELD" }, as: PropertyManager, captures: { s1: $.data.status } }
            - { call: "POST /api/disputes/${disp}/transition", payload: { action: "REOPEN" }, as: PropertyManager, captures: { e2: $.data.error_id } }
            - { call: "POST /api/disputes/${disp}/transition", payload: { action: "REOPEN" }, as: Tenant, as_user_id: "${t2}", captures: { e3: $.data.error_id } }
            - { call: "POST /api/disputes/${disp}/transition", payload: { action: "REOPEN" }, as: Tenant, as_user_id: "${t1}", captures: { s2: $.data.status } }
          assert:
            - "e1 == ERR_UNAUTHORIZED (Tenant cannot RESOLVE) and s1 == RESOLVED_UPHELD (PropertyManager can)"
            - "e2 == ERR_UNAUTHORIZED (PropertyManager cannot REOPEN) and e3 == ERR_UNAUTHORIZED (non-owner tenant cannot REOPEN)"
            - "s2 == REOPENED (owner tenant can)"

      - name: tenant_read_scoping_own_lease
        claim_type: rbac_allow
        grounds: ["roles[Tenant]", "endpoints['GET /api/leases/{id}']"]
        distinguishing_aspect: "The primary tenant reads their own lease (200), while another tenant reading the same lease is denied ERR_UNAUTHORIZED — entity_backed identity drives ownership."
