            - { call: "POST /correspondent-banking/questionnaires/${eq_id}/control-assessments", payload: { control_domain: "NESTED_CONTROLS", self_rating: 4 }, as: RespondentContact, as_user_id: "${e_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${eq_id}/submission", payload: {}, as: RespondentContact, as_user_id: "${e_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${eq_id}/assessment-decision", payload: { action: "ASSESS", variant: "ONBOARDING_PROVISIONAL" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/respondents/${e_id}/risk-assessment", payload: { variant: "ONBOARDING_PROVISIONAL" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/respondents/${e_id}/approval", payload: { action: "APPROVE" }, as: CommitteeApprover, as_user_id: "user-committee-01" }
            - { call: "GET /correspondent-banking/respondents/${e_id}", as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { ev1: $.data.version } }
            - { call: "POST /correspondent-banking/respondents/${e_id}/monitoring-profiles", payload: { effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-30T00:00:00Z", tolerance_pct: 0.10, expected_respondent_version: "${ev1}", expected_corridors: [ { jurisdiction_code: "DE", expected_monthly_usd: 1000000.00, expected_monthly_count: 100 } ] }, as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { prof_e1: $.data.id } }
            - { call: "POST /correspondent-banking/monitoring-profiles/${prof_e1}/calibration", payload: { action: "CALIBRATE" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "GET /correspondent-banking/respondents/${e_id}", as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { ev2: $.data.version } }
          trigger:
            - { call: "POST /correspondent-banking/respondents/${e_id}/monitoring-profiles", payload: { effective_from: "2026-06-30T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", tolerance_pct: 0.10, expected_respondent_version: "${ev2}", expected_corridors: [ { jurisdiction_code: "DE", expected_monthly_usd: 200000000.00, expected_monthly_count: 5000 } ] }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/respondents/${e_id}/monitoring-profiles", payload: { effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", tolerance_pct: 0.10, expected_respondent_version: "${ev2}", expected_corridors: [ { jurisdiction_code: "DE", expected_monthly_usd: 200000000.00, expected_monthly_count: 5000 } ] }, as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { prof_e2: $.data.id } }
            - { call: "POST /correspondent-banking/monitoring-profiles/${prof_e2}/calibration", payload: { action: "CALIBRATE" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
          assert:
            - "trigger call 1 HTTP status == 409 and data.error_id == ERR_MONITORING_INTERVAL_OVERLAP   # effective_from == the existing profile's effective_to: adjacency IS overlap; priority 37 (constraint) outranks priority 42 (fiscal)"
            - "GET /correspondent-banking/monitoring-profiles?respondent_bank_id=${e_id} returns exactly 1 row after trigger call 1   # the rejected create persisted nothing"
            - "trigger call 2 HTTP status == 201   # the SAME expected_respondent_version ${ev2} is still current, proving the rejected create did not bump RespondentBank.version"
            - "TransactionMonitoringProfile.${prof_e2}.calibration_state == PROVISIONAL immediately after trigger call 2 and its corridor_thresholds is empty   # creation runs no fiscal check"
            - "trigger call 3 HTTP status == 422 and data.error_id == ERR_AGGREGATE_THRESHOLD_EXCEEDED   # usd_raw 200000000.00*1.10*1.30/0.50 = 572000000.00 clamps to the 500000000.00 per-corridor ceiling, then round(500000000.00*1.10, 2) = 550000000.00 > 500000000.00"
            - "TransactionMonitoringProfile.${prof_e2}.calibration_state == PROVISIONAL after trigger call 3 and its aggregate_usd_threshold and hold_threshold_usd are unwritten   # a refused calibration writes nothing"
            - "TransactionMonitoringProfile.${prof_e1}.calibration_state == CALIBRATED and TransactionMonitoringProfile.${prof_e1}.aggregate_usd_threshold == 3146000.00 and TransactionMonitoringProfile.${prof_e1}.hold_threshold_usd == 314600.00   # the untouched neighbour keeps its thresholds"
            - "RespondentBank.${e_id}.inherent_risk_score == 22.00 and RespondentBank.${e_id}.residual_risk_score == 14.58 and RespondentBank.${e_id}.risk_rating == LOW"

  - rule_id: boundary_precision_check
    instances:
      - name: payment_hold_threshold_is_inclusive_at_the_exact_cent_and_one_cent_below_screens_clear
        grounds:
          - calculations.payment_screening_decision
          - calculations.monitoring_threshold_calibration
          - entities.PaymentInstruction.fields.hold_threshold_applied
          - state_machines.PaymentInstruction.RECEIVED_to_SCREENED_CLEAR
        distinguishing_aspect: |
          The amount test in payment_screening_decision is amount_usd >= hold_threshold_usd, so an
          instruction for exactly 786500.00 is held on AMOUNT_THRESHOLD while 786499.99 - one cent
          below the same derived threshold - screens clear with hold_reason null and no
          hold_threshold_applied written. The threshold itself is a three-step derivation
          (per-corridor round, aggregate 1.10 buffer, then divide by 10), so an implementation that
          uses a strict > comparison, or that recomputes the hold threshold from the raw expected
          volume instead of the buffered aggregate, splits the pair.
        test_recipe:
          setup: >
            Logical clock stays at 2026-08-01T00:00:00Z. JurisdictionProfile DE (basel 4.0 ->
            jurisdiction_risk_points 8.00, PERMITTED, corridor_risk_weight 1.00,
            max_permitted_risk_rating HIGH). One respondent home DE,
            expected_monthly_volume_usd 5000000.00, expected_monthly_count 200,
            nested_activity_permitted false, licensed ACTIVE/GOOD_STANDING, one VERIFIED non-PEP
            natural-person owner at 80.00% in DE, eight self_rating=4 rows -> control_score 80.00,
            control_credit 0.3375, inherent_risk_score 14.00, residual_risk_score 9.28, rating LOW.
            After committee approval the posture is PATCHed to OPEN and a monitoring profile over
            [2026-07-01, 2026-12-31] with one DE corridor at 5000000.00 / 200 and tolerance_pct 0.10
            is CALIBRATED: usd_threshold round(5000000.00*1.10*1.30/1.00, 2) = 7150000.00,
            count_threshold max(5, ceil(286.0)) = 286, aggregate_usd_threshold
            round(7150000.00*1.10, 2) = 7865000.00 and hold_threshold_usd
            round(7865000.00/10.0, 2) = 786500.00. Both jurisdictions on both instructions are DE,
            so neither the sanctions branch nor the RESTRICTED branch of the screening ladder can
            fire and the amount comparison is the only live branch.
          setup_api_calls:
            - { call: "POST /correspondent-banking/jurisdiction-profiles", payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.0, corridor_risk_weight: 1.00, sanctions_status: "PERMITTED", fatf_listing: "NONE", secrecy_flag: false, max_permitted_risk_rating: "HIGH" }, as: PlatformAdmin }
            - { call: "POST /correspondent-banking/respondents", payload: { legal_name: "Ruhr Kreditbank AG", swift_bic: "RUHRDEFFXXX", home_jurisdiction_code: "DE", relationship_manager_user_id: "user-rm-01", expected_monthly_volume_usd: 5000000.00, expected_monthly_count: 200, nested_activity_permitted: false }, as: FIGRelationshipManager, as_user_id: "user-rm-01", captures: { f_id: $.data.id } }
            - { call: "POST /correspondent-banking/respondents/${f_id}/licensing-verification", payload: { license_status: "ACTIVE", regulator_standing: "GOOD_STANDING", regulator_name: "BaFin" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/respondents/${f_id}/beneficial-owners", payload: { owner_name: "Petra Klein", owner_type: "NATURAL_PERSON", ownership_pct: 80.00, country_of_residence: "DE", is_pep: false }, as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { f_own: $.data.id } }
            - { call: "POST /correspondent-banking/beneficial-owners/${f_own}/verification", payload: { action: "VERIFY" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "GET /correspondent-banking/respondents/${f_id}", as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { fv0: $.data.version } }
            - { call: "POST /correspondent-banking/respondents/${f_id}/questionnaires", payload: { questionnaire_version: 1, expected_respondent_version: "${fv0}", declared_nested_activity: false, declared_downstream_count: 0 }, as: RespondentContact, as_user_id: "${f_id}", captures: { fq_id: $.data.id } }
            - { call: "POST /correspondent-banking/questionnaires/${fq_id}/control-assessments", payload: { control_domain: "GOVERNANCE", self_rating: 4 }, as: RespondentContact, as_user_id: "${f_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${fq_id}/control-assessments", payload: { control_domain: "KYC_ONBOARDING", self_rating: 4 }, as: RespondentContact, as_user_id: "${f_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${fq_id}/control-assessments", payload: { control_domain: "TRANSACTION_MONITORING", self_rating: 4 }, as: RespondentContact, as_user_id: "${f_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${fq_id}/control-assessments", payload: { control_domain: "SANCTIONS_SCREENING", self_rating: 4 }, as: RespondentContact, as_user_id: "${f_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${fq_id}/control-assessments", payload: { control_domain: "PEP_HANDLING", self_rating: 4 }, as: RespondentContact, as_user_id: "${f_id}" }
