# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-reference of SCAFFOLD.yaml sections 1.1-1.7 against the nine Difficulty
# Rules of section 0.5. Nine rule_ids x 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: gpa_variant_flips_academic_rung_on_the_same_student_record
        grounds:
          - calculations.academic_gpa_evaluation
          - calculations.eligibility_ladder_evaluation
          - entities.Student.fields.gpa_prior_period
          - entities.Student.fields.credits_current_period
          - entities.EligibilityCase.fields.gpa_variant_applied
          - entities.EligibilityCase.fields.effective_gpa
          - state_machines.EligibilityCase.INTAKE_to_PROVISIONAL_ELIGIBLE
          - state_machines.EligibilityCase.INTAKE_to_INELIGIBLE
        distinguishing_aspect: |
          This dual-variant calculation operates on the Student academic domain: two identical
          academic records (2.100 over 3 credits prior, 1.800 over 4 credits current) yield
          effective_gpa 2.100 under PROVISIONAL and 1.929 under FINAL, flipping the case from
          PROVISIONAL_ELIGIBLE to INELIGIBLE with ineligibility_reason ACADEMIC_GPA, and the only
          input that changed is the logical clock's position relative to grading_lock_date.
        test_recipe:
          setup:
            - "One school North High (C3A) and one FOOTBALL C3A season in REGULAR_SEASON with grading_lock_date 2026-10-01."
            - "Two students at that school, Ada and Ben, carrying byte-identical academic records."
            - "Each student holds an eligibility case with all three clearance forms VALID."
            - "Ada's case has already been evaluated at logical clock 2026-09-10, before the grading lock."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T09:00:00Z" }
              as: AssociationAdmin
            - call: "POST /athletics/schools"
              payload: { name: "North High", classification: "C3A", region_code: "R-NORTH", school_day_end_utc_hhmm: "17:00", bus_fleet_size: 2, max_release_minutes_per_request: 240, fee_cap_cents: 20000, venue_concurrent_capacity: 1 }
              as: AssociationAdmin
              captures: { sch_a: $.data.id }
            - call: "POST /athletics/sport-seasons"
              payload: { sport: "FOOTBALL", classification: "C3A", school_year: "2026-2027", sport_tier: "TIER_A", practice_start_date: "2026-08-05", first_contest_date: "2026-09-01", season_end_date: "2026-11-15", age_cutoff_date: "2026-09-01", residency_deadline: "2026-08-20", grading_lock_date: "2026-10-01", contest_limit: 10, required_officials: 2 }
              as: AssociationAdmin
              captures: { seas_f: $.data.id }
            - call: "POST /athletics/sport-seasons/${seas_f}/advance"
              payload: { to_status: "PRACTICE_OPEN" }
              as: AssociationAdmin
            - call: "POST /athletics/sport-seasons/${seas_f}/advance"
              payload: { to_status: "REGULAR_SEASON" }
              as: AssociationAdmin
            - call: "POST /athletics/students"
              payload: { school_id: "${sch_a}", full_name: "Ada Reyes", birth_date: "2009-05-14", grade_level: 11, residency_verified: true, residency_verified_on: "2026-08-10", free_reduced_lunch: false }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
              captures: { stu_ada: $.data.id }
            - call: "POST /athletics/students/${stu_ada}/academic-record"
              payload: { gpa_prior_period: 2.100, gpa_current_period: 1.800, credits_prior_period: 3, credits_current_period: 4 }
              as: Registrar
              as_user_id: "${sch_a}"
            - call: "POST /athletics/students"
              payload: { school_id: "${sch_a}", full_name: "Ben Okafor", birth_date: "2009-06-02", grade_level: 11, residency_verified: true, residency_verified_on: "2026-08-10", free_reduced_lunch: false }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
              captures: { stu_ben: $.data.id }
            - call: "POST /athletics/students/${stu_ben}/academic-record"
              payload: { gpa_prior_period: 2.100, gpa_current_period: 1.800, credits_prior_period: 3, credits_current_period: 4 }
              as: Registrar
              as_user_id: "${sch_a}"
            - call: "POST /athletics/eligibility-cases"
              payload: { student_id: "${stu_ada}", sport_season_id: "${seas_f}" }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
              captures: { case_ada: $.data.id }
            - call: "POST /athletics/eligibility-cases/${case_ada}/clearance-documents"
              payload: { doc_type: "PHYSICAL", issued_on: "2026-07-15", expires_on: "2027-07-15", signer_name: "Dr. Lin" }
              as: MedicalOfficer
              as_user_id: "med-001"
            - call: "POST /athletics/eligibility-cases/${case_ada}/clearance-documents"
              payload: { doc_type: "PARENT_CONSENT", issued_on: "2026-07-20", expires_on: "2027-07-20", signer_name: "M. Reyes" }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
            - call: "POST /athletics/eligibility-cases/${case_ada}/clearance-documents"
              payload: { doc_type: "CONCUSSION_ACK", issued_on: "2026-07-20", expires_on: "2027-07-20", signer_name: "M. Reyes" }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
            - call: "POST /athletics/eligibility-cases"
              payload: { student_id: "${stu_ben}", sport_season_id: "${seas_f}" }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
              captures: { case_ben: $.data.id }
            - call: "POST /athletics/eligibility-cases/${case_ben}/clearance-documents"
              payload: { doc_type: "PHYSICAL", issued_on: "2026-07-15", expires_on: "2027-07-15", signer_name: "Dr. Lin" }
              as: MedicalOfficer
              as_user_id: "med-001"
            - call: "POST /athletics/eligibility-cases/${case_ben}/clearance-documents"
              payload: { doc_type: "PARENT_CONSENT", issued_on: "2026-07-20", expires_on: "2027-07-20", signer_name: "O. Okafor" }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
            - call: "POST /athletics/eligibility-cases/${case_ben}/clearance-documents"
              payload: { doc_type: "CONCUSSION_ACK", issued_on: "2026-07-20", expires_on: "2027-07-20", signer_name: "O. Okafor" }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
            - call: "POST /athletics/eligibility-cases/${case_ada}/evaluate"
              payload: {}
              as: EligibilityReviewer
              as_user_id: "rev-001"
          trigger:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T09:00:00Z" }
              as: AssociationAdmin
            - call: "POST /athletics/eligibility-cases/${case_ben}/evaluate"
              payload: {}
              as: EligibilityReviewer
              as_user_id: "rev-001"
          assert:
            - "EligibilityCase.${case_ada}.gpa_variant_applied == PROVISIONAL"
            - "EligibilityCase.${case_ada}.effective_gpa == 2.100"
            - "EligibilityCase.${case_ada}.status == PROVISIONAL_ELIGIBLE"
            - "EligibilityCase.${case_ada}.ineligibility_reason == null"
            - "EligibilityCase.${case_ben}.gpa_variant_applied == FINAL"
            - "EligibilityCase.${case_ben}.effective_gpa == 1.929"
            - "EligibilityCase.${case_ben}.status == INELIGIBLE"
            - "EligibilityCase.${case_ben}.ineligibility_reason == ACADEMIC_GPA"
            - "EligibilityCase.${case_ada}.effective_gpa != EligibilityCase.${case_ben}.effective_gpa despite byte-identical Student academic fields"

      - name: power_rating_final_seeding_diverges_from_in_season_reading
        grounds:
          - calculations.power_rating
          - calculations.playoff_seed_assignment
          - entities.PlayoffSeed.fields.raw_win_pct
          - entities.PlayoffSeed.fields.opponent_avg_win_pct
          - entities.PlayoffSeed.fields.power_rating
          - state_machines.SportSeason.REGULAR_SEASON_to_SEEDING_LOCKED
        distinguishing_aspect: |
          This dual-variant calculation operates on a different entity domain from the GPA rule -
          School-versus-season standings on PlayoffSeed rather than Student academics: an
          undefeated school's IN_SEASON reading is raw_win_pct 1.0000 while its FINAL_SEEDING
          power_rating is 0.6500, and a winless school reads 0.0000 IN_SEASON but 0.3500
          FINAL_SEEDING, so the two variants disagree on every row of the same frozen snapshot.
        test_recipe:
          setup:
            - "Four C4A schools Gale, Hollis, Iver and Juno created in that order, plus a fifth C4A school Kestrel that plays no contests."
            - "One TRACK C4A season in REGULAR_SEASON with required_officials 1 and contest_limit 10."
            - "Two contests, Gale-hosts-Hollis and Iver-hosts-Juno, both resolved by forfeit so the snapshot holds exactly two FORFEITED contests."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T09:00:00Z" }
              as: AssociationAdmin
            - call: "POST /athletics/schools"
              payload: { name: "Gale Prep", classification: "C4A", region_code: "R-EAST" }
              as: AssociationAdmin
              captures: { sch_g: $.data.id }
            - call: "POST /athletics/schools"
              payload: { name: "Hollis High", classification: "C4A", region_code: "R-EAST" }
              as: AssociationAdmin
              captures: { sch_h: $.data.id }
            - call: "POST /athletics/schools"
              payload: { name: "Iver Academy", classification: "C4A", region_code: "R-WEST" }
              as: AssociationAdmin
              captures: { sch_i: $.data.id }
            - call: "POST /athletics/schools"
              payload: { name: "Juno High", classification: "C4A", region_code: "R-WEST" }
              as: AssociationAdmin
              captures: { sch_j: $.data.id }
            - call: "POST /athletics/schools"
              payload: { name: "Kestrel High", classification: "C4A", region_code: "R-NORTH" }
              as: AssociationAdmin
              captures: { sch_k: $.data.id }
            - call: "POST /athletics/sport-seasons"
              payload: { sport: "TRACK", classification: "C4A", school_year: "2026-2027", sport_tier: "TIER_B", practice_start_date: "2026-08-05", first_contest_date: "2026-09-01", season_end_date: "2026-11-15", age_cutoff_date: "2026-09-01", residency_deadline: "2026-08-20", grading_lock_date: "2026-10-01", contest_limit: 10, required_officials: 1 }
              as: AssociationAdmin
              captures: { seas_t: $.data.id }
            - call: "GET /athletics/sport-seasons/${seas_t}"
              payload: {}
              as: AssociationAdmin
              captures: { seas_t_v1: $.data.version }
            - call: "POST /athletics/contests"
              payload: { sport_season_id: "${seas_t}", home_school_id: "${sch_g}", away_school_id: "${sch_h}", starts_at: "2026-09-12T18:00:00Z", ends_at: "2026-09-12T20:00:00Z", travel_miles: 30, expected_sport_season_version: "${seas_t_v1}" }
              as: AssociationAdmin
              captures: { con_gh: $.data.id }
            - call: "GET /athletics/sport-seasons/${seas_t}"
              payload: {}
              as: AssociationAdmin
              captures: { seas_t_v2: $.data.version }
            - call: "POST /athletics/contests"
              payload: { sport_season_id: "${seas_t}", home_school_id: "${sch_i}", away_school_id: "${sch_j}", starts_at: "2026-09-13T18:00:00Z", ends_at: "2026-09-13T20:00:00Z", travel_miles: 30, expected_sport_season_version: "${seas_t_v2}" }
              as: AssociationAdmin
              captures: { con_ij: $.data.id }
            - call: "POST /athletics/contests/${con_gh}/forfeit"
              payload: { forfeiting_school_id: "${sch_h}", forfeit_note: "roster shortfall" }
              as: AssociationAdmin
            - call: "POST /athletics/contests/${con_ij}/forfeit"
              payload: { forfeiting_school_id: "${sch_j}", forfeit_note: "travel failure" }
              as: AssociationAdmin
            - call: "POST /athletics/sport-seasons/${seas_t}/advance"
              payload: { to_status: "PRACTICE_OPEN" }
              as: AssociationAdmin
            - call: "POST /athletics/sport-seasons/${seas_t}/advance"
              payload: { to_status: "REGULAR_SEASON" }
              as: AssociationAdmin
          trigger:
            - call: "POST /athletics/sport-seasons/${seas_t}/seed"
              payload: {}
              as: AssociationAdmin
          assert:
            - "PlayoffSeed for school ${sch_g} in season ${seas_t}: raw_win_pct == 1.0000"
            - "PlayoffSeed for school ${sch_g} in season ${seas_t}: opponent_avg_win_pct == 0.0000"
            - "PlayoffSeed for school ${sch_g} in season ${seas_t}: power_rating == 0.6500"
            - "PlayoffSeed for school ${sch_h} in season ${seas_t}: raw_win_pct == 0.0000"
            - "PlayoffSeed for school ${sch_h} in season ${seas_t}: opponent_avg_win_pct == 1.0000"
            - "PlayoffSeed for school ${sch_h} in season ${seas_t}: power_rating == 0.3500"
            - "PlayoffSeed.power_rating != PlayoffSeed.raw_win_pct for every one of the four seeded schools"
            - "SportSeason.${seas_t}.seeded_school_count == 4"
            - "SportSeason.${seas_t}.status == SEEDING_LOCKED"
            - "GET /athletics/schools/${sch_k}/playoff-seeds returns an array of length 0"

  - rule_id: combinatorial_formula
    instances:

      - name: participation_fee_pins_per_line_rounding_before_the_family_cap
        grounds:
          - calculations.participation_fee_assessment
          - entities.EligibilityCase.fields.fee_amount_cents
          - entities.EligibilityCase.fields.fee_outstanding_cents
          - entities.Student.fields.free_reduced_lunch
          - entities.School.fields.fee_cap_cents
          - entities.SportSeason.fields.sport_tier
        distinguishing_aspect: |
          Mode (b) - nested rounding whose ORDER changes the persisted cents. The same TIER_A
          base of 12345 with a 25 percent multi-sport discount and a 50 percent free/reduced-lunch
          reduction yields 4630 under the pinned per-line order round(12345*0.75)=9259 then
          round(9259*0.50)=4630, but 4629 under the collapsed round(12345*0.75*0.50)=4629 reading;
          the scaffold pins per-line rounding, so 4630 is the only correct answer.
        test_recipe:
          setup:
            - "One school North High with fee_cap_cents 20000."
            - "One free/reduced-lunch student Cora enrolled there."
            - "Two seasons in school_year 2026-2027: a BASKETBALL TIER_C season and a FOOTBALL TIER_A season."
            - "Cora already holds one eligibility case, opened against the TIER_C season, whose fee_amount_cents is 3250."
          setup_api_calls:
            - call: "POST /athletics/schools"
              payload: { name: "North High", classification: "C3A", region_code: "R-NORTH", fee_cap_cents: 20000 }
              as: AssociationAdmin
              captures: { sch_a: $.data.id }
            - call: "POST /athletics/sport-seasons"
              payload: { sport: "BASKETBALL", classification: "C3A", school_year: "2026-2027", sport_tier: "TIER_C", practice_start_date: "2026-08-05", first_contest_date: "2026-09-01", season_end_date: "2026-11-15", age_cutoff_date: "2026-09-01", residency_deadline: "2026-08-20", grading_lock_date: "2026-10-01", contest_limit: 10, required_officials: 2 }
              as: AssociationAdmin
              captures: { seas_k: $.data.id }
            - call: "POST /athletics/sport-seasons"
              payload: { sport: "FOOTBALL", classification: "C3A", school_year: "2026-2027", sport_tier: "TIER_A", practice_start_date: "2026-08-05", first_contest_date: "2026-09-01", season_end_date: "2026-11-15", age_cutoff_date: "2026-09-01", residency_deadline: "2026-08-20", grading_lock_date: "2026-10-01", contest_limit: 10, required_officials: 2 }
              as: AssociationAdmin
              captures: { seas_f: $.data.id }
            - call: "POST /athletics/students"
              payload: { school_id: "${sch_a}", full_name: "Cora Diaz", birth_date: "2009-03-11", grade_level: 11, residency_verified: true, residency_verified_on: "2026-08-10", free_reduced_lunch: true }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
              captures: { stu_cora: $.data.id }
            - call: "POST /athletics/eligibility-cases"
              payload: { student_id: "${stu_cora}", sport_season_id: "${seas_k}" }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
              captures: { case_k: $.data.id }
          trigger:
            - call: "POST /athletics/eligibility-cases"
              payload: { student_id: "${stu_cora}", sport_season_id: "${seas_f}" }
              as: SchoolAthleticDirector
              as_user_id: "${sch_a}"
              captures: { case_f: $.data.id }
          assert:
            - "EligibilityCase.${case_k}.fee_amount_cents == 3250"
            - "EligibilityCase.${case_f}.fee_amount_cents == 4630"
            - "EligibilityCase.${case_f}.fee_amount_cents != 4629"
            - "EligibilityCase.${case_f}.fee_outstanding_cents == 4630"
            - "EligibilityCase.${case_f}.fee_status == ASSESSED"

      - name: seeding_freezes_opponent_win_pct_table_before_power_ratings
        grounds:
          - calculations.playoff_seed_assignment
          - calculations.power_rating
          - entities.PlayoffSeed.fields.opponent_avg_win_pct
          - entities.PlayoffSeed.fields.seed_number
          - entities.PlayoffSeed.fields.tiebreak_trace
          - state_machines.SportSeason.REGULAR_SEASON_to_SEEDING_LOCKED
        distinguishing_aspect: |
          Mode (c) - a circular-looking dependency with a pinned evaluation order. Bramble's and
          Cedar's opponent_avg_win_pct must be 0.6111, the mean of the FROZEN step-3 raw_win_pct
          values 1.0000, 0.3333 and 0.5000; an implementation that recomputes strength of schedule
          from step-5 power_ratings instead produces different numbers and a different bracket.
          The order also forces the tie between Bramble and Cedar at power_rating 0.4305 down the
          chain to head-to-head, which Bramble wins because it beat Cedar in their only meeting.
        test_recipe:
          setup:
            - "Four C5A schools Alder, Bramble, Cedar and Dune."
            - "One SOCCER C5A season in REGULAR_SEASON, contest_limit 10, required_officials 1."
            - "Five contests, all resolved by forfeit, giving records Alder 2-0, Bramble 1-2, Cedar 1-2, Dune 1-1, with Bramble beating Cedar in their only meeting."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T09:00:00Z" }
              as: AssociationAdmin
            - call: "POST /athletics/schools"
              payload: { name: "Alder High", classification: "C5A", region_code: "R-NORTH" }
              as: AssociationAdmin
              captures: { sch_al: $.data.id }
            - call: "POST /athletics/schools"
              payload: { name: "Bramble High", classification: "C5A", region_code: "R-NORTH" }
              as: AssociationAdmin
              captures: { sch_br: $.data.id }
            - call: "POST /athletics/schools"
              payload: { name: "Cedar High", classification: "C5A", region_code: "R-SOUTH" }
              as: AssociationAdmin
              captures: { sch_ce: $.data.id }
            - call: "POST /athletics/schools"
              payload: { name: "Dune High", classification: "C5A", region_code: "R-SOUTH" }
              as: AssociationAdmin
              captures: { sch_du: $.data.id }
            - call: "POST /athletics/sport-seasons"
              payload: { sport: "SOCCER", classification: "C5A", school_year: "2026-2027", sport_tier: "TIER_B", practice_start_date: "2026-08-05", first_contest_date: "2026-09-01", season_end_date: "2026-11-15", age_cutoff_date: "2026-09-01", residency_deadline: "2026-08-20", grading_lock_date: "2026-10-01", contest_limit: 10, required_officials: 1 }
              as: AssociationAdmin
              captures: { seas_s: $.data.id }
            - call: "GET /athletics/sport-seasons/${seas_s}"
              payload: {}
              as: AssociationAdmin
              captures: { seas_s_v1: $.data.version }
            - call: "POST /athletics/contests"
              payload: { sport_season_id: "${seas_s}", home_school_id: "${sch_al}", away_school_id: "${sch_br}", starts_at: "2026-09-05T18:00:00Z", ends_at: "2026-09-05T20:00:00Z", travel_miles: 25, expected_sport_season_version: "${seas_s_v1}" }
              as: AssociationAdmin
              captures: { con_1: $.data.id }
            - call: "GET /athletics/sport-seasons/${seas_s}"
              payload: {}
              as: AssociationAdmin
              captures: { seas_s_v2: $.data.version }
            - call: "POST /athletics/contests"
              payload: { sport_season_id: "${seas_s}", home_school_id: "${sch_al}", away_school_id: "${sch_ce}", starts_at: "2026-09-20T18:00:00Z", ends_at: "2026-09-20T20:00:00Z", travel_miles: 25, expected_sport_season_version: "${seas_s_v2}" }
              as: AssociationAdmin
              captures: { con_2: $.data.id }
            - call: "GET /athletics/sport-seasons/${seas_s}"
              payload: {}
              as: AssociationAdmin
              captures: { seas_s_v3: $.data.version }
            - call: "POST /athletics/contests"
              payload: { sport_season_id: "${seas_s}", home_school_id: "${sch_br}", away_school_id: "${sch_ce}", starts_at: "2026-10-05T18:00:00Z", ends_at: "2026-10-05T20:00:00Z", travel_miles: 25, expected_sport_season_version: "${seas_s_v3}" }
              as: AssociationAdmin
              captures: { con_3: $.data.id }
            - call: "GET /athletics/sport-seasons/${seas_s}"
              payload: {}
              as: AssociationAdmin
              captures: { seas_s_v4: $.data.version }
            - call: "POST /athletics/contests"
              payload: { sport_season_id: "${seas_s}", home_school_id: "${sch_du}", away_school_id: "${sch_br}", starts_at: "2026-10-20T18:00:00Z", ends_at: "2026-10-20T20:00:00Z", travel_miles: 25, expected_sport_season_version: "${seas_s_v4}" }
              as: AssociationAdmin
              captures: { con_4: $.data.id }
            - call: "GET /athletics/sport-seasons/${seas_s}"
              payload: {}
              as: AssociationAdmin
              captures: { seas_s_v5: $.data.version }
            - call: "POST /athletics/contests"
              payload: { sport_season_id: "${seas_s}", home_school_id: "${sch_ce}", away_school_id: "${sch_du}", starts_at: "2026-11-04T18:00:00Z", ends_at: "2026-11-04T20:00:00Z", travel_miles: 25, expected_sport_season_version: "${seas_s_v5}" }
              as: AssociationAdmin
              captures: { con_5: $.data.id }
            - call: "POST /athletics/contests/${con_1}/forfeit"
              payload: { forfeiting_school_id: "${sch_br}" }
              as: AssociationAdmin
            - call: "POST /athletics/contests/${con_2}/forfeit"
              payload: { forfeiting_school_id: "${sch_ce}" }
              as: AssociationAdmin
            - call: "POST /athletics/contests/${con_3}/forfeit"
              payload: { forfeiting_school_id: "${sch_ce}" }
              as: AssociationAdmin
            - call: "POST /athletics/contests/${con_4}/forfeit"
              payload: { forfeiting_school_id: "${sch_br}" }
              as: AssociationAdmin
            - call: "POST /athletics/contests/${con_5}/forfeit"
