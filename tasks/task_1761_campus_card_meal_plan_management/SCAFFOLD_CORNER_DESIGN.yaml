              captures: { ev2_dec: "$.data.decision", ev2_reason: "$.data.deny_reason" }
            - { call: "POST /api/access-grants/${gy_id}/reinstate", payload: {}, as: SecurityOfficer }
            - call: "POST /api/access-events"
              payload: { card_id: "${c_id}", zone_id: "${zy_id}" }
