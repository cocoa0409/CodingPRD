      - name: not_found_sweep_across_every_path_parameter_resource
        claim_type: error_triggerable
        grounds:
          - validations[priority=3]
          - errors[ERR_CLIENT_NOT_FOUND]
          - errors[ERR_INQUIRY_NOT_FOUND]
          - errors[ERR_PROPOSAL_NOT_FOUND]
          - errors[ERR_OPTION_NOT_FOUND]
          - errors[ERR_ENGAGEMENT_NOT_FOUND]
          - errors[ERR_CONTRACT_NOT_FOUND]
          - errors[ERR_HOLD_NOT_FOUND]
          - errors[ERR_TRAVEL_EXPENSE_NOT_FOUND]
          - errors[ERR_INVOICE_NOT_FOUND]
          - errors[ERR_REMITTANCE_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_GRANT_NOT_FOUND]
          - errors[ERR_FEEDBACK_NOT_FOUND]
        distinguishing_aspect: |
          Each resource family must answer with ITS OWN 404 error_id rather than a generic
          not-found: thirteen reads against the same syntactically valid unknown UUID must produce
          thirteen distinct error_ids drawn from the priority-3 list.
