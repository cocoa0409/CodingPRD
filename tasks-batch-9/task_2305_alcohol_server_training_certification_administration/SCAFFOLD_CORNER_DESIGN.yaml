        grounds:
          - validations.priority_18_ERR_APPROVAL_NOT_EFFECTIVE
          - entities.CourseApproval.fields.effective_from
          - entities.CourseApproval.fields.expires_at
        distinguishing_aspect: |
          The window is compared against scheduled_start_at, not the clock, and is
          half-open: a session starting before effective_from and a session starting exactly
          at expires_at both return ERR_APPROVAL_NOT_EFFECTIVE (422), while a start one
          minute before expires_at is accepted.
        test_recipe:
          setup:
            - "A TX MANDATORY jurisdiction, a PUBLISHED ON_PREMISE course, and a CERTIFIED trainer credentialed through 2027-06-30."
            - "The TX approval is APPROVED with effective_from 2026-09-01T00:00:00Z and expires_at 2026-12-01T00:00:00Z; the clock reads 2026-08-03T09:00Z."
