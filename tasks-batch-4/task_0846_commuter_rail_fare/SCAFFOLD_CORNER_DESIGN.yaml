        distinguishing_aspect: "POST /citations is Conductor-exclusive; a Passenger is rejected with ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Clock 2026-03-01. Passenger with an EVASION inspection."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
