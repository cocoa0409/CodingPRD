      - name: the_de_annexation_flag_off_rejects_a_de_annexation_case_at_creation
        claim_type: conditional_feature_flags
        grounds:
          - validations[priority=74]
          - statute_profiles.de_annexation_allowed
        distinguishing_aspect: |
          Two municipalities differing only in their statute's de_annexation_allowed flag receive
          opposite answers to the byte-identical case creation: under the false flag the
          DE_ANNEXATION case is refused with ERR_DE_ANNEXATION_NOT_ALLOWED, under the default true
          flag the same body is accepted in DRAFT with case_type DE_ANNEXATION. The predecessor id
          is well-formed in both calls, so only the flag can explain the difference.
        test_recipe:
          setup:
            - "Two statutes — one with de_annexation_allowed false, one left at its default — each with a municipality holding one DRAFT ANNEXATION case to serve as the named predecessor."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["INVOLUNTARY_ORDINANCE"], required_service_types: ["POLICE"], de_annexation_allowed: false }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_c4_off: $.data.id }
            - call: "POST /statute-profiles"
              payload: { state_code: "SC", authorized_methods: ["INVOLUNTARY_ORDINANCE"], required_service_types: ["POLICE"] }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_c4_on: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_c4_off}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_c4_off: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_c4_on}", name: "Fort Landing", state_code: "SC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_c4_on: $.data.id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_c4_off}", method: "INVOLUNTARY_ORDINANCE", shared_boundary_feet: 20000, total_lot_count: 1, developed_lot_count: 1, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_c4_off}"
              captures: { case_c4_pred_off: $.data.id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_c4_on}", method: "INVOLUNTARY_ORDINANCE", shared_boundary_feet: 20000, total_lot_count: 1, developed_lot_count: 1, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_c4_on}"
              captures: { case_c4_pred_on: $.data.id }
          trigger:
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_c4_off}", method: "INVOLUNTARY_ORDINANCE", case_type: "DE_ANNEXATION", predecessor_case_id: "${case_c4_pred_off}", shared_boundary_feet: 20000, total_lot_count: 1, developed_lot_count: 1, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_c4_off}"
              captures: { c4_e_off: $.data.error_id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_c4_on}", method: "INVOLUNTARY_ORDINANCE", case_type: "DE_ANNEXATION", predecessor_case_id: "${case_c4_pred_on}", shared_boundary_feet: 20000, total_lot_count: 1, developed_lot_count: 1, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_c4_on}"
              captures: { case_c4_da: $.data.id, c4_case_type: $.data.case_type, c4_pred: $.data.predecessor_case_id, c4_status: $.data.status }
          assert:
            - "${c4_e_off} == ERR_DE_ANNEXATION_NOT_ALLOWED with status 422"
            - "the accepted create returns status 201"
            - "${c4_case_type} == DE_ANNEXATION"
            - "${c4_pred} == ${case_c4_pred_on}"
            - "${c4_status} == DRAFT"
            - "GET /annexation-cases?municipality_id=${muni_c4_off}&case_type=DE_ANNEXATION returns total_count == 0"
            - "GET /annexation-cases?predecessor_case_id=${case_c4_pred_on} returns total_count == 1"

