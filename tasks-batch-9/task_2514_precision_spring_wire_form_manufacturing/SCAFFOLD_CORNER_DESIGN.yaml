  instances:
  - name: program_create_unauthenticated_outranks_unauthorized
    claim_type: priority_ordering
    grounds:
    - validations[priority 1]
    - validations[priority 2]
    - errors[ERR_UNAUTHENTICATED]
    - endpoints[POST /customer-programs]
    distinguishing_aspect: 'A header-less call that would also have failed the role check answers 401 ERR_UNAUTHENTICATED,
      not 403: the authentication row at priority 1 is evaluated before the authorization row at priority 2, and
      DesignEngineer is not in the roles list of POST /customer-programs either.'
    test_recipe:
      setup:
      - One INDUSTRIAL program PGM-1 exists.
      setup_api_calls:
      - call: POST /customer-programs
        payload:
          program_code: PGM-1
          customer_name: Bramble Industrial Supply
          application_class: INDUSTRIAL
          ppap_level: 1
          committed_pieces: 500000
          minimum_order_quantity: 1000
          required_salt_spray_hours: 96
          biocompatibility_required: false
