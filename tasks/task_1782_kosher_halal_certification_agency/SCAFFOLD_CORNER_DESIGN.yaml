  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Request without X-User-ID/X-User-Role -> 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, before any role/existence checks."
        test_recipe:
          setup: ["one client exists"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { legal_name: "Auth Co", certification_scheme: "KOSHER", contact_email: "au@x.com" }, as: AccountManager, captures: { cAu: $.data.id } }
          trigger:
            - { call: "GET /api/clients/${cAu}", as: "", captures: { err: $.data.error_id } }
          assert: ["err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400)"]

      - name: client_contact_cannot_create_agreement_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", roles.AccountManager]
        distinguishing_aspect: "POST /api/agreements is AccountManager-only; ClientContact -> 403 ERR_FORBIDDEN_ROLE even with a well-formed payload."
        test_recipe:
          setup: ["client exists and submitted"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { legal_name: "RB1 Co", certification_scheme: "KOSHER", contact_email: "rb1@x.com" }, as: AccountManager, captures: { cR1: $.data.id } }
            - { call: "POST /api/clients/${cR1}/submit-application", as: ClientContact, as_user_id: "${cR1}", captures: { cR1_v: $.data.version } }
          trigger:
            - { call: "POST /api/agreements", payload: { client_id: "${cR1}", scheme: "KOSHER", billing_cycle: "ANNIVERSARY", term_start_date: "2026-04-01", per_product_fee_cents: 73000, expected_client_version: "${cR1_v}" }, as: ClientContact, as_user_id: "${cR1}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_FORBIDDEN_ROLE (403)"]

      - name: cross_client_ingredient_create_scope_violation
        claim_type: violation_to_error
        grounds: ["validations[priority=2.5]", "errors[ERR_CLIENT_SCOPE_VIOLATION]"]
        distinguishing_aspect: "ClientContact with X-User-ID == client A posting an ingredient naming client B -> 403 ERR_CLIENT_SCOPE_VIOLATION."
        test_recipe:
          setup: ["clients A and B exist"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { legal_name: "A Co", certification_scheme: "KOSHER", contact_email: "a2@x.com" }, as: AccountManager, captures: { cRA: $.data.id } }
            - { call: "POST /api/clients", payload: { legal_name: "B Co", certification_scheme: "KOSHER", contact_email: "b3@x.com" }, as: AccountManager, captures: { cRB: $.data.id } }
          trigger:
            - { call: "POST /api/ingredients", payload: { client_id: "${cRB}", name: "Sneaky", manufacturer: "M", source_category: "PLANT" }, as: ClientContact, as_user_id: "${cRA}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_CLIENT_SCOPE_VIOLATION (403)"]

      - name: supervisor_cannot_start_unassigned_visit
        claim_type: violation_to_error
        grounds: ["validations[priority=2.5]", "errors[ERR_NOT_ASSIGNED_INSPECTOR]"]
        distinguishing_aspect: "Visit assigned to sup-1; start attempt by sup-2 -> 403 ERR_NOT_ASSIGNED_INSPECTOR."
        test_recipe:
          setup: ["visit SCHEDULED with inspector sup-1; clock inside the window"]
