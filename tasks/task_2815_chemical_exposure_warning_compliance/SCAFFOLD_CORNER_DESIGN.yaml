      - name: val_lab_tested_submit_with_refused_disclosure_rejected
        claim_type: conditional_validation
        grounds:
          - validations[priority=52]
          - errors[ERR_SUPPLIER_DATA_INCOMPLETE]
          - entities.Material.fields.naturally_occurring_claim
        distinguishing_aspect: |
          The rule only bites when the naturally_occurring_claim flag is false: with a REFUSED
          supplier disclosure the LAB_TESTED SUBMIT is refused, but flipping that one flag to true on
          the same material makes the identical SUBMIT succeed - and because the variant is
          LAB_TESTED the refusal does not change the measured concentration, so the resulting
          exposure is the lab value (0.750) rather than the MODELED_DEFAULT_PPM substitution.
        test_recipe:
          setup:
            - "Bisphenol A is LISTED with MADL 0.5 ug/day."
            - "Material RM-100 has disclosure_status REFUSED and naturally_occurring_claim false, and its Bisphenol A link is TEST_REPORTED with measurement_basis LAB_TESTED, lab_result_ppm 60.0, lab_loq_ppm 1.0."
            - "Product SKU-REF has one ACTIVE component of RM-100 at 0.25 g/unit, contact_factor 0.5, and a DRAFT LAB_TESTED assessment (DERMAL, 1.0 use/day)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Silent Supply Co", contact_email: "nope@silent.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-100", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_1: $.data.id }
            - call: "POST /materials/${mat_1}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 60.0 }
              as: ComplianceAnalyst
              captures: { link_1: $.data.id }
            - call: "POST /material-chemicals/${link_1}/transitions"
              payload: { action: "REQUEST_TEST" }
              as: ComplianceAnalyst
            - call: "POST /material-chemicals/${link_1}/transitions"
              payload: { action: "REPORT_RESULT", lab_name: "Harbor Analytical", lab_result_ppm: 60.0, lab_loq_ppm: 1.0 }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "MARK_REFUSED" }
              as: ComplianceAnalyst
            - call: "POST /products"
              payload: { sku: "SKU-REF", product_name: "Refused Disclosure Widget", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 1000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /products/${prod_1}/components"
              payload: { material_id: "${mat_1}", quantity_grams_per_unit: 0.25, contact_factor: 0.5 }
              as: ComplianceAnalyst
            - call: "POST /products/${prod_1}/exposure-assessments"
              payload: { chemical_id: "${chem_bpa}", method: "LAB_TESTED", route: "DERMAL", uses_per_day: 1.0 }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
              captures: { asmt_1: $.data.id }
          trigger:
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "SUBMIT" }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
            - call: "PATCH /materials/${mat_1}"
              payload: { naturally_occurring_claim: true }
              as: ComplianceAnalyst
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "SUBMIT" }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
          assert:
            - "first trigger call: HTTP 409 with error_id ERR_SUPPLIER_DATA_INCOMPLETE (priority 52 is reached because priority 51 is satisfied - the link already has LAB_TESTED basis with both lab_result_ppm and lab_loq_ppm)"
            - "Material.${mat_1}.disclosure_status == REFUSED and naturally_occurring_claim == true after the PATCH"
            - "third trigger call: HTTP 200, ExposureAssessment.${asmt_1}.status == SUBMITTED"
            - "daily_exposure_ug == 0.750 from the lab value 60.0 ppm, NOT 3.125 from a MODELED_DEFAULT_PPM substitution: the LAB_TESTED variant ignores disclosure gaps entirely"
            - "margin_ratio == 1.5000 and result == AT_OR_ABOVE_SAFE_HARBOR"

