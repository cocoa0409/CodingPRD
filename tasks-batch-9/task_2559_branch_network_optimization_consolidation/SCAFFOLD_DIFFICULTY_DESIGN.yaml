              as: NetworkStrategist
              captures: { b2_id: $.data.id }
            - call: "POST /distribution/consolidation-cases"
              payload: { closing_branch_id: "${b1_id}", receiving_branch_id: "${b2_id}", rationale_code: "MARKET_OVERLAP", planned_closure_date: "2027-01-15", expected_branch_version: "${b1_v}" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /distribution/consolidation-cases/${case_id}/impact-assessments"
              payload: { lmi_tract: true, distance_to_nearest_remaining_miles: 5.0, alternative_access_count: 3, senior_household_pct_bps: 1600, public_transit_access: true }
              as: ComplianceOfficer
