              as_user_id: "${t_id}"
              captures: { en_id: $.data.id }
            - call: "GET /api/invoices"
              payload: { enrollment_id: "${en_id}", kind: "SUBSCRIPTION" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { sub_inv_id: "$.data[0].id" }
            - call: "POST /api/invoices/${sub_inv_id}/pay"
              payload: {}
              as: Tenant
              as_user_id: "${t_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-11T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/enrollments/${en_id}/cancel"
              payload: {}
              as: Tenant
              as_user_id: "${t_id}"
          assert:
            - "POST /api/enrollments/${en_id}/cancel .data.earned_cents == 484"
            - "POST /api/enrollments/${en_id}/cancel .data.refund_cents == 1015"
            - "earned_cents + refund_cents == 1499"


