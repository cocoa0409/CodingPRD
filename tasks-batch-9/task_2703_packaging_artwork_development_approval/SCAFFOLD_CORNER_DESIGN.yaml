          Authentication sits at priority 1, above every existence check, so the
          first call deliberately stacks two faults - no X-User-Role header AND a
          brief id that matches no row - and the answer must be 401
          ERR_MISSING_AUTH_HEADERS, never the 404 ERR_BRIEF_NOT_FOUND of priority 3.
          The other two faults §1.6 names for this id are probed too: a role string
          that is not one of the seven (Auditor) and a request with a valid role but
