scenario: "Donor & Fundraising CRM: gift/pledge entry, recurring/installment, matching gift, soft credit/household, campaign/appeal attribution, acknowledgement/receipt, planned giving, lapsed-donor reactivation, segmentation"
domain_name: "donor-fundraising-crm"
api_prefix: ""

complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Event sourcing"
  complexity_layers:
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Derived field reconciliation"
    - "Rate / threshold triggers"
    - "Optimistic concurrency"

  entity_topology: flat
  # All entities are peers linked by foreign keys (donor_id, pledge_id,
  # campaign_id, household_id, employer_id). No URL nesting; every relationship
  # is an FK in the request body, validated by reference.

  state_machine_shape: branching
  # Gift: branching (RECORDED -> {ACKNOWLEDGED, REFUNDED}; ACKNOWLEDGED ->
  #   RECEIPTED -> REFUNDED with compensation). Pledge: cyclic (ACTIVE ->
  #   DELINQUENT -> ACTIVE revision loop). MatchClaim: branching fork.
  #   Donor: parallel dimensions (lifecycle_status x giving_status).

  relationship_patterns:
    - one_to_many       # Donor -> Gift, Campaign -> Appeal, Pledge -> Gift
    - cross_aggregate   # Gift attributes across Campaign + Appeal + Pledge boundaries
    - self_referential  # Donor.household_id groups donors; soft credit flows across household peers

  role_model: peer_roles
  # GiftAdmin owns gift/pledge/refund entry; CampaignManager owns campaigns,
  # appeals and segmentation; DonorRelations owns acknowledgements/receipts and
  # reactivation. Each role owns a distinct slice of the surface; a few read
  # operations are shared.

  consistency_model: immediate
  # Every cascade (pledge balance, campaign raised totals, donor giving
  # aggregates, household soft-credit) is recomputed atomically inside the
  # request that triggers it.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# §1.1 Entity-Relationship Table
# ===========================================================================
entities:
  - name: Household
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Household display name (e.g., 'The Reyes Family')."
        constraints: "1-120 chars, required."
      - name: primary_donor_id
        type: string
        source: input
        description: "FK -> Donor.id; the household's primary member. Nullable at creation, set via PATCH once a member exists; the named donor's household_id MUST already equal this household."
        default: null
      - name: soft_credit_policy
        type: enum
        source: input
        description: "How a member gift distributes soft credit to other members."
        default: "FULL_TO_ALL"
        constraints: "One of {FULL_TO_ALL, SPLIT_EVEN, PRIMARY_ONLY}."
      - name: total_soft_credit_cents
        type: integer
        source: computed
        description: "Sum of soft_credit_cents across all SoftCredit rows whose household_id == this id. Recomputed on every gift acknowledgement and refund."
        default: 0
      - name: member_count
        type: integer
        source: computed
        description: "Count of Donor rows whose household_id == this id."
        default: 0

  - name: Donor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Donor full name."
        constraints: "1-120 chars, required."
      - name: email
        type: string
        source: input
        description: "Contact email; unique across all Donor rows (case-insensitive)."
        constraints: "Required, RFC-ish, unique (case-insensitive)."
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; the household this donor belongs to. Nullable for unaffiliated donors."
        default: null
      - name: employer_id
        type: string
        source: input
        description: "FK -> Employer.id; donor's matching-gift employer. Nullable."
        default: null
      - name: lifecycle_status
        type: enum
        source: computed
        description: "Lifecycle dimension (parallel to giving_status). Server-managed via reactivation actions."
        default: "PROSPECT"
        constraints: "One of {PROSPECT, ACTIVE, LAPSED, REACTIVATED, ARCHIVED}."
      - name: giving_status
        type: enum
        source: computed
        description: "Giving-tier dimension (parallel to lifecycle_status). Derived from lifetime_hard_credit_cents at every gift acknowledgement and refund per §1.3 donor_giving_tier."
        default: "NONE"
        constraints: "One of {NONE, ENTRY, MID, MAJOR}."
      - name: lifetime_hard_credit_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over this donor's Gift rows in status IN {ACKNOWLEDGED, RECEIPTED}. Refund moving a gift to REFUNDED subtracts it back. See §1.3 donor_lifetime_hard_credit."
        default: 0
      - name: last_gift_at
        type: datetime
        source: computed
        description: "created_at of the most recent Gift (by created_at) for this donor in status IN {ACKNOWLEDGED, RECEIPTED}; null if none. Drives lapse detection."
        default: null
      - name: lapse_threshold_days
        type: integer
        source: input
        description: "Days of inactivity after last_gift_at before the donor is eligible to be flagged LAPSED."
        default: 365
        constraints: "Integer 30-3650."

  - name: Employer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Employer / matching-gift company name."
        constraints: "1-120 chars, required, unique (case-insensitive)."
      - name: match_ratio
        type: number
        source: input
        description: "Match multiplier applied to an eligible gift (e.g., 1.0 = dollar-for-dollar, 0.5 = half)."
        default: 1.0
        constraints: "0 < match_ratio <= 3.0."
      - name: min_gift_cents
        type: integer
        source: input
        description: "Minimum donor gift amount (cents) eligible for matching. Gifts below this are ineligible."
        default: 2500
        constraints: "Integer >= 0."
      - name: max_match_cents
        type: integer
        source: input
        description: "Per-gift cap on the matched amount (cents)."
        default: 1000000
        constraints: "Integer >= 1."
      - name: annual_match_cap_cents
        type: integer
        source: input
        description: "Per-donor per-employer cap on total matched amount within a calendar year (cents)."
        default: 5000000
        constraints: "Integer >= 1."

  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Campaign name."
        constraints: "1-120 chars, required."
      - name: goal_cents
        type: integer
        source: input
        description: "Fundraising goal in cents."
        constraints: "Integer >= 1, required."
      - name: starts_on
        type: datetime
        source: input
        description: "Campaign window start (inclusive)."
        constraints: "ISO 8601 UTC, required."
      - name: ends_on
        type: datetime
        source: input
        description: "Campaign window end (inclusive). Must be strictly after starts_on."
        constraints: "ISO 8601 UTC, required, > starts_on."
      - name: status
        type: enum
        source: computed
        description: "Campaign lifecycle state. Server-managed via §1.2 Campaign machine."
        default: "DRAFT"
        constraints: "One of {DRAFT, OPEN, CLOSED}."
      - name: raised_hard_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over Gift rows whose campaign_id == this id and status IN {ACKNOWLEDGED, RECEIPTED}. See §1.3 campaign_raised."
        default: 0
      - name: raised_with_match_cents
        type: integer
        source: computed
        description: "raised_hard_cents PLUS sum of matched_amount_cents over MatchClaim rows in status PAID whose gift's campaign_id == this id. Divergent second variant of campaign_raised."
        default: 0

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; the parent campaign this appeal belongs to."
        constraints: "Required; campaign must exist."
      - name: channel
        type: enum
        source: input
        description: "Solicitation channel."
        constraints: "One of {EMAIL, DIRECT_MAIL, EVENT, PHONE, WEB}, required."
      - name: code
        type: string
        source: input
        description: "Appeal tracking code; unique within its campaign (case-insensitive)."
        constraints: "1-40 chars, required, unique per campaign_id."
      - name: expected_response_rate
        type: number
        source: input
        description: "Planner's expected fraction of solicited donors who give (0..1)."
        default: 0.05
        constraints: "0 < expected_response_rate <= 1."
      - name: attributed_gift_count
        type: integer
        source: computed
        description: "Count of Gift rows whose appeal_id == this id in status IN {ACKNOWLEDGED, RECEIPTED}."
        default: 0

  - name: Pledge
    parent: null
    common_fields: true
    fields:
      - name: donor_id
        type: string
        source: input
        description: "FK -> Donor.id; the donor who made the pledge."
        constraints: "Required; donor must exist and not be ARCHIVED."
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; the campaign the pledge supports. Must be OPEN at pledge creation."
        constraints: "Required."
      - name: total_amount_cents
        type: integer
        source: input
        description: "Total committed amount in cents."
        constraints: "Integer >= 1, required."
      - name: installment_count
        type: integer
        source: input
        description: "Number of equal installments the pledge is split into."
        constraints: "Integer 1-60, required."
      - name: frequency
        type: enum
        source: input
        description: "Cadence between installments."
        constraints: "One of {ONE_TIME, MONTHLY, QUARTERLY, ANNUAL}, required."
      - name: schedule_basis
        type: enum
        source: input
        description: "Which rounding convention pins the per-installment amounts. See §1.3 installment_schedule."
        default: "FRONT_LOADED"
        constraints: "One of {FRONT_LOADED, BACK_LOADED}."
      - name: status
        type: enum
        source: computed
        description: "Pledge lifecycle state. Server-managed via §1.2 Pledge machine (cyclic)."
        default: "ACTIVE"
        constraints: "One of {ACTIVE, DELINQUENT, FULFILLED, CANCELLED}."
      - name: paid_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over Gift rows whose pledge_id == this id in status IN {ACKNOWLEDGED, RECEIPTED}."
        default: 0
      - name: balance_cents
        type: integer
        source: computed
        description: "total_amount_cents - paid_cents (floored at 0). Recomputed on every gift acknowledgement and refund."
        default: 0
      - name: installments_due_count
        type: integer
        source: computed
        description: "Count of PledgeInstallment rows for this pledge whose due_on <= current clock AND status == DUE. Drives delinquency."
        default: 0

  - name: PledgeInstallment
    parent: null
    common_fields: true
    fields:
      - name: pledge_id
        type: string
        source: input
        description: "FK -> Pledge.id; the parent pledge. Installments are created as a cascade side-effect of pledge creation, never directly."
        constraints: "Required (set by cascade)."
      - name: sequence_no
        type: integer
        source: system
        description: "1-based position in the installment schedule."
        constraints: "Integer >= 1."
      - name: amount_cents
        type: integer
        source: computed
        description: "Scheduled amount for this installment per §1.3 installment_schedule (varies by schedule_basis)."
      - name: due_on
        type: datetime
        source: computed
        description: "Scheduled due date, derived from pledge.created_at plus sequence offset by frequency."
      - name: status
        type: enum
        source: computed
        description: "Installment state. Server-managed via §1.2 PledgeInstallment machine."
        default: "DUE"
        constraints: "One of {DUE, PAID, WAIVED}."
      - name: paid_by_gift_id
        type: string
        source: computed
        description: "FK -> Gift.id; the gift that satisfied this installment (set when allocation marks it PAID). Null while DUE."
        default: null

  - name: Gift
    parent: null
    common_fields: true
    fields:
      - name: donor_id
        type: string
        source: input
        description: "FK -> Donor.id; the donor of record (hard credit recipient)."
        constraints: "Required; donor must exist and not be ARCHIVED."
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; campaign attribution. Required; campaign must be OPEN."
        constraints: "Required."
      - name: appeal_id
        type: string
        source: input
        description: "FK -> Appeal.id; appeal attribution. Optional; if present its campaign_id MUST equal this gift's campaign_id."
        default: null
      - name: pledge_id
        type: string
        source: input
        description: "FK -> Pledge.id; if this gift pays down a pledge. Optional; if present pledge.donor_id MUST equal this gift's donor_id and pledge.campaign_id MUST equal this gift's campaign_id."
        default: null
      - name: amount_cents
        type: integer
        source: input
        description: "Gift amount in cents."
        constraints: "Integer >= 1, required."
      - name: payment_method
        type: enum
        source: input
        description: "How the gift was tendered."
        default: "CARD"
        constraints: "One of {CARD, CHECK, ACH, CASH, STOCK}."
      - name: status
        type: enum
        source: computed
        description: "Gift lifecycle state. Server-managed via §1.2 Gift machine (branching)."
        default: "RECORDED"
        constraints: "One of {RECORDED, ACKNOWLEDGED, RECEIPTED, REFUNDED}."
      - name: deductible_amount_cents
        type: integer
        source: computed
        description: "Tax-deductible portion of the gift per §1.3 deductible_amount (amount_cents minus any benefit_value_cents). Pinned at acknowledgement."
        default: 0
      - name: benefit_value_cents
        type: integer
        source: input
        description: "Fair-market value of goods/services the donor received in exchange (event ticket, gala dinner). Reduces the deductible portion."
        default: 0
        constraints: "Integer >= 0; must be <= amount_cents."
      - name: acknowledged_at
        type: datetime
        source: computed
        description: "Timestamp the gift moved to ACKNOWLEDGED; null until then."
        default: null

  - name: SoftCredit
    parent: null
    common_fields: false
    fields:
      - name: gift_id
        type: string
        source: system
        description: "FK -> Gift.id; the originating hard-credit gift. SoftCredit rows are created as a cascade of gift acknowledgement, never directly."
      - name: household_id
        type: string
        source: system
        description: "FK -> Household.id; the household over which credit is distributed."
      - name: beneficiary_donor_id
        type: string
        source: system
        description: "FK -> Donor.id; the household member receiving this soft-credit row."
      - name: soft_credit_cents
        type: integer
        source: system
        description: "Soft-credit amount for this beneficiary per the household's soft_credit_policy. See §1.3 soft_credit_distribution."
      - name: reversed
        type: boolean
        source: system
        description: "True once the originating gift is REFUNDED and this row's credit has been backed out."
        default: false

  - name: MatchClaim
    parent: null
    common_fields: true
    fields:
      - name: gift_id
        type: string
        source: input
        description: "FK -> Gift.id; the donor gift this employer match is claimed against. The gift MUST be in status IN {ACKNOWLEDGED, RECEIPTED} and its donor MUST have employer_id set."
        constraints: "Required."
      - name: employer_id
        type: string
        source: computed
        description: "FK -> Employer.id; copied from the gift's donor.employer_id at claim creation."
      - name: requested_amount_cents
        type: integer
        source: computed
        description: "Eligible matched amount per §1.3 match_amount at claim creation (before annual-cap clamp)."
      - name: matched_amount_cents
        type: integer
        source: computed
        description: "Final matched amount after annual-cap clamp, pinned when the claim moves to PAID. 0 until PAID."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Match-claim lifecycle. Server-managed via §1.2 MatchClaim machine (branching fork)."
        default: "SUBMITTED"
        constraints: "One of {SUBMITTED, APPROVED, PAID, DENIED}."

  - name: PlannedGift
    parent: null
    common_fields: true
    fields:
      - name: donor_id
        type: string
        source: input
        description: "FK -> Donor.id; the donor who arranged the planned gift."
        constraints: "Required; donor must exist."
      - name: vehicle
        type: enum
        source: input
        description: "Planned-giving instrument."
        constraints: "One of {BEQUEST, CHARITABLE_TRUST, LIFE_INSURANCE, IRA_ROLLOVER}, required."
      - name: expected_amount_cents
        type: integer
        source: input
        description: "Estimated future value in cents."
        constraints: "Integer >= 1, required."
      - name: status
        type: enum
        source: computed
        description: "Planned-gift lifecycle. Server-managed via §1.2 PlannedGift machine."
        default: "INTENT"
        constraints: "One of {INTENT, CONFIRMED, REALIZED, LAPSED}."
      - name: realized_gift_id
        type: string
        source: computed
        description: "FK -> Gift.id; the Gift created when the planned gift is realized. Null until REALIZED."
        default: null

  - name: Acknowledgement
    parent: null
    common_fields: true
    fields:
      - name: gift_id
        type: string
        source: input
        description: "FK -> Gift.id; the gift being acknowledged. Created via the acknowledge action; gift must be RECORDED."
        constraints: "Required."
      - name: donor_id
        type: string
        source: computed
        description: "FK -> Donor.id; copied from the gift at creation."
      - name: template_code
        type: string
        source: input
        description: "Letter/email template identifier."
        default: "STANDARD"
        constraints: "1-40 chars."
      - name: kind
        type: enum
        source: computed
        description: "ACKNOWLEDGEMENT (thank-you) on the acknowledge action, or RECEIPT (tax receipt) on the receipt action."
        constraints: "One of {ACKNOWLEDGEMENT, RECEIPT}."
      - name: receipt_number
        type: string
        source: computed
        description: "Sequential receipt number assigned only for kind==RECEIPT, per §1.3 receipt_numbering. Null for ACKNOWLEDGEMENT."
        default: null

  - name: Segment
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Segment name."
        constraints: "1-80 chars, required."
      - name: min_lifetime_cents
        type: integer
        source: input
        description: "Inclusive lower bound on donor lifetime_hard_credit_cents for membership."
        default: 0
        constraints: "Integer >= 0."
      - name: giving_status_in
        type: array
        source: input
        description: "Donor giving_status values that qualify for membership (e.g., [MID, MAJOR]). Empty array means no giving_status restriction."
        default: []
        constraints: "Subset of {NONE, ENTRY, MID, MAJOR}."
      - name: lifecycle_status_in
        type: array
        source: input
        description: "Donor lifecycle_status values that qualify. Empty array means no lifecycle restriction."
        default: []
        constraints: "Subset of {PROSPECT, ACTIVE, LAPSED, REACTIVATED, ARCHIVED}."
      - name: member_count
        type: integer
        source: computed
        description: "Count of Donor rows matching this segment's predicate at the time GET /segments/{id}/members is evaluated. Computed on read, not stored as a snapshot."
        default: 0

# ===========================================================================
# §1.2 State Machine Table
# ===========================================================================
state_machines:
  - entity: Campaign
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /campaigns/{id}/open"
        actor: CampaignManager
        preconditions:
          - "campaign.status == DRAFT"
        side_effects: []
        note: "Only an OPEN campaign accepts gifts, pledges, and planned-gift realizations (§1.4 priority 7)."
      - from: OPEN
        to: CLOSED
        trigger: "POST /campaigns/{id}/close"
        actor: CampaignManager
        preconditions:
          - "campaign.status == OPEN"
        side_effects: []
        note: "Closing does not retroactively touch already-recorded gifts; it only blocks new attribution."

  - entity: Gift
    initial_state: RECORDED
    terminal_states: [REFUNDED]
    transitions:
      - from: RECORDED
        to: ACKNOWLEDGED
        trigger: "POST /gifts/{id}/acknowledge"
        actor: DonorRelations
        preconditions:
          - "gift.status == RECORDED"
          - "gift.donor.lifecycle_status != ARCHIVED"
        side_effects:
          - "create Acknowledgement(kind=ACKNOWLEDGEMENT, gift_id, donor_id copied from gift)"
          - "set gift.acknowledged_at = current clock"
          - "compute and pin gift.deductible_amount_cents = amount_cents - benefit_value_cents (§1.3 deductible_amount)"
          - "recompute donor.lifetime_hard_credit_cents (§1.3 donor_lifetime_hard_credit), then donor.giving_status (§1.3 donor_giving_tier), then donor.last_gift_at"
          - "if donor.lifecycle_status == LAPSED: this is handled separately by reactivation; acknowledgement alone does NOT change lifecycle_status"
          - "recompute campaign.raised_hard_cents and campaign.raised_with_match_cents (§1.3 campaign_raised)"
          - "if appeal_id present: recompute appeal.attributed_gift_count"
          - "if donor.household_id present: create SoftCredit rows per household.soft_credit_policy (§1.3 soft_credit_distribution); recompute household.total_soft_credit_cents"
          - "if pledge_id present: recompute pledge.paid_cents and pledge.balance_cents; allocate this gift to the earliest DUE installment by (due_on ASC, sequence_no ASC) marking it PAID with paid_by_gift_id; if balance_cents reaches 0 then pledge -> FULFILLED (§1.2 Pledge)"
        note: "Acknowledgement is the moment hard credit becomes real; the cascade fans out to donor, campaign, appeal, household and pledge."
      - from: ACKNOWLEDGED
        to: RECEIPTED
        trigger: "POST /gifts/{id}/receipt"
        actor: DonorRelations
        preconditions:
          - "gift.status == ACKNOWLEDGED"
          - "gift.deductible_amount_cents >= 1 (a zero-deductible gift cannot be tax-receipted)"
        side_effects:
          - "create Acknowledgement(kind=RECEIPT) with receipt_number assigned per §1.3 receipt_numbering"
        note: "Receipting does not change any ledger total; hard credit was already counted at ACKNOWLEDGED."
      - from: ACKNOWLEDGED
        to: REFUNDED
        trigger: "POST /gifts/{id}/refund"
        actor: GiftAdmin
        preconditions:
          - "gift.status IN {ACKNOWLEDGED, RECEIPTED}"
          - "no MatchClaim for this gift is in status PAID (a paid match must be reversed by the employer first)"
        side_effects:
          - "recompute donor.lifetime_hard_credit_cents (subtracts this gift), then donor.giving_status, then donor.last_gift_at"
          - "recompute campaign.raised_hard_cents and campaign.raised_with_match_cents"
          - "if appeal_id present: recompute appeal.attributed_gift_count"
          - "if donor.household_id present: set reversed=true on this gift's SoftCredit rows and recompute household.total_soft_credit_cents (compensating invariant household_soft_credit_conserved)"
          - "if pledge_id present: recompute pledge.paid_cents and pledge.balance_cents; for the PledgeInstallment whose paid_by_gift_id == this gift, set status DUE and clear paid_by_gift_id; if pledge was FULFILLED it reverts to ACTIVE (§1.2 Pledge)"
          - "if a MatchClaim for this gift is in status IN {SUBMITTED, APPROVED}: cascade it to DENIED (§1.2 MatchClaim)"
        note: "Refund is the compensating action for acknowledgement; every ledger total it touched must return to its pre-acknowledgement value."
      - from: RECEIPTED
        to: REFUNDED
        trigger: "POST /gifts/{id}/refund"
        actor: GiftAdmin
        preconditions:
          - "gift.status IN {ACKNOWLEDGED, RECEIPTED}"
          - "no MatchClaim for this gift is in status PAID"
        side_effects:
          - "same cascade as ACKNOWLEDGED -> REFUNDED above"

  - entity: Pledge
    initial_state: ACTIVE
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: DELINQUENT
        trigger: "POST /pledges/{id}/evaluate-delinquency (or cascade from _clock advance via POST /pledges/{id}/evaluate-delinquency)"
        actor: GiftAdmin
        preconditions:
          - "pledge.status == ACTIVE"
          - "installments_due_count >= 1 (at least one PledgeInstallment with due_on <= current clock AND status == DUE)"
        side_effects:
          - "recompute pledge.installments_due_count from PledgeInstallment rows"
        note: "Cyclic: a DELINQUENT pledge returns to ACTIVE once the overdue installments are paid (see DELINQUENT -> ACTIVE)."
      - from: DELINQUENT
        to: ACTIVE
        trigger: "system: gift acknowledgement allocates payment to all overdue installments"
        actor: system
        preconditions:
          - "pledge.status == DELINQUENT"
          - "after the triggering gift allocation, no PledgeInstallment with due_on <= current clock remains DUE"
        side_effects:
          - "recompute pledge.installments_due_count (now reflects 0 overdue)"
        note: "Revision loop ACTIVE -> DELINQUENT -> ACTIVE; the non-linear shape for Rule 3."
      - from: ACTIVE
        to: FULFILLED
        trigger: "system: gift acknowledgement drives balance_cents to 0"
        actor: system
        preconditions:
          - "pledge.status == ACTIVE"
          - "pledge.balance_cents == 0 after the triggering gift allocation"
        side_effects:
          - "mark any remaining DUE PledgeInstallment rows WAIVED"
      - from: DELINQUENT
        to: FULFILLED
        trigger: "system: gift acknowledgement drives balance_cents to 0"
        actor: system
        preconditions:
          - "pledge.status == DELINQUENT"
          - "pledge.balance_cents == 0 after the triggering gift allocation"
        side_effects:
          - "mark any remaining DUE PledgeInstallment rows WAIVED"
      - from: FULFILLED
        to: ACTIVE
        trigger: "system: refund of an allocated gift raises balance_cents above 0"
        actor: system
        preconditions:
          - "pledge.status == FULFILLED"
          - "pledge.balance_cents > 0 after the refund reverses an installment allocation"
        side_effects:
          - "recompute pledge.installments_due_count"
        note: "Cyclic revert: FULFILLED can return to ACTIVE when a satisfying gift is refunded."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /pledges/{id}/cancel"
        actor: GiftAdmin
        preconditions:
          - "pledge.status IN {ACTIVE, DELINQUENT}"
          - "expected_pledge_version matches pledge.version (OCC)"
        side_effects:
          - "mark all DUE PledgeInstallment rows WAIVED"
          - "increments Pledge.version by 1"
      - from: DELINQUENT
        to: CANCELLED
        trigger: "POST /pledges/{id}/cancel"
        actor: GiftAdmin
        preconditions:
          - "pledge.status IN {ACTIVE, DELINQUENT}"
          - "expected_pledge_version matches pledge.version (OCC)"
        side_effects:
          - "mark all DUE PledgeInstallment rows WAIVED"
          - "increments Pledge.version by 1"

  - entity: PledgeInstallment
    initial_state: DUE
    terminal_states: [PAID, WAIVED]
    transitions:
      - from: DUE
        to: PAID
        trigger: "system: gift acknowledgement allocates payment (earliest DUE by due_on ASC, sequence_no ASC)"
        actor: system
        preconditions:
          - "installment.status == DUE"
          - "the allocating gift's pledge_id == installment.pledge_id"
        side_effects:
          - "set installment.paid_by_gift_id = allocating gift id"
      - from: PAID
        to: DUE
        trigger: "system: refund of the allocating gift"
        actor: system
        preconditions:
          - "installment.status == PAID"
          - "installment.paid_by_gift_id == the refunded gift id"
        side_effects:
          - "clear installment.paid_by_gift_id"
      - from: DUE
        to: WAIVED
        trigger: "system: pledge FULFILLED or CANCELLED"
        actor: system
        preconditions:
          - "installment.status == DUE"
        side_effects: []

  - entity: MatchClaim
    initial_state: SUBMITTED
    terminal_states: [PAID, DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /match-claims/{id}/approve"
        actor: GiftAdmin
        preconditions:
          - "claim.status == SUBMITTED"
          - "claim's gift.status IN {ACKNOWLEDGED, RECEIPTED}"
        side_effects: []
        note: "Branching fork: from SUBMITTED a claim either APPROVED (toward PAID) or DENIED."
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /match-claims/{id}/deny"
        actor: GiftAdmin
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: "POST /match-claims/{id}/pay"
        actor: GiftAdmin
        preconditions:
          - "claim.status == APPROVED"
          - "claim's gift.status IN {ACKNOWLEDGED, RECEIPTED}"
        side_effects:
          - "pin claim.matched_amount_cents = requested_amount_cents clamped by employer.max_match_cents and the donor-employer annual-cap remaining (§1.3 match_amount)"
          - "recompute campaign.raised_with_match_cents for the gift's campaign (adds matched_amount_cents)"
        note: "Divergent branch side-effects vs DENIED: only PAID touches campaign.raised_with_match_cents."
      - from: APPROVED
        to: DENIED
        trigger: "POST /match-claims/{id}/deny"
        actor: GiftAdmin
        preconditions:
          - "claim.status == APPROVED"
        side_effects: []
      - from: SUBMITTED
        to: DENIED
        trigger: "system: the claim's gift is REFUNDED"
        actor: system
        preconditions:
          - "claim.status IN {SUBMITTED, APPROVED}"
        side_effects: []
        note: "Cascade entry: gift refund denies an unpaid claim."

  - entity: PlannedGift
    initial_state: INTENT
    terminal_states: [REALIZED, LAPSED]
    transitions:
      - from: INTENT
        to: CONFIRMED
        trigger: "POST /planned-gifts/{id}/confirm"
        actor: DonorRelations
        preconditions:
          - "planned_gift.status == INTENT"
        side_effects: []
      - from: CONFIRMED
        to: REALIZED
        trigger: "POST /planned-gifts/{id}/realize"
        actor: DonorRelations
        preconditions:
          - "planned_gift.status == CONFIRMED"
          - "the supplied realizing campaign is OPEN"
        side_effects:
          - "create a Gift(donor_id=planned_gift.donor_id, campaign_id=supplied, amount_cents=realized_amount_cents, payment_method=STOCK, status=RECORDED)"
          - "set planned_gift.realized_gift_id = the new gift id"
        note: "The realized Gift then flows through its own RECORDED -> ACKNOWLEDGED lifecycle separately."
      - from: INTENT
        to: LAPSED
        trigger: "POST /planned-gifts/{id}/lapse"
        actor: DonorRelations
        preconditions:
          - "planned_gift.status == INTENT"
        side_effects: []
      - from: CONFIRMED
        to: LAPSED
        trigger: "POST /planned-gifts/{id}/lapse"
        actor: DonorRelations
        preconditions:
          - "planned_gift.status == CONFIRMED"
        side_effects: []

  - entity: Donor
    initial_state: PROSPECT
    terminal_states: [ARCHIVED]
    note: "Parallel dimensions: lifecycle_status (this machine) evolves independently of giving_status (§1.3 donor_giving_tier, driven by lifetime_hard_credit_cents). The same Donor row carries both."
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "system: first gift acknowledgement sets last_gift_at"
        actor: system
        preconditions:
          - "donor.lifecycle_status == PROSPECT"
          - "a gift for this donor just moved to ACKNOWLEDGED"
        side_effects: []
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /donors/{id}/flag-lapsed"
        actor: DonorRelations
        preconditions:
          - "donor.lifecycle_status == ACTIVE"
          - "current clock - donor.last_gift_at >= donor.lapse_threshold_days days"
        side_effects: []
      - from: LAPSED
        to: REACTIVATED
        trigger: "POST /donors/{id}/reactivate"
        actor: DonorRelations
        preconditions:
          - "donor.lifecycle_status == LAPSED"
          - "a qualifying reactivation gift exists: a Gift for this donor in status IN {ACKNOWLEDGED, RECEIPTED} whose created_at is after donor.last_gift_at-at-time-of-lapse"
        side_effects:
          - "set donor.lifecycle_status = REACTIVATED"
      - from: REACTIVATED
        to: ACTIVE
        trigger: "POST /donors/{id}/flag-active"
        actor: DonorRelations
        preconditions:
          - "donor.lifecycle_status == REACTIVATED"
        side_effects: []
      - from: PROSPECT
        to: ARCHIVED
        trigger: "POST /donors/{id}/archive"
        actor: DonorRelations
        preconditions:
          - "donor.lifecycle_status IN {PROSPECT, LAPSED}"
          - "donor has no Pledge in status IN {ACTIVE, DELINQUENT}"
        side_effects: []
      - from: LAPSED
        to: ARCHIVED
        trigger: "POST /donors/{id}/archive"
        actor: DonorRelations
        preconditions:
          - "donor.lifecycle_status IN {PROSPECT, LAPSED}"
          - "donor has no Pledge in status IN {ACTIVE, DELINQUENT}"
        side_effects: []

concurrency_rules:
  - rule_id: pledge-cancel-stale-version
    parent_entity: Pledge
    write_endpoint: "POST /pledges/{id}/cancel"
    occ_field: "expected_pledge_version"
    description: |
      Cancelling a Pledge whose version has advanced since the client last
      observed it is rejected. A gift acknowledgement allocated to the pledge
      legitimately advances pledge.version (paid_cents / balance_cents /
      installment cascade); a cancel request still carrying the pre-allocation
      version is operating on a stale view and must be refused so the operator
      re-reads the now-partially-paid pledge before cancelling.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: gift-refund-stale-version
    parent_entity: Gift
    write_endpoint: "POST /gifts/{id}/refund"
    occ_field: "expected_gift_version"
    description: |
      Refunding a Gift whose version has advanced since the client last
      observed it is rejected. Moving the gift RECORDED -> ACKNOWLEDGED ->
      RECEIPTED advances gift.version each step; a refund request carrying the
      version the client saw at RECORDED time is operating on a stale view of a
      gift whose deductible amount and downstream ledger postings have since
      changed, and must be refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ===========================================================================
# §1.3 Calculation Rules Table
# ===========================================================================
calculations:
  - name: donor_lifetime_hard_credit
    trigger: "gift acknowledgement (RECORDED->ACKNOWLEDGED) and gift refund (->REFUNDED)"
    algorithm: aggregation
    formula: |
      donor.lifetime_hard_credit_cents =
        SUM(g.amount_cents
            for g in Gift
            where g.donor_id == donor.id
              and g.status IN {ACKNOWLEDGED, RECEIPTED})
    input_set: "Donor's own gifts in ACKNOWLEDGED or RECEIPTED only. RECORDED and REFUNDED gifts are excluded."
    constants: {}
    precision: "integer cents, exact"
    variants: []

  - name: soft_credit_distribution
    trigger: "gift acknowledgement when donor.household_id is set; reversal on refund"
    algorithm: waterfall_allocation
    formula: |
      members = [d for d in Donor where d.household_id == donor.household_id]   # includes the giving donor
      others  = [m for m in members if m.id != donor.id]
      policy = household.soft_credit_policy
      if policy == FULL_TO_ALL:
        # every OTHER member gets the full gift as soft credit; the giving donor
        # gets hard credit only (no SoftCredit row for self)
        for m in others: SoftCredit(beneficiary=m, soft_credit_cents = gift.amount_cents)
      elif policy == SPLIT_EVEN:
        # the full gift is split as evenly as possible across the OTHER members;
        # order members by created_at ASC; distribute floor(amount/n) to each,
        # then add the remaining (amount - n*floor) cents one-per-member to the
        # FIRST 'remainder' members in created_at ASC order
        n = len(others)
        base = amount_cents // n ; rem = amount_cents - base*n
        sorted_others = others sorted by created_at ASC
        for i,m in enumerate(sorted_others):
          SoftCredit(beneficiary=m, soft_credit_cents = base + (1 if i < rem else 0))
      elif policy == PRIMARY_ONLY:
        # only the household's primary_donor_id receives soft credit (full gift),
        # unless the giving donor IS the primary, in which case no SoftCredit rows
        if household.primary_donor_id is not null and household.primary_donor_id != donor.id:
          SoftCredit(beneficiary=primary, soft_credit_cents = gift.amount_cents)
      household.total_soft_credit_cents = SUM(sc.soft_credit_cents for sc in SoftCredit
                                              where sc.household_id == household.id and sc.reversed == false)
    input_set: "Members of the giving donor's household, excluding the giving donor as a beneficiary. Reversed rows excluded from the total."
    constants: {}
    precision: "integer cents, remainder distributed one-cent-per-member in created_at ASC order"
    variants:
      - name: full_to_all
        when: "household.soft_credit_policy == FULL_TO_ALL"
        difference: "each other member is credited the FULL gift amount; total_soft_credit grows by amount*(member_count-1)"
      - name: split_even
        when: "household.soft_credit_policy == SPLIT_EVEN"
        difference: "the gift is partitioned across other members; total_soft_credit grows by exactly amount (cents conserved across beneficiaries)"

  - name: match_amount
    trigger: "MatchClaim creation pins requested_amount_cents; APPROVED->PAID pins matched_amount_cents"
    algorithm: threshold
    formula: |
      # ---- at MatchClaim creation: requested_amount_cents ----
      emp = gift.donor.employer
      if gift.amount_cents < emp.min_gift_cents:
        REJECT creation with ERR_GIFT_INELIGIBLE_FOR_MATCH      # eligibility floor
      raw = floor(gift.amount_cents * emp.match_ratio)          # ratio applied first
      requested_amount_cents = min(raw, emp.max_match_cents)    # per-gift cap

      # ---- at APPROVED->PAID: matched_amount_cents (annual-cap clamp) ----
      year = year_of(gift.created_at)
      already_paid = SUM(mc.matched_amount_cents
                         for mc in MatchClaim
                         where mc.employer_id == emp.id
                           and mc.status == PAID
                           and year_of(mc.gift.created_at) == year
                           and mc.gift.donor_id == gift.donor_id)
      remaining = max(0, emp.annual_match_cap_cents - already_paid)
      matched_amount_cents = min(requested_amount_cents, remaining)
    input_set: "PAID MatchClaims for the same (donor, employer, calendar-year-of-gift) determine the consumed annual cap. SUBMITTED/APPROVED/DENIED claims do not consume the cap."
    constants: {}
    precision: "integer cents; ratio applied with floor BEFORE the per-gift and annual caps"
    variants:
      - name: per_gift_cap_only
        when: "annual cap not yet approached (remaining >= requested_amount_cents)"
        difference: "matched_amount_cents == requested_amount_cents == min(floor(amount*ratio), max_match_cents)"
      - name: annual_cap_binding
        when: "remaining < requested_amount_cents at pay time"
        difference: "matched_amount_cents == remaining; the same gift+ratio yields a smaller match than per_gift_cap_only because earlier PAID claims consumed the cap"

  - name: installment_schedule
    trigger: "pledge creation (cascade that mints PledgeInstallment rows)"
    algorithm: waterfall_allocation
    formula: |
      n = pledge.installment_count
      total = pledge.total_amount_cents
      base = total // n
      rem  = total - base*n                  # 0 <= rem < n cents to distribute
      if pledge.schedule_basis == FRONT_LOADED:
        # the first `rem` installments (sequence_no 1..rem) each carry one extra cent
        amount[seq] = base + (1 if seq <= rem else 0)        for seq in 1..n
      elif pledge.schedule_basis == BACK_LOADED:
        # the LAST `rem` installments (sequence_no n-rem+1..n) carry the extra cent
        amount[seq] = base + (1 if seq > n-rem else 0)       for seq in 1..n
      # due_on offsets from pledge.created_at by frequency:
      #   ONE_TIME -> all due at created_at (single installment expected; n must be 1)
      #   MONTHLY  -> created_at + (seq-1) months
      #   QUARTERLY-> created_at + (seq-1)*3 months
      #   ANNUAL   -> created_at + (seq-1) years
    input_set: "All n installments of one pledge; the sum of amount_cents across installments == total_amount_cents exactly (conserved)."
    constants: {}
    precision: "integer cents; the `rem` extra cents go to the front (FRONT_LOADED) or back (BACK_LOADED) installments"
    variants:
      - name: front_loaded
        when: "schedule_basis == FRONT_LOADED"
        difference: "extra remainder cents land on the EARLIEST installments; installment 1 may exceed installment n by one cent"
      - name: back_loaded
        when: "schedule_basis == BACK_LOADED"
        difference: "extra remainder cents land on the LATEST installments; installment n may exceed installment 1 by one cent — same total, different per-installment amounts"

  - name: campaign_raised
    trigger: "gift acknowledgement / refund (raised_hard_cents); match claim PAID and gift refund (raised_with_match_cents)"
    algorithm: aggregation
    formula: |
      campaign.raised_hard_cents =
        SUM(g.amount_cents for g in Gift
            where g.campaign_id == campaign.id
              and g.status IN {ACKNOWLEDGED, RECEIPTED})
      campaign.raised_with_match_cents =
        campaign.raised_hard_cents
        + SUM(mc.matched_amount_cents for mc in MatchClaim
              where mc.status == PAID
                and mc.gift.campaign_id == campaign.id)
    input_set: "raised_hard counts ACKNOWLEDGED/RECEIPTED gifts only; raised_with_match additionally counts PAID match dollars. The two diverge whenever any match is PAID."
    constants: {}
    precision: "integer cents, exact"
    variants:
      - name: hard_only
        when: "any read; this is the conservative recognized-revenue figure"
        difference: "counts only donor hard credit; ignores matched employer dollars"
      - name: with_match
        when: "any read; this is the with-match projection figure"
        difference: "adds PAID employer match dollars; for the SAME set of gifts this exceeds hard_only whenever a match has been paid"

  - name: deductible_amount
    trigger: "gift acknowledgement (RECORDED->ACKNOWLEDGED)"
    algorithm: threshold
    formula: |
      gift.deductible_amount_cents = max(0, gift.amount_cents - gift.benefit_value_cents)
    input_set: "single gift; benefit_value_cents is the fair-market value of any quid-pro-quo benefit."
    constants: {}
    precision: "integer cents, exact"
    variants: []

  - name: donor_giving_tier
    trigger: "gift acknowledgement / refund (recomputes lifetime_hard_credit then re-tiers)"
    algorithm: threshold
    formula: |
      L = donor.lifetime_hard_credit_cents
      if   L == 0:            giving_status = NONE
      elif L < 50000:         giving_status = ENTRY      # < $500
      elif L < 1000000:       giving_status = MID        # $500 .. < $10,000
      else:                   giving_status = MAJOR      # >= $10,000
    input_set: "single donor's recomputed lifetime_hard_credit_cents."
    constants:
      ENTRY_CEILING_CENTS: 50000
      MAJOR_FLOOR_CENTS: 1000000
    precision: "integer cents; boundary is strict (< MAJOR_FLOOR is MID, == MAJOR_FLOOR is MAJOR)"
    variants: []

  - name: receipt_numbering
    trigger: "gift receipt (ACKNOWLEDGED->RECEIPTED) creating Acknowledgement(kind=RECEIPT)"
    algorithm: aggregation
    formula: |
      # global monotonic sequence over all RECEIPT acknowledgements, ordered by
      # the order they are minted (created_at ASC, then for exact-tie created_at
      # the sequence already assigned earlier wins — i.e., assignment is the
      # running count + 1 at mint time)
      next_n = 1 + COUNT(a for a in Acknowledgement where a.kind == RECEIPT)
      receipt_number = format("RCPT-" + zero_pad(next_n, 6))     # e.g. RCPT-000001
    input_set: "all prior RECEIPT acknowledgements; ACKNOWLEDGEMENT-kind rows do not consume numbers."
    constants:
      PREFIX: "RCPT-"
      PAD_WIDTH: 6
    precision: "integer sequence, zero-padded width 6"
    variants: []

# ===========================================================================
# §1.4 Validation Rules Table (ordered by priority)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the X-User-Role is permitted to perform this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every path id and FK referenced in the body exists (validated left-to-right: path ids first, then body FKs in declaration order)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"
  - priority: 4
    category: state
    check: "target resource is in a valid state for the requested transition (gift.status, pledge.status, claim.status, planned_gift.status, donor.lifecycle_status as the machine requires)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (/acknowledge,/receipt,/refund,/cancel,/approve,/deny,/pay,/confirm,/realize,/lapse,/flag-lapsed,/reactivate,/flag-active,/archive,/evaluate-delinquency)"
  - priority: 5
    category: business_referential
    check: "appeal_id's campaign_id must equal the gift's campaign_id"
    error_id: ERR_APPEAL_CAMPAIGN_MISMATCH
    http_status: 422
    applies_to: "POST /gifts"
  - priority: 6
    category: business_referential
    check: "pledge_id's donor_id must equal the gift's donor_id AND pledge_id's campaign_id must equal the gift's campaign_id"
    error_id: ERR_PLEDGE_ATTRIBUTION_MISMATCH
    http_status: 422
    applies_to: "POST /gifts"
  - priority: 7
    category: business_temporal
    check: "gift's campaign must be OPEN (not DRAFT, not CLOSED); pledge's campaign must be OPEN at pledge creation"
    error_id: ERR_CAMPAIGN_NOT_OPEN
    http_status: 409
    applies_to: "POST /gifts, POST /pledges, POST /planned-gifts/{id}/realize"
  - priority: 8
    category: business_constraint
    check: "donor.email is unique case-insensitive across Donor"
    error_id: ERR_DUPLICATE_EMAIL
    http_status: 409
    applies_to: "POST /donors"
  - priority: 9
    category: business_constraint
    check: "appeal.code is unique (case-insensitive) within its campaign_id"
    error_id: ERR_DUPLICATE_APPEAL_CODE
    http_status: 409
    applies_to: "POST /appeals"
  - priority: 10
    category: business_constraint
    check: "benefit_value_cents <= amount_cents on a gift"
    error_id: ERR_BENEFIT_EXCEEDS_GIFT
    http_status: 422
    applies_to: "POST /gifts"
  - priority: 11
    category: business_safety
    check: "a gift may not be refunded while it has a MatchClaim in status PAID"
    error_id: ERR_MATCH_PAID_BLOCKS_REFUND
    http_status: 409
    applies_to: "POST /gifts/{id}/refund"
  - priority: 12
    category: business_constraint
    check: "match claim's gift donor must have employer_id set, and gift.amount_cents >= employer.min_gift_cents"
    error_id: ERR_GIFT_INELIGIBLE_FOR_MATCH
    http_status: 422
    applies_to: "POST /match-claims"
  - priority: 13
    category: business_constraint
    check: "a gift may not be tax-receipted when deductible_amount_cents == 0"
    error_id: ERR_ZERO_DEDUCTIBLE
    http_status: 422
    applies_to: "POST /gifts/{id}/receipt"
  - priority: 14
    category: business_temporal
    check: "flag-lapsed requires current clock - last_gift_at >= lapse_threshold_days; reactivate requires a qualifying post-lapse gift"
    error_id: ERR_LAPSE_WINDOW_NOT_MET
    http_status: 409
    applies_to: "POST /donors/{id}/flag-lapsed"
  - priority: 15
    category: business_constraint
    check: "donor archive requires no Pledge in status IN {ACTIVE, DELINQUENT}"
    error_id: ERR_DONOR_HAS_ACTIVE_PLEDGE
    http_status: 409
    applies_to: "POST /donors/{id}/archive"
  - priority: 16
    category: business_constraint
    check: "reactivation requires a qualifying reactivation gift (ACKNOWLEDGED/RECEIPTED gift created after the lapse)"
    error_id: ERR_NO_REACTIVATION_GIFT
    http_status: 409
    applies_to: "POST /donors/{id}/reactivate"
  - priority: 17
    category: business_constraint
    check: "primary_donor_id, when set, must reference a Donor whose household_id == this Household.id"
    error_id: ERR_PRIMARY_NOT_MEMBER
    http_status: 422
    applies_to: "PATCH /households/{id}"
  - priority: 18
    category: business_constraint
    check: "installment_count must be 1 when frequency == ONE_TIME"
    error_id: ERR_INSTALLMENT_FREQUENCY_MISMATCH
    http_status: 422
    applies_to: "POST /pledges"
  - priority: 19
    category: business_constraint
    check: "request body field types and ranges (enum membership, integer >=1 amounts, ratio bounds, segment array subset)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PATCH with a body"
  - priority: 20
    category: state
    check: "OCC: expected_<parent>_version on cancel/refund must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /pledges/{id}/cancel, POST /gifts/{id}/refund"
  - priority: 21
    category: business_constraint
    check: "pagination limit within [1,100], offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

# ===========================================================================
# §1.5 API Endpoint Table
# ===========================================================================
endpoints:
  # ---- Household ----
  - method: POST
    path: "/households"
    description: "Create a household."
    roles: [CampaignManager]
    code: 201
    input: [name, "soft_credit_policy?", "primary_donor_id?"]
    output: Household
    side_effects: ["member_count and total_soft_credit_cents initialized to 0"]
  - method: GET
    path: "/households/{id}"
    description: "Fetch a household with computed soft-credit total and member count."
    roles: [CampaignManager, GiftAdmin, DonorRelations]
    code: 200
    input: []
    output: Household
    side_effects: ["recompute member_count and total_soft_credit_cents on read"]
  - method: GET
    path: "/households"
    description: "List households; filter by primary_donor_id (FK reverse-reachability for Household.primary_donor_id)."
    roles: [CampaignManager, GiftAdmin, DonorRelations]
    code: 200
    input: ["primary_donor_id?", "limit?", "offset?"]
    output: Household[]
    side_effects: []
  - method: PATCH
    path: "/households/{id}"
    description: "Update household name, soft_credit_policy, or primary_donor_id."
    roles: [CampaignManager]
    code: 200
    input: ["name?", "soft_credit_policy?", "primary_donor_id?"]
    output: Household
    side_effects: ["validates primary_donor_id is a member (ERR_PRIMARY_NOT_MEMBER); increments Household.version"]
  - method: GET
    path: "/households/{id}/soft-credits"
    description: "List SoftCredit rows for this household (FK reverse-reachability for SoftCredit.household_id)."
    roles: [CampaignManager, GiftAdmin, DonorRelations]
    code: 200
    input: ["limit?", "offset?"]
    output: SoftCredit[]
    side_effects: []

  # ---- Donor ----
  - method: POST
    path: "/donors"
    description: "Create a donor."
    roles: [CampaignManager, GiftAdmin]
    code: 201
    input: [full_name, email, "household_id?", "employer_id?", "lapse_threshold_days?"]
    output: Donor
    side_effects: ["lifecycle_status=PROSPECT, giving_status=NONE; if household_id set, household.member_count recomputed"]
  - method: GET
    path: "/donors/{id}"
    description: "Fetch a donor with computed lifetime credit, giving tier, and lapse fields."
    roles: [CampaignManager, GiftAdmin, DonorRelations]
    code: 200
    input: []
    output: Donor
    side_effects: []
  - method: GET
    path: "/donors"
    description: "List donors; filterable by household_id, employer_id, lifecycle_status, giving_status. Serves FK reverse-reachability for Donor.household_id and Donor.employer_id."
    roles: [CampaignManager, GiftAdmin, DonorRelations]
    code: 200
    input: ["household_id?", "employer_id?", "lifecycle_status?", "giving_status?", "limit?", "offset?"]
    output: Donor[]
    side_effects: []
  - method: POST
    path: "/donors/{id}/flag-lapsed"
    description: "Flag an ACTIVE donor LAPSED once the inactivity window is met."
    roles: [DonorRelations]
    code: 200
    input: []
    output: Donor
    side_effects: ["lifecycle_status ACTIVE->LAPSED (§1.2 Donor)"]
  - method: POST
    path: "/donors/{id}/reactivate"
    description: "Move a LAPSED donor to REACTIVATED given a qualifying post-lapse gift."
    roles: [DonorRelations]
    code: 200
    input: []
    output: Donor
    side_effects: ["lifecycle_status LAPSED->REACTIVATED"]
  - method: POST
    path: "/donors/{id}/flag-active"
    description: "Promote a REACTIVATED donor back to ACTIVE."
    roles: [DonorRelations]
    code: 200
    input: []
    output: Donor
    side_effects: ["lifecycle_status REACTIVATED->ACTIVE"]
  - method: POST
    path: "/donors/{id}/archive"
    description: "Archive a PROSPECT or LAPSED donor with no active pledge."
    roles: [DonorRelations]
    code: 200
    input: []
    output: Donor
    side_effects: ["lifecycle_status ->ARCHIVED"]

  # ---- Employer ----
  - method: POST
    path: "/employers"
    description: "Create a matching-gift employer."
    roles: [CampaignManager]
    code: 201
    input: [name, "match_ratio?", "min_gift_cents?", "max_match_cents?", "annual_match_cap_cents?"]
    output: Employer
    side_effects: []
  - method: GET
    path: "/employers/{id}"
    description: "Fetch an employer."
    roles: [CampaignManager, GiftAdmin, DonorRelations]
    code: 200
    input: []
    output: Employer
    side_effects: []

  # ---- Campaign / Appeal ----
  - method: POST
    path: "/campaigns"
    description: "Create a campaign (starts DRAFT)."
    roles: [CampaignManager]
    code: 201
    input: [name, goal_cents, starts_on, ends_on]
    output: Campaign
    side_effects: ["status=DRAFT, raised_hard_cents=0, raised_with_match_cents=0"]
  - method: GET
    path: "/campaigns/{id}"
    description: "Fetch a campaign with both raised variants."
    roles: [CampaignManager, GiftAdmin, DonorRelations]
    code: 200
    input: []
    output: Campaign
    side_effects: ["recompute raised_hard_cents and raised_with_match_cents on read"]
  - method: POST
    path: "/campaigns/{id}/open"
    description: "Open a DRAFT campaign for gifts and pledges."
    roles: [CampaignManager]
    code: 200
    input: []
    output: Campaign
    side_effects: ["status DRAFT->OPEN"]
  - method: POST
    path: "/campaigns/{id}/close"
    description: "Close an OPEN campaign."
    roles: [CampaignManager]
    code: 200
    input: []
    output: Campaign
    side_effects: ["status OPEN->CLOSED"]
  - method: POST
    path: "/appeals"
    description: "Create an appeal under a campaign."
    roles: [CampaignManager]
    code: 201
    input: [campaign_id, channel, code, "expected_response_rate?"]
    output: Appeal
    side_effects: ["validates code unique within campaign (ERR_DUPLICATE_APPEAL_CODE)"]
  - method: GET
    path: "/appeals/{id}"
    description: "Fetch a single appeal."
    roles: [CampaignManager, GiftAdmin, DonorRelations]
    code: 200
    input: []
    output: Appeal
    side_effects: ["recompute attributed_gift_count on read"]
  - method: GET
    path: "/appeals"
    description: "List appeals; filter by campaign_id (FK reverse-reachability for Appeal.campaign_id)."
    roles: [CampaignManager, GiftAdmin, DonorRelations]
    code: 200
    input: ["campaign_id?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []

  # ---- Pledge / Installment ----
  - method: POST
    path: "/pledges"
    description: "Create a pledge; cascades the installment schedule."
    roles: [GiftAdmin]
    code: 201
    input: [donor_id, campaign_id, total_amount_cents, installment_count, frequency, "schedule_basis?"]
    output: Pledge
    side_effects: ["mint installment_count PledgeInstallment rows per §1.3 installment_schedule; status=ACTIVE; balance_cents=total_amount_cents"]
  - method: GET
    path: "/pledges/{id}"
    description: "Fetch a pledge with paid/balance and overdue counts."
    roles: [CampaignManager, GiftAdmin, DonorRelations]
    code: 200
    input: []
    output: Pledge
    side_effects: ["recompute paid_cents, balance_cents, installments_due_count on read"]
  - method: GET
    path: "/pledges"
    description: "List pledges; filter by donor_id or campaign_id (FK reverse-reachability for Pledge.donor_id and Pledge.campaign_id)."
    roles: [CampaignManager, GiftAdmin, DonorRelations]
    code: 200
    input: ["donor_id?", "campaign_id?", "limit?", "offset?"]
    output: Pledge[]
    side_effects: []
  - method: GET
    path: "/pledges/{id}/installments"
    description: "List the installments of a pledge (FK reverse-reachability for PledgeInstallment.pledge_id)."
    roles: [CampaignManager, GiftAdmin, DonorRelations]
    code: 200
    input: ["limit?", "offset?"]
    output: PledgeInstallment[]
    side_effects: []
  - method: GET
    path: "/pledge-installments/{id}"
    description: "Fetch a single pledge installment."
    roles: [CampaignManager, GiftAdmin, DonorRelations]
    code: 200
    input: []
    output: PledgeInstallment
    side_effects: []
  - method: GET
    path: "/pledge-installments"
    description: "List pledge installments; filter by pledge_id or paid_by_gift_id (FK reverse-reachability for PledgeInstallment.paid_by_gift_id)."
    roles: [CampaignManager, GiftAdmin, DonorRelations]
    code: 200
    input: ["pledge_id?", "paid_by_gift_id?", "limit?", "offset?"]
    output: PledgeInstallment[]
    side_effects: []
  - method: POST
    path: "/pledges/{id}/evaluate-delinquency"
    description: "Re-evaluate a pledge against the current clock; ACTIVE->DELINQUENT if overdue installments exist."
    roles: [GiftAdmin]
    code: 200
    input: []
    output: Pledge
    side_effects: ["recompute installments_due_count; ACTIVE->DELINQUENT when >=1 overdue (§1.2 Pledge)"]
  - method: POST
    path: "/pledges/{id}/cancel"
    description: "Cancel a pledge; OCC-guarded on pledge.version."
    roles: [GiftAdmin]
    code: 200
    input: [expected_pledge_version]
    output: Pledge
    side_effects: ["status ->CANCELLED; mark DUE installments WAIVED; increments Pledge.version by 1"]

  # ---- Gift ----
  - method: POST
    path: "/gifts"
    description: "Record a gift (starts RECORDED)."
    roles: [GiftAdmin]
    code: 201
    input: [donor_id, campaign_id, amount_cents, "appeal_id?", "pledge_id?", "payment_method?", "benefit_value_cents?"]
    output: Gift
    side_effects: ["status=RECORDED; no ledger postings yet (postings happen at acknowledge)"]
  - method: GET
    path: "/gifts/{id}"
    description: "Fetch a gift with computed deductible amount and status."
    roles: [CampaignManager, GiftAdmin, DonorRelations]
    code: 200
    input: []
    output: Gift
    side_effects: []
  - method: GET
    path: "/gifts"
    description: "List gifts; filter by donor_id, campaign_id, appeal_id, pledge_id, status. Serves FK reverse-reachability for Gift.donor_id, Gift.campaign_id, Gift.appeal_id, Gift.pledge_id."
    roles: [CampaignManager, GiftAdmin, DonorRelations]
    code: 200
    input: ["donor_id?", "campaign_id?", "appeal_id?", "pledge_id?", "status?", "limit?", "offset?"]
    output: Gift[]
    side_effects: []
  - method: POST
    path: "/gifts/{id}/acknowledge"
    description: "Acknowledge a RECORDED gift; fans out the full ledger cascade."
    roles: [DonorRelations]
    code: 200
    input: []
    output: Gift
    side_effects: ["status RECORDED->ACKNOWLEDGED; create Acknowledgement; pin deductible_amount_cents; cascade donor/campaign/appeal/household/pledge per §1.2 Gift; increments Gift.version"]
  - method: POST
    path: "/gifts/{id}/receipt"
    description: "Issue a tax receipt for an ACKNOWLEDGED gift with positive deductible."
    roles: [DonorRelations]
    code: 200
    input: []
    output: Gift
    side_effects: ["status ACKNOWLEDGED->RECEIPTED; create Acknowledgement(kind=RECEIPT) with receipt_number; increments Gift.version"]
  - method: POST
    path: "/gifts/{id}/refund"
    description: "Refund an ACKNOWLEDGED/RECEIPTED gift; reverses all ledger postings. OCC-guarded on gift.version."
    roles: [GiftAdmin]
    code: 200
    input: [expected_gift_version]
    output: Gift
    side_effects: ["status ->REFUNDED; reverse donor/campaign/appeal/household/pledge postings; deny unpaid MatchClaim; increments Gift.version"]
  - method: GET
    path: "/gifts/{id}/acknowledgements"
    description: "List Acknowledgement rows for a gift (FK reverse-reachability for Acknowledgement.gift_id)."
    roles: [CampaignManager, GiftAdmin, DonorRelations]
    code: 200
    input: ["limit?", "offset?"]
    output: Acknowledgement[]
    side_effects: []
  - method: GET
    path: "/gifts/{id}/soft-credits"
    description: "List SoftCredit rows generated by a gift (FK reverse-reachability for SoftCredit.gift_id)."
    roles: [CampaignManager, GiftAdmin, DonorRelations]
    code: 200
    input: ["limit?", "offset?"]
    output: SoftCredit[]
    side_effects: []
  - method: GET
    path: "/soft-credits/{id}"
    description: "Fetch a single soft-credit row."
    roles: [CampaignManager, GiftAdmin, DonorRelations]
    code: 200
    input: []
    output: SoftCredit
    side_effects: []
  - method: GET
    path: "/soft-credits"
    description: "List soft-credit rows; filter by beneficiary_donor_id, household_id, or gift_id (FK reverse-reachability for SoftCredit.beneficiary_donor_id)."
    roles: [CampaignManager, GiftAdmin, DonorRelations]
    code: 200
    input: ["beneficiary_donor_id?", "household_id?", "gift_id?", "limit?", "offset?"]
    output: SoftCredit[]
    side_effects: []

  # ---- Match claims ----
  - method: POST
    path: "/match-claims"
    description: "Open a matching-gift claim against an acknowledged gift."
    roles: [GiftAdmin]
    code: 201
    input: [gift_id]
    output: MatchClaim
    side_effects: ["copy employer_id from gift.donor.employer_id; pin requested_amount_cents per §1.3 match_amount; status=SUBMITTED"]
  - method: GET
    path: "/match-claims/{id}"
    description: "Fetch a match claim."
    roles: [CampaignManager, GiftAdmin, DonorRelations]
    code: 200
    input: []
    output: MatchClaim
    side_effects: []
  - method: GET
    path: "/match-claims"
    description: "List match claims; filter by gift_id or employer_id (FK reverse-reachability for MatchClaim.gift_id and MatchClaim.employer_id)."
    roles: [CampaignManager, GiftAdmin, DonorRelations]
    code: 200
    input: ["gift_id?", "employer_id?", "status?", "limit?", "offset?"]
    output: MatchClaim[]
    side_effects: []
  - method: POST
    path: "/match-claims/{id}/approve"
    description: "Approve a SUBMITTED claim."
    roles: [GiftAdmin]
    code: 200
    input: []
    output: MatchClaim
    side_effects: ["status SUBMITTED->APPROVED"]
  - method: POST
    path: "/match-claims/{id}/deny"
    description: "Deny a SUBMITTED or APPROVED claim."
    roles: [GiftAdmin]
    code: 200
    input: []
    output: MatchClaim
    side_effects: ["status ->DENIED"]
  - method: POST
    path: "/match-claims/{id}/pay"
    description: "Pay an APPROVED claim; pins matched_amount_cents under the annual cap and updates campaign with-match total."
    roles: [GiftAdmin]
    code: 200
    input: []
    output: MatchClaim
    side_effects: ["status APPROVED->PAID; pin matched_amount_cents (§1.3 match_amount annual clamp); recompute campaign.raised_with_match_cents"]

  # ---- Planned giving ----
  - method: POST
    path: "/planned-gifts"
    description: "Record a planned-giving intent."
    roles: [DonorRelations]
    code: 201
    input: [donor_id, vehicle, expected_amount_cents]
    output: PlannedGift
    side_effects: ["status=INTENT"]
  - method: GET
    path: "/planned-gifts/{id}"
    description: "Fetch a planned gift."
    roles: [CampaignManager, GiftAdmin, DonorRelations]
    code: 200
    input: []
    output: PlannedGift
    side_effects: []
  - method: GET
    path: "/planned-gifts"
    description: "List planned gifts; filter by donor_id (FK reverse-reachability for PlannedGift.donor_id and PlannedGift.realized_gift_id)."
    roles: [CampaignManager, GiftAdmin, DonorRelations]
    code: 200
    input: ["donor_id?", "realized_gift_id?", "status?", "limit?", "offset?"]
    output: PlannedGift[]
    side_effects: []
  - method: POST
    path: "/planned-gifts/{id}/confirm"
    description: "Confirm an INTENT planned gift."
    roles: [DonorRelations]
    code: 200
    input: []
    output: PlannedGift
    side_effects: ["status INTENT->CONFIRMED"]
  - method: POST
    path: "/planned-gifts/{id}/realize"
    description: "Realize a CONFIRMED planned gift, minting a Gift into an OPEN campaign."
    roles: [DonorRelations]
    code: 200
    input: [campaign_id, realized_amount_cents]
    output: PlannedGift
    side_effects: ["status CONFIRMED->REALIZED; create Gift(payment_method=STOCK, status=RECORDED); set realized_gift_id"]
  - method: POST
    path: "/planned-gifts/{id}/lapse"
    description: "Mark an INTENT or CONFIRMED planned gift LAPSED."
    roles: [DonorRelations]
    code: 200
    input: []
    output: PlannedGift
    side_effects: ["status ->LAPSED"]

  # ---- Acknowledgements (read) ----
  - method: GET
    path: "/acknowledgements/{id}"
    description: "Fetch a single acknowledgement/receipt."
    roles: [CampaignManager, GiftAdmin, DonorRelations]
    code: 200
    input: []
    output: Acknowledgement
    side_effects: []
  - method: GET
    path: "/acknowledgements"
    description: "List acknowledgements; filter by donor_id (FK reverse-reachability for Acknowledgement.donor_id)."
    roles: [CampaignManager, GiftAdmin, DonorRelations]
    code: 200
    input: ["donor_id?", "kind?", "limit?", "offset?"]
    output: Acknowledgement[]
    side_effects: []

  # ---- Segmentation ----
  - method: POST
    path: "/segments"
    description: "Create a donor segment definition."
    roles: [CampaignManager]
    code: 201
    input: [name, "min_lifetime_cents?", "giving_status_in?", "lifecycle_status_in?"]
    output: Segment
    side_effects: []
  - method: GET
    path: "/segments/{id}"
    description: "Fetch a segment definition."
    roles: [CampaignManager, GiftAdmin, DonorRelations]
    code: 200
    input: []
    output: Segment
    side_effects: ["recompute member_count on read"]
  - method: GET
    path: "/segments/{id}/members"
    description: "Evaluate the segment predicate against current donors and return matching donors."
    roles: [CampaignManager, GiftAdmin, DonorRelations]
    code: 200
    input: ["limit?", "offset?"]
    output: Donor[]
    side_effects: ["recompute Segment.member_count"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock (test-driving endpoint for time-gated flows: pledge due dates, lapse windows)."
    roles: [GiftAdmin, CampaignManager, DonorRelations]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["all subsequent time comparisons use this clock value"]

# ===========================================================================
# §1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for this operation per §1.7"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a path id or referenced FK does not resolve to an existing entity"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource not in a valid state for the requested transition"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version (OCC)"
  - id: ERR_APPEAL_CAMPAIGN_MISMATCH
    http: 422
    condition: "gift.appeal_id belongs to a campaign other than gift.campaign_id"
  - id: ERR_PLEDGE_ATTRIBUTION_MISMATCH
    http: 422
    condition: "gift.pledge_id's donor_id or campaign_id does not match the gift's"
  - id: ERR_CAMPAIGN_NOT_OPEN
    http: 409
    condition: "the referenced campaign is DRAFT or CLOSED when an OPEN campaign is required"
  - id: ERR_DUPLICATE_EMAIL
    http: 409
    condition: "donor email already exists (case-insensitive)"
  - id: ERR_DUPLICATE_APPEAL_CODE
    http: 409
    condition: "appeal code already exists within the campaign (case-insensitive)"
  - id: ERR_BENEFIT_EXCEEDS_GIFT
    http: 422
    condition: "benefit_value_cents > amount_cents on a gift"
  - id: ERR_MATCH_PAID_BLOCKS_REFUND
    http: 409
    condition: "attempted refund of a gift that has a PAID MatchClaim"
  - id: ERR_GIFT_INELIGIBLE_FOR_MATCH
    http: 422
    condition: "match-claim gift's donor lacks employer_id, or gift.amount_cents < employer.min_gift_cents"
  - id: ERR_ZERO_DEDUCTIBLE
    http: 422
    condition: "attempt to tax-receipt a gift whose deductible_amount_cents == 0"
  - id: ERR_LAPSE_WINDOW_NOT_MET
    http: 409
    condition: "flag-lapsed before current clock - last_gift_at >= lapse_threshold_days"
  - id: ERR_DONOR_HAS_ACTIVE_PLEDGE
    http: 409
    condition: "archive attempted while donor has a Pledge in status IN {ACTIVE, DELINQUENT}"
  - id: ERR_NO_REACTIVATION_GIFT
    http: 409
    condition: "reactivate attempted without a qualifying post-lapse ACKNOWLEDGED/RECEIPTED gift"
  - id: ERR_PRIMARY_NOT_MEMBER
    http: 422
    condition: "primary_donor_id is not a member of the household"
  - id: ERR_INSTALLMENT_FREQUENCY_MISMATCH
    http: 422
    condition: "installment_count != 1 while frequency == ONE_TIME"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body: bad enum, out-of-range number, missing required field, wrong type"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1,100] or offset < 0"

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: GiftAdmin
    description: "Owns gift, pledge, and match-claim entry plus refunds and delinquency evaluation."
    identity: "opaque"
    exclusive_operations:
      - "POST /gifts"
      - "POST /gifts/{id}/refund"
      - "POST /pledges"
      - "POST /pledges/{id}/cancel"
      - "POST /pledges/{id}/evaluate-delinquency"
      - "POST /match-claims"
      - "POST /match-claims/{id}/approve"
      - "POST /match-claims/{id}/deny"
      - "POST /match-claims/{id}/pay"
    shared_operations:
      - "POST /donors"
      - "all GET reads"
      - "POST /_clock/set_current_utc"
  - name: CampaignManager
    description: "Owns campaigns, appeals, households, employers, and segmentation."
    identity: "opaque"
    exclusive_operations:
      - "POST /campaigns"
      - "POST /campaigns/{id}/open"
      - "POST /campaigns/{id}/close"
      - "POST /appeals"
      - "POST /households"
      - "PATCH /households/{id}"
      - "POST /employers"
      - "POST /segments"
    shared_operations:
      - "POST /donors"
      - "all GET reads"
      - "POST /_clock/set_current_utc"
  - name: DonorRelations
    description: "Owns acknowledgements/receipts, planned giving, and donor lifecycle (lapse/reactivate/archive)."
    identity: "opaque"
    exclusive_operations:
      - "POST /gifts/{id}/acknowledge"
      - "POST /gifts/{id}/receipt"
      - "POST /donors/{id}/flag-lapsed"
      - "POST /donors/{id}/reactivate"
      - "POST /donors/{id}/flag-active"
      - "POST /donors/{id}/archive"
      - "POST /planned-gifts"
      - "POST /planned-gifts/{id}/confirm"
      - "POST /planned-gifts/{id}/realize"
      - "POST /planned-gifts/{id}/lapse"
    shared_operations:
      - "all GET reads"
      - "POST /_clock/set_current_utc"
