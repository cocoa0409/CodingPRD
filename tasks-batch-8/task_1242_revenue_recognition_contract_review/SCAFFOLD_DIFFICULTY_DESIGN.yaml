              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/customers"
              payload: { legal_name: "Inv Co", external_ref: "INV-1" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { cust_id: $.data.id }
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${cust_id}", contract_ref: "C-INV", signed_date: "2026-05-20", fixed_consideration_cents: 1000000, risk_tier: "STANDARD" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_id: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/pobs"
              payload: { pob_ref: "PA", product_code: "QA", region: "US", recognition_pattern: "POINT_IN_TIME" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { pob_a: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/pobs"
              payload: { pob_ref: "PB", product_code: "QB", region: "US", recognition_pattern: "POINT_IN_TIME" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { pob_b: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/submit"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
            - call: "POST /revrec/contracts/${c_id}/approve"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
              captures: { total_before: $.data.allocated_total_cents }
            - call: "POST /revrec/contracts/${c_id}/activate"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "GET /revrec/contracts/${c_id}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_v: $.data.version }
          trigger:
            - call: "POST /revrec/contracts/${c_id}/modifications"
              payload: { mod_type: "CUMULATIVE_CATCH_UP", delta_fixed_consideration_cents: 250000, effective_date: "2026-06-15", expected_contract_version: "${c_v}" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { mod_id: $.data.id }
            - call: "POST /revrec/modifications/${mod_id}/approve"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "GET /revrec/pobs/${pob_a}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { a_after: $.data.allocated_amount_cents }
            - call: "GET /revrec/pobs/${pob_b}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { b_after: $.data.allocated_amount_cents }
