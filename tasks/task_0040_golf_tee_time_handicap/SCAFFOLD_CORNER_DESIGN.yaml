              captures: { bk_a: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${ga}", expected_tee_time_version: "${v1}" }
              as: Golfer
              as_user_id: "${ga}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_BOOKING"

      - name: slot_full_no_standby_opt_in_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=11]", "errors[ERR_SLOT_FULL_NO_STANDBY]"]
        distinguishing_aspect: "Booking a FULL TWOSOME slot without join_standby:true -> 409 ERR_SLOT_FULL_NO_STANDBY."
        test_recipe:
          setup: ["TWOSOME slot filled by GA+GB (FULL). GC tries to book without join_standby. Clock 2026-06-01T00:00:00Z."]
          setup_api_calls:
