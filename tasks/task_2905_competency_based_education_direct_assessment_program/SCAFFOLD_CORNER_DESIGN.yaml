          - validations.priority_34_ERR_MENTOR_CADENCE_OVERDUE
          - endpoints.GET_mentor_assignments_id
        distinguishing_aspect: "Known inputs give one arithmetic answer: assigned_at_utc 2026-09-01 with cadence_days 7 puts next_contact_due_utc at 2026-09-08, and at logical_now 2026-09-20 overdue_days is floor((09-20 - 09-08)/86400) = 12 with cadence_status OVERDUE. Because 12 >= Program.cadence_gate_overdue_days (7) the same figure gates POST /assessment-attempts with ERR_MENTOR_CADENCE_OVERDUE, proving the read and the gate share one computation."
        test_recipe:
          setup:
            - "the base chain with a blueprint on IT-101, an ACTIVE term and an ACTIVE mentor assignment created at 2026-09-01 with cadence_days 7 and no contact ever recorded"
            - "the logical clock advanced to 2026-09-20T00:00:00.000Z"
