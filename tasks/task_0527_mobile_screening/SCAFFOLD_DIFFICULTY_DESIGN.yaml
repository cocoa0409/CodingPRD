            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "BLOOD_PANEL", site_label: "L1", event_date: "2026-06-11", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { event_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /screening-events/${event_id}/publish", payload: { expected_event_version: "${ev_v}" }, as: ProgramManager }
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${pf}", slot_start_min: 540, slot_duration_min: 30 }, as: ProgramManager }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "BLOOD_PANEL", site_label: "L2", event_date: "2026-06-01", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { e0: $.data.id, e0v: $.data.version } }
            - { call: "POST /screening-events/${e0}/publish", payload: { expected_event_version: "${e0v}" }, as: ProgramManager }
            - { call: "POST /appointments", payload: { event_id: "${e0}", participant_id: "${pb}", slot_start_min: 540, slot_duration_min: 30 }, as: ProgramManager, captures: { ab: $.data.id } }
            - { call: "POST /screening-events/${e0}/close", payload: {}, as: ProgramManager }
            - { call: "POST /appointments/${ab}/mark-no-show", payload: {}, as: ProgramManager }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "BLOOD_PANEL", site_label: "L3", event_date: "2026-06-02", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { e1: $.data.id, e1v: $.data.version } }
            - { call: "POST /screening-events/${e1}/publish", payload: { expected_event_version: "${e1v}" }, as: ProgramManager }
