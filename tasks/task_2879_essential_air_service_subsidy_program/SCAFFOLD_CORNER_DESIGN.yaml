  - section: complexity_layers
    instances:
      - name: preference_filing_rejects_a_stale_solicitation_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.preference-filing-stale-solicitation
          - errors.ERR_STALE_VERSION
          - endpoints.POST_/eas/solicitations/{id}/preferences
        distinguishing_aspect: "The guarded parent is the Solicitation and its version is bumped by the filing itself, so the second filing from a client that never re-read is refused with 412 even though the payload is perfectly valid — and the refusal leaves preference_filing_count untouched, unlike a silent overwrite."
        test_recipe:
          setup:
