            - "ServicerAccount.${acct_s_id}.credit_used_cents == 31197"

      - name: error_credit_limit_exceeded_on_line_add
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        excluded_because:
          difficulty_instance: boundary_precision_check / credit_exposure_exactly_at_limit_is_accepted_one_cent_over_is_not
          rationale: "That §1.8 instance asserts the accepted-at-limit and refused-one-cent-over pair on POST /part-orders/{id}/lines."

      - name: error_part_non_returnable_on_return_request
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PART_NON_RETURNABLE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / electrical_non_returnable_constraint_outranks_expired_window_temporal
          rationale: "That §1.8 instance triggers the electrical non-returnable rule as the winning error of a priority conflict."

      - name: error_return_window_expired_on_day_thirty_one
        claim_type: violation_to_error
        grounds:
          - errors[ERR_RETURN_WINDOW_EXPIRED]
        excluded_because:
          difficulty_instance: boundary_precision_check / return_window_day_thirty_accepted_day_thirty_one_expired
          rationale: "That §1.8 instance asserts the day-30 acceptance and day-31 rejection pair."

      - name: error_resubmission_limit_reached_on_third_resubmit
        claim_type: violation_to_error
        grounds:
          - errors[ERR_RESUBMISSION_LIMIT_REACHED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / warranty_claim_info_requested_resubmit_cycle_bounded_at_two
          rationale: "That §1.8 instance exhausts MAX_RESUBMISSIONS and asserts the third resubmit is refused."

      - name: error_servicer_not_active_on_allocate
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SERVICER_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / allocation_blocked_while_owning_servicer_account_is_on_credit_hold
          rationale: "That §1.8 instance allocates for a CREDIT_HOLD account and asserts this error."

      - name: error_branch_not_open_on_allocate
        claim_type: violation_to_error
        grounds:
          - errors[ERR_BRANCH_NOT_OPEN]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / allocation_blocked_while_the_pickup_branch_is_in_count_freeze
          rationale: "That §1.8 instance allocates against a COUNT_FREEZE branch and asserts this error."

      - name: error_cert_window_overlap_on_certification_create
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CERT_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / certification_windows_are_closed_so_a_touching_endpoint_collides
          rationale: "That §1.8 instance asserts the touching-endpoint collision and the one-day-later acceptance."

  # ===========================================================================
  - section: rbac
    instances:

      - name: servicer_cannot_publish_a_price_file_returns_403
        claim_type: peer_roles
        grounds:
          - roles.Servicer.shared_operations
          - roles.PricingAdmin.exclusive_operations
          - validations[priority_2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "POST /price-files/{id}/publish is PricingAdmin-exclusive, so a Servicer call returns 403 ERR_UNAUTHORIZED and the file stays DRAFT with the part's list price untouched at 12999."
        test_recipe:
          setup:
            - "GOLD tier; one NET_30 ServicerAccount; Part P1 W10-PUMP list 12999."
            - "A DRAFT PriceFile 2026-08-A with one line raising P1 to 15999."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
              as: PricingAdmin
              captures: { tier_gold_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP", oem_code: "WHIRLPOOL", description: "Drain pump assembly", category: "MECHANICAL", list_price_cents: 12999, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_p1_id: $.data.id }
            - call: "POST /servicer-accounts"
              payload: { business_name: "Ace Appliance Repair", oem_authorizations: ["WHIRLPOOL"], pricing_tier_id: "${tier_gold_id}", credit_terms: "NET_30", credit_limit_cents: 10000000, core_liability_limit_cents: 5000000 }
              as: CreditManager
              captures: { acct_s_id: $.data.id }
            - call: "POST /price-files"
              payload: { file_version: "2026-08-A", effective_at: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
              captures: { pf_id: $.data.id }
            - call: "POST /price-files/${pf_id}/lines"
              payload: { part_id: "${part_p1_id}", new_list_price_cents: 15999 }
              as: PricingAdmin
              captures: { pfl_id: $.data.id }
          trigger:
            - call: "POST /price-files/${pf_id}/publish"
              payload: {}
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { err_role: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_UNAUTHORIZED"
            - "PriceFile.${pf_id}.price_file_status == DRAFT"
            - "PriceFile.${pf_id}.published_at == null"
            - "Part.${part_p1_id}.list_price_cents == 12999"
            - "Part.${part_p1_id}.version == 1"

      - name: servicer_cannot_read_another_servicers_order_returns_403
        claim_type: peer_roles
        grounds:
          - validations[priority_6]
          - errors[ERR_ACCOUNT_SCOPE_VIOLATION]
          - roles.Servicer.identity
        distinguishing_aspect: "GET /part-orders/{id} is a shared read, but a Servicer whose X-User-ID is account A reading account B's order returns 403 ERR_ACCOUNT_SCOPE_VIOLATION — the same call by the owning servicer succeeds."
        test_recipe:
          setup:
            - "GOLD tier; Branch STL with will_call_enabled true; Part P1 MECHANICAL 12999."
            - "Two accounts: ACCT_A (Ace Appliance Repair) and ACCT_B (Bell Appliance Service), both NET_30 with credit_limit_cents 10000000."
            - "One WILL_CALL order with a 2-unit line owned by ACCT_B (total 20798)."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
              as: PricingAdmin
