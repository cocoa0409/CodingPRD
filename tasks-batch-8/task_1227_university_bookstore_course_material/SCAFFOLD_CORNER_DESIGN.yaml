scaffold_corner_design:
  - section: entities
    instances:
      - name: term_created_with_defaults
        claim_type: creation_defaults
        grounds: ['entities.AcademicTerm']
        distinguishing_aspect: "POST /terms with all required fields -> 201; status SETUP, compliance_posture CLEAR, noncompliant_section_count 0, version 1."
        test_recipe:
          setup: ["empty DB; clock default 2026-05-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /bookstore/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /bookstore/terms", payload: { code: "2026-FALL", length_weeks: 16, registration_open_at: "2026-06-01T00:00:00Z", price_posting_deadline_at: "2026-06-01T00:00:00Z", adoption_deadline_at: "2026-06-15T23:59:59Z", aid_charge_window_start_at: "2026-08-01T00:00:00Z", aid_charge_window_end_at: "2026-09-15T23:59:59Z", add_drop_return_deadline_at: "2026-09-08T23:59:59Z", census_at: "2026-09-10T00:00:00Z", ia_opt_out_deadline_at: "2026-09-09T23:59:59Z", buyback_window_start_at: "2026-12-10T00:00:00Z", buyback_window_end_at: "2026-12-20T23:59:59Z", buy_budget_cents: 100000000 }, as: PlatformAdmin, captures: { t1: $.data.id } }
          assert:
            - "AcademicTerm.${t1}.status == SETUP, compliance_posture == CLEAR, noncompliant_section_count == 0, version == 1"
            - "response envelope has meta.api_request_id and response_type == object"

      - name: title_stock_initialized_from_initial_fields
        claim_type: computed_fields
        grounds: ['entities.Title.fields.new_stock_qty', 'entities.Title.fields.used_stock_qty']
        distinguishing_aspect: "Computed stock fields initialize from initial_* inputs; client-sent new_stock_qty input is ignored (there is no such input field)."
        test_recipe:
          setup: ["publisher exists"]
          setup_api_calls:
            - { call: "POST /bookstore/publishers", payload: { name: "Penguin" }, as: PlatformAdmin, captures: { pub: $.data.id } }
          trigger:
            - { call: "POST /bookstore/titles", payload: { isbn: "9780000001001", publisher_id: "${pub}", list_price_cents: 10000, has_new: true, has_used: true, has_rental: true, has_digital: false, initial_new_stock_qty: 7, initial_used_stock_qty: 3, initial_rental_stock_qty: 2 }, as: PlatformAdmin, captures: { tit: $.data.id } }
          assert:
            - "Title.${tit}.new_stock_qty == 7, used_stock_qty == 3, rental_stock_qty == 2"

      - name: student_aid_balance_initialized_to_awarded
        claim_type: computed_fields
        grounds: ['entities.Student.fields.aid_balance_cents']
        distinguishing_aspect: "aid_balance_cents is computed and equals awarded_aid_cents at creation; omitting awarded_aid_cents defaults both to 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /bookstore/students", payload: { full_name: "Stu One", email: "stu1@uni.edu", awarded_aid_cents: 42000 }, as: PlatformAdmin, captures: { stu: $.data.id } }
            - { call: "POST /bookstore/students", payload: { full_name: "Stu Zero", email: "zero@uni.edu" }, as: PlatformAdmin, captures: { stu0: $.data.id } }
          assert:
            - "Student.${stu}.aid_balance_cents == 42000"
            - "Student.${stu0}.awarded_aid_cents == 0 and aid_balance_cents == 0"

      - name: entity_get_not_found_returns_404
        claim_type: not_found
        grounds: ['errors[ERR_NOT_FOUND]']
        distinguishing_aspect: "GET with a well-formed but absent UUID returns 404 ERR_NOT_FOUND with the error envelope shape."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /bookstore/terms/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND and http status 404, response_type == error"

      - name: section_requires_fee_when_ia_enabled
        claim_type: required_fields
        grounds: ['entities.CourseSection.fields.ia_material_fee_cents', 'errors[ERR_VALIDATION]']
        distinguishing_aspect: "ia_enabled true without ia_material_fee_cents is rejected; with ia_enabled false the fee may be omitted."
        test_recipe:
          setup: ["term and faculty exist"]
          setup_api_calls:
            - { call: "POST /bookstore/terms", payload: { code: "2026-FALL", length_weeks: 16, registration_open_at: "2026-06-01T00:00:00Z", price_posting_deadline_at: "2026-06-01T00:00:00Z", adoption_deadline_at: "2026-06-15T23:59:59Z", aid_charge_window_start_at: "2026-08-01T00:00:00Z", aid_charge_window_end_at: "2026-09-15T23:59:59Z", add_drop_return_deadline_at: "2026-09-08T23:59:59Z", census_at: "2026-09-10T00:00:00Z", ia_opt_out_deadline_at: "2026-09-09T23:59:59Z", buyback_window_start_at: "2026-12-10T00:00:00Z", buyback_window_end_at: "2026-12-20T23:59:59Z", buy_budget_cents: 100000000 }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /bookstore/faculty", payload: { full_name: "Prof Ada", email: "ada@uni.edu" }, as: PlatformAdmin, captures: { fac: $.data.id } }
          trigger:
            - { call: "POST /bookstore/sections", payload: { term_id: "${t1}", faculty_id: "${fac}", course_code: "BIO200", section_code: "01", enrollment_capacity: 30, ia_enabled: true }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION (ia_material_fee_cents required when ia_enabled)"

      - name: adoption_posted_price_optional_at_create
        claim_type: defaults
        grounds: ['entities.Adoption.fields.posted_price_cents']
        distinguishing_aspect: "posted_price_cents may be omitted at creation (null) and backfilled via PATCH while DRAFT; it is only enforced at submit."
        test_recipe:
          setup: ["term T1 ADOPTION_OPEN; open section; title"]
          setup_api_calls:
            - { call: "POST /bookstore/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /bookstore/terms", payload: { code: "2026-FALL", length_weeks: 16, registration_open_at: "2026-06-01T00:00:00Z", price_posting_deadline_at: "2026-06-01T00:00:00Z", adoption_deadline_at: "2026-06-15T23:59:59Z", aid_charge_window_start_at: "2026-08-01T00:00:00Z", aid_charge_window_end_at: "2026-09-15T23:59:59Z", add_drop_return_deadline_at: "2026-09-08T23:59:59Z", census_at: "2026-09-10T00:00:00Z", ia_opt_out_deadline_at: "2026-09-09T23:59:59Z", buyback_window_start_at: "2026-12-10T00:00:00Z", buyback_window_end_at: "2026-12-20T23:59:59Z", buy_budget_cents: 100000000 }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /bookstore/publishers", payload: { name: "Penguin" }, as: PlatformAdmin, captures: { pub: $.data.id } }
            - { call: "POST /bookstore/titles", payload: { isbn: "9780000001002", publisher_id: "${pub}", list_price_cents: 10000, has_new: true, has_used: false, has_rental: false, has_digital: false }, as: PlatformAdmin, captures: { tit: $.data.id } }
            - { call: "POST /bookstore/faculty", payload: { full_name: "Prof Ada", email: "ada@uni.edu" }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /bookstore/sections", payload: { term_id: "${t1}", faculty_id: "${fac}", course_code: "CS101", section_code: "01", enrollment_capacity: 30, ia_enabled: false }, as: PlatformAdmin, captures: { sec1: $.data.id } }
            - { call: "POST /bookstore/terms/${t1}/open-adoption", payload: {}, as: PlatformAdmin }
            - { call: "POST /bookstore/sections/${sec1}/open", payload: {}, as: PlatformAdmin, captures: { sec1_v: $.data.version } }
          trigger:
            - { call: "POST /bookstore/adoptions", payload: { section_id: "${sec1}", title_id: "${tit}", qty_new_requested: 5, qty_used_requested: 0, qty_rental_requested: 0, qty_digital_requested: 0, expected_section_version: "${sec1_v}" }, as: Faculty, as_user_id: "${fac}", captures: { ado: $.data.id, ado_v: $.data.version } }
            - { call: "PATCH /bookstore/adoptions/${ado}", payload: { posted_price_cents: 9500, expected_adoption_version: "${ado_v}" }, as: Faculty, as_user_id: "${fac}" }
          assert:
            - "create succeeds (201) with posted_price_cents == null and status == DRAFT"
            - "after PATCH: Adoption.${ado}.posted_price_cents == 9500, status still DRAFT"

  - section: state_machines
    instances:
      - name: close_adoption_cascade_covered
        claim_type: side_effect_execution
        grounds: ['state_machines.AcademicTerm.ADOPTION_OPEN_to_ADOPTION_CLOSED']
        excluded_because:
          difficulty_instance: close_adoption_period_three_hop_cascade
          rationale: "Cascade side effects asserted hop-by-hop in the named §1.8 instance."

      - name: order_line_return_cascade_covered
        claim_type: side_effect_execution
        grounds: ['state_machines.OrderLine.FULFILLED_to_RETURNED']
        excluded_because:
          difficulty_instance: order_line_return_two_hop_cascade
          rationale: "Restock, refund, and order re-derivation asserted in the named §1.8 instance."

      - name: adoption_submit_twice_rejected
        claim_type: invalid_transition
        grounds: ['state_machines.Adoption.DRAFT_to_SUBMITTED', 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Submit from SUBMITTED (not a listed from-state) is rejected with ERR_INVALID_STATE and no fields change."
        test_recipe:
          setup: ["term ADOPTION_OPEN; adoption SUBMITTED"]
          setup_api_calls:
            - { call: "POST /bookstore/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /bookstore/terms", payload: { code: "2026-FALL", length_weeks: 16, registration_open_at: "2026-06-01T00:00:00Z", price_posting_deadline_at: "2026-06-01T00:00:00Z", adoption_deadline_at: "2026-06-15T23:59:59Z", aid_charge_window_start_at: "2026-08-01T00:00:00Z", aid_charge_window_end_at: "2026-09-15T23:59:59Z", add_drop_return_deadline_at: "2026-09-08T23:59:59Z", census_at: "2026-09-10T00:00:00Z", ia_opt_out_deadline_at: "2026-09-09T23:59:59Z", buyback_window_start_at: "2026-12-10T00:00:00Z", buyback_window_end_at: "2026-12-20T23:59:59Z", buy_budget_cents: 100000000 }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /bookstore/publishers", payload: { name: "Penguin" }, as: PlatformAdmin, captures: { pub: $.data.id } }
            - { call: "POST /bookstore/titles", payload: { isbn: "9780000001003", publisher_id: "${pub}", list_price_cents: 10000, has_new: true, has_used: false, has_rental: false, has_digital: false }, as: PlatformAdmin, captures: { tit: $.data.id } }
            - { call: "POST /bookstore/faculty", payload: { full_name: "Prof Ada", email: "ada@uni.edu" }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /bookstore/sections", payload: { term_id: "${t1}", faculty_id: "${fac}", course_code: "CS101", section_code: "01", enrollment_capacity: 30, ia_enabled: false }, as: PlatformAdmin, captures: { sec1: $.data.id } }
            - { call: "POST /bookstore/terms/${t1}/open-adoption", payload: {}, as: PlatformAdmin }
            - { call: "POST /bookstore/sections/${sec1}/open", payload: {}, as: PlatformAdmin, captures: { sec1_v: $.data.version } }
            - { call: "POST /bookstore/adoptions", payload: { section_id: "${sec1}", title_id: "${tit}", qty_new_requested: 5, qty_used_requested: 0, qty_rental_requested: 0, qty_digital_requested: 0, posted_price_cents: 9500, expected_section_version: "${sec1_v}" }, as: Faculty, as_user_id: "${fac}", captures: { ado: $.data.id } }
            - { call: "POST /bookstore/adoptions/${ado}/submit", payload: {}, as: Faculty, as_user_id: "${fac}" }
          trigger:
            - { call: "POST /bookstore/adoptions/${ado}/submit", payload: {}, as: Faculty, as_user_id: "${fac}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "Adoption.${ado}.status == SUBMITTED (unchanged)"

      - name: expired_adoption_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ['state_machines.Adoption.DRAFT_to_EXPIRED', 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "EXPIRED is terminal: no trigger (submit, PATCH, review) is accepted from EXPIRED."
        test_recipe:
          setup: ["term T1; DRAFT adoption swept to EXPIRED by close-adoption"]
          setup_api_calls:
            - { call: "POST /bookstore/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /bookstore/terms", payload: { code: "2026-FALL", length_weeks: 16, registration_open_at: "2026-06-01T00:00:00Z", price_posting_deadline_at: "2026-06-01T00:00:00Z", adoption_deadline_at: "2026-06-15T23:59:59Z", aid_charge_window_start_at: "2026-08-01T00:00:00Z", aid_charge_window_end_at: "2026-09-15T23:59:59Z", add_drop_return_deadline_at: "2026-09-08T23:59:59Z", census_at: "2026-09-10T00:00:00Z", ia_opt_out_deadline_at: "2026-09-09T23:59:59Z", buyback_window_start_at: "2026-12-10T00:00:00Z", buyback_window_end_at: "2026-12-20T23:59:59Z", buy_budget_cents: 100000000 }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /bookstore/publishers", payload: { name: "Penguin" }, as: PlatformAdmin, captures: { pub: $.data.id } }
            - { call: "POST /bookstore/titles", payload: { isbn: "9780000001004", publisher_id: "${pub}", list_price_cents: 10000, has_new: true, has_used: false, has_rental: false, has_digital: false }, as: PlatformAdmin, captures: { tit: $.data.id } }
            - { call: "POST /bookstore/faculty", payload: { full_name: "Prof Ada", email: "ada@uni.edu" }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /bookstore/sections", payload: { term_id: "${t1}", faculty_id: "${fac}", course_code: "CS101", section_code: "01", enrollment_capacity: 30, ia_enabled: false }, as: PlatformAdmin, captures: { sec1: $.data.id } }
            - { call: "POST /bookstore/terms/${t1}/open-adoption", payload: {}, as: PlatformAdmin }
            - { call: "POST /bookstore/sections/${sec1}/open", payload: {}, as: PlatformAdmin, captures: { sec1_v: $.data.version } }
            - { call: "POST /bookstore/adoptions", payload: { section_id: "${sec1}", title_id: "${tit}", qty_new_requested: 5, qty_used_requested: 0, qty_rental_requested: 0, qty_digital_requested: 0, posted_price_cents: 9500, expected_section_version: "${sec1_v}" }, as: Faculty, as_user_id: "${fac}", captures: { ado: $.data.id } }
            - { call: "POST /bookstore/terms/${t1}/close-adoption", payload: {}, as: BookstoreManager }
          trigger:
            - { call: "POST /bookstore/adoptions/${ado}/submit", payload: {}, as: Faculty, as_user_id: "${fac}", captures: { err: $.data.error_id } }
          assert:
            - "Adoption.${ado}.status == EXPIRED after the sweep"
            - "error_id == ERR_INVALID_STATE on submit from EXPIRED"

      - name: buyplan_commit_twice_rejected
        claim_type: invalid_transition
        grounds: ['state_machines.BuyPlan.DRAFT_to_COMMITTED', 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Second commit from COMMITTED fails ERR_INVALID_STATE even with the correct current version (state guard, not OCC)."
        test_recipe:
          setup: ["APPROVED adoption with BuyPlan DRAFT (qty_new 10, landed 90000 within budget); agreement active"]
          setup_api_calls:
            - { call: "POST /bookstore/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /bookstore/terms", payload: { code: "2026-FALL", length_weeks: 16, registration_open_at: "2026-06-01T00:00:00Z", price_posting_deadline_at: "2026-06-01T00:00:00Z", adoption_deadline_at: "2026-06-15T23:59:59Z", aid_charge_window_start_at: "2026-08-01T00:00:00Z", aid_charge_window_end_at: "2026-09-15T23:59:59Z", add_drop_return_deadline_at: "2026-09-08T23:59:59Z", census_at: "2026-09-10T00:00:00Z", ia_opt_out_deadline_at: "2026-09-09T23:59:59Z", buyback_window_start_at: "2026-12-10T00:00:00Z", buyback_window_end_at: "2026-12-20T23:59:59Z", buy_budget_cents: 100000000 }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /bookstore/publishers", payload: { name: "Penguin" }, as: PlatformAdmin, captures: { pub: $.data.id } }
            - { call: "POST /bookstore/publishers/${pub}/agreements", payload: { start_date: "2026-01-01", end_date: "2027-06-30", discount_pct: 0.10, digital_discount_pct: 0.25, commission_pct: 0.08 }, as: PlatformAdmin }
            - { call: "POST /bookstore/titles", payload: { isbn: "9780000001005", publisher_id: "${pub}", list_price_cents: 10000, has_new: true, has_used: false, has_rental: false, has_digital: false }, as: PlatformAdmin, captures: { tit: $.data.id } }
            - { call: "POST /bookstore/faculty", payload: { full_name: "Prof Ada", email: "ada@uni.edu" }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /bookstore/sections", payload: { term_id: "${t1}", faculty_id: "${fac}", course_code: "CS101", section_code: "01", enrollment_capacity: 30, ia_enabled: false }, as: PlatformAdmin, captures: { sec1: $.data.id } }
            - { call: "POST /bookstore/terms/${t1}/open-adoption", payload: {}, as: PlatformAdmin }
            - { call: "POST /bookstore/sections/${sec1}/open", payload: {}, as: PlatformAdmin, captures: { sec1_v: $.data.version } }
            - { call: "POST /bookstore/adoptions", payload: { section_id: "${sec1}", title_id: "${tit}", qty_new_requested: 10, qty_used_requested: 0, qty_rental_requested: 0, qty_digital_requested: 0, posted_price_cents: 10000, expected_section_version: "${sec1_v}" }, as: Faculty, as_user_id: "${fac}", captures: { ado: $.data.id } }
            - { call: "POST /bookstore/adoptions/${ado}/submit", payload: {}, as: Faculty, as_user_id: "${fac}" }
            - { call: "POST /bookstore/adoptions/${ado}/start-review", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/adoptions/${ado}/approve", payload: {}, as: BookstoreManager }
            - { call: "GET /bookstore/adoptions/${ado}/buy-plan", payload: {}, as: BookstoreManager, captures: { bp: "$.data[0].id", bp_v: "$.data[0].version" } }
            - { call: "POST /bookstore/buy-plans/${bp}/commit", payload: { expected_buy_plan_version: "${bp_v}" }, as: BookstoreManager }
          trigger:
            - { call: "GET /bookstore/buy-plans/${bp}", payload: {}, as: BookstoreManager, captures: { bp_v2: $.data.version } }
            - { call: "POST /bookstore/buy-plans/${bp}/commit", payload: { expected_buy_plan_version: "${bp_v2}" }, as: BookstoreManager, captures: { err: $.data.error_id } }
          assert:
            - "first commit succeeded with landed_cost_cents == 90000"
            - "second commit: error_id == ERR_INVALID_STATE (not ERR_STALE_VERSION)"

      - name: section_lock_creates_pending_charges
        claim_type: side_effect_execution
        grounds: ['state_machines.CourseSection.OPEN_to_LOCKED', 'entities.InclusiveAccessCharge']
        distinguishing_aspect: "Locking an ia-enabled section with 2 ENROLLED enrollments creates exactly 2 PENDING charges with fee locked at 4900; a non-ia section creates none."
        test_recipe:
          setup: ["term T1 SALES_OPEN; section ia_enabled fee 4900 with two enrolled students; second section ia_enabled false with one enrolled student"]
          setup_api_calls:
            - { call: "POST /bookstore/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /bookstore/terms", payload: { code: "2026-FALL", length_weeks: 16, registration_open_at: "2026-06-01T00:00:00Z", price_posting_deadline_at: "2026-06-01T00:00:00Z", adoption_deadline_at: "2026-06-15T23:59:59Z", aid_charge_window_start_at: "2026-08-01T00:00:00Z", aid_charge_window_end_at: "2026-09-15T23:59:59Z", add_drop_return_deadline_at: "2026-09-08T23:59:59Z", census_at: "2026-09-10T00:00:00Z", ia_opt_out_deadline_at: "2026-09-09T23:59:59Z", buyback_window_start_at: "2026-12-10T00:00:00Z", buyback_window_end_at: "2026-12-20T23:59:59Z", buy_budget_cents: 100000000 }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /bookstore/faculty", payload: { full_name: "Prof Ada", email: "ada@uni.edu" }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /bookstore/students", payload: { full_name: "Stu One", email: "stu1@uni.edu", awarded_aid_cents: 100000 }, as: PlatformAdmin, captures: { stu1: $.data.id } }
            - { call: "POST /bookstore/students", payload: { full_name: "Stu Two", email: "stu2@uni.edu", awarded_aid_cents: 100000 }, as: PlatformAdmin, captures: { stu2: $.data.id } }
            - { call: "POST /bookstore/students", payload: { full_name: "Stu Three", email: "stu3@uni.edu", awarded_aid_cents: 100000 }, as: PlatformAdmin, captures: { stu3: $.data.id } }
            - { call: "POST /bookstore/sections", payload: { term_id: "${t1}", faculty_id: "${fac}", course_code: "BIO200", section_code: "01", enrollment_capacity: 30, ia_enabled: true, ia_material_fee_cents: 4900 }, as: PlatformAdmin, captures: { sec1: $.data.id } }
            - { call: "POST /bookstore/sections", payload: { term_id: "${t1}", faculty_id: "${fac}", course_code: "BIO201", section_code: "01", enrollment_capacity: 30, ia_enabled: false }, as: PlatformAdmin, captures: { sec2: $.data.id } }
            - { call: "POST /bookstore/terms/${t1}/open-adoption", payload: {}, as: PlatformAdmin }
            - { call: "POST /bookstore/sections/${sec1}/open", payload: {}, as: PlatformAdmin }
            - { call: "POST /bookstore/sections/${sec2}/open", payload: {}, as: PlatformAdmin }
            - { call: "POST /bookstore/sections/${sec1}/enrollments", payload: { student_id: "${stu1}" }, as: PlatformAdmin }
            - { call: "POST /bookstore/sections/${sec1}/enrollments", payload: { student_id: "${stu2}" }, as: PlatformAdmin }
            - { call: "POST /bookstore/sections/${sec2}/enrollments", payload: { student_id: "${stu3}" }, as: PlatformAdmin }
            - { call: "POST /bookstore/terms/${t1}/close-adoption", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/terms/${t1}/open-sales", payload: {}, as: BookstoreManager }
          trigger:
            - { call: "POST /bookstore/sections/${sec1}/lock", payload: {}, as: BookstoreManager }
            - { call: "POST /bookstore/sections/${sec2}/lock", payload: {}, as: BookstoreManager }
          assert:
            - "GET /bookstore/inclusive-access-charges?section_id=${sec1} returns exactly 2 charges, all status PENDING, fee_cents == 4900"
