- section: validations
  instances:
  - name: missing_auth_headers_return_401_before_any_other_check
    claim_type: Violation → Error
    grounds:
    - validations[priority=1]
    - errors[ERR_UNAUTHENTICATED]
    distinguishing_aspect: A request with no X-User-Role header to a valid endpoint with an invalid body still returns 401 ERR_UNAUTHENTICATED — auth precedes request-shape validation.
    test_recipe:
      setup:
      - Clock at default. Empty database.
      setup_api_calls: []
      trigger:
      - call: POST /coe/episodes
        payload: {}
        captures:
          err: $.data.error_id
      assert:
      - response 401 ERR_UNAUTHENTICATED (no role header supplied by the test harness)
  - name: priority_ordering_state_error_beats_capacity_error
    claim_type: Priority Ordering
    grounds:
    - validations[priority=6]
    - validations[priority=10]
    distinguishing_aspect: excluded — the §1.8 instance state_vs_fiscal_capacity_conflict_on_review already pins fiscal-after-state on the review endpoint; this stub prevents double-counting.
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / state_vs_fiscal_capacity_conflict_on_review
      rationale: The dual-gate ordering on review approval is asserted there.
