    roles: [PodOperator]
    code: 200
    input: []
    output: AccessEvent
    side_effects: ["AccessEvent.outcome = SUCCESS", "AccessEvent.auto_release_used = true", "Reservation.status = IN_USE", "Vehicle.use_status = IN_USE", "increments AccessEvent.version by 1"]
  - method: POST
    path: "/car-share/access-events/{id}/lockout-report"
    description: "Report a lockout on a FAILED access event; runs the C8 strike escalation."
    roles: [Member]
    code: 200
    input: []
    output: AccessEvent
    side_effects: ["AccessEvent.outcome = LOCKOUT_REPORTED", "AccessEvent.lockout_reported_at = current logical clock value", "derives Member.strikes via the C8 calculation", "credits Member.wallet_credit_cents by 500 on a first report", "posts the C8 violation fee onto Member.wallet_hold_cents", "increments Member.version by 1", "increments AccessEvent.version by 1"]

  # ---- Fuel card ----
  - method: POST
    path: "/car-share/fuel-card-transactions"
    description: "Post a fuel-card purchase against a reservation and vehicle."
    roles: [Member, PodOperator]
    code: 201
    input:
      - reservation_id
      - vehicle_id
      - amount_cents
      - gallons_hundredths
    output: FuelCardTransaction
    side_effects: ["FuelCardTransaction.status = POSTED", "supplies the C2 ledger delta and C7 fuel-card total"]
  - method: GET
    path: "/car-share/fuel-card-transactions"
    description: "Filtered list of fuel-card transactions."
    roles: [Member, PodOperator]
