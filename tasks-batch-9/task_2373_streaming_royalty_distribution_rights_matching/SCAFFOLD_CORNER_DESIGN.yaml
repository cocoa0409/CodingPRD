      - name: cyclic_shape_evidence_loop_and_pool_recalculate_loop
        claim_type: cyclic
        grounds: [complexity_profile.state_machine_shape, state_machines.RightsRegistration.NEEDS_EVIDENCE_to_UNDER_REVIEW, state_machines.RoyaltyPool.CALCULATED_to_CALCULATED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / registration_evidence_loop_bounded_by_round_counter
          rationale: "The bounded UNDER_REVIEW <-> NEEDS_EVIDENCE loop and its termination counter are the subject of that instance; the RoyaltyPool CALCULATED self-loop and the FINALIZED -> REOPENED_FOR_ADJUSTMENT -> CALCULATED cycle are the subject of non_linear_state_machine / pool_reopen_recalculate_cycle_with_self_loop."

      - name: parallel_shape_independent_engagement_dimensions
        claim_type: parallel
        grounds: [complexity_profile.state_machine_shape, state_machines.AuditEngagement]
        excluded_because:
          difficulty_instance: non_linear_state_machine / audit_parallel_dimensions_and_settlement_interest
          rationale: "Independent movement of production_status and finding_status, and the combined-state legality matrix, are that instance's whole subject."

      - name: cascade_down_and_bubble_up_side_effect_patterns
        claim_type: side_effect_execution
        grounds: [state_machines.RightsRegistration.UNDER_REVIEW_to_APPROVED, state_machines.RateSchedule.PROPOSED_to_EFFECTIVE]
        excluded_because:
          difficulty_instance: transitive_cascade / registration_approval_depth3_cascade
          rationale: "Depth-3 cascade-down plus bubble-up is asserted link-by-link there, and the depth-4 retroactive chain in transitive_cascade / retroactive_promulgation_depth4_cascade covers the cross-entity and ledger-sync variants."

      - name: compensation_side_effect_pattern_reverses_without_drift
        claim_type: side_effect_execution
        grounds: [state_machines.RightsRegistration.APPROVED_to_DISPUTED, state_machines.RoyaltyStatement.ISSUED_to_SUPERSEDED]
        excluded_because:
          difficulty_instance: compensating_invariant / royalty_pool_value_conservation
          rationale: "The dispute compensation and the supersede compensation are asserted with before/after observation points there and in compensating_invariant / holder_receivable_conservation."

      - name: guarded_transition_cross_entity_precondition
        claim_type: precondition_enforcement
        grounds: [state_machines.RoyaltyPool.DRAFT_to_CALCULATED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / pool_calculate_gated_by_sibling_batch_state
          rationale: "The guard \"pool may only calculate when the parent period is USAGE_SEALED, which itself depends on sibling batch states\" is that instance's subject."

  - section: calculations
    instances:
      - name: usage_line_matching_candidate_set_and_deterministic_tie_break
        claim_type: input_set_filtering
        grounds:
          - calculations.usage_line_matching
          - entities.UsageLine.fields.match_confidence_bps
          - entities.Work.fields.provisional_match_by_user_id
        distinguishing_aspect: |
          The candidate set is `work_type == 'RECORDING' AND (isrc hit OR normalized-title hit)`, so a
          COMPOSITION with the identical title is never a candidate even when its identifier is the
          reported ISRC. When two RECORDING works tie at 7500 the pinned tie-break decides: both were
          created at the frozen logical time 2026-08-01T00:00:00Z, so `created_at ASC` cannot break
          the tie and `identifier ASC` must — the winner is the alphabetically first identifier, NOT
          the row inserted first. An exact-ISRC win at 10000 leaves provisional_match_by_user_id null
          (nothing to segregate) while a 7500 fuzzy win stamps it.
        test_recipe:
          setup:
            - "Two RECORDING works with the SAME title and artist but different identifiers, inserted in identifier-DESCENDING order: GBABC2600002 first, then GBABC2600001."
            - "One COMPOSITION work with identifier T9001234567 and the same title."
            - "One OPEN batch on an OPEN period carrying four lines."
          setup_api_calls:
            - call: "POST /royalties/periods"
              payload: { label: "2026-06", usage_start: "2026-06-01", usage_end: "2026-06-30" }
              as: RoyaltyAdmin
              captures: { per: "$.data.id" }
            - call: "POST /royalties/works"
              payload: { work_type: "RECORDING", identifier: "GBABC2600002", title: "Midnight Ledger", artist_credit: "The Reconcilers" }
              as: RightsOpsAnalyst
              captures: { wB: "$.data.id" }
            - call: "POST /royalties/works"
              payload: { work_type: "RECORDING", identifier: "GBABC2600001", title: "MIDNIGHT LEDGER", artist_credit: "the reconcilers" }
              as: RightsOpsAnalyst
              captures: { wA: "$.data.id" }
            - call: "POST /royalties/works"
              payload: { work_type: "COMPOSITION", identifier: "T9001234567", title: "Midnight Ledger", artist_credit: "The Reconcilers" }
              as: RightsOpsAnalyst
              captures: { wC: "$.data.id" }
            - call: "POST /royalties/usage-batches"
              payload: { period_id: "${per}", source_label: "UK client feed" }
              as: RightsOpsAnalyst
              captures: { ub: "$.data.id" }
            - call: "POST /royalties/usage-batches/${ub}/lines"
              payload: { reported_title: "midnight   ledger!!", reported_artist: "THE RECONCILERS", territory_code: "GB", subscription_tier: "INDIVIDUAL", play_count: 1000 }
              as: RightsOpsAnalyst
              captures: { l1: "$.data.id" }
            - call: "POST /royalties/usage-batches/${ub}/lines"
              payload: { reported_isrc: "GBABC2600002", reported_title: "Midnight Ledger", territory_code: "GB", subscription_tier: "INDIVIDUAL", play_count: 2000 }
              as: RightsOpsAnalyst
              captures: { l2: "$.data.id" }
            - call: "POST /royalties/usage-batches/${ub}/lines"
              payload: { reported_isrc: "T9001234567", reported_title: "Unknown Signal", territory_code: "GB", subscription_tier: "INDIVIDUAL", play_count: 3000 }
              as: RightsOpsAnalyst
              captures: { l3: "$.data.id" }
            - call: "POST /royalties/usage-batches/${ub}/lines"
              payload: { reported_title: "Midnight Ledger", territory_code: "GB", subscription_tier: "INDIVIDUAL", play_count: 4000 }
              as: RightsOpsAnalyst
              captures: { l4: "$.data.id" }
            - call: "POST /royalties/usage-batches/${ub}/seal"
              payload: {}
              as: RightsOpsAnalyst
          trigger:
            - call: "POST /royalties/usage-batches/${ub}/match"
              payload: {}
              as: RightsOpsAnalyst
              as_user_id: "analyst-fuzzy-1"
              captures: { bst: "$.data.status", mp: "$.data.matched_play_count", up: "$.data.unmatched_play_count" }
            - call: "GET /royalties/usage-lines/${l1}"
              payload: {}
              as: RightsOpsAnalyst
              captures: { w1r: "$.data.work_id", c1: "$.data.match_confidence_bps", s1: "$.data.match_status" }
            - call: "GET /royalties/usage-lines/${l2}"
              payload: {}
              as: RightsOpsAnalyst
              captures: { w2r: "$.data.work_id", c2: "$.data.match_confidence_bps", s2: "$.data.match_status" }
            - call: "GET /royalties/usage-lines/${l3}"
              payload: {}
              as: RightsOpsAnalyst
              captures: { w3r: "$.data.work_id", c3: "$.data.match_confidence_bps", s3: "$.data.match_status" }
            - call: "GET /royalties/usage-lines/${l4}"
              payload: {}
              as: RightsOpsAnalyst
              captures: { w4r: "$.data.work_id", c4: "$.data.match_confidence_bps", s4: "$.data.match_status" }
            - call: "GET /royalties/works/${wA}"
              payload: {}
              as: RightsOpsAnalyst
              captures: { pmA: "$.data.provisional_match_by_user_id" }
            - call: "GET /royalties/works/${wB}"
              payload: {}
              as: RightsOpsAnalyst
              captures: { pmB: "$.data.provisional_match_by_user_id" }
            - call: "GET /royalties/works/${wC}"
              payload: {}
              as: RightsOpsAnalyst
              captures: { pmC: "$.data.provisional_match_by_user_id", rsC: "$.data.rights_state" }
          assert:
            - "Line 1 (title+artist, no ISRC): both RECORDING works score TITLE_ARTIST_CONFIDENCE_BPS 7500 and share created_at 2026-08-01T00:00:00Z, so identifier ASC decides — work_id is the GBABC2600001 row (created SECOND), match_confidence_bps 7500, match_status AUTO_MATCHED."
            - "Because 7500 < ISRC_EXACT_CONFIDENCE_BPS, the winning work GBABC2600001 now carries provisional_match_by_user_id analyst-fuzzy-1; the losing GBABC2600002 does NOT."
            - "Line 2 (ISRC GBABC2600002 + title): the ISRC hit scores 10000 and outranks the 5000 title-only hit on the other work — work_id is the GBABC2600002 row, match_confidence_bps 10000, AUTO_MATCHED, and its provisional_match_by_user_id STAYS null because the match was exact."
            - "Line 3 (ISRC T9001234567, title \"Unknown Signal\"): the COMPOSITION whose identifier is exactly that ISRC is filtered out by work_type, so the candidate set is EMPTY — work_id null, match_confidence_bps 0 (not 10000), match_status UNMATCHED."
            - "Line 4 (title only): best score is TITLE_ONLY_CONFIDENCE_BPS 5000, which is below AUTO_MATCH_MIN_CONFIDENCE_BPS — match_confidence_bps is recorded as 5000 but work_id is null and match_status is UNMATCHED."
            - "The COMPOSITION work is untouched: rights_state UNMATCHED, provisional_match_by_user_id null."
            - "Batch: matched_play_count 3000 (1000 + 2000), unmatched_play_count 7000 (3000 + 4000), status PARTIALLY_MATCHED."

      - name: rate_schedule_selection_ignores_proposed_and_superseded_rows
        claim_type: input_set_filtering
        grounds:
          - calculations.rate_schedule_selection
          - validations.priority_28
          - errors.ERR_NO_EFFECTIVE_RATE_SCHEDULE
        distinguishing_aspect: |
          Selection reads status == EFFECTIVE only. A PROPOSED schedule that matches on territory,
          tier and window is invisible, so calculate fails with ERR_NO_EFFECTIVE_RATE_SCHEDULE while
          the matching row sits on disk; and once a successor is promulgated with
          supersede_incumbent, the SUPERSEDED predecessor becomes invisible too, so a re-calculate of
          the very same pool moves distributable_cents from 999999 to 857142 with no change to any
          usage or revenue input.
        test_recipe:
          setup:
            - "Period 2026-06 with one sealed batch carrying a single 450000-play GB/INDIVIDUAL line matched by exact ISRC, so the period is USAGE_SEALED."
            - "One GB/INDIVIDUAL schedule CRB-2026-01 (revenue_share_bps 7000, per_subscriber_minimum_cents 500, mechanical 4000, performance 6000, floor 100 millicents, 2026-01-01..2026-12-31) left PROPOSED."
            - "One pool GB/INDIVIDUAL with subscriber_count 1000 and gross_revenue_cents 1428570 in DRAFT."
          setup_api_calls:
            - call: "POST /royalties/periods"
              payload: { label: "2026-06", usage_start: "2026-06-01", usage_end: "2026-06-30" }
              as: RoyaltyAdmin
              captures: { per: "$.data.id" }
            - call: "POST /royalties/works"
              payload: { work_type: "RECORDING", identifier: "GBABC2600001", title: "Midnight Ledger", artist_credit: "The Reconcilers" }
              as: RightsOpsAnalyst
              captures: { w1: "$.data.id" }
            - call: "POST /royalties/usage-batches"
              payload: { period_id: "${per}", source_label: "UK client feed" }
              as: RightsOpsAnalyst
              captures: { ub: "$.data.id" }
            - call: "POST /royalties/usage-batches/${ub}/lines"
              payload: { reported_isrc: "GBABC2600001", reported_title: "Midnight Ledger", territory_code: "GB", subscription_tier: "INDIVIDUAL", play_count: 450000 }
              as: RightsOpsAnalyst
            - call: "POST /royalties/usage-batches/${ub}/seal"
              payload: {}
              as: RightsOpsAnalyst
            - call: "POST /royalties/usage-batches/${ub}/match"
              payload: {}
              as: RightsOpsAnalyst
              as_user_id: "analyst-fuzzy-1"
            - call: "POST /royalties/rate-schedules"
              payload: { proceeding_ref: "CRB-2026-01", territory_code: "GB", subscription_tier: "INDIVIDUAL", revenue_share_bps: 7000, per_subscriber_minimum_cents: 500, mechanical_share_bps: 4000, performance_share_bps: 6000, statutory_floor_per_play_millicents: 100, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RegulatoryOfficer
              captures: { rs1: "$.data.id", rst1: "$.data.status" }
            - call: "POST /royalties/pools"
              payload: { period_id: "${per}", territory_code: "GB", subscription_tier: "INDIVIDUAL", subscriber_count: 1000, gross_revenue_cents: 1428570 }
              as: RoyaltyAdmin
              captures: { pl: "$.data.id" }
          trigger:
            - name: calculate_with_only_a_proposed_schedule_rejected
              call: "POST /royalties/pools/${pl}/calculate"
              payload: {}
              as: RoyaltyAdmin
              captures: { err: "$.data.error_id" }
            - call: "POST /royalties/rate-schedules/${rs1}/promulgate"
              payload: {}
              as: RegulatoryOfficer
              captures: { rst2: "$.data.status" }
            - call: "POST /royalties/pools/${pl}/calculate"
              payload: {}
              as: RoyaltyAdmin
              captures: { app1: "$.data.applied_rate_schedule_id", d1: "$.data.distributable_cents", b1: "$.data.allocation_basis", pst1: "$.data.status" }
            - call: "POST /royalties/rate-schedules"
              payload: { proceeding_ref: "CRB-2026-07-REMAND", territory_code: "GB", subscription_tier: "INDIVIDUAL", revenue_share_bps: 6000, per_subscriber_minimum_cents: 500, mechanical_share_bps: 4000, performance_share_bps: 6000, statutory_floor_per_play_millicents: 100, effective_from: "2026-06-01", effective_to: "2026-12-31" }
              as: RegulatoryOfficer
              captures: { rs2: "$.data.id" }
            - call: "POST /royalties/rate-schedules/${rs2}/promulgate"
              payload: { supersede_incumbent: true }
              as: RegulatoryOfficer
              captures: { rst3: "$.data.status" }
            - call: "GET /royalties/rate-schedules/${rs1}"
              payload: {}
              as: RegulatoryOfficer
              captures: { rst4: "$.data.status" }
            - call: "POST /royalties/pools/${pl}/calculate"
              payload: {}
              as: RoyaltyAdmin
              captures: { app2: "$.data.applied_rate_schedule_id", d2: "$.data.distributable_cents", b2: "$.data.allocation_basis", pst2: "$.data.status" }
          assert:
            - "First calculate: HTTP 422 with error_id ERR_NO_EFFECTIVE_RATE_SCHEDULE — the PROPOSED row matches territory, tier and window but is excluded by status; the pool stays DRAFT with distributable_cents 0."
            - "After promulgate, the same call succeeds: applied_rate_schedule_id is CRB-2026-01, revenue_share_pool_cents = round_half_up(1428570 * 7000 / 10000) = 999999, minimum_pool_cents = 1000 * 500 = 500000, cap = 3 * 500000 = 1500000, statutory_floor_cents = ceil(450000 * 100 / 1000) = 45000, so distributable_cents 999999 with allocation_basis REVENUE_SHARE and status CALCULATED."
            - "Promulgating the remand schedule with supersede_incumbent true succeeds (its statutory floor 100 equals the incumbent's, so the priority-16 ratchet is satisfied, and the priority-23 overlap of the two closed 2026 windows is waived by the flag); CRB-2026-01 is now SUPERSEDED."
            - "Third calculate (CALCULATED -> CALCULATED self-loop): applied_rate_schedule_id is now CRB-2026-07-REMAND and distributable_cents is 857142 = round_half_up(1428570 * 6000 / 10000), still allocation_basis REVENUE_SHARE — a 142857-cent swing caused purely by the status change of two schedule rows."

