              payload: {}
              as: PlatformAdmin
            - call: "POST /pod/listings"
              payload: { storefront_id: "${sf_id}", design_id: "${design2_id}", variant_id: "${var_id}", title: "G Tee v2" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { listing2_id: $.data.id }
            - call: "POST /pod/listings/${listing2_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "${creator_id}"
