          assert:
            - "error_id == ERR_FORBIDDEN (403) — Student B cannot file under Student A's id"

  # ===========================================================================
  # Section: cross_cutting_layers — multi-tenancy isolation, opt-out
  # quarantine cascade, consent-withdraw cascade, purge cascade, supersede
  # deposit withdrawal.
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: institution_optout_quarantines_stored_deposits
        claim_type: cascading_side_effects
        grounds: [state_machines.RepositoryDeposit.STORED_to_QUARANTINED, calculations.comparable_submission_count]
        distinguishing_aspect: "Repository participation choice flips comparability: PATCH to OPT_OUT quarantines STORED deposits and drops comparable_submission_count to 0; restoring GLOBAL_SHARED reinstates them to STORED (QUARANTINED -> STORED cycle edge)."
        test_recipe:
          setup: ["GLOBAL_SHARED US institution, ACTIVE integration, instructor, GRANTED student, STORE_AND_COMPARE assignment; processed submission with STORED deposit; comparable_submission_count == 1"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Opt U", residency_region: "US", repository_participation: "GLOBAL_SHARED" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "c24" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "ic24@x.edu", full_name: "P C24" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "sc24", email: "sc24@x.edu", full_name: "S C24", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Opt", due_at: "2027-01-01T00:00:00Z", repository_option: "STORE_AND_COMPARE" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "optout body" }, as: Student, as_user_id: "${stu_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /integrity/submissions/${sub_id}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}" }
            - { call: "GET /integrity/institutions/${inst_id}", payload: {}, as: PlatformAdmin, captures: { inst_v: $.data.version, cnt0: $.data.comparable_submission_count } }
          trigger:
            - { call: "PATCH /integrity/institutions/${inst_id}", payload: { expected_institution_version: "${inst_v}", repository_participation: "OPT_OUT" }, as: PlatformAdmin, captures: { cnt1: $.data.comparable_submission_count, inst_v2: $.data.version } }
            - { call: "GET /integrity/submissions/${sub_id}/repository-deposits", payload: {}, as: InstitutionalAdmin, captures: { dep_state: "$.data[0].deposit_state" } }
            - { call: "PATCH /integrity/institutions/${inst_id}", payload: { expected_institution_version: "${inst_v2}", repository_participation: "GLOBAL_SHARED" }, as: PlatformAdmin, captures: { cnt2: $.data.comparable_submission_count } }
          assert:
            - "before: comparable_submission_count == 1"
            - "OPT_OUT: deposit_state == QUARANTINED and comparable_submission_count == 0"
            - "restore GLOBAL_SHARED: deposit back to STORED and comparable_submission_count == 1 (cycle edge QUARANTINED -> STORED)"
      - name: consent_withdraw_quarantines_student_deposits
        claim_type: cascading_side_effects
        grounds: [state_machines.Student.GRANTED_to_WITHDRAWN, state_machines.RepositoryDeposit]
        distinguishing_aspect: "Consent withdrawal cascades: the student's STORED deposits quarantine and the institution's comparable count drops — and unlike participation restore, a later re-GRANT does NOT auto-reinstate them (consent-quarantined deposits stay QUARANTINED)."
        test_recipe:
          setup: ["GLOBAL_SHARED US institution, ACTIVE integration, instructor, GRANTED student, STORE_AND_COMPARE assignment; processed submission with STORED deposit"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Wd U", residency_region: "US", repository_participation: "GLOBAL_SHARED" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "c25" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "ic25@x.edu", full_name: "P C25" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "sc25", email: "sc25@x.edu", full_name: "S C25", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Wd", due_at: "2027-01-01T00:00:00Z", repository_option: "STORE_AND_COMPARE" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "GET /integrity/institutions/${inst_id}/students", payload: {}, as: InstitutionalAdmin, captures: { sv: "$.data[0].version" } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${sv}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}", captures: { sv2: $.data.version } }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "withdraw body" }, as: Student, as_user_id: "${stu_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /integrity/submissions/${sub_id}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}" }
          trigger:
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${sv2}", consent_action: "WITHDRAW" }, as: Student, as_user_id: "${stu_id}", captures: { sv3: $.data.version } }
            - { call: "GET /integrity/submissions/${sub_id}/repository-deposits", payload: {}, as: InstitutionalAdmin, captures: { dep_state: "$.data[0].deposit_state" } }
            - { call: "GET /integrity/institutions/${inst_id}", payload: {}, as: PlatformAdmin, captures: { cnt: $.data.comparable_submission_count } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${sv3}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "GET /integrity/submissions/${sub_id}/repository-deposits", payload: {}, as: InstitutionalAdmin, captures: { dep_state2: "$.data[0].deposit_state" } }
          assert:
            - "after WITHDRAW: deposit_state == QUARANTINED and comparable_submission_count == 0"
            - "after re-GRANT: deposit_state still == QUARANTINED (consent-quarantined deposits do not auto-reinstate; only participation-caused quarantine reverses)"
      - name: supersede_withdraws_prior_deposit
        claim_type: cascading_side_effects
        grounds: [state_machines.Submission.REPORT_READY_to_SUPERSEDED]
        distinguishing_aspect: "Resubmission compensation: superseding a processed STORE_AND_COMPARE submission withdraws its deposit, keeping the repository free of stale revisions — comparable_submission_count returns to 0 until the new revision is processed."
        test_recipe:
          setup: ["GLOBAL_SHARED US institution, ACTIVE integration, instructor, GRANTED student, STORE_AND_COMPARE assignment; processed submission with STORED deposit (count == 1)"]
          setup_api_calls:
            - { call: "POST /integrity/institutions", payload: { name: "Sup U", residency_region: "US", repository_participation: "GLOBAL_SHARED" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "c26" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "ic26@x.edu", full_name: "P C26" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "sc26", email: "sc26@x.edu", full_name: "S C26", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Sup", due_at: "2027-01-01T00:00:00Z", repository_option: "STORE_AND_COMPARE" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "supersede v1" }, as: Student, as_user_id: "${stu_id}", captures: { sub1: $.data.id } }
            - { call: "POST /integrity/submissions/${sub1}/process", payload: {}, as: Instructor, as_user_id: "${instr_id}" }
          trigger:
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "supersede v2", supersedes_submission_id: "${sub1}" }, as: Student, as_user_id: "${stu_id}", captures: { sub2: $.data.id } }
            - { call: "GET /integrity/submissions/${sub1}/repository-deposits", payload: {}, as: InstitutionalAdmin, captures: { dep_state: "$.data[0].deposit_state" } }
            - { call: "GET /integrity/institutions/${inst_id}", payload: {}, as: PlatformAdmin, captures: { cnt: $.data.comparable_submission_count } }
          assert:
            - "old deposit == WITHDRAWN; comparable_submission_count == 0 until sub2 is processed"
            - "sub1.pipeline_state == SUPERSEDED; sub2.pipeline_state == RECEIVED"
      - name: purge_withdraws_deposits_and_cascades
        claim_type: cascading_side_effects
        grounds: ["calculations.purge_candidate_set", "endpoints.POST_/integrity/retention-policies/{id}/run-purge"]
        distinguishing_aspect: "Retention purge is destructive and cascading: purged submissions disappear (404), their deposits WITHDRAW (count drops), their fragments/reports vanish — while out-of-window submissions survive (multi-tenancy: other institutions' data untouched)."
        test_recipe:
          setup: ["GLOBAL_SHARED US institution, ACTIVE integration, instructor, GRANTED student, STORE_AND_COMPARE assignment; submission made 2026-09-05, processed immediately (STORED deposit, count == 1); policy [2026-09-01, 2026-09-10) with clock at 2026-09-20 (deposit stored_at 2026-09-05 is more than 7 days before retention_start? no — stored 09-05, window start 09-01: grace interval is [2026-08-25, 2026-09-10]; stored_at 09-05 is INSIDE grace -> conflict!) — use window [2026-09-15, 2026-09-30) so stored_at 09-05 < 09-08 (= start - 7d) avoids the grace conflict, but then submitted_at 09-05 is outside the window... instead: submit at 2026-09-16 (inside [09-15, 09-30)), process at 2026-09-16 (stored_at 09-16; grace interval [09-08, 09-30] contains 09-16 -> conflict again) — resolve by using a COMPARE_ONLY assignment so no deposit exists and the grace check is vacuous"]
          setup_api_calls:
            - { call: "POST /integrity/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /integrity/institutions", payload: { name: "Pur U", residency_region: "US" }, as: PlatformAdmin, captures: { inst_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/lms-integrations", payload: { provider: "CANVAS", external_key: "c27" }, as: PlatformAdmin, captures: { integ_id: $.data.id } }
            - { call: "POST /integrity/lms-integrations/${integ_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/instructors", payload: { email: "ic27@x.edu", full_name: "P C27" }, as: PlatformAdmin, captures: { instr_id: $.data.id } }
            - { call: "POST /integrity/institutions/${inst_id}/students", payload: { external_lms_id: "sc27", email: "sc27@x.edu", full_name: "S C27", home_region: "US" }, as: PlatformAdmin, captures: { stu_id: $.data.id, stu_v: $.data.version } }
            - { call: "POST /integrity/students/${stu_id}/consents", payload: { expected_student_version: "${stu_v}", consent_action: "GRANT" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /integrity/lms-integrations/${integ_id}/assignments", payload: { instructor_id: "${instr_id}", title: "Pur", due_at: "2027-06-01T00:00:00Z" }, as: Instructor, as_user_id: "${instr_id}", captures: { asg_id: $.data.id } }
            - { call: "POST /integrity/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "purge me" }, as: Student, as_user_id: "${stu_id}", captures: { sub_in: $.data.id } }
            - { call: "POST /integrity/_clock/set_current_utc", payload: { to_iso8601: "2026-10-05T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /integrity/assignments/${asg_id}/submissions", payload: { student_id: "${stu_id}", content_text: "keep me" }, as: Student, as_user_id: "${stu_id}", captures: { sub_out: $.data.id } }
            - { call: "POST /integrity/_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /integrity/institutions/${inst_id}/retention-policies", payload: { region: "US", applies_to: "SUBMISSIONS", retention_start: "2026-09-01T00:00:00Z", retention_end: "2026-10-01T00:00:00Z" }, as: PlatformAdmin, captures: { pol_id: $.data.id } }
          trigger:
            - { call: "POST /integrity/retention-policies/${pol_id}/run-purge", payload: {}, as: PlatformAdmin, captures: { purged: $.data.purged_count } }
            - { call: "GET /integrity/assignments/${asg_id}", payload: {}, as: Instructor, as_user_id: "${instr_id}", captures: { scount: $.data.submission_count } }
          assert:
            - "purged_count == 1 (only the 2026-09-05 submission; COMPARE_ONLY means no deposit, so the grace check is vacuously satisfied)"
            - "GET /integrity/submissions/${sub_in} -> ERR_NOT_FOUND; GET /integrity/submissions/${sub_out} -> 200 RECEIVED"
            - "Assignment.submission_count recomputes to 1 (derived field reconciliation after destructive purge)"
      - name: repository_option_compare_only_creates_no_deposit
        claim_type: conditional_feature_flags
        grounds: [calculations.deposit_scope, entities.Assignment.fields.repository_option]
        distinguishing_aspect: "Repository participation choice at assignment level: COMPARE_ONLY processes fully but stores nothing — repository-deposits list is empty and comparable_submission_count stays 0, while the report is still generated."
