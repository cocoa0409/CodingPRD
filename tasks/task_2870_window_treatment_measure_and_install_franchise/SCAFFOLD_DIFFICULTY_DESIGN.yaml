              as: Designer
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "Racked bay window", room_type: "LIVING_ROOM", mount_type: "INSIDE", width_top_in: 24.000, width_middle_in: 24.500, width_bottom_in: 24.100, height_left_in: 48.000, height_center_in: 48.100, height_right_in: 48.050, depth_in: 3.000 }
              as: Designer
              as_user_id: "${d1}"
              captures: { o1: $.data.id }
            - call: "PATCH /blinds/openings/${o1}/configuration"
              payload: { fabric_code: "LT-SHEER", lift_system: "CORDED", motorization_option: "NONE" }
