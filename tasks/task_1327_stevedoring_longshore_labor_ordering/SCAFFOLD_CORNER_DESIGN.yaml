              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_GANG_ORDER_VERSION, HTTP 412 (observed version 1, current version 2)"
            - "GangOrder.${g}.version remains 2 and offered_count remains 2"

      - name: occ_amend_with_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[gang-order-amend-stale]
          - errors[ERR_STALE_GANG_ORDER_VERSION]
        distinguishing_aspect: "PATCH is OCC-guarded on the same parent as dispatch-batch but through a different write endpoint; a version advanced by a dispatch batch invalidates the amendment."
        test_recipe:
          setup: ["Gang G created (version 1), then a dispatch batch advanced it to 2"]
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV Occ2", voyage_number: "X-602", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 10, planned_tons: 5, contracted_mph_target: 20.0, credit_limit_cents: 1000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
            - call: "POST /api/vessel-calls/${v}/berth"
              as: StevedoreSuperintendent
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "DAY", start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
              captures: { s: $.data.id }
            - call: "POST /api/shift-windows/${s}/open-for-orders"
              as: StevedoreSuperintendent
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s}", gang_type: "GENERAL", required_classification: "HOLDMAN", required_headcount: 1, required_equipment_type: "RTG", required_equipment_count: 0 }
              as: StevedoreSuperintendent
              captures: { g: $.data.id, g_v: $.data.version }
            - call: "POST /api/workers"
              payload: { full_name: "W One", registration_number: "R001", classification: "HOLDMAN", registered_on: "2010-01-01", base_hourly_rate_cents: 4000 }
              as: StevedoreAdmin
            - call: "POST /api/gang-orders/${g}/dispatch-batch"
              payload: { expected_gang_order_version: "${g_v}" }
              as: LaborHallDispatcher
          trigger:
            - call: "PATCH /api/gang-orders/${g}"
              payload: { required_headcount: 3, expected_gang_order_version: "${g_v}" }
              as: StevedoreSuperintendent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_GANG_ORDER_VERSION, HTTP 412"
            - "GangOrder.${g}.required_headcount remains 1 and version remains 2"

      - name: occ_correct_version_amend_succeeds_and_increments
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[gang-order-amend-stale]
        distinguishing_aspect: "Happy-path counterpart: the amendment carrying the current version succeeds and the response itself shows version advanced from 1 to 2 (immediate consistency)."
        test_recipe:
          setup: ["Gang G PLACED, version 1, no dispatch yet"]
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV Occ3", voyage_number: "X-603", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 10, planned_tons: 5, contracted_mph_target: 20.0, credit_limit_cents: 1000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
            - call: "POST /api/vessel-calls/${v}/berth"
              as: StevedoreSuperintendent
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "DAY", start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
              captures: { s: $.data.id }
            - call: "POST /api/shift-windows/${s}/open-for-orders"
              as: StevedoreSuperintendent
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s}", gang_type: "GENERAL", required_classification: "HOLDMAN", required_headcount: 1, required_equipment_type: "RTG", required_equipment_count: 0 }
              as: StevedoreSuperintendent
              captures: { g: $.data.id, g_v: $.data.version }
          trigger:
            - call: "PATCH /api/gang-orders/${g}"
              payload: { required_headcount: 3, expected_gang_order_version: "${g_v}" }
              as: StevedoreSuperintendent
              captures: { new_v: $.data.version }
          assert:
            - "HTTP 200; GangOrder.${g}.required_headcount == 3 and version == 2 (was 1)"
            - "status remains PLACED (manning derivation does not run before dispatch)"

      - name: occ_worker_status_replay_with_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[worker-status-stale]
          - errors[ERR_STALE_WORKER_VERSION]
        distinguishing_aspect: "A suspend advances Worker.version; replaying a second status change with the pre-suspend version is rejected so a stale reinstate cannot silently overwrite the suspension."
        test_recipe:
          setup: ["Worker W1 created (version 1), then suspended via OCC (version 2)"]
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { full_name: "W One", registration_number: "R001", classification: "HOLDMAN", registered_on: "2010-01-01", base_hourly_rate_cents: 4000 }
              as: StevedoreAdmin
              captures: { w1: $.data.id, w1_v: $.data.version }
            - call: "PATCH /api/workers/${w1}"
              payload: { status: "SUSPENDED", expected_worker_version: "${w1_v}" }
              as: StevedoreAdmin
          trigger:
            - call: "PATCH /api/workers/${w1}"
              payload: { status: "ACTIVE", expected_worker_version: "${w1_v}" }
              as: StevedoreAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_WORKER_VERSION, HTTP 412"
            - "Worker.${w1}.status remains SUSPENDED and version remains 2"

      - name: occ_invoice_adjustment_replay_with_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[invoice-adjust-stale]
          - errors[ERR_STALE_INVOICE_VERSION]
        distinguishing_aspect: "The first adjustment applies (+500) and advances the invoice version; the identical replay with the same expected version is rejected, preventing a double-applied adjustment against one baseline."
        test_recipe:
          setup: ["Invoice DRAFT on a BERTHED vessel (version 1)"]
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV Occ4", voyage_number: "X-604", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 10, planned_tons: 5, contracted_mph_target: 20.0, credit_limit_cents: 1000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
            - call: "POST /api/vessel-calls/${v}/berth"
              as: StevedoreSuperintendent
            - call: "POST /api/invoices"
              payload: { vessel_call_id: "${v}" }
              as: BillingClerk
              captures: { inv: $.data.id, inv_v: $.data.version }
          trigger:
            - call: "PATCH /api/invoices/${inv}"
              payload: { adjustment_cents: 500, reason: "Documentation fee", expected_invoice_version: "${inv_v}" }
              as: BillingClerk
              captures: { adj_total: $.data.adjustment_total_cents }
            - call: "PATCH /api/invoices/${inv}"
              payload: { adjustment_cents: 500, reason: "Documentation fee", expected_invoice_version: "${inv_v}" }
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "First adjustment: adjustment_total_cents == 500, version == 2"
            - "Replayed adjustment with the same expected version: error_id == ERR_STALE_INVOICE_VERSION, HTTP 412; adjustment_total_cents stays 500"

      - name: no_show_retry_excludes_the_no_show_worker
        claim_type: selector_policy
        grounds:
          - calculations.dispatch_selection
          - state_machines.DispatchAssignment.OFFERED_to_NO_SHOW
        distinguishing_aspect: "Retry exclusion: after W1 is marked NO_SHOW, the automatic single-slot re-offer goes to W2 — the selector never re-offers a worker who already no-showed on the same gang order."
        test_recipe:
          setup: ["Shift IN_PROGRESS; gang G headcount 1 with W1 OFFERED; W2 next in seniority"]
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV NoShow", voyage_number: "X-605", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 10, planned_tons: 5, contracted_mph_target: 20.0, credit_limit_cents: 1000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
            - call: "POST /api/vessel-calls/${v}/berth"
              as: StevedoreSuperintendent
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "DAY", start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
              captures: { s: $.data.id }
            - call: "POST /api/shift-windows/${s}/open-for-orders"
              as: StevedoreSuperintendent
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s}", gang_type: "GENERAL", required_classification: "HOLDMAN", required_headcount: 1, required_equipment_type: "RTG", required_equipment_count: 0 }
              as: StevedoreSuperintendent
              captures: { g: $.data.id, g_v: $.data.version }
            - call: "POST /api/workers"
              payload: { full_name: "W One", registration_number: "R001", classification: "HOLDMAN", registered_on: "2010-01-01", base_hourly_rate_cents: 4000 }
              as: StevedoreAdmin
              captures: { w1: $.data.id }
            - call: "POST /api/workers"
              payload: { full_name: "W Two", registration_number: "R002", classification: "HOLDMAN", registered_on: "2015-06-01", base_hourly_rate_cents: 4000 }
              as: StevedoreAdmin
              captures: { w2: $.data.id }
            - call: "POST /api/gang-orders/${g}/dispatch-batch"
              payload: { expected_gang_order_version: "${g_v}" }
              as: LaborHallDispatcher
            - call: "GET /api/dispatch-assignments?gang_order_id=${g}"
              as: LaborHallDispatcher
              captures: { a1: "$.data[0].id" }
            - call: "POST /api/shift-windows/${s}/start"
              as: StevedoreSuperintendent
          trigger:
            - call: "POST /api/dispatch-assignments/${a1}/no-show"
              as: LaborHallDispatcher
            - call: "GET /api/dispatch-assignments?gang_order_id=${g}"
              as: LaborHallDispatcher
              captures: { second_w: "$.data[1].worker_id", second_st: "$.data[1].status" }
          assert:
            - "DispatchAssignment.${a1}.status == NO_SHOW"
            - "The auto-created assignment (list position 2) has worker_id == ${w2} and status OFFERED — W1 is excluded from the retry pool"
            - "GangOrder.${g}.offered_count == 1 (the replacement), filled_headcount == 0"

      - name: amendment_reduction_bumps_least_senior_first
        claim_type: cascading_side_effects
        grounds:
          - state_machines.DispatchAssignment.CHECKED_IN_to_BUMPED
          - calculations.filled_headcount
        distinguishing_aspect: "The amendment bump waterfall orders by seniority_rank_at_dispatch DESC: with W1 (rank 1) and W2 (rank 2) both CHECKED_IN and headcount cut from 2 to 1, W2 is bumped and W1 retained; no auto-offer is created for amendment bumps."
        test_recipe:
          setup: ["Shift IN_PROGRESS; gang G headcount 2, MANNED with W1 and W2 CHECKED_IN"]
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV Amend", voyage_number: "X-606", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 10, planned_tons: 5, contracted_mph_target: 20.0, credit_limit_cents: 1000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
            - call: "POST /api/vessel-calls/${v}/berth"
              as: StevedoreSuperintendent
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "DAY", start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
              captures: { s: $.data.id }
            - call: "POST /api/shift-windows/${s}/open-for-orders"
              as: StevedoreSuperintendent
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s}", gang_type: "GENERAL", required_classification: "HOLDMAN", required_headcount: 2, required_equipment_type: "RTG", required_equipment_count: 0 }
              as: StevedoreSuperintendent
              captures: { g: $.data.id, g_v: $.data.version }
            - call: "POST /api/workers"
              payload: { full_name: "W One", registration_number: "R001", classification: "HOLDMAN", registered_on: "2010-01-01", base_hourly_rate_cents: 4000 }
              as: StevedoreAdmin
              captures: { w1: $.data.id }
            - call: "POST /api/workers"
              payload: { full_name: "W Two", registration_number: "R002", classification: "HOLDMAN", registered_on: "2015-06-01", base_hourly_rate_cents: 4000 }
              as: StevedoreAdmin
              captures: { w2: $.data.id }
            - call: "POST /api/gang-orders/${g}/dispatch-batch"
              payload: { expected_gang_order_version: "${g_v}" }
              as: LaborHallDispatcher
            - call: "GET /api/dispatch-assignments?gang_order_id=${g}"
              as: LaborHallDispatcher
              captures: { a1: "$.data[0].id", a2: "$.data[1].id" }
            - call: "POST /api/shift-windows/${s}/start"
              as: StevedoreSuperintendent
            - call: "POST /api/dispatch-assignments/${a1}/check-in"
              as: LaborHallDispatcher
            - call: "POST /api/dispatch-assignments/${a2}/check-in"
              as: LaborHallDispatcher
            - call: "GET /api/gang-orders/${g}"
              as: StevedoreSuperintendent
              captures: { g_v_now: $.data.version }
          trigger:
            - call: "PATCH /api/gang-orders/${g}"
              payload: { required_headcount: 1, expected_gang_order_version: "${g_v_now}" }
              as: StevedoreSuperintendent
          assert:
            - "DispatchAssignment.${a2} (W2, seniority_rank_at_dispatch 2) -> BUMPED — least senior bumped first"
            - "DispatchAssignment.${a1} (W1, rank 1) remains CHECKED_IN"
            - "GangOrder.${g}: required_headcount == 1, filled_headcount == 1, status == MANNED, offered_count == 0 (no auto-offer for amendment bumps)"
            - "GET /api/dispatch-assignments?gang_order_id=${g} returns exactly 2 rows (no replacement offer created)"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: mutations_are_visible_in_the_same_response
        claim_type: immediate_consistency
        grounds:
          - complexity_profile
        distinguishing_aspect: "Immediate consistency: the PATCH response body itself reflects the mutation (headcount 3, version 2) with no re-read; likewise a check-in response shows CHECKED_IN, not a stale snapshot."
        test_recipe:
          setup: ["Gang G PLACED version 1"]
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV Imm", voyage_number: "X-701", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 10, planned_tons: 5, contracted_mph_target: 20.0, credit_limit_cents: 1000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
            - call: "POST /api/vessel-calls/${v}/berth"
              as: StevedoreSuperintendent
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "DAY", start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
              captures: { s: $.data.id }
            - call: "POST /api/shift-windows/${s}/open-for-orders"
              as: StevedoreSuperintendent
            - call: "POST /api/gang-orders"
              payload: { shift_window_id: "${s}", gang_type: "GENERAL", required_classification: "HOLDMAN", required_headcount: 1, required_equipment_type: "RTG", required_equipment_count: 0 }
              as: StevedoreSuperintendent
              captures: { g: $.data.id, g_v: $.data.version }
          trigger:
            - call: "PATCH /api/gang-orders/${g}"
              payload: { required_headcount: 3, expected_gang_order_version: "${g_v}" }
              as: StevedoreSuperintendent
              captures: { hc: $.data.required_headcount, vv: $.data.version }
          assert:
            - "PATCH response body: required_headcount == 3 and version == 2 in the same envelope"
            - "A subsequent GET /api/gang-orders/${g} shows identical values (no drift between write response and read)"

  # ---------------------------------------------------------------------------
  # Stubs for corners already covered by §1.8 difficulty instances
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: invoice_dual_variant_covered
        claim_type: variant_divergence
        grounds:
          - calculations.invoice_calculation
        excluded_because:
          difficulty_instance: invoice_provisional_vs_final_totals
          rationale: "Provisional-vs-final divergence with literal totals asserted in §1.8."
      - name: claim_dual_variant_covered
        claim_type: variant_divergence
        grounds:
          - calculations.damage_liability
        excluded_because:
          difficulty_instance: claim_provisional_5050_vs_fault_weighted
          rationale: "Provisional 50/50 vs fault-weighted final liability asserted in §1.8."
      - name: invoice_rounding_order_covered
        claim_type: precision
        grounds:
          - calculations.invoice_calculation
        excluded_because:
          difficulty_instance: invoice_manhour_line_rounded_once_after_sum
          rationale: "Sum-then-round pinning with the 1-cent divergence asserted in §1.8."
      - name: bonus_threshold_and_ot_boundary_covered
        claim_type: precision
        grounds:
          - calculations.productivity_bonus
          - calculations.payroll_gross_pay
        excluded_because:
          difficulty_instance: bonus_eligible_at_exact_mph_target_with_zero_pool
          rationale: "Exact-threshold MPH bonus and exact-480 OT boundary both asserted in §1.8."

  - section: state_machines
    instances:
      - name: stoppage_suspend_cycle_covered
        claim_type: valid_transition
        grounds:
          - state_machines.GangOrder.WORKING_to_SUSPENDED
          - state_machines.GangOrder.SUSPENDED_to_WORKING
        excluded_because:
          difficulty_instance: gang_order_suspend_resume_cycle_requires_equipment_reacquisition
          rationale: "The WORKING<->SUSPENDED cycle including equipment re-acquisition is asserted in §1.8."
      - name: timesheet_rework_cycle_covered
        claim_type: valid_transition
        grounds:
          - state_machines.TimesheetEntry.REJECTED_to_SUBMITTED
        excluded_because:
          difficulty_instance: timesheet_reject_resubmit_recompute_cycle
          rationale: "The reject->resubmit->approve loop is asserted in §1.8."

  - section: validations
    instances:
      - name: safety_vs_state_priority_covered
        claim_type: priority_ordering
        grounds:
          - validations[priority=6]
          - validations[priority=7]
        excluded_because:
          difficulty_instance: state_error_beats_safety_error_on_start_work
          rationale: "Dual-failure priority between state and safety asserted in §1.8."
      - name: double_booking_temporal_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_WORKER_DOUBLE_BOOKED]
        excluded_because:
          difficulty_instance: worker_half_open_shift_overlap_adjacency_allowed
          rationale: "Half-open overlap semantics (adjacency pass + overlap rejection) asserted in §1.8."
      - name: equipment_buffer_conflict_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_EQUIPMENT_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: equipment_buffered_window_thirty_minute_gap_rule
          rationale: "The 30-minute buffer boundary (0-minute gap rejected, exact 30 allowed) asserted in §1.8."
      - name: gang_full_boundary_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_GANG_FULL]
        excluded_because:
          difficulty_instance: checkin_rejected_exactly_at_full_headcount
          rationale: "ERR_GANG_FULL at filled == required asserted in §1.8."
