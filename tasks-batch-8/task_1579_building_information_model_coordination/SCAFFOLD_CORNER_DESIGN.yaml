        distinguishing_aspect: "OCC on Project.version: after F1's creation advances the project version, a second federated-create carrying the stale observed version is rejected 412 ERR_STALE_PROJECT_VERSION and does NOT supersede F1."
        test_recipe:
          setup: ["project P (version captured at creation); partner P1; M1 ACCEPTED"]
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "CL1" }, as: VDCManager, captures: { pid: $.data.id, pv: $.data.version } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "StructCo", discipline: STRUCTURAL, hourly_rate_cents: 12000, coordination_budget_hours: 100.0, software_platform: REVIT }, as: VDCManager, captures: { p1: $.data.id } }
