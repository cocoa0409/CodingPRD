              payload: { code: "HUR-01", peril: "HURRICANE", exposure_cap_cents: 900000000 }
              as: PlanAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /fair-plan/assessment-events"
              payload: { cat_zone_id: "${zone_id}", trigger_loss_cents: 200000000, reserve_balance_cents_at_trigger: 100000000, allocation_basis: "MARKET_SHARE" }
              as: PlanAdmin
              captures: { ev1_id: $.data.id, ev1_v: $.data.version }
            - call: "POST /fair-plan/assessment-events/${ev1_id}/allocation-run"
              payload: { expected_assessment_event_version: "${ev1_v}" }
              as: PlanAdmin
            - call: "POST /fair-plan/assessment-events/${ev1_id}/invoicing"
              payload: {}
              as: PlanAdmin
            - call: "GET /fair-plan/member-insurers/${m1_id}/allocations"
              payload: { limit: 10, offset: 0 }
              as: MemberInsurerUser
              as_user_id: "${m1_id}"
              captures: { alloc1_id: "$.data[0].id" }
          trigger:
            - call: "POST /fair-plan/assessment-allocations/${alloc1_id}/payment"
              payload: { amount_cents: 29999999 }
              as: MemberInsurerUser
              as_user_id: "${m1_id}"
              captures: { pay_err: $.data.error_id }
            - call: "POST /fair-plan/assessment-events"
              payload: { cat_zone_id: "${zone_id}", trigger_loss_cents: 200000000, reserve_balance_cents_at_trigger: 100000000, allocation_basis: "PREMIUM_VOLUME" }
              as: PlanAdmin
              captures: { ev2_id: $.data.id, ev2_v: $.data.version }
            - call: "POST /fair-plan/assessment-events/${ev2_id}/allocation-run"
              payload: { expected_assessment_event_version: "${ev2_v}" }
              as: PlanAdmin
              captures: { basis_err: $.data.error_id }
          assert:
            - "the underpayment returns status 422 with ${pay_err} == ERR_PAYMENT_AMOUNT_MISMATCH"
            - "AssessmentAllocation.${alloc1_id}.net_due_cents == 30000000 and status == PENDING with paid_at null"
            - "AssessmentEvent.${ev1_id}.status == INVOICED (no settlement)"
            - "the PREMIUM_VOLUME allocation-run returns status 422 with ${basis_err} == ERR_NO_ASSESSABLE_MEMBERS"
            - "AssessmentEvent.${ev2_id}.status == DRAFT with allocation_run_count == 0 and allocated_total_cents == 0"
            - "GET /fair-plan/assessment-events/${ev2_id}/allocations as PlanAdmin reports total_count == 0"

