              payload: { offer_code: "SMALL100", discount_cents: 100, duration_months: 3, max_redemptions_per_account: 1, eligible_biller_types: ["PLATFORM"], eligible_plan_kinds: ["STANDALONE"] }
              as: PlatformAdmin
