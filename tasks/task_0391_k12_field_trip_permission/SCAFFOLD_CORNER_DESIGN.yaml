# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_0391_k12_field_trip_permission — Expert tier
#
# Breadth probe over every testable claim in §1.1–§1.7 NOT already covered by the
# 18 §1.8 depth instances. Section/claim_type values are drawn from
# references/claim-extraction-guide.md. excluded_because: stubs cite a §1.8
# instance by name. Every active instance's setup_api_calls resolves to §1.5 and
# every formula-derived assert is a pre-computed literal.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_field_trip_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.FieldTrip, endpoints]
        distinguishing_aspect: "POST /field-trips with required fields → 201; status DRAFT, version 1, signed_count 0, collected_fees_cents 0; deposit_cents defaults 0, has_water_activity defaults false."
        test_recipe:
          setup: ["A guardian to act as organizing teacher."]
          setup_api_calls:
            - call: "POST /guardians"
              payload: { full_name: "TC1", email: "tc1@x.com", phone: "555-2001" }
              as: DistrictAdmin
              captures: { teach_g: $.data.id }
          trigger:
            - call: "POST /field-trips"
              payload: { title: "Create", organizer_teacher_id: "${teach_g}", school_code: "SCH1", grade_band: "MIDDLE", depart_at: "2026-11-01T09:00:00Z", return_at: "2026-11-01T12:00:00Z", capacity: 10, base_fee_cents: 0, transport_cost_cents: 0 }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { trip: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "HTTP status == 201"
            - "FieldTrip.${trip}.status == DRAFT"
            - "FieldTrip.${trip}.version == 1 and signed_count == 0 and collected_fees_cents == 0"
            - "FieldTrip.${trip}.deposit_cents == 0 and has_water_activity == false (defaults applied)"

      - name: create_field_trip_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds: [entities.FieldTrip.fields.capacity, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /field-trips omitting required capacity → ERR_VALIDATION (422); no trip created."
        test_recipe:
          setup: ["A guardian to act as organizing teacher."]
          setup_api_calls:
            - call: "POST /guardians"
              payload: { full_name: "TC2", email: "tc2@x.com", phone: "555-2002" }
              as: DistrictAdmin
              captures: { teach_g: $.data.id }
          trigger:
            - call: "POST /field-trips"
              payload: { title: "NoCap", organizer_teacher_id: "${teach_g}", school_code: "SCH1", grade_band: "MIDDLE", depart_at: "2026-11-01T09:00:00Z", return_at: "2026-11-01T12:00:00Z", base_fee_cents: 0, transport_cost_cents: 0 }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_VALIDATION"
            - "HTTP status == 422"

      - name: get_field_trip_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.FieldTrip, "errors[ERR_TRIP_NOT_FOUND]"]
        distinguishing_aspect: "GET /field-trips/{id} with a non-existent UUID → ERR_TRIP_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB; a known-bad UUID."]
          setup_api_calls: []
          trigger:
            - call: "GET /field-trips/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Teacher
              as_user_id: "00000000-0000-4000-8000-0000000000aa"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_TRIP_NOT_FOUND"
            - "HTTP status == 404"

      - name: list_field_trips_paginated_envelope
        claim_type: Listing
        grounds: [entities.FieldTrip, response_envelope.pagination_fields]
        distinguishing_aspect: "GET /field-trips returns response_type array with pagination fields total_count and has_more in meta/envelope."
        test_recipe:
          setup: ["One trip created."]
          setup_api_calls:
            - call: "POST /guardians"
              payload: { full_name: "TC3", email: "tc3@x.com", phone: "555-2003" }
              as: DistrictAdmin
              captures: { teach_g: $.data.id }
            - call: "POST /field-trips"
              payload: { title: "L", organizer_teacher_id: "${teach_g}", school_code: "SCH1", grade_band: "HIGH", depart_at: "2026-11-02T09:00:00Z", return_at: "2026-11-02T12:00:00Z", capacity: 5, base_fee_cents: 0, transport_cost_cents: 0 }
              as: Teacher
              as_user_id: "${teach_g}"
          trigger:
            - call: "GET /field-trips"
              payload: {}
              as: Principal
          assert:
            - "response_type == array"
            - "total_count >= 1 and has_more is present (boolean)"

      - name: field_trip_system_fields_ignored_on_input
        claim_type: System Fields
        grounds: [entities.FieldTrip.fields.status, entities.FieldTrip.fields.signed_count]
        distinguishing_aspect: "Client-supplied status/signed_count/version in create body are ignored; server forces status DRAFT, signed_count 0, version 1."
        test_recipe:
          setup: ["A guardian organizer."]
          setup_api_calls:
            - call: "POST /guardians"
              payload: { full_name: "TC4", email: "tc4@x.com", phone: "555-2004" }
              as: DistrictAdmin
              captures: { teach_g: $.data.id }
          trigger:
            - call: "POST /field-trips"
              payload: { title: "Sys", organizer_teacher_id: "${teach_g}", school_code: "SCH1", grade_band: "MIDDLE", depart_at: "2026-11-03T09:00:00Z", return_at: "2026-11-03T12:00:00Z", capacity: 5, base_fee_cents: 0, transport_cost_cents: 0 }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { trip: $.data.id, st: $.data.status }
          assert:
            - "FieldTrip.${trip}.status == DRAFT (any input status ignored)"
            - "FieldTrip.${trip}.signed_count == 0 and version == 1"

      - name: emergency_contact_immutable_no_version
        claim_type: Immutability
        grounds: [entities.EmergencyContact]
        distinguishing_aspect: "EmergencyContact has common_fields false → no version field, no update/delete endpoint; only id + created_at + declared fields."
        test_recipe:
          setup: ["Trip APPROVED-or-earlier with one slip; add an emergency contact."]
          setup_api_calls:
            - call: "POST /guardians"
              payload: { full_name: "TC5", email: "tc5@x.com", phone: "555-2005" }
              as: DistrictAdmin
              captures: { teach_g: $.data.id }
            - call: "POST /guardians"
              payload: { full_name: "G5", email: "g5@x.com", phone: "555-2105" }
              as: DistrictAdmin
              captures: { g_a: $.data.id }
            - call: "POST /students"
              payload: { full_name: "S5", grade_level: 5, home_school_code: "SCH1" }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { st_a: $.data.id }
            - call: "POST /field-trips"
              payload: { title: "Imm", organizer_teacher_id: "${teach_g}", school_code: "SCH1", grade_band: "ELEMENTARY", depart_at: "2026-11-04T09:00:00Z", return_at: "2026-11-04T12:00:00Z", capacity: 5, base_fee_cents: 0, transport_cost_cents: 0 }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { trip: $.data.id }
            - call: "POST /field-trips/${trip}/permission-slips"
              payload: { student_id: "${st_a}", guardian_id: "${g_a}" }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { slip_a: $.data.id }
          trigger:
            - call: "POST /field-trips/${trip}/permission-slips/${slip_a}/emergency-contacts"
              payload: { name: "EC", phone: "555-9", relationship: "aunt" }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { ec: $.data.id }
          assert:
            - "HTTP status == 201; EmergencyContact.${ec}.id present and created_at present"
            - "EmergencyContact has no version field (common_fields false)"

      - name: vehicle_computed_seats_reserved_correct
        claim_type: Computed Fields
        grounds: [entities.Vehicle.fields.seats_reserved, calculations.vehicle_seat_reservation]
        excluded_because:
          difficulty_instance: compensating_invariant / seats_conserved_confirm_then_cancel
          rationale: "Vehicle.seats_reserved correctness after confirm/cancel is asserted by the seat-conservation §1.8 instance."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_trip_returns_not_cancellable
        claim_type: Invalid Transitions
        grounds: [state_machines.FieldTrip.DRAFT_to_CANCELLED, "errors[ERR_TRIP_NOT_CANCELLABLE]"]
        distinguishing_aspect: "Cancelling a trip already CANCELLED → ERR_TRIP_NOT_CANCELLABLE; no second cascade."
        test_recipe:
          setup: ["A DRAFT trip that has been CANCELLED."]
          setup_api_calls:
            - call: "POST /guardians"
              payload: { full_name: "TC6", email: "tc6@x.com", phone: "555-2006" }
              as: DistrictAdmin
              captures: { teach_g: $.data.id }
            - call: "POST /field-trips"
              payload: { title: "DblCancel", organizer_teacher_id: "${teach_g}", school_code: "SCH1", grade_band: "HIGH", depart_at: "2026-11-05T09:00:00Z", return_at: "2026-11-05T12:00:00Z", capacity: 5, base_fee_cents: 0, transport_cost_cents: 0 }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { trip: $.data.id }
            - call: "POST /field-trips/${trip}/cancel"
              payload: {}
              as: Teacher
              as_user_id: "${teach_g}"
          trigger:
            - call: "POST /field-trips/${trip}/cancel"
              payload: {}
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_TRIP_NOT_CANCELLABLE"
            - "HTTP status == 409"

      - name: submit_non_draft_trip_returns_not_draft
        claim_type: Invalid Transitions
        grounds: [state_machines.FieldTrip.DRAFT_to_PENDING_PRINCIPAL, "errors[ERR_TRIP_NOT_DRAFT]"]
        distinguishing_aspect: "Submitting a trip already in PENDING_PRINCIPAL → ERR_TRIP_NOT_DRAFT."
        test_recipe:
          setup: ["A trip submitted once (now PENDING_PRINCIPAL)."]
          setup_api_calls:
            - call: "POST /guardians"
              payload: { full_name: "TC7", email: "tc7@x.com", phone: "555-2007" }
              as: DistrictAdmin
              captures: { teach_g: $.data.id }
            - call: "POST /field-trips"
              payload: { title: "ReSubmit", organizer_teacher_id: "${teach_g}", school_code: "SCH1", grade_band: "HIGH", depart_at: "2026-11-06T09:00:00Z", return_at: "2026-11-06T12:00:00Z", capacity: 5, base_fee_cents: 0, transport_cost_cents: 0 }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { trip: $.data.id }
            - call: "POST /field-trips/${trip}/submit"
              payload: {}
              as: Teacher
              as_user_id: "${teach_g}"
          trigger:
            - call: "POST /field-trips/${trip}/submit"
              payload: {}
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_TRIP_NOT_DRAFT"
            - "HTTP status == 409"

      - name: district_step_on_pending_principal_returns_not_awaiting_district
        claim_type: Invalid Transitions
        grounds: [state_machines.FieldTrip.PENDING_DISTRICT_to_APPROVED, "errors[ERR_TRIP_NOT_AWAITING_DISTRICT]"]
        distinguishing_aspect: "A DISTRICT approval recorded while trip is still PENDING_PRINCIPAL (step skipped) → ERR_TRIP_NOT_AWAITING_DISTRICT."
        test_recipe:
          setup: ["A trip in PENDING_PRINCIPAL (submitted, principal has not yet acted)."]
          setup_api_calls:
            - call: "POST /guardians"
              payload: { full_name: "TC8", email: "tc8@x.com", phone: "555-2008" }
              as: DistrictAdmin
              captures: { teach_g: $.data.id }
            - call: "POST /field-trips"
              payload: { title: "Skip", organizer_teacher_id: "${teach_g}", school_code: "SCH1", grade_band: "HIGH", depart_at: "2026-11-07T09:00:00Z", return_at: "2026-11-07T12:00:00Z", capacity: 5, base_fee_cents: 0, transport_cost_cents: 0 }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { trip: $.data.id }
            - call: "POST /field-trips/${trip}/submit"
              payload: {}
              as: Teacher
              as_user_id: "${teach_g}"
          trigger:
            - call: "POST /field-trips/${trip}/approvals"
              payload: { step: "DISTRICT", decision: "APPROVE" }
              as: DistrictAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_TRIP_NOT_AWAITING_DISTRICT"
            - "HTTP status == 409"

      - name: start_before_lock_returns_not_locked
        claim_type: Invalid Transitions
        grounds: [state_machines.FieldTrip.ROSTER_LOCKED_to_IN_PROGRESS, "errors[ERR_TRIP_NOT_LOCKED]"]
        distinguishing_aspect: "Starting an APPROVED (not yet ROSTER_LOCKED) trip → ERR_TRIP_NOT_LOCKED."
        test_recipe:
          setup: ["A trip APPROVED but not locked."]
          setup_api_calls:
            - call: "POST /guardians"
              payload: { full_name: "TC9", email: "tc9@x.com", phone: "555-2009" }
              as: DistrictAdmin
              captures: { teach_g: $.data.id }
            - call: "POST /field-trips"
              payload: { title: "Start", organizer_teacher_id: "${teach_g}", school_code: "SCH1", grade_band: "HIGH", depart_at: "2026-11-08T09:00:00Z", return_at: "2026-11-08T12:00:00Z", capacity: 5, base_fee_cents: 0, transport_cost_cents: 0 }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { trip: $.data.id }
            - call: "POST /field-trips/${trip}/submit"
              payload: {}
              as: Teacher
              as_user_id: "${teach_g}"
            - call: "POST /field-trips/${trip}/approvals"
              payload: { step: "PRINCIPAL", decision: "APPROVE" }
              as: Principal
            - call: "POST /field-trips/${trip}/approvals"
              payload: { step: "DISTRICT", decision: "APPROVE" }
              as: DistrictAdmin
          trigger:
            - call: "POST /field-trips/${trip}/start"
              payload: {}
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_TRIP_NOT_LOCKED"
            - "HTTP status == 409"

      - name: pay_unsigned_slip_returns_slip_not_signed
        claim_type: Precondition Enforcement
        grounds: [state_machines.PermissionSlip.UNPAID_to_PAID, "errors[ERR_SLIP_NOT_SIGNED]"]
        distinguishing_aspect: "Paying a slip whose signature_status is UNSIGNED → ERR_SLIP_NOT_SIGNED (payment requires a signed slip)."
        test_recipe:
          setup: ["Trip APPROVED; an UNSIGNED slip."]
          setup_api_calls:
            - call: "POST /guardians"
              payload: { full_name: "TC10", email: "tc10@x.com", phone: "555-2010" }
              as: DistrictAdmin
              captures: { teach_g: $.data.id }
            - call: "POST /guardians"
              payload: { full_name: "G10c", email: "g10c@x.com", phone: "555-2110" }
              as: DistrictAdmin
              captures: { g_a: $.data.id }
            - call: "POST /students"
              payload: { full_name: "S10c", grade_level: 5, home_school_code: "SCH1" }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { st_a: $.data.id }
            - call: "POST /field-trips"
              payload: { title: "PayUnsigned", organizer_teacher_id: "${teach_g}", school_code: "SCH1", grade_band: "ELEMENTARY", depart_at: "2026-11-09T09:00:00Z", return_at: "2026-11-09T12:00:00Z", capacity: 5, base_fee_cents: 1000, transport_cost_cents: 0 }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { trip: $.data.id }
            - call: "POST /field-trips/${trip}/submit"
              payload: {}
              as: Teacher
              as_user_id: "${teach_g}"
            - call: "POST /field-trips/${trip}/approvals"
              payload: { step: "PRINCIPAL", decision: "APPROVE" }
              as: Principal
            - call: "POST /field-trips/${trip}/approvals"
              payload: { step: "DISTRICT", decision: "APPROVE" }
              as: DistrictAdmin
            - call: "POST /field-trips/${trip}/permission-slips"
              payload: { student_id: "${st_a}", guardian_id: "${g_a}" }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { slip_a: $.data.id }
          trigger:
            - call: "POST /field-trips/${trip}/permission-slips/${slip_a}/pay"
              payload: { amount_cents: 1000 }
              as: Guardian
              as_user_id: "${g_a}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_SLIP_NOT_SIGNED"
            - "HTTP status == 409"

      - name: sign_without_emergency_contact_returns_required
        claim_type: Precondition Enforcement
        grounds: [state_machines.PermissionSlip.UNSIGNED_to_SIGNED, "errors[ERR_EMERGENCY_CONTACT_REQUIRED]", "validations[priority=10]"]
        distinguishing_aspect: "Signing a slip with zero EmergencyContacts → ERR_EMERGENCY_CONTACT_REQUIRED; signature stays UNSIGNED."
        test_recipe:
          setup: ["Trip APPROVED; a slip with NO emergency contact."]
          setup_api_calls:
            - call: "POST /guardians"
              payload: { full_name: "TC11", email: "tc11@x.com", phone: "555-2011" }
              as: DistrictAdmin
              captures: { teach_g: $.data.id }
            - call: "POST /guardians"
              payload: { full_name: "G11c", email: "g11c@x.com", phone: "555-2111" }
              as: DistrictAdmin
              captures: { g_a: $.data.id }
            - call: "POST /students"
              payload: { full_name: "S11c", grade_level: 5, home_school_code: "SCH1" }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { st_a: $.data.id }
            - call: "POST /field-trips"
              payload: { title: "NoEC", organizer_teacher_id: "${teach_g}", school_code: "SCH1", grade_band: "ELEMENTARY", depart_at: "2026-11-10T09:00:00Z", return_at: "2026-11-10T12:00:00Z", capacity: 5, base_fee_cents: 0, transport_cost_cents: 0 }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { trip: $.data.id }
            - call: "POST /field-trips/${trip}/submit"
              payload: {}
              as: Teacher
              as_user_id: "${teach_g}"
            - call: "POST /field-trips/${trip}/approvals"
              payload: { step: "PRINCIPAL", decision: "APPROVE" }
              as: Principal
            - call: "POST /field-trips/${trip}/approvals"
              payload: { step: "DISTRICT", decision: "APPROVE" }
              as: DistrictAdmin
            - call: "POST /field-trips/${trip}/permission-slips"
              payload: { student_id: "${st_a}", guardian_id: "${g_a}" }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { slip_a: $.data.id }
          trigger:
            - call: "POST /field-trips/${trip}/permission-slips/${slip_a}/sign"
              payload: {}
              as: Guardian
              as_user_id: "${g_a}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_EMERGENCY_CONTACT_REQUIRED"
            - "PermissionSlip.${slip_a}.signature_status == UNSIGNED"

      - name: clear_without_background_check_returns_missing
        claim_type: Precondition Enforcement
        grounds: [state_machines.Chaperone.CONFIRMED_to_CLEARED, "errors[ERR_BACKGROUND_CHECK_MISSING]"]
        distinguishing_aspect: "Clearing a CONFIRMED chaperone that has no background_check_ref → ERR_BACKGROUND_CHECK_MISSING."
        test_recipe:
          setup: ["Trip APPROVED; a CONFIRMED chaperone with no background_check_ref."]
          setup_api_calls:
            - call: "POST /guardians"
              payload: { full_name: "TC12", email: "tc12@x.com", phone: "555-2012" }
              as: DistrictAdmin
              captures: { teach_g: $.data.id }
            - call: "POST /guardians"
              payload: { full_name: "Gch12", email: "gch12@x.com", phone: "555-2112" }
              as: DistrictAdmin
              captures: { g_c: $.data.id }
            - call: "POST /field-trips"
              payload: { title: "NoBG", organizer_teacher_id: "${teach_g}", school_code: "SCH1", grade_band: "HIGH", depart_at: "2026-11-11T09:00:00Z", return_at: "2026-11-11T12:00:00Z", capacity: 5, base_fee_cents: 0, transport_cost_cents: 0 }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { trip: $.data.id }
            - call: "POST /field-trips/${trip}/submit"
              payload: {}
              as: Teacher
              as_user_id: "${teach_g}"
            - call: "POST /field-trips/${trip}/approvals"
              payload: { step: "PRINCIPAL", decision: "APPROVE" }
              as: Principal
            - call: "POST /field-trips/${trip}/approvals"
              payload: { step: "DISTRICT", decision: "APPROVE" }
              as: DistrictAdmin
            - call: "POST /field-trips/${trip}/chaperones"
              payload: { guardian_id: "${g_c}" }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { chap: $.data.id }
            - call: "POST /field-trips/${trip}/chaperones/${chap}/confirm"
              payload: {}
              as: Guardian
              as_user_id: "${g_c}"
          trigger:
            - call: "POST /field-trips/${trip}/chaperones/${chap}/clear"
              payload: {}
              as: Principal
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_BACKGROUND_CHECK_MISSING"
            - "Chaperone.${chap}.status == CONFIRMED"

      - name: confirm_booking_overbook_returns_overbooked
        claim_type: Precondition Enforcement
        grounds: [state_machines.TransportBooking.REQUESTED_to_CONFIRMED, "errors[ERR_VEHICLE_OVERBOOKED]", "validations[priority=9]"]
        distinguishing_aspect: "Confirming a booking whose seat_count would push Vehicle.seats_reserved beyond seat_capacity → ERR_VEHICLE_OVERBOOKED."
        test_recipe:
          setup: ["Vehicle capacity 4; trip APPROVED; a REQUESTED booking of 5 seats."]
          setup_api_calls:
            - call: "POST /guardians"
              payload: { full_name: "TC13", email: "tc13@x.com", phone: "555-2013" }
              as: DistrictAdmin
              captures: { teach_g: $.data.id }
            - call: "POST /vehicles"
              payload: { label: "Small", seat_capacity: 4 }
              as: DistrictAdmin
              captures: { veh: $.data.id }
            - call: "POST /field-trips"
              payload: { title: "Over", organizer_teacher_id: "${teach_g}", school_code: "SCH1", grade_band: "HIGH", depart_at: "2026-11-12T09:00:00Z", return_at: "2026-11-12T12:00:00Z", capacity: 10, base_fee_cents: 0, transport_cost_cents: 0 }
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { trip: $.data.id }
            - call: "POST /field-trips/${trip}/submit"
              payload: {}
              as: Teacher
              as_user_id: "${teach_g}"
            - call: "POST /field-trips/${trip}/approvals"
              payload: { step: "PRINCIPAL", decision: "APPROVE" }
              as: Principal
