scaffold_corner_design:

  # ===========================================================================
  # Section 1 - Entities (claim-extraction-guide "From Table 1")
  # Entity topology is `flat`, so the topology rows contribute cross-reference
  # integrity claims (FK validated across peers) rather than nested-routing ones.
  # ===========================================================================
  - section: entities
    instances:

      - name: certificate_create_returns_201_with_computed_status_and_zero_covered_sites
        claim_type: creation
        grounds:
          - entities.CliaCertificate
          - entities.CliaCertificate.fields.status
          - entities.CliaCertificate.fields.covered_site_count
          - endpoints[POST /poct/certificates]
        distinguishing_aspect: |
          A certificate created with all five required inputs comes back 201 with
          the computed/system fields the scaffold declares rather than echoes of
          the request: status ACTIVE, covered_site_count 0, suspension_reason
          null, version 1 - and the four common fields are server-minted.
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-09-01T08:00:00Z so the expiration_date > clock-date constraint is satisfiable."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243001", certificate_type: "CERTIFICATE_OF_COMPLIANCE", permitted_complexity: "MODERATE", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id, cert_status: $.data.status, cert_sites: $.data.covered_site_count, cert_version: $.data.version, cert_created_at: $.data.created_at }
          assert:
            - "HTTP status is 201"
            - "${cert_status} == \"ACTIVE\""
            - "${cert_sites} == 0"
            - "${cert_version} == 1"
            - "${cert_id} is a bare server-minted UUID with no type prefix"
            - "${cert_created_at} == \"2026-09-01T08:00:00.000Z\" (the logical clock, not wall clock)"
            - "CliaCertificate.${cert_id}.suspension_reason == null"
            - "CliaCertificate.${cert_id}.certificate_number == \"45D2243001\" and .permitted_complexity == MODERATE and .expiration_date == \"2027-12-31\""

      - name: get_site_returns_stored_inputs_and_initialised_counters
        claim_type: retrieval
        grounds:
          - entities.TestSite
          - endpoints[GET /poct/sites/{id}]
          - calculations.site_oversight_posture
        distinguishing_aspect: |
          A read of a covered site with no children returns every declared
          counter at its initial value (all zeros), site_qc_compliance_index
          100.00, inspection_readiness_score 100.00 and posture OPEN - proving
          the read-time re-derivation of posture/index/score does not invent
          penalties where there are no findings, operators or devices.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "One MODERATE site covered 2026-01-01..2026-12-31 by an ACTIVE CERTIFICATE_OF_COMPLIANCE, so has_active_coverage is true and posture cannot be SUSPENDED."
            - "No Operator, Device, DeficiencyFinding or ProficiencyEnrollment exists."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243002", certificate_type: "CERTIFICATE_OF_COMPLIANCE", permitted_complexity: "MODERATE", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Emergency Department POCT", department_code: "DEPT-200", complexity_scope: "MODERATE" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
          trigger:
            - call: "GET /poct/sites/${site_id}"
              as: QualityCoordinator
              captures: { posture: $.data.oversight_posture, blocked: $.data.manual_entry_blocked, weight: $.data.open_deficiency_weight, index: $.data.site_qc_compliance_index, readiness: $.data.inspection_readiness_score, held: $.data.held_result_count }
          assert:
            - "HTTP status is 200"
            - "${posture} == \"OPEN\""
            - "${blocked} == false"
            - "${weight} == 0.00"
            - "${index} == 100.00"
            - "${readiness} == 100.00"
            - "${held} == 0"
            - "TestSite.${site_id}.name == \"Emergency Department POCT\" and .department_code == \"DEPT-200\" and .complexity_scope == MODERATE"
            - "TestSite.${site_id}.lab_director_operator_id == null and .last_oversight_run_at == null and .scope_creep_flag == false"
            - "TestSite.${site_id}.total_operator_count == 0 and .locked_out_operator_count == 0 and .lapsed_or_locked_operator_count == 0 and .pt_unsuccessful_count == 0"

      - name: list_operators_filtered_by_site_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /poct/operators]
          - entities.Operator.fields.site_id
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          Three operators at site A and one at site B: the site-filtered list
          reports total_count 3 (never 4), the first page of limit 2 reports
          has_more true, the offset-2 page reports has_more false and one row,
          and the two pages partition the three ids with no repeat.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "Site A with three operators; site B with one operator. Neither site needs coverage - POST /poct/operators has no posture or certificate precondition."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/sites"
              payload: { name: "Site A POCT", department_code: "DEPT-301", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_a: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Site B POCT", department_code: "DEPT-302", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_b: $.data.id }
            - call: "POST /poct/operators"
              payload: { site_id: "${site_a}", full_name: "Ana Reyes", role_title: "MEDICAL_ASSISTANT", hire_date: "2026-02-01" }
              as: ProgramAdmin
              captures: { op_a: $.data.id }
            - call: "POST /poct/operators"
              payload: { site_id: "${site_a}", full_name: "Ben Ortiz", role_title: "NURSE", hire_date: "2026-03-01" }
              as: ProgramAdmin
              captures: { op_b: $.data.id }
            - call: "POST /poct/operators"
              payload: { site_id: "${site_a}", full_name: "Cara Lin", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-04-01" }
              as: ProgramAdmin
              captures: { op_c: $.data.id }
            - call: "POST /poct/operators"
              payload: { site_id: "${site_b}", full_name: "Dov Klein", role_title: "NURSE", hire_date: "2026-05-01" }
              as: ProgramAdmin
              captures: { op_d: $.data.id }
          trigger:
            - call: "GET /poct/operators?site_id=${site_a}&limit=2&offset=0"
              as: QualityCoordinator
              captures: { page1_total: $.meta.total_count, page1_has_more: $.meta.has_more }
            - call: "GET /poct/operators?site_id=${site_a}&limit=2&offset=2"
              as: QualityCoordinator
              captures: { page2_total: $.meta.total_count, page2_has_more: $.meta.has_more }
          assert:
            - "${page1_total} == 3"
            - "${page1_has_more} == true"
            - "page 1 `data` has exactly 2 elements"
            - "${page2_total} == 3"
            - "${page2_has_more} == false"
            - "page 2 `data` has exactly 1 element"
            - "the union of ids across both pages is exactly {${op_a}, ${op_b}, ${op_c}} with no id appearing twice; ${op_d} appears on neither page"
            - "response_type == \"array\" on both pages"

      - name: get_device_with_unknown_uuid_returns_device_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_DEVICE_NOT_FOUND]
          - validations[priority:12]
          - endpoints[GET /poct/devices/{id}]
        distinguishing_aspect: |
          A syntactically valid but unknown UUID on the device read returns the
          device-scoped 404 (ERR_DEVICE_NOT_FOUND), not the generic
          ERR_RESOURCE_NOT_FOUND of priority 14.
        test_recipe:
          setup:
            - "Empty database; no Device row exists."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /poct/devices/00000000-0000-4000-8000-000000000000"
              as: QualityCoordinator
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "HTTP status is 404"
            - "${err} == \"ERR_DEVICE_NOT_FOUND\""
            - "${msg} is a non-empty human-readable string"
            - "response_type == \"error\""

      - name: site_create_without_department_code_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.TestSite.fields.department_code
          - validations[priority:20]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          department_code is `source: input` with no default, so omitting it is a
          400 ERR_INVALID_REQUEST from priority 20 - the site is NOT created with
          a null code.
        test_recipe:
          setup:
            - "Empty database; logical clock 2026-09-01T08:00:00Z."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /poct/sites"
              payload: { name: "Nephrology POCT", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "HTTP status is 400"
            - "${err} == \"ERR_INVALID_REQUEST\""
            - "${msg} names department_code"
            - "GET /poct/sites returns meta.total_count == 0 afterwards - no partial row was persisted"

      - name: operator_create_applies_pending_locked_out_never_trained_defaults
        claim_type: defaults
        grounds:
          - entities.Operator.fields.competency_status
          - entities.Operator.fields.access_status
          - entities.Operator.fields.lockout_reason
          - endpoints[POST /poct/operators]
          - calculations.site_inspection_readiness_score
        distinguishing_aspect: |
          A brand-new operator is born PENDING x LOCKED_OUT with lockout_reason
          NEVER_TRAINED - and because that single operator is both the site's
          only operator and locked out, the site's derived counters flip posture
          to RESTRICTED and competency_penalty saturates its 25.00 cap, giving
          readiness exactly 75.00.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "One WAIVED site with in-window ACTIVE coverage (so posture starts OPEN) and no other children."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243003", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Urgent Care POCT", department_code: "DEPT-400", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
          trigger:
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Ella Novak", role_title: "MEDICAL_ASSISTANT", hire_date: "2026-06-01" }
              as: ProgramAdmin
              captures: { op_id: $.data.id, comp: $.data.competency_status, acc: $.data.access_status, why: $.data.lockout_reason, grace: $.data.current_grace_days, deadline: $.data.lapse_deadline }
            - call: "GET /poct/sites/${site_id}"
              as: QualityCoordinator
              captures: { posture: $.data.oversight_posture, total_ops: $.data.total_operator_count, locked_ops: $.data.locked_out_operator_count, lapsed_ops: $.data.lapsed_or_locked_operator_count, readiness: $.data.inspection_readiness_score, blocked: $.data.manual_entry_blocked }
          assert:
            - "HTTP status is 201 on the operator create"
            - "${comp} == \"PENDING\""
            - "${acc} == \"LOCKED_OUT\""
            - "${why} == \"NEVER_TRAINED\""
            - "${grace} == 0"
            - "${deadline} == null"
            - "Operator.${op_id}.training_completed_at == null and .training_module_code == null and .competency_expires_at == null and .consecutive_rejection_count == 0"
            - "${total_ops} == 1 and ${locked_ops} == 1 and ${lapsed_ops} == 1"
            - "${posture} == \"RESTRICTED\" (locked_out_operator_count * 2 == 2 > total_operator_count == 1)"
            - "${blocked} == true"
            - "${readiness} == 75.00 (competency_gap_pct 100.00 -> competency_penalty min(25.00, 25.00) == 25.00; every other penalty 0.00)"

      - name: coverage_snapshot_copies_certificate_complexity_not_site_scope
        claim_type: computed_fields
        grounds:
          - entities.CertificateCoverage.fields.permitted_complexity_snapshot
          - entities.CliaCertificate.fields.covered_site_count
          - endpoints[POST /poct/certificate-coverages]
        distinguishing_aspect: |
          A MODERATE-scoped site covered by a WAIVED certificate of waiver gets
          permitted_complexity_snapshot == WAIVED: the snapshot is copied from
          the certificate, never from TestSite.complexity_scope, and the
          certificate's covered_site_count reconciles to 1 in the same request.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "One ACTIVE CERTIFICATE_OF_WAIVER (permitted_complexity WAIVED, 2026-01-01..2027-12-31) and one site whose complexity_scope is MODERATE; no coverage row yet."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243004", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Oncology Infusion POCT", department_code: "DEPT-500", complexity_scope: "MODERATE" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-02-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
              captures: { cov_id: $.data.id, snapshot: $.data.permitted_complexity_snapshot }
            - call: "GET /poct/certificates/${cert_id}"
              as: ProgramAdmin
              captures: { covered: $.data.covered_site_count }
          assert:
            - "HTTP status is 201 on the coverage create"
            - "${snapshot} == \"WAIVED\" (from the certificate; TestSite.complexity_scope MODERATE is irrelevant to the snapshot)"
            - "${covered} == 1"
            - "CertificateCoverage.${cov_id}.coverage_start == \"2026-02-01\" and .coverage_end == \"2026-12-31\""
            - "TestSite.${site_id}.complexity_scope is still MODERATE - the coverage does not rewrite the site's declared scope"

      - name: qc_run_snapshots_expected_bounds_from_the_lot_and_marks_locked_device
        claim_type: computed_fields
        grounds:
          - entities.QcRun.fields.expected_min
          - entities.QcRun.fields.expected_max
          - entities.QcRun.fields.locked_device
          - calculations.qc_run_result
          - endpoints[POST /poct/qc-runs]
        distinguishing_aspect: |
          A LEVEL_2 run picks up control_min_level_2 / control_max_level_2
          (250.0 / 350.0) and not the LEVEL_1 pair (80.0 / 120.0); a passing run
          leaves locked_device false and, because only one of the two levels has
          passed today, last_two_level_qc_pass_on stays null.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "Covered WAIVED site, one trained (PROVISIONAL x ACTIVE) operator, one ACTIVE WAIVED device model GLUCO-9 with qc_frequency_days 30, one storage unit IN_RANGE, one UNVERIFIED lot for GLUCO-9 expiring 2027-01-31 with LEVEL_1 bounds 80.0/120.0 and LEVEL_2 bounds 250.0/350.0."
            - "POST /poct/qc-runs has no lot-verification precondition (priority 44 covers test results and qc-unlock only), so an UNVERIFIED lot is legal here."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243005", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Family Medicine POCT", department_code: "DEPT-600", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Fay Duarte", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-01-15" }
              as: ProgramAdmin
              captures: { op_id: $.data.id }
            - call: "POST /poct/operators/${op_id}/training"
              payload: { training_module_code: "POCT-GLUCO-101", completed_on: "2026-08-20" }
              as: QualityCoordinator
            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "GLUCO-9", serial_number: "SN-GL-0001", analyte: "GLUCOSE", complexity_class: "WAIVED", connectivity_mode: "INTERFACED", qc_frequency_days: 30 }
              as: ProgramAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /poct/storage-units"
              payload: { site_id: "${site_id}", name: "Reagent Fridge 1", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: ProgramAdmin
              captures: { su_id: $.data.id }
            - call: "POST /poct/reagent-lots"
              payload: { site_id: "${site_id}", storage_unit_id: "${su_id}", device_model: "GLUCO-9", lot_number: "LOT-A1", expiration_date: "2027-01-31", received_at: "2026-09-01T08:00:00Z", control_min_level_1: 80.0, control_max_level_1: 120.0, control_min_level_2: 250.0, control_max_level_2: 350.0 }
              as: QualityCoordinator
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev_id}", reagent_lot_id: "${lot_id}", operator_id: "${op_id}", control_level: "LEVEL_2", measured_value: 300.0 }
              as: Operator
              as_user_id: "user-fay"
              captures: { qc_id: $.data.id, exp_min: $.data.expected_min, exp_max: $.data.expected_max, qc_result: $.data.result, qc_locked: $.data.locked_device }
            - call: "GET /poct/devices/${dev_id}"
              as: QualityCoordinator
              captures: { dev_status: $.data.status, dev_reason: $.data.qc_lock_reason, last_pass: $.data.last_two_level_qc_pass_on }
          assert:
            - "HTTP status is 201 on the QC run"
            - "${exp_min} == 250.0 and ${exp_max} == 350.0 (LEVEL_2 bounds, not the LEVEL_1 pair 80.0/120.0)"
            - "${qc_result} == \"PASS\""
            - "${qc_locked} == false"
            - "${dev_status} == \"ACTIVE\" and ${dev_reason} == null"
            - "${last_pass} == null - a two-level pass needs a PASS at BOTH LEVEL_1 and LEVEL_2 on the same date"
            - "QcRun.${qc_id}.performed_at == \"2026-09-01T08:00:00.000Z\" (omitted input defaults to the logical clock)"

      - name: device_create_with_zero_qc_frequency_and_unknown_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Device.fields.qc_frequency_days
          - entities.Device.fields.connectivity_mode
          - validations[priority:20]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Both the numeric range (qc_frequency_days >= 1) and the enum closure
          (connectivity_mode in {INTERFACED, MANUAL_ENTRY, OFFLINE}) are enforced
          at priority 20 - before any 422 business rule - so each bad request is
          a 400 and neither device row is created.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "One WAIVED site with in-window ACTIVE coverage, so priorities 57 and 62 would both pass for a well-formed WAIVED device."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243006", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Pediatrics POCT", department_code: "DEPT-700", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
          trigger:
            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "GLUCO-9", serial_number: "SN-GL-0002", analyte: "GLUCOSE", complexity_class: "WAIVED", connectivity_mode: "INTERFACED", qc_frequency_days: 0 }
              as: ProgramAdmin
              captures: { err_freq: $.data.error_id, msg_freq: $.data.message }
            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "GLUCO-9", serial_number: "SN-GL-0003", analyte: "GLUCOSE", complexity_class: "WAIVED", connectivity_mode: "BLUETOOTH", qc_frequency_days: 30 }
              as: ProgramAdmin
              captures: { err_enum: $.data.error_id, msg_enum: $.data.message }
          assert:
            - "both calls return HTTP status 400"
            - "${err_freq} == \"ERR_INVALID_REQUEST\" and ${msg_freq} names qc_frequency_days"
            - "${err_enum} == \"ERR_INVALID_REQUEST\" and ${msg_enum} names connectivity_mode"
            - "GET /poct/devices?site_id=${site_id} returns meta.total_count == 0"

      - name: qc_run_read_exposes_no_version_or_updated_at_and_has_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.QcRun
          - endpoints[GET /poct/qc-runs/{id}]
          - endpoints[POST /poct/qc-runs]
        distinguishing_aspect: |
          QcRun is declared `common_fields: false`, so it carries only id and
          created_at: the read response has no version and no updated_at, and
          §1.5 declares no PATCH/PUT/DELETE on /poct/qc-runs/{id} - a control run
          is an append-only ledger row.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "Covered WAIVED site, trained operator, ACTIVE device GLUCO-9, storage unit, lot with LEVEL_1 bounds 80.0/120.0, and one recorded LEVEL_1 PASS run."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243007", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Endocrinology POCT", department_code: "DEPT-800", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Gus Marek", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-01-20" }
              as: ProgramAdmin
              captures: { op_id: $.data.id }
            - call: "POST /poct/operators/${op_id}/training"
              payload: { training_module_code: "POCT-GLUCO-101", completed_on: "2026-08-20" }
              as: QualityCoordinator
            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "GLUCO-9", serial_number: "SN-GL-0010", analyte: "GLUCOSE", complexity_class: "WAIVED", connectivity_mode: "INTERFACED", qc_frequency_days: 30 }
              as: ProgramAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /poct/storage-units"
              payload: { site_id: "${site_id}", name: "Reagent Fridge 1", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: ProgramAdmin
              captures: { su_id: $.data.id }
            - call: "POST /poct/reagent-lots"
              payload: { site_id: "${site_id}", storage_unit_id: "${su_id}", device_model: "GLUCO-9", lot_number: "LOT-A1", expiration_date: "2027-01-31", received_at: "2026-09-01T08:00:00Z", control_min_level_1: 80.0, control_max_level_1: 120.0, control_min_level_2: 250.0, control_max_level_2: 350.0 }
              as: QualityCoordinator
              captures: { lot_id: $.data.id }
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev_id}", reagent_lot_id: "${lot_id}", operator_id: "${op_id}", control_level: "LEVEL_1", measured_value: 100.0 }
              as: Operator
              as_user_id: "user-gus"
              captures: { qc_id: $.data.id }
          trigger:
            - call: "GET /poct/qc-runs/${qc_id}"
              as: QualityCoordinator
              captures: { echoed_id: $.data.id, echoed_created_at: $.data.created_at }
          assert:
            - "HTTP status is 200"
            - "${echoed_id} == ${qc_id}"
            - "${echoed_created_at} == \"2026-09-01T08:00:00.000Z\""
            - "the `data` object contains NO `version` key and NO `updated_at` key"
            - "§1.5 declares no PATCH, PUT or DELETE on /poct/qc-runs/{id}: the recorded control value can never be edited, only superseded by a new run"

      - name: operator_create_with_unknown_site_returns_site_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Operator.fields.site_id
          - validations[priority:10]
          - errors[ERR_SITE_NOT_FOUND]
        distinguishing_aspect: |
          Operator.site_id is an FK to TestSite.id; an unknown site UUID is
          resolved at priority 10 and fails with the site-scoped 404 before any
          field-shape check at priority 20 could complain.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z; no TestSite row exists."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /poct/operators"
              payload: { site_id: "00000000-0000-4000-8000-000000000000", full_name: "Hana Ito", role_title: "NURSE", hire_date: "2026-07-01" }
              as: ProgramAdmin
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "HTTP status is 404"
            - "${err} == \"ERR_SITE_NOT_FOUND\""
            - "${msg} is a non-empty human-readable string"
            - "GET /poct/operators returns meta.total_count == 0"

      - name: qc_run_with_lot_from_another_site_returns_cross_site_reference
        claim_type: cross_reference_integrity
        grounds:
          - validations[priority:60]
          - errors[ERR_CROSS_SITE_REFERENCE]
          - entities.ReagentLot.fields.site_id
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          The flat topology carries ownership in FK fields rather than URL
          nesting, so a QC run can name a device at site A and a lot at site B.
          The lot deliberately has the SAME device_model (GLUCO-9) so priority 59
          cannot fire first: the failure is the site mismatch at priority 60.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "Site A: ACTIVE coverage, trained operator, ACTIVE device GLUCO-9, storage unit, lot LOT-A1 for GLUCO-9."
            - "Site B: storage unit and lot LOT-B1 also for device_model GLUCO-9 (no coverage or device needed - POST /poct/reagent-lots has no certificate precondition)."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243008", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Site A POCT", department_code: "DEPT-901", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_a: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Site B POCT", department_code: "DEPT-902", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_b: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_a}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_a}", full_name: "Iris Cole", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-02-10" }
              as: ProgramAdmin
              captures: { op_id: $.data.id }
            - call: "POST /poct/operators/${op_id}/training"
              payload: { training_module_code: "POCT-GLUCO-101", completed_on: "2026-08-20" }
              as: QualityCoordinator
            - call: "POST /poct/devices"
              payload: { site_id: "${site_a}", device_model: "GLUCO-9", serial_number: "SN-GL-0020", analyte: "GLUCOSE", complexity_class: "WAIVED", connectivity_mode: "INTERFACED", qc_frequency_days: 30 }
              as: ProgramAdmin
              captures: { dev_a: $.data.id }
            - call: "POST /poct/storage-units"
              payload: { site_id: "${site_b}", name: "Site B Fridge", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: ProgramAdmin
              captures: { su_b: $.data.id }
            - call: "POST /poct/reagent-lots"
              payload: { site_id: "${site_b}", storage_unit_id: "${su_b}", device_model: "GLUCO-9", lot_number: "LOT-B1", expiration_date: "2027-01-31", received_at: "2026-09-01T08:00:00Z", control_min_level_1: 80.0, control_max_level_1: 120.0, control_min_level_2: 250.0, control_max_level_2: 350.0 }
              as: QualityCoordinator
              captures: { lot_b: $.data.id }
          trigger:
            - call: "POST /poct/qc-runs"
              payload: { device_id: "${dev_a}", reagent_lot_id: "${lot_b}", operator_id: "${op_id}", control_level: "LEVEL_1", measured_value: 100.0 }
              as: Operator
              as_user_id: "user-iris"
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "HTTP status is 422"
            - "${err} == \"ERR_CROSS_SITE_REFERENCE\" (NOT ERR_LOT_DEVICE_MODEL_MISMATCH - both rows carry device_model GLUCO-9)"
            - "${msg} is a non-empty human-readable string"
            - "GET /poct/qc-runs?device_id=${dev_a} returns meta.total_count == 0"
            - "Device.${dev_a}.status == ACTIVE and ReagentLot.${lot_b}.verification_status == UNVERIFIED - the rejected run left no trace"

  # ===========================================================================
  # Section 2 - State Machines (claim-extraction-guide "From Table 2")
  # state_machine_shape is `parallel`; Operator carries two independent
  # dimensions, DeficiencyFinding/TestResult/ReagentLot/StorageUnit are cyclic
  # and Inspection is compound. The shape and side-effect-pattern rows that §1.8
  # already probes in depth are emitted as excluded_because stubs.
  # ===========================================================================
  - section: state_machines
    instances:

      - name: newly_created_rows_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.Device.initial_state
          - state_machines.StorageUnit.initial_state
          - state_machines.ReagentLot.initial_state
          - state_machines.Inspection.initial_state
          - state_machines.DeficiencyFinding.initial_state
          - state_machines.ProficiencyEnrollment.initial_state
          - state_machines.ProficiencyEvent.initial_state
        distinguishing_aspect: |
          Every entity that declares an initial_state is created in one chain and
          read back: Device ACTIVE, StorageUnit IN_RANGE, ReagentLot UNVERIFIED,
          Inspection IN_PROGRESS, DeficiencyFinding DRAFT (weight 0, NOT the
          severity base), ProficiencyEnrollment ENROLLED, ProficiencyEvent
          PENDING with outcome null.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "One WAIVED site covered 2026-01-01..2026-12-31 by an ACTIVE certificate of waiver."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243010", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Rheumatology POCT", department_code: "DEPT-1000", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
          trigger:
            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "GLUCO-9", serial_number: "SN-GL-1000", analyte: "GLUCOSE", complexity_class: "WAIVED", connectivity_mode: "INTERFACED", qc_frequency_days: 30 }
              as: ProgramAdmin
              captures: { dev_id: $.data.id, dev_status: $.data.status, dev_due: $.data.qc_next_due_at }
            - call: "POST /poct/storage-units"
              payload: { site_id: "${site_id}", name: "Reagent Fridge 1", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: ProgramAdmin
              captures: { su_id: $.data.id, su_state: $.data.excursion_state }
            - call: "POST /poct/reagent-lots"
              payload: { site_id: "${site_id}", storage_unit_id: "${su_id}", device_model: "GLUCO-9", lot_number: "LOT-A1", expiration_date: "2027-01-31", received_at: "2026-09-01T08:00:00Z", control_min_level_1: 80.0, control_max_level_1: 120.0, control_min_level_2: 250.0, control_max_level_2: 350.0 }
              as: QualityCoordinator
              captures: { lot_id: $.data.id, lot_state: $.data.verification_status }
            - call: "POST /poct/inspections"
              payload: { site_id: "${site_id}", inspection_type: "INTERNAL_READINESS", scheduled_date: "2026-09-01" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { insp_id: $.data.id, insp_status: $.data.status }
            - call: "POST /poct/deficiencies"
              payload: { inspection_id: "${insp_id}", category: "QUALITY_CONTROL", severity: "CONDITION_LEVEL", description: "No QC log for the glucose meter", correction_due_date: "2026-10-31" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { def_id: $.data.id, def_status: $.data.status, def_weight: $.data.weight }
            - call: "POST /poct/pt-enrollments"
              payload: { site_id: "${site_id}", analyte: "GLUCOSE", program_year: 2026, program_provider: "AccuProficiency" }
              as: ProgramAdmin
              captures: { enr_id: $.data.id, enr_status: $.data.status }
            - call: "POST /poct/pt-events"
              payload: { enrollment_id: "${enr_id}", shipment_number: 1, due_date: "2026-10-15" }
              as: ProgramAdmin
              captures: { ev_id: $.data.id, ev_status: $.data.status, ev_outcome: $.data.outcome }
          assert:
            - "${dev_status} == \"ACTIVE\" and ${dev_due} == \"2026-09-01\" (qc_next_due_at seeds from date(created_at) because last_two_level_qc_pass_on is null)"
            - "${su_state} == \"IN_RANGE\" and StorageUnit.${su_id}.excursion_opened_at == null and .last_reading_c == null and .quarantined_lot_count == 0"
            - "${lot_state} == \"UNVERIFIED\" and ReagentLot.${lot_id}.verified_at == null and .quarantine_reason == null"
            - "${insp_status} == \"IN_PROGRESS\" and Inspection.${insp_id}.issued_on == null and .issued_weight_total == 0.00 and .readiness_score_at_issue == null"
            - "${def_status} == \"DRAFT\" and ${def_weight} == 0.00 and DeficiencyFinding.${def_id}.repeat_multiplier == 1.0 and .site_id == ${site_id} (copied from the inspection)"
            - "${enr_status} == \"ENROLLED\" and ProficiencyEnrollment.${enr_id}.graded_event_count == 0 and .fail_count_last_three == 0"
            - "${ev_status} == \"PENDING\" and ${ev_outcome} == null and ProficiencyEvent.${ev_id}.investigation_round == 0"
            - "TestSite.${site_id}.open_deficiency_weight == 0.00 - a DRAFT finding contributes nothing until issuance"

      - name: training_moves_operator_to_provisional_and_active_and_updates_counters
        claim_type: valid_transition
        grounds:
          - state_machines.Operator.PENDING_to_PROVISIONAL
          - endpoints[POST /poct/operators/{id}/training]
          - entities.TestSite.fields.locked_out_operator_count
        distinguishing_aspect: |
          One training call advances BOTH dimensions in the declared way -
          competency PENDING -> PROVISIONAL and access LOCKED_OUT -> ACTIVE with
          lockout_reason cleared to null - and every side effect listed on the
          transition lands: training_completed_at at the logical clock,
          locked_out_operator_count 1 -> 0 and posture RESTRICTED -> OPEN.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "Covered WAIVED site with exactly one operator, untrained, so the site sits at RESTRICTED (1 * 2 > 1) with readiness 75.00 before the trigger."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243011", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Dermatology POCT", department_code: "DEPT-1100", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Jae Park", role_title: "NURSE", hire_date: "2026-03-02" }
              as: ProgramAdmin
              captures: { op_id: $.data.id }
            - call: "GET /poct/sites/${site_id}"
              as: QualityCoordinator
              captures: { posture_before: $.data.oversight_posture, locked_before: $.data.locked_out_operator_count, readiness_before: $.data.inspection_readiness_score }
          trigger:
            - call: "POST /poct/operators/${op_id}/training"
              payload: { training_module_code: "POCT-GLUCO-101", completed_on: "2026-08-28" }
              as: QualityCoordinator
              captures: { comp: $.data.competency_status, acc: $.data.access_status, why: $.data.lockout_reason, trained_at: $.data.training_completed_at, module: $.data.training_module_code }
            - call: "GET /poct/sites/${site_id}"
              as: QualityCoordinator
              captures: { posture_after: $.data.oversight_posture, locked_after: $.data.locked_out_operator_count, lapsed_after: $.data.lapsed_or_locked_operator_count, readiness_after: $.data.inspection_readiness_score, blocked_after: $.data.manual_entry_blocked }
          assert:
            - "${posture_before} == \"RESTRICTED\" and ${locked_before} == 1 and ${readiness_before} == 75.00"
            - "HTTP status is 200 on the training call"
            - "${comp} == \"PROVISIONAL\" and ${acc} == \"ACTIVE\" and ${why} == null"
            - "${trained_at} == \"2026-09-01T08:00:00.000Z\" (the logical clock, not the completed_on input)"
            - "${module} == \"POCT-GLUCO-101\""
            - "${locked_after} == 0 and ${lapsed_after} == 0 and TestSite.${site_id}.total_operator_count == 1"
            - "${posture_after} == \"OPEN\" and ${blocked_after} == false"
            - "${readiness_after} == 100.00 (competency_gap_pct drops to 0.00)"
            - "Operator.${op_id}.competency_expires_at == null - training grants PROVISIONAL competency, not an expiry window"

      - name: deficiency_create_after_issue_returns_inspection_not_in_progress
        claim_type: precondition_enforcement
        grounds:
          - validations[priority:48]
          - errors[ERR_INSPECTION_NOT_IN_PROGRESS]
          - state_machines.Inspection.IN_PROGRESS_to_DEFICIENCIES_ISSUED
        distinguishing_aspect: |
          Once the deficiency statement is issued the inspection leaves
          IN_PROGRESS, so a late finding is refused at priority 48 with a 409 -
          the issued weight total cannot be topped up after the fact.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "Covered WAIVED site; one inspection with a single STANDARD_LEVEL finding already issued, so the inspection is DEFICIENCIES_ISSUED with issued_weight_total 3.00."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243012", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Wound Care POCT", department_code: "DEPT-1200", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/inspections"
              payload: { site_id: "${site_id}", inspection_type: "BIENNIAL_SURVEY", scheduled_date: "2026-09-01" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { insp_id: $.data.id }
            - call: "POST /poct/deficiencies"
              payload: { inspection_id: "${insp_id}", category: "QUALITY_CONTROL", severity: "STANDARD_LEVEL", description: "QC log gaps", correction_due_date: "2026-10-31" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { def_id: $.data.id }
            - call: "POST /poct/inspections/${insp_id}/issue"
              payload: { issued_on: "2026-09-01" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { issued_total: $.data.issued_weight_total }
          trigger:
            - call: "POST /poct/deficiencies"
              payload: { inspection_id: "${insp_id}", category: "RESULT_REPORTING", severity: "CONDITION_LEVEL", description: "Late finding added after issuance", correction_due_date: "2026-11-30" }
              as: Surveyor
              as_user_id: "surveyor-alpha"
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "HTTP status is 409"
            - "${err} == \"ERR_INSPECTION_NOT_IN_PROGRESS\""
            - "${issued_total} == 3.00 and Inspection.${insp_id}.issued_weight_total is still 3.00"
            - "GET /poct/deficiencies?inspection_id=${insp_id} returns meta.total_count == 1"
            - "TestSite.${site_id}.open_deficiency_weight == 3.00 and .oversight_posture == OPEN (3.00 < 6.00)"

      - name: score_on_already_graded_event_returns_pt_event_already_graded
        claim_type: idempotency
        grounds:
          - validations[priority:45]
          - errors[ERR_PT_EVENT_ALREADY_GRADED]
          - state_machines.ProficiencyEvent.PENDING_to_PASSED
        distinguishing_aspect: |
          Scoring is once-only: the second POST .../score on the same shipment is
          a 409 at priority 45 and does not overwrite score_pct, so a passing 92.0
          cannot be re-graded down to a failing 40.0.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "One site (coverage not required for PT rows) with an ENROLLED 2026 GLUCOSE enrollment and shipment 1 already scored 92.0 -> outcome PASS, status PASSED."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/sites"
              payload: { name: "Cardiac Clinic POCT", department_code: "DEPT-1300", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/pt-enrollments"
              payload: { site_id: "${site_id}", analyte: "GLUCOSE", program_year: 2026, program_provider: "AccuProficiency" }
              as: ProgramAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /poct/pt-events"
              payload: { enrollment_id: "${enr_id}", shipment_number: 1, due_date: "2026-08-15" }
