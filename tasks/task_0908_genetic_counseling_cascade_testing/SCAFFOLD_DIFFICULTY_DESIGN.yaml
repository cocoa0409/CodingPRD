            - { call: "POST /consent-records", payload: { counseling_case_id: "${case_id}", consent_type: "TESTING" }, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /test-orders", payload: { counseling_case_id: "${case_id}", lab_id: "${lid}", panel_name: "Panel", list_price_cents: 200000, processing_start: "2026-05-02T09:00:00Z", processing_end: "2026-05-10T09:00:00Z" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { order_id: $.data.id } }
          trigger:
