  - rule_id: boundary_precision_check
    instances:

      - name: compliance_ratio_exact_minimum_passes_and_floor_at_minimum_minus_one
        grounds:
          - calculations.compliance_purchase_ratio
          - entities.ProgramTier.fields.compliance_min_ratio_bps
          - entities.ComplianceReview.fields.purchase_ratio_bps
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - endpoints["POST /compliance-reviews"]
        distinguishing_aspect: |
          Boundary type = numeric threshold with an asymmetric comparator plus a
          FLOOR. The 73-day window prorates 20000000 to exactly 4000000 cents, so
          3200000 of contracted spend is exactly 8000 bps and must PASS (>= is
          inclusive), 3199999 is 7999.9975 bps which FLOORS to 7999 and must WARN
          (rounding would wrongly promote it to PASS), and 2392000 is 5980 bps
          which is below 8000 - WARN_BAND_BPS and must BREACH, dragging the member
          to SUSPENDED with payout_hold.
        test_recipe:
          setup:
            - "ProgramTier ELITE with compliance_min_ratio_bps 8000; the WARN band is therefore [7500, 7999]."
            - "Three ACTIVE members, each with committed_annual_spend_cents 20000000 and a countersigned letter for METRO-01."
            - "Deal PBC-2026 ACTIVE with item BEEF-PATTY-4OZ-CS40 and one APPROVED card."
            - "One June batch, NORMALIZED, holding four MATCHED lines invoiced inside the review window: 400 cases at 8000 for member A, 399 cases at 8000 plus 1 case at 7999 for member B, and 299 cases at 8000 for member C."
            - "The review window 2026-05-20..2026-07-31 counts both endpoints: 73 days, and round_half_up(20000000 * 73 / 365) is exactly 4000000."
            - "Deal-wide contracted spend in the window is 8791999, so the DEAL_LOST branch cannot fire and the ratio bands are what is under test."
