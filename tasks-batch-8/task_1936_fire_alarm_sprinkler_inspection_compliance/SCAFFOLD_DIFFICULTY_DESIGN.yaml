  # =====================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: impairment_buffer_adjacency_rejected_half_open
        grounds:
          - validations[priority=11]
          - entities.Impairment.fields.planned_start
          - errors[ERR_IMPAIRMENT_OVERLAP]
        distinguishing_aspect: |
          Semantics #1 (half-open intervals + 4h re-certification buffer) on
          the ProtectedSystem resource: an impairment starting EXACTLY at the
          prior impairment's end is rejected (inside buffer), while one
          starting at end+4h exactly is accepted — pure adjacency is NOT
          allowed here, unlike classic half-open booking.
        test_recipe:
          setup:
            - "System with PLANNED impairment 2026-08-10T08:00..12:00 (buffer occupies 12:00..16:00)"
          setup_api_calls:
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FireMarshal
            - call: "POST /fire-compliance/contractors"
              payload: { legal_name: "Buffer Co", state_license_no: "C-1515" }
              as: FireMarshal
              captures: { con_id: $.data.id }
            - call: "POST /fire-compliance/properties"
              payload: { contractor_id: "${con_id}", address_line: "5 Buffer Rd", occupancy_class: "INDUSTRIAL", jurisdiction_code: "LACO" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /fire-compliance/properties/${prop_id}/systems"
              payload: { system_category: "SPRINKLER", install_date: "2026-01-01", certification_cycle_anchor: "2000-01-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { sys_id: $.data.id }
            - call: "POST /fire-compliance/systems/${sys_id}/impairments"
              payload: { impairment_kind: "PLANNED", planned_start: "2026-08-10T08:00:00Z", planned_end: "2026-08-10T12:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
          trigger:
            - call: "POST /fire-compliance/systems/${sys_id}/impairments"
              payload: { impairment_kind: "PLANNED", planned_start: "2026-08-10T12:00:00Z", planned_end: "2026-08-10T14:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { err_adjacent: $.data.error_id }
            - call: "POST /fire-compliance/systems/${sys_id}/impairments"
              payload: { impairment_kind: "PLANNED", planned_start: "2026-08-10T16:00:00Z", planned_end: "2026-08-10T18:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { imp_ok: $.data.id }
          assert:
            - "captured err_adjacent == ERR_IMPAIRMENT_OVERLAP (start == prior end is inside the 4h buffer)"
            - "captured imp_ok is a persisted Impairment id (start == prior end + 4h exactly is allowed)"
      - name: technician_capacity_fourth_overlapping_event_rejected
        grounds:
          - validations[priority=12]
          - entities.InspectionEvent.fields.lead_technician_id
          - errors[ERR_TECHNICIAN_CAPACITY]
        distinguishing_aspect: |
          Semantics #2 (aggregate capacity, closed-closed intersection) on the
          Technician resource: a technician may lead at most 3 overlapping
          events; the 4th event whose [start,end] merely TOUCHES an existing
          one at an endpoint (closed-closed counts) is rejected — a different
          interval rule than the impairment half-open+buffer rule.
        test_recipe:
          setup:
            - "Technician T with valid SPRINKLER license leads 3 SCHEDULED events all covering 2026-08-12T09:00..10:00"
          setup_api_calls:
            - call: "POST /fire-compliance/_clock/set_current_utc"
