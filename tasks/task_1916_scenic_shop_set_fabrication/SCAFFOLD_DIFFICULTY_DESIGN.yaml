              captures: { submit_err: $.data.error_id }
          assert:
            - "hop 1: Bid.${bid_a}.status == ACCEPTED and production_id is non-null; Production.${prod_a}.status == SCHEDULED and current_price_cents == 900000"
            - "hop 2: Production.${prod_a}.required_review_scopes == [STRUCTURAL, AUTOMATION] and committed_crew_hours == 400 and applied_drawing_revision == 1"
            - "hop 3: Shop.${shop_id}.committed_crew_hours == 400 and capacity_ratio_bp == 10000 and posture == SATURATED"
            - "hop 4 (gate): submitting the next bid fails with ERR_SHOP_SATURATED"
            - "Client.${cl_id}.outstanding_cents == 900000"

      - name: strike_reclaim_cascade_restores_stock_and_inventory_value
