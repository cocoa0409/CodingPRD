      - name: missing_user_context_returns_401
        claim_type: role_denial
        grounds: ["roles", "validations[priority=1]", "errors[ERR_MISSING_USER_CONTEXT]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers returns 401 ERR_MISSING_USER_CONTEXT (auth before everything)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /catalog/test-offerings"
              as: Anonymous
              captures: { err: '$.data.error_id' }
          assert: ["returns 401 ERR_MISSING_USER_CONTEXT (no auth headers)"]

      - name: patient_cannot_act_on_other_patients_cart_403
        claim_type: ownership_denial
        grounds: ["roles", "validations[priority=3]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "A Patient adding a line to a cart owned by a different patient_id gets 403 ERR_NOT_RESOURCE_OWNER."
        test_recipe:
          setup: ["Offering OW @1000. Patient POA owns a cart; Patient POB is a different patient."]
          setup_api_calls:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "OW", display_name: "Owner Test", list_price_cents: 1000, specimen_type: "BLOOD" }
              as: CatalogAdmin
              captures: { off_ow: '$.data.id' }
            - call: "POST /catalog/patients"
