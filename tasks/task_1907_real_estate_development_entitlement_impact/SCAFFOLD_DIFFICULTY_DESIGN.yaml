  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: fee_assessment_net_equals_gross_minus_credits_conservation
        grounds:
          - calculations.impact_fee_assessment
          - entities.ImpactFeeAssessment.fields.gross_total
          - entities.ImpactFeeAssessment.fields.prior_use_credit_total
          - entities.ImpactFeeAssessment.fields.improvement_credit_total
          - entities.ImpactFeeAssessment.fields.net_total
        distinguishing_aspect: |
          Conserved quantity = dollar amount: for every assessment,
          net_total == gross_total - prior_use_credit_total - improvement_credit_total
          EXACTLY, per category and in aggregate. Payment of the full net_total
          followed by a DENY-triggered refund returns outstanding balance to 0 —
          the forward (pay) and compensating (refund) actions conserve the
          applicant's outlay at zero drift.
        test_recipe:
          setup:
            - "Application SUBMITTED; provisional assessment OPEN; applicant pays full net_total, then application is DENIED, triggering refund"
          setup_api_calls:
            - call: "POST /entitlement/_clock/set_current_utc"
