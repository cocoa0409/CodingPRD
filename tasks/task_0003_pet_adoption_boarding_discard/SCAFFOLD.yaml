# =============================================================================
# Scaffold: pet-adoption-boarding benchmark seed tables (v1)
# =============================================================================

scenario: |
  Pet adoption and boarding platform: animal profiles, adoption application
  approval process, home visit assessment, boarding matching, vaccination
  record compliance, and fee settlement.

domain_name: pet-adoption-boarding
api_prefix: /shelters

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - version_pinning_on_approval
    - derived_field_reconciliation

  entity_topology: flat
  # Flat: Shelter, Animal, Adopter, Application, HomeVisit, VaccinationRecord,
  #       BoardingReservation, BoardingMatch, FeeInvoice, ComplianceHold are
  #       peer entities linked by FK references, not nested URL paths.

  state_machine_shape: branching
  # Branching: Application has approve/reject fork; HomeVisit has pass/fail fork;
  #            BoardingReservation has confirm/cancel fork with revision loops.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate

  role_model: approval_chain
  # Requester (Adopter/BoardingClient) -> Reviewer (CaseWorker) -> Approver (ShelterManager)

  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (12 entities)
# =============================================================================
entities:
  - name: Shelter
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Shelter name" }
      - { name: address, type: string, source: input, description: "Physical address" }
      - { name: boarding_capacity, type: integer, source: input, description: "Maximum number of animals that can be boarded simultaneously" }
      - { name: current_boarding_count, type: integer, source: computed, description: "Number of animals currently boarded (CHECKED_IN BoardingReservations)" }
      - { name: adoption_count, type: integer, source: computed, description: "Total completed adoptions" }
      - { name: compliance_score, type: number, source: computed, description: "Weighted compliance score 0-100 derived from vaccination compliance rate across animals" }
      - { name: revenue_balance, type: number, source: computed, description: "Sum of PAID FeeInvoice amounts minus REFUNDED amounts" }
      - { name: status, type: enum, source: system, description: "OPEN | SUSPENDED" }

  - name: Animal
    parent: null
    common_fields: true
    fields:
      - { name: shelter_id, type: string, source: input, description: "FK to Shelter" }
      - { name: name, type: string, source: input, description: "Animal name" }
      - { name: species, type: enum, source: input, description: "DOG | CAT | RABBIT | BIRD | OTHER" }
      - { name: breed, type: string, source: input, description: "Breed description" }
      - { name: age_months, type: integer, source: input, description: "Age in months" }
      - { name: weight_kg, type: number, source: input, description: "Weight in kilograms" }
      - { name: temperament, type: enum, source: input, description: "CALM | MODERATE | ENERGETIC | AGGRESSIVE" }
      - { name: special_needs, type: array, source: input, default: [], description: "Array of special need tags (e.g., MEDICATION_REQUIRED, DIET_RESTRICTED, MOBILITY_LIMITED)" }
      - { name: vaccination_compliant, type: boolean, source: computed, description: "True if all required vaccinations are up-to-date per species schedule" }
      - { name: adoption_eligible, type: boolean, source: computed, description: "True when vaccination_compliant AND status is AVAILABLE AND no active ComplianceHold" }
      - { name: boarding_compatible_tags, type: array, source: computed, description: "Derived tags for boarding matching: species, temperament, special_needs" }
      - { name: status, type: enum, source: system, description: "INTAKE | AVAILABLE | ADOPTION_PENDING | ADOPTED | BOARDING | UNAVAILABLE" }

  - name: VaccinationRecord
    parent: null
    common_fields: true
    fields:
      - { name: animal_id, type: string, source: input, description: "FK to Animal" }
      - { name: vaccine_name, type: string, source: input, description: "Vaccine name (e.g., RABIES, DHPP, FVRCP, BORDETELLA)" }
      - { name: administered_date, type: datetime, source: input, description: "Date vaccine was administered" }
      - { name: expiry_date, type: datetime, source: input, description: "Date vaccine expires" }
      - { name: batch_number, type: string, source: input, description: "Vaccine batch identifier" }
      - { name: veterinarian_name, type: string, source: input, description: "Administering veterinarian" }
      - { name: is_valid, type: boolean, source: computed, description: "True if expiry_date > current time" }

  - name: Adopter
    parent: null
    common_fields: true
    fields:
      - { name: shelter_id, type: string, source: input, description: "FK to Shelter this adopter is registered with" }
      - { name: full_name, type: string, source: input, description: "Adopter full name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: home_type, type: enum, source: input, description: "HOUSE | APARTMENT | FARM | OTHER" }
      - { name: has_yard, type: boolean, source: input, description: "Whether the home has a yard" }
      - { name: has_other_pets, type: boolean, source: input, description: "Whether adopter already has other pets" }
      - { name: other_pet_species, type: array, source: input, default: [], description: "Species of existing pets" }
      - { name: adoption_history_count, type: integer, source: computed, description: "Number of completed adoptions by this adopter" }
      - { name: home_visit_passed, type: boolean, source: computed, description: "True if most recent HomeVisit for this adopter has result PASS" }
      - { name: status, type: enum, source: system, description: "ACTIVE | BLACKLISTED" }

  - name: AdoptionApplication
    parent: null
    common_fields: true
    fields:
      - { name: shelter_id, type: string, source: system, description: "FK to Shelter (derived from animal)" }
      - { name: animal_id, type: string, source: input, description: "FK to Animal being adopted" }
      - { name: adopter_id, type: string, source: input, description: "FK to Adopter" }
      - { name: reason, type: string, source: input, description: "Why the adopter wants this animal" }
      - { name: home_visit_id, type: string, source: system, description: "FK to associated HomeVisit, set when visit is scheduled" }
      - { name: animal_version, type: integer, source: system, description: "Version of Animal record at time of submission — pinned for review consistency" }
      - { name: adopter_version, type: integer, source: system, description: "Version of Adopter record at time of submission — pinned for review consistency" }
      - { name: reviewer_id, type: string, source: system, description: "CaseWorker who reviewed the application" }
      - { name: approver_id, type: string, source: system, description: "ShelterManager who gave final approval" }
      - { name: rejection_reason, type: string, source: system, description: "Reason for rejection, null unless REJECTED" }
      - { name: fee_invoice_id, type: string, source: system, description: "FK to FeeInvoice, created on approval" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | HOME_VISIT_REQUIRED | HOME_VISIT_SCHEDULED | REVIEWED | APPROVED | REJECTED | WITHDRAWN | COMPLETED" }

  - name: HomeVisit
    parent: null
    common_fields: true
    fields:
      - { name: adopter_id, type: string, source: input, description: "FK to Adopter" }
      - { name: application_id, type: string, source: system, description: "FK to AdoptionApplication that triggered this visit" }
      - { name: case_worker_id, type: string, source: system, description: "CaseWorker conducting the visit" }
      - { name: scheduled_date, type: datetime, source: input, description: "Scheduled visit date" }
      - { name: yard_adequate, type: boolean, source: input, description: "Assessment: yard meets requirements" }
      - { name: space_adequate, type: boolean, source: input, description: "Assessment: living space adequate" }
      - { name: safety_hazards_found, type: boolean, source: input, description: "Assessment: safety hazards present" }
      - { name: existing_pets_compatible, type: boolean, source: input, description: "Assessment: existing pets are compatible" }
      - { name: overall_score, type: integer, source: computed, description: "Weighted score 0-100 from assessment criteria" }
      - { name: result, type: enum, source: computed, description: "PASS (score >= 70) | CONDITIONAL_PASS (50-69) | FAIL (< 50)" }
      - { name: notes, type: string, source: input, description: "Inspector notes" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED | EXPIRED" }

  - name: BoardingReservation
    parent: null
    common_fields: true
    fields:
      - { name: shelter_id, type: string, source: input, description: "FK to Shelter" }
      - { name: animal_id, type: string, source: input, description: "FK to Animal being boarded" }
      - { name: owner_name, type: string, source: input, description: "Pet owner name" }
      - { name: owner_contact, type: string, source: input, description: "Pet owner contact info" }
      - { name: check_in_date, type: datetime, source: input, description: "Planned check-in date" }
      - { name: check_out_date, type: datetime, source: input, description: "Planned check-out date" }
      - { name: actual_check_in, type: datetime, source: system, description: "Actual check-in timestamp" }
      - { name: actual_check_out, type: datetime, source: system, description: "Actual check-out timestamp" }
      - { name: duration_days, type: integer, source: computed, description: "Computed from check-in/check-out dates, rounded up to nearest whole day" }
      - { name: special_instructions, type: string, source: input, description: "Care instructions from owner" }
      - { name: boarding_match_id, type: string, source: system, description: "FK to BoardingMatch once matched" }
      - { name: fee_invoice_id, type: string, source: system, description: "FK to FeeInvoice" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | CHECKED_IN | CHECKED_OUT | CANCELLED" }

  - name: BoardingMatch
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "UUID identifier" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: reservation_id, type: string, source: input, description: "FK to BoardingReservation" }
      - { name: animal_id, type: string, source: system, description: "FK to Animal (from reservation)" }
      - { name: shelter_id, type: string, source: system, description: "FK to Shelter" }
      - { name: compatibility_score, type: number, source: computed, description: "Compatibility score 0-100 based on species mix, temperament, and special needs" }
      - { name: boarding_zone, type: string, source: computed, description: "Assigned zone based on species and temperament grouping" }
      - { name: conflict_flags, type: array, source: computed, description: "Array of conflict warnings (e.g., AGGRESSIVE_NEAR_CALM, SPECIES_MISMATCH)" }

  - name: FeeInvoice
    parent: null
    common_fields: true
    fields:
      - { name: shelter_id, type: string, source: system, description: "FK to Shelter" }
      - { name: reference_type, type: enum, source: system, description: "ADOPTION | BOARDING — what this invoice is for" }
      - { name: reference_id, type: string, source: system, description: "FK to AdoptionApplication or BoardingReservation" }
      - { name: line_items, type: array, source: computed, description: "Array of {description, quantity, unit_price, amount} objects" }
      - { name: subtotal, type: number, source: computed, description: "Sum of line item amounts" }
      - { name: tax_rate, type: number, source: system, description: "Applicable tax rate (shelter-configured)" }
      - { name: tax_amount, type: number, source: computed, description: "subtotal * tax_rate, rounded half-up to 2 decimal places" }
      - { name: discount_amount, type: number, source: computed, description: "Discount applied (loyalty, promotional)" }
      - { name: total_amount, type: number, source: computed, description: "subtotal + tax_amount - discount_amount" }
      - { name: paid_amount, type: number, source: system, description: "Amount paid so far" }
      - { name: refund_amount, type: number, source: system, description: "Amount refunded" }
      - { name: balance_due, type: number, source: computed, description: "total_amount - paid_amount + refund_amount" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PAID | PARTIALLY_PAID | REFUNDED | VOID" }

  - name: ComplianceHold
    parent: null
    common_fields: true
    fields:
      - { name: animal_id, type: string, source: input, description: "FK to Animal" }
      - { name: hold_type, type: enum, source: input, description: "VACCINATION_OVERDUE | HEALTH_CONCERN | BEHAVIOR_INCIDENT | QUARANTINE" }
      - { name: reason, type: string, source: input, description: "Detailed reason for the hold" }
      - { name: imposed_by, type: string, source: system, description: "User ID who created the hold" }
      - { name: resolved_by, type: string, source: system, description: "User ID who resolved the hold" }
      - { name: resolution_notes, type: string, source: system, description: "Notes on how the hold was resolved" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RESOLVED" }

  - name: FeeSchedule
    parent: null
    common_fields: true
    fields:
      - { name: shelter_id, type: string, source: input, description: "FK to Shelter" }
      - { name: fee_type, type: enum, source: input, description: "ADOPTION_BASE | BOARDING_DAILY | SPECIAL_NEEDS_SURCHARGE | VACCINATION_FEE | LOYALTY_DISCOUNT" }
      - { name: species, type: enum, source: input, description: "DOG | CAT | RABBIT | BIRD | OTHER | ALL — which species this rate applies to" }
      - { name: amount, type: number, source: input, description: "Fee amount or discount percentage" }
      - { name: effective_from, type: datetime, source: input, description: "Start of validity period" }
      - { name: effective_to, type: datetime, source: input, description: "End of validity period (null = no end)" }
      - { name: is_active, type: boolean, source: computed, description: "True if current time is within effective period" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Shelter
    field: status
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /shelters/{shelterId}/suspend"
        actor: ShelterManager
        preconditions:
          - "Shelter must be OPEN"
        side_effects:
          - "All new AdoptionApplications blocked"
          - "All new BoardingReservations blocked"
          - "Existing in-progress operations continue"

      - from: SUSPENDED
        to: OPEN
        trigger: "POST /shelters/{shelterId}/reopen"
        actor: ShelterManager
        preconditions:
          - "Shelter must be SUSPENDED"
          - "No CRITICAL ComplianceHolds on any animal in this shelter"
        side_effects:
          - "Normal operations resume"

  - entity: Animal
    field: status
    initial_state: INTAKE
    terminal_states: [ADOPTED]
    transitions:
      - from: INTAKE
        to: AVAILABLE
        trigger: "POST /animals/{animalId}/make-available"
        actor: CaseWorker
        preconditions:
          - "Animal must be INTAKE"
          - "vaccination_compliant must be true (ERR_VACCINATION_NOT_COMPLIANT)"
          - "No ACTIVE ComplianceHold with severity HIGH or CRITICAL (ERR_COMPLIANCE_HOLD_ACTIVE)"
        side_effects:
          - "adoption_eligible recomputed"

      - from: AVAILABLE
        to: ADOPTION_PENDING
        trigger: "system (automatic when AdoptionApplication is APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "adoption_eligible set to false"

      - from: ADOPTION_PENDING
        to: ADOPTED
        trigger: "system (automatic when AdoptionApplication is COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "shelter.adoption_count incremented"

      - from: ADOPTION_PENDING
        to: AVAILABLE
        trigger: "system (automatic when AdoptionApplication is REJECTED or WITHDRAWN)"
        actor: system
        preconditions: []
        side_effects:
          - "adoption_eligible recomputed"

      - from: AVAILABLE
        to: BOARDING
        trigger: "system (automatic when BoardingReservation is CHECKED_IN for shelter-owned animal)"
        actor: system
        preconditions: []
        side_effects: []

      - from: BOARDING
        to: AVAILABLE
        trigger: "system (automatic when BoardingReservation is CHECKED_OUT)"
        actor: system
        preconditions: []
        side_effects: []

      - from: [AVAILABLE, BOARDING]
        to: UNAVAILABLE
        trigger: "system (automatic when ComplianceHold with severity HIGH or CRITICAL is created)"
        actor: system
        preconditions: []
        side_effects:
          - "adoption_eligible set to false"
          - "If animal has active BoardingReservation, reservation NOT cancelled (animal stays in care)"

      - from: UNAVAILABLE
        to: AVAILABLE
        trigger: "system (automatic when all HIGH/CRITICAL ComplianceHolds are resolved)"
        actor: system
        preconditions:
          - "No remaining ACTIVE ComplianceHold with severity HIGH or CRITICAL"
        side_effects:
          - "adoption_eligible recomputed"

  - entity: AdoptionApplication
    field: status
    initial_state: SUBMITTED
    terminal_states: [COMPLETED, REJECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /adoption-applications/{applicationId}/start-review"
        actor: CaseWorker
        preconditions:
          - "Application must be SUBMITTED"
          - "Animal must still be AVAILABLE (ERR_ANIMAL_NOT_AVAILABLE)"
          - "Adopter must be ACTIVE (ERR_ADOPTER_BLACKLISTED)"
        side_effects:
          - "reviewer_id set to current user"
          - "animal_version pinned from current Animal.version"
          - "adopter_version pinned from current Adopter.version"

      - from: UNDER_REVIEW
        to: HOME_VISIT_REQUIRED
        trigger: "POST /adoption-applications/{applicationId}/require-home-visit"
        actor: CaseWorker
        preconditions:
          - "Application must be UNDER_REVIEW"
          - "reviewer_id must match current user (ERR_REVIEWER_MISMATCH)"
        side_effects: []

      - from: UNDER_REVIEW
        to: REVIEWED
        trigger: "POST /adoption-applications/{applicationId}/complete-review"
        actor: CaseWorker
        preconditions:
          - "Application must be UNDER_REVIEW"
          - "reviewer_id must match current user (ERR_REVIEWER_MISMATCH)"
          - "Adopter must have home_visit_passed = true OR animal species is CAT/BIRD/RABBIT (ERR_HOME_VISIT_REQUIRED)"
        side_effects: []

      - from: HOME_VISIT_REQUIRED
        to: HOME_VISIT_SCHEDULED
        trigger: "system (automatic when HomeVisit is created for this application)"
        actor: system
        preconditions: []
        side_effects:
          - "home_visit_id set"

      - from: HOME_VISIT_SCHEDULED
        to: REVIEWED
        trigger: "system (automatic when associated HomeVisit completes with PASS or CONDITIONAL_PASS)"
        actor: system
        preconditions: []
        side_effects: []

      - from: HOME_VISIT_SCHEDULED
        to: REJECTED
        trigger: "system (automatic when associated HomeVisit completes with FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "rejection_reason set to 'Home visit failed'"
          - "Animal reverts to AVAILABLE if ADOPTION_PENDING"

      - from: REVIEWED
        to: APPROVED
        trigger: "POST /adoption-applications/{applicationId}/approve"
        actor: ShelterManager
        preconditions:
          - "Application must be REVIEWED"
          - "approver_id must differ from reviewer_id (ERR_SELF_APPROVAL)"
          - "Animal.version must match pinned animal_version (ERR_STALE_ANIMAL_DATA)"
          - "Adopter.version must match pinned adopter_version (ERR_STALE_ADOPTER_DATA)"
          - "Animal must still be AVAILABLE (ERR_ANIMAL_NOT_AVAILABLE)"
          - "Shelter must be OPEN (ERR_SHELTER_SUSPENDED)"
        side_effects:
          - "approver_id set to current user"
          - "Animal status -> ADOPTION_PENDING"
          - "FeeInvoice created with adoption fees"
          - "fee_invoice_id set on application"

      - from: REVIEWED
        to: REJECTED
        trigger: "POST /adoption-applications/{applicationId}/reject"
        actor: ShelterManager
        preconditions:
          - "Application must be REVIEWED"
        side_effects:
          - "rejection_reason set from request body"

      - from: APPROVED
        to: COMPLETED
        trigger: "POST /adoption-applications/{applicationId}/complete"
        actor: CaseWorker
        preconditions:
          - "Application must be APPROVED"
          - "Associated FeeInvoice must be PAID (ERR_FEE_NOT_PAID)"
        side_effects:
          - "Animal status -> ADOPTED"
          - "shelter.adoption_count incremented"
          - "adopter.adoption_history_count incremented"

      - from: [SUBMITTED, UNDER_REVIEW, HOME_VISIT_REQUIRED, HOME_VISIT_SCHEDULED, REVIEWED]
        to: WITHDRAWN
        trigger: "POST /adoption-applications/{applicationId}/withdraw"
        actor: CaseWorker
        preconditions:
          - "Application must not be APPROVED, COMPLETED, or REJECTED"
        side_effects:
          - "If Animal was ADOPTION_PENDING, reverts to AVAILABLE"
          - "If HomeVisit was SCHEDULED, it is CANCELLED"

  - entity: HomeVisit
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, EXPIRED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /home-visits/{homeVisitId}/complete"
        actor: CaseWorker
        preconditions:
          - "HomeVisit must be SCHEDULED"
          - "case_worker_id must match current user (ERR_ASSESSOR_MISMATCH)"
          - "Assessment fields must be provided (yard_adequate, space_adequate, safety_hazards_found, existing_pets_compatible)"
        side_effects:
          - "overall_score computed from assessment criteria"
          - "result derived from overall_score"
          - "adopter.home_visit_passed updated based on result"
          - "Associated AdoptionApplication transitions based on result"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /home-visits/{homeVisitId}/cancel"
        actor: CaseWorker
        preconditions:
          - "HomeVisit must be SCHEDULED"
        side_effects:
          - "Associated AdoptionApplication reverts to HOME_VISIT_REQUIRED"

      - from: SCHEDULED
        to: EXPIRED
        trigger: "system (automatic if scheduled_date has passed without completion)"
        actor: system
        preconditions: []
        side_effects:
          - "Associated AdoptionApplication reverts to HOME_VISIT_REQUIRED"

  - entity: BoardingReservation
    field: status
    initial_state: REQUESTED
    terminal_states: [CHECKED_OUT, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /boarding-reservations/{reservationId}/confirm"
        actor: CaseWorker
        preconditions:
          - "Reservation must be REQUESTED"
          - "Animal vaccination_compliant must be true (ERR_VACCINATION_NOT_COMPLIANT)"
          - "Shelter current_boarding_count < boarding_capacity (ERR_BOARDING_CAPACITY_FULL)"
          - "No date overlap with other CONFIRMED/CHECKED_IN reservations for same animal (ERR_BOARDING_DATE_OVERLAP)"
          - "Shelter must be OPEN (ERR_SHELTER_SUSPENDED)"
        side_effects:
          - "BoardingMatch created with compatibility scoring"
          - "boarding_match_id set on reservation"
          - "FeeInvoice created with boarding fees"
          - "fee_invoice_id set on reservation"

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /boarding-reservations/{reservationId}/check-in"
        actor: CaseWorker
        preconditions:
          - "Reservation must be CONFIRMED"
          - "Animal vaccination_compliant must still be true (ERR_VACCINATION_NOT_COMPLIANT)"
          - "No ACTIVE ComplianceHold with severity HIGH or CRITICAL on animal (ERR_COMPLIANCE_HOLD_ACTIVE)"
        side_effects:
          - "actual_check_in set to current timestamp"
          - "shelter.current_boarding_count incremented"
          - "Animal status -> BOARDING (if shelter-owned)"

      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /boarding-reservations/{reservationId}/check-out"
        actor: CaseWorker
        preconditions:
          - "Reservation must be CHECKED_IN"
        side_effects:
          - "actual_check_out set to current timestamp"
          - "duration_days recomputed from actual dates"
          - "FeeInvoice line items adjusted if actual duration differs from planned"
          - "shelter.current_boarding_count decremented"
          - "Animal status -> AVAILABLE (if shelter-owned)"

      - from: [REQUESTED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /boarding-reservations/{reservationId}/cancel"
        actor: CaseWorker
        preconditions:
          - "Reservation must be REQUESTED or CONFIRMED"
        side_effects:
          - "If CONFIRMED, boarding_match voided"
          - "If FeeInvoice exists and is ISSUED, status -> VOID"
          - "If FeeInvoice is PAID, refund initiated"

  - entity: FeeInvoice
    field: status
    initial_state: DRAFT
    terminal_states: [PAID, REFUNDED, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "system (automatic on AdoptionApplication approval or BoardingReservation confirmation)"
        actor: system
        preconditions: []
        side_effects:
          - "Line items calculated from FeeSchedule"

      - from: ISSUED
        to: PAID
        trigger: "POST /fee-invoices/{invoiceId}/pay"
        actor: CaseWorker
        preconditions:
          - "Invoice must be ISSUED or PARTIALLY_PAID"
          - "paid_amount (existing + new) must equal total_amount (ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "paid_amount updated"
          - "shelter.revenue_balance increased"

      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /fee-invoices/{invoiceId}/pay"
        actor: CaseWorker
        preconditions:
          - "Invoice must be ISSUED or PARTIALLY_PAID"
          - "paid_amount (existing + new) must be less than total_amount"
        side_effects:
          - "paid_amount updated"
          - "balance_due recomputed"

      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /fee-invoices/{invoiceId}/pay"
        actor: CaseWorker
        preconditions:
          - "paid_amount (existing + new) must equal total_amount"
        side_effects:
          - "shelter.revenue_balance increased by final payment"

      - from: [PAID, PARTIALLY_PAID]
        to: REFUNDED
        trigger: "POST /fee-invoices/{invoiceId}/refund"
        actor: ShelterManager
        preconditions:
          - "Invoice must be PAID or PARTIALLY_PAID"
        side_effects:
          - "refund_amount set to paid_amount"
          - "shelter.revenue_balance decreased"

      - from: [DRAFT, ISSUED]
        to: VOID
        trigger: "POST /fee-invoices/{invoiceId}/void"
        actor: ShelterManager
        preconditions:
          - "Invoice must be DRAFT or ISSUED"
          - "No payments have been made (paid_amount == 0) (ERR_INVOICE_HAS_PAYMENTS)"
        side_effects: []

  - entity: ComplianceHold
    field: status
    initial_state: ACTIVE
    terminal_states: [RESOLVED]
    transitions:
      - from: ACTIVE
        to: RESOLVED
        trigger: "POST /compliance-holds/{holdId}/resolve"
        actor: ShelterManager
        preconditions:
          - "Hold must be ACTIVE"
          - "resolution_notes must be provided"
        side_effects:
          - "resolved_by set to current user"
          - "Animal.adoption_eligible recomputed"
          - "Animal status may revert from UNAVAILABLE to AVAILABLE"
          - "shelter.compliance_score recomputed"

# =============================================================================
# Table 2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two AdoptionApplications submitted for the same animal simultaneously"
    guarantee: "At most one application can be in APPROVED/COMPLETED status per animal at any time; second approval rejected"
    error_id: ERR_ANIMAL_NOT_AVAILABLE
    http_status: 409

  - scenario: "Application approved while animal receives a ComplianceHold simultaneously"
    guarantee: "Exactly one operation succeeds; if hold arrives first, approval fails with ERR_COMPLIANCE_HOLD_ACTIVE"
    serialization: "First-writer-wins on animal status"

  - scenario: "Two boarding reservations confirmed for the same animal with overlapping dates"
    guarantee: "At most one confirmed reservation per animal per date range; second confirmation rejected"
    error_id: ERR_BOARDING_DATE_OVERLAP
    http_status: 409

  - scenario: "Boarding check-in while vaccination record expires simultaneously"
    guarantee: "Check-in validates vaccination_compliant at execution time; if expired, check-in fails"
    error_id: ERR_VACCINATION_NOT_COMPLIANT
    http_status: 409

  - scenario: "Fee invoice payment while invoice is being voided simultaneously"
    guarantee: "Exactly one operation succeeds; loser receives ERR_INVALID_STATE"
    serialization: "First-writer-wins on invoice status"

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: vaccination_compliance_check
    trigger: "VaccinationRecord creation, Animal status change, periodic recheck"
    algorithm: aggregation
    formula: |
      required_vaccines = SPECIES_VACCINE_MAP[animal.species]
      for each required vaccine:
        records = VaccinationRecords where animal_id = animal.id AND vaccine_name = vaccine
        valid_records = [r for r in records if r.expiry_date > current_time]
        if len(valid_records) == 0:
          vaccination_compliant = false
          RETURN
      vaccination_compliant = true
    constants:
      SPECIES_VACCINE_MAP:
        DOG: [RABIES, DHPP, BORDETELLA]
        CAT: [RABIES, FVRCP]
        RABBIT: [RHDV]
        BIRD: []
        OTHER: []
    variants:
      - name: boarding_compliance_check
        when: "boarding reservation confirmation or check-in"
        difference: "Also requires BORDETELLA for all species except BIRD, regardless of species default schedule"

  - name: home_visit_scoring
    trigger: "HomeVisit completion"
    algorithm: weighted_scoring
    formula: |
      scores = {
        yard_adequate: 25 if true else 0,
        space_adequate: 30 if true else 0,
        safety_hazards_found: 0 if true else 25,  # penalty for hazards
        existing_pets_compatible: 20 if true else 0
      }
      overall_score = sum(scores.values())

      if overall_score >= PASS_THRESHOLD:
        result = PASS
      elif overall_score >= CONDITIONAL_THRESHOLD:
        result = CONDITIONAL_PASS
      else:
        result = FAIL
    constants:
      PASS_THRESHOLD: 70
      CONDITIONAL_THRESHOLD: 50
    precision: "integer, no rounding needed"
    variants:
      - name: no_yard_adjustment
        when: "Animal species is CAT, BIRD, or RABBIT"
        difference: "yard_adequate weight is 0 (not applicable); space_adequate weight increases to 45; pass threshold remains 70 but max possible score is 90"

  - name: boarding_compatibility_scoring
    trigger: "BoardingReservation confirmation (BoardingMatch creation)"
    algorithm: weighted_scoring
    formula: |
      base_score = 100
      penalties = 0

      # Species compatibility
      concurrent_animals = animals currently CHECKED_IN at same shelter
      for each concurrent_animal:
        if concurrent_animal.species != animal.species:
          penalties += SPECIES_MISMATCH_PENALTY
        if concurrent_animal.temperament == AGGRESSIVE or animal.temperament == AGGRESSIVE:
          penalties += AGGRESSIVE_PENALTY
        if concurrent_animal.temperament == ENERGETIC and animal.temperament == CALM:
          penalties += TEMPERAMENT_CLASH_PENALTY

      # Special needs check
      if len(animal.special_needs) > 0:
        penalties += SPECIAL_NEEDS_PENALTY * len(animal.special_needs)

      compatibility_score = max(0, base_score - penalties)

      # Zone assignment
      if animal.temperament == AGGRESSIVE:
        boarding_zone = "ISOLATION"
      elif animal.temperament == ENERGETIC:
        boarding_zone = "ACTIVE"
      elif animal.species in [CAT, BIRD, RABBIT]:
        boarding_zone = "SMALL_ANIMAL"
      else:
        boarding_zone = "GENERAL"
    constants:
      SPECIES_MISMATCH_PENALTY: 10
      AGGRESSIVE_PENALTY: 25
      TEMPERAMENT_CLASH_PENALTY: 15
      SPECIAL_NEEDS_PENALTY: 5
    precision: "integer"

  - name: adoption_fee_calculation
    trigger: "AdoptionApplication approval (FeeInvoice creation)"
    algorithm: tiered_pricing
    formula: |
      base_fee = FeeSchedule.lookup(shelter_id, ADOPTION_BASE, animal.species)

      # Age discount: animals over 7 years get 50% off base
      if animal.age_months >= AGE_SENIOR_THRESHOLD:
        base_fee = base_fee * SENIOR_DISCOUNT_RATE

      # Special needs surcharge per tag
      surcharge = len(animal.special_needs) * FeeSchedule.lookup(shelter_id, SPECIAL_NEEDS_SURCHARGE, animal.species)

      # Loyalty discount for repeat adopters
      loyalty_discount = 0
      if adopter.adoption_history_count >= LOYALTY_THRESHOLD:
        loyalty_rate = FeeSchedule.lookup(shelter_id, LOYALTY_DISCOUNT, ALL)
        loyalty_discount = (base_fee + surcharge) * loyalty_rate

      subtotal = base_fee + surcharge
      discount_amount = loyalty_discount
      tax_amount = round_half_up((subtotal - discount_amount) * tax_rate, 2)
      total_amount = subtotal - discount_amount + tax_amount
    constants:
      AGE_SENIOR_THRESHOLD: 84
      SENIOR_DISCOUNT_RATE: 0.5
      LOYALTY_THRESHOLD: 2
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional_fee_estimate
        when: "Application under review (before approval)"
        difference: "Uses current FeeSchedule rates; may differ from final if rates change between review and approval"
      - name: final_fee_calculation
        when: "Application approved"
        difference: "Uses FeeSchedule rates effective at approval time; pinned and immutable"

  - name: boarding_fee_calculation
    trigger: "BoardingReservation confirmation and check-out adjustment"
    algorithm: tiered_pricing
    formula: |
      daily_rate = FeeSchedule.lookup(shelter_id, BOARDING_DAILY, animal.species)

      # Duration calculation
      planned_days = ceil((check_out_date - check_in_date) / 86400)

      # Special needs surcharge per day
      daily_surcharge = len(animal.special_needs) * FeeSchedule.lookup(shelter_id, SPECIAL_NEEDS_SURCHARGE, animal.species)

      # Long-stay discount: stays over 14 days get 10% off daily rate
      effective_daily = daily_rate + daily_surcharge
      if planned_days > LONG_STAY_THRESHOLD:
        effective_daily = effective_daily * LONG_STAY_DISCOUNT_RATE

      subtotal = effective_daily * planned_days
      tax_amount = round_half_up(subtotal * tax_rate, 2)
      total_amount = subtotal + tax_amount
    constants:
      LONG_STAY_THRESHOLD: 14
      LONG_STAY_DISCOUNT_RATE: 0.9
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional_boarding_fee
        when: "Reservation confirmed (planned dates)"
        difference: "Uses planned check-in/check-out dates"
      - name: final_boarding_fee
        when: "Check-out (actual dates)"
        difference: "Recalculated using actual_check_in and actual_check_out; invoice adjusted if different from provisional"

  - name: shelter_compliance_score
    trigger: "VaccinationRecord creation, ComplianceHold creation/resolution, Animal status change"
    algorithm: aggregation
    formula: |
      animals = all Animals in shelter with status not ADOPTED
      if len(animals) == 0:
        compliance_score = 100
        RETURN

      compliant_count = count(a for a in animals if a.vaccination_compliant)
      hold_penalty = count(active ComplianceHolds across all animals) * HOLD_PENALTY_POINTS
      base_score = (compliant_count / len(animals)) * 100
      compliance_score = max(0, base_score - hold_penalty)
    constants:
      HOLD_PENALTY_POINTS: 5
    precision: "2 decimal places, round_half_up"

  - name: shelter_revenue_balance
    trigger: "FeeInvoice payment or refund"
    algorithm: aggregation
    formula: |
      revenue_balance = sum(paid_amount for PAID invoices in shelter)
                      - sum(refund_amount for REFUNDED invoices in shelter)

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role must have permission for this operation"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Referenced resources must exist (validated left-to-right in path)"
    error_id: "ERR_SHELTER_NOT_FOUND / ERR_ANIMAL_NOT_FOUND / ERR_ADOPTER_NOT_FOUND / ERR_APPLICATION_NOT_FOUND / ERR_RESERVATION_NOT_FOUND / ERR_INVOICE_NOT_FOUND / ERR_HOLD_NOT_FOUND / ERR_HOME_VISIT_NOT_FOUND / ERR_FEE_SCHEDULE_NOT_FOUND"
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: existence
    check: "Foreign key references in request body must point to existing resources"
    error_id: "ERR_ANIMAL_NOT_FOUND / ERR_ADOPTER_NOT_FOUND / ERR_SHELTER_NOT_FOUND"
    http_status: 404
    applies_to: "POST endpoints with FK references in body"

  - priority: 5
    category: state
    check: "Shelter must be OPEN for new applications and reservations"
    error_id: ERR_SHELTER_SUSPENDED
    http_status: 409
    applies_to: "POST adoption-applications, POST boarding-reservations, approve application"

  - priority: 6
    category: state
    check: "Resource must be in correct state for the operation"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state transition endpoints

  - priority: 7
    category: business_referential
    check: "Animal must be AVAILABLE for new adoption applications"
    error_id: ERR_ANIMAL_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST adoption-applications, approve application"

  - priority: 8
    category: business_referential
    check: "Adopter must be ACTIVE (not BLACKLISTED)"
    error_id: ERR_ADOPTER_BLACKLISTED
    http_status: 409
    applies_to: "POST adoption-applications, start-review"

  - priority: 9
    category: business_safety
    check: "Animal must be vaccination_compliant for availability, boarding confirmation, and check-in"
    error_id: ERR_VACCINATION_NOT_COMPLIANT
    http_status: 409
    applies_to: "make-available, confirm boarding, check-in"

  - priority: 10
    category: business_safety
    check: "No ACTIVE ComplianceHold with severity HIGH or CRITICAL on animal"
    error_id: ERR_COMPLIANCE_HOLD_ACTIVE
    http_status: 409
    applies_to: "make-available, check-in"

  - priority: 11
    category: business_constraint
    check: "At most one APPROVED/COMPLETED application per animal"
    error_id: ERR_ANIMAL_NOT_AVAILABLE
    http_status: 409
    applies_to: "approve application"

  - priority: 12
    category: business_constraint
    check: "Approver must differ from reviewer (segregation of duties)"
    error_id: ERR_SELF_APPROVAL
    http_status: 409
    applies_to: "approve application"

  - priority: 13
    category: business_constraint
    check: "Pinned animal_version must match current Animal.version"
    error_id: ERR_STALE_ANIMAL_DATA
    http_status: 409
    applies_to: "approve application"

  - priority: 14
    category: business_constraint
    check: "Pinned adopter_version must match current Adopter.version"
    error_id: ERR_STALE_ADOPTER_DATA
    http_status: 409
    applies_to: "approve application"

  - priority: 15
    category: business_constraint
    check: "Home visit must be passed for DOG adoptions (PASS or CONDITIONAL_PASS)"
    error_id: ERR_HOME_VISIT_REQUIRED
    http_status: 409
    applies_to: "complete-review (for DOG species)"

  - priority: 16
    category: business_constraint
    check: "Case worker conducting visit must match assigned case_worker_id"
    error_id: ERR_ASSESSOR_MISMATCH
    http_status: 409
    applies_to: "complete home visit"

  - priority: 17
    category: business_constraint
    check: "Reviewer must match assigned reviewer_id"
    error_id: ERR_REVIEWER_MISMATCH
    http_status: 409
    applies_to: "require-home-visit, complete-review"

  - priority: 18
    category: business_constraint
    check: "No overlapping boarding dates for same animal"
    error_id: ERR_BOARDING_DATE_OVERLAP
    http_status: 409
    applies_to: "confirm boarding reservation"

  - priority: 19
    category: business_temporal
    check: "Boarding check_out_date must be after check_in_date"
    error_id: ERR_INVALID_DATES
    http_status: 400
    applies_to: "POST boarding-reservations"

  - priority: 20
    category: business_temporal
    check: "FeeSchedule effective_to must be after effective_from (if provided)"
    error_id: ERR_INVALID_DATES
    http_status: 400
    applies_to: "POST fee-schedules"

  - priority: 21
    category: business_fiscal
    check: "Shelter boarding capacity not exceeded"
    error_id: ERR_BOARDING_CAPACITY_FULL
    http_status: 409
    applies_to: "confirm boarding reservation"

  - priority: 22
    category: business_fiscal
    check: "Fee invoice must be fully paid before adoption completion"
    error_id: ERR_FEE_NOT_PAID
    http_status: 409
    applies_to: "complete adoption application"

  - priority: 23
    category: business_fiscal
    check: "Payment amount must be positive and not exceed balance_due"
    error_id: ERR_PAYMENT_AMOUNT_INVALID
    http_status: 400
    applies_to: "pay invoice"

  - priority: 24
    category: business_fiscal
    check: "Cannot void invoice that has received payments"
    error_id: ERR_INVOICE_HAS_PAYMENTS
    http_status: 409
    applies_to: "void invoice"

# =============================================================================
# Table 5: API Endpoint Table (38 endpoints)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 20, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Shelter ---
  - method: POST
    path: "/shelters"
    description: "Create a new Shelter"
    roles: [ShelterManager]
    code: 201
    input: [name, address, boarding_capacity]
    output: Shelter
    side_effects: ["status=OPEN, computed fields initialized to 0/100"]

  - method: GET
    path: "/shelters"
    description: "List all Shelters"
    roles: [ShelterManager, CaseWorker, Veterinarian]
    code: 200
    input: ["limit?, offset?"]
    output: "Shelter[]"
    side_effects: []

  - method: GET
    path: "/shelters/{shelterId}"
    description: "Get a specific Shelter"
    roles: [ShelterManager, CaseWorker, Veterinarian]
    code: 200
    input: []
    output: Shelter
    side_effects: []

  - method: POST
    path: "/shelters/{shelterId}/suspend"
    description: "Suspend shelter operations"
    roles: [ShelterManager]
    code: 200
    input: []
    output: Shelter
    side_effects: ["status -> SUSPENDED"]

  - method: POST
    path: "/shelters/{shelterId}/reopen"
    description: "Reopen a suspended shelter"
    roles: [ShelterManager]
    code: 200
    input: []
    output: Shelter
    side_effects: ["status -> OPEN"]

  # --- Animal ---
  - method: POST
    path: "/animals"
    description: "Register a new Animal"
    roles: [CaseWorker]
    code: 201
    input: [shelter_id, name, species, breed, age_months, weight_kg, temperament, "special_needs?"]
    output: Animal
    side_effects: ["status=INTAKE, vaccination_compliant computed"]

  - method: GET
    path: "/animals"
    description: "List Animals with optional filters"
    roles: [ShelterManager, CaseWorker, Veterinarian]
    code: 200
    input: ["shelter_id?, species?, status?, limit?, offset?"]
    output: "Animal[]"
    side_effects: []

  - method: GET
    path: "/animals/{animalId}"
    description: "Get a specific Animal"
    roles: [ShelterManager, CaseWorker, Veterinarian]
    code: 200
    input: []
    output: Animal
    side_effects: []

  - method: PATCH
    path: "/animals/{animalId}"
    description: "Update animal details"
    roles: [CaseWorker]
    code: 200
    input: ["name?, breed?, age_months?, weight_kg?, temperament?, special_needs?, version?"]
    output: Animal
    side_effects: ["boarding_compatible_tags recomputed, adoption_eligible recomputed"]

  - method: POST
    path: "/animals/{animalId}/make-available"
    description: "Transition animal from INTAKE to AVAILABLE"
    roles: [CaseWorker]
    code: 200
    input: []
    output: Animal
    side_effects: ["status -> AVAILABLE, adoption_eligible set"]

  # --- VaccinationRecord ---
  - method: POST
    path: "/vaccination-records"
    description: "Add a vaccination record for an animal"
    roles: [Veterinarian]
    code: 201
    input: [animal_id, vaccine_name, administered_date, expiry_date, batch_number, veterinarian_name]
    output: VaccinationRecord
    side_effects: ["animal.vaccination_compliant recomputed, shelter.compliance_score recomputed"]

  - method: GET
    path: "/vaccination-records"
    description: "List vaccination records with optional filters"
    roles: [ShelterManager, CaseWorker, Veterinarian]
    code: 200
    input: ["animal_id?, limit?, offset?"]
    output: "VaccinationRecord[]"
    side_effects: []

  - method: GET
    path: "/vaccination-records/{recordId}"
    description: "Get a specific vaccination record"
    roles: [ShelterManager, CaseWorker, Veterinarian]
    code: 200
    input: []
    output: VaccinationRecord
    side_effects: []

  # --- Adopter ---
  - method: POST
    path: "/adopters"
    description: "Register a new Adopter"
    roles: [CaseWorker]
    code: 201
    input: [shelter_id, full_name, email, phone, home_type, has_yard, has_other_pets, "other_pet_species?"]
    output: Adopter
    side_effects: ["status=ACTIVE, adoption_history_count=0, home_visit_passed=false"]

  - method: GET
    path: "/adopters"
    description: "List Adopters with optional filters"
    roles: [ShelterManager, CaseWorker]
    code: 200
    input: ["shelter_id?, status?, limit?, offset?"]
    output: "Adopter[]"
    side_effects: []

  - method: GET
    path: "/adopters/{adopterId}"
    description: "Get a specific Adopter"
    roles: [ShelterManager, CaseWorker]
    code: 200
    input: []
    output: Adopter
    side_effects: []

  - method: PATCH
    path: "/adopters/{adopterId}"
    description: "Update adopter details"
    roles: [CaseWorker]
    code: 200
    input: ["full_name?, email?, phone?, home_type?, has_yard?, has_other_pets?, other_pet_species?, version?"]
    output: Adopter
    side_effects: []

  - method: POST
    path: "/adopters/{adopterId}/blacklist"
    description: "Blacklist an adopter"
    roles: [ShelterManager]
    code: 200
    input: []
    output: Adopter
    side_effects: ["status -> BLACKLISTED, all SUBMITTED/UNDER_REVIEW applications for this adopter -> WITHDRAWN"]

  # --- AdoptionApplication ---
  - method: POST
    path: "/adoption-applications"
    description: "Submit a new adoption application"
    roles: [CaseWorker]
    code: 201
    input: [animal_id, adopter_id, reason]
    output: AdoptionApplication
    side_effects: ["status=SUBMITTED, shelter_id derived from animal"]

  - method: GET
    path: "/adoption-applications"
    description: "List adoption applications with optional filters"
    roles: [ShelterManager, CaseWorker]
    code: 200
    input: ["shelter_id?, adopter_id?, animal_id?, status?, limit?, offset?"]
    output: "AdoptionApplication[]"
    side_effects: []

  - method: GET
    path: "/adoption-applications/{applicationId}"
    description: "Get a specific application"
    roles: [ShelterManager, CaseWorker]
    code: 200
    input: []
    output: AdoptionApplication
    side_effects: []

  - method: POST
    path: "/adoption-applications/{applicationId}/start-review"
    description: "Begin reviewing an application"
    roles: [CaseWorker]
    code: 200
    input: []
    output: AdoptionApplication
    side_effects: ["status -> UNDER_REVIEW, reviewer_id set, versions pinned"]

  - method: POST
    path: "/adoption-applications/{applicationId}/require-home-visit"
    description: "Flag application as requiring home visit"
    roles: [CaseWorker]
    code: 200
    input: []
    output: AdoptionApplication
    side_effects: ["status -> HOME_VISIT_REQUIRED"]

  - method: POST
    path: "/adoption-applications/{applicationId}/complete-review"
    description: "Complete review and advance to REVIEWED"
    roles: [CaseWorker]
    code: 200
    input: []
    output: AdoptionApplication
    side_effects: ["status -> REVIEWED"]

  - method: POST
    path: "/adoption-applications/{applicationId}/approve"
    description: "Approve an adoption application"
    roles: [ShelterManager]
    code: 200
    input: []
    output: AdoptionApplication
    side_effects: ["status -> APPROVED, Animal -> ADOPTION_PENDING, FeeInvoice created"]

  - method: POST
    path: "/adoption-applications/{applicationId}/reject"
    description: "Reject an adoption application"
    roles: [ShelterManager]
    code: 200
    input: [rejection_reason]
    output: AdoptionApplication
    side_effects: ["status -> REJECTED"]

  - method: POST
    path: "/adoption-applications/{applicationId}/complete"
    description: "Complete an approved adoption"
    roles: [CaseWorker]
    code: 200
    input: []
    output: AdoptionApplication
    side_effects: ["status -> COMPLETED, Animal -> ADOPTED, counters updated"]

  - method: POST
    path: "/adoption-applications/{applicationId}/withdraw"
    description: "Withdraw an adoption application"
    roles: [CaseWorker]
    code: 200
    input: []
    output: AdoptionApplication
    side_effects: ["status -> WITHDRAWN, cascading cleanup"]

  # --- HomeVisit ---
  - method: POST
    path: "/home-visits"
    description: "Schedule a home visit for an adoption application"
    roles: [CaseWorker]
    code: 201
    input: [adopter_id, application_id, scheduled_date]
    output: HomeVisit
    side_effects: ["status=SCHEDULED, case_worker_id set, application -> HOME_VISIT_SCHEDULED"]

  - method: GET
    path: "/home-visits"
    description: "List home visits with optional filters"
    roles: [ShelterManager, CaseWorker]
    code: 200
    input: ["adopter_id?, application_id?, status?, limit?, offset?"]
    output: "HomeVisit[]"
    side_effects: []

  - method: GET
    path: "/home-visits/{homeVisitId}"
    description: "Get a specific home visit"
    roles: [ShelterManager, CaseWorker]
    code: 200
    input: []
    output: HomeVisit
    side_effects: []

  - method: POST
    path: "/home-visits/{homeVisitId}/complete"
    description: "Complete a home visit with assessment results"
    roles: [CaseWorker]
    code: 200
    input: [yard_adequate, space_adequate, safety_hazards_found, existing_pets_compatible, notes]
    output: HomeVisit
    side_effects: ["status -> COMPLETED, score computed, result derived, adopter/application updated"]

  - method: POST
    path: "/home-visits/{homeVisitId}/cancel"
    description: "Cancel a scheduled home visit"
    roles: [CaseWorker]
    code: 200
    input: []
    output: HomeVisit
    side_effects: ["status -> CANCELLED, application reverts to HOME_VISIT_REQUIRED"]

  # --- BoardingReservation ---
  - method: POST
    path: "/boarding-reservations"
    description: "Request a boarding reservation"
    roles: [CaseWorker]
    code: 201
    input: [shelter_id, animal_id, owner_name, owner_contact, check_in_date, check_out_date, "special_instructions?"]
    output: BoardingReservation
    side_effects: ["status=REQUESTED, duration_days computed"]

  - method: GET
    path: "/boarding-reservations"
    description: "List boarding reservations with optional filters"
    roles: [ShelterManager, CaseWorker]
    code: 200
    input: ["shelter_id?, animal_id?, status?, limit?, offset?"]
    output: "BoardingReservation[]"
    side_effects: []

  - method: GET
    path: "/boarding-reservations/{reservationId}"
    description: "Get a specific boarding reservation"
    roles: [ShelterManager, CaseWorker]
    code: 200
    input: []
    output: BoardingReservation
    side_effects: []

  - method: POST
    path: "/boarding-reservations/{reservationId}/confirm"
    description: "Confirm a boarding reservation"
    roles: [ShelterManager]
    code: 200
    input: []
    output: BoardingReservation
    side_effects: ["status -> CONFIRMED, BoardingMatch created, FeeInvoice created"]

  - method: POST
    path: "/boarding-reservations/{reservationId}/check-in"
    description: "Check in animal for boarding"
    roles: [CaseWorker]
    code: 200
    input: []
    output: BoardingReservation
    side_effects: ["status -> CHECKED_IN, actual_check_in set, boarding count updated"]

  - method: POST
    path: "/boarding-reservations/{reservationId}/check-out"
    description: "Check out animal from boarding"
    roles: [CaseWorker]
    code: 200
    input: []
    output: BoardingReservation
    side_effects: ["status -> CHECKED_OUT, fees adjusted, boarding count decremented"]

  - method: POST
    path: "/boarding-reservations/{reservationId}/cancel"
    description: "Cancel a boarding reservation"
    roles: [CaseWorker]
    code: 200
    input: []
    output: BoardingReservation
    side_effects: ["status -> CANCELLED, match voided, invoice voided/refunded"]

  # --- FeeInvoice ---
  - method: GET
    path: "/fee-invoices"
    description: "List fee invoices with optional filters"
    roles: [ShelterManager, CaseWorker]
    code: 200
    input: ["shelter_id?, reference_type?, status?, limit?, offset?"]
    output: "FeeInvoice[]"
    side_effects: []

  - method: GET
    path: "/fee-invoices/{invoiceId}"
    description: "Get a specific fee invoice"
    roles: [ShelterManager, CaseWorker]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: []

  - method: POST
    path: "/fee-invoices/{invoiceId}/pay"
    description: "Record a payment against an invoice"
    roles: [CaseWorker]
    code: 200
    input: [amount]
    output: FeeInvoice
    side_effects: ["paid_amount updated, status -> PAID or PARTIALLY_PAID, revenue updated"]

  - method: POST
    path: "/fee-invoices/{invoiceId}/refund"
    description: "Refund a paid invoice"
    roles: [ShelterManager]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: ["status -> REFUNDED, revenue decreased"]

  - method: POST
    path: "/fee-invoices/{invoiceId}/void"
    description: "Void an unpaid invoice"
    roles: [ShelterManager]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: ["status -> VOID"]

  # --- ComplianceHold ---
  - method: POST
    path: "/compliance-holds"
    description: "Create a compliance hold on an animal"
    roles: [Veterinarian, ShelterManager]
    code: 201
    input: [animal_id, hold_type, reason, severity]
    output: ComplianceHold
    side_effects: ["status=ACTIVE, animal status may change, compliance_score recomputed"]

  - method: GET
    path: "/compliance-holds"
    description: "List compliance holds with optional filters"
    roles: [ShelterManager, CaseWorker, Veterinarian]
    code: 200
    input: ["animal_id?, status?, severity?, limit?, offset?"]
    output: "ComplianceHold[]"
    side_effects: []

  - method: GET
    path: "/compliance-holds/{holdId}"
    description: "Get a specific compliance hold"
    roles: [ShelterManager, CaseWorker, Veterinarian]
    code: 200
    input: []
    output: ComplianceHold
    side_effects: []

  - method: POST
    path: "/compliance-holds/{holdId}/resolve"
    description: "Resolve a compliance hold"
    roles: [ShelterManager]
    code: 200
    input: [resolution_notes]
    output: ComplianceHold
    side_effects: ["status -> RESOLVED, animal status may revert, compliance_score recomputed"]

  # --- FeeSchedule ---
  - method: POST
    path: "/fee-schedules"
    description: "Create a fee schedule entry"
    roles: [ShelterManager]
    code: 201
    input: [shelter_id, fee_type, species, amount, effective_from, "effective_to?"]
    output: FeeSchedule
    side_effects: ["is_active computed"]

  - method: GET
    path: "/fee-schedules"
    description: "List fee schedules with optional filters"
    roles: [ShelterManager, CaseWorker]
    code: 200
    input: ["shelter_id?, fee_type?, species?, limit?, offset?"]
    output: "FeeSchedule[]"
    side_effects: []

  - method: GET
    path: "/fee-schedules/{feeScheduleId}"
    description: "Get a specific fee schedule"
    roles: [ShelterManager, CaseWorker]
    code: 200
    input: []
    output: FeeSchedule
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog (30 error codes)
# =============================================================================
errors:
  # --- Auth ---
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "X-User-ID or X-User-Role header is missing or invalid"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role does not have permission for this operation"

  # --- Request Validation ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required fields, invalid field types, or malformed request body"

  - id: ERR_INVALID_DATES
    http: 400
    condition: "Date range invalid (end before start, or dates in the past for new reservations)"

  # --- Not Found ---
  - id: ERR_SHELTER_NOT_FOUND
    http: 404
    condition: "Shelter with given ID does not exist"

  - id: ERR_ANIMAL_NOT_FOUND
    http: 404
    condition: "Animal with given ID does not exist"

  - id: ERR_ADOPTER_NOT_FOUND
    http: 404
    condition: "Adopter with given ID does not exist"

  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "AdoptionApplication with given ID does not exist"

  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "BoardingReservation with given ID does not exist"

  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "FeeInvoice with given ID does not exist"

  - id: ERR_HOLD_NOT_FOUND
    http: 404
    condition: "ComplianceHold with given ID does not exist"

  - id: ERR_HOME_VISIT_NOT_FOUND
    http: 404
    condition: "HomeVisit with given ID does not exist"

  - id: ERR_FEE_SCHEDULE_NOT_FOUND
    http: 404
    condition: "FeeSchedule with given ID does not exist"

  - id: ERR_VACCINATION_RECORD_NOT_FOUND
    http: 404
    condition: "VaccinationRecord with given ID does not exist"

  # --- State Constraints ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is in wrong state for the requested operation"

  - id: ERR_SHELTER_SUSPENDED
    http: 409
    condition: "Shelter is SUSPENDED; new applications and reservations are blocked"

  - id: ERR_ANIMAL_NOT_AVAILABLE
    http: 409
    condition: "Animal is not in AVAILABLE status or already has a pending/approved application"

  - id: ERR_ADOPTER_BLACKLISTED
    http: 409
    condition: "Adopter is BLACKLISTED and cannot submit or have applications reviewed"

  # --- Business Rules ---
  - id: ERR_VACCINATION_NOT_COMPLIANT
    http: 409
    condition: "Animal does not have all required vaccinations up-to-date"

  - id: ERR_COMPLIANCE_HOLD_ACTIVE
    http: 409
    condition: "Animal has an active ComplianceHold with severity HIGH or CRITICAL"

  - id: ERR_SELF_APPROVAL
    http: 409
    condition: "Approver cannot be the same person as the reviewer (segregation of duties)"

  - id: ERR_STALE_ANIMAL_DATA
    http: 409
    condition: "Animal record has been modified since application was submitted (version mismatch)"

  - id: ERR_STALE_ADOPTER_DATA
    http: 409
    condition: "Adopter record has been modified since application was submitted (version mismatch)"

  - id: ERR_HOME_VISIT_REQUIRED
    http: 409
    condition: "Home visit is required for DOG adoptions but adopter has not passed one"

  - id: ERR_REVIEWER_MISMATCH
    http: 409
    condition: "Only the assigned reviewer can perform this review operation"

  - id: ERR_ASSESSOR_MISMATCH
    http: 409
    condition: "Only the assigned case worker can complete this home visit"

  - id: ERR_BOARDING_DATE_OVERLAP
    http: 409
    condition: "Animal already has a confirmed/checked-in boarding reservation for overlapping dates"

  - id: ERR_BOARDING_CAPACITY_FULL
    http: 409
    condition: "Shelter has reached maximum boarding capacity"

  # --- Financial ---
  - id: ERR_FEE_NOT_PAID
    http: 409
    condition: "Adoption cannot be completed until associated fee invoice is fully paid"

  - id: ERR_PAYMENT_AMOUNT_INVALID
    http: 400
    condition: "Payment amount must be positive and not exceed balance_due"

  - id: ERR_INVOICE_HAS_PAYMENTS
    http: 409
    condition: "Cannot void an invoice that has received payments"

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: ShelterManager
    description: "Senior shelter administrator; oversees shelter operations, approves adoptions, manages financial and compliance actions"
    exclusive_operations:
      - "POST /shelters — Create Shelter"
      - "POST /shelters/{id}/suspend — Suspend shelter"
      - "POST /shelters/{id}/reopen — Reopen shelter"
      - "POST /adoption-applications/{id}/approve — Approve application"
      - "POST /adoption-applications/{id}/reject — Reject application"
      - "POST /adopters/{id}/blacklist — Blacklist adopter"
      - "POST /boarding-reservations/{id}/confirm — Confirm reservation"
      - "POST /fee-invoices/{id}/refund — Refund invoice"
      - "POST /fee-invoices/{id}/void — Void invoice"
      - "POST /compliance-holds/{id}/resolve — Resolve hold"
      - "POST /fee-schedules — Create fee schedule"

  - name: CaseWorker
    description: "Frontline shelter staff; handles animal intake, adopter registration, application processing, home visits, boarding operations, and fee collection"
    exclusive_operations:
      - "POST /animals — Register animal"
      - "PATCH /animals/{id} — Update animal"
      - "POST /animals/{id}/make-available — Make animal available"
      - "POST /adopters — Register adopter"
      - "PATCH /adopters/{id} — Update adopter"
      - "POST /adoption-applications — Submit application"
      - "POST /adoption-applications/{id}/start-review — Start review"
      - "POST /adoption-applications/{id}/require-home-visit — Require home visit"
      - "POST /adoption-applications/{id}/complete-review — Complete review"
      - "POST /adoption-applications/{id}/complete — Complete adoption"
      - "POST /adoption-applications/{id}/withdraw — Withdraw application"
      - "POST /home-visits — Schedule home visit"
      - "POST /home-visits/{id}/complete — Complete home visit"
      - "POST /home-visits/{id}/cancel — Cancel home visit"
      - "POST /boarding-reservations — Request reservation"
      - "POST /boarding-reservations/{id}/check-in — Check in"
      - "POST /boarding-reservations/{id}/check-out — Check out"
      - "POST /boarding-reservations/{id}/cancel — Cancel reservation"
      - "POST /fee-invoices/{id}/pay — Record payment"

  - name: Veterinarian
    description: "Medical staff; manages vaccination records and can impose compliance holds for health/safety concerns"
    exclusive_operations:
      - "POST /vaccination-records — Add vaccination record"

    shared_operations:
      - "POST /compliance-holds — Create compliance hold (shared with ShelterManager)"
      - "GET /animals — List animals (shared with all roles)"
      - "GET /animals/{id} — Get animal (shared with all roles)"
      - "GET /vaccination-records — List records (shared with all roles)"
      - "GET /vaccination-records/{id} — Get record (shared with all roles)"
      - "GET /compliance-holds — List holds (shared with all roles)"
      - "GET /compliance-holds/{id} — Get hold (shared with all roles)"
      - "GET /shelters — List shelters (shared with all roles)"
      - "GET /shelters/{id} — Get shelter (shared with all roles)"
