            - "e_mark, e_code, e_junction, e_car and e_cycle are all ERR_DUPLICATE_RESOURCE with HTTP 409"
            - "reverse_cycle_id is a NEW cycle (201) distinct from ${cycle_id} — the triple is ordered, so swapping payer and payee is a different key"
            - "GET /car-hire/railroads?reporting_mark=BN returns total_count 1"

      - name: non_party_railroad_cannot_read_a_foreign_movement
