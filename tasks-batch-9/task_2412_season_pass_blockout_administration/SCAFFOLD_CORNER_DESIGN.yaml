            - "second trigger: HTTP 422 with data.error_id == 'ERR_DOWN_PAYMENT_TOO_LOW' (2399 < 2400)"
            - "the refused calls did not bump the pass version, so the third call reuses ${pass_a_v} and returns 201"
            - "third trigger: data.installment_count == 4, data.financed_amount_cents == 11100 (12000 - 2400 + 1500 setup fee), data.installment_amount_cents == 2775"
