            - "ProductPlatform.${plat_id}.submitted_by_user_id == \"user-de-1\" and ProductPlatform.${plat_id}.last_revision_notes == \"Coil circuit revision required for the A2L charge limit\""
            - "ProductPlatform.${plat_id}.max_charge_grams == 1650 - the DRAFT re-entry made the design record editable again"
            - "POST /plant/product-platforms/${plat_id}/release as ReliabilityEngineer with X-User-ID user-de-1 returns 409 ERR_SEGREGATION_OF_DUTIES, so the loop did not clear the submitter"
            - "POST /plant/product-platforms/${plat_id}/submit-engineering-review a second time now returns 409 ERR_INVALID_PLATFORM_STATE - the cycle only re-opens through return-to-draft"

  - rule_id: transitive_cascade
    instances:
      - name: sell_through_cascade_frees_warehouse_pallets_in_four_hops
        grounds:
          - state_machines.RefrigerantProgram.ACTIVE_to_SELL_THROUGH
          - state_machines.ProductPlatform.RELEASED_to_RESTRICTED
          - state_machines.BuildOrder.DRAFT_to_HOLD_REGULATORY
          - state_machines.WarehouseReservation.ACTIVE_to_RELEASED
          - calculations.warehouse_pallet_occupancy
          - entities.Warehouse.fields.pallets_reserved_current
          - entities.BuildOrder.fields.hold_reason
        distinguishing_aspect: |
          A single call on the refrigerant program propagates four causal hops into an entity the
          request never names: program SELL_THROUGH causes the platform to become RESTRICTED, which
          causes its open lot to go on HOLD_REGULATORY, which causes that lot's pallet reservation to
          be RELEASED, which causes the warehouse's pallets_reserved_current to fall from 20 to 0.
        test_recipe:
          setup:
            - "An A2L program whose manufacture_cutoff_utc is 2026-10-01T00:00:00Z and sell_through_deadline_utc is 2027-04-01T00:00:00Z."
            - "A RELEASED HIGH-tier platform on that program."
            - "Warehouse WH-1 with pallet_capacity 50."
            - "One pre-season build lot at DRAFT holding an ACTIVE reservation of 20 pallets from 2026-09-01 to 2026-12-01, so pallets_reserved_current is 20."
            - "Logical clock advanced to 2026-10-02T00:00:00Z, one day past the manufacture cutoff."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plant/refrigerant-programs"
              payload: { refrigerant_code: "R-410A", gwp: 2088, flammability_class: "A1", manufacture_cutoff_utc: "2026-10-01T00:00:00Z", sell_through_deadline_utc: "2027-04-01T00:00:00Z" }
              as: PlantAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /plant/warehouses"
              payload: { name: "WH-1", pallet_capacity: 50 }
              as: PlantAdmin
              captures: { wh_id: $.data.id }
            - call: "POST /plant/product-platforms"
              payload: { model_code: "LX-2400-A1", efficiency_tier: "STANDARD", refrigerant_program_id: "${prog_id}", rated_capacity_btuh: 24000, rated_eer: 11.80, rated_seer2: 14.60, compressor_part_number: "CMP-2T-A1", control_board_part_number: "CTL-4X" }
              as: DesignEngineer
              as_user_id: "user-de-1"
              captures: { plat_id: $.data.id }
            - call: "POST /plant/product-platforms/${plat_id}/submit-engineering-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "user-de-1"
            - call: "POST /plant/product-platforms/${plat_id}/release"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "user-re-1"
            - call: "POST /plant/build-orders"
              payload: { platform_id: "${plat_id}", quantity_units: 24, scheduled_start_utc: "2026-09-10T06:00:00Z", is_preseason: true }
              as: ProductionPlanner
              captures: { bo_id: $.data.id }
            - call: "POST /plant/warehouse-reservations"
              payload: { warehouse_id: "${wh_id}", build_order_id: "${bo_id}", start_date: "2026-09-01", end_date: "2026-12-01", pallet_units: 20 }
              as: ProductionPlanner
              captures: { res_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /plant/refrigerant-programs/${prog_id}/enter-sell-through"
              payload: {}
              as: PlantAdmin
          assert:
            - "HTTP 200; RefrigerantProgram.${prog_id}.status == SELL_THROUGH and sell_through_entered_at == \"2026-10-02T00:00:00Z\""
            - "HOP 1: ProductPlatform.${plat_id}.status == RESTRICTED"
            - "HOP 2: BuildOrder.${bo_id}.status == HOLD_REGULATORY and BuildOrder.${bo_id}.hold_reason == REFRIGERANT_SELL_THROUGH"
            - "HOP 3: WarehouseReservation.${res_id}.status == RELEASED, release_reason == BUILD_ON_REGULATORY_HOLD, released_at == \"2026-10-02T00:00:00Z\""
            - "HOP 4: Warehouse.${wh_id}.pallets_reserved_current == 0, and GET /plant/warehouses/${wh_id}/occupancy?on_date=2026-10-02 returns occupancy_units == 0"
            - "GET /plant/build-orders/${bo_id}/warehouse-reservations returns exactly 1 record with status == RELEASED"
            - "POST /plant/build-orders with platform_id ${plat_id} now returns 409 ERR_INVALID_PLATFORM_STATE - a RESTRICTED platform accepts no new lots"

      - name: warranty_capa_cascade_revokes_allocation_kit_in_four_hops
        grounds:
          - state_machines.WarrantyClaim.CREATE_to_OPEN
          - state_machines.SupplierCorrectiveAction.CREATE_to_OPEN
          - state_machines.ComponentSupply.ACTIVE_to_DERATED
          - state_machines.AllocationLine.RESERVED_to_REVOKED
          - state_machines.DistributorOrder.FULLY_ALLOCATED_to_UNALLOCATED
