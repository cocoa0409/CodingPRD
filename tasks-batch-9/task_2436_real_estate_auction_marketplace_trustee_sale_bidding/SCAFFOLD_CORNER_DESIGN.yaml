# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 2436 — Real Estate Auction Marketplace & Trustee Sale Bidding
#
# Breadth probe: walks references/claim-extraction-guide.md row-by-row against
# SCAFFOLD.yaml §1.1–§1.7. Depth corners already asserted by §1.8 appear as
# `excluded_because:` stubs naming the covering difficulty instance.
#
# Shared conventions (identical to §1.8): logical clock default
# 2026-08-01T00:00:00Z; primary county CA-ALAMEDA; secondary CA-CONTRA-COSTA;
# canonical event window 2026-09-15T17:00:00Z..19:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: seller_creation_echoes_inputs_and_seeds_settlement_ledger
        claim_type: creation
        grounds:
          - entities.Seller
          - endpoints[POST /sellers]
          - response_envelope.success
        distinguishing_aspect: "POST /sellers with every required field returns 201 with the four common fields present, version 1, and the computed ledger seeded to 0 — not omitted and not echoed from input."
        test_recipe:
          setup:
            - "Empty database; logical clock at its default 2026-08-01T00:00:00Z (never set in this instance)."
          setup_api_calls: []
          trigger:
            - call: "POST /sellers"
              payload: { org_name: "Meridian Loan Servicing", seller_type: "SERVICER", contact_email: "reo@meridian.example", settlement_account_ref: "ACH-MER-1", default_commission_bps: 650 }
              as: PlatformAdmin
              captures: { seller_id: $.data.id, seller_v: $.data.version }
          assert:
            - "HTTP status is 201"
            - "Response envelope has meta.api_request_id, meta.api_request_timestamp and response_type == object"
            - "Seller.${seller_id}.org_name == Meridian Loan Servicing and seller_type == SERVICER and contact_email == reo@meridian.example and settlement_account_ref == ACH-MER-1"
            - "Seller.${seller_id}.default_commission_bps == 650"
            - "Seller.${seller_id}.settled_net_cents == 0"
            - "${seller_v} == 1 and created_at and updated_at are both present ISO-8601 UTC values"

      - name: asset_listing_get_returns_stored_row
        claim_type: retrieval
        grounds:
          - entities.AssetListing
          - endpoints[GET /asset-listings/{id}]
        distinguishing_aspect: "GET /asset-listings/{id} returns exactly the row POST created, including the system-defaulted listing_status INTAKE and title_clearance_status PENDING that the client never sent."
        test_recipe:
          setup:
            - "One SERVICER seller exists; one asset listing has been created for it and no disclosures have been filed."
          setup_api_calls:
            - call: "POST /sellers"
              payload: { org_name: "Harbor Vale Bank", seller_type: "BANK", contact_email: "reo@harborvale.example", settlement_account_ref: "ACH-HV-2" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "18 Harbor Way", city: "Alameda", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 41000000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_id: $.data.id }
          trigger:
            - call: "GET /asset-listings/${listing_id}"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
          assert:
            - "HTTP status is 200"
            - "AssetListing.${listing_id}.seller_id == ${seller_id} and street_address == 18 Harbor Way and city == Alameda"
            - "AssetListing.${listing_id}.county_code == CA-ALAMEDA and state_code == CA and estimated_value_cents == 41000000"
            - "AssetListing.${listing_id}.listing_status == INTAKE and title_clearance_status == PENDING"
            - "AssetListing.${listing_id}.relist_count == 0 and second_chance_eligible == false and disclosure_ack_at is null"

      - name: asset_listing_list_filters_by_seller_and_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /asset-listings]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three listings under one seller and one under another, the seller_id filter and limit/offset paging must both apply: page one returns 2 rows with total_count 3 and has_more true, page two returns 1 row with has_more false, and the other seller's listing never appears."
        test_recipe:
          setup:
            - "Seller A owns three asset listings; seller B owns one."
          setup_api_calls:
            - call: "POST /sellers"
              payload: { org_name: "Seller A Holdings", seller_type: "BANK", contact_email: "a@sellera.example", settlement_account_ref: "ACH-A" }
              as: PlatformAdmin
              captures: { seller_a: $.data.id }
            - call: "POST /sellers"
              payload: { org_name: "Seller B Holdings", seller_type: "GSE", contact_email: "b@sellerb.example", settlement_account_ref: "ACH-B" }
              as: PlatformAdmin
              captures: { seller_b: $.data.id }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_a}", street_address: "1 First St", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 20000000 }
              as: Seller
              as_user_id: "${seller_a}"
              captures: { a1: $.data.id }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_a}", street_address: "2 Second St", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 21000000 }
              as: Seller
              as_user_id: "${seller_a}"
              captures: { a2: $.data.id }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_a}", street_address: "3 Third St", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 22000000 }
              as: Seller
              as_user_id: "${seller_a}"
              captures: { a3: $.data.id }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_b}", street_address: "4 Fourth St", city: "Richmond", county_code: "CA-CONTRA-COSTA", state_code: "CA", estimated_value_cents: 23000000 }
              as: Seller
              as_user_id: "${seller_b}"
              captures: { b1: $.data.id }
          trigger:
            - call: "GET /asset-listings"
              payload: { seller_id: "${seller_a}", limit: 2, offset: 0 }
              as: PlatformAdmin
            - call: "GET /asset-listings"
              payload: { seller_id: "${seller_a}", limit: 2, offset: 2 }
              as: PlatformAdmin
          assert:
            - "First page: response_type == array, 2 data rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second page: 1 data row, total_count == 3, has_more == false, offset == 2"
            - "Across both pages the returned ids are exactly {${a1}, ${a2}, ${a3}}"
            - "${b1} appears on neither page"
            - "GET /asset-listings with no filters returns total_count == 4"

      - name: bidder_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=8]
          - errors[ERR_BIDDER_NOT_FOUND]
          - endpoints[GET /bidders/{id}]
        distinguishing_aspect: "A well-formed but unassigned UUID on GET /bidders/{id} yields ERR_BIDDER_NOT_FOUND (404) rather than an empty 200 body, and the existence band (priority 8) fires even though the caller is authorised."
        test_recipe:
          setup:
            - "Empty database except one unrelated registered bidder, so the 404 is about the id and not about an empty table."
          setup_api_calls:
            - call: "POST /bidders"
              payload: { legal_name: "Unrelated Bidder LLC", email: "u@unrelated.example", mailing_address: "9 Nowhere Rd, Oakland CA" }
              as: Anonymous
              captures: { real_bidder: $.data.id }
          trigger:
            - call: "GET /bidders/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 404 and ${err_id} == ERR_BIDDER_NOT_FOUND"
            - "response_type == error and data.message is a non-empty string"
            - "GET /bidders/${real_bidder} still returns 200"

      - name: asset_listing_missing_required_city_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=14]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /asset-listings]
        distinguishing_aspect: "city has source input with no default, so omitting it is ERR_INVALID_REQUEST (400) — not a row created with a null city — and the request must fail before any AssetListing is persisted."
        test_recipe:
          setup:
            - "One BANK seller exists and owns no listings yet."
          setup_api_calls:
            - call: "POST /sellers"
              payload: { org_name: "Northshore Bank", seller_type: "BANK", contact_email: "reo@northshore.example", settlement_account_ref: "ACH-NS-3" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
          trigger:
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "40 Shoreline Dr", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 25000000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 400 and ${err_id} == ERR_INVALID_REQUEST"
            - "GET /sellers/${seller_id}/asset-listings returns total_count == 0"

      - name: omitted_commission_and_increment_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Seller.fields.default_commission_bps
          - entities.AuctionLot.fields.min_increment_cents
          - entities.TrusteeSale.fields.statutory_max_postponements
          - entities.SaleContract.fields.closing_window_days
        distinguishing_aspect: "Four independent defaults are asserted from one chain by omitting each optional input: Seller.default_commission_bps 500, TrusteeSale.statutory_max_postponements 3, AuctionLot.min_increment_cents 500000, and the closing window of 21 days materialised as closing_deadline_at exactly 21 days after execution."
        test_recipe:
          setup:
            - "A VACANT, title-CLEAR asset in CA-ALAMEDA whose trustee sale is CONFIRMED for 2026-09-15T18:00:00Z."
            - "A verified bidder funded with 2000000 wins the single lot at its 20000000 opening bid."
            - "Every optional input is omitted: no default_commission_bps, no statutory_max_postponements, no min_increment_cents, no closing_window_days."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: { org_name: "Default Values Bank", seller_type: "BANK", contact_email: "reo@defaults.example", settlement_account_ref: "ACH-DEF-1" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id, commission: $.data.default_commission_bps }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "77 Default Ave", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 26000000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /asset-listings/${listing_id}/disclosures"
              payload: { occupancy_status: "VACANT", title_condition: "CLEAR" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /asset-listings/${listing_id}/title-clearance"
              payload: { clearance_outcome: "CLEARED", verified_title_condition: "CLEAR", title_report_reference: "TR-DEF-1" }
              as: TitleOfficer
            - call: "POST /trustee-sales"
              payload: { asset_listing_id: "${listing_id}", county_code: "CA-ALAMEDA", sale_scheduled_at: "2026-09-15T18:00:00Z" }
              as: Trustee
              captures: { sale_id: $.data.id, max_postponements: $.data.statutory_max_postponements }
            - call: "POST /trustee-sales/${sale_id}/confirm"
              payload: { confirmation_reference: "TS-DEF-1" }
              as: Trustee
            - call: "POST /auction-events"
              payload: { title: "Defaults Event", county_code: "CA-ALAMEDA", starts_at: "2026-09-15T17:00:00Z", ends_at: "2026-09-15T19:00:00Z", trustee_sale_id: "${sale_id}" }
              as: AuctionOps
              captures: { event_id: $.data.id, event_v: $.data.version }
            - call: "POST /auction-events/${event_id}/lots"
              payload: { asset_listing_id: "${listing_id}", lot_number: 1, lot_window_start_at: "2026-09-15T17:00:00Z", lot_window_end_at: "2026-09-15T18:00:00Z", opening_bid_cents: 20000000, reserve_price_cents: 20000000, expected_auction_event_version: "${event_v}" }
              as: AuctionOps
              captures: { lot_id: $.data.id, increment: $.data.min_increment_cents }
            - call: "POST /bidders"
              payload: { legal_name: "Defaults Bidder LLC", email: "bid@defaults.example", mailing_address: "5 Default Ave, Oakland CA" }
              as: Anonymous
              captures: { bidder_id: $.data.id }
            - call: "POST /bidders/${bidder_id}/identity-verification"
              payload: { decision: "VERIFIED", document_reference: "KYC-DEF-1" }
              as: ComplianceOfficer
            - call: "POST /bidders/${bidder_id}/deposits"
              payload: { amount_cents: 2000000, funding_reference: "WIRE-DEF-1" }
              as: Bidder
              as_user_id: "${bidder_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T17:05:00Z" }
              as: PlatformAdmin
            - call: "POST /auction-events/${event_id}/open"
              payload: {}
              as: AuctionOps
            - call: "POST /auction-lots/${lot_id}/bids"
              payload: { bidder_id: "${bidder_id}", amount_cents: 20000000 }
              as: Bidder
              as_user_id: "${bidder_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T18:05:00Z" }
              as: PlatformAdmin
            - call: "POST /auction-lots/${lot_id}/close"
              payload: {}
              as: AuctionOps
              as_user_id: "ops-closer-1"
          trigger:
            - call: "POST /auction-lots/${lot_id}/sale-contract"
              payload: {}
              as: AuctionOps
              as_user_id: "ops-contract-2"
              captures: { contract_id: $.data.id, window_days: $.data.closing_window_days }
          assert:
            - "${commission} == 500"
            - "${max_postponements} == 3"
            - "${increment} == 500000"
            - "${window_days} == 21"
            - "SaleContract.${contract_id}.closing_deadline_at == 2026-10-06T18:05:00Z"
            - "AuctionLot.${lot_id}.required_deposit_cents == 1000000"

      - name: eviction_risk_tier_computed_from_both_disclosure_axes
        claim_type: computed_fields
        grounds:
          - calculations.eviction_risk_tier
          - entities.AssetListing.fields.eviction_risk_tier
          - endpoints[POST /asset-listings/{id}/disclosures]
        distinguishing_aspect: "Three sibling listings differing only in occupancy_status resolve to HIGH / MEDIUM / LOW under the pinned top-down clause order, and the pre-disclosure default HIGH is observable on a fourth listing that never files disclosures — so the field is computed from the disclosure pair, never client-supplied."
        test_recipe:
          setup:
            - "One seller owns four listings; three file disclosures with title_condition CLEAR and occupancy TENANT_OCCUPIED / OWNER_OCCUPIED / VACANT, the fourth files none."
          setup_api_calls:
            - call: "POST /sellers"
              payload: { org_name: "Tier Test Servicing", seller_type: "SERVICER", contact_email: "tier@test.example", settlement_account_ref: "ACH-TIER" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "1 Tier St", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 20000000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { high_id: $.data.id, high_default_tier: $.data.eviction_risk_tier }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "2 Tier St", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 20000000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { med_id: $.data.id }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "3 Tier St", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 20000000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { low_id: $.data.id }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "4 Tier St", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 20000000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { untouched_id: $.data.id }
          trigger:
            - call: "POST /asset-listings/${high_id}/disclosures"
              payload: { occupancy_status: "TENANT_OCCUPIED", title_condition: "CLEAR" }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { high_tier: $.data.eviction_risk_tier }
            - call: "POST /asset-listings/${med_id}/disclosures"
              payload: { occupancy_status: "OWNER_OCCUPIED", title_condition: "CLEAR" }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { med_tier: $.data.eviction_risk_tier }
            - call: "POST /asset-listings/${low_id}/disclosures"
              payload: { occupancy_status: "VACANT", title_condition: "CLEAR" }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { low_tier: $.data.eviction_risk_tier }
          assert:
            - "${high_tier} == HIGH (TENANT_OCCUPIED matches the first clause even with a CLEAR title)"
            - "${med_tier} == MEDIUM (OWNER_OCCUPIED reaches the second clause)"
            - "${low_tier} == LOW (VACANT plus CLEAR falls through to the else clause)"
            - "${high_default_tier} == HIGH and AssetListing.${untouched_id}.eviction_risk_tier == HIGH (pre-disclosure default)"
            - "AssetListing.${high_id}.listing_status == DISCLOSURE_READY and disclosure_ack_at == the logical clock at the disclosure call"
            - "AssetListing.${untouched_id}.listing_status == INTAKE"

      - name: system_fields_are_server_minted_and_version_starts_at_one
        claim_type: system_fields
        grounds:
          - entities.Bidder
          - entities.AssetListing.fields.listing_status
        distinguishing_aspect: "A newly created Bidder carries id / created_at / updated_at / version 1 plus the system-owned lifecycle fields (identity_verification_status UNVERIFIED, registration_status PENDING_REVIEW, screen_risk_score 25) that no request field can set; the first mutation bumps version to 2 and refreshes updated_at."
        test_recipe:
          setup:
            - "Empty database; one bidder is created and then identity-verified."
          setup_api_calls:
            - call: "POST /bidders"
              payload: { legal_name: "System Fields LLC", email: "sys@fields.example", mailing_address: "11 System Rd, Oakland CA" }
              as: Anonymous
              captures: { bidder_id: $.data.id, v1: $.data.version, idv: $.data.identity_verification_status, reg: $.data.registration_status, score: $.data.screen_risk_score }
          trigger:
            - call: "POST /bidders/${bidder_id}/identity-verification"
              payload: { decision: "VERIFIED", document_reference: "KYC-SYS-1" }
              as: ComplianceOfficer
              captures: { v2: $.data.version, verified_at: $.data.identity_verified_at }
          assert:
            - "${v1} == 1 and ${idv} == UNVERIFIED and ${reg} == PENDING_REVIEW"
            - "${score} == 25 (identity penalty only, per bidder_risk_score SCREEN)"
            - "${bidder_id} is a UUID without any type prefix"
            - "${v2} == 2"
            - "Bidder.${bidder_id}.identity_verification_status == VERIFIED and registration_status == REGISTERED"
            - "${verified_at} equals the logical clock at the verification call and updated_at was refreshed"
            - "Bidder.${bidder_id}.deposit_funded_cents == 0 and deposit_available_cents == 0 and deposit_forfeited_cents == 0 and fallout_count == 0"

      - name: invalid_enum_and_inverted_window_are_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=14]
          - entities.Seller.fields.seller_type
          - entities.AuctionEvent.fields.ends_at
          - entities.AssetListing.fields.estimated_value_cents
        distinguishing_aspect: "Three distinct shape violations all collapse to ERR_INVALID_REQUEST (400) at priority 14 — an unknown enum member, an ends_at that is not strictly after starts_at, and a non-positive estimated_value_cents — proving the type band is checked before any business band."
        test_recipe:
          setup:
            - "One seller exists so the FK in the third attempt resolves and cannot mask the shape error."
          setup_api_calls:
            - call: "POST /sellers"
              payload: { org_name: "Shape Check Bank", seller_type: "BANK", contact_email: "shape@check.example", settlement_account_ref: "ACH-SHAPE" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
          trigger:
            - call: "POST /sellers"
              payload: { org_name: "Bad Enum Co", seller_type: "AUCTIONEER", contact_email: "bad@enum.example", settlement_account_ref: "ACH-BAD" }
              as: PlatformAdmin
              captures: { err_enum: $.data.error_id }
            - call: "POST /auction-events"
              payload: { title: "Inverted Window", county_code: "CA-ALAMEDA", starts_at: "2026-09-15T19:00:00Z", ends_at: "2026-09-15T19:00:00Z" }
              as: AuctionOps
              captures: { err_window: $.data.error_id }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "0 Zero Value Rd", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 0 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { err_value: $.data.error_id }
          assert:
            - "${err_enum} == ERR_INVALID_REQUEST with HTTP 400"
            - "${err_window} == ERR_INVALID_REQUEST with HTTP 400 (ends_at must be strictly after starts_at)"
            - "${err_value} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /auction-events returns total_count == 0"
            - "GET /asset-listings returns total_count == 0"

      - name: asset_listing_with_unknown_seller_returns_seller_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=3]
          - errors[ERR_SELLER_NOT_FOUND]
          - entities.AssetListing.fields.seller_id
        distinguishing_aspect: "The FK on AssetListing.seller_id is enforced at create time with ERR_SELLER_NOT_FOUND (404) — the existence band at priority 3 outranks the shape band at 14 only for resolvable payloads, and here a fully well-formed body still fails because the parent does not exist."
        test_recipe:
          setup:
            - "Empty database — no Seller has ever been created."
          setup_api_calls: []
          trigger:
            - call: "POST /asset-listings"
              payload: { seller_id: "99999999-8888-4777-8666-555544443333", street_address: "12 Orphan Ct", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 24000000 }
              as: Seller
              as_user_id: "99999999-8888-4777-8666-555544443333"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 404 and ${err_id} == ERR_SELLER_NOT_FOUND"
            - "GET /asset-listings returns total_count == 0"

      - name: auction_lot_acts_as_event_asset_junction_in_both_directions
        claim_type: many_to_many_junction
        grounds:
          - entities.AuctionLot.fields.auction_event_id
          - entities.AuctionLot.fields.asset_listing_id
          - endpoints[GET /auction-lots]
          - complexity_profile.entity_topology
        distinguishing_aspect: "AuctionLot is the junction of the AuctionEvent x AssetListing graph: one asset appears in two events and one event holds two assets, so filtering by auction_event_id and by asset_listing_id must return different, non-nested slices of the same three lots."
        test_recipe:
          setup:
            - "Two seller assets X and Y in CA-ALAMEDA, both DISCLOSURE_READY."
            - "Event A in CA-ALAMEDA runs 2026-09-15T17:00:00Z..18:00:00Z and holds lot on X (17:00..17:30) and lot on Y (17:30..18:00)."
            - "Event B in CA-CONTRA-COSTA runs 2026-09-15T18:00:00Z..19:00:00Z and holds a second lot on X (18:00..19:00), which is legal because X's lot windows are disjoint."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sellers"
