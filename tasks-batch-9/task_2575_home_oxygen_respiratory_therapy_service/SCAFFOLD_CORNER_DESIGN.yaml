          assert:
            - "${e_stock} == ERR_REPLACED_UNIT_NOT_REPLACEABLE (409): EquipmentUnit.${u_stock} is IN_STOCK, which is neither IN_QUARANTINE nor RETIRED"
            - "${e_far} == ERR_REPLACED_UNIT_NOT_REPLACEABLE (409): EquipmentUnit.${u_far} is RETIRED but belongs to Sarasota, not to the registering branch"
            - "The third call succeeds with HTTP 201: EquipmentUnit.${u_new}.replaces_unit_id == ${u_old}, status == IN_STOCK, version == 1"
            - "GET /home-oxygen/equipment-units?replaces_unit_id=${u_old} returns exactly one element, ${u_new} — the reverse edge of the self-reference is queryable"
