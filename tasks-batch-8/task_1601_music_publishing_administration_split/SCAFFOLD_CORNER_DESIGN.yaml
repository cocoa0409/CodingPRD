      - name: retention_floor_rounding_per_line
        claim_type: correct_result
        grounds:
          - calculations.sub_publisher_retention
          - entities.RoyaltyStatement.fields.retained_cents
        distinguishing_aspect: "Retention uses per-line floor: floor(3333 * 1500/10000) = 499 (not 500); the truncated cent is never allocated."
        test_recipe:
          setup:
            - "REGISTERED work K (W1 10000bp + pub); ACTIVE agreement covering US/PERFORMANCE at 1500bp for [2026-01-01, 2027-01-01)"
            - "Statement (period_end 2026-03-31 inside the window) with one matched line gross 3333"
