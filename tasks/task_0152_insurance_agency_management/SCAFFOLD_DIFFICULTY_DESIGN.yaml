  # =================================================================
  # Rule 7 — cross_entity_state_dependency (>= 2, different entity pairs)
  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: bind_blocked_by_suspended_carrier
        grounds:
          - state_machines.Policy.QUOTED_to_BOUND
          - state_machines.Carrier.ACTIVE_to_SUSPENDED
          - validations[priority=11]
          - errors[ERR_CARRIER_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair Policy->Carrier: a QUOTED policy cannot bind while its
          product's Carrier.status == SUSPENDED -> ERR_CARRIER_NOT_ACTIVE. A
          different pair than Appointment->License below.
        test_recipe:
          setup:
            - "An ACTIVE carrier with a product, ACTIVE producer fully licensed+appointed; a QUOTED policy; then the carrier is SUSPENDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /carriers"
              payload: { name: "Carrier C7", naic_code: "77001", default_new_business_commission_pct: 0.15, default_renewal_commission_pct: 0.10 }
              as: AgencyAdmin
              captures: { car_id: $.data.id, car_v: $.data.version }
