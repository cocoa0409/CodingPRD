          assert:
            - "after decline: DutyRosterSlot.${s1_id}.status == ASSIGNED and swap_with_slot_id == null and member_id == ${da_id} (revert branch: no exchange)"
            - "after accept: DutyRosterSlot.${s1_id}.member_id == ${db_id} and DutyRosterSlot.${s2_id}.member_id == ${da_id} (accept branch: exchange, both back to ASSIGNED)"
            - "after close: DutyRosterSlot.${s1_id}.status == COMPLETED (confirmed by new owner DB, date past)"
            - "DutyRosterSlot.${s2_id}.status == NO_SHOW (never confirmed, past date) and Member.${da_id}.account_balance_cents == 5000 (DUTY_NO_SHOW_FEE on zero-dues tier)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: land_accrual_grounds_airframe_cancels_reservation
        grounds:
          - state_machines.Flight.IN_FLIGHT_to_LANDED
          - state_machines.Aircraft.AIRWORTHY_to_GROUNDED
          - calculations.aircraft_currency_check
        distinguishing_aspect: |
          Depth-3 cascade triggered by flight landing: land accrues airframe
          hours (link 1: Flight -> Aircraft.hours_since_inspection); the
          accrual crossing 100.0 grounds the airframe in-request (link 2:
          hours -> Aircraft.status); the grounding cancels future BOOKED
          reservations (link 3: Aircraft -> Reservation). Verified with a
          glider at 99.5h that lands a 30-minute sortie with a future
          reservation standing.
        test_recipe:
          setup:
            - "glider GC AIRWORTHY at 99.5 hours_since_inspection after one reconciled 5970-minute flight; annual far future"
            - "future BOOKED reservation RF on GC (2026-08-25)"
            - "second reservation RG CHECKED_OUT for the triggering 30-minute sortie; slot capacity 5"
            - "clock 2026-08-19T08:05:00Z"
          setup_api_calls:
            - call: "POST /soaring/tiers"
              payload: { tier_code: "CASC", monthly_dues_cents: 0, tow_fee_discount_pct: 0.0, included_tows_per_month: 99 }
              as: ClubAdmin
              captures: { tier_c1: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Cascade Pilot", tier_id: "${tier_c1}" }
              as: ClubAdmin
              captures: { mc_id: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Future Booker", tier_id: "${tier_c1}" }
              as: ClubAdmin
              captures: { mf_id: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Cascade Tow", tier_id: "${tier_c1}", is_tow_pilot: true }
              as: ClubAdmin
              captures: { tc_id: $.data.id }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N500G", kind: "GLIDER", annual_due_date: "2027-06-01T00:00:00Z" }
              as: ClubAdmin
              captures: { gc_id: $.data.id, gc_ver: $.data.version }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N501T", kind: "TOW_PLANE", annual_due_date: "2027-06-01T00:00:00Z" }
              as: ClubAdmin
              captures: { tx_id: $.data.id }
            - call: "POST /soaring/tow-slots"
              payload: { tow_plane_id: "${tx_id}", tow_pilot_id: "${tc_id}", start_at: "2026-08-10T07:00:00Z", end_at: "2026-08-19T20:00:00Z", capacity: 5 }
              as: ClubAdmin
              captures: { tsc_id: $.data.id, tsc_v: $.data.version }
            # --- first flight: 5970 minutes (99.5h), reconciled ---
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${gc_id}", member_id: "${mc_id}", start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-10T20:00:00Z", expected_aircraft_version: "${gc_ver}" }
              as: Member
              as_user_id: "${mc_id}"
              captures: { rc1: $.data.id }
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:05:00Z" }
              as: ClubAdmin
            - call: "POST /soaring/reservations/${rc1}/checkout"
              payload: {}
              as: Member
              as_user_id: "${mc_id}"
            - call: "POST /soaring/flights"
              payload: { reservation_id: "${rc1}", tow_slot_id: "${tsc_id}", release_altitude_ft: 1500, takeoff_at: "2026-08-10T08:10:00Z", expected_tow_slot_version: "${tsc_v}" }
              as: Member
              as_user_id: "${mc_id}"
              captures: { fc1: $.data.id }
            - call: "POST /soaring/flights/${fc1}/land"
              payload: { landed_at: "2026-08-14T11:40:00Z" }
              as: Member
              as_user_id: "${mc_id}"
            - call: "POST /soaring/flights/${fc1}/reconcile"
              payload: {}
              as: DutyOfficer
              as_user_id: "${tc_id}"
            # --- future BOOKED reservation that the cascade must cancel ---
            - call: "GET /soaring/aircraft/${gc_id}"
              as: ClubAdmin
              captures: { gc_ver2: $.data.version }
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${gc_id}", member_id: "${mf_id}", start_at: "2026-08-25T10:00:00Z", end_at: "2026-08-25T12:00:00Z", expected_aircraft_version: "${gc_ver2}" }
              as: Member
              as_user_id: "${mf_id}"
              captures: { rf_id: $.data.id }
            # --- second reservation for the triggering sortie ---
            - call: "GET /soaring/aircraft/${gc_id}"
              as: ClubAdmin
              captures: { gc_ver3: $.data.version }
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${gc_id}", member_id: "${mc_id}", start_at: "2026-08-19T08:00:00Z", end_at: "2026-08-19T10:00:00Z", expected_aircraft_version: "${gc_ver3}" }
              as: Member
              as_user_id: "${mc_id}"
              captures: { rg_id: $.data.id }
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-19T08:05:00Z" }
              as: ClubAdmin
            - call: "POST /soaring/reservations/${rg_id}/checkout"
              payload: {}
              as: Member
              as_user_id: "${mc_id}"
            - call: "GET /soaring/tow-slots/${tsc_id}"
              as: ClubAdmin
              captures: { tsc_v2: $.data.version }
          trigger:
            - call: "POST /soaring/flights"
              payload: { reservation_id: "${rg_id}", tow_slot_id: "${tsc_id}", release_altitude_ft: 1500, takeoff_at: "2026-08-19T08:10:00Z", expected_tow_slot_version: "${tsc_v2}" }
              as: Member
              as_user_id: "${mc_id}"
              captures: { fc2: $.data.id }
            - call: "POST /soaring/flights/${fc2}/land"
              payload: { landed_at: "2026-08-19T08:40:00Z" }
              as: Member
              as_user_id: "${mc_id}"
          assert:
            - "Aircraft.${gc_id}.hours_since_inspection == 100.0 after land (99.5 + 0.5)"
            - "Aircraft.${gc_id}.status == GROUNDED and grounded_reason == INSPECTION_OVERDUE (link 2 fired in-request)"
            - "Reservation.${rf_id}.status == CANCELLED (link 3: future BOOKED reservation cancelled by the grounding cascade)"
            - "Flight.${fc2}.status == LANDED (the triggering flight itself completes normally)"

      - name: flight_void_cascade_balance_restore_and_slot_cancel
        grounds:
          - state_machines.Flight.IN_FLIGHT_to_VOIDED
          - calculations.tow_slot_load
          - state_machines.TowSlot.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (flight void, not landing):
          void decrements tow_slot.confirmed_count (link 1: Flight -> TowSlot
          counter); the counter reaching 0 with start_at in the future
          auto-cancels the slot (link 2: counter -> TowSlot.status). The
          paired provisional-debit reversal leaves the member ledger
          conserved at its pre-flight value.
        test_recipe:
          setup:
            - "member MV ACTIVE (balance 0), glider GV, tow plane TV, slot SV capacity 2 with start_at 2026-08-16T12:00:00Z (future relative to acting clock)"
            - "reservation RV CHECKED_OUT; one Flight FV IN_FLIGHT consuming the only confirmed count"
