              as: AssetInspector
            - call: "GET /customers/${cust_a1_id}"
              payload: {}
              as: TransmissionEngineer
          assert:
            - "the three refusals all return HTTP 403 with data.error_id == ERR_FORBIDDEN_ROLE"
            - "the AssetInspector scope listing returns 200 with total_count 3"
            - "the TransmissionEngineer customer read returns 200 with notification_tier TIER_B_MEDICAL"
            - "no role is a superset of another — each denial has a matching allow on a neighbouring endpoint"

  # =========================================================================
  # §1.9 SECTION 8 — CROSS-CUTTING COMPLEXITY LAYERS
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: rescope_rejects_a_stale_expected_psps_event_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.psps-event-rescope-stale-version
          - validations[priority=7]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Re-scoping is legitimate product behaviour — it hard-deletes and rewrites the scope set — so the only thing standing between two sequential scope calls is the version token: the creation-time version is refused with 412 and the refreshed one succeeds, still leaving exactly three scope rows rather than six."
        test_recipe:
          setup:
            - "EV-1 already SCOPED over the three F-CHAIN circuits; ev1_v0 is the creation version and ev1_v_scoped the version read back after the first scope."
          setup_api_calls:
            - *k_clock_default
            - *k_alpha
            - *k_bravo
            - *k_charlie
            - *k_ws_a1
            - *k_ws_a2
            - *k_obs_a1a
            - *k_obs_a1b
            - *k_obs_a2a
            - *k_obs_a2b
            - *k_fpi15
            - *k_cust_a1
            - *k_cust_a2
            - *k_cust_a3
            - *k_cust_b1
            - *k_cust_c1
            - *k_ev1
            - *k_scope
            - call: "GET /psps-events/${ev1_id}"
              payload: {}
              as: PSPSDutyOfficer
              captures: { ev1_v_scoped: $.data.version }
          trigger:
            - call: "POST /psps-events/${ev1_id}/scope"
              payload: { expected_psps_event_version: "${ev1_v0}" }
              as: PSPSDutyOfficer
              captures: { err: $.data.error_id }
            - call: "POST /psps-events/${ev1_id}/scope"
              payload: { expected_psps_event_version: "${ev1_v_scoped}" }
              as: PSPSDutyOfficer
          assert:
            - "the stale call returns HTTP 412 with data.error_id == ERR_STALE_VERSION"
            - "after the refusal PSPSEvent.${ev1_id}.version is unchanged and GET /psps-events/${ev1_id}/scopes still reports total_count 3"
            - "the refreshed call returns 200 and the scope set is still exactly 3 rows — the previous rows were replaced, not appended"
            - "PSPSEvent.${ev1_id}.confirmed_scope_count == 3, ignition_risk_avoided_score == 15.48 and net_benefit_ratio == 0.3395 after the rewrite"
            - "the successful rescope incremented the event's version again, so replaying the same token twice would fail"

      - name: record_completion_rejects_a_stale_expected_circuit_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.mitigation-completion-stale-circuit
          - validations[priority=7]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Repeated completions are legal — a project accretes miles — so the guard is purely the circuit's version: replaying the token that was valid for the first 2.0 miles is refused, and only a re-read of the circuit lets the next 1.0 mile land."
        test_recipe:
          setup:
            - "APPROVED project MP-CC for 4.0 covered-conductor miles on ALPHA, with alpha_v_pre read before any completion."
          setup_api_calls:
            - *k_clock_default
            - *k_alpha
            - *k_mp_cc
            - *k_mp_cc_submit
            - *k_mp_cc_approve
            - *k_get_alpha_v
          trigger:
            - call: "POST /mitigation-projects/${mp_cc_id}/record-completion"
              payload: { completed_miles_delta: 2.0, completion_date: "2026-07-01T00:00:00Z", expected_circuit_version: "${alpha_v_pre}" }
              as: AssetInspector
            - call: "POST /mitigation-projects/${mp_cc_id}/record-completion"
              payload: { completed_miles_delta: 1.0, completion_date: "2026-07-10T00:00:00Z", expected_circuit_version: "${alpha_v_pre}" }
              as: AssetInspector
              captures: { err: $.data.error_id }
            - call: "GET /circuits/${alpha_id}"
              payload: {}
              as: AssetInspector
              captures: { alpha_v_fresh: $.data.version }
            - call: "POST /mitigation-projects/${mp_cc_id}/record-completion"
              payload: { completed_miles_delta: 1.0, completion_date: "2026-07-10T00:00:00Z", expected_circuit_version: "${alpha_v_fresh}" }
              as: AssetInspector
          assert:
            - "the first completion returns 200 with completed_miles 2.0 and Circuit.${alpha_id}.covered_conductor_miles 2.0"
            - "the replayed token returns HTTP 412 with data.error_id == ERR_STALE_VERSION"
            - "after the refusal completed_miles is still 2.0 and hardened_fraction is still 0.1714 (2.0 * 0.6 / 7.0)"
            - "the refreshed call returns 200 with completed_miles 3.0 and hardened_fraction 0.2571"
            - "MitigationProject.${mp_cc_id}.status is IN_EXECUTION throughout — the 4.0-mile plan is not yet met"

      - name: version_advances_on_direct_and_cascaded_writes_alike
        claim_type: optimistic_concurrency
        grounds:
          - entities.Circuit.fields.version
          - calculations.circuit_risk_posture
          - state_machines.Circuit
        distinguishing_aspect: "The version token also moves when the circuit is written by somebody else's call: creating a fire-potential index restamps the posture fields and de-energizing flips the state, so a token captured before either of those cascades is already stale even though no circuit endpoint was ever called."
        test_recipe:
          setup:
            - "The F-CHAIN's three circuits, weather data and customers on file, with the version read at each stage."
          setup_api_calls:
            - *k_clock_default
            - *k_alpha
            - *k_bravo
            - *k_charlie
            - *k_ws_a1
            - *k_ws_a2
