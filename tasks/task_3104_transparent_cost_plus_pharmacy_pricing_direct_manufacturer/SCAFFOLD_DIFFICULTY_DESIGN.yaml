  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: price_row_two_independent_dimensions_activation_without_sourcing
        grounds:
          - state_machines.ManufacturerDrugPrice.parallel_dimensions
          - state_machines.ManufacturerDrugPrice.transitions.PROPOSED_to_ACTIVE
          - state_machines.ManufacturerDrugPrice.transitions.UNDER_REVIEW_to_SOURCED
          - entities.ManufacturerDrugPrice.fields.price_status
          - entities.ManufacturerDrugPrice.fields.sourcing_status
        distinguishing_aspect: >
          A single ManufacturerDrugPrice row carries two independently evolving state
          dimensions, so activating a price row leaves its sourcing dimension
          untouched at UNDER_REVIEW and the row contributes nothing to the eligible
          pool — a linear one-dimension reading would wrongly treat activation as
          making the row sourcing-eligible.
        test_recipe:
          setup:
            - "Empty database. Logical clock at 2026-09-01T00:00:00Z."
            - "Manufacturer M1 is ACTIVE and drug D exists."
            - "Price row P1 is created, so price_status is PROPOSED and sourcing_status is UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PharmacyOps
            - call: "POST /manufacturers"
              payload: { manufacturer_name: "Bexley Generics" }
              as: PharmacyOps
              captures: { m1_id: $.data.id }
            - call: "POST /drugs"
              payload: { drug_name: "Metformin HCL", strength: "500MG", dosage_form: "Tablet", is_controlled: false, retail_reference_price_cents: 4200, insured_reference_price_cents: 3600 }
              as: PharmacyOps
              captures: { d_id: $.data.id }
            - call: "POST /manufacturer-drug-prices"
              payload: { drug_id: "${d_id}", manufacturer_id: "${m1_id}", unit_cost_cents: 12, available_units: 500, reliability_tier: "A", packaging: "500-count bottle" }
              as: PharmacyOps
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /manufacturer-drug-prices/${p1_id}/activation"
              payload: {}
              as: PharmacyOps
            - call: "GET /manufacturer-drug-prices/${p1_id}"
              payload: {}
              as: PharmacyOps
          assert:
            - "ManufacturerDrugPrice.${p1_id}.price_status == \"ACTIVE\""
            - "ManufacturerDrugPrice.${p1_id}.sourcing_status == \"UNDER_REVIEW\""
            - "the drug's sourcing_status is still UNSOURCED because the eligible pool requires sourcing_status == SOURCED"
            - "the two dimensions moved independently: activation changed price_status only"

      - name: comparison_cycle_refresh_required_then_fresh_after_substitution
        grounds:
          - state_machines.PriceComparison.transitions.FRESH_to_REFRESH_REQUIRED
          - state_machines.PriceComparison.transitions.REFRESH_REQUIRED_to_FRESH
          - state_machines.PriceComparison.transitions.STALE_to_FRESH
          - endpoints.POST_/prescriptions/{id}/substitution
          - endpoints.POST_/orders/{id}/comparisons/{comparison_id}/refresh
        distinguishing_aspect: >
          A comparison cycles FRESH then REFRESH_REQUIRED then FRESH rather than
          running a one-way pipeline, and the cycle is closed by a substantiation
          refresh that re-derives the digest from the substituted drug's reference
          prices, so the digest after the refresh differs from the digest before it.
        test_recipe:
          setup:
            - "Empty database. Logical clock at 2026-09-01T00:00:00Z."
            - "Drug D1 has retail_reference_price_cents 4200 and insured 3600; drug D2 has retail 2000 and insured 1600."
            - "Prescription RX is ACTIVE on D1 with an ACCEPTED request and one order O at quantity 60 from a 12-cent, 600-unit source."
            - "Substantiation S for O exists, is ENABLED, and valid_until is 2026-12-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PharmacyOps
            - call: "POST /manufacturers"
              payload: { manufacturer_name: "Bexley Generics" }
              as: PharmacyOps
              captures: { m1_id: $.data.id }
            - call: "POST /drugs"
              payload: { drug_name: "Metformin HCL", strength: "500MG", dosage_form: "Tablet", is_controlled: false, retail_reference_price_cents: 4200, insured_reference_price_cents: 3600 }
              as: PharmacyOps
              captures: { d_id: $.data.id }
            - call: "POST /drugs"
              payload: { drug_name: "Metformin ER", strength: "500MG", dosage_form: "Tablet", is_controlled: false, retail_reference_price_cents: 2000, insured_reference_price_cents: 1600 }
              as: PharmacyOps
              captures: { d2_id: $.data.id }
            - call: "POST /manufacturer-drug-prices"
