            - "response.data.error_id == ERR_FORBIDDEN"

  # =========================================================================
  # Section: cross_cutting_complexity_layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_stale_application_version_excluded
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[medical_decision_stale_application]
          - errors[ERR_STALE_APPLICATION_VERSION]
        excluded_because:
          difficulty_instance: business_referential_vs_business_safety_stale_version_with_bad_eod
          rationale: "Stale application version OCC is exercised as the winning error in the §1.8 priority-pair instance."

      - name: cascading_side_effects_already_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Application.transitions.CDR_FROZEN_to_CESSATION
        excluded_because:
          difficulty_instance: cdr_cessation_cascade_application_award_children_supplement
          rationale: "Depth-3 cascade tested in §1.8 transitive_cascade."

      - name: derived_field_reconciliation_pia_after_suspend_reinstate_excluded
        claim_type: derived_field_reconciliation
        grounds:
          - entities.BenefitAward.fields.primary_insurance_amount_cents
        excluded_because:
          difficulty_instance: award_suspend_reinstate_invariant_pia_unchanged
          rationale: "PIA conservation through suspend/reinstate is the §1.8 compensating_invariant instance."

      - name: scheduled_action_cdr_clock_set_pre_due_date
        claim_type: scheduled_actions
        grounds:
          - calculations.cdr_schedule
          - state_machines.Application.transitions.AWARDED_to_CDR_FROZEN
          - errors[ERR_CDR_NOT_DUE]
        excluded_because:
          difficulty_instance: cdr_start_requires_hearing_application_in_awarded_not_alj_pending
          rationale: "CDR_NOT_DUE temporal gating exercised in §1.8 cross_entity_state_dependency."

  # =========================================================================
  # Section: consistency_model
  # =========================================================================
  - section: consistency_model
    instances:

      - name: immediate_consistency_application_status_visible_after_submit
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "After POST /submit returns, GET on the same application reflects the new status atomically."
        test_recipe:
          setup: ["Young claimant, application about to be submitted."]
          setup_api_calls:
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: SSAAdmin
            - call: "POST /ssdi/claimants"
              payload: { ssn_last4: "8001", full_name: "Atomic Sub", date_of_birth: "2002-06-01T00:00:00Z", filing_state: "TX" }
              as: SSAAdmin
              captures: { as_id: "$.data.id" }
            - call: "POST /ssdi/applications"
              payload: { claimant_id: "${as_id}", alleged_onset_date: "2025-01-01T00:00:00Z", protective_filing_date: "2026-01-15T00:00:00Z", claim_type: "SSDI_ONLY" }
              as: SSAAdmin
              captures: { aas_id: "$.data.id" }
            - call: "POST /ssdi/applications/${aas_id}/submit"
              payload: {}
              as: Claimant
              as_user_id: "${as_id}"
          trigger:
            - call: "GET /ssdi/applications/${aas_id}"
              payload: {}
              as: Claimant
              as_user_id: "${as_id}"
          assert:
            - "Application.${aas_id}.status == DENIED_QC"
            - "Application.${aas_id}.insured_status == NOT_INSURED"
