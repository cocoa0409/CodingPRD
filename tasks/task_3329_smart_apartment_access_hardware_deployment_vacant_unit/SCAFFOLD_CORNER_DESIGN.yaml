              payload: { name: "OO-B1", network_design: "FIELD_MESH", wifi_rssi_dbm: -60 }
              as: PlatformAdmin
              captures: { bld_oo: $.data.id }
            - call: "POST /properties/${prop_oo}/units"
              payload: { unit_number: "U-OO1", building_id: "${bld_oo}" }
              as: PropertyManager
              captures: { unit_o1: $.data.id }
            - call: "POST /properties/${prop_oo}/units"
              payload: { unit_number: "U-OO2", building_id: "${bld_oo}" }
              as: PropertyManager
              captures: { unit_o2: $.data.id }
