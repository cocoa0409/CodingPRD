              as: PipelineDirector
              captures: { obj_id: $.data.id }
            - call: "POST /breeding-lines"
              payload: { program_id: "${prog_id}", objective_id: "${obj_id}", designation: "SX-4001", generation_number: 6, seed_inventory_g: 300000 }
              as: BreedingScientist
              captures: { line_id: $.data.id }
            - call: "POST /breeding-lines/${line_id}/stewardship-agreements"
              payload: { approved_markets: ["US_CORNBELT"], regulatory_dossier_ref: "DOS-2852-03", grower_agreement_ref: "GA-2852-03", effective_from: "2026-09-01", effective_to: "2029-09-01" }
              as: RegulatoryOfficer
              as_user_id: "ro-1"
              captures: { agr_id: $.data.id }
            - call: "POST /stewardship-agreements/${agr_id}/submit"
              payload: {}
              as: RegulatoryOfficer
              as_user_id: "ro-1"
            - call: "POST /stewardship-agreements/${agr_id}/review"
              payload: { outcome: "REQUEST_CHANGES", requested_changes: "add the MX_BAJIO refuge annex" }
              as: RegulatoryOfficer
              as_user_id: "ro-2"
            - call: "POST /stewardship-agreements/${agr_id}/submit"
              payload: {}
              as: RegulatoryOfficer
              as_user_id: "ro-1"
            - call: "POST /stewardship-agreements/${agr_id}/review"
              payload: { outcome: "REQUEST_CHANGES", requested_changes: "grower agreement countersignature missing" }
              as: RegulatoryOfficer
              as_user_id: "ro-2"
          trigger:
            - call: "POST /stewardship-agreements/${agr_id}/submit"
              payload: {}
              as: RegulatoryOfficer
              as_user_id: "ro-1"
            - call: "POST /stewardship-agreements/${agr_id}/review"
              payload: { outcome: "APPROVE" }
              as: RegulatoryOfficer
              as_user_id: "ro-2"
          assert:
            - "StewardshipAgreement.${agr_id}.revision_round == 2 (the DRAFT -> SUBMITTED edge did not count; the two CHANGES_REQUESTED -> SUBMITTED edges did)"
            - "StewardshipAgreement.${agr_id}.requested_changes == null (cleared by the last resubmission and never restored by the approval)"
            - "StewardshipAgreement.${agr_id}.status == APPROVED and approved_by_user_id == ro-2"
            - "BreedingLine.${line_id}.stewardship_status == APPROVED only after the final review; it read PENDING after every REQUEST_CHANGES review"
            - "POST /stewardship-agreements/${agr_id}/submit once more -> ERR_AGREEMENT_INVALID_STATE (409): APPROVED is outside the loop"

