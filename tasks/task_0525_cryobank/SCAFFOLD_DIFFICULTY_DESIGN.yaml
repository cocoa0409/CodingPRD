        grounds:
          - calculations.inventory_availability
          - validations[priority=12]
          - entities.DonorInventory.fields.available_vials
        distinguishing_aspect: |
          Different metric (available_vials) reached via a different endpoint (POST /vial-reservations): a
          reservation of exactly available_vials==5 succeeds (5 <= 5), while a 6-vial request on the same lot
          fails ERR_INSUFFICIENT_VIALS (6 > 5).
