            - "Offer.${crate_id}.availability_status == OFFLINE"
            - "ProbabilityDisclosure.${disc_id}.status == DRAFT"
            - "BalanceChange.${bc_id}.stage == DRAFT"
            - "MonitoringRun.${run1_id}.status == OPEN"

      - name: corner_sm_live_event_full_valid_path
        claim_type: Valid Transition
        grounds:
          - state_machines.LiveEvent.PLANNED_to_APPROVED
          - state_machines.LiveEvent.APPROVED_to_RUNNING
          - state_machines.LiveEvent.RUNNING_to_COMPLETED
          - entities.CapacityCluster.fields.reserved_ccu
        distinguishing_aspect: |
          The happy path PLANNED -> APPROVED -> RUNNING -> COMPLETED lands on each declared state
          in turn, and only the COMPLETED step releases the reservation, so reserved_ccu reads
          6000 across APPROVED and RUNNING and 0 afterwards.
        test_recipe:
          setup:
            - "Season S7 LIVE; cluster NA-1 ACTIVE with ccu_capacity 10000."
            - "LiveEvent A window 2026-08-05T00:00:00Z -> 2026-08-05T02:00:00Z, forecast_ccu 6000."
            - "Clock moved to 2026-08-05T00:00:00Z before the start step."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { to_status: "LIVE" }
              as: ContentProducer
            - call: "POST /capacity-clusters"
              payload: { name: "NA-1", region_code: "NA", ccu_capacity: 10000 }
              as: LiveOpsCommander
              captures: { cluster_id: $.data.id }
            - call: "POST /live-events"
              payload: { season_id: "${season_id}", capacity_cluster_id: "${cluster_id}", code: "EVT_A", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-05T02:00:00Z", forecast_ccu: 6000 }
              as: ContentProducer
              captures: { evt_a_id: $.data.id }
          trigger:
            - call: "POST /live-events/${evt_a_id}/approve"
              payload: {}
              as: LiveOpsCommander
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /live-events/${evt_a_id}/start"
              payload: {}
              as: LiveOpsCommander
            - call: "POST /live-events/${evt_a_id}/complete"
              payload: {}
              as: LiveOpsCommander
          assert:
            - "approve response data.status == APPROVED"
            - "approve response data.reserved_ccu_at_approval == 6000"
            - "start response data.status == RUNNING"
            - "complete response data.status == COMPLETED"
            - "LiveEvent.${evt_a_id}.status == COMPLETED"
            - "CapacityCluster.${cluster_id}.reserved_ccu == 0"

      - name: corner_sm_precondition_episode_release_before_due
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Episode.SCHEDULED_to_LIVE
          - validations[priority=23]
          - errors[ERR_EPISODE_NOT_DUE]
        distinguishing_aspect: |
          The SCHEDULED -> LIVE precondition `clock >= planned_release_at` is enforced at the
          instant boundary: releasing one second early yields ERR_EPISODE_NOT_DUE (422) and mints
          no grants, while releasing exactly at planned_release_at succeeds.
        test_recipe:
          setup:
            - "Season S7 LIVE; player p1 (NA) with a SOFT_COIN account."
            - "Episode 1 SCHEDULED for 2026-08-02T00:00:00Z with soft_currency_grant_minor 1200."
            - "Clock at 2026-08-01T23:59:59Z, one second before the planned instant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { to_status: "LIVE" }
              as: ContentProducer
            - call: "POST /players"
              payload: { handle: "tide_p1", region_code: "NA", active_season_id: "${season_id}" }
              as: LiveOpsCommander
              captures: { p1_id: $.data.id }
            - call: "POST /players/${p1_id}/currency-accounts"
              payload: { currency_code: "SOFT_COIN" }
              as: LiveOpsCommander
              captures: { p1_soft_id: $.data.id }
            - call: "POST /episodes"
              payload: { season_id: "${season_id}", sequence_no: 1, title: "E1 Tidefall", planned_release_at: "2026-08-02T00:00:00Z", xp_grant: 600, soft_currency_grant_minor: 1200 }
              as: ContentProducer
              captures: { ep1_id: $.data.id }
            - call: "POST /episodes/${ep1_id}/schedule"
              payload: {}
              as: ContentProducer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:59:59Z" }
              as: LiveOpsCommander
          trigger:
            - call: "POST /episodes/${ep1_id}/release"
              payload: {}
              as: ContentProducer
              captures: { not_due_err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /episodes/${ep1_id}/release"
              payload: {}
              as: ContentProducer
          assert:
            - "${not_due_err} == ERR_EPISODE_NOT_DUE with HTTP 422"
            - "Episode.${ep1_id}.status == SCHEDULED immediately after the rejected release"
            - "CurrencyAccount.${p1_soft_id}.balance_minor == 0 immediately after the rejected release"
            - "Episode.${ep1_id}.status == LIVE after the on-time release"
            - "Episode.${ep1_id}.actual_release_at == 2026-08-02T00:00:00Z"
            - "CurrencyAccount.${p1_soft_id}.balance_minor == 1200"

      - name: corner_sm_invalid_transitions_rejected_per_machine
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Episode
          - state_machines.LiveEvent
          - errors[ERR_EPISODE_INVALID_STATE]
          - errors[ERR_EVENT_INVALID_STATE]
          - validations[priority=8]
        distinguishing_aspect: |
          Triggers absent from a state's transition list are refused with that entity's own
          INVALID_STATE code (409): releasing a DRAFT episode and rolling back a SCHEDULED one
          both give ERR_EPISODE_INVALID_STATE, while starting a PLANNED event gives
          ERR_EVENT_INVALID_STATE.
        test_recipe:
          setup:
            - "Season S7 LIVE; cluster NA-1 ACTIVE."
            - "Episode 1 left in DRAFT; Episode 2 does not exist."
            - "Episode 3 is a second episode that has been scheduled but never released."
            - "LiveEvent A is PLANNED and unapproved."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
