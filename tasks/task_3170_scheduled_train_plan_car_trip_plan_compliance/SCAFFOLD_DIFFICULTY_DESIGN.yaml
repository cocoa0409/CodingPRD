# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3170_scheduled_train_plan_car_trip_plan_compliance
#
# Depth probe. Two instances per Difficulty Rule (§0.5), each grounded in
# SCAFFOLD.yaml §1.1–§1.7. Every numeric assert below was computed by hand
# against the declared formulas/constants (PLAN_SPEED_MPH=25.0,
# HOS_MAX_HOURS=12.0, DEPARTURE_DELAY threshold=30 min, posture bands
# strictly-greater at B and 2B).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: plan_velocity_vs_actual_velocity_same_shipment
        grounds:
          - calculations.plan_velocity
          - calculations.actual_velocity
          - entities.Shipment.fields.car_velocity_mph
        distinguishing_aspect: |
          Same shipment, same committed_route_miles=1100: the forward-looking
          plan variant prices the itinerary at 22.9167 mph (pinned schedule
          only), while the chronological actual variant prices the SAME
          shipment at 32.3529 mph because its realized 34-hour elapsed time
          beat the padded 48-hour plan — two valid algorithms over different
          input sets produce different numbers for identical miles.
        test_recipe:
          setup:
            - "Yards A, C, D exist; plan P1 A->C 500 miles dep 2026-09-01T08:00:00Z ACTIVE; plan P2 C->D 600 miles dep 2026-09-02T08:00:00Z ACTIVE."
            - "Shipment S (customer CU, 4 cars, committed_route_miles 1100, pickup_by 2026-09-01T07:30:00Z, delivery_by 2026-09-05T00:00:00Z) assigned itinerary [P1,P2] at clock 2026-09-01T07:00:00Z."
            - "Conductor pool at A (2 crews), AVAILABLE locomotive L at A; departure of P1 scheduled and finalized at clock 2026-09-01T08:00:00Z."
            - "TRAIN_DEPARTURE event at A (08:00), YARD_ARRIVAL at C (2026-09-02T04:00:00Z, slack 1680 min >= 60 cutoff -> MADE), CLASSIFICATION_COMPLETE at C (06:00), YARD_ARRIVAL at D (2026-09-02T08:00:00Z), PLACED_DELIVERED at D (2026-09-02T18:00:00Z) completing 4 cars."
          setup_api_calls:
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/yards"
              payload: { yard_code: "DV1A", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yA: $.data.id }
            - call: "POST /rail/yards"
              payload: { yard_code: "DV1C", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yC: $.data.id }
            - call: "POST /rail/yards"
              payload: { yard_code: "DV1D", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yD: $.data.id }
            - call: "POST /rail/train-plans"
              payload: { train_symbol: "DV1-P1", origin_yard_id: "${yA}", destination_yard_id: "${yC}", scheduled_departure_utc: "2026-09-01T08:00:00Z", cutoff_minutes: 60, frequency_mask: ["TUE"], route_distance_miles: 500, dwell_benchmark_hours: 10 }
              as: NetworkPlanner
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /rail/train-plans"
              payload: { train_symbol: "DV1-P2", origin_yard_id: "${yC}", destination_yard_id: "${yD}", scheduled_departure_utc: "2026-09-02T08:00:00Z", cutoff_minutes: 60, frequency_mask: ["WED"], route_distance_miles: 600, dwell_benchmark_hours: 10 }
              as: NetworkPlanner
              captures: { p2: $.data.id, p2_v: $.data.version }
            - call: "POST /rail/train-plans/${p1}/activate"
              payload: { expected_train_plan_version: "${p1_v}" }
              as: NetworkPlanner
            - call: "POST /rail/train-plans/${p2}/activate"
              payload: { expected_train_plan_version: "${p2_v}" }
              as: NetworkPlanner
            - call: "POST /rail/customers"
              payload: { customer_code: "DV1-CU", name: "Dual Variant Shipper" }
              as: ServiceManager
              captures: { cu: $.data.id }
            - call: "POST /rail/shipments"
              payload: { customer_id: "${cu}", origin_yard_id: "${yA}", destination_yard_id: "${yD}", car_count: 4, first_mile_pickup_by: "2026-09-01T07:30:00Z", last_mile_delivery_by: "2026-09-05T00:00:00Z", committed_route_miles: 1100 }
              as: ServiceManager
              captures: { s: $.data.id, s_v: $.data.version }
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T07:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/shipments/${s}/trip-legs"
              payload: { expected_shipment_version: "${s_v}", legs: [{ train_plan_id: "${p1}", leg_sequence: 1 }, { train_plan_id: "${p2}", leg_sequence: 2 }] }
              as: NetworkPlanner
            - call: "POST /rail/crew-pools"
              payload: { home_yard_id: "${yA}", craft: "CONDUCTOR", service_date: "2026-09-01", crews_available: 2 }
              as: CrewDispatcher
              captures: { pool: $.data.id }
            - call: "POST /rail/locomotives"
              payload: { unit_number: "DV1-UP8801", current_yard_id: "${yA}", horsepower: 4400 }
              as: PowerPlanner
              captures: { loco: $.data.id }
            - call: "POST /rail/train-departures"
              payload: { train_plan_id: "${p1}", service_date: "2026-09-01", crew_pool_id: "${pool}", locomotive_id: "${loco}", car_count_planned: 4, crew_hours_estimated: 10 }
              as: TerminalSuperintendent
              captures: { dep: $.data.id }
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/train-departures/${dep}/finalize"
              payload: {}
              as: TerminalSuperintendent
            - call: "POST /rail/car-events"
              payload: { shipment_id: "${s}", yard_id: "${yA}", event_type: "TRAIN_DEPARTURE", occurred_at: "2026-09-01T08:00:00Z", car_count: 4 }
              as: TerminalSuperintendent
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T04:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/car-events"
              payload: { shipment_id: "${s}", yard_id: "${yC}", event_type: "YARD_ARRIVAL", occurred_at: "2026-09-02T04:00:00Z", car_count: 4 }
              as: TerminalSuperintendent
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T06:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/car-events"
              payload: { shipment_id: "${s}", yard_id: "${yC}", event_type: "CLASSIFICATION_COMPLETE", occurred_at: "2026-09-02T06:00:00Z", car_count: 4 }
              as: TerminalSuperintendent
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T08:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/car-events"
              payload: { shipment_id: "${s}", yard_id: "${yD}", event_type: "YARD_ARRIVAL", occurred_at: "2026-09-02T08:00:00Z", car_count: 4 }
              as: TerminalSuperintendent
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T18:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/car-events"
              payload: { shipment_id: "${s}", yard_id: "${yD}", event_type: "PLACED_DELIVERED", occurred_at: "2026-09-02T18:00:00Z", car_count: 4 }
              as: TerminalSuperintendent
          trigger:
            - call: "GET /rail/shipments/${s}"
              payload: {}
              as: Any
              captures: { vel: $.data.car_velocity_mph }
          assert:
            - "Shipment.${s}.status == DELIVERED"
            - "Shipment.${s}.car_velocity_mph == 32.3529 (1100 miles / 34.0 observed hours, round_half_up 4dp)"
            - "the plan variant computed at assignment was 22.9167 (1100 / 48.0 planned hours from 2026-09-01T08:00:00Z to 2026-09-03T08:00:00Z) — the two variants disagree by 9.4362 mph on identical inputs"
            - "Shipment.${s}.compliance_status == ON_PLAN (delivered before last_mile_delivery_by, zero missed connections)"

      - name: dwell_aggregation_vs_posture_threshold_two_car_mix
        grounds:
          - calculations.dwell_hours
          - calculations.yard_posture_recompute
          - entities.Yard.fields.posture
        distinguishing_aspect: |
          Yard dwell exists in two valid variants over the SAME yard's event
          history: the per-car chronological dwell (SA: exactly 21.0000 h
          from 2026-09-01T20:00:00Z arrival to 2026-09-02T17:00:00Z
          classification) versus the aggregate net-overage variant that sums
          per-session max(0, age - benchmark) across still-open dwellers —
          30.0 h with both sessions open at 16:00 vs 11.0 h after SA's
          session closes. Same events, two different numbers, on different
          entity domains (CarEvent dwell vs Yard posture).
        test_recipe:
          setup:
            - "Yard DV2C benchmark 10 h; shipment SA (3 cars) arrives 2026-09-01T20:00:00Z, shipment SB (2 cars) arrives 2026-09-01T21:00:00Z; both dwell sessions open."
            - "Yard is read at clock 2026-09-02T16:00:00Z with BOTH sessions open: SA overage max(0,20-10)=10.0, SB overage max(0,19-10)=9.0, aggregate 19.0 -> CONGESTED (10 < 19 <= 20)."
            - "SA then receives CLASSIFICATION_COMPLETE at 2026-09-02T17:00:00Z (per-car dwell = 21.0000 h; session closes); final read at clock 2026-09-02T18:00:00Z: only SB open, age 21 h -> overage 11.0, aggregate 11.0 -> CONGESTED (10 < 11 <= 20)."
            - "SA and SB ride one ACTIVE plan DV2-P1 (A->DV2C, dep 2026-09-01T08:00:00Z, 300 miles, cutoff 60) via one finalized departure and TRAIN_DEPARTURE events at A."
          setup_api_calls:
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/yards"
              payload: { yard_code: "DV2A", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yA: $.data.id }
            - call: "POST /rail/yards"
              payload: { yard_code: "DV2C", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yC: $.data.id }
            - call: "POST /rail/train-plans"
              payload: { train_symbol: "DV2-P1", origin_yard_id: "${yA}", destination_yard_id: "${yC}", scheduled_departure_utc: "2026-09-01T08:00:00Z", cutoff_minutes: 60, frequency_mask: ["TUE"], route_distance_miles: 300, dwell_benchmark_hours: 10 }
              as: NetworkPlanner
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /rail/train-plans/${p1}/activate"
              payload: { expected_train_plan_version: "${p1_v}" }
              as: NetworkPlanner
            - call: "POST /rail/customers"
              payload: { customer_code: "DV2-CU", name: "Dwell Mix Shipper" }
              as: ServiceManager
              captures: { cu: $.data.id }
            - call: "POST /rail/shipments"
              payload: { customer_id: "${cu}", origin_yard_id: "${yA}", destination_yard_id: "${yC}", car_count: 3, first_mile_pickup_by: "2026-09-01T07:30:00Z", last_mile_delivery_by: "2026-09-05T00:00:00Z", committed_route_miles: 300 }
              as: ServiceManager
              captures: { sA: $.data.id, sA_v: $.data.version }
            - call: "POST /rail/shipments"
              payload: { customer_id: "${cu}", origin_yard_id: "${yA}", destination_yard_id: "${yC}", car_count: 2, first_mile_pickup_by: "2026-09-01T07:30:00Z", last_mile_delivery_by: "2026-09-05T00:00:00Z", committed_route_miles: 300 }
              as: ServiceManager
              captures: { sB: $.data.id, sB_v: $.data.version }
            - call: "POST /rail/shipments/${sA}/trip-legs"
              payload: { expected_shipment_version: "${sA_v}", legs: [{ train_plan_id: "${p1}", leg_sequence: 1 }] }
              as: NetworkPlanner
            - call: "POST /rail/shipments/${sB}/trip-legs"
              payload: { expected_shipment_version: "${sB_v}", legs: [{ train_plan_id: "${p1}", leg_sequence: 1 }] }
              as: NetworkPlanner
            - call: "POST /rail/crew-pools"
              payload: { home_yard_id: "${yA}", craft: "CONDUCTOR", service_date: "2026-09-01", crews_available: 2 }
              as: CrewDispatcher
              captures: { pool: $.data.id }
            - call: "POST /rail/locomotives"
              payload: { unit_number: "DV2-UP8802", current_yard_id: "${yA}", horsepower: 4400 }
              as: PowerPlanner
              captures: { loco: $.data.id }
            - call: "POST /rail/train-departures"
              payload: { train_plan_id: "${p1}", service_date: "2026-09-01", crew_pool_id: "${pool}", locomotive_id: "${loco}", car_count_planned: 5, crew_hours_estimated: 8 }
              as: TerminalSuperintendent
              captures: { dep: $.data.id }
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/train-departures/${dep}/finalize"
              payload: {}
              as: TerminalSuperintendent
            - call: "POST /rail/car-events"
              payload: { shipment_id: "${sA}", yard_id: "${yA}", event_type: "TRAIN_DEPARTURE", occurred_at: "2026-09-01T08:00:00Z", car_count: 3 }
              as: TerminalSuperintendent
            - call: "POST /rail/car-events"
              payload: { shipment_id: "${sB}", yard_id: "${yA}", event_type: "TRAIN_DEPARTURE", occurred_at: "2026-09-01T08:00:00Z", car_count: 2 }
              as: TerminalSuperintendent
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T20:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/car-events"
              payload: { shipment_id: "${sA}", yard_id: "${yC}", event_type: "YARD_ARRIVAL", occurred_at: "2026-09-01T20:00:00Z", car_count: 3 }
              as: TerminalSuperintendent
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T21:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/car-events"
              payload: { shipment_id: "${sB}", yard_id: "${yC}", event_type: "YARD_ARRIVAL", occurred_at: "2026-09-01T21:00:00Z", car_count: 2 }
              as: TerminalSuperintendent
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T16:00:00Z" }
              as: NetworkPlanner
            - call: "GET /rail/yards/${yC}"
              payload: {}
              as: Any
              captures: { ov_pre: $.data.current_dwell_overage_hours, po_pre: $.data.posture }
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T17:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/car-events"
              payload: { shipment_id: "${sA}", yard_id: "${yC}", event_type: "CLASSIFICATION_COMPLETE", occurred_at: "2026-09-02T17:00:00Z", car_count: 3 }
              as: TerminalSuperintendent
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T18:00:00Z" }
              as: NetworkPlanner
          trigger:
            - call: "GET /rail/yards/${yC}"
              payload: {}
              as: Any
              captures: { ov: $.data.current_dwell_overage_hours, po: $.data.posture }
          assert:
            - "pre-release read: ov_pre == 19.0 and po_pre == CONGESTED (both sessions open: 10.0 + 9.0)"
            - "per-car dwell_hours for shipment ${sA} at yard ${yC} == 21.0000 (2026-09-01T20:00:00Z arrival to 2026-09-02T17:00:00Z classification)"
            - "final read: Yard.${yC}.current_dwell_overage_hours == 11.0 (only SB's open session: max(0, 21 - 10)) and posture == CONGESTED (10 < 11 <= 20)"
            - "the two variants disagree on the same event history: per-car dwell 21.0000 h vs aggregate overage 11.0 h at the same clock"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: posture_band_three_input_nonlinear
        grounds:
          - calculations.yard_posture_recompute
          - entities.Yard.fields.posture
          - entities.Yard.fields.current_dwell_overage_hours
        distinguishing_aspect: |
          Mode (a) combinatorial: posture is a >=3-input non-linear function —
          per-session max(0, age - benchmark) floors, summed over the open
          session set (state-filtered input), then mapped through two
          strictly-greater thresholds B and 2B; the same aggregate 23.0 maps
          to EMBARGOED while 19.0 maps to CONGESTED and 20.0 exactly stays
          CONGESTED.
        test_recipe:
          setup:
            - "Yard CBC benchmark 10 h; two open dwell sessions: SA arrived 2026-09-01T20:00:00Z (3 cars), SB arrived 2026-09-01T21:00:00Z (2 cars)."
            - "Clock advanced to 2026-09-02T18:00:00Z: SA overage max(0,22-10)=12, SB overage max(0,21-10)=11, aggregate 23.0 > 20 -> EMBARGOED."
            - "SA and SB arrive via the same plan/departure choreography as the dwell fixture (one active plan A->C, one pool, one locomotive, one finalized departure, two TRAIN_DEPARTURE events, two YARD_ARRIVAL events)."
          setup_api_calls:
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/yards"
              payload: { yard_code: "CBA", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yA: $.data.id }
            - call: "POST /rail/yards"
              payload: { yard_code: "CBC", dwell_benchmark_hours: 10, classification_capacity_cars: 100 }
              as: NetworkPlanner
              captures: { yC: $.data.id }
            - call: "POST /rail/train-plans"
              payload: { train_symbol: "CB-P1", origin_yard_id: "${yA}", destination_yard_id: "${yC}", scheduled_departure_utc: "2026-09-01T08:00:00Z", cutoff_minutes: 60, frequency_mask: ["TUE"], route_distance_miles: 300, dwell_benchmark_hours: 10 }
              as: NetworkPlanner
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /rail/train-plans/${p1}/activate"
              payload: { expected_train_plan_version: "${p1_v}" }
              as: NetworkPlanner
            - call: "POST /rail/customers"
              payload: { customer_code: "CB-CU", name: "Combinatorial Shipper" }
              as: ServiceManager
              captures: { cu: $.data.id }
            - call: "POST /rail/shipments"
              payload: { customer_id: "${cu}", origin_yard_id: "${yA}", destination_yard_id: "${yC}", car_count: 3, first_mile_pickup_by: "2026-09-01T07:30:00Z", last_mile_delivery_by: "2026-09-05T00:00:00Z", committed_route_miles: 300 }
              as: ServiceManager
              captures: { sA: $.data.id, sA_v: $.data.version }
            - call: "POST /rail/shipments"
              payload: { customer_id: "${cu}", origin_yard_id: "${yA}", destination_yard_id: "${yC}", car_count: 2, first_mile_pickup_by: "2026-09-01T07:30:00Z", last_mile_delivery_by: "2026-09-05T00:00:00Z", committed_route_miles: 300 }
              as: ServiceManager
              captures: { sB: $.data.id, sB_v: $.data.version }
            - call: "POST /rail/shipments/${sA}/trip-legs"
              payload: { expected_shipment_version: "${sA_v}", legs: [{ train_plan_id: "${p1}", leg_sequence: 1 }] }
              as: NetworkPlanner
            - call: "POST /rail/shipments/${sB}/trip-legs"
              payload: { expected_shipment_version: "${sB_v}", legs: [{ train_plan_id: "${p1}", leg_sequence: 1 }] }
              as: NetworkPlanner
            - call: "POST /rail/crew-pools"
              payload: { home_yard_id: "${yA}", craft: "CONDUCTOR", service_date: "2026-09-01", crews_available: 2 }
              as: CrewDispatcher
              captures: { pool: $.data.id }
            - call: "POST /rail/locomotives"
              payload: { unit_number: "CB-UP8803", current_yard_id: "${yA}", horsepower: 4400 }
              as: PowerPlanner
              captures: { loco: $.data.id }
            - call: "POST /rail/train-departures"
              payload: { train_plan_id: "${p1}", service_date: "2026-09-01", crew_pool_id: "${pool}", locomotive_id: "${loco}", car_count_planned: 5, crew_hours_estimated: 8 }
              as: TerminalSuperintendent
              captures: { dep: $.data.id }
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/train-departures/${dep}/finalize"
              payload: {}
              as: TerminalSuperintendent
            - call: "POST /rail/car-events"
              payload: { shipment_id: "${sA}", yard_id: "${yA}", event_type: "TRAIN_DEPARTURE", occurred_at: "2026-09-01T08:00:00Z", car_count: 3 }
              as: TerminalSuperintendent
            - call: "POST /rail/car-events"
              payload: { shipment_id: "${sB}", yard_id: "${yA}", event_type: "TRAIN_DEPARTURE", occurred_at: "2026-09-01T08:00:00Z", car_count: 2 }
              as: TerminalSuperintendent
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T20:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/car-events"
              payload: { shipment_id: "${sA}", yard_id: "${yC}", event_type: "YARD_ARRIVAL", occurred_at: "2026-09-01T20:00:00Z", car_count: 3 }
              as: TerminalSuperintendent
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T21:00:00Z" }
              as: NetworkPlanner
            - call: "POST /rail/car-events"
              payload: { shipment_id: "${sB}", yard_id: "${yC}", event_type: "YARD_ARRIVAL", occurred_at: "2026-09-01T21:00:00Z", car_count: 2 }
              as: TerminalSuperintendent
            - call: "POST /rail/_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T18:00:00Z" }
              as: NetworkPlanner
          trigger:
            - call: "GET /rail/yards/${yC}"
              payload: {}
              as: Any
              captures: { ov2: $.data.current_dwell_overage_hours, po2: $.data.posture }
          assert:
            - "Yard.${yC}.current_dwell_overage_hours == 23.0 (12.0 from ${sA} + 11.0 from ${sB}, each session floored at 0 before summation)"
            - "Yard.${yC}.posture == EMBARGOED because 23.0 > 2 * dwell_benchmark_hours (20)"
            - "the aggregate is order-independent but session-filtered: a session closed by CLASSIFICATION_COMPLETE contributes 0, and a session younger than the 10 h benchmark contributes exactly 0 (max floor), not a negative value"

      - name: hos_tiered_gate_with_pool_state_branch
        grounds:
          - calculations.crew_hos_check
          - state_machines.TrainDeparture.SCHEDULED_to_DEPARTED
        distinguishing_aspect: |
          Mode (c) evaluation-order pinning: finalize must evaluate (1) pool
          state branch OPEN/REOPENED-with-balance vs EXHAUSTED/CLOSED, then
          (2) the HOS numeric gate crew_hours_estimated > 12.0 — a request
          failing BOTH returns ERR_NO_CREW_AVAILABLE (pool-state branch
          first), while the same 12.5-hour estimate against a healthy pool
          returns ERR_HOS_EXCEEDED; the boundary 12.0 exactly passes.
