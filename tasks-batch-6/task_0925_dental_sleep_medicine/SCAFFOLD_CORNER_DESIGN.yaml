              as: SleepPhysician
              as_user_id: "${phys_id}"
              captures: { psg_unattended_id: $.data.id }
            - call: "POST /sleep-studies"
              payload: { patient_id: "${pat_id}", ordering_physician_id: "${phys_id}", modality: "PSG", study_purpose: "DIAGNOSTIC" }
              as: SleepPhysician
              as_user_id: "${phys_id}"
              captures: { psg_noisy_id: $.data.id }
          trigger:
            - call: "POST /sleep-studies/${psg_unattended_id}/results"
              payload: { performed_on: "2026-04-10", respiratory_events: 120, recording_minutes: 480, sleep_minutes: 240, artifact_pct: 0, attended: false }
              as: SleepPhysician
