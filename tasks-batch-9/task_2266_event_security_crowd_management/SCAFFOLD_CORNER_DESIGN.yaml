  - name: sla_clock_keyed_on_severity_at_report_not_escalated_severity
    claim_type: input_set_filtering
    grounds:
    - calculations.incident_response_metrics.input_set
    - entities.Incident.fields.severity_at_report
    - state_machines.Incident.TRIAGED_to_TRIAGED
    - calculations.event_gate_posture
    distinguishing_aspect: |
      The declared input set names severity_at_report and explicitly rejects the current severity, which only becomes observable when the two DISAGREE and the disagreement would flip the verdict: a MINOR incident triaged at 12.00 minutes is inside the 15-minute budget, and escalating it to CRITICAL afterwards (budget 3) must NOT retroactively create a breach — even though the same escalation does move the event's gate posture.
