        grounds: [calculations.t2_amortization_haircut]
        distinguishing_aspect: "SUBORDINATED_DEBT instrument with maturity exactly 4 years away gets 20% haircut; exactly 5 years gets 0%. Boundary precision."
        test_recipe:
          setup: ["Bank; two T2 instruments with maturities at 4-year and 5-year boundaries relative to period_end_date 2026-06-30"]
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "HaircutBank", charter_id: "CH-HRC-001" }
              as: SystemOperator
              captures: { b: $.data.id }
            - call: "POST /banks/${b}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
