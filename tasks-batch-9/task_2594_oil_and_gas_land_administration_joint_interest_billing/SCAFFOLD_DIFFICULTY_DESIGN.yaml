              payload: { effective_date: "2026-04-01" }
              as: LandAdministrator
            - call: "POST /land-admin/wells/${well_id}/status-changes"
              payload: { to_status: "DRILLING", effective_date: "2026-02-10" }
              as: LandAdministrator
            - call: "POST /land-admin/wells/${well_id}/status-changes"
              payload: { to_status: "PRODUCING", effective_date: "2026-04-01" }
              as: LandAdministrator
            - call: "POST /land-admin/wells/${well_id}/status-changes"
              payload: { to_status: "SHUT_IN", effective_date: "2026-08-01" }
              as: LandAdministrator
          trigger:
            - call: "POST /land-admin/leases/${lease1_id}/obligation-events"
              payload: { event_type: "SHUT_IN_PAYMENT", event_date: "2026-08-05", shut_in_start_date: "2026-08-01" }
              as: LandAdministrator
            - call: "POST /_clock/set_current_utc"
