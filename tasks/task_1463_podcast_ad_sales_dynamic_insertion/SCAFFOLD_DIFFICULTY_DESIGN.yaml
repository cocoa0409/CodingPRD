              captures: { cp3: $.data.id }
            - call: "POST /adnet/ad-copies/${cp1}/submit"
              as: Advertiser
              as_user_id: "${a1}"
            - call: "POST /adnet/ad-copies/${cp2}/submit"
              as: Advertiser
              as_user_id: "${a2}"
            - call: "POST /adnet/ad-copies/${cp3}/submit"
              as: Advertiser
              as_user_id: "${a3}"
            - call: "POST /adnet/ad-copies/${cp1}/review"
              payload: { action: "APPROVE" }
              as: AdOps
            - call: "POST /adnet/ad-copies/${cp2}/review"
              payload: { action: "APPROVE" }
              as: AdOps
            - call: "POST /adnet/ad-copies/${cp3}/review"
              payload: { action: "APPROVE" }
              as: AdOps
            - call: "POST /adnet/campaigns/${c1}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/campaigns/${c2}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/campaigns/${c3}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/line-items"
              payload: { campaign_id: "${c1}", episode_id: "${ep}", ad_format: "PRODUCED_SPOT", position: "MID_ROLL", reserved_impressions: 10, priority: 10, ad_copy_id: "${cp1}" }
              as: AdOps
              captures: { li1: $.data.id }
            - call: "POST /adnet/line-items"
