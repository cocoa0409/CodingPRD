            - "StateProgram.${prog_ca_id}.delinquent_registrant_count == 1 and enforcement_posture == ELEVATED"

      - name: unauthorized_role_on_unknown_site_returns_403_not_404
        claim_type: Priority Ordering
        grounds:
          - validations[priority=20]
          - validations[priority=30]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_COLLECTION_SITE_NOT_FOUND]
        distinguishing_aspect: "A Registrant calling enroll on a nonexistent site id gets 403 ERR_UNAUTHORIZED, proving the priority-20 role gate runs before the priority-30 existence lookup and does not leak resource existence."
        test_recipe:
          setup:
            - "CA program, one registrant, and one genuinely APPLIED site (so the role denial cannot be confused with an empty collection)."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", program_name: "California Mattress Recycling Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_ca_id: $.data.id }
            - call: "POST /collection-sites"
              payload: { state_program_id: "${prog_ca_id}", operator_name: "Bay Area Collection Site", site_type: "COLLECTION_SITE", region_code: "WEST" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { site_id: $.data.id }
            - call: "POST /registrants"
              payload: { legal_name: "Pacific Bedding Retail LLC", registrant_type: "RETAILER", home_state_code: "CA" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /collection-sites/00000000-0000-4000-8000-0000000009f1/enroll"
              payload: {}
              as: Registrant
              as_user_id: "${reg_id}"
            - call: "POST /collection-sites/00000000-0000-4000-8000-0000000009f1/enroll"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
          assert:
            - "Registrant call: HTTP 403 with data.error_id == ERR_UNAUTHORIZED (not 404)"
            - "ProgramAdministrator call on the same unknown id: HTTP 404 with data.error_id == ERR_COLLECTION_SITE_NOT_FOUND"
            - "CollectionSite.${site_id}.enrollment_status == APPLIED (untouched)"

      - name: state_error_precedes_amount_check_corner
        claim_type: Priority Ordering
        excluded_because:
          difficulty_instance: pay_on_draft_remittance_state_error_precedes_payment_amount_mismatch
          rationale: "The priority-46 state gate winning over the priority-92 amount gate on a single request is exactly that depth instance's assertion."

      - name: safety_precedes_referential_corner
        claim_type: Priority Ordering
        excluded_because:
          difficulty_instance: site_quarantine_safety_precedes_recycler_program_mismatch_referential
          rationale: "The quarantine-before-program-mismatch ordering, and the clock advance that reveals the second error, are covered there."

  # ===========================================================================
  - section: endpoints
    instances:

      - name: cost_forecast_patch_updates_only_supplied_fields
        claim_type: Standard CRUD
        grounds:
          - endpoints[PATCH /state-programs/{id}/cost-forecast]
          - calculations.fee_rate_recommendation
          - calculations.reserve_coverage_months
        distinguishing_aspect: "A PATCH carrying only forecast_annual_cost_cents leaves forecast_annual_units, forecast_other_revenue_cents and reserve_target_months at their stored values while still recomputing the recommendation and coverage, so unsupplied optional fields are not reset to defaults."
        test_recipe:
          setup:
            - "One CA program (cost 60000000, units 60000, other revenue 3000000, reserve target 3 months, opening 5000000)."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", program_name: "California Mattress Recycling Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_ca_id: $.data.id }
          trigger:
            - call: "PATCH /state-programs/${prog_ca_id}/cost-forecast"
              payload: { forecast_annual_cost_cents: 72000000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "GET /state-programs/${prog_ca_id}/fee-adequacy"
              as: ProgramAdministrator
              as_user_id: "admin-1"
          assert:
            - "PATCH response: HTTP 200 with data.forecast_annual_cost_cents == 72000000, data.forecast_annual_units == 60000, data.forecast_other_revenue_cents == 3000000, data.reserve_target_months == 3"
            - "data.reserve_balance_cents == 5000000 (untouched by a forecast revision) and data.version == 2"
            - "data.reserve_coverage_months == 0.83 (5000000 / 6000000) and data.recommended_rate_cents == 1309"
            - "fee-adequacy response: reserve_target_cents == 18000000, reserve_gap_cents == 13000000, base_rate_cents == 1259, admin_surcharge_pct == 0.04, band_low_cents == 1047, band_high_cents == 1571"

      - name: pickup_order_omitting_hauler_id_sets_the_auto_selected_flag
        claim_type: Conditional action
        grounds:
          - endpoints[POST /pickup-orders]
          - entities.PickupOrder.fields.hauler_auto_selected
          - calculations.hauler_selection
        distinguishing_aspect: "The same endpoint resolves the same hauler either way but records hauler_auto_selected == false when hauler_id is supplied and true when it is omitted, so the flag reflects the request shape rather than the resolved hauler."
        setup_note: "CHAIN-SH (WA program, ENROLLED NORTH site with 510 accepted units, one NORTH hauler, one CERTIFIED recycler)."
        test_recipe:
          setup:
            - "CHAIN-SH; the single eligible hauler serves NORTH with max_concurrent_routes 2."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "WA", program_name: "Washington Mattress Stewardship Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_wa_id: $.data.id }
            - call: "POST /collection-sites"
              payload: { state_program_id: "${prog_wa_id}", operator_name: "Puget Transfer Station", site_type: "TRANSFER_STATION", region_code: "NORTH" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { site_id: $.data.id }
            - call: "POST /collection-sites/${site_id}/enroll"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /haulers"
              payload: { state_program_id: "${prog_wa_id}", company_name: "Sound Hauling Co", service_regions: ["NORTH"], per_unit_rate_cents: 450, per_km_rate_cents: 180, max_route_payment_cents: 200000, max_concurrent_routes: 2 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { hauler_id: $.data.id }
            - call: "POST /recyclers"
              payload: { state_program_id: "${prog_wa_id}", facility_name: "Cascade Fiber Recovery", accepted_unit_classes: ["MATTRESS", "FOUNDATION"] }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { recycler_id: $.data.id }
            - call: "POST /recyclers/${recycler_id}/certify"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /collection-sites/${site_id}/volume-reports"
              payload: { period_month: "2026-08", units_mattress: 320, units_foundation: 190 }
              as: CollectionSiteOperator
              as_user_id: "${site_id}"
              captures: { vr_id: $.data.id }
            - call: "POST /volume-reports/${vr_id}/accept"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /pickup-orders"
              payload: { collection_site_id: "${site_id}", recycler_id: "${recycler_id}", hauler_id: "${hauler_id}", units_manifested: 100, route_distance_km: 40.0, pickup_window_start: "2026-08-05T09:00:00Z", pickup_window_end: "2026-08-05T11:00:00Z" }
              as: CollectionSiteOperator
              as_user_id: "${site_id}"
              captures: { po_explicit_id: $.data.id }
            - call: "POST /pickup-orders"
              payload: { collection_site_id: "${site_id}", recycler_id: "${recycler_id}", units_manifested: 100, route_distance_km: 40.0, pickup_window_start: "2026-08-06T09:00:00Z", pickup_window_end: "2026-08-06T11:00:00Z" }
              as: CollectionSiteOperator
              as_user_id: "${site_id}"
              captures: { po_auto_id: $.data.id }
          assert:
            - "Explicit order: HTTP 201 with data.hauler_id == ${hauler_id} and data.hauler_auto_selected == false"
            - "Omitted order: HTTP 201 with data.hauler_id == ${hauler_id} and data.hauler_auto_selected == true"
            - "Both orders report data.estimated_payment_cents == 54700 (100 * 450 + round_half_up(40.0 * 180) + 2500)"
            - "CollectionSite.${site_id}.units_on_hand == 310 and units_in_transit == 200"

      - name: volume_report_sub_resource_list_is_scoped_to_its_own_site
        claim_type: Cross-reference link
        grounds:
          - endpoints[GET /collection-sites/{id}/volume-reports]
          - entities.VolumeReport.parent
        distinguishing_aspect: "Each site's sub-resource list returns only its own reports (2 for site A, 1 for site B) even though the rows share a period_month, so the nested path filters by collection_site_id rather than listing the whole collection."
        test_recipe:
          setup:
            - "WA program with two ENROLLED sites; site A has 2026-06 and 2026-07 reports, site B has a 2026-06 report."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "WA", program_name: "Washington Mattress Stewardship Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_wa_id: $.data.id }
            - call: "POST /collection-sites"
              payload: { state_program_id: "${prog_wa_id}", operator_name: "Puget Transfer Station", site_type: "TRANSFER_STATION", region_code: "NORTH" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { site_a_id: $.data.id }
            - call: "POST /collection-sites/${site_a_id}/enroll"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /collection-sites"
              payload: { state_program_id: "${prog_wa_id}", operator_name: "Olympic Dropoff", site_type: "PERMANENT_DROPOFF", region_code: "NORTH" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { site_b_id: $.data.id }
            - call: "POST /collection-sites/${site_b_id}/enroll"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /collection-sites/${site_a_id}/volume-reports"
              payload: { period_month: "2026-06", units_mattress: 100, units_foundation: 50 }
              as: CollectionSiteOperator
              as_user_id: "${site_a_id}"
              captures: { vr_a1_id: $.data.id }
            - call: "POST /collection-sites/${site_a_id}/volume-reports"
              payload: { period_month: "2026-07", units_mattress: 200, units_foundation: 0 }
              as: CollectionSiteOperator
              as_user_id: "${site_a_id}"
              captures: { vr_a2_id: $.data.id }
            - call: "POST /collection-sites/${site_b_id}/volume-reports"
              payload: { period_month: "2026-06", units_mattress: 7, units_foundation: 3 }
              as: CollectionSiteOperator
              as_user_id: "${site_b_id}"
              captures: { vr_b1_id: $.data.id }
          trigger:
            - call: "GET /collection-sites/${site_a_id}/volume-reports"
              as: CollectionSiteOperator
              as_user_id: "${site_a_id}"
            - call: "GET /collection-sites/${site_b_id}/volume-reports"
              as: ProgramAdministrator
              as_user_id: "admin-1"
          assert:
            - "Site A list: HTTP 200 with data.meta.total_count == 2 and every row's collection_site_id == ${site_a_id}"
            - "Site A list contains ${vr_a1_id} and ${vr_a2_id} but not ${vr_b1_id}"
            - "Site B list: HTTP 200 with data.meta.total_count == 1 and the single row id == ${vr_b1_id}"
            - "Every returned row has credit_cents == 0 and report_status == SUBMITTED"

      - name: commodity_verification_rolls_up_into_recycler_verified_weight
        claim_type: Cross-reference link
        grounds:
          - endpoints[POST /commodity-output-records/{id}/verify]
          - entities.Recycler.fields.verified_output_weight_kg
          - calculations.recycler_diversion_rate
        distinguishing_aspect: "Verifying one of two SUBMITTED records lifts Recycler.verified_output_weight_kg to exactly that record's weight (1200.5, not the 2000.75 submitted total), and the diversion rate stays 0.00 because the zero-basis guard applies before any division."
        test_recipe:
          setup:
            - "WA program with one CERTIFIED recycler that has processed no units yet and two SUBMITTED output records (STEEL 1200.5 kg, FOAM 800.25 kg)."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "WA", program_name: "Washington Mattress Stewardship Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_wa_id: $.data.id }
            - call: "POST /recyclers"
              payload: { state_program_id: "${prog_wa_id}", facility_name: "Cascade Fiber Recovery", accepted_unit_classes: ["MATTRESS", "FOUNDATION"] }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { recycler_id: $.data.id }
            - call: "POST /recyclers/${recycler_id}/certify"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /recyclers/${recycler_id}/commodity-output-records"
              payload: { commodity: "STEEL", output_weight_kg: 1200.5, source_period_month: "2026-07" }
              as: Recycler
              as_user_id: "${recycler_id}"
              captures: { rec_steel_id: $.data.id }
            - call: "POST /recyclers/${recycler_id}/commodity-output-records"
              payload: { commodity: "FOAM", output_weight_kg: 800.25, source_period_month: "2026-07" }
              as: Recycler
              as_user_id: "${recycler_id}"
              captures: { rec_foam_id: $.data.id }
          trigger:
            - call: "POST /commodity-output-records/${rec_steel_id}/verify"
              payload: {}
              as: ProgramAuditor
              as_user_id: "auditor-1"
            - call: "GET /recyclers/${recycler_id}"
              as: ProgramAuditor
              as_user_id: "auditor-1"
            - call: "POST /commodity-output-records/${rec_foam_id}/verify"
              payload: {}
              as: ProgramAuditor
              as_user_id: "auditor-1"
            - call: "GET /recyclers/${recycler_id}/commodity-output-records?record_status=VERIFIED"
              as: ProgramAuditor
              as_user_id: "auditor-1"
          assert:
            - "First verify: HTTP 200 with data.record_status == VERIFIED and data.verified_by_user_id == auditor-1"
            - "Recycler read after the first verify: verified_output_weight_kg == 1200.5, units_processed_count == 0, diversion_rate_pct == 0.00"
            - "After the second verify: Recycler.${recycler_id}.verified_output_weight_kg == 2000.75 and diversion_rate_pct == 0.00"
            - "VERIFIED-filtered list: data.meta.total_count == 2"

      - name: clock_endpoint_moves_now_for_subsequent_writes_only
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - logical_clock.default_current_utc
        distinguishing_aspect: "Rows written before the clock move keep their 2026-08-01T00:00:00Z stamps while rows written afterwards carry 2026-09-15T12:00:00Z, so the endpoint retimes future reads of current_utc without rewriting history."
        test_recipe:
          setup:
            - "A CA program created on the startup clock (2026-08-01T00:00:00Z)."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", program_name: "California Mattress Recycling Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_ca_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /registrants"
              payload: { legal_name: "Pacific Bedding Retail LLC", registrant_type: "RETAILER", home_state_code: "CA" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { reg_id: $.data.id }
            - call: "GET /state-programs/${prog_ca_id}"
              as: ProgramAdministrator
              as_user_id: "admin-1"
          assert:
            - "Clock response: HTTP 200 with data.current_utc == 2026-09-15T12:00:00Z"
            - "Registrant.${reg_id}.created_at == 2026-09-15T12:00:00Z"
            - "GET program: data.created_at == 2026-08-01T00:00:00Z and data.version == 1 (the clock move is not a write to the program)"

      - name: fee_adequacy_read_exposes_gap_arithmetic_without_mutating
        claim_type: Computed read
        grounds:
          - endpoints[GET /state-programs/{id}/fee-adequacy]
          - calculations.fee_rate_recommendation
          - calculations.reserve_coverage_months
        distinguishing_aspect: "The computed read returns the intermediate reserve_target_cents and reserve_gap_cents that StateProgram does not store, is byte-identical across two calls, and leaves version at 1."
        test_recipe:
          setup:
            - "One CA program; nothing else has happened."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", program_name: "California Mattress Recycling Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_ca_id: $.data.id }
          trigger:
            - call: "GET /state-programs/${prog_ca_id}/fee-adequacy"
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "GET /state-programs/${prog_ca_id}/fee-adequacy"
              as: ProgramAuditor
              as_user_id: "auditor-1"
            - call: "GET /state-programs/${prog_ca_id}"
              as: ProgramAdministrator
              as_user_id: "admin-1"
          assert:
            - "Both reads: HTTP 200 with reserve_target_cents == 15000000, reserve_gap_cents == 10000000, reserve_balance_cents == 5000000"
            - "Both reads: base_rate_cents == 1034, admin_surcharge_pct == 0.04, recommended_rate_cents == 1075, band_low_cents == 860, band_high_cents == 1290, reserve_coverage_months == 1.00"
            - "The two response data objects are field-for-field equal (the read is side-effect free for either role)"
            - "GET program afterwards: data.version == 1 and data.recommended_rate_cents == 1075 (matches the computed read)"

      - name: settlement_finalization_action_corner
        claim_type: Action endpoint
        excluded_because:
          difficulty_instance: hauler_route_estimate_vs_final_settlement_divergence
          rationale: "finalize-settlement's response shape, FINALIZED status and final_payment_cents are asserted in full by that depth instance."

