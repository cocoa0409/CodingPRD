  - rule_id: boundary_precision_check
    instances:
      - name: composite_40_00_blocks_discontinuation_39_99_permits_it
        grounds:
          - calculations.program_viability_composite
          - validations[priority=27]
          - entities.AcademicProgram.fields.viability_band
        distinguishing_aspect: |
          IMPROVEMENT_BAND_MIN is an inclusive lower bound applied to the score
          AFTER the single round to two decimal places. A program whose weighted
          sum is exactly 40.00 is IMPROVEMENT_ELIGIBLE and DISCONTINUATION is
          refused; one further snapshot that raises the rolling cost per credit
          hour from 50000 to 50042 cents drops the weighted sum to 39.98992846,
          which rounds to 39.99, lands in NONVIABLE and makes the identical
          proposal succeed. An implementation using a strict `>` on the band, or
          rounding the four factor scores before weighting, gets one of the two
          halves wrong.
        test_recipe:
          setup:
            - "Program CHEM-BS, UNDERGRADUATE, with three flat snapshots: headcount 125, 400 credit hours, 20000000 cents, 7 completions, market_demand_index 35 each."
            - "Those inputs give enrollment_score 50 (flat headcount), completion_score 14, demand_score 35 and, at a rolling cost per credit hour of exactly 50000, efficiency_score exactly 60 — a weighted sum of exactly 40.00 under the UNDERGRADUATE vector."
            - "The cycle is carried to RESPONSE_SUBMITTED so a decision can be proposed, and the clock is parked at 2026-09-15T10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "CHEM-BS", name: "Chemistry BS", degree_level: "UNDERGRADUATE", department_code: "CHEM" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2025FA", term_index: 1, enrollment_headcount: 125, credit_hours: 400, direct_cost_cents: 20000000, completions_count: 7, market_demand_index: 35 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2026SP", term_index: 2, enrollment_headcount: 125, credit_hours: 400, direct_cost_cents: 20000000, completions_count: 7, market_demand_index: 35 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2026FA", term_index: 3, enrollment_headcount: 125, credit_hours: 400, direct_cost_cents: 20000000, completions_count: 7, market_demand_index: 35 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/review-cycles"
              payload: { cycle_year: 2026, self_study_due_at: "2026-09-01T00:00:00Z", required_section_codes: ["S1"] }
              as: ReviewCoordinator
              captures: { cycle_id: $.data.id }
            - call: "POST /provost/review-cycles/${cycle_id}/self-studies"
              payload: { narrative: "Self-study narrative", section_codes: ["S1"] }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { ss_id: $.data.id }
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "SUBMIT" }
              as: ProgramChair
              as_user_id: "${prog_id}"
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "ACCEPT" }
              as: ReviewCoordinator
            - call: "POST /provost/external-reviewers"
              payload: { full_name: "Dr Bruno Sato", institution: "Lakeside Institute", specialty_code: "CHEM" }
              as: ReviewCoordinator
              captures: { rev_id: $.data.id }
            - call: "POST /provost/reviewer-visits"
              payload: { cycle_id: "${cycle_id}", reviewer_id: "${rev_id}", window_start_at: "2026-08-20T09:00:00Z", window_end_at: "2026-08-22T17:00:00Z" }
              as: ReviewCoordinator
              captures: { visit_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-23T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/reviewer-visits/${visit_id}/complete"
              payload: {}
              as: ReviewCoordinator
            - call: "POST /provost/reviewer-visits/${visit_id}/reports"
              payload: { recommendation: "IMPROVE", finding_codes: ["F-COST"], narrative: "Costs are drifting above the benchmark." }
              as: ExternalReviewer
              as_user_id: "${rev_id}"
            - call: "POST /provost/review-cycles/${cycle_id}/program-response"
              payload: { response_concurrence: "PARTIAL_CONCUR", response_text: "The department partially concurs." }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { cyc_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T10:00:00Z" }
              as: Provost
          trigger:
            - call: "POST /provost/review-cycles/${cycle_id}/decision-records"
              payload: { outcome: "DISCONTINUATION", rationale: "First attempt, taken at a composite of exactly 40.00.", effective_term_index: 4, expected_cycle_version: "${cyc_v}" }
              as: Provost
              as_user_id: "provost-proposer"
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2027SP", term_index: 4, enrollment_headcount: 125, credit_hours: 400, direct_cost_cents: 20050400, completions_count: 7, market_demand_index: 35 }
              as: ReviewCoordinator
            - call: "POST /provost/review-cycles/${cycle_id}/decision-records"
              payload: { outcome: "DISCONTINUATION", rationale: "Second attempt, taken at a composite of 39.99.", effective_term_index: 4, expected_cycle_version: "${cyc_v}" }
              as: Provost
              as_user_id: "provost-proposer"
              captures: { dec_id: $.data.id }
          assert:
            - "before the first trigger call: AcademicProgram.${prog_id}.cost_per_credit_hour_rolling_cents == 50000, composite_score == 40.00, viability_band == IMPROVEMENT_ELIGIBLE"
            - "the first trigger call returns 422 with error_id ERR_OUTCOME_NOT_SUPPORTED_BY_VIABILITY"
            - "after the refusal ReviewCycle.${cycle_id}.state is still RESPONSE_SUBMITTED and no DecisionRecord exists on the cycle"
            - "after the fourth snapshot the rolling window is terms 2, 3 and 4: cost_per_credit_hour_rolling_cents == 50042 and cost_per_credit_hour_latest_cents == 50126"
            - "after the fourth snapshot AcademicProgram.${prog_id}.composite_score == 39.99 and viability_band == NONVIABLE — a 0.084 percent cost increase moved the score by 0.01"
            - "the second trigger call returns 201 and DecisionRecord.${dec_id}.state == PROPOSED"
            - "DecisionRecord.${dec_id}.composite_score_at_proposal == 39.99 and viability_band_at_proposal == NONVIABLE"
            - "ReviewCycle.${cycle_id}.state == DECISION_PROPOSED"

      - name: empty_cohort_activation_auto_completes_at_zero_open_students
        grounds:
          - state_machines.TeachOutPlan.APPROVED_to_IN_EFFECT
          - state_machines.TeachOutPlan.IN_EFFECT_to_COMPLETED
          - calculations.teach_out_seat_ledger
        distinguishing_aspect: |
          open_student_count == 0 is the degenerate boundary of the bubble-up
          rule. ACTIVATE on a plan with no displaced students must land in
          IN_EFFECT and then immediately auto-transition to COMPLETED inside the
          same request, carrying the program to DISCONTINUED and CATALOG_WITHDRAWN
          with no student write ever occurring. An implementation that only fires
          the bubble-up from a student write leaves the plan stuck in IN_EFFECT.
        test_recipe:
          setup:
            - "Program HIST-BA driven to an EFFECTUATED DISCONTINUATION decision with an APPROVED TeachOutPlan that has one course guarantee for term 4 and zero displaced students."
            - "With no students the plan's required_seat_total is 0, so seat_shortfall and at_risk_student_count are both 0 and APPROVE succeeds; open_student_count is 0 at activation time."
            - "Both AUTO_MINTED notices are sent and acknowledged before effectuation; no faculty appointments exist, so deferred_fte is 0.00."
            - "The clock is at 2026-09-15T10:00:00Z from the ratification onwards."
