            - { call: "POST /volunteer-ops/supply-inventories", payload: { event_id: "${ev}", item_code: "SAFETY_VEST", description: "Vest", quantity_total: 1 }, as: VolunteerCoordinator, captures: { inv: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
