        grounds:
          - validations[priority=15]
          - errors[ERR_CAPACITY_EXCEEDED]
          - entities.Provider.fields.capacity_slots
        distinguishing_aspect: "With capacity_slots 1 and one ENROLLED child, a second enrollment returns ERR_CAPACITY_EXCEEDED at HTTP 409 and creates no row."
        test_recipe:
          setup:
            - "Provider P1 ACTIVE with capacity_slots 1 and one private enrollment CH-1."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 1 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["ENROLLMENT"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-1", family_name: "Alvarez", days_per_week: 5, private_monthly_tuition_cents: 90000, subsidy_certified: false, start_on: "2026-08-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-2", family_name: "Brody", days_per_week: 5, private_monthly_tuition_cents: 90000, subsidy_certified: false, start_on: "2026-08-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CAPACITY_EXCEEDED with HTTP 409"
            - "GET /fccn/enrollments with provider_id ${p1} returns total_count == 1"
            - "Provider.${p1}.projected_monthly_revenue_cents unchanged at 90000"

      - name: enrollment_one_below_capacity_succeeds
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=15]
          - entities.Provider.fields.capacity_slots
          - endpoints[POST /fccn/enrollments]
        distinguishing_aspect: "The capacity rule is strict-less-than on the count BEFORE the insert: with capacity_slots 2 and one ENROLLED child, the second enrollment is accepted with HTTP 201 and no error."
        test_recipe:
          setup:
