              captures: { p1: $.data.id }
            - call: "POST /hail-ops/permits/${p1}/decision"
              payload: { decision: "APPROVE", valid_from: "2026-08-01", valid_to: "2026-09-30" }
              as: PermitOfficer
            - call: "POST /hail-ops/permits"
              payload: { facility_id: "${fac}", permit_type: "ZONING_USE", issuing_jurisdiction: "City of Wichita" }
              as: CatastropheDirector
              captures: { p2: $.data.id }
            - call: "POST /hail-ops/permits/${p2}/decision"
              payload: { decision: "APPROVE", valid_from: "2026-08-01", valid_to: "2026-09-30" }
              as: PermitOfficer
            - call: "POST /hail-ops/technicians"
              payload: { full_name: "Tara Alvarez", home_state_code: "TX", license_state_code: "KS", license_expires_at: "2027-01-31", skill_tier: "MASTER", flat_split_pct: 0.45 }
              as: CrewCoordinator
              captures: { tech_a: $.data.id }
            - call: "POST /hail-ops/technicians"
              payload: { full_name: "Iris Tran", home_state_code: "KS", license_state_code: "KS", license_expires_at: "2027-12-31", skill_tier: "JOURNEYMAN", flat_split_pct: 0.35 }
              as: CrewCoordinator
              captures: { tech_i: $.data.id }
            - call: "POST /hail-ops/crew-deployments"
              payload: { technician_id: "${tech_a}", facility_id: "${fac}", start_date: "2026-08-05", end_date: "2026-09-15" }
              as: CrewCoordinator
              captures: { dep_a: $.data.id }
            - call: "POST /hail-ops/crew-deployments/${dep_a}/status"
              payload: { to_status: "ON_SITE" }
              as: CrewCoordinator
            - call: "POST /hail-ops/crew-deployments"
              payload: { technician_id: "${tech_i}", facility_id: "${fac}", start_date: "2026-08-05", end_date: "2026-09-15" }
              as: CrewCoordinator
              captures: { dep_i: $.data.id }
            - call: "POST /hail-ops/crew-deployments/${dep_i}/status"
              payload: { to_status: "ON_SITE" }
              as: CrewCoordinator
            - call: "POST /hail-ops/facilities/${fac}/commission"
              payload: {}
              as: CatastropheDirector
            - call: "POST /hail-ops/storm-events/${ev}/activate"
              payload: {}
              as: CatastropheDirector
            - call: "POST /hail-ops/insurers"
              payload: { name: "Prairie Mutual", naic_code: "18021", direct_bill_enabled: true }
              as: CatastropheDirector
              captures: { ins: $.data.id }
            - call: "POST /hail-ops/rate-agreements"
              payload: { insurer_id: "${ins}", storm_event_id: "${ev}", effective_from: "2026-08-01", matrix_rate_dime_cents: 2213, matrix_rate_nickel_cents: 3012, matrix_rate_quarter_cents: 4202, matrix_rate_half_dollar_cents: 5611, labor_rate_cents_per_hour: 6500, panel_cap_cents: 140000, admin_fee_pct: 0.05, admin_fee_cap_cents: 25000, supplement_auto_approve_pct: 0.10, rental_cap_days: 10, rental_daily_rate_cents: 4500 }
              as: CatastropheDirector
              captures: { ra: $.data.id }
            - call: "GET /hail-ops/insurers/${ins}"
              payload: {}
              as: CatastropheDirector
              captures: { ins_v: $.data.version }
            - call: "POST /hail-ops/rate-agreements/${ra}/activate"
              payload: { expected_insurer_version: "${ins_v}" }
              as: CatastropheDirector
            - call: "POST /hail-ops/vehicles"
              payload: { facility_id: "${fac}", insurer_id: "${ins}", vin: "1HGCM82633A004352", model_year: 2021, make: "Honda", model: "Accord", acv_cents: 2450000, owner_name: "D. Reyes", rental_required: false }
              as: IntakeAdvisor
              captures: { veh: $.data.id }
            - call: "POST /hail-ops/damage-lines"
              payload: { vehicle_id: "${veh}", panel_code: "HOOD", dent_count: 42, dent_size_class: "NICKEL", aluminum: false, conventional_labor_hours: 8.0, conventional_paint_materials_cents: 25000, r_and_i_hours: 0 }
              as: IntakeAdvisor
            - call: "POST /hail-ops/vehicles/${veh}/estimate"
              payload: {}
              as: ShopEstimator
            - call: "POST /hail-ops/vehicles/${veh}/triage"
              payload: {}
              as: ShopEstimator
            - call: "POST /hail-ops/vehicles/${veh}/billing"
              payload: { action: "AUTHORIZE" }
              as: InsurerAdjuster
              as_user_id: "${ins}"
            - call: "POST /hail-ops/vehicles/${veh}/start-repair"
              payload: {}
              as: ShopEstimator
            - call: "POST /hail-ops/work-tickets"
              payload: { vehicle_id: "${veh}", technician_id: "${tech_a}", labor_units: 3.0, dents_repaired: 42, panels_worked: 1 }
              as: PdrTechnician
              as_user_id: "${tech_a}"
              captures: { wt: $.data.id }
            - call: "POST /hail-ops/work-tickets/${wt}/submit"
              payload: {}
              as: PdrTechnician
              as_user_id: "${tech_a}"
          trigger:
            - call: "POST /hail-ops/quality-inspections"
              payload: { vehicle_id: "${veh}", inspector_technician_id: "${tech_i}", result: "PASS" }
              as: QualityInspector
              as_user_id: "${tech_i}"
              captures: { qi_result: $.data.result }
            - call: "GET /hail-ops/work-tickets/${wt}"
              payload: {}
              as: CrewCoordinator
              captures: { paid_flat: $.data.payable_flat_cents }
            - call: "GET /hail-ops/technicians/${tech_a}"
              payload: {}
              as: CrewCoordinator
              captures: { accrued: $.data.accrued_pay_cents }
            - call: "GET /hail-ops/facilities/${fac}/throughput-summary"
              payload: {}
              as: CatastropheDirector
              captures: { ready_now: $.data.vehicles_ready }
          assert:
            - "the inspection returns 201 with ${qi_result} == PASS, data.rework_index == 0 and data.defect_panel_codes == []"
            - "the same response's cascade is already durable: Vehicle.${veh}.repair_status == READY with rework_count == 0"
            - "${paid_flat} == 19058, WorkTicket.${wt}.payable_pooled_cents == 21175, pay_model_applied == FLAT, payable_cents == 19058 and status == APPROVED"
            - "${accrued} == 19058 and Technician.${tech_a}.approved_ticket_count == 1 on the FIRST read after the PASS — no second write is needed to refresh it"
            - "Technician.${tech_i}.accrued_pay_cents == 0 and approved_ticket_count == 0 — the inspector earns nothing"
            - "${ready_now} == 1 with staging_slots_occupied == 1, vehicles_in_repair == 0 and released_count == 0"
            - "the clock is still 2026-08-05T08:00:00Z, so none of these values depend on time passing"

  - section: errors
    instances:
      - name: error_segregation_of_duties_on_quality_inspection
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES]
        excluded_because:
          difficulty_instance: qc_segregation_of_duties_beats_inspector_not_deployed
          rationale: "That §1.8 instance asserts the 403 as its primary observable, including its precedence over ERR_INSPECTOR_NOT_DEPLOYED."

      - name: error_technician_deployment_overlap_on_crew_deployment
        claim_type: violation_to_error
        grounds:
          - errors[ERR_TECHNICIAN_DEPLOYMENT_OVERLAP]
        excluded_because:
          difficulty_instance: technician_overlap_beats_housing_bed_capacity
          rationale: "Asserted as the winning error of that §1.8 priority-conflict instance, with the rest-buffer boundary asserted by rest_buffer_day_rejects_adjacent_deployment_intervals_per_technician."

      - name: error_housing_capacity_exceeded_on_crew_deployment
        claim_type: violation_to_error
        grounds:
          - errors[ERR_HOUSING_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: technician_overlap_beats_housing_bed_capacity
          rationale: "That §1.8 instance asserts the same call returning ERR_HOUSING_CAPACITY_EXCEEDED once the overlap is removed; housing_half_open_interval_allows_same_day_bed_handover asserts the passing side."

      - name: error_rework_limit_exceeded_on_start_repair
        claim_type: violation_to_error
        grounds:
          - errors[ERR_REWORK_LIMIT_EXCEEDED]
        excluded_because:
          difficulty_instance: vehicle_rework_cycle_returns_to_in_repair_and_resets_on_retriage
          rationale: "The third failed inspection's ERR_REWORK_LIMIT_EXCEEDED and the re-triage reset are both asserted inside that §1.8 cycle instance."

      - name: error_supplement_round_limit_on_review_and_revise
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SUPPLEMENT_ROUND_LIMIT]
        excluded_because:
          difficulty_instance: supplement_counter_revise_negotiation_cycle_hits_round_limit
          rationale: "The round-3 COUNTER and REVISE rejections are the asserted terminus of that §1.8 negotiation cycle."

      - name: error_facility_posture_blocked_on_start_repair
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FACILITY_POSTURE_BLOCKED]
        excluded_because:
          difficulty_instance: lazy_permit_expiry_suspends_the_facility_then_a_replacement_permit_restores_it
          rationale: "The FROZEN posture rejection and its recovery are asserted there against the lazily expired permit."

      - name: error_direct_bill_not_enabled_on_authorize
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DIRECT_BILL_NOT_ENABLED]
        excluded_because:
          difficulty_instance: carrier_direct_bill_flag_decides_authorization_and_repair_start
          rationale: "Asserted as the flag-off branch of that §1.8 conditional-flag instance."

      - name: error_invalid_vehicle_billing_state_on_void_authorization
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_VEHICLE_BILLING_STATE]
        excluded_because:
          difficulty_instance: void_authorization_restores_facility_and_insurer_ledgers_to_zero
          rationale: "The second VOID_AUTHORIZATION against an already UNBILLED vehicle is asserted there; the §1.9 instance billing_actions_are_bound_to_their_own_role_in_both_directions adds the PAID-state variant."

      - name: error_facility_not_commissioned_on_vehicle_intake
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FACILITY_NOT_COMMISSIONED]
        excluded_because:
          difficulty_instance: vehicle_intake_unlocks_only_after_the_last_permit_commissions_the_facility
          rationale: "Intake against a SETUP facility is asserted there as the pre-commissioning rejection."

      - name: error_event_closeout_blocked_on_close
        claim_type: violation_to_error
        grounds:
          - errors[ERR_EVENT_CLOSEOUT_BLOCKED]
        excluded_because:
          difficulty_instance: demobilization_cascade_ends_deployments_and_releases_housing
          rationale: "Closeout with a non-terminal, unsettled vehicle is asserted there, and the §1.9 instance demobilize_and_close_blocked_until_vehicles_are_terminal_and_settled re-asserts it from the state-machine side."

      - name: error_no_commissioned_facility_on_event_activation
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NO_COMMISSIONED_FACILITY]
        excluded_because:
          difficulty_instance: vehicle_intake_unlocks_only_after_the_last_permit_commissions_the_facility
          rationale: "Activation before any facility is commissioned is asserted there; the §1.9 instance event_activation_blocked_until_a_facility_is_commissioned repeats it as the state-machine guard."
